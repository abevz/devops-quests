apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: stationboards.training.devops-quests.local
spec:
  group: training.devops-quests.local
  scope: Namespaced
  names:
    plural: stationboards
    singular: stationboard
    kind: StationBoard
  versions:
  - name: v1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - route
            properties:
              route:
                type: string
                enum:
                - closed
                - north-116
          status:
            type: object
            properties:
              observedGeneration:
                type: integer
                format: int64
              ready:
                type: boolean
