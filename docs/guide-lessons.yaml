      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh`, luego `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Der Status bindet Ressourcenadressen an verwaltete Objektidentitäten. Ein normaler plan vergleicht Konfiguration, Status und aktualisierte Objekte. Das Bearbeiten der Datei außerhalb von OpenTofu führt zu Abweichungen. Durch Anwenden des überprüften plan wird der declared-Inhalt wiederhergestellt.


      Vergleichen Sie bei teilweisem State-Verlust Lineage, Ressourcen und Identitäten in Sicherung und aktivem State. Ein Checkpoint kann eine gültige ältere Version einer Ressource mit neuerer Bindung enthalten. Vergleichen Sie die wiederhergestellte Identität beim Produzenten und bei jedem unabhängigen Verbraucher.


      Vergleichen Sie Lineage, Serial und Ressourcenbindungen im älteren Checkpoint und im aktuellen State. Ein vollständiger Ersatz kann spätere Änderungen verwerfen. Bewahren Sie die vertrauenswürdige Kopie auf und sichern Sie den aktuellen State vor Änderungen. Prüfen Sie die vorgeschlagenen Änderungen im Plan.


      Eine Erzeugerausgabe ist eine aktuelle Schnittstelle, keine automatische Lieferung an andere Systeme. Vergleiche ihre typisierten Werte und dauerhafte Operationsidentität mit jedem unabhängig verwalteten Verbraucher. Eine bekannte Release-Bezeichnung oder gleiche Dateibytes allein unterscheiden keinen veralteten Export. Verschiedene Ziele können verschiedene Einträge erhalten; prüfe tatsächliche entfernte Dateien und Modi, neu geladene Antworten und Umgebungen laufender Prozesse statt nur Manifeste. Ein unveränderter Infrastrukturplan sagt nichts über die weitere Lieferung. Prüfe mit nicht angewendeten Plänen für andere Eingaben, ob veröffentlichte Ausgaben dem Aufrufer folgen. Prüfe beim Abschluss Erzeuger und frühere Verbraucher erneut. Diese Prüfungen belegen aktuelle Übereinstimmung, nicht die dafür ausgeführten Befehle.


      Beginne in Aufgabe 030 mit `main.tf` und stelle die verwaltete `release.txt` mit Inhalt `release-30` wieder her. Prüfe, dass `local_file.release` im State steht und ein neuer Plan keine Änderungen enthält. Untersuche erst danach den Reader: Seine Umgebung `RELEASE` muss zum Marker passen und der Rollout bereit werden.


      ### Ursprüngliche Container-ID und State {#original-container-state}


      In Aufgabe 026 hält `original-id` die Identität des vorhandenen Containers `rail-worker` fest. Importiere diese ID nach `docker_container.worker` und setze den Container anschließend fort: Import ergänzt die State-Bindung, startet aber keinen pausierten Prozess erneut. Prüfe die State-Adresse, vergleiche die aktuelle Docker-ID und die Ressourcen-ID aus `tofu show -json` mit `original-id` und stelle sicher, dass der Container läuft und nicht pausiert ist. Diese Vergleiche beschreiben die aktuelle Identität, nicht ihre gesamte Geschichte. Die Prüfung kann vor einem Identitäts- oder State-Ergebnis abbrechen, wenn Python am Arbeitsplatz nicht startet.


      ### Verwaltete Release-Datei und Ausgabe {#release-artifact-production}


      In Aufgabe 020 erzeugt die erste Phase das verwaltete Artefakt `release.txt` und die Root-Ausgabe `release`. Vergleiche Datei und Ausgabe mit `release-20`, prüfe `local_file.release` im State und Exit-Code 0 eines detaillierten Plans, bevor du das Artefakt in der Fleet-Phase verwendest. Eine korrekte Datei allein bestätigt weder die State-Bindung noch die Ausgabe. Die Prüfung liest die Daten der angewendeten Ressource. Falls sie ohne State-Ergebnis abbricht, prüfen Sie, ob Python auf dem Arbeitsplatz startet.


      ### State und laufender Container {#container-state-runtime}


      In Aufgabe 006 deklariert `main.tf` bereits `docker_container.worker` mit dem Namen `rail-worker`. Wende die Konfiguration in der privaten Umgebung an und vergleiche `tofu state list` mit `docker inspect rail-worker --format ''{{.State.Running}}''`: Der Zustand muss `docker_container.worker` enthalten und Docker muss `true` melden. Eine Adresse im Zustand allein beweist nicht, dass der Container läuft.


      ### Ressourcenbindung im State {#notice-state}


      In Aufgabe 009 werden die Deklaration von `local_file.notice` in `main.tf`, die Datei auf dem Datenträger und die State-Bindung getrennt beobachtet. Prüfen Sie die Adresse mit `tofu state list`. Die Datei kann auch ohne Eintrag im State existieren.


      ### Hinweis außerhalb von OpenTofu bearbeitet {#notice-drift}


      Bei dieser Aufgabe wurde `notice.txt` manuell bearbeitet. In `main.tf` steht weiterhin `north-ready`. Prüfen Sie `tofu plan` und wenden Sie dann die Konfiguration an, um die Abweichung zu beheben. Prüfen Sie das Ergebnis mit `cat notice.txt`.


      ### Ausstehende Änderungen prüfen {#notice-plan}


      Bei fehlender State-Bindung oder verändertem Inhalt der verwalteten Datei kann der Plan ausstehende Änderungen anzeigen. Führen Sie danach `tofu plan -input=false -detailed-exitcode -no-color` aus. Erwartet werden Exitcode 0 und keine ausstehenden Änderungen.


      ### Verwaltetes Release und typisierte Ausgabe {#release-output-contract}


      In Aufgabe 016 behalte `local_file.release` und den Dateiinhalt `north-r16` bei. Ändere die Root-Ausgabe `release` von einer Zeichenkette zu einem Objekt mit `route = "north"`, numerischem `revision = 16` und `targets = ["app1", "app2", "app3"]`. Wende die Änderung an und prüfe `tofu output -json release`: JSON muss die Zahl und das Array erhalten. Prüfe `release.txt`, `local_file.release` im Zustand und Exit-Code 0 des abschließenden detaillierten Plans.


      ### Verwaltete relay-Version {#relay-release-state}


      In Quest 030 deklariert main.tf zunächst veralteten Inhalt. Verwende approved-release.txt als Quelle für release.txt und wende die geprüfte Konfiguration an. Eine von Hand erstellte Datei reicht nicht: tofu show -json muss eine verwaltete local_file-Ressource mit einem filename für diese Datei zeigen. Fehlender oder unlesbarer State oder eine fehlende Datei verhindern diese Beobachtung. Ohne State-Diagnose prüfe, ob die Workstation nach ~/quest wechseln und Python starten kann.


      ### Release-Plan ohne Änderungen {#relay-clean-plan}


      In Quest 030 muss tofu plan -input=false -detailed-exitcode -no-color mit 0 enden. Code 2 bedeutet geplante Änderungen: prüfe sie und wende die gewünschte Release-Konfiguration an. Code 1 bedeutet einen Planungsfehler: lies die Meldung zu Konfiguration, Provider oder State. Richtiger Dateiinhalt allein beweist keinen Plan ohne Änderungen.


      ### Ursprünglicher north Output {#recovery-original-north-output}


      Der Output fehlt möglicherweise oder verweist auf eine neu angelegte north Datei; erhalten Sie die ursprüngliche Provider-ID aus dem eingefrorenen Nachweis. Der ältere Checkpoint enthält guardian, aber nicht die spätere progress Operation. Der neuere Teil-State erhält progress, hat aber die guardian Bindung verloren. Stellen Sie nur diese Bindung wieder her und erhalten Sie Backup vor Wiederherstellung und Plan vor apply. `tofu output -raw north_id`.


      ### Vorhandene Datei erhalten {#recovery-existing-north-content}


      Das vorhandene north.txt wurde möglicherweise geändert oder ist unlesbar; vergleichen Sie den Inhalt vor State-Änderungen mit der gelieferten Konfiguration. Der ältere Checkpoint enthält guardian, aber nicht die spätere progress Operation. Der neuere Teil-State erhält progress, hat aber die guardian Bindung verloren. Stellen Sie nur diese Bindung wieder her und erhalten Sie Backup vor Wiederherstellung und Plan vor apply. `test "$(cat north.txt)" = north-71`.


      ### Fehlende Datei anlegen {#recovery-missing-south-content}


      Die gelieferte Konfiguration ergänzt south.txt ohne apply; die Datei fehlt oder weicht ab, bis der Wiederherstellungsplan die deklarierte Route anlegt. Der ältere Checkpoint enthält guardian, aber nicht die spätere progress Operation. Der neuere Teil-State erhält progress, hat aber die guardian Bindung verloren. Stellen Sie nur diese Bindung wieder her und erhalten Sie Backup vor Wiederherstellung und Plan vor apply. `test "$(cat south.txt)" = south-71`.


      ### Eine Bindung und neueren Fortschritt erhalten {#recovery-merge-old-binding-with-new-progress}


      Ein erneutes apply kann guardian neu anlegen, der gesamte alte Checkpoint verwirft progress; stellen Sie nur die fehlende Bindung unter Erhalt beider Operations-IDs wieder her. Fehlgeschlagenes tofu show oder ungültiges JSON ergibt ebenfalls diese Diagnose. Der ältere Checkpoint enthält guardian, aber nicht die spätere progress Operation. Der neuere Teil-State erhält progress, hat aber die guardian Bindung verloren. Stellen Sie nur diese Bindung wieder her und erhalten Sie Backup vor Wiederherstellung und Plan vor apply. `tofu state list; jq .bindings /run/dq/facts/0/state-identities.json`.


      ### Beide verwalteten Routendateien {#recovery-two-managed-route-targets}


      Die übrigen State-Einträge zeigen möglicherweise auf andere Dateien oder doppelte Routen; nach Erhalt beider Companions ist je ein managed local_file für north.txt und south.txt erforderlich. Der ältere Checkpoint enthält guardian, aber nicht die spätere progress Operation. Der neuere Teil-State erhält progress, hat aber die guardian Bindung verloren. Stellen Sie nur diese Bindung wieder her und erhalten Sie Backup vor Wiederherstellung und Plan vor apply. `tofu show -json | jq ''.values.root_module.resources[] | {address,type,filename:.values.filename}''`.


      ### Operations-Companions nicht ersetzen {#recovery-plan-preserves-companion-identities}


      Fehlendes/veraltetes recovery-plan.json oder ein Plan mit ersetztem Companion erhält abgeschlossene Arbeit nicht; exportieren Sie nach Bindungswiederherstellung und halten Sie beide Companions mit ursprünglichen IDs auf no-op. Der ältere Checkpoint enthält guardian, aber nicht die spätere progress Operation. Der neuere Teil-State erhält progress, hat aber die guardian Bindung verloren. Stellen Sie nur diese Bindung wieder her und erhalten Sie Backup vor Wiederherstellung und Plan vor apply. `jq -r ''.resource_changes[] | [.address,(.change.actions|join(","))] | @tsv'' recovery-plan.json`.


      ### Inventar des gespeicherten Plans {#recovery-plan-route-inventory}


      Ein zusätzlicher Routeneintrag verletzt das Inventar des gespeicherten Plans; das Artefakt beschreibt zwei Routen und zwei erhaltene Operations-Companions. Der ältere Checkpoint enthält guardian, aber nicht die spätere progress Operation. Der neuere Teil-State erhält progress, hat aber die guardian Bindung verloren. Stellen Sie nur diese Bindung wieder her und erhalten Sie Backup vor Wiederherstellung und Plan vor apply. `jq ''.resource_changes | length'' recovery-plan.json`.


      ### Ursprüngliche Route unverändert erhalten {#recovery-plan-existing-route-no-op}


      Der gespeicherte Plan ersetzt/ändert möglicherweise north.txt oder verwendet eine andere ID; erhalten Sie den bestehenden Routeneintrag als no-op mit eingefrorener Provider-Identität. Der ältere Checkpoint enthält guardian, aber nicht die spätere progress Operation. Der neuere Teil-State erhält progress, hat aber die guardian Bindung verloren. Stellen Sie nur diese Bindung wieder her und erhalten Sie Backup vor Wiederherstellung und Plan vor apply. `jq ''.resource_changes[] | select(.type=="local_file") | {address,change}'' recovery-plan.json`.


      ### Plan vor Anwendung erhalten {#recovery-plan-only-missing-route-create}


      Das Artefakt wurde möglicherweise nach apply exportiert, sodass south.txt no-op ist, oder die Route fehlt; erhalten Sie den vor apply gespeicherten Plan zum Anlegen von south.txt. Der ältere Checkpoint enthält guardian, aber nicht die spätere progress Operation. Der neuere Teil-State erhält progress, hat aber die guardian Bindung verloren. Stellen Sie nur diese Bindung wieder her und erhalten Sie Backup vor Wiederherstellung und Plan vor apply. `jq ''.resource_changes[] | select(.type=="local_file") | {address,change}'' recovery-plan.json`.


      ### Checkpoint und neueres Teil-Backup {#recovery-trusted-checkpoint-and-partial-backup}


      Überschreiben des vertrauenswürdigen Checkpoints oder ein Backup nach Wiederherstellung verliert Nachweise; erhalten Sie Checkpoint-Bytes und den neueren Teil-State mit ursprünglicher lineage, serial und Objekt-IDs. Der ältere Checkpoint enthält guardian, aber nicht die spätere progress Operation. Der neuere Teil-State erhält progress, hat aber die guardian Bindung verloren. Stellen Sie nur diese Bindung wieder her und erhalten Sie Backup vor Wiederherstellung und Plan vor apply. `sha256sum recovery-checkpoint.tfstate; jq ''{lineage,serial}'' before-recovery.tfstate`.


      ### Abschlussplan ohne Änderungen {#recovery-final-converged-plan}


      Nicht angewandte Konfiguration, Datei-Drift oder Planfehler lassen den Abschlussplan ungleich null enden; prüfen Sie vorgeschlagene Änderungen nach Anwendung des erhaltenen Wiederherstellungsplans. Der ältere Checkpoint enthält guardian, aber nicht die spätere progress Operation. Der neuere Teil-State erhält progress, hat aber die guardian Bindung verloren. Stellen Sie nur diese Bindung wieder her und erhalten Sie Backup vor Wiederherstellung und Plan vor apply. `tofu plan -input=false -detailed-exitcode -no-color`.


      ### State-Beobachtung starten {#recovery-state-helper-startup}


      Der State-Observer kann vor Bindungsprüfung scheitern, etwa beim Start von tofu oder Helper-Imports; normaler Fehlercode/ungültiges tofu JSON ergibt recovery_bindings. Der ältere Checkpoint enthält guardian, aber nicht die spätere progress Operation. Der neuere Teil-State erhält progress, hat aber die guardian Bindung verloren. Stellen Sie nur diese Bindung wieder her und erhalten Sie Backup vor Wiederherstellung und Plan vor apply. `command -v tofu; python3 -I -c "import dq_check"`.


      ### Plan-Beobachtung starten {#recovery-plan-helper-startup}


      Der Plan-Observer kann vor einem spezifischen Marker bei Imports oder unerwarteter Artefaktstruktur scheitern; normal fehlendes/ungültiges recovery-plan.json ergibt recovery_binding_plan. Der ältere Checkpoint enthält guardian, aber nicht die spätere progress Operation. Der neuere Teil-State erhält progress, hat aber die guardian Bindung verloren. Stellen Sie nur diese Bindung wieder her und erhalten Sie Backup vor Wiederherstellung und Plan vor apply. `python3 -I -c "import dq_check"; test -s recovery-plan.json`.


      ## Probieren Sie es aus


      Öffnen Sie das **opentofu Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Aktualisiert das Bearbeiten der verwalteten Datei die HCL-Deklaration?


      ```bash

      cd ~/lab/examples/state

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Der nächste plan schlägt eine Versöhnung vor; apply stellt declared wieder her.


      ## Beobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-state
terraform-4:
  profile: opentofu
  example: locking
  source_hash: b9df92e00fff79ff48c352b025e24c1f9c551057ff34acf313faa6106976d9cb
  content:
    en: 'A state lock prevents competing writers to one state. It is separate from Git locking and cloud resource permissions. This experiment uses the local backend; S3 authentication, remote locking and cloud recovery remain an additional AWS practicum.


      A lock coordinates writers to one state; it does not make an old snapshot current or coordinate independent state roots. Each root has its own lineage and serial. Current lock ownership, stored bindings and physical objects are separate observations: an earlier error describes that earlier operation rather than proving present ownership. The local Lab demonstrates contention and bounded waiting; it does not rehearse HTTP-backend recovery or multi-state disaster recovery.


      ## Try it


      Open the **opentofu Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Will the second operation wait forever when -lock-timeout=1s is set?


      ```bash

      cd ~/lab/examples/locking

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Expected result

      > No. It fails to acquire the lock within the timeout. After the first apply finishes, the plan succeeds.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Блокировка state защищает одно состояние от конкурирующих записей. Она не заменяет Git и права на облачные ресурсы. В опыте используется local backend; S3, удалённые блокировки и облачное восстановление остаются дополнительным AWS-практикумом.


      Блокировка координирует запись в один state; она не делает старый снимок актуальным и не координирует независимые корни state. У каждого корня свои lineage и serial. Текущий владелец блокировки, сохранённые привязки и физические объекты — разные наблюдения: старая ошибка описывает прежнюю операцию, а не доказывает текущее владение. Локальная лаборатория показывает конкуренцию и ограниченное ожидание; она не воспроизводит восстановление HTTP backend или нескольких state.


      ## Попробуйте


      Откройте лабораторию **opentofu**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Будет ли вторая операция ждать бесконечно при -lock-timeout=1s?


      ```bash

      cd ~/lab/examples/locking

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Она завершается отказом получения блокировки по таймауту. После первого apply план проходит.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Blokada state uniemożliwia konkurującym zapisom na jednym state. Różni się od blokowania Git i uprawnień do zasobów w chmurze. W tym eksperymencie wykorzystano local backend; Uwierzytelnianie S3, zdalne blokowanie i odzyskiwanie w chmurze pozostają dodatkową praktyką AWS.


      Blokada koordynuje zapis do jednego stanu; nie uaktualnia starej migawki ani nie koordynuje niezależnych stanów. Każda główna konfiguracja ma własne lineage i serial. Bieżący właściciel blokady, zapisane powiązania i fizyczne obiekty to oddzielne obserwacje: wcześniejszy błąd opisuje ówczesną operację, a nie dowodzi bieżącej własności. Lokalne Lab pokazuje rywalizację i ograniczone oczekiwanie; nie ćwiczy odzyskiwania backendu HTTP ani wielu stanów.


      ## Wypróbuj


      Otwórz laboratorium **opentofu** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy druga operacja będzie czekać w nieskończoność po ustawieniu -lock-timeout=1s?


      ```bash

      cd ~/lab/examples/locking

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Nie udało się uzyskać blokady w określonym czasie. Po zakończeniu pierwszego apply plan się powiódł.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Un bloqueo de estado impide que los escritores compitan en un estado. Es independiente del bloqueo Git y de los permisos de recursos en la nube. Este experimento utiliza local backend; La autenticación S3, el bloqueo remoto y la recuperación en la nube siguen siendo una práctica adicional de AWS.


      Un bloqueo coordina escritores de un estado; no actualiza una instantánea antigua ni coordina raíces independientes. Cada raíz tiene su propia lineage y serial. El propietario actual del bloqueo, los vínculos almacenados y los objetos físicos son observaciones distintas: un error anterior describe aquella operación, no demuestra la propiedad actual. El Lab local muestra competencia y espera limitada; no ensaya recuperación de un backend HTTP ni de varios estados.


      ## Pruébalo


      Abra el **opentofu Lab** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿La segunda operación esperará eternamente cuando se configure -lock-timeout=1s?


      ```bash

      cd ~/lab/examples/locking

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. No logra adquirir el bloqueo dentro del tiempo de espera. Una vez finalizado el primer apply, el plan tiene éxito.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh` y luego con `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Eine Statussperre verhindert, dass konkurrierende Autoren in einen Status schreiben. Es ist unabhängig von den Sperr- und Cloud-Ressourcenberechtigungen Git. Dieses Experiment verwendet local backend; S3 Authentifizierung, Fernsperrung und Cloud-Wiederherstellung bleiben ein zusätzliches AWS-Praktikum.


      Eine Sperre koordiniert Schreiber für einen State; sie macht weder alte Snapshots aktuell noch koordiniert sie unabhängige State-Roots. Jeder Root hat eine eigene Lineage und Serial. Aktueller Sperreigentümer, gespeicherte Bindungen und physische Objekte sind getrennte Beobachtungen: Ein früherer Fehler beschreibt die damalige Operation, beweist aber keine aktuelle Eigentümerschaft. Das lokale Lab zeigt Konkurrenz und begrenztes Warten; es übt weder HTTP-Backend-Wiederherstellung noch Multi-State-Disaster-Recovery.


      ## Probieren Sie es aus


      Öffnen Sie das **opentofu Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Wird der zweite Vorgang ewig warten, wenn -lock-timeout=1s festgelegt ist?


      ```bash

      cd ~/lab/examples/locking

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Es gelingt ihm nicht, die Sperre innerhalb des Zeitlimits zu erhalten. Nachdem der erste apply abgeschlossen ist, ist der Plan erfolgreich.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: locking
  additional:
    en: S3 backend configuration is an additional cloud practicum. This Lab demonstrates a real local state lock, not an S3 backend.
    ru: Настройка S3 backend — дополнительный облачный практикум. Здесь проверяется настоящая блокировка локального state; S3 backend не подключён.
    pl: Konfiguracja backendu S3 to dodatkowe ćwiczenie w chmurze. To laboratorium demonstruje rzeczywistą blokadę lokalnego stanu, a nie backend S3.
    es: La configuración de S3 backend es una práctica adicional en la nube. Este laboratorio demuestra un bloqueo de estado local real, no un S3 backend.
    de: Die S3 backend-Konfiguration ist ein zusätzliches Cloud-Praktikum. In diesem Labor wird eine echte lokale Statussperre demonstriert, keine S3 backend.
terraform-6:
  profile: opentofu
  example: lifecycle
  source_hash: 915f361b74f0485df266bdde20ddba305d421f6626faa03520f9c07978a60ccd
  content:
    en: 'Some changes update an object; others replace its identity. triggers_replace forces replacement in this local example, and create_before_destroy changes the ordering. A saved plan records the intended actions before apply.


      ### Protecting the managed notice {#protecting-the-managed-notice}


      In quest 029, restore the declared `north-ready` content of `notice.txt` and protect `local_file.notice` with `prevent_destroy`. Verify the state address and a no-change detailed plan, then inspect the failed destroy plan and its `prevent_destroy` diagnostic. The guard applies while the rule is present; the observed result does not prove that protection was always configured. If the check stops before reporting a condition, check whether Python can start and its required observations are readable. A nonzero plan status alone can come from another error. Check that the refusal names the resource that manages notice.txt.


      In quest 036, changing the managed file name proposes replacement of `local_file.ledger`. Save the proposed plan and export it as `rejected-plan.json` before restoring the intended `ledger.txt` declaration; do not apply the replacement. The JSON resource actions must include both `delete` and `create`. After recovery, verify `ledger.txt` contains `revision-36`, `retired-ledger.txt` is absent, `ledger_id` matches `original-id`, and the final detailed plan exits 0.


      ### Preparing the directory before writing {#preparation-dependency}


      In quest 019, `terraform_data.directory` runs `prepare.sh` to create `work/.prepared`; `terraform_data.marker` runs `write.sh`, which needs that marker before it writes `work/route.txt`. The dependency must point from marker to directory: put `depends_on = [terraform_data.directory]` on `terraform_data.marker`, and remove the opposite dependency. Inspect `tofu graph`, apply, then verify `work/route.txt` contains `north`, `work/.prepared` exists, both addresses are in state, and a final detailed plan exits 0.


      ### Capture the rejected replacement {#ledger-rejected-plan}


      In quest 036, capture the proposed filename replacement before restoring main.tf: save a plan and export it to rejected-plan.json. Its managed local_file change must have before.filename resolving to ledger.txt, before.id matching nonempty original-id, and both create and delete actions. A plan saved after repair may contain no replacement. Missing, unreadable or malformed inputs also fail; verify Python and dq_check if the observer cannot start. Do not apply the rejected plan.


      ### Retain the intended ledger path {#ledger-retained-files}


      In quest 036, restore the declaration to ledger.txt with revision-36 and inspect both paths. Applying the rejected filename can remove the intended ledger and create retired-ledger.txt; a leftover unwanted file also violates the retained-path condition. A correct saved plan does not prove that current file content or absence is correct. Read ledger.txt and inspect retired-ledger.txt separately.


      ### Compare the recorded ledger ID {#ledger-recorded-output}


      In quest 036, compare tofu output -raw ledger_id with original-id after recovery. The output comes from applied state; changed file content or stale output state can cause a mismatch. Resolve output and record-read errors first. Preserve the supplied record instead of replacing it with the current result; matching this ID is one observation, alongside the retained file paths and content.


      ### A clean recovery plan {#ledger-recovery-plan}


      In quest 036, the historical rejected-plan.json and the final current plan have different purposes. Run tofu plan -input=false -detailed-exitcode -no-color visibly after recovery: exit 0 means no changes, exit 2 means pending changes, and exit 1 means a planning error. Review the remaining filename change or reported configuration, provider or state error without applying the rejected plan.


      ## Try it


      Open the **opentofu Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Does create_before_destroy preserve the old resource ID?


      ```bash

      cd ~/lab/examples/lifecycle

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The plan orders create before delete, and the final ID changes.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Одни изменения обновляют объект, другие заменяют его идентичность. Здесь triggers_replace требует замены, create_before_destroy меняет порядок. Сохранённый plan позволяет проверить действия до apply.


      ### Защита управляемого уведомления {#protecting-the-managed-notice}


      В квесте 029 восстановите заданное содержимое `north-ready` в `notice.txt` и защитите `local_file.notice` с помощью `prevent_destroy`. Проверьте адрес в state и подробный plan без изменений, затем изучите отказавший destroy plan и сообщение `prevent_destroy`. Защита действует, пока правило присутствует; наблюдаемый результат не доказывает, что оно было настроено всегда. Если проверка завершается до вывода результата, проверьте запуск Python и доступность данных для проверки. Ненулевой код плана может возникнуть при другой ошибке. Проверьте, что отказ называет ресурс, который управляет notice.txt.


      В квесте 036 изменение имени управляемого файла предлагает замену `local_file.ledger`. Сохраните предложенный plan и экспортируйте его в `rejected-plan.json` до восстановления нужного объявления `ledger.txt`; не применяйте замену. Действия ресурса в JSON должны включать `delete` и `create`. После восстановления убедитесь, что `ledger.txt` содержит `revision-36`, `retired-ledger.txt` отсутствует, `ledger_id` совпадает с `original-id`, а итоговый подробный plan завершается с кодом 0.


      ### Подготовка каталога перед записью {#preparation-dependency}


      В квесте 019 `terraform_data.directory` выполняет `prepare.sh`, создающий `work/.prepared`; `terraform_data.marker` выполняет `write.sh`, которому нужен этот маркер перед записью `work/route.txt`. Зависимость должна идти от marker к directory: укажите `depends_on = [terraform_data.directory]` в `terraform_data.marker` и удалите обратную зависимость. Изучите `tofu graph`, примените конфигурацию и убедитесь, что `work/route.txt` содержит `north`, `work/.prepared` существует, оба адреса есть в state и итоговый подробный plan завершается с кодом 0.


      ### Сохранение отвергнутой замены {#ledger-rejected-plan}


      В квесте 036 сохраните предлагаемую замену имени до восстановления main.tf: сохраните план и экспортируйте в rejected-plan.json. Изменение управляемого local_file должно иметь before.filename, указывающий на ledger.txt, before.id, совпадающий с непустым original-id, и действия create и delete. После исправления в плане может не быть замены. Отсутствующие, нечитаемые или неверные данные тоже дают отказ; если наблюдатель не запускается, проверьте Python и dq_check. Не применяйте отвергнутый план.


      ### Сохранение нужного пути ledger {#ledger-retained-files}


      В квесте 036 восстановите декларацию ledger.txt с revision-36 и проверьте оба пути. Применение отвергнутого имени может удалить нужный ledger и создать retired-ledger.txt; оставшийся нежелательный файл также нарушает условие сохранённого пути. Правильный сохранённый план не доказывает текущее содержимое или отсутствие файла. Прочитайте ledger.txt и отдельно проверьте retired-ledger.txt.


      ### Сравнение записанного ID ledger {#ledger-recorded-output}


      В квесте 036 после восстановления сравните tofu output -raw ledger_id с original-id. Выход берётся из применённого state; изменённое содержимое или устаревшее состояние выхода могут дать несовпадение. Сначала устраните ошибки чтения выхода и записи. Сохраните исходную запись, а не заменяйте её текущим результатом; совпадение ID — одно наблюдение наряду с путями и содержимым файлов.


      ### План восстановления без изменений {#ledger-recovery-plan}


      В квесте 036 исторический rejected-plan.json и итоговый текущий план служат разным целям. После восстановления запустите tofu plan -input=false -detailed-exitcode -no-color с видимым выводом: код 0 означает отсутствие изменений, 2 — оставшиеся изменения, 1 — ошибку планирования. Изучите оставшуюся смену имени либо ошибку конфигурации, провайдера или state, не применяя отвергнутый план.


      ## Попробуйте


      Откройте лабораторию **opentofu**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Сохраняет ли create_before_destroy прежний ID ресурса?


      ```bash

      cd ~/lab/examples/lifecycle

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Plan ставит create перед delete, итоговый ID меняется.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Niektóre zmiany aktualizują obiekt; inne zastępują jego tożsamość. triggers_replace wymusza wymianę w tym lokalnym przykładzie, a create_before_destroy zmienia kolejność. Zapisany plan rejestruje zamierzone działania przed apply.


      ### Ochrona zarządzanego pliku {#protecting-the-managed-notice}


      W zadaniu 029 przywróć zadeklarowaną zawartość `north-ready` w `notice.txt` i zabezpiecz `local_file.notice` przez `prevent_destroy`. Sprawdź adres w state i szczegółowy plan bez zmian, a następnie zbadaj nieudany destroy plan i komunikat `prevent_destroy`. Ochrona działa, dopóki reguła istnieje; obserwowany wynik nie dowodzi, że była zawsze skonfigurowana. Jeśli sonda kończy się przed wynikiem, sprawdź uruchamianie Pythona i dostęp do wymaganych danych. Kod planu różny od zera może pochodzić z innego błędu. Sprawdź, czy odmowa wskazuje zasób zarządzający notice.txt.


      W zadaniu 036 zmiana nazwy zarządzanego pliku proponuje zastąpienie `local_file.ledger`. Zapisz proponowany plan i wyeksportuj go do `rejected-plan.json` przed przywróceniem właściwej deklaracji `ledger.txt`; nie stosuj zastąpienia. Działania zasobu w JSON muszą zawierać `delete` i `create`. Po przywróceniu sprawdź, że `ledger.txt` zawiera `revision-36`, `retired-ledger.txt` nie istnieje, `ledger_id` odpowiada `original-id`, a końcowy szczegółowy plan kończy się kodem 0.


      ### Przygotowanie katalogu przed zapisem {#preparation-dependency}


      W zadaniu 019 `terraform_data.directory` uruchamia `prepare.sh`, który tworzy `work/.prepared`; `terraform_data.marker` uruchamia `write.sh`, wymagający tego znacznika przed zapisaniem `work/route.txt`. Zależność musi prowadzić od marker do directory: ustaw `depends_on = [terraform_data.directory]` w `terraform_data.marker` i usuń zależność przeciwną. Sprawdź `tofu graph`, zastosuj konfigurację i upewnij się, że `work/route.txt` zawiera `north`, `work/.prepared` istnieje, oba adresy są w state, a końcowy szczegółowy plan kończy się kodem 0.


      ### Zapis odrzuconego zastąpienia {#ledger-rejected-plan}


      W zadaniu 036 zapisz proponowane zastąpienie nazwy przed przywróceniem main.tf: zapisz plan i wyeksportuj go do rejected-plan.json. Zmiana zarządzanego local_file musi mieć before.filename wskazujące ledger.txt, before.id zgodne z niepustym original-id oraz akcje create i delete. Plan zapisany po naprawie może nie zawierać zastąpienia. Brakujące, nieczytelne lub błędne dane też zawodzą; jeśli obserwator nie startuje, sprawdź Python i dq_check. Nie stosuj odrzuconego planu.


      ### Zachowanie właściwej ścieżki ledger {#ledger-retained-files}


      W zadaniu 036 przywróć deklarację ledger.txt z revision-36 i sprawdź obie ścieżki. Zastosowanie odrzuconej nazwy może usunąć właściwy ledger i utworzyć retired-ledger.txt; pozostawiony niechciany plik też narusza warunek ścieżki. Poprawny zapisany plan nie dowodzi bieżącej treści ani braku pliku. Odczytaj ledger.txt i sprawdź osobno retired-ledger.txt.


      ### Porównanie zapisanego ID ledger {#ledger-recorded-output}


      W zadaniu 036 po naprawie porównaj tofu output -raw ledger_id z original-id. Wynik pochodzi z zastosowanego stanu; zmieniona treść lub stary stan wyniku może powodować różnicę. Najpierw wyjaśnij błędy odczytu wyniku i zapisu. Zachowaj dostarczony zapis zamiast zastępować go bieżącym wynikiem; zgodność ID jest jedną obserwacją obok ścieżek i treści plików.


      ### Plan naprawy bez zmian {#ledger-recovery-plan}


      W zadaniu 036 historyczny rejected-plan.json i końcowy bieżący plan mają inne cele. Po naprawie uruchom tofu plan -input=false -detailed-exitcode -no-color z widocznym wynikiem: kod 0 oznacza brak zmian, 2 oczekujące zmiany, 1 błąd planowania. Sprawdź pozostałą zmianę nazwy albo błąd konfiguracji, dostawcy lub stanu bez stosowania odrzuconego planu.


      ## Wypróbuj


      Otwórz laboratorium **opentofu** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy create_before_destroy zachowuje stary zasób ID?


      ```bash

      cd ~/lab/examples/lifecycle

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. plan zamawia create przed delete, a ostateczne zmiany ID.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Algunos cambios actualizan un objeto; otros reemplazan su identidad. triggers_replace fuerza el reemplazo en este ejemplo local y create_before_destroy cambia el orden. Un plan guardado registra las acciones previstas antes de apply.


      ### Protección del aviso gestionado {#protecting-the-managed-notice}


      En el ejercicio 029, restaura el contenido declarado `north-ready` de `notice.txt` y protege `local_file.notice` con `prevent_destroy`. Comprueba la dirección en state y un plan detallado sin cambios; después inspecciona el plan de destrucción fallido y su mensaje `prevent_destroy`. La protección se aplica mientras exista la regla; el resultado observado no demuestra que siempre estuviera configurada. Si la prueba termina antes de informar de un resultado, comprueba el inicio de Python y el acceso a los datos necesarios. Un código de error del plan puede corresponder a otro problema. Comprueba que el rechazo nombre el recurso que gestiona notice.txt.


      En el ejercicio 036, cambiar el nombre del archivo gestionado propone reemplazar `local_file.ledger`. Guarda el plan propuesto y expórtalo como `rejected-plan.json` antes de restaurar la declaración de `ledger.txt`; no apliques el reemplazo. Las acciones del recurso en JSON deben incluir `delete` y `create`. Tras la recuperación, comprueba que `ledger.txt` contiene `revision-36`, que `retired-ledger.txt` no existe, que `ledger_id` coincide con `original-id` y que el plan detallado final termina con código 0.


      ### Preparación del directorio antes de escribir {#preparation-dependency}


      En el ejercicio 019, `terraform_data.directory` ejecuta `prepare.sh` para crear `work/.prepared`; `terraform_data.marker` ejecuta `write.sh`, que necesita ese marcador antes de escribir `work/route.txt`. La dependencia debe ir de marker a directory: coloca `depends_on = [terraform_data.directory]` en `terraform_data.marker` y elimina la dependencia inversa. Inspecciona `tofu graph`, aplica y comprueba que `work/route.txt` contiene `north`, existe `work/.prepared`, ambas direcciones están en state y el plan detallado final termina con código 0.


      ### Guardar el reemplazo rechazado {#ledger-rejected-plan}


      En el reto 036, guarda el reemplazo de nombre propuesto antes de restaurar main.tf: guarda un plan y expórtalo a rejected-plan.json. El cambio del local_file gestionado debe tener before.filename apuntando a ledger.txt, before.id igual al original-id no vacío y las acciones create y delete. Un plan guardado tras reparar puede no contener reemplazo. Datos ausentes, ilegibles o inválidos también fallan; revisa Python y dq_check si el observador no arranca. No apliques el plan rechazado.


      ### Conservar la ruta prevista {#ledger-retained-files}


      En el reto 036, restaura la declaración ledger.txt con revision-36 e inspecciona ambas rutas. Aplicar el nombre rechazado puede borrar el ledger previsto y crear retired-ledger.txt; un archivo residual también incumple la ruta conservada. Un plan guardado correcto no demuestra el contenido ni la ausencia actuales. Lee ledger.txt e inspecciona retired-ledger.txt por separado.


      ### Comparar el ID registrado {#ledger-recorded-output}


      En el reto 036, compara tofu output -raw ledger_id con original-id tras reparar. La salida procede del estado aplicado; contenido cambiado o estado de salida antiguo puede causar diferencias. Resuelve primero errores de lectura de salida y registro. Conserva el registro suministrado en vez de sustituirlo por el resultado actual; coincidir el ID es una observación junto con rutas y contenido.


      ### Plan de recuperación sin cambios {#ledger-recovery-plan}


      En el reto 036, el rejected-plan.json histórico y el plan actual final tienen funciones distintas. Tras reparar ejecuta tofu plan -input=false -detailed-exitcode -no-color con salida visible: 0 significa sin cambios, 2 cambios pendientes y 1 error de planificación. Revisa el cambio de nombre restante o el error de configuración, proveedor o estado sin aplicar el plan rechazado.


      ## Pruébalo


      Abra el **Laboratorio opentofu** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿create_before_destroy conserva el recurso antiguo ID?


      ```bash

      cd ~/lab/examples/lifecycle

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. Los pedidos plan se crean antes de delete y los cambios finales de ID.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh` y luego con `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Einige Änderungen aktualisieren ein Objekt; andere ersetzen seine Identität. triggers_replace erzwingt in diesem lokalen Beispiel die Ersetzung, und create_before_destroy ändert die Reihenfolge. Ein gespeicherter plan zeichnet die beabsichtigten Aktionen vor apply auf.


      ### Verwalteten Hinweis schützen {#protecting-the-managed-notice}


      Stelle in Aufgabe 029 den deklarierten Inhalt `north-ready` in `notice.txt` wieder her und schütze `local_file.notice` mit `prevent_destroy`. Prüfe die State-Adresse und einen detaillierten Plan ohne Änderungen; untersuche danach den fehlgeschlagenen Destroy-Plan und dessen Meldung `prevent_destroy`. Der Schutz gilt, solange die Regel vorhanden ist; das beobachtete Ergebnis beweist nicht, dass der Schutz immer konfiguriert war. Falls die Prüfung vor einem Ergebnis abbricht, prüfen Sie den Python-Start und den Zugriff auf die benötigten Daten. Ein Fehlerstatus des Plans kann eine andere Ursache haben. Prüfen Sie, ob die Ablehnung die Ressource für notice.txt nennt.


      In Aufgabe 036 schlägt die Änderung des verwalteten Dateinamens den Ersatz von `local_file.ledger` vor. Speichere den vorgeschlagenen Plan und exportiere ihn als `rejected-plan.json`, bevor du die gewünschte Deklaration für `ledger.txt` wiederherstellst; wende den Ersatz nicht an. Die Ressourcenaktionen im JSON müssen `delete` und `create` enthalten. Prüfe nach der Wiederherstellung, dass `ledger.txt` `revision-36` enthält, `retired-ledger.txt` fehlt, `ledger_id` mit `original-id` übereinstimmt und der abschließende detaillierte Plan mit Code 0 endet.


      ### Verzeichnis vor dem Schreiben vorbereiten {#preparation-dependency}


      In Aufgabe 019 führt `terraform_data.directory` das Skript `prepare.sh` aus, das `work/.prepared` erstellt; `terraform_data.marker` führt `write.sh` aus und benötigt diese Markierung, bevor es `work/route.txt` schreibt. Die Abhängigkeit muss von marker zu directory zeigen: Setze `depends_on = [terraform_data.directory]` in `terraform_data.marker` und entferne die umgekehrte Abhängigkeit. Prüfe `tofu graph`, wende die Konfiguration an und stelle sicher, dass `work/route.txt` `north` enthält, `work/.prepared` existiert, beide Adressen im State stehen und der abschließende detaillierte Plan mit Code 0 endet.


      ### Verworfenen Austausch aufzeichnen {#ledger-rejected-plan}


      Zeichne in Quest 036 den vorgeschlagenen Dateinamen-Austausch vor der Reparatur von main.tf auf: speichere einen Plan und exportiere ihn nach rejected-plan.json. Die verwaltete local_file-Änderung braucht before.filename für ledger.txt, before.id passend zur nichtleeren original-id und beide Aktionen create und delete. Ein nach der Reparatur gespeicherter Plan enthält möglicherweise keinen Austausch. Fehlende, unlesbare oder fehlerhafte Eingaben scheitern ebenfalls; prüfe bei Startproblemen Python und dq_check. Wende den verworfenen Plan nicht an.


      ### Gewünschten Ledger-Pfad erhalten {#ledger-retained-files}


      Stelle in Quest 036 die Deklaration ledger.txt mit revision-36 wieder her und prüfe beide Pfade. Anwenden des verworfenen Namens kann den gewünschten Ledger entfernen und retired-ledger.txt erzeugen; auch eine übrig gebliebene unerwünschte Datei verletzt die Pfadbedingung. Ein korrekt gespeicherter Plan beweist keinen aktuellen Dateiinhalt oder Abwesenheit. Lies ledger.txt und prüfe retired-ledger.txt getrennt.


      ### Aufgezeichnete Ledger-ID vergleichen {#ledger-recorded-output}


      Vergleiche in Quest 036 nach der Reparatur tofu output -raw ledger_id mit original-id. Der Output stammt aus angewendetem State; geänderter Dateiinhalt oder veralteter Output-State kann Abweichungen verursachen. Kläre zuerst Output- und Datensatz-Lesefehler. Erhalte den gelieferten Datensatz, statt ihn mit dem aktuellen Ergebnis zu ersetzen; die passende ID ist eine Beobachtung neben Dateipfaden und Inhalt.


      ### Reparaturplan ohne Änderungen {#ledger-recovery-plan}


      In Quest 036 dienen die historische rejected-plan.json und der aktuelle Abschlussplan verschiedenen Zwecken. Führe nach der Reparatur tofu plan -input=false -detailed-exitcode -no-color sichtbar aus: Code 0 bedeutet keine Änderungen, 2 ausstehende Änderungen und 1 einen Planungsfehler. Prüfe die verbleibende Dateinamenänderung oder den Konfigurations-, Provider- beziehungsweise State-Fehler, ohne den verworfenen Plan anzuwenden.


      ## Probieren Sie es aus


      Öffnen Sie das **opentofu Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Behält create_before_destroy die alte Ressource ID bei?


      ```bash

      cd ~/lab/examples/lifecycle

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Die plan-Bestellungen werden vor delete erstellt und die endgültigen ID-Änderungen.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-lifecycle
terraform-7.1:
  profile: opentofu
  example: module
  source_hash: c5a6c2ee9a195ae70c1473c049ce2d6ad68f0a2179f0d96f5b07001b639a4d9a
  content:
    en: 'A module has inputs, internal resources and explicit outputs. The caller passes values through that interface. Keeping all four module files beside the root makes this example runnable without another guide section.


      A shared-module contract crosses caller, producer and consumer boundaries. Inspect all interfaces and existing state before applying a repair. A retained consumer identity is a preservation constraint, while a read-only plan for another caller input tests whether the message actually propagates through both modules. Assert input-derived planned values there; verify computed provider identities only in real applied state. A constant root output can hide a broken contract, so compare managed producer and consumer files too.


      Fan-out can cross a wrapper and a nested implementation. A valid root argument does not create a missing child call or variable contract. Inspect every boundary, then probe more than the default caller value with plans that are not applied. Distinguish instance identity from payload identity: a local_file ID can change when its bytes change, while a separate persistent companion retains the station identity. Preserve original file addresses and companion IDs while reviewing only intended file replacements.


      A dependency graph may need missing consumers and a join to be constructed as well as a cycle removed. Derive required direction from the public dataflow contract, retain resource-backed outputs and verify actual graph reachability. Correct default strings do not establish a connected graph; extra depends_on edges alone do not establish correct values either. Read-only plans for another caller value must carry the new values through managed files and all published output maps. Keep the supplied module implementation unchanged when its behavior is part of the contract.


      Module input/output interfaces describe relationships between callers and reusable components. State binds resource addresses to provider objects. Independent configuration roots can have separate state lineages and serials; a backup from one root does not describe later work in another. Interfaces, identity and state ownership are distinct contracts, and a no-change plan observes managed attributes rather than every application byte. The module Lab practices interfaces and reuse; recovery across independent states with retained physical data is outside its execution scope.


      In quest 098, trace the contract from the managed file to the module output, then to the fleet and ConfigMap consumer. Preserve the original resource ID, check the output reference and empty plan, and verify each live file, mode and response; environment-based Pods need a restart.


      In quest 047, change only the source of `module.station` from `./modules/v1` to `./modules/v2`, leaving `module.depot` on `./modules/v1`. Reinitialize, save a binary plan and export it as `upgrade-plan.json`: each resource action should be `no-op`, and the two recorded module sources should match. After apply, compare state addresses and IDs with the supplied originals, check `north.txt` contains `north-47`, `depot.txt` contains `depot-47`, station release 2 and the SHA-256 of `north.txt`, depot release 1, and verify a final detailed plan exit code 0. The saved JSON shows its contents, not when it was created.


      ### Module address in state {#notice-module}


      For quest 003, the root calls `./modules/notice` as `module.notice`, and the child defines `local_file.notice`. The call label and resource name form the state address. The child declares the same provider source as the root, `registry.terraform.io/hashicorp/local`, so the offline mirror can supply the provider. After initialization and apply, `tofu state list` should include `module.notice.local_file.notice`.


      ### Notice from the station input {#station-notice}


      The root passes `station = "north"` to the child. The resource derives the filename and body from that input, so `cat north.txt` should show `north-ready`. A different input changes the expected file, while a manual edit changes the file without changing the input.


      ### Output across the module boundary {#notice-output}


      The child exports the managed content as `message`. The root has its own output `message` that references `module.notice.message`. After apply, `tofu output -raw message` at the root should show `north-ready`.


      ### Checking the module plan {#notice-module-plan}


      A missing module address can mean the call has not yet been applied. A change to the resource name or file can also leave pending work. Once the expected address is tracked and the live file matches the configuration, `tofu plan -input=false -detailed-exitcode -no-color` should exit with code 0.


      ### Upgrade without address changes {#module-upgrade-addresses}


      The current state addresses differ from original-addresses or cannot be read; a module call or resource address may have changed, extra resources were added, or the saved inventory is missing. `tofu state list; cat original-addresses`.


      ### Retained file identities {#module-upgrade-identities}


      The ids output differs from original-ids.json or is unreadable; file content or resource identity may have changed, outputs may not have been applied, or the saved JSON is missing or invalid. `tofu output -json ids; cat original-ids.json`.


      ### Retained module file content {#module-upgrade-files}


      north.txt is unreadable or does not contain north-47; upgrading module.station may have changed its file content or the managed file has been edited or removed. depot.txt is unreadable or does not contain depot-47; an edit or apply may have changed the file that should remain unchanged with module.depot. `cat north.txt depot.txt`.


      ### Current output contracts {#module-upgrade-current-contracts}


      contracts.station.release is not 2 or cannot be read; module.station may still use modules/v1, initialization may be stale, or the changed outputs have not been applied. contracts.station.checksum does not match sha256(north.txt) or cannot be observed; the output may still be unsupported or stale, or north.txt changed after the apply. contracts.depot.release is not 1 or cannot be read; module.depot may have been upgraded along with module.station or the output configuration no longer retains its old contract. `tofu output -json contracts`.


      ### Saved plan output contracts {#module-upgrade-saved-contracts}


      The saved upgrade-plan.json lacks the required release 2 and current file checksum for module.station; the plan may be missing, invalid, older than the source change or stale after a file edit. The saved upgrade-plan.json does not retain release 1 for module.depot or cannot be read; it may have been generated with both module sources upgraded or from the wrong configuration. `jq ''.planned_values.outputs.contracts.value'' upgrade-plan.json`.


      ### Saved resource actions {#module-upgrade-plan-actions}


      upgrade-plan.json is unreadable or contains resource actions other than no-op; changing resource addresses or file content during the module upgrade can introduce creates, updates or replacements. `jq ''.resource_changes[] | {address,actions:.change.actions}'' upgrade-plan.json`.


      ### Verify the current plan {#module-upgrade-live-plan}


      The live plan did not exit 0; unapplied output changes or drift may remain, or configuration, module initialization or provider errors prevented the plan from running. `tofu plan -input=false -detailed-exitcode -no-color`.


      ### Applied state across module boundaries {#module-chain-applied-state}


      The applied state no longer links the required files in distinct child modules with the retained consumer ID; a different caller value, recreated resources, changed recorded content or unreadable state/path evidence may explain it. Inspect the applied state recursively: north.txt and delivered.txt must be managed local_file resources in different child modules, each recording north-ready. The consumer module must also retain its original terraform_data ID and matching output. The check resolves full paths; matching basenames alone do not establish the contract. State contents are observed separately from a live plan. `tofu show -json`.


      ### Caller plans through both modules {#module-chain-caller-contract}


      A caller plan failed or did not propagate its message through both module boundaries; supplied input/output names and string values may still be broken, or a value was hardcoded instead of forwarded. The protected module contract supplies north and south caller cases. Each temporary plan must expose message and both planned files with the corresponding value, including the caller-named producer file. These alternate plans are never applied; repair the string input and message output boundaries without replacing the retained consumer. `cat module-contract.json; tofu validate`.


      ### Current output and probe inputs {#module-chain-output-observation}


      The current message output is not north-ready or the caller probe stopped before its detailed marker; unapplied or different caller outputs, missing protected inputs, or tool/plan-observation failures may explain it.  `tofu output -raw message`.


      ### No-change live plan {#module-chain-live-plan}


      The live plan did not exit 0; repaired configuration may still need applying, recorded outputs or managed files may drift, or broken module inputs, exports or provider startup may prevent a valid plan.  `tofu plan -input=false -detailed-exitcode -no-color`.


      ### Saved default plan and shared input {#fanout-saved-default-contract}


      The saved default plan does not link both original files to north through local.region, or its evidence is unreadable; missing/stale fanout-plan.json, a hardcoded region or a broken module interface can explain it. The root module fans out through stable depot and junction keys. Reconstruct the wrapper region input and nested notice call, then forward local.region through the root call; transparent local aliases are accepted. The saved default JSON must show north:depot and north:junction at the original file addresses. A copied default literal does not establish that shared dependency. `cat main.tf modules/station/main.tf; cat fanout-plan.json`.


      ### Alternate regional callers {#fanout-alternate-caller-plans}


      A supplied regional caller could not plan, did not reach both original route files or changed an identity companion; a missing wrapper input/child call, default literal, altered companion or unreadable protected/plan data can explain it. The protected region-cases.json supplies north and west. Each fresh read-only plan must propagate its value to both original files while every frozen terraform_data companion remains no-op with its original ID. These alternate plans are not applied. The saved default artifact and fresh caller plans are separate observations. `cat region-cases.json; tofu validate -no-color`.


      ### Retain the pre-apply replacement plan {#fanout-retained-replacement-plan}


      The saved plan does not replace exactly both original route files with only no-op/read actions elsewhere, or is unreadable; saving a new plan after apply, changing instance keys or introducing other changes can invalidate it. Save the default plan and its fanout-plan.json before applying the repaired configuration. Both local_file routes replace their retired content, while the two permanent identity companions stay unchanged. Keep that artifact after apply; a fresh empty live plan serves a different condition. These checks observe retained artifacts and current state rather than proving an exact command history. `cat fanout-plan.json`.


      ### Current original file addresses {#fanout-current-file-addresses}


      Current state does not contain both recorded file addresses or their evidence is unreadable; changed for_each keys, removed nested resources, an edited address list or failed state observation can lose the required instances.  `cat original-addresses; tofu state list`.


      ### Exactly the original files and companions {#fanout-preserved-companion-set}


      The address receipt or exact managed object set differs from the frozen originals, an identity companion changed ID/type, or protected/state data could not be read; recreated companions or unrelated managed objects can break continuity.  `cat original-addresses station-identities.json; tofu show -json`.


      ### Output paths resolve to existing files {#fanout-output-file-targets}


      The routes output does not resolve exactly depot and junction to their existing files, or output/path observation failed; renamed/missing output keys, wrong exported paths or absent files can explain it.  `tofu output -json routes`.


      ### Default live plan without pending changes {#fanout-default-no-change-plan}


      The current default plan did not exit 0; repaired module inputs may still need applying, route files or outputs may drift, or incomplete interfaces/provider startup can prevent a valid plan.  `tofu plan -detailed-exitcode -input=false -no-color`.


      ### Default file for depot {#fanout-depot-file}


      depot.txt does not provide north:depot or cannot be read; the supplied retired region, incomplete forwarding or an unapplied corrected plan can leave the file stale.  `cat depot.txt`.


      ### Default file for junction {#fanout-junction-file}


      junction.txt does not provide north:junction or cannot be read; the supplied retired region, incomplete forwarding or an unapplied corrected plan can leave the file stale.  `cat junction.txt`.


      ## Try it


      Open the **opentofu Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Can the root read the child resource through its declared output?


      ```bash

      cd ~/lab/examples/module

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Expected result

      > Yes. module.api.name returns api; state contains the resource under the module.api address.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

