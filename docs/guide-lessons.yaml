      ### Ursache und Beobachtung (069, consumer_budget) {#private-delivery-bounded-ssh-observer}


      SSH oder der entfernte Observer kann das verbleibende subprocess Zeitlimit überschreiten; prüfen Sie Hostverbindung und Beobachtungsbefehl. Die gelieferte copy Aufgabe setzt mode 644 und deaktiviert no_log. Liefern Sie beide Eingaben mit privaten Rechten und Empfängereigentum. Die ursprünglichen Programme lesen bei jeder HTTP-Anfrage; Neustart und SIGHUP sind unnötig. Beobachten Sie Metadaten ohne credential auszugeben. `ssh -n -o BatchMode=yes -o ConnectTimeout=3 -p 2222 root@app1-"${DQ_NAMESPACE#dq-}" true`


      ### Ursache und Beobachtung (069, consumer_observation) {#private-delivery-own-file-access-and-observation}


      Eine root gehörende mode-600 Datei kann den eigenen Verbraucher aussperren; HTTP 401/503, Socketfehler, fehlende Prozesse/Eingaben oder SSH-/Receiptfehler verhindern ebenfalls die Beobachtung. Prüfen Sie den Eigentümer ohne Neustart. Die gelieferte copy Aufgabe setzt mode 644 und deaktiviert no_log. Liefern Sie beide Eingaben mit privaten Rechten und Empfängereigentum. Die ursprünglichen Programme lesen bei jeder HTTP-Anfrage; Neustart und SIGHUP sind unnötig. Beobachten Sie Metadaten ohne credential auszugeben. `ssh -n -o BatchMode=yes -p 2222 root@app1-"${DQ_NAMESPACE#dq-}" "stat -c ''%u %g %a %n'' /srv/site/station-token /srv/relay/station-token"`


      ### Ursache und Beobachtung (069, probe_0_1) {#private-delivery-legacy-and-startup-fallback}


      Helper-Start oder eine unterbrochene ältere Hülle kann vor einem spezifischen Marker stoppen; normale SSH-Inhaltsfehler ergeben content_1/2/3. Prüfen Sie Imports und Host-Erreichbarkeit. Die gelieferte copy Aufgabe setzt mode 644 und deaktiviert no_log. Liefern Sie beide Eingaben mit privaten Rechten und Empfängereigentum. Die ursprünglichen Programme lesen bei jeder HTTP-Anfrage; Neustart und SIGHUP sind unnötig. Beobachten Sie Metadaten ohne credential auszugeben. `python3 -I -c "import yaml"; ssh -n -o BatchMode=yes -p 2222 root@app1-"${DQ_NAMESPACE#dq-}" true`


      ### Ursache und Beobachtung (069, content_1) {#private-delivery-host-1-content}


      app1 enthält möglicherweise noch das alte credential oder SSH/Dateizugriff scheitert; liefern Sie den unveränderten Wert aus credentials.yml nach /srv/site/station-token. Die gelieferte copy Aufgabe setzt mode 644 und deaktiviert no_log. Liefern Sie beide Eingaben mit privaten Rechten und Empfängereigentum. Die ursprünglichen Programme lesen bei jeder HTTP-Anfrage; Neustart und SIGHUP sind unnötig. Beobachten Sie Metadaten ohne credential auszugeben. `ssh -n -o BatchMode=yes -p 2222 root@app1-"${DQ_NAMESPACE#dq-}" test -r /srv/site/station-token`


      ### Ursache und Beobachtung (069, mode_1) {#private-delivery-host-1-mode}


      app1 behält möglicherweise mode 644 aus der gelieferten copy Aufgabe oder stat/SSH scheitert; setzen Sie 600 für /srv/site/station-token unter Erhalt des Zugriffs des eigenen Verbrauchers. Die gelieferte copy Aufgabe setzt mode 644 und deaktiviert no_log. Liefern Sie beide Eingaben mit privaten Rechten und Empfängereigentum. Die ursprünglichen Programme lesen bei jeder HTTP-Anfrage; Neustart und SIGHUP sind unnötig. Beobachten Sie Metadaten ohne credential auszugeben. `ssh -n -o BatchMode=yes -p 2222 root@app1-"${DQ_NAMESPACE#dq-}" stat -c %a /srv/site/station-token`


      ### Ursache und Beobachtung (069, content_2) {#private-delivery-host-2-content}


      app2 enthält möglicherweise noch das alte credential oder SSH/Dateizugriff scheitert; liefern Sie den unveränderten Wert aus credentials.yml nach /srv/site/station-token. Die gelieferte copy Aufgabe setzt mode 644 und deaktiviert no_log. Liefern Sie beide Eingaben mit privaten Rechten und Empfängereigentum. Die ursprünglichen Programme lesen bei jeder HTTP-Anfrage; Neustart und SIGHUP sind unnötig. Beobachten Sie Metadaten ohne credential auszugeben. `ssh -n -o BatchMode=yes -p 2222 root@app2-"${DQ_NAMESPACE#dq-}" test -r /srv/site/station-token`


      ### Ursache und Beobachtung (069, mode_2) {#private-delivery-host-2-mode}


      app2 behält möglicherweise mode 644 aus der gelieferten copy Aufgabe oder stat/SSH scheitert; setzen Sie 600 für /srv/site/station-token unter Erhalt des Zugriffs des eigenen Verbrauchers. Die gelieferte copy Aufgabe setzt mode 644 und deaktiviert no_log. Liefern Sie beide Eingaben mit privaten Rechten und Empfängereigentum. Die ursprünglichen Programme lesen bei jeder HTTP-Anfrage; Neustart und SIGHUP sind unnötig. Beobachten Sie Metadaten ohne credential auszugeben. `ssh -n -o BatchMode=yes -p 2222 root@app2-"${DQ_NAMESPACE#dq-}" stat -c %a /srv/site/station-token`


      ### Ursache und Beobachtung (069, content_3) {#private-delivery-host-3-content}


      app3 enthält möglicherweise noch das alte credential oder SSH/Dateizugriff scheitert; liefern Sie den unveränderten Wert aus credentials.yml nach /srv/site/station-token. Die gelieferte copy Aufgabe setzt mode 644 und deaktiviert no_log. Liefern Sie beide Eingaben mit privaten Rechten und Empfängereigentum. Die ursprünglichen Programme lesen bei jeder HTTP-Anfrage; Neustart und SIGHUP sind unnötig. Beobachten Sie Metadaten ohne credential auszugeben. `ssh -n -o BatchMode=yes -p 2222 root@app3-"${DQ_NAMESPACE#dq-}" test -r /srv/site/station-token`


      ### Ursache und Beobachtung (069, mode_3) {#private-delivery-host-3-mode}


      app3 behält möglicherweise mode 644 aus der gelieferten copy Aufgabe oder stat/SSH scheitert; setzen Sie 600 für /srv/site/station-token unter Erhalt des Zugriffs des eigenen Verbrauchers. Die gelieferte copy Aufgabe setzt mode 644 und deaktiviert no_log. Liefern Sie beide Eingaben mit privaten Rechten und Empfängereigentum. Die ursprünglichen Programme lesen bei jeder HTTP-Anfrage; Neustart und SIGHUP sind unnötig. Beobachten Sie Metadaten ohne credential auszugeben. `ssh -n -o BatchMode=yes -p 2222 root@app3-"${DQ_NAMESPACE#dq-}" stat -c %a /srv/site/station-token`


      ## Probieren Sie es aus


      Öffnen Sie das **ansible Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Kann eine verschlüsselte Vars-Datei ohne ein Entschlüsselungsgeheimnis ausgeführt werden?


      ```bash

      cd ~/lab/examples/vault

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Der No-Key-Lauf schlägt fehl; Der Schlüssellauf ist erfolgreich, ohne dass das Demonstrationsgeheimnis gedruckt werden muss.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.


      Private Auslieferung verbindet unterdrückte Ausgabe, Empfängerzugriff und Isolation anderer Benutzer. Eigentum, Gruppen und tatsächliche Operator-Befugnisse bestimmen erlaubte Metadatenübergänge; eine kombinierte Inhalts- und Eigentumsänderung kann bei beschränkten Rechten scheitern. Prüfe tatsächliche Authentifizierung sowie fremde Lese- und Schreibverbote ohne geheime Bytes auszugeben. Restriktive Modi belegen allein keinen Zugriff der vorgesehenen Anwendung.


      Aufgabe 089 verbindet Artefaktbytes mit einem vertrauenswürdigen Publikationsbeleg und privatem Zugriff tatsächlicher unprivilegierter Anwendungen. Eigentumsübergänge müssen die Operator-Capabilities beachten. Richtige Quelldateien und restriktive Modi können neben unlesbaren Eingaben oder einer noch nicht aktualisierten Anwendung bestehen. Authentifiziere jede bereitgestellte Instanz und verfolge die Abhängigkeit von der geprüften Quelle zur Übernahme anhand von `application-contract.json`. Erzeuge Authorization zur Prüfung im Speicher, ohne den synthetischen Zugangswert anzuzeigen.'
