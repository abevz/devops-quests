    pl: 'Nazwa Service jest przekształcana w adres wirtualny. Jego selector i gotowe EndpointSlice określają, które adresy podów odbierają ruch. Sam sukces DNS nie dowodzi, że Service ma użyteczny backend.


      ### Selektor Service i gotowe punkty końcowe {#arrivals-ready-endpoint}


      W zadaniu 004 porównaj selektor Service `arrivals` z etykietami istniejących Podów. Gotowy Pod stanie się punktem końcowym tego Service, gdy jego etykiety będą pasować do selektora. Użyj `kubectl get pods --show-labels` i `kubectl get service arrivals -o yaml`. Po korekcie poszukaj gotowego punktu końcowego w EndpointSlice z etykietą `kubernetes.io/service-name=arrivals`.


      W zadaniu 120 zachowaj pierwotną tożsamość PVC, naprawiając selector headless Service i ograniczony egress klienta. DNS i dostęp TCP do shelf wymagają osobnych zezwoleń; selectory namespace i Poda dla DNS należą do jednego peer. Sprawdź ordinal DNS i odpowiedź ledger osobno od UID PVC.


      W zadaniu 118 śledź wybór Service przez rzeczywistą przynależność EndpointSlice, tożsamość i adres docelowego Poda oraz interfejs aplikacji. Gotowy endpoint nadal może ogłaszać błędny port docelowy. Porównaj bezpośredni ruch do Poda z zachowanym Service VIP, zanim obwinisz mechanizm przekazywania. Ograniczony zapis diagnozy nie zastępuje analizy incydentu; bieżące API i ruch nie dowodzą historii ani nie uzasadniają zmian reguł węzła czy globalnego DNS.


      W zadaniu 119 egress policy wybiera Pod klienta. Selectory namespace i Poda w jednym peer są łączone; osobne peers są alternatywami, a pozwolenia polityk sumują się. Zezwól na wskazane porty DNS UDP/TCP i TCP board bez szerszych polityk. Sprawdź DNS i dozwoloną odpowiedź board, nieudane żądanie do closed oraz udane żądanie kontrolne z board; sam błąd nie dowodzi przyczyny.


      W zadaniu 062 wybór celów i przynależność dozwolonych źródeł to oddzielne relacje. Polityka może zachować zamierzoną granicę, mimo że żądające obciążenie już do niej nie należy. Etykiety bieżącego Poda i szablonu Deploymentu mają różne czasy życia. Porównaj żądane etykiety i bieżące należące do obciążenia Pody bez poszerzania pierwotnej granicy Ingress; dozwolone i zabronione żądania to niezależne kontrole. Zachowane tożsamości obiektów i dostarczone obrazy utrzymują naprawę w istniejącej topologii.


      W zadaniu 110 najpierw rozwiąż `station.internal` na adres prywatnego Service kontrolera, a potem testuj HTTP. Sprawdź podaną klasę Ingress, host, ścieżkę `/` typu Prefix i backend `board:8080`: poprawny Host ma zwrócić `north-110`, a żądanie z błędnym Host ma się nie powieść. Sukces DNS nie dowodzi routingu, a sam błąd żądania nie określa jego przyczyny.


      W zadaniu 106 ClusterIP, headless DNS i NodePort to różne drogi do tych samych wybranych Podów. Popraw selector każdego Service na `app: board`, zachowując zapisane UID, type, IP i kolejność portów. Sprawdź trzy nazwy Service na porcie `8080` i NodePort prywatnego węzła (co najmniej `30000`): każdy ma zwrócić `north-106`. Sprawdź pełny IP Poda w odpowiedzi headless DNS i poczekaj na uzgodnienie stanu.


      W zadaniu 107 kontroler Ingress kieruje host i ścieżkę do portu Service. Użyj podanej prywatnej klasy, hosta `station.internal`, ścieżki `/` typu Prefix i backendu `board:8080`. Sprawdź URL kontrolera z poprawnym i błędnym nagłówkiem Host: pierwszy ma zwrócić `north-107`, drugi ma zakończyć się błędem. Sam błąd nie dowodzi jego przyczyny.


      ### Port docelowy Service relay {#relay-service-port}


      W zadaniu 030 Service relay używa targetPort: web, ale worker deklaruje nazwę portu http na 8080. Gotowy Deployment nie naprawia tego powiązania. Porównaj targetPort z nazwą portu kontenera i gotowymi EndpointSlice, potem wywołaj http://relay:8080/ z worker; oczekuj signalrail. Błędy DNS, exec lub HTTP także uniemożliwiają obserwację.


      ### Mapowanie Service board {#maintenance-board-service}


      W zadaniu 040 porównaj Service board z szablonem Poda board: selektor app=board i wszystkie dodatkowe etykiety selektora muszą pasować. Dokładnie jeden port TCP 8080 musi rozwiązywać targetPort na port kontenera 8080, również przez poprawną nazwę. Niezgodność lub nieczytelne API/JSON/dane portu dają service. Gdy brak diagnostyki Service, sprawdź najpierw katalog i start Python/dq_check.


      ### Treść board przez Service {#maintenance-board-http}


      W zadaniu 040 dostarczony worker początkowo serwuje retired. Po publikacji north-40 wywołaj http://board:8080 z nieusuwanych Podów Running należących do tego Deployment. Poprawne mapowanie Service nie dowodzi treści. Brak takiego Poda, błędy API/exec/HTTP lub stara treść dają http. Błąd katalogu/Pythona/modułu przed obserwatorem daje zewnętrzny fallback.


      ### Selektory Service i własność gotowych endpointów {#progressive-service-targets}


      Publiczny Service może nie istnieć albo nie wybiera gotowych Podów aktywnego pierwotnego Deployment lub jest nieczytelny; selector może nadal wskazywać producenta po przełączeniu, endpointy są puste lub obce albo port i typ są błędne. Publiczny port wymaga dokładnie jednego wpisu TCP w selektorowym ClusterIP Service. Niepusty selector musi pasować do etykiet aktywnego Deployment. Potrzebny jest gotowy endpoint należący do Service i wskazujący wyłącznie gotowe Pody kontrolowane przez UID ReplicaSet aktywnego pierwotnego Deployment. Same etykiety nie potwierdzają właściciela; przełącz na zapas, zachowując producenta. `kubectl get services,endpointslices,pods -o yaml`.


      ### Rzeczywisty publiczny rekord JSON {#progressive-public-record}


      Publiczna publikacja HTTP różni się od pierwotnego rekordu lub jest nieczytelna; Service może prowadzić do innej aplikacji, worker podawać inny katalog lub stare dane albo obserwacja HTTP/JSON zawiodła. Porównaj cały JSON publikacji z pierwotnym rekordem, w tym route i producer_id. Kontrola żąda publicznej ścieżki Service z aktywnego gotowego Poda; lokalny plik lub nowa tożsamość nie potwierdza wyniku publicznego. Błędy JSON, HTTP i exec też używają markera publikacji.


      ### Ograniczone selektory i porty ingress {#isolation-bounded-ingress-contract}


      Zachowana polityka ingress nie wyraża wyłącznie dostępu dispatcher TCP na 8080 lub obserwacja zawiodła; dostarczony port 9090, szerszy selektor/reguła, niejednoznaczne nazwane porty lub niedostępne API mogą to wyjaśniać. Selektor celu odpowiada app=board, każde źródło role=dispatcher w tym samym namespace, a jedyny kierunek to Ingress. Wszystkie ograniczone przepływy TCP wskazują 8080. Nazwany port musi wystąpić raz w każdym nieusuwanym Podzie board i być zgodny między nimi. Napraw zachowaną politykę z początkowym 9090 przed kontrolą członkostwa klienta. `kubectl get networkpolicy board-ingress -o yaml; kubectl get pods -l app=board -o yaml`.


      ### Zachowanie polityki i tożsamości aplikacji {#isolation-original-policy-and-workloads}


      UID pierwotnej polityki lub Deployment zmienił się albo obraz worker nie odpowiada dostarczonej referencji/digest; odtworzenie obiektów lub wymiana aplikacji narusza zachowane tożsamości izolacji.  `cat isolation-contract.json; kubectl get networkpolicy board-ingress -o yaml; kubectl get deployments,pods -o yaml`.


      ### Docelowe etykiety wywołującej aplikacji {#isolation-desired-caller-membership}


      Szablon Deployment dispatcher nie jest wybierany przez peer zachowanej polityki ingress; dostarczone role=retired lub zmiana etykiety tylko żywego Poda pozostawia przyszłe Pody poza dozwoloną grupą.  `kubectl get deployment dispatcher -o yaml`.


      ### Bieżące własne Pody wywołującej aplikacji {#isolation-current-caller-observation}


      Bieżących własnych Podów dispatcher brakuje, nie są gotowe lub nie należą do dozwolonego peer albo obserwacja zawiodła; trwający rollout, stare etykiety, brak chronionych obiektów/danych lub błędy API/czasu blokują kontrolę członkostwa. Popraw szablon Poda dispatcher pod zachowany peer, potem pozwól rollout wymienić stare Pody. Kontrola śledzi controller UID Deployment/ReplicaSet we wszystkich własnych ReplicaSet i wymaga niepustego zbioru nieusuwanych, niezakończonych Podów, każdy Running, Ready i wybrany. Zmiana jednego żywego Poda nie naprawia szablonu. `kubectl get pods,replicasets --show-labels; kubectl rollout status deployment/dispatcher --timeout=10s`.


      ### Granica jednej obowiązującej polityki {#isolation-single-effective-policy}


      Namespace nie zgłasza dokładnie jednej NetworkPolicy lub nie odczytano listy; dodanie drugiej zamiast naprawy zachowanej może zmienić sumę dozwolonych połączeń.  `kubectl get networkpolicy -o yaml`.


      ### Odpowiedź Service dozwolonemu klientowi {#isolation-permitted-service-response}


      Żądanie dispatcher nie zwróciło north-62 lub exec/HTTP zawiódł; bieżące etykiety mogą nie pasować do peer, polityka używać złego portu albo Service/aplikacja board być niedostępne.  `kubectl exec deployment/dispatcher -- wget -qO- -T 3 http://board:8080`.


      ### Nieoczekiwany sukces wykluczonego klienta {#isolation-excluded-caller-access}


      Żądanie wykluczonego visitor powiodło się; szersze uprawnienia ingress lub etykiety włączające visitor do dozwolonej grupy dopuszczają niepożądane połączenie z board.  `kubectl exec deployment/visitor -- wget -qO- -T 2 http://board:8080`.


      ## Wypróbuj


      Otwórz laboratorium **kubernetes** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy Service może istnieć z zerowymi pasującymi modułami?


      ```bash

      cd ~/lab/examples/networking

      bash run.sh

      kubectl -n lab-networking get svc,endpointslice

      kubectl -n lab-networking get pods --show-labels

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Tak. Zły selector nie generuje endpoints. Poprawienie tego powoduje tę samą trasę Service do gotowego webpoda.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Un nombre Service se resuelve en una dirección virtual. Su selector y EndpointSlices listos determinan qué direcciones de pod reciben tráfico. El éxito de DNS por sí solo no prueba que el Service tenga un backend utilizable.


      ### Selector de Service y endpoints listos {#arrivals-ready-endpoint}


      En el ejercicio 004, compara el selector del Service `arrivals` con las etiquetas de los Pods existentes. Un Pod listo puede ser un endpoint listo de este Service cuando sus etiquetas coinciden con el selector. Compara `kubectl get pods --show-labels` y `kubectl get service arrivals -o yaml`. Tras corregirlo, busca un endpoint listo en los EndpointSlice con la etiqueta `kubernetes.io/service-name=arrivals`.


      En el ejercicio 120, conserva la identidad original del PVC al reparar el selector del Service headless y el egress limitado del cliente. DNS y acceso TCP a shelf necesitan permisos distintos; los selectores namespace y Pod para DNS van en un mismo peer. Verifica ordinal DNS y la respuesta ledger por separado del UID del PVC.


      En el quest 118, sigue la selección del Service por la pertenencia real de EndpointSlice, identidad del Pod destino, dirección e interfaz de aplicación. Un endpoint listo aún puede anunciar un puerto incorrecto. Compara tráfico directo al Pod con el Service VIP conservado antes de culpar al mecanismo de reenvío. El diagnóstico acotado no sustituye el análisis completo; API y tráfico actuales no prueban el historial ni justifican cambios en reglas del nodo o DNS global.


      En el ejercicio 119, una política egress selecciona el Pod cliente. Los selectores de namespace y Pod en un mismo peer se combinan; peers separados son alternativas y las políticas suman permisos. Permite los puertos DNS UDP/TCP y TCP de board indicados sin políticas más amplias. Prueba DNS y la respuesta permitida de board, el fallo hacia closed y la solicitud de control exitosa desde board; un fallo solo no demuestra su causa.


      En el quest 062, seleccionar destinos y pertenecer a las fuentes permitidas son relaciones distintas. Una política puede conservar el límite previsto aunque una carga solicitante ya no pertenezca a él. Las etiquetas de un Pod actual y de una plantilla de Deployment tienen vidas diferentes. Compara etiquetas deseadas y Pods actuales sin ampliar la entrada original; peticiones permitidas y denegadas son controles independientes. Identidades conservadas e imágenes suministradas mantienen la reparación en la topología existente.


      En el ejercicio 110, resuelve primero `station.internal` a la dirección del Service privado del controlador y después prueba HTTP. Comprueba la clase Ingress indicada, host, ruta `/` de tipo Prefix y backend `board:8080`: el Host correcto debe devolver `north-110` y la solicitud con Host incorrecto debe fallar. Un DNS correcto no demuestra el enrutamiento y un fallo aislado no identifica su causa.


      En el ejercicio 106, ClusterIP, DNS headless y NodePort son caminos distintos hacia los mismos Pods seleccionados. Corrige el selector de cada Service a `app: board` sin cambiar su UID, type, IP ni puertos ordenados registrados. Prueba los tres nombres de Service en el puerto `8080` y el NodePort del nodo privado (al menos `30000`): cada uno debe devolver `north-106`. Comprueba la IP completa del Pod en la respuesta DNS headless y espera la reconciliación.


      En el ejercicio 107, un controlador Ingress dirige host y ruta a un puerto de Service. Usa la clase privada indicada, host `station.internal`, ruta `/` de tipo Prefix y backend `board:8080`. Prueba la URL del controlador con las cabeceras Host correcta e incorrecta: la primera debe devolver `north-107` y la segunda debe fallar. Un fallo por sí solo no demuestra su causa.


      ### Puerto de destino del Service relay {#relay-service-port}


      En el reto 030, el Service relay usa targetPort: web pero worker declara el puerto http en 8080. Un Deployment disponible no corrige esa relación. Compara targetPort con el nombre del puerto del contenedor y los EndpointSlices disponibles; solicita http://relay:8080/ desde worker y espera signalrail. Los fallos de DNS, exec o HTTP también impiden la observación.


      ### Mapeo del Service board {#maintenance-board-service}


      En el reto 040, compara Service board con la plantilla Pod board: selector app=board y toda etiqueta adicional deben coincidir. Un único puerto TCP 8080 debe resolver targetPort al puerto de contenedor 8080, incluida una referencia nominal válida. Incompatibilidad o datos API/JSON/puerto ilegibles dan service. Sin diagnóstico del Service, revisa primero directorio y arranque Python/dq_check.


      ### Contenido board a través del Service {#maintenance-board-http}


      En el reto 040, worker sirve inicialmente retired. Tras publicar north-40, solicita http://board:8080 desde los Pods Running no terminantes pertenecientes al Deployment. Un mapeo correcto del Service no demuestra el cuerpo. Ningún Pod adecuado, fallos API/exec/HTTP o contenido antiguo pueden dar http. Un fallo previo del directorio/Python/módulo alcanza el fallback externo.


      ### Selectores Service y propiedad de endpoints listos {#progressive-service-targets}


      El Service público puede faltar o no selecciona Pods listos del Deployment original activo o no puede observarse; el selector puede seguir en el productor tras failover, endpoints estar vacíos o ser ajenos o el puerto/tipo ser incorrecto. El puerto público exige una sola entrada TCP en Service ClusterIP con selector no vacío que coincida con el Deployment activo. Debe haber un endpoint listo propio del Service apuntando solo a Pods listos controlados por UID de ReplicaSet del Deployment original activo. Las etiquetas solas no acreditan propietario; en failover seleccione respaldo conservando productor. `kubectl get services,endpointslices,pods -o yaml`.


      ### Registro JSON público real {#progressive-public-record}


      La publicación HTTP pública difiere del registro original o no puede leerse; el Service puede alcanzar otra carga, worker servir otro directorio o datos antiguos o fallar HTTP/JSON. Compare todo el JSON publicado con el original, incluidos route y producer_id. La prueba pide la ruta pública Service desde un Pod activo listo; un archivo local o nueva identidad no acredita el resultado público. JSON inválido y fallos HTTP o exec también usan el marcador de publicación.


      ### Selectores y puertos ingress limitados {#isolation-bounded-ingress-contract}


      La política ingress conservada no expresa solo acceso dispatcher TCP a 8080 o falló observarla; puerto 9090 suministrado, selector/regla más amplios, puertos con nombre ambiguos o API no disponible pueden explicarlo. El selector protegido equivale a app=board, cada origen a role=dispatcher del mismo namespace y la única dirección es Ingress. Todos los flujos TCP acotados resuelven a 8080. Un puerto con nombre aparece una vez en cada Pod board no eliminado y coincide entre ellos. Repare la política conservada que empieza en 9090 antes de comprobar el cliente. `kubectl get networkpolicy board-ingress -o yaml; kubectl get pods -l app=board -o yaml`.


      ### Conservar identidades de política y aplicaciones {#isolation-original-policy-and-workloads}


      Cambió UID de política original o Deployment, o una imagen worker difiere de referencia/digest; recrear objetos o sustituir la aplicación puede romper identidades conservadas.  `cat isolation-contract.json; kubectl get networkpolicy board-ingress -o yaml; kubectl get deployments,pods -o yaml`.


      ### Etiquetas deseadas de la aplicación cliente {#isolation-desired-caller-membership}


      La plantilla Deployment dispatcher no está seleccionada por el peer ingress conservado; role=retired suministrado o cambiar solo un Pod vivo deja futuros Pods fuera del grupo permitido.  `kubectl get deployment dispatcher -o yaml`.


      ### Pods propios actuales del cliente {#isolation-current-caller-observation}


      Faltan Pods propios dispatcher actuales, no están listos o fuera del peer permitido, o falló observar; rollout pendiente, etiquetas antiguas, objetos/datos protegidos ausentes o errores API/plazo impiden verificar pertenencia. Corrija la plantilla Pod dispatcher para el peer conservado y deje que rollout reemplace Pods antiguos. La prueba sigue controller UID Deployment/ReplicaSet en todos los ReplicaSet propios y exige un conjunto no vacío de Pods no eliminados ni terminados, todos Running, Ready y seleccionados. Cambiar un Pod vivo no repara la plantilla deseada. `kubectl get pods,replicasets --show-labels; kubectl rollout status deployment/dispatcher --timeout=10s`.


      ### Límite de una política efectiva {#isolation-single-effective-policy}


      El namespace no informa exactamente una NetworkPolicy o no pudo leerse la lista; crear otra en vez de reparar la conservada cambia el conjunto aditivo de conexiones permitidas.  `kubectl get networkpolicy -o yaml`.


      ### Respuesta Service al cliente permitido {#isolation-permitted-service-response}


      La petición dispatcher no devolvió north-62 o falló exec/HTTP; etiquetas actuales pueden no coincidir con peer, la política usar otro puerto o Service/aplicación board no estar disponibles.  `kubectl exec deployment/dispatcher -- wget -qO- -T 3 http://board:8080`.


      ### Éxito inesperado del cliente excluido {#isolation-excluded-caller-access}


      La petición del visitor excluido tuvo éxito; permisos ingress más amplios o etiquetas que incluyen visitor en el grupo permitido pueden admitir una conexión no deseada a board.  `kubectl exec deployment/visitor -- wget -qO- -T 2 http://board:8080`.


      ## Pruébalo


      Abra el laboratorio **kubernetes** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿Puede el Service existir sin ningún pods coincidente?


      ```bash

      cd ~/lab/examples/networking

      bash run.sh

      kubectl -n lab-networking get svc,endpointslice

      kubectl -n lab-networking get pods --show-labels

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > YSí. El selector incorrecto no produce ningún endpoints. Al corregirlo se crea la misma ruta Service al pod web listo.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh`, luego `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Ein Service-Name wird in eine virtuelle Adresse aufgelöst. Sein selector und die fertigen EndpointSlices bestimmen, welche Pod-Adressen Datenverkehr empfangen. Der Erfolg von DNS allein beweist nicht, dass der Service über einen brauchbaren backend verfügt.


      ### Service-Selektor und bereite Endpunkte {#arrivals-ready-endpoint}


      Vergleichen Sie in Aufgabe 004 den Selektor des Service `arrivals` mit den Labels der vorhandenen Pods. Ein bereiter Pod kann als Endpunkt dieses Service dienen, wenn seine Labels zum Selektor passen. Nutzen Sie `kubectl get pods --show-labels` und `kubectl get service arrivals -o yaml`. Suchen Sie nach der Korrektur einen bereiten Endpunkt in den EndpointSlices mit dem Label `kubernetes.io/service-name=arrivals`.


      Erhalte in Aufgabe 120 die ursprüngliche PVC-Identität, während du den Selector des Headless-Service und den begrenzten Client-Egress reparierst. DNS und TCP-Zugriff auf shelf benötigen getrennte Freigaben; Namespace- und Pod-Selector für DNS gehören in einen Peer. Prüfe Ordinal-DNS und Ledger-Antwort getrennt von der PVC-UID.


      Verfolge in Quest 118 die Service-Auswahl durch tatsächliche EndpointSlice-Eigentümerschaft, Ziel-Pod-Identität, Adresse und Anwendungsschnittstelle. Ein bereiter Endpoint kann noch einen falschen Zielport veröffentlichen. Vergleiche direkten Pod-Verkehr mit der erhaltenen Service-VIP vor der Schuldzuweisung an die Weiterleitung. Der begrenzte Diagnoseeintrag ersetzt keine Incident-Analyse; aktueller API-Zustand und Verkehr beweisen keinen Änderungsverlauf und rechtfertigen keine Knotenregel- oder globalen DNS-Änderungen.


      In Aufgabe 119 wählt eine Egress-Policy den Client-Pod aus. Namespace- und Pod-Selector in einem Peer werden kombiniert; getrennte Peers sind Alternativen, und Policies addieren ihre Freigaben. Erlaube die angegebenen DNS-UDP/TCP-Ports und den Board-TCP-Port ohne breitere Policies. Prüfe DNS und die erlaubte Board-Antwort, den fehlschlagenden Closed-Aufruf und den erfolgreichen Kontrollaufruf von Board; ein Fehlschlag allein belegt seine Ursache nicht.


      In Quest 062 sind Zielauswahl und Zugehörigkeit erlaubter Quellen getrennte Beziehungen. Eine Policy kann ihre beabsichtigte Grenze behalten, während ein anfragender Workload nicht mehr dazugehört. Labels eines aktuellen Pods und einer Deployment-Vorlage haben verschiedene Lebensdauern. Vergleiche gewünschte Labels und aktuelle zugehörige Pods, ohne die ursprüngliche Ingress-Grenze zu erweitern; erlaubte und abgewiesene Anfragen sind unabhängige Kontrollen. Erhaltene Objektidentitäten und bereitgestellte Images halten die Reparatur in der vorhandenen Topologie.


      Löse in Aufgabe 110 zuerst `station.internal` zur Adresse des privaten Controller-Service auf und prüfe danach HTTP. Kontrolliere die vorgegebene Ingress-Klasse, Host, Prefix-Pfad `/` und Backend `board:8080`: Der richtige Host muss `north-110` liefern, die Anfrage mit falschem Host fehlschlagen. DNS-Erfolg beweist keine Weiterleitung, und ein einzelner Fehlschlag nennt seine Ursache nicht.


      In Aufgabe 106 sind ClusterIP, Headless-DNS und NodePort verschiedene Wege zu denselben ausgewählten Pods. Korrigiere den Selector jedes Service auf `app: board`, ohne die aufgezeichnete UID, den Typ, die IPs oder die Portreihenfolge zu ändern. Prüfe alle drei Service-Namen auf Port `8080` und den NodePort des privaten Knotens (mindestens `30000`): Jeder muss `north-106` liefern. Prüfe die vollständige Pod-IP in der Headless-DNS-Antwort und warte auf den Abgleich.


      In Aufgabe 107 leitet ein Ingress-Controller Host und Pfad an einen Service-Port. Verwende die vorgegebene private Klasse, Host `station.internal`, Prefix-Pfad `/` und Backend `board:8080`. Prüfe die Controller-URL mit richtigem und falschem Host-Header: Der erste muss `north-107` liefern, der zweite fehlschlagen. Ein Fehlschlag allein belegt seine Ursache nicht.


      ### Zielport des Service relay {#relay-service-port}


      In Quest 030 verwendet Service relay targetPort: web, aber worker deklariert den Portnamen http auf 8080. Ein bereites Deployment korrigiert diese Zuordnung nicht. Vergleiche targetPort mit dem Container-Portnamen und bereiten EndpointSlices, rufe dann http://relay:8080/ aus worker ab; erwartet wird signalrail. Auch DNS-, exec- oder HTTP-Fehler verhindern diese Beobachtung.


      ### Service-Zuordnung für board {#maintenance-board-service}


      Vergleiche in Quest 040 Service board mit der board-Pod-Vorlage: Selektor app=board und alle zusätzlichen Selektorlabels müssen passen. Genau ein TCP-Port 8080 muss targetPort auf Container-Port 8080 auflösen, auch über einen gültigen Portnamen. Abweichungen oder unlesbare API-/JSON-/Portdaten melden service. Ohne Service-Diagnose prüfe zuerst Arbeitsverzeichnis und Python-/dq_check-Start.


      ### board-Inhalt über den Service {#maintenance-board-http}


      In Quest 040 liefert worker zunächst retired. Rufe nach Veröffentlichung von north-40 http://board:8080 aus nicht terminierenden Running-Pods dieses Deployments ab. Eine gültige Service-Zuordnung beweist den Inhalt nicht. Fehlende passende Pods, API-/exec-/HTTP-Fehler oder veralteter Inhalt können http melden. Ein früher Arbeitsverzeichnis-/Python-/Modulfehler erreicht den äußeren Fallback.


      ### Service-Selektoren und Eigentümer bereiter Endpoints {#progressive-service-targets}


      Der öffentliche Service fehlt möglicherweise oder wählt keine bereiten Pods des aktiven ursprünglichen Deployments oder ist nicht beobachtbar; der Selektor zeigt nach dem Failover möglicherweise noch zum Produzenten, Endpoints sind leer oder fremd oder Port beziehungsweise Typ sind falsch. Der öffentliche Port benötigt genau einen TCP-Eintrag in einem selektorbasierten ClusterIP-Service. Sein nicht leerer Selektor muss zu den aktiven Deployment-Labels passen. Mindestens ein bereiter Endpoint muss diesem Service gehören und ausschließlich auf bereite Pods unter ReplicaSet-UID-Kontrolle des aktiven ursprünglichen Deployments zeigen. Labels allein belegen keine Controller-Eigentümerschaft; wählen Sie beim Failover die Ersatzanwendung und erhalten Sie den Produzenten. `kubectl get services,endpointslices,pods -o yaml`.


      ### Tatsächlicher öffentlicher JSON-Datensatz {#progressive-public-record}


      Die öffentliche HTTP-Publikation weicht vom ursprünglichen Datensatz ab oder ist unlesbar; der Service erreicht möglicherweise eine andere Anwendung, worker liefert ein anderes Verzeichnis oder veraltete Daten oder HTTP-/JSON-Beobachtung schlug fehl. Vergleichen Sie den gesamten JSON-Datensatz mit dem Original einschließlich route und producer_id. Die Prüfung fragt den öffentlichen Service-Pfad aus einem aktiven bereiten Pod ab; lokale Datei oder neue Publikationsidentität belegen das öffentliche Ergebnis nicht. Ungültiges JSON sowie HTTP-/exec-Fehler nutzen ebenfalls den Publikationsmarker.


      ### Begrenzte Ingress-Selektoren und Ports {#isolation-bounded-ingress-contract}


      Die erhaltene Ingress-Policy beschreibt nicht ausschließlich dispatcher Zugriff über TCP auf 8080 oder ihre Beobachtung schlug fehl; der gelieferte Port 9090, breitere Selektoren/Regeln, mehrdeutige benannte Ports oder unerreichbare API-Eingaben können die Ursache sein. Der geschützte Selektor entspricht app=board, jede Quelle role=dispatcher im selben Namespace und die einzige Richtung ist Ingress. Alle begrenzten TCP-Flüsse müssen 8080 ergeben. Ein benannter Port muss je nicht gelöschtem board Pod einmal vorhanden und überall gleich sein. Korrigieren Sie zuerst die erhaltene Policy mit anfänglichem 9090, dann die Aufruferzugehörigkeit. `kubectl get networkpolicy board-ingress -o yaml; kubectl get pods -l app=board -o yaml`.


      ### Policy- und Workload-Identitäten erhalten {#isolation-original-policy-and-workloads}


      Die UID der ursprünglichen Policy oder eines Deployments wurde geändert oder ein worker Image weicht von der gelieferten Referenz beziehungsweise dem Digest ab; Neuerstellung oder Anwendungsaustausch kann die erhaltenen Isolationsidentitäten verletzen.  `cat isolation-contract.json; kubectl get networkpolicy board-ingress -o yaml; kubectl get deployments,pods -o yaml`.


      ### Gewünschte Labels des Aufrufers {#isolation-desired-caller-membership}


      Die Deployment-Vorlage von dispatcher wird nicht vom erhaltenen Ingress-Peer ausgewählt; das gelieferte role=retired oder nur an einem laufenden Pod geänderte Labels lassen künftige Pods außerhalb der erlaubten Gruppe.  `kubectl get deployment dispatcher -o yaml`.


      ### Aktuelle eigene Pods des Aufrufers {#isolation-current-caller-observation}


      Aktuelle eigene dispatcher Pods fehlen, sind nicht bereit oder außerhalb des erlaubten Peers oder die Beobachtung schlug fehl; ausstehender Rollout, alte Pod-Labels, fehlende geschützte Objekte/Belege oder API-/Zeitfehler verhindern die Prüfung der aktuellen Zugehörigkeit. Passen Sie die Pod-Vorlage von dispatcher an den erhaltenen Peer an und lassen Sie den Rollout alte Pods ersetzen. Die Prüfung folgt controller UIDs von Deployment/ReplicaSet über alle eigenen ReplicaSets und verlangt nichtleere, nicht gelöschte und nicht beendete Aufrufer-Pods, jeweils Running, Ready und ausgewählt. Ein einzelner geänderter Live-Pod repariert die gewünschte Vorlage nicht. `kubectl get pods,replicasets --show-labels; kubectl rollout status deployment/dispatcher --timeout=10s`.


      ### Grenze einer wirksamen Policy {#isolation-single-effective-policy}


      Der Namespace meldet nicht genau eine NetworkPolicy oder ihre Liste war nicht lesbar; eine zusätzliche Policy statt Korrektur der erhaltenen kann die zusammengefassten erlaubten Verbindungen verändern.  `kubectl get networkpolicy -o yaml`.


      ### Service-Antwort für erlaubten Aufrufer {#isolation-permitted-service-response}


      Die dispatcher Anfrage lieferte nicht north-62 oder exec/HTTP schlug fehl; aktuelle Labels passen möglicherweise noch nicht zum erlaubten Peer, die Policy nutzt den falschen Port oder Service/Workload board ist unerreichbar.  `kubectl exec deployment/dispatcher -- wget -qO- -T 3 http://board:8080`.


      ### Unerwarteter Erfolg ausgeschlossener Aufrufer {#isolation-excluded-caller-access}


      Die Anfrage des ausgeschlossenen visitor war erfolgreich; weitergehende Ingress-Rechte oder Labels, die visitor in die erlaubte Gruppe aufnehmen, können eine unerwünschte Verbindung zu board zulassen.  `kubectl exec deployment/visitor -- wget -qO- -T 2 http://board:8080`.


      ## Probieren Sie es aus


      Öffnen Sie das **kubernetes Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Kann der Service ohne passenden pods existieren?


      ```bash

      cd ~/lab/examples/networking

      bash run.sh

      kubectl -n lab-networking get svc,endpointslice

      kubectl -n lab-networking get pods --show-labels

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > YJa. Der falsche selector erzeugt keinen endpoints. Durch die Korrektur wird dieselbe Service-Route zum bereitstehenden Web-Pod erstellt.


      ## Beobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann mit `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-networking
kubernetes-11:
  profile: kubernetes
  example: storage
  source_hash: 6ca5a3d6b4f9019907f1251c74bb58470f2d93b004a01fe55d4e78303d424f08
  content:
    en: 'Verify data recovery across both volume bindings and application interfaces. The declared dataset should be regular files on the intended claim, with matching sizes and checksums; an overlaid file from another mount is not evidence that those bytes reached that volume. A read-only source reader and the restored target can be observed independently. The storage Labs exercise binding and retained data, not the complete provisioning-and-copy recovery from a separate retained source.


      A claim requests storage; binding selects a volume; mounting makes its bytes available to a container. A pod restart is not the same operation as deleting its PVC. The Lab uses local node storage, so it does not demonstrate cloud disk replication.


      In quest 045, the data is already in the Bound `route-data` claim. Point the reader volume at that claim and mount it read-only at `/data`; do not delete or recreate the claim. Compare its UID with `original-pvc-uid`, wait for the reader rollout, and verify `/data/route.txt` contains `north-45`.


      ### Retain the original claim {#retained-claim-identity}


      The original claim is not Bound with its saved UID, or its evidence cannot be read; deleting/recreating the claim changes identity even when its name is reused. `kubectl get pvc route-data -o jsonpath=''{.metadata.uid} {.status.phase}''; cat original-pvc-uid`.


      ### Mount the retained data read-only {#retained-claim-mount}


      The reader template does not mount only the existing claim read-only at /data, or cannot be read; the initial retired-data reference, extra mounts or subpath options may remain. In reader.yaml retain one volume backed by route-data and one worker mount at /data, with no extra mounts in other containers or init containers. Read-only may be set on the mount or PVC volume source. Extra volume sources, subPath/subPathExpr, propagation or extra mount options change the contract. Update the consumer rather than recreating the data claim.


      ### Wait for the storage consumer {#retained-claim-readiness}


      reader did not complete rollout within 3 seconds; the Pod may still reference a nonexistent claim, wait for storage or fail to start. `kubectl describe pods; kubectl rollout status deployment/reader --timeout=10s`.


      ### Read the retained route {#retained-claim-content}


      The worker did not read north-45 from /data/route.txt; exec may fail while the Pod is unready, or the wrong volume, path or altered stored data may be visible. `kubectl exec deployment/reader -c worker -- cat /data/route.txt`.


      ### Preserve the source and workload identities {#storage-preserved-identities}


      An original Deployment or the source PVC changed UID or could not be read; deleting and recreating it can preserve a name while losing the retained identity. The unbound target PVC is outside that retained identity set.  `kubectl get deployment relay reserve -o yaml; kubectl get pvc reserve -o yaml`.


      ### Source binding and workload observations {#storage-source-availability}


      The retained source PVC is not Bound, or Pod/ReplicaSet observation failed; losing the source volume binding or unavailable Kubernetes objects can prevent proving recovery from the original dataset.  `kubectl get pvc reserve -o yaml; kubectl get pods,replicasets -o wide`.


      ### Retain the worker image {#storage-retained-worker-image}


      A checked worker image no longer matches the supplied reference or digest; replacing the application image to manufacture a response bypasses the required recovery of the mounted data.  `kubectl get deployments,pods -o yaml`.


      ### Target rollout before data observation {#storage-rollout-observation-gate}


      The relay rollout did not complete within 3 seconds, or the data observer stopped without a named marker; the unbound target, unavailable mounts or missing/malformed protected and API data may explain it.  `kubectl rollout status deployment/relay --timeout=10s; cat storage-contract.json`.


      ### Dataset mounts and read-only source {#storage-dataset-pvc-mounts}


      reserve does not expose its declared PVC at the dataset path, or the source is writable; a wrong claim, missing mount or file overlay can hide the preserved dataset instead of recovering it. relay does not expose the declared target PVC at its dataset path; a wrong claim, missing mount or overlaid file can hide the target dataset instead of recovering it. The source reserve uses /archive and remains read-only; target relay uses /spool. Compare both the Deployment templates and their live owned Pods. Each declared path needs exactly one mount of its contracted PVC; a second mount below the dataset root must not cover a contracted file. Preserve the source data and both Deployment UIDs while recovering the target. `cat storage-contract.json; kubectl get deployments,pods -o yaml`.


      ### Readiness of the original workloads {#storage-original-workload-readiness}


      reserve is not rolled out with the contracted replica counts and ready owned Pods, or observation failed; a pending volume, failed mount or changed replica count can prevent checking the recovered data. relay is not rolled out with the contracted replica counts and ready owned Pods, or observation failed; a pending volume, failed mount or changed replica count can prevent checking the recovered data.  `kubectl get deployments,pods,replicasets -o wide`.


      ### Recover the regular files on the target {#storage-regular-file-recovery}


      reserve source files are missing, have the wrong type, size or SHA-256, or exec failed; changed source bytes, an overlaid dataset path or an unreadable original volume can prevent preserving the original dataset. relay dataset files are missing, have the wrong type, size or SHA-256, or exec failed; an empty target volume, incomplete copy, damaged source or file substitution can break recovery. Binding the previously empty target only provides capacity. Recover both index.html and payload.bin from the retained source without changing it. Compare regular-file types, byte sizes and SHA-256 against storage-contract.json on the target and source; for reserve use /archive. A correct HTTP page alone does not prove the binary payload is recovered. `kubectl exec deployment/relay -c worker -- stat -c ''%F:%s'' /spool/index.html /spool/payload.bin; kubectl exec deployment/relay -c worker -- sha256sum /spool/index.html /spool/payload.bin`.


      ### Publish the mounted source record {#storage-mounted-http-publication}


      reserve does not serve the exact original HTTP body or the request failed; serving the wrong directory, altered index.html or an unavailable source process can prevent publication of the retained source record. relay does not serve the exact preserved HTTP body or the request failed; serving the wrong directory, stale index.html or an unavailable process can hide an otherwise copied dataset.  `kubectl exec deployment/relay -c worker -- wget -qO- http://127.0.0.1:8080; kubectl exec deployment/reserve -c worker -- wget -qO- http://127.0.0.1:8080`.


      ## Try it


      Open the **kubernetes Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Does replacing the writer pod remove the marker from its PVC?


      ```bash

      cd ~/lab/examples/storage

      bash run.sh

      kubectl -n lab-storage get pvc,pod

      kubectl get storageclass

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The replacement pod reads the marker from the same claim. Deleting the example namespace also deletes the claim; do that only after the observation.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Проверяйте восстановление данных через привязки томов и интерфейсы приложения. Объявленный набор должен состоять из обычных файлов на нужном claim с совпадающими размерами и суммами; файл, перекрытый другим монтированием, не доказывает попадание байтов на этот том. Read-only-читатель источника и восстановленный target наблюдаются независимо. Lab хранилища проверяют привязку и сохранение данных, но не весь путь provisioning и переноса из отдельного сохранённого источника.


      PVC запрашивает хранилище, binding связывает его с томом, mount открывает байты контейнеру. Перезапуск pod и удаление PVC — разные операции. Стенд использует локальное хранилище узла и не моделирует репликацию облачного диска.


      В квесте 045 данные уже находятся в Bound PVC `route-data`. Направьте volume reader на этот PVC и подключите его только для чтения в `/data`; не удаляйте и не создавайте PVC заново. Сравните UID с `original-pvc-uid`, дождитесь rollout reader и проверьте содержимое `/data/route.txt`: `north-45`.


      ### Сохранение исходного claim {#retained-claim-identity}


      Исходный claim не имеет состояния Bound с сохранённым UID либо свидетельство недоступно: удаление и повторное создание меняет идентичность даже при прежнем имени. `kubectl get pvc route-data -o jsonpath=''{.metadata.uid} {.status.phase}''; cat original-pvc-uid`.


      ### Только чтение сохранённых данных {#retained-claim-mount}


      Шаблон reader не монтирует только исходный claim в /data только для чтения либо недоступен: могли остаться начальная ссылка retired-data, лишние монтирования или параметры subpath. В reader.yaml сохраните один том route-data и одно монтирование worker в /data без других монтирований в обычных и init-контейнерах. Только чтение можно задать на монтировании либо источнике PVC. Другие источники, subPath/subPathExpr, propagation или лишние параметры нарушают контракт. Исправляйте потребителя без пересоздания claim.


      ### Готовность потребителя хранилища {#retained-claim-readiness}


      reader не завершил rollout за 3 секунды: Pod мог сохранить ссылку на отсутствующий claim, ожидать хранилище или не запуститься. `kubectl describe pods; kubectl rollout status deployment/reader --timeout=10s`.


      ### Чтение сохранённого маршрута {#retained-claim-content}


      worker не прочитал north-45 из /data/route.txt: exec может завершиться ошибкой у неготового Pod либо видны неверный том, путь или изменённые данные. `kubectl exec deployment/reader -c worker -- cat /data/route.txt`.


      ### Сохранение идентичности источника и нагрузок {#storage-preserved-identities}


      Исходный Deployment или PVC источника сменил UID либо недоступен: удаление и пересоздание сохраняет имя, но теряет исходную идентичность. Несвязанный целевой PVC не входит в набор сохраняемых UID.  `kubectl get deployment relay reserve -o yaml; kubectl get pvc reserve -o yaml`.


      ### Привязка источника и наблюдение нагрузок {#storage-source-availability}


      Сохранённый PVC источника не Bound либо не удалось прочитать Pod и ReplicaSet: потеря привязки исходного тома или недоступность объектов Kubernetes мешают доказать восстановление исходных данных.  `kubectl get pvc reserve -o yaml; kubectl get pods,replicasets -o wide`.


      ### Сохранение образа worker {#storage-retained-worker-image}


      Проверяемый образ worker не совпадает с выданной ссылкой или digest: замена образа ради нужного ответа обходит требуемое восстановление смонтированных данных.  `kubectl get deployments,pods -o yaml`.


      ### Rollout цели перед наблюдением данных {#storage-rollout-observation-gate}


      Rollout relay не завершился за 3 секунды либо проверка данных остановилась без именованного маркера: причиной могут быть несвязанный целевой том, недоступные mount или отсутствующие и некорректные защищённые данные и ответы API.  `kubectl rollout status deployment/relay --timeout=10s; cat storage-contract.json`.


      ### Монтирование данных и источник только для чтения {#storage-dataset-pvc-mounts}


      reserve не использует объявленный PVC по пути данных либо источник доступен для записи: неверный claim, отсутствующий mount или перекрывающий файл могут скрывать исходные данные вместо восстановления. relay не использует объявленный целевой PVC по пути данных: неверный claim, отсутствующий mount или перекрывающий файл могут скрывать целевые данные вместо восстановления. Источник reserve использует /archive только для чтения, цель relay — /spool. Сравните шаблоны Deployment и принадлежащие им Pod. По объявленному пути нужен ровно один mount контрактного PVC; другой mount под корнем данных не должен перекрывать контрактный файл. Сохраните данные источника и UID обоих Deployment при восстановлении цели. `cat storage-contract.json; kubectl get deployments,pods -o yaml`.


      ### Готовность исходных нагрузок {#storage-original-workload-readiness}


      reserve не завершил rollout с нужным числом реплик и готовыми принадлежащими ему Pod либо наблюдение не удалось: ожидающий том, сбой mount или другое число реплик мешают проверке восстановленных данных. relay не завершил rollout с нужным числом реплик и готовыми принадлежащими ему Pod либо наблюдение не удалось: ожидающий том, сбой mount или другое число реплик мешают проверке восстановленных данных.  `kubectl get deployments,pods,replicasets -o wide`.


      ### Восстановление обычных файлов на цели {#storage-regular-file-recovery}


      Исходные файлы reserve отсутствуют, имеют другой тип, размер или SHA-256 либо exec завершился ошибкой: изменённые байты источника, перекрытый путь данных или недоступный исходный том мешают сохранению исходных данных. Файлы данных relay отсутствуют, имеют другой тип, размер или SHA-256 либо exec завершился ошибкой: причиной могут быть пустой целевой том, неполное копирование, повреждённый источник или подмена файлов. Привязка пустой цели даёт только ёмкость. Восстановите index.html и payload.bin из сохранённого источника без его изменения. Сравните тип обычного файла, размер и SHA-256 со storage-contract.json на цели и источнике; для reserve используйте /archive. Одной правильной HTTP-страницы недостаточно для подтверждения бинарных данных. `kubectl exec deployment/relay -c worker -- stat -c ''%F:%s'' /spool/index.html /spool/payload.bin; kubectl exec deployment/relay -c worker -- sha256sum /spool/index.html /spool/payload.bin`.


      ### Публикация смонтированной исходной записи {#storage-mounted-http-publication}


      reserve не отдаёт точное исходное тело HTTP либо запрос завершился ошибкой: другой обслуживаемый каталог, изменённый index.html или недоступный процесс источника мешают публикации сохранённой исходной записи. relay не отдаёт точное сохранённое тело HTTP либо запрос завершился ошибкой: другой обслуживаемый каталог, устаревший index.html или недоступный процесс могут скрывать уже скопированные данные.  `kubectl exec deployment/relay -c worker -- wget -qO- http://127.0.0.1:8080; kubectl exec deployment/reserve -c worker -- wget -qO- http://127.0.0.1:8080`.


      ## Попробуйте


      Откройте лабораторию **kubernetes**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Замена writer-пода удаляет файл из PVC?


      ```bash

      cd ~/lab/examples/storage

      bash run.sh

      kubectl -n lab-storage get pvc,pod

      kubectl get storageclass

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Новый pod читает файл через тот же PVC. Очистка namespace удаляет и PVC; выполняйте её после наблюдения.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Weryfikuj odzyskanie danych przez powiązania wolumenów i interfejsy aplikacji. Zadeklarowany zestaw powinien być zwykłymi plikami na właściwym claim z zgodnymi rozmiarami i sumami; plik zasłonięty innym montowaniem nie dowodzi obecności bajtów na tym wolumenie. Czytnik źródłowy tylko do odczytu i przywrócony cel można obserwować osobno. Lab pamięci trwałej pokazują wiązanie i zachowanie danych, ale nie pełny provisioning i kopiowanie z osobnego zachowanego źródła.


      Roszczenie wymaga przechowywania; binding wybiera głośność; montowanie udostępnia jego bajty kontenerowi. Ponowne uruchomienie pod to nie ta sama operacja, co usunięcie PVC. Laboratorium korzysta z pamięci masowej w węźle lokalnym, dlatego nie demonstruje replikacji dysku w chmurze.


      W zadaniu 045 dane są już w PVC `route-data` w stanie Bound. Skieruj wolumen readera na ten PVC i zamontuj go tylko do odczytu w `/data`; nie usuwaj ani nie twórz PVC ponownie. Porównaj UID z `original-pvc-uid`, poczekaj na rollout readera i sprawdź, czy `/data/route.txt` zawiera `north-45`.


      ### Zachowanie pierwotnego claim {#retained-claim-identity}


      Pierwotny claim nie ma stanu Bound z zapisanym UID lub nie można odczytać dowodu; usunięcie i odtworzenie zmienia tożsamość mimo tej samej nazwy. `kubectl get pvc route-data -o jsonpath=''{.metadata.uid} {.status.phase}''; cat original-pvc-uid`.


      ### Montowanie zachowanych danych tylko do odczytu {#retained-claim-mount}


      Szablon reader nie montuje wyłącznie istniejącego claim tylko do odczytu w /data lub jest nieczytelny; mogła pozostać referencja retired-data, dodatkowe montowania lub opcje subpath. W reader.yaml zachowaj jeden wolumen route-data i jedno montowanie worker w /data bez dodatkowych montowań w innych kontenerach i init kontenerach. Tylko odczyt można ustawić na montowaniu lub źródle PVC. Inne źródła, subPath/subPathExpr, propagacja lub dodatkowe opcje zmieniają kontrakt. Popraw odbiorcę bez odtwarzania claim.


      ### Gotowość odbiorcy danych {#retained-claim-readiness}


      reader nie zakończył rollout w 3 sekundy; Pod może nadal wskazywać nieistniejący claim, czekać na pamięć lub nie uruchamiać się. `kubectl describe pods; kubectl rollout status deployment/reader --timeout=10s`.


      ### Odczyt zachowanej trasy {#retained-claim-content}


      Worker nie odczytał north-45 z /data/route.txt; exec może zawieść przy niegotowym Podzie albo widoczny jest zły wolumen, ścieżka lub zmienione dane. `kubectl exec deployment/reader -c worker -- cat /data/route.txt`.


      ### Zachowanie tożsamości źródła i aplikacji {#storage-preserved-identities}


      Pierwotny Deployment lub źródłowy PVC zmienił UID albo jest nieczytelny; usunięcie i odtworzenie zachowuje nazwę, lecz traci tożsamość. Niezwiązany docelowy PVC nie należy do zachowanego zestawu UID.  `kubectl get deployment relay reserve -o yaml; kubectl get pvc reserve -o yaml`.


      ### Powiązanie źródła i obserwacje aplikacji {#storage-source-availability}


      Zachowany źródłowy PVC nie jest Bound lub obserwacja Pod/ReplicaSet zawiodła; utrata powiązania wolumenu lub niedostępne obiekty Kubernetes blokują potwierdzenie odtworzenia pierwotnych danych.  `kubectl get pvc reserve -o yaml; kubectl get pods,replicasets -o wide`.


      ### Zachowanie obrazu worker {#storage-retained-worker-image}


      Sprawdzany obraz worker nie odpowiada dostarczonej referencji lub digest; zastąpienie obrazu dla uzyskania odpowiedzi omija wymagane odtworzenie zamontowanych danych.  `kubectl get deployments,pods -o yaml`.


      ### Rollout celu przed obserwacją danych {#storage-rollout-observation-gate}


      Rollout relay nie zakończył się w 3 sekundy lub obserwator danych zatrzymał się bez markera; przyczyną mogą być niezwiązany cel, niedostępne montowania lub brakujące i błędne dane chronione/API.  `kubectl rollout status deployment/relay --timeout=10s; cat storage-contract.json`.


      ### Montowanie danych i źródło tylko do odczytu {#storage-dataset-pvc-mounts}


      reserve nie udostępnia zadeklarowanego PVC w ścieżce danych lub źródło jest zapisywalne; błędny claim, brak montowania lub nakładka pliku może ukryć zachowane dane. relay nie udostępnia zadeklarowanego docelowego PVC w ścieżce danych; błędny claim, brak montowania lub nakładka pliku może ukryć dane celu. Źródło reserve używa /archive tylko do odczytu, cel relay używa /spool. Porównaj szablony Deployment i ich własne Pody. W zadeklarowanej ścieżce musi być dokładnie jedno montowanie wymaganego PVC; drugie pod korzeniem danych nie może przesłaniać pliku kontraktu. Zachowaj źródło i oba UID Deployment podczas odtwarzania celu. `cat storage-contract.json; kubectl get deployments,pods -o yaml`.


      ### Gotowość pierwotnych aplikacji {#storage-original-workload-readiness}


      reserve nie ukończył rollout z wymaganą liczbą replik i gotowymi własnymi Podami lub obserwacja zawiodła; oczekujący wolumen, błąd montowania lub zmieniona liczba replik blokują kontrolę danych. relay nie ukończył rollout z wymaganą liczbą replik i gotowymi własnymi Podami lub obserwacja zawiodła; oczekujący wolumen, błąd montowania lub zmieniona liczba replik blokują kontrolę danych.  `kubectl get deployments,pods,replicasets -o wide`.


      ### Odtworzenie zwykłych plików na celu {#storage-regular-file-recovery}


      Plików źródła reserve brakuje, mają zły typ, rozmiar lub SHA-256 albo exec zawiódł; zmienione bajty źródła, przesłonięta ścieżka lub nieczytelny pierwotny wolumen blokują zachowanie oryginalnych danych. Plików danych relay brakuje, mają zły typ, rozmiar lub SHA-256 albo exec zawiódł; pusty wolumen celu, niepełna kopia, uszkodzone źródło lub podstawienie plików może psuć odtworzenie. Powiązanie pustego celu daje tylko pojemność. Odtwórz index.html i payload.bin z zachowanego źródła bez jego zmiany. Porównaj zwykły typ pliku, bajty i SHA-256 ze storage-contract.json na celu i źródle; dla reserve użyj /archive. Sama poprawna strona HTTP nie potwierdza odtworzenia danych binarnych. `kubectl exec deployment/relay -c worker -- stat -c ''%F:%s'' /spool/index.html /spool/payload.bin; kubectl exec deployment/relay -c worker -- sha256sum /spool/index.html /spool/payload.bin`.


      ### Publikacja zamontowanego rekordu źródła {#storage-mounted-http-publication}


      reserve nie serwuje dokładnej pierwotnej treści HTTP lub żądanie zawiodło; inny katalog, zmieniony index.html lub niedostępny proces źródła blokuje publikację zachowanego rekordu źródłowego. relay nie serwuje dokładnej zachowanej treści HTTP lub żądanie zawiodło; inny katalog, stary index.html lub niedostępny proces może ukrywać skopiowane dane.  `kubectl exec deployment/relay -c worker -- wget -qO- http://127.0.0.1:8080; kubectl exec deployment/reserve -c worker -- wget -qO- http://127.0.0.1:8080`.


      ## Wypróbuj


      Otwórz laboratorium **kubernetes** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy wymiana modułu piszącego pod powoduje usunięcie znacznika z jego PVC?


      ```bash

      cd ~/lab/examples/storage

      bash run.sh

      kubectl -n lab-storage get pvc,pod

      kubectl get storageclass

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Zamiennik pod odczytuje znacznik z tego samego roszczenia. Usunięcie przykładu namespace powoduje również usunięcie roszczenia; zrób to dopiero po obserwacji.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Verifica la recuperación mediante enlaces de volumen e interfaces de aplicación. El conjunto declarado debe ser archivos regulares en el claim previsto con tamaños y sumas coincidentes; un archivo superpuesto desde otro montaje no demuestra datos en ese volumen. El lector fuente de solo lectura y el destino restaurado se observan por separado. Los Labs de almacenamiento muestran enlace y persistencia, no la recuperación completa de provisión y copia desde una fuente separada conservada.


      Un reclamo solicita almacenamiento; binding selecciona un volumen; El montaje pone sus bytes a disposición de un contenedor. Un reinicio de pod no es la misma operación que eliminar su PVC. El laboratorio utiliza almacenamiento de nodo local, por lo que no demuestra la replicación de discos en la nube.


      En el ejercicio 045, los datos ya están en el PVC `route-data` en estado Bound. Apunta el volumen del reader a ese PVC y móntalo en `/data` en solo lectura; no borres ni recrees el PVC. Compara su UID con `original-pvc-uid`, espera el rollout del reader y verifica que `/data/route.txt` contiene `north-45`.


      ### Conservar el claim original {#retained-claim-identity}


      El claim original no está Bound con su UID guardado o no se puede leer la evidencia; borrarlo y recrearlo cambia su identidad aunque conserve el nombre. `kubectl get pvc route-data -o jsonpath=''{.metadata.uid} {.status.phase}''; cat original-pvc-uid`.


      ### Montar datos conservados de solo lectura {#retained-claim-mount}


      La plantilla reader no monta solo el claim existente en /data de solo lectura o no puede leerse; pueden persistir retired-data, montajes extra u opciones subpath. En reader.yaml conserve un volumen route-data y un montaje worker en /data, sin montajes extra en otros contenedores o init. Solo lectura puede fijarse en el montaje o la fuente PVC. Otras fuentes, subPath/subPathExpr, propagación u opciones adicionales cambian el contrato. Corrija el consumidor sin recrear el claim.


      ### Disponibilidad del consumidor de datos {#retained-claim-readiness}


      reader no completó el despliegue en 3 segundos; el Pod puede seguir apuntando a un claim inexistente, esperar almacenamiento o no arrancar. `kubectl describe pods; kubectl rollout status deployment/reader --timeout=10s`.


      ### Leer la ruta conservada {#retained-claim-content}


      worker no leyó north-45 de /data/route.txt; exec puede fallar si el Pod no está listo o puede verse un volumen, ruta o datos alterados incorrectos. `kubectl exec deployment/reader -c worker -- cat /data/route.txt`.


      ### Conservar identidades de origen y aplicaciones {#storage-preserved-identities}


      Un Deployment original o PVC de origen cambió UID o no pudo leerse; recrearlo puede conservar nombre y perder identidad. El PVC destino sin enlazar no pertenece al conjunto de UID conservados.  `kubectl get deployment relay reserve -o yaml; kubectl get pvc reserve -o yaml`.


      ### Enlace de origen y observación de aplicaciones {#storage-source-availability}


      El PVC de origen conservado no está Bound o falló observar Pod/ReplicaSet; perder el enlace del volumen o no acceder a objetos Kubernetes impide acreditar recuperación desde los datos originales.  `kubectl get pvc reserve -o yaml; kubectl get pods,replicasets -o wide`.


      ### Conservar imagen worker {#storage-retained-worker-image}


      La imagen worker comprobada no coincide con la referencia o digest suministrado; sustituir la imagen para fabricar una respuesta elude la recuperación de los datos montados.  `kubectl get deployments,pods -o yaml`.


      ### Rollout destino antes de observar datos {#storage-rollout-observation-gate}


      El rollout relay no terminó en 3 segundos o la observación de datos acabó sin marcador; destino sin enlazar, montajes no disponibles o datos protegidos/API ausentes o malformados pueden explicarlo.  `kubectl rollout status deployment/relay --timeout=10s; cat storage-contract.json`.


      ### Montajes de datos y origen de solo lectura {#storage-dataset-pvc-mounts}


      reserve no expone su PVC declarado en la ruta de datos o el origen permite escritura; claim incorrecto, montaje ausente o archivo superpuesto puede ocultar los datos conservados. relay no expone el PVC destino declarado en su ruta de datos; claim incorrecto, montaje ausente o archivo superpuesto puede ocultar los datos destino. El origen reserve usa /archive de solo lectura; destino relay usa /spool. Compare plantillas Deployment y sus Pods propios. Cada ruta requiere exactamente un montaje del PVC contratado; otro montaje bajo la raíz no debe cubrir un archivo contratado. Conserve datos de origen y ambos UID Deployment al recuperar destino. `cat storage-contract.json; kubectl get deployments,pods -o yaml`.


      ### Disponibilidad de aplicaciones originales {#storage-original-workload-readiness}


      reserve no completó rollout con las réplicas contratadas y Pods propios listos o falló observarlo; volumen pendiente, montaje fallido o número de réplicas cambiado puede impedir comprobar datos recuperados. relay no completó rollout con las réplicas contratadas y Pods propios listos o falló observarlo; volumen pendiente, montaje fallido o número de réplicas cambiado puede impedir comprobar datos recuperados.  `kubectl get deployments,pods,replicasets -o wide`.


      ### Recuperar archivos regulares en destino {#storage-regular-file-recovery}


      Faltan archivos de origen reserve, tienen tipo, tamaño o SHA-256 incorrectos, o falló exec; bytes de origen cambiados, ruta superpuesta o volumen original ilegible impiden conservar los datos originales. Faltan archivos de datos relay, tienen tipo, tamaño o SHA-256 incorrectos, o falló exec; volumen vacío, copia incompleta, origen dañado o sustitución de archivos puede romper la recuperación. Enlazar el destino vacío solo aporta capacidad. Recupere index.html y payload.bin del origen conservado sin modificarlo. Compare tipo regular, bytes y SHA-256 con storage-contract.json en ambos; para reserve use /archive. Una página HTTP correcta no acredita por sí sola recuperar datos binarios. `kubectl exec deployment/relay -c worker -- stat -c ''%F:%s'' /spool/index.html /spool/payload.bin; kubectl exec deployment/relay -c worker -- sha256sum /spool/index.html /spool/payload.bin`.


      ### Publicar registro de origen montado {#storage-mounted-http-publication}


      reserve no sirve el cuerpo HTTP original exacto o falló la petición; otro directorio, index.html alterado o proceso de origen no disponible impide publicar el registro de origen conservado. relay no sirve el cuerpo HTTP conservado exacto o falló la petición; otro directorio, index.html obsoleto o proceso no disponible puede ocultar datos ya copiados.  `kubectl exec deployment/relay -c worker -- wget -qO- http://127.0.0.1:8080; kubectl exec deployment/reserve -c worker -- wget -qO- http://127.0.0.1:8080`.


      ## Pruébalo


      Abra el laboratorio **kubernetes** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿Reemplazar el escritor pod elimina el marcador de su PVC?


      ```bash

      cd ~/lab/examples/storage

      bash run.sh

      kubectl -n lab-storage get pvc,pod

      kubectl get storageclass

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. El reemplazo pod lee el marcador del mismo reclamo. Al eliminar el ejemplo namespace también se elimina la reclamación; hazlo sólo después de la observación.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh`, luego `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Prüfe Datenwiederherstellung über Volume-Bindungen und Anwendungsschnittstellen. Der deklarierte Datensatz soll aus regulären Dateien auf dem vorgesehenen Claim mit passenden Größen und Prüfsummen bestehen; ein Datei-Overlay aus einem anderen Mount belegt keine Daten auf diesem Volume. Schreibgeschützter Quellleser und wiederhergestelltes Ziel lassen sich unabhängig beobachten. Die Speicher-Labs üben Bindung und Datenerhalt, nicht den vollständigen Provisionierungs-/Kopierpfad aus einer getrennten erhaltenen Quelle.


      Ein Anspruch verlangt eine Aufbewahrung; binding wählt ein Volume aus; Durch das Mounten werden seine Bytes einem Container zur Verfügung gestellt. Ein pod-Neustart ist nicht derselbe Vorgang wie das Löschen seines PVC. Das Lab verwendet lokalen Knotenspeicher und demonstriert daher keine Cloud-Festplattenreplikation.


      In Aufgabe 045 liegen die Daten bereits im Bound-PVC `route-data`. Verweise mit dem Reader-Volume auf diesen PVC und mounte ihn unter `/data` schreibgeschützt; lösche oder erstelle den PVC nicht neu. Vergleiche seine UID mit `original-pvc-uid`, warte auf den Reader-Rollout und prüfe, dass `/data/route.txt` `north-45` enthält.


      ### Ursprünglichen Claim erhalten {#retained-claim-identity}


      Der ursprüngliche Claim ist nicht Bound mit gespeicherter UID oder sein Nachweis ist unlesbar; Löschen und Neuerstellen ändern die Identität auch bei gleichem Namen. `kubectl get pvc route-data -o jsonpath=''{.metadata.uid} {.status.phase}''; cat original-pvc-uid`.


      ### Erhaltene Daten schreibgeschützt mounten {#retained-claim-mount}


      Die reader-Vorlage mountet nicht ausschließlich den vorhandenen Claim schreibgeschützt unter /data oder ist unlesbar; möglicherweise bleiben retired-data, zusätzliche Mounts oder Subpath-Optionen. Behalten Sie in reader.yaml ein route-data-Volume und einen worker-Mount unter /data ohne weitere Mounts in anderen oder Init-Containern. Schreibschutz kann am Mount oder an der PVC-Quelle gesetzt werden. Andere Quellen, subPath/subPathExpr, Propagation oder zusätzliche Optionen ändern den Vertrag. Korrigieren Sie den Verbraucher, ohne den Daten-Claim neu anzulegen.


      ### Bereitschaft des Speicherverbrauchers {#retained-claim-readiness}


      reader hat den Rollout nicht in 3 Sekunden abgeschlossen; der Pod verweist möglicherweise noch auf einen fehlenden Claim, wartet auf Speicher oder startet nicht. `kubectl describe pods; kubectl rollout status deployment/reader --timeout=10s`.


      ### Erhaltene Route lesen {#retained-claim-content}


      Der worker las nicht north-45 aus /data/route.txt; exec kann bei einem nicht bereiten Pod scheitern oder ein falsches Volume, ein falscher Pfad beziehungsweise veränderte Daten sind sichtbar. `kubectl exec deployment/reader -c worker -- cat /data/route.txt`.


      ### Quell- und Workload-Identitäten erhalten {#storage-preserved-identities}


      Ein ursprüngliches Deployment oder die Quell-PVC hat ihre UID geändert oder konnte nicht gelesen werden; Neuerstellung kann den Namen erhalten und die Identität verlieren. Die ungebundene Ziel-PVC gehört nicht zu diesen erhaltenen UIDs.  `kubectl get deployment relay reserve -o yaml; kubectl get pvc reserve -o yaml`.


      ### Quellbindung und Workload-Beobachtung {#storage-source-availability}


      Die erhaltene Quell-PVC ist nicht Bound oder die Pod-/ReplicaSet-Beobachtung schlug fehl; eine verlorene Volumenbindung oder unerreichbare Kubernetes-Objekte verhindern den Nachweis der Wiederherstellung aus dem ursprünglichen Datenbestand.  `kubectl get pvc reserve -o yaml; kubectl get pods,replicasets -o wide`.


      ### worker Image erhalten {#storage-retained-worker-image}


      Das geprüfte worker Image entspricht nicht mehr der gelieferten Referenz oder dem Digest; ein Austausch des Anwendungsimages für eine passende Antwort umgeht die erforderliche Wiederherstellung der eingebundenen Daten.  `kubectl get deployments,pods -o yaml`.


      ### Ziel-Rollout vor Datenbeobachtung {#storage-rollout-observation-gate}


      Der Rollout von relay wurde nicht innerhalb von 3 Sekunden abgeschlossen oder die Datenbeobachtung endete ohne benannten Marker; ungebundenes Ziel, nicht verfügbare Mounts oder fehlende beziehungsweise fehlerhafte geschützte/API-Daten können die Ursache sein.  `kubectl rollout status deployment/relay --timeout=10s; cat storage-contract.json`.


      ### Daten-Mounts und schreibgeschützte Quelle {#storage-dataset-pvc-mounts}


      reserve stellt die deklarierte PVC nicht am Datenpfad bereit oder die Quelle ist beschreibbar; falscher Claim, fehlender Mount oder Dateiüberlagerung kann den erhaltenen Datenbestand verdecken. relay stellt die deklarierte Ziel-PVC nicht am Datenpfad bereit; falscher Claim, fehlender Mount oder Dateiüberlagerung kann den Zieldatenbestand verdecken. Die Quelle reserve nutzt /archive schreibgeschützt; das Ziel relay nutzt /spool. Vergleichen Sie Deployment-Vorlagen und deren eigene Pods. Jeder deklarierte Pfad benötigt genau einen Mount der vertraglichen PVC; ein weiterer Mount unterhalb des Datenwurzelpfads darf keine Vertragsdatei verdecken. Erhalten Sie Quelldaten und beide Deployment-UIDs während der Zielwiederherstellung. `cat storage-contract.json; kubectl get deployments,pods -o yaml`.


      ### Bereitschaft ursprünglicher Workloads {#storage-original-workload-readiness}


      reserve ist nicht mit den vereinbarten Replikazahlen und bereiten eigenen Pods ausgerollt oder die Beobachtung schlug fehl; ein wartendes Volumen, Mount-Fehler oder geänderte Replikazahl verhindert die Datenprüfung. relay ist nicht mit den vereinbarten Replikazahlen und bereiten eigenen Pods ausgerollt oder die Beobachtung schlug fehl; ein wartendes Volumen, Mount-Fehler oder geänderte Replikazahl verhindert die Datenprüfung.  `kubectl get deployments,pods,replicasets -o wide`.


      ### Reguläre Dateien am Ziel wiederherstellen {#storage-regular-file-recovery}


      Quelldateien von reserve fehlen, haben falschen Typ, Größe oder SHA-256 oder exec schlug fehl; geänderte Quellbytes, ein überlagerter Datenpfad oder ein unlesbares ursprüngliches Volumen verhindern den Erhalt der Originaldaten. Datendateien von relay fehlen, haben falschen Typ, Größe oder SHA-256 oder exec schlug fehl; ein leeres Zielvolumen, unvollständige Kopie, beschädigte Quelle oder Dateiersetzung kann die Wiederherstellung verletzen. Das Binden des leeren Ziels liefert lediglich Kapazität. Stellen Sie index.html und payload.bin aus der erhaltenen Quelle wieder her, ohne sie zu ändern. Vergleichen Sie regulären Dateityp, Bytegröße und SHA-256 mit storage-contract.json an Ziel und Quelle; verwenden Sie bei reserve /archive. Eine korrekte HTTP-Seite allein belegt keine Wiederherstellung der Binärdaten. `kubectl exec deployment/relay -c worker -- stat -c ''%F:%s'' /spool/index.html /spool/payload.bin; kubectl exec deployment/relay -c worker -- sha256sum /spool/index.html /spool/payload.bin`.


      ### Eingebundenen Quelldatensatz veröffentlichen {#storage-mounted-http-publication}


      reserve liefert nicht den exakten ursprünglichen HTTP-Inhalt oder die Anfrage schlug fehl; falsches Auslieferungsverzeichnis, geänderte index.html oder ein unerreichbarer Quellprozess verhindert die Veröffentlichung des erhaltenen Quelldatensatzes. relay liefert nicht den exakt erhaltenen HTTP-Inhalt oder die Anfrage schlug fehl; falsches Auslieferungsverzeichnis, veraltete index.html oder ein unerreichbarer Prozess kann bereits kopierte Daten verdecken.  `kubectl exec deployment/relay -c worker -- wget -qO- http://127.0.0.1:8080; kubectl exec deployment/reserve -c worker -- wget -qO- http://127.0.0.1:8080`.


      ## Probieren Sie es aus


      Öffnen Sie das **kubernetes Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Entfernt das Ersetzen des Writers pod den Marker von seinem PVC?


      ```bash

      cd ~/lab/examples/storage

      bash run.sh

      kubectl -n lab-storage get pvc,pod

      kubectl get storageclass

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Der Ersatz pod liest den Marker aus demselben Anspruch. Durch das Löschen des Beispiels namespace wird auch der Anspruch gelöscht; Mach das erst nach der Beobachtung.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-storage
kubernetes-12:
  profile: kubernetes
  example: configuration
  source_hash: 348a6c54b9cbb7f94d4d2b063d3eb2bfeea996d3ef987d9740033135c365b114
  content:
    en: 'Changing a ConfigMap updates the API object. A running process keeps the environment it received at startup. A projected ConfigMap volume can update later; the application must still reread the file.


      A handover has two pieces of evidence: the stored publication and the running consumer’s source and value. Follow the revision from the fleet observation to the ConfigMap, then inspect the Pod template and the worker.


      In quest 030, after restoring the managed release marker, inspect the reader''s `RELEASE` environment and readiness check. Update it to `release-30` and verify the relay rollout; the file/state repair and running workload are separate stages.


      In quest 031, the Secret is named `station` and its key is `route`; the reader''s `secretKeyRef` must name both. Correct the reference in `reader.yaml` without copying the value into the workload or changing the Secret. After the rollout, verify the reference and that the reader can write `north` to `/tmp/route` without printing credentials.


      ### Release environment and relay readiness {#relay-release-readiness}


      In quest 010, after the fleet stage, the `relay` process must receive `RELEASE=release-10`. A new process reads its environment at startup, so wait for the Deployment rollout and inspect the running process value as well as the ready status. A successful fleet delivery does not by itself update the Kubernetes reader. The relay readiness probe uses that same value, so an old value keeps the Pod unready.


      ### ConfigMap value in a running process {#relay-route-env}


      In quest 007, Deployment `relay` reads the `route` key from ConfigMap `dispatch` as `ROUTE`. Change that key to `north`, restart the Deployment so a new process receives the value, and wait for rollout. Verify `kubectl exec deployment/relay -c worker -- printenv ROUTE` prints `north`; the ConfigMap value alone does not prove that the running process received it.


      ### Approved release in the relay process {#relay-approved-environment}


      In quest 030, deployment.yaml initially supplies RELEASE=retired and the readiness probe requires release-30. Updating the local file does not change the Pod environment. Update the Deployment, wait for rollout, and inspect RELEASE in worker. If the rollout or exec command fails, inspect Pod events and readiness before assuming the value itself is wrong.


      ### Secret object and data key {#reader-secret-reference}


      In quest 031, station.yaml supplies Secret station with key route, while reader.yaml initially references route_name. The object can exist while the requested key is absent, preventing container startup and rollout. Compare Pod events and key names with the worker ROUTE entry: its valueFrom must contain only secretKeyRef for station and route, with no embedded nonempty value. Apply reader.yaml after correction; do not copy Secret data into the Deployment.


      ### Route file at process startup {#reader-route-startup}


      In quest 031, worker writes ROUTE to /tmp/route once at startup. A missing Secret key can prevent that write; an old Pod can retain its earlier environment after a Secret update. Wait for the corrected rollout and read the file in worker of the selected app=reader Pod. A failed Pod lookup or exec also prevents this observation; inspect those errors before interpreting the file content.


      ### Effective source route {#progressive-consumer-route}


      The backup ROUTE is not north or cannot be read; the initial literal retired may remain, a ConfigMap reference may be shadowed, old Pods may retain an earlier environment, or exec failed.


      ### Intact original publication data {#progressive-source-data}


      The original source entries differ or the ConfigMap cannot be observed; editing the route/publication record, generating a new producer identity or querying the wrong data can break the preserved dataset. Keep every original entry in the source ConfigMap, including ROUTE, PRODUCER_ID and the publication record. Matching only the route is insufficient when the publication identity changes. Observation errors while reading that ConfigMap use the same source marker and do not prove its data was edited.


      ### Project the source into the producer {#progressive-source-projection}


      The producer does not mount a volume backed by the original source ConfigMap; the initial temporary HTTP directory may still be used, or the worker mount and volume reference do not connect. The producer needs a ConfigMap-backed or projected volume referencing the original source and a worker mount connected to that volume name. Then its HTTP process must serve the source record, rather than an unrelated temporary directory. The check observes the source connection; it does not require one particular mount-path spelling.


      ### Backup references and runtime record {#progressive-consumer-source}


      The backup does not consume and publish the original source consistently; a literal or later environment override, missing projection, stale Pods, mismatched runtime record or failed API/exec observation may explain it. For the backup, the effective ROUTE and PRODUCER_ID references must resolve to the same keys in the original source ConfigMap. The last explicit environment entry overrides envFrom; later envFrom sources can shadow earlier values. Compare both declaration and actual container environment after a rollout, projection and both public JSON records. A literal north value may pass the first route observation but cannot establish the required source reference.


      ### Adopt the fleet release in the process {#fleet-relay-running-release}


      The relay rollout did not finish or its process RELEASE is not release-60; the supplied literal retired environment, an unavailable ConfigMap/key, stale Pods or a failed exec can prevent adopting the fleet release.  `kubectl rollout status deployment/relay --timeout=10s; kubectl exec deployment/relay -c worker -- printenv RELEASE`.


      ### Bind to the original release publication {#fleet-original-release-publication}


      The relay release is not bound to the original fleet publication; replacing its ConfigMap, retaining retired revision data, using a literal/wrong key reference, duplicate RELEASE entries or missing protected/API data can explain it. The second stage freezes the consistent fleet HTTP release and the original relay-release ConfigMap UID. Patch that existing ConfigMap to the frozen release and use exactly one worker RELEASE entry referencing relay-release/revision with no nonempty literal value. Correct process output alone does not establish that source binding. `cat fleet-release.txt release-config-uid; kubectl get configmap relay-release -o yaml; kubectl get deployment relay -o yaml`.


      ## Try it


      Open the **kubernetes Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Will the process environment and mounted file change at the same instant?


      ```bash

      cd ~/lab/examples/configuration

      bash run.sh

      kubectl -n lab-configuration get configmap settings -o yaml

      kubectl -n lab-configuration get pod reader

      bash check.sh

      ```


      > [!question]- Expected result

      > No. MESSAGE stays first; the mounted file eventually becomes second. The check waits for that specific value with a finite timeout.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.



      A generated configuration can contain the current desired data while an existing process reads an older representation. Compare actual producer and consumer responses with the source; readiness and controller acknowledgement alone do not establish delivery through the complete chain. Configuration Labs exercise projection behavior, but do not rehearse complete custom-resource-driven recovery.'
    ru: 'Изменение ConfigMap обновляет объект API. Работающий процесс сохраняет окружение, полученное при старте. Файл в проецируемом томе может обновиться позже, но приложение ещё должно его перечитать.


      Проверьте сохранённую публикацию, источник и значение у работающего потребителя. Проследите ревизию fleet до ConfigMap, затем проверьте шаблон Pod и контейнер worker.


      В квесте 030 после восстановления управляемого маркера релиза изучите переменную `RELEASE` reader и проверку готовности. Установите `release-30` и проверьте rollout relay: исправление файла/state и работающий workload — отдельные этапы.


      В квесте 031 Secret называется `station`, а его ключ — `route`; в `secretKeyRef` reader нужно указать оба имени. Исправьте ссылку в `reader.yaml`, не копируя значение в workload и не меняя Secret. После rollout проверьте ссылку и то, что reader записывает `north` в `/tmp/route`, не выводя учетные данные.


      ### Окружение релиза и готовность relay {#relay-release-readiness}


      В квесте 010 после этапа fleet процесс `relay` должен получить `RELEASE=release-10`. Новый процесс читает окружение при запуске, поэтому дождитесь rollout Deployment и проверьте значение у работающего процесса и его готовность. Успешная доставка во fleet сама по себе не обновляет Kubernetes reader. Проба готовности relay проверяет это же значение, поэтому со старым значением Pod не становится готовым.


      ### Значение ConfigMap в работающем процессе {#relay-route-env}


      В квесте 007 Deployment `relay` читает ключ `route` из ConfigMap `dispatch` как `ROUTE`. Измените ключ на `north`, перезапустите Deployment, чтобы новый процесс получил значение, и дождитесь rollout. Проверьте, что `kubectl exec deployment/relay -c worker -- printenv ROUTE` выводит `north`: значение ConfigMap само по себе не доказывает, что работающий процесс его получил.


      ### Одобренный релиз в процессе relay {#relay-approved-environment}


      В квесте 030 deployment.yaml изначально передаёт RELEASE=retired, а readinessProbe требует release-30. Изменение локального файла не меняет окружение Pod. Обновите Deployment, дождитесь rollout и проверьте RELEASE в worker. Если rollout или exec завершается ошибкой, изучите события Pod и готовность, прежде чем считать неверным само значение.


      ### Объект Secret и ключ данных {#reader-secret-reference}


      В квесте 031 station.yaml задаёт Secret station с ключом route, а reader.yaml изначально ссылается на route_name. Объект может существовать без нужного ключа, что мешает запуску контейнера и rollout. Сравните события Pod и имена ключей с ROUTE у worker: valueFrom должен содержать только secretKeyRef на station и route без непустого встроенного значения. После исправления примените reader.yaml; не копируйте данные Secret в Deployment.


      ### Файл маршрута при запуске процесса {#reader-route-startup}


      В квесте 031 worker один раз записывает ROUTE в /tmp/route при запуске. Отсутствующий ключ Secret может помешать записи; старый Pod может сохранить прежнее окружение после изменения Secret. Дождитесь исправленного rollout и прочитайте файл в worker выбранного Pod app=reader. Ошибка поиска Pod или exec также мешает наблюдению: изучите её до оценки содержимого файла.


      ### Фактический маршрут источника {#progressive-consumer-route}


      ROUTE резервной нагрузки не равен north либо недоступен: мог остаться начальный литерал retired, ссылка ConfigMap перекрыта, старые Pod сохранили прежнее окружение или exec завершился ошибкой.


      ### Неизменённые исходные данные публикации {#progressive-source-data}


      Исходные записи отличаются либо ConfigMap недоступен: правка маршрута или записи публикации, создание новой идентичности производителя либо чтение других данных нарушают сохранённый набор. Сохраните каждую исходную запись ConfigMap, включая ROUTE, PRODUCER_ID и запись публикации. Одного совпадения маршрута недостаточно при изменённой идентичности публикации. Ошибки чтения ConfigMap имеют тот же маркер и не доказывают изменение данных.


      ### Проекция источника в производитель {#progressive-source-projection}


      Производитель не монтирует том исходного ConfigMap: мог остаться начальный временный каталог HTTP либо монтирование worker не связано с нужным томом. Производителю нужен том ConfigMap или projected с исходным источником и монтирование worker, связанное с именем этого тома. HTTP должен выдавать запись источника, а не посторонний временный каталог. Проверяется связь с источником, а не один конкретный путь монтирования.


      ### Ссылки резерва и запись времени выполнения {#progressive-consumer-source}


      Резервная нагрузка не потребляет и не публикует исходные данные согласованно: причиной могут быть литерал или перекрывающее окружение, отсутствие монтирования, старые Pod, неверная запись или сбой API/exec. У резерва фактические ссылки ROUTE и PRODUCER_ID должны указывать на одноимённые ключи исходного ConfigMap. Последняя явная запись env перекрывает envFrom; поздние envFrom могут перекрыть ранние. Сравните декларацию и реальное окружение после rollout, проекцию и обе публичные записи JSON. Литерал north может пройти первую проверку маршрута, но не подтверждает ссылку на источник.


      ### Принятие выпуска хостов процессом {#fleet-relay-running-release}


      Rollout relay не завершён или RELEASE процесса не равен release-60: выданное literal-окружение retired, недоступные ConfigMap и ключ, старые Pod или ошибка exec мешают принять выпуск хостов.  `kubectl rollout status deployment/relay --timeout=10s; kubectl exec deployment/relay -c worker -- printenv RELEASE`.


      ### Связь с исходной публикацией выпуска {#fleet-original-release-publication}


      Выпуск relay не связан с исходной публикацией хостов: причиной могут быть замена ConfigMap, сохранённая ревизия retired, literal или неверная ссылка на ключ, дубли RELEASE либо недоступные защищённые данные и API. Второй этап фиксирует согласованный HTTP-выпуск хостов и UID исходного ConfigMap relay-release. Измените существующий ConfigMap на этот выпуск и задайте ровно одну запись worker RELEASE со ссылкой relay-release/revision без непустого literal. Одного правильного значения процесса недостаточно для подтверждения источника. `cat fleet-release.txt release-config-uid; kubectl get configmap relay-release -o yaml; kubectl get deployment relay -o yaml`.


      ## Попробуйте


      Откройте лабораторию **kubernetes**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Окружение процесса и файл в томе изменятся одновременно?


      ```bash

      cd ~/lab/examples/configuration

      bash run.sh

      kubectl -n lab-configuration get configmap settings -o yaml

      kubectl -n lab-configuration get pod reader

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. MESSAGE остаётся first, а файл со временем содержит second. Проверка ждёт конкретного значения с конечным таймаутом.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.



      Сгенерированная конфигурация может содержать текущие желаемые данные, пока существующий процесс читает старое представление. Сравнивайте фактические ответы производителя и потребителя с источником: готовность и подтверждение контроллера сами по себе не доказывают доставку по всей цепочке. Lab конфигурации показывают поведение проекций, но не воспроизводят полное восстановление через пользовательский ресурс.'
    pl: 'Zmiana ConfigMap aktualizuje obiekt API. Działający proces zachowuje środowisko, które otrzymał podczas uruchamiania. Przewidywany wolumin ConfigMap można zaktualizować później; aplikacja nadal musi ponownie odczytać plik.


      Sprawdź zachowaną publikację oraz źródło i wartość u działającego konsumenta. Śledź rewizję floty do ConfigMap, a potem sprawdź szablon Poda i kontener worker.


      W zadaniu 030 po przywróceniu zarządzanego znacznika wydania sprawdź zmienną `RELEASE` readera i kontrolę gotowości. Ustaw `release-30` i sprawdź rollout relay; naprawa pliku/state i działający workload to osobne etapy.


      W zadaniu 031 Secret nazywa się `station`, a jego klucz to `route`; `secretKeyRef` readera musi wskazywać oba. Popraw odwołanie w `reader.yaml` bez kopiowania wartości do workloadu i zmieniania Secretu. Po rollout sprawdź odwołanie oraz zapis `north` do `/tmp/route` przez reader, nie wypisując danych uwierzytelniających.


      ### Środowisko wydania i gotowość relay {#relay-release-readiness}


      W zadaniu 010 po etapie fleet proces `relay` musi otrzymać `RELEASE=release-10`. Nowy proces odczytuje środowisko przy starcie, więc poczekaj na rollout Deploymentu i sprawdź wartość działającego procesu oraz jego gotowość. Udane dostarczenie do fleet samo nie aktualizuje czytnika Kubernetes. Sonda gotowości relay sprawdza tę samą wartość, więc ze starą wartością Pod pozostaje niegotowy.


      ### Wartość ConfigMap w działającym procesie {#relay-route-env}


      W zadaniu 007 Deployment `relay` odczytuje klucz `route` z ConfigMap `dispatch` jako `ROUTE`. Zmień ten klucz na `north`, uruchom Deployment ponownie, aby nowy proces otrzymał wartość, i poczekaj na rollout. Sprawdź, czy `kubectl exec deployment/relay -c worker -- printenv ROUTE` wypisuje `north`; sama wartość ConfigMap nie dowodzi, że działający proces ją otrzymał.


      ### Zatwierdzone wydanie w procesie relay {#relay-approved-environment}


      W zadaniu 030 deployment.yaml początkowo podaje RELEASE=retired, a sonda gotowości wymaga release-30. Zmiana lokalnego pliku nie zmienia środowiska Poda. Zaktualizuj Deployment, poczekaj na rollout i sprawdź RELEASE w worker. Gdy rollout lub exec zawodzi, sprawdź zdarzenia Poda i gotowość przed oceną samej wartości.


      ### Obiekt Secret i klucz danych {#reader-secret-reference}


      W zadaniu 031 station.yaml tworzy Secret station z kluczem route, a reader.yaml początkowo wskazuje route_name. Obiekt może istnieć bez żądanego klucza, blokując start kontenera i rollout. Porównaj zdarzenia Poda i nazwy kluczy z ROUTE w worker: valueFrom ma zawierać tylko secretKeyRef do station i route, bez niepustej wartości wpisanej bezpośrednio. Po poprawce zastosuj reader.yaml; nie kopiuj danych Secret do Deployment.


      ### Plik trasy przy starcie procesu {#reader-route-startup}


      W zadaniu 031 worker zapisuje ROUTE do /tmp/route raz, przy starcie. Brak klucza Secret może zablokować zapis; stary Pod może zachować wcześniejsze środowisko po zmianie Secret. Poczekaj na poprawiony rollout i odczytaj plik w worker wybranego Poda app=reader. Błąd wyszukania Poda lub exec też uniemożliwia obserwację; sprawdź go przed oceną treści.


      ### Efektywna trasa źródłowa {#progressive-consumer-route}


      ROUTE zapasowej aplikacji nie wynosi north lub jest nieczytelny; mógł pozostać początkowy literał retired, referencja ConfigMap jest przesłonięta, stare Pody zachowały środowisko albo exec zawiódł.


      ### Nienaruszone pierwotne dane publikacji {#progressive-source-data}


      Pierwotne wpisy różnią się lub ConfigMap jest nieczytelny; edycja trasy lub publikacji, nowa tożsamość producenta albo odczyt innych danych może naruszyć zachowany zestaw. Zachowaj każdy pierwotny wpis ConfigMap, w tym ROUTE, PRODUCER_ID i rekord publikacji. Sama zgodna trasa nie wystarcza po zmianie tożsamości publikacji. Błędy odczytu ConfigMap mają ten sam marker i nie dowodzą edycji danych.


      ### Projekcja źródła do producenta {#progressive-source-projection}


      Producent nie montuje wolumenu pierwotnego ConfigMap; nadal może używać początkowego tymczasowego katalogu HTTP albo montowanie worker i referencja wolumenu nie łączą się. Producent potrzebuje wolumenu ConfigMap lub projected z pierwotnym źródłem i montowania worker połączonego jego nazwą. HTTP ma podawać rekord źródła zamiast innego katalogu tymczasowego. Kontrola obserwuje połączenie źródła, nie jedną konkretną pisownię ścieżki montowania.


      ### Referencje zapasu i rekord wykonania {#progressive-consumer-source}


      Zapasowa aplikacja nie pobiera i nie publikuje spójnie pierwotnych danych; przyczyną może być literał lub późniejsze nadpisanie środowiska, brak montowania, stare Pody, błędny rekord albo błąd API/exec. W zapasie efektywne referencje ROUTE i PRODUCER_ID muszą wskazywać te same klucze pierwotnego ConfigMap. Ostatni jawny env nadpisuje envFrom, a późniejsze źródła envFrom wcześniejsze. Porównaj deklarację i rzeczywiste środowisko po rollout, projekcję oraz oba publiczne rekordy JSON. Literał north może przejść pierwszą kontrolę trasy, ale nie potwierdza referencji źródła.


      ### Przyjęcie wydania hostów w procesie {#fleet-relay-running-release}


      Rollout relay nie zakończył się lub RELEASE procesu nie jest release-60; dostarczona wartość retired, niedostępna ConfigMap/klucz, stare Pody lub błąd exec blokują przyjęcie wydania hostów.  `kubectl rollout status deployment/relay --timeout=10s; kubectl exec deployment/relay -c worker -- printenv RELEASE`.


      ### Powiązanie z pierwotną publikacją wydania {#fleet-original-release-publication}


      Wydanie relay nie jest powiązane z pierwotną publikacją hostów; wymiana ConfigMap, pozostawienie retired, wartość literalna lub zła referencja klucza, duplikaty RELEASE albo brak danych chronionych/API mogą to wyjaśniać. Drugi etap zachowuje zgodne wydanie HTTP hostów i UID pierwotnej ConfigMap relay-release. Zmień istniejącą ConfigMap na to wydanie i ustaw dokładnie jeden wpis worker RELEASE odwołujący się do relay-release/revision bez niepustej wartości literalnej. Poprawny wynik procesu sam nie potwierdza źródła. `cat fleet-release.txt release-config-uid; kubectl get configmap relay-release -o yaml; kubectl get deployment relay -o yaml`.


      ## Wypróbuj


      Otwórz laboratorium **kubernetes** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy środowisko procesu i zamontowany plik zmienią się w tym samym momencie?


      ```bash

      cd ~/lab/examples/configuration

      bash run.sh

      kubectl -n lab-configuration get configmap settings -o yaml

      kubectl -n lab-configuration get pod reader

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nr MESSAGE podpórka first; zamontowany plik ostatecznie stanie się second. Kontrola czeka na tę konkretną wartość z ograniczonym limitem czasu.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.


      Wygenerowana konfiguracja może zawierać bieżące dane oczekiwane, gdy istniejący proces czyta starą reprezentację. Porównuj rzeczywiste odpowiedzi producenta i odbiorcy ze źródłem; sama gotowość i potwierdzenie kontrolera nie dowodzą dostarczenia przez cały łańcuch. Lab konfiguracji pokazują projekcje, ale nie odtwarzają pełnego odzyskiwania sterowanego zasobem niestandardowym.'
    es: 'Cambiar un ConfigMap actualiza el objeto API. Un proceso en ejecución mantiene el entorno que recibió al inicio. Un volumen ConfigMap proyectado se puede actualizar más tarde; la aplicación aún debe volver a leer el archivo.


      Comprueba la publicación almacenada y el origen y valor que usa el consumidor activo. Sigue la revisión observada hasta el ConfigMap y después inspecciona la plantilla del Pod y el worker.


      En el ejercicio 030, tras recuperar el marcador gestionado de versión, inspecciona el entorno `RELEASE` del reader y la comprobación de disponibilidad. Establece `release-30` y verifica el rollout de relay; reparar archivo/state y el workload activo son etapas separadas.


      En el ejercicio 031, el Secret se llama `station` y su clave es `route`; el `secretKeyRef` del reader debe indicar ambos. Corrige la referencia en `reader.yaml` sin copiar el valor al workload ni cambiar el Secret. Tras el rollout, verifica la referencia y que el reader escribe `north` en `/tmp/route` sin imprimir credenciales.


      ### Entorno de la versión y disponibilidad de relay {#relay-release-readiness}


      En el ejercicio 010, después de la etapa de fleet, el proceso `relay` debe recibir `RELEASE=release-10`. Un proceso nuevo lee su entorno al arrancar; espera el rollout del Deployment y comprueba el valor del proceso activo y su estado listo. Una entrega correcta a fleet no actualiza por sí sola el lector de Kubernetes. La sonda de disponibilidad de relay comprueba ese mismo valor, por lo que el Pod sigue sin estar listo con el valor anterior.


      ### Valor del ConfigMap en un proceso en ejecución {#relay-route-env}


      En el ejercicio 007, el Deployment `relay` lee la clave `route` del ConfigMap `dispatch` como `ROUTE`. Cambia la clave a `north`, reinicia el Deployment para que el nuevo proceso reciba el valor y espera el rollout. Comprueba que `kubectl exec deployment/relay -c worker -- printenv ROUTE` muestra `north`; el valor del ConfigMap por sí solo no demuestra que el proceso en ejecución lo haya recibido.


      ### Versión aprobada en el proceso relay {#relay-approved-environment}


      En el reto 030, deployment.yaml proporciona inicialmente RELEASE=retired y la sonda de disponibilidad exige release-30. Cambiar el archivo local no cambia el entorno del Pod. Actualiza el Deployment, espera el rollout e inspecciona RELEASE en worker. Si falla rollout o exec, revisa eventos y disponibilidad antes de concluir que el valor es incorrecto.


      ### Objeto Secret y clave de datos {#reader-secret-reference}


      En el reto 031, station.yaml define Secret station con la clave route, pero reader.yaml referencia inicialmente route_name. El objeto puede existir sin la clave solicitada, impidiendo el arranque del contenedor y el rollout. Compara los eventos del Pod y los nombres de claves con ROUTE en worker: valueFrom debe contener solo secretKeyRef a station y route, sin un valor literal no vacío. Aplica reader.yaml tras corregirlo; no copies los datos del Secret al Deployment.


      ### Archivo de ruta al arrancar {#reader-route-startup}


      En el reto 031, worker escribe ROUTE en /tmp/route una vez al arrancar. Una clave ausente puede impedir la escritura; un Pod antiguo puede conservar el entorno anterior tras actualizar el Secret. Espera el rollout corregido y lee el archivo en worker del Pod seleccionado app=reader. Un fallo al buscar el Pod o ejecutar exec también impide la observación; revisa esos errores antes de interpretar el contenido.


      ### Ruta efectiva de origen {#progressive-consumer-route}


      ROUTE del respaldo no es north o no puede leerse; puede persistir el literal inicial retired, una referencia ConfigMap estar eclipsada, los Pods conservar un entorno anterior o fallar exec.


      ### Datos originales de publicación intactos {#progressive-source-data}


      Las entradas originales difieren o no se puede observar el ConfigMap; editar ruta o publicación, generar otra identidad productora o consultar otros datos puede romper el conjunto conservado. Conserve cada entrada original del ConfigMap, incluidas ROUTE, PRODUCER_ID y el registro publicado. Coincidir solo en ruta no basta si cambia la identidad. Los errores al leer el ConfigMap usan el mismo marcador y no prueban edición de datos.


      ### Proyectar la fuente al productor {#progressive-source-projection}


      El productor no monta un volumen del ConfigMap fuente original; puede seguir usando el directorio HTTP temporal inicial o el montaje worker no conecta con el volumen. El productor necesita un volumen ConfigMap o projected de la fuente original y un montaje worker conectado por nombre. Su HTTP debe servir ese registro, no otro directorio temporal. La prueba observa la conexión de fuente, no exige una única ruta de montaje.


      ### Referencias del respaldo y registro en ejecución {#progressive-consumer-source}


      El respaldo no consume y publica de forma coherente la fuente original; un literal o entorno que sobrescribe, proyección ausente, Pods antiguos, registro distinto o fallo API/exec pueden explicarlo. En el respaldo ROUTE y PRODUCER_ID efectivos deben referenciar las mismas claves del ConfigMap original. La última entrada env explícita prevalece sobre envFrom y las fuentes envFrom posteriores pueden sobrescribir anteriores. Compare declaración, entorno real tras rollout, proyección y ambos registros JSON públicos. Un literal north puede pasar la primera ruta sin acreditar la referencia requerida.


      ### Adoptar versión de hosts en el proceso {#fleet-relay-running-release}


      El rollout relay no terminó o RELEASE del proceso no es release-60; el literal retired suministrado, ConfigMap/clave ausente, Pods obsoletos o exec fallido impiden adoptar la versión de los hosts.  `kubectl rollout status deployment/relay --timeout=10s; kubectl exec deployment/relay -c worker -- printenv RELEASE`.


      ### Vincular a publicación de versión original {#fleet-original-release-publication}


      La versión relay no está vinculada a la publicación original; reemplazar ConfigMap, conservar retired, usar literal o referencia errónea, duplicar RELEASE o faltar datos protegidos/API pueden explicarlo. La segunda etapa fija la versión HTTP común y el UID de ConfigMap relay-release original. Modifique ese ConfigMap existente a la versión fijada y use exactamente una entrada worker RELEASE referida a relay-release/revision sin literal no vacío. Una salida correcta del proceso no acredita sola ese origen. `cat fleet-release.txt release-config-uid; kubectl get configmap relay-release -o yaml; kubectl get deployment relay -o yaml`.


      ## Pruébalo


      Abra el **kubernetes Lab** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿El entorno del proceso y el archivo montado cambiarán al mismo tiempo?


      ```bash

      cd ~/lab/examples/configuration

      bash run.sh

      kubectl -n lab-configuration get configmap settings -o yaml

      kubectl -n lab-configuration get pod reader

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. MESSAGE permanece primero; el archivo montado finalmente se convierte en second. La verificación espera ese valor específico con un tiempo de espera finito.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh`, luego `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.


      Una configuración generada puede contener datos deseados actuales mientras un proceso existente lee una representación anterior. Compara las respuestas reales del productor y consumidor con la fuente; disponibilidad y confirmación del controlador no demuestran toda la cadena de entrega. Los Labs de configuración muestran las proyecciones, pero no ensayan una recuperación completa dirigida por un recurso personalizado.'
    de: 'Durch das Ändern eines ConfigMap wird das API-Objekt aktualisiert. Ein laufender Prozess behält die Umgebung, die er beim Start erhalten hat. Ein geplantes ConfigMap-Volume kann später aktualisiert werden; Die Anwendung muss die Datei trotzdem erneut lesen.


      Prüfen Sie die gespeicherte Veröffentlichung sowie Quelle und Wert beim laufenden Verbraucher. Verfolgen Sie die beobachtete Revision der Fleet bis zur ConfigMap und prüfen Sie anschließend Pod-Vorlage und worker.


      Prüfe in Aufgabe 030 nach Wiederherstellung des verwalteten Release-Markers die Umgebung `RELEASE` des Readers und seine Readiness-Prüfung. Setze `release-30` und prüfe den Relay-Rollout; Datei/State-Reparatur und laufender Workload sind getrennte Phasen.


      In Aufgabe 031 heißt das Secret `station`, sein Schlüssel `route`; die `secretKeyRef` des Readers muss beide angeben. Korrigiere die Referenz in `reader.yaml`, ohne den Wert in den Workload zu kopieren oder das Secret zu ändern. Prüfe nach dem Rollout die Referenz und dass der Reader `north` nach `/tmp/route` schreibt, ohne Zugangsdaten auszugeben.


      ### Release-Umgebung und Bereitschaft von relay {#relay-release-readiness}


      Nach der Fleet-Phase in Aufgabe 010 muss der Prozess `relay` `RELEASE=release-10` erhalten. Ein neuer Prozess liest seine Umgebung beim Start; warte daher auf den Deployment-Rollout und prüfe den Wert des laufenden Prozesses sowie dessen Bereitschaft. Eine erfolgreiche Fleet-Auslieferung aktualisiert den Kubernetes-Reader nicht von selbst. Die Readiness-Probe von relay prüft denselben Wert. Mit dem alten Wert bleibt der Pod nicht bereit.


      ### ConfigMap-Wert im laufenden Prozess {#relay-route-env}


      In Aufgabe 007 liest das Deployment `relay` den Schlüssel `route` der ConfigMap `dispatch` als `ROUTE`. Setze den Schlüssel auf `north`, starte das Deployment neu, damit der neue Prozess den Wert erhält, und warte auf den Rollout. Prüfe, dass `kubectl exec deployment/relay -c worker -- printenv ROUTE` `north` ausgibt; der ConfigMap-Wert allein beweist nicht, dass der laufende Prozess ihn erhalten hat.


      ### Freigegebene Version im relay-Prozess {#relay-approved-environment}


      In Quest 030 liefert deployment.yaml zunächst RELEASE=retired, während die Readiness-Probe release-30 verlangt. Eine lokale Dateiänderung ändert keine Pod-Umgebung. Aktualisiere das Deployment, warte auf den Rollout und prüfe RELEASE in worker. Bei Rollout- oder exec-Fehlern prüfe Pod-Ereignisse und Bereitschaft, bevor du den Wert beurteilst.


      ### Secret-Objekt und Datenschlüssel {#reader-secret-reference}


      In Quest 031 liefert station.yaml das Secret station mit Schlüssel route, während reader.yaml zunächst route_name referenziert. Das Objekt kann ohne den angeforderten Schlüssel existieren und Containerstart und Rollout verhindern. Vergleiche Pod-Ereignisse und Schlüsselnamen mit ROUTE in worker: valueFrom darf nur secretKeyRef auf station und route enthalten, ohne nichtleeren eingebetteten Wert. Wende reader.yaml nach der Korrektur an; kopiere keine Secret-Daten ins Deployment.


      ### Routendatei beim Prozessstart {#reader-route-startup}


      In Quest 031 schreibt worker ROUTE beim Start einmal nach /tmp/route. Ein fehlender Secret-Schlüssel kann das Schreiben verhindern; ein alter Pod kann nach einer Secret-Änderung seine alte Umgebung behalten. Warte auf den korrigierten Rollout und lies die Datei in worker des ausgewählten Pods app=reader. Fehler bei Pod-Suche oder exec verhindern ebenfalls die Beobachtung; prüfe sie vor dem Dateiinhalt.


      ### Effektive Quellroute {#progressive-consumer-route}


      ROUTE der Ersatzanwendung ist nicht north oder ist unlesbar; möglicherweise bleibt der anfängliche Literalwert retired, eine ConfigMap-Referenz wird überlagert, alte Pods behalten ihre Umgebung oder exec schlug fehl.


      ### Unveränderte ursprüngliche Publikationsdaten {#progressive-source-data}


      Die ursprünglichen Einträge weichen ab oder die ConfigMap ist nicht beobachtbar; geänderte Route oder Publikation, eine neue Produzentenidentität oder andere gelesene Daten können den erhaltenen Datensatz verletzen. Erhalten Sie jeden ursprünglichen ConfigMap-Eintrag einschließlich ROUTE, PRODUCER_ID und Publikationsdatensatz. Eine passende Route allein reicht bei geänderter Identität nicht. Lesefehler dieser ConfigMap nutzen denselben Marker und beweisen keine Datenänderung.


      ### Quelle in den Produzenten einbinden {#progressive-source-projection}


      Der Produzent mountet kein Volume aus der ursprünglichen Quell-ConfigMap; möglicherweise wird noch das anfängliche temporäre HTTP-Verzeichnis verwendet oder worker-Mount und Volume-Referenz passen nicht zusammen. Der Produzent benötigt ein ConfigMap- oder projected-Volume mit ursprünglicher Quelle und einen über den Volume-Namen verbundenen worker-Mount. HTTP muss den Quelldatensatz statt eines fremden temporären Verzeichnisses liefern. Geprüft wird die Quellverbindung, nicht eine bestimmte Mount-Pfadschreibweise.


      ### Ersatzreferenzen und Laufzeitdatensatz {#progressive-consumer-source}


      Die Ersatzanwendung konsumiert und veröffentlicht die ursprüngliche Quelle nicht konsistent; Literalwert oder spätere Umgebungsüberlagerung, fehlende Einbindung, alte Pods, falscher Laufzeitdatensatz oder API-/exec-Fehler können die Ursache sein. Bei der Ersatzanwendung müssen effektive ROUTE- und PRODUCER_ID-Referenzen dieselben Schlüssel der ursprünglichen ConfigMap auflösen. Der letzte explizite env-Eintrag überlagert envFrom, spätere envFrom-Quellen frühere Werte. Vergleichen Sie Deklaration und tatsächliche Umgebung nach Rollout, Projektion und beide öffentlichen JSON-Datensätze. Ein Literalwert north kann die erste Routenprüfung bestehen, belegt jedoch keine Quellreferenz.


      ### Host-Release im Prozess übernehmen {#fleet-relay-running-release}


      Der Rollout von relay wurde nicht abgeschlossen oder RELEASE des Prozesses ist nicht release-60; der gelieferte Wert retired, fehlende ConfigMap beziehungsweise Schlüssel, alte Pods oder ein exec-Fehler verhindern die Übernahme des Host-Releases.  `kubectl rollout status deployment/relay --timeout=10s; kubectl exec deployment/relay -c worker -- printenv RELEASE`.


      ### An ursprüngliche Release-Publikation anbinden {#fleet-original-release-publication}


      Das Release von relay ist nicht an die ursprüngliche Host-Publikation gebunden; ersetzte ConfigMap, verbliebene Revision retired, ein Literal oder falscher Schlüsselverweis, doppelte RELEASE-Einträge oder fehlende geschützte/API-Daten können die Ursache sein. Die zweite Phase hält das übereinstimmende HTTP-Release der Hosts und die ursprüngliche UID der ConfigMap relay-release fest. Ändern Sie diese vorhandene ConfigMap auf das festgehaltene Release und verwenden Sie genau einen worker RELEASE Eintrag mit Verweis auf relay-release/revision ohne nichtleeren Literalwert. Eine korrekte Prozessausgabe allein belegt diese Quellenbindung nicht. `cat fleet-release.txt release-config-uid; kubectl get configmap relay-release -o yaml; kubectl get deployment relay -o yaml`.


      ## Probieren Sie es aus


      Öffnen Sie das **kubernetes Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Werden sich die Prozessumgebung und die bereitgestellte Datei gleichzeitig ändern?


      ```bash

      cd ~/lab/examples/configuration

      bash run.sh

      kubectl -n lab-configuration get configmap settings -o yaml

      kubectl -n lab-configuration get pod reader

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. MESSAGE bleibt an erster Stelle; Die gemountete Datei wird schließlich zu second. Die Prüfung wartet mit einer endlichen Zeitüberschreitung auf diesen bestimmten Wert.


      ## Beobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.


      Eine erzeugte Konfiguration kann aktuelle Solldaten enthalten, während ein vorhandener Prozess eine ältere Darstellung liest. Vergleiche tatsächliche Produzenten- und Verbraucherantworten mit der Quelle; Bereitschaft und Controller-Bestätigung allein belegen keine Auslieferung durch die gesamte Kette. Konfigurations-Labs zeigen Projektionsverhalten, üben aber keine vollständige Wiederherstellung über eine Custom Resource.'
  full_example: full-configuration
kubernetes-17:
  profile: kubernetes
  example: disruption
  source_hash: 4c9aace3dbd039805e5009eecd067a860ecda8a80c5c32412d0a5b902a32f8b8
  content:
    en: 'A PodDisruptionBudget constrains voluntary eviction through the eviction API. It does not create replicas and cannot prevent every failure. Prepare ready spare capacity before draining a node.


      For identity-preserving maintenance, compare actual Pod readiness with the PDB before creating an Eviction request. Probe failures describe the local condition that must recover; reducing the budget cannot create health. Discover the selected Pod name and UID from live state, preserve unselected original identities, and distinguish a server-observed eviction from a request file or a direct deletion. Retain the termination observation window while replacements become ready.


      ## Try it


      Open the **kubernetes Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** With two ready replicas and minAvailable=2, can the eviction API remove one?


      ```bash

      cd ~/lab/examples/disruption

      bash run.sh

      kubectl -n lab-disruption get deployment,pdb

      kubectl -n lab-disruption describe pdb web

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The API denies eviction. Changing minAvailable to 1 creates a disruption allowance and the same request succeeds.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.


      Policy ownership and selector scope are independent of a positive disruption allowance. A reconciler can restore a live-only edit from Git; compare its source and observed revision before maintenance. Inspect every matching budget: overlapping PDBs can make the Eviction API refuse a Pod even when each reports spare capacity. Keep protected pools separate, preserve their existing controllers and siblings, and verify real Eviction API outcomes using original Pod UIDs. A UID precondition prevents a request from deleting a different incarnation with the same name. Server observations require a termination window and permission boundaries that prevent the learner or the Git source from rewriting Pod status; a request file alone proves only intent.'
    ru: 'PodDisruptionBudget ограничивает добровольное выселение через eviction API. Он не создаёт реплики и не предотвращает любой отказ. Перед drain нужна готовая запасная ёмкость.


      При обслуживании с сохранением идентичности сравнивайте фактическую готовность Pod с PDB до создания Eviction. Ошибки probe описывают локальное условие, которое нужно восстановить; уменьшение бюджета не создаёт здоровые Pod. Найдите имя и UID выбранного Pod в текущем состоянии, сохраните идентичность остальных исходных Pod и отличайте серверное наблюдение eviction от файла запроса или прямого удаления. Сохраните окно наблюдения завершения, пока готовится замена.


      ## Попробуйте


      Откройте лабораторию **kubernetes**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** При двух готовых репликах и minAvailable=2 eviction API разрешит удалить одну?


      ```bash

      cd ~/lab/examples/disruption

      bash run.sh

      kubectl -n lab-disruption get deployment,pdb

      kubectl -n lab-disruption describe pdb web

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. API отказывает. После изменения minAvailable на 1 появляется разрешённое прерывание, и запрос проходит.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.


      Владелец политики и область селектора независимы от положительного запаса прерываний. Контроллер может вернуть изменение действующего ресурса к версии Git; перед обслуживанием сопоставьте источник и наблюдаемую ревизию. Изучите все подходящие бюджеты: перекрывающиеся PDB могут приводить к отказу Eviction API, даже если каждый сообщает о запасе. Разделяйте защищаемые пулы, сохраняйте существующие контроллеры и соседние Pod, проверяйте фактический Eviction API по исходным UID. Предусловие UID не позволяет запросу удалить другую инкарнацию с тем же именем. Серверное наблюдение требует окна завершения и границ доступа, не позволяющих игроку или источнику Git переписывать статус Pod; файл запроса подтверждает лишь намерение.'
    pl: 'PodDisruptionBudget ogranicza dobrowolną eksmisję poprzez eviction API. Nie tworzy replik i nie jest w stanie zapobiec każdej awarii. Przygotuj wolną moc obliczeniową przed opróżnieniem węzła.


      Przy konserwacji zachowującej tożsamość porównaj rzeczywistą gotowość Podów z PDB przed utworzeniem Eviction. Błędy sond opisują lokalny warunek wymagający przywrócenia; zmniejszenie budżetu nie tworzy zdrowia. Odczytaj nazwę i UID wybranego Poda ze stanu bieżącego, zachowaj pozostałe pierwotne tożsamości i odróżniaj eksmisję zaobserwowaną przez serwer od pliku żądania lub bezpośredniego usunięcia. Zachowaj okno obserwacji zakończenia podczas przygotowania zastępstwa.


      ## Wypróbuj


      Otwórz laboratorium **kubernetes** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy eviction API z dwiema gotowymi replikami i minAvailable=2 może usunąć jedną?


      ```bash

      cd ~/lab/examples/disruption

      bash run.sh

      kubectl -n lab-disruption get deployment,pdb

      kubectl -n lab-disruption describe pdb web

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. API zaprzecza eksmisji. Zmiana minAvailable na 1 powoduje utworzenie limitu zakłóceń i to samo żądanie zostaje zrealizowane.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.

      Właściciel polityki i zakres selektora są niezależne od dodatniego zapasu przerwań. Reconciler może przywrócić zmianę aktywnego zasobu z Git; przed konserwacją porównaj źródło i obserwowaną rewizję. Zbadaj wszystkie pasujące budżety: nakładające się PDB mogą spowodować odmowę Eviction API, nawet gdy każdy zgłasza wolny zapas. Rozdziel chronione pule, zachowaj istniejące kontrolery i sąsiednie Pody oraz sprawdź prawdziwe wyniki Eviction API według pierwotnych UID. Warunek wstępny UID zapobiega usunięciu innego wcielenia o tej samej nazwie. Obserwacje serwera wymagają okna kończenia i granic uprawnień, które zabraniają graczowi lub źródłu Git przepisywania statusu Poda; plik żądania dowodzi tylko zamiaru.'
    es: 'Un PodDisruptionBudget restringe el eviction voluntario a través del eviction API. No crea réplicas y no puede evitar todos los fallos. Prepare la capacidad sobrante lista antes de drenar un nodo.


      Para mantenimiento que conserve identidades, compara la disponibilidad real de los Pods con el PDB antes de crear una Eviction. Los fallos de sonda describen la condición local que debe recuperarse; reducir el presupuesto no crea salud. Descubre nombre y UID del Pod seleccionado en el estado activo, conserva las identidades originales restantes y distingue una expulsión observada por el servidor de un archivo de solicitud o borrado directo. Conserva la ventana de observación de terminación mientras se prepara el reemplazo.


      ## Pruébalo


      Abra el **kubernetes Lab** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** Con dos réplicas listas y minAvailable=2, ¿puede el eviction API eliminar una?


      ```bash

      cd ~/lab/examples/disruption

      bash run.sh

      kubectl -n lab-disruption get deployment,pdb

      kubectl -n lab-disruption describe pdb web

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. El API desmiente eviction. Cambiar minAvailable a 1 crea una asignación de interrupción y la misma solicitud se realiza correctamente.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh` y luego con `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.

      El responsable de la política y el alcance del selector son independientes de un margen positivo de interrupciones. Un reconciliador puede revertir una edición solo del recurso activo desde Git; compara la fuente y la revisión observada antes del mantenimiento. Examina todos los presupuestos coincidentes: PDB superpuestos pueden hacer que Eviction API rechace un Pod aunque cada presupuesto indique capacidad libre. Separa los pools protegidos, conserva sus controladores y vecinos existentes, y verifica resultados reales de Eviction API con los UID originales. La precondición UID impide borrar otra encarnación con el mismo nombre. Las observaciones del servidor requieren una ventana de terminación y permisos que impidan al jugador o a la fuente Git reescribir el estado del Pod; un archivo de solicitud solo demuestra intención.'
    de: 'Ein PodDisruptionBudget schränkt den freiwilligen eviction durch den eviction API ein. Es erstellt keine Replikate und kann nicht jeden Fehler verhindern. Bereiten Sie freie Kapazität vor, bevor Sie einen Knoten entleeren.


      Vergleiche bei identitätserhaltender Wartung die tatsächliche Pod-Bereitschaft mit dem PDB, bevor du eine Eviction erstellst. Probe-Fehler beschreiben die lokal wiederherzustellende Bedingung; ein kleineres Budget erzeugt keine Gesundheit. Ermittle Pod-Name und UID aus dem laufenden Zustand, erhalte die übrigen ursprünglichen Identitäten und unterscheide serverseitig beobachtete Eviction von einer Anfragedatei oder direkter Löschung. Behalte das Beobachtungsfenster während der Bereitschaft der Ersetzung bei.


      ## Probieren Sie es aus


      Öffnen Sie das **kubernetes Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und prüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Kann der eviction API mit zwei fertigen Replikaten und minAvailable=2 eines entfernen?


      ```bash

      cd ~/lab/examples/disruption

      bash run.sh

      kubectl -n lab-disruption get deployment,pdb

      kubectl -n lab-disruption describe pdb web

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Der API verweigert eviction. Durch Ändern von minAvailable auf 1 wird eine Unterbrechungszulage erstellt und dieselbe Anforderung ist erfolgreich.


      ## Beobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann mit `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.

      Richtlinienverantwortung und Selektorbereich sind unabhängig von einer positiven Unterbrechungskapazität. Ein Reconciler kann eine reine Live-Änderung aus Git zurücksetzen; vergleiche Quelle und beobachtete Revision vor der Wartung. Prüfe jedes passende Budget: überlappende PDBs können dazu führen, dass die Eviction API einen Pod ablehnt, obwohl jedes Budget Spielraum meldet. Trenne geschützte Pools, erhalte vorhandene Controller und Nachbar-Pods und prüfe echte Eviction-Ergebnisse anhand ursprünglicher Pod-UIDs. Eine UID-Vorbedingung verhindert das Löschen einer anderen Inkarnation mit demselben Namen. Serverbeobachtungen benötigen ein Beendigungsfenster sowie Berechtigungsgrenzen, die Statusänderungen durch Spieler oder Git-Quelle verhindern; eine Anfragedatei belegt nur eine Absicht.'
  full_example: full-disruption
kubernetes-20:
  profile: kubernetes
  example: troubleshooting
  source_hash: e4419dfe0dda62707853d17db21e9009e3354939ad2a85372ec2e04f0eb26f9f
  content:
    en: 'Use evidence available to the acting identity. A denied cluster-wide list request describes the observer’s permissions, not the state of a particular Pod or volume. Namespace-scoped object definitions, status, events and healthy reference objects can still expose scheduling requests, claim settings and application data. Separate an unavailable observation path from the actual application failure, and keep the investigation inside the supplied authority.


      Start with the symptom and find the failing layer: admission, scheduling, image preparation, process or traffic. Read status, events and the relevant container logs before editing the workload.


      ### Unavailable release image {#relay-release-image}


      In quest 001, the `relay` Deployment cannot start container `worker` because its image is missing. Inspect Pod events and compare `deployment.yaml` with the supplied CI artifact `release-manifest.json`. Set the worker image to the artifact''s complete `image` value, retain `imagePullPolicy: Never`, and wait for the `relay` rollout. The image is already loaded in this offline bay; do not pull from an external registry.


      ### Clock startup and Pod artifacts {#clock-startup-artifacts}


      In quest 011, `clock.yaml` needs a command that records a UTC timestamp in `/tmp/clock`, writes `POD_NAME` to `/tmp/identity` and stays in the foreground. Set the environment value from `fieldRef` with `fieldPath: metadata.name`; this is the Pod name, not the Deployment name. After rollout, compare `/tmp/identity` with the actual Pod name and inspect `/tmp/clock` for UTC form such as `2026-01-02T03:04:05Z`.


      ### Route worker startup and logs {#route-worker-startup}


      In quest 014, read current or `--previous` logs from the `route-worker` Pod and save the exact line `route must equal north` in `diagnosis.txt`. The process reads ConfigMap `route`, key `name`, through `ROUTE`. Set that key to `north`, restart `deployment/route-worker`, then verify rollout and `printenv ROUTE`. Changing the ConfigMap alone does not update the environment of a running process.


      ### Diagnose the unbound target claim {#storage-target-binding-gate}


      The target PVC spool is not Bound, or the policy observer stopped without a named marker; its supplied unknown storage class can leave it Pending, while missing frozen facts, malformed JSON or probe startup failures also prevent observation.  `kubectl get pvc spool reserve -o yaml; kubectl describe pvc spool`.


      ### Keep the existing Job {#batch-preserve-original-job}


      Recreating importer changes its frozen UID; repair the existing Job, and inspect API access if the original object cannot be read. The original Job starts with backoffLimit=100 and activeDeadlineSeconds=300; the recurring CronJob is initially absent. A bounded failed validation is the intended result. Setup removes job.yaml, so inspect the live objects and supplied batch-contract.json instead of a missing manifest. `kubectl get job importer -o jsonpath="{.metadata.uid}"`.


      ### Retain the original worker command {#batch-retain-failing-worker-command}


      Replacing the supplied failing command with success hides the validation failure; retain the original worker command from the live Job and frozen facts. The original Job starts with backoffLimit=100 and activeDeadlineSeconds=300; the recurring CronJob is initially absent. A bounded failed validation is the intended result. Setup removes job.yaml, so inspect the live objects and supplied batch-contract.json instead of a missing manifest. `kubectl get job importer -o json | jq ''.spec.template.spec.containers[] | select(.name=="worker") | .command''`.


      ### Leave a failed execution visible {#batch-never-restart-policy}


      A Pod restart policy other than Never can retry inside a Pod instead of leaving the expected failed execution; retain the supplied policy. The original Job starts with backoffLimit=100 and activeDeadlineSeconds=300; the recurring CronJob is initially absent. A bounded failed validation is the intended result. Setup removes job.yaml, so inspect the live objects and supplied batch-contract.json instead of a missing manifest. `kubectl get job importer -o jsonpath="{.spec.template.spec.restartPolicy}"`.


      ### One parallel execution {#batch-single-parallel-execution}


      Parallelism may have been increased while editing retry limits; keep importer parallelism at one and check API output if the field cannot be observed. The original Job starts with backoffLimit=100 and activeDeadlineSeconds=300; the recurring CronJob is initially absent. A bounded failed validation is the intended result. Setup removes job.yaml, so inspect the live objects and supplied batch-contract.json instead of a missing manifest. `kubectl get job importer -o jsonpath="{.spec.parallelism}"`.


      ### Bound the current retries {#batch-bound-current-job-retries}


      The supplied Job retries up to 100 times; reduce backoffLimit to one on the existing Job so the failed validation becomes bounded. The original Job starts with backoffLimit=100 and activeDeadlineSeconds=300; the recurring CronJob is initially absent. A bounded failed validation is the intended result. Setup removes job.yaml, so inspect the live objects and supplied batch-contract.json instead of a missing manifest. `kubectl get job importer -o jsonpath="{.spec.backoffLimit}"`.


      ### Bound the current deadline {#batch-bound-current-job-deadline}


      The supplied activeDeadlineSeconds is 300; set the existing Job deadline to the required 30 seconds rather than deleting its execution. The original Job starts with backoffLimit=100 and activeDeadlineSeconds=300; the recurring CronJob is initially absent. A bounded failed validation is the intended result. Setup removes job.yaml, so inspect the live objects and supplied batch-contract.json instead of a missing manifest. `kubectl get job importer -o jsonpath="{.spec.activeDeadlineSeconds}"`.


      ### Observe the current Job {#batch-current-job-api-observation}


      The current Job may be missing or its API request, JSON parsing or timeout may fail; inspect importer availability before the original-workload comparison. The original Job starts with backoffLimit=100 and activeDeadlineSeconds=300; the recurring CronJob is initially absent. A bounded failed validation is the intended result. Setup removes job.yaml, so inspect the live objects and supplied batch-contract.json instead of a missing manifest. `kubectl get job importer --request-timeout=3s`.


      ### Original workload and identity {#batch-original-image-command-and-identity}


      The current Job may have been replaced or its original image, worker command or Never policy changed; compare it with the frozen batch identities. The original Job starts with backoffLimit=100 and activeDeadlineSeconds=300; the recurring CronJob is initially absent. A bounded failed validation is the intended result. Setup removes job.yaml, so inspect the live objects and supplied batch-contract.json instead of a missing manifest. `kubectl get job importer -o json | jq ''{uid:.metadata.uid,spec:.spec}''`.


      ### Active schedule without overlap {#batch-active-cron-schedule-and-concurrency}


      The recurring CronJob may be absent, suspended, use another schedule or allow overlap; compare its live policy with batch-contract.json. API/timeout errors reading it use this marker too. The original Job starts with backoffLimit=100 and activeDeadlineSeconds=300; the recurring CronJob is initially absent. A bounded failed validation is the intended result. Setup removes job.yaml, so inspect the live objects and supplied batch-contract.json instead of a missing manifest. `kubectl get cronjob validation-cycle -o json | jq .spec`.


      ### A bounded recurring template {#batch-bounded-recurring-job-template}


      The CronJob template may retain the original broad retry/deadline values or change the workload; propagate all four exact execution bounds and the original image, command and Never policy. The original Job starts with backoffLimit=100 and activeDeadlineSeconds=300; the recurring CronJob is initially absent. A bounded failed validation is the intended result. Setup removes job.yaml, so inspect the live objects and supplied batch-contract.json instead of a missing manifest. `kubectl get cronjob validation-cycle -o json | jq .spec.jobTemplate.spec`.


      ### An actual failed attempt {#batch-observe-current-failed-attempt}


      The failing command may not have run yet or its failure was hidden; retain the original Job and inspect its failed attempt count and events. The original Job starts with backoffLimit=100 and activeDeadlineSeconds=300; the recurring CronJob is initially absent. A bounded failed validation is the intended result. Setup removes job.yaml, so inspect the live objects and supplied batch-contract.json instead of a missing manifest. `kubectl get job importer -o json | jq .status.failed`.


      ### Terminal Job failure {#batch-terminal-current-job-failure}


      The Job may still be retrying under old limits or has not reached terminal failure; verify its bounded policy and wait for Failed=True. The original Job starts with backoffLimit=100 and activeDeadlineSeconds=300; the recurring CronJob is initially absent. A bounded failed validation is the intended result. Setup removes job.yaml, so inspect the live objects and supplied batch-contract.json instead of a missing manifest. `kubectl get job importer -o json | jq .status.conditions`.


      ### Failed Pod of the original Job {#batch-original-job-owned-failed-pod}


      A label alone does not prove the failed Pod belongs to the original Job; inspect controller owner UID, Failed phase and worker termination with exit code one. The original Job starts with backoffLimit=100 and activeDeadlineSeconds=300; the recurring CronJob is initially absent. A bounded failed validation is the intended result. Setup removes job.yaml, so inspect the live objects and supplied batch-contract.json instead of a missing manifest. `kubectl get pods -l job-name=importer -o json | jq ''.items[] | {owners:.metadata.ownerReferences,status:.status}''`.


      ### An actual scheduled child Job {#batch-observed-cron-owned-failed-job}


      A valid template alone leaves no execution evidence; wait for an actual CronJob-owned bounded child Job that has failed. API/timeouts reading Jobs also use this marker. The original Job starts with backoffLimit=100 and activeDeadlineSeconds=300; the recurring CronJob is initially absent. A bounded failed validation is the intended result. Setup removes job.yaml, so inspect the live objects and supplied batch-contract.json instead of a missing manifest. `kubectl get jobs -o json | jq ''.items[] | {name:.metadata.name,owners:.metadata.ownerReferences,status:.status}''`.


      ### Follow the controller ownership chain {#batch-child-owner-chain-and-real-exit}


      The recurring execution may lack a failed Pod with the original workload and exit code one; trace CronJob to child Job to Pod by controller UIDs. API/timeouts reading Pods also use this marker. The original Job starts with backoffLimit=100 and activeDeadlineSeconds=300; the recurring CronJob is initially absent. A bounded failed validation is the intended result. Setup removes job.yaml, so inspect the live objects and supplied batch-contract.json instead of a missing manifest. `kubectl get pods -o json | jq ''.items[] | {name:.metadata.name,owners:.metadata.ownerReferences,status:.status}''`.


      ### Start the policy observer {#batch-policy-startup-fallback}


      The earlier 8s legacy check can time out before emitting a marker, for example on a stalled kubectl request; helper startup or frozen-fact errors also leave this fallback. API/timeouts inside the Python observer use the requested object marker. The original Job starts with backoffLimit=100 and activeDeadlineSeconds=300; the recurring CronJob is initially absent. A bounded failed validation is the intended result. Setup removes job.yaml, so inspect the live objects and supplied batch-contract.json instead of a missing manifest. `python3 -I -c "import dq_check"; jq .contract /run/dq/facts/0/batch-identities.json`.


      ### Start the execution observer {#batch-evidence-startup-fallback}


      The earlier 8s legacy check can time out before emitting a marker, for example on a stalled kubectl request; helper startup or frozen-fact errors also leave this fallback. API/timeouts inside the Python observer use the requested object marker. The original Job starts with backoffLimit=100 and activeDeadlineSeconds=300; the recurring CronJob is initially absent. A bounded failed validation is the intended result. Setup removes job.yaml, so inspect the live objects and supplied batch-contract.json instead of a missing manifest. `python3 -I -c "import dq_check"; jq .contract /run/dq/facts/0/batch-identities.json`.


      ## Try it


      Open the **kubernetes Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Do CrashLoopBackOff and an unavailable image need the same repair?


      ```bash

      cd ~/lab/examples/troubleshooting

      bash run.sh

      kubectl -n lab-troubleshooting get pods

      kubectl -n lab-troubleshooting describe pod missing

      bash check.sh

      ```


      > [!question]- Expected result

      > No. One container ran and exited with code 3; the other never started because its image is absent. Previous logs explain only the first failure.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.



      Locate a failure in its actual phase before choosing a remedy. Pod creation, initializer execution, process startup, readiness and application data can disagree. Preserve the observed reason and runtime message rather than reducing every failure to one status enum. Correlate the active resource limits, input data and volume lifetime with the real records; a successful restart or rollout alone does not establish the complete application result.'
    ru: 'Используйте свидетельства, доступные действующей identity. Отказ в получении списка объектов всего кластера описывает права наблюдателя, а не состояние конкретного Pod или тома. Определения, статусы, события и здоровые примеры в namespace показывают запросы планирования, настройки claim и данные приложения. Отделяйте недоступный путь наблюдения от самого отказа приложения и исследуйте в рамках предоставленных полномочий.


      Начните с симптома и найдите слой отказа: допуск, размещение, подготовка образа, процесс или трафик. Перед изменением нагрузки прочитайте status, events и логи нужного контейнера.


      ### Недоступный образ релиза {#relay-release-image}


      В квесте 001 Deployment `relay` не может запустить контейнер `worker` из-за отсутствующего образа. Изучите события Pod и сравните `deployment.yaml` с предоставленным артефактом CI `release-manifest.json`. Установите образ worker в полное значение `image` из артефакта, сохраните `imagePullPolicy: Never` и дождитесь rollout `relay`. Образ уже загружен в автономной лаборатории; не скачивайте его из внешнего реестра.


      ### Запуск clock и файлы Pod {#clock-startup-artifacts}


      В квесте 011 для `clock.yaml` нужна команда, которая записывает время UTC в `/tmp/clock`, сохраняет `POD_NAME` в `/tmp/identity` и остается работать в foreground. Задайте значение окружения через `fieldRef` с `fieldPath: metadata.name`: это имя Pod, а не Deployment. После rollout сравните `/tmp/identity` с реальным именем Pod и проверьте формат UTC в `/tmp/clock`, например `2026-01-02T03:04:05Z`.


      ### Запуск route-worker и его логи {#route-worker-startup}


      В квесте 014 прочитайте текущие или `--previous` логи Pod `route-worker` и сохраните точную строку `route must equal north` в `diagnosis.txt`. Процесс читает ConfigMap `route`, ключ `name`, через `ROUTE`. Установите ключ в `north`, перезапустите `deployment/route-worker`, затем проверьте rollout и `printenv ROUTE`. Одно изменение ConfigMap не обновляет окружение работающего процесса.


      ### Диагностика несвязанного целевого PVC {#storage-target-binding-gate}


      Целевой PVC spool не Bound либо проверка политики остановилась без именованного маркера: выданный неизвестный StorageClass оставляет его Pending; отсутствующие сохранённые данные, некорректный JSON или сбой запуска также мешают наблюдению.  `kubectl get pvc spool reserve -o yaml; kubectl describe pvc spool`.


      ### Существующий Job {#batch-preserve-original-job}


      Пересоздание importer меняет зафиксированный UID; исправляйте существующий Job и проверьте API, если исходный объект не читается. Исходный Job задаёт backoffLimit=100 и activeDeadlineSeconds=300; повторяющийся CronJob отсутствует. Требуемый результат — ограниченная неудачная валидация. Setup удаляет job.yaml: изучайте живые объекты и выданный batch-contract.json. `kubectl get job importer -o jsonpath="{.metadata.uid}"`.


      ### Исходная команда worker {#batch-retain-failing-worker-command}


      Замена выданной падающей команды успешной скрывает отказ валидации; сохраните исходную команду worker из живого Job и зафиксированных facts. Исходный Job задаёт backoffLimit=100 и activeDeadlineSeconds=300; повторяющийся CronJob отсутствует. Требуемый результат — ограниченная неудачная валидация. Setup удаляет job.yaml: изучайте живые объекты и выданный batch-contract.json. `kubectl get job importer -o json | jq ''.spec.template.spec.containers[] | select(.name=="worker") | .command''`.


      ### Наблюдаемый отказ выполнения {#batch-never-restart-policy}


      Restart policy, отличная от Never, повторяет запуск внутри Pod вместо ожидаемого завершённого отказа; сохраните выданную политику. Исходный Job задаёт backoffLimit=100 и activeDeadlineSeconds=300; повторяющийся CronJob отсутствует. Требуемый результат — ограниченная неудачная валидация. Setup удаляет job.yaml: изучайте живые объекты и выданный batch-contract.json. `kubectl get job importer -o jsonpath="{.spec.template.spec.restartPolicy}"`.


      ### Одно параллельное выполнение {#batch-single-parallel-execution}


      При изменении лимитов могли увеличить parallelism; оставьте у importer единицу и проверьте API, если поле не наблюдается. Исходный Job задаёт backoffLimit=100 и activeDeadlineSeconds=300; повторяющийся CronJob отсутствует. Требуемый результат — ограниченная неудачная валидация. Setup удаляет job.yaml: изучайте живые объекты и выданный batch-contract.json. `kubectl get job importer -o jsonpath="{.spec.parallelism}"`.


      ### Лимит текущих повторов {#batch-bound-current-job-retries}


      Выданный Job допускает 100 повторов; уменьшите backoffLimit до единицы у существующего Job, ограничив отказ валидации. Исходный Job задаёт backoffLimit=100 и activeDeadlineSeconds=300; повторяющийся CronJob отсутствует. Требуемый результат — ограниченная неудачная валидация. Setup удаляет job.yaml: изучайте живые объекты и выданный batch-contract.json. `kubectl get job importer -o jsonpath="{.spec.backoffLimit}"`.


      ### Срок текущего выполнения {#batch-bound-current-job-deadline}


      Выданный activeDeadlineSeconds равен 300; задайте существующему Job требуемые 30 секунд вместо удаления выполнения. Исходный Job задаёт backoffLimit=100 и activeDeadlineSeconds=300; повторяющийся CronJob отсутствует. Требуемый результат — ограниченная неудачная валидация. Setup удаляет job.yaml: изучайте живые объекты и выданный batch-contract.json. `kubectl get job importer -o jsonpath="{.spec.activeDeadlineSeconds}"`.


      ### Наблюдение текущего Job {#batch-current-job-api-observation}


      Текущий Job может отсутствовать либо запрос API, разбор JSON или таймаут мешают чтению; проверьте importer до сравнения исходной нагрузки. Исходный Job задаёт backoffLimit=100 и activeDeadlineSeconds=300; повторяющийся CronJob отсутствует. Требуемый результат — ограниченная неудачная валидация. Setup удаляет job.yaml: изучайте живые объекты и выданный batch-contract.json. `kubectl get job importer --request-timeout=3s`.


      ### Исходная нагрузка и идентичность {#batch-original-image-command-and-identity}


      Текущий Job могли заменить либо изменить исходный image, команду worker или Never; сравните с зафиксированными batch-identities. Исходный Job задаёт backoffLimit=100 и activeDeadlineSeconds=300; повторяющийся CronJob отсутствует. Требуемый результат — ограниченная неудачная валидация. Setup удаляет job.yaml: изучайте живые объекты и выданный batch-contract.json. `kubectl get job importer -o json | jq ''{uid:.metadata.uid,spec:.spec}''`.


      ### Активное расписание без наложений {#batch-active-cron-schedule-and-concurrency}


      Повторяющийся CronJob может отсутствовать, быть suspended, иметь другое расписание или допускать наложение; сравните с batch-contract.json. Ошибки API/таймаута чтения также дают этот маркер. Исходный Job задаёт backoffLimit=100 и activeDeadlineSeconds=300; повторяющийся CronJob отсутствует. Требуемый результат — ограниченная неудачная валидация. Setup удаляет job.yaml: изучайте живые объекты и выданный batch-contract.json. `kubectl get cronjob validation-cycle -o json | jq .spec`.


      ### Ограниченный повторяющийся шаблон {#batch-bounded-recurring-job-template}


      Шаблон CronJob может сохранять широкие retry/deadline либо менять нагрузку; перенесите четыре точных ограничения и исходные image, команду и Never. Исходный Job задаёт backoffLimit=100 и activeDeadlineSeconds=300; повторяющийся CronJob отсутствует. Требуемый результат — ограниченная неудачная валидация. Setup удаляет job.yaml: изучайте живые объекты и выданный batch-contract.json. `kubectl get cronjob validation-cycle -o json | jq .spec.jobTemplate.spec`.


      ### Реальная неудачная попытка {#batch-observe-current-failed-attempt}


      Падающая команда могла ещё не выполниться либо отказ скрыли; сохраните исходный Job и проверьте счётчик failed и events. Исходный Job задаёт backoffLimit=100 и activeDeadlineSeconds=300; повторяющийся CronJob отсутствует. Требуемый результат — ограниченная неудачная валидация. Setup удаляет job.yaml: изучайте живые объекты и выданный batch-contract.json. `kubectl get job importer -o json | jq .status.failed`.


      ### Завершение Job отказом {#batch-terminal-current-job-failure}


      Job может продолжать повторы со старыми лимитами либо ещё не завершиться отказом; проверьте ограничения и дождитесь Failed=True. Исходный Job задаёт backoffLimit=100 и activeDeadlineSeconds=300; повторяющийся CronJob отсутствует. Требуемый результат — ограниченная неудачная валидация. Setup удаляет job.yaml: изучайте живые объекты и выданный batch-contract.json. `kubectl get job importer -o json | jq .status.conditions`.


      ### Упавший Pod исходного Job {#batch-original-job-owned-failed-pod}


      Одна метка не доказывает принадлежность упавшего Pod исходному Job; проверьте controller owner UID, фазу Failed и exit code один у worker. Исходный Job задаёт backoffLimit=100 и activeDeadlineSeconds=300; повторяющийся CronJob отсутствует. Требуемый результат — ограниченная неудачная валидация. Setup удаляет job.yaml: изучайте живые объекты и выданный batch-contract.json. `kubectl get pods -l job-name=importer -o json | jq ''.items[] | {owners:.metadata.ownerReferences,status:.status}''`.


      ### Реальный Job по расписанию {#batch-observed-cron-owned-failed-job}


      Верный шаблон не доказывает выполнение; дождитесь реального ограниченного дочернего Job от CronJob, завершившегося отказом. Ошибки API/таймаутов чтения Jobs также дают этот маркер. Исходный Job задаёт backoffLimit=100 и activeDeadlineSeconds=300; повторяющийся CronJob отсутствует. Требуемый результат — ограниченная неудачная валидация. Setup удаляет job.yaml: изучайте живые объекты и выданный batch-contract.json. `kubectl get jobs -o json | jq ''.items[] | {name:.metadata.name,owners:.metadata.ownerReferences,status:.status}''`.


      ### Цепочка владельцев controller {#batch-child-owner-chain-and-real-exit}


      У повторяющегося выполнения может не быть Failed Pod с исходной нагрузкой и exit code один; проследите CronJob→Job→Pod по controller UID. Ошибки API/таймаутов чтения Pods также дают этот маркер. Исходный Job задаёт backoffLimit=100 и activeDeadlineSeconds=300; повторяющийся CronJob отсутствует. Требуемый результат — ограниченная неудачная валидация. Setup удаляет job.yaml: изучайте живые объекты и выданный batch-contract.json. `kubectl get pods -o json | jq ''.items[] | {name:.metadata.name,owners:.metadata.ownerReferences,status:.status}''`.


      ### Запуск наблюдения политики {#batch-policy-startup-fallback}


      Ранняя shell-проверка с лимитом 8s может завершиться по таймауту без маркера, например при зависшем kubectl; ошибки запуска helper или зафиксированных facts также дают fallback. Ошибки API/таймауты внутри Python-наблюдателя дают маркер запрошенного объекта. Исходный Job задаёт backoffLimit=100 и activeDeadlineSeconds=300; повторяющийся CronJob отсутствует. Требуемый результат — ограниченная неудачная валидация. Setup удаляет job.yaml: изучайте живые объекты и выданный batch-contract.json. `python3 -I -c "import dq_check"; jq .contract /run/dq/facts/0/batch-identities.json`.


      ### Запуск наблюдения выполнения {#batch-evidence-startup-fallback}


