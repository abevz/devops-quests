  example: state
  source_hash: 0a6090ca1ab8ddbb55297d9aa1d4c1e692166b51d596a74ab19250973ac0c490
  content:
    en: 'State binds resource addresses to managed object identities. A normal plan compares configuration, state and refreshed objects. Editing the file outside OpenTofu creates drift; applying the reviewed plan restores the declared content.


      ## Try it


      Open the **opentofu Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Does editing the managed file update the HCL declaration?


      ```bash

      cd ~/lab/examples/state

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The next plan proposes reconciliation; apply restores declared.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'State связывает адреса ресурсов с объектами. Обычный plan сопоставляет код, state и прочитанные объекты. Изменение файла вне OpenTofu создаёт дрейф; применение проверенного плана восстанавливает заданное содержимое.


      ## Попробуйте


      Откройте лабораторию **opentofu**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Изменение управляемого файла обновляет HCL?


      ```bash

      cd ~/lab/examples/state

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Следующий plan предлагает восстановление; apply возвращает declared.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
  full_example: full-state
terraform-4:
