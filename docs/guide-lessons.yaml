ansible-4:
  profile: ansible
  example: idempotency
  source_hash: 7b663de26dd3c3323887a3a5bd81f4963c59a33ea76809ac95f65be583af42ee
  content:
    en: 'An idempotent task converges on a declared state. Running it twice should leave the second recap unchanged. changed_when only controls reporting; it does not undo a command’s side effects.


      ### Copy task and repeat-run recap {#repeat-copy-idempotence}


      In quest 025, a read-only command reports a change on every run. Mark that probe with `changed_when: false`; this changes reporting, not the command''s behavior. Deliver `north-ready` with mode `0644`, then run the playbook again and verify each host reports `changed=0` and `failed=0` while its file remains correct. Read the saved recap first. A missing host row or nonzero counters can fail the repeat check. If all expected rows and counters are present, check whether the Python parser starts. A shell error can stop the probe before it reports a result.


      ### Route list and directory loop {#route-directory-loop}


      015: Use `loop: ''{{ routes }}''` on the directory task; `item` is the current route name. Keep `state: directory` and `mode: ''0750''`. The check reads a nonempty list of distinct directory names from routes.yml. Check the file and the play results before interpreting a failure for an individual host. If the diagnostic has no route or host result, check that Python and its YAML module are available on the workstation.


      ```sh

      ansible-playbook rollout.yml

      ansible fleet -i inventory.ini -m ansible.builtin.command -a ''ls -ld /srv/routes/north /srv/routes/south /srv/routes/east''

      ```


      Each host shows three directories with permissions `drwxr-x---`. To verify adaptation, add `west` to `routes.yml` and rerun the same playbook; `/srv/routes/west` must also be a directory with mode `0750` on every host.


      ```sh

      ansible fleet -i inventory.ini -m ansible.builtin.command -a ''ls -ld /srv/routes/west''

      ```


      ### Content and mode of the copied message {#fleet-message-permissions}


      In quest 005, `rollout.yml` copies `north-ready` to `/srv/site/message` but sets mode `0600`. Set the copy task mode to `0644`, run the playbook and inspect both content and mode on all three fleet hosts. Repeating the converged play should not require another change.


      ## Try it


      Open the **ansible Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Will copying identical content count as another change?


      ```bash

      cd ~/lab/examples/idempotency

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The second run and check mode report changed=0.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.


      A useful preview makes a falsifiable prediction about pending work while leaving application data and consumer caches unchanged. Compare that prediction with a normal application, then preview the converged result. Recap counters and real effects must agree across all three phases; a forced command or handler can violate preview safety even when a file module supports check mode.


      In quest 079, stored configuration, live service state and convergence of the current program are separate observations. Matching file bytes can leave a process cache stale because no new change queues a notification. Compare the actual consumer response and preserve other caller data while honoring `caller-contract.json`. Assess the second application using both recaps and real output state.'
    ru: 'Идемпотентная задача приводит систему к заданному состоянию. Повторный запуск должен показать отсутствие изменений. changed_when управляет отчётом, но не отменяет побочные эффекты команды.


      ### Задача копирования и сводка повторного запуска {#repeat-copy-idempotence}


      В квесте 025 команда только для чтения сообщает об изменении при каждом запуске. Укажите для этой проверки `changed_when: false`: это меняет отчет, а не поведение команды. Доставьте `north-ready` с режимом `0644`, затем повторно запустите playbook и проверьте, что каждая машина сообщает `changed=0` и `failed=0`, а ее файл остается правильным. Сначала прочитайте сохранённую сводку. Отсутствие строки хоста или ненулевые счётчики могут сорвать проверку. Если все ожидаемые строки и счётчики на месте, проверьте, запускается ли разбор сводки в Python. Ошибка оболочки может прервать проверку до вывода результата.


      ### Список маршрутов и каталоги {#route-directory-loop}


      015: Добавьте `loop: ''{{ routes }}''` к задаче создания каталогов; `item` — имя текущего маршрута. Сохраните `state: directory` и `mode: ''0750''`. Проверка читает из routes.yml непустой список уникальных имён каталогов. Проверьте файл и результаты play, прежде чем разбирать отказ на отдельном хосте. Если диагностика не показывает маршрут или хост, проверьте, что на рабочей станции доступны Python и модуль YAML.


      ```sh

      ansible-playbook rollout.yml

      ansible fleet -i inventory.ini -m ansible.builtin.command -a ''ls -ld /srv/routes/north /srv/routes/south /srv/routes/east''

      ```


      На каждом узле видны три каталога с правами `drwxr-x---`. Для проверки адаптации добавьте `west` в `routes.yml` и снова выполните тот же playbook: `/srv/routes/west` тоже должен стать каталогом с правами `0750` на каждом узле.


      ```sh

      ansible fleet -i inventory.ini -m ansible.builtin.command -a ''ls -ld /srv/routes/west''

      ```


      ### Содержимое и права скопированного файла {#fleet-message-permissions}


      В квесте 005 `rollout.yml` копирует `north-ready` в `/srv/site/message`, но задает режим `0600`. Установите в задаче copy режим `0644`, запустите playbook и проверьте содержимое и режим на всех трех машинах fleet. Повторный запуск после достижения нужного состояния не должен требовать новых изменений.


      ## Попробуйте


      Откройте лабораторию **ansible**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Копирование идентичного содержимого снова будет изменением?


      ```bash

      cd ~/lab/examples/idempotency

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Повторный запуск и check mode показывают changed=0.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.


      Полезный предварительный просмотр даёт проверяемый прогноз ожидающей работы, сохраняя данные приложения и кеши потребителей. Сравните прогноз с обычным применением, затем просмотрите сошедшийся результат. Счётчики и реальные эффекты должны согласоваться во всех трёх фазах; принудительная команда или handler может нарушить безопасность просмотра даже при поддержке check mode файловым модулем.


      В квесте 079 сохранённая конфигурация, состояние работающего сервиса и сходимость текущей программы наблюдаются отдельно. Совпадающие байты файла могут оставить кеш процесса устаревшим: новое изменение не поставило уведомление в очередь. Сравнивайте реальный ответ потребителя и сохраняйте остальные данные вызывающей стороны, выполняя `caller-contract.json`. Оценивайте повторное применение по отчёту и реальному состоянию результатов.'
    pl: 'Zadanie idempotentne zbiega się z zadeklarowanym stanem. Uruchomienie go dwukrotnie powinno pozostawić drugie podsumowanie bez zmian. changed_when kontroluje tylko raportowanie; nie cofa skutków ubocznych polecenia.


      ### Kopiowanie i podsumowanie kolejnego przebiegu {#repeat-copy-idempotence}


      W zadaniu 025 polecenie tylko do odczytu zgłasza zmianę przy każdym uruchomieniu. Ustaw dla tej próby `changed_when: false`; zmienia to raportowanie, a nie działanie polecenia. Dostarcz `north-ready` z trybem `0644`, uruchom playbook ponownie i sprawdź, czy każdy host zgłasza `changed=0` i `failed=0`, a jego plik pozostaje poprawny. Najpierw odczytaj zapisane podsumowanie. Brak wiersza hosta lub niezerowe liczniki mogą przerwać sprawdzenie. Gdy oczekiwane wiersze i liczniki są poprawne, sprawdź uruchamianie parsera Pythona. Błąd powłoki może przerwać sondę przed podaniem wyniku.


      ### Lista tras i pętla katalogów {#route-directory-loop}


      015: Dodaj `loop: ''{{ routes }}''` do zadania katalogów; `item` jest nazwą bieżącej trasy. Zachowaj `state: directory` i `mode: ''0750''`. Sprawdzenie czyta z routes.yml niepustą listę różnych nazw katalogów. Przed analizą wyniku danego hosta sprawdź plik i wynik play. Gdy diagnostyka nie wskazuje trasy ani hosta, sprawdź dostępność Pythona i modułu YAML na stacji roboczej.


      ```sh

      ansible-playbook rollout.yml

      ansible fleet -i inventory.ini -m ansible.builtin.command -a ''ls -ld /srv/routes/north /srv/routes/south /srv/routes/east''

      ```


      Każdy host pokazuje trzy katalogi z uprawnieniami `drwxr-x---`. Aby sprawdzić dostosowanie, dodaj `west` do `routes.yml` i ponownie uruchom ten sam playbook; `/srv/routes/west` również musi być katalogiem z trybem `0750` na każdym hoście.


      ```sh

      ansible fleet -i inventory.ini -m ansible.builtin.command -a ''ls -ld /srv/routes/west''

      ```


      ### Treść i tryb skopiowanego pliku {#fleet-message-permissions}


      W zadaniu 005 `rollout.yml` kopiuje `north-ready` do `/srv/site/message`, ale ustawia tryb `0600`. Ustaw tryb zadania copy na `0644`, uruchom playbook i sprawdź zawartość oraz tryb na wszystkich trzech hostach fleet. Ponowny przebieg po osiągnięciu żądanego stanu nie powinien wymagać kolejnej zmiany.


      ## Wypróbuj


      Otwórz laboratorium **ansible** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy kopiowanie identycznej treści będzie się liczyło jako kolejna zmiana?


      ```bash

      cd ~/lab/examples/idempotency

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Drugi przebieg i raport check mode changed=0.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.


      Użyteczny podgląd daje weryfikowalną prognozę oczekującej pracy, zachowując dane aplikacji i pamięci konsumentów. Porównaj prognozę ze zwykłym zastosowaniem, a potem obejrzyj wynik po zbieżności. Liczniki i rzeczywiste skutki muszą być zgodne w trzech fazach; wymuszone polecenie lub handler może naruszyć bezpieczeństwo podglądu mimo obsługi check mode przez moduł plikowy.


      W zadaniu 079 zapisana konfiguracja, stan działającej usługi i zbieżność bieżącego programu są oddzielnymi obserwacjami. Zgodne bajty pliku mogą pozostawić nieaktualną pamięć procesu, ponieważ nowa zmiana nie dodała powiadomienia do kolejki. Porównuj rzeczywistą odpowiedź konsumenta i zachowuj pozostałe dane wywołującego zgodnie z `caller-contract.json`. Oceniaj drugi przebieg przez raporty i rzeczywisty stan wyników.'
    es: 'Una tarea idempotente converge en un estado declarado. Ejecutarlo dos veces debería dejar el segundo resumen sin cambios. changed_when solo controla los informes; no deshace los efectos secundarios de un comando.


      ### Copia y resumen de la segunda ejecución {#repeat-copy-idempotence}


      En el ejercicio 025, un comando de solo lectura informa un cambio en cada ejecución. Marca esa comprobación con `changed_when: false`; esto cambia el informe, no el comportamiento del comando. Entrega `north-ready` con modo `0644`, ejecuta de nuevo el playbook y verifica que cada host informe `changed=0` y `failed=0` y conserve el archivo correcto. Lee primero el resumen guardado. Una fila de host ausente o contadores distintos de cero pueden hacer fallar la repetición. Si las filas y los contadores son correctos, comprueba el arranque del analizador de Python. Un error del shell puede interrumpir la prueba antes del resultado.


      ### Lista de rutas y bucle de directorios {#route-directory-loop}


      015: Use `loop: ''{{ routes }}''` en la tarea de directorios; `item` es el nombre de la ruta actual. Conserve `state: directory` y `mode: ''0750''`. La comprobación lee de routes.yml una lista no vacía de nombres de directorio distintos. Revisa el archivo y el resultado del play antes de interpretar el fallo de un host. Si el diagnóstico no muestra ninguna ruta ni host, comprueba que Python y el módulo YAML estén disponibles en la estación de trabajo.


      ```sh

      ansible-playbook rollout.yml

      ansible fleet -i inventory.ini -m ansible.builtin.command -a ''ls -ld /srv/routes/north /srv/routes/south /srv/routes/east''

      ```


      Cada host muestra tres directorios con permisos `drwxr-x---`. Para comprobar la adaptación, añada `west` a `routes.yml` y ejecute de nuevo el mismo playbook; `/srv/routes/west` también debe ser un directorio con modo `0750` en cada host.


      ```sh

      ansible fleet -i inventory.ini -m ansible.builtin.command -a ''ls -ld /srv/routes/west''

      ```


      ### Contenido y permisos del archivo copiado {#fleet-message-permissions}


      En el ejercicio 005, `rollout.yml` copia `north-ready` a `/srv/site/message`, pero establece el modo `0600`. Cambia el modo de la tarea copy a `0644`, ejecuta el playbook y comprueba contenido y modo en los tres hosts de fleet. Repetir el play cuando ya se alcanzó el estado deseado no debería requerir otro cambio.


      ## Pruébalo


      Abra el laboratorio **ansible** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿Copiar contenido idéntico contará como otro cambio?


      ```bash

      cd ~/lab/examples/idempotency

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. El segundo informe del modo de ejecución y verificación changed=0.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh`, luego `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.


      Una vista previa útil hace una predicción verificable del trabajo pendiente sin modificar datos ni cachés de consumidores. Compara la predicción con una aplicación normal y después previsualiza el resultado convergido. Contadores y efectos reales deben coincidir en las tres fases; una orden o handler forzado puede comprometer la vista previa aunque el módulo de archivos admita check mode.


      En el ejercicio 079, configuración almacenada, servicio activo y convergencia del programa actual son observaciones separadas. Bytes correctos pueden dejar una caché obsoleta porque ningún cambio nuevo encola una notificación. Compara la respuesta real del consumidor y conserva los demás datos del invocador cumpliendo `caller-contract.json`. Evalúa la segunda aplicación con recaps y estado real de las salidas.'
    de: 'Eine idempotente Aufgabe konvergiert in einem deklarierten Zustand. Wenn Sie es zweimal ausführen, sollte die zweite Zusammenfassung unverändert bleiben. changed_when steuert nur die Berichterstellung; Die Nebenwirkungen eines Befehls werden dadurch nicht rückgängig gemacht.


      ### Copy-Aufgabe und Zusammenfassung des zweiten Laufs {#repeat-copy-idempotence}


      In Aufgabe 025 meldet ein nur lesender Befehl bei jedem Lauf eine Änderung. Setze für diese Prüfung `changed_when: false`; das ändert die Meldung, nicht das Verhalten des Befehls. Liefere `north-ready` mit Modus `0644`, führe das Playbook erneut aus und prüfe, dass jeder Host `changed=0` und `failed=0` meldet und seine Datei korrekt bleibt. Lesen Sie zuerst die gespeicherte Zusammenfassung. Eine fehlende Hostzeile oder Zähler ungleich null können die Prüfung fehlschlagen lassen. Prüfen Sie bei korrekten Zeilen und Zählern, ob die Python-Auswertung startet. Ein Shell-Fehler kann die Prüfung vor der Ausgabe abbrechen.


      ### Routenliste und Verzeichnisschleife {#route-directory-loop}


      015: Verwenden Sie `loop: ''{{ routes }}''` an der Verzeichnis-Task; `item` ist der aktuelle Routenname. Behalten Sie `state: directory` und `mode: ''0750''` bei. Die Prüfung liest aus routes.yml eine nicht leere Liste eindeutiger Verzeichnisnamen. Prüfen Sie zuerst die Datei und die Play-Ergebnisse, bevor Sie den Fehler eines einzelnen Hosts untersuchen. Falls die Diagnose keine Route und keinen Host meldet, prüfen Sie Python und das YAML-Modul auf dem Arbeitsplatz.


      ```sh

      ansible-playbook rollout.yml

      ansible fleet -i inventory.ini -m ansible.builtin.command -a ''ls -ld /srv/routes/north /srv/routes/south /srv/routes/east''

      ```


      Jeder Host zeigt drei Verzeichnisse mit Rechten `drwxr-x---`. Fügen Sie zur Prüfung der Anpassung `west` zu `routes.yml` hinzu und starten Sie dasselbe Playbook erneut; `/srv/routes/west` muss ebenfalls auf jedem Host ein Verzeichnis mit Modus `0750` sein.


      ```sh

      ansible fleet -i inventory.ini -m ansible.builtin.command -a ''ls -ld /srv/routes/west''

      ```


      ### Inhalt und Modus der kopierten Datei {#fleet-message-permissions}


      In Aufgabe 005 kopiert `rollout.yml` `north-ready` nach `/srv/site/message`, setzt aber Modus `0600`. Setze den Modus der Copy-Aufgabe auf `0644`, führe das Playbook aus und prüfe Inhalt und Modus auf allen drei Fleet-Hosts. Ein erneuter Lauf im bereits erreichten Zustand sollte keine weitere Änderung erfordern.


      ## Probieren Sie es aus


      Öffnen Sie das **ansible Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und prüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Zählt das Kopieren identischer Inhalte als weitere Änderung?


      ```bash

      cd ~/lab/examples/idempotency

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Der zweite Lauf und Prüfmodusbericht changed=0.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann mit `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.


      Eine nützliche Vorschau liefert eine überprüfbare Vorhersage anstehender Arbeit und bewahrt Anwendungsdaten sowie Verbraucher-Caches. Vergleiche die Vorhersage mit normaler Anwendung und prüfe anschließend das konvergierte Ergebnis erneut. Zähler und tatsächliche Effekte müssen in allen drei Phasen übereinstimmen; ein erzwungener Befehl oder Handler kann die Vorschau trotz Check-Modus-Unterstützung des Dateimoduls unsicher machen.


      In Aufgabe 079 sind gespeicherte Konfiguration, laufender Dienstzustand und Konvergenz des aktuellen Programms getrennte Beobachtungen. Gleiche Dateibytes können einen veralteten Prozess-Cache hinterlassen, weil keine neue Änderung eine Benachrichtigung einreiht. Vergleiche die tatsächliche Verbraucherantwort und bewahre andere Aufruferdaten gemäß `caller-contract.json`. Beurteile den zweiten Lauf anhand von Recaps und tatsächlichem Ausgabezustand.'
  full_example: full-idempotency
ansible-5:
  profile: ansible
  example: variables
  source_hash: 6831fd0ed4c879c0c53812dfa7f9658f78c80f7ec44697c216b57b85ddba2a07
  content:
    en: 'Variables come from several sources. Explicit extra variables override the play value in this experiment. Evaluate a concrete variable and its source rather than memorizing an unexplained precedence number.


      For quest 055: A higher priority variable can replace a whole mapping rather than one field. A host exception must keep its intended scope, while each host still needs a complete effective profile. Stored content alone does not establish which inputs currently win. Inspect evaluated inputs and the published JSON on all stations, then repeat delivery. Both must match the intent, exceptions must remain local to their stations, and the existing message permissions must stay healthy.


      In quest 038, the reusable role defaults remain `retired` and `shared`. Override only the route in `group_vars/fleet.yml`; the inventory variable takes precedence over the role default while the platform default remains. After the playbook, verify `/srv/site/role.txt` on all three hosts reads `north:shared` and the defaults file is unchanged.


      ### Fact records on the fleet {#fleet-fact-records}


      In quest 012, `rollout.yml` uses `ansible_facts.os_family` and `ansible_facts.architecture` to build `/srv/site/facts.json`, but its play disables fact gathering. Enable `gather_facts: true`, run the playbook and inspect the JSON and mode on all three fleet hosts. Each file must contain exactly `family: Debian` and `architecture: x86_64` as JSON values and have mode `0644`; the facts describe each managed host, not the controller.


      ### Inventory override for the station role {#station-inventory-override}


      In quest 038, roles/station/tasks/main.yml renders route:platform. Put route: north in group_vars/fleet.yml and run rollout.yml with the supplied inventory; the inventory value overrides the reusable route default while platform remains shared. Other higher-priority values or an unapplied play can leave wrong content. Read /srv/site/role.txt on app1, app2 and app3; SSH or file-read errors must be resolved before judging the rendered variables.


      ### Keep the reusable defaults {#station-unchanged-defaults}


      In quest 038, keep roles/station/defaults/main.yml as exactly the supplied mapping: route: retired and platform: shared, with no extra keys. Override route at inventory scope instead of editing the role. The defaults observer uses YAML equality; missing or unreadable files, invalid YAML or Python/PyYAML startup failure share the same fallback as a changed mapping.


      ### Evaluate the actual inventory {#profile-inventory-evaluation}


      Effective inventory evaluation failed; malformed inventory or variable files, undefined route_version/service_profile values, or Ansible evaluation errors can prevent producing the per-host inputs.  `ansible-inventory -i inventory.ini --list`.


      ### Dictionary precedence and host exceptions {#profile-dictionary-precedence}


      A resolved route or profile differs from the intent; fleet variables can override all, a higher-priority partial dictionary can replace inherited keys, or a host exception may have been overwritten. Ansible dictionary replacement can discard inherited keys when east, west or app2 supplies only one field. Inspect effective variables with the supplied inventory.ini and ansible.cfg; every host must retain the intended route, its group zone, and its own window. Keep the app2 standby exception while other hosts use primary. The check accepts additional profile keys but requires every contracted value; it evaluates the actual inventory independently of deployed files. `cat profile-intent.json; ansible-inventory -i inventory.ini --host app2`.


      ### Published profile versus effective inputs {#profile-published-state}


      The published host profile is stale, different or unreadable; correcting inventory without rerunning delivery, publishing values that miss a host exception, or a failed SSH read can explain it. After repairing effective variables, run the supplied play to deliver /srv/site/profile.json on app1, app2 and app3. Each published JSON must contain the intended profile subset. Correct inventory alone leaves stale files unchanged. SSH failure uses the delivery marker; successful SSH returning malformed JSON instead uses the observation marker. `ansible-playbook rollout.yml`.


      ### Profile evidence and observation budget {#profile-observation-inputs}


      Profile observations could not be completed; a missing protected intent or per-host result, invalid JSON, unavailable tool, failed process or exhausted observation budget may explain it.  `cat profile-intent.json; ansible-inventory -i inventory.ini --list`.


      ### Content and profile probe startup {#profile-probe-startup}


      The combined content/profile probe stopped without a detailed marker; the workstation directory, Python or its probe module may be unavailable, or the bounded legacy SSH group was interrupted before naming a host failure.  `command -v python3; command -v ssh`.


      ### Effective route on every host {#profile-route-precedence}


      app1 did not deliver north-ready; a higher-priority fleet route_version may still override the intended value from all, delivery may not have run, or SSH/namespace observation failed.  `ansible-inventory -i inventory.ini --host app1`. Repeat the host observation on app2 and app3.


      ### Retain healthy message permissions {#profile-message-permissions}


      app1 did not report mode 644 on /srv/site/message; a task or manual change may have altered the healthy permissions, or SSH/stat could not observe them.  `ansible fleet -i inventory.ini -m shell -a "stat -c %a /srv/site/message"`. Repeat the host observation on app2 and app3.


      ## Try it


      Open the **ansible Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Will message remain play-default after passing -e message=cli?


      ```bash

      cd ~/lab/examples/variables

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The assertion confirms the explicit cli value.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Переменные поступают из нескольких источников. В этом опыте extra vars перекрывают значение из play. Разбирайте конкретное значение и его источник, а не номер в таблице приоритетов.


      Для квеста 055: Переменная с более высоким приоритетом может заменить весь словарь, а не одно поле. Исключение хоста должно сохранять свою область действия, но каждой станции нужен полный действующий профиль. Сохранённое содержимое само по себе не показывает, какие входы сейчас побеждают. Проверьте вычисленные входы и опубликованный JSON на всех станциях, затем повторите доставку. Оба результата должны соответствовать намерению, исключения должны оставаться локальными, а исходные права сообщения — исправными.


      В квесте 038 defaults переиспользуемой роли остаются `retired` и `shared`. Переопределите только route в `group_vars/fleet.yml`: переменная inventory имеет приоритет над default роли, а default platform сохраняется. После playbook проверьте, что `/srv/site/role.txt` на трех машинах содержит `north:shared`, а файл defaults не изменен.


      ### Записи фактов на хостах fleet {#fleet-fact-records}


      В квесте 012 `rollout.yml` использует `ansible_facts.os_family` и `ansible_facts.architecture` для создания `/srv/site/facts.json`, но play отключает сбор фактов. Включите `gather_facts: true`, запустите playbook и проверьте JSON и режим на всех трех машинах fleet. Каждый файл должен содержать ровно значения JSON `family: Debian` и `architecture: x86_64` и иметь режим `0644`; факты описывают управляемую машину, а не контроллер.


      ### Переопределение inventory для роли station {#station-inventory-override}


      В квесте 038 roles/station/tasks/main.yml формирует route:platform. Задайте route: north в group_vars/fleet.yml и запустите rollout.yml с исходным inventory: значение inventory перекрывает default route, а platform остаётся shared. Другие приоритетные значения или невыполненный play могут оставить неверное содержимое. Прочитайте /srv/site/role.txt на app1, app2 и app3; устраните ошибки SSH или чтения до оценки переменных.


      ### Сохранение многоразовых defaults {#station-unchanged-defaults}


      В квесте 038 сохраните roles/station/defaults/main.yml как точную исходную карту: route: retired и platform: shared без лишних ключей. Переопределите route в inventory, а не в роли. Наблюдатель сравнивает YAML; отсутствие или нечитаемость файла, неверный YAML или ошибка запуска Python/PyYAML используют тот же fallback, что и изменённая карта.


      ### Вычисление фактического inventory {#profile-inventory-evaluation}


      Вычисление inventory завершилось ошибкой: некорректные файлы inventory и переменных, неопределённые route_version/service_profile или ошибки Ansible мешают получить входные данные хостов.  `ansible-inventory -i inventory.ini --list`.


      ### Приоритет словарей и исключения хостов {#profile-dictionary-precedence}


      Вычисленный маршрут или профиль отличается от intent: переменные fleet перекрывают all, частичный словарь с большим приоритетом заменяет унаследованные ключи либо исключение хоста было перезаписано. Ansible может заменять словарь целиком и терять наследуемые ключи, если east, west или app2 задаёт лишь одно поле. Проверьте итоговые переменные с выданными inventory.ini и ansible.cfg: каждый хост сохраняет нужный маршрут, зону группы и своё окно. Сохраните standby для app2 и primary для остальных. Дополнительные ключи профиля допустимы, но все контрактные значения обязательны; фактический inventory проверяется независимо от доставленных файлов. `cat profile-intent.json; ansible-inventory -i inventory.ini --host app2`.


      ### Опубликованный профиль и фактические входы {#profile-published-state}


      Опубликованный профиль устарел, отличается или недоступен: исправление inventory без повторной доставки, потеря исключения хоста при публикации или сбой чтения SSH могут объяснить это. После исправления переменных выполните выданный play для доставки /srv/site/profile.json на app1, app2 и app3. Каждый опубликованный JSON содержит нужное подмножество профиля. Одного исправления inventory недостаточно для обновления файлов. Ошибка SSH даёт маркер доставки; успешный SSH с некорректным JSON даёт маркер наблюдения. `ansible-playbook rollout.yml`.


      ### Данные профилей и лимит наблюдения {#profile-observation-inputs}


      Наблюдение профилей не завершено: причиной могут быть отсутствующий защищённый intent или результат хоста, некорректный JSON, недоступный инструмент, сбой процесса или исчерпанный лимит времени.  `cat profile-intent.json; ansible-inventory -i inventory.ini --list`.


      ### Запуск проверки содержимого и профилей {#profile-probe-startup}


      Общая проверка содержимого и профилей остановилась без подробного маркера: рабочий каталог, Python или модуль проверки недоступны либо ограниченная группа SSH прервана до сообщения об ошибке хоста.  `command -v python3; command -v ssh`.


      ### Фактический маршрут на всех хостах {#profile-route-precedence}


      app1 не доставил north-ready: route_version из fleet ещё может перекрывать нужное значение all, доставка не выполнялась либо наблюдение SSH/namespace завершилось ошибкой.  `ansible-inventory -i inventory.ini --host app1`. Повторите наблюдение хоста на app2 и app3.


      ### Сохранение правильных прав сообщения {#profile-message-permissions}


      app1 не подтвердил режим 644 у /srv/site/message: задача или ручная правка могли изменить правильные права либо SSH/stat не смогли их прочитать.  `ansible fleet -i inventory.ini -m shell -a "stat -c %a /srv/site/message"`. Повторите наблюдение хоста на app2 и app3.


      ## Попробуйте


      Откройте лабораторию **ansible**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Останется ли message равным play-default после -e message=cli?


      ```bash

      cd ~/lab/examples/variables

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Assert подтверждает явно переданное значение cli.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Zmienne pochodzą z kilku źródeł. W tym eksperymencie jawne dodatkowe zmienne zastępują wartość play. Zamiast zapamiętywać niewyjaśniony numer pierwszeństwa, oceniaj konkretną zmienną i jej źródło.


      Dla zadania 055: Zmienna o wyższym priorytecie może zastąpić całą mapę zamiast jednego pola. Wyjątek hosta musi zachować swój zakres, a każda stacja nadal potrzebuje kompletnego efektywnego profilu. Sama zapisana treść nie wskazuje, które wejścia obecnie wygrywają. Sprawdź obliczone wejścia i opublikowany JSON na wszystkich stacjach, a potem powtórz dostarczanie. Oba wyniki muszą odpowiadać intencji, wyjątki pozostać lokalne, a pierwotne uprawnienia wiadomości — poprawne.


      W zadaniu 038 defaults roli wielokrotnego użytku pozostają `retired` i `shared`. Nadpisz tylko route w `group_vars/fleet.yml`: zmienna inventory ma pierwszeństwo przed default roli, a default platform pozostaje. Po playbooku sprawdź, że `/srv/site/role.txt` na trzech hostach zawiera `north:shared`, a plik defaults jest niezmieniony.


      ### Rekordy faktów na hostach fleet {#fleet-fact-records}


      W zadaniu 012 `rollout.yml` używa `ansible_facts.os_family` i `ansible_facts.architecture` do utworzenia `/srv/site/facts.json`, ale play wyłącza zbieranie faktów. Włącz `gather_facts: true`, uruchom playbook i sprawdź JSON oraz tryb na wszystkich trzech hostach fleet. Każdy plik musi zawierać dokładnie wartości JSON `family: Debian` i `architecture: x86_64` oraz mieć tryb `0644`; fakty opisują zarządzany host, a nie kontroler.


      ### Nadpisanie inventory dla roli station {#station-inventory-override}


      W zadaniu 038 roles/station/tasks/main.yml renderuje route:platform. Ustaw route: north w group_vars/fleet.yml i uruchom rollout.yml z dostarczonym inventory; wartość inventory nadpisuje default route, a platform pozostaje shared. Inne wartości o wyższym priorytecie lub niewykonany play mogą zostawić złą treść. Odczytaj /srv/site/role.txt na app1, app2 i app3; wyjaśnij błędy SSH lub odczytu przed oceną zmiennych.


      ### Zachowanie defaults wielokrotnego użytku {#station-unchanged-defaults}


      W zadaniu 038 zachowaj roles/station/defaults/main.yml jako dokładnie dostarczoną mapę: route: retired i platform: shared, bez dodatkowych kluczy. Nadpisz route w inventory zamiast edytować rolę. Obserwator porównuje YAML; brak lub nieczytelność pliku, błędny YAML lub błąd startu Python/PyYAML dzieli fallback ze zmienioną mapą.


      ### Ocena rzeczywistego inventory {#profile-inventory-evaluation}


      Obliczenie inventory zawiodło; błędne pliki inventory lub zmiennych, niezdefiniowane route_version/service_profile albo błędy Ansible mogą blokować dane hostów.  `ansible-inventory -i inventory.ini --list`.


      ### Priorytet słowników i wyjątki hostów {#profile-dictionary-precedence}


      Rozwiązana trasa lub profil różni się od intent; zmienne fleet mogą nadpisać all, częściowy słownik o wyższym priorytecie zastąpić klucze nadrzędne albo wyjątek hosta został nadpisany. Zastępowanie słowników Ansible może usuwać dziedziczone klucze, gdy east, west lub app2 podaje tylko jedno pole. Sprawdź efektywne zmienne z dostarczonymi inventory.ini i ansible.cfg; każdy host zachowuje trasę, strefę grupy i własne okno. Zachowaj standby dla app2 i primary dla pozostałych. Dodatkowe klucze są dozwolone, ale wymagane są wszystkie wartości kontraktu; rzeczywisty inventory jest oceniany niezależnie od wdrożonych plików. `cat profile-intent.json; ansible-inventory -i inventory.ini --host app2`.


      ### Opublikowany profil i efektywne dane {#profile-published-state}


      Opublikowany profil hosta jest stary, inny lub nieczytelny; poprawa inventory bez ponownej dostawy, utrata wyjątku hosta przy publikacji lub błąd odczytu SSH może to wyjaśnić. Po naprawie zmiennych uruchom dostarczony play, aby dostarczyć /srv/site/profile.json na app1, app2 i app3. Każdy JSON zawiera wymagany podzbiór profilu. Sama poprawa inventory pozostawia stare pliki. Błąd SSH daje marker dostarczenia; udane SSH z błędnym JSON daje marker obserwacji. `ansible-playbook rollout.yml`.


      ### Dane profili i limit obserwacji {#profile-observation-inputs}


      Obserwacje profili nie zostały ukończone; przyczyną może być brak chronionego intent lub wyniku hosta, błędny JSON, niedostępne narzędzie, błąd procesu albo wyczerpany limit czasu.  `cat profile-intent.json; ansible-inventory -i inventory.ini --list`.


      ### Start kontroli treści i profili {#profile-probe-startup}


      Połączona kontrola treści i profili zatrzymała się bez szczegółowego markera; katalog roboczy, Python lub moduł kontroli może być niedostępny albo ograniczona grupa SSH została przerwana przed nazwaniem błędu hosta.  `command -v python3; command -v ssh`.


      ### Efektywna trasa na każdym hoście {#profile-route-precedence}


      app1 nie dostarczył north-ready; route_version z fleet może nadal nadpisywać wartość all, dostawa nie została uruchomiona albo obserwacja SSH/namespace zawiodła.  `ansible-inventory -i inventory.ini --host app1`. Powtórz obserwację hosta na app2 i app3.


      ### Zachowanie poprawnych praw komunikatu {#profile-message-permissions}


      app1 nie zgłosił trybu 644 dla /srv/site/message; zadanie lub ręczna zmiana mogły naruszyć poprawne prawa albo SSH/stat ich nie odczytał.  `ansible fleet -i inventory.ini -m shell -a "stat -c %a /srv/site/message"`. Powtórz obserwację hosta na app2 i app3.


      ## Wypróbuj


      Otwórz laboratorium **ansible** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy message pozostanie play-default po przejściu -e message=cli?


      ```bash

      cd ~/lab/examples/variables

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Asercja potwierdza jawną wartość cli.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Las variables provienen de varias fuentes. Las variables explícitas extra anulan el valor play en este experimento. Evalúe una variable concreta y su origen en lugar de memorizar un número de precedencia inexplicable.


      Para el quest 055: Una variable de mayor prioridad puede reemplazar un mapa entero en vez de un campo. Una excepción de host debe conservar su ámbito, mientras cada estación necesita un perfil efectivo completo. El contenido almacenado no demuestra por sí solo qué entradas prevalecen ahora. Inspecciona las entradas evaluadas y el JSON publicado en todas las estaciones y repite la entrega. Ambos deben seguir la intención, las excepciones deben mantenerse locales y los permisos originales del mensaje deben seguir correctos.


      En el ejercicio 038, los defaults del rol reutilizable siguen siendo `retired` y `shared`. Sobrescribe solo route en `group_vars/fleet.yml`: la variable de inventory tiene prioridad sobre el default del rol, mientras se conserva el default de platform. Tras el playbook, verifica que `/srv/site/role.txt` en los tres hosts contiene `north:shared` y que el archivo de defaults no cambió.


      ### Registros de hechos en la flota {#fleet-fact-records}


      En el ejercicio 012, `rollout.yml` usa `ansible_facts.os_family` y `ansible_facts.architecture` para crear `/srv/site/facts.json`, pero el play desactiva la recopilación de facts. Activa `gather_facts: true`, ejecuta el playbook y comprueba el JSON y el modo en los tres hosts de fleet. Cada archivo debe contener exactamente los valores JSON `family: Debian` y `architecture: x86_64` y tener modo `0644`; los facts describen cada host administrado, no el controlador.


      ### Override de inventario para station {#station-inventory-override}


      En el reto 038, roles/station/tasks/main.yml genera route:platform. Pon route: north en group_vars/fleet.yml y ejecuta rollout.yml con el inventario suministrado; ese valor sobrescribe el default route y platform sigue shared. Otros valores prioritarios o un play sin ejecutar pueden dejar contenido incorrecto. Lee /srv/site/role.txt en app1, app2 y app3; resuelve fallos SSH o de lectura antes de juzgar las variables.


      ### Conservar los defaults reutilizables {#station-unchanged-defaults}


      En el reto 038, conserva roles/station/defaults/main.yml como el mapa exacto suministrado: route: retired y platform: shared, sin claves extra. Sobrescribe route en el inventario en vez de editar el rol. El observador compara YAML; archivos ausentes o ilegibles, YAML inválido o fallos de arranque Python/PyYAML comparten el fallback con un mapa cambiado.


      ### Evaluar el inventory real {#profile-inventory-evaluation}


      La evaluación de inventory falló; archivos inventory o de variables inválidos, route_version/service_profile indefinidos o errores Ansible impiden producir entradas por host.  `ansible-inventory -i inventory.ini --list`.


      ### Precedencia de diccionarios y excepciones {#profile-dictionary-precedence}


      Una ruta o perfil resuelto difiere del intent; fleet puede sobrescribir all, un diccionario parcial prioritario reemplazar claves heredadas o una excepción de host haberse sobrescrito. El reemplazo de diccionarios Ansible puede perder claves heredadas cuando east, west o app2 aporta un solo campo. Inspeccione variables efectivas con inventory.ini y ansible.cfg suministrados: cada host conserva ruta, zona del grupo y ventana propia. Mantenga standby para app2 y primary para los demás. Se admiten claves adicionales, pero se exigen todos los valores contratados; se evalúa el inventory real independientemente de los archivos desplegados. `cat profile-intent.json; ansible-inventory -i inventory.ini --host app2`.


      ### Perfil publicado y entradas efectivas {#profile-published-state}


      El perfil publicado está antiguo, distinto o ilegible; corregir inventory sin volver a entregar, omitir una excepción de host al publicar o fallar la lectura SSH puede explicarlo. Tras reparar variables, ejecute el play suministrado para entregar /srv/site/profile.json en app1, app2 y app3. Cada JSON publicado contiene el subconjunto de perfil requerido. Corregir solo inventory deja archivos obsoletos. Fallo SSH usa el marcador de entrega; SSH correcto con JSON malformado usa el de observación. `ansible-playbook rollout.yml`.


      ### Datos de perfiles y plazo de observación {#profile-observation-inputs}


      No se completaron las observaciones de perfiles; intent protegido o resultado de host ausente, JSON inválido, herramienta no disponible, proceso fallido o plazo agotado pueden explicarlo.  `cat profile-intent.json; ansible-inventory -i inventory.ini --list`.


      ### Inicio de prueba de contenido y perfiles {#profile-probe-startup}


      La prueba conjunta de contenido y perfiles se detuvo sin marcador detallado; el directorio de trabajo, Python o su módulo puede no estar disponible o se interrumpió el grupo SSH antes de informar el host fallido.  `command -v python3; command -v ssh`.


      ### Ruta efectiva en cada host {#profile-route-precedence}


      app1 no entregó north-ready; route_version de fleet puede seguir sobrescribiendo all, la entrega no se ejecutó o falló la observación SSH/namespace.  `ansible-inventory -i inventory.ini --host app1`. Repita la observación del host en app2 y app3.


      ### Conservar permisos correctos del mensaje {#profile-message-permissions}


      app1 no informó modo 644 en /srv/site/message; una tarea o cambio manual puede haber alterado los permisos correctos o SSH/stat no pudo observarlos.  `ansible fleet -i inventory.ini -m shell -a "stat -c %a /srv/site/message"`. Repita la observación del host en app2 y app3.


      ## Pruébalo


      Abra el laboratorio **ansible** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿message seguirá siendo play-default después de pasar -e message=cli?


      ```bash

      cd ~/lab/examples/variables

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. La afirmación confirma el valor explícito de cli.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh` y luego con `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Variablen stammen aus mehreren Quellen. Explizite extra-Variablen überschreiben in diesem Experiment den play-Wert. Bewerten Sie eine konkrete Variable und ihre Quelle, anstatt sich eine ungeklärte Prioritätsnummer zu merken.


      Für Quest 055: Eine Variable höherer Priorität kann eine ganze Zuordnung statt eines Feldes ersetzen. Eine Hostausnahme muss ihren Geltungsbereich behalten, während jede Station ein vollständiges wirksames Profil benötigt. Gespeicherter Inhalt allein belegt keine aktuell gewinnenden Eingaben. Prüfe ausgewertete Eingaben und veröffentlichtes JSON auf allen Stationen und wiederhole die Auslieferung. Beide müssen der Absicht entsprechen, Ausnahmen müssen lokal bleiben und die ursprünglichen Nachrichtenberechtigungen gesund bleiben.


      In Aufgabe 038 bleiben die Defaults der wiederverwendbaren Rolle `retired` und `shared`. Überschreibe nur route in `group_vars/fleet.yml`: Die Inventory-Variable hat Vorrang vor dem Rollen-Default, während der Platform-Default erhalten bleibt. Prüfe nach dem Playbook, dass `/srv/site/role.txt` auf allen drei Hosts `north:shared` enthält und die Defaults-Datei unverändert ist.


      ### Fakten auf den Fleet-Hosts {#fleet-fact-records}


      In Aufgabe 012 verwendet `rollout.yml` `ansible_facts.os_family` und `ansible_facts.architecture` für `/srv/site/facts.json`, aber das Play deaktiviert die Faktensammlung. Aktiviere `gather_facts: true`, führe das Playbook aus und prüfe JSON und Modus auf allen drei Fleet-Hosts. Jede Datei muss genau die JSON-Werte `family: Debian` und `architecture: x86_64` enthalten und Modus `0644` haben; die Fakten beschreiben den verwalteten Host, nicht den Controller.


      ### Inventory-Override für station {#station-inventory-override}


      In Quest 038 rendert roles/station/tasks/main.yml route:platform. Setze route: north in group_vars/fleet.yml und führe rollout.yml mit dem gelieferten Inventory aus; der Inventory-Wert überschreibt den wiederverwendbaren route-Default, platform bleibt shared. Andere höher priorisierte Werte oder ein nicht ausgeführtes Play können falschen Inhalt hinterlassen. Lies /srv/site/role.txt auf app1, app2 und app3; kläre SSH- oder Dateilesefehler vor der Bewertung der Variablen.


      ### Wiederverwendbare Defaults erhalten {#station-unchanged-defaults}


      Behalte in Quest 038 roles/station/defaults/main.yml als exakt gelieferte Map: route: retired und platform: shared ohne zusätzliche Schlüssel. Überschreibe route im Inventory statt in der Rolle. Der Beobachter vergleicht YAML; fehlende oder unlesbare Dateien, ungültiges YAML oder Python-/PyYAML-Startfehler teilen den Fallback mit einer geänderten Map.


      ### Tatsächliches Inventory auswerten {#profile-inventory-evaluation}


      Die Inventory-Auswertung schlug fehl; fehlerhafte Inventory-/Variablendateien, undefinierte route_version/service_profile oder Ansible-Auswertungsfehler verhindern Eingaben je Host.  `ansible-inventory -i inventory.ini --list`.


      ### Dictionary-Priorität und Host-Ausnahmen {#profile-dictionary-precedence}


      Eine aufgelöste Route oder ein Profil weicht vom Intent ab; fleet-Variablen können all überlagern, ein höher priorisiertes Teil-Dictionary geerbte Schlüssel ersetzen oder eine Host-Ausnahme wurde überschrieben. Das Ersetzen von Ansible-Dictionaries kann geerbte Schlüssel verlieren, wenn east, west oder app2 nur ein Feld liefert. Prüfen Sie effektive Variablen mit gelieferten inventory.ini und ansible.cfg; jeder Host erhält seine Route, Gruppenzone und eigenes Fenster. Erhalten Sie standby für app2 und primary für die anderen Hosts. Zusätzliche Profilschlüssel sind erlaubt, alle Vertragswerte bleiben erforderlich; das tatsächliche Inventory wird unabhängig von bereitgestellten Dateien ausgewertet. `cat profile-intent.json; ansible-inventory -i inventory.ini --host app2`.


      ### Veröffentlichtes Profil und effektive Eingaben {#profile-published-state}


      Das veröffentlichte Host-Profil ist veraltet, abweichend oder unlesbar; korrigiertes Inventory ohne erneute Zustellung, fehlende Host-Ausnahme bei der Publikation oder ein SSH-Lesefehler können die Ursache sein. Führen Sie nach der Variablenkorrektur den gelieferten Play aus, um /srv/site/profile.json auf app1, app2 und app3 bereitzustellen. Jedes JSON enthält die benötigte Profilteilmenge. Korrektes Inventory allein aktualisiert alte Dateien nicht. Ein SSH-Fehler nutzt den Bereitstellungsmarker; erfolgreiches SSH mit fehlerhaftem JSON nutzt den Beobachtungsmarker. `ansible-playbook rollout.yml`.


      ### Profilbelege und Beobachtungsbudget {#profile-observation-inputs}


      Profilbeobachtungen konnten nicht abgeschlossen werden; fehlender geschützter Intent oder Host-Ergebnis, ungültiges JSON, fehlendes Werkzeug, fehlgeschlagener Prozess oder erschöpftes Zeitbudget können die Ursache sein.  `cat profile-intent.json; ansible-inventory -i inventory.ini --list`.


      ### Start der Inhalts-/Profilprüfung {#profile-probe-startup}


      Die kombinierte Inhalts-/Profilprüfung endete ohne Detailmarker; Arbeitsverzeichnis, Python oder Prüfmodul sind möglicherweise nicht verfügbar oder die begrenzte SSH-Gruppe wurde vor der Hostdiagnose unterbrochen.  `command -v python3; command -v ssh`.


      ### Effektive Route auf jedem Host {#profile-route-precedence}


      app1 lieferte nicht north-ready; route_version aus fleet überlagert möglicherweise noch den Wert aus all, die Zustellung lief nicht oder SSH-/Namespace-Beobachtung schlug fehl.  `ansible-inventory -i inventory.ini --host app1`. Wiederholen Sie die Host-Beobachtung auf app2 und app3.


      ### Korrekte Nachrichtenrechte erhalten {#profile-message-permissions}


      app1 meldete für /srv/site/message nicht Modus 644; eine Aufgabe oder manuelle Änderung hat möglicherweise korrekte Rechte verändert oder SSH/stat konnte sie nicht beobachten.  `ansible fleet -i inventory.ini -m shell -a "stat -c %a /srv/site/message"`. Wiederholen Sie die Host-Beobachtung auf app2 und app3.


      ## Probieren Sie es aus


      Öffnen Sie das **ansible Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Bleibt message play-default, nachdem -e message=cli passiert ist?


      ```bash

      cd ~/lab/examples/variables

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Die Behauptung bestätigt den expliziten cli-Wert.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das vollständige Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-variables
ansible-7:
  profile: ansible
  example: templates
  source_hash: 08f5ad07a3c4eab2e6681b03182af11412c5382de5e6332699334df0c1431adb
  content:
    en: 'A Jinja template renders configuration from data before the template module compares the result with the destination. Changing a variable can change the rendered file; rendering the same values again should converge.


      ### Host context and route rendering {#rendering-station-routes}


      For quest 022: A template is evaluated in the current host context on the controller. A value shaped as a record is different from a host name or a map indexed by host. Separate context errors from valid text that merely contains a fixed route. Apply the current inputs, then use check mode with alternative inputs. Each host identity must stay correct, route differences must follow the supplied data, and the check-mode run must not change stored banners. If a check stops before reporting a condition, verify that the workstation can start Python and load the probe helper.


      ### Template values and file permissions {#board-template-values}


      In quest 018, `rollout.yml` loads `station.yml`, which supplies `route: north` and `slots: 3`, and renders `board.j2` for each host in `fleet`. Use `{{ inventory_hostname }}` for the current host and `{{ route }}` and `{{ slots }}` for the supplied values. After running the playbook, `/srv/site/board` on each host should read `station=app1 route=north slots=3`, `station=app2 route=north slots=3`, or `station=app3 route=north slots=3` respectively, with mode `0644`. Verify the content and mode on all three hosts.


      ## Try it


      Open the **ansible Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Does an unchanged template file mean an unchanged result after a variable override?


      ```bash

      cd ~/lab/examples/templates

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Expected result

      > No. Overriding listen_port changes the rendered port to 9090.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Jinja строит конфигурацию из данных, затем template сравнивает результат с файлом назначения. Новая переменная может изменить файл; повтор тех же значений должен сходиться без изменений.


      ### Контекст хоста и подстановка маршрута {#rendering-station-routes}


      Для квеста 022: Шаблон вычисляется на контроллере в контексте текущего хоста. Значение-запись отличается от имени хоста или словаря, индексированного по хосту. Различайте ошибку контекста и допустимый текст с постоянным маршрутом. Примените текущие входные данные, затем используйте check mode с другими данными. Идентичность каждой станции должна сохраняться, отличия маршрутов должны следовать данным, а check mode не должен менять сохранённые баннеры. Если проверка завершается до вывода результата по условию, проверьте запуск Python и загрузку модуля проверки на рабочей станции.


      ### Значения шаблона и права файла {#board-template-values}


      В квесте 018 `rollout.yml` загружает `station.yml` со значениями `route: north` и `slots: 3`, затем создает результат `board.j2` для каждой машины из `fleet`. Используйте `{{ inventory_hostname }}` для текущей машины, а `{{ route }}` и `{{ slots }}` — для заданных значений. После запуска playbook файл `/srv/site/board` на соответствующих машинах должен содержать `station=app1 route=north slots=3`, `station=app2 route=north slots=3` или `station=app3 route=north slots=3` и иметь режим `0644`. Проверьте содержимое и режим на всех трех машинах.


      ## Попробуйте


      Откройте лабораторию **ansible**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Неизменный файл шаблона гарантирует тот же результат после изменения переменной?


      ```bash

      cd ~/lab/examples/templates

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Новое listen_port меняет порт в результате на 9090.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Jinja template renderuje konfigurację na podstawie danych, zanim moduł template porówna wynik z miejscem docelowym. Zmiana zmiennej może zmienić renderowany plik; ponowne renderowanie tych samych wartości powinno być zbieżne.


      ### Kontekst hosta i renderowanie trasy {#rendering-station-routes}


      Dla zadania 022: Szablon jest obliczany na kontrolerze w kontekście bieżącego hosta. Rekord różni się od nazwy hosta i mapy indeksowanej hostem. Odróżnij błąd kontekstu od poprawnego tekstu ze stałą trasą. Zastosuj bieżące wejścia, a następnie użyj check mode z innymi danymi. Tożsamość każdej stacji musi pozostać poprawna, różnice tras mają wynikać z danych, a check mode nie może zmieniać zapisanych banerów. Jeśli sonda kończy się bez wyniku warunku, sprawdź uruchamianie Pythona i ładowanie modułu sondy na stacji roboczej.


      ### Wartości szablonu i uprawnienia {#board-template-values}


      W zadaniu 018 `rollout.yml` ładuje `station.yml` z wartościami `route: north` i `slots: 3`, a następnie renderuje `board.j2` dla każdego hosta w `fleet`. Użyj `{{ inventory_hostname }}` dla bieżącego hosta oraz `{{ route }}` i `{{ slots }}` dla podanych wartości. Po uruchomieniu playbooka `/srv/site/board` na kolejnych hostach powinien zawierać odpowiednio `station=app1 route=north slots=3`, `station=app2 route=north slots=3` lub `station=app3 route=north slots=3`, w trybie `0644`. Sprawdź zawartość i tryb na wszystkich trzech hostach.


      ## Wypróbuj


      Otwórz laboratorium **ansible** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy niezmieniony plik template oznacza niezmieniony wynik po zastąpieniu zmiennej?


      ```bash

      cd ~/lab/examples/templates

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Zastąpienie listen_port zmienia renderowany port na 9090.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Un Jinja template representa la configuración a partir de los datos antes de que el módulo template compare el resultado con el destino. Cambiar una variable puede cambiar el archivo renderizado; renderizar los mismos valores nuevamente debería converger.


      ### Contexto del host y renderizado de rutas {#rendering-station-routes}


      Para el quest 022: Una plantilla se evalúa en el controlador con el contexto del host actual. Un registro no equivale a un nombre de host ni a un mapa indexado por host. Distingue errores de contexto de texto válido con una ruta constante. Aplica las entradas actuales y luego usa check mode con otras entradas. Cada identidad debe seguir siendo correcta, las diferencias de ruta deben seguir los datos y check mode no debe cambiar los banners almacenados. Si la prueba se detiene antes de informar de una condición, comprueba que Python arranque y cargue el módulo de prueba en la estación.


      ### Valores y permisos de la plantilla {#board-template-values}


      En el ejercicio 018, `rollout.yml` carga `station.yml`, que proporciona `route: north` y `slots: 3`, y renderiza `board.j2` para cada host de `fleet`. Usa `{{ inventory_hostname }}` para el host actual y `{{ route }}` y `{{ slots }}` para los valores suministrados. Tras ejecutar el playbook, `/srv/site/board` en cada host debe contener respectivamente `station=app1 route=north slots=3`, `station=app2 route=north slots=3` o `station=app3 route=north slots=3`, con modo `0644`. Comprueba el contenido y el modo en los tres hosts.


      ## Pruébalo


      Abra el **ansible Lab** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿Un archivo template sin cambios significa un resultado sin cambios después de una anulación de variable?


      ```bash

      cd ~/lab/examples/templates

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. Anular listen_port cambia el puerto renderizado a 9090.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh` y luego con `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'A Jinja template rendert die Konfiguration aus Daten, bevor das template-Modul das Ergebnis mit dem Ziel vergleicht. Durch das Ändern einer Variablen kann sich die gerenderte Datei ändern. Das erneute Rendern derselben Werte sollte konvergieren.


      ### Hostkontext und Rendern der Route {#rendering-station-routes}


      Für Quest 022: Eine Vorlage wird auf dem Controller im Kontext des aktuellen Hosts ausgewertet. Ein Datensatz unterscheidet sich von einem Hostnamen oder einer nach Hosts indizierten Zuordnung. Trenne Kontextfehler von gültigem Text mit einer konstanten Route. Wende die aktuellen Eingaben an und verwende dann Check-Mode mit anderen Eingaben. Jede Stationsidentität muss stimmen, Routendifferenzen müssen den Daten folgen, und Check-Mode darf gespeicherte Banner nicht ändern. Falls die Prüfung vor einem Ergebnis abbricht, prüfen Sie Python und das Laden des Prüfmoduls am Arbeitsplatz.


      ### Vorlagenwerte und Dateirechte {#board-template-values}


      In Aufgabe 018 lädt `rollout.yml` die Datei `station.yml` mit `route: north` und `slots: 3` und rendert `board.j2` für jeden Host in `fleet`. Verwende `{{ inventory_hostname }}` für den aktuellen Host und `{{ route }}` sowie `{{ slots }}` für die gelieferten Werte. Nach dem Playbook-Lauf muss `/srv/site/board` auf den jeweiligen Hosts `station=app1 route=north slots=3`, `station=app2 route=north slots=3` oder `station=app3 route=north slots=3` enthalten und Modus `0644` haben. Prüfe Inhalt und Modus auf allen drei Hosts.


      ## Probieren Sie es aus


      Öffnen Sie das **ansible Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Bedeutet eine unveränderte template-Datei ein unverändertes Ergebnis nach einer Variablenüberschreibung?


      ```bash

      cd ~/lab/examples/templates

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Durch das Überschreiben von listen_port wird der gerenderte Port auf 9090 geändert.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann mit `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-templates
ansible-9:
  profile: ansible
  example: failures
  source_hash: a3f2aff942dc9e677d1740a037e95decf56a16c9cae67a55a277b36961daa9a1
  content:
    en: 'A failed task interrupts the normal path. A rescue block can recover from a task failure, while always runs cleanup or observation. Unreachable hosts and syntax errors need separate handling.


      In quest 035, `offline` is intentionally unreachable; an unreachable connection is not the same as an ordinary failed module task. Limit `ignore_unreachable: true` to the safe diagnostic and preserve the `UNREACHABLE` evidence in `probe.log`. Verify the healthy app1–app3 recap has zero unreachable and failed results and the localhost `safety-check.txt` records the check. The file must contain exactly `healthy fleet checked`.


      ### Workstation safety record {#healthy-safety-record}


      In quest 035, the safe diagnostic must continue to the localhost copy task and write healthy fleet checked into safety-check.txt. An aborted play, skipped task or different destination can leave the file missing or stale. Run the supplied play with both inventories, capture probe.log, then read the workstation file.


      ### Retain the unreachable event {#retained-unreachable-evidence}


      In quest 035, offline.ini intentionally targets 127.0.0.1:1. Include it with the healthy fleet inventory, retain the real UNREACHABLE result and limit ignore_unreachable to the safe probe. The observer accepts the normal UNREACHABLE! record and supported structured unreachable events, not just an arbitrary word. Missing evidence, unreadable logs, malformed records or Python failure share its fallback marker.


      ### Healthy hosts in the recap {#healthy-host-recaps}


      In quest 035, read each app1, app2 and app3 recap from probe.log: failed and unreachable must both be zero. A missing row or nonzero counter fails that host; a missing, unreadable or unrecognized log can fail all three. Do not erase the offline event to clean the recap. If Python or the helper fails before host markers, inspect startup and log parsing separately.


      ### Verify the recovery source checksum {#recovery-original-backup-checksum}


      previous.txt does not validate against previous.sha256 or either input is unavailable; edited backup bytes, a changed/malformed receipt or a missing file can prevent trusting the supplied recovery source.  `sha256sum -c previous.sha256`.


      ### Preserve the original backup and receipt {#recovery-protected-backup-inputs}


      The working previous.txt or previous.sha256 differs from its frozen setup bytes or could not be read; rewriting the receipt to accept a changed backup does not preserve the original recovery input.  `cat previous.txt previous.sha256`.


      ### Accepted, rejected and untrusted caller cases {#recovery-caller-transaction-outcomes}


      An observed accepted, rejected or untrusted-backup case did not meet its contract; validation after mutation, the wrong rescue result, ignored caller paths/reload command or changed protected caller files can explain it. The local unprivileged caller supplies all paths and service_reload. For an approved candidate, publish it, refresh its cache and record checked without rescue. For a rejected candidate, restore the verified backup, refresh and record checked with a successful rescued recap. For a corrupt backup, fail before changing any tracked live, cache, backup, candidate or unrelated control file; snapshots include inode, modification time, mode and bytes. Preserve backup/candidate/control snapshots in successful cases too. `cat caller-contract.json rollout.yml`.


      ### Observe the child caller replay {#recovery-caller-replay-observation}


      The child caller replay failed without a recognized outcome marker; unreadable/missing caller outputs, malformed Ansible recap, local execution errors or an inner Ansible timeout can prevent evaluating its result.  `cat caller-contract.json; command -v ansible-playbook`.


      ### Outer caller deadline {#recovery-outer-replay-deadline}


      The outer caller replay exceeded its 14-second deadline; blocking tasks or slow dependencies can prevent completing all accepted, rejected and untrusted-backup observations.  `cat rollout.yml`.


      ### Start the content and caller probe {#recovery-probe-startup}


      The combined content/caller probe stopped before a detailed marker; an interrupted bounded SSH group, unavailable outer Python/replay executable or workstation inputs may prevent reaching the observed caller cases.  `command -v python3; command -v ssh`.


      ### Restored message on every host {#recovery-fleet-restored-content}


      app1 does not provide stable-63 in /srv/site/message or SSH failed; the supplied interrupted delivery, an unimplemented rescue path or publication to the wrong destination can leave the wrong file.  `ansible fleet -m ansible.builtin.command -a "cat /srv/site/message"`. Compare app1, app2 and app3.


      ### Permissions after candidate or rescue copy {#recovery-fleet-file-permissions}


      app1 does not report mode 644 on /srv/site/message; a candidate or rescue copy may set different permissions, or SSH/stat could not read the file mode.  `ansible fleet -m ansible.builtin.shell -a "stat -c %a /srv/site/message"`. Compare app1, app2 and app3.


      ### Completion record on each host {#recovery-fleet-completion-record}


      app1 does not provide checked in /srv/site/recovery-checked; a missing completion task, the wrong recovery_marker path or an interrupted play can omit the record, and SSH may also fail to read it.  `ansible fleet -m ansible.builtin.command -a "cat /srv/site/recovery-checked"`. Compare app1, app2 and app3.


      ### Refresh the recovered consumer {#recovery-fleet-consumer-refresh}


      app1 does not serve stable-63 on HTTP 8080 or the request failed; restoring disk bytes without notifying the consumer reload, or refreshing before rescue finishes, can leave a stale cached response.  `curl -fsS --max-time 3 "http://app1-${DQ_NAMESPACE#dq-}:8080"`. Compare app1, app2 and app3.


      ## Try it


      Open the **ansible Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Does a rescued failure necessarily make the whole playbook return failure?


      ```bash

      cd ~/lab/examples/failures

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The rescued play succeeds with rescued=1; the unhandled example returns failure.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.


      Recovery has a trust boundary before its first mutation. Validate the backup against a trusted receipt before either delivery or fallback can alter live data. Exercise accepted and rejected candidates as separate paths, then test an invalid receipt: refusal must preserve live data and its consumer cache. Source inputs and unrelated caller data remain outside the recovery write set.


      Quest 086 couples rollback at a publication source with adoption by existing downstream applications. Validate an attempted publication against actual source health. A recovered source can coexist with stale consumer caches, so compare each active publication receipt and origin with `application-contract.json`. Preserve the supplied process identities: refresh authority depends on the process principal and the operator’s capabilities.'
    ru: 'Сбой задачи прерывает обычный путь. Rescue может обработать ошибку задачи, always выполняет завершающие действия или наблюдение. Недоступный хост и ошибка синтаксиса требуют отдельного разбора.


      В квесте 035 `offline` намеренно недоступен; недоступное соединение отличается от обычного отказа задачи модуля. Ограничьте `ignore_unreachable: true` безопасной диагностикой и сохраните подтверждение `UNREACHABLE` в `probe.log`. Проверьте, что в recap исправных app1–app3 нет unreachable и failed, а `safety-check.txt` на localhost фиксирует проверку. Файл должен содержать ровно `healthy fleet checked`.


      ### Запись проверки на рабочей станции {#healthy-safety-record}


      В квесте 035 безопасная диагностика должна дойти до задачи copy на localhost и записать healthy fleet checked в safety-check.txt. Прерванный play, пропущенная задача или другой путь могут оставить файл отсутствующим или устаревшим. Запустите play с обеими inventory, сохраните probe.log, затем прочитайте файл на рабочей станции.


      ### Сохранение события unreachable {#retained-unreachable-evidence}


      В квесте 035 offline.ini намеренно указывает на 127.0.0.1:1. Подключите его вместе с inventory исправного fleet, сохраните реальный результат UNREACHABLE и ограничьте ignore_unreachable безопасной проверкой. Наблюдатель принимает обычную запись UNREACHABLE! и поддерживаемые структурированные события, а не произвольное слово. Отсутствие события, нечитаемый журнал, неверные записи или ошибка Python используют общий fallback.


      ### Исправные хосты в recap {#healthy-host-recaps}


      В квесте 035 прочитайте recap app1, app2 и app3 из probe.log: failed и unreachable должны быть нулевыми. Отсутствующая строка или ненулевой счётчик дают отказ для хоста; отсутствующий, нечитаемый или нераспознанный журнал может дать отказ для всех трёх. Не стирайте событие offline ради чистого recap. Если Python или модуль прерывается до маркеров хостов, отдельно проверьте запуск и разбор журнала.


      ### Проверка контрольной суммы источника восстановления {#recovery-original-backup-checksum}


      previous.txt не проходит проверку previous.sha256 либо входные файлы недоступны: изменённый backup, исправленная или некорректная квитанция либо отсутствующий файл мешают доверять источнику восстановления.  `sha256sum -c previous.sha256`.


      ### Сохранение исходного backup и квитанции {#recovery-protected-backup-inputs}


      Рабочие previous.txt или previous.sha256 отличаются от сохранённых байтов setup либо не прочитаны: переписывание квитанции под изменённый backup не сохраняет исходный вход восстановления.  `cat previous.txt previous.sha256`.


      ### Принятые, отклонённые и недоверенные входы {#recovery-caller-transaction-outcomes}


      Наблюдаемый принятый, отклонённый или недоверенный backup-вариант не выполнил контракт: причиной могут быть проверка после изменения, неверный результат rescue, игнорирование путей или команды обновления и изменение защищаемых файлов вызывающего кода. Локальный непривилегированный вызывающий код задаёт все пути и service_reload. Принятый кандидат публикуется с обновлением кэша и checked без rescue. Отклонённый восстанавливается из проверенного backup с обновлением, checked и успешным recap с rescued. Недоверенный backup должен вызвать отказ до изменений отслеживаемых live, cache, backup, candidate и control: снимки содержат inode, время изменения, режим и байты. В успешных вариантах также сохраняйте снимки backup, candidate и control. `cat caller-contract.json rollout.yml`.


      ### Наблюдение дочернего выполнения {#recovery-caller-replay-observation}


      Дочерний повторный запуск завершился без распознанного маркера результата: отсутствующие или нечитаемые выходы, некорректный recap Ansible, ошибки локального выполнения или внутренний таймаут Ansible мешают оценке.  `cat caller-contract.json; command -v ansible-playbook`.


      ### Срок внешнего выполнения {#recovery-outer-replay-deadline}


      Внешний повторный запуск превысил 14 секунд: блокирующие задачи или медленные зависимости мешают завершить наблюдение всех принятых, отклонённых и недоверенных backup-вариантов.  `cat rollout.yml`.


      ### Запуск проверки содержимого и вызывающего кода {#recovery-probe-startup}


      Общая проверка содержимого и вызывающего кода остановилась до подробного маркера: прерванная SSH-группа, недоступный внешний Python или исполняемый файл повторного запуска либо рабочие данные мешают наблюдению вариантов.  `command -v python3; command -v ssh`.


      ### Восстановленное сообщение на всех хостах {#recovery-fleet-restored-content}


      app1 не предоставляет stable-63 в /srv/site/message либо SSH завершился ошибкой: выданная прерванная доставка, отсутствующий rescue или запись по другому пути оставляют неверный файл.  `ansible fleet -m ansible.builtin.command -a "cat /srv/site/message"`. Сравните app1, app2 и app3.


      ### Права после копирования кандидата или rescue {#recovery-fleet-file-permissions}


      app1 не сообщает права 644 для /srv/site/message: копирование кандидата или rescue могло задать другие права либо SSH и stat не прочитали режим.  `ansible fleet -m ansible.builtin.shell -a "stat -c %a /srv/site/message"`. Сравните app1, app2 и app3.


      ### Запись о завершении на каждом хосте {#recovery-fleet-completion-record}


      app1 не предоставляет checked в /srv/site/recovery-checked: отсутствующая завершающая задача, другой recovery_marker или прерванный play оставляют запись недоставленной; SSH также может не прочитать её.  `ansible fleet -m ansible.builtin.command -a "cat /srv/site/recovery-checked"`. Сравните app1, app2 и app3.


      ### Обновление восстановленного потребителя {#recovery-fleet-consumer-refresh}


      app1 не отдаёт stable-63 по HTTP 8080 либо запрос завершился ошибкой: восстановление файла без обновления потребителя или refresh до завершения rescue оставляют старый кэш.  `curl -fsS --max-time 3 "http://app1-${DQ_NAMESPACE#dq-}:8080"`. Сравните app1, app2 и app3.


      ## Попробуйте


      Откройте лабораторию **ansible**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Обработанная rescue ошибка обязательно завершает весь playbook с ошибкой?


      ```bash

      cd ~/lab/examples/failures

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Обработанный пример успешен с rescued=1, необработанный возвращает ошибку.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.


      Граница доверия восстановления находится до первого изменения. Проверяйте резервную копию по доверенной квитанции до доставки и отката рабочих данных. Испытайте принятый и отклонённый кандидаты отдельно, затем неверную квитанцию: отказ должен сохранять рабочие данные и кеш потребителя. Исходные входы и посторонние данные вызывающей стороны остаются вне области записи восстановления.


      Квест 086 связывает откат источника публикации с принятием данных существующими зависимыми приложениями. Проверяйте попытку публикации по фактической готовности источника. Восстановленный источник может соседствовать с устаревшими кешами потребителей, поэтому сопоставляйте квитанцию и источник каждой работающей публикации с `application-contract.json`. Сохраняйте исходные идентичности процессов: полномочия обновления зависят от учётной записи процесса и capabilities оператора.'
    pl: 'Nieudane zadanie przerywa normalną ścieżkę. Blok rescue może odzyskać siły po awarii zadania, podczas gdy always uruchamia czyszczenie lub obserwację. Nieosiągalne hosty i błędy składniowe wymagają osobnej obsługi.


      W zadaniu 035 `offline` jest celowo nieosiągalny; nieosiągalne połączenie różni się od zwykłego błędu zadania modułu. Ogranicz `ignore_unreachable: true` do bezpiecznej diagnostyki i zachowaj dowód `UNREACHABLE` w `probe.log`. Sprawdź, że recap sprawnych app1–app3 ma zero unreachable i failed, a `safety-check.txt` na localhost zapisuje kontrolę. Plik musi zawierać dokładnie `healthy fleet checked`.


      ### Zapis kontroli na stacji roboczej {#healthy-safety-record}


      W zadaniu 035 bezpieczna diagnostyka musi dotrzeć do zadania copy na localhost i zapisać healthy fleet checked w safety-check.txt. Przerwany play, pominięte zadanie lub inny cel mogą pozostawić brakujący lub stary plik. Uruchom play z oboma inventory, zapisz probe.log i odczytaj plik na stacji roboczej.


      ### Zachowanie zdarzenia unreachable {#retained-unreachable-evidence}


      W zadaniu 035 offline.ini celowo wskazuje 127.0.0.1:1. Dołącz je wraz z inventory sprawnego fleet, zachowaj rzeczywisty wynik UNREACHABLE i ogranicz ignore_unreachable do bezpiecznej sondy. Obserwator przyjmuje zwykły rekord UNREACHABLE! i obsługiwane zdarzenia strukturalne, nie dowolne słowo. Brak dowodu, nieczytelny log, błędne rekordy lub błąd Pythona używają wspólnego fallbacku.


      ### Sprawne hosty w recap {#healthy-host-recaps}


      W zadaniu 035 odczytaj recap app1, app2 i app3 z probe.log: failed i unreachable muszą wynosić zero. Brak wiersza lub niezerowy licznik powoduje błąd hosta; brakujący, nieczytelny lub nierozpoznany log może zawieść dla wszystkich trzech. Nie usuwaj zdarzenia offline dla czystego recap. Jeśli Python lub moduł zawodzi przed markerami hostów, sprawdź osobno start i parsowanie logu.


      ### Kontrola sumy źródła odtwarzania {#recovery-original-backup-checksum}


      previous.txt nie przechodzi previous.sha256 lub dane są niedostępne; zmienione bajty kopii, zmieniony/błędny zapis sumy lub brak pliku blokuje zaufanie do źródła odtwarzania.  `sha256sum -c previous.sha256`.


      ### Zachowanie pierwotnej kopii i zapisu sumy {#recovery-protected-backup-inputs}


      Roboczy previous.txt lub previous.sha256 różni się od chronionych bajtów setup albo jest nieczytelny; przepisanie sumy pod zmienioną kopię nie zachowuje pierwotnego wejścia odtwarzania.  `cat previous.txt previous.sha256`.


      ### Akceptowane, odrzucone i niezaufane przypadki {#recovery-caller-transaction-outcomes}


      Zaobserwowany przypadek akceptacji, odrzucenia lub niezaufanej kopii nie spełnił kontraktu; walidacja po zmianie, zły wynik rescue, zignorowane ścieżki/polecenie odświeżenia lub zmienione chronione pliki mogą to wyjaśniać. Lokalne nieuprzywilejowane wywołanie podaje wszystkie ścieżki i service_reload. Zatwierdzony kandydat trafia do publikacji z odświeżeniem cache i checked bez rescue. Odrzucony wymaga przywrócenia zweryfikowanej kopii, odświeżenia, checked i udanego recap z rescued. Uszkodzona kopia ma zawieść przed zmianą śledzonych live, cache, backup, candidate i control; migawki obejmują inode, czas modyfikacji, tryb i bajty. Udane przypadki też zachowują migawki backup/candidate/control. `cat caller-contract.json rollout.yml`.


      ### Obserwacja podrzędnego wykonania {#recovery-caller-replay-observation}


      Proces odtworzenia wywołania zawiódł bez rozpoznanego markera wyniku; brakujące/nieczytelne wyniki, błędny recap Ansible, błędy lokalnego wykonania lub wewnętrzny timeout Ansible blokują ocenę.  `cat caller-contract.json; command -v ansible-playbook`.


      ### Limit zewnętrznego wykonania {#recovery-outer-replay-deadline}


      Zewnętrzne wykonanie przekroczyło limit 14 sekund; blokujące zadania lub wolne zależności mogą uniemożliwiać wszystkie obserwacje akceptacji, odrzucenia i niezaufanej kopii.  `cat rollout.yml`.


      ### Start kontroli treści i wywołania {#recovery-probe-startup}


      Łączna kontrola treści i wywołania zatrzymała się przed markerem; przerwana grupa SSH, niedostępny zewnętrzny Python/program odtworzenia lub dane robocze blokują obserwację przypadków.  `command -v python3; command -v ssh`.


      ### Odtworzony komunikat na każdym hoście {#recovery-fleet-restored-content}


      app1 nie udostępnia stable-63 w /srv/site/message lub SSH zawiódł; dostarczone przerwane wdrożenie, brak rescue lub publikacja pod złą ścieżką pozostawia zły plik.  `ansible fleet -m ansible.builtin.command -a "cat /srv/site/message"`. Porównaj app1, app2 i app3.


      ### Prawa po kopii kandydata lub rescue {#recovery-fleet-file-permissions}


      app1 nie zgłasza trybu 644 dla /srv/site/message; kopia kandydata lub rescue mogła ustawić inne prawa albo SSH/stat nie odczytały trybu.  `ansible fleet -m ansible.builtin.shell -a "stat -c %a /srv/site/message"`. Porównaj app1, app2 i app3.


      ### Zapis ukończenia na każdym hoście {#recovery-fleet-completion-record}


      app1 nie udostępnia checked w /srv/site/recovery-checked; brak zadania końcowego, zła ścieżka recovery_marker lub przerwany play pomija zapis, a SSH też może go nie odczytać.  `ansible fleet -m ansible.builtin.command -a "cat /srv/site/recovery-checked"`. Porównaj app1, app2 i app3.


      ### Odświeżenie odtworzonego odbiorcy {#recovery-fleet-consumer-refresh}


      app1 nie serwuje stable-63 przez HTTP 8080 lub żądanie zawiodło; odtworzenie pliku bez powiadomienia odbiorcy lub odświeżenie przed końcem rescue pozostawia starą pamięć podręczną.  `curl -fsS --max-time 3 "http://app1-${DQ_NAMESPACE#dq-}:8080"`. Porównaj app1, app2 i app3.


      ## Wypróbuj


      Otwórz laboratorium **ansible** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy uratowana awaria koniecznie powoduje powrót całego playbook?


      ```bash

      cd ~/lab/examples/failures

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Uratowana gra powiodła się dzięki rescued=1; nieobsługiwany przykład zwraca błąd.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.


      Granica zaufania odzyskiwania poprzedza pierwszą zmianę. Zweryfikuj kopię z zaufanym potwierdzeniem, zanim dostarczanie lub odtwarzanie zmieni dane robocze. Osobno sprawdź przyjętych i odrzuconych kandydatów oraz błędne potwierdzenie: odmowa ma zachować dane robocze i pamięć konsumenta. Wejścia i pozostałe dane wywołującego pozostają poza zakresem zapisu.


      Zadanie 086 łączy wycofanie źródła publikacji z przyjęciem danych przez istniejące aplikacje zależne. Sprawdzaj próbę publikacji przez rzeczywistą gotowość źródła. Odzyskane źródło może współistnieć ze starymi pamięciami konsumentów, więc porównuj aktywne potwierdzenia i źródła z `application-contract.json`. Zachowaj oryginalne tożsamości procesów: uprawnienia do odświeżania zależą od konta procesu i capabilities operatora.'
    es: 'Una tarea fallida interrumpe el camino normal. Un bloque rescue puede recuperarse de una falla en la tarea, mientras siempre ejecuta la limpieza u observación. Los hosts inalcanzables y los errores de sintaxis deben tratarse por separado.


      En el ejercicio 035, `offline` es intencionalmente inaccesible; una conexión inaccesible no equivale a un fallo normal de una tarea de módulo. Limita `ignore_unreachable: true` al diagnóstico seguro y conserva la evidencia `UNREACHABLE` en `probe.log`. Comprueba que el recap de los hosts sanos app1–app3 tiene cero unreachable y failed, y que `safety-check.txt` en localhost registra la comprobación. El archivo debe contener exactamente `healthy fleet checked`.


      ### Registro de control en la estación {#healthy-safety-record}


      En el reto 035, el diagnóstico seguro debe continuar hasta copy en localhost y escribir healthy fleet checked en safety-check.txt. Un play abortado, una tarea omitida u otro destino puede dejar el archivo ausente o antiguo. Ejecuta el play con ambos inventarios, captura probe.log y lee el archivo de la estación.


      ### Conservar el evento unreachable {#retained-unreachable-evidence}


      En el reto 035, offline.ini apunta intencionadamente a 127.0.0.1:1. Inclúyelo con el inventario fleet sano, conserva el resultado UNREACHABLE real y limita ignore_unreachable a la sonda segura. El observador acepta el registro normal UNREACHABLE! y eventos estructurados compatibles, no una palabra arbitraria. Evidencia ausente, logs ilegibles, registros inválidos o un fallo de Python comparten el fallback.


      ### Hosts sanos en el recap {#healthy-host-recaps}


      En el reto 035, lee los recaps app1, app2 y app3 de probe.log: failed y unreachable deben ser cero. Una fila ausente o contador no nulo falla ese host; un log ausente, ilegible o no reconocido puede fallar los tres. No borres el evento offline para limpiar el recap. Si Python o el módulo falla antes de los marcadores de hosts, revisa el arranque y el análisis por separado.


      ### Verificar checksum del origen de recuperación {#recovery-original-backup-checksum}


      previous.txt no valida con previous.sha256 o una entrada no está disponible; backup editado, recibo cambiado/malformado o archivo ausente impide confiar en el origen de recuperación.  `sha256sum -c previous.sha256`.


      ### Conservar backup y recibo originales {#recovery-protected-backup-inputs}


      previous.txt o previous.sha256 de trabajo difiere de los bytes protegidos de setup o no pudo leerse; reescribir el recibo para un backup cambiado no conserva la entrada original.  `cat previous.txt previous.sha256`.


      ### Casos aceptados, rechazados y no confiables {#recovery-caller-transaction-outcomes}


      Un caso observado aceptado, rechazado o de backup no confiable incumplió el contrato; validar tras mutar, resultado rescue erróneo, rutas/comando de recarga ignorados o archivos protegidos cambiados pueden explicarlo. La llamada local sin privilegios aporta todas las rutas y service_reload. Un candidato aprobado se publica, refresca caché y registra checked sin rescue. Uno rechazado restaura backup verificado, refresca y registra checked con recap rescued exitoso. Un backup corrupto falla antes de cambiar archivos rastreados live, cache, backup, candidate o control; instantáneas incluyen inode, hora, modo y bytes. Conserve backup/candidate/control también en casos correctos. `cat caller-contract.json rollout.yml`.


      ### Observar ejecución de llamada hija {#recovery-caller-replay-observation}


      El proceso de prueba de llamada falló sin marcador reconocido; salidas ausentes/ilegibles, recap Ansible inválido, errores locales o timeout Ansible interno impiden evaluar el resultado.  `cat caller-contract.json; command -v ansible-playbook`.


      ### Plazo de ejecución externa {#recovery-outer-replay-deadline}


      La prueba externa superó su plazo de 14 segundos; tareas bloqueantes o dependencias lentas impiden completar observaciones de aceptación, rechazo y backup no confiable.  `cat rollout.yml`.


      ### Iniciar prueba de contenido y llamada {#recovery-probe-startup}


      La prueba conjunta de contenido/llamada terminó antes de un marcador; grupo SSH interrumpido, Python externo/ejecutable no disponible o entradas de trabajo impiden observar los casos.  `command -v python3; command -v ssh`.


      ### Mensaje restaurado en cada host {#recovery-fleet-restored-content}


      app1 no proporciona stable-63 en /srv/site/message o falló SSH; entrega interrumpida, rescue sin implementar o publicación a otra ruta deja un archivo incorrecto.  `ansible fleet -m ansible.builtin.command -a "cat /srv/site/message"`. Compare app1, app2 y app3.


      ### Permisos tras copia de candidato o rescue {#recovery-fleet-file-permissions}


      app1 no informa modo 644 en /srv/site/message; copiar candidato o rescue puede fijar otros permisos, o SSH/stat no pudo observarlos.  `ansible fleet -m ansible.builtin.shell -a "stat -c %a /srv/site/message"`. Compare app1, app2 y app3.


      ### Registro de finalización por host {#recovery-fleet-completion-record}


      app1 no proporciona checked en /srv/site/recovery-checked; tarea final ausente, ruta recovery_marker incorrecta o play interrumpido omite el registro, y SSH también puede no leerlo.  `ansible fleet -m ansible.builtin.command -a "cat /srv/site/recovery-checked"`. Compare app1, app2 y app3.


      ### Refrescar consumidor recuperado {#recovery-fleet-consumer-refresh}


      app1 no sirve stable-63 por HTTP 8080 o falló la petición; restaurar bytes sin recargar consumidor, o refrescar antes de acabar rescue, deja respuesta antigua en caché.  `curl -fsS --max-time 3 "http://app1-${DQ_NAMESPACE#dq-}:8080"`. Compare app1, app2 y app3.


      ## Pruébalo


      Abra el **ansible Lab** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿Una falla rescatada necesariamente hace que todo el playbook regrese como falla?


      ```bash

      cd ~/lab/examples/failures

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. La jugada rescatada triunfa con rescued=1; el ejemplo no controlado devuelve un error.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh` y luego con `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.


      La recuperación tiene un límite de confianza previo a la primera modificación. Valida la copia con un recibo fiable antes de que entrega o recuperación cambien datos activos. Prueba candidatos aceptados y rechazados por separado y después un recibo inválido: el rechazo debe conservar datos activos y caché. Las entradas y los datos ajenos quedan fuera del conjunto de escritura.


      El ejercicio 086 relaciona la recuperación de la fuente con la adopción por aplicaciones dependientes existentes. Valida una publicación intentada contra la disponibilidad real de la fuente. Una fuente recuperada puede coexistir con cachés obsoletas: compara cada recibo activo y origen con `application-contract.json`. Conserva las identidades proporcionadas; la autoridad para actualizar depende del usuario del proceso y las capacidades del operador.'
    de: 'Eine fehlgeschlagene Aufgabe unterbricht den normalen Pfad. Ein rescue-Block kann sich nach einem Task-Fehler erholen, während er immer eine Bereinigung oder Beobachtung ausführt. Nicht erreichbare Hosts und Syntaxfehler müssen separat behandelt werden.


      In Aufgabe 035 ist `offline` absichtlich nicht erreichbar; eine nicht erreichbare Verbindung ist kein gewöhnlicher Fehler einer Modulaufgabe. Beschränke `ignore_unreachable: true` auf die sichere Diagnose und erhalte den Nachweis `UNREACHABLE` in `probe.log`. Prüfe, dass der Recap der gesunden Hosts app1–app3 null unreachable und failed meldet und `safety-check.txt` auf localhost die Prüfung festhält. Die Datei muss genau `healthy fleet checked` enthalten.


      ### Prüfprotokoll auf der Workstation {#healthy-safety-record}


      In Quest 035 muss die sichere Diagnose bis zur localhost-copy-Aufgabe fortfahren und healthy fleet checked in safety-check.txt schreiben. Ein abgebrochenes Play, eine übersprungene Aufgabe oder ein anderes Ziel kann die Datei fehlen oder veralten lassen. Führe das Play mit beiden Inventories aus, erfasse probe.log und lies die Workstation-Datei.


      ### Unerreichbarkeitsereignis erhalten {#retained-unreachable-evidence}


      In Quest 035 zeigt offline.ini absichtlich auf 127.0.0.1:1. Binde es zusammen mit dem gesunden fleet-Inventory ein, erhalte das echte UNREACHABLE-Ergebnis und begrenze ignore_unreachable auf die sichere Probe. Der Beobachter akzeptiert den normalen UNREACHABLE!-Datensatz und unterstützte strukturierte Ereignisse, nicht ein beliebiges Wort. Fehlender Nachweis, unlesbare Logs, fehlerhafte Datensätze oder Python-Fehler teilen den Fallback.


      ### Gesunde Hosts im Recap {#healthy-host-recaps}


      Lies in Quest 035 die Recaps von app1, app2 und app3 aus probe.log: failed und unreachable müssen null sein. Eine fehlende Zeile oder ein nichtnulliger Zähler scheitert für den Host; fehlendes, unlesbares oder unerkanntes Log kann alle drei scheitern lassen. Lösche das offline-Ereignis nicht für einen sauberen Recap. Scheitert Python oder das Modul vor Host-Markern, prüfe Start und Log-Parsing getrennt.


      ### Prüfsumme der Wiederherstellungsquelle prüfen {#recovery-original-backup-checksum}


      previous.txt besteht die Prüfung mit previous.sha256 nicht oder eine Eingabe ist unerreichbar; geänderte Backup-Bytes, ein veränderter/fehlerhafter Prüfsummenbeleg oder eine fehlende Datei verhindert Vertrauen in die Wiederherstellungsquelle.  `sha256sum -c previous.sha256`.


      ### Ursprüngliches Backup und Beleg erhalten {#recovery-protected-backup-inputs}


      Die Arbeitskopie von previous.txt oder previous.sha256 weicht von den geschützten Setup-Bytes ab oder ist nicht lesbar; ein umgeschriebener Beleg für ein geändertes Backup erhält die ursprüngliche Wiederherstellungseingabe nicht.  `cat previous.txt previous.sha256`.


      ### Angenommene, abgelehnte und nicht vertrauenswürdige Fälle {#recovery-caller-transaction-outcomes}


      Ein beobachteter angenommener, abgelehnter oder nicht vertrauenswürdiger Backup-Fall erfüllte seinen Vertrag nicht; Prüfung nach Änderung, falsches rescue Ergebnis, ignorierte Aufrufpfade/Neuladebefehle oder geänderte geschützte Aufrufdateien können die Ursache sein. Der lokale unprivilegierte Aufrufer liefert alle Pfade und service_reload. Einen freigegebenen Kandidaten veröffentlichen, Cache aktualisieren und checked ohne rescue erfassen. Einen abgelehnten Kandidaten aus geprüftem Backup wiederherstellen, aktualisieren und checked mit erfolgreichem rescued recap erfassen. Bei beschädigtem Backup vor Änderung der erfassten live-, cache-, backup-, candidate- und control-Dateien scheitern; Snapshots enthalten Inode, Änderungszeit, Modus und Bytes. Auch erfolgreiche Fälle erhalten backup/candidate/control. `cat caller-contract.json rollout.yml`.


      ### Untergeordneten Aufrufdurchlauf beobachten {#recovery-caller-replay-observation}


      Der untergeordnete Aufrufdurchlauf scheiterte ohne erkannten Ergebnismarker; fehlende/unlesbare Ausgaben, fehlerhafter Ansible-recap, lokale Ausführungsfehler oder ein innerer Ansible-Timeout verhindern die Auswertung.  `cat caller-contract.json; command -v ansible-playbook`.


      ### Frist des äußeren Durchlaufs {#recovery-outer-replay-deadline}


      Der äußere Aufrufdurchlauf überschritt seine Frist von 14 Sekunden; blockierende Tasks oder langsame Abhängigkeiten verhindern alle Beobachtungen für Annahme, Ablehnung und nicht vertrauenswürdiges Backup.  `cat rollout.yml`.


      ### Inhalts- und Aufrufprüfung starten {#recovery-probe-startup}


      Die gemeinsame Inhalts-/Aufrufprüfung endete vor einem Detailmarker; eine unterbrochene SSH-Gruppe, nicht verfügbares äußeres Python/Ausführungsprogramm oder Arbeitsdaten verhindert die Beobachtung der Aufruffälle.  `command -v python3; command -v ssh`.


      ### Wiederhergestellte Nachricht auf jedem Host {#recovery-fleet-restored-content}


      app1 liefert nicht stable-63 in /srv/site/message oder SSH schlug fehl; die gelieferte unterbrochene Bereitstellung, fehlendes rescue oder Ausgabe am falschen Ziel kann die falsche Datei belassen.  `ansible fleet -m ansible.builtin.command -a "cat /srv/site/message"`. Vergleichen Sie app1, app2 und app3.


      ### Rechte nach Kandidaten- oder rescue Kopie {#recovery-fleet-file-permissions}


      app1 meldet nicht Modus 644 für /srv/site/message; Kandidaten- oder rescue Kopie kann andere Rechte setzen oder SSH/stat konnte den Dateimodus nicht lesen.  `ansible fleet -m ansible.builtin.shell -a "stat -c %a /srv/site/message"`. Vergleichen Sie app1, app2 und app3.


      ### Abschlussbeleg auf jedem Host {#recovery-fleet-completion-record}


      app1 liefert nicht checked in /srv/site/recovery-checked; fehlende Abschlussaufgabe, falscher recovery_marker Pfad oder abgebrochener Play kann den Beleg auslassen und SSH kann ihn ebenfalls nicht lesen.  `ansible fleet -m ansible.builtin.command -a "cat /srv/site/recovery-checked"`. Vergleichen Sie app1, app2 und app3.


      ### Wiederhergestellten Verbraucher aktualisieren {#recovery-fleet-consumer-refresh}


      app1 liefert nicht stable-63 über HTTP 8080 oder die Anfrage schlug fehl; Wiederherstellung der Datei ohne Neuladen des Verbrauchers oder Aktualisierung vor Abschluss von rescue kann eine alte Cache-Antwort belassen.  `curl -fsS --max-time 3 "http://app1-${DQ_NAMESPACE#dq-}:8080"`. Vergleichen Sie app1, app2 und app3.


      ## Probieren Sie es aus


      Öffnen Sie das **ansible Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Führt ein behobener Fehler zwangsläufig dazu, dass der gesamte playbook einen Fehler zurückgibt?


      ```bash

      cd ~/lab/examples/failures

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Das gerettete Spiel gelingt mit rescued=1; Das nicht behandelte Beispiel gibt einen Fehler zurück.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann mit `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.


      Die Vertrauensgrenze der Wiederherstellung liegt vor ihrer ersten Änderung. Prüfe die Sicherung gegen einen vertrauenswürdigen Beleg, bevor Auslieferung oder Rückfall Live-Daten ändern. Teste angenommene und abgelehnte Kandidaten getrennt und danach einen ungültigen Beleg: Die Ablehnung muss Live-Daten und Verbraucher-Cache bewahren. Eingaben und fremde Aufruferdaten bleiben außerhalb des Schreibbereichs.


      Aufgabe 086 verbindet Rollback an einer Publikationsquelle mit der Übernahme durch bestehende abhängige Anwendungen. Prüfe einen Publikationsversuch an der tatsächlichen Quellbereitschaft. Eine wiederhergestellte Quelle kann neben veralteten Verbraucher-Caches bestehen; vergleiche deshalb jeden aktiven Publikationsbeleg und Ursprung mit `application-contract.json`. Bewahre die bereitgestellten Prozessidentitäten: Aktualisierungsbefugnisse hängen von Prozessbenutzer und Operator-Capabilities ab.'
  full_example: full-failures
ansible-10:
  profile: ansible
  example: handlers
  source_hash: c51fecf48be5553503f659be3541ecf1be94f5d5869d82ede3359fb1dc70039d
  content:
    en: 'Changed tasks notify handlers. Two notifications to the same handler are coalesced before it runs. A second converged run has no change to notify. A later task failure may prevent an already notified handler from running.


      A task reporting unchanged file content may leave a running process with older data. Compare each disk record with the HTTP reply and identify which process can remain in place.


      ### Fleet files and live release banners {#fleet-release-delivery}


      In quest 010, the fleet stage is complete only when all three `/srv/site/message` files have the required release and mode and all three HTTP banners serve `release-10`. A handler can reload the cached banner when delivery changes the file; observing the file alone does not verify the process.


      ### Live banner and second delivery recap {#release-repeat-delivery}


      In quest 020, the fleet receives the managed `release.txt` artifact. After delivery and the change-triggered reload, verify the three files and live HTTP banners, then run the playbook again and inspect each host recap for `changed=0` and `failed=0`. These observations cover the current state; they do not prove the history of every prior run. Check second-run.txt for task errors, unreachable hosts, or an incomplete recap. If the recap probe gives no result, check that its Python runtime can start in the workstation.


      ### Reloading the live banner {#reload-live-banner}


      In quest 008, the process keeps the banner it read at startup even after `/srv/site/message` changes. In `rollout.yml`, notify `Reload banner` from the copy task; the supplied handler runs `dq-service reload` after a change. Run the playbook and query each of the three live HTTP banners: all must return `north-ready`. A correct file by itself does not prove that the running process reloaded it.


      ### Delivered content on each host {#handler-shared-content}


      app1 did not return north-ready from /srv/site/message; delivery may not have run on that host, the file may have changed, or SSH/namespace inputs may prevent reading it. `ssh -n -o BatchMode=yes -p 2222 root@app1-"${DQ_NAMESPACE#dq-}" ''cat /srv/site/message''`. Repeat the observation on app2 and app3.


      ### Permissions for the supplied consumer {#handler-file-access}


      app1 did not report mode 644 for /srv/site/message; the supplied task may still enforce 0600, or SSH/stat observation may have failed. The supplied cached consumer runs under its existing non-root principal. Mode 0600 can leave the correct message unreadable to it even while root reads the file. Deliver the required 0644 without changing that application principal or privileges; permissions and cache refresh are separate observations on every host. Repeat the observation on app2 and app3.


      ### Notify the existing root application {#handler-root-cache}


      app1 did not serve north-ready on port 8080; the file may be correct but the reload handler was not notified, or the HTTP request or namespace lookup failed. `ansible-playbook rollout.yml`. Repeat the observation on app2 and app3.


      ### Retain the supplied process and principal {#handler-retained-principal}


      The supplied process no longer matches its frozen identity; restarting it, changing its principal or privileges, or editing its command/program can break the retained PID, start time and identity contract. The setup receipt captures PID, start time, UID/GID/groups, capability sets, command line and program bytes. A successful response from a restarted or modified process does not satisfy that preserved identity. Compare the current application with consumer-contract.json and the provided program before changing it; use its refresh interface while preserving the process.


      ### Refresh the cache as its principal {#handler-unprivileged-cache}


      The supplied consumer still serves stale content; mode 0600 can block its principal, and a permission fix alone does not refresh its cache if the SIGHUP handler was not notified or the signal could not be sent as that principal. The provided program handles SIGHUP by rereading the message under its own UID. Keep that process alive and send the refresh under its supplied principal; do not replace it with a new or privileged server. A notify handler runs when its task reports changed, so manually fixing the file before an unchanged copy task can leave both caches stale. The root application on 8080 and the supplied application on 8081 each need their own refresh.


      ### Budget for fleet observation {#handler-observation-budget}


      The SSH process observation exceeded the remaining budget; an unresponsive managed host or time already spent waiting on earlier consumer responses can leave too little time to inspect all hosts.


      ### Observe existing consumer inputs {#handler-observer-inputs}


      The supplied consumer could not be observed; its process or frozen receipt may be missing, SSH/HTTP may fail, or a namespace or JSON observation may be unavailable or invalid. The combined HTTP/consumer probe stopped without a named diagnostic; the workstation directory, Python startup or an interrupted legacy HTTP group may have prevented detailed observations.


      ### Retain the already healthy process {#fleet-retain-healthy-process}


      The already healthy app3 process no longer matches its original PID and start time, or its identity could not be read; reloading every host unnecessarily, restarting the healthy service or failed SSH/fact observation can explain it.  `cat healthy-service service-interface.json`.


      ### Deliver release bytes and permissions {#fleet-release-file-and-mode}


      app1 does not provide release-60 with mode 644 in /srv/site/message, or SSH failed; the supplied retired copy task, undelivered content or changed permissions can leave the file incorrect.  `ansible fleet -m ansible.builtin.shell -a "cat /srv/site/message; stat -c %a /srv/site/message"`. Compare all three hosts: app1, app2 and app3.


      ### Refresh stale services when files are unchanged {#fleet-refresh-only-stale-services}


      app1 does not serve release-60 over HTTP or the request failed; the process caches content at startup, so a correct unchanged file without a refresh can leave the old response active. app2 starts with correct file bytes but a stale process, while app3 already serves the release and must keep its PID and start time. A copy handler only notifies when a task changes the file; inspect HTTP first and refresh an unchanged file only when its process is stale. Compare the service response on app1, app2 and app3 after delivery. `cat service-interface.json rollout.yml; curl -fsS --max-time 3 "http://app1-${DQ_NAMESPACE#dq-}:8080"`.


      ## Try it


      Open the **ansible Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Will two changed tasks run the same handler twice?


      ```bash

      cd ~/lab/examples/handlers

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The first run executes it once, and the converged second run does not execute it.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.


      A shared configuration can feed several independent process caches. A notification topic can fan out to different handlers, but each operation still needs authority under the target process’s principal. Verify file access, each consumer’s actual response and preservation of required process identity separately; readable bytes alone do not establish adoption.'
    ru: 'Изменившие состояние задачи уведомляют handlers. Два уведомления одного обработчика объединяются до его запуска. При повторном запуске без изменений нет нового уведомления. Последующая ошибка задачи может помешать уже уведомлённому обработчику.


      Задача может показать, что файл не изменился, пока процесс продолжает использовать старые данные. Сопоставьте файл с ответом HTTP и определите, какой процесс можно сохранить.


      ### Файлы и баннеры релиза на fleet {#fleet-release-delivery}


      В квесте 010 этап fleet завершен только тогда, когда все три файла `/srv/site/message` имеют нужный релиз и режим, а три HTTP-баннера отдают `release-10`. Handler может перечитать закэшированный баннер, когда доставка меняет файл; одна проверка файла не подтверждает состояние процесса.


      ### Работающий баннер и сводка повторной доставки {#release-repeat-delivery}


      В квесте 020 fleet получает управляемый артефакт `release.txt`. После доставки и перечитывания по изменению проверьте три файла и работающие HTTP-баннеры, затем повторно запустите playbook и проверьте в recap каждой машины `changed=0` и `failed=0`. Эти наблюдения показывают текущее состояние, но не доказывают историю всех прошлых запусков. В second-run.txt ищите ошибки задач, недоступные хосты и неполную сводку. Если проверка сводки не дала результата, проверьте запуск Python на рабочей станции.


      ### Перечитывание работающего баннера {#reload-live-banner}


      В квесте 008 процесс сохраняет баннер, прочитанный при запуске, даже после изменения `/srv/site/message`. В `rollout.yml` добавьте уведомление `Reload banner` к задаче copy; готовый handler выполняет `dq-service reload` после изменения. Запустите playbook и запросите все три работающих HTTP-баннера: каждый должен вернуть `north-ready`. Сам по себе правильный файл не доказывает, что процесс перечитал его.


      ### Доставленное содержимое на каждом хосте {#handler-shared-content}


      app1 не вернул north-ready из /srv/site/message: доставка могла не выполниться на хосте, файл изменён либо SSH или namespace мешают чтению. `ssh -n -o BatchMode=yes -p 2222 root@app1-"${DQ_NAMESPACE#dq-}" ''cat /srv/site/message''`. Повторите наблюдение на app2 и app3.


      ### Права для выданного потребителя {#handler-file-access}


      app1 не подтвердил режим 644 для /srv/site/message: выданная задача могла сохранить 0600 либо наблюдение SSH/stat завершилось ошибкой. Выданный кэширующий потребитель работает от существующего пользователя без root. При 0600 правильный файл может быть недоступен ему, хотя root читает его. Доставьте 0644 без смены пользователя или привилегий приложения: права и обновление кэша проверяются отдельно на каждом хосте. Повторите наблюдение на app2 и app3.


      ### Уведомление существующего root-приложения {#handler-root-cache}


      app1 не выдал north-ready на порту 8080: файл может быть правильным, но обработчик reload не получил уведомление либо запрос HTTP или разрешение namespace завершились ошибкой. `ansible-playbook rollout.yml`. Повторите наблюдение на app2 и app3.


      ### Сохранение выданного процесса и пользователя {#handler-retained-principal}


      Выданный процесс не совпадает с зафиксированной идентичностью: перезапуск, смена пользователя или привилегий, команды или программы нарушают контракт сохранённых PID, времени старта и идентичности. Свидетельство setup сохраняет PID, время старта, UID/GID/группы, capabilities, команду и байты программы. Успешный ответ перезапущенного или изменённого процесса не сохраняет идентичность. До правок сравните приложение с consumer-contract.json и выданной программой; используйте интерфейс обновления, сохраняя процесс.


      ### Обновление кэша от его пользователя {#handler-unprivileged-cache}


      Выданный потребитель выдаёт старое содержимое: режим 0600 может блокировать его пользователя, а одни исправленные права не обновят кэш, если обработчик SIGHUP не уведомлён или сигнал не удалось отправить от этого пользователя. Выданная программа обрабатывает SIGHUP повторным чтением от своего UID. Сохраните процесс и отправляйте обновление от выданного пользователя; не заменяйте его новым или привилегированным сервером. Обработчик notify запускается при changed: ручное исправление файла перед неизменяющим copy может оставить оба кэша старыми. Root-приложение 8080 и выданное приложение 8081 требуют отдельных обновлений.


      ### Лимит времени наблюдения за парком {#handler-observation-budget}


      Наблюдение процесса через SSH превысило оставшийся лимит: недоступный управляемый хост или время, потраченное на предыдущие ответы потребителей, могли помешать проверить все хосты.


      ### Наблюдение входных данных существующего потребителя {#handler-observer-inputs}


      Не удалось наблюдать выданного потребителя: процесс или зафиксированное свидетельство могут отсутствовать, SSH/HTTP завершиться ошибкой либо namespace или JSON недоступны или некорректны. Общая проверка HTTP и потребителя остановилась без именованной диагностики: рабочий каталог, запуск Python или прерванная группа прежних HTTP-проверок могли помешать подробному наблюдению.


      ### Сохранение уже исправного процесса {#fleet-retain-healthy-process}


      Уже исправный процесс app3 не совпадает с исходными PID и временем запуска либо его идентичность не прочитана: причиной могут быть лишняя перезагрузка всех хостов, рестарт исправного сервиса или сбой SSH и чтения защищённой записи.  `cat healthy-service service-interface.json`.


      ### Доставка выпуска и прав файла {#fleet-release-file-and-mode}


      app1 не предоставляет release-60 с правами 644 в /srv/site/message либо SSH завершился ошибкой: выданная задача с retired, недоставленное содержимое или изменённые права оставляют файл неверным.  `ansible fleet -m ansible.builtin.shell -a "cat /srv/site/message; stat -c %a /srv/site/message"`. Сравните все три хоста: app1, app2 и app3.


      ### Обновление устаревшего сервиса при неизменном файле {#fleet-refresh-only-stale-services}


      app1 не отдаёт release-60 по HTTP либо запрос завершился ошибкой: процесс кэширует содержимое при запуске, поэтому правильный неизменённый файл без обновления процесса оставляет старый ответ. app2 начинает с правильным файлом и устаревшим процессом, а app3 уже отдаёт выпуск и сохраняет PID и время запуска. Copy уведомляет handler только при изменении файла: сначала сравните HTTP и обновляйте процесс при неизменном файле лишь для устаревшего ответа. После доставки сравните ответы app1, app2 и app3. `cat service-interface.json rollout.yml; curl -fsS --max-time 3 "http://app1-${DQ_NAMESPACE#dq-}:8080"`.


      ## Попробуйте


      Откройте лабораторию **ansible**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Две изменившие состояние задачи запустят один handler дважды?


      ```bash

      cd ~/lab/examples/handlers

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Первый запуск выполняет его один раз, повторный без изменений не выполняет.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.


      Общая конфигурация может питать несколько независимых кешей процессов. Тема уведомления может запускать разные handlers, но каждая операция требует полномочий относительно учётной записи целевого процесса. Отдельно проверяйте доступ к файлу, фактический ответ каждого потребителя и сохранение нужной идентичности процесса; читаемый файл ещё не доказывает принятие данных.'
    pl: 'Zmienione zadania powiadamiają handlers. Dwa powiadomienia do tego samego handler są łączone przed jego uruchomieniem. Drugi przebieg zbieżny nie powoduje żadnych zmian do powiadomienia. Późniejsza awaria zadania może uniemożliwić uruchomienie już zgłoszonego handler.


      Zadanie może zgłosić niezmieniony plik, gdy działający proces nadal używa starszych danych. Porównaj zapis pliku z odpowiedzią HTTP i ustal, który proces można zachować.


      ### Pliki i aktywne banery wydania {#fleet-release-delivery}


      W zadaniu 010 etap fleet kończy się dopiero wtedy, gdy wszystkie trzy pliki `/srv/site/message` mają wymagany release i tryb, a trzy banery HTTP zwracają `release-10`. Handler może ponownie wczytać buforowany baner, gdy dostarczenie zmieni plik; sam odczyt pliku nie potwierdza stanu procesu.


      ### Aktywny baner i podsumowanie ponownej dostawy {#release-repeat-delivery}


      W zadaniu 020 fleet otrzymuje zarządzany artefakt `release.txt`. Po dostarczeniu i ponownym wczytaniu wywołanym zmianą sprawdź trzy pliki i działające banery HTTP, a potem uruchom playbook ponownie i sprawdź w recap każdego hosta `changed=0` oraz `failed=0`. Obserwacje pokazują obecny stan, lecz nie dowodzą historii wszystkich wcześniejszych przebiegów. W second-run.txt sprawdź błędy zadań, niedostępne hosty lub niepełne podsumowanie. Jeśli sonda nie daje wyniku, sprawdź uruchamianie Pythona na stacji.


      ### Ponowne wczytanie aktywnego banera {#reload-live-banner}


      W zadaniu 008 proces zachowuje baner odczytany przy starcie nawet po zmianie `/srv/site/message`. W `rollout.yml` dodaj powiadomienie `Reload banner` do zadania copy; dostarczony handler uruchamia `dq-service reload` po zmianie. Uruchom playbook i odczytaj wszystkie trzy działające banery HTTP: każdy musi zwrócić `north-ready`. Sam poprawny plik nie dowodzi, że proces wczytał go ponownie.


      ### Dostarczona treść na każdym hoście {#handler-shared-content}


      app1 nie zwrócił north-ready z /srv/site/message; dostarczenie mogło nie objąć hosta, plik się zmienił albo SSH lub namespace uniemożliwia odczyt. `ssh -n -o BatchMode=yes -p 2222 root@app1-"${DQ_NAMESPACE#dq-}" ''cat /srv/site/message''`. Powtórz obserwację na app2 i app3.


      ### Uprawnienia dostarczonego odbiorcy {#handler-file-access}


      app1 nie potwierdził trybu 644 dla /srv/site/message; dostarczone zadanie może nadal wymuszać 0600 albo obserwacja SSH/stat zawiodła. Dostarczony odbiorca z pamięcią podręczną działa jako istniejący użytkownik bez root. Przy 0600 poprawny plik może być dla niego nieczytelny mimo odczytu przez root. Dostarcz wymagane 0644 bez zmiany użytkownika lub uprawnień aplikacji; prawa i odświeżenie są osobnymi obserwacjami na każdym hoście. Powtórz obserwację na app2 i app3.


      ### Powiadomienie istniejącej aplikacji root {#handler-root-cache}


      app1 nie podał north-ready na porcie 8080; plik może być poprawny, ale handler reload nie został powiadomiony albo żądanie HTTP lub namespace zawiodło. `ansible-playbook rollout.yml`. Powtórz obserwację na app2 i app3.


      ### Zachowanie dostarczonego procesu i użytkownika {#handler-retained-principal}


      Dostarczony proces nie odpowiada zamrożonej tożsamości; restart, zmiana użytkownika lub uprawnień, polecenia albo programu może naruszyć zachowany PID, czas startu i kontrakt tożsamości. Zapis setup obejmuje PID, czas startu, UID/GID/grupy, capabilities, polecenie i bajty programu. Poprawna odpowiedź procesu po restarcie lub edycji nie zachowuje tej tożsamości. Przed zmianami porównaj aplikację z consumer-contract.json i programem; używaj interfejsu odświeżania bez zastępowania procesu.


      ### Odświeżanie pamięci podręcznej jako jej użytkownik {#handler-unprivileged-cache}


      Dostarczony odbiorca nadal podaje stare dane; 0600 może blokować jego użytkownika, a sama poprawa praw nie odświeża pamięci podręcznej, gdy handler SIGHUP nie został powiadomiony lub sygnału nie wysłano jako ten użytkownik. Program obsługuje SIGHUP, czytając plik jako własny UID. Zachowaj proces i odśwież go jako dostarczony użytkownik; nie zastępuj go nowym ani uprzywilejowanym serwerem. Handler notify uruchamia się po changed, więc ręczna poprawa przed niezmieniającym copy może pozostawić oba stare cache. Aplikacja root na 8080 i dostarczona na 8081 wymagają własnego odświeżenia.


      ### Limit czasu obserwacji floty {#handler-observation-budget}


      Obserwacja procesu przez SSH przekroczyła pozostały limit; nieodpowiadający host lub czas zużyty na wcześniejsze odpowiedzi odbiorców może uniemożliwić kontrolę wszystkich hostów.


      ### Obserwacja danych istniejącego odbiorcy {#handler-observer-inputs}


      Nie można obserwować dostarczonego odbiorcy; proces lub zamrożony zapis może nie istnieć, SSH/HTTP może zawieść albo namespace lub JSON jest niedostępny lub błędny. Połączona kontrola HTTP i odbiorcy zatrzymała się bez nazwanej diagnostyki; katalog roboczy, start Pythona lub przerwana wcześniejsza grupa HTTP mogły uniemożliwić szczegółową obserwację.


      ### Zachowanie już zdrowego procesu {#fleet-retain-healthy-process}


      Zdrowy proces app3 nie odpowiada pierwotnemu PID i czasowi startu albo nie odczytano tożsamości; zbędne przeładowanie wszystkich hostów, restart zdrowej usługi lub błąd SSH/chronionego zapisu mogą to wyjaśniać.  `cat healthy-service service-interface.json`.


      ### Dostarczenie bajtów wydania i praw {#fleet-release-file-and-mode}


      app1 nie udostępnia release-60 z trybem 644 w /srv/site/message lub SSH zawiódł; dostarczone zadanie z retired, niedostarczona treść lub zmienione prawa pozostawiają zły plik.  `ansible fleet -m ansible.builtin.shell -a "cat /srv/site/message; stat -c %a /srv/site/message"`. Porównaj wszystkie trzy hosty: app1, app2 i app3.


      ### Odświeżenie starych usług przy niezmienionym pliku {#fleet-refresh-only-stale-services}


      app1 nie serwuje release-60 przez HTTP lub żądanie zawiodło; proces buforuje treść przy starcie, więc poprawny niezmieniony plik bez odświeżenia może pozostawić starą odpowiedź. app2 zaczyna z poprawnym plikiem i starym procesem, a app3 już serwuje wydanie i zachowuje PID oraz czas startu. Handler copy dostaje powiadomienie tylko po zmianie pliku; najpierw sprawdź HTTP i odśwież proces przy niezmienionym pliku tylko dla starej odpowiedzi. Po dostarczeniu porównaj app1, app2 i app3. `cat service-interface.json rollout.yml; curl -fsS --max-time 3 "http://app1-${DQ_NAMESPACE#dq-}:8080"`.


      ## Wypróbuj


      Otwórz laboratorium **ansible** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy dwa zmienione zadania uruchomią dwukrotnie ten sam handler?


      ```bash

      cd ~/lab/examples/handlers

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Pierwszy przebieg wykonuje to raz, a drugi zbieżny przebieg nie wykonuje go.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.


      Wspólna konfiguracja może zasilać kilka niezależnych pamięci podręcznych procesów. Temat powiadomienia może uruchamiać różne handlery, lecz każda operacja wymaga uprawnień względem konta procesu docelowego. Osobno sprawdzaj dostęp do pliku, rzeczywistą odpowiedź każdego konsumenta i zachowanie tożsamości procesu; czytelne bajty nie dowodzą przyjęcia danych.'
    es: 'Las tareas modificadas notifican a handlers. Se fusionan dos notificaciones al mismo handler antes de que se ejecute. Una segunda ejecución convergente no tiene cambios que notificar. Un error de tarea posterior puede impedir que se ejecute un handler ya notificado.


      Una tarea puede informar que el archivo está intacto mientras el proceso sigue usando datos antiguos. Compara el registro en disco con la respuesta HTTP e identifica qué proceso puede conservarse.


      ### Archivos y banners de versión en vivo {#fleet-release-delivery}


      En el ejercicio 010, la etapa de fleet termina solo cuando los tres archivos `/srv/site/message` tienen el release y modo requeridos y los tres banners HTTP devuelven `release-10`. Un handler puede recargar el banner almacenado cuando la entrega cambia el archivo; observar solo el archivo no verifica el proceso.


      ### Banner en vivo y resumen de la segunda entrega {#release-repeat-delivery}


      En el ejercicio 020, fleet recibe el artefacto gestionado `release.txt`. Después de entregarlo y recargar por el cambio, comprueba los tres archivos y banners HTTP activos, luego ejecuta el playbook de nuevo y revisa `changed=0` y `failed=0` en el recap de cada host. Estas observaciones muestran el estado actual, pero no prueban el historial de todas las ejecuciones anteriores. En second-run.txt, busca errores de tareas, hosts inaccesibles o un resumen incompleto. Si la prueba del resumen no da resultados, comprueba que Python arranque en la estación.


      ### Recarga del banner en ejecución {#reload-live-banner}


      En el ejercicio 008, el proceso conserva el banner leído al arrancar incluso después de cambiar `/srv/site/message`. En `rollout.yml`, notifica `Reload banner` desde la tarea copy; el handler suministrado ejecuta `dq-service reload` después de un cambio. Ejecuta el playbook y consulta los tres banners HTTP activos: todos deben devolver `north-ready`. Un archivo correcto por sí solo no demuestra que el proceso lo haya recargado.


      ### Contenido entregado en cada host {#handler-shared-content}


      app1 no devolvió north-ready desde /srv/site/message; la entrega puede no haberse ejecutado allí, el archivo cambió o SSH o namespace impiden leerlo. `ssh -n -o BatchMode=yes -p 2222 root@app1-"${DQ_NAMESPACE#dq-}" ''cat /srv/site/message''`. Repita la observación en app2 y app3.


      ### Permisos del consumidor suministrado {#handler-file-access}


      app1 no informó modo 644 en /srv/site/message; la tarea suministrada puede mantener 0600 o falló la observación SSH/stat. El consumidor con caché usa su identidad existente sin root. 0600 puede impedir leer el mensaje correcto aunque root lo lea. Entregue 0644 sin cambiar identidad ni privilegios de la aplicación; permisos y refresco se observan por separado en cada host. Repita la observación en app2 y app3.


      ### Notificar a la aplicación root existente {#handler-root-cache}


      app1 no sirvió north-ready en el puerto 8080; el archivo puede estar correcto pero no se notificó al handler reload, o falló la petición HTTP o la resolución namespace. `ansible-playbook rollout.yml`. Repita la observación en app2 y app3.


      ### Conservar proceso e identidad suministrados {#handler-retained-principal}


      El proceso suministrado ya no coincide con su identidad fijada; reiniciarlo, cambiar usuario o privilegios, comando o programa puede romper el contrato de PID, inicio e identidad conservados. El registro setup conserva PID, inicio, UID/GID/grupos, capabilities, comando y bytes del programa. Una respuesta correcta tras reiniciar o modificar el proceso no conserva esa identidad. Compare aplicación, consumer-contract.json y programa antes de cambiarlos; use el refresco conservando el proceso.


      ### Refrescar la caché con su identidad {#handler-unprivileged-cache}


      El consumidor suministrado sigue sirviendo contenido antiguo; 0600 puede bloquear a su usuario y corregir permisos no refresca la caché si no se notificó al handler SIGHUP o no pudo enviarse la señal con esa identidad. El programa suministrado relee el mensaje al recibir SIGHUP con su propio UID. Conserve el proceso y envíe el refresco con esa identidad; no lo sustituya por otro servidor privilegiado. Un handler notify se ejecuta cuando la tarea informa changed; corregir el archivo manualmente antes de copy sin cambios puede dejar ambas cachés antiguas. La aplicación root en 8080 y la suministrada en 8081 necesitan refrescos separados.


      ### Presupuesto de observación de la flota {#handler-observation-budget}


      La observación del proceso por SSH superó el tiempo restante; un host que no responde o el tiempo consumido esperando respuestas anteriores puede impedir inspeccionar todos los hosts.


      ### Observar entradas del consumidor existente {#handler-observer-inputs}


      No se pudo observar el consumidor suministrado; pueden faltar su proceso o registro fijado, fallar SSH/HTTP o no estar disponibles o ser inválidos namespace o JSON. La prueba conjunta HTTP y consumidor se detuvo sin diagnóstico específico; el directorio de trabajo, el inicio de Python o el grupo HTTP anterior interrumpido pueden impedir observaciones detalladas.


      ### Conservar el proceso ya sano {#fleet-retain-healthy-process}


      El proceso app3 ya sano no coincide con PID y hora de inicio originales o no pudo leerse; recargar todos los hosts sin necesidad, reiniciar el servicio sano o fallos SSH/datos protegidos pueden explicarlo.  `cat healthy-service service-interface.json`.


      ### Entregar bytes y permisos de versión {#fleet-release-file-and-mode}


      app1 no proporciona release-60 con modo 644 en /srv/site/message o falló SSH; la tarea suministrada con retired, contenido sin entregar o permisos cambiados dejan el archivo incorrecto.  `ansible fleet -m ansible.builtin.shell -a "cat /srv/site/message; stat -c %a /srv/site/message"`. Compare los tres hosts: app1, app2 y app3.


      ### Refrescar servicios obsoletos con archivos iguales {#fleet-refresh-only-stale-services}


      app1 no sirve release-60 por HTTP o falló la petición; el proceso guarda contenido al iniciar, por lo que un archivo correcto sin cambios ni refresco puede conservar respuesta antigua. app2 empieza con archivo correcto y proceso obsoleto; app3 ya sirve la versión y conserva PID y hora de inicio. El handler copy solo recibe aviso si cambia el archivo: observe HTTP y refresque un archivo igual solo si el proceso está obsoleto. Compare respuestas de app1, app2 y app3 tras entregar. `cat service-interface.json rollout.yml; curl -fsS --max-time 3 "http://app1-${DQ_NAMESPACE#dq-}:8080"`.


      ## Pruébalo


      Abra el laboratorio **ansible** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿Dos tareas modificadas ejecutarán el mismo handler dos veces?


      ```bash

      cd ~/lab/examples/handlers

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. La primera ejecución lo ejecuta una vez y la segunda ejecución convergente no lo ejecuta.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh`, luego `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.


      Una configuración compartida puede alimentar cachés de procesos independientes. Un tema de notificación puede activar handlers distintos, pero cada operación necesita autoridad sobre el usuario del proceso destino. Verifica por separado acceso al archivo, respuesta real de cada consumidor y conservación de identidad; bytes legibles no demuestran adopción.'
    de: 'Geänderte Aufgaben benachrichtigen handlers. Zwei Benachrichtigungen an denselben handler werden vor der Ausführung zusammengeführt. Bei einem zweiten konvergenten Lauf ist keine Änderung zu benachrichtigen. Ein späterer Aufgabenfehler kann die Ausführung eines bereits benachrichtigten handler verhindern.


      Eine Aufgabe kann unveränderten Dateiinhalt melden, während der laufende Prozess ältere Daten nutzt. Vergleichen Sie jeden gespeicherten Wert mit der HTTP-Antwort und ermitteln Sie, welcher Prozess weiterlaufen kann.


      ### Fleet-Dateien und aktive Release-Banner {#fleet-release-delivery}


      In Aufgabe 010 ist die Fleet-Phase erst abgeschlossen, wenn alle drei Dateien `/srv/site/message` den geforderten Release und Modus haben und alle drei HTTP-Banner `release-10` liefern. Ein Handler kann das zwischengespeicherte Banner neu laden, wenn die Auslieferung die Datei ändert; die Datei allein bestätigt den Prozess nicht.


      ### Aktives Banner und Zusammenfassung des zweiten Laufs {#release-repeat-delivery}


      In Aufgabe 020 erhält die Fleet das verwaltete Artefakt `release.txt`. Prüfe nach Auslieferung und durch die Änderung ausgelöstem Neuladen die drei Dateien und laufenden HTTP-Banner. Führe das Playbook erneut aus und prüfe im Recap jedes Hosts `changed=0` und `failed=0`. Diese Beobachtungen zeigen den aktuellen Zustand, beweisen aber nicht die Geschichte aller früheren Läufe. Prüfen Sie second-run.txt auf Aufgabenfehler, unerreichbare Hosts oder eine unvollständige Zusammenfassung. Prüfen Sie bei ausbleibendem Ergebnis den Python-Start am Arbeitsplatz.


      ### Neuladen des laufenden Banners {#reload-live-banner}


      In Aufgabe 008 behält der Prozess das beim Start gelesene Banner auch nach einer Änderung von `/srv/site/message`. Benachrichtige in `rollout.yml` aus der Copy-Aufgabe `Reload banner`; der vorhandene Handler führt nach einer Änderung `dq-service reload` aus. Führe das Playbook aus und frage alle drei laufenden HTTP-Banner ab: Alle müssen `north-ready` liefern. Eine korrekte Datei allein beweist nicht, dass der Prozess sie neu geladen hat.


      ### Zugestellter Inhalt auf jedem Host {#handler-shared-content}


      app1 lieferte nicht north-ready aus /srv/site/message; die Zustellung lief möglicherweise nicht auf diesem Host, die Datei wurde geändert oder SSH-/Namespace-Eingaben verhindern das Lesen. `ssh -n -o BatchMode=yes -p 2222 root@app1-"${DQ_NAMESPACE#dq-}" ''cat /srv/site/message''`. Wiederholen Sie die Beobachtung auf app2 und app3.


      ### Rechte für den gelieferten Verbraucher {#handler-file-access}


      app1 meldete für /srv/site/message nicht Modus 644; die gelieferte Aufgabe erzwingt möglicherweise noch 0600 oder die SSH-/stat-Beobachtung schlug fehl. Der gelieferte Cache-Verbraucher läuft unter seinem vorhandenen Nicht-Root-Benutzer. Modus 0600 kann die korrekte Nachricht für ihn unlesbar lassen, obwohl root sie liest. Stellen Sie 0644 ohne Änderung von Benutzer oder Privilegien bereit; Rechte und Cache-Aktualisierung werden auf jedem Host getrennt beobachtet. Wiederholen Sie die Beobachtung auf app2 und app3.


      ### Bestehende Root-Anwendung benachrichtigen {#handler-root-cache}


      app1 lieferte auf Port 8080 nicht north-ready; die Datei kann korrekt sein, während der Reload-Handler nicht benachrichtigt wurde oder HTTP-Anfrage beziehungsweise Namespace-Auflösung fehlschlugen. `ansible-playbook rollout.yml`. Wiederholen Sie die Beobachtung auf app2 und app3.


      ### Gelieferten Prozess und Benutzer erhalten {#handler-retained-principal}


      Der gelieferte Prozess entspricht nicht mehr seiner eingefrorenen Identität; Neustart, geänderte Benutzerrechte, Befehl oder Programm können den Vertrag für erhaltene PID, Startzeit und Identität verletzen. Der Setup-Beleg erfasst PID, Startzeit, UID/GID/Gruppen, Capability-Sätze, Befehlszeile und Programmbytes. Eine erfolgreiche Antwort eines neu gestarteten oder geänderten Prozesses bewahrt diese Identität nicht. Vergleichen Sie Anwendung, consumer-contract.json und geliefertes Programm vor Änderungen; nutzen Sie das Aktualisierungsinterface unter Erhalt des Prozesses.


      ### Cache als sein Benutzer aktualisieren {#handler-unprivileged-cache}


      Der gelieferte Verbraucher liefert veraltete Inhalte; 0600 kann seinen Benutzer blockieren, und korrigierte Rechte allein aktualisieren den Cache nicht, wenn der SIGHUP-Handler nicht benachrichtigt oder das Signal nicht als dieser Benutzer gesendet wurde. Das gelieferte Programm liest bei SIGHUP die Nachricht unter seiner eigenen UID neu. Erhalten Sie den Prozess und aktualisieren Sie ihn als gelieferten Benutzer; ersetzen Sie ihn nicht durch einen neuen oder privilegierten Server. Ein notify-Handler läuft nach changed; eine manuelle Dateikorrektur vor unverändertem copy kann daher beide Caches veraltet lassen. Root-Anwendung auf 8080 und gelieferte Anwendung auf 8081 benötigen jeweils ihre Aktualisierung.


      ### Zeitbudget der Flottenbeobachtung {#handler-observation-budget}


      Die SSH-Prozessbeobachtung überschritt das verbleibende Zeitbudget; ein nicht antwortender Host oder Wartezeit für frühere Verbraucherantworten kann zu wenig Zeit für alle Hosts lassen.


      ### Eingaben des bestehenden Verbrauchers beobachten {#handler-observer-inputs}


      Der gelieferte Verbraucher konnte nicht beobachtet werden; Prozess oder eingefrorener Beleg fehlen möglicherweise, SSH/HTTP scheitert oder Namespace-/JSON-Beobachtungen sind nicht verfügbar beziehungsweise ungültig. Die kombinierte HTTP-/Verbraucherprüfung endete ohne benannte Diagnose; Arbeitsverzeichnis, Python-Start oder eine unterbrochene frühere HTTP-Gruppe haben möglicherweise Detailbeobachtungen verhindert.


      ### Bereits gesunden Prozess erhalten {#fleet-retain-healthy-process}


      Der bereits gesunde Prozess auf app3 entspricht nicht mehr ursprünglicher PID und Startzeit oder seine Identität war nicht lesbar; unnötiges Neuladen aller Hosts, ein Neustart des gesunden Dienstes oder SSH-/Beobachtungsfehler können die Ursache sein.  `cat healthy-service service-interface.json`.


      ### Release-Inhalt und Dateirechte bereitstellen {#fleet-release-file-and-mode}


      app1 liefert nicht release-60 mit Modus 644 in /srv/site/message oder SSH schlug fehl; die gelieferte Kopieraufgabe mit retired, noch nicht bereitgestellter Inhalt oder geänderte Rechte können die Datei falsch belassen.  `ansible fleet -m ansible.builtin.shell -a "cat /srv/site/message; stat -c %a /srv/site/message"`. Vergleichen Sie alle drei Hosts: app1, app2 und app3.


      ### Veraltete Dienste bei unveränderten Dateien aktualisieren {#fleet-refresh-only-stale-services}


      app1 liefert nicht release-60 über HTTP oder die Anfrage schlug fehl; der Prozess speichert den Inhalt beim Start, daher kann eine korrekte unveränderte Datei ohne Aktualisierung die alte Antwort aktiv lassen. app2 startet mit korrekter Datei und veraltetem Prozess; app3 liefert das Release bereits und muss PID sowie Startzeit behalten. Ein copy Handler wird nur bei geänderter Datei benachrichtigt; prüfen Sie zuerst HTTP und aktualisieren Sie bei unveränderter Datei nur einen veralteten Prozess. Vergleichen Sie nach Bereitstellung die Antworten von app1, app2 und app3. `cat service-interface.json rollout.yml; curl -fsS --max-time 3 "http://app1-${DQ_NAMESPACE#dq-}:8080"`.


      ## Probieren Sie es aus


      Öffnen Sie das **ansible Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Werden zwei geänderte Aufgaben denselben handler zweimal ausführen?


      ```bash

      cd ~/lab/examples/handlers

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Der erste Lauf führt es einmal aus, und der konvergierte zweite Lauf führt es nicht aus.


      ## Beobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.


      Eine gemeinsame Konfiguration kann mehrere unabhängige Prozess-Caches versorgen. Ein Benachrichtigungsthema kann verschiedene Handler auslösen; jede Operation benötigt weiterhin Befugnisse gegenüber dem Benutzer des Zielprozesses. Prüfe Dateizugriff, tatsächliche Antwort jedes Verbrauchers und Erhalt der erforderlichen Prozessidentität getrennt; lesbare Bytes belegen noch keine Übernahme.'
  full_example: full-handlers
ansible-11:
  profile: ansible
  example: rolling
  source_hash: f286ff216f1e5b4955815f0bf75d88a3909c595196b5df26ec69e588018819e5
  content:
    en: 'serial limits the hosts processed in each batch. Error policy decides whether later batches continue. Delegation changes where a task executes; it does not automatically change which inventory host owns its result. Kernel upgrades and VM reboots are an additional VM practicum, outside these SSH containers.


      A task can update a file while the service continues using data loaded by the running process. Check each host’s actual response before proceeding to the next batch.


      ### One host per delivery batch {#one-host-at-a-time}


      In quest 028, `serial: 1` limits each batch to one host. Deliver the required `north-ready` file with mode `0644`, then inspect the actual batch trace: app1, app2 and app3 must appear in order, one per batch. A correct final file alone does not demonstrate the batch order. If the check stops before reporting a condition, check whether Python can start and its required observations are readable. The observer restores its saved host state after the trial. A failed restore can stop the probe before a batch result is reported. An SSH read failure can leave the trace incomplete. Check that the observer can read the delivered file on each host before interpreting the order.


      In quest 032, delegation changes where the task runs but normally keeps one iteration per inventory host. Use `groups["fleet"]` as the membership source, sort it, and run the localhost summary task once. Verify the workstation''s `fleet.txt` contains app1, app2 and app3 on separate lines with mode `0644`, and that the summary was not delivered to the targets. The copy task uses `delegate_to: localhost` and `run_once: true`.


      ### One writer for current fleet membership {#fleet-summary-membership}


      In quest 032, the supplied delegated task writes inventory_hostname once per host, so writers can overwrite the same report. Generate the sorted groups["fleet"] membership with one localhost writer using run_once. The observer reruns rollout.yml with an added alias and a removed member: a fixed list fails. It must also read the original report and inventory, run Ansible within its deadline and restore the report. Python startup, input, execution, timeout or restoration failures can produce the same diagnostic; inspect these before assuming the membership logic is wrong.


      ### Local report permissions {#fleet-summary-mode}


      In quest 032, fleet.txt must exist on the workstation with mode 0644. A task that omits mode or writes elsewhere can leave the report missing or with other permissions. Set mode on the delegated copy task and inspect stat -c %a fleet.txt locally; a failed stat is also a failed observation.


      ### Keep the report on the workstation {#fleet-summary-location}


      In quest 032, delegate_to: localhost writes the report on the workstation. A task executed on managed hosts, or a leftover remote file, can leave /srv/site/fleet.txt on app1, app2 or app3. Inspect only that report path and correct the task destination and delegation. The absence check uses SSH; a failed connection also reports failure, so verify access to the named host before concluding a remote report exists.


      ### One host per maintenance batch {#maintenance-single-host-batches}


      In quest 040, keep every play configured for one host per batch; serial: 1 is the direct form. Percentage/list forms depend on the selected inventory membership. This observer reads rollout.yml and inventory, not execution history. Unreadable YAML or inventory commands can produce serial; workspace/Python startup failures can stop it before that diagnostic. Compare configured batches separately from file and HTTP delivery.


      ### Maintenance record on each host {#maintenance-contract-files}


      In quest 040, the supplied play initially writes retired. Deliver north-40 to /srv/site/maintenance.txt on app1, app2 and app3, then read each host separately. A skipped or unapplied task can leave stale or missing content. SSH and file-read failures share the corresponding host marker; confirm the observation before concluding the value is wrong.


      ### Publish and reload the served message {#maintenance-loaded-message}


      In quest 040, maintenance-interface.json says the fleet HTTP process loads /srv/site/message at process start and reloads with dq-service reload. Writing maintenance.txt alone does not update that interface. Publish north-40 to the message file, reload, then verify each host HTTP response on port 8080 before the next batch. Resolve DNS, connection and HTTP errors separately from stale body content.


      ## Try it


      Open the **ansible Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** With serial=1 and a fatal failure on app2, will app3 begin?


      ```bash

      cd ~/lab/examples/rolling

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The failed second batch stops the sequence before app3.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.


      Quest 096 uses a trusted snapshot containing configuration and older instance state. The live instance owns its current binding, data and access context. Hash verification establishes which archive is accepted; extraction scope and metadata choices determine its effect on a running instance. Observe the restored message together with retained identity and tenant data from `original-live-data.json`. The current program also needs to perform the guarded extraction and service refresh for caller-owned destinations and principals through the declared service interface.'
    ru: 'Serial ограничивает размер партии. Политика ошибок определяет переход к следующей партии. Делегирование меняет место исполнения, но не обязательно владельца результата в inventory. Обновление ядра и reboot ВМ — дополнительный практикум в VM, за пределами этих SSH-контейнеров.


      Задача может обновить файл, пока сервис продолжает работать с уже загруженными данными. Сверяйте реальный ответ каждого хоста перед переходом к следующей партии.


      ### Один хост за этап доставки {#one-host-at-a-time}


      В квесте 028 `serial: 1` ограничивает каждую партию одной машиной. Доставьте нужный файл `north-ready` с режимом `0644`, затем изучите фактический журнал партий: app1, app2 и app3 должны идти по порядку, по одной машине в партии. Правильный конечный файл сам по себе не доказывает порядок партий. Если проверка завершается до вывода результата, проверьте запуск Python и доступность данных для проверки. После пробного прогона наблюдатель восстанавливает сохранённое состояние хостов. Сбой восстановления может остановить проверку до вывода результата. Ошибки чтения по SSH могут оставить трассу неполной. Убедитесь, что наблюдатель может прочитать доставленный файл на каждом хосте, прежде чем разбирать порядок.


      В квесте 032 delegation меняет место выполнения задачи, но обычно сохраняет одну итерацию на каждую машину inventory. Используйте `groups["fleet"]` как источник состава, отсортируйте его и выполните задачу сводки на localhost один раз. Проверьте, что `fleet.txt` на рабочей станции содержит app1, app2 и app3 по строке с режимом `0644`, а сводка не доставлена на целевые машины. В задаче copy используйте `delegate_to: localhost` и `run_once: true`.


      ### Один писатель для текущего состава fleet {#fleet-summary-membership}


      В квесте 032 делегированная задача пишет inventory_hostname для каждого хоста, поэтому писатели могут перезаписывать общий отчёт. Сформируйте отсортированный groups["fleet"] одним писателем на localhost с run_once. Наблюдатель запускает rollout.yml с добавленным псевдонимом и удалённым участником: фиксированный список не подходит. Он также должен прочитать исходный отчёт и inventory, выполнить Ansible в пределах срока и восстановить отчёт. Ошибки запуска Python, чтения, выполнения, таймаут или ошибка восстановления могут дать ту же диагностику; проверьте их до оценки логики состава.


      ### Права локального отчёта {#fleet-summary-mode}


      В квесте 032 fleet.txt должен существовать на рабочей станции с правами 0644. Если задача не задаёт mode или пишет в другом месте, отчёт может отсутствовать либо иметь другие права. Задайте mode в делегированной задаче copy и локально проверьте stat -c %a fleet.txt; ошибка stat также означает, что наблюдение не удалось.


      ### Отчёт остаётся на рабочей станции {#fleet-summary-location}


      В квесте 032 delegate_to: localhost записывает отчёт на рабочей станции. Выполнение задачи на управляемых хостах или оставшийся файл могут привести к /srv/site/fleet.txt на app1, app2 или app3. Проверьте только этот путь отчёта и исправьте назначение и делегирование задачи. Отсутствие проверяется через SSH: ошибка соединения также даёт отказ, поэтому сначала проверьте доступ к указанному хосту.


      ### Один хост в партии обслуживания {#maintenance-single-host-batches}


      В квесте 040 сохраните по одному хосту в партии каждого play; прямой вариант — serial: 1. Проценты/списки зависят от выбранного состава inventory. Наблюдатель читает rollout.yml и inventory, а не историю выполнения. Ошибки чтения YAML или команд inventory дают serial; ошибки каталога/запуска Python могут прервать его раньше. Проверяйте настройку партий отдельно от доставки файлов и HTTP.


      ### Запись обслуживания на каждом хосте {#maintenance-contract-files}


      В квесте 040 исходный play записывает retired. Доставьте north-40 в /srv/site/maintenance.txt на app1, app2 и app3, затем прочитайте каждый хост отдельно. Пропущенная или невыполненная задача может оставить старое содержимое или отсутствие файла. Ошибки SSH и чтения используют маркер этого хоста; подтвердите наблюдение до вывода о неверном значении.


      ### Публикация и перечитывание сообщения {#maintenance-loaded-message}


      В квесте 040 maintenance-interface.json указывает, что HTTP-процесс fleet читает /srv/site/message при запуске и перечитывает через dq-service reload. Запись только maintenance.txt не обновляет этот интерфейс. Опубликуйте north-40 в файле сообщения, перечитайте его и проверьте HTTP каждого хоста на порту 8080 перед следующей партией. Отделяйте ошибки DNS, соединения и HTTP от старого содержимого ответа.


      ## Попробуйте


      Откройте лабораторию **ansible**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** При serial=1 и фатальной ошибке app2 начнётся ли партия app3?


      ```bash

      cd ~/lab/examples/rolling

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Вторая партия останавливает последовательность до app3.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.


      Квест 096 использует доверенный снимок с конфигурацией и состоянием прежнего экземпляра. Работающий экземпляр владеет своей текущей привязкой, данными и контекстом доступа. Проверка хеша определяет принимаемый архив; область извлечения и выбор метаданных определяют влияние на работающий экземпляр. Наблюдайте восстановленное сообщение вместе с сохранённой идентичностью и данными арендатора из `original-live-data.json`. Текущая программа также должна выполнять защищённое извлечение и обновление сервиса для каталога и учётных записей вызывающей стороны через заявленный интерфейс.'
    pl: 'serial ogranicza hosty przetwarzane w każdej partii. Polityka błędów decyduje, czy późniejsze partie będą kontynuowane. Delegowanie zmienia miejsce wykonywania zadania; nie zmienia to automatycznie tego, który host inventory jest właścicielem jego wyniku. Aktualizacje jądra i ponowne uruchamianie VM to dodatkowa praktyka VM, poza tymi kontenerami SSH.


      Zadanie może zmienić plik, podczas gdy usługa używa wczytanych wcześniej danych. Sprawdź rzeczywistą odpowiedź każdego hosta przed przejściem do następnej partii.


      ### Jeden host na partię {#one-host-at-a-time}


      W zadaniu 028 `serial: 1` ogranicza każdą partię do jednego hosta. Dostarcz wymagany plik `north-ready` z trybem `0644`, a następnie sprawdź rzeczywisty zapis partii: app1, app2 i app3 muszą wystąpić kolejno, po jednym hoście w partii. Sam poprawny plik końcowy nie dowodzi kolejności partii. Jeśli sonda kończy się przed wynikiem, sprawdź uruchamianie Pythona i dostęp do wymaganych danych. Po próbie obserwator przywraca zapisany stan hostów. Błąd przywracania może przerwać sondę przed wynikiem. Błąd odczytu przez SSH może pozostawić niepełny ślad. Przed oceną kolejności sprawdź, czy obserwator odczytuje plik na każdym hoście.


      W zadaniu 032 delegowanie zmienia miejsce wykonania zadania, ale zwykle pozostawia jedną iterację na host inventory. Użyj `groups["fleet"]` jako źródła składu, posortuj je i wykonaj zadanie podsumowania na localhost jeden raz. Sprawdź, że `fleet.txt` na stacji roboczej zawiera app1, app2 i app3 w osobnych wierszach z trybem `0644`, a podsumowanie nie trafiło na hosty docelowe. W zadaniu copy użyj `delegate_to: localhost` i `run_once: true`.


      ### Jeden zapisujący dla bieżącego składu fleet {#fleet-summary-membership}


      W zadaniu 032 delegowane zadanie zapisuje inventory_hostname dla każdego hosta, więc wykonania mogą nadpisywać wspólny raport. Utwórz posortowane groups["fleet"] jednym zadaniem na localhost z run_once. Obserwator uruchamia rollout.yml z dodanym aliasem i usuniętym członkiem: stała lista nie wystarcza. Musi też odczytać oryginalny raport i inventory, wykonać Ansible w terminie i odtworzyć raport. Błędy startu Pythona, odczytu, wykonania, przekroczenie czasu lub błąd odtwarzania mogą dać tę samą diagnostykę; sprawdź je przed oceną logiki składu.


      ### Uprawnienia lokalnego raportu {#fleet-summary-mode}


      W zadaniu 032 fleet.txt musi istnieć na stacji roboczej z trybem 0644. Zadanie bez mode lub zapis w innym miejscu może pozostawić brakujący raport albo inne uprawnienia. Ustaw mode w delegowanym zadaniu copy i sprawdź lokalnie stat -c %a fleet.txt; błąd stat też oznacza nieudaną obserwację.


      ### Raport pozostaje na stacji roboczej {#fleet-summary-location}


      W zadaniu 032 delegate_to: localhost zapisuje raport na stacji roboczej. Zadanie wykonane na hostach zarządzanych lub pozostały plik może pozostawić /srv/site/fleet.txt na app1, app2 lub app3. Sprawdź tylko tę ścieżkę raportu i popraw cel oraz delegowanie zadania. Kontrola braku pliku używa SSH: błąd połączenia także daje niepowodzenie, więc najpierw sprawdź dostęp do wskazanego hosta.


      ### Jeden host na partię utrzymania {#maintenance-single-host-batches}


      W zadaniu 040 zachowaj po jednym hoście w partii każdego play; prostą postacią jest serial: 1. Procenty/listy zależą od wybranego składu inventory. Obserwator czyta rollout.yml i inventory, nie historię wykonania. Nieczytelny YAML lub błędy poleceń inventory mogą dać serial; błędy katalogu/startu Pythona mogą przerwać go wcześniej. Porównuj konfigurację partii osobno od dostarczania plików i HTTP.


      ### Zapis utrzymania na każdym hoście {#maintenance-contract-files}


      W zadaniu 040 dostarczony play początkowo zapisuje retired. Dostarcz north-40 do /srv/site/maintenance.txt na app1, app2 i app3, potem odczytaj każdy host osobno. Pominięte lub niewykonane zadanie może zostawić starą treść lub brak pliku. Błędy SSH i odczytu dzielą marker danego hosta; potwierdź obserwację przed oceną wartości.


      ### Publikacja i przeładowanie wiadomości {#maintenance-loaded-message}


      W zadaniu 040 maintenance-interface.json podaje, że proces HTTP fleet ładuje /srv/site/message przy starcie i przeładowuje przez dq-service reload. Sam zapis maintenance.txt nie aktualizuje interfejsu. Opublikuj north-40 w pliku wiadomości, przeładuj i sprawdź HTTP każdego hosta na porcie 8080 przed kolejną partią. Oddziel błędy DNS, połączenia i HTTP od starej treści.


      ## Wypróbuj


      Otwórz laboratorium **ansible** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy w przypadku serial=1 i krytycznej awarii app2 rozpocznie się app3?


      ```bash

      cd ~/lab/examples/rolling

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Niepowodzenie drugiej partii zatrzymuje sekwencję przed app3.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.


      Zadanie 096 używa zaufanego zrzutu z konfiguracją i stanem starszej instancji. Działająca instancja ma własne bieżące powiązanie, dane i kontekst dostępu. Weryfikacja hasha wyznacza akceptowane archiwum; zakres wypakowania i metadane określają wpływ na działającą instancję. Obserwuj odtworzony komunikat wraz z zachowaną tożsamością i danymi z `original-live-data.json`. Bieżący program ma również wykonywać chronione wypakowanie i odświeżanie usługi dla katalogów i kont wywołującego przez zadeklarowany interfejs.'
    es: 'serial limita los hosts procesados ​​en cada lote. La política de errores decide si continúan los lotes posteriores. La delegación cambia donde se ejecuta una tarea; no cambia automáticamente qué host inventory posee su resultado. Las actualizaciones del kernel y los reinicios de VM son una práctica adicional de VM, fuera de estos contenedores SSH.


      Una tarea puede actualizar un archivo mientras el servicio sigue usando los datos ya cargados. Comprueba la respuesta real de cada host antes de avanzar al siguiente lote.


      ### Un host por lote de entrega {#one-host-at-a-time}


      En el ejercicio 028, `serial: 1` limita cada lote a un host. Entrega el archivo requerido `north-ready` con modo `0644` e inspecciona el registro real de lotes: app1, app2 y app3 deben aparecer en orden, uno por lote. Un archivo final correcto por sí solo no demuestra el orden de los lotes. Si la prueba termina antes de informar de un resultado, comprueba el inicio de Python y el acceso a los datos necesarios. Tras la prueba, el observador restaura el estado guardado de los hosts. Un fallo al restaurarlo puede interrumpir la comprobación antes del resultado. Un fallo de lectura por SSH puede dejar incompleta la traza. Comprueba que el observador pueda leer el archivo de cada host antes de interpretar el orden.


      En el ejercicio 032, la delegación cambia dónde se ejecuta la tarea, pero normalmente mantiene una iteración por host del inventory. Usa `groups["fleet"]` como fuente de miembros, ordénalos y ejecuta una sola vez la tarea de resumen en localhost. Comprueba que `fleet.txt` en la estación de trabajo contiene app1, app2 y app3 en líneas separadas con modo `0644`, y que el resumen no se entregó a los hosts de destino. Usa `delegate_to: localhost` y `run_once: true` en la tarea copy.


      ### Un escritor para los miembros actuales de fleet {#fleet-summary-membership}


      En el reto 032, la tarea delegada escribe inventory_hostname por cada host y puede sobrescribir el informe compartido. Genera groups["fleet"] ordenado con un escritor en localhost y run_once. El observador ejecuta rollout.yml con un alias añadido y un miembro eliminado: una lista fija falla. También debe leer el informe original y el inventario, ejecutar Ansible dentro del plazo y restaurar el informe. Los fallos de arranque de Python, lectura, ejecución, tiempo o restauración pueden producir el mismo diagnóstico; revísalos antes de culpar a la lógica de miembros.


      ### Permisos del informe local {#fleet-summary-mode}


      En el reto 032, fleet.txt debe existir en la estación con modo 0644. Una tarea sin mode o que escribe en otro lugar puede dejar el informe ausente o con permisos distintos. Define mode en la tarea copy delegada e inspecciona stat -c %a fleet.txt localmente; un fallo de stat también impide verificarlo.


      ### Mantener el informe en la estación {#fleet-summary-location}


      En el reto 032, delegate_to: localhost escribe el informe en la estación. Una tarea ejecutada en hosts gestionados o un archivo residual puede dejar /srv/site/fleet.txt en app1, app2 o app3. Inspecciona solo esa ruta del informe y corrige el destino y la delegación. La comprobación de ausencia usa SSH; una conexión fallida también produce un fallo, así que verifica el acceso al host indicado antes de concluir que existe el informe remoto.


      ### Un host por lote de mantenimiento {#maintenance-single-host-batches}


      En el reto 040, conserva un host por lote en cada play; serial: 1 es la forma directa. Porcentajes/listas dependen de los miembros seleccionados del inventario. El observador lee rollout.yml e inventario, no el historial de ejecución. YAML ilegible o fallos de comandos del inventario pueden dar serial; fallos del directorio/arranque Python pueden detenerlo antes. Compara lotes configurados por separado de la entrega de archivos y HTTP.


      ### Registro en cada host {#maintenance-contract-files}


      En el reto 040, el play suministrado escribe inicialmente retired. Entrega north-40 en /srv/site/maintenance.txt de app1, app2 y app3 y lee cada host por separado. Una tarea omitida o no ejecutada puede dejar contenido antiguo o ausente. Fallos SSH y de lectura comparten el marcador del host; confirma la observación antes de concluir que el valor es incorrecto.


      ### Publicar y recargar el mensaje {#maintenance-loaded-message}


      En el reto 040, maintenance-interface.json indica que el proceso HTTP fleet carga /srv/site/message al arrancar y recarga con dq-service reload. Escribir solo maintenance.txt no actualiza esa interfaz. Publica north-40 en el archivo, recarga y verifica HTTP de cada host en puerto 8080 antes del siguiente lote. Separa errores DNS, de conexión y HTTP del contenido antiguo.


      ## Pruébalo


      Abra el laboratorio **ansible** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara únicamente este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** Con serial=1 y una falla fatal en app2, ¿comenzará app3?


      ```bash

      cd ~/lab/examples/rolling

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. El segundo lote fallido detiene la secuencia anterior a app3.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh` y luego con `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.


      El ejercicio 096 utiliza una instantánea fiable con configuración y estado de una instancia anterior. La instancia activa posee su vinculación, datos y contexto de acceso actuales. Verificar el hash determina el archivo aceptado; alcance de extracción y metadatos determinan su efecto sobre una instancia activa. Observa el mensaje restaurado junto con identidad y datos conservados de `original-live-data.json`. El programa actual también debe realizar extracción protegida y actualización del servicio para destinos y usuarios del invocador mediante la interfaz declarada.'
    de: 'Serial begrenzt die Hosts, die in jedem Stapel verarbeitet werden. Die Fehlerrichtlinie entscheidet, ob spätere Stapel fortgesetzt werden. Die Delegation ändert den Ort, an dem eine Aufgabe ausgeführt wird. Es ändert sich nicht automatisch, welcher inventory-Host sein Ergebnis besitzt. Kernel-Upgrades und VM-Neustarts sind ein zusätzliches VM-Praktikum außerhalb dieser SSH-Container.


      Eine Aufgabe kann eine Datei aktualisieren, während der Dienst weiter die bereits geladenen Daten verwendet. Prüfen Sie die tatsächliche Antwort jedes Hosts, bevor Sie den nächsten Batch starten.


      ### Ein Host pro Auslieferungsbatch {#one-host-at-a-time}


      In Aufgabe 028 begrenzt `serial: 1` jeden Batch auf einen Host. Liefere die geforderte Datei `north-ready` mit Modus `0644` aus und prüfe den tatsächlichen Batch-Ablauf: app1, app2 und app3 müssen in dieser Reihenfolge mit je einem Host pro Batch erscheinen. Eine korrekte endgültige Datei allein belegt die Batch-Reihenfolge nicht. Falls die Prüfung vor einem Ergebnis abbricht, prüfen Sie den Python-Start und den Zugriff auf die benötigten Daten. Nach dem Probelauf stellt die Beobachtung den gespeicherten Hostzustand wieder her. Ein Fehler dabei kann die Prüfung vor einem Ergebnis abbrechen. Ein SSH-Lesefehler kann den Ablaufbericht unvollständig lassen. Prüfen Sie vor der Auswertung, ob die ausgelieferte Datei auf jedem Host gelesen werden kann.


      In Aufgabe 032 ändert Delegation den Ausführungsort der Aufgabe, behält aber normalerweise eine Iteration pro Inventory-Host bei. Nutze `groups["fleet"]` als Quelle der Mitglieder, sortiere sie und führe die Zusammenfassung auf localhost einmal aus. Prüfe, dass `fleet.txt` auf der Workstation app1, app2 und app3 in getrennten Zeilen mit Modus `0644` enthält und nicht an die Zielhosts ausgeliefert wurde. Verwende in der Copy-Aufgabe `delegate_to: localhost` und `run_once: true`.


      ### Ein Schreiber für die aktuelle fleet-Mitgliedschaft {#fleet-summary-membership}


      In Quest 032 schreibt die delegierte Aufgabe inventory_hostname je Host und kann so den gemeinsamen Bericht überschreiben. Erzeuge sortierte groups["fleet"] mit einem Schreiber auf localhost und run_once. Der Beobachter führt rollout.yml mit zusätzlichem Alias und entferntem Mitglied aus: eine feste Liste scheitert. Er muss auch Originalbericht und Inventory lesen, Ansible innerhalb der Frist ausführen und den Bericht wiederherstellen. Python-Start-, Lese-, Ausführungs-, Zeit- oder Wiederherstellungsfehler können dieselbe Diagnose auslösen; prüfe sie vor der Mitgliederlogik.


      ### Berechtigungen des lokalen Berichts {#fleet-summary-mode}


      In Quest 032 muss fleet.txt auf der Workstation mit Modus 0644 existieren. Eine Aufgabe ohne mode oder mit anderem Ziel kann eine fehlende Datei oder andere Rechte hinterlassen. Setze mode in der delegierten copy-Aufgabe und prüfe lokal stat -c %a fleet.txt; ein stat-Fehler verhindert ebenfalls die Beobachtung.


      ### Bericht auf der Workstation belassen {#fleet-summary-location}


      In Quest 032 schreibt delegate_to: localhost den Bericht auf die Workstation. Eine auf verwalteten Hosts ausgeführte Aufgabe oder eine alte Datei kann /srv/site/fleet.txt auf app1, app2 oder app3 hinterlassen. Prüfe nur diesen Berichtspfad und korrigiere Ziel und Delegation. Die Abwesenheitsprüfung nutzt SSH; auch ein Verbindungsfehler führt zum Fehlschlag. Prüfe daher den Zugriff auf den benannten Host, bevor du eine vorhandene Datei annimmst.


      ### Ein Host pro Wartungsbatch {#maintenance-single-host-batches}


      Behalte in Quest 040 in jedem Play einen Host pro Batch; serial: 1 ist die direkte Form. Prozent-/Listenformen hängen von der ausgewählten Inventory-Mitgliedschaft ab. Der Beobachter liest rollout.yml und Inventory, keine Ausführungshistorie. Unlesbares YAML oder fehlgeschlagene Inventory-Befehle können serial liefern; Arbeitsverzeichnis-/Python-Startfehler stoppen ihn früher. Prüfe konfigurierte Batches getrennt von Datei- und HTTP-Lieferung.


      ### Wartungsdatensatz auf jedem Host {#maintenance-contract-files}


      In Quest 040 schreibt das gelieferte Play zunächst retired. Liefere north-40 nach /srv/site/maintenance.txt auf app1, app2 und app3 und lies jeden Host getrennt. Eine übersprungene oder nicht ausgeführte Aufgabe kann veralteten oder fehlenden Inhalt hinterlassen. SSH- und Dateilesefehler teilen den Host-Marker; bestätige die Beobachtung vor der Wertbewertung.


      ### Nachricht veröffentlichen und neu laden {#maintenance-loaded-message}


      In Quest 040 beschreibt maintenance-interface.json, dass der Fleet-HTTP-Prozess /srv/site/message beim Start lädt und mit dq-service reload neu lädt. Alleiniges Schreiben von maintenance.txt aktualisiert diese Schnittstelle nicht. Veröffentliche north-40 in der Nachrichtendatei, lade neu und prüfe jeden Host auf Port 8080 vor dem nächsten Batch. Unterscheide DNS-, Verbindungs- und HTTP-Fehler von veraltetem Inhalt.


      ## Probieren Sie es aus


      Öffnen Sie das **ansible Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Wird app3 mit serial=1 und einem schwerwiegenden Fehler auf app2 beginnen?


      ```bash

      cd ~/lab/examples/rolling

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Der fehlgeschlagene zweite Stapel stoppt die Sequenz vor app3.


      ## Beobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.


      Aufgabe 096 verwendet einen vertrauenswürdigen Snapshot mit Konfiguration und älterem Instanzzustand. Die laufende Instanz besitzt ihre aktuelle Bindung, Daten und Zugriffskontext. Die Hashprüfung bestimmt das akzeptierte Archiv; Extraktionsumfang und Metadatenwahl bestimmen dessen Wirkung auf eine laufende Instanz. Beobachte die wiederhergestellte Nachricht zusammen mit erhaltener Identität und Mandantendaten aus `original-live-data.json`. Das aktuelle Programm muss die geschützte Extraktion und Dienstaktualisierung auch für Aufruferziele und -benutzer über die deklarierte Schnittstelle durchführen.'
  full_example: full-rolling
  additional:
    en: Kernel upgrades and VM reboots need a separate VM practicum. The Lab exercises rolling batches on disposable SSH targets.
