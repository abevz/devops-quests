    pl: 'Ansible Vault szyfruje dane w stanie spoczynku. Kontroler potrzebuje sekretu deszyfrowania w czasie wykonywania, a no_log zapobiega ujawnieniu wartości na wyjściu tego zadania. W tym laboratorium celowo używa się jednorazowego hasła demonstracyjnego.


      ### Przyczyna i obserwacja (069, deployment_log) {#private-delivery-nonempty-log}


      Play mógł nie zostać uruchomiony z zapisem wyjścia albo deployment.log jest pusty; zachowaj niepusty log wykonania. Dostarczone zadanie copy ustawia mode 644 i wyłącza no_log. Dostarcz oba wejścia z prywatnymi prawami i właścicielem odbiorcy. Pierwotne programy czytają przy każdym HTTP; restart ani SIGHUP nie są potrzebne. Obserwuj metadane bez wypisywania credential. `test -s deployment.log`


