      Artefakt mógł zostać wyeksportowany po apply, gdy south.txt jest no-op, lub pomijać trasę; zachowaj plan sprzed apply tworzący south.txt. Stary checkpoint zawiera guardian, ale nie późniejszą operację progress. Nowszy częściowy state zachowuje progress, lecz stracił powiązanie guardian. Przywróć tylko to powiązanie i zachowaj backup sprzed odtwarzania oraz plan sprzed apply. `jq ''.resource_changes[] | select(.type=="local_file") | {address,change}'' recovery-plan.json`.


      ### Checkpoint i nowsza kopia częściowa {#recovery-trusted-checkpoint-and-partial-backup}


      Nadpisanie zaufanego checkpoint lub backup po odtworzeniu traci wymagane dane; zachowaj bajty checkpoint i nowszy częściowy state z pierwotnym lineage, serial i ID obiektów. Stary checkpoint zawiera guardian, ale nie późniejszą operację progress. Nowszy częściowy state zachowuje progress, lecz stracił powiązanie guardian. Przywróć tylko to powiązanie i zachowaj backup sprzed odtwarzania oraz plan sprzed apply. `sha256sum recovery-checkpoint.tfstate; jq ''{lineage,serial}'' before-recovery.tfstate`.


      ### Końcowy plan bez zmian {#recovery-final-converged-plan}


      Niezastosowana konfiguracja, drift plików lub błąd plan może dać niezerowy kod końcowy; sprawdź proponowane zmiany po zastosowaniu zachowanego planu odtwarzania. Stary checkpoint zawiera guardian, ale nie późniejszą operację progress. Nowszy częściowy state zachowuje progress, lecz stracił powiązanie guardian. Przywróć tylko to powiązanie i zachowaj backup sprzed odtwarzania oraz plan sprzed apply. `tofu plan -input=false -detailed-exitcode -no-color`.


      ### Uruchomienie obserwacji state {#recovery-state-helper-startup}


      Obserwacja state może zawieść przed sprawdzeniem powiązań, np. przy braku startu tofu lub importów helper; zwykły niezerowy kod/błędny JSON tofu daje recovery_bindings. Stary checkpoint zawiera guardian, ale nie późniejszą operację progress. Nowszy częściowy state zachowuje progress, lecz stracił powiązanie guardian. Przywróć tylko to powiązanie i zachowaj backup sprzed odtwarzania oraz plan sprzed apply. `command -v tofu; python3 -I -c "import dq_check"`.


      ### Uruchomienie obserwacji planu {#recovery-plan-helper-startup}


      Observer planu może zawieść przed konkretnym markerem przy importach lub nieoczekiwanej strukturze artefaktu; brakujący/błędny recovery-plan.json daje recovery_binding_plan. Stary checkpoint zawiera guardian, ale nie późniejszą operację progress. Nowszy częściowy state zachowuje progress, lecz stracił powiązanie guardian. Przywróć tylko to powiązanie i zachowaj backup sprzed odtwarzania oraz plan sprzed apply. `python3 -I -c "import dq_check"; test -s recovery-plan.json`.


      ## Wypróbuj


      Otwórz laboratorium **opentofu** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy edycja zarządzanego pliku aktualizuje deklarację HCL?


      ```bash

      cd ~/lab/examples/state

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Następny plan proponuje pojednanie; apply przywraca declared.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'El estado vincula las direcciones de recursos a las identidades de los objetos gestionados. Un plan normal compara la configuración, el estado y los objetos actualizados. Editar el archivo fuera de OpenTofu crea deriva; La aplicación del plan revisado restaura el contenido del declared.


      Ante una pérdida parcial de estado, compara linaje, recursos e identidades de la copia y del estado actual. Una copia puede contener una versión anterior válida de un recurso con un vínculo más reciente. Compara la identidad recuperada en el origen y en cada consumidor independiente.


      Compara el linaje, el número de serie y los vínculos de recursos del punto de control anterior y del estado actual. Sustituir todo el estado puede borrar cambios posteriores. Conserva la copia de confianza y guarda el estado actual antes de cambiarlo. Revisa el plan para ver qué cambios se proponen.


      Una salida del productor es una interfaz actual, no una entrega automática a otros sistemas. Compara sus valores tipados y su identidad persistente de operación con cada consumidor gestionado de forma independiente. Una etiqueta de versión conocida o los mismos bytes de archivo no distinguen por sí solos una exportación obsoleta. Cada destino puede recibir entradas distintas; inspecciona archivos remotos y modos reales, respuestas recargadas y entornos de procesos en ejecución, no solo manifiestos. Un plan de infraestructura sin cambios no demuestra la entrega posterior. Usa planes con otras entradas, sin aplicarlos, para comprobar si las salidas publicadas siguen al invocador. Al finalizar, vuelve a comprobar el productor y los consumidores anteriores. Estas pruebas establecen la correspondencia actual, no los comandos que la produjeron.


      En el ejercicio 030, empieza por `main.tf` y recupera el `release.txt` gestionado con contenido `release-30`. Comprueba que `local_file.release` esté en el state y que un plan nuevo no tenga cambios. Solo entonces investiga el reader: su entorno `RELEASE` debe coincidir con el marcador y el rollout debe quedar listo.


      ### Identidad original del contenedor y estado {#original-container-state}


      En el ejercicio 026, `original-id` registra la identidad del contenedor existente `rail-worker`. Importa ese ID en `docker_container.worker` y después reanuda el contenedor: import añade el vínculo con state, pero no reanuda un proceso pausado. Comprueba la dirección en state, compara el ID actual de Docker y el ID del recurso de `tofu show -json` con `original-id`, y verifica que el contenedor esté en ejecución y no pausado. Estas comparaciones describen la identidad actual, no toda su historia. La prueba puede detenerse antes de informar de una identidad o estado si la estación no puede iniciar Python.


      ### Archivo gestionado y salida de versión {#release-artifact-production}


      En el ejercicio 020, la primera etapa produce el artefacto gestionado `release.txt` y la salida raíz `release`. Compara archivo y salida con `release-20`, comprueba que `local_file.release` aparece en state y que un plan detallado termina con código 0 antes de usar el artefacto en la etapa de fleet. Un archivo correcto por sí solo no confirma el vínculo con state ni la salida. La prueba lee los datos del recurso aplicado. Si termina sin resultado del estado, comprueba que la estación pueda ejecutar Python.


      ### Estado y ejecución del contenedor {#container-state-runtime}


      En el ejercicio 006, `main.tf` ya declara `docker_container.worker` con el nombre `rail-worker`. Aplica la configuración en el entorno privado y compara `tofu state list` con `docker inspect rail-worker --format ''{{.State.Running}}''`: el estado debe contener `docker_container.worker` y Docker debe mostrar `true`. Una dirección en el estado no demuestra por sí sola que el contenedor esté ejecutándose.


      ### Vínculo del recurso en el estado {#notice-state}


      En el ejercicio 009, la declaración de `local_file.notice` en `main.tf`, el archivo en disco y su vínculo en el estado se observan por separado. Comprueba que `tofu state list` incluya la dirección. El archivo puede existir aunque el estado no tenga ninguna entrada para él.


      ### Aviso editado fuera de OpenTofu {#notice-drift}


      En este ejercicio una edición manual cambió `notice.txt`, mientras que `main.tf` sigue declarando `north-ready`. Revisa `tofu plan` y aplica la configuración para corregir la discrepancia. Comprueba el resultado con `cat notice.txt`.


      ### Comprobación de cambios pendientes {#notice-plan}


      Si falta el vínculo en el estado o cambió el contenido del archivo gestionado, el plan puede mostrar cambios pendientes. Ejecuta `tofu plan -input=false -detailed-exitcode -no-color` tras la recuperación. Se espera el código 0 y ningún cambio pendiente.


      ### Versión gestionada y salida tipada {#release-output-contract}


      En el ejercicio 016, conserva `local_file.release` y el contenido de su archivo `north-r16`. Cambia la salida raíz `release` de una cadena a un objeto con `route = "north"`, `revision = 16` numérico y `targets = ["app1", "app2", "app3"]`. Aplica y examina `tofu output -json release`: JSON debe conservar el número y el array. Comprueba `release.txt`, `local_file.release` en el estado y el código de salida 0 del plan detallado final.


      ### Versión gestionada de relay {#relay-release-state}


      En el reto 030, main.tf declara inicialmente contenido antiguo. Usa approved-release.txt como origen de release.txt y aplica la configuración revisada. Un archivo creado a mano no basta: tofu show -json debe mostrar un local_file gestionado cuyo filename apunte a ese archivo. Un estado ausente o ilegible, o un archivo ausente, impiden comprobarlo. Si la sonda no devuelve un diagnóstico del estado, comprueba que la estación pueda entrar en ~/quest y arrancar Python.


      ### Plan de versión sin cambios {#relay-clean-plan}


      En el reto 030, tofu plan -input=false -detailed-exitcode -no-color debe salir con 0. El código 2 indica cambios pendientes: revísalos y aplica la configuración prevista. El código 1 indica un fallo de planificación: lee el error de configuración, proveedor o estado. El contenido correcto del archivo no demuestra un plan sin cambios.


      ### Output north original {#recovery-original-north-output}


      Output puede faltar o referirse a archivo north recreado; conserve provider ID original del registro fijado. El checkpoint antiguo contiene guardian pero no operación progress reciente. El state parcial conserva progress pero pierde vínculo guardian. Recupere solo ese vínculo y conserve copia previa a recuperación y plan anterior a apply. `tofu output -raw north_id`.


      ### Conservar archivo existente {#recovery-existing-north-content}


      El north.txt existente puede haberse editado o ser ilegible; compare contenido con configuración suministrada antes de cambiar state. El checkpoint antiguo contiene guardian pero no operación progress reciente. El state parcial conserva progress pero pierde vínculo guardian. Recupere solo ese vínculo y conserve copia previa a recuperación y plan anterior a apply. `test "$(cat north.txt)" = north-71`.


      ### Crear archivo ausente {#recovery-missing-south-content}


      La configuración añade south.txt sin apply; puede faltar o diferir hasta que el plan de recuperación cree la ruta declarada. El checkpoint antiguo contiene guardian pero no operación progress reciente. El state parcial conserva progress pero pierde vínculo guardian. Recupere solo ese vínculo y conserve copia previa a recuperación y plan anterior a apply. `test "$(cat south.txt)" = south-71`.


      ### Un vínculo y progreso reciente {#recovery-merge-old-binding-with-new-progress}


      Repetir apply puede recrear guardian y restaurar checkpoint completo pierde progress; restaure solo vínculo ausente conservando ambos ID de operaciones. Fallo tofu show o JSON inválido también usa este diagnóstico. El checkpoint antiguo contiene guardian pero no operación progress reciente. El state parcial conserva progress pero pierde vínculo guardian. Recupere solo ese vínculo y conserve copia previa a recuperación y plan anterior a apply. `tofu state list; jq .bindings /run/dq/facts/0/state-identities.json`.


      ### Ambos archivos de ruta gestionados {#recovery-two-managed-route-targets}


      Las entradas restantes pueden apuntar a otros archivos o duplicar ruta; tras conservar dos companions exija un managed local_file por north.txt y south.txt. El checkpoint antiguo contiene guardian pero no operación progress reciente. El state parcial conserva progress pero pierde vínculo guardian. Recupere solo ese vínculo y conserve copia previa a recuperación y plan anterior a apply. `tofu show -json | jq ''.values.root_module.resources[] | {address,type,filename:.values.filename}''`.


      ### Sin reemplazar companions de operaciones {#recovery-plan-preserves-companion-identities}


      Un recovery-plan.json ausente/antiguo o plan que reemplaza companion no conserva trabajo; exporte plan tras restaurar vínculo y mantenga ambos companions no-op con ID originales. El checkpoint antiguo contiene guardian pero no operación progress reciente. El state parcial conserva progress pero pierde vínculo guardian. Recupere solo ese vínculo y conserve copia previa a recuperación y plan anterior a apply. `jq -r ''.resource_changes[] | [.address,(.change.actions|join(","))] | @tsv'' recovery-plan.json`.


      ### Inventario del plan guardado {#recovery-plan-route-inventory}


      Una entrada de ruta adicional incumple inventario del plan guardado; el artefacto describe dos rutas y dos companions de operaciones conservados. El checkpoint antiguo contiene guardian pero no operación progress reciente. El state parcial conserva progress pero pierde vínculo guardian. Recupere solo ese vínculo y conserve copia previa a recuperación y plan anterior a apply. `jq ''.resource_changes | length'' recovery-plan.json`.


      ### Ruta original sin cambios {#recovery-plan-existing-route-no-op}


      El plan guardado puede reemplazar/modificar north.txt o usar otro ID; mantenga entrada existente no-op con identidad provider fijada. El checkpoint antiguo contiene guardian pero no operación progress reciente. El state parcial conserva progress pero pierde vínculo guardian. Recupere solo ese vínculo y conserve copia previa a recuperación y plan anterior a apply. `jq ''.resource_changes[] | select(.type=="local_file") | {address,change}'' recovery-plan.json`.


      ### Plan anterior a aplicar {#recovery-plan-only-missing-route-create}


      El artefacto puede exportarse después de apply, dejando south.txt no-op, u omitir ruta; conserve plan previo a apply que crea south.txt. El checkpoint antiguo contiene guardian pero no operación progress reciente. El state parcial conserva progress pero pierde vínculo guardian. Recupere solo ese vínculo y conserve copia previa a recuperación y plan anterior a apply. `jq ''.resource_changes[] | select(.type=="local_file") | {address,change}'' recovery-plan.json`.


      ### Checkpoint y copia parcial reciente {#recovery-trusted-checkpoint-and-partial-backup}


      Sobrescribir checkpoint confiable o copiar state después de recuperación pierde evidencia; conserve bytes checkpoint y state parcial reciente con lineage, serial e ID originales. El checkpoint antiguo contiene guardian pero no operación progress reciente. El state parcial conserva progress pero pierde vínculo guardian. Recupere solo ese vínculo y conserve copia previa a recuperación y plan anterior a apply. `sha256sum recovery-checkpoint.tfstate; jq ''{lineage,serial}'' before-recovery.tfstate`.


      ### Plan final sin cambios {#recovery-final-converged-plan}


      Configuración sin aplicar, drift o error plan dejan código final distinto de cero; revise cambios propuestos tras aplicar plan de recuperación conservado. El checkpoint antiguo contiene guardian pero no operación progress reciente. El state parcial conserva progress pero pierde vínculo guardian. Recupere solo ese vínculo y conserve copia previa a recuperación y plan anterior a apply. `tofu plan -input=false -detailed-exitcode -no-color`.


      ### Iniciar observación state {#recovery-state-helper-startup}


      El observer state puede fallar antes de vínculos, por ejemplo al iniciar tofu o importar helper; código no cero/JSON inválido ordinario usa recovery_bindings. El checkpoint antiguo contiene guardian pero no operación progress reciente. El state parcial conserva progress pero pierde vínculo guardian. Recupere solo ese vínculo y conserve copia previa a recuperación y plan anterior a apply. `command -v tofu; python3 -I -c "import dq_check"`.


      ### Iniciar observación del plan {#recovery-plan-helper-startup}


      El observer plan puede fallar sin marcador específico por imports o estructura inesperada; recovery-plan.json ausente/inválido ordinario usa recovery_binding_plan. El checkpoint antiguo contiene guardian pero no operación progress reciente. El state parcial conserva progress pero pierde vínculo guardian. Recupere solo ese vínculo y conserve copia previa a recuperación y plan anterior a apply. `python3 -I -c "import dq_check"; test -s recovery-plan.json`.


      ## Pruébalo


      Abra el **opentofu Lab** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


