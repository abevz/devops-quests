kubernetes-4:
  profile: kubernetes
  example: probes
  source_hash: ecad6a149624396bcbf84129724c608bfe67154652b0f31858ad810bf0d16ecf
  content:
    en: 'A probe answers one question about a container. Startup gates the other probes; readiness controls traffic eligibility; liveness can restart the container. A Running pod can still be unready.


      In quest 051, repair the first worker''s HTTP readiness port to match its listener and wait for readiness. The next stage is a separate backup Deployment: correct its `ROUTE` environment to `north` and verify that running reader.


      In quest 017, keep the `stable` Pod ready and the `quarantine` process running with `ROUTE=retired`. Its readiness command should test whether `ROUTE` equals `north`, so the quarantine Pod is Running but not Ready. Keep the Pod-template labels and Service selector `route-service=departures`, then inspect ready EndpointSlice entries for `departures`: only the stable Pod should be ready for traffic. Do not delete either Deployment to obtain that result.


      ## Try it


      Open the **kubernetes Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Does deleting the readiness marker restart the container?


      ```bash

      cd ~/lab/examples/probes

      bash run.sh

      kubectl -n lab-probes get pod probe

      kubectl -n lab-probes describe pod probe

      # Check readiness and liveness separately.

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The readiness transition leaves the restart count unchanged. Removing the liveness marker then produces a restart.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Проба отвечает на один вопрос о контейнере. Startup задерживает остальные пробы, readiness определяет готовность принимать трафик, liveness может перезапустить контейнер. Running ещё не означает Ready.


      В квесте 051 исправьте порт HTTP readiness первого worker по его слушающему порту и дождитесь готовности. Следующий этап относится к отдельному backup Deployment: исправьте переменную `ROUTE` на `north` и проверьте работающий reader.


      В квесте 017 сохраните Pod `stable` готовым, а процесс `quarantine` работающим с `ROUTE=retired`. Его команда readiness должна проверять, равно ли `ROUTE` значению `north`, поэтому Pod quarantine будет Running, но не Ready. Сохраните метки шаблонов Pod и селектор Service `route-service=departures`, затем проверьте готовые записи EndpointSlice для `departures`: только Pod stable должен быть готов принимать трафик. Не удаляйте ни один Deployment ради этого результата.


      ## Попробуйте


      Откройте лабораторию **kubernetes**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Удаление файла readiness перезапустит контейнер?


      ```bash

      cd ~/lab/examples/probes

      bash run.sh

      kubectl -n lab-probes get pod probe

      kubectl -n lab-probes describe pod probe

      # Check readiness and liveness separately.

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. После отказа readiness число перезапусков остаётся прежним. Удаление файла liveness затем приводит к перезапуску.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Sonda odpowiada na jedno question dotyczące kontenera. Startup bramkuje inne sondy; readiness kontroluje kwalifikowalność ruchu; liveness może zrestartować kontener. Moduł Running może nadal nie być gotowy.


      W zadaniu 051 popraw port HTTP readiness pierwszego workera zgodnie z jego portem nasłuchu i poczekaj na gotowość. Następny etap dotyczy osobnego backup Deploymentu: popraw zmienną `ROUTE` na `north` i sprawdź działający reader.


      W zadaniu 017 utrzymaj Pod `stable` jako gotowy, a proces `quarantine` jako działający z `ROUTE=retired`. Jego polecenie readiness powinno sprawdzać, czy `ROUTE` jest równe `north`, dzięki czemu Pod quarantine będzie Running, ale nie Ready. Zachowaj etykiety szablonów Pod i selektor Service `route-service=departures`, a następnie sprawdź gotowe wpisy EndpointSlice dla `departures`: tylko Pod stable powinien być gotowy do ruchu. Nie usuwaj żadnego Deploymentu, aby uzyskać ten wynik.


      ## Wypróbuj


      Otwórz laboratorium **kubernetes** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy usunięcie znacznika readiness powoduje ponowne uruchomienie kontenera?


      ```bash

      cd ~/lab/examples/probes

      bash run.sh

      kubectl -n lab-probes get pod probe

      kubectl -n lab-probes describe pod probe

      # Check readiness and liveness separately.

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Przejście readiness pozostawia licznik ponownych uruchomień bez zmian. Usunięcie znacznika liveness powoduje ponowne uruchomienie.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Un probe responde a un question sobre un contenedor. Startup controla las otras sondas; readiness controla la elegibilidad del tráfico; liveness puede reiniciar el contenedor. Es posible que un Running pod aún no esté listo.


      En el ejercicio 051, corrige el puerto HTTP readiness del primer worker para que coincida con su listener y espera la disponibilidad. La siguiente etapa usa otro Deployment backup: corrige su entorno `ROUTE` a `north` y verifica el reader activo.


      En el ejercicio 017, mantén el Pod `stable` listo y el proceso `quarantine` en ejecución con `ROUTE=retired`. Su comando de readiness debe comprobar si `ROUTE` es igual a `north`, de modo que el Pod quarantine esté Running pero no Ready. Conserva las etiquetas de las plantillas de Pod y el selector del Service `route-service=departures`, e inspecciona los endpoints listos de EndpointSlice para `departures`: solo el Pod stable debe estar listo para recibir tráfico. No elimines ninguno de los Deployments para lograrlo.


      ## Pruébalo


      Abra el **Laboratorio kubernetes** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿Eliminar el marcador readiness reinicia el contenedor?


      ```bash

      cd ~/lab/examples/probes

      bash run.sh

      kubectl -n lab-probes get pod probe

      kubectl -n lab-probes describe pod probe

      # Check readiness and liveness separately.

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. La transición readiness deja el recuento de reinicios sin cambios. Al quitar el marcador liveness se produce un reinicio.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh`, luego `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Ein probe antwortet einem question über einen Container. Startup steuert die anderen Sonden; readiness steuert die Verkehrsberechtigung; liveness kann den Container neu starten. Ein Running pod kann noch nicht fertig sein.


      Korrigiere in Aufgabe 051 den HTTP-Readiness-Port des ersten Workers passend zu seinem Listener und warte auf Bereitschaft. Die nächste Phase betrifft ein separates Backup-Deployment: Setze dessen Umgebung `ROUTE` auf `north` und prüfe den laufenden Reader.


      Halte in Aufgabe 017 den Pod `stable` bereit und den Prozess `quarantine` mit `ROUTE=retired` am Laufen. Sein Readiness-Befehl soll prüfen, ob `ROUTE` gleich `north` ist, sodass der Quarantine-Pod Running, aber nicht Ready ist. Behalte die Pod-Template-Labels und den Service-Selektor `route-service=departures` bei und prüfe die bereiten EndpointSlice-Einträge für `departures`: Nur der Stable-Pod soll für Datenverkehr bereit sein. Lösche keines der Deployments, um dieses Ergebnis zu erreichen.


      ## Probieren Sie es aus


      Öffnen Sie das **kubernetes Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Wird der Container durch das Löschen der Markierung readiness neu gestartet?


      ```bash

      cd ~/lab/examples/probes

      bash run.sh

      kubectl -n lab-probes get pod probe

      kubectl -n lab-probes describe pod probe

      # Check readiness and liveness separately.

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Der readiness-Übergang lässt die Neustartanzahl unverändert. Das Entfernen des liveness-Markers führt dann zu einem Neustart.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das vollständige Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-probes
kubernetes-8:
  profile: kubernetes
  example: placement
  source_hash: 36cd87d7a648dd018cb7d1c579c26e90c5220736b717a7008647db08d8d4fecd
  content:
    en: 'Scheduling first filters eligible nodes, then ranks the candidates. A selector, affinity rule or taint can exclude a node even when it has spare CPU. Resource requests are a separate admission constraint.


      In quest 024, an impossible node selector and a CPU request that exceeds the node''s capacity both prevent scheduling. Inspect the Pod events, remove the fictional zone constraint, and choose a small request. Apply the repaired Deployment and check that the relay rollout completes and its Pod is ready.


      ## Try it


      Open the **kubernetes Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Will a tiny CPU request bypass a node selector that matches no node?


      ```bash

      cd ~/lab/examples/placement

      bash run.sh

      kubectl -n lab-placement get pod placed -o wide

      kubectl -n lab-placement describe pod placed

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The pod remains Pending until a node receives the required label.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Планировщик сначала отбирает допустимые узлы, затем выбирает среди них. Selector, affinity или taint могут исключить узел при свободном CPU. Запросы ресурсов — отдельное ограничение.


      В квесте 024 невозможный node selector и запрос CPU сверх емкости узла мешают планированию. Изучите события Pod, уберите вымышленное ограничение зоны и задайте небольшой запрос. Примените исправленный Deployment и проверьте завершение rollout и готовность Pod relay.


      ## Попробуйте


      Откройте лабораторию **kubernetes**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Маленький запрос CPU позволит обойти selector, которому не соответствует ни один узел?


      ```bash

      cd ~/lab/examples/placement

      bash run.sh

      kubectl -n lab-placement get pod placed -o wide

      kubectl -n lab-placement describe pod placed

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Pod остаётся Pending, пока узел не получит нужную метку.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Planowanie najpierw filtruje kwalifikujące się węzły, a następnie klasyfikuje kandydatów. Reguła selector, affinity lub taint może wykluczyć węzeł, nawet jeśli ma on zapasowe CPU. Żądania zasobów stanowią osobne ograniczenie dostępu.


      W zadaniu 024 niemożliwy node selector i żądanie CPU przekraczające pojemność węzła uniemożliwiają planowanie. Sprawdź zdarzenia Poda, usuń fikcyjne ograniczenie strefy i wybierz małe żądanie. Zastosuj poprawiony Deployment i sprawdź zakończenie rollout oraz gotowość Poda relay.


      ## Wypróbuj


      Otwórz laboratorium **kubernetes** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy małe żądanie CPU ominie węzeł selector, który nie pasuje do żadnego węzła?


      ```bash

      cd ~/lab/examples/placement

      bash run.sh

      kubectl -n lab-placement get pod placed -o wide

      kubectl -n lab-placement describe pod placed

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Pod pozostaje Pending do czasu, aż węzeł otrzyma wymaganą etykietę.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'La programación primero filtra los nodos elegibles y luego clasifica a los candidatos. Una regla selector, affinity o taint puede excluir un nodo incluso cuando tiene CPU de repuesto. Las solicitudes de recursos son una restricción de admisión separada.


      En el ejercicio 024, un node selector imposible y una petición de CPU superior a la capacidad del nodo impiden la planificación. Inspecciona los eventos del Pod, elimina la restricción de zona ficticia y elige una petición pequeña. Aplica el Deployment reparado y comprueba que termine el rollout y que el Pod relay esté listo.


      ## Pruébalo


      Abra el laboratorio **kubernetes** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿Una pequeña solicitud CPU omitirá un nodo selector que no coincida con ningún nodo?


      ```bash

      cd ~/lab/examples/placement

      bash run.sh

      kubectl -n lab-placement get pod placed -o wide

      kubectl -n lab-placement describe pod placed

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. El pod sigue siendo Pending hasta que un nodo recibe la etiqueta requerida.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh`, luego `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Beim Scheduling werden zunächst geeignete Knoten gefiltert und dann werden die Kandidaten in eine Rangfolge gebracht. Eine selector-, affinity-Regel oder taint kann einen Knoten ausschließen, selbst wenn er über einen Ersatz-Knoten CPU verfügt. Ressourcenanfragen stellen eine separate Zulassungsbeschränkung dar.


      In Aufgabe 024 verhindern ein unmöglicher Node-Selector und eine CPU-Anforderung über der Knotenkapazität die Einplanung. Prüfe die Pod-Ereignisse, entferne die fiktive Zonenbeschränkung und wähle eine kleine Anforderung. Wende das reparierte Deployment an und prüfe den abgeschlossenen Rollout und die Bereitschaft des Relay-Pods.


      ## Probieren Sie es aus


      Öffnen Sie das **kubernetes Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Wird eine kleine CPU-Anfrage einen Knoten selector umgehen, der mit keinem Knoten übereinstimmt?


      ```bash

      cd ~/lab/examples/placement

      bash run.sh

      kubectl -n lab-placement get pod placed -o wide

      kubectl -n lab-placement describe pod placed

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Der pod bleibt Pending, bis ein Knoten das erforderliche Label erhält.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-placement
kubernetes-9:
  profile: kubernetes
  example: resources
  source_hash: 1fc619c72b2eb72dfe6ba60c6a0d49b35ae6bb57c0c5983130588941508f3bc3
  content:
    en: 'Requests reserve schedulable capacity; limits constrain a running container. CPU throttling, container OOM and node-pressure eviction are different events. This experiment contrasts an impossible request with a running, limited container.


      In quest 088, distinguish the runaway memory command from the readiness probe. Restore the normal HTTP worker, set the requested 96Mi limit and correct its probe, then verify the rollout. A larger memory limit alone does not remove the runaway work.


      In quest 094, inspect the accidental busy loop and throttling counters. Remove the loop while retaining the one replica and its resource budget, then compare the bounded final sample and actual HTTP response. The teaching sample is not a production latency SLO.


      In quest 034, scheduling uses the CPU request, while the CPU limit bounds runtime use. Set the board request to `100m` and limit to `300m`, retaining its memory settings and one replica. Check the live Deployment, rollout, and HTTP response; inspect scheduling events while the Pod is Pending; they can identify the excessive request.


      ## Try it


      Open the **kubernetes Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Does a high limit give the scheduler more available CPU?


      ```bash

      cd ~/lab/examples/resources

      bash run.sh

      kubectl -n lab-resources get pods

      kubectl -n lab-resources describe pod oversized

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The oversized request cannot fit. The bounded pod runs, is Burstable, and exposes its CPU and memory limits in cgroup files.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Requests учитываются при размещении; limits ограничивают работающий контейнер. CPU throttling, OOM контейнера и выселение при давлении узла — разные события. В опыте сравниваются невозможный request и работающий контейнер с лимитами.


      В квесте 088 отделите команду с неограниченным ростом памяти от readiness probe. Восстановите обычный HTTP worker, задайте лимит 96Mi и исправьте probe, затем проверьте rollout. Увеличение лимита само по себе не устраняет бесконтрольную работу.


      В квесте 094 изучите случайный busy loop и счетчики throttling. Уберите цикл, сохранив одну реплику и бюджет ресурсов, затем сравните ограниченную итоговую выборку и реальный HTTP-ответ. Учебное измерение не является production latency SLO.


      В квесте 034 планировщик учитывает CPU request, а CPU limit ограничивает использование во время работы. Установите для board request `100m` и limit `300m`, сохранив настройки памяти и одну реплику. Проверьте живой Deployment, rollout и HTTP-ответ; изучите события планировщика, пока Pod находится в состоянии Pending: они могут указать на чрезмерный запрос.


      ## Попробуйте


      Откройте лабораторию **kubernetes**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Большой limit добавляет планировщику доступный CPU?


      ```bash

      cd ~/lab/examples/resources

      bash run.sh

      kubectl -n lab-resources get pods

      kubectl -n lab-resources describe pod oversized

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Непомерный request не помещается. Ограниченный pod работает, получает класс Burstable, а файлы cgroup показывают лимиты CPU и памяти.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Requests rezerwowa planowalna pojemność; limits ogranicza działający kontener. CPU throttling, kontener OOM i eksmisja pod wpływem nacisku na węzeł to różne zdarzenia. Ten eksperyment porównuje niemożliwy request z działającym, ograniczonym kontenerem.


      W zadaniu 088 odróżnij polecenie z nieograniczonym wzrostem pamięci od readiness probe. Przywróć zwykły HTTP worker, ustaw limit 96Mi i popraw probe, a następnie sprawdź rollout. Sam wyższy limit nie usuwa niekontrolowanej pracy.


      W zadaniu 094 sprawdź przypadkową pętlę busy loop i liczniki throttlingu. Usuń pętlę, zachowując jedną replikę i budżet zasobów, a potem porównaj ograniczoną próbkę końcową i rzeczywistą odpowiedź HTTP. Pomiar szkoleniowy nie jest produkcyjnym latency SLO.


      W zadaniu 034 planowanie uwzględnia CPU request, a CPU limit ogranicza użycie podczas pracy. Ustaw dla board request `100m` i limit `300m`, zachowując ustawienia pamięci i jedną replikę. Sprawdź działający Deployment, rollout i odpowiedź HTTP; sprawdź zdarzenia planowania, gdy Pod jest w stanie Pending; mogą wskazać nadmierne żądanie.


      ## Wypróbuj


      Otwórz laboratorium **kubernetes** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy wysoki poziom limit zapewnia programowi planującemu większą dostępność CPU?


      ```bash

      cd ~/lab/examples/resources

      bash run.sh

      kubectl -n lab-resources get pods

      kubectl -n lab-resources describe pod oversized

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Ponadwymiarowy request nie pasuje. Działa ograniczony pod, to Burstable i udostępnia swoje CPU i pamięć limits w plikach cgroup.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Capacidad programable de reserva Requests; limits restringe un contenedor en ejecución. CPU throttling, contenedor OOM y desalojo por presión de nodo son eventos diferentes. Este experimento contrasta un request imposible con un contenedor limitado y en funcionamiento.


      En el ejercicio 088, distingue el comando que consume memoria sin límite de la readiness probe. Recupera el worker HTTP normal, fija el límite de 96Mi y corrige la probe; después verifica el rollout. Aumentar el límite por sí solo no elimina el trabajo descontrolado.


      En el ejercicio 094, inspecciona el busy loop accidental y los contadores de throttling. Elimina el bucle conservando una réplica y su presupuesto de recursos, y compara la muestra final acotada y la respuesta HTTP real. La muestra didáctica no es un SLO de latencia de producción.


      En el ejercicio 034, la planificación usa el CPU request, mientras que el CPU limit limita el uso en ejecución. Establece para board request `100m` y limit `300m`, conservando la memoria y una réplica. Verifica el Deployment activo, el rollout y la respuesta HTTP; inspecciona los eventos del planificador mientras el Pod está en estado Pending; pueden señalar la petición excesiva.


      ## Pruébalo


      Abra el **Laboratorio kubernetes** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿Un limit alto le da al programador más CPU disponible?


      ```bash

      cd ~/lab/examples/resources

      bash run.sh

      kubectl -n lab-resources get pods

      kubectl -n lab-resources describe pod oversized

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. El oversized request no encaja. El pod limitado que se ejecuta es Burstable y expone su CPU y la memoria limits en archivos cgroup.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh`, luego `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Requests reservierte planbare Kapazität; limits schränkt einen laufenden Container ein. CPU throttling, Container OOM und Knotendruckräumung sind unterschiedliche Ereignisse. Dieses Experiment stellt eine unmögliche Anfrage einem laufenden, begrenzten Container gegenüber.


      Unterscheide in Aufgabe 088 den unbegrenzt Speicher verbrauchenden Befehl von der Readiness-Probe. Stelle den normalen HTTP-Worker wieder her, setze das Limit auf 96Mi und korrigiere die Probe; prüfe anschließend den Rollout. Ein höheres Limit allein beseitigt die unkontrollierte Arbeit nicht.


      Untersuche in Aufgabe 094 die versehentliche Busy-Schleife und die Throttling-Zähler. Entferne die Schleife bei unveränderter Replikzahl eins und gleichem Ressourcenbudget und vergleiche die begrenzte Endmessung sowie die tatsächliche HTTP-Antwort. Die Lehrmessung ist kein Produktions-Latenz-SLO.


      In Aufgabe 034 verwendet die Einplanung den CPU-Request, während das CPU-Limit die Nutzung zur Laufzeit begrenzt. Setze beim Board den Request auf `100m` und das Limit auf `300m`; behalte die Speichereinstellungen und eine Replik. Prüfe das laufende Deployment, den Rollout und die HTTP-Antwort; prüfe die Scheduler-Ereignisse, während der Pod im Zustand Pending ist; sie können auf die zu hohe Anforderung zeigen.


      ## Probieren Sie es aus


      Öffnen Sie das **kubernetes Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und prüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Bietet ein hoher limit dem Scheduler mehr verfügbares CPU?


      ```bash

      cd ~/lab/examples/resources

      bash run.sh

      kubectl -n lab-resources get pods

      kubectl -n lab-resources describe pod oversized

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Die Anfrage oversized passt nicht. Der begrenzte pod wird ausgeführt, ist Burstable und stellt seinen CPU und seinen Speicher limits in cgroup-Dateien bereit.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-resources
kubernetes-10:
  profile: kubernetes
  example: networking
  source_hash: e58b732fe2b16594c65731d5e746ab603e11de1bd9b6a9f3698c525e4b317fb0
  content:
    en: 'A Service name resolves to a virtual address. Its selector and ready EndpointSlices determine which pod addresses receive traffic. DNS success alone does not prove that the Service has a usable backend.


      In quest 118, record `fault: selector` in `diagnosis.json` and set the Service selector to `app: board`. Wait for a ready EndpointSlice, then test Pod IP and Service VIP on port 8080 for `north-118`. The supplied proxy observation must be ready and report `iptables`, `nftables` or `ipvs`; do not modify node rules or global DNS. A ready endpoint check alone does not establish its target identity.


      In quest 119, an egress policy selects the client Pod. Namespace and Pod selectors in one peer are combined; separate peers are alternatives, and policies add allowances. Allow the specified DNS UDP/TCP ports and board TCP port without broader policies. Test DNS and the allowed board response, the failed closed request, and the board''s successful control request; failure alone does not prove its cause.


      In quest 062, a Service can be healthy while NetworkPolicy blocks traffic to its Pods. Policies selecting a Pod add their allowed traffic. Correct the ingress policy''s TCP port to 8080 while retaining its board selector and dispatcher-only source, then test both the permitted dispatcher and denied visitor; allow-all would broaden access.


      In quest 110, resolve `station.internal` to the private controller Service before testing HTTP. Then check the supplied Ingress class, host, Prefix path `/` and backend `board:8080`; the correct Host must return `north-110` and the wrong Host request must fail. DNS success does not prove routing, and a failed request alone does not identify its cause.


      In quest 106, ClusterIP, headless DNS and NodePort are different ways to reach the same selected Pods. Repair each Service selector to `app: board` without changing its recorded UID, type, IPs or ordered ports. Test all three Service names on port `8080` and the private node''s NodePort (at least `30000`); each must return `north-106`. Check the complete Pod IP in the headless DNS answer and allow reconciliation time.


      In quest 107, an Ingress controller routes a host and path to a Service port. Use the supplied private class, host `station.internal`, Prefix path `/` and backend `board:8080`. Test the controller URL with both the correct and wrong Host headers: the first must return `north-107`, and the second must fail. A failure alone does not establish its cause.


      ## Try it


      Open the **kubernetes Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Can the Service exist with zero matching pods?


      ```bash

      cd ~/lab/examples/networking

      bash run.sh

      kubectl -n lab-networking get svc,endpointslice

      kubectl -n lab-networking get pods --show-labels

      bash check.sh

      ```


      > [!question]- Expected result

      > Yes. The wrong selector produces no endpoints. Correcting it makes the same Service route to the ready web pod.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Имя Service разрешается в виртуальный адрес. Selector и готовые EndpointSlice определяют адреса подов для трафика. Успешный DNS сам по себе не доказывает наличие рабочего backend.


      В квесте 118 запишите `fault: selector` в `diagnosis.json` и задайте selector Service `app: board`. Дождитесь готового EndpointSlice и проверьте на порту 8080 ответ `north-118` по IP Pod и VIP Service. Выданное наблюдение proxy должно показывать готовность и режим `iptables`, `nftables` или `ipvs`; не меняйте правила узла или глобальный DNS. Одна проверка готового endpoint не устанавливает идентичность его цели.


      В квесте 119 egress policy выбирает Pod клиента. Namespace и Pod selectors в одном peer объединяются; отдельные peers — альтернативы, а разрешения политик складываются. Разрешите указанные порты DNS UDP/TCP и TCP board без более широких политик. Проверьте DNS и разрешенный ответ board, отказ запроса к closed и успешный контрольный запрос от board; один отказ не доказывает причину.


      В квесте 062 Service может быть исправен, хотя NetworkPolicy блокирует трафик к его Pod. Разрешения политик, выбирающих Pod, складываются. Исправьте TCP-порт ingress policy на 8080, сохранив selector board и источник только dispatcher, затем проверьте разрешенный dispatcher и запрещенного visitor; allow-all расширил бы доступ.


      В квесте 110 сначала разрешите `station.internal` в адрес частного Service контроллера, затем проверяйте HTTP. Проверьте заданный class Ingress, host, путь `/` типа Prefix и backend `board:8080`: правильный Host должен вернуть `north-110`, запрос с неправильным Host — завершиться ошибкой. Успех DNS не доказывает маршрутизацию, а одна ошибка запроса не определяет ее причину.


      В квесте 106 ClusterIP, headless DNS и NodePort дают разные пути к одним выбранным Pod. Исправьте selector каждого Service на `app: board`, сохранив записанные UID, type, IP и порядок портов. Проверьте три имени Service на порту `8080` и NodePort частного узла (не менее `30000`): каждый должен вернуть `north-106`. Проверьте полный IP Pod в ответе headless DNS и дождитесь согласования.


      В квесте 107 контроллер Ingress направляет host и path на порт Service. Используйте заданный частный class, host `station.internal`, путь `/` типа Prefix и backend `board:8080`. Проверьте URL контроллера с правильным и неправильным заголовком Host: первый должен вернуть `north-107`, второй — завершиться ошибкой. Одна ошибка не доказывает ее причину.


      ## Попробуйте


      Откройте лабораторию **kubernetes**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Может ли Service существовать без подходящих подов?


      ```bash

      cd ~/lab/examples/networking

      bash run.sh

      kubectl -n lab-networking get svc,endpointslice

      kubectl -n lab-networking get pods --show-labels

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Да. Неверный selector оставляет Service без endpoints. Исправление направляет тот же Service к готовому web-поду.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Nazwa Service jest przekształcana w adres wirtualny. Jego selector i gotowe EndpointSlice określają, które adresy podów odbierają ruch. Sam sukces DNS nie dowodzi, że Service ma użyteczny backend.


      W zadaniu 118 zapisz `fault: selector` w `diagnosis.json` i ustaw selector Service na `app: board`. Poczekaj na gotowy EndpointSlice, a następnie sprawdź na porcie 8080 odpowiedź `north-118` pod IP Poda i VIP Service. Dostarczona obserwacja proxy musi wskazywać gotowość oraz tryb `iptables`, `nftables` lub `ipvs`; nie zmieniaj reguł węzła ani globalnego DNS. Sama kontrola gotowego endpointu nie ustala tożsamości jego celu.


      W zadaniu 119 egress policy wybiera Pod klienta. Selectory namespace i Poda w jednym peer są łączone; osobne peers są alternatywami, a pozwolenia polityk sumują się. Zezwól na wskazane porty DNS UDP/TCP i TCP board bez szerszych polityk. Sprawdź DNS i dozwoloną odpowiedź board, nieudane żądanie do closed oraz udane żądanie kontrolne z board; sam błąd nie dowodzi przyczyny.


      W zadaniu 062 Service może być zdrowy, choć NetworkPolicy blokuje ruch do jego Podów. Dopuszczenia polityk wybierających Pod sumują się. Popraw port TCP ingress policy na 8080, zachowując selector board i źródło tylko dispatcher, a potem sprawdź dozwolonego dispatchera i zablokowanego visitora; allow-all poszerzyłoby dostęp.


      W zadaniu 110 najpierw rozwiąż `station.internal` na adres prywatnego Service kontrolera, a potem testuj HTTP. Sprawdź podaną klasę Ingress, host, ścieżkę `/` typu Prefix i backend `board:8080`: poprawny Host ma zwrócić `north-110`, a żądanie z błędnym Host ma się nie powieść. Sukces DNS nie dowodzi routingu, a sam błąd żądania nie określa jego przyczyny.


      W zadaniu 106 ClusterIP, headless DNS i NodePort to różne drogi do tych samych wybranych Podów. Popraw selector każdego Service na `app: board`, zachowując zapisane UID, type, IP i kolejność portów. Sprawdź trzy nazwy Service na porcie `8080` i NodePort prywatnego węzła (co najmniej `30000`): każdy ma zwrócić `north-106`. Sprawdź pełny IP Poda w odpowiedzi headless DNS i poczekaj na uzgodnienie stanu.


      W zadaniu 107 kontroler Ingress kieruje host i ścieżkę do portu Service. Użyj podanej prywatnej klasy, hosta `station.internal`, ścieżki `/` typu Prefix i backendu `board:8080`. Sprawdź URL kontrolera z poprawnym i błędnym nagłówkiem Host: pierwszy ma zwrócić `north-107`, drugi ma zakończyć się błędem. Sam błąd nie dowodzi jego przyczyny.


      ## Wypróbuj


      Otwórz laboratorium **kubernetes** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy Service może istnieć z zerowymi pasującymi modułami?


      ```bash

      cd ~/lab/examples/networking

      bash run.sh

      kubectl -n lab-networking get svc,endpointslice

      kubectl -n lab-networking get pods --show-labels

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Tak. Zły selector nie generuje endpoints. Poprawienie tego powoduje tę samą trasę Service do gotowego webpoda.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Un nombre Service se resuelve en una dirección virtual. Su selector y EndpointSlices listos determinan qué direcciones de pod reciben tráfico. El éxito de DNS por sí solo no prueba que el Service tenga un backend utilizable.


      En el ejercicio 118, registra `fault: selector` en `diagnosis.json` y establece el selector del Service en `app: board`. Espera un EndpointSlice listo y comprueba en el puerto 8080 la respuesta `north-118` tanto en la IP del Pod como en el VIP del Service. La observación proxy suministrada debe indicar que está listo y el modo `iptables`, `nftables` o `ipvs`; no cambies reglas del nodo ni DNS global. Un endpoint listo por sí solo no establece la identidad de su destino.


      En el ejercicio 119, una política egress selecciona el Pod cliente. Los selectores de namespace y Pod en un mismo peer se combinan; peers separados son alternativas y las políticas suman permisos. Permite los puertos DNS UDP/TCP y TCP de board indicados sin políticas más amplias. Prueba DNS y la respuesta permitida de board, el fallo hacia closed y la solicitud de control exitosa desde board; un fallo solo no demuestra su causa.


      En el ejercicio 062, un Service puede estar sano aunque NetworkPolicy bloquee tráfico a sus Pods. Los permisos de las políticas que seleccionan un Pod se suman. Corrige el puerto TCP de la política ingress a 8080, conservando el selector board y el origen solo dispatcher; prueba tanto dispatcher permitido como visitor denegado. Allow-all ampliaría el acceso.


      En el ejercicio 110, resuelve primero `station.internal` a la dirección del Service privado del controlador y después prueba HTTP. Comprueba la clase Ingress indicada, host, ruta `/` de tipo Prefix y backend `board:8080`: el Host correcto debe devolver `north-110` y la solicitud con Host incorrecto debe fallar. Un DNS correcto no demuestra el enrutamiento y un fallo aislado no identifica su causa.


      En el ejercicio 106, ClusterIP, DNS headless y NodePort son caminos distintos hacia los mismos Pods seleccionados. Corrige el selector de cada Service a `app: board` sin cambiar su UID, type, IP ni puertos ordenados registrados. Prueba los tres nombres de Service en el puerto `8080` y el NodePort del nodo privado (al menos `30000`): cada uno debe devolver `north-106`. Comprueba la IP completa del Pod en la respuesta DNS headless y espera la reconciliación.


      En el ejercicio 107, un controlador Ingress dirige host y ruta a un puerto de Service. Usa la clase privada indicada, host `station.internal`, ruta `/` de tipo Prefix y backend `board:8080`. Prueba la URL del controlador con las cabeceras Host correcta e incorrecta: la primera debe devolver `north-107` y la segunda debe fallar. Un fallo por sí solo no demuestra su causa.


      ## Pruébalo


      Abra el laboratorio **kubernetes** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿Puede el Service existir sin ningún pods coincidente?


      ```bash

      cd ~/lab/examples/networking

      bash run.sh

      kubectl -n lab-networking get svc,endpointslice

      kubectl -n lab-networking get pods --show-labels

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > YSí. El selector incorrecto no produce ningún endpoints. Al corregirlo se crea la misma ruta Service al pod web listo.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh`, luego `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Ein Service-Name wird in eine virtuelle Adresse aufgelöst. Sein selector und die fertigen EndpointSlices bestimmen, welche Pod-Adressen Datenverkehr empfangen. Der Erfolg von DNS allein beweist nicht, dass der Service über einen brauchbaren backend verfügt.


      Trage in Aufgabe 118 `fault: selector` in `diagnosis.json` ein und setze den Service-Selector auf `app: board`. Warte auf einen bereiten EndpointSlice und prüfe an Pod-IP und Service-VIP auf Port 8080 die Antwort `north-118`. Die bereitgestellte Proxy-Beobachtung muss bereit sein und `iptables`, `nftables` oder `ipvs` als Modus melden; ändere weder Knotenregeln noch globales DNS. Ein bereiter Endpoint allein belegt nicht die Identität seines Ziels.


      In Aufgabe 119 wählt eine Egress-Policy den Client-Pod aus. Namespace- und Pod-Selector in einem Peer werden kombiniert; getrennte Peers sind Alternativen, und Policies addieren ihre Freigaben. Erlaube die angegebenen DNS-UDP/TCP-Ports und den Board-TCP-Port ohne breitere Policies. Prüfe DNS und die erlaubte Board-Antwort, den fehlschlagenden Closed-Aufruf und den erfolgreichen Kontrollaufruf von Board; ein Fehlschlag allein belegt seine Ursache nicht.


      In Aufgabe 062 kann ein Service gesund sein, obwohl eine NetworkPolicy Verkehr zu seinen Pods blockiert. Die erlaubten Verkehre der Policies, die einen Pod auswählen, addieren sich. Korrigiere den TCP-Port der Ingress-Policy auf 8080, behalte Board-Selector und ausschließlich Dispatcher als Quelle und prüfe erlaubten Dispatcher sowie abgewiesenen Visitor. Allow-all würde den Zugriff erweitern.


      Löse in Aufgabe 110 zuerst `station.internal` zur Adresse des privaten Controller-Service auf und prüfe danach HTTP. Kontrolliere die vorgegebene Ingress-Klasse, Host, Prefix-Pfad `/` und Backend `board:8080`: Der richtige Host muss `north-110` liefern, die Anfrage mit falschem Host fehlschlagen. DNS-Erfolg beweist keine Weiterleitung, und ein einzelner Fehlschlag nennt seine Ursache nicht.


      In Aufgabe 106 sind ClusterIP, Headless-DNS und NodePort verschiedene Wege zu denselben ausgewählten Pods. Korrigiere den Selector jedes Service auf `app: board`, ohne die aufgezeichnete UID, den Typ, die IPs oder die Portreihenfolge zu ändern. Prüfe alle drei Service-Namen auf Port `8080` und den NodePort des privaten Knotens (mindestens `30000`): Jeder muss `north-106` liefern. Prüfe die vollständige Pod-IP in der Headless-DNS-Antwort und warte auf den Abgleich.


      In Aufgabe 107 leitet ein Ingress-Controller Host und Pfad an einen Service-Port. Verwende die vorgegebene private Klasse, Host `station.internal`, Prefix-Pfad `/` und Backend `board:8080`. Prüfe die Controller-URL mit richtigem und falschem Host-Header: Der erste muss `north-107` liefern, der zweite fehlschlagen. Ein Fehlschlag allein belegt seine Ursache nicht.


      ## Probieren Sie es aus


      Öffnen Sie das **kubernetes Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Kann der Service ohne passenden pods existieren?


      ```bash

      cd ~/lab/examples/networking

      bash run.sh

      kubectl -n lab-networking get svc,endpointslice

      kubectl -n lab-networking get pods --show-labels

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > YJa. Der falsche selector erzeugt keinen endpoints. Durch die Korrektur wird dieselbe Service-Route zum bereitstehenden Web-Pod erstellt.


      ## Beobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann mit `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-networking
kubernetes-11:
  profile: kubernetes
  example: storage
  source_hash: 1938ff29018d0f83a42e75bd09ecfc28834abb56e58b66e76d887794875f6ecb
  content:
    en: 'A claim requests storage; binding selects a volume; mounting makes its bytes available to a container. A pod restart is not the same operation as deleting its PVC. The Lab uses local node storage, so it does not demonstrate cloud disk replication.


      In quest 057, the claim is explicitly fresh and empty, and its requested storage class cannot be changed in place. Stop the supplied Deployment, recreate only this disposable claim with `standard`, and check it becomes Bound before restarting and verifying the relay. Do not generalize deletion to a claim containing data.


      In quest 045, the data is already in the Bound `route-data` claim. Point the reader volume at that claim and mount it read-only at `/data`; do not delete or recreate the claim. Compare its UID with `original-pvc-uid`, wait for the reader rollout, and verify `/data/route.txt` contains `north-45`.


      ## Try it


      Open the **kubernetes Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Does replacing the writer pod remove the marker from its PVC?


      ```bash

      cd ~/lab/examples/storage

      bash run.sh

      kubectl -n lab-storage get pvc,pod

      kubectl get storageclass

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The replacement pod reads the marker from the same claim. Deleting the example namespace also deletes the claim; do that only after the observation.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'PVC запрашивает хранилище, binding связывает его с томом, mount открывает байты контейнеру. Перезапуск pod и удаление PVC — разные операции. Стенд использует локальное хранилище узла и не моделирует репликацию облачного диска.


      В квесте 057 PVC явно новый и пустой, а запрошенный storage class нельзя изменить на месте. Остановите выданный Deployment, пересоздайте только этот одноразовый PVC с `standard` и проверьте Bound до перезапуска и проверки relay. Не переносите удаление на PVC с данными.


      В квесте 045 данные уже находятся в Bound PVC `route-data`. Направьте volume reader на этот PVC и подключите его только для чтения в `/data`; не удаляйте и не создавайте PVC заново. Сравните UID с `original-pvc-uid`, дождитесь rollout reader и проверьте содержимое `/data/route.txt`: `north-45`.


      ## Попробуйте


      Откройте лабораторию **kubernetes**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Замена writer-пода удаляет файл из PVC?


      ```bash

      cd ~/lab/examples/storage

      bash run.sh

      kubectl -n lab-storage get pvc,pod

      kubectl get storageclass

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Новый pod читает файл через тот же PVC. Очистка namespace удаляет и PVC; выполняйте её после наблюдения.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Roszczenie wymaga przechowywania; binding wybiera głośność; montowanie udostępnia jego bajty kontenerowi. Ponowne uruchomienie pod to nie ta sama operacja, co usunięcie PVC. Laboratorium korzysta z pamięci masowej w węźle lokalnym, dlatego nie demonstruje replikacji dysku w chmurze.


      W zadaniu 057 PVC jest jawnie nowy i pusty, a żądanej storage class nie można zmienić w miejscu. Zatrzymaj dostarczony Deployment, utwórz ponownie tylko ten jednorazowy PVC z `standard` i sprawdź stan Bound przed ponownym uruchomieniem oraz kontrolą relay. Nie przenoś usuwania na PVC z danymi.


      W zadaniu 045 dane są już w PVC `route-data` w stanie Bound. Skieruj wolumen readera na ten PVC i zamontuj go tylko do odczytu w `/data`; nie usuwaj ani nie twórz PVC ponownie. Porównaj UID z `original-pvc-uid`, poczekaj na rollout readera i sprawdź, czy `/data/route.txt` zawiera `north-45`.


      ## Wypróbuj


      Otwórz laboratorium **kubernetes** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy wymiana modułu piszącego pod powoduje usunięcie znacznika z jego PVC?


      ```bash

      cd ~/lab/examples/storage

      bash run.sh

      kubectl -n lab-storage get pvc,pod

      kubectl get storageclass

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Zamiennik pod odczytuje znacznik z tego samego roszczenia. Usunięcie przykładu namespace powoduje również usunięcie roszczenia; zrób to dopiero po obserwacji.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Un reclamo solicita almacenamiento; binding selecciona un volumen; El montaje pone sus bytes a disposición de un contenedor. Un reinicio de pod no es la misma operación que eliminar su PVC. El laboratorio utiliza almacenamiento de nodo local, por lo que no demuestra la replicación de discos en la nube.


      En el ejercicio 057, el PVC es explícitamente nuevo y vacío, y su storage class solicitada no se puede cambiar en el lugar. Detén el Deployment suministrado, recrea solo ese PVC desechable con `standard` y comprueba Bound antes de reiniciar y verificar relay. No extrapoles el borrado a un PVC con datos.


      En el ejercicio 045, los datos ya están en el PVC `route-data` en estado Bound. Apunta el volumen del reader a ese PVC y móntalo en `/data` en solo lectura; no borres ni recrees el PVC. Compara su UID con `original-pvc-uid`, espera el rollout del reader y verifica que `/data/route.txt` contiene `north-45`.


      ## Pruébalo


      Abra el laboratorio **kubernetes** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿Reemplazar el escritor pod elimina el marcador de su PVC?


      ```bash

      cd ~/lab/examples/storage

      bash run.sh

      kubectl -n lab-storage get pvc,pod

      kubectl get storageclass

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. El reemplazo pod lee el marcador del mismo reclamo. Al eliminar el ejemplo namespace también se elimina la reclamación; hazlo sólo después de la observación.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh`, luego `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Ein Anspruch verlangt eine Aufbewahrung; binding wählt ein Volume aus; Durch das Mounten werden seine Bytes einem Container zur Verfügung gestellt. Ein pod-Neustart ist nicht derselbe Vorgang wie das Löschen seines PVC. Das Lab verwendet lokalen Knotenspeicher und demonstriert daher keine Cloud-Festplattenreplikation.


      In Aufgabe 057 ist der PVC ausdrücklich neu und leer; seine angeforderte StorageClass lässt sich nicht direkt ändern. Stoppe das bereitgestellte Deployment, erstelle nur diesen einmaligen PVC mit `standard` neu und prüfe Bound vor dem Neustart und der Relay-Prüfung. Übertrage das Löschen nicht auf einen PVC mit Daten.


      In Aufgabe 045 liegen die Daten bereits im Bound-PVC `route-data`. Verweise mit dem Reader-Volume auf diesen PVC und mounte ihn unter `/data` schreibgeschützt; lösche oder erstelle den PVC nicht neu. Vergleiche seine UID mit `original-pvc-uid`, warte auf den Reader-Rollout und prüfe, dass `/data/route.txt` `north-45` enthält.


      ## Probieren Sie es aus


      Öffnen Sie das **kubernetes Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Entfernt das Ersetzen des Writers pod den Marker von seinem PVC?


      ```bash

      cd ~/lab/examples/storage

      bash run.sh

      kubectl -n lab-storage get pvc,pod

      kubectl get storageclass

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Der Ersatz pod liest den Marker aus demselben Anspruch. Durch das Löschen des Beispiels namespace wird auch der Anspruch gelöscht; Mach das erst nach der Beobachtung.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-storage
kubernetes-12:
  profile: kubernetes
  example: configuration
  source_hash: a3c5d69576d7f0ba30399e12b71aa425cb02e41fd2edadacd1f125e31471d408
  content:
    en: 'Changing a ConfigMap updates the API object. A running process keeps the environment it received at startup. A projected ConfigMap volume can update later; the application must still reread the file.


      In quest 030, after restoring the managed release marker, inspect the reader''s `RELEASE` environment and readiness check. Update it to `release-30` and verify the relay rollout; the file/state repair and running workload are separate stages.


      In quest 031, the Secret is named `station` and its key is `route`; the reader''s `secretKeyRef` must name both. Correct the reference in `reader.json` without copying the value into the workload or changing the Secret. After the rollout, verify the reference and that the reader can write `north` to `/tmp/route` without printing credentials.


      In quest 010, after the fleet stage, the `relay` process must receive `RELEASE=release-10`. A new process reads its environment at startup, so wait for the Deployment rollout and inspect the running process value as well as the ready status. A successful fleet delivery does not by itself update the Kubernetes reader.


      In quest 007, Deployment `relay` reads the `route` key from ConfigMap `dispatch` as `ROUTE`. Change that key to `north`, restart the Deployment so a new process receives the value, and wait for rollout. Verify `kubectl exec deployment/relay -- printenv ROUTE` prints `north`; the ConfigMap value alone does not prove that the running process received it.


      ## Try it


      Open the **kubernetes Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Will the process environment and mounted file change at the same instant?


      ```bash

      cd ~/lab/examples/configuration

      bash run.sh

      kubectl -n lab-configuration get configmap settings -o yaml

      kubectl -n lab-configuration get pod reader

      bash check.sh

      ```


      > [!question]- Expected result

      > No. MESSAGE stays first; the mounted file eventually becomes second. The check waits for that specific value with a finite timeout.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Изменение ConfigMap обновляет объект API. Работающий процесс сохраняет окружение, полученное при старте. Файл в проецируемом томе может обновиться позже, но приложение ещё должно его перечитать.


      В квесте 030 после восстановления управляемого маркера релиза изучите переменную `RELEASE` reader и проверку готовности. Установите `release-30` и проверьте rollout relay: исправление файла/state и работающий workload — отдельные этапы.


      В квесте 031 Secret называется `station`, а его ключ — `route`; в `secretKeyRef` reader нужно указать оба имени. Исправьте ссылку в `reader.json`, не копируя значение в workload и не меняя Secret. После rollout проверьте ссылку и то, что reader записывает `north` в `/tmp/route`, не выводя учетные данные.


      В квесте 010 после этапа fleet процесс `relay` должен получить `RELEASE=release-10`. Новый процесс читает окружение при запуске, поэтому дождитесь rollout Deployment и проверьте значение у работающего процесса и его готовность. Успешная доставка во fleet сама по себе не обновляет Kubernetes reader.


      В квесте 007 Deployment `relay` читает ключ `route` из ConfigMap `dispatch` как `ROUTE`. Измените ключ на `north`, перезапустите Deployment, чтобы новый процесс получил значение, и дождитесь rollout. Проверьте, что `kubectl exec deployment/relay -- printenv ROUTE` выводит `north`: значение ConfigMap само по себе не доказывает, что работающий процесс его получил.


      ## Попробуйте


      Откройте лабораторию **kubernetes**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Окружение процесса и файл в томе изменятся одновременно?


      ```bash

      cd ~/lab/examples/configuration

      bash run.sh

      kubectl -n lab-configuration get configmap settings -o yaml

      kubectl -n lab-configuration get pod reader

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. MESSAGE остаётся first, а файл со временем содержит second. Проверка ждёт конкретного значения с конечным таймаутом.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Zmiana ConfigMap aktualizuje obiekt API. Działający proces zachowuje środowisko, które otrzymał podczas uruchamiania. Przewidywany wolumin ConfigMap można zaktualizować później; aplikacja nadal musi ponownie odczytać plik.


      W zadaniu 030 po przywróceniu zarządzanego znacznika wydania sprawdź zmienną `RELEASE` readera i kontrolę gotowości. Ustaw `release-30` i sprawdź rollout relay; naprawa pliku/state i działający workload to osobne etapy.


      W zadaniu 031 Secret nazywa się `station`, a jego klucz to `route`; `secretKeyRef` readera musi wskazywać oba. Popraw odwołanie w `reader.json` bez kopiowania wartości do workloadu i zmieniania Secretu. Po rollout sprawdź odwołanie oraz zapis `north` do `/tmp/route` przez reader, nie wypisując danych uwierzytelniających.


      W zadaniu 010 po etapie fleet proces `relay` musi otrzymać `RELEASE=release-10`. Nowy proces odczytuje środowisko przy starcie, więc poczekaj na rollout Deploymentu i sprawdź wartość działającego procesu oraz jego gotowość. Udane dostarczenie do fleet samo nie aktualizuje czytnika Kubernetes.


      W zadaniu 007 Deployment `relay` odczytuje klucz `route` z ConfigMap `dispatch` jako `ROUTE`. Zmień ten klucz na `north`, uruchom Deployment ponownie, aby nowy proces otrzymał wartość, i poczekaj na rollout. Sprawdź, czy `kubectl exec deployment/relay -- printenv ROUTE` wypisuje `north`; sama wartość ConfigMap nie dowodzi, że działający proces ją otrzymał.


      ## Wypróbuj


      Otwórz laboratorium **kubernetes** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy środowisko procesu i zamontowany plik zmienią się w tym samym momencie?


      ```bash

      cd ~/lab/examples/configuration

      bash run.sh

      kubectl -n lab-configuration get configmap settings -o yaml

      kubectl -n lab-configuration get pod reader

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nr MESSAGE podpórka first; zamontowany plik ostatecznie stanie się second. Kontrola czeka na tę konkretną wartość z ograniczonym limitem czasu.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Cambiar un ConfigMap actualiza el objeto API. Un proceso en ejecución mantiene el entorno que recibió al inicio. Un volumen ConfigMap proyectado se puede actualizar más tarde; la aplicación aún debe volver a leer el archivo.


      En el ejercicio 030, tras recuperar el marcador gestionado de versión, inspecciona el entorno `RELEASE` del reader y la comprobación de disponibilidad. Establece `release-30` y verifica el rollout de relay; reparar archivo/state y el workload activo son etapas separadas.


      En el ejercicio 031, el Secret se llama `station` y su clave es `route`; el `secretKeyRef` del reader debe indicar ambos. Corrige la referencia en `reader.json` sin copiar el valor al workload ni cambiar el Secret. Tras el rollout, verifica la referencia y que el reader escribe `north` en `/tmp/route` sin imprimir credenciales.


      En el ejercicio 010, después de la etapa de fleet, el proceso `relay` debe recibir `RELEASE=release-10`. Un proceso nuevo lee su entorno al arrancar; espera el rollout del Deployment y comprueba el valor del proceso activo y su estado listo. Una entrega correcta a fleet no actualiza por sí sola el lector de Kubernetes.


      En el ejercicio 007, el Deployment `relay` lee la clave `route` del ConfigMap `dispatch` como `ROUTE`. Cambia la clave a `north`, reinicia el Deployment para que el nuevo proceso reciba el valor y espera el rollout. Comprueba que `kubectl exec deployment/relay -- printenv ROUTE` muestra `north`; el valor del ConfigMap por sí solo no demuestra que el proceso en ejecución lo haya recibido.


      ## Pruébalo


      Abra el **kubernetes Lab** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿El entorno del proceso y el archivo montado cambiarán al mismo tiempo?


      ```bash

      cd ~/lab/examples/configuration

      bash run.sh

      kubectl -n lab-configuration get configmap settings -o yaml

      kubectl -n lab-configuration get pod reader

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. MESSAGE permanece primero; el archivo montado finalmente se convierte en second. La verificación espera ese valor específico con un tiempo de espera finito.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh`, luego `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Durch das Ändern eines ConfigMap wird das API-Objekt aktualisiert. Ein laufender Prozess behält die Umgebung, die er beim Start erhalten hat. Ein geplantes ConfigMap-Volume kann später aktualisiert werden; Die Anwendung muss die Datei trotzdem erneut lesen.


      Prüfe in Aufgabe 030 nach Wiederherstellung des verwalteten Release-Markers die Umgebung `RELEASE` des Readers und seine Readiness-Prüfung. Setze `release-30` und prüfe den Relay-Rollout; Datei/State-Reparatur und laufender Workload sind getrennte Phasen.


      In Aufgabe 031 heißt das Secret `station`, sein Schlüssel `route`; die `secretKeyRef` des Readers muss beide angeben. Korrigiere die Referenz in `reader.json`, ohne den Wert in den Workload zu kopieren oder das Secret zu ändern. Prüfe nach dem Rollout die Referenz und dass der Reader `north` nach `/tmp/route` schreibt, ohne Zugangsdaten auszugeben.


      Nach der Fleet-Phase in Aufgabe 010 muss der Prozess `relay` `RELEASE=release-10` erhalten. Ein neuer Prozess liest seine Umgebung beim Start; warte daher auf den Deployment-Rollout und prüfe den Wert des laufenden Prozesses sowie dessen Bereitschaft. Eine erfolgreiche Fleet-Auslieferung aktualisiert den Kubernetes-Reader nicht von selbst.


      In Aufgabe 007 liest das Deployment `relay` den Schlüssel `route` der ConfigMap `dispatch` als `ROUTE`. Setze den Schlüssel auf `north`, starte das Deployment neu, damit der neue Prozess den Wert erhält, und warte auf den Rollout. Prüfe, dass `kubectl exec deployment/relay -- printenv ROUTE` `north` ausgibt; der ConfigMap-Wert allein beweist nicht, dass der laufende Prozess ihn erhalten hat.


      ## Probieren Sie es aus


      Öffnen Sie das **kubernetes Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Werden sich die Prozessumgebung und die bereitgestellte Datei gleichzeitig ändern?


      ```bash

      cd ~/lab/examples/configuration

      bash run.sh

      kubectl -n lab-configuration get configmap settings -o yaml

      kubectl -n lab-configuration get pod reader

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. MESSAGE bleibt an erster Stelle; Die gemountete Datei wird schließlich zu second. Die Prüfung wartet mit einer endlichen Zeitüberschreitung auf diesen bestimmten Wert.


      ## Beobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-configuration
kubernetes-17:
  profile: kubernetes
  example: disruption
  source_hash: d27d6b8dc7300a4f32d12b07b1045b07f10ade85d95df944e0abf45e7f95473c
  content:
    en: 'A PodDisruptionBudget constrains voluntary eviction through the eviction API. It does not create replicas and cannot prevent every failure. Prepare ready spare capacity before draining a node.


      In quest 077, set the PDB minimum to one while keeping two replicas and its selector. Use the supplied Eviction API test, not direct deletion; verify that one original Pod is replaced, the server records the eviction and the healthy minimum and two replicas return. A PDB does not protect against every kind of disruption.


      ## Try it


      Open the **kubernetes Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** With two ready replicas and minAvailable=2, can the eviction API remove one?


      ```bash

      cd ~/lab/examples/disruption

      bash run.sh

      kubectl -n lab-disruption get deployment,pdb

      kubectl -n lab-disruption describe pdb web

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The API denies eviction. Changing minAvailable to 1 creates a disruption allowance and the same request succeeds.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'PodDisruptionBudget ограничивает добровольное выселение через eviction API. Он не создаёт реплики и не предотвращает любой отказ. Перед drain нужна готовая запасная ёмкость.


      В квесте 077 задайте минимум PDB равным одному, сохранив две реплики и selector. Используйте выданную проверку Eviction API, а не прямое удаление; проверьте замену одного исходного Pod, серверное подтверждение eviction, восстановление минимума здоровых Pod и двух реплик. PDB не защищает от всех видов прерываний.


      ## Попробуйте


      Откройте лабораторию **kubernetes**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** При двух готовых репликах и minAvailable=2 eviction API разрешит удалить одну?


      ```bash

      cd ~/lab/examples/disruption

      bash run.sh

      kubectl -n lab-disruption get deployment,pdb

      kubectl -n lab-disruption describe pdb web

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. API отказывает. После изменения minAvailable на 1 появляется разрешённое прерывание, и запрос проходит.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'PodDisruptionBudget ogranicza dobrowolną eksmisję poprzez eviction API. Nie tworzy replik i nie jest w stanie zapobiec każdej awarii. Przygotuj wolną moc obliczeniową przed opróżnieniem węzła.


      W zadaniu 077 ustaw minimum PDB na jeden, zachowując dwie repliki i selector. Użyj dostarczonego testu Eviction API zamiast bezpośredniego usunięcia; sprawdź zastąpienie jednego pierwotnego Poda, serwerowy dowód eviction oraz powrót zdrowego minimum i dwóch replik. PDB nie chroni przed każdym rodzajem zakłóceń.


      ## Wypróbuj


      Otwórz laboratorium **kubernetes** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy eviction API z dwiema gotowymi replikami i minAvailable=2 może usunąć jedną?


      ```bash

      cd ~/lab/examples/disruption

      bash run.sh

      kubectl -n lab-disruption get deployment,pdb

      kubectl -n lab-disruption describe pdb web

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. API zaprzecza eksmisji. Zmiana minAvailable na 1 powoduje utworzenie limitu zakłóceń i to samo żądanie zostaje zrealizowane.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Un PodDisruptionBudget restringe el eviction voluntario a través del eviction API. No crea réplicas y no puede evitar todos los fallos. Prepare la capacidad sobrante lista antes de drenar un nodo.


      En el ejercicio 077, fija el mínimo del PDB en uno conservando dos réplicas y su selector. Usa la prueba Eviction API suministrada, no el borrado directo; verifica que se reemplace un Pod original, que el servidor registre la eviction y que se recuperen el mínimo sano y las dos réplicas. Un PDB no protege ante toda interrupción.


      ## Pruébalo


      Abra el **kubernetes Lab** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** Con dos réplicas listas y minAvailable=2, ¿puede el eviction API eliminar una?


      ```bash

      cd ~/lab/examples/disruption

      bash run.sh

      kubectl -n lab-disruption get deployment,pdb

      kubectl -n lab-disruption describe pdb web

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. El API desmiente eviction. Cambiar minAvailable a 1 crea una asignación de interrupción y la misma solicitud se realiza correctamente.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh` y luego con `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Ein PodDisruptionBudget schränkt den freiwilligen eviction durch den eviction API ein. Es erstellt keine Replikate und kann nicht jeden Fehler verhindern. Bereiten Sie freie Kapazität vor, bevor Sie einen Knoten entleeren.


      Setze in Aufgabe 077 das PDB-Minimum auf eins und behalte zwei Repliken und den Selector. Nutze den bereitgestellten Eviction-API-Test statt direkter Löschung; prüfe den Ersatz eines ursprünglichen Pods, den serverseitigen Eviction-Nachweis sowie die Wiederherstellung des gesunden Minimums und zweier Repliken. Ein PDB schützt nicht vor jeder Störung.


      ## Probieren Sie es aus


      Öffnen Sie das **kubernetes Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und prüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Kann der eviction API mit zwei fertigen Replikaten und minAvailable=2 eines entfernen?


      ```bash

      cd ~/lab/examples/disruption

      bash run.sh

      kubectl -n lab-disruption get deployment,pdb

      kubectl -n lab-disruption describe pdb web

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Der API verweigert eviction. Durch Ändern von minAvailable auf 1 wird eine Unterbrechungszulage erstellt und dieselbe Anforderung ist erfolgreich.


      ## Beobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann mit `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-disruption
kubernetes-20:
  profile: kubernetes
  example: troubleshooting
  source_hash: a9911b0d30fcb13a83c52c4c520c00aa95768bb144d28fba43f444341043508c
  content:
    en: 'Start with the symptom and find the failing layer: admission, scheduling, image preparation, process or traffic. Read status, events and the relevant container logs before editing the workload.


      In quest 001, the `relay` Deployment cannot start container `worker` because its image is missing. Inspect Pod events and compare `deployment.json` with the supplied CI artifact `release-manifest.json`. Set the worker image to the artifact''s complete `image` value, retain `imagePullPolicy: Never`, and wait for the `relay` rollout. The image is already loaded in this offline bay; do not pull from an external registry.


      In quest 011, `clock.json` needs a command that records a UTC timestamp in `/tmp/clock`, writes `POD_NAME` to `/tmp/identity` and stays in the foreground. Set the environment value from `fieldRef` with `fieldPath: metadata.name`; this is the Pod name, not the Deployment name. After rollout, compare `/tmp/identity` with the actual Pod name and inspect `/tmp/clock` for UTC form such as `2026-01-02T03:04:05Z`.


      In quest 014, read current or `--previous` logs from the `route-worker` Pod and save the exact line `route must equal north` in `diagnosis.txt`. The process reads ConfigMap `route`, key `name`, through `ROUTE`. Set that key to `north`, restart `deployment/route-worker`, then verify rollout and `printenv ROUTE`. Changing the ConfigMap alone does not update the environment of a running process.


      ## Try it


      Open the **kubernetes Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Do CrashLoopBackOff and an unavailable image need the same repair?


      ```bash

      cd ~/lab/examples/troubleshooting

      bash run.sh

      kubectl -n lab-troubleshooting get pods

      kubectl -n lab-troubleshooting describe pod missing

      bash check.sh

      ```


      > [!question]- Expected result

      > No. One container ran and exited with code 3; the other never started because its image is absent. Previous logs explain only the first failure.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Начните с симптома и найдите слой отказа: допуск, размещение, подготовка образа, процесс или трафик. Перед изменением нагрузки прочитайте status, events и логи нужного контейнера.


      В квесте 001 Deployment `relay` не может запустить контейнер `worker` из-за отсутствующего образа. Изучите события Pod и сравните `deployment.json` с предоставленным артефактом CI `release-manifest.json`. Установите образ worker в полное значение `image` из артефакта, сохраните `imagePullPolicy: Never` и дождитесь rollout `relay`. Образ уже загружен в автономной лаборатории; не скачивайте его из внешнего реестра.


      В квесте 011 для `clock.json` нужна команда, которая записывает время UTC в `/tmp/clock`, сохраняет `POD_NAME` в `/tmp/identity` и остается работать в foreground. Задайте значение окружения через `fieldRef` с `fieldPath: metadata.name`: это имя Pod, а не Deployment. После rollout сравните `/tmp/identity` с реальным именем Pod и проверьте формат UTC в `/tmp/clock`, например `2026-01-02T03:04:05Z`.


      В квесте 014 прочитайте текущие или `--previous` логи Pod `route-worker` и сохраните точную строку `route must equal north` в `diagnosis.txt`. Процесс читает ConfigMap `route`, ключ `name`, через `ROUTE`. Установите ключ в `north`, перезапустите `deployment/route-worker`, затем проверьте rollout и `printenv ROUTE`. Одно изменение ConfigMap не обновляет окружение работающего процесса.


      ## Попробуйте


      Откройте лабораторию **kubernetes**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** CrashLoopBackOff и недоступный образ требуют одного исправления?


      ```bash

      cd ~/lab/examples/troubleshooting

      bash run.sh

      kubectl -n lab-troubleshooting get pods

      kubectl -n lab-troubleshooting describe pod missing

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Один контейнер запустился и вышел с кодом 3, второй не стартовал из-за отсутствующего образа. Previous logs объясняют только первый отказ.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Zacznij od symptomu i znajdź wadliwą warstwę: przyjęcie, planowanie, przygotowanie obrazu, proces lub ruch. Przed edycją obciążenia przeczytaj status, events i odpowiednie dzienniki kontenerów.


      W zadaniu 001 Deployment `relay` nie może uruchomić kontenera `worker`, ponieważ brakuje obrazu. Sprawdź zdarzenia Poda i porównaj `deployment.json` z dostarczonym artefaktem CI `release-manifest.json`. Ustaw obraz worker na pełną wartość `image` z artefaktu, zachowaj `imagePullPolicy: Never` i poczekaj na rollout `relay`. Obraz jest już załadowany w środowisku offline; nie pobieraj go z zewnętrznego rejestru.


      W zadaniu 011 `clock.json` potrzebuje polecenia zapisującego czas UTC do `/tmp/clock`, zapisującego `POD_NAME` do `/tmp/identity` i działającego na pierwszym planie. Ustaw wartość środowiska przez `fieldRef` z `fieldPath: metadata.name`: jest to nazwa Poda, a nie Deploymentu. Po rollout porównaj `/tmp/identity` z rzeczywistą nazwą Poda i sprawdź format UTC w `/tmp/clock`, na przykład `2026-01-02T03:04:05Z`.


      W zadaniu 014 odczytaj bieżące lub `--previous` logi Poda `route-worker` i zapisz dokładny wiersz `route must equal north` w `diagnosis.txt`. Proces odczytuje ConfigMap `route`, klucz `name`, przez `ROUTE`. Ustaw klucz na `north`, uruchom ponownie `deployment/route-worker`, a następnie sprawdź rollout i `printenv ROUTE`. Sama zmiana ConfigMap nie aktualizuje środowiska działającego procesu.


      ## Wypróbuj


      Otwórz laboratorium **kubernetes** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy CrashLoopBackOff i niedostępny obraz wymagają tej samej naprawy?


      ```bash

      cd ~/lab/examples/troubleshooting

      bash run.sh

      kubectl -n lab-troubleshooting get pods

      kubectl -n lab-troubleshooting describe pod missing

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Jeden kontener odjechał i opuścił go z kodem 3; drugi nigdy się nie zaczął, ponieważ nie ma jego obrazu. Previous logs wyjaśnia tylko pierwszą awarię.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Comience con el síntoma y encuentre la capa que falla: admisión, programación, preparación de imágenes, proceso o tráfico. Lea status, events y el contenedor correspondiente logs antes de editar la carga de trabajo.


      En el ejercicio 001, el Deployment `relay` no puede iniciar el contenedor `worker` porque falta su imagen. Inspecciona los eventos del Pod y compara `deployment.json` con el artefacto de CI suministrado `release-manifest.json`. Configura la imagen de worker con el valor completo `image` del artefacto, conserva `imagePullPolicy: Never` y espera el rollout de `relay`. La imagen ya está cargada en este entorno sin conexión; no la descargues de un registro externo.


      En el ejercicio 011, `clock.json` necesita un comando que escriba una fecha UTC en `/tmp/clock`, guarde `POD_NAME` en `/tmp/identity` y siga ejecutándose en primer plano. Obtén la variable de entorno mediante `fieldRef` con `fieldPath: metadata.name`: es el nombre del Pod, no del Deployment. Tras el rollout, compara `/tmp/identity` con el nombre real del Pod y comprueba el formato UTC en `/tmp/clock`, por ejemplo `2026-01-02T03:04:05Z`.


      En el ejercicio 014, lee los logs actuales o `--previous` del Pod `route-worker` y guarda la línea exacta `route must equal north` en `diagnosis.txt`. El proceso lee la clave `name` del ConfigMap `route` mediante `ROUTE`. Cambia esa clave a `north`, reinicia `deployment/route-worker` y comprueba el rollout y `printenv ROUTE`. Cambiar solo el ConfigMap no actualiza el entorno de un proceso en ejecución.


      ## Pruébalo


      Abra el **kubernetes Lab** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿CrashLoopBackOff y una imagen no disponible necesitan la misma reparación?


      ```bash

      cd ~/lab/examples/troubleshooting

      bash run.sh

      kubectl -n lab-troubleshooting get pods

      kubectl -n lab-troubleshooting describe pod missing

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. Un contenedor funcionó y salió con el código 3; el otro nunca empezó porque su imagen está ausente. Previous logs explica sólo el primer fallo.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh`, luego `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Beginnen Sie mit dem Symptom und finden Sie die fehlerhafte Ebene: Zulassung, Planung, Bildvorbereitung, Prozess oder Verkehr. Lesen Sie status, events und den entsprechenden Container logs, bevor Sie die Arbeitslast bearbeiten.


      In Aufgabe 001 kann das Deployment `relay` den Container `worker` nicht starten, weil dessen Image fehlt. Prüfe die Pod-Ereignisse und vergleiche `deployment.json` mit dem bereitgestellten CI-Artefakt `release-manifest.json`. Setze das Worker-Image auf den vollständigen `image`-Wert aus dem Artefakt, behalte `imagePullPolicy: Never` bei und warte auf den Rollout von `relay`. Das Image ist in dieser Offline-Umgebung bereits geladen; lade es nicht aus einer externen Registry.


      In Aufgabe 011 benötigt `clock.json` einen Befehl, der einen UTC-Zeitstempel nach `/tmp/clock` und `POD_NAME` nach `/tmp/identity` schreibt und im Vordergrund weiterläuft. Setze den Umgebungswert über `fieldRef` mit `fieldPath: metadata.name`: Das ist der Pod-Name, nicht der Deployment-Name. Vergleiche nach dem Rollout `/tmp/identity` mit dem tatsächlichen Pod-Namen und prüfe das UTC-Format in `/tmp/clock`, zum Beispiel `2026-01-02T03:04:05Z`.


      Lies in Aufgabe 014 die aktuellen oder `--previous`-Logs des Pods `route-worker` und speichere die genaue Zeile `route must equal north` in `diagnosis.txt`. Der Prozess liest den Schlüssel `name` der ConfigMap `route` über `ROUTE`. Setze den Schlüssel auf `north`, starte `deployment/route-worker` neu und prüfe Rollout und `printenv ROUTE`. Die Änderung der ConfigMap allein aktualisiert die Umgebung eines laufenden Prozesses nicht.


      ## Probieren Sie es aus


      Öffnen Sie das **kubernetes Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und prüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Benötigen CrashLoopBackOff und ein nicht verfügbares Image dieselbe Reparatur?


      ```bash

      cd ~/lab/examples/troubleshooting

      bash run.sh

      kubectl -n lab-troubleshooting get pods

      kubectl -n lab-troubleshooting describe pod missing

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Ein Container wurde ausgeführt und mit Code 3 beendet. der andere hat nie begonnen, weil sein Bild fehlt. Previous logs erklären nur den ersten Fehler.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann mit `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-troubleshooting
ansible-2:
  profile: ansible
  example: inventory
  source_hash: e6be08a790cfdd7058976dbab2b1752e740a6cc1f6ae6f1f4d53b1927384f53b
  content:
    en: 'Inventory names identify managed hosts; connection variables tell Ansible how to reach them. A group selects a set, and --limit narrows that set. The controller and SSH targets are separate processes.


      In quest 020, the second stage delivers one managed release artifact to the supplied `fleet`. Inspect the inventory and the play target to establish which three hosts are selected, then check each host''s delivered file and live banner. A play that selects no hosts cannot demonstrate delivery.


      In quest 002, inspect `inventory.ini` and `ansible-inventory --graph`: the three target names belong to `fleet`. In `rollout.yml`, change the play target from `relays` to `fleet`; the supplied copy task writes `north-ready` to `/srv/site/message` with mode `0644`. Run the playbook and inspect the file content and mode on each of the three managed hosts; a successful run against zero hosts does not deliver the file.


      ## Try it


      Open the **ansible Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Does --limit app2 run the play on all three fleet hosts?


      ```bash

      cd ~/lab/examples/inventory

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Expected result

      > No. Only app2 appears in the second recap.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Имена inventory обозначают управляемые узлы, переменные подключения задают способ доступа. Группа выбирает набор, --limit его сужает. Контроллер и SSH-хосты — отдельные процессы.


      В квесте 020 второй этап доставляет один управляемый артефакт релиза в предоставленный `fleet`. Изучите inventory и цель play, чтобы определить три выбранные машины, затем проверьте доставленный файл и работающий баннер на каждой. Play без выбранных машин не подтверждает доставку.


      В квесте 002 изучите `inventory.ini` и `ansible-inventory --graph`: имена трех целевых машин входят в `fleet`. В `rollout.yml` измените цель play с `relays` на `fleet`; готовая задача copy записывает `north-ready` в `/srv/site/message` с режимом `0644`. Запустите playbook и проверьте содержимое и режим файла на каждой из трех машин: успешный запуск с нулем выбранных машин не доставляет файл.


      ## Попробуйте


      Откройте лабораторию **ansible**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Запустит ли --limit app2 play на всех трёх узлах fleet?


      ```bash

      cd ~/lab/examples/inventory

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Во втором recap остаётся только app2.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Nazwy zapasów identyfikują zarządzane hosty; zmienne połączenia mówią Ansible, jak się do nich dostać. Grupa wybiera zestaw, a --limit zawęża ten zestaw. Kontroler i elementy docelowe SSH to oddzielne procesy.


      W zadaniu 020 drugi etap dostarcza jeden zarządzany artefakt release do dostarczonego `fleet`. Sprawdź inventory i cel play, aby ustalić trzy wybrane hosty, a następnie sprawdź dostarczony plik i działający baner na każdym z nich. Play bez wybranych hostów nie potwierdza dostarczenia.


      W zadaniu 002 sprawdź `inventory.ini` i `ansible-inventory --graph`: nazwy trzech hostów należą do `fleet`. W `rollout.yml` zmień cel play z `relays` na `fleet`; dostarczone zadanie copy zapisuje `north-ready` do `/srv/site/message` z trybem `0644`. Uruchom playbook i sprawdź zawartość oraz tryb pliku na każdym z trzech zarządzanych hostów: pomyślny przebieg bez wybranych hostów nie dostarcza pliku.


      ## Wypróbuj


      Otwórz laboratorium **ansible** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy --limit app2 uruchamia grę na wszystkich trzech hostach fleet?


      ```bash

      cd ~/lab/examples/inventory

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. W drugim recap pojawia się tylko app2.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Los nombres de los inventarios identifican los hosts administrados; Las variables de conexión le indican a Ansible cómo llegar a ellas. Un grupo selecciona un conjunto y --limit limita ese conjunto. El controlador y los objetivos SSH son procesos separados.


      En el ejercicio 020, la segunda etapa entrega un artefacto de release gestionado al `fleet` suministrado. Inspecciona el inventory y el destino del play para identificar los tres hosts seleccionados; después comprueba el archivo entregado y el banner activo de cada uno. Un play que no selecciona hosts no demuestra la entrega.


      En el ejercicio 002, inspecciona `inventory.ini` y `ansible-inventory --graph`: los tres hosts pertenecen a `fleet`. En `rollout.yml`, cambia el destino del play de `relays` a `fleet`; la tarea copy suministrada escribe `north-ready` en `/srv/site/message` con modo `0644`. Ejecuta el playbook y comprueba contenido y modo en cada uno de los tres hosts: una ejecución exitosa con cero hosts seleccionados no entrega el archivo.


      ## Pruébalo


      Abra el laboratorio **ansible** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿--limit app2 ejecuta play en los tres hosts fleet?


      ```bash

      cd ~/lab/examples/inventory

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. En el segundo recap solo aparece app2.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh`, luego `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Inventarnamen identifizieren verwaltete Hosts; Verbindungsvariablen teilen Ansible mit, wie sie zu erreichen sind. Eine Gruppe wählt einen Satz aus und --limit schränkt diesen Satz ein. Der Controller und die SSH-Ziele sind separate Prozesse.


      In Aufgabe 020 liefert die zweite Phase ein verwaltetes Release-Artefakt an die bereitgestellte `fleet`. Prüfe Inventory und Play-Ziel, um die drei ausgewählten Hosts zu bestimmen, und kontrolliere anschließend auf jedem Host die ausgelieferte Datei und das laufende Banner. Ein Play ohne ausgewählte Hosts belegt keine Auslieferung.


      Prüfe in Aufgabe 002 `inventory.ini` und `ansible-inventory --graph`: Die drei Zielhosts gehören zu `fleet`. Ändere in `rollout.yml` das Ziel des Plays von `relays` auf `fleet`; die vorhandene Copy-Aufgabe schreibt `north-ready` mit Modus `0644` nach `/srv/site/message`. Führe das Playbook aus und prüfe Inhalt und Modus der Datei auf allen drei verwalteten Hosts: Ein erfolgreicher Lauf mit null ausgewählten Hosts liefert die Datei nicht aus.


      ## Probieren Sie es aus


      Öffnen Sie das **ansible Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und prüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Führt --limit app2 den play auf allen drei fleet-Hosts aus?


      ```bash

      cd ~/lab/examples/inventory

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Im zweiten recap erscheint nur app2.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-inventory
  additional:
    en: AWS inventory is an additional practicum. This Lab verifies local inventory and SSH targets; no AWS account is connected.
    ru: AWS inventory — дополнительный практикум. Этот Lab проверяет локальный inventory и SSH-хосты; AWS не подключён.
    pl: Inventory AWS to dodatkowe ćwiczenie praktyczne. To laboratorium weryfikuje lokalne inventory i hosty docelowe SSH; żadne konto AWS nie jest podłączone.
    es: AWS inventory es una práctica adicional. Este Lab verifica los objetivos locales inventory y SSH; no hay ninguna cuenta AWS conectada.
    de: AWS inventory ist ein Zusatzpraktikum. Dieser Lab überprüft lokale inventory- und SSH-Ziele; Es ist kein AWS-Konto verbunden.
ansible-4:
  profile: ansible
  example: idempotency
  source_hash: ec5da4b6414124b3fccf6157e76d18594d44af5282eecdac4e76f7141c361f70
  content:
    en: 'An idempotent task converges on a declared state. Running it twice should leave the second recap unchanged. changed_when only controls reporting; it does not undo a command’s side effects.


      In quest 074, check mode predicts changes but skipped commands and handlers do not prove a reload. Keep the read-only PID probe, then run the real play and verify files, modes and HTTP on each host.


      In quest 079, converge the supplied directory, banner and route with unconditional file/copy tasks and the reload handler. Verify content, mode and live response on all hosts; the second real run must report no changes, unreachable hosts or failures.


      In quest 025, a read-only command reports a change on every run. Mark that probe with `changed_when: false`; this changes reporting, not the command''s behavior. Deliver `north-ready` with mode `0644`, then run the playbook again and verify each host reports `changed=0` and `failed=0` while its file remains correct.


      In quest 015, `routes.yml` supplies `north`, `south` and `east`. The play targets `fleet`, and `loop: ''{{ routes }}''` passes each route name as `item` to `ansible.builtin.file`. Set `state: directory`, not `state: file`, and keep `mode: ''0750''` so `/srv/routes/{{ item }}` is a directory with the required permissions. Run the playbook, then inspect all three paths on each of the three targets: each must be a directory and `stat -c %a` must report `750`.


      In quest 005, `rollout.yml` copies `north-ready` to `/srv/site/message` but sets mode `0600`. Set the copy task mode to `0644`, run the playbook and inspect both content and mode on all three fleet hosts. Repeating the converged play should not require another change.


      ## Try it


      Open the **ansible Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Will copying identical content count as another change?


      ```bash

      cd ~/lab/examples/idempotency

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The second run and check mode report changed=0.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Идемпотентная задача приводит систему к заданному состоянию. Повторный запуск должен показать отсутствие изменений. changed_when управляет отчётом, но не отменяет побочные эффекты команды.


      В квесте 074 check mode предсказывает изменения, но пропущенные команды и handlers не доказывают перезагрузку. Сохраните только читающую проверку PID, затем выполните настоящий play и проверьте файлы, режимы и HTTP на каждой машине.


      В квесте 079 приведите выданные каталог, баннер и маршрут к нужному состоянию безусловными задачами file/copy и handler перезагрузки. Проверьте содержимое, режим и живой ответ всех машин; второй настоящий запуск должен показать отсутствие изменений, недоступных машин и ошибок.


      В квесте 025 команда только для чтения сообщает об изменении при каждом запуске. Укажите для этой проверки `changed_when: false`: это меняет отчет, а не поведение команды. Доставьте `north-ready` с режимом `0644`, затем повторно запустите playbook и проверьте, что каждая машина сообщает `changed=0` и `failed=0`, а ее файл остается правильным.


      В квесте 015 файл `routes.yml` задает `north`, `south` и `east`. Play выбирает `fleet`, а `loop: ''{{ routes }}''` передает каждое имя маршрута в `ansible.builtin.file` как `item`. Укажите `state: directory` вместо `state: file` и сохраните `mode: ''0750''`, чтобы `/srv/routes/{{ item }}` был каталогом с нужными правами. Выполните playbook и проверьте все три пути на каждой из трех машин: каждый должен быть каталогом, а `stat -c %a` должен показать `750`.


      В квесте 005 `rollout.yml` копирует `north-ready` в `/srv/site/message`, но задает режим `0600`. Установите в задаче copy режим `0644`, запустите playbook и проверьте содержимое и режим на всех трех машинах fleet. Повторный запуск после достижения нужного состояния не должен требовать новых изменений.


      ## Попробуйте


      Откройте лабораторию **ansible**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Копирование идентичного содержимого снова будет изменением?


      ```bash

      cd ~/lab/examples/idempotency

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Повторный запуск и check mode показывают changed=0.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Zadanie idempotentne zbiega się z zadeklarowanym stanem. Uruchomienie go dwukrotnie powinno pozostawić drugie podsumowanie bez zmian. changed_when kontroluje tylko raportowanie; nie cofa skutków ubocznych polecenia.


      W zadaniu 074 check mode przewiduje zmiany, ale pominięte polecenia i handlery nie dowodzą przeładowania. Zachowaj tylko czytającą próbę PID, następnie uruchom prawdziwy play i sprawdź pliki, tryby i HTTP na każdym hoście.


      W zadaniu 079 doprowadź dostarczony katalog, baner i trasę do wymaganego stanu bezwarunkowymi zadaniami file/copy oraz handlerem przeładowania. Sprawdź treść, tryb i rzeczywistą odpowiedź wszystkich hostów; drugi prawdziwy przebieg ma wykazać brak zmian, nieosiągalnych hostów i błędów.


      W zadaniu 025 polecenie tylko do odczytu zgłasza zmianę przy każdym uruchomieniu. Ustaw dla tej próby `changed_when: false`; zmienia to raportowanie, a nie działanie polecenia. Dostarcz `north-ready` z trybem `0644`, uruchom playbook ponownie i sprawdź, czy każdy host zgłasza `changed=0` i `failed=0`, a jego plik pozostaje poprawny.


      W zadaniu 015 plik `routes.yml` podaje `north`, `south` i `east`. Play wybiera `fleet`, a `loop: ''{{ routes }}''` przekazuje każdą nazwę trasy do `ansible.builtin.file` jako `item`. Ustaw `state: directory` zamiast `state: file` i zachowaj `mode: ''0750''`, aby `/srv/routes/{{ item }}` był katalogiem z wymaganymi uprawnieniami. Uruchom playbook, a następnie sprawdź wszystkie trzy ścieżki na każdym z trzech hostów: każda musi być katalogiem, a `stat -c %a` ma pokazać `750`.


      W zadaniu 005 `rollout.yml` kopiuje `north-ready` do `/srv/site/message`, ale ustawia tryb `0600`. Ustaw tryb zadania copy na `0644`, uruchom playbook i sprawdź zawartość oraz tryb na wszystkich trzech hostach fleet. Ponowny przebieg po osiągnięciu żądanego stanu nie powinien wymagać kolejnej zmiany.


      ## Wypróbuj


      Otwórz laboratorium **ansible** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy kopiowanie identycznej treści będzie się liczyło jako kolejna zmiana?


      ```bash

      cd ~/lab/examples/idempotency

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Drugi przebieg i raport check mode changed=0.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Una tarea idempotente converge en un estado declarado. Ejecutarlo dos veces debería dejar el segundo resumen sin cambios. changed_when solo controla los informes; no deshace los efectos secundarios de un comando.


      En el ejercicio 074, check mode predice cambios, pero los comandos y handlers omitidos no demuestran una recarga. Conserva la comprobación de PID de solo lectura, ejecuta el play real y verifica archivos, modos y HTTP en cada host.


      En el ejercicio 079, lleva el directorio, banner y ruta suministrados al estado requerido con tareas file/copy incondicionales y el handler de recarga. Verifica contenido, modo y respuesta real en todos los hosts; la segunda ejecución real debe informar cero cambios, hosts inaccesibles y fallos.


      En el ejercicio 025, un comando de solo lectura informa un cambio en cada ejecución. Marca esa comprobación con `changed_when: false`; esto cambia el informe, no el comportamiento del comando. Entrega `north-ready` con modo `0644`, ejecuta de nuevo el playbook y verifica que cada host informe `changed=0` y `failed=0` y conserve el archivo correcto.


      En el ejercicio 015, `routes.yml` proporciona `north`, `south` y `east`. El play selecciona `fleet`, y `loop: ''{{ routes }}''` pasa cada nombre de ruta como `item` a `ansible.builtin.file`. Establece `state: directory`, no `state: file`, y conserva `mode: ''0750''` para que `/srv/routes/{{ item }}` sea un directorio con los permisos requeridos. Ejecuta el playbook e inspecciona las tres rutas en cada uno de los tres hosts: cada una debe ser un directorio y `stat -c %a` debe mostrar `750`.


      En el ejercicio 005, `rollout.yml` copia `north-ready` a `/srv/site/message`, pero establece el modo `0600`. Cambia el modo de la tarea copy a `0644`, ejecuta el playbook y comprueba contenido y modo en los tres hosts de fleet. Repetir el play cuando ya se alcanzó el estado deseado no debería requerir otro cambio.


      ## Pruébalo


      Abra el laboratorio **ansible** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿Copiar contenido idéntico contará como otro cambio?


      ```bash

      cd ~/lab/examples/idempotency

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. El segundo informe del modo de ejecución y verificación changed=0.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh`, luego `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Eine idempotente Aufgabe konvergiert in einem deklarierten Zustand. Wenn Sie es zweimal ausführen, sollte die zweite Zusammenfassung unverändert bleiben. changed_when steuert nur die Berichterstellung; Die Nebenwirkungen eines Befehls werden dadurch nicht rückgängig gemacht.


      In Aufgabe 074 sagt der Check-Modus Änderungen voraus, doch übersprungene Befehle und Handler beweisen kein Neuladen. Behalte die nur lesende PID-Prüfung, führe das echte Play aus und prüfe Dateien, Modi und HTTP auf jedem Host.


      Bringe in Aufgabe 079 das vorgegebene Verzeichnis, Banner und die Route mit unbedingten File/Copy-Aufgaben und dem Reload-Handler in den gewünschten Zustand. Prüfe Inhalt, Modus und tatsächliche Antwort aller Hosts; der zweite echte Lauf muss null Änderungen, unerreichbare Hosts und Fehler melden.


      In Aufgabe 025 meldet ein nur lesender Befehl bei jedem Lauf eine Änderung. Setze für diese Prüfung `changed_when: false`; das ändert die Meldung, nicht das Verhalten des Befehls. Liefere `north-ready` mit Modus `0644`, führe das Playbook erneut aus und prüfe, dass jeder Host `changed=0` und `failed=0` meldet und seine Datei korrekt bleibt.


      In Aufgabe 015 enthält `routes.yml` die Werte `north`, `south` und `east`. Das Play wählt `fleet`, und `loop: ''{{ routes }}''` übergibt jeden Routennamen als `item` an `ansible.builtin.file`. Setze `state: directory` statt `state: file` und behalte `mode: ''0750''` bei, damit `/srv/routes/{{ item }}` ein Verzeichnis mit den geforderten Rechten ist. Führe das Playbook aus und prüfe alle drei Pfade auf jedem der drei Hosts: Jeder muss ein Verzeichnis sein und `stat -c %a` muss `750` anzeigen.


      In Aufgabe 005 kopiert `rollout.yml` `north-ready` nach `/srv/site/message`, setzt aber Modus `0600`. Setze den Modus der Copy-Aufgabe auf `0644`, führe das Playbook aus und prüfe Inhalt und Modus auf allen drei Fleet-Hosts. Ein erneuter Lauf im bereits erreichten Zustand sollte keine weitere Änderung erfordern.


      ## Probieren Sie es aus


      Öffnen Sie das **ansible Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und prüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Zählt das Kopieren identischer Inhalte als weitere Änderung?


      ```bash

      cd ~/lab/examples/idempotency

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Der zweite Lauf und Prüfmodusbericht changed=0.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann mit `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-idempotency
ansible-5:
  profile: ansible
  example: variables
  source_hash: ff8215aa5947cd3294e5f186ffd0113767dbbfca7e662c0a7b525b9d880802af
  content:
    en: 'Variables come from several sources. Explicit extra variables override the play value in this experiment. Evaluate a concrete variable and its source rather than memorizing an unexplained precedence number.


      In quest 055, inspect the effective host variables: the `fleet` group overrides `all`. Correct the group value without extra vars, then verify `north-ready` and mode `0644` on every target.


      In quest 038, the reusable role defaults remain `retired` and `shared`. Override only the route in `group_vars/fleet.yml`; the inventory variable takes precedence over the role default while the platform default remains. After the playbook, verify `/srv/site/role.txt` on all three hosts reads `north:shared` and the defaults file is unchanged.


      In quest 012, `rollout.yml` uses `ansible_facts.os_family` and `ansible_facts.architecture` to build `/srv/site/facts.json`, but its play disables fact gathering. Enable `gather_facts: true`, run the playbook and inspect the JSON and mode on all three fleet hosts. Each file must contain exactly `family: Debian` and `architecture: x86_64` as JSON values and have mode `0644`; the facts describe each managed host, not the controller.


      ## Try it


      Open the **ansible Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Will message remain play-default after passing -e message=cli?


      ```bash

      cd ~/lab/examples/variables

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The assertion confirms the explicit cli value.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Переменные поступают из нескольких источников. В этом опыте extra vars перекрывают значение из play. Разбирайте конкретное значение и его источник, а не номер в таблице приоритетов.


      В квесте 055 изучите действующие переменные машины: группа `fleet` перекрывает `all`. Исправьте значение группы без extra vars, затем проверьте `north-ready` и режим `0644` на каждой машине.


      В квесте 038 defaults переиспользуемой роли остаются `retired` и `shared`. Переопределите только route в `group_vars/fleet.yml`: переменная inventory имеет приоритет над default роли, а default platform сохраняется. После playbook проверьте, что `/srv/site/role.txt` на трех машинах содержит `north:shared`, а файл defaults не изменен.


      В квесте 012 `rollout.yml` использует `ansible_facts.os_family` и `ansible_facts.architecture` для создания `/srv/site/facts.json`, но play отключает сбор фактов. Включите `gather_facts: true`, запустите playbook и проверьте JSON и режим на всех трех машинах fleet. Каждый файл должен содержать ровно значения JSON `family: Debian` и `architecture: x86_64` и иметь режим `0644`; факты описывают управляемую машину, а не контроллер.


      ## Попробуйте


      Откройте лабораторию **ansible**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Останется ли message равным play-default после -e message=cli?


      ```bash

      cd ~/lab/examples/variables

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Assert подтверждает явно переданное значение cli.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Zmienne pochodzą z kilku źródeł. W tym eksperymencie jawne dodatkowe zmienne zastępują wartość play. Zamiast zapamiętywać niewyjaśniony numer pierwszeństwa, oceniaj konkretną zmienną i jej źródło.


      W zadaniu 055 sprawdź efektywne zmienne hosta: grupa `fleet` nadpisuje `all`. Popraw wartość grupy bez extra vars, a następnie sprawdź `north-ready` i tryb `0644` na każdym hoście.


      W zadaniu 038 defaults roli wielokrotnego użytku pozostają `retired` i `shared`. Nadpisz tylko route w `group_vars/fleet.yml`: zmienna inventory ma pierwszeństwo przed default roli, a default platform pozostaje. Po playbooku sprawdź, że `/srv/site/role.txt` na trzech hostach zawiera `north:shared`, a plik defaults jest niezmieniony.


      W zadaniu 012 `rollout.yml` używa `ansible_facts.os_family` i `ansible_facts.architecture` do utworzenia `/srv/site/facts.json`, ale play wyłącza zbieranie faktów. Włącz `gather_facts: true`, uruchom playbook i sprawdź JSON oraz tryb na wszystkich trzech hostach fleet. Każdy plik musi zawierać dokładnie wartości JSON `family: Debian` i `architecture: x86_64` oraz mieć tryb `0644`; fakty opisują zarządzany host, a nie kontroler.


      ## Wypróbuj


      Otwórz laboratorium **ansible** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy message pozostanie play-default po przejściu -e message=cli?


      ```bash

      cd ~/lab/examples/variables

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Asercja potwierdza jawną wartość cli.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Las variables provienen de varias fuentes. Las variables explícitas extra anulan el valor play en este experimento. Evalúe una variable concreta y su origen en lugar de memorizar un número de precedencia inexplicable.


      En el ejercicio 055, inspecciona las variables efectivas del host: el grupo `fleet` sobrescribe `all`. Corrige el valor del grupo sin extra vars y comprueba `north-ready` y modo `0644` en cada destino.


      En el ejercicio 038, los defaults del rol reutilizable siguen siendo `retired` y `shared`. Sobrescribe solo route en `group_vars/fleet.yml`: la variable de inventory tiene prioridad sobre el default del rol, mientras se conserva el default de platform. Tras el playbook, verifica que `/srv/site/role.txt` en los tres hosts contiene `north:shared` y que el archivo de defaults no cambió.


      En el ejercicio 012, `rollout.yml` usa `ansible_facts.os_family` y `ansible_facts.architecture` para crear `/srv/site/facts.json`, pero el play desactiva la recopilación de facts. Activa `gather_facts: true`, ejecuta el playbook y comprueba el JSON y el modo en los tres hosts de fleet. Cada archivo debe contener exactamente los valores JSON `family: Debian` y `architecture: x86_64` y tener modo `0644`; los facts describen cada host administrado, no el controlador.


      ## Pruébalo


      Abra el laboratorio **ansible** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿message seguirá siendo play-default después de pasar -e message=cli?


      ```bash

      cd ~/lab/examples/variables

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. La afirmación confirma el valor explícito de cli.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh` y luego con `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Variablen stammen aus mehreren Quellen. Explizite extra-Variablen überschreiben in diesem Experiment den play-Wert. Bewerten Sie eine konkrete Variable und ihre Quelle, anstatt sich eine ungeklärte Prioritätsnummer zu merken.


      Prüfe in Aufgabe 055 die effektiven Hostvariablen: Die Gruppe `fleet` überschreibt `all`. Korrigiere den Gruppenwert ohne Extra-Vars und prüfe `north-ready` und Modus `0644` auf jedem Ziel.


      In Aufgabe 038 bleiben die Defaults der wiederverwendbaren Rolle `retired` und `shared`. Überschreibe nur route in `group_vars/fleet.yml`: Die Inventory-Variable hat Vorrang vor dem Rollen-Default, während der Platform-Default erhalten bleibt. Prüfe nach dem Playbook, dass `/srv/site/role.txt` auf allen drei Hosts `north:shared` enthält und die Defaults-Datei unverändert ist.


      In Aufgabe 012 verwendet `rollout.yml` `ansible_facts.os_family` und `ansible_facts.architecture` für `/srv/site/facts.json`, aber das Play deaktiviert die Faktensammlung. Aktiviere `gather_facts: true`, führe das Playbook aus und prüfe JSON und Modus auf allen drei Fleet-Hosts. Jede Datei muss genau die JSON-Werte `family: Debian` und `architecture: x86_64` enthalten und Modus `0644` haben; die Fakten beschreiben den verwalteten Host, nicht den Controller.


      ## Probieren Sie es aus


      Öffnen Sie das **ansible Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Bleibt message play-default, nachdem -e message=cli passiert ist?


      ```bash

      cd ~/lab/examples/variables

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Die Behauptung bestätigt den expliziten cli-Wert.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das vollständige Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-variables
ansible-7:
  profile: ansible
  example: templates
  source_hash: b547fb3be6d0da5abc31845c0d662c0f7b46f9753209498724c363e1982e44c6
  content:
    en: 'A Jinja template renders configuration from data before the template module compares the result with the destination. Changing a variable can change the rendered file; rendering the same values again should converge.


      In quest 022, `message.j2` must render the current `inventory_hostname` instead of a fixed station name, with `route=north`. Run the template task and inspect `/srv/site/message` on all three targets: the station line must match each host and the route line must be north.


      In quest 018, `rollout.yml` loads `station.yml`, which supplies `route: north` and `slots: 3`, and renders `board.j2` for each host in `fleet`. Use `{{ inventory_hostname }}` for the current host and `{{ route }}` and `{{ slots }}` for the supplied values. After running the playbook, `/srv/site/board` on each host should read `station=app1 route=north slots=3`, `station=app2 route=north slots=3`, or `station=app3 route=north slots=3` respectively, with mode `0644`. Verify the content and mode on all three hosts.


      ## Try it


      Open the **ansible Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Does an unchanged template file mean an unchanged result after a variable override?


      ```bash

      cd ~/lab/examples/templates

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Expected result

      > No. Overriding listen_port changes the rendered port to 9090.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Jinja строит конфигурацию из данных, затем template сравнивает результат с файлом назначения. Новая переменная может изменить файл; повтор тех же значений должен сходиться без изменений.


      В квесте 022 `message.j2` должен подставлять текущий `inventory_hostname` вместо фиксированного имени станции, с `route=north`. Запустите задачу template и проверьте `/srv/site/message` на трех машинах: строка station должна соответствовать каждой машине, а строка route — north.


      В квесте 018 `rollout.yml` загружает `station.yml` со значениями `route: north` и `slots: 3`, затем создает результат `board.j2` для каждой машины из `fleet`. Используйте `{{ inventory_hostname }}` для текущей машины, а `{{ route }}` и `{{ slots }}` — для заданных значений. После запуска playbook файл `/srv/site/board` на соответствующих машинах должен содержать `station=app1 route=north slots=3`, `station=app2 route=north slots=3` или `station=app3 route=north slots=3` и иметь режим `0644`. Проверьте содержимое и режим на всех трех машинах.


      ## Попробуйте


      Откройте лабораторию **ansible**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Неизменный файл шаблона гарантирует тот же результат после изменения переменной?


      ```bash

      cd ~/lab/examples/templates

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Новое listen_port меняет порт в результате на 9090.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Jinja template renderuje konfigurację na podstawie danych, zanim moduł template porówna wynik z miejscem docelowym. Zmiana zmiennej może zmienić renderowany plik; ponowne renderowanie tych samych wartości powinno być zbieżne.


      W zadaniu 022 `message.j2` ma renderować bieżący `inventory_hostname` zamiast stałej nazwy stacji, z `route=north`. Uruchom zadanie template i sprawdź `/srv/site/message` na trzech hostach: wiersz station musi odpowiadać danemu hostowi, a wiersz route musi mieć north.


      W zadaniu 018 `rollout.yml` ładuje `station.yml` z wartościami `route: north` i `slots: 3`, a następnie renderuje `board.j2` dla każdego hosta w `fleet`. Użyj `{{ inventory_hostname }}` dla bieżącego hosta oraz `{{ route }}` i `{{ slots }}` dla podanych wartości. Po uruchomieniu playbooka `/srv/site/board` na kolejnych hostach powinien zawierać odpowiednio `station=app1 route=north slots=3`, `station=app2 route=north slots=3` lub `station=app3 route=north slots=3`, w trybie `0644`. Sprawdź zawartość i tryb na wszystkich trzech hostach.


      ## Wypróbuj


      Otwórz laboratorium **ansible** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy niezmieniony plik template oznacza niezmieniony wynik po zastąpieniu zmiennej?


      ```bash

      cd ~/lab/examples/templates

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Zastąpienie listen_port zmienia renderowany port na 9090.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Un Jinja template representa la configuración a partir de los datos antes de que el módulo template compare el resultado con el destino. Cambiar una variable puede cambiar el archivo renderizado; renderizar los mismos valores nuevamente debería converger.


      En el ejercicio 022, `message.j2` debe renderizar el `inventory_hostname` actual en vez de un nombre de estación fijo, con `route=north`. Ejecuta la tarea template y comprueba `/srv/site/message` en los tres hosts: la línea station debe corresponder a cada host y la línea route debe ser north.


      En el ejercicio 018, `rollout.yml` carga `station.yml`, que proporciona `route: north` y `slots: 3`, y renderiza `board.j2` para cada host de `fleet`. Usa `{{ inventory_hostname }}` para el host actual y `{{ route }}` y `{{ slots }}` para los valores suministrados. Tras ejecutar el playbook, `/srv/site/board` en cada host debe contener respectivamente `station=app1 route=north slots=3`, `station=app2 route=north slots=3` o `station=app3 route=north slots=3`, con modo `0644`. Comprueba el contenido y el modo en los tres hosts.


      ## Pruébalo


      Abra el **ansible Lab** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿Un archivo template sin cambios significa un resultado sin cambios después de una anulación de variable?


      ```bash

      cd ~/lab/examples/templates

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. Anular listen_port cambia el puerto renderizado a 9090.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh` y luego con `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'A Jinja template rendert die Konfiguration aus Daten, bevor das template-Modul das Ergebnis mit dem Ziel vergleicht. Durch das Ändern einer Variablen kann sich die gerenderte Datei ändern. Das erneute Rendern derselben Werte sollte konvergieren.


      In Aufgabe 022 muss `message.j2` den aktuellen `inventory_hostname` statt eines festen Stationsnamens mit `route=north` rendern. Führe die Template-Aufgabe aus und prüfe `/srv/site/message` auf allen drei Hosts: Die Station-Zeile muss zum jeweiligen Host und die Route-Zeile zu north passen.


      In Aufgabe 018 lädt `rollout.yml` die Datei `station.yml` mit `route: north` und `slots: 3` und rendert `board.j2` für jeden Host in `fleet`. Verwende `{{ inventory_hostname }}` für den aktuellen Host und `{{ route }}` sowie `{{ slots }}` für die gelieferten Werte. Nach dem Playbook-Lauf muss `/srv/site/board` auf den jeweiligen Hosts `station=app1 route=north slots=3`, `station=app2 route=north slots=3` oder `station=app3 route=north slots=3` enthalten und Modus `0644` haben. Prüfe Inhalt und Modus auf allen drei Hosts.


      ## Probieren Sie es aus


      Öffnen Sie das **ansible Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Bedeutet eine unveränderte template-Datei ein unverändertes Ergebnis nach einer Variablenüberschreibung?


      ```bash

      cd ~/lab/examples/templates

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Durch das Überschreiben von listen_port wird der gerenderte Port auf 9090 geändert.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann mit `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-templates
ansible-9:
  profile: ansible
  example: failures
  source_hash: 57814bba504547b48d8ae92cef943b835b1dc4050246886a78d050e73b70d430
  content:
    en: 'A failed task interrupts the normal path. A rescue block can recover from a task failure, while always runs cleanup or observation. Unreachable hosts and syntax errors need separate handling.


      In quest 063, verify the previous artifact checksum before a serial rollout. A failed candidate triggers `rescue` to restore that artifact and notify the handler; `always` records a separate check. Verify the play structure, restored files and live responses.


      In quest 086, a deliberately failed validation needs a rescue path that restores the stable banner and reloads it. Verify the file mode and HTTP response on every host; a rescued task alone does not establish restoration.


      In quest 035, `offline` is intentionally unreachable; an unreachable connection is not the same as an ordinary failed module task. Limit `ignore_unreachable: true` to the safe diagnostic and preserve the `UNREACHABLE` evidence in `probe.log`. Verify the healthy app1–app3 recap has zero unreachable and failed results and the localhost `safety-check.txt` records the check. The file must contain exactly `healthy fleet checked`.


      ## Try it


      Open the **ansible Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Does a rescued failure necessarily make the whole playbook return failure?


      ```bash

      cd ~/lab/examples/failures

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The rescued play succeeds with rescued=1; the unhandled example returns failure.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Сбой задачи прерывает обычный путь. Rescue может обработать ошибку задачи, always выполняет завершающие действия или наблюдение. Недоступный хост и ошибка синтаксиса требуют отдельного разбора.


      В квесте 063 проверьте checksum предыдущего артефакта перед последовательным rollout. Ошибочный кандидат запускает `rescue`, который восстанавливает артефакт и уведомляет handler; `always` отдельно записывает проверку. Проверьте структуру play, восстановленные файлы и живые ответы.


      В квесте 086 намеренно ошибочная валидация требует пути rescue, восстанавливающего стабильный баннер и перезагружающего сервис. Проверьте режим файла и HTTP-ответ каждой машины: один rescued task не доказывает восстановление.


      В квесте 035 `offline` намеренно недоступен; недоступное соединение отличается от обычного отказа задачи модуля. Ограничьте `ignore_unreachable: true` безопасной диагностикой и сохраните подтверждение `UNREACHABLE` в `probe.log`. Проверьте, что в recap исправных app1–app3 нет unreachable и failed, а `safety-check.txt` на localhost фиксирует проверку. Файл должен содержать ровно `healthy fleet checked`.


      ## Попробуйте


      Откройте лабораторию **ansible**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Обработанная rescue ошибка обязательно завершает весь playbook с ошибкой?


      ```bash

      cd ~/lab/examples/failures

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Обработанный пример успешен с rescued=1, необработанный возвращает ошибку.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Nieudane zadanie przerywa normalną ścieżkę. Blok rescue może odzyskać siły po awarii zadania, podczas gdy always uruchamia czyszczenie lub obserwację. Nieosiągalne hosty i błędy składniowe wymagają osobnej obsługi.


      W zadaniu 063 sprawdź checksum poprzedniego artefaktu przed szeregowym rolloutem. Błędny kandydat uruchamia `rescue`, które przywraca artefakt i powiadamia handler; `always` osobno zapisuje kontrolę. Sprawdź strukturę play, przywrócone pliki i rzeczywiste odpowiedzi.


      W zadaniu 086 celowo nieudana walidacja wymaga ścieżki rescue przywracającej stabilny baner i przeładowującej usługę. Sprawdź tryb pliku i odpowiedź HTTP każdego hosta; samo uratowane zadanie nie dowodzi przywrócenia.


      W zadaniu 035 `offline` jest celowo nieosiągalny; nieosiągalne połączenie różni się od zwykłego błędu zadania modułu. Ogranicz `ignore_unreachable: true` do bezpiecznej diagnostyki i zachowaj dowód `UNREACHABLE` w `probe.log`. Sprawdź, że recap sprawnych app1–app3 ma zero unreachable i failed, a `safety-check.txt` na localhost zapisuje kontrolę. Plik musi zawierać dokładnie `healthy fleet checked`.


      ## Wypróbuj


      Otwórz laboratorium **ansible** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy uratowana awaria koniecznie powoduje powrót całego playbook?


      ```bash

      cd ~/lab/examples/failures

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Uratowana gra powiodła się dzięki rescued=1; nieobsługiwany przykład zwraca błąd.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Una tarea fallida interrumpe el camino normal. Un bloque rescue puede recuperarse de una falla en la tarea, mientras siempre ejecuta la limpieza u observación. Los hosts inalcanzables y los errores de sintaxis deben tratarse por separado.


      En el ejercicio 063, verifica el checksum del artefacto anterior antes del rollout serial. Un candidato inválido activa `rescue`, que restaura el artefacto y notifica al handler; `always` registra una comprobación separada. Verifica la estructura del play, los archivos restaurados y las respuestas reales.


      En el ejercicio 086, una validación deliberadamente fallida necesita una ruta rescue que restaure el banner estable y recargue el servicio. Verifica el modo del archivo y la respuesta HTTP en cada host; una tarea rescatada por sí sola no demuestra la restauración.


      En el ejercicio 035, `offline` es intencionalmente inaccesible; una conexión inaccesible no equivale a un fallo normal de una tarea de módulo. Limita `ignore_unreachable: true` al diagnóstico seguro y conserva la evidencia `UNREACHABLE` en `probe.log`. Comprueba que el recap de los hosts sanos app1–app3 tiene cero unreachable y failed, y que `safety-check.txt` en localhost registra la comprobación. El archivo debe contener exactamente `healthy fleet checked`.


      ## Pruébalo


      Abra el **ansible Lab** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿Una falla rescatada necesariamente hace que todo el playbook regrese como falla?


      ```bash

      cd ~/lab/examples/failures

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. La jugada rescatada triunfa con rescued=1; el ejemplo no controlado devuelve un error.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh` y luego con `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Eine fehlgeschlagene Aufgabe unterbricht den normalen Pfad. Ein rescue-Block kann sich nach einem Task-Fehler erholen, während er immer eine Bereinigung oder Beobachtung ausführt. Nicht erreichbare Hosts und Syntaxfehler müssen separat behandelt werden.


      Prüfe in Aufgabe 063 vor dem seriellen Rollout die Prüfsumme des vorherigen Artefakts. Ein ungültiger Kandidat löst `rescue` aus, das das Artefakt wiederherstellt und den Handler benachrichtigt; `always` protokolliert eine getrennte Prüfung. Prüfe Play-Struktur, wiederhergestellte Dateien und tatsächliche Antworten.


      In Aufgabe 086 benötigt eine absichtlich fehlgeschlagene Validierung einen Rescue-Pfad, der das stabile Banner wiederherstellt und den Dienst neu lädt. Prüfe Dateimodus und HTTP-Antwort jedes Hosts; eine gerettete Aufgabe allein belegt keine Wiederherstellung.


      In Aufgabe 035 ist `offline` absichtlich nicht erreichbar; eine nicht erreichbare Verbindung ist kein gewöhnlicher Fehler einer Modulaufgabe. Beschränke `ignore_unreachable: true` auf die sichere Diagnose und erhalte den Nachweis `UNREACHABLE` in `probe.log`. Prüfe, dass der Recap der gesunden Hosts app1–app3 null unreachable und failed meldet und `safety-check.txt` auf localhost die Prüfung festhält. Die Datei muss genau `healthy fleet checked` enthalten.


      ## Probieren Sie es aus


      Öffnen Sie das **ansible Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Führt ein behobener Fehler zwangsläufig dazu, dass der gesamte playbook einen Fehler zurückgibt?


      ```bash

      cd ~/lab/examples/failures

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Das gerettete Spiel gelingt mit rescued=1; Das nicht behandelte Beispiel gibt einen Fehler zurück.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann mit `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-failures
ansible-10:
  profile: ansible
  example: handlers
  source_hash: e38cbb8510e4385aca03ce5459ce5e199a92ebe5fe3ffc8623ba5e6e888c2e12
  content:
    en: 'Changed tasks notify handlers. Two notifications to the same handler are coalesced before it runs. A second converged run has no change to notify. A later task failure may prevent an already notified handler from running.


      In quest 052, the file and cached service are separate results. Deliver `north-ready` with mode `0644`, notify the supplied reload handler when it changes, and verify both the file and HTTP response on all three hosts.


      In quest 010, the fleet stage is complete only when all three `/srv/site/message` files have the required release and mode and all three HTTP banners serve `release-10`. A handler can reload the cached banner when delivery changes the file; observing the file alone does not verify the process.


      In quest 020, the fleet receives the managed `release.txt` artifact. After delivery and the change-triggered reload, verify the three files and live HTTP banners, then run the playbook again and inspect each host recap for `changed=0` and `failed=0`. These observations cover the current state; they do not prove the history of every prior run.


      In quest 008, the process keeps the banner it read at startup even after `/srv/site/message` changes. In `rollout.yml`, notify `Reload banner` from the copy task; the supplied handler runs `dq-service reload` after a change. Run the playbook and query each of the three live HTTP banners: all must return `north-ready`. A correct file by itself does not prove that the running process reloaded it.


      ## Try it


      Open the **ansible Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Will two changed tasks run the same handler twice?


      ```bash

      cd ~/lab/examples/handlers

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The first run executes it once, and the converged second run does not execute it.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Изменившие состояние задачи уведомляют handlers. Два уведомления одного обработчика объединяются до его запуска. При повторном запуске без изменений нет нового уведомления. Последующая ошибка задачи может помешать уже уведомлённому обработчику.


      В квесте 052 файл и кэширующий сервис — отдельные результаты. Доставьте `north-ready` с режимом `0644`, уведомьте выданный handler перезагрузки при изменении и проверьте файл и HTTP-ответ на всех трех машинах.


      В квесте 010 этап fleet завершен только тогда, когда все три файла `/srv/site/message` имеют нужный релиз и режим, а три HTTP-баннера отдают `release-10`. Handler может перечитать закэшированный баннер, когда доставка меняет файл; одна проверка файла не подтверждает состояние процесса.


      В квесте 020 fleet получает управляемый артефакт `release.txt`. После доставки и перечитывания по изменению проверьте три файла и работающие HTTP-баннеры, затем повторно запустите playbook и проверьте в recap каждой машины `changed=0` и `failed=0`. Эти наблюдения показывают текущее состояние, но не доказывают историю всех прошлых запусков.


      В квесте 008 процесс сохраняет баннер, прочитанный при запуске, даже после изменения `/srv/site/message`. В `rollout.yml` добавьте уведомление `Reload banner` к задаче copy; готовый handler выполняет `dq-service reload` после изменения. Запустите playbook и запросите все три работающих HTTP-баннера: каждый должен вернуть `north-ready`. Сам по себе правильный файл не доказывает, что процесс перечитал его.


      ## Попробуйте


      Откройте лабораторию **ansible**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Две изменившие состояние задачи запустят один handler дважды?


      ```bash

      cd ~/lab/examples/handlers

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Первый запуск выполняет его один раз, повторный без изменений не выполняет.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Zmienione zadania powiadamiają handlers. Dwa powiadomienia do tego samego handler są łączone przed jego uruchomieniem. Drugi przebieg zbieżny nie powoduje żadnych zmian do powiadomienia. Późniejsza awaria zadania może uniemożliwić uruchomienie już zgłoszonego handler.


      W zadaniu 052 plik i usługa z pamięcią podręczną to osobne wyniki. Dostarcz `north-ready` z trybem `0644`, powiadom dostarczony handler przeładowania przy zmianie i sprawdź plik oraz odpowiedź HTTP na trzech hostach.


      W zadaniu 010 etap fleet kończy się dopiero wtedy, gdy wszystkie trzy pliki `/srv/site/message` mają wymagany release i tryb, a trzy banery HTTP zwracają `release-10`. Handler może ponownie wczytać buforowany baner, gdy dostarczenie zmieni plik; sam odczyt pliku nie potwierdza stanu procesu.


      W zadaniu 020 fleet otrzymuje zarządzany artefakt `release.txt`. Po dostarczeniu i ponownym wczytaniu wywołanym zmianą sprawdź trzy pliki i działające banery HTTP, a potem uruchom playbook ponownie i sprawdź w recap każdego hosta `changed=0` oraz `failed=0`. Obserwacje pokazują obecny stan, lecz nie dowodzą historii wszystkich wcześniejszych przebiegów.


      W zadaniu 008 proces zachowuje baner odczytany przy starcie nawet po zmianie `/srv/site/message`. W `rollout.yml` dodaj powiadomienie `Reload banner` do zadania copy; dostarczony handler uruchamia `dq-service reload` po zmianie. Uruchom playbook i odczytaj wszystkie trzy działające banery HTTP: każdy musi zwrócić `north-ready`. Sam poprawny plik nie dowodzi, że proces wczytał go ponownie.


      ## Wypróbuj


      Otwórz laboratorium **ansible** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy dwa zmienione zadania uruchomią dwukrotnie ten sam handler?


      ```bash

      cd ~/lab/examples/handlers

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Pierwszy przebieg wykonuje to raz, a drugi zbieżny przebieg nie wykonuje go.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Las tareas modificadas notifican a handlers. Se fusionan dos notificaciones al mismo handler antes de que se ejecute. Una segunda ejecución convergente no tiene cambios que notificar. Un error de tarea posterior puede impedir que se ejecute un handler ya notificado.


      En el ejercicio 052, el archivo y el servicio que conserva datos en caché son resultados separados. Entrega `north-ready` con modo `0644`, notifica al handler de recarga suministrado al cambiar y verifica el archivo y la respuesta HTTP en los tres hosts.


      En el ejercicio 010, la etapa de fleet termina solo cuando los tres archivos `/srv/site/message` tienen el release y modo requeridos y los tres banners HTTP devuelven `release-10`. Un handler puede recargar el banner almacenado cuando la entrega cambia el archivo; observar solo el archivo no verifica el proceso.


      En el ejercicio 020, fleet recibe el artefacto gestionado `release.txt`. Después de entregarlo y recargar por el cambio, comprueba los tres archivos y banners HTTP activos, luego ejecuta el playbook de nuevo y revisa `changed=0` y `failed=0` en el recap de cada host. Estas observaciones muestran el estado actual, pero no prueban el historial de todas las ejecuciones anteriores.


      En el ejercicio 008, el proceso conserva el banner leído al arrancar incluso después de cambiar `/srv/site/message`. En `rollout.yml`, notifica `Reload banner` desde la tarea copy; el handler suministrado ejecuta `dq-service reload` después de un cambio. Ejecuta el playbook y consulta los tres banners HTTP activos: todos deben devolver `north-ready`. Un archivo correcto por sí solo no demuestra que el proceso lo haya recargado.


      ## Pruébalo


      Abra el laboratorio **ansible** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿Dos tareas modificadas ejecutarán el mismo handler dos veces?


      ```bash

      cd ~/lab/examples/handlers

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. La primera ejecución lo ejecuta una vez y la segunda ejecución convergente no lo ejecuta.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh`, luego `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Geänderte Aufgaben benachrichtigen handlers. Zwei Benachrichtigungen an denselben handler werden vor der Ausführung zusammengeführt. Bei einem zweiten konvergenten Lauf ist keine Änderung zu benachrichtigen. Ein späterer Aufgabenfehler kann die Ausführung eines bereits benachrichtigten handler verhindern.


      In Aufgabe 052 sind Datei und zwischenspeichernder Dienst getrennte Ergebnisse. Liefere `north-ready` mit Modus `0644`, benachrichtige bei Änderung den bereitgestellten Reload-Handler und prüfe Datei und HTTP-Antwort auf allen drei Hosts.


      In Aufgabe 010 ist die Fleet-Phase erst abgeschlossen, wenn alle drei Dateien `/srv/site/message` den geforderten Release und Modus haben und alle drei HTTP-Banner `release-10` liefern. Ein Handler kann das zwischengespeicherte Banner neu laden, wenn die Auslieferung die Datei ändert; die Datei allein bestätigt den Prozess nicht.


      In Aufgabe 020 erhält die Fleet das verwaltete Artefakt `release.txt`. Prüfe nach Auslieferung und durch die Änderung ausgelöstem Neuladen die drei Dateien und laufenden HTTP-Banner. Führe das Playbook erneut aus und prüfe im Recap jedes Hosts `changed=0` und `failed=0`. Diese Beobachtungen zeigen den aktuellen Zustand, beweisen aber nicht die Geschichte aller früheren Läufe.


      In Aufgabe 008 behält der Prozess das beim Start gelesene Banner auch nach einer Änderung von `/srv/site/message`. Benachrichtige in `rollout.yml` aus der Copy-Aufgabe `Reload banner`; der vorhandene Handler führt nach einer Änderung `dq-service reload` aus. Führe das Playbook aus und frage alle drei laufenden HTTP-Banner ab: Alle müssen `north-ready` liefern. Eine korrekte Datei allein beweist nicht, dass der Prozess sie neu geladen hat.


      ## Probieren Sie es aus


      Öffnen Sie das **ansible Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Werden zwei geänderte Aufgaben denselben handler zweimal ausführen?


      ```bash

      cd ~/lab/examples/handlers

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Der erste Lauf führt es einmal aus, und der konvergierte zweite Lauf führt es nicht aus.


      ## Beobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-handlers
ansible-11:
  profile: ansible
  example: rolling
  source_hash: 9c4fbf37a0b5543ea862a8a4a4d678cf98c5d4379d2276616d6370f3277a8ced
  content:
    en: 'serial limits the hosts processed in each batch. Error policy decides whether later batches continue. Delegation changes where a task executes; it does not automatically change which inventory host owns its result. Kernel upgrades and VM reboots are an additional VM practicum, outside these SSH containers.


      In quest 096, inspect archive paths and compare its SHA-256 with the frozen receipt before restoring. Keep the checksum assertion, serial execution, explicit root owner and group, mode `0644` and reload handler; verify the restored file and HTTP response on every host.


      In quest 040, every maintenance play must use `serial: 1`; deliver `north-40` to `/srv/site/maintenance.txt` on all three hosts. This controls host batches, separately from the board Deployment''s rolling strategy. After the fleet stage, verify two ready board replicas and traffic through the retained Service.


      In quest 028, `serial: 1` limits each batch to one host. Deliver the required `north-ready` file with mode `0644`, then inspect the actual batch trace: app1, app2 and app3 must appear in order, one per batch. A correct final file alone does not demonstrate the batch order.


      In quest 032, delegation changes where the task runs but normally keeps one iteration per inventory host. Use `groups["fleet"]` as the membership source, sort it, and run the localhost summary task once. Verify the workstation''s `fleet.txt` contains app1, app2 and app3 on separate lines with mode `0644`, and that the summary was not delivered to the targets. The copy task uses `delegate_to: localhost` and `run_once: true`.


      ## Try it


      Open the **ansible Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** With serial=1 and a fatal failure on app2, will app3 begin?


      ```bash

      cd ~/lab/examples/rolling

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The failed second batch stops the sequence before app3.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Serial ограничивает размер партии. Политика ошибок определяет переход к следующей партии. Делегирование меняет место исполнения, но не обязательно владельца результата в inventory. Обновление ядра и reboot ВМ — дополнительный практикум в VM, за пределами этих SSH-контейнеров.


      В квесте 096 перед восстановлением изучите пути архива и сравните его SHA-256 с зафиксированной квитанцией. Сохраните проверку checksum, последовательное выполнение, явного владельца и группу root, режим `0644` и handler перезагрузки; проверьте восстановленный файл и HTTP-ответ каждой машины.


      В квесте 040 в каждом maintenance play нужен `serial: 1`; доставьте `north-40` в `/srv/site/maintenance.txt` на все три машины. Это управляет партиями машин отдельно от стратегии rolling Deployment board. После этапа fleet проверьте две готовые реплики board и трафик через сохраненный Service.


      В квесте 028 `serial: 1` ограничивает каждую партию одной машиной. Доставьте нужный файл `north-ready` с режимом `0644`, затем изучите фактический журнал партий: app1, app2 и app3 должны идти по порядку, по одной машине в партии. Правильный конечный файл сам по себе не доказывает порядок партий.


      В квесте 032 delegation меняет место выполнения задачи, но обычно сохраняет одну итерацию на каждую машину inventory. Используйте `groups["fleet"]` как источник состава, отсортируйте его и выполните задачу сводки на localhost один раз. Проверьте, что `fleet.txt` на рабочей станции содержит app1, app2 и app3 по строке с режимом `0644`, а сводка не доставлена на целевые машины. В задаче copy используйте `delegate_to: localhost` и `run_once: true`.


      ## Попробуйте


      Откройте лабораторию **ansible**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** При serial=1 и фатальной ошибке app2 начнётся ли партия app3?


      ```bash

      cd ~/lab/examples/rolling

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Вторая партия останавливает последовательность до app3.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'serial ogranicza hosty przetwarzane w każdej partii. Polityka błędów decyduje, czy późniejsze partie będą kontynuowane. Delegowanie zmienia miejsce wykonywania zadania; nie zmienia to automatycznie tego, który host inventory jest właścicielem jego wyniku. Aktualizacje jądra i ponowne uruchamianie VM to dodatkowa praktyka VM, poza tymi kontenerami SSH.


      W zadaniu 096 przed przywróceniem sprawdź ścieżki archiwum i porównaj jego SHA-256 z utrwalonym potwierdzeniem. Zachowaj asercję checksum, wykonanie szeregowe, jawnego właściciela i grupę root, tryb `0644` i handler przeładowania; sprawdź przywrócony plik i odpowiedź HTTP każdego hosta.


      W zadaniu 040 każdy maintenance play musi używać `serial: 1`; dostarcz `north-40` do `/srv/site/maintenance.txt` na trzech hostach. Steruje to partiami hostów niezależnie od strategii rolling Deploymentu board. Po etapie fleet sprawdź dwie gotowe repliki board i ruch przez zachowany Service.


      W zadaniu 028 `serial: 1` ogranicza każdą partię do jednego hosta. Dostarcz wymagany plik `north-ready` z trybem `0644`, a następnie sprawdź rzeczywisty zapis partii: app1, app2 i app3 muszą wystąpić kolejno, po jednym hoście w partii. Sam poprawny plik końcowy nie dowodzi kolejności partii.


      W zadaniu 032 delegowanie zmienia miejsce wykonania zadania, ale zwykle pozostawia jedną iterację na host inventory. Użyj `groups["fleet"]` jako źródła składu, posortuj je i wykonaj zadanie podsumowania na localhost jeden raz. Sprawdź, że `fleet.txt` na stacji roboczej zawiera app1, app2 i app3 w osobnych wierszach z trybem `0644`, a podsumowanie nie trafiło na hosty docelowe. W zadaniu copy użyj `delegate_to: localhost` i `run_once: true`.


      ## Wypróbuj


      Otwórz laboratorium **ansible** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy w przypadku serial=1 i krytycznej awarii app2 rozpocznie się app3?


      ```bash

      cd ~/lab/examples/rolling

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Niepowodzenie drugiej partii zatrzymuje sekwencję przed app3.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'serial limita los hosts procesados ​​en cada lote. La política de errores decide si continúan los lotes posteriores. La delegación cambia donde se ejecuta una tarea; no cambia automáticamente qué host inventory posee su resultado. Las actualizaciones del kernel y los reinicios de VM son una práctica adicional de VM, fuera de estos contenedores SSH.


      En el ejercicio 096, inspecciona las rutas del archivo y compara su SHA-256 con el recibo congelado antes de restaurar. Conserva la aserción checksum, ejecución serial, propietario y grupo root explícitos, modo `0644` y handler de recarga; verifica el archivo restaurado y la respuesta HTTP de cada host.


      En el ejercicio 040, cada play de mantenimiento debe usar `serial: 1`; entrega `north-40` a `/srv/site/maintenance.txt` en los tres hosts. Esto controla lotes de hosts por separado de la estrategia rolling del Deployment board. Tras la etapa fleet, comprueba dos réplicas board listas y el tráfico por el Service conservado.


      En el ejercicio 028, `serial: 1` limita cada lote a un host. Entrega el archivo requerido `north-ready` con modo `0644` e inspecciona el registro real de lotes: app1, app2 y app3 deben aparecer en orden, uno por lote. Un archivo final correcto por sí solo no demuestra el orden de los lotes.


      En el ejercicio 032, la delegación cambia dónde se ejecuta la tarea, pero normalmente mantiene una iteración por host del inventory. Usa `groups["fleet"]` como fuente de miembros, ordénalos y ejecuta una sola vez la tarea de resumen en localhost. Comprueba que `fleet.txt` en la estación de trabajo contiene app1, app2 y app3 en líneas separadas con modo `0644`, y que el resumen no se entregó a los hosts de destino. Usa `delegate_to: localhost` y `run_once: true` en la tarea copy.


      ## Pruébalo


      Abra el laboratorio **ansible** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara únicamente este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** Con serial=1 y una falla fatal en app2, ¿comenzará app3?


      ```bash

      cd ~/lab/examples/rolling

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. El segundo lote fallido detiene la secuencia anterior a app3.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh` y luego con `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Serial begrenzt die Hosts, die in jedem Stapel verarbeitet werden. Die Fehlerrichtlinie entscheidet, ob spätere Stapel fortgesetzt werden. Die Delegation ändert den Ort, an dem eine Aufgabe ausgeführt wird. Es ändert sich nicht automatisch, welcher inventory-Host sein Ergebnis besitzt. Kernel-Upgrades und VM-Neustarts sind ein zusätzliches VM-Praktikum außerhalb dieser SSH-Container.


      Prüfe in Aufgabe 096 vor der Wiederherstellung die Archivpfade und vergleiche dessen SHA-256 mit dem eingefrorenen Beleg. Behalte die Prüfsummen-Assertion, serielle Ausführung, expliziten Eigentümer und Gruppe root, Modus `0644` und Reload-Handler; prüfe die wiederhergestellte Datei und HTTP-Antwort jedes Hosts.


      In Aufgabe 040 muss jedes Wartungs-Play `serial: 1` verwenden; liefere `north-40` nach `/srv/site/maintenance.txt` auf allen drei Hosts. Das steuert Host-Batches unabhängig von der Rolling-Strategie des Board-Deployments. Prüfe nach der Fleet-Phase zwei bereite Board-Repliken und Verkehr über den erhaltenen Service.


      In Aufgabe 028 begrenzt `serial: 1` jeden Batch auf einen Host. Liefere die geforderte Datei `north-ready` mit Modus `0644` aus und prüfe den tatsächlichen Batch-Ablauf: app1, app2 und app3 müssen in dieser Reihenfolge mit je einem Host pro Batch erscheinen. Eine korrekte endgültige Datei allein belegt die Batch-Reihenfolge nicht.


      In Aufgabe 032 ändert Delegation den Ausführungsort der Aufgabe, behält aber normalerweise eine Iteration pro Inventory-Host bei. Nutze `groups["fleet"]` als Quelle der Mitglieder, sortiere sie und führe die Zusammenfassung auf localhost einmal aus. Prüfe, dass `fleet.txt` auf der Workstation app1, app2 und app3 in getrennten Zeilen mit Modus `0644` enthält und nicht an die Zielhosts ausgeliefert wurde. Verwende in der Copy-Aufgabe `delegate_to: localhost` und `run_once: true`.


      ## Probieren Sie es aus


      Öffnen Sie das **ansible Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Wird app3 mit serial=1 und einem schwerwiegenden Fehler auf app2 beginnen?


      ```bash

      cd ~/lab/examples/rolling

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Der fehlgeschlagene zweite Stapel stoppt die Sequenz vor app3.


      ## Beobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-rolling
  additional:
    en: Kernel upgrades and VM reboots need a separate VM practicum. The Lab exercises rolling batches on disposable SSH targets.
    ru: Обновление ядра и перезагрузка VM требуют отдельного практикума с VM. В Lab проверяются последовательные партии на учебных SSH-хостах.
    pl: Aktualizacje jądra i ponowne uruchamianie VM wymagają oddzielnych ćwiczeń z VM. Laboratorium ćwiczy stopniowe wdrażanie partiami na jednorazowych hostach docelowych SSH.
    es: Las actualizaciones del kernel y los reinicios de VM necesitan una práctica separada sobre VM. El Lab practica lotes rodantes en objetivos desechables SSH.
    de: Für Kernel-Upgrades und VM-Neustarts ist ein separates VM-Praktikum erforderlich. Der Lab übt rollende Chargen auf Einwegzielen des Typs SSH aus.
ansible-12:
  profile: ansible
  example: reuse
  source_hash: 5dc1183c50accfee638e7569de9289a7b34420b9afe7c8191628a134afa958d3
  content:
    en: 'Static imports expand tasks earlier; dynamic includes choose tasks during execution. Tags on an include select the include statement, so untagged children can still be skipped. Roles package tasks with defaults, handlers and templates under a shared contract.


      In quest 046, an `inspect` tag on the delivery copy task would change a healthy banner during an inspection. Keep the copy task tagged only `deploy` and the stat task tagged `inspect`. List selected tasks, run the inspection and verify its recap plus the unchanged `north-46` banner on all three targets; a tag name alone does not make a task read-only. Keep one play without inherited play tags and the two supplied tasks; do not add pre/post tasks, roles or handlers.


      ## Try it


      Open the **ansible Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Does --tags dynamic necessarily run every task inside a tagged include?


      ```bash

      cd ~/lab/examples/reuse

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The include runs, but its untagged child does not. The static import inherits its tag.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Статический import раскрывает задачи заранее, динамический include выбирает их при исполнении. Метка include выбирает само включение, поэтому дочерние задачи без метки могут быть пропущены. Роль объединяет задачи, defaults, handlers и шаблоны с общим контрактом.


      В квесте 046 тег `inspect` на задаче доставки copy изменил бы исправный баннер во время проверки. Оставьте у задачи copy только тег `deploy`, а у задачи stat — `inspect`. Выведите выбранные задачи, выполните проверку и проверьте ее recap и неизменный баннер `north-46` на трех машинах: само название тега не делает задачу безопасной для чтения. Сохраните один play без унаследованных тегов и две выданные задачи; не добавляйте pre/post tasks, roles или handlers.


      ## Попробуйте


      Откройте лабораторию **ansible**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Обязательно ли --tags dynamic выполняет все задачи внутри include с этой меткой?


      ```bash

      cd ~/lab/examples/reuse

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Include выполняется, его дочерняя задача без метки — нет. Статический import наследует метку.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Importy statyczne rozszerzają zadania wcześniej; dynamiczny obejmuje wybór zadań podczas wykonywania. Tagi w include wybierają instrukcję include, więc nieoznaczone elementy podrzędne nadal można pomijać. Role pakują zadania za pomocą defaults, handlers i szablonów w ramach umowy współdzielonej.


      W zadaniu 046 tag `inspect` na zadaniu dostarczającym copy zmieniłby poprawny baner podczas inspekcji. Pozostaw zadaniu copy tylko tag `deploy`, a zadaniu stat tag `inspect`. Wyświetl wybrane zadania, wykonaj inspekcję i sprawdź jej recap oraz niezmieniony baner `north-46` na trzech hostach; sama nazwa tagu nie czyni zadania tylko do odczytu. Zachowaj jeden play bez dziedziczonych tagów i dwa dostarczone zadania; nie dodawaj pre/post tasks, roles ani handlers.


      ## Wypróbuj


      Otwórz laboratorium **ansible** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy --tags dynamic koniecznie uruchamia każde zadanie w oznaczonym include?


      ```bash

      cd ~/lab/examples/reuse

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. include działa, ale jego nieoznaczone dziecko nie. Statyczny import dziedziczy swój znacznik.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Las importaciones estáticas amplían las tareas antes; dynamic incluye tareas de elección durante la ejecución. Las etiquetas en un include seleccionan la instrucción include, por lo que aún se pueden omitir los niños sin etiquetar. Tareas de paquete de roles con defaults, handlers y plantillas bajo contrato compartido.


      En el ejercicio 046, una etiqueta `inspect` en la tarea copy de entrega cambiaría un banner sano durante la inspección. Deja solo la etiqueta `deploy` en la tarea copy y `inspect` en la tarea stat. Lista las tareas seleccionadas, ejecuta la inspección y comprueba su recap y el banner `north-46` sin cambios en los tres hosts; el nombre de una etiqueta no convierte una tarea en solo lectura. Conserva un play sin etiquetas heredadas y las dos tareas suministradas; no añadas pre/post tasks, roles ni handlers.


      ## Pruébalo


      Abra el **ansible Lab** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿--tags dynamic ejecuta necesariamente todas las tareas dentro de un include etiquetado?


      ```bash

      cd ~/lab/examples/reuse

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. El include se ejecuta, pero su hijo sin etiquetar no. El estático import hereda su etiqueta.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh` y luego con `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Statische Importe erweitern Aufgaben früher; dynamic umfasst ausgewählte Aufgaben während der Ausführung. Tags auf einem include wählen die include-Anweisung aus, sodass untergeordnete Elemente ohne Tags weiterhin übersprungen werden können. Rollen bündeln Aufgaben mit defaults, handlers und Vorlagen im Rahmen eines gemeinsamen Vertrags.


      In Aufgabe 046 würde ein `inspect`-Tag an der ausliefernden Copy-Aufgabe ein gesundes Banner während der Prüfung ändern. Gib der Copy-Aufgabe nur das Tag `deploy` und der Stat-Aufgabe `inspect`. Liste die ausgewählten Aufgaben auf, führe die Prüfung aus und kontrolliere ihren Recap sowie das unveränderte Banner `north-46` auf allen drei Hosts; ein Tag-Name allein macht eine Aufgabe nicht lesend. Behalte ein Play ohne geerbte Play-Tags und die zwei vorgegebenen Aufgaben; füge keine Pre/Post-Tasks, Rollen oder Handler hinzu.


      ## Probieren Sie es aus


      Öffnen Sie das **ansible Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und prüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Führt --tags dynamic unbedingt jede Aufgabe innerhalb eines getaggten include aus?


      ```bash

      cd ~/lab/examples/reuse

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Der include wird ausgeführt, sein nicht getaggtes untergeordnetes Element jedoch nicht. Der statische import erbt seinen Tag.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-reuse
ansible-13:
  profile: ansible
  example: vault
  source_hash: 1a48913e6ba1ebb00536e883f268e95e207ff3d424ea2513f9bbd2d88c543f71
  content:
    en: 'Ansible Vault encrypts data at rest. The controller needs a decryption secret at execution time, and no_log prevents that task’s output from disclosing values. This Lab uses a deliberately disposable demonstration password.


      In quest 069, set the sensitive copy task to mode `0600` and `no_log: true`; run the requested diff and verify permissions and the supplied synthetic value on each host without printing it. Check that the log does not expose the value. `no_log` limits task output; it does not encrypt the source file.


      In quest 089, deliver the release artifact and supplied game-only reader credential separately. Verify their actual target state on all three hosts and the credential''s `0600` mode without printing its value; log text alone is not evidence of delivery.


      ## Try it


      Open the **ansible Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Can an encrypted vars file run without a decryption secret?


      ```bash

      cd ~/lab/examples/vault

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The no-key run fails; the keyed run succeeds without printing the demonstration secret.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Ansible Vault шифрует данные при хранении. Контроллеру нужен ключ при исполнении, no_log скрывает вывод задачи с секретом. В стенде используется заведомо одноразовый демонстрационный пароль.


      В квесте 069 задайте чувствительной задаче copy режим `0600` и `no_log: true`; выполните запрошенный diff и проверьте права и выданное синтетическое значение на каждой машине, не выводя его. Убедитесь, что лог не раскрывает значение. `no_log` ограничивает вывод задачи, но не шифрует исходный файл.


      В квесте 089 доставьте артефакт релиза и выданные только для игры данные reader отдельно. Проверьте фактическое состояние на трех машинах и режим `0600` учетных данных, не выводя значение; один текст лога не доказывает доставку.


      ## Попробуйте


      Откройте лабораторию **ansible**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Можно ли выполнить зашифрованный vars-файл без ключа расшифровки?


      ```bash

      cd ~/lab/examples/vault

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Без ключа запуск ошибочен; с ключом он успешен без печати демонстрационного секрета.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Ansible Vault szyfruje dane w stanie spoczynku. Kontroler potrzebuje sekretu deszyfrowania w czasie wykonywania, a no_log zapobiega ujawnieniu wartości na wyjściu tego zadania. W tym laboratorium celowo używa się jednorazowego hasła demonstracyjnego.


      W zadaniu 069 ustaw dla wrażliwego zadania copy tryb `0600` i `no_log: true`; wykonaj żądany diff i sprawdź uprawnienia oraz dostarczoną syntetyczną wartość na każdym hoście bez jej wypisywania. Sprawdź, że log nie ujawnia wartości. `no_log` ogranicza wyjście zadania, ale nie szyfruje pliku źródłowego.


      W zadaniu 089 dostarcz osobno artefakt wydania i podane wyłącznie do gry dane readera. Sprawdź rzeczywisty stan na trzech hostach i tryb `0600` danych uwierzytelniających bez wypisywania wartości; sam tekst logu nie dowodzi dostarczenia.


      ## Wypróbuj


      Otwórz laboratorium **ansible** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy zaszyfrowany plik vars może działać bez sekretu deszyfrowania?


      ```bash

      cd ~/lab/examples/vault

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Uruchomienie bez klucza kończy się niepowodzeniem; uruchomienie z kluczem zakończyło się pomyślnie bez drukowania tajnego klucza demonstracyjnego.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Ansible Vault cifra los datos en reposo. El controlador necesita un secreto de descifrado en el momento de la ejecución, y no_log evita que la salida de esa tarea revele valores. Este laboratorio utiliza una contraseña de demostración deliberadamente desechable.


      En el ejercicio 069, asigna a la tarea copy sensible modo `0600` y `no_log: true`; ejecuta el diff solicitado y verifica permisos y el valor sintético suministrado en cada host sin imprimirlo. Comprueba que el log no exponga el valor. `no_log` limita la salida de la tarea, pero no cifra el archivo fuente.


      En el ejercicio 089, entrega por separado el artefacto de versión y la credencial reader suministrada solo para el juego. Verifica el estado real en los tres hosts y el modo `0600` de la credencial sin imprimir su valor; el texto del log por sí solo no demuestra la entrega.


      ## Pruébalo


      Abra el **Laboratorio ansible** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿Se puede ejecutar un archivo vars cifrado sin un secreto de descifrado?


      ```bash

      cd ~/lab/examples/vault

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. La ejecución sin clave falla; la ejecución con clave se realiza correctamente sin imprimir el secreto de demostración.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh`, luego `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Ansible Vault verschlüsselt ruhende Daten. Der Controller benötigt zur Ausführungszeit ein Entschlüsselungsgeheimnis, und no_log verhindert, dass die Ausgabe dieser Aufgabe Werte preisgibt. In diesem Labor wird bewusst ein Wegwerf-Demonstrationspasswort verwendet.


      Setze in Aufgabe 069 für die sensible Copy-Aufgabe Modus `0600` und `no_log: true`; führe den geforderten Diff aus und prüfe Rechte und bereitgestellten synthetischen Wert auf jedem Host, ohne ihn auszugeben. Prüfe, dass das Log den Wert nicht offenlegt. `no_log` begrenzt die Aufgabenausgabe, verschlüsselt aber nicht die Quelldatei.


      Liefere in Aufgabe 089 das Release-Artefakt und die bereitgestellten reinen Spielzugangsdaten des Readers getrennt aus. Prüfe den tatsächlichen Zustand auf allen drei Hosts und den Modus `0600` der Zugangsdaten, ohne den Wert auszugeben; Logtext allein belegt keine Auslieferung.


      ## Probieren Sie es aus


      Öffnen Sie das **ansible Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Kann eine verschlüsselte Vars-Datei ohne ein Entschlüsselungsgeheimnis ausgeführt werden?


      ```bash

      cd ~/lab/examples/vault

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Der No-Key-Lauf schlägt fehl; Der Schlüssellauf ist erfolgreich, ohne dass das Demonstrationsgeheimnis gedruckt werden muss.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-vault
