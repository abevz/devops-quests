  profile: kubernetes
  example: probes
  source_hash: 28931ee2e918601f82a313c0f8b60b9046d8d6792d6db5cf00805e59d519af3e
  content:
    en: 'A probe answers one question about a container. Startup gates the other probes; readiness controls traffic eligibility; liveness can restart the container. A Running pod can still be unready.


      Readiness, dataset identity and public routing answer different questions. A ready process may publish stale data; a Service may reach a different controller. Compare the source reference, the running application response and ready endpoint ownership before treating health as successful publication. The probes Lab exercises health transitions; it does not rehearse a complete publication and failover recovery.


      ### Quarantine readiness and Service endpoints {#quarantine-readiness-and-endpoints}


      In quest 017, keep the `stable` Pod ready and the `quarantine` process running with `ROUTE=retired`. Its readiness command should test whether `ROUTE` equals `north`, so the quarantine Pod is Running but not Ready. Keep the Pod-template labels and Service selector `route-service=departures`, then inspect ready EndpointSlice entries for `departures`: only the stable Pod should be ready for traffic. Do not delete either Deployment to obtain that result.


      ### HTTP readiness for relay {#relay-http-readiness}


      In quest 021, an HTTP readiness probe can fail while the server is running. Read the Pod events and compare the port and path in the probe with the HTTP handler in `deployment.yaml`. The supplied relay responds at `/` on `8080`. Wait for rollout after correcting both fields.


      ### Two available board replicas {#maintenance-board-availability}


      In quest 040, preserve desired replicas=2 and availableReplicas=2. Scaling or an incomplete rollout can violate either count. Inspect Pod events and rollout status before comparing Deployment JSON. A rollout command failure reaches the outer diagnostic before the Python policy runs; workspace/Python startup errors can do the same.


      ### Effective rolling-update budget {#maintenance-rolling-budget}


      In quest 040, retain RollingUpdate with an effective surge of one and zero unavailable replicas for a two-replica Deployment. maxSurge rounds percentages upward and maxUnavailable downward, so valid percentage forms can match the budget. Inspect strategy and both fields. Unreadable/malformed Deployment observations can report strategy before any count or budget can be interpreted.


      ### Readiness uses the ready endpoint {#maintenance-readiness-contract}


      In quest 040, the supplied worker probes /, but the retained contract requires an HTTP readiness action on /ready at port 8080. Inspect the worker probe in the Deployment template, including action type, port, scheme and host. Only HTTP with no host override is accepted. Correcting the ordinary response does not by itself fix the readiness configuration.


      ### The running ready handler {#maintenance-ready-response}


      In quest 040, configuration and running content are separate observations. Publish the /ready handler with body ready in the worker, wait for rollout, and read http://127.0.0.1:8080/ready from each observed running Pod. A configured path may still return missing or wrong content; exec and local HTTP failures also prevent the response check.


      ### Producer readiness and retained interface {#progressive-producer-readiness}


      The original producer is not rolled out or cannot serve its retained publication interface; the initial readiness port differs from the listener, its projected HTTP source may be wrong, or API/exec observation failed. Compare the configured readiness probe with the actual listener and the source projection declared in progressive-contract.json. Initially the producer listens on 8080 while readiness uses 9090. During failover the restored producer must keep its established local publication interface as well as remain ready; a ready replacement object does not satisfy the retained identity. `cat progressive-contract.json; kubectl get deployments,pods -o wide`.


      ### Retained publication object identities {#progressive-retained-identities}


      An original publication object UID changed; deleting and recreating a workload, source ConfigMap or established Service can retain its name while replacing the identity that the setup preserved. Setup preserves the producer Deployment and source ConfigMap UIDs; failover also preserves the backup Deployment and established Service UIDs. Patch their configuration while retaining the objects. The protected setup receipts are separate from editable workspace copies, so changing a copied receipt cannot make a replacement object original.


      ### Protected phase evidence and observation {#progressive-observer-inputs}


      The producer probe stopped without a detailed marker; protected setup evidence, workload structure, Python startup or an interrupted API observation may prevent the source/publication checks from completing. The failover probe stopped without a detailed marker; original or phase-specific identity evidence, workload structure, Python startup or an interrupted observation may prevent checking the backup and retained producer.


      ## Try it


      Open the **kubernetes Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Does deleting the readiness marker restart the container?


      ```bash

      cd ~/lab/examples/probes

      bash run.sh

      kubectl -n lab-probes get pod probe

      kubectl -n lab-probes describe pod probe

      # Check readiness and liveness separately.

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The readiness transition leaves the restart count unchanged. Removing the liveness marker then produces a restart.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Проба отвечает на один вопрос о контейнере. Startup задерживает остальные пробы, readiness определяет готовность принимать трафик, liveness может перезапустить контейнер. Running ещё не означает Ready.


      Готовность, идентичность набора данных и публичная маршрутизация отвечают на разные вопросы. Готовый процесс может публиковать устаревшие данные, а Service — вести к другому контроллеру. Сопоставляйте ссылку на источник, ответ работающего приложения и владельцев готовых endpoints, прежде чем считать готовность успешной публикацией. Lab проб показывает переходы здоровья, но не полный процесс восстановления публикации и переключения на резерв.


      ### Готовность quarantine и endpoints сервиса {#quarantine-readiness-and-endpoints}


      В квесте 017 сохраните Pod `stable` готовым, а процесс `quarantine` работающим с `ROUTE=retired`. Его команда readiness должна проверять, равно ли `ROUTE` значению `north`, поэтому Pod quarantine будет Running, но не Ready. Сохраните метки шаблонов Pod и селектор Service `route-service=departures`, затем проверьте готовые записи EndpointSlice для `departures`: только Pod stable должен быть готов принимать трафик. Не удаляйте ни один Deployment ради этого результата.


      ### HTTP-проба готовности relay {#relay-http-readiness}


      В квесте 021 HTTP-проба готовности может завершаться ошибкой при работающем сервере. Посмотрите события Pod и сравните порт и путь пробы с HTTP-обработчиком в `deployment.yaml`. Выданный relay отвечает на `/` на порту `8080`. После правки обоих полей дождитесь rollout.


      ### Две доступные реплики board {#maintenance-board-availability}


      В квесте 040 сохраните желаемое replicas=2 и availableReplicas=2. Масштабирование или незавершённый rollout могут нарушить любое число. Изучите события Pod и rollout перед сравнением JSON Deployment. Ошибка команды rollout даёт внешний маркер до политики Python; ошибки каталога/запуска Python могут дать тот же результат.


      ### Эффективный бюджет rolling update {#maintenance-rolling-budget}


      В квесте 040 сохраните RollingUpdate с эффективным surge один и нулём недоступных реплик для Deployment из двух реплик. maxSurge округляет проценты вверх, maxUnavailable — вниз, поэтому допустимы совпадающие процентные формы. Проверьте strategy и оба поля. Нечитаемое/неверное наблюдение Deployment может дать strategy ещё до оценки числа реплик или бюджета.


      ### Readiness использует ready endpoint {#maintenance-readiness-contract}


      В квесте 040 исходный worker проверяет /, но контракт требует HTTP readiness на /ready порта 8080. Проверьте probe worker в шаблоне Deployment: тип действия, порт, scheme и host. Принимается только HTTP без переопределения host. Исправление обычного ответа само по себе не исправляет конфигурацию готовности.


      ### Работающий обработчик ready {#maintenance-ready-response}


      В квесте 040 конфигурация и работающий ответ проверяются отдельно. Опубликуйте обработчик /ready с ответом ready в worker, дождитесь rollout и прочитайте http://127.0.0.1:8080/ready из каждого наблюдаемого работающего Pod. Настроенный путь может ещё возвращать отсутствие или неверное содержимое; ошибки exec и локального HTTP также мешают проверке.


      ### Готовность производителя и сохранённый интерфейс {#progressive-producer-readiness}


      Исходный производитель не завершил rollout либо не обслуживает сохранённый интерфейс: начальный порт readiness отличается от порта сервера, источник HTTP смонтирован неверно или наблюдение API/exec завершилось ошибкой. Сравните readiness с фактическим портом сервера и проекцией источника из progressive-contract.json. Изначально производитель слушает 8080, а readiness использует 9090. При переключении восстановленный производитель должен сохранить локальный интерфейс публикации и готовность; готовая замена не сохраняет исходную идентичность. `cat progressive-contract.json; kubectl get deployments,pods -o wide`.


      ### Сохранение идентичностей объектов публикации {#progressive-retained-identities}


      Изменился UID исходного объекта публикации: удаление и пересоздание нагрузки, исходного ConfigMap или установленного Service сохраняет имя, но заменяет идентичность, зафиксированную setup. Setup сохраняет UID Deployment производителя и исходного ConfigMap; переключение также сохраняет UID резервного Deployment и установленного Service. Меняйте конфигурацию, сохраняя объекты. Защищённые свидетельства setup отделены от рабочих копий: правка копии не делает новый объект исходным.


      ### Защищённые данные фаз и наблюдение {#progressive-observer-inputs}


      Проверка производителя остановилась без подробного маркера: защищённые данные setup, структура нагрузки, запуск Python или прерванное наблюдение API могли помешать завершить проверку источника и публикации. Проверка переключения остановилась без подробного маркера: исходные или фазовые свидетельства идентичности, структура нагрузки, запуск Python или прерванное наблюдение могли помешать проверить резерв и сохранённого производителя.


      ## Попробуйте


      Откройте лабораторию **kubernetes**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Удаление файла readiness перезапустит контейнер?


      ```bash

      cd ~/lab/examples/probes

      bash run.sh

      kubectl -n lab-probes get pod probe

      kubectl -n lab-probes describe pod probe

      # Check readiness and liveness separately.

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. После отказа readiness число перезапусков остаётся прежним. Удаление файла liveness затем приводит к перезапуску.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Sonda odpowiada na jedno question dotyczące kontenera. Startup bramkuje inne sondy; readiness kontroluje kwalifikowalność ruchu; liveness może zrestartować kontener. Moduł Running może nadal nie być gotowy.


      Gotowość, tożsamość danych i routing publiczny odpowiadają na różne pytania. Gotowy proces może publikować stare dane, a Service może prowadzić do innego kontrolera. Porównaj odwołanie do źródła, odpowiedź działającej aplikacji i właścicieli gotowych endpointów, zanim uznasz gotowość za poprawną publikację. Lab sond pokazuje zmiany stanu zdrowia, ale nie pełne odzyskiwanie publikacji i przełączenie na zapas.


      ### Gotowość quarantine i punkty końcowe Service {#quarantine-readiness-and-endpoints}


      W zadaniu 017 utrzymaj Pod `stable` jako gotowy, a proces `quarantine` jako działający z `ROUTE=retired`. Jego polecenie readiness powinno sprawdzać, czy `ROUTE` jest równe `north`, dzięki czemu Pod quarantine będzie Running, ale nie Ready. Zachowaj etykiety szablonów Pod i selektor Service `route-service=departures`, a następnie sprawdź gotowe wpisy EndpointSlice dla `departures`: tylko Pod stable powinien być gotowy do ruchu. Nie usuwaj żadnego Deploymentu, aby uzyskać ten wynik.


      ### Sonda HTTP dla relay {#relay-http-readiness}


      W zadaniu 021 sonda gotowości HTTP może zawodzić przy działającym serwerze. Sprawdź zdarzenia Poda i porównaj port oraz ścieżkę sondy z obsługą HTTP w `deployment.yaml`. Dostarczony relay odpowiada na `/` na porcie `8080`. Po poprawieniu obu pól poczekaj na rollout.


      ### Dwie dostępne repliki board {#maintenance-board-availability}


      W zadaniu 040 zachowaj żądane replicas=2 i availableReplicas=2. Skalowanie lub nieukończony rollout może naruszyć dowolną liczbę. Sprawdź zdarzenia Podów i rollout przed porównaniem JSON Deployment. Błąd polecenia rollout daje zewnętrzny marker przed polityką Python; błędy katalogu/startu Pythona mogą dać ten sam wynik.


      ### Efektywny budżet rolling update {#maintenance-rolling-budget}


      W zadaniu 040 zachowaj RollingUpdate z efektywnym surge jeden i zerem niedostępnych replik dla Deployment z dwiema replikami. maxSurge zaokrągla procenty w górę, maxUnavailable w dół, więc poprawne formy procentowe mogą pasować. Sprawdź strategy i oba pola. Nieczytelna/błędna obserwacja Deployment może dać strategy przed oceną liczby replik lub budżetu.


      ### Readiness używa endpointu ready {#maintenance-readiness-contract}


      W zadaniu 040 dostarczony worker sprawdza /, lecz kontrakt wymaga HTTP readiness na /ready portu 8080. Sprawdź sondę worker w szablonie Deployment: typ akcji, port, scheme i host. Akceptowany jest tylko HTTP bez nadpisania host. Poprawka zwykłej odpowiedzi sama nie naprawia konfiguracji gotowości.


      ### Działający handler ready {#maintenance-ready-response}


      W zadaniu 040 konfiguracja i działająca treść są osobnymi obserwacjami. Opublikuj handler /ready z treścią ready w worker, poczekaj na rollout i odczytaj http://127.0.0.1:8080/ready z każdego obserwowanego działającego Poda. Skonfigurowana ścieżka może nadal zwracać brak lub złą treść; błędy exec i lokalnego HTTP też blokują kontrolę.


      ### Gotowość producenta i zachowany interfejs {#progressive-producer-readiness}


      Pierwotny producent nie zakończył rollout lub nie obsługuje zachowanego interfejsu; początkowy port readiness różni się od nasłuchu, źródło HTTP jest źle zamontowane albo obserwacja API/exec zawiodła. Porównaj readiness z rzeczywistym portem i projekcją źródła z progressive-contract.json. Początkowo producent nasłuchuje na 8080, a readiness używa 9090. Podczas przełączenia zachowany producent musi utrzymać lokalny interfejs publikacji i gotowość; gotowy zamiennik nie zachowuje pierwotnej tożsamości. `cat progressive-contract.json; kubectl get deployments,pods -o wide`.


      ### Zachowane tożsamości obiektów publikacji {#progressive-retained-identities}


      Zmienił się UID pierwotnego obiektu publikacji; usunięcie i odtworzenie aplikacji, źródłowego ConfigMap lub ustalonego Service może zachować nazwę, ale zastępuje tożsamość zapisaną przez setup. Setup zachowuje UID Deployment producenta i źródłowego ConfigMap; przełączenie także UID zapasowego Deployment i istniejącego Service. Zmieniaj konfigurację, zachowując obiekty. Chronione zapisy setup są oddzielne od kopii roboczych; edycja kopii nie czyni nowego obiektu pierwotnym.


      ### Chronione dane faz i obserwacja {#progressive-observer-inputs}


      Kontrola producenta zatrzymała się bez szczegółowego markera; chronione dane setup, struktura aplikacji, start Pythona lub przerwana obserwacja API mogą uniemożliwić kontrolę źródła i publikacji. Kontrola przełączenia zatrzymała się bez szczegółowego markera; pierwotne lub fazowe dane tożsamości, struktura aplikacji, start Pythona lub przerwana obserwacja mogą uniemożliwić sprawdzenie zapasu i zachowanego producenta.


      ## Wypróbuj


      Otwórz laboratorium **kubernetes** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy usunięcie znacznika readiness powoduje ponowne uruchomienie kontenera?


      ```bash

      cd ~/lab/examples/probes

      bash run.sh

      kubectl -n lab-probes get pod probe

      kubectl -n lab-probes describe pod probe

      # Check readiness and liveness separately.

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Przejście readiness pozostawia licznik ponownych uruchomień bez zmian. Usunięcie znacznika liveness powoduje ponowne uruchomienie.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Un probe responde a un question sobre un contenedor. Startup controla las otras sondas; readiness controla la elegibilidad del tráfico; liveness puede reiniciar el contenedor. Es posible que un Running pod aún no esté listo.


      La disponibilidad, la identidad de los datos y el enrutamiento público responden a preguntas distintas. Un proceso listo puede publicar datos antiguos; un Service puede llegar a otro controlador. Compara la referencia a la fuente, la respuesta de la aplicación activa y los propietarios de endpoints listos antes de considerar la disponibilidad una publicación correcta. El Lab de sondas muestra transiciones de salud, no una recuperación completa de publicación y conmutación a la reserva.


      ### Disponibilidad de quarantine y endpoints del Service {#quarantine-readiness-and-endpoints}


      En el ejercicio 017, mantén el Pod `stable` listo y el proceso `quarantine` en ejecución con `ROUTE=retired`. Su comando de readiness debe comprobar si `ROUTE` es igual a `north`, de modo que el Pod quarantine esté Running pero no Ready. Conserva las etiquetas de las plantillas de Pod y el selector del Service `route-service=departures`, e inspecciona los endpoints listos de EndpointSlice para `departures`: solo el Pod stable debe estar listo para recibir tráfico. No elimines ninguno de los Deployments para lograrlo.


      ### Sonda HTTP de disponibilidad de relay {#relay-http-readiness}


      En el ejercicio 021, la sonda HTTP de disponibilidad puede fallar con el servidor activo. Revisa los eventos del Pod y compara el puerto y la ruta de la sonda con el servidor HTTP de `deployment.yaml`. El relay responde en `/` por el puerto `8080`. Tras corregir ambos campos, espera el despliegue.


      ### Dos réplicas disponibles de board {#maintenance-board-availability}


      En el reto 040, conserva replicas=2 deseadas y availableReplicas=2. Escalar o un rollout incompleto puede incumplir cualquiera de las cuentas. Revisa eventos de Pods y rollout antes de comparar JSON del Deployment. Un fallo del comando rollout produce el diagnóstico externo antes de la política Python; errores de directorio/arranque Python también pueden hacerlo.


      ### Presupuesto efectivo de rolling update {#maintenance-rolling-budget}


      En el reto 040, conserva RollingUpdate con surge efectivo uno y cero réplicas no disponibles para un Deployment de dos réplicas. maxSurge redondea porcentajes hacia arriba y maxUnavailable hacia abajo; formas porcentuales válidas pueden coincidir. Inspecciona strategy y ambos campos. Observaciones ilegibles/inválidas pueden dar strategy antes de interpretar cuentas o presupuesto.


      ### Readiness usa el endpoint ready {#maintenance-readiness-contract}


      En el reto 040, worker comprueba inicialmente /, pero el contrato exige readiness HTTP en /ready del puerto 8080. Inspecciona la sonda worker de la plantilla Deployment: acción, puerto, scheme y host. Solo se acepta HTTP sin sobrescribir host. Corregir la respuesta ordinaria no corrige por sí mismo la configuración de readiness.


      ### Handler ready en ejecución {#maintenance-ready-response}


      En el reto 040, configuración y contenido en ejecución son observaciones separadas. Publica el handler /ready con cuerpo ready en worker, espera el rollout y lee http://127.0.0.1:8080/ready desde cada Pod Running observado. La ruta configurada puede devolver contenido ausente o incorrecto; fallos exec y HTTP local también impiden comprobarla.


      ### Disponibilidad productora e interfaz conservada {#progressive-producer-readiness}


      El productor original no completó el despliegue o no sirve su interfaz conservada; el puerto readiness inicial difiere del servidor, la fuente HTTP está mal proyectada o falló la observación API/exec. Compare readiness con el puerto real y la proyección de progressive-contract.json. Al inicio el productor escucha en 8080 pero readiness usa 9090. Durante failover el productor restaurado debe mantener interfaz local y disponibilidad; un reemplazo listo no conserva la identidad original. `cat progressive-contract.json; kubectl get deployments,pods -o wide`.


      ### Identidades conservadas de objetos de publicación {#progressive-retained-identities}


      Cambió un UID original de publicación; borrar y recrear una carga, ConfigMap fuente o Service establecido puede conservar el nombre pero sustituye la identidad guardada por el setup. El setup conserva UID del Deployment productor y ConfigMap fuente; failover también los del Deployment de respaldo y Service establecido. Modifique configuración conservando objetos. Los registros protegidos son independientes de copias editables; cambiar una copia no convierte un reemplazo en original.


      ### Datos protegidos de fase y observación {#progressive-observer-inputs}


      La prueba productora se detuvo sin marcador detallado; evidencia protegida del setup, estructura de carga, inicio de Python o una observación API interrumpida pueden impedir las comprobaciones de fuente y publicación. La prueba failover se detuvo sin marcador detallado; datos originales o de fase de identidad, estructura de carga, inicio de Python u observación interrumpida pueden impedir comprobar respaldo y productor conservado.


      ## Pruébalo


      Abra el **Laboratorio kubernetes** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿Eliminar el marcador readiness reinicia el contenedor?


      ```bash

      cd ~/lab/examples/probes

      bash run.sh

      kubectl -n lab-probes get pod probe

      kubectl -n lab-probes describe pod probe

      # Check readiness and liveness separately.

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. La transición readiness deja el recuento de reinicios sin cambios. Al quitar el marcador liveness se produce un reinicio.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh`, luego `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Ein probe antwortet einem question über einen Container. Startup steuert die anderen Sonden; readiness steuert die Verkehrsberechtigung; liveness kann den Container neu starten. Ein Running pod kann noch nicht fertig sein.


      Bereitschaft, Datenidentität und öffentliches Routing beantworten verschiedene Fragen. Ein bereiter Prozess kann veraltete Daten veröffentlichen; ein Service kann einen anderen Controller erreichen. Vergleiche Quellreferenz, laufende Anwendungsantwort und Eigentümer bereiter Endpoints, bevor du Bereitschaft als erfolgreiche Veröffentlichung wertest. Das Probes-Lab zeigt Zustandswechsel, aber keine vollständige Wiederherstellung mit Umschaltung auf eine Reserve.


      ### Quarantine-Bereitschaft und Service-Endpunkte {#quarantine-readiness-and-endpoints}


      Halte in Aufgabe 017 den Pod `stable` bereit und den Prozess `quarantine` mit `ROUTE=retired` am Laufen. Sein Readiness-Befehl soll prüfen, ob `ROUTE` gleich `north` ist, sodass der Quarantine-Pod Running, aber nicht Ready ist. Behalte die Pod-Template-Labels und den Service-Selektor `route-service=departures` bei und prüfe die bereiten EndpointSlice-Einträge für `departures`: Nur der Stable-Pod soll für Datenverkehr bereit sein. Lösche keines der Deployments, um dieses Ergebnis zu erreichen.


      ### HTTP-Bereitschaftsprobe für relay {#relay-http-readiness}


      In Aufgabe 021 kann eine HTTP-Bereitschaftsprobe bei laufendem Server fehlschlagen. Prüfen Sie die Pod-Ereignisse und vergleichen Sie Port und Pfad der Probe mit dem HTTP-Server aus `deployment.yaml`. Der bereitgestellte relay antwortet unter `/` auf Port `8080`. Warten Sie nach der Korrektur beider Felder auf den Rollout.


      ### Zwei verfügbare board-Repliken {#maintenance-board-availability}


      Behalte in Quest 040 gewünschte replicas=2 und availableReplicas=2. Skalieren oder ein unvollständiger Rollout kann eine der Zahlen verletzen. Prüfe Pod-Ereignisse und Rollout vor dem Deployment-JSON-Vergleich. Ein Rollout-Befehlsfehler erreicht die äußere Diagnose vor der Python-Richtlinie; Arbeitsverzeichnis-/Python-Startfehler können dasselbe bewirken.


      ### Effektives Rolling-Update-Budget {#maintenance-rolling-budget}


      Behalte in Quest 040 RollingUpdate mit effektiv einer zusätzlichen und null nicht verfügbaren Repliken für ein Zwei-Repliken-Deployment. maxSurge rundet Prozente auf, maxUnavailable ab; passende Prozentformen können den Vertrag erfüllen. Prüfe strategy und beide Felder. Unlesbare/fehlerhafte Deployment-Beobachtungen können strategy melden, bevor Anzahl oder Budget interpretierbar sind.


      ### Readiness verwendet den ready-Endpunkt {#maintenance-readiness-contract}


      In Quest 040 prüft der gelieferte worker /, der Vertrag verlangt aber HTTP-Readiness auf /ready an Port 8080. Prüfe die worker-Probe der Deployment-Vorlage samt Aktion, Port, scheme und host. Akzeptiert wird nur HTTP ohne Host-Override. Eine korrigierte normale Antwort repariert die Readiness-Konfiguration nicht automatisch.


      ### Laufender ready-Handler {#maintenance-ready-response}


      In Quest 040 sind Konfiguration und laufender Inhalt getrennte Beobachtungen. Veröffentliche /ready mit Antwort ready im worker, warte auf den Rollout und lies http://127.0.0.1:8080/ready aus jedem beobachteten laufenden Pod. Ein konfigurierter Pfad kann noch fehlenden oder falschen Inhalt liefern; auch exec- und lokale HTTP-Fehler verhindern die Antwortprüfung.


      ### Produzentenbereitschaft und erhaltene Schnittstelle {#progressive-producer-readiness}


      Der ursprüngliche Produzent ist nicht ausgerollt oder bedient seine erhaltene Schnittstelle nicht; der anfängliche Readiness-Port weicht vom Listener ab, die HTTP-Quelle ist falsch eingebunden oder API-/exec-Beobachtung schlug fehl. Vergleichen Sie Readiness mit tatsächlichem Listener und Quellprojektion aus progressive-contract.json. Anfangs hört der Produzent auf 8080, Readiness nutzt 9090. Beim Failover muss der erhaltene Produzent seine lokale Publikationsschnittstelle und Bereitschaft bewahren; ein bereiter Ersatz bewahrt die ursprüngliche Identität nicht. `cat progressive-contract.json; kubectl get deployments,pods -o wide`.


      ### Erhaltene Identitäten der Publikationsobjekte {#progressive-retained-identities}


      Die UID eines ursprünglichen Publikationsobjekts hat sich geändert; Löschen und Neuerstellen von Anwendung, Quell-ConfigMap oder bestehendem Service kann den Namen bewahren, ersetzt jedoch die im Setup festgehaltene Identität. Das Setup bewahrt UIDs von Produzenten-Deployment und Quell-ConfigMap, beim Failover zusätzlich Ersatz-Deployment und bestehendem Service. Ändern Sie die Konfiguration unter Erhalt der Objekte. Geschützte Setup-Belege sind von editierbaren Kopien getrennt; eine Kopienänderung macht kein Ersatzobjekt zum Original.


      ### Geschützte Phasenbelege und Beobachtung {#progressive-observer-inputs}


      Die Produzentenprüfung endete ohne Detailmarker; geschützte Setup-Belege, Workload-Struktur, Python-Start oder eine unterbrochene API-Beobachtung können den Abschluss der Quell-/Publikationsprüfung verhindern. Die Failover-Prüfung endete ohne Detailmarker; ursprüngliche oder phasenbezogene Identitätsbelege, Workload-Struktur, Python-Start oder eine unterbrochene Beobachtung können die Prüfung von Ersatz und erhaltenem Produzenten verhindern.


      ## Probieren Sie es aus


      Öffnen Sie das **kubernetes Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Wird der Container durch das Löschen der Markierung readiness neu gestartet?


      ```bash

      cd ~/lab/examples/probes

      bash run.sh

      kubectl -n lab-probes get pod probe

      kubectl -n lab-probes describe pod probe

      # Check readiness and liveness separately.

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Der readiness-Übergang lässt die Neustartanzahl unverändert. Das Entfernen des liveness-Markers führt dann zu einem Neustart.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das vollständige Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-probes
kubernetes-8:
  profile: kubernetes
  example: placement
  source_hash: de0fdaf2f5f2f0bb48b1545d6cb6eb5850f33f68e89e3cd9de0a3cb0da7fe21e
  content:
    en: 'Scheduling first filters eligible nodes, then ranks the candidates. A selector, affinity rule or taint can exclude a node even when it has spare CPU. Resource requests are a separate admission constraint.


      ### Node selector and available CPU {#relay-scheduling-limits}


      In quest 024, an impossible node selector and a CPU request that exceeds the node''s capacity both prevent scheduling. Inspect the Pod events, remove the fictional zone constraint, and choose a small request. Apply the repaired Deployment and check that the relay rollout completes and its Pod is ready.


      ## Try it


      Open the **kubernetes Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Will a tiny CPU request bypass a node selector that matches no node?


      ```bash

      cd ~/lab/examples/placement

      bash run.sh

      kubectl -n lab-placement get pod placed -o wide

      kubectl -n lab-placement describe pod placed

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The pod remains Pending until a node receives the required label.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Планировщик сначала отбирает допустимые узлы, затем выбирает среди них. Selector, affinity или taint могут исключить узел при свободном CPU. Запросы ресурсов — отдельное ограничение.


      ### Селектор узла и доступный CPU {#relay-scheduling-limits}


      В квесте 024 невозможный node selector и запрос CPU сверх емкости узла мешают планированию. Изучите события Pod, уберите вымышленное ограничение зоны и задайте небольшой запрос. Примените исправленный Deployment и проверьте завершение rollout и готовность Pod relay.


      ## Попробуйте


      Откройте лабораторию **kubernetes**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Маленький запрос CPU позволит обойти selector, которому не соответствует ни один узел?


      ```bash

      cd ~/lab/examples/placement

      bash run.sh

      kubectl -n lab-placement get pod placed -o wide

      kubectl -n lab-placement describe pod placed

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Pod остаётся Pending, пока узел не получит нужную метку.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Planowanie najpierw filtruje kwalifikujące się węzły, a następnie klasyfikuje kandydatów. Reguła selector, affinity lub taint może wykluczyć węzeł, nawet jeśli ma on zapasowe CPU. Żądania zasobów stanowią osobne ograniczenie dostępu.


      ### Selektor węzła i dostępny CPU {#relay-scheduling-limits}


      W zadaniu 024 niemożliwy node selector i żądanie CPU przekraczające pojemność węzła uniemożliwiają planowanie. Sprawdź zdarzenia Poda, usuń fikcyjne ograniczenie strefy i wybierz małe żądanie. Zastosuj poprawiony Deployment i sprawdź zakończenie rollout oraz gotowość Poda relay.


      ## Wypróbuj


      Otwórz laboratorium **kubernetes** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy małe żądanie CPU ominie węzeł selector, który nie pasuje do żadnego węzła?


      ```bash

      cd ~/lab/examples/placement

      bash run.sh

      kubectl -n lab-placement get pod placed -o wide

      kubectl -n lab-placement describe pod placed

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Pod pozostaje Pending do czasu, aż węzeł otrzyma wymaganą etykietę.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'La programación primero filtra los nodos elegibles y luego clasifica a los candidatos. Una regla selector, affinity o taint puede excluir un nodo incluso cuando tiene CPU de repuesto. Las solicitudes de recursos son una restricción de admisión separada.


      ### Selector del nodo y CPU disponible {#relay-scheduling-limits}


      En el ejercicio 024, un node selector imposible y una petición de CPU superior a la capacidad del nodo impiden la planificación. Inspecciona los eventos del Pod, elimina la restricción de zona ficticia y elige una petición pequeña. Aplica el Deployment reparado y comprueba que termine el rollout y que el Pod relay esté listo.


      ## Pruébalo


      Abra el laboratorio **kubernetes** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿Una pequeña solicitud CPU omitirá un nodo selector que no coincida con ningún nodo?


      ```bash

      cd ~/lab/examples/placement

      bash run.sh

      kubectl -n lab-placement get pod placed -o wide

      kubectl -n lab-placement describe pod placed

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. El pod sigue siendo Pending hasta que un nodo recibe la etiqueta requerida.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh`, luego `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Beim Scheduling werden zunächst geeignete Knoten gefiltert und dann werden die Kandidaten in eine Rangfolge gebracht. Eine selector-, affinity-Regel oder taint kann einen Knoten ausschließen, selbst wenn er über einen Ersatz-Knoten CPU verfügt. Ressourcenanfragen stellen eine separate Zulassungsbeschränkung dar.


      ### Node-Selektor und verfügbare CPU {#relay-scheduling-limits}


      In Aufgabe 024 verhindern ein unmöglicher Node-Selector und eine CPU-Anforderung über der Knotenkapazität die Einplanung. Prüfe die Pod-Ereignisse, entferne die fiktive Zonenbeschränkung und wähle eine kleine Anforderung. Wende das reparierte Deployment an und prüfe den abgeschlossenen Rollout und die Bereitschaft des Relay-Pods.


      ## Probieren Sie es aus


      Öffnen Sie das **kubernetes Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Wird eine kleine CPU-Anfrage einen Knoten selector umgehen, der mit keinem Knoten übereinstimmt?


      ```bash

      cd ~/lab/examples/placement

      bash run.sh

      kubectl -n lab-placement get pod placed -o wide

      kubectl -n lab-placement describe pod placed

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Der pod bleibt Pending, bis ein Knoten das erforderliche Label erhält.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-placement
kubernetes-9:
  profile: kubernetes
  example: resources
  source_hash: d7b7f94be4a7a6078523e2aa7dbf77a9cdfa7990f7f8f7ebd2e172e7e2ce75d0
  content:
    en: 'For container-level resources, scheduling accounts for both application demand and startup phases. Ordinary application requests combine, while initialization has its own peak demand; restartable initializers also contribute while later phases run. A corrected application request can therefore leave the Pod unschedulable. Use the effective request and the declared budget, rather than inferring scheduler capacity from runtime CPU usage or a host-container quota. The resources Labs do not rehearse this complete coupled phase recovery. Where an explicit Pod-level request is supported, it takes scheduling priority.


      Requests reserve schedulable capacity; limits constrain a running container. CPU throttling, container OOM and node-pressure eviction are different events. This experiment contrasts an impossible request with a running, limited container.


      Memory has phase and lifetime boundaries. An initializer and the main process can have different resource limits; memory-backed file pages can outlive the process that allocated them. Compare the allocation pattern, the active resource envelope and the payload lifetime before interpreting a restart as a clean start. Declared size, physically allocated blocks and published metadata are different observations. The resources Lab exercises limits and runtime behavior, not complete recovery of a multi-phase resident dataset.


      CPU pressure is a relationship between runnable work, incoming demand and the available quota. A serving process can lose wasted work and still be throttled by active consumers. Compare native counter changes with consumer activity and current input policy; a quiet service and a progressing consumer answer different questions. Observations themselves cost CPU. The resources Lab demonstrates bounded CFS observations, not a full capacity study or a production latency SLO.


      ### Existing board objects {#board-retained-objects}


      In quest 034, repair the existing Deployment with one replica and retain the original Deployment and source ConfigMap UIDs. Deleting and recreating an object changes its UID even with the same name. Compare current API metadata with the recorded identities; an API read failure is not proof of replacement.


      ### Worker CPU quantities {#board-worker-cpu}


      In quest 034, compare worker resources with cpu-contract.json: request 100m and limit 300m. The supplied values 1000 mean whole CPUs, not millicores. The first probe checks both worker quantities before the phase policy runs. Missing or malformed values also fail. If data cannot be read, inspect Deployment JSON, Python, dq_check and the protected facts before interpreting the quantities.


      ### CPU across startup phases {#board-startup-budget}


      In quest 034, fixing worker alone can leave the initializer unschedulable. Compare all container requests with the 100m phase ceiling in cpu-contract.json. Ordinary initialization contributes its peak; restartable initializers also remain active in later phases. An explicit Pod request takes priority, and overhead is added. Invalid quantities or failed workload observations also prevent proving the budget.


      ### Original initializer and rollout {#board-original-initializer}


      In quest 034, keep prepare-route as a normal initializer and retain both supplied images. It must terminate with exit code 0 before current worker Pods become Ready. Check scheduling events, initContainerStatuses and rollout status. A restartPolicy of Always changes the contract and can trigger the image diagnostic too. Rollout failure stops the outer probe early; unreadable facts, Python/helper startup or malformed later observations can also produce its fallback.


      ### Retained source data {#board-source-data}


      In quest 034, route-source supplies the original index.html. Retain every recorded ConfigMap data entry while repairing CPU requests; changing or removing source data can hide a delivery fault. Compare live data with the supplied source record. Resolve API access errors before concluding that a value changed.


      ### Retained worker memory {#board-retained-memory}


      In quest 034, repair CPU without altering worker memory request 16Mi or limit 64Mi. A broad replacement of resources can remove those fields. Inspect worker resources in Deployment JSON, including units. Missing fields, invalid quantities, failed API reads or an unavailable Python/helper also make the memory observation fail.


      ### Prepared route over HTTP {#board-route-http}


      In quest 034, prepare-route copies /source/index.html into the shared route volume, and worker serves /site on port 8080. A Ready Pod alone does not prove this content path. After rollout, request http://127.0.0.1:8080 from worker in the selected app=board Pod; expect north. Pod lookup, exec and HTTP errors also prevent this observation.


      ## Try it


      Open the **kubernetes Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Does a high limit give the scheduler more available CPU?


      ```bash

      cd ~/lab/examples/resources

      bash run.sh

      kubectl -n lab-resources get pods

      kubectl -n lab-resources describe pod oversized

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The oversized request cannot fit. The bounded pod runs, is Burstable, and exposes its CPU and memory limits in cgroup files.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'При ресурсах, заданных для контейнеров, планирование учитывает приложение и фазы запуска. Запросы обычных контейнеров складываются, у инициализации есть собственный пик; перезапускаемые init-контейнеры продолжают участвовать и в последующих фазах. Поэтому после исправления запроса приложения Pod всё ещё может не размещаться. Сопоставляйте эффективный запрос и объявленный бюджет, не выводите ёмкость планировщика из фактического потребления CPU или квоты host-контейнера. Lab ресурсов не воспроизводят полное связанное восстановление фаз. Там, где поддерживается явный запрос на уровне Pod, он имеет приоритет при планировании.


      Requests учитываются при размещении; limits ограничивают работающий контейнер. CPU throttling, OOM контейнера и выселение при давлении узла — разные события. В опыте сравниваются невозможный request и работающий контейнер с лимитами.


      У памяти есть границы фаз и времени жизни. У init-контейнера и основного процесса могут быть разные лимиты; страницы файлов в памяти могут пережить создавший их процесс. Сопоставляйте характер выделения, действующий бюджет и срок жизни данных, прежде чем считать рестарт чистым запуском. Объявленный размер, реально выделенные блоки и опубликованные метаданные — разные наблюдения. Lab ресурсов показывает лимиты и поведение runtime, но не полное восстановление резидентных данных через несколько фаз.


      CPU-нагрузка связывает готовую к исполнению работу, входящий спрос и доступную квоту. Обслуживающий процесс может избавиться от бесполезной работы и всё ещё испытывать throttling из-за активных потребителей. Сопоставляйте изменения реальных счётчиков с активностью потребителей и текущей политикой входных параметров: тихий сервис и работающий потребитель отвечают на разные вопросы. Наблюдения тоже расходуют CPU. Lab ресурсов показывает ограниченные измерения CFS, но не полное исследование ёмкости или production latency SLO.


      ### Исходные объекты board {#board-retained-objects}


      В квесте 034 исправляйте существующий Deployment с одной репликой и сохраните исходные UID Deployment и ConfigMap источника. Удаление и пересоздание меняет UID даже при том же имени. Сравните метаданные API с записанными идентичностями; ошибка чтения API не доказывает замену.


      ### Величины CPU worker {#board-worker-cpu}


      В квесте 034 сравните ресурсы worker с cpu-contract.json: request 100m и limit 300m. Исходные значения 1000 означают целые CPU, а не миллиядра. Первая проверка сравнивает обе величины worker до политики фаз. Отсутствующие или неверные значения также дают отказ. При ошибке чтения проверьте JSON Deployment, Python, dq_check и защищённые факты до оценки величин.


      ### CPU в фазах запуска {#board-startup-budget}


      В квесте 034 исправления только worker недостаточно, если инициализатор не планируется. Сравните запросы всех контейнеров с пределом фаз 100m из cpu-contract.json. Обычная инициализация вносит пиковый запрос; перезапускаемые инициализаторы остаются активными в следующих фазах. Явный запрос Pod имеет приоритет, overhead добавляется. Неверные величины или ошибки наблюдения также мешают подтвердить бюджет.


      ### Исходный инициализатор и rollout {#board-original-initializer}


      В квесте 034 сохраните prepare-route как обычный инициализатор и оба исходных образа. Он должен завершиться с кодом 0 до готовности текущих Pod worker. Проверьте события планирования, initContainerStatuses и rollout. restartPolicy Always меняет контракт и может также вызвать диагностику образов. Ошибка rollout прерывает внешнюю проверку; нечитаемые факты, запуск Python/модуля или неверные последующие наблюдения также могут дать fallback.


      ### Сохранённые данные источника {#board-source-data}


      В квесте 034 route-source содержит исходный index.html. Исправляя запросы CPU, сохраните все записанные поля данных ConfigMap: изменение или удаление источника может скрыть ошибку доставки. Сравните текущие данные с исходной записью. Устраните ошибки доступа API до вывода об изменении значения.


      ### Сохранённая память worker {#board-retained-memory}


      В квесте 034 исправляйте CPU, не меняя request памяти worker 16Mi и limit 64Mi. Полная замена resources может удалить эти поля. Проверьте ресурсы worker в JSON Deployment, включая единицы. Отсутствие полей, неверные величины, ошибки API или недоступность Python/модуля также мешают проверке памяти.


      ### Подготовленный маршрут по HTTP {#board-route-http}


      В квесте 034 prepare-route копирует /source/index.html в общий том route, а worker обслуживает /site на порту 8080. Готовность Pod сама по себе не доказывает этот путь содержимого. После rollout запросите http://127.0.0.1:8080 из worker выбранного Pod app=board; ожидается north. Ошибки поиска Pod, exec и HTTP также мешают наблюдению.


      ## Попробуйте


      Откройте лабораторию **kubernetes**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Большой limit добавляет планировщику доступный CPU?


      ```bash

      cd ~/lab/examples/resources

      bash run.sh

      kubectl -n lab-resources get pods

      kubectl -n lab-resources describe pod oversized

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Непомерный request не помещается. Ограниченный pod работает, получает класс Burstable, а файлы cgroup показывают лимиты CPU и памяти.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Przy zasobach zadanych dla kontenerów planowanie uwzględnia aplikację i fazy startu. Żądania zwykłych kontenerów aplikacji są łączone, inicjalizacja ma własny szczyt, a restartowalne inicjalizatory uczestniczą również w późniejszych fazach. Poprawienie żądania aplikacji może więc nie wystarczyć do zaplanowania Poda. Porównuj efektywne żądanie z zadeklarowanym budżetem, zamiast wnioskować o pojemności schedulera z użycia CPU lub limitu kontenera hosta. Lab zasobów nie odtwarzają pełnego odzyskiwania między fazami. Jeśli obsługiwane jest jawne żądanie na poziomie Poda, ma ono pierwszeństwo przy planowaniu.


      Requests rezerwowa planowalna pojemność; limits ogranicza działający kontener. CPU throttling, kontener OOM i eksmisja pod wpływem nacisku na węzeł to różne zdarzenia. Ten eksperyment porównuje niemożliwy request z działającym, ograniczonym kontenerem.


      Pamięć ma granice faz i czasu życia. Inicjalizator i proces główny mogą mieć różne limity; strony plików w pamięci mogą przetrwać proces, który je przydzielił. Porównaj wzorzec alokacji, rzeczywisty budżet i czas życia danych, zanim uznasz restart za czysty start. Zadeklarowany rozmiar, rzeczywiście przydzielone bloki i opublikowane metadane to różne obserwacje. Lab zasobów pokazuje limity i zachowanie runtime, ale nie pełne odzyskiwanie rezydentnych danych przez kilka faz.


      Presja CPU wiąże wykonywalną pracę, napływ żądań i dostępną kwotę. Proces serwera może pozbyć się zbędnej pracy i nadal być dławiony przez aktywnych odbiorców. Porównuj zmiany natywnych liczników z aktywnością odbiorców i bieżącą polityką wejść; cichy serwis i postępujący odbiorca odpowiadają na różne pytania. Obserwacje też zużywają CPU. Lab zasobów pokazuje ograniczone pomiary CFS, ale nie pełne badanie pojemności ani produkcyjne SLO opóźnienia.


      ### Istniejące obiekty board {#board-retained-objects}


      W zadaniu 034 napraw istniejący Deployment z jedną repliką i zachowaj oryginalne UID Deployment oraz źródłowego ConfigMap. Usunięcie i odtworzenie zmienia UID nawet przy tej samej nazwie. Porównaj metadane API z zapisanymi tożsamościami; błąd odczytu API nie dowodzi zastąpienia.


      ### Wielkości CPU worker {#board-worker-cpu}


      W zadaniu 034 porównaj zasoby worker z cpu-contract.json: request 100m i limit 300m. Dostarczone wartości 1000 oznaczają całe CPU, nie millicore. Pierwsza sonda sprawdza obie wielkości worker przed polityką faz. Brakujące lub błędne wartości też zawodzą. Przy błędzie odczytu sprawdź JSON Deployment, Python, dq_check i chronione dane faktów przed oceną wielkości.


      ### CPU w fazach startu {#board-startup-budget}


      W zadaniu 034 sama poprawka worker może pozostawić nieschedulowalny inicjalizator. Porównaj żądania wszystkich kontenerów z limitem faz 100m w cpu-contract.json. Zwykła inicjalizacja wnosi szczytowe żądanie; restartowalne inicjalizatory działają też w późniejszych fazach. Jawne żądanie Poda ma priorytet, a overhead jest dodawany. Błędne wielkości lub odczyty workload też uniemożliwiają potwierdzenie budżetu.


      ### Oryginalny inicjalizator i rollout {#board-original-initializer}


      W zadaniu 034 zachowaj prepare-route jako zwykły inicjalizator i oba dostarczone obrazy. Musi zakończyć się kodem 0 przed gotowością bieżących Podów worker. Sprawdź zdarzenia planowania, initContainerStatuses i rollout. restartPolicy Always zmienia kontrakt i może też wywołać diagnostykę obrazów. Błąd rollout przerywa sondę wcześniej; nieczytelne fakty, start Pythona/modułu lub błędne późniejsze obserwacje też mogą dać fallback.


      ### Zachowane dane źródła {#board-source-data}


      W zadaniu 034 route-source dostarcza oryginalny index.html. Zachowaj wszystkie zapisane wpisy danych ConfigMap podczas poprawiania CPU; zmiana lub usunięcie źródła może ukryć problem dostarczenia. Porównaj bieżące dane z dostarczonym zapisem. Wyjaśnij błędy dostępu API przed stwierdzeniem zmiany wartości.


      ### Zachowana pamięć worker {#board-retained-memory}


      W zadaniu 034 napraw CPU bez zmiany pamięci worker: request 16Mi i limit 64Mi. Zastąpienie całego resources może usunąć te pola. Sprawdź zasoby worker w JSON Deployment wraz z jednostkami. Brak pól, błędne wielkości, odczyty API lub niedostępny Python/moduł też blokują kontrolę pamięci.


      ### Przygotowana trasa przez HTTP {#board-route-http}


      W zadaniu 034 prepare-route kopiuje /source/index.html do wspólnego wolumenu route, a worker serwuje /site na porcie 8080. Gotowy Pod nie dowodzi działania tej ścieżki treści. Po rollout wywołaj http://127.0.0.1:8080 z worker wybranego Poda app=board; oczekuj north. Błędy wyszukania Poda, exec i HTTP też blokują obserwację.


      ## Wypróbuj


      Otwórz laboratorium **kubernetes** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy wysoki poziom limit zapewnia programowi planującemu większą dostępność CPU?


      ```bash

      cd ~/lab/examples/resources

      bash run.sh

      kubectl -n lab-resources get pods

      kubectl -n lab-resources describe pod oversized

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Ponadwymiarowy request nie pasuje. Działa ograniczony pod, to Burstable i udostępnia swoje CPU i pamięć limits w plikach cgroup.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Con recursos definidos por contenedor, la planificación considera la aplicación y las fases de arranque. Las solicitudes normales de aplicación se combinan, la inicialización tiene su propio pico y los inicializadores reiniciables contribuyen en fases posteriores. Corregir la solicitud de la aplicación puede dejar el Pod sin poder planificarse. Compara la solicitud efectiva con el presupuesto declarado; no deduzcas capacidad del planificador a partir de uso CPU o cuota del contenedor host. Los Labs de recursos no ensayan esta recuperación completa entre fases. Cuando se admite una solicitud explícita a nivel de Pod, esta tiene prioridad para la planificación.


      Capacidad programable de reserva Requests; limits restringe un contenedor en ejecución. CPU throttling, contenedor OOM y desalojo por presión de nodo son eventos diferentes. Este experimento contrasta un request imposible con un contenedor limitado y en funcionamiento.


      La memoria tiene límites de fase y de vida útil. Un inicializador y el proceso principal pueden tener límites distintos; las páginas de archivos en memoria pueden sobrevivir al proceso que las asignó. Compara el patrón de asignación, el presupuesto efectivo y la vida de los datos antes de interpretar un reinicio como un comienzo limpio. Tamaño declarado, bloques realmente asignados y metadatos publicados son observaciones distintas. El Lab de recursos muestra límites y comportamiento de runtime, no una recuperación completa de datos residentes entre varias fases.


      La presión CPU relaciona trabajo ejecutable, demanda entrante y cuota disponible. Un proceso servidor puede eliminar trabajo inútil y seguir sufriendo throttling por consumidores activos. Compara cambios de contadores nativos con actividad de consumidores y política de entradas actual; un servicio tranquilo y un consumidor que progresa responden a preguntas distintas. Observar también consume CPU. El Lab de recursos muestra mediciones CFS acotadas, no un estudio completo de capacidad ni un SLO de latencia de producción.


      ### Objetos existentes de board {#board-retained-objects}


      En el reto 034, repara el Deployment existente con una réplica y conserva los UID originales del Deployment y ConfigMap de origen. Borrar y recrear cambia el UID incluso con el mismo nombre. Compara los metadatos API con las identidades registradas; un fallo de lectura no demuestra una sustitución.


      ### Cantidades CPU de worker {#board-worker-cpu}


      En el reto 034, compara recursos de worker con cpu-contract.json: request 100m y limit 300m. Los valores iniciales 1000 son CPU enteras, no millicores. La primera sonda comprueba ambas cantidades antes de la política de fases. Valores ausentes o inválidos también fallan. Si no se leen los datos, revisa JSON del Deployment, Python, dq_check y los datos protegidos antes de interpretar las cantidades.


      ### CPU durante el arranque {#board-startup-budget}


      En el reto 034, corregir solo worker puede dejar el inicializador sin poder planificarse. Compara todas las peticiones con el techo de fase 100m de cpu-contract.json. La inicialización normal aporta su pico; los inicializadores reiniciables siguen activos después. Una petición explícita del Pod tiene prioridad y se añade overhead. Cantidades inválidas u observaciones fallidas también impiden demostrar el presupuesto.


      ### Inicializador original y rollout {#board-original-initializer}


      En el reto 034, conserva prepare-route como inicializador normal y ambas imágenes suministradas. Debe terminar con código 0 antes de que los Pods worker actuales estén Ready. Revisa eventos de planificación, initContainerStatuses y rollout. restartPolicy Always cambia el contrato y también puede activar el diagnóstico de imágenes. Un fallo del rollout detiene la sonda antes; datos ilegibles, arranque de Python/módulo u observaciones posteriores inválidas también pueden producir el fallback.


      ### Datos de origen conservados {#board-source-data}


      En el reto 034, route-source aporta el index.html original. Conserva todas las entradas registradas del ConfigMap al reparar CPU; cambiar o borrar el origen puede ocultar un fallo de entrega. Compara los datos actuales con el registro suministrado. Resuelve errores de acceso API antes de concluir que cambió un valor.


      ### Memoria conservada de worker {#board-retained-memory}


      En el reto 034, repara CPU sin cambiar request de memoria 16Mi ni limit 64Mi de worker. Sustituir resources entero puede eliminar esos campos. Inspecciona los recursos en JSON del Deployment, incluidas las unidades. Campos ausentes, cantidades inválidas, fallos API o Python/módulo no disponible también hacen fallar la observación.


      ### Ruta preparada por HTTP {#board-route-http}


      En el reto 034, prepare-route copia /source/index.html al volumen route compartido y worker sirve /site en el puerto 8080. Un Pod Ready no demuestra esa ruta del contenido. Tras el rollout, solicita http://127.0.0.1:8080 desde worker del Pod seleccionado app=board; espera north. Los fallos al buscar el Pod, de exec y HTTP también impiden observarlo.


      ## Pruébalo


      Abra el **Laboratorio kubernetes** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿Un limit alto le da al programador más CPU disponible?


      ```bash

      cd ~/lab/examples/resources

      bash run.sh

      kubectl -n lab-resources get pods

      kubectl -n lab-resources describe pod oversized

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. El oversized request no encaja. El pod limitado que se ejecuta es Burstable y expone su CPU y la memoria limits en archivos cgroup.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh`, luego `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Bei Ressourcenangaben je Container berücksichtigt das Scheduling Anwendung und Startphasen. Anforderungen normaler Anwendungscontainer werden kombiniert, Initialisierung hat einen eigenen Spitzenbedarf; neu startbare Initialisierer tragen auch in späteren Phasen bei. Ein korrigierter Anwendungsrequest kann den Pod deshalb weiterhin unplanbar lassen. Vergleiche effektive Anforderung und deklariertes Budget, statt Scheduler-Kapazität aus CPU-Nutzung oder einer Host-Container-Quote abzuleiten. Die Ressourcen-Labs üben diese vollständige gekoppelte Phasenwiederherstellung nicht. Ein ausdrücklich gesetzter Request auf Pod-Ebene hat Vorrang beim Scheduling, sofern unterstützt.


      Requests reservierte planbare Kapazität; limits schränkt einen laufenden Container ein. CPU throttling, Container OOM und Knotendruckräumung sind unterschiedliche Ereignisse. Dieses Experiment stellt eine unmögliche Anfrage einem laufenden, begrenzten Container gegenüber.


      Speicher hat Phasen- und Lebensdauergrenzen. Initialisierer und Hauptprozess können unterschiedliche Limits haben; speicherbasierte Dateiseiten können den zuweisenden Prozess überleben. Vergleiche Zuweisungsmuster, wirksames Budget und Datenlebensdauer, bevor du einen Neustart als sauberen Anfang interpretierst. Deklarierte Größe, tatsächlich zugewiesene Blöcke und veröffentlichte Metadaten sind verschiedene Beobachtungen. Das Ressourcen-Lab zeigt Limits und Laufzeitverhalten, aber keine vollständige Wiederherstellung eines mehrphasigen residenten Datensatzes.


      CPU-Druck ist eine Beziehung zwischen ausführbarer Arbeit, eingehender Nachfrage und verfügbarer Quota. Ein bedienender Prozess kann unnütze Arbeit verlieren und durch aktive Verbraucher weiterhin gedrosselt werden. Vergleiche native Zähleränderungen mit Verbraucheraktivität und aktueller Eingaberichtlinie; ein ruhiger Dienst und ein fortschreitender Verbraucher beantworten verschiedene Fragen. Beobachtungen selbst kosten CPU. Das Ressourcen-Lab zeigt begrenzte CFS-Messungen, aber keine vollständige Kapazitätsstudie oder ein Produktions-Latenz-SLO.


      ### Vorhandene board-Objekte {#board-retained-objects}


      Repariere in Quest 034 das vorhandene Deployment mit einer Replik und erhalte die ursprünglichen UIDs von Deployment und Quell-ConfigMap. Löschen und Neuerstellen ändert die UID auch bei gleichem Namen. Vergleiche API-Metadaten mit aufgezeichneten Identitäten; ein API-Lesefehler beweist keinen Austausch.


      ### CPU-Mengen von worker {#board-worker-cpu}


      Vergleiche in Quest 034 worker-Ressourcen mit cpu-contract.json: Request 100m und Limit 300m. Die gelieferten Werte 1000 bedeuten ganze CPUs, keine Millicores. Die erste Probe prüft beide worker-Mengen vor der Phasenrichtlinie. Fehlende oder ungültige Werte scheitern ebenfalls. Bei Lesefehlern prüfe Deployment-JSON, Python, dq_check und geschützte Fakten vor der Mengenbewertung.


      ### CPU in Startphasen {#board-startup-budget}


      In Quest 034 kann der Initialisierer nach alleiniger worker-Korrektur weiterhin nicht planbar sein. Vergleiche alle Container-Requests mit der Phasengrenze 100m aus cpu-contract.json. Normale Initialisierung trägt ihren Spitzenbedarf bei; neustartbare Initialisierer laufen auch später weiter. Ein expliziter Pod-Request hat Vorrang, Overhead wird addiert. Ungültige Mengen oder fehlgeschlagene Workload-Beobachtungen verhindern den Budgetnachweis.


      ### Ursprünglicher Initialisierer und Rollout {#board-original-initializer}


      Behalte in Quest 034 prepare-route als normalen Initialisierer und beide gelieferten Images. Er muss mit Code 0 enden, bevor aktuelle worker-Pods Ready sind. Prüfe Planungsereignisse, initContainerStatuses und Rollout. restartPolicy Always ändert den Vertrag und kann auch die Image-Diagnose auslösen. Ein Rollout-Fehler stoppt die äußere Probe früh; unlesbare Fakten, Python-/Modulstart oder fehlerhafte spätere Beobachtungen können ebenfalls den Fallback auslösen.


      ### Erhaltene Quelldaten {#board-source-data}


      In Quest 034 liefert route-source die ursprüngliche index.html. Erhalte alle aufgezeichneten ConfigMap-Dateneinträge bei der CPU-Reparatur; Ändern oder Löschen der Quelle kann einen Lieferfehler verdecken. Vergleiche Live-Daten mit dem gelieferten Datensatz. Kläre API-Zugriffsfehler vor der Schlussfolgerung einer Wertänderung.


      ### Erhaltener worker-Speicher {#board-retained-memory}


      Repariere in Quest 034 CPU ohne Änderung des worker-Speicher-Requests 16Mi oder Limits 64Mi. Ein vollständiger Austausch von resources kann diese Felder entfernen. Prüfe worker-Ressourcen im Deployment-JSON samt Einheiten. Fehlende Felder, ungültige Mengen, API-Lesefehler oder nicht verfügbares Python/Modul verhindern ebenfalls die Speicherprüfung.


      ### Vorbereitete Route über HTTP {#board-route-http}


      In Quest 034 kopiert prepare-route /source/index.html ins gemeinsame route-Volume; worker liefert /site auf Port 8080 aus. Ein Ready-Pod beweist diesen Inhaltspfad nicht. Rufe nach dem Rollout http://127.0.0.1:8080 aus worker des ausgewählten app=board-Pods ab; erwartet wird north. Auch Pod-Suche, exec- und HTTP-Fehler verhindern diese Beobachtung.


      ## Probieren Sie es aus


      Öffnen Sie das **kubernetes Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und prüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Bietet ein hoher limit dem Scheduler mehr verfügbares CPU?


      ```bash

      cd ~/lab/examples/resources

      bash run.sh

      kubectl -n lab-resources get pods

      kubectl -n lab-resources describe pod oversized

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Die Anfrage oversized passt nicht. Der begrenzte pod wird ausgeführt, ist Burstable und stellt seinen CPU und seinen Speicher limits in cgroup-Dateien bereit.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
