      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. include działa, ale jego nieoznaczone dziecko nie. Statyczny import dziedziczy swój znacznik.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Las importaciones estáticas amplían las tareas antes; dynamic incluye tareas de elección durante la ejecución. Las etiquetas en un include seleccionan la instrucción include, por lo que aún se pueden omitir los niños sin etiquetar. Tareas de paquete de roles con defaults, handlers y plantillas bajo contrato compartido.


      En el ejercicio 046, una etiqueta `inspect` en la tarea copy de entrega cambiaría un banner sano durante la inspección. Deja solo la etiqueta `deploy` en la tarea copy y `inspect` en la tarea stat. Lista las tareas seleccionadas, ejecuta la inspección y comprueba su recap y el banner `north-46` sin cambios en los tres hosts; el nombre de una etiqueta no convierte una tarea en solo lectura. Conserva un play sin etiquetas heredadas y las dos tareas suministradas; no añadas pre/post tasks, roles ni handlers.


      Para el quest 058: Una composición de roles debe satisfacer los requisitos de cada contexto de llamada. Las entradas y la ejecución de dependencias tienen ámbitos distintos; una llamada predeterminada correcta no demuestra que otra parametrizada pueda construir su salida y converger. Verifica la entrega predeterminada y reproduce los casos declarados en un play local aislado sin elevar privilegios. Compara ambas salidas y los datos conservados, repite la aplicación y exige un recap sin cambios.


      ### Registrar una inspección real {#inspection-evidence}


      inspection.log falta o está vacío; puede no haberse registrado la inspección desde ~/quest o falló antes de generar salida. `ansible-playbook --tags inspect rollout.yml > inspection.log`.


      ### Etiquetas de lectura y estados previos {#inspection-unchanged}


      La inspección cambió un banner o no pudo verificar y restaurar su estado; inspect puede seguir seleccionando copy o falló SSH, el playbook, el plazo o la limpieza. Liste las tareas seleccionadas por --tags inspect antes de ejecutarlas. Al inicio copy y stat tienen inspect; copy puede reemplazar datos y permisos. La prueba compara bytes, modo, propietario, tiempos y destino symlink antes y después en todos los hosts. Un fallo de ejecución, observación SSH o restauración también falla sin demostrar una etiqueta incorrecta.


      ### El recap como observación separada {#inspection-recap}


      La inspección en vivo falló o no se verificó su recap; errores del playbook, SSH, plazos, restauración o campos recap ambiguos pueden impedir un resultado completo. app1 no tiene un recap inequívoco con changed=0, unreachable=0 y failed=0; tareas que modifican estado, fallos SSH o contadores ausentes o inválidos pueden explicarlo. La prueba ejecuta inspect; inspection.log no es su fuente recap. Cada app1, app2 y app3 requiere ceros numéricos changed/unreachable/failed; hosts o contadores ausentes no equivalen a cero. Se analizan recaps JSON, runner y texto, pero campos duplicados o ambiguos no prueban éxito. Compare por separado los archivos sin cambios y el changed=0 declarado.


      ### Inicio del observador de inspección {#inspection-inputs}


      La prueba de banners sin cambios se detuvo antes del diagnóstico Python; ~/quest, el inicio de Python o las entradas pueden no estar disponibles. La prueba recap se detuvo antes del diagnóstico Python; ~/quest, Python o el helper dq_check pueden no estar disponibles antes de la inspección. El grupo de shell falló sin diagnóstico por host; la observación puede haberse interrumpido antes de informar resultados. Los grupos de contenido expanden el namespace por host: DQ_NAMESPACE ausente normalmente produce banner_1, banner_2 y banner_3, no el diagnóstico reservado sin marcador. Restaure entradas de la estación y distinga observación interrumpida de contenido distinto verificado.


      ### Banners conservados en cada host {#inspection-banner-content}


      app1 no devolvió north-46 desde su banner o falló SSH; una tarea deploy seleccionada puede haber sobrescrito el archivo o el host no está disponible. `ssh -n -o BatchMode=yes -p 2222 root@app1-"${DQ_NAMESPACE#dq-}" ''cat /srv/site/banner.txt''`. DQ_NAMESPACE ausente o incorrecto también puede impedir la observación SSH del host. Repita la comprobación en app2 y app3; los tres banners deben conservar north-46.


      ### Dependencias de llamadas repetidas a la role {#role-repeated-caller-entry}


      La ejecución repetida de la role falló; banner puede omitir la dependencia base, crear otra carpeta, suprimir una dependencia repetida o fallar para la llamada local sin privilegios. El contrato llama roles/banner dos veces en un play local sin privilegios con distintos install_root y banner_route, y repite todo el play. La dependencia base crea cada carpeta: allow_duplicates: false puede suprimir la segunda dependencia incluso tras añadirla a metadata banner. Conserve el resultado predeterminado y la independencia de llamadas. `cat role-contract.json roles/banner/meta/main.yml roles/base/meta/main.yml; ansible-playbook rollout.yml --list-tasks`.


      ### Rutas y valores por llamada {#role-caller-specific-output}


      Falta una salida de llamada o contiene otra ruta; /srv/routes o north-ready fijos, o una dependencia omitida en la segunda llamada, pueden ignorar install_root y banner_route.  `cat roles/banner/defaults/main.yml roles/base/tasks/main.yml roles/banner/tasks/main.yml`.


      ### Conservar datos ajenos a la salida propia {#role-preserve-caller-data}


      El archivo de control o datos existentes del directorio cambiaron o desaparecieron; una limpieza amplia o sustituir todo el directorio puede borrar datos ajenos al archivo current de la role.  `cat roles/base/tasks/main.yml roles/banner/tasks/main.yml`.


      ### Convergencia de segunda aplicación {#role-second-run-convergence}


      La segunda ejecución no informó localhost con changed, failed y unreachable en cero; reescrituras incondicionales, tareas no idempotentes o ejecución fallida pueden impedir convergencia. La prueba aislada exige recap con localhost en la segunda aplicación y changed=0, failed=0, unreachable=0 para cada host informado. Ejecuciones predeterminadas correctas ayudan a observar, pero no sustituyen dos llamadas distintas. Un recap malformado corresponde al fallo de observación. `ansible-playbook rollout.yml; ansible-playbook rollout.yml`.


      ### Ejecución dentro del plazo de observación {#role-bounded-replay}


      El proceso de la role superó el plazo restante; tareas lentas o esperar servicios externos no disponibles pueden agotar el presupuesto de dos ejecuciones.  `cat roles/base/tasks/main.yml roles/banner/tasks/main.yml`.


      ### Observar salidas de llamada y recap {#role-replay-observation}


      No se pudo observar la role; contrato protegido o carpetas ausentes, salida ilegible, recap malformado, errores de herramientas o presupuesto agotado impiden evaluar el resultado.  `cat role-contract.json; command -v ansible-playbook`.


      ### Inicio de prueba de hosts y role {#role-probe-startup}


      La prueba conjunta de hosts/role terminó sin marcador detallado; directorio de trabajo, Python o módulo ausentes, o un grupo SSH acotado interrumpido, pueden impedir llegar a la role.  `command -v python3; command -v ssh`.


      ### Conservar entrega predeterminada a hosts {#role-default-fleet-result}


      app1 no proporciona north-ready en /srv/routes/current; dependencia base ausente o entrega fallida puede dejar la ruta predeterminada sin crear, y fallos SSH o namespace también impiden observarla.  `ansible fleet -m ansible.builtin.command -a "cat /srv/routes/current"`. Repita la observación en app2 y app3.


      ## Pruébalo


      Abra el **ansible Lab** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿--tags dynamic ejecuta necesariamente todas las tareas dentro de un include etiquetado?


      ```bash

      cd ~/lab/examples/reuse

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. El include se ejecuta, pero su hijo sin etiquetar no. El estático import hereda su etiqueta.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh` y luego con `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Statische Importe erweitern Aufgaben früher; dynamic umfasst ausgewählte Aufgaben während der Ausführung. Tags auf einem include wählen die include-Anweisung aus, sodass untergeordnete Elemente ohne Tags weiterhin übersprungen werden können. Rollen bündeln Aufgaben mit defaults, handlers und Vorlagen im Rahmen eines gemeinsamen Vertrags.


      In Aufgabe 046 würde ein `inspect`-Tag an der ausliefernden Copy-Aufgabe ein gesundes Banner während der Prüfung ändern. Gib der Copy-Aufgabe nur das Tag `deploy` und der Stat-Aufgabe `inspect`. Liste die ausgewählten Aufgaben auf, führe die Prüfung aus und kontrolliere ihren Recap sowie das unveränderte Banner `north-46` auf allen drei Hosts; ein Tag-Name allein macht eine Aufgabe nicht lesend. Behalte ein Play ohne geerbte Play-Tags und die zwei vorgegebenen Aufgaben; füge keine Pre/Post-Tasks, Rollen oder Handler hinzu.


      Für Quest 058: Eine zusammengesetzte Rolle muss Voraussetzungen für jeden Aufruferkontext erfüllen. Rolleneingaben und Abhängigkeitsausführung haben verschiedene Geltungsbereiche; ein erfolgreicher Standardaufruf belegt nicht, dass ein anderer parametrisierter Aufruf seine Ausgabe erstellen und konvergieren kann. Prüfe Standardauslieferung und wiederhole die deklarierten Aufruferfälle in einem isolierten lokalen Play ohne Rechteerhöhung. Vergleiche beide Ausgaben und bewahrte Daten und verlange bei erneuter Anwendung einen Recap ohne Änderungen.


      ### Eine echte Inspektion aufzeichnen {#inspection-evidence}


      inspection.log fehlt oder ist leer; die Inspektion wurde möglicherweise nicht aus ~/quest aufgezeichnet oder endete vor einer Ausgabe. `ansible-playbook --tags inspect rollout.yml > inspection.log`.


      ### Lesende Tags und Zustandsaufnahmen {#inspection-unchanged}


      Die Inspektion änderte ein Banner oder konnte den Zustand nicht prüfen und wiederherstellen; inspect wählt möglicherweise noch copy oder SSH, Playbook, Zeitbudget beziehungsweise Bereinigung schlugen fehl. Listen Sie vor dem Lauf die mit --tags inspect ausgewählten Aufgaben. Anfangs tragen copy und stat inspect; copy kann Daten und Rechte ersetzen. Die Prüfung vergleicht Bytes, Modus, Eigentümer, Zeitstempel und Symlink-Ziel vorher/nachher auf allen Hosts. Auch Lauf-, SSH-Beobachtungs- oder Wiederherstellungsfehler führen zum Fehlschlag und beweisen allein keinen falschen Tag.


      ### Recap als eigene Beobachtung {#inspection-recap}


      Die laufende Inspektion schlug fehl oder ihr Recap war nicht prüfbar; Playbook-, SSH-, Zeitlimit- oder Wiederherstellungsfehler sowie mehrdeutige Recap-Felder können das Ergebnis verhindern. Für app1 fehlt ein eindeutiges Recap mit changed=0, unreachable=0 und failed=0; ausgewählte schreibende Aufgaben, SSH-Fehler oder fehlende beziehungsweise fehlerhafte Zähler können die Ursache sein. Die Prüfung führt inspect selbst aus; inspection.log ist nicht ihre Recap-Quelle. Jeder app1, app2 und app3 benötigt numerische Nullen für changed/unreachable/failed; fehlende Hosts oder Zähler sind keine Null. JSON-, Runner- und Text-Recaps werden gelesen, doppelte oder mehrdeutige Felder belegen jedoch keinen Erfolg. Prüfen Sie unveränderte Dateien getrennt vom gemeldeten changed=0.


      ### Start der Inspektionsprüfung {#inspection-inputs}


      Die Bannerprüfung endete vor der Python-Diagnose; ~/quest, der Python-Start oder Prüfeingaben sind möglicherweise nicht verfügbar. Die Recap-Prüfung endete vor der Python-Diagnose; ~/quest, Python oder der dq_check-Helfer sind möglicherweise vor der Inspektion nicht verfügbar. Die Shell-Gruppe schlug ohne Hostdiagnose fehl; die Beobachtung wurde möglicherweise vor der Ergebnisausgabe unterbrochen. Die Inhaltsgruppen expandieren den Namespace je Host: fehlendes DQ_NAMESPACE erzeugt normalerweise banner_1, banner_2 und banner_3 statt des reservierten Fallbacks ohne Marker. Stellen Sie Workstation-Eingaben wieder her und unterscheiden Sie unterbrochene Beobachtung von bestätigter Dateiabweichung.


      ### Erhaltene Banner auf jedem Host {#inspection-banner-content}


      app1 lieferte aus dem Banner nicht north-46 oder SSH schlug fehl; eine ausgewählte Deploy-Aufgabe hat möglicherweise die Datei überschrieben oder der Host ist nicht erreichbar. `ssh -n -o BatchMode=yes -p 2222 root@app1-"${DQ_NAMESPACE#dq-}" ''cat /srv/site/banner.txt''`. Ein fehlender oder falscher DQ_NAMESPACE kann auch die SSH-Beobachtung des Hosts verhindern. Wiederholen Sie die Prüfung für app2 und app3; alle drei Banner müssen north-46 behalten.


      ### Abhängigkeiten wiederholter Rollenaufrufe {#role-repeated-caller-entry}


      Die wiederholte Rollenausführung schlug fehl; banner kann die Abhängigkeit base auslassen, das falsche Verzeichnis erzeugen, eine wiederholte Abhängigkeit unterdrücken oder beim lokalen unprivilegierten Aufruf scheitern. Der Vertrag ruft roles/banner zweimal in einem lokalen unprivilegierten Play mit verschiedenen install_root und banner_route auf und wiederholt dann den gesamten Play. Die Abhängigkeit base muss jedes Aufrufverzeichnis erzeugen: allow_duplicates: false kann die zweite Abhängigkeit auch nach Ergänzung in den banner Metadaten unterdrücken. Erhalten Sie das Standardergebnis auf den Hosts und unabhängige Aufrufe. `cat role-contract.json roles/banner/meta/main.yml roles/base/meta/main.yml; ansible-playbook rollout.yml --list-tasks`.


      ### Aufrufspezifische Pfade und Werte {#role-caller-specific-output}


      Eine Aufrufausgabe fehlt oder enthält die falsche Route; fest eingetragene /srv/routes oder north-ready beziehungsweise eine beim zweiten Aufruf übersprungene Abhängigkeit können install_root und banner_route ignorieren.  `cat roles/banner/defaults/main.yml roles/base/tasks/main.yml roles/banner/tasks/main.yml`.


      ### Daten außerhalb der eigenen Ausgabe erhalten {#role-preserve-caller-data}


      Die erhaltene Kontrolldatei oder vorhandene Daten im Aufrufverzeichnis wurden geändert oder entfernt; großflächiges Aufräumen oder Ersetzen des gesamten Verzeichnisses kann Daten außerhalb der rolleneigenen Datei current löschen.  `cat roles/base/tasks/main.yml roles/banner/tasks/main.yml`.


      ### Konvergenz beim zweiten Durchlauf {#role-second-run-convergence}


      Der zweite Durchlauf meldete localhost nicht mit changed, failed und unreachable gleich null; bedingungsloses Neuschreiben, nicht idempotente Tasks oder fehlgeschlagene Host-Ausführung können Konvergenz verhindern. Die isolierte Aufrufprüfung verlangt beim zweiten Durchlauf einen recap mit localhost sowie changed=0, failed=0 und unreachable=0 für jeden gemeldeten Host. Erfolgreiche Standarddurchläufe helfen bei der Beobachtung, ersetzen jedoch nicht die zwei verschiedenen Aufruffälle. Ein fehlerhafter recap gehört stattdessen zum Beobachtungsfehler. `ansible-playbook rollout.yml; ansible-playbook rollout.yml`.


      ### Ausführung innerhalb der Beobachtungsfrist {#role-bounded-replay}


      Der Rollenprozess überschritt die verbleibende Frist; langsame Tasks oder Warten auf unerreichbare externe Dienste können das Budget der zwei Durchläufe erschöpfen.  `cat roles/base/tasks/main.yml roles/banner/tasks/main.yml`.


      ### Aufrufausgaben und recap beobachten {#role-replay-observation}


      Die Rollenausführung konnte nicht beobachtet werden; fehlender geschützter Vertrag oder Aufrufverzeichnisse, unlesbare Ausgabe, fehlerhafter recap, Werkzeugfehler oder ein erschöpftes Beobachtungsbudget verhindern die Auswertung.  `cat role-contract.json; command -v ansible-playbook`.


      ### Start der Host- und Rollenprüfung {#role-probe-startup}


      Die gemeinsame Host-/Rollenprüfung endete ohne Detailmarker; ein fehlendes Arbeitsverzeichnis, Python oder Modul beziehungsweise eine unterbrochene zeitbegrenzte SSH-Gruppe kann die Rollenausführung verhindern.  `command -v python3; command -v ssh`.


      ### Standardbereitstellung auf Hosts erhalten {#role-default-fleet-result}


      app1 liefert nicht north-ready in /srv/routes/current; eine fehlende Abhängigkeit base oder fehlgeschlagene Bereitstellung kann die Standardroute fehlen lassen, und SSH-/Namespace-Fehler verhindern ebenfalls die Beobachtung.  `ansible fleet -m ansible.builtin.command -a "cat /srv/routes/current"`. Wiederholen Sie die Beobachtung auf app2 und app3.


      ## Probieren Sie es aus


      Öffnen Sie das **ansible Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und prüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Führt --tags dynamic unbedingt jede Aufgabe innerhalb eines getaggten include aus?


      ```bash

      cd ~/lab/examples/reuse

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Der include wird ausgeführt, sein nicht getaggtes untergeordnetes Element jedoch nicht. Der statische import erbt seinen Tag.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-reuse
ansible-13:
  profile: ansible
  example: vault
  source_hash: 6a565d549108646aaa4c247de4464213c386cc0243d47350940f366c38c4f323
  content:
    en: 'Ansible Vault encrypts data at rest. The controller needs a decryption secret at execution time, and no_log prevents that task’s output from disclosing values. This Lab uses a deliberately disposable demonstration password.


      ### Cause and observation (069, deployment_log) {#private-delivery-nonempty-log}


      The play may not have run with output captured, or deployment.log is empty; retain a nonempty execution log. The supplied copy task starts with mode 644 and no_log disabled. Deliver both inputs with private permissions and recipient ownership. The original programs read on every HTTP request; no restart or SIGHUP is needed. Observe metadata without printing credentials. `test -s deployment.log`


      ### Cause and observation (069, redaction) {#private-delivery-exact-token-in-log}


      A missing/empty log also fails redaction; otherwise the exact supplied token may appear in diff/output because the sensitive task lacks no_log. The supplied copy task starts with mode 644 and no_log disabled. Deliver both inputs with private permissions and recipient ownership. The original programs read on every HTTP request; no restart or SIGHUP is needed. Observe metadata without printing credentials. `test -s deployment.log; grep -qF game-station-secret-69 deployment.log; test "$?" -eq 1`


      ### Cause and observation (069, credential_original) {#private-delivery-original-input-bytes}


      Editing or reformatting credentials.yml changes the frozen source bytes; repair delivery while retaining the supplied input unchanged. The supplied copy task starts with mode 644 and no_log disabled. Deliver both inputs with private permissions and recipient ownership. The original programs read on every HTTP request; no restart or SIGHUP is needed. Observe metadata without printing credentials. `cmp credentials.yml /run/dq/facts/0/credentials.yml`


      ### Cause and observation (069, consumer_identity) {#private-delivery-original-process-and-privileges}


      Restarting a supplied process, changing its UID/groups/capabilities, command or installed program changes its frozen identity; deliver files to the original consumers. The supplied copy task starts with mode 644 and no_log disabled. Deliver both inputs with private permissions and recipient ownership. The original programs read on every HTTP request; no restart or SIGHUP is needed. Observe metadata without printing credentials. `ssh -n -o BatchMode=yes -p 2222 root@app1-"${DQ_NAMESPACE#dq-}" "ps -eo pid,uid,gid,args"`


      ### Cause and observation (069, credential_access) {#private-delivery-cross-consumer-denial}


      Wrong ownership, groups or broad permissions may let another consumer or outsider open a credential for reading or appending; test the actual principals, not just root access. The supplied copy task starts with mode 644 and no_log disabled. Deliver both inputs with private permissions and recipient ownership. The original programs read on every HTTP request; no restart or SIGHUP is needed. Observe metadata without printing credentials. `ssh -n -o BatchMode=yes -p 2222 root@app1-"${DQ_NAMESPACE#dq-}" "stat -c ''%u %g %a %n'' /srv/site/station-token /srv/relay/station-token"`


      ### Cause and observation (069, credential_auth) {#private-delivery-observed-auth-response}


      The endpoint returned an observed but unexpected success response/body; compare it with credential-ready using the original token. HTTP 401/503 errors use the observation diagnostic. The supplied copy task starts with mode 644 and no_log disabled. Deliver both inputs with private permissions and recipient ownership. The original programs read on every HTTP request; no restart or SIGHUP is needed. Observe metadata without printing credentials. `python3 -c ''import os,urllib.request,yaml; token=yaml.safe_load(open("credentials.yml"))["station_token"]; host="app1-"+os.environ["DQ_NAMESPACE"][3:]; request=urllib.request.Request("http://"+host+":8081/",headers={"Authorization":"Bearer "+token}); print(urllib.request.urlopen(request,timeout=3).read().decode().strip())''`


      ### Cause and observation (069, consumer_budget) {#private-delivery-bounded-ssh-observer}


      SSH or its remote observer may exceed the remaining subprocess timeout; check host connectivity and the remote observation command. The supplied copy task starts with mode 644 and no_log disabled. Deliver both inputs with private permissions and recipient ownership. The original programs read on every HTTP request; no restart or SIGHUP is needed. Observe metadata without printing credentials. `ssh -n -o BatchMode=yes -o ConnectTimeout=3 -p 2222 root@app1-"${DQ_NAMESPACE#dq-}" true`


      ### Cause and observation (069, consumer_observation) {#private-delivery-own-file-access-and-observation}


      A root-owned mode-600 file can deny its own consumer; HTTP 401/503, socket errors, missing process/input or SSH/receipt errors also stop observation. Check recipient ownership without restarting consumers. The supplied copy task starts with mode 644 and no_log disabled. Deliver both inputs with private permissions and recipient ownership. The original programs read on every HTTP request; no restart or SIGHUP is needed. Observe metadata without printing credentials. `ssh -n -o BatchMode=yes -p 2222 root@app1-"${DQ_NAMESPACE#dq-}" "stat -c ''%u %g %a %n'' /srv/site/station-token /srv/relay/station-token"`


      ### Cause and observation (069, probe_0_1) {#private-delivery-legacy-and-startup-fallback}


      Helper startup or an interrupted legacy wrapper may stop before any specific marker; ordinary SSH content failures use content_1/2/3. Inspect imports and host reachability. The supplied copy task starts with mode 644 and no_log disabled. Deliver both inputs with private permissions and recipient ownership. The original programs read on every HTTP request; no restart or SIGHUP is needed. Observe metadata without printing credentials. `python3 -I -c "import yaml"; ssh -n -o BatchMode=yes -p 2222 root@app1-"${DQ_NAMESPACE#dq-}" true`


      ### Cause and observation (069, content_1) {#private-delivery-host-1-content}


      app1 may still hold the retired credential, or SSH/file access failed; deliver the unchanged credentials.yml value to /srv/site/station-token. The supplied copy task starts with mode 644 and no_log disabled. Deliver both inputs with private permissions and recipient ownership. The original programs read on every HTTP request; no restart or SIGHUP is needed. Observe metadata without printing credentials. `ssh -n -o BatchMode=yes -p 2222 root@app1-"${DQ_NAMESPACE#dq-}" test -r /srv/site/station-token`


      ### Cause and observation (069, mode_1) {#private-delivery-host-1-mode}


      app1 may retain mode 644 from the supplied copy task, or stat/SSH failed; require 600 on /srv/site/station-token while preserving access for its own consumer. The supplied copy task starts with mode 644 and no_log disabled. Deliver both inputs with private permissions and recipient ownership. The original programs read on every HTTP request; no restart or SIGHUP is needed. Observe metadata without printing credentials. `ssh -n -o BatchMode=yes -p 2222 root@app1-"${DQ_NAMESPACE#dq-}" stat -c %a /srv/site/station-token`


      ### Cause and observation (069, content_2) {#private-delivery-host-2-content}


      app2 may still hold the retired credential, or SSH/file access failed; deliver the unchanged credentials.yml value to /srv/site/station-token. The supplied copy task starts with mode 644 and no_log disabled. Deliver both inputs with private permissions and recipient ownership. The original programs read on every HTTP request; no restart or SIGHUP is needed. Observe metadata without printing credentials. `ssh -n -o BatchMode=yes -p 2222 root@app2-"${DQ_NAMESPACE#dq-}" test -r /srv/site/station-token`


      ### Cause and observation (069, mode_2) {#private-delivery-host-2-mode}


      app2 may retain mode 644 from the supplied copy task, or stat/SSH failed; require 600 on /srv/site/station-token while preserving access for its own consumer. The supplied copy task starts with mode 644 and no_log disabled. Deliver both inputs with private permissions and recipient ownership. The original programs read on every HTTP request; no restart or SIGHUP is needed. Observe metadata without printing credentials. `ssh -n -o BatchMode=yes -p 2222 root@app2-"${DQ_NAMESPACE#dq-}" stat -c %a /srv/site/station-token`


      ### Cause and observation (069, content_3) {#private-delivery-host-3-content}


      app3 may still hold the retired credential, or SSH/file access failed; deliver the unchanged credentials.yml value to /srv/site/station-token. The supplied copy task starts with mode 644 and no_log disabled. Deliver both inputs with private permissions and recipient ownership. The original programs read on every HTTP request; no restart or SIGHUP is needed. Observe metadata without printing credentials. `ssh -n -o BatchMode=yes -p 2222 root@app3-"${DQ_NAMESPACE#dq-}" test -r /srv/site/station-token`


      ### Cause and observation (069, mode_3) {#private-delivery-host-3-mode}


      app3 may retain mode 644 from the supplied copy task, or stat/SSH failed; require 600 on /srv/site/station-token while preserving access for its own consumer. The supplied copy task starts with mode 644 and no_log disabled. Deliver both inputs with private permissions and recipient ownership. The original programs read on every HTTP request; no restart or SIGHUP is needed. Observe metadata without printing credentials. `ssh -n -o BatchMode=yes -p 2222 root@app3-"${DQ_NAMESPACE#dq-}" stat -c %a /srv/site/station-token`


      ## Try it


      Open the **ansible Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Can an encrypted vars file run without a decryption secret?


      ```bash

      cd ~/lab/examples/vault

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The no-key run fails; the keyed run succeeds without printing the demonstration secret.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.


      Private delivery combines output redaction, recipient access and isolation from other principals. Ownership, group membership and the operator’s actual capabilities determine which metadata transitions are allowed; a combined content-and-owner update can fail under restricted authority. Test actual authentication and cross-principal read and write denial without emitting secret bytes. Restrictive modes alone do not prove that the intended application can read its input.


      Quest 089 ties artifact bytes to a trusted publication receipt and private access by actual unprivileged applications. Ownership transitions must respect the operator’s capabilities. Correct source files and restrictive modes can coexist with unreadable inputs or an application that has not refreshed. Authenticate to each supplied instance and follow the dependency from the verified source to downstream adoption using `application-contract.json`. Build Authorization in memory during verification so the synthetic credential is not displayed.'
    ru: 'Ansible Vault шифрует данные при хранении. Контроллеру нужен ключ при исполнении, no_log скрывает вывод задачи с секретом. В стенде используется заведомо одноразовый демонстрационный пароль.


      ### Причина и наблюдение (069, deployment_log) {#private-delivery-nonempty-log}


      Play мог не запускаться с сохранением вывода либо deployment.log пуст; сохраните непустой журнал выполнения. Выданная copy-задача задаёт mode 644 и отключает no_log. Доставьте оба входа с приватными правами и владельцами-получателями. Исходные программы читают при каждом HTTP-запросе; перезапуск и SIGHUP не нужны. Наблюдайте метаданные без вывода credential. `test -s deployment.log`


      ### Причина и наблюдение (069, redaction) {#private-delivery-exact-token-in-log}


      Отсутствующий/пустой журнал также нарушает redaction; иначе точный выданный токен мог попасть в diff/вывод из задачи без no_log. Выданная copy-задача задаёт mode 644 и отключает no_log. Доставьте оба входа с приватными правами и владельцами-получателями. Исходные программы читают при каждом HTTP-запросе; перезапуск и SIGHUP не нужны. Наблюдайте метаданные без вывода credential. `test -s deployment.log; grep -qF game-station-secret-69 deployment.log; test "$?" -eq 1`


      ### Причина и наблюдение (069, credential_original) {#private-delivery-original-input-bytes}


      Редактирование или переформатирование credentials.yml меняет зафиксированные байты; исправляйте доставку, сохраняя выданный источник. Выданная copy-задача задаёт mode 644 и отключает no_log. Доставьте оба входа с приватными правами и владельцами-получателями. Исходные программы читают при каждом HTTP-запросе; перезапуск и SIGHUP не нужны. Наблюдайте метаданные без вывода credential. `cmp credentials.yml /run/dq/facts/0/credentials.yml`


      ### Причина и наблюдение (069, consumer_identity) {#private-delivery-original-process-and-privileges}


      Перезапуск процесса, смена UID/групп/capabilities, команды или установленной программы меняют идентичность; доставляйте файлы исходным потребителям. Выданная copy-задача задаёт mode 644 и отключает no_log. Доставьте оба входа с приватными правами и владельцами-получателями. Исходные программы читают при каждом HTTP-запросе; перезапуск и SIGHUP не нужны. Наблюдайте метаданные без вывода credential. `ssh -n -o BatchMode=yes -p 2222 root@app1-"${DQ_NAMESPACE#dq-}" "ps -eo pid,uid,gid,args"`


      ### Причина и наблюдение (069, credential_access) {#private-delivery-cross-consumer-denial}


      Неверный владелец, группы или широкие права позволяют другому потребителю либо outsider открыть credential для чтения или append; проверяйте реальные UID, а не доступ root. Выданная copy-задача задаёт mode 644 и отключает no_log. Доставьте оба входа с приватными правами и владельцами-получателями. Исходные программы читают при каждом HTTP-запросе; перезапуск и SIGHUP не нужны. Наблюдайте метаданные без вывода credential. `ssh -n -o BatchMode=yes -p 2222 root@app1-"${DQ_NAMESPACE#dq-}" "stat -c ''%u %g %a %n'' /srv/site/station-token /srv/relay/station-token"`


      ### Причина и наблюдение (069, credential_auth) {#private-delivery-observed-auth-response}


      Endpoint вернул наблюдаемый, но неожиданный успешный ответ/body; сравните с credential-ready при исходном токене. Ошибки HTTP 401/503 относятся к диагностике наблюдения. Выданная copy-задача задаёт mode 644 и отключает no_log. Доставьте оба входа с приватными правами и владельцами-получателями. Исходные программы читают при каждом HTTP-запросе; перезапуск и SIGHUP не нужны. Наблюдайте метаданные без вывода credential. `python3 -c ''import os,urllib.request,yaml; token=yaml.safe_load(open("credentials.yml"))["station_token"]; host="app1-"+os.environ["DQ_NAMESPACE"][3:]; request=urllib.request.Request("http://"+host+":8081/",headers={"Authorization":"Bearer "+token}); print(urllib.request.urlopen(request,timeout=3).read().decode().strip())''`


      ### Причина и наблюдение (069, consumer_budget) {#private-delivery-bounded-ssh-observer}


      SSH либо удалённый observer может превысить оставшийся таймаут subprocess; проверьте связность хоста и команду наблюдения. Выданная copy-задача задаёт mode 644 и отключает no_log. Доставьте оба входа с приватными правами и владельцами-получателями. Исходные программы читают при каждом HTTP-запросе; перезапуск и SIGHUP не нужны. Наблюдайте метаданные без вывода credential. `ssh -n -o BatchMode=yes -o ConnectTimeout=3 -p 2222 root@app1-"${DQ_NAMESPACE#dq-}" true`


      ### Причина и наблюдение (069, consumer_observation) {#private-delivery-own-file-access-and-observation}


      Файл mode-600 с владельцем root может быть недоступен своему потребителю; HTTP 401/503, socket-ошибки, отсутствующий процесс/файл или ошибки SSH/receipt также мешают наблюдению. Проверьте владельца без перезапуска. Выданная copy-задача задаёт mode 644 и отключает no_log. Доставьте оба входа с приватными правами и владельцами-получателями. Исходные программы читают при каждом HTTP-запросе; перезапуск и SIGHUP не нужны. Наблюдайте метаданные без вывода credential. `ssh -n -o BatchMode=yes -p 2222 root@app1-"${DQ_NAMESPACE#dq-}" "stat -c ''%u %g %a %n'' /srv/site/station-token /srv/relay/station-token"`


      ### Причина и наблюдение (069, probe_0_1) {#private-delivery-legacy-and-startup-fallback}


      Запуск helper либо прерванная старая обёртка могут завершиться до конкретного маркера; обычные ошибки SSH-проверки содержимого дают content_1/2/3. Проверьте импорты и доступность хостов. Выданная copy-задача задаёт mode 644 и отключает no_log. Доставьте оба входа с приватными правами и владельцами-получателями. Исходные программы читают при каждом HTTP-запросе; перезапуск и SIGHUP не нужны. Наблюдайте метаданные без вывода credential. `python3 -I -c "import yaml"; ssh -n -o BatchMode=yes -p 2222 root@app1-"${DQ_NAMESPACE#dq-}" true`


      ### Причина и наблюдение (069, content_1) {#private-delivery-host-1-content}


      app1 может хранить старый credential либо SSH/чтение файла не прошли; доставьте неизменённое значение credentials.yml в /srv/site/station-token. Выданная copy-задача задаёт mode 644 и отключает no_log. Доставьте оба входа с приватными правами и владельцами-получателями. Исходные программы читают при каждом HTTP-запросе; перезапуск и SIGHUP не нужны. Наблюдайте метаданные без вывода credential. `ssh -n -o BatchMode=yes -p 2222 root@app1-"${DQ_NAMESPACE#dq-}" test -r /srv/site/station-token`


