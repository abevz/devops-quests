      ## Pruébalo


      Abra el **Laboratorio ansible** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿Se puede ejecutar un archivo vars cifrado sin un secreto de descifrado?


      ```bash

      cd ~/lab/examples/vault

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. La ejecución sin clave falla; la ejecución con clave se realiza correctamente sin imprimir el secreto de demostración.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh`, luego `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.


      La entrega privada combina ocultación de salida, acceso del destinatario y aislamiento de otros usuarios. Propiedad, grupos y capacidades reales del operador determinan las transiciones de metadatos permitidas; combinar contenido y propietario puede fallar con autoridad limitada. Prueba autenticación real y denegación de lectura y escritura ajena sin mostrar secretos. Los permisos restrictivos por sí solos no prueban acceso de la aplicación prevista.


      El ejercicio 089 vincula los bytes del artefacto con un recibo fiable y el acceso privado de aplicaciones reales sin privilegios. Los cambios de propietario deben respetar las capacidades del operador. Archivos correctos y permisos restrictivos pueden coexistir con entradas ilegibles o aplicaciones sin actualizar. Autentica cada instancia y sigue la dependencia desde la fuente verificada hasta la adopción mediante `application-contract.json`. Construye Authorization en memoria durante la verificación para no mostrar la credencial sintética.'
    de: 'Ansible Vault verschlüsselt ruhende Daten. Der Controller benötigt zur Ausführungszeit ein Entschlüsselungsgeheimnis, und no_log verhindert, dass die Ausgabe dieser Aufgabe Werte preisgibt. In diesem Labor wird bewusst ein Wegwerf-Demonstrationspasswort verwendet.


      ### Ursache und Beobachtung (069, deployment_log) {#private-delivery-nonempty-log}


