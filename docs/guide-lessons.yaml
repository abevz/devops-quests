terraform-2:
  profile: opentofu
  example: hcl
  source_hash: e1c071f9ad5ae6b9cb18db98c51557d9bfdddac00536afba4b30935dc56aedf9
  content:
    en: 'HCL describes inputs, expressions and managed objects. This local example filters disabled services before for_each creates instances. A validation rule rejects a known invalid input before it becomes a resource change.


      In quest 033, the `for_each` map keys identify the existing north and south instances. Add east without changing the other entries, then compare `tofu output -json routes` with `original-ids.json`: the output must have exactly three entries, north and south must retain their recorded IDs, and east must have a string ID. Check the state address `local_file.route["east"]`, that `north.txt` and `east.txt` contain `open`, that `south.txt` contains `held`, and a no-change detailed plan. A new key should add an instance rather than silently replacing existing ones.


      In quest 039, a number type permits fractions, so the `departures` validation must combine bounds 1 through 6 with an integer test. Keep the supplied value 3 and apply it. Separate plans for 0, 7 and 2.5 must fail with `departures must be an integer from 1 to 6`; check `timetable.txt`, the numeric output and a final detailed plan exit code 0. The negative plans test the contract without applying unsafe values.


      In quest 013, `terraform.tfvars` supplies `station = "north"` and `departures = 4`. The `station` input must have type `string`, while `departures` remains a number; the local file combines them as `north:4`. After apply, `tofu console` evaluating `type(var.station)` should print `string`; `tofu output -raw station` should show `north`, and `tofu output -json departures` should show the number `4`. Check that `tofu state list` includes `local_file.notice` and a final `tofu plan -input=false -detailed-exitcode -no-color` exits 0.


      ## Try it


      Open the **opentofu Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** How many instances will a map with one enabled and one disabled service create?


      ```bash

      cd ~/lab/examples/hcl

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Expected result

      > One: api. The output is dev/api; environment=production fails validation.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'HCL описывает входы, выражения и управляемые объекты. Локальный пример фильтрует выключенные сервисы до создания экземпляров через for_each. Validation отвергает известное неверное значение до изменения ресурса.


      В квесте 033 ключи карты `for_each` определяют существующие экземпляры north и south. Добавьте east, не меняя остальные записи, затем сравните `tofu output -json routes` с `original-ids.json`: выход должен содержать ровно три записи, north и south должны сохранить записанные ID, а east должен иметь строковый ID. Проверьте адрес `local_file.route["east"]` в state, значения `open` в `north.txt` и `east.txt`, значение `held` в `south.txt` и подробный plan без изменений. Новый ключ должен добавить экземпляр, а не незаметно заменить существующие.


      В квесте 039 тип number допускает дроби, поэтому validation для `departures` должна сочетать границы от 1 до 6 с проверкой целого числа. Сохраните заданное значение 3 и примените его. Отдельные планы для 0, 7 и 2.5 должны завершаться ошибкой с `departures must be an integer from 1 to 6`; проверьте `timetable.txt`, числовой output и код выхода 0 итогового подробного plan. Негативные планы проверяют контракт без применения небезопасных значений.


      В квесте 013 файл `terraform.tfvars` задает `station = "north"` и `departures = 4`. Вход `station` должен иметь тип `string`, а `departures` остается числом; локальный файл объединяет их как `north:4`. После применения выражение `type(var.station)` в `tofu console` должно вывести `string`; `tofu output -raw station` должен показать `north`, а `tofu output -json departures` — число `4`. Убедитесь, что `tofu state list` содержит `local_file.notice`, а итоговый `tofu plan -input=false -detailed-exitcode -no-color` завершается с кодом 0.


      ## Попробуйте


      Откройте лабораторию **opentofu**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Сколько экземпляров создаст map с одним включённым и одним выключенным сервисом?


      ```bash

      cd ~/lab/examples/hcl

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Один: api. Output содержит dev/api; environment=production не проходит validation.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'HCL opisuje dane wejściowe, wyrażenia i zarządzane obiekty. Ten lokalny przykład filtruje wyłączone usługi, zanim for_each utworzy instancje. Reguła validation odrzuca znane nieprawidłowe dane wejściowe, zanim staną się one zmianą zasobu.


      W zadaniu 033 klucze mapy `for_each` identyfikują istniejące instancje north i south. Dodaj east bez zmiany pozostałych wpisów, a następnie porównaj `tofu output -json routes` z `original-ids.json`: wyjście musi zawierać dokładnie trzy wpisy, north i south muszą zachować zapisane ID, a east musi mieć ID będący ciągiem. Sprawdź adres `local_file.route["east"]` w state, wartości `open` w `north.txt` i `east.txt`, wartość `held` w `south.txt` oraz szczegółowy plan bez zmian. Nowy klucz powinien dodać instancję, a nie po cichu zastąpić istniejące.


      W zadaniu 039 typ number dopuszcza ułamki, więc walidacja `departures` musi łączyć granice od 1 do 6 z testem liczby całkowitej. Zachowaj podaną wartość 3 i zastosuj ją. Osobne plany dla 0, 7 i 2.5 muszą zakończyć się błędem `departures must be an integer from 1 to 6`; sprawdź `timetable.txt`, liczbowe wyjście oraz kod wyjścia 0 końcowego szczegółowego planu. Negatywne plany sprawdzają kontrakt bez stosowania niebezpiecznych wartości.


      W zadaniu 013 plik `terraform.tfvars` podaje `station = "north"` i `departures = 4`. Wejście `station` musi mieć typ `string`, a `departures` pozostaje liczbą; lokalny plik łączy je jako `north:4`. Po zastosowaniu wyrażenie `type(var.station)` w `tofu console` powinno wypisać `string`; `tofu output -raw station` powinno pokazać `north`, a `tofu output -json departures` liczbę `4`. Sprawdź, czy `tofu state list` zawiera `local_file.notice`, a końcowy `tofu plan -input=false -detailed-exitcode -no-color` kończy się kodem 0.


      ## Wypróbuj


      Otwórz laboratorium **opentofu** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Prognozuj przed uruchomieniem:** Ile instancji utworzy map z jedną włączoną i jedną wyłączoną usługą?


      ```bash

      cd ~/lab/examples/hcl

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Jeden: interfejs API. Dane wyjściowe to dev/api; environment=production kończy się niepowodzeniem validation.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'HCL describe entradas, expresiones y objetos administrados. Este ejemplo local filtra servicios deshabilitados antes de que for_each cree instancias. Una regla validation rechaza una entrada no válida conocida antes de que se convierta en un cambio de recurso.


      En el ejercicio 033, las claves del mapa `for_each` identifican las instancias existentes north y south. Añade east sin cambiar las otras entradas y compara `tofu output -json routes` con `original-ids.json`: la salida debe contener exactamente tres entradas, north y south deben conservar sus ID registrados y east debe tener un ID de tipo cadena. Comprueba la dirección `local_file.route["east"]` en state, los valores `open` en `north.txt` y `east.txt`, el valor `held` en `south.txt` y un plan detallado sin cambios. Una clave nueva debe añadir una instancia, no reemplazar silenciosamente las existentes.


      En el ejercicio 039, el tipo number admite fracciones, por lo que la validación de `departures` debe combinar los límites de 1 a 6 con una prueba de entero. Conserva el valor suministrado 3 y aplícalo. Los planes separados para 0, 7 y 2.5 deben fallar con `departures must be an integer from 1 to 6`; comprueba `timetable.txt`, la salida numérica y el código de salida 0 del plan detallado final. Los planes negativos prueban el contrato sin aplicar valores inseguros.


      En el ejercicio 013, `terraform.tfvars` proporciona `station = "north"` y `departures = 4`. La entrada `station` debe tener tipo `string`, mientras que `departures` sigue siendo un número; el archivo local los combina como `north:4`. Tras aplicar, la expresión `type(var.station)` en `tofu console` debe mostrar `string`; `tofu output -raw station` debe mostrar `north` y `tofu output -json departures` el número `4`. Comprueba que `tofu state list` incluye `local_file.notice` y que el `tofu plan -input=false -detailed-exitcode -no-color` final termina con código 0.


      ## Pruébalo


      Abra el laboratorio **opentofu** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿Cuántas instancias creará un map con un servicio habilitado y otro deshabilitado?


      ```bash

      cd ~/lab/examples/hcl

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > Uno: api. La salida es dev/api; environment=production falla validation.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh` y luego con `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'HCL beschreibt Eingaben, Ausdrücke und verwaltete Objekte. Dieses lokale Beispiel filtert deaktivierte Dienste, bevor for_each Instanzen erstellt. Eine validation-Regel lehnt eine bekanntermaßen ungültige Eingabe ab, bevor sie zu einer Ressourcenänderung wird.


      In Aufgabe 033 identifizieren die `for_each`-Map-Schlüssel die vorhandenen Instanzen north und south. Füge east hinzu, ohne die anderen Einträge zu ändern, und vergleiche `tofu output -json routes` mit `original-ids.json`: Die Ausgabe muss genau drei Einträge enthalten, north und south müssen ihre gespeicherten IDs behalten und east muss eine String-ID haben. Prüfe die Adresse `local_file.route["east"]` im State, die Werte `open` in `north.txt` und `east.txt`, den Wert `held` in `south.txt` und einen detaillierten Plan ohne Änderungen. Ein neuer Schlüssel soll eine Instanz hinzufügen und bestehende nicht unbemerkt ersetzen.


      In Aufgabe 039 erlaubt der Typ number Bruchteile, daher muss die Validierung von `departures` die Grenzen 1 bis 6 mit einer Ganzzahlprüfung verbinden. Behalte den vorgegebenen Wert 3 bei und wende ihn an. Separate Pläne für 0, 7 und 2.5 müssen mit `departures must be an integer from 1 to 6` fehlschlagen; prüfe `timetable.txt`, die numerische Ausgabe und Exit-Code 0 des abschließenden detaillierten Plans. Die Negativpläne prüfen den Vertrag, ohne unsichere Werte anzuwenden.


      In Aufgabe 013 liefert `terraform.tfvars` die Werte `station = "north"` und `departures = 4`. Die Eingabe `station` muss den Typ `string` haben, während `departures` eine Zahl bleibt; die lokale Datei verbindet sie zu `north:4`. Nach der Anwendung sollte der Ausdruck `type(var.station)` in `tofu console` `string` ausgeben; `tofu output -raw station` sollte `north` und `tofu output -json departures` die Zahl `4` anzeigen. Prüfe, dass `tofu state list` `local_file.notice` enthält und der abschließende `tofu plan -input=false -detailed-exitcode -no-color` mit Code 0 endet.


      ## Probieren Sie es aus


      Öffnen Sie das **opentofu Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Wie viele Instanzen wird ein map mit einem aktivierten und einem deaktivierten Dienst erstellen?


      ```bash

      cd ~/lab/examples/hcl

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > One: api. Die Ausgabe ist dev/api; environment=production schlägt fehl, validation.


      ## Beobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
