  example: module
  source_hash: 33b1f9fdb01b90503aefe09a80e411207861b13c8ec50345da9d327b75d7d44a
  content:
    en: 'A module has inputs, internal resources and explicit outputs. The caller passes values through that interface. Keeping all four module files beside the root makes this example runnable without another guide section.


      ## Try it


      Open the **opentofu Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


