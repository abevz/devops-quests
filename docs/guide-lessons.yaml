  example: diagnosis
  source_hash: d81a75f3a11c6621eb1b6f8c740ba2c616d91fe2d30451e4e11f19b5318756eb
  content:
    en: 'Find the phase of failure before editing: parsing, host selection, connection, variable evaluation or module execution. A successful syntax check does not prove that runtime variables exist or assertions will pass.


      ## Try it


      Open the **ansible Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Does --syntax-check catch an undefined variable used only when a task runs?


      ```bash

      cd ~/lab/examples/diagnosis

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Expected result

      > No. Syntax succeeds, task evaluation fails, and the explicit variable fixes that failure.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Перед правкой найдите фазу: разбор файла, выбор хоста, подключение, вычисление переменной или исполнение модуля. Успешный syntax-check не доказывает наличие переменных и истинность assert.


      ## Попробуйте


      Откройте лабораторию **ansible**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Всегда ли --syntax-check ловит неопределённую переменную, вычисляемую при запуске задачи?


      ```bash

      cd ~/lab/examples/diagnosis

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Синтаксис проходит, вычисление задачи ошибочно; явно переданная переменная исправляет этот отказ.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Znajdź fazę awarii przed edycją: parsowanie, wybór hosta, połączenie, ocena zmiennej lub wykonanie modułu. Pomyślne sprawdzenie składni nie dowodzi, że istnieją zmienne wykonawcze ani że asercje zostaną zaliczone.


      ## Wypróbuj


      Otwórz laboratorium **ansible** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy --syntax-check przechwytuje niezdefiniowaną zmienną używaną tylko podczas wykonywania zadania?


      ```bash

      cd ~/lab/examples/diagnosis

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Składnia się powiodła, ocena zadania nie, a zmienna jawna naprawia ten błąd.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Encuentre la fase de falla antes de editar: análisis, selección de host, conexión, evaluación de variables o ejecución del módulo. Una verificación de sintaxis exitosa no prueba que existan variables de tiempo de ejecución o que se aprobarán las afirmaciones.


      ## Pruébalo


      Abra el **ansible Lab** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿--syntax-check detecta una variable no definida que se usa solo cuando se ejecuta una tarea?


      ```bash

      cd ~/lab/examples/diagnosis

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. La sintaxis tiene éxito, la evaluación de la tarea falla y la variable explícita soluciona ese error.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh` y luego con `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Suchen Sie vor der Bearbeitung nach der Fehlerphase: Analyse, Hostauswahl, Verbindung, Variablenauswertung oder Modulausführung. Eine erfolgreiche Syntaxprüfung beweist nicht, dass Laufzeitvariablen vorhanden sind oder Behauptungen erfolgreich sind.


      ## Probieren Sie es aus


      Öffnen Sie das **ansible Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Fängt --syntax-check eine undefinierte Variable ab, die nur verwendet wird, wenn eine Aufgabe ausgeführt wird?


      ```bash

      cd ~/lab/examples/diagnosis

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Die Syntax ist erfolgreich, die Aufgabenauswertung schlägt fehl und die explizite Variable behebt diesen Fehler.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
