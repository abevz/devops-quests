      Job actual puede reemplazarse o cambiar image, comando worker o Never; compare con batch-identities fijados. Job original usa backoffLimit=100 y activeDeadlineSeconds=300; CronJob recurrente inicialmente ausente. El resultado esperado es validación fallida limitada. Setup elimina job.yaml: observe objetos vivos y batch-contract.json suministrado. `kubectl get job importer -o json | jq ''{uid:.metadata.uid,spec:.spec}''`.


      ### Horario activo sin solapamiento {#batch-active-cron-schedule-and-concurrency}


      CronJob recurrente puede faltar, estar suspended, usar otro horario o permitir solapamiento; compare con batch-contract.json. Errores API/tiempo al leerlo también usan este marcador. Job original usa backoffLimit=100 y activeDeadlineSeconds=300; CronJob recurrente inicialmente ausente. El resultado esperado es validación fallida limitada. Setup elimina job.yaml: observe objetos vivos y batch-contract.json suministrado. `kubectl get cronjob validation-cycle -o json | jq .spec`.


      ### Plantilla recurrente limitada {#batch-bounded-recurring-job-template}


      La plantilla CronJob puede conservar retry/deadline amplios o cambiar carga; propague cuatro límites exactos e image, comando y Never originales. Job original usa backoffLimit=100 y activeDeadlineSeconds=300; CronJob recurrente inicialmente ausente. El resultado esperado es validación fallida limitada. Setup elimina job.yaml: observe objetos vivos y batch-contract.json suministrado. `kubectl get cronjob validation-cycle -o json | jq .spec.jobTemplate.spec`.


      ### Intento fallido real {#batch-observe-current-failed-attempt}


      El comando fallido puede no ejecutarse aún o su fallo ocultarse; conserve Job original y revise contador failed y events. Job original usa backoffLimit=100 y activeDeadlineSeconds=300; CronJob recurrente inicialmente ausente. El resultado esperado es validación fallida limitada. Setup elimina job.yaml: observe objetos vivos y batch-contract.json suministrado. `kubectl get job importer -o json | jq .status.failed`.


      ### Fallo final de Job {#batch-terminal-current-job-failure}


      Job puede seguir reintentando con límites antiguos o no alcanzar fallo final; revise límites y espere Failed=True. Job original usa backoffLimit=100 y activeDeadlineSeconds=300; CronJob recurrente inicialmente ausente. El resultado esperado es validación fallida limitada. Setup elimina job.yaml: observe objetos vivos y batch-contract.json suministrado. `kubectl get job importer -o json | jq .status.conditions`.


      ### Pod fallido del Job original {#batch-original-job-owned-failed-pod}


      Una etiqueta sola no prueba pertenencia del Pod fallido al Job original; revise controller owner UID, fase Failed y exit code uno de worker. Job original usa backoffLimit=100 y activeDeadlineSeconds=300; CronJob recurrente inicialmente ausente. El resultado esperado es validación fallida limitada. Setup elimina job.yaml: observe objetos vivos y batch-contract.json suministrado. `kubectl get pods -l job-name=importer -o json | jq ''.items[] | {owners:.metadata.ownerReferences,status:.status}''`.


      ### Job programado real {#batch-observed-cron-owned-failed-job}


      Una plantilla válida no prueba ejecución; espere Job hijo real, limitado y fallido, propiedad de CronJob. Errores API/tiempo al leer Jobs también usan este marcador. Job original usa backoffLimit=100 y activeDeadlineSeconds=300; CronJob recurrente inicialmente ausente. El resultado esperado es validación fallida limitada. Setup elimina job.yaml: observe objetos vivos y batch-contract.json suministrado. `kubectl get jobs -o json | jq ''.items[] | {name:.metadata.name,owners:.metadata.ownerReferences,status:.status}''`.


      ### Cadena de propietarios controller {#batch-child-owner-chain-and-real-exit}


      La ejecución recurrente puede carecer de Failed Pod con carga original y exit code uno; siga CronJob→Job→Pod por controller UID. Errores API/tiempo al leer Pods también usan este marcador. Job original usa backoffLimit=100 y activeDeadlineSeconds=300; CronJob recurrente inicialmente ausente. El resultado esperado es validación fallida limitada. Setup elimina job.yaml: observe objetos vivos y batch-contract.json suministrado. `kubectl get pods -o json | jq ''.items[] | {name:.metadata.name,owners:.metadata.ownerReferences,status:.status}''`.


      ### Iniciar observación de política {#batch-policy-startup-fallback}


      La comprobación shell anterior de 8s puede agotar tiempo sin marcador, por ejemplo con kubectl bloqueado; errores de inicio del helper o facts fijados también dan fallback. API/tiempos dentro del observador Python usan marcador del objeto solicitado. Job original usa backoffLimit=100 y activeDeadlineSeconds=300; CronJob recurrente inicialmente ausente. El resultado esperado es validación fallida limitada. Setup elimina job.yaml: observe objetos vivos y batch-contract.json suministrado. `python3 -I -c "import dq_check"; jq .contract /run/dq/facts/0/batch-identities.json`.


      ### Iniciar observación de ejecución {#batch-evidence-startup-fallback}


      La comprobación shell anterior de 8s puede agotar tiempo sin marcador, por ejemplo con kubectl bloqueado; errores de inicio del helper o facts fijados también dan fallback. API/tiempos dentro del observador Python usan marcador del objeto solicitado. Job original usa backoffLimit=100 y activeDeadlineSeconds=300; CronJob recurrente inicialmente ausente. El resultado esperado es validación fallida limitada. Setup elimina job.yaml: observe objetos vivos y batch-contract.json suministrado. `python3 -I -c "import dq_check"; jq .contract /run/dq/facts/0/batch-identities.json`.


      ## Pruébalo


      Abra el **kubernetes Lab** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿CrashLoopBackOff y una imagen no disponible necesitan la misma reparación?


      ```bash

      cd ~/lab/examples/troubleshooting

      bash run.sh

      kubectl -n lab-troubleshooting get pods

      kubectl -n lab-troubleshooting describe pod missing

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. Un contenedor funcionó y salió con el código 3; el otro nunca empezó porque su imagen está ausente. Previous logs explica sólo el primer fallo.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh`, luego `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.


      Sitúa el fallo en su fase real antes de elegir una corrección. La creación del Pod, ejecución de init, arranque, readiness y datos de aplicación pueden mostrar estados distintos. Conserva el reason y mensaje de runtime observados en lugar de reducir todos los fallos a un único estado. Correlaciona límites activos, entradas y vida del volumen con registros reales; un reinicio o rollout correcto por sí solo no demuestra el resultado completo.'
    de: 'Nutze Belege, die der handelnden Identität zugänglich sind. Eine verweigerte clusterweite Liste beschreibt Beobachterrechte, nicht den Zustand eines bestimmten Pods oder Volumes. Definitionen, Status, Ereignisse und gesunde Referenzobjekte im Namespace können Scheduling-Anforderungen, Claim-Einstellungen und Anwendungsdaten zeigen. Trenne einen nicht verfügbaren Beobachtungspfad vom eigentlichen Anwendungsfehler und bleibe innerhalb der bereitgestellten Berechtigung.


      Beginnen Sie mit dem Symptom und finden Sie die fehlerhafte Ebene: Zulassung, Planung, Bildvorbereitung, Prozess oder Verkehr. Lesen Sie status, events und den entsprechenden Container logs, bevor Sie die Arbeitslast bearbeiten.


      ### Fehlendes Release-Image {#relay-release-image}


      In Aufgabe 001 kann das Deployment `relay` den Container `worker` nicht starten, weil dessen Image fehlt. Prüfe die Pod-Ereignisse und vergleiche `deployment.yaml` mit dem bereitgestellten CI-Artefakt `release-manifest.json`. Setze das Worker-Image auf den vollständigen `image`-Wert aus dem Artefakt, behalte `imagePullPolicy: Never` bei und warte auf den Rollout von `relay`. Das Image ist in dieser Offline-Umgebung bereits geladen; lade es nicht aus einer externen Registry.


      ### Start von clock und Pod-Dateien {#clock-startup-artifacts}


      In Aufgabe 011 benötigt `clock.yaml` einen Befehl, der einen UTC-Zeitstempel nach `/tmp/clock` und `POD_NAME` nach `/tmp/identity` schreibt und im Vordergrund weiterläuft. Setze den Umgebungswert über `fieldRef` mit `fieldPath: metadata.name`: Das ist der Pod-Name, nicht der Deployment-Name. Vergleiche nach dem Rollout `/tmp/identity` mit dem tatsächlichen Pod-Namen und prüfe das UTC-Format in `/tmp/clock`, zum Beispiel `2026-01-02T03:04:05Z`.


      ### Start und Logs von route-worker {#route-worker-startup}


      Lies in Aufgabe 014 die aktuellen oder `--previous`-Logs des Pods `route-worker` und speichere die genaue Zeile `route must equal north` in `diagnosis.txt`. Der Prozess liest den Schlüssel `name` der ConfigMap `route` über `ROUTE`. Setze den Schlüssel auf `north`, starte `deployment/route-worker` neu und prüfe Rollout und `printenv ROUTE`. Die Änderung der ConfigMap allein aktualisiert die Umgebung eines laufenden Prozesses nicht.


      ### Ungebundene Ziel-PVC diagnostizieren {#storage-target-binding-gate}


      Die Ziel-PVC spool ist nicht Bound oder die Richtlinienbeobachtung endete ohne benannten Marker; die gelieferte unbekannte Speicherklasse kann sie Pending lassen, während fehlende geschützte Belege, fehlerhaftes JSON oder Startfehler ebenfalls die Beobachtung verhindern.  `kubectl get pvc spool reserve -o yaml; kubectl describe pvc spool`.


      ### Vorhandenen Job erhalten {#batch-preserve-original-job}


      Neuanlegen von importer ändert die eingefrorene UID; korrigieren Sie den vorhandenen Job und prüfen Sie API-Zugriff bei unlesbarem Original. Der ursprüngliche Job startet mit backoffLimit=100 und activeDeadlineSeconds=300; der wiederkehrende CronJob fehlt zunächst. Ziel ist eine begrenzte fehlschlagende Validierung. Setup entfernt job.yaml; prüfen Sie Live-Objekte und geliefertes batch-contract.json. `kubectl get job importer -o jsonpath="{.metadata.uid}"`.


      ### Ursprünglichen worker Befehl erhalten {#batch-retain-failing-worker-command}


      Ersetzen des gelieferten fehlschlagenden Befehls durch Erfolg verbirgt den Validierungsfehler; erhalten Sie den ursprünglichen worker Befehl aus Live-Job und eingefrorenen Facts. Der ursprüngliche Job startet mit backoffLimit=100 und activeDeadlineSeconds=300; der wiederkehrende CronJob fehlt zunächst. Ziel ist eine begrenzte fehlschlagende Validierung. Setup entfernt job.yaml; prüfen Sie Live-Objekte und geliefertes batch-contract.json. `kubectl get job importer -o json | jq ''.spec.template.spec.containers[] | select(.name=="worker") | .command''`.


      ### Fehlgeschlagene Ausführung sichtbar lassen {#batch-never-restart-policy}


      Eine Restart-Policy außer Never kann innerhalb des Pods wiederholen, statt die erwartete fehlgeschlagene Ausführung zu hinterlassen; erhalten Sie die gelieferte Policy. Der ursprüngliche Job startet mit backoffLimit=100 und activeDeadlineSeconds=300; der wiederkehrende CronJob fehlt zunächst. Ziel ist eine begrenzte fehlschlagende Validierung. Setup entfernt job.yaml; prüfen Sie Live-Objekte und geliefertes batch-contract.json. `kubectl get job importer -o jsonpath="{.spec.template.spec.restartPolicy}"`.


      ### Eine parallele Ausführung {#batch-single-parallel-execution}


      Parallelism wurde beim Ändern der Grenzen möglicherweise erhöht; erhalten Sie eins für importer und prüfen Sie API-Ausgabe bei fehlender Feldbeobachtung. Der ursprüngliche Job startet mit backoffLimit=100 und activeDeadlineSeconds=300; der wiederkehrende CronJob fehlt zunächst. Ziel ist eine begrenzte fehlschlagende Validierung. Setup entfernt job.yaml; prüfen Sie Live-Objekte und geliefertes batch-contract.json. `kubectl get job importer -o jsonpath="{.spec.parallelism}"`.


      ### Aktuelle Wiederholungen begrenzen {#batch-bound-current-job-retries}


      Der gelieferte Job erlaubt 100 Wiederholungen; reduzieren Sie backoffLimit beim bestehenden Job auf eins, um die fehlschlagende Validierung zu begrenzen. Der ursprüngliche Job startet mit backoffLimit=100 und activeDeadlineSeconds=300; der wiederkehrende CronJob fehlt zunächst. Ziel ist eine begrenzte fehlschlagende Validierung. Setup entfernt job.yaml; prüfen Sie Live-Objekte und geliefertes batch-contract.json. `kubectl get job importer -o jsonpath="{.spec.backoffLimit}"`.


      ### Aktuelle Frist begrenzen {#batch-bound-current-job-deadline}


      Geliefertes activeDeadlineSeconds ist 300; setzen Sie die Frist des vorhandenen Jobs auf erforderliche 30 Sekunden, statt die Ausführung zu löschen. Der ursprüngliche Job startet mit backoffLimit=100 und activeDeadlineSeconds=300; der wiederkehrende CronJob fehlt zunächst. Ziel ist eine begrenzte fehlschlagende Validierung. Setup entfernt job.yaml; prüfen Sie Live-Objekte und geliefertes batch-contract.json. `kubectl get job importer -o jsonpath="{.spec.activeDeadlineSeconds}"`.


      ### Aktuellen Job beobachten {#batch-current-job-api-observation}


      Der aktuelle Job fehlt möglicherweise oder API-Anfrage, JSON-Verarbeitung oder Zeitlimit scheitern; prüfen Sie importer vor dem Vergleich der ursprünglichen Workload. Der ursprüngliche Job startet mit backoffLimit=100 und activeDeadlineSeconds=300; der wiederkehrende CronJob fehlt zunächst. Ziel ist eine begrenzte fehlschlagende Validierung. Setup entfernt job.yaml; prüfen Sie Live-Objekte und geliefertes batch-contract.json. `kubectl get job importer --request-timeout=3s`.


      ### Ursprüngliche Workload und Identität {#batch-original-image-command-and-identity}


      Der aktuelle Job wurde möglicherweise ersetzt oder ursprüngliches image, worker Befehl oder Never geändert; vergleichen Sie mit eingefrorenen batch-identities. Der ursprüngliche Job startet mit backoffLimit=100 und activeDeadlineSeconds=300; der wiederkehrende CronJob fehlt zunächst. Ziel ist eine begrenzte fehlschlagende Validierung. Setup entfernt job.yaml; prüfen Sie Live-Objekte und geliefertes batch-contract.json. `kubectl get job importer -o json | jq ''{uid:.metadata.uid,spec:.spec}''`.


      ### Aktiver Zeitplan ohne Überlappung {#batch-active-cron-schedule-and-concurrency}


      Der wiederkehrende CronJob fehlt möglicherweise, ist suspended, nutzt anderen Zeitplan oder erlaubt Überlappung; vergleichen Sie mit batch-contract.json. API-/Zeitfehler beim Lesen ergeben ebenfalls diesen Marker. Der ursprüngliche Job startet mit backoffLimit=100 und activeDeadlineSeconds=300; der wiederkehrende CronJob fehlt zunächst. Ziel ist eine begrenzte fehlschlagende Validierung. Setup entfernt job.yaml; prüfen Sie Live-Objekte und geliefertes batch-contract.json. `kubectl get cronjob validation-cycle -o json | jq .spec`.


      ### Begrenztes wiederkehrendes Template {#batch-bounded-recurring-job-template}


      Das CronJob-Template behält möglicherweise breite retry/deadline Werte oder ändert die Workload; übernehmen Sie alle vier exakten Grenzen sowie ursprüngliches image, Befehl und Never. Der ursprüngliche Job startet mit backoffLimit=100 und activeDeadlineSeconds=300; der wiederkehrende CronJob fehlt zunächst. Ziel ist eine begrenzte fehlschlagende Validierung. Setup entfernt job.yaml; prüfen Sie Live-Objekte und geliefertes batch-contract.json. `kubectl get cronjob validation-cycle -o json | jq .spec.jobTemplate.spec`.


      ### Tatsächlicher fehlgeschlagener Versuch {#batch-observe-current-failed-attempt}


      Der fehlschlagende Befehl lief möglicherweise noch nicht oder sein Fehler wurde verborgen; erhalten Sie den ursprünglichen Job und prüfen Sie failed Zähler und Events. Der ursprüngliche Job startet mit backoffLimit=100 und activeDeadlineSeconds=300; der wiederkehrende CronJob fehlt zunächst. Ziel ist eine begrenzte fehlschlagende Validierung. Setup entfernt job.yaml; prüfen Sie Live-Objekte und geliefertes batch-contract.json. `kubectl get job importer -o json | jq .status.failed`.


      ### Endgültiger Job-Fehler {#batch-terminal-current-job-failure}


      Der Job wiederholt möglicherweise noch mit alten Grenzen oder ist noch nicht endgültig fehlgeschlagen; prüfen Sie die Grenzen und warten Sie auf Failed=True. Der ursprüngliche Job startet mit backoffLimit=100 und activeDeadlineSeconds=300; der wiederkehrende CronJob fehlt zunächst. Ziel ist eine begrenzte fehlschlagende Validierung. Setup entfernt job.yaml; prüfen Sie Live-Objekte und geliefertes batch-contract.json. `kubectl get job importer -o json | jq .status.conditions`.


      ### Fehlgeschlagener Pod des ursprünglichen Jobs {#batch-original-job-owned-failed-pod}


      Ein Label allein beweist keine Zugehörigkeit des fehlgeschlagenen Pods zum ursprünglichen Job; prüfen Sie Controller-Owner-UID, Failed Phase und worker Beendigung mit Exitcode eins. Der ursprüngliche Job startet mit backoffLimit=100 und activeDeadlineSeconds=300; der wiederkehrende CronJob fehlt zunächst. Ziel ist eine begrenzte fehlschlagende Validierung. Setup entfernt job.yaml; prüfen Sie Live-Objekte und geliefertes batch-contract.json. `kubectl get pods -l job-name=importer -o json | jq ''.items[] | {owners:.metadata.ownerReferences,status:.status}''`.


      ### Tatsächlicher geplanter Kind-Job {#batch-observed-cron-owned-failed-job}


      Ein gültiges Template allein belegt keine Ausführung; warten Sie auf einen tatsächlichen begrenzten, fehlgeschlagenen Kind-Job des CronJobs. API-/Zeitfehler beim Lesen von Jobs ergeben ebenfalls diesen Marker. Der ursprüngliche Job startet mit backoffLimit=100 und activeDeadlineSeconds=300; der wiederkehrende CronJob fehlt zunächst. Ziel ist eine begrenzte fehlschlagende Validierung. Setup entfernt job.yaml; prüfen Sie Live-Objekte und geliefertes batch-contract.json. `kubectl get jobs -o json | jq ''.items[] | {name:.metadata.name,owners:.metadata.ownerReferences,status:.status}''`.


      ### Controller-Eigentümerkette verfolgen {#batch-child-owner-chain-and-real-exit}


      Der wiederkehrenden Ausführung fehlt möglicherweise ein Failed Pod mit ursprünglicher Workload und Exitcode eins; verfolgen Sie CronJob→Job→Pod über Controller-UIDs. API-/Zeitfehler beim Lesen von Pods ergeben ebenfalls diesen Marker. Der ursprüngliche Job startet mit backoffLimit=100 und activeDeadlineSeconds=300; der wiederkehrende CronJob fehlt zunächst. Ziel ist eine begrenzte fehlschlagende Validierung. Setup entfernt job.yaml; prüfen Sie Live-Objekte und geliefertes batch-contract.json. `kubectl get pods -o json | jq ''.items[] | {name:.metadata.name,owners:.metadata.ownerReferences,status:.status}''`.


      ### Policy-Beobachtung starten {#batch-policy-startup-fallback}


      Die frühere Shell-Prüfung mit 8s Limit kann etwa bei blockiertem kubectl ohne Marker auslaufen; Helper-Start oder eingefrorene Facts können ebenfalls diesen Fallback verursachen. API-/Zeitfehler innerhalb des Python-Observers ergeben den Marker des angefragten Objekts. Der ursprüngliche Job startet mit backoffLimit=100 und activeDeadlineSeconds=300; der wiederkehrende CronJob fehlt zunächst. Ziel ist eine begrenzte fehlschlagende Validierung. Setup entfernt job.yaml; prüfen Sie Live-Objekte und geliefertes batch-contract.json. `python3 -I -c "import dq_check"; jq .contract /run/dq/facts/0/batch-identities.json`.


      ### Ausführungsbeobachtung starten {#batch-evidence-startup-fallback}


      Die frühere Shell-Prüfung mit 8s Limit kann etwa bei blockiertem kubectl ohne Marker auslaufen; Helper-Start oder eingefrorene Facts können ebenfalls diesen Fallback verursachen. API-/Zeitfehler innerhalb des Python-Observers ergeben den Marker des angefragten Objekts. Der ursprüngliche Job startet mit backoffLimit=100 und activeDeadlineSeconds=300; der wiederkehrende CronJob fehlt zunächst. Ziel ist eine begrenzte fehlschlagende Validierung. Setup entfernt job.yaml; prüfen Sie Live-Objekte und geliefertes batch-contract.json. `python3 -I -c "import dq_check"; jq .contract /run/dq/facts/0/batch-identities.json`.


      ## Probieren Sie es aus


      Öffnen Sie das **kubernetes Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und prüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Benötigen CrashLoopBackOff und ein nicht verfügbares Image dieselbe Reparatur?


      ```bash

      cd ~/lab/examples/troubleshooting

      bash run.sh

      kubectl -n lab-troubleshooting get pods

      kubectl -n lab-troubleshooting describe pod missing

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Ein Container wurde ausgeführt und mit Code 3 beendet. der andere hat nie begonnen, weil sein Bild fehlt. Previous logs erklären nur den ersten Fehler.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann mit `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.


      Ordne einen Fehler seiner tatsächlichen Phase zu, bevor du eine Abhilfe auswählst. Pod-Erstellung, Initialisiererausführung, Prozessstart, Readiness und Anwendungsdaten können unterschiedliche Zustände zeigen. Bewahre beobachteten Reason und Runtime-Meldung, statt jeden Fehler auf einen Statuswert zu reduzieren. Korreliere wirksame Limits, Eingabedaten und Volume-Lebensdauer mit echten Datensätzen; erfolgreicher Neustart oder Rollout allein belegt kein vollständiges Anwendungsergebnis.'
