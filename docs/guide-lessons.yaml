terraform-4:
  profile: opentofu
  example: locking
  source_hash: ddff71df22c9d777af03a5a81ea8ce5598da4f6d31fdb7d3e97aae58cb907b6d
  content:
    en: 'A state lock prevents competing writers to one state. It is separate from Git locking and cloud resource permissions. This experiment uses the local backend; S3 authentication, remote locking and cloud recovery remain an additional AWS practicum.


      In quest 087, inspect `lock-probe.log` and the PID of the local maintenance holder. Stop that holder without deleting state or force-unlocking another user, then verify the managed notice, state address and empty plan.


      ## Try it


      Open the **opentofu Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Will the second operation wait forever when -lock-timeout=1s is set?


      ```bash

      cd ~/lab/examples/locking

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Expected result

      > No. It fails to acquire the lock within the timeout. After the first apply finishes, the plan succeeds.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Блокировка state защищает одно состояние от конкурирующих записей. Она не заменяет Git и права на облачные ресурсы. В опыте используется local backend; S3, удалённые блокировки и облачное восстановление остаются дополнительным AWS-практикумом.


      В квесте 087 изучите `lock-probe.log` и PID локального процесса, удерживающего блокировку. Остановите его, не удаляя state и не снимая принудительно чужую блокировку, затем проверьте управляемое сообщение, адрес state и пустой план.


      ## Попробуйте


      Откройте лабораторию **opentofu**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Будет ли вторая операция ждать бесконечно при -lock-timeout=1s?


      ```bash

      cd ~/lab/examples/locking

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Она завершается отказом получения блокировки по таймауту. После первого apply план проходит.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Blokada state uniemożliwia konkurującym zapisom na jednym state. Różni się od blokowania Git i uprawnień do zasobów w chmurze. W tym eksperymencie wykorzystano local backend; Uwierzytelnianie S3, zdalne blokowanie i odzyskiwanie w chmurze pozostają dodatkową praktyką AWS.


      W zadaniu 087 sprawdź `lock-probe.log` i PID lokalnego procesu utrzymującego blokadę. Zatrzymaj go bez usuwania state ani wymuszania odblokowania innego użytkownika, a potem sprawdź zarządzane powiadomienie, adres state i pusty plan.


      ## Wypróbuj


      Otwórz laboratorium **opentofu** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy druga operacja będzie czekać w nieskończoność po ustawieniu -lock-timeout=1s?


      ```bash

      cd ~/lab/examples/locking

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Nie udało się uzyskać blokady w określonym czasie. Po zakończeniu pierwszego apply plan się powiódł.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Un bloqueo de estado impide que los escritores compitan en un estado. Es independiente del bloqueo Git y de los permisos de recursos en la nube. Este experimento utiliza local backend; La autenticación S3, el bloqueo remoto y la recuperación en la nube siguen siendo una práctica adicional de AWS.


      En el ejercicio 087, inspecciona `lock-probe.log` y el PID del proceso local que mantiene el bloqueo. Detén ese proceso sin borrar state ni forzar el desbloqueo de otro usuario; comprueba el aviso gestionado, la dirección en state y el plan vacío.


      ## Pruébalo


      Abra el **opentofu Lab** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿La segunda operación esperará eternamente cuando se configure -lock-timeout=1s?


      ```bash

      cd ~/lab/examples/locking

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. No logra adquirir el bloqueo dentro del tiempo de espera. Una vez finalizado el primer apply, el plan tiene éxito.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh` y luego con `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Eine Statussperre verhindert, dass konkurrierende Autoren in einen Status schreiben. Es ist unabhängig von den Sperr- und Cloud-Ressourcenberechtigungen Git. Dieses Experiment verwendet local backend; S3 Authentifizierung, Fernsperrung und Cloud-Wiederherstellung bleiben ein zusätzliches AWS-Praktikum.


      Prüfe in Aufgabe 087 `lock-probe.log` und die PID des lokalen Prozesses, der die Sperre hält. Stoppe ihn, ohne State zu löschen oder die Sperre eines anderen Benutzers zwangsweise zu lösen; prüfe danach die verwaltete Nachricht, State-Adresse und den leeren Plan.


      ## Probieren Sie es aus


      Öffnen Sie das **opentofu Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Wird der zweite Vorgang ewig warten, wenn -lock-timeout=1s festgelegt ist?


      ```bash

      cd ~/lab/examples/locking

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Es gelingt ihm nicht, die Sperre innerhalb des Zeitlimits zu erhalten. Nachdem der erste apply abgeschlossen ist, ist der Plan erfolgreich.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: locking
  additional:
    en: S3 backend configuration is an additional cloud practicum. This Lab demonstrates a real local state lock, not an S3 backend.
    ru: Настройка S3 backend — дополнительный облачный практикум. Здесь проверяется настоящая блокировка локального state; S3 backend не подключён.
    pl: Konfiguracja backendu S3 to dodatkowe ćwiczenie w chmurze. To laboratorium demonstruje rzeczywistą blokadę lokalnego stanu, a nie backend S3.
    es: La configuración de S3 backend es una práctica adicional en la nube. Este laboratorio demuestra un bloqueo de estado local real, no un S3 backend.
    de: Die S3 backend-Konfiguration ist ein zusätzliches Cloud-Praktikum. In diesem Labor wird eine echte lokale Statussperre demonstriert, keine S3 backend.
terraform-6:
  profile: opentofu
  example: lifecycle
  source_hash: 5d66690f7642741100ea92e7005b72e96007c700ca2283b1daad193742ea399f
  content:
    en: 'Some changes update an object; others replace its identity. triggers_replace forces replacement in this local example, and create_before_destroy changes the ordering. A saved plan records the intended actions before apply.


      In quest 029, restore the declared `north-ready` content of `notice.txt` and protect `local_file.notice` with `prevent_destroy`. Verify the state address and a no-change detailed plan, then inspect the failed destroy plan and its `prevent_destroy` diagnostic. The guard applies while the rule is present; the observed result does not prove that protection was always configured.


      In quest 036, changing the managed file name proposes replacement of `local_file.ledger`. Save the proposed plan and export it as `rejected-plan.json` before restoring the intended `ledger.txt` declaration; do not apply the replacement. The JSON resource actions must include both `delete` and `create`. After recovery, verify `ledger.txt` contains `revision-36`, `retired-ledger.txt` is absent, `ledger_id` matches `original-id`, and the final detailed plan exits 0.


      In quest 019, `terraform_data.directory` runs `prepare.sh` to create `work/.prepared`; `terraform_data.marker` runs `write.sh`, which needs that marker before it writes `work/route.txt`. The dependency must point from marker to directory: put `depends_on = [terraform_data.directory]` on `terraform_data.marker`, and remove the opposite dependency. Inspect `tofu graph`, apply, then verify `work/route.txt` contains `north`, `work/.prepared` exists, both addresses are in state, and a final detailed plan exits 0.


      ## Try it


      Open the **opentofu Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Does create_before_destroy preserve the old resource ID?


      ```bash

      cd ~/lab/examples/lifecycle

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The plan orders create before delete, and the final ID changes.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Одни изменения обновляют объект, другие заменяют его идентичность. Здесь triggers_replace требует замены, create_before_destroy меняет порядок. Сохранённый plan позволяет проверить действия до apply.


      В квесте 029 восстановите заданное содержимое `north-ready` в `notice.txt` и защитите `local_file.notice` с помощью `prevent_destroy`. Проверьте адрес в state и подробный plan без изменений, затем изучите отказавший destroy plan и сообщение `prevent_destroy`. Защита действует, пока правило присутствует; наблюдаемый результат не доказывает, что оно было настроено всегда.


      В квесте 036 изменение имени управляемого файла предлагает замену `local_file.ledger`. Сохраните предложенный plan и экспортируйте его в `rejected-plan.json` до восстановления нужного объявления `ledger.txt`; не применяйте замену. Действия ресурса в JSON должны включать `delete` и `create`. После восстановления убедитесь, что `ledger.txt` содержит `revision-36`, `retired-ledger.txt` отсутствует, `ledger_id` совпадает с `original-id`, а итоговый подробный plan завершается с кодом 0.


      В квесте 019 `terraform_data.directory` выполняет `prepare.sh`, создающий `work/.prepared`; `terraform_data.marker` выполняет `write.sh`, которому нужен этот маркер перед записью `work/route.txt`. Зависимость должна идти от marker к directory: укажите `depends_on = [terraform_data.directory]` в `terraform_data.marker` и удалите обратную зависимость. Изучите `tofu graph`, примените конфигурацию и убедитесь, что `work/route.txt` содержит `north`, `work/.prepared` существует, оба адреса есть в state и итоговый подробный plan завершается с кодом 0.


      ## Попробуйте


      Откройте лабораторию **opentofu**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Сохраняет ли create_before_destroy прежний ID ресурса?


      ```bash

      cd ~/lab/examples/lifecycle

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Plan ставит create перед delete, итоговый ID меняется.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Niektóre zmiany aktualizują obiekt; inne zastępują jego tożsamość. triggers_replace wymusza wymianę w tym lokalnym przykładzie, a create_before_destroy zmienia kolejność. Zapisany plan rejestruje zamierzone działania przed apply.


      W zadaniu 029 przywróć zadeklarowaną zawartość `north-ready` w `notice.txt` i zabezpiecz `local_file.notice` przez `prevent_destroy`. Sprawdź adres w state i szczegółowy plan bez zmian, a następnie zbadaj nieudany destroy plan i komunikat `prevent_destroy`. Ochrona działa, dopóki reguła istnieje; obserwowany wynik nie dowodzi, że była zawsze skonfigurowana.


      W zadaniu 036 zmiana nazwy zarządzanego pliku proponuje zastąpienie `local_file.ledger`. Zapisz proponowany plan i wyeksportuj go do `rejected-plan.json` przed przywróceniem właściwej deklaracji `ledger.txt`; nie stosuj zastąpienia. Działania zasobu w JSON muszą zawierać `delete` i `create`. Po przywróceniu sprawdź, że `ledger.txt` zawiera `revision-36`, `retired-ledger.txt` nie istnieje, `ledger_id` odpowiada `original-id`, a końcowy szczegółowy plan kończy się kodem 0.


      W zadaniu 019 `terraform_data.directory` uruchamia `prepare.sh`, który tworzy `work/.prepared`; `terraform_data.marker` uruchamia `write.sh`, wymagający tego znacznika przed zapisaniem `work/route.txt`. Zależność musi prowadzić od marker do directory: ustaw `depends_on = [terraform_data.directory]` w `terraform_data.marker` i usuń zależność przeciwną. Sprawdź `tofu graph`, zastosuj konfigurację i upewnij się, że `work/route.txt` zawiera `north`, `work/.prepared` istnieje, oba adresy są w state, a końcowy szczegółowy plan kończy się kodem 0.


      ## Wypróbuj


      Otwórz laboratorium **opentofu** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy create_before_destroy zachowuje stary zasób ID?


      ```bash

      cd ~/lab/examples/lifecycle

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. plan zamawia create przed delete, a ostateczne zmiany ID.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Algunos cambios actualizan un objeto; otros reemplazan su identidad. triggers_replace fuerza el reemplazo en este ejemplo local y create_before_destroy cambia el orden. Un plan guardado registra las acciones previstas antes de apply.


      En el ejercicio 029, restaura el contenido declarado `north-ready` de `notice.txt` y protege `local_file.notice` con `prevent_destroy`. Comprueba la dirección en state y un plan detallado sin cambios; después inspecciona el plan de destrucción fallido y su mensaje `prevent_destroy`. La protección se aplica mientras exista la regla; el resultado observado no demuestra que siempre estuviera configurada.


      En el ejercicio 036, cambiar el nombre del archivo gestionado propone reemplazar `local_file.ledger`. Guarda el plan propuesto y expórtalo como `rejected-plan.json` antes de restaurar la declaración de `ledger.txt`; no apliques el reemplazo. Las acciones del recurso en JSON deben incluir `delete` y `create`. Tras la recuperación, comprueba que `ledger.txt` contiene `revision-36`, que `retired-ledger.txt` no existe, que `ledger_id` coincide con `original-id` y que el plan detallado final termina con código 0.


      En el ejercicio 019, `terraform_data.directory` ejecuta `prepare.sh` para crear `work/.prepared`; `terraform_data.marker` ejecuta `write.sh`, que necesita ese marcador antes de escribir `work/route.txt`. La dependencia debe ir de marker a directory: coloca `depends_on = [terraform_data.directory]` en `terraform_data.marker` y elimina la dependencia inversa. Inspecciona `tofu graph`, aplica y comprueba que `work/route.txt` contiene `north`, existe `work/.prepared`, ambas direcciones están en state y el plan detallado final termina con código 0.


      ## Pruébalo


      Abra el **Laboratorio opentofu** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿create_before_destroy conserva el recurso antiguo ID?


      ```bash

      cd ~/lab/examples/lifecycle

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. Los pedidos plan se crean antes de delete y los cambios finales de ID.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh` y luego con `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Einige Änderungen aktualisieren ein Objekt; andere ersetzen seine Identität. triggers_replace erzwingt in diesem lokalen Beispiel die Ersetzung, und create_before_destroy ändert die Reihenfolge. Ein gespeicherter plan zeichnet die beabsichtigten Aktionen vor apply auf.


      Stelle in Aufgabe 029 den deklarierten Inhalt `north-ready` in `notice.txt` wieder her und schütze `local_file.notice` mit `prevent_destroy`. Prüfe die State-Adresse und einen detaillierten Plan ohne Änderungen; untersuche danach den fehlgeschlagenen Destroy-Plan und dessen Meldung `prevent_destroy`. Der Schutz gilt, solange die Regel vorhanden ist; das beobachtete Ergebnis beweist nicht, dass der Schutz immer konfiguriert war.


      In Aufgabe 036 schlägt die Änderung des verwalteten Dateinamens den Ersatz von `local_file.ledger` vor. Speichere den vorgeschlagenen Plan und exportiere ihn als `rejected-plan.json`, bevor du die gewünschte Deklaration für `ledger.txt` wiederherstellst; wende den Ersatz nicht an. Die Ressourcenaktionen im JSON müssen `delete` und `create` enthalten. Prüfe nach der Wiederherstellung, dass `ledger.txt` `revision-36` enthält, `retired-ledger.txt` fehlt, `ledger_id` mit `original-id` übereinstimmt und der abschließende detaillierte Plan mit Code 0 endet.


      In Aufgabe 019 führt `terraform_data.directory` das Skript `prepare.sh` aus, das `work/.prepared` erstellt; `terraform_data.marker` führt `write.sh` aus und benötigt diese Markierung, bevor es `work/route.txt` schreibt. Die Abhängigkeit muss von marker zu directory zeigen: Setze `depends_on = [terraform_data.directory]` in `terraform_data.marker` und entferne die umgekehrte Abhängigkeit. Prüfe `tofu graph`, wende die Konfiguration an und stelle sicher, dass `work/route.txt` `north` enthält, `work/.prepared` existiert, beide Adressen im State stehen und der abschließende detaillierte Plan mit Code 0 endet.


      ## Probieren Sie es aus


      Öffnen Sie das **opentofu Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Behält create_before_destroy die alte Ressource ID bei?


      ```bash

      cd ~/lab/examples/lifecycle

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Die plan-Bestellungen werden vor delete erstellt und die endgültigen ID-Änderungen.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
