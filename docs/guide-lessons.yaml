      Prywatne dostarczanie łączy ukrywanie wyjścia, dostęp odbiorcy i izolację innych kont. Właściciel, grupy i faktyczne uprawnienia operatora wyznaczają dozwolone zmiany metadanych; łączna zmiana treści i właściciela może zawieść przy ograniczonych prawach. Sprawdzaj rzeczywiste uwierzytelnianie i odmowę odczytu oraz zapisu innym kontom bez wypisywania sekretów. Same ograniczone prawa nie dowodzą dostępu właściwej aplikacji.


      Zadanie 089 wiąże bajty artefaktu z zaufanym potwierdzeniem publikacji i prywatnym dostępem rzeczywistych aplikacji bez przywilejów. Zmiany właściciela muszą uwzględniać capabilities operatora. Poprawne źródła i ograniczone prawa mogą współistnieć z nieczytelnymi wejściami lub nieodświeżoną aplikacją. Uwierzytelniaj każdą instancję i śledź zależność od zweryfikowanego źródła do przyjęcia danych przez `application-contract.json`. Twórz Authorization w pamięci, aby nie wyświetlać syntetycznych danych dostępu.'
    es: 'Ansible Vault cifra los datos en reposo. El controlador necesita un secreto de descifrado en el momento de la ejecución, y no_log evita que la salida de esa tarea revele valores. Este laboratorio utiliza una contraseña de demostración deliberadamente desechable.


      ### Causa y observación (069, deployment_log) {#private-delivery-nonempty-log}


      El play puede no haberse ejecutado con captura de salida o deployment.log estar vacío; conserve un registro no vacío. La tarea copy suministrada usa mode 644 y desactiva no_log. Entregue ambas entradas con permisos privados y propietario receptor. Los programas originales leen en cada petición HTTP; no requieren reinicio ni SIGHUP. Observe metadatos sin imprimir credential. `test -s deployment.log`


