kubernetes-4:
  profile: kubernetes
  example: probes
  source_hash: ecad6a149624396bcbf84129724c608bfe67154652b0f31858ad810bf0d16ecf
  content:
    en: 'A probe answers one question about a container. Startup gates the other probes; readiness controls traffic eligibility; liveness can restart the container. A Running pod can still be unready.


      ## Try it


      Open the **kubernetes Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Does deleting the readiness marker restart the container?


      ```bash

      cd ~/lab/examples/probes

      bash run.sh

      kubectl -n lab-probes get pod probe

      kubectl -n lab-probes describe pod probe

      # Check readiness and liveness separately.

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The readiness transition leaves the restart count unchanged. Removing the liveness marker then produces a restart.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Проба отвечает на один вопрос о контейнере. Startup задерживает остальные пробы, readiness определяет готовность принимать трафик, liveness может перезапустить контейнер. Running ещё не означает Ready.


      ## Попробуйте


      Откройте лабораторию **kubernetes**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Удаление файла readiness перезапустит контейнер?


      ```bash

      cd ~/lab/examples/probes

      bash run.sh

      kubectl -n lab-probes get pod probe

      kubectl -n lab-probes describe pod probe

      # Check readiness and liveness separately.

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. После отказа readiness число перезапусков остаётся прежним. Удаление файла liveness затем приводит к перезапуску.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Sonda odpowiada na jedno question dotyczące kontenera. Startup bramkuje inne sondy; readiness kontroluje kwalifikowalność ruchu; liveness może zrestartować kontener. Moduł Running może nadal nie być gotowy.


      ## Wypróbuj


      Otwórz laboratorium **kubernetes** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy usunięcie znacznika readiness powoduje ponowne uruchomienie kontenera?


      ```bash

      cd ~/lab/examples/probes

      bash run.sh

      kubectl -n lab-probes get pod probe

      kubectl -n lab-probes describe pod probe

      # Check readiness and liveness separately.

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Przejście readiness pozostawia licznik ponownych uruchomień bez zmian. Usunięcie znacznika liveness powoduje ponowne uruchomienie.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Un probe responde a un question sobre un contenedor. Startup controla las otras sondas; readiness controla la elegibilidad del tráfico; liveness puede reiniciar el contenedor. Es posible que un Running pod aún no esté listo.


      ## Pruébalo


      Abra el **Laboratorio kubernetes** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿Eliminar el marcador readiness reinicia el contenedor?


      ```bash

      cd ~/lab/examples/probes

      bash run.sh

      kubectl -n lab-probes get pod probe

      kubectl -n lab-probes describe pod probe

      # Check readiness and liveness separately.

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. La transición readiness deja el recuento de reinicios sin cambios. Al quitar el marcador liveness se produce un reinicio.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh`, luego `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Ein probe antwortet einem question über einen Container. Startup steuert die anderen Sonden; readiness steuert die Verkehrsberechtigung; liveness kann den Container neu starten. Ein Running pod kann noch nicht fertig sein.


      ## Probieren Sie es aus


      Öffnen Sie das **kubernetes Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Wird der Container durch das Löschen der Markierung readiness neu gestartet?


      ```bash

      cd ~/lab/examples/probes

      bash run.sh

      kubectl -n lab-probes get pod probe

      kubectl -n lab-probes describe pod probe

      # Check readiness and liveness separately.

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Der readiness-Übergang lässt die Neustartanzahl unverändert. Das Entfernen des liveness-Markers führt dann zu einem Neustart.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das vollständige Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-probes
kubernetes-8:
  profile: kubernetes
  example: placement
  source_hash: 36cd87d7a648dd018cb7d1c579c26e90c5220736b717a7008647db08d8d4fecd
  content:
    en: 'Scheduling first filters eligible nodes, then ranks the candidates. A selector, affinity rule or taint can exclude a node even when it has spare CPU. Resource requests are a separate admission constraint.


      ## Try it


      Open the **kubernetes Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Will a tiny CPU request bypass a node selector that matches no node?


      ```bash

      cd ~/lab/examples/placement

      bash run.sh

      kubectl -n lab-placement get pod placed -o wide

      kubectl -n lab-placement describe pod placed

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The pod remains Pending until a node receives the required label.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Планировщик сначала отбирает допустимые узлы, затем выбирает среди них. Selector, affinity или taint могут исключить узел при свободном CPU. Запросы ресурсов — отдельное ограничение.


      ## Попробуйте


      Откройте лабораторию **kubernetes**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Маленький запрос CPU позволит обойти selector, которому не соответствует ни один узел?


      ```bash

      cd ~/lab/examples/placement

      bash run.sh

      kubectl -n lab-placement get pod placed -o wide

      kubectl -n lab-placement describe pod placed

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Pod остаётся Pending, пока узел не получит нужную метку.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Planowanie najpierw filtruje kwalifikujące się węzły, a następnie klasyfikuje kandydatów. Reguła selector, affinity lub taint może wykluczyć węzeł, nawet jeśli ma on zapasowe CPU. Żądania zasobów stanowią osobne ograniczenie dostępu.


      ## Wypróbuj


      Otwórz laboratorium **kubernetes** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy małe żądanie CPU ominie węzeł selector, który nie pasuje do żadnego węzła?


      ```bash

      cd ~/lab/examples/placement

      bash run.sh

      kubectl -n lab-placement get pod placed -o wide

      kubectl -n lab-placement describe pod placed

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Pod pozostaje Pending do czasu, aż węzeł otrzyma wymaganą etykietę.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'La programación primero filtra los nodos elegibles y luego clasifica a los candidatos. Una regla selector, affinity o taint puede excluir un nodo incluso cuando tiene CPU de repuesto. Las solicitudes de recursos son una restricción de admisión separada.


      ## Pruébalo


      Abra el laboratorio **kubernetes** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿Una pequeña solicitud CPU omitirá un nodo selector que no coincida con ningún nodo?


      ```bash

      cd ~/lab/examples/placement

      bash run.sh

      kubectl -n lab-placement get pod placed -o wide

      kubectl -n lab-placement describe pod placed

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. El pod sigue siendo Pending hasta que un nodo recibe la etiqueta requerida.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh`, luego `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Beim Scheduling werden zunächst geeignete Knoten gefiltert und dann werden die Kandidaten in eine Rangfolge gebracht. Eine selector-, affinity-Regel oder taint kann einen Knoten ausschließen, selbst wenn er über einen Ersatz-Knoten CPU verfügt. Ressourcenanfragen stellen eine separate Zulassungsbeschränkung dar.


      ## Probieren Sie es aus


      Öffnen Sie das **kubernetes Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Wird eine kleine CPU-Anfrage einen Knoten selector umgehen, der mit keinem Knoten übereinstimmt?


      ```bash

      cd ~/lab/examples/placement

      bash run.sh

      kubectl -n lab-placement get pod placed -o wide

      kubectl -n lab-placement describe pod placed

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Der pod bleibt Pending, bis ein Knoten das erforderliche Label erhält.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-placement
kubernetes-9:
  profile: kubernetes
  example: resources
  source_hash: 1fc619c72b2eb72dfe6ba60c6a0d49b35ae6bb57c0c5983130588941508f3bc3
  content:
    en: 'Requests reserve schedulable capacity; limits constrain a running container. CPU throttling, container OOM and node-pressure eviction are different events. This experiment contrasts an impossible request with a running, limited container.


      ## Try it


      Open the **kubernetes Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Does a high limit give the scheduler more available CPU?


      ```bash

      cd ~/lab/examples/resources

      bash run.sh

      kubectl -n lab-resources get pods

      kubectl -n lab-resources describe pod oversized

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The oversized request cannot fit. The bounded pod runs, is Burstable, and exposes its CPU and memory limits in cgroup files.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Requests учитываются при размещении; limits ограничивают работающий контейнер. CPU throttling, OOM контейнера и выселение при давлении узла — разные события. В опыте сравниваются невозможный request и работающий контейнер с лимитами.


      ## Попробуйте


      Откройте лабораторию **kubernetes**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Большой limit добавляет планировщику доступный CPU?


      ```bash

      cd ~/lab/examples/resources

      bash run.sh

      kubectl -n lab-resources get pods

      kubectl -n lab-resources describe pod oversized

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Непомерный request не помещается. Ограниченный pod работает, получает класс Burstable, а файлы cgroup показывают лимиты CPU и памяти.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Requests rezerwowa planowalna pojemność; limits ogranicza działający kontener. CPU throttling, kontener OOM i eksmisja pod wpływem nacisku na węzeł to różne zdarzenia. Ten eksperyment porównuje niemożliwy request z działającym, ograniczonym kontenerem.


      ## Wypróbuj


      Otwórz laboratorium **kubernetes** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy wysoki poziom limit zapewnia programowi planującemu większą dostępność CPU?


      ```bash

      cd ~/lab/examples/resources

      bash run.sh

      kubectl -n lab-resources get pods

      kubectl -n lab-resources describe pod oversized

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Ponadwymiarowy request nie pasuje. Działa ograniczony pod, to Burstable i udostępnia swoje CPU i pamięć limits w plikach cgroup.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Capacidad programable de reserva Requests; limits restringe un contenedor en ejecución. CPU throttling, contenedor OOM y desalojo por presión de nodo son eventos diferentes. Este experimento contrasta un request imposible con un contenedor limitado y en funcionamiento.


      ## Pruébalo


      Abra el **Laboratorio kubernetes** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿Un limit alto le da al programador más CPU disponible?


      ```bash

      cd ~/lab/examples/resources

      bash run.sh

      kubectl -n lab-resources get pods

      kubectl -n lab-resources describe pod oversized

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. El oversized request no encaja. El pod limitado que se ejecuta es Burstable y expone su CPU y la memoria limits en archivos cgroup.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh`, luego `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Requests reservierte planbare Kapazität; limits schränkt einen laufenden Container ein. CPU throttling, Container OOM und Knotendruckräumung sind unterschiedliche Ereignisse. Dieses Experiment stellt eine unmögliche Anfrage einem laufenden, begrenzten Container gegenüber.


      ## Probieren Sie es aus


      Öffnen Sie das **kubernetes Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und prüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Bietet ein hoher limit dem Scheduler mehr verfügbares CPU?


      ```bash

      cd ~/lab/examples/resources

      bash run.sh

      kubectl -n lab-resources get pods

      kubectl -n lab-resources describe pod oversized

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Die Anfrage oversized passt nicht. Der begrenzte pod wird ausgeführt, ist Burstable und stellt seinen CPU und seinen Speicher limits in cgroup-Dateien bereit.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-resources
kubernetes-10:
  profile: kubernetes
  example: networking
  source_hash: e58b732fe2b16594c65731d5e746ab603e11de1bd9b6a9f3698c525e4b317fb0
  content:
    en: 'A Service name resolves to a virtual address. Its selector and ready EndpointSlices determine which pod addresses receive traffic. DNS success alone does not prove that the Service has a usable backend.


      ## Try it


      Open the **kubernetes Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Can the Service exist with zero matching pods?


      ```bash

      cd ~/lab/examples/networking

      bash run.sh

      kubectl -n lab-networking get svc,endpointslice

      kubectl -n lab-networking get pods --show-labels

      bash check.sh

      ```


      > [!question]- Expected result

      > Yes. The wrong selector produces no endpoints. Correcting it makes the same Service route to the ready web pod.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Имя Service разрешается в виртуальный адрес. Selector и готовые EndpointSlice определяют адреса подов для трафика. Успешный DNS сам по себе не доказывает наличие рабочего backend.


      ## Попробуйте


      Откройте лабораторию **kubernetes**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Может ли Service существовать без подходящих подов?


      ```bash

      cd ~/lab/examples/networking

      bash run.sh

      kubectl -n lab-networking get svc,endpointslice

      kubectl -n lab-networking get pods --show-labels

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Да. Неверный selector оставляет Service без endpoints. Исправление направляет тот же Service к готовому web-поду.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Nazwa Service jest przekształcana w adres wirtualny. Jego selector i gotowe EndpointSlice określają, które adresy podów odbierają ruch. Sam sukces DNS nie dowodzi, że Service ma użyteczny backend.


      ## Wypróbuj


      Otwórz laboratorium **kubernetes** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy Service może istnieć z zerowymi pasującymi modułami?


      ```bash

      cd ~/lab/examples/networking

      bash run.sh

      kubectl -n lab-networking get svc,endpointslice

      kubectl -n lab-networking get pods --show-labels

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Tak. Zły selector nie generuje endpoints. Poprawienie tego powoduje tę samą trasę Service do gotowego webpoda.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Un nombre Service se resuelve en una dirección virtual. Su selector y EndpointSlices listos determinan qué direcciones de pod reciben tráfico. El éxito de DNS por sí solo no prueba que el Service tenga un backend utilizable.


      ## Pruébalo


      Abra el laboratorio **kubernetes** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿Puede el Service existir sin ningún pods coincidente?


      ```bash

      cd ~/lab/examples/networking

      bash run.sh

      kubectl -n lab-networking get svc,endpointslice

      kubectl -n lab-networking get pods --show-labels

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > YSí. El selector incorrecto no produce ningún endpoints. Al corregirlo se crea la misma ruta Service al pod web listo.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh`, luego `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Ein Service-Name wird in eine virtuelle Adresse aufgelöst. Sein selector und die fertigen EndpointSlices bestimmen, welche Pod-Adressen Datenverkehr empfangen. Der Erfolg von DNS allein beweist nicht, dass der Service über einen brauchbaren backend verfügt.


      ## Probieren Sie es aus


      Öffnen Sie das **kubernetes Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Kann der Service ohne passenden pods existieren?


      ```bash

      cd ~/lab/examples/networking

      bash run.sh

      kubectl -n lab-networking get svc,endpointslice

      kubectl -n lab-networking get pods --show-labels

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > YJa. Der falsche selector erzeugt keinen endpoints. Durch die Korrektur wird dieselbe Service-Route zum bereitstehenden Web-Pod erstellt.


      ## Beobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann mit `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-networking
kubernetes-11:
  profile: kubernetes
  example: storage
  source_hash: 1938ff29018d0f83a42e75bd09ecfc28834abb56e58b66e76d887794875f6ecb
  content:
    en: 'A claim requests storage; binding selects a volume; mounting makes its bytes available to a container. A pod restart is not the same operation as deleting its PVC. The Lab uses local node storage, so it does not demonstrate cloud disk replication.


      ## Try it


      Open the **kubernetes Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Does replacing the writer pod remove the marker from its PVC?


      ```bash

      cd ~/lab/examples/storage

      bash run.sh

      kubectl -n lab-storage get pvc,pod

      kubectl get storageclass

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The replacement pod reads the marker from the same claim. Deleting the example namespace also deletes the claim; do that only after the observation.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'PVC запрашивает хранилище, binding связывает его с томом, mount открывает байты контейнеру. Перезапуск pod и удаление PVC — разные операции. Стенд использует локальное хранилище узла и не моделирует репликацию облачного диска.


      ## Попробуйте


      Откройте лабораторию **kubernetes**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Замена writer-пода удаляет файл из PVC?


      ```bash

      cd ~/lab/examples/storage

      bash run.sh

      kubectl -n lab-storage get pvc,pod

      kubectl get storageclass

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Новый pod читает файл через тот же PVC. Очистка namespace удаляет и PVC; выполняйте её после наблюдения.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Roszczenie wymaga przechowywania; binding wybiera głośność; montowanie udostępnia jego bajty kontenerowi. Ponowne uruchomienie pod to nie ta sama operacja, co usunięcie PVC. Laboratorium korzysta z pamięci masowej w węźle lokalnym, dlatego nie demonstruje replikacji dysku w chmurze.


      ## Wypróbuj


      Otwórz laboratorium **kubernetes** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy wymiana modułu piszącego pod powoduje usunięcie znacznika z jego PVC?


      ```bash

      cd ~/lab/examples/storage

      bash run.sh

      kubectl -n lab-storage get pvc,pod

      kubectl get storageclass

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Zamiennik pod odczytuje znacznik z tego samego roszczenia. Usunięcie przykładu namespace powoduje również usunięcie roszczenia; zrób to dopiero po obserwacji.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Un reclamo solicita almacenamiento; binding selecciona un volumen; El montaje pone sus bytes a disposición de un contenedor. Un reinicio de pod no es la misma operación que eliminar su PVC. El laboratorio utiliza almacenamiento de nodo local, por lo que no demuestra la replicación de discos en la nube.


      ## Pruébalo


      Abra el laboratorio **kubernetes** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿Reemplazar el escritor pod elimina el marcador de su PVC?


      ```bash

      cd ~/lab/examples/storage

      bash run.sh

      kubectl -n lab-storage get pvc,pod

      kubectl get storageclass

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. El reemplazo pod lee el marcador del mismo reclamo. Al eliminar el ejemplo namespace también se elimina la reclamación; hazlo sólo después de la observación.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh`, luego `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Ein Anspruch verlangt eine Aufbewahrung; binding wählt ein Volume aus; Durch das Mounten werden seine Bytes einem Container zur Verfügung gestellt. Ein pod-Neustart ist nicht derselbe Vorgang wie das Löschen seines PVC. Das Lab verwendet lokalen Knotenspeicher und demonstriert daher keine Cloud-Festplattenreplikation.


      ## Probieren Sie es aus


      Öffnen Sie das **kubernetes Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Entfernt das Ersetzen des Writers pod den Marker von seinem PVC?


      ```bash

      cd ~/lab/examples/storage

      bash run.sh

      kubectl -n lab-storage get pvc,pod

      kubectl get storageclass

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Der Ersatz pod liest den Marker aus demselben Anspruch. Durch das Löschen des Beispiels namespace wird auch der Anspruch gelöscht; Mach das erst nach der Beobachtung.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-storage
kubernetes-12:
  profile: kubernetes
  example: configuration
  source_hash: a3c5d69576d7f0ba30399e12b71aa425cb02e41fd2edadacd1f125e31471d408
  content:
    en: 'Changing a ConfigMap updates the API object. A running process keeps the environment it received at startup. A projected ConfigMap volume can update later; the application must still reread the file.


      ## Try it


      Open the **kubernetes Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Will the process environment and mounted file change at the same instant?


      ```bash

      cd ~/lab/examples/configuration

      bash run.sh

      kubectl -n lab-configuration get configmap settings -o yaml

      kubectl -n lab-configuration get pod reader

      bash check.sh

      ```


      > [!question]- Expected result

      > No. MESSAGE stays first; the mounted file eventually becomes second. The check waits for that specific value with a finite timeout.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Изменение ConfigMap обновляет объект API. Работающий процесс сохраняет окружение, полученное при старте. Файл в проецируемом томе может обновиться позже, но приложение ещё должно его перечитать.


      ## Попробуйте


      Откройте лабораторию **kubernetes**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Окружение процесса и файл в томе изменятся одновременно?


      ```bash

      cd ~/lab/examples/configuration

      bash run.sh

      kubectl -n lab-configuration get configmap settings -o yaml

      kubectl -n lab-configuration get pod reader

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. MESSAGE остаётся first, а файл со временем содержит second. Проверка ждёт конкретного значения с конечным таймаутом.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Zmiana ConfigMap aktualizuje obiekt API. Działający proces zachowuje środowisko, które otrzymał podczas uruchamiania. Przewidywany wolumin ConfigMap można zaktualizować później; aplikacja nadal musi ponownie odczytać plik.


      ## Wypróbuj


      Otwórz laboratorium **kubernetes** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy środowisko procesu i zamontowany plik zmienią się w tym samym momencie?


      ```bash

      cd ~/lab/examples/configuration

      bash run.sh

      kubectl -n lab-configuration get configmap settings -o yaml

      kubectl -n lab-configuration get pod reader

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nr MESSAGE podpórka first; zamontowany plik ostatecznie stanie się second. Kontrola czeka na tę konkretną wartość z ograniczonym limitem czasu.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Cambiar un ConfigMap actualiza el objeto API. Un proceso en ejecución mantiene el entorno que recibió al inicio. Un volumen ConfigMap proyectado se puede actualizar más tarde; la aplicación aún debe volver a leer el archivo.


      ## Pruébalo


      Abra el **kubernetes Lab** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿El entorno del proceso y el archivo montado cambiarán al mismo tiempo?


      ```bash

      cd ~/lab/examples/configuration

      bash run.sh

      kubectl -n lab-configuration get configmap settings -o yaml

      kubectl -n lab-configuration get pod reader

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. MESSAGE permanece primero; el archivo montado finalmente se convierte en second. La verificación espera ese valor específico con un tiempo de espera finito.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh`, luego `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Durch das Ändern eines ConfigMap wird das API-Objekt aktualisiert. Ein laufender Prozess behält die Umgebung, die er beim Start erhalten hat. Ein geplantes ConfigMap-Volume kann später aktualisiert werden; Die Anwendung muss die Datei trotzdem erneut lesen.


      ## Probieren Sie es aus


      Öffnen Sie das **kubernetes Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Werden sich die Prozessumgebung und die bereitgestellte Datei gleichzeitig ändern?


      ```bash

      cd ~/lab/examples/configuration

      bash run.sh

      kubectl -n lab-configuration get configmap settings -o yaml

      kubectl -n lab-configuration get pod reader

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. MESSAGE bleibt an erster Stelle; Die gemountete Datei wird schließlich zu second. Die Prüfung wartet mit einer endlichen Zeitüberschreitung auf diesen bestimmten Wert.


      ## Beobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-configuration
kubernetes-17:
  profile: kubernetes
  example: disruption
  source_hash: d27d6b8dc7300a4f32d12b07b1045b07f10ade85d95df944e0abf45e7f95473c
  content:
    en: 'A PodDisruptionBudget constrains voluntary eviction through the eviction API. It does not create replicas and cannot prevent every failure. Prepare ready spare capacity before draining a node.


      ## Try it


      Open the **kubernetes Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** With two ready replicas and minAvailable=2, can the eviction API remove one?


      ```bash

      cd ~/lab/examples/disruption

      bash run.sh

      kubectl -n lab-disruption get deployment,pdb

      kubectl -n lab-disruption describe pdb web

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The API denies eviction. Changing minAvailable to 1 creates a disruption allowance and the same request succeeds.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'PodDisruptionBudget ограничивает добровольное выселение через eviction API. Он не создаёт реплики и не предотвращает любой отказ. Перед drain нужна готовая запасная ёмкость.


      ## Попробуйте


      Откройте лабораторию **kubernetes**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** При двух готовых репликах и minAvailable=2 eviction API разрешит удалить одну?


      ```bash

      cd ~/lab/examples/disruption

      bash run.sh

      kubectl -n lab-disruption get deployment,pdb

      kubectl -n lab-disruption describe pdb web

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. API отказывает. После изменения minAvailable на 1 появляется разрешённое прерывание, и запрос проходит.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'PodDisruptionBudget ogranicza dobrowolną eksmisję poprzez eviction API. Nie tworzy replik i nie jest w stanie zapobiec każdej awarii. Przygotuj wolną moc obliczeniową przed opróżnieniem węzła.


      ## Wypróbuj


      Otwórz laboratorium **kubernetes** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy eviction API z dwiema gotowymi replikami i minAvailable=2 może usunąć jedną?


      ```bash

      cd ~/lab/examples/disruption

      bash run.sh

      kubectl -n lab-disruption get deployment,pdb

      kubectl -n lab-disruption describe pdb web

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. API zaprzecza eksmisji. Zmiana minAvailable na 1 powoduje utworzenie limitu zakłóceń i to samo żądanie zostaje zrealizowane.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Un PodDisruptionBudget restringe el eviction voluntario a través del eviction API. No crea réplicas y no puede evitar todos los fallos. Prepare la capacidad sobrante lista antes de drenar un nodo.


      ## Pruébalo


      Abra el **kubernetes Lab** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** Con dos réplicas listas y minAvailable=2, ¿puede el eviction API eliminar una?


      ```bash

      cd ~/lab/examples/disruption

      bash run.sh

      kubectl -n lab-disruption get deployment,pdb

      kubectl -n lab-disruption describe pdb web

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. El API desmiente eviction. Cambiar minAvailable a 1 crea una asignación de interrupción y la misma solicitud se realiza correctamente.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh` y luego con `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Ein PodDisruptionBudget schränkt den freiwilligen eviction durch den eviction API ein. Es erstellt keine Replikate und kann nicht jeden Fehler verhindern. Bereiten Sie freie Kapazität vor, bevor Sie einen Knoten entleeren.


      ## Probieren Sie es aus


      Öffnen Sie das **kubernetes Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und prüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Kann der eviction API mit zwei fertigen Replikaten und minAvailable=2 eines entfernen?


      ```bash

      cd ~/lab/examples/disruption

      bash run.sh

      kubectl -n lab-disruption get deployment,pdb

      kubectl -n lab-disruption describe pdb web

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Der API verweigert eviction. Durch Ändern von minAvailable auf 1 wird eine Unterbrechungszulage erstellt und dieselbe Anforderung ist erfolgreich.


      ## Beobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann mit `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-disruption
kubernetes-20:
  profile: kubernetes
  example: troubleshooting
  source_hash: a9911b0d30fcb13a83c52c4c520c00aa95768bb144d28fba43f444341043508c
  content:
    en: 'Start with the symptom and find the failing layer: admission, scheduling, image preparation, process or traffic. Read status, events and the relevant container logs before editing the workload.


      ## Try it


      Open the **kubernetes Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Do CrashLoopBackOff and an unavailable image need the same repair?


      ```bash

      cd ~/lab/examples/troubleshooting

      bash run.sh

      kubectl -n lab-troubleshooting get pods

      kubectl -n lab-troubleshooting describe pod missing

      bash check.sh

      ```


      > [!question]- Expected result

      > No. One container ran and exited with code 3; the other never started because its image is absent. Previous logs explain only the first failure.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Начните с симптома и найдите слой отказа: допуск, размещение, подготовка образа, процесс или трафик. Перед изменением нагрузки прочитайте status, events и логи нужного контейнера.


      ## Попробуйте


      Откройте лабораторию **kubernetes**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** CrashLoopBackOff и недоступный образ требуют одного исправления?


      ```bash

      cd ~/lab/examples/troubleshooting

      bash run.sh

      kubectl -n lab-troubleshooting get pods

      kubectl -n lab-troubleshooting describe pod missing

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Один контейнер запустился и вышел с кодом 3, второй не стартовал из-за отсутствующего образа. Previous logs объясняют только первый отказ.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Zacznij od symptomu i znajdź wadliwą warstwę: przyjęcie, planowanie, przygotowanie obrazu, proces lub ruch. Przed edycją obciążenia przeczytaj status, events i odpowiednie dzienniki kontenerów.


      ## Wypróbuj


      Otwórz laboratorium **kubernetes** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy CrashLoopBackOff i niedostępny obraz wymagają tej samej naprawy?


      ```bash

      cd ~/lab/examples/troubleshooting

      bash run.sh

      kubectl -n lab-troubleshooting get pods

      kubectl -n lab-troubleshooting describe pod missing

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Jeden kontener odjechał i opuścił go z kodem 3; drugi nigdy się nie zaczął, ponieważ nie ma jego obrazu. Previous logs wyjaśnia tylko pierwszą awarię.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Comience con el síntoma y encuentre la capa que falla: admisión, programación, preparación de imágenes, proceso o tráfico. Lea status, events y el contenedor correspondiente logs antes de editar la carga de trabajo.


      ## Pruébalo


      Abra el **kubernetes Lab** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿CrashLoopBackOff y una imagen no disponible necesitan la misma reparación?


      ```bash

      cd ~/lab/examples/troubleshooting

      bash run.sh

      kubectl -n lab-troubleshooting get pods

      kubectl -n lab-troubleshooting describe pod missing

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. Un contenedor funcionó y salió con el código 3; el otro nunca empezó porque su imagen está ausente. Previous logs explica sólo el primer fallo.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh`, luego `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Beginnen Sie mit dem Symptom und finden Sie die fehlerhafte Ebene: Zulassung, Planung, Bildvorbereitung, Prozess oder Verkehr. Lesen Sie status, events und den entsprechenden Container logs, bevor Sie die Arbeitslast bearbeiten.


      ## Probieren Sie es aus


      Öffnen Sie das **kubernetes Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und prüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Benötigen CrashLoopBackOff und ein nicht verfügbares Image dieselbe Reparatur?


      ```bash

      cd ~/lab/examples/troubleshooting

      bash run.sh

      kubectl -n lab-troubleshooting get pods

      kubectl -n lab-troubleshooting describe pod missing

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Ein Container wurde ausgeführt und mit Code 3 beendet. der andere hat nie begonnen, weil sein Bild fehlt. Previous logs erklären nur den ersten Fehler.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann mit `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-troubleshooting
ansible-2:
  profile: ansible
  example: inventory
  source_hash: e6be08a790cfdd7058976dbab2b1752e740a6cc1f6ae6f1f4d53b1927384f53b
  content:
    en: 'Inventory names identify managed hosts; connection variables tell Ansible how to reach them. A group selects a set, and --limit narrows that set. The controller and SSH targets are separate processes.


      ## Try it


      Open the **ansible Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Does --limit app2 run the play on all three fleet hosts?


      ```bash

      cd ~/lab/examples/inventory

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Expected result

      > No. Only app2 appears in the second recap.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Имена inventory обозначают управляемые узлы, переменные подключения задают способ доступа. Группа выбирает набор, --limit его сужает. Контроллер и SSH-хосты — отдельные процессы.


      ## Попробуйте


      Откройте лабораторию **ansible**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Запустит ли --limit app2 play на всех трёх узлах fleet?


      ```bash

      cd ~/lab/examples/inventory

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Во втором recap остаётся только app2.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Nazwy zapasów identyfikują zarządzane hosty; zmienne połączenia mówią Ansible, jak się do nich dostać. Grupa wybiera zestaw, a --limit zawęża ten zestaw. Kontroler i elementy docelowe SSH to oddzielne procesy.


      ## Wypróbuj


      Otwórz laboratorium **ansible** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy --limit app2 uruchamia grę na wszystkich trzech hostach fleet?


      ```bash

      cd ~/lab/examples/inventory

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. W drugim recap pojawia się tylko app2.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Los nombres de los inventarios identifican los hosts administrados; Las variables de conexión le indican a Ansible cómo llegar a ellas. Un grupo selecciona un conjunto y --limit limita ese conjunto. El controlador y los objetivos SSH son procesos separados.


      ## Pruébalo


      Abra el laboratorio **ansible** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿--limit app2 ejecuta play en los tres hosts fleet?


      ```bash

      cd ~/lab/examples/inventory

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. En el segundo recap solo aparece app2.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh`, luego `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Inventarnamen identifizieren verwaltete Hosts; Verbindungsvariablen teilen Ansible mit, wie sie zu erreichen sind. Eine Gruppe wählt einen Satz aus und --limit schränkt diesen Satz ein. Der Controller und die SSH-Ziele sind separate Prozesse.


      ## Probieren Sie es aus


      Öffnen Sie das **ansible Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und prüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Führt --limit app2 den play auf allen drei fleet-Hosts aus?


      ```bash

      cd ~/lab/examples/inventory

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Im zweiten recap erscheint nur app2.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-inventory
  additional:
    en: AWS inventory is an additional practicum. This Lab verifies local inventory and SSH targets; no AWS account is connected.
    ru: AWS inventory — дополнительный практикум. Этот Lab проверяет локальный inventory и SSH-хосты; AWS не подключён.
    pl: Inventory AWS to dodatkowe ćwiczenie praktyczne. To laboratorium weryfikuje lokalne inventory i hosty docelowe SSH; żadne konto AWS nie jest podłączone.
    es: AWS inventory es una práctica adicional. Este Lab verifica los objetivos locales inventory y SSH; no hay ninguna cuenta AWS conectada.
    de: AWS inventory ist ein Zusatzpraktikum. Dieser Lab überprüft lokale inventory- und SSH-Ziele; Es ist kein AWS-Konto verbunden.
ansible-4:
  profile: ansible
  example: idempotency
  source_hash: ec5da4b6414124b3fccf6157e76d18594d44af5282eecdac4e76f7141c361f70
  content:
    en: 'An idempotent task converges on a declared state. Running it twice should leave the second recap unchanged. changed_when only controls reporting; it does not undo a command’s side effects.


      ## Try it


      Open the **ansible Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Will copying identical content count as another change?


      ```bash

      cd ~/lab/examples/idempotency

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The second run and check mode report changed=0.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Идемпотентная задача приводит систему к заданному состоянию. Повторный запуск должен показать отсутствие изменений. changed_when управляет отчётом, но не отменяет побочные эффекты команды.


      ## Попробуйте


      Откройте лабораторию **ansible**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Копирование идентичного содержимого снова будет изменением?


      ```bash

      cd ~/lab/examples/idempotency

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Повторный запуск и check mode показывают changed=0.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Zadanie idempotentne zbiega się z zadeklarowanym stanem. Uruchomienie go dwukrotnie powinno pozostawić drugie podsumowanie bez zmian. changed_when kontroluje tylko raportowanie; nie cofa skutków ubocznych polecenia.


      ## Wypróbuj


      Otwórz laboratorium **ansible** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy kopiowanie identycznej treści będzie się liczyło jako kolejna zmiana?


      ```bash

      cd ~/lab/examples/idempotency

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Drugi przebieg i raport check mode changed=0.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Una tarea idempotente converge en un estado declarado. Ejecutarlo dos veces debería dejar el segundo resumen sin cambios. changed_when solo controla los informes; no deshace los efectos secundarios de un comando.


      ## Pruébalo


      Abra el laboratorio **ansible** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿Copiar contenido idéntico contará como otro cambio?


      ```bash

      cd ~/lab/examples/idempotency

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. El segundo informe del modo de ejecución y verificación changed=0.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh`, luego `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Eine idempotente Aufgabe konvergiert in einem deklarierten Zustand. Wenn Sie es zweimal ausführen, sollte die zweite Zusammenfassung unverändert bleiben. changed_when steuert nur die Berichterstellung; Die Nebenwirkungen eines Befehls werden dadurch nicht rückgängig gemacht.


      ## Probieren Sie es aus


      Öffnen Sie das **ansible Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und prüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Zählt das Kopieren identischer Inhalte als weitere Änderung?


      ```bash

      cd ~/lab/examples/idempotency

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Der zweite Lauf und Prüfmodusbericht changed=0.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann mit `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-idempotency
ansible-5:
  profile: ansible
  example: variables
  source_hash: ff8215aa5947cd3294e5f186ffd0113767dbbfca7e662c0a7b525b9d880802af
  content:
    en: 'Variables come from several sources. Explicit extra variables override the play value in this experiment. Evaluate a concrete variable and its source rather than memorizing an unexplained precedence number.


      ## Try it


      Open the **ansible Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Will message remain play-default after passing -e message=cli?


      ```bash

      cd ~/lab/examples/variables

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The assertion confirms the explicit cli value.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Переменные поступают из нескольких источников. В этом опыте extra vars перекрывают значение из play. Разбирайте конкретное значение и его источник, а не номер в таблице приоритетов.


      ## Попробуйте


      Откройте лабораторию **ansible**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Останется ли message равным play-default после -e message=cli?


      ```bash

      cd ~/lab/examples/variables

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Assert подтверждает явно переданное значение cli.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Zmienne pochodzą z kilku źródeł. W tym eksperymencie jawne dodatkowe zmienne zastępują wartość play. Zamiast zapamiętywać niewyjaśniony numer pierwszeństwa, oceniaj konkretną zmienną i jej źródło.


      ## Wypróbuj


      Otwórz laboratorium **ansible** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy message pozostanie play-default po przejściu -e message=cli?


      ```bash

      cd ~/lab/examples/variables

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Asercja potwierdza jawną wartość cli.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Las variables provienen de varias fuentes. Las variables explícitas extra anulan el valor play en este experimento. Evalúe una variable concreta y su origen en lugar de memorizar un número de precedencia inexplicable.


      ## Pruébalo


      Abra el laboratorio **ansible** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿message seguirá siendo play-default después de pasar -e message=cli?


      ```bash

      cd ~/lab/examples/variables

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. La afirmación confirma el valor explícito de cli.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh` y luego con `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Variablen stammen aus mehreren Quellen. Explizite extra-Variablen überschreiben in diesem Experiment den play-Wert. Bewerten Sie eine konkrete Variable und ihre Quelle, anstatt sich eine ungeklärte Prioritätsnummer zu merken.


      ## Probieren Sie es aus


      Öffnen Sie das **ansible Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Bleibt message play-default, nachdem -e message=cli passiert ist?


      ```bash

      cd ~/lab/examples/variables

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Die Behauptung bestätigt den expliziten cli-Wert.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das vollständige Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-variables
ansible-7:
  profile: ansible
  example: templates
  source_hash: b547fb3be6d0da5abc31845c0d662c0f7b46f9753209498724c363e1982e44c6
  content:
    en: 'A Jinja template renders configuration from data before the template module compares the result with the destination. Changing a variable can change the rendered file; rendering the same values again should converge.


      ## Try it


      Open the **ansible Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Does an unchanged template file mean an unchanged result after a variable override?


      ```bash

      cd ~/lab/examples/templates

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Expected result

      > No. Overriding listen_port changes the rendered port to 9090.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Jinja строит конфигурацию из данных, затем template сравнивает результат с файлом назначения. Новая переменная может изменить файл; повтор тех же значений должен сходиться без изменений.


      ## Попробуйте


      Откройте лабораторию **ansible**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Неизменный файл шаблона гарантирует тот же результат после изменения переменной?


      ```bash

      cd ~/lab/examples/templates

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Новое listen_port меняет порт в результате на 9090.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Jinja template renderuje konfigurację na podstawie danych, zanim moduł template porówna wynik z miejscem docelowym. Zmiana zmiennej może zmienić renderowany plik; ponowne renderowanie tych samych wartości powinno być zbieżne.


      ## Wypróbuj


      Otwórz laboratorium **ansible** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy niezmieniony plik template oznacza niezmieniony wynik po zastąpieniu zmiennej?


      ```bash

      cd ~/lab/examples/templates

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Zastąpienie listen_port zmienia renderowany port na 9090.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Un Jinja template representa la configuración a partir de los datos antes de que el módulo template compare el resultado con el destino. Cambiar una variable puede cambiar el archivo renderizado; renderizar los mismos valores nuevamente debería converger.


      ## Pruébalo


      Abra el **ansible Lab** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿Un archivo template sin cambios significa un resultado sin cambios después de una anulación de variable?


      ```bash

      cd ~/lab/examples/templates

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. Anular listen_port cambia el puerto renderizado a 9090.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh` y luego con `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'A Jinja template rendert die Konfiguration aus Daten, bevor das template-Modul das Ergebnis mit dem Ziel vergleicht. Durch das Ändern einer Variablen kann sich die gerenderte Datei ändern. Das erneute Rendern derselben Werte sollte konvergieren.


      ## Probieren Sie es aus


      Öffnen Sie das **ansible Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Bedeutet eine unveränderte template-Datei ein unverändertes Ergebnis nach einer Variablenüberschreibung?


      ```bash

      cd ~/lab/examples/templates

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Durch das Überschreiben von listen_port wird der gerenderte Port auf 9090 geändert.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann mit `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-templates
ansible-9:
  profile: ansible
  example: failures
  source_hash: 57814bba504547b48d8ae92cef943b835b1dc4050246886a78d050e73b70d430
  content:
    en: 'A failed task interrupts the normal path. A rescue block can recover from a task failure, while always runs cleanup or observation. Unreachable hosts and syntax errors need separate handling.


      ## Try it


      Open the **ansible Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Does a rescued failure necessarily make the whole playbook return failure?


      ```bash

      cd ~/lab/examples/failures

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The rescued play succeeds with rescued=1; the unhandled example returns failure.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Сбой задачи прерывает обычный путь. Rescue может обработать ошибку задачи, always выполняет завершающие действия или наблюдение. Недоступный хост и ошибка синтаксиса требуют отдельного разбора.


      ## Попробуйте


      Откройте лабораторию **ansible**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Обработанная rescue ошибка обязательно завершает весь playbook с ошибкой?


      ```bash

      cd ~/lab/examples/failures

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Обработанный пример успешен с rescued=1, необработанный возвращает ошибку.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Nieudane zadanie przerywa normalną ścieżkę. Blok rescue może odzyskać siły po awarii zadania, podczas gdy always uruchamia czyszczenie lub obserwację. Nieosiągalne hosty i błędy składniowe wymagają osobnej obsługi.


      ## Wypróbuj


      Otwórz laboratorium **ansible** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy uratowana awaria koniecznie powoduje powrót całego playbook?


      ```bash

      cd ~/lab/examples/failures

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Uratowana gra powiodła się dzięki rescued=1; nieobsługiwany przykład zwraca błąd.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Una tarea fallida interrumpe el camino normal. Un bloque rescue puede recuperarse de una falla en la tarea, mientras siempre ejecuta la limpieza u observación. Los hosts inalcanzables y los errores de sintaxis deben tratarse por separado.


      ## Pruébalo


      Abra el **ansible Lab** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿Una falla rescatada necesariamente hace que todo el playbook regrese como falla?


      ```bash

      cd ~/lab/examples/failures

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. La jugada rescatada triunfa con rescued=1; el ejemplo no controlado devuelve un error.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh` y luego con `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Eine fehlgeschlagene Aufgabe unterbricht den normalen Pfad. Ein rescue-Block kann sich nach einem Task-Fehler erholen, während er immer eine Bereinigung oder Beobachtung ausführt. Nicht erreichbare Hosts und Syntaxfehler müssen separat behandelt werden.


      ## Probieren Sie es aus


      Öffnen Sie das **ansible Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Führt ein behobener Fehler zwangsläufig dazu, dass der gesamte playbook einen Fehler zurückgibt?


      ```bash

      cd ~/lab/examples/failures

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Das gerettete Spiel gelingt mit rescued=1; Das nicht behandelte Beispiel gibt einen Fehler zurück.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann mit `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-failures
ansible-10:
  profile: ansible
  example: handlers
  source_hash: e38cbb8510e4385aca03ce5459ce5e199a92ebe5fe3ffc8623ba5e6e888c2e12
  content:
    en: 'Changed tasks notify handlers. Two notifications to the same handler are coalesced before it runs. A second converged run has no change to notify. A later task failure may prevent an already notified handler from running.


      ## Try it


      Open the **ansible Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Will two changed tasks run the same handler twice?


      ```bash

      cd ~/lab/examples/handlers

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The first run executes it once, and the converged second run does not execute it.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Изменившие состояние задачи уведомляют handlers. Два уведомления одного обработчика объединяются до его запуска. При повторном запуске без изменений нет нового уведомления. Последующая ошибка задачи может помешать уже уведомлённому обработчику.


      ## Попробуйте


      Откройте лабораторию **ansible**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Две изменившие состояние задачи запустят один handler дважды?


      ```bash

      cd ~/lab/examples/handlers

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Первый запуск выполняет его один раз, повторный без изменений не выполняет.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Zmienione zadania powiadamiają handlers. Dwa powiadomienia do tego samego handler są łączone przed jego uruchomieniem. Drugi przebieg zbieżny nie powoduje żadnych zmian do powiadomienia. Późniejsza awaria zadania może uniemożliwić uruchomienie już zgłoszonego handler.


      ## Wypróbuj


      Otwórz laboratorium **ansible** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy dwa zmienione zadania uruchomią dwukrotnie ten sam handler?


      ```bash

      cd ~/lab/examples/handlers

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Pierwszy przebieg wykonuje to raz, a drugi zbieżny przebieg nie wykonuje go.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Las tareas modificadas notifican a handlers. Se fusionan dos notificaciones al mismo handler antes de que se ejecute. Una segunda ejecución convergente no tiene cambios que notificar. Un error de tarea posterior puede impedir que se ejecute un handler ya notificado.


      ## Pruébalo


      Abra el laboratorio **ansible** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿Dos tareas modificadas ejecutarán el mismo handler dos veces?


      ```bash

      cd ~/lab/examples/handlers

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. La primera ejecución lo ejecuta una vez y la segunda ejecución convergente no lo ejecuta.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh`, luego `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Geänderte Aufgaben benachrichtigen handlers. Zwei Benachrichtigungen an denselben handler werden vor der Ausführung zusammengeführt. Bei einem zweiten konvergenten Lauf ist keine Änderung zu benachrichtigen. Ein späterer Aufgabenfehler kann die Ausführung eines bereits benachrichtigten handler verhindern.


      ## Probieren Sie es aus


      Öffnen Sie das **ansible Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Werden zwei geänderte Aufgaben denselben handler zweimal ausführen?


      ```bash

      cd ~/lab/examples/handlers

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Der erste Lauf führt es einmal aus, und der konvergierte zweite Lauf führt es nicht aus.


      ## Beobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-handlers
ansible-11:
  profile: ansible
  example: rolling
  source_hash: 9c4fbf37a0b5543ea862a8a4a4d678cf98c5d4379d2276616d6370f3277a8ced
  content:
    en: 'serial limits the hosts processed in each batch. Error policy decides whether later batches continue. Delegation changes where a task executes; it does not automatically change which inventory host owns its result. Kernel upgrades and VM reboots are an additional VM practicum, outside these SSH containers.


      ## Try it


      Open the **ansible Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** With serial=1 and a fatal failure on app2, will app3 begin?


      ```bash

      cd ~/lab/examples/rolling

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The failed second batch stops the sequence before app3.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Serial ограничивает размер партии. Политика ошибок определяет переход к следующей партии. Делегирование меняет место исполнения, но не обязательно владельца результата в inventory. Обновление ядра и reboot ВМ — дополнительный практикум в VM, за пределами этих SSH-контейнеров.


      ## Попробуйте


      Откройте лабораторию **ansible**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** При serial=1 и фатальной ошибке app2 начнётся ли партия app3?


      ```bash

      cd ~/lab/examples/rolling

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Вторая партия останавливает последовательность до app3.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'serial ogranicza hosty przetwarzane w każdej partii. Polityka błędów decyduje, czy późniejsze partie będą kontynuowane. Delegowanie zmienia miejsce wykonywania zadania; nie zmienia to automatycznie tego, który host inventory jest właścicielem jego wyniku. Aktualizacje jądra i ponowne uruchamianie VM to dodatkowa praktyka VM, poza tymi kontenerami SSH.


      ## Wypróbuj


      Otwórz laboratorium **ansible** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy w przypadku serial=1 i krytycznej awarii app2 rozpocznie się app3?


      ```bash

      cd ~/lab/examples/rolling

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Niepowodzenie drugiej partii zatrzymuje sekwencję przed app3.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'serial limita los hosts procesados ​​en cada lote. La política de errores decide si continúan los lotes posteriores. La delegación cambia donde se ejecuta una tarea; no cambia automáticamente qué host inventory posee su resultado. Las actualizaciones del kernel y los reinicios de VM son una práctica adicional de VM, fuera de estos contenedores SSH.


      ## Pruébalo


      Abra el laboratorio **ansible** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara únicamente este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** Con serial=1 y una falla fatal en app2, ¿comenzará app3?


      ```bash

      cd ~/lab/examples/rolling

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. El segundo lote fallido detiene la secuencia anterior a app3.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh` y luego con `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Serial begrenzt die Hosts, die in jedem Stapel verarbeitet werden. Die Fehlerrichtlinie entscheidet, ob spätere Stapel fortgesetzt werden. Die Delegation ändert den Ort, an dem eine Aufgabe ausgeführt wird. Es ändert sich nicht automatisch, welcher inventory-Host sein Ergebnis besitzt. Kernel-Upgrades und VM-Neustarts sind ein zusätzliches VM-Praktikum außerhalb dieser SSH-Container.


      ## Probieren Sie es aus


      Öffnen Sie das **ansible Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Wird app3 mit serial=1 und einem schwerwiegenden Fehler auf app2 beginnen?


      ```bash

      cd ~/lab/examples/rolling

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Der fehlgeschlagene zweite Stapel stoppt die Sequenz vor app3.


      ## Beobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-rolling
  additional:
    en: Kernel upgrades and VM reboots need a separate VM practicum. The Lab exercises rolling batches on disposable SSH targets.
    ru: Обновление ядра и перезагрузка VM требуют отдельного практикума с VM. В Lab проверяются последовательные партии на учебных SSH-хостах.
    pl: Aktualizacje jądra i ponowne uruchamianie VM wymagają oddzielnych ćwiczeń z VM. Laboratorium ćwiczy stopniowe wdrażanie partiami na jednorazowych hostach docelowych SSH.
    es: Las actualizaciones del kernel y los reinicios de VM necesitan una práctica separada sobre VM. El Lab practica lotes rodantes en objetivos desechables SSH.
    de: Für Kernel-Upgrades und VM-Neustarts ist ein separates VM-Praktikum erforderlich. Der Lab übt rollende Chargen auf Einwegzielen des Typs SSH aus.
ansible-12:
  profile: ansible
  example: reuse
  source_hash: 5dc1183c50accfee638e7569de9289a7b34420b9afe7c8191628a134afa958d3
  content:
    en: 'Static imports expand tasks earlier; dynamic includes choose tasks during execution. Tags on an include select the include statement, so untagged children can still be skipped. Roles package tasks with defaults, handlers and templates under a shared contract.


      ## Try it


      Open the **ansible Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Does --tags dynamic necessarily run every task inside a tagged include?


      ```bash

      cd ~/lab/examples/reuse

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The include runs, but its untagged child does not. The static import inherits its tag.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Статический import раскрывает задачи заранее, динамический include выбирает их при исполнении. Метка include выбирает само включение, поэтому дочерние задачи без метки могут быть пропущены. Роль объединяет задачи, defaults, handlers и шаблоны с общим контрактом.


      ## Попробуйте


      Откройте лабораторию **ansible**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Обязательно ли --tags dynamic выполняет все задачи внутри include с этой меткой?


      ```bash

      cd ~/lab/examples/reuse

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Include выполняется, его дочерняя задача без метки — нет. Статический import наследует метку.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Importy statyczne rozszerzają zadania wcześniej; dynamiczny obejmuje wybór zadań podczas wykonywania. Tagi w include wybierają instrukcję include, więc nieoznaczone elementy podrzędne nadal można pomijać. Role pakują zadania za pomocą defaults, handlers i szablonów w ramach umowy współdzielonej.


      ## Wypróbuj


      Otwórz laboratorium **ansible** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy --tags dynamic koniecznie uruchamia każde zadanie w oznaczonym include?


      ```bash

      cd ~/lab/examples/reuse

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. include działa, ale jego nieoznaczone dziecko nie. Statyczny import dziedziczy swój znacznik.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Las importaciones estáticas amplían las tareas antes; dynamic incluye tareas de elección durante la ejecución. Las etiquetas en un include seleccionan la instrucción include, por lo que aún se pueden omitir los niños sin etiquetar. Tareas de paquete de roles con defaults, handlers y plantillas bajo contrato compartido.


      ## Pruébalo


      Abra el **ansible Lab** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿--tags dynamic ejecuta necesariamente todas las tareas dentro de un include etiquetado?


      ```bash

      cd ~/lab/examples/reuse

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. El include se ejecuta, pero su hijo sin etiquetar no. El estático import hereda su etiqueta.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh` y luego con `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Statische Importe erweitern Aufgaben früher; dynamic umfasst ausgewählte Aufgaben während der Ausführung. Tags auf einem include wählen die include-Anweisung aus, sodass untergeordnete Elemente ohne Tags weiterhin übersprungen werden können. Rollen bündeln Aufgaben mit defaults, handlers und Vorlagen im Rahmen eines gemeinsamen Vertrags.


      ## Probieren Sie es aus


      Öffnen Sie das **ansible Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und prüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Führt --tags dynamic unbedingt jede Aufgabe innerhalb eines getaggten include aus?


      ```bash

      cd ~/lab/examples/reuse

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Der include wird ausgeführt, sein nicht getaggtes untergeordnetes Element jedoch nicht. Der statische import erbt seinen Tag.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-reuse
ansible-13:
  profile: ansible
  example: vault
  source_hash: 1a48913e6ba1ebb00536e883f268e95e207ff3d424ea2513f9bbd2d88c543f71
  content:
    en: 'Ansible Vault encrypts data at rest. The controller needs a decryption secret at execution time, and no_log prevents that task’s output from disclosing values. This Lab uses a deliberately disposable demonstration password.


      ## Try it


      Open the **ansible Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Can an encrypted vars file run without a decryption secret?


      ```bash

      cd ~/lab/examples/vault

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The no-key run fails; the keyed run succeeds without printing the demonstration secret.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Ansible Vault шифрует данные при хранении. Контроллеру нужен ключ при исполнении, no_log скрывает вывод задачи с секретом. В стенде используется заведомо одноразовый демонстрационный пароль.


      ## Попробуйте


      Откройте лабораторию **ansible**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Можно ли выполнить зашифрованный vars-файл без ключа расшифровки?


      ```bash

      cd ~/lab/examples/vault

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Без ключа запуск ошибочен; с ключом он успешен без печати демонстрационного секрета.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Ansible Vault szyfruje dane w stanie spoczynku. Kontroler potrzebuje sekretu deszyfrowania w czasie wykonywania, a no_log zapobiega ujawnieniu wartości na wyjściu tego zadania. W tym laboratorium celowo używa się jednorazowego hasła demonstracyjnego.


      ## Wypróbuj


      Otwórz laboratorium **ansible** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy zaszyfrowany plik vars może działać bez sekretu deszyfrowania?


      ```bash

      cd ~/lab/examples/vault

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Uruchomienie bez klucza kończy się niepowodzeniem; uruchomienie z kluczem zakończyło się pomyślnie bez drukowania tajnego klucza demonstracyjnego.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Ansible Vault cifra los datos en reposo. El controlador necesita un secreto de descifrado en el momento de la ejecución, y no_log evita que la salida de esa tarea revele valores. Este laboratorio utiliza una contraseña de demostración deliberadamente desechable.


      ## Pruébalo


      Abra el **Laboratorio ansible** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿Se puede ejecutar un archivo vars cifrado sin un secreto de descifrado?


      ```bash

      cd ~/lab/examples/vault

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. La ejecución sin clave falla; la ejecución con clave se realiza correctamente sin imprimir el secreto de demostración.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh`, luego `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Ansible Vault verschlüsselt ruhende Daten. Der Controller benötigt zur Ausführungszeit ein Entschlüsselungsgeheimnis, und no_log verhindert, dass die Ausgabe dieser Aufgabe Werte preisgibt. In diesem Labor wird bewusst ein Wegwerf-Demonstrationspasswort verwendet.


      ## Probieren Sie es aus


      Öffnen Sie das **ansible Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Kann eine verschlüsselte Vars-Datei ohne ein Entschlüsselungsgeheimnis ausgeführt werden?


      ```bash

      cd ~/lab/examples/vault

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Der No-Key-Lauf schlägt fehl; Der Schlüssellauf ist erfolgreich, ohne dass das Demonstrationsgeheimnis gedruckt werden muss.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-vault
  additional:
    en: AWS secret lookup is an additional practicum. Ansible Vault encryption and local secret handling run here.
    ru: Чтение секретов AWS — дополнительный практикум. Шифрование Ansible Vault и локальная работа с секретами доступны здесь.
    pl: Odczyt sekretów AWS to dodatkowe ćwiczenie praktyczne. Dostępne są tutaj szyfrowanie Ansible Vault i lokalna obsługa sekretów.
    es: La búsqueda secreta AWS es una práctica adicional. Aquí se ejecuta el cifrado Ansible Vault y el manejo de secretos locales.
    de: Die geheime Suche nach AWS ist ein zusätzliches Praktikum. Hier laufen Ansible Vault Verschlüsselung und lokaler Secret-Handling.
ansible:
  profile: ansible
  example: diagnosis
  source_hash: d81a75f3a11c6621eb1b6f8c740ba2c616d91fe2d30451e4e11f19b5318756eb
  content:
    en: 'Find the phase of failure before editing: parsing, host selection, connection, variable evaluation or module execution. A successful syntax check does not prove that runtime variables exist or assertions will pass.


      ## Try it


      Open the **ansible Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Does --syntax-check catch an undefined variable used only when a task runs?


      ```bash

      cd ~/lab/examples/diagnosis

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Expected result

      > No. Syntax succeeds, task evaluation fails, and the explicit variable fixes that failure.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Перед правкой найдите фазу: разбор файла, выбор хоста, подключение, вычисление переменной или исполнение модуля. Успешный syntax-check не доказывает наличие переменных и истинность assert.


      ## Попробуйте


      Откройте лабораторию **ansible**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Всегда ли --syntax-check ловит неопределённую переменную, вычисляемую при запуске задачи?


      ```bash

      cd ~/lab/examples/diagnosis

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Синтаксис проходит, вычисление задачи ошибочно; явно переданная переменная исправляет этот отказ.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Znajdź fazę awarii przed edycją: parsowanie, wybór hosta, połączenie, ocena zmiennej lub wykonanie modułu. Pomyślne sprawdzenie składni nie dowodzi, że istnieją zmienne wykonawcze ani że asercje zostaną zaliczone.


      ## Wypróbuj


      Otwórz laboratorium **ansible** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy --syntax-check przechwytuje niezdefiniowaną zmienną używaną tylko podczas wykonywania zadania?


      ```bash

      cd ~/lab/examples/diagnosis

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Składnia się powiodła, ocena zadania nie, a zmienna jawna naprawia ten błąd.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Encuentre la fase de falla antes de editar: análisis, selección de host, conexión, evaluación de variables o ejecución del módulo. Una verificación de sintaxis exitosa no prueba que existan variables de tiempo de ejecución o que se aprobarán las afirmaciones.


      ## Pruébalo


      Abra el **ansible Lab** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿--syntax-check detecta una variable no definida que se usa solo cuando se ejecuta una tarea?


      ```bash

      cd ~/lab/examples/diagnosis

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. La sintaxis tiene éxito, la evaluación de la tarea falla y la variable explícita soluciona ese error.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh` y luego con `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Suchen Sie vor der Bearbeitung nach der Fehlerphase: Analyse, Hostauswahl, Verbindung, Variablenauswertung oder Modulausführung. Eine erfolgreiche Syntaxprüfung beweist nicht, dass Laufzeitvariablen vorhanden sind oder Behauptungen erfolgreich sind.


      ## Probieren Sie es aus


      Öffnen Sie das **ansible Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Fängt --syntax-check eine undefinierte Variable ab, die nur verwendet wird, wenn eine Aufgabe ausgeführt wird?


      ```bash

      cd ~/lab/examples/diagnosis

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Die Syntax ist erfolgreich, die Aufgabenauswertung schlägt fehl und die explizite Variable behebt diesen Fehler.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-diagnosis
terraform-2:
  profile: opentofu
  example: hcl
  source_hash: e1c071f9ad5ae6b9cb18db98c51557d9bfdddac00536afba4b30935dc56aedf9
  content:
    en: 'HCL describes inputs, expressions and managed objects. This local example filters disabled services before for_each creates instances. A validation rule rejects a known invalid input before it becomes a resource change.


      ## Try it


      Open the **opentofu Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** How many instances will a map with one enabled and one disabled service create?


      ```bash

      cd ~/lab/examples/hcl

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Expected result

      > One: api. The output is dev/api; environment=production fails validation.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'HCL описывает входы, выражения и управляемые объекты. Локальный пример фильтрует выключенные сервисы до создания экземпляров через for_each. Validation отвергает известное неверное значение до изменения ресурса.


      ## Попробуйте


      Откройте лабораторию **opentofu**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Сколько экземпляров создаст map с одним включённым и одним выключенным сервисом?


      ```bash

      cd ~/lab/examples/hcl

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Один: api. Output содержит dev/api; environment=production не проходит validation.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'HCL opisuje dane wejściowe, wyrażenia i zarządzane obiekty. Ten lokalny przykład filtruje wyłączone usługi, zanim for_each utworzy instancje. Reguła validation odrzuca znane nieprawidłowe dane wejściowe, zanim staną się one zmianą zasobu.


      ## Wypróbuj


      Otwórz laboratorium **opentofu** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Prognozuj przed uruchomieniem:** Ile instancji utworzy map z jedną włączoną i jedną wyłączoną usługą?


      ```bash

      cd ~/lab/examples/hcl

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Jeden: interfejs API. Dane wyjściowe to dev/api; environment=production kończy się niepowodzeniem validation.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'HCL describe entradas, expresiones y objetos administrados. Este ejemplo local filtra servicios deshabilitados antes de que for_each cree instancias. Una regla validation rechaza una entrada no válida conocida antes de que se convierta en un cambio de recurso.


      ## Pruébalo


      Abra el laboratorio **opentofu** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿Cuántas instancias creará un map con un servicio habilitado y otro deshabilitado?


      ```bash

      cd ~/lab/examples/hcl

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > Uno: api. La salida es dev/api; environment=production falla validation.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh` y luego con `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'HCL beschreibt Eingaben, Ausdrücke und verwaltete Objekte. Dieses lokale Beispiel filtert deaktivierte Dienste, bevor for_each Instanzen erstellt. Eine validation-Regel lehnt eine bekanntermaßen ungültige Eingabe ab, bevor sie zu einer Ressourcenänderung wird.


      ## Probieren Sie es aus


      Öffnen Sie das **opentofu Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Wie viele Instanzen wird ein map mit einem aktivierten und einem deaktivierten Dienst erstellen?


      ```bash

      cd ~/lab/examples/hcl

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > One: api. Die Ausgabe ist dev/api; environment=production schlägt fehl, validation.


      ## Beobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-hcl
  additional:
    en: The AWS provider configuration remains an additional cloud practicum. HCL expressions and local resources run here.
    ru: Конфигурация AWS provider остаётся дополнительным облачным практикумом. HCL-выражения и локальные ресурсы доступны здесь.
    pl: Konfiguracja providera AWS pozostaje dodatkowym ćwiczeniem w chmurze. Dostępne są tutaj wyrażenia HCL i zasoby lokalne.
    es: La configuración AWS provider sigue siendo una práctica adicional en la nube. Aquí se ejecutan expresiones HCL y recursos locales.
    de: Die AWS provider-Konfiguration bleibt ein zusätzliches Cloud-Praktikum. Hier werden HCL-Ausdrücke und lokale Ressourcen ausgeführt.
terraform-3:
  profile: opentofu
  example: state
  source_hash: 0a6090ca1ab8ddbb55297d9aa1d4c1e692166b51d596a74ab19250973ac0c490
  content:
    en: 'State binds resource addresses to managed object identities. A normal plan compares configuration, state and refreshed objects. Editing the file outside OpenTofu creates drift; applying the reviewed plan restores the declared content.


      ## Try it


      Open the **opentofu Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Does editing the managed file update the HCL declaration?


      ```bash

      cd ~/lab/examples/state

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The next plan proposes reconciliation; apply restores declared.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'State связывает адреса ресурсов с объектами. Обычный plan сопоставляет код, state и прочитанные объекты. Изменение файла вне OpenTofu создаёт дрейф; применение проверенного плана восстанавливает заданное содержимое.


      ## Попробуйте


      Откройте лабораторию **opentofu**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Изменение управляемого файла обновляет HCL?


      ```bash

      cd ~/lab/examples/state

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Следующий plan предлагает восстановление; apply возвращает declared.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'State wiąże adresy zasobów z tożsamościami obiektów zarządzanych. Normalny plan porównuje konfigurację, state i odświeżone obiekty. Edycja pliku poza OpenTofu powoduje dryft; zastosowanie sprawdzonego plan przywraca zawartość declared.


      ## Wypróbuj


      Otwórz laboratorium **opentofu** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy edycja zarządzanego pliku aktualizuje deklarację HCL?


      ```bash

      cd ~/lab/examples/state

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Następny plan proponuje pojednanie; apply przywraca declared.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'El estado vincula las direcciones de recursos a las identidades de los objetos gestionados. Un plan normal compara la configuración, el estado y los objetos actualizados. Editar el archivo fuera de OpenTofu crea deriva; La aplicación del plan revisado restaura el contenido del declared.


      ## Pruébalo


      Abra el **opentofu Lab** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿La edición del archivo administrado actualiza la declaración HCL?


      ```bash

      cd ~/lab/examples/state

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. El próximo plan propone la reconciliación; apply restaura declared.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh`, luego `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Der Status bindet Ressourcenadressen an verwaltete Objektidentitäten. Ein normaler plan vergleicht Konfiguration, Status und aktualisierte Objekte. Das Bearbeiten der Datei außerhalb von OpenTofu führt zu Abweichungen. Durch Anwenden des überprüften plan wird der declared-Inhalt wiederhergestellt.


      ## Probieren Sie es aus


      Öffnen Sie das **opentofu Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Aktualisiert das Bearbeiten der verwalteten Datei die HCL-Deklaration?


      ```bash

      cd ~/lab/examples/state

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Der nächste plan schlägt eine Versöhnung vor; apply stellt declared wieder her.


      ## Beobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-state
terraform-4:
  profile: opentofu
  example: locking
  source_hash: ddff71df22c9d777af03a5a81ea8ce5598da4f6d31fdb7d3e97aae58cb907b6d
  content:
    en: 'A state lock prevents competing writers to one state. It is separate from Git locking and cloud resource permissions. This experiment uses the local backend; S3 authentication, remote locking and cloud recovery remain an additional AWS practicum.


      ## Try it


      Open the **opentofu Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Will the second operation wait forever when -lock-timeout=1s is set?


      ```bash

      cd ~/lab/examples/locking

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Expected result

      > No. It fails to acquire the lock within the timeout. After the first apply finishes, the plan succeeds.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Блокировка state защищает одно состояние от конкурирующих записей. Она не заменяет Git и права на облачные ресурсы. В опыте используется local backend; S3, удалённые блокировки и облачное восстановление остаются дополнительным AWS-практикумом.


      ## Попробуйте


      Откройте лабораторию **opentofu**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Будет ли вторая операция ждать бесконечно при -lock-timeout=1s?


      ```bash

      cd ~/lab/examples/locking

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Она завершается отказом получения блокировки по таймауту. После первого apply план проходит.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Blokada state uniemożliwia konkurującym zapisom na jednym state. Różni się od blokowania Git i uprawnień do zasobów w chmurze. W tym eksperymencie wykorzystano local backend; Uwierzytelnianie S3, zdalne blokowanie i odzyskiwanie w chmurze pozostają dodatkową praktyką AWS.


      ## Wypróbuj


      Otwórz laboratorium **opentofu** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy druga operacja będzie czekać w nieskończoność po ustawieniu -lock-timeout=1s?


      ```bash

      cd ~/lab/examples/locking

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Nie udało się uzyskać blokady w określonym czasie. Po zakończeniu pierwszego apply plan się powiódł.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Un bloqueo de estado impide que los escritores compitan en un estado. Es independiente del bloqueo Git y de los permisos de recursos en la nube. Este experimento utiliza local backend; La autenticación S3, el bloqueo remoto y la recuperación en la nube siguen siendo una práctica adicional de AWS.


      ## Pruébalo


      Abra el **opentofu Lab** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿La segunda operación esperará eternamente cuando se configure -lock-timeout=1s?


      ```bash

      cd ~/lab/examples/locking

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. No logra adquirir el bloqueo dentro del tiempo de espera. Una vez finalizado el primer apply, el plan tiene éxito.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh` y luego con `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Eine Statussperre verhindert, dass konkurrierende Autoren in einen Status schreiben. Es ist unabhängig von den Sperr- und Cloud-Ressourcenberechtigungen Git. Dieses Experiment verwendet local backend; S3 Authentifizierung, Fernsperrung und Cloud-Wiederherstellung bleiben ein zusätzliches AWS-Praktikum.


      ## Probieren Sie es aus


      Öffnen Sie das **opentofu Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Wird der zweite Vorgang ewig warten, wenn -lock-timeout=1s festgelegt ist?


      ```bash

      cd ~/lab/examples/locking

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Es gelingt ihm nicht, die Sperre innerhalb des Zeitlimits zu erhalten. Nachdem der erste apply abgeschlossen ist, ist der Plan erfolgreich.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: locking
  additional:
    en: S3 backend configuration is an additional cloud practicum. This Lab demonstrates a real local state lock, not an S3 backend.
    ru: Настройка S3 backend — дополнительный облачный практикум. Здесь проверяется настоящая блокировка локального state; S3 backend не подключён.
    pl: Konfiguracja backendu S3 to dodatkowe ćwiczenie w chmurze. To laboratorium demonstruje rzeczywistą blokadę lokalnego stanu, a nie backend S3.
    es: La configuración de S3 backend es una práctica adicional en la nube. Este laboratorio demuestra un bloqueo de estado local real, no un S3 backend.
    de: Die S3 backend-Konfiguration ist ein zusätzliches Cloud-Praktikum. In diesem Labor wird eine echte lokale Statussperre demonstriert, keine S3 backend.
terraform-6:
  profile: opentofu
  example: lifecycle
  source_hash: 5d66690f7642741100ea92e7005b72e96007c700ca2283b1daad193742ea399f
  content:
    en: 'Some changes update an object; others replace its identity. triggers_replace forces replacement in this local example, and create_before_destroy changes the ordering. A saved plan records the intended actions before apply.


      ## Try it


      Open the **opentofu Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Does create_before_destroy preserve the old resource ID?


      ```bash

      cd ~/lab/examples/lifecycle

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The plan orders create before delete, and the final ID changes.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Одни изменения обновляют объект, другие заменяют его идентичность. Здесь triggers_replace требует замены, create_before_destroy меняет порядок. Сохранённый plan позволяет проверить действия до apply.


      ## Попробуйте


      Откройте лабораторию **opentofu**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Сохраняет ли create_before_destroy прежний ID ресурса?


      ```bash

      cd ~/lab/examples/lifecycle

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Plan ставит create перед delete, итоговый ID меняется.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Niektóre zmiany aktualizują obiekt; inne zastępują jego tożsamość. triggers_replace wymusza wymianę w tym lokalnym przykładzie, a create_before_destroy zmienia kolejność. Zapisany plan rejestruje zamierzone działania przed apply.


      ## Wypróbuj


      Otwórz laboratorium **opentofu** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy create_before_destroy zachowuje stary zasób ID?


      ```bash

      cd ~/lab/examples/lifecycle

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. plan zamawia create przed delete, a ostateczne zmiany ID.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Algunos cambios actualizan un objeto; otros reemplazan su identidad. triggers_replace fuerza el reemplazo en este ejemplo local y create_before_destroy cambia el orden. Un plan guardado registra las acciones previstas antes de apply.


      ## Pruébalo


      Abra el **Laboratorio opentofu** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿create_before_destroy conserva el recurso antiguo ID?


      ```bash

      cd ~/lab/examples/lifecycle

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. Los pedidos plan se crean antes de delete y los cambios finales de ID.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh` y luego con `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Einige Änderungen aktualisieren ein Objekt; andere ersetzen seine Identität. triggers_replace erzwingt in diesem lokalen Beispiel die Ersetzung, und create_before_destroy ändert die Reihenfolge. Ein gespeicherter plan zeichnet die beabsichtigten Aktionen vor apply auf.


      ## Probieren Sie es aus


      Öffnen Sie das **opentofu Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Behält create_before_destroy die alte Ressource ID bei?


      ```bash

      cd ~/lab/examples/lifecycle

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Die plan-Bestellungen werden vor delete erstellt und die endgültigen ID-Änderungen.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-lifecycle
terraform-7.1:
  profile: opentofu
  example: module
  source_hash: 33b1f9fdb01b90503aefe09a80e411207861b13c8ec50345da9d327b75d7d44a
  content:
    en: 'A module has inputs, internal resources and explicit outputs. The caller passes values through that interface. Keeping all four module files beside the root makes this example runnable without another guide section.


      For quest 003, the root calls `./modules/notice` as `module.notice` with `station = "north"`. The child declares an input `station`, a `local_file.notice` resource and an output `message`; the root exports `module.notice.message` as `message`. The resource derives its filename from `station` and writes the station value followed by `-ready`. The child must declare the same provider source as the root, `registry.terraform.io/hashicorp/local`, because the offline mirror does not provide the default OpenTofu registry address. After initialization and apply, `tofu state list` should contain `module.notice.local_file.notice`; `cat north.txt` and `tofu output -raw message` should show `north-ready`. Run `tofu plan -input=false -detailed-exitcode -no-color`: exit code 0 means there are no changes.


      ## Try it


      Open the **opentofu Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Can the root read the child resource through its declared output?


      ```bash

      cd ~/lab/examples/module

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Expected result

      > Yes. module.api.name returns api; state contains the resource under the module.api address.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'У модуля есть входы, внутренние ресурсы и явные outputs. Вызывающий код передаёт значения через этот интерфейс. Все четыре файла модуля лежат рядом с корнем: другие разделы для запуска не нужны.


      В квесте 003 корневая конфигурация вызывает `./modules/notice` как `module.notice` с `station = "north"`. Дочерний модуль объявляет вход `station`, ресурс `local_file.notice` и выход `message`; корень экспортирует `module.notice.message` как `message`. Ресурс формирует имя файла из `station` и записывает значение station с суффиксом `-ready`. В дочернем модуле укажите тот же источник провайдера, что и в корне: `registry.terraform.io/hashicorp/local`; автономное зеркало не содержит адрес реестра OpenTofu по умолчанию. После инициализации и применения `tofu state list` должен содержать `module.notice.local_file.notice`, а `cat north.txt` и `tofu output -raw message` должны показывать `north-ready`. Выполните `tofu plan -input=false -detailed-exitcode -no-color`: код выхода 0 означает отсутствие изменений.


      ## Попробуйте


      Откройте лабораторию **opentofu**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Может ли корень получить значение ресурса через output дочернего модуля?


      ```bash

      cd ~/lab/examples/module

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Да. module.api.name возвращает api, а адрес в state находится внутри module.api.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Moduł ma wejścia, zasoby wewnętrzne i jawne outputs. Obiekt wywołujący przekazuje wartości przez ten interfejs. Trzymanie wszystkich czterech plików modułów obok katalogu głównego sprawia, że ​​ten przykład można uruchomić bez dodatkowej sekcji przewodnika.


      W zadaniu 003 konfiguracja główna wywołuje `./modules/notice` jako `module.notice` z `station = "north"`. Moduł potomny deklaruje wejście `station`, zasób `local_file.notice` i wyjście `message`; konfiguracja główna udostępnia `module.notice.message` jako `message`. Zasób tworzy nazwę pliku na podstawie `station` i zapisuje wartość station z przyrostkiem `-ready`. Moduł potomny musi deklarować to samo źródło dostawcy co konfiguracja główna, `registry.terraform.io/hashicorp/local`, ponieważ lokalne lustro nie udostępnia domyślnego adresu rejestru OpenTofu. Po inicjalizacji i zastosowaniu `tofu state list` powinno zawierać `module.notice.local_file.notice`, a `cat north.txt` i `tofu output -raw message` powinny pokazać `north-ready`. Uruchom `tofu plan -input=false -detailed-exitcode -no-color`: kod wyjścia 0 oznacza brak zmian.


      ## Wypróbuj


      Otwórz laboratorium **opentofu** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy root może odczytać zasób podrzędny poprzez zadeklarowany output?


      ```bash

      cd ~/lab/examples/module

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Tak. module.api.name zwraca api; state zawiera zasób pod adresem module.api.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Un módulo tiene entradas, recursos internos y outputs explícito. La persona que llama pasa valores a través de esa interfaz. Mantener los cuatro archivos del módulo junto a la raíz hace que este ejemplo se pueda ejecutar sin otra sección de guía.


      En el ejercicio 003, la configuración raíz llama a `./modules/notice` como `module.notice` con `station = "north"`. El módulo hijo declara una entrada `station`, un recurso `local_file.notice` y una salida `message`; la raíz exporta `module.notice.message` como `message`. El recurso deriva el nombre del archivo de `station` y escribe el valor de station seguido de `-ready`. El hijo debe declarar la misma fuente de proveedor que la raíz, `registry.terraform.io/hashicorp/local`, porque el mirror sin conexión no ofrece la dirección predeterminada del registro de OpenTofu. Después de inicializar y aplicar, `tofu state list` debe contener `module.notice.local_file.notice`; `cat north.txt` y `tofu output -raw message` deben mostrar `north-ready`. Ejecuta `tofu plan -input=false -detailed-exitcode -no-color`: el código de salida 0 indica que no hay cambios.


      ## Pruébalo


      Abra el laboratorio **opentofu** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿Puede la raíz leer el recurso secundario a través de su salida declarada?


      ```bash

      cd ~/lab/examples/module

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > YSí. module.api.name devuelve api; El estado contiene el recurso bajo la dirección module.api.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh`, luego `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Ein Modul verfügt über Eingänge, interne Ressourcen und explizite outputs. Der Aufrufer übergibt Werte über diese Schnittstelle. Wenn Sie alle vier Moduldateien neben dem Stammverzeichnis aufbewahren, ist dieses Beispiel ohne einen weiteren Anleitungsabschnitt lauffähig.


      In Aufgabe 003 ruft die Root-Konfiguration `./modules/notice` als `module.notice` mit `station = "north"` auf. Das Kindmodul deklariert eine Eingabe `station`, eine Ressource `local_file.notice` und eine Ausgabe `message`; die Root-Konfiguration exportiert `module.notice.message` als `message`. Die Ressource leitet den Dateinamen aus `station` ab und schreibt den Wert von station mit dem Suffix `-ready`. Das Kindmodul muss dieselbe Providerquelle wie die Root-Konfiguration deklarieren, `registry.terraform.io/hashicorp/local`, da der Offline-Mirror die Standardadresse der OpenTofu-Registry nicht bereitstellt. Nach Initialisierung und Anwendung sollte `tofu state list` `module.notice.local_file.notice` enthalten; `cat north.txt` und `tofu output -raw message` sollten `north-ready` anzeigen. Führe `tofu plan -input=false -detailed-exitcode -no-color` aus: Exit-Code 0 bedeutet, dass keine Änderungen anstehen.


      ## Probieren Sie es aus


      Öffnen Sie das **opentofu Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Kann der Root die untergeordnete Ressource über seine deklarierte Ausgabe lesen?


      ```bash

      cd ~/lab/examples/module

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > YJa. module.api.name gibt api zurück; Der Status enthält die Ressource unter der Adresse module.api.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-module
terraform-7.3:
  profile: opentofu
  example: module-fleet
  source_hash: 0228d7ffa09836c70c2ea8edbb3b02698d2e494b5a1998aeeef7912f0036e04c
  content:
    en: 'for_each creates a separate module instance for each key. Stable keys become part of the resource addresses, so key choice affects future refactoring and state moves.


      ## Try it


      Open the **opentofu Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Do api and worker share one child resource address?


      ```bash

      cd ~/lab/examples/module-fleet

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Expected result

      > No. Each key appears in its own module address and output.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'For_each создаёт отдельный экземпляр модуля для каждого ключа. Ключ входит в адрес ресурса, поэтому его выбор влияет на последующие переименования и переносы state.


      ## Попробуйте


      Откройте лабораторию **opentofu**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Используют ли api и worker один адрес дочернего ресурса?


      ```bash

      cd ~/lab/examples/module-fleet

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Каждый ключ входит в собственный адрес модуля и output.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'for_each tworzy oddzielną instancję modułu dla każdego klucza. Stabilne klucze stają się częścią adresów zasobów, więc wybór klucza wpływa na przyszłą refaktoryzację i ruchy state.


      ## Wypróbuj


      Otwórz laboratorium **opentofu** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy api i worker mają wspólny adres zasobu podrzędnego?


      ```bash

      cd ~/lab/examples/module-fleet

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Każdy klucz pojawia się we własnym adresie modułu i output.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'for_each crea una instancia de módulo separada para cada clave. Las claves estables pasan a formar parte de las direcciones de recursos, por lo que la elección de claves afecta la refactorización futura y los movimientos de estado.


      ## Pruébalo


      Abra el **opentofu Lab** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿api y worker comparten una dirección de recurso secundario?


      ```bash

      cd ~/lab/examples/module-fleet

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. Cada clave aparece en su propia dirección y salida de módulo.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh`, luego `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'for_each erstellt für jeden Schlüssel eine separate Modulinstanz. Stabile Schlüssel werden Teil der Ressourcenadressen, sodass die Wahl des Schlüssels zukünftige Refactoring- und Statusverschiebungen beeinflusst.


      ## Probieren Sie es aus


      Öffnen Sie das **opentofu Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Teilen sich api und worker eine untergeordnete Ressourcenadresse?


      ```bash

      cd ~/lab/examples/module-fleet

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Jeder Schlüssel erscheint in seiner eigenen Moduladresse und Ausgabe.


      ## Beobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-module-fleet
terraform-7.4:
  profile: opentofu
  example: addresses
  source_hash: 6cd98d5277d2550678691a836f5357955e046a6ddfd3adfa5458a04a78b9eebf
  content:
    en: 'A rename in code alone looks like removing one address and adding another. A moved block declares that both addresses refer to the same existing object. State removal is a different operation: it forgets ownership rather than destroying the object.


      ## Try it


      Open the **opentofu Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Will a declared move recreate the terraform_data object?


      ```bash

      cd ~/lab/examples/addresses

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The plan records the address move with a no-op resource action, and the ID stays the same.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Простое переименование в коде выглядит как удаление старого адреса и создание нового. Moved объявляет, что это один существующий объект. Удаление привязки из state — другая операция: забыть владение, а не уничтожить объект.


      ## Попробуйте


      Откройте лабораторию **opentofu**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Пересоздаст ли объявленный moved объект terraform_data?


      ```bash

      cd ~/lab/examples/addresses

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Plan показывает перенос адреса с действием no-op, ID сохраняется.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Zmiana nazwy w samym kodzie wygląda jak usunięcie jednego adresu i dodanie innego. Blok moved deklaruje, że oba adresy odnoszą się do tego samego istniejącego obiektu. Usuwanie stanu to inna operacja: zamiast niszczyć obiekt, zapomina się o jego własności.


      ## Wypróbuj


      Otwórz laboratorium **opentofu** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy zadeklarowany ruch odtworzy obiekt terraform_data?


      ```bash

      cd ~/lab/examples/addresses

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Plan rejestruje przeniesienie adresu za pomocą akcji zasobu no-op, a ID pozostaje taki sam.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Un cambio de nombre solo en el código parece eliminar una dirección y agregar otra. Un bloque moved declara que ambas direcciones hacen referencia al mismo objeto existente. La eliminación del estado es una operación diferente: se olvida la propiedad en lugar de destruir el objeto.


      ## Pruébalo


      Abra el **Laboratorio opentofu** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿Un movimiento declarado recreará el objeto terraform_data?


      ```bash

      cd ~/lab/examples/addresses

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. El plan registra el movimiento de dirección con una acción de recurso no-op y el ID permanece igual.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh` y luego con `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Eine Umbenennung allein im Code sieht so aus, als würde man eine Adresse entfernen und eine andere hinzufügen. Ein moved-Block erklärt, dass beide Adressen auf dasselbe vorhandene Objekt verweisen. Die staatliche Entfernung ist eine andere Operation: Sie vergisst das Eigentum, anstatt das Objekt zu zerstören.


      ## Probieren Sie es aus


      Öffnen Sie das **opentofu Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und prüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Wird eine deklarierte Verschiebung das terraform_data-Objekt neu erstellen?


      ```bash

      cd ~/lab/examples/addresses

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Der Plan zeichnet die Adressverschiebung mit einer no-op-Ressourcenaktion auf, und der ID bleibt gleich.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann mit `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-addresses
helm-3:
  profile: helm
  example: values
  source_hash: 0e47b10595ebc049c2e38ba78853b019c6942dd652f3e26afbd7520950793cb3
  content:
    en: 'A chart renders templates from merged values. Later files override earlier files; lists are replaced rather than extended element by element. --set-string, --set-json and --set-file express different input forms.


      ## Try it


      Open the **helm Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Will [a, b] plus the later list [c] become [a, b, c]?


      ```bash

      cd ~/lab/examples/values

      ls chart

      cat base.yaml override.yaml

      bash run.sh

      cat merged.yaml

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The rendered list is [c]. The check reads actual rendered YAML and also verifies string, JSON and file inputs.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Чарт рендерит шаблоны из объединённых values. Поздний файл перекрывает ранний; списки заменяются целиком. --set-string, --set-json и --set-file задают разные формы входа.


      ## Попробуйте


      Откройте лабораторию **helm**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Превратятся ли [a, b] и более поздний [c] в [a, b, c]?


      ```bash

      cd ~/lab/examples/values

      ls chart

      cat base.yaml override.yaml

      bash run.sh

      cat merged.yaml

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Итоговый список — [c]. Проверка читает реальный YAML и проверяет входы string, JSON и file.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Wykres renderuje szablony z połączonego values. Późniejsze pliki zastępują wcześniejsze; listy są zastępowane, a nie rozszerzane element po elemencie. --set-string, --set-json i --set-file wyrażają różne formularze wejściowe.


      ## Wypróbuj


      Otwórz laboratorium **helm** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy [a, b] plus późniejsza lista [c] stanie się [a, b, c]?


      ```bash

      cd ~/lab/examples/values

      ls chart

      cat base.yaml override.yaml

      bash run.sh

      cat merged.yaml

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Wyrenderowana lista to [c]. Kontrola odczytuje aktualnie wyrenderowany YAML, a także weryfikuje wejścia string, JSON i file.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Un chart representa plantillas de values fusionadas. Los archivos posteriores anulan los archivos anteriores; las listas se reemplazan en lugar de ampliarse elemento por elemento. --set-string, --set-json y --set-file expresan diferentes formas de entrada.


      ## Pruébalo


      Abra el **helm Lab** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿[a, b] más la lista posterior [c] se convertirán en [a, b, c]?


      ```bash

      cd ~/lab/examples/values

      ls chart

      cat base.yaml override.yaml

      bash run.sh

      cat merged.yaml

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. La lista renderizada es [c]. La verificación lee el YAML real representado y también verifica la cadena, el JSON y las entradas de archivos.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh`, luego `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Ein chart rendert Vorlagen aus dem zusammengeführten values. Spätere Dateien überschreiben frühere Dateien; Listen werden Element für Element ersetzt und nicht erweitert. --set-string, --set-json und --set-file drücken unterschiedliche Eingabeformen aus.


      ## Probieren Sie es aus


      Öffnen Sie das **helm Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Wird [a, b] plus die spätere Liste [c] zu [a, b, c]?


      ```bash

      cd ~/lab/examples/values

      ls chart

      cat base.yaml override.yaml

      bash run.sh

      cat merged.yaml

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Die gerenderte Liste ist [c]. Die Prüfung liest tatsächlich gerenderte YAML und überprüft außerdem Zeichenfolgen, JSON und Dateieingaben.


      ## Beobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-values
helm-8:
  profile: helm
  example: releases
  source_hash: 13b7edb4e6eb04aa96ab15622cfc19fc7cab0f9ca0b7186e3a3fb2436eba20ea
  content:
    en: 'Helm records release revisions. An upgrade applies new rendered resources; rollback applies an older desired state and records a new revision. Waiting for readiness and restoring a failed upgrade are explicit policies. External data is not automatically rolled back.


      ## Try it


      Open the **helm Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** After install, upgrade and rollback to revision 1, will the current revision number become 1 again?


      ```bash

      cd ~/lab/examples/releases

      cat chart/values.yaml

      bash run.sh

      helm history demo -n lab-helm

      bash check.sh

      ```


      > [!question]- Expected result

      > No. A successful rollback creates revision 3. The second check deliberately fails an image upgrade and verifies the restored Deployment.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Helm хранит ревизии релиза. Upgrade применяет новые ресурсы, rollback применяет прежнее желаемое состояние и создаёт новую ревизию. Ожидание готовности и возврат при отказе задаются явно. Внешние данные автоматически не откатываются.


      ## Попробуйте


      Откройте лабораторию **helm**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** После install, upgrade и rollback к ревизии 1 текущий номер снова станет 1?


      ```bash

      cd ~/lab/examples/releases

      cat chart/values.yaml

      bash run.sh

      helm history demo -n lab-helm

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Успешный rollback создаёт ревизию 3. Затем проверка намеренно ломает image upgrade и проверяет восстановленный Deployment.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Helm rejestruje wersje wersji. upgrade stosuje nowe renderowane zasoby; rollback stosuje starszy żądany stan i rejestruje nową wersję. Oczekiwanie na gotowość i przywracanie uszkodzonego upgrade to wyraźne zasady. Dane zewnętrzne nie są automatycznie przywracane.


      ## Wypróbuj


      Otwórz laboratorium **helm** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy po install, upgrade i rollback do wersji 1 bieżący numer wersji ponownie zmieni się na 1?


      ```bash

      cd ~/lab/examples/releases

      cat chart/values.yaml

      bash run.sh

      helm history demo -n lab-helm

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Pomyślne wykonanie rollback powoduje utworzenie wersji 3. Druga kontrola celowo kończy się niepowodzeniem image upgrade i weryfikuje przywrócony Deployment.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Revisiones de lanzamiento de registros Helm. Un upgrade aplica nuevos recursos renderizados; rollback aplica un estado deseado anterior y registra una nueva revisión. Esperar a que esté listo y restaurar un upgrade fallido son políticas explícitas. Los datos externos no se revierten automáticamente.


      ## Pruébalo


      Abra el laboratorio **helm** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** Después de install, upgrade y rollback hasta la revisión 1, ¿el número de revisión actual volverá a ser 1?


      ```bash

      cd ~/lab/examples/releases

      cat chart/values.yaml

      bash run.sh

      helm history demo -n lab-helm

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. Un rollback exitoso crea la revisión 3. La segunda verificación falla deliberadamente en una imagen upgrade y verifica el Deployment restaurado.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh`, luego `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Helm zeichnet Versionsrevisionen auf. Ein upgrade wendet neue gerenderte Ressourcen an; rollback wendet einen älteren gewünschten Status an und zeichnet eine neue Revision auf. Das Warten auf die Bereitschaft und das Wiederherstellen eines ausgefallenen upgrade sind explizite Richtlinien. Externe Daten werden nicht automatisch zurückgesetzt.


      ## Probieren Sie es aus


      Öffnen Sie das **helm Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Wird die aktuelle Revisionsnummer nach install, upgrade und rollback zu Revision 1 wieder 1?


      ```bash

      cd ~/lab/examples/releases

      cat chart/values.yaml

      bash run.sh

      helm history demo -n lab-helm

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Ein erfolgreicher rollback erstellt Revision 3. Die zweite Prüfung lässt ein Image upgrade absichtlich fehlschlagen und überprüft das wiederhergestellte Deployment.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann mit `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-releases
cicd-gitops-3:
  profile: gitops
  example: sync
  source_hash: 2b0669e4c37ceb01dad06dd24aee99c4ff73151e7787ccad94648492a58639bf
  content:
    en: 'Repo-server renders the chosen Git revision. The application controller compares desired and live objects, then performs sync. Phases order hooks before ordinary resources; waves order work inside a phase. A final Synced label alone does not prove the order.


      ## Try it


      Open the **gitops Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Can a normal resource in wave -1 run before an unfinished PreSync hook?


      ```bash

      cd ~/lab/examples/sync

      bash run.sh

      source ~/lab/platform.env

      kubectl -n "$LAB_NAMESPACE" get application lab-guide

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The check compares actual completion and creation timestamps, then checks Deployment readiness.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Repo-server рендерит выбранную ревизию Git. Application controller сравнивает desired и live, затем выполняет sync. Фазы ставят hooks перед обычными ресурсами, waves задают порядок внутри фазы. Одна итоговая отметка Synced не доказывает порядок.


      ## Попробуйте


      Откройте лабораторию **gitops**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Может ли обычный ресурс wave -1 обойти незавершённый PreSync hook?


      ```bash

      cd ~/lab/examples/sync

      bash run.sh

      source ~/lab/platform.env

      kubectl -n "$LAB_NAMESPACE" get application lab-guide

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Проверка сравнивает фактические времена завершения и создания, затем готовность Deployment.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Repo-server renderuje wybraną wersję Git. Kontroler aplikacji porównuje obiekty desired i live, a następnie wykonuje sync. Fazy ​​porządkują hooks przed zwykłymi zasobami; waves zlecenie pracy w fazie. Sama ostateczna etykieta Synced nie potwierdza kolejności.


      ## Wypróbuj


      Otwórz laboratorium **gitops** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy normalny zasób w wave -1 może działać przed niedokończonym PreSync hook?


      ```bash

      cd ~/lab/examples/sync

      bash run.sh

      source ~/lab/platform.env

      kubectl -n "$LAB_NAMESPACE" get application lab-guide

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Kontrola porównuje rzeczywiste znaczniki czasu ukończenia i utworzenia, a następnie sprawdza gotowość Deployment.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Repo-server representa la revisión Git elegida. El application controller compara desired y objetos en vivo, luego realiza sync. Orden de fases hooks antes que recursos ordinarios; Trabajo de orden waves dentro de una fase. Una etiqueta final Synced por sí sola no prueba el pedido.


      ## Pruébalo


      Abra el laboratorio **gitops** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿Se puede ejecutar un recurso normal en wave -1 antes que un PreSync hook sin terminar?


      ```bash

      cd ~/lab/examples/sync

      bash run.sh

      source ~/lab/platform.env

      kubectl -n "$LAB_NAMESPACE" get application lab-guide

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. La verificación compara las marcas de tiempo reales de finalización y creación y luego verifica que Deployment esté listo.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh` y luego con `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Repo-server rendert die ausgewählte Git-Revision. Der application controller vergleicht desired und Live-Objekte und führt dann sync aus. Phasenordnung hooks vor gewöhnlichen Ressourcen; waves Auftragsarbeit innerhalb einer Phase. Ein abschließendes Synced-Etikett allein beweist die Bestellung noch nicht.


      ## Probieren Sie es aus


      Öffnen Sie das **gitops Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und prüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Kann eine normale Ressource in wave -1 vor einer unvollendeten Ressource in PreSync hook ausgeführt werden?


      ```bash

      cd ~/lab/examples/sync

      bash run.sh

      source ~/lab/platform.env

      kubectl -n "$LAB_NAMESPACE" get application lab-guide

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Die Prüfung vergleicht die tatsächlichen Fertigstellungs- und Erstellungszeitstempel und überprüft dann die Deployment-Bereitschaft.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-sync
cicd-gitops-8:
  profile: gitops
  example: drift
  source_hash: c8f5061dd19632351f0743b81abe156f3f80528fba2c0d8df768c022bd6774fd
  content:
    en: 'Self-heal reconciles a live edit back to Git. Prune allows deletion of managed objects removed from Git. These are separate controls: observing a new revision or correcting a value does not prove that deletion is enabled.


      ## Try it


      Open the **gitops Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Will selfHeal=true alone remove a ConfigMap deleted from Git?


      ```bash

      cd ~/lab/examples/drift

      bash run.sh

      source ~/lab/platform.env

      kubectl -n "$LAB_NAMESPACE" get application lab-guide -o yaml

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The ConfigMap remains with prune disabled, then disappears when prune is explicitly enabled.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Self-heal возвращает ручное изменение к Git. Prune разрешает удаление управляемых объектов, исчезнувших из Git. Это разные настройки: новая ревизия и исправленное значение ещё не доказывают разрешение удаления.


      ## Попробуйте


      Откройте лабораторию **gitops**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Удалит ли один selfHeal=true ConfigMap, исчезнувший из Git?


      ```bash

      cd ~/lab/examples/drift

      bash run.sh

      source ~/lab/platform.env

      kubectl -n "$LAB_NAMESPACE" get application lab-guide -o yaml

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. При выключенном prune ConfigMap сохраняется и исчезает после явного включения prune.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Self-heal uzgadnia edycję na żywo z powrotem do Git. Prune, umożliwiając usuwanie zarządzanych obiektów usuniętych z Git. Są to odrębne kontrole: zaobserwowanie nowej wersji lub poprawienie wartości nie oznacza, że ​​możliwe jest usunięcie.


      ## Wypróbuj


      Otwórz laboratorium **gitops** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy samo selfHeal=true usunie ConfigMap usunięte z Git?


      ```bash

      cd ~/lab/examples/drift

      bash run.sh

      source ~/lab/platform.env

      kubectl -n "$LAB_NAMESPACE" get application lab-guide -o yaml

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. ConfigMap pozostaje przy wyłączonym prune, a następnie znika, gdy prune jest jawnie włączone.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Self-heal reconcilia una edición en vivo con Git. Prune permite la eliminación de objetos administrados eliminados de Git. Estos son controles separados: observar una nueva revisión o corregir un valor no prueba que la eliminación esté habilitada.


      ## Pruébalo


      Abra el laboratorio **gitops** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿El selfHeal=true por sí solo eliminará un ConfigMap eliminado de Git?


      ```bash

      cd ~/lab/examples/drift

      bash run.sh

      source ~/lab/platform.env

      kubectl -n "$LAB_NAMESPACE" get application lab-guide -o yaml

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. El ConfigMap permanece con prune deshabilitado y luego desaparece cuando prune se habilita explícitamente.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh` y luego con `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Self-heal gleicht eine Live-Bearbeitung wieder mit Git ab. Prune ermöglicht das Löschen verwalteter Objekte, die aus Git entfernt wurden. Hierbei handelt es sich um separate Kontrollen: Das Beobachten einer neuen Revision oder das Korrigieren eines Werts beweist nicht, dass das Löschen aktiviert ist.


      ## Probieren Sie es aus


      Öffnen Sie das **gitops Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Wird selfHeal=true allein einen ConfigMap entfernen, der aus Git gelöscht wurde?


      ```bash

      cd ~/lab/examples/drift

      bash run.sh

      source ~/lab/platform.env

      kubectl -n "$LAB_NAMESPACE" get application lab-guide -o yaml

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Der ConfigMap bleibt bei deaktiviertem prune bestehen und verschwindet dann, wenn prune explizit aktiviert wird.


      ## Beobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-drift
