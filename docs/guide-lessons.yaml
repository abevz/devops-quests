      ```bash

      cd ~/lab/examples/module

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Expected result

      > Yes. module.api.name returns api; state contains the resource under the module.api address.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'У модуля есть входы, внутренние ресурсы и явные outputs. Вызывающий код передаёт значения через этот интерфейс. Все четыре файла модуля лежат рядом с корнем: другие разделы для запуска не нужны.


      ## Попробуйте


      Откройте лабораторию **opentofu**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Может ли корень получить значение ресурса через output дочернего модуля?


      ```bash

      cd ~/lab/examples/module

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Да. module.api.name возвращает api, а адрес в state находится внутри module.api.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
