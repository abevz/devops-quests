terraform-3:
  profile: opentofu
  example: state
  source_hash: 0af1bdb1c967d041323fe5f80f925e15722857d5f57d0dc20a830ad55c2db946
  content:
    en: 'State binds resource addresses to managed object identities. A normal plan compares configuration, state and refreshed objects. Editing the file outside OpenTofu creates drift; applying the reviewed plan restores the declared content.


      For partial state loss, compare the checkpoint and current lineage, resources and identities. A checkpoint can contain a valid older version of a resource that still has a newer binding. An observed recovery identity can be compared at the producer and at each independent consumer.


      Compare the lineage, serial and resource bindings of the older checkpoint and current state. Replacing the whole state can discard changes made since the checkpoint. Preserve the trusted input and back up current state before changing it. Use a plan to inspect proposed changes.


      A producer output is a current interface, not automatic delivery to other systems. Compare its typed values and persistent operation identity with each independently managed consumer. A familiar release label or matching file bytes alone cannot distinguish a stale export. Different targets may receive different entries; inspect actual remote files and modes, reloaded responses and running process environments rather than only manifests. An unchanged infrastructure plan says nothing about downstream delivery. Use unapplied alternate-input plans to check whether published outputs follow the caller. At completion, revisit the producer and earlier consumers. These checks establish current correspondence, not the commands that created it.


      In quest 030, start with `main.tf` and restore the managed `release.txt` containing `release-30`. Check that `local_file.release` is in state and a fresh plan has no changes. Only then investigate the reader: its `RELEASE` environment must match the marker and the rollout must become ready.


      ### Original container identity and state {#original-container-state}


      In quest 026, `original-id` records the existing `rail-worker` container identity. Import that ID into `docker_container.worker`, then unpause the container: import adds a state binding but does not resume a paused process. Verify the state address, compare the live Docker ID and the resource ID from `tofu show -json` with `original-id`, and inspect that the container is running and not paused. These comparisons describe current identity, not a complete history. The probe can stop before it reports an identity or state result if the workstation cannot start Python.


      ### Managed release file and output {#release-artifact-production}


      In quest 020, the first stage produces the managed `release.txt` artifact and the root `release` output. Compare the file and output with `release-20`, check that `local_file.release` appears in state, and inspect a detailed plan for exit code 0 before using the artifact in the fleet stage. A correct file alone does not establish the state binding or output. The state probe reads the applied resource data. If it stops without returning a state result, verify that the workstation can run Python.


      ### Container state and running process {#container-state-runtime}


      In quest 006, `main.tf` already declares `docker_container.worker` with the name `rail-worker`. Apply the configuration in the private bay, then compare `tofu state list` with `docker inspect rail-worker --format ''{{.State.Running}}''`: the state must include `docker_container.worker`, and Docker must report `true`. An address in state alone does not prove the container is running.


      ### State binding {#notice-state}


      In quest 009, the declaration of `local_file.notice` in `main.tf` and the file on disk are separate from its state binding. Check that `tofu state list` contains the resource address; the file can exist even when the state has no entry for it.


      ### Notice edited outside OpenTofu {#notice-drift}


      In this exercise a manual edit changed `notice.txt` while `main.tf` still declares `north-ready`. Review `tofu plan`, then apply the configuration to reconcile the drift. Check the result with `cat notice.txt`.


      ### Checking for pending changes {#notice-plan}


      A missing state binding or unexpected content in the managed file can make the plan report pending changes. Run `tofu plan -input=false -detailed-exitcode -no-color` after recovery. Expect exit code 0 and no pending changes.


      ### Managed release and typed output {#release-output-contract}


      In quest 016, keep `local_file.release` and its file content `north-r16`. Change the root output `release` from a string to an object with `route = "north"`, numeric `revision = 16`, and `targets = ["app1", "app2", "app3"]`. Apply, then inspect `tofu output -json release`: JSON should preserve the number and array. Verify `release.txt`, `local_file.release` in state, and a final detailed plan exit code 0.


      ### Managed relay release {#relay-release-state}


      In quest 030, main.tf initially declares retired content. Use approved-release.txt as the source for release.txt and apply the reviewed configuration. A file created by hand is insufficient: tofu show -json must expose a managed local_file whose filename resolves to that file. A missing or unreadable state, or a missing file, prevents that observation. If the probe returns no state diagnostic, check whether the workstation can enter ~/quest and start Python.


      ### A clean release plan {#relay-clean-plan}


      In quest 030, tofu plan -input=false -detailed-exitcode -no-color must exit 0. Exit 2 means proposed changes remain; review them and apply the intended release configuration. Exit 1 means planning failed: read the visible error for configuration, provider or state problems. Matching file bytes alone do not prove a clean plan.


      ### Original north output {#recovery-original-north-output}


      The output may be absent or refer to a recreated north file; retain the original provider ID from the frozen receipt. The older checkpoint contains guardian but lacks the later progress operation. The newer partial state retains progress but has lost the guardian binding. Recover only that binding, and keep the pre-recovery backup and pre-apply plan. `tofu output -raw north_id`.


      ### Retain the existing file {#recovery-existing-north-content}


      The existing north.txt may have been edited or become unreadable; compare its content with the retained configuration before changing state. The older checkpoint contains guardian but lacks the later progress operation. The newer partial state retains progress but has lost the guardian binding. Recover only that binding, and keep the pre-recovery backup and pre-apply plan. `test "$(cat north.txt)" = north-71`.


      ### Create the missing file {#recovery-missing-south-content}


      The supplied configuration adds south.txt without applying it; a missing or different file can remain until the recovery plan creates the declared route. The older checkpoint contains guardian but lacks the later progress operation. The newer partial state retains progress but has lost the guardian binding. Recover only that binding, and keep the pre-recovery backup and pre-apply plan. `test "$(cat south.txt)" = south-71`.


      ### Restore one binding and retain newer progress {#recovery-merge-old-binding-with-new-progress}


      A blind retry can recreate guardian, while restoring the whole old checkpoint discards progress; restore only the missing binding and retain both frozen operation IDs. Failed or invalid tofu show output also reaches this diagnostic. The older checkpoint contains guardian but lacks the later progress operation. The newer partial state retains progress but has lost the guardian binding. Recover only that binding, and keep the pre-recovery backup and pre-apply plan. `tofu state list; jq .bindings /run/dq/facts/0/state-identities.json`.


      ### Both managed route targets {#recovery-two-managed-route-targets}


      The remaining state entries may target different files or duplicate a route; require exactly one managed local_file for each north.txt and south.txt after retaining both companions. The older checkpoint contains guardian but lacks the later progress operation. The newer partial state retains progress but has lost the guardian binding. Recover only that binding, and keep the pre-recovery backup and pre-apply plan. `tofu show -json | jq ''.values.root_module.resources[] | {address,type,filename:.values.filename}''`.


      ### No replacement of operation companions {#recovery-plan-preserves-companion-identities}


      A missing/stale recovery-plan.json or a plan that replaces an operation companion cannot preserve completed work; export the recovery plan after restoring the binding and keep both companions no-op with their original IDs. The older checkpoint contains guardian but lacks the later progress operation. The newer partial state retains progress but has lost the guardian binding. Recover only that binding, and keep the pre-recovery backup and pre-apply plan. `jq -r ''.resource_changes[] | [.address,(.change.actions|join(","))] | @tsv'' recovery-plan.json`.


      ### Inventory of the saved recovery plan {#recovery-plan-route-inventory}


      An unrelated route entry would violate the saved-plan inventory; the recovery artifact describes the two routes alongside the two retained operation companions. The older checkpoint contains guardian but lacks the later progress operation. The newer partial state retains progress but has lost the guardian binding. Recover only that binding, and keep the pre-recovery backup and pre-apply plan. `jq ''.resource_changes | length'' recovery-plan.json`.


      ### Keep the original route unchanged {#recovery-plan-existing-route-no-op}


      The saved plan may replace or modify north.txt, or use a different original ID; keep its existing route entry no-op with the frozen provider identity. The older checkpoint contains guardian but lacks the later progress operation. The newer partial state retains progress but has lost the guardian binding. Recover only that binding, and keep the pre-recovery backup and pre-apply plan. `jq ''.resource_changes[] | select(.type=="local_file") | {address,change}'' recovery-plan.json`.


      ### Retain the plan before applying {#recovery-plan-only-missing-route-create}


      The artifact may have been exported after apply, leaving south.txt no-op, or may omit the missing route; retain the pre-apply plan that creates south.txt. The older checkpoint contains guardian but lacks the later progress operation. The newer partial state retains progress but has lost the guardian binding. Recover only that binding, and keep the pre-recovery backup and pre-apply plan. `jq ''.resource_changes[] | select(.type=="local_file") | {address,change}'' recovery-plan.json`.


      ### Trusted checkpoint and newer partial backup {#recovery-trusted-checkpoint-and-partial-backup}


      Overwriting the trusted checkpoint or backing up state after recovery loses the required evidence; retain checkpoint bytes and the newer partial state with its original lineage, serial and completed-object IDs. The older checkpoint contains guardian but lacks the later progress operation. The newer partial state retains progress but has lost the guardian binding. Recover only that binding, and keep the pre-recovery backup and pre-apply plan. `sha256sum recovery-checkpoint.tfstate; jq ''{lineage,serial}'' before-recovery.tfstate`.


      ### A converged final plan {#recovery-final-converged-plan}


      Unapplied configuration, file drift or a planning error can leave the final detailed plan nonzero; inspect its proposed changes after applying the retained recovery plan. The older checkpoint contains guardian but lacks the later progress operation. The newer partial state retains progress but has lost the guardian binding. Recover only that binding, and keep the pre-recovery backup and pre-apply plan. `tofu plan -input=false -detailed-exitcode -no-color`.


      ### Starting the state observer {#recovery-state-helper-startup}


      The state observer may fail before inspecting bindings, for example if tofu cannot start or helper imports fail; ordinary nonzero/invalid tofu JSON instead reaches recovery_bindings. The older checkpoint contains guardian but lacks the later progress operation. The newer partial state retains progress but has lost the guardian binding. Recover only that binding, and keep the pre-recovery backup and pre-apply plan. `command -v tofu; python3 -I -c "import dq_check"`.


      ### Starting the plan observer {#recovery-plan-helper-startup}


      The plan observer may fail before producing a specific marker, for example during imports or unexpected artifact traversal; ordinary missing/invalid recovery-plan.json reaches recovery_binding_plan. The older checkpoint contains guardian but lacks the later progress operation. The newer partial state retains progress but has lost the guardian binding. Recover only that binding, and keep the pre-recovery backup and pre-apply plan. `python3 -I -c "import dq_check"; test -s recovery-plan.json`.


      ## Try it


      Open the **opentofu Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Does editing the managed file update the HCL declaration?


      ```bash

      cd ~/lab/examples/state

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The next plan proposes reconciliation; apply restores declared.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'State связывает адреса ресурсов с объектами. Обычный plan сопоставляет код, state и прочитанные объекты. Изменение файла вне OpenTofu создаёт дрейф; применение проверенного плана восстанавливает заданное содержимое.


      При частичной потере состояния сравните lineage, ресурсы и идентичности в копии и активном файле. В копии может быть корректная старая версия ресурса, у которого уже есть более свежая привязка. Сверяйте восстановленный идентификатор у источника и каждого независимого потребителя.


      Сопоставьте происхождение (lineage), номер версии (serial) и привязки ресурсов в старой копии и текущем состоянии. Замена всего состояния может стереть изменения после создания копии. Сохраните доверенную копию и сделайте резервную копию текущего состояния перед правками. Проверьте предлагаемые изменения по плану.


      Output производителя — текущий интерфейс, а не автоматическая доставка в другие системы. Сравнивайте его типизированные значения и постоянную идентичность операции с каждым независимо управляемым потребителем. Знакомое имя релиза или одинаковые байты файла сами по себе не отличают устаревший экспорт. Разным получателям могут предназначаться разные записи; изучайте реальные удалённые файлы и режимы, ответы после перезагрузки и окружение работающих процессов, а не только манифесты. Пустой инфраструктурный план ничего не говорит о доставке дальше. Планами без применения для другого входа проверьте, следуют ли опубликованные outputs аргументам вызывающего кода. При завершении повторно проверьте производителя и предыдущих потребителей. Это устанавливает текущую согласованность, а не историю команд.


      В квесте 030 начните с `main.tf` и восстановите управляемый `release.txt` с содержимым `release-30`. Проверьте наличие `local_file.release` в state и отсутствие изменений в новом плане. Только затем исследуйте reader: его переменная `RELEASE` должна совпадать с маркером, а rollout — стать готовым.


      ### Исходная идентичность контейнера и состояние {#original-container-state}


      В квесте 026 `original-id` хранит идентификатор существующего контейнера `rail-worker`. Импортируйте этот ID в `docker_container.worker`, затем снимите контейнер с паузы: import добавляет связь со state, но не возобновляет приостановленный процесс. Проверьте адрес в state, сравните текущий Docker ID и ID ресурса из `tofu show -json` с `original-id` и убедитесь, что контейнер работает и не приостановлен. Эти сравнения описывают текущую идентичность, а не полную историю. Если рабочая станция не запускает Python, проверка может остановиться до вывода идентификатора или состояния.


      ### Управляемый файл и выход релиза {#release-artifact-production}


      В квесте 020 первый этап создает управляемый артефакт `release.txt` и корневой выход `release`. Сравните файл и выход с `release-20`, убедитесь, что в state есть `local_file.release`, и проверьте код выхода подробного plan 0 до использования артефакта на этапе fleet. Сам правильный файл не подтверждает связь со state или значение выхода. Проверка читает данные применённого ресурса. Если она завершается без результата по состоянию, проверьте запуск Python на рабочей станции.


      ### Состояние и запуск контейнера {#container-state-runtime}


      В квесте 006 файл `main.tf` уже объявляет `docker_container.worker` с именем `rail-worker`. Примените конфигурацию в приватной лаборатории и сравните `tofu state list` с `docker inspect rail-worker --format ''{{.State.Running}}''`: в состоянии должен быть `docker_container.worker`, а Docker должен показать `true`. Сам по себе адрес в состоянии не доказывает, что контейнер работает.


      ### Привязка ресурса в состоянии {#notice-state}


      В квесте 009 объявление `local_file.notice` в `main.tf`, файл на диске и его привязка в состоянии проверяются отдельно. Сверьте адрес ресурса через `tofu state list`: файл может существовать и без записи о нём в состоянии.


      ### Уведомление изменили вне OpenTofu {#notice-drift}


      В этом упражнении ручная правка изменила `notice.txt`, а в `main.tf` осталось значение `north-ready`. Просмотрите `tofu plan` и примените конфигурацию, чтобы устранить расхождение. Проверьте результат через `cat notice.txt`.


      ### Проверка ожидающих изменений {#notice-plan}


      Если нет привязки или управляемый файл изменился, план может показать ожидающие изменения. После восстановления выполните `tofu plan -input=false -detailed-exitcode -no-color`. Ожидаются код 0 и отсутствие изменений.


      ### Управляемый релиз и тип вывода {#release-output-contract}


      В квесте 016 сохраните `local_file.release` и содержимое его файла `north-r16`. Измените корневой выход `release` со строки на объект с `route = "north"`, числовым `revision = 16` и `targets = ["app1", "app2", "app3"]`. Примените изменения и проверьте `tofu output -json release`: JSON должен сохранить число и массив. Проверьте `release.txt`, `local_file.release` в состоянии и код выхода 0 итогового подробного плана.


      ### Управляемый релиз relay {#relay-release-state}


      В квесте 030 main.tf изначально задаёт устаревшее содержимое. Используйте approved-release.txt как источник для release.txt и примените проверенную конфигурацию. Создать файл вручную недостаточно: tofu show -json должен показывать управляемый local_file, чей filename указывает на этот файл. Отсутствие или нечитаемость state либо отсутствие файла мешают проверке. Если диагностика state не появилась, проверьте переход в ~/quest и запуск Python на рабочей станции.


      ### План релиза без изменений {#relay-clean-plan}


      В квесте 030 tofu plan -input=false -detailed-exitcode -no-color должен завершиться с кодом 0. Код 2 означает оставшиеся изменения: изучите их и примените нужную конфигурацию релиза. Код 1 означает ошибку планирования: прочитайте сообщение о конфигурации, провайдере или state. Совпадение содержимого файла не доказывает отсутствие изменений в плане.


      ### Исходный output north {#recovery-original-north-output}


      Output может отсутствовать или ссылаться на пересозданный north-файл; сохраните исходный provider ID из зафиксированной записи. Старый checkpoint содержит guardian, но не новую операцию progress. Новая частичная state сохраняет progress, но потеряла привязку guardian. Восстановите только её, сохранив backup до восстановления и план до apply. `tofu output -raw north_id`.


      ### Сохранение существующего файла {#recovery-existing-north-content}


      Существующий north.txt мог измениться или стать недоступным; сравните содержимое с выданной конфигурацией до изменения state. Старый checkpoint содержит guardian, но не новую операцию progress. Новая частичная state сохраняет progress, но потеряла привязку guardian. Восстановите только её, сохранив backup до восстановления и план до apply. `test "$(cat north.txt)" = north-71`.


      ### Создание отсутствующего файла {#recovery-missing-south-content}


      Выданная конфигурация добавляет south.txt без apply; файл может отсутствовать или отличаться, пока план восстановления не создаст объявленный маршрут. Старый checkpoint содержит guardian, но не новую операцию progress. Новая частичная state сохраняет progress, но потеряла привязку guardian. Восстановите только её, сохранив backup до восстановления и план до apply. `test "$(cat south.txt)" = south-71`.


      ### Одна привязка и новые операции {#recovery-merge-old-binding-with-new-progress}


      Повторный apply может пересоздать guardian, а откат всего checkpoint теряет progress; восстановите только отсутствующую привязку, сохраняя оба ID операций. Ошибка tofu show или неверный JSON также дают эту диагностику. Старый checkpoint содержит guardian, но не новую операцию progress. Новая частичная state сохраняет progress, но потеряла привязку guardian. Восстановите только её, сохранив backup до восстановления и план до apply. `tofu state list; jq .bindings /run/dq/facts/0/state-identities.json`.


      ### Оба управляемых файла маршрута {#recovery-two-managed-route-targets}


      Оставшиеся записи state могут указывать на другие файлы или дублировать маршрут; после сохранения двух companions нужен ровно один managed local_file для north.txt и south.txt. Старый checkpoint содержит guardian, но не новую операцию progress. Новая частичная state сохраняет progress, но потеряла привязку guardian. Восстановите только её, сохранив backup до восстановления и план до apply. `tofu show -json | jq ''.values.root_module.resources[] | {address,type,filename:.values.filename}''`.


      ### Без замены companions операций {#recovery-plan-preserves-companion-identities}


      Отсутствующий/старый recovery-plan.json либо замена companion в плане не сохраняют завершённую работу; экспортируйте план после восстановления привязки, оставляя оба companions no-op с исходными ID. Старый checkpoint содержит guardian, но не новую операцию progress. Новая частичная state сохраняет progress, но потеряла привязку guardian. Восстановите только её, сохранив backup до восстановления и план до apply. `jq -r ''.resource_changes[] | [.address,(.change.actions|join(","))] | @tsv'' recovery-plan.json`.


      ### Состав сохранённого плана {#recovery-plan-route-inventory}


      Лишняя запись маршрута нарушает состав сохранённого плана; артефакт описывает два маршрута вместе с двумя сохранёнными companions операций. Старый checkpoint содержит guardian, но не новую операцию progress. Новая частичная state сохраняет progress, но потеряла привязку guardian. Восстановите только её, сохранив backup до восстановления и план до apply. `jq ''.resource_changes | length'' recovery-plan.json`.


      ### Исходный маршрут без изменений {#recovery-plan-existing-route-no-op}


      Сохранённый план может заменять/менять north.txt либо использовать другой исходный ID; оставьте запись существующего маршрута no-op с зафиксированной идентичностью. Старый checkpoint содержит guardian, но не новую операцию progress. Новая частичная state сохраняет progress, но потеряла привязку guardian. Восстановите только её, сохранив backup до восстановления и план до apply. `jq ''.resource_changes[] | select(.type=="local_file") | {address,change}'' recovery-plan.json`.


      ### План до применения {#recovery-plan-only-missing-route-create}


      Артефакт могли экспортировать после apply, когда south.txt уже no-op, либо пропустить маршрут; сохраните план до apply, создающий south.txt. Старый checkpoint содержит guardian, но не новую операцию progress. Новая частичная state сохраняет progress, но потеряла привязку guardian. Восстановите только её, сохранив backup до восстановления и план до apply. `jq ''.resource_changes[] | select(.type=="local_file") | {address,change}'' recovery-plan.json`.


      ### Checkpoint и новая частичная копия {#recovery-trusted-checkpoint-and-partial-backup}


      Изменение доверенного checkpoint либо backup после восстановления теряет нужные данные; сохраните байты checkpoint и новую частичную state с исходными lineage, serial и ID завершённых объектов. Старый checkpoint содержит guardian, но не новую операцию progress. Новая частичная state сохраняет progress, но потеряла привязку guardian. Восстановите только её, сохранив backup до восстановления и план до apply. `sha256sum recovery-checkpoint.tfstate; jq ''{lineage,serial}'' before-recovery.tfstate`.


      ### Финальный план без изменений {#recovery-final-converged-plan}


      Неприменённая конфигурация, drift файлов или ошибка plan дают ненулевой финальный код; изучите изменения после применения сохранённого плана восстановления. Старый checkpoint содержит guardian, но не новую операцию progress. Новая частичная state сохраняет progress, но потеряла привязку guardian. Восстановите только её, сохранив backup до восстановления и план до apply. `tofu plan -input=false -detailed-exitcode -no-color`.


      ### Запуск наблюдения state {#recovery-state-helper-startup}


      Наблюдение state может завершиться до проверки привязок, например при невозможности запуска tofu или импорта helper; обычный ненулевой код/неверный JSON tofu дают recovery_bindings. Старый checkpoint содержит guardian, но не новую операцию progress. Новая частичная state сохраняет progress, но потеряла привязку guardian. Восстановите только её, сохранив backup до восстановления и план до apply. `command -v tofu; python3 -I -c "import dq_check"`.


      ### Запуск наблюдения плана {#recovery-plan-helper-startup}


      Наблюдение плана может завершиться до конкретного маркера на импортах или неожиданной структуре артефакта; обычный отсутствующий/неверный recovery-plan.json даёт recovery_binding_plan. Старый checkpoint содержит guardian, но не новую операцию progress. Новая частичная state сохраняет progress, но потеряла привязку guardian. Восстановите только её, сохранив backup до восстановления и план до apply. `python3 -I -c "import dq_check"; test -s recovery-plan.json`.


      ## Попробуйте


      Откройте лабораторию **opentofu**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


