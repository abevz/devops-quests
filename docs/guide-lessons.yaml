    pl: 'State wiąże adresy zasobów z tożsamościami obiektów zarządzanych. Normalny plan porównuje konfigurację, state i odświeżone obiekty. Edycja pliku poza OpenTofu powoduje dryft; zastosowanie sprawdzonego plan przywraca zawartość declared.


      Po częściowej utracie stanu porównaj pochodzenie, zasoby i tożsamości w kopii i aktualnym stanie. Kopia może obejmować poprawną starszą wersję zasobu z nowszym powiązaniem. Porównaj odzyskaną tożsamość u producenta i każdego niezależnego konsumenta.


      Porównaj lineage, serial i powiązania zasobów w starszej kopii i aktualnym stanie. Zastąpienie całego stanu może usunąć późniejsze zmiany. Zachowaj zaufane dane wejściowe i wykonaj kopię bieżącego stanu przed zmianami. Przejrzyj plan, aby zobaczyć proponowane zmiany.


      Wyjście producenta jest bieżącym interfejsem, a nie automatycznym dostarczeniem do innych systemów. Porównuj jego typowane wartości i trwałą tożsamość operacji z każdym niezależnie zarządzanym odbiorcą. Znana nazwa wydania lub zgodne bajty pliku same nie odróżniają przestarzałego eksportu. Różni odbiorcy mogą otrzymywać różne wpisy; sprawdzaj rzeczywiste zdalne pliki i tryby, odpowiedzi po przeładowaniu oraz środowiska działających procesów, nie tylko manifesty. Plan infrastruktury bez zmian niczego nie dowodzi o dalszym dostarczeniu. Planami z innymi wejściami, bez ich zastosowania, sprawdź, czy publikowane wyjścia podążają za wywołującym. Przy zakończeniu ponownie sprawdź producenta i wcześniejszych odbiorców. Te próby potwierdzają bieżącą zgodność, a nie historię poleceń.


      W zadaniu 030 zacznij od `main.tf` i przywróć zarządzany `release.txt` z zawartością `release-30`. Sprawdź obecność `local_file.release` w state i brak zmian w nowym planie. Dopiero potem zbadaj reader: jego zmienna `RELEASE` ma odpowiadać znacznikowi, a rollout osiągnąć gotowość.


      ### Pierwotna tożsamość kontenera i stan {#original-container-state}


      W zadaniu 026 `original-id` zapisuje identyfikator istniejącego kontenera `rail-worker`. Zaimportuj ten ID do `docker_container.worker`, a następnie wznów kontener: import dodaje powiązanie ze state, lecz nie wznawia wstrzymanego procesu. Sprawdź adres w state, porównaj bieżący ID Dockera i ID zasobu z `tofu show -json` z `original-id` oraz upewnij się, że kontener działa i nie jest wstrzymany. Porównania opisują obecną tożsamość, a nie pełną historię. Sonda może przerwać pracę przed wynikiem identyfikatora lub stanu, jeśli stacja nie może uruchomić Pythona.


      ### Zarządzany plik i wynik wydania {#release-artifact-production}


      W zadaniu 020 pierwszy etap tworzy zarządzany artefakt `release.txt` i główne wyjście `release`. Porównaj plik i wyjście z `release-20`, sprawdź obecność `local_file.release` w state oraz kod wyjścia 0 szczegółowego planu przed użyciem artefaktu w etapie fleet. Sam poprawny plik nie potwierdza powiązania ze state ani wartości wyjścia. Sonda odczytuje dane zastosowanego zasobu. Jeśli nie zwraca wyniku stanu, sprawdź, czy stacja może uruchamiać Pythona.


      ### Stan i uruchomienie kontenera {#container-state-runtime}


      W zadaniu 006 plik `main.tf` już deklaruje `docker_container.worker` o nazwie `rail-worker`. Zastosuj konfigurację w prywatnym środowisku i porównaj `tofu state list` z `docker inspect rail-worker --format ''{{.State.Running}}''`: stan musi zawierać `docker_container.worker`, a Docker musi zwrócić `true`. Sam adres w stanie nie dowodzi, że kontener działa.


      ### Powiązanie zasobu w stanie {#notice-state}


