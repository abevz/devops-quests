      ### Przyczyna i obserwacja (069, credential_auth) {#private-delivery-observed-auth-response}


      Endpoint zwrócił odczytaną, lecz nieoczekiwaną odpowiedź sukcesu/body; porównaj z credential-ready dla pierwotnego tokenu. Błędy HTTP 401/503 trafiają do diagnostyki obserwacji. Dostarczone zadanie copy ustawia mode 644 i wyłącza no_log. Dostarcz oba wejścia z prywatnymi prawami i właścicielem odbiorcy. Pierwotne programy czytają przy każdym HTTP; restart ani SIGHUP nie są potrzebne. Obserwuj metadane bez wypisywania credential. `python3 -c ''import os,urllib.request,yaml; token=yaml.safe_load(open("credentials.yml"))["station_token"]; host="app1-"+os.environ["DQ_NAMESPACE"][3:]; request=urllib.request.Request("http://"+host+":8081/",headers={"Authorization":"Bearer "+token}); print(urllib.request.urlopen(request,timeout=3).read().decode().strip())''`


      ### Przyczyna i obserwacja (069, consumer_budget) {#private-delivery-bounded-ssh-observer}


      SSH lub zdalny observer może przekroczyć pozostały limit subprocess; sprawdź łączność hosta i polecenie obserwacji. Dostarczone zadanie copy ustawia mode 644 i wyłącza no_log. Dostarcz oba wejścia z prywatnymi prawami i właścicielem odbiorcy. Pierwotne programy czytają przy każdym HTTP; restart ani SIGHUP nie są potrzebne. Obserwuj metadane bez wypisywania credential. `ssh -n -o BatchMode=yes -o ConnectTimeout=3 -p 2222 root@app1-"${DQ_NAMESPACE#dq-}" true`


      ### Przyczyna i obserwacja (069, consumer_observation) {#private-delivery-own-file-access-and-observation}


