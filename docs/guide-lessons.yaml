  source_hash: 0228d7ffa09836c70c2ea8edbb3b02698d2e494b5a1998aeeef7912f0036e04c
  content:
    en: 'for_each creates a separate module instance for each key. Stable keys become part of the resource addresses, so key choice affects future refactoring and state moves.


      In quest 023, `module.stations` calls `./modules/notice` for the keys `north` and `south`, passing each key as the `station` input. Each key has its own `local_file.notice` state address. After apply, check both keyed addresses, `north.txt` containing `north-ready`, `south.txt` containing `south-ready`, and a detailed plan exit code 0. A single module instance cannot satisfy both addresses.


      ## Try it


      Open the **opentofu Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Do api and worker share one child resource address?


      ```bash

      cd ~/lab/examples/module-fleet

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Expected result

      > No. Each key appears in its own module address and output.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'For_each создаёт отдельный экземпляр модуля для каждого ключа. Ключ входит в адрес ресурса, поэтому его выбор влияет на последующие переименования и переносы state.


      В квесте 023 `module.stations` вызывает `./modules/notice` для ключей `north` и `south`, передавая каждый ключ во вход `station`. У каждого ключа свой адрес `local_file.notice` в state. После применения проверьте оба адреса с ключами, `north.txt` со значением `north-ready`, `south.txt` со значением `south-ready` и код выхода 0 подробного plan. Один экземпляр модуля не может дать оба адреса.


      ## Попробуйте


      Откройте лабораторию **opentofu**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Используют ли api и worker один адрес дочернего ресурса?


      ```bash

      cd ~/lab/examples/module-fleet

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Каждый ключ входит в собственный адрес модуля и output.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'for_each tworzy oddzielną instancję modułu dla każdego klucza. Stabilne klucze stają się częścią adresów zasobów, więc wybór klucza wpływa na przyszłą refaktoryzację i ruchy state.


      W zadaniu 023 `module.stations` wywołuje `./modules/notice` dla kluczy `north` i `south`, przekazując każdy klucz jako wejście `station`. Każdy klucz ma osobny adres `local_file.notice` w state. Po zastosowaniu sprawdź oba adresy z kluczami, `north.txt` z wartością `north-ready`, `south.txt` z wartością `south-ready` oraz kod wyjścia 0 szczegółowego planu. Jedna instancja modułu nie może zapewnić obu adresów.


      ## Wypróbuj


      Otwórz laboratorium **opentofu** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy api i worker mają wspólny adres zasobu podrzędnego?


      ```bash

      cd ~/lab/examples/module-fleet

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Każdy klucz pojawia się we własnym adresie modułu i output.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'for_each crea una instancia de módulo separada para cada clave. Las claves estables pasan a formar parte de las direcciones de recursos, por lo que la elección de claves afecta la refactorización futura y los movimientos de estado.


      En el ejercicio 023, `module.stations` llama a `./modules/notice` para las claves `north` y `south`, pasando cada clave como entrada `station`. Cada clave tiene su propia dirección `local_file.notice` en state. Tras aplicar, comprueba ambas direcciones con clave, `north.txt` con `north-ready`, `south.txt` con `south-ready` y el código de salida 0 de un plan detallado. Una sola instancia del módulo no puede satisfacer ambas direcciones.


      ## Pruébalo


      Abra el **opentofu Lab** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿api y worker comparten una dirección de recurso secundario?


      ```bash

      cd ~/lab/examples/module-fleet

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. Cada clave aparece en su propia dirección y salida de módulo.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh`, luego `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'for_each erstellt für jeden Schlüssel eine separate Modulinstanz. Stabile Schlüssel werden Teil der Ressourcenadressen, sodass die Wahl des Schlüssels zukünftige Refactoring- und Statusverschiebungen beeinflusst.


      In Aufgabe 023 ruft `module.stations` `./modules/notice` für die Schlüssel `north` und `south` auf und übergibt jeden Schlüssel als Eingabe `station`. Jeder Schlüssel hat eine eigene `local_file.notice`-Adresse im State. Prüfe nach der Anwendung beide Adressen mit Schlüssel, `north.txt` mit `north-ready`, `south.txt` mit `south-ready` und Exit-Code 0 eines detaillierten Plans. Eine einzelne Modulinstanz kann nicht beide Adressen erfüllen.


      ## Probieren Sie es aus


      Öffnen Sie das **opentofu Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Teilen sich api und worker eine untergeordnete Ressourcenadresse?


      ```bash

      cd ~/lab/examples/module-fleet

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Jeder Schlüssel erscheint in seiner eigenen Moduladresse und Ausgabe.


      ## Beobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-module-fleet
terraform-7.4:
  profile: opentofu
  example: addresses
  source_hash: 6cd98d5277d2550678691a836f5357955e046a6ddfd3adfa5458a04a78b9eebf
  content:
    en: 'A rename in code alone looks like removing one address and adding another. A moved block declares that both addresses refer to the same existing object. State removal is a different operation: it forgets ownership rather than destroying the object.


      In quest 084, a moved block can change the root worker address to `module.station.docker_container.worker` without replacing the container. Declare the child provider contract, then compare the original ID with the live container, root output and state resource ID and verify an empty plan.


      ## Try it


      Open the **opentofu Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Will a declared move recreate the terraform_data object?


      ```bash

      cd ~/lab/examples/addresses

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The plan records the address move with a no-op resource action, and the ID stays the same.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Простое переименование в коде выглядит как удаление старого адреса и создание нового. Moved объявляет, что это один существующий объект. Удаление привязки из state — другая операция: забыть владение, а не уничтожить объект.


      В квесте 084 moved block может перенести корневой адрес worker в `module.station.docker_container.worker` без замены контейнера. Объявите контракт провайдера в дочернем модуле, затем сравните исходный ID с живым контейнером, корневым output и ID ресурса в state и проверьте пустой план.


      ## Попробуйте


      Откройте лабораторию **opentofu**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Пересоздаст ли объявленный moved объект terraform_data?


      ```bash

      cd ~/lab/examples/addresses

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Plan показывает перенос адреса с действием no-op, ID сохраняется.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Zmiana nazwy w samym kodzie wygląda jak usunięcie jednego adresu i dodanie innego. Blok moved deklaruje, że oba adresy odnoszą się do tego samego istniejącego obiektu. Usuwanie stanu to inna operacja: zamiast niszczyć obiekt, zapomina się o jego własności.


      W zadaniu 084 blok moved może zmienić główny adres worker na `module.station.docker_container.worker` bez zastąpienia kontenera. Zadeklaruj kontrakt providera w module potomnym, porównaj pierwotne ID z żywym kontenerem, głównym outputem i ID zasobu w state oraz sprawdź pusty plan.


      ## Wypróbuj


      Otwórz laboratorium **opentofu** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy zadeklarowany ruch odtworzy obiekt terraform_data?


      ```bash

      cd ~/lab/examples/addresses

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Plan rejestruje przeniesienie adresu za pomocą akcji zasobu no-op, a ID pozostaje taki sam.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Un cambio de nombre solo en el código parece eliminar una dirección y agregar otra. Un bloque moved declara que ambas direcciones hacen referencia al mismo objeto existente. La eliminación del estado es una operación diferente: se olvida la propiedad en lugar de destruir el objeto.


      En el ejercicio 084, un bloque moved puede cambiar la dirección raíz de worker a `module.station.docker_container.worker` sin reemplazar el contenedor. Declara el contrato del proveedor hijo, compara el ID original con el contenedor activo, la salida raíz y el ID del recurso en state y verifica un plan vacío.


      ## Pruébalo


      Abra el **Laboratorio opentofu** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿Un movimiento declarado recreará el objeto terraform_data?


      ```bash

      cd ~/lab/examples/addresses

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. El plan registra el movimiento de dirección con una acción de recurso no-op y el ID permanece igual.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh` y luego con `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Eine Umbenennung allein im Code sieht so aus, als würde man eine Adresse entfernen und eine andere hinzufügen. Ein moved-Block erklärt, dass beide Adressen auf dasselbe vorhandene Objekt verweisen. Die staatliche Entfernung ist eine andere Operation: Sie vergisst das Eigentum, anstatt das Objekt zu zerstören.


      In Aufgabe 084 kann ein Moved-Block die Root-Adresse des Workers zu `module.station.docker_container.worker` ändern, ohne den Container zu ersetzen. Deklariere den Provider-Vertrag des Kindmoduls, vergleiche die ursprüngliche ID mit laufendem Container, Root-Output und Ressourcen-ID im State und prüfe einen leeren Plan.


      ## Probieren Sie es aus


      Öffnen Sie das **opentofu Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und prüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Wird eine deklarierte Verschiebung das terraform_data-Objekt neu erstellen?


      ```bash

      cd ~/lab/examples/addresses

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Der Plan zeichnet die Adressverschiebung mit einer no-op-Ressourcenaktion auf, und der ID bleibt gleich.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann mit `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-addresses
helm-3:
  profile: helm
  example: values
  source_hash: 0e47b10595ebc049c2e38ba78853b019c6942dd652f3e26afbd7520950793cb3
  content:
    en: 'A chart renders templates from merged values. Later files override earlier files; lists are replaced rather than extended element by element. --set-string, --set-json and --set-file express different input forms.


      In quest 082, inspect the rendered command and effective chart value. Upgrade the existing board release with port `8080`, then verify the release, rollout and actual `signalrail` HTTP response; Helm''s deployed status alone does not establish application health.


      ## Try it


      Open the **helm Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Will [a, b] plus the later list [c] become [a, b, c]?


      ```bash

      cd ~/lab/examples/values

      ls chart

      cat base.yaml override.yaml

      bash run.sh

      cat merged.yaml

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The rendered list is [c]. The check reads actual rendered YAML and also verifies string, JSON and file inputs.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Чарт рендерит шаблоны из объединённых values. Поздний файл перекрывает ранний; списки заменяются целиком. --set-string, --set-json и --set-file задают разные формы входа.


      В квесте 082 изучите отрендеренную команду и действующее значение chart. Обновите существующий релиз board с портом `8080`, затем проверьте релиз, rollout и реальный HTTP-ответ `signalrail`; статус deployed в Helm сам по себе не доказывает здоровье приложения.


      ## Попробуйте


      Откройте лабораторию **helm**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Превратятся ли [a, b] и более поздний [c] в [a, b, c]?


      ```bash

      cd ~/lab/examples/values

      ls chart

      cat base.yaml override.yaml

      bash run.sh

      cat merged.yaml

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Итоговый список — [c]. Проверка читает реальный YAML и проверяет входы string, JSON и file.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Wykres renderuje szablony z połączonego values. Późniejsze pliki zastępują wcześniejsze; listy są zastępowane, a nie rozszerzane element po elemencie. --set-string, --set-json i --set-file wyrażają różne formularze wejściowe.


      W zadaniu 082 sprawdź wyrenderowane polecenie i efektywną wartość chartu. Zaktualizuj istniejące wydanie board z portem `8080`, a następnie sprawdź wydanie, rollout i rzeczywistą odpowiedź HTTP `signalrail`; sam status deployed w Helm nie dowodzi zdrowia aplikacji.


      ## Wypróbuj


      Otwórz laboratorium **helm** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy [a, b] plus późniejsza lista [c] stanie się [a, b, c]?


      ```bash

      cd ~/lab/examples/values

      ls chart

      cat base.yaml override.yaml

      bash run.sh

      cat merged.yaml

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Wyrenderowana lista to [c]. Kontrola odczytuje aktualnie wyrenderowany YAML, a także weryfikuje wejścia string, JSON i file.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Un chart representa plantillas de values fusionadas. Los archivos posteriores anulan los archivos anteriores; las listas se reemplazan en lugar de ampliarse elemento por elemento. --set-string, --set-json y --set-file expresan diferentes formas de entrada.


      En el ejercicio 082, inspecciona el comando renderizado y el valor efectivo del chart. Actualiza el release board existente con puerto `8080` y verifica el release, el rollout y la respuesta HTTP real `signalrail`; el estado deployed de Helm por sí solo no demuestra la salud de la aplicación.


      ## Pruébalo


      Abra el **helm Lab** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿[a, b] más la lista posterior [c] se convertirán en [a, b, c]?


      ```bash

      cd ~/lab/examples/values

      ls chart

      cat base.yaml override.yaml

      bash run.sh

      cat merged.yaml

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. La lista renderizada es [c]. La verificación lee el YAML real representado y también verifica la cadena, el JSON y las entradas de archivos.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh`, luego `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Ein chart rendert Vorlagen aus dem zusammengeführten values. Spätere Dateien überschreiben frühere Dateien; Listen werden Element für Element ersetzt und nicht erweitert. --set-string, --set-json und --set-file drücken unterschiedliche Eingabeformen aus.


      Prüfe in Aufgabe 082 den gerenderten Befehl und den effektiven Chart-Wert. Aktualisiere das bestehende Board-Release mit Port `8080` und prüfe Release, Rollout und tatsächliche HTTP-Antwort `signalrail`; der Helm-Status deployed allein belegt keine Anwendungsgesundheit.


      ## Probieren Sie es aus


      Öffnen Sie das **helm Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Wird [a, b] plus die spätere Liste [c] zu [a, b, c]?


      ```bash

      cd ~/lab/examples/values

      ls chart

      cat base.yaml override.yaml

      bash run.sh

      cat merged.yaml

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Die gerenderte Liste ist [c]. Die Prüfung liest tatsächlich gerenderte YAML und überprüft außerdem Zeichenfolgen, JSON und Dateieingaben.


      ## Beobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-values
helm-8:
  profile: helm
  example: releases
  source_hash: 13b7edb4e6eb04aa96ab15622cfc19fc7cab0f9ca0b7186e3a3fb2436eba20ea
  content:
    en: 'Helm records release revisions. An upgrade applies new rendered resources; rollback applies an older desired state and records a new revision. Waiting for readiness and restoring a failed upgrade are explicit policies. External data is not automatically rolled back.


      In quest 067, inspect release history, effective values and rendered readiness before upgrading the same release with `readinessPort=8080`. Preserve the Deployment identity and image; verify the new revision, readiness and real `north-67` response. A successful Helm operation alone is not application health.


      ## Try it


      Open the **helm Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** After install, upgrade and rollback to revision 1, will the current revision number become 1 again?


      ```bash

      cd ~/lab/examples/releases

      cat chart/values.yaml

      bash run.sh

      helm history demo -n lab-helm

      bash check.sh

      ```


      > [!question]- Expected result

      > No. A successful rollback creates revision 3. The second check deliberately fails an image upgrade and verifies the restored Deployment.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Helm хранит ревизии релиза. Upgrade применяет новые ресурсы, rollback применяет прежнее желаемое состояние и создаёт новую ревизию. Ожидание готовности и возврат при отказе задаются явно. Внешние данные автоматически не откатываются.


      В квесте 067 изучите историю релиза, действующие values и отрендеренную readiness перед upgrade того же релиза с `readinessPort=8080`. Сохраните идентичность Deployment и образ; проверьте новую revision, готовность и реальный ответ `north-67`. Успех операции Helm сам по себе не доказывает здоровье приложения.


      ## Попробуйте


      Откройте лабораторию **helm**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** После install, upgrade и rollback к ревизии 1 текущий номер снова станет 1?


      ```bash

      cd ~/lab/examples/releases

      cat chart/values.yaml

      bash run.sh

      helm history demo -n lab-helm

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Успешный rollback создаёт ревизию 3. Затем проверка намеренно ломает image upgrade и проверяет восстановленный Deployment.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Helm rejestruje wersje wersji. upgrade stosuje nowe renderowane zasoby; rollback stosuje starszy żądany stan i rejestruje nową wersję. Oczekiwanie na gotowość i przywracanie uszkodzonego upgrade to wyraźne zasady. Dane zewnętrzne nie są automatycznie przywracane.


      W zadaniu 067 sprawdź historię wydania, efektywne values i wyrenderowaną readiness przed upgrade tego samego wydania z `readinessPort=8080`. Zachowaj tożsamość Deploymentu i obraz; sprawdź nową revision, gotowość i rzeczywistą odpowiedź `north-67`. Sam sukces operacji Helm nie dowodzi zdrowia aplikacji.


      ## Wypróbuj


      Otwórz laboratorium **helm** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy po install, upgrade i rollback do wersji 1 bieżący numer wersji ponownie zmieni się na 1?


      ```bash

      cd ~/lab/examples/releases

      cat chart/values.yaml

      bash run.sh

      helm history demo -n lab-helm

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Pomyślne wykonanie rollback powoduje utworzenie wersji 3. Druga kontrola celowo kończy się niepowodzeniem image upgrade i weryfikuje przywrócony Deployment.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Revisiones de lanzamiento de registros Helm. Un upgrade aplica nuevos recursos renderizados; rollback aplica un estado deseado anterior y registra una nueva revisión. Esperar a que esté listo y restaurar un upgrade fallido son políticas explícitas. Los datos externos no se revierten automáticamente.


      En el ejercicio 067, inspecciona el historial del release, los values efectivos y la readiness renderizada antes de actualizar el mismo release con `readinessPort=8080`. Conserva la identidad del Deployment y la imagen; verifica la nueva revisión, disponibilidad y respuesta real `north-67`. Una operación Helm exitosa por sí sola no demuestra la salud de la aplicación.


      ## Pruébalo


      Abra el laboratorio **helm** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** Después de install, upgrade y rollback hasta la revisión 1, ¿el número de revisión actual volverá a ser 1?


      ```bash

      cd ~/lab/examples/releases

      cat chart/values.yaml

      bash run.sh

      helm history demo -n lab-helm

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. Un rollback exitoso crea la revisión 3. La segunda verificación falla deliberadamente en una imagen upgrade y verifica el Deployment restaurado.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh`, luego `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Helm zeichnet Versionsrevisionen auf. Ein upgrade wendet neue gerenderte Ressourcen an; rollback wendet einen älteren gewünschten Status an und zeichnet eine neue Revision auf. Das Warten auf die Bereitschaft und das Wiederherstellen eines ausgefallenen upgrade sind explizite Richtlinien. Externe Daten werden nicht automatisch zurückgesetzt.


      Prüfe in Aufgabe 067 Release-Historie, effektive Values und gerenderte Readiness vor dem Upgrade desselben Releases mit `readinessPort=8080`. Erhalte Deployment-Identität und Image; prüfe neue Revision, Bereitschaft und tatsächliche Antwort `north-67`. Eine erfolgreiche Helm-Operation allein belegt keine Anwendungsgesundheit.


      ## Probieren Sie es aus


      Öffnen Sie das **helm Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Wird die aktuelle Revisionsnummer nach install, upgrade und rollback zu Revision 1 wieder 1?


      ```bash

      cd ~/lab/examples/releases

      cat chart/values.yaml

      bash run.sh

      helm history demo -n lab-helm

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Ein erfolgreicher rollback erstellt Revision 3. Die zweite Prüfung lässt ein Image upgrade absichtlich fehlschlagen und überprüft das wiederhergestellte Deployment.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann mit `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-releases
cicd-gitops-3:
  profile: gitops
  example: sync
  source_hash: 2b0669e4c37ceb01dad06dd24aee99c4ff73151e7787ccad94648492a58639bf
  content:
    en: 'Repo-server renders the chosen Git revision. The application controller compares desired and live objects, then performs sync. Phases order hooks before ordinary resources; waves order work inside a phase. A final Synced label alone does not prove the order.


      In quest 050, first recover the release-candidate ConfigMap commit onto local and remote `main` while preserving the baseline ancestor and a clean worktree. Then correct the Argo Application source path to `manifests`. Compare the remote commit with the controller''s synced revision, confirm its tracked board is healthy, and request `north-50`; a manual live edit is not Git delivery.


      ## Try it


      Open the **gitops Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Can a normal resource in wave -1 run before an unfinished PreSync hook?


      ```bash

      cd ~/lab/examples/sync

      bash run.sh

      source ~/lab/platform.env

      kubectl -n "$LAB_NAMESPACE" get application lab-guide

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The check compares actual completion and creation timestamps, then checks Deployment readiness.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Repo-server рендерит выбранную ревизию Git. Application controller сравнивает desired и live, затем выполняет sync. Фазы ставят hooks перед обычными ресурсами, waves задают порядок внутри фазы. Одна итоговая отметка Synced не доказывает порядок.


      В квесте 050 сначала перенесите commit ConfigMap из release-candidate в локальную и удаленную `main`, сохранив baseline как предка и чистый worktree. Затем исправьте source path Argo Application на `manifests`. Сравните удаленный commit с синхронизированной revision контроллера, проверьте здоровье отслеживаемого board и ответ `north-50`: ручное изменение живого объекта не является доставкой через Git.


      ## Попробуйте


      Откройте лабораторию **gitops**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Может ли обычный ресурс wave -1 обойти незавершённый PreSync hook?


      ```bash

      cd ~/lab/examples/sync

      bash run.sh

      source ~/lab/platform.env

      kubectl -n "$LAB_NAMESPACE" get application lab-guide

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Проверка сравнивает фактические времена завершения и создания, затем готовность Deployment.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Repo-server renderuje wybraną wersję Git. Kontroler aplikacji porównuje obiekty desired i live, a następnie wykonuje sync. Fazy ​​porządkują hooks przed zwykłymi zasobami; waves zlecenie pracy w fazie. Sama ostateczna etykieta Synced nie potwierdza kolejności.


      W zadaniu 050 najpierw przenieś commit ConfigMap z release-candidate do lokalnej i zdalnej `main`, zachowując baseline jako przodka i czysty worktree. Następnie popraw source path Argo Application na `manifests`. Porównaj zdalny commit z zsynchronizowaną revision kontrolera, sprawdź zdrowie śledzonego board i odpowiedź `north-50`; ręczna zmiana żywego obiektu nie jest dostarczeniem przez Git.


      ## Wypróbuj


      Otwórz laboratorium **gitops** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy normalny zasób w wave -1 może działać przed niedokończonym PreSync hook?


      ```bash

      cd ~/lab/examples/sync

      bash run.sh

      source ~/lab/platform.env

      kubectl -n "$LAB_NAMESPACE" get application lab-guide

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Kontrola porównuje rzeczywiste znaczniki czasu ukończenia i utworzenia, a następnie sprawdza gotowość Deployment.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Repo-server representa la revisión Git elegida. El application controller compara desired y objetos en vivo, luego realiza sync. Orden de fases hooks antes que recursos ordinarios; Trabajo de orden waves dentro de una fase. Una etiqueta final Synced por sí sola no prueba el pedido.


      En el ejercicio 050, primero recupera el commit del ConfigMap de release-candidate en `main` local y remoto, conservando baseline como ancestro y el worktree limpio. Después corrige el source path de Argo Application a `manifests`. Compara el commit remoto con la revisión sincronizada del controlador, confirma que el board rastreado esté sano y solicita `north-50`; editar el objeto activo a mano no es entrega por Git.


      ## Pruébalo


      Abra el laboratorio **gitops** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿Se puede ejecutar un recurso normal en wave -1 antes que un PreSync hook sin terminar?


      ```bash

      cd ~/lab/examples/sync

      bash run.sh

      source ~/lab/platform.env

      kubectl -n "$LAB_NAMESPACE" get application lab-guide

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. La verificación compara las marcas de tiempo reales de finalización y creación y luego verifica que Deployment esté listo.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh` y luego con `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Repo-server rendert die ausgewählte Git-Revision. Der application controller vergleicht desired und Live-Objekte und führt dann sync aus. Phasenordnung hooks vor gewöhnlichen Ressourcen; waves Auftragsarbeit innerhalb einer Phase. Ein abschließendes Synced-Etikett allein beweist die Bestellung noch nicht.


      Übernimm in Aufgabe 050 zuerst den ConfigMap-Commit aus release-candidate auf lokales und entferntes `main`; erhalte baseline als Vorfahren und einen sauberen Worktree. Korrigiere dann den Source-Pfad der Argo Application auf `manifests`. Vergleiche den entfernten Commit mit der synchronisierten Controller-Revision, prüfe das verfolgte Board auf Gesundheit und frage `north-50` ab; eine manuelle Änderung des Live-Objekts ist keine Git-Auslieferung.


      ## Probieren Sie es aus


      Öffnen Sie das **gitops Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und prüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Kann eine normale Ressource in wave -1 vor einer unvollendeten Ressource in PreSync hook ausgeführt werden?


      ```bash

      cd ~/lab/examples/sync

      bash run.sh

      source ~/lab/platform.env

      kubectl -n "$LAB_NAMESPACE" get application lab-guide

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Die Prüfung vergleicht die tatsächlichen Fertigstellungs- und Erstellungszeitstempel und überprüft dann die Deployment-Bereitschaft.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-sync
cicd-gitops-8:
  profile: gitops
  example: drift
  source_hash: c8f5061dd19632351f0743b81abe156f3f80528fba2c0d8df768c022bd6774fd
  content:
    en: 'Self-heal reconciles a live edit back to Git. Prune allows deletion of managed objects removed from Git. These are separate controls: observing a new revision or correcting a value does not prove that deletion is enabled.


      ## Try it


      Open the **gitops Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Will selfHeal=true alone remove a ConfigMap deleted from Git?


      ```bash

      cd ~/lab/examples/drift

      bash run.sh

      source ~/lab/platform.env

      kubectl -n "$LAB_NAMESPACE" get application lab-guide -o yaml

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The ConfigMap remains with prune disabled, then disappears when prune is explicitly enabled.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Self-heal возвращает ручное изменение к Git. Prune разрешает удаление управляемых объектов, исчезнувших из Git. Это разные настройки: новая ревизия и исправленное значение ещё не доказывают разрешение удаления.


      ## Попробуйте


      Откройте лабораторию **gitops**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Удалит ли один selfHeal=true ConfigMap, исчезнувший из Git?


      ```bash

      cd ~/lab/examples/drift

      bash run.sh

      source ~/lab/platform.env

      kubectl -n "$LAB_NAMESPACE" get application lab-guide -o yaml

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. При выключенном prune ConfigMap сохраняется и исчезает после явного включения prune.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Self-heal uzgadnia edycję na żywo z powrotem do Git. Prune, umożliwiając usuwanie zarządzanych obiektów usuniętych z Git. Są to odrębne kontrole: zaobserwowanie nowej wersji lub poprawienie wartości nie oznacza, że ​​możliwe jest usunięcie.


      ## Wypróbuj


      Otwórz laboratorium **gitops** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy samo selfHeal=true usunie ConfigMap usunięte z Git?


      ```bash

      cd ~/lab/examples/drift

      bash run.sh

      source ~/lab/platform.env

      kubectl -n "$LAB_NAMESPACE" get application lab-guide -o yaml

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. ConfigMap pozostaje przy wyłączonym prune, a następnie znika, gdy prune jest jawnie włączone.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Self-heal reconcilia una edición en vivo con Git. Prune permite la eliminación de objetos administrados eliminados de Git. Estos son controles separados: observar una nueva revisión o corregir un valor no prueba que la eliminación esté habilitada.


      ## Pruébalo


      Abra el laboratorio **gitops** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿El selfHeal=true por sí solo eliminará un ConfigMap eliminado de Git?


      ```bash

      cd ~/lab/examples/drift

      bash run.sh

      source ~/lab/platform.env

      kubectl -n "$LAB_NAMESPACE" get application lab-guide -o yaml

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. El ConfigMap permanece con prune deshabilitado y luego desaparece cuando prune se habilita explícitamente.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh` y luego con `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Self-heal gleicht eine Live-Bearbeitung wieder mit Git ab. Prune ermöglicht das Löschen verwalteter Objekte, die aus Git entfernt wurden. Hierbei handelt es sich um separate Kontrollen: Das Beobachten einer neuen Revision oder das Korrigieren eines Werts beweist nicht, dass das Löschen aktiviert ist.


      ## Probieren Sie es aus


      Öffnen Sie das **gitops Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Wird selfHeal=true allein einen ConfigMap entfernen, der aus Git gelöscht wurde?


      ```bash

      cd ~/lab/examples/drift

      bash run.sh

      source ~/lab/platform.env

      kubectl -n "$LAB_NAMESPACE" get application lab-guide -o yaml

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Der ConfigMap bleibt bei deaktiviertem prune bestehen und verschwindet dann, wenn prune explizit aktiviert wird.


      ## Beobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-drift
