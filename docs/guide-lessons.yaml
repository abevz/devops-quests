    ru: 'Имя Service разрешается в виртуальный адрес. Selector и готовые EndpointSlice определяют адреса подов для трафика. Успешный DNS сам по себе не доказывает наличие рабочего backend.


      ### Селектор Service и готовые endpoints {#arrivals-ready-endpoint}


      В квесте 004 сравните селектор Service `arrivals` с метками существующих Pod. Готовый Pod попадёт в endpoints этого Service, когда селектор совпадёт с его метками. Используйте `kubectl get pods --show-labels` и `kubectl get service arrivals -o yaml`. После правки найдите готовый endpoint в EndpointSlice с меткой `kubernetes.io/service-name=arrivals`.


      В квесте 120 сохраните исходную идентичность PVC, восстанавливая selector headless Service и ограниченный egress клиента. DNS и TCP-доступ к shelf требуют разных разрешений; namespace и Pod selectors для DNS должны быть в одном peer. Проверьте ordinal DNS и ответ ledger отдельно от UID PVC.


      В задании 118 проследите выбор Service через реальную принадлежность EndpointSlice, идентичность и адрес целевого Pod и интерфейс приложения. Готовый endpoint всё ещё может объявлять неверный порт назначения. Сравните прямой трафик к Pod и сохранённый Service VIP, прежде чем обвинять реализацию пересылки. Ограниченная запись диагноза не заменяет полный разбор инцидента; текущее состояние API и трафик не доказывают историю правок и не оправдывают изменение правил узла или глобального DNS.


      В квесте 119 egress policy выбирает Pod клиента. Namespace и Pod selectors в одном peer объединяются; отдельные peers — альтернативы, а разрешения политик складываются. Разрешите указанные порты DNS UDP/TCP и TCP board без более широких политик. Проверьте DNS и разрешенный ответ board, отказ запроса к closed и успешный контрольный запрос от board; один отказ не доказывает причину.


      В задании 062 выбор целевых Pod и принадлежность разрешённых отправителей — отдельные связи. Политика может сохранять нужную границу, хотя запрашивающая нагрузка ей уже не соответствует. Метка текущего Pod и шаблон Deployment имеют разные сроки жизни. Сопоставьте желаемые метки и текущие принадлежащие нагрузке Pod, не расширяя исходную входящую границу; разрешённый и запрещённый запросы — независимые контрольные наблюдения. Сохранённые идентичности объектов и предоставленные образы удерживают исправление в исходной топологии.


      В квесте 110 сначала разрешите `station.internal` в адрес частного Service контроллера, затем проверяйте HTTP. Проверьте заданный class Ingress, host, путь `/` типа Prefix и backend `board:8080`: правильный Host должен вернуть `north-110`, запрос с неправильным Host — завершиться ошибкой. Успех DNS не доказывает маршрутизацию, а одна ошибка запроса не определяет ее причину.


      В квесте 106 ClusterIP, headless DNS и NodePort дают разные пути к одним выбранным Pod. Исправьте selector каждого Service на `app: board`, сохранив записанные UID, type, IP и порядок портов. Проверьте три имени Service на порту `8080` и NodePort частного узла (не менее `30000`): каждый должен вернуть `north-106`. Проверьте полный IP Pod в ответе headless DNS и дождитесь согласования.


      В квесте 107 контроллер Ingress направляет host и path на порт Service. Используйте заданный частный class, host `station.internal`, путь `/` типа Prefix и backend `board:8080`. Проверьте URL контроллера с правильным и неправильным заголовком Host: первый должен вернуть `north-107`, второй — завершиться ошибкой. Одна ошибка не доказывает ее причину.


      ### Целевой порт Service relay {#relay-service-port}


      В квесте 030 Service relay использует targetPort: web, но worker объявляет порт с именем http на 8080. Готовность Deployment не исправляет эту связь. Сравните targetPort с именем порта контейнера и готовыми EndpointSlice, затем запросите http://relay:8080/ из worker; ожидается signalrail. Ошибки DNS, exec или HTTP также мешают проверке.


      ### Маршрутизация Service board {#maintenance-board-service}


      В квесте 040 сравните Service board с шаблоном Pod board: селектор app=board и все дополнительные метки селектора должны совпадать. Ровно один TCP-порт 8080 должен разрешать targetPort в порт контейнера 8080, включая допустимое имя порта. Несовпадение или нечитаемые данные API/JSON/порта дают service. Если диагностики Service нет, сначала проверьте каталог и запуск Python/dq_check.


      ### Содержимое board через Service {#maintenance-board-http}


      В квесте 040 исходный worker обслуживает retired. После публикации north-40 запросите http://board:8080 из работающих Running Pod этого Deployment без отметки удаления. Правильная схема Service сама по себе не доказывает ответ. Отсутствие такого Pod, ошибки API/exec/HTTP или старое содержимое дают http. Ошибка каталога/Python/модуля до запуска наблюдателя даёт внешний fallback.


      ### Selector Service и владельцы готовых endpoints {#progressive-service-targets}


      Публичный Service может отсутствовать либо не выбирает готовые Pod активного исходного Deployment либо недоступен: selector мог остаться на производителе после переключения, endpoints пусты или посторонние либо неверны порт и тип. Для публичного порта нужна ровно одна запись TCP у selector-based ClusterIP Service. Непустой selector должен совпадать с метками активного Deployment. Нужен хотя бы один готовый endpoint, принадлежащий Service и указывающий только на готовые Pod активного исходного Deployment через UID ReplicaSet. Одни метки не подтверждают владельца; при переключении выберите резерв и сохраните производителя. `kubectl get services,endpointslices,pods -o yaml`.


      ### Фактическая публичная запись JSON {#progressive-public-record}


      Публичная HTTP-публикация отличается от исходной записи либо недоступна: Service может вести к другой нагрузке, worker выдаёт другой каталог или старые данные либо наблюдение HTTP/JSON завершилось ошибкой. Сравните всю публикацию JSON с исходной записью, включая route и producer_id. Запрос идёт к публичному пути Service из активного готового Pod: локальный файл или новая идентичность публикации не подтверждают публичный результат. Ошибки JSON, HTTP и exec также имеют маркер публикации.


      ### Ограниченные ingress-селекторы и порты {#isolation-bounded-ingress-contract}


      Сохранённая ingress-политика не задаёт только TCP-доступ dispatcher на 8080 либо наблюдение не удалось: причиной могут быть выданный порт 9090, более широкий selector или правило, неоднозначные именованные порты или недоступные данные API. Защищаемый selector эквивалентен app=board, каждый источник — role=dispatcher в том же namespace, единственное направление — Ingress. Все ограниченные TCP-потоки разрешаются в 8080. Именованный порт находится ровно один раз в каждом неудаляемом Pod board и совпадает между ними. Сначала исправьте сохранённую политику, исходно задающую 9090, затем проверяйте вызывающую нагрузку. `kubectl get networkpolicy board-ingress -o yaml; kubectl get pods -l app=board -o yaml`.


      ### Сохранение политики и идентичностей нагрузок {#isolation-original-policy-and-workloads}


      Изменился UID исходной политики или Deployment либо образ worker отличается от выданной ссылки или digest: пересоздание объектов или замена приложения нарушают сохраняемые идентичности.  `cat isolation-contract.json; kubectl get networkpolicy board-ingress -o yaml; kubectl get deployments,pods -o yaml`.


      ### Желаемые метки вызывающей нагрузки {#isolation-desired-caller-membership}


      Шаблон Deployment dispatcher не выбран ingress-peer сохранённой политики: выданный role=retired или изменение метки только живого Pod оставляют будущие Pod вне разрешённой группы.  `kubectl get deployment dispatcher -o yaml`.


      ### Текущие Pod вызывающей нагрузки {#isolation-current-caller-observation}


      Текущие принадлежащие dispatcher Pod отсутствуют, не готовы или вне разрешённого peer либо наблюдение не удалось: незавершённый rollout, старые метки Pod, отсутствующие защищённые объекты и данные или ошибки API и лимита времени мешают проверке. Исправьте шаблон Pod dispatcher под сохранённый peer и дождитесь rollout вместо старых Pod. Проверка следует controller UID Deployment и ReplicaSet по всем принадлежащим ReplicaSet и требует непустой набор неудаляемых незавершённых Pod, каждый Running, Ready и выбран политикой. Изменение одного живого Pod не исправляет желаемый шаблон. `kubectl get pods,replicasets --show-labels; kubectl rollout status deployment/dispatcher --timeout=10s`.


      ### Граница одной действующей политики {#isolation-single-effective-policy}


      Namespace не сообщает ровно одну NetworkPolicy либо список не прочитан: создание второй политики вместо исправления сохранённой меняет суммарный набор разрешённых соединений.  `kubectl get networkpolicy -o yaml`.


      ### Ответ Service разрешённому вызывающему {#isolation-permitted-service-response}


      Запрос dispatcher не вернул north-62 либо exec и HTTP завершились ошибкой: текущие метки ещё не соответствуют разрешённому peer, политика использует другой порт либо Service и нагрузка board недоступны.  `kubectl exec deployment/dispatcher -- wget -qO- -T 3 http://board:8080`.


      ### Неожиданный успех исключённого вызывающего {#isolation-excluded-caller-access}


      Запрос исключённого visitor завершился успешно: более широкие ingress-разрешения или метки, включающие visitor в разрешённую группу, допускают нежелательное соединение с board.  `kubectl exec deployment/visitor -- wget -qO- -T 2 http://board:8080`.


      ## Попробуйте


      Откройте лабораторию **kubernetes**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Может ли Service существовать без подходящих подов?


      ```bash

      cd ~/lab/examples/networking

      bash run.sh

      kubectl -n lab-networking get svc,endpointslice

      kubectl -n lab-networking get pods --show-labels

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Да. Неверный selector оставляет Service без endpoints. Исправление направляет тот же Service к готовому web-поду.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

