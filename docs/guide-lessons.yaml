      Приватная доставка объединяет скрытие вывода, доступ получателя и изоляцию других учётных записей. Владелец, группы и фактические полномочия оператора определяют допустимые переходы метаданных; совместное изменение содержимого и владельца может не пройти при ограниченных полномочиях. Проверяйте реальную аутентификацию и запрет чтения и записи другим учётным записям без вывода секретных байтов. Одни ограниченные права не доказывают доступ нужного приложения.


