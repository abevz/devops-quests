    es: 'Usa evidencias disponibles para la identidad que actúa. Una lista global denegada describe permisos del observador, no el estado de un Pod o volumen concreto. Definiciones, estados, eventos y referencias sanas del namespace pueden mostrar solicitudes, ajustes de claims y datos de aplicación. Separa una vía de observación no disponible del fallo real y mantén la investigación dentro de la autoridad proporcionada.


