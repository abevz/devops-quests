ansible-12:
  profile: ansible
  example: reuse
  source_hash: 97c5ce0c84fdcf3ba98691dd61c2a920985646fcff756aa91e305a49bee7bf44
  content:
    en: 'Static imports expand tasks earlier; dynamic includes choose tasks during execution. Tags on an include select the include statement, so untagged children can still be skipped. Roles package tasks with defaults, handlers and templates under a shared contract.


      In quest 046, an `inspect` tag on the delivery copy task would change a healthy banner during an inspection. Keep the copy task tagged only `deploy` and the stat task tagged `inspect`. List selected tasks, run the inspection and verify its recap plus the unchanged `north-46` banner on all three targets; a tag name alone does not make a task read-only. Keep one play without inherited play tags and the two supplied tasks; do not add pre/post tasks, roles or handlers.


      For quest 058: A composed role must satisfy prerequisites for each caller context. Role inputs and dependency execution have different scopes; one successful default invocation does not establish that another parameterized call can construct its output or converge. Check default delivery and replay the declared caller cases in an isolated local play without privilege escalation. Compare both outputs and preserved data, then repeat the same application and require a recap without changes.


      ### Record a real inspection {#inspection-evidence}


      inspection.log is missing or empty; the inspection may not have been recorded from ~/quest, or failed before producing output. `ansible-playbook --tags inspect rollout.yml > inspection.log`.


      ### Read-only tags and snapshots {#inspection-unchanged}


      Inspection changed a banner or could not verify and restore its snapshot; inspect may still select copy, or SSH, playbook execution, time budget or cleanup may have failed. List the tasks selected by --tags inspect before running them. The initial play tags both copy and stat as inspect; copy can replace data and permissions. The live check compares bytes, mode, owner, timestamps and symlink target before and after the selection on all hosts. A nonzero run or failed SSH observation/restoration also fails this check; it does not prove that a tag was wrong.


      ### Recap is a separate observation {#inspection-recap}


      The live inspection failed or its recap could not be verified; playbook errors, SSH failures, timeouts, restoration errors or ambiguous recap fields may prevent a complete result. app1 lacks an unambiguous recap with changed=0, unreachable=0 and failed=0; mutating selected tasks, SSH failures or missing/malformed counters may explain it. The probe runs the actual inspect selection; inspection.log alone is not its recap source. Each of app1, app2 and app3 needs numeric zero changed/unreachable/failed counters; missing hosts or counters are not zero. JSON/runner/text recaps are parsed, but duplicate or ambiguous fields cannot establish success. Compare the actual unchanged files separately from reported changed=0.


      ### Inspection observer startup {#inspection-inputs}


      The unchanged-banner probe stopped before its Python diagnostics; ~/quest, Python startup or required probe inputs may be unavailable. The recap probe stopped before its Python diagnostics; ~/quest, Python or the dq_check recap helper may be unavailable before inspection runs. The shell group failed without a per-host diagnostic; observation may have been interrupted before the host results were reported. The content groups handle namespace expansion separately for each host: a missing DQ_NAMESPACE normally emits banner_1, banner_2 and banner_3, rather than the reserved no-marker fallback. Restore workstation inputs and distinguish observer interruption from a verified file mismatch.


      ### Retained banners on every host {#inspection-banner-content}


      app1 did not return north-46 from its banner or SSH failed; a selected deploy task may have overwritten the retained file, or host access is unavailable. `ssh -n -o BatchMode=yes -p 2222 root@app1-"${DQ_NAMESPACE#dq-}" ''cat /srv/site/banner.txt''`. A missing or incorrect DQ_NAMESPACE can also prevent the per-host SSH observation. Repeat the check for app2 and app3; all three banners must retain north-46.


      ### Dependencies for repeated role calls {#role-repeated-caller-entry}


      The role replay failed to execute successfully; the banner role may omit its base dependency, create the wrong directory, suppress a repeated dependency, or fail under the unprivileged local caller. The supplied contract calls roles/banner twice in one local unprivileged play with different install_root and banner_route values, then repeats the entire play. A base dependency must build each caller directory: allow_duplicates: false can suppress the second dependency even after adding it to banner metadata. Keep the default fleet result while making each caller independent. `cat role-contract.json roles/banner/meta/main.yml roles/base/meta/main.yml; ansible-playbook rollout.yml --list-tasks`.


      ### Caller-specific paths and values {#role-caller-specific-output}


      A caller output is missing or contains the wrong route; hardcoded /srv/routes or north-ready, or a skipped dependency on the second call, may ignore install_root and banner_route.  `cat roles/banner/defaults/main.yml roles/base/tasks/main.yml roles/banner/tasks/main.yml`.


      ### Preserve data outside the owned output {#role-preserve-caller-data}


      The retained control file or existing data inside a caller directory changed or disappeared; broad cleanup or replacing an entire output directory can erase data outside the role-owned current file.  `cat roles/base/tasks/main.yml roles/banner/tasks/main.yml`.


      ### Converge on the second application {#role-second-run-convergence}


      The second replay did not report localhost with zero changed, failed and unreachable counters; unconditional rewrites, non-idempotent tasks or failed host execution may prevent a converged second application. The isolated caller replay requires a localhost recap on its second application, with changed=0, failed=0 and unreachable=0 for every reported host. Successful default fleet runs are useful observations but do not replace the two distinct caller cases. A malformed recap belongs to the observation failure instead. `ansible-playbook rollout.yml; ansible-playbook rollout.yml`.


      ### Replay within the observation deadline {#role-bounded-replay}


      The role replay subprocess exceeded the remaining observation deadline; slow tasks or waiting for unavailable external services can exhaust the two-run probe budget.  `cat roles/base/tasks/main.yml roles/banner/tasks/main.yml`.


      ### Observe caller outputs and recap {#role-replay-observation}


      The role replay could not be observed; missing protected contract or caller directories, unreadable output, a malformed recap, tool errors or an exhausted observation budget can prevent evaluating its result.  `cat role-contract.json; command -v ansible-playbook`.


      ### Fleet and role probe startup {#role-probe-startup}


      The combined fleet/role probe stopped without a detailed marker; a missing workstation directory, Python or its module, or an interrupted bounded SSH group, may prevent reaching the role replay.  `command -v python3; command -v ssh`.


      ### Retain default fleet delivery {#role-default-fleet-result}


      app1 does not provide north-ready in /srv/routes/current; a missing base dependency or failed fleet delivery can leave the default route absent, and SSH/namespace failures can also prevent observing it.  `ansible fleet -m ansible.builtin.command -a "cat /srv/routes/current"`. Repeat the observation on app2 and app3.


      ## Try it


      Open the **ansible Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Does --tags dynamic necessarily run every task inside a tagged include?


      ```bash

      cd ~/lab/examples/reuse

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The include runs, but its untagged child does not. The static import inherits its tag.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

