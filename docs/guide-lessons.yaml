      ### Причина и наблюдение (069, content_2) {#private-delivery-host-2-content}


      app2 может хранить старый credential либо SSH/чтение файла не прошли; доставьте неизменённое значение credentials.yml в /srv/site/station-token. Выданная copy-задача задаёт mode 644 и отключает no_log. Доставьте оба входа с приватными правами и владельцами-получателями. Исходные программы читают при каждом HTTP-запросе; перезапуск и SIGHUP не нужны. Наблюдайте метаданные без вывода credential. `ssh -n -o BatchMode=yes -p 2222 root@app2-"${DQ_NAMESPACE#dq-}" test -r /srv/site/station-token`


      ### Причина и наблюдение (069, mode_2) {#private-delivery-host-2-mode}


      app2 может сохранять mode 644 из выданной copy-задачи либо stat/SSH не прошли; задайте 600 для /srv/site/station-token, сохраняя доступ своему потребителю. Выданная copy-задача задаёт mode 644 и отключает no_log. Доставьте оба входа с приватными правами и владельцами-получателями. Исходные программы читают при каждом HTTP-запросе; перезапуск и SIGHUP не нужны. Наблюдайте метаданные без вывода credential. `ssh -n -o BatchMode=yes -p 2222 root@app2-"${DQ_NAMESPACE#dq-}" stat -c %a /srv/site/station-token`


      ### Причина и наблюдение (069, content_3) {#private-delivery-host-3-content}


