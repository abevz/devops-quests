    ru: 'Статический import раскрывает задачи заранее, динамический include выбирает их при исполнении. Метка include выбирает само включение, поэтому дочерние задачи без метки могут быть пропущены. Роль объединяет задачи, defaults, handlers и шаблоны с общим контрактом.


      В квесте 046 тег `inspect` на задаче доставки copy изменил бы исправный баннер во время проверки. Оставьте у задачи copy только тег `deploy`, а у задачи stat — `inspect`. Выведите выбранные задачи, выполните проверку и проверьте ее recap и неизменный баннер `north-46` на трех машинах: само название тега не делает задачу безопасной для чтения. Сохраните один play без унаследованных тегов и две выданные задачи; не добавляйте pre/post tasks, roles или handlers.


      Для квеста 058: Составная роль должна обеспечивать предпосылки для каждого вызывающего контекста. Входы роли и выполнение зависимостей имеют разные области действия; один успешный вызов по умолчанию не доказывает, что другой вызов с параметрами создаст свой результат и сойдётся. Проверьте обычную доставку и воспроизведите объявленные вызовы в изолированном локальном play без повышения привилегий. Сравните оба результата и сохранённые данные, затем повторите применение и требуйте recap без изменений.


      ### Запись реальной проверки {#inspection-evidence}


      inspection.log отсутствует или пуст: запуск мог не быть записан из ~/quest либо завершился до появления вывода. `ansible-playbook --tags inspect rollout.yml > inspection.log`.


      ### Теги чтения и снимки {#inspection-unchanged}


      Inspection изменил banner либо не смог проверить и восстановить снимок: inspect мог выбрать copy либо произошёл сбой SSH, playbook, лимита времени или очистки. До запуска посмотрите задачи, выбранные --tags inspect. Изначально copy и stat имеют тег inspect; copy может заменить данные и права. Живая проверка сравнивает байты, режим, владельца, время и цель symlink до и после на всех хостах. Ошибка запуска, наблюдения SSH или восстановления тоже даёт сбой и сама по себе не доказывает неверный тег.


      ### Recap как отдельное наблюдение {#inspection-recap}


      Живая проверка завершилась ошибкой либо recap не подтверждён: ошибки playbook, SSH, таймауты, ошибки восстановления или неоднозначные поля recap могут мешать полному результату. У app1 нет однозначного recap с changed=0, unreachable=0 и failed=0: причиной могут быть изменяющие задачи, сбои SSH либо отсутствующие или некорректные счётчики. Проверка сама запускает inspect; inspection.log не служит её источником recap. Для app1, app2 и app3 нужны числовые нули changed/unreachable/failed; отсутствие хоста или счётчика не означает ноль. Разбираются JSON, runner и текстовый recap, но повторяющиеся или неоднозначные поля не подтверждают успех. Отдельно сравните неизменность файлов и заявленный changed=0.


      ### Запуск проверки inspection {#inspection-inputs}


      Проверка неизменности banner остановилась до диагностики Python: ~/quest, запуск Python или входные данные могут быть недоступны. Проверка recap остановилась до диагностики Python: ~/quest, Python или helper dq_check могут быть недоступны до запуска inspection. Группа команд завершилась без диагностики по хостам: наблюдение могло прерваться до сообщения результатов. Группы содержимого раскрывают namespace отдельно для каждого хоста: отсутствие DQ_NAMESPACE обычно даёт banner_1, banner_2 и banner_3, а не резервный fallback без маркера. Восстановите входные данные рабочей станции и отличайте прерванное наблюдение от подтверждённого несовпадения файла.


      ### Сохранённые banner на всех хостах {#inspection-banner-content}


      app1 не вернул north-46 из banner либо SSH завершился ошибкой: выбранная задача deploy могла перезаписать файл либо хост недоступен. `ssh -n -o BatchMode=yes -p 2222 root@app1-"${DQ_NAMESPACE#dq-}" ''cat /srv/site/banner.txt''`. Отсутствующий или неверный DQ_NAMESPACE также может помешать наблюдению по SSH для хоста. Повторите проверку для app2 и app3: все три banner должны сохранить north-46.


      ### Зависимости повторных вызовов роли {#role-repeated-caller-entry}


      Повторное выполнение роли завершилось ошибкой: у banner может отсутствовать зависимость base, создаваться неверный каталог, подавляться повторная зависимость или возникать сбой у локального пользователя без привилегий. Контракт вызывает roles/banner дважды в одном локальном play без привилегий с разными install_root и banner_route, затем повторяет весь play. Зависимость base должна создавать каталог каждого вызова: allow_duplicates: false может подавлять вторую зависимость даже после её добавления в metadata banner. Сохраните результат по умолчанию на хостах и независимость вызовов. `cat role-contract.json roles/banner/meta/main.yml roles/base/meta/main.yml; ansible-playbook rollout.yml --list-tasks`.


      ### Пути и значения каждого вызова {#role-caller-specific-output}


      Выход вызывающего кода отсутствует или содержит другой маршрут: захардкоженные /srv/routes или north-ready либо пропущенная зависимость второго вызова могут игнорировать install_root и banner_route.  `cat roles/banner/defaults/main.yml roles/base/tasks/main.yml roles/banner/tasks/main.yml`.


      ### Сохранение данных помимо результата роли {#role-preserve-caller-data}


      Контрольный файл или существующие данные внутри каталога вызывающего кода изменены либо исчезли: широкая очистка или замена всего каталога может удалить данные помимо принадлежащего роли current.  `cat roles/base/tasks/main.yml roles/banner/tasks/main.yml`.


      ### Сходимость второго применения {#role-second-run-convergence}


      Второй запуск не сообщил localhost с нулевыми changed, failed и unreachable: безусловная перезапись, неидемпотентные задачи или сбой выполнения на хосте могут мешать сходимости. Изолированное выполнение требует recap с localhost во втором применении и changed=0, failed=0, unreachable=0 для каждого указанного хоста. Успешные стандартные запуски полезны для наблюдения, но не заменяют два разных вызова. Некорректный recap относится к сбою наблюдения. `ansible-playbook rollout.yml; ansible-playbook rollout.yml`.


      ### Повторное выполнение в пределах лимита {#role-bounded-replay}


      Процесс повторного выполнения роли превысил оставшееся время: медленные задачи или ожидание недоступных внешних сервисов могут исчерпать лимит проверки двух запусков.  `cat roles/base/tasks/main.yml roles/banner/tasks/main.yml`.


      ### Наблюдение результатов вызовов и recap {#role-replay-observation}


      Не удалось наблюдать выполнение роли: отсутствующий защищённый контракт или каталоги вызовов, нечитаемый результат, некорректный recap, ошибки инструментов или исчерпанное время мешают оценке.  `cat role-contract.json; command -v ansible-playbook`.


      ### Запуск проверки хостов и роли {#role-probe-startup}


      Общая проверка хостов и роли остановилась без подробного маркера: отсутствующий рабочий каталог, Python или модуль либо прерванная SSH-группа с лимитом времени могут мешать запуску роли.  `command -v python3; command -v ssh`.


      ### Сохранение доставки по умолчанию на хосты {#role-default-fleet-result}


      app1 не предоставляет north-ready в /srv/routes/current: отсутствующая зависимость base или сбой доставки могут оставить маршрут по умолчанию отсутствующим; ошибки SSH или namespace также мешают наблюдению.  `ansible fleet -m ansible.builtin.command -a "cat /srv/routes/current"`. Повторите наблюдение на app2 и app3.


      ## Попробуйте


      Откройте лабораторию **ansible**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Обязательно ли --tags dynamic выполняет все задачи внутри include с этой меткой?


      ```bash

      cd ~/lab/examples/reuse

      ls

      cat playbook.yaml

      bash run.sh

      # Inspect the actual outcome.

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Include выполняется, его дочерняя задача без метки — нет. Статический import наследует метку.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

