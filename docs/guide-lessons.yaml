      ### Causa y observación (069, credential_auth) {#private-delivery-observed-auth-response}


      El endpoint devolvió respuesta exitosa/body observado pero inesperado; compare con credential-ready usando token original. Errores HTTP 401/503 usan diagnóstico de observación. La tarea copy suministrada usa mode 644 y desactiva no_log. Entregue ambas entradas con permisos privados y propietario receptor. Los programas originales leen en cada petición HTTP; no requieren reinicio ni SIGHUP. Observe metadatos sin imprimir credential. `python3 -c ''import os,urllib.request,yaml; token=yaml.safe_load(open("credentials.yml"))["station_token"]; host="app1-"+os.environ["DQ_NAMESPACE"][3:]; request=urllib.request.Request("http://"+host+":8081/",headers={"Authorization":"Bearer "+token}); print(urllib.request.urlopen(request,timeout=3).read().decode().strip())''`


      ### Causa y observación (069, consumer_budget) {#private-delivery-bounded-ssh-observer}


      SSH o su observer remoto puede exceder el tiempo restante de subprocess; revise conexión del host y comando de observación. La tarea copy suministrada usa mode 644 y desactiva no_log. Entregue ambas entradas con permisos privados y propietario receptor. Los programas originales leen en cada petición HTTP; no requieren reinicio ni SIGHUP. Observe metadatos sin imprimir credential. `ssh -n -o BatchMode=yes -o ConnectTimeout=3 -p 2222 root@app1-"${DQ_NAMESPACE#dq-}" true`


