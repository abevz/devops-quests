      Reiniciar un proceso o cambiar UID/grupos/capabilities, comando o programa altera su identidad fijada; entregue archivos a consumidores originales. La tarea copy suministrada usa mode 644 y desactiva no_log. Entregue ambas entradas con permisos privados y propietario receptor. Los programas originales leen en cada petición HTTP; no requieren reinicio ni SIGHUP. Observe metadatos sin imprimir credential. `ssh -n -o BatchMode=yes -p 2222 root@app1-"${DQ_NAMESPACE#dq-}" "ps -eo pid,uid,gid,args"`


