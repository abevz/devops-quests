  source_hash: 0a6090ca1ab8ddbb55297d9aa1d4c1e692166b51d596a74ab19250973ac0c490
  content:
    en: 'State binds resource addresses to managed object identities. A normal plan compares configuration, state and refreshed objects. Editing the file outside OpenTofu creates drift; applying the reviewed plan restores the declared content.


      In quest 071, a valid north state entry already exists while south is absent. Save and inspect a plan with north no-op and south create, preserve the frozen north ID, then verify both files, exact state addresses and the empty final plan.


      In quest 081, work through three independent boundaries: the managed release marker and state, the fleet files and reloaded HTTP services, then the relay''s running `RELEASE` environment and rollout. A later stage cannot establish an earlier stage''s result.


      In quest 030, start with `main.tf` and restore the managed `release.txt` containing `release-30`. Check that `local_file.release` is in state and a fresh plan has no changes. Only then investigate the reader: its `RELEASE` environment must match the marker and the rollout must become ready.


      In quest 026, `original-id` records the existing `rail-worker` container identity. Import that ID into `docker_container.worker`, then unpause the container: import adds a state binding but does not resume a paused process. Verify the state address, compare the live Docker ID and the resource ID from `tofu show -json` with `original-id`, and inspect that the container is running and not paused. These comparisons describe current identity, not a complete history.


      In quest 020, the first stage produces the managed `release.txt` artifact and the root `release` output. Compare the file and output with `release-20`, check that `local_file.release` appears in state, and inspect a detailed plan for exit code 0 before using the artifact in the fleet stage. A correct file alone does not establish the state binding or output.


      In quest 006, `main.tf` already declares `docker_container.worker` with the name `rail-worker`. Apply the configuration in the private bay, then compare `tofu state list` with `docker inspect rail-worker --format ''{{.State.Running}}''`: the state must include `docker_container.worker`, and Docker must report `true`. An address in state alone does not prove the container is running.


      In quest 009, `main.tf` still declares `local_file.notice` with the content `north-ready`; a manual edit changed `notice.txt` outside OpenTofu. Review `tofu plan`, apply the configuration, then check `cat notice.txt`, `tofu state list`, and `tofu plan -input=false -detailed-exitcode -no-color`. Expect `north-ready`, the address `local_file.notice`, and exit code 0 for the final plan.


      In quest 016, keep `local_file.release` and its file content `north-r16`. Change the root output `release` from a string to an object with `route = "north"`, numeric `revision = 16`, and `targets = ["app1", "app2", "app3"]`. Apply, then inspect `tofu output -json release`: JSON should preserve the number and array. Verify `release.txt`, `local_file.release` in state, and a final detailed plan exit code 0.


      ## Try it


      Open the **opentofu Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Does editing the managed file update the HCL declaration?


      ```bash

      cd ~/lab/examples/state

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The next plan proposes reconciliation; apply restores declared.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'State связывает адреса ресурсов с объектами. Обычный plan сопоставляет код, state и прочитанные объекты. Изменение файла вне OpenTofu создаёт дрейф; применение проверенного плана восстанавливает заданное содержимое.


      В квесте 071 запись north в state уже исправна, а south отсутствует. Сохраните и изучите план с north no-op и south create, сохраните зафиксированный ID north, затем проверьте оба файла, точные адреса state и пустой итоговый план.


      В квесте 081 пройдите три независимые границы: управляемый маркер релиза и state, файлы fleet и перезагруженные HTTP-сервисы, затем работающую переменную `RELEASE` relay и rollout. Более поздний этап не доказывает результат предыдущего.


      В квесте 030 начните с `main.tf` и восстановите управляемый `release.txt` с содержимым `release-30`. Проверьте наличие `local_file.release` в state и отсутствие изменений в новом плане. Только затем исследуйте reader: его переменная `RELEASE` должна совпадать с маркером, а rollout — стать готовым.


      В квесте 026 `original-id` хранит идентификатор существующего контейнера `rail-worker`. Импортируйте этот ID в `docker_container.worker`, затем снимите контейнер с паузы: import добавляет связь со state, но не возобновляет приостановленный процесс. Проверьте адрес в state, сравните текущий Docker ID и ID ресурса из `tofu show -json` с `original-id` и убедитесь, что контейнер работает и не приостановлен. Эти сравнения описывают текущую идентичность, а не полную историю.


      В квесте 020 первый этап создает управляемый артефакт `release.txt` и корневой выход `release`. Сравните файл и выход с `release-20`, убедитесь, что в state есть `local_file.release`, и проверьте код выхода подробного plan 0 до использования артефакта на этапе fleet. Сам правильный файл не подтверждает связь со state или значение выхода.


      В квесте 006 файл `main.tf` уже объявляет `docker_container.worker` с именем `rail-worker`. Примените конфигурацию в приватной лаборатории и сравните `tofu state list` с `docker inspect rail-worker --format ''{{.State.Running}}''`: в состоянии должен быть `docker_container.worker`, а Docker должен показать `true`. Сам по себе адрес в состоянии не доказывает, что контейнер работает.


      В квесте 009 `main.tf` по-прежнему объявляет `local_file.notice` с содержимым `north-ready`; ручное изменение изменило `notice.txt` вне OpenTofu. Просмотрите `tofu plan`, примените конфигурацию и проверьте `cat notice.txt`, `tofu state list` и `tofu plan -input=false -detailed-exitcode -no-color`. Ожидаются `north-ready`, адрес `local_file.notice` и код выхода 0 итогового плана.


      В квесте 016 сохраните `local_file.release` и содержимое его файла `north-r16`. Измените корневой выход `release` со строки на объект с `route = "north"`, числовым `revision = 16` и `targets = ["app1", "app2", "app3"]`. Примените изменения и проверьте `tofu output -json release`: JSON должен сохранить число и массив. Проверьте `release.txt`, `local_file.release` в состоянии и код выхода 0 итогового подробного плана.


      ## Попробуйте


      Откройте лабораторию **opentofu**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Изменение управляемого файла обновляет HCL?


      ```bash

      cd ~/lab/examples/state

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Следующий plan предлагает восстановление; apply возвращает declared.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'State wiąże adresy zasobów z tożsamościami obiektów zarządzanych. Normalny plan porównuje konfigurację, state i odświeżone obiekty. Edycja pliku poza OpenTofu powoduje dryft; zastosowanie sprawdzonego plan przywraca zawartość declared.


      W zadaniu 071 poprawny wpis north już istnieje w state, a south brakuje. Zapisz i sprawdź plan z north no-op i south create, zachowaj utrwalone ID north, następnie sprawdź oba pliki, dokładne adresy state i pusty plan końcowy.


      W zadaniu 081 przejdź trzy niezależne granice: zarządzany znacznik wydania i state, pliki fleet i przeładowane usługi HTTP, a następnie działającą zmienną `RELEASE` relay i rollout. Późniejszy etap nie dowodzi wyniku wcześniejszego.


      W zadaniu 030 zacznij od `main.tf` i przywróć zarządzany `release.txt` z zawartością `release-30`. Sprawdź obecność `local_file.release` w state i brak zmian w nowym planie. Dopiero potem zbadaj reader: jego zmienna `RELEASE` ma odpowiadać znacznikowi, a rollout osiągnąć gotowość.


      W zadaniu 026 `original-id` zapisuje identyfikator istniejącego kontenera `rail-worker`. Zaimportuj ten ID do `docker_container.worker`, a następnie wznów kontener: import dodaje powiązanie ze state, lecz nie wznawia wstrzymanego procesu. Sprawdź adres w state, porównaj bieżący ID Dockera i ID zasobu z `tofu show -json` z `original-id` oraz upewnij się, że kontener działa i nie jest wstrzymany. Porównania opisują obecną tożsamość, a nie pełną historię.


      W zadaniu 020 pierwszy etap tworzy zarządzany artefakt `release.txt` i główne wyjście `release`. Porównaj plik i wyjście z `release-20`, sprawdź obecność `local_file.release` w state oraz kod wyjścia 0 szczegółowego planu przed użyciem artefaktu w etapie fleet. Sam poprawny plik nie potwierdza powiązania ze state ani wartości wyjścia.


      W zadaniu 006 plik `main.tf` już deklaruje `docker_container.worker` o nazwie `rail-worker`. Zastosuj konfigurację w prywatnym środowisku i porównaj `tofu state list` z `docker inspect rail-worker --format ''{{.State.Running}}''`: stan musi zawierać `docker_container.worker`, a Docker musi zwrócić `true`. Sam adres w stanie nie dowodzi, że kontener działa.


      W zadaniu 009 `main.tf` nadal deklaruje `local_file.notice` z zawartością `north-ready`; ręczna edycja zmieniła `notice.txt` poza OpenTofu. Przejrzyj `tofu plan`, zastosuj konfigurację, a następnie sprawdź `cat notice.txt`, `tofu state list` i `tofu plan -input=false -detailed-exitcode -no-color`. Oczekuj `north-ready`, adresu `local_file.notice` i kodu wyjścia 0 końcowego planu.


      W zadaniu 016 zachowaj `local_file.release` i zawartość jego pliku `north-r16`. Zmień wyjście główne `release` z ciągu na obiekt z `route = "north"`, liczbowym `revision = 16` i `targets = ["app1", "app2", "app3"]`. Zastosuj zmianę, a następnie sprawdź `tofu output -json release`: JSON powinien zachować liczbę i tablicę. Sprawdź `release.txt`, `local_file.release` w stanie i kod wyjścia 0 końcowego szczegółowego planu.


      ## Wypróbuj


      Otwórz laboratorium **opentofu** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy edycja zarządzanego pliku aktualizuje deklarację HCL?


      ```bash

      cd ~/lab/examples/state

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Następny plan proponuje pojednanie; apply przywraca declared.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'El estado vincula las direcciones de recursos a las identidades de los objetos gestionados. Un plan normal compara la configuración, el estado y los objetos actualizados. Editar el archivo fuera de OpenTofu crea deriva; La aplicación del plan revisado restaura el contenido del declared.


      En el ejercicio 071 ya existe una entrada north válida en state, pero falta south. Guarda e inspecciona un plan con north no-op y south create, conserva el ID congelado de north y verifica ambos archivos, las direcciones exactas en state y el plan final vacío.


      En el ejercicio 081 recorre tres límites independientes: el marcador de versión gestionado y state, los archivos fleet y los servicios HTTP recargados, y después el entorno `RELEASE` activo de relay y el rollout. Una etapa posterior no demuestra el resultado anterior.


      En el ejercicio 030, empieza por `main.tf` y recupera el `release.txt` gestionado con contenido `release-30`. Comprueba que `local_file.release` esté en el state y que un plan nuevo no tenga cambios. Solo entonces investiga el reader: su entorno `RELEASE` debe coincidir con el marcador y el rollout debe quedar listo.


      En el ejercicio 026, `original-id` registra la identidad del contenedor existente `rail-worker`. Importa ese ID en `docker_container.worker` y después reanuda el contenedor: import añade el vínculo con state, pero no reanuda un proceso pausado. Comprueba la dirección en state, compara el ID actual de Docker y el ID del recurso de `tofu show -json` con `original-id`, y verifica que el contenedor esté en ejecución y no pausado. Estas comparaciones describen la identidad actual, no toda su historia.


      En el ejercicio 020, la primera etapa produce el artefacto gestionado `release.txt` y la salida raíz `release`. Compara archivo y salida con `release-20`, comprueba que `local_file.release` aparece en state y que un plan detallado termina con código 0 antes de usar el artefacto en la etapa de fleet. Un archivo correcto por sí solo no confirma el vínculo con state ni la salida.


      En el ejercicio 006, `main.tf` ya declara `docker_container.worker` con el nombre `rail-worker`. Aplica la configuración en el entorno privado y compara `tofu state list` con `docker inspect rail-worker --format ''{{.State.Running}}''`: el estado debe contener `docker_container.worker` y Docker debe mostrar `true`. Una dirección en el estado no demuestra por sí sola que el contenedor esté ejecutándose.


      En el ejercicio 009, `main.tf` sigue declarando `local_file.notice` con el contenido `north-ready`; una edición manual cambió `notice.txt` fuera de OpenTofu. Revisa `tofu plan`, aplica la configuración y comprueba `cat notice.txt`, `tofu state list` y `tofu plan -input=false -detailed-exitcode -no-color`. Espera `north-ready`, la dirección `local_file.notice` y el código de salida 0 del plan final.


      En el ejercicio 016, conserva `local_file.release` y el contenido de su archivo `north-r16`. Cambia la salida raíz `release` de una cadena a un objeto con `route = "north"`, `revision = 16` numérico y `targets = ["app1", "app2", "app3"]`. Aplica y examina `tofu output -json release`: JSON debe conservar el número y el array. Comprueba `release.txt`, `local_file.release` en el estado y el código de salida 0 del plan detallado final.


      ## Pruébalo


      Abra el **opentofu Lab** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿La edición del archivo administrado actualiza la declaración HCL?


      ```bash

      cd ~/lab/examples/state

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. El próximo plan propone la reconciliación; apply restaura declared.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh`, luego `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Der Status bindet Ressourcenadressen an verwaltete Objektidentitäten. Ein normaler plan vergleicht Konfiguration, Status und aktualisierte Objekte. Das Bearbeiten der Datei außerhalb von OpenTofu führt zu Abweichungen. Durch Anwenden des überprüften plan wird der declared-Inhalt wiederhergestellt.


      In Aufgabe 071 existiert bereits ein gültiger North-State-Eintrag, während south fehlt. Speichere und prüfe einen Plan mit north no-op und south create, erhalte die eingefrorene North-ID und prüfe beide Dateien, exakte State-Adressen und den leeren abschließenden Plan.


      Durchlaufe in Aufgabe 081 drei unabhängige Grenzen: verwalteter Release-Marker und State, Fleet-Dateien und neu geladene HTTP-Dienste, dann die laufende `RELEASE`-Umgebung von relay und den Rollout. Eine spätere Phase belegt kein früheres Ergebnis.


      Beginne in Aufgabe 030 mit `main.tf` und stelle die verwaltete `release.txt` mit Inhalt `release-30` wieder her. Prüfe, dass `local_file.release` im State steht und ein neuer Plan keine Änderungen enthält. Untersuche erst danach den Reader: Seine Umgebung `RELEASE` muss zum Marker passen und der Rollout bereit werden.


      In Aufgabe 026 hält `original-id` die Identität des vorhandenen Containers `rail-worker` fest. Importiere diese ID nach `docker_container.worker` und setze den Container anschließend fort: Import ergänzt die State-Bindung, startet aber keinen pausierten Prozess erneut. Prüfe die State-Adresse, vergleiche die aktuelle Docker-ID und die Ressourcen-ID aus `tofu show -json` mit `original-id` und stelle sicher, dass der Container läuft und nicht pausiert ist. Diese Vergleiche beschreiben die aktuelle Identität, nicht ihre gesamte Geschichte.


      In Aufgabe 020 erzeugt die erste Phase das verwaltete Artefakt `release.txt` und die Root-Ausgabe `release`. Vergleiche Datei und Ausgabe mit `release-20`, prüfe `local_file.release` im State und Exit-Code 0 eines detaillierten Plans, bevor du das Artefakt in der Fleet-Phase verwendest. Eine korrekte Datei allein bestätigt weder die State-Bindung noch die Ausgabe.


      In Aufgabe 006 deklariert `main.tf` bereits `docker_container.worker` mit dem Namen `rail-worker`. Wende die Konfiguration in der privaten Umgebung an und vergleiche `tofu state list` mit `docker inspect rail-worker --format ''{{.State.Running}}''`: Der Zustand muss `docker_container.worker` enthalten und Docker muss `true` melden. Eine Adresse im Zustand allein beweist nicht, dass der Container läuft.


      In Aufgabe 009 deklariert `main.tf` weiterhin `local_file.notice` mit dem Inhalt `north-ready`; eine manuelle Bearbeitung hat `notice.txt` außerhalb von OpenTofu geändert. Prüfe `tofu plan`, wende die Konfiguration an und prüfe anschließend `cat notice.txt`, `tofu state list` und `tofu plan -input=false -detailed-exitcode -no-color`. Erwartet werden `north-ready`, die Adresse `local_file.notice` und Exit-Code 0 des abschließenden Plans.


      In Aufgabe 016 behalte `local_file.release` und den Dateiinhalt `north-r16` bei. Ändere die Root-Ausgabe `release` von einer Zeichenkette zu einem Objekt mit `route = "north"`, numerischem `revision = 16` und `targets = ["app1", "app2", "app3"]`. Wende die Änderung an und prüfe `tofu output -json release`: JSON muss die Zahl und das Array erhalten. Prüfe `release.txt`, `local_file.release` im Zustand und Exit-Code 0 des abschließenden detaillierten Plans.


      ## Probieren Sie es aus


      Öffnen Sie das **opentofu Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Aktualisiert das Bearbeiten der verwalteten Datei die HCL-Deklaration?


      ```bash

      cd ~/lab/examples/state

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Der nächste plan schlägt eine Versöhnung vor; apply stellt declared wieder her.


      ## Beobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
