    ru: 'У модуля есть входы, внутренние ресурсы и явные outputs. Вызывающий код передаёт значения через этот интерфейс. Все четыре файла модуля лежат рядом с корнем: другие разделы для запуска не нужны.


      Контракт общего модуля пересекает границы caller, producer и consumer. До применения исправления изучите все интерфейсы и существующий state. Идентичность consumer — ограничение сохранения, а план для другого входа caller без применения проверяет передачу сообщения через оба модуля. В таком плане проверяйте значения, определяемые входами; вычисляемые provider ID проверяйте только в реально применённом state. Константный root output может скрывать ошибку контракта, поэтому сравнивайте также управляемые файлы producer и consumer.


      Fan-out может проходить через обёртку и вложенную реализацию. Корректный аргумент корня не создаёт отсутствующий дочерний вызов или контракт переменной. Изучите все границы и проверьте не только вход по умолчанию планами без применения. Отличайте идентичность экземпляра от содержимого: ID local_file меняется вместе с байтами, а отдельный постоянный спутник хранит идентичность станции. Сохраняйте исходные адреса файлов и ID спутников, проверяя только нужные замены файлов.


      Графу зависимостей может требоваться построить недостающих потребителей и объединение, а не только устранить цикл. Определите направление из открытого контракта потока данных, сохраните выходы от ресурсов и проверьте реальную достижимость графа. Правильные строки по умолчанию не доказывают связность; одни дополнительные depends_on не доказывают правильность значений. Планы без применения для другого входа должны передать новые значения через управляемые файлы и все публикуемые карты выходов. Если реализация предоставленного модуля входит в контракт, оставьте её неизменной.


      Интерфейсы входов и выходов модуля описывают связь вызывающей конфигурации с переиспользуемыми компонентами. State связывает адреса ресурсов с объектами провайдера. У независимых корневых конфигураций могут быть разные lineage и serial; backup одного корня не описывает более позднюю работу в другом. Интерфейсы, идентичность и владение state — разные контракты, а пустой план наблюдает управляемые атрибуты, но не каждый байт данных приложения. Лаборатория модулей тренирует интерфейсы и переиспользование; восстановление между независимыми state с сохранением физических данных в её опыт не входит.


      В квесте 098 проследите контракт от управляемого файла через output модуля к fleet и потребителю ConfigMap. Сохраните исходный ID ресурса, проверьте ссылку output и пустой план, затем каждый файл, режим и реальный ответ; Pod с переменными окружения требует перезапуска.


      В квесте 047 измените только источник `module.station` с `./modules/v1` на `./modules/v2`, оставив `module.depot` на `./modules/v1`. Выполните повторную инициализацию, сохраните бинарный plan и экспортируйте его как `upgrade-plan.json`: действие каждого ресурса должно быть `no-op`, а два записанных источника модулей должны совпадать с требуемыми. После применения сравните адреса state и ID с предоставленными оригиналами, проверьте `north.txt` со значением `north-47`, `depot.txt` со значением `depot-47`, release 2 и SHA-256 файла `north.txt` для station, release 1 для depot, а затем код выхода 0 итогового подробного plan. Сохраненный JSON показывает содержимое, но не время его создания.


      ### Адрес модуля в состоянии {#notice-module}


      В квесте 003 корень вызывает `./modules/notice` под именем `module.notice`, а дочерний модуль объявляет `local_file.notice`. Имя вызова и имя ресурса формируют адрес в состоянии. В дочернем модуле объявите тот же источник провайдера, что и в корне, `registry.terraform.io/hashicorp/local`, чтобы провайдер нашёлся в офлайн-зеркале. После инициализации и применения `tofu state list` должен содержать `module.notice.local_file.notice`.


      ### Файл уведомления и входное значение станции {#station-notice}


      Корень передаёт дочернему модулю `station = "north"`. По этому значению ресурс формирует имя и содержимое файла, поэтому `cat north.txt` должен вывести `north-ready`. Другое входное значение меняет ожидаемый файл, а ручная правка меняет файл при прежнем входном значении.


      ### Вывод на границе модуля {#notice-output}


      Дочерний модуль отдаёт содержимое через `message`. Корень объявляет свой вывод `message` со ссылкой на `module.notice.message`. После применения команда `tofu output -raw message` в корне должна вывести `north-ready`.


      ### Проверка плана модуля {#notice-module-plan}


      Если адреса модуля нет, возможно, вызов ещё не применили. Переименование ресурса или изменение файла тоже могут дать ожидающие изменения. Когда нужный адрес учтён, а файл совпадает с конфигурацией, `tofu plan -input=false -detailed-exitcode -no-color` должен завершиться с кодом 0.


      ### Обновление без смены адресов {#module-upgrade-addresses}


      Текущие адреса state отличаются от original-addresses либо недоступны: могли измениться вызов модуля или адрес ресурса, добавиться ресурсы либо исчезнуть сохранённый список. `tofu state list; cat original-addresses`.


      ### Сохранённая идентичность файлов {#module-upgrade-identities}


      Выход ids отличается от original-ids.json либо недоступен: могли измениться содержимое файлов или идентичность ресурсов, outputs ещё не применены либо сохранённый JSON отсутствует или некорректен. `tofu output -json ids; cat original-ids.json`.


      ### Сохранение содержимого файлов модулей {#module-upgrade-files}


      north.txt недоступен либо не содержит north-47: обновление module.station могло изменить содержимое либо управляемый файл был изменён или удалён. depot.txt недоступен либо не содержит depot-47: правка или apply могли изменить файл, который должен сохраняться вместе с module.depot. `cat north.txt depot.txt`.


      ### Текущие контракты outputs {#module-upgrade-current-contracts}


      contracts.station.release не равен 2 либо недоступен: module.station мог остаться на modules/v1, инициализация устарела либо новые outputs ещё не применены. contracts.station.checksum не совпадает с sha256(north.txt) либо не прочитан: output мог остаться неподдерживаемым или устареть либо north.txt изменён после apply. contracts.depot.release не равен 1 либо недоступен: module.depot мог обновиться вместе с module.station либо конфигурация outputs не сохраняет прежний контракт. `tofu output -json contracts`.


      ### Контракты outputs в сохранённом плане {#module-upgrade-saved-contracts}


      В сохранённом upgrade-plan.json для module.station нет release 2 и текущей контрольной суммы: план может отсутствовать, быть некорректен, создан до правки source либо устарел после изменения файла. Сохранённый upgrade-plan.json не сохраняет release 1 для module.depot либо недоступен: он мог быть создан с обновлением обоих source или из другой конфигурации. `jq ''.planned_values.outputs.contracts.value'' upgrade-plan.json`.


      ### Действия ресурсов в сохранённом плане {#module-upgrade-plan-actions}


      upgrade-plan.json недоступен либо содержит действия ресурсов помимо no-op: изменение адресов или содержимого при обновлении модуля может добавить создание, обновление или замену. `jq ''.resource_changes[] | {address,actions:.change.actions}'' upgrade-plan.json`.


      ### Проверка текущего плана {#module-upgrade-live-plan}


      Живой plan не завершился с кодом 0: могли остаться неприменённые outputs или drift либо ошибки конфигурации, инициализации модуля или провайдера помешали проверке. `tofu plan -input=false -detailed-exitcode -no-color`.


      ### Применённое состояние между модулями {#module-chain-applied-state}


      Применённый state не связывает нужные файлы в разных дочерних модулях с сохранённым ID потребителя: причиной могут быть другое значение вызывающего кода, пересозданные ресурсы, изменённое содержимое state или недоступные данные состояния и путей. Проверьте state рекурсивно: north.txt и delivered.txt должны быть управляемыми local_file в разных дочерних модулях с записанным north-ready. Модуль потребителя также сохраняет исходный ID terraform_data и совпадающий выход. Проверка разрешает полные пути: одинаковых имён файлов недостаточно. Содержимое state и live plan наблюдаются отдельно. `tofu show -json`.


      ### Планы вызова через оба модуля {#module-chain-caller-contract}


      План вызывающего кода не построен либо сообщение не прошло через обе границы модулей: имена входов и выходов или строковые значения ещё нарушены либо значение захардкожено вместо передачи. Защищённый контракт задаёт варианты вызывающего кода north и south. Каждый временный план должен иметь message и оба файла с соответствующим значением, включая файл производителя с именем вызывающего кода. Эти планы не применяются: восстановите строковый вход и выход message без замены сохранённого потребителя. `cat module-contract.json; tofu validate`.


      ### Текущий выход и данные проверки {#module-chain-output-observation}


      Текущий выход message не равен north-ready либо проверка остановилась до подробного маркера: причиной могут быть неприменённые или другие выходы вызывающего кода, отсутствующие защищённые данные или сбой инструментов и чтения плана.  `tofu output -raw message`.


      ### Текущий план без изменений {#module-chain-live-plan}


      Живой план не завершился с кодом 0: исправленная конфигурация ещё не применена, выходы или управляемые файлы расходятся с ней либо нарушенные входы, outputs или запуск провайдера мешают построению плана.  `tofu plan -input=false -detailed-exitcode -no-color`.


      ### Сохранённый план по умолчанию и общий вход {#fanout-saved-default-contract}


      Сохранённый план не связывает оба исходных файла с north через local.region либо данные не читаются: причиной могут быть отсутствующий или старый fanout-plan.json, захардкоженный регион или нарушенный интерфейс модуля. Корневой модуль создаёт экземпляры по постоянным ключам depot и junction. Восстановите вход region обёртки и вложенный вызов notice, передайте local.region корневым вызовом; прозрачные локальные алиасы допустимы. Сохранённый JSON по умолчанию показывает north:depot и north:junction по исходным адресам файлов. Копия literal по умолчанию не доказывает общую зависимость. `cat main.tf modules/station/main.tf; cat fanout-plan.json`.


      ### Альтернативные региональные вызовы {#fanout-alternate-caller-plans}


      Выданный региональный вызов не строит план, не достигает обоих исходных файлов станций или меняет связанную идентичность: отсутствующий вход или дочерний вызов, literal по умолчанию, изменённый связанный объект или нечитаемые данные могут быть причиной. Защищённый region-cases.json задаёт north и west. Каждый свежий план без применения передаёт значение обоим исходным файлам, а каждый terraform_data сохраняет no-op и исходный ID. Альтернативные планы не применяются. Сохранённый артефакт по умолчанию и свежие планы вызывающего кода наблюдаются отдельно. `cat region-cases.json; tofu validate -no-color`.


      ### Сохранение плана замен до apply {#fanout-retained-replacement-plan}


      Сохранённый план не заменяет ровно оба исходных файла с только no-op/read для остальных либо не читается: новый план после apply, другие ключи экземпляров или посторонние изменения нарушают условие. Сохраните план по умолчанию и fanout-plan.json до применения исправленной конфигурации. Оба local_file заменяют содержимое retired, а две постоянные связанные идентичности не меняются. Сохраните артефакт после apply: свежий пустой текущий план относится к другому условию. Проверяются сохранённые артефакты и состояние, а не точная история команд. `cat fanout-plan.json`.


      ### Текущие исходные адреса файлов {#fanout-current-file-addresses}


      Текущее состояние не содержит оба записанных адреса файлов либо данные не прочитаны: другие ключи for_each, удалённые вложенные ресурсы, изменённый список адресов или сбой наблюдения state теряют нужные экземпляры.  `cat original-addresses; tofu state list`.


      ### Точный набор исходных файлов и связанных объектов {#fanout-preserved-companion-set}


      Запись адресов или точный набор управляемых объектов отличается от замороженного исходного, связанная идентичность сменила ID или тип либо данные не прочитаны: пересоздание или лишние объекты нарушают непрерывность.  `cat original-addresses station-identities.json; tofu show -json`.


      ### Пути выходов разрешаются в существующие файлы {#fanout-output-file-targets}


      Выход routes не разрешает ровно depot и junction в существующие файлы либо наблюдение выхода и путей не удалось: причиной могут быть другие или отсутствующие ключи, неверные экспортируемые пути либо отсутствующие файлы.  `tofu output -json routes`.


      ### Текущий план по умолчанию без изменений {#fanout-default-no-change-plan}


      Текущий план по умолчанию не вернул 0: исправленные входы ещё требуют apply, файлы и выходы разошлись либо неполный интерфейс и сбой провайдера мешают плану.  `tofu plan -detailed-exitcode -input=false -no-color`.


      ### Файл по умолчанию для depot {#fanout-depot-file}


      depot.txt не предоставляет north:depot либо не читается: выданный регион retired, неполная передача значения или неприменённый исправленный план оставляют устаревший файл.  `cat depot.txt`.


      ### Файл по умолчанию для junction {#fanout-junction-file}


      junction.txt не предоставляет north:junction либо не читается: выданный регион retired, неполная передача значения или неприменённый исправленный план оставляют устаревший файл.  `cat junction.txt`.


      ## Попробуйте


      Откройте лабораторию **opentofu**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Может ли корень получить значение ресурса через output дочернего модуля?


      ```bash

      cd ~/lab/examples/module

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Да. module.api.name возвращает api, а адрес в state находится внутри module.api.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Moduł ma wejścia, zasoby wewnętrzne i jawne outputs. Obiekt wywołujący przekazuje wartości przez ten interfejs. Trzymanie wszystkich czterech plików modułów obok katalogu głównego sprawia, że ​​ten przykład można uruchomić bez dodatkowej sekcji przewodnika.


      Wspólny kontrakt modułu przekracza granice caller, producer i consumer. Przed zastosowaniem naprawy zbadaj wszystkie interfejsy i istniejący state. Zachowana tożsamość consumer jest ograniczeniem; plan bez zastosowania dla innego wejścia caller sprawdza przekazywanie komunikatu przez oba moduły. Sprawdzaj w nim wartości wynikające z wejść; obliczane ID dostawcy weryfikuj tylko w faktycznie zastosowanym state. Stały output główny może ukrywać zepsuty kontrakt, więc porównuj także zarządzane pliki producer i consumer.


      Fan-out może przechodzić przez wrapper i zagnieżdżoną implementację. Poprawny argument główny nie tworzy brakującego wywołania potomnego ani kontraktu zmiennej. Zbadaj każdą granicę i sprawdź więcej niż domyślne wejście planami bez zastosowania. Rozróżniaj tożsamość instancji i danych: ID local_file może zmienić się z bajtami, a trwały obiekt tożsamości zachowuje identyfikator stacji. Zachowaj pierwotne adresy plików i ID obiektów tożsamości, przeglądając tylko zamierzone zastąpienia plików.


      Graf zależności może wymagać zbudowania brakujących odbiorców i połączenia gałęzi oprócz usunięcia cyklu. Wyprowadź kierunek z publicznego kontraktu przepływu, zachowaj wyjścia oparte na zasobach i sprawdź rzeczywistą osiągalność. Poprawne domyślne ciągi nie dowodzą połączenia grafu; same dodatkowe depends_on także nie dowodzą poprawnych wartości. Plany bez zastosowania dla innego wejścia muszą przekazać wartości przez zarządzane pliki i wszystkie publikowane mapy wyjść. Zachowaj implementację dostarczonego modułu, jeśli jej zachowanie stanowi część kontraktu.


      Interfejsy wejść i wyjść modułu opisują relacje między konfiguracją wywołującą a komponentami wielokrotnego użytku. Stan wiąże adresy zasobów z obiektami providera. Niezależne główne konfiguracje mogą mieć oddzielne lineage i serial; kopia jednej nie opisuje późniejszej pracy w innej. Interfejsy, tożsamość i własność stanu to różne kontrakty, a pusty plan obserwuje zarządzane atrybuty, nie każdy bajt aplikacji. Lab modułów ćwiczy interfejsy i ponowne użycie; odzyskiwanie niezależnych stanów z zachowaniem fizycznych danych wykracza poza ten eksperyment.


      W zadaniu 098 prześledź kontrakt od zarządzanego pliku przez output modułu do fleet i odbiorcy ConfigMap. Zachowaj pierwotne ID zasobu, sprawdź referencję outputu i pusty plan, a potem każdy plik, tryb i rzeczywistą odpowiedź; Pod korzystający ze zmiennych środowiskowych wymaga restartu.


      W zadaniu 047 zmień tylko źródło `module.station` z `./modules/v1` na `./modules/v2`, pozostawiając `module.depot` na `./modules/v1`. Ponownie zainicjuj, zapisz binarny plan i wyeksportuj go jako `upgrade-plan.json`: działanie każdego zasobu powinno być `no-op`, a oba zapisane źródła modułów powinny odpowiadać wymaganym. Po zastosowaniu porównaj adresy state i ID z dostarczonymi oryginałami, sprawdź `north.txt` z wartością `north-47`, `depot.txt` z wartością `depot-47`, release 2 i SHA-256 pliku `north.txt` dla station, release 1 dla depot oraz kod wyjścia 0 końcowego szczegółowego planu. Zapisany JSON pokazuje zawartość, a nie czas utworzenia.


      ### Adres modułu w stanie {#notice-module}


      W zadaniu 003 moduł główny wywołuje `./modules/notice` jako `module.notice`, a moduł potomny definiuje `local_file.notice`. Nazwa wywołania i nazwa zasobu tworzą adres w stanie. Moduł potomny deklaruje to samo źródło dostawcy co główny, `registry.terraform.io/hashicorp/local`, aby dostawca był dostępny w lokalnym repozytorium offline. Po inicjalizacji i zastosowaniu polecenie `tofu state list` powinno zawierać `module.notice.local_file.notice`.


      ### Plik powiadomienia z wejścia stacji {#station-notice}


      Moduł główny przekazuje `station = "north"` do modułu potomnego. Zasób wyprowadza nazwę i treść pliku z tego wejścia, więc `cat north.txt` powinno wyświetlić `north-ready`. Inne wejście zmienia oczekiwany plik, a ręczna edycja zmienia plik przy tym samym wejściu.


      ### Wynik na granicy modułu {#notice-output}


      Moduł potomny udostępnia treść jako `message`. Moduł główny deklaruje własny wynik `message` wskazujący na `module.notice.message`. Po zastosowaniu `tofu output -raw message` w module głównym powinno wyświetlić `north-ready`.


      ### Sprawdzanie planu modułu {#notice-module-plan}


      Brak adresu może oznaczać, że wywołania jeszcze nie zastosowano. Zmiana nazwy zasobu lub pliku też może dać oczekujące zmiany. Gdy właściwy adres jest śledzony, a plik zgadza się z konfiguracją, `tofu plan -input=false -detailed-exitcode -no-color` powinno zakończyć się kodem 0.


      ### Aktualizacja bez zmiany adresów {#module-upgrade-addresses}


      Bieżące adresy stanu różnią się od original-addresses lub są nieczytelne; mogło zmienić się wywołanie modułu albo adres zasobu, dodano zasoby lub brakuje zapisanej listy. `tofu state list; cat original-addresses`.


      ### Zachowane tożsamości plików {#module-upgrade-identities}


      Wyjście ids różni się od original-ids.json lub jest nieczytelne; mogła zmienić się treść plików lub tożsamość zasobów, wyjścia nie zostały zastosowane albo zapisany JSON jest brakujący lub błędny. `tofu output -json ids; cat original-ids.json`.


      ### Zachowanie treści plików modułów {#module-upgrade-files}


      north.txt jest nieczytelny lub nie zawiera north-47; aktualizacja module.station mogła zmienić treść albo zarządzany plik zmieniono lub usunięto. depot.txt jest nieczytelny lub nie zawiera depot-47; edycja albo apply mogły zmienić plik, który ma pozostać bez zmian wraz z module.depot. `cat north.txt depot.txt`.


      ### Bieżące kontrakty wyjść {#module-upgrade-current-contracts}


      contracts.station.release nie wynosi 2 lub jest nieczytelny; module.station może nadal używać modules/v1, inicjalizacja jest nieaktualna lub nowe wyjścia nie zostały zastosowane. contracts.station.checksum nie odpowiada sha256(north.txt) lub jest nieczytelny; wyjście może nadal być nieobsługiwane albo nieaktualne lub north.txt zmieniono po apply. contracts.depot.release nie wynosi 1 lub jest nieczytelny; module.depot mógł zostać zaktualizowany razem z module.station lub konfiguracja wyjść nie zachowuje poprzedniego kontraktu. `tofu output -json contracts`.


      ### Kontrakty wyjść zapisanego planu {#module-upgrade-saved-contracts}


      Zapisany upgrade-plan.json nie zawiera release 2 i bieżącej sumy pliku dla module.station; plan może być brakujący, błędny, starszy niż zmiana source albo nieaktualny po edycji pliku. Zapisany upgrade-plan.json nie zachowuje release 1 dla module.depot lub jest nieczytelny; mógł powstać po aktualizacji obu źródeł modułów albo z niewłaściwej konfiguracji. `jq ''.planned_values.outputs.contracts.value'' upgrade-plan.json`.


      ### Zapisane działania zasobów {#module-upgrade-plan-actions}


      upgrade-plan.json jest nieczytelny lub zawiera działania zasobów inne niż no-op; zmiana adresów albo treści przy aktualizacji modułu może dodać tworzenie, aktualizację lub wymianę. `jq ''.resource_changes[] | {address,actions:.change.actions}'' upgrade-plan.json`.


      ### Kontrola bieżącego planu {#module-upgrade-live-plan}


      Bieżący plan nie zakończył się kodem 0; mogły pozostać niezastosowane wyjścia lub drift albo błędy konfiguracji, inicjalizacji modułu lub providera uniemożliwiły kontrolę. `tofu plan -input=false -detailed-exitcode -no-color`.


      ### Zastosowany stan między modułami {#module-chain-applied-state}


      Zastosowany stan nie łączy wymaganych plików w różnych modułach potomnych z zachowanym ID odbiorcy; przyczyną może być inna wartość wywołania, odtworzone zasoby, zmieniona treść stanu lub nieczytelne dane stanu i ścieżek. Sprawdź stan rekurencyjnie: north.txt i delivered.txt muszą być zarządzanymi local_file w różnych modułach potomnych, zapisującymi north-ready. Moduł odbiorcy zachowuje też pierwotny ID terraform_data i zgodne wyjście. Kontrola rozwiązuje pełne ścieżki; same nazwy plików nie wystarczą. Treść stanu i bieżący plan obserwuje osobno. `tofu show -json`.


      ### Plany wywołań przez oba moduły {#module-chain-caller-contract}


      Plan wywołania zawiódł lub nie przekazał komunikatu przez obie granice modułów; nazwy wejść/wyjść i wartości tekstowe mogą nadal być błędne albo wartość wpisano na stałe zamiast przekazać. Chroniony kontrakt podaje wywołania north i south. Każdy tymczasowy plan musi udostępniać message i oba pliki z odpowiednią wartością, w tym plik producenta nazwany przez wywołanie. Tych planów nie stosuje się; napraw granice tekstowego wejścia i wyjścia message bez wymiany zachowanego odbiorcy. `cat module-contract.json; tofu validate`.


      ### Bieżące wyjście i dane kontroli {#module-chain-output-observation}


      Bieżące wyjście message nie jest north-ready lub kontrola zatrzymała się przed szczegółowym markerem; przyczyną mogą być niezastosowane albo inne wyjścia wywołania, brak chronionych danych lub błąd narzędzi i odczytu planu.  `tofu output -raw message`.


      ### Bieżący plan bez zmian {#module-chain-live-plan}


      Bieżący plan nie zakończył się kodem 0; poprawiona konfiguracja może czekać na zastosowanie, wyjścia lub pliki odbiegać od niej albo błędne wejścia, eksporty lub start providera blokują plan.  `tofu plan -input=false -detailed-exitcode -no-color`.


      ### Zapisany plan domyślny i wspólne wejście {#fanout-saved-default-contract}


      Zapisany plan nie łączy obu pierwotnych plików z north przez local.region lub dane są nieczytelne; brak/stary fanout-plan.json, stały region lub błędny interfejs modułu mogą to wyjaśniać. Moduł główny rozdziela pracę przez stałe klucze depot i junction. Odtwórz wejście region i podrzędne notice, potem przekaż local.region w wywołaniu głównym; przezroczyste lokalne aliasy są dozwolone. Zapisany JSON domyślny pokazuje north:depot i north:junction pod pierwotnymi adresami. Kopia stałej domyślnej nie potwierdza wspólnej zależności. `cat main.tf modules/station/main.tf; cat fanout-plan.json`.


      ### Alternatywne wywołania regionalne {#fanout-alternate-caller-plans}


      Dostarczone wywołanie regionalne nie tworzy planu, nie dociera do obu pierwotnych plików lub zmienia obiekt tożsamości; brak wejścia/wywołania podrzędnego, stała domyślna, zmieniony obiekt lub nieczytelne dane mogą to wyjaśniać. Chroniony region-cases.json podaje north i west. Każdy świeży plan bez zastosowania przekazuje wartość do obu pierwotnych plików, a wszystkie chronione terraform_data pozostają no-op z pierwotnym ID. Alternatywnych planów nie stosuje się. Zapisany artefakt domyślny i świeże plany wywołań są osobnymi obserwacjami. `cat region-cases.json; tofu validate -no-color`.


      ### Zachowanie planu wymian sprzed apply {#fanout-retained-replacement-plan}


      Zapisany plan nie wymienia dokładnie obu pierwotnych plików i wyłącznie no-op/read dla reszty lub jest nieczytelny; nowy plan po apply, inne klucze instancji lub dodatkowe zmiany naruszają warunek. Zapisz plan domyślny i fanout-plan.json przed zastosowaniem poprawionej konfiguracji. Oba local_file wymieniają treść retired, a dwa trwałe obiekty tożsamości pozostają bez zmian. Zachowaj artefakt po apply; świeży pusty plan dotyczy innego warunku. Kontrola obserwuje artefakty i stan, nie potwierdza dokładnej historii poleceń. `cat fanout-plan.json`.


      ### Bieżące pierwotne adresy plików {#fanout-current-file-addresses}


      Bieżący stan nie zawiera obu zapisanych adresów lub dane są nieczytelne; zmienione klucze for_each, usunięte zasoby podrzędne, zmieniona lista adresów lub błąd obserwacji stanu gubią wymagane instancje.  `cat original-addresses; tofu state list`.


      ### Dokładnie pierwotne pliki i obiekty towarzyszące {#fanout-preserved-companion-set}


      Zapis adresów lub dokładny zestaw zarządzanych obiektów różni się od chronionych oryginałów, obiekt tożsamości zmienił ID/typ albo dane są nieczytelne; odtworzone lub dodatkowe obiekty naruszają ciągłość.  `cat original-addresses station-identities.json; tofu show -json`.


      ### Ścieżki wyjść wskazują istniejące pliki {#fanout-output-file-targets}


      Wyjście routes nie rozwiązuje dokładnie depot i junction do istniejących plików lub obserwacja zawiodła; inne/brakujące klucze, błędne eksportowane ścieżki lub brak plików mogą to wyjaśniać.  `tofu output -json routes`.


      ### Bieżący plan domyślny bez zmian {#fanout-default-no-change-plan}


      Bieżący plan domyślny nie zwrócił 0; naprawione wejścia wymagają apply, pliki/wyjścia się różnią albo niepełny interfejs lub start providera blokuje plan.  `tofu plan -detailed-exitcode -input=false -no-color`.


      ### Domyślny plik depot {#fanout-depot-file}


      depot.txt nie udostępnia north:depot lub jest nieczytelny; dostarczony region retired, niepełne przekazywanie lub niezastosowany poprawiony plan pozostawia stary plik.  `cat depot.txt`.


      ### Domyślny plik junction {#fanout-junction-file}


      junction.txt nie udostępnia north:junction lub jest nieczytelny; dostarczony region retired, niepełne przekazywanie lub niezastosowany poprawiony plan pozostawia stary plik.  `cat junction.txt`.


      ## Wypróbuj


      Otwórz laboratorium **opentofu** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy root może odczytać zasób podrzędny poprzez zadeklarowany output?


      ```bash

      cd ~/lab/examples/module

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Tak. module.api.name zwraca api; state zawiera zasób pod adresem module.api.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Un módulo tiene entradas, recursos internos y outputs explícito. La persona que llama pasa valores a través de esa interfaz. Mantener los cuatro archivos del módulo junto a la raíz hace que este ejemplo se pueda ejecutar sin otra sección de guía.


      Un contrato de módulo compartido cruza fronteras caller, producer y consumer. Inspecciona todas las interfaces y el state existente antes de aplicar una reparación. La identidad consumer conservada es una restricción; un plan sin aplicar para otra entrada caller prueba si el mensaje atraviesa ambos módulos. Comprueba allí valores derivados de entradas; verifica identidades calculadas del proveedor solo en state realmente aplicado. Un output raíz constante puede ocultar un contrato roto, por lo que también deben compararse los archivos administrados producer y consumer.


      Un fan-out puede atravesar un wrapper y una implementación anidada. Un argumento raíz válido no construye una llamada hija o un contrato de variable ausentes. Examina cada frontera y prueba más que el valor predeterminado con planes sin aplicar. Distingue identidad de instancia e identidad de contenido: el ID local_file puede cambiar con sus bytes, mientras un acompañante persistente conserva la identidad de estación. Conserva las direcciones originales y los ID de acompañantes al revisar solo las sustituciones previstas.


      Un grafo de dependencias puede exigir construir consumidores ausentes y una unión además de eliminar un ciclo. Deduce la dirección del contrato público de datos, conserva outputs respaldados por recursos y verifica alcanzabilidad real. Las cadenas predeterminadas correctas no prueban conexión; añadir depends_on por sí solo tampoco prueba valores correctos. Los planes sin aplicar de otro caller deben propagar valores por archivos administrados y todos los mapas de outputs publicados. Mantén la implementación del módulo suministrado si su comportamiento forma parte del contrato.


      Las interfaces de entrada/salida de módulos describen relaciones entre configuraciones que los invocan y componentes reutilizables. El estado vincula direcciones de recursos con objetos del proveedor. Las raíces independientes pueden tener lineages y serials separados; el backup de una raíz no describe trabajo posterior de otra. Interfaces, identidad y propiedad del estado son contratos distintos, y un plan sin cambios observa atributos gestionados, no cada byte de la aplicación. El Lab de módulos practica interfaces y reutilización; recuperar estados independientes conservando datos físicos queda fuera de su ejecución.


      En el ejercicio 098, sigue el contrato desde el archivo gestionado por la salida del módulo hasta fleet y el consumidor ConfigMap. Conserva el ID original, comprueba la referencia de salida y el plan vacío, y verifica cada archivo, modo y respuesta real; los Pods con variables de entorno necesitan reinicio.


      En el ejercicio 047, cambia solo la fuente de `module.station` de `./modules/v1` a `./modules/v2`, dejando `module.depot` en `./modules/v1`. Reinicializa, guarda un plan binario y expórtalo como `upgrade-plan.json`: cada acción de recurso debe ser `no-op` y las dos fuentes registradas deben coincidir con las requeridas. Tras aplicar, compara direcciones de state e ID con los originales suministrados, comprueba `north.txt` con `north-47`, `depot.txt` con `depot-47`, release 2 y el SHA-256 de `north.txt` para station, release 1 para depot, y verifica el código de salida 0 del plan detallado final. El JSON guardado muestra su contenido, no cuándo se creó.


      ### Dirección del módulo en el estado {#notice-module}


      En el ejercicio 003, la raíz llama a `./modules/notice` como `module.notice` y el módulo hijo define `local_file.notice`. El nombre de la llamada y el del recurso forman la dirección. El módulo hijo declara la misma fuente del proveedor que la raíz, `registry.terraform.io/hashicorp/local`, para que el espejo sin conexión pueda suministrarlo. Tras inicializar y aplicar, `tofu state list` debe incluir `module.notice.local_file.notice`.


      ### Aviso a partir de la entrada de estación {#station-notice}


      La raíz pasa `station = "north"` al módulo hijo. El recurso deriva de esa entrada el nombre y el contenido del archivo, por lo que `cat north.txt` debe mostrar `north-ready`. Otra entrada cambia el archivo esperado y una edición manual cambia el archivo con la misma entrada.


      ### Salida entre módulos {#notice-output}


      El módulo hijo expone el contenido gestionado como `message`. La raíz declara su propia salida `message` y la vincula a `module.notice.message`. Después de aplicar, `tofu output -raw message` en la raíz debe mostrar `north-ready`.


      ### Comprobación del plan del módulo {#notice-module-plan}


      La ausencia de la dirección puede indicar que aún falta aplicar la llamada. Cambiar el nombre del recurso o el archivo también puede dejar cambios pendientes. Con la dirección registrada y el archivo de acuerdo con la configuración, `tofu plan -input=false -detailed-exitcode -no-color` debe salir con código 0.


      ### Actualizar sin cambiar direcciones {#module-upgrade-addresses}


      Las direcciones actuales del estado difieren de original-addresses o no pueden leerse; puede haber cambiado una llamada de módulo o dirección, recursos extra o falta el inventario guardado. `tofu state list; cat original-addresses`.


      ### Identidades de archivo conservadas {#module-upgrade-identities}


      La salida ids difiere de original-ids.json o es ilegible; puede haber cambiado el contenido o la identidad, las salidas no se aplicaron o el JSON guardado falta o es inválido. `tofu output -json ids; cat original-ids.json`.


      ### Conservar contenido de archivos de módulos {#module-upgrade-files}


      north.txt no puede leerse o no contiene north-47; la actualización de module.station puede haber cambiado el contenido o el archivo gestionado fue editado o eliminado. depot.txt no puede leerse o no contiene depot-47; una edición o apply puede haber cambiado el archivo que debe conservarse con module.depot. `cat north.txt depot.txt`.


      ### Contratos actuales de salidas {#module-upgrade-current-contracts}


      contracts.station.release no es 2 o no puede leerse; module.station puede seguir usando modules/v1, la inicialización está desactualizada o las salidas no se aplicaron. contracts.station.checksum no coincide con sha256(north.txt) o no puede observarse; la salida puede seguir sin soporte o desactualizada, o north.txt cambió tras apply. contracts.depot.release no es 1 o no puede leerse; module.depot puede haberse actualizado junto con module.station o las salidas ya no conservan su contrato anterior. `tofu output -json contracts`.


      ### Contratos de salidas del plan guardado {#module-upgrade-saved-contracts}


      El upgrade-plan.json guardado no tiene release 2 y la suma actual para module.station; puede faltar, ser inválido, anterior al cambio de source o quedar desactualizado tras editar el archivo. El upgrade-plan.json guardado no conserva release 1 para module.depot o no puede leerse; puede haberse generado con ambos módulos actualizados o desde otra configuración. `jq ''.planned_values.outputs.contracts.value'' upgrade-plan.json`.


      ### Acciones de recursos guardadas {#module-upgrade-plan-actions}


      upgrade-plan.json no puede leerse o contiene acciones distintas de no-op; cambiar direcciones o contenido al actualizar el módulo puede introducir creaciones, cambios o reemplazos. `jq ''.resource_changes[] | {address,actions:.change.actions}'' upgrade-plan.json`.


      ### Verificar el plan actual {#module-upgrade-live-plan}


      El plan actual no terminó con código 0; pueden quedar salidas sin aplicar o drift, o errores de configuración, inicialización de módulo o proveedor impidieron ejecutarlo. `tofu plan -input=false -detailed-exitcode -no-color`.


      ### Estado aplicado entre módulos {#module-chain-applied-state}


      El estado aplicado ya no conecta los archivos requeridos en módulos hijos distintos con el ID conservado del consumidor; otro valor de llamada, recursos recreados, contenido registrado cambiado o evidencia ilegible pueden explicarlo. Inspeccione el estado recursivamente: north.txt y delivered.txt deben ser local_file gestionados en módulos hijos distintos con north-ready registrado. El módulo consumidor conserva además el ID original terraform_data y salida coincidente. Se resuelven rutas completas; los nombres de archivo solos no bastan. El estado y el plan actual se observan por separado. `tofu show -json`.


      ### Planes de llamada por ambos módulos {#module-chain-caller-contract}


      El plan de llamada falló o no propagó el mensaje por ambos límites de módulo; pueden seguir mal los nombres de entradas/salidas y valores de texto, o se fijó un valor en vez de pasarlo. El contrato protegido proporciona casos north y south. Cada plan temporal expone message y ambos archivos con el valor correspondiente, incluido el archivo productor nombrado por la llamada. Estos planes no se aplican; repare entrada de texto y salida message sin sustituir al consumidor conservado. `cat module-contract.json; tofu validate`.


      ### Salida actual y entradas de prueba {#module-chain-output-observation}


      La salida message actual no es north-ready o la prueba se detuvo antes del marcador detallado; salidas sin aplicar o distintas, entradas protegidas ausentes o fallos de herramientas/lectura del plan pueden explicarlo.  `tofu output -raw message`.


      ### Plan actual sin cambios {#module-chain-live-plan}


      El plan actual no terminó con código 0; la configuración reparada puede seguir sin aplicar, salidas o archivos mostrar drift o entradas, exportaciones o inicio del proveedor impedir un plan válido.  `tofu plan -input=false -detailed-exitcode -no-color`.


      ### Plan predeterminado guardado y entrada compartida {#fanout-saved-default-contract}


      El plan guardado no enlaza ambos archivos originales a north por local.region o no pudo leerse; fanout-plan.json ausente/obsoleto, región fija o interfaz de módulo rota pueden explicarlo. El módulo raíz distribuye por claves estables depot y junction. Reconstruya entrada region y llamada anidada notice, y pase local.region por la llamada raíz; alias locales transparentes se aceptan. El JSON predeterminado guardado muestra north:depot y north:junction en direcciones originales. Copiar un literal predeterminado no acredita la dependencia compartida. `cat main.tf modules/station/main.tf; cat fanout-plan.json`.


      ### Llamadas regionales alternativas {#fanout-alternate-caller-plans}


      Una llamada regional suministrada no pudo planificarse, no llegó a ambos archivos originales o cambió una identidad vinculada; entrada/llamada hija ausente, literal predeterminado, objeto alterado o datos protegidos/plan ilegibles pueden explicarlo. El region-cases.json protegido aporta north y west. Cada plan nuevo de solo lectura propaga su valor a ambos archivos originales mientras cada terraform_data protegido permanece no-op con ID original. Estos planes no se aplican. Artefacto predeterminado guardado y planes nuevos son observaciones separadas. `cat region-cases.json; tofu validate -no-color`.


      ### Conservar plan de reemplazos anterior a apply {#fanout-retained-replacement-plan}


      El plan guardado no reemplaza exactamente ambos archivos originales con solo no-op/read para los demás, o es ilegible; otro plan tras apply, claves de instancia cambiadas o cambios extra lo invalidan. Guarde plan predeterminado y fanout-plan.json antes de aplicar la configuración reparada. Ambos local_file reemplazan contenido retired y las dos identidades permanentes quedan iguales. Conserve el artefacto tras apply; un plan actual vacío verifica otra condición. Se observan artefactos y estado actual sin acreditar historia exacta de comandos. `cat fanout-plan.json`.


      ### Direcciones originales actuales de archivos {#fanout-current-file-addresses}


      El estado actual no contiene ambas direcciones registradas o su evidencia es ilegible; claves for_each cambiadas, recursos anidados eliminados, lista editada o fallo de observación puede perder instancias requeridas.  `cat original-addresses; tofu state list`.


      ### Exactamente archivos y objetos vinculados originales {#fanout-preserved-companion-set}


      El recibo de direcciones o conjunto gestionado exacto difiere de originales protegidos, una identidad cambió ID/tipo o no se leyó evidencia; recrear objetos vinculados o conservar recursos extra rompe continuidad.  `cat original-addresses station-identities.json; tofu show -json`.


      ### Rutas de salida resuelven a archivos existentes {#fanout-output-file-targets}


      La salida routes no resuelve exactamente depot y junction a sus archivos existentes o falló observar; claves distintas/ausentes, rutas exportadas incorrectas o archivos ausentes pueden explicarlo.  `tofu output -json routes`.


      ### Plan actual predeterminado sin cambios {#fanout-default-no-change-plan}


      El plan predeterminado actual no terminó con 0; entradas reparadas pueden necesitar apply, archivos/salidas presentar drift o interfaces incompletas/inicio del proveedor impedir un plan válido.  `tofu plan -detailed-exitcode -input=false -no-color`.


      ### Archivo predeterminado depot {#fanout-depot-file}


      depot.txt no proporciona north:depot o no puede leerse; región retired suministrada, propagación incompleta o plan corregido sin aplicar deja el archivo obsoleto.  `cat depot.txt`.


      ### Archivo predeterminado junction {#fanout-junction-file}


      junction.txt no proporciona north:junction o no puede leerse; región retired suministrada, propagación incompleta o plan corregido sin aplicar deja el archivo obsoleto.  `cat junction.txt`.


      ## Pruébalo


      Abra el laboratorio **opentofu** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿Puede la raíz leer el recurso secundario a través de su salida declarada?


      ```bash

      cd ~/lab/examples/module

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > YSí. module.api.name devuelve api; El estado contiene el recurso bajo la dirección module.api.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh`, luego `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Ein Modul verfügt über Eingänge, interne Ressourcen und explizite outputs. Der Aufrufer übergibt Werte über diese Schnittstelle. Wenn Sie alle vier Moduldateien neben dem Stammverzeichnis aufbewahren, ist dieses Beispiel ohne einen weiteren Anleitungsabschnitt lauffähig.


      Ein gemeinsamer Modulvertrag überschreitet Caller-, Producer- und Consumer-Grenzen. Untersuche alle Schnittstellen und bestehenden State vor dem Anwenden einer Reparatur. Die erhaltene Consumer-Identität ist eine Erhaltungsbedingung; ein nicht angewandter Plan für eine andere Caller-Eingabe prüft die Nachrichtenweitergabe durch beide Module. Prüfe dort eingabeabhängige Planwerte; berechnete Provider-Identitäten gehören in tatsächlich angewandten State. Ein konstanter Root-Output kann einen defekten Vertrag verdecken, also vergleiche auch verwaltete Producer- und Consumer-Dateien.


      Fan-out kann einen Wrapper und eine verschachtelte Implementierung durchqueren. Ein gültiges Root-Argument erstellt weder einen fehlenden Kindaufruf noch den Variablenvertrag. Prüfe jede Grenze und teste neben dem Standard weitere Caller-Werte mit nicht angewandten Plänen. Unterscheide Instanzidentität und Nutzdatenidentität: Eine local_file-ID kann sich mit den Bytes ändern, während ein dauerhafter Begleiter die Stationsidentität behält. Erhalte ursprüngliche Dateiadressen und Begleiter-IDs und prüfe nur beabsichtigte Dateiersetzungen.


      Ein Abhängigkeitsgraph kann neben Zyklusbehebung auch Konstruktion fehlender Verbraucher und einer Zusammenführung verlangen. Leite die Richtung aus dem öffentlichen Datenflussvertrag ab, erhalte ressourcengestützte Ausgaben und prüfe echte Erreichbarkeit. Richtige Standardzeichenfolgen beweisen keinen verbundenen Graphen; zusätzliche depends_on-Kanten allein beweisen keine richtigen Werte. Nicht angewandte Pläne für andere Caller-Werte müssen diese durch verwaltete Dateien und alle veröffentlichten Ausgabemaps weitergeben. Erhalte die Modulimplementierung, wenn ihr Verhalten Teil des Vertrags ist.


      Modul-Ein-/Ausgabeschnittstellen beschreiben Beziehungen zwischen aufrufenden Konfigurationen und wiederverwendbaren Komponenten. State bindet Ressourcenadressen an Provider-Objekte. Unabhängige Root-Konfigurationen können eigene Lineages und Serials haben; das Backup eines Roots beschreibt keine spätere Arbeit in einem anderen. Schnittstellen, Identität und State-Eigentümerschaft sind getrennte Verträge; ein unveränderter Plan beobachtet verwaltete Attribute statt aller Anwendungsbytes. Das Modul-Lab übt Schnittstellen und Wiederverwendung; die Wiederherstellung zwischen unabhängigen States mit erhaltenen physischen Daten gehört nicht zu seinem Ablauf.


      Verfolge in Aufgabe 098 den Vertrag von der verwalteten Datei über den Modul-Output zu Fleet und ConfigMap-Verbraucher. Erhalte die ursprüngliche Ressourcen-ID, prüfe Output-Referenz und leeren Plan sowie jede Datei, jeden Modus und jede tatsächliche Antwort; Pods mit Umgebungsvariablen benötigen einen Neustart.


      Ändere in Aufgabe 047 nur die Quelle von `module.station` von `./modules/v1` auf `./modules/v2` und belasse `module.depot` auf `./modules/v1`. Initialisiere erneut, speichere einen binären Plan und exportiere ihn als `upgrade-plan.json`: Jede Ressourcenaktion soll `no-op` sein, und die beiden aufgezeichneten Modulquellen müssen den Vorgaben entsprechen. Vergleiche nach der Anwendung State-Adressen und IDs mit den bereitgestellten Originalen, prüfe `north.txt` mit `north-47`, `depot.txt` mit `depot-47`, Release 2 und den SHA-256-Wert von `north.txt` für station, Release 1 für depot sowie Exit-Code 0 des abschließenden detaillierten Plans. Das gespeicherte JSON zeigt seinen Inhalt, nicht den Zeitpunkt seiner Erstellung.


      ### Moduladresse im State {#notice-module}


      In Aufgabe 003 ruft das Root-Modul `./modules/notice` als `module.notice` auf, und das Kindmodul definiert `local_file.notice`. Aufrufname und Ressourcenname ergeben die State-Adresse. Das Kindmodul deklariert dieselbe Providerquelle wie das Root-Modul, `registry.terraform.io/hashicorp/local`, damit der Offline-Spiegel den Provider bereitstellen kann. Nach Initialisierung und Apply soll `tofu state list` den Eintrag `module.notice.local_file.notice` enthalten.


      ### Hinweis aus dem Stationswert {#station-notice}


      Das Root-Modul übergibt `station = "north"` an das Kindmodul. Die Ressource leitet den Dateinamen und den Inhalt daraus ab. `cat north.txt` soll deshalb `north-ready` anzeigen. Ein anderer Eingabewert ändert die erwartete Datei. Eine manuelle Bearbeitung ändert die Datei bei gleichbleibendem Eingabewert.


      ### Ausgabe an der Modulgrenze {#notice-output}


      Das Kindmodul gibt den verwalteten Inhalt als `message` aus. Das Root-Modul deklariert eine eigene Ausgabe `message` und verweist auf `module.notice.message`. Nach Apply soll `tofu output -raw message` im Root-Modul `north-ready` anzeigen.


      ### Modulplan prüfen {#notice-module-plan}


      Eine fehlende Adresse kann bedeuten, dass der Aufruf noch nicht angewendet wurde. Eine Umbenennung der Ressource oder eine geänderte Datei kann ebenfalls zu ausstehenden Änderungen führen. Sobald die Adresse im State steht und die Datei der Konfiguration entspricht, soll `tofu plan -input=false -detailed-exitcode -no-color` mit Code 0 enden.


      ### Upgrade ohne Adressänderung {#module-upgrade-addresses}


      Die aktuellen State-Adressen weichen von original-addresses ab oder sind unlesbar; ein Modulaufruf oder eine Ressourcenadresse hat sich möglicherweise geändert, zusätzliche Ressourcen wurden ergänzt oder die gespeicherte Liste fehlt. `tofu state list; cat original-addresses`.


      ### Erhaltene Dateiidentitäten {#module-upgrade-identities}


      Das ids-Output weicht von original-ids.json ab oder ist unlesbar; Dateiinhalte oder Ressourcenidentitäten wurden möglicherweise geändert, Outputs noch nicht angewendet oder das gespeicherte JSON fehlt beziehungsweise ist ungültig. `tofu output -json ids; cat original-ids.json`.


      ### Moduldateiinhalte erhalten {#module-upgrade-files}


      north.txt ist unlesbar oder enthält nicht north-47; das Upgrade von module.station hat möglicherweise den Inhalt geändert oder die verwaltete Datei wurde bearbeitet beziehungsweise entfernt. depot.txt ist unlesbar oder enthält nicht depot-47; eine Bearbeitung oder apply hat möglicherweise die Datei verändert, die mit module.depot erhalten bleiben soll. `cat north.txt depot.txt`.


      ### Aktuelle Output-Verträge {#module-upgrade-current-contracts}


      contracts.station.release ist nicht 2 oder unlesbar; module.station verwendet möglicherweise noch modules/v1, die Initialisierung ist veraltet oder die neuen Outputs wurden nicht angewendet. contracts.station.checksum stimmt nicht mit sha256(north.txt) überein oder ist nicht beobachtbar; das Output wird möglicherweise noch nicht unterstützt, ist veraltet oder north.txt wurde nach apply geändert. contracts.depot.release ist nicht 1 oder unlesbar; module.depot wurde möglicherweise zusammen mit module.station aktualisiert oder die Output-Konfiguration bewahrt den alten Vertrag nicht. `tofu output -json contracts`.


      ### Output-Verträge im gespeicherten Plan {#module-upgrade-saved-contracts}


      Im gespeicherten upgrade-plan.json fehlen release 2 und die aktuelle Dateiprüfsumme für module.station; der Plan fehlt möglicherweise, ist ungültig, älter als die Source-Änderung oder nach einer Dateiänderung veraltet. Der gespeicherte upgrade-plan.json bewahrt release 1 für module.depot nicht oder ist unlesbar; er wurde möglicherweise mit beiden Modul-Upgrades oder aus der falschen Konfiguration erzeugt. `jq ''.planned_values.outputs.contracts.value'' upgrade-plan.json`.


      ### Gespeicherte Ressourcenaktionen {#module-upgrade-plan-actions}


      upgrade-plan.json ist unlesbar oder enthält Ressourcenaktionen außer no-op; geänderte Adressen oder Dateiinhalte können beim Modul-Upgrade Erstellungen, Änderungen oder Ersetzungen verursachen. `jq ''.resource_changes[] | {address,actions:.change.actions}'' upgrade-plan.json`.


      ### Aktuellen Plan prüfen {#module-upgrade-live-plan}


      Der aktuelle Plan endete nicht mit Code 0; nicht angewendete Outputs oder Drift sind möglicherweise übrig oder Konfigurations-, Modulinitialisierungs- beziehungsweise Providerfehler verhinderten den Plan. `tofu plan -input=false -detailed-exitcode -no-color`.


      ### Angewendeter State über Modulgrenzen {#module-chain-applied-state}


      Der angewendete State verbindet die benötigten Dateien nicht mehr in verschiedenen Kindmodulen mit erhaltener Verbraucher-ID; ein anderer Aufrufwert, neu erstellte Ressourcen, geänderte State-Inhalte oder unlesbare State-/Pfadbelege können die Ursache sein. Prüfen Sie den State rekursiv: north.txt und delivered.txt müssen verwaltete local_file in verschiedenen Kindmodulen sein und north-ready enthalten. Das Verbrauchermodul erhält außerdem die ursprüngliche terraform_data ID und passende Ausgabe. Die Prüfung löst vollständige Pfade auf; gleiche Dateinamen allein reichen nicht. State-Inhalt und aktueller Plan werden getrennt beobachtet. `tofu show -json`.


      ### Aufrufpläne durch beide Module {#module-chain-caller-contract}


      Ein Aufrufplan schlug fehl oder leitete die Nachricht nicht über beide Modulgrenzen weiter; Eingabe-/Ausgabenamen oder Zeichenkettenwerte sind möglicherweise noch fehlerhaft oder ein Wert wurde fest eingetragen statt weitergeleitet. Der geschützte Modulvertrag liefert Aufrufe für north und south. Jeder temporäre Plan muss message und beide Dateien mit entsprechendem Wert zeigen, einschließlich der nach dem Aufruf benannten Produzentendatei. Diese Pläne werden nicht angewendet; reparieren Sie Zeichenketteneingabe und message Ausgabe ohne Austausch des erhaltenen Verbrauchers. `cat module-contract.json; tofu validate`.


      ### Aktuelles Output und Prüfeingaben {#module-chain-output-observation}


      Das aktuelle message-Output ist nicht north-ready oder die Prüfung endete vor dem Detailmarker; nicht angewendete oder andere Aufrufausgaben, fehlende geschützte Eingaben oder Werkzeug-/Planbeobachtungsfehler können die Ursache sein.  `tofu output -raw message`.


      ### Aktueller Plan ohne Änderungen {#module-chain-live-plan}


      Der aktuelle Plan endete nicht mit Code 0; die reparierte Konfiguration muss möglicherweise noch angewendet werden, Outputs oder Dateien driften oder fehlerhafte Eingaben, Exporte beziehungsweise Provider-Start verhindern einen gültigen Plan.  `tofu plan -input=false -detailed-exitcode -no-color`.


      ### Gespeicherter Standardplan und gemeinsame Eingabe {#fanout-saved-default-contract}


      Der gespeicherte Plan verbindet nicht beide ursprünglichen Dateien über local.region mit north oder die Belege sind unlesbar; fehlende/veraltete fanout-plan.json, eine fest eingetragene Region oder eine fehlerhafte Modulschnittstelle können die Ursache sein. Das Root-Modul verteilt über die stabilen Schlüssel depot und junction. Stellen Sie Wrapper-Eingabe region und verschachtelten notice Aufruf wieder her und reichen Sie local.region im Root-Aufruf weiter; transparente lokale Aliase sind erlaubt. Das gespeicherte Standard-JSON zeigt north:depot und north:junction an den ursprünglichen Dateiadressen. Ein kopiertes Standardliteral belegt die gemeinsame Abhängigkeit nicht. `cat main.tf modules/station/main.tf; cat fanout-plan.json`.


      ### Alternative regionale Aufrufe {#fanout-alternate-caller-plans}


      Ein gelieferter regionaler Aufruf konnte keinen Plan erzeugen, erreichte nicht beide ursprünglichen Stationsdateien oder änderte einen Identitätsbegleiter; fehlende Wrapper-Eingabe/Kindaufruf, Standardliteral, geänderter Begleiter oder unlesbare geschützte/Plan-Daten können die Ursache sein. Die geschützte region-cases.json liefert north und west. Jeder frische schreibgeschützte Plan muss seinen Wert an beide ursprünglichen Dateien weitergeben, während jeder geschützte terraform_data Begleiter no-op mit ursprünglicher ID bleibt. Diese alternativen Pläne werden nicht angewendet. Gespeicherter Standardartefakt und frische Aufrufpläne werden getrennt beobachtet. `cat region-cases.json; tofu validate -no-color`.


      ### Ersetzungsplan vor apply erhalten {#fanout-retained-replacement-plan}


      Der gespeicherte Plan ersetzt nicht genau beide ursprünglichen Routendateien mit ausschließlich no-op/read andernorts oder ist unlesbar; ein neuer Plan nach apply, geänderte Instanzschlüssel oder weitere Änderungen können ihn ungültig machen. Speichern Sie Standardplan und fanout-plan.json vor Anwendung der korrigierten Konfiguration. Beide local_file Routen ersetzen retired Inhalt, während die zwei dauerhaften Identitätsbegleiter unverändert bleiben. Erhalten Sie den Artefakt nach apply; ein frischer leerer Live-Plan prüft eine andere Bedingung. Die Prüfungen beobachten Artefakte und aktuellen State ohne Nachweis einer genauen Befehlshistorie. `cat fanout-plan.json`.


      ### Aktuelle ursprüngliche Dateiadressen {#fanout-current-file-addresses}


      Der aktuelle State enthält nicht beide erfassten Dateiadressen oder deren Belege sind unlesbar; geänderte for_each Schlüssel, entfernte verschachtelte Ressourcen, eine bearbeitete Adressliste oder fehlgeschlagene State-Beobachtung können die benötigten Instanzen verlieren.  `cat original-addresses; tofu state list`.


      ### Genau ursprüngliche Dateien und Begleiter {#fanout-preserved-companion-set}


      Der Adressbeleg oder die genaue Menge verwalteter Objekte weicht von den geschützten Originalen ab, ein Identitätsbegleiter änderte ID/Typ oder Belege waren nicht lesbar; neu erstellte Begleiter oder zusätzliche verwaltete Objekte können die Kontinuität verletzen.  `cat original-addresses station-identities.json; tofu show -json`.


      ### Ausgabepfade verweisen auf vorhandene Dateien {#fanout-output-file-targets}


      Die Ausgabe routes löst nicht genau depot und junction zu ihren vorhandenen Dateien auf oder die Beobachtung schlug fehl; andere/fehlende Schlüssel, falsche exportierte Pfade oder fehlende Dateien können die Ursache sein.  `tofu output -json routes`.


      ### Aktueller Standardplan ohne Änderungen {#fanout-default-no-change-plan}


      Der aktuelle Standardplan endete nicht mit 0; korrigierte Moduleingaben müssen möglicherweise noch angewendet werden, Stationsdateien/Ausgaben weichen ab oder unvollständige Schnittstellen beziehungsweise Providerstart verhindern einen gültigen Plan.  `tofu plan -detailed-exitcode -input=false -no-color`.


      ### Standarddatei für depot {#fanout-depot-file}


      depot.txt liefert nicht north:depot oder ist unlesbar; die gelieferte Region retired, unvollständige Weiterleitung oder ein noch nicht angewendeter korrigierter Plan kann die Datei veraltet belassen.  `cat depot.txt`.


      ### Standarddatei für junction {#fanout-junction-file}


      junction.txt liefert nicht north:junction oder ist unlesbar; die gelieferte Region retired, unvollständige Weiterleitung oder ein noch nicht angewendeter korrigierter Plan kann die Datei veraltet belassen.  `cat junction.txt`.


      ## Probieren Sie es aus


      Öffnen Sie das **opentofu Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Kann der Root die untergeordnete Ressource über seine deklarierte Ausgabe lesen?


      ```bash

      cd ~/lab/examples/module

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > YJa. module.api.name gibt api zurück; Der Status enthält die Ressource unter der Adresse module.api.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-module
terraform-7.3:
  profile: opentofu
  example: module-fleet
  source_hash: 414f68b37a940571a0b24975e0f6111cdfec46aa25f07b8b79ae2d0fff6342b8
  content:
    en: 'for_each creates a separate module instance for each key. Stable keys become part of the resource addresses, so key choice affects future refactoring and state moves.


      ### Separate module instances {#per-station-module-instances}


      In quest 023, `module.stations` calls `./modules/notice` for the keys `north` and `south`, passing each key as the `station` input. Each key has its own `local_file.notice` state address. After apply, check both keyed addresses, `north.txt` containing `north-ready`, `south.txt` containing `south-ready`, and a detailed plan exit code 0. A single module instance cannot satisfy both addresses. If a check stops before reporting a condition, verify that the workstation can start Python and load the probe helper.


      ## Try it


      Open the **opentofu Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Do api and worker share one child resource address?


      ```bash

      cd ~/lab/examples/module-fleet

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Expected result

      > No. Each key appears in its own module address and output.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'For_each создаёт отдельный экземпляр модуля для каждого ключа. Ключ входит в адрес ресурса, поэтому его выбор влияет на последующие переименования и переносы state.


      ### Отдельные экземпляры модуля {#per-station-module-instances}


      В квесте 023 `module.stations` вызывает `./modules/notice` для ключей `north` и `south`, передавая каждый ключ во вход `station`. У каждого ключа свой адрес `local_file.notice` в state. После применения проверьте оба адреса с ключами, `north.txt` со значением `north-ready`, `south.txt` со значением `south-ready` и код выхода 0 подробного plan. Один экземпляр модуля не может дать оба адреса. Если проверка завершается до вывода результата по условию, проверьте запуск Python и загрузку модуля проверки на рабочей станции.


      ## Попробуйте


      Откройте лабораторию **opentofu**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Используют ли api и worker один адрес дочернего ресурса?


      ```bash

      cd ~/lab/examples/module-fleet

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Каждый ключ входит в собственный адрес модуля и output.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'for_each tworzy oddzielną instancję modułu dla każdego klucza. Stabilne klucze stają się częścią adresów zasobów, więc wybór klucza wpływa na przyszłą refaktoryzację i ruchy state.


      ### Osobne instancje modułu {#per-station-module-instances}


      W zadaniu 023 `module.stations` wywołuje `./modules/notice` dla kluczy `north` i `south`, przekazując każdy klucz jako wejście `station`. Każdy klucz ma osobny adres `local_file.notice` w state. Po zastosowaniu sprawdź oba adresy z kluczami, `north.txt` z wartością `north-ready`, `south.txt` z wartością `south-ready` oraz kod wyjścia 0 szczegółowego planu. Jedna instancja modułu nie może zapewnić obu adresów. Jeśli sonda kończy się bez wyniku warunku, sprawdź uruchamianie Pythona i ładowanie modułu sondy na stacji roboczej.


      ## Wypróbuj


      Otwórz laboratorium **opentofu** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy api i worker mają wspólny adres zasobu podrzędnego?


      ```bash

      cd ~/lab/examples/module-fleet

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Każdy klucz pojawia się we własnym adresie modułu i output.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'for_each crea una instancia de módulo separada para cada clave. Las claves estables pasan a formar parte de las direcciones de recursos, por lo que la elección de claves afecta la refactorización futura y los movimientos de estado.


      ### Instancias de módulo separadas {#per-station-module-instances}


      En el ejercicio 023, `module.stations` llama a `./modules/notice` para las claves `north` y `south`, pasando cada clave como entrada `station`. Cada clave tiene su propia dirección `local_file.notice` en state. Tras aplicar, comprueba ambas direcciones con clave, `north.txt` con `north-ready`, `south.txt` con `south-ready` y el código de salida 0 de un plan detallado. Una sola instancia del módulo no puede satisfacer ambas direcciones. Si la prueba se detiene antes de informar de una condición, comprueba que Python arranque y cargue el módulo de prueba en la estación.


      ## Pruébalo


      Abra el **opentofu Lab** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿api y worker comparten una dirección de recurso secundario?


      ```bash

      cd ~/lab/examples/module-fleet

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. Cada clave aparece en su propia dirección y salida de módulo.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh`, luego `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'for_each erstellt für jeden Schlüssel eine separate Modulinstanz. Stabile Schlüssel werden Teil der Ressourcenadressen, sodass die Wahl des Schlüssels zukünftige Refactoring- und Statusverschiebungen beeinflusst.


      ### Getrennte Modulinstanzen {#per-station-module-instances}


      In Aufgabe 023 ruft `module.stations` `./modules/notice` für die Schlüssel `north` und `south` auf und übergibt jeden Schlüssel als Eingabe `station`. Jeder Schlüssel hat eine eigene `local_file.notice`-Adresse im State. Prüfe nach der Anwendung beide Adressen mit Schlüssel, `north.txt` mit `north-ready`, `south.txt` mit `south-ready` und Exit-Code 0 eines detaillierten Plans. Eine einzelne Modulinstanz kann nicht beide Adressen erfüllen. Falls die Prüfung vor einem Ergebnis abbricht, prüfen Sie Python und das Laden des Prüfmoduls am Arbeitsplatz.


      ## Probieren Sie es aus


      Öffnen Sie das **opentofu Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Teilen sich api und worker eine untergeordnete Ressourcenadresse?


      ```bash

      cd ~/lab/examples/module-fleet

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Jeder Schlüssel erscheint in seiner eigenen Moduladresse und Ausgabe.


      ## Beobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
