    pl: 'Importy statyczne rozszerzają zadania wcześniej; dynamiczny obejmuje wybór zadań podczas wykonywania. Tagi w include wybierają instrukcję include, więc nieoznaczone elementy podrzędne nadal można pomijać. Role pakują zadania za pomocą defaults, handlers i szablonów w ramach umowy współdzielonej.


      W zadaniu 046 tag `inspect` na zadaniu dostarczającym copy zmieniłby poprawny baner podczas inspekcji. Pozostaw zadaniu copy tylko tag `deploy`, a zadaniu stat tag `inspect`. Wyświetl wybrane zadania, wykonaj inspekcję i sprawdź jej recap oraz niezmieniony baner `north-46` na trzech hostach; sama nazwa tagu nie czyni zadania tylko do odczytu. Zachowaj jeden play bez dziedziczonych tagów i dwa dostarczone zadania; nie dodawaj pre/post tasks, roles ani handlers.


      Dla zadania 058: Złożona rola musi spełniać wymagania każdego kontekstu wywołania. Wejścia roli i wykonanie zależności mają różne zakresy; poprawne wywołanie domyślne nie dowodzi, że inne wywołanie z parametrami utworzy swój wynik i osiągnie zbieżność. Sprawdź domyślne dostarczanie i odtwórz zadeklarowane przypadki w odizolowanym lokalnym play bez podnoszenia uprawnień. Porównaj oba wyniki i zachowane dane, powtórz zastosowanie i wymagaj podsumowania bez zmian.


      ### Zapis rzeczywistej kontroli {#inspection-evidence}


      inspection.log nie istnieje lub jest pusty; kontrola mogła nie zostać zapisana z ~/quest albo zakończyła się przed wygenerowaniem wyjścia. `ansible-playbook --tags inspect rollout.yml > inspection.log`.


      ### Tagi odczytu i migawki {#inspection-unchanged}


      Kontrola zmieniła banner lub nie zweryfikowała i nie odtworzyła migawki; inspect może nadal wybierać copy albo zawiódł SSH, playbook, limit czasu lub sprzątanie. Przed uruchomieniem wyświetl zadania wybrane przez --tags inspect. Początkowo copy i stat mają inspect; copy może zmienić dane i uprawnienia. Kontrola porównuje bajty, tryb, właściciela, czasy i cel symlink przed i po na wszystkich hostach. Błąd uruchomienia, obserwacji SSH lub odtwarzania też oznacza niepowodzenie i sam nie dowodzi złego tagu.


      ### Recap jako osobna obserwacja {#inspection-recap}


      Bieżąca kontrola zawiodła lub nie dało się sprawdzić recap; błędy playbooka, SSH, limit czasu, odtwarzanie lub niejednoznaczne pola recap mogą blokować pełny wynik. app1 nie ma jednoznacznego recap z changed=0, unreachable=0 i failed=0; przyczyną mogą być wybrane zadania zmieniające stan, błędy SSH lub brakujące albo błędne liczniki. Kontrola sama uruchamia inspect; inspection.log nie jest jej źródłem recap. Każdy app1, app2 i app3 potrzebuje liczbowych zer changed/unreachable/failed; brak hosta lub licznika nie jest zerem. Parser obsługuje JSON, runner i tekst, ale powtórzone lub niejednoznaczne pola nie potwierdzają sukcesu. Osobno porównaj pliki i zgłoszone changed=0.


      ### Uruchomienie kontroli inspection {#inspection-inputs}


      Kontrola niezmienionych bannerów zatrzymała się przed diagnostyką Python; ~/quest, start Pythona lub dane wejściowe mogą być niedostępne. Kontrola recap zatrzymała się przed diagnostyką Python; ~/quest, Python lub helper dq_check może być niedostępny przed uruchomieniem kontroli. Grupa poleceń zawiodła bez diagnostyki hostów; obserwacja mogła zostać przerwana przed zgłoszeniem wyników. Grupy treści rozwijają namespace osobno dla każdego hosta: brak DQ_NAMESPACE zwykle daje banner_1, banner_2 i banner_3, a nie rezerwowy fallback bez markera. Przywróć dane stacji i odróżnij przerwaną obserwację od potwierdzonej różnicy pliku.


      ### Zachowane bannery na każdym hoście {#inspection-banner-content}


      app1 nie zwrócił north-46 z bannera lub SSH zawiódł; wybrane zadanie deploy mogło nadpisać plik albo host jest niedostępny. `ssh -n -o BatchMode=yes -p 2222 root@app1-"${DQ_NAMESPACE#dq-}" ''cat /srv/site/banner.txt''`. Brak lub błędna wartość DQ_NAMESPACE może też uniemożliwić obserwację hosta przez SSH. Powtórz kontrolę dla app2 i app3; wszystkie trzy bannery muszą zachować north-46.


      ### Zależności powtórzonych wywołań roli {#role-repeated-caller-entry}


      Ponowne wykonanie roli zakończyło się błędem; banner może nie deklarować zależności base, tworzyć błędny katalog, pomijać powtórzoną zależność lub nie działać dla lokalnego nieuprzywilejowanego wywołania. Kontrakt wywołuje roles/banner dwa razy w jednym lokalnym nieuprzywilejowanym play z różnymi install_root i banner_route, następnie powtarza cały play. Zależność base musi tworzyć katalog każdego wywołania: allow_duplicates: false może pomijać drugą zależność nawet po dodaniu jej do metadanych banner. Zachowaj domyślny wynik hostów i niezależność wywołań. `cat role-contract.json roles/banner/meta/main.yml roles/base/meta/main.yml; ansible-playbook rollout.yml --list-tasks`.


      ### Ścieżki i wartości poszczególnych wywołań {#role-caller-specific-output}


      Brakuje wyniku wywołania lub zawiera inną trasę; wpisane na stałe /srv/routes lub north-ready albo pominięta zależność drugiego wywołania mogą ignorować install_root i banner_route.  `cat roles/banner/defaults/main.yml roles/base/tasks/main.yml roles/banner/tasks/main.yml`.


      ### Zachowanie danych poza wynikiem roli {#role-preserve-caller-data}


      Plik kontrolny lub istniejące dane w katalogu wywołania zmieniły się lub zniknęły; szerokie czyszczenie lub wymiana całego katalogu może usunąć dane poza plikiem current należącym do roli.  `cat roles/base/tasks/main.yml roles/banner/tasks/main.yml`.


      ### Zbieżność drugiego zastosowania {#role-second-run-convergence}


      Drugie wykonanie nie zgłosiło localhost z zerowymi changed, failed i unreachable; bezwarunkowe zapisy, nieidempotentne zadania lub błędy wykonania hosta mogą uniemożliwiać zbieżność. Izolowane wykonanie wymaga recap z localhost przy drugim zastosowaniu i changed=0, failed=0, unreachable=0 dla każdego zgłoszonego hosta. Udane domyślne wykonania pomagają w obserwacji, lecz nie zastępują dwóch różnych wywołań. Błędny recap należy do błędu obserwacji. `ansible-playbook rollout.yml; ansible-playbook rollout.yml`.


      ### Wykonanie w limicie obserwacji {#role-bounded-replay}


      Proces wykonania roli przekroczył pozostały czas; wolne zadania lub oczekiwanie na niedostępne usługi zewnętrzne mogą wyczerpać limit dwóch wykonań.  `cat roles/base/tasks/main.yml roles/banner/tasks/main.yml`.


      ### Obserwacja wyników i recap {#role-replay-observation}


      Nie dało się obserwować roli; brak chronionego kontraktu lub katalogów wywołań, nieczytelny wynik, błędny recap, błędy narzędzi lub wyczerpany czas blokują ocenę.  `cat role-contract.json; command -v ansible-playbook`.


      ### Start kontroli hostów i roli {#role-probe-startup}


      Łączna kontrola hostów i roli zatrzymała się bez szczegółowego markera; brak katalogu roboczego, Python lub modułu albo przerwana ograniczona czasowo grupa SSH może blokować wykonanie roli.  `command -v python3; command -v ssh`.


      ### Zachowanie domyślnego dostarczenia na hosty {#role-default-fleet-result}


      app1 nie udostępnia north-ready w /srv/routes/current; brak zależności base lub błąd dostarczenia może pozostawić brak domyślnej trasy, a błędy SSH lub namespace też blokują obserwację.  `ansible fleet -m ansible.builtin.command -a "cat /srv/routes/current"`. Powtórz obserwację na app2 i app3.


      ## Wypróbuj


      Otwórz laboratorium **ansible** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy --tags dynamic koniecznie uruchamia każde zadanie w oznaczonym include?


