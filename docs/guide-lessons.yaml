terraform-7.4:
  profile: opentofu
  example: addresses
  source_hash: 6cd98d5277d2550678691a836f5357955e046a6ddfd3adfa5458a04a78b9eebf
  content:
    en: 'A rename in code alone looks like removing one address and adding another. A moved block declares that both addresses refer to the same existing object. State removal is a different operation: it forgets ownership rather than destroying the object.


      ## Try it


      Open the **opentofu Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Will a declared move recreate the terraform_data object?


      ```bash

      cd ~/lab/examples/addresses

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The plan records the address move with a no-op resource action, and the ID stays the same.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Простое переименование в коде выглядит как удаление старого адреса и создание нового. Moved объявляет, что это один существующий объект. Удаление привязки из state — другая операция: забыть владение, а не уничтожить объект.


      ## Попробуйте


      Откройте лабораторию **opentofu**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Пересоздаст ли объявленный moved объект terraform_data?


      ```bash

      cd ~/lab/examples/addresses

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Plan показывает перенос адреса с действием no-op, ID сохраняется.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
  full_example: full-addresses
helm-3:
  profile: helm
  example: values
  source_hash: 0e47b10595ebc049c2e38ba78853b019c6942dd652f3e26afbd7520950793cb3
  content:
    en: 'A chart renders templates from merged values. Later files override earlier files; lists are replaced rather than extended element by element. --set-string, --set-json and --set-file express different input forms.


      ## Try it


      Open the **helm Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Will [a, b] plus the later list [c] become [a, b, c]?


      ```bash

      cd ~/lab/examples/values

      ls chart

      cat base.yaml override.yaml

      bash run.sh

      cat merged.yaml

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The rendered list is [c]. The check reads actual rendered YAML and also verifies string, JSON and file inputs.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Чарт рендерит шаблоны из объединённых values. Поздний файл перекрывает ранний; списки заменяются целиком. --set-string, --set-json и --set-file задают разные формы входа.


      ## Попробуйте


      Откройте лабораторию **helm**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Превратятся ли [a, b] и более поздний [c] в [a, b, c]?


      ```bash

      cd ~/lab/examples/values

      ls chart

      cat base.yaml override.yaml

      bash run.sh

      cat merged.yaml

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Итоговый список — [c]. Проверка читает реальный YAML и проверяет входы string, JSON и file.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
  full_example: full-values
helm-8:
  profile: helm
  example: releases
  source_hash: 13b7edb4e6eb04aa96ab15622cfc19fc7cab0f9ca0b7186e3a3fb2436eba20ea
  content:
    en: 'Helm records release revisions. An upgrade applies new rendered resources; rollback applies an older desired state and records a new revision. Waiting for readiness and restoring a failed upgrade are explicit policies. External data is not automatically rolled back.


      ## Try it


      Open the **helm Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** After install, upgrade and rollback to revision 1, will the current revision number become 1 again?


      ```bash

      cd ~/lab/examples/releases

      cat chart/values.yaml

      bash run.sh

      helm history demo -n lab-helm

      bash check.sh

      ```


      > [!question]- Expected result

      > No. A successful rollback creates revision 3. The second check deliberately fails an image upgrade and verifies the restored Deployment.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Helm хранит ревизии релиза. Upgrade применяет новые ресурсы, rollback применяет прежнее желаемое состояние и создаёт новую ревизию. Ожидание готовности и возврат при отказе задаются явно. Внешние данные автоматически не откатываются.


      ## Попробуйте


      Откройте лабораторию **helm**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** После install, upgrade и rollback к ревизии 1 текущий номер снова станет 1?


      ```bash

      cd ~/lab/examples/releases

      cat chart/values.yaml

      bash run.sh

      helm history demo -n lab-helm

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Успешный rollback создаёт ревизию 3. Затем проверка намеренно ломает image upgrade и проверяет восстановленный Deployment.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
  full_example: full-releases
cicd-gitops-3:
  profile: gitops
  example: sync
  source_hash: 2b0669e4c37ceb01dad06dd24aee99c4ff73151e7787ccad94648492a58639bf
  content:
    en: 'Repo-server renders the chosen Git revision. The application controller compares desired and live objects, then performs sync. Phases order hooks before ordinary resources; waves order work inside a phase. A final Synced label alone does not prove the order.


      ## Try it


      Open the **gitops Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Can a normal resource in wave -1 run before an unfinished PreSync hook?


      ```bash

      cd ~/lab/examples/sync

      bash run.sh

      source ~/lab/platform.env

      kubectl -n "$LAB_NAMESPACE" get application lab-guide

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The check compares actual completion and creation timestamps, then checks Deployment readiness.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Repo-server рендерит выбранную ревизию Git. Application controller сравнивает desired и live, затем выполняет sync. Фазы ставят hooks перед обычными ресурсами, waves задают порядок внутри фазы. Одна итоговая отметка Synced не доказывает порядок.


      ## Попробуйте


      Откройте лабораторию **gitops**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Может ли обычный ресурс wave -1 обойти незавершённый PreSync hook?


      ```bash

      cd ~/lab/examples/sync

      bash run.sh

      source ~/lab/platform.env

      kubectl -n "$LAB_NAMESPACE" get application lab-guide

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Проверка сравнивает фактические времена завершения и создания, затем готовность Deployment.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
  full_example: full-sync
cicd-gitops-8:
  profile: gitops
  example: drift
  source_hash: c8f5061dd19632351f0743b81abe156f3f80528fba2c0d8df768c022bd6774fd
  content:
    en: 'Self-heal reconciles a live edit back to Git. Prune allows deletion of managed objects removed from Git. These are separate controls: observing a new revision or correcting a value does not prove that deletion is enabled.


      ## Try it


      Open the **gitops Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Will selfHeal=true alone remove a ConfigMap deleted from Git?


      ```bash

      cd ~/lab/examples/drift

      bash run.sh

      source ~/lab/platform.env

      kubectl -n "$LAB_NAMESPACE" get application lab-guide -o yaml

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The ConfigMap remains with prune disabled, then disappears when prune is explicitly enabled.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Self-heal возвращает ручное изменение к Git. Prune разрешает удаление управляемых объектов, исчезнувших из Git. Это разные настройки: новая ревизия и исправленное значение ещё не доказывают разрешение удаления.


      ## Попробуйте


      Откройте лабораторию **gitops**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Удалит ли один selfHeal=true ConfigMap, исчезнувший из Git?


      ```bash

      cd ~/lab/examples/drift

      bash run.sh

      source ~/lab/platform.env

      kubectl -n "$LAB_NAMESPACE" get application lab-guide -o yaml

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. При выключенном prune ConfigMap сохраняется и исчезает после явного включения prune.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
  full_example: full-drift
