  source_hash: 0228d7ffa09836c70c2ea8edbb3b02698d2e494b5a1998aeeef7912f0036e04c
  content:
    en: 'for_each creates a separate module instance for each key. Stable keys become part of the resource addresses, so key choice affects future refactoring and state moves.


      ## Try it


      Open the **opentofu Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


