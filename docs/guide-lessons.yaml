terraform-2:
  profile: opentofu
  example: hcl
  source_hash: 004394b5b12cf74b6106c5f21a2119ea4f51da156f4afc677130beeb0243f35c
  content:
    en: 'HCL describes inputs, expressions and managed objects. This local example filters disabled services before for_each creates instances. A validation rule rejects a known invalid input before it becomes a resource change.


      A keyed collection has separate instance identity and payload. A stable key does not prevent replacement if the payload changes. Compare the desired map, existing provider IDs and proposed values before adding an instance. Input types describe request shape; validation must also enforce relationships such as demand versus pool capacity. Use accepted cases as positive controls as well as rejecting unsafe cases: a broken configuration that rejects every request is not a valid policy.


      In quest 039, a number type permits fractions, so the `departures` validation must combine bounds 1 through 6 with an integer test. Keep the supplied value 3 and apply it. Separate plans for 0, 7 and 2.5 must fail with `departures must be an integer from 1 to 6`; check `timetable.txt`, the numeric output and a final detailed plan exit code 0. The negative plans test the contract without applying unsafe values.


      ### Typed notice inputs and outputs {#notice-input-types}


      In quest 013, `terraform.tfvars` supplies `station = "north"` and `departures = 4`. The `station` input must have type `string`, while `departures` remains a number; the local file combines them as `north:4`. After apply, `tofu console` evaluating `type(var.station)` should print `string`; `tofu output -raw station` should show `north`, and `tofu output -json departures` should show the number `4`. Check that `tofu state list` includes `local_file.notice` and a final `tofu plan -input=false -detailed-exitcode -no-color` exits 0.


      ### Route keys and content {#route-map-content}


      In quest 033, each.key selects the filename; each.value supplies the content. Preserve north=open and south=held, add east=open in terraform.tfvars, review the plan and apply. Using the key as content writes route names instead. Read all three files; missing or unreadable files do not prove delivery.


      ### Applied route output and bindings {#route-map-state}


      In quest 033, tofu output -json routes reads applied state, not the unapplied caller map. It should have exactly north, south and east, with a string east ID. Compare current-ids.json with the direct output if capture or JSON parsing fails. Separately, tofu show -json must contain managed local_file targets for all three files. If that probe stops without a state result, verify Python, dq_check and readable OpenTofu JSON before changing state.


      ### Retain existing route IDs {#route-retained-ids}


      In quest 033, original-ids.json records the applied north and south IDs. Stable for_each keys alone do not preserve provider IDs if content or filenames change. Compare those entries with current-ids.json after a successful output read; first resolve unreadable or malformed comparison files. Keep existing payloads while adding east, rather than replacing the trusted record.


      ### A final route plan {#route-final-plan}


      After quest 033 recovery, run tofu plan -input=false -detailed-exitcode -no-color visibly. Exit 2 indicates pending map or content changes; exit 1 indicates a planning error. Review the proposed changes or reported configuration, provider and state errors. A successful output or matching files alone do not prove exit 0.


      ### Reject the unsupported input values {#departures-negative-plans}


      In quest 039, number permits fractions. Validate both the 1–6 bounds and integrality. Plans for 0, 7 and 2.5 must fail with departures must be an integer from 1 to 6; a syntax/provider error is not that validation result. invalid-plan.txt holds the last attempted observation. If trials cannot complete, inspect report writability and Python/tofu startup before changing the rule.


      ### Apply the normal departure value {#departures-applied-result}


      In quest 039, retain departures=3 in terraform.tfvars and apply the reviewed configuration. Read timetable.txt and tofu output -json departures: expect file text 3 and the number 3, not a string. A changed or unapplied caller/output can leave stale results. Resolve missing/unreadable files and output/JSON errors separately from value mismatches.


      ### Check the normal-input plan {#departures-clean-plan}


      In quest 039, negative-input plans do not apply configuration. Return to the supplied normal input and run tofu plan -input=false -detailed-exitcode -no-color visibly. Exit 2 means pending changes; exit 1 means planning failed. Review the changes or configuration/provider/state error. The final normal plan must exit 0 without changes.


      ### Unsafe replica acceptance and probe startup {#capacity-validation-start}


      An invalid replica value was accepted, or the validation probe stopped before its detailed marker; the supplied replicas >= 0 rule admits unsafe values, while missing protected inputs or tool startup can also prevent observation.  `cat main.tf terraform.tfvars capacity-contract.json; tofu plan -input=false -var=replicas=0`.


      ### Valid requests and capacity rejection {#capacity-valid-and-unsafe-cases}


      A valid request could not plan or an unsafe request planned successfully; incomplete replica bounds, pool validation or the relationship between replicas and available slots may explain it. A blanket plan failure also rejects valid callers. The protected contract requires integer replicas from 1 through 3, a nonempty distinct zone list, positive integer slots_per_zone and replicas no larger than total slots. Check all accepted and rejected cases; a validation that only rejects requests is insufficient. These alternate plans are not applied. `cat capacity-contract.json; tofu validate`.


      ### Applied replica file {#capacity-applied-replica-file}


      replicas.txt does not contain 2 or cannot be read; the supplied zero-replica configuration may still be applied, or corrected inputs have not been delivered to the managed file.  `cat replicas.txt; cat terraform.tfvars`.


      ### Safe request with no pending changes {#capacity-live-no-change-plan}


      The plan for replicas=2 did not exit 0; configuration may still need applying, the managed file or recorded values may drift, or invalid pool inputs and tool/provider errors may prevent planning.  `tofu plan -input=false -var=replicas=2 -detailed-exitcode`.


      ## Try it


      Open the **opentofu Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** How many instances will a map with one enabled and one disabled service create?


      ```bash

      cd ~/lab/examples/hcl

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Expected result

      > One: api. The output is dev/api; environment=production fails validation.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'HCL описывает входы, выражения и управляемые объекты. Локальный пример фильтрует выключенные сервисы до создания экземпляров через for_each. Validation отвергает известное неверное значение до изменения ресурса.


      У коллекции с ключами раздельны идентичность экземпляра и полезные данные. Стабильный ключ не предотвращает замену при изменении данных. До добавления экземпляра сравните требуемую карту, существующие provider ID и планируемые значения. Типы описывают структуру запросов, а validation должна также проверять связи вроде спроса и ёмкости pool. Проверяйте допустимые варианты как положительный контроль вместе с отклонением небезопасных: сломанная конфигурация, отклоняющая всё, не является корректной политикой.


      В квесте 039 тип number допускает дроби, поэтому validation для `departures` должна сочетать границы от 1 до 6 с проверкой целого числа. Сохраните заданное значение 3 и примените его. Отдельные планы для 0, 7 и 2.5 должны завершаться ошибкой с `departures must be an integer from 1 to 6`; проверьте `timetable.txt`, числовой output и код выхода 0 итогового подробного plan. Негативные планы проверяют контракт без применения небезопасных значений.


      ### Типы входов и выходов уведомления {#notice-input-types}


      В квесте 013 файл `terraform.tfvars` задает `station = "north"` и `departures = 4`. Вход `station` должен иметь тип `string`, а `departures` остается числом; локальный файл объединяет их как `north:4`. После применения выражение `type(var.station)` в `tofu console` должно вывести `string`; `tofu output -raw station` должен показать `north`, а `tofu output -json departures` — число `4`. Убедитесь, что `tofu state list` содержит `local_file.notice`, а итоговый `tofu plan -input=false -detailed-exitcode -no-color` завершается с кодом 0.


      ### Ключи и содержимое маршрутов {#route-map-content}


      В квесте 033 each.key задаёт имя файла, а each.value — содержимое. Сохраните north=open и south=held, добавьте east=open в terraform.tfvars, изучите план и примените его. Использование ключа как содержимого записывает имена маршрутов. Прочитайте все три файла: отсутствие файла или ошибка чтения не подтверждают доставку.


      ### Применённый выход и привязки маршрутов {#route-map-state}


      В квесте 033 tofu output -json routes читает применённое состояние, а не неприменённую карту входных данных. Нужны ровно north, south и east со строковым ID east. При ошибке записи или разбора JSON сравните current-ids.json с прямым выходом. Отдельно tofu show -json должен содержать управляемые local_file для всех трёх путей. Если проверка прервалась без результата, проверьте Python, dq_check и читаемый JSON OpenTofu до изменения state.


      ### Сохранение исходных ID маршрутов {#route-retained-ids}


      В квесте 033 original-ids.json хранит применённые ID north и south. Стабильные ключи for_each сами по себе не сохраняют ID провайдера при изменении содержимого или путей. Сравните записи с current-ids.json после успешного чтения выхода; сначала устраните ошибки чтения или структуры файлов сравнения. Добавляя east, сохраните прежнее содержимое, а не заменяйте доверенную запись.


      ### Итоговый план маршрутов {#route-final-plan}


      После восстановления в квесте 033 запустите tofu plan -input=false -detailed-exitcode -no-color с видимым выводом. Код 2 означает оставшиеся изменения карты или содержимого; код 1 — ошибку планирования. Изучите изменения либо сообщения о конфигурации, провайдере и state. Успешный выход или совпадающие файлы сами по себе не доказывают код 0.


      ### Отклонение неподдерживаемых значений {#departures-negative-plans}


      В квесте 039 number допускает дроби. Проверяйте границы 1–6 и целочисленность. Планы для 0, 7 и 2.5 должны отказать с departures must be an integer from 1 to 6; ошибка синтаксиса/провайдера не доказывает такую валидацию. invalid-plan.txt содержит последнее предпринятое наблюдение. Если испытания прерваны, проверьте возможность записи отчёта и запуск Python/tofu до изменения правила.


      ### Применение обычного значения departures {#departures-applied-result}


      В квесте 039 сохраните departures=3 в terraform.tfvars и примените проверенную конфигурацию. Прочитайте timetable.txt и tofu output -json departures: ожидаются текст файла 3 и число 3, не строка. Изменённые или неприменённые вход/выход могут оставить старые результаты. Отделяйте отсутствие/нечитаемость файлов и ошибки выхода/JSON от несовпадения значений.


      ### Проверка плана обычного ввода {#departures-clean-plan}


      В квесте 039 планы отрицательных примеров не применяют конфигурацию. Вернитесь к обычному входу и запустите tofu plan -input=false -detailed-exitcode -no-color с видимым выводом. Код 2 означает оставшиеся изменения; код 1 — ошибку планирования. Изучите изменения или ошибку конфигурации/провайдера/state. Итоговый обычный план должен дать код 0 без изменений.


      ### Принятие опасных значений и запуск проверки {#capacity-validation-start}


      Принято недопустимое число реплик либо проверка остановилась до подробного маркера: выданное правило replicas >= 0 пропускает небезопасные значения; защищённые данные или запуск инструментов также могут быть недоступны.  `cat main.tf terraform.tfvars capacity-contract.json; tofu plan -input=false -var=replicas=0`.


      ### Допустимые запросы и отказ по ёмкости {#capacity-valid-and-unsafe-cases}


      Допустимый запрос не строит план либо небезопасный запрос принят: причиной могут быть неполные ограничения числа реплик, проверки пула или связи реплик с доступными слотами. Безусловный сбой плана отвергает и допустимые вызовы. Защищённый контракт требует целые replicas от 1 до 3, непустой список разных зон, положительные целые slots_per_zone и число реплик не больше суммы слотов. Проверьте все допустимые и недопустимые варианты: только отказов недостаточно. Альтернативные планы не применяются. `cat capacity-contract.json; tofu validate`.


      ### Применённый файл реплик {#capacity-applied-replica-file}


      replicas.txt не содержит 2 либо недоступен: ещё может быть применена выданная конфигурация с нулём реплик или исправленные входы не доставлены в управляемый файл.  `cat replicas.txt; cat terraform.tfvars`.


      ### Безопасный запрос без ожидающих изменений {#capacity-live-no-change-plan}


      План для replicas=2 не вернул 0: конфигурацию ещё нужно применить, файл или записанные значения могли разойтись либо некорректный пул и ошибки инструментов или провайдера мешают плану.  `tofu plan -input=false -var=replicas=2 -detailed-exitcode`.


      ## Попробуйте


      Откройте лабораторию **opentofu**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Сколько экземпляров создаст map с одним включённым и одним выключенным сервисом?


      ```bash

      cd ~/lab/examples/hcl

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Один: api. Output содержит dev/api; environment=production не проходит validation.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'HCL opisuje dane wejściowe, wyrażenia i zarządzane obiekty. Ten lokalny przykład filtruje wyłączone usługi, zanim for_each utworzy instancje. Reguła validation odrzuca znane nieprawidłowe dane wejściowe, zanim staną się one zmianą zasobu.


      Kolekcja z kluczami rozdziela tożsamość instancji i dane. Stały klucz nie zapobiega zastąpieniu, jeśli zmieniają się dane. Przed dodaniem instancji porównaj żądaną mapę, istniejące ID dostawcy i wartości planu. Typy opisują kształt żądań, a walidacja musi też sprawdzać relacje, np. zapotrzebowanie i pojemność pool. Używaj poprawnych przypadków jako kontroli dodatniej obok odrzucania niebezpiecznych: zepsuta konfiguracja odrzucająca wszystko nie jest poprawną polityką.


      W zadaniu 039 typ number dopuszcza ułamki, więc walidacja `departures` musi łączyć granice od 1 do 6 z testem liczby całkowitej. Zachowaj podaną wartość 3 i zastosuj ją. Osobne plany dla 0, 7 i 2.5 muszą zakończyć się błędem `departures must be an integer from 1 to 6`; sprawdź `timetable.txt`, liczbowe wyjście oraz kod wyjścia 0 końcowego szczegółowego planu. Negatywne plany sprawdzają kontrakt bez stosowania niebezpiecznych wartości.


      ### Typy wejść i wyjść powiadomienia {#notice-input-types}


      W zadaniu 013 plik `terraform.tfvars` podaje `station = "north"` i `departures = 4`. Wejście `station` musi mieć typ `string`, a `departures` pozostaje liczbą; lokalny plik łączy je jako `north:4`. Po zastosowaniu wyrażenie `type(var.station)` w `tofu console` powinno wypisać `string`; `tofu output -raw station` powinno pokazać `north`, a `tofu output -json departures` liczbę `4`. Sprawdź, czy `tofu state list` zawiera `local_file.notice`, a końcowy `tofu plan -input=false -detailed-exitcode -no-color` kończy się kodem 0.


      ### Klucze i treść tras {#route-map-content}


      W zadaniu 033 each.key wybiera nazwę pliku, a each.value dostarcza treść. Zachowaj north=open i south=held, dodaj east=open w terraform.tfvars, przejrzyj plan i zastosuj go. Użycie klucza jako treści zapisuje nazwy tras. Odczytaj wszystkie trzy pliki; brak pliku lub błąd odczytu nie dowodzi dostarczenia.


      ### Zastosowany wynik i powiązania tras {#route-map-state}


      W zadaniu 033 tofu output -json routes odczytuje zastosowany stan, nie niezastosowaną mapę wejściową. Potrzebne są dokładnie north, south i east ze stringowym ID east. Przy błędzie zapisu lub parsowania JSON porównaj current-ids.json z bezpośrednim wynikiem. Osobno tofu show -json musi zawierać zarządzane cele local_file dla wszystkich trzech plików. Gdy sonda nie zwraca wyniku, sprawdź Python, dq_check i czytelny JSON OpenTofu przed zmianą stanu.


      ### Zachowanie istniejących ID tras {#route-retained-ids}


      W zadaniu 033 original-ids.json zapisuje zastosowane ID north i south. Stałe klucze for_each nie zachowają ID dostawcy przy zmianie treści lub nazw plików. Porównaj wpisy z current-ids.json po poprawnym odczycie wyniku; najpierw wyjaśnij nieczytelne lub błędne pliki porównania. Zachowaj istniejącą treść, dodając east, zamiast zastępować zaufany zapis.


      ### Końcowy plan tras {#route-final-plan}


      Po naprawie w zadaniu 033 uruchom tofu plan -input=false -detailed-exitcode -no-color z widocznym wynikiem. Kod 2 oznacza oczekujące zmiany mapy lub treści; kod 1 oznacza błąd planowania. Sprawdź zmiany lub błędy konfiguracji, dostawcy i stanu. Poprawny wynik output lub zgodne pliki nie dowodzą kodu 0.


      ### Odrzucenie nieobsługiwanych wartości {#departures-negative-plans}


      W zadaniu 039 number dopuszcza ułamki. Waliduj granice 1–6 i całkowitość. Plany dla 0, 7 i 2.5 muszą zawieść z departures must be an integer from 1 to 6; błąd składni/dostawcy nie jest tym wynikiem walidacji. invalid-plan.txt zawiera ostatnią podjętą obserwację. Jeśli próby nie kończą się, sprawdź zapis raportu i start Python/tofu przed zmianą reguły.


      ### Zastosowanie zwykłej wartości departures {#departures-applied-result}


      W zadaniu 039 zachowaj departures=3 w terraform.tfvars i zastosuj sprawdzoną konfigurację. Odczytaj timetable.txt i tofu output -json departures: oczekuj tekstu pliku 3 oraz liczby 3, nie stringa. Zmienione lub niezastosowane wejście/wynik może pozostawić stare rezultaty. Oddziel brak/nieczytelność plików i błędy wyniku/JSON od niezgodnych wartości.


      ### Kontrola planu zwykłego wejścia {#departures-clean-plan}


      W zadaniu 039 plany negatywnych wejść nie stosują konfiguracji. Wróć do zwykłego wejścia i uruchom tofu plan -input=false -detailed-exitcode -no-color z widocznym wynikiem. Kod 2 oznacza oczekujące zmiany; kod 1 błąd planowania. Sprawdź zmiany lub błąd konfiguracji/dostawcy/stanu. Końcowy zwykły plan musi zwrócić kod 0 bez zmian.


      ### Akceptacja niebezpiecznych replik i start kontroli {#capacity-validation-start}


      Zaakceptowano nieprawidłową liczbę replik lub kontrola zatrzymała się przed szczegółowym markerem; dostarczona reguła replicas >= 0 dopuszcza niebezpieczne wartości, a brak chronionych danych lub startu narzędzi też blokuje obserwację.  `cat main.tf terraform.tfvars capacity-contract.json; tofu plan -input=false -var=replicas=0`.


      ### Poprawne żądania i odrzucenie ponad pojemność {#capacity-valid-and-unsafe-cases}


      Poprawne żądanie nie tworzy planu lub niebezpieczne żądanie przeszło; przyczyną mogą być niepełne granice replik, walidacja puli lub zależność od dostępnych slotów. Bezwarunkowy błąd planu odrzuca też poprawne wywołania. Chroniony kontrakt wymaga całkowitych replicas od 1 do 3, niepustej listy różnych stref, dodatnich całkowitych slots_per_zone i replik nie większych niż suma slotów. Sprawdź wszystkie przypadki akceptowane i odrzucane; same odmowy nie wystarczą. Alternatywnych planów nie stosuje się. `cat capacity-contract.json; tofu validate`.


      ### Zastosowany plik replik {#capacity-applied-replica-file}


      replicas.txt nie zawiera 2 lub nie da się go odczytać; dostarczona konfiguracja zerowych replik może nadal obowiązywać albo poprawione dane nie trafiły do zarządzanego pliku.  `cat replicas.txt; cat terraform.tfvars`.


      ### Bezpieczne żądanie bez oczekujących zmian {#capacity-live-no-change-plan}


      Plan dla replicas=2 nie zwrócił 0; konfiguracja może wymagać zastosowania, plik lub zapisane wartości mogą się różnić albo błędna pula i błędy narzędzi lub providera blokują plan.  `tofu plan -input=false -var=replicas=2 -detailed-exitcode`.


      ## Wypróbuj


      Otwórz laboratorium **opentofu** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Prognozuj przed uruchomieniem:** Ile instancji utworzy map z jedną włączoną i jedną wyłączoną usługą?


      ```bash

      cd ~/lab/examples/hcl

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Jeden: interfejs API. Dane wyjściowe to dev/api; environment=production kończy się niepowodzeniem validation.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'HCL describe entradas, expresiones y objetos administrados. Este ejemplo local filtra servicios deshabilitados antes de que for_each cree instancias. Una regla validation rechaza una entrada no válida conocida antes de que se convierta en un cambio de recurso.


      Una colección con claves separa identidad de instancia y datos. Una clave estable no impide reemplazos si cambian los datos. Compara el mapa deseado, los ID existentes y los valores del plan antes de añadir una instancia. Los tipos describen la forma de solicitudes; la validación debe comprobar también relaciones como demanda y capacidad pool. Usa casos válidos como controles positivos además de rechazar los inseguros: una configuración rota que rechaza todo no es una política válida.


      En el ejercicio 039, el tipo number admite fracciones, por lo que la validación de `departures` debe combinar los límites de 1 a 6 con una prueba de entero. Conserva el valor suministrado 3 y aplícalo. Los planes separados para 0, 7 y 2.5 deben fallar con `departures must be an integer from 1 to 6`; comprueba `timetable.txt`, la salida numérica y el código de salida 0 del plan detallado final. Los planes negativos prueban el contrato sin aplicar valores inseguros.


      ### Tipos de entradas y salidas del aviso {#notice-input-types}


      En el ejercicio 013, `terraform.tfvars` proporciona `station = "north"` y `departures = 4`. La entrada `station` debe tener tipo `string`, mientras que `departures` sigue siendo un número; el archivo local los combina como `north:4`. Tras aplicar, la expresión `type(var.station)` en `tofu console` debe mostrar `string`; `tofu output -raw station` debe mostrar `north` y `tofu output -json departures` el número `4`. Comprueba que `tofu state list` incluye `local_file.notice` y que el `tofu plan -input=false -detailed-exitcode -no-color` final termina con código 0.


      ### Claves y contenido de rutas {#route-map-content}


      En el reto 033, each.key elige el nombre de archivo y each.value aporta el contenido. Conserva north=open y south=held, añade east=open en terraform.tfvars, revisa el plan y aplícalo. Usar la clave como contenido escribe nombres de rutas. Lee los tres archivos; uno ausente o ilegible no demuestra la entrega.


      ### Salida aplicada y vínculos de rutas {#route-map-state}


      En el reto 033, tofu output -json routes lee el estado aplicado, no el mapa sin aplicar. Debe incluir exactamente north, south y east, con un ID string para east. Compara current-ids.json con la salida directa si falla la captura o el análisis JSON. Por separado, tofu show -json debe contener destinos local_file gestionados para los tres archivos. Si la sonda termina sin resultado, verifica Python, dq_check y JSON legible de OpenTofu antes de cambiar el estado.


      ### Conservar los ID existentes {#route-retained-ids}


      En el reto 033, original-ids.json registra los ID aplicados de north y south. Las claves for_each estables no conservan los ID del proveedor si cambian contenidos o nombres de archivo. Compara las entradas con current-ids.json tras leer correctamente la salida; resuelve primero archivos ilegibles o mal formados. Conserva los contenidos existentes al añadir east, sin sustituir el registro de confianza.


      ### Plan final de rutas {#route-final-plan}


      Tras reparar el reto 033, ejecuta tofu plan -input=false -detailed-exitcode -no-color con salida visible. El código 2 indica cambios del mapa o contenido pendientes; el 1 indica un error de planificación. Revisa los cambios o errores de configuración, proveedor y estado. Una salida correcta o archivos coincidentes no demuestran el código 0.


      ### Rechazar los valores no admitidos {#departures-negative-plans}


      En el reto 039, number admite fracciones. Valida límites 1–6 e integridad. Los planes para 0, 7 y 2.5 deben fallar con departures must be an integer from 1 to 6; un error de sintaxis/proveedor no demuestra esa validación. invalid-plan.txt conserva la última observación intentada. Si las pruebas no terminan, revisa escritura del informe y arranque Python/tofu antes de cambiar la regla.


      ### Aplicar el valor normal {#departures-applied-result}


      En el reto 039, conserva departures=3 en terraform.tfvars y aplica la configuración revisada. Lee timetable.txt y tofu output -json departures: espera texto 3 en el archivo y el número 3, no un string. Entrada/salida cambiada o sin aplicar puede dejar resultados antiguos. Separa archivos ausentes/ilegibles y fallos de salida/JSON de valores incorrectos.


      ### Comprobar el plan normal {#departures-clean-plan}


      En el reto 039, los planes negativos no aplican configuración. Vuelve a la entrada normal y ejecuta tofu plan -input=false -detailed-exitcode -no-color con salida visible. Código 2 indica cambios pendientes; código 1 error de planificación. Revisa cambios o errores de configuración/proveedor/estado. El plan normal final debe salir con 0 sin cambios.


      ### Aceptación insegura e inicio de prueba {#capacity-validation-start}


      Se aceptó un número de réplicas inválido o la prueba terminó antes del marcador detallado; la regla suministrada replicas >= 0 admite valores inseguros, y entradas protegidas ausentes o fallos de inicio también impiden observar.  `cat main.tf terraform.tfvars capacity-contract.json; tofu plan -input=false -var=replicas=0`.


      ### Solicitudes válidas y rechazo por capacidad {#capacity-valid-and-unsafe-cases}


      Una solicitud válida no pudo planificarse o una insegura sí; pueden faltar límites de réplicas, validación del pool o relación con los slots disponibles. Un fallo general del plan también rechaza llamadas válidas. El contrato protegido exige replicas enteras de 1 a 3, zonas distintas no vacías, slots_per_zone entero positivo y réplicas no mayores que los slots totales. Compruebe todos los casos válidos e inválidos; rechazar solamente no basta. Los planes alternativos no se aplican. `cat capacity-contract.json; tofu validate`.


      ### Archivo de réplicas aplicado {#capacity-applied-replica-file}


      replicas.txt no contiene 2 o no puede leerse; puede seguir aplicada la configuración inicial de cero réplicas o las entradas corregidas no se han entregado al archivo gestionado.  `cat replicas.txt; cat terraform.tfvars`.


      ### Solicitud segura sin cambios pendientes {#capacity-live-no-change-plan}


      El plan para replicas=2 no terminó con 0; puede faltar aplicar configuración, haber drift en el archivo o valores registrados, o entradas de pool y errores de herramientas/proveedor impedir el plan.  `tofu plan -input=false -var=replicas=2 -detailed-exitcode`.


      ## Pruébalo


      Abra el laboratorio **opentofu** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿Cuántas instancias creará un map con un servicio habilitado y otro deshabilitado?


      ```bash

      cd ~/lab/examples/hcl

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > Uno: api. La salida es dev/api; environment=production falla validation.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh` y luego con `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'HCL beschreibt Eingaben, Ausdrücke und verwaltete Objekte. Dieses lokale Beispiel filtert deaktivierte Dienste, bevor for_each Instanzen erstellt. Eine validation-Regel lehnt eine bekanntermaßen ungültige Eingabe ab, bevor sie zu einer Ressourcenänderung wird.


      Eine Schlüsselsammlung trennt Instanzidentität und Nutzdaten. Ein stabiler Schlüssel verhindert keine Ersetzung, wenn sich Nutzdaten ändern. Vergleiche gewünschte Map, bestehende Provider-IDs und geplante Werte, bevor du eine Instanz ergänzt. Eingabetypen beschreiben Anfrageformen; Validierung muss auch Beziehungen wie Bedarf und pool-Kapazität prüfen. Nutze gültige Fälle als positive Kontrollen neben der Ablehnung unsicherer Fälle: Eine defekte Konfiguration, die alles ablehnt, ist keine gültige Richtlinie.


      In Aufgabe 039 erlaubt der Typ number Bruchteile, daher muss die Validierung von `departures` die Grenzen 1 bis 6 mit einer Ganzzahlprüfung verbinden. Behalte den vorgegebenen Wert 3 bei und wende ihn an. Separate Pläne für 0, 7 und 2.5 müssen mit `departures must be an integer from 1 to 6` fehlschlagen; prüfe `timetable.txt`, die numerische Ausgabe und Exit-Code 0 des abschließenden detaillierten Plans. Die Negativpläne prüfen den Vertrag, ohne unsichere Werte anzuwenden.


      ### Typen der Eingaben und Ausgaben {#notice-input-types}


      In Aufgabe 013 liefert `terraform.tfvars` die Werte `station = "north"` und `departures = 4`. Die Eingabe `station` muss den Typ `string` haben, während `departures` eine Zahl bleibt; die lokale Datei verbindet sie zu `north:4`. Nach der Anwendung sollte der Ausdruck `type(var.station)` in `tofu console` `string` ausgeben; `tofu output -raw station` sollte `north` und `tofu output -json departures` die Zahl `4` anzeigen. Prüfe, dass `tofu state list` `local_file.notice` enthält und der abschließende `tofu plan -input=false -detailed-exitcode -no-color` mit Code 0 endet.


      ### Routenschlüssel und Inhalt {#route-map-content}


      In Quest 033 wählt each.key den Dateinamen, each.value liefert den Inhalt. Behalte north=open und south=held, ergänze east=open in terraform.tfvars, prüfe den Plan und wende ihn an. Der Schlüssel als Inhalt schreibt stattdessen Routennamen. Lies alle drei Dateien; fehlende oder unlesbare Dateien belegen keine Lieferung.


      ### Angewendeter Routen-Output und Bindungen {#route-map-state}


      In Quest 033 liest tofu output -json routes den angewendeten State, nicht die unangewendete Eingabemap. Erwartet werden genau north, south und east mit einer String-ID für east. Vergleiche current-ids.json bei Erfassungs- oder JSON-Fehlern mit der direkten Ausgabe. Separat muss tofu show -json verwaltete local_file-Ziele für alle drei Dateien enthalten. Ohne Prüfergebnis kontrolliere Python, dq_check und lesbares OpenTofu-JSON vor State-Änderungen.


      ### Vorhandene Routen-IDs erhalten {#route-retained-ids}


      In Quest 033 enthält original-ids.json die angewendeten north- und south-IDs. Stabile for_each-Schlüssel erhalten Provider-IDs nicht automatisch bei Inhalts- oder Dateinamenänderungen. Vergleiche die Einträge nach erfolgreicher Output-Abfrage mit current-ids.json; kläre zuerst unlesbare oder fehlerhafte Vergleichsdateien. Behalte vorhandene Inhalte beim Ergänzen von east, statt den vertrauenswürdigen Datensatz zu ersetzen.


      ### Abschließender Routenplan {#route-final-plan}


      Führe nach der Reparatur in Quest 033 tofu plan -input=false -detailed-exitcode -no-color mit sichtbarer Ausgabe aus. Code 2 bedeutet ausstehende Map- oder Inhaltsänderungen, Code 1 einen Planungsfehler. Prüfe Änderungen oder Fehler zu Konfiguration, Provider und State. Erfolgreicher Output oder passende Dateien beweisen allein keinen Code 0.


      ### Nicht unterstützte Eingaben ablehnen {#departures-negative-plans}


      In Quest 039 erlaubt number Brüche. Validiere Grenzen 1–6 und Ganzzahligkeit. Pläne für 0, 7 und 2.5 müssen mit departures must be an integer from 1 to 6 scheitern; ein Syntax-/Provider-Fehler ist nicht dieses Validierungsergebnis. invalid-plan.txt enthält die zuletzt versuchte Beobachtung. Prüfe bei abgebrochenen Versuchen Berichtsschreibbarkeit und Python-/tofu-Start vor Regeländerungen.


      ### Normalen departures-Wert anwenden {#departures-applied-result}


      Behalte in Quest 039 departures=3 in terraform.tfvars und wende die geprüfte Konfiguration an. Lies timetable.txt und tofu output -json departures: erwartet werden Dateitext 3 und die Zahl 3, kein String. Geänderte oder unangewendete Eingaben/Outputs können veraltete Ergebnisse hinterlassen. Kläre fehlende/unlesbare Dateien und Output-/JSON-Fehler getrennt von Wertabweichungen.


      ### Plan für normale Eingaben prüfen {#departures-clean-plan}


      Negative Eingabepläne wenden in Quest 039 keine Konfiguration an. Kehre zur normalen Eingabe zurück und führe tofu plan -input=false -detailed-exitcode -no-color sichtbar aus. Code 2 bedeutet ausstehende Änderungen, Code 1 einen Planungsfehler. Prüfe Änderungen oder Konfigurations-/Provider-/State-Fehler. Der normale Abschlussplan muss ohne Änderungen mit Code 0 enden.


      ### Unsichere Replikawerte und Prüfstart {#capacity-validation-start}


      Ein ungültiger Replikawert wurde akzeptiert oder die Prüfung endete vor dem Detailmarker; die gelieferte Regel replicas >= 0 lässt unsichere Werte zu, während fehlende geschützte Eingaben oder Werkzeugstartfehler ebenfalls die Beobachtung verhindern.  `cat main.tf terraform.tfvars capacity-contract.json; tofu plan -input=false -var=replicas=0`.


      ### Gültige Anfragen und Kapazitätsgrenzen {#capacity-valid-and-unsafe-cases}


      Eine gültige Anfrage konnte keinen Plan erzeugen oder eine unsichere Anfrage war erfolgreich; unvollständige Replikagrenzen, Pool-Validierung oder die Beziehung zu verfügbaren Slots können die Ursache sein. Ein pauschaler Planfehler verwirft auch gültige Aufrufe. Der geschützte Vertrag verlangt ganzzahlige replicas von 1 bis 3, eine nichtleere Liste verschiedener Zonen, positive ganzzahlige slots_per_zone und höchstens so viele Replikas wie Slots insgesamt. Prüfen Sie alle gültigen und ungültigen Fälle; ausschließliches Ablehnen reicht nicht. Alternative Pläne werden nicht angewendet. `cat capacity-contract.json; tofu validate`.


      ### Angewendete Replikadatei {#capacity-applied-replica-file}


      replicas.txt enthält nicht 2 oder ist nicht lesbar; möglicherweise ist noch die gelieferte Null-Replika-Konfiguration angewendet oder korrigierte Eingaben wurden noch nicht in die verwaltete Datei übernommen.  `cat replicas.txt; cat terraform.tfvars`.


      ### Sichere Anfrage ohne ausstehende Änderungen {#capacity-live-no-change-plan}


      Der Plan für replicas=2 endete nicht mit 0; die Konfiguration muss möglicherweise noch angewendet werden, Datei oder gespeicherte Werte weichen ab, oder ungültige Pool-Eingaben und Werkzeug-/Providerfehler verhindern den Plan.  `tofu plan -input=false -var=replicas=2 -detailed-exitcode`.


      ## Probieren Sie es aus


      Öffnen Sie das **opentofu Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Wie viele Instanzen wird ein map mit einem aktivierten und einem deaktivierten Dienst erstellen?


      ```bash

      cd ~/lab/examples/hcl

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > One: api. Die Ausgabe ist dev/api; environment=production schlägt fehl, validation.


      ## Beobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
