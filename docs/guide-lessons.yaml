      ### Imagen de la versión no disponible {#relay-release-image}


      En el ejercicio 001, el Deployment `relay` no puede iniciar el contenedor `worker` porque falta su imagen. Inspecciona los eventos del Pod y compara `deployment.yaml` con el artefacto de CI suministrado `release-manifest.json`. Configura la imagen de worker con el valor completo `image` del artefacto, conserva `imagePullPolicy: Never` y espera el rollout de `relay`. La imagen ya está cargada en este entorno sin conexión; no la descargues de un registro externo.


      ### Inicio de clock y archivos del Pod {#clock-startup-artifacts}


      En el ejercicio 011, `clock.yaml` necesita un comando que escriba una fecha UTC en `/tmp/clock`, guarde `POD_NAME` en `/tmp/identity` y siga ejecutándose en primer plano. Obtén la variable de entorno mediante `fieldRef` con `fieldPath: metadata.name`: es el nombre del Pod, no del Deployment. Tras el rollout, compara `/tmp/identity` con el nombre real del Pod y comprueba el formato UTC en `/tmp/clock`, por ejemplo `2026-01-02T03:04:05Z`.


      ### Inicio y registros de route-worker {#route-worker-startup}


      En el ejercicio 014, lee los logs actuales o `--previous` del Pod `route-worker` y guarda la línea exacta `route must equal north` en `diagnosis.txt`. El proceso lee la clave `name` del ConfigMap `route` mediante `ROUTE`. Cambia esa clave a `north`, reinicia `deployment/route-worker` y comprueba el rollout y `printenv ROUTE`. Cambiar solo el ConfigMap no actualiza el entorno de un proceso en ejecución.


      ### Diagnosticar PVC destino sin enlazar {#storage-target-binding-gate}


      El PVC destino spool no está Bound o la prueba de política terminó sin marcador; la clase de almacenamiento desconocida puede dejarlo Pending, y datos protegidos ausentes, JSON inválido o fallos de inicio también impiden observar.  `kubectl get pvc spool reserve -o yaml; kubectl describe pvc spool`.


      ### Job existente {#batch-preserve-original-job}


      Recrear importer cambia UID fijado; repare Job existente y revise API si no puede leerse el objeto original. Job original usa backoffLimit=100 y activeDeadlineSeconds=300; CronJob recurrente inicialmente ausente. El resultado esperado es validación fallida limitada. Setup elimina job.yaml: observe objetos vivos y batch-contract.json suministrado. `kubectl get job importer -o jsonpath="{.metadata.uid}"`.


