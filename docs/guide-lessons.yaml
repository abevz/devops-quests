terraform-7.4:
  profile: opentofu
  example: addresses
  source_hash: c91826c725a4aa828b14e718d0e8a68db4f4a57f20c676380b1f1a259f9eaa60
  content:
    en: 'A rename in code alone looks like removing one address and adding another. A moved block declares that both addresses refer to the same existing object. State removal is a different operation: it forgets ownership rather than destroying the object.


      Changing counted instances into modules with stable keys is an identity migration, not a list sort. Match current addresses to actual object roles before choosing destinations. Preserve provider configuration and resource arguments so the reviewed plan changes bindings without replacing objects. A named volume may use its reusable name as its provider ID: compare its original creation identity and retained bytes as well as its name. A no-change infrastructure plan does not establish application-data preservation. Inspect live network attachments and volume mounts, compare bytes or hashes and verify that published outputs still identify the right roles. A saved no-replacement plan and a fresh empty plan are different observations. These checks describe current correspondence, not command history or uninterrupted service.


      ### Renamed file address and provider ID {#linked-move-state-address}


      The renamed local_file.ledger address is missing or its ID differs from original-id; renaming configuration without moving state, replacing the file resource, or unreadable state/receipt data can explain it.  `tofu state list; tofu state show local_file.ledger; cat original-id`.


      ### Preserve both linked identities {#linked-move-preserved-identities}


      The working original-id changed, or terraform_data.ledger did not retain its frozen ID and message matching notice.txt, or their evidence could not be read; moving only the file address or recreating the linked identity can leave the rename incomplete. The refactor renames both local_file.notice and terraform_data.notice to ledger. Move both addresses while retaining their provider IDs. The file ID alone does not establish the companion identity; the protected receipts under /run/dq/facts/0 remain authoritative if a working copy changes. The companion output is compared with the current notice.txt; the final no-change plan is a separate observation. `tofu state show terraform_data.ledger; cat original-identity notice.txt`.


      ### Complete the linked address migration {#linked-move-no-change-plan}


      The live plan did not exit 0; one of the two renamed resources may still need a state move or apply, a recreated resource may be pending, or configuration/provider errors may prevent planning.  `tofu plan -input=false -detailed-exitcode -no-color`.


      ## Try it


      Open the **opentofu Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Will a declared move recreate the terraform_data object?


      ```bash

      cd ~/lab/examples/addresses

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The plan records the address move with a no-op resource action, and the ID stays the same.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.



      An address refactor can span a dependency chain. A local file provider ID may be derived from its bytes, while a terraform_data companion has a persistent identity; identical file content alone does not prove preservation of both objects. Compare every existing and desired address, original identities and replacement actions before applying. Preserve a state backup until the migration is verified. An empty final plan describes convergence, not complete edit history.'
    ru: 'Простое переименование в коде выглядит как удаление старого адреса и создание нового. Moved объявляет, что это один существующий объект. Удаление привязки из state — другая операция: забыть владение, а не уничтожить объект.


      Переход от индексных экземпляров к модулям со стабильными ключами — миграция идентичности, а не сортировка списка. До выбора назначений сопоставьте текущие адреса с реальными ролями объектов. Сохраните конфигурацию провайдера и аргументы ресурсов, чтобы проверенный план менял привязки без замены объектов. ID именованного тома у провайдера может совпадать с повторно используемым именем: сравните исходную идентичность создания и байты данных, а не только имя. Пустой инфраструктурный план не устанавливает сохранность данных приложения. Изучите реальные подключения к сети и mounts томов, сравните байты или хеши и проверьте соответствие опубликованных outputs нужным ролям. Сохранённый план без замен и новый пустой план — разные наблюдения. Эти проверки описывают текущую согласованность, а не историю команд или непрерывность сервиса.


      ### Переименованный адрес файла и ID провайдера {#linked-move-state-address}


      Переименованный адрес local_file.ledger отсутствует или его ID отличается от original-id: причиной могут быть переименование конфигурации без переноса state, замена ресурса файла или недоступные данные state и записи ID.  `tofu state list; tofu state show local_file.ledger; cat original-id`.


      ### Сохранение обеих связанных идентичностей {#linked-move-preserved-identities}


      Рабочий original-id изменён либо terraform_data.ledger не сохраняет замороженный ID и сообщение, совпадающее с notice.txt, либо эти данные не прочитаны: перенос только адреса файла или пересоздание связанной идентичности оставляет переименование неполным. Рефакторинг переименовывает local_file.notice и terraform_data.notice в ledger. Перенесите оба адреса с сохранением ID провайдеров. Одного ID файла недостаточно для связанной идентичности; записи /run/dq/facts/0 остаются авторитетными при изменении рабочих копий. Выход связанного объекта сравнивается с текущим notice.txt; финальный план без изменений проверяется отдельно. `tofu state show terraform_data.ledger; cat original-identity notice.txt`.


      ### Завершение переноса связанных адресов {#linked-move-no-change-plan}


      Текущий план не вернул 0: одному из двух переименованных ресурсов ещё нужен перенос state или apply, может ожидаться пересоздание либо ошибки конфигурации и провайдера мешают плану.  `tofu plan -input=false -detailed-exitcode -no-color`.


      ## Попробуйте


      Откройте лабораторию **opentofu**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Пересоздаст ли объявленный moved объект terraform_data?


      ```bash

      cd ~/lab/examples/addresses

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Plan показывает перенос адреса с действием no-op, ID сохраняется.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.



      Рефакторинг адресов может охватывать цепочку зависимостей. Provider ID локального файла может определяться его байтами, а связанный terraform_data имеет постоянную идентичность; одинаковое содержимое файла не доказывает сохранение обоих объектов. До применения сравните все существующие и требуемые адреса, исходные идентичности и действия замены. Сохраняйте резервную копию state до проверки миграции. Пустой итоговый план показывает сходимость, но не полную историю изменений.'
    pl: 'Zmiana nazwy w samym kodzie wygląda jak usunięcie jednego adresu i dodanie innego. Blok moved deklaruje, że oba adresy odnoszą się do tego samego istniejącego obiektu. Usuwanie stanu to inna operacja: zamiast niszczyć obiekt, zapomina się o jego własności.


      Zmiana instancji indeksowanych na moduły ze stabilnymi kluczami jest migracją tożsamości, a nie sortowaniem listy. Przed wyborem adresów docelowych powiąż bieżące adresy z rzeczywistymi rolami obiektów. Zachowaj konfigurację providera i argumenty zasobów, aby przejrzany plan zmieniał powiązania bez zastępowania obiektów. Nazwany wolumen może używać ponownie dostępnej nazwy jako ID providera: porównaj również pierwotną tożsamość utworzenia i zachowane bajty. Plan infrastruktury bez zmian nie potwierdza zachowania danych aplikacji. Sprawdź rzeczywiste podłączenia sieci i montowania wolumenów, porównaj bajty lub hashe i sprawdź zgodność publikowanych wyjść z właściwymi rolami. Zapisany plan bez zastąpień i nowy pusty plan to różne obserwacje. Te sprawdzenia opisują bieżącą zgodność, nie historię poleceń ani ciągłość usługi.


      ### Zmieniony adres pliku i ID providera {#linked-move-state-address}


      Brakuje przemianowanego adresu local_file.ledger lub jego ID różni się od original-id; zmiana nazwy konfiguracji bez przeniesienia stanu, wymiana zasobu pliku lub nieczytelne dane stanu i ID mogą to wyjaśniać.  `tofu state list; tofu state show local_file.ledger; cat original-id`.


      ### Zachowanie obu powiązanych tożsamości {#linked-move-preserved-identities}


      Roboczy original-id zmienił się lub terraform_data.ledger nie zachował chronionego ID i komunikatu zgodnego z notice.txt, albo ich danych nie odczytano; przeniesienie tylko adresu pliku lub odtworzenie powiązanej tożsamości pozostawia niepełną zmianę nazwy. Refaktoryzacja zmienia local_file.notice i terraform_data.notice na ledger. Przenieś oba adresy z zachowaniem ID providerów. Sam ID pliku nie potwierdza tożsamości drugiego obiektu; chronione zapisy /run/dq/facts/0 pozostają wiążące mimo zmian kopii roboczych. Wyjście obiektu towarzyszącego porównuje się z bieżącym notice.txt; końcowy pusty plan jest osobną obserwacją. `tofu state show terraform_data.ledger; cat original-identity notice.txt`.


      ### Ukończenie migracji powiązanych adresów {#linked-move-no-change-plan}


      Bieżący plan nie zwrócił 0; jeden z dwóch przemianowanych zasobów może nadal wymagać przeniesienia stanu lub apply, czekać na odtworzenie albo błędy konfiguracji/providera blokują plan.  `tofu plan -input=false -detailed-exitcode -no-color`.


      ## Wypróbuj


      Otwórz laboratorium **opentofu** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy zadeklarowany ruch odtworzy obiekt terraform_data?


      ```bash

      cd ~/lab/examples/addresses

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Plan rejestruje przeniesienie adresu za pomocą akcji zasobu no-op, a ID pozostaje taki sam.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.


      Zmiana adresów może obejmować łańcuch zależności. ID dostawcy lokalnego pliku może wynikać z jego bajtów, a towarzyszący terraform_data ma trwałą tożsamość; identyczna zawartość nie dowodzi zachowania obu obiektów. Przed zastosowaniem porównaj wszystkie istniejące i żądane adresy, pierwotne tożsamości i działania zastąpienia. Zachowaj kopię state do zweryfikowania migracji. Pusty plan końcowy opisuje zbieżność, a nie pełną historię zmian.'
    es: 'Un cambio de nombre solo en el código parece eliminar una dirección y agregar otra. Un bloque moved declara que ambas direcciones hacen referencia al mismo objeto existente. La eliminación del estado es una operación diferente: se olvida la propiedad en lugar de destruir el objeto.


      Convertir instancias indexadas en módulos con claves estables es una migración de identidad, no ordenar una lista. Relaciona las direcciones actuales con los papeles reales antes de elegir destinos. Conserva la configuración del proveedor y los argumentos para que el plan revisado cambie asociaciones sin reemplazar objetos. Un volumen con nombre puede usar ese nombre reutilizable como ID del proveedor: compara también su identidad original de creación y los bytes conservados. Un plan de infraestructura sin cambios no demuestra la conservación de datos de la aplicación. Inspecciona conexiones de red y montajes reales, compara bytes o hashes y verifica que las salidas publicadas sigan identificando los papeles correctos. Un plan guardado sin reemplazos y un plan nuevo vacío son observaciones distintas. Estas comprobaciones describen la correspondencia actual, no el historial de comandos ni la continuidad del servicio.


      ### Dirección renombrada e ID del proveedor {#linked-move-state-address}


      Falta la dirección renombrada local_file.ledger o su ID difiere de original-id; renombrar configuración sin mover estado, sustituir el recurso de archivo o datos de estado/ID ilegibles pueden explicarlo.  `tofu state list; tofu state show local_file.ledger; cat original-id`.


      ### Conservar ambas identidades vinculadas {#linked-move-preserved-identities}


      Cambió original-id de trabajo o terraform_data.ledger no conservó su ID protegido y mensaje coincidente con notice.txt, o no pudo leerse su evidencia; mover solo la dirección del archivo o recrear la identidad vinculada deja incompleto el cambio. El cambio renombra local_file.notice y terraform_data.notice a ledger. Mueva ambas direcciones conservando sus ID. El ID del archivo solo no acredita la identidad vinculada; registros protegidos /run/dq/facts/0 siguen siendo autoritativos si cambia una copia. La salida vinculada se compara con notice.txt actual; el plan final sin cambios se observa por separado. `tofu state show terraform_data.ledger; cat original-identity notice.txt`.


      ### Completar migración de direcciones vinculadas {#linked-move-no-change-plan}


      El plan actual no terminó con 0; uno de los dos recursos renombrados puede necesitar mover estado o aplicar, puede quedar una recreación pendiente o fallos de configuración/proveedor impiden planificar.  `tofu plan -input=false -detailed-exitcode -no-color`.


      ## Pruébalo


      Abra el **Laboratorio opentofu** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿Un movimiento declarado recreará el objeto terraform_data?


      ```bash

      cd ~/lab/examples/addresses

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. El plan registra el movimiento de dirección con una acción de recurso no-op y el ID permanece igual.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh` y luego con `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.


      Una refactorización de direcciones puede abarcar una cadena de dependencias. El ID de proveedor de un archivo local puede derivarse de sus bytes, mientras que un acompañante terraform_data tiene identidad persistente; un contenido idéntico no prueba la conservación de ambos objetos. Compara todas las direcciones existentes y deseadas, las identidades originales y las acciones de reemplazo antes de aplicar. Conserva una copia de state hasta verificar la migración. Un plan final vacío describe convergencia, no todo el historial de cambios.'
    de: 'Eine Umbenennung allein im Code sieht so aus, als würde man eine Adresse entfernen und eine andere hinzufügen. Ein moved-Block erklärt, dass beide Adressen auf dasselbe vorhandene Objekt verweisen. Die staatliche Entfernung ist eine andere Operation: Sie vergisst das Eigentum, anstatt das Objekt zu zerstören.


      Der Wechsel von indizierten Instanzen zu Modulen mit stabilen Schlüsseln ist eine Identitätsmigration, keine Listensortierung. Ordne aktuelle Adressen tatsächlichen Objektrollen zu, bevor du Ziele wählst. Behalte Provider-Konfiguration und Ressourcenargumente, damit der geprüfte Plan Bindungen ohne Objektersetzung ändert. Ein benanntes Volume kann seinen wiederverwendbaren Namen als Provider-ID nutzen: vergleiche auch ursprüngliche Erstellungsidentität und erhaltene Bytes. Ein Infrastrukturplan ohne Änderungen belegt keine Erhaltung von Anwendungsdaten. Prüfe tatsächliche Netzwerkverbindungen und Volume-Mounts, vergleiche Bytes oder Hashes und kontrolliere, ob veröffentlichte Ausgaben weiterhin die richtigen Rollen identifizieren. Ein gespeicherter Plan ohne Ersetzungen und ein neuer leerer Plan sind verschiedene Beobachtungen. Diese Prüfungen beschreiben aktuelle Übereinstimmung, nicht Befehlsverlauf oder durchgehenden Betrieb.


      ### Umbenannte Dateiadresse und Provider-ID {#linked-move-state-address}


      Die umbenannte Adresse local_file.ledger fehlt oder ihre ID weicht von original-id ab; umbenannte Konfiguration ohne State-Verschiebung, ersetzte Dateiressource oder unlesbare State-/ID-Belege können die Ursache sein.  `tofu state list; tofu state show local_file.ledger; cat original-id`.


      ### Beide verknüpften Identitäten erhalten {#linked-move-preserved-identities}


      Die Arbeitskopie von original-id wurde geändert oder terraform_data.ledger behält nicht die geschützte ID und die zu notice.txt passende Nachricht, oder diese Belege waren nicht lesbar; nur die Dateiadresse zu verschieben oder die verknüpfte Identität neu zu erstellen lässt die Umbenennung unvollständig. Der Umbau benennt local_file.notice und terraform_data.notice in ledger um. Verschieben Sie beide Adressen unter Erhalt ihrer Provider-IDs. Die Datei-ID allein belegt nicht die verknüpfte Identität; geschützte Belege unter /run/dq/facts/0 bleiben bei geänderten Arbeitskopien maßgeblich. Die Begleitausgabe wird mit der aktuellen notice.txt verglichen; der abschließende unveränderte Plan wird separat beobachtet. `tofu state show terraform_data.ledger; cat original-identity notice.txt`.


      ### Verknüpfte Adressmigration abschließen {#linked-move-no-change-plan}


      Der aktuelle Plan endete nicht mit 0; eine der beiden umbenannten Ressourcen benötigt möglicherweise noch eine State-Verschiebung oder Anwendung, eine Neuerstellung steht aus oder Konfigurations-/Providerfehler verhindern den Plan.  `tofu plan -input=false -detailed-exitcode -no-color`.


      ## Probieren Sie es aus


      Öffnen Sie das **opentofu Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und prüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Wird eine deklarierte Verschiebung das terraform_data-Objekt neu erstellen?


      ```bash

      cd ~/lab/examples/addresses

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Der Plan zeichnet die Adressverschiebung mit einer no-op-Ressourcenaktion auf, und der ID bleibt gleich.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann mit `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.


      Eine Adressumstellung kann eine Abhängigkeitskette umfassen. Die Provider-ID einer lokalen Datei kann aus ihren Bytes abgeleitet sein, während ein terraform_data-Begleiter eine dauerhafte Identität hat; identischer Dateiinhalt beweist nicht den Erhalt beider Objekte. Vergleiche alle bestehenden/gewünschten Adressen, ursprüngliche Identitäten und Ersetzungsaktionen vor dem Anwenden. Bewahre eine State-Sicherung bis zur verifizierten Migration auf. Ein leerer Abschlussplan beschreibt Konvergenz, nicht den vollständigen Änderungsverlauf.'
  full_example: full-addresses
helm-3:
  profile: helm
  example: values
  source_hash: ac72fa3121e45fbeae0d28789acebb1e11e9d0b4a039b6c9c2385e70d7592bf7
  content:
    en: 'A chart renders templates from merged values. Later files override earlier files; lists are replaced rather than extended element by element. --set-string, --set-json and --set-file express different input forms.


      Input adoption and application refresh are separate relationships. A stored override can retain an earlier consumer expectation even after the producer publishes a new record. Compare computed release values with effective application inputs and the actual response, rather than inferring freshness from one layer. The values Lab exercises input merging; a complete transition across independently cached consumers is a conceptual extension.


      ## Try it


      Open the **helm Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Will [a, b] plus the later list [c] become [a, b, c]?


      ```bash

      cd ~/lab/examples/values

      ls chart

      cat base.yaml override.yaml

      bash run.sh

      cat merged.yaml

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The rendered list is [c]. The check reads actual rendered YAML and also verifies string, JSON and file inputs.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.



      Stored overrides, chart defaults and computed values are distinct layers. A schema validates input shape, while rendered resources reveal whether an accepted input actually reaches its consumer. Comparing more than one input profile can expose a constant hidden in a template; rendering twice can expose nondeterministic output. These comparisons concern rendered intent and still need live application observations.'
    ru: 'Чарт рендерит шаблоны из объединённых values. Поздний файл перекрывает ранний; списки заменяются целиком. --set-string, --set-json и --set-file задают разные формы входа.


      Принятие входных параметров и обновление приложения — разные связи. Сохранённое переопределение может удерживать прежнее ожидание потребителя после появления новой записи у производителя. Сопоставляйте вычисленные values релиза, действующие входные параметры приложения и реальный ответ, а не делайте вывод об актуальности по одному слою. Lab values показывает слияние входных данных; полный переход между независимыми кеширующими потребителями — концептуальное расширение.


      ## Попробуйте


      Откройте лабораторию **helm**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Превратятся ли [a, b] и более поздний [c] в [a, b, c]?


      ```bash

      cd ~/lab/examples/values

      ls chart

      cat base.yaml override.yaml

      bash run.sh

      cat merged.yaml

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Итоговый список — [c]. Проверка читает реальный YAML и проверяет входы string, JSON и file.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.



      Сохранённые переопределения, defaults chart и вычисленные values — разные слои. Schema проверяет форму входа, а отрендеренные ресурсы показывают, доходит ли допустимый параметр до потребителя. Сравнение нескольких наборов входных данных помогает обнаружить константу в шаблоне; повторный рендер — недетерминированный результат. Эти сравнения описывают намерение и требуют отдельных наблюдений за работающим приложением.'
    pl: 'Wykres renderuje szablony z połączonego values. Późniejsze pliki zastępują wcześniejsze; listy są zastępowane, a nie rozszerzane element po elemencie. --set-string, --set-json i --set-file wyrażają różne formularze wejściowe.


      Przyjęcie wejść i odświeżenie aplikacji to różne zależności. Zapisane nadpisanie może zachować wcześniejsze oczekiwanie odbiorcy, choć producent publikuje już nowy rekord. Porównuj obliczone values, rzeczywiste wejścia aplikacji i faktyczną odpowiedź, zamiast wnioskować o aktualności z jednej warstwy. Lab values pokazuje łączenie wejść; pełna zmiana między odbiorcami z niezależnymi pamięciami podręcznymi jest rozszerzeniem pojęciowym.


      ## Wypróbuj


      Otwórz laboratorium **helm** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy [a, b] plus późniejsza lista [c] stanie się [a, b, c]?


      ```bash

      cd ~/lab/examples/values

      ls chart

      cat base.yaml override.yaml

      bash run.sh

      cat merged.yaml

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Wyrenderowana lista to [c]. Kontrola odczytuje aktualnie wyrenderowany YAML, a także weryfikuje wejścia string, JSON i file.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.


      Zapisane nadpisania, wartości domyślne chartu i obliczone values to różne warstwy. Schema sprawdza strukturę wejścia; wyrenderowane zasoby pokazują, czy zaakceptowany parametr dociera do odbiorcy. Kilka profili wejściowych może ujawnić stałą w szablonie, a dwukrotne renderowanie — niedeterministyczny wynik. Te porównania dotyczą deklarowanego zamiaru i wymagają też obserwacji działającej aplikacji.'
    es: 'Un chart representa plantillas de values fusionadas. Los archivos posteriores anulan los archivos anteriores; las listas se reemplazan en lugar de ampliarse elemento por elemento. --set-string, --set-json y --set-file expresan diferentes formas de entrada.


      La adopción de entradas y la actualización de una aplicación son relaciones distintas. Un override guardado puede conservar una expectativa anterior del consumidor cuando el productor ya publica otro registro. Compara values calculados, entradas efectivas y respuesta real, sin deducir la actualidad a partir de una sola capa. El Lab de values muestra la combinación de entradas; una transición completa entre consumidores con cachés independientes es una extensión conceptual.


      ## Pruébalo


      Abra el **helm Lab** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿[a, b] más la lista posterior [c] se convertirán en [a, b, c]?


      ```bash

      cd ~/lab/examples/values

      ls chart

      cat base.yaml override.yaml

      bash run.sh

      cat merged.yaml

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. La lista renderizada es [c]. La verificación lee el YAML real representado y también verifica la cadena, el JSON y las entradas de archivos.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh`, luego `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.


      Los overrides guardados, los defaults del chart y los values calculados son capas distintas. Un schema valida la forma de entrada; los recursos renderizados muestran si un parámetro aceptado llega a su consumidor. Comparar varios perfiles puede revelar una constante en la plantilla; renderizar dos veces puede revelar resultados no deterministas. Estas comparaciones describen la intención y requieren además observar la aplicación activa.'
    de: 'Ein chart rendert Vorlagen aus dem zusammengeführten values. Spätere Dateien überschreiben frühere Dateien; Listen werden Element für Element ersetzt und nicht erweitert. --set-string, --set-json und --set-file drücken unterschiedliche Eingabeformen aus.


      Die Übernahme von Eingaben und die Aktualisierung einer Anwendung sind unterschiedliche Beziehungen. Ein gespeichertes Override kann eine frühere Verbrauchererwartung bewahren, obwohl der Produzent bereits einen neuen Datensatz veröffentlicht. Vergleiche berechnete Release-Values, wirksame Anwendungseingaben und tatsächliche Antwort, statt Aktualität aus einer Ebene abzuleiten. Das Values-Lab zeigt das Zusammenführen von Eingaben; ein vollständiger Wechsel über unabhängig zwischenspeichernde Verbraucher ist eine konzeptionelle Erweiterung.


      ## Probieren Sie es aus


      Öffnen Sie das **helm Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Wird [a, b] plus die spätere Liste [c] zu [a, b, c]?


      ```bash

      cd ~/lab/examples/values

      ls chart

      cat base.yaml override.yaml

      bash run.sh

      cat merged.yaml

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Die gerenderte Liste ist [c]. Die Prüfung liest tatsächlich gerenderte YAML und überprüft außerdem Zeichenfolgen, JSON und Dateieingaben.


      ## Beobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.


      Gespeicherte Overrides, Chart-Defaults und berechnete Values sind verschiedene Ebenen. Ein Schema prüft die Eingabeform; gerenderte Ressourcen zeigen, ob eine akzeptierte Eingabe ihren Verbraucher erreicht. Mehrere Eingabeprofile können eine Konstante im Template aufdecken; zweimaliges Rendern kann nichtdeterministische Ausgabe zeigen. Diese Vergleiche betreffen die deklarierte Absicht und benötigen zusätzlich Beobachtungen der laufenden Anwendung.'
  full_example: full-values
helm-8:
  profile: helm
  example: releases
  source_hash: 38368c3045adfcb4c0ea618f6f11b412061fb4250512c9b07b27aab35a82455e
  content:
    en: 'Helm records release revisions. An upgrade applies new rendered resources; rollback applies an older desired state and records a new revision. Waiting for readiness and restoring a failed upgrade are explicit policies. External data is not automatically rolled back.


      Release history records operations, while the working chart describes future renders. Restoring an archived manifest can recover one instance without restoring its parameter relationships. Resource names alone do not prove retained identity: compare UIDs and the application response as well as revision status. The lifecycle Lab demonstrates upgrades and rollback; it does not establish arbitrary chart reconstruction or uninterrupted service.


      ### Stored overrides and incomplete chart {#upgrade-stored-values-and-chart-inputs}


      The stored readinessPort is not 8080 or the chart/input probe stopped without a named marker; the supplied reused override 9090, missing ConfigMap/Service templates, invalid YAML/JSON or unavailable protected/Helm inputs can explain it. The fixture upgrades revision 2 with readinessPort=9090, then evolves the working chart and removes its ConfigMap and Service templates. Reconstruct those templates before upgrading the retained release. Compare stored overrides with chart defaults; reuse-values can keep 9090 even though chart/values.yaml says 8080. Missing or duplicate required render objects can stop this probe before a detailed values marker. `helm get values board --all -o json; cat chart/values.yaml helm-contract.json; helm template board ./chart`.


      ### Reusable deterministic values profiles {#upgrade-reusable-deterministic-values}


      The effective release values or a declared render profile did not meet the contract, or its Helm command failed; hardcoded readiness/message values, a changed release ID/image, wrong namespace or nondeterministic templates can prevent reusable rendering. The declared cases use north-67/8080 and canary-67/8081. Both renders must carry their own routeMessage and readinessPort while retaining the original releaseId and image. Rendering identical inputs twice must produce identical bytes; hardcoded defaults or generated timestamps/random text can fail this contract. These renders exercise declared inputs rather than all possible values. `cat helm-contract.json; helm get values board --all -o json`.


      ### Keep the supplied immutable image {#upgrade-original-immutable-image}


      A checked live or rendered worker image differs from the supplied reference or digest; changing an image value or template instead of repairing the chart can replace the protected application.  `helm get manifest board; kubectl get deployment board -o yaml`.


      ### Project the release ConfigMap {#upgrade-projected-source-configmap}


      The worker does not mount a volume that references the release ConfigMap; an omitted volume, mount-name mismatch or a different source can disconnect the chart bundle from the workload.  `helm get manifest board; kubectl get deployment board -o yaml`.


      ### Parameterize message and release record {#upgrade-parameterized-source-bundle}


      The source bundle does not match the configured message and original release ID, or its manifest/API query failed; hardcoded north-67, stale ConfigMap data or a substituted release.json can break the default or canary profile.  `cat chart/templates/bundle.yaml; kubectl get configmap board-data -o yaml`.


      ### Select the workload through its Service {#upgrade-public-service-selection}


      The public Service type, selector or declared TCP port does not match the workload contract; missing or stale Service templates, changed labels or a wrong public port can prevent selecting the intended release.  `kubectl get service board -o yaml; kubectl get deployment board -o yaml`.


      ### Retain original release object UIDs {#upgrade-original-release-object-uids}


      An original release object changed UID; uninstalling, deleting and recreating the Deployment, ConfigMap or Service can keep names while replacing the identities recorded by setup.  `kubectl get deployment board -o yaml; kubectl get configmap board-data -o yaml; kubectl get service board -o yaml`.


      ### Deployment identity before image observation {#upgrade-deployment-identity-observation}


      The original Deployment UID was not retained or the identity/image probe could not finish; recreating board, losing protected UID records, missing live objects or failed API/JSON observations can explain it.  `kubectl get deployment board -o jsonpath=''{.metadata.uid}''; cat original-deployment-uid`.


      ### Readiness in live and released definitions {#upgrade-live-and-released-readiness}


      The live and released readiness definitions did not verify the HTTP contract, or bundle observation stopped without a named marker; a stale 9090 probe, invalid handler/host/scheme, missing release objects or malformed bundle inputs can explain it. Both the live Deployment and its released Helm manifest need exactly one HTTP or TCP readiness handler resolving to worker port 8080, with no custom host and HTTP scheme when HTTP is used. This condition does not require a particular path or timing setting. Invalid YAML, missing release objects or malformed nested bundle JSON can also leave only this fallback marker. The subsequent bundle check compares stored and live resources; a live-only patch can leave Helm intent stale. `helm get manifest board; kubectl get deployment board -o yaml`.


      ### Observe public release metadata {#upgrade-public-release-metadata}


      The actual public release metadata did not match the original release ID and current route, or its request/JSON read failed; stale projected data, wrong Service routing or an unavailable worker can prevent consumer adoption.  `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080/release.json`.


      ### Deployed third or later revision {#upgrade-deployed-third-revision}


      Helm history does not show at least three revisions with the latest deployed, or the history query failed; only patching live objects, an incomplete upgrade or a failed latest revision can leave release history unsatisfied.  `helm history board -o json`.


      ### Workload rollout after the upgrade {#upgrade-workload-rollout-readiness}


      Deployment board did not finish rollout within 3 seconds; retained readiness overrides, missing source ConfigMap, unavailable Pods or failed API observation may still prevent a healthy rollout.  `kubectl rollout status deployment/board --timeout=10s`.


      ### Local response from the worker {#upgrade-local-worker-response}


      The worker did not return north-67 at localhost:8080 or exec/HTTP failed; unready Pods, missing projected bundle data or stale served content can leave the application response wrong even after a deployed Helm revision.  `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://127.0.0.1:8080`.


      ## Try it


      Open the **helm Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** After install, upgrade and rollback to revision 1, will the current revision number become 1 again?


      ```bash

      cd ~/lab/examples/releases

      cat chart/values.yaml

      bash run.sh

      helm history demo -n lab-helm

      bash check.sh

      ```


      > [!question]- Expected result

      > No. A successful rollback creates revision 3. The second check deliberately fails an image upgrade and verifies the restored Deployment.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.



      A release transition has a boundary at each consumer. A process can remain ready while returning a snapshot loaded during an earlier start; a healthy producer therefore does not establish consumer freshness. Release status, rollout state and application record identity provide different evidence. The lifecycle Lab demonstrates release operations, not a complete publication migration across multiple cached consumers.'
    ru: 'Helm хранит ревизии релиза. Upgrade применяет новые ресурсы, rollback применяет прежнее желаемое состояние и создаёт новую ревизию. Ожидание готовности и возврат при отказе задаются явно. Внешние данные автоматически не откатываются.


      История релиза фиксирует операции, а рабочий chart описывает будущие рендеры. Восстановление архивного manifest может вернуть один экземпляр, не восстановив связи параметров. Имена ресурсов сами по себе не доказывают сохранение идентичности: сопоставляйте UID и ответ приложения со статусом revision. Lab жизненного цикла показывает upgrade и rollback, но не произвольную реконструкцию chart или непрерывность обслуживания.


      ### Сохранённые переопределения и неполный chart {#upgrade-stored-values-and-chart-inputs}


      Сохранённый readinessPort не равен 8080 либо проверка остановилась без именованного маркера: причиной могут быть выданное сохранённое переопределение 9090, отсутствующие шаблоны ConfigMap и Service, некорректный YAML и JSON или недоступные данные Helm. Вторая ревизия сохраняет readinessPort=9090, затем рабочий chart изменён и лишён шаблонов ConfigMap и Service. Восстановите шаблоны до upgrade существующего выпуска. Сравните сохранённые переопределения с defaults: reuse-values сохраняет 9090, даже если chart/values.yaml задаёт 8080. Отсутствующие или дублирующиеся объекты рендера останавливают проверку до подробного маркера. `helm get values board --all -o json; cat chart/values.yaml helm-contract.json; helm template board ./chart`.


      ### Повторяемые детерминированные профили values {#upgrade-reusable-deterministic-values}


      Итоговые values или профиль рендера не выполнили контракт либо команда Helm завершилась ошибкой: жёстко заданные readiness и сообщение, другой release ID или образ, namespace или недетерминированные шаблоны мешают повторному использованию. Объявленные варианты задают north-67/8080 и canary-67/8081. Каждый рендер передаёт свои routeMessage и readinessPort, сохраняя исходные releaseId и image. Два рендера одинаковых входов дают одинаковые байты: захардкоженные defaults, время и случайный текст нарушают контракт. Проверяются объявленные варианты, а не все возможные values. `cat helm-contract.json; helm get values board --all -o json`.


      ### Сохранение выданного неизменяемого образа {#upgrade-original-immutable-image}


      Проверяемый образ worker в live или рендере отличается от выданной ссылки или digest: смена image в values или шаблоне вместо исправления chart заменяет защищённое приложение.  `helm get manifest board; kubectl get deployment board -o yaml`.


      ### Проекция ConfigMap выпуска {#upgrade-projected-source-configmap}


      worker не монтирует том со ссылкой на ConfigMap выпуска: отсутствующий том, разные имена volume и mount либо другой источник отделяют bundle chart от нагрузки.  `helm get manifest board; kubectl get deployment board -o yaml`.


      ### Параметризация сообщения и записи выпуска {#upgrade-parameterized-source-bundle}


      Исходный bundle не совпадает с заданным сообщением и исходным release ID либо запрос не удался: захардкоженный north-67, старые данные ConfigMap или подменённый release.json нарушают профиль по умолчанию или canary.  `cat chart/templates/bundle.yaml; kubectl get configmap board-data -o yaml`.


      ### Выбор нагрузки через Service {#upgrade-public-service-selection}


      Тип Service, selector или объявленный TCP-порт не соответствуют контракту: отсутствующий или старый шаблон Service, другие метки или публичный порт мешают выбрать нужный выпуск.  `kubectl get service board -o yaml; kubectl get deployment board -o yaml`.


      ### Сохранение UID исходных объектов выпуска {#upgrade-original-release-object-uids}


      Исходный объект выпуска сменил UID: uninstall, удаление и пересоздание Deployment, ConfigMap или Service сохраняют имена, но заменяют идентичности из записи setup.  `kubectl get deployment board -o yaml; kubectl get configmap board-data -o yaml; kubectl get service board -o yaml`.


      ### Идентичность Deployment перед наблюдением образа {#upgrade-deployment-identity-observation}


      Исходный UID Deployment не сохранён либо проверка идентичностей и образа не завершена: пересоздание board, потеря защищённых записей UID, отсутствующие объекты или ошибки API и JSON могут быть причиной.  `kubectl get deployment board -o jsonpath=''{.metadata.uid}''; cat original-deployment-uid`.


      ### Readiness живого и выпущенного описаний {#upgrade-live-and-released-readiness}


      Живая и выпущенная readiness-конфигурации не подтвердили HTTP-контракт либо наблюдение bundle остановилось без маркера: старый порт 9090, неверные handler, host и scheme, отсутствующие объекты или некорректные данные могут быть причиной. И живой Deployment, и манифест Helm требуют ровно один HTTP или TCP readiness-handler на worker-порт 8080 без отдельного host и с HTTP scheme для HTTP. Условие не задаёт конкретный path или тайминги. Неверный YAML, отсутствующие объекты или некорректный вложенный JSON также оставляют только fallback. Следующая проверка сравнивает сохранённые и живые ресурсы: patch только live оставляет старый замысел Helm. `helm get manifest board; kubectl get deployment board -o yaml`.


      ### Наблюдение публичных метаданных выпуска {#upgrade-public-release-metadata}


      Публичные метаданные не совпали с исходным release ID и текущим маршрутом либо запрос и чтение JSON не удались: старые проецируемые данные, неверная маршрутизация Service или недоступный worker мешают принятию публикации.  `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080/release.json`.


      ### Третья или последующая ревизия deployed {#upgrade-deployed-third-revision}


      История Helm не показывает минимум три ревизии с последней deployed либо запрос не удался: изменение только живых объектов, незавершённый upgrade или сбой последней ревизии не выполняют условие истории.  `helm history board -o json`.


      ### Rollout нагрузки после upgrade {#upgrade-workload-rollout-readiness}


      Deployment board не завершил rollout за 3 секунды: сохранённые readiness-переопределения, отсутствующий ConfigMap, недоступные Pod или ошибки наблюдения мешают готовности.  `kubectl rollout status deployment/board --timeout=10s`.


      ### Локальный ответ worker {#upgrade-local-worker-response}


      worker не вернул north-67 на localhost:8080 либо exec и HTTP завершились ошибкой: неготовые Pod, отсутствующие данные bundle или старое содержимое оставляют неверный ответ даже после ревизии Helm deployed.  `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://127.0.0.1:8080`.


      ## Попробуйте


      Откройте лабораторию **helm**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** После install, upgrade и rollback к ревизии 1 текущий номер снова станет 1?


      ```bash

      cd ~/lab/examples/releases

      cat chart/values.yaml

      bash run.sh

      helm history demo -n lab-helm

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Успешный rollback создаёт ревизию 3. Затем проверка намеренно ломает image upgrade и проверяет восстановленный Deployment.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.



      Переход релиза имеет отдельную границу у каждого потребителя. Процесс может оставаться готовым и возвращать снимок, загруженный при прежнем запуске; исправный производитель поэтому не доказывает актуальность потребителей. Статус релиза, состояние rollout и идентичность записи приложения дают разные свидетельства. Lab жизненного цикла показывает операции с релизами, а не полный перенос публикации между несколькими кеширующими потребителями.'
    pl: 'Helm rejestruje wersje wersji. upgrade stosuje nowe renderowane zasoby; rollback stosuje starszy żądany stan i rejestruje nową wersję. Oczekiwanie na gotowość i przywracanie uszkodzonego upgrade to wyraźne zasady. Dane zewnętrzne nie są automatycznie przywracane.


      Historia wydania zapisuje operacje, a roboczy chart opisuje przyszłe renderowanie. Przywrócenie archiwalnego manifestu może odzyskać jedną instancję bez naprawy zależności parametrów. Same nazwy zasobów nie dowodzą zachowania tożsamości: porównaj UID, odpowiedź aplikacji i stan rewizji. Lab cyklu życia pokazuje upgrade i rollback, ale nie dowodzi dowolnej rekonstrukcji chartu ani nieprzerwanej dostępności.


      ### Zapisane nadpisania i niepełny chart {#upgrade-stored-values-and-chart-inputs}


      Zapisany readinessPort nie jest 8080 lub kontrola zakończyła się bez markera; dostarczone zachowane nadpisanie 9090, brak szablonów ConfigMap/Service, błędny YAML/JSON lub niedostępne dane Helm mogą to wyjaśniać. Druga rewizja zachowuje readinessPort=9090, potem roboczy chart zmieniono i usunięto szablony ConfigMap/Service. Odtwórz je przed upgrade istniejącego wydania. Porównaj zapisane nadpisania z defaults; reuse-values może zachować 9090 mimo 8080 w chart/values.yaml. Brakujące lub powielone wymagane obiekty renderu zatrzymują próbę przed szczegółowym markerem. `helm get values board --all -o json; cat chart/values.yaml helm-contract.json; helm template board ./chart`.


      ### Wielokrotne deterministyczne profile values {#upgrade-reusable-deterministic-values}


      Efektywne values lub profil renderowania nie spełniły kontraktu albo polecenie Helm zawiodło; stałe readiness/komunikatu, zmieniony release ID/obraz, zły namespace lub niedeterministyczne szablony blokują wielokrotne użycie. Zadeklarowane przypadki używają north-67/8080 i canary-67/8081. Każdy render przenosi własne routeMessage i readinessPort, zachowując releaseId i image. Dwa rendery identycznych wejść dają identyczne bajty; stałe defaults, czas lub losowy tekst mogą naruszać kontrakt. Kontrola obejmuje zadeklarowane przypadki, nie wszystkie values. `cat helm-contract.json; helm get values board --all -o json`.


      ### Zachowanie dostarczonego niezmiennego obrazu {#upgrade-original-immutable-image}


      Sprawdzany obraz worker na żywo lub w renderze różni się od dostarczonej referencji/digest; zmiana image w values lub szablonie zamiast naprawy chart zastępuje chronioną aplikację.  `helm get manifest board; kubectl get deployment board -o yaml`.


      ### Projekcja ConfigMap wydania {#upgrade-projected-source-configmap}


      worker nie montuje wolumenu odwołującego się do ConfigMap wydania; brak wolumenu, niezgodna nazwa montowania lub inne źródło odłącza pakiet chart od aplikacji.  `helm get manifest board; kubectl get deployment board -o yaml`.


      ### Parametryzacja komunikatu i rekordu wydania {#upgrade-parameterized-source-bundle}


      Pakiet źródła nie odpowiada komunikatowi i pierwotnemu release ID lub odczyt manifestu/API zawiódł; stałe north-67, stare dane ConfigMap lub podstawiony release.json psują profil domyślny albo canary.  `cat chart/templates/bundle.yaml; kubectl get configmap board-data -o yaml`.


      ### Wybór aplikacji przez Service {#upgrade-public-service-selection}


      Typ Service, selektor lub zadeklarowany port TCP nie odpowiadają kontraktowi; brak/stary szablon Service, zmienione etykiety lub zły port publiczny blokują wybór wydania.  `kubectl get service board -o yaml; kubectl get deployment board -o yaml`.


      ### Zachowanie pierwotnych UID obiektów wydania {#upgrade-original-release-object-uids}


      Pierwotny obiekt wydania zmienił UID; uninstall, usunięcie i odtworzenie Deployment, ConfigMap lub Service zachowują nazwy, ale zastępują tożsamości setup.  `kubectl get deployment board -o yaml; kubectl get configmap board-data -o yaml; kubectl get service board -o yaml`.


      ### Tożsamość Deployment przed obserwacją obrazu {#upgrade-deployment-identity-observation}


      Nie zachowano pierwotnego UID Deployment lub kontrola tożsamości/obrazu nie zakończyła się; odtworzenie board, brak chronionych UID, obiektów lub błędy API/JSON mogą to wyjaśniać.  `kubectl get deployment board -o jsonpath=''{.metadata.uid}''; cat original-deployment-uid`.


      ### Readiness w definicjach żywej i wydanej {#upgrade-live-and-released-readiness}


      Gotowość na żywo i w wydanym manifeście nie potwierdziła kontraktu HTTP lub obserwacja pakietu zatrzymała się bez markera; stare 9090, błędny handler/host/scheme, brak obiektów lub błędne dane mogą to wyjaśniać. Żywy Deployment i wydany manifest Helm wymagają dokładnie jednego handlera HTTP lub TCP wskazującego port worker 8080, bez własnego host i ze scheme HTTP przy HTTP. Warunek nie narzuca path ani czasu. Błędny YAML, brak obiektów lub błędny zagnieżdżony JSON też może dać wyłącznie fallback. Dalsza kontrola porównuje zapisane i żywe zasoby; sam patch live pozostawia stare zamiary Helm. `helm get manifest board; kubectl get deployment board -o yaml`.


      ### Obserwacja publicznych metadanych wydania {#upgrade-public-release-metadata}


      Publiczne metadane nie odpowiadają pierwotnemu release ID i trasie lub odczyt żądania/JSON zawiódł; stare dane projekcji, zły routing Service lub niedostępny worker blokują przyjęcie publikacji.  `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080/release.json`.


      ### Trzecia lub dalsza rewizja deployed {#upgrade-deployed-third-revision}


      Historia Helm nie pokazuje co najmniej trzech rewizji z ostatnią deployed lub odczyt zawiódł; poprawa tylko żywych obiektów, nieukończony upgrade lub nieudana ostatnia rewizja nie spełnia historii.  `helm history board -o json`.


      ### Rollout aplikacji po upgrade {#upgrade-workload-rollout-readiness}


      Deployment board nie ukończył rollout w 3 sekundy; zachowane nadpisania readiness, brak ConfigMap, niedostępne Pody lub błąd API nadal blokują gotowość.  `kubectl rollout status deployment/board --timeout=10s`.


      ### Lokalna odpowiedź worker {#upgrade-local-worker-response}


      worker nie zwrócił north-67 pod localhost:8080 lub exec/HTTP zawiódł; niegotowe Pody, brak danych projekcji lub stara treść daje złą odpowiedź mimo rewizji Helm deployed.  `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://127.0.0.1:8080`.


      ## Wypróbuj


      Otwórz laboratorium **helm** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy po install, upgrade i rollback do wersji 1 bieżący numer wersji ponownie zmieni się na 1?


      ```bash

      cd ~/lab/examples/releases

      cat chart/values.yaml

      bash run.sh

      helm history demo -n lab-helm

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Pomyślne wykonanie rollback powoduje utworzenie wersji 3. Druga kontrola celowo kończy się niepowodzeniem image upgrade i weryfikuje przywrócony Deployment.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.


      Zmiana wydania ma osobną granicę u każdego odbiorcy. Proces może pozostawać gotowy i zwracać migawkę wczytaną podczas wcześniejszego startu; zdrowy producent nie dowodzi więc aktualności odbiorców. Stan wydania, rollout i tożsamość rekordu aplikacji dostarczają różnych dowodów. Lab cyklu życia pokazuje operacje wydań, ale nie pełną migrację publikacji między wieloma odbiorcami z pamięcią podręczną.'
    es: 'Revisiones de lanzamiento de registros Helm. Un upgrade aplica nuevos recursos renderizados; rollback aplica un estado deseado anterior y registra una nueva revisión. Esperar a que esté listo y restaurar un upgrade fallido son políticas explícitas. Los datos externos no se revierten automáticamente.


      El historial del release registra operaciones, mientras el chart de trabajo describe renderizados futuros. Restaurar un manifiesto archivado puede recuperar una instancia sin recuperar sus relaciones entre parámetros. Los nombres de recursos no demuestran identidad conservada: compara UID, respuesta de la aplicación y estado de la revisión. El Lab del ciclo de vida muestra upgrade y rollback, no la reconstrucción de cualquier chart ni disponibilidad ininterrumpida.


      ### Overrides guardados y chart incompleto {#upgrade-stored-values-and-chart-inputs}


      El readinessPort guardado no es 8080 o la prueba terminó sin marcador; override 9090 retenido, plantillas ConfigMap ausente, YAML/JSON inválido o entradas Helm no disponibles pueden explicarlo. La revisión 2 usa readinessPort=9090 y luego se cambia chart eliminando plantillas ConfigMap/Service. Reconstrúyalas antes de actualizar la versión existente. Compare overrides y defaults; reuse-values conserva 9090 aunque chart/values.yaml indique 8080. Objetos requeridos ausentes o duplicados detienen la prueba antes del marcador detallado. `helm get values board --all -o json; cat chart/values.yaml helm-contract.json; helm template board ./chart`.


      ### Perfiles values reutilizables y deterministas {#upgrade-reusable-deterministic-values}


      Los values efectivos o un perfil no cumplieron el contrato o falló Helm; readiness/mensaje fijos, release ID/imagen cambiados, namespace incorrecto o plantillas no deterministas impiden render reutilizable. Los casos declaran north-67/8080 y canary-67/8081. Cada render lleva su routeMessage y readinessPort conservando releaseId e image. Dos renders de entradas iguales producen bytes idénticos; defaults fijos, fechas o texto aleatorio incumplen. Se ejercitan entradas declaradas, no todo valor posible. `cat helm-contract.json; helm get values board --all -o json`.


      ### Conservar imagen inmutable suministrada {#upgrade-original-immutable-image}


      Una imagen worker viva o renderizada difiere de referencia/digest; cambiar image en values o plantilla en vez de reparar chart puede sustituir la aplicación protegida.  `helm get manifest board; kubectl get deployment board -o yaml`.


      ### Proyectar ConfigMap de versión {#upgrade-projected-source-configmap}


      worker no monta un volumen referido al ConfigMap de versión; volumen ausente, nombre de montaje distinto u otro origen desconecta el bundle chart de la aplicación.  `helm get manifest board; kubectl get deployment board -o yaml`.


      ### Parametrizar mensaje y registro de versión {#upgrade-parameterized-source-bundle}


      El bundle no coincide con mensaje configurado e ID original o falló consultar manifiesto/API; north-67 fijo, datos ConfigMap antiguos o release.json sustituido rompe perfil predeterminado o canary.  `cat chart/templates/bundle.yaml; kubectl get configmap board-data -o yaml`.


      ### Seleccionar aplicación mediante Service {#upgrade-public-service-selection}


      Tipo Service, selector o puerto TCP declarado no coinciden con contrato; plantilla Service ausente/obsoleta, etiquetas cambiadas o puerto público incorrecto impiden seleccionar versión prevista.  `kubectl get service board -o yaml; kubectl get deployment board -o yaml`.


      ### Conservar UID originales de objetos de versión {#upgrade-original-release-object-uids}


      Un objeto original cambió UID; uninstall, eliminar y recrear Deployment, ConfigMap o Service conserva nombres y sustituye identidades registradas por setup.  `kubectl get deployment board -o yaml; kubectl get configmap board-data -o yaml; kubectl get service board -o yaml`.


      ### Identidad Deployment antes de observar imagen {#upgrade-deployment-identity-observation}


      No se conservó UID original Deployment o no terminó probar identidades/imagen; recrear board, perder registros UID protegidos, objetos ausentes o fallos API/JSON pueden explicarlo.  `kubectl get deployment board -o jsonpath=''{.metadata.uid}''; cat original-deployment-uid`.


      ### Readiness en definiciones viva y publicada {#upgrade-live-and-released-readiness}


      Las definiciones readiness viva y publicada no verificaron contrato HTTP o la observación terminó sin marcador; probe 9090 obsoleta, handler/host/scheme inválidos, objetos ausentes o bundle malformado pueden explicarlo. Deployment vivo y manifiesto Helm requieren exactamente un handler HTTP o TCP al puerto worker 8080, sin host personalizado y con scheme HTTP si corresponde. No se exige path ni tiempos concretos. YAML inválido, objetos ausentes o JSON anidado malformado también dejan solo fallback. Se comparan recursos guardados y vivos; parchear solo live deja intención Helm antigua. `helm get manifest board; kubectl get deployment board -o yaml`.


      ### Observar metadatos públicos de versión {#upgrade-public-release-metadata}


      Los metadatos públicos no coinciden con ID original y ruta actual o falló petición/JSON; datos proyectados obsoletos, routing Service incorrecto o worker no disponible impiden adopción.  `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080/release.json`.


      ### Tercera o posterior revisión deployed {#upgrade-deployed-third-revision}


      El historial Helm no muestra al menos tres revisiones con última deployed o falló consulta; parchear solo objetos vivos, upgrade incompleto o última revisión fallida no satisface historial.  `helm history board -o json`.


      ### Rollout de aplicación tras upgrade {#upgrade-workload-rollout-readiness}


      Deployment board no completó rollout en 3 segundos; overrides readiness retenidos, ConfigMap ausente, Pods no disponibles o fallo API impiden un rollout sano.  `kubectl rollout status deployment/board --timeout=10s`.


      ### Respuesta local de worker {#upgrade-local-worker-response}


      worker no devolvió north-67 en localhost:8080 o falló exec/HTTP; Pods sin preparar, bundle proyectado ausente o contenido obsoleto deja respuesta incorrecta incluso con revisión deployed.  `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://127.0.0.1:8080`.


      ## Pruébalo


      Abra el laboratorio **helm** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** Después de install, upgrade y rollback hasta la revisión 1, ¿el número de revisión actual volverá a ser 1?


      ```bash

      cd ~/lab/examples/releases

      cat chart/values.yaml

      bash run.sh

      helm history demo -n lab-helm

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. Un rollback exitoso crea la revisión 3. La segunda verificación falla deliberadamente en una imagen upgrade y verifica el Deployment restaurado.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh`, luego `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.


      Una transición del release tiene un límite en cada consumidor. Un proceso puede seguir listo y devolver una instantánea cargada en un arranque anterior; un productor sano no demuestra la actualidad de los consumidores. El estado del release, el rollout y la identidad del registro aportan evidencias distintas. El Lab del ciclo de vida muestra operaciones de releases, no una migración completa entre varios consumidores con caché.'
    de: 'Helm zeichnet Versionsrevisionen auf. Ein upgrade wendet neue gerenderte Ressourcen an; rollback wendet einen älteren gewünschten Status an und zeichnet eine neue Revision auf. Das Warten auf die Bereitschaft und das Wiederherstellen eines ausgefallenen upgrade sind explizite Richtlinien. Externe Daten werden nicht automatisch zurückgesetzt.


      Die Release-Historie erfasst Operationen, während das Arbeits-Chart künftige Renderings beschreibt. Ein archiviertes Manifest kann eine Instanz wiederherstellen, ohne ihre Parameterbeziehungen zu reparieren. Ressourcennamen allein belegen keine erhaltene Identität: Vergleiche UIDs, Anwendungsantwort und Revisionsstatus. Das Lifecycle-Lab zeigt Upgrade und Rollback, aber keine beliebige Chart-Rekonstruktion oder unterbrechungsfreie Verfügbarkeit.


      ### Gespeicherte Overrides und unvollständiges Chart {#upgrade-stored-values-and-chart-inputs}


      Der gespeicherte readinessPort ist nicht 8080 oder die Prüfung endete ohne benannten Marker; der gelieferte übernommene Override 9090, fehlende ConfigMap-/Service-Vorlagen, ungültiges YAML/JSON oder nicht verfügbare Helm-Eingaben können die Ursache sein. Die zweite Revision übernimmt readinessPort=9090; danach entwickelt sich das Arbeitschart weiter und verliert ConfigMap-/Service-Vorlagen. Rekonstruieren Sie diese vor dem Upgrade des erhaltenen Releases. Vergleichen Sie gespeicherte Overrides mit Defaults; reuse-values kann 9090 trotz 8080 in chart/values.yaml behalten. Fehlende oder doppelte benötigte Renderobjekte stoppen die Prüfung vor einem Detailmarker. `helm get values board --all -o json; cat chart/values.yaml helm-contract.json; helm template board ./chart`.


      ### Wiederverwendbare deterministische Werteprofile {#upgrade-reusable-deterministic-values}


      Die effektiven Release-Werte oder ein Renderprofil erfüllten den Vertrag nicht oder der Helm-Befehl schlug fehl; feste Readiness-/Nachrichtenwerte, geänderte Release-ID/Image, falscher Namespace oder nicht deterministische Vorlagen verhindern wiederverwendbares Rendern. Die deklarierten Fälle verwenden north-67/8080 und canary-67/8081. Jeder Render übernimmt eigenes routeMessage und readinessPort unter Erhalt von releaseId und image. Zweimaliges Rendern gleicher Eingaben muss identische Bytes erzeugen; feste Defaults, Zeitstempel oder Zufallstext können dies verletzen. Geprüft werden deklarierte Eingaben statt aller möglichen Werte. `cat helm-contract.json; helm get values board --all -o json`.


      ### Geliefertes unveränderliches Image erhalten {#upgrade-original-immutable-image}


      Ein geprüftes Live- oder gerendertes worker Image weicht von gelieferter Referenz oder Digest ab; ein geänderter Image-Wert oder eine andere Vorlage statt Chart-Korrektur kann die geschützte Anwendung ersetzen.  `helm get manifest board; kubectl get deployment board -o yaml`.


      ### Release-ConfigMap projizieren {#upgrade-projected-source-configmap}


      Der worker bindet kein Volume mit Verweis auf die Release-ConfigMap ein; fehlendes Volume, abweichender Mount-Name oder eine andere Quelle kann das Chart-Bundle von der Workload trennen.  `helm get manifest board; kubectl get deployment board -o yaml`.


      ### Nachricht und Release-Datensatz parametrisieren {#upgrade-parameterized-source-bundle}


      Das Quell-Bundle entspricht nicht konfigurierter Nachricht und ursprünglicher Release-ID oder die Manifest-/API-Abfrage schlug fehl; festes north-67, alte ConfigMap-Daten oder ersetzte release.json kann Standard- oder canary Profil verletzen.  `cat chart/templates/bundle.yaml; kubectl get configmap board-data -o yaml`.


      ### Workload über Service auswählen {#upgrade-public-service-selection}


      Service-Typ, Selektor oder deklarierter TCP-Port entsprechen nicht dem Workload-Vertrag; fehlende/veraltete Service-Vorlage, geänderte Labels oder falscher öffentlicher Port verhindert die Auswahl des beabsichtigten Releases.  `kubectl get service board -o yaml; kubectl get deployment board -o yaml`.


      ### Ursprüngliche Release-Objekt-UIDs erhalten {#upgrade-original-release-object-uids}


      Ein ursprüngliches Release-Objekt änderte seine UID; uninstall, Löschen und Neuerstellen von Deployment, ConfigMap oder Service kann Namen erhalten und die beim Setup erfassten Identitäten ersetzen.  `kubectl get deployment board -o yaml; kubectl get configmap board-data -o yaml; kubectl get service board -o yaml`.


      ### Deployment-Identität vor Image-Beobachtung {#upgrade-deployment-identity-observation}


      Die ursprüngliche Deployment-UID wurde nicht erhalten oder die Identitäts-/Image-Prüfung endete vorzeitig; neu erstelltes board, fehlende geschützte UID-Belege, Live-Objekte oder API-/JSON-Fehler können die Ursache sein.  `kubectl get deployment board -o jsonpath=''{.metadata.uid}''; cat original-deployment-uid`.


      ### Readiness in Live- und Release-Definition {#upgrade-live-and-released-readiness}


      Live- und veröffentlichte Readiness bestätigten den HTTP-Vertrag nicht oder die Bundle-Beobachtung endete ohne benannten Marker; eine alte 9090 Probe, ungültiger Handler/Host/Scheme, fehlende Release-Objekte oder fehlerhafte Bundle-Eingaben können die Ursache sein. Live-Deployment und veröffentlichtes Helm-Manifest benötigen genau einen HTTP- oder TCP-Readiness-Handler auf worker Port 8080, ohne eigenen host und bei HTTP mit HTTP scheme. Diese Bedingung fordert keinen bestimmten path oder Zeitwert. Ungültiges YAML, fehlende Objekte oder fehlerhaftes verschachteltes JSON können ebenfalls nur diesen Fallback hinterlassen. Danach werden gespeicherte und Live-Ressourcen verglichen; ein reiner Live-Patch kann alte Helm-Absicht belassen. `helm get manifest board; kubectl get deployment board -o yaml`.


      ### Öffentliche Release-Metadaten beobachten {#upgrade-public-release-metadata}


      Die öffentlichen Release-Metadaten entsprechen nicht ursprünglicher Release-ID und aktueller Route oder Anfrage/JSON-Lesen schlug fehl; alte projizierte Daten, falsches Service-Routing oder unerreichbarer worker verhindern die Übernahme.  `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080/release.json`.


      ### Dritte oder spätere Revision deployed {#upgrade-deployed-third-revision}


      Die Helm-Historie zeigt nicht mindestens drei Revisionen mit letzter deployed oder die Abfrage schlug fehl; ausschließlich korrigierte Live-Objekte, ein unvollständiges Upgrade oder eine fehlgeschlagene letzte Revision können die Historienbedingung offenlassen.  `helm history board -o json`.


      ### Workload-Rollout nach Upgrade {#upgrade-workload-rollout-readiness}


      Das Deployment board schloss den Rollout nicht innerhalb von 3 Sekunden ab; übernommene Readiness-Overrides, fehlende Quell-ConfigMap, unerreichbare Pods oder API-Beobachtungsfehler können Bereitschaft verhindern.  `kubectl rollout status deployment/board --timeout=10s`.


      ### Lokale worker Antwort {#upgrade-local-worker-response}


      Der worker lieferte nicht north-67 unter localhost:8080 oder exec/HTTP schlug fehl; nicht bereite Pods, fehlende projizierte Bundle-Daten oder alte Inhalte können die Antwort auch nach einer deployed Helm-Revision falsch belassen.  `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://127.0.0.1:8080`.


      ## Probieren Sie es aus


      Öffnen Sie das **helm Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Wird die aktuelle Revisionsnummer nach install, upgrade und rollback zu Revision 1 wieder 1?


      ```bash

      cd ~/lab/examples/releases

      cat chart/values.yaml

      bash run.sh

      helm history demo -n lab-helm

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Ein erfolgreicher rollback erstellt Revision 3. Die zweite Prüfung lässt ein Image upgrade absichtlich fehlschlagen und überprüft das wiederhergestellte Deployment.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann mit `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.


      Ein Release-Wechsel hat bei jedem Verbraucher eine eigene Grenze. Ein Prozess kann bereit bleiben und einen beim früheren Start geladenen Snapshot liefern; ein gesunder Produzent belegt daher keine aktuellen Verbraucherdaten. Release-Status, Rollout-Zustand und Datensatzidentität liefern unterschiedliche Belege. Das Lifecycle-Lab zeigt Release-Operationen, aber keinen vollständigen Veröffentlichungswechsel über mehrere zwischenspeichernde Verbraucher.'
  full_example: full-releases
cicd-gitops-3:
  profile: gitops
  example: sync
  source_hash: ff0c4cb4b2dcccfeb41424cffb63802bf3628684ce95012dad50e92c988e24ac
  content:
    en: 'Repo-server renders the chosen Git revision. The application controller compares desired and live objects, then performs sync. Phases order hooks before ordinary resources; waves order work inside a phase. A final Synced label alone does not prove the order.


      In quest 050, first recover the release-candidate ConfigMap commit onto local and remote `main` while preserving the baseline ancestor and a clean worktree. Then correct the Argo Application source path to `manifests`. Compare the remote commit with the controller''s synced revision, confirm its tracked board is healthy, and request `north-50`; a manual live edit is not Git delivery.


      ### Published main and working tree {#delivery-main-state}


      The workstation is not clean on main at origin/main, or its inputs cannot be observed; release-candidate may still be checked out, a commit may be unpushed, or origin/environment access may fail. The supplied release-candidate contains the desired change while initial main retains the retired manifest. Transfer the change onto main without discarding its history, publish it, refresh origin/main and compare commit IDs and working-tree status. Editing a local file alone does not publish it. `git -C repository status --short --branch; git -C repository rev-parse HEAD origin/main`.


      ### Notice in the remote manifest {#delivery-published-manifest}


      The remote release does not provide north-50 or cannot be fetched or parsed; the candidate change may not have reached main, or origin access and manifests/route.yaml may be unavailable or invalid. The check reads origin/main:manifests/route.yaml as YAML and requires its data index.html string to equal north-50 after trailing newlines are removed. Inspect the committed remote object, not just the workstation copy. A fetch error and an unavailable, malformed or incorrect manifest share this marker. `git -C repository show origin/main:manifests/route.yaml`.


      ### Private delivery observation inputs {#delivery-observer-inputs}


      The publication probe stopped before its detailed marker; the workstation directory, platform.env or Python startup may be unavailable before the remote manifest can be inspected. Work in ~/quest and load the supplied platform.env before observing the private repository. This fallback concerns a probe that could not reach its detailed checks; a normal fetch failure or manifest/parser problem is reported as published instead.


      ### Retain published ancestry {#delivery-original-history}


      The baseline is not an ancestor of origin/main or cannot be read; published history may have been replaced, the saved commit may be missing, or environment/fetch operations failed. The baseline is not an ancestor of the actual remote main commit or the observation failed; rewriting published history, an unreadable baseline or failed environment/ls-remote/fetch can break this retained-history check. baseline-commit records the original published ancestor. The first stage compares it with fetched origin/main; the second obtains the actual remote main ID and verifies ancestry after fetching. Retain this original evidence and extend the existing history rather than replacing it. `git -C repository merge-base --is-ancestor "$(cat baseline-commit)" origin/main`.


      ### Reconcile the published release {#delivery-argo-release}


      Application station does not match the published revision and required source/destination or cannot be observed; the initial path retired, pending sync, unhealthy resources or environment/Git/API failures may explain it. Application station must retain project station, the supplied GIT_URL, relative path manifests, targetRevision main and the bay namespace. For the local cluster this check accepts server https://kubernetes.default.svc with name absent or in-cluster, or name in-cluster with server absent. Compare Synced/Healthy and observed revision with git ls-remote; the initial retired path has no required manifests. `git -C repository ls-remote origin refs/heads/main; kubectl get application station -o json`.


      ### Rollout and controller tracking {#delivery-controller-tracking}


      Deployment board has not completed rollout or lacks controller tracking metadata; reconciliation may not have applied it yet, it may be unhealthy, or a manually supplied workload may lack the annotation. Check both completion of rollout within the short observation window and a nonempty argocd.argoproj.io/tracking-id annotation on Deployment board. A successful HTTP response alone does not establish these fields; observe controller reconciliation rather than treating manually copied workload data as its result. `kubectl rollout status deployment/board --timeout=10s`.


      ### Published data at the consumer {#delivery-http-response}


      The worker did not return north-50 at localhost:8080 or exec failed; the published ConfigMap may not be projected into the running workload, stale content may still be served, or the Pod is unavailable. `kubectl exec deployment/board -c worker -- wget -qO- http://127.0.0.1:8080`.


      ## Try it


      Open the **gitops Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Can a normal resource in wave -1 run before an unfinished PreSync hook?


      ```bash

      cd ~/lab/examples/sync

      bash run.sh

      source ~/lab/platform.env

      kubectl -n "$LAB_NAMESPACE" get application lab-guide

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The check compares actual completion and creation timestamps, then checks Deployment readiness.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Repo-server рендерит выбранную ревизию Git. Application controller сравнивает desired и live, затем выполняет sync. Фазы ставят hooks перед обычными ресурсами, waves задают порядок внутри фазы. Одна итоговая отметка Synced не доказывает порядок.


      В квесте 050 сначала перенесите commit ConfigMap из release-candidate в локальную и удаленную `main`, сохранив baseline как предка и чистый worktree. Затем исправьте source path Argo Application на `manifests`. Сравните удаленный commit с синхронизированной revision контроллера, проверьте здоровье отслеживаемого board и ответ `north-50`: ручное изменение живого объекта не является доставкой через Git.


      ### Опубликованный main и рабочее дерево {#delivery-main-state}


      Рабочее дерево не чисто на main с HEAD равным origin/main либо данные недоступны: могла остаться release-candidate, коммит без push или ошибка доступа к origin и окружению. Выданная release-candidate содержит нужное изменение, а начальный main — старый манифест. Перенесите изменение в main без потери истории, опубликуйте, обновите origin/main и сравните коммиты и состояние дерева. Одна локальная правка не является публикацией. `git -C repository status --short --branch; git -C repository rev-parse HEAD origin/main`.


      ### Уведомление в удалённом манифесте {#delivery-published-manifest}


      Удалённый релиз не выдаёт north-50 либо не получен или не разобран: изменение кандидата могло не попасть в main, доступ к origin или manifests/route.yaml отсутствует либо данные некорректны. Проверка читает origin/main:manifests/route.yaml как YAML и требует строку data index.html равную north-50 без завершающих переводов строки. Смотрите закоммиченный удалённый объект, а не только рабочую копию. Ошибка fetch и недоступный, некорректный или неверный манифест имеют общий маркер. `git -C repository show origin/main:manifests/route.yaml`.


      ### Входные данные проверки доставки {#delivery-observer-inputs}


      Проверка публикации остановилась до подробной диагностики: рабочий каталог, platform.env или запуск Python могут быть недоступны до чтения удалённого манифеста. Работайте в ~/quest и загрузите выданный platform.env перед чтением приватного репозитория. Этот fallback означает, что подробные проверки не начались; обычная ошибка fetch или манифеста и его разбора выдаёт published.


      ### Сохранение опубликованной истории {#delivery-original-history}


      Базовый коммит не является предком origin/main либо недоступен: опубликованная история могла быть заменена, сохранённый коммит отсутствует или окружение и fetch завершились ошибкой. Базовый коммит не является предком фактического удалённого main либо наблюдение завершилось ошибкой: историю могли переписать, базовый коммит недоступен или произошёл сбой окружения, ls-remote и fetch. baseline-commit фиксирует исходного опубликованного предка. На первом этапе он сравнивается с полученным origin/main, на втором проверяется предок фактического удалённого main после fetch. Сохраните исходное свидетельство и продолжайте историю, не заменяя её. `git -C repository merge-base --is-ancestor "$(cat baseline-commit)" origin/main`.


      ### Согласование опубликованного релиза {#delivery-argo-release}


      Application station не соответствует опубликованному коммиту и нужным источнику и назначению либо недоступен: причиной могут быть начальный путь retired, незавершённый sync, неготовые ресурсы или ошибки окружения, Git и API. Application station должен сохранить project station, выданный GIT_URL, относительный путь manifests, targetRevision main и пространство bay. Для локального кластера принимается server https://kubernetes.default.svc без name или с name in-cluster либо name in-cluster без server. Сравните Synced/Healthy и коммит с git ls-remote; начальный путь retired не содержит нужных манифестов. `git -C repository ls-remote origin refs/heads/main; kubectl get application station -o json`.


      ### Rollout и отслеживание контроллером {#delivery-controller-tracking}


      Deployment board не завершил rollout либо не содержит метаданных отслеживания: контроллер мог ещё не применить его, нагрузка не готова или вручную созданный объект не имеет аннотации. Проверяйте завершение rollout в короткий срок и непустую аннотацию argocd.argoproj.io/tracking-id у Deployment board. Одного успешного HTTP недостаточно для этих полей; наблюдайте согласование контроллером, а не только вручную скопированную нагрузку. `kubectl rollout status deployment/board --timeout=10s`.


      ### Опубликованные данные у потребителя {#delivery-http-response}


      worker не вернул north-50 на localhost:8080 либо exec завершился ошибкой: опубликованный ConfigMap мог не попасть в работающую нагрузку, выдаётся старое содержимое или Pod недоступен. `kubectl exec deployment/board -c worker -- wget -qO- http://127.0.0.1:8080`.


      ## Попробуйте


      Откройте лабораторию **gitops**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Может ли обычный ресурс wave -1 обойти незавершённый PreSync hook?


      ```bash

      cd ~/lab/examples/sync

      bash run.sh

      source ~/lab/platform.env

      kubectl -n "$LAB_NAMESPACE" get application lab-guide

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. Проверка сравнивает фактические времена завершения и создания, затем готовность Deployment.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Repo-server renderuje wybraną wersję Git. Kontroler aplikacji porównuje obiekty desired i live, a następnie wykonuje sync. Fazy ​​porządkują hooks przed zwykłymi zasobami; waves zlecenie pracy w fazie. Sama ostateczna etykieta Synced nie potwierdza kolejności.


      W zadaniu 050 najpierw przenieś commit ConfigMap z release-candidate do lokalnej i zdalnej `main`, zachowując baseline jako przodka i czysty worktree. Następnie popraw source path Argo Application na `manifests`. Porównaj zdalny commit z zsynchronizowaną revision kontrolera, sprawdź zdrowie śledzonego board i odpowiedź `north-50`; ręczna zmiana żywego obiektu nie jest dostarczeniem przez Git.


      ### Opublikowany main i drzewo robocze {#delivery-main-state}


      Drzewo robocze nie jest czyste na main z HEAD równym origin/main lub dane są niedostępne; nadal może być wybrana release-candidate, commit niewysłany albo brak dostępu do origin i środowiska. Dostarczona release-candidate zawiera zmianę, a początkowy main stary manifest. Przenieś zmianę na main bez utraty historii, opublikuj, odśwież origin/main i porównaj commity oraz stan drzewa. Sama edycja lokalnego pliku nie publikuje go. `git -C repository status --short --branch; git -C repository rev-parse HEAD origin/main`.


      ### Komunikat w zdalnym manifeście {#delivery-published-manifest}


      Zdalne wydanie nie dostarcza north-50 lub nie można go pobrać albo odczytać; zmiana kandydata mogła nie trafić do main, brak dostępu do origin albo manifests/route.yaml jest niedostępny lub błędny. Kontrola czyta origin/main:manifests/route.yaml jako YAML i wymaga tekstu data index.html równego north-50 po usunięciu końcowych nowych linii. Sprawdź zatwierdzony obiekt zdalny, nie samą kopię roboczą. Błąd fetch oraz niedostępny, błędny lub nieprawidłowy manifest mają wspólny marker. `git -C repository show origin/main:manifests/route.yaml`.


      ### Dane kontroli prywatnej dostawy {#delivery-observer-inputs}


      Kontrola publikacji zatrzymała się przed szczegółową diagnostyką; katalog roboczy, platform.env lub start Pythona mogą być niedostępne przed odczytem zdalnego manifestu. Pracuj w ~/quest i załaduj platform.env przed kontrolą prywatnego repozytorium. Ten fallback oznacza brak szczegółowych kontroli; zwykły błąd fetch albo manifestu i jego parsera zgłasza published.


      ### Zachowanie opublikowanej historii {#delivery-original-history}


      Punkt bazowy nie jest przodkiem origin/main lub jest nieczytelny; opublikowana historia mogła zostać zastąpiona, zapisany commit nie istnieje albo środowisko i fetch zawiodły. Punkt bazowy nie jest przodkiem faktycznego zdalnego main lub obserwacja zawiodła; historię mogli zastąpić, baza jest nieczytelna albo środowisko, ls-remote lub fetch zawiodło. baseline-commit zapisuje pierwotnego opublikowanego przodka. Pierwsza faza porównuje go z pobranym origin/main, druga sprawdza przodka rzeczywistego zdalnego main po fetch. Zachowaj zapis i rozszerzaj historię zamiast ją zastępować. `git -C repository merge-base --is-ancestor "$(cat baseline-commit)" origin/main`.


      ### Uzgodnienie opublikowanego wydania {#delivery-argo-release}


      Application station nie odpowiada opublikowanej rewizji i wymaganemu źródłu/celowi lub jest nieczytelny; przyczyną może być początkowa ścieżka retired, oczekujący sync, niezdrowe zasoby albo błędy środowiska, Git i API. Application station musi zachować project station, GIT_URL, względną ścieżkę manifests, targetRevision main i przestrzeń bay. Lokalny klaster dopuszcza server https://kubernetes.default.svc bez name lub z name in-cluster albo name in-cluster bez server. Porównaj Synced/Healthy i rewizję z git ls-remote; początkowy retired nie ma wymaganych manifestów. `git -C repository ls-remote origin refs/heads/main; kubectl get application station -o json`.


      ### Rollout i śledzenie kontrolera {#delivery-controller-tracking}


      Deployment board nie zakończył rollout lub nie ma metadanych śledzenia; kontroler mógł go jeszcze nie zastosować, aplikacja jest niezdrowa albo obiekt utworzony ręcznie nie ma adnotacji. Sprawdź zakończenie rollout w krótkim oknie oraz niepustą adnotację argocd.argoproj.io/tracking-id w Deployment board. Sam poprawny HTTP nie potwierdza tych pól; obserwuj uzgadnianie kontrolera, nie tylko ręcznie skopiowaną aplikację. `kubectl rollout status deployment/board --timeout=10s`.


      ### Opublikowane dane u odbiorcy {#delivery-http-response}


      Worker nie zwrócił north-50 na localhost:8080 lub exec zawiódł; opublikowany ConfigMap może nie być zamontowany w aplikacji, nadal podawane są stare dane albo Pod jest niedostępny. `kubectl exec deployment/board -c worker -- wget -qO- http://127.0.0.1:8080`.


      ## Wypróbuj


      Otwórz laboratorium **gitops** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy normalny zasób w wave -1 może działać przed niedokończonym PreSync hook?


      ```bash

      cd ~/lab/examples/sync

      bash run.sh

      source ~/lab/platform.env

      kubectl -n "$LAB_NAMESPACE" get application lab-guide

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. Kontrola porównuje rzeczywiste znaczniki czasu ukończenia i utworzenia, a następnie sprawdza gotowość Deployment.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Repo-server representa la revisión Git elegida. El application controller compara desired y objetos en vivo, luego realiza sync. Orden de fases hooks antes que recursos ordinarios; Trabajo de orden waves dentro de una fase. Una etiqueta final Synced por sí sola no prueba el pedido.


      En el ejercicio 050, primero recupera el commit del ConfigMap de release-candidate en `main` local y remoto, conservando baseline como ancestro y el worktree limpio. Después corrige el source path de Argo Application a `manifests`. Compara el commit remoto con la revisión sincronizada del controlador, confirma que el board rastreado esté sano y solicita `north-50`; editar el objeto activo a mano no es entrega por Git.


      ### main publicado y árbol de trabajo {#delivery-main-state}


      El árbol de trabajo no está limpio en main con HEAD igual a origin/main o no se puede observar; puede seguir en release-candidate, haber un commit sin enviar o fallar origin o el entorno. release-candidate contiene el cambio y main inicial el manifiesto anterior. Transfiera el cambio a main conservando historial, publíquelo, actualice origin/main y compare commits y árbol de trabajo. Editar un archivo local no lo publica. `git -C repository status --short --branch; git -C repository rev-parse HEAD origin/main`.


      ### Aviso en el manifiesto remoto {#delivery-published-manifest}


      La versión remota no proporciona north-50 o no se obtiene o analiza; el cambio candidato puede no haber llegado a main, o el acceso a origin o manifests/route.yaml falta o es inválido. La prueba lee origin/main:manifests/route.yaml como YAML y exige data index.html igual a north-50 sin saltos finales. Inspeccione el objeto remoto confirmado además de la copia local. Un fallo fetch y un manifiesto ausente, inválido o incorrecto comparten marcador. `git -C repository show origin/main:manifests/route.yaml`.


      ### Entradas de observación de entrega privada {#delivery-observer-inputs}


      La prueba de publicación se detuvo antes del diagnóstico detallado; el directorio de trabajo, platform.env o el inicio de Python pueden no estar disponibles antes de inspeccionar el manifiesto remoto. Trabaje en ~/quest y cargue platform.env antes de observar el repositorio privado. Este diagnóstico alternativo indica que no se alcanzó el detalle; un fallo fetch o del manifiesto o parser se informa como published.


      ### Conservar la ascendencia publicada {#delivery-original-history}


      La base no es antecesora de origin/main o no puede leerse; el historial puede haberse sustituido, faltar el commit guardado o fallar el entorno o fetch. La base no es antecesora del commit main remoto actual o falló la observación; reescribir historial, una base ilegible o fallos de entorno, ls-remote o fetch pueden impedirlo. baseline-commit conserva el antecesor original publicado. La primera fase lo compara con origin/main obtenido y la segunda con el main remoto real tras fetch. Conserve la evidencia y amplíe el historial existente en vez de reemplazarlo. `git -C repository merge-base --is-ancestor "$(cat baseline-commit)" origin/main`.


      ### Reconciliar la versión publicada {#delivery-argo-release}


      Application station no coincide con la revisión publicada y el origen/destino requerido o no puede observarse; puede deberse a la ruta inicial retired, sync pendiente, recursos sin salud o fallos de entorno, Git o API. Application station debe conservar project station, GIT_URL, ruta relativa manifests, targetRevision main y el espacio bay. Se acepta server https://kubernetes.default.svc sin name o con name in-cluster, o name in-cluster sin server. Compare Synced/Healthy y revisión con git ls-remote; retired inicial no contiene los manifiestos necesarios. `git -C repository ls-remote origin refs/heads/main; kubectl get application station -o json`.


      ### Despliegue y seguimiento del controlador {#delivery-controller-tracking}


      Deployment board no completó el despliegue o carece de seguimiento; el controlador puede no haberlo aplicado, la carga no está sana o un objeto manual carece de la anotación. Compruebe despliegue completo en la ventana corta y anotación argocd.argoproj.io/tracking-id no vacía en Deployment board. HTTP correcto no acredita esos campos; observe la reconciliación del controlador además de la carga copiada manualmente. `kubectl rollout status deployment/board --timeout=10s`.


      ### Datos publicados en el consumidor {#delivery-http-response}


      worker no devolvió north-50 en localhost:8080 o falló exec; el ConfigMap publicado puede no estar proyectado en la carga actual, seguir sirviéndose contenido antiguo o el Pod no está disponible. `kubectl exec deployment/board -c worker -- wget -qO- http://127.0.0.1:8080`.


      ## Pruébalo


      Abra el laboratorio **gitops** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿Se puede ejecutar un recurso normal en wave -1 antes que un PreSync hook sin terminar?


      ```bash

      cd ~/lab/examples/sync

      bash run.sh

      source ~/lab/platform.env

      kubectl -n "$LAB_NAMESPACE" get application lab-guide

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. La verificación compara las marcas de tiempo reales de finalización y creación y luego verifica que Deployment esté listo.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh` y luego con `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Repo-server rendert die ausgewählte Git-Revision. Der application controller vergleicht desired und Live-Objekte und führt dann sync aus. Phasenordnung hooks vor gewöhnlichen Ressourcen; waves Auftragsarbeit innerhalb einer Phase. Ein abschließendes Synced-Etikett allein beweist die Bestellung noch nicht.


      Übernimm in Aufgabe 050 zuerst den ConfigMap-Commit aus release-candidate auf lokales und entferntes `main`; erhalte baseline als Vorfahren und einen sauberen Worktree. Korrigiere dann den Source-Pfad der Argo Application auf `manifests`. Vergleiche den entfernten Commit mit der synchronisierten Controller-Revision, prüfe das verfolgte Board auf Gesundheit und frage `north-50` ab; eine manuelle Änderung des Live-Objekts ist keine Git-Auslieferung.


      ### Veröffentlichter main und Arbeitsverzeichnis {#delivery-main-state}


      Das Arbeitsverzeichnis ist nicht sauber auf main mit HEAD gleich origin/main oder nicht beobachtbar; möglicherweise ist release-candidate ausgecheckt, ein Commit fehlt auf dem Server oder origin beziehungsweise Umgebung sind nicht verfügbar. Der gelieferte release-candidate enthält die Änderung, der anfängliche main das alte Manifest. Übertragen Sie die Änderung ohne Historienverlust auf main, veröffentlichen Sie sie, aktualisieren Sie origin/main und vergleichen Sie Commits sowie Arbeitsverzeichnis. Eine lokale Dateiänderung allein veröffentlicht nichts. `git -C repository status --short --branch; git -C repository rev-parse HEAD origin/main`.


      ### Meldung im entfernten Manifest {#delivery-published-manifest}


      Die entfernte Version liefert nicht north-50 oder lässt sich nicht abrufen beziehungsweise lesen; die Kandidatenänderung fehlt möglicherweise auf main, origin ist nicht zugänglich oder manifests/route.yaml fehlt beziehungsweise ist ungültig. Die Prüfung liest origin/main:manifests/route.yaml als YAML und verlangt data index.html gleich north-50 ohne abschließende Zeilenumbrüche. Prüfen Sie das eingecheckte entfernte Objekt zusätzlich zur Arbeitskopie. Fetch-Fehler sowie fehlende, ungültige oder falsche Manifeste teilen diesen Marker. `git -C repository show origin/main:manifests/route.yaml`.


      ### Eingaben der privaten Delivery-Prüfung {#delivery-observer-inputs}


      Die Publikationsprüfung endete vor der Detaildiagnose; Arbeitsverzeichnis, platform.env oder Python-Start sind möglicherweise vor dem Lesen des entfernten Manifests nicht verfügbar. Arbeiten Sie in ~/quest und laden Sie platform.env vor der Prüfung des privaten Repositorys. Dieser Fallback betrifft eine Prüfung vor der Detailbeobachtung; normale Fetch- sowie Manifest-/Parserfehler werden als published gemeldet.


      ### Veröffentlichte Abstammung erhalten {#delivery-original-history}


      Die Basis ist kein Vorfahr von origin/main oder ist unlesbar; die veröffentlichte Historie wurde möglicherweise ersetzt, der gespeicherte Commit fehlt oder Umgebung beziehungsweise fetch schlugen fehl. Die Basis ist kein Vorfahr des tatsächlichen entfernten main-Commits oder die Beobachtung schlug fehl; überschriebene Historie, eine unlesbare Basis oder Fehler bei Umgebung, ls-remote beziehungsweise fetch können diese Prüfung verhindern. baseline-commit hält den ursprünglich veröffentlichten Vorfahren fest. Phase eins vergleicht ihn mit abgerufenem origin/main, Phase zwei mit der tatsächlichen entfernten main-ID nach fetch. Erhalten Sie den Beleg und erweitern Sie die Historie, statt sie zu ersetzen. `git -C repository merge-base --is-ancestor "$(cat baseline-commit)" origin/main`.


      ### Veröffentlichte Version abgleichen {#delivery-argo-release}


      Application station passt nicht zur veröffentlichten Revision und geforderten Quelle beziehungsweise Ziel oder ist nicht beobachtbar; der anfängliche Pfad retired, ausstehender Sync, fehlerhafte Ressourcen oder Umgebungs-/Git-/API-Fehler können die Ursache sein. Application station muss project station, GIT_URL, den relativen Pfad manifests, targetRevision main und den Bay-Namespace bewahren. Lokal akzeptiert die Prüfung server https://kubernetes.default.svc ohne name oder mit name in-cluster sowie name in-cluster ohne server. Vergleichen Sie Synced/Healthy und Revision mit git ls-remote; der anfängliche Pfad retired enthält die benötigten Manifeste nicht. `git -C repository ls-remote origin refs/heads/main; kubectl get application station -o json`.


      ### Rollout und Controller-Tracking {#delivery-controller-tracking}


      Deployment board hat den Rollout nicht abgeschlossen oder besitzt keine Tracking-Metadaten; der Controller hat es möglicherweise noch nicht angewendet, die Anwendung ist fehlerhaft oder einem manuell erstellten Objekt fehlt die Annotation. Prüfen Sie abgeschlossenen Rollout im kurzen Zeitfenster und eine nicht leere Annotation argocd.argoproj.io/tracking-id auf Deployment board. HTTP-Erfolg allein belegt diese Felder nicht; beobachten Sie den Controller-Abgleich zusätzlich zu manuell kopierten Workloads. `kubectl rollout status deployment/board --timeout=10s`.


      ### Veröffentlichte Daten beim Verbraucher {#delivery-http-response}


      Der worker lieferte an localhost:8080 nicht north-50 oder exec schlug fehl; die veröffentlichte ConfigMap ist möglicherweise nicht in der laufenden Anwendung eingebunden, es werden alte Inhalte geliefert oder der Pod ist nicht verfügbar. `kubectl exec deployment/board -c worker -- wget -qO- http://127.0.0.1:8080`.


      ## Probieren Sie es aus


      Öffnen Sie das **gitops Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und prüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Kann eine normale Ressource in wave -1 vor einer unvollendeten Ressource in PreSync hook ausgeführt werden?


      ```bash

      cd ~/lab/examples/sync

      bash run.sh

      source ~/lab/platform.env

      kubectl -n "$LAB_NAMESPACE" get application lab-guide

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Die Prüfung vergleicht die tatsächlichen Fertigstellungs- und Erstellungszeitstempel und überprüft dann die Deployment-Bereitschaft.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-sync
cicd-gitops-8:
  profile: gitops
  example: drift
  source_hash: 7ae8955912689cdeb9b6bb8f1abfc3f5fcbb5d890407e9d59fbd7656aab68f62
  content:
    en: 'Self-heal reconciles a live edit back to Git. Prune allows deletion of managed objects removed from Git. These are separate controls: observing a new revision or correcting a value does not prove that deletion is enabled.


      When configuration and consumer lifetimes differ, distinguish object identity, input binding and observed data. A single status or response does not establish all three. Keep recorded history available when comparing states.


      ### Preserve original object UIDs {#handover-original-identities}


      An original Application, Deployment, ConfigMap or Pod UID changed; deleting and recreating an object can retain its name while replacing the identity preserved by setup.  `cat handover-contract.json; kubectl get application station -o json; kubectl get deployment relay -o json`.


      ### Retain the immutable old version {#handover-retained-configuration}


      The retained ConfigMap is no longer immutable with its original data; replacing or changing it to switch the active route can break the input still used by the original consumer Pod.  `kubectl get configmap relay-route -o yaml`.


      ### Preserve the existing Pod and response {#handover-original-consumer}


      The original Pod fields or HTTP bytes differ from the retained receipt; changing its image, command, mounts or security context, or serving altered configuration data, can break the preserved consumer. The protected receipt compares only the listed container fields, volumes and Pod security context, plus the complete HTTP body from retained-reader. Preserve its UID and old configuration bytes, including the trailing newline. A new Deployment rollout may replace its own Pods; replacing the retained-reader Pod breaks this separate continuity requirement. `kubectl get pod retained-reader -o yaml; kubectl exec retained-reader -- wget -qO- http://127.0.0.1:8080`.


      ### Bind to a distinct immutable version {#handover-versioned-binding}


      The active route still uses the retained map or an invalid reference, or the new map is not immutable with the required value; an immutable in-place update must be replaced by a distinct configuration version.  `kubectl get deployment relay -o yaml; kubectl get configmaps -o yaml`.


      ### Include the managed Deployment in comparisons {#handover-managed-comparison}


      A matching Deployment ignoreDifferences rule still excludes fields from reconciliation; the supplied environment exclusion can hide live drift instead of adopting the published route binding.  `kubectl get application station -o yaml`.


      ### Published Git and adopted configuration {#handover-published-source}


      The handover may exist only live or locally; an unpushed or unsynchronized Git revision, changed Application source/destination, or Git/live binding and data differences can prevent adoption of the published configuration. Keep the original repository, project and entire destination mapping, main revision and safe manifests path. Publish the old immutable map unchanged and a separate immutable map for the approved route, then bind the managed Deployment to that version. The fetched main must descend from the baseline, match the Application sync revision, and declare the same route entries and new map data as live. Argo must list that map as Synced. Remove matching Deployment field exclusions before synchronizing. `git -C repository fetch origin main; kubectl get application station -o json`.


      ### Bounded handover observations {#handover-observation-budget}


      A command or the overall handover deadline expired; slow Git, Kubernetes API or Pod HTTP observations may prevent completing all comparisons within the bounded probe.  `kubectl get application station -o json`.


      ### Readable handover evidence and commands {#handover-input-observation}


      The handover could not be observed consistently; missing objects or protected evidence, malformed ROUTE entries or manifests, or failed Git fetch/ancestry and API operations may explain it.  `cat handover-contract.json; kubectl get deployment relay -o yaml`.


      ### Synchronization and health gate {#handover-sync-health}


      Application is not Synced and Healthy, or the observer could not start; Git may still request an in-place change to the retained immutable map, while platform.env, Python or required probe inputs may also be unavailable.  `kubectl get application station -o json`.


      ### Current process route {#handover-live-route}


      Deployment relay does not report ROUTE=north or exec failed; it may still use the retained map or an old Pod environment instead of the new immutable configuration.  `kubectl exec deployment/relay -c worker -- printenv ROUTE`.


      ### Readiness of the managed workload {#handover-workload-readiness}


      Deployment relay did not complete rollout within 3 seconds; the new ConfigMap or key may be unavailable, replacement Pods may not have started, or the API observation failed.  `kubectl rollout status deployment/relay --timeout=10s`.


      ## Try it


      Open the **gitops Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Will selfHeal=true alone remove a ConfigMap deleted from Git?


      ```bash

      cd ~/lab/examples/drift

      bash run.sh

      source ~/lab/platform.env

      kubectl -n "$LAB_NAMESPACE" get application lab-guide -o yaml

      bash check.sh

      ```


      > [!question]- Expected result

      > No. The ConfigMap remains with prune disabled, then disappears when prune is explicitly enabled.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'Self-heal возвращает ручное изменение к Git. Prune разрешает удаление управляемых объектов, исчезнувших из Git. Это разные настройки: новая ревизия и исправленное значение ещё не доказывают разрешение удаления.


      Когда сроки жизни конфигурации и потребителя различаются, различайте идентичность объекта, привязку входных данных и наблюдаемые данные. Один статус или ответ не подтверждает все три свойства. При сравнении состояний сохраняйте доступность зафиксированной истории.


      ### Сохранение UID исходных объектов {#handover-original-identities}


      Изменился UID исходного Application, Deployment, ConfigMap или Pod: удаление и пересоздание сохраняют имя, но заменяют идентичность, зафиксированную setup.  `cat handover-contract.json; kubectl get application station -o json; kubectl get deployment relay -o json`.


      ### Сохранение старой immutable-версии {#handover-retained-configuration}


      Сохранённый ConfigMap больше не immutable с исходными данными: его замена или изменение ради переключения маршрута нарушает вход, который продолжает использовать исходный Pod.  `kubectl get configmap relay-route -o yaml`.


      ### Сохранение существующего Pod и ответа {#handover-original-consumer}


      Поля исходного Pod или байты HTTP отличаются от свидетельства: изменение образа, команды, монтирований, security context или выдача других данных нарушает сохранённого потребителя. Защищённая запись сравнивает перечисленные поля контейнера, volumes и контекст безопасности Pod, а также полное тело HTTP от retained-reader. Сохраните его UID и старые байты конфигурации, включая конечный перевод строки. Rollout Deployment может заменять свои Pod; замена retained-reader нарушает отдельное требование непрерывности. `kubectl get pod retained-reader -o yaml; kubectl exec retained-reader -- wget -qO- http://127.0.0.1:8080`.


      ### Ссылка на отдельную immutable-версию {#handover-versioned-binding}


      Активный маршрут ещё использует сохранённую карту или неверную ссылку либо новая карта не immutable с нужным значением: вместо изменения immutable-объекта на месте нужна отдельная версия конфигурации.  `kubectl get deployment relay -o yaml; kubectl get configmaps -o yaml`.


      ### Участие управляемого Deployment в сравнении {#handover-managed-comparison}


      Правило ignoreDifferences для нужного Deployment ещё исключает поля из согласования: выданное исключение окружения может скрывать live drift вместо применения опубликованной ссылки маршрута.  `kubectl get application station -o yaml`.


      ### Опубликованный Git и применённая конфигурация {#handover-published-source}


      Передача может существовать только live или локально: неопубликованный или несинхронизированный коммит, изменённые источник и назначение Application либо расхождение ссылок и данных Git/live мешают применению опубликованной конфигурации. Сохраните исходные репозиторий, project и весь словарь destination, ревизию main и безопасный путь manifests. Опубликуйте старую immutable-карту без изменений и отдельную immutable-карту для одобренного маршрута, затем переключите Deployment на новую версию. Полученный main должен продолжать baseline, совпадать с sync revision Application и задавать те же записи маршрута и данные новой карты, что live. Argo должен показывать эту карту как Synced. Удалите исключения полей нужного Deployment перед синхронизацией. `git -C repository fetch origin main; kubectl get application station -o json`.


      ### Ограниченное время наблюдения передачи {#handover-observation-budget}


      Истёк лимит отдельной команды или всей проверки: медленные запросы Git, Kubernetes API или HTTP в Pod могут помешать завершить все сравнения вовремя.  `kubectl get application station -o json`.


      ### Читаемые данные и команды передачи {#handover-input-observation}


      Не удалось согласованно наблюдать передачу: причиной могут быть отсутствующие объекты или защищённые данные, некорректные записи ROUTE или манифесты, ошибки Git fetch, ancestry и API.  `cat handover-contract.json; kubectl get deployment relay -o yaml`.


      ### Условие синхронизации и готовности {#handover-sync-health}


      Application не имеет Synced и Healthy либо наблюдение не началось: Git мог сохранить изменение immutable-карты на месте; platform.env, Python или нужные входные данные также могут быть недоступны.  `kubectl get application station -o json`.


      ### Текущий маршрут процесса {#handover-live-route}


      Deployment relay не сообщает ROUTE=north либо exec завершился ошибкой: мог сохраниться старый ConfigMap или окружение Pod вместо новой immutable-конфигурации.  `kubectl exec deployment/relay -c worker -- printenv ROUTE`.


      ### Готовность управляемой нагрузки {#handover-workload-readiness}


      Deployment relay не завершил rollout за 3 секунды: новый ConfigMap или ключ недоступен, новые Pod ещё не запустились либо наблюдение API завершилось ошибкой.  `kubectl rollout status deployment/relay --timeout=10s`.


      ## Попробуйте


      Откройте лабораторию **gitops**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Удалит ли один selfHeal=true ConfigMap, исчезнувший из Git?


      ```bash

      cd ~/lab/examples/drift

      bash run.sh

      source ~/lab/platform.env

      kubectl -n "$LAB_NAMESPACE" get application lab-guide -o yaml

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Нет. При выключенном prune ConfigMap сохраняется и исчезает после явного включения prune.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Self-heal uzgadnia edycję na żywo z powrotem do Git. Prune, umożliwiając usuwanie zarządzanych obiektów usuniętych z Git. Są to odrębne kontrole: zaobserwowanie nowej wersji lub poprawienie wartości nie oznacza, że ​​możliwe jest usunięcie.


      Gdy konfiguracja i odbiorca mają różne okresy życia, odróżnij tożsamość obiektu, powiązanie źródła i obserwowane dane. Pojedynczy status lub odpowiedź nie potwierdza wszystkich trzech właściwości. Zachowaj zapisaną historię podczas porównywania stanów.


      ### Zachowanie UID pierwotnych obiektów {#handover-original-identities}


      Zmienił się UID pierwotnego Application, Deployment, ConfigMap lub Poda; usunięcie i odtworzenie może zachować nazwę, ale zastępuje tożsamość zapisaną przez setup.  `cat handover-contract.json; kubectl get application station -o json; kubectl get deployment relay -o json`.


      ### Zachowanie starej wersji immutable {#handover-retained-configuration}


      Zachowany ConfigMap nie jest już immutable z pierwotnymi danymi; zastąpienie lub zmiana dla przełączenia trasy może naruszyć wejście nadal używane przez pierwotny Pod.  `kubectl get configmap relay-route -o yaml`.


      ### Zachowanie istniejącego Poda i odpowiedzi {#handover-original-consumer}


      Pola pierwotnego Poda lub bajty HTTP różnią się od zapisu; zmiana obrazu, polecenia, montowań, security context albo podawanie innych danych może naruszyć zachowanego odbiorcę. Chroniony zapis porównuje wymienione pola kontenera, volumes i kontekst bezpieczeństwa Poda oraz całe ciało HTTP z retained-reader. Zachowaj jego UID i stare bajty konfiguracji wraz z końcowym znakiem nowej linii. Rollout Deployment może wymieniać własne Pody; wymiana retained-reader narusza osobny wymóg ciągłości. `kubectl get pod retained-reader -o yaml; kubectl exec retained-reader -- wget -qO- http://127.0.0.1:8080`.


      ### Referencja osobnej wersji immutable {#handover-versioned-binding}


      Aktywna trasa nadal używa zachowanej mapy lub błędnej referencji albo nowa mapa nie jest immutable z wymaganą wartością; zamiast zmiany immutable w miejscu potrzebna jest osobna wersja konfiguracji.  `kubectl get deployment relay -o yaml; kubectl get configmaps -o yaml`.


      ### Uwzględnienie zarządzanego Deployment w porównaniu {#handover-managed-comparison}


      Pasująca reguła ignoreDifferences dla Deployment nadal wyklucza pola z uzgadniania; dostarczone pomijanie środowiska może ukrywać drift zamiast przyjąć opublikowaną referencję trasy.  `kubectl get application station -o yaml`.


      ### Opublikowany Git i przyjęta konfiguracja {#handover-published-source}


      Przekazanie może istnieć tylko na żywo lub lokalnie; niewysłana lub niezsynchronizowana rewizja, zmienione źródło/cel Application albo różne referencje i dane Git/live blokują przyjęcie publikacji. Zachowaj repozytorium, project i cały słownik destination, rewizję main i bezpieczną ścieżkę manifests. Opublikuj starą immutable mapę bez zmian i osobną immutable mapę zatwierdzonej trasy, następnie skieruj Deployment na nową wersję. Pobrany main musi pochodzić od baseline, zgadzać się z sync revision Application oraz deklarować te same wpisy trasy i dane nowej mapy co stan na żywo. Argo musi wykazać tę mapę jako Synced. Usuń pasujące wyłączenia pól Deployment przed synchronizacją. `git -C repository fetch origin main; kubectl get application station -o json`.


      ### Ograniczony czas obserwacji przekazania {#handover-observation-budget}


      Upłynął limit polecenia lub całej kontroli; powolne obserwacje Git, Kubernetes API lub HTTP Poda mogą uniemożliwić ukończenie wszystkich porównań.  `kubectl get application station -o json`.


      ### Czytelne dane i polecenia przekazania {#handover-input-observation}


      Nie dało się spójnie obserwować przekazania; przyczyną mogą być brakujące obiekty lub chronione dane, błędne wpisy ROUTE lub manifesty albo błędy Git fetch, ancestry i API.  `cat handover-contract.json; kubectl get deployment relay -o yaml`.


      ### Warunek synchronizacji i kondycji {#handover-sync-health}


      Application nie jest Synced i Healthy lub obserwator nie wystartował; Git może nadal żądać zmiany zachowanej immutable mapy w miejscu, a platform.env, Python lub dane kontroli mogą być niedostępne.  `kubectl get application station -o json`.


      ### Bieżąca trasa procesu {#handover-live-route}


      Deployment relay nie zgłasza ROUTE=north lub exec zawiódł; może nadal używać zachowanej mapy albo starego środowiska Poda zamiast nowej immutable konfiguracji.  `kubectl exec deployment/relay -c worker -- printenv ROUTE`.


      ### Gotowość zarządzanej aplikacji {#handover-workload-readiness}


      Deployment relay nie zakończył rollout w 3 sekundy; nowy ConfigMap lub klucz jest niedostępny, nowe Pody jeszcze nie ruszyły albo obserwacja API zawiodła.  `kubectl rollout status deployment/relay --timeout=10s`.


      ## Wypróbuj


      Otwórz laboratorium **gitops** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy samo selfHeal=true usunie ConfigMap usunięte z Git?


      ```bash

      cd ~/lab/examples/drift

      bash run.sh

      source ~/lab/platform.env

      kubectl -n "$LAB_NAMESPACE" get application lab-guide -o yaml

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Nie. ConfigMap pozostaje przy wyłączonym prune, a następnie znika, gdy prune jest jawnie włączone.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Self-heal reconcilia una edición en vivo con Git. Prune permite la eliminación de objetos administrados eliminados de Git. Estos son controles separados: observar una nueva revisión o corregir un valor no prueba que la eliminación esté habilitada.


      Cuando configuración y consumidor tienen vidas distintas, distingue identidad del objeto, vinculación de entrada y datos observados. Un único estado o respuesta no demuestra las tres propiedades. Conserva la historia registrada al comparar estados.


      ### Conservar UID de objetos originales {#handover-original-identities}


      Cambió un UID original de Application, Deployment, ConfigMap o Pod; borrar y recrear puede conservar el nombre pero sustituye la identidad guardada por el setup.  `cat handover-contract.json; kubectl get application station -o json; kubectl get deployment relay -o json`.


      ### Conservar la versión immutable anterior {#handover-retained-configuration}


      El ConfigMap conservado ya no es immutable con sus datos originales; sustituirlo o cambiarlo para activar la ruta puede romper la entrada que usa el Pod original.  `kubectl get configmap relay-route -o yaml`.


      ### Conservar Pod existente y respuesta {#handover-original-consumer}


      Los campos del Pod original o bytes HTTP difieren del registro; cambiar imagen, comando, montajes o contexto de seguridad, o servir otros datos, puede romper el consumidor conservado. El registro protegido compara los campos enumerados del contenedor, volumes y contexto de seguridad Pod, más el cuerpo HTTP completo de retained-reader. Conserve su UID y bytes anteriores, incluido el salto final. El rollout Deployment puede reemplazar sus propios Pods; reemplazar retained-reader incumple la continuidad independiente. `kubectl get pod retained-reader -o yaml; kubectl exec retained-reader -- wget -qO- http://127.0.0.1:8080`.


      ### Referenciar una versión immutable distinta {#handover-versioned-binding}


      La ruta activa sigue usando el mapa conservado o una referencia inválida, o el nuevo mapa no es immutable con el valor requerido; la actualización in situ debe sustituirse por otra versión de configuración.  `kubectl get deployment relay -o yaml; kubectl get configmaps -o yaml`.


      ### Incluir Deployment gestionado en comparaciones {#handover-managed-comparison}


      Una regla ignoreDifferences del Deployment objetivo sigue excluyendo campos; la exclusión suministrada del entorno puede ocultar drift en vez de adoptar la referencia publicada.  `kubectl get application station -o yaml`.


      ### Git publicado y configuración adoptada {#handover-published-source}


      La transferencia puede existir solo en vivo o localmente; una revisión sin enviar o sincronizar, origen/destino Application cambiado o diferencias Git/live de referencias y datos impiden adoptar la publicación. Conserve repositorio, project y todo el diccionario destination originales, revisión main y ruta manifests segura. Publique intacto el mapa immutable anterior y otro immutable para la ruta aprobada, y vincule Deployment a la nueva versión. El main obtenido debe descender de baseline, coincidir con sync revision Application y declarar las mismas entradas de ruta y datos del nuevo mapa que en vivo. Argo debe listar ese mapa como Synced. Quite exclusiones de campos del Deployment objetivo antes de sincronizar. `git -C repository fetch origin main; kubectl get application station -o json`.


      ### Observaciones de transferencia acotadas {#handover-observation-budget}


      Expiró el plazo de un comando o de toda la prueba; observaciones lentas de Git, Kubernetes API o HTTP del Pod pueden impedir completar las comparaciones.  `kubectl get application station -o json`.


      ### Evidencia y comandos legibles de transferencia {#handover-input-observation}


      No se pudo observar coherentemente la transferencia; objetos o evidencia protegida ausentes, entradas ROUTE o manifiestos inválidos o fallos Git fetch, ancestry y API pueden explicarlo.  `cat handover-contract.json; kubectl get deployment relay -o yaml`.


      ### Condición de sincronización y salud {#handover-sync-health}


      Application no está Synced y Healthy o el observador no pudo iniciarse; Git puede seguir pidiendo cambiar el mapa immutable conservado in situ, o platform.env, Python y entradas no están disponibles.  `kubectl get application station -o json`.


      ### Ruta actual del proceso {#handover-live-route}


      Deployment relay no informa ROUTE=north o falló exec; puede seguir usando el mapa conservado o un entorno Pod antiguo en vez de la nueva configuración immutable.  `kubectl exec deployment/relay -c worker -- printenv ROUTE`.


      ### Disponibilidad de la carga gestionada {#handover-workload-readiness}


      Deployment relay no completó el despliegue en 3 segundos; el nuevo ConfigMap o clave puede faltar, los Pods nuevos no arrancaron o falló la observación API.  `kubectl rollout status deployment/relay --timeout=10s`.


      ## Pruébalo


      Abra el laboratorio **gitops** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿El selfHeal=true por sí solo eliminará un ConfigMap eliminado de Git?


      ```bash

      cd ~/lab/examples/drift

      bash run.sh

      source ~/lab/platform.env

      kubectl -n "$LAB_NAMESPACE" get application lab-guide -o yaml

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > No. El ConfigMap permanece con prune deshabilitado y luego desaparece cuando prune se habilita explícitamente.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh` y luego con `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Self-heal gleicht eine Live-Bearbeitung wieder mit Git ab. Prune ermöglicht das Löschen verwalteter Objekte, die aus Git entfernt wurden. Hierbei handelt es sich um separate Kontrollen: Das Beobachten einer neuen Revision oder das Korrigieren eines Werts beweist nicht, dass das Löschen aktiviert ist.


      Wenn Konfiguration und Verbraucher unterschiedliche Lebenszeiten haben, unterscheide Objektidentität, Eingabebindung und beobachtete Daten. Ein einzelner Status oder eine Antwort belegt nicht alle drei Eigenschaften. Bewahre die aufgezeichnete Historie für Zustandsvergleiche.


      ### Ursprüngliche Objekt-UIDs erhalten {#handover-original-identities}


      Die ursprüngliche UID von Application, Deployment, ConfigMap oder Pod hat sich geändert; Löschen und Neuerstellen kann den Namen bewahren, ersetzt aber die im Setup festgehaltene Identität.  `cat handover-contract.json; kubectl get application station -o json; kubectl get deployment relay -o json`.


      ### Alte immutable Version erhalten {#handover-retained-configuration}


      Die erhaltene ConfigMap ist nicht mehr immutable mit ursprünglichen Daten; Ersetzen oder Ändern zum Routenwechsel kann die vom ursprünglichen Pod weiter genutzte Eingabe verletzen.  `kubectl get configmap relay-route -o yaml`.


      ### Bestehenden Pod und Antwort erhalten {#handover-original-consumer}


      Felder des ursprünglichen Pods oder HTTP-Bytes weichen vom Beleg ab; geändertes Image, Befehl, Mounts oder Sicherheitskontext sowie andere ausgelieferte Daten können den erhaltenen Verbraucher verletzen. Der geschützte Beleg vergleicht die aufgeführten Containerfelder, volumes und den Pod-Sicherheitskontext sowie den vollständigen HTTP-Inhalt von retained-reader. Erhalten Sie dessen UID und alte Konfigurationsbytes einschließlich abschließendem Zeilenumbruch. Ein Deployment-Rollout darf eigene Pods ersetzen; ein Austausch von retained-reader verletzt die separate Kontinuitätsanforderung. `kubectl get pod retained-reader -o yaml; kubectl exec retained-reader -- wget -qO- http://127.0.0.1:8080`.


      ### Eine separate immutable Version anbinden {#handover-versioned-binding}


      Die aktive Route nutzt noch die erhaltene Map oder eine ungültige Referenz, oder die neue Map ist nicht immutable mit benötigtem Wert; statt einer In-place-Änderung ist eine separate Konfigurationsversion erforderlich.  `kubectl get deployment relay -o yaml; kubectl get configmaps -o yaml`.


      ### Verwaltetes Deployment vergleichen {#handover-managed-comparison}


      Eine passende Deployment-Regel in ignoreDifferences schließt noch Felder vom Abgleich aus; die gelieferte Umgebungsausnahme kann Live-Drift verbergen, statt die veröffentlichte Routenbindung zu übernehmen.  `kubectl get application station -o yaml`.


      ### Veröffentlichtes Git und übernommene Konfiguration {#handover-published-source}


      Die Übergabe besteht möglicherweise nur live oder lokal; eine nicht gepushte oder synchronisierte Revision, geänderte Application-Quelle beziehungsweise Ziel oder unterschiedliche Git-/Live-Referenzen und Daten verhindern die Übernahme. Erhalten Sie Repository, project und die gesamte ursprüngliche destination Zuordnung, Revision main und sicheren Pfad manifests. Veröffentlichen Sie die alte immutable Map unverändert sowie eine separate immutable Map für die freigegebene Route und binden Sie das Deployment an die neue Version. Das abgerufene main muss von baseline abstammen, der sync revision der Application entsprechen und gleiche Routeneinträge sowie neue Map-Daten wie live deklarieren. Argo muss diese Map als Synced aufführen. Entfernen Sie passende Deployment-Feldausnahmen vor dem Abgleich. `git -C repository fetch origin main; kubectl get application station -o json`.


      ### Begrenzte Übergabebeobachtung {#handover-observation-budget}


      Das Zeitlimit eines Befehls oder der gesamten Übergabeprüfung ist abgelaufen; langsame Git-, Kubernetes-API- oder Pod-HTTP-Beobachtungen können vollständige Vergleiche verhindern.  `kubectl get application station -o json`.


      ### Lesbare Übergabebelege und Befehle {#handover-input-observation}


      Die Übergabe konnte nicht konsistent beobachtet werden; fehlende Objekte oder geschützte Belege, fehlerhafte ROUTE-Einträge beziehungsweise Manifeste oder fehlgeschlagene Git-Fetch-/Abstammungs- und API-Vorgänge können die Ursache sein.  `cat handover-contract.json; kubectl get deployment relay -o yaml`.


      ### Abgleich und Zustandsprüfung {#handover-sync-health}


      Application ist nicht Synced und Healthy oder die Beobachtung konnte nicht starten; Git fordert möglicherweise noch eine In-place-Änderung der erhaltenen immutable Map an, oder platform.env, Python beziehungsweise Prüfeingaben sind nicht verfügbar.  `kubectl get application station -o json`.


      ### Aktuelle Prozessroute {#handover-live-route}


      Deployment relay meldet nicht ROUTE=north oder exec schlug fehl; möglicherweise nutzt es noch die erhaltene Map oder eine alte Pod-Umgebung statt der neuen immutable Konfiguration.  `kubectl exec deployment/relay -c worker -- printenv ROUTE`.


      ### Bereitschaft der verwalteten Anwendung {#handover-workload-readiness}


      Deployment relay hat den Rollout nicht innerhalb von 3 Sekunden abgeschlossen; neue ConfigMap oder Schlüssel fehlen möglicherweise, neue Pods sind noch nicht gestartet oder die API-Beobachtung schlug fehl.  `kubectl rollout status deployment/relay --timeout=10s`.


      ## Probieren Sie es aus


      Öffnen Sie das **gitops Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Wird selfHeal=true allein einen ConfigMap entfernen, der aus Git gelöscht wurde?


      ```bash

      cd ~/lab/examples/drift

      bash run.sh

      source ~/lab/platform.env

      kubectl -n "$LAB_NAMESPACE" get application lab-guide -o yaml

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > Nr. Der ConfigMap bleibt bei deaktiviertem prune bestehen und verschwindet dann, wenn prune explizit aktiviert wird.


      ## Beobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
  full_example: full-drift
