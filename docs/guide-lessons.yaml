      ### Przyczyna i obserwacja (069, consumer_identity) {#private-delivery-original-process-and-privileges}


      Restart procesu, zmiana UID/grup/capabilities, polecenia lub programu zmienia zamrożoną tożsamość; dostarczaj pliki pierwotnym odbiorcom. Dostarczone zadanie copy ustawia mode 644 i wyłącza no_log. Dostarcz oba wejścia z prywatnymi prawami i właścicielem odbiorcy. Pierwotne programy czytają przy każdym HTTP; restart ani SIGHUP nie są potrzebne. Obserwuj metadane bez wypisywania credential. `ssh -n -o BatchMode=yes -p 2222 root@app1-"${DQ_NAMESPACE#dq-}" "ps -eo pid,uid,gid,args"`


      ### Przyczyna i obserwacja (069, credential_access) {#private-delivery-cross-consumer-denial}


