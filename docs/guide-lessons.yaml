      W tym ćwiczeniu ręczna edycja zmieniła `notice.txt`, a `main.tf` wciąż deklaruje `north-ready`. Sprawdź `tofu plan`, a następnie zastosuj konfigurację, aby usunąć rozbieżność. Sprawdź wynik przez `cat notice.txt`.


      ### Sprawdzanie oczekujących zmian {#notice-plan}


      Brak powiązania w stanie lub zmiana treści zarządzanego pliku mogą spowodować pojawienie się zmian w planie. Po naprawie uruchom `tofu plan -input=false -detailed-exitcode -no-color`. Oczekiwany jest kod 0 i brak oczekujących zmian.


