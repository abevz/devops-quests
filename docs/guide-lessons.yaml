      ### Limitar plazo actual {#batch-bound-current-job-deadline}


      El activeDeadlineSeconds suministrado es 300; ajuste Job existente a 30 segundos requeridos en vez de borrar ejecución. Job original usa backoffLimit=100 y activeDeadlineSeconds=300; CronJob recurrente inicialmente ausente. El resultado esperado es validación fallida limitada. Setup elimina job.yaml: observe objetos vivos y batch-contract.json suministrado. `kubectl get job importer -o jsonpath="{.spec.activeDeadlineSeconds}"`.


      ### Observar Job actual {#batch-current-job-api-observation}


      Job actual puede faltar o fallar petición API, JSON o tiempo; revise importer antes de comparar carga original. Job original usa backoffLimit=100 y activeDeadlineSeconds=300; CronJob recurrente inicialmente ausente. El resultado esperado es validación fallida limitada. Setup elimina job.yaml: observe objetos vivos y batch-contract.json suministrado. `kubectl get job importer --request-timeout=3s`.


