terraform-7.1:
  profile: opentofu
  example: module
  source_hash: 33b1f9fdb01b90503aefe09a80e411207861b13c8ec50345da9d327b75d7d44a
  content:
    en: 'A module has inputs, internal resources and explicit outputs. The caller passes values through that interface. Keeping all four module files beside the root makes this example runnable without another guide section.


      In quest 053, the child must declare the string `station` input and export `local_file.notice.content` as `message`; validate, apply and check the real output and empty plan.


      In quest 064, pass the shared `local.region` to each keyed module while preserving keys and output paths. Review the saved JSON plan: content changes replace the files even though module addresses remain stable.


      In quest 076, draw the required graph `dispatch → north → south`. Feed north from `local.hub` and south from north''s resource-backed output, preserving the supplied child module. Verify both files and outputs and an empty plan.


      In quest 092, treat the frozen backup as evidence rather than overwriting the current state. Move the current orphan address to `module.station`, preserve the ledger ID and inspect the saved no-op JSON plan and final state.


      In quest 098, trace the contract from the managed file to the module output, then to the fleet and ConfigMap consumer. Preserve the original resource ID, check the output reference and empty plan, and verify each live file, mode and response; environment-based Pods need a restart.


      In quest 047, change only the source of `module.station` from `./modules/v1` to `./modules/v2`, leaving `module.depot` on `./modules/v1`. Reinitialize, save a binary plan and export it as `upgrade-plan.json`: each resource action should be `no-op`, and the two recorded module sources should match. After apply, compare state addresses and IDs with the supplied originals, check `north.txt` contains `north-47`, `depot.txt` contains `depot-47`, station release 2 and the SHA-256 of `north.txt`, depot release 1, and verify a final detailed plan exit code 0. The saved JSON shows its contents, not when it was created.


      For quest 003, the root calls `./modules/notice` as `module.notice` with `station = "north"`. The child declares an input `station`, a `local_file.notice` resource and an output `message`; the root exports `module.notice.message` as `message`. The resource derives its filename from `station` and writes the station value followed by `-ready`. The child must declare the same provider source as the root, `registry.terraform.io/hashicorp/local`, because the offline mirror does not provide the default OpenTofu registry address. After initialization and apply, `tofu state list` should contain `module.notice.local_file.notice`; `cat north.txt` and `tofu output -raw message` should show `north-ready`. Run `tofu plan -input=false -detailed-exitcode -no-color`: exit code 0 means there are no changes.


      ## Try it


      Open the **opentofu Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Can the root read the child resource through its declared output?


      ```bash

      cd ~/lab/examples/module

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Expected result

      > Yes. module.api.name returns api; state contains the resource under the module.api address.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

      '
    ru: 'У модуля есть входы, внутренние ресурсы и явные outputs. Вызывающий код передаёт значения через этот интерфейс. Все четыре файла модуля лежат рядом с корнем: другие разделы для запуска не нужны.


      В квесте 053 дочерний модуль должен объявить строковый вход `station` и экспортировать `local_file.notice.content` как `message`; выполните validate и apply, проверьте реальный output и пустой план.


      В квесте 064 передайте общий `local.region` каждому экземпляру модуля, сохранив ключи и пути outputs. Изучите сохраненный JSON-план: изменение содержимого заменяет файлы, хотя адреса модулей остаются прежними.


      В квесте 076 нарисуйте требуемый граф `dispatch → north → south`. Передайте north значение `local.hub`, а south — output north, связанный с ресурсом, сохранив выданный дочерний модуль. Проверьте оба файла и outputs и пустой план.


      В квесте 092 используйте неизменную копию state как свидетельство, не перезаписывая текущий state целиком. Переместите текущий адрес orphan в `module.station`, сохраните ID ledger и проверьте сохраненный JSON-план no-op и итоговый state.


      В квесте 098 проследите контракт от управляемого файла через output модуля к fleet и потребителю ConfigMap. Сохраните исходный ID ресурса, проверьте ссылку output и пустой план, затем каждый файл, режим и реальный ответ; Pod с переменными окружения требует перезапуска.


      В квесте 047 измените только источник `module.station` с `./modules/v1` на `./modules/v2`, оставив `module.depot` на `./modules/v1`. Выполните повторную инициализацию, сохраните бинарный plan и экспортируйте его как `upgrade-plan.json`: действие каждого ресурса должно быть `no-op`, а два записанных источника модулей должны совпадать с требуемыми. После применения сравните адреса state и ID с предоставленными оригиналами, проверьте `north.txt` со значением `north-47`, `depot.txt` со значением `depot-47`, release 2 и SHA-256 файла `north.txt` для station, release 1 для depot, а затем код выхода 0 итогового подробного plan. Сохраненный JSON показывает содержимое, но не время его создания.


      В квесте 003 корневая конфигурация вызывает `./modules/notice` как `module.notice` с `station = "north"`. Дочерний модуль объявляет вход `station`, ресурс `local_file.notice` и выход `message`; корень экспортирует `module.notice.message` как `message`. Ресурс формирует имя файла из `station` и записывает значение station с суффиксом `-ready`. В дочернем модуле укажите тот же источник провайдера, что и в корне: `registry.terraform.io/hashicorp/local`; автономное зеркало не содержит адрес реестра OpenTofu по умолчанию. После инициализации и применения `tofu state list` должен содержать `module.notice.local_file.notice`, а `cat north.txt` и `tofu output -raw message` должны показывать `north-ready`. Выполните `tofu plan -input=false -detailed-exitcode -no-color`: код выхода 0 означает отсутствие изменений.


      ## Попробуйте


      Откройте лабораторию **opentofu**. Файлы уже находятся в рабочем каталоге. `run.sh` готовит этот пример, `check.sh` выполняет переходы и проверяет результат.


      **Предскажите до запуска:** Может ли корень получить значение ресурса через output дочернего модуля?


      ```bash

      cd ~/lab/examples/module

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Ожидаемый результат

      > Да. module.api.name возвращает api, а адрес в state находится внутри module.api.


      ## Наблюдение и проверка


      Прочитайте файлы перед изменением. Для полного повтора выполните `bash cleanup.sh`, затем `bash run.sh && bash check.sh`. Очистка удаляет только именованные объекты опыта; остальные каталоги сохраняются.

      '
    pl: 'Moduł ma wejścia, zasoby wewnętrzne i jawne outputs. Obiekt wywołujący przekazuje wartości przez ten interfejs. Trzymanie wszystkich czterech plików modułów obok katalogu głównego sprawia, że ​​ten przykład można uruchomić bez dodatkowej sekcji przewodnika.


      W zadaniu 053 moduł potomny musi deklarować tekstowe wejście `station` i eksportować `local_file.notice.content` jako `message`; wykonaj validate i apply, sprawdź rzeczywisty output i pusty plan.


      W zadaniu 064 przekaż wspólne `local.region` każdej instancji modułu, zachowując klucze i ścieżki outputs. Sprawdź zapisany plan JSON: zmiana treści zastępuje pliki, choć adresy modułów pozostają stałe.


      W zadaniu 076 narysuj wymagany graf `dispatch → north → south`. Przekaż north wartość `local.hub`, a south output north oparty na zasobie, zachowując dostarczony moduł potomny. Sprawdź oba pliki, outputs i pusty plan.


      W zadaniu 092 potraktuj niezmienioną kopię state jako dowód, zamiast nadpisywać cały bieżący state. Przenieś bieżący adres orphan do `module.station`, zachowaj ID ledger i sprawdź zapisany plan JSON no-op oraz końcowy state.


      W zadaniu 098 prześledź kontrakt od zarządzanego pliku przez output modułu do fleet i odbiorcy ConfigMap. Zachowaj pierwotne ID zasobu, sprawdź referencję outputu i pusty plan, a potem każdy plik, tryb i rzeczywistą odpowiedź; Pod korzystający ze zmiennych środowiskowych wymaga restartu.


      W zadaniu 047 zmień tylko źródło `module.station` z `./modules/v1` na `./modules/v2`, pozostawiając `module.depot` na `./modules/v1`. Ponownie zainicjuj, zapisz binarny plan i wyeksportuj go jako `upgrade-plan.json`: działanie każdego zasobu powinno być `no-op`, a oba zapisane źródła modułów powinny odpowiadać wymaganym. Po zastosowaniu porównaj adresy state i ID z dostarczonymi oryginałami, sprawdź `north.txt` z wartością `north-47`, `depot.txt` z wartością `depot-47`, release 2 i SHA-256 pliku `north.txt` dla station, release 1 dla depot oraz kod wyjścia 0 końcowego szczegółowego planu. Zapisany JSON pokazuje zawartość, a nie czas utworzenia.


      W zadaniu 003 konfiguracja główna wywołuje `./modules/notice` jako `module.notice` z `station = "north"`. Moduł potomny deklaruje wejście `station`, zasób `local_file.notice` i wyjście `message`; konfiguracja główna udostępnia `module.notice.message` jako `message`. Zasób tworzy nazwę pliku na podstawie `station` i zapisuje wartość station z przyrostkiem `-ready`. Moduł potomny musi deklarować to samo źródło dostawcy co konfiguracja główna, `registry.terraform.io/hashicorp/local`, ponieważ lokalne lustro nie udostępnia domyślnego adresu rejestru OpenTofu. Po inicjalizacji i zastosowaniu `tofu state list` powinno zawierać `module.notice.local_file.notice`, a `cat north.txt` i `tofu output -raw message` powinny pokazać `north-ready`. Uruchom `tofu plan -input=false -detailed-exitcode -no-color`: kod wyjścia 0 oznacza brak zmian.


      ## Wypróbuj


      Otwórz laboratorium **opentofu** za pomocą przycisku powyżej. Przykładowe pliki znajdują się już w obszarze roboczym. `run.sh` przygotowuje tylko ten przykład; `check.sh` wykonuje swoje przejścia i sprawdza wynik.


      **Przewiduj przed uruchomieniem:** Czy root może odczytać zasób podrzędny poprzez zadeklarowany output?


      ```bash

      cd ~/lab/examples/module

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question] — Oczekiwany wynik

      > Tak. module.api.name zwraca api; state zawiera zasób pod adresem module.api.


      ## Obserwuj i sprawdzaj


      Przeczytaj pliki przed ich zmianą. Powtórz cały eksperyment z `bash cleanup.sh`, a następnie `bash run.sh && bash check.sh`. Czyszczenie usuwa tylko nazwane obiekty przykładu; pozostałe katalogi pozostaną.'
    es: 'Un módulo tiene entradas, recursos internos y outputs explícito. La persona que llama pasa valores a través de esa interfaz. Mantener los cuatro archivos del módulo junto a la raíz hace que este ejemplo se pueda ejecutar sin otra sección de guía.


      En el ejercicio 053, el módulo hijo debe declarar la entrada de texto `station` y exportar `local_file.notice.content` como `message`; ejecuta validate y apply, comprueba la salida real y el plan vacío.


      En el ejercicio 064, pasa el `local.region` compartido a cada instancia del módulo conservando las claves y rutas de salida. Revisa el plan JSON guardado: cambiar el contenido reemplaza los archivos aunque las direcciones de módulo sigan estables.


      En el ejercicio 076, dibuja el grafo requerido `dispatch → north → south`. Alimenta north desde `local.hub` y south desde la salida de north respaldada por el recurso, conservando el módulo hijo suministrado. Verifica ambos archivos, salidas y el plan vacío.


      En el ejercicio 092, usa la copia de state congelada como evidencia en vez de sobrescribir todo el state actual. Mueve la dirección orphan actual a `module.station`, conserva el ID de ledger y comprueba el plan JSON no-op guardado y el state final.


      En el ejercicio 098, sigue el contrato desde el archivo gestionado por la salida del módulo hasta fleet y el consumidor ConfigMap. Conserva el ID original, comprueba la referencia de salida y el plan vacío, y verifica cada archivo, modo y respuesta real; los Pods con variables de entorno necesitan reinicio.


      En el ejercicio 047, cambia solo la fuente de `module.station` de `./modules/v1` a `./modules/v2`, dejando `module.depot` en `./modules/v1`. Reinicializa, guarda un plan binario y expórtalo como `upgrade-plan.json`: cada acción de recurso debe ser `no-op` y las dos fuentes registradas deben coincidir con las requeridas. Tras aplicar, compara direcciones de state e ID con los originales suministrados, comprueba `north.txt` con `north-47`, `depot.txt` con `depot-47`, release 2 y el SHA-256 de `north.txt` para station, release 1 para depot, y verifica el código de salida 0 del plan detallado final. El JSON guardado muestra su contenido, no cuándo se creó.


      En el ejercicio 003, la configuración raíz llama a `./modules/notice` como `module.notice` con `station = "north"`. El módulo hijo declara una entrada `station`, un recurso `local_file.notice` y una salida `message`; la raíz exporta `module.notice.message` como `message`. El recurso deriva el nombre del archivo de `station` y escribe el valor de station seguido de `-ready`. El hijo debe declarar la misma fuente de proveedor que la raíz, `registry.terraform.io/hashicorp/local`, porque el mirror sin conexión no ofrece la dirección predeterminada del registro de OpenTofu. Después de inicializar y aplicar, `tofu state list` debe contener `module.notice.local_file.notice`; `cat north.txt` y `tofu output -raw message` deben mostrar `north-ready`. Ejecuta `tofu plan -input=false -detailed-exitcode -no-color`: el código de salida 0 indica que no hay cambios.


      ## Pruébalo


      Abra el laboratorio **opentofu** usando el botón de arriba. Los archivos de ejemplo ya están en el espacio de trabajo. `run.sh` prepara sólo este ejemplo; `check.sh` ejercita sus transiciones y comprueba el resultado.


      **Predecir antes de ejecutar:** ¿Puede la raíz leer el recurso secundario a través de su salida declarada?


      ```bash

      cd ~/lab/examples/module

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Resultado esperado

      > YSí. module.api.name devuelve api; El estado contiene el recurso bajo la dirección module.api.


      ## Oservar y comprobar


      Lea los archivos antes de cambiarlos. Repita el experimento completo con `bash cleanup.sh`, luego `bash run.sh && bash check.sh`. La limpieza elimina sólo los objetos con nombre del ejemplo; sus otros directorios permanecen.'
    de: 'Ein Modul verfügt über Eingänge, interne Ressourcen und explizite outputs. Der Aufrufer übergibt Werte über diese Schnittstelle. Wenn Sie alle vier Moduldateien neben dem Stammverzeichnis aufbewahren, ist dieses Beispiel ohne einen weiteren Anleitungsabschnitt lauffähig.


      In Aufgabe 053 muss das Kindmodul die Zeichenketten-Eingabe `station` deklarieren und `local_file.notice.content` als `message` exportieren; führe validate und apply aus und prüfe den echten Output und den leeren Plan.


      Übergib in Aufgabe 064 das gemeinsame `local.region` jeder Modulinstanz und erhalte Schlüssel und Output-Pfade. Prüfe den gespeicherten JSON-Plan: Inhaltsänderungen ersetzen Dateien, obwohl Moduladressen stabil bleiben.


      Zeichne in Aufgabe 076 den geforderten Graphen `dispatch → north → south`. Versorge north aus `local.hub` und south aus dem ressourcengestützten Output von north; erhalte das vorgegebene Kindmodul. Prüfe beide Dateien und Outputs sowie den leeren Plan.


      Nutze in Aufgabe 092 das unveränderte State-Backup als Beleg, statt den aktuellen State vollständig zu überschreiben. Verschiebe die aktuelle Orphan-Adresse nach `module.station`, erhalte die Ledger-ID und prüfe den gespeicherten No-op-JSON-Plan und den endgültigen State.


      Verfolge in Aufgabe 098 den Vertrag von der verwalteten Datei über den Modul-Output zu Fleet und ConfigMap-Verbraucher. Erhalte die ursprüngliche Ressourcen-ID, prüfe Output-Referenz und leeren Plan sowie jede Datei, jeden Modus und jede tatsächliche Antwort; Pods mit Umgebungsvariablen benötigen einen Neustart.


      Ändere in Aufgabe 047 nur die Quelle von `module.station` von `./modules/v1` auf `./modules/v2` und belasse `module.depot` auf `./modules/v1`. Initialisiere erneut, speichere einen binären Plan und exportiere ihn als `upgrade-plan.json`: Jede Ressourcenaktion soll `no-op` sein, und die beiden aufgezeichneten Modulquellen müssen den Vorgaben entsprechen. Vergleiche nach der Anwendung State-Adressen und IDs mit den bereitgestellten Originalen, prüfe `north.txt` mit `north-47`, `depot.txt` mit `depot-47`, Release 2 und den SHA-256-Wert von `north.txt` für station, Release 1 für depot sowie Exit-Code 0 des abschließenden detaillierten Plans. Das gespeicherte JSON zeigt seinen Inhalt, nicht den Zeitpunkt seiner Erstellung.


      In Aufgabe 003 ruft die Root-Konfiguration `./modules/notice` als `module.notice` mit `station = "north"` auf. Das Kindmodul deklariert eine Eingabe `station`, eine Ressource `local_file.notice` und eine Ausgabe `message`; die Root-Konfiguration exportiert `module.notice.message` als `message`. Die Ressource leitet den Dateinamen aus `station` ab und schreibt den Wert von station mit dem Suffix `-ready`. Das Kindmodul muss dieselbe Providerquelle wie die Root-Konfiguration deklarieren, `registry.terraform.io/hashicorp/local`, da der Offline-Mirror die Standardadresse der OpenTofu-Registry nicht bereitstellt. Nach Initialisierung und Anwendung sollte `tofu state list` `module.notice.local_file.notice` enthalten; `cat north.txt` und `tofu output -raw message` sollten `north-ready` anzeigen. Führe `tofu plan -input=false -detailed-exitcode -no-color` aus: Exit-Code 0 bedeutet, dass keine Änderungen anstehen.


      ## Probieren Sie es aus


      Öffnen Sie das **opentofu Lab** über die Schaltfläche oben. Die Beispieldateien befinden sich bereits im Arbeitsbereich. `run.sh` bereitet nur dieses Beispiel vor; `check.sh` führt seine Übergänge durch und überprüft das Ergebnis.


      **Vorhersage vor der Ausführung:** Kann der Root die untergeordnete Ressource über seine deklarierte Ausgabe lesen?


      ```bash

      cd ~/lab/examples/module

      cat main.tf

      bash run.sh

      tofu state list

      bash check.sh

      ```


      > [!question]- Erwartetes Ergebnis

      > YJa. module.api.name gibt api zurück; Der Status enthält die Ressource unter der Adresse module.api.


      ## Obeobachten und prüfen


      Lesen Sie die Dateien, bevor Sie sie ändern. Wiederholen Sie das gesamte Experiment mit `bash cleanup.sh` und dann `bash run.sh && bash check.sh`. Durch die Bereinigung werden nur die benannten Objekte des Beispiels entfernt. Ihre anderen Verzeichnisse bleiben bestehen.'
