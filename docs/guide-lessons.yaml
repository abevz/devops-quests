  source_hash: bf90d7ed263cb1fd13fdfdc05fadce0769a00efc52f12d769d416af37adc6dc6
  content:
    en: 'A Service name resolves to a virtual address. Its selector and ready EndpointSlices determine which pod addresses receive traffic. DNS success alone does not prove that the Service has a usable backend.


      ### Service selector and ready endpoints {#arrivals-ready-endpoint}


      In quest 004, compare the selector of Service `arrivals` with the labels of the existing Pods. Healthy Pods cannot become ready endpoints for this Service until the selector matches them. Use `kubectl get pods --show-labels` and `kubectl get service arrivals -o yaml` to compare. After correction, look for a ready endpoint in the EndpointSlices with label `kubernetes.io/service-name=arrivals`.


      In quest 120, preserve the original PVC identity while restoring the headless Service selector and bounded client egress. DNS and shelf TCP access need distinct allowances; the namespace and Pod selectors for DNS belong in one peer. Verify ordinal DNS and the ledger response separately from the PVC UID.


      For quest 118, follow Service selection through actual EndpointSlice ownership, target Pod identity, address and application interface. A ready endpoint can still advertise the wrong destination port. Compare direct Pod traffic with the retained Service VIP before blaming the forwarding implementation. The bounded diagnosis record is not a complete incident analysis; current API and traffic observations do not prove edit history or justify changes to node rules or global DNS.


      In quest 119, an egress policy selects the client Pod. Namespace and Pod selectors in one peer are combined; separate peers are alternatives, and policies add allowances. Allow the specified DNS UDP/TCP ports and board TCP port without broader policies. Test DNS and the allowed board response, the failed closed request, and the board''s successful control request; failure alone does not prove its cause.


      For quest 062, destination selection and permitted-source membership are separate relations. A policy can retain the intended boundary while a requesting workload no longer belongs to it. A current Pod label and a Deployment template have different lifetimes. Compare desired labels and current owned Pods without widening the original ingress boundary; permitted and denied requests are independent controls. Retained object identities and provided images keep the repair within the existing topology.


      In quest 110, resolve `station.internal` to the private controller Service before testing HTTP. Then check the supplied Ingress class, host, Prefix path `/` and backend `board:8080`; the correct Host must return `north-110` and the wrong Host request must fail. DNS success does not prove routing, and a failed request alone does not identify its cause.


      In quest 106, ClusterIP, headless DNS and NodePort are different ways to reach the same selected Pods. Repair each Service selector to `app: board` without changing its recorded UID, type, IPs or ordered ports. Test all three Service names on port `8080` and the private node''s NodePort (at least `30000`); each must return `north-106`. Check the complete Pod IP in the headless DNS answer and allow reconciliation time.


      In quest 107, an Ingress controller routes a host and path to a Service port. Use the supplied private class, host `station.internal`, Prefix path `/` and backend `board:8080`. Test the controller URL with both the correct and wrong Host headers: the first must return `north-107`, and the second must fail. A failure alone does not establish its cause.


      ### Relay Service target port {#relay-service-port}


      In quest 030, the supplied relay Service uses targetPort: web but worker declares the port name http at 8080. A ready Deployment does not repair that mapping. Compare the Service targetPort with the container port name and ready EndpointSlices, then request http://relay:8080/ from worker; expect signalrail. DNS, exec or HTTP failures can also prevent this observation.


      ### Board Service mapping {#maintenance-board-service}


      In quest 040, compare Service board with the board Pod template: selector app=board and every additional selector label must match. Exactly one TCP port 8080 must resolve its targetPort to container port 8080, including a valid named port. A mismatch or unreadable API/JSON/port data reports service. If no Service diagnostic is produced, check workspace access and Python/dq_check startup first.


      ### Board content through the Service {#maintenance-board-http}


      In quest 040, the supplied worker initially serves retired. After publishing north-40, request http://board:8080 from the nonterminating Running Pods owned by this Deployment. A valid Service mapping alone does not prove the body. No such Pod, failed API/exec/HTTP observations or stale content can report http. A pre-observer workspace/Python/helper failure instead reaches its outer fallback.


      ### Service selectors and ready endpoint ownership {#progressive-service-targets}


      The public Service may be missing, or it does not select ready Pods of the active original Deployment or cannot be observed; the selector may still target the producer during failover, endpoints may be empty or unrelated, or the port/type contract is wrong. The declared public port must have exactly one TCP entry on a selector-based ClusterIP Service. Its nonempty selector must match the active Deployment labels. At least one ready endpoint is required, owned by that Service and pointing only to ready Pods controlled through ReplicaSet UIDs by the active original Deployment. Matching labels alone cannot establish controller ownership; during failover select the backup and retain the working producer. `kubectl get services,endpointslices,pods -o yaml`.


      ### Actual public JSON record {#progressive-public-record}


      The public HTTP publication differs from the original record or cannot be read; the Service may reach the wrong workload, the worker may serve another directory or stale data, or HTTP/JSON observation failed. Compare the entire JSON publication with the original source record, including route and producer_id. The probe requests the public Service path from an active ready Pod, so a plausible local file or a new publication identity cannot establish the public result. Invalid JSON, HTTP or exec errors are reported under the publication marker too.


      ### Bounded ingress selectors and ports {#isolation-bounded-ingress-contract}


      The retained ingress policy does not express only dispatcher TCP access on 8080, or its bounded observation failed; the supplied port 9090, a broader selector/rule, ambiguous named ports or unavailable API inputs can explain it. The protected selector must be equivalent to app=board, each source to role=dispatcher in the same namespace, with Ingress as the only direction. All bounded TCP flows must resolve to 8080. A named port must resolve once in each nondeleting board Pod and agree across them. Repair the retained policy before checking caller membership; the supplied policy starts at 9090. `kubectl get networkpolicy board-ingress -o yaml; kubectl get pods -l app=board -o yaml`.


      ### Retain policy and workload identities {#isolation-original-policy-and-workloads}


      The original policy or a Deployment UID changed, or a checked worker image differs from the supplied reference/digest; recreating objects or substituting the application can break retained isolation identities.  `cat isolation-contract.json; kubectl get networkpolicy board-ingress -o yaml; kubectl get deployments,pods -o yaml`.


      ### Desired caller labels {#isolation-desired-caller-membership}


      The dispatcher Deployment template is not selected by the retained ingress peer; the supplied role=retired label or relabeling only a live Pod can leave future caller Pods outside the permitted group.  `kubectl get deployment dispatcher -o yaml`.


      ### Current owned caller Pods {#isolation-current-caller-observation}


      Current owned dispatcher Pods are absent, unready or outside the permitted peer, or observation failed; a pending rollout, stale Pod labels, missing frozen objects/facts or API/time-limit errors can prevent verifying current membership. Update the dispatcher Pod template to match the retained peer, then let its rollout replace stale Pods. The check follows controller Deployment/ReplicaSet UIDs across all owned ReplicaSets and requires a nonempty set of nondeleting, nonterminal caller Pods, each Running, Ready and selected. Changing only one live Pod does not repair the desired template. `kubectl get pods,replicasets --show-labels; kubectl rollout status deployment/dispatcher --timeout=10s`.


      ### One effective policy boundary {#isolation-single-effective-policy}


      The namespace does not report exactly one NetworkPolicy or its list could not be read; creating another policy instead of repairing the retained one can change the additive set of allowed connections.  `kubectl get networkpolicy -o yaml`.


      ### Permitted caller Service response {#isolation-permitted-service-response}


      The dispatcher request did not return north-62 or exec/HTTP failed; its current labels may still miss the permitted peer, the policy may use the wrong port, or the board Service/workload may be unavailable.  `kubectl exec deployment/dispatcher -- wget -qO- -T 3 http://board:8080`.


      ### Excluded caller unexpectedly succeeds {#isolation-excluded-caller-access}


      The excluded visitor request succeeded; broader effective ingress permission or caller labels that place visitor in the permitted group can allow an unintended connection to board.  `kubectl exec deployment/visitor -- wget -qO- -T 2 http://board:8080`.


      ## Try it


      Open the **kubernetes Lab** using the button above. The example files are already in the workspace. `run.sh` prepares only this example; `check.sh` exercises its transitions and checks the result.


      **Predict before running:** Can the Service exist with zero matching pods?


      ```bash

      cd ~/lab/examples/networking

      bash run.sh

      kubectl -n lab-networking get svc,endpointslice

      kubectl -n lab-networking get pods --show-labels

      bash check.sh

      ```


      > [!question]- Expected result

      > Yes. The wrong selector produces no endpoints. Correcting it makes the same Service route to the ready web pod.


      ## Observe and check


      Read the files before changing them. Repeat the full experiment with `bash cleanup.sh`, then `bash run.sh && bash check.sh`. Cleanup removes only the example’s named objects; your other directories remain.

