source: Cracking the Kubernetes Interview (Packt, 2025); topic references and original exercises only.
chapters:
- chapter: 1
  focus: Container and artifact boundaries
  levels:
  - 1
  - 49
  interview_topics:
  - architecture-runtime
  limits: No alternate orchestrator or VM provisioning.
- chapter: 2
  focus: API, scheduling, kubelet, CRI and node services
  levels:
  - 11
  - 117
  - 118
  interview_topics:
  - architecture-runtime
  limits: One disposable node; no production control-plane administration.
- chapter: 3
  focus: Pod lifecycle, probes, controllers and scheduled work
  levels:
  - 11
  - 17
  - 40
  - 72
  - 101
  - 102
  - 103
  - 104
  - 117
  interview_topics: []
  limits: Native sidecar semantics follow the pinned modern Kubernetes release.
- chapter: 4
  focus: Resource requests, horizontal and vertical scaling
  levels:
  - 34
  - 112
  - 126
  interview_topics:
  - vertical-scaling
  limits: Real HPA/metrics-server; VPA remains an oral design exercise.
- chapter: 5
  focus: Node capacity and provisioning
  levels: []
  interview_topics:
  - node-autoscaling
  limits: Cluster Autoscaler/Karpenter/EKS are theory only; no AWS calls or node provisioning.
- chapter: 6
  focus: DNS, CNI policy and Service datapath
  levels:
  - 62
  - 105
  - 118
  - 119
  interview_topics:
  - platform-boundaries
  limits: Private DNS clone; no global DNS, host networking or CNI migration.
- chapter: 7
  focus: Service exposure and HTTP entry points
  levels:
  - 106
  - 107
  - 110
  - 113
  - 118
  - 119
  interview_topics: []
  limits: Internal bridge only; no cloud LoadBalancer, public address or DNS change.
- chapter: 8
  focus: State, configuration and volume contracts
  levels:
  - 11
  - 14
  - 45
  - 111
  - 120
  - 124
  interview_topics:
  - platform-boundaries
  limits: Real local claims/reclaim; no replicated storage or multi-node CSI failure test.
- chapter: 9
  focus: Credentials, identity and least privilege
  levels:
  - 31
  - 37
  - 42
  - 62
  - 99
  - 109
  - 114
  - 125
  interview_topics:
  - platform-boundaries
  limits: Restricted PSA, actual denied requests; no node hardening or global admission policy.
- chapter: 10
  focus: Release strategies and observable rollouts
  levels:
  - 67
  - 102
  - 115
  - 130
  interview_topics:
  - traffic-strategies
  limits: Replica ratios do not guarantee traffic percentages; Istio/shadow remain theory.
- chapter: 11
  focus: Git reconciliation and configuration tooling
  levels:
  - 41
  - 43
  - 50
  - 61
  - 68
  - 70
  - 75
  - 80
  - 91
  - 95
  - 100
  - 108
  - 122
  - 123
  interview_topics: []
  limits: Private Git/registry/Argo only; no external Git push, SSO deployment or multi-cluster administration.
- chapter: 12
  focus: API extension, reconciliation and admission
  levels:
  - 116
  - 121
  interview_topics: []
  limits: Small finite operator and scoped real webhook; no general privileged operator platform.
- chapter: 13
  focus: Availability, resilience and shared failures
  levels:
  - 77
  - 102
  - 111
  - 115
  interview_topics:
  - availability-design
  limits: No HA/quorum claim for a single-node kind cluster.
- chapter: 14
  focus: Metrics, diagnosis and observability
  levels:
  - 94
  - 112
  - 127
  interview_topics:
  - observability-signals
  limits: Real scrape and PromQL; no complete logging/tracing stack or production SLO claim.
- chapter: 15
  focus: Disruption, backups and recovery
  levels:
  - 77
  - 124
  - 128
  interview_topics:
  - recovery-design
  limits: Quiescent text fixture restore; no live database consistency or off-host resilience claim.
- chapter: 16
  focus: Evidence-driven troubleshooting
  levels:
  - 1
  - 14
  - 34
  - 94
  - 118
  - 129
  interview_topics:
  - interview-reasoning
  limits: No host, VM or real cluster repair.
- chapter: 17
  focus: Clear incident reasoning and factual explanations
  levels: []
  interview_topics:
  - interview-reasoning
  limits: Own prompts and bullet points; no copied stories, recording or speech grading.
- chapter: 18
  focus: Composite incidents and interview trade-offs
  levels:
  - 130
  interview_topics:
  - interview-reasoning
  limits: Own scenarios and questions; author anecdotes and book wording are not reproduced.
