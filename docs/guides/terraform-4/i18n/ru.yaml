heading: 4. Хранилище и блокировка состояния [backends, locking]
text: "## 4. Хранилище и блокировка состояния [backends, locking]\n\n**Коротко**\n- Backend — место хранения состояния.\n- Блокировка защищает один state от двух писателей.\n- Общее хранилище само по себе не задаёт все права доступа.\n\n**Короткий сценарий**\n\nДва запуска пишут один ключ prod/network.tfstate. Первый уже держит блокировку этого state.\n\n**Предскажи:** Должен ли второй писать одновременно?\n\n> [!question]- Ответ\n> Нет. Он ждёт или получает отказ блокировки. Другой ключ state и ручные изменения облака этой блокировкой не защищены.\n\nBackend определяет хранение state и поддержку блокировки. Локальный backend хранит файл рядом с конфигурацией, а удалённый даёт общее хранилище и контроль доступа. Не каждый backend поддерживает блокировку. Она сериализует операции над одним state, но не запрещает ручные изменения объектов и не замечает, что два состояния управляют одной машиной.\n*(по документации)*. [Хранение и блокировка](https://developer.hashicorp.com/terraform/language/state/backends) · [Блокировка](https://developer.hashicorp.com/terraform/language/state/locking).\n\n> [!info]- Глубже\n> | Backend | Хранение | Блокировка и восстановление |\n> |---|---|---|\n> | S3 | Объект по корзине и ключу; включи версионирование | `use_lockfile`; настройка DynamoDB у Terraform устарела, у OpenTofu поддерживается |\n> | `azurerm` | Объект Blob в контейнере Azure Storage | Встроенная аренда Blob обеспечивает блокировку и согласованность |\n> | `gcs` | Объект по корзине и префиксу | Блокировка поддерживается; версии объектов помогают восстановлению |\n> | `http` | GET для чтения, POST для записи | LOCK/UNLOCK необязательны; сервер должен реализовать протокол |\n> | GitLab-managed state | API GitLab поверх backend `http` | Доступ и адрес блокировки задаёт GitLab; отдельного типа backend GitLab нет |\n> | `local` | Файл рабочего каталога | Локальная блокировка файла; нет общего удалённого хранилища и командной политики доступа |\n\n### S3: блокировка — настройка backend\n\n**Коротко**\n- S3 backend хранит state в объекте.\n- Блокировку нужно настроить явно.\n- Настройки backend и AWS provider относятся к разным соединениям.\n\n**Короткий сценарий**\n\nУ S3 backend задан use_lockfile=true. AWS provider настроен отдельным блоком для создания ресурсов.\n\n**Предскажи:** Настройка provider автоматически определяет доступ к backend?\n\n> [!question]- Ответ\n> Нет. Backend должен отдельно получить подходящие учётные данные и права на state/lock. Это текстовый сценарий, обращения к S3 нет.\n\n**Фрагмент `backend.tf` — пример для чтения: без корзины S3 не запустится:**\n\n```hcl\nterraform {\n  backend \"s3\" {\n    bucket       = \"company-terraform-state\"\n    key          = \"prod/network.tfstate\"\n    region       = \"eu-central-1\"\n    use_lockfile = true\n  }\n}\n```\n\nTerraform 1.10 и OpenTofu 1.10 добавили `use_lockfile`. Текущая документация Terraform помечает DynamoDB как устаревший способ блокировки; OpenTofu 1.13 продолжает его поддерживать и допускает оба механизма при миграции. В учебном примере не подключались к корзине:\n\n*(по документации)*. [S3 в Terraform](https://developer.hashicorp.com/terraform/language/backend/s3) · [S3 в OpenTofu](https://opentofu.org/docs/v1.13/language/settings/backends/s3/).\n\n> [!info]- Глубже\n> Для прежней блокировки задают `dynamodb_table = \"terraform-locks\"`. HashiCorp тестирует backend с Amazon S3; совместимость другого S3-сервиса проверяется отдельно. В GitLab адреса чтения, блокировки и разблокировки передаются backend `http`, а учётные данные — поддерживаемым способом из окружения. Открытый `-backend-config` может попасть в `.terraform` и файл плана.\n> *(по документации)*. [HTTP backend](https://developer.hashicorp.com/terraform/language/backend/http) · [State в GitLab](https://docs.gitlab.com/user/infrastructure/iac/terraform_state/).\n\n### Частичная настройка: что писать в `backend.tf`, а что передавать при `init`\n\n**Коротко**\n- Частичная настройка дополняется при init.\n- Файл tfbackend задаёт адрес хранилища для среды.\n- Адрес state нужно отличать от секретных учётных данных.\n\n**Короткий сценарий**\n\nbackend.tf задаёт тип s3. dev.s3.tfbackend задаёт bucket=lab и key=dev.tfstate; prod использует другой key.\n\n**Предскажи:** Какой файл выбирает state для dev?\n\n> [!question]- Ответ\n> При init передаётся dev.s3.tfbackend. Имена файлов сами не переключают backend; выбранные параметры читает команда. Разбор без S3 API.\n\n```hcl\n# backend.tf — одинаковое для всех сред\nterraform {\n  backend \"s3\" {\n    encrypt      = true\n    use_lockfile = true\n  }\n}\n```\n\n```hcl\n# envs/dev.s3.tfbackend — своё для каждой среды, коммитится\nbucket = \"ACCOUNT_ID-eu-central-1-terraform-states\"\nkey    = \"project/dev/main/terraform.tfstate\"\nregion = \"eu-central-1\"\n```\n\nВ Terraform блок backend нельзя параметризовать: `var.` и `local.` внутри него запрещены. OpenTofu с 1.8 разрешает в нём переменные и locals (early evaluation), но только если их значения известны до init, а код при этом перестаёт работать в Terraform *(по документации)*. [OpenTofu 1.8: early evaluation](https://opentofu.org/docs/v1.8/intro/whats-new/). Переносимый способ — не писать различающиеся по средам значения в коде, а передавать их при `init`. Это называется *partial configuration*, частичная настройка. Передать можно двумя способами *(по документации)*. [Partial configuration](https://developer.hashicorp.com/terraform/language/backend#partial-configuration):\n\n- **ключ=значение в командной строке:** `tofu init -backend-config=\"bucket=...\" -backend-config=\"key=...\"`. Так работает `tools/iac-wrapper.sh` в platform-iac;\n- **файлом:** `tofu init -backend-config=envs/dev.s3.tfbackend`. Синтаксис HCL, внутри только пары `ключ = значение` из блока backend. Рекомендуемое расширение `*.tfbackend`, а не `.hcl`.\n\n> [!info]- Глубже\n> | Поле | Правило |\n> |---|---|\n> | `bucket` | Один на аккаунт и регион. Создаётся **вне** этой конфигурации (bootstrap), иначе получается курица и яйцо. Обязательно versioning (единственный откат после плохого apply), шифрование и block public access. |\n> | `key` | `<проект>/<среда>/<компонент>/terraform.tfstate`: один state на компонент, а не на всё сразу. **Не переиспользовать и не менять молча:** другой key означает пустой state, и план захочет создать всё заново. Переезд только через `init -migrate-state`. |\n> | `region` | Регион бакета, а не регион ресурсов. |\n> | Учётные данные | Никогда в этом файле: только `AWS_PROFILE`, роль или переменные окружения. |\n>\n> **Коммитить ли `*.tfbackend`.** Секретов в нём нет, только адрес state, поэтому обычно коммитят по файлу на среду: `envs/dev.s3.tfbackend`, `envs/prod.s3.tfbackend`. В gitignore его кладут, только если в имени бакета есть то, что нельзя публиковать. То же правило для `envs/<env>.tfvars`: несекретные значения коммитятся и передаются через `-var-file`. Секреты идут через SOPS, Vault или `TF_VAR_*`, а автоматически подгружаемый `terraform.tfvars` оставляют для личных переопределений и прячут в gitignore.\n>\n> Смена среды в одном рабочем каталоге: `tofu init -reconfigure -backend-config=envs/prod.s3.tfbackend`. Без `-reconfigure` init спросит о миграции state из dev в prod, а это почти никогда не то, что нужно.\n>\n> > [!warning] platform-iac, к piac-50\n> > `iac-wrapper.sh` передаёт `-backend-config=\"endpoint=...\"`. В текущем S3 backend это поле устарело, вместо него `endpoints = { s3 = \"...\" }`. И `use_lockfile` там не включён. Нативная блокировка держится на условной записи (`If-None-Match`), поэтому её поддержку в RustFS надо проверить до включения.\n>\n> **Коротко по-английски:** Why can't the backend block use variables, and what do you do instead?\n>\n> In Terraform the backend is configured before variables are evaluated, so it cannot reference them; OpenTofu allows it since 1.8, but that breaks Terraform compatibility. I keep the shared settings in `backend.tf` and pass the per-environment bucket and key at init time, from a committed `envs/dev.s3.tfbackend` file.\n\n### Зависшая блокировка и перенос состояния\n\n**Коротко**\n- Блокировка может пережить оборванный процесс.\n- Сначала нужно установить, жив ли владелец.\n- reconfigure не равнозначен копированию состояния.\n\n**Короткий сценарий**\n\nLock принадлежит pipeline 42. Pipeline всё ещё применяет изменения. Второй запуск предлагает force-unlock.\n\n**Предскажи:** Можно ли снимать lock как заведомо зависший?\n\n> [!question]- Ответ\n> Нет: владелец активен. Снятие допустит конкурирующую запись. Сценарий не выполняет force-unlock.\n\nПеред `force-unlock ID` проверь владельца и убедись, что процесс завершился. Снятие блокировки активного процесса разрешает двум запускам писать один state. В сохранённом прогоне OpenTofu 1.12.6 из [[Terraform-Coding-Drills-Solutions]] получены `Error: Error acquiring the state lock` и для S3 `StatusCode: 412`: условное создание файла `.tflock` обнаружило существующую блокировку. *(проверено в указанном прогоне; новый локальный опыт ниже)*.\n\nИзменение блока backend само данные не переносит. `init -migrate-state` предлагает копирование в новое хранилище; `init -reconfigure` переинициализирует настройки без миграции. Сначала сохрани копию, останови другие процессы записи и проверь содержимое нового хранилища; после переноса проверь state и план без изменений.\n*(по документации)*. [Инициализация и миграция](https://developer.hashicorp.com/terraform/cli/commands/init).\n\n### Где проводить границы state\n\n**Коротко**\n- Граница state задаёт область совместного изменения.\n- Независимые среды могут иметь разные состояния.\n- Связи между состояниями становятся отдельным контрактом.\n\n**Короткий сценарий**\n\nСеть меняется редко, приложение — ежедневно. У них разные права и независимые циклы выпуска.\n\n**Предскажи:** Что даёт разделение network и app на два state?\n\n> [!question]- Ответ\n> Меньше общих прав и блокировок, отдельные планы. Но выходы сети и порядок запуска приложения придётся согласовать явно.\n\nРазделяй состояния по независимым жизненным циклам и доступам: `prod/network`, `prod/compute`, `dev/network`. Это уменьшает размер плана и область воздействия ошибки, но вводит явную границу передачи данных. `terraform_remote_state` возвращает корневые выходы другого состояния, однако потребителю нужен доступ ко всему снимку с возможными секретами. При узком доступе публикуй нужный ID в отдельное хранилище, например SSM, Key Vault или DNS, и читай его источником данных провайдера.\n*(по документации)*. [Безопасность обмена между state](https://developer.hashicorp.com/terraform/language/state/remote-state-data).\n\n> [!info]- Глубже\n> ```mermaid\n> sequenceDiagram\n>     participant A as Первый запуск\n>     participant B as Хранилище state\n>     A->>B: Получить блокировку\n>     B-->>A: Блокировка получена\n>     A->>A: Выполнять операции\n>     participant B as Хранилище state\n>     participant C as Второй запуск\n>     C->>B: Запросить ту же блокировку\n>     B-->>C: Уже занята: ждать или ошибка\n>     participant A as Первый запуск\n>     participant B as Хранилище state\n>     A->>B: Записать state\n>     A->>B: Освободить блокировку\n>     participant B as Хранилище state\n>     participant C as Второй запуск\n>     C->>B: Повторно получить блокировку\n>     B-->>C: Теперь доступна\n> ```\n>\n### Два одновременных локальных запуска\n\n**Коротко**\n- Локальный backend тоже использует блокировку.\n- Первое применение удерживает её во время своей работы.\n- Нулевой таймаут второго запуска приводит к быстрому отказу.\n\nПервый `tofu apply -auto-approve` держал блокировку, пока учебная команда спала:\n\n**`main.tf` в новом пустом каталоге:**\n\n```hcl\nresource \"terraform_data\" \"wait\" {\n  provisioner \"local-exec\" { command = \"touch started; sleep 8\" }\n}\n```\n\nПосле появления учебного файла `started` запустили второй процесс: `tofu plan -lock-timeout=0s`.\n\n**Предскажи:** Получится ли у второго процесса построить план на том же локальном state, пока первый выполняет `apply`?\n> [!question]- Ответ\n> ```text\n> Error: Error acquiring the state lock\n> Error message: resource temporarily unavailable\n>   Operation: OperationTypeApply\n> ```\n> Локальный backend тоже блокирует файл для операций. Нулевое время ожидания даёт немедленный отказ; общей удалённой границы доступа у локального файла при этом нет.\n\nПервый процесс затем завершился успешно. Проверка не снимала чужую блокировку и не отключала её. *(проверено: OpenTofu 1.12.6, два процесса, один учебный state)*.\n\n**Коротко по-английски:** Why do we need state locking?\n\nLocking stops two Terraform operations from writing the same state at the same time. It does not stop manual changes to objects. Separate states can still manage the same object by mistake."
