heading: 4. State storage and locking [backends, locking]
text: "## 4. State storage and locking [backends, locking]\n\n**At a glance**\n- A backend is where state is stored.\n- Locking protects one state from two writers.\n- Shared storage alone does not define every access permission.\n\n**Short scenario**\n\nTwo runs write to the same key, prod/network.tfstate. The first already holds a lock on that state.\n\n**Predict:** Should the second run write at the same time?\n\n> [!question]- Answer\n> No. It waits or receives a lock error. This lock does not protect a different state key or manual changes in the cloud.\n\nA backend determines state storage and locking support. A local backend stores a file beside configuration; a remote backend provides shared storage and access control. Not every backend supports locking. A lock serializes operations on one state, but neither prevents manual object changes nor detects two states managing the same machine.\n*(according to documentation)*. [Storage and locking](https://developer.hashicorp.com/terraform/language/state/backends) · [Locking](https://developer.hashicorp.com/terraform/language/state/locking).\n\n> [!info]- Deeper explanation\n> | Backend | Storage | Locking and recovery |\n> |---|---|---|\n> | S3 | An object identified by bucket and key; enable versioning | `use_lockfile`; Terraform's DynamoDB setting is deprecated, while OpenTofu supports it |\n> | `azurerm` | A Blob in an Azure Storage container | Built-in Blob leases provide locking and consistency |\n> | `gcs` | An object identified by bucket and prefix | Locking supported; object versions help recovery |\n> | `http` | GET reads, POST writes | LOCK/UNLOCK are optional; the server must implement the protocol |\n> | GitLab-managed state | GitLab API over the `http` backend | GitLab supplies access and locking addresses; there is no separate GitLab backend type |\n> | `local` | A working-directory file | Local file locking; no shared remote storage or team access policy |\n\n### S3: locking is a backend setting\n\n**At a glance**\n- The S3 backend stores state in an object.\n- Locking must be configured explicitly.\n- Backend settings and the AWS provider are separate connections.\n\n**Short scenario**\n\nThe S3 backend has use_lockfile=true. The AWS provider is configured in a separate block for creating resources.\n\n**Predict:** Does the provider configuration automatically determine backend access?\n\n> [!question]- Answer\n> No. The backend must separately receive suitable credentials and permissions for the state and lock. This is a text-only scenario; it makes no S3 API calls.\n\n**`backend.tf` fragment: a reading example that cannot run without an S3 bucket:**\n\n```hcl\nterraform {\n  backend \"s3\" {\n    bucket       = \"company-terraform-state\"\n    key          = \"prod/network.tfstate\"\n    region       = \"eu-central-1\"\n    use_lockfile = true\n  }\n}\n```\n\nTerraform 1.10 and OpenTofu 1.10 added `use_lockfile`. Current Terraform documentation deprecates DynamoDB locking; OpenTofu 1.13 continues supporting it and permits both mechanisms during migration. This example did not connect to a bucket:\n\n*(according to documentation)*. [Terraform S3](https://developer.hashicorp.com/terraform/language/backend/s3) · [OpenTofu S3](https://opentofu.org/docs/v1.13/language/settings/backends/s3/).\n\n> [!info]- Deeper explanation\n> Legacy locking uses `dynamodb_table = \"terraform-locks\"`. HashiCorp tests the backend against Amazon S3; compatibility with another S3 service needs separate testing. With GitLab, read/lock/unlock addresses go to the `http` backend and credentials use a supported environment mechanism. Plaintext `-backend-config` may be stored in `.terraform` and plan files.\n> *(according to documentation)*. [HTTP backend](https://developer.hashicorp.com/terraform/language/backend/http) · [GitLab state](https://docs.gitlab.com/user/infrastructure/iac/terraform_state/).\n\n### Partial configuration: what belongs in `backend.tf` and what to pass during `init`\n\n**At a glance**\n- Partial backend settings are completed during init.\n- A tfbackend file sets the storage address for an environment.\n- The state address should be distinguished from secret credentials.\n\n**Short scenario**\n\nbackend.tf sets the backend type to s3. dev.s3.tfbackend sets bucket=lab and key=dev.tfstate; prod uses a different key.\n\n**Predict:** Which file selects the state for dev?\n\n> [!question]- Answer\n> Pass dev.s3.tfbackend to init. Filenames do not switch the backend by themselves; the command reads the selected settings. This is an explanation only; no S3 API is called.\n\n```hcl\n# backend.tf — identical for all environments\nterraform {\n  backend \"s3\" {\n    encrypt      = true\n    use_lockfile = true\n  }\n}\n```\n\n```hcl\n# envs/dev.s3.tfbackend — environment-specific, committed\nbucket = \"ACCOUNT_ID-eu-central-1-terraform-states\"\nkey    = \"project/dev/main/terraform.tfstate\"\nregion = \"eu-central-1\"\n```\n\nTerraform backend blocks cannot be parameterized: `var.` and `local.` are prohibited inside them. Since 1.8, OpenTofu permits variables and locals there through early evaluation, but only when values are known before init; that configuration no longer works in Terraform *(according to documentation)*. [OpenTofu 1.8: early evaluation](https://opentofu.org/docs/v1.8/intro/whats-new/). The portable approach passes environment-specific settings during `init` rather than embedding them in code. This is *partial configuration*. There are two ways *(according to documentation)*. [Partial configuration](https://developer.hashicorp.com/terraform/language/backend#partial-configuration):\n\n- **key=value on the command line:** `tofu init -backend-config=\"bucket=...\" -backend-config=\"key=...\"`. This is how platform-iac's `tools/iac-wrapper.sh` works;\n- **a file:** `tofu init -backend-config=envs/dev.s3.tfbackend`. Use HCL syntax containing only backend `key = value` pairs. The recommended extension is `*.tfbackend`, not `.hcl`.\n\n> [!info]- Deeper explanation\n> | Field | Rule |\n> |---|---|\n> | `bucket` | One per account and region. Create it **outside** this configuration (bootstrap) to avoid a circular dependency. Require versioning (the only rollback after a bad apply), encryption and block public access. |\n> | `key` | `<project>/<environment>/<component>/terraform.tfstate`: one state per component, not one for everything. **Do not reuse or silently change it:** another key means empty state, so planning may recreate everything. Move only through `init -migrate-state`. |\n> | `region` | The bucket region, not the resource region. |\n> | Credentials | Never in this file: use `AWS_PROFILE`, a role or environment variables. |\n>\n> **Should `*.tfbackend` be committed?** It contains no secrets, only the state address, so normally commit one file per environment: `envs/dev.s3.tfbackend`, `envs/prod.s3.tfbackend`. Ignore it only if the bucket name contains information that must not be published. The same rule applies to `envs/<env>.tfvars`: commit non-secret values and pass them with `-var-file`. Supply secrets through SOPS, Vault or `TF_VAR_*`; keep automatically loaded `terraform.tfvars` for personal overrides and ignore it.\n>\n> Switching environments in one working directory: `tofu init -reconfigure -backend-config=envs/prod.s3.tfbackend`. Without `-reconfigure`, init asks about migrating dev state into prod, which is almost never intended.\n>\n> > [!warning] platform-iac, related to piac-50\n> > `iac-wrapper.sh` passes `-backend-config=\"endpoint=...\"`. The current S3 backend deprecates that field in favor of `endpoints = { s3 = \"...\" }`. `use_lockfile` is not enabled there either. Native locking relies on conditional writes (`If-None-Match`), so verify RustFS support before enabling it.\n>\n> **Briefly in English:** Why can't the backend block use variables, and what do you do instead?\n>\n> In Terraform the backend is configured before variables are evaluated, so it cannot reference them; OpenTofu allows it since 1.8, but that breaks Terraform compatibility. I keep the shared settings in `backend.tf` and pass the per-environment bucket and key at init time, from a committed `envs/dev.s3.tfbackend` file.\n\n### Stuck locks and migrating state\n\n**At a glance**\n- A lock can remain after a process is interrupted.\n- First establish whether the lock owner is still running.\n- reconfigure is not the same as copying state.\n\n**Short scenario**\n\nThe lock belongs to pipeline 42. The pipeline is still applying changes. A second run offers force-unlock.\n\n**Predict:** Can the lock be removed as if it were definitely stale?\n\n> [!question]- Answer\n> No: the owner is active. Removing the lock would allow a competing write. This scenario does not run force-unlock.\n\nBefore `force-unlock ID`, check the owner and establish that its process has ended. Unlocking an active process permits two runs to write one state. A recorded OpenTofu 1.12.6 run in [[Terraform-Coding-Drills-Solutions]] produced `Error: Error acquiring the state lock` and S3 `StatusCode: 412`: conditional creation of `.tflock` detected an existing lock. *(verified in that recorded run; a new local experiment follows)*.\n\nChanging a backend block does not itself move data. `init -migrate-state` offers copying to the new storage; `init -reconfigure` reinitializes settings without migration. Save a copy first, stop other writers and inspect the new destination; after migration verify state and a no-change plan.\n*(according to documentation)*. [Initialization and migration](https://developer.hashicorp.com/terraform/cli/commands/init).\n\n### Choosing state boundaries\n\n**At a glance**\n- A state boundary defines the scope of shared changes.\n- Independent environments can have separate states.\n- Links between states become a separate contract.\n\n**Short scenario**\n\nThe network changes infrequently, while the application changes daily. They have different permissions and independent release cycles.\n\n**Predict:** What does splitting network and app into two states provide?\n\n> [!question]- Answer\n> Fewer shared permissions and locks, and separate plans. But the network outputs and the application's deployment order must be coordinated explicitly.\n\nSplit states by independent lifecycle and access boundaries: `prod/network`, `prod/compute`, `dev/network`. This reduces plan size and blast radius but creates an explicit data-sharing boundary. `terraform_remote_state` exposes another state's root outputs, yet the consumer needs access to the whole snapshot, potentially including secrets. For narrow access, publish the required ID to a separate store such as SSM, Key Vault or DNS and read it through a provider data source.\n*(according to documentation)*. [Safe state sharing](https://developer.hashicorp.com/terraform/language/state/remote-state-data).\n\n> [!info]- Deeper explanation\n> **Step 1 — First run acquires the lock**\n>\n> ```mermaid\n> sequenceDiagram\n>     participant A as First run\n>     participant B as State storage\n>     A->>B: Acquire the lock\n>     B-->>A: Lock acquired\n>     A->>A: Perform operations\n> ```\n>\n> **Step 2 — Second run waits**\n>\n> ```mermaid\n> sequenceDiagram\n>     participant B as State storage\n>     participant C as Second run\n>     C->>B: Request the same lock\n>     B-->>C: Already held: wait or fail\n> ```\n>\n> **Step 3 — Write and release**\n>\n> ```mermaid\n> sequenceDiagram\n>     participant A as First run\n>     participant B as State storage\n>     A->>B: Write state\n>     A->>B: Release the lock\n> ```\n>\n> **Step 4 — Second run acquires the lock**\n>\n> ```mermaid\n> sequenceDiagram\n>     participant B as State storage\n>     participant C as Second run\n>     C->>B: Acquire the lock again\n>     B-->>C: Now available\n> ```\n\n### Two concurrent local runs\n\n**At a glance**\n- The local backend also uses a lock.\n- The first apply holds it while running.\n- A zero timeout on the second run causes it to fail quickly.\n\nThe first `tofu apply -auto-approve` held the lock while the exercise command slept:\n\n**`main.tf` in a new empty directory:**\n\n```hcl\nresource \"terraform_data\" \"wait\" {\n  provisioner \"local-exec\" { command = \"touch started; sleep 8\" }\n}\n```\n\nAfter exercise file `started` appeared, a second process ran `tofu plan -lock-timeout=0s`.\n\n**Predict:** can the second process plan against the same local state while the first is applying?\n> [!question]- Answer\n> ```text\n> Error: Error acquiring the state lock\n> Error message: resource temporarily unavailable\n>   Operation: OperationTypeApply\n> ```\n> The local backend also locks its file during operations. Zero wait time produces immediate rejection; the local file still provides no shared remote access boundary.\n\nThe first process then completed successfully. This check neither removed another owner's lock nor disabled locking. *(verified: OpenTofu 1.12.6, two processes, one exercise state)*.\n\n**Briefly in English:** Why do we need state locking?\n\nLocking stops two Terraform operations from writing the same state at the same time. It does not stop manual changes to objects. Separate states can still manage the same object by mistake.\n"
