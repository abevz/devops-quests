heading: '5. Переменные: откуда приходит значение и кто победит'
text: "## 5. Переменные: откуда приходит значение и кто победит\n\n**Коротко**\n- Переменная — имя для значения, используемого задачами.\n- Для одного имени могут существовать значения разных источников.\n- Extra vars, переданные через -e, перекрывают значение сценария.\n\n**Мини-пример:** в отдельном временном каталоге сохрани `mini.yml`; запуск — `ansible-playbook -i localhost, -c local mini.yml -e app_port=9090`. Пример работает на localhost без become.\n\n```yaml\n- hosts: localhost\n  connection: local\n  become: false\n  gather_facts: false\n  tasks:\n    - ansible.builtin.debug:\n        msg: \"{{ app_port }}\"\n      vars:\n        app_port: 8080\n```\n\n**Предскажи:** что покажет запуск и каким будет код завершения?\n\n> [!question]- Ответ\n> Код завершения: 0. Фрагменты stdout:\n>\n> ```text\n>     \"msg\": \"9090\"\n> localhost                  : ok=1    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n\nВ задаче задано 8080, но при запуске передано `-e app_port=9090`. В выводе побеждает значение запуска.\n\nПолный `vars.yml`:\n\n```yaml\n- name: Follow a value through tasks\n  hosts: lab\n  connection: local\n  gather_facts: false\n  become: false\n  vars:\n    app_port: 8080\n  tasks:\n    - name: Read text from a process\n      ansible.builtin.command:\n        argv: [/usr/bin/printf, hello]\n      register: r\n      changed_when: false\n    - name: Store a derived host value\n      ansible.builtin.set_fact:\n        answer: \"{{ r.stdout | upper }}\"\n    - name: Show values\n      ansible.builtin.debug:\n        msg: \"{{ answer }}: {{ app_port }}\"\n    - name: Check expected input\n      ansible.builtin.assert:\n        that:\n          - answer == 'HELLO'\n          - app_port | int == 9090\n```\n\n`r` появляется после выполнения команды. `r.stdout` — текст из стандартного вывода процесса на управляемом узле;\n`r.rc` — код завершения, `r.stderr` — ошибки процесса. `| upper` — фильтр, преобразующий текст на управляющем узле.\n`set_fact` записывает `answer` как переменную текущего хоста в inventory, не файл на управляемом узле.\n`assert.that` — список проверок; здесь они все должны быть `true`.\n\n*(проверено)* Запуск `ansible-playbook vars.yml -e app_port=9090`:\n\n```text\nTASK [Show]\nok: [localhost] => {\n    \"msg\": \"HELLO: 9090\"\n}\nlocalhost : ok=4 changed=0 unreachable=0 failed=0 skipped=0 rescued=0 ignored=0\n```\n\nПеременная — именованное значение на управляющем узле, не окружение оболочки на управляемом узле.\nВ `app_port: 8080` имя выбираем мы; `ansible_host` — имя с определённым значением для движка.\n**Приоритет** отвечает, какое одноимённое значение победит. **Область видимости** отвечает, где оно доступно.\nВысокий приоритет не делает переменную одной задачи доступной всем будущим задачам.\n\nОдин конфликт для начала: role default app_port=8080, inventory app_port=8081, extra var app_port=9090. При запуске с -e app_port=9090 итог — 9090. Полная таблица источников, connection variables и исключения: [[#Справочник приоритетов переменных]]. [Variable precedence](https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_variables.html#understanding-variable-precedence).\n\n`-e app_port=9090` передаёт строку, поэтому сравнение использует `| int`.\nДля сохранения типов лучше `-e @input.yml`, где `app_port: 9090` — целое число YAML и `enabled: false` — логическое значение.\nДополнительные переменные сильнее даже последующего `set_fact`: не используйте `-e` для всего подряд.\n\n> [!info]- Глубже\n> > [!info] Ядро и справочник\n> > Ядро: один конфликт default → inventory → extra vars и объяснение победившего значения. Полная precedence и контрпримеры ролей — справочник, не список для заучивания.\n>\n> **Другие источники:** `vars_files` читает YAML на управляющем узле; `include_vars` загружает его как задачу;\n> `lookup` читает файл, окружение или API на управляющем узле, а не произвольное окружение управляемого хоста.\n> Ключ `environment:` задачи или сценария устанавливает окружение процесса модуля на месте выполнения,\n> но не создаёт автоматически переменную Ansible. `lookup('ansible.builtin.env', 'HOME')` читает `HOME` управляющего узла.\n>\n> `vars_prompt` — поле сценария, например:\n>\n> **`prompt.yml` (имя любое) рядом с `inventory.ini` из §2:**\n>\n> ```yaml\n> - name: Ask for a non-secret release label\n>   hosts: lab\n>   connection: local\n>   gather_facts: false\n>   become: false\n>   vars_prompt:\n>     - name: release_name\n>       prompt: Release name\n>       private: false\n>       default: demo\n>   tasks:\n>     - name: Show selected release\n>       ansible.builtin.debug:\n>         msg: \"{{ release_name }}\"\n> ```\n>\n> Приглашение ввода пропускается, если значение дано через `-e`, и в сеансе без интерактивного ввода. В конвейере нужные\n> входные данные передают явно и проверяют `assert`, не ждут клавиатуры.\n> *(по документации)* [Приглашения ввода](https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_prompts.html).\n>\n> Типичный сбой — значение осталось неопределённым. `vars: unused: \"{{ missing }}\"` может не упасть,\n> пока `unused` не используется: не все выражения вычисляются при чтении YAML.\n> Реальный запуск `debug: msg: \"{{ missing_port }}\"` *(проверено)*:\n>\n> ```text\n> Error while resolving value for 'msg': 'missing_port' is undefined\n> ```\n\n### Предскажи 4: Значение из командной строки\n\n**Коротко**\n- Переменная может прийти из нескольких источников.\n- Параметр -e задаёт значение для запуска.\n- При конфликте важно знать победивший источник и тип значения.\n\n**`predict-4.yml` (имя любое) рядом с `inventory.ini` из §2:**\n\n```yaml\n- hosts: lab\n  connection: local\n  gather_facts: false\n  become: false\n  vars:\n    app_port: 8080\n  tasks:\n  - name: Probe\n    ansible.builtin.debug:\n      msg: '{{ app_port }}'\n```\n\n**Предскажи:** Оба раза добавь `-e app_port=9090`. Какое значение выведет `Probe` и каковы две сводки?\n\n> [!question]- Ответ\n> ```text\n> # Первый запуск; код завершения 0\n> ok: [localhost] => {\n>     \"msg\": \"9090\"\n> }\n> localhost                  : ok=1    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> # Второй запуск; код завершения 0\n> ok: [localhost] => {\n>     \"msg\": \"9090\"\n> }\n> localhost                  : ok=1    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n> Дополнительная переменная сильнее `vars` сценария; оба запуска выводят строку `9090`.\n\n### Предскажи 5: Роль и inventory\n\n**Коротко**\n- У роли есть значения по умолчанию и отдельные переменные роли.\n- Переменная inventory не всегда перекрывает значение роли.\n- Проверяй конфликт на одном имени, чтобы увидеть правило.\n\n**`predict-5.yml` (имя любое) рядом с `inventory.ini` из §2; файлы роли и `host_vars` ниже лежат в том же каталоге:**\n\n```yaml\n- hosts: lab\n  connection: local\n  gather_facts: false\n  become: false\n  roles:\n  - demo\n  tasks: []\n```\n\n`roles/demo/defaults/main.yml`:\n\n```yaml\nmessage: from_defaults\n```\n\n`roles/demo/vars/main.yml`:\n\n```yaml\nmessage: from_role_vars\n```\n\n`roles/demo/tasks/main.yml`:\n\n```yaml\n- name: Probe\n  ansible.builtin.debug:\n    msg: '{{ message }}'\n```\n\n`host_vars/localhost.yml`:\n\n```yaml\nmessage: from_inventory\n```\n\n**Предскажи:** В роли одновременно есть `defaults` и `vars`, а у хоста — переменная inventory. Что выведет роль и каковы две сводки?\n\n> [!question]- Ответ\n> ```text\n> # Первый запуск; код завершения 0\n> ok: [localhost] => {\n>     \"msg\": \"from_role_vars\"\n> }\n> localhost                  : ok=1    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> # Второй запуск; код завершения 0\n> ok: [localhost] => {\n>     \"msg\": \"from_role_vars\"\n> }\n> localhost                  : ok=1    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n> `vars` роли сильнее переменных inventory, а значения `defaults` слабее обоих источников.\n\nВопрос: **Which variable wins: inventory, role defaults or extra vars?**\n\n> Role defaults provide fallback values, and inventory can override them. Extra vars have the highest\n> variable priority. Role vars are stronger than inventory, so configurable role inputs normally\n> belong in defaults."
