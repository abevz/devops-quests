heading: '5. Variables: where a value comes from and which one wins'
text: "## 5. Variables: where a value comes from and which one wins\n\n**At a glance**\n- A variable names a value used by tasks.\n- Several sources can provide values for the same name.\n- Extra vars passed through -e override the playbook value.\n\n**Mini-example:** save `mini.yml` in a separate temporary directory; run `ansible-playbook -i localhost, -c local mini.yml -e app_port=9090`. The example runs on localhost without become.\n\n```yaml\n- hosts: localhost\n  connection: local\n  become: false\n  gather_facts: false\n  tasks:\n    - ansible.builtin.debug:\n        msg: \"{{ app_port }}\"\n      vars:\n        app_port: 8080\n```\n\n**Predict:** What will the run show, and what will its exit code be?\n\n> [!question]- Answer\n> Run 1; exit code 0. Stdout excerpts:\n>\n> ```text\n>     \"msg\": \"9090\"\n> localhost                  : ok=1    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n>\n> Run 2; exit code 0. Stdout excerpts:\n>\n> ```text\n>     \"msg\": \"9090\"\n> localhost                  : ok=1    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n\nThe task defines 8080, but the run passes `-e app_port=9090`. The value passed at execution wins in the output.\n\nComplete `vars.yml`:\n\n```yaml\n- name: Follow a value through tasks\n  hosts: lab\n  connection: local\n  gather_facts: false\n  become: false\n  vars:\n    app_port: 8080\n  tasks:\n    - name: Read text from a process\n      ansible.builtin.command:\n        argv: [/usr/bin/printf, hello]\n      register: r\n      changed_when: false\n    - name: Store a derived host value\n      ansible.builtin.set_fact:\n        answer: \"{{ r.stdout | upper }}\"\n    - name: Show values\n      ansible.builtin.debug:\n        msg: \"{{ answer }}: {{ app_port }}\"\n    - name: Check expected input\n      ansible.builtin.assert:\n        that:\n          - answer == 'HELLO'\n          - app_port | int == 9090\n```\n\n`r` appears after the command runs. `r.stdout` is the managed process's standard output;\n`r.rc` is its exit code and `r.stderr` its error output. `| upper` transforms text on the controller.\n`set_fact` stores `answer` as a variable of the current inventory host, not a file on the managed node.\n`assert.that` is a list of checks; all must be `true` here.\n\n*(verified)* Run: `ansible-playbook vars.yml -e app_port=9090`:\n\n```text\nTASK [Show]\nok: [localhost] => {\n    \"msg\": \"HELLO: 9090\"\n}\nlocalhost : ok=4 changed=0 unreachable=0 failed=0 skipped=0 rescued=0 ignored=0\n```\n\nA variable is a named value on the controller, not shell environment on a managed node.\nWe choose the name in `app_port: 8080`; `ansible_host` has an engine-defined meaning.\n**Precedence** determines which same-named value wins. **Scope** determines where it is available.\nHigh precedence does not make a task variable available to every future task.\n\nStart with one conflict: role default app_port=8080, inventory app_port=8081, extra var app_port=9090. Running with -e app_port=9090 produces 9090. Full source table, connection variables and exceptions: [[#Справочник приоритетов переменных|Variable precedence reference]]. [Variable precedence](https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_variables.html#understanding-variable-precedence).\n\n`-e app_port=9090` passes a string, so the comparison uses `| int`.\nTo preserve types, prefer `-e @input.yml`, where `app_port: 9090` is a YAML integer and `enabled: false` a boolean.\nExtra vars override even a later `set_fact`: do not use `-e` indiscriminately.\n\n> [!info]- Deeper explanation\n> > [!info] Core and reference\n> > Core: one conflict between default → inventory → extra vars, explaining the winning value. Full precedence and role counterexamples are reference material, not a memorization list.\n>\n> **Other sources:** `vars_files` reads YAML on the controller; `include_vars` loads it as a task;\n> `lookup` reads a file, environment or API on the controller, not an arbitrary environment on a managed host.\n> A task/play `environment:` sets the module process environment where it executes,\n> but does not automatically create an Ansible variable. `lookup('ansible.builtin.env', 'HOME')` reads the controller's `HOME`.\n>\n> `vars_prompt` is a play field, for example:\n>\n> **`prompt.yml` (any filename) beside `inventory.ini` from §2:**\n>\n> ```yaml\n> - name: Ask for a non-secret release label\n>   hosts: lab\n>   connection: local\n>   gather_facts: false\n>   become: false\n>   vars_prompt:\n>     - name: release_name\n>       prompt: Release name\n>       private: false\n>       default: demo\n>   tasks:\n>     - name: Show selected release\n>       ansible.builtin.debug:\n>         msg: \"{{ release_name }}\"\n> ```\n>\n> A prompt is skipped when `-e` supplies the value or the session is noninteractive. A pipeline must pass\n> required inputs explicitly and validate them with `assert`, rather than waiting for keyboard input.\n> *(according to documentation)* [Prompts](https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_prompts.html).\n>\n> A typical failure is an undefined value. `vars: unused: \"{{ missing }}\"` may not fail\n> until `unused` is used: not every expression is evaluated while YAML is read.\n> Actual `debug: msg: \"{{ missing_port }}\"` run *(verified)*:\n>\n> ```text\n> Error while resolving value for 'msg': 'missing_port' is undefined\n> ```\n\n### Predict 4: command-line value\n\n**At a glance**\n- A variable can come from several sources.\n- The -e option supplies a value for a run.\n- When values conflict, identify both the winning source and the value's type.\n\n**`predict-4.yml` (any filename) beside `inventory.ini` from §2:**\n\n```yaml\n- hosts: lab\n  connection: local\n  gather_facts: false\n  become: false\n  vars:\n    app_port: 8080\n  tasks:\n  - name: Probe\n    ansible.builtin.debug:\n      msg: '{{ app_port }}'\n```\n\n**Predict:** add `-e app_port=9090` to both runs. What value does `Probe` print and what are the two recaps?\n\n> [!question]- Answer\n> ```text\n> # Первый запуск; код завершения 0\n> ok: [localhost] => {\n>     \"msg\": \"9090\"\n> }\n> localhost                  : ok=1    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> # Второй запуск; код завершения 0\n> ok: [localhost] => {\n>     \"msg\": \"9090\"\n> }\n> localhost                  : ok=1    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n> Extra vars override play `vars`; both runs print the string `9090`.\n\n### Predict 5: role and inventory\n\n**At a glance**\n- A role has defaults and separate role variables.\n- An inventory variable does not always override a role value.\n- Test a conflict on one name to see the rule.\n\n**`predict-5.yml` (any filename) beside `inventory.ini` from §2; role and `host_vars` files below are in the same directory:**\n\n```yaml\n- hosts: lab\n  connection: local\n  gather_facts: false\n  become: false\n  roles:\n  - demo\n  tasks: []\n```\n\n`roles/demo/defaults/main.yml`:\n\n```yaml\nmessage: from_defaults\n```\n\n`roles/demo/vars/main.yml`:\n\n```yaml\nmessage: from_role_vars\n```\n\n`roles/demo/tasks/main.yml`:\n\n```yaml\n- name: Probe\n  ansible.builtin.debug:\n    msg: '{{ message }}'\n```\n\n`host_vars/localhost.yml`:\n\n```yaml\nmessage: from_inventory\n```\n\n**Predict:** the role has both `defaults` and `vars`, and the host has an inventory variable. What does the role print and what are the two recaps?\n\n> [!question]- Answer\n> ```text\n> # Первый запуск; код завершения 0\n> ok: [localhost] => {\n>     \"msg\": \"from_role_vars\"\n> }\n> localhost                  : ok=1    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> # Второй запуск; код завершения 0\n> ok: [localhost] => {\n>     \"msg\": \"from_role_vars\"\n> }\n> localhost                  : ok=1    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n> Role `vars` override inventory variables; `defaults` are weaker than both sources.\n\nQuestion: **Which variable wins: inventory, role defaults or extra vars?**\n\n> Role defaults provide fallback values, and inventory can override them. Extra vars have the highest\n> variable priority. Role vars are stronger than inventory, so configurable role inputs normally\n> belong in defaults.\n"
