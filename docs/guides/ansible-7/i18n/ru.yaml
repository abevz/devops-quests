heading: '7. Шаблоны Jinja2: управляющий узел строит текст для конкретного хоста'
text: "## 7. Шаблоны Jinja2: управляющий узел строит текст для конкретного хоста\n\n**Коротко**\n- Шаблон строит текст из значений переменных.\n- Выражение Jinja вычисляется на управляющей машине.\n- Готовый текст всё равно должен подходить формату файла назначения.\n\n**Мини-пример:** в отдельном временном каталоге сохрани `mini.yml`; запуск — `ansible-playbook -i localhost, -c local mini.yml`. Пример работает на localhost без become.\n\n```yaml\n- hosts: localhost\n  connection: local\n  become: false\n  gather_facts: false\n  tasks:\n    - ansible.builtin.debug:\n        msg: \"name={{ 'api' | upper }} port={{ 8080 + 1 }}\"\n```\n\n**Предскажи:** что покажет запуск и каким будет код завершения?\n\n> [!question]- Ответ\n> Код завершения: 0. Фрагменты stdout:\n>\n> ```text\n>     \"msg\": \"name=API port=8081\"\n> localhost                  : ok=1    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n\nВыражение переводит `api` в верхний регистр и вычисляет число. Здесь показано построение строки; полный пример дальше записывает шаблон модулем `template`.\n\n| Инструмент | Что он контролирует | Когда выбрать |\n|---|---|---|\n| `copy` | Готовый файл или `content` | Текст одинаковый; `content` тоже может содержать простую подстановку. |\n| `template` | Полный файл после формирования шаблона Jinja | Есть значения конкретного хоста, циклы, условия. |\n| `lineinfile` | Одну строку, часто по `regexp` | Точечная правка чужой конфигурации; регулярное выражение должно узнавать старую и новую строку. |\n| `blockinfile` | Помеченный блок текста | Владение только частью файла; разные блоки требуют разных маркеров. |\n\nНе редактируйте один файл одновременно через `template` и `lineinfile`: следующий `template` перезапишет правку.\n`copy.src` по умолчанию находится на управляющем узле; `remote_src: true` меняет источник на управляемый узел.\n`template.src` — шаблон на управляющем узле. Родительский каталог нужно создать отдельно.\n\nФайл `app.conf.j2`:\n\n```jinja2\nport={{ app_port | default(8080) }}\n{% for user in users %}\n{% if user.enabled %}\nuser={{ user.name }}\n{% endif %}\n{% endfor %}\n```\n\n`{{ expression }}` выводит значение; `{% statement %}` управляет формированием текста и не выводит само ключевое слово.\n`{# comment #}` — комментарий Jinja, не попадёт в результат. `for` перебирает список `users`,\n`user` — временное имя текущего элемента, `if` проверяет его логическое значение `enabled`.\n`|` **внутри выражения** — фильтр, не маркер многострочного текста YAML.\n`default(8080)` заменяет неопределённое значение, но не `false` или пустую строку; `default(8080, true)` заменяет и значения,\nкоторые трактуются как ложные. Не применяйте второй вариант к порту `0` или логическому значению, если они имеют специальный смысл.\n\nПолный `template.yml`:\n\n```yaml\n- name: Render host configuration\n  hosts: lab\n  connection: local\n  gather_facts: false\n  become: false\n  vars:\n    users:\n      - name: alice\n        enabled: true\n      - name: bob\n        enabled: false\n  tasks:\n    - name: Render configuration\n      ansible.builtin.template:\n        src: app.conf.j2\n        dest: /tmp/ansible-visual-guide/rendered.conf\n        mode: \"0644\"\n```\n\n*(проверено)* Получился файл и результаты двух запусков:\n\n```text\nport=8080\nuser=alice\n\n# First:  ok=1 changed=1 failed=0\n# Second: ok=1 changed=0 failed=0\n```\n\n`template` решает задачу «одна схема конфигурации, разные значения у разных хостов».\nУправляющий узел читает `.j2`, подставляет переменные конкретного хоста, получает обычный текст и передаёт его\nна управляемый узел. Управляемый узел не исполняет Jinja. Затем сравниваются файл и атрибуты; изменение возвращается\nкак `changed`, что может уведомить обработчик.\n\n**Фильтр** меняет значение: `| int`, `| bool`, `| upper`, `| to_json`, `| combine(other_dict)`.\n**Проверка** возвращает логическое значение: `x is defined`, `x is none`, `result is failed`.\n`default(omit)` для аргумента модуля означает «не передавать этот параметр»; это не пустая строка.\nПосле него нельзя бездумно цеплять строковые фильтры: `omit` — служебное значение, не обычный текст.\n*(по документации)* [Фильтры](https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_filters.html),\n[Проверки](https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_tests.html).\n\n> [!info]- Глубже\n> ```mermaid\n> flowchart TB\n>     V[\"Inventory, переменные сценария, факты\"] --> J[\"Jinja на управляющем узле\"]\n>     S[\"Шаблон на управляющем узле\"] --> J\n>     J --> R[\"Сформированный текст для одного хоста\"]\n>     R --> T[\"Управляемый узел: сравнить, проверить, заменить файл\"]\n>     T --> C[\"JSON: изменено или без изменений\"]\n>     C --> H[\"Уведомить обработчик только при изменении\"]\n> ```\n>\n> Пробельные символы имеют смысл в конфигурации: модуль `template` Ansible по умолчанию использует `trim_blocks: true`,\n> поэтому переводы строк после директив блока обрабатываются иначе, чем после `{{ value }}`.\n> `{%-`/`-%}` удаляют соседние пробелы/переводы; слишком агрессивная обрезка склеит две строки конфигурации.\n> Не добавляйте метку времени в конфигурацию без нужды: новый текст даст `changed` на каждом запуске.\n>\n> Для проверки конфигурации до замены можно добавить `validate: '/path/to/app --check %s'`: управляемый узел проверяет\n> временный файл, `%s` заменяется его путём. Это не конвейер оболочки; конвейеры и перенаправления не исполняются.\n> На учебном стенде нет такого приложения, поэтому эта проверка *(по документации)*, её выполнение *(не проверено)*.\n> [Параметры шаблона](https://docs.ansible.com/ansible/latest/collections/ansible/builtin/template_module.html).\n>\n> Типичный сбой — неопределённое значение внутри шаблона или неверные кавычки YAML до Jinja. Реальная ошибка для\n> `x: {{ bad }}` *(проверено)*:\n>\n> ```text\n> [ERROR]: YAML parsing failed: This may be an issue with missing quotes around a template block.\n> ```\n>\n> Вопрос: **Where is a template rendered, and when is a handler notified?**\n>\n> > The `template` is rendered on the control node with variables for the current host. Ansible sends\n> > the resulting text to the target and compares it with the destination file. A notification is\n> > sent only if the task reports a change."
