heading: '7. Jinja2 templates: the controller builds text for a specific host'
text: "## 7. Jinja2 templates: the controller builds text for a specific host\n\n**At a glance**\n- A template builds text from variable values.\n- A Jinja expression is evaluated on the control machine.\n- The resulting text must still fit the destination file's format.\n\n**Mini-example:** save `mini.yml` in a separate temporary directory; run `ansible-playbook -i localhost, -c local mini.yml`. The example runs on localhost without become.\n\n```yaml\n- hosts: localhost\n  connection: local\n  become: false\n  gather_facts: false\n  tasks:\n    - ansible.builtin.debug:\n        msg: \"name={{ 'api' | upper }} port={{ 8080 + 1 }}\"\n```\n\n**Predict:** What will the run show, and what will its exit code be?\n\n> [!question]- Answer\n> Run 1; exit code 0. Stdout excerpts:\n>\n> ```text\n>     \"msg\": \"name=API port=8081\"\n> localhost                  : ok=1    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n>\n> Run 2; exit code 0. Stdout excerpts:\n>\n> ```text\n>     \"msg\": \"name=API port=8081\"\n> localhost                  : ok=1    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n\nThe expression converts `api` to uppercase and calculates a number. This demonstrates string construction; the full example below writes a template with the `template` module.\n\n| Tool | What it controls | When to choose it |\n|---|---|---|\n| `copy` | A ready file or `content` | Text is identical; `content` may also contain simple substitution. |\n| `template` | The complete file after Jinja rendering | Host-specific values, loops or conditions are needed. |\n| `lineinfile` | One line, often matched by `regexp` | A targeted edit to externally owned configuration; the regex must recognize old and new forms. |\n| `blockinfile` | A marked text block | You own only part of a file; distinct blocks need distinct markers. |\n\nDo not manage the same file with `template` and `lineinfile` simultaneously: the next `template` overwrites the edit.\n`copy.src` defaults to the controller; `remote_src: true` changes the source to the managed node.\n`template.src` is a template on the controller. Create the parent directory separately.\n\nFile `app.conf.j2`:\n\n```jinja2\nport={{ app_port | default(8080) }}\n{% for user in users %}\n{% if user.enabled %}\nuser={{ user.name }}\n{% endif %}\n{% endfor %}\n```\n\n`{{ expression }}` emits a value; `{% statement %}` controls rendering without emitting its keyword.\n`{# comment #}` is a Jinja comment and does not appear in the result. `for` iterates over `users`,\n`user` names the current item temporarily, and `if` checks its boolean `enabled` value.\n`|` **inside an expression** is a filter, not a YAML multiline marker.\n`default(8080)` replaces an undefined value, not `false` or an empty string; `default(8080, true)` also replaces values\nconsidered false. Avoid the second form for port `0` or a boolean when those values have a special meaning.\n\nComplete `template.yml`:\n\n```yaml\n- name: Render host configuration\n  hosts: lab\n  connection: local\n  gather_facts: false\n  become: false\n  vars:\n    users:\n      - name: alice\n        enabled: true\n      - name: bob\n        enabled: false\n  tasks:\n    - name: Render configuration\n      ansible.builtin.template:\n        src: app.conf.j2\n        dest: /tmp/ansible-visual-guide/rendered.conf\n        mode: \"0644\"\n```\n\n*(verified)* Resulting file and outcomes of two runs:\n\n```text\nport=8080\nuser=alice\n\n# First:  ok=1 changed=1 failed=0\n# Second: ok=1 changed=0 failed=0\n```\n\n`template` handles “one configuration structure, different values for different hosts”.\nThe controller reads `.j2`, substitutes that host's variables, produces ordinary text and sends it\nto the managed node. The managed node does not execute Jinja. The file and attributes are then compared; a change returns\n`changed`, which may notify a handler.\n\nA **filter** transforms a value: `| int`, `| bool`, `| upper`, `| to_json`, `| combine(other_dict)`.\nA **test** returns a boolean: `x is defined`, `x is none`, `result is failed`.\nFor a module argument, `default(omit)` means “do not pass this parameter”, not an empty string.\nDo not blindly chain string filters after it: `omit` is an internal sentinel rather than ordinary text.\n*(according to documentation)* [Filters](https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_filters.html),\n[Tests](https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_tests.html).\n\n> [!info]- Deeper explanation\n> ```mermaid\n> flowchart TB\n>     V[\"Inventory, play variables, facts\"] --> J[\"Jinja on the control node\"]\n>     S[\"Template on the control node\"] --> J\n>     J --> R[\"Rendered text for one host\"]\n>     R --> T[\"Managed host: compare, validate, replace the file\"]\n>     T --> C[\"JSON: changed or unchanged\"]\n>     C --> H[\"Notify the handler only on change\"]\n> ```\n>\n> Whitespace matters in configuration: Ansible `template` defaults to `trim_blocks: true`,\n> so line breaks after block directives are processed differently from those after `{{ value }}`.\n> `{%-`/`-%}` remove adjacent whitespace/newlines; aggressive trimming can join two configuration lines.\n> Do not add a timestamp unnecessarily: new text reports `changed` on every run.\n>\n> To validate configuration before replacement, add `validate: '/path/to/app --check %s'`: the managed node checks\n> a temporary file, with `%s` replaced by its path. This is not a shell pipeline; pipes and redirects are not executed.\n> That application is absent from the exercise lab, so this check is *(according to documentation)* and execution is *(not verified)*.\n> [Template parameters](https://docs.ansible.com/ansible/latest/collections/ansible/builtin/template_module.html).\n>\n> A typical failure is an undefined template value or incorrect YAML quoting before Jinja. Actual error for\n> `x: {{ bad }}` *(verified)*:\n>\n> ```text\n> [ERROR]: YAML parsing failed: This may be an issue with missing quotes around a template block.\n> ```\n>\n> Question: **Where is a template rendered, and when is a handler notified?**\n>\n> > The `template` is rendered on the control node with variables for the current host. Ansible sends\n> > the resulting text to the target and compares it with the destination file. A notification is\n> > sent only if the task reports a change.\n"
