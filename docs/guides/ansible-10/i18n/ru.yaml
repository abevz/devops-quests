heading: '10. Обработчики: очередь реакции на изменение (handlers)'
text: "## 10. Обработчики: очередь реакции на изменение (handlers)\n\n**Коротко**\n- Обработчик выполняет реакцию на изменение.\n- notify ставит уведомление только после changed.\n- Несколько уведомлений до сброса очереди могут дать один запуск обработчика.\n\n**Мини-пример:** в отдельном временном каталоге сохрани `mini.yml`; запуск — `ansible-playbook -i localhost, -c local mini.yml`. Пример работает на localhost без become.\n\n```yaml\n- hosts: localhost\n  connection: local\n  become: false\n  gather_facts: false\n  tasks:\n    - ansible.builtin.debug: {msg: changed}\n      changed_when: true\n      notify: reload\n  handlers:\n    - name: reload\n      ansible.builtin.debug: {msg: handler}\n```\n\n**Предскажи:** что покажет запуск и каким будет код завершения?\n\n> [!question]- Ответ\n> Код завершения: 0. Фрагменты stdout:\n>\n> ```text\n>     \"msg\": \"changed\"\n>     \"msg\": \"handler\"\n> localhost                  : ok=2    changed=1    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n\nУчебная задача явно сообщает `changed: true`, поэтому уведомляет `reload`. Обработчик запускается после обычных задач; это печать сообщения, не перезапуск сервиса.\n\nПолный `handlers.yml`:\n\n```yaml\n- name: Explain handler queue\n  hosts: lab\n  connection: local\n  gather_facts: false\n  become: false\n  tasks:\n    - name: Simulate a changed result\n      ansible.builtin.debug:\n        msg: changed event\n      changed_when: true\n      notify: configuration changed\n    - name: Flush before continuing\n      ansible.builtin.meta: flush_handlers\n    - name: Continue after flush\n      ansible.builtin.debug:\n        msg: next task\n  handlers:\n    - name: Report reload\n      ansible.builtin.debug:\n        msg: handler ran\n      listen: configuration changed\n```\n\nОбработчик — задача в специальном списке `handlers`. Он решает задачу «перезапустить один раз после\nнескольких изменений», а не «выполнять перезапуск после каждой строки конфигурации».\nУправляющий узел получает `changed`, читает `notify`, добавляет уведомление в очередь для этого хоста.\nВ точке сброса очереди обработчик выполняется как обычная задача через выбранный транспорт.\n\nСтандартные точки: после `pre_tasks`, после `roles`/`tasks`, после `post_tasks`.\nЕсли обработчик уведомлён несколько раз до одной точки, он выполнится один раз.\nПорядок — порядок определения обработчиков, не порядок `notify`. После сброса очереди новое уведомление может\nзапустить тот же обработчик снова в следующей точке.\n\n> [!info]- Глубже\n> `notify` может указывать имя обработчика либо **тему уведомления `listen`**. `listen` объединяет несколько разных\n> обработчиков под одним событием; задача не обязана знать имя каждого. В реальном обработчике конфигурации вместо\n> `debug` можно использовать `ansible.builtin.service: {name: app, state: restarted}`;\n> это требует существующего сервиса и прав доступа, поэтому здесь не запускалось.\n> Имя обработчика должно быть уникально: одноимённые обработчики могут затенять друг друга.\n> *(по документации)* [Обработчики](https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_handlers.html).\n\n### Почему следующий запуск не спасает автоматически\n\n**Коротко**\n- Уведомление живёт в очереди текущего запуска.\n- Ошибка до сброса очереди может оставить обработчик невыполненным.\n- Повтор без нового changed не создаёт уведомление заново.\n\n**Короткий сценарий**\n\nФайл изменился, задача уведомила reload. Следующая задача упала. На повторе файл уже совпадает, поэтому модуль сообщает ok без changed.\n\n**Предскажи:** Гарантирует ли повтор, что процесс перечитает файл?\n\n> [!question]- Ответ\n> Нет. На повторе нового уведомления нет. Нужно отдельно восстановить работоспособность и проверить, какую конфигурацию использует процесс.\n\n*(проверено)* В локальном стенде `debug` с `changed`, затем `/usr/bin/false`, без сброса очереди:\n\n```text\n# Normal: handler absent\nlocalhost : ok=1 changed=1 unreachable=0 failed=1 rescued=0 ignored=0\n# force_handlers: true\nRUNNING HANDLER [H]\nok: [localhost] => {\"msg\": \"handler ran\"}\nlocalhost : ok=2 changed=1 unreachable=0 failed=1 rescued=0 ignored=0\n```\n\n1. `template` изменил файл, уведомление `notify` поставлено в очередь.\n2. Следующая задача на этом хосте упала до сброса очереди.\n3. По умолчанию обработчик из очереди для хоста с ошибкой не запускается.\n4. Повтор: конфигурация уже совпадает, `template` возвращает `ok` и не уведомляет обработчик.\n5. Сервис может продолжать работать со старой конфигурацией в памяти.\n\nПринудительный обработчик не превратил неуспешное развёртывание в успешное. `flush_handlers` до проверки работоспособности полезен,\nесли проверка должна проверять **уже перезапущенный** сервис; иначе она проверит старый процесс.\nНо сброс выполняет всю ожидающую очередь хоста, а не один выбранный обработчик.\n\n> [!info]- Глубже\n> Это сбой **конкретного хоста**, а не правило «любая ошибка сценария отменяет все обработчики».\n> У здоровых хостов уведомлённые обработчики обычно продолжают выполняться.\n> `--force-handlers` / ключ сценария `force_handlers: true` принуждает запуск уже уведомлённых обработчиков даже\n> для хоста с ошибкой. Это не уведомление неуведомлённых обработчиков и не обход `unreachable`: недоступный\n> хост не сможет исполнить перезапуск. Ошибка разбора или фатальный обрыв выполнения тоже не исправляются.\n\n### Предскажи 8: Два уведомления одного обработчика\n\n**Коротко**\n- Две задачи могут уведомить один обработчик.\n- До общей точки сброса очередь объединяет одинаковые уведомления.\n- Число уведомлений не равно числу выполнений.\n\n**Мини-пример:** в отдельном временном каталоге сохрани `mini.yml`; запуск — `ansible-playbook -i localhost, -c local mini.yml`. Пример работает на localhost без become.\n\n```yaml\n- hosts: localhost\n  connection: local\n  become: false\n  gather_facts: false\n  tasks:\n    - ansible.builtin.debug: {msg: changed}\n      changed_when: true\n      notify: reload\n      loop: [first, second]\n  handlers:\n    - name: reload\n      ansible.builtin.debug: {msg: handler}\n```\n\n**Предскажи:** Сколько раз выполнится обработчик при двух итерациях?\n\n> [!question]- Ответ\n> Код завершения: 0. Фрагменты stdout:\n>\n> ```text\n>     \"msg\": \"changed\"\n>     \"msg\": \"changed\"\n>     \"msg\": \"handler\"\n> localhost                  : ok=2    changed=1    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n\nОбе итерации дают changed и уведомляют один `reload`. В общей точке сброса он выполняется один раз.\n\n**`predict-8.yml` (имя любое) рядом с `inventory.ini` из §2:**\n\n```yaml\n- hosts: lab\n  connection: local\n  gather_facts: false\n  become: false\n  handlers:\n  - name: H\n    ansible.builtin.debug:\n      msg: handler ran\n  tasks:\n  - name: A\n    ansible.builtin.debug:\n      msg: first\n    changed_when: true\n    notify: H\n  - name: B\n    ansible.builtin.debug:\n      msg: second\n    changed_when: true\n    notify: H\n```\n\n**Предскажи:** Сколько раз запустится `H` в первом и во втором запуске? Каковы сводки?\n\n> [!question]- Ответ\n> ```text\n> # Первый запуск; код завершения 0\n> changed: [localhost] => {\n>     \"msg\": \"first\"\n> }\n> changed: [localhost] => {\n>     \"msg\": \"second\"\n> }\n> RUNNING HANDLER [H] ************************************************************\n> ok: [localhost] => {\n>     \"msg\": \"handler ran\"\n> }\n> localhost                  : ok=3    changed=2    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> # Второй запуск; код завершения 0\n> changed: [localhost] => {\n>     \"msg\": \"first\"\n> }\n> changed: [localhost] => {\n>     \"msg\": \"second\"\n> }\n> RUNNING HANDLER [H] ************************************************************\n> ok: [localhost] => {\n>     \"msg\": \"handler ran\"\n> }\n> localhost                  : ok=3    changed=2    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n> Два уведомления до одной точки сброса объединяются в одно выполнение `H`. Здесь обе задачи всегда сообщают изменение, поэтому картина повторяется.\n\n### Предскажи 9: Запись файла и последующий сбой\n\n**Коротко**\n- После изменения может произойти отдельный отказ.\n- Без принудительного режима обработчик ошибочного хоста может не выполниться.\n- Неуспешный запуск не отменяет уже сделанные действия.\n\n**Мини-пример:** в отдельном временном каталоге сохрани `mini.yml`; запуск — `ansible-playbook -i localhost, -c local mini.yml`. Пример работает на localhost без become.\n\n```yaml\n- hosts: localhost\n  connection: local\n  become: false\n  gather_facts: false\n  tasks:\n    - ansible.builtin.debug: {msg: changed}\n      changed_when: true\n      notify: reload\n    - ansible.builtin.fail: {msg: stop}\n  handlers:\n    - name: reload\n      ansible.builtin.debug: {msg: handler}\n```\n\n**Предскажи:** Появится ли сообщение handler? Какой код вернёт ansible-playbook?\n\n> [!question]- Ответ\n> Код завершения: 2. Фрагменты stdout:\n>\n> ```text\n>     \"msg\": \"changed\"\n> localhost                  : ok=1    changed=1    unreachable=0    failed=1    skipped=0    rescued=0    ignored=0\n> ```\n\nЗадача падает до штатного сброса очереди. Обработчик не выполняется, код запуска ненулевой. В полном опыте ниже показано реальное изменение учебного файла.\n\nДля повторения этого примера сначала создайте родительский учебный каталог:\n\n```bash\nmkdir -p /tmp/ansible-visual-guide\n```\n\nПеред новой парой запусков файл `failure-config` должен отсутствовать. Если он уже есть, выберите другой\nновый учебный каталог, создайте его и замените `dest` в примере; незнакомые файлы не удаляйте.\nМежду первым и вторым запуском файл сохраняется. Записанный ниже результат получен с показанным путём.\n\n**`predict-9.yml` (имя любое) рядом с `inventory.ini` из §2:**\n\n```yaml\n- hosts: lab\n  connection: local\n  gather_facts: false\n  become: false\n  handlers:\n  - name: H\n    ansible.builtin.debug:\n      msg: handler ran\n  tasks:\n  - name: Probe\n    ansible.builtin.copy:\n      content: 'v1\n\n        '\n      dest: /tmp/ansible-visual-guide/failure-config\n      mode: '0644'\n    notify: H\n  - name: Fail\n    ansible.builtin.command:\n      argv:\n      - /usr/bin/false\n    changed_when: false\n```\n\n**Предскажи:** Перед первым запуском файл назначения отсутствует; между запусками его не удаляют. Запустится ли `H`, и как изменится сводка на повторе?\n\n> [!question]- Ответ\n> ```text\n> # Первый запуск; код завершения 2\n> localhost                  : ok=1    changed=1    unreachable=0    failed=1    skipped=0    rescued=0    ignored=0\n> # Второй запуск; код завершения 2\n> localhost                  : ok=1    changed=0    unreachable=0    failed=1    skipped=0    rescued=0    ignored=0\n> ```\n> Первый запуск записывает файл, но сбой блокирует обработчик. Во втором содержимое уже совпадает и нового уведомления нет; сбой остаётся.\n\nВопрос: **Why can a service keep the old configuration after a second run?**\n\n> The first run may write the new file and fail before the restart handler runs. On the second run,\n> the file is already correct, so the task does not `notify` the handler again. I would place a safe\n> handler flush before the health check or use `force-handlers` when that behavior is appropriate."
