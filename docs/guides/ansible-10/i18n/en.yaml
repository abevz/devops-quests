heading: '10. Handlers: a queue of reactions to changes'
text: "## 10. Handlers: a queue of reactions to changes\n\n**At a glance**\n- A handler reacts to a change.\n- notify queues a notification only after changed.\n- Several notifications before a queue flush can produce one handler execution.\n\n**Mini-example:** save `mini.yml` in a separate temporary directory; run `ansible-playbook -i localhost, -c local mini.yml`. The example runs on localhost without become.\n\n```yaml\n- hosts: localhost\n  connection: local\n  become: false\n  gather_facts: false\n  tasks:\n    - ansible.builtin.debug: {msg: changed}\n      changed_when: true\n      notify: reload\n  handlers:\n    - name: reload\n      ansible.builtin.debug: {msg: handler}\n```\n\n**Predict:** What will the run show, and what will its exit code be?\n\n> [!question]- Answer\n> Run 1; exit code 0. Stdout excerpts:\n>\n> ```text\n>     \"msg\": \"changed\"\n>     \"msg\": \"handler\"\n> localhost                  : ok=2    changed=1    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n>\n> Run 2; exit code 0. Stdout excerpts:\n>\n> ```text\n>     \"msg\": \"changed\"\n>     \"msg\": \"handler\"\n> localhost                  : ok=2    changed=1    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n\nThe teaching task explicitly reports `changed: true`, so it notifies `reload`. The handler runs after ordinary tasks; it prints a message rather than restarting a service.\n\nComplete `handlers.yml`:\n\n```yaml\n- name: Explain handler queue\n  hosts: lab\n  connection: local\n  gather_facts: false\n  become: false\n  tasks:\n    - name: Simulate a changed result\n      ansible.builtin.debug:\n        msg: changed event\n      changed_when: true\n      notify: configuration changed\n    - name: Flush before continuing\n      ansible.builtin.meta: flush_handlers\n    - name: Continue after flush\n      ansible.builtin.debug:\n        msg: next task\n  handlers:\n    - name: Report reload\n      ansible.builtin.debug:\n        msg: handler ran\n      listen: configuration changed\n```\n\nA handler is a task in the special `handlers` list. It implements “restart once after\nseveral changes”, not “restart after every configuration line”.\nThe controller receives `changed`, reads `notify` and queues a notification for that host.\nAt a flush point the handler executes as an ordinary task through the selected transport.\n\nStandard points are after `pre_tasks`, after `roles`/`tasks`, and after `post_tasks`.\nSeveral notifications before one flush point result in one execution.\nExecution follows handler definition order, not `notify` order. After a flush, another notification may\nrun the same handler again at the next point.\n\n> [!info]- Deeper explanation\n> `notify` can name a handler or a **`listen` notification topic**. `listen` groups different\n> handlers under one event; the task need not know every handler name. A real configuration handler could use\n> `ansible.builtin.service: {name: app, state: restarted}` instead of `debug`;\n> that requires an existing service and permissions, so it was not run here.\n> Handler names should be unique: handlers with identical names can shadow each other.\n> *(according to documentation)* [Handlers](https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_handlers.html).\n\n### Why the next run does not automatically fix it\n\n**At a glance**\n- A notification stays in the current run's queue.\n- An error before the queue flush can leave the handler unexecuted.\n- A repeat run without a new changed status does not recreate the notification.\n\n**Short scenario**\n\nThe file changed, and the task notified reload. The next task failed. On a repeat run, the file already matches, so the module reports ok without changed.\n\n**Predict:** Does repeating the run guarantee that the process rereads the file?\n\n> [!question]- Answer\n> No. The repeat run has no new notification. Restore service health separately and check which configuration the process uses.\n\n*(verified)* In the local lab, `debug` reported `changed`, followed by `/usr/bin/false`, without a handler flush:\n\n```text\n# Normal: handler absent\nlocalhost : ok=1 changed=1 unreachable=0 failed=1 rescued=0 ignored=0\n# force_handlers: true\nRUNNING HANDLER [H]\nok: [localhost] => {\"msg\": \"handler ran\"}\nlocalhost : ok=2 changed=1 unreachable=0 failed=1 rescued=0 ignored=0\n```\n\n1. `template` changes a file and queues a `notify` notification.\n2. The next task on this host fails before handlers are flushed.\n3. By default a queued handler does not run for a failed host.\n4. On a repeat run, configuration already matches; `template` returns `ok` and does not notify.\n5. The service may keep its old configuration in memory.\n\nA forced handler did not turn a failed deployment into a successful one. `flush_handlers` before a health check is useful\nwhen the check must inspect an **already restarted** service; otherwise it checks the old process.\nHowever, flushing executes the host's entire pending queue, not just one selected handler.\n\n> [!info]- Deeper explanation\n> This concerns **a particular failed host**, not a rule that “any play error cancels every handler”.\n> Notified handlers on healthy hosts normally continue to run.\n> `--force-handlers` / play keyword `force_handlers: true` forces already notified handlers to run even\n> for a failed host. It does not notify unnotified handlers or bypass `unreachable`: a disconnected\n> host cannot perform the restart. Parsing errors and fatal execution interruptions are not repaired either.\n\n### Predict 8: two notifications of one handler\n\n**At a glance**\n- Two tasks can notify one handler.\n- Before a shared flush point, the queue merges identical notifications.\n- The number of notifications does not equal the number of executions.\n\n**Mini-example:** save `mini.yml` in a separate temporary directory; run `ansible-playbook -i localhost, -c local mini.yml`. The example runs on localhost without become.\n\n```yaml\n- hosts: localhost\n  connection: local\n  become: false\n  gather_facts: false\n  tasks:\n    - ansible.builtin.debug: {msg: changed}\n      changed_when: true\n      notify: reload\n      loop: [first, second]\n  handlers:\n    - name: reload\n      ansible.builtin.debug: {msg: handler}\n```\n\n**Predict:** How many times will the handler run with two iterations?\n\n> [!question]- Answer\n> Run 1; exit code 0. Stdout excerpts:\n>\n> ```text\n>     \"msg\": \"changed\"\n>     \"msg\": \"changed\"\n>     \"msg\": \"handler\"\n> localhost                  : ok=2    changed=1    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n>\n> Run 2; exit code 0. Stdout excerpts:\n>\n> ```text\n>     \"msg\": \"changed\"\n>     \"msg\": \"changed\"\n>     \"msg\": \"handler\"\n> localhost                  : ok=2    changed=1    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n\nBoth iterations report changed and notify the same `reload`. It executes once at the shared flush point.\n\n**`predict-8.yml` (any filename) beside `inventory.ini` from §2:**\n\n```yaml\n- hosts: lab\n  connection: local\n  gather_facts: false\n  become: false\n  handlers:\n  - name: H\n    ansible.builtin.debug:\n      msg: handler ran\n  tasks:\n  - name: A\n    ansible.builtin.debug:\n      msg: first\n    changed_when: true\n    notify: H\n  - name: B\n    ansible.builtin.debug:\n      msg: second\n    changed_when: true\n    notify: H\n```\n\n**Predict:** how often does `H` run in the first and second executions? What are their recaps?\n\n> [!question]- Answer\n> ```text\n> # Первый запуск; код завершения 0\n> changed: [localhost] => {\n>     \"msg\": \"first\"\n> }\n> changed: [localhost] => {\n>     \"msg\": \"second\"\n> }\n> RUNNING HANDLER [H] ************************************************************\n> ok: [localhost] => {\n>     \"msg\": \"handler ran\"\n> }\n> localhost                  : ok=3    changed=2    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> # Второй запуск; код завершения 0\n> changed: [localhost] => {\n>     \"msg\": \"first\"\n> }\n> changed: [localhost] => {\n>     \"msg\": \"second\"\n> }\n> RUNNING HANDLER [H] ************************************************************\n> ok: [localhost] => {\n>     \"msg\": \"handler ran\"\n> }\n> localhost                  : ok=3    changed=2    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n> Two notifications before one flush point coalesce into one execution of `H`. Both tasks always report changes here, so the pattern repeats.\n\n### Predict 9: writing a file followed by failure\n\n**At a glance**\n- A separate failure can happen after a change.\n- Without forced handlers, a failed host's handler may not run.\n- A failed run does not undo actions already performed.\n\n**Mini-example:** save `mini.yml` in a separate temporary directory; run `ansible-playbook -i localhost, -c local mini.yml`. The example runs on localhost without become.\n\n```yaml\n- hosts: localhost\n  connection: local\n  become: false\n  gather_facts: false\n  tasks:\n    - ansible.builtin.debug: {msg: changed}\n      changed_when: true\n      notify: reload\n    - ansible.builtin.fail: {msg: stop}\n  handlers:\n    - name: reload\n      ansible.builtin.debug: {msg: handler}\n```\n\n**Predict:** Will the handler message appear? What exit code will ansible-playbook return?\n\n> [!question]- Answer\n> Run 1; exit code 2. Stdout excerpts:\n>\n> ```text\n>     \"msg\": \"changed\"\n> localhost                  : ok=1    changed=1    unreachable=0    failed=1    skipped=0    rescued=0    ignored=0\n> ```\n>\n> Run 2; exit code 2. Stdout excerpts:\n>\n> ```text\n>     \"msg\": \"changed\"\n> localhost                  : ok=1    changed=1    unreachable=0    failed=1    skipped=0    rescued=0    ignored=0\n> ```\n\nThe task fails before the normal queue flush. The handler does not run, and the exit code is nonzero. The full experiment below shows an actual change to a teaching file.\n\nTo repeat this example, first create the parent exercise directory:\n\n```bash\nmkdir -p /tmp/ansible-revision-jRYkFm\n```\n\nBefore a new pair of runs, `failure-config` must be absent. If it already exists, choose a different\nnew exercise directory, create it and update `dest` in the example; do not delete unfamiliar files.\nKeep the file between the first and second runs. The recorded result below used the shown path.\n\n**`predict-9.yml` (any filename) beside `inventory.ini` from §2:**\n\n```yaml\n- hosts: lab\n  connection: local\n  gather_facts: false\n  become: false\n  handlers:\n  - name: H\n    ansible.builtin.debug:\n      msg: handler ran\n  tasks:\n  - name: Probe\n    ansible.builtin.copy:\n      content: 'v1\n\n        '\n      dest: /tmp/ansible-revision-jRYkFm/failure-config\n      mode: '0644'\n    notify: H\n  - name: Fail\n    ansible.builtin.command:\n      argv:\n      - /usr/bin/false\n    changed_when: false\n```\n\n**Predict:** the destination file is absent before the first run and is retained between runs. Will `H` run, and how will the recap change on repetition?\n\n> [!question]- Answer\n> ```text\n> # Первый запуск; код завершения 2\n> localhost                  : ok=1    changed=1    unreachable=0    failed=1    skipped=0    rescued=0    ignored=0\n> # Второй запуск; код завершения 2\n> localhost                  : ok=1    changed=0    unreachable=0    failed=1    skipped=0    rescued=0    ignored=0\n> ```\n> The first run writes the file, but failure blocks the handler. The second finds matching content and sends no new notification; failure remains.\n\nQuestion: **Why can a service keep the old configuration after a second run?**\n\n> The first run may write the new file and fail before the restart handler runs. On the second run,\n> the file is already correct, so the task does not `notify` the handler again. I would place a safe\n> handler flush before the health check or use `force-handlers` when that behavior is appropriate.\n"
