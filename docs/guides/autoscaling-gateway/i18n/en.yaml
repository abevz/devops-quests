heading: Autoscaling and gateway recovery
text: '# Autoscaling and gateway recovery


  Use only the offline bay. A HorizontalPodAutoscaler (HPA) compares observed CPU usage to the Pod''s CPU request; `100m` means one tenth of a CPU. A missing or zero request makes utilization unusable. Inspect the supplied `board.json` and `hpa.json`, the metrics API, `kubectl top pods` and HPA status. Set the required request and limit, then allow time for metrics sampling, HPA reconciliation and Pod readiness. A current metric and two replicas are observations, not proof of the scaling history.


  In quest 130 stage two, a Gateway listener accepts connections and an HTTPRoute selects a backend Service by host and port. Inspect `gateway.json`, `route.json` and the frozen class, URL and controller namespace in `gateway-target.json`. Check Gateway Accepted and route ResolvedRefs, including parent and generation when diagnosing real systems; a single condition alone may be stale or refer to another parent.


  A NetworkPolicy selects destination Pods. A peer containing both namespaceSelector and podSelector matches Pods satisfying both in that namespace; separate peers would mean alternatives. Compare the exact single-rule `board-ingress` shape described in the quest with `ingress-policy.json`, then test the frozen URL with the allowed Host, a closed Host and direct client access. A failed request can have several causes, so do not infer the cause from failure alone. The disposable adapter and its private TLS relaxations are not production configuration.


  References: [HPA](https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/), [HTTPRoute](https://gateway-api.sigs.k8s.io/reference/api-types/httproute/), [NetworkPolicy](https://kubernetes.io/docs/reference/kubernetes-api/networking/network-policy-v1/).


  Inspect the resources and sampling state:


  ```sh

  cd ~/quest

  kubectl get deployment board -o yaml

  kubectl get hpa board -o yaml

  kubectl top pods -l app=board

  ```


  In quest 130 stage two, inspect routing and policy separately:


  ```sh

  kubectl get gateway,httproute,networkpolicy -o yaml

  ```

  '
