heading: Autoskalowanie i odzyskiwanie gateway
text: '# Autoskalowanie i odzyskiwanie gateway


  Używaj tylko zatoki offline. HorizontalPodAutoscaler (HPA) porównuje obserwowane użycie CPU z żądaniem CPU Poda; `100m` to jedna dziesiąta CPU. Brak lub zerowe żądanie uniemożliwia użyteczne obliczenie wykorzystania. Sprawdź dostarczone `board.json` i `hpa.json`, API metryk, `kubectl top pods` oraz status HPA. Ustaw wymagane żądanie i limit, następnie daj czas na próbkowanie metryk, uzgodnienie HPA i gotowość Podów. Bieżąca metryka i dwie repliki są obserwacjami, nie dowodem historii skalowania.


  W zadaniu 130 na drugim etapie listener Gateway przyjmuje połączenia, a HTTPRoute wybiera backend Service według hosta i portu. Sprawdź `gateway.json`, `route.json` oraz zapisaną klasę, URL i namespace kontrolera w `gateway-target.json`. Sprawdź Gateway Accepted i route ResolvedRefs, a w prawdziwych systemach również parent i generację; pojedynczy warunek może być nieaktualny lub dotyczyć innego parenta.


  NetworkPolicy wybiera docelowe Pody. Peer z namespaceSelector i podSelector wybiera Pody spełniające oba warunki w tym namespace; oddzielne peery oznaczałyby alternatywy. Porównaj dokładną strukturę jednej reguły `board-ingress` opisaną w zadaniu z `ingress-policy.json`, a następnie sprawdź zapisany URL z dozwolonym Host, zamkniętym Host i bezpośredni dostęp klienta. Nieudane żądanie może mieć różne przyczyny, więc samo nie dowodzi przyczyny. Jednorazowy adapter i jego prywatne uproszczenia TLS nie są konfiguracją produkcyjną.


  Źródła: [HPA](https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/), [HTTPRoute](https://gateway-api.sigs.k8s.io/reference/api-types/httproute/), [NetworkPolicy](https://kubernetes.io/docs/reference/kubernetes-api/networking/network-policy-v1/).


  Sprawdź zasoby i stan zbierania metryk:


  ```sh

  cd ~/quest

  kubectl get deployment board -o yaml

  kubectl get hpa board -o yaml

  kubectl top pods -l app=board

  ```


  W zadaniu 130 w drugim etapie osobno sprawdź routing i politykę:


  ```sh

  kubectl get gateway,httproute,networkpolicy -o yaml

  ```

  '
