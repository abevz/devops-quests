heading: Autoskalierung und Gateway-Wiederherstellung
text: |
  # Autoskalierung und Gateway-Wiederherstellung

  Autoscaling braucht ein auflösbares Skalierungsziel, einen brauchbaren Metriknenner und tatsächliche Arbeit. CPU-Auslastung setzt Nutzung zum CPU-Request ins Verhältnis; ein fehlender Request verhindert die Berechnung. Korrekte Ressourcen erzeugen keine Nachfrage. Prüfe HPA-Bedingungen, Referenzen, Pod-Metriken und Verarbeitungsschnittstelle. Beobachte reale Abschlüsse neben Replikzahlen; synthetische Verarbeitung ist kein Produktions-SLO.

  In Quest 130 Phase zwei nimmt ein Gateway-Listener Verbindungen an und eine HTTPRoute wählt nach Host und Port einen Backend-Service. Prüfe `gateway.yaml`, `route.yaml` sowie gespeicherte Klasse, URL und Controller-Namespace in `gateway-target.json`. Prüfe Gateway Accepted und Route ResolvedRefs, bei echten Systemen auch Parent und Generation; eine einzelne Bedingung kann veraltet sein oder einen anderen Parent betreffen.

  Eine NetworkPolicy wählt Ziel-Pods. Ein Peer mit namespaceSelector und podSelector wählt Pods, die beide Bedingungen im Namespace erfüllen; getrennte Peers wären Alternativen. Vergleiche die genaue Ein-Regel-Struktur von `board-ingress` aus der Aufgabe mit `ingress-policy.yaml` und prüfe die gespeicherte URL mit erlaubtem Host, geschlossenem Host und direktem Client-Zugriff. Eine fehlgeschlagene Anfrage kann verschiedene Ursachen haben und beweist allein keine davon. Der vergängliche Adapter und seine privaten TLS-Lockerungen sind keine Produktionskonfiguration.

  Quellen: [HPA](https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/), [HTTPRoute](https://gateway-api.sigs.k8s.io/reference/api-types/httproute/), [NetworkPolicy](https://kubernetes.io/docs/reference/kubernetes-api/networking/network-policy-v1/).

  Prüfe Ressourcen und Metrikstatus:

  ```sh
  cd ~/quest
  kubectl get deployment board -o yaml
  kubectl get hpa board -o yaml
  kubectl top pods -l app=board
  ```

  Prüfe in Quest 130 Phase zwei Routing und Policy getrennt:

  ```sh
  kubectl get gateway,httproute,networkpolicy -o yaml
  ```

  In Quest 113 sind Gateway-Listener-Anbindung und Backend-Service-Referenzen unabhängige Controller-Entscheidungen. Betrachte den angefragten Parent im Kontext des erhaltenen Listeners, Controllers und der aktuellen HTTPRoute-Generation. Accepted impliziert nicht ResolvedRefs; Bedingungen eines anderen Parents oder einer älteren Generation belegen keine aktuelle Gesundheit. Erhalte Routing-Identitäten und Listenerdefinitionen und vergleiche beide Bedingungen mit realem Verkehr für passenden und geschlossenen Host.

  ```sh
  cd ~/quest
  cat gateway-target.json attachment-contract.json
  kubectl get gateway,httproute,service -o yaml
  ```
