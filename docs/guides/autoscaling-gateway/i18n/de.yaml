heading: Autoskalierung und Gateway-Wiederherstellung
text: '# Autoskalierung und Gateway-Wiederherstellung


  Nutze nur die Offline-Umgebung. Ein HorizontalPodAutoscaler (HPA) vergleicht beobachtete CPU-Nutzung mit dem CPU-Request des Pods; `100m` bedeutet ein Zehntel einer CPU. Ein fehlender oder null Request verhindert eine sinnvolle Auslastungsberechnung. Prüfe die bereitgestellten `board.json` und `hpa.json`, die Metrik-API, `kubectl top pods` und den HPA-Status. Setze Request und Limit und warte auf Metrik-Abtastung, HPA-Abgleich und Pod-Bereitschaft. Eine aktuelle Metrik und zwei Replikate sind Beobachtungen, kein Beweis der Skalierungshistorie.


  In Quest 130 Phase zwei nimmt ein Gateway-Listener Verbindungen an und eine HTTPRoute wählt nach Host und Port einen Backend-Service. Prüfe `gateway.json`, `route.json` sowie gespeicherte Klasse, URL und Controller-Namespace in `gateway-target.json`. Prüfe Gateway Accepted und Route ResolvedRefs, bei echten Systemen auch Parent und Generation; eine einzelne Bedingung kann veraltet sein oder einen anderen Parent betreffen.


  Eine NetworkPolicy wählt Ziel-Pods. Ein Peer mit namespaceSelector und podSelector wählt Pods, die beide Bedingungen im Namespace erfüllen; getrennte Peers wären Alternativen. Vergleiche die genaue Ein-Regel-Struktur von `board-ingress` aus der Aufgabe mit `ingress-policy.json` und prüfe die gespeicherte URL mit erlaubtem Host, geschlossenem Host und direktem Client-Zugriff. Eine fehlgeschlagene Anfrage kann verschiedene Ursachen haben und beweist allein keine davon. Der vergängliche Adapter und seine privaten TLS-Lockerungen sind keine Produktionskonfiguration.


  Quellen: [HPA](https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/), [HTTPRoute](https://gateway-api.sigs.k8s.io/reference/api-types/httproute/), [NetworkPolicy](https://kubernetes.io/docs/reference/kubernetes-api/networking/network-policy-v1/).


  Prüfe Ressourcen und Metrikstatus:


  ```sh

  cd ~/quest

  kubectl get deployment board -o yaml

  kubectl get hpa board -o yaml

  kubectl top pods -l app=board

  ```


  Prüfe in Quest 130 Phase zwei Routing und Policy getrennt:


  ```sh

  kubectl get gateway,httproute,networkpolicy -o yaml

  ```

  '
