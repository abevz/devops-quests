heading: Autoscalado y recuperación de gateway
text: '# Autoscalado y recuperación de gateway


  Usa solo la bahía sin conexión. Un HorizontalPodAutoscaler (HPA) compara el uso CPU observado con la solicitud CPU del Pod; `100m` es una décima de CPU. Una solicitud ausente o cero impide una utilización útil. Inspecciona `board.json` y `hpa.json` proporcionados, la API de métricas, `kubectl top pods` y el estado HPA. Ajusta solicitud y límite requeridos y espera el muestreo, la reconciliación del HPA y la disponibilidad de Pods. Una métrica actual y dos réplicas son observaciones, no prueba del historial de escalado.


  En la segunda etapa de la misión 130, un listener Gateway acepta conexiones y HTTPRoute selecciona un Service backend por host y puerto. Inspecciona `gateway.json`, `route.json` y la clase, URL y namespace del controlador fijados en `gateway-target.json`. Comprueba Accepted del Gateway y ResolvedRefs de la ruta, incluyendo parent y generación en sistemas reales; una condición puede estar obsoleta o referirse a otro parent.


  Una NetworkPolicy selecciona Pods destino. Un peer con namespaceSelector y podSelector selecciona Pods que cumplen ambos en ese namespace; peers separados serían alternativas. Compara la estructura exacta de una regla `board-ingress` de la misión con `ingress-policy.json` y prueba la URL fijada con Host permitido, Host cerrado y acceso directo del cliente. Una petición fallida puede tener varias causas, así que por sí sola no demuestra la causa. El adaptador desechable y sus relajaciones TLS privadas no son configuración de producción.


  Referencias: [HPA](https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/), [HTTPRoute](https://gateway-api.sigs.k8s.io/reference/api-types/httproute/), [NetworkPolicy](https://kubernetes.io/docs/reference/kubernetes-api/networking/network-policy-v1/).


  Inspecciona los recursos y el estado de las métricas:


  ```sh

  cd ~/quest

  kubectl get deployment board -o yaml

  kubectl get hpa board -o yaml

  kubectl top pods -l app=board

  ```


  En la segunda etapa de la misión 130 inspecciona ruta y política por separado:


  ```sh

  kubectl get gateway,httproute,networkpolicy -o yaml

  ```

  '
