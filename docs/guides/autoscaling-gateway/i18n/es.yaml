heading: Autoscalado y recuperación de gateway
text: |
  # Autoscalado y recuperación de gateway

  Autoscaling requiere destino de escala resoluble, denominador válido y trabajo real. La utilización CPU relaciona uso y solicitud; sin request no se calcula. Los recursos correctos no generan demanda. Inspecciona condiciones HPA, referencias, métricas Pod e interfaz suministrada. Observa finalizaciones reales además de réplicas; procesamiento sintético no es un SLO de producción.

  En la segunda etapa de la misión 130, un listener Gateway acepta conexiones y HTTPRoute selecciona un Service backend por host y puerto. Inspecciona `gateway.yaml`, `route.yaml` y la clase, URL y namespace del controlador fijados en `gateway-target.json`. Comprueba Accepted del Gateway y ResolvedRefs de la ruta, incluyendo parent y generación en sistemas reales; una condición puede estar obsoleta o referirse a otro parent.

  Una NetworkPolicy selecciona Pods destino. Un peer con namespaceSelector y podSelector selecciona Pods que cumplen ambos en ese namespace; peers separados serían alternativas. Compara la estructura exacta de una regla `board-ingress` de la misión con `ingress-policy.yaml` y prueba la URL fijada con Host permitido, Host cerrado y acceso directo del cliente. Una petición fallida puede tener varias causas, así que por sí sola no demuestra la causa. El adaptador desechable y sus relajaciones TLS privadas no son configuración de producción.

  Referencias: [HPA](https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/), [HTTPRoute](https://gateway-api.sigs.k8s.io/reference/api-types/httproute/), [NetworkPolicy](https://kubernetes.io/docs/reference/kubernetes-api/networking/network-policy-v1/).

  Inspecciona los recursos y el estado de las métricas:

  ```sh
  cd ~/quest
  kubectl get deployment board -o yaml
  kubectl get hpa board -o yaml
  kubectl top pods -l app=board
  ```

  En la segunda etapa de la misión 130 inspecciona ruta y política por separado:

  ```sh
  kubectl get gateway,httproute,networkpolicy -o yaml
  ```

  En el quest 113, vinculación con el listener y referencias al Service backend son decisiones independientes del controlador. Examina el parent solicitado en el contexto de listener conservado, controlador y generación actual de HTTPRoute. Accepted no implica ResolvedRefs; condiciones de otro parent o generación anterior no establecen salud actual. Conserva identidades y listeners y compara ambas condiciones con tráfico real de Host coincidente y cerrado.

  ```sh
  cd ~/quest
  cat gateway-target.json attachment-contract.json
  kubectl get gateway,httproute,service -o yaml
  ```
