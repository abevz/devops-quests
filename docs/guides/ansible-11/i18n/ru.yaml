heading: 11. Стратегии и поэтапное обновление (`serial`)
text: "## 11. Стратегии и поэтапное обновление (`serial`)\n\n**Коротко**\n- serial ограничивает размер партии хостов.\n- Сценарий проходит текущую партию до перехода к следующей.\n- Размер партии не равен числу рабочих процессов forks.\n\n**Короткий сценарий**\n\nЕсть 5 узлов. В сценарии задано `serial: 2`; все партии успешны.\n\n**Предскажи:** Сколько партий пройдёт сценарий и сколько узлов будет в последней?\n\n> [!question]- Ответ\n> Три партии: 2, 2 и 1 узел. Это расчёт разбиения списка, а не новый прогон обновления серверов.\n\n**`linear`**: все хосты текущей партии завершают задачу N перед задачей N+1.\n**`free`**: быстрый хост переходит дальше, не ожидая медленного. Порядок задач внутри одного хоста\nостаётся, но общего межхостового барьера нет. `free` непригодна, если шаг 2 требует завершённого шага 1\nна всех хостах. Не полагайтесь на `run_once` для синхронизации при `free`.\n\n**`serial`** — размер партии хостов, проходящей сценарий. **`forks`** — верхний предел параллельных рабочих процессов.\n**`throttle`** ограничивает конкретную задачу, блок или сценарий: полезно для API с ограничением частоты запросов.\nЭффективный параллелизм задачи не может превышать `forks` и число доступных хостов партии;\n`throttle` только уменьшает этот предел. `serial: 1` — один хост проходит сценарий, потом следующий.\n`serial: [1, 5, \"100%\"]` — сначала пробный хост, затем 5, затем оставшиеся хосты.\n*(по документации)* [Стратегии и партии хостов](https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_strategies.html).\n\n```mermaid\nflowchart TB\n    A[\"Партия: один хост\"] --> D[\"Предварительные задачи: отключить от трафика и дождаться\"]\n    D --> C[\"Задачи: обновить конфигурацию или версию\"]\n    C --> F[\"Выполнить обработчик\"]\n    F --> H[\"Проверить работоспособность нового процесса\"]\n    H --> E[\"Завершающие задачи: включить в балансировщике\"]\n    E --> N[\"Следующая партия\"]\n    H -->|\"сбой\"| S[\"Остановиться, восстановить явно, не возвращать нездоровый хост\"]\n```\n\n> [!info]- Глубже\n> | Маршрут | Что проверить |\n> |---|---|\n> | serial/стратегия | кто попал в партию и когда остановится следующая |\n> | delegation | кто исполняет и чьи переменные читает |\n> | async | кто запущен, где job ID и кто дождётся результата |\n> | reboot | кто вернулся после перезагрузки и прошёл health |\n>\n> Полные SSH-опыты и обновление ядра раскрываются по ссылкам соответствующих подзаголовков.\n>\n> > [!info] Ядро и справочник\n> > Ядро: стратегия/serial и отдельный опыт delegation до «Асинхронное выполнение». Async и обновление ядра — справочные маршруты; run_once разбирай вместе с границами партии.\n\n### `serial: 1` на двух SSH-хостах: успех и остановка после сбоя\n\nКраткий маршрут выше задаёт механизм и следующую проверку. Полный листинг и наблюдения: [[#Справочный рецепт — `serial: 1` на двух SSH-хостах: успех и остановка после сбоя|справочный рецепт]].\n\n### Справочный рецепт — `serial: 1` на двух SSH-хостах: успех и остановка после сбоя\n\n**Коротко**\n- При serial: 1 текущая партия содержит один узел.\n- Политика отказа определяет переход к следующим партиям.\n- Результат предыдущего SSH-опыта остаётся отдельным свидетельством.\n\n**Короткий сценарий**\n\nСписок содержит web1 и web2, `serial: 1`, `any_errors_fatal: true`. Задача изменения на web1 завершилась обычной ошибкой.\n\n**Предскажи:** Должна ли следующая партия автоматически начать изменение web2?\n\n> [!question]- Ответ\n> Нет. Заданный фатальный отказ останавливает дальнейший сценарий. Ниже сохранён прежний SSH-прогон; этот короткий сценарий — его логический разбор.\n\n*(проверено: прогон рецензента 06.10.2026, ansible-core 2.21.4, SSH к двум контейнерам debian:stable-slim)*\n\nОтдельный playbook рецензента использовал группу `web` из двух SSH-хостов (§18):\n\n**`rolling-ssh.yml` — пример для чтения: нужны два SSH-хоста из §18:**\n\n```yaml\n- name: Demonstrate rolling batches over SSH\n  hosts: web\n  gather_facts: false\n  serial: 1\n  max_fail_percentage: 0\n  tasks:\n    - name: Drain\n      ansible.builtin.debug:\n        msg: \"drain {{ inventory_hostname }}\"\n    - name: Deploy\n      ansible.builtin.command: \"{{ deploy_cmd | default('/bin/true') }}\"\n      changed_when: true\n    - name: Enable\n      ansible.builtin.debug:\n        msg: \"enable {{ inventory_hostname }}\"\n```\n\nПри обычном запуске заголовок play напечатан дважды — по одному разу на партию.\nПорядок сообщений и итоговая сводка (сокращённые фрагменты вывода):\n\n```text\ndrain web1 → changed: [web1] → enable web1\ndrain web2 → changed: [web2] → enable web2\nweb1 : ok=3 changed=1 … failed=0\nweb2 : ok=3 changed=1 … failed=0\n```\n\nПри запуске с `-e deploy_cmd=/bin/false`:\n\n```text\ndrain web1\nfatal: [web1]: FAILED! => {\"changed\": true, … \"cmd\": [\"/bin/false\"], …}\nNO MORE HOSTS LEFT\nweb1 : ok=1 changed=0 unreachable=0 failed=1\n```\n\nВ сводке есть **только `web1`**: вторая партия не началась, `web2` вообще не появился.\n`enable web1` тоже не выполнился. `changed: true` в результате упавшей задачи задан через\n`changed_when: true`; счётчик `changed=0` в сводке не считает этот сбой успешным изменением.\n\nПоэтапное обновление с таким порогом защищает **оставшиеся хосты** от продолжения неуспешного развёртывания.\nОно не откатывает и не возвращает в ротацию упавший хост: в модели примера `web1` остаётся drained.\nЗдесь `drain`/`enable` — только `debug`, реальный балансировщик не менялся. Если заменить их реальными\nоперациями, нужны явные компенсирующие действия через `block`/`rescue` или `always` (§9),\nс проверкой здоровья перед возвращением узла; нездоровый хост нельзя включать безусловно.\n\n### Предскажи: Сбой SSH-партии после drain\n\n**Предскажи:** Для playbook выше запущено `-e deploy_cmd=/bin/false`. Какие хосты появятся\nв итоговой сводке? Вернулся ли `web1` в ротацию?\n\n> [!question]- Ответ\n> В сводке только `web1`: `ok=1 changed=0 unreachable=0 failed=1`.\n> `web2` не появится: вторая партия не началась после превышения `max_fail_percentage: 0`.\n> `enable web1` не выполнился, поэтому в модели развёртывания он остаётся вне ротации.\n> Сам прогон использовал `debug` вместо API балансировщика и не менял реальную ротацию.\n> Автоматического отката нет; восстановление и безопасное включение нужно описать явно.\n\n### Делегирование и однократное выполнение (`delegate_to`, `run_once`)\n\n**Коротко**\n- delegate_to выбирает место выполнения задачи.\n- Исходный узел и узел выполнения могут иметь разные имена.\n- run_once ограничивает выполнение в текущей партии, а не обязательно во всём запуске.\n\n**Мини-пример:** в отдельном временном каталоге сохрани `mini.yml`; запуск — `ansible-playbook -i localhost, -c local mini.yml`. Пример работает на localhost без become.\n\n```yaml\n- hosts: localhost\n  connection: local\n  become: false\n  gather_facts: false\n  tasks:\n    - ansible.builtin.command: /usr/bin/printf delegated\n      delegate_to: localhost\n      changed_when: false\n      register: result\n    - ansible.builtin.debug:\n        msg: \"{{ inventory_hostname }}:{{ result.stdout }}\"\n```\n\n**Предскажи:** что покажет запуск и каким будет код завершения?\n\n> [!question]- Ответ\n> Код завершения: 0. Фрагменты stdout:\n>\n> ```text\n>     \"msg\": \"localhost:delegated\"\n> localhost                  : ok=2    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n\nДелегированная команда явно запускается на localhost, её результат доступен следующей задаче. Здесь исходный и принимающий узлы совпадают; разницу двух имён показывает полный опыт.\n\nПолная **безопасная имитация** `rolling.yml`; имена хостов должны быть в отдельном учебном inventory:\n\n**`rolling-inventory.ini` — отдельный inventory с группой `web_lab`:**\n\n```ini\n[web_lab]\nweb1 ansible_connection=local ansible_python_interpreter=/usr/bin/python\nweb2 ansible_connection=local ansible_python_interpreter=/usr/bin/python\n```\n\n**`rolling.yml`; запуск: `ansible-playbook -i rolling-inventory.ini rolling.yml`:**\n\n```yaml\n- name: Simulate rolling order\n  hosts: web_lab\n  connection: local\n  gather_facts: false\n  become: false\n  strategy: linear\n  serial: 1\n  max_fail_percentage: 0\n  pre_tasks:\n    - name: Simulate LB drain\n      ansible.builtin.debug:\n        msg: \"Drain {{ inventory_hostname }}\"\n      delegate_to: localhost\n  tasks:\n    - name: Write host-specific demo configuration\n      ansible.builtin.copy:\n        content: \"version=1\\n\"\n        dest: \"/tmp/ansible-visual-guide/{{ inventory_hostname }}.conf\"\n        mode: \"0644\"\n      notify: Reload simulation\n    - name: Reload before checking\n      ansible.builtin.meta: flush_handlers\n    - name: Check simulated health\n      ansible.builtin.command:\n        argv: [/usr/bin/true]\n      changed_when: false\n      register: health\n      until: health.rc == 0\n      retries: 2\n      delay: 0\n      throttle: 1\n  post_tasks:\n    - name: Simulate enabling in LB\n      ansible.builtin.debug:\n        msg: \"Enable {{ inventory_hostname }}\"\n      delegate_to: localhost\n  handlers:\n    - name: Reload simulation\n      ansible.builtin.debug:\n        msg: reload simulation\n```\n\n*(проверено)* Имитация прошла на двух локальных именах: сначала все шаги `web1`, затем `web2`;\nу каждого `ok=5 changed=1 failed=0`. Это проверка порядка `serial`, делегирования и сброса очереди обработчиков.\nПроверка синтаксиса проверяет структуру; условное отключение через `debug` и `/usr/bin/true` **не являются** балансировщиком и проверкой работоспособности.\nОбновление без простоя этим не доказано. Реальная схема требует API/модуля балансировщика, ожидания прекращения новых\nсоединений и завершения старых, достаточной ёмкости оставшейся группы, проверки адреса сервиса после перезапуска\nи подтверждения возвращения в пул. В `rescue` нельзя безусловно включать нездоровый хост обратно.\n`post_tasks` не замена `always`: хост с ошибкой может до них не дойти.\n\n`delegate_to: lb1` меняет **место выполнения задачи**: действие выполняет хост балансировщика,\nа `inventory_hostname` по-прежнему обозначает исходный обновляемый веб-хост.\nНастройки подключения и многие остальные переменные при делегировании берутся из хоста назначения;\nисходные значения безопаснее читать явно через `hostvars[inventory_hostname]`.\nРезультат `register` остаётся привязанным к исходному хосту. Для собранных фактов\n`delegate_facts: true` позволяет привязать их к хосту назначения.\n\nЕсли 20 веб-хостов делегируют запись одного файла на localhost, возможна гонка: делегирование не сериализует\nдоступ автоматически. Используйте `throttle: 1` или одну задачу с явным циклом, когда это нужно.\n`run_once: true` выполняет задачу один раз **в текущей партии** и распространяет результат и факты в партии.\nС `serial` это повторится для каждой партии. Для одного запуска на весь сценарий можно выбрать\n`when: inventory_hostname == ansible_play_hosts_all[0]`, но если первый хост упал или отфильтрован\nраньше нужного шага, задача не станет автоматически выполняться на другом. Для миграций надёжнее\nотдельный сценарий с явно выбранным исполнителем и внешней защитой от конкурентного запуска.\n*(по документации)* [Делегирование](https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_delegation.html).\n\n> [!info]- Глубже\n> Типичный сбой — HTTP-адрес сервиса не дал требуемый статус до конца повторов. Конкретный текст `uri`\n> зависит от статуса, тайм-аута и тела ответа. В стенде нет реального балансировщика или приложения, поэтому\n> такой сбой здесь не воспроизводили *(не проверено)*; лог не приводим. Проверять TCP-порт недостаточно (§8).\n> [Проверка статуса HTTP](https://docs.ansible.com/ansible/latest/collections/ansible/builtin/uri_module.html).\n\n### Два имени: кто исполняет, чьи переменные и кому принадлежит результат\n\nКраткий маршрут выше задаёт механизм и следующую проверку. Полный листинг и наблюдения: [[#Справочный рецепт — Два имени: кто исполняет, чьи переменные и кому принадлежит результат|справочный рецепт]].\n\n### Справочный рецепт — Два имени: кто исполняет, чьи переменные и кому принадлежит результат\n\n**Коротко**\n- При делегировании место исполнения может измениться.\n- register по умолчанию относится к исходному узлу.\n- Для проверки владения результатом нужно различать оба имени.\n\n**Мини-пример:** в отдельном временном каталоге сохрани `mini.yml`; запуск — `ansible-playbook -i localhost, -c local mini.yml`. Пример работает на localhost без become.\n\n```yaml\n- hosts: localhost\n  connection: local\n  become: false\n  gather_facts: false\n  tasks:\n    - ansible.builtin.command: /usr/bin/printf result\n      delegate_to: localhost\n      changed_when: false\n      register: result\n    - ansible.builtin.debug:\n        msg: \"{{ result.stdout }}\"\n```\n\n**Предскажи:** что покажет запуск и каким будет код завершения?\n\n> [!question]- Ответ\n> Код завершения: 0. Фрагменты stdout:\n>\n> ```text\n>     \"msg\": \"result\"\n> localhost                  : ok=2    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n\nЗарегистрированный результат доступен следующей задаче текущего хоста. Мини-пример использует один localhost; полный опыт далее отдельно проверяет два имени.\n\n**Один вопрос:** после `web1 → web2` где искать `register` и `set_fact`?\nДва inventory host ниже используют **один локальный компьютер**, без SSH и изменения его конфигурации.\nУ web1 намеренно несуществующий Python: делегированная задача должна использовать interpreter web2.\nВо втором play interpreter задаётся заново для проверки `serial` на обоих именах.\n\n**`inventory.ini`:**\n\n```ini\n[lab]\nweb1 ansible_connection=local ansible_host=127.0.0.11 role_label=web ansible_python_interpreter=/not-used/on-web1\nweb2 ansible_connection=local ansible_host=127.0.0.12 role_label=helper ansible_python_interpreter=/usr/bin/python3\n```\n\n**`delegation.yml`:**\n\n```yaml\n- name: Observe delegation\n  hosts: web1\n  gather_facts: false\n  become: false\n  tasks:\n    - name: Execute on web2, store the result on web1\n      ansible.builtin.command:\n        argv:\n          - /usr/bin/printf\n          - '%s\\n'\n          - 'owner={{ inventory_hostname }} arg_host={{ ansible_host }} delegate_host={{ hostvars.web2.ansible_host }} source={{ hostvars[inventory_hostname].role_label }}'\n      delegate_to: web2\n      register: probe\n      changed_when: false\n    - name: Attach a fact to the original host\n      ansible.builtin.set_fact:\n        original_fact: kept-on-web1\n      delegate_to: web2\n    - name: Attach a fact to the delegate\n      ansible.builtin.set_fact:\n        delegated_fact: kept-on-web2\n      delegate_to: web2\n      delegate_facts: true\n    - name: Show ownership\n      ansible.builtin.debug:\n        msg:\n          - '{{ probe.stdout }}'\n          - 'web1.register={{ hostvars.web1.probe is defined }} web2.register={{ hostvars.web2.probe is defined }}'\n          - 'web1.fact={{ hostvars.web1.original_fact }} web2.fact={{ hostvars.web2.delegated_fact }}'\n\n- name: Observe run_once per serial batch\n  hosts: lab\n  gather_facts: false\n  become: false\n  strategy: linear\n  serial: 1\n  vars:\n    ansible_python_interpreter: /usr/bin/python3\n  tasks:\n    - name: This action runs once in EACH batch\n      ansible.builtin.command:\n        argv: [/usr/bin/printf, '%s\\n', 'batch={{ inventory_hostname }}']\n      run_once: true\n      register: batch\n      changed_when: false\n    - ansible.builtin.debug:\n        var: batch.stdout\n```\n\n**Команды в новом временном каталоге с этими двумя файлами:**\n\n```bash\nprintf '[defaults]\\nretry_files_enabled = False\\n' > ansible.cfg\nANSIBLE_CONFIG=\"$PWD/ansible.cfg\" ANSIBLE_NOCOLOR=1   ansible-playbook -i inventory.ini delegation.yml\n```\n\n**Прогонялось локально**, ansible-core 2.21.5, код 0. Реальные строки вывода; служебные TASK/PLAY опущены:\n\n```text\n        \"owner=web1 arg_host=127.0.0.11 delegate_host=127.0.0.12 source=web\",\n        \"web1.register=True web2.register=False\",\n        \"web1.fact=kept-on-web1 web2.fact=kept-on-web2\"\n    \"batch.stdout\": \"batch=web1\"\n    \"batch.stdout\": \"batch=web2\"\n```\n\n| Что наблюдали | До задачи | После |\n|---|---|---|\n| Execution context | Task принадлежит web1 | command делегирован web2; используется его рабочий Python |\n| Аргументы модуля | Значения ещё шаблонизируются | `inventory_hostname=web1`; явные hostvars отделяют source и delegate |\n| `register: probe` | У обоих отсутствует | `hostvars.web1.probe` есть, у web2 его нет |\n| `set_fact` без delegate_facts | Факт отсутствует | `original_fact` у web1 |\n| `delegate_facts: true` | Факт отсутствует | `delegated_fact` у web2 |\n| run_once + serial: 1 | Две партии | Два исполнения: batch=web1 и batch=web2 |\n\nНеожиданная деталь: `ansible_host`, вставленный **в argv command**, в этом прогоне равен адресу web1.\nЕго нельзя использовать как доказательство места исполнения. Настройки connection/become/interpreter\nшаблонизируются для delegate; для аргументов явно выбирай `hostvars[inventory_hostname]` либо `hostvars.web2`.\nВсе действия здесь локальные: адреса `127.0.0.11/12` — метки inventory, соединений к ним нет.\n[Контекст delegation и delegate_facts](https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_delegation.html).\n\n**Граница:** опыт доказывает ownership и границы партий, а не два физических исполнителя, SSH-доступ\nили безопасную запись общего файла. `run_once` не является распределённой блокировкой.\n**Предскажи:** если убрать delegate_facts у второго set_fact, где появится delegated_fact?\n\n> [!info]- Глубже\n> > [!question]- Ответ\n> > У исходного web1. Делегирование исполнения само по себе не меняет владельца факта.\n>\n> **Коротко по-английски:** Delegation changes the execution context. Registered results still belong to the original host;\n> delegate_facts controls fact ownership, and run_once applies to the current serial batch.\n\n### Асинхронное выполнение: долгий процесс и ожидание результата (`async`)\n\n**Коротко**\n- async задаёт срок фоновой задачи.\n- poll: 0 возвращает управление до её завершения.\n- Идентификатор задания нужен для последующей проверки результата.\n\n**Короткий сценарий**\n\nЗадача запущена с `async: 30`, `poll: 0`. Первый ответ содержит job ID, но проверка конечного результата ещё не выполнена.\n\n**Предскажи:** Можно ли уже объявить прикладную операцию успешной?\n\n> [!question]- Ответ\n> Нет. Получение job ID подтверждает запуск механизма ожидания, а конечный результат надо получить отдельно через async_status. Полный запускаемый рецепт сохранён дальше.\n\nПолный `async.yml`:\n\n```yaml\n- name: Launch and join an async job\n  hosts: lab\n  connection: local\n  gather_facts: false\n  become: false\n  vars:\n    ansible_async_dir: /tmp/ansible-visual-guide/async\n  tasks:\n    - name: Launch harmless wait\n      ansible.builtin.command:\n        argv: [/usr/bin/sleep, \"1\"]\n      async: 10\n      poll: 0\n      register: job\n      changed_when: false\n    - name: Wait for completion\n      ansible.builtin.async_status:\n        jid: \"{{ job.ansible_job_id }}\"\n      register: done\n      until: done.finished\n      retries: 5\n      delay: 1\n      changed_when: false\n    - name: Remove status file\n      ansible.builtin.async_status:\n        jid: \"{{ job.ansible_job_id }}\"\n        mode: cleanup\n      changed_when: false\n```\n\nОбычная задача держит рабочий процесс, пока команда не завершилась. `async: 10` задаёт предельное время выполнения в секундах;\n`poll: 0` запускает задание и сразу отдаёт управление. Управляющий узел получает идентификатор задания, обёртка на управляемом узле записывает\nстатус в каталог асинхронных заданий. Это **не** завершённый результат приложения. При `poll: 2` управляющий узел сам\nпроверяет статус с интервалом и ожидает завершения задачи прежде, чем идти дальше.\n\n*(проверено)* `ansible-core` 2.21.4: все 3 задачи завершились, `ok=3 changed=0 failed=0`.\n`started`/`finished` с `ansible-core` 2.19 — логические значения, ранее встречались целые числа 0/1.\nПри `poll: 0` файл состояния нужно убрать явно; `mode: cleanup` не убивает процесс.\nНе запускайте установку пакетов без ожидания результата, если следующая задача тоже требует блокировку менеджера пакетов.\nАсинхронное выполнение не поддерживает полноценную симуляцию запуска в режиме проверки.\n*(по документации)* [Асинхронное выполнение](https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_async.html),\n[`async_status`](https://docs.ansible.com/ansible/latest/collections/ansible/builtin/async_status_module.html).\n\n### Предскажи 10: Ошибка в партии из одного хоста\n\n**Коротко**\n- serial ограничивает партию, но сам по себе не задаёт политику отказа.\n- Обычный fail исключает хост из последующих обычных задач.\n- Перед реальным обновлением проверь остановку на маленьком стенде.\n\n**Мини-пример:** в отдельном временном каталоге сохрани `mini.yml`; запуск — `ansible-playbook -i localhost, -c local mini.yml`. Пример работает на localhost без become.\n\n```yaml\n- hosts: localhost\n  connection: local\n  become: false\n  gather_facts: false\n  tasks:\n    - ansible.builtin.fail:\n        msg: batch stopped\n    - ansible.builtin.debug:\n        msg: must not run\n```\n\n**Предскажи:** Выполнится ли вторая задача на том же хосте?\n\n> [!question]- Ответ\n> Код завершения: 2. Фрагменты stdout:\n>\n> ```text\n> localhost                  : ok=0    changed=0    unreachable=0    failed=1    skipped=0    rescued=0    ignored=0\n> ```\n\nПосле отказа обычная следующая задача этого хоста не выполняется. Работа с несколькими партиями остаётся в исходном полном упражнении.\n\n**`predict-10.yml` (имя любое); inventory — `rolling-inventory.ini` с группой `web_lab` из примера выше:**\n\n```yaml\n- hosts: web_lab\n  connection: local\n  gather_facts: false\n  become: false\n  serial: 1\n  max_fail_percentage: 50\n  tasks:\n  - name: Start\n    ansible.builtin.debug:\n      msg: start\n  - name: Fail first host\n    ansible.builtin.fail:\n      msg: intentional\n    when: inventory_hostname == 'web1'\n  - name: End\n    ansible.builtin.debug:\n      msg: end\n```\n\n**Предскажи:** Inventory содержит `web1`, затем `web2`, оба с локальным подключением. Начнёт ли `web2` выполнение, и каковы сводки двух запусков?\n\n> [!question]- Ответ\n> ```text\n> # Первый запуск; код завершения 2\n> web1                       : ok=1    changed=0    unreachable=0    failed=1    skipped=0    rescued=0    ignored=0\n> # Второй запуск; код завершения 2\n> web1                       : ok=1    changed=0    unreachable=0    failed=1    skipped=0    rescued=0    ignored=0\n> ```\n> В партии из одного хоста один сбой даёт 100%, что превышает порог 50%. `web2` не начинает сценарий и потому отсутствует в сводке.\n\nВопрос: **How would you roll out a change without taking all servers down?**\n\n> I would update a small batch at a time with `serial`. I would drain each server from the load\n> balancer, update it, run the required handler, and check the new process before enabling traffic.\n> This also needs enough capacity in the remaining servers and an explicit recovery plan.\n\n### Обновление ядра на парке ВМ\n\nКраткий маршрут выше задаёт механизм и следующую проверку. Полный листинг и наблюдения: [[#Справочный рецепт — Обновление ядра на парке ВМ|справочный рецепт]].\n\n### Справочный рецепт — Обновление ядра на парке ВМ\n\n**Коротко**\n- Перезагрузка — отдельная операция внутри поэтапного обновления.\n- Возврат SSH ещё не доказывает готовность приложения.\n- Следующую партию выпускают после выбранных проверок текущей.\n\n**Короткий сценарий**\n\nПосле обновления ядра SSH снова доступен. Проверка сервиса всё ещё не проходит.\n\n**Предскажи:** Можно ли переходить к следующей партии только по доступности SSH?\n\n> [!question]- Ответ\n> Нет, если договор требует восстановленного сервиса. Сначала нужно пройти эту проверку или остановить обновление. Перезагрузка и установка пакетов здесь не выполнялись.\n\nДобавлено 08.10.2026 — вопрос технического интервью DSV: «тысяча ВМ, нужно обновить ядро с минимальным простоем».\nЭто тот же `serial`, только задача — пакет ядра и перезагрузка.\n\n**`kernel-patch.yml` — пример для чтения; inventory с группой `app_servers` из 200 хостов:**\n\n```yaml\n- name: Patch the kernel in rolling batches\n  hosts: app_servers\n  become: true\n  gather_facts: false\n  serial:\n    - 1\n    - \"10%\"\n    - \"25%\"\n  max_fail_percentage: 0\n  pre_tasks:\n    - name: Take the host out of the load balancer\n      ansible.builtin.debug:\n        msg: \"Drain {{ inventory_hostname }}\"\n      delegate_to: localhost\n      become: false\n  tasks:\n    - name: Install the latest kernel package\n      ansible.builtin.dnf:\n        name: kernel\n        state: latest\n      register: kernel_update\n    - name: Reboot only when the kernel changed\n      ansible.builtin.reboot:\n        reboot_timeout: 600\n      when: kernel_update.changed\n    - name: Read the running kernel\n      ansible.builtin.command:\n        argv: [/usr/bin/uname, -r]\n      register: running_kernel\n      changed_when: false\n    - name: Wait until the service answers\n      ansible.builtin.uri:\n        url: \"http://{{ inventory_hostname }}:8080/healthz\"\n        status_code: 200\n      register: health\n      until: health.status == 200\n      retries: 10\n      delay: 6\n      delegate_to: localhost\n      become: false\n  post_tasks:\n    - name: Put the host back into the load balancer\n      ansible.builtin.debug:\n        msg: \"Enable {{ inventory_hostname }} on kernel {{ running_kernel.stdout }}\"\n      delegate_to: localhost\n      become: false\n```\n\n*(08.10.2026, ansible-core 2.21.4: `--syntax-check` прошёл, `--list-hosts` показал 200 хостов. Сам сценарий **не запускался**:\nнужны реальные ВМ и перезагрузка. Задачи `debug` — заглушки вместо вызова балансировщика.)*\n\nЧто здесь делает каждая часть:\n\n| Строка | Зачем |\n|---|---|\n| `serial: [1, \"10%\", \"25%\"]` | сначала одна ВМ (canary), потом 20, дальше по 50. На 200 хостах партии: 1, 20, 50, 50, 50, 29 |\n| `max_fail_percentage: 0` | один сбой в партии останавливает всё; остальные ВМ остаются на старом ядре и работают |\n| `pre_tasks` и `post_tasks` | вывести ВМ из балансировщика до обновления и вернуть после проверки |\n| `when: kernel_update.changed` | не перезагружать ВМ, на которой ядро уже новое — повторный запуск безопасен |\n| `ansible.builtin.reboot` | перезагружает и сам ждёт, пока SSH снова ответит |\n| `uri` с `until` | проверяет сервис, а не только то, что ВМ включилась |\n\nТри вещи, которых в сценарии нет, а в ответе они нужны:\n\n> [!info]- Глубже\n> - **`forks`.** По умолчанию Ansible работает с пятью хостами одновременно. Партия из 50 при `forks = 5` пойдёт пятёрками.\n>   Для окна в 30 минут нужен запуск с `-f 50`.\n> - **Реплики одного сервиса не должны попасть в одну партию.** Иначе сервис ляжет целиком, хотя ВМ перезагружаются по\n>   частям. Решение — отдельная группа inventory на каждую «половину» сервиса или запуск по зонам.\n> - **Узлы Kubernetes** перед перезагрузкой освобождают: `kubectl drain`, после — `kubectl uncordon`.\n>\n> Два других способа, которые стоит назвать:\n>\n> | Способ | Когда |\n> |---|---|\n> | Замена вместо обновления: новый образ ВМ (Packer), новые ВМ поднимаются, старые удаляются | облако и узлы Kubernetes; по словам Михала на интервью, в DSV так меняют образы узлов, обычно по понедельникам |\n> | Live patching (`kpatch` в RHEL, Canonical Livepatch) — исправление в работающее ядро без перезагрузки | срочные исправления безопасности; новую версию ядра так не поставить |\n>\n> Вопрос: **How would you upgrade the kernel on a thousand VMs with minimal downtime?**\n>\n> > I would do a rolling update with Ansible. First one canary host, then small batches with `serial`.\n> > For each host: take it out of the load balancer, install the kernel, reboot, check the service, put it back.\n> > Replicas of one service must not be in the same batch. If a reboot is not acceptable, I would use live patching\n> > for security fixes, or replace the VMs with a new image.\n\n### После reboot доступна только часть inventory\n\n**Модель частичного отказа, без перезагрузки этой машины.** В партии `web01/web02` первый вернулся, второй не прошёл reconnect за таймаут. Третий `web03` ещё не начинал обновление. Сохранить факты по каждому хосту: drain, пакет, boot ID/ядро, reconnect, HTTP health, возврат в балансировщик. Один итоговый `failed=1` не отвечает, какой шаг уже изменил хост.\n\n| Хост | Наблюдение | Следующее действие |\n|---|---|---|\n| web01 | новое ядро, health успешен | вернуть трафик только после проверки |\n| web02 | timeout reconnect, health неизвестен | оставить без трафика, выяснить доступность через разрешённый канал |\n| web03 | обновление не начиналось | остановить дальнейшие партии до решения причины |\n\n`reboot` ждёт перезагрузки и успешной тестовой команды; это ещё не проверка приложения. `rescue` не ловит unreachable, а удалённый из активного выполнения host не станет автоматически исправным от `ignore_errors`. [reboot](https://docs.ansible.com/ansible/latest/collections/ansible/builtin/reboot_module.html), [error handling](https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_error_handling.html). Для нового допуска нужно повторить connect + kernel + health; повторный запуск ограничить явно выбранными хостами, сохранив защиту партии. Для `max_fail_percentage` порог должен быть **превышен**, и процент считается по текущей партии. [serial и max_fail_percentage](https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_strategies.html)."
