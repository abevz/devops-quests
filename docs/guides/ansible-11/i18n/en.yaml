heading: 11. Strategies and staged updates (`serial`)
text: "## 11. Strategies and staged updates (`serial`)\n\n**At a glance**\n- serial limits the size of a host batch.\n- The playbook processes the current batch before moving to the next.\n- Batch size does not equal the number of worker processes set by forks.\n\n**Short scenario**\n\nThere are 5 hosts. The playbook sets `serial: 2`; all batches succeed.\n\n**Predict:** How many batches will the playbook process, and how many hosts will be in the last?\n\n> [!question]- Answer\n> Three batches: 2, 2 and 1 host. This calculates a list partition; it is not a new server update run.\n\n**`linear`**: every host in the current batch finishes task N before task N+1.\n**`free`**: a fast host advances without waiting for a slow one. Task order within one host\nremains, but there is no common cross-host barrier. `free` is unsuitable if step 2 requires step 1 to finish\non every host. Do not rely on `run_once` for synchronization with `free`.\n\n**`serial`** is the host batch size for the play. **`forks`** caps parallel worker processes.\n**`throttle`** limits a specific task, block or play: useful for APIs with request rate limits.\nEffective task parallelism cannot exceed `forks` or the number of available hosts in the batch;\n`throttle` can only reduce that ceiling. With `serial: 1`, one host completes the play, then the next starts.\n`serial: [1, 5, \"100%\"]` means one canary host, then five, then all remaining hosts.\n*(according to documentation)* [Strategies and host batches](https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_strategies.html).\n\n```mermaid\nflowchart TB\n    A[\"Batch: one host\"] --> D[\"Pre-tasks: remove from traffic and wait\"]\n    D --> C[\"Tasks: update configuration or version\"]\n    C --> F[\"Run the handler\"]\n    F --> H[\"Verify the new process is healthy\"]\n    H --> E[\"Post-tasks: return to the load balancer\"]\n    E --> N[\"Next batch\"]\n    H -->|\"failure\"| S[\"Stop, recover explicitly, keep the unhealthy host out of traffic\"]\n```\n\n> [!info]- Deeper explanation\n> | Route | What to check |\n> |---|---|\n> | serial/strategy | which hosts entered the batch and when the next batch stops |\n> | delegation | who executes and whose variables are read |\n> | async | what started, where the job ID is, and who waits for the result |\n> | reboot | who returned after reboot and passed health checks |\n>\n> Complete SSH experiments and kernel updates are linked from their respective subsections.\n>\n> > [!info] Core and reference\n> > Core: strategy/serial and the separate delegation experiment up to “Asynchronous execution”. Async and kernel updates are reference routes; study run_once together with batch boundaries.\n\n### `serial: 1` on two SSH hosts: success and stopping after failure\n\nThe short route above explains the mechanism and next check. Full listing and observations: [[#Справочный рецепт — `serial: 1` на двух SSH-хостах: успех и остановка после сбоя|reference recipe]].\n\n### Reference recipe — `serial: 1` on two SSH hosts: success and stopping after failure\n\n**At a glance**\n- With serial: 1, the current batch contains one host.\n- Failure policy governs progression to later batches.\n- The earlier SSH experiment remains separate evidence.\n\n**Short scenario**\n\nThe list contains web1 and web2, with `serial: 1`, `any_errors_fatal: true`. The change task on web1 ended in a normal error.\n\n**Predict:** Should the next batch automatically start changing web2?\n\n> [!question]- Answer\n> No. The specified fatal failure stops the rest of the playbook. The earlier SSH run is retained below; this short scenario analyzes its logic.\n\n*(verified: reviewer's run on 06.10.2026, ansible-core 2.21.4, SSH to two debian:stable-slim containers)*\n\nA separate review playbook used the `web` group with two SSH hosts (§18):\n\n**`rolling-ssh.yml` — reading example: requires the two SSH hosts from §18:**\n\n```yaml\n- name: Demonstrate rolling batches over SSH\n  hosts: web\n  gather_facts: false\n  serial: 1\n  max_fail_percentage: 0\n  tasks:\n    - name: Drain\n      ansible.builtin.debug:\n        msg: \"drain {{ inventory_hostname }}\"\n    - name: Deploy\n      ansible.builtin.command: \"{{ deploy_cmd | default('/bin/true') }}\"\n      changed_when: true\n    - name: Enable\n      ansible.builtin.debug:\n        msg: \"enable {{ inventory_hostname }}\"\n```\n\nIn a normal run, the play heading appears twice: once per batch.\nMessage order and final summary (shortened output excerpts):\n\n```text\ndrain web1 → changed: [web1] → enable web1\ndrain web2 → changed: [web2] → enable web2\nweb1 : ok=3 changed=1 … failed=0\nweb2 : ok=3 changed=1 … failed=0\n```\n\nWhen run with `-e deploy_cmd=/bin/false`:\n\n```text\ndrain web1\nfatal: [web1]: FAILED! => {\"changed\": true, … \"cmd\": [\"/bin/false\"], …}\nNO MORE HOSTS LEFT\nweb1 : ok=1 changed=0 unreachable=0 failed=1\n```\n\nThe summary contains **only `web1`**: the second batch did not start, and `web2` never appeared.\n`enable web1` did not run either. The failed task's `changed: true` result is set through\n`changed_when: true`; the summary's `changed=0` counter does not count this failure as a successful change.\n\nA rolling update with this threshold protects the **remaining hosts** from continuing a failed deployment.\nIt neither rolls back nor returns the failed host to rotation: in this example's model, `web1` remains drained.\nHere `drain`/`enable` are only `debug`; no real load balancer was changed. Replacing them with real\noperations requires explicit compensating actions through `block`/`rescue` or `always` (§9),\nwith a health check before returning the host; an unhealthy host must not be enabled unconditionally.\n\n### Predict: an SSH batch fails after drain\n\n**Predict:** the playbook above runs with `-e deploy_cmd=/bin/false`. Which hosts appear\nin the recap? Has `web1` returned to rotation?\n\n> [!question]- Answer\n> Only `web1` appears: `ok=1 changed=0 unreachable=0 failed=1`.\n> `web2` is absent: the second batch never starts after exceeding `max_fail_percentage: 0`.\n> `enable web1` did not execute, so the deployment model leaves it out of rotation.\n> The run used `debug` instead of a load balancer API and did not change real traffic rotation.\n> There is no automatic rollback; explicitly define recovery and safe re-enablement.\n\n### Delegation and one-time execution (`delegate_to`, `run_once`)\n\n**At a glance**\n- delegate_to selects where a task executes.\n- The original host and execution host can have different names.\n- run_once limits execution within the current batch, not necessarily the entire run.\n\n**Mini-example:** save `mini.yml` in a separate temporary directory; run `ansible-playbook -i localhost, -c local mini.yml`. The example runs on localhost without become.\n\n```yaml\n- hosts: localhost\n  connection: local\n  become: false\n  gather_facts: false\n  tasks:\n    - ansible.builtin.command: /usr/bin/printf delegated\n      delegate_to: localhost\n      changed_when: false\n      register: result\n    - ansible.builtin.debug:\n        msg: \"{{ inventory_hostname }}:{{ result.stdout }}\"\n```\n\n**Predict:** What will the run show, and what will its exit code be?\n\n> [!question]- Answer\n> Run 1; exit code 0. Stdout excerpts:\n>\n> ```text\n>     \"msg\": \"localhost:delegated\"\n> localhost                  : ok=2    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n>\n> Run 2; exit code 0. Stdout excerpts:\n>\n> ```text\n>     \"msg\": \"localhost:delegated\"\n> localhost                  : ok=2    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n\nThe delegated command explicitly runs on localhost, and the next task can access its result. Here the original and receiving hosts coincide; the full experiment demonstrates the difference between two names.\n\nComplete **safe simulation** `rolling.yml`; host names must belong to a separate exercise inventory:\n\n**`rolling-inventory.ini`: a separate inventory with group `web_lab`:**\n\n```ini\n[web_lab]\nweb1 ansible_connection=local ansible_python_interpreter=/usr/bin/python\nweb2 ansible_connection=local ansible_python_interpreter=/usr/bin/python\n```\n\n**`rolling.yml`; run `ansible-playbook -i rolling-inventory.ini rolling.yml`:**\n\n```yaml\n- name: Simulate rolling order\n  hosts: web_lab\n  connection: local\n  gather_facts: false\n  become: false\n  strategy: linear\n  serial: 1\n  max_fail_percentage: 0\n  pre_tasks:\n    - name: Simulate LB drain\n      ansible.builtin.debug:\n        msg: \"Drain {{ inventory_hostname }}\"\n      delegate_to: localhost\n  tasks:\n    - name: Write host-specific demo configuration\n      ansible.builtin.copy:\n        content: \"version=1\\n\"\n        dest: \"/tmp/ansible-visual-guide/{{ inventory_hostname }}.conf\"\n        mode: \"0644\"\n      notify: Reload simulation\n    - name: Reload before checking\n      ansible.builtin.meta: flush_handlers\n    - name: Check simulated health\n      ansible.builtin.command:\n        argv: [/usr/bin/true]\n      changed_when: false\n      register: health\n      until: health.rc == 0\n      retries: 2\n      delay: 0\n      throttle: 1\n  post_tasks:\n    - name: Simulate enabling in LB\n      ansible.builtin.debug:\n        msg: \"Enable {{ inventory_hostname }}\"\n      delegate_to: localhost\n  handlers:\n    - name: Reload simulation\n      ansible.builtin.debug:\n        msg: reload simulation\n```\n\n*(verified)* The simulation ran on two local names: all `web1` steps first, then `web2`;\neach had `ok=5 changed=1 failed=0`. This checks `serial` ordering, delegation and handler flushing.\nA syntax check validates structure; simulated disabling through `debug` and `/usr/bin/true` **are not** a load balancer or health check.\nThis does not prove zero-downtime updates. A real design needs a load balancer API/module, waiting for new\nconnections to stop and existing ones to drain, sufficient remaining-group capacity, a service-address health check after restart,\nand confirmation of pool re-entry. A `rescue` block must not unconditionally re-enable an unhealthy host.\n`post_tasks` is not a substitute for `always`: a failed host may never reach it.\n\n`delegate_to: lb1` changes **where a task executes**: the load balancer host performs the action,\nwhile `inventory_hostname` still names the original web host being updated.\nConnection settings and many other variables come from the delegated host;\nread original host values explicitly through `hostvars[inventory_hostname]` to avoid ambiguity.\nA `register` result remains associated with the original host. For gathered facts,\n`delegate_facts: true` associates them with the delegated host.\n\nIf 20 web hosts delegate writes to one localhost file, races are possible: delegation does not serialize\naccess automatically. Use `throttle: 1` or one explicitly looped task when necessary.\n`run_once: true` executes once **per current batch** and distributes its result and facts within that batch.\nWith `serial`, this repeats for each batch. To run once for the entire play, one option is\n`when: inventory_hostname == ansible_play_hosts_all[0]`, but if that first host fails or is filtered\nbefore the step, another host does not automatically take over. For migrations, a separate play\nwith an explicitly selected executor and external concurrency protection is more reliable.\n*(according to documentation)* [Delegation](https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_delegation.html).\n\n> [!info]- Deeper explanation\n> A typical failure is a service HTTP address not returning the required status before retries are exhausted. The exact `uri`\n> message depends on status, timeout and response body. This lab has no real load balancer or application, so\n> that failure was not reproduced *(not verified)*; no fabricated log is shown. Checking a TCP port is insufficient (§8).\n> [HTTP status checks](https://docs.ansible.com/ansible/latest/collections/ansible/builtin/uri_module.html).\n\n### Two names: executor, variable source and result owner\n\nThe short route above explains the mechanism and next check. Full listing and observations: [[#Справочный рецепт — Два имени: кто исполняет, чьи переменные и кому принадлежит результат|reference recipe]].\n\n### Reference recipe — Two names: execution host, variable context and result ownership\n\n**At a glance**\n- Delegation can change where execution takes place.\n- register belongs to the original host by default.\n- Distinguish both names to verify result ownership.\n\n**Mini-example:** save `mini.yml` in a separate temporary directory; run `ansible-playbook -i localhost, -c local mini.yml`. The example runs on localhost without become.\n\n```yaml\n- hosts: localhost\n  connection: local\n  become: false\n  gather_facts: false\n  tasks:\n    - ansible.builtin.command: /usr/bin/printf result\n      delegate_to: localhost\n      changed_when: false\n      register: result\n    - ansible.builtin.debug:\n        msg: \"{{ result.stdout }}\"\n```\n\n**Predict:** What will the run show, and what will its exit code be?\n\n> [!question]- Answer\n> Run 1; exit code 0. Stdout excerpts:\n>\n> ```text\n>     \"msg\": \"result\"\n> localhost                  : ok=2    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n>\n> Run 2; exit code 0. Stdout excerpts:\n>\n> ```text\n>     \"msg\": \"result\"\n> localhost                  : ok=2    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n\nThe registered result is available to the current host's next task. The mini-example uses one localhost; the full experiment below separately checks two names.\n\n**One question:** after `web1 → web2`, where should you look for `register` and `set_fact`?\nThe two inventory hosts below use **one local computer**, without SSH or changes to its configuration.\nweb1 deliberately has a nonexistent Python interpreter: the delegated task must use web2's interpreter.\nThe second play sets the interpreter again to test `serial` with both names.\n\n**`inventory.ini`:**\n\n```ini\n[lab]\nweb1 ansible_connection=local ansible_host=127.0.0.11 role_label=web ansible_python_interpreter=/not-used/on-web1\nweb2 ansible_connection=local ansible_host=127.0.0.12 role_label=helper ansible_python_interpreter=/usr/bin/python3\n```\n\n**`delegation.yml`:**\n\n```yaml\n- name: Observe delegation\n  hosts: web1\n  gather_facts: false\n  become: false\n  tasks:\n    - name: Execute on web2, store the result on web1\n      ansible.builtin.command:\n        argv:\n          - /usr/bin/printf\n          - '%s\\n'\n          - 'owner={{ inventory_hostname }} arg_host={{ ansible_host }} delegate_host={{ hostvars.web2.ansible_host }} source={{ hostvars[inventory_hostname].role_label }}'\n      delegate_to: web2\n      register: probe\n      changed_when: false\n    - name: Attach a fact to the original host\n      ansible.builtin.set_fact:\n        original_fact: kept-on-web1\n      delegate_to: web2\n    - name: Attach a fact to the delegate\n      ansible.builtin.set_fact:\n        delegated_fact: kept-on-web2\n      delegate_to: web2\n      delegate_facts: true\n    - name: Show ownership\n      ansible.builtin.debug:\n        msg:\n          - '{{ probe.stdout }}'\n          - 'web1.register={{ hostvars.web1.probe is defined }} web2.register={{ hostvars.web2.probe is defined }}'\n          - 'web1.fact={{ hostvars.web1.original_fact }} web2.fact={{ hostvars.web2.delegated_fact }}'\n\n- name: Observe run_once per serial batch\n  hosts: lab\n  gather_facts: false\n  become: false\n  strategy: linear\n  serial: 1\n  vars:\n    ansible_python_interpreter: /usr/bin/python3\n  tasks:\n    - name: This action runs once in EACH batch\n      ansible.builtin.command:\n        argv: [/usr/bin/printf, '%s\\n', 'batch={{ inventory_hostname }}']\n      run_once: true\n      register: batch\n      changed_when: false\n    - ansible.builtin.debug:\n        var: batch.stdout\n```\n\n**Commands in a new temporary directory containing these two files:**\n\n```bash\nprintf '[defaults]\\nretry_files_enabled = False\\n' > ansible.cfg\nANSIBLE_CONFIG=\"$PWD/ansible.cfg\" ANSIBLE_NOCOLOR=1   ansible-playbook -i inventory.ini delegation.yml\n```\n\n**Executed locally**, ansible-core 2.21.5, exit code 0. Actual output lines; administrative TASK/PLAY lines omitted:\n\n```text\n        \"owner=web1 arg_host=127.0.0.11 delegate_host=127.0.0.12 source=web\",\n        \"web1.register=True web2.register=False\",\n        \"web1.fact=kept-on-web1 web2.fact=kept-on-web2\"\n    \"batch.stdout\": \"batch=web1\"\n    \"batch.stdout\": \"batch=web2\"\n```\n\n| Observation | Before the task | After |\n|---|---|---|\n| Execution context | Task belongs to web1 | command is delegated to web2; its working Python is used |\n| Module arguments | Values are still being templated | `inventory_hostname=web1`; explicit hostvars distinguish source and delegate |\n| `register: probe` | Absent on both | `hostvars.web1.probe` exists, but web2 has none |\n| `set_fact` without delegate_facts | Fact absent | `original_fact` on web1 |\n| `delegate_facts: true` | Fact absent | `delegated_fact` on web2 |\n| run_once + serial: 1 | Two batches | Two executions: batch=web1 and batch=web2 |\n\nA surprising detail: `ansible_host` inserted **into command argv** equals web1's address in this run.\nIt cannot serve as proof of execution location. Connection/become/interpreter settings\nare templated for the delegate; explicitly choose `hostvars[inventory_hostname]` or `hostvars.web2` for arguments.\nAll actions here are local: addresses `127.0.0.11/12` are inventory labels; no connections are made to them.\n[Delegation context and delegate_facts](https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_delegation.html).\n\n**Boundary:** the experiment proves ownership and batch boundaries, not two physical execution machines, SSH access\nor safe writes to a shared file. `run_once` is not a distributed lock.\n**Predict:** if delegate_facts is removed from the second set_fact, where will delegated_fact appear?\n\n> [!info]- Deeper explanation\n> > [!question]- Answer\n> > On the original web1. Delegating execution does not by itself change fact ownership.\n>\n> **Briefly in English:** Delegation changes the execution context. Registered results still belong to the original host;\n> delegate_facts controls fact ownership, and run_once applies to the current serial batch.\n\n### Asynchronous execution: a long process and waiting for its result (`async`)\n\n**At a glance**\n- async sets a time limit for a background task.\n- poll: 0 returns control before completion.\n- The job identifier is needed to check the result later.\n\n**Short scenario**\n\nThe task starts with `async: 30`, `poll: 0`. The first response contains a job ID, but the final result has not been checked yet.\n\n**Predict:** Can the application operation already be declared successful?\n\n> [!question]- Answer\n> No. Receiving a job ID confirms that the waiting mechanism started; obtain the final result separately through async_status. The full runnable recipe is retained below.\n\nComplete `async.yml`:\n\n```yaml\n- name: Launch and join an async job\n  hosts: lab\n  connection: local\n  gather_facts: false\n  become: false\n  vars:\n    ansible_async_dir: /tmp/ansible-visual-guide/async\n  tasks:\n    - name: Launch harmless wait\n      ansible.builtin.command:\n        argv: [/usr/bin/sleep, \"1\"]\n      async: 10\n      poll: 0\n      register: job\n      changed_when: false\n    - name: Wait for completion\n      ansible.builtin.async_status:\n        jid: \"{{ job.ansible_job_id }}\"\n      register: done\n      until: done.finished\n      retries: 5\n      delay: 1\n      changed_when: false\n    - name: Remove status file\n      ansible.builtin.async_status:\n        jid: \"{{ job.ansible_job_id }}\"\n        mode: cleanup\n      changed_when: false\n```\n\nAn ordinary task occupies a worker until the command finishes. `async: 10` sets the execution time limit in seconds;\n`poll: 0` starts a job and immediately returns control. The controller receives a job ID; a wrapper on the managed node writes\nstatus into the async job directory. This is **not** a completed application result. With `poll: 2`, the controller itself\nchecks status periodically and waits for the task to finish before advancing.\n\n*(verified)* `ansible-core` 2.21.4: all three tasks completed, `ok=3 changed=0 failed=0`.\nSince `ansible-core` 2.19, `started`/`finished` are booleans; earlier versions also used integers 0/1.\nWith `poll: 0`, remove the status file explicitly; `mode: cleanup` does not kill the process.\nDo not launch package installation without waiting if the next task also needs the package manager lock.\nAsync does not provide a full launch simulation in check mode.\n*(according to documentation)* [Asynchronous execution](https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_async.html),\n[`async_status`](https://docs.ansible.com/ansible/latest/collections/ansible/builtin/async_status_module.html).\n\n### Predict 10: failure in a one-host batch\n\n**At a glance**\n- serial limits a batch but does not itself define failure policy.\n- A normal fail excludes the host from subsequent ordinary tasks.\n- Before a real update, test stopping on a small environment.\n\n**Mini-example:** save `mini.yml` in a separate temporary directory; run `ansible-playbook -i localhost, -c local mini.yml`. The example runs on localhost without become.\n\n```yaml\n- hosts: localhost\n  connection: local\n  become: false\n  gather_facts: false\n  tasks:\n    - ansible.builtin.fail:\n        msg: batch stopped\n    - ansible.builtin.debug:\n        msg: must not run\n```\n\n**Predict:** Will the second task execute on the same host?\n\n> [!question]- Answer\n> Run 1; exit code 2. Stdout excerpts:\n>\n> ```text\n> localhost                  : ok=0    changed=0    unreachable=0    failed=1    skipped=0    rescued=0    ignored=0\n> ```\n>\n> Run 2; exit code 2. Stdout excerpts:\n>\n> ```text\n> localhost                  : ok=0    changed=0    unreachable=0    failed=1    skipped=0    rescued=0    ignored=0\n> ```\n\nAfter a failure, that host's next ordinary task does not run. Working with multiple batches remains in the original full exercise.\n\n**`predict-10.yml` (any filename); inventory is `rolling-inventory.ini` with group `web_lab` above:**\n\n```yaml\n- hosts: web_lab\n  connection: local\n  gather_facts: false\n  become: false\n  serial: 1\n  max_fail_percentage: 50\n  tasks:\n  - name: Start\n    ansible.builtin.debug:\n      msg: start\n  - name: Fail first host\n    ansible.builtin.fail:\n      msg: intentional\n    when: inventory_hostname == 'web1'\n  - name: End\n    ansible.builtin.debug:\n      msg: end\n```\n\n**Predict:** inventory lists `web1`, then `web2`, both with local connections. Will `web2` start, and what are the two recaps?\n\n> [!question]- Answer\n> ```text\n> # Первый запуск; код завершения 2\n> web1                       : ok=1    changed=0    unreachable=0    failed=1    skipped=0    rescued=0    ignored=0\n> # Второй запуск; код завершения 2\n> web1                       : ok=1    changed=0    unreachable=0    failed=1    skipped=0    rescued=0    ignored=0\n> ```\n> One failure in a one-host batch is 100%, exceeding the 50% threshold. `web2` never starts the play and is absent from the recap.\n\nQuestion: **How would you roll out a change without taking all servers down?**\n\n> I would update a small batch at a time with `serial`. I would drain each server from the load\n> balancer, update it, run the required handler, and check the new process before enabling traffic.\n> This also needs enough capacity in the remaining servers and an explicit recovery plan.\n\n### Kernel updates across a VM fleet\n\nThe short route above explains the mechanism and next check. Full listing and observations: [[#Справочный рецепт — Обновление ядра на парке ВМ|reference recipe]].\n\n### Reference recipe — Updating the kernel across a VM fleet\n\n**At a glance**\n- Rebooting is a separate operation within a rolling update.\n- SSH returning does not prove application readiness.\n- Release the next batch after the chosen checks pass for the current one.\n\n**Short scenario**\n\nAfter the kernel update, SSH is available again. The service check still fails.\n\n**Predict:** Can you proceed to the next batch solely because SSH is available?\n\n> [!question]- Answer\n> No, if the contract requires a restored service. First pass that check or stop the update. No reboots or package installations were performed here.\n\nAdded 08.10.2026 — DSV technical interview question: “a thousand VMs; update their kernels with minimal downtime”.\nThis uses the same `serial`, but the task is a kernel package update and reboot.\n\n**`kernel-patch.yml` — reading example; inventory with an `app_servers` group of 200 hosts:**\n\n```yaml\n- name: Patch the kernel in rolling batches\n  hosts: app_servers\n  become: true\n  gather_facts: false\n  serial:\n    - 1\n    - \"10%\"\n    - \"25%\"\n  max_fail_percentage: 0\n  pre_tasks:\n    - name: Take the host out of the load balancer\n      ansible.builtin.debug:\n        msg: \"Drain {{ inventory_hostname }}\"\n      delegate_to: localhost\n      become: false\n  tasks:\n    - name: Install the latest kernel package\n      ansible.builtin.dnf:\n        name: kernel\n        state: latest\n      register: kernel_update\n    - name: Reboot only when the kernel changed\n      ansible.builtin.reboot:\n        reboot_timeout: 600\n      when: kernel_update.changed\n    - name: Read the running kernel\n      ansible.builtin.command:\n        argv: [/usr/bin/uname, -r]\n      register: running_kernel\n      changed_when: false\n    - name: Wait until the service answers\n      ansible.builtin.uri:\n        url: \"http://{{ inventory_hostname }}:8080/healthz\"\n        status_code: 200\n      register: health\n      until: health.status == 200\n      retries: 10\n      delay: 6\n      delegate_to: localhost\n      become: false\n  post_tasks:\n    - name: Put the host back into the load balancer\n      ansible.builtin.debug:\n        msg: \"Enable {{ inventory_hostname }} on kernel {{ running_kernel.stdout }}\"\n      delegate_to: localhost\n      become: false\n```\n\n*(08.10.2026, ansible-core 2.21.4: `--syntax-check` passed, and `--list-hosts` showed 200 hosts. The playbook itself **was not run**:\nit requires real VMs and reboots. The `debug` tasks are placeholders for load balancer calls.)*\n\nWhat each part does:\n\n| Line | Purpose |\n|---|---|\n| `serial: [1, \"10%\", \"25%\"]` | one VM first (canary), then 20, then batches of 50. With 200 hosts: 1, 20, 50, 50, 50, 29 |\n| `max_fail_percentage: 0` | one failure in a batch stops everything; other VMs remain on the old kernel and keep running |\n| `pre_tasks` and `post_tasks` | remove the VM from the load balancer before updating and return it after verification |\n| `when: kernel_update.changed` | do not reboot a VM whose kernel is already current; rerunning is safe |\n| `ansible.builtin.reboot` | reboots and waits for SSH to respond again |\n| `uri` with `until` | checks the service, not just whether the VM has powered on |\n\nThree things absent from the playbook but required in the answer:\n\n> [!info]- Deeper explanation\n> - **`forks`.** Ansible works on five hosts concurrently by default. With `forks = 5`, a batch of 50 proceeds five at a time.\n>   A 30-minute window requires a run with `-f 50`.\n> - **Replicas of one service must not all fall into the same batch.** Otherwise the entire service goes down even though VMs reboot in\n>   stages. Use a separate inventory group for each “half” of the service or run by zone.\n> - **Kubernetes nodes** must be drained before reboot with `kubectl drain`, then returned with `kubectl uncordon`.\n>\n> Two other approaches worth mentioning:\n>\n> | Approach | When to use it |\n> |---|---|\n> | Replace instead of upgrade: build a new VM image (Packer), bring up new VMs, then remove the old ones | Cloud and Kubernetes nodes; according to Michal in the interview, DSV replaces node images this way, usually on Mondays |\n> | Live patching (`kpatch` on RHEL, Canonical Livepatch) — patch the running kernel without a reboot | Urgent security fixes; this cannot install a new kernel version |\n>\n> Question: **How would you upgrade the kernel on a thousand VMs with minimal downtime?**\n>\n> > I would do a rolling update with Ansible. First one canary host, then small batches with `serial`.\n> > For each host: take it out of the load balancer, install the kernel, reboot, check the service, put it back.\n> > Replicas of one service must not be in the same batch. If a reboot is not acceptable, I would use live patching\n> > for security fixes, or replace the VMs with a new image.\n\n### Only part of inventory returns after reboot\n\n**Partial-failure model, without rebooting this machine.** In batch `web01/web02`, the first host returned while the second timed out reconnecting. Third host `web03` has not started its update. Preserve per-host evidence: drain, package, boot ID/kernel, reconnect, HTTP health, return to load balancer. A single final `failed=1` does not identify which step already changed the host.\n\n| Host | Observation | Next action |\n|---|---|---|\n| web01 | new kernel, healthy | restore traffic only after checking |\n| web02 | reconnect timeout, health unknown | keep traffic disabled; investigate access through an authorized channel |\n| web03 | update has not started | stop subsequent batches until the cause is resolved |\n\n`reboot` waits for reboot and a successful test command; that is not yet an application check. `rescue` does not catch unreachable, and a host removed from active execution does not automatically become healthy through `ignore_errors`. [reboot](https://docs.ansible.com/ansible/latest/collections/ansible/builtin/reboot_module.html), [error handling](https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_error_handling.html). Re-entry requires connect + kernel + health checks; restrict retries to explicitly selected hosts while retaining batch protection. `max_fail_percentage` must be **exceeded**, and its percentage is calculated for the current batch. [serial and max_fail_percentage](https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_strategies.html).\n"
