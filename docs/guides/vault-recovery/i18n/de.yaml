heading: Vault-Wiederherstellung und KV-v2
text: "# Vault-Wiederherstellung und KV-v2\n\nVault-Verfügbarkeit, Versiegelung, Berechtigung und übernommene Anwendungsdaten\
  \ sind getrennte Grenzen. Diese Beispiele gelten nur für die kurzlebige Spielumgebung. Ein initialisierter versiegelter\
  \ Server besitzt bereits Speicher und Schlüssel; erneute Initialisierung ist keine Wiederherstellung. Vergleichen\
  \ Sie die ursprüngliche Clusteridentität. Hier läuft ein einzelner Datei-Backend; die Übungen belegen weder HA\
  \ noch Snapshot-Notfallwiederherstellung.\n\n## Vor Änderungen beobachten\nDie Status-API meldet Initialisierung,\
  \ Versiegelung und Quorum. Eine Startquittung belegt Agentenaktivität, keine dauerhafte Anwendungsgesundheit.\
  \ Die Steuerung beschreibt das Umgebungsmanual. Synthetische Schlüsselanteile bleiben privat. Anteile, Tokens\
  \ oder geheime Antworten niemals ausgeben. Wählen Sie für dieses allgemeine Beispiel selbst die erlaubte Anteilsdatei\
  \ und erreichbare Vault-Adresse:\n\n```bash\n(\n set -euo pipefail\n umask 077\n : \"${VAULT_ADDR:?select the\
  \ authorized Vault address}\"\n : \"${RECOVERY_SHARES:?select the authorized recovery JSON file}\"\n request=$(mktemp)\n\
  \ trap 'rm -f \"$request\"' EXIT\n count=$(jq -er 'length' \"$RECOVERY_SHARES\")\n for ((i=0; i<count; i++));\
  \ do\n  jq -n --argjson i \"$i\" --slurpfile shares \"$RECOVERY_SHARES\" '{key:$shares[0][$i]}' > \"$request\"\
  \n  curl -fsS --max-time 3 -X PUT -H 'Content-Type: application/json' --data-binary @\"$request\" \"$VAULT_ADDR/v1/sys/unseal\"\
  \ >/dev/null\n done\n curl -fsS --max-time 3 \"$VAULT_ADDR/v1/sys/seal-status\" | jq '{initialized,sealed,t,n,cluster_id}'\n\
  )\n```\n\n## KV-API und Berechtigung\nDer KV-v2-API-Pfad enthält unter dem Mount eine data-Komponente; der logische\
  \ CLI-Pfad unterscheidet sich. Vergleichen Sie die tatsächliche Anwendungsanfrage mit der vorgesehenen Quelle\
  \ und prüfen Sie effektive Reader-Rechte. Ein Manager zum Ändern einer einzelnen Policy ist nicht automatisch\
  \ Datenleser; bei Wiederherstellung kann ihm jegliche Policy-Änderung fehlen. Keine Rechte für einen erfolgreichen\
  \ Verbraucher erweitern. Vor dem allgemeinen privaten Abruf API-Pfad und bestehende Identität auswählen:\n\n```bash\n\
  (\n set -euo pipefail\n umask 077\n : \"${VAULT_ADDR:?select the authorized Vault address}\"\n : \"${KV_API_PATH:?select\
  \ the intended KV API path}\"\n : \"${READER_TOKEN_FILE:?select the private existing reader credential file}\"\
  \n header=$(mktemp)\n trap 'rm -f \"$header\"' EXIT\n printf 'X-Vault-Token: %s\\n' \"$(cat \"$READER_TOKEN_FILE\"\
  )\" > \"$header\"\n curl -fsS --max-time 3 -H @\"$header\" \"$VAULT_ADDR/v1/$KV_API_PATH\" | jq -e '.data.metadata.version\
  \ > 0' >/dev/null\n echo OK\n)\n```\n\n## Konstruktion und Weitergabe\nEin Synchronisationsarbeitsbereich wie\
  \ sync-secret.sh ist kein kontinuierlicher Controller und kann nur ein Gerüst enthalten. Konstruieren Sie die\
  \ Übertragung über Quell- und Ziel-API. Ein aktualisiertes Kubernetes Secret ändert keine bestehenden Prozessumgebungen.\
  \ Ursprünglichen Controller, Pod-Programm und Quellenreferenz bewahren; nach dem Rollout jeden aktiven zugehörigen\
  \ Pod prüfen.\n\nEine Cache-Anwendung aktualisiert sich möglicherweise beim Start oder durch ein Signal. Eine\
  \ gesunde Quelle beweist keine Übernahme durch Verbraucher. Vergleichen Sie Quellenidentität, private Zugangsdaten,\
  \ Version und Publikationshash an jeder Grenze. Verbraucher aktualisieren sich unabhängig: zuerst Upstream reparieren,\
  \ dann Downstream übernehmen lassen. Ursprüngliche Prozessidentitäten und Rechte bewahren, statt die Anwendung\
  \ zu ersetzen. Diese allgemeine Statusprüfung repariert und aktualisiert nichts:\n\n```bash\n(\n set -euo pipefail\n\
  \ : \"${APPLICATION_URL:?select the existing application base URL}\"\n curl -fsS --max-time 3 \"$APPLICATION_URL/status\"\
  \ | jq '{ready,error,status,source,path,version,value_sha256}'\n)\n```\n\n## Audit-Zuordnung\nAudit-Anfragen und\
  \ Antworten werden über request.id verbunden. Operation und Pfad mit der ursprünglichen Anwendungsbeobachtung\
  \ vergleichen: zwei Ablehnungen können unterschiedliche Ursachen haben. Nur request_id, path, operation und reason\
  \ exportieren. Rohe Authentifizierung und Geheimnisse gehören nicht in Vorfallsdateien. Ablehnung vor Policy-Änderung\
  \ aufzeichnen; danach erlaubten Zugriff, negative Berechtigungen und übernommene Publikation getrennt prüfen.\n\
  \nAPI: [Audit-Schema](https://developer.hashicorp.com/vault/docs/audit/schema), [unseal](https://developer.hashicorp.com/vault/api-docs/system/unseal),\
  \ [KV-v2 lesen](https://developer.hashicorp.com/vault/api-docs/secret/kv/kv-v2#read-secret-version).\n\n## Leases,\
  \ Rotation und kombinierte Übertragung\n\nEin abgelaufener Token kann sich nicht selbst verlängern. Verlängerung\
  \ einer gültigen erneuerbaren Lease und Ausstellung eines Ersatzes über eine begrenzte Rolle unterscheiden. Effektive\
  \ TTL, Erneuerbarkeit und Rollengrenzen ohne Ausgabe von Zugangsdaten vergleichen. Ablehnung des widerrufenen\
  \ Tokens und erfolgreicher Ersatzabruf belegen unterschiedliche Grenzen; beide sowie Übernahme durch Verbraucher\
  \ prüfen. Zugangsdaten gehören weder in Git noch in Publikationsmetadaten.\n\nController-Gesundheit belegt in\
  \ einer Übertragungskette weder Quellenberechtigung noch Verbraucherübernahme. Quellenabgleich, privater Image-Zugriff,\
  \ Secret-Übertragung und Anwendungsantwort getrennt prüfen. Aufgaben 044, 048, 070, 099 und 100 behandeln diese\
  \ Konzepte bei Policies, Erneuerung, Rotation und abgeglichener Übertragung; vorgesehene Pfade und Grenzen aus\
  \ ihren Verträgen ableiten.\n\n\n### Gespeicherte Richtlinie lesen {#vault-policy-observation}\n\nDer Manager konnte rail-reader nicht lesen; dem Token fehlt möglicherweise der Richtlinienzugriff, Vault ist nicht erreichbar oder die API-Antwort enthält keine lesbare Richtlinie. Verwenden Sie die Manageridentität für sys/policies/acl/rail-reader. Ein Lesefehler kann auch policy_scope auslösen, weil keine lesbare Richtlinie vorliegt; stellen Sie zuerst den Zugriff wieder her.\n\n### Ein KV-v2-Datenpfad {#vault-policy-scope}\n\nDie gespeicherte Richtlinie ist unlesbar oder nicht auf read für secret/data/dispatch beschränkt; der falsche Anfangspfad, zusätzliche Rechte, Platzhalter oder eine nicht unterstützte Struktur sind möglicherweise noch vorhanden. Das gelieferte apply-policy.sh lädt reader.hcl hoch; eine lokale Dateiänderung allein ändert Vault nicht. Die gewünschte Regel lautet path \"secret/data/dispatch\" { capabilities = [\"read\"] }. HCL-Kommentare und wiederholte identische read-Blöcke sind erlaubt; JSON verlangt nur diesen Pfad und read, erlaubt bekannte Parameter-/Wrapping-Beschränkungen, aber keine doppelten Schlüssel.\n\n### Eingaben der Vault-Prüfung {#vault-inputs}\n\nDie Richtlinienprüfung endete vor den Detailbeobachtungen; platform.env, Token-/Adressvariablen, temporäre Headerdateien oder Prüfwerkzeuge sind möglicherweise nicht verfügbar. Die Lese- oder Capability-Prüfung konnte Eingaben oder Bereinigung nicht abschließen; platform.env, Vault-Variablen, temporäre Header oder die Anfragedatei sind möglicherweise nicht verfügbar. Arbeiten Sie in ~/quest und laden Sie platform.env, ohne Tokens auszugeben. Headerdateien sind privat und werden beim Verlassen entfernt. Prüfen Sie vor der ACL-Analyse Schreibrechte im Verzeichnis und den Start der Werkzeuge.\n\n### Mit der Leseridentität prüfen {#vault-reader-value}\n\nDer Leser erhielt nicht north-secret; die Richtlinie verweist möglicherweise noch auf secret/data/wrong, das Token ist ungültig oder die KV-v2-Antwort ist nicht verfügbar beziehungsweise geändert. KV-v2-Lesezugriffe verwenden /v1/secret/data/dispatch und liefern .data.data.value. Managerzugriff ersetzt keine erfolgreiche Anfrage mit VAULT_READER_TOKEN.\n\n### Effektive erlaubte und verweigerte Zugriffe {#vault-effective-access}\n\nDie Leser-Capability für dispatch ist nicht genau read oder nicht beobachtbar; ein falscher Richtlinienpfad, zusätzliche Token-Richtlinien oder eine fehlgeschlagene capabilities-self-Anfrage können die Ursache sein. Der Leser meldete nicht ausschließlich deny für secret/data/wrong oder die Antwort ist unlesbar; der anfängliche falsche Pfad, breite oder zusätzliche Token-Richtlinien oder ein API-Fehler können die Ursache sein. Fragen Sie /v1/sys/capabilities-self mit dem Lesertoken für dispatch, wrong, other und sys/mounts ab. Gefordert sind genau [read] für secret/data/dispatch und [deny] für die übrigen drei; eine fehlgeschlagene oder fehlerhafte Antwort lässt jeden Pfad scheitern. Ein Platzhalter oder eine weitere Token-Richtlinie kann trotz erfolgreichem Lesen Zusatzrechte belassen.\n\n\n### Private Rechte der Tokendatei {#renewal-token-file}\n\nstation-token fehlt, ist unlesbar oder hat nicht Modus 0600; Speichern oder Neuerstellen ohne private Rechte kann den Zugang offenlegen. `stat -c %a station-token`.\n\n### Lease-Dauer und Verlängerungsgrenzen {#renewal-token-lease}\n\nDie station-token-Lease erfüllt TTL >90, renewable=true, max TTL 600 und den geforderten Richtliniensatz nicht oder lookup schlug fehl; die anfänglichen 45 Sekunden oder eine Verlängerung um 10 Sekunden reichen nicht. Eine unlesbare Datei platform.env oder unlesbare Token-Eingaben sowie ein fehlgeschlagener curl/jq-Start können die Beobachtung ebenfalls verhindern. Die gemeinsame Plattform erstellt station-token vor dem Quest-Setup mit Modus 0600 und einer anfänglichen verlängerbaren Lease von 45 Sekunden, begrenzt auf 600. issue-token.sh fordert 60 Sekunden an, renew-request.json anfangs 10. Stellen Sie über die gelieferte Rolle ein gültiges Token aus, fordern Sie genügend Verlängerung an und prüfen Sie TTL oberhalb von 90. Die Richtlinien müssen genau default und rail-reader sein; eine JSON-Änderung allein verlängert kein abgelaufenes Token.\n\n### Effektive Token-Capabilities {#renewal-token-access}\n\nstation-token meldete nicht genau read für dispatch und deny für andere Daten sowie Mount-Verwaltung; falsche Richtlinien, ein ungültiges oder abgelaufenes Token, unlesbare Eingaben oder eine API-Fehlantwort können die Ursache sein. Eine unlesbare Datei platform.env oder unlesbare Token-Eingaben sowie ein fehlgeschlagener curl/jq-Start können die Beobachtung ebenfalls verhindern. Die Capability-Anfragedatei muss beschreibbar sein. Fragen Sie mit station-token secret/data/dispatch, secret/data/other und sys/mounts ab; gefordert sind genau [read], [deny] und [deny]. Ein erfolgreicher Manager-Vorgang belegt diese Rechte für station-token nicht.\n\n### Beschränkte Ausstellerrolle {#renewal-issuer-access}\n\nDer Aussteller meldete nicht ausschließlich update für auth/token/create/rail-station und deny für Richtlinienänderungen sowie andere Ausstellungen; Manager-Token oder Umgebung sind möglicherweise falsch, überprivilegiert oder nicht verfügbar. Eine unlesbare Datei platform.env oder unlesbare Token-Eingaben sowie ein fehlgeschlagener curl/jq-Start können die Beobachtung ebenfalls verhindern. Für VAULT_MANAGER_TOKEN gelten [update] nur auf auth/token/create/rail-station und [deny] auf sys/policies/acl/rail-reader sowie auth/token/create/other. Dieses Setup nutzt beschränkte Ausstellung statt des Richtlinieneditors aus 044; Anfrage-JSON muss beschreibbar und die API-Antwort lesbar sein.\n\n### Secret-Verbraucher ohne Vault-Tokens {#renewal-secret-consumer}\n\nDeployment reader mit Secret-Daten konnte nicht ohne Vault-Token-Offenlegung bestätigt werden; ROUTE-Referenz, aktuelle Pods, aktualisierte Secret-Daten, Tokens im Manifest beziehungsweise in der Umgebung oder Prüfeingaben sind möglicherweise falsch oder nicht verfügbar. Der letzte effektive ROUTE-Eintrag in worker muss route-secret/value ohne nicht leeren Literalwert verwenden. Das Deployment-JSON darf keine Token-Zeichenketten aus station-token, Manager oder ursprünglichem Leser enthalten. Aktuelle, weder beendete noch zur Löschung markierte Pods müssen über steuernde ReplicaSets zur Deployment-UID gehören; jeder Running und env jedes regulären Containers ohne diese Tokens. worker muss north-secret aus /tmp/route lesen. sync-secret.sh liest station-token und aktualisiert nur Secret-Daten; starten Sie den Verbraucher neu, da bestehende Umgebungen nicht automatisch aktualisiert werden. Fehlende Umgebungs-/Token-Eingaben, ungültiges API-JSON, fehlendes Python oder Werkzeuge und exec-Fehler führen ebenfalls zu dieser Diagnose.\n\n### Bereitschaft nach Secret-Abgleich {#renewal-consumer-readiness}\n\nDeployment reader hat den Rollout nicht innerhalb von 3 Sekunden abgeschlossen; route-secret fehlt möglicherweise oder die Anwendung startet noch, auch Beobachtung beziehungsweise Plattform-Eingaben können fehlschlagen. `kubectl describe pods; kubectl rollout status deployment/reader --timeout=10s`.\n\n\n### Vorhandenen initialisierten Speicher wiederherstellen {#sealed-existing-initialized-store}\n\nDer Status bestätigte initialized=true nicht; die Adresse kann auf leeren/ersetzten Speicher zeigen oder die Statusantwort ist unerreichbar beziehungsweise ungültig. Der gelieferte Vault war bereits initialisiert.  `source platform.env; curl -fsS --max-time 3 \"$VAULT_ADDR/v1/sys/seal-status\" | jq '{initialized}'`.\n\n### Verschiedene Anteile ermöglichen unseal {#sealed-distinct-unseal-progress}\n\nDer Status bestätigte sealed=false nicht; möglicherweise wurden weniger als zwei verschiedene gelieferte Anteile eingereicht, derselbe Anteil wiederholt oder die Statusabfrage schlug fehl.  `source platform.env; curl -fsS --max-time 3 \"$VAULT_ADDR/v1/sys/seal-status\" | jq '{sealed,progress,t}'`.\n\n### Ursprüngliche Schwelle erhalten {#sealed-original-recovery-threshold}\n\nDer Status bestätigte t=2 nicht; geänderte Initialisierung/rekey, ein anderer Endpoint oder eine unlesbare Antwort können die ursprüngliche Wiederherstellungsschwelle verdecken.  `source platform.env; curl -fsS --max-time 3 \"$VAULT_ADDR/v1/sys/seal-status\" | jq '{t,n}'`.\n\n### Initialisierte Anzahl der Anteile erhalten {#sealed-original-share-count}\n\nDer Status bestätigte n=3 nicht; eine andere Initialisierung/rekey, falscher Endpoint oder fehlgeschlagene Beobachtung kann von der ursprünglichen Gesamtzahl der Anteile abweichen.  `source platform.env; curl -fsS --max-time 3 \"$VAULT_ADDR/v1/sys/seal-status\" | jq '{t,n}'`.\n\n### Ursprüngliche Clusteridentität und Beobachtung {#sealed-original-cluster-identity}\n\nDie ursprüngliche Vault-Clusteridentität wurde nicht bestätigt; Neuinitialisierung/Speicheraustausch ändert die cluster ID, während fehlende geschützte Belege, ein unerreichbarer ursprünglicher Endpoint oder Prüfstartfehler den Vergleich verhindern. Die Statusfelder verwenden die Adresse aus platform.env; die separate Identitätsbeobachtung kontaktiert die geschützte Quelle aus consumer-contract.json und vergleicht cluster_id mit original-cluster-id. Erhalten Sie den vorhandenen dateibasierten Speicher und das ursprüngliche Quorum. Ein neu initialisierter Server mit gleicher Schwelle ist weiterhin ein anderer Cluster. `source platform.env; curl -fsS --max-time 3 \"$VAULT_ADDR/v1/sys/seal-status\" | jq '{cluster_id}'; cat original-cluster-id`.\n\n### Private Rechte der Wiederherstellungsdatei {#sealed-private-share-permissions}\n\nunseal-shares.json meldete nicht Modus 600 oder konnte nicht geprüft werden; Kopieren/Neuerstellen mit weitergehenden oder Ausführungsrechten kann die gelieferten Anteile offenlegen.  `stat -c %a unseal-shares.json`.\n\n### Array-Struktur der Wiederherstellungsdatei {#sealed-share-array-shape}\n\nunseal-shares.json ist kein lesbares JSON-Array; eine vollständige Initialisierungsantwort, ein einzelner roher Anteil oder fehlerhaftes JSON kann die gelieferte Array-Struktur ersetzen.  `jq -e 'type==\"array\"' unseal-shares.json`.\n\n### Genau zwei erhaltene Anteile {#sealed-two-retained-shares}\n\nDas Wiederherstellungsarray enthält nicht genau zwei Einträge oder ist nicht lesbar; alle drei initialisierten Anteile zu kopieren, einen zu verlieren oder die Dateistruktur zu ändern kann den Dateivertrag verletzen. Der ursprüngliche Server wurde mit drei Anteilen und Schwelle zwei initialisiert, diese Wiederherstellungsdatei enthält jedoch nur die zwei gelieferten Anteile. Lokale Prüfungen bewerten Struktur und verschiedene Strings; sie vergleichen nicht jeden String kryptografisch mit Server-Schlüsselmaterial. `jq -e 'type==\"array\" and length==2' unseal-shares.json`.\n\n### Anteile als Strings {#sealed-string-share-entries}\n\nDie Wiederherstellungseinträge sind nicht sämtlich JSON-Strings oder das Array ist unlesbar; Zahlen, Objekte oder falsch verpackte Initialisierungsergebnisse erhalten die gelieferte String-Darstellung nicht.  `jq -e 'type==\"array\" and all(.[];type==\"string\")' unseal-shares.json`.\n\n### Zwei verschiedene Dateieinträge {#sealed-distinct-share-file}\n\nDie zwei Wiederherstellungseinträge sind nicht verschieden oder das Array ist ungültig; das Duplizieren eines gelieferten Anteils liefert keine zwei unterschiedlichen Beiträge zum unseal.  `jq -e 'type==\"array\" and length==2 and .[0]!=.[1]' unseal-shares.json`.\n\n### Mit gelieferter reader Identität lesen {#sealed-approved-reader-api}\n\nDer gelieferte reader las north-secret nicht unter secret/data/dispatch; Vault kann noch sealed sein, Umgebung/Token/Pfad von der gelieferten Quelle abweichen oder die API-/JSON-Beobachtung fehlschlagen. Die gelieferte reader Policy erlaubt bereits den KV-v2-API-Pfad secret/data/dispatch. Die separate manager Identität hat in dieser Übung keinen Datenzugriff darauf. Prüfen Sie unseal der ursprünglichen Quelle und verwenden Sie reader; ein erfolgreicher direkter Lesezugriff aktualisiert den Anwendungscache nicht. `source platform.env; curl -fsS --max-time 3 -H @<(printf 'X-Vault-Token: %s\\n' \"$VAULT_READER_TOKEN\") \"$VAULT_ADDR/v1/secret/data/dispatch\" | jq -e '.data.data.value==\"north-secret\"'`.\n\n### Zugangsdaten und Cache des ursprünglichen Verbrauchers {#sealed-original-consumer-adoption}\n\nDer ursprüngliche Verbraucher bestätigte die Vault-Publikation nicht mit der privaten reader Identität; seine Datei kann noch die gelieferten manager Zugangsdaten oder sein Cache einen alten Fehler enthalten, während geänderter Prozess/Programm/Konfiguration, Token-Aufbewahrung oder fehlende Beobachtung dies ebenfalls erklären. Die gelieferte Anwendung startet bei sealed Vault und token_file enthält anfangs manager. Sie liest Konfiguration beim Start oder SIGHUP; Anfragen aktualisieren den Cache nicht. Korrigieren Sie die Konfiguration mit genau url/path/token_file sowie die referenzierte reguläre reader Datei mit UID 1000, Modus 0600 und geschütztem Fingerprint; relative und absolute Pfade sind erlaubt. Senden Sie danach SIGHUP an die vorhandene PID unter Erhalt von Prozessidentität, Programm und Privilegien. Die Antwort behält Vault-Quelle/Pfad, Publikations-SHA-256, ganzzahlige Version 1 und ready=true. `cat consumer/source.json consumer/README.md; curl -fsS --max-time 3 http://127.0.0.1:18081/status`.\n\n\n### Ursache und Beobachtung (070, secret_value) {#secret-vault-to-kubernetes-publication}\n\nAllein die Vault-Policy zu korrigieren liefert den Wert nicht nach Kubernetes; das gelieferte sync-secret.sh muss route-secret/value lesen und veröffentlichen. Die erste Phase korrigiert den Application Pfad; die zweite korrigiert die gelieferte reader Policy und veröffentlicht Secret mit dem vollständigen sync-secret.sh Adapter. Eine korrekte Policy allein erzeugt kein Kubernetes-Objekt. Beobachten Sie aus ~/quest nach Laden von platform.env.\n\n```bash\nkubectl get secret route-secret -o json | jq '(.data.value | @base64d)==\"north-secret\"'\n```\n\n### Ursache und Beobachtung (070, secret_capabilities) {#secret-reader-exact-path-capabilities}\n\nDie gelieferte reader Policy zeigt auf den falschen KV-v2-Pfad oder gewährt zusätzliche Rechte; erforderlich sind read auf secret/data/dispatch und deny auf secret/data/unrelated sowie sys/mounts. Die erste Phase korrigiert den Application Pfad; die zweite korrigiert die gelieferte reader Policy und veröffentlicht Secret mit dem vollständigen sync-secret.sh Adapter. Eine korrekte Policy allein erzeugt kein Kubernetes-Objekt. Beobachten Sie aus ~/quest nach Laden von platform.env.\n\n```bash\ncurl -fsS -H \"X-Vault-Token: $VAULT_READER_TOKEN\" -H \"Content-Type: application/json\" --request POST --data '{\"paths\":[\"secret/data/dispatch\",\"secret/data/unrelated\",\"sys/mounts\"]}' \"$VAULT_ADDR/v1/sys/capabilities-self\"\n```\n\n\n### Zwei Ablehnungen und vier Exportfelder {#audit-correlate-two-denied-paths}\n\nDer ursprüngliche Incident oder beide Consumer-Incidents lassen möglicherweise Felder aus, ergänzen Daten oder entsprechen einer anderen Ablehnung; korrelieren Sie exakte Vier-Feld-Datensätze aus eingefrorenen Exporten für beide KV-Pfade. Die ursprüngliche Ablehnung betrifft secret/data/dispatch; die gelieferte Anwendung fragt secret/dispatch mit vorhandenem reader ab. Korrigieren Sie die enge Live-Policy und den Anwendungspfad, dann aktualisieren Sie den ursprünglichen Prozess-Cache. Exporte enthalten nur request_id, path, operation und reason. `jq '.[] | {request_id,path,operation,reason}' /run/dq/facts/0/consumer-audit.json`.\n\n### Enge KV-v2 reader Policy {#audit-narrow-kv-v2-reader-policy}\n\nDie gelieferte reader Policy zeigt auf den falschen Pfad oder gewährt zusätzliche Rechte; erforderlich sind read auf secret/data/dispatch und deny auf secret/data/other und sys/audit. Aktualisieren Sie nach Dateibearbeitung die lebende benannte Policy. Die ursprüngliche Ablehnung betrifft secret/data/dispatch; die gelieferte Anwendung fragt secret/dispatch mit vorhandenem reader ab. Korrigieren Sie die enge Live-Policy und den Anwendungspfad, dann aktualisieren Sie den ursprünglichen Prozess-Cache. Exporte enthalten nur request_id, path, operation und reason. `curl -fsS -H @<(printf 'X-Vault-Token: %s\\n' \"$VAULT_READER_TOKEN\") -H \"Content-Type: application/json\" --request POST --data '{\"paths\":[\"secret/data/dispatch\",\"secret/data/other\",\"sys/audit\"]}' \"$VAULT_ADDR/v1/sys/capabilities-self\"`.\n\n### Korrigierte Quelle im ursprünglichen Prozess übernehmen {#audit-original-consumer-path-and-cached-publication}\n\nDie ursprüngliche Anwendung startet mit falschem KV-Pfad und speichert den Fehler im Cache; korrigieren Sie reader Policy und source Profil und senden Sie SIGHUP an dieselbe PID. Erhalten Sie private reader Datei, Prozessidentität und freigegebene HTTP-Metadaten; manuelles Vault-Lesen allein reicht nicht. Die ursprüngliche Ablehnung betrifft secret/data/dispatch; die gelieferte Anwendung fragt secret/dispatch mit vorhandenem reader ab. Korrigieren Sie die enge Live-Policy und den Anwendungspfad, dann aktualisieren Sie den ursprünglichen Prozess-Cache. Exporte enthalten nur request_id, path, operation und reason. `curl -fsS --max-time 2 http://127.0.0.1:18081/status`.\n"
