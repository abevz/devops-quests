heading: Vault-Wiederherstellung und KV-v2
text: "# Vault-Wiederherstellung und KV-v2\n\nVault-Verfügbarkeit, Versiegelung, Berechtigung und übernommene Anwendungsdaten\
  \ sind getrennte Grenzen. Diese Beispiele gelten nur für die kurzlebige Spielumgebung. Ein initialisierter versiegelter\
  \ Server besitzt bereits Speicher und Schlüssel; erneute Initialisierung ist keine Wiederherstellung. Vergleichen\
  \ Sie die ursprüngliche Clusteridentität. Hier läuft ein einzelner Datei-Backend; die Übungen belegen weder HA\
  \ noch Snapshot-Notfallwiederherstellung.\n\n## Vor Änderungen beobachten\nDie Status-API meldet Initialisierung,\
  \ Versiegelung und Quorum. Eine Startquittung belegt Agentenaktivität, keine dauerhafte Anwendungsgesundheit.\
  \ Die Steuerung beschreibt das Umgebungsmanual. Synthetische Schlüsselanteile bleiben privat. Anteile, Tokens\
  \ oder geheime Antworten niemals ausgeben. Wählen Sie für dieses allgemeine Beispiel selbst die erlaubte Anteilsdatei\
  \ und erreichbare Vault-Adresse:\n\n```bash\n(\n set -euo pipefail\n umask 077\n : \"${VAULT_ADDR:?select the\
  \ authorized Vault address}\"\n : \"${RECOVERY_SHARES:?select the authorized recovery JSON file}\"\n request=$(mktemp)\n\
  \ trap 'rm -f \"$request\"' EXIT\n count=$(jq -er 'length' \"$RECOVERY_SHARES\")\n for ((i=0; i<count; i++));\
  \ do\n  jq -n --argjson i \"$i\" --slurpfile shares \"$RECOVERY_SHARES\" '{key:$shares[0][$i]}' > \"$request\"\
  \n  curl -fsS --max-time 3 -X PUT -H 'Content-Type: application/json' --data-binary @\"$request\" \"$VAULT_ADDR/v1/sys/unseal\"\
  \ >/dev/null\n done\n curl -fsS --max-time 3 \"$VAULT_ADDR/v1/sys/seal-status\" | jq '{initialized,sealed,t,n,cluster_id}'\n\
  )\n```\n\n## KV-API und Berechtigung\nDer KV-v2-API-Pfad enthält unter dem Mount eine data-Komponente; der logische\
  \ CLI-Pfad unterscheidet sich. Vergleichen Sie die tatsächliche Anwendungsanfrage mit der vorgesehenen Quelle\
  \ und prüfen Sie effektive Reader-Rechte. Ein Manager zum Ändern einer einzelnen Policy ist nicht automatisch\
  \ Datenleser; bei Wiederherstellung kann ihm jegliche Policy-Änderung fehlen. Keine Rechte für einen erfolgreichen\
  \ Verbraucher erweitern. Vor dem allgemeinen privaten Abruf API-Pfad und bestehende Identität auswählen:\n\n```bash\n\
  (\n set -euo pipefail\n umask 077\n : \"${VAULT_ADDR:?select the authorized Vault address}\"\n : \"${KV_API_PATH:?select\
  \ the intended KV API path}\"\n : \"${READER_TOKEN_FILE:?select the private existing reader credential file}\"\
  \n header=$(mktemp)\n trap 'rm -f \"$header\"' EXIT\n printf 'X-Vault-Token: %s\\n' \"$(cat \"$READER_TOKEN_FILE\"\
  )\" > \"$header\"\n curl -fsS --max-time 3 -H @\"$header\" \"$VAULT_ADDR/v1/$KV_API_PATH\" | jq -e '.data.metadata.version\
  \ > 0' >/dev/null\n echo OK\n)\n```\n\n## Konstruktion und Weitergabe\nEin Synchronisationsarbeitsbereich wie\
  \ sync-secret.sh ist kein kontinuierlicher Controller und kann nur ein Gerüst enthalten. Konstruieren Sie die\
  \ Übertragung über Quell- und Ziel-API. Ein aktualisiertes Kubernetes Secret ändert keine bestehenden Prozessumgebungen.\
  \ Ursprünglichen Controller, Pod-Programm und Quellenreferenz bewahren; nach dem Rollout jeden aktiven zugehörigen\
  \ Pod prüfen.\n\nEine Cache-Anwendung aktualisiert sich möglicherweise beim Start oder durch ein Signal. Eine\
  \ gesunde Quelle beweist keine Übernahme durch Verbraucher. Vergleichen Sie Quellenidentität, private Zugangsdaten,\
  \ Version und Publikationshash an jeder Grenze. Verbraucher aktualisieren sich unabhängig: zuerst Upstream reparieren,\
  \ dann Downstream übernehmen lassen. Ursprüngliche Prozessidentitäten und Rechte bewahren, statt die Anwendung\
  \ zu ersetzen. Diese allgemeine Statusprüfung repariert und aktualisiert nichts:\n\n```bash\n(\n set -euo pipefail\n\
  \ : \"${APPLICATION_URL:?select the existing application base URL}\"\n curl -fsS --max-time 3 \"$APPLICATION_URL/status\"\
  \ | jq '{ready,error,status,source,path,version,value_sha256}'\n)\n```\n\n## Audit-Zuordnung\nAudit-Anfragen und\
  \ Antworten werden über request.id verbunden. Operation und Pfad mit der ursprünglichen Anwendungsbeobachtung\
  \ vergleichen: zwei Ablehnungen können unterschiedliche Ursachen haben. Nur request_id, path, operation und reason\
  \ exportieren. Rohe Authentifizierung und Geheimnisse gehören nicht in Vorfallsdateien. Ablehnung vor Policy-Änderung\
  \ aufzeichnen; danach erlaubten Zugriff, negative Berechtigungen und übernommene Publikation getrennt prüfen.\n\
  \nAPI: [Audit-Schema](https://developer.hashicorp.com/vault/docs/audit/schema), [unseal](https://developer.hashicorp.com/vault/api-docs/system/unseal),\
  \ [KV-v2 lesen](https://developer.hashicorp.com/vault/api-docs/secret/kv/kv-v2#read-secret-version).\n\n## Leases,\
  \ Rotation und kombinierte Übertragung\n\nEin abgelaufener Token kann sich nicht selbst verlängern. Verlängerung\
  \ einer gültigen erneuerbaren Lease und Ausstellung eines Ersatzes über eine begrenzte Rolle unterscheiden. Effektive\
  \ TTL, Erneuerbarkeit und Rollengrenzen ohne Ausgabe von Zugangsdaten vergleichen. Ablehnung des widerrufenen\
  \ Tokens und erfolgreicher Ersatzabruf belegen unterschiedliche Grenzen; beide sowie Übernahme durch Verbraucher\
  \ prüfen. Zugangsdaten gehören weder in Git noch in Publikationsmetadaten.\n\nController-Gesundheit belegt in\
  \ einer Übertragungskette weder Quellenberechtigung noch Verbraucherübernahme. Quellenabgleich, privater Image-Zugriff,\
  \ Secret-Übertragung und Anwendungsantwort getrennt prüfen. Aufgaben 044, 048, 070, 099 und 100 behandeln diese\
  \ Konzepte bei Policies, Erneuerung, Rotation und abgeglichener Übertragung; vorgesehene Pfade und Grenzen aus\
  \ ihren Verträgen ableiten.\n"
