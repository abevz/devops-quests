heading: Vault-Wiederherstellung und KV-v2
text: "# Vault-Wiederherstellung und KV-v2\n\nDiese Anleitung gilt nur für die kurzlebige Spielumgebung. Vault kann initialisiert und dennoch versiegelt sein: Die Initialisierung erstellt Speicher und Schlüssel, das Entsiegeln macht bestehende Daten verfügbar. Initialisiere niemals erneut, gib keine Anteile oder Tokens aus und verwende diese Schritte nicht für einen echten Vault. In der Umgebung liefert `platform.env` die Adresse sowie getrennte Tokens für manager und reader. Manager bearbeitet die Reader-Policy; reader liest das erlaubte Secret.\n\nNur in den Aufgaben 065 und 093 enthält `unseal-shares.json` zwei verschiedene Spielanteile. Bewahre die Datei als JSON-Array aus zwei Zeichenfolgen mit Modus `0600` auf (`chmod 600 unseal-shares.json`). Jede Anfrage an `/v1/sys/unseal` überträgt einen Anteil im Feld `key`; zwei verschiedene Anteile erfüllen den Schwellenwert der Umgebung, 2 von 3. Das Beispiel verwendet private temporäre Dateien, entfernt sie beim Beenden und gibt nur den Siegelstatus aus. Führe es nur aus, wenn der Spiel-Vault erreichbar und versiegelt ist:\n\n```bash\n(\n  set -euo pipefail\n  umask 077\n  cd ~/quest\n  source platform.env\n  request=$(mktemp)\n  trap 'rm -f \"$request\"' EXIT\n  for i in 0 1; do\n    jq -n --argjson i \"$i\" --slurpfile shares unseal-shares.json \\\n      '{key:$shares[0][$i]}' > \"$request\"\n    curl -fsS -X PUT -H 'Content-Type: application/json' \\\n      --data-binary @\"$request\" \"$VAULT_ADDR/v1/sys/unseal\" >/dev/null\n  done\n  curl -fsS \"$VAULT_ADDR/v1/sys/seal-status\" | jq '{initialized,sealed,t,n}'\n)\n```\n\nBei KV-v2 ist `secret` der Mount und der API-Lesepfad lautet `/v1/secret/data/dispatch`; der Wert liegt unter `.data.data.value`. Das reader-Token benötigt `read` für `secret/data/dispatch`. Dieses Beispiel prüft den erwarteten Spielwert, ohne Token oder Antwort auszugeben:\n\n```bash\n(\n  set -euo pipefail\n  umask 077\n  cd ~/quest\n  source platform.env\n  header=$(mktemp)\n  trap 'rm -f \"$header\"' EXIT\n  printf 'X-Vault-Token: %s\\n' \"$VAULT_READER_TOKEN\" > \"$header\"\n  curl -fsS -H @\"$header\" \"$VAULT_ADDR/v1/secret/data/dispatch\" \\\n    | jq -e '.data.data.value == \"north-secret\"' >/dev/null\n  echo OK\n)\n```\n\nIn Aufgabe 083 ist Vault bereits entsiegelt: Korrigiere die Policy `rail-reader` mit dem manager-Token, starte das bereitgestellte `sync-secret.sh` und warte auf den Rollout von `deployment/relay`. Das bedarfsweise Skript ist ein Adapter der Umgebung, kein dauerhafter Controller; nach einer Secret-Änderung kann ein laufender Prozess einen Neustart benötigen. Prüfe den Secret-Schlüssel `value` und die Prozessvariable `ROUTE_SECRET`, ohne Zugangsdaten auszugeben. In Aufgabe 093 startet der begrenzte Agent den vorhandenen Prozess, wenn `vault-repair.json` `{\"action\":\"start\"}` enthält; warte vor dem Entsiegeln. Eine 403-Antwort für manager am KV-Pfad bedeutet, dass dieses Token abgelehnt wurde. Aktueller Status und Zugriff beweisen nicht die gesamte Wiederherstellungsgeschichte.\n\nIn Aufgabe 083 schreibt dieses Beispiel die eingeschränkte reader-Policy und führt die bereitgestellte Synchronisierung aus:\n\n```bash\n(\n  set -euo pipefail\n  umask 077\n  cd ~/quest\n  cat > reader.hcl <<'POLICY'\npath \"secret/data/dispatch\" { capabilities = [\"read\"] }\nPOLICY\n  source platform.env\n  header=$(mktemp)\n  payload=$(mktemp)\n  trap 'rm -f \"$header\" \"$payload\"' EXIT\n  printf 'X-Vault-Token: %s\\n' \"$VAULT_MANAGER_TOKEN\" > \"$header\"\n  jq -n --rawfile policy reader.hcl '{policy:$policy}' > \"$payload\"\n  curl -fsS -X PUT -H @\"$header\" -H 'Content-Type: application/json' \\\n    --data-binary @\"$payload\" \"$VAULT_ADDR/v1/sys/policies/acl/rail-reader\" >/dev/null\n  bash sync-secret.sh\n  kubectl rollout status deployment/relay --timeout=90s\n)\n```\n\nAPI-Referenzen: [Unseal](https://developer.hashicorp.com/vault/api-docs/system/unseal), [KV-v2-Lesen](https://developer.hashicorp.com/vault/api-docs/secret/kv/kv-v2#read-secret-version).\n\nGewähre in Aufgabe 044 der Reader-Policy nur `read` auf dem KV-v2-API-Pfad `secret/data/dispatch`; `data` ist Teil des API-Pfads. Wende sie mit der Manager-Identität an und prüfe die Reader-Identität: Der gewünschte Lesezugriff und die Capability `[read]` müssen funktionieren, während `secret/data/wrong`, `secret/data/other` und `sys/mounts` `[deny]` ergeben. Erhalte die Standard-Policy zur Selbstprüfung. Gib weder Tokens noch Secret-Antworten aus; einige negative Tests belegen allein nicht das Fehlen weiterer Rechte.\n\nIn Aufgabe 048 kann sich ein abgelaufenes Token nicht selbst erneuern. Besorge über den bereitgestellten Issuer ein neues begrenztes Reader-Token, fordere eine Erneuerung um 180 Sekunden an und erneuere innerhalb des Rollenmaximums von 600 Sekunden. Behalte für `station-token` Modus `0600`, prüfe Erneuerbarkeit und über 90 Sekunden Restlaufzeit und übermittle mit dem bereitgestellten Sync-Skript nur den Anwendungswert an den Workload. Prüfe die Capability-Grenzen von Reader und Issuer; bette das Vault-Token nicht ein und gib es nicht aus.\n\nIn Aufgabe 073 beschreiben exportierte Audit-Metadaten eine tatsächliche Ablehnung ohne Secret-Werte. Erfasse nur eingefrorene Request-ID, Path, Operation und Reason, gewähre dem Reader nur Dispatch-Lesezugriff und prüfe erlaubte und verbotene Capabilities. Kopiere keine Tokens oder Secret-Antworten in den Vorfall.\n\nStarte in Aufgabe 093 nur den bereitgestellten vorhandenen Vault und entsiegle ihn anschließend mit den zwei Spielanteilen, ohne sie auszugeben. Erhalte Modus `0600` für `unseal-shares.json` und die ursprüngliche Cluster-ID; prüfe initialized und unsealed sowie erlaubten Reader-Zugriff und verweigertes Manager-Lesen. Initialisiere nicht erneut und ersetze den Speicher nicht.\n\nRotiere in Aufgabe 099 nur den kompromittierten Spiel-Reader über den begrenzten Issuer. Halte das nicht erneuerbare Ersatz-Token für 300 Sekunden in `station-token` mit Modus `0600` privat, widerrufe den aufgezeichneten alten Accessor und prüfe dessen Ablehnung sowie den eingeschränkten Zugriff des Ersatzes und die ausgelieferte Board-Antwort. Lege keine Tokens in Git oder Logs ab.\n\nGewähre in Aufgabe 070 dem Reader nur Dispatch-Lesezugriff, starte den bereitgestellten Synchronisierer ausdrücklich und prüfe das ausgelieferte Secret, Reader-Capabilities und HTTP-Antwort. Halte das Vault-Token aus dem Workload heraus.\n\nNutze in Aufgabe 100 die bereitgestellte Reader-Policy und den Synchronisierer, um die Runtime-Auslieferung nach der Quell-Reconciliation wiederherzustellen. Prüfe den erlaubten Dispatch-Lesezugriff und den verweigerten anderen Pfad, ohne Zugangsdaten auszugeben; diese zwei Beobachtungen belegen nicht die Ablehnung aller übrigen Pfade. Erhalte das private Pull-Secret und das gepinnte Image und vergleiche laufenden Image-Digest und Board-Antwort.\n"
