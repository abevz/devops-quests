heading: Vault recovery and KV-v2
text: "# Vault recovery and KV-v2\n\nVault availability, seal state, authorization and adopted application data\
  \ are separate boundaries. Use these references only inside the disposable training bay. An initialized sealed\
  \ server already has storage and keys; reinitializing is not recovery. Compare the recorded original cluster identity\
  \ before accepting recovery. The storage backend here is a single file backend; these exercises do not establish\
  \ HA or snapshot disaster recovery.\n\n## Observe before changing\nThe status API reports initialization, sealing\
  \ and quorum. A service-start receipt reports agent activity, not continuous application health. Read the bay\
  \ control manual for the available mechanism. Existing share files contain synthetic material and must remain\
  \ private. Never print shares, tokens or secret responses. This generic example requires the caller to select\
  \ an authorized recovery file and reachable Vault address:\n\n```bash\n(\n set -euo pipefail\n umask 077\n : \"\
  ${VAULT_ADDR:?select the authorized Vault address}\"\n : \"${RECOVERY_SHARES:?select the authorized recovery JSON\
  \ file}\"\n request=$(mktemp)\n trap 'rm -f \"$request\"' EXIT\n count=$(jq -er 'length' \"$RECOVERY_SHARES\"\
  )\n for ((i=0; i<count; i++)); do\n  jq -n --argjson i \"$i\" --slurpfile shares \"$RECOVERY_SHARES\" '{key:$shares[0][$i]}'\
  \ > \"$request\"\n  curl -fsS --max-time 3 -X PUT -H 'Content-Type: application/json' --data-binary @\"$request\"\
  \ \"$VAULT_ADDR/v1/sys/unseal\" >/dev/null\n done\n curl -fsS --max-time 3 \"$VAULT_ADDR/v1/sys/seal-status\"\
  \ | jq '{initialized,sealed,t,n,cluster_id}'\n)\n```\n\n## KV API and authority\nA KV-v2 API path includes a data\
  \ component under its mount; a CLI logical secret path is different. Match the application's actual request path\
  \ to the intended source, then inspect the reader's effective capabilities. A manager that can update one named\
  \ policy is not automatically a data reader; recovery scenarios may give that identity no policy-write authority\
  \ at all. Never expand privileges merely to make a consumer succeed. Select the intended API path and existing\
  \ identity before using this generic private read:\n\n```bash\n(\n set -euo pipefail\n umask 077\n : \"${VAULT_ADDR:?select\
  \ the authorized Vault address}\"\n : \"${KV_API_PATH:?select the intended KV API path}\"\n : \"${READER_TOKEN_FILE:?select\
  \ the private existing reader credential file}\"\n header=$(mktemp)\n trap 'rm -f \"$header\"' EXIT\n printf 'X-Vault-Token:\
  \ %s\\n' \"$(cat \"$READER_TOKEN_FILE\")\" > \"$header\"\n curl -fsS --max-time 3 -H @\"$header\" \"$VAULT_ADDR/v1/$KV_API_PATH\"\
  \ | jq -e '.data.metadata.version > 0' >/dev/null\n echo OK\n)\n```\n\n## Construction and propagation\nAn on-demand\
  \ synchronization workspace such as sync-secret.sh is not a continuous controller and may contain only a skeleton.\
  \ Construct delivery using the intended source and target API. Publishing a Kubernetes Secret does not update\
  \ environment variables already held by a process. Preserve the original controller, pod program and source reference;\
  \ examine every active owned pod after a rollout.\n\nA cached application may refresh at startup or on an explicit\
  \ signal. A healthy source does not establish that a consumer adopted it. Compare source identity, credential\
  \ custody, version and publication digest at each boundary. Multiple consumers refresh independently; repair the\
  \ upstream before adopting it downstream. Preserve original process identities and privileges rather than replacing\
  \ a failing application with a substitute. This generic status inspection does not repair or refresh an application:\n\
  \n```bash\n(\n set -euo pipefail\n : \"${APPLICATION_URL:?select the existing application base URL}\"\n curl -fsS\
  \ --max-time 3 \"$APPLICATION_URL/status\" | jq '{ready,error,status,source,path,version,value_sha256}'\n)\n```\n\
  \n## Audit correlation\nAudit request and response records join on request.id. Compare the operation and requested\
  \ path with the application's initial observation; two permission denials can have different causes. Export only\
  \ allowlisted request_id, path, operation and reason. Keep raw authentication and secret fields outside incident\
  \ files. Record the actual denial before changing policy, then verify intended access, negative capabilities and\
  \ the consumer's adopted publication separately.\n\nAPI references: [audit schema](https://developer.hashicorp.com/vault/docs/audit/schema),\
  \ [unseal](https://developer.hashicorp.com/vault/api-docs/system/unseal), [KV-v2 read](https://developer.hashicorp.com/vault/api-docs/secret/kv/kv-v2#read-secret-version).\n\
  \n## Leases, rotation and combined delivery\n\nAn expired token cannot renew itself. Distinguish renewal of a\
  \ valid renewable lease from issuance of a replacement under a bounded role. Compare effective TTL, renewability\
  \ and role limits without printing the credential. A revocation test and a successful replacement read prove different\
  \ boundaries: verify both, and confirm that downstream consumers use the replacement. Keep credentials outside\
  \ version control and runtime publication metadata.\n\nWhen Vault participates in a larger delivery chain, controller\
  \ health does not prove source authorization or consumer adoption. Separate source reconciliation, private image\
  \ access, secret delivery and actual application response. Related exercises 044, 048, 070, 099 and 100 apply\
  \ these concepts to policies, renewal, rotation and reconciled delivery; derive intended paths and bounds from\
  \ their supplied contracts.\n\n\n### Reading the stored policy {#vault-policy-observation}\n\nThe manager could not read rail-reader; its token may lack policy access, Vault may be unreachable, or the API response may not contain a readable policy. Use the manager identity for sys/policies/acl/rail-reader. A failed read can also produce policy_scope because there is no usable observed policy; restore access before interpreting that second result.\n\n### One KV-v2 data path {#vault-policy-scope}\n\nThe stored policy is unreadable or not limited to read on secret/data/dispatch; the initial wrong path, extra grants, wildcards or unsupported policy structure may remain. The supplied apply-policy.sh uploads reader.hcl; changing the local file alone leaves Vault unchanged. The intended rule is path \"secret/data/dispatch\" { capabilities = [\"read\"] }. HCL comments and repeated identical read blocks are accepted; JSON requires only this path and read capabilities, with known parameter/wrapping constraints allowed, but no duplicate keys.\n\n### Vault observer inputs {#vault-inputs}\n\nThe policy probe stopped before detailed observations; platform.env, required token/address variables, temporary header files or probe tools may be unavailable. The reader or capability probe could not prepare its inputs or cleanup; platform.env, required Vault variables, temporary headers or the capability request file may be unavailable. Work in ~/quest and source the supplied platform.env without printing tokens. Header files are created privately and removed on exit. Check the directory is writable and required tools can start before investigating ACLs.\n\n### Observe with the reader identity {#vault-reader-value}\n\nThe reader did not obtain north-secret; its policy may still target secret/data/wrong, its token may be invalid, or the KV-v2 response may be unavailable or changed. KV-v2 reads use /v1/secret/data/dispatch and return the value under .data.data.value. Manager access cannot substitute for a successful request made with VAULT_READER_TOKEN.\n\n### Effective positive and denied access {#vault-effective-access}\n\nThe reader capability on dispatch is not exactly read or could not be observed; the wrong policy path, extra token policies or a failed capabilities-self request may explain it. The reader did not report only deny on secret/data/wrong, or the capability response is unreadable; the initial wrong-path grant, broad or extra token policies, or a failed API request may explain it. Query /v1/sys/capabilities-self with the reader token for dispatch, wrong, other and sys/mounts. Require exactly [read] for secret/data/dispatch and exactly [deny] for all three others; a failed or malformed response fails each path. A wildcard or another token policy can leave extra access even when the positive read works.\n"
