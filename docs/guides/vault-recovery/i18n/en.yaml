heading: Vault recovery and KV-v2
text: "# Vault recovery and KV-v2\n\nVault availability, seal state, authorization and adopted application data\
  \ are separate boundaries. Use these references only inside the disposable training bay. An initialized sealed\
  \ server already has storage and keys; reinitializing is not recovery. Compare the recorded original cluster identity\
  \ before accepting recovery. The storage backend here is a single file backend; these exercises do not establish\
  \ HA or snapshot disaster recovery.\n\n## Observe before changing\nThe status API reports initialization, sealing\
  \ and quorum. A service-start receipt reports agent activity, not continuous application health. Read the bay\
  \ control manual for the available mechanism. Existing share files contain synthetic material and must remain\
  \ private. Never print shares, tokens or secret responses. This generic example requires the caller to select\
  \ an authorized recovery file and reachable Vault address:\n\n```bash\n(\n set -euo pipefail\n umask 077\n : \"\
  ${VAULT_ADDR:?select the authorized Vault address}\"\n : \"${RECOVERY_SHARES:?select the authorized recovery JSON\
  \ file}\"\n request=$(mktemp)\n trap 'rm -f \"$request\"' EXIT\n count=$(jq -er 'length' \"$RECOVERY_SHARES\"\
  )\n for ((i=0; i<count; i++)); do\n  jq -n --argjson i \"$i\" --slurpfile shares \"$RECOVERY_SHARES\" '{key:$shares[0][$i]}'\
  \ > \"$request\"\n  curl -fsS --max-time 3 -X PUT -H 'Content-Type: application/json' --data-binary @\"$request\"\
  \ \"$VAULT_ADDR/v1/sys/unseal\" >/dev/null\n done\n curl -fsS --max-time 3 \"$VAULT_ADDR/v1/sys/seal-status\"\
  \ | jq '{initialized,sealed,t,n,cluster_id}'\n)\n```\n\n## KV API and authority\nA KV-v2 API path includes a data\
  \ component under its mount; a CLI logical secret path is different. Match the application's actual request path\
  \ to the intended source, then inspect the reader's effective capabilities. A manager that can update one named\
  \ policy is not automatically a data reader; recovery scenarios may give that identity no policy-write authority\
  \ at all. Never expand privileges merely to make a consumer succeed. Select the intended API path and existing\
  \ identity before using this generic private read:\n\n```bash\n(\n set -euo pipefail\n umask 077\n : \"${VAULT_ADDR:?select\
  \ the authorized Vault address}\"\n : \"${KV_API_PATH:?select the intended KV API path}\"\n : \"${READER_TOKEN_FILE:?select\
  \ the private existing reader credential file}\"\n header=$(mktemp)\n trap 'rm -f \"$header\"' EXIT\n printf 'X-Vault-Token:\
  \ %s\\n' \"$(cat \"$READER_TOKEN_FILE\")\" > \"$header\"\n curl -fsS --max-time 3 -H @\"$header\" \"$VAULT_ADDR/v1/$KV_API_PATH\"\
  \ | jq -e '.data.metadata.version > 0' >/dev/null\n echo OK\n)\n```\n\n## Construction and propagation\nAn on-demand\
  \ synchronization workspace such as sync-secret.sh is not a continuous controller and may contain only a skeleton.\
  \ Construct delivery using the intended source and target API. Publishing a Kubernetes Secret does not update\
  \ environment variables already held by a process. Preserve the original controller, pod program and source reference;\
  \ examine every active owned pod after a rollout.\n\nA cached application may refresh at startup or on an explicit\
  \ signal. A healthy source does not establish that a consumer adopted it. Compare source identity, credential\
  \ custody, version and publication digest at each boundary. Multiple consumers refresh independently; repair the\
  \ upstream before adopting it downstream. Preserve original process identities and privileges rather than replacing\
  \ a failing application with a substitute. This generic status inspection does not repair or refresh an application:\n\
  \n```bash\n(\n set -euo pipefail\n : \"${APPLICATION_URL:?select the existing application base URL}\"\n curl -fsS\
  \ --max-time 3 \"$APPLICATION_URL/status\" | jq '{ready,error,status,source,path,version,value_sha256}'\n)\n```\n\
  \n## Audit correlation\nAudit request and response records join on request.id. Compare the operation and requested\
  \ path with the application's initial observation; two permission denials can have different causes. Export only\
  \ allowlisted request_id, path, operation and reason. Keep raw authentication and secret fields outside incident\
  \ files. Record the actual denial before changing policy, then verify intended access, negative capabilities and\
  \ the consumer's adopted publication separately.\n\nAPI references: [audit schema](https://developer.hashicorp.com/vault/docs/audit/schema),\
  \ [unseal](https://developer.hashicorp.com/vault/api-docs/system/unseal), [KV-v2 read](https://developer.hashicorp.com/vault/api-docs/secret/kv/kv-v2#read-secret-version).\n\
  \n## Leases, rotation and combined delivery\n\nAn expired token cannot renew itself. Distinguish renewal of a\
  \ valid renewable lease from issuance of a replacement under a bounded role. Compare effective TTL, renewability\
  \ and role limits without printing the credential. A revocation test and a successful replacement read prove different\
  \ boundaries: verify both, and confirm that downstream consumers use the replacement. Keep credentials outside\
  \ version control and runtime publication metadata.\n\nWhen Vault participates in a larger delivery chain, controller\
  \ health does not prove source authorization or consumer adoption. Separate source reconciliation, private image\
  \ access, secret delivery and actual application response. Related exercises 044, 048, 070, 099 and 100 apply\
  \ these concepts to policies, renewal, rotation and reconciled delivery; derive intended paths and bounds from\
  \ their supplied contracts.\n\n\n### Reading the stored policy {#vault-policy-observation}\n\nThe manager could not read rail-reader; its token may lack policy access, Vault may be unreachable, or the API response may not contain a readable policy. Use the manager identity for sys/policies/acl/rail-reader. A failed read can also produce policy_scope because there is no usable observed policy; restore access before interpreting that second result.\n\n### One KV-v2 data path {#vault-policy-scope}\n\nThe stored policy is unreadable or not limited to read on secret/data/dispatch; the initial wrong path, extra grants, wildcards or unsupported policy structure may remain. The supplied apply-policy.sh uploads reader.hcl; changing the local file alone leaves Vault unchanged. The intended rule is path \"secret/data/dispatch\" { capabilities = [\"read\"] }. HCL comments and repeated identical read blocks are accepted; JSON requires only this path and read capabilities, with known parameter/wrapping constraints allowed, but no duplicate keys.\n\n### Vault observer inputs {#vault-inputs}\n\nThe policy probe stopped before detailed observations; platform.env, required token/address variables, temporary header files or probe tools may be unavailable. The reader or capability probe could not prepare its inputs or cleanup; platform.env, required Vault variables, temporary headers or the capability request file may be unavailable. Work in ~/quest and source the supplied platform.env without printing tokens. Header files are created privately and removed on exit. Check the directory is writable and required tools can start before investigating ACLs.\n\n### Observe with the reader identity {#vault-reader-value}\n\nThe reader did not obtain north-secret; its policy may still target secret/data/wrong, its token may be invalid, or the KV-v2 response may be unavailable or changed. KV-v2 reads use /v1/secret/data/dispatch and return the value under .data.data.value. Manager access cannot substitute for a successful request made with VAULT_READER_TOKEN.\n\n### Effective positive and denied access {#vault-effective-access}\n\nThe reader capability on dispatch is not exactly read or could not be observed; the wrong policy path, extra token policies or a failed capabilities-self request may explain it. The reader did not report only deny on secret/data/wrong, or the capability response is unreadable; the initial wrong-path grant, broad or extra token policies, or a failed API request may explain it. Query /v1/sys/capabilities-self with the reader token for dispatch, wrong, other and sys/mounts. Require exactly [read] for secret/data/dispatch and exactly [deny] for all three others; a failed or malformed response fails each path. A wildcard or another token policy can leave extra access even when the positive read works.\n\n\n### Private token file permissions {#renewal-token-file}\n\nstation-token is missing, unreadable or not mode 0600; a token saved or recreated without private permissions can expose the credential. `stat -c %a station-token`.\n\n### Lease duration and renewal limits {#renewal-token-lease}\n\nThe station-token lease does not meet TTL >90, renewable=true, max TTL 600 and the required policy set, or lookup failed; the initial 45-second lease or a 10-second renewal increment is insufficient. Unreadable platform.env or token inputs, or curl/jq startup, can also prevent observation. The shared platform creates station-token before quest setup with mode 0600 and an initial 45-second renewable lease, capped at 600 seconds. issue-token.sh requests 60 seconds; renew-request.json initially asks for 10 seconds. Issue a valid token through the supplied role, request sufficient renewal and observe TTL while it is still above 90. The policy list must be exactly default and rail-reader; changing a JSON request alone does not renew an expired token.\n\n### Effective token capabilities {#renewal-token-access}\n\nstation-token did not report exactly read on dispatch and deny on other data and mount administration; a wrong policy, invalid or expired token, unreadable inputs or a failed API response may explain it. Unreadable platform.env or token inputs, or curl/jq startup, can also prevent observation. The capability request file must be writable. Query the station-token identity for secret/data/dispatch, secret/data/other and sys/mounts; require exactly [read], [deny] and [deny]. A successful manager operation does not establish these permissions for station-token.\n\n### Constrained issuer role {#renewal-issuer-access}\n\nThe issuer did not report only update on auth/token/create/rail-station with deny on policy editing and other issuance; its manager token or environment may be wrong, overprivileged or unavailable. Unreadable platform.env or token inputs, or curl/jq startup, can also prevent observation. For VAULT_MANAGER_TOKEN, require [update] only on auth/token/create/rail-station and [deny] on sys/policies/acl/rail-reader and auth/token/create/other. This setup uses constrained issuance rather than the policy-editor manager from quest 044; the request JSON must be writable and the API response readable.\n\n### Secret-fed consumer without Vault tokens {#renewal-secret-consumer}\n\nThe Secret-fed Deployment reader could not be verified without Vault token exposure; its ROUTE reference, current Pods, refreshed Secret data, manifest/environment token leakage or observation inputs may be wrong or unavailable. The effective last ROUTE entry in worker must use route-secret/value, without a nonempty literal value. The Deployment JSON must contain none of the station, manager or original reader token strings. There must be current nonterminal, nondeleting Pods owned through controller ReplicaSets matching the Deployment UID; each must be Running, and env from every regular container must contain none of those tokens. The worker must read north-secret from /tmp/route. sync-secret.sh reads station-token and updates only Secret data; restart the consumer because an existing environment does not refresh automatically. Missing environment/token inputs, API JSON, Python or probe tools or Pod exec failures also lead to this probe diagnostic.\n\n### Consumer readiness after Secret sync {#renewal-consumer-readiness}\n\nDeployment reader did not finish rollout within 3 seconds; route-secret may be missing or the workload may still be starting, and observation or platform inputs may also fail. `kubectl describe pods; kubectl rollout status deployment/reader --timeout=10s`.\n\n\n### Recover the existing initialized store {#sealed-existing-initialized-store}\n\nThe status did not confirm initialized=true; the selected address may reach an empty/replacement store, or the status response may be unavailable or invalid. The supplied Vault was already initialized.  `source platform.env; curl -fsS --max-time 3 \"$VAULT_ADDR/v1/sys/seal-status\" | jq '{initialized}'`.\n\n### Distinct shares advance unsealing {#sealed-distinct-unseal-progress}\n\nThe status did not confirm sealed=false; fewer than two distinct supplied shares may have been submitted, the same share may have been repeated, or the status request failed.  `source platform.env; curl -fsS --max-time 3 \"$VAULT_ADDR/v1/sys/seal-status\" | jq '{sealed,progress,t}'`.\n\n### Retain the original threshold {#sealed-original-recovery-threshold}\n\nThe status did not confirm t=2; changed initialization/rekey settings, another endpoint or an unreadable response can hide the original recovery threshold.  `source platform.env; curl -fsS --max-time 3 \"$VAULT_ADDR/v1/sys/seal-status\" | jq '{t,n}'`.\n\n### Retain the initialized share count {#sealed-original-share-count}\n\nThe status did not confirm n=3; a different initialization/rekey configuration, wrong endpoint or failed status observation can differ from the original total share count.  `source platform.env; curl -fsS --max-time 3 \"$VAULT_ADDR/v1/sys/seal-status\" | jq '{t,n}'`.\n\n### Original cluster identity and observations {#sealed-original-cluster-identity}\n\nThe original Vault cluster identity was not verified; reinitializing/replacing storage changes the cluster ID, while missing protected evidence, an unavailable original endpoint or probe startup can also prevent comparison. The status fields use the address from platform.env; the separate identity observation contacts the frozen consumer-contract.json source and compares its cluster_id with original-cluster-id. Keep the existing initialized file-backed store and original quorum. A new initialized server with the same threshold is still another cluster. `source platform.env; curl -fsS --max-time 3 \"$VAULT_ADDR/v1/sys/seal-status\" | jq '{cluster_id}'; cat original-cluster-id`.\n\n### Private recovery file permissions {#sealed-private-share-permissions}\n\nunseal-shares.json did not report mode 600 or could not be inspected; copying or recreating the recovery file with broader or executable permissions can expose the supplied shares.  `stat -c %a unseal-shares.json`.\n\n### Recovery file array shape {#sealed-share-array-shape}\n\nunseal-shares.json is not a readable JSON array; a whole initialization response, a single raw share or malformed JSON can replace the supplied array shape.  `jq -e 'type==\"array\"' unseal-shares.json`.\n\n### Exactly two retained shares {#sealed-two-retained-shares}\n\nThe recovery array does not contain exactly two entries or cannot be parsed; copying all three initialized shares, dropping one or changing the file structure can violate the supplied recovery-file contract. The original server was initialized with three shares and a threshold of two, while this recovery file contains only the two supplied shares. The local checks validate the file shape and distinct strings; they do not compare every string cryptographically with server key material. `jq -e 'type==\"array\" and length==2' unseal-shares.json`.\n\n### Share entries are strings {#sealed-string-share-entries}\n\nThe recovery entries are not all JSON strings or the array cannot be read; numbers, objects or an incorrectly wrapped initialization result do not preserve the supplied string-share representation.  `jq -e 'type==\"array\" and all(.[];type==\"string\")' unseal-shares.json`.\n\n### Two different entries in the recovery file {#sealed-distinct-share-file}\n\nThe two recovery entries are not distinct or their array is invalid; duplicating one supplied share cannot provide two different contributions to unsealing.  `jq -e 'type==\"array\" and length==2 and .[0]!=.[1]' unseal-shares.json`.\n\n### Read through the supplied reader identity {#sealed-approved-reader-api}\n\nThe supplied reader did not read north-secret from secret/data/dispatch; Vault may remain sealed, the environment/token/path may differ from the supplied source, or the API/JSON observation may have failed. The supplied reader policy already permits the KV-v2 API path secret/data/dispatch. The separate manager identity is denied that data path in this recovery exercise. Verify the original source is unsealed and use the supplied reader credential; a successful direct read does not refresh the application cache. `source platform.env; curl -fsS --max-time 3 -H @<(printf 'X-Vault-Token: %s\\n' \"$VAULT_READER_TOKEN\") \"$VAULT_ADDR/v1/secret/data/dispatch\" | jq -e '.data.data.value==\"north-secret\"'`.\n\n### Original consumer credential and cache {#sealed-original-consumer-adoption}\n\nThe original consumer did not verify the approved Vault publication under the private reader identity; its file may still hold the supplied manager credential or its failure cache may be stale, while changed process/program/configuration, token custody or unavailable observations can also explain it. The provided application starts while Vault is sealed and its token_file initially contains manager. It reads configuration at startup or SIGHUP; requests do not refresh it. Repair the exact url/path/token_file configuration and the referenced regular reader credential file, owned by UID 1000, mode 0600 and matching the protected fingerprint; paths may be relative or absolute. Send SIGHUP to the existing PID after repair, preserving its process identity, program and privileges. The response must retain Vault source/path, publication SHA-256 and integer version 1 as well as ready=true. `cat consumer/source.json consumer/README.md; curl -fsS --max-time 3 http://127.0.0.1:18081/status`.\n"
