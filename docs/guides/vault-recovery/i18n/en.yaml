heading: Vault recovery and KV-v2
text: "# Vault recovery and KV-v2\n\nThis guide is for the disposable game bay only. Vault can be initialized yet sealed: initialization creates storage and keys, while unsealing makes existing data available. Never initialize again, print shares or tokens, or use these steps on a real Vault. In this bay `platform.env` supplies the address and separate manager and reader tokens. The manager edits the reader policy; the reader reads the permitted secret.\n\nFor quests 065 and 093 only, `unseal-shares.json` contains two distinct game shares. Keep it a JSON array of two strings with mode `0600` (`chmod 600 unseal-shares.json`). Each request to `/v1/sys/unseal` carries one share in its `key` field; two distinct shares meet this bay's threshold of 2 out of 3. The following uses private temporary files, removes them on exit and prints only seal status. Run it only after the game Vault is reachable and sealed:\n\n```bash\n(\n  set -euo pipefail\n  umask 077\n  cd ~/quest\n  source platform.env\n  request=$(mktemp)\n  trap 'rm -f \"$request\"' EXIT\n  for i in 0 1; do\n    jq -n --argjson i \"$i\" --slurpfile shares unseal-shares.json \\\n      '{key:$shares[0][$i]}' > \"$request\"\n    curl -fsS -X PUT -H 'Content-Type: application/json' \\\n      --data-binary @\"$request\" \"$VAULT_ADDR/v1/sys/unseal\" >/dev/null\n  done\n  curl -fsS \"$VAULT_ADDR/v1/sys/seal-status\" | jq '{initialized,sealed,t,n}'\n)\n```\n\nFor KV-v2, `secret` is the mount and the API read path is `/v1/secret/data/dispatch`; the value is nested at `.data.data.value`. The reader token needs `read` on `secret/data/dispatch`. This example checks the disposable expected value without displaying the token or response:\n\n```bash\n(\n  set -euo pipefail\n  umask 077\n  cd ~/quest\n  source platform.env\n  header=$(mktemp)\n  trap 'rm -f \"$header\"' EXIT\n  printf 'X-Vault-Token: %s\\n' \"$VAULT_READER_TOKEN\" > \"$header\"\n  curl -fsS -H @\"$header\" \"$VAULT_ADDR/v1/secret/data/dispatch\" \\\n    | jq -e '.data.data.value == \"north-secret\"' >/dev/null\n  echo OK\n)\n```\n\nFor quest 083, the Vault is already unsealed: correct the `rail-reader` policy using the manager token, run the supplied `sync-secret.sh`, and wait for `deployment/relay` to roll out. The on-demand script is a bay adapter, not a continuous controller; after a Secret changes, a running process may need a restart. Check the Secret key `value` and the process environment `ROUTE_SECRET` without displaying credentials. For quest 093, the bounded agent starts the existing process after `vault-repair.json` contains `{\"action\":\"start\"}`; wait for it before unsealing. A 403 manager response on the KV path means that token is denied. Current status and access checks cannot prove the entire recovery history.\n\nFor quest 083, this writes the narrow reader policy and runs the supplied synchronization:\n\n```bash\n(\n  set -euo pipefail\n  umask 077\n  cd ~/quest\n  cat > reader.hcl <<'POLICY'\npath \"secret/data/dispatch\" { capabilities = [\"read\"] }\nPOLICY\n  source platform.env\n  header=$(mktemp)\n  payload=$(mktemp)\n  trap 'rm -f \"$header\" \"$payload\"' EXIT\n  printf 'X-Vault-Token: %s\\n' \"$VAULT_MANAGER_TOKEN\" > \"$header\"\n  jq -n --rawfile policy reader.hcl '{policy:$policy}' > \"$payload\"\n  curl -fsS -X PUT -H @\"$header\" -H 'Content-Type: application/json' \\\n    --data-binary @\"$payload\" \"$VAULT_ADDR/v1/sys/policies/acl/rail-reader\" >/dev/null\n  bash sync-secret.sh\n  kubectl rollout status deployment/relay --timeout=90s\n)\n```\n\nAPI references: [unseal](https://developer.hashicorp.com/vault/api-docs/system/unseal), [KV-v2 read](https://developer.hashicorp.com/vault/api-docs/secret/kv/kv-v2#read-secret-version).\n\nIn quest 044, grant the reader policy only `read` on the KV-v2 API path `secret/data/dispatch`; the `data` component is part of the API path. Apply it with the manager identity, then test the reader identity: the intended read and `[read]` capability must succeed, while `secret/data/wrong`, `secret/data/other` and `sys/mounts` report `[deny]`. Preserve the default self-inspection policy. Do not print tokens or secret responses; a few negative tests alone cannot prove the absence of other grants.\n\nIn quest 048, a token that has expired cannot renew itself. Use the supplied issuer to obtain a fresh bounded reader token, set the requested renewal increment to 180 seconds, and renew within the role's 600-second maximum. Keep `station-token` mode `0600`, verify it is renewable with more than 90 seconds remaining, and use the supplied sync script to deliver only the application value to the workload. Check the reader and issuer capability boundaries; do not embed or print the Vault token.\n"
