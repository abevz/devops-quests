heading: Odzyskiwanie Vault i KV-v2
text: "# Odzyskiwanie Vault i KV-v2\n\nTen przewodnik dotyczy wyłącznie jednorazowej zatoki gry. Vault może być zainicjowany, lecz zapieczętowany: inicjalizacja tworzy magazyn i klucze, a odpieczętowanie udostępnia istniejące dane. Nigdy nie inicjuj ponownie, nie wypisuj udziałów ani tokenów i nie stosuj tych kroków do rzeczywistego Vault. W zatoce `platform.env` udostępnia adres oraz osobne tokeny manager i reader. Manager edytuje politykę czytelnika; reader odczytuje dozwolony sekret.\n\nTylko w zadaniach 065 i 093 `unseal-shares.json` zawiera dwa różne udziały gry. Zachowaj plik jako tablicę JSON dwóch ciągów z trybem `0600` (`chmod 600 unseal-shares.json`). Każde żądanie do `/v1/sys/unseal` przekazuje jeden udział w polu `key`; dwa różne udziały spełniają próg zatoki 2 z 3. Poniższy przykład używa prywatnych plików tymczasowych, usuwa je przy wyjściu i wypisuje tylko stan pieczęci. Uruchom go tylko, gdy Vault gry jest dostępny i zapieczętowany:\n\n```bash\n(\n  set -euo pipefail\n  umask 077\n  cd ~/quest\n  source platform.env\n  request=$(mktemp)\n  trap 'rm -f \"$request\"' EXIT\n  for i in 0 1; do\n    jq -n --argjson i \"$i\" --slurpfile shares unseal-shares.json \\\n      '{key:$shares[0][$i]}' > \"$request\"\n    curl -fsS -X PUT -H 'Content-Type: application/json' \\\n      --data-binary @\"$request\" \"$VAULT_ADDR/v1/sys/unseal\" >/dev/null\n  done\n  curl -fsS \"$VAULT_ADDR/v1/sys/seal-status\" | jq '{initialized,sealed,t,n}'\n)\n```\n\nW KV-v2 `secret` jest punktem montowania, a ścieżka API odczytu to `/v1/secret/data/dispatch`; wartość znajduje się w `.data.data.value`. Token reader potrzebuje `read` na `secret/data/dispatch`. Przykład sprawdza oczekiwaną wartość jednorazową bez wyświetlania tokenu ani odpowiedzi:\n\n```bash\n(\n  set -euo pipefail\n  umask 077\n  cd ~/quest\n  source platform.env\n  header=$(mktemp)\n  trap 'rm -f \"$header\"' EXIT\n  printf 'X-Vault-Token: %s\\n' \"$VAULT_READER_TOKEN\" > \"$header\"\n  curl -fsS -H @\"$header\" \"$VAULT_ADDR/v1/secret/data/dispatch\" \\\n    | jq -e '.data.data.value == \"north-secret\"' >/dev/null\n  echo OK\n)\n```\n\nW zadaniu 083 Vault jest już odpieczętowany: popraw politykę `rail-reader` tokenem manager, uruchom dostarczony `sync-secret.sh` i poczekaj na wdrożenie `deployment/relay`. Skrypt na żądanie jest adapterem zatoki, a nie ciągłym kontrolerem; po zmianie Secret działający proces może wymagać restartu. Sprawdź klucz Secret `value` i zmienną procesu `ROUTE_SECRET` bez wyświetlania poświadczeń. W zadaniu 093 ograniczony agent uruchamia istniejący proces, gdy `vault-repair.json` zawiera `{\"action\":\"start\"}`; poczekaj przed odpieczętowaniem. Odpowiedź manager 403 na ścieżce KV oznacza odmowę temu tokenowi. Bieżący stan i dostęp nie dowodzą całej historii odzyskiwania.\n\nW zadaniu 083 ten przykład zapisuje wąską politykę reader i uruchamia dostarczoną synchronizację:\n\n```bash\n(\n  set -euo pipefail\n  umask 077\n  cd ~/quest\n  cat > reader.hcl <<'POLICY'\npath \"secret/data/dispatch\" { capabilities = [\"read\"] }\nPOLICY\n  source platform.env\n  header=$(mktemp)\n  payload=$(mktemp)\n  trap 'rm -f \"$header\" \"$payload\"' EXIT\n  printf 'X-Vault-Token: %s\\n' \"$VAULT_MANAGER_TOKEN\" > \"$header\"\n  jq -n --rawfile policy reader.hcl '{policy:$policy}' > \"$payload\"\n  curl -fsS -X PUT -H @\"$header\" -H 'Content-Type: application/json' \\\n    --data-binary @\"$payload\" \"$VAULT_ADDR/v1/sys/policies/acl/rail-reader\" >/dev/null\n  bash sync-secret.sh\n  kubectl rollout status deployment/relay --timeout=90s\n)\n```\n\nDokumentacja API: [unseal](https://developer.hashicorp.com/vault/api-docs/system/unseal), [odczyt KV-v2](https://developer.hashicorp.com/vault/api-docs/secret/kv/kv-v2#read-secret-version).\n"
