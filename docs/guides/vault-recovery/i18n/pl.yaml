heading: Odzyskiwanie Vault i KV-v2
text: "# Odzyskiwanie Vault i KV-v2\n\nDostępność Vault, seal, autoryzacja i dane przyjęte przez aplikację to odrębne\
  \ granice. Przykłady dotyczą wyłącznie jednorazowej zatoki gry. Zainicjalizowany zapieczętowany serwer ma już\
  \ magazyn i klucze; ponowna inicjalizacja nie jest odzyskaniem. Porównaj pierwotną tożsamość klastra. Tutaj działa\
  \ pojedynczy backend plikowy; ćwiczenia nie dowodzą HA ani odzyskania ze snapshotów.\n\n## Obserwuj przed zmianą\n\
  API statusu pokazuje inicjalizację, seal i kworum. Potwierdzenie uruchomienia opisuje działanie agenta, nie ciągłą\
  \ sprawność aplikacji. Mechanizm opisuje instrukcja sterowania zatoki. Syntetyczne udziały klucza muszą pozostać\
  \ prywatne. Nie wypisuj udziałów, tokenów ani sekretów. Ten ogólny przykład wymaga wyboru dozwolonego pliku udziałów\
  \ i dostępnego adresu:\n\n```bash\n(\n set -euo pipefail\n umask 077\n : \"${VAULT_ADDR:?select the authorized\
  \ Vault address}\"\n : \"${RECOVERY_SHARES:?select the authorized recovery JSON file}\"\n request=$(mktemp)\n\
  \ trap 'rm -f \"$request\"' EXIT\n count=$(jq -er 'length' \"$RECOVERY_SHARES\")\n for ((i=0; i<count; i++));\
  \ do\n  jq -n --argjson i \"$i\" --slurpfile shares \"$RECOVERY_SHARES\" '{key:$shares[0][$i]}' > \"$request\"\
  \n  curl -fsS --max-time 3 -X PUT -H 'Content-Type: application/json' --data-binary @\"$request\" \"$VAULT_ADDR/v1/sys/unseal\"\
  \ >/dev/null\n done\n curl -fsS --max-time 3 \"$VAULT_ADDR/v1/sys/seal-status\" | jq '{initialized,sealed,t,n,cluster_id}'\n\
  )\n```\n\n## API KV i uprawnienia\nŚcieżka API KV-v2 zawiera data pod mount; logiczna ścieżka CLI jest inna. Porównaj\
  \ rzeczywiste żądanie aplikacji z zamierzonym źródłem i sprawdź efektywne uprawnienia reader. Manager uprawniony\
  \ do aktualizacji jednej polityki nie jest automatycznie czytelnikiem; przy odzyskiwaniu może nie mieć praw edycji\
  \ polityk. Nie rozszerzaj uprawnień dla sukcesu konsumenta. Przed ogólnym odczytem wybierz ścieżkę API i istniejącą\
  \ tożsamość:\n\n```bash\n(\n set -euo pipefail\n umask 077\n : \"${VAULT_ADDR:?select the authorized Vault address}\"\
  \n : \"${KV_API_PATH:?select the intended KV API path}\"\n : \"${READER_TOKEN_FILE:?select the private existing\
  \ reader credential file}\"\n header=$(mktemp)\n trap 'rm -f \"$header\"' EXIT\n printf 'X-Vault-Token: %s\\n'\
  \ \"$(cat \"$READER_TOKEN_FILE\")\" > \"$header\"\n curl -fsS --max-time 3 -H @\"$header\" \"$VAULT_ADDR/v1/$KV_API_PATH\"\
  \ | jq -e '.data.metadata.version > 0' >/dev/null\n echo OK\n)\n```\n\n## Budowa i propagacja\nObszar synchronizacji\
  \ jak sync-secret.sh nie jest ciągłym kontrolerem i może zawierać tylko szkielet. Zbuduj dostarczanie przez API\
  \ źródła i celu. Aktualizacja Secret Kubernetes nie zmienia środowiska już działających procesów. Zachowaj kontroler,\
  \ program i odwołanie do źródła; po rollout sprawdź każdy aktywny należący do niego pod.\n\nAplikacja z pamięcią\
  \ podręczną może odświeżać dane przy starcie lub po sygnale. Zdrowe źródło nie dowodzi przyjęcia danych przez\
  \ konsumenta. Porównuj tożsamość źródła, prywatność danych uwierzytelniających, wersję i skrót publikacji na każdej\
  \ granicy. Konsumenci odświeżają się niezależnie: najpierw napraw upstream, potem przyjmij go downstream. Zachowaj\
  \ pierwotne tożsamości i uprawnienia procesów. Ogólna inspekcja statusu niczego nie naprawia ani nie odświeża:\n\
  \n```bash\n(\n set -euo pipefail\n : \"${APPLICATION_URL:?select the existing application base URL}\"\n curl -fsS\
  \ --max-time 3 \"$APPLICATION_URL/status\" | jq '{ready,error,status,source,path,version,value_sha256}'\n)\n```\n\
  \n## Korelacja audytu\nŻądania i odpowiedzi audytu łączy request.id. Porównaj operację i ścieżkę z początkową\
  \ obserwacją aplikacji: dwie odmowy mogą mieć różne przyczyny. Eksportuj tylko request_id, path, operation i reason.\
  \ Surowe uwierzytelnianie i sekrety nie należą do raportów. Zapisz odmowę przed zmianą polityki; potem oddzielnie\
  \ sprawdź dozwolony dostęp, negatywne uprawnienia i przyjętą publikację.\n\nAPI: [schemat audytu](https://developer.hashicorp.com/vault/docs/audit/schema),\
  \ [unseal](https://developer.hashicorp.com/vault/api-docs/system/unseal), [odczyt KV-v2](https://developer.hashicorp.com/vault/api-docs/secret/kv/kv-v2#read-secret-version).\n\
  \n## Dzierżawy, rotacja i złożone dostarczanie\n\nWygasły token nie może sam się odnowić. Odróżnij odnowienie\
  \ ważnej odnawialnej dzierżawy od wydania zastępstwa przez ograniczoną rolę. Porównuj TTL, odnawialność i ograniczenia\
  \ roli bez wypisywania danych uwierzytelniających. Odmowa dla odwołanego tokena i udany odczyt zastępstwa dowodzą\
  \ różnych granic; sprawdź obie oraz przyjęcie zastępstwa przez konsumentów. Dane uwierzytelniające nie należą\
  \ do Git ani metadanych publikacji.\n\nSprawność kontrolera w łańcuchu dostarczania nie dowodzi autoryzacji źródła\
  \ ani przyjęcia danych. Oddzielnie sprawdzaj uzgodnienie źródła, prywatny dostęp do obrazu, dostarczenie sekretu\
  \ i odpowiedź aplikacji. Zadania 044, 048, 070, 099 i 100 stosują te pojęcia do polityk, odnawiania, rotacji i\
  \ dostarczania; ścieżki i granice wywnioskuj z ich kontraktów.\n\n\n### Odczyt zapisanej polityki {#vault-policy-observation}\n\nMenedżer nie odczytał rail-reader; token może nie mieć dostępu do polityki, Vault może być niedostępny lub odpowiedź API nie zawiera czytelnej polityki. Do sys/policies/acl/rail-reader użyj menedżera. Błąd odczytu może też wywołać policy_scope z powodu braku czytelnej polityki; najpierw przywróć dostęp.\n\n### Jedna ścieżka danych KV-v2 {#vault-policy-scope}\n\nZapisana polityka jest nieczytelna lub nie ogranicza się do read na secret/data/dispatch; mógł pozostać początkowy błędny adres, dodatkowe uprawnienia, wildcardy lub nieobsługiwana struktura. Dostarczony apply-policy.sh wysyła reader.hcl; sama edycja lokalnego pliku nie zmienia Vault. Reguła docelowa to path \"secret/data/dispatch\" { capabilities = [\"read\"] }. HCL dopuszcza komentarze i powtórzone identyczne bloki read; JSON wymaga wyłącznie tej ścieżki i read, dopuszcza znane ograniczenia parametrów i wrapping, ale nie powtórzone klucze.\n\n### Dane kontroli Vault {#vault-inputs}\n\nKontrola polityki zatrzymała się przed szczegółowymi obserwacjami; platform.env, zmienne tokenów i adresu, tymczasowe pliki nagłówków lub narzędzia mogą być niedostępne. Kontrola odczytu lub capabilities nie przygotowała danych albo nie posprzątała plików; platform.env, zmienne Vault, tymczasowe nagłówki lub plik żądania mogą być niedostępne. Pracuj w ~/quest i załaduj platform.env bez wypisywania tokenów. Pliki nagłówków są prywatne i usuwane przy wyjściu. Przed analizą ACL sprawdź zapis do katalogu i uruchamianie narzędzi.\n\n### Kontrola tożsamością czytelnika {#vault-reader-value}\n\nCzytelnik nie otrzymał north-secret; polityka może nadal wskazywać secret/data/wrong, token może być nieprawidłowy albo odpowiedź KV-v2 niedostępna lub zmieniona. Odczyt KV-v2 używa /v1/secret/data/dispatch i wartości .data.data.value. Dostęp menedżera nie zastępuje udanego żądania z VAULT_READER_TOKEN.\n\n### Efektywne uprawnienia i odmowy {#vault-effective-access}\n\nCapability czytelnika dla dispatch nie jest dokładnie read lub nie da się jej odczytać; przyczyną może być błędny adres polityki, dodatkowe polityki tokena lub błąd capabilities-self. Czytelnik nie zgłosił wyłącznie deny dla secret/data/wrong lub odpowiedź jest nieczytelna; przyczyną może być początkowe uprawnienie złej ścieżki, szerokie lub dodatkowe polityki tokena albo błąd API. Odpytaj /v1/sys/capabilities-self tokenem czytelnika dla dispatch, wrong, other i sys/mounts. Wymagane są dokładnie [read] dla secret/data/dispatch i [deny] dla pozostałych trzech; brak lub błędna odpowiedź powoduje błąd każdej ścieżki. Wildcard lub inna polityka tokena może zostawić dodatkowy dostęp mimo udanego odczytu.\n\n\n### Prywatne uprawnienia pliku tokena {#renewal-token-file}\n\nstation-token nie istnieje, jest nieczytelny lub nie ma trybu 0600; zapis lub odtworzenie bez prywatnych uprawnień może ujawnić token. `stat -c %a station-token`.\n\n### Czas dzierżawy i limity odnowienia {#renewal-token-lease}\n\nDzierżawa station-token nie spełnia TTL >90, renewable=true, max TTL 600 i wymaganego zestawu polityk lub lookup zawiódł; początkowe 45 sekund lub odnowienie o 10 sekund jest niewystarczające. Nieczytelny platform.env lub dane tokena oraz błąd startu curl/jq także mogą przerwać obserwację. Wspólna platforma tworzy station-token przed setup z trybem 0600 i początkową odnawialną dzierżawą 45 sekund ograniczoną do 600. issue-token.sh żąda 60 sekund, a renew-request.json początkowo 10. Wystaw ważny token przez dostarczoną rolę, zażądaj wystarczającego odnowienia i sprawdź TTL, gdy nadal przekracza 90. Lista polityk musi zawierać dokładnie default i rail-reader; sama edycja JSON nie odnawia wygasłego tokena.\n\n### Efektywne capabilities tokena {#renewal-token-access}\n\nstation-token nie potwierdził dokładnie read dla dispatch i deny dla innych danych oraz administracji mounts; przyczyną może być zła polityka, błędny lub wygasły token, nieczytelne dane albo błąd API. Nieczytelny platform.env lub dane tokena oraz błąd startu curl/jq także mogą przerwać obserwację. Plik żądania capabilities musi być zapisywalny. Odpytaj tożsamość station-token o secret/data/dispatch, secret/data/other i sys/mounts; wymagane są dokładnie [read], [deny] i [deny]. Sukces operacji menedżera nie potwierdza tych praw station-token.\n\n### Ograniczona rola wystawcy {#renewal-issuer-access}\n\nWystawca nie potwierdził wyłącznie update dla auth/token/create/rail-station z deny dla edycji polityki i innych ról; token menedżera lub środowisko mogą być błędne, nadmiernie uprzywilejowane albo niedostępne. Nieczytelny platform.env lub dane tokena oraz błąd startu curl/jq także mogą przerwać obserwację. Dla VAULT_MANAGER_TOKEN wymagaj [update] tylko dla auth/token/create/rail-station i [deny] dla sys/policies/acl/rail-reader oraz auth/token/create/other. Ten setup używa ograniczonego wystawiania zamiast edytora polityk z 044; JSON żądania musi być zapisywalny, a odpowiedź API czytelna.\n\n### Odbiorca Secret bez tokenów Vault {#renewal-secret-consumer}\n\nNie potwierdzono działania Deployment reader przez Secret bez ujawnienia tokenów Vault; referencja ROUTE, bieżące Pody, odświeżone dane Secret, wyciek tokenów do manifestu lub środowiska albo dane kontroli mogą być błędne lub niedostępne. Ostatni efektywny wpis ROUTE w worker musi używać route-secret/value bez niepustej wartości literalnej. JSON Deployment nie może zawierać tokenów z station-token, menedżera ani pierwotnego czytelnika. Muszą istnieć bieżące niezakończone i nieusuwane Pody należące przez kontrolujące ReplicaSety do UID Deployment; każdy Running, a env wszystkich zwykłych kontenerów bez tych tokenów. Worker musi czytać north-secret z /tmp/route. sync-secret.sh czyta station-token i aktualizuje tylko dane Secret; uruchom odbiorcę ponownie, ponieważ istniejące środowisko nie odświeża się automatycznie. Brak środowiska lub tokena, błędny JSON API, niedostępny Python lub narzędzia oraz błędy exec też dają tę diagnostykę.\n\n### Gotowość po synchronizacji Secret {#renewal-consumer-readiness}\n\nDeployment reader nie zakończył rollout w 3 sekundy; route-secret może nie istnieć lub aplikacja jeszcze startuje, a obserwacja albo dane platformy mogą też zawieść. `kubectl describe pods; kubectl rollout status deployment/reader --timeout=10s`.\n\n\n### Odtworzenie istniejącego zainicjalizowanego magazynu {#sealed-existing-initialized-store}\n\nStatus nie potwierdził initialized=true; adres może prowadzić do pustego lub zastąpionego magazynu albo odpowiedź jest niedostępna/błędna. Dostarczony Vault był już zainicjalizowany.  `source platform.env; curl -fsS --max-time 3 \"$VAULT_ADDR/v1/sys/seal-status\" | jq '{initialized}'`.\n\n### Różne udziały pozwalają na unseal {#sealed-distinct-unseal-progress}\n\nStatus nie potwierdził sealed=false; mogło zostać przesłanych mniej niż dwa różne dostarczone udziały, ten sam udział powtórzono lub odczyt statusu zawiódł.  `source platform.env; curl -fsS --max-time 3 \"$VAULT_ADDR/v1/sys/seal-status\" | jq '{sealed,progress,t}'`.\n\n### Zachowanie pierwotnego progu {#sealed-original-recovery-threshold}\n\nStatus nie potwierdził t=2; zmienione ustawienia inicjalizacji/rekey, inny endpoint lub nieczytelna odpowiedź blokują potwierdzenie pierwotnego progu odtworzenia.  `source platform.env; curl -fsS --max-time 3 \"$VAULT_ADDR/v1/sys/seal-status\" | jq '{t,n}'`.\n\n### Zachowanie liczby udziałów inicjalizacji {#sealed-original-share-count}\n\nStatus nie potwierdził n=3; inna inicjalizacja/rekey, zły endpoint lub błąd obserwacji może odbiegać od pierwotnej całkowitej liczby udziałów.  `source platform.env; curl -fsS --max-time 3 \"$VAULT_ADDR/v1/sys/seal-status\" | jq '{t,n}'`.\n\n### Pierwotna tożsamość klastra i obserwacje {#sealed-original-cluster-identity}\n\nNie potwierdzono pierwotnej tożsamości klastra Vault; ponowna inicjalizacja/wymiana magazynu zmienia cluster ID, a brak chronionych danych, niedostępny pierwotny endpoint lub start kontroli blokuje porównanie. Pola statusu używają adresu platform.env; osobna obserwacja kontaktuje chronione źródło consumer-contract.json i porównuje cluster_id z original-cluster-id. Zachowaj istniejący magazyn plikowy i pierwotne kworum. Nowy zainicjalizowany serwer z tym samym progiem nadal jest innym klastrem. `source platform.env; curl -fsS --max-time 3 \"$VAULT_ADDR/v1/sys/seal-status\" | jq '{cluster_id}'; cat original-cluster-id`.\n\n### Prywatne uprawnienia pliku odtwarzania {#sealed-private-share-permissions}\n\nunseal-shares.json nie zgłosił trybu 600 lub nie można go sprawdzić; skopiowanie/odtworzenie pliku z szerszymi lub wykonywalnymi prawami może ujawnić udziały.  `stat -c %a unseal-shares.json`.\n\n### Struktura tablicy pliku odtwarzania {#sealed-share-array-shape}\n\nunseal-shares.json nie jest czytelną tablicą JSON; cała odpowiedź inicjalizacji, pojedynczy surowy udział lub błędny JSON zastępuje dostarczoną strukturę.  `jq -e 'type==\"array\"' unseal-shares.json`.\n\n### Dokładnie dwa zachowane udziały {#sealed-two-retained-shares}\n\nTablica odtwarzania nie zawiera dokładnie dwóch wpisów lub jest nieczytelna; skopiowanie wszystkich trzech udziałów, usunięcie jednego lub zmiana struktury narusza kontrakt pliku. Pierwotny serwer ma trzy udziały i próg dwóch, a ten plik zawiera tylko dwa dostarczone udziały. Lokalne kontrole oceniają strukturę i różne teksty; nie porównują kryptograficznie każdej wartości z kluczem serwera. `jq -e 'type==\"array\" and length==2' unseal-shares.json`.\n\n### Udziały mają postać tekstu {#sealed-string-share-entries}\n\nWpisy odtwarzania nie są wszystkie tekstami JSON lub tablica jest nieczytelna; liczby, obiekty lub źle opakowany wynik inicjalizacji nie zachowują tekstowej reprezentacji udziałów.  `jq -e 'type==\"array\" and all(.[];type==\"string\")' unseal-shares.json`.\n\n### Dwa różne wpisy pliku odtwarzania {#sealed-distinct-share-file}\n\nDwa wpisy odtwarzania nie są różne lub tablica jest błędna; powielenie jednego udziału nie daje dwóch różnych wkładów do unseal.  `jq -e 'type==\"array\" and length==2 and .[0]!=.[1]' unseal-shares.json`.\n\n### Odczyt przez dostarczoną tożsamość reader {#sealed-approved-reader-api}\n\nDostarczony reader nie odczytał north-secret z secret/data/dispatch; Vault może pozostać sealed, środowisko/token/ścieżka różnić się od źródła lub obserwacja API/JSON zawieść. Dostarczona polityka reader już pozwala na ścieżkę API KV-v2 secret/data/dispatch. Osobny manager ma odmowę do tych danych w tym ćwiczeniu. Sprawdź unseal pierwotnego źródła i użyj reader; udany bezpośredni odczyt nie odświeża cache aplikacji. `source platform.env; curl -fsS --max-time 3 -H @<(printf 'X-Vault-Token: %s\\n' \"$VAULT_READER_TOKEN\") \"$VAULT_ADDR/v1/secret/data/dispatch\" | jq -e '.data.data.value==\"north-secret\"'`.\n\n### Poświadczenia i cache pierwotnego odbiorcy {#sealed-original-consumer-adoption}\n\nPierwotny odbiorca nie potwierdził publikacji Vault z prywatną tożsamością reader; plik może nadal zawierać dostarczony manager lub pamięć błędu jest stara, a zmieniony proces/program/konfiguracja, przechowywanie tokenu lub brak obserwacji też to wyjaśniają. Dostarczona aplikacja startuje przy sealed Vault, a token_file początkowo zawiera manager. Czyta konfigurację przy starcie lub SIGHUP; żądania nie odświeżają cache. Napraw konfigurację z dokładnymi polami url/path/token_file i zwykły plik reader należący do UID 1000, tryb 0600 i chroniony odcisk; ścieżki mogą być względne lub bezwzględne. Po naprawie wyślij SIGHUP istniejącemu PID, zachowując proces, program i uprawnienia. Odpowiedź zachowuje źródło/ścieżkę Vault, SHA-256 publikacji, całkowitą wersję 1 i ready=true. `cat consumer/source.json consumer/README.md; curl -fsS --max-time 3 http://127.0.0.1:18081/status`.\n\n\n### Przyczyna i obserwacja (070, secret_value) {#secret-vault-to-kubernetes-publication}\n\nSama poprawa polityki Vault nie dostarcza wartości do Kubernetes; dostarczony sync-secret.sh musi odczytać i opublikować route-secret/value. Pierwszy etap poprawia ścieżkę Application; drugi poprawia dostarczoną politykę reader i publikuje Secret gotowym sync-secret.sh. Sama poprawna polityka nie tworzy obiektu Kubernetes. Obserwuj z ~/quest po wczytaniu platform.env.\n\n```bash\nkubectl get secret route-secret -o json | jq '(.data.value | @base64d)==\"north-secret\"'\n```\n\n### Przyczyna i obserwacja (070, secret_capabilities) {#secret-reader-exact-path-capabilities}\n\nDostarczona polityka reader wskazuje błędną ścieżkę KV-v2 lub daje dodatkowy dostęp; wymagane read na secret/data/dispatch oraz deny na secret/data/unrelated i sys/mounts. Pierwszy etap poprawia ścieżkę Application; drugi poprawia dostarczoną politykę reader i publikuje Secret gotowym sync-secret.sh. Sama poprawna polityka nie tworzy obiektu Kubernetes. Obserwuj z ~/quest po wczytaniu platform.env.\n\n```bash\ncurl -fsS -H \"X-Vault-Token: $VAULT_READER_TOKEN\" -H \"Content-Type: application/json\" --request POST --data '{\"paths\":[\"secret/data/dispatch\",\"secret/data/unrelated\",\"sys/mounts\"]}' \"$VAULT_ADDR/v1/sys/capabilities-self\"\n```\n\n\n### Dwie odmowy i cztery pola eksportu {#audit-correlate-two-denied-paths}\n\nPierwotny incident lub dwa consumer-incident mogą pomijać pola, dodawać dane lub odpowiadać innej odmowie; skoreluj dokładne czteropolowe rekordy zamrożonego eksportu dla obu ścieżek KV. Pierwotna odmowa dotyczy secret/data/dispatch; dostarczona aplikacja żąda secret/dispatch z istniejącym reader. Popraw wąską żywą politykę i ścieżkę aplikacji, potem odśwież cache pierwotnego procesu. Eksport zawiera tylko request_id, path, operation i reason. `jq '.[] | {request_id,path,operation,reason}' /run/dq/facts/0/consumer-audit.json`.\n\n### Wąska polityka reader KV-v2 {#audit-narrow-kv-v2-reader-policy}\n\nDostarczona polityka reader wskazuje błędną ścieżkę lub dodatkowe prawa; wymagane read na secret/data/dispatch oraz deny na secret/data/other i sys/audit. Po edycji pliku zaktualizuj żywą nazwaną politykę. Pierwotna odmowa dotyczy secret/data/dispatch; dostarczona aplikacja żąda secret/dispatch z istniejącym reader. Popraw wąską żywą politykę i ścieżkę aplikacji, potem odśwież cache pierwotnego procesu. Eksport zawiera tylko request_id, path, operation i reason. `curl -fsS -H @<(printf 'X-Vault-Token: %s\\n' \"$VAULT_READER_TOKEN\") -H \"Content-Type: application/json\" --request POST --data '{\"paths\":[\"secret/data/dispatch\",\"secret/data/other\",\"sys/audit\"]}' \"$VAULT_ADDR/v1/sys/capabilities-self\"`.\n\n### Przyjęcie poprawionego źródła przez pierwotny proces {#audit-original-consumer-path-and-cached-publication}\n\nPierwotna aplikacja startuje z błędną ścieżką KV i zapisuje awarię w cache; popraw politykę reader oraz profil source, potem wyślij SIGHUP do tego samego PID. Zachowaj prywatny plik reader, tożsamość procesu i zatwierdzone metadane HTTP; ręczny odczyt Vault nie wystarcza. Pierwotna odmowa dotyczy secret/data/dispatch; dostarczona aplikacja żąda secret/dispatch z istniejącym reader. Popraw wąską żywą politykę i ścieżkę aplikacji, potem odśwież cache pierwotnego procesu. Eksport zawiera tylko request_id, path, operation i reason. `curl -fsS --max-time 2 http://127.0.0.1:18081/status`.\n\n\n### Wąski odczyt zatwierdzonego źródła {#vault-pod-narrow-source-read}\n\nDostarczona policy reader początkowo wskazuje błędną ścieżkę danych albo uwierzytelniony odczyt zawodzi; zezwól na read dokumentowanej ścieżki KV-v2, zachowując odmowę other-data i audit.  `cat reader.hcl; cat consumer/README.md`.\n\n### Jawne dostarczenie danych {#vault-pod-explicit-delivery}\n\nPlik synchronizacji nie zawiera implementacji, więc Kubernetes Secret może brakować lub być stary; zbuduj odczyt źródła na żądanie i dostarczenie zatwierdzonej wartości do istniejącego odwołania secret. Błędy odczytu źródła lub Kubernetes też dają ten marker.  `bash -n sync-secret.sh; kubectl get secret route-secret -o json | jq \"{name:.metadata.name,keys:(.data|keys)}\"`.\n\n### Przyjęcie dostarczonego środowiska {#vault-pod-effective-secret}\n\nZmiana Secret nie aktualizuje środowiska istniejącego procesu; nazwany kontener może zachować starą wartość lub nie startować. Odnów Pod przez pierwotny kontroler, zachowując dostarczone odwołanie secret i program.  `kubectl get deployment relay -o json | jq .spec.template.spec.containers[].env; kubectl get pods`.\n\n### Pierwotna aplikacja i prywatne źródło {#vault-pod-original-application-agreement}\n\nPierwotna aplikacja może nadal używać dostarczonego manager credential lub starego cache, albo zmieniła się tożsamość procesu, konfiguracja źródła lub wąskie capabilities. Zachowaj prywatną dostarczoną tożsamość reader, odśwież ten sam proces przez SIGHUP i sprawdź zatwierdzone metadata; start, parsowanie i limity obserwacji też dają zbiorczy fallback. Config ma dokładnie url/path/token_file, używa zamrożonego URL/ścieżki API i pozostaje zwykłym plikiem z limitem rozmiaru. Credential to zwykły plik mode0600 właściciela uid1000 zgodny z dostarczoną tożsamością reader. Zachowane są PID, start procesu, komenda, principal/group/capability status i bajty programu. Metadata pokazują ready=true, zamrożone źródło, digest i całkowitą version. Osobna kontrola capabilities wymaga dispatch read i other-data/audit deny; dwa negatywne testy nie dowodzą odmowy wszystkich ścieżek Vault. Starsze obserwacje source/Secret/environment i aplikacji są niezależne; ich wczesne błędy lub limity mogą dać zbiorczy fallback. `jq . consumer/source.json; curl -fsS --max-time 2 http://127.0.0.1:18081/status; cat consumer/application.pid`.\n\n### Wdrożenie po dostarczeniu {#vault-pod-secret-blocked-rollout}\n\nPierwotny workload może być blokowany przez brak dostarczonego Secret lub inny błąd startu; sprawdź zdarzenia po synchronizacji źródła, zachowując Deployment.  `kubectl rollout status deployment/relay --timeout=3s; kubectl describe deployment relay`.\n\n### Zachowanie pierwotnego workload contract {#vault-pod-retained-workload-contract}\n\nTożsamość Deployment, selector, jedna replika lub pełna pod specification mogły się zmienić, albo jedyny bieżący należący Pod nie jest Ready z zatwierdzoną skuteczną wartością. Zachowaj image, program, security i odwołanie secret; błędy API, startu i limity dzielą fallback.  `kubectl get deployment relay -o json | jq \"{uid:.metadata.uid,replicas:.spec.replicas,selector:.spec.selector,template:.spec.template.spec}\"; kubectl get pods -o wide`.\n\n\n### Uruchomienie istniejącej usługi {#original-vault-start-existing-service}\n\nSetup zatrzymuje już zainicjalizowany pierwotny Vault; niedostępny endpoint nie oznacza potrzeby inicjalizacji danych. Złóż ograniczone żądanie startu z control/README.md i sprawdź ponownie. Błąd żądania, zła odpowiedź lub initialized false daje marker; sam kwit agenta nie dowodzi zdrowia usługi. `cat control/README.md vault-agent-status.json; source platform.env; curl -fsS --max-time 2 \"$VAULT_ADDR/v1/sys/init\" | jq .initialized`.\n\n### Obserwacja pierwotnej inicjalizacji {#original-vault-observe-original-initialization}\n\nPierwotny Vault jest już zainicjalizowany. Zatrzymana usługa, błąd seal-status lub nieczytelny JSON też narusza initialized; przywróć dostępność i sprawdź stan przed zmianą danych. Ponowna inicjalizacja lub wymiana storage może zniszczyć potrzebne tożsamości. `source platform.env; curl -fsS --max-time 2 \"$VAULT_ADDR/v1/sys/seal-status\" | jq \"{initialized,sealed}\"`.\n\n### Odpieczętowanie pierwotnego klastra {#original-vault-unseal-original-cluster}\n\nUruchomienie procesu pozostawia istniejący storage zapieczętowany. Prześlij dwie różne dostarczone części przez API odpieczętowania bez ich wypisywania; jedna nie wystarczy. Błąd odczytu stanu lub zła odpowiedź też narusza porównanie sealed false. `source platform.env; curl -fsS --max-time 2 \"$VAULT_ADDR/v1/sys/seal-status\" | jq \"{sealed,progress,t,n}\"`.\n\n### Zachowanie tożsamości klastra {#original-vault-retain-cluster-identity}\n\nInny Vault lub nowo zainicjalizowany storage może być dostępny i odpieczętowany, lecz mieć inny ID klastra. Przywróć pierwotną usługę i storage; porównaj cluster_id z zamrożonym original-cluster-id. Brak danych lub błąd obserwacji też narusza porównanie. `cat /run/dq/facts/0/original-cluster-id; source platform.env; curl -fsS --max-time 2 \"$VAULT_ADDR/v1/sys/seal-status\" | jq .cluster_id`.\n\n### Zachowanie kworum odzyskiwania {#original-vault-retain-recovery-quorum}\n\nPierwotna inicjalizacja ma próg t równy 2 i liczbę części n równą 3. Ponowna inicjalizacja lub inny endpoint może dać inne ustawienia; przywróć pierwotne źródło i zbadaj odpowiedź. Błąd żądania lub JSON też nie przejdzie; markery nie wymagają wypisywania części. `source platform.env; curl -fsS --max-time 2 \"$VAULT_ADDR/v1/sys/seal-status\" | jq \"{t,n}\"`.\n\n### Dostęp reader do źródła {#original-vault-reader-source-boundary}\n\nŻądanie źródła może zawieść przy zatrzymanym lub zapieczętowanym Vault, złym reader/ścieżce albo wartości innej niż north-secret. Sprawdź dostarczone reader przez prywatny kanał nagłówka; sukces źródła nie dowodzi aktualizacji pamięci aplikacji. `source platform.env; curl -fsS --max-time 2 -H @<(printf \"X-Vault-Token: %s\\n\" \"$VAULT_READER_TOKEN\") \"$VAULT_ADDR/v1/secret/data/dispatch\" | jq -e \".data.data.value == \"north-secret\"\" >/dev/null`.\n\n### Manager pozostaje bez dostępu {#original-vault-manager-remains-denied}\n\nUżycie reader zamiast manager albo nadanie manager dostępu do źródła narusza wymagany zakaz. Zachowaj osobną dostarczoną tożsamość manager i oczekuj HTTP 403 na ścieżce dispatch; awaria sieci, odpowiedź zapieczętowanego źródła lub inny kod też nie przejdą. `source platform.env; curl -sS --max-time 2 -o /dev/null -w \"%{http_code}\\n\" -H @<(printf \"X-Vault-Token: %s\\n\" \"$VAULT_MANAGER_TOKEN\") \"$VAULT_ADDR/v1/secret/data/dispatch\"`.\n\n### Prywatny tryb pliku części {#original-vault-private-share-file-mode}\n\nunseal-shares.json może zniknąć lub mieć zmienione uprawnienia po odzyskiwaniu. Przywróć tryb 0600 bez wyświetlania zawartości. Warunek porównuje tylko tryb, nie strukturę JSON i nie wymaga zmiany pierwotnego kworum. `stat -c \"%a %U\" unseal-shares.json`.\n\n### Łańcuch aplikacji z pamięcią podręczną {#original-vault-cached-consumer-chain}\n\nDostęp do Vault sam nie odświeża aplikacji. Pierwsza używa początkowo zablokowanego manager token; popraw dokładny profil i prywatny zwykły plik reader należący do UID 1000 z trybem 0600, następnie wyślij SIGHUP do pierwotnego procesu. Popraw stary URL downstream i wyślij SIGHUP po gotowości pierwszej. Porównaj statusy, logi i zamrożone digest/version; zmiany procesu, programu, uprawnień, błędne dane i nienazwane błędy obserwacji lub timeout też dają fallback. `cat consumer/source.json downstream/source.json consumer/application.log downstream/application.log; curl -fsS --max-time 2 http://127.0.0.1:18081/status; curl -fsS --max-time 2 http://127.0.0.1:18082/status`.\n\n### Wczesne dane platformy {#original-vault-early-platform-input}\n\nWarunek zawiódł przed nazwanym odczytem Vault, np. przez brak, nieczytelność lub błąd ładowania platform.env. Przywróć dostarczone środowisko i workspace; zwykłe błędy HTTP, stanu lub wartości są już nazwane. Fallback pojawia się tylko bez istniejącego markera, a sprzątanie prywatnych nagłówków zostaje w pierwotnym procesie potomnym. `test -r platform.env; bash -n platform.env; pwd`.\n\n\n### Odwołanie publikacji Secret {#credential-incident-secret-publication-reference}\n\nWydanie tokenu samo nie publikuje wartości Vault w Kubernetes. Użyj nowego station-token z dostarczonym sync-script i zachowaj efektywny ostatni ROUTE_SECRET powiązany z route-secret/value bez osadzonej wartości. Odkodowany Secret ma zawierać wymaganą linię north-secret. Brak danych, zła struktura worker/env, błędy API, JSON i decode dają fallback.\n\n```bash\nkubectl get deployment board -o json | jq \".spec.template.spec.containers[] | select(.name==\"worker\") | .env\"; kubectl get secret route-secret -o json | jq -er .data.value | base64 -d | grep -qx north-secret\n```\n\n### Prywatny ograniczony nowy token {#credential-incident-private-bounded-replacement}\n\nstation-token początkowo nie istnieje; ponowne użycie skompromitowanego reader lub tryb inny niż 0600 nie przejdzie. Wydaj token przez synchroniczny manager role z udokumentowanymi parametrami, zapisz prywatny wynik bez wypisywania i użyj innego nowego tokenu. Warunek wymaga dostępu do źródła, dokładnych policies [default, rail-reader] i TTL większego od 0, najwyżej 600 sekund; błędy lookup/read/API też zawodzą.\n\n```bash\nstat -c %a station-token; cat control/README.md; source platform.env; curl -fsS --max-time 2 -H @<(printf \"X-Vault-Token: %s\\n\" \"$(cat station-token)\") \"$VAULT_ADDR/v1/auth/token/lookup-self\" | jq \"{policies:.data.policies,ttl:.data.ttl}\"\n```\n\n### Unieważnienie skompromitowanego accessor {#credential-incident-compromised-accessor-revocation}\n\nNowy token nie unieważnia pierwotnego skompromitowanego reader. Wywołaj synchroniczny manager revoke-accessor z zamrożonym compromised-accessor; stare dane mają potem otrzymać HTTP 403 przy źródle. Błąd sieci lub inny kod nie dowodzi wymaganej odmowy, a statyczny issuer-status nie potwierdza unieważnienia.\n\n```bash\nsource platform.env; curl -sS --max-time 2 -o /dev/null -w \"%{http_code}\\n\" -H @<(printf \"X-Vault-Token: %s\\n\" \"$VAULT_READER_TOKEN\") \"$VAULT_ADDR/v1/secret/data/dispatch\"\n```\n\n### Opublikowany Secret trasy {#q100-published-route-secret}\n\nSecret Kubernetes może nie istnieć lub zawierać starszą wartość. Gdy odczyt z tokenem reader działa, uruchom dostarczoną synchronizację i sprawdź route-secret/value bez wypisywania zawartości.\n\n```bash\ntest \"$(kubectl get secret route-secret -o json | jq -er .data.value | base64 -d)\" = north-secret\n```\n\n### Dostęp readera do dispatch {#q100-reader-dispatch}\n\nDostarczony reader może nie mieć dostępu do secret/data/dispatch lub odpowiedź może zawierać inną wartość. Sprawdź politykę i oczekiwane pole bez wypisywania tokenu lub danych.\n\n```bash\nsource platform.env; curl -fsS --max-time 3 -H @<(printf \"X-Vault-Token: %s\\n\" \"$VAULT_READER_TOKEN\") \"$VAULT_ADDR/v1/secret/data/dispatch\" | jq -e '.data.data.value == \"north-secret\"' >/dev/null\n```\n\n### Odmowa na drugim adresie {#q100-reader-sibling-denial}\n\nZbyt szeroka polityka przypisana do tokenu reader może pozwalać na secret/data/other. Sprawdź, czy żądanie z tokenem reader zwraca HTTP 403, i odróżnij odmowę od timeoutu lub innego statusu.\n\n```bash\nsource platform.env; curl -sS --max-time 3 -o /dev/null -w \"%{http_code}\\n\" -H @<(printf \"X-Vault-Token: %s\\n\" \"$VAULT_READER_TOKEN\") \"$VAULT_ADDR/v1/secret/data/other\"\n```\n\n### Dane do kontroli Secretu {#q100-secret-probe-input}\n\nKontrola Secret może przerwać działanie przed porównaniem danych, jeśli brakuje środowiska lub katalogu. Sprawdź wejścia i dostęp do route-secret bez zapisywania wartości.\n\n```bash\npwd; test -r platform.env; kubectl get secret route-secret -o name\n```\n\n### Dane do kontroli readera {#q100-reader-probe-input}\n\nKontrola tokenu reader może przerwać działanie przed żądaniami HTTP, gdy nie można wczytać platform.env lub przygotować prywatnego nagłówka. Sprawdź wejścia i narzędzia bez wypisywania tokenu.\n\n```bash\npwd; test -r platform.env; command -v curl\n```\n"
