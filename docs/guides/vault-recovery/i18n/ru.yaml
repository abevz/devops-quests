heading: Восстановление Vault и KV-v2
text: "# Восстановление Vault и KV-v2\n\nДоступность Vault, seal, авторизация и принятые приложением данные — отдельные\
  \ границы. Эти примеры предназначены только для одноразовой игровой среды. У инициализированного запечатанного\
  \ сервера уже есть хранилище и ключи; повторная инициализация не является восстановлением. Сверяйте исходную идентичность\
  \ кластера. Здесь используется один файловый backend; задания не доказывают HA или аварийное восстановление из\
  \ снимков.\n\n## Наблюдение до изменений\nAPI статуса показывает инициализацию, seal и кворум. Квитанция запуска\
  \ описывает действие агента, а не постоянное здоровье приложения. Механизм управления описан в справочнике среды.\
  \ Файлы долей содержат синтетические данные и должны оставаться приватными. Не выводите доли, токены и секретные\
  \ ответы. Для общего примера самостоятельно выберите разрешённый файл долей и доступный адрес Vault:\n\n```bash\n\
  (\n set -euo pipefail\n umask 077\n : \"${VAULT_ADDR:?select the authorized Vault address}\"\n : \"${RECOVERY_SHARES:?select\
  \ the authorized recovery JSON file}\"\n request=$(mktemp)\n trap 'rm -f \"$request\"' EXIT\n count=$(jq -er 'length'\
  \ \"$RECOVERY_SHARES\")\n for ((i=0; i<count; i++)); do\n  jq -n --argjson i \"$i\" --slurpfile shares \"$RECOVERY_SHARES\"\
  \ '{key:$shares[0][$i]}' > \"$request\"\n  curl -fsS --max-time 3 -X PUT -H 'Content-Type: application/json' --data-binary\
  \ @\"$request\" \"$VAULT_ADDR/v1/sys/unseal\" >/dev/null\n done\n curl -fsS --max-time 3 \"$VAULT_ADDR/v1/sys/seal-status\"\
  \ | jq '{initialized,sealed,t,n,cluster_id}'\n)\n```\n\n## KV API и полномочия\nВ API-пути KV-v2 есть компонент\
  \ data внутри mount; логический путь CLI отличается. Сопоставьте фактический запрос приложения с нужным источником\
  \ и проверьте эффективные полномочия reader. Право manager обновлять одну политику не даёт права чтения данных;\
  \ в сценарии восстановления у manager может вовсе не быть права изменения политики. Не расширяйте полномочия ради\
  \ успешного потребителя. Перед общим приватным чтением выберите нужный путь API и существующую идентичность:\n\
  \n```bash\n(\n set -euo pipefail\n umask 077\n : \"${VAULT_ADDR:?select the authorized Vault address}\"\n : \"\
  ${KV_API_PATH:?select the intended KV API path}\"\n : \"${READER_TOKEN_FILE:?select the private existing reader\
  \ credential file}\"\n header=$(mktemp)\n trap 'rm -f \"$header\"' EXIT\n printf 'X-Vault-Token: %s\\n' \"$(cat\
  \ \"$READER_TOKEN_FILE\")\" > \"$header\"\n curl -fsS --max-time 3 -H @\"$header\" \"$VAULT_ADDR/v1/$KV_API_PATH\"\
  \ | jq -e '.data.metadata.version > 0' >/dev/null\n echo OK\n)\n```\n\n## Построение и распространение\nРабочая\
  \ заготовка синхронизации, например sync-secret.sh, не является непрерывным контроллером и может содержать только\
  \ каркас. Постройте доставку через API источника и получателя. Обновление Kubernetes Secret не меняет переменные\
  \ окружения уже работающего процесса. Сохраните контроллер, программу pod и ссылку на источник; после rollout\
  \ проверяйте каждый активный принадлежащий ему pod.\n\nПриложение с кешем может обновляться при старте или по\
  \ сигналу. Здоровый источник не доказывает принятие данных потребителем. Сопоставляйте идентичность источника,\
  \ хранение учётных данных, версию и хеш публикации на каждой границе. Потребители обновляются независимо: сначала\
  \ исправьте upstream, затем обновите downstream. Сохраняйте идентичность и привилегии процессов вместо подмены\
  \ приложения. Общая проверка статуса не ремонтирует и не обновляет приложение:\n\n```bash\n(\n set -euo pipefail\n\
  \ : \"${APPLICATION_URL:?select the existing application base URL}\"\n curl -fsS --max-time 3 \"$APPLICATION_URL/status\"\
  \ | jq '{ready,error,status,source,path,version,value_sha256}'\n)\n```\n\n## Сопоставление аудита\nЗапросы и ответы\
  \ аудита связаны через request.id. Сравните операцию и путь с первоначальным наблюдением приложения: одинаковые\
  \ отказы могут иметь разные причины. Экспортируйте только request_id, path, operation и reason. Сырые данные аутентификации\
  \ и секреты не должны попадать в отчёты. Зафиксируйте отказ до изменения политики, а затем отдельно проверьте\
  \ разрешённый доступ, отрицательные проверки полномочий и публикацию потребителя.\n\nAPI: [схема аудита](https://developer.hashicorp.com/vault/docs/audit/schema),\
  \ [unseal](https://developer.hashicorp.com/vault/api-docs/system/unseal), [чтение KV-v2](https://developer.hashicorp.com/vault/api-docs/secret/kv/kv-v2#read-secret-version).\n\
  \n## Аренды, ротация и составная доставка\n\nИстёкший токен не может продлить сам себя. Отличайте продление действующей\
  \ возобновляемой аренды от выпуска замены через ограниченную роль. Проверяйте фактический TTL, возобновляемость\
  \ и ограничения роли, не выводя учётные данные. Отказ отозванного токена и успешное чтение заменой доказывают\
  \ разные границы: проверьте обе и принятие замены потребителями. Не помещайте учётные данные в Git или метаданные\
  \ публикации.\n\nВ составной доставке здоровье контроллера не доказывает авторизацию источника и принятие данных\
  \ потребителем. Отдельно проверяйте согласование источника, приватный доступ к образу, доставку секрета и ответ\
  \ приложения. Задания 044, 048, 070, 099 и 100 применяют эти понятия к политикам, продлению, ротации и доставке;\
  \ нужные пути и ограничения определяйте по их контрактам.\n\n\n### Чтение сохранённой политики {#vault-policy-observation}\n\nМенеджер не смог прочитать rail-reader: у токена может не быть доступа к политике, Vault может быть недоступен либо ответ API не содержит читаемой политики. Для sys/policies/acl/rail-reader используйте менеджера. Ошибка чтения может также вызвать policy_scope из-за отсутствия читаемой политики; сначала восстановите доступ.\n\n### Один путь данных KV-v2 {#vault-policy-scope}\n\nСохранённая политика недоступна либо не ограничена read на secret/data/dispatch: могли остаться начальный неверный путь, лишние разрешения, шаблоны путей или неподдерживаемая структура. Выданный apply-policy.sh отправляет reader.hcl; изменение только локального файла не меняет Vault. Нужное правило: path \"secret/data/dispatch\" { capabilities = [\"read\"] }. Допустимы комментарии HCL и одинаковые блоки read; JSON требует только этот путь и read, допускает известные ограничения параметров и wrapping, но не повторяющиеся ключи.\n\n### Входные данные проверки Vault {#vault-inputs}\n\nПроверка политики остановилась до подробных наблюдений: platform.env, переменные токенов и адреса, временные файлы заголовков или инструменты проверки могут быть недоступны. Проверка чтения или capabilities не смогла подготовить данные либо очистить временные файлы: platform.env, переменные Vault, заголовки или файл запроса могут быть недоступны. Работайте в ~/quest и загрузите выданный platform.env без вывода токенов. Файлы заголовков создаются приватно и удаляются при выходе. До анализа ACL проверьте запись в каталог и запуск нужных инструментов.\n\n### Проверка от имени читателя {#vault-reader-value}\n\nЧитатель не получил north-secret: политика могла остаться на secret/data/wrong, токен может быть некорректен либо ответ KV-v2 недоступен или изменён. Чтение KV-v2 использует /v1/secret/data/dispatch и значение .data.data.value. Доступ менеджера не заменяет успешный запрос с VAULT_READER_TOKEN.\n\n### Фактические разрешения и запреты {#vault-effective-access}\n\nCapability читателя на dispatch не равна ровно read либо не прочитана: причиной могут быть неверный путь политики, дополнительные политики токена или сбой capabilities-self. Для secret/data/wrong читатель не сообщил только deny либо ответ недоступен: причиной могут быть начальное разрешение неверного пути, широкие или дополнительные политики токена либо сбой API. Запросите /v1/sys/capabilities-self токеном читателя для dispatch, wrong, other и sys/mounts. Нужны ровно [read] для secret/data/dispatch и [deny] для остальных трёх; сбой или некорректный ответ даёт ошибки по всем путям. Шаблон пути или другая политика токена могут оставить лишний доступ даже при успешном чтении.\n"
