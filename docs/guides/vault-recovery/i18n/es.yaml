heading: Recuperación de Vault y KV-v2
text: "# Recuperación de Vault y KV-v2\n\nDisponibilidad de Vault, sellado, autorización y datos adoptados por aplicaciones\
  \ son límites distintos. Usa estas referencias solo en la bahía desechable. Un servidor inicializado y sellado\
  \ ya tiene almacenamiento y claves; reinicializar no es recuperar. Compara la identidad original del clúster.\
  \ Aquí existe un único backend de archivos; los ejercicios no demuestran HA ni recuperación desde instantáneas.\n\
  \n## Observar antes de cambiar\nLa API de estado informa inicialización, sellado y cuórum. Un recibo de inicio\
  \ describe actividad del agente, no salud continua. Consulta el manual de control. Las participaciones sintéticas\
  \ deben permanecer privadas. Nunca imprimas participaciones, tokens ni respuestas secretas. Este ejemplo genérico\
  \ requiere elegir un archivo de recuperación autorizado y una dirección accesible:\n\n```bash\n(\n set -euo pipefail\n\
  \ umask 077\n : \"${VAULT_ADDR:?select the authorized Vault address}\"\n : \"${RECOVERY_SHARES:?select the authorized\
  \ recovery JSON file}\"\n request=$(mktemp)\n trap 'rm -f \"$request\"' EXIT\n count=$(jq -er 'length' \"$RECOVERY_SHARES\"\
  )\n for ((i=0; i<count; i++)); do\n  jq -n --argjson i \"$i\" --slurpfile shares \"$RECOVERY_SHARES\" '{key:$shares[0][$i]}'\
  \ > \"$request\"\n  curl -fsS --max-time 3 -X PUT -H 'Content-Type: application/json' --data-binary @\"$request\"\
  \ \"$VAULT_ADDR/v1/sys/unseal\" >/dev/null\n done\n curl -fsS --max-time 3 \"$VAULT_ADDR/v1/sys/seal-status\"\
  \ | jq '{initialized,sealed,t,n,cluster_id}'\n)\n```\n\n## API KV y autoridad\nLa ruta API KV-v2 incluye data\
  \ bajo su montaje; la ruta lógica CLI es diferente. Compara la solicitud real de la aplicación con la fuente prevista\
  \ y comprueba los permisos efectivos de reader. Un manager autorizado para actualizar una política no es automáticamente\
  \ lector; en recuperación puede no tener ningún permiso de edición. No amplíes permisos para conseguir éxito.\
  \ Elige la ruta API y la identidad existente antes de esta lectura privada genérica:\n\n```bash\n(\n set -euo\
  \ pipefail\n umask 077\n : \"${VAULT_ADDR:?select the authorized Vault address}\"\n : \"${KV_API_PATH:?select\
  \ the intended KV API path}\"\n : \"${READER_TOKEN_FILE:?select the private existing reader credential file}\"\
  \n header=$(mktemp)\n trap 'rm -f \"$header\"' EXIT\n printf 'X-Vault-Token: %s\\n' \"$(cat \"$READER_TOKEN_FILE\"\
  )\" > \"$header\"\n curl -fsS --max-time 3 -H @\"$header\" \"$VAULT_ADDR/v1/$KV_API_PATH\" | jq -e '.data.metadata.version\
  \ > 0' >/dev/null\n echo OK\n)\n```\n\n## Construcción y propagación\nUn espacio de sincronización como sync-secret.sh\
  \ no es un controlador continuo y puede contener solo un esqueleto. Construye la entrega mediante las API de origen\
  \ y destino. Actualizar un Secret Kubernetes no modifica el entorno de procesos ya iniciados. Conserva controlador,\
  \ programa y referencia; comprueba cada pod activo propio después del despliegue.\n\nUna aplicación con caché\
  \ puede actualizarse al iniciar o mediante señal. Una fuente sana no demuestra adopción por el consumidor. Compara\
  \ identidad de fuente, custodia de credenciales, versión y resumen en cada límite. Los consumidores se actualizan\
  \ independientemente: repara primero el origen y después adopta los datos aguas abajo. Conserva identidades y\
  \ privilegios de procesos. Esta inspección genérica no repara ni actualiza aplicaciones:\n\n```bash\n(\n set -euo\
  \ pipefail\n : \"${APPLICATION_URL:?select the existing application base URL}\"\n curl -fsS --max-time 3 \"$APPLICATION_URL/status\"\
  \ | jq '{ready,error,status,source,path,version,value_sha256}'\n)\n```\n\n## Correlación de auditoría\nSolicitudes\
  \ y respuestas se unen mediante request.id. Compara operación y ruta con la observación inicial de la aplicación:\
  \ dos denegaciones pueden tener causas diferentes. Exporta solo request_id, path, operation y reason. No copies\
  \ autenticación sin filtrar ni secretos a informes. Registra la denegación antes de cambiar la política; después\
  \ verifica acceso permitido, capacidades negativas y publicación adoptada por separado.\n\nAPI: [esquema de auditoría](https://developer.hashicorp.com/vault/docs/audit/schema),\
  \ [unseal](https://developer.hashicorp.com/vault/api-docs/system/unseal), [lectura KV-v2](https://developer.hashicorp.com/vault/api-docs/secret/kv/kv-v2#read-secret-version).\n\
  \n## Arrendamientos, rotación y entrega combinada\n\nUn token caducado no puede renovarse. Distingue la renovación\
  \ de un arrendamiento válido renovable de la emisión de un reemplazo mediante un rol limitado. Compara TTL efectivo,\
  \ renovación y límites sin imprimir credenciales. La denegación del token revocado y la lectura del reemplazo\
  \ prueban límites distintos; verifica ambos y su adopción por consumidores. Mantén credenciales fuera de Git y\
  \ metadatos de publicación.\n\nEn una cadena de entrega, la salud del controlador no demuestra autorización ni\
  \ adopción. Separa reconciliación de fuente, acceso privado a imágenes, entrega de secretos y respuesta real.\
  \ Los ejercicios 044, 048, 070, 099 y 100 aplican estos conceptos a políticas, renovación, rotación y entrega\
  \ reconciliada; determina rutas y límites mediante sus contratos.\n"
