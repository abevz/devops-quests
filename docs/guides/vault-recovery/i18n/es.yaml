heading: Recuperación de Vault y KV-v2
text: "# Recuperación de Vault y KV-v2\n\nEsta guía es solo para la bahía desechable del juego. Vault puede estar inicializado y sellado: inicializar crea el almacenamiento y las claves, mientras que desellar hace accesibles los datos existentes. Nunca inicialices de nuevo, imprimas fragmentos o tokens ni uses estos pasos en un Vault real. En la bahía, `platform.env` proporciona la dirección y tokens separados de manager y reader. Manager edita la política de lectura; reader lee el secreto permitido.\n\nSolo en las misiones 065 y 093, `unseal-shares.json` contiene dos fragmentos distintos del juego. Consérvalo como un array JSON de dos cadenas con modo `0600` (`chmod 600 unseal-shares.json`). Cada petición a `/v1/sys/unseal` lleva un fragmento en el campo `key`; dos fragmentos distintos cumplen el umbral de la bahía, 2 de 3. El ejemplo usa archivos temporales privados, los elimina al salir y solo muestra el estado del sello. Ejecútalo solo cuando el Vault del juego sea accesible y esté sellado:\n\n```bash\n(\n  set -euo pipefail\n  umask 077\n  cd ~/quest\n  source platform.env\n  request=$(mktemp)\n  trap 'rm -f \"$request\"' EXIT\n  for i in 0 1; do\n    jq -n --argjson i \"$i\" --slurpfile shares unseal-shares.json \\\n      '{key:$shares[0][$i]}' > \"$request\"\n    curl -fsS -X PUT -H 'Content-Type: application/json' \\\n      --data-binary @\"$request\" \"$VAULT_ADDR/v1/sys/unseal\" >/dev/null\n  done\n  curl -fsS \"$VAULT_ADDR/v1/sys/seal-status\" | jq '{initialized,sealed,t,n}'\n)\n```\n\nEn KV-v2, `secret` es el punto de montaje y la ruta de lectura de la API es `/v1/secret/data/dispatch`; el valor está en `.data.data.value`. El token reader necesita `read` en `secret/data/dispatch`. Este ejemplo comprueba el valor desechable esperado sin mostrar el token ni la respuesta:\n\n```bash\n(\n  set -euo pipefail\n  umask 077\n  cd ~/quest\n  source platform.env\n  header=$(mktemp)\n  trap 'rm -f \"$header\"' EXIT\n  printf 'X-Vault-Token: %s\\n' \"$VAULT_READER_TOKEN\" > \"$header\"\n  curl -fsS -H @\"$header\" \"$VAULT_ADDR/v1/secret/data/dispatch\" \\\n    | jq -e '.data.data.value == \"north-secret\"' >/dev/null\n  echo OK\n)\n```\n\nEn la misión 083, Vault ya está desellado: corrige la política `rail-reader` con el token manager, ejecuta el `sync-secret.sh` suministrado y espera el despliegue de `deployment/relay`. El script bajo demanda es un adaptador de la bahía, no un controlador continuo; tras cambiar un Secret puede ser necesario reiniciar el proceso. Comprueba la clave `value` del Secret y la variable de proceso `ROUTE_SECRET` sin mostrar credenciales. En la misión 093, el agente limitado inicia el proceso existente cuando `vault-repair.json` contiene `{\"action\":\"start\"}`; espera antes de desellar. Una respuesta 403 del manager en la ruta KV significa que se denegó ese token. El estado y el acceso actuales no prueban toda la historia de recuperación.\n\nEn la misión 083, este ejemplo escribe la política restringida de reader y ejecuta la sincronización suministrada:\n\n```bash\n(\n  set -euo pipefail\n  umask 077\n  cd ~/quest\n  cat > reader.hcl <<'POLICY'\npath \"secret/data/dispatch\" { capabilities = [\"read\"] }\nPOLICY\n  source platform.env\n  header=$(mktemp)\n  payload=$(mktemp)\n  trap 'rm -f \"$header\" \"$payload\"' EXIT\n  printf 'X-Vault-Token: %s\\n' \"$VAULT_MANAGER_TOKEN\" > \"$header\"\n  jq -n --rawfile policy reader.hcl '{policy:$policy}' > \"$payload\"\n  curl -fsS -X PUT -H @\"$header\" -H 'Content-Type: application/json' \\\n    --data-binary @\"$payload\" \"$VAULT_ADDR/v1/sys/policies/acl/rail-reader\" >/dev/null\n  bash sync-secret.sh\n  kubectl rollout status deployment/relay --timeout=90s\n)\n```\n\nReferencias de API: [unseal](https://developer.hashicorp.com/vault/api-docs/system/unseal), [lectura KV-v2](https://developer.hashicorp.com/vault/api-docs/secret/kv/kv-v2#read-secret-version).\n"
