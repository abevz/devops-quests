heading: Recuperación de Vault y KV-v2
text: "# Recuperación de Vault y KV-v2\n\nDisponibilidad de Vault, sellado, autorización y datos adoptados por aplicaciones\
  \ son límites distintos. Usa estas referencias solo en la bahía desechable. Un servidor inicializado y sellado\
  \ ya tiene almacenamiento y claves; reinicializar no es recuperar. Compara la identidad original del clúster.\
  \ Aquí existe un único backend de archivos; los ejercicios no demuestran HA ni recuperación desde instantáneas.\n\
  \n## Observar antes de cambiar\nLa API de estado informa inicialización, sellado y cuórum. Un recibo de inicio\
  \ describe actividad del agente, no salud continua. Consulta el manual de control. Las participaciones sintéticas\
  \ deben permanecer privadas. Nunca imprimas participaciones, tokens ni respuestas secretas. Este ejemplo genérico\
  \ requiere elegir un archivo de recuperación autorizado y una dirección accesible:\n\n```bash\n(\n set -euo pipefail\n\
  \ umask 077\n : \"${VAULT_ADDR:?select the authorized Vault address}\"\n : \"${RECOVERY_SHARES:?select the authorized\
  \ recovery JSON file}\"\n request=$(mktemp)\n trap 'rm -f \"$request\"' EXIT\n count=$(jq -er 'length' \"$RECOVERY_SHARES\"\
  )\n for ((i=0; i<count; i++)); do\n  jq -n --argjson i \"$i\" --slurpfile shares \"$RECOVERY_SHARES\" '{key:$shares[0][$i]}'\
  \ > \"$request\"\n  curl -fsS --max-time 3 -X PUT -H 'Content-Type: application/json' --data-binary @\"$request\"\
  \ \"$VAULT_ADDR/v1/sys/unseal\" >/dev/null\n done\n curl -fsS --max-time 3 \"$VAULT_ADDR/v1/sys/seal-status\"\
  \ | jq '{initialized,sealed,t,n,cluster_id}'\n)\n```\n\n## API KV y autoridad\nLa ruta API KV-v2 incluye data\
  \ bajo su montaje; la ruta lógica CLI es diferente. Compara la solicitud real de la aplicación con la fuente prevista\
  \ y comprueba los permisos efectivos de reader. Un manager autorizado para actualizar una política no es automáticamente\
  \ lector; en recuperación puede no tener ningún permiso de edición. No amplíes permisos para conseguir éxito.\
  \ Elige la ruta API y la identidad existente antes de esta lectura privada genérica:\n\n```bash\n(\n set -euo\
  \ pipefail\n umask 077\n : \"${VAULT_ADDR:?select the authorized Vault address}\"\n : \"${KV_API_PATH:?select\
  \ the intended KV API path}\"\n : \"${READER_TOKEN_FILE:?select the private existing reader credential file}\"\
  \n header=$(mktemp)\n trap 'rm -f \"$header\"' EXIT\n printf 'X-Vault-Token: %s\\n' \"$(cat \"$READER_TOKEN_FILE\"\
  )\" > \"$header\"\n curl -fsS --max-time 3 -H @\"$header\" \"$VAULT_ADDR/v1/$KV_API_PATH\" | jq -e '.data.metadata.version\
  \ > 0' >/dev/null\n echo OK\n)\n```\n\n## Construcción y propagación\nUn espacio de sincronización como sync-secret.sh\
  \ no es un controlador continuo y puede contener solo un esqueleto. Construye la entrega mediante las API de origen\
  \ y destino. Actualizar un Secret Kubernetes no modifica el entorno de procesos ya iniciados. Conserva controlador,\
  \ programa y referencia; comprueba cada pod activo propio después del despliegue.\n\nUna aplicación con caché\
  \ puede actualizarse al iniciar o mediante señal. Una fuente sana no demuestra adopción por el consumidor. Compara\
  \ identidad de fuente, custodia de credenciales, versión y resumen en cada límite. Los consumidores se actualizan\
  \ independientemente: repara primero el origen y después adopta los datos aguas abajo. Conserva identidades y\
  \ privilegios de procesos. Esta inspección genérica no repara ni actualiza aplicaciones:\n\n```bash\n(\n set -euo\
  \ pipefail\n : \"${APPLICATION_URL:?select the existing application base URL}\"\n curl -fsS --max-time 3 \"$APPLICATION_URL/status\"\
  \ | jq '{ready,error,status,source,path,version,value_sha256}'\n)\n```\n\n## Correlación de auditoría\nSolicitudes\
  \ y respuestas se unen mediante request.id. Compara operación y ruta con la observación inicial de la aplicación:\
  \ dos denegaciones pueden tener causas diferentes. Exporta solo request_id, path, operation y reason. No copies\
  \ autenticación sin filtrar ni secretos a informes. Registra la denegación antes de cambiar la política; después\
  \ verifica acceso permitido, capacidades negativas y publicación adoptada por separado.\n\nAPI: [esquema de auditoría](https://developer.hashicorp.com/vault/docs/audit/schema),\
  \ [unseal](https://developer.hashicorp.com/vault/api-docs/system/unseal), [lectura KV-v2](https://developer.hashicorp.com/vault/api-docs/secret/kv/kv-v2#read-secret-version).\n\
  \n## Arrendamientos, rotación y entrega combinada\n\nUn token caducado no puede renovarse. Distingue la renovación\
  \ de un arrendamiento válido renovable de la emisión de un reemplazo mediante un rol limitado. Compara TTL efectivo,\
  \ renovación y límites sin imprimir credenciales. La denegación del token revocado y la lectura del reemplazo\
  \ prueban límites distintos; verifica ambos y su adopción por consumidores. Mantén credenciales fuera de Git y\
  \ metadatos de publicación.\n\nEn una cadena de entrega, la salud del controlador no demuestra autorización ni\
  \ adopción. Separa reconciliación de fuente, acceso privado a imágenes, entrega de secretos y respuesta real.\
  \ Los ejercicios 044, 048, 070, 099 y 100 aplican estos conceptos a políticas, renovación, rotación y entrega\
  \ reconciliada; determina rutas y límites mediante sus contratos.\n\n\n### Leer la política guardada {#vault-policy-observation}\n\nEl gestor no pudo leer rail-reader; su token puede carecer de acceso a la política, Vault puede no estar disponible o la respuesta API no contiene una política legible. Use la identidad gestora para sys/policies/acl/rail-reader. Un fallo de lectura también puede producir policy_scope por falta de política legible; restaure el acceso primero.\n\n### Una ruta de datos KV-v2 {#vault-policy-scope}\n\nLa política guardada es ilegible o no se limita a read en secret/data/dispatch; pueden persistir la ruta inicial incorrecta, permisos adicionales, comodines o una estructura no admitida. apply-policy.sh envía reader.hcl; editar solo el archivo local no cambia Vault. La regla deseada es path \"secret/data/dispatch\" { capabilities = [\"read\"] }. Se admiten comentarios HCL y bloques read idénticos repetidos; JSON exige solo esta ruta y read, admite restricciones conocidas de parámetros y wrapping, pero no claves duplicadas.\n\n### Entradas del observador Vault {#vault-inputs}\n\nLa prueba de política se detuvo antes del diagnóstico detallado; platform.env, variables de token y dirección, archivos temporales de cabeceras o herramientas pueden no estar disponibles. La prueba de lectura o capabilities no pudo preparar entradas o limpiarlas; platform.env, variables Vault, cabeceras temporales o el archivo de solicitud pueden no estar disponibles. Trabaje en ~/quest y cargue platform.env sin mostrar tokens. Los archivos de cabeceras son privados y se borran al salir. Antes de investigar ACL, compruebe escritura en el directorio e inicio de herramientas.\n\n### Observar con la identidad lectora {#vault-reader-value}\n\nEl lector no obtuvo north-secret; la política puede seguir apuntando a secret/data/wrong, el token puede ser inválido o la respuesta KV-v2 falta o cambió. La lectura KV-v2 usa /v1/secret/data/dispatch y devuelve .data.data.value. El acceso gestor no sustituye una petición correcta con VAULT_READER_TOKEN.\n\n### Acceso efectivo permitido y denegado {#vault-effective-access}\n\nLa capacidad del lector en dispatch no es exactamente read o no se pudo observar; puede deberse a la ruta incorrecta, políticas extra del token o un fallo de capabilities-self. El lector no informó solo deny en secret/data/wrong o la respuesta es ilegible; puede deberse al permiso inicial de la ruta equivocada, políticas amplias o extra del token o un fallo API. Consulte /v1/sys/capabilities-self con el token lector para dispatch, wrong, other y sys/mounts. Se exige exactamente [read] en secret/data/dispatch y [deny] en las otras tres; una respuesta fallida o inválida falla en cada ruta. Un comodín u otra política puede conservar acceso extra aunque la lectura positiva funcione.\n\n\n### Permisos privados del archivo de token {#renewal-token-file}\n\nstation-token falta, es ilegible o no tiene modo 0600; guardarlo o recrearlo sin permisos privados puede exponer la credencial. `stat -c %a station-token`.\n\n### Duración de concesión y límites de renovación {#renewal-token-lease}\n\nLa concesión de station-token no cumple TTL >90, renewable=true, max TTL 600 y las políticas requeridas, o falló lookup; los 45 segundos iniciales o renovar por 10 segundos no bastan. platform.env o entradas de token ilegibles, o fallos al iniciar curl/jq, también pueden impedir la observación. La plataforma crea station-token antes del setup con modo 0600 y una concesión renovable inicial de 45 segundos, limitada a 600. issue-token.sh pide 60 segundos; renew-request.json empieza pidiendo 10. Emita un token válido mediante el rol suministrado, solicite suficiente renovación y observe TTL mientras supere 90. Las políticas deben ser exactamente default y rail-reader; editar JSON no renueva por sí solo un token vencido.\n\n### Capacidades efectivas del token {#renewal-token-access}\n\nstation-token no informó exactamente read en dispatch y deny en otros datos y administración de mounts; puede deberse a política incorrecta, token inválido o vencido, entradas ilegibles o fallo API. platform.env o entradas de token ilegibles, o fallos al iniciar curl/jq, también pueden impedir la observación. El archivo de solicitud capabilities debe poder escribirse. Consulte con station-token secret/data/dispatch, secret/data/other y sys/mounts; exija exactamente [read], [deny] y [deny]. Una operación gestora correcta no demuestra esos permisos de station-token.\n\n### Rol limitado del emisor {#renewal-issuer-access}\n\nEl emisor no informó solo update en auth/token/create/rail-station y deny para editar políticas y otras emisiones; su token gestor o entorno puede ser incorrecto, tener privilegios excesivos o no estar disponible. platform.env o entradas de token ilegibles, o fallos al iniciar curl/jq, también pueden impedir la observación. Para VAULT_MANAGER_TOKEN se exige [update] solo en auth/token/create/rail-station y [deny] en sys/policies/acl/rail-reader y auth/token/create/other. Este setup usa emisión limitada, no el editor de políticas de 044; el JSON de solicitud debe poder escribirse y la respuesta API leerse.\n\n### Consumidor de Secret sin tokens Vault {#renewal-secret-consumer}\n\nNo se pudo verificar Deployment reader alimentado por Secret sin exponer tokens Vault; la referencia ROUTE, Pods actuales, datos renovados del Secret, tokens filtrados en manifiesto o entorno o entradas de observación pueden ser incorrectos o no estar disponibles. La última entrada ROUTE efectiva de worker debe usar route-secret/value sin valor literal no vacío. El JSON Deployment no debe contener tokens de station-token, gestor ni lector original. Debe haber Pods actuales no terminados ni en borrado, propios por ReplicaSets controladores del UID Deployment; todos Running y env de cada contenedor normal sin esos tokens. worker debe leer north-secret de /tmp/route. sync-secret.sh lee station-token y solo actualiza datos Secret; reinicie el consumidor porque su entorno existente no se renueva automáticamente. Entradas o token ausentes, JSON API inválido, Python o herramientas no disponibles y fallos exec también causan este diagnóstico.\n\n### Disponibilidad tras sincronizar Secret {#renewal-consumer-readiness}\n\nDeployment reader no completó el despliegue en 3 segundos; puede faltar route-secret o la carga aún está arrancando, y también puede fallar la observación o las entradas de plataforma. `kubectl describe pods; kubectl rollout status deployment/reader --timeout=10s`.\n\n\n### Recuperar almacenamiento ya inicializado {#sealed-existing-initialized-store}\n\nEl estado no confirmó initialized=true; la dirección puede apuntar a almacenamiento vacío/sustituido o la respuesta ser inválida/no disponible. El Vault suministrado ya estaba inicializado.  `source platform.env; curl -fsS --max-time 3 \"$VAULT_ADDR/v1/sys/seal-status\" | jq '{initialized}'`.\n\n### Partes distintas avanzan el unseal {#sealed-distinct-unseal-progress}\n\nEl estado no confirmó sealed=false; pueden haberse enviado menos de dos partes distintas, repetido la misma o fallado la consulta de estado.  `source platform.env; curl -fsS --max-time 3 \"$VAULT_ADDR/v1/sys/seal-status\" | jq '{sealed,progress,t}'`.\n\n### Conservar umbral original {#sealed-original-recovery-threshold}\n\nEl estado no confirmó t=2; ajustes de inicialización/rekey cambiados, otro endpoint o respuesta ilegible pueden ocultar el umbral original.  `source platform.env; curl -fsS --max-time 3 \"$VAULT_ADDR/v1/sys/seal-status\" | jq '{t,n}'`.\n\n### Conservar número de partes inicializadas {#sealed-original-share-count}\n\nEl estado no confirmó n=3; otra configuración de inicialización/rekey, endpoint incorrecto o fallo de observación puede diferir del número total original de partes.  `source platform.env; curl -fsS --max-time 3 \"$VAULT_ADDR/v1/sys/seal-status\" | jq '{t,n}'`.\n\n### Identidad original del clúster y observaciones {#sealed-original-cluster-identity}\n\nNo se verificó la identidad original del clúster Vault; reinicializar/sustituir almacenamiento cambia cluster ID, y evidencia protegida ausente, endpoint original no disponible o fallo de inicio también impide comparar. Los campos de estado usan platform.env; la observación separada consulta el origen protegido consumer-contract.json y compara cluster_id con original-cluster-id. Conserve almacenamiento original en archivos y quórum. Un servidor nuevo inicializado con el mismo umbral sigue siendo otro clúster. `source platform.env; curl -fsS --max-time 3 \"$VAULT_ADDR/v1/sys/seal-status\" | jq '{cluster_id}'; cat original-cluster-id`.\n\n### Permisos privados del archivo de recuperación {#sealed-private-share-permissions}\n\nunseal-shares.json no informó modo 600 o no pudo inspeccionarse; copiar/recrear el archivo con permisos amplios o de ejecución puede exponer las partes suministradas.  `stat -c %a unseal-shares.json`.\n\n### Forma de array del archivo de recuperación {#sealed-share-array-shape}\n\nunseal-shares.json no es un array JSON legible; respuesta completa de inicialización, una parte suelta o JSON inválido puede sustituir la forma suministrada.  `jq -e 'type==\"array\"' unseal-shares.json`.\n\n### Exactamente dos partes conservadas {#sealed-two-retained-shares}\n\nEl array de recuperación no contiene exactamente dos entradas o no se analiza; copiar las tres partes iniciales, perder una o cambiar estructura incumple el contrato del archivo. El servidor original usa tres partes y umbral de dos, pero este archivo contiene solo dos partes suministradas. Las pruebas locales validan forma y strings distintos; no comparan criptográficamente cada string con las claves del servidor. `jq -e 'type==\"array\" and length==2' unseal-shares.json`.\n\n### Entradas de partes como strings {#sealed-string-share-entries}\n\nLas entradas no son todas strings JSON o el array es ilegible; números, objetos o resultado de inicialización mal envuelto no conservan la representación de partes como texto.  `jq -e 'type==\"array\" and all(.[];type==\"string\")' unseal-shares.json`.\n\n### Dos entradas distintas en archivo de recuperación {#sealed-distinct-share-file}\n\nLas dos entradas no son distintas o el array es inválido; duplicar una parte suministrada no aporta dos contribuciones distintas al unseal.  `jq -e 'type==\"array\" and length==2 and .[0]!=.[1]' unseal-shares.json`.\n\n### Leer con identidad reader suministrada {#sealed-approved-reader-api}\n\nEl reader suministrado no leyó north-secret en secret/data/dispatch; Vault puede seguir sealed, entorno/token/ruta diferir del origen o fallar la observación API/JSON. La política reader ya permite API KV-v2 secret/data/dispatch. La identidad manager separada tiene denegado ese acceso aquí. Verifique unseal del origen y use reader suministrado; una lectura directa correcta no refresca caché de aplicación. `source platform.env; curl -fsS --max-time 3 -H @<(printf 'X-Vault-Token: %s\\n' \"$VAULT_READER_TOKEN\") \"$VAULT_ADDR/v1/secret/data/dispatch\" | jq -e '.data.data.value==\"north-secret\"'`.\n\n### Credencial y caché del consumidor original {#sealed-original-consumer-adoption}\n\nEl consumidor original no verificó publicación Vault con identidad reader privada; su archivo puede conservar manager suministrado o caché de error antigua, y cambios de proceso/programa/configuración, custodia del token u observación ausente también lo explican. La aplicación inicia con Vault sealed y token_file contiene manager inicialmente. Lee configuración al iniciar o con SIGHUP; las peticiones no refrescan caché. Repare configuración con campos exactos url/path/token_file y archivo regular reader propiedad UID 1000, modo 0600 y huella protegida; rutas relativas o absolutas se admiten. Envíe SIGHUP al PID existente conservando identidad, programa y privilegios. La respuesta conserva origen/ruta Vault, SHA-256, versión entera 1 y ready=true. `cat consumer/source.json consumer/README.md; curl -fsS --max-time 3 http://127.0.0.1:18081/status`.\n\n\n### Causa y observación (070, secret_value) {#secret-vault-to-kubernetes-publication}\n\nCorregir solo política Vault no entrega valor a Kubernetes; sync-secret.sh suministrado debe leer y publicar route-secret/value. La primera etapa corrige ruta Application; la segunda corrige política reader suministrada y publica Secret con adaptador completo sync-secret.sh. La política correcta sola no crea objeto Kubernetes. Observe desde ~/quest tras cargar platform.env.\n\n```bash\nkubectl get secret route-secret -o json | jq '(.data.value | @base64d)==\"north-secret\"'\n```\n\n### Causa y observación (070, secret_capabilities) {#secret-reader-exact-path-capabilities}\n\nLa política reader suministrada apunta a ruta KV-v2 incorrecta o concede acceso extra; exija read en secret/data/dispatch y deny en secret/data/unrelated y sys/mounts. La primera etapa corrige ruta Application; la segunda corrige política reader suministrada y publica Secret con adaptador completo sync-secret.sh. La política correcta sola no crea objeto Kubernetes. Observe desde ~/quest tras cargar platform.env.\n\n```bash\ncurl -fsS -H \"X-Vault-Token: $VAULT_READER_TOKEN\" -H \"Content-Type: application/json\" --request POST --data '{\"paths\":[\"secret/data/dispatch\",\"secret/data/unrelated\",\"sys/mounts\"]}' \"$VAULT_ADDR/v1/sys/capabilities-self\"\n```\n\n\n### Dos denegaciones y cuatro campos {#audit-correlate-two-denied-paths}\n\nEl incident base o dos consumer-incident pueden omitir campos, añadir datos o corresponder a otra denegación; correlacione registros exactos de cuatro campos exportados para ambas rutas KV. La denegación base usa secret/data/dispatch; la aplicación solicita secret/dispatch con reader existente. Corrija política viva limitada y ruta de aplicación, luego actualice caché del proceso original. Los informes contienen solo request_id, path, operation y reason. `jq '.[] | {request_id,path,operation,reason}' /run/dq/facts/0/consumer-audit.json`.\n\n### Política reader KV-v2 limitada {#audit-narrow-kv-v2-reader-policy}\n\nLa política reader suministrada apunta a ruta incorrecta o concede derechos extra; exija read en secret/data/dispatch y deny en secret/data/other y sys/audit. Tras editar archivo actualice política nombrada viva. La denegación base usa secret/data/dispatch; la aplicación solicita secret/dispatch con reader existente. Corrija política viva limitada y ruta de aplicación, luego actualice caché del proceso original. Los informes contienen solo request_id, path, operation y reason. `curl -fsS -H @<(printf 'X-Vault-Token: %s\\n' \"$VAULT_READER_TOKEN\") -H \"Content-Type: application/json\" --request POST --data '{\"paths\":[\"secret/data/dispatch\",\"secret/data/other\",\"sys/audit\"]}' \"$VAULT_ADDR/v1/sys/capabilities-self\"`.\n\n### Adoptar fuente corregida en proceso original {#audit-original-consumer-path-and-cached-publication}\n\nLa aplicación original inicia con ruta KV incorrecta y guarda fallo en caché; corrija política reader y perfil source, luego envíe SIGHUP al mismo PID. Conserve archivo reader privado, identidad de proceso y metadatos HTTP aprobados; una lectura Vault manual no basta. La denegación base usa secret/data/dispatch; la aplicación solicita secret/dispatch con reader existente. Corrija política viva limitada y ruta de aplicación, luego actualice caché del proceso original. Los informes contienen solo request_id, path, operation y reason. `curl -fsS --max-time 2 http://127.0.0.1:18081/status`.\n"
