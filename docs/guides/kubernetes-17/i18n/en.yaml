heading: '17. PDB, eviction and node maintenance: prepare availability in advance'
text: "## 17. PDB, eviction and node maintenance: prepare availability in advance\n\n**At a glance**\n- A PDB restricts voluntary eviction\n- It compares ready replicas with the budget\n- A PDB does not create missing replicas.\n\n**Short scenario**\n\nTwo replicas are ready, and minAvailable=2.\n\n**Predict:** How many voluntary evictions does this simple case allow?\n\n> [!question]- Answer\n> Analysis of the given conditions: Zero. Reducing the number of ready replicas would violate the budget.\n\nPDB, PodDisruptionBudget, limits voluntary eviction of a selected workload.\nThe controller compares ready pods with required availability and records `disruptionsAllowed`.\nThe Eviction API checks that budget before terminating a Pod.\nPDB does not create replicas, protect against node failure/OOM, or block a direct Pod DELETE.\nA controller rollout follows its own strategy rather than PDB permission: a Deployment rolling update\nuses `strategy.rollingUpdate` (`maxUnavailable`/`maxSurge`) without consulting PDB. Replica counts and node distribution\nthrough `podAntiAffinity` and `topologySpreadConstraints` protect against involuntary disruptions (node failure, OOM).\nA PDB equal to the replica count (`minAvailable: 2` with two replicas) produces `disruptionsAllowed: 0` and blocks\nany `drain`: add a replica or use a `maxUnavailable: 1` budget.\n*(according to documentation)* — [disruptions](https://kubernetes.io/docs/concepts/workloads/pods/disruptions/).\n\n### One budget, two states\n\n**At a glance**\n- The budget depends on current health\n- The same setting may allow different actions\n- The Eviction API checks the current budget.\n\n**Short scenario**\n\nminAvailable=2. Initially two replicas are ready, then three.\n\n**Predict:** How does the allowed number of evictions change in this simple model?\n\n> [!question]- Answer\n> Analysis of the given conditions: From zero to one. Two ready replicas must remain in either case.\n\n**`pdb.yaml` in `/tmp/vg-k8s-work`: the complete budget for two `web` replicas:**\n\n```yaml\napiVersion: policy/v1\nkind: PodDisruptionBudget\nmetadata:\n  name: web\n  namespace: vg-k8s\nspec:\n  minAvailable: 2\n  selector:\n    matchLabels:\n      app: web\n```\n\n> [!info]- Deeper explanation\n> `minAvailable: 2` requires keeping two ready replicas.\n> With two ready pods no eviction is allowed; with three, one eviction may be allowed.\n> `maxUnavailable` is an alternative field and cannot be set together with `minAvailable`.\n> In `policy/v1`, an empty selector selects every pod in the namespace: this is not a harmless omission of labels.\n> *(according to documentation)* — the disruptions source above.\n>\n> **Command from any directory: build and send a complete request for a selected Pod:**\n>\n> ```bash\n> POD=$(kubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s \\\n>   -n vg-k8s get pods -l app=web -o jsonpath='{.items[0].metadata.name}')\n> jq -n --arg pod \"$POD\" \\\n>   '{apiVersion:\"policy/v1\",kind:\"Eviction\",metadata:{name:$pod,namespace:\"vg-k8s\"}}' \\\n>   > /tmp/vg-k8s-work/eviction.json\n> kubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s \\\n>   create --raw \"/api/v1/namespaces/vg-k8s/pods/$POD/eviction\" \\\n>   -f /tmp/vg-k8s-work/eviction.json\n> ```\n>\n> `$(...)` captures command output, `--arg` passes a string into jq, and `--raw` specifies an API path.\n> Select a pod only after the repaired rollout is ready.\n>\n> **Fresh-run output with two ready replicas: an example to read:**\n>\n> ```text\n> Error from server (TooManyRequests): Cannot evict pod as it would violate the pod's disruption budget.\n> ```\n>\n> **Fresh-run output after increasing to three ready replicas: an example to read:**\n>\n> ```text\n> {\"kind\":\"Status\",\"apiVersion\":\"v1\",\"metadata\":{},\"status\":\"Success\",\"code\":201}\n> ```\n>\n> Both Eviction API branches were checked; ReplicaSet replaces a removed replica. *(verified)*.\n\n### Why drain waits after cordon has succeeded\n\n**At a glance**\n- Cordon stops new ordinary scheduling\n- Drain attempts to evict existing Pods\n- An availability budget can delay this step.\n\n**Short scenario**\n\nCordon succeeded, but the only replica is protected by minAvailable=1.\n\n**Predict:** Must drain finish immediately?\n\n> [!question]- Answer\n> Analysis of the given conditions: No. Eviction violates the budget; successful cordon does not mean evacuation is complete.\n\n**Command from any directory: a restricted exercise drain of only `web` pods:**\n\n```bash\nkubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s \\\n  drain vg-k8s-worker2 --pod-selector=app=web --ignore-daemonsets --timeout=8s\nkubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s \\\n  uncordon vg-k8s-worker2\n```\n\n`cordon` prevents new ordinary assignments but does not evict pods.\n`drain` first makes the node unschedulable, then evicts eligible pods through the API and waits for completion.\n`--ignore-daemonsets` leaves DaemonSet pods; ordinary drain does not remove static/mirror Pods.\n`--delete-emptydir-data` permits losing `emptyDir` data, while `--force` for unmanaged pods\nis not a PDB bypass. `--disable-eviction` uses deletion and bypasses protection: that is a different operation.\n*(according to documentation)* — [drain](https://kubernetes.io/docs/tasks/administer-cluster/safely-drain-node/).\n\n> [!info]- Deeper explanation\n> **Output from a fresh run: the replica name is abbreviated:**\n>\n> ```text\n> node/vg-k8s-worker2 cordoned\n> Cannot evict pod as it would violate the pod's disruption budget.\n> global timeout reached: 8s\n> ```\n>\n> Verified: drain retried eviction, timed out, and left the node unschedulable until `uncordon`.\n> It did not “automatically unlock the node after failure”. *(verified)*.\n> The `--pod-selector` filter was used only for this experiment; in maintenance it does not prove the node\n> is clear of other applications.\n\n### Practical maintenance sequence\n\n**At a glance**\n- Maintenance starts with availability and capacity checks\n- Replacement Pods need somewhere to run\n- A budget does not create spare capacity.\n\n**Short scenario**\n\nThere is one replica and one available node, with PDB minAvailable=1.\n\n**Predict:** Does a PDB alone ensure uninterrupted maintenance?\n\n> [!question]- Answer\n> Analysis of the given conditions: No. It can only block voluntary eviction; replicas and capacity for them are also needed.\n\nCheck health and spare capacity → remove a blocking PDB/unready replicas → cordon/drain →\nupdate the node → check kubelet/node and applications → uncordon → proceed to the next node.\n`unhealthyPodEvictionPolicy: AlwaysAllow` may permit evicting unready pods,\nbut does not replace analysis of the actual healthy replica count.\n*(according to documentation)* — [drain](https://kubernetes.io/docs/tasks/administer-cluster/safely-drain-node/).\n\n> [!info]- Deeper explanation\n> **Predict:** a Deployment has one replica and PDB `minAvailable: 1`. Can drain preserve availability by itself?\n>\n> > [!question]- Answer\n> > No: PDB blocks eviction but neither creates a second replica nor reserves capacity.\n> > Arrange a replacement beforehand or agree on acceptable downtime.\n> > *(according to documentation)* — the disruptions source above.\n>\n> **Short answer in English:**\n>\n> > A PDB limits voluntary eviction through the eviction API. It does not create extra replicas or prevent node failures.\n> > Drain can wait on a blocked budget after it cordons the node. I check capacity and healthy replicas before maintenance.\n"
