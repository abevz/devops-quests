heading: '17. PDB, выселение и обслуживание узла: доступность нужно обеспечить заранее'
text: "## 17. PDB, выселение и обслуживание узла: доступность нужно обеспечить заранее\n\n**Коротко**\n- PDB ограничивает добровольное выселение\n- Он сравнивает готовые реплики с бюджетом\n- PDB не создаёт недостающие реплики.\n\n**Короткий сценарий**\n\nГотовы две реплики, minAvailable=2.\n\n**Предскажи:** Сколько добровольных выселений допускает простой случай?\n\n> [!question]- Ответ\n> Разбор заданных условий: Ноль. Уменьшение числа готовых нарушит бюджет.\n\nPDB, PodDisruptionBudget, ограничивает добровольное выселение выбранной рабочей нагрузки.\nКонтроллер сравнивает готовые поды с требуемой доступностью и записывает `disruptionsAllowed`.\nEviction API проверяет этот бюджет перед завершением Pod.\nPDB не создаёт реплики, не защищает от падения узла/OOM и не запрещает прямой DELETE Pod.\nРазвёртывание контроллера ограничивается своей стратегией, а не разрешением PDB: rolling update Deployment\nидёт по `strategy.rollingUpdate` (`maxUnavailable`/`maxSurge`) и PDB не спрашивает. От вынужденных прерываний\n(узел, OOM) защищают число реплик и их разнос по узлам — `podAntiAffinity`, `topologySpreadConstraints`.\nPDB, равный числу реплик (`minAvailable: 2` при двух репликах), даёт `disruptionsAllowed: 0` и останавливает\nлюбой `drain`: нужна ещё реплика или бюджет `maxUnavailable: 1`.\n*(по документации)* — [disruptions](https://kubernetes.io/docs/concepts/workloads/pods/disruptions/).\n\n### Один бюджет, два состояния\n\n**Коротко**\n- Бюджет зависит от текущего здоровья\n- Одна и та же настройка может давать разные разрешения\n- Eviction API проверяет действующий бюджет.\n\n**Короткий сценарий**\n\nminAvailable=2. Сначала готовы две реплики, затем три.\n\n**Предскажи:** Как изменится допустимое число выселений в простой модели?\n\n> [!question]- Ответ\n> Разбор заданных условий: С нуля до одного. В обоих случаях должны остаться две готовые реплики.\n\n**`pdb.yaml` в `/tmp/vg-k8s-work` — полный бюджет для двух реплик `web`:**\n\n```yaml\napiVersion: policy/v1\nkind: PodDisruptionBudget\nmetadata:\n  name: web\n  namespace: vg-k8s\nspec:\n  minAvailable: 2\n  selector:\n    matchLabels:\n      app: web\n```\n\n> [!info]- Глубже\n> `minAvailable: 2` требует сохранить две готовые реплики.\n> При двух готовых подах разрешений нет; при трёх одно выселение может быть разрешено.\n> `maxUnavailable` — альтернативное поле, одновременно с `minAvailable` его не задают.\n> В `policy/v1` пустой selector выбирает все поды пространства имён: это не безобидный пропуск меток.\n> *(по документации)* — источник disruptions выше.\n>\n> **Команда в любом каталоге — создать полный запрос для выбранного Pod и отправить его:**\n>\n> ```bash\n> POD=$(kubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s \\\n>   -n vg-k8s get pods -l app=web -o jsonpath='{.items[0].metadata.name}')\n> jq -n --arg pod \"$POD\" \\\n>   '{apiVersion:\"policy/v1\",kind:\"Eviction\",metadata:{name:$pod,namespace:\"vg-k8s\"}}' \\\n>   > /tmp/vg-k8s-work/eviction.json\n> kubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s \\\n>   create --raw \"/api/v1/namespaces/vg-k8s/pods/$POD/eviction\" \\\n>   -f /tmp/vg-k8s-work/eviction.json\n> ```\n>\n> `$(...)` сохраняет вывод команды, `--arg` передаёт строку в jq, `--raw` задаёт путь API.\n> Выбирать под только после готовности исправленного развёртывания.\n>\n> **Вывод нового запуска при двух готовых репликах — пример для чтения:**\n>\n> ```text\n> Error from server (TooManyRequests): Cannot evict pod as it would violate the pod's disruption budget.\n> ```\n>\n> **Вывод нового запуска после увеличения до трёх готовых реплик — пример для чтения:**\n>\n> ```text\n> {\"kind\":\"Status\",\"apiVersion\":\"v1\",\"metadata\":{},\"status\":\"Success\",\"code\":201}\n> ```\n>\n> Проверены обе ветки Eviction API; ReplicaSet обеспечивает замену удалённой реплики. *(проверено)*.\n\n### Почему drain ждёт, хотя cordon уже состоялся\n\n**Коротко**\n- Cordon прекращает новое обычное размещение\n- Drain пытается выселить существующие Pod\n- Бюджет доступности может задержать этот шаг.\n\n**Короткий сценарий**\n\nCordon успешен, единственная реплика защищена minAvailable=1.\n\n**Предскажи:** Обязан ли drain сразу завершиться?\n\n> [!question]- Ответ\n> Разбор заданных условий: Нет. Выселение нарушает бюджет; успешный cordon не означает завершённую эвакуацию.\n\n**Команда в любом каталоге — ограниченный учебный drain только подов `web`:**\n\n```bash\nkubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s \\\n  drain vg-k8s-worker2 --pod-selector=app=web --ignore-daemonsets --timeout=8s\nkubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s \\\n  uncordon vg-k8s-worker2\n```\n\n`cordon` запрещает новое обычное назначение, но не выселяет поды.\n`drain` сначала закрывает узел для назначения, затем выселяет подходящие поды через API и ждёт завершения.\n`--ignore-daemonsets` оставляет поды DaemonSet; static/mirror Pods не удаляются обычным drain.\n`--delete-emptydir-data` разрешает потерю `emptyDir`, а `--force` для бесконтроллерных подов\nне является обходом PDB. `--disable-eviction` использует удаление и обходит защиту — это другое действие.\n*(по документации)* — [drain](https://kubernetes.io/docs/tasks/administer-cluster/safely-drain-node/).\n\n> [!info]- Глубже\n> **Вывод нового запуска — пример для чтения, имя реплики сокращено:**\n>\n> ```text\n> node/vg-k8s-worker2 cordoned\n> Cannot evict pod as it would violate the pod's disruption budget.\n> global timeout reached: 8s\n> ```\n>\n> Проверено: drain повторял выселение, завершился по тайм-ауту, узел остался закрытым до `uncordon`.\n> Это не «узел автоматически разблокируется после ошибки». *(проверено)*.\n> Выборка `--pod-selector` использована только для опыта; в обслуживании она не доказывает освобождение\n> узла от остальных приложений.\n\n### Практический порядок обслуживания\n\n**Коротко**\n- Обслуживание начинается с проверки доступности и ёмкости\n- Замены должны иметь где запуститься\n- Бюджет не создаёт запас мощности.\n\n**Короткий сценарий**\n\nОдна реплика и один доступный узел, PDB minAvailable=1.\n\n**Предскажи:** Обеспечивает ли один PDB обслуживание без перерыва?\n\n> [!question]- Ответ\n> Разбор заданных условий: Нет. Он может только блокировать добровольное выселение; нужны реплики и место для них.\n\nПроверить здоровье и свободную ёмкость → устранить блокирующий PDB/неготовые реплики → cordon/drain →\nобновить узел → проверить kubelet/узел и приложения → uncordon → перейти к следующему узлу.\nПолитика `unhealthyPodEvictionPolicy: AlwaysAllow` может разрешать выселение неготовых подов,\nно не заменяет анализ реального числа здоровых реплик.\n*(по документации)* — [drain](https://kubernetes.io/docs/tasks/administer-cluster/safely-drain-node/).\n\n> [!info]- Глубже\n> **Предскажи:** Deployment имеет одну реплику, PDB `minAvailable: 1`. Drain сможет сохранить доступность сам?\n>\n> > [!question]- Ответ\n> > Нет: PDB блокирует выселение, но не создаёт вторую реплику и не резервирует место.\n> > Нужно заранее обеспечить замену либо согласовать допустимый простой.\n> > *(по документации)* — источник disruptions выше.\n>\n> **Короткий ответ на английском:**\n>\n> > A PDB limits voluntary eviction through the eviction API. It does not create extra replicas or prevent node failures.\n> > Drain can wait on a blocked budget after it cordons the node. I check capacity and healthy replicas before maintenance.\n"
