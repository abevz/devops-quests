heading: Identidad y acceso del workload
text: "# Identidad y acceso del workload\n\nUsa solo la bahía desechable sin conexión. El security context del Pod controla identidad y privilegios del proceso; la admisión Pod Security comprueba la especificación antes de iniciar el Pod. Lee los eventos del ReplicaSet, inspecciona el Deployment y repara el `board.json` proporcionado: UID 1000, seccomp RuntimeDefault, sin escalada, capabilities retiradas y raíz de solo lectura son protecciones distintas. Un `emptyDir` escribible en `/tmp` ofrece espacio temporal; inspecciona `/proc/mounts` y prueba escrituras en vez de deducir el montaje raíz de un comando fallido.\n\nUna ServiceAccount identifica al workload. Un token proyectado tiene audiencia y duración solicitada; el kubelet lo rota. Desactiva el montaje automático cuando el manifiesto proporcionado pida una proyección concreta. Una Role concede operaciones API y una RoleBinding las asigna a sujetos en un namespace. `resourceNames: [route]` restringe el `get` nombrado; no concede `list`. Inspecciona Role y RoleBinding activos y los archivos antes de editar. En la misión 125 solo debe quedar vinculado `controller`; la solicitud de `observer` debe denegarse.\n\nLa CA y el endpoint proporcionados permiten probar HTTPS real. No pongas credenciales en salida, argumentos ni archivos: lee el token proyectado en una variable de shell, pasa la cabecera Authorization a curl por entrada estándar y elimina la variable después. HTTP 200 para route y 403 para cada operación prohibida indicada observan esas solicitudes, no todos los permisos efectivos. No desactives la verificación TLS ni imprimas el token.\n\nReferencias: [security context](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/), [ServiceAccounts](https://kubernetes.io/docs/concepts/security/service-accounts/), [RBAC](https://kubernetes.io/docs/reference/access-authn-authz/rbac/).\n\nEn la misión 109 inspecciona los eventos de admisión y la identidad del proceso:\n\n```sh\ncd ~/quest\nkubectl describe rs\nkubectl get deployment board -o yaml\nkubectl exec deployment/board -- id -u\n```\n\nEn la misión 114 este ejemplo comprueba route con el token reader y la CA privada:\n\n```sh\ncd ~/quest\nkubectl get role reader -o yaml\nkubectl get deployment reader -o yaml\napi=$(cat api-endpoint)\ntoken=$(kubectl exec deployment/reader -- cat /credential/token)\nprintf 'header = \"Authorization: Bearer %s\"\\n' \"$token\" |\n  curl --config - --cacert api-ca.pem -sS \"$api/api/v1/namespaces/$DQ_NAMESPACE/configmaps/route\" | jq .data.route\nunset token\n```\n\nEn la misión 125 inspecciona la Role y RoleBinding separadas y usa el token controller:\n\n```sh\ncd ~/quest\nkubectl get role station-reader -o yaml\nkubectl get rolebinding station-reader -o yaml\napi=$(cat api-endpoint)\ntoken=$(kubectl exec deployment/controller -- cat /credential/token)\nprintf 'header = \"Authorization: Bearer %s\"\\n' \"$token\" |\n  curl --config - --cacert api-ca.pem -sS \"$api/api/v1/namespaces/$DQ_NAMESPACE/configmaps/route\" | jq .data.route\nunset token\n```\n"
