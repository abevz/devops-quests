heading: Identidad y acceso del workload
text: |
  # Identidad y acceso del workload

  Autenticación y autorización fallan en límites distintos. Un destinatario de token no aceptado puede producir HTTP 401; una identidad autenticada sin permiso HTTP 403. Inspecciona ServiceAccount activo y vínculos reales, no solo un Role limitado. Compara únicamente audience con una credencial aceptada por la misma API; issuer no siempre coincide con audiencia aceptada. Decodificar el payload no verifica firmas. Nunca imprimas valores bearer.

  Usa solo la bahía desechable sin conexión. El security context del Pod controla identidad y privilegios del proceso; la admisión Pod Security comprueba la especificación antes de iniciar el Pod. Lee los eventos del ReplicaSet, inspecciona el Deployment y repara el `board.yaml` proporcionado: UID 1000, seccomp RuntimeDefault, sin escalada, capabilities retiradas y raíz de solo lectura son protecciones distintas. Un `emptyDir` escribible en `/tmp` ofrece espacio temporal; inspecciona `/proc/mounts` y prueba escrituras en vez de deducir el montaje raíz de un comando fallido.

  Un ServiceAccount es el principal compartido por sus cargas. Reducir su permiso afecta a todos esos consumidores; etiquetas no separan autoridad. RoleBinding vincula permisos a un principal y credenciales Pod actuales establecen el llamante. Sigue grants del namespace por plantillas y Pods, conserva acceso de control y verifica lecturas previstas y prohibiciones cruzadas. Cambiar una plantilla no reescribe credenciales existentes.

  La CA y el endpoint proporcionados permiten probar HTTPS real. No pongas credenciales en salida, argumentos ni archivos: lee el token proyectado en una variable de shell, pasa la cabecera Authorization a curl por entrada estándar y elimina la variable después. HTTP 200 para route y 403 para cada operación prohibida indicada observan esas solicitudes, no todos los permisos efectivos. No desactives la verificación TLS ni imprimas el token.

  Referencias: [security context](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/), [ServiceAccounts](https://kubernetes.io/docs/concepts/security/service-accounts/), [RBAC](https://kubernetes.io/docs/reference/access-authn-authz/rbac/).

  En la misión 109 inspecciona los eventos de admisión y la identidad del proceso:

  ```sh
  cd ~/quest
  kubectl describe rs
  kubectl get deployment board -o yaml
  kubectl exec deployment/board -- id -u
  ```

  En la misión 114 este ejemplo comprueba route con el token reader y la CA privada:

  ```sh
  cd ~/quest
  kubectl get role reader -o yaml
  kubectl get deployment reader -o yaml
  api=$(cat api-endpoint)
  token=$(kubectl exec deployment/reader -- cat /credential/token)
  printf 'header = "Authorization: Bearer %s"\n' "$token" |
    curl --config - --cacert api-ca.pem -sS "$api/api/v1/namespaces/$DQ_NAMESPACE/configmaps/route" | jq .data.route
  unset token
  ```

  En la misión 125 inspecciona la Role y RoleBinding separadas y usa el token controller:

  ```sh
  cd ~/quest
  kubectl get role station-reader -o yaml
  kubectl get rolebinding station-reader -o yaml
  kubectl get deployment,serviceaccount,role,rolebinding,pods -o yaml
  api=$(cat api-endpoint)
  token=$(kubectl exec deployment/controller -- cat /credential/token)
  printf 'header = "Authorization: Bearer %s"\n' "$token" |
    curl --config - --cacert api-ca.pem -sS "$api/api/v1/namespaces/$DQ_NAMESPACE/configmaps/route" | jq .data.route
  unset token
  ```

  En el ejercicio 037, vincula el ServiceAccount reader a un Role del namespace que permita solo `get` del ConfigMap llamado `route` en el grupo API principal. Prueba con la identidad del workload: leer `route` debe estar permitido, mientras que leer `restricted` y listar Secrets deben estar prohibidos. El acceso del administrador no demuestra los permisos del workload.

  ### Reglas exactas de route-reader {#route-reader-rule}

  En el reto 037, role.yaml indica inicialmente retired. Inspecciona Role route-reader: cada regla debe permitir solo get sobre configmaps del grupo core con resourceNames route; las reglas no deben estar vacías ni contener entradas nonResourceURLs. Recursos, verbos o nombres más amplios incumplen el contrato. Aplica el Role corregido y distingue un fallo de observación API/JSON de una regla incorrecta.

  ### Leer como identidad del workload {#reader-identity-route}

  En el reto 037, el Deployment identity usa ServiceAccount reader y RoleBinding route-reader vincula esa identidad al Role. Verifica que el Pod actual app=identity lea ConfigMap route y reciba north. Una lectura correcta del administrador no demuestra ese permiso. Si falla, inspecciona vínculo, identidad activa y datos del ConfigMap; separa errores de Pod ausente o lectura de credencial de fallos de autorización API.

  ### Comprobar ambos límites de denegación {#reader-denial-boundaries}

  En el reto 037, leer restricted y listar Secrets deben seguir fallando para la misma identidad que lee route. Los permisos RBAC se suman: otro RoleBinding o ClusterRoleBinding puede ampliar acceso aunque route-reader sea limitado. Si una petición prohibida tiene éxito, inspecciona todos los vínculos de esa identidad. Cada comprobación actual primero busca el Pod y lee su credencial; fallar ahí es distinto del acceso inesperado. Usa la lectura correcta de route como control, sin inferir todos los permisos efectivos de dos peticiones negativas.
