heading: Workload-Identität und Zugriff
text: |
  # Workload-Identität und Zugriff

  Authentifizierung und Autorisierung scheitern an verschiedenen Grenzen. Ein nicht akzeptierter Token-Empfänger kann HTTP 401 ergeben; eine authentifizierte Identität ohne Erlaubnis HTTP 403. Prüfe handelnden ServiceAccount und tatsächliche Bindungen, nicht nur eine beschränkte Role. Vergleiche nur Audience-Metadaten mit einem von derselben API akzeptierten Credential; Issuer ist nicht immer akzeptierte Audience. Payload-Dekodierung prüft keine Signatur. Gib Bearer-Werte nie aus.

  Nutze nur die vergängliche Offline-Umgebung. Der Security Context eines Pods steuert Prozessidentität und Privilegien; Pod Security Admission prüft die angeforderte Spezifikation vor dem Start. Lies ReplicaSet-Ereignisse, prüfe das Deployment und repariere das bereitgestellte `board.yaml`: UID 1000, RuntimeDefault-Seccomp, keine Privilegienausweitung, entfernte Capabilities und ein schreibgeschütztes Root-Dateisystem sind verschiedene Schutzmaßnahmen. Ein beschreibbares `emptyDir` unter `/tmp` bietet Arbeitsbereich; prüfe `/proc/mounts` und Schreibzugriffe, statt aus einem fehlgeschlagenen Befehl auf den Root-Mount zu schließen.

  Ein ServiceAccount identifiziert einen Workload. Ein projiziertes Token hat Audience und angeforderte Laufzeit; der Kubelet rotiert es. Deaktiviere automatisches Mounten, wenn das bereitgestellte Manifest eine bestimmte Projektion verlangt. Eine Role gewährt API-Aktionen und ein RoleBinding bindet sie an Subjekte im Namespace. `resourceNames: [route]` beschränkt den benannten `get`; es gewährt kein `list`. Prüfe aktuelle Role, RoleBinding und Dateien vor der Änderung. In Quest 125 soll nur `controller` gebunden bleiben; die Anfrage von `observer` muss abgelehnt werden.

  Mit bereitgestellter CA und API-Endpunkt kannst du echtes HTTPS testen. Gib Zugangsdaten nicht aus und übergib sie weder als Argument noch in Dateien: Lies das projizierte Token in eine Shell-Variable, übergib den Authorization-Header über Standardeingabe an curl und entferne danach die Variable. HTTP 200 für route und 403 für jede angegebene verbotene Aktion beobachten nur diese Anfragen, nicht alle effektiven Berechtigungen. TLS-Prüfung nicht abschalten und Token nicht ausgeben.

  Quellen: [Security Context](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/), [ServiceAccounts](https://kubernetes.io/docs/concepts/security/service-accounts/), [RBAC](https://kubernetes.io/docs/reference/access-authn-authz/rbac/).

  Prüfe in Quest 109 Admission-Ereignisse und die laufende Identität:

  ```sh
  cd ~/quest
  kubectl describe rs
  kubectl get deployment board -o yaml
  kubectl exec deployment/board -- id -u
  ```

  In Quest 114 prüft dieses Beispiel route mit dem Reader-Token und der privaten CA:

  ```sh
  cd ~/quest
  kubectl get role reader -o yaml
  kubectl get deployment reader -o yaml
  api=$(cat api-endpoint)
  token=$(kubectl exec deployment/reader -- cat /credential/token)
  printf 'header = "Authorization: Bearer %s"\n' "$token" |
    curl --config - --cacert api-ca.pem -sS "$api/api/v1/namespaces/$DQ_NAMESPACE/configmaps/route" | jq .data.route
  unset token
  ```

  Prüfe in Quest 125 die separate Role und das RoleBinding und nutze das Controller-Token:

  ```sh
  cd ~/quest
  kubectl get role station-reader -o yaml
  kubectl get rolebinding station-reader -o yaml
  api=$(cat api-endpoint)
  token=$(kubectl exec deployment/controller -- cat /credential/token)
  printf 'header = "Authorization: Bearer %s"\n' "$token" |
    curl --config - --cacert api-ca.pem -sS "$api/api/v1/namespaces/$DQ_NAMESPACE/configmaps/route" | jq .data.route
  unset token
  ```

  In Aufgabe 037 bindest du den ServiceAccount reader an eine Role im Namespace, die nur `get` auf die benannte ConfigMap `route` in der zentralen API-Gruppe erlaubt. Prüfe mit der Workload-Identität: Lesen von `route` muss erlaubt, Lesen von `restricted` und Auflisten von Secrets müssen verboten sein. Der eigene Zugriff eines Administrators belegt die Rechte des Workloads nicht.
