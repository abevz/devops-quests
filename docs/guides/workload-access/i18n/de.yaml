heading: Workload-Identität und Zugriff
text: "# Workload-Identität und Zugriff\n\nNutze nur die vergängliche Offline-Umgebung. Der Security Context eines Pods steuert Prozessidentität und Privilegien; Pod Security Admission prüft die angeforderte Spezifikation vor dem Start. Lies ReplicaSet-Ereignisse, prüfe das Deployment und repariere das bereitgestellte `board.json`: UID 1000, RuntimeDefault-Seccomp, keine Privilegienausweitung, entfernte Capabilities und ein schreibgeschütztes Root-Dateisystem sind verschiedene Schutzmaßnahmen. Ein beschreibbares `emptyDir` unter `/tmp` bietet Arbeitsbereich; prüfe `/proc/mounts` und Schreibzugriffe, statt aus einem fehlgeschlagenen Befehl auf den Root-Mount zu schließen.\n\nEin ServiceAccount identifiziert einen Workload. Ein projiziertes Token hat Audience und angeforderte Laufzeit; der Kubelet rotiert es. Deaktiviere automatisches Mounten, wenn das bereitgestellte Manifest eine bestimmte Projektion verlangt. Eine Role gewährt API-Aktionen und ein RoleBinding bindet sie an Subjekte im Namespace. `resourceNames: [route]` beschränkt den benannten `get`; es gewährt kein `list`. Prüfe aktuelle Role, RoleBinding und Dateien vor der Änderung. In Quest 125 soll nur `controller` gebunden bleiben; die Anfrage von `observer` muss abgelehnt werden.\n\nMit bereitgestellter CA und API-Endpunkt kannst du echtes HTTPS testen. Gib Zugangsdaten nicht aus und übergib sie weder als Argument noch in Dateien: Lies das projizierte Token in eine Shell-Variable, übergib den Authorization-Header über Standardeingabe an curl und entferne danach die Variable. HTTP 200 für route und 403 für jede angegebene verbotene Aktion beobachten nur diese Anfragen, nicht alle effektiven Berechtigungen. TLS-Prüfung nicht abschalten und Token nicht ausgeben.\n\nQuellen: [Security Context](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/), [ServiceAccounts](https://kubernetes.io/docs/concepts/security/service-accounts/), [RBAC](https://kubernetes.io/docs/reference/access-authn-authz/rbac/).\n\nPrüfe in Quest 109 Admission-Ereignisse und die laufende Identität:\n\n```sh\ncd ~/quest\nkubectl describe rs\nkubectl get deployment board -o yaml\nkubectl exec deployment/board -- id -u\n```\n\nIn Quest 114 prüft dieses Beispiel route mit dem Reader-Token und der privaten CA:\n\n```sh\ncd ~/quest\nkubectl get role reader -o yaml\nkubectl get deployment reader -o yaml\napi=$(cat api-endpoint)\ntoken=$(kubectl exec deployment/reader -- cat /credential/token)\nprintf 'header = \"Authorization: Bearer %s\"\\n' \"$token\" |\n  curl --config - --cacert api-ca.pem -sS \"$api/api/v1/namespaces/$DQ_NAMESPACE/configmaps/route\" | jq .data.route\nunset token\n```\n\nPrüfe in Quest 125 die separate Role und das RoleBinding und nutze das Controller-Token:\n\n```sh\ncd ~/quest\nkubectl get role station-reader -o yaml\nkubectl get rolebinding station-reader -o yaml\napi=$(cat api-endpoint)\ntoken=$(kubectl exec deployment/controller -- cat /credential/token)\nprintf 'header = \"Authorization: Bearer %s\"\\n' \"$token\" |\n  curl --config - --cacert api-ca.pem -sS \"$api/api/v1/namespaces/$DQ_NAMESPACE/configmaps/route\" | jq .data.route\nunset token\n```\n"
