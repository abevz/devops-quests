heading: Workload-Identität und Zugriff
text: |
  # Workload-Identität und Zugriff

  Authentifizierung und Autorisierung scheitern an verschiedenen Grenzen. Ein nicht akzeptierter Token-Empfänger kann HTTP 401 ergeben; eine authentifizierte Identität ohne Erlaubnis HTTP 403. Prüfe handelnden ServiceAccount und tatsächliche Bindungen, nicht nur eine beschränkte Role. Vergleiche nur Audience-Metadaten mit einem von derselben API akzeptierten Credential; Issuer ist nicht immer akzeptierte Audience. Payload-Dekodierung prüft keine Signatur. Gib Bearer-Werte nie aus.

  Nutze nur die vergängliche Offline-Umgebung. Der Security Context eines Pods steuert Prozessidentität und Privilegien; Pod Security Admission prüft die angeforderte Spezifikation vor dem Start. Lies ReplicaSet-Ereignisse, prüfe das Deployment und repariere das bereitgestellte `board.yaml`: UID 1000, RuntimeDefault-Seccomp, keine Privilegienausweitung, entfernte Capabilities und ein schreibgeschütztes Root-Dateisystem sind verschiedene Schutzmaßnahmen. Ein beschreibbares `emptyDir` unter `/tmp` bietet Arbeitsbereich; prüfe `/proc/mounts` und Schreibzugriffe, statt aus einem fehlgeschlagenen Befehl auf den Root-Mount zu schließen.

  Ein ServiceAccount ist der Principal aller ihn nutzenden Workloads. Grant-Einschränkung betrifft alle Verbraucher; Labels trennen keine Autorität. Eine RoleBinding verbindet benannte Rechte mit einem Principal, aktuelle Pod-gebundene Credentials bestimmen den Aufrufer. Verfolge Namespace-Grants durch Vorlagen und aktuelle Pods, erhalte Kontrollzugriff und prüfe erlaubte Lesezugriffe sowie gegenseitige Verbote. Vorlagenänderungen schreiben kein bestehendes Credential um.

  Mit bereitgestellter CA und API-Endpunkt kannst du echtes HTTPS testen. Gib Zugangsdaten nicht aus und übergib sie weder als Argument noch in Dateien: Lies das projizierte Token in eine Shell-Variable, übergib den Authorization-Header über Standardeingabe an curl und entferne danach die Variable. HTTP 200 für route und 403 für jede angegebene verbotene Aktion beobachten nur diese Anfragen, nicht alle effektiven Berechtigungen. TLS-Prüfung nicht abschalten und Token nicht ausgeben.

  Quellen: [Security Context](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/), [ServiceAccounts](https://kubernetes.io/docs/concepts/security/service-accounts/), [RBAC](https://kubernetes.io/docs/reference/access-authn-authz/rbac/).

  Prüfe in Quest 109 Admission-Ereignisse und die laufende Identität:

  ```sh
  cd ~/quest
  kubectl describe rs
  kubectl get deployment board -o yaml
  kubectl exec deployment/board -- id -u
  ```

  In Quest 114 prüft dieses Beispiel route mit dem Reader-Token und der privaten CA:

  ```sh
  cd ~/quest
  kubectl get role reader -o yaml
  kubectl get deployment reader -o yaml
  api=$(cat api-endpoint)
  token=$(kubectl exec deployment/reader -- cat /credential/token)
  printf 'header = "Authorization: Bearer %s"\n' "$token" |
    curl --config - --cacert api-ca.pem -sS "$api/api/v1/namespaces/$DQ_NAMESPACE/configmaps/route" | jq .data.route
  unset token
  ```

  Prüfe in Quest 125 die separate Role und das RoleBinding und nutze das Controller-Token:

  ```sh
  cd ~/quest
  kubectl get role station-reader -o yaml
  kubectl get rolebinding station-reader -o yaml
  kubectl get deployment,serviceaccount,role,rolebinding,pods -o yaml
  api=$(cat api-endpoint)
  token=$(kubectl exec deployment/controller -- cat /credential/token)
  printf 'header = "Authorization: Bearer %s"\n' "$token" |
    curl --config - --cacert api-ca.pem -sS "$api/api/v1/namespaces/$DQ_NAMESPACE/configmaps/route" | jq .data.route
  unset token
  ```

  In Aufgabe 037 bindest du den ServiceAccount reader an eine Role im Namespace, die nur `get` auf die benannte ConfigMap `route` in der zentralen API-Gruppe erlaubt. Prüfe mit der Workload-Identität: Lesen von `route` muss erlaubt, Lesen von `restricted` und Auflisten von Secrets müssen verboten sein. Der eigene Zugriff eines Administrators belegt die Rechte des Workloads nicht.

  ### Exakte route-reader-Regeln {#route-reader-rule}

  In Quest 037 nennt role.yaml zunächst retired. Prüfe Role route-reader: Jede Regel darf nur get auf configmaps der Core-Gruppe mit resourceNames route erlauben; Regeln müssen nichtleer sein und dürfen keine nonResourceURLs-Einträge enthalten. Breitere Ressourcen, Verben oder Namen erfüllen den Vertrag nicht. Wende die korrigierte Role an und unterscheide API-/JSON-Beobachtungsfehler von Regelabweichungen.

  ### Als Workload-Identität lesen {#reader-identity-route}

  In Quest 037 verwendet Deployment identity den ServiceAccount reader; RoleBinding route-reader bindet diesen Principal an die Role. Prüfe, dass der tatsächliche app=identity-Pod ConfigMap route lesen kann und north erhält. Ein erfolgreicher Administratorzugriff beweist diese Berechtigung nicht. Prüfe bei Fehlern Bindung, handelnde Identität und ConfigMap-Daten; unterscheide fehlenden Pod oder Zugangsdaten-Lesefehler von API-Autorisierungsfehlern.

  ### Beide Zugriffsgrenzen prüfen {#reader-denial-boundaries}

  In Quest 037 müssen Lesen von restricted und Auflisten von Secrets für dieselbe Workload-Identität erfolglos bleiben, die route lesen kann. RBAC-Rechte addieren sich: Eine andere RoleBinding oder ClusterRoleBinding kann Zugriff trotz enger route-reader-Role erweitern. Prüfe bei erfolgreicher verbotener Anfrage alle Bindungen des Principals. Jede aktuelle Prüfung sucht zuerst den Pod und liest dessen Zugangsdaten; ein Fehler dort ist von unerwartetem Zugriff zu unterscheiden. Verwende das erfolgreiche route-Lesen als Kontrolle, ohne aus zwei negativen Anfragen alle effektiven Rechte abzuleiten.


  ### Eingaben für die Sicherheitsprüfung {#q109-security-observer-input}

  Die Sicherheitsprüfung kann vor der Meldung einer Vorgabe abbrechen, wenn Python oder Eingaben fehlschlagen. Prüfen Sie Zugriff auf das Deployment und lokale Werkzeuge.

  ```bash
  command -v python3; kubectl get deployment board -o name
  ```

  ### Netzwerk-Namespace des Pods {#q109-board-network-namespace}

  Beim Ändern der Arbeitslast wurde möglicherweise das Hostnetz aktiviert. Prüfen Sie hostNetwork und behalten Sie den Netzwerk-Namespace des Pods board.

  ```bash
  kubectl get deployment board -o jsonpath='{.spec.template.spec.hostNetwork}'
  ```

  ### Prozess-Namespace des Pods {#q109-board-process-namespace}

  Die Pod-Vorlage verwendet möglicherweise den Prozess-Namespace des Hosts. Prüfen Sie hostPID und lassen Sie es deaktiviert.

  ```bash
  kubectl get deployment board -o jsonpath='{.spec.template.spec.hostPID}'
  ```

  ### IPC-Namespace des Pods {#q109-board-ipc-namespace}

  Die Pod-Vorlage teilt möglicherweise Host-IPC. Prüfen Sie hostIPC und behalten Sie den isolierten IPC-Namespace des Pods.

  ```bash
  kubectl get deployment board -o jsonpath='{.spec.template.spec.hostIPC}'
  ```

  ### Volume-Quellen von board {#q109-board-volume-sources}

  Beim Ändern der Vorlage wurde möglicherweise ein hostPath-Volume hinzugefügt. Prüfen Sie die Volume-Quellen und entfernen Sie hostPath-Abhängigkeiten.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec.volumes'
  ```

  ### Ausführung ohne Root-Rechte {#q109-board-user-policy}

  Einem Container fehlt möglicherweise wirksames runAsNonRoot, oder er überschreibt es beziehungsweise setzt UID 0. Prüfen Sie Pod- und Containereinstellungen einschließlich Init-Containern. Explizite UIDs müssen positiv sein.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec | {pod: .securityContext, worker: [.containers[], .initContainers[]? | .securityContext]}'
  ```

  ### Wirksamer Systemaufruffilter {#q109-board-syscall-filter}

  Der Standardfilter wurde möglicherweise entfernt oder überschrieben. Prüfen Sie wirksames RuntimeDefault für reguläre und Init-Container einschließlich der geerbten Pod-Einstellungen.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec | {pod: .securityContext.seccompProfile, containers: [.containers[], .initContainers[]? | .securityContext.seccompProfile]}'
  ```

  ### Privilegierter Modus {#q109-board-privileged-mode}

  Ein regulärer oder Init-Container läuft möglicherweise privilegiert. Prüfen Sie jeden securityContext und entfernen Sie privileged: true.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec | [.containers[], .initContainers[]? | .securityContext.privileged]'
  ```

  ### Flag für Rechteausweitung {#q109-board-privilege-escalation}

  Ein Container erlaubt möglicherweise Rechteausweitung, wenn das Flag fehlt oder aktiv ist. Setzen Sie allowPrivilegeEscalation für jeden regulären und Init-Container ausdrücklich auf false.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec | [.containers[], .initContainers[]? | .securityContext.allowPrivilegeEscalation]'
  ```

  ### Entfernte Capabilities {#q109-board-drop-capabilities}

  Ein Container entfernt möglicherweise nicht mehr die Standard-Capabilities. Prüfen Sie ALL in der drop-Liste jedes regulären und Init-Containers.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec | [.containers[], .initContainers[]? | .securityContext.capabilities.drop]'
  ```

  ### Hinzugefügte Capabilities {#q109-board-no-added-capabilities}

  Die Vorlage fügt möglicherweise zuvor entfernte Capabilities wieder hinzu. Prüfen Sie eine leere add-Liste für jeden regulären und Init-Container.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec | [.containers[], .initContainers[]? | .securityContext.capabilities.add]'
  ```

  ### Restricted-Durchsetzung im Namespace {#q109-restricted-namespace}

  Im Namespace fehlt möglicherweise das restricted-Label oder der Abruf schlägt fehl. Prüfen Sie das Label des Übungs-Namespace und behalten Sie restricted bei der Korrektur bei.

  ```bash
  kubectl get namespace "$DQ_NAMESPACE" -o json | jq '.metadata.labels["pod-security.kubernetes.io/enforce"]'
  ```

  ### Replikazahl von board {#q109-board-replica-contract}

  Das Deployment wurde möglicherweise skaliert oder fehlt. Prüfen Sie, ob board weiterhin eine Replik anfordert.

  ```bash
  kubectl get deployment board -o jsonpath='{.spec.replicas}'
  ```

  ### Bereite board-Replik {#q109-board-ready-replica}

  Die Pod-Vorlage kann vorhanden sein, während Admission oder Rollout eine bereite Replik verhindern. Prüfen Sie Ereignisse und bestätigen Sie eine bereite Replik im Status von board.

  ```bash
  kubectl get deployment board -o jsonpath='{.status.readyReplicas}'; kubectl get pods -l app=board
  ```

  ### Identität des Worker-Containers {#q109-board-worker-identity}

  Der Worker wurde möglicherweise umbenannt, ein weiterer regulärer Container wurde ergänzt oder keiner ist vorhanden. Behalten Sie genau einen regulären Container namens worker.

  ```bash
  kubectl get deployment board -o json | jq '[.spec.template.spec.containers[].name]'
  ```

  ### Explizite UIDs {#q109-board-explicit-user-ids}

  Ein explizites runAsUser ist möglicherweise 0 oder ungültig. Prüfen Sie alle expliziten Pod- und Container-UIDs einschließlich Init-Containern auf positive Ganzzahlen.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec | {pod: .securityContext.runAsUser, containers: [.containers[], .initContainers[]? | .securityContext.runAsUser]}'
  ```

  ### Deklariertes schreibgeschütztes Root-Dateisystem {#q109-board-declared-readonly-root}

  Ein Container erlaubt möglicherweise weiterhin Schreibzugriffe auf sein Image-Dateisystem. Setzen Sie readOnlyRootFilesystem für alle regulären und Init-Container auf true und nutzen Sie für temporäre Daten das separate Volume.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec | [.containers[], .initContainers[]? | .securityContext.readOnlyRootFilesystem]'
  ```

  ### Seccomp-Überschreibung am Container {#q109-board-container-seccomp-override}

  Eine Seccomp-Überschreibung am Container kann RuntimeDefault ersetzen. Prüfen Sie reguläre und Init-Container und behalten Sie den geerbten oder expliziten Standard bei.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec | [.containers[], .initContainers[]? | .securityContext.seccompProfile]'
  ```

  ### Quelle des temporären Volumes {#q109-board-temporary-volume-type}

  Der Mount /tmp fehlt möglicherweise oder verweist auf ein anderes Volume als emptyDir. Verfolgen Sie den benannten Mount vom Worker zur deklarierten temporären Volume-Quelle.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec | {volumes, worker: [.containers[] | select(.name == "worker") | .volumeMounts]}'
  ```

  ### Beschreibbarer temporärer Mount {#q109-board-writable-temporary-mount}

  Der Worker bindet /tmp möglicherweise schreibgeschützt ein oder hat widersprüchliche Einträge. Prüfen Sie einen einzelnen beschreibbaren Mount aus dem temporären emptyDir.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec.containers[] | select(.name == "worker") | [.volumeMounts[] | select(.mountPath == "/tmp")]'
  ```

  ### Weitere Volume-Mounts {#q109-board-other-mounts-readonly}

  Ein anderer Mount als das bereitgestellte /tmp erlaubt möglicherweise Schreibzugriffe. Prüfen Sie reguläre und Init-Container einschließlich von sich aus schreibgeschützter Projektionsquellen.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec | {volumes, mounts: [.containers[], .initContainers[]? | .volumeMounts]}'
  ```

  ### Aktiver schreibgeschützter Root-Mount {#q109-board-live-readonly-root}

  Das Deployment kann ein schreibgeschütztes Root-Dateisystem deklarieren, während der laufende Worker noch einen älteren Mount nutzt. Prüfen Sie die Optionen für / in /proc/mounts und bestätigen Sie ro nach dem Rollout.

  ```bash
  kubectl exec deployment/board -c worker -- awk '$2 == "/" {print $4}' /proc/mounts
  ```

  ### Aktive UID des Workers {#q109-board-live-worker-uid}

  Der ausgewählte Worker läuft möglicherweise noch als root oder exec schlägt fehl. Lesen Sie die tatsächliche Prozess-UID und bestätigen Sie einen positiven Wert.

  ```bash
  kubectl exec deployment/board -c worker -- id -u
  ```

  ### Schreiben und Lesen in /tmp {#q109-board-live-tmp-reads-writes}

  Der temporäre Mount ist möglicherweise schreibgeschützt oder Berechtigungen blockieren den Worker. Prüfen Sie einen echten Schreib- und Lesezugriff in /tmp aus dem laufenden Worker.

  ```bash
  kubectl exec deployment/board -c worker -- sh -c 'p=$(mktemp /tmp/dq-check.XXXXXX) && trap "rm -f $p" EXIT && printf writable > "$p" && test "$(cat "$p")" = writable'
  ```

  ### Antwort von board nach der Absicherung {#q109-board-live-security-http}

  Die Sicherheitsvorgaben können stimmen, obwohl der Worker seinen Inhalt nicht schreiben kann oder dem Service ein bereiter Endpoint fehlt. Rufen Sie board nach dem Rollout auf und vergleichen Sie mit north-109.

  ```bash
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080
  ```
