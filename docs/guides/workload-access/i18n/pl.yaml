heading: Tożsamość i dostęp workloadu
text: |
  # Tożsamość i dostęp workloadu

  Uwierzytelnianie i autoryzacja zawodzą na różnych granicach. Nieakceptowany odbiorca tokena może dać HTTP 401; uwierzytelniona tożsamość bez prawa HTTP 403. Sprawdzaj działający ServiceAccount i rzeczywiste powiązania, nie tylko ograniczony Role. Porównuj jedynie audience z poświadczeniem akceptowanym przez to samo API; issuer nie zawsze jest akceptowanym audience. Dekodowanie payload nie weryfikuje podpisu. Nigdy nie wyświetlaj wartości bearer.

  Używaj tylko jednorazowej zatoki offline. Security context Poda określa tożsamość i uprawnienia procesu; Pod Security admission sprawdza specyfikację przed uruchomieniem Poda. Przeczytaj zdarzenia ReplicaSetu, obejrzyj Deployment i napraw dostarczony `board.yaml`: UID 1000, seccomp RuntimeDefault, brak eskalacji, odebrane capabilities i system root tylko do odczytu to różne zabezpieczenia. Zapisywalny `emptyDir` w `/tmp` daje miejsce robocze; sprawdź `/proc/mounts` i zapis, zamiast wnioskować o montowaniu root z nieudanego polecenia.

  ServiceAccount jest principal współdzielonym przez używające go obciążenia. Ograniczenie grantu dotyczy wszystkich odbiorców; etykiety nie rozdzielają uprawnień. RoleBinding wiąże prawa z principal, a bieżące poświadczenia Pod identyfikują wywołującego. Śledź granty namespace przez szablony i aktualne Pody, zachowaj dostęp sterujący i sprawdź odczyty oraz zakazy krzyżowe. Zmiana szablonu nie przepisuje istniejących poświadczeń.

  Dostarczone CA i endpoint API pozwalają sprawdzić rzeczywiste HTTPS. Nie umieszczaj danych dostępowych w wyjściu, argumentach poleceń ani plikach: wczytaj projektowany token do zmiennej powłoki, przekaż nagłówek Authorization do curl przez standardowe wejście i potem usuń zmienną. HTTP 200 dla route i 403 dla każdej wskazanej zabronionej operacji potwierdzają tylko te żądania, nie wszystkie efektywne uprawnienia. Nie wyłączaj weryfikacji TLS i nie wypisuj tokenu.

  Źródła: [security context](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/), [ServiceAccount](https://kubernetes.io/docs/concepts/security/service-accounts/), [RBAC](https://kubernetes.io/docs/reference/access-authn-authz/rbac/).

  W zadaniu 109 sprawdź zdarzenia admission i tożsamość procesu:

  ```sh
  cd ~/quest
  kubectl describe rs
  kubectl get deployment board -o yaml
  kubectl exec deployment/board -- id -u
  ```

  W zadaniu 114 ten przykład sprawdza route tokenem reader i prywatnym CA:

  ```sh
  cd ~/quest
  kubectl get role reader -o yaml
  kubectl get deployment reader -o yaml
  api=$(cat api-endpoint)
  token=$(kubectl exec deployment/reader -- cat /credential/token)
  printf 'header = "Authorization: Bearer %s"\n' "$token" |
    curl --config - --cacert api-ca.pem -sS "$api/api/v1/namespaces/$DQ_NAMESPACE/configmaps/route" | jq .data.route
  unset token
  ```

  W zadaniu 125 sprawdź osobną Role i RoleBinding, a następnie użyj tokenu controller:

  ```sh
  cd ~/quest
  kubectl get role station-reader -o yaml
  kubectl get rolebinding station-reader -o yaml
  kubectl get deployment,serviceaccount,role,rolebinding,pods -o yaml
  api=$(cat api-endpoint)
  token=$(kubectl exec deployment/controller -- cat /credential/token)
  printf 'header = "Authorization: Bearer %s"\n' "$token" |
    curl --config - --cacert api-ca.pem -sS "$api/api/v1/namespaces/$DQ_NAMESPACE/configmaps/route" | jq .data.route
  unset token
  ```

  W zadaniu 037 powiąż ServiceAccount reader z Role w namespace, która zezwala tylko na `get` nazwanego ConfigMap `route` w głównej grupie API. Testuj z tożsamością workloadu: odczyt `route` ma być dozwolony, a odczyt `restricted` i listowanie Secretów zabronione. Dostęp administratora nie dowodzi uprawnień workloadu.

  ### Dokładne reguły route-reader {#route-reader-rule}

  W zadaniu 037 role.yaml początkowo wskazuje retired. Sprawdź Role route-reader: każda reguła ma przyznawać tylko get na configmaps grupy core z resourceNames route; reguły nie mogą być puste ani zawierać wpisów nonResourceURLs. Szersze zasoby, czasowniki lub nazwy nie spełniają kontraktu. Zastosuj poprawiony Role i odróżnij błąd obserwacji API/JSON od niezgodnej reguły.

  ### Odczyt jako tożsamość workloadu {#reader-identity-route}

  W zadaniu 037 Deployment identity używa ServiceAccount reader, a RoleBinding route-reader wiąże tę tożsamość z Role. Sprawdź, że rzeczywisty Pod app=identity odczytuje ConfigMap route i dostaje north. Udany odczyt administratora nie dowodzi tego grantu. Przy błędzie sprawdź powiązanie, działającą tożsamość i dane ConfigMap; oddziel brak Poda lub błąd odczytu poświadczeń od błędu autoryzacji API.

  ### Sprawdzenie obu granic odmowy {#reader-denial-boundaries}

  W zadaniu 037 odczyt restricted i listowanie Secrets mają pozostawać nieudane dla tej samej tożsamości workloadu, która czyta route. Granty RBAC sumują się: inny RoleBinding lub ClusterRoleBinding może rozszerzyć dostęp mimo wąskiego route-reader. Gdy zabronione żądanie się udaje, sprawdź wszystkie powiązania tej tożsamości. Każda bieżąca kontrola najpierw znajduje Poda i czyta poświadczenie; błąd tego etapu różni się od nieoczekiwanego dostępu. Użyj udanego odczytu route jako kontroli, bez wnioskowania o wszystkich uprawnieniach z dwóch negatywnych żądań.


  ### Dane kontroli zabezpieczeń {#q109-security-observer-input}

  Kontrola zabezpieczeń może skończyć się przed wskazaniem warunku przez błąd Pythona lub wejścia. Sprawdź dostęp do Deploymentu i dostępność narzędzi.

  ```bash
  command -v python3; kubectl get deployment board -o name
  ```

  ### Przestrzeń sieciowa poda {#q109-board-network-namespace}

  Zmiana szablonu mogła włączyć sieć hosta. Sprawdź hostNetwork i zachowaj oddzielną przestrzeń sieciową poda board.

  ```bash
  kubectl get deployment board -o jsonpath='{.spec.template.spec.hostNetwork}'
  ```

  ### Przestrzeń procesów poda {#q109-board-process-namespace}

  Szablon poda mógł zacząć współdzielić przestrzeń procesów hosta. Sprawdź hostPID i pozostaw wyłączone.

  ```bash
  kubectl get deployment board -o jsonpath='{.spec.template.spec.hostPID}'
  ```

  ### Przestrzeń IPC poda {#q109-board-ipc-namespace}

  Szablon poda mógł zacząć współdzielić IPC hosta. Sprawdź hostIPC i zachowaj izolację IPC poda.

  ```bash
  kubectl get deployment board -o jsonpath='{.spec.template.spec.hostIPC}'
  ```

  ### Źródła wolumenów board {#q109-board-volume-sources}

  Podczas zmiany szablonu mógł zostać dodany wolumen hostPath. Sprawdź źródła wolumenów i usuń zależność od hostPath.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec.volumes'
  ```

  ### Praca bez uprawnień root {#q109-board-user-policy}

  Kontener może nie mieć skutecznego runAsNonRoot, nadpisywać je albo wskazywać UID 0. Sprawdź ustawienia poda i wszystkich kontenerów, w tym init. Jawne UID mają być dodatnie.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec | {pod: .securityContext, worker: [.containers[], .initContainers[]? | .securityContext]}'
  ```

  ### Skuteczny filtr wywołań systemowych {#q109-board-syscall-filter}

  Domyślny filtr wywołań może być usunięty albo nadpisany. Sprawdź skuteczny RuntimeDefault w zwykłych i init-kontenerach oraz ustawienia odziedziczone z poda.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec | {pod: .securityContext.seccompProfile, containers: [.containers[], .initContainers[]? | .securityContext.seccompProfile]}'
  ```

  ### Tryb uprzywilejowany {#q109-board-privileged-mode}

  Zwykły lub init-kontener mógł dostać tryb uprzywilejowany. Sprawdź securityContext każdego i usuń privileged: true.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec | [.containers[], .initContainers[]? | .securityContext.privileged]'
  ```

  ### Flaga eskalacji uprawnień {#q109-board-privilege-escalation}

  Kontener może dopuszczać eskalację, jeśli flaga jest pominięta lub włączona. Ustaw allowPrivilegeEscalation: false dla każdego zwykłego i init-kontenera.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec | [.containers[], .initContainers[]? | .securityContext.allowPrivilegeEscalation]'
  ```

  ### Odebrane capabilities {#q109-board-drop-capabilities}

  Kontener mógł przestać usuwać domyślne capabilities. Sprawdź ALL na liście drop każdego zwykłego i init-kontenera.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec | [.containers[], .initContainers[]? | .securityContext.capabilities.drop]'
  ```

  ### Dodane capabilities {#q109-board-no-added-capabilities}

  Szablon mógł dodać capabilities ponownie po ich usunięciu. Sprawdź pustą listę add w każdym zwykłym i init-kontenerze.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec | [.containers[], .initContainers[]? | .securityContext.capabilities.add]'
  ```

  ### Wymuszanie restricted w przestrzeni nazw {#q109-restricted-namespace}

  Przestrzeń nazw może nie mieć etykiety restricted albo odczyt nie działa. Sprawdź etykietę stanowiska i zachowaj wymuszanie restricted przy poprawce.

  ```bash
  kubectl get namespace "$DQ_NAMESPACE" -o json | jq '.metadata.labels["pod-security.kubernetes.io/enforce"]'
  ```

  ### Liczba replik board {#q109-board-replica-contract}

  Deployment mógł zostać przeskalowany lub nie istnieć. Sprawdź, czy board nadal żąda jednej repliki.

  ```bash
  kubectl get deployment board -o jsonpath='{.spec.replicas}'
  ```

  ### Gotowa replika board {#q109-board-ready-replica}

  Szablon poda może istnieć, choć admission lub wdrożenie blokuje gotowość. Sprawdź zdarzenia i potwierdź jedną gotową replikę w stanie board.

  ```bash
  kubectl get deployment board -o jsonpath='{.status.readyReplicas}'; kubectl get pods -l app=board
  ```

  ### Tożsamość kontenera worker {#q109-board-worker-identity}

  Obciążenie może mieć przemianowany kontener worker, dodatkowy zwykły kontener albo żadnego. Zachowaj dokładnie jeden zwykły kontener worker.

  ```bash
  kubectl get deployment board -o json | jq '[.spec.template.spec.containers[].name]'
  ```

  ### Jawne UID {#q109-board-explicit-user-ids}

  Jawne runAsUser może być zerem lub nieprawidłowe. Sprawdź jawne UID poda i kontenerów, w tym init, i zachowaj dodatnie liczby całkowite.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec | {pod: .securityContext.runAsUser, containers: [.containers[], .initContainers[]? | .securityContext.runAsUser]}'
  ```

  ### Zadeklarowany korzeń tylko do odczytu {#q109-board-declared-readonly-root}

  Jeden z kontenerów może nadal zezwalać na zapis w systemie plików obrazu. Ustaw readOnlyRootFilesystem na true we wszystkich zwykłych i init-kontenerach, a zapisy tymczasowe pozostaw na wolumenie.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec | [.containers[], .initContainers[]? | .securityContext.readOnlyRootFilesystem]'
  ```

  ### Nadpisanie seccomp kontenera {#q109-board-container-seccomp-override}

  Nadpisanie seccomp kontenera może zastąpić dostarczony filtr RuntimeDefault. Sprawdź zwykłe i init-kontenery i zachowaj dziedziczony lub jawny RuntimeDefault.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec | [.containers[], .initContainers[]? | .securityContext.seccompProfile]'
  ```

  ### Źródło wolumenu tymczasowego {#q109-board-temporary-volume-type}

  Montowanie /tmp może zniknąć lub wskazywać wolumen inny niż emptyDir. Prześledź nazwę montowania od kontenera worker do zadeklarowanego źródła.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec | {volumes, worker: [.containers[] | select(.name == "worker") | .volumeMounts]}'
  ```

  ### Zapisywalne montowanie tymczasowe {#q109-board-writable-temporary-mount}

  Kontener worker może montować /tmp tylko do odczytu lub mieć sprzeczne wpisy. Sprawdź pojedyncze zapisywalne montowanie z tymczasowego emptyDir.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec.containers[] | select(.name == "worker") | [.volumeMounts[] | select(.mountPath == "/tmp")]'
  ```

  ### Pozostałe montowania wolumenów {#q109-board-other-mounts-readonly}

  Montowanie inne niż dostarczony /tmp może zezwalać na zapis. Sprawdź zwykłe i init-kontenery, w tym źródła projekcji dostępne tylko do odczytu.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec | {volumes, mounts: [.containers[], .initContainers[]? | .volumeMounts]}'
  ```

  ### Rzeczywisty korzeń tylko do odczytu {#q109-board-live-readonly-root}

  Deployment może deklarować korzeń tylko do odczytu, choć kontener worker nadal ma stare montowanie. Sprawdź opcje / w /proc/mounts i potwierdź ro po wdrożeniu.

  ```bash
  kubectl exec deployment/board -c worker -- awk '$2 == "/" {print $4}' /proc/mounts
  ```

  ### Rzeczywisty UID workera {#q109-board-live-worker-uid}

  Wybrany kontener worker może nadal działać jako root albo exec może zawodzić. Odczytaj rzeczywisty UID procesu i potwierdź, że jest dodatni.

  ```bash
  kubectl exec deployment/board -c worker -- id -u
  ```

  ### Zapis i odczyt w /tmp {#q109-board-live-tmp-reads-writes}

  Wolumen może być tylko do odczytu albo mieć uprawnienia blokujące kontener worker. Sprawdź rzeczywisty zapis i odczyt w /tmp z działającego kontenera worker.

  ```bash
  kubectl exec deployment/board -c worker -- sh -c 'p=$(mktemp /tmp/dq-check.XXXXXX) && trap "rm -f $p" EXIT && printf writable > "$p" && test "$(cat "$p")" = writable'
  ```

  ### Odpowiedź board po zabezpieczeniu {#q109-board-live-security-http}

  Ustawienia mogą już być prawidłowe, choć kontener worker nie może zapisać treści albo Service nie ma gotowego endpointu. Odpytaj board po wdrożeniu i porównaj z north-109.

  ```bash
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080
  ```


  ### Automatyczne montowanie danych dostępu {#q114-reader-disable-default-token}

  Pod lub jego ServiceAccount może nadal włączać automatyczne montowanie danych. Sprawdź flagę poda, a gdy jest pominięta, powiązany ServiceAccount.

  ```bash
  kubectl get deployment reader -o json | jq '.spec.template.spec | {serviceAccountName, automountServiceAccountToken}'; kubectl get serviceaccount reader -o jsonpath='{.automountServiceAccountToken}'
  ```

  ### Jawna projekcja tokenu {#q114-reader-explicit-token-projection}

  Kontener worker może montować inną projekcję, używać podścieżki lub żądać tokenu z innym odbiorcą albo okresem. Prześledź /credential do jednego źródła tokenu o path token dla https://kubernetes.default.svc.cluster.local i 600 sekund.

  ```bash
  kubectl get deployment reader -o json | jq '.spec.template.spec | {volumes, mounts: [.containers[] | select(.name == "worker") | .volumeMounts]}'
  ```

  ### Dokładne uprawnienia reader {#q114-reader-exact-role}

  Role reader może nadal dawać szerokie uprawnienia lub nie istnieć. Sprawdź każdą regułę i zostaw tylko get na nazwany ConfigMap route w podstawowej grupie API.

  ```bash
  kubectl get role reader -o json | jq '.rules'
  ```

  ### Autoryzowany odczyt route {#q114-reader-named-api-authorization}

  Projektowany token może nie istnieć, mieć niewłaściwego odbiorcę lub nie mieć zgody na route. Użyj rzeczywistego tokenu bez wypisywania i potwierdź HTTP 200 dla GET configmaps/route.

  ```bash
  api=$(cat /run/dq/facts/0/api-endpoint); token=$(kubectl exec deployment/reader -c worker -- cat /credential/token); printf 'header = "Authorization: Bearer %s"\n' "$token" | curl --config - --cacert /run/dq/facts/0/api-ca.pem -sS -o /dev/null -w '%{http_code}\n' "$api/api/v1/namespaces/$DQ_NAMESPACE/configmaps/route"
  ```

  ### Wartość route z API {#q114-reader-route-response-data}

  Udane żądanie może zwracać starą trasę, a wcześniejszy błąd pozostawić brak poprawnego JSON. Sprawdź data.route pod kątem north-114 bez wypisywania tokenu.

  ```bash
  api=$(cat /run/dq/facts/0/api-endpoint); token=$(kubectl exec deployment/reader -c worker -- cat /credential/token); printf 'header = "Authorization: Bearer %s"\n' "$token" | curl --config - --cacert /run/dq/facts/0/api-ca.pem -fsS "$api/api/v1/namespaces/$DQ_NAMESPACE/configmaps/route" | jq -e '.data.route == "north-114"'
  ```

  ### Odmowa listowania ConfigMap {#q114-reader-configmap-list-denial}

  Szerokie uprawnienie ConfigMap może pozwalać na listowanie. Sprawdź HTTP 403 dla GET configmaps z projektowanym tokenem, osobno od żądania nazwanego route.

  ```bash
  api=$(cat /run/dq/facts/0/api-endpoint); token=$(kubectl exec deployment/reader -c worker -- cat /credential/token); printf 'header = "Authorization: Bearer %s"\n' "$token" | curl --config - --cacert /run/dq/facts/0/api-ca.pem -sS -o /dev/null -w '%{http_code}\n' "$api/api/v1/namespaces/$DQ_NAMESPACE/configmaps"
  ```

  ### Odmowa listowania Secretów {#q114-reader-secret-list-denial}

  Role lub powiązanie może pozwalać na listę Secretów. Sprawdź HTTP 403 dla uwierzytelnionego GET secrets. Błąd uwierzytelnienia lub timeout nie potwierdza odmowy autoryzacji.

  ```bash
  api=$(cat /run/dq/facts/0/api-endpoint); token=$(kubectl exec deployment/reader -c worker -- cat /credential/token); printf 'header = "Authorization: Bearer %s"\n' "$token" | curl --config - --cacert /run/dq/facts/0/api-ca.pem -sS -o /dev/null -w '%{http_code}\n' "$api/api/v1/namespaces/$DQ_NAMESPACE/secrets"
  ```

  ### Odmowa odczytu innej ConfigMap {#q114-reader-unrelated-configmap-denial}

  Reguła może pozwalać czytać inne nazwane ConfigMapy. Sprawdź HTTP 403 dla configmaps/offlimits, zachowując odczyt route.

  ```bash
  api=$(cat /run/dq/facts/0/api-endpoint); token=$(kubectl exec deployment/reader -c worker -- cat /credential/token); printf 'header = "Authorization: Bearer %s"\n' "$token" | curl --config - --cacert /run/dq/facts/0/api-ca.pem -sS -o /dev/null -w '%{http_code}\n' "$api/api/v1/namespaces/$DQ_NAMESPACE/configmaps/offlimits"
  ```

  ### Dane kontroli uprawnień {#q114-reader-projection-observer-input}

  Kontrola konfiguracji tokenu może zatrzymać się przed wskazaniem pola przez problem z procesem lub wejściami. Sprawdź Deployment reader, ServiceAccount i narzędzia.

  ```bash
  command -v python3; kubectl get deployment reader -o name; kubectl get serviceaccount reader -o name
  ```


  ### Uprawnienie do odczytu route {#q125-station-reader-role}

  Rola station-reader może przyznawać więcej niż get dla ConfigMap route. Sprawdź każdą regułę dla nazwanego zasobu z podstawowej grupy API.

  ```bash
  kubectl get role station-reader -o json | jq '.rules'
  ```

  ### Podmiot powiązania station-reader {#q125-station-reader-subject}

  W RoleBinding station-reader może brakować podmiotu lub może być wpisany inny podmiot. Sprawdź, czy każdy podmiot wskazuje controller w przestrzeni nazw ćwiczenia.

  ```bash
  kubectl get rolebinding station-reader -o json | jq '.subjects'
  ```

  ### Bieżący dostęp controller do route {#q125-station-reader-live-allow}

  Bieżącemu żądaniu controller do configmaps/route może brakować uprawnienia do tej nazwy lub poświadczenie może pochodzić z niegotowego wdrożenia. Sprawdź selektor, powiązanie i rollout, a następnie ponów sprawdzenie HTTP 200.

  ```bash
  kubectl get role,rolebinding station-reader; kubectl rollout status deployment/controller --timeout=10s
  ```

  ### Wartość zwrócona dla route {#q125-station-reader-route-value}

  Żądanie controller mogło nie zwrócić wartości trasy lub zwrócić inną wartość niż north-125. Po potwierdzeniu, że żądanie się powiodło, sprawdź bieżący ConfigMap.

  ```bash
  kubectl get configmap route -o jsonpath='{.data.route}'
  ```

  ### Żądania odrzucane dla controller {#q125-station-reader-denials}

  Controller może mieć zbyt szerokie uprawnienia lub żądanie mogło nie dotrzeć do API z ważnym poświadczeniem. Sprawdź powiązania pod kątem nadmiarowego dostępu do zasobów, nazw lub czasowników i ponów oznaczone żądanie, oczekując HTTP 403.

  ```bash
  kubectl get roles,rolebindings -o yaml
  ```

  ### Odmowa dostępu observer do route {#q125-station-reader-observer-denial}

  Żądanie observer do configmaps/route mogło uzyskać dostęp lub zakończyć się przed autoryzacją. Sprawdź rollout i powiązania observer, a następnie ponów sprawdzenie HTTP 403.

  ```bash
  kubectl get rolebinding station-reader -o json | jq '.subjects'; kubectl rollout status deployment/observer --timeout=10s
  ```

  ### Wykaz obciążeń i kont {#q125-consumer-authority-actors}

  Kontrola mogła nie odczytać bieżących Deploymentów lub ServiceAccountów. Sprawdź listę obciążeń i tożsamości w przestrzeni nazw ćwiczenia.

  ```bash
  kubectl get deployments,serviceaccounts
  ```

  ### Zachowane obciążenia i tożsamości kontrolne {#q125-consumer-authority-retained-identity}

  Mógł się zmienić pierwotny UID, obraz worker lub konto kontrolne. Porównaj bieżące obciążenia i chronione ServiceAccounty z dostarczonym zapisem tożsamości.

  ```bash
  jq '{identities,images,originalAccounts}' /run/dq/facts/0/authority-identities.json; kubectl get deployment controller observer publisher sampler -o json | jq '.items[] | {name: .metadata.name, uid: .metadata.uid, account: .spec.template.spec.serviceAccountName, image: [.spec.template.spec.containers[] | select(.name == "worker") | .image]}'; kubectl get serviceaccount controller observer -o custom-columns=NAME:.metadata.name,UID:.metadata.uid
  ```

  ### Oddzielne konta konsumentów {#q125-consumer-authority-separate-accounts}

  Konsumenci mogą współdzielić ServiceAccount lub używać zarezerwowanej tożsamości. Sprawdź, czy publisher i sampler mają różne, niezarezerwowane konta w bieżącym wdrożeniu.

  ```bash
  kubectl get deployment publisher sampler -o custom-columns=NAME:.metadata.name,ACCOUNT:.spec.template.spec.serviceAccountName
  ```

  ### Projektowane poświadczenia w bieżących Podach {#q125-consumer-authority-projected-credential}

  Domyślny token może wciąż być montowany, a jawnie projektowane poświadczenie może być niedostępne albo powiązane z innym kontem lub Podem. Sprawdź ustawienia automatycznego montowania i projekcję w bieżącym wdrożeniu.

  ```bash
  kubectl get deployments publisher sampler -o json | jq '.items[] | {name: .metadata.name, spec: .spec.template.spec | {serviceAccountName, automountServiceAccountToken, volumes}}'
  kubectl get serviceaccounts -o json | jq '.items[] | {name: .metadata.name, automountServiceAccountToken}'
  kubectl get replicaset,pod -o json | jq '.items[] | {kind, name: .metadata.name, uid: .metadata.uid, owner: .metadata.ownerReferences, account: .spec.serviceAccountName}'
  for name in controller observer publisher sampler; do
    kubectl rollout status "deployment/$name" --timeout=10s
    kubectl exec "deployment/$name" -c worker -- cat /credential/token |
      python3 -I -c 'import base64,json,sys; part=sys.stdin.read().split(".")[1]; claims=json.loads(base64.urlsafe_b64decode(part+"===")); print(json.dumps({"subject": claims.get("sub"), "pod_uid": claims.get("kubernetes.io",{}).get("pod",{}).get("uid")}))'
  done
  ```

  ### Uprawnienia konsumentów do wskazanych rekordów {#q125-consumer-authority-named-grants}

  Powiązania mogą być niedostępne, nie istnieć lub mieć szerszy zakres niż Role w przestrzeni nazw z get dla jednego przypisanego ConfigMap. Sprawdź pasujące podmioty reprezentujące konta i grupy oraz wskazane przez nie Role.

  Kontrola zasad odczytuje Role i RoleBindingi w przestrzeni nazw ćwiczenia. Kontrola dostępu wykonuje żądania API wymienione w celach.

  ```bash
  kubectl get roles,rolebindings -o yaml
  ```

  ### Bieżące workery i obserwacje API {#q125-consumer-authority-live-observation}

  Ćwiczenie mogło nie odczytać bieżącego gotowego worker lub nie otrzymać prawidłowej odpowiedzi API. Sprawdź Deployment oraz jego bieżący ReplicaSet i Pod, a następnie ponów sprawdzenie żądań.

  ```bash
  kubectl get deployments,replicasets,pods -o wide
  ```

  ### Dozwolone żądanie przypisanego rekordu {#q125-consumer-authority-allowed-record}

  Dozwolone żądanie konsumenta mogło się nie powieść lub zwrócić niewłaściwy rekord. Sprawdź uprawnienie do nazwanego ConfigMap i bieżące dane konsumenta według dostarczonego kontraktu.

  ```bash
  api=$(cat api-endpoint)
  jq -c '.consumers[]' authority-contract.json | while IFS= read -r consumer; do
    name=$(jq -er .deployment <<<"$consumer")
    record=$(jq -er .configMap <<<"$consumer")
    jq '{deployment, configMap, key, expected: .response}' <<<"$consumer"
    kubectl rollout status "deployment/$name" --timeout=10s
    token=$(kubectl exec "deployment/$name" -c worker -- cat /credential/token)
    printf 'header = "Authorization: Bearer %s"\n' "$token" |
      curl --config - --cacert api-ca.pem -sS --max-time 3 -w '\nHTTP %{http_code}\n' "$api/api/v1/namespaces/$DQ_NAMESPACE/configmaps/$record"
    unset token
  done
  ```

  ### Żądania odrzucane dla tożsamości konsumentów {#q125-consumer-authority-denied-records}

  Niedozwolone żądanie mogło otrzymać status inny niż 403. Sprawdź uprawnienia do rekordów innych konsumentów, listowania i zasobów kontrolnych oraz błędy przed autoryzacją.

  ```bash
  api=$(cat api-endpoint)
  for name in controller observer publisher sampler; do
    kubectl rollout status "deployment/$name" --timeout=10s
    token=$(kubectl exec "deployment/$name" -c worker -- cat /credential/token)
    for path in configmaps/route configmaps/release-plan configmaps/sampling configmaps secrets secrets/control configmaps/offlimits; do
      printf '%s %s ' "$name" "$path"
      printf 'header = "Authorization: Bearer %s"\n' "$token" |
        curl --config - --cacert api-ca.pem -sS --max-time 3 -o /dev/null -w 'HTTP %{http_code}\n' "$api/api/v1/namespaces/$DQ_NAMESPACE/$path"
    done
    unset token
  done
  ```

  ### Dane kontroli polityki dostępu {#q125-consumer-authority-policy-observer}

  Kontrola polityk mogła się przerwać przed wskazaniem konkretnego warunku. Sprawdź dostarczony zapis tożsamości i dane API o obciążeniach, kontach i uprawnieniach.

  ```bash
  test -s /run/dq/facts/0/authority-identities.json; kubectl get deployments,serviceaccounts,roles,rolebindings
  ```

  ### Dane kontroli bieżących żądań {#q125-consumer-authority-request-observer}

  Kontrola żądań mogła się przerwać przed wskazaniem konkretnego warunku. Sprawdź dostarczony adres API, plik CA oraz gotowość bieżących Podów.

  ```bash
  test -s /run/dq/facts/0/api-ca.pem; test -s /run/dq/facts/0/api-endpoint; kubectl get deployments,pods
  ```
