heading: Tożsamość i dostęp workloadu
text: |
  # Tożsamość i dostęp workloadu

  Uwierzytelnianie i autoryzacja zawodzą na różnych granicach. Nieakceptowany odbiorca tokena może dać HTTP 401; uwierzytelniona tożsamość bez prawa HTTP 403. Sprawdzaj działający ServiceAccount i rzeczywiste powiązania, nie tylko ograniczony Role. Porównuj jedynie audience z poświadczeniem akceptowanym przez to samo API; issuer nie zawsze jest akceptowanym audience. Dekodowanie payload nie weryfikuje podpisu. Nigdy nie wyświetlaj wartości bearer.

  Używaj tylko jednorazowej zatoki offline. Security context Poda określa tożsamość i uprawnienia procesu; Pod Security admission sprawdza specyfikację przed uruchomieniem Poda. Przeczytaj zdarzenia ReplicaSetu, obejrzyj Deployment i napraw dostarczony `board.yaml`: UID 1000, seccomp RuntimeDefault, brak eskalacji, odebrane capabilities i system root tylko do odczytu to różne zabezpieczenia. Zapisywalny `emptyDir` w `/tmp` daje miejsce robocze; sprawdź `/proc/mounts` i zapis, zamiast wnioskować o montowaniu root z nieudanego polecenia.

  ServiceAccount jest principal współdzielonym przez używające go obciążenia. Ograniczenie grantu dotyczy wszystkich odbiorców; etykiety nie rozdzielają uprawnień. RoleBinding wiąże prawa z principal, a bieżące poświadczenia Pod identyfikują wywołującego. Śledź granty namespace przez szablony i aktualne Pody, zachowaj dostęp sterujący i sprawdź odczyty oraz zakazy krzyżowe. Zmiana szablonu nie przepisuje istniejących poświadczeń.

  Dostarczone CA i endpoint API pozwalają sprawdzić rzeczywiste HTTPS. Nie umieszczaj danych dostępowych w wyjściu, argumentach poleceń ani plikach: wczytaj projektowany token do zmiennej powłoki, przekaż nagłówek Authorization do curl przez standardowe wejście i potem usuń zmienną. HTTP 200 dla route i 403 dla każdej wskazanej zabronionej operacji potwierdzają tylko te żądania, nie wszystkie efektywne uprawnienia. Nie wyłączaj weryfikacji TLS i nie wypisuj tokenu.

  Źródła: [security context](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/), [ServiceAccount](https://kubernetes.io/docs/concepts/security/service-accounts/), [RBAC](https://kubernetes.io/docs/reference/access-authn-authz/rbac/).

  W zadaniu 109 sprawdź zdarzenia admission i tożsamość procesu:

  ```sh
  cd ~/quest
  kubectl describe rs
  kubectl get deployment board -o yaml
  kubectl exec deployment/board -- id -u
  ```

  W zadaniu 114 ten przykład sprawdza route tokenem reader i prywatnym CA:

  ```sh
  cd ~/quest
  kubectl get role reader -o yaml
  kubectl get deployment reader -o yaml
  api=$(cat api-endpoint)
  token=$(kubectl exec deployment/reader -- cat /credential/token)
  printf 'header = "Authorization: Bearer %s"\n' "$token" |
    curl --config - --cacert api-ca.pem -sS "$api/api/v1/namespaces/$DQ_NAMESPACE/configmaps/route" | jq .data.route
  unset token
  ```

  W zadaniu 125 sprawdź osobną Role i RoleBinding, a następnie użyj tokenu controller:

  ```sh
  cd ~/quest
  kubectl get role station-reader -o yaml
  kubectl get rolebinding station-reader -o yaml
  kubectl get deployment,serviceaccount,role,rolebinding,pods -o yaml
  api=$(cat api-endpoint)
  token=$(kubectl exec deployment/controller -- cat /credential/token)
  printf 'header = "Authorization: Bearer %s"\n' "$token" |
    curl --config - --cacert api-ca.pem -sS "$api/api/v1/namespaces/$DQ_NAMESPACE/configmaps/route" | jq .data.route
  unset token
  ```

  W zadaniu 037 powiąż ServiceAccount reader z Role w namespace, która zezwala tylko na `get` nazwanego ConfigMap `route` w głównej grupie API. Testuj z tożsamością workloadu: odczyt `route` ma być dozwolony, a odczyt `restricted` i listowanie Secretów zabronione. Dostęp administratora nie dowodzi uprawnień workloadu.
