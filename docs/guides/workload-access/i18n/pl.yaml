heading: Tożsamość i dostęp workloadu
text: "# Tożsamość i dostęp workloadu\n\nUżywaj tylko jednorazowej zatoki offline. Security context Poda określa tożsamość i uprawnienia procesu; Pod Security admission sprawdza specyfikację przed uruchomieniem Poda. Przeczytaj zdarzenia ReplicaSetu, obejrzyj Deployment i napraw dostarczony `board.json`: UID 1000, seccomp RuntimeDefault, brak eskalacji, odebrane capabilities i system root tylko do odczytu to różne zabezpieczenia. Zapisywalny `emptyDir` w `/tmp` daje miejsce robocze; sprawdź `/proc/mounts` i zapis, zamiast wnioskować o montowaniu root z nieudanego polecenia.\n\nServiceAccount identyfikuje workload. Projektowany token ma odbiorcę i żądany czas życia; kubelet go odnawia. Wyłącz automatyczne montowanie, gdy dostarczony manifest wymaga konkretnej projekcji. Role przyznaje operacje API, a RoleBinding przypisuje je podmiotom w namespace. `resourceNames: [route]` ogranicza nazwany `get`; nie przyznaje `list`. Przed zmianą sprawdź bieżące Role i RoleBinding oraz dostarczone pliki. W zadaniu 125 związany ma pozostać tylko `controller`; żądanie `observer` powinno być odrzucone.\n\nDostarczone CA i endpoint API pozwalają sprawdzić rzeczywiste HTTPS. Nie umieszczaj danych dostępowych w wyjściu, argumentach poleceń ani plikach: wczytaj projektowany token do zmiennej powłoki, przekaż nagłówek Authorization do curl przez standardowe wejście i potem usuń zmienną. HTTP 200 dla route i 403 dla każdej wskazanej zabronionej operacji potwierdzają tylko te żądania, nie wszystkie efektywne uprawnienia. Nie wyłączaj weryfikacji TLS i nie wypisuj tokenu.\n\nŹródła: [security context](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/), [ServiceAccount](https://kubernetes.io/docs/concepts/security/service-accounts/), [RBAC](https://kubernetes.io/docs/reference/access-authn-authz/rbac/).\n\nW zadaniu 109 sprawdź zdarzenia admission i tożsamość procesu:\n\n```sh\ncd ~/quest\nkubectl describe rs\nkubectl get deployment board -o yaml\nkubectl exec deployment/board -- id -u\n```\n\nW zadaniu 114 ten przykład sprawdza route tokenem reader i prywatnym CA:\n\n```sh\ncd ~/quest\nkubectl get role reader -o yaml\nkubectl get deployment reader -o yaml\napi=$(cat api-endpoint)\ntoken=$(kubectl exec deployment/reader -- cat /credential/token)\nprintf 'header = \"Authorization: Bearer %s\"\\n' \"$token\" |\n  curl --config - --cacert api-ca.pem -sS \"$api/api/v1/namespaces/$DQ_NAMESPACE/configmaps/route\" | jq .data.route\nunset token\n```\n\nW zadaniu 125 sprawdź osobną Role i RoleBinding, a następnie użyj tokenu controller:\n\n```sh\ncd ~/quest\nkubectl get role station-reader -o yaml\nkubectl get rolebinding station-reader -o yaml\napi=$(cat api-endpoint)\ntoken=$(kubectl exec deployment/controller -- cat /credential/token)\nprintf 'header = \"Authorization: Bearer %s\"\\n' \"$token\" |\n  curl --config - --cacert api-ca.pem -sS \"$api/api/v1/namespaces/$DQ_NAMESPACE/configmaps/route\" | jq .data.route\nunset token\n```\n\nW zadaniu 037 powiąż ServiceAccount reader z Role w namespace, która zezwala tylko na `get` nazwanego ConfigMap `route` w głównej grupie API. Testuj z tożsamością workloadu: odczyt `route` ma być dozwolony, a odczyt `restricted` i listowanie Secretów zabronione. Dostęp administratora nie dowodzi uprawnień workloadu.\n"
