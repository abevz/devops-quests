heading: Идентичность и доступ workload
text: |
  # Идентичность и доступ workload

  Аутентификация и авторизация отказывают на разных границах. Непринимаемый получатель токена может дать HTTP 401; идентичность без нужного разрешения после аутентификации — HTTP 403. Изучайте действующий ServiceAccount и реальные привязки, а не только ограниченный Role. Сравнивайте лишь audience с credential, принимаемым тем же API; issuer не всегда равен допустимому audience. Декодирование payload не проверяет подпись. Не выводите bearer-значения.

  Используйте только одноразовую офлайн-песочницу. Security context Pod задаёт идентичность и привилегии процесса; Pod Security admission проверяет спецификацию до запуска Pod. Изучите события ReplicaSet, проверьте Deployment и исправьте выданный `board.yaml`: UID 1000, seccomp RuntimeDefault, запрет повышения привилегий, удалённые capabilities и корневая файловая система только для чтения — разные меры защиты. Записываемый `emptyDir` в `/tmp` даёт временное место; проверяйте `/proc/mounts` и запись, а не делайте вывод о корневом монтировании по ошибке команды.

  ServiceAccount — principal, общий для всех использующих его нагрузок. Сужение grant влияет на всех потребителей; метки не разделяют authority. RoleBinding связывает именованные права с principal, а текущий Pod-bound credential определяет вызывающего. Проследите namespace grants через шаблоны и текущие Pod, сохраните здоровый управляющий доступ, проверьте разрешённые чтения и межпотребительские запреты. Изменение шаблона не переписывает существующий credential.

  Выданные CA и endpoint позволяют проверить настоящее HTTPS. Не выводите данные доступа и не передавайте их в аргументах или файлах: прочитайте проецируемый токен в переменную shell, передайте заголовок Authorization в curl через стандартный ввод и удалите переменную после проверки. HTTP 200 для route и 403 для каждой указанной запрещённой операции подтверждают только эти запросы, а не все действующие права. Не отключайте проверку TLS и не выводите токен.

  Источники: [security context](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/), [ServiceAccount](https://kubernetes.io/docs/concepts/security/service-accounts/), [RBAC](https://kubernetes.io/docs/reference/access-authn-authz/rbac/).

  В задании 109 изучите события admission и идентичность процесса:

  ```sh
  cd ~/quest
  kubectl describe rs
  kubectl get deployment board -o yaml
  kubectl exec deployment/board -- id -u
  ```

  В задании 114 этот пример проверяет route токеном reader и приватным CA:

  ```sh
  cd ~/quest
  kubectl get role reader -o yaml
  kubectl get deployment reader -o yaml
  api=$(cat api-endpoint)
  token=$(kubectl exec deployment/reader -- cat /credential/token)
  printf 'header = "Authorization: Bearer %s"\n' "$token" |
    curl --config - --cacert api-ca.pem -sS "$api/api/v1/namespaces/$DQ_NAMESPACE/configmaps/route" | jq .data.route
  unset token
  ```

  В задании 125 изучите отдельные Role и RoleBinding, затем используйте токен controller:

  ```sh
  cd ~/quest
  kubectl get role station-reader -o yaml
  kubectl get rolebinding station-reader -o yaml
  kubectl get deployment,serviceaccount,role,rolebinding,pods -o yaml
  api=$(cat api-endpoint)
  token=$(kubectl exec deployment/controller -- cat /credential/token)
  printf 'header = "Authorization: Bearer %s"\n' "$token" |
    curl --config - --cacert api-ca.pem -sS "$api/api/v1/namespaces/$DQ_NAMESPACE/configmaps/route" | jq .data.route
  unset token
  ```

  В квесте 037 привяжите ServiceAccount reader к Role в namespace, которая разрешает только `get` именованного ConfigMap `route` в основной API group. Проверяйте от имени workload: чтение `route` должно быть разрешено, а чтение `restricted` и список Secrets — запрещены. Доступ администратора не доказывает права workload.

  ### Точные правила route-reader {#route-reader-rule}

  В квесте 037 role.yaml изначально указывает retired. Проверьте Role route-reader: каждое правило должно разрешать только get для configmaps основной группы с resourceNames route; правила не должны быть пустыми или содержать записи nonResourceURLs. Более широкие ресурсы, действия или имена не соответствуют контракту. Примените исправленный Role и отличайте ошибку наблюдения API/JSON от несовпадения правил.

  ### Чтение от идентичности workload {#reader-identity-route}

  В квесте 037 Deployment identity использует ServiceAccount reader, а RoleBinding route-reader связывает эту идентичность с Role. Проверьте, что текущий Pod app=identity читает ConfigMap route и получает north. Успешное чтение администратором не доказывает разрешение. При отказе проверьте привязку, действующую идентичность и данные ConfigMap; отделяйте отсутствие Pod или ошибку чтения учётных данных от отказа авторизации API.

  ### Проверка обеих границ отказа {#reader-denial-boundaries}

  В квесте 037 чтение restricted и получение списка Secrets должны оставаться неуспешными для той же идентичности workload, которая читает route. Разрешения RBAC складываются: другой RoleBinding или ClusterRoleBinding может расширить доступ даже при узком route-reader. Если запрещённый запрос успешен, проверьте все привязки этой идентичности. Каждая текущая проверка сначала находит Pod и читает учётные данные; отказ на этом этапе отличается от неожиданного доступа. Используйте успешное чтение route как контроль, не считая два отрицательных запроса доказательством всех эффективных прав.


  ### Входы проверки ограничений {#q109-security-observer-input}

  Проверка ограничений может завершиться до указания условия при ошибке Python или входных данных. Проверьте доступ к Deployment и запуск инструментов.

  ```bash
  command -v python3; kubectl get deployment board -o name
  ```

  ### Сетевое пространство Pod {#q109-board-network-namespace}

  При правке шаблона могла включиться сеть хоста. Проверьте hostNetwork и сохраните отдельное сетевое пространство Pod.

  ```bash
  kubectl get deployment board -o jsonpath='{.spec.template.spec.hostNetwork}'
  ```

  ### Пространство процессов Pod {#q109-board-process-namespace}

  Шаблон Pod мог начать использовать пространство процессов хоста. Проверьте hostPID и оставьте его выключенным.

  ```bash
  kubectl get deployment board -o jsonpath='{.spec.template.spec.hostPID}'
  ```

  ### Пространство IPC Pod {#q109-board-ipc-namespace}

  Шаблон Pod мог начать использовать IPC хоста. Проверьте hostIPC и сохраните отдельное пространство IPC.

  ```bash
  kubectl get deployment board -o jsonpath='{.spec.template.spec.hostIPC}'
  ```

  ### Источники томов board {#q109-board-volume-sources}

  При правке шаблона могли добавить том hostPath. Проверьте источники томов и уберите зависимость от hostPath.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec.volumes'
  ```

  ### Запуск без прав root {#q109-board-user-policy}

  У контейнера могло исчезнуть действующее runAsNonRoot, появиться переопределение или UID 0. Проверьте настройки Pod, обычных и init-контейнеров. Явно заданные UID должны быть положительными.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec | {pod: .securityContext, worker: [.containers[], .initContainers[]? | .securityContext]}'
  ```

  ### Действующий фильтр системных вызовов {#q109-board-syscall-filter}

  Фильтр системных вызовов мог исчезнуть или быть переопределён. Проверьте, что обычные и init-контейнеры используют RuntimeDefault с учётом настроек Pod.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec | {pod: .securityContext.seccompProfile, containers: [.containers[], .initContainers[]? | .securityContext.seccompProfile]}'
  ```

  ### Привилегированный режим {#q109-board-privileged-mode}

  Обычному или init-контейнеру могли включить привилегированный режим. Проверьте securityContext каждого контейнера и уберите privileged: true.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec | [.containers[], .initContainers[]? | .securityContext.privileged]'
  ```

  ### Флаг повышения привилегий {#q109-board-privilege-escalation}

  Контейнер может допускать повышение привилегий, если флаг отсутствует или включён. Задайте allowPrivilegeEscalation: false каждому обычному и init-контейнеру.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec | [.containers[], .initContainers[]? | .securityContext.allowPrivilegeEscalation]'
  ```

  ### Сброшенные capabilities {#q109-board-drop-capabilities}

  Контейнер мог перестать сбрасывать стандартный набор capabilities. Проверьте ALL в списке drop каждого обычного и init-контейнера.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec | [.containers[], .initContainers[]? | .securityContext.capabilities.drop]'
  ```

  ### Добавленные capabilities {#q109-board-no-added-capabilities}

  Шаблон мог снова добавить capabilities после сброса. Проверьте, что список add каждого обычного и init-контейнера пуст.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec | [.containers[], .initContainers[]? | .securityContext.capabilities.add]'
  ```

  ### Политика restricted в namespace {#q109-restricted-namespace}

  У пространства имён могла отсутствовать метка restricted, либо чтение не сработало. Проверьте метку стенда и сохраните режим restricted при правке нагрузки.

  ```bash
  kubectl get namespace "$DQ_NAMESPACE" -o json | jq '.metadata.labels["pod-security.kubernetes.io/enforce"]'
  ```

  ### Число реплик board {#q109-board-replica-contract}

  Deployment могли масштабировать во время ремонта, либо он отсутствует. Проверьте, что board по-прежнему запрашивает одну реплику.

  ```bash
  kubectl get deployment board -o jsonpath='{.spec.replicas}'
  ```

  ### Готовая реплика board {#q109-board-ready-replica}

  Шаблон Pod может существовать, пока admission или rollout мешают готовности. Проверьте события и подтвердите одну готовую реплику в статусе board.

  ```bash
  kubectl get deployment board -o jsonpath='{.status.readyReplicas}'; kubectl get pods -l app=board
  ```

  ### Имя контейнера worker {#q109-board-worker-identity}

  В нагрузке мог измениться worker, появиться лишний обычный контейнер или исчезнуть основная секция. Оставьте ровно один обычный контейнер worker.

  ```bash
  kubectl get deployment board -o json | jq '[.spec.template.spec.containers[].name]'
  ```

  ### Явно заданные UID {#q109-board-explicit-user-ids}

  Явный runAsUser мог стать нулевым или некорректным. Проверьте целые положительные UID в настройках Pod, обычных и init-контейнеров.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec | {pod: .securityContext.runAsUser, containers: [.containers[], .initContainers[]? | .securityContext.runAsUser]}'
  ```

  ### Объявленный корень только для чтения {#q109-board-declared-readonly-root}

  Один из контейнеров мог по-прежнему разрешать запись в корень образа. Задайте readOnlyRootFilesystem: true обычным и init-контейнерам, а временные записи оставьте на отдельном томе.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec | [.containers[], .initContainers[]? | .securityContext.readOnlyRootFilesystem]'
  ```

  ### Переопределение seccomp контейнера {#q109-board-container-seccomp-override}

  Переопределение seccomp у контейнера могло заменить RuntimeDefault. Проверьте обычные и init-контейнеры и сохраните наследуемый RuntimeDefault или явно укажите его.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec | [.containers[], .initContainers[]? | .securityContext.seccompProfile]'
  ```

  ### Источник временного тома {#q109-board-temporary-volume-type}

  Монтирование /tmp могло исчезнуть или указывать на том другого типа. Проследите имя тома от worker до объявленного источника emptyDir.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec | {volumes, worker: [.containers[] | select(.name == "worker") | .volumeMounts]}'
  ```

  ### Временное монтирование с записью {#q109-board-writable-temporary-mount}

  У worker /tmp мог быть смонтирован только для чтения либо указан несколько раз. Проверьте единственное доступное на запись монтирование из временного emptyDir.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec.containers[] | select(.name == "worker") | [.volumeMounts[] | select(.mountPath == "/tmp")]'
  ```

  ### Прочие монтирования томов {#q109-board-other-mounts-readonly}

  Дополнительное монтирование могло разрешить запись помимо выданного /tmp. Проверьте монтирования обычных и init-контейнеров, включая источники, доступные только на чтение.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec | {volumes, mounts: [.containers[], .initContainers[]? | .volumeMounts]}'
  ```

  ### Фактическое монтирование корня только для чтения {#q109-board-live-readonly-root}

  В Deployment корень мог быть доступен только для чтения, пока запущенный worker использует старое монтирование. Проверьте параметры / в /proc/mounts и убедитесь, что после rollout есть ro.

  ```bash
  kubectl exec deployment/board -c worker -- awk '$2 == "/" {print $4}' /proc/mounts
  ```

  ### Фактический UID worker {#q109-board-live-worker-uid}

  Выбранный worker мог работать от root, либо exec завершился ошибкой. Прочитайте UID процесса и убедитесь, что он больше нуля.

  ```bash
  kubectl exec deployment/board -c worker -- id -u
  ```

  ### Запись и чтение в /tmp {#q109-board-live-tmp-reads-writes}

  Временный том мог быть доступен только на чтение или его права мешают worker. Проверьте запись и чтение в /tmp из работающего worker.

  ```bash
  kubectl exec deployment/board -c worker -- sh -c 'p=$(mktemp /tmp/dq-check.XXXXXX) && trap "rm -f $p" EXIT && printf writable > "$p" && test "$(cat "$p")" = writable'
  ```

  ### Ответ board после правок безопасности {#q109-board-live-security-http}

  Настройки безопасности могут быть верными, пока worker не может записать содержимое или у Service нет готового endpoint. Запросите board после rollout и сравните с north-109.

  ```bash
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080
  ```
