heading: Workload identity and access
text: "# Workload identity and access\n\nUse only the disposable offline bay. A Pod security context controls process identity and privilege; Pod Security admission checks the requested specification before the Pod starts. Read ReplicaSet events, inspect the Deployment, and repair the supplied `board.json`: UID 1000, RuntimeDefault seccomp, no privilege escalation, dropped capabilities and a read-only root are distinct protections. A writable `emptyDir` at `/tmp` provides scratch space; inspect `/proc/mounts` and test writes rather than inferring the root mount from a failed command.\n\nA ServiceAccount identifies a workload. A projected token has an audience and requested lifetime; the kubelet rotates it. Disable automatic mounting where the supplied manifest requests a specific projection. A Role grants API operations and a RoleBinding attaches them to subjects in a namespace. `resourceNames: [route]` restricts the named `get`; it does not grant `list`. Inspect both live Role and RoleBinding and the supplied files before editing. In quest 125 only `controller` should remain bound; the `observer` request should be denied.\n\nThe supplied CA and API endpoint allow a real HTTPS test. Keep credentials out of output, command arguments and files: read the projected token into a shell variable, pass the Authorization header to curl through standard input and unset it afterward. HTTP 200 for the route and 403 for each listed forbidden operation are observations for those exact requests, not proof of every effective permission. Do not disable TLS verification or print the token.\n\nReferences: [security context](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/), [ServiceAccounts](https://kubernetes.io/docs/concepts/security/service-accounts/), [RBAC](https://kubernetes.io/docs/reference/access-authn-authz/rbac/).\n\nIn quest 109, inspect admission events and the running identity:\n\n```sh\ncd ~/quest\nkubectl describe rs\nkubectl get deployment board -o yaml\nkubectl exec deployment/board -- id -u\n```\n\nIn quest 114, this example checks the route with the reader token and private CA:\n\n```sh\ncd ~/quest\nkubectl get role reader -o yaml\nkubectl get deployment reader -o yaml\napi=$(cat api-endpoint)\ntoken=$(kubectl exec deployment/reader -- cat /credential/token)\nprintf 'header = \"Authorization: Bearer %s\"\\n' \"$token\" |\n  curl --config - --cacert api-ca.pem -sS \"$api/api/v1/namespaces/$DQ_NAMESPACE/configmaps/route\" | jq .data.route\nunset token\n```\n\nIn quest 125, inspect the separate Role and RoleBinding, then use the controller token:\n\n```sh\ncd ~/quest\nkubectl get role station-reader -o yaml\nkubectl get rolebinding station-reader -o yaml\napi=$(cat api-endpoint)\ntoken=$(kubectl exec deployment/controller -- cat /credential/token)\nprintf 'header = \"Authorization: Bearer %s\"\\n' \"$token\" |\n  curl --config - --cacert api-ca.pem -sS \"$api/api/v1/namespaces/$DQ_NAMESPACE/configmaps/route\" | jq .data.route\nunset token\n```\n\nIn quest 037, bind the reader ServiceAccount to a namespace Role that grants only `get` on the named ConfigMap `route` in the core API group. Test using the workload identity: reading `route` must be allowed, while reading `restricted` and listing Secrets must be denied. An administrator's own access does not establish the workload's permissions.\n"
