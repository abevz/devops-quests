heading: Workload identity and access
text: |
  # Workload identity and access

  Authentication and authorization fail at different boundaries. An unaccepted token recipient can produce HTTP 401; an authenticated identity without the required grant can receive HTTP 403. Inspect the acting ServiceAccount and actual bindings, not only a restricted Role. Compare only audience metadata with a credential accepted by the same API; issuer does not always equal accepted audience. Payload decoding does not verify a signature. Never print bearer values.

  Use only the disposable offline bay. A Pod security context controls process identity and privilege; Pod Security admission checks the requested specification before the Pod starts. Read ReplicaSet events, inspect the Deployment, and repair the supplied `board.yaml`: UID 1000, RuntimeDefault seccomp, no privilege escalation, dropped capabilities and a read-only root are distinct protections. A writable `emptyDir` at `/tmp` provides scratch space; inspect `/proc/mounts` and test writes rather than inferring the root mount from a failed command.

  A ServiceAccount is a principal shared by every workload using it. Tightening its grant affects all those consumers; workload labels do not split authority. A RoleBinding attaches named permissions to a principal, while current Pod-bound credentials establish the caller. Trace namespace grants through both templates and current Pods, retain healthy control access and verify each intended read and cross-consumer denial. Changing a template does not rewrite an existing credential.

  The supplied CA and API endpoint allow a real HTTPS test. Keep credentials out of output, command arguments and files: read the projected token into a shell variable, pass the Authorization header to curl through standard input and unset it afterward. HTTP 200 for the route and 403 for each listed forbidden operation are observations for those exact requests, not proof of every effective permission. Do not disable TLS verification or print the token.

  References: [security context](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/), [ServiceAccounts](https://kubernetes.io/docs/concepts/security/service-accounts/), [RBAC](https://kubernetes.io/docs/reference/access-authn-authz/rbac/).

  In quest 109, inspect admission events and the running identity:

  ```sh
  cd ~/quest
  kubectl describe rs
  kubectl get deployment board -o yaml
  kubectl exec deployment/board -- id -u
  ```

  In quest 114, this example checks the route with the reader token and private CA:

  ```sh
  cd ~/quest
  kubectl get role reader -o yaml
  kubectl get deployment reader -o yaml
  api=$(cat api-endpoint)
  token=$(kubectl exec deployment/reader -- cat /credential/token)
  printf 'header = "Authorization: Bearer %s"\n' "$token" |
    curl --config - --cacert api-ca.pem -sS "$api/api/v1/namespaces/$DQ_NAMESPACE/configmaps/route" | jq .data.route
  unset token
  ```

  In quest 125, inspect the separate Role and RoleBinding, then use the controller token:

  ```sh
  cd ~/quest
  kubectl get role station-reader -o yaml
  kubectl get rolebinding station-reader -o yaml
  kubectl get deployment,serviceaccount,role,rolebinding,pods -o yaml
  api=$(cat api-endpoint)
  token=$(kubectl exec deployment/controller -- cat /credential/token)
  printf 'header = "Authorization: Bearer %s"\n' "$token" |
    curl --config - --cacert api-ca.pem -sS "$api/api/v1/namespaces/$DQ_NAMESPACE/configmaps/route" | jq .data.route
  unset token
  ```

  In quest 037, bind the reader ServiceAccount to a namespace Role that grants only `get` on the named ConfigMap `route` in the core API group. Test using the workload identity: reading `route` must be allowed, while reading `restricted` and listing Secrets must be denied. An administrator's own access does not establish the workload's permissions.

  ### Exact route-reader rules {#route-reader-rule}

  In quest 037, role.yaml initially names retired. Inspect Role route-reader: every rule must grant only get on core-group configmaps with resourceNames route; rules must be nonempty and contain no nonResourceURLs entries. Broader resources, verbs or names do not meet this contract. Apply the corrected Role and distinguish an API/JSON observation error from a rule mismatch.

  ### Read as the workload identity {#reader-identity-route}

  In quest 037, the identity Deployment uses ServiceAccount reader and RoleBinding route-reader connects that principal to the Role. Verify the actual app=identity Pod can read ConfigMap route and receive north. A correct administrator read does not prove this grant. Inspect the binding, acting identity and ConfigMap data if the read fails, and separate missing Pod or credential-read errors from API authorization failures.

  ### Check both retained denial boundaries {#reader-denial-boundaries}

  In quest 037, reading restricted and listing Secrets must remain unsuccessful for the same workload identity that can read route. RBAC grants add together: another RoleBinding or ClusterRoleBinding can broaden access even when route-reader is narrow. Inspect all bindings for that principal if a forbidden request succeeds. Each current check first locates the Pod and reads its credential; failure there is separate from unexpected access. Use the successful route read as the control, without inferring every effective permission from these two negative requests.


  ### Inputs to the security check {#q109-security-observer-input}

  The security observer can stop before reporting a control if its Python process or workspace input fails. Confirm that the live Deployment is readable and the local tools can start.

  ```bash
  command -v python3; kubectl get deployment board -o name
  ```

  ### Pod network namespace {#q109-board-network-namespace}

  A workload repair may have enabled host networking. Inspect hostNetwork and keep board in its Pod network namespace.

  ```bash
  kubectl get deployment board -o jsonpath='{.spec.template.spec.hostNetwork}'
  ```

  ### Pod process namespace {#q109-board-process-namespace}

  The Pod template may have been changed to share the host process namespace. Inspect hostPID and keep it disabled.

  ```bash
  kubectl get deployment board -o jsonpath='{.spec.template.spec.hostPID}'
  ```

  ### Pod IPC namespace {#q109-board-ipc-namespace}

  The Pod template may have been changed to share host IPC. Inspect hostIPC and keep the Pod IPC namespace isolated.

  ```bash
  kubectl get deployment board -o jsonpath='{.spec.template.spec.hostIPC}'
  ```

  ### Relay volume sources {#q109-board-volume-sources}

  A hostPath volume may have been added while changing the template. Inspect the declared sources and remove any hostPath dependency.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec.volumes'
  ```

  ### Non-root execution {#q109-board-user-policy}

  A container may lack effective runAsNonRoot, override it, or specify UID 0. Inspect both Pod and container settings, including init containers, and keep all explicit user IDs positive.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec | {pod: .securityContext, worker: [.containers[], .initContainers[]? | .securityContext]}'
  ```

  ### Effective syscall filter {#q109-board-syscall-filter}

  The default syscall filter may have been removed or overridden. Check the effective RuntimeDefault profile on regular and init containers, including inherited Pod settings.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec | {pod: .securityContext.seccompProfile, containers: [.containers[], .initContainers[]? | .securityContext.seccompProfile]}'
  ```

  ### Privileged mode {#q109-board-privileged-mode}

  A regular or init container may have gained privileged mode. Inspect each container’s securityContext and remove the privileged override.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec | [.containers[], .initContainers[]? | .securityContext.privileged]'
  ```

  ### Privilege escalation flag {#q109-board-privilege-escalation}

  A container may allow privilege escalation because its flag is absent or enabled. Set allowPrivilegeEscalation explicitly to false on each regular and init container.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec | [.containers[], .initContainers[]? | .securityContext.allowPrivilegeEscalation]'
  ```

  ### Dropped capabilities {#q109-board-drop-capabilities}

  A container may no longer drop the default capability set. Check that the drop list contains ALL on each regular and init container.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec | [.containers[], .initContainers[]? | .securityContext.capabilities.drop]'
  ```

  ### Added capabilities {#q109-board-no-added-capabilities}

  The template may add capabilities back after dropping them. Check the add list of every regular and init container and keep it empty.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec | [.containers[], .initContainers[]? | .securityContext.capabilities.add]'
  ```

  ### Restricted namespace enforcement {#q109-restricted-namespace}

  The namespace may lack the restricted enforcement label or the namespace read may fail. Check the current bay label and retain restricted enforcement while fixing the workload.

  ```bash
  kubectl get namespace "$DQ_NAMESPACE" -o json | jq '.metadata.labels["pod-security.kubernetes.io/enforce"]'
  ```

  ### Board replica count {#q109-board-replica-contract}

  The Deployment may have been scaled during repair or may be missing. Check that board still requests one replica.

  ```bash
  kubectl get deployment board -o jsonpath='{.spec.replicas}'
  ```

  ### Ready board replica {#q109-board-ready-replica}

  The pod template can exist while admission or rollout prevents a ready replica. Check the events and confirm one ready replica in the live board status.

  ```bash
  kubectl get deployment board -o jsonpath='{.status.readyReplicas}'; kubectl get pods -l app=board
  ```

  ### Worker container identity {#q109-board-worker-identity}

  The workload may contain a renamed worker, an extra regular container or no regular container. Keep exactly one regular container named worker.

  ```bash
  kubectl get deployment board -o json | jq '[.spec.template.spec.containers[].name]'
  ```

  ### Explicit user IDs {#q109-board-explicit-user-ids}

  An explicit runAsUser may be zero or otherwise invalid. Check all explicit Pod and container user IDs and keep them positive integers, including on init containers.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec | {pod: .securityContext.runAsUser, containers: [.containers[], .initContainers[]? | .securityContext.runAsUser]}'
  ```

  ### Declared read-only root {#q109-board-declared-readonly-root}

  One container may still allow writes to its image filesystem. Set readOnlyRootFilesystem to true for each regular and init container, and keep temporary writes on the separate volume.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec | [.containers[], .initContainers[]? | .securityContext.readOnlyRootFilesystem]'
  ```

  ### Container seccomp override {#q109-board-container-seccomp-override}

  A container-level seccomp override may replace the supplied RuntimeDefault filter. Check overrides on every regular and init container and retain the inherited default or its explicit equivalent.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec | [.containers[], .initContainers[]? | .securityContext.seccompProfile]'
  ```

  ### Source of the temporary volume {#q109-board-temporary-volume-type}

  The /tmp mount may be missing or refer to a volume other than emptyDir. Follow the named mount from worker to the declared temporary volume source.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec | {volumes, worker: [.containers[] | select(.name == "worker") | .volumeMounts]}'
  ```

  ### Writable temporary mount {#q109-board-writable-temporary-mount}

  The named worker may mount /tmp read-only or have conflicting entries. Check that it has a single writable mount backed by the temporary emptyDir.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec.containers[] | select(.name == "worker") | [.volumeMounts[] | select(.mountPath == "/tmp")]'
  ```

  ### Other volume mounts {#q109-board-other-mounts-readonly}

  A mount other than the supplied /tmp scratch mount may permit writes. Inspect all regular and init container mounts, including inherently read-only projected sources.

  ```bash
  kubectl get deployment board -o json | jq '.spec.template.spec | {volumes, mounts: [.containers[], .initContainers[]? | .volumeMounts]}'
  ```

  ### Live read-only root mount {#q109-board-live-readonly-root}

  The Deployment may declare a read-only root while the selected running worker still has an older filesystem mount. Inspect the options for / in /proc/mounts and verify ro after rollout.

  ```bash
  kubectl exec deployment/board -c worker -- awk '$2 == "/" {print $4}' /proc/mounts
  ```

  ### Live worker user ID {#q109-board-live-worker-uid}

  The selected worker may still run as root or the exec may fail. Read the actual process user ID and confirm it is a positive number.

  ```bash
  kubectl exec deployment/board -c worker -- id -u
  ```

  ### Write and read in /tmp {#q109-board-live-tmp-reads-writes}

  The temporary mount may be read-only or have permissions that block the worker. Verify an actual write and read in /tmp from the running worker.

  ```bash
  kubectl exec deployment/board -c worker -- sh -c 'p=$(mktemp /tmp/dq-check.XXXXXX) && trap "rm -f $p" EXIT && printf writable > "$p" && test "$(cat "$p")" = writable'
  ```

  ### Board response after hardening {#q109-board-live-security-http}

  Security settings may now be correct while worker cannot write its served content or the Service lacks a ready endpoint. Query board after rollout and compare with north-109.

  ```bash
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080
  ```
