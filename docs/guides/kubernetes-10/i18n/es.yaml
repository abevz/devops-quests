heading: '10. Redes: desde un nombre Service hasta una dirección de pod lista'
text: '## 10. Redes: desde un nombre Service hasta una dirección de pod ready


  **De un vistazo**

  - A Service proporciona un punto de acceso estable

  - A selector selecciona Pods por etiquetas

  - EndpointSlice describe los destinatarios reales.


  **Miniejemplo:** solo en el grupo desechable kind preparado anteriormente. Cree el namespace con `kubectl
  --kubeconfig /tmp/guides-order-rest.kubeconfig --context kind-guides-order-rest create namespace guide-mini-29`.
  Guarde el listado como `mini.sh`; ejecútelo con `bash -e mini.sh`.


  ```bash

  k() { kubectl --kubeconfig /tmp/guides-order-rest.kubeconfig --context kind-guides-order-rest -n guide-mini-29
  "$@"; }

  k create deployment web --image=nginx:1.29-alpine

  k rollout status deployment/web --timeout=90s

  k expose deployment web --port=80

  k get service web -o jsonpath=''{.spec.selector.app}{"\n"}''

  ```


  **Predecir:** ¿Qué mostrará el último comando después de los comandos anteriores finish?


  > [!question]- Respuesta

  > Comando real stdout:

  >

  > ```text

  > deployment.apps/web created

  > Waiting for deployment "web" rollout to finish: 0 of 1 updated replicas are available...

  > deployment "web" successfully rolled out

  > service/web exposed

  > web

  > ```

  >

  > Ecódigo de salida: 0.


  El Service recibió selector app=web. Esto demuestra la relación de selección; La entrega HTTP no se
  prueba aquí por separado.


  Un Pod recibe una dirección de la implementación de red; un Service proporciona un punto de entrada
  estable al pods seleccionado.

  ClusterIP es una dirección virtual interna, NodePort un puerto en los nodos y LoadBalancer una solicitud
  para un equilibrador de carga externo.

  kube-proxy configura el reenvío del kernel; una implementación eBPF puede reemplazar ese mecanismo.

  Dirección completa y mecánica de paquetes: [[Networking-Visual-Guide#19. Kubernetes: адрес пода, виртуальный
  Service и реальные получатели|pod addresses, virtual Services and actual backends]].

  *(según documentación)* — [Service](https://kubernetes.io/docs/concepts/services-networking/service/).


  ### Por qué existe un Service sin ninguna aplicación detrás


  **De un vistazo**

  El objeto - A Service puede existir sin Pods coincidentes

  - Su selector debe coincidir con las etiquetas

  La dirección - A Service no prueba que exista una aplicación.


  **Miniejemplo:** solo en el grupo desechable kind preparado anteriormente. Cree el namespace con `kubectl
  --kubeconfig /tmp/guides-order-rest.kubeconfig --context kind-guides-order-rest create namespace guide-mini-30`.
  Guarde el listado como `mini.sh`; ejecútelo con `bash -e mini.sh`.


  ```bash

  k() { kubectl --kubeconfig /tmp/guides-order-rest.kubeconfig --context kind-guides-order-rest -n guide-mini-30
  "$@"; }

  k create service clusterip lonely --tcp=80:80

  k get service lonely -o jsonpath=''{.spec.selector.app}{"\n"}''

  k get pods -l app=lonely --no-headers

  k get pods -l app=lonely -o jsonpath=''{.items}{"\n"}''

  ```


  **Predecir:** ¿Qué mostrará el último comando después de los comandos anteriores finish?


  > [!question]- Respuesta

  > Comando real stdout:

  >

  > ```text

  > service/lonely created

  > lonely

  > []

  > ```

  >

  > Ecódigo de salida: 0.


  El selector busca app=lonely, pero ningún Pod era created en el namespace. El último comando devuelve
  una lista vacía.


  Un ready EndpointSlice no prueba que la aplicación escuche en `targetPort` o que una política permita
  la ruta.

  `publishNotReadyAddresses: true` cambia la semántica de publicación readiness; este es un escenario
  especial,

  no es una reparación para una sonda readiness incorrecta. *(según documentación)* —

  [EndpointSlice](https://kubernetes.io/docs/concepts/services-networking/endpoint-slices/).


  **`service.yaml` en `/tmp/vg-k8s-work`: un selector completo y deliberadamente incorrecto:**


  1. A Service define un par selector y un par `port`/`targetPort`: el primero es el puerto Service; el
  segundo es el puerto backend.

  2. El controlador EndpointSlice selecciona el pods **dentro del Service namespace**.

  Las direcciones 3. A y sus condiciones readiness se registran en el API.

  4. El componente de red observa Service/EndpointSlice y actualiza las rutas a addresses elegibles.

  El cliente 5. A se conecta al Service; la conexión se reenvía a un backend.


  > [!info]- Explicación más profunda

  > ```yaml

  > apiVersion: v1

  > kind: Service

  > metadata:

  >   name: web

  >   namespace: vg-k8s

  > spec:

  >   type: ClusterIP

  >   selector:

  >     app: typo

  >   ports:

  >     - port: 80

  >       targetPort: 80

  > ```

  >

  > **Comando desde cualquier directorio: inspeccione addresses y readiness por separado del Service:**

  >

  > ```bash

  > kubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s \

  >   -n vg-k8s get endpointslices -l kubernetes.io/service-name=web -o json \

  >   | jq ''[.items[].endpoints[]? | {ip: .addresses[0], ready: .conditions.ready}]''

  > ```

  >

  > **Resultado de una ejecución nueva: un ejemplo para leer:**

  >

  > ```text

  > []

  > ```

  >

  >  Coincide con el selector `app: web` producido addresses. La réplica no preparada del rollout roto

  >  tiene `ready: false`; el antiguo ready replicas tiene `true`. *(verificado)*.

  >

  > **`service.yaml` en `/tmp/vg-k8s-work`: el archivo completo corregido:**

  >

  > ```yaml

  > apiVersion: v1

  > kind: Service

  > metadata:

  >   name: web

  >   namespace: vg-k8s

  > spec:

  >   type: ClusterIP

  >   selector:

  >     app: web

  >   ports:

  >     - port: 80

  >       targetPort: 80

  > ```

  >

  > **Salida del cliente anterior: una ejecución registrada de 1.33.0/Cilium para leer:**

  >

  > ```text

  > wget: can''t connect to remote host (10.106.189.46): Operation not permitted

  > ```

  >

  > Esta es una **ejecución grabada** de [[Kubernetes-Coding-Drills-Solutions#2 — Сервис не отвечает|2
  — Service does not respond]].

  > No es un error universal para un Service sin backends: Cilium reemplazar kube-proxy podría

  > rechazo en el zócalo. En este experimento no se verificó el mensaje exacto del cliente en el nuevo
  clúster kind. *(no verificado)*.


  ### DNS y el número de puntos


  **De un vistazo**

  - DNS resuelve el nombre primero

  - Las reglas de búsqueda expanden un nombre corto

  - El éxito DNS no demuestra la disponibilidad del puerto.


  **Escenario breve**


  El nombre web se resolvió como ClusterIP. La solicitud posterior HTTP programó el tiempo de out.


  **Predecir:** ¿Esto demuestra un error DNS?


  > [!question]- Respuesta

  > Análisis de las condiciones dadas: No: DNS ya devolvió una dirección. Luego verifique los destinatarios,
  el puerto, la ruta y la política.


  El Service ordinario DNS devuelve su ClusterIP; a headless Service devuelve el pod seleccionado addresses.

  Se busca un nombre corto como `web` con sufijos namespace/cluster.

  `ndots:5` en un `resolv.conf` típico significa que primero se prueba un nombre con menos de cinco puntos

  con sufijos de búsqueda. Esto puede agregar consultas incluso para un nombre externo.

  Un nombre completo con un punto al final, como `web.vg-k8s.svc.cluster.local.`, es absoluto;

  el dominio del clúster real es configurable. *(según documentación)* —

  [DNS](https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/).


  ### Policies, HTTP entrante y límites de propiedad


  **De un vistazo**

  - Policy restringe las conexiones para Pods seleccionados

  - An ruta HTTP selecciona por separado un backend

  Se requieren destinatarios - Ready independientemente de si existen reglas.


  **Escenario breve**


  HTTPRoute apunta a un Service sin ready endpoints.


  **Predecir:** ¿Una regla HTTPRoute crea por sí misma pods ready?


  > [!question]- Respuesta

  > Análisis de las condiciones dadas: No. Describe una ruta; otros mecanismos proporcionan readiness
  y el número de destinatarios.


  NetworkPolicy controla las conexiones ingress/egress para pods seleccionados; policies son aditivos,

  y dos endpoints aislados necesitan permiso en ambos lados. El objeto solo funciona con soporte CNI.

  Ingress define el enrutamiento HTTP a través de un controlador independiente; Gateway API separa GatewayClass/Gateway

  infraestructura de rutas HTTPRoute. HTTPRoute reporta adjunto en `status.parents`.

  Ejemplos detallados completos: [[Networking-Visual-Guide#20. Политики, Ingress, Gateway API и service
  mesh|policies, Ingress, Gateway API and service mesh]].

  *(según documentación)* — [NetworkPolicy](https://kubernetes.io/docs/concepts/services-networking/network-policies/),

  [Ingress](https://kubernetes.io/docs/concepts/services-networking/ingress/),

  [Gateway API](https://gateway-api.sigs.k8s.io/concepts/api-overview/).


  > [!info]- Explicación más profunda

  > En el ejercicio 26, las ponderaciones 90/10 describen una distribución de probabilidad, no una garantía
  de 90 solicitudes out de cada 100.

  El enrutamiento del encabezado >  y una referencia a otro namespace requieren un accesorio permitted
  y, cuando corresponda,

  > a ReferenceGrant. Crear solo HTTPRoute no puede arreglar una implementación faltante de Gateway o
  sus CRD.

  > Gateway API, mesh y NetworkPolicy no se instalaron aquí. *(no verificado)* — una nueva ejecución de
  red;

  Las explicaciones de los roles >  son *(según la documentación)*: la fuente Gateway API anterior.

  >

  > **Predicción:** los nombres se resuelven, Service existe y EndpointSlice contiene solo `ready: false`.

  >

  > > [!question]- Respuesta

  > > DNS funciona, pero un Service normal no tiene backends ready. Verifique readiness y la aplicación.

  > > Reparar DNS o ampliar NetworkPolicy no hará que el módulo sea ready.

  > > *(según la documentación)*: la fuente EndpointSlice anterior.

  >

  > **Respuesta corta en inglés:**

  >

  > > A Service selecciona Pods y expone una dirección estable. EndpointSlices contiene backend addresses
  y readiness.

  La resolución > > DNS no prueba que exista un ready backend. Verifico la selección, readiness, el puerto
  de destino y policies.'
