heading: '10. Сеть: от имени Service к готовому адресу пода'
text: '## 10. Сеть: от имени Service к готовому адресу пода


  **Коротко**

  - Service задаёт стабильную точку обращения.

  - Selector выбирает Pod по меткам.

  - EndpointSlice описывает фактических получателей.


  **Мини-пример:** только в одноразовом kind из подготовки выше. Создай namespace командой `kubectl --kubeconfig /tmp/guides-order-rest.kubeconfig --context kind-guides-order-rest create namespace guide-mini-29`. Сохрани листинг как `mini.sh`; запуск — `bash -e mini.sh`.


  ```bash

  k() { kubectl --kubeconfig /tmp/guides-order-rest.kubeconfig --context kind-guides-order-rest -n guide-mini-29 "$@"; }

  k create deployment web --image=nginx:1.29-alpine

  k rollout status deployment/web --timeout=90s

  k expose deployment web --port=80

  k get service web -o jsonpath=''{.spec.selector.app}{"\n"}''

  ```


  **Предскажи:** Что покажет последняя команда после выполнения предыдущих?


  > [!question]- Ответ

  > Фактический stdout команд:

  >

  > ```text

  > deployment.apps/web created

  > Waiting for deployment "web" rollout to finish: 0 of 1 updated replicas are available...

  > deployment "web" successfully rolled out

  > service/web exposed

  > web

  > ```

  >

  > Код завершения: 0.


  Service получил selector app=web. Это показывает связь выбора; прохождение HTTP отдельно здесь не проверяется.


  Pod получает адрес через сетевую реализацию; Service задаёт устойчивую точку обращения к выбранным подам.

  ClusterIP — внутренний виртуальный адрес, NodePort — порт на узлах, LoadBalancer — запрос внешнего балансировщика.

  kube-proxy настраивает перенаправление в ядре; реализация eBPF может заменить этот механизм.

  Полная механика адресов и пакетов — [[Networking-Visual-Guide#19. Kubernetes: адрес пода, виртуальный Service и реальные получатели]].

  *(по документации)* — [Service](https://kubernetes.io/docs/concepts/services-networking/service/).


  ### Почему объект Service существует, а приложения за ним нет


  **Коротко**

  - Объект Service может существовать без подходящих Pod.

  - Selector должен совпасть с метками.

  - Наличие адреса Service не доказывает наличие приложения.


  **Мини-пример:** только в одноразовом kind из подготовки выше. Создай namespace командой `kubectl --kubeconfig /tmp/guides-order-rest.kubeconfig --context kind-guides-order-rest create namespace guide-mini-30`. Сохрани листинг как `mini.sh`; запуск — `bash -e mini.sh`.


  ```bash

  k() { kubectl --kubeconfig /tmp/guides-order-rest.kubeconfig --context kind-guides-order-rest -n guide-mini-30 "$@"; }

  k create service clusterip lonely --tcp=80:80

  k get service lonely -o jsonpath=''{.spec.selector.app}{"\n"}''

  k get pods -l app=lonely --no-headers

  k get pods -l app=lonely -o jsonpath=''{.items}{"\n"}''

  ```


  **Предскажи:** Что покажет последняя команда после выполнения предыдущих?


  > [!question]- Ответ

  > Фактический stdout команд:

  >

  > ```text

  > service/lonely created

  > lonely

  > []

  > ```

  >

  > Код завершения: 0.


  Selector ищет app=lonely, но ни один Pod в namespace не создан. Последняя команда возвращает пустой список.


  Готовый EndpointSlice не доказывает, что приложение слушает `targetPort` или что политика разрешает путь.

  При `publishNotReadyAddresses: true` семантика публикации готовности меняется; это специальная настройка,

  а не способ починить неверную readiness. *(по документации)* —

  [EndpointSlice](https://kubernetes.io/docs/concepts/services-networking/endpoint-slices/).


  **`service.yaml` в `/tmp/vg-k8s-work` — полный намеренно неверный селектор:**


  1. Service задаёт селектор и пару `port`/`targetPort`: первый — порт Service, второй — порт получателя.

  2. Контроллер EndpointSlice выбирает поды по селектору **в пространстве имён Service**.

  3. В API записываются адреса и их условия готовности.

  4. Сетевой компонент наблюдает Service/EndpointSlice и обновляет путь до подходящих адресов.

  5. Клиент подключается к Service; соединение перенаправляется одному из получателей.


  > [!info]- Глубже

  > ```yaml

  > apiVersion: v1

  > kind: Service

  > metadata:

  >   name: web

  >   namespace: vg-k8s

  > spec:

  >   type: ClusterIP

  >   selector:

  >     app: typo

  >   ports:

  >     - port: 80

  >       targetPort: 80

  > ```

  >

  > **Команда в любом каталоге — адреса и готовность отдельно от Service:**

  >

  > ```bash

  > kubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s \

  >   -n vg-k8s get endpointslices -l kubernetes.io/service-name=web -o json \

  >   | jq ''[.items[].endpoints[]? | {ip: .addresses[0], ready: .conditions.ready}]''

  > ```

  >

  > **Вывод нового запуска — пример для чтения:**

  >

  > ```text

  > []

  > ```

  >

  > После совпадения селектора `app: web` появились адреса. Неготовая реплика из поломанного развёртывания

  > имеет `ready: false`, старые готовые — `true`. *(проверено)*.

  >

  > **`service.yaml` в `/tmp/vg-k8s-work` — полный исправленный файл:**

  >

  > ```yaml

  > apiVersion: v1

  > kind: Service

  > metadata:

  >   name: web

  >   namespace: vg-k8s

  > spec:

  >   type: ClusterIP

  >   selector:

  >     app: web

  >   ports:

  >     - port: 80

  >       targetPort: 80

  > ```

  >

  > **Вывод старого клиента — пример для чтения, записанный прогон на 1.33.0/Cilium:**

  >

  > ```text

  > wget: can''t connect to remote host (10.106.189.46): Operation not permitted

  > ```

  >

  > Это **записанный прогон** из [[Kubernetes-Coding-Drills-Solutions#2 — Сервис не отвечает]].

  > Он не является универсальной ошибкой Service без получателей: Cilium с заменой kube-proxy мог

  > отказать на сокете. Точный текст клиента на новом kind в этом опыте не проверялся. *(не проверено)*.


  ### DNS и количество точек


  **Коротко**

  - DNS сначала разрешает имя.

  - Короткое имя дополняется правилами поиска.

  - Успешный DNS не доказывает доступность порта.


  **Короткий сценарий**


  Имя web разрешилось в ClusterIP. HTTP-запрос затем получил timeout.


  **Предскажи:** Доказана ли ошибка DNS?


  > [!question]- Ответ

  > Разбор заданных условий: Нет: DNS уже дал адрес. Дальше проверяются получатели, порт, маршрут и политика.


  DNS обычного Service возвращает его ClusterIP; headless Service возвращает адреса выбранных подов.

  Короткое имя `web` ищется с суффиксами пространства имён/кластера.

  `ndots:5` в типичном `resolv.conf` означает: имя с менее чем пятью точками сначала рассматривается

  с поисковыми суффиксами. Это может добавлять запросы даже для внешнего имени.

  Полное имя с завершающей точкой, например `web.vg-k8s.svc.cluster.local.`, задаёт абсолютное имя;

  конкретный домен кластера настраивается. *(по документации)* —

  [DNS](https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/).


  ### Политики, входящий HTTP и разделение владельцев


  **Коротко**

  - Политика ограничивает соединения выбранных Pod.

  - HTTP-маршрут отдельно выбирает backend.

  - Готовые получатели нужны независимо от существования правил.


  **Короткий сценарий**


  HTTPRoute указывает на Service, у которого нет готовых endpoint.


  **Предскажи:** Создаёт ли само правило HTTPRoute готовые Pod?


  > [!question]- Ответ

  > Разбор заданных условий: Нет. Оно описывает маршрут; готовность и число получателей обеспечиваются другими механизмами.


  NetworkPolicy — разрешения входящих/исходящих соединений выбранных подов; политики складываются,

  а для изолированных обеих сторон нужны разрешения обеих сторон. Объект действует только при поддержке CNI.

  Ingress задаёт HTTP-маршрутизацию через отдельный контроллер; Gateway API делит инфраструктуру

  GatewayClass/Gateway и маршруты HTTPRoute. HTTPRoute показывает привязку в `status.parents`.

  Подробные полные примеры — [[Networking-Visual-Guide#20. Политики, Ingress, Gateway API и service mesh]].

  *(по документации)* — [NetworkPolicy](https://kubernetes.io/docs/concepts/services-networking/network-policies/),

  [Ingress](https://kubernetes.io/docs/concepts/services-networking/ingress/),

  [Gateway API](https://gateway-api.sigs.k8s.io/concepts/api-overview/).


  > [!info]- Глубже

  > В задаче 26 весам 90/10 соответствует вероятностное распределение, не обязательные 90 запросов из 100.

  > Маршрут по заголовку и ссылка в чужое пространство имён требуют разрешённой привязки и при необходимости

  > ReferenceGrant. Отсутствие реализации Gateway/его CRD не исправляется созданием только HTTPRoute.

  > Здесь Gateway API, mesh и NetworkPolicy не устанавливались. *(не проверено)* — новый сетевой прогон;

  > объяснение ролей — *(по документации)* — источник Gateway API выше.

  >

  > **Предскажи:** имена разрешаются, Service существует, EndpointSlice содержит только `ready: false`.

  >

  > > [!question]- Ответ

  > > DNS исправен, но обычный Service не имеет готовых получателей. Проверять readiness и приложение.

  > > Исправление DNS или расширение NetworkPolicy не сделает под готовым.

  > > *(по документации)* — источник EndpointSlice выше.

  >

  > **Короткий ответ на английском:**

  >

  > > A Service selects Pods and exposes a stable address. EndpointSlices hold the backend addresses and readiness.

  > > DNS resolution does not prove that a ready backend exists. I check selection, readiness, the target port and policies.'
