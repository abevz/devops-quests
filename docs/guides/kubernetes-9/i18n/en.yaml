heading: '9. Resources: scheduler promises, kernel limits and node eviction'
text: "## 9. Resources: scheduler promises, kernel limits and node eviction\n\n**At a glance**\n- Requests are considered during scheduling\n- Limits restrict resource usage\n- Low current utilization does not cancel resources already promised.\n\n**Short scenario**\n\nThe node has allocatable CPU=2, and total requests=2. A new Pod requests 1 CPU.\n\n**Predict:** Is observing top=10% enough to schedule it?\n\n> [!question]- Answer\n> Analysis of the given conditions: No. Requests leave no available CPU; actual current usage does not replace the scheduler's calculation.\n\n### CPU and memory fail differently\n\n**At a glance**\n- A CPU limit usually restricts execution time\n- A memory limit can stop the process\n- The number 137 alone does not establish the cause of termination.\n\n**Short scenario**\n\nThe process wants 1 CPU, but its limit=100m. Memory is sufficient.\n\n**Predict:** Must kubelet kill it solely because of the CPU limit?\n\n> [!question]- Answer\n> Analysis of the given conditions: No. The expected CPU mechanism is throttling, not OOM. Memory requires separate diagnosis.\n\n**`burner.yaml` in `/tmp/vg-k8s-work`: load and explicit limits:**\n\n```yaml\napiVersion: v1\nkind: Pod\nmetadata:\n  name: burner\n  namespace: vg-k8s\nspec:\n  containers:\n    - name: app\n      image: busybox:1.37\n      command: [\"sh\", \"-c\", \"while :; do :; done\"]\n      resources:\n        requests:\n          cpu: 50m\n          memory: 16Mi\n        limits:\n          cpu: 100m\n          memory: 32Mi\n```\n\n`requests` participate in placement; `limits` constrain consumption.\nCPU is limited through execution time: the process waits and latency increases, but exceeding its CPU limit\nis not itself an OOMKill cause. Memory cannot be “slowed down” in the same way: when allocation fails,\nthe kernel may terminate the process. Exit code 137 conventionally means SIGKILL through `128 + 9`,\nbut that code alone does not prove OOM: inspect `reason: OOMKilled` and node conditions.\n*(according to documentation)* — [CPU](https://kubernetes.io/docs/tasks/configure-pod-container/assign-cpu-resource/),\n[memory](https://kubernetes.io/docs/tasks/configure-pod-container/assign-memory-resource/).\n\n> [!info]- Deeper explanation\n> **Command from any directory: inspect the cgroup v2 mechanism:**\n>\n> ```bash\n> kubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s \\\n>   -n vg-k8s exec burner -- sh -c \\\n>   'cat /sys/fs/cgroup/cpu.max; cat /sys/fs/cgroup/cpu.stat'\n> ```\n>\n> **Output from a fresh run: counters depend on timing:**\n>\n> ```text\n> 10000 100000\n> ```\n>\n> `cpu.max` shows a 10000-microsecond quota per 100000-microsecond period: 0.1 core.\n> `nr_throttled` in `cpu.stat` is nonzero; the container keeps running. *(verified)*.\n> OS details and system OOM: [[Linux-Troubleshooting-Visual-Guide#5. OOM: лимит контейнера и нехватка памяти узла|container limits and node memory shortage]].\n> A CPU limit may protect neighbors while increasing latency; the decision requires workload measurement rather than\n> an “always remove it” rule. Without a memory limit, node-wide pressure remains a risk — an engineering inference from the limit boundary.\n\n### QoS: quality of service class\n\n**At a glance**\n- QoS depends on declared resources\n- Matching requests and limits produce a particular class when all conditions are met\n- The class name does not guarantee freedom from failures.\n\n**Mini-example:** only in the disposable kind cluster prepared above. Create the namespace with `kubectl --kubeconfig /tmp/guides-order-rest.kubeconfig --context kind-guides-order-rest create namespace guide-mini-26`. Save the listing as `mini.sh`; run it with `bash -e mini.sh`.\n\n```bash\nk() { kubectl --kubeconfig /tmp/guides-order-rest.kubeconfig --context kind-guides-order-rest -n guide-mini-26 \"$@\"; }\nk run web --image=nginx:1.29-alpine --image-pull-policy=Never\nk wait --for=condition=Ready pod/web --timeout=90s\nk get pod web -o jsonpath='{.spec.containers[0].resources}{\"\\n\"}'\nk get pod web -o jsonpath='{.status.qosClass}{\"\\n\"}'\n```\n\n**Predict:** What will the last command show after the preceding commands finish?\n\n> [!question]- Answer\n> Actual command stdout:\n>\n> ```text\n> pod/web created\n> pod/web condition met\n> {}\n> BestEffort\n> ```\n>\n> Exit code: 0.\n\nThe new namespace has no LimitRange, and the container declares no resources. This particular Pod receives BestEffort.\n\n| Class | Ordinary container resource configuration | Meaning |\n|---|---|---|\n| `Guaranteed` | Every container has CPU and memory requests equal to nonzero limits | The strictest resource contract |\n| `Burstable` | Requests/limits exist, but Guaranteed conditions are not met | Usage can exceed requests |\n| `BestEffort` | No CPU/memory requests or limits | No declared resource contract |\n\n> [!info]- Deeper explanation\n> The table concerns ordinary container resources; new Pod-level resources require checking their own rules\n> rather than mechanically applying this table. *(according to documentation)* —\n> [QoS](https://kubernetes.io/docs/concepts/workloads/pods/pod-qos/).\n>\n> If only a limit is set and admission provides no other request, the API defaults the request to that limit.\n> In the lab, Pod `defaults` with only CPU `200m` and memory `64Mi` limits received identical requests\n> and `Guaranteed`. *(verified)*.\n> This does not mean a LimitRange or another admission mechanism can never supply a different request.\n> *(according to documentation)* — [LimitRange](https://kubernetes.io/docs/concepts/policy/limit-range/).\n\n### Node pressure and eviction\n\n**At a glance**\n- Node resource pressure can trigger eviction\n- Evicted differs from a normal container restart\n- Read the reason and determine the failure scope.\n\n**Short scenario**\n\nThe Pod's phase is Failed, its reason is Evicted, and the message reports insufficient ephemeral-storage.\n\n**Predict:** Should you start by raising the CPU limit?\n\n> [!question]- Answer\n> Analysis of the given conditions: No. The first evidence points to node-local storage, not CPU.\n\nWhen memory, disk or PID availability is low, kubelet compares signals with configured thresholds and may\nevict a Pod. This differs from restarting a container after its own OOM.\nFor memory, exceeding requests, priority and the extent of excess matter; QoS class alone\ncannot predict the exact order. Pressure eviction does not have to respect PDB.\nThresholds depend on kubelet configuration; no standard numbers are asserted here.\n*(according to documentation)* — [node-pressure eviction](https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/).\n\n> [!info]- Deeper explanation\n> Typical signs: a `Failed` Pod with reason `Evicted` and a message about insufficient `ephemeral-storage`/memory;\n> a Node with `MemoryPressure`, `DiskPressure` or `PIDPressure`. These are distinct conditions, not every kind of `NotReady`.\n> Pressure eviction was deliberately not induced in this session. *(not verified)*.\n>\n> ResourceQuota limits total namespace resources; LimitRange sets individual allowed\n> values/defaults. Quota failure happens before scheduling:\n> a ReplicaSet may report `FailedCreate ... exceeded quota` without any Pending pod being created.\n> *(according to documentation)* — [ResourceQuota](https://kubernetes.io/docs/concepts/policy/resource-quotas/).\n\n### Resizing resources without replacing the pod\n\n**At a glance**\n- Resource changes may use a separate API path\n- A requested value is not necessarily already applied\n- Observe status and actual limits.\n\n**Short scenario**\n\nThe new CPU request was accepted, but resize reports Infeasible due to node capacity.\n\n**Predict:** Can you declare the new limit active?\n\n> [!question]- Answer\n> Analysis of the given conditions: No. Request acceptance and actual application differ; check resize status.\n\n**`resize.yaml` in `/tmp/vg-k8s-work`: the complete initial Pod:**\n\n```yaml\napiVersion: v1\nkind: Pod\nmetadata:\n  name: resize\n  namespace: vg-k8s\nspec:\n  containers:\n    - name: app\n      image: busybox:1.37\n      command: [\"sleep\", \"3600\"]\n      resizePolicy:\n        - resourceName: cpu\n          restartPolicy: NotRequired\n        - resourceName: memory\n          restartPolicy: RestartContainer\n      resources:\n        requests:\n          cpu: 50m\n          memory: 32Mi\n        limits:\n          cpu: 100m\n          memory: 64Mi\n```\n\n**`resize-patch.json` in `/tmp/vg-k8s-work`: a complete resize request, not a replacement YAML:**\n\n```json\n{\n  \"spec\": {\n    \"containers\": [\n      {\n        \"name\": \"app\",\n        \"resources\": {\n          \"requests\": {\"cpu\": \"100m\"},\n          \"limits\": {\"cpu\": \"300m\"}\n        }\n      }\n    ]\n  }\n}\n```\n\n**Command from any directory: submit to the separate subresource:**\n\n```bash\nkubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s \\\n  -n vg-k8s patch pod resize --subresource=resize \\\n  --patch-file /tmp/vg-k8s-work/resize-patch.json\nkubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s \\\n  -n vg-k8s exec resize -- cat /sys/fs/cgroup/cpu.max\n```\n\n`in-place resize` became stable in 1.35; the older note described beta in 1.33.\nThe `resize` subresource API accepts desired values; kubelet attempts to apply them on the assigned node.\n`resizePolicy` specifies whether the container must restart. `spec` expresses intent;\n`status.containerStatuses[].resources` reports the resources actually applied.\n*(according to documentation)* — [resource resizing](https://kubernetes.io/docs/tasks/configure-pod-container/resize-container-resources/).\n\n> [!info]- Deeper explanation\n> **Output from a fresh run: an example to read:**\n>\n> ```text\n> 30000 100000\n> ```\n>\n> The CPU limit became 300m; the restart count stayed 0. *(verified)*.\n> Insufficient node capacity can leave the request pending (`PodResizePending`, `Deferred`/`Infeasible`) while the process\n> uses its previously applied allocation. *(according to documentation)* — the resize source above.\n>\n> **Recorded solution output for exercise 9: an example from a 1.33.0 run:**\n>\n> ```text\n> reason: Infeasible\n> message: Node didn't have enough capacity: cpu, requested: 16000, capacity: 2000\n> ```\n>\n> This is a **recorded run** from [[Kubernetes-Coding-Drills-Solutions#9 — In-place resize]].\n> In the new session, resource shortage during resize and restart on a memory change were *(not verified)*.\n>\n> **Predict:** CPU request 50m, limit 100m; the process wants a full core. Will it become OOMKilled?\n>\n> > [!question]- Answer\n> > Not because of the CPU limit. The lab showed a 0.1-core quota and throttling; the process stayed alive.\n> > OOM is a separate memory failure path. *(verified)* — the CPU experiment above.\n>\n> **Short answer in English:**\n>\n> > Requests guide scheduling, and limits constrain runtime use. A CPU limit can throttle the process.\n> > A memory limit can lead to OOM termination. Node pressure eviction is a different action by the kubelet."
