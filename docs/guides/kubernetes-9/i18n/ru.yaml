heading: '9. Ресурсы: обещание планировщику, ограничение ядру и выселение узлом'
text: "## 9. Ресурсы: обещание планировщику, ограничение ядру и выселение узлом\n\n**Коротко**\n- Request учитывается при размещении.\n- Limit ограничивает использование ресурса.\n- Низкая текущая загрузка не отменяет уже выданных обещаний.\n\n**Короткий сценарий**\n\nНа узле allocatable CPU=2, сумма requests=2. Новый Pod просит 1 CPU.\n\n**Предскажи:** Достаточно ли наблюдения top=10% для размещения?\n\n> [!question]- Ответ\n> Разбор заданных условий: Нет. По requests свободного CPU нет; фактическая текущая загрузка не заменяет расчёт планировщика.\n\n### CPU и память ломаются по-разному\n\n**Коротко**\n- CPU limit обычно ограничивает время выполнения.\n- Memory limit может привести к остановке процесса.\n- Причину остановки нельзя вывести только из числа 137.\n\n**Короткий сценарий**\n\nПроцесс хочет 1 CPU, но limit=100m. Памяти достаточно.\n\n**Предскажи:** Обязан ли kubelet убить его только из-за CPU limit?\n\n> [!question]- Ответ\n> Разбор заданных условий: Нет. Ожидаемый механизм CPU — ограничение времени, а не OOM. Для памяти нужна отдельная диагностика.\n\n**`burner.yaml` в `/tmp/vg-k8s-work` — нагрузка и явные ограничения:**\n\n```yaml\napiVersion: v1\nkind: Pod\nmetadata:\n  name: burner\n  namespace: vg-k8s\nspec:\n  containers:\n    - name: app\n      image: busybox:1.37\n      command: [\"sh\", \"-c\", \"while :; do :; done\"]\n      resources:\n        requests:\n          cpu: 50m\n          memory: 16Mi\n        limits:\n          cpu: 100m\n          memory: 32Mi\n```\n\n`requests` участвуют в размещении; `limits` ограничивают использование.\nCPU ограничивается временем исполнения: процесс ждёт, задержка растёт, но само превышение CPU limit\nне является причиной OOMKill. Память нельзя «замедлить» тем же способом: при невозможности выделения\nпамяти ядро может завершить процесс. Код 137 означает SIGKILL по распространённому соглашению `128 + 9`,\nно один код не доказывает OOM: смотреть `reason: OOMKilled` и условия узла.\n*(по документации)* — [CPU](https://kubernetes.io/docs/tasks/configure-pod-container/assign-cpu-resource/),\n[память](https://kubernetes.io/docs/tasks/configure-pod-container/assign-memory-resource/).\n\n> [!info]- Глубже\n> **Команда в любом каталоге — посмотреть механизм cgroup v2:**\n>\n> ```bash\n> kubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s \\\n>   -n vg-k8s exec burner -- sh -c \\\n>   'cat /sys/fs/cgroup/cpu.max; cat /sys/fs/cgroup/cpu.stat'\n> ```\n>\n> **Вывод нового запуска — пример для чтения, счётчики зависят от времени:**\n>\n> ```text\n> 10000 100000\n> ```\n>\n> `cpu.max` показывает квоту 10000 микросекунд на период 100000: 0,1 ядра.\n> `nr_throttled` в `cpu.stat` ненулевой; контейнер продолжает работать. *(проверено)*.\n> Подробности ОС и системного OOM — [[Linux-Troubleshooting-Visual-Guide#5. OOM: лимит контейнера и нехватка памяти узла]].\n> CPU limit может защищать соседей, но ухудшать задержку; решение требует измерения нагрузки, а не правила\n> «всегда убрать». Без memory limit остаётся риск давления на весь узел — инженерный вывод из границы ограничения.\n\n### QoS: класс качества обслуживания\n\n**Коротко**\n- QoS зависит от объявленных ресурсов.\n- Одинаковые requests и limits дают определённый класс при выполнении всех условий.\n- Название класса не гарантирует отсутствие отказов.\n\n**Мини-пример:** только в одноразовом kind из подготовки выше. Создай namespace командой `kubectl --kubeconfig /tmp/guides-order-rest.kubeconfig --context kind-guides-order-rest create namespace guide-mini-26`. Сохрани листинг как `mini.sh`; запуск — `bash -e mini.sh`.\n\n```bash\nk() { kubectl --kubeconfig /tmp/guides-order-rest.kubeconfig --context kind-guides-order-rest -n guide-mini-26 \"$@\"; }\nk run web --image=nginx:1.29-alpine --image-pull-policy=Never\nk wait --for=condition=Ready pod/web --timeout=90s\nk get pod web -o jsonpath='{.spec.containers[0].resources}{\"\\n\"}'\nk get pod web -o jsonpath='{.status.qosClass}{\"\\n\"}'\n```\n\n**Предскажи:** Что покажет последняя команда после выполнения предыдущих?\n\n> [!question]- Ответ\n> Фактический stdout команд:\n>\n> ```text\n> pod/web created\n> pod/web condition met\n> {}\n> BestEffort\n> ```\n>\n> Код завершения: 0.\n\nВ новом namespace нет LimitRange, ресурсы контейнера не заданы. Этот конкретный Pod получает BestEffort.\n\n| Класс | Обычная конфигурация контейнерных ресурсов | Что это означает |\n|---|---|---|\n| `Guaranteed` | У каждого контейнера CPU и память: request равен ненулевому limit | Наиболее строгий ресурсный контракт |\n| `Burstable` | Есть запрос/ограничение, но условия Guaranteed не выполнены | Возможен выход выше запросов |\n| `BestEffort` | Нет запросов и ограничений CPU/памяти | Нет заявленного ресурсного контракта |\n\n> [!info]- Глубже\n> Таблица относится к обычным ресурсам контейнеров; новые ресурсы уровня Pod требуют сверки их правил,\n> а не механического переноса этой таблицы. *(по документации)* —\n> [QoS](https://kubernetes.io/docs/concepts/workloads/pods/pod-qos/).\n>\n> Если задан только limit и не было иного значения request при допуске, API подставляет request равный limit.\n> На стенде Pod `defaults` с CPU `200m`, памятью `64Mi` только в limits получил оба таких же requests\n> и `Guaranteed`. *(проверено)*.\n> Это не значит, что LimitRange или иной допуск никогда не задаст другой request.\n> *(по документации)* — [LimitRange](https://kubernetes.io/docs/concepts/policy/limit-range/).\n\n### Давление узла и выселение\n\n**Коротко**\n- Давление ресурсов узла может вызвать выселение.\n- Evicted отличается от обычного перезапуска контейнера.\n- Нужно читать причину и область отказа.\n\n**Короткий сценарий**\n\nУ Pod фаза Failed, reason=Evicted и сообщение о нехватке ephemeral-storage.\n\n**Предскажи:** Начинать ли с увеличения CPU limit?\n\n> [!question]- Ответ\n> Разбор заданных условий: Нет. Первое свидетельство указывает на локальное хранилище узла, а не CPU.\n\nПри недостатке памяти, диска или PID kubelet сравнивает сигналы с настроенными порогами и может\nвыселить Pod. Это отличается от перезапуска контейнера после его собственного OOM.\nДля памяти существенны превышение запросов, приоритет и степень превышения; одного класса QoS\nнедостаточно, чтобы предсказать точный порядок. Выселение при давлении не обязано соблюдать PDB.\nПороговые значения зависят от настройки kubelet: здесь стандартные числа не приводятся.\n*(по документации)* — [node-pressure eviction](https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/).\n\n> [!info]- Глубже\n> Типичные признаки: Pod `Failed` с причиной `Evicted`, сообщение о недостатке `ephemeral-storage`/memory;\n> Node с `MemoryPressure`, `DiskPressure`, `PIDPressure`. Это отдельные условия, не все виды `NotReady`.\n> Выселение по давлению в этой сессии намеренно не создавалось. *(не проверено)*.\n>\n> ResourceQuota ограничивает суммарные ресурсы пространства имён, LimitRange — отдельные допустимые\n> значения/значения по умолчанию. Ошибка квоты возникает до планирования:\n> ReplicaSet может получить `FailedCreate ... exceeded quota`, а Pending-пода вообще не будет.\n> *(по документации)* — [ResourceQuota](https://kubernetes.io/docs/concepts/policy/resource-quotas/).\n\n### Изменение ресурсов без замены пода\n\n**Коротко**\n- Изменение ресурсов может иметь отдельный путь API.\n- Запрошенное значение не равно уже применённому.\n- Нужно наблюдать статус и реальные ограничения.\n\n**Короткий сценарий**\n\nЗапрос нового CPU принят, но resize сообщает Infeasible из-за ёмкости узла.\n\n**Предскажи:** Можно ли объявить новое ограничение действующим?\n\n> [!question]- Ответ\n> Разбор заданных условий: Нет. Принятие запроса и фактическое применение различаются; нужна проверка состояния resize.\n\n**`resize.yaml` в `/tmp/vg-k8s-work` — полный начальный Pod:**\n\n```yaml\napiVersion: v1\nkind: Pod\nmetadata:\n  name: resize\n  namespace: vg-k8s\nspec:\n  containers:\n    - name: app\n      image: busybox:1.37\n      command: [\"sleep\", \"3600\"]\n      resizePolicy:\n        - resourceName: cpu\n          restartPolicy: NotRequired\n        - resourceName: memory\n          restartPolicy: RestartContainer\n      resources:\n        requests:\n          cpu: 50m\n          memory: 32Mi\n        limits:\n          cpu: 100m\n          memory: 64Mi\n```\n\n**`resize-patch.json` в `/tmp/vg-k8s-work` — полный запрос изменения, не замена YAML:**\n\n```json\n{\n  \"spec\": {\n    \"containers\": [\n      {\n        \"name\": \"app\",\n        \"resources\": {\n          \"requests\": {\"cpu\": \"100m\"},\n          \"limits\": {\"cpu\": \"300m\"}\n        }\n      }\n    ]\n  }\n}\n```\n\n**Команда в любом каталоге — отправить запрос в отдельный подресурс:**\n\n```bash\nkubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s \\\n  -n vg-k8s patch pod resize --subresource=resize \\\n  --patch-file /tmp/vg-k8s-work/resize-patch.json\nkubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s \\\n  -n vg-k8s exec resize -- cat /sys/fs/cgroup/cpu.max\n```\n\nИзменение на месте, `in-place resize`, стало стабильным в 1.35; старый конспект описывал beta в 1.33.\nAPI подресурса `resize` принимает желаемые значения; kubelet пытается применить их на выбранном узле.\n`resizePolicy` задаёт, нужен ли перезапуск контейнера. `spec` выражает намерение,\n`status.containerStatuses[].resources` — фактически применённые ресурсы.\n*(по документации)* — [изменение ресурсов](https://kubernetes.io/docs/tasks/configure-pod-container/resize-container-resources/).\n\n> [!info]- Глубже\n> **Вывод нового запуска — пример для чтения:**\n>\n> ```text\n> 30000 100000\n> ```\n>\n> CPU limit стал 300m, число перезапусков осталось 0. *(проверено)*.\n> Нехватка узла может оставить запрос ожидающим (`PodResizePending`, `Deferred`/`Infeasible`), пока процесс\n> работает с прежним применённым значением. *(по документации)* — источник resize выше.\n>\n> **Вывод из решения задачи 9 — пример для чтения, записанный прогон на 1.33.0:**\n>\n> ```text\n> reason: Infeasible\n> message: Node didn't have enough capacity: cpu, requested: 16000, capacity: 2000\n> ```\n>\n> Это **записанный прогон** из [[Kubernetes-Coding-Drills-Solutions#9 — In-place resize]].\n> В новой сессии нехватка при resize и перезапуск при изменении памяти — *(не проверено)*.\n>\n> **Предскажи:** CPU request 50m, limit 100m; процесс хочет всё ядро. Будет ли OOMKilled?\n>\n> > [!question]- Ответ\n> > Из-за CPU limit — нет. На стенде появилась квота 0,1 ядра и троттлинг, процесс остался жив.\n> > OOM — отдельная ветка памяти. *(проверено)* — CPU-опыт выше.\n>\n> **Короткий ответ на английском:**\n>\n> > Requests guide scheduling, and limits constrain runtime use. A CPU limit can throttle the process.\n> > A memory limit can lead to OOM termination. Node pressure eviction is a different action by the kubelet."
