heading: Controllers and static Pods
text: '# Controllers and static Pods


  Use only the offline bay. A CustomResourceDefinition adds an API type; a custom resource stores desired state. A controller repeatedly observes that state and reconciles owned resources. In quest 116 the narrow training operator polls `station`, then manages the board Deployment, ConfigMap and Service. Inspect `station.json` and the live object, change only the desired route and wait for reconciliation. Compare `metadata.generation` with `status.observedGeneration`, inspect readiness and controller ownerReferences, then verify HTTP. A current status or owner reference cannot prove the history of edits.


  A static Pod is owned by the kubelet reading a node-local manifest, not by an API-created Pod. The API exposes a mirror Pod for observation. In quest 117, edit only the listener in the supplied `static-pod.json`; do not apply it with kubectl or access the host. The bounded adapter validates the full safe shape and, on a later poll, writes inside the disposable kind node. The real kubelet creates the Pod and mirror, and backend observation compares the CRI sandbox with the mirror. Wait for both adapter and kubelet, then inspect the observation and mirror UID, hash and readiness. A mirror annotation alone is not CRI proof.


  References: [operator pattern](https://kubernetes.io/docs/concepts/extend-kubernetes/operator/), [static Pods](https://kubernetes.io/docs/tasks/configure-pod-container/static-pod/).


  For quest 116, inspect the desired state and reconciled status:


  ```sh

  cd ~/quest

  cat station.json

  kubectl get stationboard station -o yaml

  kubectl get deployment board -o yaml

  ```


  For quest 117, inspect the staged manifest and adapter observation:


  ```sh

  cd ~/quest

  cat static-pod.json

  cat /run/dq/observations/static-pod.json

  kubectl get pod "static-board-$DQ_NODE_NAME" -o yaml

  ```

  '
