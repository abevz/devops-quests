heading: Controllers and static Pods
text: '# Controllers and static Pods


  Use only the offline bay. A CustomResourceDefinition adds an API type; a custom resource stores desired state. A controller repeatedly observes that state and reconciles owned resources. In quest 116 the narrow training operator polls `station`, then manages the board Deployment, ConfigMap and Service. Inspect `station.yaml` and the live object, change only the desired route and wait for reconciliation. Compare `metadata.generation` with `status.observedGeneration`, inspect readiness and controller ownerReferences, then verify HTTP. A current status or owner reference cannot prove the history of edits.


  A static Pod is owned by the kubelet reading a node-local manifest. The API exposes a mirror for observation, but an API-created Pod can occupy the same name without belonging to that file source. Inspect source annotations, owner references, the staged manifest and the Service before changing either authority. The bounded adapter accepts the supplied safe manifest shape with listener 8080 or 8099 and writes only inside the owned disposable kind node. Its receipt joins kubelet source, CRI sandbox, mirror UID and configuration hash. Wait for asynchronous reconciliation; a running Pod or mirror annotation alone is insufficient evidence.


  References: [operator pattern](https://kubernetes.io/docs/concepts/extend-kubernetes/operator/), [static Pods](https://kubernetes.io/docs/tasks/configure-pod-container/static-pod/).


  For quest 116, inspect the desired state and reconciled status:


  ```sh

  cd ~/quest

  cat station.yaml

  kubectl get stationboard station -o yaml

  kubectl get deployment board -o yaml

  ```


  For quest 117, inspect the staged manifest and adapter observation:


  ```sh

  cd ~/quest

  cat static-pod.yaml

  cat /run/dq/observations/static-pod.json

  kubectl get pod "static-board-$DQ_NODE_NAME" -o yaml

  ```

  '
