heading: Kontrolery i statyczne Pody
text: '# Kontrolery i statyczne Pody


  Używaj tylko zatoki offline. CustomResourceDefinition dodaje typ API, a zasób niestandardowy przechowuje stan oczekiwany. Kontroler stale obserwuje ten stan i uzgadnia zarządzane zasoby. W zadaniu 116 ograniczony operator treningowy odpytuje `station`, a następnie zarządza Deployment, ConfigMap i Service board. Sprawdź `station.json` i bieżący obiekt, zmień tylko oczekiwaną trasę i poczekaj na uzgodnienie. Porównaj `metadata.generation` z `status.observedGeneration`, sprawdź gotowość i controller ownerReference, a potem HTTP. Bieżący status lub ownerReference nie dowodzi historii zmian.


  Statyczny Pod należy do kubeletu odczytującego manifest na węźle, a nie do Poda utworzonego przez API. API udostępnia mirror Pod do obserwacji. W zadaniu 117 zmień tylko nasłuch w dostarczonym `static-pod.json`; nie stosuj go przez kubectl ani nie uzyskuj dostępu do hosta. Ograniczony adapter sprawdza całą bezpieczną strukturę i podczas kolejnego odpytania zapisuje ją w jednorazowym węźle kind. Prawdziwy kubelet tworzy Pod i mirror, a obserwacja backendu porównuje sandbox CRI z mirrorem. Poczekaj na adapter i kubelet, potem sprawdź obserwację, UID, hash i gotowość mirrora. Sama adnotacja mirrora nie jest dowodem CRI.


  Źródła: [wzorzec operatora](https://kubernetes.io/docs/concepts/extend-kubernetes/operator/), [statyczne Pody](https://kubernetes.io/docs/tasks/configure-pod-container/static-pod/).


  W zadaniu 116 sprawdź stan oczekiwany i uzgodniony status:


  ```sh

  cd ~/quest

  cat station.json

  kubectl get stationboard station -o yaml

  kubectl get deployment board -o yaml

  ```


  W zadaniu 117 sprawdź przygotowany manifest i obserwację adaptera:


  ```sh

  cd ~/quest

  cat static-pod.json

  cat /run/dq/observations/static-pod.json

  kubectl get pod "static-board-$DQ_NODE_NAME" -o yaml

  ```

  '
