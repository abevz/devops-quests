heading: Kontrolery i statyczne Pody
text: '# Kontrolery i statyczne Pody


  Używaj tylko zatoki offline. CustomResourceDefinition dodaje typ API, a zasób niestandardowy przechowuje stan oczekiwany. Kontroler stale obserwuje ten stan i uzgadnia zarządzane zasoby. W zadaniu 116 ograniczony operator treningowy odpytuje `station`, a następnie zarządza Deployment, ConfigMap i Service board. Sprawdź `station.yaml` i bieżący obiekt, zmień tylko oczekiwaną trasę i poczekaj na uzgodnienie. Porównaj `metadata.generation` z `status.observedGeneration`, sprawdź gotowość i controller ownerReference, a potem HTTP. Bieżący status lub ownerReference nie dowodzi historii zmian.


  Statyczny Pod należy do kubeleta czytającego lokalny manifest węzła. API pokazuje lustro do obserwacji, lecz Pod utworzony przez API może zajmować tę samą nazwę bez przynależności do źródła plikowego. Zbadaj adnotacje źródła, referencje właściciela, przygotowany manifest i Service przed zmianą którejkolwiek strony zarządzania. Ograniczony adapter akceptuje dostarczoną bezpieczną strukturę manifestu z listener 8080 lub 8099 i zapisuje wyłącznie we własnym jednorazowym węźle kind. Jego potwierdzenie łączy źródło kubeleta, sandbox CRI, UID lustra i hash konfiguracji. Poczekaj na asynchroniczne uzgodnienie; działający Pod lub sama adnotacja lustra nie wystarcza.


  Źródła: [wzorzec operatora](https://kubernetes.io/docs/concepts/extend-kubernetes/operator/), [statyczne Pody](https://kubernetes.io/docs/tasks/configure-pod-container/static-pod/).


  W zadaniu 116 sprawdź stan oczekiwany i uzgodniony status:


  ```sh

  cd ~/quest

  cat station.yaml

  kubectl get stationboard station -o yaml

  kubectl get deployment board -o yaml

  ```


  W zadaniu 117 sprawdź przygotowany manifest i obserwację adaptera:


  ```sh

  cd ~/quest

  cat static-pod.yaml

  cat /run/dq/observations/static-pod.json

  kubectl get pod "static-board-$DQ_NODE_NAME" -o yaml

  ```

  '
