heading: Controller und statische Pods
text: '# Controller und statische Pods


  Nutze nur die Offline-Umgebung. Eine CustomResourceDefinition ergänzt einen API-Typ; eine Custom Resource speichert den Sollzustand. Ein Controller beobachtet diesen Zustand wiederholt und gleicht eigene Ressourcen ab. In Quest 116 fragt der begrenzte Trainingsoperator `station` ab und verwaltet Board-Deployment, ConfigMap und Service. Prüfe `station.json` und das laufende Objekt, ändere nur die gewünschte Route und warte auf den Abgleich. Vergleiche `metadata.generation` mit `status.observedGeneration`, prüfe Bereitschaft und Controller-ownerReferences und danach HTTP. Aktueller Status oder ownerReference beweist keine Änderungshistorie.


  Ein statischer Pod gehört dem Kubelet, das ein lokales Node-Manifest liest, nicht einem über die API erzeugten Pod. Die API stellt einen Mirror-Pod zur Beobachtung bereit. Ändere in Quest 117 nur den Listener im bereitgestellten `static-pod.json`; wende es nicht mit kubectl an und greife nicht auf den Host zu. Der begrenzte Adapter prüft die vollständige sichere Form und schreibt sie bei einer späteren Abfrage in den vergänglichen kind-Node. Der echte Kubelet erzeugt Pod und Mirror; eine Backend-Beobachtung vergleicht die CRI-Sandbox mit dem Mirror. Warte auf Adapter und Kubelet und prüfe Beobachtung, UID, Hash und Bereitschaft des Mirrors. Eine Mirror-Annotation allein beweist kein CRI.


  Quellen: [Operator-Muster](https://kubernetes.io/docs/concepts/extend-kubernetes/operator/), [statische Pods](https://kubernetes.io/docs/tasks/configure-pod-container/static-pod/).


  Prüfe in Quest 116 Sollzustand und abgeglichenen Status:


  ```sh

  cd ~/quest

  cat station.json

  kubectl get stationboard station -o yaml

  kubectl get deployment board -o yaml

  ```


  Prüfe in Quest 117 bereitgestelltes Manifest und Adapter-Beobachtung:


  ```sh

  cd ~/quest

  cat static-pod.json

  cat /run/dq/observations/static-pod.json

  kubectl get pod "static-board-$DQ_NODE_NAME" -o yaml

  ```

  '
