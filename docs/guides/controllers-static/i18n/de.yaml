heading: Controller und statische Pods
text: '# Controller und statische Pods


  Nutze nur die Offline-Umgebung. Eine CustomResourceDefinition ergänzt einen API-Typ; eine Custom Resource speichert den Sollzustand. Ein Controller beobachtet diesen Zustand wiederholt und gleicht eigene Ressourcen ab. In Quest 116 fragt der begrenzte Trainingsoperator `station` ab und verwaltet Board-Deployment, ConfigMap und Service. Prüfe `station.yaml` und das laufende Objekt, ändere nur die gewünschte Route und warte auf den Abgleich. Vergleiche `metadata.generation` mit `status.observedGeneration`, prüfe Bereitschaft und Controller-ownerReferences und danach HTTP. Aktueller Status oder ownerReference beweist keine Änderungshistorie.


  Ein statischer Pod gehört dem Kubelet, das ein lokales Node-Manifest liest. Die API zeigt einen Mirror zur Beobachtung, aber ein über die API erstellter Pod kann denselben Namen belegen, ohne zur Dateiquelle zu gehören. Untersuche Quellannotationen, Owner-Referenzen, das bereitgestellte Manifest und den Service, bevor du eine der Zuständigkeiten änderst. Der begrenzte Adapter akzeptiert die vorgegebene sichere Manifeststruktur mit Listener 8080 oder 8099 und schreibt nur im eigenen vergänglichen kind-Node. Sein Nachweis verknüpft Kubelet-Quelle, CRI-Sandbox, Mirror-UID und Konfigurationshash. Warte auf asynchronen Abgleich; ein laufender Pod oder eine Mirror-Annotation allein reicht nicht.


  Quellen: [Operator-Muster](https://kubernetes.io/docs/concepts/extend-kubernetes/operator/), [statische Pods](https://kubernetes.io/docs/tasks/configure-pod-container/static-pod/).


  Prüfe in Quest 116 Sollzustand und abgeglichenen Status:


  ```sh

  cd ~/quest

  cat station.yaml

  kubectl get stationboard station -o yaml

  kubectl get deployment board -o yaml

  ```


  Prüfe in Quest 117 bereitgestelltes Manifest und Adapter-Beobachtung:


  ```sh

  cd ~/quest

  cat static-pod.yaml

  cat /run/dq/observations/static-pod.json

  kubectl get pod "static-board-$DQ_NODE_NAME" -o yaml

  ```

  '
