heading: Controladores y Pods estáticos
text: '# Controladores y Pods estáticos


  Usa solo la bahía sin conexión. Una CustomResourceDefinition añade un tipo de API; un recurso personalizado guarda el estado deseado. Un controlador observa repetidamente ese estado y reconcilia recursos propios. En la misión 116 el operador de entrenamiento limitado consulta `station` y gestiona el Deployment, ConfigMap y Service board. Inspecciona `station.json` y el objeto activo, cambia solo la ruta deseada y espera la reconciliación. Compara `metadata.generation` con `status.observedGeneration`, inspecciona disponibilidad y ownerReferences de controlador y verifica HTTP. Un estado u ownerReference actual no demuestra el historial de edición.


  Un Pod estático pertenece al kubelet que lee un manifiesto local del nodo, no a un Pod creado por la API. La API expone un Pod espejo para observarlo. En la misión 117 edita solo el listener de `static-pod.json`; no lo apliques con kubectl ni accedas al host. El adaptador limitado valida toda la forma segura y, en una consulta posterior, escribe dentro del nodo kind desechable. El kubelet real crea el Pod y su espejo, y una observación backend compara el sandbox CRI con el espejo. Espera al adaptador y kubelet, luego inspecciona observación, UID, hash y disponibilidad del espejo. Una anotación espejo por sí sola no prueba CRI.


  Referencias: [patrón operador](https://kubernetes.io/docs/concepts/extend-kubernetes/operator/), [Pods estáticos](https://kubernetes.io/docs/tasks/configure-pod-container/static-pod/).


  En la misión 116 inspecciona el estado deseado y el estado reconciliado:


  ```sh

  cd ~/quest

  cat station.json

  kubectl get stationboard station -o yaml

  kubectl get deployment board -o yaml

  ```


  En la misión 117 inspecciona el manifiesto preparado y la observación del adaptador:


  ```sh

  cd ~/quest

  cat static-pod.json

  cat /run/dq/observations/static-pod.json

  kubectl get pod "static-board-$DQ_NODE_NAME" -o yaml

  ```

  '
