heading: Controladores y Pods estáticos
text: '# Controladores y Pods estáticos


  Usa solo la bahía sin conexión. Una CustomResourceDefinition añade un tipo de API; un recurso personalizado guarda el estado deseado. Un controlador observa repetidamente ese estado y reconcilia recursos propios. En la misión 116 el operador de entrenamiento limitado consulta `station` y gestiona el Deployment, ConfigMap y Service board. Inspecciona `station.yaml` y el objeto activo, cambia solo la ruta deseada y espera la reconciliación. Compara `metadata.generation` con `status.observedGeneration`, inspecciona disponibilidad y ownerReferences de controlador y verifica HTTP. Un estado u ownerReference actual no demuestra el historial de edición.


  Un Pod estático pertenece al kubelet que lee un manifiesto local del nodo. La API expone un espejo para observarlo, pero un Pod creado por API puede ocupar el mismo nombre sin pertenecer al origen de archivo. Inspecciona anotaciones de origen, referencias al propietario, el manifiesto preparado y el Service antes de cambiar cualquiera de las autoridades. El adaptador limitado acepta la estructura segura suministrada con listener 8080 o 8099 y escribe solo dentro del nodo kind desechable propio. Su recibo une origen kubelet, sandbox CRI, UID del espejo y hash de configuración. Espera la reconciliación asíncrona; un Pod activo o una anotación espejo no bastan.


  Referencias: [patrón operador](https://kubernetes.io/docs/concepts/extend-kubernetes/operator/), [Pods estáticos](https://kubernetes.io/docs/tasks/configure-pod-container/static-pod/).


  En la misión 116 inspecciona el estado deseado y el estado reconciliado:


  ```sh

  cd ~/quest

  cat station.yaml

  kubectl get stationboard station -o yaml

  kubectl get deployment board -o yaml

  ```


  En la misión 117 inspecciona el manifiesto preparado y la observación del adaptador:


  ```sh

  cd ~/quest

  cat static-pod.yaml

  cat /run/dq/observations/static-pod.json

  kubectl get pod "static-board-$DQ_NODE_NAME" -o yaml

  ```

  '
