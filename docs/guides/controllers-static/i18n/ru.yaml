heading: Контроллеры и статические Pod
text: '# Контроллеры и статические Pod


  Используйте только офлайн-песочницу. CustomResourceDefinition добавляет тип API, а пользовательский ресурс хранит желаемое состояние. Контроллер регулярно наблюдает его и согласует принадлежащие ему ресурсы. В задании 116 ограниченный учебный оператор опрашивает `station`, затем управляет Deployment, ConfigMap и Service board. Изучите `station.yaml` и действующий объект, измените только желаемый маршрут и дождитесь согласования. Сравните `metadata.generation` с `status.observedGeneration`, проверьте готовность и controller ownerReference, затем HTTP. Текущий статус или ownerReference не доказывает историю изменений.


  Статическим Pod управляет kubelet, читающий локальный манифест узла. API показывает зеркало для наблюдения, но Pod, созданный через API, может занять то же имя, не принадлежа файловому источнику. До изменения любого источника управления изучите аннотации источника, owner references, подготовленный манифест и Service. Ограниченный адаптер принимает выданную безопасную структуру манифеста с listener 8080 или 8099 и пишет только внутри принадлежащего установке одноразового узла kind. Его подтверждение связывает источник kubelet, sandbox CRI, UID зеркала и hash конфигурации. Дождитесь асинхронного согласования: работающего Pod или аннотации зеркала недостаточно.


  Источники: [шаблон оператора](https://kubernetes.io/docs/concepts/extend-kubernetes/operator/), [статические Pod](https://kubernetes.io/docs/tasks/configure-pod-container/static-pod/).


  В задании 116 проверьте желаемое состояние и согласованный статус:


  ```sh

  cd ~/quest

  cat station.yaml

  kubectl get stationboard station -o yaml

  kubectl get deployment board -o yaml

  ```


  В задании 117 изучите подготовленный манифест и наблюдение адаптера:


  ```sh

  cd ~/quest

  cat static-pod.yaml

  cat /run/dq/observations/static-pod.json

  kubectl get pod "static-board-$DQ_NODE_NAME" -o yaml

  ```

  '
