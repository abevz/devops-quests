heading: Private Registry und GitOps wiederherstellen
text: '# Private Registry und GitOps wiederherstellen


  ## Grenzen getrennt betrachten


  Registry-Verfügbarkeit, Transportvertrauen, Quellenidentität und Verbraucherübernahme sind getrennte Beobachtungen.
  Nur die kurzlebige Spielumgebung verwenden. Quellenverträge mit der aktiven API vergleichen; eingefrorene Einträge
  bewahren die ursprüngliche Autorität. Eine Steuerquittung beschreibt eine Agentenaktion, keine dauerhafte Verfügbarkeit,
  Berechtigung oder Datenübernahme.


  ## Private Image-Verbraucher {#private-image-consumers}


  Workstation-Client und Kubelet verwahren Zugangsdaten unabhängig. Ein erfolgreicher authentifizierter Abruf aktualisiert
  keinen Kubernetes-Pull-Secret im Namespace. Der Secret enthält Registry-Zugangsdaten, installiert aber keine CA
  in die Node-Laufzeit. Vorgesehenen Endpunkt, Zertifikatsvertrauen, unveränderliches Image, Controller-Identität
  und Zugangsdatenobjekt bewahren.


  Pod-Ereignisse unterscheiden Verbindungs-, Zertifikats-, Berechtigungs- und fehlende Manifestfehler. Always steuert
  Auflösung und Abruf; Image-Cache und Ready-Container belegen keine Gültigkeit gespeicherter Zugangsdaten für einen
  späteren Abruf. Secret privat mit freigegebener Autorität vergleichen; tatsächlichen Image-Digest und zugehörige
  Pod-Referenzen prüfen.


  Das allgemeine Beispiel aktualisiert einen bestehenden erlaubten Secret. Zuerst Objekt und bereitgestellte Autorität
  auswählen. Es gibt keine Zugangsdaten aus; Base64 ist Kodierung, keine Verschlüsselung. Der Workload muss weiterhin
  das vorgesehene Objekt referenzieren.


  ```bash

  set -euo pipefail

  set +x

  : "${DQ_PULL_SECRET:?select the existing authorized Secret}"

  : "${REGISTRY:?select the approved registry endpoint}"

  : "${REGISTRY_USER:?select the supplied registry identity}"

  : "${REGISTRY_PASSWORD:?load the private supplied credential}"

  export DQ_PULL_SECRET REGISTRY REGISTRY_USER REGISTRY_PASSWORD

  before=$(kubectl get secret "$DQ_PULL_SECRET" -o jsonpath=''{.metadata.uid}'')

  python3 -I - <<''PRIVATE_AUTH'' | kubectl apply -f - >/dev/null

  import base64,json,os

  auth=base64.b64encode((os.environ[''REGISTRY_USER'']+'':''+os.environ[''REGISTRY_PASSWORD'']).encode()).decode()

  config={''auths'':{os.environ[''REGISTRY'']:{''auth'':auth}}}

  secret={''apiVersion'':''v1'',''kind'':''Secret'',''metadata'':{''name'':os.environ[''DQ_PULL_SECRET'']},

  ''type'':''kubernetes.io/dockerconfigjson'',''data'':{''.dockerconfigjson'':base64.b64encode(json.dumps(config).encode()).decode()}}

  print(json.dumps(secret))

  PRIVATE_AUTH

  test "$(kubectl get secret "$DQ_PULL_SECRET" -o jsonpath=''{.metadata.uid}'')" = "$before"

  ```


  ## Aufbewahrung und veränderliche Referenzen


  Ein Tag verweist auf ein Manifest, dessen Digest genaue Bytes bezeichnet. Ein lokaler Docker-Tag aktualisiert
  eine entfernte Registry erst nach Push des Manifests. Tag-Bestand, Manifestantworten und freigegebenen Digest-Katalog
  vergleichen. Manifest-Medientypen beim Abruf und bei Docker-Content-Digest berücksichtigen.


  Aufbewahrung auf geschützte Manifestidentitäten stützen. Plan vor DELETE und Lesbarkeit geschützter Manifeste
  danach prüfen. Verbleibende Release-Tags müssen ebenfalls auf den vorgesehenen Inhalt zeigen: ein bewahrter Digest
  bewahrt nicht automatisch einen veränderlichen Alias. Manifest-Löschung und Einsammeln unreferenzierter Blobs
  sind getrennte Vorgänge. Keine Volume-Löschung, unsicheres TLS oder fremde Registry als Ersatz verwenden.


  ## Ereignisse und Abgleich


  Ein Repository-Webhook verbindet ein Quellenereignis mit einem privaten Empfänger. Empfänger, Ereignistyp, Repository,
  Branch und Signaturkonfiguration ohne Geheimnisausgabe vergleichen. Annahme eines signierten Ereignisses unterscheidet
  sich von periodischem Polling und erfolgreichem Quellenabgleich. Zustellergebnis und authentifizierte Empfängerbeobachtung
  zusammen verwenden.


  Eine Application bindet Repository, Pfad, Revision, Projekt und Ziel. Synced beschreibt Quellenvergleich, Healthy
  Ressourcengesundheit. Beide belegen keine Anwendungsantwort. Abgeglichene Revision, Soll-Daten, Kubernetes-Objekt
  und tatsächliche Antwort vergleichen, ohne eine korrekte Zugriffsgrenze zu ändern.


  ## Veröffentlichung und Übernahme


  Eine gemountete ConfigMap kann projizierte Dateien aktualisieren, während die Anwendung eine beim Start kopierte
  Fassung ausliefert. Unterstützte Aktualisierung oder Rollout kann zur Übernahme nötig sein. Ursprünglichen Controller
  und Pod-Programm bewahren; jeden aktiven zugehörigen Pod mit Quelle und Antwort vergleichen. Ein gesundes Ersatzobjekt
  bewahrt keine ursprüngliche Identität.


  Bei App-of-Apps gleicht ein Elternobjekt eine untergeordnete Application ab, diese den Workload. Quelle und Eigentümer
  je Ebene verfolgen. ApplicationSet-Generatoren übergeben Parameter an Vorlagen; erzeugte Objekte ebenso prüfen.
  Direkte Änderungen können vom Controller überschrieben werden. Repository-Autorität, Eigentümeridentitäten, Namespace
  und Publikation bei der Weitergabe bewahren.


  Ein verwaltetes Kind kann gültige Manifeste anwenden und eine veraltete Veröffentlichung auswählen. Vergleiche die eingebundene Quelle mit der HTTP-Antwort. Vergleiche bei einer Flotte Pfad und Zielreferenz jeder erzeugten Application mit dem aufgelösten Commit. Verschiedene Zweige können vorübergehend auf denselben Commit zeigen, daher belegt eine übereinstimmende Revision allein nicht die vorgesehene Quelle.


  Referenzen: [Registry-API](https://distribution.github.io/distribution/spec/api/), [private Images](https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/),
  [Argo-CD-Webhooks](https://argo-cd.readthedocs.io/en/stable/operator-manual/webhook/), [ConfigMap-Übernahme](https://kubernetes.io/docs/tutorials/configuration/updating-configuration-via-a-configmap/).

  '
