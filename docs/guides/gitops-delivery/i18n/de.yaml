  Das veröffentlichte manifests/board.yaml enthält möglicherweise noch das mutable retired Image, kein Always oder andere Pull-Verweise. Das benannte Container-Image muss exakt der eingefrorenen Veröffentlichung entsprechen; eine leere Template-Liste darf registry-pull vom aktuellen ServiceAccount erben. Fetch-, Parse- und API-Fehler ergeben ebenfalls git_image.  `git -C repository show origin/main:manifests/board.yaml; jq .image /run/dq/facts/0/private-release.json`.


  ### Aktuelles Template vergleichen {#private-git-live-template}


  Die korrigierte Git-Datei ist möglicherweise noch nicht im benannten Live-Container angekommen; vergleichen Sie exaktes eingefrorenes Image und Always. API-Fehler, fehlender Container oder fehlerhafte Struktur ergeben ebenfalls live_image.  `kubectl get deployment board -o json | jq .spec.template.spec.containers`.


  ### Bereites privates Image beobachten {#private-git-ready-private-image}


  Der Rollout wird möglicherweise durch Pull oder Readiness blockiert, oder ein aktueller zugehöriger Pod führt das exakte eingefrorene Image noch nicht mit Digest und ready/running Zustand aus. Das Template allein belegt dies nicht; API- oder Eingabefehler ergeben ebenfalls image_id.  `kubectl rollout status deployment/board --timeout=3s; kubectl get pods -o json | jq .items[].status.containerStatuses`.


  ### Authentifizierten Digest beobachten {#private-git-authenticated-digest}


  Das eingefrorene Image-Feld fehlt möglicherweise oder die Registry-Anfrage scheitert an Endpoint, credentials, CA oder Verfügbarkeit. Die Prüfung ruft den eingefrorenen Digest über authenticated TLS mit aktuellem platform.env und registry-ca.crt ab; Endpoint- oder Credential-Hashes werden nicht mit einer ursprünglichen Authority verglichen.  `jq .image /run/dq/facts/0/private-release.json; test -r registry-ca.crt`.


  ### Service-Antwort beobachten {#private-git-service-response}


  Der Prozess liefert möglicherweise eine alte Antwort oder das Service-Routing ist gestört; die tatsächliche Anfrage an Port 8080 muss nach dem Rollout north-80 liefern.  `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080`.


  ### initial: Beobachtungsstart {#private-git-initial-observer-startup}


  Die initial Beobachtung endet möglicherweise beim Lesen von platform.env oder Laden der Python helpers vor einem Detailergebnis; prüfen Sie Eingabe und dq_check. Benannte Image-, Policy-, Pull- oder API-Fehler behalten eigene Marker.  `test -r platform.env; bash -n platform.env; python3 -I -c "import dq_check"`.


  ### Git: Beobachtungsstart {#private-git-git-observer-startup}


  Die Git Beobachtung endet möglicherweise beim Lesen von platform.env oder Laden der Python helpers vor einem Detailergebnis; prüfen Sie Eingabe und dq_check. Benannte Image-, Policy-, Pull- oder API-Fehler behalten eigene Marker.  `test -r platform.env; bash -n platform.env; python3 -I -c "import dq_check"`.


  ### live: Beobachtungsstart {#private-git-live-observer-startup}


  Die live Beobachtung endet möglicherweise beim Lesen von platform.env oder Laden der Python helpers vor einem Detailergebnis; prüfen Sie Eingabe und dq_check. Benannte Image-, Policy-, Pull- oder API-Fehler behalten eigene Marker.  `test -r platform.env; bash -n platform.env; python3 -I -c "import dq_check"`.


  ### ready: Beobachtungsstart {#private-git-ready-observer-startup}


  Die ready Beobachtung endet möglicherweise beim Lesen von platform.env oder Laden der Python helpers vor einem Detailergebnis; prüfen Sie Eingabe und dq_check. Benannte Image-, Policy-, Pull- oder API-Fehler behalten eigene Marker.  `test -r platform.env; bash -n platform.env; python3 -I -c "import dq_check"`.

