heading: Private Registry und GitOps wiederherstellen
text: '# Private Registry und GitOps wiederherstellen


  Nutze nur die vergängliche Quest-Umgebung. Ein Kubelet zieht ein privates Image mit einem Secret im selben Namespace, das in `imagePullSecrets` benannt ist. Ein Digest identifiziert unveränderlichen Image-Inhalt; `imagePullPolicy: Always` bewirkt beim Start eine Pull-Prüfung. Lies `platform.env`, `private-release.json`, `board.json` und `registry-pull.json`, sofern bereitgestellt. Schütze die Spiel-Zugangsdaten: Gib sie nicht aus und speichere sie nicht in der Terminal-Historie. Prüfe Pod-Ereignisse und warte auf `kubectl rollout status deployment/board --timeout=90s`; ein aktuell erfolgreicher Rollout beweist keine künftigen Pulls.


  Eine Argo-CD-Application wählt Repository, Pfad, Revision und Ziel. Der Controller gleicht asynchron ab: `Synced` beschreibt den Vergleich mit Git, `Healthy` die Gesundheit der Ressourcen. Bei app-of-apps gleicht ein Parent eine Child-Application ab, die den Workload abgleicht. Vergleiche beide mit dem gepushten Commit und bewahre die Parent-Identität. `wait-apps.sh` in der Umgebung prüft die erwarteten Applications; versuche es nach dem Abgleich erneut, statt eine sofortige Änderung anzunehmen.


  Ein ApplicationSet-Listengenerator liefert Parameter für eine Go-Vorlage; ein Pfad wie `stations/{{.station}}` erzeugt einen Pfad pro Eintrag. In der ApplicationSet-Quest sendet die Spielabfrage eines von zwei begrenzten Manifesten aus `applicationset.json` an den privaten Controller. Dies ist ein Adapter mit begrenzten erlaubten Änderungen, keine allgemeine Controller-API. Warte auf erzeugte Applications und prüfe Eigentümer, Revision, Zustand und tatsächliche Workload-Antworten.


  Quellen: [private Image-Pulls](https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/), [Argo-CD-Listengenerator](https://argo-cd.readthedocs.io/en/stable/operator-manual/applicationset/Generators-List/), [Go-Vorlagen](https://argo-cd.readthedocs.io/en/stable/operator-manual/applicationset/GoTemplate/).

  '
