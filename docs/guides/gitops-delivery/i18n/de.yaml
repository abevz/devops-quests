heading: Private Registry und GitOps wiederherstellen
text: '# Private Registry und GitOps wiederherstellen


  Nutze nur die vergängliche Quest-Umgebung. Ein Kubelet zieht ein privates Image mit einem Secret im selben Namespace, das in `imagePullSecrets` benannt ist. Ein Digest identifiziert unveränderlichen Image-Inhalt; `imagePullPolicy: Always` bewirkt beim Start eine Pull-Prüfung. Lies `platform.env`, `private-release.json`, `board.json` und `registry-pull.json`, sofern bereitgestellt. Schütze die Spiel-Zugangsdaten: Gib sie nicht aus und speichere sie nicht in der Terminal-Historie. Prüfe Pod-Ereignisse und warte auf `kubectl rollout status deployment/board --timeout=90s`; ein aktuell erfolgreicher Rollout beweist keine künftigen Pulls.


  Eine Argo-CD-Application wählt Repository, Pfad, Revision und Ziel. Der Controller gleicht asynchron ab: `Synced` beschreibt den Vergleich mit Git, `Healthy` die Gesundheit der Ressourcen. Bei app-of-apps gleicht ein Parent eine Child-Application ab, die den Workload abgleicht. Vergleiche beide mit dem gepushten Commit und bewahre die Parent-Identität. `wait-apps.sh` in der Umgebung prüft die erwarteten Applications; versuche es nach dem Abgleich erneut, statt eine sofortige Änderung anzunehmen.


  Ein ApplicationSet-Listengenerator liefert Parameter für eine Go-Vorlage; ein Pfad wie `stations/{{.station}}` erzeugt einen Pfad pro Eintrag. In der ApplicationSet-Quest sendet die Spielabfrage eines von zwei begrenzten Manifesten aus `applicationset.json` an den privaten Controller. Dies ist ein Adapter mit begrenzten erlaubten Änderungen, keine allgemeine Controller-API. Warte auf erzeugte Applications und prüfe Eigentümer, Revision, Zustand und tatsächliche Workload-Antworten.


  Quellen: [private Image-Pulls](https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/), [Argo-CD-Listengenerator](https://argo-cd.readthedocs.io/en/stable/operator-manual/applicationset/Generators-List/), [Go-Vorlagen](https://argo-cd.readthedocs.io/en/stable/operator-manual/applicationset/GoTemplate/).


  Prüfe in Aufgabe 027 die Image-Pull-Ereignisse von relay und erstelle mit den bereitgestellten Spielzugangsdaten ein Pull-Secret im selben Namespace, ohne Werte offenzulegen. Referenziere es in `imagePullSecrets`, behalte das private Image und `Always` und warte auf den Relay-Rollout.


  Vergleiche in Aufgabe 041 die Historien von release-candidate und main. Übernimm die gewünschte Nachricht per Merge oder Cherry-Pick nach main, pushe zum bereitgestellten privaten Remote und führe aus `~/quest` den Befehl `git -C repository fetch origin main release-candidate` aus. Prüfe `north-41` auf lokalem und entferntem main, baseline als Vorfahren, einen sauberen Worktree und die Gleichheit der tatsächlichen HEAD- und Remote-Commits.


  Rotiere in Aufgabe 042 `registry-pull` mit den Spielzugangsdaten, ohne sie auszugeben oder in der Shell-Historie zu speichern. Prüfe den Secret-Typ und kanonisch kodierte Authentisierung, behalte `PRIVATE_IMAGE`, `Always`, eine Replik und genau ein Pull-Secret und prüfe Rollout und `north-42`. Base64 ist Kodierung, keine Verschlüsselung; der aktuelle Rollout beweist keine künftigen Pulls.


  Ändere in Aufgabe 043 den Source-Pfad der Argo Application auf `manifests` und behalte Repository, Projekt, Revision und Ziel. Synchronisiere und vergleiche die Controller-Revision mit dem entfernten main; prüfe Synced/Healthy und die tatsächliche Antwort `north-43`.


  In Aufgabe 049 können ein veränderlicher Tag und der gewünschte Digest denselben Text liefern, obwohl sie verschiedene Artefakte bezeichnen. Pinne `PRIVATE_IMAGE`, behalte `Always` und `registry-pull`, vergleiche die Image-ID des bereiten Containers mit dem gewünschten Digest und prüfe `north-49`.


  Für Aufgabe 027 erstellt dieses Beispiel das Pull-Secret aus der bereitgestellten Umgebung, ohne Zugangsdaten in Befehlsargumente zu setzen oder den Inhalt auszugeben. Ersetze für Aufgabe 042 `parcel-pull` durch `registry-pull`; halte das resultierende Secret privat.


  ```bash

  set +x

  cd ~/quest

  source platform.env

  export DQ_PULL_SECRET=parcel-pull

  python3 - <<''PY'' | kubectl apply -f - >/dev/null

  import base64

  import json

  import os

  import sys


  auth = base64.b64encode((os.environ[''REGISTRY_USER''] + '':'' + os.environ[''REGISTRY_PASSWORD'']).encode()).decode()

  config = json.dumps({''auths'': {os.environ[''REGISTRY'']: {''auth'': auth}}}).encode()

  secret = {''apiVersion'': ''v1'', ''kind'': ''Secret'', ''metadata'': {''name'': os.environ[''DQ_PULL_SECRET'']}, ''type'': ''kubernetes.io/dockerconfigjson'', ''data'': {''.dockerconfigjson'': base64.b64encode(config).decode()}}

  json.dump(secret, sys.stdout)

  PY

  unset DQ_PULL_SECRET

  ```


  Repariere in Aufgabe 061 nur das benannte Repository-Secret mit den aktuellen Spielzugangsdaten; gib das Passwort nicht aus und liste keine anderen Secrets. Prüfe, dass der Zugriff auf dieses Secret begrenzt bleibt. Vergleiche danach Argos synchronisierte Revision mit dem aufgezeichneten Commit und prüfe die Antwort `north-61`.


  Unterscheide in Aufgabe 066 vor der Retention die Digests rollback, current und obsolete. Der bereitgestellte Helper darf in dieser einmaligen Registry nur obsolete löschen; prüfe, dass current und rollback per Digest abrufbar bleiben. Manifestlöschung ist keine Garbage Collection.


  Korrigiere in Aufgabe 068 die Readiness in Git, erstelle und pushe einen Nachfahren von baseline und aktualisiere Argo. Prüfe aufgezeichnete Revision, Healthy-Status und tatsächliche Antwort `north-68`; Synced allein belegt keine Bereitschaft.


  Stelle in Aufgabe 075 den ursprünglichen signierten Push-Hook auf den eingefrorenen Empfänger wieder her und liefere über den bereitgestellten Test-Endpunkt ein gültiges Main-Ereignis. Prüfe bei abgeschaltetem Polling das serverseitig beobachtete Ereignis, aktuelle Revision, Gesundheit und `north-75`; ein manueller Refresh erzeugt dieses Ereignis nicht.


  Fordere in Aufgabe 078 nur den begrenzten Registry-Start an, prüfe authentifiziertes TLS `/v2/` und stelle dann eine Board-Replik mit vorhandenem gepinntem Image und Pull-Secret wieder her. Vergleiche laufende Image-Identität und Antwort; halte die Spielzugangsdaten geheim.


  Verfolge in Aufgabe 091 den laufenden Digest über Registry-Manifest und Source-Revision-Label der Image-Konfiguration zum privaten Git-Quellstand. Erfasse Image, Quell-Commit und Repo und prüfe die Quell-Historie anhand des eingefrorenen Belegs. Ein Label bietet Nachverfolgbarkeit, aber keine Signatur oder Nachweis eines vertrauenswürdigen Builds.


  Erstelle und pushe in Aufgabe 095 einen Git-Revert der fehlerhaften Änderung, statt die Historie zurückzusetzen oder nur das laufende Deployment zu ändern. Erhalte die automatische Reconciliation und vergleiche neue Revision, Gesundheit und Antwort mit dem gewünschten gesunden Zustand.


  Prüfe in Aufgabe 097 das bereitgestellte Archiv gegen die eingefrorene Prüfsumme, lade es in den privaten Daemon und pushe das wiederhergestellte Image in dieselbe Registry. Vergleiche tatsächliche Manifest- und Config-Digests mit den ursprünglichen; ein Tag allein belegt keine Byte-Identität.


  In Aufgabe 122 gleicht der Parent eine Child-Application ab, die wiederum das Board abgleicht. Korrigiere den Child-Source-Pfad in Git und pushe einen Nachfahren von baseline. Erhalte Parent-UID und Apps-Pfad und vergleiche beide Sync-Revisionen, Child-Gesundheit, Tracking-Annotation und Board-Antwort.

  '
