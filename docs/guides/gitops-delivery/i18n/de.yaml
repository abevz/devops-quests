  Das veröffentlichte manifests/board.yaml enthält möglicherweise noch das mutable retired Image, kein Always oder andere Pull-Verweise. Das benannte Container-Image muss exakt der eingefrorenen Veröffentlichung entsprechen; eine leere Template-Liste darf registry-pull vom aktuellen ServiceAccount erben. Fetch-, Parse- und API-Fehler ergeben ebenfalls git_image.  `git -C repository show origin/main:manifests/board.yaml; jq .image /run/dq/facts/0/private-release.json`.


  ### Aktuelles Template vergleichen {#private-git-live-template}


  Die korrigierte Git-Datei ist möglicherweise noch nicht im benannten Live-Container angekommen; vergleichen Sie exaktes eingefrorenes Image und Always. API-Fehler, fehlender Container oder fehlerhafte Struktur ergeben ebenfalls live_image.  `kubectl get deployment board -o json | jq .spec.template.spec.containers`.


  ### Bereites privates Image beobachten {#private-git-ready-private-image}


  Der Rollout wird möglicherweise durch Pull oder Readiness blockiert, oder ein aktueller zugehöriger Pod führt das exakte eingefrorene Image noch nicht mit Digest und ready/running Zustand aus. Das Template allein belegt dies nicht; API- oder Eingabefehler ergeben ebenfalls image_id.  `kubectl rollout status deployment/board --timeout=3s; kubectl get pods -o json | jq .items[].status.containerStatuses`.


  ### Authentifizierten Digest beobachten {#private-git-authenticated-digest}


  Das eingefrorene Image-Feld fehlt möglicherweise oder die Registry-Anfrage scheitert an Endpoint, credentials, CA oder Verfügbarkeit. Die Prüfung ruft den eingefrorenen Digest über authenticated TLS mit aktuellem platform.env und registry-ca.crt ab; Endpoint- oder Credential-Hashes werden nicht mit einer ursprünglichen Authority verglichen.  `jq .image /run/dq/facts/0/private-release.json; test -r registry-ca.crt`.


  ### Service-Antwort beobachten {#private-git-service-response}


  Der Prozess liefert möglicherweise eine alte Antwort oder das Service-Routing ist gestört; die tatsächliche Anfrage an Port 8080 muss nach dem Rollout north-80 liefern.  `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080`.


  ### initial: Beobachtungsstart {#private-git-initial-observer-startup}


  Die initial Beobachtung endet möglicherweise beim Lesen von platform.env oder Laden der Python helpers vor einem Detailergebnis; prüfen Sie Eingabe und dq_check. Benannte Image-, Policy-, Pull- oder API-Fehler behalten eigene Marker.  `test -r platform.env; bash -n platform.env; python3 -I -c "import dq_check"`.


  ### Git: Beobachtungsstart {#private-git-git-observer-startup}


  Die Git Beobachtung endet möglicherweise beim Lesen von platform.env oder Laden der Python helpers vor einem Detailergebnis; prüfen Sie Eingabe und dq_check. Benannte Image-, Policy-, Pull- oder API-Fehler behalten eigene Marker.  `test -r platform.env; bash -n platform.env; python3 -I -c "import dq_check"`.


  ### live: Beobachtungsstart {#private-git-live-observer-startup}


  Die live Beobachtung endet möglicherweise beim Lesen von platform.env oder Laden der Python helpers vor einem Detailergebnis; prüfen Sie Eingabe und dq_check. Benannte Image-, Policy-, Pull- oder API-Fehler behalten eigene Marker.  `test -r platform.env; bash -n platform.env; python3 -I -c "import dq_check"`.


  ### ready: Beobachtungsstart {#private-git-ready-observer-startup}


  Die ready Beobachtung endet möglicherweise beim Lesen von platform.env oder Laden der Python helpers vor einem Detailergebnis; prüfen Sie Eingabe und dq_check. Benannte Image-, Policy-, Pull- oder API-Fehler behalten eigene Marker.  `test -r platform.env; bash -n platform.env; python3 -I -c "import dq_check"`.



  ### Veröffentlichten Release-Stand vergleichen {#image-source-record-published-release-head}


  release-commit nennt möglicherweise nach der Datensatzveröffentlichung noch das vorige Deployment oder gelieferte Plattform-Eingabe beziehungsweise privater Git-Fetch scheitert; vergleichen Sie abgerufenes origin/main mit dem aktuellen Workstation-Release-Beleg.  `git -C repository fetch origin main; git -C repository rev-parse origin/main; cat release-commit`.


  ### Private Git-Quelle erhalten {#image-source-record-retained-git-source}


  Die Anwendung wurde möglicherweise auf ein anderes Repository, einen anderen Branch oder ein anderes Verzeichnis umgestellt oder Eingabe-/API-Abruf scheitert; erhalten Sie gelieferte Git-URL, Branch main und relativen Pfad zu manifests ohne Elternverzeichniswechsel.  `test -r platform.env; kubectl get application board -o json | jq .spec.source`.


  ### Aktuelles abgeglichenes Release beobachten {#image-source-record-current-reconciled-release}


  Die Anwendung meldet möglicherweise eine ältere Revision, bleibt ungesund oder hat self-healing/pruning deaktiviert; warten Sie auf Synced und Healthy bei release-commit mit beiden Flags true. Diese Statuswerte allein belegen keine Aktualisierung einer bereits gemounteten Metadatendatei.  `cat release-commit; kubectl get application board -o json | jq "{automation:.spec.syncPolicy.automated,status:.status}"`.


  ### Workload-Rollout abwarten {#image-source-record-workload-readiness}


  Der aktuelle Rollout gleicht sich möglicherweise noch ab oder Image-Vorbereitung und Containerbereitschaft blockieren ihn; prüfen Sie vorhandene Pods und Ereignisse unter Erhalt des gelieferten unveränderlichen Anwendungsimages.  `kubectl rollout status deployment/board --timeout=3s; kubectl get pods -o wide; kubectl describe deployment board`.


  ### Hauptendpunkt verfügbar halten {#image-source-record-main-endpoint}


  Der Hauptservice ist möglicherweise unerreichbar oder die Metadatenreparatur verdeckt die ursprüngliche Image-Seite; erhalten Sie die Antwort north-91 bei Veröffentlichung des Quelldatensatzes. Eine reine Metadatenantwort erfüllt die separate Hauptendpunktbedingung nicht.  `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080`.


  ### Tatsächliche Image-Quelle verfolgen {#image-source-record-verified-source-observation}


  Der Bericht ist möglicherweise noch leer oder nutzt den Deployment-Commit statt des tatsächlichen früheren Image-Quellcommits; vergleichen Sie eingefrorenes Image, Registry-Manifestbytes, Revisionsmetadaten und Git-Historie. Eingabe-, Registry-, API- oder spätere Datensatzauslieferungs-Lesefehler können ebenfalls vor einem benannten Vergleich diesen Fallback erreichen. Der eingefrorene Beleg bindet normalisiertes JSON mit genau image, commit und repo ohne kopierbare Antwort. Der Quellcommit unterscheidet sich von release-commit, ist Vorfahr von origin/main und enthält die gelieferte Seite. Der tatsächliche Manifest-Body muss zum Image-Digest hashen, sein Config-Revisionslabel muss diesen Quellcommit benennen. Das benannte Live-Image entspricht exakt dem Bericht und ein aktueller zugehöriger bereiter Container führt den Digest aus. Ungenutzte Credential-Helper ergänzen keine Secret-Daten- oder Pull-Policy-Bedingung. Dies sind Traceability-Beobachtungen, keine Signatur oder Nachweis eines vertrauenswürdigen Builds. `jq . provenance.json; git -C repository log --oneline -4 origin/main; kubectl get deployment board -o json | jq .spec.template.spec.containers[].image`.


  ### Denselben Quelldatensatz veröffentlichen und übernehmen {#image-source-record-published-and-mounted-record}


  Veröffentlichtes Manifest oder Live-ConfigMap enthalten möglicherweise noch den anfänglichen leeren Datensatz oder ein vorhandener Pod hält nach der ConfigMap-Änderung seine alte subPath Datei. Veröffentlichen Sie den geprüften Workstation-Bericht über Git und aktualisieren Sie den Verbraucher, bis veröffentlichtes, aktuelles und ausgeliefertes JSON übereinstimmen. Ein fehlgeschlagener Traceability-Observer stoppt vor dem Auslieferungsvergleich. Nach Prüfung müssen Git-Manifestdaten, Live-ConfigMap-Daten und ausgeliefertes JSON dem Bericht entsprechen. Lesefehler vor dem Python-Vergleich teilen den Traceability-Fallback. Die vorhandene Datei ist als subPath gemountet: nach Datensatzveröffentlichung und Aktualisierung von release-commit aktualisiert die Referenz die Anwendung und ersetzt den Pod per Rollout-Restart zur Übernahme der neuen Datei. `git -C repository show origin/main:manifests/provenance.yaml; kubectl get configmap build-record -o json | jq .data; kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080/provenance.json`.



  ### Vorwärts wiederherstellen ohne Verlaufslöschung {#forward-rollback-retained-faulty-history}


  Ein Reset von main auf den gesunden Commit entfernt die geforderte Abstammung von faulty-commit; ein veralteter release-commit kann noch den fehlerhaften oder früheren Stand nennen. Revertieren Sie die Änderung mit neuem Commit, veröffentlichen Sie weitere Reparaturen und aktualisieren Sie den Beleg auf abgerufenes origin/main. Eingabe-, Fetch- und Abstammungsbefehlsfehler nutzen denselben Marker. `git -C repository fetch origin main; git -C repository log --oneline -5 origin/main; cat release-commit; git -C repository merge-base --is-ancestor "$(cat /run/dq/facts/0/faulty-commit)" origin/main`.


  ### Hauptquelle in Git erhalten {#forward-rollback-retained-main-source}


  Eine andere Repository-, Branch- oder Verzeichnisquelle der board-Application umgeht die gelieferte Wiederherstellung. Erhalten Sie Git-URL, Ziel main und relativen Pfad zu manifests ohne Elternwechsel. Fehlende Plattformeingabe, API-Fehler oder gescheiterter JSON-Vergleich nutzen denselben Marker. `test -r platform.env; kubectl get application board -o json | jq .spec.source`.


  ### Abgeglichene main-Revision {#forward-rollback-reconciled-main-revision}


  Der Produzent gleicht möglicherweise noch die falsche Revision ab, ist nicht bereit oder hat self-healing/pruning deaktiviert. Reparieren Sie die Git-Definition und warten Sie auf Synced und Healthy bei aktuellem release-commit mit beiden Flags true; das beweist noch keine neue Publikation bei unabhängig gepinnten reader Applications. `cat release-commit; kubectl get application board -o json | jq "{automation:.spec.syncPolicy.automated,status:.status}"`.


  ### Produzentenrollout {#forward-rollback-producer-rollout}


  Die fehlerhafte readiness probe verwendet 8099, der Server hört jedoch auf 8080; der Rollout kann trotz Git-Synchronisierung blockieren. Reparieren Sie die Git-Definition über neue Commits und prüfen Sie Rollout und Ereignisse; CLI-Fehler oder die dreisekündige Beobachtungsgrenze scheitern ebenfalls. `kubectl rollout status deployment/board --timeout=3s; kubectl describe deployment board; git -C repository show origin/main:manifests/board.yaml`.


  ### HTTP-Antwort des Produzenten {#forward-rollback-producer-http}


  Eine synchronisierte Application kann wegen der fehlerhaften Probe keinen bereiten Service-Endpunkt haben oder einen anderen Inhalt als north-95 liefern. Beobachten Sie nach der Reparatur den board-Endpunkt aus seinem worker; exec-/HTTP-Timeout oder Befehlsfehler scheitern ebenfalls am ursprünglichen Vergleich. `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080`.


  ### Ursprüngliche Applications und Deployments {#forward-rollback-original-application-identities}


  Löschen und Neuerstellen von board, reader-a oder reader-b erhält Namen, ändert aber eingefrorene Application- oder Deployment-UIDs. Reparieren Sie jedes Originalobjekt vor Ort; der Identitätsmarker nennt Produzent oder reader-Lane. Geprüft wird aktuelle Identität, keine unterbrechungsfreie Geschichte. `kubectl get application,deployment -o json | jq ".items[] | {kind,name:.metadata.name,uid:.metadata.uid}"`.


  ### Weitergeführter Verbraucherverlauf {#forward-rollback-forward-consumer-history}


  Der abgerufene Stand entspricht möglicherweise noch dem früheren reader-Baseline oder der Produzent zeigt auf ein anderes Repository. Erhalten Sie Baseline-Abstammung und veröffentlichen Sie einen neueren Commit mit freigegebenen reader-Daten. Ein Fehler des Abstammungsbefehls meldet rollback_observation statt dieses Vergleichsmarkers. `git -C repository log --oneline -5 origin/main; kubectl get application board -o json | jq .spec.source.repoURL`.


  ### Aktuelle Commit-Pins der Leser {#forward-rollback-current-reader-commit-pins}


  Reader sind anfangs an einen älteren Commit gebunden; eine Produzentenreparatur verschiebt ihre Revision nicht. Veröffentlichen Sie freigegebene Manifeste, pinnen Sie jede originale reader Application auf den aktuellen vollständigen Git-Commit, erhalten Sie Pfad, project und destination und warten Sie auf Synced und Healthy bei dieser Revision; main allein erfüllt den immutable Pin-Vergleich nicht. `git -C repository rev-parse origin/main; kubectl get application reader-a reader-b -o json | jq ".items[] | {name:.metadata.name,source:.spec.source,project:.spec.project,destination:.spec.destination,status:.status}"`.


  ### Veröffentlichte Leserprojektion {#forward-rollback-published-reader-projection}


  Ein gesunder reader kann sein Originalprogramm weiterhin mit alter Publikation ausführen. Erhalten Sie image, command und args des reader in Git, Live-Deployment und jedem aktuellen zugehörigen Pod; schließen Sie den Rollout ab und veröffentlichen Sie freigegebenes JSON über genau eine passende ConfigMap-Projektion in der document root. Git- und Live-ConfigMap-data müssen als vollständige Maps übereinstimmen, dekodierte Publikation muss alle freigegebenen Werte enthalten. Äquivalente direkte oder projected ConfigMap-Bindungen sind möglich. `git -C repository ls-tree -r --name-only origin/main -- readers; kubectl get deployment reader-a reader-b -o yaml; kubectl get configmaps -o yaml`.


  ### Publikation bei jedem Leser {#forward-rollback-every-reader-publication}


  Git, Live-ConfigMap und gesunder Status beweisen keine aktuellen Daten in jedem reader Pod. Prüfen Sie jeden aktuellen zugehörigen Pod über localhost und dessen Service: HTTP-JSON muss freigegebene schema, generation und route enthalten. Alte Mount-Dateien können Aktualisierungszeit benötigen; ersetzen Sie das erhaltene reader-Programm nicht durch eine erfundene Antwort. `kubectl get pods -o wide; kubectl exec deployment/reader-a -c worker -- wget -qO- -T 2 http://reader-a:8080; kubectl exec deployment/reader-b -c worker -- wget -qO- -T 2 http://reader-b:8080`.


  ### Begrenzte Rollback-Beobachtung {#forward-rollback-bounded-rollback-observation}


  Ein Git- oder Kubernetes-Befehl überschritt möglicherweise die verbleibende Zeit oder das gemeinsame 14-Sekunden-Budget endete vor Beobachtung beider reader-Lanes. Prüfen Sie API/Git-Zugriff und Konvergenz vor erneutem Abfragen; das benannte Budget gehört zum Observer und beweist keinen bestimmten Konfigurationsfehler. `git -C repository rev-parse origin/main; kubectl --request-timeout=2s get application,deployment,pods -o wide`.


  ### Lesbare Rollback-Eingaben {#forward-rollback-readable-rollback-inputs}


  Der Observer kann eingefrorenen Vertrag, Git-Verlauf, Kubernetes-Dokumente oder projected reader-Daten nicht lesen. Abgefangene CLI-Fehler, ungültiges JSON/YAML, fehlende Felder und doppelte veröffentlichte Ressourcenidentitäten melden diesen Marker; auch ein Fehler des Baseline-Abstammungsbefehls landet hier. Prüfen Sie tatsächliche Eingaben vor Objektänderungen aufgrund unzugänglicher Beobachtung. `test -r /run/dq/facts/0/rollback-contract.json; git -C repository ls-tree -r --name-only origin/main -- readers; kubectl --request-timeout=2s get application,deployment -o yaml`.


  ### Gesunder Vertrag und früher Fallback {#forward-rollback-healthy-contract-and-early-fallback}


  Der ursprüngliche Health-Observer kann gegenüber gesundem Git-Baseline veränderte desired/live-Ressourcen oder Sicherheit, inkompatible liveness/startup probes, unterschiedliches Verhalten, blockierten Rollout oder fehlendes north-95 ablehnen. Er meldet diesen Fallback statt feinerer Marker. Spätere unbenannte Start-, Plattformeingabe- oder unbehandelte Strukturfehler gelangen ebenfalls hierher; benannte Rollback-Fehler unterdrücken ihn. Erhalten Sie Baseline-Ressourcen und Sicherheit beim Reparieren der readiness über Git. `git -C repository show "$(cat /run/dq/facts/0/healthy-commit):manifests/board.yaml"; git -C repository show origin/main:manifests/board.yaml; kubectl get deployment board -o yaml`.


  ### Unveränderte Archivbytes {#archived-release-untouched-archive-bytes}


  recovery-image.tar fehlt möglicherweise, wurde nach Wiederherstellung verändert oder die eingefrorene Prüfsumme ist unlesbar. Erhalten Sie das gelieferte Archiv und vergleichen Sie rohe SHA-256 mit dem Beleg. Ein ähnliches neues Image oder geänderte Arbeitsprüfsumme belegt keine Originalbytes. `sha256sum recovery-image.tar; cat /run/dq/facts/0/archive.sha256`.


  ### Exakte Registry-Bytes und geschütztes Artefakt {#archived-release-exact-registry-bytes-and-protected-artifact}


  Setup entfernt verwendbare lokale Release-Aliasse und das Registry-Manifest; das Archiv muss exakt dieses Release statt eines Neubaus wiederherstellen. Prüfen Sie vertrauenswürdiges TLS, gelieferte Authentifizierung, Immutable-Manifest-Digest, identische Tag-1-Bytes sowie Digest und Größe jedes Config-/Layer-Blobs. Das unabhängige protected-Artefakt samt Blobs muss erhalten bleiben. Jeder Befehls- oder Vergleichsfehler dieser Registry-Phase nutzt denselben Marker. `sha256sum recovery-image.tar; test -r /run/dq/facts/0/registry-ca.crt; docker image ls --digests; jq "{protected_image,protected_tag}" /run/dq/facts/0/recovery-baseline.json`.


  ### Ursprüngliche angehaltene Verbraucher {#archived-release-original-suspended-consumers}


  Neue Controller, Services oder Batch-Definitionen erhalten Namen, ändern aber eingefrorene UIDs. Reparieren Sie Originalobjekte und lassen Sie den CronJob angehalten; eine manuelle Wiederherstellung verlangt keinen aktiven Zeitplan. Fehlende oder ungültige Baseline-/Objektdokumente vor der Source-Phase nutzen ebenfalls diesen Identitätsmarker. `kubectl get deployment,service,cronjob,application -o json | jq ".items[] | {kind,name:.metadata.name,uid:.metadata.uid,suspend:.spec.suspend}"`.


  ### Veröffentlichte unveränderliche Quelle {#archived-release-published-immutable-source}


  Eine wiederhergestellte Registry aktualisiert Git und Verbraucher nicht automatisch. Veröffentlichen Sie den archivierten Image-Digest in der vorhandenen Web-Deployment-Definition, erhalten Sie Application-Source, Projekt station und Ziel und warten Sie auf Synchronisierung des aktuellen Git-Stands mit self-healing/pruning. Das Live-worker-Image muss exakt der deklarierten digest-pinned Referenz entsprechen; ein veränderlicher Tag allein scheitert. `git -C repository show origin/main:manifests/web.yaml; kubectl get application release -o json | jq "{spec,status:.status.sync}"; kubectl get deployment archive-web -o yaml`.


  ### Tatsächliche Web-Übernahme {#archived-release-real-web-adoption}


  Das Web-Deployment kann das richtige Image nennen, während alte oder nicht bereite Pods laufen. Erhalten Sie positive ganzzahlige replicas, aktuelle observed generation und genau die bereiten aktuellen zugehörigen Pods mit diesem Image; archive-web muss per HTTP den ursprünglichen Wert archive-97 liefern. API-, exec- und HTTP-Fehler dieser Web-Phase nutzen denselben Marker. `kubectl rollout status deployment/archive-web --timeout=3s; kubectl get pods -o wide; kubectl exec deployment/archive-web -c worker -- wget -qO- -T 3 http://archive-web:8080`.


  ### Echte abgeschlossene manuelle Ausführung {#archived-release-real-completed-manual-execution}


  Eine reparierte angehaltene CronJob-Vorlage repariert keinen alten unterbrochenen Job und erzeugt keinen Erfolg. Lassen Sie den Zeitplan aus und erstellen Sie einen neuen erfolgreichen Job aus der korrigierten Archiv-Image-Vorlage. Vollständige Pod-Spec muss der Vorlage entsprechen, ein echter zugehöriger worker Pod mit Code 0, archiviertem Runtime-Digest und Logs mit checked-97 erfolgreich sein; genau ein neuer abgeschlossener Job wird akzeptiert, alte Fehlversuche dürfen bleiben. `kubectl get cronjob archive-scan -o yaml; kubectl get jobs,pods -o wide`.


  ### Beobachten ohne Statusmanipulation {#archived-release-observe-without-status-forgery}


  Patch-Rechte des Spielers auf Pod- oder Job-status erlaubten erfundene Ausführungsbelege. Erhalten Sie die Ablehnung beider Status-Patch-Prüfungen und beobachten Sie echte Containerbeendigung, Image-Identität und Logs. Fehlgeschlagene Berechtigungsbeobachtung oder andere Ausgabe als no scheitert ebenfalls. `kubectl auth can-i patch pods --subresource=status; kubectl auth can-i patch jobs --subresource=status`.


  ### Unbenannter Eingabefehler der Verbraucher {#archived-release-unlabelled-consumer-input}


  Nach der Registry-Phase können Git-Fetch, veröffentlichtes Web-Manifest, gemeinsamer Kubernetes-Snapshot oder Python-/Helper-Start vor einem benannten Vergleich scheitern. Prüfen Sie diese tatsächlichen Lesewege und den Workspace. Registry-Fehler haben recovery_registry, abgefangene identity/source/web/batch-Fehler behalten eigene Marker; der Fallback erscheint nur ohne sie. `git -C repository fetch origin main; git -C repository show origin/main:manifests/web.yaml; kubectl get deployment,service,cronjob,job,application,pods,replicasets -o json >/dev/null`.



  ### Aktueller privater Git-Stand {#credential-incident-current-private-git-head}


  release-commit ist möglicherweise veraltet oder Plattformeingabe beziehungsweise privater Git-Fetch scheitert. Vergleichen Sie abgerufenes origin/main mit dem aktuellen Beleg; Credential-Rotation allein belegt keine Nutzung dieser veröffentlichten Revision.


  ```bash

  git -C repository fetch origin main; git -C repository rev-parse origin/main; cat release-commit

  ```


  ### Erhaltene private Quelle {#credential-incident-retained-private-source}


  Eine andere Repository-, Branch- oder Verzeichnisquelle der Application umgeht die gelieferte Auslieferung. Erhalten Sie Git-URL, main und relativen manifests-Pfad ohne Elternwechsel; Plattform-/API-/JSON-Lesefehler scheitern ebenfalls am Quellenvergleich.


  ```bash

  test -r platform.env; kubectl get application board -o json | jq .spec.source

  ```


  ### Abgeglichene Incident-Revision {#credential-incident-reconciled-incident-revision}


  Die Application bleibt möglicherweise wegen fehlender image-pull- oder source-Secret-Eingaben ungesund oder meldet andere Revision und Automation. Stellen Sie Credentials und Secret-Publikation her und warten Sie auf Synced und Healthy bei release-commit mit self-healing und pruning true.


  ```bash

  cat release-commit; kubectl get application board -o json | jq "{automation:.spec.syncPolicy.automated,status:.status}"

  ```


  ### Tatsächliche Dienstantwort {#credential-incident-actual-incident-service}


  Bereite Deklaration oder erfolgreicher Credential-API-Aufruf belegt keine Antwort north-99 des board-Service. Image-Pull, Übernahme des source Secret oder fehlende bereite Endpunkte können den Aufruf blockieren; exec-/HTTP-Timeout und anderer Inhalt scheitern ebenfalls am Wertvergleich.


  ```bash

  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080

  ```


  ### Tatsächliche Übernahme des privaten Images {#credential-incident-actual-private-image-adoption}


  Worker verwendet möglicherweise nicht das eingefrorene Image mit Always oder kein aktueller zugehöriger bereiter Pod erfüllt Image, Always und nicht leere imagePullSecrets-Namen. Stellen Sie das fehlende Registry-Secret her und warten Sie auf Rollout. Der Observer prüft Image-Übernahme und Secret-Namen; ungenutzte Credential-Helper ergänzen keinen Secret-Inhaltsvergleich. Eingabe-, Rollout-, API-, JSON- und Startfehler teilen den Fallback.


  ```bash

  kubectl rollout status deployment/board --timeout=3s; kubectl get deployment board -o yaml; kubectl get pods -o wide

  ```


  ### Repository der Application {#q100-application-repository}


  Die Application verweist möglicherweise auf ein anderes Git-Repository. Vergleichen Sie die Quell-URL mit GIT_URL aus der bereitgestellten Umgebung.


  ```bash

  kubectl get application board -o jsonpath=''{.spec.source.repoURL}''

  ```


  ### Quellverzeichnis der Application {#q100-application-directory}


  Die Quelle verweist möglicherweise noch auf das stillgelegte Verzeichnis. Verwenden Sie einen relativen Pfad nach manifests ohne Wechsel ins Elternverzeichnis.


  ```bash

  kubectl get application board -o jsonpath=''{.spec.source.path}''

  ```


  ### Zweig der Application {#q100-application-branch}


  Die Application verfolgt möglicherweise einen anderen Zweig oder Commit. Prüfen Sie, ob targetRevision im aktiven Objekt main lautet.


  ```bash

  kubectl get application board -o jsonpath=''{.spec.source.targetRevision}''

  ```


  ### Automatische Driftkorrektur {#q100-application-self-heal}


  Die Selbstheilung fehlt möglicherweise oder ist deaktiviert. Prüfen Sie, ob die aktive Richtlinie selfHeal auf den booleschen Wert true setzt.


  ```bash

  kubectl get application board -o jsonpath=''{.spec.syncPolicy.automated.selfHeal}''

  ```


  ### Bereinigungsrichtlinie {#q100-application-pruning}


  Die automatische Bereinigung fehlt möglicherweise oder ist deaktiviert. Prüfen Sie, ob die aktive Richtlinie prune auf den booleschen Wert true setzt.


  ```bash

  kubectl get application board -o jsonpath=''{.spec.syncPolicy.automated.prune}''

  ```


  ### Synchronisierungsstatus der Application {#q100-application-sync}


  Der Controller sieht möglicherweise noch die alte Quelle oder eine nicht angewendete Revision. Prüfen Sie den Synchronisierungsstatus nach dem Abgleich.


  ```bash

  kubectl get application board -o json | jq ''.status.sync''

  ```


  ### Beleg der Basisrevision {#q100-baseline-receipt}


  Der eingefrorene Beleg baseline-commit ist möglicherweise leer oder unlesbar. Prüfen Sie den Beleg der Basisrevision vor dem Statusvergleich.


  ```bash

  test -s /run/dq/facts/0/baseline-commit

  ```


  ### Beobachtete Basisrevision {#q100-application-baseline}


  In Phase eins kann die Application trotz korrekter Quelle einen anderen Commit melden. Vergleichen Sie sync.revision nach dem Abgleich mit baseline-commit.


  ```bash

  cat /run/dq/facts/0/baseline-commit; kubectl get application board -o jsonpath=''{.status.sync.revision}''

  ```


  ### Abruf aus privatem Git {#q100-private-git-fetch}


  Das private Remote ist möglicherweise unerreichbar oder Git hat keinen Zugriff. Rufen Sie origin main vor dem Revisionsvergleich erfolgreich ab.


  ```bash

  git -C repository fetch origin main

  ```


  ### Beleg des aktuellen Releases {#q100-current-release-receipt}


  Die Arbeitsdatei release-commit ist möglicherweise leer oder veraltet. Vergleichen Sie sie mit dem frisch abgerufenen origin/main, auch bei scheinbar aktuellem Checkout.


  ```bash

  git -C repository rev-parse origin/main; cat release-commit

  ```


  ### Zustand der Application {#q100-application-health}


  In der Release-Phase können fehlende Registry-Zugangsdaten oder ein unveröffentlichtes Routen-Secret die Application beeinträchtigen. Prüfen Sie die aktuellen Pods und warten Sie auf Healthy.


  ```bash

  kubectl get application board -o jsonpath=''{.status.health.status}''; kubectl get pods -l app=board

  ```


  ### Beobachtete Release-Revision {#q100-application-release}


  Der Controller ist möglicherweise mit einem älteren Commit synchronisiert. Vergleichen Sie sync.revision nach der Quellenaktualisierung mit release-commit.


  ```bash

  cat release-commit; kubectl get application board -o jsonpath=''{.status.sync.revision}''

  ```


  ### HTTP-Antwort des Releases {#q100-release-http}


  Der Service liefert möglicherweise einen alten Wert oder die Anfrage läuft in ein Timeout. Rufen Sie ihn aus dem Worker auf und vergleichen Sie die Antwort mit north-100.


  ```bash

  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080

  ```


  ### Festgehaltenes Image im Cluster {#q100-live-frozen-image}


  Der Worker im Deployment oder einem zugehörigen aktuellen Pod nutzt möglicherweise ein anderes Image. Vergleichen Sie die Images der Worker mit dem festgehaltenen Image und prüfen Sie den Zugriff auf Objekte und Image-Beleg.


  ```bash

  kubectl get deployments,replicasets,pods -l app=board -o wide

  ```


  ### Pull-Policy des Images {#q100-current-pull-policy}


  Der Worker hat möglicherweise eine andere Pull-Policy oder das Deployment hat keine aktuellen Pods. Prüfen Sie Always beim Worker in der Vorlage und in allen aktuellen zugehörigen Pods.


  ```bash

  kubectl get deployment board -o json | jq ''.spec.template.spec.containers[] | select(.name == "worker") | .imagePullPolicy''

  ```


  ### Verweise auf das Registry-Secret {#q100-current-registry-reference}


  Ein aktueller zugehöriger Pod lässt registry-pull möglicherweise aus oder verweist auf ein zusätzliches Secret. Prüfen Sie nach dem Rollout die wirksamen Pod-Verweise und lassen Sie nur registry-pull stehen.


  ```bash

  kubectl get pods -l app=board -o custom-columns=NAME:.metadata.name,PULL:.spec.imagePullSecrets[*].name

  ```


  ### Secret-Verweis des Workers {#q100-live-secret-reference}


  Im bereitgestellten Worker fehlt ROUTE_SECRET möglicherweise, ist doppelt oder hat ein Feld value. Prüfen Sie den einzigen Eintrag auf secretKeyRef nach route-secret/value.


  ```bash

  kubectl get deployment board -o json | jq ''.spec.template.spec.containers[] | select(.name == "worker") | [.env[] | select(.name == "ROUTE_SECRET") | {name, valueFrom, hasLiteral: has("value")}]''

  ```


  ### Bereiter Worker mit festgehaltenem Digest {#q100-ready-frozen-image}


  Trotz korrekter Image-Deklaration fehlt möglicherweise ein aktueller zugehöriger Pod mit bereitem Worker für den festgehaltenen Digest. Prüfen Sie nach dem Rollout Bereitschaft und imageID im Worker-Container.


  ```bash

  kubectl get pods -l app=board -o custom-columns=NAME:.metadata.name,READY:.status.containerStatuses[*].ready,IMAGE_ID:.status.containerStatuses[*].imageID

  ```


  ### Festgehaltenes Image in Git {#q100-published-frozen-image}


  Im abgerufenen main-Manifest fehlt möglicherweise der Worker des Deployments board oder ein anderes Image ist angegeben. Prüfen Sie den veröffentlichten Worker und den Image-Beleg auch bei Git- oder YAML-Fehlern.


  ```bash

  git -C repository show origin/main:manifests/board.yaml | grep -E ''^ *image:''

  ```


  ### Veröffentlichter Secret-Verweis {#q100-published-secret-reference}


  Der veröffentlichte Eintrag ROUTE_SECRET enthält möglicherweise value oder einen falschen Schlüssel. Prüfen Sie im veröffentlichten Worker den einzigen secretKeyRef auf route-secret/value.


  ```bash

  git -C repository show origin/main:manifests/board.yaml | python3 -c ''import sys, yaml; d=yaml.safe_load(sys.stdin); print([(e.get("valueFrom"), "value" in e) for c in d["spec"]["template"]["spec"]["containers"] if c["name"] == "worker" for e in c.get("env", []) if e["name"] == "ROUTE_SECRET"])''

  ```


  ### Eingaben für die Application-Prüfung {#q100-application-probe-input}


  Die Application-Prüfung kann vor dem Feldvergleich abbrechen, wenn Arbeitsverzeichnis oder Plattformeingabe nicht erreichbar sind. Prüfen Sie Verzeichnis, Umgebungsdatei und Zugriff auf die Application.


  ```bash

  pwd; test -r platform.env; kubectl get application board -o name

  ```


  ### Eingaben für die Git-Prüfung {#q100-git-probe-input}


  Die Git-Prüfung kann vor der Auswertung von Revision oder Manifest abbrechen. Prüfen Sie platform.env, das Arbeits-Repository und die lokalen Werkzeuge.


  ```bash

  pwd; test -r platform.env; git -C repository status --short

  ```


  ### Eingaben für die Workload-Prüfung {#q100-workload-probe-input}


  Die Prüfung kann vor dem Lesen des Worker-Containers abbrechen, wenn Arbeitsverzeichnis oder Python nicht starten. Prüfen Sie Werkzeuge und Zugriff auf das Deployment board.


  ```bash

  pwd; command -v python3; kubectl get deployment board -o name

  ```


  ### Bereitschaft nach dem Rollout {#q100-rollout-readiness}


  Die kurze Rollout-Wartezeit kann vor der imageID-Prüfung ablaufen. Prüfen Sie vor dem erneuten Versuch den Rollout sowie Pull- und Bereitschaftsereignisse.


  ```bash

  kubectl rollout status deployment/board --timeout=3s

  ```


  ### Eingaben für die Service-Prüfung {#q100-service-probe-input}


  Die HTTP-Prüfung kann vor dem Aufruf abbrechen, wenn Arbeitsverzeichnis oder Plattformeingabe fehlen. Prüfen Sie das Verzeichnis und den Zugriff auf den Service board.


  ```bash

  pwd; test -r platform.env; kubectl get service board -o name

  ```

  '
