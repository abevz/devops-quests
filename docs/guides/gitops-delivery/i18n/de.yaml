heading: Private Registry und GitOps wiederherstellen
text: '# Private Registry und GitOps wiederherstellen


  ## Grenzen getrennt betrachten


  Registry-Verfügbarkeit, Transportvertrauen, Quellenidentität und Verbraucherübernahme sind getrennte Beobachtungen. Nur die kurzlebige Spielumgebung verwenden. Quellenverträge mit der aktiven API vergleichen; eingefrorene Einträge bewahren die ursprüngliche Autorität. Eine Steuerquittung beschreibt eine Agentenaktion, keine dauerhafte Verfügbarkeit, Berechtigung oder Datenübernahme.


  ## Private Image-Verbraucher {#private-image-consumers}


  Workstation-Client und Kubelet verwahren Zugangsdaten unabhängig. Ein erfolgreicher authentifizierter Abruf aktualisiert keinen Kubernetes-Pull-Secret im Namespace. Der Secret enthält Registry-Zugangsdaten, installiert aber keine CA in die Node-Laufzeit. Vorgesehenen Endpunkt, Zertifikatsvertrauen, unveränderliches Image, Controller-Identität und Zugangsdatenobjekt bewahren.


  Pod-Ereignisse unterscheiden Verbindungs-, Zertifikats-, Berechtigungs- und fehlende Manifestfehler. Always steuert Auflösung und Abruf; Image-Cache und Ready-Container belegen keine Gültigkeit gespeicherter Zugangsdaten für einen späteren Abruf. Secret privat mit freigegebener Autorität vergleichen; tatsächlichen Image-Digest und zugehörige Pod-Referenzen prüfen.


  Das allgemeine Beispiel aktualisiert einen bestehenden erlaubten Secret. Zuerst Objekt und bereitgestellte Autorität auswählen. Es gibt keine Zugangsdaten aus; Base64 ist Kodierung, keine Verschlüsselung. Der Workload muss weiterhin das vorgesehene Objekt referenzieren.


  ```bash

  set -euo pipefail

  set +x

  : "${DQ_PULL_SECRET:?select the existing authorized Secret}"

  : "${REGISTRY:?select the approved registry endpoint}"

  : "${REGISTRY_USER:?select the supplied registry identity}"

  : "${REGISTRY_PASSWORD:?load the private supplied credential}"

  export DQ_PULL_SECRET REGISTRY REGISTRY_USER REGISTRY_PASSWORD

  before=$(kubectl get secret "$DQ_PULL_SECRET" -o jsonpath=''{.metadata.uid}'')

  python3 -I - <<''PRIVATE_AUTH'' | kubectl apply -f - >/dev/null

  import base64,json,os

  auth=base64.b64encode((os.environ[''REGISTRY_USER'']+'':''+os.environ[''REGISTRY_PASSWORD'']).encode()).decode()

  config={''auths'':{os.environ[''REGISTRY'']:{''auth'':auth}}}

  secret={''apiVersion'':''v1'',''kind'':''Secret'',''metadata'':{''name'':os.environ[''DQ_PULL_SECRET'']},

  ''type'':''kubernetes.io/dockerconfigjson'',''data'':{''.dockerconfigjson'':base64.b64encode(json.dumps(config).encode()).decode()}}

  print(json.dumps(secret))

  PRIVATE_AUTH

  test "$(kubectl get secret "$DQ_PULL_SECRET" -o jsonpath=''{.metadata.uid}'')" = "$before"

  ```


  ## Aufbewahrung und veränderliche Referenzen


  Ein Tag verweist auf ein Manifest, dessen Digest genaue Bytes bezeichnet. Ein lokaler Docker-Tag aktualisiert eine entfernte Registry erst nach Push des Manifests. Tag-Bestand, Manifestantworten und freigegebenen Digest-Katalog vergleichen. Manifest-Medientypen beim Abruf und bei Docker-Content-Digest berücksichtigen.


  Aufbewahrung auf geschützte Manifestidentitäten stützen. Plan vor DELETE und Lesbarkeit geschützter Manifeste danach prüfen. Verbleibende Release-Tags müssen ebenfalls auf den vorgesehenen Inhalt zeigen: ein bewahrter Digest bewahrt nicht automatisch einen veränderlichen Alias. Manifest-Löschung und Einsammeln unreferenzierter Blobs sind getrennte Vorgänge. Keine Volume-Löschung, unsicheres TLS oder fremde Registry als Ersatz verwenden.


  ## Ereignisse und Abgleich


  Ein Repository-Webhook verbindet ein Quellenereignis mit einem privaten Empfänger. Empfänger, Ereignistyp, Repository, Branch und Signaturkonfiguration ohne Geheimnisausgabe vergleichen. Annahme eines signierten Ereignisses unterscheidet sich von periodischem Polling und erfolgreichem Quellenabgleich. Zustellergebnis und authentifizierte Empfängerbeobachtung zusammen verwenden.


  Eine Application bindet Repository, Pfad, Revision, Projekt und Ziel. Synced beschreibt Quellenvergleich, Healthy Ressourcengesundheit. Beide belegen keine Anwendungsantwort. Abgeglichene Revision, Soll-Daten, Kubernetes-Objekt und tatsächliche Antwort vergleichen, ohne eine korrekte Zugriffsgrenze zu ändern.


  ## Veröffentlichung und Übernahme


  Eine gemountete ConfigMap kann projizierte Dateien aktualisieren, während die Anwendung eine beim Start kopierte Fassung ausliefert. Unterstützte Aktualisierung oder Rollout kann zur Übernahme nötig sein. Ursprünglichen Controller und Pod-Programm bewahren; jeden aktiven zugehörigen Pod mit Quelle und Antwort vergleichen. Ein gesundes Ersatzobjekt bewahrt keine ursprüngliche Identität.


  Bei App-of-Apps gleicht ein Elternobjekt eine untergeordnete Application ab, diese den Workload. Quelle und Eigentümer je Ebene verfolgen. ApplicationSet-Generatoren übergeben Parameter an Vorlagen; erzeugte Objekte ebenso prüfen. Direkte Änderungen können vom Controller überschrieben werden. Repository-Autorität, Eigentümeridentitäten, Namespace und Publikation bei der Weitergabe bewahren.


  Ein verwaltetes Kind kann gültige Manifeste anwenden und eine veraltete Veröffentlichung auswählen. Vergleiche die eingebundene Quelle mit der HTTP-Antwort. Vergleiche bei einer Flotte Pfad und Zielreferenz jeder erzeugten Application mit dem aufgelösten Commit. Verschiedene Zweige können vorübergehend auf denselben Commit zeigen, daher belegt eine übereinstimmende Revision allein nicht die vorgesehene Quelle.


  Referenzen: [Registry-API](https://distribution.github.io/distribution/spec/api/), [private Images](https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/), [Argo-CD-Webhooks](https://argo-cd.readthedocs.io/en/stable/operator-manual/webhook/), [ConfigMap-Übernahme](https://kubernetes.io/docs/tutorials/configuration/updating-configuration-via-a-configmap/).


  ### Eingaben der Git-Prüfung {#git-environment}


  Die Git-Prüfung endete vor dem Lesen des Repositorys; platform.env fehlt möglicherweise, ist unlesbar oder schlägt beim Laden fehl. Die eingecheckten Meldungen konnten nicht geprüft werden; platform.env, Repository, Git oder Python sind möglicherweise vor den Referenzprüfungen nicht verfügbar. Arbeiten Sie in ~/quest und stellen Sie die gelieferte platform.env wieder her, falls sie entfernt wurde; das Laden muss vor der Git-Prüfung gelingen. Der Fallback umfasst auch fehlendes Python oder einen fehlgeschlagenen Git-Prozessstart.


  ### Delivery-Branches abrufen {#git-fetch}


  main und release-candidate konnten nicht abgerufen werden; origin hat möglicherweise eine falsche URL, keinen Zugriff oder eine fehlende Branch. `git -C repository ls-remote --heads origin main release-candidate`.


  ### Aktueller Branch und Arbeitsverzeichnis {#git-worktree}


  Der aktuelle Branch ist nicht main oder nicht lesbar; möglicherweise ist noch release-candidate oder ein losgelöster HEAD ausgecheckt. Das Arbeitsverzeichnis enthält Änderungen oder unversionierte Dateien; möglicherweise fehlen Commits oder temporäre Dateien sind übrig. `git -C repository status --short --branch`.


  ### Meldung in eingecheckten Git-Objekten {#git-committed-notice}


  origin/main:notice.txt ist unlesbar oder weicht von north-41 ab; main wurde möglicherweise nicht gepusht oder die lokale Remote-Referenz ist veraltet. HEAD:notice.txt ist unlesbar oder weicht von north-41 ab; möglicherweise fehlt der Kandidaten-Commit auf lokalem main trotz bearbeiteter Arbeitsdatei. `git -C repository show HEAD:notice.txt; git -C repository show origin/main:notice.txt`.


  ### Veröffentlichter Commit und Historie {#git-publication-history}


  Die Basis fehlt, ist ungültig oder kein Vorfahr von origin/main; die veröffentlichte Historie wurde möglicherweise ersetzt statt erweitert. HEAD ist ungültig oder weicht von origin/main ab; ein lokaler Commit wurde möglicherweise nicht gepusht oder die Remote-Referenz nicht aktualisiert. `git -C repository rev-parse HEAD origin/main; git -C repository merge-base --is-ancestor "$(cat baseline-commit)" origin/main`.


  ### Eingaben der privaten Workload-Prüfung {#registry-observation}


  Die Replikaprüfung endete vor dem Lesen von board; platform.env fehlt möglicherweise, ist unlesbar oder schlägt beim Laden fehl. Die private Anwendung konnte nicht geprüft werden; Umgebungswerte, API-JSON, Deployment-Eigentümer oder ein eindeutiger worker-Container fehlen möglicherweise oder sind fehlerhaft. Die Zugangsdatenprüfung endete vor der Detailprüfung; platform.env, Registry-Variablen oder Python sind möglicherweise nicht verfügbar. Laden Sie platform.env, ohne Passwörter auszugeben. Prüfen Sie Deployment board, ReplicaSets und Pods im Bay-Namespace: aktive Pods sind weder beendet noch zur Löschung markiert und gehören über ein steuerndes ReplicaSet anhand der UID zum Deployment. Fehlende oder fehlerhafte worker- oder Pull-Secret-Identitäten können Detailprüfungen ebenfalls verhindern.


  ### Privates Image in aktiven Pods {#registry-pod-contract}


  Das worker-Image in board oder aktiven Pods weicht von PRIVATE_IMAGE ab; eine geänderte Vorlage oder ein älteres ReplicaSet verwendet möglicherweise ein anderes Image. Always fehlt beim worker von board oder einem aktiven Pod; Cache-Einstellungen oder Pods einer älteren Vorlage können einen neuen Registry-Abruf umgehen. Es wurde kein aktiver board-Pod gefunden oder seine effektiven Pull-Secrets bestehen nicht nur aus registry-pull; Vorlage oder ServiceAccount haben möglicherweise ein Secret ergänzt oder ausgelassen. Vergleichen Sie die Deployment-Vorlage mit den aktuellen zugehörigen Pods. Eine Vorlagenänderung ändert bestehende Pods nicht; ein neuer Rollout muss sie ersetzen. ServiceAccount-Admission kann effektive imagePullSecrets ergänzen, prüfen Sie daher Pod-Spezifikationen neben board.yaml.


  ### Gewünschte Zahl privater Verbraucher {#registry-replicas}


  Die gewünschte Replikazahl ist nicht 1 oder board ist nicht lesbar; Herunterskalieren repariert keine Authentifizierung für private Images. `kubectl get deployment board -o jsonpath=''{.spec.replicas}''`.


  ### Docker-Zugangsdokument {#registry-credential-document}


  registry-pull hat keinen unterstützten Docker-Zugangstyp; ein generisches Secret oder ein fehlender beziehungsweise unlesbarer Typ liefert keine Registry-Zugangsdaten. Das Docker-Zugangsdokument lässt sich nicht dekodieren; der benötigte data-Schlüssel, Base64, JSON oder eindeutige JSON-Felder sind möglicherweise ungültig. Der Typ kubernetes.io/dockerconfigjson benötigt data[".dockerconfigjson"] mit Base64-JSON {"auths":{...}}; kubernetes.io/dockercfg benötigt data[".dockercfg"] mit der direkten Registry-Zuordnung. Doppelte JSON-Schlüssel werden abgelehnt. Prüfen Sie die Struktur ohne Zugangswerte offenzulegen.


  ### Registry-Eintrag und rotierte Zugangsdaten {#registry-credential-auth}


  Die Authentifizierungsdaten sind unlesbar oder unbrauchbar; prüfen Sie den genauen Registry-Eintrag, Base64-auth mit Doppelpunkt oder Zeichenkettenfelder username/password. Die dekodierten Zugangsdaten weichen von platform.env ab; registry-pull enthält möglicherweise noch das alte Passwort oder einen anderen Benutzer. Der Eintragsschlüssel muss REGISTRY genau entsprechen. Ein nicht leeres auth hat Vorrang vor username/password und muss zu geliefertem Benutzer, Doppelpunkt und Passwort dekodieren; zusätzliche passende Einzelfelder reparieren altes auth nicht. Eine Secret-Aktualisierung beweist keinen neuen Abruf; prüfen Sie Rollout und HTTP getrennt.


  ### Bereitschaft und HTTP des privaten Verbrauchers {#registry-consumer-health}


  board hat den Rollout nicht innerhalb von 3 Sekunden abgeschlossen; abgelehnte Zugangsdaten, Image-Pull-Backoff oder ein fehlerhafter worker können die Bereitschaft blockieren. Der worker lieferte an localhost:8080 nicht north-42; er läuft möglicherweise noch nicht, exec ist fehlgeschlagen oder HTTP-Befehl beziehungsweise Inhalt wurden geändert. `kubectl describe pods; kubectl rollout status deployment/board --timeout=10s`.


  ### Quelle und Ziel der Application {#argo-source-contract}


  Quelle oder Ziel der Application passen nicht zur bereitgestellten Version oder sind unlesbar; der ursprüngliche Pfad retired verweist nicht auf manifests in main. `kubectl get application station -o jsonpath=''{.spec}''; cat application.yaml repository/manifests/board.yaml`. Prüfen Sie project station, die gelieferte GIT_URL, targetRevision main, das relative Verzeichnis manifests und den Bay-Namespace. Der lokale Cluster wird entweder per server https://kubernetes.default.svc ohne name oder per name in-cluster ohne server gewählt. Absolute Pfade und Elternverzeichniswechsel bezeichnen nicht das benötigte Verzeichnis.


  ### Beobachtete Revision, Abgleich und Zustand {#argo-observed-revision}


  Synced und Healthy auf dem entfernten main konnten nicht bestätigt werden; Quellpfad, Repository-Zugriff, fehlerhafte Ressourcen oder eine unlesbare Remote-Referenz können den Abgleich blockieren. `git -C repository ls-remote origin refs/heads/main; kubectl get application station -o jsonpath=''{.status}''; kubectl describe application station`. Auch das Laden von platform.env oder der Start von Git, kubectl oder jq kann vor der Zustandsbeobachtung fehlgeschlagen sein.


  ### Rollout und Antwort des Verbrauchers {#argo-consumer-health}


  Der board-Rollout schlug fehl oder dauerte länger als 3 Sekunden; Argo hat die Manifeste möglicherweise noch nicht angewendet oder worker ist noch nicht verfügbar. Die worker-Antwort war nicht north-43 oder exec schlug fehl; die Git-verwaltete Anwendung fehlt möglicherweise, ist nicht bereit oder liefert geänderten Inhalt. `kubectl rollout status deployment/board --timeout=10s; kubectl exec deployment/board -c worker -- wget -qO- http://127.0.0.1:8080`.


  ### Gewünschten Image-Digest beobachten {#private-digest-observation}


  Das gewünschte private Image und ein bereiter Pod mit passendem Digest konnten nicht bestätigt werden; parcel:stable wählt möglicherweise noch das andere Image, kein aktueller worker ist mit dem geforderten Digest bereit oder Umgebung beziehungsweise API sind nicht verfügbar. Vergleichen Sie intended aus release-catalog.txt mit der board-Vorlage und einem aktuellen zugehörigen bereiten worker. PRIVATE_IMAGE muss den geforderten sha256-Digest verwenden und die beobachtete imageID muss passen. Das anfängliche parcel:stable ist ein separat gebautes Image mit anderem Label, liefert aber denselben HTTP-Inhalt; HTTP-Erfolg allein beweist keine Image-Identität. API-JSON, Umgebungsvariablen und worker-/Controller-Identitäten müssen lesbar sein.


  ### Effektive Pull-Einstellungen aktueller Pods {#private-consumer-pull-contract}


  Always und ausschließlich registry-pull konnten für aktive board-Pods nicht bestätigt werden; alte Vorlagen, effektive Pull-Secret-Referenzen, fehlende aktuelle Pods oder unlesbare Umgebungs-/API-Identitäten können die Ursache sein. Prüfen Sie Deployment-Vorlage und alle aktuellen Pods über die steuernden ReplicaSets. Vorlagen-worker und jeder aktuelle worker benötigen Always; aktuelle Pods dürfen effektiv nur registry-pull als Pull-Secret nutzen. Alte Vorlagen und ServiceAccount-Admission können Abweichungen erklären. Diese Bedingung beobachtet Pull-Richtlinie und Secret-Namen. Prüfen Sie bei fehlgeschlagenen Image-Abrufen die registry-pull-Authentifizierung gesondert.


  ### Bereitschaft nach Image-Festlegung {#private-digest-readiness}


  Deployment board hat den Rollout nicht innerhalb von 3 Sekunden abgeschlossen; das neue Image wird möglicherweise noch geladen, Zugangsdaten oder Scheduling blockieren es oder die Beobachtung schlug fehl. `kubectl describe pods; kubectl rollout status deployment/board --timeout=10s`.


  ### HTTP getrennt von Image-Identität {#private-digest-http}


  Der worker lieferte an localhost:8080 nicht north-49 oder exec schlug fehl; der Pod ist möglicherweise nicht bereit oder HTTP-Befehl beziehungsweise Inhalt wurden trotz scheinbar richtigem Image geändert. `kubectl exec deployment/board -c worker -- wget -qO- http://127.0.0.1:8080`.



  ### Ursprüngliches Repository-Secret erhalten {#delivery-original-secret-identity}


  Die UID des Repository-Secrets wurde geändert; eine Neuerstellung von station-repository erhält den Namen, verliert jedoch das beim Setup erfasste ursprüngliche Zugangsdatenobjekt.  `source platform.env; kubectl -n "$ARGO_NAMESPACE" get secret station-repository -o jsonpath=''{.metadata.uid}''`.


  ### Repository-Identität im Secret {#delivery-secret-repository-binding}


  Das ursprüngliche Secret bezeichnet das gelieferte Git-Repository und Konto nicht mehr als Argo-Zugangsdaten; die veraltete URL, geänderte username/type oder ein fehlendes repository Label verhindern die Verwendung.  `cat delivery-access.json`.


  ### Freigegebenes Repository-Passwort wiederherstellen {#delivery-approved-secret-password}


  Das Secret-Passwort entspricht nicht dem geschützten freigegebenen Wert; das gelieferte veraltete Passwort oder eine unvollständige Korrektur verhindert möglicherweise Argos Anmeldung am ursprünglichen Repository.  `cat delivery-access.json`.


  ### Ursprüngliche Application erhalten {#delivery-original-application-identity}


  Die UID der Application board wurde geändert; Löschen und Neuerstellen ersetzt die ursprüngliche Bereitstellungsidentität, selbst wenn Name und Manifeste gleich bleiben.  `kubectl get application board -o jsonpath=''{.metadata.uid}''`.


  ### Private Git-Konfiguration mit Zugangsdaten {#delivery-private-git-configuration}


  Eine geprüfte Git-Konfiguration enthält das Passwort oder dessen Basic-Kodierung und gewährt Gruppen-/Fremdrechte; ein korrigierter Header in einer allgemein zugänglichen Konfiguration kann die funktionierenden Zugangsdaten offenlegen. Die Prüfung untersucht ~/.gitconfig und repository/.git/config, wenn sie das aktuelle Secret-Passwort oder dessen Basic-Kodierung enthalten. Solche Dateien dürfen keine Gruppen-/Fremdrechte haben; für eine Konfiguration ohne diese Bytes fordert diese Bedingung diesen Modus nicht. Prüfen Sie Rechte ohne Ausgabe der Zugangsdaten. `stat -c "%a %n" ~/.gitconfig repository/.git/config`.


  ### Ursprüngliches Repository direkt kontaktieren {#delivery-direct-git-authority}


  Git löst die gelieferte Repository-URL zu einer anderen Gegenstelle oder einem anderen Pfad auf; eine URL-Umschreibung kann die Workstation trotz zufällig passender Branch auf ein anderes Repository lenken. Die aufgelöste URL muss Schema, hostname, Port und Pfad ohne abschließenden Schrägstrich erhalten; eingebettete Anmeldung ändert diesen Vergleich nicht. Query oder fragment macht die Beobachtung ungültig. Ein passender main Commit in einem anderen Repository belegt keinen direkten Zugriff auf das ursprüngliche. `git -C repository config --show-origin --name-only --get-regexp "url.*"`.


  ### Anmelden und Remote-Referenz main beobachten {#delivery-authenticated-remote-main}


  Das ursprüngliche Repository kann nicht abgefragt werden oder main weicht vom geschützten Release ab; der veraltete Authorization-Header auf der Workstation, fehlender Zugriff oder eine geänderte Remote-Publikation können die Ursache sein.  `source platform.env; git -C repository ls-remote "$GIT_URL" refs/heads/main`.


  ### Zugriff innerhalb der Frist beobachten {#delivery-access-observation-budget}


  Eine Git- oder Kubernetes-Beobachtung überschritt Befehls- oder Gesamtfrist; langsame API, Netzwerk- oder Authentifizierungsendpunkte verhindern rechtzeitige Zugriffsvergleiche.  `kubectl --request-timeout=2s get application board -o json`.


  ### Lesbare Zugriffsbelege und API-Objekte {#delivery-access-observation-inputs}


  Der Bereitstellungszugriff konnte nicht beobachtet werden; fehlender geschützter Beleg oder Objekte, ungültiges JSON beziehungsweise Zugangsdatenkodierung, unlesbare Git-Konfiguration oder API-Fehler können die Ursache sein.  `cat delivery-access.json; kubectl get application board -o json`.


  ### Secret-Passwortprüfung und Beobachtungsstart {#delivery-password-gate-and-startup}


  Der alte Secret-Passwortvergleich schlug fehl oder die Zugriffsprüfung endete vor einem benannten Marker; ein nicht korrigiertes Passwort, geänderte Erwartung in platform.env oder fehlende Umgebungs-/Python-Eingaben können die Ursache sein.  `test -r platform.env; command -v python3`.


  ### Begrenzte Berechtigung zur Secret-Korrektur {#delivery-scoped-secret-permissions}


  Der erforderliche begrenzte Secret-Zugriff wurde nicht bestätigt; fehlendes patch für station-repository, falscher Namespace, weitergehende list-/Fremd-Secret-Rechte oder fehlende platform.env beziehungsweise API-Eingaben können die Ursache sein.  `source platform.env; kubectl auth can-i patch secret/station-repository -n "$ARGO_NAMESPACE"; kubectl auth can-i list secrets -n "$ARGO_NAMESPACE"; kubectl auth can-i patch secret/unrelated -n "$ARGO_NAMESPACE"`.


  ### Beabsichtigte Git-Quelle auswählen {#delivery-board-git-source}


  Die Application board wählt nicht das gelieferte Repository, den relativen Pfad manifests und Revision main oder ihre Definition war nicht lesbar; eine veraltete oder geänderte Quelle kann eine andere Publikation abgleichen.  `kubectl get application board -o json`.


  ### Übernahme des veröffentlichten Releases beobachten {#delivery-board-release-adoption}


  Die Application board ist nicht Synced und Healthy bei release-commit oder ihr Status konnte nicht gelesen werden; korrigierte Zugangsdaten benötigen möglicherweise noch refresh und Abgleich oder ausgewähltes Release und beobachtete Revision weichen ab.  `cat release-commit; kubectl get application board -o json`.


  ### Rollout der bereitgestellten Workload abschließen {#delivery-board-workload-rollout}


  Das Deployment board hat den Rollout nicht innerhalb von 3 Sekunden abgeschlossen; die Git-Bereitstellung hat die Workload möglicherweise noch nicht erzeugt, Pods sind noch nicht verfügbar oder die API-Beobachtung schlug fehl.  `kubectl rollout status deployment/board --timeout=10s`.


  ### Service-Antwort für Verbraucher beobachten {#delivery-board-service-response}


  Der Service-Pfad von board lieferte nicht north-61 oder exec/HTTP schlug fehl; eine noch nicht bereitgestellte Workload, falsches Service-Routing oder veralteter Inhalt verhindert die beabsichtigte Publikation beim Verbraucher.  `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080`.



  ### Nur freigegebenen obsolete Digest auswählen {#retention-approved-obsolete-selection}


  Der Retention-Plan wählt nicht ausschließlich den geschützten obsolete Digest oder ist unlesbar; der gelieferte Plan wählt rollback und die Auswahl nach veränderlichem Tag oder bearbeitetem Katalog kann ein geschütztes Release treffen.  `cat retention.json release-catalog.json`.


  ### Erhaltene Manifeste und veröffentlichte Aliase {#retention-original-registry-and-aliases}


  Die ursprüngliche Registry bestätigte Manifestzustände und verbleibende Aliase nicht; obsolete kann verbleiben, ein geschützter Digest fehlen oder current noch auf rollback zeigen, während geänderte Gegenstelle, Zugangsdaten, CA-Vertrauen, Digest-Header oder Beobachtungsfehler dies ebenfalls erklären. Der gelieferte current Tag wurde nach Erfassung des Katalogs auf das rollback Image gepusht. Nur obsolete zu löschen korrigiert den Alias nicht. Prüfen Sie 200 für geschützte current/rollback Manifeste, 404 für obsolete, current auf freigegebenem current Digest und Tag 1 auf rollback. Verwenden Sie ursprünglichen Endpoint/Konto/CA mit geprüftem TLS, ohne Redirect-/Proxy-Ersatz sowie passendem Body-Digest und Docker-Content-Digest. Ein lokaler Tag benötigt push zur Remote-Aktualisierung; Manifestlöschung belegt keine Blob-Garbage-Collection. `cat release-catalog.json registry-source.json; cat retention.json`.



  ### Ursache und Beobachtung (068, git_source) {#health-application-git-source}


  Application wählt möglicherweise ein anderes Repository, einen anderen Branch oder Manifestordner; vergleichen Sie source mit platform.env und geliefertem manifests. Das gelieferte Setup bedient ein erzeugtes Verzeichnis und behält Readiness-Port 9090. Die Lösung liefert Veröffentlichungsdateien über Git, pusht eine neue Nachfolgerevision und gleicht vorhandene Objekte ab. Beobachten Sie aus ~/quest nach Laden von platform.env.


  ```bash

  kubectl get application board -o json | jq .spec.source

  ```


  ### Ursache und Beobachtung (068, git_health) {#health-synced-revision-and-automation}


  Das Release ist möglicherweise noch nicht gesund oder synchronisiert, oder selfHeal/prune sind deaktiviert; vergleichen Sie Application Status, release-commit und Automatisierung. Das gelieferte Setup bedient ein erzeugtes Verzeichnis und behält Readiness-Port 9090. Die Lösung liefert Veröffentlichungsdateien über Git, pusht eine neue Nachfolgerevision und gleicht vorhandene Objekte ab. Beobachten Sie aus ~/quest nach Laden von platform.env.


  ```bash

  kubectl get application board -o json | jq "{status:.status,automated:.spec.syncPolicy.automated}"

  ```


  ### Ursache und Beobachtung (068, git_rollout) {#health-git-declared-readiness}


