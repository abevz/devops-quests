heading: Восстановление приватного реестра и GitOps
text: '# Восстановление приватного реестра и GitOps


  ## Разделяйте границы


  Доступность registry, доверие транспорту, идентичность источника и принятие данных потребителем — разные наблюдения. Работайте только в одноразовой игровой среде. Сопоставляйте выданные контракты источника с живым API; замороженные записи сохраняют исходную доверенную сторону. Квитанция управления описывает действие агента, а не постоянную доступность, авторизацию или принятие данных.


  ## Потребители приватных образов {#private-image-consumers}


  Клиент workstation и kubelet хранят учётные данные независимо. Успешный аутентифицированный запрос не обновляет Kubernetes pull Secret в namespace. Secret задаёт учётные данные registry, но не устанавливает CA в runtime узла. Сохраните исходный endpoint, доверие сертификату, неизменяемый образ, идентичность контроллера и объект учётных данных.


  События pod различают ошибки соединения, сертификата, авторизации и отсутствующего манифеста. Always управляет разрешением и получением образа; кеш образа и Ready-контейнер не доказывают пригодность сохранённых учётных данных для следующей попытки. Приватно сопоставьте Secret с утверждённой идентичностью, затем проверьте digest работающего образа и ссылки принадлежащих контроллеру pod.


  Ниже общий пример обновления существующего разрешённого Secret. Сначала выберите исходный объект и выданную доверенную сторону. Учётные данные не выводятся; base64 — кодирование, а не шифрование. Нагрузка должна ссылаться на нужный объект.


  ```bash

  set -euo pipefail

  set +x

  : "${DQ_PULL_SECRET:?select the existing authorized Secret}"

  : "${REGISTRY:?select the approved registry endpoint}"

  : "${REGISTRY_USER:?select the supplied registry identity}"

  : "${REGISTRY_PASSWORD:?load the private supplied credential}"

  export DQ_PULL_SECRET REGISTRY REGISTRY_USER REGISTRY_PASSWORD

  before=$(kubectl get secret "$DQ_PULL_SECRET" -o jsonpath=''{.metadata.uid}'')

  python3 -I - <<''PRIVATE_AUTH'' | kubectl apply -f - >/dev/null

  import base64,json,os

  auth=base64.b64encode((os.environ[''REGISTRY_USER'']+'':''+os.environ[''REGISTRY_PASSWORD'']).encode()).decode()

  config={''auths'':{os.environ[''REGISTRY'']:{''auth'':auth}}}

  secret={''apiVersion'':''v1'',''kind'':''Secret'',''metadata'':{''name'':os.environ[''DQ_PULL_SECRET'']},

  ''type'':''kubernetes.io/dockerconfigjson'',''data'':{''.dockerconfigjson'':base64.b64encode(json.dumps(config).encode()).decode()}}

  print(json.dumps(secret))

  PRIVATE_AUTH

  test "$(kubectl get secret "$DQ_PULL_SECRET" -o jsonpath=''{.metadata.uid}'')" = "$before"

  ```


  ## Хранение и изменяемые ссылки


  Тег указывает на манифест; digest манифеста определяет точные байты. Локальный тег Docker не меняет удалённый registry до push манифеста. Сопоставьте перечень тегов, ответы API и каталог утверждённых digest. При чтении манифеста и Docker-Content-Digest учитывайте типы содержимого.


  Постройте хранение вокруг защищённых идентичностей манифестов. Проверьте план до DELETE и доступность защищённых манифестов после него. Теги сохраняемых релизов также должны указывать на нужные данные: сохранение digest не сохраняет изменяемую ссылку автоматически. Удаление манифеста и очистка неиспользуемых blob — отдельные операции. Не подменяйте восстановление удалением тома, отключением TLS или другим registry.


  ## События и согласование


  Webhook репозитория связывает событие источника с приватным приёмником. Сопоставьте приёмник, тип события, репозиторий, ветку и подпись без вывода общего секрета. Приём подписанного события отличается от периодического опроса и успешного согласования источника. Используйте результат доставки отправителя вместе с аутентифицированным наблюдением приёмника.


  Application связывает репозиторий, путь, ревизию, проект и назначение. Synced описывает сравнение с источником, Healthy — здоровье ресурсов. Ни один статус не доказывает содержимое ответа приложения. Сопоставьте ревизию, ожидаемые данные, объект Kubernetes и реальный ответ, сохраняя корректную границу доступа.


  ## Публикация и принятие


  Смонтированный ConfigMap может обновить проецируемые файлы, пока приложение продолжает отдавать копию, сделанную при запуске. Для принятия данных может понадобиться поддерживаемое обновление или rollout. Сохраните исходный контроллер и программу pod; сопоставляйте каждый активный принадлежащий ему pod с источником и HTTP-ответом. Новый здоровый объект не сохраняет исходную идентичность.


  В app-of-apps родитель согласует дочерний Application, а тот — нагрузку. Прослеживайте источник и владельца на каждом слое. Генератор ApplicationSet передаёт параметры шаблону; проверяйте сгенерированные объекты вместе с ним. Прямое изменение дочернего объекта контроллер может перезаписать. Сохраните доверие репозитория, владельцев, namespace и публикацию при распространении.


  Дочерний Application может применить корректные манифесты и при этом выбрать устаревшую публикацию. Сопоставьте смонтированный источник с ответом HTTP. Для флота сравните путь и целевую ссылку каждого сгенерированного Application с разрешённым коммитом. Разные ветки могут временно указывать на один коммит, поэтому совпадение ревизии само по себе не подтверждает источник.


  Справочники: [API registry](https://distribution.github.io/distribution/spec/api/), [приватные образы](https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/), [webhook Argo CD](https://argo-cd.readthedocs.io/en/stable/operator-manual/webhook/), [принятие ConfigMap](https://kubernetes.io/docs/tutorials/configuration/updating-configuration-via-a-configmap/).


  ### Входные данные проверки Git {#git-environment}


  Проверка Git остановилась до чтения репозитория: platform.env может отсутствовать, быть недоступен или завершаться ошибкой при загрузке. Не удалось прочитать закоммиченные уведомления: platform.env, репозиторий, Git или Python могли быть недоступны до проверки отдельных ссылок. Работайте из ~/quest и восстановите выданный platform.env, если он удалён; загрузка файла должна пройти до проверки Git. Fallback также охватывает отсутствие Python и сбой запуска Git.


  ### Получение веток доставки {#git-fetch}


  Не удалось получить main и release-candidate: у origin может быть неверный URL, отсутствовать доступ или одна из веток. `git -C repository ls-remote --heads origin main release-candidate`.


  ### Текущая ветка и рабочее дерево {#git-worktree}


  Текущая ветка не main или недоступна: репозиторий мог остаться на release-candidate или в состоянии detached HEAD. В рабочем дереве есть изменения или неотслеживаемые файлы: правки могли остаться без коммита либо сохранились временные файлы. `git -C repository status --short --branch`.


  ### Уведомление в объектах Git {#git-committed-notice}


  origin/main:notice.txt недоступен или отличается от north-41: main мог не попасть на сервер либо локальная ссылка на удалённую ветку устарела. HEAD:notice.txt недоступен или отличается от north-41: коммит кандидата мог не попасть в локальный main, даже если рабочий файл изменён. `git -C repository show HEAD:notice.txt; git -C repository show origin/main:notice.txt`.


  ### Опубликованный коммит и история {#git-publication-history}


  Базовый коммит отсутствует, некорректен или не является предком origin/main: опубликованная история могла быть заменена вместо продолжения. HEAD некорректен или отличается от origin/main: локальный коммит мог остаться без push либо ссылка на удалённую ветку ещё не обновлена. `git -C repository rev-parse HEAD origin/main; git -C repository merge-base --is-ancestor "$(cat baseline-commit)" origin/main`.


  ### Входные данные проверки приватной нагрузки {#registry-observation}


  Проверка реплик остановилась до чтения board: platform.env может отсутствовать, быть недоступен или завершаться ошибкой при загрузке. Не удалось проверить приватную нагрузку: переменные окружения, JSON API, цепочка владельцев Deployment или единственный контейнер worker могут отсутствовать либо быть некорректны. Проверка credentials остановилась до подробной диагностики: platform.env, переменные реестра или Python могут быть недоступны. Загрузите platform.env, не выводя пароли. Проверьте Deployment board, ReplicaSet и Pod в пространстве bay: активные Pod не завершены, не удаляются и принадлежат Deployment через управляющий ReplicaSet по UID. Отсутствующие или некорректные worker и имена pull Secret также могут прервать подробные проверки.


  ### Приватный образ в активных Pod {#registry-pod-contract}


  Образ worker в board или активных Pod отличается от PRIVATE_IMAGE: шаблон мог быть изменён либо старый ReplicaSet ещё использует другой образ. У worker в board или активном Pod не задано Always: настройки кэша образов либо Pod старого шаблона могут обходить новое скачивание из реестра. Нет активного Pod board либо его фактические pull Secrets отличаются от единственного registry-pull: шаблон или ServiceAccount могли добавить либо пропустить Secret. Сравните шаблон Deployment и его текущие Pod. Изменение шаблона не изменяет существующий Pod: его должен заменить новый rollout. ServiceAccount может добавить фактические imagePullSecrets при создании Pod, поэтому проверяйте спецификации Pod вместе с board.yaml.


  ### Желаемое число приватных потребителей {#registry-replicas}


  Желаемое число реплик не равно 1 либо board недоступен: уменьшение числа реплик не исправляет аутентификацию приватного образа. `kubectl get deployment board -o jsonpath=''{.spec.replicas}''`.


  ### Документ учётных данных Docker {#registry-credential-document}


  У registry-pull нет поддерживаемого типа Docker credentials: обычный Secret либо отсутствующий или недоступный тип не задаёт учётные данные реестра. Документ Docker credentials не декодируется: нужный ключ data, base64, JSON или уникальность полей JSON могут быть нарушены. Тип kubernetes.io/dockerconfigjson требует data[".dockerconfigjson"] с base64 JSON {"auths":{...}}; kubernetes.io/dockercfg требует data[".dockercfg"] с самой картой реестров. Повторяющиеся ключи JSON отклоняются. Проверяйте структуру без вывода значений credentials.


  ### Запись реестра и обновлённые credentials {#registry-credential-auth}


  Данные аутентификации недоступны или непригодны: проверьте точный ключ реестра, base64 auth с двоеточием либо строковые поля username/password. Декодированные учётные данные отличаются от platform.env: registry-pull мог сохранить старый пароль либо данные другого пользователя. Ключ записи должен точно совпадать с REGISTRY. Непустой auth имеет приоритет над username/password и должен декодироваться в выданные имя пользователя, двоеточие и пароль; добавление отдельных полей не исправляет старый auth. Обновление Secret само по себе не доказывает новое скачивание: отдельно проверьте rollout и HTTP.


  ### Готовность и HTTP приватного потребителя {#registry-consumer-health}


  board не завершил rollout за 3 секунды: отклонённые credentials реестра, задержка скачивания или сбой worker могут блокировать готовность. worker не вернул north-42 на localhost:8080: он мог ещё не запуститься, exec мог завершиться ошибкой либо команда HTTP или содержимое изменены. `kubectl describe pods; kubectl rollout status deployment/board --timeout=10s`.


  ### Источник и назначение Application {#argo-source-contract}


  Источник или назначение Application не соответствуют выданному релизу либо данные недоступны: начальный путь retired не указывает на manifests в main. `kubectl get application station -o jsonpath=''{.spec}''; cat application.yaml repository/manifests/board.yaml`. Проверьте project station, выданный GIT_URL, targetRevision main, относительный каталог manifests и пространство bay. Локальный кластер задаётся либо server https://kubernetes.default.svc без name, либо name in-cluster без server. Абсолютные пути и переходы к родительскому каталогу не задают требуемый каталог.


  ### Наблюдаемый коммит, синхронизация и готовность {#argo-observed-revision}


  Не подтверждены Synced и Healthy на коммите удалённого main: согласование могут блокировать путь источника, доступ к репозиторию, неготовые ресурсы или недоступная удалённая ссылка. `git -C repository ls-remote origin refs/heads/main; kubectl get application station -o jsonpath=''{.status}''; kubectl describe application station`. Загрузка platform.env или запуск Git, kubectl либо jq также могли завершиться ошибкой до чтения состояния.


  ### Rollout и ответ потребителя {#argo-consumer-health}


  Rollout board завершился ошибкой или превысил 3 секунды: Argo мог ещё не применить манифесты либо worker остаётся недоступен. Ответ worker отличается от north-43 либо exec завершился ошибкой: управляемая Git нагрузка может отсутствовать, быть неготовой или выдавать изменённое содержимое. `kubectl rollout status deployment/board --timeout=10s; kubectl exec deployment/board -c worker -- wget -qO- http://127.0.0.1:8080`.


  ### Наблюдение нужного digest образа {#private-digest-observation}


  Не подтверждены нужный приватный образ и готовый Pod с тем же digest: parcel:stable мог остаться на другом образе, текущий worker ещё не готов с нужным digest либо окружение или API недоступны. Сравните intended из release-catalog.txt с шаблоном board и текущим готовым worker, принадлежащим Deployment. PRIVATE_IMAGE должен использовать нужный digest sha256, а наблюдаемый imageID — совпадать с ним. Начальный parcel:stable собран отдельно с другой меткой, но выдаёт тот же HTTP-ответ, поэтому HTTP сам по себе не доказывает идентичность. JSON API, переменные окружения и идентичности worker и контроллера должны быть доступны.


  ### Фактические настройки скачивания у текущих Pod {#private-consumer-pull-contract}


  Не подтверждены Always и единственный registry-pull у активных Pod board: причиной могут быть старые шаблоны Pod, фактические ссылки pull Secret, отсутствие текущих Pod либо недоступные данные окружения или API. Проверьте шаблон Deployment и все текущие Pod, принадлежащие ему через управляющие ReplicaSet. У worker шаблона и каждого текущего worker нужен Always; фактический pull Secret текущих Pod — только registry-pull. Различия могут объясняться старыми шаблонами и ServiceAccount. Это условие наблюдает политику скачивания и имена Secret. При сбое скачивания отдельно проверьте аутентификацию registry-pull.


  ### Готовность после закрепления образа {#private-digest-readiness}


  Deployment board не завершил rollout за 3 секунды: новый образ может ещё скачиваться, credentials или планирование блокируют запуск либо наблюдение завершилось ошибкой. `kubectl describe pods; kubectl rollout status deployment/board --timeout=10s`.


  ### HTTP отдельно от идентичности образа {#private-digest-http}


  worker не вернул north-49 на localhost:8080 либо exec завершился ошибкой: Pod может быть неготов или HTTP-команда и содержимое изменены даже при верном объявленном образе. `kubectl exec deployment/board -c worker -- wget -qO- http://127.0.0.1:8080`.



  ### Сохранение исходного Secret репозитория {#delivery-original-secret-identity}


  UID Secret репозитория изменился: пересоздание station-repository сохраняет имя, но теряет исходный объект учётных данных из записи setup.  `source platform.env; kubectl -n "$ARGO_NAMESPACE" get secret station-repository -o jsonpath=''{.metadata.uid}''`.


  ### Идентичность репозитория в Secret {#delivery-secret-repository-binding}


  Исходный Secret больше не задаёт выданный Git-репозиторий и аккаунт как учётные данные Argo: устаревший URL, другие username/type или отсутствующая метка repository мешают использованию.  `cat delivery-access.json`.


  ### Восстановление одобренного пароля репозитория {#delivery-approved-secret-password}


  Пароль Secret не совпадает с защищённым одобренным значением: выданный устаревший пароль или неполное исправление учётных данных мешают Argo войти в исходный репозиторий.  `cat delivery-access.json`.


  ### Сохранение исходного Application {#delivery-original-application-identity}


  UID Application board изменился: удаление и пересоздание заменяет исходную идентичность доставки, даже если имя и манифесты остались прежними.  `kubectl get application board -o jsonpath=''{.metadata.uid}''`.


  ### Приватная конфигурация Git с учётными данными {#delivery-private-git-configuration}


  Проверяемая конфигурация Git содержит пароль или его Basic-кодирование и разрешает доступ группе либо остальным: сохранение исправленного заголовка в общедоступном файле раскрывает рабочие учётные данные. Проверка читает ~/.gitconfig и repository/.git/config, если они содержат текущий пароль Secret или его Basic-кодирование. У таких файлов не должно быть битов прав группы и остальных; для конфигурации без этих байтов условие не требует такого режима. Проверяйте права без вывода учётных данных. `stat -c "%a %n" ~/.gitconfig repository/.git/config`.


  ### Прямой доступ к исходному репозиторию {#delivery-direct-git-authority}


  Git разрешает выданный URL в другой адрес или путь: переписывание URL может направлять workstation в другой репозиторий, даже если ветка случайно совпадает. Разрешённый URL сохраняет выданные схему, hostname, порт и путь без конечного слэша; встроенная аутентификация не меняет сравнение. Query и fragment делают наблюдение некорректным. Совпадение main в другом репозитории не доказывает прямой доступ к исходному. `git -C repository config --show-origin --name-only --get-regexp "url.*"`.


  ### Аутентификация и наблюдение удалённой main {#delivery-authenticated-remote-main}


  Исходный репозиторий недоступен для запроса либо его main отличается от замороженного выпуска: причиной могут быть устаревший заголовок Authorization на workstation, отсутствие доступа или другая удалённая публикация.  `source platform.env; git -C repository ls-remote "$GIT_URL" refs/heads/main`.


  ### Наблюдение доступа в пределах лимита {#delivery-access-observation-budget}


  Наблюдение Git или Kubernetes превысило лимит команды либо общий срок: медленные API, сеть или endpoint аутентификации мешают завершить все сравнения доступа вовремя.  `kubectl --request-timeout=2s get application board -o json`.


  ### Читаемые данные доступа и объекты API {#delivery-access-observation-inputs}


  Не удалось наблюдать доступ доставки: причиной могут быть отсутствующие защищённая запись или объекты, некорректный JSON и кодирование учётных данных, нечитаемая конфигурация Git или ошибки API.  `cat delivery-access.json; kubectl get application board -o json`.


  ### Условие пароля Secret и запуск наблюдения {#delivery-password-gate-and-startup}


  Legacy-сравнение пароля Secret не пройдено либо проверка остановилась до именованного маркера: причиной могут быть неисправленный пароль, изменённое ожидание в platform.env или недоступные данные окружения и Python.  `test -r platform.env; command -v python3`.


  ### Узкое право исправить один Secret {#delivery-scoped-secret-permissions}


  Нужный узкий доступ к Secret не подтверждён: причиной могут быть отсутствие patch для station-repository, другой namespace, лишние права list и изменения постороннего Secret либо недоступные platform.env и API.  `source platform.env; kubectl auth can-i patch secret/station-repository -n "$ARGO_NAMESPACE"; kubectl auth can-i list secrets -n "$ARGO_NAMESPACE"; kubectl auth can-i patch secret/unrelated -n "$ARGO_NAMESPACE"`.


  ### Выбор нужного источника Git {#delivery-board-git-source}


  Application board не выбирает выданный репозиторий, относительный путь manifests и ревизию main либо его описание не прочитано: устаревший или изменённый источник может применять другую публикацию.  `kubectl get application board -o json`.


  ### Наблюдение принятия опубликованного выпуска {#delivery-board-release-adoption}


  Application board не Synced и Healthy на release-commit либо его статус не прочитан: исправленные учётные данные ещё требуют refresh и согласования либо выбранный выпуск отличается от наблюдаемой ревизии.  `cat release-commit; kubectl get application board -o json`.


  ### Завершение rollout доставленной нагрузки {#delivery-board-workload-rollout}


  Deployment board не завершил rollout за 3 секунды: доставка Git ещё могла не создать нагрузку, Pod могут быть недоступны либо наблюдение API завершилось ошибкой.  `kubectl rollout status deployment/board --timeout=10s`.


  ### Наблюдение ответа Service потребителю {#delivery-board-service-response}


  Путь Service board не вернул north-61 либо exec и HTTP завершились ошибкой: недоставленная нагрузка, неверная маршрутизация Service или старое содержимое мешают доставке публикации потребителю.  `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080`.



  ### Выбор только одобренного obsolete digest {#retention-approved-obsolete-selection}


  План retention не выбирает только замороженный obsolete digest либо не читается: выданный план выбирает rollback, а выбор по изменяемому тегу или рабочему каталогу может затронуть защищённый выпуск.  `cat retention.json release-catalog.json`.


  ### Сохранённые манифесты и опубликованные ссылки {#retention-original-registry-and-aliases}


  Исходный registry не подтвердил нужные состояния манифестов и ссылки: obsolete ещё доступен, защищённый digest отсутствует или current всё ещё указывает на rollback; изменённые authority, учётные данные, доверие CA, заголовки digest или ошибки наблюдения также могут быть причиной. Выданный тег current опубликован на rollback после записи каталога. Одного удаления obsolete недостаточно для исправления ссылки. Проверьте 200 для замороженных current и rollback, 404 для obsolete, тег current на одобренный current digest и тег 1 на rollback. Используйте исходные endpoint, аккаунт и CA с проверкой TLS без подмены redirect и proxy, сверяя digest тела и Docker-Content-Digest. Локальный тег требует push для удалённой ссылки; удаление манифеста не доказывает сборку мусора blobs. `cat release-catalog.json registry-source.json; cat retention.json`.



