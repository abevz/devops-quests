  ### Исправление адреса существующего hook {#hook-existing-receiver-configuration}


  Выданный hook указывает на устаревший URL получателя; сравните существующий hook с зафиксированным адресом, событием push в JSON и веткой main. Ошибки API или окружения также мешают проверке. Setup уже отправляет одобренную публикацию, но существующий hook указывает устаревший URL. Исправьте исходный hook и доставьте принятое событие. Сервер копирует смонтированный вход только при старте; новые Pod через rollout допустимы при сохранении исходного controller и спецификации template.  `curl -fsS -u "$GIT_USER:$GIT_PASSWORD" "${GIT_URL%/rail/station.git}/api/v1/repos/rail/station/hooks/$(cat /run/dq/facts/0/hook-id)" | jq ''{active,type,url:.config.url,content_type:.config.content_type,events,branch_filter}''`.


  ### Выпуск уже опубликован {#hook-already-published-descendant-revision}


  Setup уже опубликовал целевого потомка; ошибка fetch, несовпадающий release-commit или потерянный предок нарушают проверку. Сравните существующие записи с origin/main до создания нового коммита. Setup уже отправляет одобренную публикацию, но существующий hook указывает устаревший URL. Исправьте исходный hook и доставьте принятое событие. Сервер копирует смонтированный вход только при старте; новые Pod через rollout допустимы при сохранении исходного controller и спецификации template.  `git -C repository fetch origin main; git -C repository log --oneline -3 origin/main; cat release-commit`.


  ### Сохранение приватного источника Git {#hook-application-private-source}


  Application может выбирать другой репозиторий, ветку или каталог; сохраните выданный приватный источник Git и нормализованный путь manifests. Setup уже отправляет одобренную публикацию, но существующий hook указывает устаревший URL. Исправьте исходный hook и доставьте принятое событие. Сервер копирует смонтированный вход только при старте; новые Pod через rollout допустимы при сохранении исходного controller и спецификации template.  `kubectl get application board -o json | jq .spec.source`.


  ### Синхронизация целевой ревизии {#hook-application-reconciled-target}


  Целевая ревизия могла ещё не синхронизироваться либо Application остаётся нездоровым; сравните sync status и revision с release-commit после исправления доставки события. Setup уже отправляет одобренную публикацию, но существующий hook указывает устаревший URL. Исправьте исходный hook и доставьте принятое событие. Сервер копирует смонтированный вход только при старте; новые Pod через rollout допустимы при сохранении исходного controller и спецификации template.  `kubectl get application board -o json | jq .status`.


  ### Готовые Pod при rollout {#hook-current-rollout-readiness}


  Текущие Pod могут быть не готовы при принятии данных или после rollout; проверьте events и rollout status, сохраняя исходный Deployment и спецификацию pod template. Setup уже отправляет одобренную публикацию, но существующий hook указывает устаревший URL. Исправьте исходный hook и доставьте принятое событие. Сервер копирует смонтированный вход только при старте; новые Pod через rollout допустимы при сохранении исходного controller и спецификации template.  `kubectl rollout status deployment/board --timeout=3s`.


  ### Принятие публикации новыми Pod {#hook-configmap-adoption-in-current-pod}


  Выданный сервер копирует notice из ConfigMap только при старте: синхронизация оставляет старый HTTP-ответ до новых Pod через rollout исходного Deployment. Замена идентичностей, изменение источника/template, неготовый Pod, неверный HTTP-ответ или ошибки наблюдения также дают сбой. Setup уже отправляет одобренную публикацию, но существующий hook указывает устаревший URL. Исправьте исходный hook и доставьте принятое событие. Сервер копирует смонтированный вход только при старте; новые Pod через rollout допустимы при сохранении исходного controller и спецификации template. Для webhook сохраните исходные UID/spec Application, UID/selector/одну реплику/полный template.spec Deployment и UID/все одобренные data ConfigMap. Единственный текущий принадлежащий Pod должен быть готов с исходными неизменяемым image, command/args и read-only mounts и выдавать notice. `kubectl get configmap board-publication -o json | jq .data; kubectl get pods -o wide`.


  ### Получатель принимает нужное событие {#hook-server-owned-accepted-event-receipt}


  Получатель мог не принять нужный push из-за неверного URL, secret или фильтра событий hook; проверьте принятие сервером и повторите доставку. Один HTTP-запрос не создаёт защищённое подтверждение принятия. Setup уже отправляет одобренную публикацию, но существующий hook указывает устаревший URL. Исправьте исходный hook и доставьте принятое событие. Сервер копирует смонтированный вход только при старте; новые Pod через rollout допустимы при сохранении исходного controller и спецификации template.  `jq ''{repo,branch,authenticated}'' /run/dq/observations/webhook.json`.



  ### Запуск закреплённого registry {#private-registry-original-start-interface}


  Исходный registry остановлен; подайте поддерживаемый запрос action:start и дождитесь обработки при опросе целей. Отсутствие/неверная форма запроса, ошибка TLS-trust или авторизации оставляют исходный HTTPS API недоступным. Выданный registry остановлен, существующий pull Secret содержит старые credentials, а исходный Deployment имеет ноль реплик. Сначала используйте описанный start-интерфейс при опросе целей, затем обновите существующий Secret и масштабируйте исходный Deployment до одной реплики. Сохраните источник, trust и pod specification. control/README.md описывает обычный UTF-8 registry-repair.json до 4096 байт с декодированным объектом ровно action:start. Опрос запускает только закреплённый существующий сервис. Ответ агента idle/rejected/started не гарантирует успешный авторизованный API. `jq . registry-repair.json; jq . registry-agent-status.json`.


  ### Исходные authority, trust и credential {#private-registry-original-authority-and-pull-credential}


  Выданный pull Secret содержит старый пароль; исправьте credentials без пересоздания UID, сохраняя исходные registry credentials и CA. Неготовый image, другой источник/trust, ошибка проверки манифеста или наблюдения также дают fallback. Выданный registry остановлен, существующий pull Secret содержит старые credentials, а исходный Deployment имеет ноль реплик. Сначала используйте описанный start-интерфейс при опросе целей, затем обновите существующий Secret и масштабируйте исходный Deployment до одной реплики. Сохраните источник, trust и pod specification. Сравните исходные endpoint/user/password hash и точные байты CA; наблюдайте одобренный манифест через проверенный TLS без proxy/redirect, с ограниченным body и совпадающими вычисленным/header digest. Обновляйте существующий UID Secret с точным registry-entry; допустимы Docker config JSON либо dockercfg и auth либо username/password. Не выводите credentials. Ранняя проверка ready-image/pull-reference и проверка источника/credentials независимы; их ошибки и таймауты дают общий fallback. `kubectl get secret registry-pull -o json | jq ''{uid:.metadata.uid,type,keys:(.data|keys)}''`.


  ### Объявленный image и живой pull-результат {#private-registry-declared-always-pull-and-ready-digest}


  Объявленный image, политика Always или ссылка registry-pull могут отличаться либо готовый Pod не сообщает ожидаемый digest; сохраните выданную pull policy и проверьте живой результат image. Выданный registry остановлен, существующий pull Secret содержит старые credentials, а исходный Deployment имеет ноль реплик. Сначала используйте описанный start-интерфейс при опросе целей, затем обновите существующий Secret и масштабируйте исходный Deployment до одной реплики. Сохраните источник, trust и pod specification.  `kubectl get deployment board -o json | jq ''{containers:.spec.template.spec.containers,pull:.spec.template.spec.imagePullSecrets}''`.


  ### Один готовый исходный потребитель {#private-registry-original-controller-and-one-ready-consumer}


  Deployment начинает с нуля реплик; масштабируйте исходный controller до одной после исправления Secret. Изменённые UID/template, неготовый или лишний принадлежащий Pod, другая pull-ссылка и ошибки rollout/API также нарушают проверку. Выданный registry остановлен, существующий pull Secret содержит старые credentials, а исходный Deployment имеет ноль реплик. Сначала используйте описанный start-интерфейс при опросе целей, затем обновите существующий Secret и масштабируйте исходный Deployment до одной реплики. Сохраните источник, trust и pod specification.  `kubectl get deployment board -o json | jq ''{uid:.metadata.uid,replicas:.spec.replicas,template:.spec.template.spec}''; kubectl get pods -o wide`.


  ### Реальный HTTP-ответ потребителя {#private-registry-running-consumer-response}


  Исходный потребитель может оставаться недоступным после image pull либо выдавать другой маршрут; проверьте rollout и реальный HTTP-ответ worker, а не только готовность registry. Выданный registry остановлен, существующий pull Secret содержит старые credentials, а исходный Deployment имеет ноль реплик. Сначала используйте описанный start-интерфейс при опросе целей, затем обновите существующий Secret и масштабируйте исходный Deployment до одной реплики. Сохраните источник, trust и pod specification.  `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://127.0.0.1:8080`.



  ### Чтение выданных входных данных {#private-git-provided-input-startup}


  Выданный platform.env может отсутствовать, не читаться или содержать ошибку; наблюдение также может оборваться до именованного результата. Проверьте синтаксис и нужные переменные без вывода credentials. Fallback появляется только при сбое группы без её подробного маркера.  `test -r platform.env; bash -n platform.env`.


  ### Репозиторий источника {#private-git-source-repository}


  Приложение может ссылаться на другой репозиторий, либо API-объект не прочитан; сравните repoURL с выданным GIT_URL.  `kubectl get application board -o json | jq .spec.source.repoURL`.


  ### Путь каталога манифестов {#private-git-manifest-path}


  Setup оставляет путь retired; источник должен разрешаться в относительный каталог manifests без абсолютного пути и перехода к родителю.  `kubectl get application board -o json | jq .spec.source.path`.


  ### Отслеживаемая ветка {#private-git-tracked-branch}


  Приложение может отслеживать другую ссылку либо не иметь читаемого источника; targetRevision выбирает main.  `kubectl get application board -o json | jq .spec.source.targetRevision`.


  ### Наблюдение согласования {#private-git-reconciliation}


  Неверный путь, неопубликованное изменение или ошибка согласования могут оставить sync.status отличным от Synced; изучите conditions и revision приложения.  `kubectl get application board -o json | jq .status`.


  ### Ревизия текущего этапа {#private-git-stage-revision}


  Ожидаемый commit может отсутствовать, а приложение показывать старую revision: первый этап использует зафиксированный baseline, второй — опубликованный рабочий release-commit. Одного Synced недостаточно для равенства.  `cat /run/dq/facts/0/baseline-commit release-commit; kubectl get application board -o json | jq .status.sync.revision`.


  ### Автоматическое согласование {#private-git-automated-reconciliation}


  Автоматическое согласование могло быть удалено или выключено; selfHeal нужен в обоих этапах, prune дополнительно требуется на этапе релиза.  `kubectl get application board -o json | jq .spec.syncPolicy.automated`.


  ### Готовность после публикации {#private-git-release-health}


  Приложение может быть Synced, хотя приватный image не запускается; изучите health conditions и события Pod. Healthy требуется на этапе релиза, а не при начальном исправлении пути.  `kubectl get application board -o json | jq .status.health; kubectl get pods`.


  ### Исходные требования pull {#private-git-initial-pull-contract}


  Always может отсутствовать у именованного контейнера или текущих принадлежащих ему Pod, а эффективные pull-ссылки отличаться от единственного registry-pull; ошибки API и структуры также дают secrets. Здесь нужны активные Pod, но ещё не одобренный image релиза или готовность.  `kubectl get deployment board -o json | jq .spec.template.spec; kubectl get pods -o json`.


  ### Публикация нового потомка commit {#private-git-published-descendant}


  Релиз мог остаться локальным, fetch завершиться ошибкой, release-commit указывать другой remote head, а история быть заменена. Опубликуйте нового потомка baseline в origin/main и сохраните его в release-commit; повторной публикации baseline недостаточно.  `git -C repository fetch origin main; git -C repository log --oneline -3 origin/main; cat release-commit`.


  ### Проверка опубликованного манифеста {#private-git-published-manifest}


  Опубликованный manifests/board.yaml может сохранять mutable retired image, не иметь Always или использовать другие pull-ссылки. Image именованного контейнера должен точно совпадать с зафиксированным релизом; пустой список template может наследовать registry-pull от живого ServiceAccount. Ошибки fetch, разбора и API также дают git_image.  `git -C repository show origin/main:manifests/board.yaml; jq .image /run/dq/facts/0/private-release.json`.


  ### Сравнение живого template {#private-git-live-template}


  Исправленный файл Git мог ещё не попасть в живой именованный контейнер; сравните точный зафиксированный image и Always. Ошибки API, отсутствия контейнера и структуры также дают live_image.  `kubectl get deployment board -o json | jq .spec.template.spec.containers`.


  ### Наблюдение готового приватного image {#private-git-ready-private-image}


  Rollout может блокироваться pull или readiness, либо текущий принадлежащий Pod ещё не запускает точный image с его digest в ready/running состоянии. Одного template недостаточно; ошибки API и зафиксированных входных данных также дают image_id.  `kubectl rollout status deployment/board --timeout=3s; kubectl get pods -o json | jq .items[].status.containerStatuses`.


  ### Наблюдение digest с аутентификацией {#private-git-authenticated-digest}


  Поле зафиксированного image может отсутствовать, либо запрос registry не пройти из-за endpoint, credentials, CA или доступности. Проверка запрашивает зафиксированный digest по authenticated TLS с рабочими platform.env и registry-ca.crt; хэши endpoint или credentials с исходной authority не сравниваются.  `jq .image /run/dq/facts/0/private-release.json; test -r registry-ca.crt`.


  ### Ответ Service {#private-git-service-response}


  Процесс может отдавать старый ответ либо маршрут Service не работать; реальный запрос на порт 8080 после rollout должен вернуть north-80.  `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080`.


  ### initial: запуск наблюдения {#private-git-initial-observer-startup}


  Наблюдение initial может оборваться при чтении platform.env или загрузке Python helpers до подробного результата; проверьте выданный файл и доступность dq_check. Именованные ошибки image, policy, pull или API сохраняют собственные маркеры.  `test -r platform.env; bash -n platform.env; python3 -I -c "import dq_check"`.


  ### Git: запуск наблюдения {#private-git-git-observer-startup}


  Наблюдение Git может оборваться при чтении platform.env или загрузке Python helpers до подробного результата; проверьте выданный файл и доступность dq_check. Именованные ошибки image, policy, pull или API сохраняют собственные маркеры.  `test -r platform.env; bash -n platform.env; python3 -I -c "import dq_check"`.


  ### live: запуск наблюдения {#private-git-live-observer-startup}


  Наблюдение live может оборваться при чтении platform.env или загрузке Python helpers до подробного результата; проверьте выданный файл и доступность dq_check. Именованные ошибки image, policy, pull или API сохраняют собственные маркеры.  `test -r platform.env; bash -n platform.env; python3 -I -c "import dq_check"`.


  ### ready: запуск наблюдения {#private-git-ready-observer-startup}


  Наблюдение ready может оборваться при чтении platform.env или загрузке Python helpers до подробного результата; проверьте выданный файл и доступность dq_check. Именованные ошибки image, policy, pull или API сохраняют собственные маркеры.  `test -r platform.env; bash -n platform.env; python3 -I -c "import dq_check"`.



  ### Сравнение опубликованного release head {#image-source-record-published-release-head}


  release-commit может сохранять прошлый deployment после публикации записи, либо выданный platform input или private Git fetch не проходят; сравните полученный origin/main с текущей квитанцией релиза рабочей станции.  `git -C repository fetch origin main; git -C repository rev-parse origin/main; cat release-commit`.


  ### Сохранение private Git source {#image-source-record-retained-git-source}


  Приложение могло быть перенаправлено в другой репозиторий, ветку или каталог, либо чтение входов/API не прошло; сохраните выданный Git URL, ветку main и относительный путь к manifests без перехода к родителю.  `test -r platform.env; kubectl get application board -o json | jq .spec.source`.


  ### Текущий согласованный релиз {#image-source-record-current-reconciled-release}


  Приложение может показывать старую revision, оставаться нездоровым или иметь выключенные self-healing/pruning; дождитесь Synced и Healthy на release-commit с обоими флагами true. Эти статусы сами не доказывают обновление уже смонтированного metadata-файла.  `cat release-commit; kubectl get application board -o json | jq "{automation:.spec.syncPolicy.automated,status:.status}"`.


  ### Ожидание rollout workload {#image-source-record-workload-readiness}


  Текущий rollout может ещё сходиться, либо подготовка image и готовность контейнера блокируют его; изучите существующие Pod и события, сохраняя выданный неизменяемый image приложения.  `kubectl rollout status deployment/board --timeout=3s; kubectl get pods -o wide; kubectl describe deployment board`.


  ### Доступность основного endpoint {#image-source-record-main-endpoint}


  Основной Service может быть недоступен, либо исправление metadata скрыло исходную страницу image; сохраните ответ north-91 при публикации source record. Только metadata-ответ не выполняет отдельное условие основного endpoint.  `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080`.


  ### Реальный источник image {#image-source-record-verified-source-observation}


  Отчёт может оставаться пустым или использовать deployment commit вместо реального более раннего source commit image; сравните зафиксированный image, байты registry manifest, revision metadata и Git history. Ошибки входов, registry, API или позднего чтения доставки записи также дают fallback до именованного сравнения. Зафиксированная квитанция содержит commitment нормализованного JSON с ровно image, commit и repo без копируемого ответа. Source commit отличается от release-commit, является предком origin/main и содержит выданную страницу. Реальный manifest body хэшируется в image digest; revision label config указывает тот source commit. Живой именованный image точно совпадает с отчётом, а текущий принадлежащий ready-контейнер запускает digest. Неиспользуемые credential helpers не добавляют проверки Secret data или pull policy. Это traceability-наблюдения, не подпись или доказательство доверенной сборки. `jq . provenance.json; git -C repository log --oneline -4 origin/main; kubectl get deployment board -o json | jq .spec.template.spec.containers[].image`.


  ### Публикация и принятие одной source record {#image-source-record-published-and-mounted-record}


  Опубликованный manifest или живой ConfigMap могут сохранять исходную пустую запись, либо существующий Pod хранить старый subPath-файл после изменения ConfigMap. Опубликуйте проверенный отчёт через Git и обновите потребителя до совпадения published, live и served JSON. Сбой traceability observer останавливает выполнение до delivery-сравнения. После проверки данные Git manifest, живого ConfigMap и HTTP JSON равны отчёту. Ошибки чтения до Python-сравнения дают общий traceability fallback. Существующий файл смонтирован через subPath: после публикации записи и обновления release-commit решение обновляет приложение и заменяет Pod через rollout restart для принятия файла. `git -C repository show origin/main:manifests/provenance.yaml; kubectl get configmap build-record -o json | jq .data; kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080/provenance.json`.



  ### Восстановление вперёд без стирания истории {#forward-rollback-retained-faulty-history}


  Сброс main на здоровый коммит стирает требуемое присутствие faulty-commit в истории, а старый release-commit может указывать на faulty или прежний head. Отмените ошибочную правку новым коммитом, опубликуйте дальнейшее восстановление и обновите рабочую квитанцию до полученного origin/main. Ошибка входов, fetch или команды ancestry даёт тот же маркер. `git -C repository fetch origin main; git -C repository log --oneline -5 origin/main; cat release-commit; git -C repository merge-base --is-ancestor "$(cat /run/dq/facts/0/faulty-commit)" origin/main`.


  ### Сохранение основного источника Git {#forward-rollback-retained-main-source}


  Перенаправление Application board в другой репозиторий, ветку или каталог обходит выданный источник восстановления. Сохраните выданный Git URL, main и относительный путь к manifests без перехода к родителю. Отсутствующий platform input, ошибка API или сравнения JSON дают тот же маркер. `test -r platform.env; kubectl get application board -o json | jq .spec.source`.


  ### Согласованная ревизия main {#forward-rollback-reconciled-main-revision}


  Производитель может согласовывать ошибочную ревизию, иметь нездоровую readiness или выключенные self-healing/pruning. Исправьте Git-определение и дождитесь Synced и Healthy на текущем release-commit с обоими флагами true; это ещё не доказывает принятие новой публикации независимо закреплёнными reader Applications. `cat release-commit; kubectl get application board -o json | jq "{automation:.spec.syncPolicy.automated,status:.status}"`.


  ### Rollout производителя {#forward-rollback-producer-rollout}


  Выданная ошибочная readiness probe использует 8099, хотя сервер слушает 8080, поэтому rollout блокируется даже при синхронизации Git. Исправьте Git-определение через новые коммиты и изучите rollout/events; ошибка CLI или трёхсекундный предел наблюдения тоже нарушает условие. `kubectl rollout status deployment/board --timeout=3s; kubectl describe deployment board; git -C repository show origin/main:manifests/board.yaml`.


  ### HTTP-ответ производителя {#forward-rollback-producer-http}


  Синхронизированное Application может не иметь готового endpoint Service из-за ошибочной probe либо отдавать тело не north-95. Наблюдайте реальный endpoint board из его worker после восстановления; timeout или ошибка exec/HTTP тоже нарушает исходное сравнение. `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080`.


  ### Исходные Application и Deployment {#forward-rollback-original-application-identities}


  Удаление и создание board, reader-a или reader-b сохраняет имя, но меняет зафиксированный UID Application либо Deployment. Исправляйте исходные объекты на месте; маркер идентичности указывает производителя или линию reader. Проверяется текущая идентичность, не непрерывная история. `kubectl get application,deployment -o json | jq ".items[] | {kind,name:.metadata.name,uid:.metadata.uid}"`.


  ### Новая история потребителей {#forward-rollback-forward-consumer-history}


  Полученный head может оставаться на раннем reader baseline либо производитель использовать другой репозиторий. Сохраните ancestry baseline и опубликуйте новый коммит с одобренными данными reader. Ошибка команды проверки ancestry даёт rollback_observation, а не этот маркер явного сравнения. `git -C repository log --oneline -5 origin/main; kubectl get application board -o json | jq .spec.source.repoURL`.


  ### Текущие commit pins потребителей {#forward-rollback-current-reader-commit-pins}


  Reader изначально закреплены на старом коммите, поэтому исправление производителя не меняет их ревизию. Опубликуйте одобренные manifests, закрепите каждое исходное reader Application на текущем полном Git commit, сохраните его путь, project и destination и дождитесь Synced и Healthy на этой ревизии; одного main для сравнения immutable pin недостаточно. `git -C repository rev-parse origin/main; kubectl get application reader-a reader-b -o json | jq ".items[] | {name:.metadata.name,source:.spec.source,project:.spec.project,destination:.spec.destination,status:.status}"`.


  ### Опубликованная проекция потребителей {#forward-rollback-published-reader-projection}


  Здоровый reader может исполнять исходную программу со старой публикацией. Сохраните image, command и args reader в Git, живом Deployment и каждом текущем принадлежащем Pod; завершите rollout и опубликуйте одобренный JSON ровно через одну совпадающую ConfigMap-проекцию в document root. Data Git и живого ConfigMap совпадают как полные maps, а декодированная публикация включает все одобренные значения. Допустимы эквивалентные прямые или projected ConfigMap-привязки. `git -C repository ls-tree -r --name-only origin/main -- readers; kubectl get deployment reader-a reader-b -o yaml; kubectl get configmaps -o yaml`.


  ### Публикация каждого потребителя {#forward-rollback-every-reader-publication}


  Git, живой ConfigMap и здоровый статус не доказывают принятие данных каждым reader Pod. Проверьте каждый текущий принадлежащий Pod через localhost и его Service: HTTP JSON должен включать одобренные schema, generation и route. Старому mounted-файлу может требоваться время обновления; не заменяйте сохранённую программу reader поддельным ответом. `kubectl get pods -o wide; kubectl exec deployment/reader-a -c worker -- wget -qO- -T 2 http://reader-a:8080; kubectl exec deployment/reader-b -c worker -- wget -qO- -T 2 http://reader-b:8080`.


  ### Ограниченное наблюдение rollback {#forward-rollback-bounded-rollback-observation}


  Команда Git или Kubernetes могла превысить остаток времени observer либо общий бюджет 14 секунд истёк до наблюдения обеих reader-линий. Проверьте API/Git и сходимость перед повторной проверкой; этот именованный бюджет относится к observer и не доказывает сбой конкретного предиката конфигурации. `git -C repository rev-parse origin/main; kubectl --request-timeout=2s get application,deployment,pods -o wide`.


  ### Читаемые входы rollback {#forward-rollback-readable-rollback-inputs}


  Observer мог не прочитать зафиксированный контракт, историю Git, документы Kubernetes или projected-данные reader. Пойманные ошибки CLI, некорректный JSON/YAML, недостающие поля и дубликаты опубликованных resource identities дают этот маркер; сюда же попадает ошибка команды ancestry baseline. Изучите реальные входы до правок объектов по недоступному наблюдению. `test -r /run/dq/facts/0/rollback-contract.json; git -C repository ls-tree -r --name-only origin/main -- readers; kubectl --request-timeout=2s get application,deployment -o yaml`.


  ### Здоровый контракт и ранний fallback {#forward-rollback-healthy-contract-and-early-fallback}


  Исходный health observer может отклонить desired/live ресурсы или безопасность, изменённые относительно здорового Git baseline, несовместимые liveness/startup probes, различия поведения desired/live, блокированный rollout либо отсутствие north-95. Он даёт этот fallback без более точных маркеров. Поздний сбой запуска, platform input или необработанная форма документа без имени дают тот же fallback; именованные rollback-сбои его подавляют. Сохраните ресурсы и безопасность baseline, исправляя readiness через Git. `git -C repository show "$(cat /run/dq/facts/0/healthy-commit):manifests/board.yaml"; git -C repository show origin/main:manifests/board.yaml; kubectl get deployment board -o yaml`.


  ### Неизменённые байты архива {#archived-release-untouched-archive-bytes}


  Выданный recovery-image.tar мог исчезнуть или измениться после восстановления либо зафиксированная сумма не читается. Сохраните архив и сравните SHA-256 исходных байтов с frozen receipt. Внешне похожий новый image или правка рабочего checksum не подтверждают исходные байты архива. `sha256sum recovery-image.tar; cat /run/dq/facts/0/archive.sha256`.


  ### Точные байты registry и защищённый артефакт {#archived-release-exact-registry-bytes-and-protected-artifact}


  Setup удаляет все пригодные локальные aliases релиза и manifest из registry; архив восстанавливает именно этот релиз, не новую сборку. Проверьте доверенный TLS, выданную аутентификацию, immutable manifest digest, одинаковые байты тега 1 и digest/размер каждого config/layer. Независимый protected-артефакт и его blobs тоже сохраняются. Любой сбой команды или сравнения этой registry-фазы даёт тот же маркер. `sha256sum recovery-image.tar; test -r /run/dq/facts/0/registry-ca.crt; docker image ls --digests; jq "{protected_image,protected_tag}" /run/dq/facts/0/recovery-baseline.json`.


  ### Исходные приостановленные потребители {#archived-release-original-suspended-consumers}


  Пересоздание контроллеров доставки, Service или batch-определения сохраняет имена, но меняет UID. Исправьте исходные объекты и оставьте CronJob приостановленным: ручной запуск восстановления не требует включать расписание. Отсутствующие или неверные baseline/object-документы до source-фазы тоже дают этот маркер идентичности. `kubectl get deployment,service,cronjob,application -o json | jq ".items[] | {kind,name:.metadata.name,uid:.metadata.uid,suspend:.spec.suspend}"`.


  ### Опубликованный неизменяемый источник {#archived-release-published-immutable-source}


  Восстановление registry само не обновляет Git и живого потребителя. Опубликуйте digest архивного image в существующем web Deployment, сохраните исходные source Application, project station и destination и дождитесь синхронизации текущего Git head с автоматическими self-healing/pruning. Image живого worker точно совпадает с объявленной digest-pinned ссылкой; одного изменяемого тега недостаточно. `git -C repository show origin/main:manifests/web.yaml; kubectl get application release -o json | jq "{spec,status:.status.sync}"; kubectl get deployment archive-web -o yaml`.


  ### Реальное принятие web-релиза {#archived-release-real-web-adoption}


  Web Deployment может указывать восстановленный image, пока rollout использует старые или неготовые Pod. Сохраните положительное целое число replicas, актуальное observed generation и ровно готовые текущие принадлежащие Pod с нужным image; реальный HTTP archive-web возвращает исходный archive-97. Ошибки API, exec или HTTP внутри web-фазы дают тот же маркер. `kubectl rollout status deployment/archive-web --timeout=3s; kubectl get pods -o wide; kubectl exec deployment/archive-web -c worker -- wget -qO- -T 3 http://archive-web:8080`.


  ### Реальный завершённый ручной запуск {#archived-release-real-completed-manual-execution}


  Исправление шаблона приостановленного CronJob не чинит старый прерванный Job и не создаёт успешный запуск. Оставьте расписание выключенным и создайте один новый успешный Job из исправленного шаблона с архивным image. Его полный Pod spec совпадает с шаблоном, настоящий принадлежащий worker Pod завершён с кодом 0, runtime image digest архивный, логи checked-97; принимается ровно один новый завершённый Job, старые неудачные попытки могут остаться. `kubectl get cronjob archive-scan -o yaml; kubectl get jobs,pods -o wide`.


  ### Наблюдение без правки статуса выполнения {#archived-release-observe-without-status-forgery}


  Право игрока менять status Pod или Job позволяет подделывать выполнение. Сохраните запрет обеих status patch-проверок и наблюдайте реальное завершение контейнера, image identity и логи. Ошибка наблюдения авторизации или ответ не no тоже нарушает сравнение. `kubectl auth can-i patch pods --subresource=status; kubectl auth can-i patch jobs --subresource=status`.


  ### Безымянный сбой входов потребителей {#archived-release-unlabelled-consumer-input}


  После registry-фазы могут упасть текущий Git fetch, чтение опубликованного web manifest, общего снимка Kubernetes или запуск Python/helper до именованного сравнения. Проверьте эти чтения и выданный workspace. Ошибки registry уже дают recovery_registry, пойманные identity/source/web/batch сохраняют свой маркер; fallback появляется только без них. `git -C repository fetch origin main; git -C repository show origin/main:manifests/web.yaml; kubectl get deployment,service,cronjob,job,application,pods,replicasets -o json >/dev/null`.



  ### Текущий head private Git {#credential-incident-current-private-git-head}


  Рабочий release-commit мог устареть либо не читается platform input или private Git fetch. Сравните полученный origin/main с текущей квитанцией; сама ротация credential не подтверждает использование приложением опубликованной ревизии.


  ```bash

  git -C repository fetch origin main; git -C repository rev-parse origin/main; cat release-commit

  ```


  ### Сохранённый private source {#credential-incident-retained-private-source}


  Перенаправление Application в другой репозиторий, ветку или каталог обходит выданный источник. Сохраните Git URL, main и относительный путь к manifests без перехода к родителю; ошибки platform/API/JSON тоже нарушают сравнение источника.


  ```bash

  test -r platform.env; kubectl get application board -o json | jq .spec.source

  ```


  ### Согласованная ревизия восстановления {#credential-incident-reconciled-incident-revision}


  Application может быть нездоровым из-за отсутствующих image-pull или source Secret либо показывать другую ревизию и флаги automation. После восстановления credential и публикации Secret дождитесь Synced и Healthy на release-commit с self-healing и pruning true.


  ```bash

  cat release-commit; kubectl get application board -o json | jq "{automation:.spec.syncPolicy.automated,status:.status}"

  ```


  ### Реальный ответ сервиса {#credential-incident-actual-incident-service}


  Готовая декларация или успешный credential API не доказывает ответ Service board north-99. Загрузка image, принятие source Secret или отсутствие ready endpoints блокируют запрос; timeout exec/HTTP и другое тело тоже нарушают исходное сравнение.


  ```bash

  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080

  ```


  ### Реальное принятие private image {#credential-incident-actual-private-image-adoption}


  Worker может не использовать зафиксированный image с Always либо нет текущего принадлежащего ready Pod с этим image, Always и непустым набором imagePullSecrets names. Восстановите отсутствующий registry Secret и дождитесь rollout. Observer проверяет принятие image и имена imagePullSecrets; неиспользуемые credential helpers не добавляют сравнение содержимого Secret. Ошибки входов, rollout, API, JSON и запуска дают тот же fallback.


  ```bash

  kubectl rollout status deployment/board --timeout=3s; kubectl get deployment board -o yaml; kubectl get pods -o wide

  ```


  ### Репозиторий Application {#q100-application-repository}


  Application мог ссылаться на другой Git-репозиторий. Сравните URL источника с GIT_URL из выданного окружения.


  ```bash

  kubectl get application board -o jsonpath=''{.spec.source.repoURL}''

  ```


  ### Каталог источника Application {#q100-application-directory}


  В источнике мог остаться путь к выведенному из работы каталогу. Укажите относительный путь к manifests без перехода через родительский каталог.


  ```bash

  kubectl get application board -o jsonpath=''{.spec.source.path}''

  ```


  ### Ветка Application {#q100-application-branch}


  Application мог отслеживать другую ветку или ревизию. Проверьте, что targetRevision живого объекта равна main.


  ```bash

  kubectl get application board -o jsonpath=''{.spec.source.targetRevision}''

  ```


  ### Автоматическое исправление дрейфа {#q100-application-self-heal}


  Самовосстановление могло быть выключено или не указано. Проверьте, что в действующей политике selfHeal задан как логическое true.


  ```bash

  kubectl get application board -o jsonpath=''{.spec.syncPolicy.automated.selfHeal}''

  ```


  ### Политика удаления объектов {#q100-application-pruning}


  Автоматическое удаление объектов могло быть выключено. Проверьте, что в действующей политике prune задан как логическое true.


  ```bash

  kubectl get application board -o jsonpath=''{.spec.syncPolicy.automated.prune}''

  ```


  ### Статус синхронизации Application {#q100-application-sync}


  Контроллер мог ещё видеть старый источник или неприменённую ревизию. Проверьте текущий статус синхронизации после согласования.


  ```bash

  kubectl get application board -o json | jq ''.status.sync''

  ```


  ### Запись исходной ревизии {#q100-baseline-receipt}


  Зафиксированный baseline-commit мог быть пустым или нечитаемым. Проверьте выданную запись исходной ревизии перед сравнением со статусом.


  ```bash

  test -s /run/dq/facts/0/baseline-commit

  ```


  ### Наблюдаемая исходная ревизия {#q100-application-baseline}


  На первой фазе Application может показывать другой коммит даже с верным источником. После согласования сравните sync.revision с записью baseline-commit.


  ```bash

  cat /run/dq/facts/0/baseline-commit; kubectl get application board -o jsonpath=''{.status.sync.revision}''

  ```


  ### Получение данных из приватного Git {#q100-private-git-fetch}


  Приватный remote мог стать недоступен или Git не получил доступ. Сначала успешно выполните fetch origin main, затем сравнивайте ревизии.


  ```bash

  git -C repository fetch origin main

  ```


  ### Запись текущего релиза {#q100-current-release-receipt}


  Рабочий release-commit мог быть пустым или устаревшим. Сравните его со свежим origin/main, даже если рабочая копия выглядит актуальной.


  ```bash

  git -C repository rev-parse origin/main; cat release-commit

  ```


  ### Готовность Application {#q100-application-health}


  На фазе релиза отсутствие доступа к registry или неопубликованный Secret маршрута могут мешать готовности Application. Проверьте текущие Pod и дождитесь Healthy.


  ```bash

  kubectl get application board -o jsonpath=''{.status.health.status}''; kubectl get pods -l app=board

  ```


  ### Наблюдаемая ревизия релиза {#q100-application-release}


  Контроллер мог синхронизироваться на прежнем коммите. После обновления источника сравните текущую sync.revision с рабочим release-commit.


  ```bash

  cat release-commit; kubectl get application board -o jsonpath=''{.status.sync.revision}''

  ```


  ### HTTP-ответ релиза {#q100-release-http}


  Service может возвращать прежнее значение, либо запрос не успевает завершиться. Выполните запрос из worker и сравните ответ с north-100.


  ```bash

  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080

  ```


  ### Зафиксированный образ в кластере {#q100-live-frozen-image}


  Worker в Deployment или одном из текущих Pod этого Deployment может использовать другой образ. Сравните образы с зафиксированным и проверьте доступность объектов и записи образа.


  ```bash

  kubectl get deployments,replicasets,pods -l app=board -o wide

  ```


  ### Политика загрузки образа {#q100-current-pull-policy}


  У worker может отличаться политика загрузки, или у Deployment нет текущих Pod. Проверьте Always у worker в шаблоне и во всех текущих Pod этого Deployment.


  ```bash

  kubectl get deployment board -o json | jq ''.spec.template.spec.containers[] | select(.name == "worker") | .imagePullPolicy''

  ```


  ### Ссылки на Secret для registry {#q100-current-registry-reference}


  В текущем Pod этого Deployment может отсутствовать registry-pull или быть указан лишний Secret. После rollout проверьте фактические ссылки Pod и оставьте только registry-pull.


  ```bash

  kubectl get pods -l app=board -o custom-columns=NAME:.metadata.name,PULL:.spec.imagePullSecrets[*].name

  ```


  ### Ссылка worker на Secret {#q100-live-secret-reference}


  В развёрнутом worker переменная ROUTE_SECRET могла отсутствовать, дублироваться или содержать поле value. Проверьте, что единственная запись ссылается на route-secret/value через secretKeyRef.


  ```bash

  kubectl get deployment board -o json | jq ''.spec.template.spec.containers[] | select(.name == "worker") | [.env[] | select(.name == "ROUTE_SECRET") | {name, valueFrom, hasLiteral: has("value")}]''

  ```


  ### Готовый worker на зафиксированном digest {#q100-ready-frozen-image}


  Даже при верном образе в спецификации у Deployment может не быть текущего Pod с готовым worker на нужном digest. После rollout проверьте готовность worker и его imageID.


  ```bash

  kubectl get pods -l app=board -o custom-columns=NAME:.metadata.name,READY:.status.containerStatuses[*].ready,IMAGE_ID:.status.containerStatuses[*].imageID

  ```


  ### Зафиксированный образ в Git {#q100-published-frozen-image}


  В полученном манифесте main мог отсутствовать worker Deployment board либо указан другой образ. Проверьте опубликованный worker и запись образа, в том числе при ошибках Git или YAML.


  ```bash

  git -C repository show origin/main:manifests/board.yaml | grep -E ''^ *image:''

  ```


  ### Опубликованная ссылка на Secret {#q100-published-secret-reference}


  В опубликованной записи ROUTE_SECRET могло остаться поле value или ссылка на другой ключ. У опубликованного worker должна быть одна запись с secretKeyRef на route-secret/value.


  ```bash

  git -C repository show origin/main:manifests/board.yaml | python3 -c ''import sys, yaml; d=yaml.safe_load(sys.stdin); print([(e.get("valueFrom"), "value" in e) for c in d["spec"]["template"]["spec"]["containers"] if c["name"] == "worker" for e in c.get("env", []) if e["name"] == "ROUTE_SECRET"])''

  ```


  ### Входы проверки Application {#q100-application-probe-input}


  Проверка Application может остановиться до сравнения полей, если рабочая папка или вход платформы недоступны. Проверьте каталог, выданный файл окружения и доступ к Application.


  ```bash

  pwd; test -r platform.env; kubectl get application board -o name

  ```


  ### Входы проверки Git {#q100-git-probe-input}


  Проверка Git может прерваться до сравнения ревизии или манифеста. Проверьте выданный platform.env, рабочий репозиторий и доступность локальных инструментов.


  ```bash

  pwd; test -r platform.env; git -C repository status --short

  ```


  ### Входы проверки workload {#q100-workload-probe-input}


  Проверка может остановиться до чтения worker, если недоступна рабочая папка или не запускается Python. Проверьте инструменты на станции и доступ к Deployment board.


  ```bash

  pwd; command -v python3; kubectl get deployment board -o name

  ```


  ### Готовность после rollout {#q100-rollout-readiness}


  Короткое ожидание rollout может закончиться до проверки imageID. Перед повтором проверьте ход rollout и события загрузки образа или готовности.


  ```bash

  kubectl rollout status deployment/board --timeout=3s

  ```


  ### Входы проверки Service {#q100-service-probe-input}


  HTTP-проверка может остановиться до запроса, если недоступна рабочая папка или вход платформы. Проверьте каталог и доступ к Service board.


  ```bash

  pwd; test -r platform.env; kubectl get service board -o name

  ```



  ### История после базового коммита {#q122-parent-forward-git-history}


  Текущий HEAD мог перестать происходить от выданного baseline, либо исходная запись не читается. Проверьте родословную коммитов перед публикацией исправления вперёд.


  ```bash

  git -C repository log --oneline --graph --decorate -12

  ```


  ### Коммит исправления в локальном репозитории {#q122-parent-repair-commit}


  Правка рабочей копии могла оставить HEAD на исходной ревизии. Сравните оба коммита и проверьте, что исправление закоммичено.


  ```bash

  git -C repository rev-parse HEAD; cat baseline-commit

  ```


  ### Опубликованная ветка main {#q122-parent-published-main}


  Локальный коммит мог ещё не попасть в текущий remote main, либо запрос remote не проходит. Сравните HEAD с коммитом ветки, который вернул origin.


  ```bash

  git -C repository rev-parse HEAD; git -C repository ls-remote origin refs/heads/main

  ```


  ### Вид ресурса дочернего манифеста {#q122-parent-git-child-kind}


  Закоммиченный дочерний объект мог отсутствовать, быть некорректным YAML или иметь другой kind. Проверьте kind Application в apps/child.yaml из HEAD.


  ```bash

  git -C repository show HEAD:apps/child.yaml

  ```


  ### Имя дочернего манифеста {#q122-parent-git-child-name}


  У дочернего объекта в коммите могло быть другое имя либо файл не читается. Проверьте apps/child.yaml из HEAD и сохраните имя board.


  ```bash

  git -C repository show HEAD:apps/child.yaml

  ```


  ### Источник в закоммиченном дочернем манифесте {#q122-parent-git-child-source}


  Дочерний объект в Git мог ссылаться на старый, абсолютный или выходящий к родителю путь. Проверьте, что закоммиченный относительный путь ведёт к manifests.


  ```bash

  git -C repository show HEAD:apps/child.yaml

  ```


  ### Проект действующего дочернего Application {#q122-parent-live-child-project}


  Дочерний объект в кластере мог попасть в другой AppProject или сохранить прежнюю спецификацию. Проверьте, что его текущий project равен station.


  ```bash

  kubectl get application board -o jsonpath=''{.spec.project}''

  ```


  ### Назначение действующего дочернего Application {#q122-parent-live-child-destination}


  Дочерний объект в кластере мог указывать на другой namespace. Сравните namespace назначения с выданным namespace стенда.


  ```bash

  kubectl get application board -o jsonpath=''{.spec.destination.namespace}''; printf ''%s\n'' "$DQ_NAMESPACE"

  ```


  ### Источник действующего дочернего Application {#q122-parent-live-child-source}


  Путь в коммите может быть верным, пока дочерний объект использует прежний каталог. После согласования parent проверьте относительный путь к manifests в кластере.


  ```bash

  kubectl get application board -o jsonpath=''{.spec.source.path}''

  ```


  ### Отслеживание дочернего ресурса родителем {#q122-parent-live-child-tracking}


  Вручную созданный дочерний объект мог не иметь аннотации отслеживания parent. Сравните текущий tracking ID с идентификатором parent в стенде.


  ```bash

  kubectl get application board -o json | jq ''.metadata.annotations["argocd.argoproj.io/tracking-id"]''

  ```


  ### Состояние синхронизации обоих Application {#q122-parent-and-child-sync-state}


  Указанный Application мог остаться OutOfSync или не применить источник. Проверьте статус соответствующего parent или board и ошибки согласования.


  ```bash

  kubectl get application parent board -o json | jq ''.items[] | {name: .metadata.name, sync: .status.sync.status}''

  ```


  ### Опубликованная ревизия обоих Application {#q122-parent-and-child-published-revision}


  Application мог синхронизироваться на прежнем коммите. Сравните ревизию указанного parent или board с текущим опубликованным HEAD.


  ```bash

  git -C repository rev-parse HEAD; kubectl get application parent board -o json | jq ''.items[] | {name: .metadata.name, revision: .status.sync.revision}''

  ```


  ### Состояние синхронизированных Application {#q122-parent-child-application-health}


  Дочерний Application мог синхронизироваться, пока его нагрузка ещё не готова. Проверьте здоровье board и работающие Pod после согласования.


  ```bash

  kubectl get application board -o jsonpath=''{.status.health.status}''; kubectl get pods -l app=board

  ```


  ### Сохранённый UID родительского Application {#q122-retained-parent-application-uid}


  Пересоздание родительского Application под тем же именем меняет UID навсегда. Сравните текущий UID parent с зафиксированной исходной записью.


  ```bash

  cat /run/dq/facts/0/parent-uid; kubectl get application parent -o jsonpath=''{.metadata.uid}''

  ```


  ### Сохранённый путь родительского Application {#q122-retained-parent-apps-path}


  Родитель в кластере мог начать указывать прямо на манифесты вместо каталога дочерних объектов. Проверьте точный путь apps у parent.


  ```bash

  kubectl get application parent -o jsonpath=''{.spec.source.path}''

  ```


  ### Готовность дочерней нагрузки {#q122-parent-child-workload-ready}


  У Deployment дочернего Application могла ещё не появиться готовая реплика. Проверьте события Pod и дождитесь одной готовой реплики board.


  ```bash

  kubectl get deployment board -o jsonpath=''{.status.readyReplicas}''; kubectl get pods -l app=board

  ```


  ### Фактический ответ дочернего сервиса {#q122-parent-child-live-service}


  Application может быть Healthy, пока board отдаёт старый ответ или временно недоступен. Запросите действующий Service и сравните тело с north-122.


  ```bash

  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080

  ```


  ### Согласованная публикация дочернего ресурса {#q122-parent-child-approved-publication}


  В коммите или в кластере у worker могло отсутствовать монтирование board-publication только для чтения. Проверьте его, tracking дочернего Application и утверждённую ревизию в ConfigMap, а также значение на работающем HTTP-пути.


  ```bash

  cat /run/dq/facts/0/approved-publication

  git -C repository show HEAD:manifests/board.yaml

  kubectl get deployment board -o json | jq ''.spec.template.spec | {volumes, mounts: [.containers[] | select(.name=="worker") | .volumeMounts]}''

  kubectl get configmap board-publication -o json | jq ''{revision: .data.revision, tracking: .metadata.annotations["argocd.argoproj.io/tracking-id"]}''

  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080/publication/revision

  ```


  ### Данные проверки дочернего ресурса {#q122-parent-child-observer-input}


  Проверка дочернего объекта может остановиться до указания условия при ошибке инструмента, репозитория или входов. Проверьте локальную копию Git и доступ к API.


  ```bash

  command -v python3; git -C repository status --short; kubectl get application parent board -o name

  ```


  ### Данные проверки публикации {#q122-parent-publication-observer-input}


  Проверка публикации может остановиться до указания поля, если не запускается процесс или недоступны входы. Проверьте репозиторий, инструменты и доступ к board-publication и board.


  ```bash

  command -v python3; kubectl get configmap board-publication -o name; git -C repository status --short

  ```


  ### Пространство имён из контракта {#q123-appset-frozen-namespace}


  В исходной записи ApplicationSet мог отсутствовать доступный для чтения namespace. Проверьте выданный namespace перед поиском созданных Application.


  ```bash

  jq -er .namespace /run/dq/facts/0/appset-target.json

  ```


  ### Репозиторий из контракта {#q123-appset-frozen-repository}


  Запись цели могла не читаться или не содержать URL. Проверьте repoURL в исходных данных перед сравнением источников созданных объектов.


  ```bash

  jq -er .repoURL /run/dq/facts/0/appset-target.json

  ```


  ### Запись о согласованном релизе {#q123-appset-approved-release-receipt}


  Зафиксированный коммит релиза мог не читаться или быть пустым. Проверьте запись утверждённой ревизии перед сравнением статусов Application.


  ```bash

  test -s /run/dq/facts/0/release-commit

  ```


  ### UID действующего ApplicationSet {#q123-appset-live-uid}


  Текущий ApplicationSet station мог отсутствовать или не читаться. Получите его UID в выданном namespace перед проверкой владельцев.


  ```bash

  ns=$(jq -er .namespace /run/dq/facts/0/appset-target.json); kubectl -n "$ns" get applicationset station -o json | jq ''.metadata.uid''

  ```


  ### Путь источника в шаблоне {#q123-appset-template-directory}


  Шаблон мог указывать на старый каталог или путь одной станции. Проверьте точный параметризованный путь stations/{{.station}}.


  ```bash

  ns=$(jq -er .namespace /run/dq/facts/0/appset-target.json); kubectl -n "$ns" get applicationset station -o json | jq ''.spec.template.spec.source.path''

  ```


  ### Настройка Go-шаблонов ApplicationSet {#q123-appset-go-template-mode}


  Go-шаблоны могли быть выключены или не заданы, из-за чего выражение пути не раскрывается. Проверьте логическое goTemplate: true.


  ```bash

  ns=$(jq -er .namespace /run/dq/facts/0/appset-target.json); kubectl -n "$ns" get applicationset station -o json | jq ''.spec.goTemplate''

  ```


  ### Станции в списке генератора {#q123-appset-list-station-elements}


  Первый list generator мог потерять станцию или сменить порядок. Проверьте station и сохраните north перед south.


  ```bash

  ns=$(jq -er .namespace /run/dq/facts/0/appset-target.json); kubectl -n "$ns" get applicationset station -o json | jq ''.spec.generators[0].list.elements''

  ```


  ### Оба ожидаемых Application {#q123-appset-expected-pair}


  Один из ожидаемых Application мог отсутствовать либо не читаться. Проверьте, что контроллер создал north и south в выданном namespace.


  ```bash

  ns=$(jq -er .namespace /run/dq/facts/0/appset-target.json); kubectl -n "$ns" get application north south -o json | jq ''.items[].metadata.name''

  ```


  ### Проект сгенерированных Application {#q123-appset-generated-project}


  Указанный Application мог унаследовать другой AppProject. Проверьте созданную спецификацию и проект station в шаблоне.


  ```bash

  ns=$(jq -er .namespace /run/dq/facts/0/appset-target.json); kubectl -n "$ns" get application north south -o json | jq ''.items[] | {name: .metadata.name, project: .spec.project}''

  ```


  ### Репозиторий сгенерированных Application {#q123-appset-generated-repository}


  Указанный Application мог ссылаться на другой репозиторий либо исходный URL не читается. Сравните repoURL с зафиксированным appset-target.json.


  ```bash

  ns=$(jq -er .namespace /run/dq/facts/0/appset-target.json); jq -er .repoURL /run/dq/facts/0/appset-target.json; kubectl -n "$ns" get application north south -o json | jq ''.items[] | {name: .metadata.name, repo: .spec.source.repoURL}''

  ```


  ### Исходный каталог каждой станции {#q123-appset-generated-station-directory}


  Выражение шаблона могло раскрыться в неверный каталог. Проверьте точный путь указанного Application, stations/north для north или stations/south для south.


  ```bash

  ns=$(jq -er .namespace /run/dq/facts/0/appset-target.json); kubectl -n "$ns" get application north south -o json | jq ''.items[] | {name: .metadata.name, path: .spec.source.path}''

  ```


  ### Пространство имён назначения каждой станции {#q123-appset-generated-bay-destination}


  Созданный Application мог указывать на другой namespace. Сравните назначение указанного объекта с выданным namespace стенда.


  ```bash

  ns=$(jq -er .namespace /run/dq/facts/0/appset-target.json); printf ''%s\n'' "$DQ_NAMESPACE"; kubectl -n "$ns" get application north south -o json | jq ''.items[] | {name: .metadata.name, namespace: .spec.destination.namespace}''

  ```


  ### Владение сгенерированными Application {#q123-appset-generated-owner-reference}


  Application с тем же именем мог не иметь ссылки на ApplicationSet либо указывать на прежний UID. Сравните UID владельца с текущим ApplicationSet station.


  ```bash

  ns=$(jq -er .namespace /run/dq/facts/0/appset-target.json); kubectl -n "$ns" get applicationset station -o json | jq ''.metadata.uid''; kubectl -n "$ns" get application north south -o json | jq ''.items[] | {name: .metadata.name, owners: .metadata.ownerReferences}''

  ```


  ### Синхронизация сгенерированных Application {#q123-appset-generated-sync-state}


  Указанный Application мог остаться OutOfSync, пока не готов источник или согласование. Проверьте sync status и ошибки.


  ```bash

  ns=$(jq -er .namespace /run/dq/facts/0/appset-target.json); kubectl -n "$ns" get application north south -o json | jq ''.items[] | {name: .metadata.name, sync: .status.sync.status}''

  ```


  ### Ревизия релиза сгенерированных Application {#q123-appset-generated-release-revision}


  Application мог синхронизироваться на прежнем коммите или ветке обслуживания. Сравните наблюдаемую ревизию с утверждённым release-commit.


  ```bash

  ns=$(jq -er .namespace /run/dq/facts/0/appset-target.json); cat /run/dq/facts/0/release-commit; kubectl -n "$ns" get application north south -o json | jq ''.items[] | {name: .metadata.name, revision: .status.sync.revision}''

  ```


  ### Состояние сгенерированных Application {#q123-appset-generated-application-health}


  У указанного Application может быть нужная ревизия, пока нагрузка не Healthy. Проверьте статус и rollout соответствующего Deployment.


  ```bash

  ns=$(jq -er .namespace /run/dq/facts/0/appset-target.json); kubectl -n "$ns" get application north south -o json | jq ''.items[] | {name: .metadata.name, health: .status.health.status}''

  ```


  ### Готовые реплики каждой станции {#q123-appset-station-ready-replicas}


  На одной станции могла ещё не появиться готовая реплика либо Deployment отсутствует. Проверьте rollout указанной станции и дождитесь одной готовой реплики.


  ```bash

  kubectl get deployment north south -o custom-columns=NAME:.metadata.name,READY:.status.readyReplicas

  ```


  ### Фактический HTTP-ответ каждой станции {#q123-appset-station-live-http}


  Указанная станция могла отдавать старое значение либо быть недоступной. Запросите обе станции и сравните north с north-123, а south с south-123.


  ```bash

  for station in north south; do kubectl exec "deployment/$station" -- wget -qO- -T 3 "http://$station:8080"; done

  ```


  ### Согласованная ссылка на релиз и main {#q123-appset-frozen-release-source}


  Шаблон или созданный Application мог всё ещё отслеживать main, либо приватные refs сдвинулись. Сравните утверждённую ветку релиза и неизменный main с remote. Проверьте targetRevision в шаблоне и обоих созданных Application.


  ```bash

  ns=$(jq -er .namespace /run/dq/facts/0/appset-target.json); ref=$(cat /run/dq/facts/0/release-ref); repo=$(jq -er .repoURL /run/dq/facts/0/appset-target.json); cat /run/dq/facts/0/release-commit /run/dq/facts/0/maintenance-commit; git -C repository ls-remote "$repo" refs/heads/main "refs/heads/$ref"; kubectl -n "$ns" get applicationset station -o json | jq ''.spec.template.spec.source.targetRevision''; kubectl -n "$ns" get application north south -o json | jq ''.items[] | {name: .metadata.name, revision: .spec.source.targetRevision}''

  ```

  '
