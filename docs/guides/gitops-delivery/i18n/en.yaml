heading: Private registry and GitOps recovery
text: '# Private registry and GitOps recovery


  Use only the disposable quest bay. A kubelet pulls a private image using a same-namespace Secret named in `imagePullSecrets`. A digest identifies immutable image content; `imagePullPolicy: Always` causes a pull check at startup. Read `platform.env`, `private-release.json`, `board.json` and `registry-pull.json` where supplied. Protect the game credentials: avoid printing them or putting them in terminal history. Inspect Pod events and wait for `kubectl rollout status deployment/board --timeout=90s`; a successful current rollout does not prove future pulls.


  An Argo CD Application selects a repository, path, revision and destination. The controller reconciles asynchronously: `Synced` describes comparison with Git, while `Healthy` describes resource health. In an app-of-apps layout a parent reconciles a child Application, which reconciles the workload. Compare both with the pushed commit and preserve the parent identity. `wait-apps.sh` in the bay checks the expected Applications; retry after reconciliation rather than assuming an edit was immediate.


  An ApplicationSet list generator supplies parameters to a Go template; a path such as `stations/{{.station}}` produces a path for each entry. In the ApplicationSet quest the game poll submits one of two bounded manifests from `applicationset.json` to the private controller. It is an adapter with limited allowed changes, not a general-purpose controller API. Wait for generated Applications and inspect ownership, revision, health and actual workload responses.


  References: [private image pulls](https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/), [Argo CD list generator](https://argo-cd.readthedocs.io/en/stable/operator-manual/applicationset/Generators-List/), [Go templates](https://argo-cd.readthedocs.io/en/stable/operator-manual/applicationset/GoTemplate/).


  In quest 027, inspect the relay''s image-pull events and use the supplied game-only registry credentials to create a same-namespace pull Secret without exposing their values. Reference it with `imagePullSecrets`, retain the private image and `Always`, and wait for the relay rollout.


  In quest 041, compare the release-candidate and main histories. Merge or cherry-pick the intended notice onto main, push it to the supplied private remote, and, from `~/quest`, run `git -C repository fetch origin main release-candidate`. Verify `north-41` in local and remote main, the baseline ancestor, a clean worktree, and equality of the actual HEAD and remote commit.


  In quest 042, rotate `registry-pull` using the supplied game credentials, without printing or placing credentials in shell history. Verify the Secret type and canonical encoded auth, keep `PRIVATE_IMAGE`, `Always`, one replica and the single pull Secret, then check rollout and `north-42`. Base64 is encoding, not encryption; the current rollout is not proof of every future pull.


  In quest 043, change the Argo Application source path to `manifests` while retaining the supplied repository, project, revision and destination. Sync and compare the controller''s revision with remote main, then verify Synced/Healthy and the actual `north-43` response.


  In quest 049, a mutable tag and the intended digest can return the same text while identifying different artifacts. Pin `PRIVATE_IMAGE`, retain `Always` and `registry-pull`, and compare the ready container''s image ID with the intended digest as well as checking `north-49`.


  For quest 027, this example builds the pull Secret from the supplied environment without placing credential values in command arguments or printing the payload. For quest 042, replace `parcel-pull` with `registry-pull`; keep the resulting Secret private.


  ```bash

  set +x

  cd ~/quest

  source platform.env

  export DQ_PULL_SECRET=parcel-pull

  python3 - <<''PY'' | kubectl apply -f - >/dev/null

  import base64

  import json

  import os

  import sys


  auth = base64.b64encode((os.environ[''REGISTRY_USER''] + '':'' + os.environ[''REGISTRY_PASSWORD'']).encode()).decode()

  config = json.dumps({''auths'': {os.environ[''REGISTRY'']: {''auth'': auth}}}).encode()

  secret = {''apiVersion'': ''v1'', ''kind'': ''Secret'', ''metadata'': {''name'': os.environ[''DQ_PULL_SECRET'']}, ''type'': ''kubernetes.io/dockerconfigjson'', ''data'': {''.dockerconfigjson'': base64.b64encode(config).decode()}}

  json.dump(secret, sys.stdout)

  PY

  unset DQ_PULL_SECRET

  ```


  In quest 061, fix only the named repository Secret with the current game credential; do not print the password or list unrelated Secrets. Check that access remains limited to that Secret. Then compare Argo''s synced revision with the recorded commit and verify the `north-61` response.


  In quest 066, distinguish rollback, current and obsolete manifest digests before applying retention. The supplied helper may delete only obsolete in this disposable registry; verify current and rollback remain retrievable. Manifest deletion is not garbage collection.


  In quest 068, repair the readiness value in Git, commit and push a descendant of the baseline, and refresh Argo. Check the recorded revision, Healthy status and actual `north-68` response; Synced alone does not establish readiness.


  In quest 075, restore the original signed push hook to the frozen receiver and deliver a valid main event with the supplied test endpoint. With polling disabled, verify the server-observed event, current revision, health and `north-75`; manual refresh alone is not that event.


  In quest 078, request only the bounded registry start, verify authenticated TLS `/v2/`, then restore one board replica using the existing pinned image and pull Secret. Compare the running image identity and response; keep the game credentials private.

  '
