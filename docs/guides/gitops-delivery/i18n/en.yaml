heading: Private registry and GitOps recovery
text: '# Private registry and GitOps recovery


  ## Separate the boundaries


  Registry service availability, transport trust, source identity and consumer adoption are different observations. Use only the disposable training bay. Read the supplied source contracts and compare them with the live API; backend-frozen records preserve the original authority. A control receipt reports an agent action, not continuing service health, authorization or data adoption.


  ## Private image consumers {#private-image-consumers}


  The workstation client and kubelet have independent credential custody. A successful authenticated registry request does not update a same-namespace Kubernetes pull Secret. The Secret identifies registry credentials; it does not install a CA into the node runtime. Preserve the intended registry endpoint, certificate trust, immutable image, controller identity and credential object.


  Pod events distinguish connection, certificate, authorization and missing-manifest failures. Always controls image resolution and pull behavior; cached image content and a Ready container do not establish that saved credentials will work for a later pull. Compare current Secret credentials privately with the approved authority and inspect the actual running image digest and owned pod references.


  A generic update of an existing authorized Secret follows. Select the existing object and supplied authority first. It prints no credentials; base64 is encoding, not encryption. A policy or workload still needs to reference the intended object.


  ```bash

  set -euo pipefail

  set +x

  : "${DQ_PULL_SECRET:?select the existing authorized Secret}"

  : "${REGISTRY:?select the approved registry endpoint}"

  : "${REGISTRY_USER:?select the supplied registry identity}"

  : "${REGISTRY_PASSWORD:?load the private supplied credential}"

  export DQ_PULL_SECRET REGISTRY REGISTRY_USER REGISTRY_PASSWORD

  before=$(kubectl get secret "$DQ_PULL_SECRET" -o jsonpath=''{.metadata.uid}'')

  python3 -I - <<''PRIVATE_AUTH'' | kubectl apply -f - >/dev/null

  import base64,json,os

  auth=base64.b64encode((os.environ[''REGISTRY_USER'']+'':''+os.environ[''REGISTRY_PASSWORD'']).encode()).decode()

  config={''auths'':{os.environ[''REGISTRY'']:{''auth'':auth}}}

  secret={''apiVersion'':''v1'',''kind'':''Secret'',''metadata'':{''name'':os.environ[''DQ_PULL_SECRET'']},

  ''type'':''kubernetes.io/dockerconfigjson'',''data'':{''.dockerconfigjson'':base64.b64encode(json.dumps(config).encode()).decode()}}

  print(json.dumps(secret))

  PRIVATE_AUTH

  test "$(kubectl get secret "$DQ_PULL_SECRET" -o jsonpath=''{.metadata.uid}'')" = "$before"

  ```


  ## Retention and mutable references


  A tag resolves to a manifest; a manifest digest identifies exact bytes. A local Docker tag does not update a remote registry until its manifest is pushed. Compare the registry’s tag inventory, manifest responses and approved digest catalog. Use the appropriate manifest media types when requesting a manifest or interpreting Docker-Content-Digest.


  Construct retention against protected manifest identities. Check the deletion plan before issuing a DELETE and verify that protected manifests remain readable afterwards. Surviving release aliases must also still resolve to the intended content: preserving a digest alone does not preserve a mutable alias. Deleting a manifest and collecting unreferenced blobs are separate operations. Do not substitute volume removal, insecure TLS or a different registry for recovery.


  ## Events and reconciliation


  A repository webhook connects a source event to a private receiver. Compare receiver identity, event type, repository, branch and signature configuration without printing the shared secret. Signed-event acceptance is distinct from periodic polling and from successful source reconciliation. Use the event provider’s delivery result and the receiver’s authenticated observation together.


  An Application binds repository, path, revision, project and destination. Synced describes source comparison; Healthy describes resource health. Neither status establishes the bytes served by the application. Compare the reconciled revision, desired source data, current Kubernetes object and actual response without changing a correct access boundary.


  ## Publication and adoption


  A mounted ConfigMap may update its projected files while an application continues serving a copy made at startup. A process may need an explicit supported refresh or a rollout to adopt new data. Preserve the original controller and pod program; compare every active owned pod with the approved source and its served response. A new healthy replacement object does not preserve the original identity.


  In an app-of-apps chain, a parent reconciles a child Application, which reconciles a workload. Trace source and ownership at each layer. An ApplicationSet generator supplies parameters to a template; inspect the generated objects as well as the template. Changing only a child or generated object can be overwritten by its controller. Preserve the intended repository authority, owner identities, namespace and publication across propagation.


  A tracked child can deploy valid manifests and still choose a stale publication. Compare the workload''s mounted source with the HTTP response. For a generated fleet, compare each Application''s source path and target ref with the resolved commit. Different branch names may temporarily resolve to the same commit, so a revision match alone does not establish the intended source.


  References: [registry API](https://distribution.github.io/distribution/spec/api/), [private image pulls](https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/), [Argo CD webhooks](https://argo-cd.readthedocs.io/en/stable/operator-manual/webhook/), [ConfigMap adoption](https://kubernetes.io/docs/tutorials/configuration/updating-configuration-via-a-configmap/).


  ### Git check inputs {#git-environment}


  Git checks stopped before observing the repository; platform.env may be missing, unreadable or failing when sourced. The committed notices could not be inspected; platform.env, the repository, Git or Python may be unavailable before the per-ref checks run. Run from ~/quest and restore the supplied platform.env if it was removed; sourcing it must succeed before Git is inspected. The probe fallback also covers missing Python or failed Git process startup.


  ### Fetching delivery branches {#git-fetch}


  Fetching main and release-candidate failed; origin may have the wrong URL, lack access or lack one of these branches. `git -C repository ls-remote --heads origin main release-candidate`.


  ### Current branch and working tree {#git-worktree}


  The current branch is not main or cannot be read; the repository may still be on release-candidate or a detached HEAD. The working tree has tracked changes or untracked files; an edit may not have been committed or temporary files remain. `git -C repository status --short --branch`.


  ### Notice in committed Git objects {#git-committed-notice}


  origin/main:notice.txt is unreadable or differs from north-41; main may not have been pushed or the fetched remote ref is stale. HEAD:notice.txt is unreadable or differs from north-41; the candidate commit may not be on local main, even if the working file was edited. `git -C repository show HEAD:notice.txt; git -C repository show origin/main:notice.txt`.


  ### Published identity and history {#git-publication-history}


  The baseline is missing, invalid or not an ancestor of origin/main; published history may have been replaced instead of extended. HEAD is invalid or differs from origin/main; a local commit may be unpushed or the remote tracking ref has not been refreshed. `git -C repository rev-parse HEAD origin/main; git -C repository merge-base --is-ancestor "$(cat baseline-commit)" origin/main`.


  ### Inputs for private workload checks {#registry-observation}


  The replica check stopped before reading board; platform.env may be missing, unreadable or fail when sourced. The private workload could not be inspected; environment values, API JSON, Deployment ownership or a unique worker container may be missing or malformed. The credential probe stopped before its detailed checks; platform.env, required registry variables or the Python probe may be unavailable. Load platform.env without printing its passwords. Inspect Deployment board, ReplicaSets and Pods in the bay namespace: active Pods are nonterminal, not deleting, and owned through a controller ReplicaSet belonging to the Deployment UID. Missing or malformed worker or pull-Secret identities may also prevent the detailed checks.


  ### Private image in active Pods {#registry-pod-contract}


  The worker image differs from PRIVATE_IMAGE in board or its active Pods; a template edit or an older ReplicaSet may still use another image. Always is missing from the board worker or an active Pod; cached-image settings or Pods from an older template can bypass a fresh registry pull. No active board Pod was found or its effective pull Secrets differ from registry-pull alone; template or ServiceAccount changes may have added or omitted a Secret. Compare both the Deployment template and current owned Pods. Changing a template does not change an existing Pod; a new rollout must replace it. ServiceAccount admission can contribute effective imagePullSecrets, so inspect Pod specs as well as board.yaml.


  ### Desired private consumer count {#registry-replicas}


  The desired replica count is not 1 or board cannot be read; scaling the workload down does not repair private image authentication. `kubectl get deployment board -o jsonpath=''{.spec.replicas}''`.


  ### Docker credential document {#registry-credential-document}


  registry-pull has no supported Docker credential type; a generic Secret or an unreadable/missing type cannot supply registry credentials. The Docker credential document cannot be decoded; the required data key, base64, JSON or unique JSON fields may be invalid. Use type kubernetes.io/dockerconfigjson with data[".dockerconfigjson"] containing base64 JSON {"auths":{...}}, or kubernetes.io/dockercfg with data[".dockercfg"] containing the registry map directly. Duplicate JSON keys are rejected. Inspect structure without exposing credential values.


  ### Registry entry and rotated credentials {#registry-credential-auth}


  Authentication data is unreadable or unusable; check the exact registry entry, base64 auth containing a colon, or string username/password fields. The decoded credentials differ from platform.env; registry-pull may still hold the retired password or credentials for another user. The entry key must exactly equal REGISTRY. A nonempty auth field takes precedence over username/password and must decode to the supplied user, a colon and the supplied password; stale auth is not repaired by adding matching separate fields. Updating the Secret does not itself prove a successful new pull; verify rollout and HTTP separately.


  ### Private consumer readiness and HTTP {#registry-consumer-health}


  board did not complete rollout within 3 seconds; rejected registry credentials, image pull backoff or a failing worker may still block readiness. The worker did not return north-42 at localhost:8080; it may not be running yet, exec may have failed, or its HTTP command or content changed. `kubectl describe pods; kubectl rollout status deployment/board --timeout=10s`.


  ### Application source and destination {#argo-source-contract}


  The Application source or destination does not match the supplied release, or its inputs cannot be read; the initial path retired does not point to manifests on main. `kubectl get application station -o jsonpath=''{.spec}''; cat application.yaml repository/manifests/board.yaml`. Check project station, the supplied GIT_URL, targetRevision main, relative directory manifests and the bay namespace. The local cluster is selected either by server https://kubernetes.default.svc with no name, or by name in-cluster with no server. Absolute paths and parent traversal do not identify the required directory.


  ### Observed revision, sync and health {#argo-observed-revision}


  Synced and Healthy at remote main could not be verified; reconciliation may still be blocked by the source path, repository access, unhealthy resources or an unreadable remote ref. `git -C repository ls-remote origin refs/heads/main; kubectl get application station -o jsonpath=''{.status}''; kubectl describe application station`. Loading platform.env or starting Git, kubectl or jq may also have failed before status could be observed.


  ### Consumer rollout and response {#argo-consumer-health}


  board rollout failed or exceeded 3 seconds; Argo may not have applied the manifests yet or the worker may still be unavailable. The worker response was not north-43 or exec failed; the Git-managed workload may be absent, unready or serving changed content. `kubectl rollout status deployment/board --timeout=10s; kubectl exec deployment/board -c worker -- wget -qO- http://127.0.0.1:8080`.


  ### Observe the intended image digest {#private-digest-observation}


  The intended private image and a ready matching Pod could not be verified; parcel:stable may still select the alternate image, no current worker may be ready at the required digest, or environment/API observations may be unavailable. Compare the intended entry in release-catalog.txt with the board template and a current owned ready worker. PRIVATE_IMAGE must use the required sha256 digest and the observed imageID must match it. The initial parcel:stable is a separately built image with an alternate label; it serves the same HTTP body, so HTTP success alone cannot prove image identity. API JSON, environment variables and worker/controller identities must be readable for the probe.


  ### Effective pull settings on current Pods {#private-consumer-pull-contract}


  Always and registry-pull alone could not be verified on active board Pods; old Pod templates, effective pull Secret references, missing current Pods or unreadable environment/API identities may explain it. Inspect the Deployment template and all current Pods owned through its controller ReplicaSets. The template worker and each current worker need Always; current Pods must use only registry-pull as their effective pull Secret. Old templates and ServiceAccount admission can explain differences. This condition observes pull policy and Secret names. Investigate registry-pull authentication separately if image pulls fail.


  ### Readiness after image pinning {#private-digest-readiness}


  Deployment board did not finish rollout within 3 seconds; a changed image may still be pulling, credentials or scheduling may block it, or the rollout observation may have failed. `kubectl describe pods; kubectl rollout status deployment/board --timeout=10s`.


  ### HTTP is separate from image identity {#private-digest-http}


  The worker did not return north-49 at localhost:8080 or exec failed; the Pod may be unready or its HTTP command/content changed, even when the declared image looks correct. `kubectl exec deployment/board -c worker -- wget -qO- http://127.0.0.1:8080`.



  ### Retain the original repository Secret {#delivery-original-secret-identity}


  The repository Secret UID changed; recreating station-repository keeps its name while losing the original credential object recorded by setup.  `source platform.env; kubectl -n "$ARGO_NAMESPACE" get secret station-repository -o jsonpath=''{.metadata.uid}''`.


  ### Repository identity in the credential Secret {#delivery-secret-repository-binding}


  The original Secret no longer identifies the supplied Git repository and account as an Argo repository credential; the retired URL, changed username/type or missing repository label can prevent its use.  `cat delivery-access.json`.


  ### Restore the approved repository password {#delivery-approved-secret-password}


  The Secret password does not match the protected approved value; the supplied retired password or an incomplete credential repair can leave Argo unable to authenticate to the original repository.  `cat delivery-access.json`.


  ### Retain the original Application {#delivery-original-application-identity}


  The board Application UID changed; deleting and recreating the Application replaces the original delivery identity even if its name and manifests remain the same.  `kubectl get application board -o jsonpath=''{.metadata.uid}''`.


  ### Private credential-bearing Git configuration {#delivery-private-git-configuration}


  A checked Git configuration contains the credential password or its Basic encoding while granting group/other permissions; storing the repaired header in a broadly accessible configuration can expose the working credential. The check inspects ~/.gitconfig and repository/.git/config when they contain the current Secret password or its Basic encoding. Credential-bearing files need no group/other permission bits; a configuration without those bytes is not required to have that mode by this condition. Inspect modes without displaying credential values. `stat -c "%a %n" ~/.gitconfig repository/.git/config`.


  ### Contact the original repository directly {#delivery-direct-git-authority}


  Git resolves the supplied repository URL to a different authority or path; a URL rewrite may redirect the workstation to another repository even when its branch happens to match. The resolved URL must retain the supplied scheme, hostname, port and path after trimming a trailing slash; embedded authentication does not change that comparison. A query or fragment makes the observation invalid. A matching main commit in another repository does not prove direct access to the original one. `git -C repository config --show-origin --name-only --get-regexp "url.*"`.


  ### Authenticate and observe the remote main ref {#delivery-authenticated-remote-main}


  The original repository cannot be queried or its main ref differs from the frozen release; the retired workstation Authorization header, missing access or a changed remote publication can explain it.  `source platform.env; git -C repository ls-remote "$GIT_URL" refs/heads/main`.


  ### Observe access within the deadline {#delivery-access-observation-budget}


  A Git or Kubernetes observation exceeded its command or overall deadline; a slow API, network or authentication endpoint can prevent completing all delivery-access comparisons in time.  `kubectl --request-timeout=2s get application board -o json`.


  ### Readable access evidence and API objects {#delivery-access-observation-inputs}


  Delivery access could not be observed; missing protected receipt or objects, invalid JSON/credential encoding, unreadable Git configuration or failed API operations may explain it.  `cat delivery-access.json; kubectl get application board -o json`.


  ### Secret password gate and observer startup {#delivery-password-gate-and-startup}


  The legacy Secret password comparison failed or the access probe stopped before a named marker; an unrepaired password, a changed platform.env expectation or unavailable environment/Python inputs may explain it.  `test -r platform.env; command -v python3`.


  ### Narrow permission to repair one Secret {#delivery-scoped-secret-permissions}


  The required narrow Secret access was not verified; missing patch permission for station-repository, a wrong namespace, broader list/unrelated-Secret permissions or unavailable platform.env or API inputs can explain it.  `source platform.env; kubectl auth can-i patch secret/station-repository -n "$ARGO_NAMESPACE"; kubectl auth can-i list secrets -n "$ARGO_NAMESPACE"; kubectl auth can-i patch secret/unrelated -n "$ARGO_NAMESPACE"`.


  ### Select the intended Git source {#delivery-board-git-source}


  Application board does not select the supplied repository, relative manifests path and main revision, or its definition could not be read; a stale or changed Application source can reconcile another publication.  `kubectl get application board -o json`.


  ### Observe adoption of the published release {#delivery-board-release-adoption}


  Application board is not Synced and Healthy at release-commit, or its status could not be read; repaired credentials may still need a refresh and reconciliation, or the selected release and observed revision may differ.  `cat release-commit; kubectl get application board -o json`.


  ### Complete the delivered workload rollout {#delivery-board-workload-rollout}


  Deployment board did not complete rollout within 3 seconds; Git delivery may not have created the workload yet, Pods may still be unavailable, or the API observation failed.  `kubectl rollout status deployment/board --timeout=10s`.


  ### Observe the consumer-facing Service response {#delivery-board-service-response}


  The board Service path did not return north-61 or exec/HTTP failed; an undelivered workload, wrong Service routing or stale served content can prevent the intended publication from reaching its consumer.  `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080`.



  ### Select only the approved obsolete digest {#retention-approved-obsolete-selection}


  The retention plan does not select only the frozen obsolete digest or cannot be read; the supplied plan selects rollback, and selecting by a mutable tag or editing the working catalog can target a protected release.  `cat retention.json release-catalog.json`.


  ### Retained manifests and published aliases {#retention-original-registry-and-aliases}


  The original registry did not verify the required manifest states and surviving aliases; obsolete may remain, a protected digest may be missing or current may still point to rollback, while changed authority, credentials, CA trust, digest headers or failed observations can also explain it. The supplied current tag was pushed to the rollback image after the approved catalog was recorded. Deleting obsolete alone leaves that alias wrong. Verify frozen current and rollback manifests return 200, obsolete returns 404, current resolves to the approved current digest and tag 1 to rollback. Use the original endpoint/account/CA with verified TLS, no redirect or proxy substitution, and matching body digest plus Docker-Content-Digest. A local Docker tag needs a push to update the remote alias; manifest removal does not prove blob garbage collection. `cat release-catalog.json registry-source.json; cat retention.json`.

  '
