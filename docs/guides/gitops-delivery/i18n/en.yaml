heading: Private registry and GitOps recovery
text: '# Private registry and GitOps recovery


  ## Separate the boundaries


  Registry service availability, transport trust, source identity and consumer adoption are different observations.
  Use only the disposable training bay. Read the supplied source contracts and compare them with the live API; backend-frozen
  records preserve the original authority. A control receipt reports an agent action, not continuing service health,
  authorization or data adoption.


  ## Private image consumers


  The workstation client and kubelet have independent credential custody. A successful authenticated registry request
  does not update a same-namespace Kubernetes pull Secret. The Secret identifies registry credentials; it does not
  install a CA into the node runtime. Preserve the intended registry endpoint, certificate trust, immutable image,
  controller identity and credential object.


  Pod events distinguish connection, certificate, authorization and missing-manifest failures. Always controls image
  resolution and pull behavior; cached image content and a Ready container do not establish that saved credentials
  will work for a later pull. Compare current Secret credentials privately with the approved authority and inspect
  the actual running image digest and owned pod references.


  A generic update of an existing authorized Secret follows. Select the existing object and supplied authority first.
  It prints no credentials; base64 is encoding, not encryption. A policy or workload still needs to reference the
  intended object.


  ```bash

  set -euo pipefail

  set +x

  : "${DQ_PULL_SECRET:?select the existing authorized Secret}"

  : "${REGISTRY:?select the approved registry endpoint}"

  : "${REGISTRY_USER:?select the supplied registry identity}"

  : "${REGISTRY_PASSWORD:?load the private supplied credential}"

  export DQ_PULL_SECRET REGISTRY REGISTRY_USER REGISTRY_PASSWORD

  before=$(kubectl get secret "$DQ_PULL_SECRET" -o jsonpath=''{.metadata.uid}'')

  python3 -I - <<''PRIVATE_AUTH'' | kubectl apply -f - >/dev/null

  import base64,json,os

  auth=base64.b64encode((os.environ[''REGISTRY_USER'']+'':''+os.environ[''REGISTRY_PASSWORD'']).encode()).decode()

  config={''auths'':{os.environ[''REGISTRY'']:{''auth'':auth}}}

  secret={''apiVersion'':''v1'',''kind'':''Secret'',''metadata'':{''name'':os.environ[''DQ_PULL_SECRET'']},

  ''type'':''kubernetes.io/dockerconfigjson'',''data'':{''.dockerconfigjson'':base64.b64encode(json.dumps(config).encode()).decode()}}

  print(json.dumps(secret))

  PRIVATE_AUTH

  test "$(kubectl get secret "$DQ_PULL_SECRET" -o jsonpath=''{.metadata.uid}'')" = "$before"

  ```


  ## Retention and mutable references


  A tag resolves to a manifest; a manifest digest identifies exact bytes. A local Docker tag does not update a remote
  registry until its manifest is pushed. Compare the registry’s tag inventory, manifest responses and approved digest
  catalog. Use the appropriate manifest media types when requesting a manifest or interpreting Docker-Content-Digest.


  Construct retention against protected manifest identities. Check the deletion plan before issuing a DELETE and
  verify that protected manifests remain readable afterwards. Surviving release aliases must also still resolve
  to the intended content: preserving a digest alone does not preserve a mutable alias. Deleting a manifest and
  collecting unreferenced blobs are separate operations. Do not substitute volume removal, insecure TLS or a different
  registry for recovery.


  ## Events and reconciliation


  A repository webhook connects a source event to a private receiver. Compare receiver identity, event type, repository,
  branch and signature configuration without printing the shared secret. Signed-event acceptance is distinct from
  periodic polling and from successful source reconciliation. Use the event provider’s delivery result and the receiver’s
  authenticated observation together.


  An Application binds repository, path, revision, project and destination. Synced describes source comparison;
  Healthy describes resource health. Neither status establishes the bytes served by the application. Compare the
  reconciled revision, desired source data, current Kubernetes object and actual response without changing a correct
  access boundary.


  ## Publication and adoption


  A mounted ConfigMap may update its projected files while an application continues serving a copy made at startup.
  A process may need an explicit supported refresh or a rollout to adopt new data. Preserve the original controller
  and pod program; compare every active owned pod with the approved source and its served response. A new healthy
  replacement object does not preserve the original identity.


  In an app-of-apps chain, a parent reconciles a child Application, which reconciles a workload. Trace source and
  ownership at each layer. An ApplicationSet generator supplies parameters to a template; inspect the generated
  objects as well as the template. Changing only a child or generated object can be overwritten by its controller.
  Preserve the intended repository authority, owner identities, namespace and publication across propagation.


  A tracked child can deploy valid manifests and still choose a stale publication. Compare the workload''s mounted source with the HTTP response. For a generated fleet, compare each Application''s source path and target ref with the resolved commit. Different branch names may temporarily resolve to the same commit, so a revision match alone does not establish the intended source.


  References: [registry API](https://distribution.github.io/distribution/spec/api/), [private image pulls](https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/),
  [Argo CD webhooks](https://argo-cd.readthedocs.io/en/stable/operator-manual/webhook/), [ConfigMap adoption](https://kubernetes.io/docs/tutorials/configuration/updating-configuration-via-a-configmap/).

  '
