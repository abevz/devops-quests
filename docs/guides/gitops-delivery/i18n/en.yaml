heading: Private registry and GitOps recovery
text: '# Private registry and GitOps recovery


  Use only the disposable quest bay. A kubelet pulls a private image using a same-namespace Secret named in `imagePullSecrets`. A digest identifies immutable image content; `imagePullPolicy: Always` causes a pull check at startup. Read `platform.env`, `private-release.json`, `board.json` and `registry-pull.json` where supplied. Protect the game credentials: avoid printing them or putting them in terminal history. Inspect Pod events and wait for `kubectl rollout status deployment/board --timeout=90s`; a successful current rollout does not prove future pulls.


  An Argo CD Application selects a repository, path, revision and destination. The controller reconciles asynchronously: `Synced` describes comparison with Git, while `Healthy` describes resource health. In an app-of-apps layout a parent reconciles a child Application, which reconciles the workload. Compare both with the pushed commit and preserve the parent identity. `wait-apps.sh` in the bay checks the expected Applications; retry after reconciliation rather than assuming an edit was immediate.


  An ApplicationSet list generator supplies parameters to a Go template; a path such as `stations/{{.station}}` produces a path for each entry. In the ApplicationSet quest the game poll submits one of two bounded manifests from `applicationset.json` to the private controller. It is an adapter with limited allowed changes, not a general-purpose controller API. Wait for generated Applications and inspect ownership, revision, health and actual workload responses.


  References: [private image pulls](https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/), [Argo CD list generator](https://argo-cd.readthedocs.io/en/stable/operator-manual/applicationset/Generators-List/), [Go templates](https://argo-cd.readthedocs.io/en/stable/operator-manual/applicationset/GoTemplate/).

  '
