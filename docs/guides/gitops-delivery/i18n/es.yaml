heading: Recuperación de registro privado y GitOps
text: '# Recuperación de registro privado y GitOps


  Usa solo la bahía desechable de la misión. Un kubelet descarga una imagen privada mediante un Secret del mismo namespace nombrado en `imagePullSecrets`. Un digest identifica el contenido inmutable de la imagen; `imagePullPolicy: Always` hace que se compruebe la descarga al iniciar. Lee `platform.env`, `private-release.json`, `board.json` y `registry-pull.json` cuando estén disponibles. Protege las credenciales de juego: no las imprimas ni las guardes en el historial del terminal. Inspecciona eventos del Pod y espera `kubectl rollout status deployment/board --timeout=90s`; un rollout correcto actual no demuestra descargas futuras.


  Una Application de Argo CD selecciona repositorio, ruta, revisión y destino. El controlador reconcilia de forma asíncrona: `Synced` describe la comparación con Git y `Healthy` la salud de recursos. En app-of-apps, un padre reconcilia una Application hija, que reconcilia el workload. Compara ambas con el commit enviado y conserva la identidad del padre. `wait-apps.sh` en la bahía comprueba las Applications esperadas; vuelve a intentar tras la reconciliación en vez de asumir un cambio inmediato.


  Un generador de lista de ApplicationSet proporciona parámetros a una plantilla Go; una ruta como `stations/{{.station}}` produce una ruta por entrada. En la misión ApplicationSet el sondeo del juego envía uno de dos manifiestos limitados de `applicationset.json` al controlador privado. Es un adaptador con cambios permitidos limitados, no una API general del controlador. Espera las Applications generadas e inspecciona propietario, revisión, salud y respuestas reales del workload.


  Referencias: [descargas de imágenes privadas](https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/), [generador de lista Argo CD](https://argo-cd.readthedocs.io/en/stable/operator-manual/applicationset/Generators-List/), [plantillas Go](https://argo-cd.readthedocs.io/en/stable/operator-manual/applicationset/GoTemplate/).


  En el ejercicio 027, inspecciona los eventos de descarga de imagen de relay y usa las credenciales de juego suministradas para crear un pull Secret en el mismo namespace sin exponer sus valores. Refiérelo en `imagePullSecrets`, conserva la imagen privada y `Always`, y espera el rollout de relay.


  En el ejercicio 041, compara los historiales de release-candidate y main. Transfiere el aviso deseado a main mediante merge o cherry-pick, publícalo en el remoto privado suministrado y desde `~/quest` ejecuta `git -C repository fetch origin main release-candidate`. Verifica `north-41` en main local y remoto, baseline como ancestro, el worktree limpio y la igualdad de los commits reales HEAD y remoto.


  En el ejercicio 042, rota `registry-pull` con las credenciales del juego sin imprimirlas ni guardarlas en el historial del shell. Verifica el tipo del Secret y la auth codificada de forma canónica, conserva `PRIVATE_IMAGE`, `Always`, una réplica y un único pull Secret; comprueba el rollout y `north-42`. Base64 es codificación, no cifrado; el rollout actual no demuestra descargas futuras.


  En el ejercicio 043, cambia el source path de Argo Application a `manifests` conservando repository, project, revision y destination suministrados. Sincroniza y compara la revisión del controlador con main remoto; comprueba Synced/Healthy y la respuesta real `north-43`.


  En el ejercicio 049, una etiqueta mutable y el digest deseado pueden devolver el mismo texto aunque identifiquen artefactos distintos. Fija `PRIVATE_IMAGE`, conserva `Always` y `registry-pull`, compara el image ID del contenedor listo con el digest deseado y comprueba `north-49`.


  Para el ejercicio 027, este ejemplo crea el pull Secret desde el entorno suministrado sin poner credenciales en argumentos de comandos ni imprimir el contenido. Para el ejercicio 042, sustituye `parcel-pull` por `registry-pull`; mantén privado el Secret resultante.


  ```bash

  set +x

  cd ~/quest

  source platform.env

  export DQ_PULL_SECRET=parcel-pull

  python3 - <<''PY'' | kubectl apply -f - >/dev/null

  import base64

  import json

  import os

  import sys


  auth = base64.b64encode((os.environ[''REGISTRY_USER''] + '':'' + os.environ[''REGISTRY_PASSWORD'']).encode()).decode()

  config = json.dumps({''auths'': {os.environ[''REGISTRY'']: {''auth'': auth}}}).encode()

  secret = {''apiVersion'': ''v1'', ''kind'': ''Secret'', ''metadata'': {''name'': os.environ[''DQ_PULL_SECRET'']}, ''type'': ''kubernetes.io/dockerconfigjson'', ''data'': {''.dockerconfigjson'': base64.b64encode(config).decode()}}

  json.dump(secret, sys.stdout)

  PY

  unset DQ_PULL_SECRET

  ```


  En el ejercicio 061, corrige solo el repository Secret indicado con la credencial actual del juego; no imprimas la contraseña ni listes otros Secrets. Comprueba que el acceso siga limitado a ese Secret. Compara la revisión sincronizada de Argo con el commit registrado y verifica la respuesta `north-61`.


  En el ejercicio 066, distingue los digest rollback, current y obsolete antes de aplicar retención. El helper suministrado solo puede borrar obsolete en este registry desechable; verifica que current y rollback siguen disponibles por digest. Borrar manifiestos no es garbage collection.


  En el ejercicio 068, corrige readiness en Git, crea y publica un descendiente de baseline y refresca Argo. Comprueba la revisión registrada, el estado Healthy y la respuesta real `north-68`; Synced por sí solo no establece disponibilidad.


  En el ejercicio 075, restaura el push hook firmado original al receptor congelado y entrega un evento main válido mediante el endpoint de prueba suministrado. Con polling desactivado, verifica el evento observado por el servidor, la revisión actual, la salud y `north-75`; un refresh manual no crea ese evento.


  En el ejercicio 078, solicita solo el arranque limitado del registry, verifica TLS autenticado en `/v2/` y recupera una réplica board con la imagen fijada y el pull Secret existentes. Compara la identidad de la imagen activa y la respuesta; mantén privadas las credenciales del juego.

  '
