  ### Espacio de nombres del contrato {#q123-appset-frozen-namespace}


  El destino fijado de ApplicationSet puede carecer de namespace legible. Revise el namespace suministrado antes de buscar las Application generadas.


  ```bash

  jq -er .namespace /run/dq/facts/0/appset-target.json

  ```


  ### Repositorio del contrato {#q123-appset-frozen-repository}


  El registro de destino puede ser ilegible u omitir la URL del repositorio. Revise repoURL en la entrada fijada antes de comparar fuentes.


  ```bash

  jq -er .repoURL /run/dq/facts/0/appset-target.json

  ```


  ### Comprobante de la versión aprobada {#q123-appset-approved-release-receipt}


  El commit fijado puede ser ilegible o estar vacío. Revise el registro de la revisión aprobada antes de comparar el estado de las Application.


  ```bash

  test -s /run/dq/facts/0/release-commit

  ```


  ### UID del ApplicationSet actual {#q123-appset-live-uid}


  El ApplicationSet station activo puede faltar o no ser legible. Lea su UID en el namespace suministrado antes de revisar propietarios.


  ```bash

  ns=$(jq -er .namespace /run/dq/facts/0/appset-target.json); kubectl -n "$ns" get applicationset station -o json | jq ''.metadata.uid''

  ```


  ### Ruta de origen en la plantilla {#q123-appset-template-directory}


  La plantilla puede señalar el directorio retirado o una estación fija. Revise la ruta parametrizada exacta stations/{{.station}}.


  ```bash

  ns=$(jq -er .namespace /run/dq/facts/0/appset-target.json); kubectl -n "$ns" get applicationset station -o json | jq ''.spec.template.spec.source.path''

  ```


  ### Configuración de plantillas Go de ApplicationSet {#q123-appset-go-template-mode}


  Las plantillas Go pueden estar apagadas o sin configurar e impedir la expansión de la ruta. Compruebe goTemplate booleano true.


  ```bash

  ns=$(jq -er .namespace /run/dq/facts/0/appset-target.json); kubectl -n "$ns" get applicationset station -o json | jq ''.spec.goTemplate''

  ```


  ### Estaciones en el generador de lista {#q123-appset-list-station-elements}


  El primer generador de lista puede omitir una estación o cambiar el orden. Revise station y mantenga north seguido de south.


  ```bash

  ns=$(jq -er .namespace /run/dq/facts/0/appset-target.json); kubectl -n "$ns" get applicationset station -o json | jq ''.spec.generators[0].list.elements''

  ```


  ### Ambas Applications esperadas {#q123-appset-expected-pair}


  Una Application esperada puede faltar o fallar su consulta. Compruebe que el controlador generó north y south en el namespace suministrado.


  ```bash

  ns=$(jq -er .namespace /run/dq/facts/0/appset-target.json); kubectl -n "$ns" get application north south -o json | jq ''.items[].metadata.name''

  ```


  ### Proyecto de las Applications generadas {#q123-appset-generated-project}


  La Application indicada puede heredar otro AppProject. Revise la especificación generada y el project station en la plantilla.


  ```bash

  ns=$(jq -er .namespace /run/dq/facts/0/appset-target.json); kubectl -n "$ns" get application north south -o json | jq ''.items[] | {name: .metadata.name, project: .spec.project}''

  ```


  ### Repositorio de las Applications generadas {#q123-appset-generated-repository}


  La Application indicada puede apuntar a otro repositorio o carecer de una URL original legible. Compare repoURL con appset-target.json fijado.


  ```bash

  ns=$(jq -er .namespace /run/dq/facts/0/appset-target.json); jq -er .repoURL /run/dq/facts/0/appset-target.json; kubectl -n "$ns" get application north south -o json | jq ''.items[] | {name: .metadata.name, repo: .spec.source.repoURL}''

  ```


  ### Directorio de origen de cada estación {#q123-appset-generated-station-directory}


  La expresión de plantilla puede expandirse a otro directorio. Revise la ruta exacta, stations/north para north o stations/south para south.


  ```bash

  ns=$(jq -er .namespace /run/dq/facts/0/appset-target.json); kubectl -n "$ns" get application north south -o json | jq ''.items[] | {name: .metadata.name, path: .spec.source.path}''

  ```


  ### Espacio de nombres de destino de cada estación {#q123-appset-generated-bay-destination}


  La Application generada puede apuntar a otro namespace. Compare el destino afectado con el namespace suministrado del entorno.


  ```bash

  ns=$(jq -er .namespace /run/dq/facts/0/appset-target.json); printf ''%s\n'' "$DQ_NAMESPACE"; kubectl -n "$ns" get application north south -o json | jq ''.items[] | {name: .metadata.name, namespace: .spec.destination.namespace}''

  ```


  ### Propiedad de las Applications generadas {#q123-appset-generated-owner-reference}


  Una Application con el mismo nombre puede carecer de propietario ApplicationSet o indicar un UID anterior. Compare el UID con el ApplicationSet station activo.


  ```bash

  ns=$(jq -er .namespace /run/dq/facts/0/appset-target.json); kubectl -n "$ns" get applicationset station -o json | jq ''.metadata.uid''; kubectl -n "$ns" get application north south -o json | jq ''.items[] | {name: .metadata.name, owners: .metadata.ownerReferences}''

  ```


  ### Sincronización de las Applications generadas {#q123-appset-generated-sync-state}


  La Application indicada puede seguir OutOfSync porque falta reconciliar la fuente. Revise su estado de sincronización y los errores.


  ```bash

  ns=$(jq -er .namespace /run/dq/facts/0/appset-target.json); kubectl -n "$ns" get application north south -o json | jq ''.items[] | {name: .metadata.name, sync: .status.sync.status}''

  ```


  ### Revisión de la versión usada por las Applications generadas {#q123-appset-generated-release-revision}


  Una Application puede estar Synced en un commit anterior o la rama de mantenimiento. Compare la revisión observada con el release-commit aprobado.


  ```bash

  ns=$(jq -er .namespace /run/dq/facts/0/appset-target.json); cat /run/dq/facts/0/release-commit; kubectl -n "$ns" get application north south -o json | jq ''.items[] | {name: .metadata.name, revision: .status.sync.revision}''

  ```


  ### Salud de las Applications generadas {#q123-appset-generated-application-health}


  La Application indicada puede tener la revisión correcta mientras la carga aún no está Healthy. Revise el estado y el despliegue correspondiente.


  ```bash

  ns=$(jq -er .namespace /run/dq/facts/0/appset-target.json); kubectl -n "$ns" get application north south -o json | jq ''.items[] | {name: .metadata.name, health: .status.health.status}''

  ```


  ### Réplicas listas de cada estación {#q123-appset-station-ready-replicas}


  Una estación puede no tener réplica lista o faltar su Deployment. Revise el despliegue de la estación indicada y espere una réplica lista.


  ```bash

  kubectl get deployment north south -o custom-columns=NAME:.metadata.name,READY:.status.readyReplicas

  ```


  ### Respuesta HTTP real de cada estación {#q123-appset-station-live-http}


  La estación indicada puede servir contenido anterior o no tener endpoint alcanzable. Consulte ambas y compare north con north-123 y south con south-123.


  ```bash

  for station in north south; do kubectl exec "deployment/$station" -- wget -qO- -T 3 "http://$station:8080"; done

  ```


  ### Referencia de la versión aprobada y main {#q123-appset-frozen-release-source}


  La plantilla o una Application generada puede seguir main, o las refs remotas pueden haberse movido. Compare la rama aprobada y main de mantenimiento sin cambios con el remoto. Revise targetRevision en la plantilla y ambas Application.


  ```bash

  ns=$(jq -er .namespace /run/dq/facts/0/appset-target.json); ref=$(cat /run/dq/facts/0/release-ref); repo=$(jq -er .repoURL /run/dq/facts/0/appset-target.json); cat /run/dq/facts/0/release-commit /run/dq/facts/0/maintenance-commit; git -C repository ls-remote "$repo" refs/heads/main "refs/heads/$ref"; kubectl -n "$ns" get applicationset station -o json | jq ''.spec.template.spec.source.targetRevision''; kubectl -n "$ns" get application north south -o json | jq ''.items[] | {name: .metadata.name, revision: .spec.source.targetRevision}''

  ```

  '
