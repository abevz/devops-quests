  La cabecera obtenida puede seguir igual al baseline reader anterior o el productor apuntar a otro repositorio. Conserve ascendencia baseline y publique commit nuevo con datos reader aprobados. Fallo del comando ancestry usa rollback_observation, no este marcador de comparación. `git -C repository log --oneline -5 origin/main; kubectl get application board -o json | jq .spec.source.repoURL`.


  ### Pines actuales del commit consumidor {#forward-rollback-current-reader-commit-pins}


  Reader empiezan fijados a un commit anterior; reparar productor no mueve sus revisiones. Publique manifests aprobados, fije cada reader Application original al Git commit completo actual, conserve ruta, project y destination y espere Synced y Healthy en esa revisión; apuntar solo a main no cumple comparación immutable pin. `git -C repository rev-parse origin/main; kubectl get application reader-a reader-b -o json | jq ".items[] | {name:.metadata.name,source:.spec.source,project:.spec.project,destination:.spec.destination,status:.status}"`.


  ### Proyección publicada de consumidores {#forward-rollback-published-reader-projection}


  Un reader sano puede seguir ejecutando programa original con publicación anterior. Conserve image, command y args reader en Git, Deployment vivo y cada Pod actual propio; complete rollout y publique JSON aprobado mediante exactamente una proyección ConfigMap coincidente en document root. Data Git y ConfigMap vivo deben coincidir como mapas completos, y publicación decodificada incluir valores aprobados. Pueden aceptarse vínculos ConfigMap directos o projected equivalentes. `git -C repository ls-tree -r --name-only origin/main -- readers; kubectl get deployment reader-a reader-b -o yaml; kubectl get configmaps -o yaml`.


  ### Publicación en cada consumidor {#forward-rollback-every-reader-publication}


  Git, ConfigMap vivo y estado sano no prueban datos actuales en cada reader Pod. Observe cada Pod propio actual por localhost y su Service: JSON HTTP debe incluir schema, generation y route aprobados. Archivo montado antiguo puede requerir propagación; no sustituya programa reader conservado por respuesta fabricada. `kubectl get pods -o wide; kubectl exec deployment/reader-a -c worker -- wget -qO- -T 2 http://reader-a:8080; kubectl exec deployment/reader-b -c worker -- wget -qO- -T 2 http://reader-b:8080`.


  ### Observación rollback limitada {#forward-rollback-bounded-rollback-observation}


  Un comando Git o Kubernetes puede agotar plazo restante o presupuesto común de 14 segundos antes de observar ambas líneas reader. Verifique acceso API/Git y convergencia antes de repetir; presupuesto nombrado pertenece al observador y no prueba fallo de predicado concreto. `git -C repository rev-parse origin/main; kubectl --request-timeout=2s get application,deployment,pods -o wide`.


  ### Entradas rollback legibles {#forward-rollback-readable-rollback-inputs}


  El observador puede no leer contrato congelado, historial Git, documentos Kubernetes o datos projected reader. Errores CLI capturados, JSON/YAML inválido, campos ausentes o identidades duplicadas producen marcador; fallo del comando ancestry baseline también llega aquí. Inspeccione entradas reales antes de cambiar objetos por una observación inaccesible. `test -r /run/dq/facts/0/rollback-contract.json; git -C repository ls-tree -r --name-only origin/main -- readers; kubectl --request-timeout=2s get application,deployment -o yaml`.


  ### Contrato sano y fallback inicial {#forward-rollback-healthy-contract-and-early-fallback}


  El health observer original puede rechazar recursos o seguridad desired/live cambiados respecto al Git baseline sano, probes liveness/startup incompatibles, comportamiento divergente, rollout bloqueado o falta de north-95. Emite este fallback sin marcadores más precisos. Fallos posteriores sin nombre de arranque, platform input o estructura también llegan aquí; fallos rollback nombrados lo suprimen. Conserve recursos y seguridad baseline reparando readiness por Git. `git -C repository show "$(cat /run/dq/facts/0/healthy-commit):manifests/board.yaml"; git -C repository show origin/main:manifests/board.yaml; kubectl get deployment board -o yaml`.


  ### Bytes intactos del archivo {#archived-release-untouched-archive-bytes}


  recovery-image.tar suministrado puede faltar o cambiar tras recuperar, o la suma congelada ser ilegible. Conserve archivo y compare SHA-256 de bytes con recibo congelado. Crear image parecido o cambiar checksum de trabajo no acredita bytes archivados originales. `sha256sum recovery-image.tar; cat /run/dq/facts/0/archive.sha256`.


  ### Bytes exactos registry y artefacto protegido {#archived-release-exact-registry-bytes-and-protected-artifact}


  Setup elimina alias locales utilizables y manifest registry; el archivo debe recuperar esa publicación exacta, no build nuevo. Verifique TLS confiable, autenticación suministrada, immutable manifest digest, bytes idénticos del tag 1 y digest/tamaño de cada config/layer. Artefacto protected independiente y blobs deben sobrevivir. Todo fallo de comando o comparación en fase registry usa el mismo marcador. `sha256sum recovery-image.tar; test -r /run/dq/facts/0/registry-ca.crt; docker image ls --digests; jq "{protected_image,protected_tag}" /run/dq/facts/0/recovery-baseline.json`.


  ### Consumidores originales suspendidos {#archived-release-original-suspended-consumers}


  Recrear controladores, Service o definición batch conserva nombres pero cambia UID. Repare objetos originales y mantenga CronJob suspendido; ejecución manual de recuperación no exige habilitar calendario. Documentos baseline/objeto ausentes o inválidos antes de fase source también dan marcador identidad. `kubectl get deployment,service,cronjob,application -o json | jq ".items[] | {kind,name:.metadata.name,uid:.metadata.uid,suspend:.spec.suspend}"`.


  ### Fuente inmutable publicada {#archived-release-published-immutable-source}


  Restaurar registry no actualiza Git ni consumidor automáticamente. Publique digest image archivado en definición web Deployment existente, conserve source Application, project station y destination y espere sincronización del Git head actual con self-healing/pruning automáticos. Image worker vivo debe igualar exactamente referencia digest-pinned declarada; tag mutable solo falla. `git -C repository show origin/main:manifests/web.yaml; kubectl get application release -o json | jq "{spec,status:.status.sync}"; kubectl get deployment archive-web -o yaml`.


  ### Adopción web real {#archived-release-real-web-adoption}


  Web Deployment puede nombrar image restaurado mientras rollout usa Pods viejos o no listos. Conserve replicas entero positivo, observed generation actual y exactamente Pods actuales propios listos con ese image; HTTP archive-web debe devolver archive-97 original. Errores API, exec o HTTP dentro de fase web usan mismo marcador. `kubectl rollout status deployment/archive-web --timeout=3s; kubectl get pods -o wide; kubectl exec deployment/archive-web -c worker -- wget -qO- -T 3 http://archive-web:8080`.


  ### Ejecución manual real completada {#archived-release-real-completed-manual-execution}


  Reparar plantilla del CronJob suspendido no arregla Job interrumpido ni crea ejecución completada. Mantenga calendario suspendido y cree un Job nuevo exitoso desde plantilla reparada con image archivado. Pod spec completo debe igualar plantilla, con worker Pod real propio exitoso, salida 0, runtime image digest archivado y logs checked-97; se acepta exactamente un Job nuevo completado, intentos viejos fallidos pueden quedar. `kubectl get cronjob archive-scan -o yaml; kubectl get jobs,pods -o wide`.


  ### Observar sin editar estado de ejecución {#archived-release-observe-without-status-forgery}


  Dar permiso al jugador para patch status de Pod o Job permitiría ejecución fabricada. Mantenga ambas comprobaciones status patch denegadas y observe terminación real, image identity y logs. Error de observación de autorización o salida distinta de no también falla. `kubectl auth can-i patch pods --subresource=status; kubectl auth can-i patch jobs --subresource=status`.


  ### Fallo de entrada sin marcador {#archived-release-unlabelled-consumer-input}


  Tras fase registry pueden fallar Git fetch, manifest web publicado, snapshot Kubernetes combinado o arranque Python/helper antes de comparación nombrada. Inspeccione lecturas reales y workspace. Errores registry ya tienen recovery_registry, fallos identity/source/web/batch capturados conservan marcadores; fallback aparece solo sin ellos. `git -C repository fetch origin main; git -C repository show origin/main:manifests/web.yaml; kubectl get deployment,service,cronjob,job,application,pods,replicasets -o json >/dev/null`.



