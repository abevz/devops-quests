heading: Recuperación de registro privado y GitOps
text: '# Recuperación de registro privado y GitOps


  ## Separar los límites


  Disponibilidad del registry, confianza de transporte, identidad de fuente y adopción son observaciones distintas. Usa solo la bahía desechable. Compara contratos con la API real; los registros congelados conservan la autoridad original. Un recibo describe una acción del agente, no disponibilidad continua, autorización ni adopción.


  ## Consumidores de imágenes privadas {#private-image-consumers}


  Cliente workstation y kubelet custodian credenciales independientemente. Una lectura autenticada no actualiza un Secret de extracción del namespace. El Secret contiene credenciales, pero no instala una CA en el runtime del nodo. Conserva endpoint, confianza del certificado, imagen inmutable, controlador y objeto de credenciales.


  Los eventos distinguen conexión, certificado, autorización y manifiesto ausente. Always controla resolución y extracción; una caché y un contenedor Ready no prueban credenciales válidas para la siguiente extracción. Compara el Secret privadamente con la autoridad aprobada y verifica digest real y referencias de pods propios.


  El ejemplo genérico actualiza un Secret existente autorizado. Elige primero objeto y autoridad suministrada. No imprime credenciales; base64 es codificación, no cifrado. La carga sigue necesitando referenciar el objeto previsto.


  ```bash

  set -euo pipefail

  set +x

  : "${DQ_PULL_SECRET:?select the existing authorized Secret}"

  : "${REGISTRY:?select the approved registry endpoint}"

  : "${REGISTRY_USER:?select the supplied registry identity}"

  : "${REGISTRY_PASSWORD:?load the private supplied credential}"

  export DQ_PULL_SECRET REGISTRY REGISTRY_USER REGISTRY_PASSWORD

  before=$(kubectl get secret "$DQ_PULL_SECRET" -o jsonpath=''{.metadata.uid}'')

  python3 -I - <<''PRIVATE_AUTH'' | kubectl apply -f - >/dev/null

  import base64,json,os

  auth=base64.b64encode((os.environ[''REGISTRY_USER'']+'':''+os.environ[''REGISTRY_PASSWORD'']).encode()).decode()

  config={''auths'':{os.environ[''REGISTRY'']:{''auth'':auth}}}

  secret={''apiVersion'':''v1'',''kind'':''Secret'',''metadata'':{''name'':os.environ[''DQ_PULL_SECRET'']},

  ''type'':''kubernetes.io/dockerconfigjson'',''data'':{''.dockerconfigjson'':base64.b64encode(json.dumps(config).encode()).decode()}}

  print(json.dumps(secret))

  PRIVATE_AUTH

  test "$(kubectl get secret "$DQ_PULL_SECRET" -o jsonpath=''{.metadata.uid}'')" = "$before"

  ```


  ## Retención y referencias mutables


  Una etiqueta resuelve a un manifiesto; su digest identifica bytes exactos. Una etiqueta Docker local no actualiza el registry remoto hasta publicar el manifiesto. Compara inventario de etiquetas, respuestas y catálogo aprobado. Usa los tipos de manifiesto adecuados al interpretar Docker-Content-Digest.


  Construye retención sobre identidades protegidas. Comprueba el plan antes de DELETE y disponibilidad de manifiestos protegidos después. Las etiquetas conservadas también deben apuntar al contenido correcto: conservar un digest no conserva automáticamente un alias. Eliminar manifiestos y recolectar blobs son operaciones distintas. No sustituyas recuperación por borrar volúmenes, TLS inseguro u otro registry.


  ## Eventos y reconciliación


  Un webhook conecta un evento con un receptor privado. Compara receptor, tipo, repositorio, rama y firma sin imprimir el secreto. La aceptación firmada difiere del sondeo periódico y de reconciliar correctamente. Usa el resultado del proveedor junto con la observación autenticada del receptor.


  Una Application vincula repositorio, ruta, revisión, proyecto y destino. Synced describe comparación con la fuente; Healthy describe salud de recursos. Ninguno demuestra la respuesta servida. Compara revisión, datos deseados, objeto Kubernetes y respuesta real sin cambiar un límite correcto.


  ## Publicación y adopción


  Una ConfigMap montada puede actualizar archivos proyectados mientras la aplicación sirve una copia del inicio. Puede requerirse actualización compatible o rollout. Conserva controlador y programa; compara cada pod activo propio con fuente y respuesta. Un objeto nuevo sano no conserva la identidad original.


  En app-of-apps el padre reconcilia una Application hija, y esta la carga. Sigue fuente y propietario en cada capa. Un generador ApplicationSet aporta parámetros a una plantilla; inspecciona también objetos generados. El controlador puede sobrescribir cambios directos. Conserva autoridad del repositorio, propietarios, namespace y publicación durante propagación.


  Una Application hija puede aplicar manifiestos válidos y aun así elegir una publicación antigua. Compara el origen montado con la respuesta HTTP. En una flota, contrasta la ruta y la referencia de cada Application con el commit resuelto. Varias ramas pueden apuntar temporalmente al mismo commit, por lo que coincidir en revisión no identifica por sí solo el origen previsto.


  Referencias: [API registry](https://distribution.github.io/distribution/spec/api/), [imágenes privadas](https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/), [webhooks Argo CD](https://argo-cd.readthedocs.io/en/stable/operator-manual/webhook/), [adopción ConfigMap](https://kubernetes.io/docs/tutorials/configuration/updating-configuration-via-a-configmap/).


  ### Entradas de la comprobación Git {#git-environment}


  La comprobación Git se detuvo antes de leer el repositorio; platform.env puede faltar, ser ilegible o fallar al cargarse. No se pudieron inspeccionar los avisos confirmados; platform.env, el repositorio, Git o Python pueden no estar disponibles antes de comprobar las referencias. Trabaje desde ~/quest y restaure platform.env si se eliminó; debe cargarse antes de inspeccionar Git. El diagnóstico alternativo también cubre Python ausente o fallos al iniciar Git.


  ### Obtener las ramas de entrega {#git-fetch}


  No se pudieron obtener main y release-candidate; origin puede tener una URL incorrecta, carecer de acceso o de una de las ramas. `git -C repository ls-remote --heads origin main release-candidate`.


  ### Rama actual y árbol de trabajo {#git-worktree}


  La rama actual no es main o no puede leerse; el repositorio puede seguir en release-candidate o tener HEAD separado. El árbol de trabajo tiene cambios o archivos sin seguimiento; puede haber ediciones sin confirmar o archivos temporales. `git -C repository status --short --branch`.


  ### Aviso en objetos Git confirmados {#git-committed-notice}


  origin/main:notice.txt no puede leerse o difiere de north-41; main puede no haberse enviado o la referencia remota local está desactualizada. HEAD:notice.txt no puede leerse o difiere de north-41; main local puede no incluir el commit candidato aunque el archivo de trabajo se haya editado. `git -C repository show HEAD:notice.txt; git -C repository show origin/main:notice.txt`.


  ### Identidad e historial publicados {#git-publication-history}


  La base falta, es inválida o no es antecesora de origin/main; el historial publicado puede haberse sustituido en vez de ampliarse. HEAD es inválido o difiere de origin/main; puede haber un commit local sin enviar o una referencia remota sin actualizar. `git -C repository rev-parse HEAD origin/main; git -C repository merge-base --is-ancestor "$(cat baseline-commit)" origin/main`.


  ### Entradas de la comprobación privada {#registry-observation}


  La comprobación de réplicas se detuvo antes de leer board; platform.env puede faltar, ser ilegible o fallar al cargarse. No se pudo inspeccionar la carga privada; pueden faltar o ser inválidos los valores del entorno, JSON de la API, propietarios del Deployment o un contenedor worker único. La prueba de credenciales se detuvo antes del diagnóstico detallado; platform.env, las variables del registro o Python pueden no estar disponibles. Cargue platform.env sin mostrar contraseñas. Inspeccione Deployment board, ReplicaSets y Pods del espacio de la bahía: los Pods activos no han terminado ni se están eliminando y pertenecen al Deployment por un ReplicaSet controlador según UID. Identidades worker o pull Secret ausentes o inválidas también pueden impedir las comprobaciones detalladas.


  ### Imagen privada en Pods activos {#registry-pod-contract}


  La imagen de worker en board o sus Pods activos difiere de PRIVATE_IMAGE; una edición de plantilla o un ReplicaSet anterior puede usar otra imagen. Falta Always en worker de board o en un Pod activo; la caché o los Pods de una plantilla anterior pueden evitar una nueva descarga del registro. No hay Pod activo de board o sus Secrets efectivos de descarga no son solo registry-pull; la plantilla o ServiceAccount puede haber añadido u omitido un Secret. Compare la plantilla de Deployment y sus Pods actuales. Cambiar la plantilla no cambia un Pod existente; un nuevo despliegue debe reemplazarlo. ServiceAccount puede aportar imagePullSecrets efectivos al crear el Pod; inspeccione sus especificaciones además de board.yaml.


  ### Número deseado de consumidores privados {#registry-replicas}


  El número deseado de réplicas no es 1 o board no puede leerse; reducir las réplicas no repara la autenticación de la imagen privada. `kubectl get deployment board -o jsonpath=''{.spec.replicas}''`.


  ### Documento de credenciales Docker {#registry-credential-document}


  registry-pull no tiene un tipo Docker admitido; un Secret genérico o un tipo ausente o ilegible no proporciona credenciales del registro. No se puede decodificar el documento de credenciales Docker; la clave data, base64, JSON o la unicidad de sus campos puede ser inválida. El tipo kubernetes.io/dockerconfigjson requiere data[".dockerconfigjson"] con JSON base64 {"auths":{...}}; kubernetes.io/dockercfg requiere data[".dockercfg"] con el mapa de registros directamente. Se rechazan claves JSON duplicadas. Inspeccione la estructura sin exponer credenciales.


  ### Entrada del registro y credenciales rotadas {#registry-credential-auth}


  Los datos de autenticación son ilegibles o inválidos; revise la entrada exacta del registro, auth en base64 con dos puntos o campos de texto username/password. Las credenciales decodificadas difieren de platform.env; registry-pull puede conservar la contraseña retirada o las de otro usuario. La clave debe coincidir exactamente con REGISTRY. Un auth no vacío prevalece sobre username/password y debe decodificarse como usuario, dos puntos y contraseña suministrados; añadir campos separados no repara auth antiguo. Actualizar el Secret no prueba una descarga nueva; verifique despliegue y HTTP por separado.


  ### Disponibilidad y HTTP del consumidor privado {#registry-consumer-health}


  board no completó el despliegue en 3 segundos; credenciales rechazadas, reintentos de descarga o fallos de worker pueden impedir que esté listo. worker no devolvió north-42 en localhost:8080; puede no estar ejecutándose, exec puede fallar o el comando HTTP o contenido ha cambiado. `kubectl describe pods; kubectl rollout status deployment/board --timeout=10s`.


  ### Origen y destino de Application {#argo-source-contract}


  El origen o destino de Application no coincide con la versión suministrada o no puede leerse; la ruta inicial retired no apunta a manifests en main. `kubectl get application station -o jsonpath=''{.spec}''; cat application.yaml repository/manifests/board.yaml`. Revise project station, GIT_URL suministrada, targetRevision main, el directorio relativo manifests y el espacio de la bahía. El clúster local se elige por server https://kubernetes.default.svc sin name, o por name in-cluster sin server. Rutas absolutas y recorridos al directorio padre no identifican el directorio requerido.


  ### Revisión observada, sincronización y salud {#argo-observed-revision}


  No se verificó Synced y Healthy en main remoto; la ruta, el acceso al repositorio, recursos sin salud o una referencia remota ilegible pueden bloquear la reconciliación. `git -C repository ls-remote origin refs/heads/main; kubectl get application station -o jsonpath=''{.status}''; kubectl describe application station`. La carga de platform.env o el inicio de Git, kubectl o jq también pueden haber fallado antes de observar el estado.


  ### Despliegue y respuesta del consumidor {#argo-consumer-health}


  El despliegue de board falló o superó 3 segundos; Argo puede no haber aplicado los manifiestos o worker sigue sin estar disponible. La respuesta de worker no fue north-43 o exec falló; la carga gestionada por Git puede faltar, no estar lista o servir contenido cambiado. `kubectl rollout status deployment/board --timeout=10s; kubectl exec deployment/board -c worker -- wget -qO- http://127.0.0.1:8080`.


  ### Observar el digest deseado {#private-digest-observation}


  No se verificó la imagen privada deseada y un Pod listo con el mismo digest; parcel:stable puede seguir eligiendo otra imagen, worker puede no estar listo con el digest requerido o el entorno o la API no están disponibles. Compare intended de release-catalog.txt con la plantilla board y un worker actual listo propio del Deployment. PRIVATE_IMAGE debe usar el digest sha256 requerido y imageID observado debe coincidir. parcel:stable inicial es otra imagen con etiqueta distinta pero la misma respuesta HTTP; HTTP correcto no prueba la identidad. JSON API, variables del entorno e identidades worker y controlador deben ser legibles.


  ### Ajustes efectivos de descarga en Pods actuales {#private-consumer-pull-contract}


  No se verificó Always y solo registry-pull en Pods activos de board; puede deberse a plantillas anteriores, referencias efectivas a pull Secret, ausencia de Pods actuales o identidades de entorno o API ilegibles. Inspeccione la plantilla Deployment y todos los Pods actuales propios por sus ReplicaSets controladores. worker de plantilla y cada worker actual necesitan Always; los Pods deben usar solo registry-pull como pull Secret efectivo. Plantillas anteriores y ServiceAccount pueden explicar diferencias. La condición observa la política de descarga y los nombres de Secret. Si falla la descarga, investigue por separado la autenticación de registry-pull.


  ### Disponibilidad tras fijar la imagen {#private-digest-readiness}


  Deployment board no completó el despliegue en 3 segundos; la nueva imagen puede seguir descargándose, credenciales o planificación pueden bloquearla o falló la observación. `kubectl describe pods; kubectl rollout status deployment/board --timeout=10s`.


  ### HTTP separado de la identidad de imagen {#private-digest-http}


  worker no devolvió north-49 en localhost:8080 o falló exec; el Pod puede no estar listo o cambió el comando HTTP o contenido aunque la imagen declarada parezca correcta. `kubectl exec deployment/board -c worker -- wget -qO- http://127.0.0.1:8080`.



  ### Conservar Secret original del repositorio {#delivery-original-secret-identity}


  Cambió el UID del Secret de repositorio; recrear station-repository conserva el nombre y pierde el objeto de credenciales original registrado por setup.  `source platform.env; kubectl -n "$ARGO_NAMESPACE" get secret station-repository -o jsonpath=''{.metadata.uid}''`.


  ### Identidad de repositorio en Secret {#delivery-secret-repository-binding}


  El Secret original ya no identifica el repositorio y cuenta Git suministrados como credencial Argo; URL retirado, username/type cambiado o etiqueta repository ausente impiden usarlo.  `cat delivery-access.json`.


  ### Restaurar contraseña aprobada del repositorio {#delivery-approved-secret-password}


  La contraseña Secret no coincide con el valor aprobado protegido; la contraseña retirada suministrada o una reparación incompleta puede impedir autenticar Argo en el repositorio original.  `cat delivery-access.json`.


  ### Conservar Application original {#delivery-original-application-identity}


  Cambió el UID de Application board; eliminarla y recrearla sustituye la identidad de entrega original aunque conserve nombre y manifiestos.  `kubectl get application board -o jsonpath=''{.metadata.uid}''`.


  ### Configuración Git privada con credenciales {#delivery-private-git-configuration}


  Una configuración Git comprobada contiene contraseña o codificación Basic con permisos de grupo/otros; guardar el encabezado reparado en configuración accesible puede exponer la credencial activa. La prueba inspecciona ~/.gitconfig y repository/.git/config si contienen contraseña Secret actual o Basic. Esos archivos no deben conceder bits de grupo/otros; una configuración sin esos bytes no exige ese modo por esta condición. Inspeccione permisos sin mostrar credenciales. `stat -c "%a %n" ~/.gitconfig repository/.git/config`.


  ### Acceder directamente al repositorio original {#delivery-direct-git-authority}


  Git resuelve el URL suministrado a otra autoridad o ruta; una reescritura puede dirigir workstation a otro repositorio aunque coincida la rama por casualidad. El URL resuelto conserva esquema, hostname, puerto y ruta sin barra final; la autenticación incrustada no cambia esa comparación. Query o fragment invalida la observación. Un main coincidente en otro repositorio no demuestra acceso directo al original. `git -C repository config --show-origin --name-only --get-regexp "url.*"`.


  ### Autenticar y observar referencia remota main {#delivery-authenticated-remote-main}


  No se puede consultar el repositorio original o main difiere de la versión protegida; encabezado Authorization retirado en workstation, acceso ausente o publicación remota cambiada pueden explicarlo.  `source platform.env; git -C repository ls-remote "$GIT_URL" refs/heads/main`.


  ### Observar acceso dentro del plazo {#delivery-access-observation-budget}


  Una observación Git o Kubernetes superó el plazo del comando o total; API, red o endpoint de autenticación lentos impiden completar las comparaciones de acceso a tiempo.  `kubectl --request-timeout=2s get application board -o json`.


  ### Evidencia de acceso y objetos API legibles {#delivery-access-observation-inputs}


  No se pudo observar el acceso; registro protegido u objetos ausentes, JSON/codificación de credenciales inválidos, configuración Git ilegible u operaciones API fallidas pueden explicarlo.  `cat delivery-access.json; kubectl get application board -o json`.


  ### Condición de contraseña Secret e inicio de prueba {#delivery-password-gate-and-startup}


  Falló comparar la contraseña Secret en la prueba legacy o terminó antes de un marcador; contraseña sin reparar, expectativa platform.env cambiada o entradas de entorno/Python no disponibles pueden explicarlo.  `test -r platform.env; command -v python3`.


  ### Permiso limitado para reparar un Secret {#delivery-scoped-secret-permissions}


  No se verificó el acceso Secret limitado requerido; falta patch de station-repository, namespace incorrecto, permisos más amplios de list/otro Secret o entradas platform.env o API no disponibles pueden explicarlo.  `source platform.env; kubectl auth can-i patch secret/station-repository -n "$ARGO_NAMESPACE"; kubectl auth can-i list secrets -n "$ARGO_NAMESPACE"; kubectl auth can-i patch secret/unrelated -n "$ARGO_NAMESPACE"`.


  ### Seleccionar origen Git previsto {#delivery-board-git-source}


  Application board no selecciona repositorio suministrado, ruta relativa manifests y revisión main, o no pudo leerse; un origen obsoleto o cambiado puede reconciliar otra publicación.  `kubectl get application board -o json`.


  ### Observar adopción de versión publicada {#delivery-board-release-adoption}


  Application board no está Synced y Healthy en release-commit o no pudo leerse su estado; credenciales reparadas pueden requerir refresh y reconciliación, o versión y revisión observada difieren.  `cat release-commit; kubectl get application board -o json`.


  ### Completar rollout de aplicación entregada {#delivery-board-workload-rollout}


  Deployment board no completó rollout en 3 segundos; la entrega Git puede no haber creado aún la aplicación, Pods seguir no disponibles o fallar observar API.  `kubectl rollout status deployment/board --timeout=10s`.


  ### Observar respuesta Service al consumidor {#delivery-board-service-response}


  La ruta Service board no devolvió north-61 o falló exec/HTTP; aplicación sin entregar, enrutamiento Service incorrecto o contenido obsoleto impide alcanzar al consumidor.  `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080`.



  ### Seleccionar solo digest obsolete aprobado {#retention-approved-obsolete-selection}


  El plan retention no selecciona solo el digest obsolete protegido o no puede leerse; el plan inicial elige rollback y seleccionar por tag mutable o catálogo editado puede afectar una versión protegida.  `cat retention.json release-catalog.json`.


  ### Manifiestos conservados y alias publicados {#retention-original-registry-and-aliases}


  El registry original no verificó estados y alias; obsolete puede permanecer, faltar un digest protegido o current apuntar a rollback, y cambios de authority, credenciales, CA, encabezados digest o fallos de observación también lo explican. El current suministrado se publicó como rollback tras registrar el catálogo. Borrar obsolete solo no repara ese alias. Verifique 200 para current/rollback protegidos, 404 para obsolete, current al digest aprobado y tag 1 a rollback. Use endpoint/cuenta/CA originales con TLS verificado, sin sustitución redirect/proxy y con digest de cuerpo y Docker-Content-Digest coincidentes. Un tag local necesita push para cambiar alias remoto; borrar manifiesto no acredita recolección de blobs. `cat release-catalog.json registry-source.json; cat retention.json`.



  ### Causa y observación (068, git_source) {#health-application-git-source}


  Application puede seleccionar otro repositorio, rama o directorio; compare source con platform.env y manifests suministrado. El setup sirve directorio generado y conserva puerto readiness 9090. La solución entrega archivos por Git, publica nueva revisión descendiente y reconcilia objetos existentes. Observe desde ~/quest tras cargar platform.env.


  ```bash

  kubectl get application board -o json | jq .spec.source

  ```


  ### Causa y observación (068, git_health) {#health-synced-revision-and-automation}


  La versión puede seguir no saludable o sin sincronizar, o selfHeal/prune estar desactivados; compare estado Application, release-commit y automatización. El setup sirve directorio generado y conserva puerto readiness 9090. La solución entrega archivos por Git, publica nueva revisión descendiente y reconcilia objetos existentes. Observe desde ~/quest tras cargar platform.env.


  ```bash

  kubectl get application board -o json | jq "{status:.status,automated:.spec.syncPolicy.automated}"

  ```


  ### Causa y observación (068, git_rollout) {#health-git-declared-readiness}


  La sonda readiness suministrada apunta a 9090; rollout puede fallar hasta que la carga de Git sirva la publicación declarada en 8080. El setup sirve directorio generado y conserva puerto readiness 9090. La solución entrega archivos por Git, publica nueva revisión descendiente y reconcilia objetos existentes. Observe desde ~/quest tras cargar platform.env.


  ```bash

  kubectl describe deployment board

  ```


  ### Causa y observación (068, git_http) {#health-service-route-response}


  La petición por Service puede fallar o devolver otra ruta; compare selector, disponibilidad de endpoints e index con la publicación suministrada. El setup sirve directorio generado y conserva puerto readiness 9090. La solución entrega archivos por Git, publica nueva revisión descendiente y reconcilia objetos existentes. Observe desde ~/quest tras cargar platform.env.


  ```bash

  kubectl get service board; kubectl get endpointslice -l kubernetes.io/service-name=board

  ```


  ### Causa y observación (068, git_descendant) {#health-published-descendant-commit}


  Un parche solo vivo no publica una nueva revisión Git; publique un descendiente de la base fijada y ajuste release-commit a origin/main. El setup sirve directorio generado y conserva puerto readiness 9090. La solución entrega archivos por Git, publica nueva revisión descendiente y reconcilia objetos existentes. Observe desde ~/quest tras cargar platform.env.


  ```bash

  git -C repository fetch origin main; git -C repository log --oneline origin/main -3

  ```


  ### Causa y observación (068, probe_0_5) {#health-git-live-agreement-fallback}


  El comando worker, entorno o sondas health pueden diferir entre Git y live, o fallar rollout/HTTP anterior; errores de inicio también dejan este fallback. El setup sirve directorio generado y conserva puerto readiness 9090. La solución entrega archivos por Git, publica nueva revisión descendiente y reconcilia objetos existentes. Observe desde ~/quest tras cargar platform.env.


  ```bash

  git -C repository show origin/main:manifests/board.yaml; kubectl get deployment board -o yaml

  ```


  ### Causa y observación (068, publication_identity) {#health-retain-original-object-uids}


  Recrear Application o Deployment cambia un UID fijado; reconcilie los objetos originales conservando su identidad. El setup sirve directorio generado y conserva puerto readiness 9090. La solución entrega archivos por Git, publica nueva revisión descendiente y reconcilia objetos existentes. Observe desde ~/quest tras cargar platform.env.


  ```bash

  kubectl get application board -o jsonpath="{.metadata.uid}"; kubectl get deployment board -o jsonpath="{.metadata.uid}"

  ```


  ### Causa y observación (068, publication_source) {#health-git-image-and-full-configmap-data}


  Una revisión Application antigua, otro repositorio/image o editar ConfigMap solo live rompe concordancia; compare todos los data ConfigMap con Git. El setup sirve directorio generado y conserva puerto readiness 9090. La solución entrega archivos por Git, publica nueva revisión descendiente y reconcilia objetos existentes. Observe desde ~/quest tras cargar platform.env.


  ```bash

  kubectl get configmap board-publication -o json; git -C repository show origin/main:manifests/publication.yaml

  ```


  ### Causa y observación (068, publication_projection) {#health-actual-http-root-projection}


  El servidor HTTP puede servir su directorio generado en vez de claves ConfigMap aprobadas; siga mounts de Git y live hasta su raíz real. El setup sirve directorio generado y conserva puerto readiness 9090. La solución entrega archivos por Git, publica nueva revisión descendiente y reconcilia objetos existentes. Observe desde ~/quest tras cargar platform.env.


  ```bash

  kubectl get deployment board -o json | jq .spec.template.spec; kubectl exec deployment/board -c worker -- sh -c ''for p in $(pidof httpd); do readlink /proc/$p/cwd; done''

  ```


  ### Causa y observación (068, publication_http) {#health-public-http-contract-fields}


  El contract.json observado puede contener otros campos; compare HTTP JSON con el contrato fijado tras reconciliar la fuente. El setup sirve directorio generado y conserva puerto readiness 9090. La solución entrega archivos por Git, publica nueva revisión descendiente y reconcilia objetos existentes. Observe desde ~/quest tras cargar platform.env.


  ```bash

  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080/contract.json

  ```


  ### Causa y observación (068, publication_budget) {#health-bounded-publication-observation}


  Un comando API, Git o contenedor puede exceder el tiempo de observación; revise la operación bloqueada antes de repetir. El setup sirve directorio generado y conserva puerto readiness 9090. La solución entrega archivos por Git, publica nueva revisión descendiente y reconcilia objetos existentes. Observe desde ~/quest tras cargar platform.env.


  ```bash

  kubectl get application board --request-timeout=3s

  ```


  ### Causa y observación (068, publication_observation) {#health-publication-input-and-api-errors}


  Receipts ilegibles, manifiestos/JSON inválidos o fallos API/HTTP impiden observar; distíngalos de un contrato HTTP leído correctamente pero incorrecto. El setup sirve directorio generado y conserva puerto readiness 9090. La solución entrega archivos por Git, publica nueva revisión descendiente y reconcilia objetos existentes. Observe desde ~/quest tras cargar platform.env.


  ```bash

  git -C repository ls-tree -r --name-only origin/main manifests; kubectl get application board -o json

  ```



  ### Causa y observación (070, secret_git_path) {#secret-first-stage-path-and-sync}


  Application inicia en retired; seleccione manifests y sincronice release-commit. Esta primera etapa no exige Healthy mientras falta Secret. La primera etapa corrige ruta Application; la segunda corrige política reader suministrada y publica Secret con adaptador completo sync-secret.sh. La política correcta sola no crea objeto Kubernetes. Observe desde ~/quest tras cargar platform.env.


  ```bash

  kubectl get application board -o json | jq "{source:.spec.source,sync:.status.sync}"

  ```


  ### Causa y observación (070, board_env) {#secret-declared-env-reference}


  ROUTE_SECRET puede estar duplicado, literal o apuntar a otra clave; la declaración worker exige solo secretKeyRef a route-secret/value en valueFrom, sin campo value. La primera etapa corrige ruta Application; la segunda corrige política reader suministrada y publica Secret con adaptador completo sync-secret.sh. La política correcta sola no crea objeto Kubernetes. Observe desde ~/quest tras cargar platform.env.


  ```bash

  kubectl get deployment board -o json | jq ''.spec.template.spec.containers[] | select(.name=="worker") | .env''

  ```


  ### Causa y observación (070, probe_0_1) {#secret-stage-zero-helper-startup}


  El helper de entorno puede fallar antes de leer Deployment, por ejemplo imports; errores API o estructura dentro del helper usan board_env. La primera etapa corrige ruta Application; la segunda corrige política reader suministrada y publica Secret con adaptador completo sync-secret.sh. La política correcta sola no crea objeto Kubernetes. Observe desde ~/quest tras cargar platform.env.


  ```bash

  python3 -I -c "import dq_check"

  ```


  ### Causa y observación (070, probe_1_2) {#secret-stage-one-helper-startup}


  El helper de entorno de segunda etapa puede fallar al iniciar antes de board_env; revise imports y runtime antes de cambiar referencia Secret. La primera etapa corrige ruta Application; la segunda corrige política reader suministrada y publica Secret con adaptador completo sync-secret.sh. La política correcta sola no crea objeto Kubernetes. Observe desde ~/quest tras cargar platform.env.


  ```bash

  python3 -I -c "import dq_check"

  ```


  ### Causa y observación (070, secret_git_health) {#secret-second-stage-source-health}


  Application puede seguir otro repositorio/rama/revisión o estar no saludable sin Secret entregado; compare source y status tras sincronización. La primera etapa corrige ruta Application; la segunda corrige política reader suministrada y publica Secret con adaptador completo sync-secret.sh. La política correcta sola no crea objeto Kubernetes. Observe desde ~/quest tras cargar platform.env.


  ```bash

  kubectl get application board -o json | jq "{source:.spec.source,status:.status}"

  ```


  ### Causa y observación (070, secret_rollout) {#secret-missing-input-and-rollout}


  Un Secret/clave ausente puede impedir inicio del Pod suministrado; revise events y entrada entregada antes de esperar rollout otra vez. La primera etapa corrige ruta Application; la segunda corrige política reader suministrada y publica Secret con adaptador completo sync-secret.sh. La política correcta sola no crea objeto Kubernetes. Observe desde ~/quest tras cargar platform.env.


  ```bash

  kubectl get events --sort-by=.metadata.creationTimestamp

  ```


  ### Causa y observación (070, secret_http) {#secret-service-http-route}


  Service puede no tener endpoints listos o servir otra ruta; revise selector, rollout y HTTP. La respuesta sola no demuestra valor del entorno del proceso. La primera etapa corrige ruta Application; la segunda corrige política reader suministrada y publica Secret con adaptador completo sync-secret.sh. La política correcta sola no crea objeto Kubernetes. Observe desde ~/quest tras cargar platform.env.


  ```bash

  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080

  ```



  ### Reparar destino del hook existente {#hook-existing-receiver-configuration}


  El hook suministrado apunta a URL retirado; compare hook existente con destino fijado, evento push JSON y rama main. Errores API o entorno también detienen control. Setup ya publica datos aprobados, pero el hook existente apunta a URL retirado. Repare hook original y entregue evento aceptado. El servidor copia entrada montada solo al iniciar; nuevos Pod por rollout están permitidos conservando controller y especificación template originales.  `curl -fsS -u "$GIT_USER:$GIT_PASSWORD" "${GIT_URL%/rail/station.git}/api/v1/repos/rail/station/hooks/$(cat /run/dq/facts/0/hook-id)" | jq ''{active,type,url:.config.url,content_type:.config.content_type,events,branch_filter}''`.


  ### La versión ya está publicada {#hook-already-published-descendant-revision}


  Setup ya publicó el descendiente objetivo; un fetch fallido, release-commit distinto o pérdida de ancestro incumplen control. Compare registros existentes con origin/main antes de crear otro commit. Setup ya publica datos aprobados, pero el hook existente apunta a URL retirado. Repare hook original y entregue evento aceptado. El servidor copia entrada montada solo al iniciar; nuevos Pod por rollout están permitidos conservando controller y especificación template originales.  `git -C repository fetch origin main; git -C repository log --oneline -3 origin/main; cat release-commit`.


  ### Conservar fuente Git privada {#hook-application-private-source}


  Application puede seleccionar otro repositorio, rama o directorio; conserve fuente Git privada suministrada y ruta manifests normalizada. Setup ya publica datos aprobados, pero el hook existente apunta a URL retirado. Repare hook original y entregue evento aceptado. El servidor copia entrada montada solo al iniciar; nuevos Pod por rollout están permitidos conservando controller y especificación template originales.  `kubectl get application board -o json | jq .spec.source`.


  ### Reconciliar revisión objetivo {#hook-application-reconciled-target}


  La revisión objetivo puede no reconciliarse aún o Application seguir degradada; compare sync status y revision con release-commit tras reparar entrega de eventos. Setup ya publica datos aprobados, pero el hook existente apunta a URL retirado. Repare hook original y entregue evento aceptado. El servidor copia entrada montada solo al iniciar; nuevos Pod por rollout están permitidos conservando controller y especificación template originales.  `kubectl get application board -o json | jq .status`.


  ### Pod listos durante rollout {#hook-current-rollout-readiness}


  Los Pod actuales pueden no estar listos al adoptar datos o tras rollout; revise events y rollout status conservando Deployment y especificación pod template originales. Setup ya publica datos aprobados, pero el hook existente apunta a URL retirado. Repare hook original y entregue evento aceptado. El servidor copia entrada montada solo al iniciar; nuevos Pod por rollout están permitidos conservando controller y especificación template originales.  `kubectl rollout status deployment/board --timeout=3s`.


  ### Adoptar publicación en nuevos Pod {#hook-configmap-adoption-in-current-pod}


  El servidor copia notice de ConfigMap solo al iniciar; datos sincronizados pueden dejar HTTP antiguo hasta nuevos Pod mediante rollout de Deployment original. Identidades reemplazadas, fuente/template cambiados, Pod no listo, HTTP erróneo o errores de observación también fallan. Setup ya publica datos aprobados, pero el hook existente apunta a URL retirado. Repare hook original y entregue evento aceptado. El servidor copia entrada montada solo al iniciar; nuevos Pod por rollout están permitidos conservando controller y especificación template originales. Para webhook conserve UID/spec Application, UID/selector/una réplica/template.spec completo Deployment y UID/data aprobados completos ConfigMap originales. El único Pod actual propio debe estar listo con image inmutable, command/args y read-only mounts originales y servir notice. `kubectl get configmap board-publication -o json | jq .data; kubectl get pods -o wide`.


  ### El receptor acepta evento previsto {#hook-server-owned-accepted-event-receipt}


  El receptor puede no aceptar push por URL, secret o filtro de eventos incorrecto; revise aceptación del servidor y repita entrega. Una petición HTTP sola no crea recibo protegido de aceptación. Setup ya publica datos aprobados, pero el hook existente apunta a URL retirado. Repare hook original y entregue evento aceptado. El servidor copia entrada montada solo al iniciar; nuevos Pod por rollout están permitidos conservando controller y especificación template originales.  `jq ''{repo,branch,authenticated}'' /run/dq/observations/webhook.json`.

  '
