heading: Recuperación de registro privado y GitOps
text: '# Recuperación de registro privado y GitOps


  ## Separar los límites


  Disponibilidad del registry, confianza de transporte, identidad de fuente y adopción son observaciones distintas.
  Usa solo la bahía desechable. Compara contratos con la API real; los registros congelados conservan la autoridad
  original. Un recibo describe una acción del agente, no disponibilidad continua, autorización ni adopción.


  ## Consumidores de imágenes privadas


  Cliente workstation y kubelet custodian credenciales independientemente. Una lectura autenticada no actualiza
  un Secret de extracción del namespace. El Secret contiene credenciales, pero no instala una CA en el runtime del
  nodo. Conserva endpoint, confianza del certificado, imagen inmutable, controlador y objeto de credenciales.


  Los eventos distinguen conexión, certificado, autorización y manifiesto ausente. Always controla resolución y
  extracción; una caché y un contenedor Ready no prueban credenciales válidas para la siguiente extracción. Compara
  el Secret privadamente con la autoridad aprobada y verifica digest real y referencias de pods propios.


  El ejemplo genérico actualiza un Secret existente autorizado. Elige primero objeto y autoridad suministrada. No
  imprime credenciales; base64 es codificación, no cifrado. La carga sigue necesitando referenciar el objeto previsto.


  ```bash

  set -euo pipefail

  set +x

  : "${DQ_PULL_SECRET:?select the existing authorized Secret}"

  : "${REGISTRY:?select the approved registry endpoint}"

  : "${REGISTRY_USER:?select the supplied registry identity}"

  : "${REGISTRY_PASSWORD:?load the private supplied credential}"

  export DQ_PULL_SECRET REGISTRY REGISTRY_USER REGISTRY_PASSWORD

  before=$(kubectl get secret "$DQ_PULL_SECRET" -o jsonpath=''{.metadata.uid}'')

  python3 -I - <<''PRIVATE_AUTH'' | kubectl apply -f - >/dev/null

  import base64,json,os

  auth=base64.b64encode((os.environ[''REGISTRY_USER'']+'':''+os.environ[''REGISTRY_PASSWORD'']).encode()).decode()

  config={''auths'':{os.environ[''REGISTRY'']:{''auth'':auth}}}

  secret={''apiVersion'':''v1'',''kind'':''Secret'',''metadata'':{''name'':os.environ[''DQ_PULL_SECRET'']},

  ''type'':''kubernetes.io/dockerconfigjson'',''data'':{''.dockerconfigjson'':base64.b64encode(json.dumps(config).encode()).decode()}}

  print(json.dumps(secret))

  PRIVATE_AUTH

  test "$(kubectl get secret "$DQ_PULL_SECRET" -o jsonpath=''{.metadata.uid}'')" = "$before"

  ```


  ## Retención y referencias mutables


  Una etiqueta resuelve a un manifiesto; su digest identifica bytes exactos. Una etiqueta Docker local no actualiza
  el registry remoto hasta publicar el manifiesto. Compara inventario de etiquetas, respuestas y catálogo aprobado.
  Usa los tipos de manifiesto adecuados al interpretar Docker-Content-Digest.


  Construye retención sobre identidades protegidas. Comprueba el plan antes de DELETE y disponibilidad de manifiestos
  protegidos después. Las etiquetas conservadas también deben apuntar al contenido correcto: conservar un digest
  no conserva automáticamente un alias. Eliminar manifiestos y recolectar blobs son operaciones distintas. No sustituyas
  recuperación por borrar volúmenes, TLS inseguro u otro registry.


  ## Eventos y reconciliación


  Un webhook conecta un evento con un receptor privado. Compara receptor, tipo, repositorio, rama y firma sin imprimir
  el secreto. La aceptación firmada difiere del sondeo periódico y de reconciliar correctamente. Usa el resultado
  del proveedor junto con la observación autenticada del receptor.


  Una Application vincula repositorio, ruta, revisión, proyecto y destino. Synced describe comparación con la fuente;
  Healthy describe salud de recursos. Ninguno demuestra la respuesta servida. Compara revisión, datos deseados,
  objeto Kubernetes y respuesta real sin cambiar un límite correcto.


  ## Publicación y adopción


  Una ConfigMap montada puede actualizar archivos proyectados mientras la aplicación sirve una copia del inicio.
  Puede requerirse actualización compatible o rollout. Conserva controlador y programa; compara cada pod activo
  propio con fuente y respuesta. Un objeto nuevo sano no conserva la identidad original.


  En app-of-apps el padre reconcilia una Application hija, y esta la carga. Sigue fuente y propietario en cada capa.
  Un generador ApplicationSet aporta parámetros a una plantilla; inspecciona también objetos generados. El controlador
  puede sobrescribir cambios directos. Conserva autoridad del repositorio, propietarios, namespace y publicación
  durante propagación.


  Una Application hija puede aplicar manifiestos válidos y aun así elegir una publicación antigua. Compara el origen montado con la respuesta HTTP. En una flota, contrasta la ruta y la referencia de cada Application con el commit resuelto. Varias ramas pueden apuntar temporalmente al mismo commit, por lo que coincidir en revisión no identifica por sí solo el origen previsto.


  Referencias: [API registry](https://distribution.github.io/distribution/spec/api/), [imágenes privadas](https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/),
  [webhooks Argo CD](https://argo-cd.readthedocs.io/en/stable/operator-manual/webhook/), [adopción ConfigMap](https://kubernetes.io/docs/tutorials/configuration/updating-configuration-via-a-configmap/).

  '
