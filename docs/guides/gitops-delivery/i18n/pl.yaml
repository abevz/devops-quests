heading: Naprawa prywatnego rejestru i GitOps
text: '# Naprawa prywatnego rejestru i GitOps


  Używaj wyłącznie jednorazowej zatoki zadania. Kubelet pobiera prywatny obraz przy użyciu Secret z tej samej przestrzeni nazw wskazanego w `imagePullSecrets`. Digest identyfikuje niezmienną treść obrazu; `imagePullPolicy: Always` powoduje sprawdzenie pobierania przy starcie. Przeczytaj `platform.env`, `private-release.json`, `board.json` i `registry-pull.json`, jeśli są dostarczone. Chroń dane dostępowe gry: nie wypisuj ich i nie zapisuj w historii terminala. Sprawdź zdarzenia Poda i poczekaj na `kubectl rollout status deployment/board --timeout=90s`; bieżący udany rollout nie dowodzi przyszłych pobrań.


  Application Argo CD wybiera repozytorium, ścieżkę, rewizję i cel. Kontroler uzgadnia stan asynchronicznie: `Synced` opisuje porównanie z Git, a `Healthy` kondycję zasobów. W układzie app-of-apps rodzic uzgadnia potomną Application, która uzgadnia workload. Porównaj oba obiekty z wysłanym commitem i zachowaj tożsamość rodzica. `wait-apps.sh` w zatoce sprawdza wymagane Application; ponów po uzgodnieniu zamiast zakładać natychmiastowy efekt.


  Generator listy ApplicationSet dostarcza parametry szablonowi Go; ścieżka taka jak `stations/{{.station}}` tworzy ścieżkę dla każdego wpisu. W zadaniu ApplicationSet mechanizm odpytywania gry przesyła jeden z dwóch ograniczonych manifestów z `applicationset.json` do prywatnego kontrolera. Jest to adapter z ograniczonym zakresem zmian, nie ogólne API kontrolera. Poczekaj na wygenerowane Application i sprawdź właściciela, rewizję, stan oraz odpowiedzi workloadu.


  Źródła: [prywatne obrazy](https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/), [generator listy Argo CD](https://argo-cd.readthedocs.io/en/stable/operator-manual/applicationset/Generators-List/), [szablony Go](https://argo-cd.readthedocs.io/en/stable/operator-manual/applicationset/GoTemplate/).

  '
