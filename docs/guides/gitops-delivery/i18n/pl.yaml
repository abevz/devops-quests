heading: Naprawa prywatnego rejestru i GitOps
text: '# Naprawa prywatnego rejestru i GitOps


  ## Rozdziel granice


  Dostępność registry, zaufanie transportu, tożsamość źródła i przyjęcie danych to odrębne obserwacje. Używaj tylko jednorazowej zatoki. Porównuj kontrakty z żywym API; zamrożone zapisy zachowują pierwotne zaufane źródło. Potwierdzenie sterowania opisuje działanie agenta, nie ciągłą dostępność, autoryzację lub przyjęcie danych.


  ## Konsumenci prywatnych obrazów {#private-image-consumers}


  Klient workstation i kubelet przechowują dane uwierzytelniające niezależnie. Udany uwierzytelniony odczyt nie aktualizuje Secret w namespace. Secret określa dane registry, ale nie instaluje CA w runtime węzła. Zachowaj endpoint, zaufanie certyfikatu, niezmienny obraz, tożsamość kontrolera i obiekt uwierzytelniania.


  Zdarzenia podów rozróżniają połączenie, certyfikat, autoryzację i brak manifestu. Always steruje rozwiązywaniem i pobieraniem; pamięć obrazu i kontener Ready nie dowodzą ważności zapisanych danych przy kolejnym pobraniu. Prywatnie porównaj Secret z zatwierdzonym źródłem oraz sprawdź rzeczywisty skrót i odwołania własnych podów.


  Ogólny przykład aktualizuje istniejący dozwolony Secret. Najpierw wybierz obiekt i dostarczoną tożsamość. Nie wypisuje danych uwierzytelniających; base64 to kodowanie, nie szyfrowanie. Obciążenie nadal musi odwoływać się do właściwego obiektu.


  ```bash

  set -euo pipefail

  set +x

  : "${DQ_PULL_SECRET:?select the existing authorized Secret}"

  : "${REGISTRY:?select the approved registry endpoint}"

  : "${REGISTRY_USER:?select the supplied registry identity}"

  : "${REGISTRY_PASSWORD:?load the private supplied credential}"

  export DQ_PULL_SECRET REGISTRY REGISTRY_USER REGISTRY_PASSWORD

  before=$(kubectl get secret "$DQ_PULL_SECRET" -o jsonpath=''{.metadata.uid}'')

  python3 -I - <<''PRIVATE_AUTH'' | kubectl apply -f - >/dev/null

  import base64,json,os

  auth=base64.b64encode((os.environ[''REGISTRY_USER'']+'':''+os.environ[''REGISTRY_PASSWORD'']).encode()).decode()

  config={''auths'':{os.environ[''REGISTRY'']:{''auth'':auth}}}

  secret={''apiVersion'':''v1'',''kind'':''Secret'',''metadata'':{''name'':os.environ[''DQ_PULL_SECRET'']},

  ''type'':''kubernetes.io/dockerconfigjson'',''data'':{''.dockerconfigjson'':base64.b64encode(json.dumps(config).encode()).decode()}}

  print(json.dumps(secret))

  PRIVATE_AUTH

  test "$(kubectl get secret "$DQ_PULL_SECRET" -o jsonpath=''{.metadata.uid}'')" = "$before"

  ```


  ## Retencja i zmienne odwołania


  Tag wskazuje manifest, a jego skrót określa dokładne bajty. Lokalny tag Docker nie aktualizuje zdalnego registry bez push manifestu. Porównaj listę tagów, odpowiedzi i zatwierdzony katalog skrótów. Uwzględniaj typy manifestów przy odczycie Docker-Content-Digest.


  Buduj retencję wokół chronionych tożsamości manifestów. Sprawdź plan przed DELETE i czytelność chronionych manifestów potem. Zachowane tagi także muszą wskazywać właściwą treść: zachowanie skrótu nie zachowuje automatycznie aliasu. Usuwanie manifestów i oczyszczanie blobów to odrębne działania. Nie zastępuj odzyskania usunięciem wolumenu, wyłączeniem TLS lub innym registry.


  ## Zdarzenia i uzgadnianie


  Webhook łączy zdarzenie źródła z prywatnym odbiornikiem. Porównuj odbiornik, typ, repozytorium, gałąź i podpis bez ujawniania sekretu. Przyjęcie podpisanego zdarzenia różni się od okresowego odpytywania i uzgodnienia źródła. Łącz wynik dostawcy z uwierzytelnioną obserwacją odbiornika.


  Application wiąże repozytorium, ścieżkę, rewizję, projekt i cel. Synced opisuje porównanie źródła, Healthy zdrowie zasobów. Żaden status nie dowodzi odpowiedzi aplikacji. Porównuj rewizję, dane, obiekt Kubernetes i rzeczywistą odpowiedź bez zmiany poprawnej granicy dostępu.


  ## Publikacja i przyjęcie


  Zamontowany ConfigMap może zmienić projekcję plików, gdy aplikacja nadal podaje kopię z początku procesu. Przyjęcie może wymagać obsługiwanego odświeżenia albo rollout. Zachowaj pierwotny kontroler i program; porównaj każdy aktywny należący do niego pod ze źródłem i odpowiedzią. Nowy zdrowy obiekt nie zachowuje pierwotnej tożsamości.


  W app-of-apps rodzic uzgadnia potomną Application, a ona obciążenie. Śledź źródło i właściciela na każdej warstwie. Generator ApplicationSet przekazuje parametry szablonowi; sprawdzaj także wygenerowane obiekty. Kontroler może nadpisać bezpośrednie zmiany. Zachowaj źródło repozytorium, właścicieli, namespace i publikację podczas propagacji.


  Aplikacja podrzędna może zastosować poprawne manifesty i wybrać starszą publikację. Porównaj zamontowane źródło z odpowiedzią HTTP. Dla floty porównaj ścieżkę i referencję docelową każdej Application z rozwiązanym commitem. Różne gałęzie mogą chwilowo wskazywać ten sam commit, więc zgodność rewizji nie wystarcza do potwierdzenia właściwego źródła.


  Dokumentacja: [API registry](https://distribution.github.io/distribution/spec/api/), [prywatne obrazy](https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/), [webhook Argo CD](https://argo-cd.readthedocs.io/en/stable/operator-manual/webhook/), [przyjęcie ConfigMap](https://kubernetes.io/docs/tutorials/configuration/updating-configuration-via-a-configmap/).


  ### Dane wejściowe kontroli Git {#git-environment}


  Kontrola Git zatrzymała się przed odczytem repozytorium; platform.env może nie istnieć, być nieczytelny lub kończyć się błędem podczas ładowania. Nie udało się sprawdzić zatwierdzonych komunikatów; platform.env, repozytorium, Git lub Python mogą być niedostępne przed kontrolą referencji. Pracuj w ~/quest i przywróć dostarczony platform.env, jeśli został usunięty; plik musi załadować się przed kontrolą Git. Fallback obejmuje też brak Pythona lub błąd uruchomienia Git.


  ### Pobieranie gałęzi dostarczania {#git-fetch}


  Pobranie main i release-candidate nie powiodło się; origin może mieć błędny URL, brak dostępu lub brak jednej z gałęzi. `git -C repository ls-remote --heads origin main release-candidate`.


  ### Bieżąca gałąź i drzewo robocze {#git-worktree}


  Bieżąca gałąź nie jest main lub nie można jej odczytać; repozytorium może nadal być na release-candidate albo w stanie detached HEAD. Drzewo robocze ma zmiany lub nieśledzone pliki; edycja mogła nie zostać zatwierdzona albo pozostały pliki tymczasowe. `git -C repository status --short --branch`.


  ### Komunikat w zatwierdzonych obiektach Git {#git-committed-notice}


  origin/main:notice.txt jest nieczytelny lub różni się od north-41; main mógł nie zostać wysłany albo pobrana referencja jest nieaktualna. HEAD:notice.txt jest nieczytelny lub różni się od north-41; lokalny main może nie zawierać zatwierdzenia kandydata mimo edycji pliku roboczego. `git -C repository show HEAD:notice.txt; git -C repository show origin/main:notice.txt`.


  ### Opublikowany commit i historia {#git-publication-history}


  Punkt bazowy nie istnieje, jest nieprawidłowy lub nie jest przodkiem origin/main; opublikowana historia mogła zostać zastąpiona zamiast rozszerzona. HEAD jest nieprawidłowy lub różni się od origin/main; lokalny commit mógł nie zostać wysłany albo referencja zdalna nie została odświeżona. `git -C repository rev-parse HEAD origin/main; git -C repository merge-base --is-ancestor "$(cat baseline-commit)" origin/main`.


  ### Dane kontroli prywatnej aplikacji {#registry-observation}


  Kontrola replik zatrzymała się przed odczytem board; platform.env może nie istnieć, być nieczytelny lub kończyć się błędem podczas ładowania. Nie udało się sprawdzić prywatnej aplikacji; zmienne środowiska, JSON API, właściciele Deployment lub jednoznaczny kontener worker mogą nie istnieć albo być nieprawidłowe. Kontrola poświadczeń zatrzymała się przed szczegółową diagnostyką; platform.env, zmienne rejestru lub Python mogą być niedostępne. Załaduj platform.env bez wypisywania haseł. Sprawdź Deployment board, ReplicaSety i Pody w przestrzeni bay: aktywne Pody nie są zakończone ani usuwane i należą do Deployment przez kontrolujący ReplicaSet według UID. Brak lub błędna tożsamość worker albo pull Secret może przerwać szczegółowe kontrole.


  ### Prywatny obraz w aktywnych Podach {#registry-pod-contract}


  Obraz worker w board lub aktywnych Podach różni się od PRIVATE_IMAGE; szablon mógł zostać zmieniony albo starszy ReplicaSet nadal używa innego obrazu. Worker w board lub aktywnym Podzie nie ma Always; ustawienia pamięci podręcznej lub Pody ze starszego szablonu mogą omijać nowe pobranie z rejestru. Nie znaleziono aktywnego Poda board lub jego efektywne pull Secrets różnią się od samego registry-pull; szablon lub ServiceAccount mógł dodać albo pominąć Secret. Porównaj szablon Deployment i jego aktualne Pody. Edycja szablonu nie zmienia istniejącego Poda; nowy rollout musi go zastąpić. ServiceAccount może dodać efektywne imagePullSecrets przy tworzeniu, więc sprawdź specyfikacje Podów oraz board.yaml.


  ### Żądana liczba prywatnych odbiorców {#registry-replicas}


  Żądana liczba replik nie wynosi 1 lub board jest nieczytelny; skalowanie w dół nie naprawia uwierzytelniania prywatnego obrazu. `kubectl get deployment board -o jsonpath=''{.spec.replicas}''`.


  ### Dokument poświadczeń Docker {#registry-credential-document}


  registry-pull nie ma obsługiwanego typu poświadczeń Docker; ogólny Secret lub brak czytelnego typu nie zapewnia danych logowania do rejestru. Nie można zdekodować dokumentu poświadczeń Docker; wymagany klucz data, base64, JSON lub unikalność pól JSON mogą być nieprawidłowe. Typ kubernetes.io/dockerconfigjson wymaga data[".dockerconfigjson"] z base64 JSON {"auths":{...}}; kubernetes.io/dockercfg wymaga data[".dockercfg"] z bezpośrednią mapą rejestrów. Powtórzone klucze JSON są odrzucane. Sprawdzaj strukturę bez ujawniania wartości poświadczeń.


  ### Wpis rejestru i zmienione poświadczenia {#registry-credential-auth}


  Dane uwierzytelniania są nieczytelne lub bezużyteczne; sprawdź dokładny wpis rejestru, base64 auth z dwukropkiem lub tekstowe pola username/password. Zdekodowane poświadczenia różnią się od platform.env; registry-pull może nadal zawierać stare hasło lub dane innego użytkownika. Klucz wpisu musi dokładnie odpowiadać REGISTRY. Niepuste auth ma pierwszeństwo przed username/password i musi dekodować się do dostarczonego użytkownika, dwukropka i hasła; dodanie osobnych pól nie naprawia starego auth. Aktualizacja Secret nie dowodzi nowego pobrania; sprawdź oddzielnie rollout i HTTP.


  ### Gotowość i HTTP prywatnego odbiorcy {#registry-consumer-health}


  board nie zakończył rollout w 3 sekundy; odrzucone poświadczenia rejestru, ponawianie pobrania obrazu lub awaria worker mogą blokować gotowość. Worker nie zwrócił north-42 na localhost:8080; może jeszcze nie działać, exec mógł się nie udać lub zmieniono polecenie HTTP albo treść. `kubectl describe pods; kubectl rollout status deployment/board --timeout=10s`.


  ### Źródło i cel Application {#argo-source-contract}


  Źródło lub cel Application nie odpowiada dostarczonemu wydaniu albo dane są nieczytelne; początkowa ścieżka retired nie wskazuje manifests na main. `kubectl get application station -o jsonpath=''{.spec}''; cat application.yaml repository/manifests/board.yaml`. Sprawdź project station, dostarczony GIT_URL, targetRevision main, względny katalog manifests i przestrzeń bay. Lokalny klaster wybiera server https://kubernetes.default.svc bez name albo name in-cluster bez server. Ścieżki absolutne i przejścia do katalogu nadrzędnego nie wskazują wymaganego katalogu.


  ### Obserwowana rewizja, synchronizacja i kondycja {#argo-observed-revision}


  Nie potwierdzono Synced i Healthy na zdalnym main; uzgadnianie może blokować ścieżka źródła, dostęp do repozytorium, niezdrowe zasoby lub nieczytelna referencja zdalna. `git -C repository ls-remote origin refs/heads/main; kubectl get application station -o jsonpath=''{.status}''; kubectl describe application station`. Ładowanie platform.env lub uruchomienie Git, kubectl albo jq mogło też zakończyć się błędem przed odczytem stanu.


  ### Rollout i odpowiedź odbiorcy {#argo-consumer-health}


  Rollout board nie powiódł się lub przekroczył 3 sekundy; Argo mógł jeszcze nie zastosować manifestów albo worker pozostaje niedostępny. Odpowiedź worker nie była north-43 albo exec się nie powiódł; aplikacja zarządzana przez Git może nie istnieć, nie być gotowa lub zwracać zmienioną treść. `kubectl rollout status deployment/board --timeout=10s; kubectl exec deployment/board -c worker -- wget -qO- http://127.0.0.1:8080`.


  ### Kontrola docelowego digest obrazu {#private-digest-observation}


  Nie potwierdzono docelowego prywatnego obrazu i gotowego Poda z tym samym digest; parcel:stable może nadal wybierać inny obraz, bieżący worker nie jest gotowy z wymaganym digest albo środowisko lub API są niedostępne. Porównaj intended z release-catalog.txt z szablonem board i bieżącym gotowym worker należącym do Deployment. PRIVATE_IMAGE musi używać wymaganego digest sha256, a obserwowany imageID musi pasować. Początkowy parcel:stable to osobny obraz z inną etykietą, lecz z tą samą odpowiedzią HTTP; samo HTTP nie dowodzi tożsamości. JSON API, zmienne środowiska oraz tożsamości worker i kontrolera muszą być czytelne.


  ### Efektywne ustawienia pobierania bieżących Podów {#private-consumer-pull-contract}


  Nie potwierdzono Always i wyłącznie registry-pull w aktywnych Podach board; przyczyną mogą być stare szablony, efektywne referencje pull Secret, brak bieżących Podów lub nieczytelne dane środowiska albo API. Sprawdź szablon Deployment i wszystkie bieżące Pody należące przez kontrolujące ReplicaSety. Worker szablonu i każdy bieżący worker wymagają Always; efektywny pull Secret Podów to wyłącznie registry-pull. Różnice mogą wynikać ze starych szablonów i ServiceAccount. Warunek obserwuje politykę pobierania i nazwy Secret. Przy błędach pobierania osobno sprawdź uwierzytelnianie registry-pull.


  ### Gotowość po przypięciu obrazu {#private-digest-readiness}


  Deployment board nie zakończył rollout w 3 sekundy; nowy obraz może jeszcze być pobierany, poświadczenia lub planowanie blokują start albo obserwacja zawiodła. `kubectl describe pods; kubectl rollout status deployment/board --timeout=10s`.


  ### HTTP oddzielnie od tożsamości obrazu {#private-digest-http}


  Worker nie zwrócił north-49 na localhost:8080 lub exec zawiódł; Pod może nie być gotowy lub zmieniło się polecenie HTTP albo treść mimo poprawnie zadeklarowanego obrazu. `kubectl exec deployment/board -c worker -- wget -qO- http://127.0.0.1:8080`.



  ### Zachowanie pierwotnego Secret repozytorium {#delivery-original-secret-identity}


  UID Secret repozytorium zmienił się; odtworzenie station-repository zachowuje nazwę, lecz traci pierwotny obiekt poświadczeń zapisany przy setup.  `source platform.env; kubectl -n "$ARGO_NAMESPACE" get secret station-repository -o jsonpath=''{.metadata.uid}''`.


  ### Tożsamość repozytorium w Secret {#delivery-secret-repository-binding}


  Pierwotny Secret nie wskazuje dostarczonego repozytorium i konta Git jako poświadczeń Argo; stary URL, zmienione username/type lub brak etykiety repository blokują użycie.  `cat delivery-access.json`.


  ### Przywrócenie zatwierdzonego hasła repozytorium {#delivery-approved-secret-password}


  Hasło Secret nie odpowiada chronionej zatwierdzonej wartości; dostarczone stare hasło lub niepełna naprawa poświadczeń może blokować uwierzytelnienie Argo w pierwotnym repozytorium.  `cat delivery-access.json`.


  ### Zachowanie pierwotnego Application {#delivery-original-application-identity}


  UID Application board zmienił się; usunięcie i odtworzenie zastępuje pierwotną tożsamość dostarczenia mimo zachowania nazwy i manifestów.  `kubectl get application board -o jsonpath=''{.metadata.uid}''`.


  ### Prywatna konfiguracja Git z poświadczeniami {#delivery-private-git-configuration}


  Sprawdzana konfiguracja Git zawiera hasło lub kodowanie Basic i przyznaje prawa grupie/innym; zapis naprawionego nagłówka w szeroko dostępnej konfiguracji może ujawnić działające poświadczenie. Kontrola bada ~/.gitconfig i repository/.git/config, gdy zawierają bieżące hasło Secret lub jego kodowanie Basic. Takie pliki nie mogą mieć bitów praw grupy/innych; konfiguracja bez tych bajtów nie musi mieć tego trybu według tego warunku. Sprawdź tryby bez wyświetlania poświadczeń. `stat -c "%a %n" ~/.gitconfig repository/.git/config`.


  ### Bezpośredni dostęp do pierwotnego repozytorium {#delivery-direct-git-authority}


  Git rozwiązuje dostarczony URL na inny adres lub ścieżkę; przepisanie URL może kierować workstation do innego repozytorium mimo przypadkowo zgodnej gałęzi. Rozwiązany URL musi zachować schemat, hostname, port i ścieżkę bez końcowego ukośnika; dane uwierzytelnienia w URL nie zmieniają porównania. Query lub fragment unieważnia obserwację. Zgodny main w innym repozytorium nie potwierdza bezpośredniego dostępu do pierwotnego. `git -C repository config --show-origin --name-only --get-regexp "url.*"`.


  ### Uwierzytelnienie i obserwacja zdalnego main {#delivery-authenticated-remote-main}


  Nie można odpytać pierwotnego repozytorium lub main różni się od chronionego wydania; stary nagłówek Authorization na workstation, brak dostępu lub zmieniona zdalna publikacja mogą to wyjaśniać.  `source platform.env; git -C repository ls-remote "$GIT_URL" refs/heads/main`.


  ### Obserwacja dostępu w limicie czasu {#delivery-access-observation-budget}


  Obserwacja Git lub Kubernetes przekroczyła limit polecenia lub całości; wolne API, sieć lub endpoint uwierzytelnienia blokują terminowe porównanie dostępu.  `kubectl --request-timeout=2s get application board -o json`.


  ### Czytelne dane dostępu i obiekty API {#delivery-access-observation-inputs}


  Nie dało się obserwować dostępu; brak chronionego zapisu lub obiektów, błędny JSON/kodowanie poświadczeń, nieczytelna konfiguracja Git lub błędy API mogą to wyjaśniać.  `cat delivery-access.json; kubectl get application board -o json`.


  ### Warunek hasła Secret i start obserwacji {#delivery-password-gate-and-startup}


  Porównanie hasła Secret w kontroli legacy zawiodło lub próba zakończyła się przed markerem; nienaprawione hasło, zmienione oczekiwanie platform.env lub niedostępne dane środowiska/Python mogą to wyjaśniać.  `test -r platform.env; command -v python3`.


  ### Wąskie prawo naprawy jednego Secret {#delivery-scoped-secret-permissions}


  Nie potwierdzono wymaganego wąskiego dostępu do Secret; brak patch dla station-repository, zły namespace, szersze list/prawa innego Secret lub niedostępne platform.env lub API mogą to wyjaśniać.  `source platform.env; kubectl auth can-i patch secret/station-repository -n "$ARGO_NAMESPACE"; kubectl auth can-i list secrets -n "$ARGO_NAMESPACE"; kubectl auth can-i patch secret/unrelated -n "$ARGO_NAMESPACE"`.


  ### Wybór właściwego źródła Git {#delivery-board-git-source}


  Application board nie wybiera dostarczonego repozytorium, względnej ścieżki manifests i rewizji main lub nie odczytano definicji; stare lub zmienione źródło może uzgadniać inną publikację.  `kubectl get application board -o json`.


  ### Obserwacja przyjęcia opublikowanego wydania {#delivery-board-release-adoption}


  Application board nie jest Synced i Healthy przy release-commit lub nie odczytano statusu; naprawione poświadczenia mogą wymagać refresh i uzgodnienia albo wybrane wydanie różni się od obserwowanej rewizji.  `cat release-commit; kubectl get application board -o json`.


  ### Ukończenie rollout dostarczonej aplikacji {#delivery-board-workload-rollout}


  Deployment board nie ukończył rollout w 3 sekundy; dostarczenie Git mogło jeszcze nie utworzyć aplikacji, Pody są niedostępne lub obserwacja API zawiodła.  `kubectl rollout status deployment/board --timeout=10s`.


  ### Obserwacja odpowiedzi Service dla odbiorcy {#delivery-board-service-response}


  Ścieżka Service board nie zwróciła north-61 lub exec/HTTP zawiódł; niedostarczona aplikacja, błędny routing Service lub stara treść blokuje dotarcie publikacji do odbiorcy.  `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080`.



  ### Wybór wyłącznie zatwierdzonego obsolete digest {#retention-approved-obsolete-selection}


  Plan retention nie wybiera wyłącznie chronionego obsolete digest lub jest nieczytelny; dostarczony plan wybiera rollback, a wybór według zmiennego tagu lub edytowanego katalogu może trafić w chronione wydanie.  `cat retention.json release-catalog.json`.


  ### Zachowane manifesty i opublikowane aliasy {#retention-original-registry-and-aliases}


  Pierwotny registry nie potwierdził stanów manifestów i aliasów; obsolete może pozostać, chronionego digest brakować lub current wskazywać rollback, a zmieniona authority, dane logowania, zaufanie CA, nagłówki digest lub błędy obserwacji też to wyjaśniają. Dostarczony current opublikowano jako rollback po zapisaniu katalogu. Samo usunięcie obsolete nie naprawia aliasu. Sprawdź 200 dla chronionych current/rollback, 404 dla obsolete, current wskazujący zatwierdzony current digest i tag 1 wskazujący rollback. Użyj pierwotnego endpoint, konta i CA z TLS bez podmiany redirect/proxy, zgodnym digest treści i Docker-Content-Digest. Lokalny tag wymaga push dla zdalnego aliasu; usunięcie manifestu nie potwierdza odśmiecania blobs. `cat release-catalog.json registry-source.json; cat retention.json`.

  '
