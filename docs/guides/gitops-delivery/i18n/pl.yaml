  ### Naprawa celu istniejącego hook {#hook-existing-receiver-configuration}


  Dostarczony hook wskazuje nieaktualny URL odbiorcy; porównaj istniejący hook z zamrożonym adresem, zdarzeniem push JSON i gałęzią main. Błędy API lub środowiska też zatrzymują kontrolę. Setup już wypycha zatwierdzoną publikację, ale istniejący hook wskazuje stary URL. Popraw pierwotny hook i dostarcz przyjęte zdarzenie. Serwer kopiuje zamontowane wejście tylko przy starcie; nowe Pod przez rollout są dozwolone przy zachowaniu pierwotnego controller i specyfikacji template.  `curl -fsS -u "$GIT_USER:$GIT_PASSWORD" "${GIT_URL%/rail/station.git}/api/v1/repos/rail/station/hooks/$(cat /run/dq/facts/0/hook-id)" | jq ''{active,type,url:.config.url,content_type:.config.content_type,events,branch_filter}''`.


  ### Wydanie jest już opublikowane {#hook-already-published-descendant-revision}


  Setup już opublikował docelowego potomka; błąd fetch, niezgodny release-commit lub utrata przodka narusza kontrolę. Porównaj istniejące zapisy z origin/main przed nowym commitem. Setup już wypycha zatwierdzoną publikację, ale istniejący hook wskazuje stary URL. Popraw pierwotny hook i dostarcz przyjęte zdarzenie. Serwer kopiuje zamontowane wejście tylko przy starcie; nowe Pod przez rollout są dozwolone przy zachowaniu pierwotnego controller i specyfikacji template.  `git -C repository fetch origin main; git -C repository log --oneline -3 origin/main; cat release-commit`.


  ### Zachowanie prywatnego źródła Git {#hook-application-private-source}


  Application może wybierać inne repozytorium, gałąź lub katalog; zachowaj dostarczone prywatne źródło Git i znormalizowaną ścieżkę manifests. Setup już wypycha zatwierdzoną publikację, ale istniejący hook wskazuje stary URL. Popraw pierwotny hook i dostarcz przyjęte zdarzenie. Serwer kopiuje zamontowane wejście tylko przy starcie; nowe Pod przez rollout są dozwolone przy zachowaniu pierwotnego controller i specyfikacji template.  `kubectl get application board -o json | jq .spec.source`.


  ### Uzgodnienie docelowej rewizji {#hook-application-reconciled-target}


  Docelowa rewizja mogła jeszcze nie zostać uzgodniona lub Application jest niesprawny; porównaj sync status i revision z release-commit po naprawie dostarczania zdarzeń. Setup już wypycha zatwierdzoną publikację, ale istniejący hook wskazuje stary URL. Popraw pierwotny hook i dostarcz przyjęte zdarzenie. Serwer kopiuje zamontowane wejście tylko przy starcie; nowe Pod przez rollout są dozwolone przy zachowaniu pierwotnego controller i specyfikacji template.  `kubectl get application board -o json | jq .status`.


  ### Gotowe Pod przy rollout {#hook-current-rollout-readiness}


  Bieżące Pod mogą nie być gotowe przy przyjęciu danych lub po rollout; sprawdź events i rollout status, zachowując pierwotny Deployment i specyfikację pod template. Setup już wypycha zatwierdzoną publikację, ale istniejący hook wskazuje stary URL. Popraw pierwotny hook i dostarcz przyjęte zdarzenie. Serwer kopiuje zamontowane wejście tylko przy starcie; nowe Pod przez rollout są dozwolone przy zachowaniu pierwotnego controller i specyfikacji template.  `kubectl rollout status deployment/board --timeout=3s`.


  ### Przyjęcie publikacji przez nowe Pod {#hook-configmap-adoption-in-current-pod}


  Dostarczony serwer kopiuje notice ConfigMap tylko przy starcie; uzgodnione dane mogą pozostawić stary HTTP do nowych Pod przez rollout pierwotnego Deployment. Zastąpione tożsamości, zmienione źródło/template, niegotowy Pod, błędny HTTP lub błędy obserwacji też zawodzą. Setup już wypycha zatwierdzoną publikację, ale istniejący hook wskazuje stary URL. Popraw pierwotny hook i dostarcz przyjęte zdarzenie. Serwer kopiuje zamontowane wejście tylko przy starcie; nowe Pod przez rollout są dozwolone przy zachowaniu pierwotnego controller i specyfikacji template. Dla webhook zachowaj pierwotne UID/spec Application, UID/selector/jedną replikę/cały template.spec Deployment i UID/całe zatwierdzone data ConfigMap. Jedyny bieżący własny Pod musi być gotowy z pierwotnym niezmiennym image, command/args i read-only mounts oraz serwować notice. `kubectl get configmap board-publication -o json | jq .data; kubectl get pods -o wide`.


  ### Odbiorca przyjmuje właściwe zdarzenie {#hook-server-owned-accepted-event-receipt}


  Odbiorca mógł nie przyjąć push przez błędny URL, secret lub filtr zdarzeń hook; sprawdź przyjęcie przez serwer i ponów dostarczanie. Samo żądanie HTTP nie tworzy chronionego potwierdzenia. Setup już wypycha zatwierdzoną publikację, ale istniejący hook wskazuje stary URL. Popraw pierwotny hook i dostarcz przyjęte zdarzenie. Serwer kopiuje zamontowane wejście tylko przy starcie; nowe Pod przez rollout są dozwolone przy zachowaniu pierwotnego controller i specyfikacji template.  `jq ''{repo,branch,authenticated}'' /run/dq/observations/webhook.json`.



  ### Start przypisanego registry {#private-registry-original-start-interface}


  Pierwotny registry jest zatrzymany; złóż obsługiwane żądanie action:start i poczekaj na odpytywanie celów. Brak/błędna struktura żądania, TLS-trust lub autoryzacja mogą blokować pierwotny HTTPS API. Dostarczony registry jest zatrzymany, istniejący pull Secret ma stare credentials, a pierwotny Deployment ma zero replik. Najpierw użyj opisanego interfejsu start przy odpytywaniu celów, potem zaktualizuj istniejący Secret i skaluj pierwotny Deployment do jednej repliki. Zachowaj źródło, trust i pod specification. control/README.md opisuje zwykły UTF-8 registry-repair.json do 4096 bajtów z obiektem dokładnie action:start. Odpytywanie uruchamia tylko przypisaną istniejącą usługę. Odpowiedź idle/rejected/started nie gwarantuje poprawnego uwierzytelnionego API. `jq . registry-repair.json; jq . registry-agent-status.json`.


  ### Pierwotne authority, trust i credential {#private-registry-original-authority-and-pull-credential}


  Dostarczony pull Secret ma stary password; popraw credentials bez odtwarzania UID, zachowując pierwotne registry credentials i CA. Niegotowy image, zmienione źródło/trust, błąd manifestu lub obserwacji też daje fallback. Dostarczony registry jest zatrzymany, istniejący pull Secret ma stare credentials, a pierwotny Deployment ma zero replik. Najpierw użyj opisanego interfejsu start przy odpytywaniu celów, potem zaktualizuj istniejący Secret i skaluj pierwotny Deployment do jednej repliki. Zachowaj źródło, trust i pod specification. Porównaj pierwotne endpoint/user/password hash i dokładne bajty CA; obserwuj zatwierdzony manifest przez sprawdzony TLS bez proxy/redirect, z ograniczonym body i zgodnym obliczonym/header digest. Aktualizuj istniejący UID Secret z dokładnym registry-entry; dopuszczalne Docker config JSON lub dockercfg i auth lub username/password. Nie wypisuj credentials. Starsza kontrola ready-image/pull-reference oraz źródła/credentials są niezależne; błędy i limity czasu dzielą fallback. `kubectl get secret registry-pull -o json | jq ''{uid:.metadata.uid,type,keys:(.data|keys)}''`.


  ### Zadeklarowany image i żywy wynik pull {#private-registry-declared-always-pull-and-ready-digest}


  Zadeklarowany image, polityka Always lub odwołanie registry-pull może się różnić albo gotowy Pod nie zgłasza oczekiwanego digest; zachowaj dostarczoną pull policy i sprawdź żywy wynik image. Dostarczony registry jest zatrzymany, istniejący pull Secret ma stare credentials, a pierwotny Deployment ma zero replik. Najpierw użyj opisanego interfejsu start przy odpytywaniu celów, potem zaktualizuj istniejący Secret i skaluj pierwotny Deployment do jednej repliki. Zachowaj źródło, trust i pod specification.  `kubectl get deployment board -o json | jq ''{containers:.spec.template.spec.containers,pull:.spec.template.spec.imagePullSecrets}''`.


  ### Jeden gotowy pierwotny odbiorca {#private-registry-original-controller-and-one-ready-consumer}


  Deployment zaczyna od zera replik; skaluj pierwotny controller do jednej po naprawie Secret. Zmienione UID/template, niegotowy lub dodatkowy własny Pod, błędne pull odwołanie albo rollout/API też naruszają kontrolę. Dostarczony registry jest zatrzymany, istniejący pull Secret ma stare credentials, a pierwotny Deployment ma zero replik. Najpierw użyj opisanego interfejsu start przy odpytywaniu celów, potem zaktualizuj istniejący Secret i skaluj pierwotny Deployment do jednej repliki. Zachowaj źródło, trust i pod specification.  `kubectl get deployment board -o json | jq ''{uid:.metadata.uid,replicas:.spec.replicas,template:.spec.template.spec}''; kubectl get pods -o wide`.


  ### Rzeczywista odpowiedź HTTP odbiorcy {#private-registry-running-consumer-response}


  Pierwotny odbiorca może nadal być niedostępny po image pull lub zwracać inną trasę; sprawdź rollout i rzeczywisty HTTP worker zamiast samej gotowości registry. Dostarczony registry jest zatrzymany, istniejący pull Secret ma stare credentials, a pierwotny Deployment ma zero replik. Najpierw użyj opisanego interfejsu start przy odpytywaniu celów, potem zaktualizuj istniejący Secret i skaluj pierwotny Deployment do jednej repliki. Zachowaj źródło, trust i pod specification.  `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://127.0.0.1:8080`.



  ### Odczyt dostarczonych danych {#private-git-provided-input-startup}


  Dostarczony platform.env może być brakujący, nieczytelny lub błędny, albo obserwacja kończy się przed nazwanym wynikiem; sprawdź składnię i wymagane zmienne bez wypisywania credentials. Fallback pojawia się tylko po błędzie grupy bez jej szczegółowego markera.  `test -r platform.env; bash -n platform.env`.


  ### Repozytorium źródła {#private-git-source-repository}


  Aplikacja może wskazywać inne repozytorium albo nie udał się odczyt API; porównaj repoURL z dostarczonym GIT_URL.  `kubectl get application board -o json | jq .spec.source.repoURL`.


  ### Ścieżka katalogu manifestów {#private-git-manifest-path}


  Setup pozostawia ścieżkę retired; źródło musi prowadzić do względnego katalogu manifests bez ścieżki bezwzględnej ani przejścia do rodzica.  `kubectl get application board -o json | jq .spec.source.path`.


  ### Śledzona gałąź {#private-git-tracked-branch}


  Aplikacja może śledzić inną referencję lub mieć nieczytelne źródło; targetRevision ma wskazywać main.  `kubectl get application board -o json | jq .spec.source.targetRevision`.


  ### Obserwacja uzgodnienia {#private-git-reconciliation}


  Błędna ścieżka, nieopublikowana zmiana lub błąd uzgodnienia mogą pozostawić sync.status inne niż Synced; sprawdź conditions i revision aplikacji.  `kubectl get application board -o json | jq .status`.


  ### Rewizja bieżącego etapu {#private-git-stage-revision}


  Oczekiwany commit może brakować albo aplikacja zgłasza starszą revision: pierwszy etap używa zamrożonego baseline, drugi opublikowanego roboczego release-commit. Sam Synced nie dowodzi zgodności.  `cat /run/dq/facts/0/baseline-commit release-commit; kubectl get application board -o json | jq .status.sync.revision`.


  ### Automatyczne uzgadnianie {#private-git-automated-reconciliation}


  Automatyczne uzgadnianie mogło zostać usunięte lub wyłączone; selfHeal musi być true w obu etapach, a prune jest dodatkowo wymagane w etapie wydania.  `kubectl get application board -o json | jq .spec.syncPolicy.automated`.


  ### Zdrowie po publikacji {#private-git-release-health}


  Aplikacja może być Synced mimo braku startu prywatnego image; sprawdź health conditions i zdarzenia Pod. Healthy wymagane jest w etapie wydania, nie przy początkowej naprawie ścieżki.  `kubectl get application board -o json | jq .status.health; kubectl get pods`.


  ### Początkowe wymagania pull {#private-git-initial-pull-contract}


  Always może brakować w nazwanym kontenerze lub bieżących należących Pod, albo skuteczne odwołania pull różnią się od jedynego registry-pull; błędy API i struktury też dają secrets. Etap wymaga aktywnych Pod, jeszcze bez zatwierdzonego image wydania ani gotowości.  `kubectl get deployment board -o json | jq .spec.template.spec; kubectl get pods -o json`.


  ### Publikacja nowego potomnego commita {#private-git-published-descendant}


  Wydanie może pozostać lokalne, fetch zawieść, release-commit wskazywać inny remote head lub historia zostać zastąpiona. Opublikuj nowego potomka baseline do origin/main i zapisz go w release-commit; ponowna publikacja baseline nie wystarcza.  `git -C repository fetch origin main; git -C repository log --oneline -3 origin/main; cat release-commit`.


  ### Kontrola opublikowanego manifestu {#private-git-published-manifest}


  Opublikowany manifests/board.yaml może zachować mutable retired image, pominąć Always lub używać innych odwołań pull. Image nazwanego kontenera musi być dokładnie równy zamrożonemu wydaniu; pusty wykaz template może dziedziczyć registry-pull z żywego ServiceAccount. Błędy fetch, parsowania i API też dają git_image.  `git -C repository show origin/main:manifests/board.yaml; jq .image /run/dq/facts/0/private-release.json`.


  ### Porównanie żywego template {#private-git-live-template}


  Poprawiony plik Git mógł jeszcze nie trafić do żywego nazwanego kontenera; porównaj dokładny zamrożony image i Always. Błędy API, brak kontenera i wadliwa struktura też dają live_image.  `kubectl get deployment board -o json | jq .spec.template.spec.containers`.


  ### Obserwacja gotowego prywatnego image {#private-git-ready-private-image}


  Rollout może być blokowany przez pull lub readiness, albo bieżący należący Pod jeszcze nie uruchamia dokładnego image z digest w stanie ready/running. Sam template nie wystarcza; błędy API i zamrożonych danych też dają image_id.  `kubectl rollout status deployment/board --timeout=3s; kubectl get pods -o json | jq .items[].status.containerStatuses`.


  ### Obserwacja digest z uwierzytelnieniem {#private-git-authenticated-digest}


  Pole zamrożonego image może brakować albo żądanie registry zawieść przez endpoint, credentials, CA lub dostępność. Kontrola żąda zamrożonego digest przez authenticated TLS z roboczymi platform.env i registry-ca.crt; nie porównuje hash endpoint ani credentials z pierwotną authority.  `jq .image /run/dq/facts/0/private-release.json; test -r registry-ca.crt`.


  ### Odpowiedź Service {#private-git-service-response}


  Proces może zwracać starą odpowiedź lub routing Service nie działać; rzeczywiste żądanie na port 8080 po rollout ma zwrócić north-80.  `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080`.


  ### initial: start obserwacji {#private-git-initial-observer-startup}


  Obserwacja initial może zakończyć się przy odczycie platform.env lub ładowaniu Python helpers przed szczegółowym wynikiem; sprawdź dane i dostępność dq_check. Nazwane błędy image, policy, pull lub API zachowują własne markery.  `test -r platform.env; bash -n platform.env; python3 -I -c "import dq_check"`.


  ### Git: start obserwacji {#private-git-git-observer-startup}


  Obserwacja Git może zakończyć się przy odczycie platform.env lub ładowaniu Python helpers przed szczegółowym wynikiem; sprawdź dane i dostępność dq_check. Nazwane błędy image, policy, pull lub API zachowują własne markery.  `test -r platform.env; bash -n platform.env; python3 -I -c "import dq_check"`.


  ### live: start obserwacji {#private-git-live-observer-startup}


  Obserwacja live może zakończyć się przy odczycie platform.env lub ładowaniu Python helpers przed szczegółowym wynikiem; sprawdź dane i dostępność dq_check. Nazwane błędy image, policy, pull lub API zachowują własne markery.  `test -r platform.env; bash -n platform.env; python3 -I -c "import dq_check"`.


  ### ready: start obserwacji {#private-git-ready-observer-startup}


  Obserwacja ready może zakończyć się przy odczycie platform.env lub ładowaniu Python helpers przed szczegółowym wynikiem; sprawdź dane i dostępność dq_check. Nazwane błędy image, policy, pull lub API zachowują własne markery.  `test -r platform.env; bash -n platform.env; python3 -I -c "import dq_check"`.



  ### Porównanie opublikowanego release head {#image-source-record-published-release-head}


  release-commit może nadal wskazywać poprzedni deployment po publikacji rekordu albo platform input lub private Git fetch zawodzi; porównaj pobrany origin/main z bieżącym potwierdzeniem wydania stacji.  `git -C repository fetch origin main; git -C repository rev-parse origin/main; cat release-commit`.


  ### Zachowanie prywatnego źródła Git {#image-source-record-retained-git-source}


  Aplikacja mogła zostać skierowana do innego repozytorium, gałęzi lub katalogu albo odczyt wejść/API zawodzi; zachowaj dostarczony Git URL, gałąź main i względną ścieżkę do manifests bez przejścia do rodzica.  `test -r platform.env; kubectl get application board -o json | jq .spec.source`.


  ### Bieżące uzgodnione wydanie {#image-source-record-current-reconciled-release}


  Aplikacja może nadal zgłaszać starszą revision, być niezdrowa lub mieć wyłączone self-healing/pruning; czekaj na Synced i Healthy dla release-commit z obiema flagami true. Same statusy nie dowodzą odświeżenia już zamontowanego pliku metadata.  `cat release-commit; kubectl get application board -o json | jq "{automation:.spec.syncPolicy.automated,status:.status}"`.


  ### Oczekiwanie na rollout workload {#image-source-record-workload-readiness}


  Bieżący rollout może nadal się uzgadniać albo przygotowanie image i gotowość kontenera blokują go; sprawdź istniejące Pod i zdarzenia, zachowując dostarczony niezmienny image aplikacji.  `kubectl rollout status deployment/board --timeout=3s; kubectl get pods -o wide; kubectl describe deployment board`.


  ### Dostępność głównego endpoint {#image-source-record-main-endpoint}


  Główny Service może być niedostępny lub naprawa metadata zasłoniła pierwotną stronę image; zachowaj odpowiedź north-91 przy publikacji source record. Sama odpowiedź metadata nie spełnia osobnego warunku głównego endpoint.  `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080`.


  ### Rzeczywiste źródło image {#image-source-record-verified-source-observation}


  Raport może być nadal pusty lub używać deployment commit zamiast wcześniejszego rzeczywistego source commit image; porównaj zamrożony image, bajty registry manifest, revision metadata i Git history. Błędy wejść, registry, API lub późniejszego odczytu dostarczenia rekordu też dają fallback przed nazwanym porównaniem. Zamrożone potwierdzenie zawiera commitment znormalizowanego JSON z dokładnie image, commit i repo bez kopiowalnej odpowiedzi. Source commit różni się od release-commit, jest przodkiem origin/main i zawiera dostarczoną stronę. Rzeczywisty manifest body ma hash zgodny z image digest, revision label config wskazuje source commit. Żywy nazwany image odpowiada dokładnie raportowi, bieżący należący ready kontener uruchamia digest. Nieużywane credential helpers nie dodają kontroli Secret data ani pull policy. To obserwacje traceability, nie podpis ani dowód zaufanej kompilacji. `jq . provenance.json; git -C repository log --oneline -4 origin/main; kubectl get deployment board -o json | jq .spec.template.spec.containers[].image`.


  ### Publikacja i przyjęcie tego samego source record {#image-source-record-published-and-mounted-record}


  Opublikowany manifest lub żywy ConfigMap może zachować początkowy pusty rekord, albo istniejący Pod stary plik subPath po zmianie ConfigMap. Opublikuj zweryfikowany raport przez Git i odśwież odbiorcę do zgodności published, live i served JSON. Błąd traceability observer zatrzymuje wykonanie przed porównaniem delivery. Po weryfikacji dane Git manifest, żywego ConfigMap i HTTP JSON mają odpowiadać raportowi. Błędy odczytu przed porównaniem Python dzielą fallback traceability. Istniejący plik ma mount subPath: po publikacji rekordu i aktualizacji release-commit rozwiązanie odświeża aplikację i wymienia Pod przez rollout restart, aby przyjął nowy plik. `git -C repository show origin/main:manifests/provenance.yaml; kubectl get configmap build-record -o json | jq .data; kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080/provenance.json`.



  ### Odzyskanie bez usuwania historii {#forward-rollback-retained-faulty-history}


  Reset main do zdrowego commitu usuwa wymagane pochodzenie od faulty-commit, a stary release-commit może nadal wskazywać błędny lub wcześniejszy head. Cofnij zmianę nowym commitem, opublikuj dalsze odzyskiwanie i ustaw robocze potwierdzenie na pobrany origin/main. Błędy wejść, fetch i polecenia ancestry też dają marker. `git -C repository fetch origin main; git -C repository log --oneline -5 origin/main; cat release-commit; git -C repository merge-base --is-ancestor "$(cat /run/dq/facts/0/faulty-commit)" origin/main`.


  ### Zachowanie głównego źródła Git {#forward-rollback-retained-main-source}


  Przekierowanie Application board do innego repozytorium, gałęzi lub katalogu omija źródło odzyskiwania. Zachowaj dostarczony Git URL, cel main i względną ścieżkę do manifests bez przejścia do rodzica. Brak danych platformy, błąd API lub porównania JSON też daje marker. `test -r platform.env; kubectl get application board -o json | jq .spec.source`.


  ### Uzgodniona rewizja main {#forward-rollback-reconciled-main-revision}


  Producent może nadal uzgadniać błędną rewizję, być niezdrowy lub mieć wyłączone self-healing/pruning. Napraw definicję Git i poczekaj na Synced i Healthy dla bieżącego release-commit z obiema flagami true; to jeszcze nie dowodzi przyjęcia nowej publikacji przez osobno przypięte reader Applications. `cat release-commit; kubectl get application board -o json | jq "{automation:.spec.syncPolicy.automated,status:.status}"`.


  ### Rollout producenta {#forward-rollback-producer-rollout}


  Błędna readiness probe używa portu 8099, choć serwer słucha na 8080, więc rollout może stać mimo synchronizacji Git. Napraw definicję Git przez nowe commity i sprawdź rollout/events; błąd CLI lub trzysekundowy limit obserwacji też nie przejdzie. `kubectl rollout status deployment/board --timeout=3s; kubectl describe deployment board; git -C repository show origin/main:manifests/board.yaml`.


  ### Odpowiedź HTTP producenta {#forward-rollback-producer-http}


  Zsynchronizowane Application może nie mieć gotowego endpoint Service przez złą probe albo zwracać treść inną niż north-95. Sprawdź rzeczywisty endpoint board z jego worker po naprawie; timeout lub błąd exec/HTTP też narusza pierwotne porównanie. `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080`.


  ### Pierwotne Application i Deployment {#forward-rollback-original-application-identities}


  Usunięcie i odtworzenie board, reader-a lub reader-b zachowuje nazwę, lecz zmienia zamrożony UID Application albo Deployment. Napraw każdy oryginalny obiekt na miejscu; marker wskazuje producenta lub linię reader. To obserwacja bieżącej tożsamości, nie ciągłości historii. `kubectl get application,deployment -o json | jq ".items[] | {kind,name:.metadata.name,uid:.metadata.uid}"`.


  ### Historia odbiorców do przodu {#forward-rollback-forward-consumer-history}


  Pobrany head może nadal być wcześniejszym reader baseline lub producent wskazywać inne repozytorium. Zachowaj pochodzenie od baseline i opublikuj nowszy commit z zatwierdzonymi danymi reader. Błąd polecenia ancestry daje rollback_observation zamiast tego markera porównania. `git -C repository log --oneline -5 origin/main; kubectl get application board -o json | jq .spec.source.repoURL`.


  ### Bieżące przypięcia commit odbiorców {#forward-rollback-current-reader-commit-pins}


  Reader zaczynają przypięte do starego commitu, więc naprawa producenta nie przesuwa ich rewizji. Opublikuj zatwierdzone manifesty, przypnij każde pierwotne reader Application do bieżącego pełnego Git commit, zachowaj ścieżkę, project i destination i poczekaj na Synced i Healthy tej rewizji; samo main nie spełnia porównania immutable pin. `git -C repository rev-parse origin/main; kubectl get application reader-a reader-b -o json | jq ".items[] | {name:.metadata.name,source:.spec.source,project:.spec.project,destination:.spec.destination,status:.status}"`.


  ### Opublikowana projekcja odbiorców {#forward-rollback-published-reader-projection}


  Zdrowy reader może nadal uruchamiać pierwotny program ze starą publikacją. Zachowaj image, command i args reader w Git, żywym Deployment i każdym bieżącym należącym Pod; zakończ rollout i opublikuj zatwierdzony JSON przez dokładnie jedną zgodną projekcję ConfigMap w document root. Dane Git i żywego ConfigMap mają być równe jako pełne mapy, a publikacja zawierać zatwierdzone wartości. Równoważne bezpośrednie lub projected powiązania ConfigMap mogą przejść. `git -C repository ls-tree -r --name-only origin/main -- readers; kubectl get deployment reader-a reader-b -o yaml; kubectl get configmaps -o yaml`.


  ### Publikacja każdego odbiorcy {#forward-rollback-every-reader-publication}


  Git, żywy ConfigMap i zdrowy status nie dowodzą przyjęcia danych przez każdy reader Pod. Sprawdź każdy bieżący należący Pod przez localhost i Service: HTTP JSON musi zawierać zatwierdzone schema, generation i route. Stary plik mount może potrzebować czasu aktualizacji; nie zastępuj zachowanego programu reader sfabrykowaną odpowiedzią. `kubectl get pods -o wide; kubectl exec deployment/reader-a -c worker -- wget -qO- -T 2 http://reader-a:8080; kubectl exec deployment/reader-b -c worker -- wget -qO- -T 2 http://reader-b:8080`.


  ### Ograniczona obserwacja rollback {#forward-rollback-bounded-rollback-observation}


  Polecenie Git lub Kubernetes mogło przekroczyć pozostały czas albo wspólny budżet 14 sekund wygasł przed obserwacją obu linii reader. Sprawdź API/Git i zbieżność przed ponownym odpytywaniem; nazwany budżet dotyczy obserwatora i nie dowodzi błędu konkretnego predykatu. `git -C repository rev-parse origin/main; kubectl --request-timeout=2s get application,deployment,pods -o wide`.


  ### Czytelne dane rollback {#forward-rollback-readable-rollback-inputs}


  Obserwator może nie odczytać zamrożonego kontraktu, historii Git, dokumentów Kubernetes lub projected danych reader. Przechwycone błędy CLI, zły JSON/YAML, brak pól i zduplikowane tożsamości zasobów dają marker; błąd polecenia ancestry baseline też trafia tutaj. Sprawdź rzeczywiste dane przed zmianą obiektów na podstawie niedostępnej obserwacji. `test -r /run/dq/facts/0/rollback-contract.json; git -C repository ls-tree -r --name-only origin/main -- readers; kubectl --request-timeout=2s get application,deployment -o yaml`.


  ### Zdrowy kontrakt i wczesny fallback {#forward-rollback-healthy-contract-and-early-fallback}


  Pierwotny health observer może odrzucić desired/live zasoby lub zabezpieczenia zmienione względem zdrowego Git baseline, złe liveness/startup probes, różnice zachowania desired/live, zablokowany rollout albo brak north-95. Daje ten fallback bez dokładniejszych markerów. Późniejszy nienazwany błąd startu, platform input lub struktury dokumentu też trafia tutaj; nazwane błędy rollback go tłumią. Zachowaj zasoby i bezpieczeństwo baseline, naprawiając readiness przez Git. `git -C repository show "$(cat /run/dq/facts/0/healthy-commit):manifests/board.yaml"; git -C repository show origin/main:manifests/board.yaml; kubectl get deployment board -o yaml`.


  ### Niezmienione bajty archiwum {#archived-release-untouched-archive-bytes}


  Dostarczony recovery-image.tar może zniknąć lub zmienić się po odzyskiwaniu albo zamrożona suma jest nieczytelna. Zachowaj archiwum i porównaj SHA-256 surowych bajtów z potwierdzeniem. Podobny nowy image lub zmiana roboczego checksum nie potwierdza pierwotnych bajtów. `sha256sum recovery-image.tar; cat /run/dq/facts/0/archive.sha256`.


  ### Dokładne bajty registry i chroniony artefakt {#archived-release-exact-registry-bytes-and-protected-artifact}


  Setup usuwa użyteczne lokalne aliasy wydania i manifest registry; archiwum ma przywrócić dokładnie to wydanie, nie nowy build. Sprawdź zaufany TLS, dostarczone uwierzytelnienie, immutable manifest digest, identyczne bajty tagu 1 i digest/rozmiar każdego config/layer. Niezależny protected artefakt i jego blobs też muszą przetrwać. Każdy błąd polecenia lub porównania tej fazy registry daje ten sam marker. `sha256sum recovery-image.tar; test -r /run/dq/facts/0/registry-ca.crt; docker image ls --digests; jq "{protected_image,protected_tag}" /run/dq/facts/0/recovery-baseline.json`.


  ### Pierwotni wstrzymani odbiorcy {#archived-release-original-suspended-consumers}


  Odtworzenie kontrolerów, Service lub definicji batch zachowuje nazwy, lecz zmienia UID. Napraw pierwotne obiekty i pozostaw CronJob wstrzymany; ręczne uruchomienie odzyskiwania nie wymaga włączania harmonogramu. Brak lub złe dokumenty baseline/obiektu przed fazą source też dają marker tożsamości. `kubectl get deployment,service,cronjob,application -o json | jq ".items[] | {kind,name:.metadata.name,uid:.metadata.uid,suspend:.spec.suspend}"`.


  ### Opublikowane niezmienne źródło {#archived-release-published-immutable-source}


  Odtworzenie registry samo nie aktualizuje Git ani odbiorcy. Opublikuj digest archiwalnego image w istniejącym web Deployment, zachowaj source Application, project station i destination, poczekaj na synchronizację bieżącego Git head przy automatycznych self-healing/pruning. Image żywego worker ma dokładnie odpowiadać zadeklarowanej referencji digest-pinned; sam zmienny tag nie przejdzie. `git -C repository show origin/main:manifests/web.yaml; kubectl get application release -o json | jq "{spec,status:.status.sync}"; kubectl get deployment archive-web -o yaml`.


  ### Rzeczywiste przyjęcie web {#archived-release-real-web-adoption}


  Web Deployment może wskazywać odzyskany image, gdy rollout używa starych lub niegotowych Pod. Zachowaj dodatnie całkowite replicas, bieżącą observed generation i dokładnie gotowe aktualne należące Pod z tym image; rzeczywisty HTTP archive-web ma zwracać pierwotne archive-97. Błędy API, exec lub HTTP w fazie web dają ten sam marker. `kubectl rollout status deployment/archive-web --timeout=3s; kubectl get pods -o wide; kubectl exec deployment/archive-web -c worker -- wget -qO- -T 3 http://archive-web:8080`.


  ### Rzeczywiste zakończone uruchomienie ręczne {#archived-release-real-completed-manual-execution}


  Naprawa szablonu wstrzymanego CronJob nie naprawia poprzedniego Job ani nie tworzy sukcesu. Zachowaj wyłączony harmonogram i utwórz jeden nowy udany Job z naprawionego szablonu archiwalnego image. Pełny Pod spec ma odpowiadać szablonowi, rzeczywisty należący worker Pod zakończyć się kodem 0, runtime image digest być archiwalny, logi checked-97; dozwolony jest dokładnie jeden nowy ukończony Job, stare błędy mogą zostać. `kubectl get cronjob archive-scan -o yaml; kubectl get jobs,pods -o wide`.


  ### Obserwacja bez edycji statusu wykonania {#archived-release-observe-without-status-forgery}


  Nadanie graczowi prawa zmiany status Pod lub Job umożliwia fałszywy dowód wykonania. Zachowaj odmowę obu kontroli status patch i obserwuj rzeczywiste zakończenie kontenera, image identity i logi. Błąd odczytu autoryzacji lub wynik inny niż no również nie przejdzie. `kubectl auth can-i patch pods --subresource=status; kubectl auth can-i patch jobs --subresource=status`.


  ### Nienazwany błąd danych odbiorców {#archived-release-unlabelled-consumer-input}


  Po fazie registry może zawieść Git fetch, odczyt opublikowanego web manifest, zbiorczy zrzut Kubernetes lub start Python/helper przed nazwanym porównaniem. Sprawdź rzeczywiste odczyty i workspace. Błędy registry mają recovery_registry, przechwycone identity/source/web/batch zachowują markery; fallback pojawia się tylko bez nich. `git -C repository fetch origin main; git -C repository show origin/main:manifests/web.yaml; kubectl get deployment,service,cronjob,job,application,pods,replicasets -o json >/dev/null`.

  '
