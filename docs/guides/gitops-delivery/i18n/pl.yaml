heading: Naprawa prywatnego rejestru i GitOps
text: '# Naprawa prywatnego rejestru i GitOps


  ## Rozdziel granice


  Dostępność registry, zaufanie transportu, tożsamość źródła i przyjęcie danych to odrębne obserwacje. Używaj tylko
  jednorazowej zatoki. Porównuj kontrakty z żywym API; zamrożone zapisy zachowują pierwotne zaufane źródło. Potwierdzenie
  sterowania opisuje działanie agenta, nie ciągłą dostępność, autoryzację lub przyjęcie danych.


  ## Konsumenci prywatnych obrazów


  Klient workstation i kubelet przechowują dane uwierzytelniające niezależnie. Udany uwierzytelniony odczyt nie
  aktualizuje Secret w namespace. Secret określa dane registry, ale nie instaluje CA w runtime węzła. Zachowaj endpoint,
  zaufanie certyfikatu, niezmienny obraz, tożsamość kontrolera i obiekt uwierzytelniania.


  Zdarzenia podów rozróżniają połączenie, certyfikat, autoryzację i brak manifestu. Always steruje rozwiązywaniem
  i pobieraniem; pamięć obrazu i kontener Ready nie dowodzą ważności zapisanych danych przy kolejnym pobraniu. Prywatnie
  porównaj Secret z zatwierdzonym źródłem oraz sprawdź rzeczywisty skrót i odwołania własnych podów.


  Ogólny przykład aktualizuje istniejący dozwolony Secret. Najpierw wybierz obiekt i dostarczoną tożsamość. Nie
  wypisuje danych uwierzytelniających; base64 to kodowanie, nie szyfrowanie. Obciążenie nadal musi odwoływać się
  do właściwego obiektu.


  ```bash

  set -euo pipefail

  set +x

  : "${DQ_PULL_SECRET:?select the existing authorized Secret}"

  : "${REGISTRY:?select the approved registry endpoint}"

  : "${REGISTRY_USER:?select the supplied registry identity}"

  : "${REGISTRY_PASSWORD:?load the private supplied credential}"

  export DQ_PULL_SECRET REGISTRY REGISTRY_USER REGISTRY_PASSWORD

  before=$(kubectl get secret "$DQ_PULL_SECRET" -o jsonpath=''{.metadata.uid}'')

  python3 -I - <<''PRIVATE_AUTH'' | kubectl apply -f - >/dev/null

  import base64,json,os

  auth=base64.b64encode((os.environ[''REGISTRY_USER'']+'':''+os.environ[''REGISTRY_PASSWORD'']).encode()).decode()

  config={''auths'':{os.environ[''REGISTRY'']:{''auth'':auth}}}

  secret={''apiVersion'':''v1'',''kind'':''Secret'',''metadata'':{''name'':os.environ[''DQ_PULL_SECRET'']},

  ''type'':''kubernetes.io/dockerconfigjson'',''data'':{''.dockerconfigjson'':base64.b64encode(json.dumps(config).encode()).decode()}}

  print(json.dumps(secret))

  PRIVATE_AUTH

  test "$(kubectl get secret "$DQ_PULL_SECRET" -o jsonpath=''{.metadata.uid}'')" = "$before"

  ```


  ## Retencja i zmienne odwołania


  Tag wskazuje manifest, a jego skrót określa dokładne bajty. Lokalny tag Docker nie aktualizuje zdalnego registry
  bez push manifestu. Porównaj listę tagów, odpowiedzi i zatwierdzony katalog skrótów. Uwzględniaj typy manifestów
  przy odczycie Docker-Content-Digest.


  Buduj retencję wokół chronionych tożsamości manifestów. Sprawdź plan przed DELETE i czytelność chronionych manifestów
  potem. Zachowane tagi także muszą wskazywać właściwą treść: zachowanie skrótu nie zachowuje automatycznie aliasu.
  Usuwanie manifestów i oczyszczanie blobów to odrębne działania. Nie zastępuj odzyskania usunięciem wolumenu, wyłączeniem
  TLS lub innym registry.


  ## Zdarzenia i uzgadnianie


  Webhook łączy zdarzenie źródła z prywatnym odbiornikiem. Porównuj odbiornik, typ, repozytorium, gałąź i podpis
  bez ujawniania sekretu. Przyjęcie podpisanego zdarzenia różni się od okresowego odpytywania i uzgodnienia źródła.
  Łącz wynik dostawcy z uwierzytelnioną obserwacją odbiornika.


  Application wiąże repozytorium, ścieżkę, rewizję, projekt i cel. Synced opisuje porównanie źródła, Healthy zdrowie
  zasobów. Żaden status nie dowodzi odpowiedzi aplikacji. Porównuj rewizję, dane, obiekt Kubernetes i rzeczywistą
  odpowiedź bez zmiany poprawnej granicy dostępu.


  ## Publikacja i przyjęcie


  Zamontowany ConfigMap może zmienić projekcję plików, gdy aplikacja nadal podaje kopię z początku procesu. Przyjęcie
  może wymagać obsługiwanego odświeżenia albo rollout. Zachowaj pierwotny kontroler i program; porównaj każdy aktywny
  należący do niego pod ze źródłem i odpowiedzią. Nowy zdrowy obiekt nie zachowuje pierwotnej tożsamości.


  W app-of-apps rodzic uzgadnia potomną Application, a ona obciążenie. Śledź źródło i właściciela na każdej warstwie.
  Generator ApplicationSet przekazuje parametry szablonowi; sprawdzaj także wygenerowane obiekty. Kontroler może
  nadpisać bezpośrednie zmiany. Zachowaj źródło repozytorium, właścicieli, namespace i publikację podczas propagacji.


  Dokumentacja: [API registry](https://distribution.github.io/distribution/spec/api/), [prywatne obrazy](https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/),
  [webhook Argo CD](https://argo-cd.readthedocs.io/en/stable/operator-manual/webhook/), [przyjęcie ConfigMap](https://kubernetes.io/docs/tutorials/configuration/updating-configuration-via-a-configmap/).

  '
