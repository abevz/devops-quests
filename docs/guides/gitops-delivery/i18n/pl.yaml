heading: Naprawa prywatnego rejestru i GitOps
text: '# Naprawa prywatnego rejestru i GitOps


  Używaj wyłącznie jednorazowej zatoki zadania. Kubelet pobiera prywatny obraz przy użyciu Secret z tej samej przestrzeni nazw wskazanego w `imagePullSecrets`. Digest identyfikuje niezmienną treść obrazu; `imagePullPolicy: Always` powoduje sprawdzenie pobierania przy starcie. Przeczytaj `platform.env`, `private-release.json`, `board.json` i `registry-pull.json`, jeśli są dostarczone. Chroń dane dostępowe gry: nie wypisuj ich i nie zapisuj w historii terminala. Sprawdź zdarzenia Poda i poczekaj na `kubectl rollout status deployment/board --timeout=90s`; bieżący udany rollout nie dowodzi przyszłych pobrań.


  Application Argo CD wybiera repozytorium, ścieżkę, rewizję i cel. Kontroler uzgadnia stan asynchronicznie: `Synced` opisuje porównanie z Git, a `Healthy` kondycję zasobów. W układzie app-of-apps rodzic uzgadnia potomną Application, która uzgadnia workload. Porównaj oba obiekty z wysłanym commitem i zachowaj tożsamość rodzica. `wait-apps.sh` w zatoce sprawdza wymagane Application; ponów po uzgodnieniu zamiast zakładać natychmiastowy efekt.


  Generator listy ApplicationSet dostarcza parametry szablonowi Go; ścieżka taka jak `stations/{{.station}}` tworzy ścieżkę dla każdego wpisu. W zadaniu ApplicationSet mechanizm odpytywania gry przesyła jeden z dwóch ograniczonych manifestów z `applicationset.json` do prywatnego kontrolera. Jest to adapter z ograniczonym zakresem zmian, nie ogólne API kontrolera. Poczekaj na wygenerowane Application i sprawdź właściciela, rewizję, stan oraz odpowiedzi workloadu.


  Źródła: [prywatne obrazy](https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/), [generator listy Argo CD](https://argo-cd.readthedocs.io/en/stable/operator-manual/applicationset/Generators-List/), [szablony Go](https://argo-cd.readthedocs.io/en/stable/operator-manual/applicationset/GoTemplate/).


  W zadaniu 027 sprawdź zdarzenia pobierania obrazu relay i użyj dostarczonych wyłącznie do gry danych registry, aby utworzyć pull Secret w tym samym namespace bez ujawniania wartości. Wskaż go w `imagePullSecrets`, zachowaj prywatny obraz i `Always`, poczekaj na rollout relay.


  W zadaniu 041 porównaj historie release-candidate i main. Przenieś właściwe powiadomienie na main przez merge lub cherry-pick, wypchnij do podanego prywatnego remote i z `~/quest` wykonaj `git -C repository fetch origin main release-candidate`. Sprawdź `north-41` w lokalnym i zdalnym main, baseline jako przodka, czysty worktree oraz równość rzeczywistych commitów HEAD i remote.


  W zadaniu 042 odśwież `registry-pull` dostarczonymi danymi gry bez ich wypisywania i zapisywania w historii powłoki. Sprawdź typ Secretu i kanonicznie zakodowane auth, zachowaj `PRIVATE_IMAGE`, `Always`, jedną replikę i jeden pull Secret, a potem sprawdź rollout oraz `north-42`. Base64 to kodowanie, nie szyfrowanie; obecny rollout nie dowodzi przyszłych pobrań.


  W zadaniu 043 zmień source path Argo Application na `manifests`, zachowując podane repository, project, revision i destination. Synchronizuj i porównaj revision kontrolera ze zdalnym main, a następnie sprawdź Synced/Healthy i rzeczywistą odpowiedź `north-43`.


  W zadaniu 049 zmienny tag i właściwy digest mogą zwracać ten sam tekst, choć oznaczają różne artefakty. Przypnij `PRIVATE_IMAGE`, zachowaj `Always` i `registry-pull`, porównaj image ID gotowego kontenera z właściwym digestem i sprawdź `north-49`.


  W zadaniu 027 ten przykład tworzy pull Secret z dostarczonego środowiska bez umieszczania danych w argumentach poleceń ani wypisywania payloadu. W zadaniu 042 zastąp `parcel-pull` przez `registry-pull`; zachowaj wynikowy Secret jako prywatny.


  ```bash

  set +x

  cd ~/quest

  source platform.env

  export DQ_PULL_SECRET=parcel-pull

  python3 - <<''PY'' | kubectl apply -f - >/dev/null

  import base64

  import json

  import os

  import sys


  auth = base64.b64encode((os.environ[''REGISTRY_USER''] + '':'' + os.environ[''REGISTRY_PASSWORD'']).encode()).decode()

  config = json.dumps({''auths'': {os.environ[''REGISTRY'']: {''auth'': auth}}}).encode()

  secret = {''apiVersion'': ''v1'', ''kind'': ''Secret'', ''metadata'': {''name'': os.environ[''DQ_PULL_SECRET'']}, ''type'': ''kubernetes.io/dockerconfigjson'', ''data'': {''.dockerconfigjson'': base64.b64encode(config).decode()}}

  json.dump(secret, sys.stdout)

  PY

  unset DQ_PULL_SECRET

  ```

  '
