heading: Naprawa prywatnego rejestru i GitOps
text: '# Naprawa prywatnego rejestru i GitOps


  Używaj wyłącznie jednorazowej zatoki zadania. Kubelet pobiera prywatny obraz przy użyciu Secret z tej samej przestrzeni nazw wskazanego w `imagePullSecrets`. Digest identyfikuje niezmienną treść obrazu; `imagePullPolicy: Always` powoduje sprawdzenie pobierania przy starcie. Przeczytaj `platform.env`, `private-release.json`, `board.yaml` i `registry-pull.yaml`, jeśli są dostarczone. Chroń dane dostępowe gry: nie wypisuj ich i nie zapisuj w historii terminala. Sprawdź zdarzenia Poda i poczekaj na `kubectl rollout status deployment/board --timeout=90s`; bieżący udany rollout nie dowodzi przyszłych pobrań.


  Application Argo CD wybiera repozytorium, ścieżkę, rewizję i cel. Kontroler uzgadnia stan asynchronicznie: `Synced` opisuje porównanie z Git, a `Healthy` kondycję zasobów. W układzie app-of-apps rodzic uzgadnia potomną Application, która uzgadnia workload. Porównaj oba obiekty z wysłanym commitem i zachowaj tożsamość rodzica. `wait-apps.sh` w zatoce sprawdza wymagane Application; ponów po uzgodnieniu zamiast zakładać natychmiastowy efekt.


  Generator listy ApplicationSet dostarcza parametry szablonowi Go; ścieżka taka jak `stations/{{.station}}` tworzy ścieżkę dla każdego wpisu. W zadaniu ApplicationSet mechanizm odpytywania gry przesyła jeden z dwóch ograniczonych manifestów z `applicationset.yaml` do prywatnego kontrolera. Jest to adapter z ograniczonym zakresem zmian, nie ogólne API kontrolera. Poczekaj na wygenerowane Application i sprawdź właściciela, rewizję, stan oraz odpowiedzi workloadu.


  Źródła: [prywatne obrazy](https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/), [generator listy Argo CD](https://argo-cd.readthedocs.io/en/stable/operator-manual/applicationset/Generators-List/), [szablony Go](https://argo-cd.readthedocs.io/en/stable/operator-manual/applicationset/GoTemplate/).


  W zadaniu 027 sprawdź zdarzenia pobierania obrazu relay i użyj dostarczonych wyłącznie do gry danych registry, aby utworzyć pull Secret w tym samym namespace bez ujawniania wartości. Wskaż go w `imagePullSecrets`, zachowaj prywatny obraz i `Always`, poczekaj na rollout relay.


  W zadaniu 041 porównaj historie release-candidate i main. Przenieś właściwe powiadomienie na main przez merge lub cherry-pick, wypchnij do podanego prywatnego remote i z `~/quest` wykonaj `git -C repository fetch origin main release-candidate`. Sprawdź `north-41` w lokalnym i zdalnym main, baseline jako przodka, czysty worktree oraz równość rzeczywistych commitów HEAD i remote.


  W zadaniu 042 odśwież `registry-pull` dostarczonymi danymi gry bez ich wypisywania i zapisywania w historii powłoki. Sprawdź typ Secretu i kanonicznie zakodowane auth, zachowaj `PRIVATE_IMAGE`, `Always`, jedną replikę i jeden pull Secret, a potem sprawdź rollout oraz `north-42`. Base64 to kodowanie, nie szyfrowanie; obecny rollout nie dowodzi przyszłych pobrań.


  W zadaniu 043 zmień source path Argo Application na `manifests`, zachowując podane repository, project, revision i destination. Synchronizuj i porównaj revision kontrolera ze zdalnym main, a następnie sprawdź Synced/Healthy i rzeczywistą odpowiedź `north-43`.


  W zadaniu 049 zmienny tag i właściwy digest mogą zwracać ten sam tekst, choć oznaczają różne artefakty. Przypnij `PRIVATE_IMAGE`, zachowaj `Always` i `registry-pull`, porównaj image ID gotowego kontenera z właściwym digestem i sprawdź `north-49`.


  W zadaniu 027 ten przykład tworzy pull Secret z dostarczonego środowiska bez umieszczania danych w argumentach poleceń ani wypisywania payloadu. W zadaniu 042 zastąp `parcel-pull` przez `registry-pull`; zachowaj wynikowy Secret jako prywatny.


  ```bash

  set +x

  cd ~/quest

  source platform.env

  export DQ_PULL_SECRET=parcel-pull

  python3 - <<''PY'' | kubectl apply -f - >/dev/null

  import base64

  import json

  import os

  import sys


  auth = base64.b64encode((os.environ[''REGISTRY_USER''] + '':'' + os.environ[''REGISTRY_PASSWORD'']).encode()).decode()

  config = json.dumps({''auths'': {os.environ[''REGISTRY'']: {''auth'': auth}}}).encode()

  secret = {''apiVersion'': ''v1'', ''kind'': ''Secret'', ''metadata'': {''name'': os.environ[''DQ_PULL_SECRET'']}, ''type'': ''kubernetes.io/dockerconfigjson'', ''data'': {''.dockerconfigjson'': base64.b64encode(config).decode()}}

  json.dump(secret, sys.stdout)

  PY

  unset DQ_PULL_SECRET

  ```


  Polecenie Git i kontroler dostarczania nie współdzielą automatycznie konfiguracji uwierzytelniania. Secret repozytorium używa `argocd.argoproj.io/secret-type=repository` i `type=git` oraz pól repozytorium, użytkownika i poświadczenia. Metadane i zakres uprawnień są ważne niezależnie od wartości poświadczenia. Sprawdzaj każdy uprawniony kontekst bez wypisywania danych uwierzytelniających i chroń przechowującą je konfigurację.


  W zadaniu 066 odróżnij digesty rollback, current i obsolete przed zastosowaniem retention. Dostarczony helper może usunąć tylko obsolete w tym jednorazowym registry; sprawdź, że current i rollback nadal da się pobrać po digest. Usunięcie manifestu nie jest garbage collection.


  W usłudze opartej na plikach projektowana konfiguracja i lokalizacja wejścia programu są oddzielnymi granicami. Źródło może być zsynchronizowane, gdy proces czyta inne dane albo wcześniejszy widok. Porównaj stan docelowy, zamontowane pliki i rzeczywiste metadane HTTP. Sama gotowość nie dowodzi przyjęcia, tożsamości ani zgodności ze źródłem.


  W zadaniu 075 przywróć pierwotny podpisany push hook do utrwalonego odbiorcy i dostarcz poprawne zdarzenie main przez podany test endpoint. Przy wyłączonym polling sprawdź zdarzenie zaobserwowane przez serwer, bieżącą revision, zdrowie i `north-75`; ręczny refresh nie tworzy tego zdarzenia.


  W zadaniu 078 zleć tylko ograniczony start registry, sprawdź uwierzytelniony TLS `/v2/`, a potem przywróć jedną replikę board z istniejącym przypiętym obrazem i pull Secretem. Porównaj tożsamość działającego obrazu i odpowiedź; zachowaj dane gry w tajemnicy.


  Pochodzenie obrazu łączy działający niezmienny obraz, rzeczywiste bajty manifestu/config w rejestrze i przodków źródła w Git. Commit wdrożenia może wybierać starszy artefakt źródłowy. Ustal tę relację na podstawie trzech niezależnych źródeł, zamiast kopiować gotową krotkę lub traktować etykietę jako podpis. Lokalny raport, opublikowany zapis GitOps, działający ConfigMap i plik czytany przez działający Pod to osobne obserwacje: zgodność na jednej granicy nie dowodzi propagacji przez pozostałe. Zbadaj tryb montowania i tożsamość konsumenta, jeśli obiekt API i zamontowana zawartość się różnią; montowanie subPath zachowuje plik przez czas życia tego Poda. Zachowaj pierwotną tożsamość obrazu i sprawdź zapis faktycznie udostępniany przez konsumenta. Niepodpisane metadane zapewniają identyfikowalność, a nie potwierdzenie zaufanej kompilacji.


  Niezależnie zarządzani odbiorcy mogą podlegać różnym kontraktom wydania. Zdrowy stan historyczny i bieżące zatwierdzone dane nie muszą opisywać tego samego wydania. Porównuj tożsamość, rewizję źródłową i rzeczywisty wynik na każdej granicy, zachowując zapisaną historię. Historia Git opisuje zapisane commity, a nie konkretne polecenie odtwarzania.


  Suma archiwum identyfikuje zachowane dane wejściowe odtwarzania, a digest manifestu obrazu identyfikuje inne bajty. Dostępny proces rejestru i poprawny kontener z pamięci podręcznej nie dowodzą dostępności każdego wskazanego bloba config i warstwy. Sprawdzaj uwierzytelniony TLS oraz rzeczywiste bajty i rozmiary blobów pod pierwotnym repozytorium/tagiem/digest. Niezależnie zachowuj pozostałe artefakty; odtworzenie archiwum nie dowodzi odtwarzania hosta ani pamięci masowej po awarii.


  Odtworzenie artefaktu i aktywacja niezależnych odbiorców to osobne operacje. Kontroler GitOps uzgadnia opublikowaną definicję, a szablon wsadowy zarządzany przez API ma własnego właściciela. Porównuj zdalny commit, obserwowaną rewizję, niezmienne odwołania obrazów i rzeczywiste image ID kontenerów. Patch tylko aktywnego Deploymentu może zostać cofnięty; zmienny alias może dziś wskazywać właściwe bajty bez zapewnienia niezmienności deklarowanego wydania.


  Zawieszony CronJob nadal może dostarczać szablon jednego świadomie uruchomionego Joba odtwarzania bez wznawiania harmonogramu. Porównaj istotne pola szablonu Joba z zachowanym CronJobem i wyklucz zapisane poprzednie wykonania. Faktyczne ukończenie wymaga rzeczywistego Poda należącego do UID nowego Joba, oczekiwanego image ID i zakończenia kontenera kodem zero; sam status Joba nie wystarczy. Ręczny Job może mieć inne metadane niż zaplanowany, więc sprawdzaj rzeczywistych właścicieli zamiast wymagać określonego polecenia lub wygenerowanej nazwy. Zachowaj ukończony Pod do weryfikacji; sprawdzanie gotowych obrazów działających Deploymentów nie opisuje zakończonych Podów wsadowych.


  W zadaniu 122 parent uzgadnia podrzędną Application, a ta uzgadnia board. Popraw ścieżkę źródła child w Git i wypchnij potomka baseline. Zachowaj UID parenta i ścieżkę apps, a następnie porównaj revision synchronizacji obu, zdrowie child, tracking annotation i odpowiedź board.


  W zadaniu 070 popraw source path Application i potwierdź Synced dla zapisanej revision Git przed odzyskaniem runtime Secretu. Workload może pozostać niezdrowy do poprawy polityki readera Vault i jawnego uruchomienia synchronizatora; token Vault nie może trafić do workloadu.


  W zadaniu 080 najpierw odzyskaj uzgadnianie źródła na baseline. Następnie wypchnij dostarczony niezmienny obraz w wydaniu potomnym i porównaj Git, revision Argo, uwierzytelniony digest registry i ID działającego obrazu. Zachowaj ustawienia pull, sprawdź zdrowie i `north-80`, a dane utrzymuj w tajemnicy; kontrole nie dowodzą niezmienności pull Secretu.


  W zadaniu 100 przywróć źródło i automatykę Application, a następnie prześledź wydanie przez prywatny obraz, status Argo i board. Napraw ograniczone dostarczenie przez Vault i sprawdź działający digest oraz odpowiedź. Samo Synced nie ustala zdrowia; dwie sprawdzone ścieżki Vault nie dowodzą pełnego zakresu polityki.

  '
