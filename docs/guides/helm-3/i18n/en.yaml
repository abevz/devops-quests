heading: 3. Value paths and types [values]
text: "## 3. Value paths and types [values]\n\n**At a glance**\n- Values are merged before the template runs.\n- An argument can override the original value.\n- A value's type affects later validation.\n\n**Mini-example:** In a new temporary chart directory, save the main block as `templates/example.yaml` and add the files below. Then run `helm lint . --set replicaCount=5` and `helm template demo . --dry-run=client --set replicaCount=5`. No cluster is used.\n\n```gotemplate\napiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: {{ .Release.Name }}\ndata:\n  result: {{ .Values.replicaCount | quote }}\n```\n\nFile `Chart.yaml`:\n\n```yaml\napiVersion: v2\nname: mini\nversion: 0.1.0\nappVersion: \"2.0.0\"\n```\n\nFile `values.yaml`:\n\n```yaml\nreplicaCount: 2\n```\n\n**Predict:** What number will appear in the result line?\n\n> [!question]- Answer\n> Actual `helm template` output (stdout and stderr):\n>\n> ```text\n> ---\n> # Source: mini/templates/example.yaml\n> apiVersion: v1\n> kind: ConfigMap\n> metadata:\n>   name: demo\n> data:\n>   result: \"5\"\n> ```\n>\n> Exit codes: lint=0, template=0.\n\nThe template reads the final replicaCount=5 from --set; quote makes the ConfigMap field a string.\n\n> [!info]- Deeper explanation\n> > [!info] Core and reference\n> > Core: value paths, merging maps and replacing lists. Differences between --set/--set-string/--set-json/--set-file and escaping commas/dots are reference material after ordinary values.yaml.\n>\n> Start with the original `replicaCount: 2` and `image.repository: harbor.example.test/demo/democicd`. Helm loads those values, overlays supplied files, then value arguments. Templates see them as `.Values.replicaCount` and `.Values.image.repository`. Once evaluated, they become ordinary `spec.replicas` and `spec.template.spec.containers[].image` fields. *(verified: original rendering)*\n>\n> ```mermaid\n> flowchart TB\n>     A[\"values.yaml: replicaCount=2; image.repository=harbor.example.test/demo/democicd\"] --> B[\"-f a.yaml: 3; example.invalid/app\"]\n>     B --> C[\"-f b.yaml: replicaCount=4\"]\n>     C --> D[\"--set replicaCount=5\"]\n>     D --> E[\"Merged .Values: 5; example.invalid/app\"]\n>     E --> F[\"deployment.yaml: .Values.replicaCount; .Values.image.repository\"]\n>     F --> G[\"Manifest: replicas: 5; image: example.invalid/app@0.1.0\"]\n>     G --> H[\"On install/upgrade: Kubernetes API\"]\n>     H --> I[\"Deployment → ReplicaSet → Pods; kubelet reads the image\"]\n> ```\n>\n> The last two diagram steps are *(according to documentation)* [installation](https://helm.sh/docs/helm/helm_install/); local `template` does not perform them.\n\n### Ordering and merging\n\n**At a glance**\n- Files are applied in the specified order.\n- Maps are merged by key.\n- Lists are usually replaced as a whole.\n\n**Mini-example:** In a new temporary chart directory, save the main block as `templates/example.yaml` and add the files below. Then run `helm lint . -f a.yaml -f b.yaml` and `helm template demo . --dry-run=client -f a.yaml -f b.yaml`. No cluster is used.\n\n```gotemplate\napiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: merge\ndata:\n  repository: {{ .Values.image.repository | quote }}\n  tag: {{ .Values.image.tag | quote }}\n  items: {{ .Values.items | toJson | quote }}\n```\n\nFile `Chart.yaml`:\n\n```yaml\napiVersion: v2\nname: mini\nversion: 0.1.0\nappVersion: \"2.0.0\"\n```\n\nFile `values.yaml`:\n\n```yaml\nimage: {repository: base, tag: old}\nitems: [a, b]\n```\n\nFile `a.yaml`:\n\n```yaml\nimage: {repository: team/app}\n```\n\nFile `b.yaml`:\n\n```yaml\nimage: {tag: new}\nitems: [c]\n```\n\n**Predict:** Will repository from the first file and both original list entries be preserved?\n\n> [!question]- Answer\n> Actual `helm template` output (stdout and stderr):\n>\n> ```text\n> ---\n> # Source: mini/templates/example.yaml\n> apiVersion: v1\n> kind: ConfigMap\n> metadata:\n>   name: merge\n> data:\n>   repository: \"team/app\"\n>   tag: \"new\"\n>   items: \"[\\\"c\\\"]\"\n> ```\n>\n> Exit codes: lint=0, template=0.\n\nThe second file changes tag and replaces the whole list, but leaves repository alone. So repository is preserved and items contains only c.\n\n> [!info]- Deeper explanation\n> `-f` files apply left to right; the last wins when the same key conflicts. Maps merge by key; **lists are replaced in full**, not extended. `null` removes a key from defaults. *(according to documentation)* [Values](https://helm.sh/docs/chart_template_guide/values_files/).\n>\n> Two files actually used:\n>\n> ```yaml\n> # /tmp/helm-visual-guide/a.yaml\n> replicaCount: 3\n> image:\n>   repository: example.invalid/app\n> podAnnotations:\n>   a: first\n> imagePullSecrets:\n>   - name: first\n> ```\n>\n> ```yaml\n> # /tmp/helm-visual-guide/b.yaml\n> replicaCount: 4\n> podAnnotations:\n>   b: second\n> imagePullSecrets:\n>   - name: second\n> ```\n>\n> ```bash\n> helm template demo /tmp/helm-visual-guide/democicd \\\n>   -f /tmp/helm-visual-guide/a.yaml -f /tmp/helm-visual-guide/b.yaml \\\n>   --set replicaCount=5 --show-only templates/deployment.yaml\n> ```\n>\n> Actual result excerpts *(verified)*:\n>\n> ```yaml\n>   replicas: 5\n> # selector and other fields omitted\n>       annotations:\n>         a: first\n>         b: second\n> # labels omitted\n>       imagePullSecrets:\n>         - name: second\n>       containers:\n>       - image: \"example.invalid/app@0.1.0\"\n> ```\n>\n> The repository came from the first file and the replica count from the CLI argument; labels `a` and `b` survived together, while the first list item disappeared. An invalid image did not prevent local rendering (§18).\n\n### Four kinds of value arguments\n\n**At a glance**\n- Different flags read different representations.\n- A string and a number are not interchangeable.\n- Check the type in the final values.\n\n**Short scenario**\n\n--set x=12 and --set-string y=12 are passed to the same chart.\n\n**Predict:** Must x and y have the same type?\n\n> [!question]- Answer\n> No. The second flag explicitly sets a string; the detailed recipe below shows the types during rendering.\n\nThis follows from the stated conditions. The full earlier analysis and its verification limits are preserved below.\n\n> [!info]- Deeper explanation\n> The short route above explains the mechanism and next check. Full listing and observations: [[#Справочный рецепт — Четыре вида аргументов|reference recipe]].\n\n### Reference recipe — Four kinds of arguments\n\n**At a glance**\n- Set-string preserves the string type.\n- Set-file reads a file's contents.\n- Checking a type is different from printing similar-looking characters.\n\n**Mini-example:** In a new temporary chart directory, save the main block as `templates/example.yaml` and add the files below. Then run `helm lint . --set x=12 --set-string y=12 --set-file text=message.txt` and `helm template demo . --dry-run=client --set x=12 --set-string y=12 --set-file text=message.txt`. No cluster is used.\n\n```gotemplate\napiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: argument-types\ndata:\n  xType: {{ printf \"%T\" .Values.x | quote }}\n  yType: {{ printf \"%T\" .Values.y | quote }}\n  file: {{ .Values.text | trim | quote }}\n```\n\nFile `Chart.yaml`:\n\n```yaml\napiVersion: v2\nname: mini\nversion: 0.1.0\nappVersion: \"2.0.0\"\n```\n\nFile `values.yaml`:\n\n```yaml\n{}\n```\n\nFile `message.txt`:\n\n```text\nline from file\n```\n\n**Predict:** Will x and y have the same type?\n\n> [!question]- Answer\n> Actual `helm template` output (stdout and stderr):\n>\n> ```text\n> ---\n> # Source: mini/templates/example.yaml\n> apiVersion: v1\n> kind: ConfigMap\n> metadata:\n>   name: argument-types\n> data:\n>   xType: \"int64\"\n>   yType: \"string\"\n>   file: \"line from file\"\n> ```\n>\n> Exit codes: lint=0, template=0.\n\nx is parsed as a number; y is set as a string. Text comes from the entire file; this is a separate third way to pass a value.\n\n> [!info]- Deeper explanation\n> | Argument | What it reads | Where it is useful |\n> |---|---|---|\n> | `--set replicaCount=3` | Key structure and values with type parsing | A number or boolean parameter |\n> | `--set-string image.tag=012` | Forces a string | Tags and identifiers with leading zeroes |\n> | `--set-file config=/tmp/config.txt` | File contents as a string | Multiline text, not a new values file |\n> | `--set-json 'imagePullSecrets=[]'` | A JSON value: list, object, number, and more | Structured overrides |\n>\n> *(per documentation)* [Install arguments](https://helm.sh/docs/helm/helm_install/). `--set-file` is not the same as `-f`: the first puts **text** in one key, while the second reads a **YAML structure**.\n>\n> The order of **different kinds** of flags should not be treated as a universal “last one on the command line wins.” In this version, `--set-string` is applied after `--set`; within one flag kind, the last conflicting key wins. *(verified; see also [[Kubernetes-for-DevOps-Theory#7. Helm 4: что изменилось и где ломается|§7 cheat sheet]])*\n>\n> A `templates/probe.yaml` file was added to a copy of `probe`: a minimal ConfigMap that prints values and their types. This is an observation tool, not part of the original chart:\n>\n> The notation: `|` passes the result on its left as the last argument to the function on its right; `toYaml` converts a map to YAML text; `indent 4` shifts its lines by four spaces; `quote` wraps the result in quotation marks. `printf` formats a string, and `%T` shows the argument's type. These functions run while the template is evaluated, not in the Kubernetes API. *(per documentation)* [Functions](https://helm.sh/docs/chart_template_guide/function_list/).\n>\n> ```yaml\n> apiVersion: v1\n> kind: ConfigMap\n> metadata:\n>   name: probe\n> data:\n>   values: |\n> {{ toYaml .Values | indent 4 }}\n>   types: {{ printf \"%T/%T/%T\" .Values.x .Values.y .Values.z | quote }}\n> ```\n>\n> The notation is explained in §4–5; here `printf \"%T\"` shows the type, not the value.\n>\n> ```bash\n> helm template demo /tmp/helm-visual-guide/probe \\\n>   --set 'x=12,y=true,z=1.10' --show-only templates/probe.yaml\n> helm template demo /tmp/helm-visual-guide/probe \\\n>   --set-string x=012 --set x=7 --show-only templates/probe.yaml\n> ```\n>\n> Output; the remaining lines are omitted *(verified)*:\n>\n> ```yaml\n> # first run\n>     x: 12\n>     \"y\": true\n>     z: \"1.10\"\n>   types: \"int64/bool/string\"\n> # second run\n>     x: \"012\"\n>   types: \"string/<nil>/<nil>\"\n> ```\n>\n> For a **YAML file**, parsing works differently. Three files with `image.tag: 1.10`, `image.tag: 010`, and `image.tag: 20240101` produced image strings in the rendered Deployment of `harbor.example.test/demo/democicd@1.1`, `harbor.example.test/demo/democicd@8`, and `harbor.example.test/demo/democicd@2.0240101e+07`, respectively. *(verified: `tag-decimal.log`, `tag-octal.log`, `tag-date.log`)* This is the result of a number being substituted by the template, not a literal serialization of a number through `toYaml`. Therefore, quote string versions in files; `--set-string` does not automatically correct a wrongly typed YAML value from another source.\n>\n> Run with a text file and JSON *(verified)*:\n>\n> ```bash\n> printf 'line one\\nline two\\n' > /tmp/helm-visual-guide/string.txt\n> helm template demo /tmp/helm-visual-guide/probe \\\n>   --set-file x=/tmp/helm-visual-guide/string.txt \\\n>   --set-json 'y={\"a\":1,\"b\":true}' --show-only templates/probe.yaml\n> ```\n>\n> ```yaml\n> # values field fragment\n>     x: |\n>       line one\n>       line two\n>     \"y\":\n>       a: 1\n>       b: true\n>   types: \"string/map[string]interface {}/<nil>\"\n> ```\n\n### Commas, dots and removing a key\n\n**At a glance**\n- A dot in --set separates nested keys.\n- A comma separates assignments.\n- Literal characters must be passed correctly.\n\n**Short scenario**\n\nThe annotation key must be example.com/key, with the value hello,world.\n\n**Predict:** Can the whole string be treated as one simple assignment without escaping?\n\n> [!question]- Answer\n> No. Protect the dot in the key and the comma in the value from Helm's parser, then pass the argument correctly through the shell.\n\nThis follows from the stated conditions. The full earlier analysis and its verification limits are preserved below.\n\n> [!info]- Deeper explanation\n> The short route above explains the mechanism and next check. Full listing and observations: [[#Справочный рецепт — Запятые, точки и удаление ключа|reference recipe]].\n\n### Reference recipe — Commas, dots, and deleting a key\n\n**At a glance**\n- CLI escaping and YAML solve different problems.\n- A dot can be part of a literal key.\n- A comma can be part of a value.\n\n**Mini-example:** In a new temporary chart directory, save the main block as `templates/example.yaml` and add the files below. Then run `helm lint . --set 'annotations.example\\.com/key=hello\\,world'` and `helm template demo . --dry-run=client --set 'annotations.example\\.com/key=hello\\,world'`. No cluster is used.\n\n```gotemplate\napiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: {{ .Release.Name }}\ndata:\n  result: {{ index .Values.annotations \"example.com/key\" | quote }}\n```\n\nFile `Chart.yaml`:\n\n```yaml\napiVersion: v2\nname: mini\nversion: 0.1.0\nappVersion: \"2.0.0\"\n```\n\nFile `values.yaml`:\n\n```yaml\nannotations: {}\n```\n\n**Predict:** Will the comma remain part of one value?\n\n> [!question]- Answer\n> Actual `helm template` output (stdout and stderr):\n>\n> ```text\n> ---\n> # Source: mini/templates/example.yaml\n> apiVersion: v1\n> kind: ConfigMap\n> metadata:\n>   name: demo\n> data:\n>   result: \"hello,world\"\n> ```\n>\n> Exit codes: lint=0, template=0.\n\nThe argument passes the escaped dot and comma to Helm. The `index` function reads the literal key example.com/key from the map.\n\n> [!info]- Deeper explanation\n> A comma separates pairs in `--set`; a dot separates nested keys. The shell and Helm parser are two different layers. To use a literal dot in an annotation name and a comma in its text, the backslash must survive the shell:\n>\n> ```bash\n> helm template demo /tmp/helm-visual-guide/democicd \\\n>   --set 'podAnnotations.example\\.com/key=hello\\,world' \\\n>   --show-only templates/deployment.yaml\n> ```\n>\n> ```yaml\n>       annotations:\n>         example.com/key: hello,world\n> ```\n>\n> *(verified)* With `--set x=hello,world`, the actual error is:\n>\n> ```text\n> Error: failed parsing --set data: key \"world\" has no value\n> ```\n>\n> To switch from an HTTP probe to a command, remove the original `httpGet`; otherwise the merged probe has two handlers. Key deletion was checked locally; probe validity against the API was not checked:\n>\n> ```bash\n> helm template demo /tmp/helm-visual-guide/probe \\\n>   --set 'livenessProbe.httpGet=null,livenessProbe.exec.command[0]=true' \\\n>   --show-only templates/deployment.yaml\n> ```\n>\n> ```yaml\n>         livenessProbe:\n>             exec:\n>               command:\n>               - true\n> ```\n>\n> > [!failure] Common mistake\n> > Here `true` became a boolean, but Kubernetes expects strings in `command`. The correct override deletes `httpGet` and passes a string list at the same time:\n> > ```bash\n> > --set livenessProbe.httpGet=null --set-json 'livenessProbe.exec.command=[\"true\"]'\n> > ```\n> > Check the corrected version separately against the API (§19), rather than only printing the YAML. This probe replacement was not tested in the reviewer's run.\n>\n> The corrected render was also run *(verified, `null-string.log`)*:\n>\n> ```bash\n> helm template demo /tmp/helm-visual-guide/democicd \\\n>   --set livenessProbe.httpGet=null --set-json 'livenessProbe.exec.command=[\"true\"]' \\\n>   --show-only templates/deployment.yaml\n> ```\n>\n> ```yaml\n>         livenessProbe:\n>             exec:\n>               command:\n>               - \"true\"\n> ```\n>\n> **Predict:** Will `-f a.yaml -f b.yaml --set-string replicaCount=5` pass with a schema that requires an integer?\n>\n> > [!question]- Answer\n> > No: the final value is a string. In the checked run with the string `3`, Helm reported:\n> > ```text\n> > - at '/replicaCount': got string, want integer\n> > ```\n> > Without a schema, quotes may be absent from the output `replicas: {{ .Values.replicaCount }}`; that does not make the source type correct.\n>\n> **Briefly — How does Helm merge values?**\n>\n> > Helm starts with chart defaults and applies values files in order. Command-line values override them. Maps merge by key, while lists are replaced. I use quoted strings or set-string when a value must stay a string.\n"
