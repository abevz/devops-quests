heading: 3. Путь значения и типы [values]
text: "## 3. Путь значения и типы [values]\n\n**Коротко**\n- Values объединяются до выполнения шаблона\n- Аргумент может заменить исходное значение\n- Тип значения влияет на дальнейшую проверку.\n\n**Мини-пример:** в новом временном каталоге chart сохрани основной блок как `templates/example.yaml` и дополнительные файлы ниже. Затем выполни `helm lint . --set replicaCount=5` и `helm template demo . --dry-run=client --set replicaCount=5`. Кластер не используется.\n\n```gotemplate\napiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: {{ .Release.Name }}\ndata:\n  result: {{ .Values.replicaCount | quote }}\n```\n\nФайл `Chart.yaml`:\n\n```yaml\napiVersion: v2\nname: mini\nversion: 0.1.0\nappVersion: \"2.0.0\"\n```\n\nФайл `values.yaml`:\n\n```yaml\nreplicaCount: 2\n```\n\n**Предскажи:** Какое число попадёт в строку result?\n\n> [!question]- Ответ\n> Фактический вывод `helm template` (stdout и stderr):\n>\n> ```text\n> ---\n> # Source: mini/templates/example.yaml\n> apiVersion: v1\n> kind: ConfigMap\n> metadata:\n>   name: demo\n> data:\n>   result: \"5\"\n> ```\n>\n> Коды завершения: lint=0, template=0.\n\nШаблон читает итоговое replicaCount=5 из --set; quote делает поле ConfigMap строкой.\n\n> [!info]- Глубже\n> > [!info] Ядро и справочник\n> > Ядро: путь значения, merge maps и замена lists. Различия --set/--set-string/--set-json/--set-file и экранирование запятых/точек — справочник после обычного values.yaml.\n>\n> Начнём с исходных `replicaCount: 2` и `image.repository: harbor.example.test/demo/democicd`. Helm загружает эти значения, накладывает переданные файлы, затем аргументы значений. В шаблоне они становятся `.Values.replicaCount` и `.Values.image.repository`. После вычисления это обычные поля `spec.replicas` и `spec.template.spec.containers[].image`. *(проверено: исходный рендер)*\n>\n> ```mermaid\n> flowchart TB\n>     A[\"values.yaml: replicaCount=2; image.repository=harbor.example.test/demo/democicd\"] --> B[\"-f a.yaml: 3; example.invalid/app\"]\n>     B --> C[\"-f b.yaml: replicaCount=4\"]\n>     C --> D[\"--set replicaCount=5\"]\n>     D --> E[\"Объединённые .Values: 5; example.invalid/app\"]\n>     E --> F[\"deployment.yaml: .Values.replicaCount; .Values.image.repository\"]\n>     F --> G[\"Манифест: replicas: 5; image: example.invalid/app@0.1.0\"]\n>     G --> H[\"При install/upgrade: API Kubernetes\"]\n>     H --> I[\"Deployment → ReplicaSet → поды; kubelet читает образ\"]\n> ```\n>\n> Последние два шага диаграммы *(по документации)* [Установка](https://helm.sh/docs/helm/helm_install/); в локальном `template` их нет.\n\n### Порядок и слияние\n\n**Коротко**\n- Файлы применяются в заданном порядке\n- Словари объединяются по ключам\n- Списки обычно заменяются целиком.\n\n**Мини-пример:** в новом временном каталоге chart сохрани основной блок как `templates/example.yaml` и дополнительные файлы ниже. Затем выполни `helm lint . -f a.yaml -f b.yaml` и `helm template demo . --dry-run=client -f a.yaml -f b.yaml`. Кластер не используется.\n\n```gotemplate\napiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: merge\ndata:\n  repository: {{ .Values.image.repository | quote }}\n  tag: {{ .Values.image.tag | quote }}\n  items: {{ .Values.items | toJson | quote }}\n```\n\nФайл `Chart.yaml`:\n\n```yaml\napiVersion: v2\nname: mini\nversion: 0.1.0\nappVersion: \"2.0.0\"\n```\n\nФайл `values.yaml`:\n\n```yaml\nimage: {repository: base, tag: old}\nitems: [a, b]\n```\n\nФайл `a.yaml`:\n\n```yaml\nimage: {repository: team/app}\n```\n\nФайл `b.yaml`:\n\n```yaml\nimage: {tag: new}\nitems: [c]\n```\n\n**Предскажи:** Сохранятся ли repository из первого файла и оба прежних элемента списка?\n\n> [!question]- Ответ\n> Фактический вывод `helm template` (stdout и stderr):\n>\n> ```text\n> ---\n> # Source: mini/templates/example.yaml\n> apiVersion: v1\n> kind: ConfigMap\n> metadata:\n>   name: merge\n> data:\n>   repository: \"team/app\"\n>   tag: \"new\"\n>   items: \"[\\\"c\\\"]\"\n> ```\n>\n> Коды завершения: lint=0, template=0.\n\nВторой файл меняет tag и весь список, но не repository. Поэтому repository сохраняется, а items содержит только c.\n\n> [!info]- Глубже\n> Файлы `-f` применяются слева направо; последний побеждает при конфликте одного ключа. Словари объединяются по ключам, **списки заменяются целиком**, а не дополняются. `null` удаляет ключ из значений по умолчанию. *(по документации)* [Значения](https://helm.sh/docs/chart_template_guide/values_files/).\n>\n> Два реально использованных файла:\n>\n> ```yaml\n> # /tmp/helm-visual-guide/a.yaml\n> replicaCount: 3\n> image:\n>   repository: example.invalid/app\n> podAnnotations:\n>   a: first\n> imagePullSecrets:\n>   - name: first\n> ```\n>\n> ```yaml\n> # /tmp/helm-visual-guide/b.yaml\n> replicaCount: 4\n> podAnnotations:\n>   b: second\n> imagePullSecrets:\n>   - name: second\n> ```\n>\n> ```bash\n> helm template demo /tmp/helm-visual-guide/democicd \\\n>   -f /tmp/helm-visual-guide/a.yaml -f /tmp/helm-visual-guide/b.yaml \\\n>   --set replicaCount=5 --show-only templates/deployment.yaml\n> ```\n>\n> Настоящие фрагменты результата *(проверено)*:\n>\n> ```yaml\n>   replicas: 5\n> # пропущены selector и другие поля\n>       annotations:\n>         a: first\n>         b: second\n> # пропущены метки\n>       imagePullSecrets:\n>         - name: second\n>       containers:\n>       - image: \"example.invalid/app@0.1.0\"\n> ```\n>\n> Репозиторий пришёл из первого файла, число реплик — из аргумента CLI; метки `a` и `b` сохранились вместе, первый элемент списка исчез. Ошибка образа не помешала локальному рендеру (§18).\n\n### Четыре вида аргументов\n\n**Коротко**\n- Разные флаги читают разные представления\n- Строка и число не взаимозаменяемы\n- Тип нужно проверять в итоговых values.\n\n**Короткий сценарий**\n\n--set x=12 и --set-string y=12 переданы в один chart.\n\n**Предскажи:** Обязательно ли x и y одного типа?\n\n> [!question]- Ответ\n> Нет. Второй флаг явно задаёт строку; подробный рецепт ниже показывает типы при рендере.\n\nЭто вывод из заданных условий. Полный прежний разбор и его границы проверки сохранены ниже.\n\n> [!info]- Глубже\n> Краткий маршрут выше задаёт механизм и следующую проверку. Полный листинг и наблюдения: [[#Справочный рецепт — Четыре вида аргументов|справочный рецепт]].\n\n### Справочный рецепт — Четыре вида аргументов\n\n**Коротко**\n- Set-string сохраняет строковый тип\n- Set-file читает содержимое файла\n- Проверка типа отличается от печати похожих символов.\n\n**Мини-пример:** в новом временном каталоге chart сохрани основной блок как `templates/example.yaml` и дополнительные файлы ниже. Затем выполни `helm lint . --set x=12 --set-string y=12 --set-file text=message.txt` и `helm template demo . --dry-run=client --set x=12 --set-string y=12 --set-file text=message.txt`. Кластер не используется.\n\n```gotemplate\napiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: argument-types\ndata:\n  xType: {{ printf \"%T\" .Values.x | quote }}\n  yType: {{ printf \"%T\" .Values.y | quote }}\n  file: {{ .Values.text | trim | quote }}\n```\n\nФайл `Chart.yaml`:\n\n```yaml\napiVersion: v2\nname: mini\nversion: 0.1.0\nappVersion: \"2.0.0\"\n```\n\nФайл `values.yaml`:\n\n```yaml\n{}\n```\n\nФайл `message.txt`:\n\n```text\nline from file\n```\n\n**Предскажи:** Совпадут ли типы x и y?\n\n> [!question]- Ответ\n> Фактический вывод `helm template` (stdout и stderr):\n>\n> ```text\n> ---\n> # Source: mini/templates/example.yaml\n> apiVersion: v1\n> kind: ConfigMap\n> metadata:\n>   name: argument-types\n> data:\n>   xType: \"int64\"\n>   yType: \"string\"\n>   file: \"line from file\"\n> ```\n>\n> Коды завершения: lint=0, template=0.\n\nx разбирается как число, y задан строкой. Text приходит из файла целиком; это третий отдельный способ передачи.\n\n> [!info]- Глубже\n> | Аргумент | Что читает | Где полезен |\n> |---|---|---|\n> | `--set replicaCount=3` | Структуру ключей и значения с собственным разбором типов | Число или логический параметр |\n> | `--set-string image.tag=012` | Принудительно строку | Теги и идентификаторы с ведущими нулями |\n> | `--set-file config=/tmp/config.txt` | Содержимое файла как строку | Многострочный текст, а не новый файл значений |\n> | `--set-json 'imagePullSecrets=[]'` | JSON-значение: список, объект, число и другое | Структурированное переопределение |\n>\n> *(по документации)* [Аргументы установки](https://helm.sh/docs/helm/helm_install/). Флаг `--set-file` не равен `-f`: первый кладёт **текст** в один ключ, второй читает **структуру YAML**.\n>\n> Порядок **разных видов** флагов нельзя понимать как универсальное «последний в строке». В этой версии `--set-string` применяется после `--set`; внутри одного вида последний конфликтующий ключ побеждает. *(проверено; также [[Kubernetes-for-DevOps-Theory#7. Helm 4: что изменилось и где ломается|§7 шпаргалки]])*\n>\n> В копию `probe` добавлен `templates/probe.yaml`: минимальный ConfigMap с выводом значений и типов. Это инструмент наблюдения, а не исходная часть чарта:\n>\n> Нотация примера: `|` передаёт результат слева последним аргументом функции справа; `toYaml` превращает словарь в YAML-текст; `indent 4` сдвигает его строки на четыре пробела; `quote` заключает результат в кавычки. `printf` форматирует строку, а `%T` показывает тип аргумента. Эти функции работают при вычислении шаблона, не в Kubernetes API. *(по документации)* [Функции](https://helm.sh/docs/chart_template_guide/function_list/).\n>\n> ```yaml\n> apiVersion: v1\n> kind: ConfigMap\n> metadata:\n>   name: probe\n> data:\n>   values: |\n> {{ toYaml .Values | indent 4 }}\n>   types: {{ printf \"%T/%T/%T\" .Values.x .Values.y .Values.z | quote }}\n> ```\n>\n> Нотация разобрана в §4–5; здесь `printf \"%T\"` показывает тип, а не значение.\n>\n> ```bash\n> helm template demo /tmp/helm-visual-guide/probe \\\n>   --set 'x=12,y=true,z=1.10' --show-only templates/probe.yaml\n> helm template demo /tmp/helm-visual-guide/probe \\\n>   --set-string x=012 --set x=7 --show-only templates/probe.yaml\n> ```\n>\n> Вывод, остальные строки пропущены *(проверено)*:\n>\n> ```yaml\n> # первый запуск\n>     x: 12\n>     \"y\": true\n>     z: \"1.10\"\n>   types: \"int64/bool/string\"\n> # второй запуск\n>     x: \"012\"\n>   types: \"string/<nil>/<nil>\"\n> ```\n>\n> Для **файла YAML** разбор другой. Три файла с `image.tag: 1.10`, `image.tag: 010` и `image.tag: 20240101` дали в исходном Deployment соответственно строки образа `harbor.example.test/demo/democicd@1.1`, `harbor.example.test/demo/democicd@8`, `harbor.example.test/demo/democicd@2.0240101e+07`. *(проверено: `tag-decimal.log`, `tag-octal.log`, `tag-date.log`)* Это результат подстановки числа шаблоном, не буквальная сериализация числа через `toYaml`. Поэтому строковые версии в файлах заключают в кавычки; `--set-string` не исправляет чужой неверно типизированный YAML автоматически.\n>\n> Запуск с текстовым файлом и JSON *(проверено)*:\n>\n> ```bash\n> printf 'line one\\nline two\\n' > /tmp/helm-visual-guide/string.txt\n> helm template demo /tmp/helm-visual-guide/probe \\\n>   --set-file x=/tmp/helm-visual-guide/string.txt \\\n>   --set-json 'y={\"a\":1,\"b\":true}' --show-only templates/probe.yaml\n> ```\n>\n> ```yaml\n> # фрагмент поля values\n>     x: |\n>       line one\n>       line two\n>     \"y\":\n>       a: 1\n>       b: true\n>   types: \"string/map[string]interface {}/<nil>\"\n> ```\n\n### Запятые, точки и удаление ключа\n\n**Коротко**\n- Точка в --set разделяет вложенные ключи\n- Запятая разделяет присваивания\n- Буквальные символы требуют правильной передачи.\n\n**Короткий сценарий**\n\nНужен ключ аннотации example.com/key со значением hello,world.\n\n**Предскажи:** Можно ли без экранирования трактовать всю строку как одно простое присваивание?\n\n> [!question]- Ответ\n> Нет. Нужно защитить точку ключа и запятую значения от разбора Helm, а затем корректно передать аргумент оболочке.\n\nЭто вывод из заданных условий. Полный прежний разбор и его границы проверки сохранены ниже.\n\n> [!info]- Глубже\n> Краткий маршрут выше задаёт механизм и следующую проверку. Полный листинг и наблюдения: [[#Справочный рецепт — Запятые, точки и удаление ключа|справочный рецепт]].\n\n### Справочный рецепт — Запятые, точки и удаление ключа\n\n**Коротко**\n- Экранирование CLI и YAML решают разные задачи\n- Точка может быть частью буквального ключа\n- Запятая может быть частью значения.\n\n**Мини-пример:** в новом временном каталоге chart сохрани основной блок как `templates/example.yaml` и дополнительные файлы ниже. Затем выполни `helm lint . --set 'annotations.example\\.com/key=hello\\,world'` и `helm template demo . --dry-run=client --set 'annotations.example\\.com/key=hello\\,world'`. Кластер не используется.\n\n```gotemplate\napiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: {{ .Release.Name }}\ndata:\n  result: {{ index .Values.annotations \"example.com/key\" | quote }}\n```\n\nФайл `Chart.yaml`:\n\n```yaml\napiVersion: v2\nname: mini\nversion: 0.1.0\nappVersion: \"2.0.0\"\n```\n\nФайл `values.yaml`:\n\n```yaml\nannotations: {}\n```\n\n**Предскажи:** Сохранится ли запятая в одном значении?\n\n> [!question]- Ответ\n> Фактический вывод `helm template` (stdout и stderr):\n>\n> ```text\n> ---\n> # Source: mini/templates/example.yaml\n> apiVersion: v1\n> kind: ConfigMap\n> metadata:\n>   name: demo\n> data:\n>   result: \"hello,world\"\n> ```\n>\n> Коды завершения: lint=0, template=0.\n\nАргумент передаёт Helm защищённые точку и запятую. Index читает буквальный ключ example.com/key из словаря.\n\n> [!info]- Глубже\n> Запятая разделяет пары в `--set`; точка разделяет вложенные ключи. Оболочка и парсер Helm — два разных слоя. Для настоящей точки в имени аннотации и запятой в тексте нужен обратный слеш, сохранённый оболочкой:\n>\n> ```bash\n> helm template demo /tmp/helm-visual-guide/democicd \\\n>   --set 'podAnnotations.example\\.com/key=hello\\,world' \\\n>   --show-only templates/deployment.yaml\n> ```\n>\n> ```yaml\n>       annotations:\n>         example.com/key: hello,world\n> ```\n>\n> *(проверено)* При `--set x=hello,world` настоящий отказ:\n>\n> ```text\n> Error: failed parsing --set data: key \"world\" has no value\n> ```\n>\n> Для перехода с HTTP-пробы на команду надо удалить исходный `httpGet`, иначе после слияния у пробы окажутся два обработчика. Локально проверено удаление ключа; валидность пробы в API не проверялась:\n>\n> ```bash\n> helm template demo /tmp/helm-visual-guide/probe \\\n>   --set 'livenessProbe.httpGet=null,livenessProbe.exec.command[0]=true' \\\n>   --show-only templates/deployment.yaml\n> ```\n>\n> ```yaml\n>         livenessProbe:\n>             exec:\n>               command:\n>               - true\n> ```\n>\n> > [!failure] Типичная ошибка\n> > Здесь `true` стал логическим значением, а Kubernetes ждёт строки в `command`. Правильное переопределение — одновременно удалить `httpGet` и передать строковый список:\n> > ```bash\n> > --set livenessProbe.httpGet=null --set-json 'livenessProbe.exec.command=[\"true\"]'\n> > ```\n> > Исправленный вариант надо отдельно проверить через API (§19), а не только напечатать YAML. Эта замена пробы в прогоне рецензента не испытывалась.\n>\n> Сам исправленный рендер тоже выполнен *(проверено, `null-string.log`)*:\n>\n> ```bash\n> helm template demo /tmp/helm-visual-guide/democicd \\\n>   --set livenessProbe.httpGet=null --set-json 'livenessProbe.exec.command=[\"true\"]' \\\n>   --show-only templates/deployment.yaml\n> ```\n>\n> ```yaml\n>         livenessProbe:\n>             exec:\n>               command:\n>               - \"true\"\n> ```\n>\n> **Предскажи:** `-f a.yaml -f b.yaml --set-string replicaCount=5` со схемой, требующей целое число, пройдёт?\n>\n> > [!question]- Ответ\n> > Нет: последнее значение — строка. В проверенном прогоне со строкой `3` Helm сообщил:\n> > ```text\n> > - at '/replicaCount': got string, want integer\n> > ```\n> > Без схемы кавычки могут не появиться в выводе `replicas: {{ .Values.replicaCount }}`; это не делает исходный тип корректным.\n>\n> **Коротко по-английски — How does Helm merge values?**\n>\n> > Helm starts with chart defaults and applies values files in order. Command-line values override them. Maps merge by key, while lists are replaced. I use quoted strings or set-string when a value must stay a string.\n"
source_hash: 1b8f62f6fa767d31a7fcd0fb6dfa4e67a5eeb1e842b116e348f13c40588ac8eb
