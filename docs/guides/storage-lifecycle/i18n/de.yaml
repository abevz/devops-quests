heading: Speicher, Identität und sicheres Aufräumen
text: |
  # Speicher, Identität und sicheres Aufräumen

  Claim-Identität, laufender Prozess und Volume-Bytes sind unterschiedliche Belege. Erhalte einen bekannten Quelldatensatz, während du nutzbare Zielkapazität feststellst. Ein Ersatzprozess stellt fehlende Dateien nicht automatisch wieder her, und ein gebundener Claim belegt keinen Inhalt. Claim-Definitionen im Namespace, Pod-Mounts und tatsächliche Dateien verbinden Speicheridentität mit dem Anwendungsergebnis, ohne Zugriff auf einen clusterweiten Katalog vorauszusetzen.

  Stateful Discovery verbindet governing Headless-Service, ordinalen Pod und erhaltenen Claim. Bereitschaft allein belegt keinen passenden Listener. Ein unabhängiger Netzwerkverbraucher muss das Ordinal im richtigen Namespace auflösen und die aktuelle Quellantwort ohne deren Daten-Claim veröffentlichen. Vergleiche Quellidentität, Verbrauchereigentümer, Resolver-Suffix und beide Schnittstellen; das sind aktuelle Beobachtungen, kein Anfragenverlauf.

  PersistentVolume (PV) und PersistentVolumeClaim (PVC) sind unterschiedliche Objekte. Die PV-Reclaim-Policy `Retain` bewahrt das Volume nach Entfernen eines Claims für manuelle Wiederherstellung; der Standard einer StorageClass ändert bestehende PVs nicht rückwirkend. Lies in der Wiederherstellungsquest `volume-contract.json` und `original-claim-uid`, prüfe, dass der alte Claim weg ist, und nutze UID-Vorbedingungen mit den bereitgestellten Werten vor dem Entfernen der alten Claim-Referenz. Warte, bis der Ersatz-Claim gebunden ist. Dieses lokale Übungs-Volume ist kein Backup außerhalb des Hosts.

  Ein Wiederherstellungspunkt umfasst alle Speicher einer Anwendungstransaktion. Zwei einzeln gültige Kopien können verschiedene Generationen kombinieren, wenn ein Writer Dateien nacheinander veröffentlicht. Lies das Checkpoint-Protokoll und vergleiche Markierungen, Generationen und Aggregate statt nur erfolgreiche Kopierbefehle. Das ursprüngliche statische Ledger-Archiv bleibt eine eigene Integritätsprüfung. Vergleiche bei der Wiederherstellung den gewählten Checkpoint mit gemounteten Dateien und Antworten aktueller Verbraucher und erhalte PVC- und Workload-Identitäten. Dieses begrenzte synthetische Protokoll ersetzt kein Backup einer laufenden Datenbank.

  Ein Finalizer steht für eine Bereinigungspflicht, nicht bloß ein Löschhindernis. Ausmusterung kann Verbraucher betreffen, deren Vorlagen noch die alte Konfiguration nennen. Bestehende Pods können projizierte Bytes nach Löschung der Quelle behalten; ein neuer Pod wird dadurch nicht startfähig. Verfolge UID-gebundene Beziehungen, Lebensdauer des Nachfolgers und Quellen in Vorlagen sowie aktuellen Pods. Unabhängige Kontrolldaten müssen erhalten bleiben. Aktuelle Prüfungen belegen Identitäten, Lieferung und Abwesenheit, aber keinen vollständigen Befehlsverlauf.

  Quellen: [StatefulSets](https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/), [PV-Reclaim-Policy](https://kubernetes.io/docs/tasks/administer-cluster/change-pv-reclaim-policy/), [Finalizer](https://kubernetes.io/docs/concepts/overview/working-with-objects/finalizers/).

  Prüfe für Quest 111 die erhaltene Quelle und den Verbrauchervertrag:

  ```sh
  cd ~/quest
  cat discovery-contract.json
  kubectl get statefulset,pvc,service,pods -o yaml
  kubectl exec shelf-0 -c worker -- cat /etc/resolv.conf
  ```

  Prüfe in Quest 124 das PV:

  ```sh
  volume=$(jq -r .volume volume-contract.json)
  kubectl get pv "$volume" -o yaml
  ```

  Prüfe für Quest 128 das Checkpoint-Format und vergleiche beide Speicher mit den Archiveinträgen. Ein Archiv kann eine Integritätsprüfung bestehen und trotzdem inkompatible Anwendungsgenerationen kombinieren:

  ```sh
  cd ~/quest
  cat checkpoint-contract.json
  tar tf ledger.tar
  tar xOf ledger.tar ledger.txt | sha256sum
  tar tf checkpoint.tar
  tar xOf checkpoint.tar orders.tsv
  tar xOf checkpoint.tar summary.json
  kubectl get deployment,pvc,pods -o yaml
  kubectl exec deployment/client -- wget -qO- -T 3 http://ledger:8080/orders.tsv
  kubectl exec deployment/client -- wget -qO- -T 3 http://summary:8080/summary.json
  ```

  Prüfe für Quest 129 Ausmusterungsverträge und Metadaten ohne Ausgabe von Secret-Daten. Betrachte Verbraucherverweise und aktuelle Fingerabdrücke getrennt vom Finalizer-Zustand; gesunde alte Pods allein belegen keine sichere Ausmusterung.

  ```sh
  cat cleanup-contract.json retirement-contract.json
  kubectl get configmap,secret -o json | jq '.items[] | {kind,name:.metadata.name,uid:.metadata.uid,parentUID:.metadata.labels["training.devops-quests.local/parent-uid"],owners:.metadata.ownerReferences,deleting:.metadata.deletionTimestamp}'
  kubectl get deployments -o json | jq '.items[] | {name:.metadata.name,uid:.metadata.uid,volumes:.spec.template.spec.volumes,mounts:[.spec.template.spec.containers[] | {name,volumeMounts}]}'
  kubectl get pods -o wide
  ```


  ### Ursprüngliche StatefulSet-Identität {#q111-shelf-retained-controller}

  Das StatefulSet wurde möglicherweise unter gleichem Namen neu erstellt und hat dadurch dauerhaft eine andere UID. Vergleichen Sie sie vor der Vorlagenänderung mit dem festgehaltenen Original.

  ```bash
  kubectl get statefulset shelf -o jsonpath='{.metadata.uid}'
  ```

  ### Ursprünglicher Ledger-PVC {#q111-shelf-retained-ledger-claim}

  Der Ledger-PVC wurde möglicherweise neu erstellt oder ist nicht lesbar. Vergleichen Sie die UID von ledger-shelf-0 mit dem ursprünglichen Beleg und behalten Sie den vorhandenen PVC bei.

  ```bash
  kubectl get pvc ledger-shelf-0 -o jsonpath='{.metadata.uid}'
  ```

  ### Ersatz des ordinalen Pods {#q111-shelf-ordinal-replacement}

  Der ordinale Pod hat trotz Vorlagenänderung möglicherweise noch seine ursprüngliche UID. Warten Sie auf den Ersatz von shelf-0 bei gleichem ordinalen Namen und persistentem PVC.

  ```bash
  kubectl get pod shelf-0 -o jsonpath='{.metadata.uid}'
  ```

  ### Ledger-Mount {#q111-shelf-ledger-mount}

  Der Worker verwendet möglicherweise einen anderen Mount, Unterpfad oder Schreibschutz. Prüfen Sie den einzigen vollständigen beschreibbaren Ledger-Mount auf /data im Worker.

  ```bash
  kubectl get statefulset shelf -o json | jq '.spec.template.spec.containers[] | select(.name == "worker") | .volumeMounts'
  ```


  ### Name des Volumes im Vertrag {#q124-pv-contract-volume}

  Prüfe, ob der bereitgestellte Vertrag den Namen des Volumes enthält.

  ```bash
  jq -er .volume /run/dq/facts/0/volume-contract.json
  ```

  ### UID des ursprünglichen PV im Vertrag {#q124-pv-contract-uid}

  Prüfe, ob der bereitgestellte Vertrag die UID des ursprünglichen PV enthält.

  ```bash
  jq -er .pv_uid /run/dq/facts/0/volume-contract.json
  ```

  ### Aktuelle Identität des PV {#q124-pv-live-identity}

  Der im Vertrag erfasste PV fehlt möglicherweise oder hat eine andere UID. Vergleiche die aktuelle UID mit pv_uid in volume-contract.json.

  ```bash
  contract=/run/dq/facts/0/volume-contract.json; volume=$(jq -er .volume "$contract"); jq -er .pv_uid "$contract"; kubectl get pv "$volume" -o jsonpath='{.metadata.uid}'
  ```

  ### Speicherklasse des PV {#q124-pv-storage-class}

  Der PV hat möglicherweise einen anderen Wert für storageClassName. Vergleiche ihn mit volume in volume-contract.json.

  ```bash
  volume=$(jq -er .volume /run/dq/facts/0/volume-contract.json); printf '%s\n' "$volume"; kubectl get pv "$volume" -o jsonpath='{.spec.storageClassName}'
  ```

  ### Richtlinie Retain am PV {#q124-pv-retain-policy}

  Die Rückgewinnungsrichtlinie Retain fehlt möglicherweise am PV. Prüfe die aktuelle Richtlinie vor der Änderung des PVC.

  ```bash
  volume=$(jq -er .volume /run/dq/facts/0/volume-contract.json); kubectl get pv "$volume" -o jsonpath='{.spec.persistentVolumeReclaimPolicy}'
  ```

  ### Aktuelle Phase des PV {#q124-pv-bound-phase}

  Der PV wartet möglicherweise noch auf einen passenden PVC. Prüfe, ob seine aktuelle Phase Bound ist.

  ```bash
  volume=$(jq -er .volume /run/dq/facts/0/volume-contract.json); kubectl get pv "$volume" -o jsonpath='{.status.phase}'
  ```

  ### Verweis auf den aktuellen PVC {#q124-pv-current-claimref}

  Der PV verweist möglicherweise noch auf einen früheren ledger-PVC. Vergleiche claimRef.uid mit der UID des aktuellen ledger-PVC.

  ```bash
  volume=$(jq -er .volume /run/dq/facts/0/volume-contract.json); kubectl get pv "$volume" -o jsonpath='{.spec.claimRef.uid}'; kubectl get pvc ledger -o jsonpath='{.metadata.uid}'
  ```

  ### Ursprünglicher ledger-PVC {#q124-pv-original-claim}

  Der ledger-PVC fehlt möglicherweise oder wurde bereits ersetzt. In dieser Phase muss seine UID mit original-claim-uid übereinstimmen.

  ```bash
  cat /run/dq/facts/0/original-claim-uid; kubectl get pvc ledger -o jsonpath='{.metadata.uid}'
  ```

  ### Neuer ledger-PVC {#q124-pv-replacement-claim}

  Der neue ledger-PVC fehlt möglicherweise oder der ursprüngliche PVC ist noch vorhanden. Vergleiche in dieser Phase seine UID mit original-claim-uid und bestätige, dass sie sich unterscheiden.

  ```bash
  cat /run/dq/facts/0/original-claim-uid; kubectl get pvc ledger -o jsonpath='{.metadata.uid}'
  ```

  ### Von board gelieferte Daten {#q124-pv-board-content}

  Der Client erreicht board:8080 möglicherweise nicht oder erhält andere Daten. Prüfe, ob die tatsächliche Antwort north-124 lautet.

  ```bash
  kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080
  ```


  ### Einträge im ledger-Archiv {#q128-ledger-single-archive-entry}

  Das Archiv ist möglicherweise nicht lesbar oder enthält andere Einträge. Prüfe, ob ledger.tar genau eine gewöhnliche, nicht dünn besetzte Datei ledger.txt enthält.

  ```bash
  tar -tvf ledger.tar
  ```

  ### Hash der archivierten ledger-Datei {#q128-ledger-captured-file-hash}

  Die archivierten Bytes von ledger.txt weichen möglicherweise ab. Berechne den Hash des extrahierten Datenstroms und vergleiche ihn mit original-ledger.sha256.

  ```bash
  set -o pipefail; entry=$(tar -tf ledger.tar); tar -xOf ledger.tar "$entry" | sha256sum; cat /run/dq/facts/0/original-ledger.sha256
  ```

  ### Eingaben zur Prüfung der Sicherung {#q128-ledger-capture-observer}

  Die Prüfung der Sicherung wurde möglicherweise vor Meldung einer Bedingung abgebrochen. Prüfe die gespeicherten Daten und ob das Archiv lesbar ist.

  ```bash
  test -s /run/dq/facts/0/original-ledger.sha256; test -s /run/dq/facts/0/checkpoint-identities.json; tar -tf ledger.tar
  ```

  ### Konsistentes Checkpoint-Archiv {#q128-checkpoint-coherent-recovery-point}

  checkpoint.tar enthält möglicherweise unerwartete Einträge oder orders.tsv und summary.json aus verschiedenen Generationen. Prüfe gewöhnliche Einträge, gespeicherten Marker, Generation, Routen und Summe der Bestelleinheiten.

  ```bash
  tar -tvf checkpoint.tar; tar -tf checkpoint.tar | while IFS= read -r entry; do printf "%s\n" "$entry"; tar -xOf checkpoint.tar "$entry"; done
  ```

  ### Erhaltene Checkpoint-Objekte {#q128-checkpoint-retained-objects}

  Ein erhaltenes Deployment oder PVC fehlt möglicherweise, wurde neu erstellt oder ein worker-Image hat sich geändert. Vergleiche aktuelle Identitäten und Images mit den Daten des Checkpoints.

  ```bash
  jq '{claims,deployments}' /run/dq/facts/0/checkpoint-identities.json; kubectl get deploy,pvc -o custom-columns=KIND:.kind,NAME:.metadata.name,UID:.metadata.uid,IMAGE:.spec.template.spec.containers[*].image
  ```

  ### UID des erhaltenen ledger-PVC {#q128-ledger-retained-pvc}

  Der ledger-PVC fehlt möglicherweise oder wurde neu erstellt. Vergleiche seine aktuelle UID mit original-pvc-uid.

  ```bash
  cat /run/dq/facts/0/original-pvc-uid; kubectl get pvc ledger -o jsonpath='{.metadata.uid}'
  ```

  ### Eingaben zur Prüfung des erhaltenen Archivs {#q128-ledger-retained-archive-observer}

  Die Prüfung des erhaltenen Archivs wurde möglicherweise vor Meldung einer Bedingung abgebrochen. Prüfe, ob ledger.tar und die bereitgestellte Prüfsumme während der Wiederherstellung lesbar sind.

  ```bash
  test -s /run/dq/facts/0/original-ledger.sha256; tar -tvf ledger.tar
  ```

  ### Hash der wiederhergestellten ledger-Datei {#q128-ledger-current-file-hash}

  Die wiederhergestellte Datei /data/ledger.txt ist möglicherweise nicht lesbar oder enthält andere Bytes. Vergleiche den Hash im ledger-Pod mit original-ledger.sha256.

  ```bash
  kubectl exec deployment/ledger -- sha256sum /data/ledger.txt; cat /run/dq/facts/0/original-ledger.sha256
  ```

  ### Hash der per HTTP gelieferten ledger-Datei {#q128-ledger-served-file-hash}

  Der Client kann die Datei möglicherweise nicht per HTTP lesen oder erhält andere Bytes. Vergleiche den Antwort-Hash für ledger.txt mit original-ledger.sha256.

  ```bash
  set -o pipefail; cat /run/dq/facts/0/original-ledger.sha256; kubectl exec deployment/client -- wget -qO- -T 3 http://ledger:8080/ledger.txt | sha256sum
  ```

  ### Aktuelle Checkpoint-Leser {#q128-checkpoint-current-readers}

  Ein Checkpoint-Leser oder client hat möglicherweise nicht genau einen aktuellen bereiten Pod mit dem ursprünglichen Image. Prüfe Eigentümer, Bereitschaft und Soll-Replikate.

  ```bash
  kubectl get deployment ledger summary client; kubectl get replicasets,pods -o wide
  ```

  ### Inaktiver writer während der Wiederherstellung {#q128-checkpoint-writer-quiet}

  journal-writer hat möglicherweise noch ein Soll-Replikat oder einen aktuellen Pod. Prüfe, ob die Zahl während der Wiederherstellung bei null bleibt, damit keine Dateien überschrieben werden.

  ```bash
  kubectl get deployment journal-writer -o jsonpath='{.spec.replicas}'; kubectl get pods -l app=journal-writer -o name
  ```

  ### PVC-Mounts für die wiederhergestellten Dateien {#q128-checkpoint-restored-claim-mounts}

  Ein wiederhergestellter Pfad verweist möglicherweise auf den falschen PVC oder ist im aktuellen Pod nicht verfügbar. Vergleiche den Mount für den Pfad in Vorlage und Pod mit dem geforderten PVC.

  ```bash
  jq '.contract.stores[] | {deployment,claim,path}' /run/dq/facts/0/checkpoint-identities.json; kubectl get deployment ledger summary -o json | jq '.items[] | {name: .metadata.name, uid: .metadata.uid, spec: .spec.template.spec | {containers,volumes}}'; kubectl get replicaset,pod -o json | jq '.items[] | {kind,name: .metadata.name,uid: .metadata.uid,owners: .metadata.ownerReferences,containers: .spec.containers,volumes: .spec.volumes}'
  ```

  ### Bytes der wiederhergestellten Dateien {#q128-checkpoint-restored-file-bytes}

  Eine wiederhergestellte Datei enthält möglicherweise Bytes aus einem anderen Wiederherstellungspunkt. Vergleiche die aktuellen Hashes von orders.tsv und summary.json mit den jeweiligen Einträgen in checkpoint.tar.

  ```bash
  set -o pipefail; tar -tf checkpoint.tar | while IFS= read -r entry; do printf '%s\n' "$entry"; tar -xOf checkpoint.tar "$entry" | sha256sum; done; kubectl exec deployment/ledger -c worker -- sha256sum /data/orders.tsv; kubectl exec deployment/summary -c worker -- sha256sum /data/summary.json
  ```

  ### Per HTTP gelieferter wiederhergestellter Inhalt {#q128-checkpoint-served-file-bytes}

  Ein Leser liefert möglicherweise andere Bytes als das Archiv. Rufe orders.tsv und summary.json aus dem aktuellen client ab und vergleiche jeden Antwort-Hash mit dem Eintrag in checkpoint.tar.

  ```bash
  set -o pipefail; tar -tf checkpoint.tar | while IFS= read -r entry; do printf '%s\n' "$entry"; tar -xOf checkpoint.tar "$entry" | sha256sum; done; for url in http://ledger:8080/orders.tsv http://summary:8080/summary.json; do kubectl exec deployment/client -c worker -- wget -qO- -T 2 "$url" | sha256sum; done
  ```

  ### Eingaben zur Wiederherstellungsprüfung {#q128-checkpoint-restore-observer}

  Die Wiederherstellungsprüfung wurde möglicherweise vor Meldung einer Bedingung abgebrochen. Prüfe gespeicherte Identitäten, aktuelle Workloads und die Lesbarkeit des Wiederherstellungsarchivs.

  ```bash
  test -s /run/dq/facts/0/checkpoint-identities.json; kubectl get deployments,replicasets,pods; tar -tf checkpoint.tar
  ```

  ### API-Lesezugriff auf die stillgelegte Konfiguration {#q129-retired-config-query}

  Die API-Abfrage nach ConfigMap station ist möglicherweise fehlgeschlagen. Wiederhole den Lesezugriff im Übungs-Namespace und prüfe den kubectl-Fehler.

  ```bash
  kubectl get configmap station --ignore-not-found -o name
  ```

  ### Fehlen der stillgelegten Konfiguration {#q129-retired-config-absence}

  ConfigMap station ist möglicherweise noch vorhanden, auch während einer laufenden Löschung. Prüfe den aktuellen Zustand im Übungs-Namespace.

  ```bash
  kubectl get configmap station --ignore-not-found -o name
  ```

  ### API-Lesezugriff auf das stillgelegte Secret {#q129-retired-record-query}

  Die API-Abfrage nach Secret station-record ist möglicherweise fehlgeschlagen. Frage nur den Namen erneut ab und prüfe den kubectl-Fehler.

  ```bash
  kubectl get secret station-record --ignore-not-found -o name
  ```

  ### Fehlen des stillgelegten Secrets {#q129-retired-record-absence}

  Secret station-record ist möglicherweise noch vorhanden. Prüfe nach dem Wechsel der Verbraucher zum Nachfolger, ob die Stilllegung abgeschlossen ist.

  ```bash
  kubectl get secret station-record --ignore-not-found -o name
  ```

  ### Erhaltene Verbraucher-Workloads {#q129-retirement-retained-workloads}

  Ein Verbraucher-Deployment wurde möglicherweise ersetzt, auf eine andere Replikatzahl als eins skaliert oder auf ein anderes worker-Image umgestellt. Vergleiche dispatch und reporter mit den erfassten Identitäten.

  ```bash
  jq '.consumers' /run/dq/facts/0/retirement-identities.json; kubectl get deployments dispatch reporter -o custom-columns=NAME:.metadata.name,UID:.metadata.uid,REPLICAS:.spec.replicas,IMAGE:.spec.template.spec.containers[0].image
  ```

  ### Aktueller Verbraucher-Pod {#q129-retirement-current-consumer-pod}

  Die Prüfung findet möglicherweise je Verbraucher nicht genau einen aktuellen bereiten Pod mit dem erwarteten Image. Prüfe Deployment, aktives ReplicaSet und zugehörigen Pod.

  ```bash
  jq '.consumers' /run/dq/facts/0/retirement-identities.json; kubectl get deployment dispatch reporter -o custom-columns=NAME:.metadata.name,UID:.metadata.uid; kubectl get replicaset,pod -o json | jq '.items[] | {kind, name: .metadata.name, uid: .metadata.uid, owners: .metadata.ownerReferences, deleting: .metadata.deletionTimestamp, ready: [.status.conditions[]? | select(.type=="Ready")], images: [.spec.containers[]? | {name,image}]}'
  ```

  ### Unabhängiges Nachfolger-Secret {#q129-retirement-independent-successor}

  Der schreibgeschützte Nachfolger-Mount weicht möglicherweise zwischen Vorlage und aktuellem Pod ab oder Daten, UID oder Beziehung zum stillgelegten Elternobjekt stimmen nicht. Vergleiche /config/value, die Metadaten des Nachfolgers und den erfassten Hash.

  ```bash
  jq '{retiredRecordUID,retiredParentUID,dataHash,fingerprint}' /run/dq/facts/0/retirement-identities.json; kubectl get deployments dispatch reporter -o json | jq '.items[] | {name: .metadata.name, spec: .spec.template.spec | {volumes,mounts: [.containers[].volumeMounts]}}'; kubectl get pods -o json | jq '.items[] | {name: .metadata.name, owner: .metadata.ownerReferences, volumes: .spec.volumes, mounts: [.spec.containers[].volumeMounts]}' ; printf 'Successor Secret from the active mount: '; IFS= read -r successor; kubectl get "secret/$successor" -o json | python3 -I -c 'import hashlib,json,sys; value=json.load(sys.stdin); meta=value["metadata"]; print(json.dumps({"uid":meta["uid"],"labels":meta.get("labels",{}),"owners":meta.get("ownerReferences",[]),"dataHash":hashlib.sha256(json.dumps(value["data"],sort_keys=True).encode()).hexdigest()}))'
  ```

  ### Vom Nachfolger eingehängte Bytes {#q129-retirement-mounted-record-bytes}

  Die unter /config/value eingehängten Bytes weichen möglicherweise vom ursprünglichen Eintrag ab. Vergleiche den Hash in jedem aktuellen worker mit dem ursprünglichen Fingerabdruck.

  ```bash
  jq -er .fingerprint /run/dq/facts/0/retirement-identities.json; for name in dispatch reporter; do kubectl exec "deployment/$name" -c worker -- sha256sum /config/value; done
  ```

  ### Vom Verbraucher gelieferter Fingerabdruck {#q129-retirement-served-record-fingerprint}

  Die Anwendung liefert möglicherweise noch einen früheren oder falschen Fingerabdruck. Frage jeden aktuellen worker über Loopback ab und vergleiche den Inhalt mit dem erfassten Fingerabdruck.

  ```bash
  jq -er .fingerprint /run/dq/facts/0/retirement-identities.json; for name in dispatch reporter; do kubectl exec "deployment/$name" -c worker -- wget -qO- -T 2 http://127.0.0.1:8080; done
  ```

  ### Eingaben zur Stilllegungsprüfung der Verbraucher {#q129-retirement-consumer-observer}

  Die Stilllegungsprüfung wurde möglicherweise vor Meldung einer Bedingung abgebrochen. Prüfe bereitgestellte Daten und ob die aktuellen Verbraucherressourcen lesbar sind.

  ```bash
  test -s /run/dq/facts/0/retirement-identities.json; kubectl get deployments,replicasets,pods
  ```

  ### Identität des erhaltenen control-Secrets {#q129-retirement-control-secret-identity}

  Secret control fehlt möglicherweise oder hat eine andere UID. Vergleiche die aktuelle UID mit control_uid aus dem Bereinigungsvertrag.

  ```bash
  kubectl get secret control -o jsonpath='{.metadata.uid}'; jq -er .control_uid /run/dq/facts/0/cleanup-contract.json
  ```

  ### Hash der erhaltenen control-Daten {#q129-retirement-control-secret-data-hash}

  Die Daten von Secret control haben sich möglicherweise geändert. Vergleiche den Hash der JSON-data-Map mit sortierten Schlüsseln mit control_hash und halte die Werte geheim.

  ```bash
  kubectl get secret control -o json | python3 -c 'import hashlib,json,sys; print(hashlib.sha256(json.dumps(json.load(sys.stdin)["data"],sort_keys=True).encode()).hexdigest())'; jq -er .control_hash /run/dq/facts/0/cleanup-contract.json
  ```

  ### Eingaben zur Prüfung des control-Secrets {#q129-retirement-control-secret-observer}

  Die Prüfung von Secret control wurde möglicherweise vor Meldung einer Bedingung abgebrochen. Prüfe den bereitgestellten Bereinigungsvertrag und den Zugriff auf Secret control.

  ```bash
  kubectl get secret control -o name; test -s /run/dq/facts/0/cleanup-contract.json
  ```
