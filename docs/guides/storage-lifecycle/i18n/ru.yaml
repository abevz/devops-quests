heading: Хранение, идентичность и безопасная очистка
text: |
  # Хранение, идентичность и безопасная очистка

  Идентичность claim, работающий процесс и байты на томе — разные свидетельства. Сохраняйте известный исходный набор данных, определяя, какая целевая ёмкость пригодна. Замена процесса сама по себе не возвращает отсутствующие файлы, а привязка claim не доказывает их содержимое. Namespaced-определения claim, монтирования Pod и фактические файлы связывают идентичность хранилища с результатом приложения без предположения о доступе к каталогу всего кластера.

  Stateful discovery связывает governing headless Service, ordinal Pod и сохранённый claim. Одна готовность не доказывает нужный listener. Независимый сетевой потребитель должен разрешать ordinal в правильном namespace и публиковать текущий ответ, не монтируя исходный claim. Сопоставляйте идентичность источника, владельца потребителя, суффикс resolver и оба интерфейса; это текущие наблюдения, не история запросов.

  PersistentVolume (PV) и PersistentVolumeClaim (PVC) — разные объекты. Политика возврата PV `Retain` сохраняет том для ручного восстановления после удаления claim; настройка StorageClass по умолчанию не меняет существующий PV задним числом. В задании восстановления изучите `volume-contract.json` и `original-claim-uid`, убедитесь, что старый claim удалён, и используйте UID-предусловия с выданными значениями перед удалением старой ссылки claim. Дождитесь привязки нового claim. Этот локальный учебный том не является резервной копией вне узла.

  Точка восстановления охватывает все хранилища, участвующие в транзакции приложения. Две отдельно корректные копии могут объединить разные поколения, если процесс записи публикует файлы по очереди. Изучите протокол согласованного checkpoint приложения и сравните маркеры, поколения и итоги, не полагаясь на успешное завершение команд копирования. Исходный архив неизменяемого реестра остаётся отдельной проверкой целостности. При восстановлении сравните выбранный checkpoint со смонтированными файлами и ответами текущим потребителям, сохраняя идентичность PVC и нагрузок. Этот ограниченный синтетический протокол не заменяет резервное копирование работающей БД.

  Finalizer обозначает обязательство очистки, а не просто флаг, мешающий удалению. Вывод из эксплуатации может затрагивать потребителей, чьи шаблоны ещё ссылаются на прежнюю конфигурацию. Существующие Pod могут сохранить спроецированные байты после удаления источника; это не обеспечивает запуск нового Pod. Проследите связи по UID, срок жизни преемника и источники в шаблонах и текущих Pod. Независимые контрольные данные должны сохраниться. Проверки текущего состояния подтверждают идентичность, доставку и отсутствие объектов, но не полный порядок прошлых команд.

  Источники: [StatefulSet](https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/), [политика возврата PV](https://kubernetes.io/docs/tasks/administer-cluster/change-pv-reclaim-policy/), [finalizer](https://kubernetes.io/docs/concepts/overview/working-with-objects/finalizers/).

  Для задания 111 изучите сохранённый источник и контракт потребителя:

  ```sh
  cd ~/quest
  cat discovery-contract.json
  kubectl get statefulset,pvc,service,pods -o yaml
  kubectl exec shelf-0 -c worker -- cat /etc/resolv.conf
  ```

  В задании 124 проверьте PV:

  ```sh
  volume=$(jq -r .volume volume-contract.json)
  kubectl get pv "$volume" -o yaml
  ```

  Для задания 128 изучите формат checkpoint и сравните оба хранилища с архивными записями. Архив может пройти проверку целостности и всё же объединять несовместимые поколения данных приложения:

  ```sh
  cd ~/quest
  cat checkpoint-contract.json
  tar tf ledger.tar
  tar xOf ledger.tar ledger.txt | sha256sum
  tar tf checkpoint.tar
  tar xOf checkpoint.tar orders.tsv
  tar xOf checkpoint.tar summary.json
  kubectl get deployment,pvc,pods -o yaml
  kubectl exec deployment/client -- wget -qO- -T 3 http://ledger:8080/orders.tsv
  kubectl exec deployment/client -- wget -qO- -T 3 http://summary:8080/summary.json
  ```

  Для задания 129 изучите контракты вывода из эксплуатации и метаданные без вывода данных Secret. Проследите ссылки потребителей и отпечатки смонтированных данных отдельно от состояния finalizer: одной работоспособности старых Pod недостаточно.

  ```sh
  cat cleanup-contract.json retirement-contract.json
  kubectl get configmap,secret -o json | jq '.items[] | {kind,name:.metadata.name,uid:.metadata.uid,parentUID:.metadata.labels["training.devops-quests.local/parent-uid"],owners:.metadata.ownerReferences,deleting:.metadata.deletionTimestamp}'
  kubectl get deployments -o json | jq '.items[] | {name:.metadata.name,uid:.metadata.uid,volumes:.spec.template.spec.volumes,mounts:[.spec.template.spec.containers[] | {name,volumeMounts}]}'
  kubectl get pods -o wide
  ```


  ### Исходный UID StatefulSet {#q111-shelf-retained-controller}

  StatefulSet могли пересоздать под исходным именем, навсегда изменив UID. Сравните его с зафиксированным исходным UID перед правкой шаблона контроллера.

  ```bash
  kubectl get statefulset shelf -o jsonpath='{.metadata.uid}'
  ```

  ### Исходный клейм журнала {#q111-shelf-retained-ledger-claim}

  Клейм журнала могли пересоздать, либо он недоступен для чтения. Сравните UID ledger-shelf-0 с исходной записью и сохраните существующий клейм при восстановлении.

  ```bash
  kubectl get pvc ledger-shelf-0 -o jsonpath='{.metadata.uid}'
  ```

  ### Замена Pod с ordinal {#q111-shelf-ordinal-replacement}

  У Pod с ordinal мог остаться исходный UID даже после правки шаблона. Дождитесь замены shelf-0 контроллером с сохранением имени и постоянного клейма.

  ```bash
  kubectl get pod shelf-0 -o jsonpath='{.metadata.uid}'
  ```

  ### Монтирование журнала {#q111-shelf-ledger-mount}

  У worker могло измениться монтирование, появиться subPath либо режим только для чтения. Проверьте у worker единственное полное монтирование ledger на /data с записью.

  ```bash
  kubectl get statefulset shelf -o json | jq '.spec.template.spec.containers[] | select(.name == "worker") | .volumeMounts'
  ```


  ### Имя тома в контракте {#q124-pv-contract-volume}

  Проверьте, записано ли имя тома в выданном контракте.

  ```bash
  jq -er .volume /run/dq/facts/0/volume-contract.json
  ```

  ### UID исходного PV в контракте {#q124-pv-contract-uid}

  Проверьте, записан ли UID исходного PV в выданном контракте.

  ```bash
  jq -er .pv_uid /run/dq/facts/0/volume-contract.json
  ```

  ### Текущий UID тома {#q124-pv-live-identity}

  PV из контракта может отсутствовать или иметь другой UID. Сравните текущий UID с pv_uid из volume-contract.json.

  ```bash
  contract=/run/dq/facts/0/volume-contract.json; volume=$(jq -er .volume "$contract"); jq -er .pv_uid "$contract"; kubectl get pv "$volume" -o jsonpath='{.metadata.uid}'
  ```

  ### Класс хранилища тома {#q124-pv-storage-class}

  У PV может быть другое значение storageClassName. Сравните его с volume в volume-contract.json.

  ```bash
  volume=$(jq -er .volume /run/dq/facts/0/volume-contract.json); printf '%s\n' "$volume"; kubectl get pv "$volume" -o jsonpath='{.spec.storageClassName}'
  ```

  ### Политика Retain на PV {#q124-pv-retain-policy}

  У PV может отсутствовать политика Retain. Проверьте действующую политику перед изменением PVC.

  ```bash
  volume=$(jq -er .volume /run/dq/facts/0/volume-contract.json); kubectl get pv "$volume" -o jsonpath='{.spec.persistentVolumeReclaimPolicy}'
  ```

  ### Текущая фаза PV {#q124-pv-bound-phase}

  PV может всё ещё ожидать подходящий PVC. Убедитесь, что текущая фаза тома — Bound.

  ```bash
  volume=$(jq -er .volume /run/dq/facts/0/volume-contract.json); kubectl get pv "$volume" -o jsonpath='{.status.phase}'
  ```

  ### Ссылка на текущий PVC {#q124-pv-current-claimref}

  PV может по-прежнему ссылаться на прежний PVC ledger. Сравните claimRef.uid с UID текущего PVC ledger.

  ```bash
  volume=$(jq -er .volume /run/dq/facts/0/volume-contract.json); kubectl get pv "$volume" -o jsonpath='{.spec.claimRef.uid}'; kubectl get pvc ledger -o jsonpath='{.metadata.uid}'
  ```

  ### Исходный PVC ledger {#q124-pv-original-claim}

  PVC ledger мог исчезнуть или уже быть заменён. На этой фазе его UID должен совпадать с original-claim-uid.

  ```bash
  cat /run/dq/facts/0/original-claim-uid; kubectl get pvc ledger -o jsonpath='{.metadata.uid}'
  ```

  ### Новый PVC ledger {#q124-pv-replacement-claim}

  Новый PVC ledger может отсутствовать, а прежний PVC всё ещё существовать. На этой фазе сравните его UID с original-claim-uid и убедитесь, что они различаются.

  ```bash
  cat /run/dq/facts/0/original-claim-uid; kubectl get pvc ledger -o jsonpath='{.metadata.uid}'
  ```

  ### Данные сервиса board {#q124-pv-board-content}

  Клиент может не достучаться до board:8080 или получить другие данные. Проверьте, что в фактическом ответе приходит north-124.

  ```bash
  kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080
  ```


  ### Записи архива ledger {#q128-ledger-single-archive-entry}

  Архив может не читаться или содержать другие записи. Убедитесь, что в ledger.tar ровно один обычный неразреженный файл ledger.txt.

  ```bash
  tar -tvf ledger.tar
  ```

  ### Хеш файла ledger в архиве {#q128-ledger-captured-file-hash}

  Байты ledger.txt в архиве могли измениться. Вычислите хеш потока из архива и сравните с original-ledger.sha256.

  ```bash
  set -o pipefail; entry=$(tar -tf ledger.tar); tar -xOf ledger.tar "$entry" | sha256sum; cat /run/dq/facts/0/original-ledger.sha256
  ```

  ### Данные проверки сохранения архива {#q128-ledger-capture-observer}

  Проверка снимка могла остановиться до вывода конкретного условия. Убедитесь, что исходные данные и архив доступны для чтения.

  ```bash
  test -s /run/dq/facts/0/original-ledger.sha256; test -s /run/dq/facts/0/checkpoint-identities.json; tar -tf ledger.tar
  ```

  ### Согласованный архив контрольной точки {#q128-checkpoint-coherent-recovery-point}

  В checkpoint.tar могут быть лишние записи или orders.tsv и summary.json из разных поколений. Проверьте тип файлов, записанный маркер, поколение, маршруты и сумму единиц заказов.

  ```bash
  tar -tvf checkpoint.tar; tar -tf checkpoint.tar | while IFS= read -r entry; do printf "%s\n" "$entry"; tar -xOf checkpoint.tar "$entry"; done
  ```

  ### Сохранённые объекты контрольной точки {#q128-checkpoint-retained-objects}

  Сохранённые Deployment или PVC могли исчезнуть либо быть пересозданы, а образ worker мог измениться. Сравните текущие UID и образы с исходными данными контрольной точки.

  ```bash
  jq '{claims,deployments}' /run/dq/facts/0/checkpoint-identities.json; kubectl get deploy,pvc -o custom-columns=KIND:.kind,NAME:.metadata.name,UID:.metadata.uid,IMAGE:.spec.template.spec.containers[*].image
  ```

  ### UID сохранённого PVC ledger {#q128-ledger-retained-pvc}

  PVC ledger мог исчезнуть или быть пересоздан. Сравните текущий UID PVC ledger с original-pvc-uid.

  ```bash
  cat /run/dq/facts/0/original-pvc-uid; kubectl get pvc ledger -o jsonpath='{.metadata.uid}'
  ```

  ### Данные проверки сохранённого архива {#q128-ledger-retained-archive-observer}

  Проверка сохранённого архива могла остановиться до вывода конкретного условия. Убедитесь, что ledger.tar и выданная контрольная сумма читаются на фазе восстановления.

  ```bash
  test -s /run/dq/facts/0/original-ledger.sha256; tar -tvf ledger.tar
  ```

  ### Хеш восстановленного файла ledger {#q128-ledger-current-file-hash}

  Восстановленный /data/ledger.txt может не читаться или содержать другие байты. Сравните хеш внутри Pod ledger с original-ledger.sha256.

  ```bash
  kubectl exec deployment/ledger -- sha256sum /data/ledger.txt; cat /run/dq/facts/0/original-ledger.sha256
  ```

  ### Хеш файла ledger из HTTP-ответа {#q128-ledger-served-file-hash}

  Клиент может не получить файл по HTTP или получить другие байты. Сравните хеш ответа для ledger.txt с original-ledger.sha256.

  ```bash
  set -o pipefail; cat /run/dq/facts/0/original-ledger.sha256; kubectl exec deployment/client -- wget -qO- -T 3 http://ledger:8080/ledger.txt | sha256sum
  ```

  ### Текущие читатели контрольной точки {#q128-checkpoint-current-readers}

  У читателя контрольной точки или client может не быть ровно одного текущего готового Pod с исходным образом. Проверьте владельца, готовность и желаемое число реплик.

  ```bash
  kubectl get deployment ledger summary client; kubectl get replicasets,pods -o wide
  ```

  ### Остановленный writer на фазе восстановления {#q128-checkpoint-writer-quiet}

  У journal-writer может оставаться заданная реплика или текущий Pod. Убедитесь, что на фазе восстановления реплик ноль и writer не перезаписывает файлы.

  ```bash
  kubectl get deployment journal-writer -o jsonpath='{.spec.replicas}'; kubectl get pods -l app=journal-writer -o name
  ```

  ### Монтирование PVC для восстановленных файлов {#q128-checkpoint-restored-claim-mounts}

  Восстановленный путь может относиться к другому PVC или быть недоступным в текущем Pod. Сравните покрывающий путь mount в шаблоне и текущем Pod с требуемым PVC.

  ```bash
  jq '.contract.stores[] | {deployment,claim,path}' /run/dq/facts/0/checkpoint-identities.json; kubectl get deployment ledger summary -o json | jq '.items[] | {name: .metadata.name, uid: .metadata.uid, spec: .spec.template.spec | {containers,volumes}}'; kubectl get replicaset,pod -o json | jq '.items[] | {kind,name: .metadata.name,uid: .metadata.uid,owners: .metadata.ownerReferences,containers: .spec.containers,volumes: .spec.volumes}'
  ```

  ### Байты восстановленных файлов {#q128-checkpoint-restored-file-bytes}

  Восстановленный файл может содержать байты из другой контрольной точки. Сравните хеши текущих orders.tsv и summary.json с хешами соответствующих записей в checkpoint.tar.

  ```bash
  set -o pipefail; tar -tf checkpoint.tar | while IFS= read -r entry; do printf '%s\n' "$entry"; tar -xOf checkpoint.tar "$entry" | sha256sum; done; kubectl exec deployment/ledger -c worker -- sha256sum /data/orders.tsv; kubectl exec deployment/summary -c worker -- sha256sum /data/summary.json
  ```

  ### Восстановленные данные из HTTP-ответов {#q128-checkpoint-served-file-bytes}

  Читатель может отдавать другие байты, чем в архиве. Запросите orders.tsv и summary.json из текущего client и сравните хеш каждого ответа с записью в checkpoint.tar.

  ```bash
  set -o pipefail; tar -tf checkpoint.tar | while IFS= read -r entry; do printf '%s\n' "$entry"; tar -xOf checkpoint.tar "$entry" | sha256sum; done; for url in http://ledger:8080/orders.tsv http://summary:8080/summary.json; do kubectl exec deployment/client -c worker -- wget -qO- -T 2 "$url" | sha256sum; done
  ```

  ### Данные проверки восстановления {#q128-checkpoint-restore-observer}

  Проверка восстановления могла остановиться до вывода конкретного условия. Проверьте сохранённые идентификаторы, текущие нагрузки и доступность архива восстановления.

  ```bash
  test -s /run/dq/facts/0/checkpoint-identities.json; kubectl get deployments,replicasets,pods; tar -tf checkpoint.tar
  ```

  ### Чтение удаляемой конфигурации через API {#q129-retired-config-query}

  Запрос к API о ConfigMap station мог завершиться ошибкой. Повторите чтение в пространстве имён упражнения и проверьте ошибку kubectl.

  ```bash
  kubectl get configmap station --ignore-not-found -o name
  ```

  ### Отсутствие удалённой конфигурации {#q129-retired-config-absence}

  ConfigMap station может всё ещё существовать, в том числе пока удаление не завершено. Проверьте его состояние в пространстве имён упражнения.

  ```bash
  kubectl get configmap station --ignore-not-found -o name
  ```

  ### Чтение удаляемого Secret через API {#q129-retired-record-query}

  Запрос к API о Secret station-record мог завершиться ошибкой. Повторите чтение только имени и проверьте ошибку kubectl.

  ```bash
  kubectl get secret station-record --ignore-not-found -o name
  ```

  ### Отсутствие удалённого Secret {#q129-retired-record-absence}

  Secret station-record может всё ещё существовать. После перехода потребителей на новый Secret проверьте, завершилось ли удаление старого.

  ```bash
  kubectl get secret station-record --ignore-not-found -o name
  ```

  ### Сохранённые нагрузки потребителей {#q129-retirement-retained-workloads}

  Deployment потребителя мог быть пересоздан, иметь число реплик, отличное от одной, или использовать другой образ worker. Сравните dispatch и reporter с исходной записью.

  ```bash
  jq '.consumers' /run/dq/facts/0/retirement-identities.json; kubectl get deployments dispatch reporter -o custom-columns=NAME:.metadata.name,UID:.metadata.uid,REPLICAS:.spec.replicas,IMAGE:.spec.template.spec.containers[0].image
  ```

  ### Текущий Pod потребителя {#q129-retirement-current-consumer-pod}

  У каждого потребителя проверка ищет ровно один текущий готовый Pod с ожидаемым образом. Проверьте Deployment, активный ReplicaSet и принадлежащий ему Pod.

  ```bash
  jq '.consumers' /run/dq/facts/0/retirement-identities.json; kubectl get deployment dispatch reporter -o custom-columns=NAME:.metadata.name,UID:.metadata.uid; kubectl get replicaset,pod -o json | jq '.items[] | {kind, name: .metadata.name, uid: .metadata.uid, owners: .metadata.ownerReferences, deleting: .metadata.deletionTimestamp, ready: [.status.conditions[]? | select(.type=="Ready")], images: [.spec.containers[]? | {name,image}]}'
  ```

  ### Новый Secret без связи со старым родителем {#q129-retirement-independent-successor}

  Монтирование нового Secret только для чтения может различаться между шаблоном и текущим Pod. Данные, UID или связь Secret со старым родителем тоже могут быть неверными. Сверьте источник /config/value, метаданные нового Secret и сохранённый хеш.

  ```bash
  jq '{retiredRecordUID,retiredParentUID,dataHash,fingerprint}' /run/dq/facts/0/retirement-identities.json; kubectl get deployments dispatch reporter -o json | jq '.items[] | {name: .metadata.name, spec: .spec.template.spec | {volumes,mounts: [.containers[].volumeMounts]}}'; kubectl get pods -o json | jq '.items[] | {name: .metadata.name, owner: .metadata.ownerReferences, volumes: .spec.volumes, mounts: [.spec.containers[].volumeMounts]}' ; printf 'Successor Secret from the active mount: '; IFS= read -r successor; kubectl get "secret/$successor" -o json | python3 -I -c 'import hashlib,json,sys; value=json.load(sys.stdin); meta=value["metadata"]; print(json.dumps({"uid":meta["uid"],"labels":meta.get("labels",{}),"owners":meta.get("ownerReferences",[]),"dataHash":hashlib.sha256(json.dumps(value["data"],sort_keys=True).encode()).hexdigest()}))'
  ```

  ### Байты из нового Secret {#q129-retirement-mounted-record-bytes}

  Байты, смонтированные по пути /config/value, могут отличаться от исходной записи. Сравните хеш внутри каждого текущего worker с исходным отпечатком.

  ```bash
  jq -er .fingerprint /run/dq/facts/0/retirement-identities.json; for name in dispatch reporter; do kubectl exec "deployment/$name" -c worker -- sha256sum /config/value; done
  ```

  ### Отпечаток из ответа потребителя {#q129-retirement-served-record-fingerprint}

  Приложение может отдавать старый или неверный отпечаток. Запросите локальный ответ каждого текущего worker и сравните с сохранённым отпечатком.

  ```bash
  jq -er .fingerprint /run/dq/facts/0/retirement-identities.json; for name in dispatch reporter; do kubectl exec "deployment/$name" -c worker -- wget -qO- -T 2 http://127.0.0.1:8080; done
  ```

  ### Данные проверки перехода потребителей {#q129-retirement-consumer-observer}

  Проверка вывода из эксплуатации могла остановиться до вывода конкретного условия. Убедитесь, что исходные данные и текущие ресурсы потребителей доступны для чтения.

  ```bash
  test -s /run/dq/facts/0/retirement-identities.json; kubectl get deployments,replicasets,pods
  ```

  ### UID сохранённого Secret control {#q129-retirement-control-secret-identity}

  Secret control может отсутствовать или иметь другой UID. Сравните текущий UID с control_uid из контракта очистки.

  ```bash
  kubectl get secret control -o jsonpath='{.metadata.uid}'; jq -er .control_uid /run/dq/facts/0/cleanup-contract.json
  ```

  ### Хеш данных сохранённого Secret control {#q129-retirement-control-secret-data-hash}

  Данные Secret control могли измениться. Сравните хеш карты data из JSON с отсортированными ключами с control_hash, сохраняя значения в тайне.

  ```bash
  kubectl get secret control -o json | python3 -c 'import hashlib,json,sys; print(hashlib.sha256(json.dumps(json.load(sys.stdin)["data"],sort_keys=True).encode()).hexdigest())'; jq -er .control_hash /run/dq/facts/0/cleanup-contract.json
  ```

  ### Данные проверки Secret control {#q129-retirement-control-secret-observer}

  Проверка контрольного Secret могла остановиться до вывода конкретного условия. Проверьте выданный контракт очистки и доступ к Secret control.

  ```bash
  kubectl get secret control -o name; test -s /run/dq/facts/0/cleanup-contract.json
  ```
