heading: Dane, tożsamość i bezpieczne sprzątanie
text: '# Dane, tożsamość i bezpieczne sprzątanie


  Używaj tylko jednorazowej zatoki zadania. StatefulSet nadaje Podowi stabilną nazwę porządkową, a jego claim może przetrwać wymianę Poda. Headless Service udostępnia DNS porządkowy. Porównaj dostarczone pliki UID i manifesty z działającymi obiektami; poczekaj na nowy Pod przed sprawdzeniem nazwy i odpowiedzi HTTP. Stabilna tożsamość sama nie dowodzi zawartości wolumenu.


  PersistentVolume (PV) i PersistentVolumeClaim (PVC) są różnymi obiektami. Polityka odzyskiwania PV `Retain` zachowuje wolumen do ręcznego odzyskania po usunięciu claimu; domyślna polityka StorageClass nie zmienia wstecz istniejącego PV. W zadaniu odzyskiwania przeczytaj `volume-contract.json` i `original-claim-uid`, sprawdź usunięcie starego claimu i użyj warunków UID z dostarczonymi wartościami przed usunięciem starego odwołania do claimu. Poczekaj na związanie nowego claimu. Ten lokalny wolumen ćwiczeniowy nie jest kopią poza hostem.


  Dla syntetycznego, nieruchomego ledgera `ledger.tar` musi zawierać tylko `ledger.txt` i odpowiadać `original-ledger.sha256`; po odzyskaniu porównaj również działający plik i bajty HTTP. Działająca baza danych wymaga metody kopii zgodnej z aplikacją, a nie założenia, że dowolna kopia plików jest spójna.


  Finalizer wstrzymuje usunięcie obiektu do zakończenia sprzątania. Przeczytaj `cleanup-contract.json`, sprawdź oczekiwane UID obiektów i ich powiązanie, usuń wskazany rekord, a następnie tylko znany finalizer z warunkami wstępnymi. Nigdy nie usuwaj nieznanego finalizera tylko po to, by obiekt zniknął. Kontrole bieżących obiektów nie dowodzą całej kolejności wcześniejszych poleceń.


  Źródła: [StatefulSet](https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/), [polityka odzyskiwania PV](https://kubernetes.io/docs/tasks/administer-cluster/change-pv-reclaim-policy/), [finalizery](https://kubernetes.io/docs/concepts/overview/working-with-objects/finalizers/).


  Zacznij w `~/quest`. W zadaniu 111 sprawdź ordinal i porównaj pliki przed zmianą nasłuchu:


  ```sh

  cd ~/quest

  kubectl get statefulset shelf -o yaml

  kubectl get pod shelf-0 -o jsonpath=''{.metadata.uid}''

  cat original-pod-uid

  ```


  W zadaniu 124 sprawdź PV:


  ```sh

  volume=$(jq -r .volume volume-contract.json)

  kubectl get pv "$volume" -o yaml

  ```


  W zadaniu 128 dla pojedynczego pliku syntetycznego pobierz archiwum z Poda, obejrzyj je i porównaj sumę. Na etapie odtwarzania wyślij je z powrotem dopiero po sprawdzeniu:


  ```sh

  kubectl exec deployment/ledger -- tar cf - -C /data ledger.txt > ledger.tar

  tar tf ledger.tar

  tar xOf ledger.tar ledger.txt | sha256sum

  cat original-ledger.sha256

  kubectl exec -i deployment/ledger -- tar xf - -C /data < ledger.tar

  ```


  W zadaniu 129 przed sprzątaniem sprawdź kontrakt i bieżące obiekty. Utwórz DeleteOptions z zapisanym UID dziecka oraz JSON Patch testujący UID rodzica i całą oczekiwaną tablicę finalizerów przed usunięciem. Wyślij DeleteOptions do endpointu Secretu w namespace, a potem zastosuj patch do ConfigMap; nieudany test oznacza zatrzymanie i analizę. Znany finalizer i etykieta rodzica są w opisie zadania.

  '
