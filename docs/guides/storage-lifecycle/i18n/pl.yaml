heading: Dane, tożsamość i bezpieczne sprzątanie
text: |
  # Dane, tożsamość i bezpieczne sprzątanie

  Tożsamość claim, działający proces i bajty wolumenu to różne dowody. Zachowaj znany zestaw źródłowy podczas ustalania użytecznej pojemności celu. Zastąpienie procesu samo nie przywraca brakujących plików, a związanie claim nie potwierdza ich zawartości. Definicje claim w namespace, montowania Poda i rzeczywiste pliki łączą tożsamość pamięci z wynikiem aplikacji bez zakładania dostępu do katalogu całego klastra.

  Stateful discovery łączy governing headless Service, ordinal Pod i zachowany claim. Gotowość nie dowodzi właściwego listenera. Niezależny odbiorca sieciowy musi rozwiązać ordinal we właściwym namespace i publikować bieżącą odpowiedź bez montowania claim źródła. Porównuj tożsamość, właściciela, sufiks resolvera i oba interfejsy; to bieżące obserwacje, nie historia żądań.

  PersistentVolume (PV) i PersistentVolumeClaim (PVC) są różnymi obiektami. Polityka odzyskiwania PV `Retain` zachowuje wolumen do ręcznego odzyskania po usunięciu claimu; domyślna polityka StorageClass nie zmienia wstecz istniejącego PV. W zadaniu odzyskiwania przeczytaj `volume-contract.json` i `original-claim-uid`, sprawdź usunięcie starego claimu i użyj warunków UID z dostarczonymi wartościami przed usunięciem starego odwołania do claimu. Poczekaj na związanie nowego claimu. Ten lokalny wolumen ćwiczeniowy nie jest kopią poza hostem.

  Punkt odtwarzania obejmuje wszystkie magazyny uczestniczące w transakcji aplikacji. Dwie osobno poprawne kopie mogą łączyć różne generacje, gdy zapisujący proces publikuje pliki kolejno. Poznaj protokół checkpointu i porównuj znaczniki, generacje i sumy zamiast ufać samemu powodzeniu kopiowania. Pierwotne archiwum statycznego rejestru pozostaje oddzielną kontrolą integralności. Podczas odtwarzania porównaj wybrany checkpoint z zamontowanymi plikami i odpowiedziami bieżących odbiorców, zachowując tożsamość PVC i obciążeń. Ten ograniczony protokół syntetyczny nie zastępuje kopii działającej bazy danych.

  Finalizer oznacza obowiązek sprzątania, a nie tylko flagę blokującą usunięcie. Wycofanie może obejmować odbiorców, których szablony nadal wskazują starą konfigurację. Istniejące Pody mogą zachować projektowane bajty po usunięciu źródła; nie zapewnia to uruchomienia nowego Poda. Śledź powiązania po UID, czas życia następcy i źródła w szablonach oraz bieżących Podach. Niezależne dane kontrolne muszą przetrwać. Bieżące kontrole potwierdzają tożsamość, dostarczanie i brak obiektów, nie pełną kolejność poprzednich poleceń.

  Źródła: [StatefulSet](https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/), [polityka odzyskiwania PV](https://kubernetes.io/docs/tasks/administer-cluster/change-pv-reclaim-policy/), [finalizery](https://kubernetes.io/docs/concepts/overview/working-with-objects/finalizers/).

  Dla zadania 111 sprawdź zachowane źródło i kontrakt odbiorcy:

  ```sh
  cd ~/quest
  cat discovery-contract.json
  kubectl get statefulset,pvc,service,pods -o yaml
  kubectl exec shelf-0 -c worker -- cat /etc/resolv.conf
  ```

  W zadaniu 124 sprawdź PV:

  ```sh
  volume=$(jq -r .volume volume-contract.json)
  kubectl get pv "$volume" -o yaml
  ```

  Dla zadania 128 sprawdź format checkpointu i porównaj oba magazyny z zapisanymi wpisami. Archiwum może przejść kontrolę integralności, a nadal łączyć niezgodne generacje aplikacji:

  ```sh
  cd ~/quest
  cat checkpoint-contract.json
  tar tf ledger.tar
  tar xOf ledger.tar ledger.txt | sha256sum
  tar tf checkpoint.tar
  tar xOf checkpoint.tar orders.tsv
  tar xOf checkpoint.tar summary.json
  kubectl get deployment,pvc,pods -o yaml
  kubectl exec deployment/client -- wget -qO- -T 3 http://ledger:8080/orders.tsv
  kubectl exec deployment/client -- wget -qO- -T 3 http://summary:8080/summary.json
  ```

  Dla zadania 129 sprawdź kontrakty wycofania i metadane bez wyświetlania danych Secret. Śledź odwołania odbiorców i odciski bieżących montowań oddzielnie od finalizera; sprawne stare Pody nie wystarczają do potwierdzenia bezpiecznego wycofania.

  ```sh
  cat cleanup-contract.json retirement-contract.json
  kubectl get configmap,secret -o json | jq '.items[] | {kind,name:.metadata.name,uid:.metadata.uid,parentUID:.metadata.labels["training.devops-quests.local/parent-uid"],owners:.metadata.ownerReferences,deleting:.metadata.deletionTimestamp}'
  kubectl get deployments -o json | jq '.items[] | {name:.metadata.name,uid:.metadata.uid,volumes:.spec.template.spec.volumes,mounts:[.spec.template.spec.containers[] | {name,volumeMounts}]}'
  kubectl get pods -o wide
  ```
