heading: Almacenamiento, identidad y limpieza segura
text: |
  # Almacenamiento, identidad y limpieza segura

  La identidad del claim, un proceso activo y los bytes del volumen son evidencias distintas. Conserva un conjunto fuente conocido mientras estableces qué capacidad destino es utilizable. Reemplazar un proceso no restaura archivos ausentes y un claim enlazado no demuestra su contenido. Las definiciones del namespace, montajes del Pod y archivos reales conectan identidad y resultado sin suponer acceso al catálogo de todo el clúster.

  El descubrimiento stateful une governing Service headless, Pod ordinal y claim conservado. Estar listo no demuestra el listener esperado. Un consumidor independiente debe resolver el ordinal en el namespace correcto y publicar la respuesta actual sin montar el claim fuente. Compara identidad, propiedad, sufijo resolver e interfaces; son observaciones actuales, no historial de peticiones.

  PersistentVolume (PV) y PersistentVolumeClaim (PVC) son objetos diferentes. La política de recuperación `Retain` del PV conserva el volumen para recuperación manual cuando se elimina un claim; el valor predeterminado de StorageClass no cambia retroactivamente un PV existente. En la misión de recuperación, lee `volume-contract.json` y `original-claim-uid`, verifica que el claim antiguo desapareció y usa precondiciones UID con los valores suministrados antes de eliminar su referencia antigua. Espera que se vincule el claim de reemplazo. Este volumen local de práctica no es una copia fuera del host.

  Un punto de recuperación abarca todos los almacenes que participan en la transacción. Dos copias válidas por separado pueden combinar generaciones distintas si el escritor publica archivos sucesivamente. Lee el protocolo de checkpoint y compara marcadores, generaciones y agregados, sin confiar solo en comandos de copia correctos. El archivo estático original sigue siendo una comprobación de integridad independiente. Durante la recuperación compara el checkpoint elegido con archivos montados y respuestas a consumidores actuales, conservando identidades de PVC y cargas. Este protocolo sintético acotado no sustituye una copia de una base de datos activa.

  Un finalizer representa una obligación de limpieza, no simplemente un indicador que bloquea la eliminación. La retirada puede afectar a consumidores cuyas plantillas aún nombran la configuración antigua. Los Pods existentes pueden conservar bytes proyectados tras eliminar el origen; eso no permite inicializar uno nuevo. Sigue asociaciones por UID, vida del sucesor y fuentes de plantillas y Pods actuales. Los datos de control independientes deben sobrevivir. El estado actual permite comprobar identidades, entrega y ausencia, no el orden completo de comandos anteriores.

  Referencias: [StatefulSets](https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/), [política de recuperación PV](https://kubernetes.io/docs/tasks/administer-cluster/change-pv-reclaim-policy/), [finalizers](https://kubernetes.io/docs/concepts/overview/working-with-objects/finalizers/).

  Para el quest 111, inspecciona fuente conservada y contrato del consumidor:

  ```sh
  cd ~/quest
  cat discovery-contract.json
  kubectl get statefulset,pvc,service,pods -o yaml
  kubectl exec shelf-0 -c worker -- cat /etc/resolv.conf
  ```

  En la misión 124 inspecciona el PV:

  ```sh
  volume=$(jq -r .volume volume-contract.json)
  kubectl get pv "$volume" -o yaml
  ```

  Para el quest 128, inspecciona el formato de checkpoint y compara ambos almacenes con las entradas capturadas. Un archivo puede superar integridad y aun así combinar generaciones incompatibles de la aplicación:

  ```sh
  cd ~/quest
  cat checkpoint-contract.json
  tar tf ledger.tar
  tar xOf ledger.tar ledger.txt | sha256sum
  tar tf checkpoint.tar
  tar xOf checkpoint.tar orders.tsv
  tar xOf checkpoint.tar summary.json
  kubectl get deployment,pvc,pods -o yaml
  kubectl exec deployment/client -- wget -qO- -T 3 http://ledger:8080/orders.tsv
  kubectl exec deployment/client -- wget -qO- -T 3 http://summary:8080/summary.json
  ```

  Para el quest 129, inspecciona contratos y metadatos sin mostrar datos de Secret. Sigue referencias de consumidores y huellas montadas actuales por separado del finalizer; los Pods antiguos sanos no bastan para demostrar una retirada segura.

  ```sh
  cat cleanup-contract.json retirement-contract.json
  kubectl get configmap,secret -o json | jq '.items[] | {kind,name:.metadata.name,uid:.metadata.uid,parentUID:.metadata.labels["training.devops-quests.local/parent-uid"],owners:.metadata.ownerReferences,deleting:.metadata.deletionTimestamp}'
  kubectl get deployments -o json | jq '.items[] | {name:.metadata.name,uid:.metadata.uid,volumes:.spec.template.spec.volumes,mounts:[.spec.template.spec.containers[] | {name,volumeMounts}]}'
  kubectl get pods -o wide
  ```


  ### Identidad original del StatefulSet {#q111-shelf-retained-controller}

  El StatefulSet puede haberse recreado con el mismo nombre, lo que cambia su UID de forma irreversible. Compárelo con el original fijado antes de editar la plantilla.

  ```bash
  kubectl get statefulset shelf -o jsonpath='{.metadata.uid}'
  ```

  ### PVC original del registro {#q111-shelf-retained-ledger-claim}

  El PVC del registro puede haberse recreado o no ser legible. Compare el UID de ledger-shelf-0 con el registro original y conserve el PVC existente.

  ```bash
  kubectl get pvc ledger-shelf-0 -o jsonpath='{.metadata.uid}'
  ```

  ### Reemplazo del Pod ordinal {#q111-shelf-ordinal-replacement}

  El Pod ordinal puede conservar su UID original pese al cambio de plantilla. Espere el reemplazo de shelf-0 con el mismo nombre ordinal y PVC persistente.

  ```bash
  kubectl get pod shelf-0 -o jsonpath='{.metadata.uid}'
  ```

  ### Montaje del registro {#q111-shelf-ledger-mount}

  El worker puede usar otro montaje, una subruta o solo lectura. Revise el único montaje completo escribible de ledger en /data del contenedor worker.

  ```bash
  kubectl get statefulset shelf -o json | jq '.spec.template.spec.containers[] | select(.name == "worker") | .volumeMounts'
  ```


  ### Nombre del volumen en el contrato {#q124-pv-contract-volume}

  Comprueba si el contrato proporcionado contiene el nombre del volumen.

  ```bash
  jq -er .volume /run/dq/facts/0/volume-contract.json
  ```

  ### UID del PV original en el contrato {#q124-pv-contract-uid}

  Comprueba si el contrato proporcionado contiene el UID del PV original.

  ```bash
  jq -er .pv_uid /run/dq/facts/0/volume-contract.json
  ```

  ### Identidad actual del PV {#q124-pv-live-identity}

  Es posible que falte el PV registrado o que tenga otro UID. Compara el UID actual con pv_uid en volume-contract.json.

  ```bash
  contract=/run/dq/facts/0/volume-contract.json; volume=$(jq -er .volume "$contract"); jq -er .pv_uid "$contract"; kubectl get pv "$volume" -o jsonpath='{.metadata.uid}'
  ```

  ### Clase de almacenamiento del PV {#q124-pv-storage-class}

  Es posible que el PV tenga otro valor en storageClassName. Compáralo con volume en volume-contract.json.

  ```bash
  volume=$(jq -er .volume /run/dq/facts/0/volume-contract.json); printf '%s\n' "$volume"; kubectl get pv "$volume" -o jsonpath='{.spec.storageClassName}'
  ```

  ### Política Retain del PV {#q124-pv-retain-policy}

  Es posible que el PV carezca de la política de recuperación Retain. Comprueba la política actual antes de cambiar el PVC.

  ```bash
  volume=$(jq -er .volume /run/dq/facts/0/volume-contract.json); kubectl get pv "$volume" -o jsonpath='{.spec.persistentVolumeReclaimPolicy}'
  ```

  ### Fase actual del PV {#q124-pv-bound-phase}

  Es posible que el PV aún espere un PVC compatible. Comprueba que su fase actual sea Bound.

  ```bash
  volume=$(jq -er .volume /run/dq/facts/0/volume-contract.json); kubectl get pv "$volume" -o jsonpath='{.status.phase}'
  ```

  ### Referencia al PVC actual {#q124-pv-current-claimref}

  Es posible que el PV aún haga referencia a un PVC ledger anterior. Compara claimRef.uid con el UID del PVC ledger actual.

  ```bash
  volume=$(jq -er .volume /run/dq/facts/0/volume-contract.json); kubectl get pv "$volume" -o jsonpath='{.spec.claimRef.uid}'; kubectl get pvc ledger -o jsonpath='{.metadata.uid}'
  ```

  ### PVC ledger original {#q124-pv-original-claim}

  Es posible que falte el PVC ledger o que ya se haya sustituido. En esta fase, su UID debe coincidir con original-claim-uid.

  ```bash
  cat /run/dq/facts/0/original-claim-uid; kubectl get pvc ledger -o jsonpath='{.metadata.uid}'
  ```

  ### Nuevo PVC ledger {#q124-pv-replacement-claim}

  Es posible que falte el nuevo PVC ledger o que aún permanezca el original. En esta fase, compara su UID con original-claim-uid y comprueba que sean distintos.

  ```bash
  cat /run/dq/facts/0/original-claim-uid; kubectl get pvc ledger -o jsonpath='{.metadata.uid}'
  ```

  ### Datos servidos por board {#q124-pv-board-content}

  Es posible que client no llegue a board:8080 o reciba datos distintos. Comprueba si la respuesta real es north-124.

  ```bash
  kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080
  ```


  ### Entradas del archivo ledger {#q128-ledger-single-archive-entry}

  El archivo puede ser ilegible o contener entradas incorrectas. Comprueba que ledger.tar contenga una única entrada regular y no dispersa, ledger.txt.

  ```bash
  tar -tvf ledger.tar
  ```

  ### Hash del archivo ledger archivado {#q128-ledger-captured-file-hash}

  Los bytes archivados de ledger.txt pueden diferir de los originales. Calcula el hash del flujo extraído y compáralo con original-ledger.sha256.

  ```bash
  set -o pipefail; entry=$(tar -tf ledger.tar); tar -xOf ledger.tar "$entry" | sha256sum; cat /run/dq/facts/0/original-ledger.sha256
  ```

  ### Entradas de la comprobación de captura {#q128-ledger-capture-observer}

  La comprobación de la captura puede haberse detenido antes de indicar una condición. Comprueba los datos guardados y la lectura del archivo.

  ```bash
  test -s /run/dq/facts/0/original-ledger.sha256; test -s /run/dq/facts/0/checkpoint-identities.json; tar -tf ledger.tar
  ```

  ### Archivo coherente del punto de control {#q128-checkpoint-coherent-recovery-point}

  checkpoint.tar puede contener entradas inesperadas u orders.tsv y summary.json de generaciones distintas. Comprueba las entradas regulares, el marcador registrado, la generación, las rutas y la suma de unidades de los pedidos.

  ```bash
  tar -tvf checkpoint.tar; tar -tf checkpoint.tar | while IFS= read -r entry; do printf "%s\n" "$entry"; tar -xOf checkpoint.tar "$entry"; done
  ```

  ### Objetos conservados del punto de control {#q128-checkpoint-retained-objects}

  Puede faltar un Deployment o PVC conservado, haberse recreado o haber cambiado una imagen de worker. Compara las identidades y las imágenes actuales con el registro del punto de control.

  ```bash
  jq '{claims,deployments}' /run/dq/facts/0/checkpoint-identities.json; kubectl get deploy,pvc -o custom-columns=KIND:.kind,NAME:.metadata.name,UID:.metadata.uid,IMAGE:.spec.template.spec.containers[*].image
  ```

  ### UID del PVC ledger conservado {#q128-ledger-retained-pvc}

  El PVC ledger puede faltar o haberse recreado. Compara el UID del PVC ledger actual con original-pvc-uid.

  ```bash
  cat /run/dq/facts/0/original-pvc-uid; kubectl get pvc ledger -o jsonpath='{.metadata.uid}'
  ```

  ### Entradas de la comprobación del archivo conservado {#q128-ledger-retained-archive-observer}

  La comprobación del archivo conservado puede haberse detenido antes de indicar una condición. Comprueba que ledger.tar y la suma proporcionada se puedan leer durante la recuperación.

  ```bash
  test -s /run/dq/facts/0/original-ledger.sha256; tar -tvf ledger.tar
  ```

  ### Hash del archivo ledger restaurado {#q128-ledger-current-file-hash}

  El /data/ledger.txt restaurado puede ser ilegible o contener otros bytes. Compara el hash dentro del Pod ledger con original-ledger.sha256.

  ```bash
  kubectl exec deployment/ledger -- sha256sum /data/ledger.txt; cat /run/dq/facts/0/original-ledger.sha256
  ```

  ### Hash del archivo ledger servido por HTTP {#q128-ledger-served-file-hash}

  client puede no leer el archivo por HTTP o recibir otros bytes. Compara el hash de la respuesta de ledger.txt con original-ledger.sha256.

  ```bash
  set -o pipefail; cat /run/dq/facts/0/original-ledger.sha256; kubectl exec deployment/client -- wget -qO- -T 3 http://ledger:8080/ledger.txt | sha256sum
  ```

  ### Lectores actuales del punto de control {#q128-checkpoint-current-readers}

  Un lector del punto de control o client puede carecer de un único Pod actual y listo con la imagen original. Comprueba la propiedad, la disponibilidad y las réplicas deseadas.

  ```bash
  kubectl get deployment ledger summary client; kubectl get replicasets,pods -o wide
  ```

  ### Writer inactivo durante la recuperación {#q128-checkpoint-writer-quiet}

  journal-writer puede conservar una réplica deseada o un Pod actual. Comprueba que se mantenga en cero durante la recuperación para evitar que sobrescriba los archivos.

  ```bash
  kubectl get deployment journal-writer -o jsonpath='{.spec.replicas}'; kubectl get pods -l app=journal-writer -o name
  ```

  ### Montajes de PVC para los archivos restaurados {#q128-checkpoint-restored-claim-mounts}

  Una ruta restaurada puede pertenecer al PVC equivocado o no estar disponible en el Pod actual. Compara el montaje que cubre la ruta en la plantilla y en el Pod con el PVC requerido.

  ```bash
  jq '.contract.stores[] | {deployment,claim,path}' /run/dq/facts/0/checkpoint-identities.json; kubectl get deployment ledger summary -o json | jq '.items[] | {name: .metadata.name, uid: .metadata.uid, spec: .spec.template.spec | {containers,volumes}}'; kubectl get replicaset,pod -o json | jq '.items[] | {kind,name: .metadata.name,uid: .metadata.uid,owners: .metadata.ownerReferences,containers: .spec.containers,volumes: .spec.volumes}'
  ```

  ### Bytes de los archivos restaurados {#q128-checkpoint-restored-file-bytes}

  Un archivo restaurado puede contener bytes de otro punto de recuperación. Compara los hashes actuales de orders.tsv y summary.json con los de las entradas correspondientes en checkpoint.tar.

  ```bash
  set -o pipefail; tar -tf checkpoint.tar | while IFS= read -r entry; do printf '%s\n' "$entry"; tar -xOf checkpoint.tar "$entry" | sha256sum; done; kubectl exec deployment/ledger -c worker -- sha256sum /data/orders.tsv; kubectl exec deployment/summary -c worker -- sha256sum /data/summary.json
  ```

  ### Contenido restaurado servido por HTTP {#q128-checkpoint-served-file-bytes}

  Un lector puede servir bytes distintos de los archivados. Obtén orders.tsv y summary.json desde client y compara el hash de cada respuesta con su entrada en checkpoint.tar.

  ```bash
  set -o pipefail; tar -tf checkpoint.tar | while IFS= read -r entry; do printf '%s\n' "$entry"; tar -xOf checkpoint.tar "$entry" | sha256sum; done; for url in http://ledger:8080/orders.tsv http://summary:8080/summary.json; do kubectl exec deployment/client -c worker -- wget -qO- -T 2 "$url" | sha256sum; done
  ```

  ### Entradas de la comprobación de recuperación {#q128-checkpoint-restore-observer}

  La comprobación de recuperación puede haberse detenido antes de indicar una condición. Comprueba las identidades guardadas, las cargas actuales y la lectura del archivo de recuperación.

  ```bash
  test -s /run/dq/facts/0/checkpoint-identities.json; kubectl get deployments,replicasets,pods; tar -tf checkpoint.tar
  ```

  ### Lectura por API de la configuración retirada {#q129-retired-config-query}

  La consulta a la API sobre ConfigMap station puede haber fallado. Repite la lectura en el espacio de nombres del ejercicio y revisa el error de kubectl.

  ```bash
  kubectl get configmap station --ignore-not-found -o name
  ```

  ### Ausencia de la configuración retirada {#q129-retired-config-absence}

  ConfigMap station puede seguir existiendo mientras se completa la eliminación. Comprueba su estado en el espacio de nombres del ejercicio.

  ```bash
  kubectl get configmap station --ignore-not-found -o name
  ```

  ### Lectura por API del Secret en retirada {#q129-retired-record-query}

  La consulta a la API sobre Secret station-record puede haber fallado. Repite la lectura solo del nombre y revisa el error de kubectl.

  ```bash
  kubectl get secret station-record --ignore-not-found -o name
  ```

  ### Ausencia del Secret retirado {#q129-retired-record-absence}

  Secret station-record puede seguir existiendo. Después de que los consumidores cambien al sucesor, comprueba si la retirada se completó.

  ```bash
  kubectl get secret station-record --ignore-not-found -o name
  ```

  ### Cargas consumidoras conservadas {#q129-retirement-retained-workloads}

  Un Deployment consumidor puede haberse sustituido, tener una cantidad distinta de una réplica o usar otra imagen de worker. Compara dispatch y reporter con las identidades guardadas.

  ```bash
  jq '.consumers' /run/dq/facts/0/retirement-identities.json; kubectl get deployments dispatch reporter -o custom-columns=NAME:.metadata.name,UID:.metadata.uid,REPLICAS:.spec.replicas,IMAGE:.spec.template.spec.containers[0].image
  ```

  ### Pod actual del consumidor {#q129-retirement-current-consumer-pod}

  La observación puede no encontrar un único Pod actual y listo con la imagen esperada para cada consumidor. Revisa el Deployment, el ReplicaSet activo y su Pod.

  ```bash
  jq '.consumers' /run/dq/facts/0/retirement-identities.json; kubectl get deployment dispatch reporter -o custom-columns=NAME:.metadata.name,UID:.metadata.uid; kubectl get replicaset,pod -o json | jq '.items[] | {kind, name: .metadata.name, uid: .metadata.uid, owners: .metadata.ownerReferences, deleting: .metadata.deletionTimestamp, ready: [.status.conditions[]? | select(.type=="Ready")], images: [.spec.containers[]? | {name,image}]}'
  ```

  ### Secret sucesor independiente {#q129-retirement-independent-successor}

  El montaje del sucesor en solo lectura puede diferir entre la plantilla y el Pod actual, o el Secret puede tener otros datos, UID o vínculo con el padre retirado. Compara /config/value, los metadatos del sucesor y el hash guardado.

  ```bash
  jq '{retiredRecordUID,retiredParentUID,dataHash,fingerprint}' /run/dq/facts/0/retirement-identities.json; kubectl get deployments dispatch reporter -o json | jq '.items[] | {name: .metadata.name, spec: .spec.template.spec | {volumes,mounts: [.containers[].volumeMounts]}}'; kubectl get pods -o json | jq '.items[] | {name: .metadata.name, owner: .metadata.ownerReferences, volumes: .spec.volumes, mounts: [.spec.containers[].volumeMounts]}' ; printf 'Successor Secret from the active mount: '; IFS= read -r successor; kubectl get "secret/$successor" -o json | python3 -I -c 'import hashlib,json,sys; value=json.load(sys.stdin); meta=value["metadata"]; print(json.dumps({"uid":meta["uid"],"labels":meta.get("labels",{}),"owners":meta.get("ownerReferences",[]),"dataHash":hashlib.sha256(json.dumps(value["data"],sort_keys=True).encode()).hexdigest()}))'
  ```

  ### Bytes montados desde el sucesor {#q129-retirement-mounted-record-bytes}

  Los bytes montados en /config/value pueden diferir del registro retirado. Compara el hash dentro de cada worker actual con la huella original.

  ```bash
  jq -er .fingerprint /run/dq/facts/0/retirement-identities.json; for name in dispatch reporter; do kubectl exec "deployment/$name" -c worker -- sha256sum /config/value; done
  ```

  ### Huella servida por el consumidor {#q129-retirement-served-record-fingerprint}

  La aplicación puede seguir sirviendo una huella antigua o incorrecta. Consulta cada worker actual por loopback y compara el cuerpo con la huella guardada.

  ```bash
  jq -er .fingerprint /run/dq/facts/0/retirement-identities.json; for name in dispatch reporter; do kubectl exec "deployment/$name" -c worker -- wget -qO- -T 2 http://127.0.0.1:8080; done
  ```

  ### Entradas de la comprobación de retirada {#q129-retirement-consumer-observer}

  La observación de retirada puede haberse detenido antes de indicar una condición. Verifica los datos proporcionados y que los recursos actuales de los consumidores se puedan leer.

  ```bash
  test -s /run/dq/facts/0/retirement-identities.json; kubectl get deployments,replicasets,pods
  ```

  ### Identidad del Secret control conservado {#q129-retirement-control-secret-identity}

  Secret control puede faltar o tener otro UID. Compara el UID actual con control_uid del contrato de limpieza.

  ```bash
  kubectl get secret control -o jsonpath='{.metadata.uid}'; jq -er .control_uid /run/dq/facts/0/cleanup-contract.json
  ```

  ### Hash de los datos conservados de control {#q129-retirement-control-secret-data-hash}

  Los datos de Secret control pueden haber cambiado. Compara el hash del mapa data de JSON con claves ordenadas con control_hash y mantén los valores privados.

  ```bash
  kubectl get secret control -o json | python3 -c 'import hashlib,json,sys; print(hashlib.sha256(json.dumps(json.load(sys.stdin)["data"],sort_keys=True).encode()).hexdigest())'; jq -er .control_hash /run/dq/facts/0/cleanup-contract.json
  ```

  ### Entradas de la comprobación del Secret control {#q129-retirement-control-secret-observer}

  La comprobación del Secret de control puede haberse detenido antes de indicar una condición. Comprueba el contrato de limpieza proporcionado y el acceso a Secret control.

  ```bash
  kubectl get secret control -o name; test -s /run/dq/facts/0/cleanup-contract.json
  ```
