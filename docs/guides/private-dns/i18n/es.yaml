heading: Recuperación de DNS privado
text: '# Recuperación de DNS privado


  Un nombre DNS se traduce a una dirección antes de que se conecte el cliente. Estas misiones usan una copia privada de CoreDNS, no el DNS de todo el clúster. `Corefile` configura el listener y los plugins: `hosts` asigna un nombre a una dirección y `ttl` controla cuánto puede almacenarse una respuesta. El `expected-dns-address` suministrado contiene la dirección prevista; `dns-config.yaml`, `dns.yaml`, `dns-service.yaml` y `client.yaml` muestran ConfigMap, workload DNS, puertos del Service y ajustes del cliente.


  Un Pod con `dnsPolicy: None` usa los servidores de nombres indicados explícitamente. El Service DNS recibe consultas TCP y UDP en el puerto 53 y las envía al puerto 1053 de la copia. Inspecciona la configuración privada con `kubectl get configmap station-dns -o yaml` y el Service con `kubectl get service station-dns -o yaml`. Tras cambiar el ConfigMap, reinicia solo el Deployment de esta bahía con `kubectl rollout restart deployment/station-dns` y espera con `kubectl rollout status deployment/station-dns --timeout=90s`.


  Comprueba la resolución desde el cliente y después el endpoint HTTP: una respuesta DNS por sí sola no demuestra que funcionen el enrutamiento o la aplicación. La propagación o la caducidad de la caché pueden tardar. No modifiques el DNS de `kube-system` ni resolvers externos.


  Referencias: [configuración DNS de Kubernetes](https://kubernetes.io/docs/tasks/administer-cluster/dns-custom-nameservers/), [plugin hosts de CoreDNS](https://coredns.io/plugins/hosts/).


  En el ejercicio 110, el cliente debe usar el DNS Service privado y resolver `station.internal` a la dirección del Service del controlador en `expected-dns-address`. Repara el Corefile privado, reinicia el DNS Deployment suministrado y espera la propagación; después prueba por separado el enrutamiento ingress.



  ### Corefile que usa el resolutor {#q105-resolver-corefile-command}


  CoreDNS puede iniciar con su configuración predeterminada o con otro archivo. Revise el programa y los argumentos del contenedor worker para /etc/station/Corefile.


  ```bash

  kubectl get deployment station-dns -o json | jq ''.spec.template.spec.containers[] | select(.name == "worker") | {command, args}''

  ```


  ### Puertos del Service del resolutor {#q105-resolver-service-ports}


  Un puerto del Service puede omitir un protocolo DNS o apuntar al destino incorrecto. Revise TCP y UDP en el puerto 53, ambos con destino numérico o nombrado 1053.


  ```bash

  kubectl get service station-dns -o json | jq ''.spec.ports''

  ```


  ### Respuesta directa del resolutor configurado {#q105-configured-resolver-answer}


  El Corefile suministrado puede seguir apuntando north.station.internal a loopback, o puede que el resolutor activo no haya cargado el cambio. Consulte station-dns directamente y compare con la dirección de board.


  ```bash

  server=$(kubectl get service station-dns -o jsonpath=''{.spec.clusterIP}''); kubectl exec deployment/client -c worker -- nslookup north.station.internal "$server"

  ```


  ### Política DNS de client {#q105-client-dns-policy}


  La plantilla del Deployment client puede volver a la política DNS del clúster. Revise dnsPolicy y mantenga None para aplicar el servidor suministrado.


  ```bash

  kubectl get deployment client -o jsonpath=''{.spec.template.spec.dnsPolicy}''

  ```


  ### Dirección del servidor de nombres de client {#q105-client-nameserver-address}


  El Deployment client puede conservar una dirección antigua o resolutores adicionales. Compare nameservers con el ClusterIP actual de station-dns y deje solo esa dirección.


  ```bash

  kubectl get deployment client -o jsonpath=''{.spec.template.spec.dnsConfig.nameservers}''; kubectl get service station-dns -o jsonpath=''{.spec.clusterIP}''

  ```


  ### Respuesta a la consulta DNS explícita desde client {#q105-client-explicit-dns-answer}


  Aunque la configuración de client parezca correcta, el resolutor explícito puede dar una respuesta incorrecta o ninguna. Revise la dirección de north.station.internal desde el Pod client.


  ```bash

  server=$(kubectl get service station-dns -o jsonpath=''{.spec.clusterIP}''); kubectl exec deployment/client -- nslookup north.station.internal "$server"

  ```


  ### Petición HTTP por nombre {#q105-client-hostname-http}


  La respuesta DNS puede ser correcta mientras el Service o endpoint no está listo o sirve otra cosa. Solicite el nombre desde client y compare con north-105.


  ```bash

  kubectl exec deployment/client -- wget -qO- -T 3 http://north.station.internal:8080

  ```


  ### Entradas de la comprobación del resolutor {#q105-resolver-observer-input}


  El observador puede detenerse antes de señalar una condición si fallan las herramientas o sus entradas. Revise primero las herramientas y el acceso a los recursos del resolutor.


  ```bash

  command -v python3; kubectl get deployment station-dns -o name; kubectl get service station-dns -o name

  ```



  ### Política DNS de client {#q110-client-dns-policy}


  La plantilla del Deployment client puede volver a la política DNS del clúster. Revise dnsPolicy y mantenga None para aplicar el servidor suministrado.


  ```bash

  kubectl get deployment client -o jsonpath=''{.spec.template.spec.dnsPolicy}''

  ```


  ### Dirección actual del servidor de nombres {#q110-incident-current-dns-server}


  Client puede carecer de servidor, apuntar a una dirección antigua o incluir otro resolutor. Compare las direcciones con el único ClusterIP actual de station-dns. Un fallo de lectura del Service o Deployment puede activar la misma condición.


  ```bash

  kubectl get deployment client -o jsonpath=''{.spec.template.spec.dnsConfig.nameservers}''; kubectl get service station-dns -o jsonpath=''{.spec.clusterIP}''

  ```


  ### Respuesta DNS de la estación {#q110-incident-resolver-answer}


  El resolutor puede seguir devolviendo loopback para station.internal o no haber leído el Corefile revisado. Consulte station-dns explícitamente desde client y compare con la dirección fijada del proxy.


  ```bash

  server=$(kubectl get service station-dns -o jsonpath=''{.spec.clusterIP}''); kubectl exec deployment/client -- nslookup station.internal "$server"

  ```


  ### Entradas del observador DNS {#q110-incident-dns-observer-input}


  El observador DNS puede detenerse antes de señalar un campo si falla el proceso o la entrada. Revise Python y el acceso de lectura a client y station-dns.


  ```bash

  command -v python3; kubectl get deployment client -o name; kubectl get service station-dns -o name

  ```

  '
