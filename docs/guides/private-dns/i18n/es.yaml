heading: Recuperación de DNS privado
text: '# Recuperación de DNS privado


  Un nombre DNS se traduce a una dirección antes de que se conecte el cliente. Estas misiones usan una copia privada de CoreDNS, no el DNS de todo el clúster. `Corefile` configura el listener y los plugins: `hosts` asigna un nombre a una dirección y `ttl` controla cuánto puede almacenarse una respuesta. El `expected-dns-address` suministrado contiene la dirección prevista; `dns-config.json`, `dns.json`, `dns-service.json` y `client.json` muestran ConfigMap, workload DNS, puertos del Service y ajustes del cliente.


  Un Pod con `dnsPolicy: None` usa los servidores de nombres indicados explícitamente. El Service DNS recibe consultas TCP y UDP en el puerto 53 y las envía al puerto 1053 de la copia. Inspecciona la configuración privada con `kubectl get configmap station-dns -o yaml` y el Service con `kubectl get service station-dns -o yaml`. Tras cambiar el ConfigMap, reinicia solo el Deployment de esta bahía con `kubectl rollout restart deployment/station-dns` y espera con `kubectl rollout status deployment/station-dns --timeout=90s`.


  Comprueba la resolución desde el cliente y después el endpoint HTTP: una respuesta DNS por sí sola no demuestra que funcionen el enrutamiento o la aplicación. La propagación o la caducidad de la caché pueden tardar. No modifiques el DNS de `kube-system` ni resolvers externos.


  Referencias: [configuración DNS de Kubernetes](https://kubernetes.io/docs/tasks/administer-cluster/dns-custom-nameservers/), [plugin hosts de CoreDNS](https://coredns.io/plugins/hosts/).


  En el ejercicio 110, el cliente debe usar el DNS Service privado y resolver `station.internal` a la dirección del Service del controlador en `expected-dns-address`. Repara el Corefile privado, reinicia el DNS Deployment suministrado y espera la propagación; después prueba por separado el enrutamiento ingress.

  '
