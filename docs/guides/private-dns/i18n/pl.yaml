heading: Naprawa prywatnego DNS
text: '# Naprawa prywatnego DNS


  Nazwa DNS jest tłumaczona na adres przed połączeniem klienta. Te zadania używają prywatnej kopii CoreDNS, a nie DNS całego klastra. `Corefile` konfiguruje nasłuch i wtyczki: `hosts` mapuje nazwę na adres, a `ttl` określa czas buforowania wyniku. Dostarczony `expected-dns-address` zawiera właściwy adres; `dns-config.json`, `dns.json`, `dns-service.json` i `client.json` pokazują ConfigMap, workload DNS, porty Service i ustawienia klienta.


  Pod z `dnsPolicy: None` używa jawnie podanych serwerów nazw. Service DNS odbiera zapytania TCP i UDP na porcie 53 i przekazuje je na port 1053 kopii. Sprawdź prywatną konfigurację przez `kubectl get configmap station-dns -o yaml`, a Service przez `kubectl get service station-dns -o yaml`. Po zmianie ConfigMap zrestartuj tylko Deployment tej zatoki przez `kubectl rollout restart deployment/station-dns` i poczekaj przez `kubectl rollout status deployment/station-dns --timeout=90s`.


  Sprawdź rozwiązywanie nazwy z klienta, a następnie endpoint HTTP: sama odpowiedź DNS nie dowodzi działania routingu ani aplikacji. Propagacja adresu lub wygaśnięcie bufora mogą potrwać. Nie zmieniaj DNS `kube-system` ani zewnętrznych resolverów.


  Źródła: [konfiguracja DNS Kubernetes](https://kubernetes.io/docs/tasks/administer-cluster/dns-custom-nameservers/), [wtyczka hosts CoreDNS](https://coredns.io/plugins/hosts/).

  '
