heading: Private DNS recovery
text: '# Private DNS recovery


  A DNS name is translated to an address before a client connects. These quests use a private CoreDNS clone, not the cluster-wide DNS service. The `Corefile` configures its listener and plugins: `hosts` maps a name to an address, and `ttl` controls how long a result can be cached. The supplied `expected-dns-address` contains the intended address; `dns-config.json`, `dns.json`, `dns-service.json` and `client.json` show the ConfigMap, DNS workload, Service ports and client settings.


  A Pod with `dnsPolicy: None` uses the explicitly listed nameservers. The DNS Service receives TCP and UDP queries on port 53 and forwards them to the clone''s port 1053. Inspect the private configuration with `kubectl get configmap station-dns -o yaml` and the Service with `kubectl get service station-dns -o yaml`. After changing its ConfigMap, restart only this bay''s Deployment with `kubectl rollout restart deployment/station-dns` and wait with `kubectl rollout status deployment/station-dns --timeout=90s`.


  Test resolution from the client, then test the HTTP endpoint: a DNS answer alone does not show that routing or the application works. The address may take time to propagate or expire from a cache. Do not edit `kube-system` DNS or external resolvers.


  References: [Kubernetes DNS configuration](https://kubernetes.io/docs/tasks/administer-cluster/dns-custom-nameservers/), [CoreDNS hosts plugin](https://coredns.io/plugins/hosts/).

  '
