heading: Private DNS recovery
text: '# Private DNS recovery


  A DNS name is translated to an address before a client connects. These quests use a private CoreDNS clone, not the cluster-wide DNS service. The `Corefile` configures its listener and plugins: `hosts` maps a name to an address, and `ttl` controls how long a result can be cached. The supplied `expected-dns-address` contains the intended address; `dns-config.yaml`, `dns.yaml`, `dns-service.yaml` and `client.yaml` show the ConfigMap, DNS workload, Service ports and client settings.


  A Pod with `dnsPolicy: None` uses the explicitly listed nameservers. The DNS Service receives TCP and UDP queries on port 53 and forwards them to the clone''s port 1053. Inspect the private configuration with `kubectl get configmap station-dns -o yaml` and the Service with `kubectl get service station-dns -o yaml`. After changing its ConfigMap, restart only this bay''s Deployment with `kubectl rollout restart deployment/station-dns` and wait with `kubectl rollout status deployment/station-dns --timeout=90s`.


  Test resolution from the client, then test the HTTP endpoint: a DNS answer alone does not show that routing or the application works. The address may take time to propagate or expire from a cache. Do not edit `kube-system` DNS or external resolvers.


  References: [Kubernetes DNS configuration](https://kubernetes.io/docs/tasks/administer-cluster/dns-custom-nameservers/), [CoreDNS hosts plugin](https://coredns.io/plugins/hosts/).


  In quest 110, the client must use the private DNS Service and resolve `station.internal` to the controller Service address in `expected-dns-address`. Repair the private Corefile, restart the supplied DNS Deployment and wait for propagation; then test ingress routing separately.



  ### Corefile used by the resolver {#q105-resolver-corefile-command}


  CoreDNS may start with its default configuration or with a different Corefile. Inspect the named worker’s executable and arguments for /etc/station/Corefile.


  ```bash

  kubectl get deployment station-dns -o json | jq ''.spec.template.spec.containers[] | select(.name == "worker") | {command, args}''

  ```


  ### Resolver Service ports {#q105-resolver-service-ports}


  A Service port may omit one DNS protocol or target the wrong listener. Check TCP and UDP on port 53, both reaching numeric or named target 1053.


  ```bash

  kubectl get service station-dns -o json | jq ''.spec.ports''

  ```


  ### Direct response from the configured resolver {#q105-configured-resolver-answer}


  The supplied Corefile may still point north.station.internal to loopback, or the running resolver may not have loaded the revised file. Query station-dns directly and compare the answer with the supplied board address.


  ```bash

  server=$(kubectl get service station-dns -o jsonpath=''{.spec.clusterIP}''); kubectl exec deployment/client -c worker -- nslookup north.station.internal "$server"

  ```


  ### Client DNS policy {#q105-client-dns-policy}


  The client template may have reverted to the cluster DNS policy. Inspect its declared dnsPolicy and preserve None so the supplied nameserver configuration can apply.


  ```bash

  kubectl get deployment client -o jsonpath=''{.spec.template.spec.dnsPolicy}''

  ```


  ### Client nameserver address {#q105-client-nameserver-address}


  The client may still list an obsolete address or extra resolvers. Compare its nameservers with the current station-dns ClusterIP and keep only that address.


  ```bash

  kubectl get deployment client -o jsonpath=''{.spec.template.spec.dnsConfig.nameservers}''; kubectl get service station-dns -o jsonpath=''{.spec.clusterIP}''

  ```


  ### Explicit DNS reply in client {#q105-client-explicit-dns-answer}


  Even when the client configuration looks correct, it may get an incorrect or missing answer from the explicitly selected resolver. Inspect the returned address for north.station.internal from the client sandbox.


  ```bash

  server=$(kubectl get service station-dns -o jsonpath=''{.spec.clusterIP}''); kubectl exec deployment/client -- nslookup north.station.internal "$server"

  ```


  ### HTTP request by hostname {#q105-client-hostname-http}


  The DNS answer may be correct while the Service or endpoint behind it is unready or responds with the wrong content. Request the hostname from client and compare with north-105.


  ```bash

  kubectl exec deployment/client -- wget -qO- -T 3 http://north.station.internal:8080

  ```


  ### Inputs to the resolver check {#q105-resolver-observer-input}


  The resolver observation can stop before naming a condition when local tooling or its input fails. Check the tools and access to the live resolver resources first.


  ```bash

  command -v python3; kubectl get deployment station-dns -o name; kubectl get service station-dns -o name

  ```



  ### Client DNS policy {#q110-client-dns-policy}


  The client template may have reverted to the cluster DNS policy. Inspect its declared dnsPolicy and preserve None so the supplied nameserver configuration can apply.


  ```bash

  kubectl get deployment client -o jsonpath=''{.spec.template.spec.dnsPolicy}''

  ```


  ### Current nameserver address {#q110-incident-current-dns-server}


  The client may have no nameserver, point at an obsolete address or list another resolver. Compare the deployed addresses with the sole current station-dns ClusterIP. Missing Service or Deployment observations can trigger the same condition.


  ```bash

  kubectl get deployment client -o jsonpath=''{.spec.template.spec.dnsConfig.nameservers}''; kubectl get service station-dns -o jsonpath=''{.spec.clusterIP}''

  ```


  ### Station DNS response {#q110-incident-resolver-answer}


  The resolver may still answer station.internal with the old loopback address or fail to read its revised Corefile. Query the station-dns Service explicitly from client and compare the answer with the frozen proxy address.


  ```bash

  server=$(kubectl get service station-dns -o jsonpath=''{.spec.clusterIP}''); kubectl exec deployment/client -- nslookup station.internal "$server"

  ```


  ### Inputs to the DNS observer {#q110-incident-dns-observer-input}


  The DNS settings observer may exit before it can identify a field if its local process or input fails. Check Python and read access to client and station-dns.


  ```bash

  command -v python3; kubectl get deployment client -o name; kubectl get service station-dns -o name

  ```

  '
