heading: Privates DNS wiederherstellen
text: '# Privates DNS wiederherstellen


  Ein DNS-Name wird vor der Verbindung des Clients in eine Adresse aufgelöst. Diese Quests verwenden einen privaten CoreDNS-Klon, nicht das clusterweite DNS. `Corefile` konfiguriert Listener und Plugins: `hosts` ordnet einen Namen einer Adresse zu, `ttl` begrenzt die Cache-Dauer. Die bereitgestellte `expected-dns-address` enthält die vorgesehene Adresse; `dns-config.yaml`, `dns.yaml`, `dns-service.yaml` und `client.yaml` zeigen ConfigMap, DNS-Workload, Service-Ports und Client-Einstellungen.


  Ein Pod mit `dnsPolicy: None` verwendet die ausdrücklich angegebenen Nameserver. Der DNS-Service empfängt TCP- und UDP-Anfragen auf Port 53 und leitet sie an Port 1053 des Klons weiter. Prüfe die private Konfiguration mit `kubectl get configmap station-dns -o yaml` und den Service mit `kubectl get service station-dns -o yaml`. Starte nach einer ConfigMap-Änderung nur das Deployment dieser Umgebung mit `kubectl rollout restart deployment/station-dns` neu und warte mit `kubectl rollout status deployment/station-dns --timeout=90s`.


  Prüfe die Namensauflösung vom Client und danach den HTTP-Endpunkt: Eine DNS-Antwort allein beweist weder Routing noch die Anwendung. Verteilung oder Ablauf eines Cache-Eintrags können dauern. Ändere weder `kube-system`-DNS noch externe Resolver.


  Quellen: [Kubernetes-DNS-Konfiguration](https://kubernetes.io/docs/tasks/administer-cluster/dns-custom-nameservers/), [CoreDNS-hosts-Plugin](https://coredns.io/plugins/hosts/).


  In Aufgabe 110 muss der Client den privaten DNS-Service nutzen und `station.internal` zur Controller-Service-Adresse aus `expected-dns-address` auflösen. Repariere das private Corefile, starte das bereitgestellte DNS-Deployment neu und warte auf die Verbreitung; prüfe danach das Ingress-Routing getrennt.



  ### Corefile des Resolvers {#q105-resolver-corefile-command}


  CoreDNS startet möglicherweise mit seiner Standardkonfiguration oder einer anderen Datei. Prüfen Sie Programm und Argumente im Worker-Container auf /etc/station/Corefile.


  ```bash

  kubectl get deployment station-dns -o json | jq ''.spec.template.spec.containers[] | select(.name == "worker") | {command, args}''

  ```


  ### Service-Ports des Resolvers {#q105-resolver-service-ports}


  Am Service-Port fehlt möglicherweise ein DNS-Protokoll oder er verweist auf den falschen Listener. Prüfen Sie TCP und UDP auf Port 53, jeweils mit numerischem oder benanntem Zielport 1053.


  ```bash

  kubectl get service station-dns -o json | jq ''.spec.ports''

  ```


  ### Direkte Antwort des konfigurierten Resolvers {#q105-configured-resolver-answer}


  Das gelieferte Corefile verweist für north.station.internal möglicherweise noch auf Loopback oder der Resolver hat die Änderung möglicherweise nicht geladen. Fragen Sie station-dns direkt ab und vergleichen Sie die Antwort mit der Adresse von board.


  ```bash

  server=$(kubectl get service station-dns -o jsonpath=''{.spec.clusterIP}''); kubectl exec deployment/client -c worker -- nslookup north.station.internal "$server"

  ```


  ### DNS-Richtlinie von client {#q105-client-dns-policy}


  Die Vorlage des Deployments client verwendet möglicherweise wieder die Cluster-DNS-Richtlinie. Prüfen Sie dnsPolicy und behalten Sie None für die gelieferte Nameserver-Konfiguration bei.


  ```bash

  kubectl get deployment client -o jsonpath=''{.spec.template.spec.dnsPolicy}''

  ```


  ### Nameserver-Adresse von client {#q105-client-nameserver-address}


  Beim Deployment client stehen möglicherweise noch eine alte Adresse oder zusätzliche Resolver. Vergleichen Sie nameservers mit der aktuellen ClusterIP von station-dns und behalten Sie nur diese Adresse.


  ```bash

  kubectl get deployment client -o jsonpath=''{.spec.template.spec.dnsConfig.nameservers}''; kubectl get service station-dns -o jsonpath=''{.spec.clusterIP}''

  ```


  ### DNS-Antwort auf explizite Anfrage aus client {#q105-client-explicit-dns-answer}


  Trotz korrekter Konfiguration kann client vom ausdrücklich gewählten Resolver eine falsche oder keine Antwort erhalten. Prüfen Sie die Adresse für north.station.internal aus dem Pod client.


  ```bash

  server=$(kubectl get service station-dns -o jsonpath=''{.spec.clusterIP}''); kubectl exec deployment/client -- nslookup north.station.internal "$server"

  ```


  ### HTTP-Anfrage nach Hostname {#q105-client-hostname-http}


  Die DNS-Antwort kann stimmen, obwohl der Service oder Endpoint nicht bereit ist oder anderen Inhalt liefert. Rufen Sie den Namen aus client auf und vergleichen Sie die Antwort mit north-105.


  ```bash

  kubectl exec deployment/client -- wget -qO- -T 3 http://north.station.internal:8080

  ```


  ### Eingaben für die Resolver-Prüfung {#q105-resolver-observer-input}


  Die Resolver-Prüfung kann vor der Meldung einer Bedingung abbrechen, wenn Werkzeuge oder Eingaben fehlschlagen. Prüfen Sie zuerst Werkzeuge und Zugriff auf die Resolver-Ressourcen.


  ```bash

  command -v python3; kubectl get deployment station-dns -o name; kubectl get service station-dns -o name

  ```



  ### DNS-Richtlinie von client {#q110-client-dns-policy}


  Die Vorlage des Deployments client verwendet möglicherweise wieder die Cluster-DNS-Richtlinie. Prüfen Sie dnsPolicy und behalten Sie None für die gelieferte Nameserver-Konfiguration bei.


  ```bash

  kubectl get deployment client -o jsonpath=''{.spec.template.spec.dnsPolicy}''

  ```


  ### Aktuelle Nameserver-Adresse {#q110-incident-current-dns-server}


  Client hat möglicherweise keinen Nameserver, nutzt eine alte Adresse oder enthält einen anderen Resolver. Vergleichen Sie die Adressen mit der einzigen aktuellen ClusterIP von station-dns. Lesefehler bei Service oder Deployment können dieselbe Meldung auslösen.


  ```bash

  kubectl get deployment client -o jsonpath=''{.spec.template.spec.dnsConfig.nameservers}''; kubectl get service station-dns -o jsonpath=''{.spec.clusterIP}''

  ```


  ### DNS-Antwort für die Station {#q110-incident-resolver-answer}


  Der Resolver liefert für station.internal möglicherweise noch Loopback oder hat das geänderte Corefile nicht geladen. Fragen Sie station-dns ausdrücklich aus client ab und vergleichen Sie mit der festgehaltenen Proxy-Adresse.


  ```bash

  server=$(kubectl get service station-dns -o jsonpath=''{.spec.clusterIP}''); kubectl exec deployment/client -- nslookup station.internal "$server"

  ```


  ### Eingaben für die DNS-Prüfung {#q110-incident-dns-observer-input}


  Die DNS-Prüfung kann vor der Feldmeldung abbrechen, wenn Prozess oder Eingaben fehlschlagen. Prüfen Sie Python und Lesezugriff auf client und station-dns.


  ```bash

  command -v python3; kubectl get deployment client -o name; kubectl get service station-dns -o name

  ```

  '
