heading: Privates DNS wiederherstellen
text: '# Privates DNS wiederherstellen


  Ein DNS-Name wird vor der Verbindung des Clients in eine Adresse aufgelöst. Diese Quests verwenden einen privaten CoreDNS-Klon, nicht das clusterweite DNS. `Corefile` konfiguriert Listener und Plugins: `hosts` ordnet einen Namen einer Adresse zu, `ttl` begrenzt die Cache-Dauer. Die bereitgestellte `expected-dns-address` enthält die vorgesehene Adresse; `dns-config.json`, `dns.json`, `dns-service.json` und `client.json` zeigen ConfigMap, DNS-Workload, Service-Ports und Client-Einstellungen.


  Ein Pod mit `dnsPolicy: None` verwendet die ausdrücklich angegebenen Nameserver. Der DNS-Service empfängt TCP- und UDP-Anfragen auf Port 53 und leitet sie an Port 1053 des Klons weiter. Prüfe die private Konfiguration mit `kubectl get configmap station-dns -o yaml` und den Service mit `kubectl get service station-dns -o yaml`. Starte nach einer ConfigMap-Änderung nur das Deployment dieser Umgebung mit `kubectl rollout restart deployment/station-dns` neu und warte mit `kubectl rollout status deployment/station-dns --timeout=90s`.


  Prüfe die Namensauflösung vom Client und danach den HTTP-Endpunkt: Eine DNS-Antwort allein beweist weder Routing noch die Anwendung. Verteilung oder Ablauf eines Cache-Eintrags können dauern. Ändere weder `kube-system`-DNS noch externe Resolver.


  Quellen: [Kubernetes-DNS-Konfiguration](https://kubernetes.io/docs/tasks/administer-cluster/dns-custom-nameservers/), [CoreDNS-hosts-Plugin](https://coredns.io/plugins/hosts/).

  '
