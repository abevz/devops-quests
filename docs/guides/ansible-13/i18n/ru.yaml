heading: '13. Секреты: шифрование хранения и защита выполнения (Ansible Vault)'
text: "## 13. Секреты: шифрование хранения и защита выполнения (Ansible Vault)\n\n**Коротко**\n- Ansible Vault защищает зашифрованные данные при хранении.\n- Во время выполнения значение уже доступно задаче.\n- no_log скрывает результат задачи в журнале, но не шифрует исходный файл.\n\n**Мини-пример:** в отдельном временном каталоге сохрани `mini.yml`; запуск — `ansible-playbook -i localhost, -c local mini.yml`. Пример работает на localhost без become.\n\n```yaml\n- hosts: localhost\n  connection: local\n  become: false\n  gather_facts: false\n  tasks:\n    - ansible.builtin.debug:\n        msg: demo-secret\n      no_log: true\n    - ansible.builtin.debug:\n        msg: visible\n```\n\n**Предскажи:** Какое из двух сообщений останется видимым?\n\n> [!question]- Ответ\n> Запуск 1; код 0. Фрагменты stdout:\n>\n> ```text\n>     \"msg\": \"visible\"\n> localhost                  : ok=2    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n>\n> Запуск 2; код 0. Фрагменты stdout:\n>\n> ```text\n>     \"msg\": \"visible\"\n> localhost                  : ok=2    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n\nПервое учебное значение скрыто из результата задачи, второе видно. Строка `demo-secret` остаётся в самом playbook: этот пример проверяет no_log, а не шифрование Vault.\n\n**Подготовка — два файла создаёшь сам, рядом с `inventory.ini`.** `vault.pass` — обычный текстовый файл с одной строкой, паролем; Ansible его не создаёт. `secret.yml` — открытый YAML, который затем шифруется:\n\n```bash\nprintf 'lab-demo-password\\n' > vault.pass\nchmod 600 vault.pass\nprintf 'demo_secret: example-only\\n' > secret.yml\n```\n\nБезопасная процедура с учебным паролем, **не настоящим секретом**:\n\n```bash\nansible-vault encrypt secret.yml --vault-id lab@vault.pass\nansible-vault view secret.yml --vault-id lab@vault.pass\nansible-vault encrypt_string --stdin-name demo_secret --vault-id lab@vault.pass\nansible-playbook -i inventory.ini secret-play.yml --vault-id lab@vault.pass\n```\n\nДо шифрования `secret.yml` содержал `demo_secret: example-only`; `vault.pass` — отдельный файл пароля.\nВариант шифрования строки читает значение из стандартного ввода: не помещайте настоящие секреты в историю оболочки или аргументы команд.\n`lab@vault.pass` состоит из метки `lab` и источника пароля. `--vault-id lab@prompt` спрашивает пароль;\nможно передать несколько идентификаторов Vault для разработки и рабочей среды с разными паролями. Идентификатор — подсказка выбора, не\nграница авторизации; политика сопоставления определяется настройками. «Один пароль на всё» не требование.\n\nПолный `secret-play.yml`:\n\n```yaml\n- name: Read encrypted variables without showing values\n  hosts: lab\n  connection: local\n  gather_facts: false\n  become: false\n  vars_files:\n    - secret.yml\n  tasks:\n    - name: Check presence of secret\n      ansible.builtin.assert:\n        that: demo_secret is defined\n      no_log: true\n```\n\n*(проверено)* Шифрование файла и правильный пароль позволили прочитать учебное значение;\nс неверным файлом пароля `ansible-core` 2.21.4 вернул:\n\n```text\nDecryption failed (no vault secrets were found that could decrypt).\n```\n\n**Ansible Vault** шифрует данные в репозитории, но при выполнении управляющий узел расшифровывает их.\nЭто не HashiCorp Vault: у Ansible Vault нет сервиса выдачи секретов на ограниченный срок, политик API или автоматической ротации.\nШифрование целого файла скрывает и ключи, и значения; шифрование строки оставляет YAML вокруг открытым,\nа одно значение получает блок `!vault`. `!vault` — метка типа YAML для зашифрованной строки, не обозначение Jinja.\n\n**`no_log: true`** подавляет вывод задачи, включая чувствительный результат. Это не шифрование файла на\nуправляемом узле и не защита от осознанного `debug` секрета в следующей задаче. Для шаблона с секретами добавьте ещё\n`diff: false`; выберите строгие права доступа к целевому файлу. Не сохраняйте расшифрованные секреты в артефактах,\nкэше фактов и трассировках исключений сторонних программ. Отладка с отключённым `no_log` — отдельный риск.\n*(по документации)* [Логирование и скрытие вывода](https://docs.ansible.com/ansible/latest/reference_appendices/logging.html).\n\n*(проверено)* Запуск проверки секрета с `-v` скрыл результат:\n\n```text\n\"censored\": \"the output has been hidden due to the fact that 'no_log: true' was specified for this result\"\n```\n\n> [!info]- Глубже\n> ```mermaid\n> flowchart TB\n>     G[\"Зашифрованный YAML в Git\"] --> C[\"Управляющий узел: расшифровать переданным паролем\"]\n>     P[\"Ввод пароля, защищённый файл, исполняемый клиент пароля\"] --> C\n>     C --> M[\"Открытое значение в аргументах модуля\"]\n>     M --> T[\"Процесс или файл конфигурации на управляемом узле\"]\n>     M --> L[\"Логи и различия: отдельный риск раскрытия\"]\n> ```\n>\n> Проверены также шифрование строки через стандартный ввод и выполнение сценария с зашифрованными переменными.\n> Пароль Ansible Vault — не пароль SSH и не пароль для повышения привилегий. В CI источник — защищённое хранилище учётных данных:\n> исполнитель задания получает краткоживущий файл с ограниченными правами доступа либо исполняемый клиент получения пароля, который\n> возвращает пароль в стандартный вывод. Файл вне Git, ограниченные права доступа, удаление после задания.\n> Саму CI-интеграцию здесь не запускали. Официальные страницы Vault отвечали HTTP 429 при этой сверке;\n> механика файлов, строк и идентификаторов подтверждена локальными командами; подробная политика сопоставления паролей не проверена.\n> Справочник для продолжения:\n> [Пароли Vault](https://docs.ansible.com/ansible/latest/vault_guide/vault_managing_passwords.html).\n>\n> **Внешнее получение значения** делает запрос с управляющего узла во время вычисления переменной. Там нужны учётные данные,\n> доверие к центру сертификации, библиотека для работы с API и сеть. Управляемый хост получает уже значение; доступ управляющего узла к хранилищу секретов не означает,\n> что каждый управляемый хост должен иметь этот доступ.\n>\n> Пример полного сценария для получения секрета AWS, **только проверка синтаксиса, API не вызывался**:\n>\n> **`aws-secret.yml` — пример для чтения: без учётной записи AWS не запускать:**\n>\n> ```yaml\n> - name: Read a cloud secret on the controller\n>   hosts: lab\n>   connection: local\n>   gather_facts: false\n>   become: false\n>   vars:\n>     api_token: \"{{ lookup('amazon.aws.secretsmanager_secret', 'lab/api-token', region='eu-central-1') }}\"\n>   tasks:\n>     - name: Validate secret is not empty\n>       ansible.builtin.assert:\n>         that: api_token | length > 0\n>       no_log: true\n> ```\n>\n> `lookup(...)` вызывается при использовании `api_token`; наличие `vars` само по себе не гарантирует\n> запрос. Вариант HashiCorp — `community.hashi_vault` (например плагин `hashi_vault`; документация\n> рекомендует рассматривать специализированные плагины). Нужны `hvac` и выбранный метод аутентификации:\n> `AppRole`, JWT или токен с минимальной политикой доступа. Библиотека облачного API может использовать временные учётные данные исполнителя задания.\n> *(по документации)* [Получение секретов HashiCorp](https://docs.ansible.com/ansible/latest/collections/community/hashi_vault/hashi_vault_lookup.html),\n> [Получение секретов AWS](https://docs.ansible.com/ansible/latest/collections/amazon/aws/secretsmanager_secret_lookup.html).\n> Аутентификация в действующей системе *(не проверено)*; тексты ошибок отказа в доступе не выдумываются.\n>\n> **SOPS** — альтернативное шифрование структурированных файлов с age/KMS и метаданными получателей.\n> Можно сохранять читаемые ключи и зашифрованные значения; сравнение показывает структуру, но не открытый текст изменений\n> секрета. Ansible не расшифровывает SOPS автоматически как `!vault`: нужен отдельный шаг расшифровки или\n> плагин `community.sops.sops`, например\n> `lookup('community.sops.sops', 'secrets.sops.yml') | from_yaml`.\n> Установка SOPS и коллекции, доступ к ключу age или KMS нужны на управляющем узле. Это *(по документации)*,\n> не локальная проверка шифрования: [Получение значений SOPS](https://docs.ansible.com/ansible/latest/collections/community/sops/sops_lookup.html).\n>\n> Вопрос: **Is Ansible Vault enough to keep a secret out of logs?**\n>\n> > No. Vault protects stored data, but Ansible decrypts it during a run. I use `no_log` on tasks that\n> > handle secrets and disable sensitive diffs. The vault password must come from a protected source,\n> > and decrypted files must not be saved as pipeline artifacts.\n"
