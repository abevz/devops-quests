heading: '13. Secrets: encrypted storage and protected execution (Ansible Vault)'
text: "## 13. Secrets: encrypted storage and protected execution (Ansible Vault)\n\n**At a glance**\n- Ansible Vault protects encrypted data at rest.\n- At runtime, the value is available to the task.\n- no_log hides a task result in the log, but does not encrypt the source file.\n\n**Mini-example:** save `mini.yml` in a separate temporary directory; run `ansible-playbook -i localhost, -c local mini.yml`. The example runs on localhost without become.\n\n```yaml\n- hosts: localhost\n  connection: local\n  become: false\n  gather_facts: false\n  tasks:\n    - ansible.builtin.debug:\n        msg: demo-secret\n      no_log: true\n    - ansible.builtin.debug:\n        msg: visible\n```\n\n**Predict:** Which of the two messages will remain visible?\n\n> [!question]- Answer\n> Exit code: 0. Stdout excerpts:\n>\n> ```text\n>     \"msg\": \"visible\"\n> localhost                  : ok=2    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n\nThe first demo value is hidden from the task output; the second remains visible. The string `demo-secret` is still in the playbook itself: this example checks no_log, not Vault encryption.\n\n**Preparation: create two files yourself beside `inventory.ini`.** `vault.pass` is an ordinary text file containing one password line; Ansible does not create it. `secret.yml` is plaintext YAML to be encrypted next:\n\n```bash\nprintf 'lab-demo-password\\n' > vault.pass\nchmod 600 vault.pass\nprintf 'demo_secret: example-only\\n' > secret.yml\n```\n\nA safe procedure using an exercise password, **not a real secret**:\n\n```bash\nansible-vault encrypt secret.yml --vault-id lab@vault.pass\nansible-vault view secret.yml --vault-id lab@vault.pass\nansible-vault encrypt_string --stdin-name demo_secret --vault-id lab@vault.pass\nansible-playbook -i inventory.ini secret-play.yml --vault-id lab@vault.pass\n```\n\nBefore encryption, `secret.yml` contained `demo_secret: example-only`; `vault.pass` is a separate password file.\nThe string-encryption variant reads standard input: do not place real secrets in shell history or command arguments.\n`lab@vault.pass` combines label `lab` with a password source. `--vault-id lab@prompt` prompts for the password;\nyou can pass several Vault identities for development and production with different passwords. An identity is a selection hint,\nnot an authorization boundary; matching policy is configurable. “One password for everything” is not required.\n\nComplete `secret-play.yml`:\n\n```yaml\n- name: Read encrypted variables without showing values\n  hosts: lab\n  connection: local\n  gather_facts: false\n  become: false\n  vars_files:\n    - secret.yml\n  tasks:\n    - name: Check presence of secret\n      ansible.builtin.assert:\n        that: demo_secret is defined\n      no_log: true\n```\n\n*(verified)* File encryption and the correct password allowed reading the exercise value;\nwith the wrong password file, `ansible-core` 2.21.4 returned:\n\n```text\nDecryption failed (no vault secrets were found that could decrypt).\n```\n\n**Ansible Vault** encrypts repository data, which the controller decrypts during execution.\nIt is not HashiCorp Vault: Ansible Vault has no service issuing time-limited secrets, API policies or automatic rotation.\nWhole-file encryption hides keys and values; string encryption leaves surrounding YAML visible\nand assigns one value a `!vault` block. `!vault` is a YAML type tag for an encrypted string, not Jinja syntax.\n\n**`no_log: true`** suppresses task output, including sensitive results. It neither encrypts a file on\nthe managed node nor prevents deliberately printing a secret with `debug` in the next task. For secret templates also set\n`diff: false` and restrictive destination permissions. Do not save decrypted secrets in artifacts,\nfact caches or exception traces from third-party programs. Debugging with `no_log` disabled introduces a separate risk.\n*(according to documentation)* [Logging and output suppression](https://docs.ansible.com/ansible/latest/reference_appendices/logging.html).\n\n*(verified)* Running the secret check with `-v` hid the result:\n\n```text\n\"censored\": \"the output has been hidden due to the fact that 'no_log: true' was specified for this result\"\n```\n\n> [!info]- Deeper explanation\n> ```mermaid\n> flowchart TB\n>     G[\"Encrypted YAML in Git\"] --> C[\"Control node: decrypt with the supplied password\"]\n>     P[\"Password prompt, protected file, executable password client\"] --> C\n>     C --> M[\"Plaintext value in module arguments\"]\n>     M --> T[\"Process or configuration file on the managed host\"]\n>     M --> L[\"Logs and diffs: a separate disclosure risk\"]\n> ```\n>\n> String encryption from standard input and execution with encrypted variables were also checked.\n> The Ansible Vault password is neither an SSH password nor a privilege-escalation password. In CI, use protected credential storage:\n> the job runner receives a short-lived, permission-restricted file or executable password client that\n> returns the password on standard output. Keep the file outside Git, restrict permissions and delete it after the job.\n> The CI integration itself was not run here. Official Vault pages returned HTTP 429 during that verification;\n> file, string and identity mechanics were confirmed locally, but detailed password matching policy was not checked.\n> Reference for further reading:\n> [Vault passwords](https://docs.ansible.com/ansible/latest/vault_guide/vault_managing_passwords.html).\n>\n> **External secret lookup** requests a value from the controller while evaluating a variable. That controller needs credentials,\n> CA trust, an API library and networking. The managed host receives the resulting value; controller access to the secret store does not mean\n> every managed host should have the same access.\n>\n> A complete AWS secret lookup play, **syntax checked only; no API call made**:\n>\n> **`aws-secret.yml`: a reading example; do not run without an AWS account:**\n>\n> ```yaml\n> - name: Read a cloud secret on the controller\n>   hosts: lab\n>   connection: local\n>   gather_facts: false\n>   become: false\n>   vars:\n>     api_token: \"{{ lookup('amazon.aws.secretsmanager_secret', 'lab/api-token', region='eu-central-1') }}\"\n>   tasks:\n>     - name: Validate secret is not empty\n>       ansible.builtin.assert:\n>         that: api_token | length > 0\n>       no_log: true\n> ```\n>\n> `lookup(...)` is called when `api_token` is used; declaring `vars` alone does not guarantee\n> a request. The HashiCorp alternative is `community.hashi_vault` (for example its `hashi_vault` plugin; documentation\n> recommends considering specialized plugins). It needs `hvac` and the chosen authentication method:\n> `AppRole`, JWT or a minimally scoped token. A cloud API library can use temporary credentials from the job runner.\n> *(according to documentation)* [HashiCorp secret lookup](https://docs.ansible.com/ansible/latest/collections/community/hashi_vault/hashi_vault_lookup.html),\n> [AWS secret lookup](https://docs.ansible.com/ansible/latest/collections/amazon/aws/secretsmanager_secret_lookup.html).\n> Live authentication is *(not verified)*; access-denied error messages are not invented.\n>\n> **SOPS** is alternative structured-file encryption using age/KMS and recipient metadata.\n> Keys may remain readable while values are encrypted; a diff shows structure without revealing plaintext secret\n> changes. Ansible does not automatically decrypt SOPS as it does `!vault`: use a separate decryption step or\n> a plugin such as `community.sops.sops`, for example\n> `lookup('community.sops.sops', 'secrets.sops.yml') | from_yaml`.\n> SOPS, the collection and access to an age or KMS key are needed on the controller. This is *(according to documentation)*,\n> not a local encryption check: [SOPS value lookup](https://docs.ansible.com/ansible/latest/collections/community/sops/sops_lookup.html).\n>\n> Question: **Is Ansible Vault enough to keep a secret out of logs?**\n>\n> > No. Vault protects stored data, but Ansible decrypts it during a run. I use `no_log` on tasks that\n> > handle secrets and disable sensitive diffs. The vault password must come from a protected source,\n> > and decrypted files must not be saved as pipeline artifacts."
