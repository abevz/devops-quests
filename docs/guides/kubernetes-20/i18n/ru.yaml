heading: '20. Диагностика: идти от наблюдения к слою отказа'
text: "## 20. Диагностика: идти от наблюдения к слою отказа\n\n**Коротко**\n- Диагностика начинается с наблюдаемого отказа\n- Одинаковый симптом может иметь разные причины\n- Первый шаг должен различать гипотезы.\n\n**Короткий сценарий**\n\nHTTP-запрос не проходит, но пока неизвестны DNS-ответ, endpoint и слушающий порт.\n\n**Предскажи:** Достаточно ли сразу перезапустить Deployment?\n\n> [!question]- Ответ\n> Разбор заданных условий: Нет. Это действие не устанавливает слой отказа и может уничтожить полезные свидетельства.\n\n> [!info] Ядро и справочник\n> Ядро при разборе случая: симптом → слой → одна следующая проверка → её граница. Каждый подраздел — самостоятельный случай; механизмы §3–14 не нужно повторять подряд. Полные прогоны и §21 — справочник.\n\n### Вход по симптому\n\n**Коротко**\n- Симптом выбирает первый участок проверки\n- События показывают этап ожидания\n- Логи процесса полезны только после его запуска.\n\n**Короткий сценарий**\n\nPod не имеет nodeName, условие PodScheduled=False.\n\n**Предскажи:** Есть ли смысл начинать с логов приложения?\n\n> [!question]- Ответ\n> Разбор заданных условий: Сначала нужно выяснить размещение по условиям и событиям: процесс мог ещё не стартовать.\n\n| Симптом | Самостоятельный случай | Механизм |\n|---|---|---|\n| Не загрузился образ | [[#Полный пример ошибки загрузки образа|ImagePullBackOff]] | §3: состояние контейнера |\n| Процесс убит | [[#Полный пример превышения памяти|OOM]] | §9: память |\n| Service не отвечает | [[#Не сводить сетевую диагностику к тексту одной ошибки|Сеть]] | §10: conditions |\n| Нет shell | [[#Как добраться до процесса без оболочки|Доступ к процессу]] | [[Containers-Visual-Guide|изоляция процесса]] |\n\n### Сначала локализовать, затем менять\n\n**Коротко**\n- Сначала определи охват\n- Затем прочитай состояние конкретного Pod\n- Изменение должно отвечать подтверждённой причине.\n\n**Мини-пример:** только в одноразовом kind из подготовки выше. Создай namespace командой `kubectl --kubeconfig /tmp/guides-order-rest.kubeconfig --context kind-guides-order-rest create namespace guide-mini-66`. Сохрани листинг как `mini.sh`; запуск — `bash -e mini.sh`.\n\n```bash\nk() { kubectl --kubeconfig /tmp/guides-order-rest.kubeconfig --context kind-guides-order-rest -n guide-mini-66 \"$@\"; }\nk run once --image=nginx:1.29-alpine --image-pull-policy=Never --restart=Never --command -- sh -c 'echo diagnostic; exit 3'\nk wait --for=jsonpath='{.status.phase}'=Failed pod/once --timeout=90s\nk logs once\nk get pod once -o jsonpath='{.status.containerStatuses[0].state.terminated.exitCode}{\"\\n\"}'\n```\n\n**Предскажи:** Что покажет последняя команда после выполнения предыдущих?\n\n> [!question]- Ответ\n> Фактический stdout команд:\n>\n> ```text\n> pod/once created\n> pod/once condition met\n> diagnostic\n> 3\n> ```\n>\n> Код завершения: 0.\n\nПроцесс был запущен и напечатал diagnostic, затем вернул 3. Это отличается от отказа планировщика или загрузки образа.\n\n**Команды в любом каталоге — минимальный набор свидетельств для Pod `crash`:**\n\n```bash\nkubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s \\\n  -n vg-k8s get pods -o wide\nkubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s \\\n  -n vg-k8s describe pod crash\nkubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s \\\n  -n vg-k8s logs crash -c app --previous\nkubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s \\\n  -n vg-k8s get events --field-selector involvedObject.name=crash --sort-by=.lastTimestamp\n```\n\nСначала определить охват: один контейнер, один Pod, одна версия Deployment, один узел или весь кластер.\nПроверить, назначен ли узел; затем подготовку среды/контейнер, готовность, получателей Service и сетевой путь.\nДо перезапуска сохранить прошлые логи и события: новый запуск может скрыть причину.\nЭтот порядок — инженерный метод на основе\n[отладки подов](https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/) и\n[отладки Service](https://kubernetes.io/docs/tasks/debug/debug-application/debug-service/). *(по документации)*.\n\n> [!info]- Глубже\n> **Схема для чтения — один симптом ведёт к разным первопричинам:**\n>\n> ```mermaid\n> flowchart TD\n>     A[\"Приложение<br/>недоступно\"] --> B[\"Есть Pod?\"]\n>     B -->|\"Нет\"| C[\"ReplicaSet<br/>events: квота<br/>или допуск\"]\n>     B -->|\"Да\"| D[\"Есть<br/>назначенный<br/>узел?\"]\n>     D -->|\"Нет\"| E[\"FailedScheduling:<br/>§8 и PVC\"]\n>     D -->|\"Да\"| F[\"Контейнер<br/>запущен?\"]\n>     F -->|\"Нет\"| G[\"Образ,<br/>конфигурация,<br/>том, CNI\"]\n>     F -->|\"Да\"| H[\"Ready?\"]\n>     H -->|\"Нет\"| I[\"Пробы и<br/>приложение\"]\n>     H -->|\"Да\"| J[\"EndpointSlice,<br/>порт, DNS,<br/>политика\"]\n> ```\n>\n> `-o wide` добавляет IP/узел; события связывают отказ с компонентом;\n> `--previous` читает завершившийся экземпляр. Для distroless-образа отсутствие shell не является отказом\n> приложения: использовать временный отладочный контейнер с нужными правами/образом.\n> Полный пример — [[K8s-Debug-Distroless-Images]].\n> В исходном прогоне временные контейнеры не запускались; дополнительный запуск разобран ниже.\n\n### Пять обязательных веток и узловой охват\n\n**Коротко**\n- Нужно различать размещение, образ, процесс, память и сеть\n- Узловой охват помогает найти общую причину\n- Одна ошибка контейнера не доказывает отказ всего узла.\n\n**Короткий сценарий**\n\nПроблема есть у разных приложений только на одном узле; на остальных они работают.\n\n**Предскажи:** Какую область стоит проверить следующей?\n\n> [!question]- Ответ\n> Разбор заданных условий: Общий узел: его условия, runtime, ресурсы и сетевые компоненты, сохраняя связь с конкретными наблюдениями.\n\n| Симптом | Первый вопрос | Свидетельство → следующий шаг |\n|---|---|---|\n| `Pending`, нет `nodeName` | Какие узлы исключены? | `FailedScheduling` → requests, taints, affinity, PVC (§8/11) |\n| `Pending`, узел есть | Что не подготовлено? | `FailedMount`, `FailedCreatePodSandBox`, отказ Secret/образа |\n| `CrashLoopBackOff` | Кто завершил процесс? | Прошлые логи, `lastState`, код/причина, liveness/OOM (§3/4/9) |\n| `ImagePullBackOff` | Образ существует и доступен? | Событие registry/DNS/TLS/auth/тега; imagePullSecrets (§3, [[Containers-Visual-Guide]]) |\n| `Running`, не Ready | Почему readiness неуспешна? | Событие 404/тайм-аута; слушающий адрес/порт; зависимость (§4) |\n| Service без получателей | Селектор или готовность? | Нет адресов → метки; адреса неготовы → пробы (§10) |\n| Несколько подов одного узла сломаны | Узел доступен? | Node conditions, kubelet/CRI, диск/память, сеть |\n\n> [!info]- Глубже\n> Таблица объединяет открытые источники отладки и новые опыты; конкретные неповторённые ошибки отмечены\n> в профильных разделах. Узловой отказ в этой сессии — *(не проверено)*.\n\n### Полный пример ошибки загрузки образа\n\nКраткий маршрут выше задаёт механизм и следующую проверку. Полный листинг и наблюдения: [[#Справочный рецепт — Полный пример ошибки загрузки образа|справочный рецепт]].\n\n### Полный пример превышения памяти\n\nКраткий маршрут выше задаёт механизм и следующую проверку. Полный листинг и наблюдения: [[#Справочный рецепт — Полный пример превышения памяти|справочный рецепт]].\n\n### Не сводить сетевую диагностику к тексту одной ошибки\n\n**Коротко**\n- Текст ошибки задаёт направление проверки\n- DNS, соединение и ответ приложения — разные этапы\n- Timeout не называет единственную причину.\n\n**Короткий сценарий**\n\nDNS дал адрес, клиент отправил SYN, ответа не получил.\n\n**Предскажи:** Доказано ли, что приложение не слушает?\n\n> [!question]- Ответ\n> Разбор заданных условий: Нет. Возможны путь и фильтрация; нужен независимый признак слушающего порта и наблюдение пакетов.\n\n**Вывод старого клиента — пример для чтения, записанный прогон NetworkPolicy/Cilium:**\n\n> [!info]- Глубже\n> ```text\n> wget: bad address 'web'\n> wget: download timed out\n> ```\n>\n> Это **записанный прогон** из [[Kubernetes-Coding-Drills-Solutions#3 — NetworkPolicy]]:\n> в первом случае политика закрыла также DNS, во втором DNS был разрешён, а путь к приложению закрыт.\n> В другом окружении такие сообщения могут иметь другие причины; подтвердить отдельным DNS-запросом,\n> EndpointSlice, подключением к порту и наблюдением сетевой реализации.\n> В исходном прогоне новых опытов отбрасывания пакетов и отказа DNS не было; дополнительный запуск — ниже.\n>\n> Не переносить безусловно старый тезис «политика всегда видит targetPort после DNAT»:\n> для трансляции Service адресов/портов порядок относительно сетевой политики зависит от реализации.\n> Правило проектировать и проверять на конкретном CNI, отдельно разрешая DNS по UDP/TCP.\n> *(по документации)* — [NetworkPolicy и NAT](https://kubernetes.io/docs/concepts/services-networking/network-policies/).\n>\n> **Предскажи:** у пода `lastState: Completed, exitCode: 0`, а рестарты растут. Приложение точно исправно?\n>\n> > [!question]- Ответ\n> > Нет. В новом опыте kubelet остановил nginx из-за liveness 404, nginx завершился с кодом 0.\n> > Событие `failed liveness probe, will be restarted` устанавливает инициатора остановки.\n> > *(проверено)* — §4.\n>\n> **Короткий ответ на английском:**\n>\n> > I first find the failing layer. Pending without a node is different from waiting for an image on a selected node.\n> > I compare events, previous logs and termination reasons. I change the manifest only after I have evidence for the cause.\n\n### Как добраться до процесса без оболочки\n\n**Коротко**\n- В минимальном образе может не быть оболочки\n- Отказ exec sh не доказывает отказ приложения\n- Отладочный инструмент подключают отдельно.\n\n**Короткий сценарий**\n\nHTTP приложения отвечает, а exec sh возвращает executable not found.\n\n**Предскажи:** Нужно ли считать контейнер упавшим?\n\n> [!question]- Ответ\n> Разбор заданных условий: Нет. Отсутствует запрошенный исполняемый файл; приложение может работать.\n\n**`main.go` в `/tmp/vg-k8s-work` — полный исходник учебного приложения:**\n\n```go\npackage main\nimport(\"fmt\";\"net\";\"net/http\";\"os\";\"time\")\nfunc main(){\n if len(os.Args)>1 && os.Args[1]==\"crash\" { _,e:=os.ReadFile(\"/config/app.yaml\");fmt.Println(e);os.Exit(3) }\n os.WriteFile(\"/data/marker\",[]byte(\"original\\n\"),0600)\n go func(){for{_,e:=os.ReadFile(\"/config/app.yaml\");if e!=nil{fmt.Println(e)};time.Sleep(time.Second)}}()\n go func(){l,e:=net.Listen(\"tcp\",\":8082\");if e!=nil{panic(e)};for{c,e:=l.Accept();if e!=nil{continue};go func(c net.Conn){b:=make([]byte,1024);c.Read(b);c.(*net.TCPConn).SetLinger(0);c.Close()}(c)}}()\n http.HandleFunc(\"/\",func(w http.ResponseWriter,r *http.Request){fmt.Fprintln(w,\"ok\")})\n panic(http.ListenAndServe(\":8080\",nil))\n}\n```\n\n**`Dockerfile` в `/tmp/vg-k8s-work` — полный файл; `root-marker` рядом содержит строку `scratch-root`:**\n\n```dockerfile\nFROM scratch\nCOPY app /app\nCOPY root-marker /root-marker\nUSER 0\nENTRYPOINT [\"/app\"]\n```\n\nСледующие опыты выполнены отдельно от предыдущих: kind **0.33.0**, Kubernetes и kubectl **1.37.0**, containerd **2.3.4** узла kind, `crictl 1.36.0`; один управляющий и один рабочий узел. *(проверено)*.\nEphemeral containers стабильны с Kubernetes 1.25; пользовательские профили `--custom` — с 1.32. *(по документации)* — [отладка работающего пода](https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/).\nВ §2–5 разобраны состояния и пробы; здесь доставляем инструмент к процессу. Статическая программа в `scratch` воспроизводит тот же недостаток инструментов, что distroless:\nоболочки нет, приложение работает. Пересборка рабочего образа с оболочкой меняет исследуемый артефакт, требует замены пода и расширяет состав production-образа. Для наблюдения текущего процесса она не нужна.\n\n> [!info]- Глубже\n> UID 0 здесь выбран для сравнения прав трассировки; это не рекомендуемый пользователь рабочего приложения. `8080` отвечает HTTP, `8082` намеренно сбрасывает соединение после чтения запроса; файл конфигурации отсутствует.\n>\n> **`lab.yaml` в `/tmp/vg-k8s-work` — полный набор объектов дополнительной практики:**\n>\n> ```yaml\n> apiVersion: v1\n> kind: Namespace\n> metadata: {name: vg-k8s}\n> ---\n> apiVersion: v1\n> kind: Pod\n> metadata: {name: vg-k8s-app, namespace: vg-k8s, labels: {app: vg-k8s-app}}\n> spec:\n>   containers:\n>   - name: app\n>     image: vg-k8s-app:1\n>     imagePullPolicy: Never\n>     volumeMounts: [{name: data, mountPath: /data}]\n>   volumes: [{name: data, emptyDir: {}}]\n> ---\n> apiVersion: v1\n> kind: Pod\n> metadata: {name: vg-k8s-crash, namespace: vg-k8s, labels: {app: vg-k8s-crash}}\n> spec:\n>   containers:\n>   - name: app\n>     image: vg-k8s-app:1\n>     imagePullPolicy: Never\n>     args: [crash]\n>     volumeMounts: [{name: data, mountPath: /data}]\n>   volumes: [{name: data, emptyDir: {}}]\n> ---\n> apiVersion: v1\n> kind: Service\n> metadata: {name: vg-k8s-ok, namespace: vg-k8s}\n> spec:\n>   selector: {app: vg-k8s-app}\n>   ports: [{port: 80, targetPort: 8080}]\n> ---\n> apiVersion: v1\n> kind: Service\n> metadata: {name: vg-k8s-empty, namespace: vg-k8s}\n> spec:\n>   selector: {app: vg-k8s-crash}\n>   ports: [{port: 80, targetPort: 8080}]\n> ---\n> apiVersion: v1\n> kind: Service\n> metadata: {name: vg-k8s-wrong, namespace: vg-k8s}\n> spec:\n>   selector: {app: vg-k8s-app}\n>   ports: [{port: 80, targetPort: 9999}]\n> ```\n>\n> **Команда в любом каталоге — после создания отдельного кластера `vg-k8s`, с kubeconfig из §21:**\n>\n> ```bash\n> printf 'scratch-root\\n' > /tmp/vg-k8s-work/root-marker\n> CGO_ENABLED=0 go build -o /tmp/vg-k8s-work/app /tmp/vg-k8s-work/main.go\n> docker build -t vg-k8s-app:1 /tmp/vg-k8s-work\n> /tmp/vg-k8s-bin/kind-linux-amd64 load docker-image vg-k8s-app:1 --name vg-k8s\n> kubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n vg-k8s apply -f /tmp/vg-k8s-work/lab.yaml\n> kubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n vg-k8s exec vg-k8s-app -c app -- sh\n> ```\n>\n> **Пример для чтения — точный конец ошибки; идентификатор неудачного exec опущен:**\n>\n> ```text\n> OCI runtime exec failed: exec failed: unable to start container process: exec: \"sh\": executable file not found in $PATH\n> ```\n>\n> Ошибка относится к запускаемой команде, а не к доступности HTTP. Сборка, загрузка и отказ — *(проверено)*.\n\n### Временный контейнер: общая сеть, выбранные процессы, отдельные файлы\n\n**Коротко**\n- Временный контейнер получает отдельную файловую систему\n- Сеть Pod общая\n- Видимость процессов зависит от выбранного пространства и среды запуска.\n\n**Короткий сценарий**\n\nDebug-контейнер видит HTTP-порт приложения, но не находит его файл /app.\n\n**Предскажи:** Противоречит ли это общей сети?\n\n> [!question]- Ответ\n> Разбор заданных условий: Нет. Общая сеть не означает общий корневой каталог.\n\n**Команда в любом каталоге — закрепить образ инструментов и открыть оболочку рядом с приложением:**\n\n```bash\nTOOLS=nicolaka/netshoot@sha256:7f08c4aff13ff61a35d30e30c5c1ea8396eac6ab4ce19fd02d5a4b3b5d0d09a2\nkubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n vg-k8s debug -it vg-k8s-app \\\n  --image=\"$TOOLS\" --target=app --container=vg-k8s-general --profile=general -- sh\n```\n\n> [!info]- Глубже\n> В опыте контейнер оставлен командой `sleep 1d`, команды ниже выполнены через `exec -c vg-k8s-general`; интерактивная форма выше — *(по документации)*, отладка работающего пода; подключение без TTY — *(проверено)*.\n>\n> | Что сравнивали | Наблюдение |\n> |---|---|\n> | Без `--target`, без `shareProcessNamespace` | `ps`: PID 1 — собственный `sh`; `/app` не виден |\n> | С `--target=app` | `ps`: PID 1 — `/app`; containerd поддержал вход в его пространство PID |\n> | Сеть в обоих случаях | `ss` видит `8080` и `8082`; без видимого PID поле владельца пустое |\n> | Файлы с `--target` | `/root-marker` отсутствует у инструментов; `/proc/1/root/root-marker` содержит `scratch-root` |\n> | Пространства имён | Сеть: оба `net:[4026532841]`; подключения ФС: `4026533574` и `4026533571` |\n>\n> Таблица — *(проверено)*. `--target` выбирает контейнер по **имени**, не переносит его корневую ФС. С `shareProcessNamespace: true` обычные и временные контейнеры видят процессы пода без `--target`;\n> в проверенной копии PID 1 — `/pause`, PID 7 — `/app`. Это поле шаблона нового пода, не переключатель живого.\n> *(проверено)* — копия ниже; *(по документации)* — [общее пространство процессов](https://kubernetes.io/docs/tasks/configure-pod-container/share-process-namespace/).\n> Пространство PID задаёт видимость, а права определяют доступ к чужим процессам и `/proc/<pid>/root`. Сигналы могут остановить приложение: не считать PID 1 всегда своим отладчиком.\n> Напоминание: [[Linux-Troubleshooting-Visual-Guide#9. Процессы: состояния, сигналы, зомби и PID 1]] и [[Linux-Troubleshooting-Visual-Guide#14. Пространства имён и cgroups: основа контейнеров]].\n>\n> **Команда в любом каталоге — места в API, где сохраняется временный контейнер:**\n>\n> ```bash\n> kubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n vg-k8s get pod vg-k8s-app \\\n>   -o jsonpath='{.spec.ephemeralContainers}{\"\\n\"}{.status.ephemeralContainerStatuses}{\"\\n\"}'\n> ```\n>\n> `spec.ephemeralContainers` хранит имя, образ, `targetContainerName`, `securityContext`; `status.ephemeralContainerStatuses` — `state`, `containerID`, `restartCount`. У завершённого отладчика\n> `state.terminated`, рестартов 0; у приложения UID и `containerID` сохранены, рестартов 0. *(проверено)*. Удалить/изменить уже добавленный контейнер нельзя, автоматически он не перезапускается.\n> Нужна новая запись с другим именем; весь Pod удаляют отдельно по его жизненному циклу. *(по документации)* — [временные контейнеры](https://kubernetes.io/docs/concepts/workloads/pods/ephemeral-containers/).\n>\n> **Пример для чтения — реальный отказ API при попытке удалить первую запись:**\n>\n> ```text\n> The Pod \"vg-k8s-app\" is invalid: spec.ephemeralContainers: Forbidden: existing ephemeral containers \"vg-k8s-isolated\" may not be removed\n> ```\n\n### Системные вызовы: сначала увидеть процесс, затем получить право трассировки\n\n**Коротко**\n- Видимость PID не равна праву трассировки\n- UID и дополнительные разрешения проверяются отдельно\n- Системный вызов показывает точку взаимодействия с ядром.\n\n**Короткий сценарий**\n\nОтладчик видит процесс, но ptrace возвращает Operation not permitted.\n\n**Предскажи:** Достаточно ли ещё раз узнать тот же PID?\n\n> [!question]- Ответ\n> Разбор заданных условий: Нет. Нужно проверить требуемые полномочия и ограничения безопасности, а не менять PID вслепую.\n\n**Команда в любом каталоге — сначала профиль без дополнительных прав трассировки:**\n\n```bash\nkubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n vg-k8s debug vg-k8s-app \\\n  --image=\"$TOOLS\" --target=app --container=vg-k8s-baseline --profile=baseline \\\n  -- sh -c 'ps -eo pid,args; timeout 3 strace -p 1 -e trace=openat'\nkubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n vg-k8s logs vg-k8s-app -c vg-k8s-baseline\n```\n\n`strace` показывает обращения процесса к ядру, `lsof` связывает дескрипторы с файлами и сокетами. Не повторяем их общий синтаксис: [[Linux-Troubleshooting-Visual-Guide#10. Дескрипторы, ограничения, lsof и strace]].\nЗдесь нужен доступ к чужому PID; для многопоточного Go-процесса добавлен `-f`.\n\n> [!info]- Глубже\n> **Пример для чтения — отказ трассировки и затем результат в контейнере `vg-k8s-general`:**\n>\n> ```text\n> strace: attach: ptrace(PTRACE_SEIZE, 1): Operation not permitted\n> strace: Process 1 attached with 5 threads\n> [pid    17] openat(AT_FDCWD, \"/config/app.yaml\", O_RDONLY|O_CLOEXEC) = -1 ENOENT (No such file or directory)\n> ```\n>\n> **Команда внутри отладочного контейнера `vg-k8s-general` — рабочая трассировка:**\n>\n> ```bash\n> id\n> grep -E 'CapEff|Seccomp|Uid' /proc/self/status\n> timeout 3 strace -f -p 1 -e trace=openat\n> ```\n>\n> В обоих случаях UID 0; совпадение пользователя не заменило `SYS_PTRACE`. В `general`: `CapEff: 00000000a80c25fb`, `Seccomp: 0`; найден отсутствующий `/config/app.yaml`.\n> `timeout` остановил наблюдение, вернув 143, `strace` отсоединился; приложение осталось работать. *(проверено)*. Если PID не виден — проверить `--target` и среду запуска; если виден, но отказано — права, UID, seccomp и LSM.\n> Одинаковый UID помогает только при допустимой трассировке и состоянии процесса; Yama может требовать\n> отношения родитель–потомок или `SYS_PTRACE`. *(по документации)* — [Yama, документация ядра](https://www.kernel.org/doc/html/latest/admin-guide/LSM/Yama.html).\n> Привилегии ядра и seccomp — разные проверки; добавление capability не отключает явно заданный seccomp. Напоминание: [[Security-Visual-Guide#6. Привилегии ядра, no-new-privileges и seccomp: три разных ограничения]].\n>\n> | Профиль kubectl 1.37.0 | Для чего и какая граница |\n> |---|---|\n> | `general` | По умолчанию; для временного контейнера добавляет `SYS_PTRACE`, не обещает обход всех ограничений |\n> | `baseline` | Без дополнительных capabilities для трассировки; наблюдали отказ `strace` |\n> | `restricted` | Убирает capabilities, задаёт `runAsNonRoot`, запрет эскалации, `RuntimeDefault`; не профиль для ptrace |\n> | `netadmin` | Добавляет `NET_ADMIN` и `NET_RAW` для сетевых инструментов; не добавляет `SYS_PTRACE` |\n> | `sysadmin` | `privileged: true`; широкий доступ, в опыте только для собственного узла kind |\n>\n> *(по документации)* — [реализация профилей kubectl v0.37.0](https://raw.githubusercontent.com/kubernetes/kubectl/v0.37.0/pkg/cmd/debug/profiles.go);\n> `general`, `baseline`, `netadmin`, `sysadmin` запущены; `restricted` принят, но его процесс не стартовал. *(проверено)*. Образ netshoot объявляет пользователя строкой `root`: kubelet сообщил\n> `container has runAsNonRoot and image has non-numeric user (root), cannot verify user is non-root`, причина `CreateContainerConfigError`. Для restricted нужен проверенный образ/числовой непривилегированный UID;\n> исправленный запуск здесь — *(не проверено)*. Профили относятся к **клиенту** kubectl: сверять его `debug --help`, а не переносить старое значение `legacy` из примера документации на эту версию.\n\n### Сеть изнутри пода: порт, DNS, получатель и пакеты\n\n**Коротко**\n- Порт, DNS и пакеты отвечают на разные вопросы\n- Service может вести не на тот targetPort\n- Сначала нужно связать адреса конкретного запроса.\n\n**Короткий сценарий**\n\nПроцесс слушает 8080, Service отправляет на 9999.\n\n**Предскажи:** Исправит ли успешный DNS неверный targetPort?\n\n> [!question]- Ответ\n> Разбор заданных условий: Нет. Имя разрешается, но получатель порта выбран неверно.\n\n**Команда внутри отладочного контейнера `vg-k8s-general` — разделить три проверки:**\n\n```bash\nss -ltnp\ndig +short vg-k8s-ok.vg-k8s.svc.cluster.local\ncurl -sS --max-time 2 http://vg-k8s-ok\ncurl -sS --max-time 2 http://vg-k8s-empty\ncurl -sS --max-time 2 http://vg-k8s-wrong\ncurl -sS --max-time 2 http://127.0.0.1:8082\n```\n\n`ss -ltnp` проверяет слушающий адрес, DNS-запрос — имя, `curl` — соединение и ответ протокола. ClusterIP и порт Service отличаются от адреса пода и `targetPort`; наличие DNS не доказывает готовый endpoint.\nНапоминание: [[Linux-Troubleshooting-Visual-Guide#15. Сеть: слушающие порты и смысл ошибок]] и [[Networking-Visual-Guide#19. Kubernetes: адрес пода, виртуальный Service и реальные получатели]].\n\n> [!info]- Глубже\n> **Пример для чтения — выбранные точные строки нового запуска:**\n>\n> ```text\n> LISTEN 0      4096               *:8080            *:*    users:((\"app\",pid=1,fd=4))\n> 10.96.166.152\n> ok\n> curl: (7) Failed to connect to vg-k8s-empty port 80 after 1003 ms: Could not connect to server\n> curl: (7) Failed to connect to vg-k8s-wrong port 80 after 2 ms: Could not connect to server\n> curl: (56) Recv failure: Connection reset by peer\n> ```\n>\n> EndpointSlice первого ошибочного Service содержал `ready: false`, второго — `ready: true` и порт `9999`. Два разных дефекта дают один класс ошибки клиента; проверить адреса и готовность до изменения сети. *(проверено)*.\n>\n> **`deny.yaml` в `/tmp/vg-k8s-work` — полный запрет исходящих соединений, кроме DNS:**\n>\n> ```yaml\n> apiVersion: networking.k8s.io/v1\n> kind: NetworkPolicy\n> metadata: {name: vg-k8s-deny, namespace: vg-k8s}\n> spec:\n>   podSelector: {matchLabels: {app: vg-k8s-app}}\n>   policyTypes: [Egress]\n>   egress:\n>   - ports:\n>     - {protocol: UDP, port: 53}\n>     - {protocol: TCP, port: 53}\n> ```\n>\n> **Команда в любом каталоге — контейнер для захвата и включение политики:**\n>\n> ```bash\n> kubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n vg-k8s debug vg-k8s-app \\\n>   --image=\"$TOOLS\" --target=app --container=vg-k8s-network --profile=netadmin -- sleep 1d\n> kubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n vg-k8s apply -f /tmp/vg-k8s-work/deny.yaml\n> ```\n>\n> **Команда внутри отладочного контейнера `vg-k8s-network` — захват на интерфейсе пода:**\n>\n> ```bash\n> timeout 5 tcpdump -ni eth0 -c 3 tcp > /tmp/policy.packets 2>&1 & t=$!\n> sleep 1\n> dig +short vg-k8s-ok.vg-k8s.svc.cluster.local\n> curl -sS --connect-timeout 3 --max-time 4 http://vg-k8s-ok\n> wait \"$t\"\n> cat /tmp/policy.packets\n> ```\n>\n> **Пример для чтения — DNS работает, ответа на три SYN нет; строки захвата приведены целиком:**\n>\n> ```text\n> 10.96.166.152\n> curl: (28) Connection timed out after 3002 milliseconds\n> 11:32:59.077297 IP 10.244.1.2.47308 > 10.96.166.152.80: Flags [S], seq 586176593, win 42340, options [mss 1460,sackOK,TS val 1598642578 ecr 0,nop,wscale 9], length 0\n> 11:33:00.112702 IP 10.244.1.2.47308 > 10.96.166.152.80: Flags [S], seq 586176593, win 42340, options [mss 1460,sackOK,TS val 1598643614 ecr 0,nop,wscale 9], length 0\n> 11:33:01.137689 IP 10.244.1.2.47308 > 10.96.166.152.80: Flags [S], seq 586176593, win 42340, options [mss 1460,sackOK,TS val 1598644639 ecr 0,nop,wscale 9], length 0\n> ```\n>\n> На этом стенде `kindnetd:v20260820-69b56db7` **применяет NetworkPolicy**: запрет дал тайм-аут, после удаления политики HTTP снова дал `ok`. *(проверено)*. Здесь не требовалась установка другого CNI.\n> Перед повторением удалить политику через `kubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n vg-k8s delete -f /tmp/vg-k8s-work/deny.yaml`.\n> Без разрешения DNS первый вариант запрета дал `curl: (28) Resolving timed out after 2001 milliseconds`. Для `vg-k8s-wrong` тот же захват с `-c 4` получил SYN → SYN после трансляции → RST → RST клиенту;\n> для рабочего Service с `-c 3` третий пакет — SYN-ACK (`Flags [S.]`). *(проверено)*.\n> **Пример для чтения — ответ закрытого порта из захвата:**\n>\n> ```text\n> 11:34:33.930659 IP 10.244.1.2.9999 > 10.244.1.1.33615: Flags [R.], seq 0, ack 2968960123, win 0, length 0\n> 11:34:33.930670 IP 10.96.238.53.80 > 10.244.1.2.35022: Flags [R.], seq 0, ack 2968960123, win 0, length 0\n> ```\n>\n> Отказ на SYN — соединение не установлено; тайм-аут — ожидаемого ответа нет; reset после запроса — поток оборван. Сам текст ошибки не называет виновный компонент: [[Networking-Visual-Guide#7. Ошибки клиента: симптом и источник решения]].\n> `tcpdump` показывает пакеты в точке захвата; `traceroute` проверяет ответы на пробы, не заменяет захват.\n> Напоминание: [[Linux-Troubleshooting-Visual-Guide#16. traceroute и tcpdump: увидеть путь и факт обмена]].\n\n### Падает раньше подключения: исследовать копию\n\n**Коротко**\n- Копия Pod помогает исследовать быстрый отказ\n- Команда копии должна существовать в её образе\n- Копирование объекта не устанавливает инструменты.\n\n**Короткий сценарий**\n\nИсходный образ scratch содержит только /app. Копию пытаются удержать командой sleep.\n\n**Предскажи:** Запустится ли sleep без добавления другого образа?\n\n> [!question]- Ответ\n> Разбор заданных условий: Нет. API может принять копию, но runtime не найдёт executable.\n\n**Команда в любом каталоге — сначала ошибочная копия, затем копия с заменой образа:**\n\n```bash\nkubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n vg-k8s debug vg-k8s-crash \\\n  --copy-to=vg-k8s-copy-fails --container=app -- sleep 1d\nkubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n vg-k8s debug vg-k8s-crash \\\n  --copy-to=vg-k8s-copy --container=app --set-image=\"app=$TOOLS\" --share-processes -- sleep 1d\nkubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n vg-k8s events --for pod/vg-k8s-copy-fails --types=Warning\n```\n\n> [!info]- Глубже\n> **Пример для чтения — точный конец ошибки контейнерной среды:**\n>\n> ```text\n> exec: \"sleep\": executable file not found in $PATH\n> ```\n>\n> Копирование API прошло, первая копия получила `RunContainerError`; в `scratch` нет и `sleep`.\n> Во второй копии `app` — контейнер инструментов, она `Running`: исходный Go-процесс уже не воспроизводится.\n> У исходного пода наблюдались `CrashLoopBackOff`, завершение `Error`, код 3. *(проверено)*.\n> Чтобы сохранить приложение, можно добавить инструменты в копию, а не заменить его образ.\n>\n> **Команда в любом каталоге — копия с двумя контейнерами и общим пространством PID:**\n>\n> ```bash\n> kubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n vg-k8s debug vg-k8s-app \\\n>   --copy-to=vg-k8s-shared --container=vg-k8s-tools --image=\"$TOOLS\" --share-processes -- sleep 1d\n> kubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n vg-k8s exec vg-k8s-shared -c vg-k8s-tools -- ps -eo pid,args\n> ```\n>\n> В ней без `--target` видны `/pause` (PID 1), `/app` (PID 7), `sleep 1d` (PID 24). *(проверено)*.\n> Копии получили новый UID/IP, метки удалены; Service их не выбирает. Все попали на `vg-k8s-worker`,\n> но это не гарантия: `--same-node` здесь не задавался. Общий PID включён через `--share-processes`.\n> Описание томов скопировано: `emptyDir` новый, его содержимое не копируется. В исходном `/data/marker`\n> через `/proc/1/root` записано `changed`, у новой работающей копии прочитано `original`. *(проверено)*.\n> PVC может остаться ссылкой на **тот же** claim; содержимое памяти и состояние погибшего процесса не копируются.\n> `--keep-labels` может направить реальный Service-трафик в копию; init-контейнеры и пробы сверять по опциям.\n> *(по документации)* — [справочник kubectl debug](https://kubernetes.io/docs/reference/kubectl/generated/kubectl_debug/).\n\n### С узла: CRI, корень узла и вход в отдельное пространство имён\n\n**Коротко**\n- Отладка узла имеет более широкую область доступа\n- chroot меняет корень файлов, а не все пространства имён\n- nsenter выбирает конкретное пространство процесса.\n\n**Короткий сценарий**\n\nПосле chroot /host команда всё ещё использует прежнее сетевое пространство.\n\n**Предскажи:** Должен ли chroot автоматически показать сеть нужного Pod?\n\n> [!question]- Ответ\n> Разбор заданных условий: Нет. Для сети нужен отдельный вход в соответствующее пространство; это текстовый разбор, привилегированная отладка не выполнялась.\n\n**Команда в любом каталоге — только узел своего одноразового кластера:**\n\n```bash\nkubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n vg-k8s debug node/vg-k8s-worker \\\n  --image=\"$TOOLS\" --profile=sysadmin -- sleep 1d\n```\n\n> [!info]- Глубже\n> Создан `node-debugger-vg-k8s-worker-gjdfp`; интерактивный вариант — добавить `-it` и заменить `sleep 1d` на `sh`.\n> В опыте вход — через `exec` в `debugger`. `/host` — корень **контейнера узла kind**, не корень машины владельца.\n> С узлом совпали пространства PID, сети и IPC; пространство подключений ФС осталось отдельным. *(проверено)*.\n> `chroot /host` меняет корень путей, не входит сам по себе в другие пространства имён.\n>\n> **Команда внутри отладочного контейнера узла — найти нужный контейнер и перейти к инструментам узла:**\n>\n> ```bash\n> chroot /host crictl ps\n> chroot /host crictl inspect -o json c7a6edaa4cdd0 > /tmp/container.json\n> chroot /host crictl logs --tail=2 c7a6edaa4cdd0\n> chroot /host journalctl -u kubelet -u containerd -n 3 --no-pager\n> ```\n>\n> Для оболочки узла — `chroot /host`; здесь каждая команда отдельно использует его корень и утилиты.\n> В JSON читать `info.pid`, разбор в опыте сделан снаружи. `crictl ps` сопоставил имя, Pod и namespace, `inspect` дал PID **927**,\n> `logs` — `open /config/app.yaml: no such file or directory`. *(проверено)*.\n> CRI endpoint узла: `unix:///run/containerd/containerd.sock` из `/etc/crictl.yaml`.\n> Kubelet и containerd — активные службы systemd; логи прочитаны через журнал, логи приложения — в `/var/log/pods/.../app/0.log`.\n> Путей `/var/log/kubelet.log` и `/var/log/containerd.log` нет: `No such file or directory`. *(проверено)*.\n>\n> **Команда внутри отладочного контейнера узла — после выхода из chroot, PID из inspect:**\n>\n> ```bash\n> nsenter -t 927 -n ss -ltnp\n> nsenter -t 927 -m /bin/sh\n> nsenter -t 927 -m /app crash\n> nsenter -t 927 -p sh -c 'grep NSpid /proc/self/status'\n> cat /proc/927/root/root-marker\n> ```\n>\n> `-n`: видны `8080`/`8082`, владелец `/app`, узловой PID 927.\n> `-m`: `/bin/sh` снова отсутствует — `nsenter: failed to execute /bin/sh: No such file or directory`;\n> статический `/app crash` запустился и вернул код 3. Можно читать через `/proc/927/root`, не требуя shell внутри цели.\n> `-p`: у новой оболочки `NSpid: 2243 118`; без `-m` и нового подключения `/proc` команды `ps` могут видеть узловой список.\n> Числа PID здесь привязаны к этому запуску: всегда получать их заново. *(проверено)*.\n> В `general` узловой `chroot` **сработал**, но `nsenter -n` отказал:\n> `nsenter: reassociate to namespaces failed: Operation not permitted`. Непривилегированный не означает «без любых capabilities».\n> *(проверено)*; назначение режима узловой отладки — *(по документации)*, [отладка узла](https://kubernetes.io/docs/tasks/debug/debug-cluster/kubectl-node-debug/).\n> Завершённый узловой отладчик `node-debugger-vg-k8s-worker-pnhx6` остался `Failed`, рестартов 0.\n> Выход из оболочки не удаляет объект; оба узловых пода удалены вручную. *(проверено)*.\n> **Команда в любом каталоге — удалить ровно созданные узловые поды:**\n>\n> ```bash\n> kubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n vg-k8s delete pod \\\n>   node-debugger-vg-k8s-worker-gjdfp node-debugger-vg-k8s-worker-pnhx6\n> ```\n\n### Соседние способы и граница полномочий\n\n**Коротко**\n- Инструмент выбирают под наблюдаемый слой\n- Права должны соответствовать требуемой операции\n- Более широкий профиль не заменяет доказательство причины.\n\n**Короткий сценарий**\n\nДля чтения прежних логов контейнера предлагают сразу привилегированный debug узла.\n\n**Предскажи:** Нужен ли он для этого конкретного первого шага?\n\n> [!question]- Ответ\n> Разбор заданных условий: Нет. Сначала достаточно разрешённого чтения logs --previous; широкие права нужны только для обоснованной следующей операции.\n\n- Контейнер с инструментами рядом с приложением, sidecar, полезен при регулярной диагностике или без API временных контейнеров.\n  Его добавляют в шаблон с новым Pod; общую ФС дают томом. Пример проекта — *(по документации)*, [netshoot](https://github.com/nicolaka/netshoot).\n- `kubectl exec -c <tools>` входит в уже работающий контейнер инструментов. С `shareProcessNamespace: true`\n  он видит приложение; проверенная копия выше показывает этот вариант. *(проверено)*.\n- `kubectl port-forward pod/vg-k8s-app 18080:8080` с отдельным kubeconfig дал `ok` на `127.0.0.1:18080`.\n  Это путь через API/kubelet к Pod, успех не проверяет DNS/ClusterIP и обычный клиентский маршрут. *(проверено)*.\n- `kubectl cp` запускает `tar` в целевом контейнере: наш отказ — `exec: \"tar\": executable file not found in $PATH`.\n  Читать через инструменты и `/proc/<pid>/root`; устройство `cp` — *(по документации)*, [kubectl cp](https://kubernetes.io/docs/reference/kubectl/generated/kubectl_cp/); отказ — *(проверено)*.\n- `kubectl logs --previous -c app` выбирает завершённый экземпляр. Здесь два запроса не дали его логов,\n  дальнейшие повторы остановлены; текущие логи и CRI доступны. Точный текст и граница — §21.\n- `kubectl events --for pod/<name>` и `describe pod` показывают отказ запуска/BackOff, а не системные вызовы.\n  Оба применены к ошибочной копии/падающему поду. *(проверено)*.\nДля ephemeral нужны `get` Pod и `patch`/`update` **`pods/ephemeralcontainers`**; attach/exec требуют своих прав.\nСоздание копии и узлового отладчика требует `create pods`; узловому Pod дополнительно нужен допуск host-доступа.\n*(по документации)* — [RBAC](https://kubernetes.io/docs/reference/access-authn-authz/rbac/) и отладка узла.\n`auth can-i patch pods/ephemeralcontainers`: у администратора `yes`, у default ServiceAccount `no`. *(проверено)*.\nPSA проверяет и временные контейнеры: при `baseline:v1.37` наш `general` запрещён за добавленные capabilities;\nузловой `sysadmin` — за `hostNetwork`, `hostPID`, `hostIPC`, `hostPath`, `privileged`. При `restricted:v1.37`\nтакже получен отказ. Метка enforce не остановила уже существующие процессы. *(проверено)*.\n**Пример для чтения — точная часть отказа допуска узлового пода:**\n\n> [!info]- Глубже\n> ```text\n> violates PodSecurity \"baseline:v1.37\": host namespaces (hostNetwork=true, hostPID=true, hostIPC=true), hostPath volumes (volume \"host-root\"), privileged (container \"debugger\" must not set securityContext.privileged=true)\n> ```\n>\n> Профиль `restricted` не исправляет остальные небезопасные контейнеры уже существующего Pod.\n> Напоминание: [[Security-Visual-Guide#14. Pod Security и собственный допуск: отказы на разных свойствах]].\n> Привилегированный узловой Pod с корнем/пространствами узла означает полномочия полного захвата узла:\n> доступ к CRI, другим контейнерам и секретам. Это техническая граница; выдавать права на конкретный инцидент.\n> Фиксировать оператора, цель, образ/digest, профиль, время и причину; API audit должен сохранять операции\n> с `pods/ephemeralcontainers`, созданием Pod и attach/exec. Он не заменяет запись команд внутри shell.\n> *(по документации)* — [аудит Kubernetes](https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/); настройка аудита здесь — *(не проверено)*.\n> Образы инструментов брать из контролируемого реестра, проверять происхождение и уязвимости, закреплять digest,\n> не `latest`; не оставлять инструменты и захваты с секретами в production. Это рекомендуемая практика, не прогон реестра.\n>\n> | Симптом | Первый инструмент | Следующий инструмент |\n> |---|---|---|\n> | Нет shell, процесс жив | `logs`, `describe` | `debug --target`, затем `ps`/`ss` |\n> | Процесс виден, ptrace запрещён | UID, capabilities, seccomp | Разрешённый профиль и `strace -f -p` |\n> | Конфигурация не читается | Логи с путём | `/proc/<pid>/root`, `strace` с `openat` |\n> | Имя Service не находится | `dig`, `/etc/resolv.conf` | События DNS, захват UDP/TCP 53 |\n> | DNS есть, отказ TCP | EndpointSlice и `ss` | `curl`, `tcpdump`: SYN/RST или повторы |\n> | Нет времени подключиться | `logs --previous`, `lastState` | `debug --copy-to`, при необходимости `--set-image` |\n> | Несколько подов узла сломаны | Node conditions, события | Узловой `debug`, CRI, журнал kubelet/containerd |\n>\n> **Предскажи:** в захвате есть три SYN к `10.96.166.152:80`, DNS вернул этот адрес, SYN-ACK нет.\n> Это доказывает, что Go-процесс не слушает `8080`?\n>\n> > [!question]- Ответ\n> > Нет. В реальном опыте он слушал, Service имел готовый endpoint; ответ блокировала исходящая NetworkPolicy.\n> > Её удаление вернуло `ok`. Захват на клиенте показывает отсутствие ответа здесь, но не саму точку отбрасывания. *(проверено)*.\n>\n> **Короткий ответ на английском — под без оболочки:**\n>\n> > I check logs and events first. I add an ephemeral container with a trusted tools image and target the app container.\n> > It shares the Pod network; process access depends on the runtime and permissions. I can read the app files through `/proc/<pid>/root`.\n> > I use the smallest allowed debug profile and do not rebuild the running image just to add a shell.\n>\n> **Короткий ответ на английском — CrashLoopBackOff:**\n>\n> > I check previous logs, events and the last exit reason. If the app stops too fast, I create a separate debug copy.\n> > I change its command or use a tools image; `sleep` will not work if it is missing from the original image.\n> > The copy has new process state and may have new volume data, so I compare it with the original Pod.\n"
source_hash: f6ba864d3c95f74a2675e5a61a07584d20193f5209951678875dd84d0f2e6455
