heading: '20. Troubleshooting: move from an observation to the failing layer'
text: "## 20. Troubleshooting: move from an observation to the failing layer\n\n**At a glance**\n- Start diagnosis with the observed failure\n- The same symptom can have different causes\n- The first step should distinguish between hypotheses.\n\n**Short scenario**\n\nAn HTTP request fails, but the DNS response, endpoint and listening port are still unknown.\n\n**Predict:** Is restarting the Deployment immediately enough?\n\n> [!question]- Answer\n> Analysis of the given conditions: No. This action does not identify the failing layer and can destroy useful evidence.\n\n> [!info] Core and reference\n> The core approach to a case: symptom → layer → one next check → its limits. Each subsection is a separate case; there is no need to repeat the mechanisms in §3–14 in sequence. Full walkthroughs and §21 are reference material.\n\n### Start with the symptom\n\n**At a glance**\n- The symptom determines where to check first\n- Events show the stage at which progress stopped\n- Process logs are useful only after the process starts.\n\n**Short scenario**\n\nThe Pod has no nodeName, and its PodScheduled condition is False.\n\n**Predict:** Does it make sense to start with application logs?\n\n> [!question]- Answer\n> Analysis of the given conditions: First investigate scheduling using conditions and events: the process may not have started yet.\n\n| Symptom | Standalone case | Mechanism |\n|---|---|---|\n| Image did not load | [[#Полный пример ошибки загрузки образа|ImagePullBackOff]] | §3: container state |\n| Process was killed | [[#Полный пример превышения памяти|OOM]] | §9: memory |\n| Service does not respond | [[#Не сводить сетевую диагностику к тексту одной ошибки|Networking]] | §10: conditions |\n| No shell | [[#Как добраться до процесса без оболочки|Access to the process]] | [[Containers-Visual-Guide|process isolation]] |\n\n### Locate the failure before making changes\n\n**At a glance**\n- Determine the scope first\n- Then read the state of the specific Pod\n- Any change should address a confirmed cause.\n\n**Mini-example:** only in the disposable kind cluster prepared above. Create the namespace with `kubectl --kubeconfig /tmp/guides-order-rest.kubeconfig --context kind-guides-order-rest create namespace guide-mini-66`. Save the listing as `mini.sh`; run it with `bash -e mini.sh`.\n\n```bash\nk() { kubectl --kubeconfig /tmp/guides-order-rest.kubeconfig --context kind-guides-order-rest -n guide-mini-66 \"$@\"; }\nk run once --image=nginx:1.29-alpine --image-pull-policy=Never --restart=Never --command -- sh -c 'echo diagnostic; exit 3'\nk wait --for=jsonpath='{.status.phase}'=Failed pod/once --timeout=90s\nk logs once\nk get pod once -o jsonpath='{.status.containerStatuses[0].state.terminated.exitCode}{\"\\n\"}'\n```\n\n**Predict:** What will the last command show after the preceding commands finish?\n\n> [!question]- Answer\n> Actual command stdout:\n>\n> ```text\n> pod/once created\n> pod/once condition met\n> diagnostic\n> 3\n> ```\n>\n> Exit code: 0.\n\nThe process started, printed diagnostic, then returned 3. This differs from a scheduling failure or an image pull failure.\n\n**Commands in any directory — the minimum evidence for Pod `crash`:**\n\n```bash\nkubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s \\\n  -n vg-k8s get pods -o wide\nkubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s \\\n  -n vg-k8s describe pod crash\nkubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s \\\n  -n vg-k8s logs crash -c app --previous\nkubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s \\\n  -n vg-k8s get events --field-selector involvedObject.name=crash --sort-by=.lastTimestamp\n```\n\nFirst determine the scope: one container, one Pod, one Deployment version, one node, or the whole cluster.\nCheck whether a node has been assigned; then check environment/container preparation, readiness, Service backends, and the network path.\nSave previous logs and events before restarting: a new run can hide the cause.\nThis sequence is an engineering method based on\n[debugging Pods](https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/) and\n[debugging Services](https://kubernetes.io/docs/tasks/debug/debug-application/debug-service/). *(according to documentation)*.\n\n> [!info]- Deeper explanation\n> **Diagram to read — one symptom can have several root causes:**\n>\n> ```mermaid\n> flowchart TD\n>     A[\"Application<br/>unavailable\"] --> B[\"Does a Pod exist?\"]\n>     B -->|\"No\"| C[\"ReplicaSet<br/>events: quota<br/>or admission\"]\n>     B -->|\"Yes\"| D[\"Is there<br/>an assigned<br/>node?\"]\n>     D -->|\"No\"| E[\"FailedScheduling:<br/>§8 and PVC\"]\n>     D -->|\"Yes\"| F[\"Is the container<br/>running?\"]\n>     F -->|\"No\"| G[\"Image,<br/>configuration,<br/>volume, CNI\"]\n>     F -->|\"Yes\"| H[\"Ready?\"]\n>     H -->|\"No\"| I[\"Probes and<br/>application\"]\n>     H -->|\"Yes\"| J[\"EndpointSlice,<br/>port, DNS,<br/>policy\"]\n> ```\n>\n> `-o wide` adds the IP/node; events connect the failure to a component;\n> `--previous` reads the terminated instance. In a distroless image, the absence of a shell is not an application\n> failure: use an ephemeral debug container with the required permissions/image.\n> Full example: [[K8s-Debug-Distroless-Images]].\n> The original run did not start ephemeral containers; a separate run is described below.\n\n### Five essential branches and node-wide scope\n\n**At a glance**\n- Distinguish scheduling, images, processes, memory and networking\n- Node-level scope helps identify a shared cause\n- One container error does not prove the entire node has failed.\n\n**Short scenario**\n\nDifferent applications fail on just one node; they work on the others.\n\n**Predict:** Which area should you investigate next?\n\n> [!question]- Answer\n> Analysis of the given conditions: The shared node: its conditions, runtime, resources and networking components, keeping each check tied to specific observations.\n\n| Symptom | First question | Evidence → next step |\n|---|---|---|\n| `Pending`, no `nodeName` | Which nodes were excluded? | `FailedScheduling` → requests, taints, affinity, PVC (§8/11) |\n| `Pending`, node assigned | What has not been prepared? | `FailedMount`, `FailedCreatePodSandBox`, Secret/image failure |\n| `CrashLoopBackOff` | Who terminated the process? | Previous logs, `lastState`, exit code/reason, liveness/OOM (§3/4/9) |\n| `ImagePullBackOff` | Does the image exist and is it accessible? | Registry/DNS/TLS/auth/tag event; imagePullSecrets (§3, [[Containers-Visual-Guide]]) |\n| `Running`, not Ready | Why is readiness failing? | 404/timeout event; listening address/port; dependency (§4) |\n| Service has no backends | Selector or readiness? | No addresses → labels; addresses not ready → probes (§10) |\n| Several Pods on one node fail | Is the node accessible? | Node conditions, kubelet/CRI, disk/memory, network |\n\n> [!info]- Deeper explanation\n> The table combines public debugging sources and new experiments; specific errors that were not reproduced are marked\n> in their respective sections. A node failure in this session was *(not tested)*.\n\n### Full image-pull failure example\n\nThe short route above defines the mechanism and next check. Full listing and observations: [[#Справочный рецепт — Полный пример ошибки загрузки образа|reference recipe]].\n\n### Full memory-limit example\n\nThe short route above defines the mechanism and next check. Full listing and observations: [[#Справочный рецепт — Полный пример превышения памяти|reference recipe]].\n\n### Do not reduce network troubleshooting to one error message\n\n**At a glance**\n- Error text guides the investigation\n- DNS, connections and application responses are different stages\n- A timeout does not identify a single cause.\n\n**Short scenario**\n\nDNS returned an address; the client sent a SYN and received no response.\n\n**Predict:** Does this prove that the application is not listening?\n\n> [!question]- Answer\n> Analysis of the given conditions: No. The path or filtering may be responsible; independently check the listening port and observe packets.\n\n**Output from an older client — a recorded NetworkPolicy/Cilium run to read:**\n\n> [!info]- Deeper explanation\n> ```text\n> wget: bad address 'web'\n> wget: download timed out\n> ```\n>\n> This is a **recorded run** from [[Kubernetes-Coding-Drills-Solutions#3 — NetworkPolicy]]:\n> in the first case, the policy also blocked DNS; in the second, DNS was allowed but the path to the application was blocked.\n> In another environment these messages may have different causes; confirm them with a separate DNS query,\n> EndpointSlice, a connection to the port, and observations from the networking implementation.\n> The original run did not include new packet-drop or DNS-failure experiments; a separate run appears below.\n>\n> Do not apply the old claim that “policy always sees targetPort after DNAT” unconditionally:\n> for Service address/port translation, ordering relative to network policy depends on the implementation.\n> Design and test the rule on the specific CNI, allowing DNS over UDP/TCP separately.\n> *(according to documentation)* — [NetworkPolicy and NAT](https://kubernetes.io/docs/concepts/services-networking/network-policies/).\n>\n> **Predict:** a Pod has `lastState: Completed, exitCode: 0`, but its restart count keeps growing. Is the application definitely healthy?\n>\n> > [!question]- Answer\n> > No. In the new experiment, kubelet stopped nginx because of a liveness 404, and nginx exited with code 0.\n> > The `failed liveness probe, will be restarted` event identifies who initiated the stop.\n> > *(verified)* — §4.\n>\n> **Short answer in English:**\n>\n> > I first find the failing layer. Pending without a node is different from waiting for an image on a selected node.\n> > I compare events, previous logs and termination reasons. I change the manifest only after I have evidence for the cause.\n\n### Reaching a process that has no shell\n\n**At a glance**\n- A minimal image may have no shell\n- A failed exec sh does not prove an application failure\n- Add debugging tools separately.\n\n**Short scenario**\n\nThe application's HTTP endpoint responds, but exec sh returns executable not found.\n\n**Predict:** Should you consider the container down?\n\n> [!question]- Answer\n> Analysis of the given conditions: No. The requested executable is missing; the application may still be working.\n\n**`main.go` in `/tmp/vg-k8s-work` — complete source of the learning application:**\n\n```go\npackage main\nimport(\"fmt\";\"net\";\"net/http\";\"os\";\"time\")\nfunc main(){\n if len(os.Args)>1 && os.Args[1]==\"crash\" { _,e:=os.ReadFile(\"/config/app.yaml\");fmt.Println(e);os.Exit(3) }\n os.WriteFile(\"/data/marker\",[]byte(\"original\\n\"),0600)\n go func(){for{_,e:=os.ReadFile(\"/config/app.yaml\");if e!=nil{fmt.Println(e)};time.Sleep(time.Second)}}()\n go func(){l,e:=net.Listen(\"tcp\",\":8082\");if e!=nil{panic(e)};for{c,e:=l.Accept();if e!=nil{continue};go func(c net.Conn){b:=make([]byte,1024);c.Read(b);c.(*net.TCPConn).SetLinger(0);c.Close()}(c)}}()\n http.HandleFunc(\"/\",func(w http.ResponseWriter,r *http.Request){fmt.Fprintln(w,\"ok\")})\n panic(http.ListenAndServe(\":8080\",nil))\n}\n```\n\n**`Dockerfile` in `/tmp/vg-k8s-work` — complete file; adjacent `root-marker` contains the string `scratch-root`:**\n\n```dockerfile\nFROM scratch\nCOPY app /app\nCOPY root-marker /root-marker\nUSER 0\nENTRYPOINT [\"/app\"]\n```\n\nThe following experiments were run separately from the previous ones: kind **0.33.0**, Kubernetes and kubectl **1.37.0**, kind-node containerd **2.3.4**, `crictl 1.36.0`; one control-plane and one worker node. *(verified)*.\nEphemeral containers have been stable since Kubernetes 1.25; custom `--custom` profiles since 1.32. *(according to documentation)* — [debugging a running Pod](https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/).\n§2–5 cover states and probes; here we bring a tool to the process. A static program in `scratch` reproduces the same lack of tools as distroless:\nthere is no shell, but the application runs. Rebuilding the application image with a shell changes the artifact under investigation, requires replacing the Pod, and expands the production image. It is unnecessary for observing the current process.\n\n> [!info]- Deeper explanation\n> UID 0 is used here to compare tracing permissions; it is not the recommended user for a real application. `8080` serves HTTP, `8082` intentionally resets the connection after reading the request; the configuration file is absent.\n>\n> **`lab.yaml` in `/tmp/vg-k8s-work` — complete object set for the additional exercise:**\n>\n> ```yaml\n> apiVersion: v1\n> kind: Namespace\n> metadata: {name: vg-k8s}\n> ---\n> apiVersion: v1\n> kind: Pod\n> metadata: {name: vg-k8s-app, namespace: vg-k8s, labels: {app: vg-k8s-app}}\n> spec:\n>   containers:\n>   - name: app\n>     image: vg-k8s-app:1\n>     imagePullPolicy: Never\n>     volumeMounts: [{name: data, mountPath: /data}]\n>   volumes: [{name: data, emptyDir: {}}]\n> ---\n> apiVersion: v1\n> kind: Pod\n> metadata: {name: vg-k8s-crash, namespace: vg-k8s, labels: {app: vg-k8s-crash}}\n> spec:\n>   containers:\n>   - name: app\n>     image: vg-k8s-app:1\n>     imagePullPolicy: Never\n>     args: [crash]\n>     volumeMounts: [{name: data, mountPath: /data}]\n>   volumes: [{name: data, emptyDir: {}}]\n> ---\n> apiVersion: v1\n> kind: Service\n> metadata: {name: vg-k8s-ok, namespace: vg-k8s}\n> spec:\n>   selector: {app: vg-k8s-app}\n>   ports: [{port: 80, targetPort: 8080}]\n> ---\n> apiVersion: v1\n> kind: Service\n> metadata: {name: vg-k8s-empty, namespace: vg-k8s}\n> spec:\n>   selector: {app: vg-k8s-crash}\n>   ports: [{port: 80, targetPort: 8080}]\n> ---\n> apiVersion: v1\n> kind: Service\n> metadata: {name: vg-k8s-wrong, namespace: vg-k8s}\n> spec:\n>   selector: {app: vg-k8s-app}\n>   ports: [{port: 80, targetPort: 9999}]\n> ```\n>\n> **Command in any directory — after creating the separate `vg-k8s` cluster, with kubeconfig from §21:**\n>\n> ```bash\n> printf 'scratch-root\\n' > /tmp/vg-k8s-work/root-marker\n> CGO_ENABLED=0 go build -o /tmp/vg-k8s-work/app /tmp/vg-k8s-work/main.go\n> docker build -t vg-k8s-app:1 /tmp/vg-k8s-work\n> /tmp/vg-k8s-bin/kind-linux-amd64 load docker-image vg-k8s-app:1 --name vg-k8s\n> kubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n vg-k8s apply -f /tmp/vg-k8s-work/lab.yaml\n> kubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n vg-k8s exec vg-k8s-app -c app -- sh\n> ```\n>\n> **Example to read — exact end of the error; the failed exec identifier is omitted:**\n>\n> ```text\n> OCI runtime exec failed: exec failed: unable to start container process: exec: \"sh\": executable file not found in $PATH\n> ```\n>\n> The error concerns the command being launched, not HTTP availability. Build, load, and failure were *(verified)*.\n\n### Ephemeral container: shared network, selected processes, separate files\n\n**At a glance**\n- An ephemeral container has a separate filesystem\n- The Pod's network is shared\n- Process visibility depends on the selected namespace and runtime environment.\n\n**Short scenario**\n\nThe debug container sees the application's HTTP port but cannot find its /app file.\n\n**Predict:** Does this contradict the shared network?\n\n> [!question]- Answer\n> Analysis of the given conditions: No. A shared network does not imply a shared root directory.\n\n**Command in any directory — pin the tools image and open a shell beside the application:**\n\n```bash\nTOOLS=nicolaka/netshoot@sha256:7f08c4aff13ff61a35d30e30c5c1ea8396eac6ab4ce19fd02d5a4b3b5d0d09a2\nkubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n vg-k8s debug -it vg-k8s-app \\\n  --image=\"$TOOLS\" --target=app --container=vg-k8s-general --profile=general -- sh\n```\n\n> [!info]- Deeper explanation\n> In the experiment, the container was kept alive with `sleep 1d`, and the following commands ran through `exec -c vg-k8s-general`; the interactive form above is *(according to documentation)*, debugging a running Pod; connecting without a TTY was *(verified)*.\n>\n> | Comparison | Observation |\n> |---|---|\n> | Without `--target`, without `shareProcessNamespace` | `ps`: PID 1 is its own `sh`; `/app` is not visible |\n> | With `--target=app` | `ps`: PID 1 is `/app`; containerd supported entering its PID namespace |\n> | Network in both cases | `ss` sees `8080` and `8082`; without a visible PID the owner field is empty |\n> | Files with `--target` | `/root-marker` is absent in the tools container; `/proc/1/root/root-marker` contains `scratch-root` |\n> | Namespaces | Network: both `net:[4026532841]`; filesystem mounts: `4026533574` and `4026533571` |\n>\n> The table was *(verified)*. `--target` selects a container by **name**; it does not transfer its root filesystem. With `shareProcessNamespace: true`, regular and ephemeral containers see Pod processes without `--target`;\n> in the tested copy, PID 1 is `/pause` and PID 7 is `/app`. This is a field in the template for a new Pod, not a switch for a running one.\n> *(verified)* — copy below; *(according to documentation)* — [shared process namespace](https://kubernetes.io/docs/tasks/configure-pod-container/share-process-namespace/).\n> The PID namespace controls visibility, while permissions control access to other processes and `/proc/<pid>/root`. Signals can stop the application: do not assume PID 1 is always your debugger.\n> Reminder: [[Linux-Troubleshooting-Visual-Guide#9. Процессы: состояния, сигналы, зомби и PID 1|Processes: states, signals, zombies and PID 1]] and [[Linux-Troubleshooting-Visual-Guide#14. Пространства имён и cgroups: основа контейнеров|Namespaces and cgroups: the basis of containers]].\n>\n> **Command in any directory — API locations that retain an ephemeral container:**\n>\n> ```bash\n> kubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n vg-k8s get pod vg-k8s-app \\\n>   -o jsonpath='{.spec.ephemeralContainers}{\"\\n\"}{.status.ephemeralContainerStatuses}{\"\\n\"}'\n> ```\n>\n> `spec.ephemeralContainers` stores its name, image, `targetContainerName`, and `securityContext`; `status.ephemeralContainerStatuses` stores `state`, `containerID`, and `restartCount`. A completed debugger has\n> `state.terminated` and 0 restarts; the application's UID and `containerID` are unchanged, with 0 restarts. *(verified)*. An already added container cannot be removed/modified and does not restart automatically.\n> A new entry needs a different name; the whole Pod is deleted separately according to its lifecycle. *(according to documentation)* — [ephemeral containers](https://kubernetes.io/docs/concepts/workloads/pods/ephemeral-containers/).\n>\n> **Example to read — actual API rejection when attempting to remove the first entry:**\n>\n> ```text\n> The Pod \"vg-k8s-app\" is invalid: spec.ephemeralContainers: Forbidden: existing ephemeral containers \"vg-k8s-isolated\" may not be removed\n> ```\n\n### System calls: see the process first, then obtain tracing permission\n\n**At a glance**\n- Seeing a PID does not grant tracing permissions\n- Check the UID and additional permissions separately\n- A system call shows where the process interacts with the kernel.\n\n**Short scenario**\n\nThe debugger sees the process, but ptrace returns Operation not permitted.\n\n**Predict:** Is looking up the same PID again enough?\n\n> [!question]- Answer\n> Analysis of the given conditions: No. Check the required privileges and security restrictions instead of changing PIDs blindly.\n\n**Command in any directory — first use a profile without additional tracing permissions:**\n\n```bash\nkubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n vg-k8s debug vg-k8s-app \\\n  --image=\"$TOOLS\" --target=app --container=vg-k8s-baseline --profile=baseline \\\n  -- sh -c 'ps -eo pid,args; timeout 3 strace -p 1 -e trace=openat'\nkubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n vg-k8s logs vg-k8s-app -c vg-k8s-baseline\n```\n\n`strace` shows a process's calls to the kernel; `lsof` connects descriptors to files and sockets. Their general syntax is not repeated here: [[Linux-Troubleshooting-Visual-Guide#10. Дескрипторы, ограничения, lsof и strace|Descriptors, limits, lsof and strace]].\nHere we need access to another PID; `-f` was added for the multithreaded Go process.\n\n> [!info]- Deeper explanation\n> **Example to read — tracing rejection, then the result in container `vg-k8s-general`:**\n>\n> ```text\n> strace: attach: ptrace(PTRACE_SEIZE, 1): Operation not permitted\n> strace: Process 1 attached with 5 threads\n> [pid    17] openat(AT_FDCWD, \"/config/app.yaml\", O_RDONLY|O_CLOEXEC) = -1 ENOENT (No such file or directory)\n> ```\n>\n> **Command inside debug container `vg-k8s-general` — working trace:**\n>\n> ```bash\n> id\n> grep -E 'CapEff|Seccomp|Uid' /proc/self/status\n> timeout 3 strace -f -p 1 -e trace=openat\n> ```\n>\n> Both cases use UID 0; matching users did not replace `SYS_PTRACE`. In `general`: `CapEff: 00000000a80c25fb`, `Seccomp: 0`; the missing `/config/app.yaml` was found.\n> `timeout` stopped observation with exit code 143, and `strace` detached; the application kept running. *(verified)*. If the PID is invisible, check `--target` and the runtime; if it is visible but access is denied, check permissions, UID, seccomp, and LSM.\n> An identical UID only helps when tracing is permitted and the process state allows it; Yama may require\n> a parent–child relationship or `SYS_PTRACE`. *(according to documentation)* — [Yama, kernel documentation](https://www.kernel.org/doc/html/latest/admin-guide/LSM/Yama.html).\n> Kernel privileges and seccomp are separate checks; adding a capability does not disable an explicitly configured seccomp policy. Reminder: [[Security-Visual-Guide#6. Привилегии ядра, no-new-privileges и seccomp: три разных ограничения|Kernel privileges, no-new-privileges and seccomp: three separate restrictions]].\n>\n> | kubectl 1.37.0 profile | Purpose and boundary |\n> |---|---|\n> | `general` | Default; adds `SYS_PTRACE` for an ephemeral container, without promising to bypass every restriction |\n> | `baseline` | No additional tracing capabilities; `strace` was observed to fail |\n> | `restricted` | Drops capabilities, sets `runAsNonRoot`, prevents escalation, and uses `RuntimeDefault`; not a ptrace profile |\n> | `netadmin` | Adds `NET_ADMIN` and `NET_RAW` for network tools; does not add `SYS_PTRACE` |\n> | `sysadmin` | `privileged: true`; broad access, used only on the owned kind node in this experiment |\n>\n> *(according to documentation)* — [kubectl v0.37.0 profile implementation](https://raw.githubusercontent.com/kubernetes/kubectl/v0.37.0/pkg/cmd/debug/profiles.go);\n> `general`, `baseline`, `netadmin`, and `sysadmin` ran; `restricted` was accepted but its process did not start. *(verified)*. The netshoot image declares its user as the string `root`: kubelet reported\n> `container has runAsNonRoot and image has non-numeric user (root), cannot verify user is non-root`, with reason `CreateContainerConfigError`. The restricted profile requires a verified image/numeric non-root UID;\n> a corrected launch here was *(not tested)*. Profiles belong to the kubectl **client**: check its `debug --help` rather than carrying the old `legacy` value from a documentation example into this version.\n\n### Networking inside the Pod: port, DNS, backend, and packets\n\n**At a glance**\n- Ports, DNS and packets answer different questions\n- A Service may point to the wrong targetPort\n- First connect the addresses involved in the specific request.\n\n**Short scenario**\n\nThe process listens on 8080, but the Service forwards to 9999.\n\n**Predict:** Will successful DNS resolution fix an incorrect targetPort?\n\n> [!question]- Answer\n> Analysis of the given conditions: No. The name resolves, but the destination port is incorrect.\n\n**Command inside debug container `vg-k8s-general` — separate the three checks:**\n\n```bash\nss -ltnp\ndig +short vg-k8s-ok.vg-k8s.svc.cluster.local\ncurl -sS --max-time 2 http://vg-k8s-ok\ncurl -sS --max-time 2 http://vg-k8s-empty\ncurl -sS --max-time 2 http://vg-k8s-wrong\ncurl -sS --max-time 2 http://127.0.0.1:8082\n```\n\n`ss -ltnp` checks the listening address, a DNS query checks the name, and `curl` checks the connection and protocol response. A Service's ClusterIP and port differ from the Pod address and `targetPort`; working DNS does not prove a ready endpoint.\nReminder: [[Linux-Troubleshooting-Visual-Guide#15. Сеть: слушающие порты и смысл ошибок|Networking: listening ports and error meanings]] and [[Networking-Visual-Guide#19. Kubernetes: адрес пода, виртуальный Service и реальные получатели|Kubernetes: Pod address, virtual Service and actual backends]].\n\n> [!info]- Deeper explanation\n> **Example to read — selected exact lines from the new run:**\n>\n> ```text\n> LISTEN 0      4096               *:8080            *:*    users:((\"app\",pid=1,fd=4))\n> 10.96.166.152\n> ok\n> curl: (7) Failed to connect to vg-k8s-empty port 80 after 1003 ms: Could not connect to server\n> curl: (7) Failed to connect to vg-k8s-wrong port 80 after 2 ms: Could not connect to server\n> curl: (56) Recv failure: Connection reset by peer\n> ```\n>\n> The first incorrect Service's EndpointSlice contained `ready: false`; the second contained `ready: true` and port `9999`. Two different defects produce the same class of client error; check addresses and readiness before changing the network. *(verified)*.\n>\n> **`deny.yaml` in `/tmp/vg-k8s-work` — block all outgoing connections except DNS:**\n>\n> ```yaml\n> apiVersion: networking.k8s.io/v1\n> kind: NetworkPolicy\n> metadata: {name: vg-k8s-deny, namespace: vg-k8s}\n> spec:\n>   podSelector: {matchLabels: {app: vg-k8s-app}}\n>   policyTypes: [Egress]\n>   egress:\n>   - ports:\n>     - {protocol: UDP, port: 53}\n>     - {protocol: TCP, port: 53}\n> ```\n>\n> **Command in any directory — packet-capture container and policy activation:**\n>\n> ```bash\n> kubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n vg-k8s debug vg-k8s-app \\\n>   --image=\"$TOOLS\" --target=app --container=vg-k8s-network --profile=netadmin -- sleep 1d\n> kubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n vg-k8s apply -f /tmp/vg-k8s-work/deny.yaml\n> ```\n>\n> **Command inside debug container `vg-k8s-network` — capture on the Pod interface:**\n>\n> ```bash\n> timeout 5 tcpdump -ni eth0 -c 3 tcp > /tmp/policy.packets 2>&1 & t=$!\n> sleep 1\n> dig +short vg-k8s-ok.vg-k8s.svc.cluster.local\n> curl -sS --connect-timeout 3 --max-time 4 http://vg-k8s-ok\n> wait \"$t\"\n> cat /tmp/policy.packets\n> ```\n>\n> **Example to read — DNS works, with no response to three SYN packets; capture lines are shown in full:**\n>\n> ```text\n> 10.96.166.152\n> curl: (28) Connection timed out after 3002 milliseconds\n> 11:32:59.077297 IP 10.244.1.2.47308 > 10.96.166.152.80: Flags [S], seq 586176593, win 42340, options [mss 1460,sackOK,TS val 1598642578 ecr 0,nop,wscale 9], length 0\n> 11:33:00.112702 IP 10.244.1.2.47308 > 10.96.166.152.80: Flags [S], seq 586176593, win 42340, options [mss 1460,sackOK,TS val 1598643614 ecr 0,nop,wscale 9], length 0\n> 11:33:01.137689 IP 10.244.1.2.47308 > 10.96.166.152.80: Flags [S], seq 586176593, win 42340, options [mss 1460,sackOK,TS val 1598644639 ecr 0,nop,wscale 9], length 0\n> ```\n>\n> On this test setup, `kindnetd:v20260820-69b56db7` **enforces NetworkPolicy**: the deny rule caused a timeout, and HTTP returned `ok` again after the policy was removed. *(verified)*. Installing another CNI was unnecessary here.\n> Before repeating, remove the policy with `kubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n vg-k8s delete -f /tmp/vg-k8s-work/deny.yaml`.\n> Without a DNS allowance, the first deny variant produced `curl: (28) Resolving timed out after 2001 milliseconds`. For `vg-k8s-wrong`, the same capture with `-c 4` recorded SYN → translated SYN → RST → RST to the client;\n> for the working Service with `-c 3`, the third packet was SYN-ACK (`Flags [S.]`). *(verified)*.\n> **Example to read — closed-port response from the capture:**\n>\n> ```text\n> 11:34:33.930659 IP 10.244.1.2.9999 > 10.244.1.1.33615: Flags [R.], seq 0, ack 2968960123, win 0, length 0\n> 11:34:33.930670 IP 10.96.238.53.80 > 10.244.1.2.35022: Flags [R.], seq 0, ack 2968960123, win 0, length 0\n> ```\n>\n> A rejection at SYN means the connection was not established; a timeout means the expected response is absent; a reset after the request means the stream was interrupted. The error text alone does not identify the responsible component: [[Networking-Visual-Guide#7. Ошибки клиента: симптом и источник решения|Client errors: symptom and decision source]].\n> `tcpdump` shows packets at the capture point; `traceroute` checks responses to probes and does not replace a capture.\n> Reminder: [[Linux-Troubleshooting-Visual-Guide#16. traceroute и tcpdump: увидеть путь и факт обмена|traceroute and tcpdump: observing the path and actual exchange]].\n\n### Crashes before you can connect: investigate a copy\n\n**At a glance**\n- A Pod copy helps investigate a rapid failure\n- The copy's command must exist in its image\n- Copying an object does not install tools.\n\n**Short scenario**\n\nThe original scratch image contains only /app. The copy is supposed to stay running with sleep.\n\n**Predict:** Will sleep start without adding a different image?\n\n> [!question]- Answer\n> Analysis of the given conditions: No. The API may accept the copy, but the runtime will not find the executable.\n\n**Command in any directory — first a failing copy, then a copy with a replacement image:**\n\n```bash\nkubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n vg-k8s debug vg-k8s-crash \\\n  --copy-to=vg-k8s-copy-fails --container=app -- sleep 1d\nkubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n vg-k8s debug vg-k8s-crash \\\n  --copy-to=vg-k8s-copy --container=app --set-image=\"app=$TOOLS\" --share-processes -- sleep 1d\nkubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n vg-k8s events --for pod/vg-k8s-copy-fails --types=Warning\n```\n\n> [!info]- Deeper explanation\n> **Example to read — exact end of the container-runtime error:**\n>\n> ```text\n> exec: \"sleep\": executable file not found in $PATH\n> ```\n>\n> The API copy succeeded, but the first copy received `RunContainerError`; `scratch` does not contain `sleep` either.\n> In the second copy, `app` is the tools container and is `Running`: the original Go process is no longer reproduced.\n> The original Pod showed `CrashLoopBackOff`, termination reason `Error`, and exit code 3. *(verified)*.\n> To preserve the application, add tools to a copy rather than replacing its image.\n>\n> **Command in any directory — a copy with two containers and a shared PID namespace:**\n>\n> ```bash\n> kubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n vg-k8s debug vg-k8s-app \\\n>   --copy-to=vg-k8s-shared --container=vg-k8s-tools --image=\"$TOOLS\" --share-processes -- sleep 1d\n> kubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n vg-k8s exec vg-k8s-shared -c vg-k8s-tools -- ps -eo pid,args\n> ```\n>\n> Without `--target`, it shows `/pause` (PID 1), `/app` (PID 7), and `sleep 1d` (PID 24). *(verified)*.\n> Copies received a new UID/IP and had their labels removed; the Service does not select them. All landed on `vg-k8s-worker`,\n> but that is not guaranteed: `--same-node` was not specified here. PID sharing was enabled through `--share-processes`.\n> Volume definitions were copied: `emptyDir` is new and its contents are not copied. In the original `/data/marker`,\n> `changed` was written through `/proc/1/root`; the new running copy read `original`. *(verified)*.\n> A PVC may remain a reference to **the same** claim; memory contents and the state of the dead process are not copied.\n> `--keep-labels` may send real Service traffic to the copy; check init-container and probe options.\n> *(according to documentation)* — [kubectl debug reference](https://kubernetes.io/docs/reference/kubectl/generated/kubectl_debug/).\n\n### From the node: CRI, node root, and entering a specific namespace\n\n**At a glance**\n- Node debugging grants broader access\n- chroot changes the filesystem root, not every namespace\n- nsenter selects a specific process namespace.\n\n**Short scenario**\n\nAfter chroot /host, the command still uses its previous network namespace.\n\n**Predict:** Should chroot automatically expose the required Pod's network?\n\n> [!question]- Answer\n> Analysis of the given conditions: No. Enter the corresponding network namespace separately; this is a written analysis, and privileged debugging was not performed.\n\n**Command in any directory — only a node in your own disposable cluster:**\n\n```bash\nkubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n vg-k8s debug node/vg-k8s-worker \\\n  --image=\"$TOOLS\" --profile=sysadmin -- sleep 1d\n```\n\n> [!info]- Deeper explanation\n> `node-debugger-vg-k8s-worker-gjdfp` was created; for an interactive variant, add `-it` and replace `sleep 1d` with `sh`.\n> The experiment entered `debugger` through `exec`. `/host` is the root of the **kind node container**, not the owner's machine.\n> PID, network, and IPC namespaces matched the node; the mount namespace remained separate. *(verified)*.\n> `chroot /host` changes the root used for paths; it does not itself enter other namespaces.\n>\n> **Command inside the node-debug container — find the target container and use node tools:**\n>\n> ```bash\n> chroot /host crictl ps\n> chroot /host crictl inspect -o json c7a6edaa4cdd0 > /tmp/container.json\n> chroot /host crictl logs --tail=2 c7a6edaa4cdd0\n> chroot /host journalctl -u kubelet -u containerd -n 3 --no-pager\n> ```\n>\n> For a node shell, use `chroot /host`; here each command uses its root and utilities separately.\n> Read `info.pid` from JSON; parsing in the experiment happened outside. `crictl ps` matched the name, Pod, and namespace; `inspect` provided PID **927**,\n> and `logs` returned `open /config/app.yaml: no such file or directory`. *(verified)*.\n> Node CRI endpoint: `unix:///run/containerd/containerd.sock` from `/etc/crictl.yaml`.\n> Kubelet and containerd are active systemd services; logs were read through the journal, and application logs were in `/var/log/pods/.../app/0.log`.\n> `/var/log/kubelet.log` and `/var/log/containerd.log` do not exist: `No such file or directory`. *(verified)*.\n>\n> **Command inside the node-debug container — after leaving chroot, using the PID from inspect:**\n>\n> ```bash\n> nsenter -t 927 -n ss -ltnp\n> nsenter -t 927 -m /bin/sh\n> nsenter -t 927 -m /app crash\n> nsenter -t 927 -p sh -c 'grep NSpid /proc/self/status'\n> cat /proc/927/root/root-marker\n> ```\n>\n> `-n`: `8080`/`8082` are visible, owned by `/app`, node PID 927.\n> `-m`: `/bin/sh` is absent again — `nsenter: failed to execute /bin/sh: No such file or directory`;\n> the static `/app crash` started and returned exit code 3. You can read through `/proc/927/root` without requiring a shell inside the target.\n> `-p`: the new shell has `NSpid: 2243 118`; without `-m` and a newly mounted `/proc`, `ps` commands may show the node's process list.\n> These PID values belong to this run: always obtain them afresh. *(verified)*.\n> With `general`, the node `chroot` **worked**, but `nsenter -n` was denied:\n> `nsenter: reassociate to namespaces failed: Operation not permitted`. Unprivileged does not mean “without any capabilities”.\n> *(verified)*; the purpose of node-debugging mode is *(according to documentation)*, [debugging a node](https://kubernetes.io/docs/tasks/debug/debug-cluster/kubectl-node-debug/).\n> The completed node debugger `node-debugger-vg-k8s-worker-pnhx6` remained `Failed`, with 0 restarts.\n> Exiting the shell does not delete the object; both node Pods were removed manually. *(verified)*.\n> **Command in any directory — delete exactly the node Pods created here:**\n>\n> ```bash\n> kubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n vg-k8s delete pod \\\n>   node-debugger-vg-k8s-worker-gjdfp node-debugger-vg-k8s-worker-pnhx6\n> ```\n\n### Related approaches and permission boundaries\n\n**At a glance**\n- Choose a tool for the observed layer\n- Permissions should match the required operation\n- A broader profile does not replace evidence of the cause.\n\n**Short scenario**\n\nSomeone proposes starting privileged node debugging immediately to read a container's previous logs.\n\n**Predict:** Is that needed for this specific first step?\n\n> [!question]- Answer\n> Analysis of the given conditions: No. Start with permitted logs --previous access; broader permissions are needed only for a justified next operation.\n\n- A tools container beside the application, a sidecar, is useful for regular troubleshooting or when the ephemeral-container API is unavailable.\n  Add it to the template for a new Pod; provide a shared filesystem through a volume. Example project — *(according to documentation)*, [netshoot](https://github.com/nicolaka/netshoot).\n- `kubectl exec -c <tools>` enters an already running tools container. With `shareProcessNamespace: true`,\n  it can see the application; the tested copy above demonstrates this approach. *(verified)*.\n- `kubectl port-forward pod/vg-k8s-app 18080:8080` with a separate kubeconfig returned `ok` at `127.0.0.1:18080`.\n  This is a path through the API/kubelet to the Pod; success does not test DNS/ClusterIP or the normal client route. *(verified)*.\n- `kubectl cp` runs `tar` in the target container: our failure was `exec: \"tar\": executable file not found in $PATH`.\n  Read through tools and `/proc/<pid>/root`; how `cp` works is *(according to documentation)*, [kubectl cp](https://kubernetes.io/docs/reference/kubectl/generated/kubectl_cp/); the failure was *(verified)*.\n- `kubectl logs --previous -c app` selects the terminated instance. Here two requests failed to retrieve its logs,\n  and further retries stopped; current logs and CRI remained accessible. Exact text and limits: §21.\n- `kubectl events --for pod/<name>` and `describe pod` show startup/BackOff failures, not system calls.\n  Both were used on the incorrect copy/crashing Pod. *(verified)*.\nEphemeral containers require `get` on the Pod and `patch`/`update` on **`pods/ephemeralcontainers`**; attach/exec require their own permissions.\nCreating a copy or node debugger requires `create pods`; the node Pod also needs admission for host access.\n*(according to documentation)* — [RBAC](https://kubernetes.io/docs/reference/access-authn-authz/rbac/) and node debugging.\n`auth can-i patch pods/ephemeralcontainers`: the administrator received `yes`, the default ServiceAccount `no`. *(verified)*.\nPSA checks ephemeral containers too: with `baseline:v1.37`, our `general` was rejected for its added capabilities;\nnode `sysadmin` was rejected for `hostNetwork`, `hostPID`, `hostIPC`, `hostPath`, and `privileged`. With `restricted:v1.37`,\nrejection also occurred. The enforce label did not stop existing processes. *(verified)*.\n**Example to read — exact relevant portion of the node-Pod admission rejection:**\n\n> [!info]- Deeper explanation\n> ```text\n> violates PodSecurity \"baseline:v1.37\": host namespaces (hostNetwork=true, hostPID=true, hostIPC=true), hostPath volumes (volume \"host-root\"), privileged (container \"debugger\" must not set securityContext.privileged=true)\n> ```\n>\n> The `restricted` profile does not fix other insecure containers in an existing Pod.\n> Reminder: [[Security-Visual-Guide#14. Pod Security и собственный допуск: отказы на разных свойствах|Pod Security and custom admission: rejecting different properties]].\n> A privileged node Pod with the node's root/namespaces grants the power to take over the entire node:\n> access to CRI, other containers, and secrets. This is a technical boundary; grant permissions for a specific incident.\n> Record the operator, target, image/digest, profile, time, and reason; API audit must retain operations\n> on `pods/ephemeralcontainers`, Pod creation, and attach/exec. It does not replace logging commands inside the shell.\n> *(according to documentation)* — [Kubernetes auditing](https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/); configuring audit here was *(not tested)*.\n> Obtain tools images from a controlled registry, verify provenance and vulnerabilities, and pin a digest,\n> not `latest`; do not leave tools or captures containing secrets in production. This is recommended practice, not a registry test run.\n>\n> | Symptom | First tool | Next tool |\n> |---|---|---|\n> | No shell, process alive | `logs`, `describe` | `debug --target`, then `ps`/`ss` |\n> | Process visible, ptrace denied | UID, capabilities, seccomp | Approved profile and `strace -f -p` |\n> | Configuration cannot be read | Logs containing the path | `/proc/<pid>/root`, `strace` with `openat` |\n> | Service name does not resolve | `dig`, `/etc/resolv.conf` | DNS events, UDP/TCP 53 capture |\n> | DNS works, TCP fails | EndpointSlice and `ss` | `curl`, `tcpdump`: SYN/RST or retries |\n> | Not enough time to connect | `logs --previous`, `lastState` | `debug --copy-to`, with `--set-image` if needed |\n> | Several Pods on a node fail | Node conditions, events | Node `debug`, CRI, kubelet/containerd journal |\n>\n> **Predict:** the capture shows three SYN packets to `10.96.166.152:80`, DNS returned that address, and there is no SYN-ACK.\n> Does this prove the Go process is not listening on `8080`?\n>\n> > [!question]- Answer\n> > No. In the actual experiment it was listening and the Service had a ready endpoint; an egress NetworkPolicy blocked the response.\n> > Removing it restored `ok`. A client-side capture shows that the response is absent here, but does not identify the drop location itself. *(verified)*.\n>\n> **Short answer in English — Pod without a shell:**\n>\n> > I check logs and events first. I add an ephemeral container with a trusted tools image and target the app container.\n> > It shares the Pod network; process access depends on the runtime and permissions. I can read the app files through `/proc/<pid>/root`.\n> > I use the smallest allowed debug profile and do not rebuild the running image just to add a shell.\n>\n> **Short answer in English — CrashLoopBackOff:**\n>\n> > I check previous logs, events and the last exit reason. If the app stops too fast, I create a separate debug copy.\n> > I change its command or use a tools image; `sleep` will not work if it is missing from the original image.\n> > The copy has new process state and may have new volume data, so I compare it with the original Pod.\n"
