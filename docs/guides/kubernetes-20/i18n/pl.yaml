heading: '20. Rozwiązywanie problemów: przejście z obserwacji do warstwy, która uległa awarii'
text: "## 20. Rozwiązywanie problemów: przejdź z obserwacji do warstwy, która uległa awarii\n\n**W skrócie**\n\
  - Rozpocznij diagnostykę od zaobserwowanej awarii\n- Ten sam objaw może mieć różne przyczyny\n-  Pierwszym\
  \ krokiem powinno być rozróżnienie hipotez.\n\n**Krótki scenariusz**\n\nŻądanie HTTP kończy się niepowodzeniem,\
  \ ale odpowiedź DNS, endpoint i port nasłuchiwania są nadal nieznane.\n\n**Prognoza:** Czy wystarczy\
  \ natychmiastowe ponowne uruchomienie Deployment?\n\n> [!question] - Odpowiedź\n> Analiza danego conditions:\
  \ Nie. Ta czynność nie identyfikuje uszkodzonej warstwy i może zniszczyć przydatne dowody.\n\n> [!info]\
  \ Rdzeń i referencja\n> Podstawowe podejście do przypadku: symptom → warstwa → kolejna kontrola → jego\
  \ granice. Każdy podrozdział to oddzielny przypadek; istnieje no, należy powtórzyć w kolejności mechanizmy\
  \ z §3–14. Pełne instrukcje i §21 stanowią materiał referencyjny.\n\n### Zacznij od objawu\n\n**W skrócie**\n\
  - Objaw określa, gdzie należy najpierw sprawdzić\n- Ezdarzenia pokazują etap, na którym zatrzymał się\
  \ postęp\n- Process logs są przydatne tylko after, proces się rozpoczyna.\n\n**Krótki scenariusz**\n\
  \nThe Pod ma no nodeName, a jego warunek PodScheduled ma wartość Fałsz.\n\n**Przewiduj:** Czy jest sens\
  \ zaczynać od aplikacji logs?\n\n> [!question] - Odpowiedź\n> Analiza danego conditions: Najpierw sprawdź\
  \ planowanie przy użyciu conditions i events:, proces mógł jeszcze się nie rozpocząć.\n\n| Objaw | Samodzielna\
  \ sprawa | Mechanizm |\n|---|---|---|\n| Obraz nie został załadowany | [[#Полный пример ошибки загрузки\
  \ образа|ImagePullBackOff]] | §3: container state |\n| Proces został zabity | [[#Полный пример превышения\
  \ памяти|OOM]] | §9: pamięć |\n| Service nie odpowiada | [[#Не сводить сетевую диагностику к тексту\
  \ одной ошибки|Sieć]] | §10: conditions |\n| Nie shell | [[#Как добраться до процесса без оболочки|Dostęp\
  \ do procesu]] | [[Containers-Visual-Guide|izolacja procesu]] |\n\n### Zlokalizuj awarię przed wprowadzeniem\
  \ zmian\n\n**W skrócie**\n-  Najpierw określ zakres\n- Następnie przeczytaj state konkretnego Pod\n\
  - AKażda zmiana powinna dotyczyć potwierdzonej przyczyny.\n\n**Miniprzykład:** tylko w przygotowanym\
  \ powyżej jednorazowym klastrze kind. Utwórz namespace za pomocą `kubectl --kubeconfig /tmp/guides-order-rest.kubeconfig\
  \ --context kind-guides-order-rest create namespace guide-mini-66`. Zapisz wpis jako `mini.sh`; uruchom\
  \ go za pomocą `bash -e mini.sh`.\n\n```bash\nk() { kubectl --kubeconfig /tmp/guides-order-rest.kubeconfig\
  \ --context kind-guides-order-rest -n guide-mini-66 \"$@\"; }\nk run once --image=nginx:1.29-alpine\
  \ --image-pull-policy=Never --restart=Never --command -- sh -c 'echo diagnostic; exit 3'\nk wait --for=jsonpath='{.status.phase}'=Failed\
  \ pod/once --timeout=90s\nk logs once\nk get pod once -o jsonpath='{.status.containerStatuses[0].state.terminated.exitCode}{\"\
  \\n\"}'\n```\n\n**Przewiduj:** Co zakończy ostatnie polecenie command after, które zakończy poprzednie\
  \ polecenia?\n\n> [!question] - Odpowiedź\n> Rzeczywisty command stdout:\n>\n> ```text\n> pod/once created\n\
  > pod/once condition met\n> diagnostic\n> 3\n> ```\n>\n> Kod wyjścia: 0.\n\nProces się rozpoczął, wydrukowano\
  \ diagnostic, następnie zwrócono 3. Różni się to od błędu planowania lub niepowodzenia pobierania obrazu.\n\
  \n**Polecenia w dowolnym katalogu — minimalne dowody dla Pod `crash`:**\n\n```bash\nkubectl --kubeconfig\
  \ /tmp/vg-k8s-kubeconfig --context kind-vg-k8s \\\n  -n vg-k8s get pods -o wide\nkubectl --kubeconfig\
  \ /tmp/vg-k8s-kubeconfig --context kind-vg-k8s \\\n  -n vg-k8s describe pod crash\nkubectl --kubeconfig\
  \ /tmp/vg-k8s-kubeconfig --context kind-vg-k8s \\\n  -n vg-k8s logs crash -c app --previous\nkubectl\
  \ --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s \\\n  -n vg-k8s get events --field-selector\
  \ involvedObject.name=crash --sort-by=.lastTimestamp\n```\n\nNajpierw określ zakres: jeden container,\
  \ jeden Pod, jedna wersja Deployment, jeden węzeł lub cały klaster.\nSprawdź, czy węzeł został przypisany;\
  \ następnie sprawdź przygotowanie środowiska/kontenera, backendy readiness, Service i ścieżkę sieciową.\n\
  Zapisz previous logs i zdarzenia przed ponownym uruchomieniem: nowy przebieg może ukryć przyczynę.\n\
  Sekwencja ta jest metodą inżynierską opartą na\n[debugowanie Pods](https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/)\
  \ i\n[debugowanie Services](https://kubernetes.io/docs/tasks/debug/debug-application/debug-service/).\
  \ *(wg dokumentacji)*.\n\n> [!info] - głębsze wyjaśnienie\n> **Wykres do odczytania — jeden objaw może\
  \ mieć kilka przyczyn root:**\n>\n> ```mermaid\n> flowchart TD\n>     A[\"Application<br/>unavailable\"\
  ] --> B[\"Does a Pod exist?\"]\n>     B -->|\"No\"| C[\"ReplicaSet<br/>events: quota<br/>or admission\"\
  ]\n>     B -->|\"Yes\"| D[\"Is there<br/>an assigned<br/>node?\"]\n>     D -->|\"No\"| E[\"FailedScheduling:<br/>§8\
  \ and PVC\"]\n>     D -->|\"Yes\"| F[\"Is the container<br/>running?\"]\n>     F -->|\"No\"| G[\"Image,<br/>configuration,<br/>volume,\
  \ CNI\"]\n>     F -->|\"Yes\"| H[\"Ready?\"]\n>     H -->|\"No\"| I[\"Probes and<br/>application\"]\n\
  >     H -->|\"Yes\"| J[\"EndpointSlice,<br/>port, DNS,<br/>policy\"]\n> ```\n>\n> `-o wide` dodaje IP/węzeł;\
  \ zdarzenia łączą awarię z komponentem;\n> `--previous` odczytuje zakończoną instancję. Na obrazie bez\
  \ dystrybucji brak shell nie jest aplikacją\n> awaria: użyj ephemeral debug container z wymaganymi uprawnieniami/obrazem.\n\
  > Pełny przykład: [[K8s-Debug-Distroless-Images]].\n> Przebieg original nie uruchomił kontenerów ephemeral;\
  \ osobny przebieg opisano poniżej.\n\n### Pięć podstawowych gałęzi i zakres obejmujący cały węzeł\n\n\
  **W skrócie**\n- Rozróżnij planowanie, obrazy, procesy, pamięć i sieć\n- Zakres na poziomie węzła pomaga\
  \ zidentyfikować wspólną przyczynę\n- One Błąd container nie dowodzi, że cały węzeł uległ awarii.\n\n\
  **Krótki scenariusz**\n\nRóżne aplikacje zawodzą tylko w jednym węźle; pracują nad innymi.\n\n**Przewiduj:**\
  \ Który obszar powinieneś zbadać w następnej kolejności?\n\n> [!question] - Odpowiedź\n> Analiza danego\
  \ conditions: Węzeł współdzielony: jego conditions, runtime, zasoby i komponenty sieciowe, przy czym\
  \ każda kontrola jest powiązana z konkretnymi obserwacjami.\n\n| Objaw | Pierwszy question | Dowód →\
  \ kolejny krok |\n|---|---|---|\n| `Pending`, no `nodeName` | Które węzły zostały wykluczone? | `FailedScheduling`\
  \ → requests, taints, affinity, PVC (§8/11) |\n| `Pending`, węzeł przypisany | Czego nie przygotowano?\
  \ | `FailedMount`, `FailedCreatePodSandBox`, Secret/awaria obrazu |\n| `CrashLoopBackOff` | Kto zakończył\
  \ proces? | Poprzedni logs, `lastState`, exit kod/przyczyna, liveness/OOM (§3/4/9) |\n| `ImagePullBackOff`\
  \ | Czy obraz istnieje i czy jest dostępny? | Zdarzenie rejestru/DNS/TLS/auth/tag; imagePullSecrets\
  \ (§3, [[Containers-Visual-Guide]]) |\n| `Running`, a nie Ready | Dlaczego readiness nie działa? | 404/przekroczenie\
  \ limitu czasu; adres/port nasłuchiwania; zależność (§4) |\n| Service ma backendy no | Selektor czy\
  \ readiness? | Brak adresów → etykiety; adresy nie są gotowe → sondy (§10) |\n| Awaria kilku kapsuł\
  \ w jednym węźle | Czy węzeł jest dostępny? | Node conditions, kubelet/CRI, dysk/pamięć, sieć |\n\n\
  > [!info] - Głębsze wyjaśnienie\n> Tabela łączy publiczne źródła debugowania i nowe eksperymenty; zaznaczono\
  \ konkretne błędy, które nie zostały powtórzone\n> w odpowiednich sekcjach. Awaria węzła w tej sesji\
  \ to *(nie testowano)*.\n\n### Przykład niepowodzenia pobierania pełnego obrazu\n\nKrótka trasa powyżej\
  \ definiuje mechanizm i następną kontrolę. Pełna lista i obserwacje: [[#Справочный рецепт — Полный пример\
  \ ошибки загрузки образа|przepis referencyjny]].\n\n### Przykład pełnego limitu pamięci\n\nKrótka trasa\
  \ powyżej definiuje mechanizm i następną kontrolę. Pełna lista i obserwacje: [[#Справочный рецепт —\
  \ Полный пример превышения памяти|przepis referencyjny]].\n\n### Nie ograniczaj rozwiązywania problemów\
  \ sieciowych do jednego komunikatu o błędzie\n\n**W skrócie**\n- Error text prowadzi dochodzenie\n-\
  \ DNS, połączenia i odpowiedzi aplikacji to różne etapy\n- A timeout nie identyfikuje jednej przyczyny.\n\
  \n**Krótki scenariusz**\n\nDNS zwrócił adres; klient wysłał SYN i otrzymał odpowiedź no.\n\n**Przewiduj:**\
  \ Czy to dowodzi, że aplikacja nie nasłuchuje?\n\n> [!question] - Odpowiedź\n> Analiza podanego conditions:\
  \ Nie. Odpowiedzialna może być ścieżka lub filtrowanie; niezależnie sprawdź port nasłuchiwania i obserwuj\
  \ pakiety.\n\n** Dane wyjściowe starszego klienta — zarejestrowany przebieg NetworkPolicy/Cilium do\
  \ odczytania:**\n\n> [!info] - Głębsze wyjaśnienie\n> ```text\n> wget: bad address 'web'\n> wget: download\
  \ timed out\n> ```\n>\n> To jest **nagrany przebieg** z [[Kubernetes-Coding-Drills-Solutions#3 — NetworkPolicy]]:\n\
  > w pierwszym przypadku polityka zablokowała także DNS; w drugim zezwolono na DNS, ale ścieżka do aplikacji\
  \ została zablokowana.\n> W innym środowisku te komunikaty mogą mieć różne przyczyny; potwierdź je osobnym\
  \ zapytaniem DNS,\n> EndpointSlice, podłączenie do portu i spostrzeżenia z realizacji sieci.\n> Przebieg\
  \ original nie obejmował nowych eksperymentów związanych z utratą pakietów lub niepowodzeniem DNS; poniżej\
  \ pojawi się osobny przebieg.\n>\n> Nie stosuj starego claim, że „polityka zawsze widzi targetPort after\
  \ DNAT” bezwarunkowo:\n> w przypadku translacji adresu/portu Service, kolejność zgodnie z polityką sieciową\
  \ zależy od implementacji.\n> Zaprojektuj i przetestuj regułę na konkretnym CNI, zezwalając oddzielnie\
  \ na DNS zamiast UDP/TCP.\n> *(wg dokumentacji)* — [NetworkPolicy i NAT](https://kubernetes.io/docs/concepts/services-networking/network-policies/).\n\
  >\n> **Przewiduj:** Pod ma `lastState: Completed, exitCode: 0`, ale liczba ponownych uruchomień stale\
  \ rośnie. Czy aplikacja na pewno jest zdrowa?\n>\n> > [!question] - Odpowiedź\n> > Nie. W nowym eksperymencie\
  \ kubelet zatrzymał nginx z powodu liveness 404, a nginx zakończył pracę z kodem 0.\n> > Zdarzenie `failed\
  \ liveness probe, will be restarted` identyfikuje, kto zainicjował zatrzymanie.\n> > *(zweryfikowano)*\
  \ — §4.\n>\n> **Krótka odpowiedź w języku angielskim:**\n>\n> > I first find the failing layer. Pending\
  \ without a node is different from waiting for an image on a selected node.\n> > I compare events, previous\
  \ logs and termination reasons. I change the manifest only after I have evidence for the cause.\n\n\
  ### Dotarcie do procesu, który ma no shell\n\n**W skrócie**\n- A minimalny obraz może mieć no shell\n\
  - A nie powiodło się exec sh nie dowodzi awarii aplikacji\n- ADodaj debugowanie tools osobno.\n\n**Krótki\
  \ scenariusz**\n\nAplikacja HTTP endpoint odpowiada, ale exec sh zwraca executable not found.\n\n**Przewiduj:**\
  \ Czy powinieneś rozważyć zakup container?\n\n> [!question] - Odpowiedź\n> Analiza podanego conditions:\
  \ Nie. Brak żądanego executable; aplikacja może nadal działać.\n\n**`main.go` w `/tmp/vg-k8s-work` —\
  \ kompletne źródło aplikacji edukacyjnej:**\n\n```go\npackage main\nimport(\"fmt\";\"net\";\"net/http\"\
  ;\"os\";\"time\")\nfunc main(){\n if len(os.Args)>1 && os.Args[1]==\"crash\" { _,e:=os.ReadFile(\"/config/app.yaml\"\
  );fmt.Println(e);os.Exit(3) }\n os.WriteFile(\"/data/marker\",[]byte(\"original\\n\"),0600)\n go func(){for{_,e:=os.ReadFile(\"\
  /config/app.yaml\");if e!=nil{fmt.Println(e)};time.Sleep(time.Second)}}()\n go func(){l,e:=net.Listen(\"\
  tcp\",\":8082\");if e!=nil{panic(e)};for{c,e:=l.Accept();if e!=nil{continue};go func(c net.Conn){b:=make([]byte,1024);c.Read(b);c.(*net.TCPConn).SetLinger(0);c.Close()}(c)}}()\n\
  \ http.HandleFunc(\"/\",func(w http.ResponseWriter,r *http.Request){fmt.Fprintln(w,\"ok\")})\n panic(http.ListenAndServe(\"\
  :8080\",nil))\n}\n```\n\n**`Dockerfile` w `/tmp/vg-k8s-work` — plik kompletny; sąsiadujący `root-marker`\
  \ zawiera ciąg `scratch-root`:**\n\n```dockerfile\nFROM scratch\nCOPY app /app\nCOPY root-marker /root-marker\n\
  USER 0\nENTRYPOINT [\"/app\"]\n```\n\nNastępujące eksperymenty przeprowadzono oddzielnie od eksperymentów\
  \ previous: kind **0.33.0**, Kubernetes i kubectl **1.37.0**, kind-node containerd **2.3.4**, `crictl\
  \ 1.36.0`; jedna płaszczyzna kontrolna i jeden węzeł roboczy. *(zweryfikowane)*.\nEphemeral containers\
  \ są stabilne od wersji Kubernetes 1.25; Profile custom `--custom` od wersji 1.32. *(zgodnie z dokumentacją)*\
  \ — [debugowanie działającego Pod](https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/).\n\
  §2–5 obejmują stany i sondy; tutaj wnosimy narzędzie do procesu. Program statyczny w `scratch` odtwarza\
  \ ten sam brak tools co distroless:\njest no shell, ale aplikacja działa. Przebudowa obrazu aplikacji\
  \ za pomocą shell zmienia badany artefakt, wymaga wymiany Pod i rozszerza obraz production. Nie ma potrzeby\
  \ obserwowania toczącego się procesu.\n\n> [!info] - Głębsze wyjaśnienie\n> UID 0 służy tutaj do porównywania\
  \ uprawnień do śledzenia; nie jest to zalecany użytkownik dla prawdziwej aplikacji. `8080` obsługuje\
  \ HTTP, `8082` celowo resetuje połączenie after odczytując żądanie; brak pliku konfiguracyjnego.\n>\n\
  > **`lab.yaml` w `/tmp/vg-k8s-work` — kompletny zestaw obiektów do ćwiczenia dodatkowego:**\n>\n> ```yaml\n\
  > apiVersion: v1\n> kind: Namespace\n> metadata: {name: vg-k8s}\n> ---\n> apiVersion: v1\n> kind: Pod\n\
  > metadata: {name: vg-k8s-app, namespace: vg-k8s, labels: {app: vg-k8s-app}}\n> spec:\n>   containers:\n\
  >   - name: app\n>     image: vg-k8s-app:1\n>     imagePullPolicy: Never\n>     volumeMounts: [{name:\
  \ data, mountPath: /data}]\n>   volumes: [{name: data, emptyDir: {}}]\n> ---\n> apiVersion: v1\n> kind:\
  \ Pod\n> metadata: {name: vg-k8s-crash, namespace: vg-k8s, labels: {app: vg-k8s-crash}}\n> spec:\n>\
  \   containers:\n>   - name: app\n>     image: vg-k8s-app:1\n>     imagePullPolicy: Never\n>     args:\
  \ [crash]\n>     volumeMounts: [{name: data, mountPath: /data}]\n>   volumes: [{name: data, emptyDir:\
  \ {}}]\n> ---\n> apiVersion: v1\n> kind: Service\n> metadata: {name: vg-k8s-ok, namespace: vg-k8s}\n\
  > spec:\n>   selector: {app: vg-k8s-app}\n>   ports: [{port: 80, targetPort: 8080}]\n> ---\n> apiVersion:\
  \ v1\n> kind: Service\n> metadata: {name: vg-k8s-empty, namespace: vg-k8s}\n> spec:\n>   selector: {app:\
  \ vg-k8s-crash}\n>   ports: [{port: 80, targetPort: 8080}]\n> ---\n> apiVersion: v1\n> kind: Service\n\
  > metadata: {name: vg-k8s-wrong, namespace: vg-k8s}\n> spec:\n>   selector: {app: vg-k8s-app}\n>   ports:\
  \ [{port: 80, targetPort: 9999}]\n> ```\n>\n> **Polecenie w dowolnym katalogu — after tworzy oddzielny\
  \ klaster `vg-k8s`, z kubeconfig z §21:**\n>\n> ```bash\n> printf 'scratch-root\\n' > /tmp/vg-k8s-work/root-marker\n\
  > CGO_ENABLED=0 go build -o /tmp/vg-k8s-work/app /tmp/vg-k8s-work/main.go\n> docker build -t vg-k8s-app:1\
  \ /tmp/vg-k8s-work\n> /tmp/vg-k8s-bin/kind-linux-amd64 load docker-image vg-k8s-app:1 --name vg-k8s\n\
  > kubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n vg-k8s apply -f /tmp/vg-k8s-work/lab.yaml\n\
  > kubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n vg-k8s exec vg-k8s-app -c app\
  \ -- sh\n> ```\n>\n> **Przykład do odczytania — dokładny koniec błędu; pominięto nieudany identyfikator\
  \ exec:**\n>\n> ```text\n> OCI runtime exec failed: exec failed: unable to start container process:\
  \ exec: \"sh\": executable file not found in $PATH\n> ```\n>\n> Błąd dotyczy uruchomienia command, a\
  \ nie dostępności HTTP. Kompilacja, ładowanie i awaria zostały *(zweryfikowane)*.\n\n### Ephemeral container:\
  \ sieć współdzielona, ​​wybrane procesy, osobne pliki\n\n**W skrócie**\n- An ephemeral container ma\
  \ oddzielny system plików\nSieć - The Pod jest współdzielona\n- Widoczność procesu zależy od wybranego\
  \ środowiska namespace i runtime.\n\n**Krótki scenariusz**\n\ndebug container widzi port HTTP aplikacji,\
  \ ale nie może znaleźć jej pliku /app.\n\n**Przewiduj:** Czy jest to sprzeczne z siecią współdzieloną?\n\
  \n> [!question] - Odpowiedź\n> Analiza podanego conditions: Nie. Sieć współdzielona nie oznacza współdzielonego\
  \ katalogu root.\n\n**Polecenie w dowolnym katalogu — przypnij obraz tools, a open shell obok aplikacji:**\n\
  \n```bash\nTOOLS=nicolaka/netshoot@sha256:7f08c4aff13ff61a35d30e30c5c1ea8396eac6ab4ce19fd02d5a4b3b5d0d09a2\n\
  kubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n vg-k8s debug -it vg-k8s-app \\\n\
  \  --image=\"$TOOLS\" --target=app --container=vg-k8s-general --profile=general -- sh\n```\n\n> [!info]\
  \ - Głębsze wyjaśnienie\n> W eksperymencie container był utrzymywany przy życiu za pomocą `sleep 1d`,\
  \ a przez `exec -c vg-k8s-general` uruchamiane były następujące polecenia; powyższy interaktywny formularz\
  \ to *(zgodnie z dokumentacją)*, debugujący działający Pod; połączenie bez TTY zostało *(zweryfikowane)*.\n\
  >\n> | Porównanie | Obserwacja |\n> |---|---|\n> | Bez `--target`, bez `shareProcessNamespace` | `ps`:\
  \ PID 1 to własny `sh`; `/app` nie jest widoczny |\n> | Z `--target=app` | `ps`: PID 1 to `/app`; containerd\
  \ obsługuje wprowadzanie PID namespace |\n> | Sieć w obu przypadkach | `ss` widzi `8080` i `8082`; bez\
  \ widocznego PID pole właściciela jest puste |\n> | Pliki z `--target` | `/root-marker` nie występuje\
  \ w tools container; `/proc/1/root/root-marker` zawiera `scratch-root` |\n> | Przestrzenie nazw | Sieć:\
  \ oba `net:[4026532841]`; montowania systemów plików: `4026533574` i `4026533571` |\n>\n> Tabela została\
  \ *(zweryfikowana)*. `--target` wybiera container przez **name**; nie przenosi swojego systemu plików\
  \ root. W przypadku kontenerów `shareProcessNamespace: true`, zwykłych i ephemeral zobacz procesy Pod\
  \ bez `--target`;\n> w testowanym egzemplarzu PID 1 to `/pause`, a PID 7 to `/app`. To jest pole w szablonie\
  \ dla nowego Pod, a nie przełącznik dla działającego.\n> *(zweryfikowane)* — kopia poniżej; *(wg dokumentacji)*\
  \ — [proces współdzielony namespace](https://kubernetes.io/docs/tasks/configure-pod-container/share-process-namespace/).\n\
  > PID namespace kontroluje widoczność, podczas gdy uprawnienia kontrolują dostęp do innych procesów\
  \ i `/proc/<pid>/root`. Sygnały mogą zatrzymać aplikację: nie zakładaj, że PID 1 jest zawsze Twoim debugger.\n\
  > Przypomnienie: [[Linux-Troubleshooting-Visual-Guide#9. Процессы: состояния, сигналы, зомби и PID 1|Procesy:\
  \ stany, sygnały, zombie i PID 1]] i [[Linux-Troubleshooting-Visual-Guide#14. Пространства имён i cgroups:\
  \ основа контейнеров|Przestrzenie nazw i cgroups: podstawa kontenerów]].\n>\n> **Polecenie w dowolnym\
  \ katalogu — lokalizacje API, które zachowują ephemeral container:**\n>\n> ```bash\n> kubectl --kubeconfig\
  \ /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n vg-k8s get pod vg-k8s-app \\\n>   -o jsonpath='{.spec.ephemeralContainers}{\"\
  \\n\"}{.status.ephemeralContainerStatuses}{\"\\n\"}'\n> ```\n>\n> `spec.ephemeralContainers` przechowuje\
  \ swoje name, obraz, `targetContainerName` i `securityContext`; `status.ephemeralContainerStatuses`\
  \ zawiera `state`, `containerID` i `restartCount`. Ukończony debugger ma\n> `state.terminated` i 0 uruchomień;\
  \ UID i `containerID` aplikacji pozostają niezmienione, z 0 restartami. *(zweryfikowane)*. Już dodanego\
  \ container nie można usunąć/modyfikować i nie uruchamia się automatycznie ponownie.\n> Nowy wpis wymaga\
  \ innego name; cały Pod jest usuwany oddzielnie zgodnie z jego cyklem życia. *(wg dokumentacji)* — [ephemeral\
  \ pojemniki](https://kubernetes.io/docs/concepts/workloads/pods/ephemeral-containers/).\n>\n> **Przykład\
  \ do odczytania — faktyczne odrzucenie API przy próbie usunięcia pierwszego wpisu:**\n>\n> ```text\n\
  > The Pod \"vg-k8s-app\" is invalid: spec.ephemeralContainers: Forbidden: existing ephemeral containers\
  \ \"vg-k8s-isolated\" may not be removed\n> ```\n\n### Wywołania systemowe: najpierw zobacz proces,\
  \ a następnie uzyskaj pozwolenie na śledzenie\n\n**W skrócie**\n- Wyświetlenie PID nie przyznaje uprawnień\
  \ do śledzenia\n- Sprawdź osobno UID i dodatkowe uprawnienia\nWywołanie systemowe - A pokazuje, gdzie\
  \ proces wchodzi w interakcję z jądrem.\n\n**Krótki scenariusz**\n\ndebugger widzi proces, ale ptrace\
  \ zwraca Operation not permitted.\n\n**Przewiduj:** Czy wystarczy ponowne sprawdzenie tego samego PID?\n\
  \n> [!question] - Odpowiedź\n> Analiza podanego conditions: Nie. Sprawdź wymagane uprawnienia i ograniczenia\
  \ bezpieczeństwa, zamiast zmieniać na ślepo PIDs.\n\n**Polecenie w dowolnym katalogu — najpierw użyj\
  \ profilu bez dodatkowych uprawnień do śledzenia:**\n\n```bash\nkubectl --kubeconfig /tmp/vg-k8s-kubeconfig\
  \ --context kind-vg-k8s -n vg-k8s debug vg-k8s-app \\\n  --image=\"$TOOLS\" --target=app --container=vg-k8s-baseline\
  \ --profile=baseline \\\n  -- sh -c 'ps -eo pid,args; timeout 3 strace -p 1 -e trace=openat'\nkubectl\
  \ --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n vg-k8s logs vg-k8s-app -c vg-k8s-baseline\n\
  ```\n\n`strace` pokazuje wywołania procesu do jądra; `lsof` łączy deskryptory z plikami i gniazdami.\
  \ Ich składnia general nie jest tutaj powtarzana: [[Linux-Troubleshooting-Visual-Guide#10. Дескрипторы,\
  \ ограничения, lsof i strace|Deskryptory, ograniczenia, lsof i strace]].\nTutaj potrzebujemy dostępu\
  \ do innego PID; Dodano `-f` dla wielowątkowego procesu Go.\n\n> [!info] - Głębsze wyjaśnienie\n> **Przykład\
  \ do odczytania — odrzucenie śledzenia, następnie wynik w container `vg-k8s-general`:**\n>\n> ```text\n\
