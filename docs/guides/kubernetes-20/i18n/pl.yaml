  \ śledzenia capabilities; Zaobserwowano awarię `strace` |\n> | `restricted` | Upuszcza capabilities,\
  \ ustawia `runAsNonRoot`, zapobiega eskalacji i używa `RuntimeDefault`; nie jest to profil ptrace |\n\
  > | `netadmin` | Dodaje `NET_ADMIN` i `NET_RAW` dla sieci tools; nie dodaje `SYS_PTRACE` |\n> | `sysadmin`\
  \ | `privileged: true`; szeroki dostęp, używany w tym eksperymencie tylko na posiadanym węźle kind |\n\
  >\n> *(wg dokumentacji)* — [Wdrożenie profilu kubectl v0.37.0](https://raw.githubusercontent.com/kubernetes/kubectl/v0.37.0/pkg/cmd/debug/profiles.go);\n\
