  \ należą do **klienta kubectl**: sprawdź jego `debug --help`, zamiast przenosić starą wartość `legacy`\
  \ z przykładowej dokumentacji do tej wersji.\n\n### Sieć wewnątrz Pod: port, DNS, backend i pakiety\n\
  \n**W skrócie**\n- Porty, DNS i pakiety odpowiadają na różne pytania\n- A Service może wskazywać na\
  \ nieprawidłowy targetPort\n- Najpierw połącz adresy objęte konkretnym żądaniem.\n\n**Krótki scenariusz**\n\
  \nProces nasłuchuje na 8080, ale Service przekazuje na 9999.\n\n**Przewiduj:** Czy pomyślne rozwiązanie\
  \ DNS naprawi nieprawidłowe targetPort?\n\n> [!question] - Odpowiedź\n> Analiza podanego conditions:\
  \ Nie. name został rozwiązany, ale port docelowy jest nieprawidłowy.\n\n**Polecenie wewnątrz debug container\
  \ `vg-k8s-general` — oddziel trzy kontrole:**\n\n```bash\nss -ltnp\ndig +short vg-k8s-ok.vg-k8s.svc.cluster.local\n\
  curl -sS --max-time 2 http://vg-k8s-ok\ncurl -sS --max-time 2 http://vg-k8s-empty\ncurl -sS --max-time\
  \ 2 http://vg-k8s-wrong\ncurl -sS --max-time 2 http://127.0.0.1:8082\n```\n\n`ss -ltnp` sprawdza adres\
  \ nasłuchiwania, zapytanie DNS sprawdza name, a `curl` sprawdza połączenie i odpowiedź protokołu. ClusterIP\
  \ i port Service różnią się od adresu Pod i `targetPort`; działający DNS nie jest gotowym endpoint.\n\
  Przypomnienie: [[Linux-Troubleshooting-Visual-Guide#15. Сеть: слушающие порты и смысл ошибок|Sieć: porty\
  \ nasłuchiwania i znaczenie błędów]] i [[Networking-Visual-Guide#19. Kubernetes: адрес пода, виртуальный\
  \ Service i реальные получатели|Kubernetes: Pod adres, wirtualny Service i rzeczywiste backendy]].\n\
  \n> [!info] - Głębsze wyjaśnienie\n> **Przykład do odczytania — wybrane dokładne linie z nowego przebiegu:**\n\
  >\n> ```text\n> LISTEN 0      4096               *:8080            *:*    users:((\"app\",pid=1,fd=4))\n\
  > 10.96.166.152\n> ok\n> curl: (7) Failed to connect to vg-k8s-empty port 80 after 1003 ms: Could not\
  \ connect to server\n> curl: (7) Failed to connect to vg-k8s-wrong port 80 after 2 ms: Could not connect\
  \ to server\n> curl: (56) Recv failure: Connection reset by peer\n> ```\n>\n> Pierwszy nieprawidłowy\
  \ Service EndpointSlice zawierał `ready: false`; drugi zawierał `ready: true` i port `9999`. Dwie różne\
  \ defekty powodują błąd klienta tej samej klasy; sprawdź adresy i readiness przed zmianą sieci. *(zweryfikowane)*.\n\
  >\n> **`deny.yaml` w `/tmp/vg-k8s-work` — blokuje wszystkie połączenia wychodzące z wyjątkiem DNS:**\n\
  >\n> ```yaml\n> apiVersion: networking.k8s.io/v1\n> kind: NetworkPolicy\n> metadata: {name: vg-k8s-deny,\
  \ namespace: vg-k8s}\n> spec:\n>   podSelector: {matchLabels: {app: vg-k8s-app}}\n>   policyTypes: [Egress]\n\
  >   egress:\n>   - ports:\n>     - {protocol: UDP, port: 53}\n>     - {protocol: TCP, port: 53}\n> ```\n\
  >\n> **Polecenie w dowolnym katalogu — przechwytywanie pakietów container i aktywacja polityki:**\n\
  >\n> ```bash\n> kubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n vg-k8s debug vg-k8s-app\
  \ \\\n>   --image=\"$TOOLS\" --target=app --container=vg-k8s-network --profile=netadmin -- sleep 1d\n\
  > kubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n vg-k8s apply -f /tmp/vg-k8s-work/deny.yaml\n\
  > ```\n>\n> **Polecenie w debug container `vg-k8s-network` — przechwytywanie na interfejsie Pod:**\n\
  >\n> ```bash\n> timeout 5 tcpdump -ni eth0 -c 3 tcp > /tmp/policy.packets 2>&1 & t=$!\n> sleep 1\n>\
  \ dig +short vg-k8s-ok.vg-k8s.svc.cluster.local\n> curl -sS --connect-timeout 3 --max-time 4 http://vg-k8s-ok\n\
  > wait \"$t\"\n> cat /tmp/policy.packets\n> ```\n>\n> **Przykład do odczytania — DNS działa, z odpowiedzią\
  \ no na trzy pakiety SYN; linie przechwytywania są pokazane w całości:**\n>\n> ```text\n> 10.96.166.152\n\
  > curl: (28) Connection timed out after 3002 milliseconds\n> 11:32:59.077297 IP 10.244.1.2.47308 > 10.96.166.152.80:\
  \ Flags [S], seq 586176593, win 42340, options [mss 1460,sackOK,TS val 1598642578 ecr 0,nop,wscale 9],\
  \ length 0\n> 11:33:00.112702 IP 10.244.1.2.47308 > 10.96.166.152.80: Flags [S], seq 586176593, win\
  \ 42340, options [mss 1460,sackOK,TS val 1598643614 ecr 0,nop,wscale 9], length 0\n> 11:33:01.137689\
  \ IP 10.244.1.2.47308 > 10.96.166.152.80: Flags [S], seq 586176593, win 42340, options [mss 1460,sackOK,TS\
  \ val 1598644639 ecr 0,nop,wscale 9], length 0\n> ```\n>\n> W tej konfiguracji testowej `kindnetd:v20260820-69b56db7`\
  \ **wymusza NetworkPolicy**: reguła odmowy spowodowała timeout, a HTTP zwróciło `ok` ponownie after,\
  \ zasada została usunięta. *(zweryfikowane)*. Instalowanie kolejnego CNI było tutaj niepotrzebne.\n\
  > Przed powtórzeniem usuń polisę za pomocą `kubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s\
  \ -n vg-k8s delete -f /tmp/vg-k8s-work/deny.yaml`.\n> Bez dodatku DNS pierwszy wariant odmowy wygenerował\
  \ `curl: (28) Resolving timed out after 2001 milliseconds`. W przypadku `vg-k8s-wrong` to samo przechwytywanie\
