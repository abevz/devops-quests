  \ such file or directory)\n> ```\n>\n> **Polecenie wewnątrz debug container `vg-k8s-general` — ślad\
  \ roboczy:**\n>\n> ```bash\n> id\n> grep -E 'CapEff|Seccomp|Uid' /proc/self/status\n> timeout 3 strace\
  \ -f -p 1 -e trace=openat\n> ```\n>\n> W obu przypadkach zastosowano UID 0; pasujący użytkownicy nie\
  \ zastąpili `SYS_PTRACE`. W `general`: `CapEff: 00000000a80c25fb`, `Seccomp: 0`; odnaleziono brakujący\
  \ `/config/app.yaml`.\n> `timeout` zatrzymał obserwację z kodem exit 143, a `strace` został odłączony;\
  \ aplikacja nadal działała. *(zweryfikowane)*. Jeśli PID jest niewidoczny, sprawdź `--target` i runtime;\
  \ jeśli jest widoczny, ale dostęp jest zabroniony, sprawdź uprawnienia, UID, seccomp i LSM.\n> Identyczny\
  \ UID pomaga tylko wtedy, gdy śledzenie jest dozwolone i pozwala na to proces state; Yama może wymagać\n\
  > relacja rodzic-dziecko lub `SYS_PTRACE`. *(wg dokumentacji)* — [Yama, dokumentacja jądra](https://www.kernel.org/doc/html/latest/admin-guide/LSM/Yama.html).\n\
  > Uprawnienia jądra i seccomp to osobne kontrole; dodanie capability nie wyłącza jawnie skonfigurowanej\
  \ polityki seccomp. Przypomnienie: [[Security-Visual-Guide#6. Привилегии ядра, no-new-privileges i seccomp:\
  \ три разных ограничения|Uprawnienia jądra, no-new-privileges i seccomp: trzy oddzielne ograniczenia]].\n\
  >\n> | Profil kubectl 1.37.0 | Cel i granica |\n> |---|---|\n> | `general` | Domyślny; dodaje `SYS_PTRACE`\
