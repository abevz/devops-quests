  \ z `-c 3`, trzeci pakiet to SYN-ACK (`Flags [S.]`). *(zweryfikowane)*.\n> **Przykład do odczytania\
  \ — odpowiedź zamkniętego portu z przechwytywania:**\n>\n> ```text\n> 11:34:33.930659 IP 10.244.1.2.9999\
  \ > 10.244.1.1.33615: Flags [R.], seq 0, ack 2968960123, win 0, length 0\n> 11:34:33.930670 IP 10.96.238.53.80\
  \ > 10.244.1.2.35022: Flags [R.], seq 0, ack 2968960123, win 0, length 0\n> ```\n>\n> Odrzucenie w SYN\
  \ oznacza, że połączenie nie zostało nawiązane; timeout oznacza brak oczekiwanej odpowiedzi; a reset\
  \ after żądanie oznacza, że ​​strumień został przerwany. Sam błąd text nie identyfikuje odpowiedzialnego\
  \ komponentu: [[Networking-Visual-Guide#7. Ошибки клиента: симптом и источник решения|Błędy klienta:\
  \ źródło symptomów i decyzji]].\n> `tcpdump` pokazuje pakiety w punkcie przechwytywania; `traceroute`\
  \ sprawdza odpowiedzi na sondy i nie zastępuje przechwytywania.\n> Przypomnienie: [[Linux-Troubleshooting-Visual-Guide#16.\
  \ traceroute i tcpdump: увидеть путь и факт обмена|traceroute i tcpdump: obserwujące ścieżkę i rzeczywistą\
  \ wymianę]].\n\n### Awaria przed nawiązaniem połączenia: sprawdź kopię\n\n**W skrócie**\nKopia - A Pod\
  \ pomaga zbadać szybką awarię\n- Kopia command musi istnieć na jej obrazie\n- Kopiowanie obiektu nie\
  \ powoduje zainstalowania tools.\n\n**Krótki scenariusz**\n\nObraz original scratch zawiera tylko /app..\
  \ Kopia powinna działać z sleep.\n\n**Prognoza:** Czy sleep zostanie uruchomiony bez dodania innego\
  \ obrazu?\n\n> [!question] - Odpowiedź\n> Analiza podanego conditions: Nie. API może przyjąć kopię,\
  \ ale runtime nie znajdzie executable.\n\n**Polecenie w dowolnym katalogu — najpierw wadliwa kopia,\
  \ następnie kopia z obrazem zastępczym:**\n\n```bash\nkubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context\
  \ kind-vg-k8s -n vg-k8s debug vg-k8s-crash \\\n  --copy-to=vg-k8s-copy-fails --container=app -- sleep\
  \ 1d\nkubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n vg-k8s debug vg-k8s-crash\
  \ \\\n  --copy-to=vg-k8s-copy --container=app --set-image=\"app=$TOOLS\" --share-processes -- sleep\
  \ 1d\nkubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n vg-k8s events --for pod/vg-k8s-copy-fails\
  \ --types=Warning\n```\n\n> [!info] - Głębsze wyjaśnienie\n> **Przykład do odczytania — dokładny koniec\
  \ błędu container-runtime:**\n>\n> ```text\n> exec: \"sleep\": executable file not found in $PATH\n\
  > ```\n>\n> Kopia API powiodła się, ale pierwsza kopia otrzymała `RunContainerError`; `scratch` również\
  \ nie zawiera `sleep`.\n> W drugim egzemplarzu `app` to tools container i `Running`: proces original\
  \ Go jest dłużej reprodukowany jako no.\n> original Pod pokazał `CrashLoopBackOff`, powód zakończenia\
  \ `Error` i exit kod 3. *(zweryfikowany)*.\n> Aby zachować aplikację, dodaj tools do kopii, zamiast\
  \ zastępować jej obraz.\n>\n> **Polecenie w dowolnym katalogu — kopia z dwoma kontenerami i współdzielonym\
  \ PID namespace:**\n>\n> ```bash\n> kubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s\
  \ -n vg-k8s debug vg-k8s-app \\\n>   --copy-to=vg-k8s-shared --container=vg-k8s-tools --image=\"$TOOLS\"\
  \ --share-processes -- sleep 1d\n> kubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s\
  \ -n vg-k8s exec vg-k8s-shared -c vg-k8s-tools -- ps -eo pid,args\n> ```\n>\n> Bez `--target` wyświetla\
  \ `/pause` (PID 1), `/app` (PID 7) i `sleep 1d` (PID 24). *(zweryfikowane)*.\n> Kopie otrzymały nowy\
  \ UID/IP i usunięto ich etykiety; Service ich nie wybiera. Wszystko wylądowało na `vg-k8s-worker`,\n\
  > ale nie jest to gwarantowane: `--same-node` nie zostało tutaj określone. Udostępnianie PID zostało\
  \ włączone poprzez `--share-processes`.\n> Skopiowano definicje woluminów: `emptyDir` jest nowy i jego\
  \ zawartość nie została skopiowana. W original `/data/marker`,\n> `changed` został napisany poprzez\
  \ `/proc/1/root`; nowy działający egzemplarz miał numer `original`. *(zweryfikowane)*.\n> PVC może pozostać\
  \ odniesieniem do **tego samego** claim; zawartość pamięci i state martwego procesu nie są kopiowane.\n\
  > `--keep-labels` może wysyłać do kopii rzeczywisty ruch Service; sprawdź init-container i sondę options.\n\
  > *(zgodnie z dokumentacją)* — [kubectl debug referencja](https://kubernetes.io/docs/reference/kubectl/generated/kubectl_debug/).\n\
  \n### Z węzła: CRI, węzła root i wpisania konkretnego namespace\n\n**W skrócie**\n- Debugowanie węzła\
  \ zapewnia szerszy dostęp\n- chroot zmienia system plików root, nie każdy namespace\n- nsenter wybiera\
  \ konkretny proces namespace.\n\n**Krótki scenariusz**\n\nPo chroot /host, command nadal korzysta ze\
  \ swojej sieci previous namespace.\n\n**Prognoza:** Czy chroot powinien automatycznie udostępniać wymaganą\
  \ sieć Pod?\n\n> [!question] - Odpowiedź\n> Analiza podanego conditions: Nie. Wprowadź osobno odpowiednią\
  \ sieć namespace; jest to analiza pisemna i nie przeprowadzono debugowania privileged.\n\n**Polecenie\
  \ w dowolnym katalogu — tylko węzeł we własnym klastrze jednorazowym:**\n\n```bash\nkubectl --kubeconfig\
  \ /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n vg-k8s debug node/vg-k8s-worker \\\n  --image=\"$TOOLS\"\
  \ --profile=sysadmin -- sleep 1d\n```\n\n> [!info] - Głębsze wyjaśnienie\n> Utworzono `node-debugger-vg-k8s-worker-gjdfp`;\
  \ w przypadku wariantu interaktywnego dodaj `-it` i zamień `sleep 1d` na `sh`.\n> Eksperyment wprowadzono\
  \ od `debugger` do `exec`. `/host` to root węzła **kind container**, a nie maszyna właściciela.\n> Przestrzenie\
  \ nazw PID, network i IPC odpowiadają węzłowi; uchwyt namespace pozostał oddzielny. *(zweryfikowane)*.\n\
  > `chroot /host` zmienia root używany dla ścieżek; sam nie wchodzi do innych przestrzeni nazw.\n>\n\
  > **Polecenie wewnątrz węzła - debug container — znajdź target container i użyj węzła tools:**\n>\n\
  > ```bash\n> chroot /host crictl ps\n> chroot /host crictl inspect -o json c7a6edaa4cdd0 > /tmp/container.json\n\
  > chroot /host crictl logs --tail=2 c7a6edaa4cdd0\n> chroot /host journalctl -u kubelet -u containerd\
  \ -n 3 --no-pager\n> ```\n>\n> Dla węzła shell użyj `chroot /host`; tutaj każdy command używa oddzielnie\
  \ swojego root i narzędzi.\n> Przeczytaj `info.pid` z JSON; parsowanie w eksperymencie miało miejsce\
  \ na zewnątrz. `crictl ps` pasuje do name, Pod i namespace; `inspect` dostarczony PID **927**,\n> i\
  \ `logs` zwróciło `open /config/app.yaml: no such file or directory`. *(zweryfikowane)*.\n> Węzeł CRI\
  \ endpoint: `unix:///run/containerd/containerd.sock` z `/etc/crictl.yaml`.\n> Kubelet i containerd to\
  \ aktywne usługi systemd; logs zostały przeczytane w dzienniku, a wniosek logs znalazł się w `/var/log/pods/.../app/0.log`.\n\
  > `/var/log/kubelet.log` i `/var/log/containerd.log` nie istnieją: `No such file or directory`. *(zweryfikowane)*.\n\
  >\n> **Polecenie wewnątrz węzła-debug container — after opuszcza chroot, używając PID z inspect:**\n\
  >\n> ```bash\n> nsenter -t 927 -n ss -ltnp\n> nsenter -t 927 -m /bin/sh\n> nsenter -t 927 -m /app crash\n\
  > nsenter -t 927 -p sh -c 'grep NSpid /proc/self/status'\n> cat /proc/927/root/root-marker\n> ```\n\
  >\n> `-n`: Widoczne są `8080`/`8082`, własność `/app`, węzeł PID 927.\n> `-m`: `/bin/sh` znów jest nieobecny\
  \ — `nsenter: failed to execute /bin/sh: No such file or directory`;\n> statyczny `/app crash` został\
  \ uruchomiony i zwrócił kod exit 3. Możesz przeczytać `/proc/927/root` bez konieczności posiadania shell\
  \ wewnątrz target.\n> `-p`: nowy shell ma `NSpid: 2243 118`; bez `-m` i nowo zamontowanego polecenia\
  \ `/proc`, `ps` mogą wyświetlać listę procesów węzła.\n> Te wartości PID należą do tego przebiegu: zawsze\
  \ uzyskaj je na nowo. *(zweryfikowane)*.\n> W przypadku `general` węzeł `chroot` **działał**, ale `nsenter\
  \ -n` został odrzucony:\n> `nsenter: reassociate to namespaces failed: Operation not permitted`. Nieuprzywilejowany\
  \ nie oznacza „bez capabilities”.\n> *(zweryfikowane)*; celem trybu debugowania węzła jest *(zgodnie\
  \ z dokumentacją)*, [debugowanie węzła ](https://kubernetes.io/docs/tasks/debug/debug-cluster/kubectl-node-debug/).\n\
  > Ukończony węzeł debugger `node-debugger-vg-k8s-worker-pnhx6` pozostał `Failed`, z 0 ponownymi uruchomieniami.\n\
  > Wyjście z shell nie powoduje usunięcia obiektu; oba węzły Pody zostały usunięte ręcznie. *(zweryfikowane)*.\n\
  > **Polecenie w dowolnym katalogu — usuń dokładnie utworzony tutaj węzeł Pods:**\n>\n> ```bash\n> kubectl\
  \ --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n vg-k8s delete pod \\\n>   node-debugger-vg-k8s-worker-gjdfp\
  \ node-debugger-vg-k8s-worker-pnhx6\n> ```\n\n### Powiązane podejścia i granice uprawnień\n\n**W skrócie**\n\
  - Wybierz narzędzie dla obserwowanej warstwy\n- Uprawnienia powinny odpowiadać wymaganej operacji\n\
  Szerszy profil - A nie zastępuje dowodu przyczyny.\n\n**Krótki scenariusz**\n\nKtoś proponuje natychmiastowe\
  \ rozpoczęcie debugowania węzła privileged w celu odczytania previous logs container.\n\n**Przewiduj:**\
  \ Czy jest to potrzebne w przypadku tego konkretnego pierwszego kroku?\n\n> [!question] - Odpowiedź\n\
  > Analiza podanego conditions: Nie. Zacznij od dozwolonego dostępu logs --previous; szersze uprawnienia\
  \ potrzebne są jedynie do uzasadnionej kolejnej operacji.\n\n- A tools container obok aplikacji, sidecar,\
  \ przydaje się do regularnego rozwiązywania problemów lub gdy ephemeral-container API jest niedostępny.\n\
  \  Dodaj go do szablonu nowego Pod; udostępnij współdzielony system plików poprzez volume. Przykładowy\
  \ projekt — *(wg dokumentacji)*, [netshoot](https://github.com/nicolaka/netshoot).\n- `kubectl exec\
  \ -c <tools>` wchodzi do już działającego tools container. Z `shareProcessNamespace: true`,\n  może\
  \ zobaczyć aplikację; powyższy testowany egzemplarz demonstruje takie podejście. *(zweryfikowane)*.\n\
  - `kubectl port-forward pod/vg-k8s-app 18080:8080` z oddzielnym kubeconfig zwrócił `ok` w `127.0.0.1:18080`.\n\
  \  To jest ścieżka przez API/kubelet do Pod; powodzenie nie testuje DNS/ClusterIP ani normalnej trasy\
  \ klienta. *(zweryfikowane)*.\n- `kubectl cp` uruchamia `tar` w target container: naszą porażką był\
  \ `exec: \"tar\": executable file not found in $PATH`.\n  Przeczytaj tools i `/proc/<pid>/root`; jak\
  \ działa `cp` to *(wg dokumentacji)*, [kubectl cp](https://kubernetes.io/docs/reference/kubectl/generated/kubectl_cp/);\
  \ awaria była *(zweryfikowana)*.\n- `kubectl logs --previous -c app` wybiera zakończoną instancję. Tutaj\
  \ dwa requests nie odzyskały swojego logs,\n  i dalsze próby wstrzymane; aktualne logs i CRI pozostały\
  \ dostępne. Dokładny text i ograniczenia: §21.\n- `kubectl events --for pod/<name>` i `describe pod`\
  \ pokazują błędy uruchamiania/wycofywania, a nie wywołania systemowe.\n  Obydwa zostały użyte w nieprawidłowej\
  \ kopii/awarii Pod. *(zweryfikowane)*.\nEphemeral containers wymaga `get` w Pod i `patch`/`update` w\
  \ **`pods/ephemeralcontainers`**; attach/exec wymagają własnych uprawnień.\nTworzenie kopii lub węzła\
  \ debugger wymaga `create pods`; węzeł Pod również wymaga zezwolenia na dostęp do host.\n*(zgodnie z\
  \ dokumentacją)* — [RBAC](https://kubernetes.io/docs/reference/access-authn-authz/rbac/) i debugowanie\
  \ węzłów.\n`auth can-i patch pods/ephemeralcontainers`: administrator otrzymał `yes`, default ServiceAccount\
  \ `no`. *(zweryfikowane)*.\nPSA sprawdza również kontenery ephemeral: w przypadku `baseline:v1.37` nasz\
  \ `general` został odrzucony ze względu na dodany capabilities;\nwęzeł `sysadmin` został odrzucony dla\
  \ `hostNetwork`, `hostPID`, `hostIPC`, `hostPath` i `privileged`. Z `restricted:v1.37`,\nnastąpiło również\
  \ odrzucenie. Etykieta enforce nie zatrzymała istniejących procesów. *(zweryfikowane)*.\n**Przykład\
  \ do przeczytania — dokładnie odpowiedni fragment węzła-Pod odmowa przyjęcia:**\n\n> [!info] - Głębsze\
  \ wyjaśnienie\n> ```text\n> violates PodSecurity \"baseline:v1.37\": host namespaces (hostNetwork=true,\
  \ hostPID=true, hostIPC=true), hostPath volumes (volume \"host-root\"), privileged (container \"debugger\"\
  \ must not set securityContext.privileged=true)\n> ```\n>\n> Profil `restricted` nie naprawia innych\
  \ niepewnych kontenerów w istniejącym Pod.\n> Przypomnienie: [[Security-Visual-Guide#14. Pod Security\
  \ i собственный допуск: отказы на разных свойствах|Pod Security i custom dopuszczenie: odrzucanie różnych\
  \ właściwości]].\n> Węzeł privileged Pod z katalogiem głównym/przestrzeniami nazw węzła daje możliwość\
  \ przejęcia całego węzła:\n> dostęp do CRI, innych kontenerów i sekretów. Jest to granica techniczna;\
  \ udzielić pozwolenia na określone zdarzenie.\n> Zapisz operatora, target, obraz/skrót, profil, time\
  \ i powód; API audit musi zachować operacje\n> o tworzeniu `pods/ephemeralcontainers`, Pod i attach/exec.\
  \ Nie zastępuje poleceń rejestrowania wewnątrz shell.\n> *(wg dokumentacji)* — [Kubernetes audyt ](https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/);\
  \ konfiguracja audytu tutaj była *(nie testowana)*.\n> Uzyskaj obrazy tools z kontrolowanego rejestru,\
  \ sprawdź pochodzenie i luki w zabezpieczeniach, a następnie przypnij digest,\n> nie `latest`; nie zostawiaj\
  \ tools ani przechwytów zawierających sekrety w production. Jest to zalecana praktyka, a nie testowanie\
  \ rejestru.\n>\n> | Objaw | Pierwsze narzędzie | Następne narzędzie |\n> |---|---|---|\n> | Nie shell,\
  \ proces aktywny | `logs`, `describe` | `debug --target`, następnie `ps`/`ss` |\n> | Proces widoczny,\
  \ ptrace odrzucony | UID, capabilities, seccomp | Zatwierdzony profil i `strace -f -p` |\n> | Nie można\
  \ odczytać konfiguracji | Logi zawierające ścieżkę | `/proc/<pid>/root`, `strace` z `openat` |\n> |\
  \ Service name nie rozwiązuje | `dig`, `/etc/resolv.conf` | DNS zdarzenia, UDP/TCP 53 przechwytywanie\
  \ |\n> | DNS działa, TCP nie działa | EndpointSlice i `ss` | `curl`, `tcpdump`: SYN/RST lub ponowne\
  \ próby |\n> | Za mało time do połączenia | `logs --previous`, `lastState` | `debug --copy-to`, w razie\
  \ potrzeby z `--set-image` |\n> | Awaria kilku kapsuł w węźle | Node conditions, wydarzenia | Węzeł\
  \ `debug`, CRI, kubelet/containerd dziennik |\n>\n> **Przewiduj:** przechwycenie pokazuje trzy pakiety\
  \ SYN do `10.96.166.152:80`, DNS zwrócił ten adres i jest tam no SYN-ACK.\n> Czy to dowodzi, że proces\
  \ Go nie nasłuchuje na `8080`?\n>\n> > [!question] - Odpowiedź\n> > Nie. W rzeczywistym eksperymencie\
  \ nasłuchiwał, a Service miał gotowy endpoint; wyjście NetworkPolicy zablokowało odpowiedź.\n> > Usunięcie\
  \ go przywróciło `ok`. Przechwytywanie po stronie klienta pokazuje, że nie ma tutaj odpowiedzi, ale\
  \ nie identyfikuje samego miejsca upuszczenia. *(zweryfikowane)*.\n>\n> **Krótka odpowiedź w języku\
  \ angielskim — Pod bez shell:**\n>\n> > I check logs and events first. I add an ephemeral container\
  \ with a trusted tools image and target the app container.\n> > It shares the Pod network; process access\
  \ depends on the runtime and permissions. I can read the app files through `/proc/<pid>/root`.\n> >\
  \ I use the smallest allowed debug profile and do not rebuild the running image just to add a shell.\n\
  >\n> **Krótka odpowiedź w języku angielskim — CrashLoopBackOff:**\n>\n> > I check previous logs, events\
  \ and the last exit reason. If the app stops too fast, I create a separate debug copy.\n> > I change\
  \ its command or use a tools image; `sleep` will not work if it is missing from the original image.\n\
  > > The copy has new process state and may have new volume data, so I compare it with the original Pod."
