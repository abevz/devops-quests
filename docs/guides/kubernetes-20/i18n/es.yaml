  > **Comando en cualquier directorio — delete exactamente el nodo Pods created aquí:**\n>\n> ```bash\n\
  > kubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n vg-k8s delete pod \\\n>   node-debugger-vg-k8s-worker-gjdfp\
  \ node-debugger-vg-k8s-worker-pnhx6\n> ```\n\n### Enfoques relacionados y límites de permisos\n\n**De\
  \ un vistazo**\n- Elija una herramienta para la capa observada\n- Los permisos deben coincidir con la\
  \ operación requerida\nEl perfil más amplio - A no reemplaza la evidencia de la causa.\n\n**Escenario\
  \ breve**\n\nAlguien propone iniciar la depuración del nodo privileged inmediatamente para leer un previous\
  \ logs de un container.\n\n**Predecir:** ¿Es necesario para este primer paso específico?\n\n> [!question]-\
  \ Respuesta\n> Análisis del conditions dado: No. Comience con el acceso permitted logs --previous; Se\
  \ necesitan permisos más amplios sólo para una siguiente operación justificada.\n\n- A tools container\
  \ junto a la aplicación, un sidecar, es útil para la resolución de problemas habituales o cuando el\
  \ contenedor efímero API no está disponible.\n  Agréguelo a la plantilla para un nuevo Pod; Proporcionar\
  \ un sistema de archivos compartido a través de un volume. Proyecto de ejemplo: *(según la documentación)*,\
  \ [netshoot](https://github.com/nicolaka/netshoot).\n- `kubectl exec -c <tools>` ingresa a un tools\
  \ container que ya se está ejecutando. Con `shareProcessNamespace: true`,\n  puede ver la aplicación;\
  \ La copia probada arriba demuestra este enfoque. *(verificado)*.\n- `kubectl port-forward pod/vg-k8s-app\
  \ 18080:8080` con un kubeconfig separado devolvió `ok` en `127.0.0.1:18080`.\n  Este es un camino a\
  \ través del API/kubelet hasta el Pod; El éxito no prueba DNS/ClusterIP ni la ruta normal del cliente.\
  \ *(verificado)*.\n- `kubectl cp` ejecuta `tar` en el objetivo container: nuestro error fue `exec: \"\
  tar\": executable file not found in $PATH`.\n  Lea tools y `/proc/<pid>/root`; cómo funciona `cp` es\
  \ *(según la documentación)*, [kubectl cp](https://kubernetes.io/docs/reference/kubectl/generated/kubectl_cp/);\
  \ el fallo fue *(verificado)*.\n- `kubectl logs --previous -c app` selecciona la instancia terminada.\
  \ Aquí dos requests failed para recuperar su logs,\n  y se detuvieron más intentos; Los actuales logs\
  \ y CRI permanecieron accesibles. Texto exacto y límites: §21.\n- `kubectl events --for pod/<name>`\
  \ y `describe pod` muestran fallas de startup/BackOff, no llamadas al sistema.\n  Ambos se utilizaron\
  \ en el copy/crashing Pod incorrecto. *(verificado)*.\nEphemeral containers requiere `get` en Pod y\
  \ `patch`/`update` en **`pods/ephemeralcontainers`**; attach/exec requiere sus propios permisos.\nPara\
  \ crear una copia o nodo debugger se requiere `create pods`; el nodo Pod también necesita admisión para\
  \ acceder al host.\n*(según la documentación)* — [RBAC](https://kubernetes.io/docs/reference/access-authn-authz/rbac/)\
  \ y depuración de nodos.\n`auth can-i patch pods/ephemeralcontainers`: el administrador recibió `yes`,\
  \ el valor predeterminado ServiceAccount `no`. *(verificado)*.\nPSA también verifica ephemeral containers:\
  \ con `baseline:v1.37`, nuestro `general` fue rechazado por su capabilities agregado;\nEl nodo `sysadmin`\
  \ fue rechazado para `hostNetwork`, `hostPID`, `hostIPC`, `hostPath` y `privileged`. Con `restricted:v1.37`,\n\
  También se produjo el rechazo. La etiqueta enforce no detuvo los procesos existentes. *(verificado)*.\n\
  **Ejemplo de lectura: porción relevante exacta del rechazo de admisión del nodo-Pod:**\n\n> [!info]-\
  \ Explicación más profunda\n> ```text\n> violates PodSecurity \"baseline:v1.37\": host namespaces (hostNetwork=true,\
  \ hostPID=true, hostIPC=true), hostPath volumes (volume \"host-root\"), privileged (container \"debugger\"\
  \ must not set securityContext.privileged=true)\n> ```\n>\n> El perfil `restricted` no repara otros\
  \ containers inseguros en un Pod existente.\n> Recordatorio: [[Security-Visual-Guide#14. Pod Security\
  \ и собственный допуск: отказы на разных свойствах|Pod Security and custom admission: rejecting different\
  \ properties]].\nEl nodo > A privileged Pod con el nodo root/namespaces otorga el poder de hacerse cargo\
  \ de todo el nodo:\n> acceso a CRI, otros containers y secretos. Este es un límite técnico; otorgar\
  \ permisos para un incidente específico.\n> Registre el operador, objetivo, image/digest, perfil, hora\
  \ y motivo; API audit debe conservar operaciones\n> on creación de `pods/ephemeralcontainers`, Pod y\
  \ attach/exec.. No reemplaza los comandos de registro dentro de shell.\n> *(según documentación)* —\
  \ [Kubernetes auditoría](https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/); La configuración\
  \ de audit aquí fue *(no probada)*.\n> Oobtener imágenes tools de un registro controlado, procedencia\
  \ y vulnerabilidades de verify, y fijar un digest,\n> no `latest`; no dejar tools ni capturas que contengan\
  \ secretos en production. Esta es una práctica recomendada, no una prueba de registro.\n>\n> | Síntoma\
  \ | Primera herramienta | Siguiente herramienta |\n> |---|---|---|\n> | No shell, proceso activo | `logs`,\
  \ `describe` | `debug --target`, luego `ps`/`ss` |\n> | Process visible, ptrace denegado | UID, capabilities,\
  \ seccomp | Perfil aprobado y `strace -f -p` |\n> | Configuración cannot ser leída | Registros que contienen\
  \ la ruta | `/proc/<pid>/root`, `strace` con `openat` |\n> | El nombre Service no se resuelve | `dig`,\
  \ `/etc/resolv.conf` | DNS events, UDP/TCP 53 captura |\n> | DNS funciona, TCP falla | EndpointSlice\
  \ y `ss` | `curl`, `tcpdump`: SYN/RST o reintentos |\n> | No hay tiempo suficiente para conectarse |\
  \ `logs --previous`, `lastState` | `debug --copy-to`, con `--set-image` si es necesario |\n> | Varios\
  \ Pods en un nodo fallan | Node conditions, events | Diario Node `debug`, CRI, kubelet/containerd |\n\
  >\n> **Predicción:** la captura muestra tres paquetes SYN a `10.96.166.152:80`, DNS devolvió esa dirección\
  \ y no hay ningún SYN-ACK.\n> ¿Esto prueba que el proceso Go no está escuchando en `8080`?\n>\n> > [!question]-\
  \ Respuesta\n> > No. En el experimento real estaba escuchando y el Service tenía un ready endpoint;\
  \ un egress NetworkPolicy bloqueó la respuesta.\n> > Eliminándolo restaurado `ok`. Una captura del lado\
  \ del cliente muestra que la respuesta está ausente aquí, pero no identifica la ubicación de entrega\
  \ en sí. *(verificado)*.\n>\n> **Respuesta corta en inglés — Pod sin shell:**\n>\n> > I verifique primero\
  \ logs y events. Agrego un ephemeral container con una imagen tools confiable y apunto al app container.\n\
  > > It shares o Pod network; El acceso al proceso depende del runtime y de los permisos. Puedo leer\
  \ los archivos app a través de `/proc/<pid>/root`.\n> > I utiliza el perfil debug más pequeño permitido\
  \ y no reconstruye la imagen en ejecución solo para agregar un shell.\n>\n> **Respuesta corta en inglés\
  \ — CrashLoopBackOff:**\n>\n> > I verifique previous logs, events y el último motivo exit. Si el app\
  \ se detiene demasiado rápido, creo una copia separada del debug.\n> > I cambie su command o use una\
  \ imagen tools; `sleep` no funcionará si falta en la imagen original.\n> > La copia tiene un nuevo estado\
  \ de proceso y puede tener un nuevo volume data, por lo que lo compare con el Pod original."
