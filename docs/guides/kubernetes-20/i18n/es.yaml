  \ el Service no los selecciona. Todos aterrizaron en `vg-k8s-worker`,\n> pero eso no está garantizado:\
  \ `--same-node` no se especificó aquí. El uso compartido de PID se habilitó a través de `--share-processes`.\n\
  > Se copiaron las definiciones de volumen: `emptyDir` es nuevo y su contenido no se copia. En el `/data/marker`\
  \ original,\n> `changed` fue escrito a través de `/proc/1/root`; la nueva copia en ejecución decía `original`.\
  \ *(verificado)*.\n> A PVC puede seguir siendo una referencia al **mismo** claim; El contenido de la\
  \ memoria y el estado del proceso inactivo no se copian.\n> `--keep-labels` puede enviar tráfico Service\
  \ real a la copia; verifique el contenedor de inicio y probe options.\n> *(según documentación)* — [kubectl\
  \ debug referencia](https://kubernetes.io/docs/reference/kubectl/generated/kubectl_debug/).\n\n### \
  \ Desde el nodo: CRI, nodo root, e ingresando un namespace específico\n\n**De un vistazo**\nLa depuración\
  \ - Node otorga un acceso más amplio\n- chroot cambia el sistema de archivos root, no todos los namespace\n\
  - nsenter selecciona un proceso específico namespace.\n\n**Escenario breve**\n\nDespués de chroot /host,\
  \ el command todavía usa su previous network namespace.\n\n**Predecir:** ¿Debería chroot exponer automáticamente\
