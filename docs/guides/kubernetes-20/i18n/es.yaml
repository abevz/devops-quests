  \ [[Networking-Visual-Guide#7. Ошибки клиента: симптом и источник решения|Client errors: symptom and\
  \ decision source]].\n> `tcpdump` muestra paquetes en el punto de captura; `traceroute` verifica las\
  \ respuestas a las sondas y no reemplaza una captura.\n> Recordatorio: [[Linux-Troubleshooting-Visual-Guide#16.\
  \ traceroute и tcpdump: увидеть путь и факт обмена|traceroute and tcpdump: observing the path and actual\
  \ exchange]].\n\n### Se bloquea antes de poder conectarse: investigue una copia\n\n**De un vistazo**\n\
  La copia - A Pod ayuda a investigar una falla rápida\n- La copia command debe existir en su imagen.\n\
  -  Copiar un objeto no instala tools.\n\n**Escenario breve**\n\nLa imagen original scratch contiene\
  \ solo /app.. Se supone que la copia debe seguir ejecutándose con sleep.\n\n**Predecir:** ¿sleep comenzará\
