heading: '20. Solución de problemas: pasar de una observación a la capa que falla'
text: "## 20. Solución de problemas: pasar de una observación a la capa defectuosa\n\n**De un vistazo**\n\
  - Iniciar diagnóstico con el fallo observado\n- El mismo síntoma puede tener diferentes causas\n- El\
  \ primer paso debe distinguir entre hipótesis.\n\n**Escenario breve**\n\nUna solicitud HTTP falla, pero\
  \ aún se desconocen la respuesta DNS, endpoint y el puerto de escucha.\n\n**Predecir:** ¿Es suficiente\
  \ reiniciar el Deployment de inmediato?\n\n> [!question]- Respuesta\n> Análisis del conditions proporcionado:\
  \ No. Esta acción no identifica la capa defectuosa y puede destruir evidencia útil.\n\n> [!info] Núcleo\
  \ y referencia\n> El enfoque central de un caso: síntoma → capa → una siguiente verificación → sus límites.\
  \ Cada subsección es un caso separado; no es necesario repetir secuencialmente los mecanismos de los\
  \ apartados 3 a 14. Los tutoriales completos y el artículo 21 son material de referencia.\n\n### Comience\
  \ con el síntoma\n\n**De un vistazo**\n- El síntoma determina dónde comprobar primero\n- Events muestra\
  \ la etapa en la que se detuvo el progreso\n- Process logs son útiles solo después de que comienza el\
  \ proceso.\n\n**Escenario breve**\n\nEl Pod no tiene nodeName y su PodScheduled condition es False.\n\
  \n**Predecir:** ¿Tiene sentido comenzar con la aplicación logs?\n\n> [!question]- Respuesta\n> Análisis\
  \ del conditions proporcionado: Primero investigue la programación utilizando conditions y events: es\
  \ posible que el proceso aún no haya comenzado.\n\n| Síntoma | Caso independiente | Mecanismo |\n|---|---|---|\n\
  | La imagen no load | [[#Полный пример ошибки загрузки образа|ImagePullBackOff]] | §3: estado container\
  \ |\n| Process fue asesinado | [[#Полный пример превышения памяти|OOM]] | §9: memoria |\n| Service no\
  \ responde | [[#Не сводить сетевую диагностику к тексту одной ошибки|Networking]] | §10: conditions\
  \ |\n| No. shell | [[#Как добраться до процесса без оболочки|Access to the process]] | [[Containers-Visual-Guide|process\
  \ isolation]] |\n\n### Localice la falla antes de realizar cambios\n\n**De un vistazo**\n- Primero determine\
  \ el alcance\n- Luego lea el estado del Pod específico\n- An cualquier cambio debe abordar una causa\
  \ confirmada.\n\n**Miniejemplo:** solo en el grupo desechable kind preparado anteriormente. Cree el\
  \ namespace con `kubectl --kubeconfig /tmp/guides-order-rest.kubeconfig --context kind-guides-order-rest\
  \ create namespace guide-mini-66`. Guarde el listado como `mini.sh`; ejecútelo con `bash -e mini.sh`.\n\
  \n```bash\nk() { kubectl --kubeconfig /tmp/guides-order-rest.kubeconfig --context kind-guides-order-rest\
  \ -n guide-mini-66 \"$@\"; }\nk run once --image=nginx:1.29-alpine --image-pull-policy=Never --restart=Never\
  \ --command -- sh -c 'echo diagnostic; exit 3'\nk wait --for=jsonpath='{.status.phase}'=Failed pod/once\
  \ --timeout=90s\nk logs once\nk get pod once -o jsonpath='{.status.containerStatuses[0].state.terminated.exitCode}{\"\
  \\n\"}'\n```\n\n**Predecir:** ¿Qué mostrará el último command después de que finalicen los comandos\
  \ anteriores?\n\n> [!question]- Respuesta\n> command actual stdout:\n>\n> ```text\n> pod/once created\n\
  > pod/once condition met\n> diagnostic\n> 3\n> ```\n>\n> Ecódigo de salida: 0.\n\nEl proceso se inició,\
  \ imprimió diagnostic y luego devolvió 3. Esto difiere de una falla de programación o una falla de extracción\
  \ de imágenes.\n\n**Comandos en cualquier directorio: la evidencia mínima para Pod `crash`:**\n\n```bash\n\
  kubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s \\\n  -n vg-k8s get pods -o wide\n\
  kubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s \\\n  -n vg-k8s describe pod crash\n\
  kubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s \\\n  -n vg-k8s logs crash -c app\
  \ --previous\nkubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s \\\n  -n vg-k8s get\
  \ events --field-selector involvedObject.name=crash --sort-by=.lastTimestamp\n```\n\nPrimero determine\
  \ el alcance: un container, un Pod, una versión Deployment, un nodo o todo el clúster.\nCompruebe si\
  \ se ha asignado un nodo; luego verifique la preparación de environment/container, los backends readiness,\
  \ Service y la ruta network.\nGuarde previous logs y events antes de reiniciar: una nueva ejecución\
  \ puede ocultar la causa.\nEsta secuencia es un método de ingeniería basado en\n[depuración Pods](https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/)\
  \ y\n[Servicios de depuración](https://kubernetes.io/docs/tasks/debug/debug-application/debug-service/).\
  \ *(según documentación)*.\n\n> [!info]- Explicación más profunda\n> **Diagrama a leer: un síntoma puede\
  \ tener varias causas root:**\n>\n> ```mermaid\n> flowchart TD\n>     A[\"Application<br/>unavailable\"\
  ] --> B[\"Does a Pod exist?\"]\n>     B -->|\"No\"| C[\"ReplicaSet<br/>events: quota<br/>or admission\"\
  ]\n>     B -->|\"Yes\"| D[\"Is there<br/>an assigned<br/>node?\"]\n>     D -->|\"No\"| E[\"FailedScheduling:<br/>§8\
  \ and PVC\"]\n>     D -->|\"Yes\"| F[\"Is the container<br/>running?\"]\n>     F -->|\"No\"| G[\"Image,<br/>configuration,<br/>volume,\
  \ CNI\"]\n>     F -->|\"Yes\"| H[\"Ready?\"]\n>     H -->|\"No\"| I[\"Probes and<br/>application\"]\n\
  >     H -->|\"Yes\"| J[\"EndpointSlice,<br/>port, DNS,<br/>policy\"]\n> ```\n>\n> `-o wide` agrega el\
  \ IP/node; events conecta la falla a un componente;\n> `--previous` lee la instancia terminada. En una\
  \ imagen distroless, la ausencia de un shell no es una aplicación\nFallo > : use un ephemeral debug\
  \ container con el permissions/image. requerido\n> Ejemplo completo: [[K8s-Debug-Distroless-Images]].\n\
  > La ejecución original no se inició ephemeral containers; A continuación se describe una ejecución\
  \ separada.\n\n### Cinco ramas esenciales y alcance en todo el nodo\n\n**De un vistazo**\n- Distinguir\
  \ programación, imágenes, procesos, memoria y redes.\n- El alcance a nivel de nodo ayuda a identificar\
  \ una causa compartida\n- Un error container no prueba que todo el nodo tenga failed.\n\n**Escenario\
  \ breve**\n\nDiferentes aplicaciones fallan en un solo nodo; ellos trabajan en los demás.\n\n**Predecir:**\
  \ ¿Qué área deberías investigar a continuación?\n\n> [!question]- Respuesta\n> Análisis del conditions\
  \ dado: El nodo compartido: su conditions, runtime, recursos y componentes de red, manteniendo cada\
  \ verificación vinculada a observaciones específicas.\n\n| Síntoma | Primero question | Evidencia →\
  \ siguiente paso |\n|---|---|---|\n| `Pending`, no `nodeName` | ¿Qué nodos fueron excluidos? | `FailedScheduling`\
  \ → requests, taints, affinity, PVC (§8/11) |\n| `Pending`, nodo asignado | ¿Qué no se ha preparado?\
  \ | Fallo `FailedMount`, `FailedCreatePodSandBox`, Secret/image |\n| `CrashLoopBackOff` | ¿Quién dio\
  \ por terminado el proceso? | Anterior logs, `lastState`, exit code/reason, liveness/OOM (§3/4/9) |\n\
  | `ImagePullBackOff` | ¿Existe la imagen y es accesible? | Evento Registry/DNS/TLS/auth/tag; imagePullSecrets\
  \ (§3, [[Containers-Visual-Guide]]) |\n| `Running`, no Ready | ¿Por qué falla readiness? | 404/evento\
  \ de tiempo de espera; escuchando address/port; dependencia (§4) |\n| Service no tiene backends | ¿Selector\
  \ o readiness? | Sin direcciones → labels; direcciones no ready → sondas (§10) |\n| Varios Pods en un\
  \ nodo fallan | ¿Es accesible el nodo? | Node conditions, kubelet/CRI, disk/memory, network |\n\n> [!info]-\
  \ Explicación más profunda\n> La tabla combina fuentes de depuración públicas y nuevos experimentos;\
  \ Los errores específicos que no fueron reproducidos están marcados.\n>  en sus respectivas secciones.\
  \ Una falla de nodo en esta sesión fue *(no probada)*.\n\n### Ejemplo de error de extracción de imagen\
  \ completa\n\nLa ruta short anterior define el mecanismo y la siguiente verificación. Listado completo\
  \ y observaciones: [[#Справочный рецепт — Полный пример ошибки загрузки образа|reference recipe]].\n\
  \n### Ejemplo de límite de memoria completo\n\nLa ruta short anterior define el mecanismo y la siguiente\
  \ verificación. Listado completo y observaciones: [[#Справочный рецепт — Полный пример превышения памяти|reference\
  \ recipe]].\n\n### No reduzca la solución de problemas de network a un solo mensaje de error\n\n**De\
  \ un vistazo**\nEl texto - Error guía la investigación\n- DNS, las conexiones y las respuestas de la\
  \ aplicación son etapas diferentes\n- A timeout no identifica una sola causa.\n\n**Escenario breve**\n\
  \nDNS devolvió una dirección; el cliente envió un SYN y no recibió respuesta.\n\n**Predecir:** ¿Esto\
  \ prueba que la aplicación no está escuchando?\n\n> [!question]- Respuesta\n> Análisis del conditions\
  \ proporcionado: No. La ruta o el filtrado pueden ser responsables; Verifique de forma independiente\
  \ el puerto de escucha y observe los paquetes.\n\n**Salida de un cliente anterior: una ejecución registrada\
  \ de NetworkPolicy/Cilium para leer:**\n\n> [!info]- Explicación más profunda\n> ```text\n> wget: bad\
  \ address 'web'\n> wget: download timed out\n> ```\n>\n> Esta es una **ejecución grabada** de [[Kubernetes-Coding-Drills-Solutions#3\
  \ — NetworkPolicy]]:\n>  en el primer caso, la política también bloqueó DNS; en el segundo se permitió\
  \ DNS pero se bloqueó la ruta a la aplicación.\n> En otro entorno estos mensajes pueden tener diferentes\
  \ causas; confírmelos con una consulta DNS separada,\n> EndpointSlice, una conexión al puerto y observaciones\
  \ de la implementación de la red.\n> La ejecución original no incluyó nuevos experimentos de caída de\
  \ paquetes o fallas de DNS; A continuación aparece una ejecución separada.\n>\n> No apply el antiguo\
  \ claim que “la política siempre ve targetPort después de DNAT” incondicionalmente:\n>  para la traducción\
  \ Service address/port, el pedido relativo a la política network depende de la implementación.\n> Diseñe\
  \ y pruebe la regla en el CNI específico, permitiendo DNS sobre UDP/TCP por separado.\n> *(según documentación)*\
  \ — [NetworkPolicy y NAT](https://kubernetes.io/docs/concepts/services-networking/network-policies/).\n\
  >\n> **Predicción:** un Pod tiene `lastState: Completed, exitCode: 0`, pero su recuento de reinicios\
  \ sigue creciendo. ¿La aplicación es definitivamente saludable?\n>\n> > [!question]- Respuesta\n> >\
  \ No. En el nuevo experimento, kubelet detuvo nginx debido a un liveness 404 y nginx salió con el código\
  \ 0.\n> > El evento `failed liveness probe, will be restarted` identifica quién inició la parada.\n\
  > > *(verificado)* — §4.\n>\n> **Respuesta corta en inglés:**\n>\n> > I primero encuentra la capa defectuosa.\
  \ Pending sin un nodo es diferente a esperar una imagen en un nodo seleccionado.\n> > I compare events,\
  \ previous logs y motivos de terminación. Cambio el manifiesto sólo después de tener evidencia de la\
  \ causa.\n\n###  Llegando a un proceso que no tiene shell\n\n**De un vistazo**\nLa imagen mínima - A\
  \ puede no tener shell\n- A failed exec sh no prueba una falla de la aplicación\n- Agregue la depuración\
  \ tools por separado.\n\n**Escenario breve**\n\nEl HTTP endpoint de la aplicación responde, pero exec\
  \ sh devuelve executable, no found.\n\n**Predecir:** ¿Deberías considerar el container caído?\n\n> [!question]-\
  \ Respuesta\n> Análisis del conditions proporcionado: No. Falta el executable solicitado; Es posible\
  \ que la aplicación aún esté funcionando.\n\n**`main.go` en `/tmp/vg-k8s-work` — fuente completa de\
  \ la aplicación de aprendizaje:**\n\n```go\npackage main\nimport(\"fmt\";\"net\";\"net/http\";\"os\"\
  ;\"time\")\nfunc main(){\n if len(os.Args)>1 && os.Args[1]==\"crash\" { _,e:=os.ReadFile(\"/config/app.yaml\"\
  );fmt.Println(e);os.Exit(3) }\n os.WriteFile(\"/data/marker\",[]byte(\"original\\n\"),0600)\n go func(){for{_,e:=os.ReadFile(\"\
  /config/app.yaml\");if e!=nil{fmt.Println(e)};time.Sleep(time.Second)}}()\n go func(){l,e:=net.Listen(\"\
  tcp\",\":8082\");if e!=nil{panic(e)};for{c,e:=l.Accept();if e!=nil{continue};go func(c net.Conn){b:=make([]byte,1024);c.Read(b);c.(*net.TCPConn).SetLinger(0);c.Close()}(c)}}()\n\
  \ http.HandleFunc(\"/\",func(w http.ResponseWriter,r *http.Request){fmt.Fprintln(w,\"ok\")})\n panic(http.ListenAndServe(\"\
  :8080\",nil))\n}\n```\n\n**`Dockerfile` en `/tmp/vg-k8s-work` — archivo completo; adyacente `root-marker`\
  \ contiene la cadena `scratch-root`:**\n\n```dockerfile\nFROM scratch\nCOPY app /app\nCOPY root-marker\
  \ /root-marker\nUSER 0\nENTRYPOINT [\"/app\"]\n```\n\nLos siguientes experimentos se realizaron por\
  \ separado de los de previous: kind **0.33.0**, Kubernetes y kubectl **1.37.0**, kind-node containerd\
  \ **2.3.4**, `crictl 1.36.0`; un plano de control y un nodo trabajador. *(verificado)*.\nEphemeral containers\
  \ se han mantenido estables desde Kubernetes 1.25; Perfiles custom `--custom` desde 1.32. *(según la\
  \ documentación)* — [depurando un Pod](https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/)\
  \ en ejecución.\n§2 a 5 cubren estados y sondas; Aquí traemos una herramienta al proceso. Un programa\
  \ estático en `scratch` reproduce la misma falta de tools que distroless:\nno hay shell, pero la aplicación\
  \ se ejecuta. La reconstrucción de la imagen de la aplicación con un shell cambia el artefacto bajo\
  \ investigación, requiere reemplazar el Pod y expande la imagen production. No es necesario para observar\
  \ el proceso actual.\n\n> [!info]- Explicación más profunda\n> UID 0 se utiliza aquí para los permisos\
  \ de seguimiento compare; no es el user recomendado para una aplicación real. `8080` sirve a HTTP, `8082`\
  \ restablece intencionalmente la conexión después de leer la solicitud; el archivo de configuración\
  \ está ausente.\n>\n> **`lab.yaml` en `/tmp/vg-k8s-work` — conjunto de objetos completo para el ejercicio\
  \ adicional:**\n>\n> ```yaml\n> apiVersion: v1\n> kind: Namespace\n> metadata: {name: vg-k8s}\n> ---\n\
  > apiVersion: v1\n> kind: Pod\n> metadata: {name: vg-k8s-app, namespace: vg-k8s, labels: {app: vg-k8s-app}}\n\
  > spec:\n>   containers:\n>   - name: app\n>     image: vg-k8s-app:1\n>     imagePullPolicy: Never\n\
  >     volumeMounts: [{name: data, mountPath: /data}]\n>   volumes: [{name: data, emptyDir: {}}]\n> ---\n\
  > apiVersion: v1\n> kind: Pod\n> metadata: {name: vg-k8s-crash, namespace: vg-k8s, labels: {app: vg-k8s-crash}}\n\
  > spec:\n>   containers:\n>   - name: app\n>     image: vg-k8s-app:1\n>     imagePullPolicy: Never\n\
  >     args: [crash]\n>     volumeMounts: [{name: data, mountPath: /data}]\n>   volumes: [{name: data,\
  \ emptyDir: {}}]\n> ---\n> apiVersion: v1\n> kind: Service\n> metadata: {name: vg-k8s-ok, namespace:\
  \ vg-k8s}\n> spec:\n>   selector: {app: vg-k8s-app}\n>   ports: [{port: 80, targetPort: 8080}]\n> ---\n\
  > apiVersion: v1\n> kind: Service\n> metadata: {name: vg-k8s-empty, namespace: vg-k8s}\n> spec:\n> \
  \  selector: {app: vg-k8s-crash}\n>   ports: [{port: 80, targetPort: 8080}]\n> ---\n> apiVersion: v1\n\
  > kind: Service\n> metadata: {name: vg-k8s-wrong, namespace: vg-k8s}\n> spec:\n>   selector: {app: vg-k8s-app}\n\
  >   ports: [{port: 80, targetPort: 9999}]\n> ```\n>\n> **Comando en cualquier directorio, después de\
  \ crear el clúster `vg-k8s` separado, con kubeconfig del §21:**\n>\n> ```bash\n> printf 'scratch-root\\\
  n' > /tmp/vg-k8s-work/root-marker\n> CGO_ENABLED=0 go build -o /tmp/vg-k8s-work/app /tmp/vg-k8s-work/main.go\n\
  > docker build -t vg-k8s-app:1 /tmp/vg-k8s-work\n> /tmp/vg-k8s-bin/kind-linux-amd64 load docker-image\
  \ vg-k8s-app:1 --name vg-k8s\n> kubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n\
  \ vg-k8s apply -f /tmp/vg-k8s-work/lab.yaml\n> kubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context\
  \ kind-vg-k8s -n vg-k8s exec vg-k8s-app -c app -- sh\n> ```\n>\n> **Ejemplo de lectura: final exacto\
  \ del error; se omite el identificador failed exec:**\n>\n> ```text\n> OCI runtime exec failed: exec\
  \ failed: unable to start container process: exec: \"sh\": executable file not found in $PATH\n> ```\n\
  >\n> El error se refiere al lanzamiento del command, no a la disponibilidad del HTTP. La compilación,\
  \ load y la falla fueron *(verificadas)*.\n\n### Ephemeral container: network compartido, procesos seleccionados,\
  \ archivos separados\n\n**De un vistazo**\n- An ephemeral container tiene un sistema de archivos independiente\n\
  - El network del Pod es compartido\nLa visibilidad de - Process depende del entorno namespace y runtime\
  \ seleccionado.\n\n**Escenario breve**\n\nEl debug container ve el puerto HTTP de la aplicación, pero\
  \ el cannot encuentra su archivo /app.\n\n**Predecir:** ¿Esto contradice el network compartido?\n\n\
  > [!question]- Respuesta\n> Análisis del conditions proporcionado: No. Un network compartido no implica\
  \ un directorio root compartido.\n\n**Comando en cualquier directorio: fije la imagen tools y open a\
  \ shell al lado de la aplicación:**\n\n```bash\nTOOLS=nicolaka/netshoot@sha256:7f08c4aff13ff61a35d30e30c5c1ea8396eac6ab4ce19fd02d5a4b3b5d0d09a2\n\
  kubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n vg-k8s debug -it vg-k8s-app \\\n\
  \  --image=\"$TOOLS\" --target=app --container=vg-k8s-general --profile=general -- sh\n```\n\n> [!info]-\
  \ Explicación más profunda\n> En el experimento, el container se mantuvo activo con `sleep 1d`, y los\
  \ siguientes comandos se ejecutaron a través de `exec -c vg-k8s-general`; el formulario interactivo\
  \ anterior es *(según la documentación)*, depurando un Pod en ejecución; la conexión sin un TTY fue\
  \ *(verificada)*.\n>\n> | Comparación | Observación |\n> |---|---|\n> | Sin `--target`, sin `shareProcessNamespace`\
  \ | `ps`: PID 1 es su propio `sh`; `/app` no es visible |\n> | Con `--target=app` | `ps`: PID 1 es `/app`;\
  \ containerd admitió ingresar a su PID namespace |\n> | Red en ambos casos | `ss` ve `8080` y `8082`;\
  \ sin un PID visible el campo propietario está vacío |\n> | Archivos con `--target` | `/root-marker`\
  \ está ausente en el tools container; `/proc/1/root/root-marker` contiene `scratch-root` |\n> | Espacios\
  \ de nombres | Red: ambos `net:[4026532841]`; soportes del sistema de archivos: `4026533574` y `4026533571`\
  \ |\n>\n> La tabla fue *(verificada)*. `--target` selecciona un container por **nombre**; no transfiere\
  \ su sistema de archivos root. Con `shareProcessNamespace: true`, regular y ephemeral containers ver\
  \ procesos Pod sin `--target`;\n>  en la copia probada, PID 1 es `/pause` y PID 7 es `/app`. Este es\
  \ un campo en la plantilla para un nuevo Pod, no un interruptor para uno en ejecución.\n> *(verificado)*\
  \ — copia a continuación; *(según documentación)* — [proceso compartido namespace](https://kubernetes.io/docs/tasks/configure-pod-container/share-process-namespace/).\n\
  > El PID namespace controla la visibilidad, mientras que los permisos controlan el acceso a otros procesos\
  \ y `/proc/<pid>/root`. Las señales pueden detener la aplicación: no asuma que PID 1 es siempre su debugger.\n\
  > Recordatorio: [[Linux-Troubleshooting-Visual-Guide#9. Процессы: состояния, сигналы, зомби и PID 1|Processes:\
  \ states, signals, zombies and PID 1]] y [[Linux-Troubleshooting-Visual-Guide#14. Пространства имён\
  \ и cgroups: основа контейнеров|Namespaces and cgroups: the basis of containers]].\n>\n> **Comando en\
  \ cualquier directorio: ubicaciones API que conservan un ephemeral container:**\n>\n> ```bash\n> kubectl\
  \ --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n vg-k8s get pod vg-k8s-app \\\n>   -o\
  \ jsonpath='{.spec.ephemeralContainers}{\"\\n\"}{.status.ephemeralContainerStatuses}{\"\\n\"}'\n> ```\n\
  >\n> `spec.ephemeralContainers` almacena su nombre, imagen, `targetContainerName` y `securityContext`;\
  \ `status.ephemeralContainerStatuses` almacena `state`, `containerID` y `restartCount`. Un debugger\
  \ completo tiene\n> `state.terminated` y 0 reinicios; Los UID y `containerID` de la aplicación no cambian,\
  \ con 0 reinicios. *(verificado)*. Un container cannot ya agregado es removed/modified y no se reinicia\
  \ automáticamente.\n> A la nueva entrada necesita un nombre diferente; todo el Pod se elimina por separado\
  \ según su ciclo de vida. *(según documentación)* — [ephemeral containers](https://kubernetes.io/docs/concepts/workloads/pods/ephemeral-containers/).\n\
  >\n> **Ejemplo de lectura: rechazo real de API al intentar eliminar la primera entrada:**\n>\n> ```text\n\
  > The Pod \"vg-k8s-app\" is invalid: spec.ephemeralContainers: Forbidden: existing ephemeral containers\
  \ \"vg-k8s-isolated\" may not be removed\n> ```\n\n### Llamadas al sistema: vea primero el proceso y\
  \ luego obtenga permiso de seguimiento\n\n**De un vistazo**\n- Ver un PID no otorga permisos de rastreo\n\
  - Compruebe el UID y los permisos adicionales por separado\nLa llamada al sistema - A muestra dónde\
  \ interactúa el proceso con el kernel.\n\n**Escenario breve**\n\nEl debugger ve el proceso, pero ptrace\
