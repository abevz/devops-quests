  \ 2 http://127.0.0.1:8082\n```\n\n`ss -ltnp` verifica la dirección de escucha, una consulta DNS verifica\
  \ el nombre y `curl` verifica la conexión y la respuesta protocol. El ClusterIP y el puerto de un Service\
  \ difieren de la dirección Pod y `targetPort`; trabajar DNS no prueba un ready endpoint.\nRecordatorio:\
  \ [[Linux-Troubleshooting-Visual-Guide#15. Сеть: слушающие порты и смысл ошибок|Networking: listening\
  \ ports and error meanings]] y [[Networking-Visual-Guide#19. Kubernetes: адрес пода, виртуальный Service\
