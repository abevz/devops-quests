  \ No. El API puede aceptar la copia, pero el runtime no encontrará el executable.\n\n**Comando en cualquier\
  \ directorio: primero una copia defectuosa y luego una copia con una imagen de reemplazo:**\n\n```bash\n\
  kubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s -n vg-k8s debug vg-k8s-crash \\\n\
  \  --copy-to=vg-k8s-copy-fails --container=app -- sleep 1d\nkubectl --kubeconfig /tmp/vg-k8s-kubeconfig\
  \ --context kind-vg-k8s -n vg-k8s debug vg-k8s-crash \\\n  --copy-to=vg-k8s-copy --container=app --set-image=\"\
  app=$TOOLS\" --share-processes -- sleep 1d\nkubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s\
  \ -n vg-k8s events --for pod/vg-k8s-copy-fails --types=Warning\n```\n\n> [!info]- Explicación más profunda\n\
  > **Ejemplo de lectura: final exacto del error de tiempo de ejecución del contenedor:**\n>\n> ```text\n\
  > exec: \"sleep\": executable file not found in $PATH\n> ```\n>\n> La copia API se realizó correctamente,\
  \ pero la primera copia recibió `RunContainerError`; `scratch` tampoco contiene `sleep`.\n> En la segunda\
  \ copia, `app` es el tools container y es `Running`: el proceso Go original ya no se reproduce.\n> El\
  \ Pod original mostraba `CrashLoopBackOff`, motivo de terminación `Error` y exit código 3. *(verificado)*.\n\
  >  Para conservar la aplicación, agregue tools a una copia en lugar de reemplazar su imagen.\n>\n> **Comando\
