  \ de documentación a esta versión.\n\n### Redes dentro del Pod: puerto, DNS, backend y paquetes\n\n\
  **De un vistazo**\n- Ports, DNS y paquetes responden diferentes preguntas\n- A Service puede señalar\
  \ el targetPort incorrecto\n- Primero conecte las direcciones involucradas en la solicitud específica.\n\
  \n**Escenario breve**\n\nEl proceso escucha en 8080, pero el Service reenvía al 9999.\n\n**Predecir:**\
