heading: Konfigurations-Overlays und Release-Wechsel
text: '# Konfigurations-Overlays und Release-Wechsel


  Nutze nur die Offline-Umgebung. Eine Kustomize-Basis enthält wiederverwendbare Ressourcen; ein Overlay ändert ausgewählte Teile und kann eine ConfigMap erzeugen. Prüfe in Quest 108 `base/board.json`, `base/kustomization.yaml` und `overlays/recovery/kustomization.yaml`. Das Patch-Ziel muss das tatsächliche Deployment benennen. Rendere das Overlay vor dem Anwenden, prüfe generierte ConfigMap und umgeschriebene Umgebungsreferenz und warte auf zwei bereite Replikate. Ein `route-`-Namenspräfix allein beweist weder einen Hash-Suffix noch eine unveränderte Basis; vergleiche Dateien und gerenderte Ausgabe selbst.


  Ein Service wählt Pods anhand von Labels und veröffentlicht bereite Endpunkte. Wähle in Quest 115 Phase eins das grüne Release und prüfe die Antwort. Zu Beginn von Phase zwei ergänzt die Umgebung ein gemeinsames Label und ändert den Selektor; skaliere blue auf drei und green auf ein Replikat, warte auf Bereitschaft, prüfe EndpointSlices und frage jede Pod-IP ab. Eine Service-Anfrage zeigt eine Antwort, keine exakte 3:1-Verkehrsverteilung. Die Prüfung zählt vier bereite Endpoint-Namen, ordnet sie aber nicht den Versions-Pods zu. Session Affinity, Verbindungswiederverwendung und kleine Stichproben können Verkehr verzerren.


  Quellen: [Kustomize](https://kubernetes.io/docs/tasks/manage-kubernetes-objects/kustomization/), [EndpointSlices](https://kubernetes.io/docs/concepts/services-networking/endpoint-slices/).


  Rendere und wende in Quest 108 das Recovery-Overlay an:


  ```sh

  cd ~/quest

  kubectl kustomize overlays/recovery

  kubectl apply -k overlays/recovery

  kubectl rollout status deployment/board --timeout=90s

  ```


  Prüfe in Quest 115 Service und bereite Endpunkte:


  ```sh

  cd ~/quest

  kubectl get service board -o yaml

  kubectl get endpointslices -l kubernetes.io/service-name=board -o yaml

  kubectl get pods -l app=blue -o wide

  kubectl get pods -l app=green -o wide

  ```

  '
