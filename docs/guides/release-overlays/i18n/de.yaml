heading: Konfigurations-Overlays und Release-Wechsel
text: '# Konfigurations-Overlays und Release-Wechsel


  Nutze nur die Offline-Umgebung. Eine Kustomize-Basis enthält wiederverwendbare Ressourcen; ein Overlay ändert ausgewählte Teile und kann eine ConfigMap erzeugen. Prüfe in Quest 108 `base/board.yaml`, `base/kustomization.yaml` und `overlays/recovery/kustomization.yaml`. Das Patch-Ziel muss das tatsächliche Deployment benennen. Rendere das Overlay vor dem Anwenden, prüfe generierte ConfigMap und umgeschriebene Umgebungsreferenz und warte auf zwei bereite Replikate. Ein `route-`-Namenspräfix allein beweist weder einen Hash-Suffix noch eine unveränderte Basis; vergleiche Dateien und gerenderte Ausgabe selbst.


  Ein Service-Selector muss zu den Labels der Pod-Vorlagen passen; diese unterscheiden sich von Deployment-Metadatenlabels. Verfolge beim Aufbau eines gemeinsamen Release-Pools die Labels von jedem Deployment zu Pods und EndpointSlices. Prüfe jedes Release direkt und über den gemeinsamen Endpunkt: Ein laufender Prozess kann auf einem anderen Port als dem Service-Zielport lauschen. Ein Replikaverhältnis beschreibt Kapazität, keine gemessenen Anfragegewichte. Session-Affinität, Verbindungswiederverwendung und kleine Stichproben können den Verkehr verzerren.


  Quellen: [Kustomize](https://kubernetes.io/docs/tasks/manage-kubernetes-objects/kustomization/), [EndpointSlices](https://kubernetes.io/docs/concepts/services-networking/endpoint-slices/).


  Rendere und wende in Quest 108 das Recovery-Overlay an:


  ```sh

  cd ~/quest

  kubectl kustomize overlays/recovery

  kubectl apply -k overlays/recovery

  kubectl rollout status deployment/board --timeout=90s

  ```


  Prüfe in Quest 115 Service und bereite Endpunkte:


  ```sh

  cd ~/quest

  kubectl get service board -o yaml

  kubectl get endpointslices -l kubernetes.io/service-name=board -o yaml

  kubectl get pods -l app=blue -o wide

  kubectl get pods -l app=green -o wide

  ```



  ### Recovery-Overlay rendern {#q108-overlay-render}


  Das Recovery-Overlay verweist möglicherweise auf eine fehlende Basis oder ein ungültiges Patch-Ziel. Rendern Sie es lokal und prüfen Sie vor der Anwendung den ersten Kustomize-Fehler.


  ```bash

  kubectl kustomize overlays/recovery

  ```


  ### Gerenderte Routendaten {#q108-rendered-route-map}


  Der gerenderte Worker verweist möglicherweise auf die Basis-ConfigMap oder die Daten weichen ab. Folgen Sie ROUTE und prüfen Sie in der referenzierten ConfigMap genau ROUTE=north-108.


  ```bash

  kubectl kustomize overlays/recovery

  ```


  ### Name der generierten ConfigMap {#q108-rendered-generated-map-name}


  Das Overlay verweist möglicherweise auf einen statischen Namen oder übernimmt den generierten Namen nicht. Prüfen Sie, welche ConfigMap der gerenderte Worker referenziert und ob ihr Name mit route- beginnt.


  ```bash

  kubectl kustomize overlays/recovery | awk ''/^kind: ConfigMap$/{show=1} show && /^  name:/{print; show=0}''

  ```


  ### Gerenderte Replikazahl {#q108-rendered-replica-count}


  Der Overlay-Patch verweist möglicherweise auf ein anderes Objekt als Deployment board. Prüfen Sie genau ein Deployment board mit zwei gewünschten Repliken im Ergebnis.


  ```bash

  kubectl kustomize overlays/recovery | awk ''/^kind: Deployment$/{show=1} show && /^  replicas:/{print; show=0}''

  ```


  ### Identität des vorhandenen Deployments {#q108-original-live-deployment}


  Ein Ersatz von board statt einer Aktualisierung hat die UID möglicherweise dauerhaft geändert. Vergleichen Sie die aktive UID mit dem Original, bevor Sie das Overlay auf das bestehende Objekt anwenden.


  ```bash

  kubectl get deployment board -o jsonpath=''{.metadata.uid}''

  ```


  ### Angewendete Replikazahl {#q108-applied-replica-count}


  Das Overlay kann korrekt rendern, während board die alte gewünschte Anzahl behält. Wenden Sie das korrigierte Overlay an und bestätigen Sie zwei Repliken in der aktiven Spezifikation.


  ```bash

  kubectl get deployment board -o jsonpath=''{.spec.replicas}''

  ```


  ### Bereite Repliken nach der Anwendung {#q108-applied-ready-replicas}


  Die gewünschte Anzahl wurde möglicherweise angewendet, aber Pods starten noch oder warten auf Eingaben. Prüfen Sie die Pods und warten Sie auf genau zwei bereite board-Repliken.


  ```bash

  kubectl get deployment board -o jsonpath=''{.status.readyReplicas}''; kubectl get pods -l app=board

  ```


  ### ConfigMap-Verweis des Workers {#q108-live-worker-route-reference}


  Der aktive Worker enthält möglicherweise ein Literal oder verweist auf den alten Namen. Prüfen Sie den einzigen ROUTE-Eintrag und verweisen Sie auf ROUTE in der aktuell gerenderten ConfigMap.


  ```bash

  kubectl get deployment board -o json | jq ''.spec.template.spec.containers[] | select(.name == "worker") | .env''

  ```


  ### Angewendete Routendaten {#q108-applied-route-map-data}


  Die aktuell generierte ConfigMap fehlt möglicherweise im Cluster oder enthält alte Daten. Vergleichen Sie die dem Render entsprechende aktive ConfigMap mit genau ROUTE=north-108.


  ```bash

  kubectl get configmap -o json | jq ''.items[] | select(.metadata.name | startswith("route-")) | {name: .metadata.name, data}''

  ```


  ### Service-Antwort nach dem Rollout {#q108-service-rollout-response}


  Die API-Objekte können korrekt sein, obwohl der Service einen alten oder unerreichbaren Pod erreicht. Lesen Sie nach dem Rollout die tatsächliche Antwort von board und vergleichen Sie mit north-108.


  ```bash

  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080

  ```


  ### Eingaben für die Render-Prüfung {#q108-overlay-render-observer-input}


  Die Render-Prüfung kann vor der Feldmeldung abbrechen, wenn Pfad oder Werkzeuge fehlen. Prüfen Sie den Overlay-Pfad und rendern Sie auf der Workstation.


  ```bash

  command -v python3; kubectl kustomize overlays/recovery

  ```


  ### Eingaben für die Prüfung des angewendeten Overlays {#q108-applied-overlay-observer-input}


  Die Prüfung angewendeter Objekte kann vor dem Vergleich abbrechen, wenn Rendern oder Verzeichniszugriff fehlschlägt. Prüfen Sie den Render-Vorgang sowie lokalen und Clusterzugriff.


  ```bash

  kubectl kustomize overlays/recovery; kubectl get deployment board -o name

  ```

