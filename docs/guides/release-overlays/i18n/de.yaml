heading: Konfigurations-Overlays und Release-Wechsel
text: '# Konfigurations-Overlays und Release-Wechsel


  Nutze nur die Offline-Umgebung. Eine Kustomize-Basis enthält wiederverwendbare Ressourcen; ein Overlay ändert ausgewählte Teile und kann eine ConfigMap erzeugen. Prüfe in Quest 108 `base/board.yaml`, `base/kustomization.yaml` und `overlays/recovery/kustomization.yaml`. Das Patch-Ziel muss das tatsächliche Deployment benennen. Rendere das Overlay vor dem Anwenden, prüfe generierte ConfigMap und umgeschriebene Umgebungsreferenz und warte auf zwei bereite Replikate. Ein `route-`-Namenspräfix allein beweist weder einen Hash-Suffix noch eine unveränderte Basis; vergleiche Dateien und gerenderte Ausgabe selbst.


  Ein Service-Selector muss zu den Labels der Pod-Vorlagen passen; diese unterscheiden sich von Deployment-Metadatenlabels. Verfolge beim Aufbau eines gemeinsamen Release-Pools die Labels von jedem Deployment zu Pods und EndpointSlices. Prüfe jedes Release direkt und über den gemeinsamen Endpunkt: Ein laufender Prozess kann auf einem anderen Port als dem Service-Zielport lauschen. Ein Replikaverhältnis beschreibt Kapazität, keine gemessenen Anfragegewichte. Session-Affinität, Verbindungswiederverwendung und kleine Stichproben können den Verkehr verzerren.


  Quellen: [Kustomize](https://kubernetes.io/docs/tasks/manage-kubernetes-objects/kustomization/), [EndpointSlices](https://kubernetes.io/docs/concepts/services-networking/endpoint-slices/).


  Rendere und wende in Quest 108 das Recovery-Overlay an:


  ```sh

  cd ~/quest

  kubectl kustomize overlays/recovery

  kubectl apply -k overlays/recovery

  kubectl rollout status deployment/board --timeout=90s

  ```


  Prüfe in Quest 115 Service und bereite Endpunkte:


  ```sh

  cd ~/quest

  kubectl get service board -o yaml

  kubectl get endpointslices -l kubernetes.io/service-name=board -o yaml

  kubectl get pods -l app=blue -o wide

  kubectl get pods -l app=green -o wide

  ```

  '
