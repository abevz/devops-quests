heading: Nakładki konfiguracji i zmiana wydania
text: '# Nakładki konfiguracji i zmiana wydania


  Używaj tylko zatoki offline. Baza Kustomize zawiera zasoby wielokrotnego użytku; overlay zmienia wybrane części i może generować ConfigMap. W zadaniu 108 sprawdź `base/board.json`, `base/kustomization.yaml` i `overlays/recovery/kustomization.yaml`. Cel patcha musi wskazywać rzeczywistą nazwę Deployment. Wyrenderuj overlay przed zastosowaniem, sprawdź wygenerowaną ConfigMap i przepisane odwołanie w środowisku, a następnie poczekaj na dwie gotowe repliki. Sam prefiks nazwy `route-` nie dowodzi sufiksu hash ani niezmienionej bazy; porównaj dostarczone pliki i wynik renderowania.


  Service wybiera Pody według etykiet i publikuje gotowe endpointy. W pierwszym etapie zadania 115 wybierz wydanie green i sprawdź odpowiedź. Na początku drugiego etapu zatoka dodaje wspólną etykietę i zmienia selektor; skaluj blue do trzech replik i green do jednej, poczekaj na gotowość, sprawdź EndpointSlice i zapytaj każdy IP Poda. Jedno żądanie Service pokazuje jedną odpowiedź, a nie dokładny rozkład ruchu 3:1. Kontrola liczy cztery gotowe nazwy endpointów, ale nie porównuje ich z Podami wersji. Sticky sessions, ponowne użycie połączeń i małe próbki mogą zniekształcić ruch.


  Źródła: [Kustomize](https://kubernetes.io/docs/tasks/manage-kubernetes-objects/kustomization/), [EndpointSlice](https://kubernetes.io/docs/concepts/services-networking/endpoint-slices/).


  W zadaniu 108 wyrenderuj i zastosuj recovery overlay:


  ```sh

  cd ~/quest

  kubectl kustomize overlays/recovery

  kubectl apply -k overlays/recovery

  kubectl rollout status deployment/board --timeout=90s

  ```


  W zadaniu 115 sprawdź Service i gotowe endpointy:


  ```sh

  cd ~/quest

  kubectl get service board -o yaml

  kubectl get endpointslices -l kubernetes.io/service-name=board -o yaml

  kubectl get pods -l app=blue -o wide

  kubectl get pods -l app=green -o wide

  ```

  '
