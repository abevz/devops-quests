heading: Nakładki konfiguracji i zmiana wydania
text: '# Nakładki konfiguracji i zmiana wydania


  Używaj tylko zatoki offline. Baza Kustomize zawiera zasoby wielokrotnego użytku; overlay zmienia wybrane części i może generować ConfigMap. W zadaniu 108 sprawdź `base/board.yaml`, `base/kustomization.yaml` i `overlays/recovery/kustomization.yaml`. Cel patcha musi wskazywać rzeczywistą nazwę Deployment. Wyrenderuj overlay przed zastosowaniem, sprawdź wygenerowaną ConfigMap i przepisane odwołanie w środowisku, a następnie poczekaj na dwie gotowe repliki. Sam prefiks nazwy `route-` nie dowodzi sufiksu hash ani niezmienionej bazy; porównaj dostarczone pliki i wynik renderowania.


  Selektor Service musi pasować do etykiet szablonów Podów, które różnią się od etykiet metadata Deployment. Budując wspólną pulę wydań, prześledź etykiety od każdego Deployment do Podów i EndpointSlices. Sprawdź każde wydanie bezpośrednio i przez wspólny endpoint: działający proces może nasłuchiwać na innym porcie niż docelowy port Service. Proporcja replik opisuje pojemność, a nie zmierzone wagi żądań. Przywiązanie sesji, ponowne użycie połączeń i małe próbki mogą zaburzać ruch.


  Źródła: [Kustomize](https://kubernetes.io/docs/tasks/manage-kubernetes-objects/kustomization/), [EndpointSlice](https://kubernetes.io/docs/concepts/services-networking/endpoint-slices/).


  W zadaniu 108 wyrenderuj i zastosuj recovery overlay:


  ```sh

  cd ~/quest

  kubectl kustomize overlays/recovery

  kubectl apply -k overlays/recovery

  kubectl rollout status deployment/board --timeout=90s

  ```


  W zadaniu 115 sprawdź Service i gotowe endpointy:


  ```sh

  cd ~/quest

  kubectl get service board -o yaml

  kubectl get endpointslices -l kubernetes.io/service-name=board -o yaml

  kubectl get pods -l app=blue -o wide

  kubectl get pods -l app=green -o wide

  ```



  ### Renderowanie nakładki recovery {#q108-overlay-render}


  Nakładka recovery może wskazywać brakującą bazę lub nieprawidłowy cel poprawki. Wyrenderuj ją lokalnie i sprawdź pierwszy błąd Kustomize przed zastosowaniem.


  ```bash

  kubectl kustomize overlays/recovery

  ```


  ### Wyrenderowane dane trasy {#q108-rendered-route-map}


  Wyrenderowany kontener worker może odwoływać się do bazowej ConfigMap lub dane mogą się różnić. Prześledź referencję ROUTE i sprawdź, czy wskazana mapa zawiera dokładnie ROUTE=north-108.


  ```bash

  kubectl kustomize overlays/recovery

  ```


  ### Nazwa wygenerowanego ConfigMap {#q108-rendered-generated-map-name}


  Nakładka może wskazywać statyczną nazwę lub nie przekazać wygenerowanej nazwy. Sprawdź, którą mapę wskazuje wyrenderowany kontener worker i czy nazwa zaczyna się od route-.


  ```bash

  kubectl kustomize overlays/recovery | awk ''/^kind: ConfigMap$/{show=1} show && /^  name:/{print; show=0}''

  ```


  ### Wyrenderowana liczba replik {#q108-rendered-replica-count}


  Poprawka nakładki może wskazywać inny obiekt niż Deployment board. Sprawdź, czy wynik zawiera dokładnie jeden Deployment board z dwiema żądanymi replikami.


  ```bash

  kubectl kustomize overlays/recovery | awk ''/^kind: Deployment$/{show=1} show && /^  replicas:/{print; show=0}''

  ```


  ### Tożsamość istniejącego Deploymentu {#q108-original-live-deployment}


  Zastąpienie board zamiast aktualizacji mogło trwale zmienić UID. Przed zastosowaniem nakładki do istniejącego obiektu porównaj aktualny UID z pierwotnym.


  ```bash

  kubectl get deployment board -o jsonpath=''{.metadata.uid}''

  ```


  ### Zastosowana liczba replik {#q108-applied-replica-count}


  Nakładka może renderować się poprawnie, choć aktywny board ma starą żądaną liczbę. Zastosuj poprawioną nakładkę i potwierdź dwie repliki w specyfikacji.


  ```bash

  kubectl get deployment board -o jsonpath=''{.spec.replicas}''

  ```


  ### Gotowe repliki po zastosowaniu {#q108-applied-ready-replicas}


  Żądane repliki mogły zostać zastosowane, ale pody jeszcze startują lub czekają na dane. Sprawdź pody i poczekaj na dokładnie dwie gotowe repliki board.


  ```bash

  kubectl get deployment board -o jsonpath=''{.status.readyReplicas}''; kubectl get pods -l app=board

  ```


  ### Referencja workera do ConfigMap {#q108-live-worker-route-reference}


  Aktywny kontener worker może mieć literał lub wskazywać starą nazwę mapy. Sprawdź pojedynczy wpis ROUTE i skieruj go do klucza ROUTE w bieżącej wyrenderowanej ConfigMap.


  ```bash

  kubectl get deployment board -o json | jq ''.spec.template.spec.containers[] | select(.name == "worker") | .env''

  ```


  ### Zastosowane dane trasy {#q108-applied-route-map-data}


  Bieżącej wygenerowanej ConfigMap może brakować w klastrze albo może zawierać stare dane. Porównaj ją z mapą z aktualnego renderu i dokładnym ROUTE=north-108.


  ```bash

  kubectl get configmap -o json | jq ''.items[] | select(.metadata.name | startswith("route-")) | {name: .metadata.name, data}''

  ```


  ### Odpowiedź Service po wdrożeniu {#q108-service-rollout-response}


  Obiekty API mogą być poprawne, choć Service trafia do starego lub niedostępnego poda. Odczytaj odpowiedź board po wdrożeniu i porównaj z north-108.


  ```bash

  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080

  ```


  ### Dane kontroli renderowania {#q108-overlay-render-observer-input}


  Kontrola renderu może zakończyć się przed wskazaniem pola, jeśli brakuje ścieżki lub narzędzia. Sprawdź nakładkę i wyrenderuj ze stanowiska.


  ```bash

  command -v python3; kubectl kustomize overlays/recovery

  ```


  ### Dane kontroli zastosowanej nakładki {#q108-applied-overlay-observer-input}


  Kontrola zastosowania może skończyć się przed porównaniem obiektów, gdy nie renderuje nakładki lub nie może otworzyć katalogu. Sprawdź render oraz dostęp lokalny i do klastra.


  ```bash

  kubectl kustomize overlays/recovery; kubectl get deployment board -o name

  ```



  ### Selektor wyłącznie dla green {#q115-green-release-selector}


  Service może nadal wybierać blue albo pomijać aktualny pod green. Sprawdź app=green, objęcie właściwych podów i wykluczenie innych obciążeń.


  ```bash

  kubectl get service board -o jsonpath=''{.spec.selector}''; kubectl get pods --show-labels

  ```


  ### Odpowiedź HTTP wyłącznie green {#q115-green-release-service-http}


  Poprawny selektor może nie mieć gotowego endpointu green lub zwracać starsze wydanie. Odpytaj board z client i porównaj z green-115.


  ```bash

  kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080

  ```


  ### Żądane repliki blue {#q115-canary-blue-desired-count}


  Blue może mieć starą żądaną liczbę lub nie istnieć. Sprawdź, czy Deployment blue żąda trzech replik we wspólnej puli.


  ```bash

  kubectl get deployment blue -o jsonpath=''{.spec.replicas}''

  ```


  ### Gotowe repliki blue {#q115-canary-blue-ready-count}


  Blue może żądać trzech replik, choć część podów nie jest gotowa. Sprawdź aktualne pody blue i poczekaj na trzy gotowe repliki.


  ```bash

  kubectl get deployment blue -o jsonpath=''{.status.readyReplicas}''; kubectl get pods -l app=blue

  ```


  ### Żądane repliki green {#q115-canary-green-desired-count}


  Green mógł mieć niewłaściwy rozmiar we wspólnej puli. Sprawdź liczbę żądaną i zachowaj jedną replikę.


  ```bash

  kubectl get deployment green -o jsonpath=''{.spec.replicas}''

  ```


  ### Gotowe repliki green {#q115-canary-green-ready-count}


  Replika green może czekać lub nie przechodzić gotowości po przejściu. Sprawdź pod green i poczekaj na jedną gotową replikę.


  ```bash

  kubectl get deployment green -o jsonpath=''{.status.readyReplicas}''; kubectl get pods -l app=green

  ```


  ### Selektor wspólnej puli {#q115-shared-release-selector}


  Service może nadal wybierać jeden kolor lub obce obciążenie. Sprawdź release=board i dodatkowe selektory względem podów blue i green we wspólnym wydaniu.


  ```bash

  kubectl get service board -o jsonpath=''{.spec.selector}''; kubectl get pods --show-labels

  ```


  ### Odrębne nazwy gotowych endpointów {#q115-shared-ready-endpoint-names}


  Podczas wdrożenia może brakować celów endpointów albo mogą być stare lub niegotowe. Sprawdź EndpointSlice i po zbieżności policz cztery różne nazwy gotowych celów.


  ```bash

  kubectl get endpointslices -l kubernetes.io/service-name=board -o json | jq ''[.items[].endpoints[] | select(.conditions.ready == true) | .targetRef.name] | unique''

  ```


  ### Przydzielone adresy podów blue {#q115-blue-pod-addresses}


  Odczyt podów blue może nie zwrócić adresu, gdy rozmieszczenie lub sieć nie są gotowe. Sprawdź przydzielone IP podów app=blue.


  ```bash

  kubectl get pods -l app=blue -o wide

  ```


  ### Przydzielone adresy podów green {#q115-green-pod-addresses}


  Odczyt podów green może nie zwrócić adresu, gdy rozmieszczenie lub sieć nie są gotowe. Sprawdź przydzielone IP podów app=green.


  ```bash

  kubectl get pods -l app=green -o wide

  ```


  ### Bezpośrednia odpowiedź blue {#q115-blue-direct-response}


  Pojedynczy pod blue może zwracać złą treść lub nie odpowiadać bezpośrednio. Odpytaj wskazane IP z client i porównaj z blue-115.


  ```bash

  for address in $(kubectl get pods -l app=blue -o jsonpath=''{.items[*].status.podIP}''); do kubectl exec deployment/client -- wget -qO- -T 2 "http://$address:8080"; done

  ```


  ### Bezpośrednia odpowiedź green {#q115-green-direct-response}


  Pojedynczy pod green może zwracać złą treść lub nie odpowiadać bezpośrednio. Odpytaj wskazane IP z client i porównaj z green-115.


  ```bash

  for address in $(kubectl get pods -l app=green -o jsonpath=''{.items[*].status.podIP}''); do kubectl exec deployment/client -- wget -qO- -T 2 "http://$address:8080"; done

  ```


  ### Odpowiedź wspólnego Service {#q115-shared-canary-service-response}


  Wspólny Service może nie mieć osiągalnego endpointu lub zwracać obcą treść. Żądanie z client powinno dać blue-115 lub green-115.


  ```bash

  kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080

  ```


  ### Limit czasu kontroli bezpośrednich {#q115-bounded-pod-probes}


  Powolne odczyty Kubernetes, timeouty lub dodatkowe IP podów mogą zostawić część adresów poza oknem kontroli. Sprawdź wyświetlone adresy osobno i poczekaj na zbieżność wdrożenia.


  ```bash

  kubectl get pods -l release=board -o wide

  ```


  ### Dane kontroli wyłącznie green {#q115-green-selector-observer-input}


  Kontrola green może zatrzymać się przed wskazaniem warunku przez błąd procesu lub wejść. Sprawdź narzędzia i dostęp do Service oraz podów green.


  ```bash

  command -v python3; kubectl get service board -o name; kubectl get pods -l app=green

  ```


  ### Dane kontroli wspólnego selektora {#q115-shared-selector-observer-input}


  Kontrola wspólnego selektora i endpointów może zatrzymać się przed wskazaniem warunku przy braku narzędzi lub danych. Sprawdź dostęp do Service board i EndpointSlice.


  ```bash

  command -v python3; kubectl get service board -o name; kubectl get endpointslices -l kubernetes.io/service-name=board

  ```


  ### Dane kontroli bezpośrednich i Service {#q115-shared-http-observer-input}


  Kontrola bezpośrednia i wspólnego Service może zatrzymać się przed wskazaniem adresu przez błąd procesu lub danych. Sprawdź Python i aktualne obciążenia blue, green oraz client.


  ```bash

  command -v python3; kubectl get pods -l release=board -o wide; kubectl get deployment client -o name

  ```

  '
