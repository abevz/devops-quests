heading: Overlay конфигурации и переключение выпуска
text: '# Overlay конфигурации и переключение выпуска


  Используйте только офлайн-песочницу. База Kustomize содержит повторно используемые ресурсы; overlay меняет выбранные части и может создать ConfigMap. В задании 108 изучите `base/board.yaml`, `base/kustomization.yaml` и `overlays/recovery/kustomization.yaml`. Цель patch должна указывать имя настоящего Deployment. Отрендерьте overlay до применения, изучите созданную ConfigMap и переписанную ссылку в окружении, затем дождитесь двух готовых реплик. Один префикс `route-` не доказывает суффикс hash или неизменность базы; сравните выданные файлы и результат рендеринга.


  Selector Service должен совпадать с метками шаблонов Pod, которые отличаются от меток metadata Deployment. При построении общего пула релизов проследите эти метки от каждого Deployment до Pod и EndpointSlices. Проверяйте каждый релиз напрямую и через общий endpoint: работающий процесс может слушать другой порт, чем targetPort Service. Соотношение реплик описывает ёмкость, а не измеренные веса запросов. Session affinity, повторное использование соединений и малая выборка могут искажать трафик.


  Источники: [Kustomize](https://kubernetes.io/docs/tasks/manage-kubernetes-objects/kustomization/), [EndpointSlice](https://kubernetes.io/docs/concepts/services-networking/endpoint-slices/).


  В задании 108 отрендерьте и примените recovery overlay:


  ```sh

  cd ~/quest

  kubectl kustomize overlays/recovery

  kubectl apply -k overlays/recovery

  kubectl rollout status deployment/board --timeout=90s

  ```


  В задании 115 изучите Service и готовые endpoint:


  ```sh

  cd ~/quest

  kubectl get service board -o yaml

  kubectl get endpointslices -l kubernetes.io/service-name=board -o yaml

  kubectl get pods -l app=blue -o wide

  kubectl get pods -l app=green -o wide

  ```

  '
