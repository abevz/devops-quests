heading: Overlay конфигурации и переключение выпуска
text: '# Overlay конфигурации и переключение выпуска


  Используйте только офлайн-песочницу. База Kustomize содержит повторно используемые ресурсы; overlay меняет выбранные части и может создать ConfigMap. В задании 108 изучите `base/board.yaml`, `base/kustomization.yaml` и `overlays/recovery/kustomization.yaml`. Цель patch должна указывать имя настоящего Deployment. Отрендерьте overlay до применения, изучите созданную ConfigMap и переписанную ссылку в окружении, затем дождитесь двух готовых реплик. Один префикс `route-` не доказывает суффикс hash или неизменность базы; сравните выданные файлы и результат рендеринга.


  Selector Service должен совпадать с метками шаблонов Pod, которые отличаются от меток metadata Deployment. При построении общего пула релизов проследите эти метки от каждого Deployment до Pod и EndpointSlices. Проверяйте каждый релиз напрямую и через общий endpoint: работающий процесс может слушать другой порт, чем targetPort Service. Соотношение реплик описывает ёмкость, а не измеренные веса запросов. Session affinity, повторное использование соединений и малая выборка могут искажать трафик.


  Источники: [Kustomize](https://kubernetes.io/docs/tasks/manage-kubernetes-objects/kustomization/), [EndpointSlice](https://kubernetes.io/docs/concepts/services-networking/endpoint-slices/).


  В задании 108 отрендерьте и примените recovery overlay:


  ```sh

  cd ~/quest

  kubectl kustomize overlays/recovery

  kubectl apply -k overlays/recovery

  kubectl rollout status deployment/board --timeout=90s

  ```


  В задании 115 изучите Service и готовые endpoint:


  ```sh

  cd ~/quest

  kubectl get service board -o yaml

  kubectl get endpointslices -l kubernetes.io/service-name=board -o yaml

  kubectl get pods -l app=blue -o wide

  kubectl get pods -l app=green -o wide

  ```



  ### Рендер overlay восстановления {#q108-overlay-render}


  Recovery overlay мог ссылаться на отсутствующую базу или иметь неверную цель патча. Отрендерите его локально и разберите первую ошибку Kustomize перед применением.


  ```bash

  kubectl kustomize overlays/recovery

  ```


  ### Данные маршрута после рендера {#q108-rendered-route-map}


  Отрендеренный worker мог ссылаться на ConfigMap из базы, либо данные отличаются. Проследите ссылку ROUTE и проверьте, что в указанной карте ровно ROUTE=north-108.


  ```bash

  kubectl kustomize overlays/recovery

  ```


  ### Имя сгенерированного ConfigMap {#q108-rendered-generated-map-name}


  Overlay мог сослаться на статичное имя, либо сгенерированное имя не попало в ссылку. Проверьте, какую карту использует отрендеренный worker и начинается ли её имя с route-.


  ```bash

  kubectl kustomize overlays/recovery | awk ''/^kind: ConfigMap$/{show=1} show && /^  name:/{print; show=0}''

  ```


  ### Число реплик после рендера {#q108-rendered-replica-count}


  Патч overlay мог выбрать другой объект. Убедитесь, что в результате есть ровно один Deployment board с двумя желаемыми репликами.


  ```bash

  kubectl kustomize overlays/recovery | awk ''/^kind: Deployment$/{show=1} show && /^  replicas:/{print; show=0}''

  ```


  ### Идентификатор существующего Deployment {#q108-original-live-deployment}


  Замена board вместо обновления могла навсегда изменить UID. Перед применением overlay к существующему объекту сравните текущий UID с исходным.


  ```bash

  kubectl get deployment board -o jsonpath=''{.metadata.uid}''

  ```


  ### Применённое число реплик {#q108-applied-replica-count}


  Overlay может рендериться верно, пока у board старое желаемое число реплик. Примените исправленный overlay и проверьте две реплики в спецификации.


  ```bash

  kubectl get deployment board -o jsonpath=''{.spec.replicas}''

  ```


  ### Готовые реплики после применения {#q108-applied-ready-replicas}


  Желаемое число реплик уже могло примениться, но Pod ещё запускаются или ждут входных данных. Проверьте Pod и дождитесь ровно двух готовых реплик board.


  ```bash

  kubectl get deployment board -o jsonpath=''{.status.readyReplicas}''; kubectl get pods -l app=board

  ```


  ### Ссылка worker на ConfigMap {#q108-live-worker-route-reference}


  В кластере worker мог сохранить литерал или ссылаться на старое имя карты. Проверьте единственную запись ROUTE и свяжите её с ключом ROUTE в текущем отрендеренном ConfigMap.


  ```bash

  kubectl get deployment board -o json | jq ''.spec.template.spec.containers[] | select(.name == "worker") | .env''

  ```


  ### Применённые данные маршрута {#q108-applied-route-map-data}


  Текущий сгенерированный ConfigMap мог отсутствовать в кластере или содержать старые данные. Сверьте карту из текущего рендера с точным содержимым ROUTE=north-108.


  ```bash

  kubectl get configmap -o json | jq ''.items[] | select(.metadata.name | startswith("route-")) | {name: .metadata.name, data}''

  ```


  ### Ответ Service после rollout {#q108-service-rollout-response}


  Объекты API могут быть верными, пока Service ведёт к старому или недоступному Pod. После rollout прочитайте фактический ответ board и сравните с north-108.


  ```bash

  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080

  ```


  ### Входы проверки рендера {#q108-overlay-render-observer-input}


  Проверка рендера может остановиться до указания поля, если недоступен каталог или инструмент. Проверьте путь overlay и выполните рендер со станции.


  ```bash

  command -v python3; kubectl kustomize overlays/recovery

  ```


  ### Входы проверки применённого overlay {#q108-applied-overlay-observer-input}


  Проверка применения может остановиться до сравнения объектов, если не удаётся отрендерить overlay или открыть рабочую папку. Проверьте рендер и доступ к станции и кластеру.


  ```bash

  kubectl kustomize overlays/recovery; kubectl get deployment board -o name

  ```



  ### Селектор только для green {#q115-green-release-selector}


  Service мог всё ещё выбирать blue или пропускать текущий Pod green. Проверьте app=green, покрытие нужных Pod и исключение других нагрузок.


  ```bash

  kubectl get service board -o jsonpath=''{.spec.selector}''; kubectl get pods --show-labels

  ```


  ### HTTP-ответ только green {#q115-green-release-service-http}


  При правильном селекторе может не быть готового endpoint green или всё ещё отдаётся старая версия. Запросите board из client и сравните с green-115.


  ```bash

  kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080

  ```


  ### Желаемые реплики blue {#q115-canary-blue-desired-count}


  У blue могло остаться прежнее число реплик, либо Deployment отсутствует. Проверьте, что blue запрашивает три реплики для общего пула.


  ```bash

  kubectl get deployment blue -o jsonpath=''{.spec.replicas}''

  ```


  ### Готовые реплики blue {#q115-canary-blue-ready-count}


  Blue мог запросить три реплики, пока часть Pod не готова. Проверьте текущие Pod blue и дождитесь трёх готовых реплик.


  ```bash

  kubectl get deployment blue -o jsonpath=''{.status.readyReplicas}''; kubectl get pods -l app=blue

  ```


  ### Желаемые реплики green {#q115-canary-green-desired-count}


  Green мог масштабироваться до неверного размера для общего пула. Проверьте желаемое число и сохраните одну реплику.


  ```bash

  kubectl get deployment green -o jsonpath=''{.spec.replicas}''

  ```


  ### Готовые реплики green {#q115-canary-green-ready-count}


  Реплика green могла ожидать размещения или не пройти readiness после перехода. Проверьте Pod green и дождитесь одной готовой реплики.


  ```bash

  kubectl get deployment green -o jsonpath=''{.status.readyReplicas}''; kubectl get pods -l app=green

  ```


  ### Селектор общего пула {#q115-shared-release-selector}


  Service мог всё ещё выбирать один цвет или захватывать постороннюю нагрузку. Сверьте release=board и дополнительные селекторы с Pod blue и green общего релиза.


  ```bash

  kubectl get service board -o jsonpath=''{.spec.selector}''; kubectl get pods --show-labels

  ```


  ### Уникальные имена готовых endpoints {#q115-shared-ready-endpoint-names}


  Во время rollout у Service могут отсутствовать цели endpoints либо остаться старые или неготовые. Проверьте EndpointSlice и после стабилизации найдите четыре разных имени готовых целей.


  ```bash

  kubectl get endpointslices -l kubernetes.io/service-name=board -o json | jq ''[.items[].endpoints[] | select(.conditions.ready == true) | .targetRef.name] | unique''

  ```


  ### Назначенные адреса Pod blue {#q115-blue-pod-addresses}


  Запрос Pod blue может не вернуть адрес, пока не завершилось размещение или настройка сети. Проверьте назначенные IP у Pod app=blue.


  ```bash

  kubectl get pods -l app=blue -o wide

  ```


  ### Назначенные адреса Pod green {#q115-green-pod-addresses}


  Запрос Pod green может не вернуть адрес, пока не завершилось размещение или настройка сети. Проверьте назначенные IP у Pod app=green.


  ```bash

  kubectl get pods -l app=green -o wide

  ```


  ### Прямой ответ blue {#q115-blue-direct-response}


  Отдельный Pod blue мог отдавать другое содержимое или не отвечать напрямую. Запросите его IP из client и сравните с blue-115.


  ```bash

  for address in $(kubectl get pods -l app=blue -o jsonpath=''{.items[*].status.podIP}''); do kubectl exec deployment/client -- wget -qO- -T 2 "http://$address:8080"; done

  ```


  ### Прямой ответ green {#q115-green-direct-response}


  Отдельный Pod green мог отдавать другое содержимое или не отвечать напрямую. Запросите его IP из client и сравните с green-115.


  ```bash

  for address in $(kubectl get pods -l app=green -o jsonpath=''{.items[*].status.podIP}''); do kubectl exec deployment/client -- wget -qO- -T 2 "http://$address:8080"; done

  ```


  ### Ответ общего Service {#q115-shared-canary-service-response}


  У общего Service может не быть доступного endpoint или он ведёт к другой нагрузке. Запрос из client должен возвращать blue-115 или green-115.


  ```bash

  kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080

  ```


  ### Лимит времени прямых запросов {#q115-bounded-pod-probes}


  Медленные запросы Kubernetes, тайм-ауты или лишние адреса Pod могли оставить часть IP вне отведённого времени. Проверьте перечисленные адреса отдельно и дождитесь стабилизации rollout.


  ```bash

  kubectl get pods -l release=board -o wide

  ```


  ### Входы проверки только green {#q115-green-selector-observer-input}


  Проверка green может остановиться до указания условия при ошибке локального процесса или входов. Проверьте инструменты и доступ к Service и Pod green.


  ```bash

  command -v python3; kubectl get service board -o name; kubectl get pods -l app=green

  ```


  ### Входы проверки общего селектора {#q115-shared-selector-observer-input}


  Проверка общего селектора и endpoints может завершиться без конкретного условия, если недоступны инструменты или данные. Проверьте доступ к Service board и EndpointSlice.


  ```bash

  command -v python3; kubectl get service board -o name; kubectl get endpointslices -l kubernetes.io/service-name=board

  ```


  ### Входы прямых проверок и проверки Service {#q115-shared-http-observer-input}


  Проверка прямых запросов и общего Service может завершиться до указания адреса при ошибке процесса или входов. Проверьте Python и текущие нагрузки blue, green и client.


  ```bash

  command -v python3; kubectl get pods -l release=board -o wide; kubectl get deployment client -o name

  ```

  '
