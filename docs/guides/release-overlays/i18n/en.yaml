heading: Configuration overlays and release switching
text: '# Configuration overlays and release switching


  Use only the offline bay. A Kustomize base contains reusable resources; an overlay changes selected parts and can generate a ConfigMap. In quest 108 inspect `base/board.yaml`, `base/kustomization.yaml` and `overlays/recovery/kustomization.yaml`. A patch target must name the actual Deployment. Render the overlay before applying it, inspect the generated ConfigMap and the rewritten environment reference, then wait for two ready replicas. A `route-` name prefix alone does not prove a hash suffix or an unchanged base; compare the supplied files and rendered output yourself.


  A Service selector must match Pod template labels, which are distinct from Deployment metadata labels. When building a shared release pool, trace those labels through each Deployment to its Pods and EndpointSlices. Validate each release directly as well as the shared endpoint; a running process may listen on a different port from the Service target. A replica ratio describes capacity, not measured request weights. Session affinity, connection reuse and small samples can skew traffic.


  References: [Kustomize](https://kubernetes.io/docs/tasks/manage-kubernetes-objects/kustomization/), [EndpointSlices](https://kubernetes.io/docs/concepts/services-networking/endpoint-slices/).


  In quest 108, render and apply the recovery overlay:


  ```sh

  cd ~/quest

  kubectl kustomize overlays/recovery

  kubectl apply -k overlays/recovery

  kubectl rollout status deployment/board --timeout=90s

  ```


  In quest 115, inspect the Service and ready endpoints:


  ```sh

  cd ~/quest

  kubectl get service board -o yaml

  kubectl get endpointslices -l kubernetes.io/service-name=board -o yaml

  kubectl get pods -l app=blue -o wide

  kubectl get pods -l app=green -o wide

  ```



  ### Render the recovery overlay {#q108-overlay-render}


  The recovery overlay may point at a missing base or have an invalid patch target. Render it locally and inspect the first Kustomize error before applying it.


  ```bash

  kubectl kustomize overlays/recovery

  ```


  ### Rendered route data {#q108-rendered-route-map}


  The rendered worker may still reference the base ConfigMap or the generated data may differ. Follow its ROUTE reference and check that the referenced map contains exactly ROUTE=north-108.


  ```bash

  kubectl kustomize overlays/recovery

  ```


  ### Generated ConfigMap name {#q108-rendered-generated-map-name}


  The overlay may reference a static name or the generated name may not be propagated. Inspect which map the rendered worker references and check that its name starts with route-.


  ```bash

  kubectl kustomize overlays/recovery | awk ''/^kind: ConfigMap$/{show=1} show && /^  name:/{print; show=0}''

  ```


  ### Rendered replica count {#q108-rendered-replica-count}


  The overlay patch may target an object other than Deployment board. Check that the render contains exactly one board Deployment and two desired replicas.


  ```bash

  kubectl kustomize overlays/recovery | awk ''/^kind: Deployment$/{show=1} show && /^  replicas:/{print; show=0}''

  ```


  ### Existing Deployment identity {#q108-original-live-deployment}


  Replacing board instead of updating it may have permanently changed its UID. Compare the live UID with the frozen original before applying the overlay to the existing object.


  ```bash

  kubectl get deployment board -o jsonpath=''{.metadata.uid}''

  ```


  ### Applied replica count {#q108-applied-replica-count}


  The overlay can render correctly while the live board still has the old desired count. Apply the corrected overlay and confirm two replicas in its live specification.


  ```bash

  kubectl get deployment board -o jsonpath=''{.spec.replicas}''

  ```


  ### Ready replicas after apply {#q108-applied-ready-replicas}


  The desired replicas may have been applied but the Pods are still starting or blocked by unavailable inputs. Inspect the Pods and wait for exactly two ready board replicas.


  ```bash

  kubectl get deployment board -o jsonpath=''{.status.readyReplicas}''; kubectl get pods -l app=board

  ```


  ### Worker ConfigMap reference {#q108-live-worker-route-reference}


  The live worker may still inject a literal or reference the old generated map name. Inspect its single ROUTE entry and point it at key ROUTE in the currently rendered ConfigMap.


  ```bash

  kubectl get deployment board -o json | jq ''.spec.template.spec.containers[] | select(.name == "worker") | .env''

  ```


  ### Applied route data {#q108-applied-route-map-data}


  The current generated ConfigMap may be missing from the cluster or carry stale data. Compare the live map matching the current render with the exact ROUTE=north-108 payload.


  ```bash

  kubectl get configmap -o json | jq ''.items[] | select(.metadata.name | startswith("route-")) | {name: .metadata.name, data}''

  ```


  ### Service response after rollout {#q108-service-rollout-response}


  The API objects may be correct while the Service still reaches an old or unavailable Pod. Read the actual response from board after rollout and compare with north-108.


  ```bash

  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080

  ```


  ### Inputs to the render check {#q108-overlay-render-observer-input}


  The render observer may stop before identifying a field when its input path or local tools cannot be used. Check the overlay path and render from the workstation.


  ```bash

  command -v python3; kubectl kustomize overlays/recovery

  ```


  ### Inputs to the live overlay check {#q108-applied-overlay-observer-input}


  The live observer may stop before comparing the applied objects when it cannot render the overlay or access the workspace. Verify the render and both local and cluster access.


  ```bash

  kubectl kustomize overlays/recovery; kubectl get deployment board -o name

  ```



  ### Selector for green only {#q115-green-release-selector}


  The Service may still select blue or miss a current green Pod. Check that the selector includes app=green, covers the intended current Pods and excludes other workloads.


  ```bash

  kubectl get service board -o jsonpath=''{.spec.selector}''; kubectl get pods --show-labels

  ```


  ### Green-only HTTP response {#q115-green-release-service-http}


  A correct selector may still have no ready green endpoint or serve the old release. Query board from client and compare with green-115.


  ```bash

  kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080

  ```


  ### Desired blue replicas {#q115-canary-blue-desired-count}


  Blue may still have its previous desired count or be missing. Check that the live blue Deployment requests three replicas in the shared pool.


  ```bash

  kubectl get deployment blue -o jsonpath=''{.spec.replicas}''

  ```


  ### Ready blue replicas {#q115-canary-blue-ready-count}


  Blue may request three replicas while one or more Pods are still unready. Inspect the current blue Pods and wait for three ready replicas.


  ```bash

  kubectl get deployment blue -o jsonpath=''{.status.readyReplicas}''; kubectl get pods -l app=blue

  ```


  ### Desired green replicas {#q115-canary-green-desired-count}


  Green may have scaled to the wrong size for the shared pool. Inspect its desired count and keep it at one replica.


  ```bash

  kubectl get deployment green -o jsonpath=''{.spec.replicas}''

  ```


  ### Ready green replicas {#q115-canary-green-ready-count}


  The green replica may be pending or fail readiness after the transition. Inspect the green Pod and wait for one ready replica.


  ```bash

  kubectl get deployment green -o jsonpath=''{.status.readyReplicas}''; kubectl get pods -l app=green

  ```


  ### Selector for the shared pool {#q115-shared-release-selector}


  The Service may still select one color or may include an unrelated workload. Check release=board and any extra selectors against both blue and green Pods in the shared release.


  ```bash

  kubectl get service board -o jsonpath=''{.spec.selector}''; kubectl get pods --show-labels

  ```


  ### Distinct ready endpoint names {#q115-shared-ready-endpoint-names}


  The Service may expose missing, stale or unready endpoint targets during rollout. Inspect EndpointSlices and count four distinct ready target names after convergence.


  ```bash

  kubectl get endpointslices -l kubernetes.io/service-name=board -o json | jq ''[.items[].endpoints[] | select(.conditions.ready == true) | .targetRef.name] | unique''

  ```


  ### Assigned blue Pod addresses {#q115-blue-pod-addresses}


  The blue Pod lookup may return no usable address while scheduling or networking is incomplete. Check that the app=blue Pods have assigned IPs.


  ```bash

  kubectl get pods -l app=blue -o wide

  ```


  ### Assigned green Pod addresses {#q115-green-pod-addresses}


  The green Pod lookup may return no usable address while scheduling or networking is incomplete. Check that the app=green Pods have assigned IPs.


  ```bash

  kubectl get pods -l app=green -o wide

  ```


  ### Direct response from blue {#q115-blue-direct-response}


  An individual blue Pod may serve the wrong content or fail a direct request. Query the affected Pod IP from client and compare with blue-115.


  ```bash

  for address in $(kubectl get pods -l app=blue -o jsonpath=''{.items[*].status.podIP}''); do kubectl exec deployment/client -- wget -qO- -T 2 "http://$address:8080"; done

  ```


  ### Direct response from green {#q115-green-direct-response}


  An individual green Pod may serve the wrong content or fail a direct request. Query the affected Pod IP from client and compare with green-115.


  ```bash

  for address in $(kubectl get pods -l app=green -o jsonpath=''{.items[*].status.podIP}''); do kubectl exec deployment/client -- wget -qO- -T 2 "http://$address:8080"; done

  ```


  ### Response from the shared Service {#q115-shared-canary-service-response}


  The shared Service may have no reachable endpoint or return a body from another workload. A live request from client should return blue-115 or green-115.


  ```bash

  kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080

  ```


  ### Time budget for direct probes {#q115-bounded-pod-probes}


  Slow Kubernetes lookups, request timeouts or extra Pod addresses may leave some addresses untested in the reserved probe window. Inspect the listed pending addresses individually and let the rollout converge.


  ```bash

  kubectl get pods -l release=board -o wide

  ```


  ### Inputs to the green-only check {#q115-green-selector-observer-input}


  The green-only observer may fail before detecting a condition when its local process or inputs cannot start. Check the tools and access to the Service and green Pods.


  ```bash

  command -v python3; kubectl get service board -o name; kubectl get pods -l app=green

  ```


  ### Inputs to the shared selector check {#q115-shared-selector-observer-input}


  The shared selector and endpoint observer may fail before naming a condition if tooling or live inputs are unavailable. Check access to the board Service and EndpointSlices.


  ```bash

  command -v python3; kubectl get service board -o name; kubectl get endpointslices -l kubernetes.io/service-name=board

  ```


  ### Inputs to the direct and Service checks {#q115-shared-http-observer-input}


  The direct Pod and shared Service observer may stop before naming a failed address when the workstation process or input fails. Verify Python and the current blue, green and client workloads.


  ```bash

  command -v python3; kubectl get pods -l release=board -o wide; kubectl get deployment client -o name

  ```

  '
