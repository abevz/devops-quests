heading: Configuration overlays and release switching
text: '# Configuration overlays and release switching


  Use only the offline bay. A Kustomize base contains reusable resources; an overlay changes selected parts and can generate a ConfigMap. In quest 108 inspect `base/board.yaml`, `base/kustomization.yaml` and `overlays/recovery/kustomization.yaml`. A patch target must name the actual Deployment. Render the overlay before applying it, inspect the generated ConfigMap and the rewritten environment reference, then wait for two ready replicas. A `route-` name prefix alone does not prove a hash suffix or an unchanged base; compare the supplied files and rendered output yourself.


  A Service selector must match Pod template labels, which are distinct from Deployment metadata labels. When building a shared release pool, trace those labels through each Deployment to its Pods and EndpointSlices. Validate each release directly as well as the shared endpoint; a running process may listen on a different port from the Service target. A replica ratio describes capacity, not measured request weights. Session affinity, connection reuse and small samples can skew traffic.


  References: [Kustomize](https://kubernetes.io/docs/tasks/manage-kubernetes-objects/kustomization/), [EndpointSlices](https://kubernetes.io/docs/concepts/services-networking/endpoint-slices/).


  In quest 108, render and apply the recovery overlay:


  ```sh

  cd ~/quest

  kubectl kustomize overlays/recovery

  kubectl apply -k overlays/recovery

  kubectl rollout status deployment/board --timeout=90s

  ```


  In quest 115, inspect the Service and ready endpoints:


  ```sh

  cd ~/quest

  kubectl get service board -o yaml

  kubectl get endpointslices -l kubernetes.io/service-name=board -o yaml

  kubectl get pods -l app=blue -o wide

  kubectl get pods -l app=green -o wide

  ```

  '
