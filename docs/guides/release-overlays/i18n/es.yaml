heading: Overlays de configuración y cambio de versión
text: '# Overlays de configuración y cambio de versión


  Usa solo la bahía sin conexión. Una base Kustomize contiene recursos reutilizables; un overlay cambia partes seleccionadas y puede generar un ConfigMap. En la misión 108 inspecciona `base/board.yaml`, `base/kustomization.yaml` y `overlays/recovery/kustomization.yaml`. El destino del patch debe nombrar el Deployment real. Renderiza el overlay antes de aplicarlo, inspecciona el ConfigMap generado y la referencia de entorno reescrita, y espera dos réplicas listas. El prefijo `route-` por sí solo no demuestra un sufijo hash ni una base intacta; compara los archivos y el resultado renderizado.


  El selector de un Service debe coincidir con las etiquetas de las plantillas de Pod, distintas de las etiquetas metadata del Deployment. Al construir un grupo compartido de versiones, sigue las etiquetas desde cada Deployment hasta los Pods y EndpointSlices. Valida cada versión directamente y a través del endpoint común: un proceso activo puede escuchar en un puerto distinto del destino del Service. La proporción de réplicas describe capacidad, no pesos medidos de solicitudes. La afinidad de sesión, la reutilización de conexiones y las muestras pequeñas pueden sesgar el tráfico.


  Referencias: [Kustomize](https://kubernetes.io/docs/tasks/manage-kubernetes-objects/kustomization/), [EndpointSlices](https://kubernetes.io/docs/concepts/services-networking/endpoint-slices/).


  En la misión 108 renderiza y aplica el overlay recovery:


  ```sh

  cd ~/quest

  kubectl kustomize overlays/recovery

  kubectl apply -k overlays/recovery

  kubectl rollout status deployment/board --timeout=90s

  ```


  En la misión 115 inspecciona el Service y endpoints listos:


  ```sh

  cd ~/quest

  kubectl get service board -o yaml

  kubectl get endpointslices -l kubernetes.io/service-name=board -o yaml

  kubectl get pods -l app=blue -o wide

  kubectl get pods -l app=green -o wide

  ```



  ### Generación del overlay recovery {#q108-overlay-render}


  El overlay recovery puede señalar una base ausente o un destino de parche inválido. Genérelo localmente y revise el primer error de Kustomize antes de aplicarlo.


  ```bash

  kubectl kustomize overlays/recovery

  ```


  ### Datos de ruta generados {#q108-rendered-route-map}


  El contenedor worker generado puede referenciar el ConfigMap base o tener otros datos. Siga ROUTE y compruebe que el ConfigMap indicado contiene exactamente ROUTE=north-108.


  ```bash

  kubectl kustomize overlays/recovery

  ```


  ### Nombre del ConfigMap generado {#q108-rendered-generated-map-name}


  El overlay puede apuntar a un nombre estático o no propagar el nombre generado. Revise qué mapa referencia el contenedor worker generado y que su nombre empiece por route-.


  ```bash

  kubectl kustomize overlays/recovery | awk ''/^kind: ConfigMap$/{show=1} show && /^  name:/{print; show=0}''

  ```


  ### Cantidad de réplicas generada {#q108-rendered-replica-count}


  El parche destinado a board puede apuntar a otro objeto. Compruebe que el resultado contenga un único Deployment board con dos réplicas deseadas.


  ```bash

  kubectl kustomize overlays/recovery | awk ''/^kind: Deployment$/{show=1} show && /^  replicas:/{print; show=0}''

  ```


  ### Identidad del Deployment existente {#q108-original-live-deployment}


  Reemplazar board en vez de actualizarlo puede haber cambiado su UID de forma irreversible. Compare el UID activo con el original antes de aplicar el overlay al objeto existente.


  ```bash

  kubectl get deployment board -o jsonpath=''{.metadata.uid}''

  ```


  ### Cantidad aplicada de réplicas {#q108-applied-replica-count}


  El overlay puede generarse bien mientras board conserva el total deseado anterior. Aplique el overlay corregido y compruebe dos réplicas en la especificación activa.


  ```bash

  kubectl get deployment board -o jsonpath=''{.spec.replicas}''

  ```


  ### Réplicas listas tras aplicar {#q108-applied-ready-replicas}


  Las réplicas deseadas pueden haberse aplicado, pero los Pods aún arrancan o esperan entradas. Revise los Pods y espere exactamente dos réplicas listas de board.


  ```bash

  kubectl get deployment board -o jsonpath=''{.status.readyReplicas}''; kubectl get pods -l app=board

  ```


  ### Referencia del worker al ConfigMap {#q108-live-worker-route-reference}


  El contenedor worker activo puede conservar un literal o referenciar el mapa anterior. Revise su única entrada ROUTE y apúntela a la clave ROUTE del ConfigMap generado actual.


  ```bash

  kubectl get deployment board -o json | jq ''.spec.template.spec.containers[] | select(.name == "worker") | .env''

  ```


  ### Datos de ruta aplicados {#q108-applied-route-map-data}


  El ConfigMap generado actual puede faltar en el clúster o conservar datos antiguos. Compare el mapa que coincide con el render actual y el contenido exacto ROUTE=north-108.


  ```bash

  kubectl get configmap -o json | jq ''.items[] | select(.metadata.name | startswith("route-")) | {name: .metadata.name, data}''

  ```


  ### Respuesta del Service tras el despliegue {#q108-service-rollout-response}


  Los objetos API pueden ser correctos aunque el Service alcance un Pod anterior o no disponible. Lea la respuesta real de board tras el despliegue y compare con north-108.


  ```bash

  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080

  ```


  ### Entradas de la comprobación de generación {#q108-overlay-render-observer-input}


  El observador puede detenerse antes de señalar un campo si no puede usar la ruta o las herramientas locales. Revise la ruta del overlay y genere desde la estación.


  ```bash

  command -v python3; kubectl kustomize overlays/recovery

  ```


  ### Entradas de la comprobación del overlay aplicado {#q108-applied-overlay-observer-input}


  El observador puede detenerse antes de comparar los objetos si no puede generar el overlay o abrir el directorio. Revise el render y el acceso local y al clúster.


  ```bash

  kubectl kustomize overlays/recovery; kubectl get deployment board -o name

  ```

  '
