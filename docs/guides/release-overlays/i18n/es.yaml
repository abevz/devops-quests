heading: Overlays de configuración y cambio de versión
text: '# Overlays de configuración y cambio de versión


  Usa solo la bahía sin conexión. Una base Kustomize contiene recursos reutilizables; un overlay cambia partes seleccionadas y puede generar un ConfigMap. En la misión 108 inspecciona `base/board.json`, `base/kustomization.yaml` y `overlays/recovery/kustomization.yaml`. El destino del patch debe nombrar el Deployment real. Renderiza el overlay antes de aplicarlo, inspecciona el ConfigMap generado y la referencia de entorno reescrita, y espera dos réplicas listas. El prefijo `route-` por sí solo no demuestra un sufijo hash ni una base intacta; compara los archivos y el resultado renderizado.


  Un Service selecciona Pods por etiquetas y publica endpoints listos. En la primera etapa de la misión 115 selecciona la versión green y prueba la respuesta. Al comenzar la segunda etapa la bahía añade una etiqueta común y cambia el selector; escala blue a tres réplicas y green a una, espera disponibilidad, inspecciona EndpointSlices y consulta cada IP de Pod. Una petición al Service muestra una respuesta, no una distribución exacta 3:1. La comprobación cuenta cuatro nombres de endpoints listos pero no los relaciona con los Pods de versión. Afinidad de sesión, reutilización de conexiones y muestras pequeñas pueden sesgar el tráfico.


  Referencias: [Kustomize](https://kubernetes.io/docs/tasks/manage-kubernetes-objects/kustomization/), [EndpointSlices](https://kubernetes.io/docs/concepts/services-networking/endpoint-slices/).


  En la misión 108 renderiza y aplica el overlay recovery:


  ```sh

  cd ~/quest

  kubectl kustomize overlays/recovery

  kubectl apply -k overlays/recovery

  kubectl rollout status deployment/board --timeout=90s

  ```


  En la misión 115 inspecciona el Service y endpoints listos:


  ```sh

  cd ~/quest

  kubectl get service board -o yaml

  kubectl get endpointslices -l kubernetes.io/service-name=board -o yaml

  kubectl get pods -l app=blue -o wide

  kubectl get pods -l app=green -o wide

  ```

  '
