heading: Overlays de configuración y cambio de versión
text: '# Overlays de configuración y cambio de versión


  Usa solo la bahía sin conexión. Una base Kustomize contiene recursos reutilizables; un overlay cambia partes seleccionadas y puede generar un ConfigMap. En la misión 108 inspecciona `base/board.yaml`, `base/kustomization.yaml` y `overlays/recovery/kustomization.yaml`. El destino del patch debe nombrar el Deployment real. Renderiza el overlay antes de aplicarlo, inspecciona el ConfigMap generado y la referencia de entorno reescrita, y espera dos réplicas listas. El prefijo `route-` por sí solo no demuestra un sufijo hash ni una base intacta; compara los archivos y el resultado renderizado.


  El selector de un Service debe coincidir con las etiquetas de las plantillas de Pod, distintas de las etiquetas metadata del Deployment. Al construir un grupo compartido de versiones, sigue las etiquetas desde cada Deployment hasta los Pods y EndpointSlices. Valida cada versión directamente y a través del endpoint común: un proceso activo puede escuchar en un puerto distinto del destino del Service. La proporción de réplicas describe capacidad, no pesos medidos de solicitudes. La afinidad de sesión, la reutilización de conexiones y las muestras pequeñas pueden sesgar el tráfico.


  Referencias: [Kustomize](https://kubernetes.io/docs/tasks/manage-kubernetes-objects/kustomization/), [EndpointSlices](https://kubernetes.io/docs/concepts/services-networking/endpoint-slices/).


  En la misión 108 renderiza y aplica el overlay recovery:


  ```sh

  cd ~/quest

  kubectl kustomize overlays/recovery

  kubectl apply -k overlays/recovery

  kubectl rollout status deployment/board --timeout=90s

  ```


  En la misión 115 inspecciona el Service y endpoints listos:


  ```sh

  cd ~/quest

  kubectl get service board -o yaml

  kubectl get endpointslices -l kubernetes.io/service-name=board -o yaml

  kubectl get pods -l app=blue -o wide

  kubectl get pods -l app=green -o wide

  ```

  '
