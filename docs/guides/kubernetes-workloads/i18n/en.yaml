heading: Kubernetes workload recovery
text: '# Kubernetes workload recovery


  These steps are for the disposable quest bay. A controller creates Pods from a template; changes and readiness take time. Inspect the supplied manifests before modifying the live objects, then wait and verify the actual Pods and responses.


  ## Init containers and native sidecars


  Ordinary init containers in `initContainers` run in order and must finish before normal application containers start. A native sidecar is an init container with `restartPolicy: Always`; it can continue running alongside the application. Its `startupProbe` can gate the next container. Containers can exchange files through a shared `emptyDir`, which lasts for the Pod lifetime. Use `kubectl get pods` and `kubectl describe pod` to inspect states and events; compare the probe, commands and volumes with `board.json`. A running process alone does not prove the application can read its input.


  ## Deployment rollouts and rollback


  A Deployment manages replicas and rollout revisions of its Pod template. `Recreate` removes old Pods before replacements; `RollingUpdate` controls replacement using `maxUnavailable` and `maxSurge`. Inspect `kubectl rollout history deployment/board` and the supplied `healthy-revision` before a rollback with `kubectl rollout undo deployment/board --to-revision=N`, replacing N with the recorded revision. Wait with `kubectl rollout status deployment/board --timeout=90s`, then inspect readiness and the service response. Keeping the UID in `original-deployment-uid` preserves the same Deployment object. A ready count alone does not guarantee uninterrupted service.


  ## DaemonSet placement


  A DaemonSet creates a Pod on each eligible node. A `nodeSelector` narrows eligibility; inspect `kubectl get nodes --show-labels` and the supplied `relay.json`. Do not change node labels to manufacture a match. Wait with `kubectl rollout status daemonset/relay --timeout=90s`, then compare desired, ready and available counts and inspect the Pod owner and node. Check both the Pod and Service response. Pod security settings in the manifest, including non-root execution, seccomp and capabilities, remain relevant even when placement is correct.


  References: [init and native sidecars](https://kubernetes.io/docs/concepts/workloads/pods/sidecar-containers/), [Deployments](https://kubernetes.io/docs/concepts/workloads/controllers/deployment/), [DaemonSets](https://kubernetes.io/docs/concepts/workloads/controllers/daemonset/).

  '
