heading: Kubernetes workload recovery
text: '# Kubernetes workload recovery


  These steps are for the disposable quest bay. A controller creates Pods from a template; changes and readiness take time. Inspect the supplied manifests before modifying the live objects, then wait and verify the actual Pods and responses.


  ## Init containers and native sidecars


  Ordinary init containers in `initContainers` run in order and must finish before normal application containers start. A native sidecar is an init container with `restartPolicy: Always`; it can continue running alongside the application. Its `startupProbe` can gate the next container. Containers can exchange files through a shared `emptyDir`, which lasts for the Pod lifetime. Use `kubectl get pods` and `kubectl describe pod` to inspect states and events; compare the probe, commands and volumes with `board.json`. A running process alone does not prove the application can read its input.


  ## Deployment rollouts and rollback


  A Deployment manages replicas and rollout revisions of its Pod template. `Recreate` removes old Pods before replacements; `RollingUpdate` controls replacement using `maxUnavailable` and `maxSurge`. Inspect `kubectl rollout history deployment/board` and the supplied `healthy-revision` before a rollback with `kubectl rollout undo deployment/board --to-revision=N`, replacing N with the recorded revision. Wait with `kubectl rollout status deployment/board --timeout=90s`, then inspect readiness and the service response. Keeping the UID in `original-deployment-uid` preserves the same Deployment object. A ready count alone does not guarantee uninterrupted service.


  ## DaemonSet placement


  A DaemonSet creates a Pod on each eligible node. A `nodeSelector` narrows eligibility; inspect `kubectl get nodes --show-labels` and the supplied `relay.json`. Do not change node labels to manufacture a match. Wait with `kubectl rollout status daemonset/relay --timeout=90s`, then compare desired, ready and available counts and inspect the Pod owner and node. Check both the Pod and Service response. Pod security settings in the manifest, including non-root execution, seccomp and capabilities, remain relevant even when placement is correct.


  References: [init and native sidecars](https://kubernetes.io/docs/concepts/workloads/pods/sidecar-containers/), [Deployments](https://kubernetes.io/docs/concepts/workloads/controllers/deployment/), [DaemonSets](https://kubernetes.io/docs/concepts/workloads/controllers/daemonset/).


  In quest 101, an ordinary init container must finish before later initialization; a native sidecar is a restartable init container and can keep running. Repair the `prepare` input path, preserve the watcher and ordered volumes, then inspect Pod status, the nonempty heartbeat and the board''s response. Set `prepare` to copy `/input/route` to `/shared/route` and retain the watcher startup probe `test -s /shared/heartbeat`. The probe uses `periodSeconds: 1` and `failureThreshold: 10`; one nonterminating Pod must have successful prepare, a started running watcher and a ready regular container. Check `board:8080/route` returns `north-101`; the heartbeat check does not prove it used that same Pod.


  In quest 102, use the recorded healthy revision to undo the broken Pod template. Deployment strategy is a separate field: configure the specified RollingUpdate limits, preserve the UID and two replicas, and verify readiness and response. In the next stage repair the readiness probe while retaining the new content. A zero unavailable budget alone does not guarantee zero downtime. Use numeric `maxUnavailable: 0` and `maxSurge: 1`; the expected responses are `north-102` then `north-102-v3`. The readiness HTTP port must be `8080`.


  In quest 104, a suspended CronJob does not create new scheduled Jobs. Set `suspend: false` and `concurrencyPolicy: Forbid`, retaining the schedule and other requested fields. Wait for the controller-owned successful Job whose scheduled timestamp matches the latest `lastScheduleTime`, then inspect its logs. A manually created Job does not demonstrate scheduling; a new minute may require waiting again. Its logs must equal `north-104`. Preserve `* * * * *`, `Etc/UTC`, deadline `20` and successful/failed history limits `1`.


  In quest 040, after the serial fleet stage, retain the board Service and selector while rolling out two ready replicas that serve `north-40`. Set `maxUnavailable: 0` and `maxSurge: 1`. A controller budget depends on readiness and available capacity; it does not by itself prove zero lost requests.


  In quest 072, a Job creates Pods and records failed attempts. Keep the original Job and failing command, set `backoffLimit` to 1 and `activeDeadlineSeconds` to 30, and retain `parallelism` 1 and `restartPolicy` `Never`. Compare the Job UID with `/run/dq/facts/0/original-job-uid`; verify the failed count is at least 1, the `Failed` condition and an owned failed Pod with worker exit code 1. Retry count and elapsed deadline control different bounds.

  '
