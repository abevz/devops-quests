heading: Naprawa obciążeń Kubernetes
text: |-
  # Naprawa obciążeń Kubernetes

  Używaj jednorazowej zatoki zadania. Kontroler tworzy Pody z szablonu; zmiany i gotowość wymagają czasu. Przed zmianami sprawdź podane dane i bieżące definicje obciążeń, następnie poczekaj i zweryfikuj rzeczywiste Pody i odpowiedzi.

  ## Kontenery init i natywne sidecary

  Zwykłe kontenery init w `initContainers` działają kolejno i muszą zakończyć się przed uruchomieniem zwykłych kontenerów aplikacji. Natywny sidecar jest kontenerem init z `restartPolicy: Always`; może działać dalej obok aplikacji. Jego `startupProbe` może wstrzymać kolejny kontener. Kontenery mogą wymieniać pliki przez wspólny `emptyDir`, który istnieje przez czas życia Poda. Użyj `kubectl get pods` i `kubectl describe pod`, aby sprawdzić stany i zdarzenia; porównaj probe, polecenia i wolumeny z `board.yaml`. Sam działający proces nie dowodzi, że aplikacja może odczytać wejście.

  ## Rollout i rollback Deployment

  Deployment zarządza replikami i rewizjami szablonu Poda. `Recreate` usuwa stare Pody przed zastąpieniem; `RollingUpdate` steruje wymianą przez `maxUnavailable` i `maxSurge`. Przed wycofaniem sprawdź `kubectl rollout history deployment/board` i dostarczony `healthy-revision`, a następnie użyj `kubectl rollout undo deployment/board --to-revision=N`, zastępując N zapisaną rewizją. Poczekaj przez `kubectl rollout status deployment/board --timeout=90s`, po czym sprawdź gotowość i odpowiedź usługi. Zachowanie UID z `original-deployment-uid` zachowuje ten sam obiekt Deployment. Sama liczba gotowych replik nie gwarantuje ciągłości usługi.

  ## Umieszczanie DaemonSet

  DaemonSet tworzy Pod na każdym kwalifikującym się węźle. `nodeSelector` zawęża wybór; sprawdź `kubectl get nodes --show-labels` i dostarczony `relay.yaml`. Nie zmieniaj etykiet węzłów, aby wymusić zgodność. Poczekaj przez `kubectl rollout status daemonset/relay --timeout=90s`, następnie porównaj liczby desired, ready i available oraz sprawdź właściciela i węzeł Poda. Sprawdź odpowiedzi Poda i Service. Ustawienia bezpieczeństwa Poda w manifeście, w tym non-root, seccomp i capabilities, nadal są ważne przy poprawnym umieszczeniu.

  Źródła: [init i natywne sidecary](https://kubernetes.io/docs/concepts/workloads/pods/sidecar-containers/), [Deploymenty](https://kubernetes.io/docs/concepts/workloads/controllers/deployment/), [DaemonSety](https://kubernetes.io/docs/concepts/workloads/controllers/daemonset/).

  W zadaniu 101 zwykły kontener init musi zakończyć się przed dalszą inicjalizacją; native sidecar jest restartowalnym kontenerem init i może działać dalej. Popraw ścieżkę wejścia `prepare`, zachowaj watcher i kolejność wolumenów, a następnie sprawdź stan Poda, niepusty heartbeat i odpowiedź board. Ustaw `prepare`, aby kopiował `/input/route` do `/shared/route`, i zachowaj startup probe watchera `test -s /shared/heartbeat`. Probe używa `periodSeconds: 1` i `failureThreshold: 10`; jeden Pod bez znacznika usuwania musi mieć udany prepare, uruchomiony działający watcher i gotowy zwykły kontener. Sprawdź odpowiedź `north-101` z `board:8080/route`; kontrola heartbeat nie dowodzi użycia tego samego Poda.

  W zadaniu 102 użyj zapisanej zdrowej revision, aby cofnąć uszkodzony szablon Poda. Strategia Deploymentu jest osobnym polem: ustaw podane limity RollingUpdate, zachowaj UID i dwie repliki, sprawdź gotowość oraz odpowiedź. W kolejnym etapie popraw readiness probe, zachowując nową treść. Zerowy budżet unavailable sam nie gwarantuje braku przestoju. Użyj liczbowych `maxUnavailable: 0` i `maxSurge: 1`; oczekiwane odpowiedzi to `north-102`, potem `north-102-v3`. Port HTTP readiness musi wynosić `8080`.

  CronJob planuje szablon Job. Zawieszenie wpływa na przyszłe terminy, a polityka współbieżności na nakładające się Job tego kontrolera. Zmiana szablonu nie zmienia istniejących Job. Sprawdzaj rzeczywiste wykonania powiązane z kontrolerem; sam ręczny Job nie wykazuje regularnego harmonogramu. Harmonogram, strefa, terminy i historia to osobne ustawienia.

  Strategia rolloutu kontroluje liczbę zastąpień. Sonda readiness określa, które Pody mogą obsługiwać ruch. Sprawdź jej ścieżkę HTTP osobno względem Service obsługującego ruch.

  Bieżący Job i szablon kontrolera sterują różnymi wykonaniami. Liczba ponowień, termin i restarty kontenera ograniczają różne drogi awarii. Buduj przyszłe wykonania z obserwowanego obciążenia, następnie sprawdzaj politykę i łańcuch właścicieli Job/Pod. Warunek końcowy bez zamierzonego błędu worker jest niepełnym dowodem. To bieżące obserwacje, nie pełna historia.
