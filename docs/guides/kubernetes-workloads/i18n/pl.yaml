heading: Naprawa obciążeń Kubernetes
text: '# Naprawa obciążeń Kubernetes


  Te kroki dotyczą wyłącznie jednorazowej zatoki zadań. Kontroler tworzy Pody z szablonu; zmiany i gotowość wymagają czasu. Przed zmianą działających obiektów obejrzyj dostarczone manifesty, potem poczekaj i sprawdź rzeczywiste Pody oraz odpowiedzi.


  ## Kontenery init i natywne sidecary


  Zwykłe kontenery init w `initContainers` działają kolejno i muszą zakończyć się przed uruchomieniem zwykłych kontenerów aplikacji. Natywny sidecar jest kontenerem init z `restartPolicy: Always`; może działać dalej obok aplikacji. Jego `startupProbe` może wstrzymać kolejny kontener. Kontenery mogą wymieniać pliki przez wspólny `emptyDir`, który istnieje przez czas życia Poda. Użyj `kubectl get pods` i `kubectl describe pod`, aby sprawdzić stany i zdarzenia; porównaj probe, polecenia i wolumeny z `board.json`. Sam działający proces nie dowodzi, że aplikacja może odczytać wejście.


  ## Rollout i rollback Deployment


  Deployment zarządza replikami i rewizjami szablonu Poda. `Recreate` usuwa stare Pody przed zastąpieniem; `RollingUpdate` steruje wymianą przez `maxUnavailable` i `maxSurge`. Przed wycofaniem sprawdź `kubectl rollout history deployment/board` i dostarczony `healthy-revision`, a następnie użyj `kubectl rollout undo deployment/board --to-revision=N`, zastępując N zapisaną rewizją. Poczekaj przez `kubectl rollout status deployment/board --timeout=90s`, po czym sprawdź gotowość i odpowiedź usługi. Zachowanie UID z `original-deployment-uid` zachowuje ten sam obiekt Deployment. Sama liczba gotowych replik nie gwarantuje ciągłości usługi.


  ## Umieszczanie DaemonSet


  DaemonSet tworzy Pod na każdym kwalifikującym się węźle. `nodeSelector` zawęża wybór; sprawdź `kubectl get nodes --show-labels` i dostarczony `relay.json`. Nie zmieniaj etykiet węzłów, aby wymusić zgodność. Poczekaj przez `kubectl rollout status daemonset/relay --timeout=90s`, następnie porównaj liczby desired, ready i available oraz sprawdź właściciela i węzeł Poda. Sprawdź odpowiedzi Poda i Service. Ustawienia bezpieczeństwa Poda w manifeście, w tym non-root, seccomp i capabilities, nadal są ważne przy poprawnym umieszczeniu.


  Źródła: [init i natywne sidecary](https://kubernetes.io/docs/concepts/workloads/pods/sidecar-containers/), [Deploymenty](https://kubernetes.io/docs/concepts/workloads/controllers/deployment/), [DaemonSety](https://kubernetes.io/docs/concepts/workloads/controllers/daemonset/).

  '
