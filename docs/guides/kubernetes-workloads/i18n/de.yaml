heading: Kubernetes-Workloads wiederherstellen
text: '# Kubernetes-Workloads wiederherstellen


  Diese Schritte gelten nur für die vergängliche Quest-Umgebung. Ein Controller erstellt Pods aus einer Vorlage; Änderungen und Bereitschaft brauchen Zeit. Untersuche die bereitgestellten Manifeste vor Änderungen an laufenden Objekten, warte danach und prüfe die tatsächlichen Pods und Antworten.


  ## Init-Container und native Sidecars


  Gewöhnliche Init-Container in `initContainers` laufen der Reihe nach und müssen enden, bevor normale Anwendungscontainer starten. Ein natives Sidecar ist ein Init-Container mit `restartPolicy: Always`; es kann neben der Anwendung weiterlaufen. Seine `startupProbe` kann den nächsten Container aufhalten. Container können Dateien über ein gemeinsames `emptyDir` austauschen, das für die Lebensdauer des Pods besteht. Nutze `kubectl get pods` und `kubectl describe pod` für Zustände und Ereignisse; vergleiche Probe, Befehle und Volumes mit `board.json`. Ein laufender Prozess allein beweist nicht, dass die Anwendung ihre Eingabe lesen kann.


  ## Deployment-Rollouts und Rollback


  Ein Deployment verwaltet Replikate und Revisionen seiner Pod-Vorlage. `Recreate` entfernt alte Pods vor dem Ersatz; `RollingUpdate` steuert den Austausch über `maxUnavailable` und `maxSurge`. Prüfe `kubectl rollout history deployment/board` und die bereitgestellte `healthy-revision`, bevor du mit `kubectl rollout undo deployment/board --to-revision=N` zurückrollst; ersetze N durch die gespeicherte Revision. Warte mit `kubectl rollout status deployment/board --timeout=90s` und prüfe Bereitschaft und Service-Antwort. Die UID aus `original-deployment-uid` zu erhalten bewahrt dasselbe Deployment-Objekt. Eine Anzahl bereiter Replikate garantiert allein keinen unterbrechungsfreien Dienst.


  ## DaemonSet-Platzierung


  Ein DaemonSet erstellt auf jedem geeigneten Knoten einen Pod. Ein `nodeSelector` schränkt die Auswahl ein; prüfe `kubectl get nodes --show-labels` und das bereitgestellte `relay.json`. Ändere keine Knotenlabels, um eine Übereinstimmung zu erzwingen. Warte mit `kubectl rollout status daemonset/relay --timeout=90s`, vergleiche desired, ready und available und prüfe Eigentümer und Knoten des Pods. Prüfe Antworten von Pod und Service. Pod-Sicherheit im Manifest, einschließlich Non-root, Seccomp und Capabilities, bleibt auch bei korrekter Platzierung wichtig.


  Quellen: [Init und native Sidecars](https://kubernetes.io/docs/concepts/workloads/pods/sidecar-containers/), [Deployments](https://kubernetes.io/docs/concepts/workloads/controllers/deployment/), [DaemonSets](https://kubernetes.io/docs/concepts/workloads/controllers/daemonset/).

  '
