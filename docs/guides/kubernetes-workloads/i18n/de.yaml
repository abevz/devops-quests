heading: Kubernetes-Workloads wiederherstellen
text: '# Kubernetes-Workloads wiederherstellen


  Diese Schritte gelten nur für die vergängliche Quest-Umgebung. Ein Controller erstellt Pods aus einer Vorlage; Änderungen und Bereitschaft brauchen Zeit. Untersuche die bereitgestellten Manifeste vor Änderungen an laufenden Objekten, warte danach und prüfe die tatsächlichen Pods und Antworten.


  ## Init-Container und native Sidecars


  Gewöhnliche Init-Container in `initContainers` laufen der Reihe nach und müssen enden, bevor normale Anwendungscontainer starten. Ein natives Sidecar ist ein Init-Container mit `restartPolicy: Always`; es kann neben der Anwendung weiterlaufen. Seine `startupProbe` kann den nächsten Container aufhalten. Container können Dateien über ein gemeinsames `emptyDir` austauschen, das für die Lebensdauer des Pods besteht. Nutze `kubectl get pods` und `kubectl describe pod` für Zustände und Ereignisse; vergleiche Probe, Befehle und Volumes mit `board.json`. Ein laufender Prozess allein beweist nicht, dass die Anwendung ihre Eingabe lesen kann.


  ## Deployment-Rollouts und Rollback


  Ein Deployment verwaltet Replikate und Revisionen seiner Pod-Vorlage. `Recreate` entfernt alte Pods vor dem Ersatz; `RollingUpdate` steuert den Austausch über `maxUnavailable` und `maxSurge`. Prüfe `kubectl rollout history deployment/board` und die bereitgestellte `healthy-revision`, bevor du mit `kubectl rollout undo deployment/board --to-revision=N` zurückrollst; ersetze N durch die gespeicherte Revision. Warte mit `kubectl rollout status deployment/board --timeout=90s` und prüfe Bereitschaft und Service-Antwort. Die UID aus `original-deployment-uid` zu erhalten bewahrt dasselbe Deployment-Objekt. Eine Anzahl bereiter Replikate garantiert allein keinen unterbrechungsfreien Dienst.


  ## DaemonSet-Platzierung


  Ein DaemonSet erstellt auf jedem geeigneten Knoten einen Pod. Ein `nodeSelector` schränkt die Auswahl ein; prüfe `kubectl get nodes --show-labels` und das bereitgestellte `relay.json`. Ändere keine Knotenlabels, um eine Übereinstimmung zu erzwingen. Warte mit `kubectl rollout status daemonset/relay --timeout=90s`, vergleiche desired, ready und available und prüfe Eigentümer und Knoten des Pods. Prüfe Antworten von Pod und Service. Pod-Sicherheit im Manifest, einschließlich Non-root, Seccomp und Capabilities, bleibt auch bei korrekter Platzierung wichtig.


  Quellen: [Init und native Sidecars](https://kubernetes.io/docs/concepts/workloads/pods/sidecar-containers/), [Deployments](https://kubernetes.io/docs/concepts/workloads/controllers/deployment/), [DaemonSets](https://kubernetes.io/docs/concepts/workloads/controllers/daemonset/).


  In Aufgabe 101 muss ein gewöhnlicher Init-Container vor der weiteren Initialisierung enden; ein nativer Sidecar ist ein neu startbarer Init-Container und kann weiterlaufen. Repariere den Eingabepfad von `prepare`, erhalte Watcher und Volume-Reihenfolge und prüfe Pod-Status, nicht leeren Heartbeat und Board-Antwort. Stelle `prepare` auf das Kopieren von `/input/route` nach `/shared/route` ein und behalte die Watcher-Startup-Probe `test -s /shared/heartbeat`. Die Probe nutzt `periodSeconds: 1` und `failureThreshold: 10`; ein nicht zur Löschung markierter Pod muss einen erfolgreichen Prepare, einen gestarteten laufenden Watcher und einen bereiten regulären Container haben. Prüfe, dass `board:8080/route` `north-101` liefert; die Heartbeat-Prüfung belegt nicht, dass sie denselben Pod nutzte.


  In Aufgabe 102 setzt du das defekte Pod-Template auf die aufgezeichnete fehlerfreie Revision zurück. Die Deployment-Strategie ist ein eigenes Feld: Setze die angegebenen RollingUpdate-Grenzen, erhalte UID und zwei Repliken und prüfe Bereitschaft und Antwort. Repariere im nächsten Schritt die Readiness-Probe und behalte den neuen Inhalt. Ein Unavailable-Budget von null garantiert allein keine unterbrechungsfreie Nutzung. Verwende numerisches `maxUnavailable: 0` und `maxSurge: 1`; die erwarteten Antworten sind `north-102` und anschließend `north-102-v3`. Der HTTP-Readiness-Port muss `8080` sein.


  In Aufgabe 104 erstellt ein angehaltener CronJob keine neuen geplanten Jobs. Setze `suspend: false` und `concurrencyPolicy: Forbid` und behalte Zeitplan und weitere geforderte Felder. Warte auf den erfolgreichen, vom Controller erstellten Job, dessen Scheduled Timestamp dem neuesten `lastScheduleTime` entspricht, und prüfe seine Logs. Ein manuell erstellter Job beweist die Planung nicht; beim Wechsel der Minute musst du eventuell erneut warten. Seine Logs müssen genau `north-104` entsprechen. Behalte `* * * * *`, `Etc/UTC`, Deadline `20` und die History-Limits für erfolgreiche/fehlgeschlagene Jobs `1`.


  Erhalte in Aufgabe 040 nach der seriellen Fleet-Phase den Board-Service und Selector, während du zwei bereite Repliken mit Antwort `north-40` ausrollst. Setze `maxUnavailable: 0` und `maxSurge: 1`. Das Controller-Budget hängt von Bereitschaft und verfügbarer Kapazität ab; allein belegt es nicht, dass keine Anfragen verloren gehen.


  In Aufgabe 072 erstellt ein Job Pods und erfasst fehlgeschlagene Versuche. Behalte den ursprünglichen Job und den fehlschlagenden Befehl, setze `backoffLimit` auf 1 und `activeDeadlineSeconds` auf 30 und behalte `parallelism` 1 und `restartPolicy` `Never`. Vergleiche die Job-UID mit `/run/dq/facts/0/original-job-uid`; prüfe eine Fehlerzahl von mindestens 1, die `Failed`-Bedingung und einen zugehörigen fehlgeschlagenen Pod mit Worker-Exitcode 1. Wiederholungszahl und Frist begrenzen unterschiedliche Dinge.

  '
