heading: '16. Debugging: identify the failure phase before changing anything'
text: "## 16. Debugging: identify the failure phase before changing anything\n\n**At a glance**\n- First identify the failing stage: parsing, variables, connection or task execution.\n- Successful YAML parsing does not guarantee successful execution.\n- Do not hide a failure before understanding its cause.\n\n**Mini-example:** save `mini.yml` in a separate temporary directory; run `ansible-playbook -i localhost, -c local mini.yml`. The example runs on localhost without become.\n\n```yaml\n- hosts: localhost\n  connection: local\n  become: false\n  gather_facts: false\n  tasks:\n    - ansible.builtin.assert:\n        that: 3 == 4\n        fail_msg: values differ\n```\n\n**Predict:** Is this a YAML error or a failure in a correctly parsed task?\n\n> [!question]- Answer\n> Exit code: 2. Stdout excerpts:\n>\n> ```text\n>     \"msg\": \"values differ\"\n> localhost                  : ok=0    changed=0    unreachable=0    failed=1    skipped=0    rescued=0    ignored=0\n> ```\n\nThe playbook was parsed, but its assert condition is false. This result does not call for fixing the connection or adding ignore_errors.\n\n**`debug.yml` (any filename) beside `inventory.ini` from §2:**\n\n```yaml\n- name: Inspect a result structure\n  hosts: lab\n  connection: local\n  gather_facts: false\n  become: false\n  tasks:\n    - name: Read text\n      ansible.builtin.command:\n        argv: [/usr/bin/printf, hello]\n      register: r\n      changed_when: false\n    - name: Inspect useful fields\n      ansible.builtin.debug:\n        msg:\n          rc: \"{{ r.rc }}\"\n          stdout: \"{{ r.stdout }}\"\n```\n\nDo not start by adding `ignore_errors`. First locate the phase: YAML parsing → inventory selection →\nvariable evaluation → connection → interpreter or `become` → module → application health.\nIf Jinja evaluation fails on the controller, Python and sudo on the managed node have not yet been checked.\n\n| Tool | What it reveals |\n|---|---|\n| `-v` | More task results, such as a read-only command's stdout. |\n| `-vv` | More execution context; details depend on the plugin. |\n| `-vvv` | Module invocation, paths and transport operations; sensitive arguments may appear. |\n| `-vvvv` | Usually needed for more detailed connection debugging. |\n| `debug: var: r` | Result structure; do not write `var: \"{{ r }}\"`, because `var` already accepts a name or expression. |\n| `--check --diff` | Predictions from supported modules and differences, subject to §4 limitations. |\n| `--start-at-task 'Name'` | Start at a found name, not restore earlier `register` results, facts or side effects. |\n| `--step` | Confirm tasks interactively; unsuitable for noninteractive CI. |\n| `ansible-inventory --graph` | Groups and names; an API plugin may query a live system. |\n| `ansible-inventory --host NAME` | Effective inventory variables; watch for secrets. |\n| `ansible-config dump --only-changed` | Effective configuration changes and their sources. |\n| `ansible-doc ansible.builtin.command` | Parameters of the installed version itself. |\n\n> [!info]- Deeper explanation\n> *(according to documentation)* [CLI](https://docs.ansible.com/ansible/latest/cli/ansible-playbook.html),\n> [Configuration](https://docs.ansible.com/ansible/latest/reference_appendices/config.html).\n> Built-in plugins handle verbosity up to six `v` characters, but the number alone does not guarantee a particular\n> set of data for every plugin. `ANSIBLE_KEEP_REMOTE_FILES=1` retains remote temporary files for\n> diagnosis and disables `pipelining`; those files may contain sensitive data and need cleanup.\n>\n> **Configuration is not merged from every discovered file.** Normally the first file wins: `ANSIBLE_CONFIG` →\n> `./ansible.cfg` → `~/.ansible.cfg` → `/etc/ansible/ansible.cfg`; environment settings can override\n> file values. Start with `ansible-playbook --version`, which identifies the configuration file actually used.\n> A complete safe diagnostic play, without dumping complete secrets:\n\n### Actual errors, `ansible-core` 2.21.4\n\n**At a glance**\n- Error text helps identify the failing stage.\n- A variable error differs from an SSH error.\n- Preserve the original cause before changing settings.\n\n**Short scenario**\n\nThe task cannot evaluate its msg parameter because a referenced variable is undefined. The host connection has not started yet.\n\n**Predict:** Does this failure prove a Python or sudo problem on the host?\n\n> [!question]- Answer\n> No. The check stopped earlier, while evaluating a parameter on the control machine. It establishes neither the health nor the failure of remote Python.\n\n> [!info]- Deeper explanation\n> Messages below are trimmed to causal lines; timestamps and repeated `Origin` blocks were removed.\n> Initial-draft failures were deliberately reproduced in `/tmp`, without SSH to unrelated hosts or sudo;\n> separate reviewer SSH-run results appear in §3 and §11.\n>\n> **Nonblocking stderr from the caller wrapper** *(verified: supplied reviewer run result, 06.10.2026, ansible-core 2.21.4)*:\n>\n> ```text\n> ERROR: Ansible requires blocking IO on stdin/stdout/stderr. Non-blocking file handles detected: <stderr>\n> ```\n>\n> Some CI wrappers and pipelines pass nonblocking stderr to Ansible; fix the calling\n> process by providing ordinary blocking stdin/stdout/stderr, for example avoiding a nonblocking pipe.\n>\n> **No hosts selected** *(verified)*, `--limit web1` with a localhost-only inventory:\n>\n> ```text\n> [WARNING]: Could not match supplied host pattern, ignoring: web1\n> [ERROR]: Specified inventory, host pattern and/or --limit leaves us with no hosts to target.\n> ```\n>\n> Fix inventory, host patterns and `--limit`, not the firewall. Use `--list-hosts` before execution.\n>\n> **Missing interpreter** *(verified)*, local connection and a deliberately absent path:\n>\n> ```text\n> The module interpreter '/tmp/ansible-visual-guide/missing-python' was not found.\n> /bin/sh: line 1: /tmp/ansible-visual-guide/missing-python: No such file or directory\n> ```\n>\n> SSH access and Python execution are separate checks. Automatic discovery chooses Python when the first\n> module needs it; explicit `ansible_python_interpreter` disables discovery for that host.\n> Do not guess `/usr/bin/python` for every OS. Initial setup of a Python-free OS can use `raw`, followed by\n> ordinary modules; installation was not performed here.\n> *(according to documentation)* [Interpreter discovery](https://docs.ansible.com/ansible/latest/reference_appendices/interpreter_discovery.html).\n>\n> **Undefined variable** *(verified)*, `msg: \"{{ missing_port }}\"`:\n>\n> ```text\n> Error while resolving value for 'msg': 'missing_port' is undefined\n> ```\n>\n> This is template evaluation on the controller. Find the source, scope and spelling; `default` is appropriate for a genuinely\n> optional value, not silently replacing required credentials.\n>\n> **Incorrect condition type** *(verified)*, `enabled: \"false\"` and `when: enabled`:\n>\n> ```text\n> Conditional result (True) was derived from value of type 'str' at\n> '/tmp/ansible-visual-guide/08-bool.yml:7:14'. Conditionals must have a boolean result.\n> ```\n>\n> The line break here is editorial; the message reflects the input type.\n> Fix the boolean input or use `when: enabled | bool`; do not disable invalid-condition checking.\n>\n> **YAML instead of quoted substitution** *(verified)*, `x: {{ bad }}`:\n>\n> ```text\n> [ERROR]: YAML parsing failed: This may be an issue with missing quotes around a template block.\n> ```\n>\n> Fix: `x: \"{{ bad }}\"`; `bad` must still be defined.\n> Also quote a string containing `: `, such as `msg: \"port: 8080\"`.\n>\n> **Command does not exist** *(verified)*:\n>\n> ```text\n> Error executing command: [Errno 2] No such file or directory:\n> b'/tmp/ansible-visual-guide/not-a-command'\n> ```\n>\n> Transport and Python already worked; the executable was not found where the command executes.\n> Compare `PATH` and the managed-node path with the controller's `PATH`; `delegate_to` changes the inspection location.\n>\n> **Command returned failure** *(verified)*, `/usr/bin/false`:\n>\n> ```text\n> [ERROR]: Task failed: Module failed: The command exited with a non-zero return code.\n> ```\n>\n> Inspect `rc`, `stderr`, `stdout`, then decide whether that exit code really means failure.\n> Do not set `failed_when: false` before understanding the result.\n\n### Errors not reproduced here\n\n**At a glance**\n- Not every possible failure was reproduced in this environment.\n- A hypothesis based on documentation and a real execution log are different evidence.\n- Direct the investigation at the stage identified by the actual error.\n\n**Short scenario**\n\nThe log contains only an SSH connection failure. The module has not received control yet.\n\n**Predict:** Can this log establish that the template's contents are wrong?\n\n> [!question]- Answer\n> No. Investigate the connection first. This analyzes the given scenario; no new SSH failure was reproduced here.\n\n**SSH `UNREACHABLE`:** the actual prefix from the installed `ansible-core` SSH plugin is\n`Failed to connect to the host via ssh:`, followed by SSH stderr details: DNS, connection timeout,\nhost key or authentication. This is a source-code string, **not an SSH-run log** *(not verified)*.\nCheck address, route, port, `known_hosts`, user, key and jump host. Do not disable host-key checking\nas a universal cure. `UNREACHABLE` does not mean the application is down.\n\n**Privilege escalation:** if sudo requires a password and Ansible has not received it, the message may be\n`Missing sudo password`; this is a diagnostic string from `ansible-core` connection code, **not a local sudo\nattempt** *(not verified)*. Check method, user and `become` password, plus `sudoers`. `become_user` does not grant permissions;\n`-K` does not bypass a `sudoers` denial. Since `ansible-core` 2.19, waiting for privilege escalation to time out is `unreachable`,\nso `ignore_errors` does not handle it.\n[Privilege escalation changes in ansible-core 2.19](https://docs.ansible.com/ansible/latest/porting_guides/porting_guide_core_2.19.html).\n\n**Collection or module resolution:** a missing namespace in the EE produces a lookup error rather than a network\nfailure. Check the fully qualified name, installation path and `ansible-galaxy collection list`, then client-library requirements.\nIn this lab `kubernetes.core.k8s` was found during syntax checking; the missing-collection error was not reproduced.\n\n> [!info]- Deeper explanation\n> Question: **A playbook works locally but fails in CI. What do you check?**\n>\n> > I first identify the failing phase from the error. I compare the Ansible version, configuration,\n> > collections and Python dependencies, then check inventory and credentials. If the failure is a\n> > connection error, I check the runner's network access and SSH settings."
