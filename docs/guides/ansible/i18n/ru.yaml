heading: '16. Отладка: найти фазу сбоя до исправления'
text: "## 16. Отладка: найти фазу сбоя до исправления\n\n**Коротко**\n- Сначала найди этап отказа: разбор, переменные, подключение или задача.\n- Успешный разбор YAML не гарантирует успешное выполнение.\n- Не скрывай отказ до понимания причины.\n\n**Мини-пример:** в отдельном временном каталоге сохрани `mini.yml`; запуск — `ansible-playbook -i localhost, -c local mini.yml`. Пример работает на localhost без become.\n\n```yaml\n- hosts: localhost\n  connection: local\n  become: false\n  gather_facts: false\n  tasks:\n    - ansible.builtin.assert:\n        that: 3 == 4\n        fail_msg: values differ\n```\n\n**Предскажи:** Это ошибка YAML или отказ корректно разобранной задачи?\n\n> [!question]- Ответ\n> Запуск 1; код 2. Фрагменты stdout:\n>\n> ```text\n>     \"msg\": \"values differ\"\n> localhost                  : ok=0    changed=0    unreachable=0    failed=1    skipped=0    rescued=0    ignored=0\n> ```\n>\n> Запуск 2; код 2. Фрагменты stdout:\n>\n> ```text\n>     \"msg\": \"values differ\"\n> localhost                  : ok=0    changed=0    unreachable=0    failed=1    skipped=0    rescued=0    ignored=0\n> ```\n\nСценарий разобран, но условие assert ложно. Исправлять подключение или добавлять ignore_errors на основании этого результата не требуется.\n\n**`debug.yml` (имя любое) рядом с `inventory.ini` из §2:**\n\n```yaml\n- name: Inspect a result structure\n  hosts: lab\n  connection: local\n  gather_facts: false\n  become: false\n  tasks:\n    - name: Read text\n      ansible.builtin.command:\n        argv: [/usr/bin/printf, hello]\n      register: r\n      changed_when: false\n    - name: Inspect useful fields\n      ansible.builtin.debug:\n        msg:\n          rc: \"{{ r.rc }}\"\n          stdout: \"{{ r.stdout }}\"\n```\n\nНе начинайте с добавления `ignore_errors`. Сначала определите место: разбор YAML → выбор inventory →\nвычисление переменных → подключение → интерпретатор или `become` → модуль → работоспособность приложения.\nЕсли задача падает при вычислении Jinja на управляющем узле, Python и sudo на управляемом узле ещё не проверялись.\n\n| Средство | Что узнать |\n|---|---|\n| `-v` | Больше результатов задач, например стандартный вывод читающей команды. |\n| `-vv` | Больше контекста выполнения; подробность зависит от плагина. |\n| `-vvv` | Вызов модуля, пути, транспортные операции; возможны чувствительные аргументы. |\n| `-vvvv` | Обычно нужна для более подробной отладки подключения. |\n| `debug: var: r` | Посмотреть структуру результата; не писать `var: \"{{ r }}\"`, `var` уже принимает имя или выражение. |\n| `--check --diff` | Предсказание поддерживаемых модулей и различия, с ограничениями §4. |\n| `--start-at-task 'Name'` | Начать с найденного имени, не восстановить предыдущие результаты `register`, факты или побочные эффекты. |\n| `--step` | Интерактивно подтверждать задачи; не вариант для CI без интерактивного ввода. |\n| `ansible-inventory --graph` | Группы и имена; плагин API может делать запрос к действующей системе. |\n| `ansible-inventory --host NAME` | Итоговые переменные inventory; осторожно с секретами. |\n| `ansible-config dump --only-changed` | Эффективные изменения конфигурации и их источники. |\n| `ansible-doc ansible.builtin.command` | Параметры именно установленной версии. |\n\n> [!info]- Глубже\n> *(по документации)* [Командная строка](https://docs.ansible.com/ansible/latest/cli/ansible-playbook.html),\n> [Настройки](https://docs.ansible.com/ansible/latest/reference_appendices/config.html).\n> Встроенные плагины обрабатывают подробность вывода вплоть до шести `v`, но число само по себе не гарантирует конкретный\n> набор данных для каждого плагина. `ANSIBLE_KEEP_REMOTE_FILES=1` сохраняет удалённые временные файлы для\n> диагностики и отключает `pipelining`; файлы могут содержать чувствительные данные, их нужно убрать.\n>\n> **Настройки не объединяются из всех найденных файлов.** Обычно выбирается первый: `ANSIBLE_CONFIG` →\n> `./ansible.cfg` → `~/.ansible.cfg` → `/etc/ansible/ansible.cfg`; настройки окружения могут перекрыть\n> значения файла. Начните с `ansible-playbook --version`, где указан фактически использованный файл настроек.\n> Полный безопасный сценарий отладки, без полного вывода секретов:\n\n### Реально полученные ошибки, `ansible-core` 2.21.4\n\n**Коротко**\n- Текст ошибки помогает определить этап отказа.\n- Сообщение о переменной отличается от сообщения об SSH.\n- Сохраняй исходную причину, прежде чем менять настройки.\n\n**Короткий сценарий**\n\nЗадача не может вычислить параметр msg: используемая переменная не определена. Соединение с хостом ещё не начиналось.\n\n**Предскажи:** Доказывает ли этот отказ проблему Python или sudo на хосте?\n\n> [!question]- Ответ\n> Нет. Проверка остановилась раньше — при вычислении параметра на управляющей машине. Ни исправность, ни неисправность удалённого Python этим не установлены.\n\n> [!info]- Глубже\n> Тексты ниже обрезаны до строк с причиной; метки времени и повторные блоки `Origin` убраны.\n> Ошибки первого черновика намеренно получены в `/tmp`, без SSH к чужим узлам и без sudo;\n> отдельные результаты SSH-прогона рецензента приведены в §3 и §11.\n>\n> **Неблокирующий stderr у вызывающей обёртки** *(проверено: предоставленный результат прогона рецензента 06.10.2026, ansible-core 2.21.4)*:\n>\n> ```text\n> ERROR: Ansible requires blocking IO on stdin/stdout/stderr. Non-blocking file handles detected: <stderr>\n> ```\n>\n> Некоторые CI-обёртки и конвейеры передают Ansible неблокирующий stderr; исправление на стороне вызывающего\n> процесса — дать обычные блокирующие stdin/stdout/stderr, например не подключать Ansible к неблокирующему pipe.\n>\n> **Не выбран ни один хост** *(проверено)*, `--limit web1` при inventory только с localhost:\n>\n> ```text\n> [WARNING]: Could not match supplied host pattern, ignoring: web1\n> [ERROR]: Specified inventory, host pattern and/or --limit leaves us with no hosts to target.\n> ```\n>\n> Исправлять inventory, шаблон хостов и `--limit`, не межсетевой экран. Сначала `--list-hosts`, потом запуск.\n>\n> **Отсутствующий интерпретатор** *(проверено)*, локальное подключение и заведомо отсутствующий путь:\n>\n> ```text\n> The module interpreter '/tmp/ansible-visual-guide/missing-python' was not found.\n> /bin/sh: line 1: /tmp/ansible-visual-guide/missing-python: No such file or directory\n> ```\n>\n> Доступ по SSH и выполнение Python — разные проверки. Автоматическое обнаружение выбирает Python при первом\n> нужном модуле; явный `ansible_python_interpreter` отключает обнаружение для этого хоста.\n> Не угадывайте `/usr/bin/python` для каждой ОС. Для первичной настройки ОС без Python возможен `raw`, затем\n> обычные модули; здесь установка не делалась.\n> *(по документации)* [Обнаружение интерпретатора](https://docs.ansible.com/ansible/latest/reference_appendices/interpreter_discovery.html).\n>\n> **Неопределённая переменная** *(проверено)*, `msg: \"{{ missing_port }}\"`:\n>\n> ```text\n> Error while resolving value for 'msg': 'missing_port' is undefined\n> ```\n>\n> Это вычисление шаблона на управляющем узле. Найдите источник, область видимости и написание имени; `default` подходит для действительно\n> необязательного значения, не для молчаливой подмены обязательных учётных данных.\n>\n> **Неверный тип условия** *(проверено)*, `enabled: \"false\"` и `when: enabled`:\n>\n> ```text\n> Conditional result (True) was derived from value of type 'str' at\n> '/tmp/ansible-visual-guide/08-bool.yml:7:14'. Conditionals must have a boolean result.\n> ```\n>\n> Перенос строки здесь редакционный; сообщение отражает тип исходного значения.\n> Правка: логическое входное значение или `when: enabled | bool`, не отключение проверки некорректных условий.\n>\n> **YAML вместо строковой подстановки** *(проверено)*, `x: {{ bad }}`:\n>\n> ```text\n> [ERROR]: YAML parsing failed: This may be an issue with missing quotes around a template block.\n> ```\n>\n> Правка: `x: \"{{ bad }}\"`; потом всё ещё надо определить `bad`.\n> Кавычки также нужны вокруг строки с `: `, например `msg: \"port: 8080\"`.\n>\n> **Команда не существует** *(проверено)*:\n>\n> ```text\n> Error executing command: [Errno 2] No such file or directory:\n> b'/tmp/ansible-visual-guide/not-a-command'\n> ```\n>\n> Транспорт и Python уже сработали, исполняемый файл не найден на месте выполнения команды.\n> Сравните `PATH` и путь на управляемом узле с `PATH` управляющего узла; `delegate_to` меняет место проверки.\n>\n> **Команда вернула сбой** *(проверено)*, `/usr/bin/false`:\n>\n> ```text\n> [ERROR]: Task failed: Module failed: The command exited with a non-zero return code.\n> ```\n>\n> Проверяйте `rc`, `stderr`, `stdout`; затем решайте, действительно ли этот код означает сбой.\n> Не задавайте `failed_when: false` до понимания результата.\n\n### Ошибки, которые не воспроизводились здесь\n\n**Коротко**\n- Не каждый вероятный отказ был воспроизведён на этом стенде.\n- Гипотеза по документации и журнал реального запуска — разные свидетельства.\n- Проверку направляют на этап, указанный фактической ошибкой.\n\n**Короткий сценарий**\n\nВ журнале есть только сообщение SSH о неудачном подключении. Модуль ещё не получил управление.\n\n**Предскажи:** Можно ли по этому журналу объявить ошибочным содержимое шаблона?\n\n> [!question]- Ответ\n> Нет. Сначала исследуется подключение. Это разбор заданного сценария; новый SSH-отказ здесь не воспроизводился.\n\n**`UNREACHABLE` по SSH:** реальный префикс из установленного SSH-плагина `ansible-core` —\n`Failed to connect to the host via ssh:`; после него идут детали стандартного потока ошибок SSH: DNS, тайм-аут подключения,\nключ хоста или аутентификация. Это прочитанная строка исходного кода, **не лог SSH-прогона** *(не проверено)*.\nПроверяйте адрес, маршрут, порт, `known_hosts`, пользователя, ключ и промежуточный хост. Не отключайте проверку ключа хоста\nкак универсальное лечение. `UNREACHABLE` не означает, что приложение на хосте не работает.\n\n**Повышение привилегий:** если sudo требует пароль, а Ansible его не получил, возможно сообщение\n`Missing sudo password`; это диагностический текст из кода подключения `ansible-core`, **не локальная попытка\nsudo** *(не проверено)*. Проверяйте метод, пользователя и пароль `become`, настройки `sudoers`. `become_user` не даёт прав;\n`-K` не исправляет запрет `sudoers`. С `ansible-core` 2.19 тайм-аут ожидания повышения привилегий относится к `unreachable`,\nпоэтому `ignore_errors` его не обрабатывает.\n[Изменения повышения привилегий в ansible-core 2.19](https://docs.ansible.com/ansible/latest/porting_guides/porting_guide_core_2.19.html).\n\n**Поиск коллекции или модуля:** отсутствие пространства имён в EE даёт ошибку поиска, а не сетевой\nсбой. Проверить полное имя, путь установки и `ansible-galaxy collection list`, затем требования клиентской библиотеки.\nВ этом стенде `kubernetes.core.k8s` нашлась при проверке синтаксиса; ошибка отсутствующей коллекции не воспроизводилась.\n\n> [!info]- Глубже\n> Вопрос: **A playbook works locally but fails in CI. What do you check?**\n>\n> > I first identify the failing phase from the error. I compare the Ansible version, configuration,\n> > collections and Python dependencies, then check inventory and credentials. If the failure is a\n> > connection error, I check the runner's network access and SSH settings.\n"
