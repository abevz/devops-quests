heading: 7.3. One module for several components
text: "### 7.3. One module for several components\n\n**At a glance**\n- for_each can repeat an entire module call.\n- The key becomes part of the call address.\n- Arguments are computed separately for each key.\n\n**Mini-example:** save this as `main.tf` in a new temporary directory. After preparing the files, run `tofu init`, `tofu validate`, then `tofu apply -auto-approve -input=false -no-color`.\n\n```hcl\nmodule \"worker\" {\n  source = \"./modules/worker\"\n  for_each = toset([\"api\", \"jobs\"])\n  name = each.key\n}\noutput \"labels\" {\n  value = { for k, v in module.worker : k => v.label }\n}\n```\n\nAdditional file `modules/worker/main.tf`:\n\n```hcl\nvariable \"name\" { type = string }\noutput \"label\" { value = \"${var.name}-dev\" }\n```\n\n**Predict:** What will the run show, and what will its exit code be?\n\n> [!question]- Answer\n> Actual excerpt from the last command:\n>\n> ```text\n> Apply complete! Resources: 0 added, 0 changed, 0 destroyed.\n> Outputs:\n> + labels = {\n>       + api  = \"api-dev\"\n>       + jobs = \"jobs-dev\"\n>     }\n>\n> You can apply this plan to save these new output values to the OpenTofu\n> state, without changing any real infrastructure.\n>\n> Apply complete! Resources: 0 added, 0 changed, 0 destroyed.\n>\n> Outputs:\n>\n> labels = {\n>   \"api\" = \"api-dev\"\n>   \"jobs\" = \"jobs-dev\"\n> }\n> ```\n>\n> Exit code: 0.\n\nTwo calls to the same directory are created. Each receives its own name, and the output preserves the key-to-result mapping.\n\n> [!info]- Deeper explanation\n> Keep the child files from §7.1. The following root **replaces**, rather than extends, the previous root; its old `terraform.tfvars` is not needed here.\n>\n> **Replace root `main.tf` completely; remove `terraform.tfvars`; keep `modules/worker/` unchanged:**\n>\n> ```hcl\n> variable \"components\" {\n>   type    = map(object({ name = string, port = optional(number, 8080), labels = optional(map(string), {}) }))\n>   default = { a = { name = \"api-dev\" }, b = { name = \"api-prod\", port = 9090, labels = { env = \"prod\" } } }\n> }\n> module \"worker\" {\n>   source   = \"./modules/worker\"\n>   for_each = var.components\n>   name     = each.value.name\n>   settings = { port = each.value.port, labels = each.value.labels }\n> }\n> output \"names\" { value = { for k, m in module.worker : k => m.name } }\n> ```\n>\n> `optional(number, 8080)` supplies a port if the attribute is absent or `null`; `optional(map(string), {})` supplies empty labels. Keys `a` and `b` determine instance addresses, while their values describe different components or environments. Separate state provides the access boundary between environments, rather than a key in this collection (§8).\n>\n> ```text\n> # module.worker[\"a\"].terraform_data.this will be created\n>\n>           + name   = \"api-dev\"\n>           + port   = 8080\n>   # module.worker[\"b\"].terraform_data.this will be created\n>           + name   = \"api-prod\"\n>           + port   = 9090\n> Plan: 2 to add, 0 to change, 0 to destroy.\n> ```\n>\n> After `apply`, `tofu state list` returned:\n>\n> ```text\n> module.worker[\"a\"].terraform_data.this\n> module.worker[\"b\"].terraform_data.this\n> ```\n>\n> A different root with `count` was used for identical numbered copies:\n>\n> **Root `main.tf` in another new directory with a copy of `modules/worker/`; a plan in the §7.3 directory would also remove `[\"a\"]` and `[\"b\"]`:**\n>\n> ```hcl\n> module \"worker\" {\n>   source = \"./modules/worker\"\n>   count  = 2\n>   name   = \"worker-${count.index}\"\n> }\n> output \"names\" { value = module.worker[*].name }\n> ```\n>\n> ```text\n> # module.worker[0].terraform_data.this will be created\n>\n>   # module.worker[1].terraform_data.this will be created\n> Plan: 2 to add, 0 to change, 0 to destroy.\n> ```\n>\n> ```text\n> module.worker[0].terraform_data.this\n> module.worker[1].terraform_data.this\n> ```\n>\n> Input validation lives inside the module: the §7.1 root with `name = \"ab\"` in its variables file stopped as follows:\n>\n> ```text\n> Error: Invalid value for variable\n>     │ var.name is \"ab\"\n> name must contain at least 3 characters.\n> ```\n>\n> The `token` output is marked `sensitive` inside the module; the root output also requires `sensitive = true`. Its value remains an ordinary string in state: output masking is not encryption. Removing the root marker is reproduced in §10. *(verified: OpenTofu 1.12.6; both instance sets applied, input validation and the secret boundary checked)*."
