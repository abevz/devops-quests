heading: 7.3. Один модуль для нескольких компонентов
text: "### 7.3. Один модуль для нескольких компонентов\n\n**Коротко**\n- for_each может повторять целый вызов модуля.\n- Ключ становится частью адреса вызова.\n- Аргументы вычисляются отдельно для каждого ключа.\n\n**Мини-пример:** сохрани как `main.tf` в новом временном каталоге. После подготовки файлов выполни `tofu init`, `tofu validate`, затем `tofu apply -auto-approve -input=false -no-color`.\n\n```hcl\nmodule \"worker\" {\n  source = \"./modules/worker\"\n  for_each = toset([\"api\", \"jobs\"])\n  name = each.key\n}\noutput \"labels\" {\n  value = { for k, v in module.worker : k => v.label }\n}\n```\n\nДополнительный файл `modules/worker/main.tf`:\n\n```hcl\nvariable \"name\" { type = string }\noutput \"label\" { value = \"${var.name}-dev\" }\n```\n\n**Предскажи:** что покажет запуск и каким будет код завершения?\n\n> [!question]- Ответ\n> Фактическая выдержка последней команды:\n>\n> ```text\n> Apply complete! Resources: 0 added, 0 changed, 0 destroyed.\n> Outputs:\n> + labels = {\n>       + api  = \"api-dev\"\n>       + jobs = \"jobs-dev\"\n>     }\n>\n> You can apply this plan to save these new output values to the OpenTofu\n> state, without changing any real infrastructure.\n>\n> Apply complete! Resources: 0 added, 0 changed, 0 destroyed.\n>\n> Outputs:\n>\n> labels = {\n>   \"api\" = \"api-dev\"\n>   \"jobs\" = \"jobs-dev\"\n> }\n> ```\n>\n> Код завершения: 0.\n\nСозданы два вызова одного каталога. Каждый получает собственное name, выход сохраняет соответствие ключей.\n\n> [!info]- Глубже\n> Сохрани дочерние файлы §7.1. Следующий корень **заменяет**, а не дополняет предыдущий корень; старый `terraform.tfvars` здесь не нужен.\n>\n> **Корневой `main.tf` — заменить целиком; `terraform.tfvars` удалить; `modules/worker/` не менять:**\n>\n> ```hcl\n> variable \"components\" {\n>   type    = map(object({ name = string, port = optional(number, 8080), labels = optional(map(string), {}) }))\n>   default = { a = { name = \"api-dev\" }, b = { name = \"api-prod\", port = 9090, labels = { env = \"prod\" } } }\n> }\n> module \"worker\" {\n>   source   = \"./modules/worker\"\n>   for_each = var.components\n>   name     = each.value.name\n>   settings = { port = each.value.port, labels = each.value.labels }\n> }\n> output \"names\" { value = { for k, m in module.worker : k => m.name } }\n> ```\n>\n> `optional(number, 8080)` подставляет порт, если атрибут отсутствует или передан как `null`; `optional(map(string), {})` даёт пустые метки. Ключи `a` и `b` задают адреса экземпляров, а значения описывают разные компоненты или среды. Границу доступа между средами задаёт отдельный state, а не ключ этой коллекции (§8).\n>\n> ```text\n> # module.worker[\"a\"].terraform_data.this will be created\n>\n>           + name   = \"api-dev\"\n>           + port   = 8080\n>   # module.worker[\"b\"].terraform_data.this will be created\n>           + name   = \"api-prod\"\n>           + port   = 9090\n> Plan: 2 to add, 0 to change, 0 to destroy.\n> ```\n>\n> После `apply` команда `tofu state list` вернула:\n>\n> ```text\n> module.worker[\"a\"].terraform_data.this\n> module.worker[\"b\"].terraform_data.this\n> ```\n>\n> Для одинаковых нумерованных копий использовали другой корень с `count`:\n>\n> **Корневой `main.tf` в другом новом каталоге с копией `modules/worker/`; в каталоге §7.3 план дополнительно удалит `[\"a\"]` и `[\"b\"]`:**\n>\n> ```hcl\n> module \"worker\" {\n>   source = \"./modules/worker\"\n>   count  = 2\n>   name   = \"worker-${count.index}\"\n> }\n> output \"names\" { value = module.worker[*].name }\n> ```\n>\n> ```text\n> # module.worker[0].terraform_data.this will be created\n>\n>   # module.worker[1].terraform_data.this will be created\n> Plan: 2 to add, 0 to change, 0 to destroy.\n> ```\n>\n> ```text\n> module.worker[0].terraform_data.this\n> module.worker[1].terraform_data.this\n> ```\n>\n> Проверка входа живёт внутри модуля: корень §7.1 с `name = \"ab\"` в файле переменных остановился так:\n>\n> ```text\n> Error: Invalid value for variable\n>     │ var.name is \"ab\"\n> name must contain at least 3 characters.\n> ```\n>\n> Выход `token` помечен `sensitive` внутри модуля; корневой выход тоже требует `sensitive = true`. Значение остаётся обычной строкой в state: маскирование вывода не является шифрованием. Удаление корневой пометки воспроизводится в §10. *(проверено: OpenTofu 1.12.6, оба набора экземпляров применены, проверка входа и граница секрета выполнены)*.\n"
