heading: 3. Состояние, дрейф и восстановление [state]
text: "## 3. Состояние, дрейф и восстановление [state]\n\n**Коротко**\n- State связывает адрес ресурса с объектом.\n- Адрес содержит тип и выбранное имя.\n- Удаление state не удаляет автоматически сам внешний объект.\n\n**Мини-пример:** сохрани как `main.tf` в новом временном каталоге. После подготовки файлов выполни `tofu init`, `tofu validate`, затем `tofu apply -auto-approve -input=false -no-color`. Посмотри адрес командой `tofu state list`.\n\n```hcl\nresource \"terraform_data\" \"item\" {\n  input = \"tracked\"\n}\noutput \"value\" {\n  value = terraform_data.item.output\n}\n```\n\n**Предскажи:** что покажет запуск и каким будет код завершения?\n\n> [!question]- Ответ\n> Фактическая выдержка последней команды:\n>\n> ```text\n> terraform_data.item\n> ```\n>\n> Код завершения: 0.\n\n`state list` после применения показывает адрес `terraform_data.item`. Это имя привязки, а не содержимое ресурса.\n\nState хранит соответствие «адрес экземпляра ↔ ID объекта», атрибуты, выходы и метаданные для движка и провайдера. В нём есть `lineage` — идентификатор истории состояния, `serial` — номер снимка, сведения о конфигурации провайдера и зависимостях. Это не исходный код и не полная резервная копия облака. На диске формат JSON; для изменений используй `tofu state` или `terraform state`, а не ручное редактирование.\n*(по документации)*. [Назначение состояния](https://developer.hashicorp.com/terraform/language/state/purpose).\n\n### Дрейф и два вида плана\n\n**Коротко**\n- Дрейф — внешнее изменение управляемого объекта.\n- Обычный план сравнивает реальность с конфигурацией.\n- refresh-only предлагает обновить снимок без восстановления объекта.\n\n**Короткий сценарий**\n\nКод требует файл с текстом ready. Файл был создан, затем удалён вне OpenTofu. Строится plan -refresh-only.\n\n**Предскажи:** Вернёт ли такой план файл?\n\n> [!question]- Ответ\n> Нет. Он покажет исчезновение и предложит принять новую реальность в state. Обычный план нужен для действий по конфигурации. Локальный полный опыт ниже сохраняет прежние результаты.\n\nПеред обычным планом провайдер читает объекты, уже связанные со state. Если в коде три реплики, а вручную оставили две, план показывает действия для возврата к коду. Если объект удалили, обычно предлагается создание заново. Изменяемое поле может дать обновление на месте, неизменяемое — замену. Новый внешний объект сам к адресу не привяжется.\n\n`tofu plan -refresh-only` предлагает принять внешние изменения **только в снимок состояния**. После проверки `tofu apply -refresh-only` сохраняет их; код и объекты не исправляются. Обычный план показывает действия для приведения объектов к коду. Устаревшую `terraform refresh` заменяют контролируемыми `plan`/`apply -refresh-only`.\n*(по документации)*. [Режимы плана](https://developer.hashicorp.com/terraform/cli/commands/plan).\n\n### Импорт: связать существующий объект\n\n**Коротко**\n- Импорт добавляет привязку к существующему ID.\n- Конфигурацию ресурса нужно объявить отдельно.\n- План может предложить изменение уже импортируемого объекта.\n\n**Мини-пример:** сохрани как `main.tf` в новом временном каталоге. После подготовки файлов выполни `tofu init`, `tofu validate`, затем `tofu plan -input=false -no-color`.\n\n```hcl\nresource \"terraform_data\" \"imported\" {\n  input = \"ready\"\n}\nimport {\n  to = terraform_data.imported\n  id = \"demo-local-id\"\n}\n```\n\n**Предскажи:** что покажет запуск и каким будет код завершения?\n\n> [!question]- Ответ\n> Фактическая выдержка последней команды:\n>\n> ```text\n>   # terraform_data.imported will be updated in-place\n> Plan: 1 to import, 0 to add, 1 to change, 0 to destroy.\n> ```\n>\n> Код завершения: 0.\n\nВстроенный ресурс позволяет показать импорт без внешнего API. План связывает заданный ID и отдельно предлагает установить input.\n\n> [!info]- Глубже\n> Все следующие прогоны первого черновика используют встроенный `terraform_data` и отдельные учебные состояния. В реальном ресурсе формат ID и чтение объекта задаёт провайдер.\n>\n> **Импорт командой CLI.** Сначала объяви целевой ресурс:\n>\n> ```hcl\n> # main.tf\n> terraform {\n>   required_version = \">= 1.7.0\"\n> }\n>\n> resource \"terraform_data\" \"example\" {\n>   input = \"imported-lab-object\"\n> }\n> ```\n>\n> ```sh\n> tofu init\n> tofu validate\n> tofu import terraform_data.example imported-lab-object\n> tofu plan\n> ```\n>\n> Команда добавляет привязку, но не пишет блок `resource`. Повторный импорт в занятый адрес дал `Error: Resource already managed by OpenTofu`. После первого импорта план показал `Plan: 0 to add, 1 to change, 0 to destroy`: в коде задан `input`, которого импортированный ресурс не имел. Это изменение привязки и последующая настройка, а не создание внешнего объекта. *(проверено: OpenTofu 1.12.6)*.\n>\n> **Блок импорта.** Вместо немедленной команды можно рассмотреть импорт в плане. `to` — целевой адрес, `id` — идентификатор провайдера:\n>\n> **`main.tf` в другом новом каталоге, а не там, где выполнялся `tofu import`:**\n>\n> ```hcl\n> # main.tf\n> terraform {\n>   required_version = \">= 1.7.0\"\n> }\n>\n> resource \"terraform_data\" \"example\" {\n>   input = \"imported-lab-object\"\n> }\n>\n> import {\n>   to = terraform_data.example\n>   id = \"imported-lab-object\"\n> }\n> ```\n>\n> После `init` и `validate` план показал `Plan: 1 to import, 0 to add, 1 to change, 0 to destroy`. Применение записало привязку и настроило `input`. Блоки импорта доступны с Terraform 1.5 и в OpenTofu. *(проверено: OpenTofu 1.12.6)*.\n\n### Переместить или забыть привязку\n\n**Коротко**\n- moved меняет адрес привязки.\n- removed с destroy=false прекращает управление.\n- Перемещение адреса и удаление объекта — разные операции.\n\n**Мини-пример:** сохрани как `main.tf` в новом временном каталоге. Подготовка и порядок запусков указаны сразу под листингом.\n\n```hcl\nresource \"terraform_data\" \"new\" {\n  input = \"stable\"\n}\nmoved {\n  from = terraform_data.old\n  to = terraform_data.new\n}\n```\n\nПодготовка в этом же каталоге: сначала сохрани содержимое `before.tf.txt` как `main.tf` и выполни `tofu init`, `tofu apply -auto-approve`. Затем замени `main.tf` приведённым выше листингом и выполни `tofu plan -no-color`.\n\nДополнительный файл `before.tf.txt`:\n\n```hcl\nresource \"terraform_data\" \"old\" { input = \"stable\" }\n```\n\n**Предскажи:** что покажет запуск и каким будет код завершения?\n\n> [!question]- Ответ\n> Фактическая выдержка последней команды:\n>\n> ```text\n>   # terraform_data.old has moved to terraform_data.new\n> Plan: 0 to add, 0 to change, 0 to destroy.\n> ```\n>\n> Код завершения: 0.\n\nПодготовка сначала создаёт old. План с moved сохраняет объект и сообщает переход к адресу new.\n\n> [!info]- Глубже\n> **`moved`.** Сначала применили:\n>\n> **`main.tf` в новом пустом каталоге — шаг 1:**\n>\n> ```hcl\n> terraform {\n>   required_version = \">= 1.7.0\"\n> }\n>\n> resource \"terraform_data\" \"original\" {\n>   input = \"stable\"\n> }\n> ```\n>\n> Затем заменили файл на:\n>\n> **Тот же `main.tf` — заменить целиком, шаг 2:**\n>\n> ```hcl\n> # новая main.tf после рефакторинга\n> terraform {\n>   required_version = \">= 1.7.0\"\n> }\n>\n> resource \"terraform_data\" \"renamed\" {\n>   input = \"stable\"\n> }\n>\n> moved {\n>   from = terraform_data.original\n>   to   = terraform_data.renamed\n> }\n> ```\n>\n> `validate` прошёл, план сообщил `terraform_data.original has moved to terraform_data.renamed` и `Plan: 0 to add, 0 to change, 0 to destroy`. После применения `state list` содержит только `terraform_data.renamed`, итог — `Resources: 0 added, 0 changed, 0 destroyed`. Без перемещения другой адрес может выглядеть как удаление и создание. *(проверено: OpenTofu 1.12.6)*.\n>\n> **`removed`.** Сначала проверили и применили:\n>\n> **`main.tf` в новом пустом каталоге — шаг 1:**\n>\n> ```hcl\n> terraform {\n>   required_version = \">= 1.7.0\"\n> }\n>\n> resource \"terraform_data\" \"keep\" {\n>   input = \"leave-me\"\n> }\n> ```\n>\n> Затем удалили ресурс из кода и заменили файл на:\n>\n> **Тот же `main.tf` — заменить целиком, шаг 2:**\n>\n> ```hcl\n> terraform {\n>   required_version = \">= 1.7.0\"\n> }\n>\n> removed {\n>   from = terraform_data.keep\n>   lifecycle {\n>     destroy = false\n>   }\n> }\n> ```\n>\n> `destroy = false` прекращает управление без удаления объекта. План: `Plan: 0 to add, 0 to change, 0 to destroy, 1 to forget`; применение убрало привязку. Без такого блока удаление ресурса из кода обычно планирует удаление объекта. `removed` доступен с Terraform 1.7. *(проверено: OpenTofu 1.12.6, синтетический ресурс)*.\n>\n> **Немедленные команды state.** Отдельно применили исходный `terraform_data.original`, затем заменили конфигурацию на:\n>\n> **`main.tf` в новом каталоге: шаг 1 — блок `original` из примера `moved` выше; шаг 2 — заменить целиком на:**\n>\n> ```hcl\n> terraform {\n>   required_version = \">= 1.7.0\"\n> }\n>\n> resource \"terraform_data\" \"renamed\" {\n>   input = \"stable\"\n> }\n> ```\n>\n> `tofu state mv terraform_data.original terraform_data.renamed` переместила привязку, следующий план — `No changes`. Затем `tofu state rm terraform_data.renamed` убрала запись; следующий план — `Plan: 1 to add, 0 to change, 0 to destroy`. Для внешнего объекта это может создать дубликат или дать ошибку «объект уже существует». Прогоны выполнены только на учебном state. *(проверено: OpenTofu 1.12.6)*.\n> *(по документации)*. [Импорт](https://developer.hashicorp.com/terraform/cli/commands/import) · [Изменение адресов](https://developer.hashicorp.com/terraform/language/state/refactor).\n\n### Устаревший план и восстановление\n\n**Коротко**\n- Сохранённый план связан со снимком state.\n- Другое применение может сделать его устаревшим.\n- Восстановление требует сверить привязки и реальные объекты.\n\n**Короткий сценарий**\n\nПлан A построен при serial=7. Другой apply записал serial=8. Остался прежний файл плана A.\n\n**Предскажи:** Достаточно ли прежнего согласования A для применения?\n\n> [!question]- Ответ\n> Нет: нужен новый план по текущему состоянию и его рассмотрение. Согласование не обновляет файл. Это модель; полный проверенный опыт отказа находится в §11.\n\nСохранённый план привязан к снимку state. Проверенный отказ `Error: Saved plan is stale` сохранён в [[Terraform-Coding-Drills-Solutions]]; новый локальный опыт приведён в §11.\n\nПри восстановлении останови параллельные применения, сохрани текущую копию, найди версионную резервную копию backend, сверь `lineage`, `serial`, адреса и реальные объекты. Выполни `state list`/`state show`; только после этого восстанавливай снимок или импортируй существующие объекты. `state push` может заменить удалённое состояние: не обходи проверки истории и номера снимка флагом `-force` без доказательства, что снимок верен. Пустой state не означает пустую инфраструктуру; слепой `apply` может создать дубликаты.\n\n> [!info]- Глубже\n> **Шаг 1 — Адрес и объект**\n>\n> ```mermaid\n> flowchart TB\n>     A[\"Адрес в коде\"]\n>     B[\"Привязка в state\"]\n>     I[\"ID объекта у провайдера\"]\n>     A --> B\n>     B --> I\n> ```\n>\n> **Шаг 2 — Перенос адреса**\n>\n> ```mermaid\n> flowchart TB\n>     B[\"Привязка в state\"]\n>     M[\"moved: новый адрес,<br/>прежний объект\"]\n>     M --> B\n> ```\n>\n> **Шаг 3 — Удаление привязки**\n>\n> ```mermaid\n> flowchart TB\n>     B[\"Привязка в state\"]\n>     R[\"removed или state rm:<br/>забыть привязку\"]\n>     R --> B\n> ```\n>\n> **Шаг 4 — Импорт объекта**\n>\n> ```mermaid\n> flowchart TB\n>     B[\"Привязка в state\"]\n>     X[\"import: связать существующий ID\"]\n>     X --> B\n> ```\n\n### Переименование без перемещения\n\n**Коротко**\n- Имя входит в адрес ресурса.\n- Одинаковое содержимое не связывает два разных адреса.\n- Для сохранения привязки при переименовании нужен moved.\n\nСначала в новом каталоге применили `resource \"terraform_data\" \"old\" { input = \"stable\" }`, затем заменили файл на:\n\n**Тот же `main.tf` — заменить целиком:**\n\n```hcl\nresource \"terraform_data\" \"new\" { input = \"stable\" }\n```\n\n\n**Предскажи:** Меняется только имя ресурса `old` → `new`, блока `moved` нет. Будет обновление или удаление и создание?\n> [!question]- Ответ\n> ```text\n>   # terraform_data.new will be created\n>   # terraform_data.old will be destroyed\n> Plan: 1 to add, 0 to change, 1 to destroy.\n> ```\n> Имя входит в адрес. Без явного перемещения движок видит старый исчезнувший адрес и новый адрес.\n\n### Внешнее удаление и обновление снимка\n\n**Коротко**\n- Провайдер может обнаружить внешнее удаление.\n- refresh-only принимает наблюдение в состояние.\n- Он не создаёт заново исчезнувший файл.\n\nВ отдельном каталоге применили локальный файл:\n\n**`main.tf` в новом пустом каталоге:**\n\n```hcl\nterraform {\n  required_providers {\n    local = { source = \"hashicorp/local\", version = \">= 2.5.0, < 3.0.0\" }\n  }\n}\nresource \"local_file\" \"this\" {\n  filename = \"${path.module}/demo.txt\"\n  content  = \"desired\"\n  lifecycle { ignore_changes = [content] }\n}\n```\n\nЗатем удалили только созданный учебный `demo.txt` и выполнили `tofu plan -refresh-only`.\n\n**Предскажи:** Создаст ли `-refresh-only` удалённый файл заново?\n> [!question]- Ответ\n> ```text\n>   # local_file.this has been deleted\n> This is a refresh-only plan, so OpenTofu will not take any actions to undo\n> these. If you were expecting these changes then you can apply this plan to\n> record the updated values in the OpenTofu state without changing any remote\n> objects.\n> ```\n> Этот режим предлагает записать внешнее исчезновение в state. Обычный план вместо этого предложит создание файла по коду.\n\n*(проверено: OpenTofu 1.12.6, `local` 2.9.1; применён только учебный файл)*.\n\n**Коротко по-английски:** What does Terraform state do?\n\nState maps a resource address to an object ID. It also stores attributes and metadata for later plans. A moved block changes the address while keeping this link.\n\n### Разделить state: сначала единственный владелец, потом новая автоматизация\n\n**Коротко**\n- У объекта должен быть один владелец управления.\n- Чистый план одного корня не проверяет второй.\n- Передача требует согласовать обе привязки и автоматизацию.\n\n**Модель без AWS вызовов:** root A управляет bucket `logs`; его нужно передать root B. Бакет не переносится между аккаунтами — меняется только привязка управления. Один remote object должен соответствовать одной resource instance; import не заменяет проверку конфигурации. [Import](https://developer.hashicorp.com/terraform/language/import), [moving resources](https://developer.hashicorp.com/terraform/cli/state/move).\n\n1. Остановить apply обоих roots, определить версии provider и сделать защищённые snapshots обоих state. Lock одного backend не блокирует другой root.\n2. Подготовить в B конфигурацию того же объекта с теми же значениями и provider/account. Пока не запускать создание. В A заменить resource на `removed` с `destroy = false`.\n3. Просмотреть план A: только прекращение управления, без destroy. Применить именно этот проверенный план.\n4. Добавить import в B, просмотреть план: import существующего ID; неожиданные update/replacement — остановка. После согласованного применения проверить state B, отсутствие объекта в A и обычные планы обоих roots.\n5. Только после сверки включить автоматизацию B. При откате сначала исключить двойное управление; не возвращать backup A поверх уже активного B.\n\n[Removed без destroy](https://developer.hashicorp.com/terraform/language/resources/syntax#removing-resources), [state locking](https://developer.hashicorp.com/terraform/language/state/locking). Порядок выше — протокол передачи владения, а не атомарная транзакция двух backend.\n\n```hcl\n# A: прежний resource block уже удалён из конфигурации.\nremoved {\n  from = aws_s3_bucket.logs\n  lifecycle {\n    destroy = false\n  }\n}\n\n# B: resource aws_s3_bucket.logs описан с текущими параметрами.\nimport {\n  to = aws_s3_bucket.logs\n  id = \"example-existing-audit-logs\"\n}\n```\n\n**Предскажи:** импортировали в B, но забыли resource в A. Чистый plan B означает безопасную передачу?\n> [!question]- Ответ\n> Нет: A всё ещё может менять или удалять тот же объект. Проверка должна охватывать оба roots и отключённые pipeline."
