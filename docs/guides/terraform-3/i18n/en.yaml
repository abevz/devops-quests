heading: 3. State, drift and recovery [state]
text: "## 3. State, drift and recovery [state]\n\n**At a glance**\n- State connects a resource address to an object.\n- The address contains the resource type and chosen name.\n- Removing state does not automatically delete the external object.\n\n**Mini-example:** Save as `main.tf` in a new temporary directory. After preparing the files, run `tofu init`, `tofu validate`, then `tofu apply -auto-approve -input=false -no-color`. Inspect the address with `tofu state list`.\n\n```hcl\nresource \"terraform_data\" \"item\" {\n  input = \"tracked\"\n}\noutput \"value\" {\n  value = terraform_data.item.output\n}\n```\n\n**Predict:** What will the run show, and what will its exit code be?\n\n> [!question]- Answer\n> Actual excerpt from the last command:\n>\n> ```text\n> terraform_data.item\n> ```\n>\n> Exit code: 0.\n\nAfter apply, `state list` shows the address `terraform_data.item`. This is the binding name, not the resource contents.\n\nState stores the mapping “instance address ↔ object ID”, attributes, outputs and metadata for the engine/provider. It contains `lineage`, identifying state history; `serial`, the snapshot number; provider configuration and dependency information. It is neither source code nor a complete cloud backup. Its disk format is JSON; change it through `tofu state` or `terraform state`, not manual edits.\n*(according to documentation)*. [Purpose of state](https://developer.hashicorp.com/terraform/language/state/purpose).\n\n### Drift and two plan modes\n\n**At a glance**\n- Drift is an external change to a managed object.\n- A normal plan compares reality with the configuration.\n- refresh-only proposes updating the snapshot without restoring the object.\n\n**Short scenario**\n\nThe configuration requires a file containing the text ready. The file was created, then deleted outside OpenTofu. A plan -refresh-only is being built.\n\n**Predict:** Will this plan bring the file back?\n\n> [!question]- Answer\n> No. It will show that the file is missing and propose recording the observed reality in state. Use a normal plan for actions based on the configuration. The complete local run below preserves the earlier results.\n\nBefore an ordinary plan, the provider reads objects already bound in state. If code requests three replicas but someone manually leaves two, the plan proposes returning to code. A deleted object usually results in recreation. A mutable field may update in place; an immutable one may require replacement. A new external object does not automatically acquire a state address.\n\n`tofu plan -refresh-only` proposes accepting external changes **only into the state snapshot**. After review, `tofu apply -refresh-only` saves them; neither code nor remote objects are repaired. An ordinary plan proposes changes that align objects with code. Replace obsolete `terraform refresh` with controlled `plan`/`apply -refresh-only`.\n*(according to documentation)*. [Plan modes](https://developer.hashicorp.com/terraform/cli/commands/plan).\n\n### Import: bind an existing object\n\n**At a glance**\n- Import adds a binding to an existing ID.\n- The resource configuration must be declared separately.\n- The plan may propose changing an object that has already been imported.\n\n**Mini-example:** Save as `main.tf` in a new temporary directory. After preparing the files, run `tofu init`, `tofu validate`, then `tofu plan -input=false -no-color`.\n\n```hcl\nresource \"terraform_data\" \"imported\" {\n  input = \"ready\"\n}\nimport {\n  to = terraform_data.imported\n  id = \"demo-local-id\"\n}\n```\n\n**Predict:** What will the run show, and what will its exit code be?\n\n> [!question]- Answer\n> Actual excerpt from the last command:\n>\n> ```text\n>   # terraform_data.imported will be updated in-place\n> Plan: 1 to import, 0 to add, 1 to change, 0 to destroy.\n> ```\n>\n> Exit code: 0.\n\nThe built-in resource lets us demonstrate import without an external API. The plan connects the specified ID and separately proposes setting input.\n\n> [!info]- Deeper explanation\n> All following initial-draft runs use built-in `terraform_data` and separate exercise states. For a real resource, the provider defines ID format and object reads.\n>\n> **CLI import.** Declare the target resource first:\n>\n> ```hcl\n> # main.tf\n> terraform {\n>   required_version = \">= 1.7.0\"\n> }\n>\n> resource \"terraform_data\" \"example\" {\n>   input = \"imported-lab-object\"\n> }\n> ```\n>\n> ```sh\n> tofu init\n> tofu validate\n> tofu import terraform_data.example imported-lab-object\n> tofu plan\n> ```\n>\n> The command adds a binding but does not write a `resource` block. Importing again into an occupied address returned `Error: Resource already managed by OpenTofu`. After the first import, the plan showed `Plan: 0 to add, 1 to change, 0 to destroy`: code specified `input`, absent from the imported resource. This changes the binding and then configures it rather than creating an external object. *(verified: OpenTofu 1.12.6)*.\n>\n> **Import block.** Instead of an immediate command, review import in a plan. `to` is the target address; `id` is the provider identifier:\n>\n> **`main.tf` in another new directory, not the one used for `tofu import`:**\n>\n> ```hcl\n> # main.tf\n> terraform {\n>   required_version = \">= 1.7.0\"\n> }\n>\n> resource \"terraform_data\" \"example\" {\n>   input = \"imported-lab-object\"\n> }\n>\n> import {\n>   to = terraform_data.example\n>   id = \"imported-lab-object\"\n> }\n> ```\n>\n> After `init` and `validate`, the plan showed `Plan: 1 to import, 0 to add, 1 to change, 0 to destroy`. Apply recorded the binding and configured `input`. Import blocks are available since Terraform 1.5 and in OpenTofu. *(verified: OpenTofu 1.12.6)*.\n\n### Move or forget a binding\n\n**At a glance**\n- moved changes the binding address.\n- removed with destroy=false stops managing the object.\n- Moving an address and deleting an object are different operations.\n\n**Mini-example:** Save as `main.tf` in a new temporary directory. The preparation and command sequence are listed immediately below the code block.\n\n```hcl\nresource \"terraform_data\" \"new\" {\n  input = \"stable\"\n}\nmoved {\n  from = terraform_data.old\n  to = terraform_data.new\n}\n```\n\nPrepare in the same directory: first save the contents of `before.tf.txt` as `main.tf` and run `tofu init`, `tofu apply -auto-approve`. Then replace `main.tf` with the code block above and run `tofu plan -no-color`.\n\nAdditional file `before.tf.txt`:\n\n```hcl\nresource \"terraform_data\" \"old\" { input = \"stable\" }\n```\n\n**Predict:** What will the run show, and what will its exit code be?\n\n> [!question]- Answer\n> Actual excerpt from the last command:\n>\n> ```text\n>   # terraform_data.old has moved to terraform_data.new\n> Plan: 0 to add, 0 to change, 0 to destroy.\n> ```\n>\n> Exit code: 0.\n\nPreparation first creates old. The plan with moved preserves the object and reports its transition to address new.\n\n> [!info]- Deeper explanation\n> **`moved`.** First apply:\n>\n> **`main.tf` in a new empty directory: step 1:**\n>\n> ```hcl\n> terraform {\n>   required_version = \">= 1.7.0\"\n> }\n>\n> resource \"terraform_data\" \"original\" {\n>   input = \"stable\"\n> }\n> ```\n>\n> Then replace the file with:\n>\n> **Replace that same `main.tf` completely: step 2:**\n>\n> ```hcl\n> # new main.tf after refactoring\n> terraform {\n>   required_version = \">= 1.7.0\"\n> }\n>\n> resource \"terraform_data\" \"renamed\" {\n>   input = \"stable\"\n> }\n>\n> moved {\n>   from = terraform_data.original\n>   to   = terraform_data.renamed\n> }\n> ```\n>\n> `validate` passed; the plan reported `terraform_data.original has moved to terraform_data.renamed` and `Plan: 0 to add, 0 to change, 0 to destroy`. After apply, `state list` contains only `terraform_data.renamed`, with `Resources: 0 added, 0 changed, 0 destroyed`. Without a move, a different address can look like destroy/create. *(verified: OpenTofu 1.12.6)*.\n>\n> **`removed`.** First validate and apply:\n>\n> **`main.tf` in a new empty directory: step 1:**\n>\n> ```hcl\n> terraform {\n>   required_version = \">= 1.7.0\"\n> }\n>\n> resource \"terraform_data\" \"keep\" {\n>   input = \"leave-me\"\n> }\n> ```\n>\n> Then remove the resource from code and replace the file with:\n>\n> **Replace that same `main.tf` completely: step 2:**\n>\n> ```hcl\n> terraform {\n>   required_version = \">= 1.7.0\"\n> }\n>\n> removed {\n>   from = terraform_data.keep\n>   lifecycle {\n>     destroy = false\n>   }\n> }\n> ```\n>\n> `destroy = false` ends management without destroying the object. Plan: `Plan: 0 to add, 0 to change, 0 to destroy, 1 to forget`; apply removed the binding. Without that block, removing a resource from code normally plans object destruction. `removed` is available since Terraform 1.7. *(verified: OpenTofu 1.12.6, synthetic resource)*.\n>\n> **Immediate state commands.** Separately apply the original `terraform_data.original`, then replace configuration with:\n>\n> **`main.tf` in a new directory: step 1 uses the `original` block from `moved` above; step 2 replaces it completely with:**\n>\n> ```hcl\n> terraform {\n>   required_version = \">= 1.7.0\"\n> }\n>\n> resource \"terraform_data\" \"renamed\" {\n>   input = \"stable\"\n> }\n> ```\n>\n> `tofu state mv terraform_data.original terraform_data.renamed` moved the binding; the next plan said `No changes`. Then `tofu state rm terraform_data.renamed` removed the entry; the next plan showed `Plan: 1 to add, 0 to change, 0 to destroy`. For an external object this can create a duplicate or fail because “the object already exists”. These runs used only exercise state. *(verified: OpenTofu 1.12.6)*.\n> *(according to documentation)*. [Import](https://developer.hashicorp.com/terraform/cli/commands/import) · [Address refactoring](https://developer.hashicorp.com/terraform/language/state/refactor).\n\n### Stale plans and recovery\n\n**At a glance**\n- A saved plan is tied to a snapshot of state.\n- Another apply can make it stale.\n- Recovery requires checking the bindings against the real objects.\n\n**Short scenario**\n\nPlan A was built at serial=7. Another apply wrote serial=8. The old plan file A is still there.\n\n**Predict:** Is the earlier approval of A enough to apply it?\n\n> [!question]- Answer\n> No: build and review a new plan against the current state. Approval does not update the file. This is a model; the complete verified failure run is in §11.\n\nA saved plan is tied to a state snapshot. The verified `Error: Saved plan is stale` rejection is recorded in [[Terraform-Coding-Drills-Solutions]]; §11 provides a new local experiment.\n\nFor recovery, stop concurrent applies, preserve a current copy, find a versioned backend backup, and compare `lineage`, `serial`, addresses and real objects. Use `state list`/`state show`; only then restore a snapshot or import existing objects. `state push` can overwrite remote state: do not bypass lineage/serial checks with `-force` without evidence that the snapshot is correct. Empty state does not imply empty infrastructure; blind `apply` can create duplicates.\n\n> [!info]- Deeper explanation\n> **Step 1 — Address and object**\n>\n> ```mermaid\n> flowchart TB\n>     A[\"Address in code\"]\n>     B[\"Binding in state\"]\n>     I[\"Provider object ID\"]\n>     A --> B\n>     B --> I\n> ```\n>\n> **Step 2 — Move an address**\n>\n> ```mermaid\n> flowchart TB\n>     B[\"Binding in state\"]\n>     M[\"moved: new address,<br/>same object\"]\n>     M --> B\n> ```\n>\n> **Step 3 — Remove a binding**\n>\n> ```mermaid\n> flowchart TB\n>     B[\"Binding in state\"]\n>     R[\"removed or state rm:<br/>forget the binding\"]\n>     R --> B\n> ```\n>\n> **Step 4 — Import an object**\n>\n> ```mermaid\n> flowchart TB\n>     B[\"Binding in state\"]\n>     X[\"import: bind an existing ID\"]\n>     X --> B\n> ```\n\n### Renaming without a move\n\n**At a glance**\n- The name is part of a resource address.\n- Identical contents do not bind two different addresses together.\n- Use moved to preserve the binding when renaming.\n\nFirst apply `resource \"terraform_data\" \"old\" { input = \"stable\" }` in a new directory, then replace the file with:\n\n**Replace that same `main.tf` completely:**\n\n```hcl\nresource \"terraform_data\" \"new\" { input = \"stable\" }\n```\n\n\n**Predict:** only the resource name changes from `old` to `new`, without `moved`. Will the result be update or destroy/create?\n> [!question]- Answer\n> ```text\n>   # terraform_data.new will be created\n>   # terraform_data.old will be destroyed\n> Plan: 1 to add, 0 to change, 1 to destroy.\n> ```\n> The name is part of the address. Without an explicit move, the engine sees an old address disappearing and a new address appearing.\n\n### External deletion and refreshing a snapshot\n\n**At a glance**\n- The provider may detect an external deletion.\n- refresh-only accepts an observation into state.\n- It does not recreate a file that has disappeared.\n\nApply a local file in a separate directory:\n\n**`main.tf` in a new empty directory:**\n\n```hcl\nterraform {\n  required_providers {\n    local = { source = \"hashicorp/local\", version = \">= 2.5.0, < 3.0.0\" }\n  }\n}\nresource \"local_file\" \"this\" {\n  filename = \"${path.module}/demo.txt\"\n  content  = \"desired\"\n  lifecycle { ignore_changes = [content] }\n}\n```\n\nThen remove only the created exercise `demo.txt` and run `tofu plan -refresh-only`.\n\n**Predict:** will `-refresh-only` recreate the deleted file?\n> [!question]- Answer\n> ```text\n>   # local_file.this has been deleted\n> This is a refresh-only plan, so OpenTofu will not take any actions to undo\n> these. If you were expecting these changes then you can apply this plan to\n> record the updated values in the OpenTofu state without changing any remote\n> objects.\n> ```\n> This mode proposes recording the external disappearance in state. An ordinary plan would instead propose creating the file from code.\n\n*(verified: OpenTofu 1.12.6, `local` 2.9.1; only the exercise file applied)*.\n\n**Briefly in English:** What does Terraform state do?\n\nState maps a resource address to an object ID. It also stores attributes and metadata for later plans. A moved block changes the address while keeping this link.\n\n### Splitting state: a single owner first, new automation second\n\n**At a glance**\n- An object should have one managing owner.\n- A clean plan for one root does not check a second root.\n- Handover requires coordinating both bindings and the automation.\n\n**Model without AWS calls:** root A manages bucket `logs`; management must move to root B. The bucket is not moved between accounts, only its management binding changes. One remote object should correspond to one resource instance; import does not replace configuration review. [Import](https://developer.hashicorp.com/terraform/language/import), [moving resources](https://developer.hashicorp.com/terraform/cli/state/move).\n\n1. Stop applies for both roots, identify provider versions and take protected snapshots of both states. One backend lock does not lock the other root.\n2. Prepare configuration in B for the same object, values and provider/account. Do not create it yet. In A, replace the resource with `removed` and `destroy = false`.\n3. Review A's plan: ending management only, with no destroy. Apply that exact reviewed plan.\n4. Add import in B and review its plan: import the existing ID; stop on unexpected updates/replacements. After the agreed apply, check state B, the object's absence from A, and ordinary plans from both roots.\n5. Enable B's automation only after reconciliation. On rollback, eliminate dual management first; do not restore A's backup over an already active B.\n\n[Removed without destroy](https://developer.hashicorp.com/terraform/language/resources/syntax#removing-resources), [state locking](https://developer.hashicorp.com/terraform/language/state/locking). This sequence transfers ownership; it is not an atomic transaction across two backends.\n\n```hcl\n# A: the previous resource block has already been removed from the configuration.\nremoved {\n  from = aws_s3_bucket.logs\n  lifecycle {\n    destroy = false\n  }\n}\n\n# B: resource aws_s3_bucket.logs is declared with its current parameters.\nimport {\n  to = aws_s3_bucket.logs\n  id = \"example-existing-audit-logs\"\n}\n```\n\n**Predict:** the object was imported into B, but its resource remained in A. Does a clean B plan prove a safe transfer?\n> [!question]- Answer\n> No: A can still modify or delete the same object. Verification must cover both roots and disabled pipelines.\n"
