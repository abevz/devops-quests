heading: '11. Хранение: запрос, привязка, подключение и реальные байты'
text: "## 11. Хранение: запрос, привязка, подключение и реальные байты\n\n**Коротко**\n- PVC запрашивает хранилище.\n- PV представляет привязанный том.\n- Наличие объектов не доказывает доступность данных процессу.\n\n**Короткий сценарий**\n\nPVC имеет Bound, Pod сообщает FailedMount.\n\n**Предскажи:** Уже ли доказано успешное чтение файла приложением?\n\n> [!question]- Ответ\n> Разбор заданных условий: Нет. Привязка состоялась, подключение или монтирование ещё не завершилось.\n\nPV, PersistentVolume, описывает доступный том на уровне кластера.\nPVC, PersistentVolumeClaim, — запрос приложения в пространстве имён.\nStorageClass задаёт способ создания тома и параметры хранения; сам объект не устанавливает драйвер.\nCSI — интерфейс к драйверу хранения; контроллерная часть создаёт/подключает том,\nузловая часть обеспечивает его подключение в файловую систему пода.\n*(по документации)* — [PV/PVC](https://kubernetes.io/docs/concepts/storage/persistent-volumes/),\n[StorageClass](https://kubernetes.io/docs/concepts/storage/storage-classes/).\n\n### Почему сначала ждёт PVC, а не процесс\n\n**Коротко**\n- Некоторые классы ждут первого потребителя.\n- Размещение Pod может влиять на выбор тома.\n- Pending PVC не всегда означает поломку подготовщика.\n\n**Короткий сценарий**\n\nStorageClass использует WaitForFirstConsumer. PVC создан, потребителя пока нет.\n\n**Предскажи:** Обязательно ли это ошибка при Pending?\n\n> [!question]- Ответ\n> Разбор заданных условий: Нет. Сначала нужен потребитель, чтобы учитывать его размещение.\n\n**`storage.yaml` в `/tmp/vg-k8s-work` — запрос и потребитель на стандартном классе kind:**\n\n```yaml\napiVersion: v1\nkind: PersistentVolumeClaim\nmetadata:\n  name: data\n  namespace: vg-k8s\nspec:\n  accessModes: [ReadWriteOnce]\n  resources:\n    requests:\n      storage: 32Mi\n---\napiVersion: v1\nkind: Pod\nmetadata:\n  name: stored\n  namespace: vg-k8s\nspec:\n  containers:\n    - name: app\n      image: busybox:1.37\n      command: [\"sh\", \"-c\", \"echo durable >/data/value; sleep 3600\"]\n      volumeMounts:\n        - name: data\n          mountPath: /data\n  volumes:\n    - name: data\n      persistentVolumeClaim:\n        claimName: data\n```\n\n1. Пользователь создаёт PVC с размером, классом и режимом доступа.\n2. Существующий PV может быть привязан к подходящему PVC; либо подготовщик создаёт новый PV/том.\n3. При `Immediate` создание/привязка начинается до выбора узла.\n4. При `WaitForFirstConsumer` решение откладывается до появления потребителя и учитывает размещение Pod.\n5. После назначения узла выполняются подключение тома к узлу и монтирование для контейнера.\n\n> [!info]- Глубже\n> PVC `Bound` означает привязку метаданных, но не доказывает успешный `mount` или исправность ФС.\n> При `WaitForFirstConsumer` не задавать `nodeName` напрямую: это обход планировщика, с которым PVC\n> может остаться ожидающим. Для ограничения узла использовать селектор/affinity.\n> *(по документации)* — [StorageClass](https://kubernetes.io/docs/concepts/storage/storage-classes/).\n>\n> **Схема для чтения — где именно может остановиться подготовка тома:**\n>\n> **Шаг 1 — Привязка через подготовщик**\n>\n> ```mermaid\n> flowchart TB\n>     C[\"PVC: нужен том\"]\n>     S[\"StorageClass и подготовщик\"]\n>     P[\"PV привязан: Bound\"]\n>     C --> S\n>     S --> P\n> ```\n>\n> **Шаг 2 — Ожидание первого потребителя**\n>\n> ```mermaid\n> flowchart TB\n>     C[\"PVC: нужен том\"]\n>     P[\"PV привязан: Bound\"]\n>     W[\"WaitForFirstConsumer\"]\n>     N[\"Планировщик выбирает допустимый узел\"]\n>     C --> W\n>     W --> N\n>     N --> P\n> ```\n>\n> **Шаг 3 — Подключение и чтение тома**\n>\n> ```mermaid\n> flowchart TB\n>     P[\"PV привязан: Bound\"]\n>     A[\"Подключение к узлу\"]\n>     M[\"Монтирование kubelet/драйвером\"]\n>     R[\"Приложение читает данные\"]\n>     P --> A\n>     A --> M\n>     M --> R\n> ```\n>\n> До создания потребителя PVC на стенде был `Pending`; после создания Pod стал `Bound`.\n> Проверен путь от ожидания потребителя до привязки локального PV. *(проверено)*.\n> Размер 32Mi в запросе локального подготовщика не следует считать доказательством аппаратной квоты;\n> это ограничение реализации, здесь заполнение тома не измерялось. *(не проверено)*.\n\n### Режим доступа не является блокировкой приложения\n\n**Коротко**\n- Режим доступа ограничивает способ подключения тома.\n- Он не является блокировкой записи приложения.\n- Репликация и резервирование данных решаются отдельно.\n\n**Короткий сценарий**\n\nДва процесса на одном узле получили доступ к RWO-тому.\n\n**Предскажи:** Гарантирует ли RWO безопасную конкурентную запись?\n\n> [!question]- Ответ\n> Разбор заданных условий: Нет. Требуется протокол самого приложения или файловой системы.\n\n| Режим | Заявленный способ подключения |\n|---|---|\n| `ReadWriteOnce`, RWO | Запись с одного узла; несколько подов на этом узле возможны |\n| `ReadOnlyMany`, ROX | Чтение с нескольких узлов |\n| `ReadWriteMany`, RWX | Запись с нескольких узлов |\n| `ReadWriteOncePod`, RWOP | Доступ на запись одному поду; требуется поддержка CSI |\n\n> [!info]- Глубже\n> Режимы зависят от драйвера. RWO не означает «один процесс» и не заменяет блокировку БД.\n> Параллельная запись в RWX не становится согласованной сама по себе.\n> *(по документации)* — [режимы PV](https://kubernetes.io/docs/concepts/storage/persistent-volumes/).\n>\n> `reclaimPolicy: Delete` после освобождения PVC подразумевает удаление PV и поддерживаемого внешнего тома;\n> `Retain` оставляет данные для ручного восстановления/повторного использования.\n> Расширение PVC требует разрешения класса и поддержки драйвера; уменьшение запроса не является\n> способом уменьшить существующий том. *(по документации)* — источник PV выше.\n>\n> > [!warning] Копия etcd не является копией тома\n> > В etcd есть объект PVC/PV, но байты БД находятся в хранилище. После восстановления управляющих\n> > объектов нельзя автоматически обещать согласованный PostgreSQL. Бэкап данных и проверка восстановления нужны отдельно.\n> > *(по документации)* — [эксплуатация etcd](https://kubernetes.io/docs/tasks/administer-cluster/configure-upgrade-etcd/).\n\n### Где искать отказ\n\n**Коротко**\n- Отказ хранения нужно привязать к этапу.\n- Bound относится к привязке метаданных.\n- FailedMount указывает на более позднюю операцию.\n\n**Короткий сценарий**\n\nPVC Bound, событие Pod содержит FailedMount с ошибкой прав.\n\n**Предскажи:** Поможет ли исправлять размер запрошенного PVC без других свидетельств?\n\n> [!question]- Ответ\n> Разбор заданных условий: Нет оснований. Сначала проверяются права и путь монтирования, указанные событием.\n\n`describe pvc`: неверный класс, неподдержанный режим, отказ подготовки — `ProvisioningFailed`;\nнормальное ожидание потребителя — `WaitForFirstConsumer`.\n`describe pod`: `FailedMount`, `FailedAttachVolume`, сообщение `Multi-Attach` для недопустимого второго подключения.\nСледующий шаг — события/логи драйвера и здоровье реального хранилища, а не бесконечное удаление PVC.\nПоломки CSI и повторное подключение StatefulSet здесь не воспроизводились. *(не проверено)*.\n\n> [!info]- Глубже\n> **Предскажи:** PVC Bound, процесс не запускается с `FailedMount`. Исправит ли это увеличение replicas?\n>\n> > [!question]- Ответ\n> > Нет: привязка уже состоялась, проблема ниже — подключение/монтирование.\n> > Дополнительные поды могут ещё и конфликтовать за RWO-том. *(по документации)* — источник PV выше.\n>\n> **Короткий ответ на английском:**\n>\n> > A PVC requests storage, and a PV represents the bound volume. A StorageClass defines provisioning behavior.\n> > WaitForFirstConsumer lets storage placement follow Pod scheduling. Bound does not prove that the volume is mounted."
