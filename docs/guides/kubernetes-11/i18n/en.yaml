heading: '11. Storage: request, binding, attachment and actual bytes'
text: "## 11. Storage: request, binding, attachment and actual bytes\n\n**At a glance**\n- A PVC requests storage\n- A PV represents the bound volume\n- The existence of objects does not prove the process can access data.\n\n**Short scenario**\n\nThe PVC is Bound, but the Pod reports FailedMount.\n\n**Predict:** Does this already prove the application successfully read a file?\n\n> [!question]- Answer\n> Analysis of the given conditions: No. Binding succeeded; attachment or mounting has not completed yet.\n\nPV, PersistentVolume, describes an available volume at cluster scope.\nPVC, PersistentVolumeClaim, is an application's namespaced request.\nStorageClass specifies provisioning and storage parameters; the object itself does not install a driver.\nCSI is an interface to a storage driver; its controller side provisions/attaches the volume,\nwhile its node side makes it available in the pod filesystem.\n*(according to documentation)* — [PV/PVC](https://kubernetes.io/docs/concepts/storage/persistent-volumes/),\n[StorageClass](https://kubernetes.io/docs/concepts/storage/storage-classes/).\n\n### Why the PVC waits before the process does\n\n**At a glance**\n- Some classes wait for the first consumer\n- Pod placement can affect volume selection\n- A Pending PVC does not always mean a broken provisioner.\n\n**Short scenario**\n\nThe StorageClass uses WaitForFirstConsumer. A PVC was created, but it has no consumer yet.\n\n**Predict:** Does Pending necessarily indicate an error here?\n\n> [!question]- Answer\n> Analysis of the given conditions: No. A consumer is needed first so that its placement can be considered.\n\n**`storage.yaml` in `/tmp/vg-k8s-work`: a claim and consumer using kind's standard class:**\n\n```yaml\napiVersion: v1\nkind: PersistentVolumeClaim\nmetadata:\n  name: data\n  namespace: vg-k8s\nspec:\n  accessModes: [ReadWriteOnce]\n  resources:\n    requests:\n      storage: 32Mi\n---\napiVersion: v1\nkind: Pod\nmetadata:\n  name: stored\n  namespace: vg-k8s\nspec:\n  containers:\n    - name: app\n      image: busybox:1.37\n      command: [\"sh\", \"-c\", \"echo durable >/data/value; sleep 3600\"]\n      volumeMounts:\n        - name: data\n          mountPath: /data\n  volumes:\n    - name: data\n      persistentVolumeClaim:\n        claimName: data\n```\n\n1. A user creates a PVC with size, class and access mode.\n2. An existing PV may bind to a matching PVC, or a provisioner creates a new PV/volume.\n3. With `Immediate`, provisioning/binding starts before node selection.\n4. With `WaitForFirstConsumer`, the decision waits for a consumer and considers Pod placement.\n5. After node assignment, the volume is attached to the node and mounted for the container.\n\n> [!info]- Deeper explanation\n> A `Bound` PVC indicates metadata binding, but does not prove a successful `mount` or healthy filesystem.\n> With `WaitForFirstConsumer`, do not assign `nodeName` directly: bypassing the scheduler can leave the PVC\n> pending. Use a selector/affinity to constrain node selection instead.\n> *(according to documentation)* — [StorageClass](https://kubernetes.io/docs/concepts/storage/storage-classes/).\n>\n> **Reading diagram: where volume preparation can stop:**\n>\n> **Step 1 — Binding through a provisioner**\n>\n> ```mermaid\n> flowchart TB\n>     C[\"PVC: volume requested\"]\n>     S[\"StorageClass and provisioner\"]\n>     P[\"PV bound: Bound\"]\n>     C --> S\n>     S --> P\n> ```\n>\n> **Step 2 — Waiting for the first consumer**\n>\n> ```mermaid\n> flowchart TB\n>     C[\"PVC: volume requested\"]\n>     P[\"PV bound: Bound\"]\n>     W[\"WaitForFirstConsumer\"]\n>     N[\"Scheduler selects an eligible node\"]\n>     C --> W\n>     W --> N\n>     N --> P\n> ```\n>\n> **Step 3 — Attaching and reading the volume**\n>\n> ```mermaid\n> flowchart TB\n>     P[\"PV bound: Bound\"]\n>     A[\"Attach to the node\"]\n>     M[\"Mount by kubelet/driver\"]\n>     R[\"Application reads data\"]\n>     P --> A\n>     A --> M\n>     M --> R\n> ```\n>\n> Before creating the consumer, the lab PVC was `Pending`; creating the Pod made it `Bound`.\n> The path from waiting for a consumer to binding a local PV was checked. *(verified)*.\n> A 32Mi request to a local provisioner is not proof of a hardware quota;\n> that is implementation-dependent, and filling the volume was not measured here. *(not verified)*.\n\n### Access mode is not an application lock\n\n**At a glance**\n- Access mode constrains how a volume can be attached\n- It is not an application write lock\n- Data replication and backups are separate concerns.\n\n**Short scenario**\n\nTwo processes on one node gained access to an RWO volume.\n\n**Predict:** Does RWO guarantee safe concurrent writes?\n\n> [!question]- Answer\n> Analysis of the given conditions: No. The application or filesystem needs its own protocol.\n\n| Mode | Declared attachment pattern |\n|---|---|\n| `ReadWriteOnce`, RWO | Writes from one node; several pods on that node are possible |\n| `ReadOnlyMany`, ROX | Reads from multiple nodes |\n| `ReadWriteMany`, RWX | Writes from multiple nodes |\n| `ReadWriteOncePod`, RWOP | Write access for one pod; requires CSI support |\n\n> [!info]- Deeper explanation\n> Modes depend on the driver. RWO does not mean “one process” and does not replace a database lock.\n> Concurrent RWX writes do not become consistent automatically.\n> *(according to documentation)* — [PV modes](https://kubernetes.io/docs/concepts/storage/persistent-volumes/).\n>\n> After a PVC is released, `reclaimPolicy: Delete` implies deletion of the PV and supported external volume;\n> `Retain` keeps data for manual recovery/reuse.\n> PVC expansion requires class permission and driver support; reducing the request is not\n> a way to shrink an existing volume. *(according to documentation)* — the PV source above.\n>\n> > [!warning] An etcd backup is not a volume backup\n> > etcd contains PVC/PV objects, but database bytes live in storage. Restoring control-plane\n> > objects does not automatically produce consistent PostgreSQL data. Data backups and restore tests are separately required.\n> > *(according to documentation)* — [operating etcd](https://kubernetes.io/docs/tasks/administer-cluster/configure-upgrade-etcd/).\n\n### Where to look for a failure\n\n**At a glance**\n- Tie a storage failure to its stage\n- Bound describes metadata binding\n- FailedMount points to a later operation.\n\n**Short scenario**\n\nThe PVC is Bound, and a Pod event reports FailedMount with a permissions error.\n\n**Predict:** Will changing the requested PVC size help without other evidence?\n\n> [!question]- Answer\n> Analysis of the given conditions: There is no basis for that. First check the permissions and mount path identified by the event.\n\n`describe pvc`: wrong class, unsupported mode or provisioning failure — `ProvisioningFailed`;\nordinary consumer waiting — `WaitForFirstConsumer`.\n`describe pod`: `FailedMount`, `FailedAttachVolume`, or `Multi-Attach` for an invalid second attachment.\nNext inspect driver events/logs and actual storage health rather than endlessly deleting the PVC.\nCSI failures and StatefulSet reattachment were not reproduced here. *(not verified)*.\n\n> [!info]- Deeper explanation\n> **Predict:** PVC is Bound, but the process cannot start because of `FailedMount`. Will increasing replicas fix it?\n>\n> > [!question]- Answer\n> > No: binding already happened; the problem is lower down, at attachment/mounting.\n> > Additional pods may also compete for an RWO volume. *(according to documentation)* — the PV source above.\n>\n> **Short answer in English:**\n>\n> > A PVC requests storage, and a PV represents the bound volume. A StorageClass defines provisioning behavior.\n> > WaitForFirstConsumer lets storage placement follow Pod scheduling. Bound does not prove that the volume is mounted.\n"
