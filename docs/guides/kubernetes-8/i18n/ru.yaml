heading: '8. Размещение: сначала допустимые узлы, затем лучший из них'
text: "## 8. Размещение: сначала допустимые узлы, затем лучший из них\n\n**Коротко**\n- Планировщик сначала исключает неподходящие узлы\n- Затем выбирает из допустимых\n- Высокий приоритет не отменяет жёсткое ограничение.\n\n**Короткий сценарий**\n\nPod требует метку disk=fast. Ни один узел такой метки не имеет.\n\n**Предскажи:** Исправит ли это высокий priority?\n\n> [!question]- Ответ\n> Разбор заданных условий: Нет. Нет допустимого узла; нужно исправлять требования или ёмкость с нужной меткой.\n\nПланировщик читает неназначенные поды и сведения об узлах из API.\nНа этапе фильтрации исключает узлы, нарушающие обязательные условия; затем оценивает оставшиеся\nи записывает назначение. Его сравнение ресурсов использует запросы `requests` и доступный объём\n`allocatable`, а не текущий низкий CPU в `top`. `allocatable` — объём после резервов узла.\n*(по документации)* — [планировщик](https://kubernetes.io/docs/concepts/scheduling-eviction/kube-scheduler/),\n[ресурсы](https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/).\n\n> [!info]- Глубже\n> **Схема для чтения — почему высокий приоритет не исправляет несовместимость:**\n>\n> ```mermaid\n> flowchart TD\n>     P[\"Pod без назначенного узла\"] --> F[\"Фильтры: ресурсы, запреты, метки, тома\"]\n>     F --> Y[\"Есть подходящие узлы\"]\n>     Y --> S[\"Оценка и выбор узла\"]\n>     S --> B[\"Назначение через API\"]\n>     F --> N[\"Подходящих узлов нет\"]\n>     N --> E[\"FailedScheduling\"]\n>     E --> R[\"Может ли вытеснение освободить подходящий узел?\"]\n> ```\n\n### Четыре классические причины Pending\n\n**Коротко**\n- Pending может означать отсутствие подходящего узла\n- Причину нужно читать в условиях и событиях\n- Не все Pending связаны с загрузкой образа.\n\n**Мини-пример:** только в одноразовом kind из подготовки выше. Создай namespace командой `kubectl --kubeconfig /tmp/guides-order-rest.kubeconfig --context kind-guides-order-rest create namespace guide-mini-20`. Сохрани листинг как `mini.sh`; запуск — `bash -e mini.sh`.\n\n```bash\nk() { kubectl --kubeconfig /tmp/guides-order-rest.kubeconfig --context kind-guides-order-rest -n guide-mini-20 \"$@\"; }\ncat > overrides.json <<'JSON'\n{\"spec\":{\"nodeSelector\":{\"guide.example/missing\":\"yes\"}}}\nJSON\njq -e '.spec.nodeSelector' overrides.json >/dev/null\nk run pending --image=nginx:1.29-alpine --image-pull-policy=Never --overrides=\"$(cat overrides.json)\"\nk wait --for=jsonpath='{.status.conditions[0].reason}'=Unschedulable pod/pending --timeout=60s\nk get pod pending -o jsonpath='{.status.phase}{\"\\n\"}'\nk get pod pending -o jsonpath='{.status.conditions[0].reason}{\"\\n\"}'\n```\n\n**Предскажи:** Что покажет последняя команда после выполнения предыдущих?\n\n> [!question]- Ответ\n> Фактический stdout команд:\n>\n> ```text\n> pod/pending created\n> pod/pending condition met\n> Pending\n> Unschedulable\n> ```\n>\n> Код завершения: 0.\n\nТребуемой метки нет у узла этого стенда. Контейнер ещё не назначен узлу, причина — Unschedulable.\n\n**`toobig.yaml` в `/tmp/vg-k8s-work` — заведомо неподходящие запросы:**\n\n```yaml\napiVersion: v1\nkind: Pod\nmetadata:\n  name: toobig\n  namespace: vg-k8s\nspec:\n  containers:\n    - name: app\n      image: busybox:1.37\n      command: [\"sleep\", \"3600\"]\n      resources:\n        requests:\n          cpu: \"1000\"\n          memory: 1Ti\n```\n\n| Причина | Что сравнивается | Что проверять |\n|---|---|---|\n| Не хватает ресурсов | Запрос Pod + уже назначенные запросы против `allocatable` | `Insufficient cpu`, `Insufficient memory` |\n| Запрет узла не переносится подом | `taints` против `tolerations` | `untolerated taint` |\n| Не подходят метки/обязательные правила | `nodeSelector`, affinity, распределение | `didn't match Pod's node affinity/selector` |\n| Не готов том или не сходится его топология | PVC, PV, узлы хранения | `unbound immediate PersistentVolumeClaims`, `volume node affinity conflict` |\n\n> [!info]- Глубже\n> Эти четыре причины — практическая группировка, не исчерпывающий список состояний `Pending`.\n> Назначенный Pod также ждёт загрузки образа, Secret, CNI и подключения тома: сначала проверять `spec.nodeName`.\n> Ресурсы и правила — *(по документации)* — источники выше и\n> [привязка хранения](https://kubernetes.io/docs/concepts/storage/storage-classes/).\n>\n> CPU `1000` здесь означает тысячу ядер, не тысячу миллиядер.\n> `m` в CPU — одна тысячная ядра; `Mi`/`Gi`/`Ti` — двоичные единицы памяти.\n> Запрос не выделяет память процессу заранее: он участвует в допуске на узел.\n> *(по документации)* — [ресурсы](https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/).\n>\n> **Вывод нового события — пример для чтения:**\n>\n> ```text\n> 0/3 nodes are available: 1 node(s) had untolerated taint(s), 2 Insufficient cpu,\n> 2 Insufficient memory. preemption: 0/3 nodes are available:\n> 3 Preemption is not helpful for scheduling.\n> ```\n>\n> Под не назначен; нехватка ресурсов подтверждена событием. Обязательный `nodeSelector: disk: imaginary`\n> отдельно дал `2 node(s) didn't match Pod's node affinity/selector`. *(проверено)*.\n\n### Запреты узлов и переносимость\n\n**Коротко**\n- Taint запрещает или ограничивает размещение\n- Toleration разрешает переносить конкретный запрет\n- Она не заставляет выбрать этот узел.\n\n**Короткий сценарий**\n\nPod переносит dedicated=batch:NoSchedule. Selector у него отсутствует.\n\n**Предскажи:** Обязан ли он попасть на batch-узел?\n\n> [!question]- Ответ\n> Разбор заданных условий: Нет. Toleration снимает один запрет; выбор остаётся за остальными условиями планировщика.\n\n**Команда в любом каталоге — учебный запрет только на узле одноразового стенда:**\n\n```bash\nkubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s \\\n  taint node vg-k8s-worker dedicated=reserved:NoSchedule\n```\n\n**`placed.yaml` в `/tmp/vg-k8s-work` — переносимость плюс обязательное размещение:**\n\n```yaml\napiVersion: v1\nkind: Pod\nmetadata:\n  name: placed\n  namespace: vg-k8s\nspec:\n  nodeSelector:\n    kubernetes.io/hostname: vg-k8s-worker\n  tolerations:\n    - key: dedicated\n      operator: Equal\n      value: reserved\n      effect: NoSchedule\n  containers:\n    - name: app\n      image: busybox:1.37\n      command: [\"sleep\", \"3600\"]\n```\n\nTaint — свойство узла; toleration — разрешение поду **переносить** соответствующий запрет.\n`NoSchedule` препятствует новым назначениям, `PreferNoSchedule` задаёт предпочтение,\n`NoExecute` также может выселить существующие поды, с учётом toleration и его срока.\nToleration не притягивает Pod на узел и не резервирует его только для этого приложения.\n*(по документации)* — [taints/tolerations](https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/).\n\n> [!info]- Глубже\n> Под с тем же выбором узла **без** toleration оставался неназначенным и получил событие запрета.\n> После проверки taint удалён; успешный запуск именно файла `placed.yaml` здесь не заявляется.\n> *(проверено)* — отказ без переносимости; полный положительный пример — *(не проверено)*.\n\n### Привязанность и распределение\n\n**Коротко**\n- Affinity задаёт предпочтение или требование размещения\n- Spread ограничивает неравномерность распределения\n- Мягкое пожелание не гарантирует разнос.\n\n**Короткий сценарий**\n\nДве реплики имеют только preferred anti-affinity. Доступен один узел.\n\n**Предскажи:** Могут ли обе оказаться на нём?\n\n> [!question]- Ответ\n> Разбор заданных условий: Да. Мягкое предпочтение уступает возможности разместить Pod; строгая гарантия требует жёсткого правила и достаточной ёмкости.\n\n**`spread.yaml` в `/tmp/vg-k8s-work` — полный Deployment с распределением по узлам:**\n\n```yaml\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: spread\n  namespace: vg-k8s\nspec:\n  replicas: 3\n  selector:\n    matchLabels:\n      app: spread\n  template:\n    metadata:\n      labels:\n        app: spread\n    spec:\n      affinity:\n        nodeAffinity:\n          requiredDuringSchedulingIgnoredDuringExecution:\n            nodeSelectorTerms:\n              - matchExpressions:\n                  - key: kubernetes.io/os\n                    operator: In\n                    values: [linux]\n      topologySpreadConstraints:\n        - maxSkew: 1\n          topologyKey: kubernetes.io/hostname\n          whenUnsatisfiable: DoNotSchedule\n          labelSelector:\n            matchLabels:\n              app: spread\n      containers:\n        - name: app\n          image: busybox:1.37\n          command: [\"sleep\", \"3600\"]\n          resources:\n            requests:\n              cpu: 20m\n              memory: 16Mi\n```\n\n`nodeAffinity` выражает выбор **меток узла**; `podAffinity`/`podAntiAffinity` — соседство с выбранными\n**подами** в области `topologyKey`, например hostname или зоне.\n`requiredDuringSchedulingIgnoredDuringExecution` обязателен при назначении, но изменение метки после\nзапуска само по себе не выселяет Pod. `preferred...` — предпочтение при оценке.\n*(по документации)* — [назначение узлам](https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/).\n\n> [!info]- Глубже\n> `topologySpreadConstraints` сравнивает количество выбранных подов по областям.\n> `maxSkew` ограничивает дисбаланс; `DoNotSchedule` делает ограничение обязательным,\n> `ScheduleAnyway` использует его как предпочтение. Недостающие метки зон и слишком строгие условия\n> могут оставить Pod Pending даже при свободных ресурсах.\n> *(по документации)* — [распределение](https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/).\n>\n> В `nodeSelectorTerms` альтернативные элементы — «или», выражения внутри одного элемента — «и».\n> Для распределения метки шаблона должны попадать в `labelSelector`; иначе считаются не те поды.\n> Схема примера сверяется с API; реальное распределение его реплик — *(не проверено)*.\n\n### Приоритет и вытеснение\n\n**Коротко**\n- Priority задаёт важность в очереди\n- Preemption может освобождать место вытеснением\n- Политика Never запрещает такое вытеснение этим Pod.\n\n**Короткий сценарий**\n\nВысокоприоритетный Pod имеет preemptionPolicy=Never, свободных ресурсов нет.\n\n**Предскажи:** Должен ли он вытеснить менее приоритетный Pod?\n\n> [!question]- Ответ\n> Разбор заданных условий: Нет. Он может ждать первым в очереди, но не получает право вытеснения.\n\n**`priority.yaml` в `/tmp/vg-k8s-work` — высокий приоритет без вытеснения:**\n\n```yaml\napiVersion: scheduling.k8s.io/v1\nkind: PriorityClass\nmetadata:\n  name: vg-k8s-important\nvalue: 10000\nglobalDefault: false\npreemptionPolicy: Never\ndescription: \"Important work without preemption\"\n---\napiVersion: v1\nkind: Pod\nmetadata:\n  name: important\n  namespace: vg-k8s\nspec:\n  priorityClassName: vg-k8s-important\n  containers:\n    - name: app\n      image: busybox:1.37\n      command: [\"sleep\", \"3600\"]\n      resources:\n        requests:\n          cpu: 20m\n          memory: 16Mi\n```\n\n`PriorityClass` задаёт численный приоритет; более важный Pod раньше рассматривается для назначения.\nЕсли ресурсов не хватает, планировщик может выбрать поды меньшего приоритета как жертвы.\nЭто помогает только тогда, когда удаление жертв делает узел подходящим; неверную метку или отсутствующий\nPV оно не исправляет. PDB учитывается при поиске жертв, но его соблюдение при вытеснении не абсолютная гарантия.\n*(по документации)* — [priority/preemption](https://kubernetes.io/docs/concepts/scheduling-eviction/pod-priority-preemption/).\n\n> [!info]- Глубже\n> `preemptionPolicy: Never` сохраняет приоритет очереди, но запрещает этому поду вытеснять других.\n> Фактическое вытеснение здесь не воспроизводилось. *(не проверено)*.\n>\n> **Предскажи:** узел свободен по `top`, но все запросы CPU уже распределены. Сядет ли ещё один Pod?\n>\n> > [!question]- Ответ\n> > Низкое фактическое потребление не отменяет уже учтённых запросов.\n> > Новый Pod может получить `Insufficient cpu`. *(по документации)* — источник ресурсов выше.\n>\n> **Короткий ответ на английском:**\n>\n> > The scheduler filters nodes by hard constraints and then scores the valid nodes.\n> > It uses resource requests, not only current usage. A toleration permits a taint but does not select the node.\n> > Preemption helps only if removing lower priority Pods makes a node suitable.\n"
source_hash: a31d6adb2b579adb11cad80f70f7e6f059fdfa655a5b8ec5406ac388117cb92e
