heading: '8. Placement: eligible nodes first, the best node second'
text: "## 8. Placement: eligible nodes first, the best node second\n\n**At a glance**\n- The scheduler first excludes unsuitable nodes\n- It then chooses among eligible nodes\n- High priority does not override a hard constraint.\n\n**Short scenario**\n\nThe Pod requires disk=fast. No node has that label.\n\n**Predict:** Will a high priority fix this?\n\n> [!question]- Answer\n> Analysis of the given conditions: No. There is no eligible node; change the requirements or provide capacity with the required label.\n\nThe scheduler reads unassigned pods and node information from the API.\nFiltering excludes nodes that violate mandatory conditions; scoring then ranks the remaining nodes\nand records an assignment. Resource comparisons use `requests` and available\n`allocatable` capacity, not low current CPU usage in `top`. `allocatable` is capacity after node reservations.\n*(according to documentation)* — [scheduler](https://kubernetes.io/docs/concepts/scheduling-eviction/kube-scheduler/),\n[resources](https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/).\n\n> [!info]- Deeper explanation\n> **Reading diagram: why high priority cannot fix incompatibility:**\n>\n> ```mermaid\n> flowchart TD\n>     P[\"Pod without an assigned node\"] --> F[\"Filters: resources, taints, labels, volumes\"]\n>     F --> Y[\"Eligible nodes exist\"]\n>     Y --> S[\"Score and select a node\"]\n>     S --> B[\"Binding through the API\"]\n>     F --> N[\"No eligible nodes\"]\n>     N --> E[\"FailedScheduling\"]\n>     E --> R[\"Can preemption free an eligible node?\"]\n> ```\n\n### Four classic causes of Pending\n\n**At a glance**\n- Pending can mean no suitable node exists\n- Read conditions and events to find the cause\n- Not every Pending state involves an image pull.\n\n**Mini-example:** only in the disposable kind cluster prepared above. Create the namespace with `kubectl --kubeconfig /tmp/guides-order-rest.kubeconfig --context kind-guides-order-rest create namespace guide-mini-20`. Save the listing as `mini.sh`; run it with `bash -e mini.sh`.\n\n```bash\nk() { kubectl --kubeconfig /tmp/guides-order-rest.kubeconfig --context kind-guides-order-rest -n guide-mini-20 \"$@\"; }\ncat > overrides.json <<'JSON'\n{\"spec\":{\"nodeSelector\":{\"guide.example/missing\":\"yes\"}}}\nJSON\njq -e '.spec.nodeSelector' overrides.json >/dev/null\nk run pending --image=nginx:1.29-alpine --image-pull-policy=Never --overrides=\"$(cat overrides.json)\"\nk wait --for=jsonpath='{.status.conditions[0].reason}'=Unschedulable pod/pending --timeout=60s\nk get pod pending -o jsonpath='{.status.phase}{\"\\n\"}'\nk get pod pending -o jsonpath='{.status.conditions[0].reason}{\"\\n\"}'\n```\n\n**Predict:** What will the last command show after the preceding commands finish?\n\n> [!question]- Answer\n> Actual command stdout:\n>\n> ```text\n> pod/pending created\n> pod/pending condition met\n> Pending\n> Unschedulable\n> ```\n>\n> Exit code: 0.\n\nThe node in this environment lacks the required label. The container has not been assigned to a node; the reason is Unschedulable.\n\n**`toobig.yaml` in `/tmp/vg-k8s-work`: deliberately impossible requests:**\n\n```yaml\napiVersion: v1\nkind: Pod\nmetadata:\n  name: toobig\n  namespace: vg-k8s\nspec:\n  containers:\n    - name: app\n      image: busybox:1.37\n      command: [\"sleep\", \"3600\"]\n      resources:\n        requests:\n          cpu: \"1000\"\n          memory: 1Ti\n```\n\n| Cause | Comparison | Evidence to inspect |\n|---|---|---|\n| Insufficient resources | Pod requests plus assigned requests against `allocatable` | `Insufficient cpu`, `Insufficient memory` |\n| A node taint is not tolerated | `taints` against `tolerations` | `untolerated taint` |\n| Labels or mandatory rules do not match | `nodeSelector`, affinity, distribution | `didn't match Pod's node affinity/selector` |\n| A volume is not ready or its topology conflicts | PVC, PV, storage nodes | `unbound immediate PersistentVolumeClaims`, `volume node affinity conflict` |\n\n> [!info]- Deeper explanation\n> These four causes are a practical grouping, not an exhaustive list of `Pending` conditions.\n> An assigned Pod may also wait for an image, Secret, CNI or volume attachment: inspect `spec.nodeName` first.\n> Resources and rules are *(according to documentation)* — sources above and\n> [storage binding](https://kubernetes.io/docs/concepts/storage/storage-classes/).\n>\n> CPU `1000` means one thousand cores here, not one thousand millicores.\n> CPU `m` means one thousandth of a core; `Mi`/`Gi`/`Ti` are binary memory units.\n> A request does not preallocate process memory: it participates in node admission.\n> *(according to documentation)* — [resources](https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/).\n>\n> **A fresh event: an example to read:**\n>\n> ```text\n> 0/3 nodes are available: 1 node(s) had untolerated taint(s), 2 Insufficient cpu,\n> 2 Insufficient memory. preemption: 0/3 nodes are available:\n> 3 Preemption is not helpful for scheduling.\n> ```\n>\n> The pod was unassigned; an event confirmed resource shortage. Separately, mandatory `nodeSelector: disk: imaginary`\n> produced `2 node(s) didn't match Pod's node affinity/selector`. *(verified)*.\n\n### Node taints and tolerations\n\n**At a glance**\n- A taint forbids or restricts scheduling\n- A toleration allows a Pod to tolerate a specific restriction\n- It does not force selection of that node.\n\n**Short scenario**\n\nThe Pod tolerates dedicated=batch:NoSchedule. It has no selector.\n\n**Predict:** Must it land on a batch node?\n\n> [!question]- Answer\n> Analysis of the given conditions: No. A toleration removes one restriction; the scheduler's other conditions still govern placement.\n\n**Command from any directory: an exercise taint only on a disposable lab node:**\n\n```bash\nkubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s \\\n  taint node vg-k8s-worker dedicated=reserved:NoSchedule\n```\n\n**`placed.yaml` in `/tmp/vg-k8s-work`: toleration plus mandatory placement:**\n\n```yaml\napiVersion: v1\nkind: Pod\nmetadata:\n  name: placed\n  namespace: vg-k8s\nspec:\n  nodeSelector:\n    kubernetes.io/hostname: vg-k8s-worker\n  tolerations:\n    - key: dedicated\n      operator: Equal\n      value: reserved\n      effect: NoSchedule\n  containers:\n    - name: app\n      image: busybox:1.37\n      command: [\"sleep\", \"3600\"]\n```\n\nA taint belongs to a node; a toleration permits a pod to **tolerate** the corresponding restriction.\n`NoSchedule` blocks new assignments; `PreferNoSchedule` expresses a preference;\n`NoExecute` may also evict existing pods, subject to their tolerations and durations.\nA toleration does not attract a Pod to a node or reserve that node exclusively for the application.\n*(according to documentation)* — [taints/tolerations](https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/).\n\n> [!info]- Deeper explanation\n> A pod with the same node selection **without** a toleration stayed unassigned and received a taint event.\n> The taint was removed after checking; a successful run of `placed.yaml` itself is not claimed here.\n> *(verified)* — rejection without toleration; the complete positive example is *(not verified)*.\n\n### Affinity and distribution\n\n**At a glance**\n- Affinity expresses a scheduling preference or requirement\n- Spread constrains uneven distribution\n- A soft preference does not guarantee separation.\n\n**Short scenario**\n\nTwo replicas have only preferred anti-affinity. One node is available.\n\n**Predict:** Can both end up on it?\n\n> [!question]- Answer\n> Analysis of the given conditions: Yes. A soft preference yields to the ability to schedule a Pod; a strict guarantee requires a hard rule and sufficient capacity.\n\n**`spread.yaml` in `/tmp/vg-k8s-work`: a complete Deployment spread across nodes:**\n\n```yaml\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: spread\n  namespace: vg-k8s\nspec:\n  replicas: 3\n  selector:\n    matchLabels:\n      app: spread\n  template:\n    metadata:\n      labels:\n        app: spread\n    spec:\n      affinity:\n        nodeAffinity:\n          requiredDuringSchedulingIgnoredDuringExecution:\n            nodeSelectorTerms:\n              - matchExpressions:\n                  - key: kubernetes.io/os\n                    operator: In\n                    values: [linux]\n      topologySpreadConstraints:\n        - maxSkew: 1\n          topologyKey: kubernetes.io/hostname\n          whenUnsatisfiable: DoNotSchedule\n          labelSelector:\n            matchLabels:\n              app: spread\n      containers:\n        - name: app\n          image: busybox:1.37\n          command: [\"sleep\", \"3600\"]\n          resources:\n            requests:\n              cpu: 20m\n              memory: 16Mi\n```\n\n`nodeAffinity` selects **node labels**; `podAffinity`/`podAntiAffinity` selects proximity to chosen\n**pods** within a `topologyKey` domain, such as a hostname or zone.\n`requiredDuringSchedulingIgnoredDuringExecution` is mandatory when scheduling, but a label change after\nstartup does not itself evict the Pod. `preferred...` expresses a scoring preference.\n*(according to documentation)* — [node assignment](https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/).\n\n> [!info]- Deeper explanation\n> `topologySpreadConstraints` compares counts of selected pods across domains.\n> `maxSkew` limits imbalance; `DoNotSchedule` makes that constraint mandatory,\n> while `ScheduleAnyway` uses it as a preference. Missing zone labels and overly strict conditions\n> can leave a Pod Pending even when resources are available.\n> *(according to documentation)* — [distribution](https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/).\n>\n> Alternative entries in `nodeSelectorTerms` are OR; expressions within one entry are AND.\n> For spreading, template labels must match `labelSelector`; otherwise the wrong pods are counted.\n> The example schema is checked against the API; actual distribution of its replicas is *(not verified)*.\n\n### Priority and preemption\n\n**At a glance**\n- Priority defines queue importance\n- Preemption can free capacity by displacing other Pods\n- The Never policy forbids this Pod from preempting others.\n\n**Short scenario**\n\nA high-priority Pod has preemptionPolicy=Never, and no resources are free.\n\n**Predict:** Should it preempt a lower-priority Pod?\n\n> [!question]- Answer\n> Analysis of the given conditions: No. It may wait first in the queue, but it does not gain preemption rights.\n\n**`priority.yaml` in `/tmp/vg-k8s-work`: high priority without preemption:**\n\n```yaml\napiVersion: scheduling.k8s.io/v1\nkind: PriorityClass\nmetadata:\n  name: vg-k8s-important\nvalue: 10000\nglobalDefault: false\npreemptionPolicy: Never\ndescription: \"Important work without preemption\"\n---\napiVersion: v1\nkind: Pod\nmetadata:\n  name: important\n  namespace: vg-k8s\nspec:\n  priorityClassName: vg-k8s-important\n  containers:\n    - name: app\n      image: busybox:1.37\n      command: [\"sleep\", \"3600\"]\n      resources:\n        requests:\n          cpu: 20m\n          memory: 16Mi\n```\n\n`PriorityClass` sets numeric priority; a more important Pod is considered earlier for scheduling.\nIf resources are insufficient, the scheduler may select lower-priority pods as victims.\nThis helps only when removing those victims makes a node eligible; it cannot fix a wrong label or missing\nPV. PDB is considered when selecting victims, but respecting it during preemption is not an absolute guarantee.\n*(according to documentation)* — [priority/preemption](https://kubernetes.io/docs/concepts/scheduling-eviction/pod-priority-preemption/).\n\n> [!info]- Deeper explanation\n> `preemptionPolicy: Never` retains queue priority but prevents this pod from preempting others.\n> Actual preemption was not reproduced here. *(not verified)*.\n>\n> **Predict:** `top` shows an idle node, but all CPU requests have already been allocated. Can another Pod fit?\n>\n> > [!question]- Answer\n> > Low actual consumption does not cancel previously accounted requests.\n> > A new Pod may receive `Insufficient cpu`. *(according to documentation)* — the resource source above.\n>\n> **Short answer in English:**\n>\n> > The scheduler filters nodes by hard constraints and then scores the valid nodes.\n> > It uses resource requests, not only current usage. A toleration permits a taint but does not select the node.\n> > Preemption helps only if removing lower priority Pods makes a node suitable."
