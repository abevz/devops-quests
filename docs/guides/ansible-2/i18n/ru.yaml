heading: 2. Имена, группы и выбор хостов (inventory)
text: "## 2. Имена, группы и выбор хостов (inventory)\n\n**Коротко**\n- Inventory — список имён узлов и групп.\n- Имя узла может отличаться от адреса подключения.\n- Просмотр inventory показывает выбор узлов, но не проверяет доступ к ним.\n\n**Мини-пример:** сохрани как `mini.yml`; запуск — `ansible-inventory -i mini.yml --graph`. Эта команда читает inventory, не подключаясь к узлам.\n\n```yaml\nall:\n  children:\n    lab:\n      hosts:\n        localhost:\n          ansible_connection: local\n```\n\n**Предскажи:** В какой группе окажется localhost? Будет ли команда выполнять задачи на узле?\n\n> [!question]- Ответ\n> Запуск 1; код 0. stdout:\n>\n> ```text\n> @all:\n>   |--@ungrouped:\n>   |--@lab:\n>   |  |--localhost\n> ```\n\n`--graph` показывает дерево групп. Подключение и модули при этом не запускаются; прежний inventory для полных опытов сохранён дальше.\n\nБезопасный inventory для всех локальных примеров, файл `inventory.ini`:\n\n```ini\n[lab]\nlocalhost ansible_connection=local ansible_python_interpreter=/usr/bin/python\n```\n\n**Шаблон** в `hosts:` выбирает множество. `web:db` — объединение, `web:&production` — пересечение,\n`web:!maintenance` — исключение. Кавычки защищают `!`/`&` от интерпретации оболочкой.\n`--limit` дополнительно сужает выбранное множество, не добавляет отсутствующих в сценарии хостов:\n\n```bash\nansible-inventory -i inventory.ini --graph\nansible-playbook -i inventory.ini ping.yml --limit localhost --list-hosts\n```\n\n*(проверено)* Для локального inventory `--graph` вернул:\n\n```text\n@all:\n  |--@ungrouped:\n  |--@lab:\n  |  |--localhost\n```\n\nInventory отвечает на два разных вопроса: **какие узлы существуют** и **как к ним подключаться**.\nИмя `web1` — ключ в inventory. `ansible_host` — адрес подключения; они не обязаны совпадать.\nГруппа задаёт множество хостов, а не порядок запуска.\n\nINI-эквивалент вложенной группы — `[production:children]`, под ним строка `web`.\nКаталоги `group_vars/` и `host_vars/` рядом с inventory/playbook загружаются плагином переменных:\n\n> [!info]- Глубже\n> Альтернативный YAML inventory; это **не playbook**, здесь нет списка сценариев:\n>\n> **`inventory.yml` — замена `inventory.ini`, а не дополнение к нему:**\n>\n> ```yaml\n> all:\n>   children:\n>     lab:\n>       hosts:\n>         localhost:\n>           ansible_connection: local\n>           ansible_python_interpreter: /usr/bin/python\n>     web:\n>       hosts:\n>         web1:\n>           ansible_host: 192.0.2.11\n>         web2:\n>           ansible_host: 192.0.2.12\n>     production:\n>       children:\n>         web: {}\n> ```\n>\n> Адреса `192.0.2.*` — иллюстрация, не стенд для запуска. `all` содержит все хосты;\n> `ungrouped` — хосты без пользовательских групп. `children` означает включение дочерних групп.\n> `{}` — пустой словарь: группа уже определена выше, здесь на неё ссылаются.\n>\n> ```mermaid\n> flowchart TB\n>     A[\"Все узлы\"] --> P[\"Рабочая среда\"]\n>     A --> L[\"Лаборатория\"]\n>     P --> W[\"Веб-серверы\"]\n>     W --> H1[\"web1: имя в inventory\"]\n>     W --> H2[\"web2: имя в inventory\"]\n>     H1 --> IP[\"Адрес подключения по SSH\"]\n> ```\n>\n> ```text\n> inventory.ini\n> site.yml\n> group_vars/all.yml       # общие значения\n> group_vars/web.yml       # значения группы web\n> host_vars/web1.yml       # значения конкретного имени в inventory\n> ```\n>\n> Например `group_vars/web.yml` содержит `app_port: 8080`, а `host_vars/web1.yml` — `app_port: 8081`.\n> Это YAML-словарь, без `vars:` вокруг. Переменные родительской группы слабее переменных дочерней, а переменные хоста сильнее переменных группы.\n> При пересечении одноуровневых групп по умолчанию действует порядок имён; `ansible_group_priority`\n> задают в inventory, не в `group_vars`, если нужен иной порядок загрузки. Типы переменных в строках INI и\n> INI `:vars` могут различаться; YAML предпочтительнее для логических значений, списков и словарей.\n> *(по документации)* [Устройство inventory](https://docs.ansible.com/ansible/latest/inventory_guide/intro_inventory.html).\n>\n> Если выбрать `--limit web1` в локальном inventory, совпадений нет; это ошибка выбора inventory,\n> а не SSH. Реальное предупреждение приведено в §16.\n> *(по документации)* [Шаблоны хостов](https://docs.ansible.com/ansible/latest/inventory_guide/intro_patterns.html).\n>\n> **Плагин динамического inventory** выполняется на управляющем узле: читает учётные данные, вызывает API,\n> создаёт имена в inventory, группы и переменные. Он не устанавливает SSH и не конфигурирует узлы.\n> Метки облачных ресурсов могут стать группами; адрес необходимо выбрать явно, чтобы не получить недоступный публичный IP-адрес.\n>\n> | Источник | Плагин и официальная страница |\n> |---|---|\n> | AWS EC2 | [`amazon.aws.aws_ec2`](https://docs.ansible.com/ansible/latest/collections/amazon/aws/aws_ec2_inventory.html) |\n> | Proxmox | [`community.proxmox.proxmox`](https://docs.ansible.com/ansible/latest/collections/community/proxmox/proxmox_inventory.html) |\n> | Kubernetes | [`kubernetes.core.k8s`](https://docs.ansible.com/ansible/latest/collections/kubernetes/core/k8s_inventory.html) |\n>\n> Пример **конфигурации inventory**, `lab.aws_ec2.yml` — имя файла должно соответствовать требованиям плагина:\n>\n> ```yaml\n> plugin: amazon.aws.aws_ec2\n> regions:\n>   - eu-central-1\n> filters:\n>   tag:Environment: lab\n> keyed_groups:\n>   - key: tags.Role\n>     prefix: role\n> ```\n>\n> Нужны коллекция, библиотека Python для работы с API и права API на управляющем узле. Inventory Kubernetes обнаруживает\n> объекты и подключения, а не превращает каждый Pod в виртуальную машину Linux. Для Proxmox IP-адрес зависит от данных API,\n> гостевого агента и настроек `compose`; наличие виртуальной машины ещё не доказывает готовность SSH.\n> Примеры всех трёх плагинов динамического inventory приведены *(по документации)*;\n> синхронизация с действующими API здесь *(не проверено)*.\n>\n> Вопрос: **What is dynamic inventory, and what does `--limit` do?**\n>\n> > A dynamic inventory plugin gets hosts and groups from an API on the control node. It does not\n> > configure those hosts. The limit option selects a smaller set from the hosts already selected\n> > by the play."
