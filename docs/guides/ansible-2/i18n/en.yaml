heading: 2. Names, groups and host selection (inventory)
text: "## 2. Names, groups and host selection (inventory)\n\n**At a glance**\n- Inventory lists host and group names.\n- A host's name may differ from its connection address.\n- Inspecting inventory shows host selection but does not test access.\n\n**Mini-example:** save as `mini.yml`; run `ansible-inventory -i mini.yml --graph`. This reads inventory without connecting to hosts.\n\n```yaml\nall:\n  children:\n    lab:\n      hosts:\n        localhost:\n          ansible_connection: local\n```\n\n**Predict:** Which group will contain localhost? Will the command execute tasks on the host?\n\n> [!question]- Answer\n> Run 1; exit code 0. Stdout:\n>\n> ```text\n> @all:\n>   |--@ungrouped:\n>   |--@lab:\n>   |  |--localhost\n> ```\n\n`--graph` shows the group tree. It starts neither connections nor modules; the previous inventory for full experiments is retained below.\n\nA safe inventory for all local examples, file `inventory.ini`:\n\n```ini\n[lab]\nlocalhost ansible_connection=local ansible_python_interpreter=/usr/bin/python\n```\n\nA **pattern** in `hosts:` selects a set. `web:db` is union, `web:&production` intersection,\nand `web:!maintenance` exclusion. Quotes protect `!`/`&` from shell interpretation.\n`--limit` narrows the selected set further; it cannot add hosts absent from the play:\n\n```bash\nansible-inventory -i inventory.ini --graph\nansible-playbook -i inventory.ini ping.yml --limit localhost --list-hosts\n```\n\n*(verified)* For the local inventory, `--graph` returned:\n\n```text\n@all:\n  |--@ungrouped:\n  |--@lab:\n  |  |--localhost\n```\n\nInventory answers two different questions: **which nodes exist** and **how to connect to them**.\n`web1` is an inventory key. `ansible_host` is the connection address; they need not match.\nA group defines a set of hosts, not execution order.\n\nThe INI equivalent of a nested group is `[production:children]` with `web` below it.\nThe variables plugin loads `group_vars/` and `host_vars/` directories beside inventory/playbook:\n\n> [!info]- Deeper explanation\n> An alternative YAML inventory; this is **not a playbook** and contains no list of plays:\n>\n> **`inventory.yml` replaces `inventory.ini` rather than supplementing it:**\n>\n> ```yaml\n> all:\n>   children:\n>     lab:\n>       hosts:\n>         localhost:\n>           ansible_connection: local\n>           ansible_python_interpreter: /usr/bin/python\n>     web:\n>       hosts:\n>         web1:\n>           ansible_host: 192.0.2.11\n>         web2:\n>           ansible_host: 192.0.2.12\n>     production:\n>       children:\n>         web: {}\n> ```\n>\n> Addresses `192.0.2.*` are illustrative, not a runnable lab. `all` contains every host;\n> `ungrouped` contains hosts without user-defined groups. `children` includes child groups.\n> `{}` is an empty map: the group was defined above and is referenced here.\n>\n> ```mermaid\n> flowchart TB\n>     A[\"All hosts\"] --> P[\"Production environment\"]\n>     A --> L[\"Lab\"]\n>     P --> W[\"Web servers\"]\n>     W --> H1[\"web1: inventory name\"]\n>     W --> H2[\"web2: inventory name\"]\n>     H1 --> IP[\"SSH connection address\"]\n> ```\n>\n> ```text\n> inventory.ini\n> site.yml\n> group_vars/all.yml       # shared values\n> group_vars/web.yml       # web group values\n> host_vars/web1.yml       # values for a specific inventory name\n> ```\n>\n> for example `group_vars/web.yml` contains `app_port: 8080` and `host_vars/web1.yml` contains `app_port: 8081`.\n> These are YAML maps, without surrounding `vars:`. Parent group variables are weaker than child group variables; host variables override group variables.\n> Overlapping peer groups use name ordering by default; set `ansible_group_priority`\n> in inventory rather than `group_vars` to change loading order. Types in INI host lines and\n> INI `:vars` may differ; prefer YAML for booleans, lists and maps.\n> *(according to documentation)* [Inventory structure](https://docs.ansible.com/ansible/latest/inventory_guide/intro_inventory.html).\n>\n> Selecting `--limit web1` in the local inventory matches nothing; this is an inventory selection problem,\n> not SSH. The actual warning appears in §16.\n> *(according to documentation)* [Host patterns](https://docs.ansible.com/ansible/latest/inventory_guide/intro_patterns.html).\n>\n> A **dynamic inventory plugin** runs on the controller: it reads credentials, calls an API,\n> and creates inventory names, groups and variables. It does not install SSH or configure nodes.\n> Cloud resource tags may become groups; choose the address explicitly to avoid an unreachable public IP.\n>\n> | Source | Plugin and official page |\n> |---|---|\n> | AWS EC2 | [`amazon.aws.aws_ec2`](https://docs.ansible.com/ansible/latest/collections/amazon/aws/aws_ec2_inventory.html) |\n> | Proxmox | [`community.proxmox.proxmox`](https://docs.ansible.com/ansible/latest/collections/community/proxmox/proxmox_inventory.html) |\n> | Kubernetes | [`kubernetes.core.k8s`](https://docs.ansible.com/ansible/latest/collections/kubernetes/core/k8s_inventory.html) |\n>\n> An **inventory configuration** example, `lab.aws_ec2.yml`: its filename must meet the plugin requirements:\n>\n> ```yaml\n> plugin: amazon.aws.aws_ec2\n> regions:\n>   - eu-central-1\n> filters:\n>   tag:Environment: lab\n> keyed_groups:\n>   - key: tags.Role\n>     prefix: role\n> ```\n>\n> The collection, Python API library and API permissions are required on the controller. Kubernetes inventory discovers\n> objects and connections; it does not turn every Pod into a Linux VM. A Proxmox IP depends on API data,\n> the guest agent and `compose` settings; an existing VM does not prove SSH readiness.\n> All three dynamic inventory plugin examples are *(according to documentation)*;\n> synchronization with live APIs here is *(not verified)*.\n>\n> Question: **What is dynamic inventory, and what does `--limit` do?**\n>\n> > A dynamic inventory plugin gets hosts and groups from an API on the control node. It does not\n> > configure those hosts. The limit option selects a smaller set from the hosts already selected\n> > by the play.\n"
