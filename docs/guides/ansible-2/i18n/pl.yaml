heading: 2. Nazwy, grupy i wybór hosta (inventory)
text: "## 2. Nazwy, grupy i wybór hosta (inventory)\n\n**W skrócie**\n- Inventory zawiera listę nazw hostów\
  \ i grup.\nNazwa hosta - A może różnić się od jego adresu połączenia.\n- Inspekcja inventory pokazuje\
  \ wybór hosta, ale nie testuje dostępu.\n\n**Miniprzykład:** zapisz jako `mini.yml`; uruchom `ansible-inventory\
  \ -i mini.yml --graph`. Odczytuje inventory bez łączenia się z hostami.\n\n```yaml\nall:\n  children:\n\
  \    lab:\n      hosts:\n        localhost:\n          ansible_connection: local\n```\n\n**Przewiduj:**\
  \ Która grupa będzie zawierać localhost? Czy polecenie wykona zadania na hoście?\n\n> [!question] -\
  \ Odpowiedź\n> Uruchom 1; kod wyjścia 0. Standardowe wyjście:\n>\n> ```text\n> @all:\n>   |--@ungrouped:\n\
  >   |--@lab:\n>   |  |--localhost\n> ```\n\n`--graph` pokazuje drzewo grup. Nie uruchamia połączeń ani\
  \ modułów; poprzedni inventory dla pełnych eksperymentów znajduje się poniżej.\n\nBezpieczny inventory\
  \ dla lokalnych przykładów all, plik `inventory.ini`:\n\n```ini\n[lab]\nlocalhost ansible_connection=local\
  \ ansible_python_interpreter=/usr/bin/python\n```\n\n**wzór** w `hosts:` wybiera zestaw. `web:db` to\
  \ zjednoczenie, `web:&production` przecięcie,\ni wykluczenie `web:!maintenance`. Cytaty chronią `!`/`&`\
  \ przed interpretacją powłoki.\n`--limit` dodatkowo zawęża wybrany zestaw; nie może dodawać gospodarzy\
  \ nieobecnych w grze:\n\n```bash\nansible-inventory -i inventory.ini --graph\nansible-playbook -i inventory.ini\
  \ ping.yml --limit localhost --list-hosts\n```\n\n*(zweryfikowane)* Dla lokalnego inventory, `--graph`\
  \ zwróciło:\n\n```text\n@all:\n  |--@ungrouped:\n  |--@lab:\n  |  |--localhost\n```\n\nInventory odpowiada\
  \ na dwa różne pytania: **które węzły istnieją** i **jak się z nimi połączyć**.\n`web1` to klucz inventory.\
  \ `ansible_host` to adres połączenia; nie muszą pasować.\nGrupa definiuje zestaw hostów, a nie kolejność\
  \ wykonywania.\n\nOdpowiednikiem grupy zagnieżdżonej INI jest `[production:children]` z `web` poniżej.\n\
  Wtyczka zmiennych ładuje katalogi `group_vars/` i `host_vars/` obok inventory/playbook:\n\n> [!info]\
  \ - Głębsze wyjaśnienie\n> Alternatywa YAML inventory; to jest **nie playbook** i nie zawiera listy\
  \ odtworzeń:\n>\n> **`inventory.yml` zastępuje `inventory.ini`, zamiast go uzupełniać:**\n>\n> ```yaml\n\
  > all:\n>   children:\n>     lab:\n>       hosts:\n>         localhost:\n>           ansible_connection:\
  \ local\n>           ansible_python_interpreter: /usr/bin/python\n>     web:\n>       hosts:\n>    \
  \     web1:\n>           ansible_host: 192.0.2.11\n>         web2:\n>           ansible_host: 192.0.2.12\n\
  >     production:\n>       children:\n>         web: {}\n> ```\n>\n> Adresy `192.0.2.*` mają charakter\
  \ poglądowy, a nie możliwy do uruchomienia lab. `all` zawiera każdego hosta;\n> `ungrouped` zawiera\
  \ hosty bez grup zdefiniowanych przez użytkownika. `children` zawiera grupy podrzędne.\n> `{}` to pusta\
  \ mapa: grupa została zdefiniowana powyżej i jest tutaj wymieniona.\n>\n> ```mermaid\n> flowchart TB\n\
  >     A[\"All hosts\"] --> P[\"Production environment\"]\n>     A --> L[\"Lab\"]\n>     P --> W[\"Web\
  \ servers\"]\n>     W --> H1[\"web1: inventory name\"]\n>     W --> H2[\"web2: inventory name\"]\n>\
  \     H1 --> IP[\"SSH connection address\"]\n> ```\n>\n> ```text\n> inventory.ini\n> site.yml\n> group_vars/all.yml\
  \       # shared values\n> group_vars/web.yml       # web group values\n> host_vars/web1.yml       #\
  \ values for a specific inventory name\n> ```\n>\n> na przykład `group_vars/web.yml` zawiera `app_port:\
  \ 8080`, a `host_vars/web1.yml` zawiera `app_port: 8081`.\n> To są mapy YAML, bez otaczającego `vars:`.\
  \ Zmienne grupy nadrzędnej są słabsze niż zmienne grupy podrzędnej; zmienne hosta zastępują zmienne\
  \ grupowe.\n> Nakładające się grupy równorzędne domyślnie korzystają z kolejności nazw; zestaw `ansible_group_priority`\n\
  > w inventory zamiast `group_vars`, aby zmienić kolejność ładowania. Wpisuje linie hosta INI i\n> INI\
  \ `:vars` może się różnić; preferuj YAML dla wartości logicznych, list i map.\n> *(wg dokumentacji)*\
  \ [Inventory konstrukcja](https://docs.ansible.com/ansible/latest/inventory_guide/intro_inventory.html).\n\
  >\n> Wybranie `--limit web1` w lokalnym inventory nie pasuje do niczego; jest to problem z wyborem inventory,\n\
  > nie SSH. Rzeczywiste ostrzeżenie pojawia się w §16.\n> *(zgodnie z dokumentacją)* [Wzorce hosta](https://docs.ansible.com/ansible/latest/inventory_guide/intro_patterns.html).\n\
  >\n> Na kontrolerze działa **dynamiczna wtyczka inventory**: odczytuje dane uwierzytelniające, wywołuje\
  \ API,\n> i tworzy nazwy, grupy i zmienne inventory. Nie instaluje SSH ani nie konfiguruje węzłów.\n\
  > Tagi zasobów chmury mogą stać się grupami; wybierz adres jawnie, aby uniknąć nieosiągalnego publicznego\
  \ IP.\n>\n> | Źródło | Wtyczka i oficjalna strona |\n> |---|---|\n> | AWS EC2 | [`amazon.aws.aws_ec2`](https://docs.ansible.com/ansible/latest/collections/amazon/aws/aws_ec2_inventory.html)\
  \ |\n> | Proxmox | [`community.proxmox.proxmox`](https://docs.ansible.com/ansible/latest/collections/community/proxmox/proxmox_inventory.html)\
  \ |\n> | Kubernetes | [`kubernetes.core.k8s`](https://docs.ansible.com/ansible/latest/collections/kubernetes/core/k8s_inventory.html)\
  \ |\n>\n> Przykład konfiguracji **inventory**, `lab.aws_ec2.yml`: nazwa pliku musi spełniać wymagania\
  \ wtyczki:\n>\n> ```yaml\n> plugin: amazon.aws.aws_ec2\n> regions:\n>   - eu-central-1\n> filters:\n\
  >   tag:Environment: lab\n> keyed_groups:\n>   - key: tags.Role\n>     prefix: role\n> ```\n>\n> Na\
  \ kontrolerze wymagana jest kolekcja, biblioteka Python API i uprawnienia API. Kubernetes inventory\
  \ odkrywa\n> obiekty i powiązania; nie zamienia każdego Pod w Linux VM. Proxmox IP zależy od danych\
  \ API,\n> ustawienia agenta gościa i `compose`; istniejący VM nie potwierdza gotowości SSH.\n> Wszystkie\
  \ trzy dynamiczne przykłady wtyczek inventory to *(zgodnie z dokumentacją)*;\n> synchronizacja z żywym\
  \ APIs tutaj jest *(niezweryfikowana)*.\n>\n> Pytanie: **What is dynamic inventory, and what does `--limit`\
  \ zrobić?**\n>\n> > A dynamic inventory plugin gets hosts and groups from an API on the control node.\
  \ It does not\n> > configure those hosts. The limit option selects a smaller set from the hosts already\
  \ selected\n> > by the play."
