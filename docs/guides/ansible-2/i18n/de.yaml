heading: 2. Namen, Gruppen und Hostauswahl (inventory)
text: "## 2. Namen, Gruppen und Hostauswahl (inventory)\n\n**Auf einen Blick**\n- Inventory listet Host-\
  \ und Gruppennamen auf.\nDer Name des - A-Hosts kann von seiner Verbindungsadresse abweichen.\n- Inspecting\
  \ inventory zeigt die Hostauswahl, testet jedoch nicht den Zugriff.\n\n**Mini-Beispiel:** speichern\
  \ als `mini.yml`; Führen Sie `ansible-inventory -i mini.yml --graph` aus. Dies lautet inventory ohne\
  \ Verbindung zu hosts.\n\n```yaml\nall:\n  children:\n    lab:\n      hosts:\n        localhost:\n \
  \         ansible_connection: local\n```\n\n**Vorhersage:** Welche Gruppe wird localhost enthalten?\
  \ Führt der Befehl Aufgaben auf dem Host aus?\n\n> [!question]- Antwort\n> Run 1; Exit-Code 0. Stdout:\n\
  >\n> ```text\n> @all:\n>   |--@ungrouped:\n>   |--@lab:\n>   |  |--localhost\n> ```\n\n`--graph` zeigt\
  \ den Gruppenbaum. Es werden weder Verbindungen noch Module gestartet; Der bisherige inventory für vollständige\
  \ Experimente wird unten beibehalten.\n\nEin sicheres inventory für alle local-Beispiele, Datei `inventory.ini`:\n\
  \n```ini\n[lab]\nlocalhost ansible_connection=local ansible_python_interpreter=/usr/bin/python\n```\n\
  \nEin **Muster** in `hosts:` wählt einen Satz aus. `web:db` ist Vereinigung, `web:&production` Schnittpunkt,\n\
  und `web:!maintenance`-Ausschluss. Anführungszeichen schützen `!`/`&` vor Shell-Interpretation.\n`--limit`\
  \ schränkt den ausgewählten Satz weiter ein; Es kann kein hosts hinzugefügt werden, das nicht im play\
  \ enthalten ist:\n\n```bash\nansible-inventory -i inventory.ini --graph\nansible-playbook -i inventory.ini\
  \ ping.yml --limit localhost --list-hosts\n```\n\n*(verifiziert)* Für local inventory, `--graph` wurde\
  \ Folgendes zurückgegeben:\n\n```text\n@all:\n  |--@ungrouped:\n  |--@lab:\n  |  |--localhost\n```\n\
  \nInventory beantwortet zwei verschiedene Fragen: **welche Knoten existieren** und **wie man eine Verbindung\
  \ zu ihnen herstellt**.\n`web1` ist ein inventory key. `ansible_host` ist die Verbindungsadresse; sie\
  \ müssen nicht übereinstimmen.\nEine Gruppe definiert einen Satz von hosts, nicht die Ausführungsreihenfolge.\n\
  \nDas INI-Äquivalent einer verschachtelten Gruppe ist `[production:children]` mit `web` darunter.\n\
  Die Variablen plugin laden die Verzeichnisse `group_vars/` und `host_vars/` neben inventory/playbook:\n\
  \n> [!info]- Ausführlichere Erklärung\n> An alternative YAML inventory; Dies ist **kein playbook** und\
  \ enthält keine Liste von Spielen:\n>\n> **`inventory.yml` ersetzt `inventory.ini`, anstatt es zu ergänzen:**\n\
  >\n> ```yaml\n> all:\n>   children:\n>     lab:\n>       hosts:\n>         localhost:\n>           ansible_connection:\
  \ local\n>           ansible_python_interpreter: /usr/bin/python\n>     web:\n>       hosts:\n>    \
  \     web1:\n>           ansible_host: 192.0.2.11\n>         web2:\n>           ansible_host: 192.0.2.12\n\
  >     production:\n>       children:\n>         web: {}\n> ```\n>\n> Addresses `192.0.2.*` dienen der\
  \ Veranschaulichung und sind kein lauffähiger lab. `all` enthält jeden Host;\n> `ungrouped` enthält\
  \ hosts ohne benutzerdefinierte Gruppen. `children` umfasst untergeordnete Gruppen.\n> `{}` ist eine\
  \ leere Karte: Die Gruppe wurde oben definiert und wird hier referenziert.\n>\n> ```mermaid\n> flowchart\
  \ TB\n>     A[\"All hosts\"] --> P[\"Production environment\"]\n>     A --> L[\"Lab\"]\n>     P -->\
  \ W[\"Web servers\"]\n>     W --> H1[\"web1: inventory name\"]\n>     W --> H2[\"web2: inventory name\"\
  ]\n>     H1 --> IP[\"SSH connection address\"]\n> ```\n>\n> ```text\n> inventory.ini\n> site.yml\n>\
  \ group_vars/all.yml       # shared values\n> group_vars/web.yml       # web group values\n> host_vars/web1.yml\
  \       # values for a specific inventory name\n> ```\n>\n> zum Beispiel enthält `group_vars/web.yml`\
  \ `app_port: 8080` und `host_vars/web1.yml` enthält `app_port: 8081`.\n> Dies sind YAML-Karten ohne\
  \ umgebendes `vars:`. Variablen der übergeordneten Gruppe sind schwächer als Variablen der untergeordneten\
  \ Gruppe. Hostvariablen überschreiben Gruppenvariablen.\n> Überlappende Peer-Gruppen verwenden standardmäßig\
  \ die Namensreihenfolge; Satz `ansible_group_priority`\n> in inventory anstelle von `group_vars`, um\
  \ die Ladereihenfolge zu ändern. Typen in INI-Hostzeilen und\n> INI `:vars` kann abweichen; bevorzugen\
  \ Sie YAML für boolesche Werte, Listen und Karten.\n> *(laut Dokumentation)* [Inventory Struktur](https://docs.ansible.com/ansible/latest/inventory_guide/intro_inventory.html).\n\
  >\n> Auswahl von `--limit web1` im local inventory ergibt keine Übereinstimmung; Dies ist ein inventory-Auswahlproblem.\n\
  > nicht SSH. Die eigentliche Warnung erscheint in §16.\n> *(laut Dokumentation)* [Hostmuster](https://docs.ansible.com/ansible/latest/inventory_guide/intro_patterns.html).\n\
  >\n> A **dynamic inventory plugin** läuft auf dem Controller: Es liest Anmeldeinformationen, ruft einen\
  \ API auf,\n> und erstellt inventory Namen, Gruppen und Variablen. Es werden weder SSH installiert noch\
  \ Knoten konfiguriert.\n> Cloud-Ressourcen-Tags können zu Gruppen werden; Wählen Sie die Adresse explizit\
  \ aus, um eine nicht erreichbare öffentliche Adresse IP zu vermeiden.\n>\n> | Quelle | Plugin und offizielle\
  \ Seite |\n> |---|---|\n> | AWS EC2 | [`amazon.aws.aws_ec2`](https://docs.ansible.com/ansible/latest/collections/amazon/aws/aws_ec2_inventory.html)\
  \ |\n> | Proxmox | [`community.proxmox.proxmox`](https://docs.ansible.com/ansible/latest/collections/community/proxmox/proxmox_inventory.html)\
  \ |\n> | Kubernetes | [`kubernetes.core.k8s`](https://docs.ansible.com/ansible/latest/collections/kubernetes/core/k8s_inventory.html)\
  \ |\n>\nBeispiel > An **inventory-Konfiguration**, `lab.aws_ec2.yml`: Der Dateiname muss die plugin-Anforderungen\
  \ erfüllen:\n>\n> ```yaml\n> plugin: amazon.aws.aws_ec2\n> regions:\n>   - eu-central-1\n> filters:\n\
  >   tag:Environment: lab\n> keyed_groups:\n>   - key: tags.Role\n>     prefix: role\n> ```\n>\n> Die\
  \ Sammlung, die Python API-Bibliothek und die API-Berechtigungen sind auf dem Controller erforderlich.\
  \ Kubernetes inventory entdeckt\n> Objekte und Verbindungen; Es verwandelt nicht jeden Pod in eine Linux-VM.\
  \ Ein Proxmox IP hängt von API-Daten ab.\n> der Gastagent und `compose`-Einstellungen; Eine vorhandene\
  \ VM beweist nicht die SSH-Bereitschaft.\n> Alle drei dynamic inventory plugin Beispiele sind *(laut\
  \ Dokumentation)*;\n> synchronisation mit Live-APIs ist hier *(nicht verifiziert)*.\n>\n> Frage: **What\
  \ ist dynamic inventory und what tut `--limit`?**\n>\n> > A dynamic inventory plugin ruft hosts und\
  \ Gruppen von einem API auf dem Steuerknoten ab. Das ist nicht der Fall\n> > konfigurieren Sie diese\
  \ hosts. Die Option limit wählt einen kleineren Satz aus dem bereits ausgewählten hosts aus\n> > von\
  \ play."
