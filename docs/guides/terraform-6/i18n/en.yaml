heading: 6. Lifecycle, replacement and provisioning commands [lifecycle]
text: "## 6. Lifecycle, replacement and provisioning commands [lifecycle]\n\n**At a glance**\n- The lifecycle describes operation rules.\n- Changing a field may update or replace an object.\n- Read the plan actions first.\n\n**Mini-example:** Save as `main.tf` in a new temporary directory. The preparation and command sequence are listed immediately below the code block.\n\n```hcl\nvariable \"release\" { default = \"v1\" }\nresource \"terraform_data\" \"app\" {\n  input = var.release\n}\noutput \"release\" {\n  value = terraform_data.app.output\n}\n```\n\nSequence: `tofu init` → `tofu apply -auto-approve` with the default → `tofu plan -input=false -no-color -var=release=v2`. Run all commands in the same new temporary directory.\n\n**Predict:** What will the run show, and what will its exit code be?\n\n> [!question]- Answer\n> Actual excerpt from the last command:\n>\n> ```text\n>   # terraform_data.app will be updated in-place\n> Plan: 0 to add, 1 to change, 0 to destroy.\n> Outputs:\n> ~ release = \"v1\" -> (known after apply)\n> ```\n>\n> Exit code: 0.\n\nPreparation applies v1. The plan with v2 updates input in place: this example has no replacement rule.\n\nThe provider determines which fields update in place and which require replacement. Plan symbols: `~` update, `-/+` destroy then create, `+/-` create then destroy, `+` and `-` create and destroy. Changing a name, image or type may require replacement; that depends on resource/provider version, not just the engine.\n\nEach example below is an independent root with one `main.tf`. Built-in `terraform_data` makes no cloud calls. Initial-draft checks used OpenTofu 1.12.6; new exercises with separate configurations appear at the end.\n\n### Replacement and `create_before_destroy`\n\n**At a glance**\n- Replacement involves both creation and deletion.\n- create_before_destroy changes their order.\n- The platform must allow both copies to exist at once.\n\n**Mini-example:** Save as `main.tf` in a new temporary directory. The preparation and command sequence are listed immediately below the code block.\n\n```hcl\nvariable \"release\" { default = \"v1\" }\nresource \"terraform_data\" \"app\" {\n  input = var.release\n  triggers_replace = [var.release]\n  lifecycle { create_before_destroy = true }\n}\n```\n\nSequence: `tofu init` → `tofu apply -auto-approve` with the default → `tofu plan -input=false -no-color -var=release=v2`. Run all commands in the same new temporary directory.\n\n**Predict:** What will the run show, and what will its exit code be?\n\n> [!question]- Answer\n> Actual excerpt from the last command:\n>\n> ```text\n>   # terraform_data.app must be replaced\n> Plan: 1 to add, 0 to change, 1 to destroy.\n> ```\n>\n> Exit code: 0.\n\nAfter applying v1, a new plan changes release to v2. triggers_replace requires replacement; lifecycle determines whether and in what order that replacement is allowed.\n\n> [!info]- Deeper explanation\n> `triggers_replace` requests replacement when a release changes. First apply `v1`, then plan `v2`:\n>\n> **`main.tf` in a new empty directory:**\n>\n> ```hcl\n> terraform {\n>   required_version = \">= 1.5.0\"\n> }\n>\n> variable \"release\" {\n>   type    = string\n>   default = \"v1\"\n> }\n>\n> resource \"terraform_data\" \"app\" {\n>   input           = var.release\n>   triggers_replace = [var.release]\n>\n>   lifecycle {\n>     create_before_destroy = true\n>   }\n> }\n> ```\n>\n> The plan showed `+/-` and `Plan: 1 to add, 0 to change, 1 to destroy`. The new instance is created before the old one is destroyed. The real platform must permit both simultaneously: names may need to differ, for example. Separately, `tofu plan -replace=terraform_data.app` requests one-time replacement of a specific address. *(verified: OpenTofu 1.12.6, `init`, `validate`, initial apply and replacement plan)*.\n\n### `prevent_destroy`: protection exists while the rule exists\n\n**At a glance**\n- prevent_destroy blocks a deletion plan while the rule is in effect.\n- Replacement also includes deletion.\n- A block removed from the configuration can no longer protect the object.\n\n**Mini-example:** Save as `main.tf` in a new temporary directory. The preparation and command sequence are listed immediately below the code block.\n\n```hcl\nvariable \"release\" { default = \"v1\" }\nresource \"terraform_data\" \"app\" {\n  input = var.release\n  triggers_replace = [var.release]\n  lifecycle { prevent_destroy = true }\n}\n```\n\nSequence: `tofu init` → `tofu apply -auto-approve` with the default → `tofu plan -input=false -no-color -var=release=v2`. Run all commands in the same new temporary directory.\n\n**Predict:** What will the run show, and what will its exit code be?\n\n> [!question]- Answer\n> Actual excerpt from the last command:\n>\n> ```text\n>   # terraform_data.app must be replaced\n> Plan: 1 to add, 0 to change, 1 to destroy.\n> Error: Resource instance cannot be destroyed\n> ```\n>\n> Exit code: 1.\n\nAfter applying v1, a new plan changes release to v2. triggers_replace requires replacement; lifecycle determines whether and in what order that replacement is allowed.\n\n> [!info]- Deeper explanation\n> **`main.tf` in a new empty directory:**\n>\n> ```hcl\n> terraform {\n>   required_version = \">= 1.5.0\"\n> }\n>\n> variable \"release\" {\n>   type    = string\n>   default = \"v1\"\n> }\n>\n> resource \"terraform_data\" \"database\" {\n>   input           = \"keep\"\n>   triggers_replace = [var.release]\n>\n>   lifecycle {\n>     prevent_destroy = true\n>   }\n> }\n> ```\n>\n> After the initial apply, `tofu plan -var=release=v2` stopped with `Error: Resource instance cannot be destroyed` and `Resource instance terraform_data.database has prevent_destroy set, but the plan calls for it to be destroyed.` Removing the whole resource block also removes the rule. OpenTofu 1.12 permits a dynamic expression for this argument; check compatibility with your Terraform version separately. *(verified: OpenTofu 1.12.6, replacement rejected)*.\n\n### `ignore_changes`: another owner updates the field\n\n**At a glance**\n- ignore_changes excludes a field from the update calculation.\n- This hands responsibility for updating the field to someone else.\n- The rule does not guarantee that a missing object will be preserved.\n\n**Mini-example:** Save as `main.tf` in a new temporary directory. The preparation and command sequence are listed immediately below the code block.\n\n```hcl\nvariable \"release\" { default = \"v1\" }\nresource \"terraform_data\" \"app\" {\n  input = var.release\n  lifecycle {\n    ignore_changes = [input]\n  }\n}\n```\n\nSequence: `tofu init` → `tofu apply -auto-approve` with the default → `tofu plan -input=false -no-color -var=release=v2`. Run all commands in the same new temporary directory.\n\n**Predict:** What will the run show, and what will its exit code be?\n\n> [!question]- Answer\n> Actual excerpt from the last command:\n>\n> ```text\n> No changes. Your infrastructure matches the configuration.\n> ```\n>\n> Exit code: 0.\n\nThe first apply stores v1. Changing only input to v2 afterward does not trigger an update.\n\n> [!info]- Deeper explanation\n> First apply `input = \"v1\"`, then change it to `v2`:\n>\n> **`main.tf` in a new empty directory: first apply `input = \"v1\"`, then change it to `\"v2\"`; the second form is shown below:**\n>\n> ```hcl\n> terraform {\n>   required_version = \">= 1.5.0\"\n> }\n>\n> resource \"terraform_data\" \"app\" {\n>   input = \"v2\"\n>\n>   lifecycle {\n>     ignore_changes = [input]\n>   }\n> }\n> ```\n>\n> Plan: `No changes. Your infrastructure matches the configuration.` This demonstrates ignoring an existing field change, not a guarantee of hiding every external change. `ignore_changes = all` can mask errors; use the rule only with a deliberate external field owner. *(verified: OpenTofu 1.12.6)*.\n\n### Ordering with `depends_on`\n\n**At a glance**\n- A reference usually declares a dependency automatically.\n- depends_on makes a hidden dependency explicit.\n- It sets the order; it does not check application health.\n\n**Mini-example:** save this as `main.tf` in a new temporary directory. After preparing the files, run `tofu init`, `tofu validate`, then `tofu apply -auto-approve -input=false -no-color`.\n\n```hcl\nresource \"terraform_data\" \"prepare\" {\n  input = \"ready\"\n}\nresource \"terraform_data\" \"deploy\" {\n  input = \"app\"\n  depends_on = [terraform_data.prepare]\n}\n```\n\n**Predict:** What will the run show, and what will its exit code be?\n\n> [!question]- Answer\n> Actual excerpt from the last command:\n>\n> ```text\n>   # terraform_data.deploy will be created\n>   # terraform_data.prepare will be created\n> Plan: 2 to add, 0 to change, 0 to destroy.\n> Apply complete! Resources: 2 added, 0 changed, 0 destroyed.\n> ```\n>\n> Exit code: 0.\n\nCreation of deploy waits for prepare, even though input does not read its value. This example has no HTTP check.\n\n> [!info]- Deeper explanation\n> A value reference already establishes a dependency. Explicit `depends_on` is needed when a real dependency exists without a value to pass:\n>\n> **`main.tf` in a new empty directory:**\n>\n> ```hcl\n> terraform {\n>   required_version = \">= 1.5.0\"\n> }\n>\n> resource \"terraform_data\" \"prepare\" {\n>   input = \"prepare first\"\n> }\n>\n> resource \"terraform_data\" \"deploy\" {\n>   input      = \"deploy second\"\n>   depends_on = [terraform_data.prepare]\n> }\n> ```\n>\n> During apply, `prepare` completed before `deploy` started. The argument sets ordering and conservative planning, not replacement. An inverse dependency may create a cycle; recorded drill text: `Error: Cycle: terraform_data.b, terraform_data.a, terraform_data.c`. *(verified: OpenTofu 1.12.6; cycle — [[Terraform-Coding-Drills-Solutions]])*.\n\n### Conditions before and after an operation\n\n**At a glance**\n- precondition checks a required condition.\n- postcondition checks the result of an operation.\n- A failed required condition produces an error.\n\n**Mini-example:** Save as `main.tf` in a new temporary directory. After preparing the files, run `tofu init`, `tofu validate`, then `tofu plan -input=false -no-color -var=port=0`.\n\n```hcl\nvariable \"port\" { default = 8080 }\nresource \"terraform_data\" \"app\" {\n  input = var.port\n  lifecycle {\n    precondition {\n      condition = var.port > 0\n      error_message = \"port must be positive.\"\n    }\n  }\n}\n```\n\n**Predict:** What will the run show, and what will its exit code be?\n\n> [!question]- Answer\n> Actual excerpt from the last command:\n>\n> ```text\n> Error: Resource precondition failed\n> ```\n>\n> Exit code: 1.\n\nZero was supplied; the precondition stops the resource plan before apply.\n\n> [!info]- Deeper explanation\n> `precondition` checks a prerequisite; `postcondition` checks the provider result. In the latter, `self` refers to the current instance:\n>\n> **`main.tf` in a new empty directory:**\n>\n> ```hcl\n> terraform {\n>   required_version = \">= 1.5.0\"\n> }\n>\n> variable \"port\" {\n>   type    = number\n>   default = 8080\n> }\n>\n> resource \"terraform_data\" \"service\" {\n>   input = { port = var.port }\n>\n>   lifecycle {\n>     precondition {\n>       condition     = var.port > 0\n>       error_message = \"port must be greater than 0\"\n>     }\n>     postcondition {\n>       condition     = self.output.port <= 65535\n>       error_message = \"provider returned an invalid port\"\n>     }\n>   }\n> }\n> ```\n>\n> With the default port, plan and apply passed. `tofu plan -var=port=0` returned `Error: Resource precondition failed` before the operation. `tofu apply -var=port=70000` updated the local resource, then returned `Error: Resource postcondition failed` and `provider returned an invalid port`. A prerequisite unknown before apply can be checked later. An `output` has a direct `precondition` without a `lifecycle` wrapper and no `postcondition`. *(verified: OpenTofu 1.12.6)*.\n> *(according to documentation)*. [Lifecycle](https://developer.hashicorp.com/terraform/language/meta-arguments/lifecycle) · [Custom conditions](https://developer.hashicorp.com/terraform/language/expressions/custom-conditions).\n\n### check.assert: diagnose rather than prohibit an operation\n\n**At a glance**\n- check tests an expectation about the system.\n- A false assertion in check produces a warning.\n- A blocking mechanism is needed for a mandatory prohibition.\n\n**Mini-example:** Save as `main.tf` in a new temporary directory. After preparing the files, run `tofu init`, `tofu validate`, then `tofu plan -input=false -no-color`.\n\n```hcl\nvariable \"replicas\" { default = 2 }\ncheck \"capacity\" {\n  assert {\n    condition = var.replicas >= 3\n    error_message = \"Need three replicas.\"\n  }\n}\n```\n\n**Predict:** What will the run show, and what will its exit code be?\n\n> [!question]- Answer\n> Actual excerpt from the last command:\n>\n> ```text\n> No changes. Your infrastructure matches the configuration.\n> Warning: Check block assertion failed\n> ```\n>\n> Exit code: 0.\n\nTwo is less than three: a warning appears, but plan still exits with code zero.\n\n> [!info]- Deeper explanation\n> `validation` defines a variable's valid input; a known invalid input blocks the plan.\n> `precondition` specifies a resource/output prerequisite and also blocks an operation when false.\n> `check` is a separate block with one or more `assert` entries: false produces a warning.\n> It does not replace mandatory protection before creating an expensive or dangerous resource.\n>\n> Standalone `main.tf`, without resources, providers or backend:\n>\n> ```hcl\n> variable \"replicas\" {\n>   type    = number\n>   default = 2\n> }\n> check \"spare_capacity\" {\n>   assert {\n>     condition     = var.replicas >= 3\n>     error_message = \"Less than three replicas: inspect capacity.\"\n>   }\n> }\n> ```\n>\n> Run `tofu init -backend=false`, `tofu validate`, then `tofu plan -input=false`.\n> With default=2, the plan returns 0 with `Warning: Check block assertion failed`.\n> With `-var=replicas=4`, there is no warning. *(verified: validate/plan only)*.\n> No apply is needed or was performed in this experiment.\n>\n> | Mechanism | false for a known value | Purpose |\n> |---|---|---|\n> | validation | Error | Permitted input |\n> | precondition | Error | Required operation prerequisite |\n> | check.assert | Warning | Health/expectation checking |\n>\n> An unknown value may defer checking until its value is available during apply.\n> This is an evaluation property, not a guarantee of early rejection for every expression.\n> A check can have a nested data source; this example has none and uses no network.\n> Failure of such a data source inside check also has special diagnostic semantics.\n> For a mandatory constraint, choose validation/precondition instead of warning severity.\n> [OpenTofu: checks](https://opentofu.org/docs/language/checks/) — verified 20.10.2026.\n\n### Replacement triggered by another resource\n\n**At a glance**\n- replace_triggered_by links a replacement to another resource.\nA change to the source triggers the rule on the dependent resource.\n- An ordinary variable can be passed through terraform_data.\n\n**Mini-example:** Save as `main.tf` in a new temporary directory. The preparation and command sequence are listed immediately below the code block.\n\n```hcl\nvariable \"release\" { default = \"v1\" }\nresource \"terraform_data\" \"version\" { input = var.release }\nresource \"terraform_data\" \"app\" {\n  input = \"app\"\n  lifecycle {\n    replace_triggered_by = [terraform_data.version]\n  }\n}\n```\n\nSequence: `tofu init` → `tofu apply -auto-approve` with the default → `tofu plan -input=false -no-color -var=release=v2`. Run all commands in the same new temporary directory.\n\n**Predict:** What will the run show, and what will its exit code be?\n\n> [!question]- Answer\n> Actual excerpt from the last command:\n>\n> ```text\n>   # terraform_data.app will be replaced due to changes in replace_triggered_by\n>   # terraform_data.version will be updated in-place\n> Plan: 1 to add, 1 to change, 1 to destroy.\n> ```\n>\n> Exit code: 0.\n\nversion is updated; app is replaced by the rule. The app's own input string remains unchanged.\n\n> [!info]- Deeper explanation\n> `replace_triggered_by` reacts to changes in a managed resource or its attribute. An ordinary variable has no lifecycle, so it can be wrapped in `terraform_data`:\n>\n> **`main.tf` in a new empty directory:**\n>\n> ```hcl\n> variable \"release\" {\n>   type    = string\n>   default = \"1.0\"\n> }\n>\n> resource \"terraform_data\" \"release\" {\n>   input = var.release\n> }\n>\n> resource \"terraform_data\" \"deployment\" {\n>   input = \"deploy\"\n>\n>   lifecycle {\n>     replace_triggered_by = [terraform_data.release]\n>   }\n> }\n> ```\n>\n> Changing `release` updates the first resource and replaces the second. Verified text: `terraform_data.deployment will be replaced due to changes in replace_triggered_by`. By contrast, `depends_on` sets ordering; `-replace=ADDRESS` requests one-time replacement. A saved plan already contains selected actions; extra planning flags cannot change it. *(verified: OpenTofu 1.12.6, plan after release change)*.\n\n### Provisioners: the last resort\n\n**At a glance**\n- local-exec runs a command on the OpenTofu machine.\n- The command can fail after creation has started.\n- This is not a full replacement for a separate configuration-management tool.\n\n**Mini-example:** save this as `main.tf` in a new temporary directory. After preparing the files, run `tofu init`, `tofu validate`, then `tofu apply -auto-approve -input=false -no-color`.\n\n```hcl\nresource \"terraform_data\" \"failure\" {\n  input = \"demo\"\n  provisioner \"local-exec\" {\n    command = \"exit 7\"\n  }\n}\n```\n\n**Predict:** What will the run show, and what will its exit code be?\n\n> [!question]- Answer\n> Actual excerpt from the last command:\n>\n> ```text\n>   # terraform_data.failure will be created\n> Plan: 1 to add, 0 to change, 0 to destroy.\n> Error: local-exec provisioner error\n> ```\n>\n> Exit code: 1.\n\nThe demo command returns 7; apply reports a provisioner error and returns its own nonzero code. No external systems are affected.\n\n> [!info]- Deeper explanation\n> `local-exec` runs on the workstation or runner; `remote-exec` runs on the remote object through `connection`. In `${self.id}`, `self` denotes the current instance. The engine does not model every command side effect and cannot reliably retry partially completed work. With `create_before_destroy = true`, destroy-time provisioners do not run. Prefer an image, cloud-init or Ansible for machines.\n>\n> A complete example with an intentional failure:\n>\n> **`main.tf` in a new empty directory:**\n>\n> ```hcl\n> terraform {\n>   required_version = \">= 1.5.0\"\n> }\n>\n> resource \"terraform_data\" \"hook\" {\n>   input = \"created first\"\n>\n>   provisioner \"local-exec\" {\n>     command = \"echo 'created ${self.id}' && exit 1\"\n>   }\n> }\n> ```\n>\n> After `init` and `validate`, apply failed with `Error: local-exec provisioner error` and `exit status 1`. The resource had already been created; `tofu state show terraform_data.hook` showed `(tainted)`. Remove `&& exit 1` to let the command succeed. Connection, timeout and partial-configuration errors depend on the host and shell; there is no universal message. *(verified: OpenTofu 1.12.6, exercise directory only)*.\n> *(according to documentation)*. [Provisioners](https://developer.hashicorp.com/terraform/language/resources/provisioners/syntax) · [Check blocks](https://developer.hashicorp.com/terraform/language/block/check).\n>\n> ```mermaid\n> flowchart TB\n>     U[\"Argument<br/>changed\"] --> Q[\"Provider and<br/>lifecycle<br/>determine<br/>the action\"]\n>     Q --> I[\"In-place<br/>update:<br/>modify<br/>the existing<br/>object\"]\n>     Q --> R[\"Default<br/>replacement:<br/>delete<br/>old →<br/>create<br/>new\"]\n>     Q --> C[\"create_before_destroy:<br/>create<br/>new →<br/>delete<br/>old\"]\n> ```\n\n### Predict the action before inspecting the symbol\n\n**At a glance**\n- A plan distinguishes an update from a replacement.\n- The number of operations and their order are different properties.\n- A lifecycle restriction applies only in its own configuration.\n\nA separate root for updating `input`:\n\n**`main.tf` in a new empty directory:**\n\n```hcl\nvariable \"release\" {\n  type    = string\n  default = \"v1\"\n}\nresource \"terraform_data\" \"app\" {\n  input = var.release\n}\n```\n\nAfter `init` and the first `apply`, run `tofu plan -var=release=v2`.\n\n**Predict:** there is no `triggers_replace`. How will the plan change `terraform_data.app`?\n> [!question]- Answer\n> ```text\n>   # terraform_data.app will be updated in-place\n> Plan: 0 to add, 1 to change, 0 to destroy.\n> ```\n> This built-in resource permits updating `input`; changing an argument does not by itself imply replacement.\n\nIn two other directories, add `triggers_replace = [var.release]` to the same resource. Keep default order in one and add `lifecycle { create_before_destroy = true }` in the other. Apply both with `v1` first.\n\n**Predict:** for `release=v2`, does `create_before_destroy` change the action count or their order?\n> [!question]- Answer\n> ```text\n> -/+ destroy and then create replacement\n>   # terraform_data.app must be replaced\n> -/+ resource \"terraform_data\" \"app\" {\n> Plan: 1 to add, 0 to change, 1 to destroy.\n>\n> +/- create replacement and then destroy\n>   # terraform_data.app must be replaced\n> +/- resource \"terraform_data\" \"app\" {\n> Plan: 1 to add, 0 to change, 1 to destroy.\n> ```\n> The action count is identical, but the order reverses: destroy/create versus create/destroy.\n\n\n**Removing the block removes protection.** In a new root, first apply:\n\n**`main.tf` in a new empty directory:**\n\n```hcl\nvariable \"release\" {\n  type    = string\n  default = \"v1\"\n}\nresource \"terraform_data\" \"app\" {\n  input            = var.release\n  triggers_replace = [var.release]\n  lifecycle { prevent_destroy = true }\n}\n```\n\n\n**Predict:** remove the entire `resource` and variable from the file. Will the former `prevent_destroy` still apply?\n> [!question]- Answer\n> ```text\n>   # terraform_data.app will be destroyed\n> Plan: 0 to add, 0 to change, 1 to destroy.\n> ```\n> The rule lives in resource configuration, not as permanent state protection. Once the block is removed, the engine no longer reads it.\n\n**Manual drift and `ignore_changes`.** In a separate experiment, apply the complete `local_file` from §3, then replace `demo.txt` content with `manual drift` without changing code.\n\n**Predict:** will `ignore_changes = [content]` hide this manual file edit?\n> [!question]- Answer\n> ```text\n>   # local_file.this will be created\n> Plan: 1 to add, 0 to change, 0 to destroy.\n> ```\n> Provider `local` checks the content checksum and reports the previous object as missing. `ignore_changes` does not prevent creation of a missing object; that differs from updating an existing field.\n\n*(verified: OpenTofu 1.12.6, `local` 2.9.1; update, both replacements, protection removal with configuration, and manual drift)*.\n\n**Briefly in English:** What does create_before_destroy change?\n\nTerraform creates the new object before deleting the old one. The plan still includes one create and one destroy. The platform must allow both objects to exist at the same time.\n"
