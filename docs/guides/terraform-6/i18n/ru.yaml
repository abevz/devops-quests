heading: 6. Жизненный цикл, замена и команды настройки [lifecycle]
text: "## 6. Жизненный цикл, замена и команды настройки [lifecycle]\n\n**Коротко**\n- Жизненный цикл описывает правила операций.\n- Изменение поля может обновить или заменить объект.\n- Сначала нужно прочитать действия плана.\n\n**Мини-пример:** сохрани как `main.tf` в новом временном каталоге. Подготовка и порядок запусков указаны сразу под листингом.\n\n```hcl\nvariable \"release\" { default = \"v1\" }\nresource \"terraform_data\" \"app\" {\n  input = var.release\n}\noutput \"release\" {\n  value = terraform_data.app.output\n}\n```\n\nПорядок: `tofu init` → `tofu apply -auto-approve` с default → `tofu plan -input=false -no-color -var=release=v2`. Все команды — в одном новом временном каталоге.\n\n**Предскажи:** что покажет запуск и каким будет код завершения?\n\n> [!question]- Ответ\n> Фактическая выдержка последней команды:\n>\n> ```text\n>   # terraform_data.app will be updated in-place\n> Plan: 0 to add, 1 to change, 0 to destroy.\n> Outputs:\n> ~ release = \"v1\" -> (known after apply)\n> ```\n>\n> Код завершения: 0.\n\nПодготовка применяет v1. План с v2 обновляет input на месте: в этом примере нет правила замены.\n\nПровайдер определяет, какие поля обновляются на месте, а какие требуют замены. Символы плана: `~` — обновление, `-/+` — сначала удалить, затем создать, `+/-` — сначала создать, затем удалить, `+` и `-` — создание и удаление. Изменение имени, образа или типа может потребовать замены; это зависит от ресурса и версии провайдера, а не только движка.\n\nКаждый пример ниже — самостоятельный корень с одним `main.tf`. Встроенный `terraform_data` не вызывает облако. Проверки первого черновика выполнены на OpenTofu 1.12.6; новые задачи с отдельными конфигурациями находятся в конце раздела.\n\n### Замена и `create_before_destroy`\n\n**Коротко**\n- Замена содержит создание и удаление.\n- create_before_destroy меняет их порядок.\n- Платформа должна позволять обе копии одновременно.\n\n**Мини-пример:** сохрани как `main.tf` в новом временном каталоге. Подготовка и порядок запусков указаны сразу под листингом.\n\n```hcl\nvariable \"release\" { default = \"v1\" }\nresource \"terraform_data\" \"app\" {\n  input = var.release\n  triggers_replace = [var.release]\n  lifecycle { create_before_destroy = true }\n}\n```\n\nПорядок: `tofu init` → `tofu apply -auto-approve` с default → `tofu plan -input=false -no-color -var=release=v2`. Все команды — в одном новом временном каталоге.\n\n**Предскажи:** что покажет запуск и каким будет код завершения?\n\n> [!question]- Ответ\n> Фактическая выдержка последней команды:\n>\n> ```text\n>   # terraform_data.app must be replaced\n> Plan: 1 to add, 0 to change, 1 to destroy.\n> ```\n>\n> Код завершения: 0.\n\nПосле применения v1 новый план меняет release на v2. triggers_replace требует замену; lifecycle определяет допустимость и порядок этой замены.\n\n> [!info]- Глубже\n> `triggers_replace` просит заменить ресурс при изменении выпуска. Сначала применили `v1`, затем запланировали `v2`:\n>\n> **`main.tf` в новом пустом каталоге:**\n>\n> ```hcl\n> terraform {\n>   required_version = \">= 1.5.0\"\n> }\n>\n> variable \"release\" {\n>   type    = string\n>   default = \"v1\"\n> }\n>\n> resource \"terraform_data\" \"app\" {\n>   input           = var.release\n>   triggers_replace = [var.release]\n>\n>   lifecycle {\n>     create_before_destroy = true\n>   }\n> }\n> ```\n>\n> План показал `+/-` и `Plan: 1 to add, 0 to change, 1 to destroy`. Новая копия создаётся раньше удаления прежней. Реальная платформа должна допускать обе копии одновременно: например, имена могут требовать различия. `tofu plan -replace=terraform_data.app` отдельно просит одноразовую замену конкретного адреса. *(проверено: OpenTofu 1.12.6, `init`, `validate`, первое применение и план замены)*.\n\n### `prevent_destroy`: защита существует, пока существует правило\n\n**Коротко**\n- prevent_destroy запрещает план удаления при действующем правиле.\n- Замена тоже включает удаление.\n- Удалённый из конфигурации блок уже не может защищать объект.\n\n**Мини-пример:** сохрани как `main.tf` в новом временном каталоге. Подготовка и порядок запусков указаны сразу под листингом.\n\n```hcl\nvariable \"release\" { default = \"v1\" }\nresource \"terraform_data\" \"app\" {\n  input = var.release\n  triggers_replace = [var.release]\n  lifecycle { prevent_destroy = true }\n}\n```\n\nПорядок: `tofu init` → `tofu apply -auto-approve` с default → `tofu plan -input=false -no-color -var=release=v2`. Все команды — в одном новом временном каталоге.\n\n**Предскажи:** что покажет запуск и каким будет код завершения?\n\n> [!question]- Ответ\n> Фактическая выдержка последней команды:\n>\n> ```text\n>   # terraform_data.app must be replaced\n> Plan: 1 to add, 0 to change, 1 to destroy.\n> Error: Resource instance cannot be destroyed\n> ```\n>\n> Код завершения: 1.\n\nПосле применения v1 новый план меняет release на v2. triggers_replace требует замену; lifecycle определяет допустимость и порядок этой замены.\n\n> [!info]- Глубже\n> **`main.tf` в новом пустом каталоге:**\n>\n> ```hcl\n> terraform {\n>   required_version = \">= 1.5.0\"\n> }\n>\n> variable \"release\" {\n>   type    = string\n>   default = \"v1\"\n> }\n>\n> resource \"terraform_data\" \"database\" {\n>   input           = \"keep\"\n>   triggers_replace = [var.release]\n>\n>   lifecycle {\n>     prevent_destroy = true\n>   }\n> }\n> ```\n>\n> После первого применения `tofu plan -var=release=v2` остановился с `Error: Resource instance cannot be destroyed` и `Resource instance terraform_data.database has prevent_destroy set, but the plan calls for it to be destroyed.` Если удалить весь блок ресурса, правило тоже исчезнет. OpenTofu 1.12 допускает динамическое выражение этого аргумента; совместимость со своей версией Terraform проверяй отдельно. *(проверено: OpenTofu 1.12.6, отказ замены)*.\n\n### `ignore_changes`: обновление поля принадлежит другому владельцу\n\n**Коротко**\n- ignore_changes исключает поле из расчёта обновления.\n- Это передача ответственности за обновление поля.\n- Правило не гарантирует сохранение исчезнувшего объекта.\n\n**Мини-пример:** сохрани как `main.tf` в новом временном каталоге. Подготовка и порядок запусков указаны сразу под листингом.\n\n```hcl\nvariable \"release\" { default = \"v1\" }\nresource \"terraform_data\" \"app\" {\n  input = var.release\n  lifecycle {\n    ignore_changes = [input]\n  }\n}\n```\n\nПорядок: `tofu init` → `tofu apply -auto-approve` с default → `tofu plan -input=false -no-color -var=release=v2`. Все команды — в одном новом временном каталоге.\n\n**Предскажи:** что покажет запуск и каким будет код завершения?\n\n> [!question]- Ответ\n> Фактическая выдержка последней команды:\n>\n> ```text\n> No changes. Your infrastructure matches the configuration.\n> ```\n>\n> Код завершения: 0.\n\nПервое применение сохраняет v1. Изменение только input до v2 затем не вызывает обновления.\n\n> [!info]- Глубже\n> Сначала применили вариант с `input = \"v1\"`, затем изменили его на `v2`:\n>\n> **`main.tf` в новом пустом каталоге: сначала применить с `input = \"v1\"`, затем поменять на `\"v2\"` — ниже уже второй вариант:**\n>\n> ```hcl\n> terraform {\n>   required_version = \">= 1.5.0\"\n> }\n>\n> resource \"terraform_data\" \"app\" {\n>   input = \"v2\"\n>\n>   lifecycle {\n>     ignore_changes = [input]\n>   }\n> }\n> ```\n>\n> План: `No changes. Your infrastructure matches the configuration.` Это показывает игнорирование изменения существующего поля, а не гарантию скрыть всякое внешнее изменение. `ignore_changes = all` может маскировать ошибки; используй правило только при осознанном внешнем владельце поля. *(проверено: OpenTofu 1.12.6)*.\n\n### Порядок через `depends_on`\n\n**Коротко**\n- Ссылка обычно задаёт зависимость автоматически.\n- depends_on описывает скрытую зависимость явно.\n- Он задаёт порядок, а не проверку здоровья приложения.\n\n**Мини-пример:** сохрани как `main.tf` в новом временном каталоге. После подготовки файлов выполни `tofu init`, `tofu validate`, затем `tofu apply -auto-approve -input=false -no-color`.\n\n```hcl\nresource \"terraform_data\" \"prepare\" {\n  input = \"ready\"\n}\nresource \"terraform_data\" \"deploy\" {\n  input = \"app\"\n  depends_on = [terraform_data.prepare]\n}\n```\n\n**Предскажи:** что покажет запуск и каким будет код завершения?\n\n> [!question]- Ответ\n> Фактическая выдержка последней команды:\n>\n> ```text\n>   # terraform_data.deploy will be created\n>   # terraform_data.prepare will be created\n> Plan: 2 to add, 0 to change, 0 to destroy.\n> Apply complete! Resources: 2 added, 0 changed, 0 destroyed.\n> ```\n>\n> Код завершения: 0.\n\nСоздание deploy ждёт prepare, хотя input не читает его значение. HTTP-проверки в этом примере нет.\n\n> [!info]- Глубже\n> Ссылка на значение сама строит зависимость. Явный `depends_on` нужен, если зависимость реальна, а передаваемого значения нет:\n>\n> **`main.tf` в новом пустом каталоге:**\n>\n> ```hcl\n> terraform {\n>   required_version = \">= 1.5.0\"\n> }\n>\n> resource \"terraform_data\" \"prepare\" {\n>   input = \"prepare first\"\n> }\n>\n> resource \"terraform_data\" \"deploy\" {\n>   input      = \"deploy second\"\n>   depends_on = [terraform_data.prepare]\n> }\n> ```\n>\n> При применении `prepare` завершился до начала `deploy`. Сам аргумент задаёт порядок и консервативность плана, а не замену. Обратная зависимость может создать цикл; текст из сохранённого дрилла: `Error: Cycle: terraform_data.b, terraform_data.a, terraform_data.c`. *(проверено: OpenTofu 1.12.6; цикл — [[Terraform-Coding-Drills-Solutions]])*.\n\n### Условия до и после операции\n\n**Коротко**\n- precondition проверяет необходимое условие.\n- postcondition проверяет результат операции.\n- Нарушенное обязательное условие даёт ошибку.\n\n**Мини-пример:** сохрани как `main.tf` в новом временном каталоге. После подготовки файлов выполни `tofu init`, `tofu validate`, затем `tofu plan -input=false -no-color -var=port=0`.\n\n```hcl\nvariable \"port\" { default = 8080 }\nresource \"terraform_data\" \"app\" {\n  input = var.port\n  lifecycle {\n    precondition {\n      condition = var.port > 0\n      error_message = \"port must be positive.\"\n    }\n  }\n}\n```\n\n**Предскажи:** что покажет запуск и каким будет код завершения?\n\n> [!question]- Ответ\n> Фактическая выдержка последней команды:\n>\n> ```text\n> Error: Resource precondition failed\n> ```\n>\n> Код завершения: 1.\n\nПередан ноль; precondition останавливает план ресурса до применения.\n\n> [!info]- Глубже\n> `precondition` проверяет предпосылку; `postcondition` — результат провайдера. `self` в последнем условии означает текущий экземпляр:\n>\n> **`main.tf` в новом пустом каталоге:**\n>\n> ```hcl\n> terraform {\n>   required_version = \">= 1.5.0\"\n> }\n>\n> variable \"port\" {\n>   type    = number\n>   default = 8080\n> }\n>\n> resource \"terraform_data\" \"service\" {\n>   input = { port = var.port }\n>\n>   lifecycle {\n>     precondition {\n>       condition     = var.port > 0\n>       error_message = \"port must be greater than 0\"\n>     }\n>     postcondition {\n>       condition     = self.output.port <= 65535\n>       error_message = \"provider returned an invalid port\"\n>     }\n>   }\n> }\n> ```\n>\n> С портом по умолчанию план и применение прошли. `tofu plan -var=port=0` дал `Error: Resource precondition failed` до операции. `tofu apply -var=port=70000` обновил локальный ресурс, затем дал `Error: Resource postcondition failed` и `provider returned an invalid port`. Если предпосылка неизвестна до применения, её проверка может отложиться. У блока `output` условие `precondition` задаётся без обёртки `lifecycle`; `postcondition` там нет. *(проверено: OpenTofu 1.12.6)*.\n> *(по документации)*. [Жизненный цикл](https://developer.hashicorp.com/terraform/language/meta-arguments/lifecycle) · [Пользовательские условия](https://developer.hashicorp.com/terraform/language/expressions/custom-conditions).\n\n### check.assert: диагностировать, не запрещать операцию\n\n**Коротко**\n- check проверяет ожидание о системе.\n- Ложный assert в check выдаёт предупреждение.\n- Для обязательного запрета нужен блокирующий механизм.\n\n**Мини-пример:** сохрани как `main.tf` в новом временном каталоге. После подготовки файлов выполни `tofu init`, `tofu validate`, затем `tofu plan -input=false -no-color`.\n\n```hcl\nvariable \"replicas\" { default = 2 }\ncheck \"capacity\" {\n  assert {\n    condition = var.replicas >= 3\n    error_message = \"Need three replicas.\"\n  }\n}\n```\n\n**Предскажи:** что покажет запуск и каким будет код завершения?\n\n> [!question]- Ответ\n> Фактическая выдержка последней команды:\n>\n> ```text\n> No changes. Your infrastructure matches the configuration.\n> Warning: Check block assertion failed\n> ```\n>\n> Код завершения: 0.\n\nДва меньше трёх: появляется предупреждение, но код plan остаётся нулевым.\n\n> [!info]- Глубже\n> `validation` описывает допустимый вход переменной; известный неверный вход блокирует план.\n> `precondition` задаёт предпосылку ресурса/выхода и тоже блокирует операцию при false.\n> `check` — отдельный блок с одним или несколькими `assert`: false даёт предупреждение.\n> Он не заменяет обязательную защиту перед созданием дорогого или опасного ресурса.\n>\n> Самостоятельный `main.tf`, без ресурсов, провайдеров и backend:\n>\n> ```hcl\n> variable \"replicas\" {\n>   type    = number\n>   default = 2\n> }\n> check \"spare_capacity\" {\n>   assert {\n>     condition     = var.replicas >= 3\n>     error_message = \"Less than three replicas: inspect capacity.\"\n>   }\n> }\n> ```\n>\n> `tofu init -backend=false`, `tofu validate`, затем `tofu plan -input=false`.\n> При default=2 план возвращает 0 с `Warning: Check block assertion failed`.\n> С `-var=replicas=4` предупреждения нет. *(проверено: только validate/plan)*.\n> Никакое применение в этом опыте не нужно и не выполнялось.\n>\n> | Механизм | false при известном значении | Назначение |\n> |---|---|---|\n> | validation | Ошибка | Допустимый вход |\n> | precondition | Ошибка | Необходимое условие операции |\n> | check.assert | Предупреждение | Проверка здоровья/ожидания |\n>\n> Неизвестное значение может отложить проверку до получения значения при apply.\n> Это свойство вычислений, а не гарантия раннего отказа для всех выражений.\n> У check возможен вложенный data source; здесь его нет, сеть не используется.\n> Сбой такого data source внутри check тоже имеет особую диагностическую семантику.\n> Для обязательного ограничения выбери validation/precondition, а не уровень warning.\n> [OpenTofu: checks](https://opentofu.org/docs/language/checks/) — проверено 20.10.2026.\n\n### Замена вслед за другим ресурсом\n\n**Коротко**\n- replace_triggered_by связывает замену с другим ресурсом.\n- Изменение источника запускает правило у зависимого ресурса.\n- Обычную переменную можно передать через terraform_data.\n\n**Мини-пример:** сохрани как `main.tf` в новом временном каталоге. Подготовка и порядок запусков указаны сразу под листингом.\n\n```hcl\nvariable \"release\" { default = \"v1\" }\nresource \"terraform_data\" \"version\" { input = var.release }\nresource \"terraform_data\" \"app\" {\n  input = \"app\"\n  lifecycle {\n    replace_triggered_by = [terraform_data.version]\n  }\n}\n```\n\nПорядок: `tofu init` → `tofu apply -auto-approve` с default → `tofu plan -input=false -no-color -var=release=v2`. Все команды — в одном новом временном каталоге.\n\n**Предскажи:** что покажет запуск и каким будет код завершения?\n\n> [!question]- Ответ\n> Фактическая выдержка последней команды:\n>\n> ```text\n>   # terraform_data.app will be replaced due to changes in replace_triggered_by\n>   # terraform_data.version will be updated in-place\n> Plan: 1 to add, 1 to change, 1 to destroy.\n> ```\n>\n> Код завершения: 0.\n\nversion обновляется, app заменяется по правилу. Строка input самого app остаётся прежней.\n\n> [!info]- Глубже\n> `replace_triggered_by` реагирует на изменение управляемого ресурса или его атрибута. Обычная переменная не имеет жизненного цикла, поэтому её можно поместить в `terraform_data`:\n>\n> **`main.tf` в новом пустом каталоге:**\n>\n> ```hcl\n> variable \"release\" {\n>   type    = string\n>   default = \"1.0\"\n> }\n>\n> resource \"terraform_data\" \"release\" {\n>   input = var.release\n> }\n>\n> resource \"terraform_data\" \"deployment\" {\n>   input = \"deploy\"\n>\n>   lifecycle {\n>     replace_triggered_by = [terraform_data.release]\n>   }\n> }\n> ```\n>\n> При смене `release` первый ресурс обновляется, второй заменяется. Проверенный текст: `terraform_data.deployment will be replaced due to changes in replace_triggered_by`. В отличие от него `depends_on` задаёт порядок; `-replace=ADDRESS` просит одноразовую замену. Сохранённый план уже содержит выбранные действия, дополнительные флаги планирования не меняют его. *(проверено: OpenTofu 1.12.6, план после изменения выпуска)*.\n\n### Команды настройки [provisioners] — последний вариант\n\n**Коротко**\n- local-exec запускает команду на машине OpenTofu.\n- Команда может завершиться ошибкой после начала создания.\n- Это не полноценная замена отдельному инструменту настройки.\n\n**Мини-пример:** сохрани как `main.tf` в новом временном каталоге. После подготовки файлов выполни `tofu init`, `tofu validate`, затем `tofu apply -auto-approve -input=false -no-color`.\n\n```hcl\nresource \"terraform_data\" \"failure\" {\n  input = \"demo\"\n  provisioner \"local-exec\" {\n    command = \"exit 7\"\n  }\n}\n```\n\n**Предскажи:** что покажет запуск и каким будет код завершения?\n\n> [!question]- Ответ\n> Фактическая выдержка последней команды:\n>\n> ```text\n>   # terraform_data.failure will be created\n> Plan: 1 to add, 0 to change, 0 to destroy.\n> Error: local-exec provisioner error\n> ```\n>\n> Код завершения: 1.\n\nУчебная команда возвращает 7; apply сообщает ошибку provisioner и возвращает свой ненулевой код. Внешние системы не затронуты.\n\n> [!info]- Глубже\n> `local-exec` исполняет команду на рабочей машине или раннере, `remote-exec` — на удалённом объекте через `connection`. В `${self.id}` слово `self` означает текущий экземпляр. Движок не моделирует все побочные эффекты команды и не может надёжно повторить её частичную работу. При `create_before_destroy = true` команды, назначенные на удаление, не запускаются. Для машин лучше образ, cloud-init или Ansible.\n>\n> Полный пример с намеренным отказом:\n>\n> **`main.tf` в новом пустом каталоге:**\n>\n> ```hcl\n> terraform {\n>   required_version = \">= 1.5.0\"\n> }\n>\n> resource \"terraform_data\" \"hook\" {\n>   input = \"created first\"\n>\n>   provisioner \"local-exec\" {\n>     command = \"echo 'created ${self.id}' && exit 1\"\n>   }\n> }\n> ```\n>\n> После `init` и `validate` применение завершилось с `Error: local-exec provisioner error` и `exit status 1`. Ресурс уже был создан; `tofu state show terraform_data.hook` показала `(tainted)`. Убери `&& exit 1` для успешного завершения команды. Ошибки подключения, времени ожидания и частичной настройки зависят от узла и оболочки; универсального текста для них нет. *(проверено: OpenTofu 1.12.6, только учебный каталог)*.\n> *(по документации)*. [Команды настройки](https://developer.hashicorp.com/terraform/language/resources/provisioners/syntax) · [Блоки check](https://developer.hashicorp.com/terraform/language/block/check).\n>\n> ```mermaid\n> flowchart TB\n>     U[\"Изменился<br/>аргумент\"] --> Q[\"Провайдер и<br/>lifecycle<br/>определяют<br/>действие\"]\n>     Q --> I[\"Обновление<br/>на месте:<br/>изменить<br/>прежний<br/>объект\"]\n>     Q --> R[\"Замена по<br/>умолчанию:<br/>удалить<br/>старый →<br/>создать<br/>новый\"]\n>     Q --> C[\"create_before_destroy:<br/>создать<br/>новый →<br/>удалить<br/>старый\"]\n> ```\n\n### Сначала предскажи действие, потом смотри символ\n\n**Коротко**\n- План различает обновление и замену.\n- Число операций и их порядок — разные характеристики.\n- Ограничение lifecycle действует только в своей конфигурации.\n\nОтдельный корень для обновления `input`:\n\n**`main.tf` в новом пустом каталоге:**\n\n```hcl\nvariable \"release\" {\n  type    = string\n  default = \"v1\"\n}\nresource \"terraform_data\" \"app\" {\n  input = var.release\n}\n```\n\nПосле `init` и первого `apply` выполнили `tofu plan -var=release=v2`.\n\n**Предскажи:** Здесь нет `triggers_replace`. Как план изменит `terraform_data.app`?\n> [!question]- Ответ\n> ```text\n>   # terraform_data.app will be updated in-place\n> Plan: 0 to add, 1 to change, 0 to destroy.\n> ```\n> Аргумент `input` у этого встроенного ресурса допускает обновление; изменение аргумента само по себе не означает замену.\n\nВ двух других каталогах к тому же ресурсу добавили `triggers_replace = [var.release]`. В одном оставили порядок по умолчанию, в другом добавили `lifecycle { create_before_destroy = true }`. Оба сначала применили с `v1`.\n\n**Предскажи:** Что изменится в плане для `release=v2`: число действий или их порядок при `create_before_destroy`?\n> [!question]- Ответ\n> ```text\n> -/+ destroy and then create replacement\n>   # terraform_data.app must be replaced\n> -/+ resource \"terraform_data\" \"app\" {\n> Plan: 1 to add, 0 to change, 1 to destroy.\n>\n> +/- create replacement and then destroy\n>   # terraform_data.app must be replaced\n> +/- resource \"terraform_data\" \"app\" {\n> Plan: 1 to add, 0 to change, 1 to destroy.\n> ```\n> Число действий одинаково, но порядок обратный: сначала удалить и создать, либо сначала создать и удалить.\n\n\n**Удаление самого блока снимает защиту.** В новом корне сначала применили:\n\n**`main.tf` в новом пустом каталоге:**\n\n```hcl\nvariable \"release\" {\n  type    = string\n  default = \"v1\"\n}\nresource \"terraform_data\" \"app\" {\n  input            = var.release\n  triggers_replace = [var.release]\n  lifecycle { prevent_destroy = true }\n}\n```\n\n\n**Предскажи:** Удали весь `resource` и переменную из файла. Сработает ли прежний `prevent_destroy`?\n> [!question]- Ответ\n> ```text\n>   # terraform_data.app will be destroyed\n> Plan: 0 to add, 0 to change, 1 to destroy.\n> ```\n> Правило существует в конфигурации ресурса, не как вечная защита в state. При удалении блока движок больше его не читает.\n\n**Ручной дрейф и `ignore_changes`.** В отдельном опыте использовали полный `local_file` из §3, применили его, затем заменили содержимое `demo.txt` на `manual drift`, не меняя код.\n\n**Предскажи:** Спрячет ли `ignore_changes = [content]` это ручное изменение файла?\n> [!question]- Ответ\n> ```text\n>   # local_file.this will be created\n> Plan: 1 to add, 0 to change, 0 to destroy.\n> ```\n> Провайдер `local` проверяет содержимое по контрольной сумме и сообщает исчезновение прежнего объекта. Правило `ignore_changes` не предотвращает создание отсутствующего объекта; это отличается от обновления существующего поля.\n\n*(проверено: OpenTofu 1.12.6, `local` 2.9.1; обновление, обе замены, снятие защиты вместе с кодом и ручной дрейф)*.\n\n**Коротко по-английски:** What does create_before_destroy change?\n\nTerraform creates the new object before deleting the old one. The plan still includes one create and one destroy. The platform must allow both objects to exist at the same time.\n"
