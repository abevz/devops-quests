heading: Admission budgets and metrics
text: |
  # Admission budgets and metrics

  ResourceQuota accounts for every admitted consumer in a namespace. LimitRange supplies defaults at admission; changing it does not rewrite existing Pods. A Deployment replacement or surge may need budget while older Pods still consume it. Compare quota usage, both desired templates, current admitted resources and ReplicaSet condition messages. Coordinate resource generations within the fixed budget. CPU defaults and current admitted memory are separate observations; neither proves editing history or node capacity.

  In quest 127, scrape transport, stored series labels and downstream query intent have different lifetimes. A gauge describes a current value; count and sum must refer to the intended series scope. Healthy scrape targets do not update an old consumer configuration. Follow the live exporter, private Prometheus and both query consumers, including their desired inputs, current Pod environment, provided polling code, served aggregate and advancing observation count. Current snapshots and progress are evidence of current operation, not proof of the entire request history.

  References: [LimitRange](https://kubernetes.io/docs/concepts/policy/limit-range/), [ResourceQuota](https://kubernetes.io/docs/concepts/policy/resource-quotas/), [Prometheus queries](https://prometheus.io/docs/prometheus/latest/querying/basics/).

  In quest 126, inspect admission state:

  ```sh
  cd ~/quest
  cat admission-contract.json
  kubectl get resourcequota station -o yaml
  kubectl get limitrange defaults -o yaml
  kubectl get deployment,replicaset,pods -o yaml
  ```

  In quest 127, inspect the Service and ask the private Prometheus for up:

  ```sh
  cd ~/quest
  kubectl get service board -o yaml
  url=$(jq -r .url prometheus-target.json)
  kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/query?query=up%7Bjob%3D%22board%22%7D"
  cat observer-contract.json
  kubectl get deployment,configmap,pods -o yaml
  ```

  In quest 121, fail-closed admission rejects requests when the validating webhook cannot be reached; this differs from an explicit rejection. Request the bounded restore-path repair without changing the read-only configuration, preserve its CA and namespace scope, and apply north-121. Check readiness and HTTP, then use server-side dry-runs to verify both the valid route and the rejected closed route.
