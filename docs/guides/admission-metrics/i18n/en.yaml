heading: Admission budgets and metrics
text: '# Admission budgets and metrics


  ResourceQuota accounts for every admitted consumer in a namespace. LimitRange supplies defaults at admission;
  changing it does not rewrite existing Pods. A Deployment replacement or surge may need budget while older Pods
  still consume it. Compare quota usage, both desired templates, current admitted resources and ReplicaSet condition
  messages. Coordinate resource generations within the fixed budget. CPU defaults and current admitted memory are
  separate observations; neither proves editing history or node capacity.


  In quest 127, scrape transport, stored series labels and downstream query intent have different lifetimes. A gauge
  describes a current value; count and sum must refer to the intended series scope. Healthy scrape targets do not
  update an old consumer configuration. Follow the live exporter, private Prometheus and both query consumers, including
  their desired inputs, current Pod environment, provided polling code, served aggregate and advancing observation
  count. Current snapshots and progress are evidence of current operation, not proof of the entire request history.


  References: [LimitRange](https://kubernetes.io/docs/concepts/policy/limit-range/), [ResourceQuota](https://kubernetes.io/docs/concepts/policy/resource-quotas/),
  [Prometheus queries](https://prometheus.io/docs/prometheus/latest/querying/basics/).


  In quest 126, inspect admission state:


  ```sh

  cd ~/quest

  cat admission-contract.json

  kubectl get resourcequota station -o yaml

  kubectl get limitrange defaults -o yaml

  kubectl get deployment,replicaset,pods -o yaml

  ```


  In quest 127, inspect the Service and ask the private Prometheus for up:


  ```sh

  cd ~/quest

  kubectl get service board -o yaml

  url=$(jq -r .url prometheus-target.json)

  kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/query?query=up%7Bjob%3D%22board%22%7D"

  cat observer-contract.json

  kubectl get deployment,configmap,pods -o yaml

  ```


  In quest 121, distinguish a failed admission transport from an explicit policy denial. A control receipt confirms
  only its bounded request; it does not prove that an application record was admitted. API publication and consumer
  adoption have separate lifetimes: an environment is captured at process startup, and a subPath mount keeps its
  original file binding. Compare the policy-protected record and key with desired workload references, current owned
  Pods, actual inputs and responses. Preserved staging data is a control, not a substitute for adopting the validated
  source. Retain the private trust and fail-closed boundary while testing accepted and rejected server dry-runs.
  Current state does not establish the full request history.'
