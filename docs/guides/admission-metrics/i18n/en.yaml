heading: Admission budgets and metrics
text: '# Admission budgets and metrics


  Use only the offline bay. A LimitRange can default a new container''s resource requests and limits; ResourceQuota constrains the namespace''s total budget. Admission applies defaults to new Pods, not existing ones. In quest 126, inspect the supplied quota, defaults and resource-free Deployment template and read ReplicaSet events. Correct the CPU defaults, recreate the Pod through the Deployment and inspect the actual admitted Pod''s CPU and memory. A quota is not a guarantee of node capacity, and this check does not inspect the current LimitRange memory defaults.


  In quest 127, a Service maps its port to a target port on matching Pods. Prometheus periodically scrapes a configured endpoint, then stores time series distinguished by labels. A gauge is a current value: use `sum` and `count` on `station_queue_depth{job="board",route="north"}` rather than `rate`. Inspect `metrics.json`, the Service and `prometheus-target.json`, correct the port and wait for a scrape. Query `up`, the gauge sum and count, and target health with the private URL. A ready Pod alone does not prove a scrape or a recorded metric. Current results do not prove which edit was made.


  References: [LimitRange](https://kubernetes.io/docs/concepts/policy/limit-range/), [ResourceQuota](https://kubernetes.io/docs/concepts/policy/resource-quotas/), [Prometheus queries](https://prometheus.io/docs/prometheus/latest/querying/basics/).


  In quest 126, inspect admission state:


  ```sh

  cd ~/quest

  kubectl describe resourcequota station

  kubectl get limitrange defaults -o yaml

  kubectl describe rs

  kubectl get pods -l app=board -o yaml

  ```


  After correcting the CPU defaults, scale board to zero. Wait until no board Pods remain and its ReplicaSets have zero desired replicas; this frees the fixed quota and briefly interrupts the service. Then restart the Deployment and scale it back to one:


  ```sh

  kubectl scale deployment/board --replicas=0

  kubectl get pods -l app=board

  kubectl get replicasets -l app=board

  ```


  Repeat both `kubectl get` commands until no board Pods remain and the DESIRED column is zero for every board ReplicaSet. Only then run the following commands:


  ```sh

  kubectl rollout restart deployment/board

  kubectl scale deployment/board --replicas=1

  kubectl rollout status deployment/board --timeout=90s

  ```


  In quest 127, inspect the Service and ask the private Prometheus for up:


  ```sh

  cd ~/quest

  kubectl get service board -o yaml

  url=$(jq -r .url prometheus-target.json)

  kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/query?query=up%7Bjob%3D%22board%22%7D"

  ```


  In quest 121, fail-closed admission rejects requests when the validating webhook cannot be reached; this differs from an explicit rejection. Request the bounded restore-path repair without changing the read-only configuration, preserve its CA and namespace scope, and apply north-121. Check readiness and HTTP, then use server-side dry-runs to verify both the valid route and the rejected closed route.

  '
