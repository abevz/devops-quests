heading: Бюджеты admission и метрики
text: '# Бюджеты admission и метрики


  ResourceQuota учитывает всех admitted-потребителей namespace. LimitRange задаёт defaults при admission; его изменение
  не переписывает существующие Pod. Замена Deployment или surge может потребовать бюджет, пока старые Pod его занимают.
  Сопоставляйте использование квоты, оба шаблона, admitted-ресурсы и сообщения условий ReplicaSet. Согласуйте поколения
  ресурсов в фиксированном бюджете. CPU defaults и текущая admitted-память — отдельные наблюдения, не доказательство
  истории или node capacity.


  В задании 127 транспорт scrape, метки сохранённых рядов и смысл запросов потребителей имеют разные сроки жизни.
  Gauge описывает текущее значение; count и sum должны относиться к нужной области рядов. Здоровые scrape targets
  не обновляют старую конфигурацию потребителя. Проследите работающий exporter, приватный Prometheus и обоих потребителей:
  желаемые входы, окружение текущих Pod, предоставленный код опроса, выдаваемый агрегат и растущий счётчик наблюдений.
  Текущие снимки и прогресс подтверждают текущую работу, но не всю историю запросов.


  Источники: [LimitRange](https://kubernetes.io/docs/concepts/policy/limit-range/), [ResourceQuota](https://kubernetes.io/docs/concepts/policy/resource-quotas/),
  [запросы Prometheus](https://prometheus.io/docs/prometheus/latest/querying/basics/).


  В задании 126 изучите состояние admission:


  ```sh

  cd ~/quest

  cat admission-contract.json

  kubectl get resourcequota station -o yaml

  kubectl get limitrange defaults -o yaml

  kubectl get deployment,replicaset,pods -o yaml

  ```


  В задании 127 изучите Service и запросите up у приватного Prometheus:


  ```sh

  cd ~/quest

  kubectl get service board -o yaml

  url=$(jq -r .url prometheus-target.json)

  kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/query?query=up%7Bjob%3D%22board%22%7D"

  cat observer-contract.json

  kubectl get deployment,configmap,pods -o yaml

  ```


  В квесте 121 различайте транспортный отказ admission и явное отклонение политикой. Квитанция управления подтверждает
  только ограниченный запрос, а не допуск записи приложения. Публикация через API и принятие данных потребителями
  имеют разное время жизни: окружение захватывается при запуске процесса, а subPath сохраняет исходную привязку
  файла. Сравните защищаемую политикой запись и ключ с желаемыми ссылками нагрузок, текущими принадлежащими им Pod,
  фактическими входами и ответами. Неизменные промежуточные данные служат контролем, а не заменой принятия проверяемого
  источника. Сохраните частную границу доверия и fail-closed при проверке разрешённых и отклонённых серверных dry-run.
  Текущее состояние не доказывает полную историю запросов.'
