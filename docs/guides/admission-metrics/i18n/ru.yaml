heading: Бюджеты admission и метрики
text: '# Бюджеты admission и метрики


  ResourceQuota учитывает всех admitted-потребителей namespace. LimitRange задаёт defaults при admission; его изменение не переписывает существующие Pod. Замена Deployment или surge может потребовать бюджет, пока старые Pod его занимают. Сопоставляйте использование квоты, оба шаблона, admitted-ресурсы и сообщения условий ReplicaSet. Согласуйте поколения ресурсов в фиксированном бюджете. CPU defaults и текущая admitted-память — отдельные наблюдения, не доказательство истории или node capacity.


  В задании 127 транспорт scrape, метки сохранённых рядов и смысл запросов потребителей имеют разные сроки жизни. Gauge описывает текущее значение; count и sum должны относиться к нужной области рядов. Здоровые scrape targets не обновляют старую конфигурацию потребителя. Проследите работающий exporter, приватный Prometheus и обоих потребителей: желаемые входы, окружение текущих Pod, предоставленный код опроса, выдаваемый агрегат и растущий счётчик наблюдений. Текущие снимки и прогресс подтверждают текущую работу, но не всю историю запросов.


  Источники: [LimitRange](https://kubernetes.io/docs/concepts/policy/limit-range/), [ResourceQuota](https://kubernetes.io/docs/concepts/policy/resource-quotas/), [запросы Prometheus](https://prometheus.io/docs/prometheus/latest/querying/basics/).


  В задании 126 изучите состояние admission:


  ```sh

  cd ~/quest

  cat admission-contract.json

  kubectl get resourcequota station -o yaml

  kubectl get limitrange defaults -o yaml

  kubectl get deployment,replicaset,pods -o yaml

  ```


  В задании 127 изучите Service и запросите up у приватного Prometheus:


  ```sh

  cd ~/quest

  kubectl get service board -o yaml

  url=$(jq -r .url prometheus-target.json)

  kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/query?query=up%7Bjob%3D%22board%22%7D"

  cat observer-contract.json

  kubectl get deployment,configmap,pods -o yaml

  ```


  В квесте 121 различайте транспортный отказ admission и явное отклонение политикой. Квитанция управления подтверждает только ограниченный запрос, а не допуск записи приложения. Публикация через API и принятие данных потребителями имеют разное время жизни: окружение захватывается при запуске процесса, а subPath сохраняет исходную привязку файла. Сравните защищаемую политикой запись и ключ с желаемыми ссылками нагрузок, текущими принадлежащими им Pod, фактическими входами и ответами. Неизменные промежуточные данные служат контролем, а не заменой принятия проверяемого источника. Сохраните частную границу доверия и fail-closed при проверке разрешённых и отклонённых серверных dry-run. Текущее состояние не доказывает полную историю запросов.


  ### Один проверяющий вебхук {#q121-admission-single-webhook}


  Конфигурация стенда могла отсутствовать или содержать лишние webhook. Проверьте, что в ней ровно одна запись.


  ```bash

  kubectl get validatingwebhookconfiguration "dq-webhook-${DQ_NAMESPACE#dq-}" -o json | jq ''.webhooks | length''

  ```


  ### Имя проверяющего вебхука {#q121-admission-webhook-identity}


  Запись webhook могли переименовать или заменить. Проверьте route.training.devops-quests.local в действующей конфигурации стенда.


  ```bash

  kubectl get validatingwebhookconfiguration "dq-webhook-${DQ_NAMESPACE#dq-}" -o json | jq -r ''.webhooks[0].name''

  ```


  ### Политика обработки сбоя вебхука {#q121-admission-failure-mode}


  Обходное решение могло изменить failurePolicy на Ignore. Сохраните Fail, чтобы недоступный webhook не пропускал проверку молча.


  ```bash

  kubectl get validatingwebhookconfiguration "dq-webhook-${DQ_NAMESPACE#dq-}" -o json | jq -r ''.webhooks[0].failurePolicy''

  ```


  ### Тайм-аут вебхука в секундах {#q121-admission-timeout-seconds}


  При диагностике доступности могли изменить тайм-аут webhook. Проверьте, что timeoutSeconds по-прежнему равен 2.


  ```bash

  kubectl get validatingwebhookconfiguration "dq-webhook-${DQ_NAMESPACE#dq-}" -o json | jq ''.webhooks[0].timeoutSeconds''

  ```


  ### Адрес точки проверки {#q121-admission-validation-endpoint}


  Валидатор мог ссылаться на выведенный из работы путь или другой адрес. Проверьте HTTPS URL webhook стенда на порту 8443 и путь /validate.


  ```bash

  kubectl get validatingwebhookconfiguration "dq-webhook-${DQ_NAMESPACE#dq-}" -o json | jq -r ''.webhooks[0].clientConfig.url''

  ```


  ### Центр сертификации для проверки {#q121-admission-certificate-authority}


  CA bundle мог отсутствовать, иметь неверный формат или содержать другой сертификат. Сравните единственный декодированный сертификат с admission-ca.pem.


  ```bash

  kubectl get validatingwebhookconfiguration "dq-webhook-${DQ_NAMESPACE#dq-}" -o json | jq -er ''.webhooks[0].clientConfig.caBundle'' | base64 -d | openssl x509 -noout -fingerprint -sha256; openssl x509 -in admission-ca.pem -noout -fingerprint -sha256

  ```


  ### Пространство имён под вебхуком {#q121-admission-sandbox-namespace-selector}


  Селектор мог пропустить метку запуска или установки либо охватить другой namespace. Сравните его с двумя выданными метками и сохраните это точное ограничение.


  ```bash

  kubectl get namespace "$DQ_NAMESPACE" --show-labels; kubectl get validatingwebhookconfiguration "dq-webhook-${DQ_NAMESPACE#dq-}" -o json | jq ''.webhooks[0].namespaceSelector''

  ```


  ### Текущая запись маршрута {#q121-admission-current-route-record}


  В живом ConfigMap route могло остаться старое значение, либо он не читается. Проверьте north-121 в ключе route фактического объекта.


  ```bash

  kubectl get configmap route -o json | jq -e ''.data.route == "north-121"''

  ```


  ### Принятый серверный dry run {#q121-admission-accepted-dry-run}


  Даже верный объект мог не пройти серверный dry-run из-за недоступного webhook или CA. Сравните результат серверного dry-run с фактической записью route.


  ```bash

  kubectl get configmap route -o json | jq ''del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields)'' | kubectl apply --dry-run=server -f -

  ```


  ### Запрос для отклоняемого dry run {#q121-admission-denied-dry-run-input}


  Объект route мог отсутствовать либо содержать некорректный JSON, из-за чего не формируется вход dry-run со значением closed. Проверьте вход перед оценкой отказа.


  ```bash

  kubectl get configmap route -o json | jq ''.data.route="closed" | del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields)''

  ```


  ### Отклонение закрытого маршрута {#q121-admission-reject-closed-route}


  Изменённое значение могло пройти проверку из-за неверной области или пути webhook. Выполните серверный dry-run с closed и убедитесь в отказе.


  ```bash

  kubectl get configmap route -o json | jq ''.data.route="closed" | del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields)'' | kubectl apply --dry-run=server -f -

  ```


  ### Ожидаемый текст причины отказа {#q121-admission-exact-validation-denial}


  Общая ошибка TLS или транспорта могла отклонить dry-run до проверки значения. Убедитесь, что ошибка содержит Station route must be north-121.


  ```bash

  kubectl get configmap route -o json | jq ''.data.route="closed" | del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields)'' | kubectl apply --dry-run=server -f -

  ```


  ### Готовые реплики board {#q121-admission-board-ready-count}


  Восстановленный маршрут мог проходить проверку, пока worker board ещё запускается или не готов. Проверьте rollout и дождитесь одной готовой реплики.


  ```bash

  kubectl get deployment board -o jsonpath=''{.status.readyReplicas}''; kubectl get pods -l app=board

  ```


  ### Фактический ответ board {#q121-admission-board-live-response}


  Успешный dry-run возможен при старом ответе board или недоступном сервисе. Запросите board из client и сравните фактическое тело с north-121.


  ```bash

  kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080

  ```


  ### Данные проверки вебхука {#q121-admission-config-observer-input}


  Проверка webhook может остановиться до указания условия, если недоступны инструменты или входные файлы. Проверьте инструменты, выданный CA и доступ к namespace.


  ```bash

  command -v python3; test -r admission-ca.pem; kubectl get namespace "$DQ_NAMESPACE" -o name

  ```


  ### Сохранённые идентификаторы потребителей {#q121-admission-retained-consumer-identities}


  Выданную нагрузку могли пересоздать либо заменить образ в шаблоне или Pod. Сверьте текущие UID и образы с зафиксированной записью принятия.


  ```bash

  jq ''.deployments'' /run/dq/facts/0/adoption-identities.json; kubectl get deployment board client route-env route-file -o custom-columns=NAME:.metadata.name,UID:.metadata.uid,IMAGE:.spec.template.spec.containers[*].image; kubectl get replicaset,pod -o json | jq ''.items[] | {kind, name: .metadata.name, uid: .metadata.uid, owner: .metadata.ownerReferences, workers: [.spec.containers[]? | {name,image}]}''

  ```


  ### Сохранённая промежуточная запись {#q121-admission-preserved-staged-record}


  Правка staged-route под принятый объект могла изменить исходные данные либо UID. Сравните всю запись staging с исходной и подключите потребителей к фактическому ConfigMap route.


  ```bash

  jq ''.staging | {uid: .metadata.uid, data, binaryData}'' /run/dq/facts/0/adoption-identities.json; kubectl get configmap staged-route -o json | jq ''{uid: .metadata.uid, data, binaryData}''

  ```


  ### Исходная запись маршрута {#q121-admission-source-route-record}


  Конфигурация потребителей могла устареть или отсутствовать. Убедитесь, что фактический принятый ConfigMap route содержит north-121 в ключе route.


  ```bash

  kubectl get configmap route -o json | jq -e ''.data.route == "north-121"''

  ```


  ### Текущие Pod потребителей {#q121-admission-current-consumer-pods}


  После rollout у потребителя может не быть ровно одного текущего готового Pod своего Deployment. Проверьте rollout обоих Deployment и их текущие Pod.


  ```bash

  kubectl get deployment route-env route-file -o wide; kubectl get replicasets,pods -l ''app in (route-env,route-file)'' -o wide

  ```


  ### Сохранённая программа запуска {#q121-admission-preserved-startup-program}


  Правка команды или аргументов запуска могла скрыть неверный вход. Сравните желаемую и фактическую программу с выданной и исправьте ссылку на источник.


  ```bash

  jq ''.deployments | {env: .["route-env"], file: .["route-file"]}'' /run/dq/facts/0/adoption-identities.json; kubectl get deployment route-env route-file -o json | jq ''.items[] | {name: .metadata.name, startup: [.spec.template.spec.containers[] | {name,command,args}]}''; kubectl get pods -o json | jq ''.items[] | {name: .metadata.name, owner: .metadata.ownerReferences, startup: [.spec.containers[] | {name,command,args}]}''

  ```


  ### Ссылка на подключённый источник {#q121-admission-adopted-config-reference}


  Потребитель мог ещё ссылаться на staged-route, использовать литерал или неоднозначную проекцию файла. Проверьте route/route в шаблоне и текущем Pod. Нужна уникальная ссылка ROUTE или монтирование файла только для чтения.


  ```bash

  kubectl get deployment route-env route-file -o json | jq ''.items[] | {name: .metadata.name, containers: .spec.template.spec.containers, volumes: .spec.template.spec.volumes}''

  kubectl get replicaset,pod -o json | jq ''.items[] | {kind, name: .metadata.name, uid: .metadata.uid, owners: .metadata.ownerReferences, containers: .spec.containers, volumes: .spec.volumes}''

  ```


  ### Фактические входные данные потребителя {#q121-admission-live-consumer-input}


  Конфигурация может быть верной, пока работающий потребитель видит старое окружение или файл. Прочитайте фактические ROUTE и /config/route и сравните с north-121.


  ```bash

  kubectl exec deployment/route-env -c worker -- printenv ROUTE; kubectl exec deployment/route-file -c worker -- cat /config/route

  ```


  ### Фактическая публикация потребителя {#q121-admission-live-consumer-publication}


  Потребитель мог читать верный вход, но отдавать старое содержимое со старта. Запросите loopback у каждого текущего потребителя и сравните с north-121.


  ```bash

  for deployment_name in route-env route-file; do kubectl exec "deployment/$deployment_name" -c worker -- wget -qO- -T 2 http://127.0.0.1:8080; done

  ```


  ### Текущие наблюдения за потребителями {#q121-admission-current-observation-failure}


  Наблюдение могло не прочитать нагрузку, вход Pod или ответ за отведённое время. Проверьте API и повторите локальные наблюдения отдельно перед оценкой принятия.


  ```bash

  kubectl get deployment route-env route-file -o name; kubectl get pods -l ''app in (route-env,route-file)''

  ```


  ### Данные проверки подключения источника {#q121-admission-adoption-observer-input}


  Проверка принятия может остановиться до указания условия при ошибке процесса или исходных данных. Проверьте инструменты станции, выданный контракт и доступ к обоим потребителям.


  ```bash

  command -v python3; test -r adoption-contract.json; kubectl get deployment route-env route-file -o name

  ```



  ### Жёсткие пределы station {#q126-station-quota-budget}


  ResourceQuota station мог отсутствовать или содержать другие значения hard. Сверьте запросы CPU 200m и памяти 32Mi, лимиты CPU 400m и памяти 64Mi и число Pod 2.


  ```bash

  kubectl get resourcequota station -o json | jq ''.spec.hard''

  ```


  ### Данные проверки квоты {#q126-station-quota-observer}


  Проверка квоты могла остановиться до вывода конкретного условия. Убедитесь, что упражнение может прочитать текущую ResourceQuota station.


  ```bash

  kubectl get resourcequota station -o json

  ```


  ### Лимит CPU по умолчанию {#q126-station-limitrange-default}


  В LimitRange defaults может отсутствовать запись Container или в ней задан другой лимит CPU по умолчанию. Проверьте значение 200m.


  ```bash

  kubectl get limitrange defaults -o json | jq ''.spec.limits[] | select(.type=="Container") | .default.cpu''

  ```


  ### Запрос CPU по умолчанию {#q126-station-limitrange-request}


  В LimitRange defaults может отсутствовать запись Container или в ней задан другой запрос CPU по умолчанию. Проверьте значение 100m.


  ```bash

  kubectl get limitrange defaults -o json | jq ''.spec.limits[] | select(.type=="Container") | .defaultRequest.cpu''

  ```


  ### Настройки ресурсов в шаблоне board {#q126-station-board-empty-resources}


  Шаблон board может явно задавать resources для worker, либо worker отсутствует. Оставьте resources в шаблоне пустым, чтобы значения подставила admission-проверка.


  ```bash

  kubectl get deployment board -o json | jq ''.spec.template.spec.containers[] | select(.name=="worker") | .resources''

  ```


  ### Данные проверки правил admission {#q126-station-admission-policy-observer}


  Проверка правил admission могла остановиться до вывода конкретного условия. Проверьте LimitRange, квоту и Deployment в пространстве имён упражнения.


  ```bash

  kubectl get resourcequota station; kubectl get limitrange defaults; kubectl get deployment board client

  ```


  ### Сохранённые идентификаторы квоты и Deployment {#q126-station-retained-admission-objects}


  Защищённая ResourceQuota или Deployment могли исчезнуть или получить новый UID. Сравните текущие объекты с выданными исходными идентификаторами.


  ```bash

  jq ''.identities'' /run/dq/facts/0/admission-identities.json; kubectl get resourcequota/station deployment/board deployment/client -o custom-columns=KIND:.kind,NAME:.metadata.name,UID:.metadata.uid

  ```


  ### Сохранённые шаблоны нагрузок {#q126-station-retained-admission-templates}


  Шаблон board или client мог отклониться от контракта. Проверьте число реплик, исходный образ worker и пустое поле resources для значений admission.


  ```bash

  jq ''{replicas: .contract.replicas, images}'' /run/dq/facts/0/admission-identities.json; kubectl get deployments board client -o json | jq ''.items[] | {name: .metadata.name, replicas: .spec.replicas, worker: [.spec.template.spec.containers[] | select(.name == "worker") | {image,resources}]}''

  ```


  ### Готовая реплика board {#q126-station-board-ready-replica}


  Deployment board может ещё обновляться, или число готовых реплик отличается от одной. Проверьте текущее состояние.


  ```bash

  kubectl get deployment board -o jsonpath=''{.status.readyReplicas}''

  ```


  ### Запросы worker в созданных Pod {#q126-station-admitted-worker-requests}


  У worker ни в одном действующем Pod board могут не быть одновременно заданы запросы CPU 100m и памяти 16Mi. Проверьте spec созданного Pod.


  ```bash

  kubectl get pods -l app=board -o json | jq ''.items[] | select(.metadata.deletionTimestamp == null) | .spec.containers[] | select(.name=="worker") | .resources.requests''

  ```


  ### Лимиты worker в созданных Pod {#q126-station-admitted-worker-limits}


  У worker ни в одном действующем Pod board могут не быть одновременно заданы лимиты CPU 200m и памяти 32Mi. Проверьте spec созданного Pod.


  ```bash

  kubectl get pods -l app=board -o json | jq ''.items[] | select(.metadata.deletionTimestamp == null) | .spec.containers[] | select(.name=="worker") | .resources.limits''

  ```


  ### Готовность worker в board {#q126-station-admitted-worker-readiness}


  Worker может быть не готов во всех действующих Pod board. Проверьте готовность контейнера в текущих Pod.


  ```bash

  kubectl get pods -l app=board -o json | jq ''.items[] | {name: .metadata.name, deleting: .metadata.deletionTimestamp, statuses: .status.containerStatuses}''

  ```


  ### Готовность и ресурсы одного Pod {#q126-station-admitted-single-example}


  Ожидаемые requests, limits и готовность могли оказаться в разных Pod. Найдите один действующий Pod board, у которого worker выполняет все три условия.


  ```bash

  kubectl get pods -l app=board -o json | jq ''.items[] | {name: .metadata.name, deleting: .metadata.deletionTimestamp, containers: .spec.containers, statuses: .status.containerStatuses}''

  ```


  ### Текущий созданный client {#q126-station-admitted-client}


  Rollout client может быть устаревшим, относиться к изменённой нагрузке или содержать текущий worker с другими ресурсами либо неготовым состоянием. Проверьте поколение Deployment, цепочку владения и созданный Pod.


  ```bash

  jq ''{identity: .identities["deployment/client"], image: .images.client, replicas: .contract.replicas, admitted: .contract.admitted}'' /run/dq/facts/0/admission-identities.json; kubectl get deployment client -o json | jq ''{uid: .metadata.uid, generation: .metadata.generation, observed: .status.observedGeneration, desired: .spec.replicas, ready: .status.readyReplicas}''; kubectl get replicasets,pods -o json | jq ''.items[] | {kind, name: .metadata.name, uid: .metadata.uid, owners: .metadata.ownerReferences, phase: .status.phase, statuses: .status.containerStatuses, workers: [.spec.containers[]? | select(.name=="worker") | {image,resources}]}''

  ```


  ### Фактическое потребление по квоте {#q126-station-observed-quota-usage}


  Контроллер квоты может ещё пересчитывать потребление, или ресурсы созданных нагрузок отличаются от бюджета. Когда board и client стабилизируются, сравните requests, limits и число Pod в status.used.


  ```bash

  kubectl get resourcequota station -o json | jq ''.status.used''

  ```


  ### Данные проверки созданных Pod {#q126-station-admitted-pods-observer}


  Проверка результата admission могла остановиться до вывода конкретного условия. Проверьте доступность данных квоты, нагрузок и созданных Pod.


  ```bash

  kubectl get resourcequota station; kubectl get deployments,replicasets,pods

  ```


  ### Фактический ответ board из client {#q126-station-admitted-board-http}


  Созданный client может не достучаться до board:8080 или получить ответ, отличный от north-126. Проверьте фактический запрос из client.


  ```bash

  kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080

  ```


  ### HTTP-порт Service board {#q127-metrics-board-service-port}


  В Service board может отсутствовать именованный порт http на TCP 8080. Проверьте параметры порта Service.


  ```bash

  kubectl get service board -o json | jq ''.spec.ports''

  ```


  ### Целевой порт Service board {#q127-metrics-board-target-port}


  targetPort в board может указывать на другой порт или на имя, которое не разрешается в TCP 8080 у всех текущих целевых Pod. Проверьте порты Service и контейнеров.


  ```bash

  kubectl get service board -o json | jq ''.spec.ports''; kubectl get pods -l app=board -o json | jq ''.items[] | {name: .metadata.name, ports: [.spec.containers[].ports]}''

  ```


  ### Селектор Service board {#q127-metrics-board-selector}


  Селектор Service может пропускать нужный Pod board или выбирать другую нагрузку. Проверьте app: board и сравните полный селектор с текущими метками Pod.


  ```bash

  kubectl get service board -o json | jq ''.spec.selector''; kubectl get pods --show-labels

  ```


  ### Данные проверки Service board {#q127-metrics-board-observer-input}


  Проверка могла остановиться до вывода конкретного условия. Убедитесь, что Service board и текущие нагрузки доступны для чтения.


  ```bash

  kubectl get service board; kubectl get deployments,replicasets,pods

  ```


  ### Сохранённые идентификаторы нагрузок наблюдателей {#q127-metrics-retained-observer-identity}


  Выданный Service или нагрузка могла стать недоступной для чтения, быть пересоздана или использовать другой образ. Сравните текущие объекты и образы worker с исходной записью.


  ```bash

  jq ''{serviceUID,deployments}'' /run/dq/facts/0/observer-identities.json; kubectl get deployment board client observer-count observer-total -o custom-columns=NAME:.metadata.name,UID:.metadata.uid,IMAGE:.spec.template.spec.containers[*].image; kubectl get service board -o jsonpath=''{.metadata.uid}''; kubectl get replicaset,pod -o json | jq ''.items[] | {kind, name: .metadata.name, uid: .metadata.uid, owner: .metadata.ownerReferences, workers: [.spec.containers[]? | {name,image}]}''

  ```


  ### Сохранённая программа наблюдателей {#q127-metrics-retained-observer-program}


  ConfigMap метрик или программы мог быть заменён, программа могла измениться либо текущий worker запускает другую команду. Проверьте выданные ConfigMap, команду запуска и хеш смонтированной программы.


  ```bash

  jq ''{metricsUID,programUID,programHash}'' /run/dq/facts/0/observer-identities.json; kubectl get configmaps board-metrics observer-program -o custom-columns=NAME:.metadata.name,UID:.metadata.uid; kubectl get configmap observer-program -o json | jq -jr ''.data["poll.sh"]'' | sha256sum; kubectl get deployments observer-count observer-total -o json | jq ''.items[] | {name: .metadata.name, launch: [.spec.template.spec.containers[] | select(.name=="worker") | .command]}''; for name in observer-count observer-total; do kubectl exec "deployment/$name" -c worker -- sha256sum /opt/observer/poll.sh; done

  ```


  ### Параметры наблюдателя в шаблоне {#q127-metrics-observer-environment-template}


  Шаблон Deployment может задавать другие параметры запроса наблюдателя. Сверьте PROMETHEUS_URL, METRIC, ROUTE, JOB и OPERATION каждого наблюдателя с выданным контрактом.


  ```bash

  jq ''{intent, operations: [.contract.consumers[] | {deployment,operation}]}'' /run/dq/facts/0/observer-identities.json; kubectl get deployments observer-count observer-total -o json | jq ''.items[] | {name: .metadata.name, env: [.spec.template.spec.containers[] | select(.name=="worker") | {env,envFrom}]}''

  ```


  ### Фактическое окружение наблюдателя {#q127-metrics-observer-current-environment}


  Текущий готовый Pod наблюдателя может быть недоступен, или окружение worker отличается от ожидаемого. Проверьте цепочку владения и повторите проверку в живом Pod.


  ```bash

  jq ''{intent, operations: [.contract.consumers[] | {deployment,operation}]}'' /run/dq/facts/0/observer-identities.json; kubectl get deployments,replicasets,pods -o wide; for name in observer-count observer-total; do kubectl exec "deployment/$name" -c worker -- sh -c ''printf "%s\n" "$PROMETHEUS_URL" "$METRIC" "$ROUTE" "$JOB" "$OPERATION"''; done

  ```


  ### Статус запроса Prometheus {#q127-metrics-query-status}


  Запрос Prometheus из сообщения мог не дойти до сервера или вернуть ошибку. Проверьте выданный адрес из client и повторите запрос из сообщения, чтобы увидеть status success.


  ```bash

  url=$(jq -er .url /run/dq/facts/0/prometheus-target.json); for query in up%7Bjob%3D%22board%22%7D sum%28station_queue_depth%7Bjob%3D%22board%22%2Croute%3D%22north%22%7D%29 count%28station_queue_depth%7Bjob%3D%22board%22%2Croute%3D%22north%22%7D%29; do kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/query?query=$query"; done

  ```


  ### Число результатов запроса Prometheus {#q127-metrics-query-vector-cardinality}


  Запрос из сообщения может вернуть ноль записей или больше одной. Проверьте фильтры job и route и убедитесь, что указанный запрос возвращает одну запись.


  ```bash

  url=$(jq -er .url /run/dq/facts/0/prometheus-target.json); for query in up%7Bjob%3D%22board%22%7D sum%28station_queue_depth%7Bjob%3D%22board%22%2Croute%3D%22north%22%7D%29 count%28station_queue_depth%7Bjob%3D%22board%22%2Croute%3D%22north%22%7D%29; do kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/query?query=$query" | jq ''.data.result | length''; done

  ```


  ### Фактическое значение метрики Prometheus {#q127-metrics-query-observed-value}


  Запрос из сообщения мог вернуть другое значение. Сравните up с 1, sum с 7 или count с 2 в зависимости от указанного запроса.


  ```bash

  url=$(jq -er .url /run/dq/facts/0/prometheus-target.json); for query in up%7Bjob%3D%22board%22%7D sum%28station_queue_depth%7Bjob%3D%22board%22%2Croute%3D%22north%22%7D%29 count%28station_queue_depth%7Bjob%3D%22board%22%2Croute%3D%22north%22%7D%29; do kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/query?query=$query" | jq ''.data.result[0].value[1]''; done

  ```


  ### Состояние активной цели board {#q127-metrics-active-board-target}


  У Prometheus может не быть активной цели board со статусом up и пустым lastError. Проверьте список активных целей и ошибку сбора.


  ```bash

  url=$(jq -er .url /run/dq/facts/0/prometheus-target.json); kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/targets?state=active" | jq ''.data.activeTargets[] | {job: .labels.job, health, lastError}''

  ```


  ### Результат, который отдаёт наблюдатель {#q127-metrics-observer-result-delivery}


  У наблюдателя может не быть текущего готового worker, или он публикует устаревший либо неверный результат. Проверьте локальный ответ каждого наблюдателя: count должен показать 2, sum — 7.


  ```bash

  jq ''.contract.consumers[] | {deployment,operation,expected}'' /run/dq/facts/0/observer-identities.json; for name in observer-count observer-total; do kubectl rollout status "deployment/$name" --timeout=10s; kubectl exec "deployment/$name" -c worker -- wget -qO- -T 2 http://127.0.0.1:8080; done

  ```


  ### Прогресс опроса наблюдателя {#q127-metrics-observer-poll-progress}


  Счётчик наблюдений мог остановиться. Прочитайте /tmp/observations дважды в одном текущем worker и убедитесь, что при опросе он растёт.


  ```bash

  for name in observer-count observer-total; do kubectl rollout status "deployment/$name" --timeout=10s; pod=$(kubectl get pods -l "app=$name" -o json | jq -er ''[.items[] | select(.metadata.deletionTimestamp==null and any(.status.conditions[]?; .type=="Ready" and .status=="True")) | .metadata.name] | if length==1 then .[0] else error("expected one current Ready Pod") end'') || continue; kubectl exec "$pod" -c worker -- cat /tmp/observations; sleep 1.1; kubectl exec "$pod" -c worker -- cat /tmp/observations; done

  ```


  ### Данные проверки доставки результата {#q127-metrics-observer-delivery-input}


  Проверка доставки могла остановиться до вывода конкретного условия. Проверьте доступность адреса Prometheus и Pod клиента и наблюдателей.


  ```bash

  test -s /run/dq/facts/0/prometheus-target.json; kubectl get deployment client observer-count observer-total

  ```

  '
