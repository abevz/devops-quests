heading: Admission-Budgets und Metriken
text: '# Admission-Budgets und Metriken


  ResourceQuota zählt alle zugelassenen Namespace-Verbraucher. LimitRange liefert Standards bei Admission; Änderungen schreiben bestehende Pods nicht um. Ersatz oder Surge benötigt eventuell Budget, während ältere Pods es noch belegen. Vergleiche Nutzung, beide Vorlagen, zugelassene Ressourcen und ReplicaSet-Bedingungsmeldungen. Koordiniere Generationen im festen Budget. CPU-Standards und aktueller zugelassener Speicher beweisen weder Verlauf noch Knotenkapazität.


  In Quest 127 haben Scrape-Transport, Labels gespeicherter Reihen und nachgelagerte Abfrageabsicht verschiedene Lebensdauern. Ein Gauge beschreibt einen aktuellen Wert; count und sum müssen den beabsichtigten Reihenbereich verwenden. Gesunde Scrape-Ziele aktualisieren keine alte Verbraucherkonfiguration. Verfolge Exporter, privates Prometheus und beide Abfrageverbraucher: gewünschte Eingaben, aktuelle Pod-Umgebung, bereitgestelltes Polling-Programm, geliefertes Aggregat und steigenden Beobachtungszähler. Aktuelle Snapshots und Fortschritt belegen aktuellen Betrieb, nicht den gesamten Anfrageverlauf.


  Quellen: [LimitRange](https://kubernetes.io/docs/concepts/policy/limit-range/), [ResourceQuota](https://kubernetes.io/docs/concepts/policy/resource-quotas/), [Prometheus-Abfragen](https://prometheus.io/docs/prometheus/latest/querying/basics/).


  Prüfe in Quest 126 den Admission-Zustand:


  ```sh

  cd ~/quest

  cat admission-contract.json

  kubectl get resourcequota station -o yaml

  kubectl get limitrange defaults -o yaml

  kubectl get deployment,replicaset,pods -o yaml

  ```


  Prüfe in Quest 127 den Service und frage up beim privaten Prometheus ab:


  ```sh

  cd ~/quest

  kubectl get service board -o yaml

  url=$(jq -r .url prometheus-target.json)

  kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/query?query=up%7Bjob%3D%22board%22%7D"

  cat observer-contract.json

  kubectl get deployment,configmap,pods -o yaml

  ```


  Unterscheide in Quest 121 einen Admission-Transportfehler von einer ausdrücklichen Ablehnung durch die Richtlinie. Eine Steuerungsquittung bestätigt nur die begrenzte Anfrage, nicht die Zulassung eines Anwendungsdatensatzes. API-Veröffentlichung und Datenübernahme haben verschiedene Lebenszeiten: Die Umgebung wird beim Prozessstart erfasst; ein subPath-Mount behält seine ursprüngliche Dateibindung. Vergleiche den geschützten Datensatz und Schlüssel mit gewünschten Workload-Referenzen, aktuellen zugehörigen Pods, tatsächlichen Eingaben und Antworten. Unveränderte Zwischendaten dienen als Kontrolle und ersetzen die Übernahme der geprüften Quelle nicht. Bewahre die private Vertrauens- und Fail-closed-Grenze bei akzeptierten und abgelehnten serverseitigen Dry-runs. Der aktuelle Zustand belegt nicht die vollständige Anfragenhistorie.


  ### Ein Validierungswebhook {#q121-admission-single-webhook}


  Die Übungskonfiguration fehlt möglicherweise oder enthält zusätzliche Webhooks. Prüfen Sie, ob sie genau einen Eintrag enthält.


  ```bash

  kubectl get validatingwebhookconfiguration "dq-webhook-${DQ_NAMESPACE#dq-}" -o json | jq ''.webhooks | length''

  ```


  ### Name des Validierungswebhooks {#q121-admission-webhook-identity}


  Der Webhook-Eintrag wurde möglicherweise umbenannt oder ersetzt. Prüfen Sie die aktive Konfiguration auf route.training.devops-quests.local.


  ```bash

  kubectl get validatingwebhookconfiguration "dq-webhook-${DQ_NAMESPACE#dq-}" -o json | jq -r ''.webhooks[0].name''

  ```


  ### Fehlerrichtlinie des Webhooks {#q121-admission-failure-mode}


  Ein Workaround hat failurePolicy möglicherweise auf Ignore gesetzt. Behalten Sie Fail bei, damit ein unerreichbarer Webhook die Validierung nicht stillschweigend überspringt.


  ```bash

  kubectl get validatingwebhookconfiguration "dq-webhook-${DQ_NAMESPACE#dq-}" -o json | jq -r ''.webhooks[0].failurePolicy''

  ```


  ### Zeitlimit des Webhooks in Sekunden {#q121-admission-timeout-seconds}


  Der Webhook-Timeout wurde möglicherweise beim Prüfen der Erreichbarkeit geändert. Prüfen Sie, ob timeoutSeconds weiterhin 2 beträgt.


  ```bash

  kubectl get validatingwebhookconfiguration "dq-webhook-${DQ_NAMESPACE#dq-}" -o json | jq ''.webhooks[0].timeoutSeconds''

  ```


  ### Adresse des Validierungsendpunkts {#q121-admission-validation-endpoint}


  Der Validator verweist möglicherweise noch auf den stillgelegten Pfad oder eine andere Adresse. Prüfen Sie die HTTPS-URL des Übungs-Webhooks auf Port 8443 mit /validate.


  ```bash

  kubectl get validatingwebhookconfiguration "dq-webhook-${DQ_NAMESPACE#dq-}" -o json | jq -r ''.webhooks[0].clientConfig.url''

  ```


  ### Zertifizierungsstelle für die Validierung {#q121-admission-certificate-authority}


  Das CA-Bundle fehlt möglicherweise, ist fehlerhaft oder enthält ein anderes Zertifikat. Vergleichen Sie das einzelne dekodierte Zertifikat mit admission-ca.pem.


  ```bash

  kubectl get validatingwebhookconfiguration "dq-webhook-${DQ_NAMESPACE#dq-}" -o json | jq -er ''.webhooks[0].clientConfig.caBundle'' | base64 -d | openssl x509 -noout -fingerprint -sha256; openssl x509 -in admission-ca.pem -noout -fingerprint -sha256

  ```


  ### Vom Webhook erfasster Namespace {#q121-admission-sandbox-namespace-selector}


  Der Selektor lässt möglicherweise das Lauf- oder Installationslabel aus oder erfasst einen anderen Namespace. Vergleichen Sie ihn mit den zwei gelieferten Labels und behalten Sie den genauen Bereich bei.


  ```bash

  kubectl get namespace "$DQ_NAMESPACE" --show-labels; kubectl get validatingwebhookconfiguration "dq-webhook-${DQ_NAMESPACE#dq-}" -o json | jq ''.webhooks[0].namespaceSelector''

  ```


  ### Aktueller Routeneintrag {#q121-admission-current-route-record}


  Die aktive ConfigMap route enthält möglicherweise eine alte Route oder ist nicht lesbar. Prüfen Sie im tatsächlichen Objekt den Schlüssel route auf north-121.


  ```bash

  kubectl get configmap route -o json | jq -e ''.data.route == "north-121"''

  ```


  ### Akzeptierter serverseitiger Probelauf {#q121-admission-accepted-dry-run}


  Auch ein korrektes Objekt kann beim serverseitigen dry-run an einem unerreichbaren Webhook oder CA-Problem scheitern. Vergleichen Sie den dry-run mit dem aktiven route-Eintrag.


  ```bash

  kubectl get configmap route -o json | jq ''del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields)'' | kubectl apply --dry-run=server -f -

  ```


  ### Eingabe für den abgelehnten Probelauf {#q121-admission-denied-dry-run-input}


  Das route-Objekt fehlt möglicherweise oder enthält ungültiges JSON, sodass die Eingabe mit closed für den dry-run nicht entsteht. Prüfen Sie die Eingabe vor der Auswertung der Ablehnung.


  ```bash

  kubectl get configmap route -o json | jq ''.data.route="closed" | del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields)''

  ```


  ### Ablehnung einer geschlossenen Route {#q121-admission-reject-closed-route}


  Der geänderte Wert kann bei falschem Webhook-Bereich oder Pfad akzeptiert werden. Führen Sie den serverseitigen dry-run mit closed aus und prüfen Sie die Ablehnung.


  ```bash

  kubectl get configmap route -o json | jq ''.data.route="closed" | del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields)'' | kubectl apply --dry-run=server -f -

  ```


  ### Erwarteter Text der Validierungsablehnung {#q121-admission-exact-validation-denial}


  Ein allgemeiner TLS- oder Transportfehler kann den dry-run vor der Validierung abbrechen. Prüfen Sie die Fehlermeldung auf Station route must be north-121.


  ```bash

  kubectl get configmap route -o json | jq ''.data.route="closed" | del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields)'' | kubectl apply --dry-run=server -f -

  ```


  ### Bereite board-Replikate {#q121-admission-board-ready-count}


  Die wiederhergestellte Route kann zulässig sein, während der board-Worker noch startet oder nicht bereit ist. Prüfen Sie den Rollout und warten Sie auf eine bereite Replik.


  ```bash

  kubectl get deployment board -o jsonpath=''{.status.readyReplicas}''; kubectl get pods -l app=board

  ```


  ### Tatsächliche board-Antwort {#q121-admission-board-live-response}


  Ein erfolgreicher dry-run kann mit alter Ausgabe von board oder fehlender Erreichbarkeit einhergehen. Fragen Sie board aus client ab und vergleichen Sie die Antwort mit north-121.


  ```bash

  kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080

  ```


  ### Eingaben für die Webhook-Prüfung {#q121-admission-config-observer-input}


  Die Webhook-Prüfung kann vor der Meldung einer Bedingung abbrechen, wenn Werkzeuge oder Eingaben fehlen. Prüfen Sie lokale Werkzeuge, gelieferte CA und Namespace-Zugriff.


  ```bash

  command -v python3; test -r admission-ca.pem; kubectl get namespace "$DQ_NAMESPACE" -o name

  ```


  ### Erhaltene Identitäten der Verbraucher {#q121-admission-retained-consumer-identities}


  Eine gelieferte Arbeitslast wurde möglicherweise neu erstellt oder nutzt ein anderes Image in Vorlage oder Pods. Vergleichen Sie aktuelle UIDs und Images mit dem festgehaltenen Übernahmebeleg.


  ```bash

  jq ''.deployments'' /run/dq/facts/0/adoption-identities.json; kubectl get deployment board client route-env route-file -o custom-columns=NAME:.metadata.name,UID:.metadata.uid,IMAGE:.spec.template.spec.containers[*].image; kubectl get replicaset,pod -o json | jq ''.items[] | {kind, name: .metadata.name, uid: .metadata.uid, owner: .metadata.ownerReferences, workers: [.spec.containers[]? | {name,image}]}''

  ```


  ### Erhaltener vorbereiteter Eintrag {#q121-admission-preserved-staged-record}


  Eine Angleichung von staged-route an den zugelassenen Eintrag hat möglicherweise Daten oder UID geändert. Vergleichen Sie den vollständigen Staging-Eintrag mit dem Beleg und stellen Sie die Verbraucher auf route um.


  ```bash

  jq ''.staging | {uid: .metadata.uid, data, binaryData}'' /run/dq/facts/0/adoption-identities.json; kubectl get configmap staged-route -o json | jq ''{uid: .metadata.uid, data, binaryData}''

  ```


  ### Routeneintrag an der Quelle {#q121-admission-source-route-record}


  Die Verbraucher-Konfiguration fehlt möglicherweise oder ist alt. Prüfen Sie im tatsächlich zugelassenen route-Eintrag den Schlüssel route auf north-121.


  ```bash

  kubectl get configmap route -o json | jq -e ''.data.route == "north-121"''

  ```


  ### Aktuelle Verbraucher-Pods {#q121-admission-current-consumer-pods}


  Nach dem Rollout fehlt einem Verbraucher möglicherweise genau ein aktueller zugehöriger bereiter Pod. Prüfen Sie beide Deployments und ihre aktuellen Pods.


  ```bash

  kubectl get deployment route-env route-file -o wide; kubectl get replicasets,pods -l ''app in (route-env,route-file)'' -o wide

  ```


  ### Erhaltenes Startprogramm {#q121-admission-preserved-startup-program}


  Ein geänderter Startbefehl oder andere Argumente können eine falsche Eingabe verdecken. Vergleichen Sie gewünschtes und aktives Programm mit dem gelieferten und korrigieren Sie die Quellreferenz.


  ```bash

  jq ''.deployments | {env: .["route-env"], file: .["route-file"]}'' /run/dq/facts/0/adoption-identities.json; kubectl get deployment route-env route-file -o json | jq ''.items[] | {name: .metadata.name, startup: [.spec.template.spec.containers[] | {name,command,args}]}''; kubectl get pods -o json | jq ''.items[] | {name: .metadata.name, owner: .metadata.ownerReferences, startup: [.spec.containers[] | {name,command,args}]}''

  ```


  ### Verweis auf die übernommene Quelle {#q121-admission-adopted-config-reference}


  Ein Verbraucher verweist möglicherweise noch auf staged-route oder nutzt ein Literal oder eine mehrdeutige Datei-Projektion. Prüfen Sie route/route in Vorlage und aktuellem Pod über den eindeutigen ROUTE-Verweis oder einen schreibgeschützten Datei-Mount.


  ```bash

  kubectl get deployment route-env route-file -o json | jq ''.items[] | {name: .metadata.name, containers: .spec.template.spec.containers, volumes: .spec.template.spec.volumes}''

  kubectl get replicaset,pod -o json | jq ''.items[] | {kind, name: .metadata.name, uid: .metadata.uid, owners: .metadata.ownerReferences, containers: .spec.containers, volumes: .spec.volumes}''

  ```


  ### Tatsächliche Eingabe des Verbrauchers {#q121-admission-live-consumer-input}


  Die Konfiguration kann stimmen, obwohl ein laufender Verbraucher eine alte Variable oder Datei sieht. Lesen Sie ROUTE und /config/route und vergleichen Sie mit north-121.


  ```bash

  kubectl exec deployment/route-env -c worker -- printenv ROUTE; kubectl exec deployment/route-file -c worker -- cat /config/route

  ```


  ### Tatsächliche Ausgabe des Verbrauchers {#q121-admission-live-consumer-publication}


  Ein Verbraucher kann die richtige Eingabe lesen und dennoch alte Startdaten liefern. Fragen Sie Loopback in jedem aktuellen Verbraucher ab und vergleichen Sie mit north-121.


  ```bash

  for deployment_name in route-env route-file; do kubectl exec "deployment/$deployment_name" -c worker -- wget -qO- -T 2 http://127.0.0.1:8080; done

  ```


  ### Aktuelle Beobachtung der Verbraucher {#q121-admission-current-observation-failure}


  Die Prüfung kann Arbeitslast, Pod-Eingabe oder Antwort möglicherweise nicht im Zeitbudget lesen. Prüfen Sie die API und wiederholen Sie Beobachtungen separat vor der Bewertung der Übernahme.


  ```bash

  kubectl get deployment route-env route-file -o name; kubectl get pods -l ''app in (route-env,route-file)''

  ```


  ### Eingaben für die Übernahmeprüfung {#q121-admission-adoption-observer-input}


  Die Übernahmeprüfung kann vor der Meldung einer Bedingung abbrechen, wenn Prozess oder festgehaltene Eingaben fehlschlagen. Prüfen Sie Werkzeuge, Vertrag und Zugriff auf beide Verbraucher.


  ```bash

  command -v python3; test -r adoption-contract.json; kubectl get deployment route-env route-file -o name

  ```



  ### Feste Obergrenzen von station {#q126-station-quota-budget}


  Die ResourceQuota station fehlt möglicherweise oder ihre hard-Werte weichen ab. Prüfe CPU-Requests 200m, CPU-Limits 400m, Speicher-Requests 32Mi, Speicher-Limits 64Mi und 2 Pods.


  ```bash

  kubectl get resourcequota station -o json | jq ''.spec.hard''

  ```


  ### Eingaben für die Quotenprüfung {#q126-station-quota-observer}


  Die Quotenprüfung könnte vor Meldung einer Bedingung abgebrochen sein. Prüfe, ob die aktuelle ResourceQuota station lesbar ist.


  ```bash

  kubectl get resourcequota station -o json

  ```


  ### Standardlimit für CPU {#q126-station-limitrange-default}


  Im LimitRange defaults fehlt möglicherweise der Container-Eintrag oder sein Standardlimit für CPU weicht ab. Prüfe den Wert 200m.


  ```bash

  kubectl get limitrange defaults -o json | jq ''.spec.limits[] | select(.type=="Container") | .default.cpu''

  ```


  ### Standardrequest für CPU {#q126-station-limitrange-request}


  Im LimitRange defaults fehlt möglicherweise der Container-Eintrag oder sein Standardrequest für CPU weicht ab. Prüfe den Wert 100m.


  ```bash

  kubectl get limitrange defaults -o json | jq ''.spec.limits[] | select(.type=="Container") | .defaultRequest.cpu''

  ```


  ### Ressourceneinstellungen in der board-Vorlage {#q126-station-board-empty-resources}


  Die board-Vorlage setzt möglicherweise resources für worker oder worker fehlt. Lass resources in der Vorlage leer, damit die Zulassung Standardwerte einträgt.


  ```bash

  kubectl get deployment board -o json | jq ''.spec.template.spec.containers[] | select(.name=="worker") | .resources''

  ```


  ### Eingaben für die Zulassungsprüfung {#q126-station-admission-policy-observer}


  Die Richtlinienprüfung könnte vor Meldung einer Bedingung abgebrochen sein. Prüfe LimitRange, Quote und Deployments im Übungs-Namespace.


  ```bash

  kubectl get resourcequota station; kubectl get limitrange defaults; kubectl get deployment board client

  ```


  ### Erhaltene Identitäten von Quote und Deployments {#q126-station-retained-admission-objects}


  Eine geschützte ResourceQuota oder ein geschütztes Deployment fehlt möglicherweise oder hat eine andere UID. Vergleiche die aktuellen Objekte mit den bereitgestellten Identitätsdaten.


  ```bash

  jq ''.identities'' /run/dq/facts/0/admission-identities.json; kubectl get resourcequota/station deployment/board deployment/client -o custom-columns=KIND:.kind,NAME:.metadata.name,UID:.metadata.uid

  ```


  ### Erhaltene Workload-Vorlagen {#q126-station-retained-admission-templates}


  Die Vorlage von board oder client weicht möglicherweise vom Vertrag ab. Prüfe Replikatzahl, ursprüngliches worker-Image und das leere Feld resources für Zulassungsstandardwerte.


  ```bash

  jq ''{replicas: .contract.replicas, images}'' /run/dq/facts/0/admission-identities.json; kubectl get deployments board client -o json | jq ''.items[] | {name: .metadata.name, replicas: .spec.replicas, worker: [.spec.template.spec.containers[] | select(.name == "worker") | {image,resources}]}''

  ```


  ### Bereites board-Replikat {#q126-station-board-ready-replica}


  Das Deployment board ist möglicherweise noch im Abgleich oder die Zahl bereiter Replikate weicht von eins ab. Prüfe den aktuellen Zustand.


  ```bash

  kubectl get deployment board -o jsonpath=''{.status.readyReplicas}''

  ```


  ### worker-Requests in zugelassenen Pods {#q126-station-admitted-worker-requests}


  Möglicherweise hat kein board-Pod außerhalb der Beendigung für worker CPU-Requests von 100m und Speicher-Requests von 16Mi. Prüfe die zugelassene Pod-Spezifikation.


  ```bash

  kubectl get pods -l app=board -o json | jq ''.items[] | select(.metadata.deletionTimestamp == null) | .spec.containers[] | select(.name=="worker") | .resources.requests''

  ```


  ### worker-Limits in zugelassenen Pods {#q126-station-admitted-worker-limits}


  Möglicherweise hat kein board-Pod außerhalb der Beendigung für worker CPU-Limits von 200m und Speicher-Limits von 32Mi. Prüfe die zugelassene Pod-Spezifikation.


  ```bash

  kubectl get pods -l app=board -o json | jq ''.items[] | select(.metadata.deletionTimestamp == null) | .spec.containers[] | select(.name=="worker") | .resources.limits''

  ```


  ### Bereitschaft eines board-Workers {#q126-station-admitted-worker-readiness}


  worker ist möglicherweise in allen board-Pods außerhalb der Beendigung noch nicht bereit. Prüfe die Containerbereitschaft in den aktuellen Pods.


  ```bash

  kubectl get pods -l app=board -o json | jq ''.items[] | {name: .metadata.name, deleting: .metadata.deletionTimestamp, statuses: .status.containerStatuses}''

  ```


  ### Bereitschaft und Ressourcen im selben Pod {#q126-station-admitted-single-example}


  Die erwarteten Requests, Limits und die Bereitschaft verteilen sich möglicherweise auf verschiedene Pods. Prüfe einen board-Pod außerhalb der Beendigung, dessen worker alle drei Bedingungen erfüllt.


  ```bash

  kubectl get pods -l app=board -o json | jq ''.items[] | {name: .metadata.name, deleting: .metadata.deletionTimestamp, containers: .spec.containers, statuses: .status.containerStatuses}''

  ```


  ### Aktueller zugelassener client {#q126-station-admitted-client}


  Der Rollout von client ist möglicherweise veraltet, gehört zu einem geänderten Workload oder enthält einen aktuellen worker mit unerwarteten Ressourcen oder fehlender Bereitschaft. Prüfe Deployment-Generation, Eigentümerkette und zugelassenen Pod.


  ```bash

  jq ''{identity: .identities["deployment/client"], image: .images.client, replicas: .contract.replicas, admitted: .contract.admitted}'' /run/dq/facts/0/admission-identities.json; kubectl get deployment client -o json | jq ''{uid: .metadata.uid, generation: .metadata.generation, observed: .status.observedGeneration, desired: .spec.replicas, ready: .status.readyReplicas}''; kubectl get replicasets,pods -o json | jq ''.items[] | {kind, name: .metadata.name, uid: .metadata.uid, owners: .metadata.ownerReferences, phase: .status.phase, statuses: .status.containerStatuses, workers: [.spec.containers[]? | select(.name=="worker") | {image,resources}]}''

  ```


  ### Beobachtete Quotennutzung {#q126-station-observed-quota-usage}


  Der Quotencontroller gleicht den Zustand möglicherweise noch ab oder der Verbrauch der zugelassenen Workloads weicht vom Budget ab. Vergleiche Requests, Limits und Pods in status.used, sobald board und client stabil sind.


  ```bash

  kubectl get resourcequota station -o json | jq ''.status.used''

  ```


  ### Eingaben zur Prüfung zugelassener Pods {#q126-station-admitted-pods-observer}


  Die Beobachtung der Zulassung könnte vor Meldung einer Bedingung abgebrochen sein. Prüfe, ob Quoten, Workloads und zugelassene Pods lesbar sind.


  ```bash

  kubectl get resourcequota station; kubectl get deployments,replicasets,pods

  ```


  ### Tatsächliche board-Antwort aus client {#q126-station-admitted-board-http}


  Der zugelassene client erreicht board:8080 möglicherweise nicht oder erhält nicht die erwartete Antwort north-126. Prüfe die tatsächliche Anfrage aus client.


  ```bash

  kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080

  ```


  ### Von board veröffentlichter HTTP-Port {#q127-metrics-board-service-port}


  Dem Service board fehlt möglicherweise der benannte http-Port auf TCP 8080. Prüfe die Konfiguration des veröffentlichten Ports.


  ```bash

  kubectl get service board -o json | jq ''.spec.ports''

  ```


  ### Zielport des Service board {#q127-metrics-board-target-port}


  targetPort von board verweist möglicherweise auf den falschen Port oder einen Namen, der nicht in allen aktuellen Ziel-Pods zu TCP 8080 aufgelöst wird. Prüfe die Portangaben im Service und in den Containern.


  ```bash

  kubectl get service board -o json | jq ''.spec.ports''; kubectl get pods -l app=board -o json | jq ''.items[] | {name: .metadata.name, ports: [.spec.containers[].ports]}''

  ```


  ### Selektor des Service board {#q127-metrics-board-selector}


  Der Service-Selektor erfasst möglicherweise einen vorgesehenen board-Pod nicht oder trifft einen anderen Workload. Prüfe app: board und vergleiche den vollständigen Selektor mit den aktuellen Pod-Labels.


  ```bash

  kubectl get service board -o json | jq ''.spec.selector''; kubectl get pods --show-labels

  ```


  ### Eingaben zur Prüfung des Service board {#q127-metrics-board-observer-input}


  Die Beobachtung wurde möglicherweise vor Meldung einer Bedingung abgebrochen. Prüfe den Zugriff auf den Service board und aktuelle Workloads.


  ```bash

  kubectl get service board; kubectl get deployments,replicasets,pods

  ```


  ### Erhaltene Identitäten der Beobachter-Workloads {#q127-metrics-retained-observer-identity}


  Ein bereitgestellter Service oder Workload ist möglicherweise nicht lesbar, wurde ersetzt oder verwendet ein anderes Image. Vergleiche aktuelle Objekte und worker-Images mit den erfassten Identitäten.


  ```bash

  jq ''{serviceUID,deployments}'' /run/dq/facts/0/observer-identities.json; kubectl get deployment board client observer-count observer-total -o custom-columns=NAME:.metadata.name,UID:.metadata.uid,IMAGE:.spec.template.spec.containers[*].image; kubectl get service board -o jsonpath=''{.metadata.uid}''; kubectl get replicaset,pod -o json | jq ''.items[] | {kind, name: .metadata.name, uid: .metadata.uid, owner: .metadata.ownerReferences, workers: [.spec.containers[]? | {name,image}]}''

  ```


  ### Erhaltenes Beobachterprogramm {#q127-metrics-retained-observer-program}


  Die Metrik- oder Programm-ConfigMap wurde möglicherweise ersetzt, das Programm weicht ab oder der aktuelle worker startet einen anderen Befehl. Prüfe bereitgestellte ConfigMaps, Startbefehl und Hash des eingehängten Programms.


  ```bash

  jq ''{metricsUID,programUID,programHash}'' /run/dq/facts/0/observer-identities.json; kubectl get configmaps board-metrics observer-program -o custom-columns=NAME:.metadata.name,UID:.metadata.uid; kubectl get configmap observer-program -o json | jq -jr ''.data["poll.sh"]'' | sha256sum; kubectl get deployments observer-count observer-total -o json | jq ''.items[] | {name: .metadata.name, launch: [.spec.template.spec.containers[] | select(.name=="worker") | .command]}''; for name in observer-count observer-total; do kubectl exec "deployment/$name" -c worker -- sha256sum /opt/observer/poll.sh; done

  ```


  ### Beobachterparameter in der Vorlage {#q127-metrics-observer-environment-template}


  Die Deployment-Vorlage löst möglicherweise andere Abfrageparameter auf. Vergleiche PROMETHEUS_URL, METRIC, ROUTE, JOB und OPERATION jedes Beobachters mit den bereitgestellten Vorgaben.


  ```bash

  jq ''{intent, operations: [.contract.consumers[] | {deployment,operation}]}'' /run/dq/facts/0/observer-identities.json; kubectl get deployments observer-count observer-total -o json | jq ''.items[] | {name: .metadata.name, env: [.spec.template.spec.containers[] | select(.name=="worker") | {env,envFrom}]}''

  ```


  ### Tatsächliche Umgebung des Beobachters {#q127-metrics-observer-current-environment}


  Ein aktueller bereiter Beobachter-Pod ist möglicherweise nicht verfügbar oder die worker-Umgebung weicht von den erwarteten Vorgaben ab. Prüfe die Eigentümerkette und wiederhole die Beobachtung im Pod.


  ```bash

  jq ''{intent, operations: [.contract.consumers[] | {deployment,operation}]}'' /run/dq/facts/0/observer-identities.json; kubectl get deployments,replicasets,pods -o wide; for name in observer-count observer-total; do kubectl exec "deployment/$name" -c worker -- sh -c ''printf "%s\n" "$PROMETHEUS_URL" "$METRIC" "$ROUTE" "$JOB" "$OPERATION"''; done

  ```


  ### Status der Prometheus-Abfrage {#q127-metrics-query-status}


  Die angegebene Prometheus-Abfrage war möglicherweise nicht erreichbar oder lieferte einen Fehler. Prüfe den Endpunkt aus client und wiederhole die in der Meldung genannte Abfrage auf status success.


  ```bash

  url=$(jq -er .url /run/dq/facts/0/prometheus-target.json); for query in up%7Bjob%3D%22board%22%7D sum%28station_queue_depth%7Bjob%3D%22board%22%2Croute%3D%22north%22%7D%29 count%28station_queue_depth%7Bjob%3D%22board%22%2Croute%3D%22north%22%7D%29; do kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/query?query=$query"; done

  ```


  ### Anzahl der Prometheus-Ergebnisse {#q127-metrics-query-vector-cardinality}


  Die angegebene Abfrage liefert möglicherweise keinen oder mehr als einen Eintrag. Prüfe job- und route-Filter und bestätige genau ein Ergebnis für diese Abfrage.


  ```bash

  url=$(jq -er .url /run/dq/facts/0/prometheus-target.json); for query in up%7Bjob%3D%22board%22%7D sum%28station_queue_depth%7Bjob%3D%22board%22%2Croute%3D%22north%22%7D%29 count%28station_queue_depth%7Bjob%3D%22board%22%2Croute%3D%22north%22%7D%29; do kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/query?query=$query" | jq ''.data.result | length''; done

  ```


  ### Beobachteter Prometheus-Messwert {#q127-metrics-query-observed-value}


  Die angegebene Abfrage lieferte möglicherweise einen anderen Messwert. Vergleiche je nach Meldung up mit 1, sum mit 7 oder count mit 2.


  ```bash

  url=$(jq -er .url /run/dq/facts/0/prometheus-target.json); for query in up%7Bjob%3D%22board%22%7D sum%28station_queue_depth%7Bjob%3D%22board%22%2Croute%3D%22north%22%7D%29 count%28station_queue_depth%7Bjob%3D%22board%22%2Croute%3D%22north%22%7D%29; do kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/query?query=$query" | jq ''.data.result[0].value[1]''; done

  ```


  ### Zustand des aktiven board-Ziels {#q127-metrics-active-board-target}


  Prometheus hat möglicherweise kein aktives board-Ziel mit health up und leerem lastError. Prüfe die aktiven Ziele und den Scrape-Fehler.


  ```bash

  url=$(jq -er .url /run/dq/facts/0/prometheus-target.json); kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/targets?state=active" | jq ''.data.activeTargets[] | {job: .labels.job, health, lastError}''

  ```


  ### Vom Beobachter geliefertes Ergebnis {#q127-metrics-observer-result-delivery}


  Ein Beobachter hat möglicherweise keinen aktuellen bereiten worker oder liefert ein veraltetes oder falsches Ergebnis. Prüfe lokal die Antwort jedes Beobachters, wobei count 2 und sum 7 ergeben muss.


  ```bash

  jq ''.contract.consumers[] | {deployment,operation,expected}'' /run/dq/facts/0/observer-identities.json; for name in observer-count observer-total; do kubectl rollout status "deployment/$name" --timeout=10s; kubectl exec "deployment/$name" -c worker -- wget -qO- -T 2 http://127.0.0.1:8080; done

  ```


  ### Fortschritt der Beobachterabfragen {#q127-metrics-observer-poll-progress}


  Der Beobachtungszähler steht möglicherweise still. Lies /tmp/observations zweimal im selben aktuellen worker und bestätige den Anstieg während der Abfragen.


  ```bash

  for name in observer-count observer-total; do kubectl rollout status "deployment/$name" --timeout=10s; pod=$(kubectl get pods -l "app=$name" -o json | jq -er ''[.items[] | select(.metadata.deletionTimestamp==null and any(.status.conditions[]?; .type=="Ready" and .status=="True")) | .metadata.name] | if length==1 then .[0] else error("expected one current Ready Pod") end'') || continue; kubectl exec "$pod" -c worker -- cat /tmp/observations; sleep 1.1; kubectl exec "$pod" -c worker -- cat /tmp/observations; done

  ```


  ### Eingaben zur Prüfung der Ergebnisauslieferung {#q127-metrics-observer-delivery-input}


  Die Prüfung der Ergebnisauslieferung wurde möglicherweise vor Meldung einer Bedingung abgebrochen. Prüfe die Verfügbarkeit des Prometheus-Endpunkts sowie der Client- und Beobachter-Pods.


  ```bash

  test -s /run/dq/facts/0/prometheus-target.json; kubectl get deployment client observer-count observer-total

  ```

  '
