heading: Admission-Budgets und Metriken
text: |
  # Admission-Budgets und Metriken

  ResourceQuota zählt alle zugelassenen Namespace-Verbraucher. LimitRange liefert Standards bei Admission; Änderungen schreiben bestehende Pods nicht um. Ersatz oder Surge benötigt eventuell Budget, während ältere Pods es noch belegen. Vergleiche Nutzung, beide Vorlagen, zugelassene Ressourcen und ReplicaSet-Bedingungsmeldungen. Koordiniere Generationen im festen Budget. CPU-Standards und aktueller zugelassener Speicher beweisen weder Verlauf noch Knotenkapazität.

  In Quest 127 bildet ein Service seinen Port auf einen Zielport passender Pods ab. Prometheus fragt periodisch einen konfigurierten Endpunkt ab und speichert Zeitreihen, die durch Labels unterschieden werden. Ein Gauge ist ein aktueller Wert: nutze `sum` und `count` für `station_queue_depth{job="board",route="north"}` statt `rate`. Prüfe `metrics.yaml`, Service und `prometheus-target.json`, korrigiere den Port und warte auf einen Scrape. Frage `up`, Gauge-Summe und -Anzahl sowie Target-Gesundheit über die private URL ab. Ein bereiter Pod allein beweist weder Scrape noch gespeicherte Metrik. Aktuelle Ergebnisse beweisen nicht, welche Änderung gemacht wurde.

  Quellen: [LimitRange](https://kubernetes.io/docs/concepts/policy/limit-range/), [ResourceQuota](https://kubernetes.io/docs/concepts/policy/resource-quotas/), [Prometheus-Abfragen](https://prometheus.io/docs/prometheus/latest/querying/basics/).

  Prüfe in Quest 126 den Admission-Zustand:

  ```sh
  cd ~/quest
  cat admission-contract.json
  kubectl get resourcequota station -o yaml
  kubectl get limitrange defaults -o yaml
  kubectl get deployment,replicaset,pods -o yaml
  ```

  Prüfe in Quest 127 den Service und frage up beim privaten Prometheus ab:

  ```sh
  cd ~/quest
  kubectl get service board -o yaml
  url=$(jq -r .url prometheus-target.json)
  kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/query?query=up%7Bjob%3D%22board%22%7D"
  ```

  In Aufgabe 121 weist Fail-closed-Admission Anfragen zurück, wenn der Validating-Webhook nicht erreichbar ist; das unterscheidet sich von einer ausdrücklichen Ablehnung. Fordere die begrenzte Restore-Path-Reparatur an, ohne die schreibgeschützte Konfiguration zu ändern; erhalte CA und Namespace-Geltungsbereich und wende north-121 an. Prüfe Bereitschaft und HTTP sowie anschließend per serverseitigem Dry-Run die gültige Route und die Ablehnung von closed.
