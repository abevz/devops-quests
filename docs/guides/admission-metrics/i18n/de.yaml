heading: Admission-Budgets und Metriken
text: '# Admission-Budgets und Metriken


  Nutze nur die Offline-Umgebung. Eine LimitRange kann Ressourcen-Requests und -Limits eines neuen Containers vorbelegen; eine ResourceQuota begrenzt das Gesamtbudget des Namespace. Admission wendet Standards auf neue, nicht auf bestehende Pods an. Prüfe in Quest 126 die bereitgestellte Quota, Defaults und ressourcenfreie Deployment-Vorlage sowie ReplicaSet-Ereignisse. Korrigiere die CPU-Standards, erstelle den Pod über das Deployment neu und prüfe CPU und Speicher des tatsächlich zugelassenen Pods. Eine Quota garantiert keine Node-Kapazität und diese Prüfung kontrolliert nicht die aktuellen LimitRange-Speicherstandards.


  In Quest 127 bildet ein Service seinen Port auf einen Zielport passender Pods ab. Prometheus fragt periodisch einen konfigurierten Endpunkt ab und speichert Zeitreihen, die durch Labels unterschieden werden. Ein Gauge ist ein aktueller Wert: nutze `sum` und `count` für `station_queue_depth{job="board",route="north"}` statt `rate`. Prüfe `metrics.json`, Service und `prometheus-target.json`, korrigiere den Port und warte auf einen Scrape. Frage `up`, Gauge-Summe und -Anzahl sowie Target-Gesundheit über die private URL ab. Ein bereiter Pod allein beweist weder Scrape noch gespeicherte Metrik. Aktuelle Ergebnisse beweisen nicht, welche Änderung gemacht wurde.


  Quellen: [LimitRange](https://kubernetes.io/docs/concepts/policy/limit-range/), [ResourceQuota](https://kubernetes.io/docs/concepts/policy/resource-quotas/), [Prometheus-Abfragen](https://prometheus.io/docs/prometheus/latest/querying/basics/).


  Prüfe in Quest 126 den Admission-Zustand:


  ```sh

  cd ~/quest

  kubectl describe resourcequota station

  kubectl get limitrange defaults -o yaml

  kubectl describe rs

  kubectl get pods -l app=board -o yaml

  ```


  Skaliere nach Korrektur der CPU-Standards board auf null. Warte, bis keine Board-Pods mehr vorhanden sind und seine ReplicaSets null Replikate anfordern; das gibt die feste Quota frei und unterbricht den Dienst kurz. Starte dann das Deployment neu und skaliere wieder auf ein Replikat:


  ```sh

  kubectl scale deployment/board --replicas=0

  kubectl get pods -l app=board

  kubectl get replicasets -l app=board

  ```


  Wiederhole beide `kubectl get`-Befehle, bis keine Board-Pods mehr vorhanden sind und die Spalte DESIRED bei jedem Board-ReplicaSet null ist. Führe erst dann die folgenden Befehle aus:


  ```sh

  kubectl rollout restart deployment/board

  kubectl scale deployment/board --replicas=1

  kubectl rollout status deployment/board --timeout=90s

  ```


  Prüfe in Quest 127 den Service und frage up beim privaten Prometheus ab:


  ```sh

  cd ~/quest

  kubectl get service board -o yaml

  url=$(jq -r .url prometheus-target.json)

  kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/query?query=up%7Bjob%3D%22board%22%7D"

  ```


  In Aufgabe 121 weist Fail-closed-Admission Anfragen zurück, wenn der Validating-Webhook nicht erreichbar ist; das unterscheidet sich von einer ausdrücklichen Ablehnung. Fordere die begrenzte Restore-Path-Reparatur an, ohne die schreibgeschützte Konfiguration zu ändern; erhalte CA und Namespace-Geltungsbereich und wende north-121 an. Prüfe Bereitschaft und HTTP sowie anschließend per serverseitigem Dry-Run die gültige Route und die Ablehnung von closed.

  '
