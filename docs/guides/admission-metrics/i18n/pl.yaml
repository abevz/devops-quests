heading: Budżety admission i metryki
text: '# Budżety admission i metryki


  ResourceQuota uwzględnia wszystkich przyjętych odbiorców namespace. LimitRange nadaje defaults przy admission;
  zmiana nie przepisuje istniejących Podów. Zastąpienie lub surge może wymagać budżetu, gdy stare Pody nadal go
  zajmują. Porównuj zużycie, oba szablony, przyjęte zasoby i komunikaty ReplicaSet. Koordynuj generacje w stałym
  budżecie. CPU defaults i bieżąca przyjęta pamięć nie dowodzą historii ani pojemności węzła.


  W zadaniu 127 transport scrape, etykiety zapisanych szeregów i intencja dalszych zapytań mają różne czasy życia.
  Gauge opisuje bieżącą wartość; count i sum muszą dotyczyć zamierzonego zakresu szeregów. Sprawne cele scrape nie
  aktualizują starej konfiguracji odbiorcy. Śledź exporter, prywatny Prometheus i obu odbiorców: żądane wejścia,
  środowisko bieżącego Poda, dostarczony program, publikowany agregat i rosnący licznik. Bieżące migawki i postęp
  potwierdzają aktualną pracę, nie pełną historię żądań.


  Źródła: [LimitRange](https://kubernetes.io/docs/concepts/policy/limit-range/), [ResourceQuota](https://kubernetes.io/docs/concepts/policy/resource-quotas/),
  [zapytania Prometheus](https://prometheus.io/docs/prometheus/latest/querying/basics/).


  W zadaniu 126 sprawdź stan admission:


  ```sh

  cd ~/quest

  cat admission-contract.json

  kubectl get resourcequota station -o yaml

  kubectl get limitrange defaults -o yaml

  kubectl get deployment,replicaset,pods -o yaml

  ```


  W zadaniu 127 sprawdź Service i zapytaj prywatny Prometheus o up:


  ```sh

  cd ~/quest

  kubectl get service board -o yaml

  url=$(jq -r .url prometheus-target.json)

  kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/query?query=up%7Bjob%3D%22board%22%7D"

  cat observer-contract.json

  kubectl get deployment,configmap,pods -o yaml

  ```


  W zadaniu 121 odróżnij błąd transportu admission od jawnego odrzucenia przez politykę. Potwierdzenie sterowania
  dotyczy tylko ograniczonego żądania, nie dopuszczenia rekordu aplikacji. Publikacja przez API i przyjęcie danych
  przez odbiorców mają różne czasy życia: środowisko jest przechwytywane przy starcie procesu, a montowanie subPath
  zachowuje pierwotne powiązanie pliku. Porównaj chroniony rekord i klucz z żądanymi referencjami obciążeń, ich
  bieżącymi Podami, rzeczywistymi wejściami i odpowiedziami. Zachowane dane przejściowe są kontrolą, nie zastępują
  przyjęcia sprawdzanego źródła. Zachowaj prywatną granicę zaufania i fail-closed podczas zaakceptowanych i odrzuconych
  serwerowych dry-runs. Bieżący stan nie dowodzi pełnej historii żądań.'
