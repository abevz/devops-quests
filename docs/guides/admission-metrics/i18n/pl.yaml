heading: Budżety admission i metryki
text: '# Budżety admission i metryki


  Używaj tylko zatoki offline. LimitRange może ustawić domyślne żądania i limity zasobów nowego kontenera; ResourceQuota ogranicza łączny budżet namespace. Admission stosuje wartości domyślne do nowych Podów, nie istniejących. W zadaniu 126 sprawdź dostarczone quota, defaults i szablon Deployment bez zasobów oraz przeczytaj zdarzenia ReplicaSetu. Popraw domyślne CPU, odtwórz Pod przez Deployment i sprawdź CPU i pamięć faktycznie przyjętego Poda. Quota nie gwarantuje zasobów węzła, a ta kontrola nie sprawdza bieżących domyślnych wartości pamięci LimitRange.


  W zadaniu 127 Service mapuje swój port na port docelowy pasujących Podów. Prometheus okresowo pobiera skonfigurowany endpoint i zapisuje serie czasowe rozróżniane etykietami. Gauge jest wartością bieżącą: użyj `sum` i `count` dla `station_queue_depth{job="board",route="north"}`, a nie `rate`. Sprawdź `metrics.json`, Service i `prometheus-target.json`, popraw port i poczekaj na pobranie. Zapytaj o `up`, sumę i liczbę gauge oraz stan targetu przez prywatny URL. Sam gotowy Pod nie dowodzi pobrania ani zapisanej metryki. Bieżące wyniki nie dowodzą rodzaju zmiany.


  Źródła: [LimitRange](https://kubernetes.io/docs/concepts/policy/limit-range/), [ResourceQuota](https://kubernetes.io/docs/concepts/policy/resource-quotas/), [zapytania Prometheus](https://prometheus.io/docs/prometheus/latest/querying/basics/).


  W zadaniu 126 sprawdź stan admission:


  ```sh

  cd ~/quest

  kubectl describe resourcequota station

  kubectl get limitrange defaults -o yaml

  kubectl describe rs

  kubectl get pods -l app=board -o yaml

  ```


  Po poprawieniu domyślnych wartości CPU skaluj board do zera. Poczekaj, aż nie będzie Podów board, a jego ReplicaSety będą żądać zera replik; zwolni to stałą quota i na chwilę przerwie usługę. Następnie uruchom Deployment ponownie i skaluj do jednej repliki:


  ```sh

  kubectl scale deployment/board --replicas=0

  kubectl get pods -l app=board

  kubectl get replicasets -l app=board

  ```


  Powtarzaj oba polecenia `kubectl get`, aż nie będzie Podów board, a kolumna DESIRED będzie równa zero dla każdego ReplicaSet board. Dopiero wtedy wykonaj następujące polecenia:


  ```sh

  kubectl rollout restart deployment/board

  kubectl scale deployment/board --replicas=1

  kubectl rollout status deployment/board --timeout=90s

  ```


  W zadaniu 127 sprawdź Service i zapytaj prywatny Prometheus o up:


  ```sh

  cd ~/quest

  kubectl get service board -o yaml

  url=$(jq -r .url prometheus-target.json)

  kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/query?query=up%7Bjob%3D%22board%22%7D"

  ```

  '
