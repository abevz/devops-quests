heading: Budżety admission i metryki
text: '# Budżety admission i metryki


  ResourceQuota uwzględnia wszystkich przyjętych odbiorców namespace. LimitRange nadaje defaults przy admission; zmiana nie przepisuje istniejących Podów. Zastąpienie lub surge może wymagać budżetu, gdy stare Pody nadal go zajmują. Porównuj zużycie, oba szablony, przyjęte zasoby i komunikaty ReplicaSet. Koordynuj generacje w stałym budżecie. CPU defaults i bieżąca przyjęta pamięć nie dowodzą historii ani pojemności węzła.


  W zadaniu 127 transport scrape, etykiety zapisanych szeregów i intencja dalszych zapytań mają różne czasy życia. Gauge opisuje bieżącą wartość; count i sum muszą dotyczyć zamierzonego zakresu szeregów. Sprawne cele scrape nie aktualizują starej konfiguracji odbiorcy. Śledź exporter, prywatny Prometheus i obu odbiorców: żądane wejścia, środowisko bieżącego Poda, dostarczony program, publikowany agregat i rosnący licznik. Bieżące migawki i postęp potwierdzają aktualną pracę, nie pełną historię żądań.


  Źródła: [LimitRange](https://kubernetes.io/docs/concepts/policy/limit-range/), [ResourceQuota](https://kubernetes.io/docs/concepts/policy/resource-quotas/), [zapytania Prometheus](https://prometheus.io/docs/prometheus/latest/querying/basics/).


  W zadaniu 126 sprawdź stan admission:


  ```sh

  cd ~/quest

  cat admission-contract.json

  kubectl get resourcequota station -o yaml

  kubectl get limitrange defaults -o yaml

  kubectl get deployment,replicaset,pods -o yaml

  ```


  W zadaniu 127 sprawdź Service i zapytaj prywatny Prometheus o up:


  ```sh

  cd ~/quest

  kubectl get service board -o yaml

  url=$(jq -r .url prometheus-target.json)

  kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/query?query=up%7Bjob%3D%22board%22%7D"

  cat observer-contract.json

  kubectl get deployment,configmap,pods -o yaml

  ```


  W zadaniu 121 odróżnij błąd transportu admission od jawnego odrzucenia przez politykę. Potwierdzenie sterowania dotyczy tylko ograniczonego żądania, nie dopuszczenia rekordu aplikacji. Publikacja przez API i przyjęcie danych przez odbiorców mają różne czasy życia: środowisko jest przechwytywane przy starcie procesu, a montowanie subPath zachowuje pierwotne powiązanie pliku. Porównaj chroniony rekord i klucz z żądanymi referencjami obciążeń, ich bieżącymi Podami, rzeczywistymi wejściami i odpowiedziami. Zachowane dane przejściowe są kontrolą, nie zastępują przyjęcia sprawdzanego źródła. Zachowaj prywatną granicę zaufania i fail-closed podczas zaakceptowanych i odrzuconych serwerowych dry-runs. Bieżący stan nie dowodzi pełnej historii żądań.


  ### Jeden webhook walidujący {#q121-admission-single-webhook}


  Konfiguracja stanowiska może nie istnieć lub zawierać dodatkowe webhooki. Sprawdź, czy ma dokładnie jeden wpis.


  ```bash

  kubectl get validatingwebhookconfiguration "dq-webhook-${DQ_NAMESPACE#dq-}" -o json | jq ''.webhooks | length''

  ```


  ### Nazwa webhooka walidującego {#q121-admission-webhook-identity}


  Wpis webhooka mógł zostać przemianowany lub zastąpiony. Sprawdź route.training.devops-quests.local w aktywnej konfiguracji.


  ```bash

  kubectl get validatingwebhookconfiguration "dq-webhook-${DQ_NAMESPACE#dq-}" -o json | jq -r ''.webhooks[0].name''

  ```


  ### Polityka obsługi błędów webhooka {#q121-admission-failure-mode}


  Obejście mogło zmienić failurePolicy na Ignore. Zachowaj Fail, aby niedostępny webhook nie pomijał walidacji po cichu.


  ```bash

  kubectl get validatingwebhookconfiguration "dq-webhook-${DQ_NAMESPACE#dq-}" -o json | jq -r ''.webhooks[0].failurePolicy''

  ```


  ### Limit czasu webhooka w sekundach {#q121-admission-timeout-seconds}


  Podczas diagnozy dostępności można było zmienić timeout webhooka. Sprawdź, czy timeoutSeconds nadal wynosi 2.


  ```bash

  kubectl get validatingwebhookconfiguration "dq-webhook-${DQ_NAMESPACE#dq-}" -o json | jq ''.webhooks[0].timeoutSeconds''

  ```


  ### Adres punktu walidacji {#q121-admission-validation-endpoint}


  Walidator może nadal wskazywać wycofaną ścieżkę lub inny adres. Sprawdź HTTPS URL webhooka stanowiska na porcie 8443 z /validate.


  ```bash

  kubectl get validatingwebhookconfiguration "dq-webhook-${DQ_NAMESPACE#dq-}" -o json | jq -r ''.webhooks[0].clientConfig.url''

  ```


  ### Urząd certyfikacji dla walidacji {#q121-admission-certificate-authority}


  Pakiet CA może nie istnieć, mieć zły format lub zawierać inny certyfikat. Porównaj jedyny zdekodowany certyfikat z admission-ca.pem.


  ```bash

  kubectl get validatingwebhookconfiguration "dq-webhook-${DQ_NAMESPACE#dq-}" -o json | jq -er ''.webhooks[0].clientConfig.caBundle'' | base64 -d | openssl x509 -noout -fingerprint -sha256; openssl x509 -in admission-ca.pem -noout -fingerprint -sha256

  ```


  ### Przestrzeń nazw objęta webhookiem {#q121-admission-sandbox-namespace-selector}


  Selektor może pomijać etykietę uruchomienia lub instalacji albo obejmować inną przestrzeń. Porównaj go z dwiema etykietami i zachowaj dokładny zakres.


  ```bash

  kubectl get namespace "$DQ_NAMESPACE" --show-labels; kubectl get validatingwebhookconfiguration "dq-webhook-${DQ_NAMESPACE#dq-}" -o json | jq ''.webhooks[0].namespaceSelector''

  ```


  ### Bieżący rekord trasy {#q121-admission-current-route-record}


  Aktywna ConfigMap route może mieć starą wartość lub być nieczytelna. Potwierdź north-121 w kluczu route rzeczywistego obiektu.


  ```bash

  kubectl get configmap route -o json | jq -e ''.data.route == "north-121"''

  ```


  ### Zaakceptowana próba po stronie serwera {#q121-admission-accepted-dry-run}


  Nawet poprawny obiekt może nie przejść serwerowego dry-run z powodu niedostępnego webhooka lub CA. Porównaj wynik serwerowego dry-run z bieżącym route.


  ```bash

  kubectl get configmap route -o json | jq ''del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields)'' | kubectl apply --dry-run=server -f -

  ```


  ### Dane odrzucanej próby {#q121-admission-denied-dry-run-input}


  Obiekt route może nie istnieć lub mieć błędny JSON, co blokuje przygotowanie dry-run z closed. Sprawdź wejście przed oceną odpowiedzi serwera.


  ```bash

  kubectl get configmap route -o json | jq ''.data.route="closed" | del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields)''

  ```


  ### Odrzucenie zamkniętej trasy {#q121-admission-reject-closed-route}


  Zmieniona wartość może przejść walidację przez zły zakres lub ścieżkę webhooka. Wykonaj serwerowy dry-run z closed i potwierdź odmowę.


  ```bash

  kubectl get configmap route -o json | jq ''.data.route="closed" | del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields)'' | kubectl apply --dry-run=server -f -

  ```


  ### Oczekiwany komunikat odrzucenia {#q121-admission-exact-validation-denial}


  Ogólny błąd TLS lub transportu może przerwać dry-run przed walidacją. Sprawdź, czy komunikat zawiera Station route must be north-121.


  ```bash

  kubectl get configmap route -o json | jq ''.data.route="closed" | del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields)'' | kubectl apply --dry-run=server -f -

  ```


  ### Gotowe repliki board {#q121-admission-board-ready-count}


  Naprawiona trasa może przechodzić walidację, chociaż kontener worker board nadal startuje lub nie jest gotowy. Sprawdź rollout i poczekaj na jedną gotową replikę.


  ```bash

  kubectl get deployment board -o jsonpath=''{.status.readyReplicas}''; kubectl get pods -l app=board

  ```


  ### Rzeczywista odpowiedź board {#q121-admission-board-live-response}


  Udany dry-run może towarzyszyć starej lub niedostępnej odpowiedzi board. Odpytaj board z client i porównaj treść z north-121.


  ```bash

  kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080

  ```


  ### Dane kontroli webhooka {#q121-admission-config-observer-input}


  Kontrola webhooka może zatrzymać się przed wskazaniem warunku, gdy narzędzia lub dane są niedostępne. Sprawdź narzędzia, CA i dostęp do przestrzeni.


  ```bash

  command -v python3; test -r admission-ca.pem; kubectl get namespace "$DQ_NAMESPACE" -o name

  ```


  ### Zachowana tożsamość konsumentów {#q121-admission-retained-consumer-identities}


  Dostarczone obciążenie mogło zostać odtworzone lub używać innego obrazu w szablonie lub podach. Porównaj bieżące UID i obrazy z zamrożonym zapisem.


  ```bash

  jq ''.deployments'' /run/dq/facts/0/adoption-identities.json; kubectl get deployment board client route-env route-file -o custom-columns=NAME:.metadata.name,UID:.metadata.uid,IMAGE:.spec.template.spec.containers[*].image; kubectl get replicaset,pod -o json | jq ''.items[] | {kind, name: .metadata.name, uid: .metadata.uid, owner: .metadata.ownerReferences, workers: [.spec.containers[]? | {name,image}]}''

  ```


  ### Zachowany rekord roboczy {#q121-admission-preserved-staged-record}


  Edycja staged-route na wzór przyjętego obiektu mogła zmienić pierwotne dane lub UID. Porównaj pełny zapis staging z pierwotnym i podłącz konsumentów do route.


  ```bash

  jq ''.staging | {uid: .metadata.uid, data, binaryData}'' /run/dq/facts/0/adoption-identities.json; kubectl get configmap staged-route -o json | jq ''{uid: .metadata.uid, data, binaryData}''

  ```


  ### Źródłowy rekord trasy {#q121-admission-source-route-record}


  Konfiguracja konsumentów może być stara lub nie istnieć. Potwierdź north-121 w kluczu route faktycznie przyjętego ConfigMap route.


  ```bash

  kubectl get configmap route -o json | jq -e ''.data.route == "north-121"''

  ```


  ### Bieżące Pody konsumentów {#q121-admission-current-consumer-pods}


  Po wdrożeniu konsument może nie mieć dokładnie jednego bieżącego gotowego poda. Sprawdź oba wdrożenia i ich aktualne pody.


  ```bash

  kubectl get deployment route-env route-file -o wide; kubectl get replicasets,pods -l ''app in (route-env,route-file)'' -o wide

  ```


  ### Zachowany program startowy {#q121-admission-preserved-startup-program}


  Zmiana polecenia lub argumentów startu mogła zamaskować niewłaściwe dane. Porównaj żądany i aktywny program z dostarczonym i popraw źródło.


  ```bash

  jq ''.deployments | {env: .["route-env"], file: .["route-file"]}'' /run/dq/facts/0/adoption-identities.json; kubectl get deployment route-env route-file -o json | jq ''.items[] | {name: .metadata.name, startup: [.spec.template.spec.containers[] | {name,command,args}]}''; kubectl get pods -o json | jq ''.items[] | {name: .metadata.name, owner: .metadata.ownerReferences, startup: [.spec.containers[] | {name,command,args}]}''

  ```


  ### Odwołanie do przyjętego źródła {#q121-admission-adopted-config-reference}


  Konsument może nadal odwoływać się do staged-route albo używać literału lub niejednoznacznej projekcji pliku. Sprawdź route/route w szablonie i podzie przez unikalny ROUTE lub plik tylko do odczytu.


  ```bash

  kubectl get deployment route-env route-file -o json | jq ''.items[] | {name: .metadata.name, containers: .spec.template.spec.containers, volumes: .spec.template.spec.volumes}''

  kubectl get replicaset,pod -o json | jq ''.items[] | {kind, name: .metadata.name, uid: .metadata.uid, owners: .metadata.ownerReferences, containers: .spec.containers, volumes: .spec.volumes}''

  ```


  ### Rzeczywiste dane wejściowe konsumenta {#q121-admission-live-consumer-input}


  Konfiguracja może być poprawna, choć konsument nadal widzi starą zmienną lub plik. Odczytaj aktywne ROUTE i /config/route i porównaj z north-121.


  ```bash

  kubectl exec deployment/route-env -c worker -- printenv ROUTE; kubectl exec deployment/route-file -c worker -- cat /config/route

  ```


  ### Rzeczywisty wynik publikowany przez konsumenta {#q121-admission-live-consumer-publication}


  Konsument może czytać poprawne dane, ale zwracać stare wyjście startowe. Odpytaj loopback u każdego konsumenta i porównaj z north-121.


  ```bash

  for deployment_name in route-env route-file; do kubectl exec "deployment/$deployment_name" -c worker -- wget -qO- -T 2 http://127.0.0.1:8080; done

  ```


  ### Bieżąca obserwacja konsumentów {#q121-admission-current-observation-failure}


  Kontrola może nie odczytać obciążenia, wejścia poda lub odpowiedzi w limicie czasu. Sprawdź API i powtórz obserwacje osobno przed oceną przyjęcia.


  ```bash

  kubectl get deployment route-env route-file -o name; kubectl get pods -l ''app in (route-env,route-file)''

  ```


  ### Dane kontroli przyjęcia źródła {#q121-admission-adoption-observer-input}


  Kontrola przyjęcia może zatrzymać się przed wskazaniem warunku przez błąd procesu lub danych. Sprawdź narzędzia, dostarczony kontrakt i dostęp do obu konsumentów.


  ```bash

  command -v python3; test -r adoption-contract.json; kubectl get deployment route-env route-file -o name

  ```



  ### Twarde limity station {#q126-station-quota-budget}


  Może brakować ResourceQuota station lub wartości hard mogą odbiegać od żądań CPU 200m i pamięci 32Mi, limitów CPU 400m i pamięci 64Mi oraz liczby Podów 2.


  ```bash

  kubectl get resourcequota station -o json | jq ''.spec.hard''

  ```


  ### Dane kontroli kwoty {#q126-station-quota-observer}


  Kontrola kwoty mogła się zatrzymać przed zgłoszeniem warunku. Sprawdź, czy można odczytać bieżący ResourceQuota station.


  ```bash

  kubectl get resourcequota station -o json

  ```


  ### Domyślny limit CPU {#q126-station-limitrange-default}


  W LimitRange defaults może brakować wpisu Container lub domyślny limit CPU może być inny. Sprawdź wartość 200m.


  ```bash

  kubectl get limitrange defaults -o json | jq ''.spec.limits[] | select(.type=="Container") | .default.cpu''

  ```


  ### Domyślne żądanie CPU {#q126-station-limitrange-request}


  W LimitRange defaults może brakować wpisu Container lub domyślne żądanie CPU może być inne. Sprawdź wartość 100m.


  ```bash

  kubectl get limitrange defaults -o json | jq ''.spec.limits[] | select(.type=="Container") | .defaultRequest.cpu''

  ```


  ### Ustawienia zasobów w szablonie board {#q126-station-board-empty-resources}


  Szablon board może jawnie ustawiać resources dla worker lub worker może nie istnieć. Pozostaw resources puste w szablonie, aby mechanizm admission wstawił wartości domyślne.


  ```bash

  kubectl get deployment board -o json | jq ''.spec.template.spec.containers[] | select(.name=="worker") | .resources''

  ```


  ### Dane kontroli zasad admission {#q126-station-admission-policy-observer}


  Kontrola zasad admission mogła się zatrzymać przed zgłoszeniem warunku. Sprawdź LimitRange, kwotę i Deploymenty w przestrzeni nazw ćwiczenia.


  ```bash

  kubectl get resourcequota station; kubectl get limitrange defaults; kubectl get deployment board client

  ```


  ### Zachowane tożsamości kwoty i Deploymentów {#q126-station-retained-admission-objects}


  Chroniony ResourceQuota lub Deployment może nie istnieć lub mieć inny UID. Porównaj bieżące obiekty z zapisanymi identyfikatorami.


  ```bash

  jq ''.identities'' /run/dq/facts/0/admission-identities.json; kubectl get resourcequota/station deployment/board deployment/client -o custom-columns=KIND:.kind,NAME:.metadata.name,UID:.metadata.uid

  ```


  ### Zachowane szablony obciążeń {#q126-station-retained-admission-templates}


  Szablon board lub client może odbiegać od kontraktu. Sprawdź liczbę replik, pierwotny obraz worker oraz puste pole resources dla wartości admission.


  ```bash

  jq ''{replicas: .contract.replicas, images}'' /run/dq/facts/0/admission-identities.json; kubectl get deployments board client -o json | jq ''.items[] | {name: .metadata.name, replicas: .spec.replicas, worker: [.spec.template.spec.containers[] | select(.name == "worker") | {image,resources}]}''

  ```


  ### Gotowa replika board {#q126-station-board-ready-replica}


  Deployment board może nadal uzgadniać stan lub liczba gotowych replik może być inna niż jeden. Sprawdź bieżący stan.


  ```bash

  kubectl get deployment board -o jsonpath=''{.status.readyReplicas}''

  ```


  ### Żądania worker w przyjętych Podach {#q126-station-admitted-worker-requests}


  W żadnym nieusuwanym Podzie board żądania worker mogą nie wynosić jednocześnie CPU 100m i pamięci 16Mi. Sprawdź specyfikację przyjętego Poda.


  ```bash

  kubectl get pods -l app=board -o json | jq ''.items[] | select(.metadata.deletionTimestamp == null) | .spec.containers[] | select(.name=="worker") | .resources.requests''

  ```


  ### Limity worker w przyjętych Podach {#q126-station-admitted-worker-limits}


  W żadnym nieusuwanym Podzie board limity worker mogą nie wynosić jednocześnie CPU 200m i pamięci 32Mi. Sprawdź specyfikację przyjętego Poda.


  ```bash

  kubectl get pods -l app=board -o json | jq ''.items[] | select(.metadata.deletionTimestamp == null) | .spec.containers[] | select(.name=="worker") | .resources.limits''

  ```


  ### Gotowość worker w board {#q126-station-admitted-worker-readiness}


  Kontener worker może być niegotowy we wszystkich nieusuwanych Podach board. Sprawdź gotowość kontenera w bieżących Podach.


  ```bash

  kubectl get pods -l app=board -o json | jq ''.items[] | {name: .metadata.name, deleting: .metadata.deletionTimestamp, statuses: .status.containerStatuses}''

  ```


  ### Gotowość i zasoby tego samego Poda {#q126-station-admitted-single-example}


  Oczekiwane żądania, limity i gotowość mogą występować w różnych Podach. Sprawdź jeden nieusuwany Pod board, którego worker spełnia wszystkie trzy warunki.


  ```bash

  kubectl get pods -l app=board -o json | jq ''.items[] | {name: .metadata.name, deleting: .metadata.deletionTimestamp, containers: .spec.containers, statuses: .status.containerStatuses}''

  ```


  ### Bieżący przyjęty client {#q126-station-admitted-client}


  Wdrożenie client może być nieaktualne, wskazywać zmienione obciążenie lub zawierać bieżący worker z innymi zasobami albo bez gotowości. Sprawdź generację Deploymentu, łańcuch właścicieli i przyjęty Pod.


  ```bash

  jq ''{identity: .identities["deployment/client"], image: .images.client, replicas: .contract.replicas, admitted: .contract.admitted}'' /run/dq/facts/0/admission-identities.json; kubectl get deployment client -o json | jq ''{uid: .metadata.uid, generation: .metadata.generation, observed: .status.observedGeneration, desired: .spec.replicas, ready: .status.readyReplicas}''; kubectl get replicasets,pods -o json | jq ''.items[] | {kind, name: .metadata.name, uid: .metadata.uid, owners: .metadata.ownerReferences, phase: .status.phase, statuses: .status.containerStatuses, workers: [.spec.containers[]? | select(.name=="worker") | {image,resources}]}''

  ```


  ### Zaobserwowane użycie kwoty {#q126-station-observed-quota-usage}


  Kontroler kwoty może nadal uzgadniać stan lub zużycie przyjętych obciążeń może odbiegać od budżetu. Po ustabilizowaniu board i client porównaj w status.used żądania, limity i Pody.


  ```bash

  kubectl get resourcequota station -o json | jq ''.status.used''

  ```


  ### Dane kontroli przyjętych Podów {#q126-station-admitted-pods-observer}


  Kontrola skutków admission mogła się zatrzymać przed zgłoszeniem warunku. Sprawdź odczyty kwoty, obciążeń i dostępność przyjętych Podów.


  ```bash

  kubectl get resourcequota station; kubectl get deployments,replicasets,pods

  ```


  ### Rzeczywista odpowiedź board z client {#q126-station-admitted-board-http}


  Przyjęty client może nie mieć dostępu do board:8080 lub nie otrzymywać odpowiedzi north-126. Sprawdź rzeczywiste żądanie z client.


  ```bash

  kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080

  ```


  ### Port HTTP wystawiony przez board {#q127-metrics-board-service-port}


  W Service board może brakować nazwanego portu http na TCP 8080. Sprawdź konfigurację wystawionego portu.


  ```bash

  kubectl get service board -o json | jq ''.spec.ports''

  ```


  ### Port docelowy Service board {#q127-metrics-board-target-port}


  targetPort w board może wskazywać inny port lub nazwę, która nie odpowiada TCP 8080 we wszystkich bieżących Podach docelowych. Sprawdź deklaracje portów Service i kontenerów.


  ```bash

  kubectl get service board -o json | jq ''.spec.ports''; kubectl get pods -l app=board -o json | jq ''.items[] | {name: .metadata.name, ports: [.spec.containers[].ports]}''

  ```


  ### Selektor Service board {#q127-metrics-board-selector}


  Selektor Service może pomijać właściwy Pod board lub wybierać inne obciążenie. Sprawdź app: board i porównaj cały selektor z bieżącymi etykietami Podów.


  ```bash

  kubectl get service board -o json | jq ''.spec.selector''; kubectl get pods --show-labels

  ```


  ### Dane kontroli Service board {#q127-metrics-board-observer-input}


  Kontrola mogła przerwać pracę przed zgłoszeniem warunku. Sprawdź dostęp do Service board i bieżących obciążeń.


  ```bash

  kubectl get service board; kubectl get deployments,replicasets,pods

  ```


  ### Zachowane tożsamości obciążeń obserwatorów {#q127-metrics-retained-observer-identity}


  Dostarczony Service lub obciążenie mogło stać się niedostępne, zostać zastąpione albo używać innego obrazu. Porównaj bieżące obiekty i obrazy worker z zapisanymi tożsamościami.


  ```bash

  jq ''{serviceUID,deployments}'' /run/dq/facts/0/observer-identities.json; kubectl get deployment board client observer-count observer-total -o custom-columns=NAME:.metadata.name,UID:.metadata.uid,IMAGE:.spec.template.spec.containers[*].image; kubectl get service board -o jsonpath=''{.metadata.uid}''; kubectl get replicaset,pod -o json | jq ''.items[] | {kind, name: .metadata.name, uid: .metadata.uid, owner: .metadata.ownerReferences, workers: [.spec.containers[]? | {name,image}]}''

  ```


  ### Zachowany program obserwatorów {#q127-metrics-retained-observer-program}


  ConfigMap metryk lub programu mógł zostać zastąpiony, program mógł się zmienić albo bieżący worker może uruchamiać inną komendę. Sprawdź dostarczone ConfigMapy, komendę startową i skrót zamontowanego programu.


  ```bash

  jq ''{metricsUID,programUID,programHash}'' /run/dq/facts/0/observer-identities.json; kubectl get configmaps board-metrics observer-program -o custom-columns=NAME:.metadata.name,UID:.metadata.uid; kubectl get configmap observer-program -o json | jq -jr ''.data["poll.sh"]'' | sha256sum; kubectl get deployments observer-count observer-total -o json | jq ''.items[] | {name: .metadata.name, launch: [.spec.template.spec.containers[] | select(.name=="worker") | .command]}''; for name in observer-count observer-total; do kubectl exec "deployment/$name" -c worker -- sha256sum /opt/observer/poll.sh; done

  ```


  ### Parametry obserwatora w szablonie {#q127-metrics-observer-environment-template}


  Szablon Deploymentu może wyznaczać inne parametry zapytania obserwatora. Porównaj PROMETHEUS_URL, METRIC, ROUTE, JOB i OPERATION każdego obserwatora z dostarczonym założeniem.


  ```bash

  jq ''{intent, operations: [.contract.consumers[] | {deployment,operation}]}'' /run/dq/facts/0/observer-identities.json; kubectl get deployments observer-count observer-total -o json | jq ''.items[] | {name: .metadata.name, env: [.spec.template.spec.containers[] | select(.name=="worker") | {env,envFrom}]}''

  ```


  ### Rzeczywiste środowisko obserwatora {#q127-metrics-observer-current-environment}


  Bieżący, gotowy Pod obserwatora może być niedostępny albo środowisko worker może różnić się od oczekiwanego. Sprawdź łańcuch właścicieli i ponów obserwację wewnątrz Poda.


  ```bash

  jq ''{intent, operations: [.contract.consumers[] | {deployment,operation}]}'' /run/dq/facts/0/observer-identities.json; kubectl get deployments,replicasets,pods -o wide; for name in observer-count observer-total; do kubectl exec "deployment/$name" -c worker -- sh -c ''printf "%s\n" "$PROMETHEUS_URL" "$METRIC" "$ROUTE" "$JOB" "$OPERATION"''; done

  ```


  ### Stan zapytania Prometheus {#q127-metrics-query-status}


  Wskazane zapytanie Prometheus mogło nie dotrzeć do serwera lub zwrócić błąd. Sprawdź podany adres z client i ponów zapytanie z komunikatu, oczekując status success.


  ```bash

  url=$(jq -er .url /run/dq/facts/0/prometheus-target.json); for query in up%7Bjob%3D%22board%22%7D sum%28station_queue_depth%7Bjob%3D%22board%22%2Croute%3D%22north%22%7D%29 count%28station_queue_depth%7Bjob%3D%22board%22%2Croute%3D%22north%22%7D%29; do kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/query?query=$query"; done

  ```


  ### Liczba wyników Prometheus {#q127-metrics-query-vector-cardinality}


  Wskazane zapytanie może zwrócić zero lub więcej niż jeden wpis. Sprawdź filtry job i route i potwierdź dokładnie jeden wynik zapytania.


  ```bash

  url=$(jq -er .url /run/dq/facts/0/prometheus-target.json); for query in up%7Bjob%3D%22board%22%7D sum%28station_queue_depth%7Bjob%3D%22board%22%2Croute%3D%22north%22%7D%29 count%28station_queue_depth%7Bjob%3D%22board%22%2Croute%3D%22north%22%7D%29; do kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/query?query=$query" | jq ''.data.result | length''; done

  ```


  ### Zaobserwowana próbka Prometheus {#q127-metrics-query-observed-value}


  Wskazane zapytanie mogło zwrócić inną próbkę. Dla podanego zapytania porównaj up z 1, sum z 7 lub count z 2.


  ```bash

  url=$(jq -er .url /run/dq/facts/0/prometheus-target.json); for query in up%7Bjob%3D%22board%22%7D sum%28station_queue_depth%7Bjob%3D%22board%22%2Croute%3D%22north%22%7D%29 count%28station_queue_depth%7Bjob%3D%22board%22%2Croute%3D%22north%22%7D%29; do kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/query?query=$query" | jq ''.data.result[0].value[1]''; done

  ```


  ### Kondycja aktywnego celu board {#q127-metrics-active-board-target}


  Prometheus może nie mieć aktywnego celu board ze stanem up i pustym lastError. Sprawdź listę aktywnych celów i błąd pobierania metryk.


  ```bash

  url=$(jq -er .url /run/dq/facts/0/prometheus-target.json); kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/targets?state=active" | jq ''.data.activeTargets[] | {job: .labels.job, health, lastError}''

  ```


  ### Wynik zwracany przez obserwatora {#q127-metrics-observer-result-delivery}


  Obserwator może nie mieć bieżącego, gotowego worker lub może publikować nieaktualny albo błędny wynik. Sprawdź odpowiedź loopback każdego obserwatora, gdzie count ma dać 2, a sum 7.


  ```bash

  jq ''.contract.consumers[] | {deployment,operation,expected}'' /run/dq/facts/0/observer-identities.json; for name in observer-count observer-total; do kubectl rollout status "deployment/$name" --timeout=10s; kubectl exec "deployment/$name" -c worker -- wget -qO- -T 2 http://127.0.0.1:8080; done

  ```


  ### Postęp odpytywania obserwatora {#q127-metrics-observer-poll-progress}


  Licznik obserwacji mógł się zatrzymać. Odczytaj /tmp/observations dwukrotnie w tym samym bieżącym worker i potwierdź wzrost podczas odpytywania.


  ```bash

  for name in observer-count observer-total; do kubectl rollout status "deployment/$name" --timeout=10s; pod=$(kubectl get pods -l "app=$name" -o json | jq -er ''[.items[] | select(.metadata.deletionTimestamp==null and any(.status.conditions[]?; .type=="Ready" and .status=="True")) | .metadata.name] | if length==1 then .[0] else error("expected one current Ready Pod") end'') || continue; kubectl exec "$pod" -c worker -- cat /tmp/observations; sleep 1.1; kubectl exec "$pod" -c worker -- cat /tmp/observations; done

  ```


  ### Dane kontroli dostarczenia wyniku {#q127-metrics-observer-delivery-input}


  Kontrola dostarczenia mogła się zatrzymać przed zgłoszeniem warunku. Sprawdź dostępność adresu Prometheus oraz Podów client i obserwatorów.


  ```bash

  test -s /run/dq/facts/0/prometheus-target.json; kubectl get deployment client observer-count observer-total

  ```

  '
