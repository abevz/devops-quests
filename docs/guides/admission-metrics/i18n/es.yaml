heading: Presupuestos de admisión y métricas
text: '# Presupuestos de admisión y métricas


  ResourceQuota contabiliza todos los consumidores admitidos del namespace. LimitRange aplica defaults al admitir; sus cambios no reescriben Pods. Reemplazo o surge puede requerir presupuesto mientras Pods viejos lo consumen. Compara uso, ambas plantillas, recursos admitidos y mensajes ReplicaSet. Coordina generaciones dentro del presupuesto fijo. CPU defaults y memoria admitida actual no prueban historial ni capacidad del nodo.


  En el quest 127, transporte de scrape, etiquetas de series e intención de consultas posteriores tienen vidas distintas. Un gauge describe un valor actual; count y sum deben usar el ámbito de series previsto. Targets sanos no actualizan configuraciones antiguas de consumidores. Sigue exporter, Prometheus privado y ambos consumidores: entradas deseadas, entorno actual de Pod, programa suministrado, agregado servido y contador creciente. Instantáneas y progreso actuales demuestran operación actual, no todo el historial.


  Referencias: [LimitRange](https://kubernetes.io/docs/concepts/policy/limit-range/), [ResourceQuota](https://kubernetes.io/docs/concepts/policy/resource-quotas/), [consultas Prometheus](https://prometheus.io/docs/prometheus/latest/querying/basics/).


  En la misión 126 inspecciona el estado de admisión:


  ```sh

  cd ~/quest

  cat admission-contract.json

  kubectl get resourcequota station -o yaml

  kubectl get limitrange defaults -o yaml

  kubectl get deployment,replicaset,pods -o yaml

  ```


  En la misión 127 inspecciona el Service y consulta up al Prometheus privado:


  ```sh

  cd ~/quest

  kubectl get service board -o yaml

  url=$(jq -r .url prometheus-target.json)

  kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/query?query=up%7Bjob%3D%22board%22%7D"

  cat observer-contract.json

  kubectl get deployment,configmap,pods -o yaml

  ```


  En el quest 121, distingue un fallo de transporte de admission de un rechazo explícito de la política. Un recibo de control solo confirma su solicitud limitada, no la admisión de un registro de la aplicación. La publicación API y la adopción por consumidores tienen vidas distintas: el entorno se captura al iniciar el proceso y un montaje subPath mantiene su enlace original al archivo. Compara el registro y la clave protegidos con las referencias deseadas de cargas, sus Pods actuales, entradas reales y respuestas. Los datos provisionales conservados sirven de control, no sustituyen la adopción de la fuente validada. Conserva el límite privado de confianza y fail-closed al probar dry-runs de servidor aceptados y rechazados. El estado actual no demuestra todo el historial de solicitudes.


  ### Un solo webhook de validación {#q121-admission-single-webhook}


  La configuración puede faltar o contener webhooks adicionales. Revise que tenga exactamente una entrada.


  ```bash

  kubectl get validatingwebhookconfiguration "dq-webhook-${DQ_NAMESPACE#dq-}" -o json | jq ''.webhooks | length''

  ```


  ### Nombre del webhook de validación {#q121-admission-webhook-identity}


  La entrada del webhook puede haberse renombrado o reemplazado. Revise route.training.devops-quests.local en la configuración activa.


  ```bash

  kubectl get validatingwebhookconfiguration "dq-webhook-${DQ_NAMESPACE#dq-}" -o json | jq -r ''.webhooks[0].name''

  ```


  ### Política de fallos del webhook {#q121-admission-failure-mode}


  Una solución temporal pudo cambiar failurePolicy a Ignore. Conserve Fail para que un webhook inaccesible no omita la validación.


  ```bash

  kubectl get validatingwebhookconfiguration "dq-webhook-${DQ_NAMESPACE#dq-}" -o json | jq -r ''.webhooks[0].failurePolicy''

  ```


  ### Tiempo de espera del webhook en segundos {#q121-admission-timeout-seconds}


  El timeout del webhook puede haber cambiado al diagnosticar conexión. Compruebe que timeoutSeconds siga en 2.


  ```bash

  kubectl get validatingwebhookconfiguration "dq-webhook-${DQ_NAMESPACE#dq-}" -o json | jq ''.webhooks[0].timeoutSeconds''

  ```


  ### Dirección del endpoint de validación {#q121-admission-validation-endpoint}


  El validador puede seguir apuntando a la ruta retirada u otra dirección. Revise la URL HTTPS del webhook en 8443 con /validate.


  ```bash

  kubectl get validatingwebhookconfiguration "dq-webhook-${DQ_NAMESPACE#dq-}" -o json | jq -r ''.webhooks[0].clientConfig.url''

  ```


  ### Autoridad de certificación de la validación {#q121-admission-certificate-authority}


  El paquete CA puede faltar, estar mal formado o contener otro certificado. Compare el único certificado decodificado con admission-ca.pem.


  ```bash

  kubectl get validatingwebhookconfiguration "dq-webhook-${DQ_NAMESPACE#dq-}" -o json | jq -er ''.webhooks[0].clientConfig.caBundle'' | base64 -d | openssl x509 -noout -fingerprint -sha256; openssl x509 -in admission-ca.pem -noout -fingerprint -sha256

  ```


  ### Espacio de nombres cubierto por el webhook {#q121-admission-sandbox-namespace-selector}


  El selector puede omitir la etiqueta de ejecución o instalación, o incluir otro namespace. Compárelo con las dos etiquetas suministradas y conserve ese alcance exacto.


  ```bash

  kubectl get namespace "$DQ_NAMESPACE" --show-labels; kubectl get validatingwebhookconfiguration "dq-webhook-${DQ_NAMESPACE#dq-}" -o json | jq ''.webhooks[0].namespaceSelector''

  ```


  ### Registro actual de la ruta {#q121-admission-current-route-record}


  El ConfigMap route activo puede conservar un valor anterior o no ser legible. Confirme north-121 en la clave route del objeto real.


  ```bash

  kubectl get configmap route -o json | jq -e ''.data.route == "north-121"''

  ```


  ### Simulación aceptada por el servidor {#q121-admission-accepted-dry-run}


  Un objeto correcto puede fallar el dry-run de servidor por un webhook o CA inaccesible. Compare el resultado del dry-run con el registro route activo.


  ```bash

  kubectl get configmap route -o json | jq ''del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields)'' | kubectl apply --dry-run=server -f -

  ```


  ### Entrada de la simulación rechazada {#q121-admission-denied-dry-run-input}


  El objeto route puede faltar o tener JSON inválido, lo que impide preparar el dry-run con closed. Revise la entrada antes de interpretar la denegación.


  ```bash

  kubectl get configmap route -o json | jq ''.data.route="closed" | del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields)''

  ```


  ### Rechazo de una ruta cerrada {#q121-admission-reject-closed-route}


  El valor modificado puede pasar si el alcance o la ruta del webhook son incorrectos. Ejecute el dry-run de servidor con closed y confirme el rechazo.


  ```bash

  kubectl get configmap route -o json | jq ''.data.route="closed" | del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields)'' | kubectl apply --dry-run=server -f -

  ```


  ### Texto esperado del rechazo de validación {#q121-admission-exact-validation-denial}


  Un fallo genérico de TLS o transporte puede rechazar el dry-run antes de validar. Compruebe que el error contenga Station route must be north-121.


  ```bash

  kubectl get configmap route -o json | jq ''.data.route="closed" | del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields)'' | kubectl apply --dry-run=server -f -

  ```


  ### Réplicas listas de board {#q121-admission-board-ready-count}


  La ruta recuperada puede ser válida mientras el worker de board aún inicia o no está listo. Revise el despliegue y espere una réplica lista.


  ```bash

  kubectl get deployment board -o jsonpath=''{.status.readyReplicas}''; kubectl get pods -l app=board

  ```


  ### Respuesta real de board {#q121-admission-board-live-response}


  Un dry-run exitoso puede coexistir con una respuesta anterior o inaccesible de board. Consulte board desde client y compare el cuerpo real con north-121.


  ```bash

  kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080

  ```


  ### Entradas de la comprobación del webhook {#q121-admission-config-observer-input}


  La comprobación puede detenerse antes de indicar una condición si no dispone de herramientas o archivos. Revise herramientas, CA suministrada y acceso al namespace.


  ```bash

  command -v python3; test -r admission-ca.pem; kubectl get namespace "$DQ_NAMESPACE" -o name

  ```


  ### Identidades conservadas de los consumidores {#q121-admission-retained-consumer-identities}


  Una carga suministrada puede haberse recreado o usar otra imagen en su plantilla o Pods. Compare los UID e imágenes actuales con el registro fijado.


  ```bash

  jq ''.deployments'' /run/dq/facts/0/adoption-identities.json; kubectl get deployment board client route-env route-file -o custom-columns=NAME:.metadata.name,UID:.metadata.uid,IMAGE:.spec.template.spec.containers[*].image; kubectl get replicaset,pod -o json | jq ''.items[] | {kind, name: .metadata.name, uid: .metadata.uid, owner: .metadata.ownerReferences, workers: [.spec.containers[]? | {name,image}]}''

  ```


  ### Registro intermedio conservado {#q121-admission-preserved-staged-record}


  Copiar el registro aceptado a staged-route puede cambiar sus datos originales o UID. Compare toda la copia previa con el registro fijado y conecte los consumidores al route real.


  ```bash

  jq ''.staging | {uid: .metadata.uid, data, binaryData}'' /run/dq/facts/0/adoption-identities.json; kubectl get configmap staged-route -o json | jq ''{uid: .metadata.uid, data, binaryData}''

  ```


  ### Registro de ruta de origen {#q121-admission-source-route-record}


  La configuración de los consumidores puede faltar o estar obsoleta. Confirme north-121 en la clave route del registro route admitido real.


  ```bash

  kubectl get configmap route -o json | jq -e ''.data.route == "north-121"''

  ```


  ### Pods actuales de los consumidores {#q121-admission-current-consumer-pods}


  Tras el despliegue, un consumidor puede carecer de exactamente un Pod actual propio y listo. Revise ambos despliegues y sus Pods actuales.


  ```bash

  kubectl get deployment route-env route-file -o wide; kubectl get replicasets,pods -l ''app in (route-env,route-file)'' -o wide

  ```


  ### Programa de arranque conservado {#q121-admission-preserved-startup-program}


  Cambiar el comando o sus argumentos puede ocultar la entrada incorrecta. Compare el programa deseado y el activo con el suministrado y corrija la referencia de origen.


  ```bash

  jq ''.deployments | {env: .["route-env"], file: .["route-file"]}'' /run/dq/facts/0/adoption-identities.json; kubectl get deployment route-env route-file -o json | jq ''.items[] | {name: .metadata.name, startup: [.spec.template.spec.containers[] | {name,command,args}]}''; kubectl get pods -o json | jq ''.items[] | {name: .metadata.name, owner: .metadata.ownerReferences, startup: [.spec.containers[] | {name,command,args}]}''

  ```


  ### Referencia al origen adoptado {#q121-admission-adopted-config-reference}


  Un consumidor puede seguir apuntando a staged-route o usar un valor literal o una proyección ambigua. Revise route/route en plantilla y Pod actual, mediante ROUTE único o montaje de solo lectura.


  ```bash

  kubectl get deployment route-env route-file -o json | jq ''.items[] | {name: .metadata.name, containers: .spec.template.spec.containers, volumes: .spec.template.spec.volumes}''

  kubectl get replicaset,pod -o json | jq ''.items[] | {kind, name: .metadata.name, uid: .metadata.uid, owners: .metadata.ownerReferences, containers: .spec.containers, volumes: .spec.volumes}''

  ```


  ### Entrada real del consumidor {#q121-admission-live-consumer-input}


  La configuración puede ser correcta aunque un consumidor activo vea la variable o archivo anterior. Lea ROUTE y /config/route y compare con north-121.


  ```bash

  kubectl exec deployment/route-env -c worker -- printenv ROUTE; kubectl exec deployment/route-file -c worker -- cat /config/route

  ```


  ### Publicación real del consumidor {#q121-admission-live-consumer-publication}


  Un consumidor puede leer la entrada correcta y seguir sirviendo una salida inicial obsoleta. Consulte loopback en cada consumidor actual y compare con north-121.


  ```bash

  for deployment_name in route-env route-file; do kubectl exec "deployment/$deployment_name" -c worker -- wget -qO- -T 2 http://127.0.0.1:8080; done

  ```


  ### Observación actual de los consumidores {#q121-admission-current-observation-failure}


  El observador puede no leer una carga, entrada o salida del Pod en su tiempo límite. Revise la API y repita las observaciones por separado antes de evaluar la adopción.


  ```bash

  kubectl get deployment route-env route-file -o name; kubectl get pods -l ''app in (route-env,route-file)''

  ```


  ### Entradas de la comprobación de adopción {#q121-admission-adoption-observer-input}


  El observador de adopción puede detenerse antes de señalar una condición si falla el proceso o los datos fijados. Revise las herramientas, el contrato y el acceso a ambos consumidores.


  ```bash

  command -v python3; test -r adoption-contract.json; kubectl get deployment route-env route-file -o name

  ```



  ### Presupuesto fijo de station {#q126-station-quota-budget}


  Puede faltar el ResourceQuota station o sus valores hard pueden diferir de las solicitudes de CPU 200m y memoria 32Mi, los límites de CPU 400m y memoria 64Mi y los 2 Pods.


  ```bash

  kubectl get resourcequota station -o json | jq ''.spec.hard''

  ```


  ### Entradas de la comprobación de cuota {#q126-station-quota-observer}


  La comprobación de cuota puede haberse detenido antes de indicar una condición. Confirma que el ejercicio puede leer el ResourceQuota station actual.


  ```bash

  kubectl get resourcequota station -o json

  ```


  ### Límite de CPU predeterminado {#q126-station-limitrange-default}


  Puede faltar la entrada Container en el LimitRange defaults o puede tener otro límite de CPU predeterminado. Comprueba el valor 200m.


  ```bash

  kubectl get limitrange defaults -o json | jq ''.spec.limits[] | select(.type=="Container") | .default.cpu''

  ```


  ### Solicitud de CPU predeterminada {#q126-station-limitrange-request}


  Puede faltar la entrada Container en el LimitRange defaults o puede tener otra solicitud de CPU predeterminada. Comprueba el valor 100m.


  ```bash

  kubectl get limitrange defaults -o json | jq ''.spec.limits[] | select(.type=="Container") | .defaultRequest.cpu''

  ```


  ### Configuración de recursos en la plantilla de board {#q126-station-board-empty-resources}


  La plantilla de board puede fijar resources en worker o puede faltar worker. Deja resources vacío en la plantilla para que la admisión aplique los valores predeterminados.


  ```bash

  kubectl get deployment board -o json | jq ''.spec.template.spec.containers[] | select(.name=="worker") | .resources''

  ```


  ### Entradas de la comprobación de admisión {#q126-station-admission-policy-observer}


  La comprobación de la política de admisión puede haberse detenido antes de indicar una condición. Comprueba LimitRange, la cuota y los Deployments del ejercicio.


  ```bash

  kubectl get resourcequota station; kubectl get limitrange defaults; kubectl get deployment board client

  ```


  ### Identidades conservadas de la cuota y los Deployments {#q126-station-retained-admission-objects}


  Puede faltar un ResourceQuota o Deployment protegido o puede tener otro UID. Compara los objetos actuales con el registro de identidades proporcionado.


  ```bash

  jq ''.identities'' /run/dq/facts/0/admission-identities.json; kubectl get resourcequota/station deployment/board deployment/client -o custom-columns=KIND:.kind,NAME:.metadata.name,UID:.metadata.uid

  ```


  ### Plantillas de carga conservadas {#q126-station-retained-admission-templates}


  La plantilla de board o client puede diferir del contrato. Comprueba el número de réplicas, la imagen original de worker y el campo resources vacío para la admisión.


  ```bash

  jq ''{replicas: .contract.replicas, images}'' /run/dq/facts/0/admission-identities.json; kubectl get deployments board client -o json | jq ''.items[] | {name: .metadata.name, replicas: .spec.replicas, worker: [.spec.template.spec.containers[] | select(.name == "worker") | {image,resources}]}''

  ```


  ### Réplica lista de board {#q126-station-board-ready-replica}


  El Deployment board puede seguir reconciliándose o tener un número de réplicas listas distinto de uno. Comprueba el estado actual.


  ```bash

  kubectl get deployment board -o jsonpath=''{.status.readyReplicas}''

  ```


  ### Solicitudes de worker en Pods admitidos {#q126-station-admitted-worker-requests}


  Puede que ningún Pod de board que siga activo tenga en worker solicitudes de CPU 100m y memoria 16Mi. Comprueba la especificación del Pod admitido.


  ```bash

  kubectl get pods -l app=board -o json | jq ''.items[] | select(.metadata.deletionTimestamp == null) | .spec.containers[] | select(.name=="worker") | .resources.requests''

  ```


  ### Límites de worker en Pods admitidos {#q126-station-admitted-worker-limits}


  Puede que ningún Pod de board que siga activo tenga en worker límites de CPU 200m y memoria 32Mi. Comprueba la especificación del Pod admitido.


  ```bash

  kubectl get pods -l app=board -o json | jq ''.items[] | select(.metadata.deletionTimestamp == null) | .spec.containers[] | select(.name=="worker") | .resources.limits''

  ```


  ### Disponibilidad de un worker de board {#q126-station-admitted-worker-readiness}


  El worker puede seguir sin estar listo en todos los Pods activos de board. Comprueba la disponibilidad del contenedor en los Pods actuales.


  ```bash

  kubectl get pods -l app=board -o json | jq ''.items[] | {name: .metadata.name, deleting: .metadata.deletionTimestamp, statuses: .status.containerStatuses}''

  ```


  ### Disponibilidad y recursos del mismo Pod {#q126-station-admitted-single-example}


  Las solicitudes, los límites y la disponibilidad esperados pueden aparecer en distintos Pods. Busca un Pod activo de board cuyo worker cumpla las tres condiciones.


  ```bash

  kubectl get pods -l app=board -o json | jq ''.items[] | {name: .metadata.name, deleting: .metadata.deletionTimestamp, containers: .spec.containers, statuses: .status.containerStatuses}''

  ```


  ### Client admitido y actual {#q126-station-admitted-client}


  El despliegue de client puede estar desactualizado, corresponder a una carga modificada o incluir un worker actual con recursos o disponibilidad inesperados. Comprueba la generación del Deployment, la cadena de propietarios y el Pod admitido.


  ```bash

  jq ''{identity: .identities["deployment/client"], image: .images.client, replicas: .contract.replicas, admitted: .contract.admitted}'' /run/dq/facts/0/admission-identities.json; kubectl get deployment client -o json | jq ''{uid: .metadata.uid, generation: .metadata.generation, observed: .status.observedGeneration, desired: .spec.replicas, ready: .status.readyReplicas}''; kubectl get replicasets,pods -o json | jq ''.items[] | {kind, name: .metadata.name, uid: .metadata.uid, owners: .metadata.ownerReferences, phase: .status.phase, statuses: .status.containerStatuses, workers: [.spec.containers[]? | select(.name=="worker") | {image,resources}]}''

  ```


  ### Uso observado de la cuota {#q126-station-observed-quota-usage}


  El controlador de cuota puede seguir reconciliando el estado o el uso de las cargas admitidas puede diferir del presupuesto. Cuando board y client se estabilicen, compara las solicitudes, límites y Pods en status.used.


  ```bash

  kubectl get resourcequota station -o json | jq ''.status.used''

  ```


  ### Entradas de la comprobación de Pods admitidos {#q126-station-admitted-pods-observer}


  La observación de la admisión puede haberse detenido antes de indicar una condición. Comprueba las lecturas de cuota y cargas y la disponibilidad de los Pods admitidos.


  ```bash

  kubectl get resourcequota station; kubectl get deployments,replicasets,pods

  ```


  ### Respuesta real de board desde client {#q126-station-admitted-board-http}


  El client admitido puede no llegar a board:8080 o no recibir la respuesta esperada north-126. Comprueba la solicitud real desde client.


  ```bash

  kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080

  ```


  ### Puerto HTTP publicado por board {#q127-metrics-board-service-port}


  El Service board puede carecer del puerto http con nombre en TCP 8080. Comprueba la configuración del puerto publicado.


  ```bash

  kubectl get service board -o json | jq ''.spec.ports''

  ```


  ### Puerto de destino del Service board {#q127-metrics-board-target-port}


  targetPort de board puede apuntar a otro puerto o a un nombre que no resuelve a TCP 8080 en todos los Pods de destino actuales. Comprueba los puertos del Service y los contenedores.


  ```bash

  kubectl get service board -o json | jq ''.spec.ports''; kubectl get pods -l app=board -o json | jq ''.items[] | {name: .metadata.name, ports: [.spec.containers[].ports]}''

  ```


  ### Selector del Service board {#q127-metrics-board-selector}


  El selector del Service puede omitir un Pod de board o seleccionar otra carga. Comprueba app: board y compara el selector completo con las etiquetas actuales de los Pods.


  ```bash

  kubectl get service board -o json | jq ''.spec.selector''; kubectl get pods --show-labels

  ```


  ### Entradas de la comprobación del Service board {#q127-metrics-board-observer-input}


  La observación puede haberse detenido antes de indicar una condición. Comprueba el acceso al Service board y a las cargas actuales.


  ```bash

  kubectl get service board; kubectl get deployments,replicasets,pods

  ```


  ### Identidades conservadas de las cargas observadoras {#q127-metrics-retained-observer-identity}


  Un Service o carga proporcionados pueden ser ilegibles, haber sido sustituidos o usar otra imagen. Compara los objetos actuales y las imágenes de worker con el registro de identidades.


  ```bash

  jq ''{serviceUID,deployments}'' /run/dq/facts/0/observer-identities.json; kubectl get deployment board client observer-count observer-total -o custom-columns=NAME:.metadata.name,UID:.metadata.uid,IMAGE:.spec.template.spec.containers[*].image; kubectl get service board -o jsonpath=''{.metadata.uid}''; kubectl get replicaset,pod -o json | jq ''.items[] | {kind, name: .metadata.name, uid: .metadata.uid, owner: .metadata.ownerReferences, workers: [.spec.containers[]? | {name,image}]}''

  ```


  ### Programa conservado de los observadores {#q127-metrics-retained-observer-program}


  El ConfigMap de métricas o del programa puede haberse sustituido, el programa puede haber cambiado o el worker actual puede iniciar otro comando. Comprueba los ConfigMaps proporcionados, el comando de arranque y el hash del programa montado.


  ```bash

  jq ''{metricsUID,programUID,programHash}'' /run/dq/facts/0/observer-identities.json; kubectl get configmaps board-metrics observer-program -o custom-columns=NAME:.metadata.name,UID:.metadata.uid; kubectl get configmap observer-program -o json | jq -jr ''.data["poll.sh"]'' | sha256sum; kubectl get deployments observer-count observer-total -o json | jq ''.items[] | {name: .metadata.name, launch: [.spec.template.spec.containers[] | select(.name=="worker") | .command]}''; for name in observer-count observer-total; do kubectl exec "deployment/$name" -c worker -- sha256sum /opt/observer/poll.sh; done

  ```


  ### Entradas del observador en la plantilla {#q127-metrics-observer-environment-template}


  La plantilla del Deployment puede resolver entradas distintas para la consulta. Compara PROMETHEUS_URL, METRIC, ROUTE, JOB y OPERATION de cada observador con el objetivo proporcionado.


  ```bash

  jq ''{intent, operations: [.contract.consumers[] | {deployment,operation}]}'' /run/dq/facts/0/observer-identities.json; kubectl get deployments observer-count observer-total -o json | jq ''.items[] | {name: .metadata.name, env: [.spec.template.spec.containers[] | select(.name=="worker") | {env,envFrom}]}''

  ```


  ### Entorno real del observador {#q127-metrics-observer-current-environment}


  Puede faltar un Pod actual y listo del observador o el entorno de worker puede diferir de las entradas esperadas. Comprueba la cadena de propietarios y repite la observación dentro del Pod.


  ```bash

  jq ''{intent, operations: [.contract.consumers[] | {deployment,operation}]}'' /run/dq/facts/0/observer-identities.json; kubectl get deployments,replicasets,pods -o wide; for name in observer-count observer-total; do kubectl exec "deployment/$name" -c worker -- sh -c ''printf "%s\n" "$PROMETHEUS_URL" "$METRIC" "$ROUTE" "$JOB" "$OPERATION"''; done

  ```


  ### Estado de la consulta de Prometheus {#q127-metrics-query-status}


  La consulta indicada de Prometheus puede ser inaccesible o haber devuelto un error. Comprueba el endpoint desde client y repite la consulta del mensaje hasta confirmar status success.


  ```bash

  url=$(jq -er .url /run/dq/facts/0/prometheus-target.json); for query in up%7Bjob%3D%22board%22%7D sum%28station_queue_depth%7Bjob%3D%22board%22%2Croute%3D%22north%22%7D%29 count%28station_queue_depth%7Bjob%3D%22board%22%2Croute%3D%22north%22%7D%29; do kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/query?query=$query"; done

  ```


  ### Cantidad de resultados de Prometheus {#q127-metrics-query-vector-cardinality}


  La consulta indicada puede devolver cero entradas o más de una. Comprueba los filtros job y route y confirma que esa consulta devuelve un solo resultado.


  ```bash

  url=$(jq -er .url /run/dq/facts/0/prometheus-target.json); for query in up%7Bjob%3D%22board%22%7D sum%28station_queue_depth%7Bjob%3D%22board%22%2Croute%3D%22north%22%7D%29 count%28station_queue_depth%7Bjob%3D%22board%22%2Croute%3D%22north%22%7D%29; do kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/query?query=$query" | jq ''.data.result | length''; done

  ```


  ### Muestra observada de Prometheus {#q127-metrics-query-observed-value}


  La consulta indicada puede haber devuelto una muestra distinta. Según la consulta del mensaje, compara up con 1, sum con 7 o count con 2.


  ```bash

  url=$(jq -er .url /run/dq/facts/0/prometheus-target.json); for query in up%7Bjob%3D%22board%22%7D sum%28station_queue_depth%7Bjob%3D%22board%22%2Croute%3D%22north%22%7D%29 count%28station_queue_depth%7Bjob%3D%22board%22%2Croute%3D%22north%22%7D%29; do kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/query?query=$query" | jq ''.data.result[0].value[1]''; done

  ```


  ### Salud del destino activo board {#q127-metrics-active-board-target}


  Prometheus puede carecer de un destino activo board con estado up y lastError vacío. Revisa la lista de destinos activos y el error de recolección.


  ```bash

  url=$(jq -er .url /run/dq/facts/0/prometheus-target.json); kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/targets?state=active" | jq ''.data.activeTargets[] | {job: .labels.job, health, lastError}''

  ```


  ### Resultado servido por el observador {#q127-metrics-observer-result-delivery}


  Un observador puede carecer de un worker actual y listo o publicar un resultado desactualizado o erróneo. Comprueba la respuesta local de cada observador, donde count debe dar 2 y sum 7.


  ```bash

  jq ''.contract.consumers[] | {deployment,operation,expected}'' /run/dq/facts/0/observer-identities.json; for name in observer-count observer-total; do kubectl rollout status "deployment/$name" --timeout=10s; kubectl exec "deployment/$name" -c worker -- wget -qO- -T 2 http://127.0.0.1:8080; done

  ```


  ### Progreso del sondeo del observador {#q127-metrics-observer-poll-progress}


  El contador de observaciones puede haberse detenido. Lee /tmp/observations dos veces en el mismo worker actual y confirma que aumenta durante el sondeo.


  ```bash

  for name in observer-count observer-total; do kubectl rollout status "deployment/$name" --timeout=10s; pod=$(kubectl get pods -l "app=$name" -o json | jq -er ''[.items[] | select(.metadata.deletionTimestamp==null and any(.status.conditions[]?; .type=="Ready" and .status=="True")) | .metadata.name] | if length==1 then .[0] else error("expected one current Ready Pod") end'') || continue; kubectl exec "$pod" -c worker -- cat /tmp/observations; sleep 1.1; kubectl exec "$pod" -c worker -- cat /tmp/observations; done

  ```


  ### Entradas de la comprobación de entrega del resultado {#q127-metrics-observer-delivery-input}


  La observación de entrega puede haberse detenido antes de indicar una condición. Comprueba que estén disponibles el endpoint de Prometheus y los Pods de client y observadores.


  ```bash

  test -s /run/dq/facts/0/prometheus-target.json; kubectl get deployment client observer-count observer-total

  ```

  '
