heading: Presupuestos de admisión y métricas
text: '# Presupuestos de admisión y métricas


  ResourceQuota contabiliza todos los consumidores admitidos del namespace. LimitRange aplica defaults al admitir;
  sus cambios no reescriben Pods. Reemplazo o surge puede requerir presupuesto mientras Pods viejos lo consumen.
  Compara uso, ambas plantillas, recursos admitidos y mensajes ReplicaSet. Coordina generaciones dentro del presupuesto
  fijo. CPU defaults y memoria admitida actual no prueban historial ni capacidad del nodo.


  En el quest 127, transporte de scrape, etiquetas de series e intención de consultas posteriores tienen vidas distintas.
  Un gauge describe un valor actual; count y sum deben usar el ámbito de series previsto. Targets sanos no actualizan
  configuraciones antiguas de consumidores. Sigue exporter, Prometheus privado y ambos consumidores: entradas deseadas,
  entorno actual de Pod, programa suministrado, agregado servido y contador creciente. Instantáneas y progreso actuales
  demuestran operación actual, no todo el historial.


  Referencias: [LimitRange](https://kubernetes.io/docs/concepts/policy/limit-range/), [ResourceQuota](https://kubernetes.io/docs/concepts/policy/resource-quotas/),
  [consultas Prometheus](https://prometheus.io/docs/prometheus/latest/querying/basics/).


  En la misión 126 inspecciona el estado de admisión:


  ```sh

  cd ~/quest

  cat admission-contract.json

  kubectl get resourcequota station -o yaml

  kubectl get limitrange defaults -o yaml

  kubectl get deployment,replicaset,pods -o yaml

  ```


  En la misión 127 inspecciona el Service y consulta up al Prometheus privado:


  ```sh

  cd ~/quest

  kubectl get service board -o yaml

  url=$(jq -r .url prometheus-target.json)

  kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/query?query=up%7Bjob%3D%22board%22%7D"

  cat observer-contract.json

  kubectl get deployment,configmap,pods -o yaml

  ```


  En el quest 121, distingue un fallo de transporte de admission de un rechazo explícito de la política. Un recibo
  de control solo confirma su solicitud limitada, no la admisión de un registro de la aplicación. La publicación
  API y la adopción por consumidores tienen vidas distintas: el entorno se captura al iniciar el proceso y un montaje
  subPath mantiene su enlace original al archivo. Compara el registro y la clave protegidos con las referencias
  deseadas de cargas, sus Pods actuales, entradas reales y respuestas. Los datos provisionales conservados sirven
  de control, no sustituyen la adopción de la fuente validada. Conserva el límite privado de confianza y fail-closed
  al probar dry-runs de servidor aceptados y rechazados. El estado actual no demuestra todo el historial de solicitudes.'
