heading: Presupuestos de admisión y métricas
text: '# Presupuestos de admisión y métricas


  Usa solo la bahía sin conexión. Un LimitRange puede asignar solicitudes y límites predeterminados a un contenedor nuevo; ResourceQuota limita el presupuesto total del namespace. La admisión aplica valores predeterminados a Pods nuevos, no existentes. En la misión 126 inspecciona quota, defaults y la plantilla Deployment sin recursos proporcionados y lee los eventos del ReplicaSet. Corrige los valores CPU, recrea el Pod mediante el Deployment e inspecciona CPU y memoria del Pod realmente admitido. Una cuota no garantiza capacidad del nodo y esta comprobación no inspecciona los valores de memoria actuales del LimitRange.


  En la misión 127 un Service asigna su puerto a un puerto destino de Pods coincidentes. Prometheus consulta periódicamente un endpoint configurado y guarda series temporales distinguidas por etiquetas. Un gauge es un valor actual: usa `sum` y `count` sobre `station_queue_depth{job="board",route="north"}` en vez de `rate`. Inspecciona `metrics.json`, el Service y `prometheus-target.json`, corrige el puerto y espera un scrape. Consulta `up`, suma y cuenta del gauge y salud del target usando la URL privada. Un Pod listo no demuestra un scrape ni una métrica registrada. Los resultados actuales no demuestran qué edición se hizo.


  Referencias: [LimitRange](https://kubernetes.io/docs/concepts/policy/limit-range/), [ResourceQuota](https://kubernetes.io/docs/concepts/policy/resource-quotas/), [consultas Prometheus](https://prometheus.io/docs/prometheus/latest/querying/basics/).


  En la misión 126 inspecciona el estado de admisión:


  ```sh

  cd ~/quest

  kubectl describe resourcequota station

  kubectl get limitrange defaults -o yaml

  kubectl describe rs

  kubectl get pods -l app=board -o yaml

  ```


  Tras corregir los valores CPU, escala board a cero. Espera a que no queden Pods board y sus ReplicaSets deseen cero réplicas; esto libera la cuota fija e interrumpe brevemente el servicio. Luego reinicia el Deployment y escala de nuevo a una réplica:


  ```sh

  kubectl scale deployment/board --replicas=0

  kubectl get pods -l app=board

  kubectl get replicasets -l app=board

  ```


  Repite ambos comandos `kubectl get` hasta que no queden Pods board y la columna DESIRED sea cero en cada ReplicaSet board. Solo entonces ejecuta los siguientes comandos:


  ```sh

  kubectl rollout restart deployment/board

  kubectl scale deployment/board --replicas=1

  kubectl rollout status deployment/board --timeout=90s

  ```


  En la misión 127 inspecciona el Service y consulta up al Prometheus privado:


  ```sh

  cd ~/quest

  kubectl get service board -o yaml

  url=$(jq -r .url prometheus-target.json)

  kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/query?query=up%7Bjob%3D%22board%22%7D"

  ```


  En el ejercicio 121, la admisión fail-closed rechaza solicitudes cuando el validating webhook es inaccesible; esto difiere de una denegación explícita. Solicita la reparación limitada restore-path sin cambiar la configuración de solo lectura, conserva la CA y el alcance del namespace y aplica north-121. Comprueba disponibilidad y HTTP; después verifica con dry-run del servidor tanto la ruta válida como el rechazo de closed.

  '
