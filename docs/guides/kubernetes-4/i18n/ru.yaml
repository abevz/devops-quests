heading: '4. Пробы: запуск, готовность и перезапуск имеют разные последствия'
text: "## 4. Пробы: запуск, готовность и перезапуск имеют разные последствия\n\n**Коротко**\n- Startup даёт приложению время начать работу\n- Readiness управляет готовностью принимать трафик\n- Liveness может вызвать перезапуск контейнера.\n\n**Короткий сценарий**\n\nReadiness возвращает ошибку. Liveness успешна, процесс жив.\n\n**Предскажи:** Требует ли сама readiness перезапуска?\n\n> [!question]- Ответ\n> Разбор заданных условий: Нет. Pod перестаёт считаться готовым для обычного трафика Service; перезапуск не является её действием.\n\n**`probes.yaml` в `/tmp/vg-k8s-work` — полный Pod с тремя проверками:**\n\n```yaml\napiVersion: v1\nkind: Pod\nmetadata:\n  name: probes\n  namespace: vg-k8s\nspec:\n  containers:\n    - name: nginx\n      image: nginx:1.27\n      ports:\n        - containerPort: 80\n      startupProbe:\n        httpGet:\n          path: /\n          port: 80\n        periodSeconds: 2\n        timeoutSeconds: 1\n        failureThreshold: 30\n      readinessProbe:\n        httpGet:\n          path: /\n          port: 80\n        periodSeconds: 2\n        timeoutSeconds: 1\n        failureThreshold: 1\n      livenessProbe:\n        httpGet:\n          path: /\n          port: 80\n        periodSeconds: 5\n        timeoutSeconds: 1\n        failureThreshold: 3\n```\n\nПроба — проверка kubelet, а не отдельный мониторинговый сервер.\n`httpGet` проверяет HTTP-ответ, `tcpSocket` — подключение, `exec` — код завершения команды внутри контейнера;\nесть также встроенная проверка gRPC. TCP-подключение не доказывает правильность бизнес-операции.\n*(по документации)* — [настройка проб](https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/).\n\n> [!info]- Глубже\n> | Проба | Вопрос | Что делает kubelet после устойчивого отказа |\n> |---|---|---|\n> | `startupProbe` | Завершён ли начальный запуск? | Перезапускает контейнер; пока нет успеха, readiness/liveness отключены |\n> | `readinessProbe` | Можно ли отправлять сюда запросы? | Делает контейнер неготовым; обычный Service исключает неготовый адрес |\n> | `livenessProbe` | Нужно ли перезапустить зависший процесс? | Останавливает и перезапускает контейнер согласно политике |\n>\n> 1. Kubelet выполняет проверку и учитывает последовательные успехи/отказы.\n> 2. `periodSeconds` задаёт период, `timeoutSeconds` — предел ожидания одной проверки.\n> 3. `failureThreshold` — число неуспехов до реакции; у startup это бюджет запуска.\n> 4. При readiness меняется готовность; контроллер EndpointSlice передаёт её сетевому слою.\n> 5. При liveness/startup контейнер останавливается; ошибка пробы не обязательно становится ошибочным кодом выхода.\n>\n> Таблица и порядок — *(по документации)* — источник проб выше.\n> Числа ниже заданы явно: они являются учебной настройкой, не перечнем значений по умолчанию.\n>\n> Startup допускает примерно `30 × 2 = 60` секунд проверок до реакции; это не точный секундомер\n> всего старта пода, включая скачивание образа. *(по документации)* — источник проб выше.\n> Пример с тремя пробами проверен по API отдельно; одновременный отказ всех трёх не воспроизводился.\n> *(не проверено)* — поведение этого полного сочетания.\n\n### Как пробы ломают развёртывание\n\n**Коротко**\n- Неверная проба может остановить продвижение rollout\n- Живой процесс не всегда готов обслуживать запрос\n- Проверять нужно путь и назначение конкретной пробы.\n\n**Короткий сценарий**\n\nПриложение отвечает 200 на /health, readiness настроена на /missing и получает 404.\n\n**Предскажи:** Какое наблюдение отличит ошибку пробы от падения процесса?\n\n> [!question]- Ответ\n> Разбор заданных условий: Контейнер работает, restartCount не растёт, в событиях ошибка readiness 404. Это не доказательство падения приложения.\n\nReadiness на несуществующем пути не убивает процесс: новые поды живы, но не становятся доступными,\nпоэтому Deployment с `maxUnavailable: 0` сохраняет старые реплики и останавливает продвижение.\nНеверная liveness создаёт перезапуски здорового приложения; слишком короткая startup не даёт\nмедленному приложению закончить запуск. Проверка БД в liveness может перезапустить все реплики\nво время отказа БД и усилить инцидент — это инженерный вывод из реакции пробы.\n\n> [!info]- Глубже\n> **Вывод событий нового запуска — пример для чтения:**\n>\n> ```text\n> Readiness probe failed: HTTP probe failed with statuscode: 404\n> Liveness probe failed: HTTP probe failed with statuscode: 404\n> Container app failed liveness probe, will be restarted\n> ```\n>\n> Readiness-отказ воспроизведён в Deployment из §6, liveness-отказ — в отдельном Pod с nginx.\n> У liveness-пода наблюдались перезапуск и успешный код завершения nginx; это не гарантированный код\n> для других приложений. *(проверено)*.\n>\n> **Предскажи:** readiness сломана, liveness успешна. Будет ли kubelet перезапускать контейнер?\n>\n> > [!question]- Ответ\n> > Только из-за readiness — нет. Новый контейнер остаётся живым, но неготовым.\n> > В новом прогоне развёртывание дошло до `ProgressDeadlineExceeded`, старые реплики сохранились.\n> > *(проверено)*.\n>\n> **Короткий ответ на английском:**\n>\n> > Startup protects a slow start. Readiness controls whether a Pod receives normal Service traffic.\n> > Liveness restarts a container that cannot recover by itself. A failed readiness check does not restart it.\n"
