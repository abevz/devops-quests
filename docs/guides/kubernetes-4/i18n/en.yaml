heading: '4. Probes: startup, readiness and restart have different consequences'
text: "## 4. Probes: startup, readiness and restart have different consequences\n\n**At a glance**\n- Startup gives the application time to start\n- Readiness controls whether it is ready to receive traffic\n- Liveness can trigger a container restart.\n\n**Short scenario**\n\nReadiness fails. Liveness succeeds, and the process is alive.\n\n**Predict:** Does readiness itself require a restart?\n\n> [!question]- Answer\n> Analysis of the given conditions: No. The Pod is no longer considered ready for normal Service traffic; restarting is not a readiness action.\n\n**`probes.yaml` in `/tmp/vg-k8s-work`: a complete Pod with three probes:**\n\n```yaml\napiVersion: v1\nkind: Pod\nmetadata:\n  name: probes\n  namespace: vg-k8s\nspec:\n  containers:\n    - name: nginx\n      image: nginx:1.27\n      ports:\n        - containerPort: 80\n      startupProbe:\n        httpGet:\n          path: /\n          port: 80\n        periodSeconds: 2\n        timeoutSeconds: 1\n        failureThreshold: 30\n      readinessProbe:\n        httpGet:\n          path: /\n          port: 80\n        periodSeconds: 2\n        timeoutSeconds: 1\n        failureThreshold: 1\n      livenessProbe:\n        httpGet:\n          path: /\n          port: 80\n        periodSeconds: 5\n        timeoutSeconds: 1\n        failureThreshold: 3\n```\n\nA probe is a kubelet check, not a separate monitoring server.\n`httpGet` checks the HTTP response, `tcpSocket` the connection, and `exec` the exit code of a command inside the container;\nthere is also a built-in gRPC check. A TCP connection does not prove that a business operation is correct.\n*(according to documentation)* — [probe configuration](https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/).\n\n> [!info]- Deeper explanation\n> | Probe | Question | Kubelet action after sustained failure |\n> |---|---|---|\n> | `startupProbe` | Has initial startup finished? | Restarts the container; readiness/liveness remain disabled until startup succeeds |\n> | `readinessProbe` | Can requests be sent here? | Marks the container unready; an ordinary Service excludes the unready address |\n> | `livenessProbe` | Should a stuck process be restarted? | Stops and restarts the container according to its policy |\n>\n> 1. Kubelet runs checks and counts consecutive successes/failures.\n> 2. `periodSeconds` sets the interval; `timeoutSeconds` limits one check.\n> 3. `failureThreshold` counts failures before action; for startup it provides a startup budget.\n> 4. Readiness changes ready status; the EndpointSlice controller passes that status to the network layer.\n> 5. Liveness/startup stops the container; probe failure does not necessarily produce a failing process exit code.\n>\n> The table and sequence are *(according to documentation)* — the probe source above.\n> The numbers below are explicit exercise settings, not a list of defaults.\n>\n> Startup permits approximately `30 × 2 = 60` seconds of checks before action; this is not an exact stopwatch\n> for the entire pod startup including the image download. *(according to documentation)* — the probe source above.\n> The three-probe example was checked against the API separately; simultaneous failure of all three was not reproduced.\n> *(not verified)* — behavior of this complete combination.\n\n### How probes break a rollout\n\n**At a glance**\n- An incorrect probe can stall a rollout\n- A live process is not always ready to serve requests\n- Check the path and purpose of the specific probe.\n\n**Short scenario**\n\nThe application returns 200 on /health, but readiness points to /missing and receives 404.\n\n**Predict:** Which observation distinguishes a probe error from a crashed process?\n\n> [!question]- Answer\n> Analysis of the given conditions: The container is running, restartCount is not increasing, and events report readiness 404 failures. This does not prove the application crashed.\n\nReadiness on a nonexistent path does not kill the process: new pods stay alive but unavailable,\nso a Deployment with `maxUnavailable: 0` retains old replicas and stops progressing.\nIncorrect liveness restarts a healthy application; an overly short startup budget prevents\na slow application from finishing startup. Checking the database in liveness can restart every replica\nduring a database outage and amplify the incident — an engineering inference from probe behavior.\n\n> [!info]- Deeper explanation\n> **Events from a fresh run: an example to read:**\n>\n> ```text\n> Readiness probe failed: HTTP probe failed with statuscode: 404\n> Liveness probe failed: HTTP probe failed with statuscode: 404\n> Container app failed liveness probe, will be restarted\n> ```\n>\n> Readiness failure was reproduced in the §6 Deployment, liveness failure in a separate nginx Pod.\n> The liveness pod restarted and nginx exited successfully; that exit code is not guaranteed\n> for other applications. *(verified)*.\n>\n> **Predict:** readiness fails and liveness succeeds. Will kubelet restart the container?\n>\n> > [!question]- Answer\n> > Not merely because readiness fails. The new container remains alive but unready.\n> > In the new run the rollout reached `ProgressDeadlineExceeded` and old replicas remained.\n> > *(verified)*.\n>\n> **Short answer in English:**\n>\n> > Startup protects a slow start. Readiness controls whether a Pod receives normal Service traffic.\n> > Liveness restarts a container that cannot recover by itself. A failed readiness check does not restart it."
