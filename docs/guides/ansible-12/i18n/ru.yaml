heading: 12. Роли, коллекции и подключение (`import_*`, `include_*`)
text: "## 12. Роли, коллекции и подключение (`import_*`, `include_*`)\n\n**Коротко**\n- Роль собирает связанные задачи и настройки.\n- Коллекция распространяет модули и роли под общим именем.\n- Наличие ansible-core не гарантирует наличие сторонней коллекции.\n\n**Мини-пример:** в отдельном временном каталоге сохрани `mini.yml`; запуск — `ansible-playbook -i localhost, -c local mini.yml`. Пример работает на localhost без become.\n\n```yaml\n- hosts: localhost\n  connection: local\n  become: false\n  gather_facts: false\n  tasks:\n    - ansible.builtin.include_role:\n        name: demo\n```\n\n**Дополнительные файлы в том же временном каталоге:**\n\n`roles/demo/tasks/main.yml`:\n\n```yaml\n- ansible.builtin.debug:\n    msg: from role\n```\n\n**Предскажи:** что покажет запуск и каким будет код завершения?\n\n> [!question]- Ответ\n> Запуск 1; код 0. Фрагменты stdout:\n>\n> ```text\n>     \"msg\": \"from role\"\n> localhost                  : ok=2    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n>\n> Запуск 2; код 0. Фрагменты stdout:\n>\n> ```text\n>     \"msg\": \"from role\"\n> localhost                  : ok=2    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n\nЗадача подключает роль `demo` из локального каталога. Роль печатает сообщение в том же сценарии, без отдельного процесса приложения.\n\nПолный минимальный комплект роли, каждый блок — свой файл:\n\n`roles/demo/defaults/main.yml`:\n\n```yaml\nmessage: hello\n```\n\n`roles/demo/tasks/main.yml`:\n\n```yaml\n- name: Show role input\n  ansible.builtin.debug:\n    msg: \"{{ message }}\"\n```\n\n`site.yml`:\n\n```yaml\n- name: Use a role\n  hosts: lab\n  connection: local\n  gather_facts: false\n  become: false\n  roles:\n    - role: demo\n      message: custom input\n```\n\n**Роль** — пакет связанных задач, значений по умолчанию, обработчиков и шаблонов. Она не отдельный сервер и не новый\nпроцесс: её задачи входят в выполнение сценария. Автоматическая структура решает, где искать файлы.\n**Коллекция** — пакет с пространством имён и версией, содержащий роли, модули, плагины и документацию.\n`ansible-core` — движок и встроенные модули; дистрибутив `ansible` включает набор коллекций сообщества.\n\n```text\nsite.yml\nroles/demo/\n  defaults/main.yml        # слабые, настраиваемые значения\n  vars/main.yml            # сильные внутренние значения, если нужны\n  tasks/main.yml           # список задач без внешних ключей hosts/tasks\n  handlers/main.yml        # список обработчиков\n  templates/app.conf.j2\n  files/static.conf\n  meta/main.yml            # зависимости\n  meta/argument_specs.yml  # контракт входных параметров, если нужен\nrequirements.yml\n```\n\nПараметр роли `message` перекрывает значения по умолчанию. Если настраиваемое значение спрятать в `vars/main.yml`,\ninventory уже не сможет его настроить (§5). `meta/main.yml` с `dependencies: []` означает отсутствие\nзависимостей; непустой список запускает зависимости раньше роли. Не прячьте весь порядок поэтапного обновления\nв цепочку зависимостей: критичный порядок проще видеть в сценарии.\n*(по документации)* [Роли](https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_reuse_roles.html).\n\n### Статическое и динамическое подключение (`import_*`, `include_*`)\n\n**Коротко**\n- import_tasks раскрывает список при разборе сценария.\n- include_tasks подключает список во время выполнения.\n- Из-за этого список задач и отбор по меткам могут различаться.\n\n**Мини-пример:** в отдельном временном каталоге сохрани `mini.yml`; запуск — `ansible-playbook -i localhost, -c local mini.yml`. Пример работает на localhost без become.\n\n```yaml\n- hosts: localhost\n  connection: local\n  become: false\n  gather_facts: false\n  tasks:\n    - ansible.builtin.import_tasks: part.yml\n    - ansible.builtin.include_tasks: part.yml\n```\n\n**Дополнительные файлы в том же временном каталоге:**\n\n`part.yml`:\n\n```yaml\n- ansible.builtin.debug:\n    msg: part\n```\n\n**Предскажи:** Сколько раз появится сообщение part в обычном запуске?\n\n> [!question]- Ответ\n> Запуск 1; код 0. Фрагменты stdout:\n>\n> ```text\n>     \"msg\": \"part\"\n>     \"msg\": \"part\"\n> localhost                  : ok=3    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n>\n> Запуск 2; код 0. Фрагменты stdout:\n>\n> ```text\n>     \"msg\": \"part\"\n>     \"msg\": \"part\"\n> localhost                  : ok=3    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n\nОба подключения выполняют одну задачу из `part.yml`, поэтому сообщение появляется дважды. Статическое и динамическое подключение остаются разными механизмами.\n\nПолный `reuse.yml` и файл `part.yml`:\n\n```yaml\n# reuse.yml\n- name: Compare loading modes\n  hosts: lab\n  connection: local\n  gather_facts: false\n  become: false\n  tasks:\n    - name: Static\n      ansible.builtin.import_tasks: part.yml\n      tags: [static]\n    - name: Dynamic\n      ansible.builtin.include_tasks: part.yml\n      loop: [one, two]\n      tags: [dynamic]\n```\n\n```yaml\n# part.yml\n- name: Part\n  ansible.builtin.debug:\n    msg: \"{{ item | default('no loop') }}\"\n```\n\n*(проверено)* `--list-tasks` показал `Part TAGS: [static]` и `Dynamic TAGS: [dynamic]`.\nОбычный запуск дал `no loop`, затем `one`, `two`. Но `--tags dynamic` только включил файл дважды,\nего непомеченные `Part` не выполнились: итоговая сводка `ok=2`, сообщений `one`/`two` нет.\nЧтобы выбрать и детей, задайте под `include_tasks`:\n\n**`import_*`** разворачивается при разборе playbook. **`include_*`** раскрывается во время выполнения,\nкогда становятся известны переменные хоста и элемент цикла. Так объясняются различия:\n\n| Свойство | `import_tasks` / `import_role` | `include_tasks` / `include_role` |\n|---|---|---|\n| `--list-tasks` | Видны внутренние задачи | Обычно видна задача включения, содержимое ещё не раскрыто. |\n| `when` | Передаётся внутренним задачам; вычисляется для них | Проверяет включение; после входа не пересматривает это же условие за все задачи. |\n| `tags` | Наследуются внутренними задачами | На задаче включения выбирают само включение; дочерним задачам нужны метки или `apply` отдельно. |\n| `loop` | На задаче или роли с `import_*` не поддерживается | Можно повторять включение для каждого элемента. |\n| Имя файла | Должно быть доступно при разборе | Может зависеть от данных времени выполнения. |\n| `--start-at-task` | Внутреннее имя обычно доступно | Нельзя произвольно стартовать в ещё не раскрытом динамическом включении. |\n\n> [!info]- Глубже\n> **Фрагмент `reuse.yml` — вложенные ключи задачи `include_tasks`:**\n>\n> ```yaml\n> file: part.yml\n> apply:\n>   tags: [dynamic]\n> ```\n>\n> Это **фрагмент аргументов** вместо строки `part.yml`; внешний ключ `tags: [dynamic]` всё равно нужен,\n> чтобы добраться до включения. Не смешивайте ключевые слова задачи с аргументами модуля.\n> *(по документации)* [Повторное использование содержимого](https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_reuse.html).\n>\n> **Обработчики и подключение:** статическое включение в `handlers` даёт отдельные обработчики из файла;\n> уведомляют их имена. Динамическое включение в `handlers` можно уведомить по имени задачи включения, после чего\n> выполнится включённый список. Обработчики динамически подключённой роли становятся доступны после\n> её включения: нельзя уведомить ещё не зарегистрированный обработчик раньше `include_role`.\n> Обработчик сам не поддерживает обычный `import_role`/`include_role` как способ вызова роли.\n> Эти границы следует сверять, а не выводить из «динамическое включение везде работает одинаково».\n> *(по документации)* [Обработчики и включение](https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_handlers.html).\n\n### Galaxy и общий контракт для команд\n\n**Коротко**\n- Galaxy распространяет зависимости, а не выполняет сценарии.\n- requirements.yml перечисляет нужные коллекции или роли.\n- Фиксация версии помогает повторить окружение управляющей машины.\n\n**Короткий сценарий**\n\nЛокальный запуск использует коллекцию из requirements.yml. В CI установлен только ansible-core, сама коллекция не установлена.\n\n**Предскажи:** Достаточно ли одинаковой версии ansible-core для повторения запуска?\n\n> [!question]- Ответ\n> Нет. В CI должна присутствовать и требуемая коллекция с её зависимостями. Это разбор состава окружения; установка Galaxy в этой задаче не выполнялась.\n\n**`requirements.yml`:**\n\n```yaml\ncollections:\n  - name: kubernetes.core\n    version: \"6.1.0\"\n```\n\n```bash\nansible-galaxy collection install -r requirements.yml\n```\n\nGalaxy — каталог и способ распространения содержимого, не исполнитель задач. `requirements.yml` фиксирует зависимости.\nНапример для реальной коллекции (версия намеренно фиксирована, не объявляется последней):\n\nУстановка здесь не выполнялась. Для отдельной роли используйте `roles:` с `name`/`src` и `version`;\n`version` — метка или коммит для источника в Git. Полное имя модуля коллекции не содержит её версию: версия выбирается\nустановкой или образом среды выполнения, а не строкой `kubernetes.core.k8s`.\n*(по документации)* [Galaxy](https://docs.ansible.com/ansible/latest/galaxy/user_guide.html),\n[Установка коллекций](https://docs.ansible.com/ansible/latest/collections_guide/collections_installing.html).\n\nДля многих команд: документированные значения по умолчанию и описание входных параметров, версионные выпуски, журнал изменений,\nтесты совместимости с поддерживаемыми `ansible-core` и ОС, пробные потребители перед обновлением основной версии.\nКоманды фиксируют версии и обновляют через ревью; изменяемая ветка `main` делает одинаковый playbook разным завтра.\nЭто рекомендуемая организация совместной работы команд.\n\n> [!info]- Глубже\n> Типичный сбой — отсутствующая роль/коллекция или включение отфильтровано метками. Первое видно при\n> проверке синтаксиса или поиске модуля; второе может дать успешную итоговую сводку **без нужных задач**.\n> Поиск доступной `kubernetes.core.k8s` прошёл проверку синтаксиса; сценарий отсутствия коллекции не воспроизводился.\n\n### Предскажи 11: Метка статического включения\n\n**Коротко**\n- import_tasks подключает задачи при разборе сценария.\n- Метка статического подключения распространяется на вложенные задачи.\n- Смотри, какие задачи выбраны, а не только наличие метки у include.\n\n**`predict-11.yml` (имя любое) рядом с `inventory.ini` из §2; `part.yml` — в том же каталоге:**\n\n```yaml\n- hosts: lab\n  connection: local\n  gather_facts: false\n  become: false\n  tasks:\n  - name: Probe\n    ansible.builtin.import_tasks: part.yml\n    tags:\n    - pick\n```\n\n`part.yml` (без меток):\n\n```yaml\n- name: Child\n  ansible.builtin.debug:\n    msg: child ran\n```\n\n**Предскажи:** Оба раза добавь `--tags pick`. Выполнится ли `Child`, и каковы сводки?\n\n> [!question]- Ответ\n> ```text\n> # Первый запуск; код завершения 0\n> ok: [localhost] => {\n>     \"msg\": \"child ran\"\n> }\n> localhost                  : ok=1    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> # Второй запуск; код завершения 0\n> ok: [localhost] => {\n>     \"msg\": \"child ran\"\n> }\n> localhost                  : ok=1    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n> Метка статического включения наследуется задачами файла; `Child` выполняется в каждом запуске.\n\n### Предскажи 12: Метка динамического включения\n\n**Коротко**\n- include_tasks подключает задачи во время выполнения.\n- Метка самого include не добавляет автоматически ту же метку его задачам.\n- Отбор по метке может открыть файл и затем пропустить его содержимое.\n\n**`predict-12.yml` (имя любое) рядом с `inventory.ini` из §2; `part.yml` — в том же каталоге:**\n\n```yaml\n- hosts: lab\n  connection: local\n  gather_facts: false\n  become: false\n  tasks:\n  - name: Probe\n    ansible.builtin.include_tasks: part.yml\n    tags:\n    - pick\n```\n\n`part.yml` (без меток):\n\n```yaml\n- name: Child\n  ansible.builtin.debug:\n    msg: child ran\n```\n\n**Предскажи:** Замени `import_tasks` на `include_tasks` и оба раза добавь `--tags pick`. Выполнится ли `Child`, и каковы сводки?\n\n> [!question]- Ответ\n> ```text\n> # Первый запуск; код завершения 0\n> included: /tmp/ansible-revision-jRYkFm/part.yml for localhost\n> localhost                  : ok=1    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> # Второй запуск; код завершения 0\n> included: /tmp/ansible-revision-jRYkFm/part.yml for localhost\n> localhost                  : ok=1    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n> Выбрана только задача включения; непомеченная `Child` не выполняется. `ok=1` здесь относится к включению файла, а не к его дочерней задаче.\n\nВопрос: **When would you use `include_tasks` instead of `import_tasks`?**\n\n> I use `include_tasks` when the choice depends on runtime data or when I need a loop around the task\n> file. `import_tasks` is expanded before execution, so its tasks are visible to list-tasks and inherit\n> tags. With an include, I must handle tags on both the include and its child tasks.\n"
