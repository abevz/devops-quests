heading: 12. Roles, collections and inclusion (`import_*`, `include_*`)
text: "## 12. Roles, collections and inclusion (`import_*`, `include_*`)\n\n**At a glance**\n- A role groups related tasks and settings.\n- A collection distributes modules and roles under a shared name.\n- Having ansible-core installed does not guarantee that a third-party collection is available.\n\n**Mini-example:** save `mini.yml` in a separate temporary directory; run `ansible-playbook -i localhost, -c local mini.yml`. The example runs on localhost without become.\n\n```yaml\n- hosts: localhost\n  connection: local\n  become: false\n  gather_facts: false\n  tasks:\n    - ansible.builtin.include_role:\n        name: demo\n```\n\n**Additional files in the same temporary directory:**\n\n`roles/demo/tasks/main.yml`:\n\n```yaml\n- ansible.builtin.debug:\n    msg: from role\n```\n\n**Predict:** What will the run show, and what will its exit code be?\n\n> [!question]- Answer\n> Run 1; exit code 0. Stdout excerpts:\n>\n> ```text\n>     \"msg\": \"from role\"\n> localhost                  : ok=2    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n>\n> Run 2; exit code 0. Stdout excerpts:\n>\n> ```text\n>     \"msg\": \"from role\"\n> localhost                  : ok=2    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n\nA task includes the `demo` role from a local directory. The role prints a message in the same play, without starting a separate application process.\n\nA complete minimal role layout; each block is a separate file:\n\n`roles/demo/defaults/main.yml`:\n\n```yaml\nmessage: hello\n```\n\n`roles/demo/tasks/main.yml`:\n\n```yaml\n- name: Show role input\n  ansible.builtin.debug:\n    msg: \"{{ message }}\"\n```\n\n`site.yml`:\n\n```yaml\n- name: Use a role\n  hosts: lab\n  connection: local\n  gather_facts: false\n  become: false\n  roles:\n    - role: demo\n      message: custom input\n```\n\nA **role** packages related tasks, defaults, handlers and templates. It is not a separate server or new\nprocess: its tasks participate in play execution. Its standard layout determines where files are found.\nA **collection** is a versioned, namespaced package containing roles, modules, plugins and documentation.\n`ansible-core` provides the engine and built-in modules; the `ansible` distribution includes community collections.\n\n```text\nsite.yml\nroles/demo/\n  defaults/main.yml        # low-precedence, configurable values\n  vars/main.yml            # high-precedence internal values, if needed\n  tasks/main.yml           # task list without outer hosts/tasks keys\n  handlers/main.yml        # handler list\n  templates/app.conf.j2\n  files/static.conf\n  meta/main.yml            # dependencies\n  meta/argument_specs.yml  # input contract, if needed\nrequirements.yml\n```\n\nRole parameter `message` overrides defaults. If a configurable value is hidden in `vars/main.yml`,\ninventory can no longer override it (§5). `meta/main.yml` with `dependencies: []` declares no\ndependencies; a nonempty list runs dependencies before the role. Do not hide the entire rolling-update order\nin a dependency chain: critical sequencing is easier to see in the play.\n*(according to documentation)* [Roles](https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_reuse_roles.html).\n\n### Static and dynamic inclusion (`import_*`, `include_*`)\n\n**At a glance**\n- import_tasks expands the task list while the playbook is parsed.\n- include_tasks loads the task list at runtime.\n- As a result, the visible task list and tag selection can differ.\n\n**Mini-example:** save `mini.yml` in a separate temporary directory; run `ansible-playbook -i localhost, -c local mini.yml`. The example runs on localhost without become.\n\n```yaml\n- hosts: localhost\n  connection: local\n  become: false\n  gather_facts: false\n  tasks:\n    - ansible.builtin.import_tasks: part.yml\n    - ansible.builtin.include_tasks: part.yml\n```\n\n**Additional files in the same temporary directory:**\n\n`part.yml`:\n\n```yaml\n- ansible.builtin.debug:\n    msg: part\n```\n\n**Predict:** How many times will the part message appear in a normal run?\n\n> [!question]- Answer\n> Run 1; exit code 0. Stdout excerpts:\n>\n> ```text\n>     \"msg\": \"part\"\n>     \"msg\": \"part\"\n> localhost                  : ok=3    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n>\n> Run 2; exit code 0. Stdout excerpts:\n>\n> ```text\n>     \"msg\": \"part\"\n>     \"msg\": \"part\"\n> localhost                  : ok=3    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n\nBoth inclusions run the one task in `part.yml`, so the message appears twice. Static and dynamic inclusion remain different mechanisms.\n\nComplete `reuse.yml` and `part.yml`:\n\n```yaml\n# reuse.yml\n- name: Compare loading modes\n  hosts: lab\n  connection: local\n  gather_facts: false\n  become: false\n  tasks:\n    - name: Static\n      ansible.builtin.import_tasks: part.yml\n      tags: [static]\n    - name: Dynamic\n      ansible.builtin.include_tasks: part.yml\n      loop: [one, two]\n      tags: [dynamic]\n```\n\n```yaml\n# part.yml\n- name: Part\n  ansible.builtin.debug:\n    msg: \"{{ item | default('no loop') }}\"\n```\n\n*(verified)* `--list-tasks` showed `Part TAGS: [static]` and `Dynamic TAGS: [dynamic]`.\nAn ordinary run printed `no loop`, then `one`, `two`. But `--tags dynamic` merely included the file twice;\nits untagged `Part` tasks did not run: recap `ok=2`, with no `one`/`two` messages.\nTo select children too, configure under `include_tasks`:\n\n**`import_*`** expands when the playbook is parsed. **`include_*`** expands at execution time,\nwhen host variables and loop items are known. This explains the differences:\n\n| Property | `import_tasks` / `import_role` | `include_tasks` / `include_role` |\n|---|---|---|\n| `--list-tasks` | Internal tasks are visible | Usually only the include task is visible; its contents have not expanded. |\n| `when` | Propagates to internal tasks and is evaluated for each | Tests the include; after entry, the same condition is not automatically reevaluated for every child. |\n| `tags` | Inherited by internal tasks | Tags on the include select the include itself; children need their own tags or separate `apply`. |\n| `loop` | Unsupported on an `import_*` task or role | The include can repeat for each item. |\n| Filename | Must be available during parsing | May depend on runtime data. |\n| `--start-at-task` | Internal names are usually available | Cannot arbitrarily start inside an unexpanded dynamic include. |\n\n> [!info]- Deeper explanation\n> **`reuse.yml` fragment: nested arguments of the `include_tasks` task:**\n>\n> ```yaml\n> file: part.yml\n> apply:\n>   tags: [dynamic]\n> ```\n>\n> This **argument fragment** replaces the scalar `part.yml`; the outer task still needs `tags: [dynamic]`\n> to reach the include. Do not mix task keywords with module arguments.\n> *(according to documentation)* [Reusing content](https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_reuse.html).\n>\n> **Handlers and inclusion:** a static import in `handlers` exposes separate handlers from the file;\n> notify their individual names. A dynamic include in `handlers` can be notified by its include-task name, then\n> the included list executes. Handlers from a dynamically included role become available after\n> that role is included: do not notify an unregistered handler before `include_role`.\n> A handler itself does not support ordinary `import_role`/`include_role` as a way to call a role.\n> Check these boundaries instead of inferring that “dynamic inclusion works the same everywhere”.\n> *(according to documentation)* [Handlers and inclusion](https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_handlers.html).\n\n### Galaxy and a shared contract for teams\n\n**At a glance**\n- Galaxy distributes dependencies; it does not run playbooks.\n- requirements.yml lists the required collections or roles.\n- Pinning the version helps reproduce the control-machine environment.\n\n**Short scenario**\n\nThe local run uses the collection from requirements.yml. In CI, only ansible-core is installed; the collection itself is missing.\n\n**Predict:** Is the same ansible-core version enough to reproduce the run?\n\n> [!question]- Answer\n> No. CI must also have the required collection and its dependencies. This examines the environment contents; Galaxy installation was not performed for this task.\n\n**`requirements.yml`:**\n\n```yaml\ncollections:\n  - name: kubernetes.core\n    version: \"6.1.0\"\n```\n\n```bash\nansible-galaxy collection install -r requirements.yml\n```\n\nGalaxy is a catalog and content distribution mechanism, not a task executor. `requirements.yml` pins dependencies.\nFor example, a real collection with an intentionally pinned version, not claimed to be latest:\n\nInstallation was not run here. For a standalone role, use `roles:` with `name`/`src` and `version`;\n`version` is a tag or commit for a Git source. A collection module's fully qualified name does not include its version: select the version\nthrough installation or an execution-environment image, not through the string `kubernetes.core.k8s`.\n*(according to documentation)* [Galaxy](https://docs.ansible.com/ansible/latest/galaxy/user_guide.html),\n[Installing collections](https://docs.ansible.com/ansible/latest/collections_guide/collections_installing.html).\n\nFor multiple teams: documented defaults and input contracts, versioned releases, changelogs,\ncompatibility tests against supported `ansible-core` and OS versions, and canary consumers before major upgrades.\nTeams pin versions and upgrade through review; a mutable `main` branch makes the same playbook behave differently tomorrow.\nThis is a recommended collaboration structure.\n\n> [!info]- Deeper explanation\n> A typical failure is a missing role/collection or an include excluded by tags. The first appears during\n> syntax checking or module resolution; the second may produce a successful recap **without the required tasks**.\n> An available `kubernetes.core.k8s` passed syntax checking; the missing-collection case was not reproduced.\n\n### Predict 11: tag on a static import\n\n**At a glance**\n- import_tasks includes tasks while the playbook is parsed.\n- A tag on a static include propagates to its nested tasks.\n- Check which tasks were selected, not just whether the include has a tag.\n\n**`predict-11.yml` (any filename) beside `inventory.ini` from §2; `part.yml` is in the same directory:**\n\n```yaml\n- hosts: lab\n  connection: local\n  gather_facts: false\n  become: false\n  tasks:\n  - name: Probe\n    ansible.builtin.import_tasks: part.yml\n    tags:\n    - pick\n```\n\n`part.yml` (without tags):\n\n```yaml\n- name: Child\n  ansible.builtin.debug:\n    msg: child ran\n```\n\n**Predict:** add `--tags pick` to both runs. Will `Child` execute, and what are the recaps?\n\n> [!question]- Answer\n> ```text\n> # Первый запуск; код завершения 0\n> ok: [localhost] => {\n>     \"msg\": \"child ran\"\n> }\n> localhost                  : ok=1    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> # Второй запуск; код завершения 0\n> ok: [localhost] => {\n>     \"msg\": \"child ran\"\n> }\n> localhost                  : ok=1    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n> The static import's tag is inherited by file tasks; `Child` runs on every execution.\n\n### Predict 12: tag on a dynamic include\n\n**At a glance**\n- include_tasks includes tasks at runtime.\n- A tag on the include itself does not automatically add that tag to its tasks.\n- Tag selection can open a file and then skip its contents.\n\n**`predict-12.yml` (any filename) beside `inventory.ini` from §2; `part.yml` is in the same directory:**\n\n```yaml\n- hosts: lab\n  connection: local\n  gather_facts: false\n  become: false\n  tasks:\n  - name: Probe\n    ansible.builtin.include_tasks: part.yml\n    tags:\n    - pick\n```\n\n`part.yml` (without tags):\n\n```yaml\n- name: Child\n  ansible.builtin.debug:\n    msg: child ran\n```\n\n**Predict:** replace `import_tasks` with `include_tasks` and add `--tags pick` to both runs. Will `Child` execute, and what are the recaps?\n\n> [!question]- Answer\n> ```text\n> # Первый запуск; код завершения 0\n> included: /tmp/ansible-revision-jRYkFm/part.yml for localhost\n> localhost                  : ok=1    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> # Второй запуск; код завершения 0\n> included: /tmp/ansible-revision-jRYkFm/part.yml for localhost\n> localhost                  : ok=1    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n> Only the include task is selected; untagged `Child` does not run. Here `ok=1` refers to including the file, not its child task.\n\nQuestion: **When would you use `include_tasks` instead of `import_tasks`?**\n\n> I use `include_tasks` when the choice depends on runtime data or when I need a loop around the task\n> file. `import_tasks` is expanded before execution, so its tasks are visible to list-tasks and inherit\n> tags. With an include, I must handle tags on both the include and its child tasks.\n"
