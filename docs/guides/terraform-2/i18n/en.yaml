heading: '2. HCL from scratch: blocks, references and values'
text: "## 2. HCL from scratch: blocks, references and values\n\n**At a glance**\n- HCL describes values in named blocks.\n- locals give a computed value a name.\n- An expression computes a value; it is not a sequence of commands.\n\n**Mini-example:** save this as `main.tf` in a new temporary directory. After preparing the files, run `tofu init`, `tofu validate`, then `tofu apply -auto-approve -input=false -no-color`.\n\n```hcl\nlocals {\n  name = \"api\"\n  port = 8080\n}\noutput \"endpoint\" {\n  value = \"${local.name}:${local.port}\"\n}\n```\n\n**Predict:** What will the run show, and what will its exit code be?\n\n> [!question]- Answer\n> Actual excerpt from the last command:\n>\n> ```text\n> Apply complete! Resources: 0 added, 0 changed, 0 destroyed.\n> Outputs:\n> + endpoint = \"api:8080\"\n>\n> You can apply this plan to save these new output values to the OpenTofu\n> state, without changing any real infrastructure.\n>\n> Apply complete! Resources: 0 added, 0 changed, 0 destroyed.\n>\n> Outputs:\n>\n> endpoint = \"api:8080\"\n> ```\n>\n> Exit code: 0.\n\nThe output line inserts the name and number into a string, producing `api:8080`.\n\nHCL is a declarative configuration language. In `resource \"terraform_data\" \"service\"`, the first word is the block type, `terraform_data` the resource type, and `service` the author-chosen name. `variable \"environment\"` and `output \"service_names\"` each have one label. `type = string` is an argument: name on the left, value on the right. `validation` is a nested block with its own `condition` and `error_message` arguments. A comment starts with `#`.\n\nAn expression computes a value from literals, functions and references. `var.environment` is an input variable, `local.active_services` a computed local value, and `terraform_data.service` an instance collection. A `for_each` block exposes `each.key` and `each.value`. A `for` iterator name exists only inside that expression. `${...}` interpolates a value into a string. `{...}` in an argument is an object or map, not a new HCL block.\n\n> [!info]- Deeper explanation\n> Primitive types are `string`, `number`, `bool`; collection types are `list(T)`, `set(T)`, `map(T)`; structural types are `object({...})`, `tuple([...])`. `null` means an absent value. `(known after apply)` means unknown so far, not `null` or an error. Sensitivity is a separate value characteristic; ephemeral values have additional restrictions (§10).\n\n### From inputs to output\n\n**At a glance**\n- variable accepts an input.\n- local computes an intermediate value.\n- output returns a result to the caller.\n\n**Mini-example:** save this as `main.tf` in a new temporary directory. After preparing the files, run `tofu init`, `tofu validate`, then `tofu apply -auto-approve -input=false -no-color`.\n\n```hcl\nvariable \"name\" { default = \"api\" }\nlocals {\n  label = \"${var.name}-dev\"\n}\nresource \"terraform_data\" \"service\" {\n  input = local.label\n}\noutput \"label\" { value = terraform_data.service.output }\n```\n\n**Predict:** What will the run show, and what will its exit code be?\n\n> [!question]- Answer\n> Actual excerpt from the last command:\n>\n> ```text\n>   # terraform_data.service will be created\n> Plan: 1 to add, 0 to change, 0 to destroy.\n> Apply complete! Resources: 1 added, 0 changed, 0 destroyed.\n> Outputs:\n> + label = (known after apply)\n> terraform_data.service: Creating...\n> terraform_data.service: Creation complete after 0s [id=8eecb7b7-b9e6-12ab-363d-50fec8fd8166]\n>\n> Apply complete! Resources: 1 added, 0 changed, 0 destroyed.\n>\n> Outputs:\n>\n> label = \"api-dev\"\n> ```\n>\n> Exit code: 0.\n\nThe input `api` becomes `api-dev`; the resource stores it and the output publishes it.\n\n**`main.tf` in a new empty directory:**\n\n```hcl\nterraform {\n  required_version = \">= 1.4.0\"\n}\n\nvariable \"environment\" {\n  type    = string\n  default = \"dev\"\n\n  validation {\n    condition     = contains([\"dev\", \"test\", \"prod\"], var.environment)\n    error_message = \"environment must be dev, test, or prod.\"\n  }\n}\n\nvariable \"services\" {\n  type = map(object({\n    port    = number\n    enabled = bool\n  }))\n  default = {\n    api  = { port = 8080, enabled = true }\n    docs = { port = 8081, enabled = false }\n  }\n}\n\nlocals {\n  active_services = {\n    for name, service in var.services : name => service\n    if service.enabled\n  }\n\n  service_names = {\n    for name, service in local.active_services : name => \"${var.environment}-${name}\"\n  }\n}\n\nresource \"terraform_data\" \"service\" {\n  for_each = local.active_services\n\n  input = {\n    name = local.service_names[each.key]\n    port = each.value.port\n  }\n}\n\nresource \"terraform_data\" \"summary\" {\n  input = [for service in terraform_data.service : service.output.name]\n}\n\noutput \"service_names\" {\n  value = terraform_data.summary.output\n}\n```\n\nBuilt-in `terraform_data` is available since Terraform 1.4 without an external plugin or cloud account. `required_version` constrains the CLI version, not the provider. Complete configuration:\n\nThe `var.services` default contains `api` and `docs`. Local `active_services` keeps only entries with `enabled = true`, so `terraform_data.service[\"api\"]` is created and `docs` is absent. For this instance, `each.key = \"api\"` and `each.value.port = 8080`. The reference in resource `summary` connects it to `service` resources; `service.output.name` becomes known after apply. The root output reads the resulting list.\n\n`for` constructs a new value; `condition ? yes : no` chooses a branch. A splat such as `var.items[*].id` collects an attribute from list, set or tuple elements. Maps and `for_each` resources usually use `[for item in ... : item.id]`. Functions `lower`, `upper`, `length`, `contains`, `merge`, `try`, `jsonencode` transform values; `terraform console` is useful for checking them.\n\n`locals` name computed values; they are not mutable variables during apply. Values are recomputed for a new plan. An ordinary root `output` is stored in state, while a child output defines its contract with the parent. Terraform 1.10+ and OpenTofu 1.11+ allow `ephemeral = true` for child-module outputs, usable only in permitted ephemeral contexts. Root outputs cannot be ephemeral. `sensitive = true` masks output but does not remove the value from state.\n\n### number accepts fractions: validate integrality separately\n\n**At a glance**\n- The number type allows fractional values.\n- A range check does not require an integer.\n- floor can be used to check separately whether a value is an integer.\n\n**Mini-example:** Save as `main.tf` in a new temporary directory. After preparing the files, run `tofu init`, `tofu validate`, then `tofu plan -input=false -no-color -var=port=2048.5`.\n\n```hcl\nvariable \"port\" {\n  default = 2048\n  validation {\n    condition = floor(var.port) == var.port\n    error_message = \"port must be an integer.\"\n  }\n}\noutput \"port\" { value = var.port }\n```\n\n**Predict:** What will the run show, and what will its exit code be?\n\n> [!question]- Answer\n> Actual excerpt from the last command:\n>\n> ```text\n> Error: Invalid value for variable\n> ```\n>\n> Exit code: 1.\n\nThe fractional value passes the number type check, but fails the equality `floor(2048.5) == 2048.5`. The plan stops.\n\n```hcl\nvariable \"listen_port\" {\n  type    = number\n  default = 2048\n  validation {\n    condition     = floor(var.listen_port) == var.listen_port && var.listen_port >= 1024 && var.listen_port <= 65535\n    error_message = \"listen_port must be an integer in 1024..65535.\"\n  }\n}\noutput \"listen_port\" { value = var.listen_port }\n```\n\n`number` accepts both 2048 and 2048.5. A range check alone does not reject fractions.\nA standalone variable in an empty `main.tf`:\n\n`tofu plan -var=listen_port=2048.5` fails validation; 2048 produces a successful plan.\n*(verified: init -backend=false, validate and plan; no apply)*.\n`floor(x)==x` checks integrality; the two comparisons check the permitted range.\nNeither type checking nor attractive formatting replaces those two conditions.\n\n### Input validation and a complete cycle\n\n**At a glance**\n- validation checks an input value.\n- A known-invalid input stops the plan.\n- A successful validate does not mean every future input is allowed.\n\n**Mini-example:** Save as `main.tf` in a new temporary directory. After preparing the files, run `tofu init`, `tofu validate`, then `tofu plan -input=false -no-color -var=replicas=0`.\n\n```hcl\nvariable \"replicas\" {\n  default = 2\n  validation {\n    condition = var.replicas >= 1\n    error_message = \"replicas must be positive.\"\n  }\n}\noutput \"replicas\" { value = var.replicas }\n```\n\n**Predict:** What will the run show, and what will its exit code be?\n\n> [!question]- Answer\n> Actual excerpt from the last command:\n>\n> ```text\n> Error: Invalid value for variable\n> ```\n>\n> Exit code: 1.\n\nThe file is syntactically valid. The rejection occurs during planning with the supplied zero.\n\n> [!info]- Deeper explanation\n> `validation` checks an input-variable rule. `environment=production` in the shown configuration caused rejection:\n>\n> ```text\n> Error: Invalid value for variable\n> environment must be dev, test, or prod.\n> ```\n>\n> Validation rejects a known invalid input; if its expression depends on an unknown value, checking may happen later. *(verified: OpenTofu 1.12.6, rejection without infrastructure changes)*.\n>\n> Successful local cycle:\n>\n> ```text\n> $ tofu init -backend=false\n> OpenTofu has been successfully initialized!\n> $ tofu validate\n> Success! The configuration is valid.\n> $ tofu plan -out=local.tfplan\n> Plan: 2 to add, 0 to change, 0 to destroy.\n> $ tofu apply local.tfplan\n> Apply complete! Resources: 2 added, 0 changed, 0 destroyed.\n> Outputs:\n> service_names = [\n>   \"dev-api\",\n> ]\n> ```\n>\n> The same file also passed with Terraform 1.15.9:\n>\n> ```text\n> Success! The configuration is valid.\n> Plan: 2 to add, 0 to change, 0 to destroy.\n> Apply complete! Resources: 2 added, 0 changed, 0 destroyed.\n> ```\n>\n> *(verified: both initial-draft cycles, built-in resource)*.\n>\n> Value precedence from low to high: `default` → `TF_VAR_name` → `terraform.tfvars` → `terraform.tfvars.json` → `*.auto.tfvars` and `*.auto.tfvars.json` in lexical order → `-var` and `-var-file` in command-line argument order. CI should pass values explicitly and disable interactive prompts. An ordinary sensitive variable may also appear in a plan and state.\n> *(according to documentation)*. [Variables and precedence](https://developer.hashicorp.com/terraform/language/values/variables) · [Expressions](https://developer.hashicorp.com/terraform/language/expressions).\n\n### Repeated nested blocks\n\n**At a glance**\n- dynamic repeats a nested block.\n- The provider defines which blocks are allowed.\n- An arbitrary name cannot be turned into a supported argument.\n\n**Short scenario**\n\nThe resource schema allows an ingress block. The input contains two ports, 80 and 443. dynamic creates an ingress block for each port.\n\n**Predict:** How many blocks will there be, and can this create lifecycle this way?\n\n> [!question]- Answer\n> Two ingress blocks. lifecycle is a special block handled by the engine; dynamic cannot be used to add arbitrary blocks like this. This is a text-only model; no AWS API is called.\n\n**`main.tf`: a reading example that cannot run without an AWS account:**\n\n```hcl\nterraform {\n  required_providers {\n    aws = {\n      source  = \"hashicorp/aws\"\n      version = \">= 5.0\"\n    }\n  }\n}\n\nprovider \"aws\" {\n  region = \"eu-central-1\"\n}\n\nvariable \"ports\" {\n  type    = map(number)\n  default = { https = 443, app = 8443 }\n}\n\nresource \"aws_security_group\" \"web\" {\n  name = \"web-example\"\n\n  dynamic \"ingress\" {\n    for_each = var.ports\n    iterator = rule\n\n    content {\n      from_port   = rule.value\n      to_port     = rule.value\n      protocol    = \"tcp\"\n      cidr_blocks = [\"203.0.113.0/24\"]\n    }\n  }\n}\n```\n\n`dynamic` creates nested blocks permitted by the provider schema. It does not create independent resources or generate `lifecycle`. In this example `rule` is the iterator name, `rule.value` the current port, and `content` the arguments of one nested `ingress` block. Validation requires the AWS provider; planning also needs credentials and a suitable network. This cloud example was not run.\n\n*(according to documentation)*. [Dynamic blocks](https://developer.hashicorp.com/terraform/language/expressions/dynamic-blocks).\n\n> [!info]- Deeper explanation\n> > [!warning] Do not silently broaden an input contract\n> > For a complex object, specify the exact `object({...})` and constraints. Type `any` is useful when truly arbitrary types are needed; otherwise it shifts errors from module author to consumer.\n>\n> ```mermaid\n> flowchart TB\n>     V[\"variable: type, default value,<br/>input validation\"] --> L[\"locals: computed values\"]\n>     L --> R[\"resource: provider arguments\"]\n>     R --> O[\"output: result for the root<br/>or parent module\"]\n> ```\n\n### Input precedence in a small example\n\n**At a glance**\n- Input values can come from several sources.\n- A variable file overrides the default.\n- In the shown run, -var overrides both the file and the environment.\n\n**`main.tf` in a new empty directory; adjacent `terraform.tfvars` contains `name = \"tfvars\"`:**\n\n```hcl\nvariable \"name\" { default = \"default\" }\nresource \"terraform_data\" \"this\" { input = var.name }\noutput \"name\" { value = var.name }\n```\n\nFile `terraform.tfvars` contains `name = \"tfvars\"`. Run: `TF_VAR_name=environment tofu plan -var=name=cli`.\n\n**Predict:** a default, `TF_VAR_name`, `terraform.tfvars` and `-var` are all set. Which name does the resource receive?\n> [!question]- Answer\n> ```text\n>       + input  = \"cli\"\n> Plan: 1 to add, 0 to change, 0 to destroy.\n>   + name = \"cli\"\n> ```\n> The CLI argument has the highest precedence among these four sources.\n\n*(verified: OpenTofu 1.12.6)*.\n\n**Briefly in English:** How do values move through HCL?\n\nVariables receive input values. Locals calculate other values from them. Resources use these values, and outputs return results to the caller."
