heading: '2. HCL с нуля: блоки, ссылки и значения'
text: "## 2. HCL с нуля: блоки, ссылки и значения\n\n**Коротко**\n- HCL описывает значения именованными блоками.\n- locals дают вычислению имя.\n- Выражение вычисляет значение, а не последовательность команд.\n\n**Мини-пример:** сохрани как `main.tf` в новом временном каталоге. После подготовки файлов выполни `tofu init`, `tofu validate`, затем `tofu apply -auto-approve -input=false -no-color`.\n\n```hcl\nlocals {\n  name = \"api\"\n  port = 8080\n}\noutput \"endpoint\" {\n  value = \"${local.name}:${local.port}\"\n}\n```\n\n**Предскажи:** что покажет запуск и каким будет код завершения?\n\n> [!question]- Ответ\n> Фактическая выдержка последней команды:\n>\n> ```text\n> Apply complete! Resources: 0 added, 0 changed, 0 destroyed.\n> Outputs:\n> + endpoint = \"api:8080\"\n>\n> You can apply this plan to save these new output values to the OpenTofu\n> state, without changing any real infrastructure.\n>\n> Apply complete! Resources: 0 added, 0 changed, 0 destroyed.\n>\n> Outputs:\n>\n> endpoint = \"api:8080\"\n> ```\n>\n> Код завершения: 0.\n\nВ строке выхода имя и число вставляются в строку: получается `api:8080`.\n\nHCL — декларативный язык конфигурации. В `resource \"terraform_data\" \"service\"` первое слово — тип блока, `terraform_data` — тип ресурса, `service` — имя, выбранное автором. У `variable \"environment\"` и `output \"service_names\"` по одной метке. Строка `type = string` — аргумент: слева имя, справа значение. `validation` — вложенный блок со своими аргументами `condition` и `error_message`. Комментарий начинается с `#`.\n\nВыражение вычисляет значение из литералов, функций и ссылок. `var.environment` — входная переменная, `local.active_services` — локальное вычисленное значение, `terraform_data.service` — коллекция экземпляров. В блоке с `for_each` доступны `each.key` и `each.value`. В выражении `for` имя итератора действует только внутри этого выражения. `${...}` подставляет значение в строку. `{...}` в аргументе — объект или словарь, а не новый блок HCL.\n\n> [!info]- Глубже\n> Простые типы: `string`, `number`, `bool`; коллекции: `list(T)`, `set(T)`, `map(T)`; структурные типы: `object({...})`, `tuple([...])`. `null` означает отсутствие значения. `(known after apply)` означает ещё неизвестное значение, а не `null` или ошибку. Отдельная характеристика значения — чувствительность; временные значения имеют дополнительные ограничения (§10).\n\n### От входов к выходу\n\n**Коротко**\n- variable принимает вход.\n- local вычисляет промежуточное значение.\n- output возвращает результат вызывающему.\n\n**Мини-пример:** сохрани как `main.tf` в новом временном каталоге. После подготовки файлов выполни `tofu init`, `tofu validate`, затем `tofu apply -auto-approve -input=false -no-color`.\n\n```hcl\nvariable \"name\" { default = \"api\" }\nlocals {\n  label = \"${var.name}-dev\"\n}\nresource \"terraform_data\" \"service\" {\n  input = local.label\n}\noutput \"label\" { value = terraform_data.service.output }\n```\n\n**Предскажи:** что покажет запуск и каким будет код завершения?\n\n> [!question]- Ответ\n> Фактическая выдержка последней команды:\n>\n> ```text\n>   # terraform_data.service will be created\n> Plan: 1 to add, 0 to change, 0 to destroy.\n> Apply complete! Resources: 1 added, 0 changed, 0 destroyed.\n> Outputs:\n> + label = (known after apply)\n> terraform_data.service: Creating...\n> terraform_data.service: Creation complete after 0s [id=8eecb7b7-b9e6-12ab-363d-50fec8fd8166]\n>\n> Apply complete! Resources: 1 added, 0 changed, 0 destroyed.\n>\n> Outputs:\n>\n> label = \"api-dev\"\n> ```\n>\n> Код завершения: 0.\n\nВход `api` превращается в `api-dev`; ресурс сохраняет его, выход публикует.\n\n**`main.tf` в новом пустом каталоге:**\n\n```hcl\nterraform {\n  required_version = \">= 1.4.0\"\n}\n\nvariable \"environment\" {\n  type    = string\n  default = \"dev\"\n\n  validation {\n    condition     = contains([\"dev\", \"test\", \"prod\"], var.environment)\n    error_message = \"environment must be dev, test, or prod.\"\n  }\n}\n\nvariable \"services\" {\n  type = map(object({\n    port    = number\n    enabled = bool\n  }))\n  default = {\n    api  = { port = 8080, enabled = true }\n    docs = { port = 8081, enabled = false }\n  }\n}\n\nlocals {\n  active_services = {\n    for name, service in var.services : name => service\n    if service.enabled\n  }\n\n  service_names = {\n    for name, service in local.active_services : name => \"${var.environment}-${name}\"\n  }\n}\n\nresource \"terraform_data\" \"service\" {\n  for_each = local.active_services\n\n  input = {\n    name = local.service_names[each.key]\n    port = each.value.port\n  }\n}\n\nresource \"terraform_data\" \"summary\" {\n  input = [for service in terraform_data.service : service.output.name]\n}\n\noutput \"service_names\" {\n  value = terraform_data.summary.output\n}\n```\n\nВстроенный ресурс `terraform_data` доступен с Terraform 1.4 без внешнего плагина и облачной учётной записи. `required_version` ограничивает версию CLI, а не провайдера. Полная конфигурация:\n\nЗначение по умолчанию `var.services` содержит `api` и `docs`. Локальное значение `active_services` оставляет только элементы с `enabled = true`, поэтому создаётся `terraform_data.service[\"api\"]`, а `docs` отсутствует. У текущего экземпляра `each.key = \"api\"`, `each.value.port = 8080`. Ссылка в ресурсе `summary` соединяет его с ресурсами `service`; `service.output.name` станет известен после применения. Корневой выход читает итоговый список.\n\n`for` создаёт новое значение; `condition ? yes : no` выбирает одну ветвь. Выражение со звёздочкой, например `var.items[*].id`, собирает атрибут из элементов списка, множества или кортежа. Для словаря и ресурса с `for_each` обычно используют `[for item in ... : item.id]`. Функции `lower`, `upper`, `length`, `contains`, `merge`, `try`, `jsonencode` преобразуют значения; их удобно проверять в `terraform console`.\n\n`locals` дают вычисленным значениям имена; это не изменяемые переменные во время применения. При новом плане значения пересчитываются. Обычный `output` корня сохраняется в state, а выход дочернего модуля образует контракт с родителем. Terraform 1.10+ и OpenTofu 1.11+ позволяют `ephemeral = true` для выхода дочернего модуля и только для разрешённых мест использования временных значений. Корневой выход временным быть не может. `sensitive = true` маскирует вывод, но не удаляет значение из state.\n\n### number допускает дробь: целочисленность проверяется отдельно\n\n**Коротко**\n- Тип number допускает дробь.\n- Проверка диапазона не требует целого числа.\n- floor позволяет отдельно проверить целочисленность.\n\n**Мини-пример:** сохрани как `main.tf` в новом временном каталоге. После подготовки файлов выполни `tofu init`, `tofu validate`, затем `tofu plan -input=false -no-color -var=port=2048.5`.\n\n```hcl\nvariable \"port\" {\n  default = 2048\n  validation {\n    condition = floor(var.port) == var.port\n    error_message = \"port must be an integer.\"\n  }\n}\noutput \"port\" { value = var.port }\n```\n\n**Предскажи:** что покажет запуск и каким будет код завершения?\n\n> [!question]- Ответ\n> Фактическая выдержка последней команды:\n>\n> ```text\n> Error: Invalid value for variable\n> ```\n>\n> Код завершения: 1.\n\nДробь проходит числовой тип, но не равенство `floor(2048.5) == 2048.5`. План останавливается.\n\n```hcl\nvariable \"listen_port\" {\n  type    = number\n  default = 2048\n  validation {\n    condition     = floor(var.listen_port) == var.listen_port && var.listen_port >= 1024 && var.listen_port <= 65535\n    error_message = \"listen_port must be an integer in 1024..65535.\"\n  }\n}\noutput \"listen_port\" { value = var.listen_port }\n```\n\n`number` принимает 2048 и 2048.5. Диапазон сам по себе дробное значение не отвергает.\nСамостоятельная переменная в пустом `main.tf`:\n\n`tofu plan -var=listen_port=2048.5` даёт ошибку validation; с 2048 — успешный план.\n*(проверено: init -backend=false, validate и plan; без apply)*.\n`floor(x)==x` проверяет целочисленность, два сравнения — допустимый диапазон.\nНи проверка типа, ни красивое форматирование не заменяют этих двух условий.\n\n### Проверка входа и полный цикл\n\n**Коротко**\n- validation проверяет входное значение.\n- Известный неверный вход останавливает план.\n- Успешный validate ещё не означает допустимость всех будущих входов.\n\n**Мини-пример:** сохрани как `main.tf` в новом временном каталоге. После подготовки файлов выполни `tofu init`, `tofu validate`, затем `tofu plan -input=false -no-color -var=replicas=0`.\n\n```hcl\nvariable \"replicas\" {\n  default = 2\n  validation {\n    condition = var.replicas >= 1\n    error_message = \"replicas must be positive.\"\n  }\n}\noutput \"replicas\" { value = var.replicas }\n```\n\n**Предскажи:** что покажет запуск и каким будет код завершения?\n\n> [!question]- Ответ\n> Фактическая выдержка последней команды:\n>\n> ```text\n> Error: Invalid value for variable\n> ```\n>\n> Код завершения: 1.\n\nФайл синтаксически корректен. Отказ возникает при плане с переданным нулём.\n\n> [!info]- Глубже\n> `validation` проверяет правило входной переменной. Значение `environment=production` в приведённой конфигурации вызвало отказ:\n>\n> ```text\n> Error: Invalid value for variable\n> environment must be dev, test, or prod.\n> ```\n>\n> Проверка останавливает известный недопустимый вход; если выражение зависит от неизвестного значения, проверка может выполниться позднее. *(проверено: OpenTofu 1.12.6, отказ без изменения инфраструктуры)*.\n>\n> Успешный локальный цикл:\n>\n> ```text\n> $ tofu init -backend=false\n> OpenTofu has been successfully initialized!\n> $ tofu validate\n> Success! The configuration is valid.\n> $ tofu plan -out=local.tfplan\n> Plan: 2 to add, 0 to change, 0 to destroy.\n> $ tofu apply local.tfplan\n> Apply complete! Resources: 2 added, 0 changed, 0 destroyed.\n> Outputs:\n> service_names = [\n>   \"dev-api\",\n> ]\n> ```\n>\n> Тот же файл прошёл под Terraform 1.15.9:\n>\n> ```text\n> Success! The configuration is valid.\n> Plan: 2 to add, 0 to change, 0 to destroy.\n> Apply complete! Resources: 2 added, 0 changed, 0 destroyed.\n> ```\n>\n> *(проверено: оба цикла первого черновика, встроенный ресурс)*.\n>\n> Приоритет значений от меньшего к большему: `default` → `TF_VAR_name` → `terraform.tfvars` → `terraform.tfvars.json` → `*.auto.tfvars` и `*.auto.tfvars.json` в лексикографическом порядке → `-var` и `-var-file` в порядке аргументов командной строки. В CI лучше передавать значения явно и отключать интерактивные запросы. Обычная чувствительная переменная тоже может попасть в план и state.\n> *(по документации)*. [Переменные и приоритет](https://developer.hashicorp.com/terraform/language/values/variables) · [Выражения](https://developer.hashicorp.com/terraform/language/expressions).\n\n### Повторяющиеся вложенные блоки\n\n**Коротко**\n- dynamic повторяет вложенный блок.\n- Допустимые блоки определяет провайдер.\n- Произвольное имя нельзя превратить в поддерживаемый аргумент.\n\n**Короткий сценарий**\n\nСхема ресурса разрешает блок ingress. Вход содержит два порта: 80 и 443. dynamic создаёт ingress для каждого порта.\n\n**Предскажи:** Сколько блоков получится и можно ли так создать lifecycle?\n\n> [!question]- Ответ\n> Два ingress. lifecycle — служебный блок движка; dynamic для такого произвольного расширения не подходит. Это текстовая модель, AWS API не вызывается.\n\n**`main.tf` — пример для чтения: без учётной записи AWS не запустится:**\n\n```hcl\nterraform {\n  required_providers {\n    aws = {\n      source  = \"hashicorp/aws\"\n      version = \">= 5.0\"\n    }\n  }\n}\n\nprovider \"aws\" {\n  region = \"eu-central-1\"\n}\n\nvariable \"ports\" {\n  type    = map(number)\n  default = { https = 443, app = 8443 }\n}\n\nresource \"aws_security_group\" \"web\" {\n  name = \"web-example\"\n\n  dynamic \"ingress\" {\n    for_each = var.ports\n    iterator = rule\n\n    content {\n      from_port   = rule.value\n      to_port     = rule.value\n      protocol    = \"tcp\"\n      cidr_blocks = [\"203.0.113.0/24\"]\n    }\n  }\n}\n```\n\n`dynamic` создаёт вложенные блоки, разрешённые схемой провайдера. Он не создаёт самостоятельные ресурсы и не генерирует `lifecycle`. В примере `rule` — имя итератора, `rule.value` — текущий порт, `content` — аргументы одного вложенного блока `ingress`. Для проверки нужен AWS-провайдер; план дополнительно требует учётных данных и подходящей сети. Этот облачный пример не запускался.\n\n*(по документации)*. [Динамические блоки](https://developer.hashicorp.com/terraform/language/expressions/dynamic-blocks).\n\n> [!info]- Глубже\n> > [!warning] Не расширяй скрытно контракт входных значений\n> > Для сложного объекта укажи точный `object({...})` и ограничения. Тип `any` полезен, когда действительно нужен произвольный тип; иначе он переносит ошибки от автора модуля к потребителю.\n>\n> ```mermaid\n> flowchart TB\n>     V[\"variable: тип, значение по умолчанию,<br/>проверка входа\"] --> L[\"locals: вычисленные значения\"]\n>     L --> R[\"resource: аргументы провайдеру\"]\n>     R --> O[\"output: результат для корня<br/>или родителя модуля\"]\n> ```\n\n### Приоритет входа на небольшом примере\n\n**Коротко**\n- Значения входа приходят из нескольких источников.\n- Файл переменных перекрывает default.\n- В показанном запуске -var перекрывает файл и окружение.\n\n**`main.tf` в новом пустом каталоге; рядом `terraform.tfvars` со строкой `name = \"tfvars\"`:**\n\n```hcl\nvariable \"name\" { default = \"default\" }\nresource \"terraform_data\" \"this\" { input = var.name }\noutput \"name\" { value = var.name }\n```\n\nФайл `terraform.tfvars` содержит `name = \"tfvars\"`. Запуск: `TF_VAR_name=environment tofu plan -var=name=cli`.\n\n**Предскажи:** Одновременно заданы значение по умолчанию, `TF_VAR_name`, `terraform.tfvars` и `-var`. Какое имя получит ресурс?\n> [!question]- Ответ\n> ```text\n>       + input  = \"cli\"\n> Plan: 1 to add, 0 to change, 0 to destroy.\n>   + name = \"cli\"\n> ```\n> Аргумент командной строки имеет самый высокий приоритет среди этих четырёх источников.\n\n*(проверено: OpenTofu 1.12.6)*.\n\n**Коротко по-английски:** How do values move through HCL?\n\nVariables receive input values. Locals calculate other values from them. Resources use these values, and outputs return results to the caller.\n"
