heading: 8. Установка, обновление и откат [release lifecycle]
text: '## 8. Установка, обновление и откат [release lifecycle]


  **Коротко**

  - Install создаёт релиз.

  - Upgrade добавляет новую ревизию.

  - Rollback использует историю, но не отменяет любые внешние эффекты.


  **Короткий сценарий**


  Миграция изменила базу, затем Helm вернул прежний Deployment.


  **Предскажи:** Обязательно ли база вернулась к старой схеме?


  > [!question]- Ответ

  > Нет. История Kubernetes-манифестов не является обратной миграцией базы.


  Это вывод из заданных условий. Полный прежний разбор и его границы проверки сохранены ниже.


  > [!info]- Глубже

  > Этот раздел о работе с API — *(по документации)* [install](https://helm.sh/docs/helm/helm_install/), [upgrade](https://helm.sh/docs/helm/helm_upgrade/), [rollback](https://helm.sh/docs/helm/helm_rollback/), [uninstall](https://helm.sh/docs/helm/helm_uninstall/). Результаты рецензента ниже проверяют основные переходы; команды повторения используют только временный кластер из §19.

  >

  > | Команда | Что делает клиент и что сохраняется |

  > |---|---|

  > | `install` | Создаёт первый экземпляр ресурсов и ревизию 1 |

  > | `upgrade` | Вычисляет новый манифест, обновляет ресурсы, добавляет ревизию |

  > | `upgrade --install` | Выбирает установку, если релиз отсутствует, иначе обновление; это не постоянный контроллер |

  > | `status` | Читает статус записи релиза; не заменяет проверку подов |

  > | `history` | Показывает сохранённые ревизии, их статусы, версии и описания |

  > | `rollback demo 1` | Применяет сохранённый чарт/значения ревизии 1, создаёт **новую** ревизию |

  > | `uninstall` | Удаляет управляемые ресурсы и обычно историю |

  > | `uninstall --keep-history` | Удаляет ресурсы, сохраняет историю с состоянием удаления |

  >

  > История ограничивается `--history-max` при обновлении; наличие очень старой ревизии нельзя предполагать. При rollback номер истории не «возвращается назад»: если были 1 и 2, успешный откат к содержимому 1 создаёт 3. Не откатываются данные внешней БД и результат необратимой миграции только потому, что вернулись старые манифесты.

  >

  > ```mermaid

  > flowchart TB

  >     A["install: ревизия 1"] --> B["upgrade: ревизия 2"]

  >     B --> C["rollback к содержимому 1: новая ревизия 3"]

  >     C --> D["uninstall: ресурсы удалены"]

  >     D --> E["--keep-history: история сохранена"]

  > ```


  ### Ожидание, отказ и принудительное обновление


  **Коротко**

  - Wait ожидает определённые условия.

  - Таймаут ограничивает ожидание.

  - Принудительное обновление имеет отдельные последствия.


  **Короткий сценарий**


  Pod запущен, но readiness не проходит до timeout.


  **Предскажи:** Достаточно ли Running для успешного ожидания готовности?


  > [!question]- Ответ

  > Нет. Нужны условия, которые проверяет выбранная стратегия ожидания.


  Это вывод из заданных условий. Полный прежний разбор и его границы проверки сохранены ниже.


  > [!info]- Глубже

  > Локально прочитаны `helm install --help` и `helm upgrade --help` *(проверено как контракт CLI)*:

  >

  > ```text

  > --rollback-on-failure

  > # из upgrade --help

  > The --wait flag will be defaulted to "watcher" if --rollback-on-failure is set

  > --wait WaitStrategy[=watcher]

  > # фрагмент описания

  > Default when flag is omitted: ''hookOnly''.

  > --timeout duration

  > # стандартное значение

  > (default 5m0s)

  > --force-replace

  > # описание

  > force resource updates by replacement

  > ```

  >

  > Это означает: без флага Helm 4 ждёт хуки, а не готовность всех обычных подов. `--wait` без значения включает `watcher`; можно выбрать `legacy`. `--wait-for-jobs` расширяет ожидание обычных Job; hook Job и так требует успешного завершения. `--timeout` задаёт ожидание операций, не является универсальным лимитом всех внешних действий приложения. *(по документации)* [upgrade](https://helm.sh/docs/helm/helm_upgrade/).

  >

  > В Helm 3 `--atomic` включает ожидание и откат при отказе; при неудачной установке — удаление. В Helm 4 основное имя — `--rollback-on-failure`, а `--atomic` сохранён как устаревающий псевдоним, о чём есть проверенный прогон в [[Kubernetes-for-DevOps-Theory#7. Helm 4: что изменилось и где ломается|§7]]. У неудачного **upgrade** цель — прежняя успешная ревизия; у неудачного **install** — убрать неудачную установку. `--wait` сам по себе **не обещает откат**.

  >

  > `--force` в Helm 3 / `--force-replace` в Helm 4 — замена ресурсов вместо обычного обновления. Это не способ «разрешить неизменяемое поле без последствий»: замена может прервать обслуживание. `--force-conflicts` относится к конфликтам владения полями при серверном применении (§10), это другая операция.


  ### Наблюдавшиеся install → upgrade → rollback


  **Коротко**

  - История показывает последовательность ревизий.

  - Откат создаёт собственное событие истории.

  - Записанный опыт относится к своему стенду.


  **Короткий сценарий**


  В старом логе install, upgrade и rollback успешны.


  **Предскажи:** Доказывает ли это успешный новый upgrade с другими values?


  > [!question]- Ответ

  > Нет. Изменённые входы требуют собственной проверки.


  Это вывод из заданных условий. Полный прежний разбор и его границы проверки сохранены ниже.


  > [!info]- Глубже

  > ```bash

  > helm install demo "$CHART" -n helm-lab -f "$LAB/values-lab.yaml" \

  >   --rollback-on-failure --timeout 3m

  > helm status demo -n helm-lab

  > helm upgrade demo "$CHART" -n helm-lab -f "$LAB/values-lab.yaml" \

  >   --set replicaCount=3 --rollback-on-failure

  > helm history demo -n helm-lab

  > helm rollback demo 1 -n helm-lab --wait

  > helm history demo -n helm-lab

  > ```

  >

  > *(проверено: прогон рецензента 06.10.2026, Helm 4.3.0, kind, Kubernetes 1.34.0)*

  >

  > ```text

  > STATUS: deployed

  > REVISION: 1

  > DESCRIPTION: Install complete

  > # два Pod demo-democicd-…: каждый 1/1 Running

  > # upgrade

  > Release "demo" has been upgraded.

  > REVISION: 2

  > # history: выбранные колонки, выравнивание нормализовано

  > 1  superseded  Install complete

  > 2  deployed    Upgrade complete

  > # rollback

  > Rollback was a success!

  > 1  superseded  Install complete

  > 2  superseded  Upgrade complete

  > 3  deployed    Rollback to 1

  > ```

  >

  > Deployment вернулся к 2 репликам. Rollback **добавил ревизию 3**, скопировав содержимое 1; прежние ревизии не удалены. Это наблюдаемая история, а не прогноз по документации.

  >

  > `helm get values demo -n helm-lab` показал только пользовательские значения; `--all` дал 30 строк со значениями по умолчанию чарта:

  >

  > *(проверено: прогон рецензента 06.10.2026, Helm 4.3.0, kind, Kubernetes 1.34.0)*

  >

  > ```text

  > image:

  >   repository: nginxinc/nginx-unprivileged

  >   tag: stable

  > imagePullSecrets: []

  > replicaCount: 2

  > ```


  ### Отказ образа и автоматический откат


  **Коротко**

  - Ошибка образа проявляется после отправки манифестов.

  - Автооткат зависит от режима команды.

  - Успешный рендер не проверяет доступность image.


  **Короткий сценарий**


  Шаблон сформировал синтаксически допустимую ссылку, но registry не отдаёт образ.


  **Предскажи:** Может ли Pod остаться неготовым при успешном template?


  > [!question]- Ответ

  > Да. Загрузка образа не проверялась локальным рендером.


  Это вывод из заданных условий. Полный прежний разбор и его границы проверки сохранены ниже.


  > [!info]- Глубже

  > ```bash

  > helm upgrade demo "$CHART" -n helm-lab -f "$LAB/values-lab.yaml" \

  >   --set image.tag=helm-study-missing-tag --rollback-on-failure --timeout 45s

  > ```

  >

  > Команда заняла 46 с. Предупреждение опущено; настоящий отказ и выбранные колонки истории:

  >

  > *(проверено: прогон рецензента 06.10.2026, Helm 4.3.0, kind, Kubernetes 1.34.0)*

  >

  > ```text

  > Error: UPGRADE FAILED: release demo failed, and has been rolled back due to rollback-on-failure being set: resource Deployment/helm-lab/demo-democicd not ready. status: InProgress, message: Updated: 1/2

  > context deadline exceeded

  > # history: описание failed сокращено

  > 4  failed    Upgrade "demo" failed: resource Deployment/helm-lab/demo-democicd not ready…

  > 5  deployed  Rollback to 3

  > ```

  >

  > Неудачный upgrade с `--rollback-on-failure` здесь стоил **две ревизии**: 4 — отказ, 5 — автоматический rollback. Новый Pod был `Terminating`; два старых оставались `Running` всё время: rolling update их не удалил. Это результат данного Deployment, не гарантия доступности любого приложения при откате.


  ### Что остаётся после неудачи


  **Коротко**

  - Неудача может оставить ресурсы и историю.

  - Состояние выясняют до очистки.

  - Удаление записей не исправляет причину.


  **Короткий сценарий**


  Upgrade failed, старые Pod ещё работают, новая Job осталась.


  **Предскажи:** Можно ли по одному слову failed считать всё удалённым?


  > [!question]- Ответ

  > Нет. Нужно проверить ресурсы, hooks и историю конкретной операции.


  Это вывод из заданных условий. Полный прежний разбор и его границы проверки сохранены ниже.


  > [!info]- Глубже

  > Helm сохраняет промежуточное состояние `pending-install`, `pending-upgrade` или `pending-rollback`. Если клиент успел обработать отказ — обычно появляется `failed`; при аварийном прерывании может остаться `pending-*`. Ресурсы могли обновиться частично: Kubernetes API не делает весь релиз одной транзакцией. Без автоматического отката старые и новые объекты могут сосуществовать. *(по документации/реализации)* [upgrade](https://github.com/helm/helm/blob/main/pkg/action/upgrade.go).

  >

  > > [!failure] Типичная ошибка

  > > `--wait` принимают за откат, а `deployed` — за здоровье приложения.

  > > ```bash

  > > # НЕПРАВИЛЬНО для требования автоматического отката

  > > helm upgrade demo "$CHART" --wait

  > > # ПРАВИЛЬНО для этого требования в Helm 4

  > > helm upgrade demo "$CHART" --rollback-on-failure --timeout 2m

  > > ```

  > > Отказ ожидания без автоматического отката оставляет неудачную ревизию. Откат тоже способен отказать; его результат надо читать в history и проверять в Kubernetes.

  >

  > **Предскажи:** после upgrade до ревизии 2 выполнен rollback к 1. Станет ли последней ревизия 1?

  >

  > > [!question]- Ответ

  > > Нет. В прогоне рецензента `helm rollback demo 1 --wait` дал:

  > > *(проверено: прогон рецензента 06.10.2026, Helm 4.3.0, kind, Kubernetes 1.34.0)*

  > > ```text

  > > Rollback was a success!

  > > # history: выбранные колонки

  > > 1 superseded

  > > 2 superseded

  > > 3 deployed  Rollback to 1

  > > ```

  > > Deployment снова имел 2 реплики. Внешние данные не проверялись; rollback манифестов не обещает обратной миграции БД *(по документации)*.

  >

  > **Коротко по-английски — What does rollback do?**

  >

  > > Helm applies a previous release configuration and creates a new revision. It does not move the revision number backwards. It can restore Kubernetes resources, but it cannot automatically undo external data changes. I check both release history and workload health.


  ### Откат приложения при уже изменённой БД


  **Коротко**

  - Приложение и база имеют отдельные изменения.

  - Старый код может не понимать новую схему.

  - Совместимость нужна до автоматического отката.


  **Короткий сценарий**


  Новая миграция удалила колонку, старая версия приложения продолжает её читать.


  **Предскажи:** Исправит ли rollback Deployment проблему?


  > [!question]- Ответ

  > Нет. Старый код несовместим с оставшейся схемой; нужен заранее продуманный порядок миграции.


  Это вывод из заданных условий. Полный прежний разбор и его границы проверки сохранены ниже.


  > [!info]- Глубже

  > **Модель, не миграция живой БД.** Revision Helm хранит состояние релиза; обратный SQL и восстановление внешних данных из этого не следуют. Ресурсы hook также требуют своей политики очистки. [Helm rollback](https://helm.sh/docs/helm/helm_rollback/), [hooks](https://helm.sh/docs/topics/charts_hooks/).

  >

  > **Шаг 1 — Expand и новая версия приложения**

  >

  > ```mermaid

  > flowchart TB

  >     A["App v1 + DB S1"]

  >     E["Expand: DB S2, старое поле сохранено"]

  >     B["App v2 + DB S2"]

  >     A --> E

  >     E --> B

  > ```

  >

  > **Шаг 2 — Откат приложения на DB S2**

  >

  > ```mermaid

  > flowchart TB

  >     B["App v2 + DB S2"]

  >     R["App v1 + DB S2"]

  >     C{"v1 совместим с S2?"}

  >     OK["Сервис работает; DB остаётся S2"]

  >     FAIL["Откат релиза не восстановил сервис"]

  >     B -->|"helm rollback: манифесты v1"| R

  >     R --> C

  >     C -->|"да"| OK

  >     C -->|"нет"| FAIL

  > ```

  >

  > Пример договора совместимости: S1 имеет `users.name`; S2 **добавляет nullable** `display_name`, сохраняет `name`. Сначала expand, затем v2 пишет оба поля и читает новое с fallback на старое. Backfill заполняет новое поле; при rollback v1 продолжает читать/писать старое. Возвращение к v2 требует повторить синхронизацию значений, изменённых v1. Удалять `name` допустимо только после закрытия окна возврата и перехода всех читателей; эта contract-миграция делает v1 несовместимым. Это проектный пример, не автоматическая гарантия Helm. Проверка перед rollout: тест v1 и v2 на S2, повторный запуск миграции и восстановление резервной копии на отдельной БД.'
