heading: '9. Errors: what continues and what rollback does not do'
text: "## 9. Errors: what continues and what rollback does not do\n\n**At a glance**\n- block groups related tasks.\n- rescue executes specified actions after a normal failure in the block.\n- Recovery does not automatically roll back changes.\n\n**Mini-example:** save `mini.yml` in a separate temporary directory; run `ansible-playbook -i localhost, -c local mini.yml`. The example runs on localhost without become.\n\n```yaml\n- hosts: localhost\n  connection: local\n  become: false\n  gather_facts: false\n  tasks:\n    - block:\n        - ansible.builtin.fail:\n            msg: stop\n      rescue:\n        - ansible.builtin.debug:\n            msg: recovered\n      always:\n        - ansible.builtin.debug:\n            msg: cleanup\n```\n\n**Predict:** Will the final exit code be nonzero after a successful rescue? Will always run?\n\n> [!question]- Answer\n> Run 1; exit code 0. Stdout excerpts:\n>\n> ```text\n>     \"msg\": \"recovered\"\n>     \"msg\": \"cleanup\"\n> localhost                  : ok=2    changed=0    unreachable=0    failed=0    skipped=0    rescued=1    ignored=0\n> ```\n>\n> Run 2; exit code 0. Stdout excerpts:\n>\n> ```text\n>     \"msg\": \"recovered\"\n>     \"msg\": \"cleanup\"\n> localhost                  : ok=2    changed=0    unreachable=0    failed=0    skipped=0    rescued=1    ignored=0\n> ```\n\n`rescue` handles the deliberate failure, then `always` runs. The final summary accounts for recovery; this example changes no files.\n\nComplete `recovery.yml`: the failure is intentional, but no OS changes are made:\n\n```yaml\n- name: Explain recovery flow\n  hosts: lab\n  connection: local\n  gather_facts: false\n  become: false\n  tasks:\n    - name: Protected operation\n      block:\n        - name: Fail deliberately\n          ansible.builtin.command:\n            argv: [/usr/bin/false]\n          changed_when: false\n      rescue:\n        - name: Show failure context\n          ansible.builtin.debug:\n            msg: \"{{ ansible_failed_task.name }}: {{ ansible_failed_result.rc }}\"\n      always:\n        - name: Show cleanup path\n          ansible.builtin.debug:\n            msg: always\n    - name: Continue after recovery\n      ansible.builtin.debug:\n        msg: next task\n```\n\n*(verified)* A combined lab with a loop, retries and `rescue` returned:\n\n```text\n[ERROR]: Task failed: Module failed: The command exited with a non-zero return code.\nTASK [Recovered]\nok: [localhost] => {\"msg\": \"rescued\"}\nTASK [Cleanup signal]\nok: [localhost] => {\"msg\": \"always\"}\nlocalhost : ok=4 changed=0 unreachable=0 failed=0 skipped=0 rescued=1 ignored=0\n```\n\nAn ordinary failure removes the host from subsequent ordinary tasks in the current play; other hosts may continue.\nAnsible does not provide a transaction: changes made before failure remain.\n**`block`** groups tasks and shared settings. **`rescue`** runs after a task in the block fails.\n**`always`** follows `block`/`rescue` when the engine can continue execution.\nAn unreachable host or task-definition error is not an ordinary `failed` result for `rescue`.\n\n`ansible_failed_task` and `ansible_failed_result` provide `rescue` context.\nSuccessful `rescue` counts as recovery: the play may continue, with `failed` equal to 0 in the recap\nand `rescued` equal to 1. If recovery must not hide a failed deployment, end `rescue` with\n`ansible.builtin.fail` after the required actions. This is a separate failure, not automatic `rescue` behavior.\n\n> [!info]- Deeper explanation\n> ```mermaid\n> flowchart TB\n>     B[\"Block tasks\"] --> R{\"Did the task fail?\"}\n>     R -->|\"no\"| A[\"Final tasks\"]\n>     R -->|\"yes\"| S[\"Rescue: explicit compensating actions\"]\n>     S --> A\n>     A --> N[\"Next task if the error was handled\"]\n> ```\n>\n> Rollback consists of **compensating actions you write**: restore a backup, revert a version,\n> check health. Those actions can fail too. A `rescue` block does not guarantee database recovery,\n> atomic file updates or returning a node to the load balancer.\n>\n> | Setting | What it changes | What it does not do |\n> |---|---|---|\n> | `failed_when` | The result's failure criterion | Does not undo an action already performed. |\n> | `ignore_errors: true` | Continues after an ordinary failed result | Does not fix `unreachable`, syntax errors or undefined-value errors. |\n> | `ignore_unreachable: true` | Separately permits continuing after `unreachable` | Does not create a working connection. |\n> | `any_errors_fatal: true` | An unhandled failure stops the play for everyone after the batch's current task | Does not roll back successful hosts. |\n> | `max_fail_percentage` | Stops after the failed share of a batch exceeds a threshold | Neither health checking nor rollback; intended for strategies such as `linear`. |\n>\n> `max_fail_percentage: 50` with a batch of 4: two failures are exactly 50%, so the threshold is **not exceeded**;\n> three failures are 75%, so execution stops. To stop at two out of four, use a threshold below 50, such as 49.\n> A failure successfully handled by `rescue` does not trigger this threshold or `any_errors_fatal` as an unhandled error.\n> *(according to documentation)* [Error handling](https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_error_handling.html).\n>\n> Question: **Does `rescue` automatically roll back a deployment?**\n>\n> > No. `rescue` runs tasks that I define after a normal task failure. I must explicitly restore the\n> > previous state and check it. If `rescue` succeeds, Ansible treats the failure as recovered and can\n> > continue, so I may need an explicit fail task to stop the rollout.\n"
