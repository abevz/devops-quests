heading: '9. Ошибки: что продолжится и чего откат не делает'
text: "## 9. Ошибки: что продолжится и чего откат не делает\n\n**Коротко**\n- block объединяет связанные задачи.\n- rescue выполняет заданные действия после обычного отказа в блоке.\n- Восстановление не откатывает изменения автоматически.\n\n**Мини-пример:** в отдельном временном каталоге сохрани `mini.yml`; запуск — `ansible-playbook -i localhost, -c local mini.yml`. Пример работает на localhost без become.\n\n```yaml\n- hosts: localhost\n  connection: local\n  become: false\n  gather_facts: false\n  tasks:\n    - block:\n        - ansible.builtin.fail:\n            msg: stop\n      rescue:\n        - ansible.builtin.debug:\n            msg: recovered\n      always:\n        - ansible.builtin.debug:\n            msg: cleanup\n```\n\n**Предскажи:** Будет ли итоговый код ненулевым после успешного rescue? Выполнится ли always?\n\n> [!question]- Ответ\n> Код завершения: 0. Фрагменты stdout:\n>\n> ```text\n>     \"msg\": \"recovered\"\n>     \"msg\": \"cleanup\"\n> localhost                  : ok=2    changed=0    unreachable=0    failed=0    skipped=0    rescued=1    ignored=0\n> ```\n\nПреднамеренный отказ обработан `rescue`, затем выполняется `always`. В итоговой сводке учитывается восстановление; никаких файлов этот пример не меняет.\n\nПолный `recovery.yml` — ошибка намеренная, но изменения ОС не выполняются:\n\n```yaml\n- name: Explain recovery flow\n  hosts: lab\n  connection: local\n  gather_facts: false\n  become: false\n  tasks:\n    - name: Protected operation\n      block:\n        - name: Fail deliberately\n          ansible.builtin.command:\n            argv: [/usr/bin/false]\n          changed_when: false\n      rescue:\n        - name: Show failure context\n          ansible.builtin.debug:\n            msg: \"{{ ansible_failed_task.name }}: {{ ansible_failed_result.rc }}\"\n      always:\n        - name: Show cleanup path\n          ansible.builtin.debug:\n            msg: always\n    - name: Continue after recovery\n      ansible.builtin.debug:\n        msg: next task\n```\n\n*(проверено)* Комбинированный стенд с циклом, повтором и `rescue` вернул:\n\n```text\n[ERROR]: Task failed: Module failed: The command exited with a non-zero return code.\nTASK [Recovered]\nok: [localhost] => {\"msg\": \"rescued\"}\nTASK [Cleanup signal]\nok: [localhost] => {\"msg\": \"always\"}\nlocalhost : ok=4 changed=0 unreachable=0 failed=0 skipped=0 rescued=1 ignored=0\n```\n\nОбычный сбой исключает хост из дальнейших обычных задач текущего сценария; другие хосты могут продолжить.\nAnsible не обеспечивает транзакцию: изменения до сбоя остаются.\n**`block`** группирует задачи и общие настройки. **`rescue`** запускается после задачи с ошибкой в блоке.\n**`always`** выполняется после `block`/`rescue`, когда движок может продолжить это выполнение.\nНедоступный хост или ошибка определения задачи не становятся обычным `failed` для `rescue`.\n\n`ansible_failed_task` и `ansible_failed_result` — контекст `rescue`.\nСработавший `rescue` считается восстановлением: сценарий может продолжиться, а `failed` в итоговой сводке будет 0,\n`rescued` — 1. Если восстановление не должно скрывать неуспешное развёртывание, завершите `rescue` модулем\n`ansible.builtin.fail` после необходимых действий. Это отдельный сбой, не автоматическое поведение `rescue`.\n\n> [!info]- Глубже\n> ```mermaid\n> flowchart TB\n>     B[\"Задачи блока\"] --> R{\"Задача завершилась ошибкой?\"}\n>     R -->|\"нет\"| A[\"Завершающие задачи\"]\n>     R -->|\"да\"| S[\"Восстановление: явные компенсирующие действия\"]\n>     S --> A\n>     A --> N[\"Следующая задача, если ошибка обработана\"]\n> ```\n>\n> Откат — **написанные вами компенсирующие действия**: восстановить резервную копию, вернуть версию,\n> проверить здоровье. Он может тоже упасть. Наличие `rescue` не обеспечивает восстановление базы,\n> атомарность файлов или возврат узла в балансировщик нагрузки.\n>\n> | Настройка | Что меняет | Чего не делает |\n> |---|---|---|\n> | `failed_when` | Критерий ошибки результата | Не отменяет уже выполненное действие. |\n> | `ignore_errors: true` | Продолжить после обычного результата с ошибкой | Не исправляет `unreachable`, синтаксические ошибки и ошибки неопределённых значений. |\n> | `ignore_unreachable: true` | Отдельно позволяет продолжение для `unreachable` | Не создаёт рабочее подключение. |\n> | `any_errors_fatal: true` | Необработанная ошибка останавливает сценарий для всех после текущей задачи партии | Не откатывает успешные хосты. |\n> | `max_fail_percentage` | Остановка при превышении доли `failed` в партии | Не проверка работоспособности и не откат; предназначен для стратегий типа `linear`. |\n>\n> `max_fail_percentage: 50`, партия 4: 2 сбоя = ровно 50%, предел **не превышен**;\n> 3 сбоя = 75%, остановка. Для остановки при 2 из 4 нужен порог ниже 50, например 49.\n> Успешно обработанный через `rescue` сбой не запускает этот порог и `any_errors_fatal` как необработанная ошибка.\n> *(по документации)* [Обработка ошибок](https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_error_handling.html).\n>\n> Вопрос: **Does `rescue` automatically roll back a deployment?**\n>\n> > No. `rescue` runs tasks that I define after a normal task failure. I must explicitly restore the\n> > previous state and check it. If `rescue` succeeds, Ansible treats the failure as recovered and can\n> > continue, so I may need an explicit fail task to stop the rollout."
