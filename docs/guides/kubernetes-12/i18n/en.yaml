heading: '12. Configuration: the object changed, but the process may see an old value'
text: "## 12. Configuration: the object changed, but the process may see an old value\n\n**At a glance**\n- A ConfigMap stores named values\n- Object changes are visible through the API\n- An already running process may still read an old value.\n\n**Mini-example:** only in the disposable kind cluster prepared above. Create the namespace with `kubectl --kubeconfig /tmp/guides-order-rest.kubeconfig --context kind-guides-order-rest create namespace guide-mini-37`. Save the listing as `mini.sh`; run it with `bash -e mini.sh`.\n\n```bash\nk() { kubectl --kubeconfig /tmp/guides-order-rest.kubeconfig --context kind-guides-order-rest -n guide-mini-37 \"$@\"; }\nk create configmap settings --from-literal=color=blue\nk get configmap settings -o jsonpath='{.data.color}{\"\\n\"}'\nk create configmap settings --from-literal=color=green --dry-run=client -o yaml | k apply -f -\nk get configmap settings -o jsonpath='{.data.color}{\"\\n\"}'\n```\n\n**Predict:** What will the last command show after the preceding commands finish?\n\n> [!question]- Answer\n> Actual command stdout:\n>\n> ```text\n> configmap/settings created\n> blue\n> configmap/settings configured\n> green\n> ```\n>\n> Exit code: 0.\n\nThe API first returns blue, then green. This short experiment tests the object, not a process environment update; the full experiment below compares injection methods.\n\n**`config.yaml` in `/tmp/vg-k8s-work`: the complete initial ConfigMap and consumer:**\n\n```yaml\napiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: settings\n  namespace: vg-k8s\ndata:\n  mode: blue\n---\napiVersion: v1\nkind: Pod\nmetadata:\n  name: config-reader\n  namespace: vg-k8s\nspec:\n  containers:\n    - name: app\n      image: busybox:1.37\n      command: [\"sleep\", \"3600\"]\n      env:\n        - name: MODE\n          valueFrom:\n            configMapKeyRef:\n              name: settings\n              key: mode\n      volumeMounts:\n        - name: config\n          mountPath: /config\n        - name: config\n          mountPath: /single\n          subPath: mode\n  volumes:\n    - name: config\n      configMap:\n        name: settings\n```\n\n**`settings-green.yaml` in `/tmp/vg-k8s-work`: the complete new ConfigMap file:**\n\n```yaml\napiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: settings\n  namespace: vg-k8s\ndata:\n  mode: green\n```\n\nConfigMap stores non-secret keys; Secret stores data with separate access rules.\nBase64 in a Secret is encoding, not encryption. Protection and external sources are explained in\n[[Security-Visual-Guide#15. Сеть и секреты: сократить боковое движение и чтение данных|network and secrets: reducing lateral movement and data access]].\nHere the important mechanism is delivery into a running container.\n*(according to documentation)* — [ConfigMap](https://kubernetes.io/docs/concepts/configuration/configmap/),\n[Secret](https://kubernetes.io/docs/concepts/configuration/secret/).\n\n> [!info]- Deeper explanation\n> 1. Environment variables are read at container creation and do not update themselves in the process.\n> 2. With an ordinary volume, kubelet updates the projection after a delay; the application must reread the file.\n> 3. A single file mounted with `subPath` does not receive subsequent projection updates.\n> 4. Changing a ConfigMap does not itself modify the Deployment template or start a new rollout.\n>\n> Delay depends on kubelet synchronization and change detection.\n> Do not promise a universal “30 seconds” for every cluster.\n> *(according to documentation)* — [ConfigMap](https://kubernetes.io/docs/concepts/configuration/configmap/).\n>\n> `valueFrom` selects a value from another object; `key` identifies an entry in its `data`.\n> `mountPath` is the container path; `subPath` pins one volume file at another location here.\n>\n> **Command from any directory: update the ConfigMap and compare the three delivery paths:**\n>\n> ```bash\n> kubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s \\\n>   apply -f /tmp/vg-k8s-work/settings-green.yaml\n> kubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s \\\n>   -n vg-k8s exec config-reader -- sh -c \\\n>   'printf \"env=%s\\n\" \"$MODE\"; printf \"directory=\"; cat /config/mode; printf \"\\nsubPath=\"; cat /single; echo'\n> ```\n>\n> **Output from a fresh run: an example to read:**\n>\n> ```text\n> env=blue\n> directory=green\n> subPath=blue\n> ```\n>\n> All three paths were checked; the first read shortly after the change still showed `blue` in the directory too.\n> Reading again after waiting showed the updated ordinary projection. *(verified)*.\n\n### Projected volume: multiple sources in one directory\n\n**At a glance**\n- A projected volume combines several sources\n- Updating a file and rereading it in the application are separate actions\n- An environment variable is set when the container starts.\n\n**Short scenario**\n\nA Secret changed. The application received its password through env at startup and has not restarted.\n\n**Predict:** Will its environment automatically contain the new string?\n\n> [!question]- Answer\n> Analysis of the given conditions: No. The container must start again, or use another supported way to update data.\n\n**`projected.yaml` in `/tmp/vg-k8s-work`: a complete Pod; ConfigMap `settings` is required:**\n\n```yaml\napiVersion: v1\nkind: Pod\nmetadata:\n  name: projected\n  namespace: vg-k8s\nspec:\n  automountServiceAccountToken: false\n  containers:\n    - name: app\n      image: busybox:1.37\n      command: [\"sleep\", \"3600\"]\n      volumeMounts:\n        - name: input\n          mountPath: /input\n          readOnly: true\n  volumes:\n    - name: input\n      projected:\n        sources:\n          - configMap:\n              name: settings\n          - downwardAPI:\n              items:\n                - path: pod-name\n                  fieldRef:\n                    fieldPath: metadata.name\n          - serviceAccountToken:\n              path: token\n              audience: example-consumer\n              expirationSeconds: 3600\n```\n\nA projected volume combines ConfigMap, Secret, Downward API and a ServiceAccount token into one projection.\nDownward API passes information about the container's own Pod, such as its name.\nA token has an audience and expiration; kubelet refreshes it, and the application must read the current file.\n*(according to documentation)* — [projected volumes](https://kubernetes.io/docs/concepts/storage/projected-volumes/).\n\n> [!info]- Deeper explanation\n> `automountServiceAccountToken: false` disables the **automatic** volume, not an explicitly declared token projection.\n> Audience `example-consumer` does not promise that the Kubernetes API will accept this token.\n> A missing ConfigMap/Secret causes preparation failure: an environment variable may produce\n> `CreateContainerConfigError`, while a volume may produce `FailedMount`. A new failure and token rotation are *(not verified)*.\n>\n> Restarting after ConfigMap changes through a template checksum is explained without duplicating the chart in\n> [[Helm-Visual-Guide#20. Как это спрашивают|20. Interview questions]]. Principle: a **Pod template** annotation changes, then §6 applies.\n>\n> **Predict:** a Secret is updated, but the application reads it only from an environment variable.\n>\n> > [!question]- Answer\n> > A running process does not automatically receive the new environment variable.\n> > It needs a new container or another delivery and reload mechanism.\n> > *(according to documentation)* — the Secret source above; the new experiment used ConfigMap.\n>\n> **Short answer in English:**\n>\n> > Environment values are set when the container starts. Normal projected files can update later.\n> > A subPath mount does not receive those updates. Updating a ConfigMap alone does not restart a Deployment.\n\n### Gateway API: where to study HTTPRoute\n\nHeader matching, relative backendRefs weights and checking `status.parents`\nare explained with an independent 3:1 example in [[Networking-Visual-Guide#HTTPRoute: выбор правила, относительные веса и привязка|Networking Guide: HTTPRoute]].\nFirst check Accepted/ResolvedRefs for the intended parent and generation, then actual HTTP delivery.\n"
