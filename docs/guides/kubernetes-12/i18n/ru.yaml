heading: '12. Конфигурация: объект обновился, но процесс может видеть старое значение'
text: "## 12. Конфигурация: объект обновился, но процесс может видеть старое значение\n\n**Коротко**\n- ConfigMap хранит именованные значения.\n- Изменение объекта видно через API.\n- Уже запущенный процесс может читать старое значение.\n\n**Мини-пример:** только в одноразовом kind из подготовки выше. Создай namespace командой `kubectl --kubeconfig /tmp/guides-order-rest.kubeconfig --context kind-guides-order-rest create namespace guide-mini-37`. Сохрани листинг как `mini.sh`; запуск — `bash -e mini.sh`.\n\n```bash\nk() { kubectl --kubeconfig /tmp/guides-order-rest.kubeconfig --context kind-guides-order-rest -n guide-mini-37 \"$@\"; }\nk create configmap settings --from-literal=color=blue\nk get configmap settings -o jsonpath='{.data.color}{\"\\n\"}'\nk create configmap settings --from-literal=color=green --dry-run=client -o yaml | k apply -f -\nk get configmap settings -o jsonpath='{.data.color}{\"\\n\"}'\n```\n\n**Предскажи:** Что покажет последняя команда после выполнения предыдущих?\n\n> [!question]- Ответ\n> Фактический stdout команд:\n>\n> ```text\n> configmap/settings created\n> blue\n> configmap/settings configured\n> green\n> ```\n>\n> Код завершения: 0.\n\nAPI сначала возвращает blue, затем green. Этот короткий опыт проверяет объект, а не обновление окружения процесса; полный опыт ниже сравнивает способы подключения.\n\n**`config.yaml` в `/tmp/vg-k8s-work` — полный начальный ConfigMap и потребитель:**\n\n```yaml\napiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: settings\n  namespace: vg-k8s\ndata:\n  mode: blue\n---\napiVersion: v1\nkind: Pod\nmetadata:\n  name: config-reader\n  namespace: vg-k8s\nspec:\n  containers:\n    - name: app\n      image: busybox:1.37\n      command: [\"sleep\", \"3600\"]\n      env:\n        - name: MODE\n          valueFrom:\n            configMapKeyRef:\n              name: settings\n              key: mode\n      volumeMounts:\n        - name: config\n          mountPath: /config\n        - name: config\n          mountPath: /single\n          subPath: mode\n  volumes:\n    - name: config\n      configMap:\n        name: settings\n```\n\n**`settings-green.yaml` в `/tmp/vg-k8s-work` — полный новый файл самого ConfigMap:**\n\n```yaml\napiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: settings\n  namespace: vg-k8s\ndata:\n  mode: green\n```\n\nConfigMap хранит несекретные ключи, Secret — данные с отдельными правилами доступа.\nBase64 в Secret является кодированием, не шифрованием. Подробная защита и внешние источники —\n[[Security-Visual-Guide#15. Сеть и секреты: сократить боковое движение и чтение данных]].\nЗдесь важен путь доставки значения в работающий контейнер.\n*(по документации)* — [ConfigMap](https://kubernetes.io/docs/concepts/configuration/configmap/),\n[Secret](https://kubernetes.io/docs/concepts/configuration/secret/).\n\n> [!info]- Глубже\n> 1. Через переменную окружения значение читается при создании контейнера и само в процессе не обновляется.\n> 2. Через обычный том kubelet обновляет проекцию с задержкой; приложение должно перечитать файл.\n> 3. Подключение одного файла через `subPath` не получает последующие обновления этой проекции.\n> 4. Изменение ConfigMap само по себе не меняет шаблон Deployment и не запускает новое развёртывание.\n>\n> Задержка зависит от синхронизации kubelet и способа обнаружения изменений.\n> Не обещать конкретные «30 секунд» для всех кластеров.\n> *(по документации)* — [ConfigMap](https://kubernetes.io/docs/concepts/configuration/configmap/).\n>\n> `valueFrom` выбирает значение другого объекта; `key` — ключ внутри его `data`.\n> `mountPath` — путь в контейнере; `subPath` здесь закрепляет один файл тома в другом пути.\n>\n> **Команда в любом каталоге — обновить ConfigMap и сравнить три места доставки:**\n>\n> ```bash\n> kubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s \\\n>   apply -f /tmp/vg-k8s-work/settings-green.yaml\n> kubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context kind-vg-k8s \\\n>   -n vg-k8s exec config-reader -- sh -c \\\n>   'printf \"env=%s\\n\" \"$MODE\"; printf \"directory=\"; cat /config/mode; printf \"\\nsubPath=\"; cat /single; echo'\n> ```\n>\n> **Вывод нового запуска после ожидания обновления — пример для чтения:**\n>\n> ```text\n> env=blue\n> directory=green\n> subPath=blue\n> ```\n>\n> Все три пути проверены; первое чтение вскоре после изменения ещё показывало `blue` и в каталоге.\n> Повторное чтение после ожидания показало обновлённую обычную проекцию. *(проверено)*.\n\n### Проецируемый том: несколько источников в одном каталоге\n\n**Коротко**\n- Projected volume объединяет несколько источников.\n- Обновление файла и перечитывание приложением — разные действия.\n- Переменная окружения задаётся при запуске контейнера.\n\n**Короткий сценарий**\n\nSecret изменён. Приложение получило пароль через env при старте и не перезапускалось.\n\n**Предскажи:** Появится ли новая строка в его окружении автоматически?\n\n> [!question]- Ответ\n> Разбор заданных условий: Нет. Нужен новый запуск контейнера либо иной поддерживаемый способ обновления данных.\n\n**`projected.yaml` в `/tmp/vg-k8s-work` — полный Pod, нужен ConfigMap `settings`:**\n\n```yaml\napiVersion: v1\nkind: Pod\nmetadata:\n  name: projected\n  namespace: vg-k8s\nspec:\n  automountServiceAccountToken: false\n  containers:\n    - name: app\n      image: busybox:1.37\n      command: [\"sleep\", \"3600\"]\n      volumeMounts:\n        - name: input\n          mountPath: /input\n          readOnly: true\n  volumes:\n    - name: input\n      projected:\n        sources:\n          - configMap:\n              name: settings\n          - downwardAPI:\n              items:\n                - path: pod-name\n                  fieldRef:\n                    fieldPath: metadata.name\n          - serviceAccountToken:\n              path: token\n              audience: example-consumer\n              expirationSeconds: 3600\n```\n\nProjected volume объединяет ConfigMap, Secret, Downward API и токен ServiceAccount в одну проекцию.\nDownward API — способ передать контейнеру сведения о собственном Pod, например его имя.\nТокен имеет аудиторию и срок; kubelet обновляет его, приложение должно читать актуальный файл.\n*(по документации)* — [projected volumes](https://kubernetes.io/docs/concepts/storage/projected-volumes/).\n\n> [!info]- Глубже\n> `automountServiceAccountToken: false` отключает **автоматический** том, но не явно описанную проекцию токена.\n> Аудитория `example-consumer` не обещает, что Kubernetes API примет этот токен.\n> Отсутствующий ConfigMap/Secret даёт отказ подготовки; для переменной окружения возможен\n> `CreateContainerConfigError`, для тома — `FailedMount`. Новый отказ и ротация токена — *(не проверено)*.\n>\n> Перезапуск при изменении ConfigMap через checksum в шаблоне раскрыт без повторения чарта в\n> [[Helm-Visual-Guide#20. Как это спрашивают]]. Принцип: меняется аннотация **Pod template**, затем работает §6.\n>\n> **Предскажи:** обновлён Secret, приложение читает его только из переменной окружения.\n>\n> > [!question]- Ответ\n> > Уже запущенный процесс не получает новую переменную автоматически.\n> > Требуется новый контейнер либо другой способ доставки и перечитывания.\n> > *(по документации)* — источник Secret выше; новый опыт проводился с ConfigMap.\n>\n> **Короткий ответ на английском:**\n>\n> > Environment values are set when the container starts. Normal projected files can update later.\n> > A subPath mount does not receive those updates. Updating a ConfigMap alone does not restart a Deployment.\n\n### Gateway API: где разобрать HTTPRoute\n\nВыбор правила по заголовку, относительные веса backendRefs и проверка `status.parents`\nразобраны на независимом примере 3:1 в [[Networking-Visual-Guide#HTTPRoute: выбор правила, относительные веса и привязка|Networking Guide: HTTPRoute]].\nСначала проверяют Accepted/ResolvedRefs для нужного родителя и поколения, затем доставку HTTP."
