heading: '12. Configuration: Das Objekt wurde geändert, aber der Prozess sieht möglicherweise einen alten
  Wert'
text: "## 12. Konfiguration: Das Objekt hat sich geändert, aber der Prozess sieht möglicherweise einen\
  \ alten Wert\n\n**Auf einen Blick**\n- A ConfigMap speichert benannte Werte\n- Objektänderungen sind\
  \ durch API sichtbar\n- AEin bereits laufender Prozess liest möglicherweise noch einen alten Wert.\n\
  \n**Minibeispiel:** nur im oben vorbereiteten Einweg-Cluster kind. Erstellen Sie namespace mit `kubectl\
  \ --kubeconfig /tmp/guides-order-rest.kubeconfig --context kind-guides-order-rest create namespace guide-mini-37`.\
  \ Speichern Sie den Eintrag als `mini.sh`; Führen Sie es mit `bash -e mini.sh` aus.\n\n```bash\nk()\
  \ { kubectl --kubeconfig /tmp/guides-order-rest.kubeconfig --context kind-guides-order-rest -n guide-mini-37\
  \ \"$@\"; }\nk create configmap settings --from-literal=color=blue\nk get configmap settings -o jsonpath='{.data.color}{\"\
  \\n\"}'\nk create configmap settings --from-literal=color=green --dry-run=client -o yaml | k apply -f\
  \ -\nk get configmap settings -o jsonpath='{.data.color}{\"\\n\"}'\n```\n\n**Vorhersage:** Was wird\
  \ der letzte command anzeigen, nachdem die vorherigen Befehle abgeschlossen sind?\n\n> [!question]-\
  \ Antwort\n> Actual command stdout:\n>\n> ```text\n> configmap/settings created\n> blue\n> configmap/settings\
  \ configured\n> green\n> ```\n>\n> Exit-Code: 0.\n\nDer API gibt zuerst blue und dann green zurück.\
  \ Dieses kurze Experiment testet das Objekt, keine Aktualisierung der Prozessumgebung. Das vollständige\
  \ Experiment unten vergleicht Injektionsmethoden.\n\n**`config.yaml` in `/tmp/vg-k8s-work`: der komplette\
  \ ursprüngliche ConfigMap und Verbraucher:**\n\n```yaml\napiVersion: v1\nkind: ConfigMap\nmetadata:\n\
  \  name: settings\n  namespace: vg-k8s\ndata:\n  mode: blue\n---\napiVersion: v1\nkind: Pod\nmetadata:\n\
  \  name: config-reader\n  namespace: vg-k8s\nspec:\n  containers:\n    - name: app\n      image: busybox:1.37\n\
  \      command: [\"sleep\", \"3600\"]\n      env:\n        - name: MODE\n          valueFrom:\n    \
  \        configMapKeyRef:\n              name: settings\n              key: mode\n      volumeMounts:\n\
  \        - name: config\n          mountPath: /config\n        - name: config\n          mountPath:\
  \ /single\n          subPath: mode\n  volumes:\n    - name: config\n      configMap:\n        name:\
  \ settings\n```\n\n**`settings-green.yaml` in `/tmp/vg-k8s-work`: die komplett neue ConfigMap-Datei:**\n\
  \n```yaml\napiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: settings\n  namespace: vg-k8s\ndata:\n\
  \  mode: green\n```\n\nConfigMap speichert nicht geheime Schlüssel; Secret speichert data mit separaten\
  \ Zugriffsregeln.\nBase64 in einem Secret ist eine Kodierung, keine Verschlüsselung. Schutz und externe\
  \ sources werden in erklärt\n[[Security-Visual-Guide#15. Сеть и секреты: сократить боковое движение\
  \ и чтение данных|network and secrets: reducing lateral movement and data access]].\nHier ist der wichtige\
  \ Mechanismus die Lieferung in einen laufenden Container.\n*(laut Dokumentation)* — [ConfigMap](https://kubernetes.io/docs/concepts/configuration/configmap/),\n\
  [Secret](https://kubernetes.io/docs/concepts/configuration/secret/).\n\n> [!info]- Ausführlichere Erklärung\n\
  > 1. EUmgebungsvariablen werden bei der Containererstellung gelesen und aktualisieren sich dabei nicht\
  \ selbst.\n> 2. Bei einem gewöhnlichen volume aktualisiert kubelet die Projektion nach einer Verzögerung;\
  \ Die Anwendung muss die Datei erneut lesen.\nDie mit `subPath` gemountete > 3. A single-Datei erhält\
  \ keine nachfolgenden Projektionsaktualisierungen.\n> 4. Durch das Ändern eines ConfigMap wird der Deployment\
  \ template nicht selbst geändert oder ein neuer Rollout gestartet.\n>\n> Delay hängt von der kubelet-Synchronisation\
  \ und Änderungserkennung ab.\n> Versprechen Sie keine universellen „30 Sekunden“ für jeden Cluster.\n\
  > *(laut Dokumentation)* — [ConfigMap](https://kubernetes.io/docs/concepts/configuration/configmap/).\n\
  >\n> `valueFrom` wählt einen Wert aus einem anderen Objekt aus; `key` identifiziert einen Eintrag in\
  \ seinem `data`.\n> `mountPath` ist der Containerpfad; `subPath` pinnt hier eine volume-Datei an einem\
  \ anderen Ort.\n>\n> **Befehl aus einem beliebigen Verzeichnis: Aktualisieren Sie ConfigMap und vergleichen\
  \ Sie die drei Übermittlungspfade:**\n>\n> ```bash\n> kubectl --kubeconfig /tmp/vg-k8s-kubeconfig --context\
  \ kind-vg-k8s \\\n>   apply -f /tmp/vg-k8s-work/settings-green.yaml\n> kubectl --kubeconfig /tmp/vg-k8s-kubeconfig\
  \ --context kind-vg-k8s \\\n>   -n vg-k8s exec config-reader -- sh -c \\\n>   'printf \"env=%s\\n\"\
  \ \"$MODE\"; printf \"directory=\"; cat /config/mode; printf \"\\nsubPath=\"; cat /single; echo'\n>\
  \ ```\n>\n> **Ausgabe eines neuen Laufs: ein Beispiel zum Lesen:**\n>\n> ```text\n> env=blue\n> directory=green\n\
  > subPath=blue\n> ```\n>\n> Alle drei Pfade wurden überprüft; Beim ersten Lesen kurz nach der Änderung\
  \ wurde auch noch `blue` im Verzeichnis angezeigt.\n> Beim erneuten Lesen nach dem Warten wurde die\
  \ aktualisierte normale Projektion angezeigt. *(verifiziert)*.\n\n### Projected volume: mehrere sources\
  \ in einem Verzeichnis\n\n**Auf einen Blick**\n- A projected volume vereint mehrere sources\n- Das Aktualisieren\
  \ einer Datei und das erneute Lesen in der Anwendung sind separate Aktionen\n- An Umgebungsvariable\
  \ wird festgelegt, wenn der Container gestartet wird.\n\n**Kurzes Szenario**\n\nA Secret geändert. Die\
  \ Anwendung hat ihr Passwort beim Start über env erhalten und wurde nicht neu gestartet.\n\n**Vorhersage:**\
  \ Wird seine Umgebung automatisch die neue Zeichenfolge enthalten?\n\n> [!question]- Antwort\n> Analysis\
  \ der gegebenen Bedingungen: Nein. Der Container muss neu starten oder eine andere unterstützte Methode\
  \ zur Aktualisierung verwenden data.\n\n**`projected.yaml` in `/tmp/vg-k8s-work`: ein kompletter Pod;\
  \ ConfigMap `settings` ist erforderlich:**\n\n```yaml\napiVersion: v1\nkind: Pod\nmetadata:\n  name:\
  \ projected\n  namespace: vg-k8s\nspec:\n  automountServiceAccountToken: false\n  containers:\n    -\
  \ name: app\n      image: busybox:1.37\n      command: [\"sleep\", \"3600\"]\n      volumeMounts:\n\
  \        - name: input\n          mountPath: /input\n          readOnly: true\n  volumes:\n    - name:\
  \ input\n      projected:\n        sources:\n          - configMap:\n              name: settings\n\
  \          - downwardAPI:\n              items:\n                - path: pod-name\n                \
  \  fieldRef:\n                    fieldPath: metadata.name\n          - serviceAccountToken:\n     \
  \         path: token\n              audience: example-consumer\n              expirationSeconds: 3600\n\
  ```\n\nEin projected volume kombiniert ConfigMap, Secret, Downward API und einen ServiceAccount token\
  \ eine Projektion.\nDownward API übergibt Informationen über den eigenen Pod des Containers, beispielsweise\
  \ seinen Namen.\nEin token hat einen audience und ein Ablaufdatum; kubelet aktualisiert sie und die\
  \ Anwendung muss die aktuelle Datei lesen.\n*(laut Dokumentation)* — [projected volumes](https://kubernetes.io/docs/concepts/storage/projected-volumes/).\n\
  \n> [!info]- Ausführlichere Erklärung\n> `automountServiceAccountToken: false` deaktiviert die **automatische**\
  \ volume, keine explizit deklarierte token-Projektion.\n> Audience `example-consumer` verspricht nicht,\
  \ dass der Kubernetes API diesen token akzeptiert.\nDas Fehlen von > A ConfigMap/Secret führt zu einem\
  \ Vorbereitungsfehler: Eine Umgebungsvariable kann auftreten\n> `CreateContainerConfigError`, während\
  \ ein volume möglicherweise `FailedMount` erzeugt. Ein neuer Fehler und eine token-Rotation sind *(nicht\
  \ verifiziert)*.\n>\n> Restart nach ConfigMap-Änderungen durch einen template checksum wird erklärt,\
  \ ohne dass das Diagramm in dupliziert wird\n> [[Helm-Visual-Guide#20. Как это спрашивают|20. Interview\
  \ questions]]. Prinzip: Eine **Pod template** Annotation ändert sich, dann gilt §6.\n>\n> **Vorhersage:**\
  \ Ein Secret wird aktualisiert, aber die Anwendung liest ihn nur aus einer Umgebungsvariablen.\n>\n\
  > > [!question]- Antwort\nDer laufende Prozess > > A empfängt die neue Umgebungsvariable nicht automatisch.\n\
  > > Es ist ein neuer Container oder ein anderer Liefer- und Nachlademechanismus erforderlich.\n> > *(laut\
  \ Dokumentation)* – die Secret-Quelle oben; Das neue Experiment verwendete ConfigMap.\n>\n> **Kurze\
  \ Antwort auf Englisch:**\n>\n> > EUmgebungswerte werden beim Start des Containers festgelegt. Normale\
  \ projected-Dateien können später aktualisiert werden.\nDer > > A subPath-Mount erhält diese Updates\
  \ nicht. Durch das alleinige Aktualisieren eines ConfigMap wird ein Deployment nicht neu gestartet.\n\
  \n### Gateway API: wo man studieren kann HTTPRoute\n\nHeader-Abgleich, relative backendRefs-Gewichte\
  \ und Überprüfung `status.parents`\nwerden anhand eines unabhängigen 3:1-Beispiels in [[Networking-Visual-Guide#HTTPRoute:\
  \ выбор правила, относительные веса и привязка|Networking Guide: HTTPRoute]] erläutert.\nÜberprüfen\
  \ Sie zunächst Accepted/ResolvedRefs auf das beabsichtigte übergeordnete Element und die beabsichtigte\
  \ Generation und dann auf die tatsächliche HTTP-Lieferung."
