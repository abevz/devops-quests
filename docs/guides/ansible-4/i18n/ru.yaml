heading: '4. Идемпотентность: действие и отчёт о действии'
text: "## 4. Идемпотентность: действие и отчёт о действии\n\n**Коротко**\n- Идемпотентная задача при повторе оставляет то же состояние.\n- Модуль copy сравнивает нужный текст с существующим файлом.\n- Статус changed сообщает о заявленном изменении, а не о здоровье приложения.\n\n**Мини-пример:** в отдельном временном каталоге сохрани `mini.yml`; запуск — `ansible-playbook -i localhost, -c local mini.yml`. Пример работает на localhost без become.\n\n```yaml\n- hosts: localhost\n  connection: local\n  become: false\n  gather_facts: false\n  tasks:\n    - ansible.builtin.copy:\n        dest: \"{{ playbook_dir }}/result.conf\"\n        content: \"color=green\\n\"\n        mode: '0600'\n      register: result\n    - ansible.builtin.debug:\n        msg: \"{{ result.changed }}\"\n```\n\n**Предскажи:** Чем отличаются changed и сообщение первого и второго запусков в новом каталоге?\n\n> [!question]- Ответ\n> Запуск 1; код 0. Фрагменты stdout:\n>\n> ```text\n>     \"msg\": true\n> localhost                  : ok=2    changed=1    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n>\n> Запуск 2; код 0. Фрагменты stdout:\n>\n> ```text\n>     \"msg\": false\n> localhost                  : ok=2    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n\nПервый запуск создаёт файл, второй видит совпадающий текст и права. Файл принадлежит временному каталогу этого примера.\n\nПолный `idempotent.yml`:\n\n```yaml\n- name: Repeat safely\n  hosts: lab\n  connection: local\n  gather_facts: false\n  become: false\n  tasks:\n    - name: Create directory\n      ansible.builtin.file:\n        path: /tmp/ansible-visual-guide/app\n        state: directory\n        mode: \"0755\"\n    - name: Write file\n      ansible.builtin.copy:\n        content: \"port=8080\\n\"\n        dest: /tmp/ansible-visual-guide/app/config\n        mode: \"0644\"\n      notify: Report change\n    - name: Create marker once\n      ansible.builtin.command:\n        argv:\n          - /usr/bin/touch\n          - /tmp/ansible-visual-guide/app/marker\n        creates: /tmp/ansible-visual-guide/app/marker\n  handlers:\n    - name: Report change\n      ansible.builtin.debug:\n        msg: handler ran\n```\n\n`argv` — список аргументов без разбора оболочкой. В обычном `command` символы `|`, `>` не создают конвейер\nи перенаправление. `shell` передаёт строку `/bin/sh`, поэтому понимает их, но добавляет риск внедрения команд.\n`creates` проверяет наличие файла **перед** запуском команды: есть маркер — команду не выполняют.\n`removes` наоборот выполняет команду только при наличии указанного пути.\n*(по документации)* [`command`](https://docs.ansible.com/ansible/latest/collections/ansible/builtin/command_module.html).\n\n*(проверено)* Эквивалент этого playbook на чистом каталоге и повтор:\n\n```text\n# First run\nlocalhost : ok=4 changed=3 unreachable=0 failed=0 skipped=0 rescued=0 ignored=0\n# Second run\nlocalhost : ok=3 changed=0 unreachable=0 failed=0 skipped=0 rescued=0 ignored=0\n```\n\nПочему меньше `ok` во втором: обработчик не уведомлён. `creates` делает защиту через файл-маркер, но не проверяет\nполезный результат миграции. Если маркер создан раньше успешного завершения, повтор ошибочно пропустится.\n\nИдемпотентная операция при повторе с тем же входом оставляет то же состояние.\n`file: state=directory` проверяет каталог и права; `copy` сравнивает содержимое и нужные атрибуты.\nЕсли всё совпало, менять нечего. Проверка делается на управляемом узле; управляющий узел получает `changed: false`.\n\n| Статус задачи | Смысл | Ловушка |\n|---|---|---|\n| `ok` | Успех, без заявленного изменения | `changed_when: false` способен скрыть реальное изменение. |\n| `changed` | Успех с заявленным изменением | Это отчёт модуля/условия, не независимый аудит ОС. |\n| `failed` | Задача не выполнила критерий успеха | Часть действий могла уже произойти. |\n| `skipped` | Пропуск из-за условия или режима | Это не подтверждение состояния сервиса. |\n| `unreachable` | Не удалось обеспечить подключение/исполнение | Отличается от ошибки команды с `rc != 0`. |\n\nВ итоговой сводке `ok` включает успешные задачи с изменением: это не взаимоисключающие счётчики.\nСбой одной задачи не откатывает предыдущие изменения.\n\n> [!info]- Глубже\n> `command`/`shell` обычно сообщают `changed` при запуске: они не знают семантику произвольной команды.\n> `mkdir -p` сам безопасен при повторе, но всё равно может сообщать `changed`. `echo ... >> file` реально\n> дублирует строку. Заменить его `lineinfile` — изменить операцию; `changed_when: false` — только скрыть отчёт.\n>\n> Полный пример корректного отчёта для **читающей** команды:\n>\n> **`report.yml` (имя любое) рядом с `inventory.ini` из §2:**\n>\n> ```yaml\n> - name: Read and interpret a result\n>   hosts: lab\n>   connection: local\n>   gather_facts: false\n>   become: false\n>   tasks:\n>     - name: Read a value\n>       ansible.builtin.command:\n>         argv: [/usr/bin/printf, hello]\n>       register: read_result\n>       changed_when: false\n>       failed_when: read_result.rc != 0 or read_result.stdout != 'hello'\n> ```\n>\n> `changed_when` переопределяет `changed` и тем самым влияет на `notify`. `failed_when` переопределяет `failed`.\n> Они **не предотвращают** выполнение команды и не исправляют её побочные эффекты.\n> Список выражений под `failed_when` объединяется логическим «и»; для логического «или» используйте одно выражение с `or`.\n> Реальный запуск несуществующей команды показывает, что действие может завершиться ошибкой до успеха (§16), поэтому\n> фраза «`command` всегда `changed`» слишком абсолютна.\n>\n> **Режим проверки** (`--check`) просит модули предсказать изменение. **Показ различий** (`--diff`) просит показать\n> разницу, например текст файла. Это независимые режимы. `command` без `creates`/`removes` обычно `skipped`\n> в режиме проверки; с защитой от повторного действия может предсказать `changed`, не выполняя команду. У `register` после `skipped` нет\n> гарантии `stdout`. Читающую команду можно выполнить с ключевым словом задачи `check_mode: false` и\n> `changed_when: false`; это реальный запуск даже при глобальном `--check`.\n> *(по документации)* [Режим проверки и различия](https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_checkmode.html).\n>\n> **Как повторить:** это тот же `idempotent.yml` выше, уже применённый один раз. В задаче `Write file` (модуль `copy`) замени `content: \"port=8080\\n\"` на `content: \"port=9090\\n\"` и запусти `ansible-playbook -i inventory.ini idempotent.yml --check --diff`.\n>\n> *(проверено)* Вариант `copy` с `port=9090` запущен с `--check --diff` поверх `port=8080`:\n>\n> ```diff\n> -port=8080\n> +port=9090\n> ```\n>\n> Итоговая сводка: `ok=4 changed=1 failed=0`; сравнение байтов до/после подтвердило, что файл остался `port=8080`.\n> Уведомлённый обработчик с `debug` выполнился и в режиме проверки: это не доказательство реального перезапуска.\n>\n> Режим проверки не создаёт отсутствующий родительский каталог для следующей задачи, не запускает сервис и не доказывает\n> его здоровье. Поддержка зависит от модуля; различия секретных данных могут попасть в лог. Второй обычный запуск с\n> `changed=0` — полезный сигнал, но не доказательство правильности приложения.\n\n### Предскажи 1: Команда без защиты от повторного действия\n\n**Коротко**\n- Команда без проверки состояния запускается повторно.\n- Успешный запуск и изменение — разные свойства.\n- Сравни два запуска по сводке, а не только по отсутствию ошибки.\n\n**`predict-1.yml` (имя любое) рядом с `inventory.ini` из §2:**\n\n```yaml\n- hosts: lab\n  connection: local\n  gather_facts: false\n  become: false\n  tasks:\n  - name: Probe\n    ansible.builtin.command:\n      argv:\n      - /usr/bin/printf\n      - hello\n```\n\n**Предскажи:** Без `creates` запусти этот playbook дважды. Каковы статус `Probe` и итоговая сводка каждого запуска?\n\n> [!question]- Ответ\n> ```text\n> # Первый запуск; код завершения 0\n> changed: [localhost]\n> localhost                  : ok=1    changed=1    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> # Второй запуск; код завершения 0\n> changed: [localhost]\n> localhost                  : ok=1    changed=1    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n> `command` выполняется оба раза и сообщает изменение, хотя команда только печатает текст.\n\n### Предскажи 2: Изменён только отчёт\n\n**Коротко**\n- changed_when меняет отчёт задачи.\n- Он не отменяет выполнение самой команды.\n- Отсутствие changed ещё не доказывает отсутствие побочного действия.\n\n**`predict-2.yml` (имя любое) рядом с `inventory.ini` из §2:**\n\n```yaml\n- hosts: lab\n  connection: local\n  gather_facts: false\n  become: false\n  tasks:\n  - name: Probe\n    ansible.builtin.command:\n      argv:\n      - /usr/bin/printf\n      - hello\n    changed_when: false\n```\n\n**Предскажи:** В предыдущем примере добавлен `changed_when: false`. Каковы статус `Probe` и сводка первого и второго запуска?\n\n> [!question]- Ответ\n> ```text\n> # Первый запуск; код завершения 0\n> ok: [localhost]\n> localhost                  : ok=1    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> # Второй запуск; код завершения 0\n> ok: [localhost]\n> localhost                  : ok=1    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n> Команда всё ещё выполняется дважды. Переопределён отчёт об изменении, а не само действие.\n\n### Предскажи 3: Команда в режиме проверки\n\n**Коротко**\n- Режим check просит предсказать изменение.\n- Не каждый модуль или команда умеет это делать.\n- Пропущенная задача не доказывает нужное состояние.\n\n**`predict-3.yml` (имя любое) рядом с `inventory.ini` из §2:**\n\n```yaml\n- hosts: lab\n  connection: local\n  gather_facts: false\n  become: false\n  tasks:\n  - name: Probe\n    ansible.builtin.command:\n      argv:\n      - /usr/bin/printf\n      - hello\n```\n\n**Предскажи:** Оба запуска выполняются с `--check`. Будет ли `Probe` выполнена и что попадёт в сводку?\n\n> [!question]- Ответ\n> ```text\n> # Первый запуск; код завершения 0\n> skipping: [localhost]\n> localhost                  : ok=0    changed=0    unreachable=0    failed=0    skipped=1    rescued=0    ignored=0\n> # Второй запуск; код завершения 0\n> skipping: [localhost]\n> localhost                  : ok=0    changed=0    unreachable=0    failed=0    skipped=1    rescued=0    ignored=0\n> ```\n> Без `creates`/`removes` модуль не может предсказать изменение произвольной команды и пропускает её.\n\nВопрос: **How do you make a command idempotent?**\n\n> I first look for a module that manages the required state. If I must run a `command`, I can use a\n> guard such as `creates`, or check the state before running it. `changed_when` controls reporting;\n> it does not stop the `command` from changing the system again.\n\n### lineinfile: обеспечить строку, а не дописывать каждый раз\n\n**Коротко**\n- lineinfile обеспечивает нужную строку в файле.\n- Шаблон regexp выбирает строку для замены.\n- Повторный запуск не должен добавлять такую же строку снова.\n\n**Мини-пример:** в отдельном временном каталоге сохрани `mini.yml`; запуск — `ansible-playbook -i localhost, -c local mini.yml`. Пример работает на localhost без become.\n\n```yaml\n- hosts: localhost\n  connection: local\n  become: false\n  gather_facts: false\n  tasks:\n    - ansible.builtin.lineinfile:\n        path: \"{{ playbook_dir }}/settings.conf\"\n        regexp: '^color='\n        line: color=green\n        create: true\n        mode: '0600'\n      register: result\n    - ansible.builtin.debug:\n        msg: \"{{ result.changed }}\"\n```\n\n**Предскажи:** Создастся ли строка при первом запуске? Изменится ли файл при втором?\n\n> [!question]- Ответ\n> Запуск 1; код 0. Фрагменты stdout:\n>\n> ```text\n>     \"msg\": true\n> localhost                  : ok=2    changed=1    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n>\n> Запуск 2; код 0. Фрагменты stdout:\n>\n> ```text\n>     \"msg\": false\n> localhost                  : ok=2    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n\n`create: true` разрешает создать файл в пустом каталоге. В полном прежнем опыте ниже файл готовится заранее и используется другое значение `create`.\n\nОпыт выполняется в новом временном каталоге на localhost, без become.\nНачальный `settings.conf` содержит `color=blue` и `size=2`, по строке.\nPlaybook `line.yml` использует путь только внутри этого каталога:\n\n```yaml\n- name: Local line experiment\n  hosts: localhost\n  connection: local\n  gather_facts: false\n  tasks:\n    - name: Ensure color\n      ansible.builtin.lineinfile:\n        path: \"{{ playbook_dir }}/settings.conf\"\n        regexp: '^color='\n        line: 'color=green'\n        create: false\n```\n\nЗапусти `ansible-playbook -i localhost, line.yml` дважды.\nПервый запуск заменяет color и сообщает changed=1, второй — changed=0.\nСтрока size остаётся на месте. *(проверено: два локальных запуска)*.\n`path` выбирает файл, `regexp` ищет заменяемую строку, `line` задаёт желаемый текст.\nПри отсутствии совпадения строка добавляется (по умолчанию в конец).\n`create: false` не создаёт отсутствующий файл; это самостоятельная ошибка подготовки.\nЕсли совпадений несколько, заменяется последнее, а не удаляются все дубли.\nРегулярное выражение должно совпадать и с прежним, и с итоговым вариантом.\nИначе второй запуск может добавить строку вместо узнавания собственного результата.\n\n> [!info]- Глубже\n> | Исходное состояние | Результат lineinfile |\n> |---|---|\n> | Одна color=blue | Замена на color=green |\n> | Нет color | Добавление color=green |\n> | Уже color=green | Без изменения |\n> | Две строки color | Замена последнего совпадения; дубли остаются |\n>\n> Миграция накопленных дублей — отдельная задача с явным правилом сохранения остальных строк.\n> Идемпотентность на чистом входе не доказывает исправление любого испорченного входа.\n> [Документация lineinfile](https://docs.ansible.com/ansible/latest/collections/ansible/builtin/lineinfile_module.html)."
