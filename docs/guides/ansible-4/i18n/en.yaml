heading: '4. Idempotency: an action and its reported result'
text: "## 4. Idempotency: an action and its reported result\n\n**At a glance**\n- Repeating an idempotent task leaves the same state.\n- The copy module compares the desired text with the existing file.\n- A changed status reports a declared change, not application health.\n\n**Mini-example:** save `mini.yml` in a separate temporary directory; run `ansible-playbook -i localhost, -c local mini.yml`. The example runs on localhost without become.\n\n```yaml\n- hosts: localhost\n  connection: local\n  become: false\n  gather_facts: false\n  tasks:\n    - ansible.builtin.copy:\n        dest: \"{{ playbook_dir }}/result.conf\"\n        content: \"color=green\\n\"\n        mode: '0600'\n      register: result\n    - ansible.builtin.debug:\n        msg: \"{{ result.changed }}\"\n```\n\n**Predict:** How do changed and the message differ between the first and second runs in a new directory?\n\n> [!question]- Answer\n> Run 1; exit code 0. Stdout excerpts:\n>\n> ```text\n>     \"msg\": true\n> localhost                  : ok=2    changed=1    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n>\n> Run 2; exit code 0. Stdout excerpts:\n>\n> ```text\n>     \"msg\": false\n> localhost                  : ok=2    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n\nThe first run creates the file; the second sees matching text and permissions. The file belongs to this example's temporary directory.\n\nComplete `idempotent.yml`:\n\n```yaml\n- name: Repeat safely\n  hosts: lab\n  connection: local\n  gather_facts: false\n  become: false\n  tasks:\n    - name: Create directory\n      ansible.builtin.file:\n        path: /tmp/ansible-visual-guide/app\n        state: directory\n        mode: \"0755\"\n    - name: Write file\n      ansible.builtin.copy:\n        content: \"port=8080\\n\"\n        dest: /tmp/ansible-visual-guide/app/config\n        mode: \"0644\"\n      notify: Report change\n    - name: Create marker once\n      ansible.builtin.command:\n        argv:\n          - /usr/bin/touch\n          - /tmp/ansible-visual-guide/app/marker\n        creates: /tmp/ansible-visual-guide/app/marker\n  handlers:\n    - name: Report change\n      ansible.builtin.debug:\n        msg: handler ran\n```\n\n`argv` is an argument list without shell parsing. In ordinary `command`, `|` and `>` do not create a pipeline\nor redirection. `shell` passes a string to `/bin/sh`, which understands them but introduces command-injection risk.\n`creates` checks for a file **before** execution: if the marker exists, the command does not run.\nConversely, `removes` runs the command only when its specified path exists.\n*(according to documentation)* [`command`](https://docs.ansible.com/ansible/latest/collections/ansible/builtin/command_module.html).\n\n*(verified)* Equivalent playbook on a clean directory, then repeated:\n\n```text\n# First run\nlocalhost : ok=4 changed=3 unreachable=0 failed=0 skipped=0 rescued=0 ignored=0\n# Second run\nlocalhost : ok=3 changed=0 unreachable=0 failed=0 skipped=0 rescued=0 ignored=0\n```\n\nWhy fewer `ok` tasks on the second run: the handler was not notified. `creates` guards through a marker file but does not verify\na successful migration result. Creating the marker before successful completion makes a later run incorrectly skip the command.\n\nRepeating an idempotent operation with the same input leaves the same state.\n`file: state=directory` checks the directory and permissions; `copy` compares content and required attributes.\nIf everything matches, there is nothing to change. The check runs on the managed node; the controller receives `changed: false`.\n\n| Task status | Meaning | Trap |\n|---|---|---|\n| `ok` | Success without a reported change | `changed_when: false` can hide a real change. |\n| `changed` | Success with a reported change | This is a module/condition report, not an independent OS audit. |\n| `failed` | The task did not meet its success criterion | Some actions may already have happened. |\n| `skipped` | Omitted because of a condition or mode | This does not confirm service state. |\n| `unreachable` | Connection/execution could not be established | Different from a command failing with `rc != 0`. |\n\nThe recap's `ok` count includes successful changed tasks: these counters are not mutually exclusive.\nFailure of one task does not roll back earlier changes.\n\n> [!info]- Deeper explanation\n> `command`/`shell` usually report `changed` when they run: they do not understand an arbitrary command's semantics.\n> `mkdir -p` is itself safe to repeat but may still report `changed`. `echo ... >> file` actually\n> duplicates a line. Replacing it with `lineinfile` changes the operation; `changed_when: false` merely hides the report.\n>\n> A complete correct-reporting example for a **read-only** command:\n>\n> **`report.yml` (any filename) beside `inventory.ini` from §2:**\n>\n> ```yaml\n> - name: Read and interpret a result\n>   hosts: lab\n>   connection: local\n>   gather_facts: false\n>   become: false\n>   tasks:\n>     - name: Read a value\n>       ansible.builtin.command:\n>         argv: [/usr/bin/printf, hello]\n>       register: read_result\n>       changed_when: false\n>       failed_when: read_result.rc != 0 or read_result.stdout != 'hello'\n> ```\n>\n> `changed_when` overrides `changed`, thereby affecting `notify`. `failed_when` overrides `failed`.\n> They **do not prevent** command execution or repair its side effects.\n> A `failed_when` expression list is combined with logical AND; use a single expression with `or` for logical OR.\n> An actual nonexistent-command run shows an action can fail before success (§16), so\n> “`command` is always `changed`” is too absolute.\n>\n> **Check mode** (`--check`) asks modules to predict changes. **Diff mode** (`--diff`) asks for a difference,\n> such as file text. They are independent modes. `command` without `creates`/`removes` is usually `skipped`\n> in check mode; a repeat guard can predict `changed` without running the command. A `register` result after `skipped` has no\n> guarantee of `stdout`. A read-only command can use task keyword `check_mode: false` with\n> `changed_when: false`; this executes for real even under global `--check`.\n> *(according to documentation)* [Check and diff modes](https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_checkmode.html).\n>\n> **Reproduce:** use the same `idempotent.yml` above after one apply. In task `Write file` (module `copy`), replace `content: \"port=8080\\n\"` with `content: \"port=9090\\n\"`, then run `ansible-playbook -i inventory.ini idempotent.yml --check --diff`.\n>\n> *(verified)* The `copy` variant with `port=9090` ran with `--check --diff` over `port=8080`:\n>\n> ```diff\n> -port=8080\n> +port=9090\n> ```\n>\n> Recap: `ok=4 changed=1 failed=0`; comparing bytes before/after confirmed the file stayed `port=8080`.\n> The notified `debug` handler also ran in check mode; this does not prove a real restart.\n>\n> Check mode does not create a missing parent directory for a later task, start a service, or prove\n> its health. Support depends on the module; secret-data diffs may reach logs. A second ordinary run with\n> `changed=0` is useful evidence, not proof of application correctness.\n\n### Predict 1: command without a repeat guard\n\n**At a glance**\n- A command without a state check runs again.\n- Successful execution and a change are different properties.\n- Compare the summaries of two runs, not just the absence of errors.\n\n**`predict-1.yml` (any filename) beside `inventory.ini` from §2:**\n\n```yaml\n- hosts: lab\n  connection: local\n  gather_facts: false\n  become: false\n  tasks:\n  - name: Probe\n    ansible.builtin.command:\n      argv:\n      - /usr/bin/printf\n      - hello\n```\n\n**Predict:** run this playbook twice without `creates`. What are `Probe` status and the recap for each run?\n\n> [!question]- Answer\n> ```text\n> # Первый запуск; код завершения 0\n> changed: [localhost]\n> localhost                  : ok=1    changed=1    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> # Второй запуск; код завершения 0\n> changed: [localhost]\n> localhost                  : ok=1    changed=1    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n> `command` runs both times and reports a change, although it merely prints text.\n\n### Predict 2: only the report changed\n\n**At a glance**\n- changed_when changes the task's report.\n- It does not cancel execution of the command itself.\n- No changed status does not prove the absence of side effects.\n\n**`predict-2.yml` (any filename) beside `inventory.ini` from §2:**\n\n```yaml\n- hosts: lab\n  connection: local\n  gather_facts: false\n  become: false\n  tasks:\n  - name: Probe\n    ansible.builtin.command:\n      argv:\n      - /usr/bin/printf\n      - hello\n    changed_when: false\n```\n\n**Predict:** add `changed_when: false` to the previous example. What are `Probe` status and recaps for the first and second runs?\n\n> [!question]- Answer\n> ```text\n> # Первый запуск; код завершения 0\n> ok: [localhost]\n> localhost                  : ok=1    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> # Второй запуск; код завершения 0\n> ok: [localhost]\n> localhost                  : ok=1    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n> The command still executes twice. The change report is overridden, not the action itself.\n\n### Predict 3: command in check mode\n\n**At a glance**\n- Check mode asks for a prediction of changes.\n- Not every module or command supports this.\n- A skipped task does not prove the desired state.\n\n**`predict-3.yml` (any filename) beside `inventory.ini` from §2:**\n\n```yaml\n- hosts: lab\n  connection: local\n  gather_facts: false\n  become: false\n  tasks:\n  - name: Probe\n    ansible.builtin.command:\n      argv:\n      - /usr/bin/printf\n      - hello\n```\n\n**Predict:** both runs use `--check`. Will `Probe` execute, and what appears in the recap?\n\n> [!question]- Answer\n> ```text\n> # Первый запуск; код завершения 0\n> skipping: [localhost]\n> localhost                  : ok=0    changed=0    unreachable=0    failed=0    skipped=1    rescued=0    ignored=0\n> # Второй запуск; код завершения 0\n> skipping: [localhost]\n> localhost                  : ok=0    changed=0    unreachable=0    failed=0    skipped=1    rescued=0    ignored=0\n> ```\n> Without `creates`/`removes`, the module cannot predict changes from an arbitrary command and skips it.\n\nQuestion: **How do you make a command idempotent?**\n\n> I first look for a module that manages the required state. If I must run a `command`, I can use a\n> guard such as `creates`, or check the state before running it. `changed_when` controls reporting;\n> it does not stop the `command` from changing the system again.\n\n### lineinfile: ensure a line rather than append on every run\n\n**At a glance**\n- lineinfile ensures a desired line is present in a file.\n- The regexp pattern selects the line to replace.\n- Repeating the run should not add that same line again.\n\n**Mini-example:** save `mini.yml` in a separate temporary directory; run `ansible-playbook -i localhost, -c local mini.yml`. The example runs on localhost without become.\n\n```yaml\n- hosts: localhost\n  connection: local\n  become: false\n  gather_facts: false\n  tasks:\n    - ansible.builtin.lineinfile:\n        path: \"{{ playbook_dir }}/settings.conf\"\n        regexp: '^color='\n        line: color=green\n        create: true\n        mode: '0600'\n      register: result\n    - ansible.builtin.debug:\n        msg: \"{{ result.changed }}\"\n```\n\n**Predict:** Will the first run create the line? Will the second run change the file?\n\n> [!question]- Answer\n> Run 1; exit code 0. Stdout excerpts:\n>\n> ```text\n>     \"msg\": true\n> localhost                  : ok=2    changed=1    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n>\n> Run 2; exit code 0. Stdout excerpts:\n>\n> ```text\n>     \"msg\": false\n> localhost                  : ok=2    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n> ```\n\n`create: true` allows creation of a file in an empty directory. The previous full experiment below prepares the file in advance and uses a different `create` value.\n\nRun the experiment in a new temporary directory on localhost, without become.\nInitial `settings.conf` contains `color=blue` and `size=2`, one per line.\nPlaybook `line.yml` uses a path only inside that directory:\n\n```yaml\n- name: Local line experiment\n  hosts: localhost\n  connection: local\n  gather_facts: false\n  tasks:\n    - name: Ensure color\n      ansible.builtin.lineinfile:\n        path: \"{{ playbook_dir }}/settings.conf\"\n        regexp: '^color='\n        line: 'color=green'\n        create: false\n```\n\nRun `ansible-playbook -i localhost, line.yml` twice.\nThe first run replaces color and reports changed=1; the second reports changed=0.\nThe size line stays in place. *(verified: two local runs)*.\n`path` selects the file, `regexp` finds the line to replace, and `line` provides the desired text.\nIf nothing matches, the line is added, at the end by default.\n`create: false` does not create a missing file; that is a separate preparation failure.\nIf several lines match, the last is replaced rather than every duplicate being removed.\nThe regular expression should match both the old and final forms.\nOtherwise a second run may add another line instead of recognizing its own result.\n\n> [!info]- Deeper explanation\n> | Initial state | lineinfile result |\n> |---|---|\n> | One color=blue | Replace with color=green |\n> | No color | Add color=green |\n> | Already color=green | No change |\n> | Two color lines | Replace the last match; duplicates remain |\n>\n> Migrating accumulated duplicates is a separate task with explicit rules for preserving other lines.\n> Idempotency on clean input does not prove repair of every corrupted input.\n> [lineinfile documentation](https://docs.ansible.com/ansible/latest/collections/ansible/builtin/lineinfile_module.html)."
