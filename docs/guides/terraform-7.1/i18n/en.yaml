heading: '7.1. A complete working module: four files and the calling root'
text: "### 7.1. A complete working module: four files and the calling root\n\n**At a glance**\n- The root passes arguments to a child module.\n- Inputs and outputs define its contract.\n- A local source must point to an existing directory.\n\n**Mini-example:** save this as `main.tf` in a new temporary directory. After preparing the files, run `tofu init`, `tofu validate`, then `tofu apply -auto-approve -input=false -no-color`.\n\n```hcl\nmodule \"worker\" {\n  source = \"./modules/worker\"\n  name = \"api\"\n}\noutput \"label\" {\n  value = module.worker.label\n}\n```\n\nAdditional file `modules/worker/main.tf`:\n\n```hcl\nvariable \"name\" { type = string }\noutput \"label\" { value = \"${var.name}-dev\" }\n```\n\n**Predict:** What will the run show, and what will its exit code be?\n\n> [!question]- Answer\n> Actual excerpt from the last command:\n>\n> ```text\n> Apply complete! Resources: 0 added, 0 changed, 0 destroyed.\n> Outputs:\n> + label = \"api-dev\"\n>\n> You can apply this plan to save these new output values to the OpenTofu\n> state, without changing any real infrastructure.\n>\n> Apply complete! Resources: 0 added, 0 changed, 0 destroyed.\n>\n> Outputs:\n>\n> label = \"api-dev\"\n> ```\n>\n> Exit code: 0.\n\nThe additional file below declares the name input and label output. The root passes api and receives api-dev.\n\n> [!info]- Deeper explanation\n> Every file below is shown in full. Create this layout in a new temporary directory; `terraform_data` is built in, so no external plugins or cloud are needed. File names are a reading convention: Terraform combines all `.tf` files in a directory rather than executing them in order.\n>\n> ```text\n> lab/\n> ├── main.tf\n> ├── terraform.tfvars\n> ├── worker.tftest.hcl              # tests from §7.7\n> └── modules/worker/\n>     ├── variables.tf              # input contract\n>     ├── main.tf                   # resources\n>     ├── outputs.tf                # output contract\n>     └── versions.tf               # supported CLI version\n> ```\n>\n> `README.md` should explain purpose, inputs, outputs and version upgrades; `examples/` should contain a minimal consumer example. Those files are not required for this exercise; the four files below and the root were actually run.\n>\n> **`modules/worker/variables.tf`:**\n>\n> ```hcl\n> variable \"name\" {\n>   description = \"Component name\"\n>   type        = string\n>   validation {\n>     condition     = length(var.name) >= 3\n>     error_message = \"name must contain at least 3 characters.\"\n>   }\n> }\n> variable \"settings\" {\n>   description = \"Component settings\"\n>   type        = object({ port = optional(number, 8080), labels = optional(map(string), {}) })\n>   default     = {}\n> }\n> variable \"token\" {\n>   description = \"Training secret\"\n>   type        = string\n>   default     = \"demo-token\"\n>   sensitive   = true\n> }\n> ```\n>\n> **`modules/worker/main.tf`:**\n>\n> ```hcl\n> resource \"terraform_data\" \"this\" {\n>   input = { name = var.name, port = var.settings.port, labels = var.settings.labels }\n> }\n> ```\n>\n> **`modules/worker/outputs.tf`:**\n>\n> ```hcl\n> output \"name\" {\n>   description = \"Component name after apply\"\n>   value       = terraform_data.this.output.name\n> }\n> output \"id\" {\n>   description = \"Component identifier\"\n>   value       = terraform_data.this.id\n> }\n> output \"token\" {\n>   description = \"Training secret for the parent\"\n>   value       = var.token\n>   sensitive   = true\n> }\n> ```\n>\n> **`modules/worker/versions.tf`:**\n>\n> ```hcl\n> terraform {\n>   required_version = \">= 1.7.0\"\n> }\n> ```\n>\n> **Root `main.tf`:**\n>\n> ```hcl\n> variable \"name\" { type = string }\n> module \"worker\" {\n>   source = \"./modules/worker\"\n>   name   = var.name\n> }\n> output \"worker_name\" { value = module.worker.name }\n> output \"worker_id\" { value = module.worker.id }\n> output \"worker_token\" {\n>   value     = module.worker.token\n>   sensitive = true\n> }\n> ```\n>\n> **Root `terraform.tfvars`:**\n>\n> ```hcl\n> name = \"worker-a\"\n> ```\n>\n> The root was tested with `tofu init`, `tofu plan -out=module.tfplan`, `tofu apply module.tfplan`. The abbreviated initialization output shows installation of the child module: for a local path this registers a directory rather than downloading an archive.\n>\n> ```text\n> Initializing modules...\n> - worker in modules/worker\n> - terraform.io/builtin/terraform is built in to OpenTofu\n> OpenTofu has been successfully initialized!\n> ```\n>\n> The plan shows the name passed into the resource; the `worker_name` output is still unknown until apply:\n>\n> ```text\n> # module.worker.terraform_data.this will be created\n>\n>           + name   = \"worker-a\"\n>           + port   = 8080\n> Plan: 1 to add, 0 to change, 0 to destroy.\n>   + worker_name  = (known after apply)\n>   + worker_token = (sensitive value)\n> ```\n>\n> ```text\n> Apply complete! Resources: 1 added, 0 changed, 0 destroyed.\n> worker_name = \"worker-a\"\n> worker_token = <sensitive>\n> ```\n>\n> *(verified: OpenTofu 1.12.6, complete cycle in a new local directory)*."
