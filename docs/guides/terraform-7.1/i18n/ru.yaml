heading: '7.1. Полный рабочий модуль: четыре файла и вызывающий корень'
text: "### 7.1. Полный рабочий модуль: четыре файла и вызывающий корень\n\n**Коротко**\n- Корень передаёт аргументы дочернему модулю.\n- Входы и выходы определяют его контракт.\n- Локальный source должен указывать на существующий каталог.\n\n**Мини-пример:** сохрани как `main.tf` в новом временном каталоге. После подготовки файлов выполни `tofu init`, `tofu validate`, затем `tofu apply -auto-approve -input=false -no-color`.\n\n```hcl\nmodule \"worker\" {\n  source = \"./modules/worker\"\n  name = \"api\"\n}\noutput \"label\" {\n  value = module.worker.label\n}\n```\n\nДополнительный файл `modules/worker/main.tf`:\n\n```hcl\nvariable \"name\" { type = string }\noutput \"label\" { value = \"${var.name}-dev\" }\n```\n\n**Предскажи:** что покажет запуск и каким будет код завершения?\n\n> [!question]- Ответ\n> Фактическая выдержка последней команды:\n>\n> ```text\n> Apply complete! Resources: 0 added, 0 changed, 0 destroyed.\n> Outputs:\n> + label = \"api-dev\"\n>\n> You can apply this plan to save these new output values to the OpenTofu\n> state, without changing any real infrastructure.\n>\n> Apply complete! Resources: 0 added, 0 changed, 0 destroyed.\n>\n> Outputs:\n>\n> label = \"api-dev\"\n> ```\n>\n> Код завершения: 0.\n\nДополнительный файл ниже объявляет вход name и выход label. Корень передаёт api и получает api-dev.\n\n> [!info]- Глубже\n> Ниже каждый файл приведён целиком. Создай структуру в новом временном каталоге; `terraform_data` — встроенный ресурс, внешние плагины и облако не нужны. Названия файлов — соглашение для чтения: Terraform объединяет все `.tf` в каталоге, а не исполняет их по порядку.\n>\n> ```text\n> lab/\n> ├── main.tf\n> ├── terraform.tfvars\n> ├── worker.tftest.hcl              # тесты из §7.7\n> └── modules/worker/\n>     ├── variables.tf              # входной контракт\n>     ├── main.tf                   # ресурсы\n>     ├── outputs.tf                # выходной контракт\n>     └── versions.tf               # допустимая версия CLI\n> ```\n>\n> `README.md` должен объяснять назначение, входы, выходы и обновление версии; `examples/` — содержать минимальный пример потребителя. Для учебного запуска эти файлы не требуются; четыре файла ниже и корень действительно запускались.\n>\n> **`modules/worker/variables.tf`:**\n>\n> ```hcl\n> variable \"name\" {\n>   description = \"Имя компонента\"\n>   type        = string\n>   validation {\n>     condition     = length(var.name) >= 3\n>     error_message = \"name must contain at least 3 characters.\"\n>   }\n> }\n> variable \"settings\" {\n>   description = \"Настройки компонента\"\n>   type        = object({ port = optional(number, 8080), labels = optional(map(string), {}) })\n>   default     = {}\n> }\n> variable \"token\" {\n>   description = \"Учебный секрет\"\n>   type        = string\n>   default     = \"demo-token\"\n>   sensitive   = true\n> }\n> ```\n>\n> **`modules/worker/main.tf`:**\n>\n> ```hcl\n> resource \"terraform_data\" \"this\" {\n>   input = { name = var.name, port = var.settings.port, labels = var.settings.labels }\n> }\n> ```\n>\n> **`modules/worker/outputs.tf`:**\n>\n> ```hcl\n> output \"name\" {\n>   description = \"Имя компонента после применения\"\n>   value       = terraform_data.this.output.name\n> }\n> output \"id\" {\n>   description = \"Идентификатор компонента\"\n>   value       = terraform_data.this.id\n> }\n> output \"token\" {\n>   description = \"Учебный секрет для родителя\"\n>   value       = var.token\n>   sensitive   = true\n> }\n> ```\n>\n> **`modules/worker/versions.tf`:**\n>\n> ```hcl\n> terraform {\n>   required_version = \">= 1.7.0\"\n> }\n> ```\n>\n> **Корневой `main.tf`:**\n>\n> ```hcl\n> variable \"name\" { type = string }\n> module \"worker\" {\n>   source = \"./modules/worker\"\n>   name   = var.name\n> }\n> output \"worker_name\" { value = module.worker.name }\n> output \"worker_id\" { value = module.worker.id }\n> output \"worker_token\" {\n>   value     = module.worker.token\n>   sensitive = true\n> }\n> ```\n>\n> **Корневой `terraform.tfvars`:**\n>\n> ```hcl\n> name = \"worker-a\"\n> ```\n>\n> В корне выполнили `tofu init`, `tofu plan -out=module.tfplan`, `tofu apply module.tfplan`. Сокращённый вывод инициализации показывает установку дочернего модуля: для локального пути это регистрация каталога, а не скачивание архива.\n>\n> ```text\n> Initializing modules...\n> - worker in modules/worker\n> - terraform.io/builtin/terraform is built in to OpenTofu\n> OpenTofu has been successfully initialized!\n> ```\n>\n> План показывает имя на входе ресурса; выход `worker_name` пока вычисляется после применения:\n>\n> ```text\n> # module.worker.terraform_data.this will be created\n>\n>           + name   = \"worker-a\"\n>           + port   = 8080\n> Plan: 1 to add, 0 to change, 0 to destroy.\n>   + worker_name  = (known after apply)\n>   + worker_token = (sensitive value)\n> ```\n>\n> ```text\n> Apply complete! Resources: 1 added, 0 changed, 0 destroyed.\n> worker_name = \"worker-a\"\n> worker_token = <sensitive>\n> ```\n>\n> *(проверено: OpenTofu 1.12.6, полный цикл в новом локальном каталоге)*."
