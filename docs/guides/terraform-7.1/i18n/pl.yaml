heading: '7.1. Kompletny moduł roboczy: cztery pliki i wywołujący katalog główny'
text: "### 7.1. Kompletny działający module: cztery pliki i wywołujący katalog główny\n\n**W skrócie**\n\
  - Korzeń przekazuje argumenty do dziecka module.\n- Wejścia i wyjścia definiują jego kontrakt.\n- A\
  \ lokalny source musi wskazywać na istniejący katalog.\n\n**Miniprzykład:** zapisz to jako `main.tf`\
  \ w nowym katalogu tymczasowym. Po przygotowaniu plików uruchom `tofu init`, `tofu validate`, a następnie\
  \ `tofu apply -auto-approve -input=false -no-color`.\n\n```hcl\nmodule \"worker\" {\n  source = \"./modules/worker\"\
  \n  name = \"api\"\n}\noutput \"label\" {\n  value = module.worker.label\n}\n```\n\nDodatkowy plik `modules/worker/main.tf`:\n\
  \n```hcl\nvariable \"name\" { type = string }\noutput \"label\" { value = \"${var.name}-dev\" }\n```\n\
  \n**Przewiduj:** Co pokaże przebieg i jaki będzie jego kod zakończenia?\n\n> [!question] - Odpowiedź\n\
  > Aktualny fragment ostatniego polecenia:\n>\n> ```text\n> Apply complete! Resources: 0 added, 0 changed,\
  \ 0 destroyed.\n> Outputs:\n> + label = \"api-dev\"\n>\n> You can apply this plan to save these new\
  \ output values to the OpenTofu\n> state, without changing any real infrastructure.\n>\n> Apply complete!\
  \ Resources: 0 added, 0 changed, 0 destroyed.\n>\n> Outputs:\n>\n> label = \"api-dev\"\n> ```\n>\n>\
  \ Kod wyjścia: 0.\n\nDodatkowy plik poniżej deklaruje name input i label output. Katalog główny przechodzi\
  \ api i otrzymuje api-dev.\n\n> [!info] - głębsze wyjaśnienie\n> Każdy plik poniżej jest pokazany w\
  \ całości. Utwórz ten układ w nowym katalogu tymczasowym; `terraform_data` jest wbudowany, więc nie\
  \ są potrzebne żadne zewnętrzne wtyczki ani chmura. Nazwy plików są konwencją odczytu: Terraform łączy\
  \ wszystkie pliki `.tf` w katalogu, zamiast wykonywać je w kolejności.\n>\n> ```text\n> lab/\n> ├──\
  \ main.tf\n> ├── terraform.tfvars\n> ├── worker.tftest.hcl              # tests from §7.7\n> └── modules/worker/\n\
  >     ├── variables.tf              # input contract\n>     ├── main.tf                   # resources\n\
  >     ├── outputs.tf                # output contract\n>     └── versions.tf               # supported\
  \ CLI version\n> ```\n>\n> `README.md` powinien wyjaśniać przeznaczenie, wejścia, wyjścia i aktualizacje\
  \ wersji; `examples/` powinien zawierać minimalny przykład konsumencki. Te pliki nie są wymagane w tym\
  \ ćwiczeniu; faktycznie uruchomiono cztery poniższe pliki i katalog główny.\n>\n> **`modules/worker/variables.tf`:**\n\
  >\n> ```hcl\n> variable \"name\" {\n>   description = \"Component name\"\n>   type        = string\n\
  >   validation {\n>     condition     = length(var.name) >= 3\n>     error_message = \"name must contain\
  \ at least 3 characters.\"\n>   }\n> }\n> variable \"settings\" {\n>   description = \"Component settings\"\
  \n>   type        = object({ port = optional(number, 8080), labels = optional(map(string), {}) })\n\
  >   default     = {}\n> }\n> variable \"token\" {\n>   description = \"Training secret\"\n>   type \
  \       = string\n>   default     = \"demo-token\"\n>   sensitive   = true\n> }\n> ```\n>\n> **`modules/worker/main.tf`:**\n\
  >\n> ```hcl\n> resource \"terraform_data\" \"this\" {\n>   input = { name = var.name, port = var.settings.port,\
  \ labels = var.settings.labels }\n> }\n> ```\n>\n> **`modules/worker/outputs.tf`:**\n>\n> ```hcl\n>\
  \ output \"name\" {\n>   description = \"Component name after apply\"\n>   value       = terraform_data.this.output.name\n\
  > }\n> output \"id\" {\n>   description = \"Component identifier\"\n>   value       = terraform_data.this.id\n\
  > }\n> output \"token\" {\n>   description = \"Training secret for the parent\"\n>   value       = var.token\n\
  >   sensitive   = true\n> }\n> ```\n>\n> **`modules/worker/versions.tf`:**\n>\n> ```hcl\n> terraform\
  \ {\n>   required_version = \">= 1.7.0\"\n> }\n> ```\n>\n> **Korzeń `main.tf`:**\n>\n> ```hcl\n> variable\
  \ \"name\" { type = string }\n> module \"worker\" {\n>   source = \"./modules/worker\"\n>   name   =\
  \ var.name\n> }\n> output \"worker_name\" { value = module.worker.name }\n> output \"worker_id\" { value\
  \ = module.worker.id }\n> output \"worker_token\" {\n>   value     = module.worker.token\n>   sensitive\
  \ = true\n> }\n> ```\n>\n> **Korzeń `terraform.tfvars`:**\n>\n> ```hcl\n> name = \"worker-a\"\n> ```\n\
  >\n> Korzeń został przetestowany z `tofu init`, `tofu plan -out=module.tfplan`, `tofu apply module.tfplan`.\
  \ Skrócona inicjalizacja output pokazuje instalację dziecka module: w przypadku ścieżki lokalnej powoduje\
  \ to rejestrację katalogu zamiast pobierania archiwum.\n>\n> ```text\n> Initializing modules...\n> -\
  \ worker in modules/worker\n> - terraform.io/builtin/terraform is built in to OpenTofu\n> OpenTofu has\
  \ been successfully initialized!\n> ```\n>\n> Plan przedstawia name przekazany do resource; `worker_name`\
  \ output jest nadal nieznany, dopóki nie zostanie zastosowany:\n>\n> ```text\n> # module.worker.terraform_data.this\
  \ will be created\n>\n>           + name   = \"worker-a\"\n>           + port   = 8080\n> Plan: 1 to\
  \ add, 0 to change, 0 to destroy.\n>   + worker_name  = (known after apply)\n>   + worker_token = (sensitive\
  \ value)\n> ```\n>\n> ```text\n> Apply complete! Resources: 1 added, 0 changed, 0 destroyed.\n> worker_name\
  \ = \"worker-a\"\n> worker_token = <sensitive>\n> ```\n>\n> *(zweryfikowano: OpenTofu 1.12.6, pełny\
  \ cykl w nowym katalogu lokalnym)*."
