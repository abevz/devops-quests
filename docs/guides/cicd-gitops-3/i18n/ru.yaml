heading: 3. Кто сравнивает и кто применяет (Argo CD internals, sync, waves, hooks)
text: '## 3. Кто сравнивает и кто применяет (Argo CD internals, sync, waves, hooks)


  **Коротко**

  - Repo-server получает и рендерит источник

  - Application controller сравнивает и применяет

  - Hooks и waves упорядочивают этапы.


  **Короткий сценарий**


  PreSync Job ещё не завершилась, обычные ресурсы находятся в последующей фазе.


  **Предскажи:** Должен ли более низкий номер wave обычного ресурса обойти незавершённый PreSync?


  > [!question]- Ответ

  > Нет. Сначала учитывается фаза; номер wave не отменяет её границу.


  Сначала определяется компонент и стадия, затем проверяется указанный переход. Полный прежний материал сохранён ниже.


  > [!info]- Глубже

  > **Repo-server** получает ревизию репозитория и превращает выбранный путь в набор Kubernetes-объектов.

  > Для plain YAML он читает документы; для Kustomize строит итоговый набор; для Helm рендерит шаблоны

  > с выбранными values. Сам факт успешного рендера не означает, что API примет результат.

  > В этом пути возможны ошибки Git credentials, DNS, revision, path, шаблонов и зависимостей чарта.

  >

  > **Application-controller** наблюдает Application и ресурсы назначения. Он получает desired от repo-server,

  > сопоставляет его с live и вычисляет sync/health. При запуске sync он организует применение, ожидание

  > здоровья, hooks и prune через Kubernetes API. Deployment controller и kubelet после этого выполняют

  > свою работу. Argo CD не заменяет планировщик и не запускает процессы на узле напрямую.

  >

  > **API server Argo CD** обслуживает UI/CLI/API, аутентификацию и права на операции.

  > Его не следует путать с Kubernetes API server. Redis используется для кэширования;

  > кэш не является заменой Git и объектам API. ApplicationSet controller создаёт Application (§4).

  > [Архитектура](https://argo-cd.readthedocs.io/en/stable/operator-manual/architecture/).

  >

  > ```mermaid

  > flowchart TD

  >     G["Git: revision и path"] --> R["Repo-server<br/>рендерит desired"]

  >     R --> C["Application-controller<br/>сравнивает и синхронизирует"]

  >     K["Kubernetes API<br/>live и status"] --> C

  >     C --> K

  >     U["UI или CLI"] --> A["Argo CD API server"]

  >     A --> C

  > ```

  >

  > **Sync** — операция применения выбранной ревизии. Это не атомарная транзакция всех ресурсов:

  > если третий объект не применился, первые два уже могли измениться. Часть исправлений требует нового

  > sync, а не повторного refresh. При selective sync отдельных ресурсов hooks не выполняются;

  > для миграции это существенное отличие от обычного полного sync.

  >

  > **Фаза (phase)** задаёт крупный этап: `PreSync`, обычный `Sync`, затем `PostSync`.

  > PreSync должен успешно закончиться до применения основных объектов; PostSync запускается после

  > успешного sync и здоровья ресурсов. `SyncFail` предназначен для действий после неудачной синхронизации.

  > Hook не обеспечивает откат своей внешней работы и не отменяет уже изменённую схему БД.

  >

  > **Волна (wave)** — целое число в аннотации `argocd.argoproj.io/sync-wave`.

  > Внутри фазы меньшие числа идут раньше. Следующая волна ждёт готовности предыдущей.

  > Если Deployment волны 0 не становится Healthy, Service волны 1 может ещё не появиться.

  > Это не механизм порядка HTTP-запросов и не универсальный граф зависимостей между разными Applications.

  > При prune порядок волн обратный: сначала более высокие номера.

  > [Фазы и волны](https://argo-cd.readthedocs.io/en/stable/user-guide/sync-waves/),

  > [hooks](https://argo-cd.readthedocs.io/en/stable/user-guide/resource_hooks/).


  ### Опыт: первая полная синхронизация


  **Коротко**

  - Sync выполняет выбранную операцию

  - Успех фиксируют по результатам ресурсов

  - Порядок нужно подтверждать событиями, а не задержкой на глаз.


  **Короткий сценарий**


  PreSync завершилась, затем применились ConfigMap, Deployment и Service в своих waves.


  **Предскажи:** Что подтверждает именно порядок применения?


  > [!question]- Ответ

  > Записи операции и временные события объектов; одна финальная отметка Synced не раскрывает весь порядок.


  Сначала определяется компонент и стадия, затем проверяется указанный переход. Полный прежний материал сохранён ниже.


  > [!info]- Глубже

  > Файлы нагрузки приведены полностью в разделе «Файлы лаборатории» выше. В них PreSync Job `preflight` печатает строку,

  > ждёт три секунды и завершается с 0. ConfigMap имеет волну -1, Deployment — 0, Service — 1.

  > Namespace существует заранее: PreSync нельзя заставить ждать Namespace из более поздней фазы.

  >

  > **`sync.yaml` вне config-репозитория:**

  >

  > ```yaml

  > operation:

  >   sync:

  >     prune: false

  > ```

  >

  > ```bash

  > k -n argocd patch application guide --type merge --patch-file "$LAB/sync.yaml"

  > k -n argocd wait --for=jsonpath=''{.status.operationState.phase}''=Succeeded \

  >   application/guide --timeout=180s

  > state

  > k -n guide-gitops get job/preflight cm/web-settings deploy/web svc/web -o json |

  >   jq -r ''.items[] | [.kind, .metadata.name, .metadata.creationTimestamp] | @tsv''

  > ```

  >

  > `wait` имеет конечный timeout: если условие не выполнено, это повод смотреть причину,

  > а не считать истечение времени успехом. Timestamp — время создания, не всегда время готовности.

  > У Job нужно дополнительно смотреть `.status.completionTime`, у Deployment — условия и ready replicas.

  >

  > **Предскажи:** можно ли увидеть Service до завершения PreSync? Что произойдёт,

  > если заменить в hook `exit 0` на `exit 1`, одновременно запросив `VERSION: v3`?

  >

  > > [!question]- Ответ

  > > В этом полном sync Service волны 1 появляется после успешного PreSync и волны 0.

  > > При `exit 1` операция получила `Failed`, а live `VERSION` осталась `v1`:

  > > новая конфигурация до основной фазы не дошла. Оба сценария проверены 18.10.

  > > Job использует `backoffLimit: 0`, Application — `retry.limit: 0`, поэтому повторов здесь нет.


  ### Частые ошибки


  **Коротко**

  - Wave не заменяет готовность зависимости

  - Hook может иметь побочные эффекты

  - Неудача операции требует проверки оставшихся ресурсов.


  **Короткий сценарий**


  Hook изменил внешнюю базу и завершился ошибкой до Deployment.


  **Предскажи:** Откатил ли Argo CD внешнюю базу автоматически?


  > [!question]- Ответ

  > Нет. Такие эффекты требуют отдельного проектирования и проверки.


  Сначала определяется компонент и стадия, затем проверяется указанный переход. Полный прежний материал сохранён ниже.


  > [!info]- Глубже

  > - Считать `BeforeHookCreation` разрешением держать старый Job навсегда: перед следующим запуском он удалится.

  > - Не задавать deadline зависшему hook: операция может ждать без полезного прогресса.

  > - Путать retries Kubernetes Job и retries sync в Argo CD: это два отдельных уровня повторения.

  > - Выполнять необратимую миграцию перед выпуском несовместимого приложения без плана совместимости.

  >

  > **Задачи:** [[CICD-GitOps-Coding-Drills#Задача 11 — Waves и PreSync-хук; сломанная миграция|11 — hooks и waves]],

  > [[CICD-GitOps-Coding-Drills#Задача 15 — Health, дедлайн и зависшие ретраи|15 — зависшая операция]].

  '
