title: Uprawnienia do plików
brief: 'Usługi SignalRail nie mogą odczytać wspólnego komunikatu trasy.


  Pracuj w `~/quest` z plikami `inventory.ini`, `ansible.cfg` i `rollout.yml`. Inwentarz zawiera `app1`, `app2`
  i `app3` z portem SSH `2222`.


  **Wymagania:**

  - Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/message` zawiera `north-ready`.

  - Każdy użytkownik tych hostów może odczytać plik, tylko właściciel może go zapisać i plik nie jest wykonywalny.

  '
stages.0.brief: Wspólny komunikat trasy musi być dostępny na wszystkich hostach.
stages.0.objectives.0.text: 'Na wszystkich trzech zarządzanych hostach /srv/site/message zawiera north-ready;
  każdy użytkownik może odczytać plik, tylko właściciel może go zapisywać i plik nie jest wykonywalny.

  '
hints.0.text: Wspólna treść wymaga uprawnień dla odbiorców, nie tylko dla właściciela.
hints.1.text: 'Sprawdź zawartość plików i stat mode na zarządzanych hostach.


  Sprawdź dostarczone dane wejściowe i zakres wykonania:


  ```sh

  cat rollout.yml

  ansible fleet -i inventory.ini -m ansible.builtin.stat -a ''path=/srv/site/message''

  ```'
hints.2.text: 'Czytelny współdzielony banner potrzebuje trybu 0644, a nie 0600.


  Napraw copy mode w playbook i uruchom go na całym fleet.


  Sprawdź obserwowany wynik:


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''runuser -u nobody -- cat /srv/site/message''`
  — wypisuje `north-ready` na każdym z hostów `app1`, `app2` i `app3` jako użytkownik `nobody`, który nie jest
  właścicielem pliku.


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''runuser -u nobody -- test ! -w /srv/site/message
  -a ! -x /srv/site/message''` — zwraca `rc=0` na każdym z hostów `app1`, `app2` i `app3`: `nobody` nie może
  zapisywać pliku ani go wykonywać.'
debrief: Wiadomość miała tryb 0600. Dostarczyłeś poprawną treść w trybie 0644 i sprawdziłeś pliki zdalne.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem wynik na każdym zarządzanym hoście.
