title: Права на файл
brief: 'Вы в команде эксплуатации SignalRail. Общий файл маршрутов стал приватным. Работайте в ~/quest.
  Все изменения — только в этой песочнице.


  Входные файлы в `~/quest`: `inventory.ini`, `ansible.cfg`, `prepare.yml`, `rollout.yml`.


  В песочнице нет интернета и внешнего DNS. Используйте только выданные файлы, предварительно загруженные
  образы и приватные сервисы. Все изменения — только в этой песочнице.


  Цели первого этапа: На всех трёх узлах /srv/site/message содержит north-ready и имеет режим 0644.'
stages.0.brief: 'Содержимое north-ready, права 0644 на всех хостах.


  Результат проверки: На всех трёх узлах /srv/site/message содержит north-ready и имеет режим 0644.'
stages.0.objectives.0.text: На всех трёх узлах /srv/site/message содержит north-ready и имеет режим 0644.
hints.0.text: Проверьте содержимое и stat mode на управляемых хостах.
hints.1.text: Общему banner нужны права 0644, а не 0600.
hints.2.text: Исправьте mode у copy и примените playbook ко всему fleet.
debrief: Сообщение имело права 0600. Вы доставили нужное содержимое с 0644 и проверили удалённые файлы.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я проверил результат на каждом управляемом хосте.
