title: Права на файл
brief: 'Сервисы SignalRail не могут прочитать общее сообщение маршрута.


  Работайте в `~/quest` с файлами `inventory.ini`, `ansible.cfg` и `rollout.yml`. В inventory указаны `app1`,
  `app2` и `app3` с портом SSH `2222`.


  **Требования:**

  - На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/message` содержит `north-ready`.

  - Все пользователи этих хостов могут читать файл, только владелец может писать в него; файл не исполняемый.

  '
stages.0.brief: Общее сообщение маршрута должно быть доступно на всех хостах.
stages.0.objectives.0.text: 'На всех трёх управляемых хостах /srv/site/message содержит north-ready; файл доступен
  для чтения любому пользователю, для записи — только владельцу, и не является исполняемым.

  '
hints.0.text: Общему содержимому нужны права доступа для потребителей, а не только для владельца.
hints.1.text: 'Проверьте содержимое и stat mode на управляемых хостах.


  Изучите поставленные входные данные и область выполнения:


  ```sh

  cat rollout.yml

  ansible fleet -i inventory.ini -m ansible.builtin.stat -a ''path=/srv/site/message''

  ```'
hints.2.text: 'Общему banner нужны права 0644, а не 0600.


  Исправьте mode у copy и примените playbook ко всему fleet.


  Проверьте наблюдаемый результат:


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''runuser -u nobody -- cat /srv/site/message''`
  — выводит `north-ready` на каждом из хостов `app1`, `app2` и `app3` от имени пользователя `nobody`, не являющегося
  владельцем файла.


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''runuser -u nobody -- test ! -w /srv/site/message
  -a ! -x /srv/site/message''` — возвращает `rc=0` на каждом из хостов `app1`, `app2` и `app3`: `nobody` не
  может записывать в файл или исполнять его.'
debrief: Сообщение имело права 0600. Вы доставили нужное содержимое с 0644 и проверили удалённые файлы.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я проверил результат на каждом управляемом хосте.
