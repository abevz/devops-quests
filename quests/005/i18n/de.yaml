title: Dateiberechtigungen
brief: 'Sie sind dem Betrieb SignalRail beigetreten. Die freigegebene route-Datei wurde privat. Arbeiten
  Sie in ~/quest.. Bewahren Sie alle Änderungen in diesem Schulungsbereich auf.


  Eingänge in `~/quest`: `inventory.ini`, `ansible.cfg`, `prepare.yml`, `rollout.yml`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur die bereitgestellten Dateien,
  vorinstallierten Bilder und privaten Dienste. Alle Änderungen müssen innerhalb dieser Bucht bleiben.


  Anfängliche Erfolgskriterien: Alle drei verwalteten Hosts verfügen über /srv/site/message mit north-ready,
  Modus 0644.'
stages.0.brief: 'Die route-Nachricht muss für Dienste lesbar sein: Inhalt north-ready, Modus 0644, auf
  allen Hosts.


  Erfolgskriterien: Alle drei verwalteten Hosts verfügen über /srv/site/message mit north-ready, Modus
  0644.'
stages.0.objectives.0.text: Alle drei verwalteten Hosts haben /srv/site/message mit north-ready, Modus
  0644.
hints.0.text: Überprüfen Sie den Dateiinhalt und den stat-Modus auf den verwalteten Hosts.
hints.1.text: Ein lesbarer gemeinsamer banner benötigt den Modus 0644, nicht 0600.
hints.2.text: Korrigieren Sie den copy-Modus im playbook und führen Sie ihn im gesamten fleet aus.
debrief: Die Nachricht hatte den Modus 0600. Sie haben den korrekten Inhalt mit Modus 0644 übermittelt
  und die Remote-Dateien überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe das Ergebnis auf jedem verwalteten Host überprüft.
