title: Dateiberechtigungen
brief: 'Die Dienste von SignalRail können die gemeinsame Routennachricht nicht lesen.


  Arbeiten Sie in `~/quest` mit `inventory.ini`, `ansible.cfg` und `rollout.yml`. Das Inventar führt `app1`,
  `app2` und `app3` mit SSH-Port `2222` auf.


  **Anforderungen:**

  - Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/message` den Inhalt `north-ready`.

  - Jeder Benutzer dieser Hosts kann die Datei lesen, nur ihr Eigentümer kann sie schreiben, und sie ist nicht
  ausführbar.

  '
stages.0.brief: Die gemeinsame Routennachricht muss auf allen Hosts verfügbar sein.
stages.0.objectives.0.text: 'Auf allen drei verwalteten Hosts enthält /srv/site/message den Inhalt north-ready;
  jeder Benutzer kann die Datei lesen, nur ihr Eigentümer kann sie schreiben, und sie ist nicht ausführbar.

  '
hints.0.text: Gemeinsame Inhalte brauchen Zugriffsrechte für ihre Nutzer, nicht nur für den Eigentümer.
hints.1.text: 'Überprüfen Sie den Dateiinhalt und den stat-Modus auf den verwalteten Hosts.


  Prüfen Sie die mitgelieferten Eingaben und den Ausführungsumfang:


  ```sh

  cat rollout.yml

  ansible fleet -i inventory.ini -m ansible.builtin.stat -a ''path=/srv/site/message''

  ```'
hints.2.text: 'Ein lesbarer gemeinsamer banner benötigt den Modus 0644, nicht 0600.


  Korrigieren Sie den copy-Modus im playbook und führen Sie ihn im gesamten fleet aus.


  Prüfen Sie das beobachtete Ergebnis:


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''runuser -u nobody -- cat /srv/site/message''`
  — gibt auf jedem der Hosts `app1`, `app2` und `app3` den Wert `north-ready` als Benutzer `nobody` aus, der
  nicht Eigentümer der Datei ist.


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''runuser -u nobody -- test ! -w /srv/site/message
  -a ! -x /srv/site/message''` — liefert auf jedem der Hosts `app1`, `app2` und `app3` den Wert `rc=0`: `nobody`
  kann die Datei weder schreiben noch ausführen.'
debrief: Die Nachricht hatte den Modus 0600. Sie haben den korrekten Inhalt mit Modus 0644 übermittelt und
  die Remote-Dateien überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe das Ergebnis auf jedem verwalteten Host überprüft.
