title: Dateiberechtigungen
brief: |
  Die Dienste von SignalRail können die gemeinsame Routennachricht nicht lesen.

  Arbeiten Sie in `~/quest` mit `inventory.ini`, `ansible.cfg` und `rollout.yml`. Das Inventar führt `app1`, `app2` und `app3` mit SSH-Port `2222` auf.

  **Anforderungen:**
  - Die Nachrichtendatei erfüllt auf jedem verwalteten Host diese Bedingungen:
    - Hosts: `app1`, `app2`, `app3`.
    - Pfad: `/srv/site/message`.
    - Inhalt: `north-ready`.
    - Zugriff: Jeder Benutzer auf dem Host kann die Datei lesen, nur ihr Eigentümer kann sie schreiben, und sie ist nicht ausführbar.

  **Selbstprüfung vor Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/message'` — gibt auf jedem der Hosts `app1`, `app2` und `app3` den Wert `north-ready` als Benutzer `nobody` aus, der nicht Eigentümer der Datei ist.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- test ! -w /srv/site/message -a ! -x /srv/site/message'` — liefert auf jedem der Hosts `app1`, `app2` und `app3` den Wert `rc=0`: `nobody` kann die Datei weder schreiben noch ausführen.
stages.0.brief: |
  Die gemeinsame Routennachricht muss auf allen Hosts verfügbar sein.
stages.0.objectives.0.text: |
  Auf allen drei verwalteten Hosts enthält /srv/site/message den Inhalt north-ready; jeder Benutzer kann die Datei lesen, nur ihr Eigentümer kann sie schreiben, und sie ist nicht ausführbar.
hints.0.text: Überprüfen Sie den Dateiinhalt und den stat-Modus auf den verwalteten Hosts.
hints.1.text: Ein lesbarer gemeinsamer banner benötigt den Modus 0644, nicht 0600.
hints.2.text: Korrigieren Sie den copy-Modus im playbook und führen Sie ihn im gesamten fleet aus.
debrief: Die Nachricht hatte den Modus 0600. Sie haben den korrekten Inhalt mit Modus 0644 übermittelt
  und die Remote-Dateien überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe das Ergebnis auf jedem verwalteten Host überprüft.
