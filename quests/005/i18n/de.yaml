title: Dateiberechtigungen
brief: |
  Die Dienste von SignalRail können die gemeinsame Routennachricht nicht lesen.

  Arbeiten Sie in `~/quest` mit `inventory.ini`, `ansible.cfg`, `prepare.yml` und `rollout.yml`. Das Inventar führt `app1`, `app2` und `app3` mit SSH-Port `2222` auf.

  **Anforderungen:**
  - Die Nachrichtendatei erfüllt auf jedem verwalteten Host diese Bedingungen:
    - Hosts: `app1`, `app2`, `app3`.
    - Pfad: `/srv/site/message`.
    - Inhalt: `north-ready`.
    - Berechtigungen: `0644`.

  **Selbstprüfung vor Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'cat /srv/site/message'` — gibt auf jedem der Hosts `app1`, `app2` und `app3` den Wert `north-ready` aus.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'stat -c %a /srv/site/message'` — gibt auf jedem der Hosts `app1`, `app2` und `app3` den Wert `644` aus (Modus `0644`).
stages.0.brief: |
  Die gemeinsame Routennachricht muss auf allen Hosts verfügbar sein.
stages.0.objectives.0.text: Alle drei verwalteten Hosts haben /srv/site/message mit north-ready, Modus
  0644.
hints.0.text: Überprüfen Sie den Dateiinhalt und den stat-Modus auf den verwalteten Hosts.
hints.1.text: Ein lesbarer gemeinsamer banner benötigt den Modus 0644, nicht 0600.
hints.2.text: Korrigieren Sie den copy-Modus im playbook und führen Sie ihn im gesamten fleet aus.
debrief: Die Nachricht hatte den Modus 0600. Sie haben den korrekten Inhalt mit Modus 0644 übermittelt
  und die Remote-Dateien überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe das Ergebnis auf jedem verwalteten Host überprüft.
