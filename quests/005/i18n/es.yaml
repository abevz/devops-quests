title: Permisos de archivos
brief: |
  Los servicios de SignalRail no pueden leer el mensaje de ruta compartido.

  Trabaja en `~/quest` con `inventory.ini`, `ansible.cfg` y `rollout.yml`. El inventario incluye `app1`, `app2` y `app3` con el puerto SSH `2222`.

  **Requisitos:**
  - El archivo del mensaje cumple estas condiciones en cada host administrado:
    - Hosts: `app1`, `app2`, `app3`.
    - Ruta: `/srv/site/message`.
    - Contenido: `north-ready`.
    - Acceso: Todos los usuarios del host pueden leer el archivo, solo su propietario puede escribir en él y no es ejecutable.

  **Verifica antes de Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/message'` — imprime `north-ready` en cada uno de los hosts `app1`, `app2` y `app3` como el usuario `nobody`, que no es el propietario del archivo.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- test ! -w /srv/site/message -a ! -x /srv/site/message'` — devuelve `rc=0` en cada uno de los hosts `app1`, `app2` y `app3`: `nobody` no puede escribir en el archivo ni ejecutarlo.
stages.0.brief: |
  El mensaje de ruta compartido debe estar disponible en todos los hosts.
stages.0.objectives.0.text: |
  En los tres hosts administrados, /srv/site/message contiene north-ready; todos los usuarios pueden leer el archivo, solo su propietario puede escribir en él y no es ejecutable.
hints.0.text: Inspeccione el contenido del archivo y el modo stat en los hosts administrados.
hints.1.text: Un banner compartido legible necesita el modo 0644, no 0600.
hints.2.text: Repare el modo copy en playbook y ejecútelo en todo el fleet.
debrief: El mensaje tenía el modo 0600. Entregó el contenido correcto con el modo 0644 y verificó los
  archivos remotos.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el resultado en cada host administrado.
