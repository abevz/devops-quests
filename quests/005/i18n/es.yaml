title: Permisos de archivos
brief: 'Te uniste a las operaciones de SignalRail. El archivo route compartido se volvió privado. Trabajar
  en ~/quest. Mantenga todos los cambios dentro de esta bahía de entrenamiento.


  Entradas en `~/quest`: `inventory.ini`, `ansible.cfg`, `prepare.yml`, `rollout.yml`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente los archivos suministrados, las imágenes
  precargadas y los servicios privados. Todos los cambios deben permanecer dentro de esta bahía.


  Criterios de éxito iniciales: los tres hosts administrados tienen /srv/site/message que contiene north-ready,
  modo 0644.'
stages.0.brief: 'El mensaje route debe ser legible por los servicios: contenido north-ready, modo 0644,
  en todos los hosts.


  Criterios de éxito: los tres hosts administrados tienen /srv/site/message que contiene north-ready,
  modo 0644.'
stages.0.objectives.0.text: Los tres hosts administrados tienen /srv/site/message que contiene north-ready,
  modo 0644.
hints.0.text: Inspeccione el contenido del archivo y el modo stat en los hosts administrados.
hints.1.text: Un banner compartido legible necesita el modo 0644, no 0600.
hints.2.text: Repare el modo copy en playbook y ejecútelo en todo el fleet.
debrief: El mensaje tenía el modo 0600. Entregó el contenido correcto con el modo 0644 y verificó los
  archivos remotos.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el resultado en cada host administrado.
