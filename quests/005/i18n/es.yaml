title: Permisos de archivos
brief: 'Los servicios de SignalRail no pueden leer el mensaje de ruta compartido.


  Trabaja en `~/quest` con `inventory.ini`, `ansible.cfg` y `rollout.yml`. El inventario incluye `app1`, `app2`
  y `app3` con el puerto SSH `2222`.


  **Requisitos:**

  - En cada host gestionado (`app1`, `app2`, `app3`), `/srv/site/message` contiene `north-ready`.

  - Todos los usuarios de esos hosts pueden leer el archivo, solo su propietario puede escribirlo y no es ejecutable.

  '
stages.0.brief: El mensaje de ruta compartido debe estar disponible en todos los hosts.
stages.0.objectives.0.text: 'En los tres hosts administrados, /srv/site/message contiene north-ready; todos
  los usuarios pueden leer el archivo, solo su propietario puede escribir en él y no es ejecutable.

  '
hints.0.text: El contenido compartido necesita permisos para sus consumidores, no solo para su propietario.
hints.1.text: |-
  En `rollout.yml`, revisa el modo de `/srv/site/message` en la tarea de copia y compáralo con el actual. Usa `0644` y ejecuta el playbook sobre `fleet`.

  ```sh
  cat rollout.yml
  ansible fleet -i inventory.ini -m ansible.builtin.stat -a 'path=/srv/site/message'
  ansible fleet -i inventory.ini --list-hosts
  ```
hints.2.text: |-
  Comprueba el contenido y el acceso en los tres hosts con una cuenta distinta de la propietaria del archivo.

  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/message'` — imprime `north-ready` en cada uno de los hosts `app1`, `app2` y `app3` como el usuario `nobody`, que no es el propietario del archivo.

  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- test ! -w /srv/site/message -a ! -x /srv/site/message'` — devuelve `rc=0` en cada uno de los hosts `app1`, `app2` y `app3`: `nobody` no puede escribir en el archivo ni ejecutarlo.
debrief: El mensaje tenía el modo 0600. Entregó el contenido correcto con el modo 0644 y verificó los archivos
  remotos.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el resultado en cada host administrado.
diagnostics.copy_1: |-
  La tarea de copia de `rollout.yml` pudo aplicar otro contenido o permisos en app1, o puede faltar ejecutar allí el play corregido. [Guía](guides#guide=ansible-4&section=fleet-message-permissions)
diagnostics.copy_2: |-
  La tarea de copia de `rollout.yml` pudo aplicar otro contenido o permisos en app2, o puede faltar ejecutar allí el play corregido. [Guía](guides#guide=ansible-4&section=fleet-message-permissions)
diagnostics.copy_3: |-
  La tarea de copia de `rollout.yml` pudo aplicar otro contenido o permisos en app3, o puede faltar ejecutar allí el play corregido. [Guía](guides#guide=ansible-4&section=fleet-message-permissions)
