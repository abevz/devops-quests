title: File permissions
brief: |
  SignalRail services cannot read the shared route message.

  Work in `~/quest` with `inventory.ini`, `ansible.cfg`, `prepare.yml` and `rollout.yml`. The inventory lists `app1`, `app2` and `app3` with SSH port `2222`.

  **Requirements:**
  - The message file meets these conditions on every managed host:
    - Hosts: `app1`, `app2`, `app3`.
    - Path: `/srv/site/message`.
    - Content: `north-ready`.
    - Permissions: `0644`.

  **Verify yourself before Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'cat /srv/site/message'` — prints `north-ready` on each of `app1`, `app2` and `app3`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'stat -c %a /srv/site/message'` — prints `644` on each of `app1`, `app2` and `app3` (mode `0644`).
stages.0.brief: |
  The shared route message must be available across the fleet.
stages.0.objectives.0.text: All three managed hosts have /srv/site/message containing north-ready, mode
  0644.
hints.0.text: Inspect file content and stat mode on the managed hosts.
hints.1.text: A readable shared banner needs mode 0644, not 0600.
hints.2.text: Fix copy mode in the playbook and run it on the whole fleet.
debrief: The message had mode 0600. You delivered the correct content with mode 0644 and checked the remote
  files.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I verified the result on every managed host.
