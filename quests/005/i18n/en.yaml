title: File permissions
brief: 'You joined SignalRail operations. The shared route file became private. Work in ~/quest. Keep
  all changes inside this training bay.


  Inputs in `~/quest`: `inventory.ini`, `ansible.cfg`, `prepare.yml`, `rollout.yml`.


  The bay has no Internet or external DNS. Use only its supplied files, preloaded images and private services.
  All changes must stay inside this bay.


  Initial success criteria: All three managed hosts have /srv/site/message containing north-ready, mode
  0644.'
stages.0.brief: 'The route message must be readable by services: content north-ready, mode 0644, on all
  hosts.


  Success criteria: All three managed hosts have /srv/site/message containing north-ready, mode 0644.'
stages.0.objectives.0.text: All three managed hosts have /srv/site/message containing north-ready, mode
  0644.
hints.0.text: Inspect file content and stat mode on the managed hosts.
hints.1.text: A readable shared banner needs mode 0644, not 0600.
hints.2.text: Fix copy mode in the playbook and run it on the whole fleet.
debrief: The message had mode 0600. You delivered the correct content with mode 0644 and checked the remote
  files.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I verified the result on every managed host.
