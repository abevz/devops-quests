title: File permissions
brief: 'SignalRail services cannot read the shared route message.


  Work in `~/quest` with `inventory.ini`, `ansible.cfg` and `rollout.yml`. The inventory lists `app1`, `app2`
  and `app3` with SSH port `2222`.


  **Requirements:**

  - On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` contains `north-ready`.

  - Every user on those hosts can read the file, only its owner can write it, and it is not executable.

  '
stages.0.brief: The shared route message must be available across the fleet.
stages.0.objectives.0.text: 'On all three managed hosts, /srv/site/message contains north-ready, is readable
  by every user, writable only by its owner, and not executable.

  '
hints.0.text: Shared content needs access permissions that work for its consumers, not just its owner.
hints.1.text: 'Inspect file content and stat mode on the managed hosts.


  Inspect the supplied inputs and execution scope:


  ```sh

  cat rollout.yml

  ansible fleet -i inventory.ini -m ansible.builtin.stat -a ''path=/srv/site/message''

  ```'
hints.2.text: 'A readable shared banner needs mode 0644, not 0600.


  Fix copy mode in the playbook and run it on the whole fleet.


  Verify the observed result:


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''runuser -u nobody -- cat /srv/site/message''`
  — prints `north-ready` on each of `app1`, `app2` and `app3` as the non-owner user `nobody`.


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''runuser -u nobody -- test ! -w /srv/site/message
  -a ! -x /srv/site/message''` — returns `rc=0` on each of `app1`, `app2` and `app3`: `nobody` can neither
  write nor execute the file.'
debrief: The message had mode 0600. You delivered the correct content with mode 0644 and checked the remote
  files.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I verified the result on every managed host.
