title: Идентичность for_each
brief: |
  Расширение набора маршрутов изменило бы существующие записи. Обеспечьте требуемые маршруты, сохранив существующие идентичности.

  Работайте на рабочей станции в `~/quest` с `main.tf`, `terraform.tfvars`.

  **Требования:**
  - На workstation `~/quest/north.txt` содержит `open`; `~/quest/south.txt` содержит `held`; `~/quest/east.txt` содержит `open`.
  - Выход `routes` содержит ровно три элемента: `north` и `south` сохраняют исходные ID, а `east` имеет строковый ID.
  - Добавленный маршрут отслеживается как часть существующего управляемого набора маршрутов.
  - Подробный план не содержит ожидающих изменений инфраструктуры и завершается с кодом `0`.
debrief: Выход routes сохраняет записанные ID north и south, адрес east и файлы совпадают, а план не содержит
  изменений.
stages.0.brief: Требуемый набор маршрутов должен сохранить существующие идентичности.
hints.0.text: У каждого экземпляра цикла есть идентичность и полезные данные; проверяйте оба свойства,
  а не только число ресурсов в плане.
hints.1.text: |-
  Сравните планируемые значения и текущие provider ID с картой входных данных до расширения.

  ```sh
  cat main.tf terraform.tfvars
  tofu show -no-color
  tofu plan -input=false -no-color
  ```
hints.2.text: |-
  После расширения проверьте исходные ID, значения всех требуемых файлов и пустой план; существующие маршруты нельзя заменять.

  - `tofu output -json routes`
  - `tofu plan -input=false -detailed-exitcode -no-color`

  ```sh
  cat north.txt south.txt east.txt
  tofu output -json routes
  cat original-ids.json
  tofu plan -input=false -detailed-exitcode -no-color
  ```
phrases.0: Я использовал стабильные ключи for_each для идентичности экземпляров.
phrases.1: Я добавил новую станцию без замены существующих экземпляров.
phrases.2: Я сравнил сохранённые ID ресурсов и финальный plan.
diagnostics.condition_0: east.txt должен совпадать с open.
diagnostics.condition_1: tofu output -json routes должен завершиться успешно.
diagnostics.condition_2: current-ids.json north должен совпадать с original-ids.json north.
diagnostics.condition_3: current-ids.json south должен совпадать с original-ids.json south.
diagnostics.condition_4: routes.east type должен совпадать с string.
diagnostics.condition_5: routes length должен совпадать с 3.
diagnostics.condition_6: |-
  Управляемый набор маршрутов должен включать north.txt, south.txt и east.txt.

diagnostics.condition_7: План OpenTofu с detailed-exitcode должен завершиться с кодом 0.
diagnostics.condition_8: north.txt должен совпадать с open.
diagnostics.condition_9: south.txt должен совпадать с held.
stages.0.objectives.0.text: На workstation `~/quest/north.txt` содержит `open`; `~/quest/south.txt` содержит
  `held`; `~/quest/east.txt` содержит `open`.
stages.0.objectives.1.text: 'Выход `routes` содержит ровно три элемента: `north` и `south` сохраняют исходные
  ID, а `east` имеет строковый ID.'
stages.0.objectives.2.text: Добавленный маршрут отслеживается как часть существующего управляемого набора маршрутов.
stages.0.objectives.3.text: OpenTofu не сообщает об ожидающих изменениях инфраструктуры.
diagnostics.probe_0_2: 'Текущие данные не позволили проверить эту цель: Добавленный маршрут отслеживается как часть
  существующего управляемого набора маршрутов.'
