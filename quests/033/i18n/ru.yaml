title: Идентичность for_each
brief: 'Работайте в `~/quest`. Изучите `main.tf`, `terraform.tfvars` и `original-ids.json`: конфигурация использует ключи `for_each` как стабильные идентификаторы ресурсов, а JSON-файл хранит исходные ID north и south. Добавьте `east = "open"` в карту routes, не меняя остальные записи. Ссылка на руководство и подсказки объясняют эту конфигурацию OpenTofu.


  После применения проверьте, что `east.txt` содержит `open`, `north.txt` содержит `open`, а `south.txt` — `held`. `tofu state list` должен содержать `local_file.route["east"]`. В `tofu output -json routes` должно быть ровно три записи: north и south равны значениям в `original-ids.json`, а east является строкой. Наконец, `tofu plan -input=false -detailed-exitcode -no-color` должен завершиться с кодом 0 (изменений нет). Используйте только офлайн-песочницу.'
debrief: Выход routes сохраняет записанные ID north и south, адрес east и файлы совпадают, а план не содержит изменений.
stages.0.brief: Выход routes содержит три записи с исходными ID north/south и строковым ID east; адрес состояния east, содержимое трёх файлов и план без изменений соответствуют заданию.
stages.0.objectives.0.text: Выход routes содержит три записи с исходными ID north/south и строковым ID east; адрес состояния east, содержимое трёх файлов и план без изменений соответствуют заданию.
hints.0.text: Сначала изучите адреса state.
hints.1.text: Ключи map идентифицируют экземпляры независимо от порядка.
hints.2.text: Добавьте один ключ и сравните исходные ID после apply.
phrases.0: Я использовал стабильные ключи for_each для идентичности экземпляров.
phrases.1: Я добавил новую станцию без замены существующих экземпляров.
phrases.2: Я сравнил сохранённые ID ресурсов и финальный plan.
