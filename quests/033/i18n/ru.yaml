title: Идентичность for_each
brief: 'north и south управляются стабильными ключами for_each. В original-ids.json
  записаны provider ID. Добавьте east=open в terraform.tfvars, сохранив ключи, адреса,
  содержимое и ID двух старых маршрутов.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `main.tf`, `terraform.tfvars`,
  `original-ids.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно
  загруженные образы и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Есть три экземпляра, ID north/south сохранены, east.txt содержит
  open, plan пуст.'
debrief: Новый ключ map добавил экземпляр без сдвига существующих идентичностей.
stages.0.brief: 'Результат проверки: Есть три экземпляра, ID north/south сохранены,
  east.txt содержит open, plan пуст.'
stages.0.objectives.0.text: Есть три экземпляра, ID north/south сохранены, east.txt
  содержит open, plan пуст.
hints.0.text: Сначала изучите адреса state.
hints.1.text: Ключи map идентифицируют экземпляры независимо от порядка.
hints.2.text: Добавьте один ключ и сравните исходные ID после apply.
phrases.0: Я использовал стабильные ключи for_each для идентичности экземпляров.
phrases.1: Я добавил новую станцию без замены существующих экземпляров.
phrases.2: Я сравнил сохранённые ID ресурсов и финальный plan.
