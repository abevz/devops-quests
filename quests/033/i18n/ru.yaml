title: Идентичность for_each
brief: |
  Расширение набора маршрутов изменило бы существующие записи. Обеспечьте требуемые маршруты, сохранив существующие идентичности.

  Работайте на рабочей станции в `~/quest` с `main.tf`, `terraform.tfvars`.

  **Требования:**
  - На workstation `~/quest/north.txt` содержит `open`; `~/quest/south.txt` содержит `held`; `~/quest/east.txt` содержит `open`.
  - Выход `routes` содержит ровно три элемента: `north` и `south` сохраняют исходные ID, а `east` имеет строковый ID.
  - Добавленный маршрут отслеживается как часть существующего управляемого набора маршрутов.
  - Подробный план не содержит ожидающих изменений инфраструктуры и завершается с кодом `0`.
debrief: Выход routes сохраняет записанные ID north и south, адрес east и файлы совпадают, а план не содержит
  изменений.
stages.0.brief: Требуемый набор маршрутов должен сохранить существующие идентичности.
hints.0.text: У каждого экземпляра цикла есть идентичность и полезные данные; проверяйте оба свойства,
  а не только число ресурсов в плане.
hints.1.text: |-
  Сравните планируемые значения и текущие provider ID с картой входных данных до расширения.

  ```sh
  cat main.tf terraform.tfvars
  tofu show -no-color
  tofu plan -input=false -no-color
  ```
hints.2.text: |-
  После расширения проверьте исходные ID, значения всех требуемых файлов и пустой план; существующие маршруты нельзя заменять.

  - `tofu output -json routes`
  - `tofu plan -input=false -detailed-exitcode -no-color`

  ```sh
  cat north.txt south.txt east.txt
  tofu output -json routes
  cat original-ids.json
  tofu plan -input=false -detailed-exitcode -no-color
  ```
phrases.0: Я использовал стабильные ключи for_each для идентичности экземпляров.
phrases.1: Я добавил новую станцию без замены существующих экземпляров.
phrases.2: Я сравнил сохранённые ID ресурсов и финальный plan.
stages.0.objectives.0.text: На workstation `~/quest/north.txt` содержит `open`; `~/quest/south.txt` содержит
  `held`; `~/quest/east.txt` содержит `open`.
stages.0.objectives.1.text: 'Выход `routes` содержит ровно три элемента: `north` и `south` сохраняют исходные
  ID, а `east` имеет строковый ID.'
stages.0.objectives.2.text: Добавленный маршрут отслеживается как часть существующего управляемого набора маршрутов.
stages.0.objectives.3.text: OpenTofu не сообщает об ожидающих изменениях инфраструктуры.
diagnostics.condition_0: Запись east может отсутствовать в карте входных данных или ещё не быть применена к читаемому east.txt. [Причина и проверка](guides#guide=terraform-2&section=route-map-content)
diagnostics.condition_8: При использовании each.key как содержимого в north.txt может оказаться имя маршрута; отсутствие файла или ошибка чтения также дают отказ. [Причина и проверка](guides#guide=terraform-2&section=route-map-content)
diagnostics.condition_9: При использовании each.key как содержимого в south.txt может оказаться имя маршрута; отсутствие файла или ошибка чтения также дают отказ. [Причина и проверка](guides#guide=terraform-2&section=route-map-content)
diagnostics.condition_1: Выход routes мог ещё не быть применён, либо OpenTofu не может прочитать state или записать current-ids.json. [Причина и проверка](guides#guide=terraform-2&section=route-map-state)
diagnostics.condition_2: Изменение содержимого или имени файла может изменить ID north; нечитаемый текущий или исходный JSON также мешает сравнению. [Причина и проверка](guides#guide=terraform-2&section=route-retained-ids)
diagnostics.condition_3: Изменение содержимого или имени файла может изменить ID south; нечитаемый текущий или исходный JSON также мешает сравнению. [Причина и проверка](guides#guide=terraform-2&section=route-retained-ids)
diagnostics.condition_4: Неприменённая запись east или неверная структура выхода может оставить routes.east отсутствующим либо не строкой; нечитаемый JSON также даёт отказ. [Причина и проверка](guides#guide=terraform-2&section=route-map-state)
diagnostics.condition_5: Применённый выход может ещё не содержать маршрут или включать лишние записи; нечитаемый current-ids.json также мешает подсчёту. [Причина и проверка](guides#guide=terraform-2&section=route-map-state)
diagnostics.condition_6: Для одного из трёх файлов может отсутствовать управляемая привязка local_file к его пути, либо структура state неполна. [Причина и проверка](guides#guide=terraform-2&section=route-map-state)
diagnostics.probe_0_2: Python или его вспомогательный модуль проверки может не запуститься, либо tofu show завершится ошибкой до получения пригодного JSON состояния. [Причина и проверка](guides#guide=terraform-2&section=route-map-state)
diagnostics.condition_7: Могли остаться неприменённые изменения карты или содержимого, либо планированию мешает ошибка конфигурации, провайдера или state. [Причина и проверка](guides#guide=terraform-2&section=route-final-plan)
