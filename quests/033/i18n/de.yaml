title: Für jede Identität
brief: 'Die angeforderte Routenmenge ist nicht verfügbar.


  Arbeiten Sie auf der Workstation in `~/quest` mit `main.tf`, `terraform.tfvars`.


  **Anforderungen:**

  - Auf der Workstation: `~/quest/north.txt` enthält `open`; `~/quest/south.txt` enthält `held`; `~/quest/east.txt`
  enthält `open`.

  - Die Ausgabe `routes` hat genau drei Einträge: `north` und `south` behalten ihre ursprünglichen IDs, und
  `east` hat eine String-ID.

  - Die hinzugefügte Route wird als Teil der bestehenden verwalteten Routenmenge nachverfolgt.

  - Ein detaillierter Plan meldet keine ausstehenden Infrastrukturänderungen und endet mit Code `0`.

  '
debrief: Die routes-Ausgabe enthält weiterhin die gespeicherten north- und south-IDs, die east-Adresse und
  Dateien stimmen, und der Plan enthält keine Änderungen.
stages.0.brief: Die angeforderte Routenmenge muss die bestehenden Identitäten erhalten.
hints.0.text: Bestehende Routenidentitäten müssen beim Erweitern der Map erhalten bleiben.
hints.1.text: 'Kartenschlüssel identifizieren Instanzen unabhängig von der Reihenfolge.


  Prüfen Sie die mitgelieferten Eingaben und den aktuellen verwalteten Zustand:


  ```sh

  cat main.tf terraform.tfvars

  tofu show -no-color

  ```'
hints.2.text: |-
  Ergänze einen Schlüssel in der for_each-Map und wende an.

  Prüfen Sie das beobachtete Ergebnis:

  - `cat north.txt south.txt east.txt` — Zeigt `open`, `held`, `open` in dieser Reihenfolge.

  - `tofu output -json routes; cat original-ids.json` — Die Ausgabe hat drei Einträge; `north` und `south` stimmen mit dem Beleg überein und `east` hat eine Zeichenfolge als ID.

  - `tofu show -no-color; tofu plan -input=false -detailed-exitcode -no-color` — Enthält `east.txt`; die anschließende Planung endet mit `0` ohne Änderungen.

  Der State enthält die verwaltete Route east.txt; der Plan endet ohne Änderungen mit Code 0.
phrases.0: Ich habe stabile for_each-Schlüssel zum Beispiel für die Identität verwendet.
phrases.1: Ich habe das neue station hinzugefügt, ohne vorhandene Instanzen zu ersetzen.
phrases.2: Ich habe die erhaltene Ressource IDs und die endgültige Ressource plan verglichen.
diagnostics.condition_0: east.txt muss open entsprechen.
diagnostics.condition_1: tofu output -json routes muss erfolgreich sein.
diagnostics.condition_2: current-ids.json north muss original-ids.json north entsprechen.
diagnostics.condition_3: current-ids.json south muss original-ids.json south entsprechen.
diagnostics.condition_4: routes.east type muss string entsprechen.
diagnostics.condition_5: routes length muss 3 entsprechen.
diagnostics.condition_6: |-
  Der verwaltete Routensatz muss north.txt, south.txt und east.txt enthalten.

diagnostics.condition_7: Der OpenTofu-Plan mit detailed-exitcode muss mit Code 0 enden.
diagnostics.condition_8: north.txt muss open entsprechen.
diagnostics.condition_9: south.txt muss held entsprechen.
stages.0.objectives.0.text: 'Auf der Workstation: `~/quest/north.txt` enthält `open`; `~/quest/south.txt` enthält
  `held`; `~/quest/east.txt` enthält `open`.'
stages.0.objectives.1.text: 'Die Ausgabe `routes` hat genau drei Einträge: `north` und `south` behalten ihre
  ursprünglichen IDs, und `east` hat eine String-ID.'
stages.0.objectives.2.text: Die hinzugefügte Route wird als Teil der bestehenden verwalteten Routenmenge nachverfolgt.
stages.0.objectives.3.text: OpenTofu meldet keine ausstehenden Infrastrukturänderungen.
diagnostics.probe_0_2: 'Mit den aktuellen Eingaben konnte dieses Ziel nicht geprüft werden: Die hinzugefügte Route
  wird als Teil der bestehenden verwalteten Routenmenge nachverfolgt.'
