title: Für jede Identität
brief: 'Arbeite in `~/quest`. Lies `main.tf`, `terraform.tfvars` und `original-ids.json`: Die Konfiguration verwendet `for_each`-Schlüssel
  als stabile Ressourcenidentitäten; die JSON-Datei speichert die ursprünglichen IDs von north und south. Füge `east = "open"`
  zur routes-Map hinzu, ohne die anderen Einträge zu ändern. Die verlinkte Anleitung und die Hinweise erläutern diese OpenTofu-Konfiguration.


  Prüfe nach dem Anwenden, dass `east.txt` `open`, `north.txt` `open` und `south.txt` `held` enthalten. `tofu state list`
  muss `local_file.route["east"]` enthalten. `tofu output -json routes` muss genau drei Einträge enthalten: north und south
  entsprechen den Werten in `original-ids.json`, und east ist eine Zeichenfolge. Zum Schluss muss `tofu plan -input=false
  -detailed-exitcode -no-color` mit Code 0 enden (keine Änderungen). Nutze nur die Offline-Umgebung.'
debrief: Die routes-Ausgabe enthält weiterhin die gespeicherten north- und south-IDs, die east-Adresse und Dateien stimmen,
  und der Plan enthält keine Änderungen.
stages.0.brief: Die routes-Ausgabe enthält drei Einträge mit den ursprünglichen north/south-IDs und einer Zeichenfolge als
  east-ID; Zustandsadresse, drei Dateiinhalte und Plan ohne Änderungen stimmen mit der Aufgabe überein.
stages.0.objectives.0.text: Die routes-Ausgabe enthält drei Einträge mit den ursprünglichen north/south-IDs und einer Zeichenfolge
  als east-ID; Zustandsadresse, drei Dateiinhalte und Plan ohne Änderungen stimmen mit der Aufgabe überein.
hints.0.text: Überprüfen Sie zunächst die Staatsadressen.
hints.1.text: Kartenschlüssel identifizieren Instanzen unabhängig von der Reihenfolge.
hints.2.text: Fügen Sie einen Schlüssel hinzu und vergleichen Sie die ursprüngliche ID-Karte nach apply.
phrases.0: Ich habe stabile for_each-Schlüssel zum Beispiel für die Identität verwendet.
phrases.1: Ich habe das neue station hinzugefügt, ohne vorhandene Instanzen zu ersetzen.
phrases.2: Ich habe die erhaltene Ressource IDs und die endgültige Ressource plan verglichen.
diagnostics.condition_0: east.txt muss open entsprechen.
diagnostics.condition_1: tofu output -json routes muss erfolgreich sein.
diagnostics.condition_2: current-ids.json north muss original-ids.json north entsprechen.
diagnostics.condition_3: current-ids.json south muss original-ids.json south entsprechen.
diagnostics.condition_4: routes.east type muss string entsprechen.
diagnostics.condition_5: routes length muss 3 entsprechen.
diagnostics.condition_6: tofu state list muss local_file.route["east"] enthalten.
diagnostics.condition_7: Der OpenTofu-Plan mit detailed-exitcode muss mit Code 0 enden.
diagnostics.condition_8: north.txt muss open entsprechen.
diagnostics.condition_9: south.txt muss held entsprechen.
