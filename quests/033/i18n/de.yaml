title: Für jede Identität
brief: |
  Die Erweiterung der Routenmenge würde bestehende Einträge ändern. Liefere die angeforderten Routen und erhalte die bestehenden Identitäten.

  Arbeiten Sie auf der Workstation in `~/quest` mit `main.tf`, `terraform.tfvars`.

  **Anforderungen:**
  - Auf der Workstation: `~/quest/north.txt` enthält `open`; `~/quest/south.txt` enthält `held`; `~/quest/east.txt` enthält `open`.
  - Die Ausgabe `routes` hat genau drei Einträge: `north` und `south` behalten ihre ursprünglichen IDs, und `east` hat eine String-ID.
  - Die hinzugefügte Route wird als Teil der bestehenden verwalteten Routenmenge nachverfolgt.
  - Ein detaillierter Plan meldet keine ausstehenden Infrastrukturänderungen und endet mit Code `0`.
debrief: Die routes-Ausgabe enthält weiterhin die gespeicherten north- und south-IDs, die east-Adresse und
  Dateien stimmen, und der Plan enthält keine Änderungen.
stages.0.brief: Die angeforderte Routenmenge muss die bestehenden Identitäten erhalten.
hints.0.text: Jede Schleifeninstanz hat eine Identität und Nutzdaten; prüfe beides statt nur die Ressourcenzahl
  des Plans.
hints.1.text: |-
  Vergleiche geplante Werte und aktuelle Provider-IDs mit der Eingabemap, bevor du eine Erweiterung akzeptierst.

  ```sh
  cat main.tf terraform.tfvars
  tofu show -no-color
  tofu plan -input=false -no-color
  ```
hints.2.text: |-
  Prüfe nach der Erweiterung die ursprünglichen IDs, alle angeforderten Dateiinhalte und einen leeren Plan; bestehende Routen dürfen nicht ersetzt werden.

  - `tofu output -json routes`
  - `tofu plan -input=false -detailed-exitcode -no-color`

  ```sh
  cat north.txt south.txt east.txt
  tofu output -json routes
  cat original-ids.json
  tofu plan -input=false -detailed-exitcode -no-color
  ```
phrases.0: Ich habe stabile for_each-Schlüssel zum Beispiel für die Identität verwendet.
phrases.1: Ich habe das neue station hinzugefügt, ohne vorhandene Instanzen zu ersetzen.
phrases.2: Ich habe die erhaltene Ressource IDs und die endgültige Ressource plan verglichen.
diagnostics.condition_0: east.txt muss open entsprechen.
diagnostics.condition_1: tofu output -json routes muss erfolgreich sein.
diagnostics.condition_2: current-ids.json north muss original-ids.json north entsprechen.
diagnostics.condition_3: current-ids.json south muss original-ids.json south entsprechen.
diagnostics.condition_4: routes.east type muss string entsprechen.
diagnostics.condition_5: routes length muss 3 entsprechen.
diagnostics.condition_6: |-
  Der verwaltete Routensatz muss north.txt, south.txt und east.txt enthalten.

diagnostics.condition_7: Der OpenTofu-Plan mit detailed-exitcode muss mit Code 0 enden.
diagnostics.condition_8: north.txt muss open entsprechen.
diagnostics.condition_9: south.txt muss held entsprechen.
