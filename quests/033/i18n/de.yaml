title: Für jede Identität
brief: 'north und south werden über stabile for_each-Schlüssel verwaltet. original-ids.json zeichnet ihren
  provider IDs auf. Fügen Sie east=open in terraform.tfvars hinzu und behalten Sie dabei sowohl die vorhandenen
  Schlüssel, Adressen, Inhalte als auch IDs bei.


  Questdateien in `~/quest` (einige erscheinen in späteren Phasen): `main.tf`, `terraform.tfvars`, `original-ids.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Anfängliche Erfolgskriterien: Drei Instanzen sind vorhanden, north/south IDs sind unverändert, east.txt
  enthält open und plan ist leer.'
debrief: Der neue Schlüssel map fügte eine Instanz hinzu, ohne bestehende Identitäten zu verschieben.
stages.0.brief: 'Erfolgskriterien: Drei Instanzen sind vorhanden, north/south IDs sind unverändert, east.txt
  enthält open und plan ist leer.'
stages.0.objectives.0.text: 'Es sind drei Instanzen vorhanden: north/south IDs sind unverändert, east.txt
