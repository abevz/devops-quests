title: Für jede Identität
brief: |
  Die angeforderte Routenmenge ist nicht verfügbar.

  Arbeite auf der Workstation in `~/quest` mit `main.tf`, `terraform.tfvars`, `original-ids.json`.

  **Anforderungen:**
  - Dateien auf der Workstation:
    - `~/quest/north.txt`: `open`.
    - `~/quest/south.txt`: `held`.
    - `~/quest/east.txt`: `open`.
  - Root-Ausgaben:
    - Ausgabename: `routes`.
    - Einträge (genau drei): `north`, `south`, `east`.
    - Die IDs `north` und `south` stimmen mit `~/quest/original-ids.json` auf der Workstation überein; `east` ist eine Zeichenfolge.
  - OpenTofu-State:
    - Erforderliche Adressen: `local_file.route["east"]`.
  - Infrastrukturkonvergenz:
    - Keine ausstehenden Infrastrukturänderungen; Exit-Code des detaillierten Plans `0`.

  **Selbstprüfung vor Check & finish:**
  - `cat north.txt south.txt east.txt` — Zeigt `open`, `held`, `open` in dieser Reihenfolge.
  - `tofu output -json routes; cat original-ids.json` — Die Ausgabe hat drei Einträge; `north` und `south` stimmen mit dem Beleg überein und `east` hat eine Zeichenfolge als ID.
  - `tofu show -no-color; tofu plan -input=false -detailed-exitcode -no-color` — Enthält `local_file.route["east"]`; die anschließende Planung endet mit `0` ohne Änderungen.
debrief: Die routes-Ausgabe enthält weiterhin die gespeicherten north- und south-IDs, die east-Adresse und Dateien
  stimmen, und der Plan enthält keine Änderungen.
stages.0.brief: Die angeforderte Routenmenge muss die bestehenden Identitäten erhalten.
hints.0.text: Bestehende Routenidentitäten müssen beim Erweitern der Map erhalten bleiben.
hints.1.text: Kartenschlüssel identifizieren Instanzen unabhängig von der Reihenfolge.
hints.2.text: Ergänze einen Schlüssel in der for_each-Map und wende an.
phrases.0: Ich habe stabile for_each-Schlüssel zum Beispiel für die Identität verwendet.
phrases.1: Ich habe das neue station hinzugefügt, ohne vorhandene Instanzen zu ersetzen.
phrases.2: Ich habe die erhaltene Ressource IDs und die endgültige Ressource plan verglichen.
diagnostics.condition_0: east.txt muss open entsprechen.
diagnostics.condition_1: tofu output -json routes muss erfolgreich sein.
diagnostics.condition_2: current-ids.json north muss original-ids.json north entsprechen.
diagnostics.condition_3: current-ids.json south muss original-ids.json south entsprechen.
diagnostics.condition_4: routes.east type muss string entsprechen.
diagnostics.condition_5: routes length muss 3 entsprechen.
diagnostics.condition_6: tofu state list muss local_file.route["east"] enthalten.
diagnostics.condition_7: Der OpenTofu-Plan mit detailed-exitcode muss mit Code 0 enden.
diagnostics.condition_8: north.txt muss open entsprechen.
diagnostics.condition_9: south.txt muss held entsprechen.
stages.0.objectives.0.text: 'Auf der Workstation: `north.txt` enthält `open`; `south.txt` enthält `held`; `east.txt`
  enthält `open`.'
stages.0.objectives.1.text: 'Die Ausgabe `routes` hat genau drei Einträge: `north` und `south` stimmen mit `original-ids.json`
  auf der Workstation überein, und `east` hat eine Zeichenfolge als ID.'
stages.0.objectives.2.text: Der OpenTofu-State enthält `local_file.route["east"]`.
stages.0.objectives.3.text: OpenTofu meldet keine ausstehenden Infrastrukturänderungen.
