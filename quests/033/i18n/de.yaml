title: Für jede Identität
brief: |
  Die Erweiterung der Routenmenge würde bestehende Einträge ändern. Liefere die angeforderten Routen und erhalte die bestehenden Identitäten.

  Arbeiten Sie auf der Workstation in `~/quest` mit `main.tf`, `terraform.tfvars`.

  **Anforderungen:**
  - Auf der Workstation: `~/quest/north.txt` enthält `open`; `~/quest/south.txt` enthält `held`; `~/quest/east.txt` enthält `open`.
  - Die Ausgabe `routes` hat genau drei Einträge: `north` und `south` behalten ihre ursprünglichen IDs, und `east` hat eine String-ID.
  - Die hinzugefügte Route wird als Teil der bestehenden verwalteten Routenmenge nachverfolgt.
  - Ein detaillierter Plan meldet keine ausstehenden Infrastrukturänderungen und endet mit Code `0`.
debrief: Die routes-Ausgabe enthält weiterhin die gespeicherten north- und south-IDs, die east-Adresse und
  Dateien stimmen, und der Plan enthält keine Änderungen.
stages.0.brief: Die angeforderte Routenmenge muss die bestehenden Identitäten erhalten.
hints.0.text: Jede Schleifeninstanz hat eine Identität und Nutzdaten; prüfe beides statt nur die Ressourcenzahl
  des Plans.
hints.1.text: |-
  Vergleiche geplante Werte und aktuelle Provider-IDs mit der Eingabemap, bevor du eine Erweiterung akzeptierst.

  ```sh
  cat main.tf terraform.tfvars
  tofu show -no-color
  tofu plan -input=false -no-color
  ```
hints.2.text: |-
  Prüfe nach der Erweiterung die ursprünglichen IDs, alle angeforderten Dateiinhalte und einen leeren Plan; bestehende Routen dürfen nicht ersetzt werden.

  - `tofu output -json routes`
  - `tofu plan -input=false -detailed-exitcode -no-color`

  ```sh
  cat north.txt south.txt east.txt
  tofu output -json routes
  cat original-ids.json
  tofu plan -input=false -detailed-exitcode -no-color
  ```
phrases.0: Ich habe stabile for_each-Schlüssel zum Beispiel für die Identität verwendet.
phrases.1: Ich habe das neue station hinzugefügt, ohne vorhandene Instanzen zu ersetzen.
phrases.2: Ich habe die erhaltene Ressource IDs und die endgültige Ressource plan verglichen.
stages.0.objectives.0.text: 'Auf der Workstation: `~/quest/north.txt` enthält `open`; `~/quest/south.txt` enthält
  `held`; `~/quest/east.txt` enthält `open`.'
stages.0.objectives.1.text: 'Die Ausgabe `routes` hat genau drei Einträge: `north` und `south` behalten ihre
  ursprünglichen IDs, und `east` hat eine String-ID.'
stages.0.objectives.2.text: Die hinzugefügte Route wird als Teil der bestehenden verwalteten Routenmenge nachverfolgt.
stages.0.objectives.3.text: OpenTofu meldet keine ausstehenden Infrastrukturänderungen.
diagnostics.condition_0: Der Eintrag east kann in der Eingabemap fehlen oder noch nicht auf eine lesbare east.txt angewendet sein. [Ursache und Prüfung](guides#guide=terraform-2&section=route-map-content)
diagnostics.condition_8: each.key als Inhalt kann den Routennamen in north.txt schreiben; eine fehlende oder unlesbare Datei führt ebenfalls zum Fehler. [Ursache und Prüfung](guides#guide=terraform-2&section=route-map-content)
diagnostics.condition_9: each.key als Inhalt kann den Routennamen in south.txt schreiben; eine fehlende oder unlesbare Datei führt ebenfalls zum Fehler. [Ursache und Prüfung](guides#guide=terraform-2&section=route-map-content)
diagnostics.condition_1: Der Output routes wurde möglicherweise noch nicht angewendet, oder OpenTofu kann State nicht lesen beziehungsweise current-ids.json nicht schreiben. [Ursache und Prüfung](guides#guide=terraform-2&section=route-map-state)
diagnostics.condition_2: Geänderter Inhalt oder Dateiname kann die ID von north ändern; auch unlesbares aktuelles oder ursprüngliches JSON verhindert den Vergleich. [Ursache und Prüfung](guides#guide=terraform-2&section=route-retained-ids)
diagnostics.condition_3: Geänderter Inhalt oder Dateiname kann die ID von south ändern; auch unlesbares aktuelles oder ursprüngliches JSON verhindert den Vergleich. [Ursache und Prüfung](guides#guide=terraform-2&section=route-retained-ids)
diagnostics.condition_4: Ein nicht angewendeter east-Eintrag oder falscher Output-Aufbau kann routes.east fehlen lassen oder einen anderen Typ liefern; unlesbares JSON scheitert ebenfalls. [Ursache und Prüfung](guides#guide=terraform-2&section=route-map-state)
diagnostics.condition_5: Der angewendete Output kann noch eine Route auslassen oder zusätzliche Einträge enthalten; unlesbares current-ids.json verhindert auch das Zählen. [Ursache und Prüfung](guides#guide=terraform-2&section=route-map-state)
diagnostics.condition_6: Für eine der drei Dateien kann eine verwaltete local_file-Bindung zu ihrem Pfad fehlen, oder die State-Struktur ist unvollständig. [Ursache und Prüfung](guides#guide=terraform-2&section=route-map-state)
diagnostics.probe_0_2: Python oder das Prüfmodul startet möglicherweise nicht, oder tofu show scheitert vor der Ausgabe nutzbaren State-JSONs. [Ursache und Prüfung](guides#guide=terraform-2&section=route-map-state)
diagnostics.condition_7: Map- oder Inhaltsänderungen können noch ausstehen, oder ein Konfigurations-, Provider- oder State-Fehler verhindert die Planung. [Ursache und Prüfung](guides#guide=terraform-2&section=route-final-plan)
