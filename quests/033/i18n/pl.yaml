title: Dla każdej tożsamości
brief: |
  Rozszerzenie zestawu tras zmieniłoby istniejące rekordy. Dostarcz żądane trasy, zachowując istniejące tożsamości.

  Pracuj na stacji roboczej w `~/quest` z `main.tf`, `terraform.tfvars`.

  **Wymagania:**
  - Na workstation `~/quest/north.txt` zawiera `open`; `~/quest/south.txt` zawiera `held`; `~/quest/east.txt` zawiera `open`.
  - Wynik `routes` zawiera dokładnie trzy wpisy: `north` i `south` zachowują oryginalne ID, a `east` ma ID typu string.
  - Dodana trasa jest śledzona jako część istniejącego zarządzanego zestawu tras.
  - Szczegółowy plan nie zawiera oczekujących zmian infrastruktury i kończy się kodem `0`.
debrief: Wyjście routes zachowuje zapisane ID north i south, adres east i pliki są poprawne, a plan nie zawiera
  zmian.
stages.0.brief: Wymagany zestaw tras musi zachować istniejące tożsamości.
hints.0.text: Każda instancja pętli ma tożsamość i dane; sprawdź oba elementy, a nie tylko liczbę zasobów
  w planie.
hints.1.text: |-
  Porównaj wartości planu i bieżące ID dostawcy z mapą wejściową przed zaakceptowaniem rozszerzenia.

  ```sh
  cat main.tf terraform.tfvars
  tofu show -no-color
  tofu plan -input=false -no-color
  ```
hints.2.text: |-
  Po rozszerzeniu sprawdź pierwotne ID, wszystkie żądane wartości plików i pusty plan; istniejących tras nie wolno zastępować.

  - `tofu output -json routes`
  - `tofu plan -input=false -detailed-exitcode -no-color`

  ```sh
  cat north.txt south.txt east.txt
  tofu output -json routes
  cat original-ids.json
  tofu plan -input=false -detailed-exitcode -no-color
  ```
phrases.0: Użyłem stabilnych kluczy for_each na przykład tożsamości.
phrases.1: Dodałem nową station bez zastępowania istniejących instancji.
phrases.2: Porównałem zachowany zasób IDs i ostateczny plan.
diagnostics.condition_0: east.txt musi być równe open.
diagnostics.condition_1: tofu output -json routes musi się powieść.
diagnostics.condition_2: current-ids.json north musi być równe original-ids.json north.
diagnostics.condition_3: current-ids.json south musi być równe original-ids.json south.
diagnostics.condition_4: routes.east type musi być równe string.
diagnostics.condition_5: routes length musi być równe 3.
diagnostics.condition_6: |-
  Zarządzany zestaw tras musi obejmować north.txt, south.txt i east.txt.

diagnostics.condition_7: Plan OpenTofu z detailed-exitcode musi zakończyć się kodem 0.
diagnostics.condition_8: north.txt musi być równe open.
diagnostics.condition_9: south.txt musi być równe held.
stages.0.objectives.0.text: Na workstation `~/quest/north.txt` zawiera `open`; `~/quest/south.txt` zawiera
  `held`; `~/quest/east.txt` zawiera `open`.
stages.0.objectives.1.text: 'Wynik `routes` zawiera dokładnie trzy wpisy: `north` i `south` zachowują oryginalne
  ID, a `east` ma ID typu string.'
stages.0.objectives.2.text: Dodana trasa jest śledzona jako część istniejącego zarządzanego zestawu tras.
stages.0.objectives.3.text: OpenTofu nie zgłasza oczekujących zmian infrastruktury.
diagnostics.probe_0_2: 'Bieżące dane nie pozwalają potwierdzić tego celu: Dodana trasa jest śledzona jako część
  istniejącego zarządzanego zestawu tras.'
