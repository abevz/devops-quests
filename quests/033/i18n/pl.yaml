title: Dla każdej tożsamości
brief: |
  Wymagany zestaw tras jest niedostępny.

  Pracuj na workstation w `~/quest` z plikami `main.tf`, `terraform.tfvars`, `original-ids.json`.

  **Wymagania:**
  - Pliki na workstation:
    - `~/quest/north.txt`: `open`.
    - `~/quest/south.txt`: `held`.
    - `~/quest/east.txt`: `open`.
  - Wyjścia główne:
    - Nazwa wyjścia: `routes`.
    - Wpisy (dokładnie trzy): `north`, `south`, `east`.
    - ID `north` i `south` są zgodne z `~/quest/original-ids.json` na workstation; `east` jest ciągiem znaków.
  - Stan OpenTofu:
    - Wymagane adresy: `local_file.route["east"]`.
  - Zbieżność infrastruktury:
    - Brak oczekujących zmian infrastruktury; kod zakończenia szczegółowego planu `0`.

  **Sprawdź przed Check & finish:**
  - `cat north.txt south.txt east.txt` — Pokazuje `open`, `held`, `open` w tej kolejności.
  - `tofu output -json routes; cat original-ids.json` — Wyjście ma trzy wpisy; `north` i `south` są zgodne z potwierdzeniem, a ID `east` jest ciągiem znaków.
  - `tofu show -no-color; tofu plan -input=false -detailed-exitcode -no-color` — Zawiera `local_file.route["east"]`; następnie plan kończy się kodem `0` bez zmian.
debrief: Wyjście routes zachowuje zapisane ID north i south, adres east i pliki są poprawne, a plan nie zawiera
  zmian.
stages.0.brief: Wymagany zestaw tras musi zachować istniejące tożsamości.
hints.0.text: Istniejące tożsamości tras muszą przetrwać rozszerzenie mapy.
hints.1.text: Klucze mapy identyfikują instancje niezależnie od kolejności.
hints.2.text: Dodaj jeden klucz do mapy for_each i zastosuj.
phrases.0: Użyłem stabilnych kluczy for_each na przykład tożsamości.
phrases.1: Dodałem nową station bez zastępowania istniejących instancji.
phrases.2: Porównałem zachowany zasób IDs i ostateczny plan.
diagnostics.condition_0: east.txt musi być równe open.
diagnostics.condition_1: tofu output -json routes musi się powieść.
diagnostics.condition_2: current-ids.json north musi być równe original-ids.json north.
diagnostics.condition_3: current-ids.json south musi być równe original-ids.json south.
diagnostics.condition_4: routes.east type musi być równe string.
diagnostics.condition_5: routes length musi być równe 3.
diagnostics.condition_6: tofu state list musi zawierać local_file.route["east"].
diagnostics.condition_7: Plan OpenTofu z detailed-exitcode musi zakończyć się kodem 0.
diagnostics.condition_8: north.txt musi być równe open.
diagnostics.condition_9: south.txt musi być równe held.
stages.0.objectives.0.text: Na workstation `north.txt` zawiera `open`; `south.txt` zawiera `held`; `east.txt` zawiera
  `open`.
stages.0.objectives.1.text: 'Wyjście `routes` ma dokładnie trzy wpisy: `north` i `south` są zgodne z `original-ids.json`
  na workstation, a ID `east` jest ciągiem znaków.'
stages.0.objectives.2.text: Stan OpenTofu zawiera `local_file.route["east"]`.
stages.0.objectives.3.text: OpenTofu nie zgłasza oczekujących zmian infrastruktury.
