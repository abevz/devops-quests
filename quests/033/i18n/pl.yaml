title: Dla każdej tożsamości
brief: 'Pracuj w `~/quest`. Przeczytaj `main.tf`, `terraform.tfvars` i `original-ids.json`: konfiguracja używa kluczy `for_each`
  jako stabilnych tożsamości zasobów, a plik JSON zapisuje pierwotne ID north i south. Dodaj `east = "open"` do mapy routes
  bez zmiany pozostałych wpisów. Połączony przewodnik i podpowiedzi przedstawiają tę konfigurację OpenTofu.


  Po zastosowaniu sprawdź, czy `east.txt` zawiera `open`, `north.txt` zawiera `open`, a `south.txt` zawiera `held`. `tofu
  state list` musi zawierać `local_file.route["east"]`. `tofu output -json routes` musi zawierać dokładnie trzy wpisy: north
  i south zgodne z wartościami w `original-ids.json` oraz east będący ciągiem znaków. Na koniec `tofu plan -input=false -detailed-exitcode
  -no-color` musi zwrócić kod 0 (brak zmian). Korzystaj tylko z zatoki offline.'
debrief: Wyjście routes zachowuje zapisane ID north i south, adres east i pliki są poprawne, a plan nie zawiera zmian.
stages.0.brief: Wyjście routes ma trzy wpisy z pierwotnymi ID north/south i tekstowym ID east; adres stanu east, zawartość
  trzech plików i plan bez zmian są zgodne z opisem.
stages.0.objectives.0.text: Wyjście routes ma trzy wpisy z pierwotnymi ID north/south i tekstowym ID east; adres stanu east,
  zawartość trzech plików i plan bez zmian są zgodne z opisem.
hints.0.text: Najpierw sprawdź adresy state.
hints.1.text: Klucze mapy identyfikują instancje niezależnie od kolejności.
hints.2.text: Dodaj jeden klucz i porównaj oryginalną mapę ID po apply.
phrases.0: Użyłem stabilnych kluczy for_each na przykład tożsamości.
phrases.1: Dodałem nową station bez zastępowania istniejących instancji.
phrases.2: Porównałem zachowany zasób IDs i ostateczny plan.
diagnostics.condition_0: east.txt musi być równe open.
diagnostics.condition_1: tofu output -json routes musi się powieść.
diagnostics.condition_2: current-ids.json north musi być równe original-ids.json north.
diagnostics.condition_3: current-ids.json south musi być równe original-ids.json south.
diagnostics.condition_4: routes.east type musi być równe string.
diagnostics.condition_5: routes length musi być równe 3.
diagnostics.condition_6: tofu state list musi zawierać local_file.route["east"].
diagnostics.condition_7: Plan OpenTofu z detailed-exitcode musi zakończyć się kodem 0.
diagnostics.condition_8: north.txt musi być równe open.
diagnostics.condition_9: south.txt musi być równe held.
