title: Dla każdej tożsamości
brief: |
  Rozszerzenie zestawu tras zmieniłoby istniejące rekordy. Dostarcz żądane trasy, zachowując istniejące tożsamości.

  Pracuj na stacji roboczej w `~/quest` z `main.tf`, `terraform.tfvars`.

  **Wymagania:**
  - Na workstation `~/quest/north.txt` zawiera `open`; `~/quest/south.txt` zawiera `held`; `~/quest/east.txt` zawiera `open`.
  - Wynik `routes` zawiera dokładnie trzy wpisy: `north` i `south` zachowują oryginalne ID, a `east` ma ID typu string.
  - Dodana trasa jest śledzona jako część istniejącego zarządzanego zestawu tras.
  - Szczegółowy plan nie zawiera oczekujących zmian infrastruktury i kończy się kodem `0`.
debrief: Wyjście routes zachowuje zapisane ID north i south, adres east i pliki są poprawne, a plan nie zawiera
  zmian.
stages.0.brief: Wymagany zestaw tras musi zachować istniejące tożsamości.
hints.0.text: Każda instancja pętli ma tożsamość i dane; sprawdź oba elementy, a nie tylko liczbę zasobów
  w planie.
hints.1.text: |-
  Porównaj wartości planu i bieżące ID dostawcy z mapą wejściową przed zaakceptowaniem rozszerzenia.

  ```sh
  cat main.tf terraform.tfvars
  tofu show -no-color
  tofu plan -input=false -no-color
  ```
hints.2.text: |-
  Po rozszerzeniu sprawdź pierwotne ID, wszystkie żądane wartości plików i pusty plan; istniejących tras nie wolno zastępować.

  - `tofu output -json routes`
  - `tofu plan -input=false -detailed-exitcode -no-color`

  ```sh
  cat north.txt south.txt east.txt
  tofu output -json routes
  cat original-ids.json
  tofu plan -input=false -detailed-exitcode -no-color
  ```
phrases.0: Użyłem stabilnych kluczy for_each na przykład tożsamości.
phrases.1: Dodałem nową station bez zastępowania istniejących instancji.
phrases.2: Porównałem zachowany zasób IDs i ostateczny plan.
stages.0.objectives.0.text: Na workstation `~/quest/north.txt` zawiera `open`; `~/quest/south.txt` zawiera
  `held`; `~/quest/east.txt` zawiera `open`.
stages.0.objectives.1.text: 'Wynik `routes` zawiera dokładnie trzy wpisy: `north` i `south` zachowują oryginalne
  ID, a `east` ma ID typu string.'
stages.0.objectives.2.text: Dodana trasa jest śledzona jako część istniejącego zarządzanego zestawu tras.
stages.0.objectives.3.text: OpenTofu nie zgłasza oczekujących zmian infrastruktury.
diagnostics.condition_0: Wpis east może nie istnieć w mapie wejściowej lub nie być zastosowany do czytelnego east.txt. [Przyczyna i kontrola](guides#guide=terraform-2&section=route-map-content)
diagnostics.condition_8: Użycie each.key jako treści może zapisać nazwę trasy w north.txt; brak pliku lub błąd odczytu też powoduje niepowodzenie. [Przyczyna i kontrola](guides#guide=terraform-2&section=route-map-content)
diagnostics.condition_9: Użycie each.key jako treści może zapisać nazwę trasy w south.txt; brak pliku lub błąd odczytu też powoduje niepowodzenie. [Przyczyna i kontrola](guides#guide=terraform-2&section=route-map-content)
diagnostics.condition_1: Wynik routes mógł nie zostać zastosowany albo OpenTofu nie może odczytać stanu lub zapisać current-ids.json. [Przyczyna i kontrola](guides#guide=terraform-2&section=route-map-state)
diagnostics.condition_2: Zmiana treści lub nazwy pliku może zmienić ID north; nieczytelny bieżący lub oryginalny JSON też blokuje porównanie. [Przyczyna i kontrola](guides#guide=terraform-2&section=route-retained-ids)
diagnostics.condition_3: Zmiana treści lub nazwy pliku może zmienić ID south; nieczytelny bieżący lub oryginalny JSON też blokuje porównanie. [Przyczyna i kontrola](guides#guide=terraform-2&section=route-retained-ids)
diagnostics.condition_4: Niezastosowany wpis east lub zła struktura wyniku może pozostawić brakujące albo niestringowe routes.east; nieczytelny JSON też zawodzi. [Przyczyna i kontrola](guides#guide=terraform-2&section=route-map-state)
diagnostics.condition_5: Zastosowany wynik może nadal pomijać trasę lub zawierać dodatkowe wpisy; nieczytelny current-ids.json też blokuje liczenie. [Przyczyna i kontrola](guides#guide=terraform-2&section=route-map-state)
diagnostics.condition_6: Jeden z trzech plików może nie mieć zarządzanego powiązania local_file ze swoją ścieżką albo struktura stanu jest niepełna. [Przyczyna i kontrola](guides#guide=terraform-2&section=route-map-state)
diagnostics.probe_0_2: Python lub moduł pomocniczy może się nie uruchomić albo tofu show zawiedzie przed zwróceniem poprawnego JSON stanu. [Przyczyna i kontrola](guides#guide=terraform-2&section=route-map-state)
diagnostics.condition_7: Mogły pozostać niezastosowane zmiany mapy lub treści albo błąd konfiguracji, dostawcy lub stanu uniemożliwia planowanie. [Przyczyna i kontrola](guides#guide=terraform-2&section=route-final-plan)
