title: Dla każdej tożsamości
brief: 'north i south są zarządzane poprzez stabilne klucze for_each. original-ids.json rejestruje swojego
  dostawcę IDs. Dodaj east=open do terraform.tfvars, zachowując zarówno istniejące klucze, adresy, zawartość,
  jak i IDs.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `main.tf`, `terraform.tfvars`,
  `original-ids.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: istnieją trzy instancje, północ/południe IDs pozostają niezmienione, east.txt
  zawiera open, a plan jest pusty.'
debrief: Nowy klucz map dodał jedną instancję bez zmiany istniejących tożsamości.
stages.0.brief: 'Kryteria sukcesu: Istnieją trzy instancje, północ/południe IDs pozostają niezmienione,
  east.txt zawiera open, a plan jest puste.'
stages.0.objectives.0.text: Istnieją trzy instancje, północ/południe IDs pozostają niezmienione, east.txt
  zawiera open, a plan jest pusty.
hints.0.text: Najpierw sprawdź adresy state.
hints.1.text: Klucze mapy identyfikują instancje niezależnie od kolejności.
hints.2.text: Dodaj jeden klucz i porównaj oryginalną mapę ID po apply.
phrases.0: Użyłem stabilnych kluczy for_each na przykład tożsamości.
phrases.1: Dodałem nową station bez zastępowania istniejących instancji.
phrases.2: Porównałem zachowany zasób IDs i ostateczny plan.
