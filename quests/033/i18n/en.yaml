title: For-each identity
brief: |
  The requested route set is not available.

  Work on the workstation in `~/quest` with `main.tf`, `terraform.tfvars`, `original-ids.json`.

  **Requirements:**
  - Files on the workstation:
    - `~/quest/north.txt`: `open`.
    - `~/quest/south.txt`: `held`.
    - `~/quest/east.txt`: `open`.
  - Root outputs:
    - Output name: `routes`.
    - Entries (exactly three): `north`, `south`, `east`.
    - `north` and `south` IDs match `~/quest/original-ids.json` on the workstation; `east` is a string.
  - OpenTofu state:
    - Required addresses: `local_file.route["east"]`.
  - Infrastructure convergence:
    - No pending infrastructure changes; detailed-plan exit code `0`.

  **Verify yourself before Check & finish:**
  - `cat north.txt south.txt east.txt` — Shows `open`, `held`, `open` in that order.
  - `tofu output -json routes; cat original-ids.json` — The output has three entries; `north` and `south` match the receipt and `east` has a string ID.
  - `tofu show -no-color; tofu plan -input=false -detailed-exitcode -no-color` — Includes `local_file.route["east"]`; planning then exits `0` without changes.
debrief: The routes output retains the recorded north and south IDs, the east address and files match, and the plan
  has no changes.
stages.0.brief: The requested route set must retain the existing identities.
hints.0.text: Existing route identities must survive expansion of the map.
hints.1.text: Map keys identify instances independently of order.
hints.2.text: Add one key to the for_each map and apply.
phrases.0: I used stable for_each keys for instance identity.
phrases.1: I added the new station without replacing existing instances.
phrases.2: I compared preserved resource IDs and the final plan.
diagnostics.condition_0: east.txt must equal open.
diagnostics.condition_1: tofu output -json routes must succeed.
diagnostics.condition_2: current-ids.json north must equal original-ids.json north.
diagnostics.condition_3: current-ids.json south must equal original-ids.json south.
diagnostics.condition_4: routes.east type must equal string.
diagnostics.condition_5: routes length must equal 3.
diagnostics.condition_6: tofu state list must contain local_file.route["east"].
diagnostics.condition_7: The OpenTofu detailed plan must exit with code 0.
diagnostics.condition_8: north.txt must equal open.
diagnostics.condition_9: south.txt must equal held.
stages.0.objectives.0.text: On the workstation, `north.txt` contains `open`; `south.txt` contains `held`; `east.txt`
  contains `open`.
stages.0.objectives.1.text: 'The `routes` output has exactly three entries: `north` and `south` match workstation
  `original-ids.json`, and `east` has a string ID.'
stages.0.objectives.2.text: OpenTofu state includes `local_file.route["east"]`.
stages.0.objectives.3.text: OpenTofu reports no pending infrastructure changes.
