title: For-each identity
brief: |
  Expanding the route set would alter existing records. Deliver the requested routes while preserving the existing identities.

  Work on the workstation in `~/quest` with `main.tf`, `terraform.tfvars`.

  **Requirements:**
  - On the workstation, `~/quest/north.txt` contains `open`; `~/quest/south.txt` contains `held`; `~/quest/east.txt` contains `open`.
  - The `routes` output has exactly three entries: `north` and `south` keep their original IDs, and `east` has a string ID.
  - The added route is tracked as part of the existing managed route set.
  - A detailed plan reports no pending infrastructure changes and exits with code `0`.
debrief: The routes output retains the recorded north and south IDs, the east address and files match, and
  the plan has no changes.
stages.0.brief: The requested route set must retain the existing identities.
hints.0.text: Each loop instance has an identity and a payload; verify both rather than accepting a plan
  by its resource count.
hints.1.text: |-
  Compare planned values and current provider IDs with the caller map before accepting an expansion.

  ```sh
  cat main.tf terraform.tfvars
  tofu show -no-color
  tofu plan -input=false -no-color
  ```
hints.2.text: |-
  After applying the expansion, verify the original IDs, every requested file value and an empty plan; existing routes must not be replaced.

  - `tofu output -json routes`
  - `tofu plan -input=false -detailed-exitcode -no-color`

  ```sh
  cat north.txt south.txt east.txt
  tofu output -json routes
  cat original-ids.json
  tofu plan -input=false -detailed-exitcode -no-color
  ```
phrases.0: I used stable for_each keys for instance identity.
phrases.1: I added the new station without replacing existing instances.
phrases.2: I compared preserved resource IDs and the final plan.
stages.0.objectives.0.text: On the workstation, `~/quest/north.txt` contains `open`; `~/quest/south.txt` contains
  `held`; `~/quest/east.txt` contains `open`.
stages.0.objectives.1.text: 'The `routes` output has exactly three entries: `north` and `south` keep their
  original IDs, and `east` has a string ID.'
stages.0.objectives.2.text: The added route is tracked as part of the existing managed route set.
stages.0.objectives.3.text: OpenTofu reports no pending infrastructure changes.
diagnostics.condition_0: The east entry may be missing from the caller map or not yet applied to a readable east.txt. [Cause and check](guides#guide=terraform-2&section=route-map-content)
diagnostics.condition_8: Using each.key as content can write the route name into north.txt; a missing or unreadable file also fails. [Cause and check](guides#guide=terraform-2&section=route-map-content)
diagnostics.condition_9: Using each.key as content can write the route name into south.txt; a missing or unreadable file also fails. [Cause and check](guides#guide=terraform-2&section=route-map-content)
diagnostics.condition_1: The routes output may not have been applied, or OpenTofu may be unable to read its state or write current-ids.json. [Cause and check](guides#guide=terraform-2&section=route-map-state)
diagnostics.condition_2: A changed payload or filename can change the north ID; unreadable current or original JSON can also prevent comparison. [Cause and check](guides#guide=terraform-2&section=route-retained-ids)
diagnostics.condition_3: A changed payload or filename can change the south ID; unreadable current or original JSON can also prevent comparison. [Cause and check](guides#guide=terraform-2&section=route-retained-ids)
diagnostics.condition_4: An unapplied east entry or an output with the wrong shape may leave routes.east absent or non-string; unreadable JSON also fails. [Cause and check](guides#guide=terraform-2&section=route-map-state)
diagnostics.condition_5: The applied output may still omit a route or include extra entries; an unreadable current-ids.json also prevents counting. [Cause and check](guides#guide=terraform-2&section=route-map-state)
diagnostics.condition_6: One of the three files may lack a managed local_file binding to its path, or the state structure may be incomplete. [Cause and check](guides#guide=terraform-2&section=route-map-state)
diagnostics.probe_0_2: Python or its check helper may not start, or tofu show may fail before returning usable state JSON. [Cause and check](guides#guide=terraform-2&section=route-map-state)
diagnostics.condition_7: Unapplied map or content changes may remain, or a configuration, provider or state error may prevent planning. [Cause and check](guides#guide=terraform-2&section=route-final-plan)
