title: For-each identity
brief: |
  Expanding the route set would alter existing records. Deliver the requested routes while preserving the existing identities.

  Work on the workstation in `~/quest` with `main.tf`, `terraform.tfvars`.

  **Requirements:**
  - On the workstation, `~/quest/north.txt` contains `open`; `~/quest/south.txt` contains `held`; `~/quest/east.txt` contains `open`.
  - The `routes` output has exactly three entries: `north` and `south` keep their original IDs, and `east` has a string ID.
  - The added route is tracked as part of the existing managed route set.
  - A detailed plan reports no pending infrastructure changes and exits with code `0`.
debrief: The routes output retains the recorded north and south IDs, the east address and files match, and
  the plan has no changes.
stages.0.brief: The requested route set must retain the existing identities.
hints.0.text: Each loop instance has an identity and a payload; verify both rather than accepting a plan
  by its resource count.
hints.1.text: |-
  Compare planned values and current provider IDs with the caller map before accepting an expansion.

  ```sh
  cat main.tf terraform.tfvars
  tofu show -no-color
  tofu plan -input=false -no-color
  ```
hints.2.text: |-
  After applying the expansion, verify the original IDs, every requested file value and an empty plan; existing routes must not be replaced.

  - `tofu output -json routes`
  - `tofu plan -input=false -detailed-exitcode -no-color`

  ```sh
  cat north.txt south.txt east.txt
  tofu output -json routes
  cat original-ids.json
  tofu plan -input=false -detailed-exitcode -no-color
  ```
phrases.0: I used stable for_each keys for instance identity.
phrases.1: I added the new station without replacing existing instances.
phrases.2: I compared preserved resource IDs and the final plan.
diagnostics.condition_0: east.txt must equal open.
diagnostics.condition_1: tofu output -json routes must succeed.
diagnostics.condition_2: current-ids.json north must equal original-ids.json north.
diagnostics.condition_3: current-ids.json south must equal original-ids.json south.
diagnostics.condition_4: routes.east type must equal string.
diagnostics.condition_5: routes length must equal 3.
diagnostics.condition_6: |-
  The managed route set must include north.txt, south.txt and east.txt.

diagnostics.condition_7: The OpenTofu detailed plan must exit with code 0.
diagnostics.condition_8: north.txt must equal open.
diagnostics.condition_9: south.txt must equal held.
stages.0.objectives.0.text: On the workstation, `~/quest/north.txt` contains `open`; `~/quest/south.txt` contains
  `held`; `~/quest/east.txt` contains `open`.
stages.0.objectives.1.text: 'The `routes` output has exactly three entries: `north` and `south` keep their
  original IDs, and `east` has a string ID.'
stages.0.objectives.2.text: The added route is tracked as part of the existing managed route set.
stages.0.objectives.3.text: OpenTofu reports no pending infrastructure changes.
diagnostics.probe_0_2: 'The current inputs could not verify this objective: The added route is tracked as part of
  the existing managed route set.'
