title: For-each identity
brief: 'Work in `~/quest`. Read `main.tf`, `terraform.tfvars` and `original-ids.json`: the configuration uses `for_each` keys
  as stable resource identities and the JSON file records the original north and south IDs. Add `east = "open"` to the routes
  map without changing the other entries. The linked guide and hints introduce this OpenTofu configuration.


  After applying, verify `east.txt` contains `open`, `north.txt` contains `open`, and `south.txt` contains `held`. `tofu state
  list` must include `local_file.route["east"]`. `tofu output -json routes` must contain exactly three entries: north and
  south equal their values in `original-ids.json`, and east is a string. Finally `tofu plan -input=false -detailed-exitcode
  -no-color` must exit 0 (no changes). Use only the offline bay.'
debrief: The routes output retains the recorded north and south IDs, the east address and files match, and the plan has no
  changes.
stages.0.brief: The routes output has three entries with the original north/south IDs and a string east ID; the east state
  address, three file contents and no-change plan match the brief.
stages.0.objectives.0.text: The routes output has three entries with the original north/south IDs and a string east ID; the
  east state address, three file contents and no-change plan match the brief.
hints.0.text: Inspect state addresses first.
hints.1.text: Map keys identify instances independently of order.
hints.2.text: Add one key and compare the original ID map after apply.
phrases.0: I used stable for_each keys for instance identity.
phrases.1: I added the new station without replacing existing instances.
phrases.2: I compared preserved resource IDs and the final plan.
diagnostics.condition_0: east.txt must equal open.
diagnostics.condition_1: tofu output -json routes must succeed.
diagnostics.condition_2: current-ids.json north must equal original-ids.json north.
diagnostics.condition_3: current-ids.json south must equal original-ids.json south.
diagnostics.condition_4: routes.east type must equal string.
diagnostics.condition_5: routes length must equal 3.
diagnostics.condition_6: tofu state list must contain local_file.route["east"].
diagnostics.condition_7: The OpenTofu detailed plan must exit with code 0.
diagnostics.condition_8: north.txt must equal open.
diagnostics.condition_9: south.txt must equal held.
