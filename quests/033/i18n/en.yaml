title: For-each identity
brief: 'north and south are managed through stable for_each keys. original-ids.json
  records their provider IDs. Add east=open in terraform.tfvars while preserving both
  existing keys, addresses, contents and IDs.


  Quest files in `~/quest` (some appear in later stages): `main.tf`, `terraform.tfvars`,
  `original-ids.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images
  and private services. Change only this bay.


  Initial success criteria: Three instances exist, north/south IDs are unchanged,
  east.txt contains open and plan is empty.'
debrief: The new map key added one instance without shifting existing identities.
