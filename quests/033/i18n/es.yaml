title: Para cada identidad
brief: 'north y south se administran mediante claves estables for_each. original-ids.json registra su
  provider IDs. Agregue east=open en terraform.tfvars mientras conserva las claves, direcciones, contenidos
  y IDs existentes.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `main.tf`, `terraform.tfvars`,
  `original-ids.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: existen tres instancias, north/south IDs no han cambiado, east.txt contiene
  open y plan está vacío.'
debrief: La nueva clave map agregó una instancia sin cambiar las identidades existentes.
