title: Para cada identidad
brief: 'Trabaja en `~/quest`. Lee `main.tf`, `terraform.tfvars` y `original-ids.json`: la configuración usa claves `for_each`
  como identidades estables y el archivo JSON guarda los ID originales de north y south. Añade `east = "open"` al mapa routes
  sin cambiar las demás entradas. La guía enlazada y las pistas presentan esta configuración de OpenTofu.


  Tras aplicar, comprueba que `east.txt` contiene `open`, `north.txt` contiene `open` y `south.txt` contiene `held`. `tofu
  state list` debe incluir `local_file.route["east"]`. `tofu output -json routes` debe tener exactamente tres entradas: north
  y south iguales a sus valores en `original-ids.json`, y east de tipo cadena. Por último, `tofu plan -input=false -detailed-exitcode
  -no-color` debe terminar con código 0 (sin cambios). Usa solo la bahía sin conexión.'
debrief: La salida routes conserva los ID registrados de north y south, la dirección east y los archivos coinciden, y el plan
  no tiene cambios.
stages.0.brief: La salida routes tiene tres entradas con los ID originales de north/south y un ID east de tipo cadena; la
  dirección de estado de east, los tres archivos y el plan sin cambios coinciden con el enunciado.
stages.0.objectives.0.text: La salida routes tiene tres entradas con los ID originales de north/south y un ID east de tipo
  cadena; la dirección de estado de east, los tres archivos y el plan sin cambios coinciden con el enunciado.
hints.0.text: Inspeccione primero las direcciones estatales.
hints.1.text: Las claves de mapa identifican instancias independientemente del orden.
hints.2.text: Agregue una clave y compare el mapa original ID después de apply.
phrases.0: Utilicé claves for_each estables, por ejemplo, de identidad.
phrases.1: Agregué el nuevo station sin reemplazar las instancias existentes.
phrases.2: Comparé el recurso conservado IDs y el plan final.
diagnostics.condition_0: east.txt debe ser igual a open.
diagnostics.condition_1: tofu output -json routes debe tener éxito.
diagnostics.condition_2: current-ids.json north debe ser igual a original-ids.json north.
diagnostics.condition_3: current-ids.json south debe ser igual a original-ids.json south.
diagnostics.condition_4: routes.east type debe ser igual a string.
diagnostics.condition_5: routes length debe ser igual a 3.
diagnostics.condition_6: tofu state list debe contener local_file.route["east"].
diagnostics.condition_7: El plan de OpenTofu con detailed-exitcode debe terminar con código 0.
diagnostics.condition_8: north.txt debe ser igual a open.
diagnostics.condition_9: south.txt debe ser igual a held.
