title: Para cada identidad
brief: |
  La expansión de las rutas alteraría registros existentes. Entrega las rutas solicitadas conservando sus identidades actuales.

  Trabaja en la estación de trabajo en `~/quest` con `main.tf`, `terraform.tfvars`.

  **Requisitos:**
  - En la workstation, `~/quest/north.txt` contiene `open`; `~/quest/south.txt` contiene `held`; `~/quest/east.txt` contiene `open`.
  - La salida `routes` tiene exactamente tres entradas: `north` y `south` conservan sus IDs originales y `east` tiene un ID de tipo string.
  - La ruta añadida está registrada como parte del conjunto de rutas gestionadas existente.
  - Un plan detallado no muestra cambios de infraestructura pendientes y termina con código `0`.
debrief: La salida routes conserva los ID registrados de north y south, la dirección east y los archivos coinciden,
  y el plan no tiene cambios.
stages.0.brief: El conjunto de rutas solicitado debe conservar las identidades existentes.
hints.0.text: Cada instancia del bucle tiene identidad y datos; verifica ambos, no solo el número de recursos
  del plan.
hints.1.text: |-
  Compara los valores del plan y los ID actuales del proveedor con el mapa de entrada antes de aceptar una expansión.

  ```sh
  cat main.tf terraform.tfvars
  tofu show -no-color
  tofu plan -input=false -no-color
  ```
hints.2.text: |-
  Después de la expansión, verifica los ID originales, todos los valores de archivo solicitados y un plan vacío; no deben reemplazarse las rutas existentes.

  - `tofu output -json routes`
  - `tofu plan -input=false -detailed-exitcode -no-color`

  ```sh
  cat north.txt south.txt east.txt
  tofu output -json routes
  cat original-ids.json
  tofu plan -input=false -detailed-exitcode -no-color
  ```
phrases.0: Utilicé claves for_each estables, por ejemplo, de identidad.
phrases.1: Agregué el nuevo station sin reemplazar las instancias existentes.
phrases.2: Comparé el recurso conservado IDs y el plan final.
stages.0.objectives.0.text: En la workstation, `~/quest/north.txt` contiene `open`; `~/quest/south.txt` contiene
  `held`; `~/quest/east.txt` contiene `open`.
stages.0.objectives.1.text: 'La salida `routes` tiene exactamente tres entradas: `north` y `south` conservan
  sus IDs originales y `east` tiene un ID de tipo string.'
stages.0.objectives.2.text: La ruta añadida está registrada como parte del conjunto de rutas gestionadas existente.
stages.0.objectives.3.text: OpenTofu no informa cambios de infraestructura pendientes.
diagnostics.condition_0: La entrada east puede faltar en el mapa de entrada o no haberse aplicado a un east.txt legible. [Causa y comprobación](guides#guide=terraform-2&section=route-map-content)
diagnostics.condition_8: Usar each.key como contenido puede escribir el nombre de la ruta en north.txt; un archivo ausente o ilegible también falla. [Causa y comprobación](guides#guide=terraform-2&section=route-map-content)
diagnostics.condition_9: Usar each.key como contenido puede escribir el nombre de la ruta en south.txt; un archivo ausente o ilegible también falla. [Causa y comprobación](guides#guide=terraform-2&section=route-map-content)
diagnostics.condition_1: La salida routes puede no haberse aplicado, o OpenTofu no puede leer el estado o escribir current-ids.json. [Causa y comprobación](guides#guide=terraform-2&section=route-map-state)
diagnostics.condition_2: Cambiar el contenido o nombre del archivo puede cambiar el ID de north; un JSON actual u original ilegible también impide comparar. [Causa y comprobación](guides#guide=terraform-2&section=route-retained-ids)
diagnostics.condition_3: Cambiar el contenido o nombre del archivo puede cambiar el ID de south; un JSON actual u original ilegible también impide comparar. [Causa y comprobación](guides#guide=terraform-2&section=route-retained-ids)
diagnostics.condition_4: Una entrada east sin aplicar o una salida mal estructurada puede dejar routes.east ausente o sin tipo string; un JSON ilegible también falla. [Causa y comprobación](guides#guide=terraform-2&section=route-map-state)
diagnostics.condition_5: La salida aplicada puede omitir una ruta o incluir entradas extra; un current-ids.json ilegible también impide contarlas. [Causa y comprobación](guides#guide=terraform-2&section=route-map-state)
diagnostics.condition_6: Uno de los tres archivos puede carecer de un local_file gestionado para su ruta, o la estructura del estado puede estar incompleta. [Causa y comprobación](guides#guide=terraform-2&section=route-map-state)
diagnostics.probe_0_2: Python o su módulo de comprobación puede no arrancar, o tofu show puede fallar antes de devolver JSON de estado utilizable. [Causa y comprobación](guides#guide=terraform-2&section=route-map-state)
diagnostics.condition_7: Pueden quedar cambios del mapa o contenido sin aplicar, o un error de configuración, proveedor o estado puede impedir el plan. [Causa y comprobación](guides#guide=terraform-2&section=route-final-plan)
