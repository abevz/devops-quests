title: Para cada identidad
brief: |
  El conjunto de rutas solicitado no está disponible.

  Trabaja en la workstation en `~/quest` con `main.tf`, `terraform.tfvars`, `original-ids.json`.

  **Requisitos:**
  - Archivos en la workstation:
    - `~/quest/north.txt`: `open`.
    - `~/quest/south.txt`: `held`.
    - `~/quest/east.txt`: `open`.
  - Salidas raíz:
    - Nombre de salida: `routes`.
    - Entradas (exactamente tres): `north`, `south`, `east`.
    - Los ID `north` y `south` coinciden con `~/quest/original-ids.json` en la workstation; `east` es una cadena.
  - Estado de OpenTofu:
    - Direcciones requeridas: `local_file.route["east"]`.
  - Convergencia de infraestructura:
    - Sin cambios de infraestructura pendientes; código de salida del plan detallado `0`.

  **Verifica antes de Check & finish:**
  - `cat north.txt south.txt east.txt` — Muestra `open`, `held`, `open` en ese orden.
  - `tofu output -json routes; cat original-ids.json` — La salida tiene tres entradas; `north` y `south` coinciden con el comprobante y `east` tiene un ID de cadena.
  - `tofu show -no-color; tofu plan -input=false -detailed-exitcode -no-color` — Incluye `local_file.route["east"]`; después el plan termina con `0` sin cambios.
debrief: La salida routes conserva los ID registrados de north y south, la dirección east y los archivos coinciden,
  y el plan no tiene cambios.
stages.0.brief: El conjunto de rutas solicitado debe conservar las identidades existentes.
hints.0.text: Las identidades de rutas existentes deben conservarse al ampliar el mapa.
hints.1.text: Las claves de mapa identifican instancias independientemente del orden.
hints.2.text: Añade una clave al mapa for_each y aplica.
phrases.0: Utilicé claves for_each estables, por ejemplo, de identidad.
phrases.1: Agregué el nuevo station sin reemplazar las instancias existentes.
phrases.2: Comparé el recurso conservado IDs y el plan final.
diagnostics.condition_0: east.txt debe ser igual a open.
diagnostics.condition_1: tofu output -json routes debe tener éxito.
diagnostics.condition_2: current-ids.json north debe ser igual a original-ids.json north.
diagnostics.condition_3: current-ids.json south debe ser igual a original-ids.json south.
diagnostics.condition_4: routes.east type debe ser igual a string.
diagnostics.condition_5: routes length debe ser igual a 3.
diagnostics.condition_6: tofu state list debe contener local_file.route["east"].
diagnostics.condition_7: El plan de OpenTofu con detailed-exitcode debe terminar con código 0.
diagnostics.condition_8: north.txt debe ser igual a open.
diagnostics.condition_9: south.txt debe ser igual a held.
stages.0.objectives.0.text: En la workstation, `north.txt` contiene `open`; `south.txt` contiene `held`; `east.txt`
  contiene `open`.
stages.0.objectives.1.text: 'La salida `routes` tiene exactamente tres entradas: `north` y `south` coinciden con
  `original-ids.json` en la workstation, y `east` tiene un ID de cadena.'
stages.0.objectives.2.text: El estado de OpenTofu incluye `local_file.route["east"]`.
stages.0.objectives.3.text: OpenTofu no informa cambios de infraestructura pendientes.
