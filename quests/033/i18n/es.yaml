title: Para cada identidad
brief: |
  La expansión de las rutas alteraría registros existentes. Entrega las rutas solicitadas conservando sus identidades actuales.

  Trabaja en la estación de trabajo en `~/quest` con `main.tf`, `terraform.tfvars`.

  **Requisitos:**
  - En la workstation, `~/quest/north.txt` contiene `open`; `~/quest/south.txt` contiene `held`; `~/quest/east.txt` contiene `open`.
  - La salida `routes` tiene exactamente tres entradas: `north` y `south` conservan sus IDs originales y `east` tiene un ID de tipo string.
  - La ruta añadida está registrada como parte del conjunto de rutas gestionadas existente.
  - Un plan detallado no muestra cambios de infraestructura pendientes y termina con código `0`.
debrief: La salida routes conserva los ID registrados de north y south, la dirección east y los archivos coinciden,
  y el plan no tiene cambios.
stages.0.brief: El conjunto de rutas solicitado debe conservar las identidades existentes.
hints.0.text: Cada instancia del bucle tiene identidad y datos; verifica ambos, no solo el número de recursos
  del plan.
hints.1.text: |-
  Compara los valores del plan y los ID actuales del proveedor con el mapa de entrada antes de aceptar una expansión.

  ```sh
  cat main.tf terraform.tfvars
  tofu show -no-color
  tofu plan -input=false -no-color
  ```
hints.2.text: |-
  Después de la expansión, verifica los ID originales, todos los valores de archivo solicitados y un plan vacío; no deben reemplazarse las rutas existentes.

  - `tofu output -json routes`
  - `tofu plan -input=false -detailed-exitcode -no-color`

  ```sh
  cat north.txt south.txt east.txt
  tofu output -json routes
  cat original-ids.json
  tofu plan -input=false -detailed-exitcode -no-color
  ```
phrases.0: Utilicé claves for_each estables, por ejemplo, de identidad.
phrases.1: Agregué el nuevo station sin reemplazar las instancias existentes.
phrases.2: Comparé el recurso conservado IDs y el plan final.
diagnostics.condition_0: east.txt debe ser igual a open.
diagnostics.condition_1: tofu output -json routes debe tener éxito.
diagnostics.condition_2: current-ids.json north debe ser igual a original-ids.json north.
diagnostics.condition_3: current-ids.json south debe ser igual a original-ids.json south.
diagnostics.condition_4: routes.east type debe ser igual a string.
diagnostics.condition_5: routes length debe ser igual a 3.
diagnostics.condition_6: |-
  El conjunto de rutas gestionado debe incluir north.txt, south.txt y east.txt.

diagnostics.condition_7: El plan de OpenTofu con detailed-exitcode debe terminar con código 0.
diagnostics.condition_8: north.txt debe ser igual a open.
diagnostics.condition_9: south.txt debe ser igual a held.
