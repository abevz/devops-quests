title: Registry credentials
brief: 'The private `board` consumer is unavailable.


  Work on the workstation in `~/quest` with `platform.env`, `board.yaml`.


  **Requirements:**

  - Deployment `board` uses the supplied private image, pull policy `Always`, and only the existing registry-authentication
  Secret.

  - Deployment `board` has desired replica count `1`.

  - The existing registry-authentication Secret contains valid Docker-registry credentials matching the supplied
  environment.

  - Deployment `board` completes its rollout in the bay namespace.

  - Inside a Pod of Deployment `board`, `http://127.0.0.1:8080` returns `north-42`.


  Base64 is encoding, not encryption; current credential, rollout and response checks do not prove every future
  pull.

  '
debrief: Registry authentication and Kubernetes consumer configuration were separate parts of the rotation.
stages.0.brief: The private release must meet its credential and consumer contract.
hints.0.text: A successful push from the workstation does not authenticate the kubelet.
hints.1.text: 'Inspect the supplied inputs and observed state:


  ```sh

  cat board.yaml

  kubectl describe pod -l app=board

  kubectl get secrets

  ```'
hints.2.text: |-
  Inspect imagePullSecrets and the Pod pull failure without printing credentials.

  Replace the stale Docker auth Secret and restart the failed consumer. API Secret data must contain a valid Docker credential document; use either nested auth or matching username/password fields.
  Do not print credential values or save them in shell history.

  Verify the observed result:

  - `source platform.env; kubectl get secret registry-pull -o json | jq -e 'env as $e | .type as $t | (if $t=="kubernetes.io/dockerconfigjson" then (.data[".dockerconfigjson"]|@base64d|fromjson|.auths) elif $t=="kubernetes.io/dockercfg" then (.data[".dockercfg"]|@base64d|fromjson) else {} end)[$e.REGISTRY] | if ((.auth//"")|length)>0 then ((.auth|gsub("[\r\n]";"")|@base64d)==($e.REGISTRY_USER+":"+$e.REGISTRY_PASSWORD)) else .username==$e.REGISTRY_USER and .password==$e.REGISTRY_PASSWORD end'` — Prints `true` without exposing credentials.
  - `source platform.env; kubectl get deployment board -o json | jq '{name:.metadata.name,replicas:.spec.replicas,worker:(.spec.template.spec.containers[]|select(.name=="worker")|{image,imagePullPolicy})}'; kubectl get pods -o json | jq '.items[] | select(.metadata.deletionTimestamp==null and any(.spec.containers[]?;.name=="worker")) | {pod:.metadata.name,pullSecrets:[.spec.imagePullSecrets[]?.name]}'` — Shows `board`, replicas `1`, the supplied `PRIVATE_IMAGE`, `Always` and only `registry-pull`.
  - `kubectl rollout status deployment/board --timeout=10s; kubectl exec --pod-running-timeout=5s deployment/board -c worker -- wget -qO- -T 3 http://127.0.0.1:8080` — Rollout completes; HTTP returns `north-42`.

phrases.0: I separated registry authentication from the kubelet pull credential.
phrases.1: I rotated the consumer Secret while retaining the immutable image reference.
phrases.2: I verified a fresh private pull and the recovered application response.
questions.0.points.0: Different consumers retain independent credentials.
questions.0.points.1: Kubelet uses the Pod pull identity.
questions.0.points.2: Verify a fresh authenticated pull and the running workload.
questions.0.prompt: Why can image pulls fail after a registry password rotation?
questions.1.points.0: It does not repair image names or missing digests.
questions.1.points.1: TLS trust and network reachability remain separate.
questions.1.points.2: Its namespace and workload reference must match.
questions.1.prompt: What does an image pull Secret not solve?
stages.0.objectives.0.text: Deployment `board` uses the supplied private image, pull policy `Always`, and only
  the existing registry-authentication Secret.
stages.0.objectives.1.text: Deployment `board` has desired replica count `1`.
stages.0.objectives.2.text: The existing registry-authentication Secret contains valid Docker-registry credentials
  matching the supplied environment.
stages.0.objectives.3.text: Deployment `board` completes its rollout in the bay namespace.
stages.0.objectives.4.text: Inside a Pod of Deployment `board`, `http://127.0.0.1:8080` returns `north-42`.
diagnostics.platform_inputs: The replica check stopped before reading board; platform.env may be missing, unreadable or fail when sourced. [Cause and check](guides#guide=gitops-delivery&section=registry-observation)
diagnostics.probe_0_0: The private workload could not be inspected; environment values, API JSON, Deployment ownership or a unique worker container may be missing or malformed. [Cause and check](guides#guide=gitops-delivery&section=registry-observation)
diagnostics.image: The worker image differs from PRIVATE_IMAGE in board or its active Pods; a template edit or an older ReplicaSet may still use another image. [Cause and check](guides#guide=gitops-delivery&section=registry-pod-contract)
diagnostics.policy: Always is missing from the board worker or an active Pod; cached-image settings or Pods from an older template can bypass a fresh registry pull. [Cause and check](guides#guide=gitops-delivery&section=registry-pod-contract)
diagnostics.secrets: No active board Pod was found or its effective pull Secrets differ from registry-pull alone; template or ServiceAccount changes may have added or omitted a Secret. [Cause and check](guides#guide=gitops-delivery&section=registry-pod-contract)
diagnostics.replicas: The desired replica count is not 1 or board cannot be read; scaling the workload down does not repair private image authentication. [Cause and check](guides#guide=gitops-delivery&section=registry-replicas)
diagnostics.secret_type: registry-pull has no supported Docker credential type; a generic Secret or an unreadable/missing type cannot supply registry credentials. [Cause and check](guides#guide=gitops-delivery&section=registry-credential-document)
diagnostics.outer: The Docker credential document cannot be decoded; the required data key, base64, JSON or unique JSON fields may be invalid. [Cause and check](guides#guide=gitops-delivery&section=registry-credential-document)
diagnostics.auth: Authentication data is unreadable or unusable; check the exact registry entry, base64 auth containing a colon, or string username/password fields. [Cause and check](guides#guide=gitops-delivery&section=registry-credential-auth)
diagnostics.credentials: The decoded credentials differ from platform.env; registry-pull may still hold the retired password or credentials for another user. [Cause and check](guides#guide=gitops-delivery&section=registry-credential-auth)
diagnostics.probe_0_2: The credential probe stopped before its detailed checks; platform.env, required registry variables or the Python probe may be unavailable. [Cause and check](guides#guide=gitops-delivery&section=registry-observation)
diagnostics.rollout: board did not complete rollout within 3 seconds; rejected registry credentials, image pull backoff or a failing worker may still block readiness. [Cause and check](guides#guide=gitops-delivery&section=registry-consumer-health)
diagnostics.http: The worker did not return north-42 at localhost:8080; it may not be running yet, exec may have failed, or its HTTP command or content changed. [Cause and check](guides#guide=gitops-delivery&section=registry-consumer-health)
