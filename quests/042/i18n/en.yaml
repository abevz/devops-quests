title: Registry credentials
brief: 'The private registry already uses the new game-only password from platform.env.
  The board Deployment still references registry-pull containing a retired password.
  Rotate this consumer Secret, keep the private immutable image and Always pull policy,
  and recover the HTTP board. Do not change the registry service.


  Quest files in `~/quest` (some appear in later stages): `platform.env`, `board.json`,
  `registry-pull.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images
  and private services. Change only this bay.


  Initial success criteria: registry-pull contains the current credential; board pulls
  with Always and serves north-42.'
debrief: Registry authentication and Kubernetes consumer configuration were separate
  parts of the rotation.
stages.0.brief: 'Success criteria: registry-pull contains the current credential;
  board pulls with Always and serves north-42.'
stages.0.objectives.0.text: registry-pull contains the current credential; board pulls
  with Always and serves north-42.
hints.0.text: A successful push from the workstation does not authenticate the kubelet.
hints.1.text: Inspect imagePullSecrets and the Pod pull failure without printing credentials.
hints.2.text: Replace the Docker auth Secret and restart the failed consumer.
phrases.0: I separated registry authentication from the kubelet pull credential.
phrases.1: I rotated the consumer Secret while retaining the immutable image reference.
phrases.2: I verified a fresh private pull and the recovered application response.
questions.0.points.0: Different consumers retain independent credentials.
questions.0.points.1: Kubelet uses the Pod pull identity.
questions.0.points.2: Verify a fresh authenticated pull and the running workload.
questions.0.prompt: Why can image pulls fail after a registry password rotation?
questions.1.points.0: It does not repair image names or missing digests.
questions.1.points.1: TLS trust and network reachability remain separate.
questions.1.points.2: Its namespace and workload reference must match.
questions.1.prompt: What does an image pull Secret not solve?
