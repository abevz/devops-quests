title: Registry credentials
brief: 'Work in `~/quest` with `platform.env` and `board.json`. The private registry has a new game-only credential, but the
  board Secret is stale. A same-namespace image pull Secret gives the kubelet registry credentials; avoid printing them or
  saving them in shell history. Rotate `registry-pull` using the registry address, user and password in `platform.env`. The
  `.dockerconfigjson` auth entry for `REGISTRY` must decode to the supplied user and password. Keep one `board` replica, the
  first container image equal to `PRIVATE_IMAGE`, pull policy `Always`, and exactly one pull Secret `registry-pull`. Wait
  for the rollout, then check the board Pod''s `127.0.0.1:8080` returns `north-42`. Current Secret, rollout and response checks
  do not prove every future pull. Work only in the offline bay.


  The API Secret data and nested auth must use valid canonical base64. Base64 is an encoding, not encryption; keep the values
  private.


  The Secret must have type `kubernetes.io/dockerconfigjson`.'
debrief: Registry authentication and Kubernetes consumer configuration were separate parts of the rotation.
stages.0.brief: The registry credential, board image and pull settings, rollout and local HTTP response match the brief.
stages.0.objectives.0.text: The registry credential, board image and pull settings, rollout and local HTTP response match
  the brief.
hints.0.text: A successful push from the workstation does not authenticate the kubelet.
hints.1.text: Inspect imagePullSecrets and the Pod pull failure without printing credentials.
hints.2.text: Replace the Docker auth Secret and restart the failed consumer.
phrases.0: I separated registry authentication from the kubelet pull credential.
phrases.1: I rotated the consumer Secret while retaining the immutable image reference.
phrases.2: I verified a fresh private pull and the recovered application response.
questions.0.points.0: Different consumers retain independent credentials.
questions.0.points.1: Kubelet uses the Pod pull identity.
questions.0.points.2: Verify a fresh authenticated pull and the running workload.
questions.0.prompt: Why can image pulls fail after a registry password rotation?
questions.1.points.0: It does not repair image names or missing digests.
questions.1.points.1: TLS trust and network reachability remain separate.
questions.1.points.2: Its namespace and workload reference must match.
questions.1.prompt: What does an image pull Secret not solve?
