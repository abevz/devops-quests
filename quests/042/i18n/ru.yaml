title: Учётные данные реестра
brief: 'Работайте в `~/quest` с `platform.env` и `board.json`. Приватный реестр использует новые игровые учётные данные, но
  Secret board устарел. Secret загрузки образа в том же пространстве имён передаёт данные реестра kubelet; не выводите их
  и не сохраняйте в истории оболочки. Обновите `registry-pull`, используя адрес, пользователя и пароль из `platform.env`.
  Запись auth в `.dockerconfigjson` для `REGISTRY` должна декодироваться в выданные имя и пароль. Сохраните одну реплику `board`,
  образ первого контейнера равным `PRIVATE_IMAGE`, политику загрузки `Always` и ровно один Secret загрузки `registry-pull`.
  Дождитесь rollout и проверьте, что `127.0.0.1:8080` в Pod board возвращает `north-42`. Текущие проверки Secret, rollout
  и ответа не доказывают каждую будущую загрузку. Работайте только в офлайн-песочнице.


  Данные Secret из API и вложенный auth должны использовать корректный канонический base64. Base64 — кодирование, а не шифрование;
  сохраняйте значения в тайне.


  Secret должен иметь тип `kubernetes.io/dockerconfigjson`.'
debrief: Авторизация registry и конфигурация потребителя Kubernetes оказались разными частями ротации.
stages.0.brief: Данные реестра, образ и настройки загрузки board, rollout и локальный HTTP-ответ соответствуют описанию.
stages.0.objectives.0.text: Данные реестра, образ и настройки загрузки board, rollout и локальный HTTP-ответ соответствуют
  описанию.
hints.0.text: Успешный push с workstation не авторизует kubelet.
hints.1.text: Изучите imagePullSecrets и ошибку загрузки Pod без вывода учётных данных.
hints.2.text: Обновите Secret Docker auth и перезапустите неисправного потребителя.
phrases.0: Я отделил авторизацию registry от учётных данных загрузки kubelet.
phrases.1: Я обновил Secret потребителя и сохранил неизменяемую ссылку образа.
phrases.2: Я проверил новую приватную загрузку и ответ восстановленного приложения.
questions.0.points.0: Разные потребители хранят независимые учётные данные.
questions.0.points.1: Kubelet использует identity загрузки Pod.
questions.0.points.2: Проверить новую авторизованную загрузку и работающую нагрузку.
questions.0.prompt: Почему загрузка образов может сломаться после ротации пароля registry?
questions.1.points.0: Он не исправляет имя образа или отсутствующий digest.
questions.1.points.1: Доверие TLS и сетевая доступность остаются отдельными вопросами.
questions.1.points.2: Его namespace и ссылка нагрузки должны совпадать.
questions.1.prompt: Чего не решает image pull Secret?
diagnostics.image: deployment/board containers[0].image должен совпадать с PRIVATE_IMAGE.
diagnostics.replicas: deployment/board replicas должен совпадать с 1.
diagnostics.secrets: deployment/board imagePullSecrets должен совпадать с [registry-pull].
diagnostics.policy: deployment/board imagePullPolicy должен совпадать с Always.
diagnostics.secret_type: registry-pull type должен совпадать с kubernetes.io/dockerconfigjson.
diagnostics.outer: registry-pull dockerconfigjson должен использовать канонический base64.
diagnostics.auth: registry-pull auth должен использовать канонический base64.
diagnostics.credentials: Декодированный registry-pull auth должен совпадать с пользователем и паролем из platform.env.
diagnostics.rollout: Выкатка deployment/board должна завершиться.
diagnostics.http: Запрос к localhost:8080 Pod board должен вернуть north-42.
