title: Учётные данные реестра
brief: 'Приватный потребитель `board` недоступен.


  Работайте на рабочей станции в `~/quest` с `platform.env`, `board.yaml`.


  **Требования:**

  - Deployment `board` использует поставленный приватный образ, политику загрузки `Always` и только существующий
  Secret аутентификации реестра.

  - Требуемое число реплик Deployment `board` равно `1`.

  - Существующий Secret аутентификации реестра содержит действительные учётные данные Docker-реестра, соответствующие
  поставленному окружению.

  - Deployment `board` завершает rollout в namespace песочницы.

  - Внутри Pod Deployment `board` адрес `http://127.0.0.1:8080` возвращает `north-42`.


  Base64 — кодирование, а не шифрование; текущие проверки credentials, rollout и ответа не доказывают успешность
  всех будущих загрузок.

  '
debrief: Авторизация registry и конфигурация потребителя Kubernetes оказались разными частями ротации.
stages.0.brief: Приватный выпуск должен соответствовать контракту credentials и потребителя.
hints.0.text: Успешный push с workstation не авторизует kubelet.
hints.1.text: 'Изучите поставленные входные данные и наблюдаемое состояние:


  ```sh

  cat board.yaml

  kubectl describe pod -l app=board

  kubectl get secrets

  ```'
hints.2.text: |-
  Изучите imagePullSecrets и ошибку загрузки Pod без вывода учётных данных.

  Замените устаревший Docker auth Secret и перезапустите неработающий потребитель. Данные API Secret должны содержать корректный документ Docker credentials: вложенный auth либо соответствующие поля username/password.
  Не выводите значения credentials и не сохраняйте их в истории shell.

  Проверьте наблюдаемый результат:

  - `source platform.env; kubectl get secret registry-pull -o json | jq -e 'env as $e | .type as $t | (if $t=="kubernetes.io/dockerconfigjson" then (.data[".dockerconfigjson"]|@base64d|fromjson|.auths) elif $t=="kubernetes.io/dockercfg" then (.data[".dockercfg"]|@base64d|fromjson) else {} end)[$e.REGISTRY] | if ((.auth//"")|length)>0 then ((.auth|gsub("[\r\n]";"")|@base64d)==($e.REGISTRY_USER+":"+$e.REGISTRY_PASSWORD)) else .username==$e.REGISTRY_USER and .password==$e.REGISTRY_PASSWORD end'` — Печатает `true`, не раскрывая credentials.
  - `source platform.env; kubectl get deployment board -o json | jq '{name:.metadata.name,replicas:.spec.replicas,worker:(.spec.template.spec.containers[]|select(.name=="worker")|{image,imagePullPolicy})}'; kubectl get pods -o json | jq '.items[] | select(.metadata.deletionTimestamp==null and any(.spec.containers[]?;.name=="worker")) | {pod:.metadata.name,pullSecrets:[.spec.imagePullSecrets[]?.name]}'` — Показывает `board`, число реплик `1`, предоставленный `PRIVATE_IMAGE`, `Always` и только `registry-pull`.
  - `kubectl rollout status deployment/board --timeout=10s; kubectl exec --pod-running-timeout=5s deployment/board -c worker -- wget -qO- -T 3 http://127.0.0.1:8080` — Rollout завершается; HTTP возвращает `north-42`.

phrases.0: Я отделил авторизацию registry от учётных данных загрузки kubelet.
phrases.1: Я обновил Secret потребителя и сохранил неизменяемую ссылку образа.
phrases.2: Я проверил новую приватную загрузку и ответ восстановленного приложения.
questions.0.points.0: Разные потребители хранят независимые учётные данные.
questions.0.points.1: Kubelet использует identity загрузки Pod.
questions.0.points.2: Проверить новую авторизованную загрузку и работающую нагрузку.
questions.0.prompt: Почему загрузка образов может сломаться после ротации пароля registry?
questions.1.points.0: Он не исправляет имя образа или отсутствующий digest.
questions.1.points.1: Доверие TLS и сетевая доступность остаются отдельными вопросами.
questions.1.points.2: Его namespace и ссылка нагрузки должны совпадать.
questions.1.prompt: Чего не решает image pull Secret?
diagnostics.image: |-
  Образ worker в deployment/board должен совпадать с PRIVATE_IMAGE.

diagnostics.replicas: deployment/board replicas должен совпадать с 1.
diagnostics.secrets: |-
  Каждый активный Pod deployment/board должен фактически использовать только registry-pull как pull Secret.

diagnostics.policy: |-
  worker в deployment/board и его активных Pod должен использовать imagePullPolicy Always.

diagnostics.secret_type: |-
  registry-pull должен иметь тип Docker credential Secret: kubernetes.io/dockerconfigjson или kubernetes.io/dockercfg.

diagnostics.outer: |-
  registry-pull должен содержать корректный документ Docker credentials.

diagnostics.auth: |-
  registry-pull должен содержать пригодные credentials: auth либо username/password.

diagnostics.credentials: |-
  Credentials registry-pull должны совпадать с пользователем и паролем из platform.env.

diagnostics.rollout: Выкатка deployment/board должна завершиться.
diagnostics.http: Запрос к localhost:8080 Pod board должен вернуть north-42.
stages.0.objectives.0.text: Deployment `board` использует поставленный приватный образ, политику загрузки `Always`
  и только существующий Secret аутентификации реестра.
stages.0.objectives.1.text: Требуемое число реплик Deployment `board` равно `1`.
stages.0.objectives.2.text: Существующий Secret аутентификации реестра содержит действительные учётные данные
  Docker-реестра, соответствующие поставленному окружению.
stages.0.objectives.3.text: Deployment `board` завершает rollout в namespace песочницы.
stages.0.objectives.4.text: Внутри Pod Deployment `board` адрес `http://127.0.0.1:8080` возвращает `north-42`.
