title: Registrierungsdaten
brief: 'Der private Verbraucher `board` ist nicht verfügbar.


  Arbeiten Sie auf der Workstation in `~/quest` mit `platform.env`, `board.yaml`.


  **Anforderungen:**

  - Deployment `board` verwendet das mitgelieferte private Image, die Pull-Policy `Always` und nur das vorhandene
  Secret für die Registry-Anmeldung.

  - Deployment `board` hat die gewünschte Replikazahl `1`.

  - Das vorhandene Secret für die Registry-Anmeldung enthält gültige Docker-Registry-Zugangsdaten, die der
  mitgelieferten Umgebung entsprechen.

  - Deployment `board` schließt seinen Rollout im Bay-Namespace ab.

  - In einem Pod von Deployment `board` liefert `http://127.0.0.1:8080` den Wert `north-42`.


  Base64 ist Kodierung, keine Verschlüsselung; aktuelle Prüfungen von Zugangsdaten, Rollout und Antwort beweisen
  nicht jeden zukünftigen Pull.

  '
debrief: Die Registrierungsauthentifizierung und die Verbraucherkonfiguration Kubernetes waren separate Teile
  der Rotation.
stages.0.brief: Die private Version muss ihren Vertrag für Zugangsdaten und Verbraucher erfüllen.
hints.0.text: Ein erfolgreicher push vom workstation authentifiziert den kubelet nicht.
hints.1.text: 'Prüfen Sie die mitgelieferten Eingaben und den beobachteten Zustand:


  ```sh

  cat board.yaml

  kubectl describe pod -l app=board

  kubectl get secrets

  ```'
hints.2.text: 'Überprüfen Sie imagePullSecrets und den Pull-Fehler Pod, ohne Anmeldeinformationen zu drucken.


  Ersetze das veraltete Docker-Auth-Secret und starte den fehlgeschlagenen Verbraucher neu. Sowohl API-Secret-Daten
  als auch verschachteltes auth müssen gültiges kanonisches Base64 verwenden.

  Gib Zugangsdaten nicht aus und speichere sie nicht im Shell-Verlauf.


  Prüfen Sie das beobachtete Ergebnis:


  - `source platform.env; kubectl get secret registry-pull -o json | jq -e ''env as $e | .type=="kubernetes.io/dockerconfigjson"
  and ((.data[".dockerconfigjson"]|@base64d|fromjson|.auths[$e.REGISTRY].auth|@base64d)==($e.REGISTRY_USER+":"+$e.REGISTRY_PASSWORD))''`
  — Gibt `true` aus, ohne Zugangsdaten offenzulegen.

  - `source platform.env; kubectl get deployment board -o custom-columns=NAME:.metadata.name,REPLICAS:.spec.replicas,IMAGE:.spec.template.spec.containers[0].image,PULL:.spec.template.spec.containers[0].imagePullPolicy,SECRETS:.spec.template.spec.imagePullSecrets[*].name`
  — Zeigt `board`, Replikazahl `1`, das bereitgestellte `PRIVATE_IMAGE`, `Always` und nur `registry-pull`.

  - `kubectl rollout status deployment/board --timeout=10s; kubectl exec --pod-running-timeout=5s deployment/board
  -- wget -qO- -T 3 http://127.0.0.1:8080` — Der Rollout wird abgeschlossen; HTTP liefert `north-42`.'
phrases.0: Ich habe die registry-Authentifizierung von den kubelet-Pull-Anmeldeinformationen getrennt.
phrases.1: Ich habe den Verbraucher Secret gedreht und dabei die unveränderliche Bildreferenz beibehalten.
phrases.2: Ich habe einen neuen privaten Pull und die wiederhergestellte Anwendungsantwort überprüft.
questions.0.points.0: Unterschiedliche Verbraucher behalten unabhängige Anmeldeinformationen.
questions.0.points.1: Kubelet verwendet den Pod-Pull identity.
questions.0.points.2: Überprüfen Sie einen neuen authentifizierten Pull und die laufende Arbeitslast.
questions.0.prompt: Warum kann das Abrufen von Bildern nach einer registry-Passwortrotation fehlschlagen?
questions.1.points.0: Bildnamen oder fehlende Digests werden nicht repariert.
questions.1.points.1: TLS Vertrauen und Netzwerkerreichbarkeit bleiben getrennt.
questions.1.points.2: Sein namespace und seine Workload-Referenz müssen übereinstimmen.
questions.1.prompt: Was löst ein Bild pull Secret nicht?
diagnostics.image: deployment/board containers[0].image muss PRIVATE_IMAGE entsprechen.
diagnostics.replicas: deployment/board replicas muss 1 entsprechen.
diagnostics.secrets: deployment/board imagePullSecrets muss [registry-pull] entsprechen.
diagnostics.policy: deployment/board imagePullPolicy muss Always entsprechen.
diagnostics.secret_type: registry-pull type muss kubernetes.io/dockerconfigjson entsprechen.
diagnostics.outer: registry-pull dockerconfigjson muss kanonisches base64 verwenden.
diagnostics.auth: registry-pull auth muss kanonisches base64 verwenden.
diagnostics.credentials: Das dekodierte registry-pull auth muss Benutzer und Passwort aus platform.env entsprechen.
diagnostics.rollout: Der Rollout von deployment/board muss abgeschlossen sein.
diagnostics.http: Die Anfrage an localhost:8080 des Board-Pods muss north-42 liefern.
