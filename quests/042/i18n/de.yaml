title: Registrierungsdaten
brief: 'Arbeite in `~/quest` mit `platform.env` und `board.json`. Die private Registry hat neue Spiel-Zugangsdaten, aber das
  Board-Secret ist veraltet. Ein Image-Pull-Secret im selben Namespace gibt dem Kubelet Registry-Zugangsdaten; gib sie nicht
  aus und speichere sie nicht in der Shell-Historie. Rotiere `registry-pull` mit Registry-Adresse, Benutzer und Passwort aus
  `platform.env`. Der auth-Eintrag in `.dockerconfigjson` für `REGISTRY` muss zu den bereitgestellten Benutzerdaten dekodieren.
  Bewahre ein `board`-Replikat, das erste Container-Image gleich `PRIVATE_IMAGE`, Pull-Policy `Always` und genau ein Pull-Secret
  `registry-pull`. Warte auf den Rollout und prüfe, dass `127.0.0.1:8080` im Board-Pod `north-42` liefert. Aktuelle Secret-,
  Rollout- und Antwortprüfungen beweisen nicht jeden künftigen Pull. Arbeite nur in der Offline-Umgebung.


  Die API-Secret-Daten und der verschachtelte auth-Wert müssen gültiges kanonisches base64 verwenden. Base64 ist eine Kodierung,
  keine Verschlüsselung; halte die Werte geheim.


  Das Secret muss den Typ `kubernetes.io/dockerconfigjson` haben.'
debrief: Die Registrierungsauthentifizierung und die Verbraucherkonfiguration Kubernetes waren separate Teile der Rotation.
stages.0.brief: Registry-Zugangsdaten, Board-Image und Pull-Einstellungen, Rollout und lokale HTTP-Antwort entsprechen der
  Beschreibung.
stages.0.objectives.0.text: Registry-Zugangsdaten, Board-Image und Pull-Einstellungen, Rollout und lokale HTTP-Antwort entsprechen
  der Beschreibung.
hints.0.text: Ein erfolgreicher push vom workstation authentifiziert den kubelet nicht.
hints.1.text: Überprüfen Sie imagePullSecrets und den Pull-Fehler Pod, ohne Anmeldeinformationen zu drucken.
hints.2.text: Ersetzen Sie den Docker auth Secret und starten Sie den ausgefallenen Verbraucher neu.
phrases.0: Ich habe die registry-Authentifizierung von den kubelet-Pull-Anmeldeinformationen getrennt.
phrases.1: Ich habe den Verbraucher Secret gedreht und dabei die unveränderliche Bildreferenz beibehalten.
phrases.2: Ich habe einen neuen privaten Pull und die wiederhergestellte Anwendungsantwort überprüft.
questions.0.points.0: Unterschiedliche Verbraucher behalten unabhängige Anmeldeinformationen.
questions.0.points.1: Kubelet verwendet den Pod-Pull identity.
questions.0.points.2: Überprüfen Sie einen neuen authentifizierten Pull und die laufende Arbeitslast.
questions.0.prompt: Warum kann das Abrufen von Bildern nach einer registry-Passwortrotation fehlschlagen?
questions.1.points.0: Bildnamen oder fehlende Digests werden nicht repariert.
questions.1.points.1: TLS Vertrauen und Netzwerkerreichbarkeit bleiben getrennt.
questions.1.points.2: Sein namespace und seine Workload-Referenz müssen übereinstimmen.
questions.1.prompt: Was löst ein Bild pull Secret nicht?
