diagnostics.platform_inputs: Die Replikaprüfung endete vor dem Lesen von board; platform.env fehlt möglicherweise, ist unlesbar oder schlägt beim Laden fehl. [Ursache und Prüfung](guides#guide=gitops-delivery&section=registry-observation)
diagnostics.probe_0_0: Die private Anwendung konnte nicht geprüft werden; Umgebungswerte, API-JSON, Deployment-Eigentümer oder ein eindeutiger worker-Container fehlen möglicherweise oder sind fehlerhaft. [Ursache und Prüfung](guides#guide=gitops-delivery&section=registry-observation)
diagnostics.image: Das worker-Image in board oder aktiven Pods weicht von PRIVATE_IMAGE ab; eine geänderte Vorlage oder ein älteres ReplicaSet verwendet möglicherweise ein anderes Image. [Ursache und Prüfung](guides#guide=gitops-delivery&section=registry-pod-contract)
diagnostics.policy: Always fehlt beim worker von board oder einem aktiven Pod; Cache-Einstellungen oder Pods einer älteren Vorlage können einen neuen Registry-Abruf umgehen. [Ursache und Prüfung](guides#guide=gitops-delivery&section=registry-pod-contract)
diagnostics.secrets: Es wurde kein aktiver board-Pod gefunden oder seine effektiven Pull-Secrets bestehen nicht nur aus registry-pull; Vorlage oder ServiceAccount haben möglicherweise ein Secret ergänzt oder ausgelassen. [Ursache und Prüfung](guides#guide=gitops-delivery&section=registry-pod-contract)
diagnostics.replicas: Die gewünschte Replikazahl ist nicht 1 oder board ist nicht lesbar; Herunterskalieren repariert keine Authentifizierung für private Images. [Ursache und Prüfung](guides#guide=gitops-delivery&section=registry-replicas)
diagnostics.secret_type: registry-pull hat keinen unterstützten Docker-Zugangstyp; ein generisches Secret oder ein fehlender beziehungsweise unlesbarer Typ liefert keine Registry-Zugangsdaten. [Ursache und Prüfung](guides#guide=gitops-delivery&section=registry-credential-document)
diagnostics.outer: Das Docker-Zugangsdokument lässt sich nicht dekodieren; der benötigte data-Schlüssel, Base64, JSON oder eindeutige JSON-Felder sind möglicherweise ungültig. [Ursache und Prüfung](guides#guide=gitops-delivery&section=registry-credential-document)
diagnostics.auth: Die Authentifizierungsdaten sind unlesbar oder unbrauchbar; prüfen Sie den genauen Registry-Eintrag, Base64-auth mit Doppelpunkt oder Zeichenkettenfelder username/password. [Ursache und Prüfung](guides#guide=gitops-delivery&section=registry-credential-auth)
diagnostics.credentials: Die dekodierten Zugangsdaten weichen von platform.env ab; registry-pull enthält möglicherweise noch das alte Passwort oder einen anderen Benutzer. [Ursache und Prüfung](guides#guide=gitops-delivery&section=registry-credential-auth)
diagnostics.probe_0_2: Die Zugangsdatenprüfung endete vor der Detailprüfung; platform.env, Registry-Variablen oder Python sind möglicherweise nicht verfügbar. [Ursache und Prüfung](guides#guide=gitops-delivery&section=registry-observation)
diagnostics.rollout: board hat den Rollout nicht innerhalb von 3 Sekunden abgeschlossen; abgelehnte Zugangsdaten, Image-Pull-Backoff oder ein fehlerhafter worker können die Bereitschaft blockieren. [Ursache und Prüfung](guides#guide=gitops-delivery&section=registry-consumer-health)
diagnostics.http: Der worker lieferte an localhost:8080 nicht north-42; er läuft möglicherweise noch nicht, exec ist fehlgeschlagen oder HTTP-Befehl beziehungsweise Inhalt wurden geändert. [Ursache und Prüfung](guides#guide=gitops-delivery&section=registry-consumer-health)
