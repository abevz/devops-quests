title: Poświadczenia rejestru
brief: 'Prywatny odbiorca `board` jest niedostępny.


  Pracuj na stacji roboczej w `~/quest` z `platform.env`, `board.yaml`.


  **Wymagania:**

  - Deployment `board` używa dostarczonego prywatnego obrazu, polityki `Always` i wyłącznie istniejącego Secret
  do uwierzytelniania w rejestrze.

  - Deployment `board` ma żądaną liczbę replik `1`.

  - Istniejący Secret do uwierzytelniania w rejestrze zawiera prawidłowe dane logowania do rejestru Docker
  zgodne z dostarczonym środowiskiem.

  - Deployment `board` kończy rollout w przestrzeni nazw zatoki.

  - Wewnątrz Poda Deployment `board` adres `http://127.0.0.1:8080` zwraca `north-42`.


  Base64 to kodowanie, nie szyfrowanie; bieżące sprawdzenia danych dostępowych, rollout i odpowiedzi nie dowodzą
  powodzenia każdego przyszłego pobrania.

  '
debrief: Uwierzytelnianie rejestru i konfiguracja konsumencka Kubernetes były odrębnymi częściami rotacji.
stages.0.brief: Prywatne wydanie musi spełniać kontrakt danych dostępowych i odbiorcy.
hints.0.text: Pomyślne push z workstation nie uwierzytelnia kubelet.
hints.1.text: |-
  Sprawdź dostarczone dane wejściowe i obserwowany stan:

  Sprawdź błąd ściągania imagePullSecrets i Pod bez poświadczeń drukowania.

  Zastąp stary Secret Docker auth i uruchom ponownie niedziałającego odbiorcę. Dane Secretu API muszą zawierać poprawny dokument danych dostępowych Docker: zagnieżdżone auth albo zgodne pola username/password.
  Nie wyświetlaj wartości danych dostępowych ani nie zapisuj ich w historii powłoki.

  ```sh
  cat board.yaml
  kubectl describe pod -l app=board
  kubectl get secrets
  ```
hints.2.text: |-
  Sprawdź obserwowany wynik:

  - `source platform.env; kubectl get secret registry-pull -o json | jq -e 'env as $e | .type as $t | (if $t=="kubernetes.io/dockerconfigjson" then (.data[".dockerconfigjson"]|@base64d|fromjson|.auths) elif $t=="kubernetes.io/dockercfg" then (.data[".dockercfg"]|@base64d|fromjson) else {} end)[$e.REGISTRY] | if ((.auth//"")|length)>0 then ((.auth|gsub("[\r\n]";"")|@base64d)==($e.REGISTRY_USER+":"+$e.REGISTRY_PASSWORD)) else .username==$e.REGISTRY_USER and .password==$e.REGISTRY_PASSWORD end'` — Wypisuje `true` bez ujawniania danych dostępowych.
  - `source platform.env; kubectl get deployment board -o json | jq '{name:.metadata.name,replicas:.spec.replicas,worker:(.spec.template.spec.containers[]|select(.name=="worker")|{image,imagePullPolicy})}'; kubectl get pods -o json | jq '.items[] | select(.metadata.deletionTimestamp==null and any(.spec.containers[]?;.name=="worker")) | {pod:.metadata.name,pullSecrets:[.spec.imagePullSecrets[]?.name]}'` — Pokazuje `board`, liczbę replik `1`, dostarczone `PRIVATE_IMAGE`, `Always` i tylko `registry-pull`.
  - `kubectl rollout status deployment/board --timeout=10s; kubectl exec --pod-running-timeout=5s deployment/board -c worker -- wget -qO- -T 3 http://127.0.0.1:8080` — Rollout się kończy; HTTP zwraca `north-42`.
phrases.0: Oddzieliłem uwierzytelnianie registry od poświadczenia ściągania kubelet.
phrases.1: Obróciłem konsumenta Secret, zachowując niezmienne odniesienie do obrazu.
phrases.2: Zweryfikowałem świeże prywatne pobranie i odzyskaną odpowiedź aplikacji.
questions.0.points.0: Różni konsumenci zachowują niezależne referencje.
questions.0.points.1: Kubelet wykorzystuje ściągacz Pod identity.
questions.0.points.2: Sprawdź świeże uwierzytelnione ściąganie i bieżące obciążenie.
questions.0.prompt: Dlaczego pobieranie obrazów może zakończyć się niepowodzeniem po zmianie hasła w registry?
questions.1.points.0: Nie naprawia nazw obrazów ani brakujących skrótów.
questions.1.points.1: TLS zaufanie i osiągalność sieci pozostają oddzielone.
questions.1.points.2: Jego namespace i odniesienie do obciążenia muszą być zgodne.
questions.1.prompt: Czego nie rozwiązuje image pull Secret?
stages.0.objectives.0.text: Deployment `board` używa dostarczonego prywatnego obrazu, polityki `Always` i wyłącznie
  istniejącego Secret do uwierzytelniania w rejestrze.
stages.0.objectives.1.text: Deployment `board` ma żądaną liczbę replik `1`.
stages.0.objectives.2.text: Istniejący Secret do uwierzytelniania w rejestrze zawiera prawidłowe dane logowania
  do rejestru Docker zgodne z dostarczonym środowiskiem.
stages.0.objectives.3.text: Deployment `board` kończy rollout w przestrzeni nazw zatoki.
stages.0.objectives.4.text: Wewnątrz Poda Deployment `board` adres `http://127.0.0.1:8080` zwraca `north-42`.
diagnostics.platform_inputs: Kontrola replik zatrzymała się przed odczytem board; platform.env może nie istnieć, być nieczytelny lub kończyć się błędem podczas ładowania. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=registry-observation)
diagnostics.probe_0_0: Nie udało się sprawdzić prywatnej aplikacji; zmienne środowiska, JSON API, właściciele Deployment lub jednoznaczny kontener worker mogą nie istnieć albo być nieprawidłowe. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=registry-observation)
diagnostics.image: Obraz worker w board lub aktywnych Podach różni się od PRIVATE_IMAGE; szablon mógł zostać zmieniony albo starszy ReplicaSet nadal używa innego obrazu. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=registry-pod-contract)
diagnostics.policy: Worker w board lub aktywnym Podzie nie ma Always; ustawienia pamięci podręcznej lub Pody ze starszego szablonu mogą omijać nowe pobranie z rejestru. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=registry-pod-contract)
diagnostics.secrets: Nie znaleziono aktywnego Poda board lub jego efektywne pull Secrets różnią się od samego registry-pull; szablon lub ServiceAccount mógł dodać albo pominąć Secret. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=registry-pod-contract)
diagnostics.replicas: Żądana liczba replik nie wynosi 1 lub board jest nieczytelny; skalowanie w dół nie naprawia uwierzytelniania prywatnego obrazu. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=registry-replicas)
diagnostics.secret_type: registry-pull nie ma obsługiwanego typu poświadczeń Docker; ogólny Secret lub brak czytelnego typu nie zapewnia danych logowania do rejestru. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=registry-credential-document)
diagnostics.outer: Nie można zdekodować dokumentu poświadczeń Docker; wymagany klucz data, base64, JSON lub unikalność pól JSON mogą być nieprawidłowe. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=registry-credential-document)
diagnostics.auth: Dane uwierzytelniania są nieczytelne lub bezużyteczne; sprawdź dokładny wpis rejestru, base64 auth z dwukropkiem lub tekstowe pola username/password. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=registry-credential-auth)
diagnostics.credentials: Zdekodowane poświadczenia różnią się od platform.env; registry-pull może nadal zawierać stare hasło lub dane innego użytkownika. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=registry-credential-auth)
diagnostics.probe_0_2: Kontrola poświadczeń zatrzymała się przed szczegółową diagnostyką; platform.env, zmienne rejestru lub Python mogą być niedostępne. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=registry-observation)
diagnostics.rollout: board nie zakończył rollout w 3 sekundy; odrzucone poświadczenia rejestru, ponawianie pobrania obrazu lub awaria worker mogą blokować gotowość. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=registry-consumer-health)
diagnostics.http: Worker nie zwrócił north-42 na localhost:8080; może jeszcze nie działać, exec mógł się nie udać lub zmieniono polecenie HTTP albo treść. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=registry-consumer-health)
