  `Always` i tylko Secretu pobierania `registry-pull`.
stages.0.objectives.1.text: Deployment `board` ma żądaną liczbę replik `1`.
stages.0.objectives.2.text: Secret `registry-pull` ma typ `kubernetes.io/dockerconfigjson` i poprawne dane dostępowe
  Docker dla `REGISTRY`, zgodne z `platform.env` na workstation.
stages.0.objectives.3.text: Deployment `board` kończy rollout w przestrzeni nazw zatoki.
stages.0.objectives.4.text: Wewnątrz Poda Deployment `board` adres `http://127.0.0.1:8080` zwraca `north-42`.
