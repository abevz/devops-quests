title: Poświadczenia rejestru
brief: |
  Prywatny odbiorca `board` jest niedostępny.

  Pracuj na workstation w `~/quest` z plikami `platform.env`, `board.yaml`.

  **Wymagania:**
  - Deployment w przestrzeni nazw zatoki:
    - Nazwa: `board`.
    - Obraz: `PRIVATE_IMAGE` z `~/quest/platform.env` na workstation.
    - Polityka pobierania: `Always`.
    - Secret pobierania obrazu: `registry-pull`.
    - Brak innych Secretów pobierania obrazu.
    - Żądane repliki: `1`.
    - Rollout zakończony.
  - Secret w przestrzeni nazw zatoki:
    - Nazwa: `registry-pull`.
    - Typ: `kubernetes.io/dockerconfigjson`.
    - Dane dostępowe do `REGISTRY`: `REGISTRY_USER` i `REGISTRY_PASSWORD` z `~/quest/platform.env` na workstation.
  - HTTP wewnątrz Poda Deployment `board`:
    - Ścieżka: `http://127.0.0.1:8080`.
    - Odpowiedź: `north-42`.

  **Sprawdź przed Check & finish:**
  - `source platform.env; kubectl get secret registry-pull -o json | jq -e 'env as $e | .type=="kubernetes.io/dockerconfigjson" and ((.data[".dockerconfigjson"]|@base64d|fromjson|.auths[$e.REGISTRY].auth|@base64d)==($e.REGISTRY_USER+":"+$e.REGISTRY_PASSWORD))'` — Wypisuje `true` bez ujawniania danych dostępowych.
  - `source platform.env; kubectl get deployment board -o custom-columns=NAME:.metadata.name,REPLICAS:.spec.replicas,IMAGE:.spec.template.spec.containers[0].image,PULL:.spec.template.spec.containers[0].imagePullPolicy,SECRETS:.spec.template.spec.imagePullSecrets[*].name` — Pokazuje `board`, liczbę replik `1`, dostarczone `PRIVATE_IMAGE`, `Always` i tylko `registry-pull`.
  - `kubectl rollout status deployment/board --timeout=10s; kubectl exec --pod-running-timeout=5s deployment/board -- wget -qO- -T 3 http://127.0.0.1:8080` — Rollout się kończy; HTTP zwraca `north-42`.

  Base64 to kodowanie, nie szyfrowanie; bieżące sprawdzenia danych dostępowych, rollout i odpowiedzi nie dowodzą powodzenia każdego przyszłego pobrania.
debrief: Uwierzytelnianie rejestru i konfiguracja konsumencka Kubernetes były odrębnymi częściami rotacji.
stages.0.brief: Prywatne wydanie musi spełniać kontrakt danych dostępowych i odbiorcy.
hints.0.text: Pomyślne push z workstation nie uwierzytelnia kubelet.
hints.1.text: Sprawdź błąd ściągania imagePullSecrets i Pod bez poświadczeń drukowania.
hints.2.text: |-
  Zastąp stary Secret Docker auth i uruchom ponownie niedziałającego odbiorcę. Zarówno dane Secretu API, jak i zagnieżdżone auth muszą używać poprawnego kanonicznego base64.
  Nie wyświetlaj wartości danych dostępowych ani nie zapisuj ich w historii powłoki.
phrases.0: Oddzieliłem uwierzytelnianie registry od poświadczenia ściągania kubelet.
phrases.1: Obróciłem konsumenta Secret, zachowując niezmienne odniesienie do obrazu.
phrases.2: Zweryfikowałem świeże prywatne pobranie i odzyskaną odpowiedź aplikacji.
questions.0.points.0: Różni konsumenci zachowują niezależne referencje.
questions.0.points.1: Kubelet wykorzystuje ściągacz Pod identity.
questions.0.points.2: Sprawdź świeże uwierzytelnione ściąganie i bieżące obciążenie.
questions.0.prompt: Dlaczego pobieranie obrazów może zakończyć się niepowodzeniem po zmianie hasła w registry?
questions.1.points.0: Nie naprawia nazw obrazów ani brakujących skrótów.
questions.1.points.1: TLS zaufanie i osiągalność sieci pozostają oddzielone.
questions.1.points.2: Jego namespace i odniesienie do obciążenia muszą być zgodne.
questions.1.prompt: Czego nie rozwiązuje image pull Secret?
