diagnostics.replicas: deployment/board replicas musi być równe 1.
diagnostics.secrets: deployment/board imagePullSecrets musi być równe [registry-pull].
diagnostics.policy: deployment/board imagePullPolicy musi być równe Always.
diagnostics.secret_type: registry-pull type musi być równe kubernetes.io/dockerconfigjson.
diagnostics.outer: registry-pull dockerconfigjson musi używać kanonicznego base64.
diagnostics.auth: registry-pull auth musi używać kanonicznego base64.
diagnostics.credentials: Odkodowane registry-pull auth musi odpowiadać użytkownikowi i hasłu w platform.env.
diagnostics.rollout: Wdrożenie deployment/board musi się zakończyć.
diagnostics.http: Żądanie do localhost:8080 Poda board musi zwrócić north-42.
