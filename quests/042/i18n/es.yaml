title: Credenciales de registro
brief: 'El consumidor privado `board` no está disponible.


  Trabaja en la estación de trabajo en `~/quest` con `platform.env`, `board.yaml`.


  **Requisitos:**

  - El Deployment `board` usa la imagen privada suministrada, la política `Always` y solo el Secret existente
  de autenticación del registro.

  - El Deployment `board` tiene el número deseado de réplicas `1`.

  - El Secret existente de autenticación del registro contiene credenciales válidas de Docker que coinciden
  con el entorno suministrado.

  - El Deployment `board` completa su rollout en el namespace de la bahía.

  - Dentro de un Pod del Deployment `board`, `http://127.0.0.1:8080` devuelve `north-42`.


  Base64 es codificación, no cifrado; las comprobaciones actuales de credenciales, rollout y respuesta no prueban
  cada descarga futura.

  '
debrief: La autenticación del registro y la configuración del consumidor Kubernetes fueron partes separadas
  de la rotación.
stages.0.brief: La versión privada debe cumplir su contrato de credenciales y consumidor.
hints.0.text: Un push exitoso del workstation no autentica el kubelet.
hints.1.text: |-
  Inspecciona las entradas suministradas y el estado observado:

  Inspeccione el error de extracción imagePullSecrets y Pod sin imprimir las credenciales.

  Reemplaza el Secret Docker auth obsoleto y reinicia el consumidor fallido. Los datos del Secret API deben contener un documento válido de credenciales Docker: auth anidado o los campos username/password correspondientes.
  No muestres los valores de las credenciales ni los guardes en el historial del shell.

  ```sh
  cat board.yaml
  kubectl describe pod -l app=board
  kubectl get secrets
  ```
hints.2.text: |-
  Verifica el resultado observado:

  - `source platform.env; kubectl get secret registry-pull -o json | jq -e 'env as $e | .type as $t | (if $t=="kubernetes.io/dockerconfigjson" then (.data[".dockerconfigjson"]|@base64d|fromjson|.auths) elif $t=="kubernetes.io/dockercfg" then (.data[".dockercfg"]|@base64d|fromjson) else {} end)[$e.REGISTRY] | if ((.auth//"")|length)>0 then ((.auth|gsub("[\r\n]";"")|@base64d)==($e.REGISTRY_USER+":"+$e.REGISTRY_PASSWORD)) else .username==$e.REGISTRY_USER and .password==$e.REGISTRY_PASSWORD end'` — Imprime `true` sin revelar credenciales.
  - `source platform.env; kubectl get deployment board -o json | jq '{name:.metadata.name,replicas:.spec.replicas,worker:(.spec.template.spec.containers[]|select(.name=="worker")|{image,imagePullPolicy})}'; kubectl get pods -o json | jq '.items[] | select(.metadata.deletionTimestamp==null and any(.spec.containers[]?;.name=="worker")) | {pod:.metadata.name,pullSecrets:[.spec.imagePullSecrets[]?.name]}'` — Muestra `board`, réplicas `1`, el `PRIVATE_IMAGE` suministrado, `Always` y solo `registry-pull`.
  - `kubectl rollout status deployment/board --timeout=10s; kubectl exec --pod-running-timeout=5s deployment/board -c worker -- wget -qO- -T 3 http://127.0.0.1:8080` — El rollout se completa; HTTP devuelve `north-42`.
phrases.0: Separé la autenticación registry de la credencial de extracción kubelet.
phrases.1: Roté el consumidor Secret manteniendo la referencia de imagen inmutable.
phrases.2: Verifiqué una nueva extracción privada y la respuesta de la aplicación recuperada.
questions.0.points.0: Diferentes consumidores conservan credenciales independientes.
questions.0.points.1: Kubelet utiliza el tirador Pod identity.
questions.0.points.2: Verifique una extracción autenticada nueva y la carga de trabajo en ejecución.
questions.0.prompt: ¿Por qué pueden fallar las extracciones de imágenes después de una rotación de contraseña
  registry?
questions.1.points.0: No repara nombres de imágenes ni resúmenes faltantes.
questions.1.points.1: TLS la confianza y la accesibilidad de la red permanecen separadas.
questions.1.points.2: Su referencia namespace y la carga de trabajo deben coincidir.
questions.1.prompt: ¿Qué no resuelve una imagen pull Secret?
stages.0.objectives.0.text: El Deployment `board` usa la imagen privada suministrada, la política `Always`
  y solo el Secret existente de autenticación del registro.
stages.0.objectives.1.text: El Deployment `board` tiene el número deseado de réplicas `1`.
stages.0.objectives.2.text: El Secret existente de autenticación del registro contiene credenciales válidas
  de Docker que coinciden con el entorno suministrado.
stages.0.objectives.3.text: El Deployment `board` completa su rollout en el namespace de la bahía.
stages.0.objectives.4.text: Dentro de un Pod del Deployment `board`, `http://127.0.0.1:8080` devuelve `north-42`.
diagnostics.platform_inputs: La comprobación de réplicas se detuvo antes de leer board; platform.env puede faltar, ser ilegible o fallar al cargarse. [Causa y comprobación](guides#guide=gitops-delivery&section=registry-observation)
diagnostics.probe_0_0: No se pudo inspeccionar la carga privada; pueden faltar o ser inválidos los valores del entorno, JSON de la API, propietarios del Deployment o un contenedor worker único. [Causa y comprobación](guides#guide=gitops-delivery&section=registry-observation)
diagnostics.image: La imagen de worker en board o sus Pods activos difiere de PRIVATE_IMAGE; una edición de plantilla o un ReplicaSet anterior puede usar otra imagen. [Causa y comprobación](guides#guide=gitops-delivery&section=registry-pod-contract)
diagnostics.policy: Falta Always en worker de board o en un Pod activo; la caché o los Pods de una plantilla anterior pueden evitar una nueva descarga del registro. [Causa y comprobación](guides#guide=gitops-delivery&section=registry-pod-contract)
diagnostics.secrets: No hay Pod activo de board o sus Secrets efectivos de descarga no son solo registry-pull; la plantilla o ServiceAccount puede haber añadido u omitido un Secret. [Causa y comprobación](guides#guide=gitops-delivery&section=registry-pod-contract)
diagnostics.replicas: El número deseado de réplicas no es 1 o board no puede leerse; reducir las réplicas no repara la autenticación de la imagen privada. [Causa y comprobación](guides#guide=gitops-delivery&section=registry-replicas)
diagnostics.secret_type: registry-pull no tiene un tipo Docker admitido; un Secret genérico o un tipo ausente o ilegible no proporciona credenciales del registro. [Causa y comprobación](guides#guide=gitops-delivery&section=registry-credential-document)
diagnostics.outer: No se puede decodificar el documento de credenciales Docker; la clave data, base64, JSON o la unicidad de sus campos puede ser inválida. [Causa y comprobación](guides#guide=gitops-delivery&section=registry-credential-document)
diagnostics.auth: Los datos de autenticación son ilegibles o inválidos; revise la entrada exacta del registro, auth en base64 con dos puntos o campos de texto username/password. [Causa y comprobación](guides#guide=gitops-delivery&section=registry-credential-auth)
diagnostics.credentials: Las credenciales decodificadas difieren de platform.env; registry-pull puede conservar la contraseña retirada o las de otro usuario. [Causa y comprobación](guides#guide=gitops-delivery&section=registry-credential-auth)
diagnostics.probe_0_2: La prueba de credenciales se detuvo antes del diagnóstico detallado; platform.env, las variables del registro o Python pueden no estar disponibles. [Causa y comprobación](guides#guide=gitops-delivery&section=registry-observation)
diagnostics.rollout: board no completó el despliegue en 3 segundos; credenciales rechazadas, reintentos de descarga o fallos de worker pueden impedir que esté listo. [Causa y comprobación](guides#guide=gitops-delivery&section=registry-consumer-health)
diagnostics.http: worker no devolvió north-42 en localhost:8080; puede no estar ejecutándose, exec puede fallar o el comando HTTP o contenido ha cambiado. [Causa y comprobación](guides#guide=gitops-delivery&section=registry-consumer-health)
