title: Credenciales de registro
brief: 'El consumidor privado `board` no está disponible.


  Trabaja en la estación de trabajo en `~/quest` con `platform.env`, `board.yaml`.


  **Requisitos:**

  - El Deployment `board` usa la imagen privada suministrada, la política `Always` y solo el Secret existente
  de autenticación del registro.

  - El Deployment `board` tiene el número deseado de réplicas `1`.

  - El Secret existente de autenticación del registro contiene credenciales válidas de Docker que coinciden
  con el entorno suministrado.

  - El Deployment `board` completa su rollout en el namespace de la bahía.

  - Dentro de un Pod del Deployment `board`, `http://127.0.0.1:8080` devuelve `north-42`.


  Base64 es codificación, no cifrado; las comprobaciones actuales de credenciales, rollout y respuesta no prueban
  cada descarga futura.

  '
debrief: La autenticación del registro y la configuración del consumidor Kubernetes fueron partes separadas
  de la rotación.
stages.0.brief: La versión privada debe cumplir su contrato de credenciales y consumidor.
hints.0.text: Un push exitoso del workstation no autentica el kubelet.
hints.1.text: 'Inspecciona las entradas suministradas y el estado observado:


  ```sh

  cat board.yaml

  kubectl describe pod -l app=board

  kubectl get secrets

  ```'
hints.2.text: |-
  Inspeccione el error de extracción imagePullSecrets y Pod sin imprimir las credenciales.

  Reemplaza el Secret Docker auth obsoleto y reinicia el consumidor fallido. Los datos del Secret API deben contener un documento válido de credenciales Docker: auth anidado o los campos username/password correspondientes.
  No muestres los valores de las credenciales ni los guardes en el historial del shell.

  Verifica el resultado observado:

  - `source platform.env; kubectl get secret registry-pull -o json | jq -e 'env as $e | .type as $t | (if $t=="kubernetes.io/dockerconfigjson" then (.data[".dockerconfigjson"]|@base64d|fromjson|.auths) elif $t=="kubernetes.io/dockercfg" then (.data[".dockercfg"]|@base64d|fromjson) else {} end)[$e.REGISTRY] | if ((.auth//"")|length)>0 then ((.auth|gsub("[\r\n]";"")|@base64d)==($e.REGISTRY_USER+":"+$e.REGISTRY_PASSWORD)) else .username==$e.REGISTRY_USER and .password==$e.REGISTRY_PASSWORD end'` — Imprime `true` sin revelar credenciales.
  - `source platform.env; kubectl get deployment board -o json | jq '{name:.metadata.name,replicas:.spec.replicas,worker:(.spec.template.spec.containers[]|select(.name=="worker")|{image,imagePullPolicy})}'; kubectl get pods -o json | jq '.items[] | select(.metadata.deletionTimestamp==null and any(.spec.containers[]?;.name=="worker")) | {pod:.metadata.name,pullSecrets:[.spec.imagePullSecrets[]?.name]}'` — Muestra `board`, réplicas `1`, el `PRIVATE_IMAGE` suministrado, `Always` y solo `registry-pull`.
  - `kubectl rollout status deployment/board --timeout=10s; kubectl exec --pod-running-timeout=5s deployment/board -c worker -- wget -qO- -T 3 http://127.0.0.1:8080` — El rollout se completa; HTTP devuelve `north-42`.

phrases.0: Separé la autenticación registry de la credencial de extracción kubelet.
phrases.1: Roté el consumidor Secret manteniendo la referencia de imagen inmutable.
phrases.2: Verifiqué una nueva extracción privada y la respuesta de la aplicación recuperada.
questions.0.points.0: Diferentes consumidores conservan credenciales independientes.
questions.0.points.1: Kubelet utiliza el tirador Pod identity.
questions.0.points.2: Verifique una extracción autenticada nueva y la carga de trabajo en ejecución.
questions.0.prompt: ¿Por qué pueden fallar las extracciones de imágenes después de una rotación de contraseña
  registry?
questions.1.points.0: No repara nombres de imágenes ni resúmenes faltantes.
questions.1.points.1: TLS la confianza y la accesibilidad de la red permanecen separadas.
questions.1.points.2: Su referencia namespace y la carga de trabajo deben coincidir.
questions.1.prompt: ¿Qué no resuelve una imagen pull Secret?
diagnostics.image: |-
  La imagen de worker en deployment/board debe ser igual a PRIVATE_IMAGE.

diagnostics.replicas: deployment/board replicas debe ser igual a 1.
diagnostics.secrets: |-
  Cada Pod activo de deployment/board debe utilizar únicamente registry-pull como Secret efectivo para descargar imágenes.

diagnostics.policy: |-
  worker en deployment/board y sus Pods activos debe utilizar imagePullPolicy Always.

diagnostics.secret_type: |-
  registry-pull debe utilizar un tipo Secret de credenciales Docker: kubernetes.io/dockerconfigjson o kubernetes.io/dockercfg.

diagnostics.outer: |-
  registry-pull debe contener un documento válido de credenciales Docker.

diagnostics.auth: |-
  registry-pull debe contener credenciales utilizables: auth o username/password.

diagnostics.credentials: |-
  Las credenciales de registry-pull deben coincidir con usuario y contraseña de platform.env.

diagnostics.rollout: El despliegue de deployment/board debe completarse.
diagnostics.http: La petición a localhost:8080 del Pod board debe devolver north-42.
