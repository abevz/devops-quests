title: Credenciales de registro
brief: 'El registry privado ya utiliza la nueva contraseña exclusiva para juegos de platform.env. El board
  Deployment todavía hace referencia a registry-pull que contiene una contraseña retired. Gire este consumidor
  Secret, mantenga la imagen privada inmutable y la política de extracción Always, y recupere el HTTP
  board. No cambie el servicio registry.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `platform.env`, `board.json`,
  `registry-pull.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: registry-pull contiene la credencial actual; board tira con Always y sirve
  a north-42.'
debrief: La autenticación del registro y la configuración del consumidor Kubernetes fueron partes separadas
  de la rotación.
stages.0.brief: 'Criterios de éxito: registry-pull contiene la credencial actual; board tira con Always
  y sirve para north-42.'
stages.0.objectives.0.text: registry-pull contiene la credencial actual; board tira con Always y sirve
  para north-42.
hints.0.text: Un push exitoso del workstation no autentica el kubelet.
hints.1.text: Inspeccione el error de extracción imagePullSecrets y Pod sin imprimir las credenciales.
hints.2.text: Reemplace el Docker auth Secret y reinicie el consumidor fallido.
phrases.0: Separé la autenticación registry de la credencial de extracción kubelet.
phrases.1: Roté el consumidor Secret manteniendo la referencia de imagen inmutable.
phrases.2: Verifiqué una nueva extracción privada y la respuesta de la aplicación recuperada.
questions.0.points.0: Diferentes consumidores conservan credenciales independientes.
questions.0.points.1: Kubelet utiliza el tirador Pod identity.
questions.0.points.2: Verifique una extracción autenticada nueva y la carga de trabajo en ejecución.
questions.0.prompt: ¿Por qué pueden fallar las extracciones de imágenes después de una rotación de contraseña
  registry?
questions.1.points.0: No repara nombres de imágenes ni resúmenes faltantes.
questions.1.points.1: TLS la confianza y la accesibilidad de la red permanecen separadas.
questions.1.points.2: Su referencia namespace y la carga de trabajo deben coincidir.
questions.1.prompt: ¿Qué no resuelve una imagen pull Secret?
