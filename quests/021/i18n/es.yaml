title: Readiness y puertos
brief: 'Te uniste a las operaciones de SignalRail. El módulo de cronograma se ejecutó pero nunca estuvo
  listo. Trabajar en ~/quest. Mantenga todos los cambios dentro de esta bahía de entrenamiento.


  Entradas en `~/quest`: `deployment.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente los archivos suministrados, las imágenes
  precargadas y los servicios privados. Todos los cambios deben permanecer dentro de esta bahía.


  Criterios de éxito iniciales: Readiness pasa por relay.'
stages.0.brief: 'El worker escucha en 8080. Descubra por qué falló la verificación de readiness.


  Criterios de éxito: Readiness pasa por relay.'
stages.0.objectives.0.text: Readiness pasa por relay.
hints.0.text: Lea los eventos pod y inspect o HTTP probe.
hints.1.text: Verifique tanto el puerto probe como la ruta con el servidor real.
hints.2.text: El servidor responde / en 8080; corrija ambos campos y espere readiness.
debrief: La preparación probe utilizó el puerto incorrecto. Lo emparejó con el HTTP listener y esperó
  el rollout.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el estado de workload y su preparación después del cambio.
