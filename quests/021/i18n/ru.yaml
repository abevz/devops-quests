title: Readiness и порты
brief: 'Вы в команде эксплуатации SignalRail. Pod работал, но readiness не проходил. Работайте в ~/quest.
  Все изменения — только в этой песочнице.


  Входные файлы в `~/quest`: `deployment.json`.


  В песочнице нет интернета и внешнего DNS. Используйте только выданные файлы, предварительно загруженные
  образы и приватные сервисы. Все изменения — только в этой песочнице.


  Цели первого этапа: Readiness relay проходит.'
stages.0.brief: 'Worker слушает 8080. Найдите причину сбоя readiness.


  Результат проверки: Readiness relay проходит.'
stages.0.objectives.0.text: Readiness relay проходит.
hints.0.text: Прочитайте события pod и проверьте HTTP probe.
hints.1.text: Сравните и порт, и путь probe с реальным сервером.
hints.2.text: Сервер отвечает на / через 8080; исправьте оба поля и дождитесь readiness.
debrief: Readiness probe использовала неверный порт. Вы согласовали её с HTTP listener и дождались rollout.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: После изменения я проверил состояние workload и его готовность.
