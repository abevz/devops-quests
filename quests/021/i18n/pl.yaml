title: Readiness i porty
brief: 'Dołączyłeś do operacji SignalRail. Kapsuła z rozkładem jazdy działała, ale nigdy nie była gotowa.
  Pracuj w ~/quest. Wszystkie zmiany przechowuj w tej komorze szkoleniowej.


  Wejścia w `~/quest`: `deployment.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Wszystkie zmiany muszą pozostać w tej zatoce.


  Wstępne kryteria sukcesu: Sprawdzenie readiness przechodzi dla relay.'
stages.0.brief: 'worker nasłuchuje na 8080. Dowiedz się, dlaczego sprawdzenie readiness nie powiodło się.


  Kryteria sukcesu: Sprawdzenie readiness przechodzi dla relay.'
stages.0.objectives.0.text: Gotowość przechodzi do relay.
hints.0.text: Przeczytaj zdarzenia pod i sprawdź HTTP probe.
hints.1.text: Sprawdź port i ścieżkę probe w odniesieniu do rzeczywistego serwera.
hints.2.text: Serwer odpowiada / na 8080; napraw oba pola i poczekaj na readiness.
debrief: Sonda gotowości użyła niewłaściwego portu. Dopasowałeś go do HTTP listener i czekałeś na rollout.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
