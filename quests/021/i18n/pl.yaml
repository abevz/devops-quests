title: Readiness i porty
brief: |
  Usługa rozkładu jazdy jest niedostępna.

  Pracuj na workstation w `~/quest` z plikami `deployment.yaml`.

  **Wymagania:**
  - Dostępność obciążenia:
    - Deployment: `relay`.
    - Stan: Rollout zakończony.

  **Sprawdź przed Check & finish:**
  - `kubectl get deployment relay` — pokazuje liczbę zaktualizowanych i dostępnych replik zgodną z liczbą żądaną.
  - `kubectl rollout status deployment/relay --timeout=3s` — kończy się kodem `0` i zgłasza zakończony rollout.
stages.0.brief: |
  Obciążenie usługi rozkładu jazdy musi stać się dostępne.
stages.0.objectives.0.text: Deployment `relay` kończy rollout.
hints.0.text: Przeczytaj zdarzenia pod i sprawdź HTTP probe.
hints.1.text: Sprawdź port i ścieżkę probe w odniesieniu do rzeczywistego serwera.
hints.2.text: Serwer odpowiada / na 8080; napraw oba pola i poczekaj na readiness.
debrief: Sonda gotowości użyła niewłaściwego portu. Dopasowałeś go do HTTP listener i czekałeś na rollout.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
