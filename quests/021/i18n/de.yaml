title: Readiness und Ports
brief: |
  Der Fahrplandienst ist nicht verfügbar.

  Arbeiten Sie auf der Workstation in `~/quest` mit `deployment.json`.

  **Anforderungen:**
  - Verfügbarkeit des Workloads:
    - Deployment: `relay`.
    - Status: Rollout abgeschlossen.

  **Selbstprüfung vor Check & finish:**
  - `kubectl get deployment relay` — zeigt aktualisierte und verfügbare Replikazahlen entsprechend der Sollzahl.
  - `kubectl rollout status deployment/relay --timeout=3s` — endet mit Code `0` und meldet einen abgeschlossenen Rollout.
stages.0.brief: |
  Der Fahrplan-Workload muss verfügbar werden.
stages.0.objectives.0.text: Deployment `relay` schließt seinen Rollout ab.
hints.0.text: Lesen Sie pod-Ereignisse und inspect die HTTP probe.
hints.1.text: Überprüfen Sie sowohl den probe-Port als auch den Pfad mit dem tatsächlichen Server.
hints.2.text: Der Server antwortet / auf 8080; Korrigieren Sie beide Felder und warten Sie auf readiness.
debrief: Die Bereitschaft probe hat den falschen Port verwendet. Sie haben es dem HTTP listener zugeordnet
  und auf den rollout gewartet.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe den workload-Status und seine Bereitschaft nach der Änderung überprüft.
