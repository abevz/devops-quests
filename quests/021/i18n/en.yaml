title: Readiness and ports
brief: 'You joined SignalRail operations. The timetable pod ran but never became ready. Work in ~/quest.
  Keep all changes inside this training bay.


  Inputs in `~/quest`: `deployment.json`.


  The bay has no Internet or external DNS. Use only its supplied files, preloaded images and private services.
  All changes must stay inside this bay.


  Initial success criteria: Readiness passes for relay.'
stages.0.brief: 'The worker listens on 8080. Find why the readiness check failed.


  Success criteria: Readiness passes for relay.'
stages.0.objectives.0.text: Readiness passes for relay.
hints.0.text: Read pod events and inspect the HTTP probe.
hints.1.text: Check both the probe port and path against the actual server.
hints.2.text: The server answers / on 8080; fix both fields and wait for readiness.
debrief: The readiness probe used the wrong port. You matched it to the HTTP listener and waited for the
  rollout.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked the workload state and its readiness after the change.
