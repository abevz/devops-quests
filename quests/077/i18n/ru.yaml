title: Обслуживание с PDB
brief: |
  Сервису нужно безопасное окно добровольного обслуживания с сохранением доступности. Сохраните предоставленный 10-секундный hook preStop, чтобы завершение оставалось наблюдаемым.

  Работайте в `~/quest` на workstation. Предоставленные входные файлы: `board.yaml`, `service.yaml`, `client.yaml`, `pdb.yaml`, `evict-one.sh`, `original-pod-uids.json`.

  **Требования:**
  - Внутри контейнера `worker` Deployment `client` HTTP-запрос к `http://board:8080` возвращает `north-77`.
  - PDB `board-budget` защищает Pod с меткой `app=board` и требует минимум один здоровый Pod.
  - Deployment `board` имеет ровно две реплики, обе готовы.
  - PDB `board-budget` сообщает:
    - Здоровых: `2`
    - Требуется здоровых: `1`
    - Разрешённых прерываний: `1`
  - В `~/quest` на workstation файл `eviction.json` содержит запрос Eviction API для исходного Pod этого полигона:
    - API: `policy/v1`
    - Вид: `Eviction`
    - Пространство имён: `$DQ_NAMESPACE`
    - Предусловие UID: UID исходного Pod
  - Выбранный Pod отсутствует, и остаётся ровно один исходный Pod. Исходный список UID защищён на workstation:
    - `/run/dq/facts/0/original-pod-uids.json`
  - Сервер подтверждает вытеснение выбранного исходного Pod через Eviction API; квитанция доступна только для чтения на workstation:
    - `/run/dq/observations/evictions.json`
  - Ваша учётная запись полигона не может изменять статус Pod через patch.

  **Проверьте самостоятельно перед Check & finish:**
  Выполняйте эти команды наблюдения из `~/quest` на workstation.
  - `kubectl exec deployment/client -c worker -- wget -qO- -T 3 http://board:8080` — Потребитель сервиса получает `north-77`.
  - Селектор и числа здоровых Pod и прерываний соответствуют требованиям, обе реплики готовы, ответ авторизации — `no`.

    ```sh
    kubectl get pdb board-budget -o yaml
    kubectl get deployment board
    kubectl auth can-i patch pods --subresource=status
    ```
  - Запрос указывает этот полигон и UID исходного Pod как предусловие. Этого UID нет среди текущих Pod, но он есть в серверной квитанции; остаётся ровно один исходный Pod.

    ```sh
    cat eviction.json
    cat /run/dq/facts/0/original-pod-uids.json
    kubectl get pods -l app=board -o json
    cat /run/dq/observations/evictions.json
    ```

  PDB управляет добровольным вытеснением; он не предотвращает потерю узла, прямое удаление Pod или rollout Deployment, а изменённый файл запроса не доказывает наблюдаемое сервером вытеснение.
debrief: Обслуживание имеет явный минимум исправных реплик, проверенный реальным eviction
  и запросами сервиса.
stages.0.brief: |
  Завершите наблюдаемое добровольное обслуживание и восстановите обе здоровые реплики.
stages.0.objectives.0.text: PDB `board-budget` защищает Pods с меткой `app=board` и требует хотя бы один
  здоровый Pod.
stages.0.objectives.1.text: Deployment `board` имеет ровно две реплики, обе готовы.
stages.0.objectives.2.text: PDB `board-budget` сообщает о двух здоровых Pods, минимуме в один здоровый
  Pod и одном разрешённом прерывании.
stages.0.objectives.3.text: HTTP-запрос из Deployment `client` к `http://board:8080` возвращает `north-77`.
stages.0.objectives.4.text: '`eviction.json` содержит запрос Eviction API для исходного Pod board в этом
  стенде с проверкой UID этого Pod.'
stages.0.objectives.5.text: Pod board, выбранный для вытеснения, отсутствует; остаётся ровно один исходный
  Pod board.
stages.0.objectives.6.text: Сервер подтверждает, что исходный Pod из `eviction.json` был вытеснен через
  Eviction API.
stages.0.objectives.7.text: Учётная запись стенда не может изменять статус Pod через patch.
hints.0.text: Требование двух из двух не оставляет возможности добровольного обслуживания.
hints.1.text: Сохраните selector и число реплик; измените только минимальное число
  исправных.
hints.2.text: |
  Дождитесь disruptionsAllowed=1; затем bash evict-one.sh отправляет запрос Eviction API с предусловием UID и проверяет HTTP во время замены. Проверьте восстановление. Backend наблюдает DisruptionTarget с причиной EvictionByEvictionAPI при завершении; прямое удаление или правка JSON не создают эту квитанцию. Предоставленный 10-секундный hook preStop сохраняет наблюдаемость при опросе каждые 2.5 секунды; сохраните его.
phrases.0: Я согласовал disruption budget с числом доступных реплик.
phrases.1: Я использовал Eviction API вместо прямого удаления.
phrases.2: Я различал защиту добровольного обслуживания и восстановление после отказа.
questions.0.points.0: Он ограничивает добровольные disruptions через Eviction API.
questions.0.points.1: Он не предотвращает отказ машины и прямое удаление.
questions.0.points.2: Доступность rollout Deployment задаётся отдельной стратегией.
questions.0.prompt: Какие disruptions ограничивает PDB?
questions.1.points.0: Budget может требовать исправности обеих реплик.
questions.1.points.1: Проверить selector, число исправных и disruptionsAllowed.
questions.1.points.2: Выбрать минимум, согласованный с требованиями обслуживания.
questions.1.prompt: Почему исправный сервис с двумя репликами может отклонять eviction?
