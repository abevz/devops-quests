title: Обслуживание с PDB
brief: 'Две реплики board исправны, но minAvailable: 2 запрещает любой добровольный
  eviction. Измените board-budget на minAvailable: 1 без изменения selector и числа
  реплик. Для безопасной проверки обслуживания bash evict-one.sh передаёт текущий
  UID Pod как precondition запроса Eviction API и проверяет HTTP при замене. Проверяемый
  результат — серверное подтверждение Eviction API, замена одного исходного Pod и
  восстановление нужного минимума исправных реплик. В конце нужны две исправные реплики
  и один разрешённый disruption. PDB управляет добровольным eviction, но не предотвращает
  потерю узла, прямое удаление Pod и rollout Deployment.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `board.json`, `service.json`,
  `client.json`, `pdb.json`, `evict-one.sh`, `eviction.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно
  загруженные образы и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Две исправные реплики отдают north-77; соответствующий PDB требует
  одну исправную реплику и разрешает один добровольный disruption.


  Проверка также подтверждает, что UID в `eviction.json` принадлежал исходному Pod
  и заменён ровно один исходный Pod.


  При завершении исходного Pod backend должен увидеть серверный condition DisruptionTarget
  с reason EvictionByEvictionAPI. Прямое удаление и редактирование JSON не создают
  такую квитанцию.


  Выданный preStop на 10 секунд сохраняет наблюдаемость завершения при обычном опросе
  backend раз в 2,5 секунды; сохраните hook.'
debrief: Обслуживание имеет явный минимум исправных реплик, проверенный реальным eviction
  и запросами сервиса.
stages.0.brief: 'Результат проверки: Две исправные реплики отдают north-77; соответствующий
  PDB требует одну исправную реплику и разрешает один добровольный disruption.'
stages.0.objectives.0.text: Две исправные реплики отдают north-77; соответствующий
  PDB требует одну исправную реплику и разрешает один добровольный disruption.
hints.0.text: Требование двух из двух не оставляет возможности добровольного обслуживания.
hints.1.text: Сохраните selector и число реплик; измените только минимальное число
  исправных.
hints.2.text: Дождитесь disruptionsAllowed=1, используйте helper Eviction API и проверьте
  восстановление.
phrases.0: Я согласовал disruption budget с числом доступных реплик.
phrases.1: Я использовал Eviction API вместо прямого удаления.
phrases.2: Я различал защиту добровольного обслуживания и восстановление после отказа.
questions.0.points.0: Он ограничивает добровольные disruptions через Eviction API.
questions.0.points.1: Он не предотвращает отказ машины и прямое удаление.
questions.0.points.2: Доступность rollout Deployment задаётся отдельной стратегией.
questions.0.prompt: Какие disruptions ограничивает PDB?
questions.1.points.0: Budget может требовать исправности обеих реплик.
questions.1.points.1: Проверить selector, число исправных и disruptionsAllowed.
questions.1.points.2: Выбрать минимум, согласованный с требованиями обслуживания.
questions.1.prompt: Почему исправный сервис с двумя репликами может отклонять eviction?
