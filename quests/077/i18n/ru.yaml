hints.0.text: Бюджет прерываний учитывает фактическую готовность, а не только желаемое число реплик. Во
  время обслуживания приложение должно работать, пока готовится замена.
hints.1.text: |-
  Сравните readiness probe Pod, события её отказов и состояние PDB, прежде чем решать, безопасен ли eviction.

  ```sh
  kubectl describe pods -l app=board
  kubectl get pdb -o yaml
  kubectl get pods -l app=board -o yaml
  ```
hints.2.text: |-
  Восстановите условие readiness внутри существующего Pod, не заменяя его. Когда бюджет разрешит обслуживание, самостоятельно составьте policy/v1 Eviction в `eviction.json` с именем исходного Pod, `$DQ_NAMESPACE` и `deleteOptions.preconditions.uid`; отправьте его в подресурс eviction этого Pod. Сохраните выданное окно завершения.

  Проверьте две готовые реплики, минимум здоровых Pod и допустимое прерывание, непрерывность HTTP, ровно один сохранившийся исходный UID и серверное подтверждение для вытесненного UID.

  ```sh
  kubectl get deployment board
  kubectl get pdb
  cat eviction.json
  cat /run/dq/observations/evictions.json
  kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080
  kubectl auth can-i patch pods --subresource=status
  ```
phrases.0: Я согласовал disruption budget с числом доступных реплик.
phrases.1: Я использовал Eviction API вместо прямого удаления.
phrases.2: Я различал защиту добровольного обслуживания и восстановление после отказа.
questions.0.points.0: Он ограничивает добровольные disruptions через Eviction API.
questions.0.points.1: Он не предотвращает отказ машины и прямое удаление.
questions.0.points.2: Доступность rollout Deployment задаётся отдельной стратегией.
questions.0.prompt: Какие disruptions ограничивает PDB?
questions.1.points.0: Budget может требовать исправности обеих реплик.
questions.1.points.1: Проверить selector, число исправных и disruptionsAllowed.
questions.1.points.2: Выбрать минимум, согласованный с требованиями обслуживания.
questions.1.prompt: Почему исправный сервис с двумя репликами может отклонять eviction?
diagnostics.probe_0_0: Бюджет может выбирать другие Pod либо не сохранять доступную реплику; сохраните идентичность board в selector и ровно одно поле доступности с округлённым минимумом не меньше единицы. Ошибки API или структуры объекта также дают fallback. [Причина и проверка](guides#guide=kubernetes-17&section=maintenance-pdb-selector-and-retained-availability)
diagnostics.pdb_replicas: Setup удаляет readiness-флаг одного существующего Pod; восстановите готовность и сохраните две реплики, не заменяя оба исходных Pod из-за неготовности. [Причина и проверка](guides#guide=kubernetes-17&section=maintenance-original-readiness-fault)
diagnostics.pdb_status: Выданный минимум две реплики и неготовый Pod блокируют обслуживание; восстановите две здоровые реплики и требуемый минимум одну, чтобы controller разрешил одно disruption. [Причина и проверка](guides#guide=kubernetes-17&section=maintenance-healthy-pods-and-one-disruption)
diagnostics.pdb_http: Клиент может потерять ответ Service из-за неготовых endpoints или неверного selector; проверяйте north-77 через выданные client и Service при восстановлении. [Причина и проверка](guides#guide=kubernetes-17&section=maintenance-client-service-availability)
diagnostics.eviction_request: Сохранённый запрос может относиться к другому namespace или не содержать precondition исходного UID; нужен policy/v1 Eviction для текущего namespace с UID из зафиксированного списка. [Причина и проверка](guides#guide=kubernetes-17&section=maintenance-eviction-original-uid-precondition)
diagnostics.eviction_replacement: Целевой Pod может ещё завершаться либо замена обоих удалила оба исходных UID; дождитесь исчезновения запрошенного UID, сохраняя ровно один исходный. [Причина и проверка](guides#guide=kubernetes-17&section=maintenance-one-original-pod-survives)
diagnostics.eviction_observed: Обычное удаление не подтверждает Eviction API; защищённый observer должен увидеть исходный UID с API-условием disruption до исчезновения Pod. Сохраните graceful termination и реальный API-запрос. [Причина и проверка](guides#guide=kubernetes-17&section=maintenance-protected-api-eviction-receipt)
diagnostics.pod_status_denied: Другой контекст или расширенные права могут разрешать patch статуса Pod; сохраните выданную ограниченную идентичность. Ошибки API/транспорта также мешают ожидаемому ответу no. [Причина и проверка](guides#guide=kubernetes-17&section=maintenance-limited-pod-status-authority)
