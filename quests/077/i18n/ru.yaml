hints.0.text: Бюджет прерываний сочетает добровольное обслуживание с доступностью приложения.
hints.1.text: 'Требование двух из двух не оставляет возможности добровольного обслуживания.


  Сохраните selector и число реплик; измените только минимальное число исправных.


  Изучите поставленные определения, текущие ресурсы и события.


  ```sh

  cat pdb.yaml

  kubectl get pdb board-budget -o yaml

  kubectl describe deployment board

  cat eviction.json

  kubectl get pods -l app=board -o yaml

  cat /run/dq/observations/evictions.json

  ```'
hints.2.text: 'Дождитесь disruptionsAllowed=1; затем bash evict-one.sh отправляет запрос Eviction API с предусловием
  UID и проверяет HTTP во время замены. Проверьте восстановление. Backend наблюдает DisruptionTarget с причиной
  EvictionByEvictionAPI при завершении; прямое удаление или правка JSON не создают эту квитанцию. Предоставленный
  10-секундный hook preStop сохраняет наблюдаемость при опросе каждые 2.5 секунды; сохраните его.


  Проверьте наблюдаемый результат:


  ```sh

  kubectl get deployment board

  kubectl get pdb board-budget

  kubectl exec deployment/client -c worker -- wget -qO- -T 3 http://board:8080

  kubectl auth can-i patch pods --subresource=status

  ```


  Ожидаются две готовые реплики, два исправных Pod, минимум один и одно разрешённое прерывание; HTTP возвращает
  north-77, авторизация — no. Выбранный исходный Pod отсутствует, ровно один исходный остаётся, серверная квитанция
  подтверждает eviction выбранного UID.


  Поставленные ограничения и подробности: PDB `board-budget` защищает Pods с меткой `app=board` и требует хотя
  бы один здоровый Pod. PDB `board-budget` сообщает о двух здоровых Pods, минимуме в один здоровый Pod и одном
  разрешённом прерывании.


  В ~/quest на рабочей станции eviction.json должен описывать policy/v1 Eviction в $DQ_NAMESPACE с предусловием
  исходного UID Pod. Сохраните поставленный preStop hook на 10 секунд: он позволяет серверу наблюдать завершение.'
phrases.0: Я согласовал disruption budget с числом доступных реплик.
phrases.1: Я использовал Eviction API вместо прямого удаления.
phrases.2: Я различал защиту добровольного обслуживания и восстановление после отказа.
questions.0.points.0: Он ограничивает добровольные disruptions через Eviction API.
questions.0.points.1: Он не предотвращает отказ машины и прямое удаление.
questions.0.points.2: Доступность rollout Deployment задаётся отдельной стратегией.
questions.0.prompt: Какие disruptions ограничивает PDB?
questions.1.points.0: Budget может требовать исправности обеих реплик.
questions.1.points.1: Проверить selector, число исправных и disruptionsAllowed.
questions.1.points.2: Выбрать минимум, согласованный с требованиями обслуживания.
questions.1.prompt: Почему исправный сервис с двумя репликами может отклонять eviction?
