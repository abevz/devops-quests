title: Обслуживание с PDB
brief: |
  Одна реплика приложения недоступна, а обслуживание заблокировано. Восстановите существующее приложение, затем выполните одну добровольную замену без потери сервиса.

  Работайте в `~/quest` на workstation. Предоставленные входные файлы: `board.yaml`, `service.yaml`, `client.yaml`, `pdb.yaml`.

  Файл запроса находится в `~/quest` на рабочей станции.

  **Требования:**

  - До добровольного обслуживания существующие Pod должны восстановить готовность; заменить можно ровно один исходный Pod. Составьте запрос Eviction API самостоятельно.
  - Существующий бюджет прерываний защищает Pod приложения и требует хотя бы один исправный Pod.
  - Deployment `board` имеет ровно две реплики, обе готовы.
  - Бюджет прерываний приложения сообщает о двух исправных Pod, минимуме один и одном разрешённом прерывании.
  - HTTP-запрос из Deployment `client` к `http://board:8080` возвращает `north-77`.
  - `eviction.json` содержит запрос Eviction API для исходного Pod board в этом стенде с проверкой UID этого Pod.
  - Pod board, выбранный для вытеснения, отсутствует; остаётся ровно один исходный Pod board.
  - Сервер подтверждает, что исходный Pod из `eviction.json` был вытеснен через Eviction API.
  - Учётная запись стенда не может изменять статус Pod через patch.

  PDB управляет добровольным вытеснением; он не предотвращает потерю узла, прямое удаление Pod или rollout Deployment, а изменённый файл запроса не доказывает наблюдаемое сервером вытеснение.
debrief: Обслуживание имеет явный минимум исправных реплик, проверенный реальным eviction и запросами сервиса.
stages.0.brief: Завершите наблюдаемое добровольное обслуживание и восстановите обе здоровые реплики.
