hints.0.text: A disruption budget uses actual readiness, not just the desired replica count. Maintenance
  must preserve the workload while a replacement becomes ready.
hints.1.text: |-
  Compare the Pod readiness probe, its failure events and the PDB status before deciding whether an eviction is safe.

  Look at the original Pod name and UID, the namespace, and the readiness and termination settings. In the Eviction request, find the target and UID precondition before comparing them with the observed Pod.

  ```sh
  kubectl describe pods -l app=board
  kubectl get pdb -o yaml
  kubectl get pods -l app=board -o yaml
  jq . original-pod-uids.json
  if test -f eviction.json; then jq . eviction.json; fi
  ```
hints.2.text: |-
  Expect two ready replicas, two healthy Pods with one required and one disruption allowed, and HTTP `north-77`. The submitted Eviction must name the original Pod and its UID. The evicted UID must be absent from the live Pods, exactly one original UID must survive, and the server receipt must include the evicted UID. The status patch permission check must return `no`.

  ```sh
  kubectl get deployment board
  kubectl get pdb board-budget
  jq . eviction.json
  uid=$(jq -er .deleteOptions.preconditions.uid eviction.json)
  kubectl get pods -l app=board -o json |
    jq --arg uid "$uid" --slurpfile original original-pod-uids.json '
      [.items[].metadata.uid] as $live |
      {evictedPresent: ($live | index($uid) != null),
       originalSurvivors: [$live[] | select(. as $candidate | $original[0] | index($candidate) != null)]}'
  jq --arg uid "$uid" 'index($uid) != null' /run/dq/observations/evictions.json
  kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080
  kubectl auth can-i patch pods --subresource=status
  ```
phrases.0: I aligned the disruption budget with available replica capacity.
phrases.1: I used the Eviction API instead of direct deletion.
phrases.2: I distinguished voluntary maintenance protection from failure recovery.
questions.0.points.0: It constrains voluntary disruptions through the Eviction API.
questions.0.points.1: It cannot prevent a machine failure or direct deletion.
questions.0.points.2: Deployment rollout availability uses its own strategy.
questions.0.prompt: Which disruptions does a PDB constrain?
questions.1.points.0: The budget may require both replicas to stay healthy.
questions.1.points.1: Check selector, healthy count and disruptionsAllowed.
questions.1.points.2: Choose a minimum consistent with the maintenance requirement.
questions.1.prompt: Why can a healthy two-replica service reject an eviction?
diagnostics.probe_0_0: The budget may select the wrong Pods or retain no available replica; keep the board identity in its selector and exactly one availability field whose rounded minimum remains at least one. API or malformed-object errors also reach this fallback. [Cause and check](guides#guide=kubernetes-17&section=maintenance-pdb-selector-and-retained-availability)
diagnostics.pdb_replicas: Setup removes the readiness flag from one existing Pod; restore its readiness and retain two replicas rather than treating the failed readiness check as a need to replace both originals. [Cause and check](guides#guide=kubernetes-17&section=maintenance-original-readiness-fault)
diagnostics.pdb_status: The supplied minimum of two and the unready Pod can both block maintenance; restore two healthy replicas and retain one required healthy replica so the controller allows one disruption. [Cause and check](guides#guide=kubernetes-17&section=maintenance-healthy-pods-and-one-disruption)
diagnostics.pdb_http: The Service request may fail while endpoints are unready or the selector is wrong; verify north-77 through the supplied client and Service during recovery. [Cause and check](guides#guide=kubernetes-17&section=maintenance-client-service-availability)
diagnostics.eviction_request: The saved request may target another namespace or lack an original Pod UID precondition; retain a policy/v1 Eviction for this namespace with a UID from the frozen original list. [Cause and check](guides#guide=kubernetes-17&section=maintenance-eviction-original-uid-precondition)
diagnostics.eviction_replacement: The target may still be terminating, or replacing both Pods may have removed both original UIDs; wait for the requested UID to disappear while exactly one original UID remains. [Cause and check](guides#guide=kubernetes-17&section=maintenance-one-original-pod-survives)
diagnostics.eviction_observed: Ordinary deletion does not establish an Eviction API event; the protected observer must see the original UID with the API disruption condition before it disappears. Preserve graceful termination and the real API request. [Cause and check](guides#guide=kubernetes-17&section=maintenance-protected-api-eviction-receipt)
diagnostics.pod_status_denied: A different context or expanded permissions may allow patching Pod status; retain the supplied limited identity. API/transport errors can also prevent the expected no response. [Cause and check](guides#guide=kubernetes-17&section=maintenance-limited-pod-status-authority)
