hints.0.text: A disruption budget uses actual readiness, not just the desired replica count. Maintenance
  must preserve the workload while a replacement becomes ready.
hints.1.text: |-
  Compare the Pod readiness probe, its failure events and the PDB status before deciding whether an eviction is safe.

  ```sh
  kubectl describe pods -l app=board
  kubectl get pdb -o yaml
  kubectl get pods -l app=board -o yaml
  ```
hints.2.text: |-
  Restore the failing readiness condition inside the existing Pod without replacing it. Once the budget permits maintenance, construct a policy/v1 Eviction in `eviction.json` with the original Pod name, `$DQ_NAMESPACE` and `deleteOptions.preconditions.uid`; submit it to that Pod's eviction subresource. Keep the supplied termination window.

  Verify two ready replicas, the healthy minimum and allowance, HTTP continuity, exactly one surviving original UID, and the server receipt for the evicted UID.

  ```sh
  kubectl get deployment board
  kubectl get pdb
  cat eviction.json
  cat /run/dq/observations/evictions.json
  kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080
  kubectl auth can-i patch pods --subresource=status
  ```
phrases.0: I aligned the disruption budget with available replica capacity.
phrases.1: I used the Eviction API instead of direct deletion.
phrases.2: I distinguished voluntary maintenance protection from failure recovery.
questions.0.points.0: It constrains voluntary disruptions through the Eviction API.
questions.0.points.1: It cannot prevent a machine failure or direct deletion.
questions.0.points.2: Deployment rollout availability uses its own strategy.
questions.0.prompt: Which disruptions does a PDB constrain?
questions.1.points.0: The budget may require both replicas to stay healthy.
questions.1.points.1: Check selector, healthy count and disruptionsAllowed.
questions.1.points.2: Choose a minimum consistent with the maintenance requirement.
questions.1.prompt: Why can a healthy two-replica service reject an eviction?
