hints.0.text: A disruption budget balances voluntary maintenance with application availability.
hints.1.text: 'A two-of-two budget leaves no voluntary maintenance room.


  Keep the selector and replicas fixed; change only the healthy minimum.


  Inspect the supplied definitions, current resources and events.


  ```sh

  cat pdb.yaml

  kubectl get pdb board-budget -o yaml

  kubectl describe deployment board

  cat eviction.json

  kubectl get pods -l app=board -o yaml

  cat /run/dq/observations/evictions.json

  ```'
hints.2.text: 'Wait for disruptionsAllowed=1, then bash evict-one.sh submits a UID-guarded Eviction API request
  and probes HTTP during replacement. Verify recovery. The backend observes DisruptionTarget with reason EvictionByEvictionAPI
  during termination; direct deletion or an edited JSON file cannot create this receipt. The supplied 10-second
  preStop hook keeps termination observable during the 2.5-second poll; retain it.


  Verify the observed result:


  ```sh

  kubectl get deployment board

  kubectl get pdb board-budget

  kubectl exec deployment/client -c worker -- wget -qO- -T 3 http://board:8080

  kubectl auth can-i patch pods --subresource=status

  ```


  Expect two ready replicas, two healthy Pods, a healthy minimum of one and one allowed disruption; HTTP returns
  north-77 and the authorization answer is no. The selected original Pod is absent, exactly one original remains,
  and the server receipt confirms eviction of the selected UID.


  Supplied constraints and details: PDB `board-budget` protects Pods labelled `app=board` and requires at least
  one healthy Pod. PDB `board-budget` reports two healthy Pods, a healthy minimum of one, and one allowed disruption.


  In ~/quest on the workstation, eviction.json must name a policy/v1 Eviction in $DQ_NAMESPACE with an original
  Pod UID precondition. Retain the supplied 10-second preStop hook; it allows the server to observe termination.'
phrases.0: I aligned the disruption budget with available replica capacity.
phrases.1: I used the Eviction API instead of direct deletion.
phrases.2: I distinguished voluntary maintenance protection from failure recovery.
questions.0.points.0: It constrains voluntary disruptions through the Eviction API.
questions.0.points.1: It cannot prevent a machine failure or direct deletion.
questions.0.points.2: Deployment rollout availability uses its own strategy.
questions.0.prompt: Which disruptions does a PDB constrain?
questions.1.points.0: The budget may require both replicas to stay healthy.
questions.1.points.1: Check selector, healthy count and disruptionsAllowed.
questions.1.points.2: Choose a minimum consistent with the maintenance requirement.
questions.1.prompt: Why can a healthy two-replica service reject an eviction?
