title: PDB maintenance
brief: 'The service needs a voluntary maintenance window while remaining available. Preserve the supplied termination
  observation window.


  Work in `~/quest` on the workstation. Supplied inputs: `board.yaml`, `service.yaml`, `client.yaml`, `pdb.yaml`,
  `evict-one.sh`.


  The request file is in `~/quest` on the workstation.


  **Requirements:**

  - The existing disruption budget protects the application Pods and requires at least one healthy Pod.

  - Deployment `board` has exactly two replicas, both ready.

  - The application disruption budget reports two healthy Pods, a healthy minimum of one, and one allowed disruption.

  - HTTP from Deployment `client` to `http://board:8080` returns `north-77`.

  - `eviction.json` records an Eviction API request for an original board Pod in this bay, guarded by that
  Pod''s UID.

  - The board Pod selected for eviction is gone, and exactly one original board Pod remains.

  - The server confirms that the original Pod selected in `eviction.json` was evicted through the Eviction
  API.

  - Your bay account cannot patch Pod status.


  A PDB governs voluntary eviction; it does not prevent node loss, direct Pod deletion or a Deployment rollout,
  and an edited request file does not prove server-observed eviction.

  '
debrief: Maintenance now has an explicit healthy minimum, verified by a real eviction and service probes.
stages.0.brief: Complete observable voluntary maintenance and restore both healthy replicas.
