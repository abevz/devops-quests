title: PDB maintenance
brief: 'Two board replicas are healthy, but minAvailable: 2 blocks every voluntary eviction. Configure
  board-budget to minAvailable: 1 without changing its selector or increasing replicas. For a safe maintenance
  test, bash evict-one.sh submits an Eviction API request with the current Pod UID as a precondition and
  probes HTTP during replacement. The checked outcome is server-observed Eviction API use, one original
  Pod replaced and the required healthy minimum restored. Finish with two healthy replicas and one allowed
  disruption. A PDB governs voluntary eviction; it does not prevent node loss, direct Pod deletion or
  a Deployment rollout.


  Quest files in `~/quest` (some appear in later stages): `board.json`, `service.json`, `client.json`,
  `pdb.json`, `evict-one.sh`, `eviction.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  The checker also verifies that the UID in `eviction.json` belongs to an original Pod and that exactly
  one original Pod was replaced.


  The backend must observe the server-owned DisruptionTarget condition with reason EvictionByEvictionAPI
  while the old Pod terminates. Direct deletion and an edited JSON file do not create this receipt.


  A supplied 10-second preStop hook keeps the termination observable during the ordinary 2.5-second backend
  poll; retain this hook.'
debrief: Maintenance now has an explicit healthy minimum, verified by a real eviction
  and service probes.
stages.0.brief: Change only this bay.
stages.0.objectives.0.text: 'PDB `board-budget`: `spec.minAvailable=1`, `spec.selector.matchLabels={app:
  board}`.'
stages.0.objectives.1.text: 'Deployment `board`: `spec.replicas=2`, `status.readyReplicas=2`.'
stages.0.objectives.2.text: 'PDB `board-budget`: `status.currentHealthy=2`, `status.desiredHealthy=1`,
  `status.disruptionsAllowed=1`.'
stages.0.objectives.3.text: HTTP from Deployment `client` to `http://board:8080` returns `north-77`.
stages.0.objectives.4.text: '`eviction.json` is a `policy/v1` `Eviction` in this bay namespace, with an
  original Pod UID from `/run/dq/facts/0/original-pod-uids.json` in `deleteOptions.preconditions.uid`.'
stages.0.objectives.5.text: The Pod UID targeted in `eviction.json` is absent from Pods `app=board`; exactly
  one original Pod UID remains.
stages.0.objectives.6.text: The server-observed Eviction API receipt includes the UID targeted in `eviction.json`
  (`/run/dq/observations/evictions.json`).
stages.0.objectives.7.text: '`kubectl auth can-i patch pods --subresource=status` = `no`.'
hints.0.text: A two-of-two budget leaves no voluntary maintenance room.
hints.1.text: Keep the selector and replicas fixed; change only the healthy minimum.
hints.2.text: Wait for disruptionsAllowed=1, use the Eviction API helper and verify
  recovery.
phrases.0: I aligned the disruption budget with available replica capacity.
phrases.1: I used the Eviction API instead of direct deletion.
phrases.2: I distinguished voluntary maintenance protection from failure recovery.
questions.0.points.0: It constrains voluntary disruptions through the Eviction API.
questions.0.points.1: It cannot prevent a machine failure or direct deletion.
questions.0.points.2: Deployment rollout availability uses its own strategy.
questions.0.prompt: Which disruptions does a PDB constrain?
questions.1.points.0: The budget may require both replicas to stay healthy.
questions.1.points.1: Check selector, healthy count and disruptionsAllowed.
questions.1.points.2: Choose a minimum consistent with the maintenance requirement.
questions.1.prompt: Why can a healthy two-replica service reject an eviction?
