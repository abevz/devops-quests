hints.0.text: Ein Disruption Budget berücksichtigt die tatsächliche Bereitschaft, nicht nur die gewünschte
  Replikazahl. Die Anwendung muss während der Bereitschaft ihrer Ersetzung verfügbar bleiben.
hints.1.text: |-
  Vergleiche die Readiness-Probe des Pods, ihre Fehlerereignisse und den PDB-Status, bevor du entscheidest, ob eine Eviction sicher ist.

  Sieh dir Name und UID des ursprünglichen Pods, den Namespace sowie die Bereitschafts- und Beendigungseinstellungen an. Prüfe in der Eviction-Anfrage Ziel und UID-Vorbedingung anhand des beobachteten Pods.

  ```sh
  kubectl describe pods -l app=board
  kubectl get pdb -o yaml
  kubectl get pods -l app=board -o yaml
  jq . original-pod-uids.json
  if test -f eviction.json; then jq . eviction.json; fi
  ```
hints.2.text: |-
  Erwarte zwei bereite Repliken, zwei gesunde Pods bei einem erforderlichen Pod, eine zulässige Eviction und die HTTP-Antwort `north-77`. Die gesendete Eviction muss den Namen des ursprünglichen Pods und seine UID enthalten. Die verdrängte UID muss aus den aktuellen Pods verschwunden sein, genau eine ursprüngliche UID muss übrig bleiben und die Serverquittung muss die verdrängte UID enthalten. Die Status-Patch-Berechtigungsprüfung muss `no` liefern.

  ```sh
  kubectl get deployment board
  kubectl get pdb board-budget
  jq . eviction.json
  uid=$(jq -er .deleteOptions.preconditions.uid eviction.json)
  kubectl get pods -l app=board -o json |
    jq --arg uid "$uid" --slurpfile original original-pod-uids.json '
      [.items[].metadata.uid] as $live |
      {evictedPresent: ($live | index($uid) != null),
       originalSurvivors: [$live[] | select(. as $candidate | $original[0] | index($candidate) != null)]}'
  jq --arg uid "$uid" 'index($uid) != null' /run/dq/observations/evictions.json
  kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080
  kubectl auth can-i patch pods --subresource=status
  ```
phrases.0: Ich habe den disruption budget mit der verfügbaren Replikatkapazität abgeglichen.
phrases.1: Ich habe Eviction API anstelle der direkten Löschung verwendet.
phrases.2: Ich habe den freiwilligen Wartungsschutz vom Ausfallwiederherstellungsschutz unterschieden.
questions.0.points.0: Es schränkt freiwillige disruptions durch Eviction API ein.
questions.0.points.1: Es kann einen Maschinenausfall oder eine direkte Löschung nicht verhindern.
questions.0.points.2: Die Verfügbarkeit von Deployment rollout verwendet eine eigene Strategie.
questions.0.prompt: Welchen disruptions schränkt ein PDB ein?
questions.1.points.0: Das Budget erfordert möglicherweise, dass beide Replikate fehlerfrei bleiben.
questions.1.points.1: Überprüfen Sie selector, gesunde Anzahl und disruptionsAllowed.
questions.1.points.2: Wählen Sie ein Minimum, das dem Wartungsbedarf entspricht.
questions.1.prompt: Warum kann ein fehlerfreier Dienst mit zwei Replikaten einen eviction ablehnen?
diagnostics.probe_0_0: Das Budget wählt möglicherweise falsche Pods oder erhält keine verfügbare Replik; behalten Sie board Identität im selector und genau ein Verfügbarkeitsfeld mit aufgerundetem Minimum mindestens eins. API- oder Objektstrukturfehler ergeben ebenfalls diesen Fallback. [Ursache und Prüfung](guides#guide=kubernetes-17&section=maintenance-pdb-selector-and-retained-availability)
diagnostics.pdb_replicas: Setup entfernt das Readiness-Flag eines vorhandenen Pods; stellen Sie Bereitschaft wieder her und behalten Sie zwei Repliken, statt beide ursprünglichen Pods zu ersetzen. [Ursache und Prüfung](guides#guide=kubernetes-17&section=maintenance-original-readiness-fault)
diagnostics.pdb_status: Das gelieferte Minimum zwei und der unbereite Pod blockieren Wartung; stellen Sie zwei gesunde Repliken und das erforderliche Minimum eins her, damit der Controller eine Disruption erlaubt. [Ursache und Prüfung](guides#guide=kubernetes-17&section=maintenance-healthy-pods-and-one-disruption)
diagnostics.pdb_http: Die Anfrage kann die Service-Antwort wegen unbereiter Endpoints oder falschem selector verlieren; prüfen Sie north-77 während der Wiederherstellung über gelieferten client und Service. [Ursache und Prüfung](guides#guide=kubernetes-17&section=maintenance-client-service-availability)
diagnostics.eviction_request: Der gespeicherte Antrag zielt möglicherweise auf anderen Namespace oder hat keine ursprüngliche UID-Vorbedingung; verwenden Sie policy/v1 Eviction für diesen Namespace mit einer UID aus der eingefrorenen Liste. [Ursache und Prüfung](guides#guide=kubernetes-17&section=maintenance-eviction-original-uid-precondition)
diagnostics.eviction_replacement: Der Ziel-Pod terminiert möglicherweise noch oder beide ursprünglichen UIDs wurden durch Austausch entfernt; warten Sie auf Verschwinden der beantragten UID, während genau eine ursprüngliche UID bleibt. [Ursache und Prüfung](guides#guide=kubernetes-17&section=maintenance-one-original-pod-survives)
diagnostics.eviction_observed: Gewöhnliches Löschen belegt kein Eviction-API-Ereignis; der geschützte Observer muss die ursprüngliche UID mit API-Disruption-Bedingung vor ihrem Verschwinden sehen. Erhalten Sie geordnete Beendigung und echten API-Antrag. [Ursache und Prüfung](guides#guide=kubernetes-17&section=maintenance-protected-api-eviction-receipt)
diagnostics.pod_status_denied: Ein anderer Kontext oder erweiterte Rechte können Pod-Status-Patches erlauben; behalten Sie die gelieferte eingeschränkte Identität. API-/Transportfehler können ebenfalls die erwartete Antwort no verhindern. [Ursache und Prüfung](guides#guide=kubernetes-17&section=maintenance-limited-pod-status-authority)
