title: PDB Wartung
brief: |
  Ein Anwendungsreplikat ist nicht verfügbar und die Wartung ist blockiert. Stelle die bestehende Anwendung wieder her und führe dann einen freiwilligen Ersatz ohne Dienstausfall durch.

  Arbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte Eingabedateien: `board.yaml`, `service.yaml`, `client.yaml`, `pdb.yaml`.

  Die Anfragedatei liegt unter `~/quest` auf der Workstation.

  **Anforderungen:**

  - Die bestehenden Pods müssen vor der freiwilligen Wartung wieder bereit sein; genau ein ursprünglicher Pod darf ersetzt werden. Erstelle die Eviction-API-Anfrage selbst.
  - Das bestehende Unterbrechungsbudget schützt die Anwendungs-Pods und verlangt mindestens einen gesunden Pod.
  - Deployment `board` hat genau zwei Repliken, beide bereit.
  - Das Unterbrechungsbudget der Anwendung meldet zwei gesunde Pods, ein gesundes Minimum von einem und eine erlaubte Unterbrechung.
  - HTTP von Deployment `client` an `http://board:8080` liefert `north-77`.
  - `eviction.json` dokumentiert eine durch die Pod-UID abgesicherte Eviction-API-Anfrage für einen ursprünglichen board-Pod in dieser Umgebung.
  - Der zur Eviction ausgewählte board-Pod ist nicht mehr vorhanden, und genau ein ursprünglicher board-Pod bleibt.
  - Der Server bestätigt, dass der in `eviction.json` ausgewählte ursprüngliche Pod über die Eviction API entfernt wurde.
  - Das Konto der Umgebung darf den Pod-Status nicht per Patch ändern.

  Ein PDB regelt freiwillige Verdrängung; es verhindert weder Knotenausfall, direktes Pod-Löschen noch einen Deployment-Rollout, und eine bearbeitete Anfragedatei belegt keine vom Server beobachtete Verdrängung.
debrief: Die Wartung hat jetzt ein explizites, fehlerfreies Minimum, das durch einen echten eviction und Service-Probes
  überprüft wird.
stages.0.brief: Schließen Sie die beobachtbare freiwillige Wartung ab und stellen Sie beide gesunden Replikate
  wieder her.
