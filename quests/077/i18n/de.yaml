title: PDB Wartung
brief: |
  Der Dienst benötigt ein sicheres Zeitfenster für freiwillige Wartung bei erhaltener Verfügbarkeit. Behalten Sie den vorgegebenen 10-sekündigen preStop-Hook bei, damit die Beendigung beobachtbar bleibt.

  Arbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte Eingabedateien: `board.yaml`, `service.yaml`, `client.yaml`, `pdb.yaml`, `evict-one.sh`, `original-pod-uids.json`.

  **Anforderungen:**
  - Im Container `worker` von Deployment `client` liefert HTTP an `http://board:8080` den Wert `north-77`.
  - PDB `board-budget` schützt Pods mit dem Label `app=board` und verlangt mindestens einen gesunden Pod.
  - Deployment `board` hat genau zwei Replikate; beide sind bereit.
  - PDB `board-budget` meldet:
    - Gesund: `2`
    - Erforderlich gesund: `1`
    - Erlaubte Unterbrechungen: `1`
  - In `~/quest` auf der Workstation dokumentiert `eviction.json` eine Eviction-API-Anfrage für einen ursprünglichen Pod dieser Bay:
    - API: `policy/v1`
    - Art: `Eviction`
    - Namensraum: `$DQ_NAMESPACE`
    - UID-Vorbedingung: ursprüngliche Pod-UID
  - Der ausgewählte Pod ist verschwunden und genau ein ursprünglicher Pod bleibt. Die ursprüngliche UID-Liste ist auf der Workstation geschützt:
    - `/run/dq/facts/0/original-pod-uids.json`
  - Der Server bestätigt die Verdrängung dieses ausgewählten ursprünglichen Pods über die Eviction API; sein schreibgeschützter Nachweis liegt auf der Workstation:
    - `/run/dq/observations/evictions.json`
  - Ihr Bay-Konto kann den Pod-Status nicht per Patch ändern.

  **Vor Check & finish selbst prüfen:**
  Führen Sie diese Beobachtungsbefehle in `~/quest` auf der Workstation aus.
  - `kubectl exec deployment/client -c worker -- wget -qO- -T 3 http://board:8080` — Der Dienstverbraucher erhält `north-77`.
  - Selektor sowie Gesundheits- und Unterbrechungszahlen entsprechen den Anforderungen, beide Replikate sind bereit und die Berechtigungsantwort lautet `no`.

    ```sh
    kubectl get pdb board-budget -o yaml
    kubectl get deployment board
    kubectl auth can-i patch pods --subresource=status
    ```
  - Die Anfrage nennt diese Bay und eine ursprüngliche Pod-UID als Vorbedingung. Diese UID fehlt unter den aktuellen Pods und steht im Servernachweis; genau ein ursprünglicher Pod bleibt.

    ```sh
    cat eviction.json
    cat /run/dq/facts/0/original-pod-uids.json
    kubectl get pods -l app=board -o json
    cat /run/dq/observations/evictions.json
    ```

  Ein PDB regelt freiwillige Verdrängung; es verhindert weder Knotenausfall, direktes Pod-Löschen noch einen Deployment-Rollout, und eine bearbeitete Anfragedatei belegt keine vom Server beobachtete Verdrängung.
debrief: Die Wartung hat jetzt ein explizites, fehlerfreies Minimum, das durch einen echten eviction und
  Service-Probes überprüft wird.
stages.0.brief: |
  Schließen Sie die beobachtbare freiwillige Wartung ab und stellen Sie beide gesunden Replikate wieder her.
stages.0.objectives.0.text: PDB `board-budget` schützt Pods mit dem Label `app=board` und verlangt mindestens
  einen gesunden Pod.
stages.0.objectives.1.text: Deployment `board` hat genau zwei Repliken, beide bereit.
stages.0.objectives.2.text: PDB `board-budget` meldet zwei gesunde Pods, ein Minimum von einem gesunden
  Pod und eine erlaubte Unterbrechung.
stages.0.objectives.3.text: HTTP von Deployment `client` an `http://board:8080` liefert `north-77`.
stages.0.objectives.4.text: '`eviction.json` dokumentiert eine durch die Pod-UID abgesicherte Eviction-API-Anfrage
  für einen ursprünglichen board-Pod in dieser Umgebung.'
stages.0.objectives.5.text: Der zur Eviction ausgewählte board-Pod ist nicht mehr vorhanden, und genau
  ein ursprünglicher board-Pod bleibt.
stages.0.objectives.6.text: Der Server bestätigt, dass der in `eviction.json` ausgewählte ursprüngliche
  Pod über die Eviction API entfernt wurde.
stages.0.objectives.7.text: Das Konto der Umgebung darf den Pod-Status nicht per Patch ändern.
hints.0.text: Ein Zwei-von-Zwei-Budget lässt keinen Spielraum für freiwillige Wartung.
hints.1.text: Halten Sie den selector und die Replikate fest; Ändern Sie nur das gesunde Minimum.
hints.2.text: |
  Warten Sie auf disruptionsAllowed=1; dann sendet bash evict-one.sh eine UID-gesicherte Eviction-API-Anfrage und prüft HTTP während des Ersatzes. Prüfen Sie die Wiederherstellung. Das Backend beobachtet DisruptionTarget mit Grund EvictionByEvictionAPI während der Beendigung; direktes Löschen oder eine bearbeitete JSON-Datei erzeugen diesen Nachweis nicht. Der vorgegebene 10-sekündige preStop-Hook macht die Beendigung bei Abfragen alle 2.5 Sekunden beobachtbar; behalten Sie ihn bei.
phrases.0: Ich habe den disruption budget mit der verfügbaren Replikatkapazität abgeglichen.
phrases.1: Ich habe Eviction API anstelle der direkten Löschung verwendet.
phrases.2: Ich habe den freiwilligen Wartungsschutz vom Ausfallwiederherstellungsschutz unterschieden.
questions.0.points.0: Es schränkt freiwillige disruptions durch Eviction API ein.
questions.0.points.1: Es kann einen Maschinenausfall oder eine direkte Löschung nicht verhindern.
questions.0.points.2: Die Verfügbarkeit von Deployment rollout verwendet eine eigene Strategie.
questions.0.prompt: Welchen disruptions schränkt ein PDB ein?
questions.1.points.0: Das Budget erfordert möglicherweise, dass beide Replikate fehlerfrei bleiben.
questions.1.points.1: Überprüfen Sie selector, gesunde Anzahl und disruptionsAllowed.
questions.1.points.2: Wählen Sie ein Minimum, das dem Wartungsbedarf entspricht.
questions.1.prompt: Warum kann ein fehlerfreier Dienst mit zwei Replikaten einen eviction ablehnen?
