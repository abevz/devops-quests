title: PDB Wartung
brief: 'Zwei board-Repliken sind fehlerfrei, aber minAvailable: 2 Blöcke pro freiwilligem eviction. Konfigurieren
  Sie board-budget zu minAvailable: 1, ohne dessen selector zu ändern oder Replikate zu erhöhen. Für einen
  sicheren Wartungstest sendet bash evict-one.sh eine Eviction API-Anfrage mit dem aktuellen Pod UID als
  precondition und Sonden HTTP während des Austauschs. Das überprüfte Ergebnis ist eine vom Server beobachtete
  Eviction API-Nutzung, ein Original-Pod wurde ersetzt und das erforderliche fehlerfreie Minimum wurde
  wiederhergestellt. Beenden Sie den Vorgang mit zwei fehlerfreien Replikaten und einem zulässigen disruption.
  A PDB regelt freiwilliges eviction; Es verhindert keinen Knotenverlust, eine direkte Pod-Löschung oder
  ein Deployment rollout.


  Questdateien in `~/quest` (einige erscheinen in späteren Phasen): `board.json`, `service.json`, `client.json`,
  `pdb.json`, `evict-one.sh`, `eviction.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Der Prüfer verifiziert außerdem, dass der UID in `eviction.json` zu einem Original-Pod gehört und dass
  genau ein Original-Pod ersetzt wurde.


  Der backend muss den servereigenen DisruptionTarget condition mit reason EvictionByEvictionAPI beobachten,
  während der alte Pod terminiert. Durch direktes Löschen und eine bearbeitete JSON-Datei wird dieser
  Beleg nicht erstellt.


  Ein bereitgestellter 10-Sekunden-preStop hook sorgt dafür, dass die Terminierung während der gewöhnlichen
  2.5-Sekunden-backend-Abfrage beobachtbar bleibt. Behalten Sie diesen hook bei.'
debrief: Die Wartung hat jetzt ein explizites, fehlerfreies Minimum, das durch einen echten eviction und
  Service-Probes überprüft wird.
stages.0.brief: Ändern Sie nur diese Bucht.
stages.0.objectives.0.text: 'PDB `board-budget`: `spec.minAvailable=1`, `spec.selector.matchLabels={app:
  board}`.'
stages.0.objectives.1.text: 'Deployment `board`: `spec.replicas=2`, `status.readyReplicas=2`.'
stages.0.objectives.2.text: 'PDB `board-budget`: `status.currentHealthy=2`, `status.desiredHealthy=1`,
  `status.disruptionsAllowed=1`.'
stages.0.objectives.3.text: HTTP von Deployment `client` an `http://board:8080` liefert `north-77`.
stages.0.objectives.4.text: '`eviction.json` ist eine `policy/v1` `Eviction` im Namespace der Umgebung
  mit einer ursprünglichen Pod-UID aus `/run/dq/facts/0/original-pod-uids.json` in `deleteOptions.preconditions.uid`.'
stages.0.objectives.5.text: Die Pod-UID aus `eviction.json` fehlt bei Pods `app=board`; genau eine ursprüngliche
  Pod-UID bleibt.
stages.0.objectives.6.text: Der serverseitig beobachtete Eviction-API-Beleg enthält die UID aus `eviction.json`
  (`/run/dq/observations/evictions.json`).
stages.0.objectives.7.text: '`kubectl auth can-i patch pods --subresource=status` = `no`.'
hints.0.text: Ein Zwei-von-Zwei-Budget lässt keinen Spielraum für freiwillige Wartung.
hints.1.text: Halten Sie den selector und die Replikate fest; Ändern Sie nur das gesunde Minimum.
hints.2.text: Warten Sie auf disruptionsAllowed=1, verwenden Sie Eviction API helper und überprüfen Sie
  die Wiederherstellung.
phrases.0: Ich habe den disruption budget mit der verfügbaren Replikatkapazität abgeglichen.
phrases.1: Ich habe Eviction API anstelle der direkten Löschung verwendet.
phrases.2: Ich habe den freiwilligen Wartungsschutz vom Ausfallwiederherstellungsschutz unterschieden.
questions.0.points.0: Es schränkt freiwillige disruptions durch Eviction API ein.
questions.0.points.1: Es kann einen Maschinenausfall oder eine direkte Löschung nicht verhindern.
questions.0.points.2: Die Verfügbarkeit von Deployment rollout verwendet eine eigene Strategie.
questions.0.prompt: Welchen disruptions schränkt ein PDB ein?
questions.1.points.0: Das Budget erfordert möglicherweise, dass beide Replikate fehlerfrei bleiben.
questions.1.points.1: Überprüfen Sie selector, gesunde Anzahl und disruptionsAllowed.
questions.1.points.2: Wählen Sie ein Minimum, das dem Wartungsbedarf entspricht.
questions.1.prompt: Warum kann ein fehlerfreier Dienst mit zwei Replikaten einen eviction ablehnen?
