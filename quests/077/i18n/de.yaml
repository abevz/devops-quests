hints.0.text: Ein Disruption Budget berücksichtigt die tatsächliche Bereitschaft, nicht nur die gewünschte
  Replikazahl. Die Anwendung muss während der Bereitschaft ihrer Ersetzung verfügbar bleiben.
hints.1.text: |-
  Vergleiche die Readiness-Probe des Pods, ihre Fehlerereignisse und den PDB-Status, bevor du entscheidest, ob eine Eviction sicher ist.

  ```sh
  kubectl describe pods -l app=board
  kubectl get pdb -o yaml
  kubectl get pods -l app=board -o yaml
  ```
hints.2.text: |-
  Stelle die fehlschlagende Readiness-Bedingung im bestehenden Pod wieder her, ohne ihn zu ersetzen. Wenn das Budget Wartung erlaubt, erstelle selbst eine policy/v1 Eviction in `eviction.json` mit dem ursprünglichen Pod-Namen, `$DQ_NAMESPACE` und `deleteOptions.preconditions.uid`; sende sie an die Eviction-Unterressource dieses Pods. Behalte das vorgegebene Beendigungsfenster.

  Prüfe zwei bereite Replikate, das gesunde Minimum und die Freigabe, durchgängiges HTTP, genau eine verbleibende ursprüngliche UID sowie den Servernachweis für die verdrängte UID.

  ```sh
  kubectl get deployment board
  kubectl get pdb
  cat eviction.json
  cat /run/dq/observations/evictions.json
  kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080
  kubectl auth can-i patch pods --subresource=status
  ```
phrases.0: Ich habe den disruption budget mit der verfügbaren Replikatkapazität abgeglichen.
phrases.1: Ich habe Eviction API anstelle der direkten Löschung verwendet.
phrases.2: Ich habe den freiwilligen Wartungsschutz vom Ausfallwiederherstellungsschutz unterschieden.
questions.0.points.0: Es schränkt freiwillige disruptions durch Eviction API ein.
questions.0.points.1: Es kann einen Maschinenausfall oder eine direkte Löschung nicht verhindern.
questions.0.points.2: Die Verfügbarkeit von Deployment rollout verwendet eine eigene Strategie.
questions.0.prompt: Welchen disruptions schränkt ein PDB ein?
questions.1.points.0: Das Budget erfordert möglicherweise, dass beide Replikate fehlerfrei bleiben.
questions.1.points.1: Überprüfen Sie selector, gesunde Anzahl und disruptionsAllowed.
questions.1.points.2: Wählen Sie ein Minimum, das dem Wartungsbedarf entspricht.
questions.1.prompt: Warum kann ein fehlerfreier Dienst mit zwei Replikaten einen eviction ablehnen?
diagnostics.probe_0_0: 'Mit den aktuellen Eingaben konnte dieses Ziel nicht geprüft werden: Das bestehende Unterbrechungsbudget
  schützt die Anwendungs-Pods und verlangt mindestens einen gesunden Pod.'
