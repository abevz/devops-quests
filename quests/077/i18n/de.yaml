hints.0.text: Ein Unterbrechungsbudget bringt freiwillige Wartung und Anwendungsverfügbarkeit in Einklang.
hints.1.text: 'Ein Zwei-von-Zwei-Budget lässt keinen Spielraum für freiwillige Wartung.


  Halten Sie den selector und die Replikate fest; Ändern Sie nur das gesunde Minimum.


  Prüfen Sie die mitgelieferten Definitionen, aktuellen Ressourcen und Ereignisse.


  ```sh

  cat pdb.yaml

  kubectl get pdb board-budget -o yaml

  kubectl describe deployment board

  cat eviction.json

  kubectl get pods -l app=board -o yaml

  cat /run/dq/observations/evictions.json

  ```'
hints.2.text: 'Warten Sie auf disruptionsAllowed=1; dann sendet bash evict-one.sh eine UID-gesicherte Eviction-API-Anfrage
  und prüft HTTP während des Ersatzes. Prüfen Sie die Wiederherstellung. Das Backend beobachtet DisruptionTarget
  mit Grund EvictionByEvictionAPI während der Beendigung; direktes Löschen oder eine bearbeitete JSON-Datei
  erzeugen diesen Nachweis nicht. Der vorgegebene 10-sekündige preStop-Hook macht die Beendigung bei Abfragen
  alle 2.5 Sekunden beobachtbar; behalten Sie ihn bei.


  Prüfen Sie das beobachtete Ergebnis:


  ```sh

  kubectl get deployment board

  kubectl get pdb board-budget

  kubectl exec deployment/client -c worker -- wget -qO- -T 3 http://board:8080

  kubectl auth can-i patch pods --subresource=status

  ```


  Erwartet werden zwei bereite Replikate, zwei gesunde Pods, ein gesundes Minimum von einem und eine erlaubte
  Unterbrechung; HTTP liefert north-77, die Berechtigungsauskunft no. Der ausgewählte ursprüngliche Pod fehlt,
  genau ein ursprünglicher bleibt und der Serverbeleg bestätigt die Eviction der gewählten UID.


  Mitgelieferte Einschränkungen und Details: PDB `board-budget` schützt Pods mit dem Label `app=board` und
  verlangt mindestens einen gesunden Pod. PDB `board-budget` meldet zwei gesunde Pods, ein Minimum von einem
  gesunden Pod und eine erlaubte Unterbrechung.


  In ~/quest auf der Workstation muss eviction.json eine policy/v1 Eviction in $DQ_NAMESPACE mit ursprünglicher
  Pod-UID als Vorbedingung benennen. Den mitgelieferten 10-Sekunden-preStop-Hook beibehalten; er ermöglicht
  die serverseitige Beobachtung der Beendigung.'
phrases.0: Ich habe den disruption budget mit der verfügbaren Replikatkapazität abgeglichen.
phrases.1: Ich habe Eviction API anstelle der direkten Löschung verwendet.
phrases.2: Ich habe den freiwilligen Wartungsschutz vom Ausfallwiederherstellungsschutz unterschieden.
questions.0.points.0: Es schränkt freiwillige disruptions durch Eviction API ein.
questions.0.points.1: Es kann einen Maschinenausfall oder eine direkte Löschung nicht verhindern.
questions.0.points.2: Die Verfügbarkeit von Deployment rollout verwendet eine eigene Strategie.
questions.0.prompt: Welchen disruptions schränkt ein PDB ein?
questions.1.points.0: Das Budget erfordert möglicherweise, dass beide Replikate fehlerfrei bleiben.
questions.1.points.1: Überprüfen Sie selector, gesunde Anzahl und disruptionsAllowed.
questions.1.points.2: Wählen Sie ein Minimum, das dem Wartungsbedarf entspricht.
questions.1.prompt: Warum kann ein fehlerfreier Dienst mit zwei Replikaten einen eviction ablehnen?
diagnostics.probe_0_0: 'Mit den aktuellen Eingaben konnte dieses Ziel nicht geprüft werden: Das bestehende Unterbrechungsbudget
  schützt die Anwendungs-Pods und verlangt mindestens einen gesunden Pod.'
