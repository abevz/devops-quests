title: Konserwacja PDB
brief: 'Dwie repliki board są sprawne, ale minAvailable: 2 blokuje każdy dobrowolny eviction. Skonfiguruj
  board-budget do minAvailable: 1 bez zmiany selector lub zwiększania liczby replik. W celu przeprowadzenia
  testu bezpiecznej konserwacji bash evict-one.sh przesyła żądanie Eviction API z bieżącym Pod UID jako
  precondition i sondami HTTP podczas wymiany. Sprawdzonym rezultatem jest zaobserwowane przez serwer
  użycie Eviction API, wymiana jednego oryginalnego Pod i przywrócenie wymaganego zdrowego minimum. Zakończ
  z dwiema zdrowymi replikami i jedną dozwoloną disruption. PDB reguluje dobrowolne eviction; nie zapobiega
  to utracie węzła, bezpośredniemu usunięciu Pod ani wdrożeniu Deployment.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `board.json`, `service.json`,
  `client.json`, `pdb.json`, `evict-one.sh`, `eviction.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Osoba sprawdzająca sprawdza również, czy UID w `eviction.json` należy do oryginalnego Pod i czy dokładnie
  jeden oryginalny Pod został wymieniony.


  backend musi przestrzegać warunku DisruptionTarget należącego do serwera z reason EvictionByEvictionAPI,
  podczas gdy stary Pod kończy działanie. Bezpośrednie usunięcie i edycja pliku JSON nie powodują utworzenia
  tego paragonu.


  Dostarczony 10-sekundowy preStop hook umożliwia zaobserwowanie zakończenia podczas zwykłego 2,5-sekundowego
  odpytywania backend; zachowaj ten hook.'
debrief: Konserwacja ma teraz wyraźnie określone, zdrowe minimum, zweryfikowane przez prawdziwy eviction
  i sondy serwisowe.
stages.0.brief: Zmień tylko tę zatokę.
stages.0.objectives.0.text: 'PDB `board-budget`: `spec.minAvailable=1`, `spec.selector.matchLabels={app:
  board}`.'
stages.0.objectives.1.text: 'Deployment `board`: `spec.replicas=2`, `status.readyReplicas=2`.'
stages.0.objectives.2.text: 'PDB `board-budget`: `status.currentHealthy=2`, `status.desiredHealthy=1`,
  `status.disruptionsAllowed=1`.'
stages.0.objectives.3.text: HTTP z Deployment `client` do `http://board:8080` zwraca `north-77`.
stages.0.objectives.4.text: '`eviction.json` to `Eviction` w wersji `policy/v1` w namespace środowiska
  z oryginalnym UID Poda z `/run/dq/facts/0/original-pod-uids.json` w `deleteOptions.preconditions.uid`.'
stages.0.objectives.5.text: UID Poda z `eviction.json` nie występuje wśród Podów `app=board`; pozostaje
  dokładnie jeden oryginalny UID.
stages.0.objectives.6.text: Potwierdzenie Eviction API zaobserwowane przez serwer zawiera UID z `eviction.json`
  (`/run/dq/observations/evictions.json`).
stages.0.objectives.7.text: '`kubectl auth can-i patch pods --subresource=status` = `no`.'
hints.0.text: Budżet dwa z dwóch nie pozostawia miejsca na dobrowolne utrzymanie.
hints.1.text: Napraw selector i repliki; zmień tylko zdrowe minimum.
hints.2.text: Poczekaj na disruptionsAllowed=1, użyj pomocnika Eviction API i sprawdź odzyskiwanie.
phrases.0: Dopasowałem disruption budget do dostępnej pojemności repliki.
phrases.1: Zamiast bezpośredniego usuwania użyłem Eviction API.
phrases.2: Rozróżniłem dobrowolne zabezpieczenie konserwacyjne od odzyskiwania po awarii.
questions.0.points.0: Ogranicza dobrowolne disruptions poprzez Eviction API.
questions.0.points.1: Nie może zapobiec awarii komputera ani bezpośredniemu usunięciu.
questions.0.points.2: Dostępność wdrożenia Deployment wykorzystuje własną strategię.
questions.0.prompt: Które disruptions ogranicza PDB?
questions.1.points.0: Budżet może wymagać, aby obie repliki pozostały w dobrej kondycji.
questions.1.points.1: Sprawdź selector, prawidłową liczbę i disruptionsAllowed.
questions.1.points.2: Wybierz minimum zgodne z wymogami konserwacji.
questions.1.prompt: Dlaczego sprawna usługa dwóch replik może odrzucić eviction?
