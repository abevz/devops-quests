hints.0.text: Budżet zakłóceń uwzględnia rzeczywistą gotowość, a nie tylko żądaną liczbę replik. Aplikacja
  musi pozostać dostępna podczas przygotowania zastępstwa.
hints.1.text: |-
  Porównaj sondę gotowości Poda, zdarzenia jej błędów i stan PDB, zanim zdecydujesz, czy eksmisja jest bezpieczna.

  ```sh
  kubectl describe pods -l app=board
  kubectl get pdb -o yaml
  kubectl get pods -l app=board -o yaml
  ```
hints.2.text: |-
  Przywróć niespełniony warunek gotowości wewnątrz istniejącego Poda bez jego zastępowania. Gdy budżet pozwoli na konserwację, samodzielnie zbuduj Eviction policy/v1 w `eviction.json` z nazwą pierwotnego Poda, `$DQ_NAMESPACE` i `deleteOptions.preconditions.uid`; wyślij go do podzasobu eviction tego Poda. Zachowaj dostarczone okno zakończenia.

  Sprawdź dwie gotowe repliki, zdrowe minimum i zezwolenie, ciągłość HTTP, dokładnie jeden pozostały pierwotny UID oraz potwierdzenie serwera dla wyeksmitowanego UID.

  ```sh
  kubectl get deployment board
  kubectl get pdb
  cat eviction.json
  cat /run/dq/observations/evictions.json
  kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080
  kubectl auth can-i patch pods --subresource=status
  ```
phrases.0: Dopasowałem disruption budget do dostępnej pojemności repliki.
phrases.1: Zamiast bezpośredniego usuwania użyłem Eviction API.
phrases.2: Rozróżniłem dobrowolne zabezpieczenie konserwacyjne od odzyskiwania po awarii.
questions.0.points.0: Ogranicza dobrowolne disruptions poprzez Eviction API.
questions.0.points.1: Nie może zapobiec awarii komputera ani bezpośredniemu usunięciu.
questions.0.points.2: Dostępność wdrożenia Deployment wykorzystuje własną strategię.
questions.0.prompt: Które disruptions ogranicza PDB?
questions.1.points.0: Budżet może wymagać, aby obie repliki pozostały w dobrej kondycji.
questions.1.points.1: Sprawdź selector, prawidłową liczbę i disruptionsAllowed.
questions.1.points.2: Wybierz minimum zgodne z wymogami konserwacji.
questions.1.prompt: Dlaczego sprawna usługa dwóch replik może odrzucić eviction?
diagnostics.probe_0_0: Budżet może wybierać inne Pod lub nie zachowywać dostępnej repliki; zachowaj tożsamość board w selector i dokładnie jedno pole dostępności z zaokrąglonym minimum co najmniej jeden. Błędy API lub struktury obiektu też dają fallback. [Przyczyna i kontrola](guides#guide=kubernetes-17&section=maintenance-pdb-selector-and-retained-availability)
diagnostics.pdb_replicas: Setup usuwa flagę readiness jednego istniejącego Pod; przywróć gotowość i zachowaj dwie repliki zamiast zastępować oba pierwotne Pod. [Przyczyna i kontrola](guides#guide=kubernetes-17&section=maintenance-original-readiness-fault)
diagnostics.pdb_status: Dostarczone minimum dwóch oraz niegotowy Pod blokują utrzymanie; przywróć dwie zdrowe repliki i minimum jednej, aby controller dopuścił jedno disruption. [Przyczyna i kontrola](guides#guide=kubernetes-17&section=maintenance-healthy-pods-and-one-disruption)
diagnostics.pdb_http: Klient może tracić odpowiedź Service przez niegotowe endpoints lub błędny selector; sprawdzaj north-77 przez dostarczone client i Service podczas odtwarzania. [Przyczyna i kontrola](guides#guide=kubernetes-17&section=maintenance-client-service-availability)
diagnostics.eviction_request: Zapisane żądanie może wskazywać inną namespace lub nie zawierać precondition pierwotnego UID; użyj policy/v1 Eviction dla tej namespace z UID zamrożonej listy. [Przyczyna i kontrola](guides#guide=kubernetes-17&section=maintenance-eviction-original-uid-precondition)
diagnostics.eviction_replacement: Docelowy Pod może nadal kończyć pracę lub zastąpienie obu usunęło oba pierwotne UID; poczekaj na zniknięcie wskazanego UID, zachowując dokładnie jeden pierwotny. [Przyczyna i kontrola](guides#guide=kubernetes-17&section=maintenance-one-original-pod-survives)
diagnostics.eviction_observed: Zwykłe usunięcie nie potwierdza Eviction API; chroniony observer musi zobaczyć pierwotny UID z warunkiem disruption API przed zniknięciem Pod. Zachowaj graceful termination i rzeczywiste żądanie API. [Przyczyna i kontrola](guides#guide=kubernetes-17&section=maintenance-protected-api-eviction-receipt)
diagnostics.pod_status_denied: Inny kontekst lub rozszerzone prawa mogą pozwalać na patch statusu Pod; zachowaj dostarczoną ograniczoną tożsamość. Błędy API/transportu też blokują oczekiwaną odpowiedź no. [Przyczyna i kontrola](guides#guide=kubernetes-17&section=maintenance-limited-pod-status-authority)
