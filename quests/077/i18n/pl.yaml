title: Konserwacja PDB
brief: |
  Jedna replika aplikacji jest niedostępna, a konserwacja zablokowana. Przywróć istniejącą aplikację, a następnie wykonaj jedno dobrowolne zastąpienie bez utraty usługi.

  Pracuj w `~/quest` na workstation. Dostarczone pliki wejściowe: `board.yaml`, `service.yaml`, `client.yaml`, `pdb.yaml`.

  Plik żądania znajduje się w `~/quest` na stacji roboczej.

  **Wymagania:**

  - Istniejące Pody muszą odzyskać gotowość przed dobrowolną konserwacją; można zastąpić dokładnie jeden pierwotny Pod. Samodzielnie zbuduj żądanie Eviction API.
  - Istniejący budżet zakłóceń chroni Pody aplikacji i wymaga co najmniej jednego zdrowego Poda.
  - Deployment `board` ma dokładnie dwie repliki, obie gotowe.
  - Budżet zakłóceń aplikacji zgłasza dwa zdrowe Pody, wymagane minimum jednego i jedno dozwolone zakłócenie.
  - HTTP z Deployment `client` do `http://board:8080` zwraca `north-77`.
  - `eviction.json` zapisuje żądanie Eviction API dla oryginalnego Poda board w tym środowisku, zabezpieczone jego UID.
  - Pod board wybrany do eksmisji już nie istnieje, a dokładnie jeden oryginalny Pod board pozostaje.
  - Serwer potwierdza, że oryginalny Pod wybrany w `eviction.json` został usunięty przez Eviction API.
  - Konto środowiska nie może zmieniać statusu Podów przez patch.

  PDB reguluje dobrowolne usuwanie; nie zapobiega utracie węzła, bezpośredniemu usunięciu Poda ani rollout Deployment, a zmieniony plik żądania nie dowodzi usunięcia zaobserwowanego przez serwer.
debrief: Konserwacja ma teraz wyraźnie określone, zdrowe minimum, zweryfikowane przez prawdziwy eviction i
  sondy serwisowe.
stages.0.brief: Zakończ obserwowalną dobrowolną konserwację i przywróć obie zdrowe repliki.
