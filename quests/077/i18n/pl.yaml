hints.0.text: Budżet zakłóceń uwzględnia rzeczywistą gotowość, a nie tylko żądaną liczbę replik. Aplikacja
  musi pozostać dostępna podczas przygotowania zastępstwa.
hints.1.text: |-
  Porównaj sondę gotowości Poda, zdarzenia jej błędów i stan PDB, zanim zdecydujesz, czy eksmisja jest bezpieczna.

  ```sh
  kubectl describe pods -l app=board
  kubectl get pdb -o yaml
  kubectl get pods -l app=board -o yaml
  ```
hints.2.text: |-
  Przywróć niespełniony warunek gotowości wewnątrz istniejącego Poda bez jego zastępowania. Gdy budżet pozwoli na konserwację, samodzielnie zbuduj Eviction policy/v1 w `eviction.json` z nazwą pierwotnego Poda, `$DQ_NAMESPACE` i `deleteOptions.preconditions.uid`; wyślij go do podzasobu eviction tego Poda. Zachowaj dostarczone okno zakończenia.

  Sprawdź dwie gotowe repliki, zdrowe minimum i zezwolenie, ciągłość HTTP, dokładnie jeden pozostały pierwotny UID oraz potwierdzenie serwera dla wyeksmitowanego UID.

  ```sh
  kubectl get deployment board
  kubectl get pdb
  cat eviction.json
  cat /run/dq/observations/evictions.json
  kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080
  kubectl auth can-i patch pods --subresource=status
  ```
phrases.0: Dopasowałem disruption budget do dostępnej pojemności repliki.
phrases.1: Zamiast bezpośredniego usuwania użyłem Eviction API.
phrases.2: Rozróżniłem dobrowolne zabezpieczenie konserwacyjne od odzyskiwania po awarii.
questions.0.points.0: Ogranicza dobrowolne disruptions poprzez Eviction API.
questions.0.points.1: Nie może zapobiec awarii komputera ani bezpośredniemu usunięciu.
questions.0.points.2: Dostępność wdrożenia Deployment wykorzystuje własną strategię.
questions.0.prompt: Które disruptions ogranicza PDB?
questions.1.points.0: Budżet może wymagać, aby obie repliki pozostały w dobrej kondycji.
questions.1.points.1: Sprawdź selector, prawidłową liczbę i disruptionsAllowed.
questions.1.points.2: Wybierz minimum zgodne z wymogami konserwacji.
questions.1.prompt: Dlaczego sprawna usługa dwóch replik może odrzucić eviction?
