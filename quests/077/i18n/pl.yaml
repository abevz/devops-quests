title: Konserwacja PDB
brief: |
  Usługa potrzebuje bezpiecznego okna dobrowolnej konserwacji z zachowaniem dostępności. Zachowaj dostarczony 10-sekundowy hook preStop, aby zakończenie pozostało obserwowalne.

  Pracuj w `~/quest` na workstation. Dostarczone pliki wejściowe: `board.yaml`, `service.yaml`, `client.yaml`, `pdb.yaml`, `evict-one.sh`, `original-pod-uids.json`.

  **Wymagania:**
  - Wewnątrz kontenera `worker` Deployment `client` żądanie HTTP do `http://board:8080` zwraca `north-77`.
  - PDB `board-budget` chroni Pody z etykietą `app=board` i wymaga co najmniej jednego zdrowego Poda.
  - Deployment `board` ma dokładnie dwie repliki, obie gotowe.
  - PDB `board-budget` zgłasza:
    - Zdrowe: `2`
    - Wymagane zdrowe: `1`
    - Dozwolone zakłócenia: `1`
  - W `~/quest` na workstation plik `eviction.json` zapisuje żądanie Eviction API dla oryginalnego Poda w tym środowisku:
    - API: `policy/v1`
    - Rodzaj: `Eviction`
    - Przestrzeń nazw: `$DQ_NAMESPACE`
    - Warunek UID: UID oryginalnego Poda
  - Wybrany Pod już nie istnieje i pozostaje dokładnie jeden oryginalny Pod. Oryginalna lista UID jest chroniona na workstation:
    - `/run/dq/facts/0/original-pod-uids.json`
  - Serwer potwierdza usunięcie wybranego oryginalnego Poda przez Eviction API; potwierdzenie tylko do odczytu jest na workstation:
    - `/run/dq/observations/evictions.json`
  - Twoje konto środowiska nie może zmieniać statusu Podów przez patch.

  **Sprawdź samodzielnie przed Check & finish:**
  Wykonaj te polecenia obserwacyjne w `~/quest` na workstation.
  - `kubectl exec deployment/client -c worker -- wget -qO- -T 3 http://board:8080` — Odbiorca usługi otrzymuje `north-77`.
  - Selektor oraz liczby zdrowych Podów i zakłóceń odpowiadają wymaganiom, obie repliki są gotowe, a odpowiedź autoryzacji to `no`.

    ```sh
    kubectl get pdb board-budget -o yaml
    kubectl get deployment board
    kubectl auth can-i patch pods --subresource=status
    ```
  - Żądanie wskazuje to środowisko i UID oryginalnego Poda jako warunek wstępny. Tego UID nie ma wśród bieżących Podów, ale znajduje się w potwierdzeniu serwera; pozostaje dokładnie jeden oryginalny Pod.

    ```sh
    cat eviction.json
    cat /run/dq/facts/0/original-pod-uids.json
    kubectl get pods -l app=board -o json
    cat /run/dq/observations/evictions.json
    ```

  PDB reguluje dobrowolne usuwanie; nie zapobiega utracie węzła, bezpośredniemu usunięciu Poda ani rollout Deployment, a zmieniony plik żądania nie dowodzi usunięcia zaobserwowanego przez serwer.
debrief: Konserwacja ma teraz wyraźnie określone, zdrowe minimum, zweryfikowane przez prawdziwy eviction
  i sondy serwisowe.
stages.0.brief: |
  Zakończ obserwowalną dobrowolną konserwację i przywróć obie zdrowe repliki.
stages.0.objectives.0.text: PDB `board-budget` chroni Pody z etykietą `app=board` i wymaga co najmniej
  jednego zdrowego Poda.
stages.0.objectives.1.text: Deployment `board` ma dokładnie dwie repliki, obie gotowe.
stages.0.objectives.2.text: PDB `board-budget` zgłasza dwa zdrowe Pody, wymagane minimum jednego zdrowego
  Poda i jedno dozwolone zakłócenie.
stages.0.objectives.3.text: HTTP z Deployment `client` do `http://board:8080` zwraca `north-77`.
stages.0.objectives.4.text: '`eviction.json` zapisuje żądanie Eviction API dla oryginalnego Poda board
  w tym środowisku, zabezpieczone jego UID.'
stages.0.objectives.5.text: Pod board wybrany do eksmisji już nie istnieje, a dokładnie jeden oryginalny
  Pod board pozostaje.
stages.0.objectives.6.text: Serwer potwierdza, że oryginalny Pod wybrany w `eviction.json` został usunięty
  przez Eviction API.
stages.0.objectives.7.text: Konto środowiska nie może zmieniać statusu Podów przez patch.
hints.0.text: Budżet dwa z dwóch nie pozostawia miejsca na dobrowolne utrzymanie.
hints.1.text: Napraw selector i repliki; zmień tylko zdrowe minimum.
hints.2.text: |
  Poczekaj na disruptionsAllowed=1; następnie bash evict-one.sh wysyła żądanie Eviction API z warunkiem UID i sprawdza HTTP podczas wymiany. Sprawdź przywrócenie działania. Backend obserwuje DisruptionTarget z powodem EvictionByEvictionAPI podczas kończenia; bezpośrednie usunięcie lub edycja JSON nie tworzą tego potwierdzenia. Dostarczony 10-sekundowy hook preStop zapewnia obserwowalność przy odpytywaniu co 2.5 sekundy; zachowaj go.
phrases.0: Dopasowałem disruption budget do dostępnej pojemności repliki.
phrases.1: Zamiast bezpośredniego usuwania użyłem Eviction API.
phrases.2: Rozróżniłem dobrowolne zabezpieczenie konserwacyjne od odzyskiwania po awarii.
questions.0.points.0: Ogranicza dobrowolne disruptions poprzez Eviction API.
questions.0.points.1: Nie może zapobiec awarii komputera ani bezpośredniemu usunięciu.
questions.0.points.2: Dostępność wdrożenia Deployment wykorzystuje własną strategię.
questions.0.prompt: Które disruptions ogranicza PDB?
questions.1.points.0: Budżet może wymagać, aby obie repliki pozostały w dobrej kondycji.
questions.1.points.1: Sprawdź selector, prawidłową liczbę i disruptionsAllowed.
questions.1.points.2: Wybierz minimum zgodne z wymogami konserwacji.
questions.1.prompt: Dlaczego sprawna usługa dwóch replik może odrzucić eviction?
