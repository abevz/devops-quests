hints.0.text: Budżet zakłóceń równoważy dobrowolną konserwację z dostępnością aplikacji.
hints.1.text: |-
  Budżet dwa z dwóch nie pozostawia miejsca na dobrowolne utrzymanie.

  Napraw selector i repliki; zmień tylko zdrowe minimum.

  Sprawdź dostarczone definicje, bieżące zasoby i zdarzenia.

  ```sh
  cat pdb.yaml
  kubectl get pdb board-budget -o yaml
  kubectl describe deployment board
  kubectl get pods -l app=board -o yaml
  ```
hints.2.text: |-
  Poczekaj na disruptionsAllowed=1; następnie bash evict-one.sh wysyła żądanie Eviction API z warunkiem UID i sprawdza HTTP podczas wymiany. Sprawdź przywrócenie działania. Backend obserwuje DisruptionTarget z powodem EvictionByEvictionAPI podczas kończenia; bezpośrednie usunięcie lub edycja JSON nie tworzą tego potwierdzenia. Dostarczony 10-sekundowy hook preStop zapewnia obserwowalność przy odpytywaniu co 2.5 sekundy; zachowaj go.

  Sprawdź obserwowany wynik:

  ```sh
  kubectl get deployment board
  kubectl get pdb board-budget
  bash evict-one.sh
  cat eviction.json
  cat /run/dq/observations/evictions.json
  kubectl exec deployment/client -c worker -- wget -qO- -T 3 http://board:8080
  kubectl auth can-i patch pods --subresource=status
  ```

  Oczekuj dwóch gotowych replik, dwóch zdrowych Podów, minimum jednego i jednej dozwolonej przerwy; HTTP zwraca north-77, a autoryzacja no. Wybrany oryginalny Pod nie istnieje, pozostaje dokładnie jeden oryginalny, a pokwitowanie serwera potwierdza eviction wybranego UID.

  Dostarczone ograniczenia i szczegóły: PDB `board-budget` chroni Pody z etykietą `app=board` i wymaga co najmniej jednego zdrowego Poda. PDB `board-budget` zgłasza dwa zdrowe Pody, wymagane minimum jednego zdrowego Poda i jedno dozwolone zakłócenie.

  W ~/quest na stacji roboczej eviction.json musi wskazywać Eviction policy/v1 w $DQ_NAMESPACE z warunkiem wstępnym oryginalnego UID Poda. Zachowaj dostarczony 10-sekundowy hook preStop; pozwala serwerowi obserwować kończenie.
phrases.0: Dopasowałem disruption budget do dostępnej pojemności repliki.
phrases.1: Zamiast bezpośredniego usuwania użyłem Eviction API.
phrases.2: Rozróżniłem dobrowolne zabezpieczenie konserwacyjne od odzyskiwania po awarii.
questions.0.points.0: Ogranicza dobrowolne disruptions poprzez Eviction API.
questions.0.points.1: Nie może zapobiec awarii komputera ani bezpośredniemu usunięciu.
questions.0.points.2: Dostępność wdrożenia Deployment wykorzystuje własną strategię.
questions.0.prompt: Które disruptions ogranicza PDB?
questions.1.points.0: Budżet może wymagać, aby obie repliki pozostały w dobrej kondycji.
questions.1.points.1: Sprawdź selector, prawidłową liczbę i disruptionsAllowed.
questions.1.points.2: Wybierz minimum zgodne z wymogami konserwacji.
questions.1.prompt: Dlaczego sprawna usługa dwóch replik może odrzucić eviction?
