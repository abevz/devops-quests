hints.0.text: Un presupuesto de interrupción usa la disponibilidad real, no solo el número deseado de
  réplicas. La aplicación debe seguir disponible mientras se prepara el reemplazo.
hints.1.text: |-
  Compara la sonda de disponibilidad del Pod, sus eventos de fallo y el estado del PDB antes de decidir si una expulsión es segura.

  ```sh
  kubectl describe pods -l app=board
  kubectl get pdb -o yaml
  kubectl get pods -l app=board -o yaml
  ```
hints.2.text: |-
  Restaura la condición de disponibilidad que falla dentro del Pod existente sin reemplazarlo. Cuando el presupuesto permita mantenimiento, construye una Eviction policy/v1 en `eviction.json` con el nombre del Pod original, `$DQ_NAMESPACE` y `deleteOptions.preconditions.uid`; envíala al subrecurso eviction de ese Pod. Conserva la ventana de terminación suministrada.

  Verifica dos réplicas listas, el mínimo sano y el permiso, continuidad HTTP, exactamente un UID original restante y el recibo del servidor para el UID expulsado.

  ```sh
  kubectl get deployment board
  kubectl get pdb
  cat eviction.json
  cat /run/dq/observations/evictions.json
  kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080
  kubectl auth can-i patch pods --subresource=status
  ```
phrases.0: Alineé el disruption budget con la capacidad de réplica disponible.
phrases.1: Utilicé Eviction API en lugar de la eliminación directa.
phrases.2: Distinguí la protección de mantenimiento voluntario de la recuperación de fallas.
questions.0.points.0: Restringe el disruptions voluntario a través del Eviction API.
questions.0.points.1: No puede evitar un fallo de la máquina o una eliminación directa.
questions.0.points.2: La disponibilidad de Deployment rollout utiliza su propia estrategia.
questions.0.prompt: ¿Qué disruptions restringe un PDB?
questions.1.points.0: El presupuesto puede requerir que ambas réplicas se mantengan saludables.
questions.1.points.1: Verifique selector, recuento saludable y disruptionsAllowed.
questions.1.points.2: Elija un mínimo consistente con el requisito de mantenimiento.
questions.1.prompt: ¿Por qué un servicio de dos réplicas en buen estado puede rechazar un eviction?
