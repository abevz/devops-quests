hints.0.text: Un presupuesto de interrupción usa la disponibilidad real, no solo el número deseado de
  réplicas. La aplicación debe seguir disponible mientras se prepara el reemplazo.
hints.1.text: |-
  Compara la sonda de disponibilidad del Pod, sus eventos de fallo y el estado del PDB antes de decidir si una expulsión es segura.

  Revisa el nombre y el UID del Pod original, el espacio de nombres y los ajustes de disponibilidad y terminación. En la solicitud Eviction, localiza el destino y la precondición UID y compáralos con el Pod observado.

  ```sh
  kubectl describe pods -l app=board
  kubectl get pdb -o yaml
  kubectl get pods -l app=board -o yaml
  jq . original-pod-uids.json
  if test -f eviction.json; then jq . eviction.json; fi
  ```
hints.2.text: |-
  Espera dos réplicas listas, dos Pods sanos con un mínimo de uno, un desalojo permitido y la respuesta HTTP `north-77`. El Eviction enviado debe indicar el nombre del Pod original y su UID. El UID desalojado debe haber desaparecido de los Pods activos, debe sobrevivir exactamente un UID original y el comprobante del servidor debe incluir el UID desalojado. La comprobación del permiso para modificar el estado debe devolver `no`.

  ```sh
  kubectl get deployment board
  kubectl get pdb board-budget
  jq . eviction.json
  uid=$(jq -er .deleteOptions.preconditions.uid eviction.json)
  kubectl get pods -l app=board -o json |
    jq --arg uid "$uid" --slurpfile original original-pod-uids.json '
      [.items[].metadata.uid] as $live |
      {evictedPresent: ($live | index($uid) != null),
       originalSurvivors: [$live[] | select(. as $candidate | $original[0] | index($candidate) != null)]}'
  jq --arg uid "$uid" 'index($uid) != null' /run/dq/observations/evictions.json
  kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080
  kubectl auth can-i patch pods --subresource=status
  ```
phrases.0: Alineé el disruption budget con la capacidad de réplica disponible.
phrases.1: Utilicé Eviction API en lugar de la eliminación directa.
phrases.2: Distinguí la protección de mantenimiento voluntario de la recuperación de fallas.
questions.0.points.0: Restringe el disruptions voluntario a través del Eviction API.
questions.0.points.1: No puede evitar un fallo de la máquina o una eliminación directa.
questions.0.points.2: La disponibilidad de Deployment rollout utiliza su propia estrategia.
questions.0.prompt: ¿Qué disruptions restringe un PDB?
questions.1.points.0: El presupuesto puede requerir que ambas réplicas se mantengan saludables.
questions.1.points.1: Verifique selector, recuento saludable y disruptionsAllowed.
questions.1.points.2: Elija un mínimo consistente con el requisito de mantenimiento.
questions.1.prompt: ¿Por qué un servicio de dos réplicas en buen estado puede rechazar un eviction?
diagnostics.probe_0_0: El presupuesto puede seleccionar otros Pod o no conservar réplica disponible; mantenga identidad board en selector y exactamente un campo de disponibilidad con mínimo redondeado al menos uno. Errores API u objeto malformado también dan fallback. [Causa y comprobación](guides#guide=kubernetes-17&section=maintenance-pdb-selector-and-retained-availability)
diagnostics.pdb_replicas: Setup elimina bandera readiness de un Pod existente; restaure disponibilidad y mantenga dos réplicas en vez de reemplazar ambos Pod originales. [Causa y comprobación](guides#guide=kubernetes-17&section=maintenance-original-readiness-fault)
diagnostics.pdb_status: El mínimo suministrado de dos y el Pod no listo bloquean mantenimiento; restaure dos réplicas saludables y mínimo requerido uno para permitir una disruption. [Causa y comprobación](guides#guide=kubernetes-17&section=maintenance-healthy-pods-and-one-disruption)
diagnostics.pdb_http: El cliente puede perder respuesta Service por endpoints no listos o selector erróneo; compruebe north-77 mediante client y Service suministrados durante recuperación. [Causa y comprobación](guides#guide=kubernetes-17&section=maintenance-client-service-availability)
diagnostics.eviction_request: La solicitud guardada puede apuntar a otro namespace o carecer de precondition UID original; use policy/v1 Eviction del namespace actual con UID de lista fijada. [Causa y comprobación](guides#guide=kubernetes-17&section=maintenance-eviction-original-uid-precondition)
diagnostics.eviction_replacement: El Pod objetivo puede seguir terminando o reemplazar ambos eliminó ambos UID originales; espere desaparición del UID solicitado conservando exactamente un original. [Causa y comprobación](guides#guide=kubernetes-17&section=maintenance-one-original-pod-survives)
diagnostics.eviction_observed: El borrado normal no acredita Eviction API; el observer protegido debe ver UID original con condición disruption API antes de desaparecer. Conserve terminación gradual y petición API real. [Causa y comprobación](guides#guide=kubernetes-17&section=maintenance-protected-api-eviction-receipt)
diagnostics.pod_status_denied: Otro contexto o permisos ampliados pueden permitir patch de estado Pod; mantenga identidad limitada suministrada. Errores API/transporte también impiden respuesta no esperada. [Causa y comprobación](guides#guide=kubernetes-17&section=maintenance-limited-pod-status-authority)
