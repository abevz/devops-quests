title: Mantenimiento PDB
brief: 'El servicio necesita una ventana de mantenimiento voluntario sin perder disponibilidad. Conserva la
  ventana de observación de terminación suministrada.


  Trabaja en `~/quest` en la workstation. Archivos de entrada suministrados: `board.yaml`, `service.yaml`,
  `client.yaml`, `pdb.yaml`, `evict-one.sh`.


  El archivo de petición está en `~/quest` en la estación de trabajo.


  **Requisitos:**

  - El presupuesto de interrupciones existente protege los Pods de la aplicación y exige al menos un Pod sano.

  - El Deployment `board` tiene exactamente dos réplicas, ambas listas.

  - El presupuesto de interrupciones de la aplicación informa dos Pods sanos, un mínimo sano de uno y una interrupción
  permitida.

  - HTTP desde Deployment `client` a `http://board:8080` devuelve `north-77`.

  - `eviction.json` registra una solicitud de Eviction API para un Pod board original de este entorno, protegida
  por el UID de ese Pod.

  - El Pod board elegido para la expulsión ya no está y queda exactamente un Pod board original.

  - El servidor confirma que el Pod original elegido en `eviction.json` fue expulsado mediante Eviction API.

  - La cuenta del entorno no puede modificar el estado de los Pods mediante patch.


  Un PDB regula la expulsión voluntaria; no evita la pérdida de nodos, el borrado directo de Pods ni un rollout
  del Deployment, y un archivo de solicitud editado no demuestra una expulsión observada por el servidor.

  '
debrief: El mantenimiento ahora tiene un mínimo saludable explícito, verificado por un eviction real y sondas
  de servicio.
