hints.0.text: Un presupuesto de interrupciones equilibra el mantenimiento voluntario y la disponibilidad de
  la aplicación.
hints.1.text: 'Un presupuesto de dos de dos no deja espacio para el mantenimiento voluntario.


  Mantenga fijo el selector y las réplicas; cambie sólo el mínimo saludable.


  Inspecciona las definiciones suministradas, los recursos actuales y los eventos.


  ```sh

  cat pdb.yaml

  kubectl get pdb board-budget -o yaml

  kubectl describe deployment board

  cat eviction.json

  kubectl get pods -l app=board -o yaml

  cat /run/dq/observations/evictions.json

  ```'
hints.2.text: 'Espera disruptionsAllowed=1; después bash evict-one.sh envía una solicitud de Eviction API protegida
  por UID y prueba HTTP durante la sustitución. Verifica la recuperación. El backend observa DisruptionTarget
  con motivo EvictionByEvictionAPI durante la terminación; el borrado directo o editar JSON no generan este
  comprobante. El hook preStop de 10 segundos suministrado mantiene la terminación observable durante el sondeo
  cada 2.5 segundos; consérvalo.


  Verifica el resultado observado:


  ```sh

  kubectl get deployment board

  kubectl get pdb board-budget

  kubectl exec deployment/client -c worker -- wget -qO- -T 3 http://board:8080

  kubectl auth can-i patch pods --subresource=status

  ```


  Se esperan dos réplicas listas, dos Pods sanos, un mínimo sano de uno y una interrupción permitida; HTTP
  devuelve north-77 y la autorización no. El Pod original seleccionado ya no está, queda exactamente uno original
  y el recibo del servidor confirma la eviction del UID seleccionado.


  Restricciones y detalles suministrados: El PDB `board-budget` protege Pods con la etiqueta `app=board` y
  requiere al menos un Pod sano. El PDB `board-budget` indica dos Pods sanos, un mínimo de un Pod sano y una
  interrupción permitida.


  En ~/quest de la estación de trabajo, eviction.json debe nombrar una Eviction policy/v1 en $DQ_NAMESPACE
  con la condición previa del UID de un Pod original. Conserva el hook preStop de 10 segundos suministrado;
  permite al servidor observar la terminación.'
phrases.0: Alineé el disruption budget con la capacidad de réplica disponible.
phrases.1: Utilicé Eviction API en lugar de la eliminación directa.
phrases.2: Distinguí la protección de mantenimiento voluntario de la recuperación de fallas.
questions.0.points.0: Restringe el disruptions voluntario a través del Eviction API.
questions.0.points.1: No puede evitar un fallo de la máquina o una eliminación directa.
questions.0.points.2: La disponibilidad de Deployment rollout utiliza su propia estrategia.
questions.0.prompt: ¿Qué disruptions restringe un PDB?
questions.1.points.0: El presupuesto puede requerir que ambas réplicas se mantengan saludables.
questions.1.points.1: Verifique selector, recuento saludable y disruptionsAllowed.
questions.1.points.2: Elija un mínimo consistente con el requisito de mantenimiento.
questions.1.prompt: ¿Por qué un servicio de dos réplicas en buen estado puede rechazar un eviction?
