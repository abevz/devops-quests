title: Gitea branches
brief: 'In `~/quest/repository`, the release notice is on the private `release-candidate` branch while `main` still contains the retired notice. A branch points to a commit; an ancestor is an earlier commit in its history. Read `baseline-commit` in `~/quest`, compare the branch history and transfer the intended change by merge or cherry-pick. Push `main` to the supplied private remote. Work only in this offline bay.


  For verification, fetch `origin/main` and `origin/release-candidate`; check out local `main` and leave a clean working tree. Both `HEAD:notice.txt` and `origin/main:notice.txt` must contain `north-41`. The commit in `baseline-commit` must be an ancestor of `origin/main`, and `HEAD` must equal `origin/main` as a commit, not only as file content. This last condition shows the checked-out result was published. The check observes the content and ancestry, not the exact transfer method.'
debrief: The checked-out main, remote commit, notice and baseline ancestry matched the checks.
stages.0.brief: The checked-out main, clean tree, matching local and remote commits, notice content and baseline ancestry match the brief.
stages.0.objectives.0.text: The checked-out main, clean tree, matching local and remote commits, notice content and baseline ancestry match the brief.
hints.0.text: Compare branch tips and the notice file before changing history.
hints.1.text: A commit belongs to the graph, not permanently to one branch.
hints.2.text: Cherry-pick the candidate onto main, then push only main.
phrases.0: I compared local and remote deployment refs before transferring the release
  commit.
phrases.1: I retained the initial history and published the intended main branch.
phrases.2: I verified the remote file and a clean working tree after the push.
questions.0.points.0: Inspect refs and the commit graph first.
questions.0.points.1: Choose merge or cherry-pick according to the intended history.
questions.0.points.2: Verify the remote deployment ref, not only the local file.
questions.0.prompt: How do you recover a change made on the wrong delivery branch?
questions.1.points.0: It identifies reviewed desired state.
questions.1.points.1: A controller still needs credentials and reconciliation.
questions.1.points.2: A successful push alone does not prove a healthy rollout.
