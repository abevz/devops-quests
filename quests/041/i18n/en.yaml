title: Gitea branches
brief: |
  The release notice is not available from the published result.

  Work on the workstation in `~/quest` with `repository/notice.txt`, `platform.env`, `baseline-commit`.

  **Requirements:**
  - Workstation Git repository:
    - Path: `~/quest/repository`.
    - Remote branches available: `origin/main`, `origin/release-candidate`.
    - Checked-out branch: `main`.
    - Clean working tree; `HEAD` and `origin/main` are the same existing commit.
    - `HEAD:notice.txt`, `origin/main:notice.txt`: `north-41`.
  - Publication history:
    - The commit in workstation `~/quest/baseline-commit` is an ancestor of `origin/main`.

  **Verify yourself before Check & finish:**
  - `git -C repository ls-remote --heads origin main release-candidate` — Both remote branches are listed.
  - `git -C repository status --short --branch; git -C repository show HEAD:notice.txt; git -C repository show origin/main:notice.txt; git -C repository rev-parse HEAD origin/main` — Branch `main`, no changed paths, `north-41` in both notices, and two equal commit IDs.
  - `git -C repository merge-base --is-ancestor "$(cat baseline-commit)" origin/main; printf "ancestry status: %s\n" "$?"` — Prints `ancestry status: 0`.

  The check observes content, ancestry and publication identity, not the transfer method.
debrief: The checked-out main, remote commit, notice and baseline ancestry matched the checks.
stages.0.brief: The published notice must retain the required Git history.
hints.0.text: Compare branch tips and the notice file before changing history.
hints.1.text: The intended notice is on release-candidate while main still has the retired notice. A commit belongs
  to the graph, not permanently to one branch.
hints.2.text: Merge or cherry-pick the candidate onto main, fetch the private remote refs and push main. Leave main
  checked out and the working tree clean.
phrases.0: I compared local and remote deployment refs before transferring the release commit.
phrases.1: I retained the initial history and published the intended main branch.
phrases.2: I verified the remote file and a clean working tree after the push.
questions.0.points.0: Inspect refs and the commit graph first.
questions.0.points.1: Choose merge or cherry-pick according to the intended history.
questions.0.points.2: Verify the remote deployment ref, not only the local file.
questions.0.prompt: How do you recover a change made on the wrong delivery branch?
questions.1.points.0: It identifies reviewed desired state.
questions.1.points.1: A controller still needs credentials and reconciliation.
questions.1.points.2: A successful push alone does not prove a healthy rollout.
questions.1.prompt: What makes a Git branch a useful GitOps input?
diagnostics.fetch: git fetch origin main release-candidate must succeed.
diagnostics.branch: The current repository branch must be main.
diagnostics.origin_file: origin/main:notice.txt must equal north-41.
diagnostics.head_file: HEAD:notice.txt must equal north-41.
diagnostics.ancestor: baseline-commit must be nonempty and an ancestor of origin/main.
diagnostics.clean: git status --porcelain output must be empty.
diagnostics.head: HEAD must exist and equal origin/main.
stages.0.objectives.0.text: Both `main` and `release-candidate` are fetchable from the workstation repository remote
  `origin`.
stages.0.objectives.1.text: Workstation `~/quest/repository` is on branch `main` with a clean working tree.
stages.0.objectives.2.text: In workstation `~/quest/repository`, both `HEAD:notice.txt` and `origin/main:notice.txt`
  contain `north-41`.
stages.0.objectives.3.text: The commit recorded in workstation `~/quest/baseline-commit` is an ancestor of `origin/main`.
stages.0.objectives.4.text: Workstation repository `HEAD` and `origin/main` identify the same existing commit.
