title: Gitea branches
brief: 'The release notice was committed and pushed to release-candidate, while the
  private Gitea main branch still serves retired. Transfer that change to main and
  publish it to this game repository, preserving the initial commit and a clean working
  tree. There is no Kubernetes dependency in this bay.


  Quest files in `~/quest` (some appear in later stages): `platform.env`, `repository/notice.txt`,
  `baseline-commit`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images
  and private services. Change only this bay.


  Initial success criteria: Local main and origin/main contain north-41; the baseline
  remains an ancestor and the working tree is clean.'
debrief: The intended change reached the deployment branch without rewriting its existing
  history.
stages.0.brief: 'Success criteria: Local main and origin/main contain north-41; the
