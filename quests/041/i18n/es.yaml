diagnostics.head_file: HEAD:notice.txt debe ser igual a north-41.
diagnostics.ancestor: baseline-commit no debe estar vacío y debe ser antecesor de origin/main.
diagnostics.clean: La salida de git status --porcelain debe estar vacía.
diagnostics.head: HEAD debe existir y ser igual a origin/main.
