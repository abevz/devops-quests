title: Sucursales Gitea
brief: 'El aviso de versión no está disponible en el resultado publicado.


  Trabaja en la estación de trabajo en `~/quest` con `repository/notice.txt`, `platform.env`.


  **Requisitos:**

  - Tanto `main` como `release-candidate` se pueden obtener del remoto `origin` del repositorio en la workstation.

  - El repositorio `~/quest/repository` en la workstation está en la rama `main` con el árbol de trabajo limpio.

  - En `~/quest/repository` de la workstation, tanto `HEAD:notice.txt` como `origin/main:notice.txt` contienen
  `north-41`.

  - El historial publicado original sigue siendo antecesor de `origin/main`.

  - `HEAD` y `origin/main` del repositorio en la workstation identifican el mismo commit existente.


  La comprobación observa contenido, ascendencia e identidad de publicación, no el método de transferencia.

  '
debrief: La rama main seleccionada, el commit remoto, el aviso y la ascendencia de baseline coincidieron con
  las comprobaciones.
stages.0.brief: El aviso publicado debe conservar el historial Git requerido.
hints.0.text: Un resultado publicado en Git incluye el contenido y su historial.
hints.1.text: 'Compare las sugerencias de sucursales y el archivo de avisos antes de cambiar el historial.


  El aviso previsto está en release-candidate mientras main aún contiene el aviso retirado. Un commit pertenece
  al grafo, no permanentemente a una rama.


  Inspecciona las entradas suministradas y el estado observado:


  ```sh

  git -C repository log --all --oneline --decorate

  git -C repository show origin/release-candidate:notice.txt

  ```'
hints.2.text: 'Integra el candidato en main mediante merge o cherry-pick, obtén las refs del remoto privado
  y publica main. Deja main activa y el árbol de trabajo limpio.


  Verifica el resultado observado:


  - `git -C repository ls-remote --heads origin main release-candidate` — Se enumeran ambas ramas remotas.

  - `git -C repository status --short --branch; git -C repository show HEAD:notice.txt; git -C repository show
  origin/main:notice.txt; git -C repository rev-parse HEAD origin/main` — Rama `main`, sin rutas modificadas,
  `north-41` en ambos avisos y dos ID de commit iguales.

  - `git -C repository merge-base --is-ancestor "$(cat baseline-commit)" origin/main; printf "ancestry status:
  %s\n" "$?"` — Imprime `ancestry status: 0`.'
phrases.0: Comparé la implementación local y remota refs antes de transferir la confirmación de lanzamiento.
phrases.1: Conservé el historial inicial y publiqué la rama main prevista.
phrases.2: Verifiqué el archivo remoto y un árbol de trabajo limpio después del push.
questions.0.points.0: Primero inspeccione refs y el gráfico de confirmación.
questions.0.points.1: Elija merge o cherry-pick según el historial deseado.
questions.0.points.2: Verifique la implementación remota ref, no solo el archivo local.
questions.0.prompt: ¿Cómo se recupera un cambio realizado en la sucursal de entrega incorrecta?
questions.1.points.0: Identifica el estado deseado revisado.
questions.1.points.1: Un controlador todavía necesita credenciales y conciliación.
questions.1.points.2: Un push exitoso por sí solo no demuestra una implementación saludable.
questions.1.prompt: ¿Qué hace que una rama Git sea una entrada útil para GitOps?
