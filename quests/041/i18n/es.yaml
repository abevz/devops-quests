  commit existente.'
diagnostics.platform_inputs: La comprobación Git se detuvo antes de leer el repositorio; platform.env puede faltar, ser ilegible o fallar al cargarse. [Causa y comprobación](guides#guide=gitops-delivery&section=git-environment)
diagnostics.fetch: No se pudieron obtener main y release-candidate; origin puede tener una URL incorrecta, carecer de acceso o de una de las ramas. [Causa y comprobación](guides#guide=gitops-delivery&section=git-fetch)
diagnostics.branch: La rama actual no es main o no puede leerse; el repositorio puede seguir en release-candidate o tener HEAD separado. [Causa y comprobación](guides#guide=gitops-delivery&section=git-worktree)
diagnostics.clean: El árbol de trabajo tiene cambios o archivos sin seguimiento; puede haber ediciones sin confirmar o archivos temporales. [Causa y comprobación](guides#guide=gitops-delivery&section=git-worktree)
diagnostics.origin_file: origin/main:notice.txt no puede leerse o difiere de north-41; main puede no haberse enviado o la referencia remota local está desactualizada. [Causa y comprobación](guides#guide=gitops-delivery&section=git-committed-notice)
diagnostics.head_file: HEAD:notice.txt no puede leerse o difiere de north-41; main local puede no incluir el commit candidato aunque el archivo de trabajo se haya editado. [Causa y comprobación](guides#guide=gitops-delivery&section=git-committed-notice)
diagnostics.probe_0_2: No se pudieron inspeccionar los avisos confirmados; platform.env, el repositorio, Git o Python pueden no estar disponibles antes de comprobar las referencias. [Causa y comprobación](guides#guide=gitops-delivery&section=git-environment)
diagnostics.ancestor: La base falta, es inválida o no es antecesora de origin/main; el historial publicado puede haberse sustituido en vez de ampliarse. [Causa y comprobación](guides#guide=gitops-delivery&section=git-publication-history)
diagnostics.head: HEAD es inválido o difiere de origin/main; puede haber un commit local sin enviar o una referencia remota sin actualizar. [Causa y comprobación](guides#guide=gitops-delivery&section=git-publication-history)
