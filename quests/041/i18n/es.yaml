title: Sucursales Gitea
brief: 'El aviso de lanzamiento se confirmó y se envió a release-candidate, mientras que la sucursal privada
  Gitea main todavía presta servicio a retired. Transfiera ese cambio a main y publíquelo en este repositorio
  de juegos, conservando la confirmación inicial y un árbol de trabajo limpio. No hay ninguna dependencia
  de Kubernetes en esta bahía.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `platform.env`, `repository/notice.txt`,
  `baseline-commit`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: main y origin/main locales contienen north-41; la línea base sigue siendo
  un antepasado y el árbol de trabajo está limpio.'
debrief: El cambio previsto llegó a la rama de implementación sin reescribir su historial existente.
stages.0.brief: 'Criterios de éxito: Los locales main y origin/main contienen north-41; la línea base
