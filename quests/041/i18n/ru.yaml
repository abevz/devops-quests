title: Ветки Gitea
brief: 'Уведомление релиза закоммичено и отправлено в release-candidate, но main приватной
  Gitea всё ещё содержит retired. Перенесите изменение в main и опубликуйте его в
  этом игровом репозитории, сохранив исходный коммит и чистое рабочее дерево. Kubernetes
  в этой песочнице не нужен.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `platform.env`,
  `repository/notice.txt`, `baseline-commit`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно
  загруженные образы и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Локальная main и origin/main содержат north-41; исходный коммит
  остаётся предком, рабочее дерево чистое.'
debrief: Нужное изменение попало в ветку доставки без переписывания существующей истории.
stages.0.brief: 'Результат проверки: Локальная main и origin/main содержат north-41;
  исходный коммит остаётся предком, рабочее дерево чистое.'
stages.0.objectives.0.text: Локальная main и origin/main содержат north-41; исходный
  коммит остаётся предком, рабочее дерево чистое.
hints.0.text: Сравните вершины веток и файл уведомления до изменения истории.
hints.1.text: Коммит принадлежит графу, а не навсегда одной ветке.
hints.2.text: Перенесите candidate через cherry-pick в main и отправьте только main.
phrases.0: Я сравнил локальный и удалённый refs доставки до переноса коммита релиза.
phrases.1: Я сохранил исходную историю и отправил нужную ветку main.
phrases.2: После push я проверил удалённый файл и чистоту рабочего дерева.
questions.0.points.0: Сначала изучить refs и граф коммитов.
questions.0.points.1: Выбрать merge или cherry-pick по требуемой истории.
questions.0.points.2: Проверить удалённый ref доставки, а не только локальный файл.
questions.0.prompt: Как вернуть изменение, сделанное не в той ветке доставки?
questions.1.points.0: Она указывает проверенное требуемое состояние.
questions.1.points.1: Контроллеру всё ещё нужны учётные данные и сверка состояния.
questions.1.points.2: Успешный push сам по себе не доказывает исправность выкатки.
questions.1.prompt: Почему ветка Git удобна как вход GitOps?
