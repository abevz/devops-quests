title: Ветки Gitea
brief: |
  Уведомление о выпуске недоступно в опубликованном результате.

  Работайте на workstation в `~/quest` с файлами `repository/notice.txt`, `platform.env`, `baseline-commit`.

  **Требования:**
  - Git-репозиторий на workstation:
    - Путь: `~/quest/repository`.
    - Доступные удалённые ветки: `origin/main`, `origin/release-candidate`.
    - Текущая ветка: `main`.
    - Чистое рабочее дерево; `HEAD` и `origin/main` — один существующий коммит.
    - `HEAD:notice.txt`, `origin/main:notice.txt`: `north-41`.
  - История публикации:
    - Коммит из `~/quest/baseline-commit` на workstation является предком `origin/main`.

  **Самопроверка перед Check & finish:**
  - `git -C repository ls-remote --heads origin main release-candidate` — Перечислены обе удалённые ветки.
  - `git -C repository status --short --branch; git -C repository show HEAD:notice.txt; git -C repository show origin/main:notice.txt; git -C repository rev-parse HEAD origin/main` — Ветка `main`, изменённых путей нет, оба уведомления содержат `north-41`, два ID коммита совпадают.
  - `git -C repository merge-base --is-ancestor "$(cat baseline-commit)" origin/main; printf "ancestry status: %s\n" "$?"` — Печатает `ancestry status: 0`.

  Проверка наблюдает содержимое, родство коммитов и идентичность публикации, а не метод переноса.
debrief: Выбранная main, удалённый коммит, объявление и происхождение от baseline соответствовали проверкам.
stages.0.brief: Опубликованное уведомление должно сохранить требуемую историю Git.
hints.0.text: Сравните вершины веток и файл уведомления до изменения истории.
hints.1.text: Нужное уведомление находится в release-candidate, а main ещё содержит устаревшее уведомление. Коммит
  принадлежит графу, а не навсегда одной ветке.
hints.2.text: Перенесите candidate в main через merge или cherry-pick, получите ссылки приватного remote и отправьте
  main. Оставьте main текущей веткой, а рабочее дерево — чистым.
phrases.0: Я сравнил локальный и удалённый refs доставки до переноса коммита релиза.
phrases.1: Я сохранил исходную историю и отправил нужную ветку main.
phrases.2: После push я проверил удалённый файл и чистоту рабочего дерева.
questions.0.points.0: Сначала изучить refs и граф коммитов.
questions.0.points.1: Выбрать merge или cherry-pick по требуемой истории.
questions.0.points.2: Проверить удалённый ref доставки, а не только локальный файл.
questions.0.prompt: Как вернуть изменение, сделанное не в той ветке доставки?
questions.1.points.0: Она указывает проверенное требуемое состояние.
questions.1.points.1: Контроллеру всё ещё нужны учётные данные и сверка состояния.
questions.1.points.2: Успешный push сам по себе не доказывает исправность выкатки.
questions.1.prompt: Почему ветка Git удобна как вход GitOps?
diagnostics.fetch: git fetch origin main release-candidate должен завершиться успешно.
diagnostics.branch: Текущая ветка репозитория должна быть main.
diagnostics.origin_file: origin/main:notice.txt должен совпадать с north-41.
diagnostics.head_file: HEAD:notice.txt должен совпадать с north-41.
diagnostics.ancestor: baseline-commit должен быть непустым и предком origin/main.
diagnostics.clean: Вывод git status --porcelain должен быть пустым.
diagnostics.head: HEAD должен существовать и совпадать с origin/main.
stages.0.objectives.0.text: Обе ветки `main` и `release-candidate` доступны для получения из remote `origin` репозитория
  на workstation.
stages.0.objectives.1.text: Репозиторий `~/quest/repository` на workstation находится на ветке `main` с чистым рабочим
  деревом.
stages.0.objectives.2.text: В `~/quest/repository` на workstation и `HEAD:notice.txt`, и `origin/main:notice.txt`
  содержат `north-41`.
stages.0.objectives.3.text: Коммит из `~/quest/baseline-commit` на workstation является предком `origin/main`.
stages.0.objectives.4.text: '`HEAD` и `origin/main` репозитория на workstation указывают на один существующий коммит.'
