title: Ветки Gitea
brief: 'Уведомление о выпуске недоступно в опубликованном результате.


  Работайте на рабочей станции в `~/quest` с `repository/notice.txt`, `platform.env`.


  **Требования:**

  - Обе ветки `main` и `release-candidate` доступны для получения из remote `origin` репозитория на workstation.

  - Репозиторий `~/quest/repository` на workstation находится на ветке `main` с чистым рабочим деревом.

  - В `~/quest/repository` на workstation и `HEAD:notice.txt`, и `origin/main:notice.txt` содержат `north-41`.

  - Исходная опубликованная история остаётся предком `origin/main`.

  - `HEAD` и `origin/main` репозитория на workstation указывают на один существующий коммит.


  Проверка наблюдает содержимое, родство коммитов и идентичность публикации, а не метод переноса.

  '
debrief: Выбранная main, удалённый коммит, объявление и происхождение от baseline соответствовали проверкам.
stages.0.brief: Опубликованное уведомление должно сохранить требуемую историю Git.
hints.0.text: Опубликованный результат Git включает содержимое файла и его историю.
hints.1.text: 'Сравните вершины веток и файл уведомления до изменения истории.


  Нужное уведомление находится в release-candidate, а main ещё содержит устаревшее уведомление. Коммит принадлежит
  графу, а не навсегда одной ветке.


  Изучите поставленные входные данные и наблюдаемое состояние:


  ```sh

  git -C repository log --all --oneline --decorate

  git -C repository show origin/release-candidate:notice.txt

  ```'
hints.2.text: 'Перенесите candidate в main через merge или cherry-pick, получите ссылки приватного remote и
  отправьте main. Оставьте main текущей веткой, а рабочее дерево — чистым.


  Проверьте наблюдаемый результат:


  - `git -C repository ls-remote --heads origin main release-candidate` — Перечислены обе удалённые ветки.

  - `git -C repository status --short --branch; git -C repository show HEAD:notice.txt; git -C repository show
  origin/main:notice.txt; git -C repository rev-parse HEAD origin/main` — Ветка `main`, изменённых путей нет,
  оба уведомления содержат `north-41`, два ID коммита совпадают.

  - `git -C repository merge-base --is-ancestor "$(cat baseline-commit)" origin/main; printf "ancestry status:
  %s\n" "$?"` — Печатает `ancestry status: 0`.'
phrases.0: Я сравнил локальный и удалённый refs доставки до переноса коммита релиза.
phrases.1: Я сохранил исходную историю и отправил нужную ветку main.
phrases.2: После push я проверил удалённый файл и чистоту рабочего дерева.
questions.0.points.0: Сначала изучить refs и граф коммитов.
questions.0.points.1: Выбрать merge или cherry-pick по требуемой истории.
questions.0.points.2: Проверить удалённый ref доставки, а не только локальный файл.
questions.0.prompt: Как вернуть изменение, сделанное не в той ветке доставки?
questions.1.points.0: Она указывает проверенное требуемое состояние.
questions.1.points.1: Контроллеру всё ещё нужны учётные данные и сверка состояния.
questions.1.points.2: Успешный push сам по себе не доказывает исправность выкатки.
questions.1.prompt: Почему ветка Git удобна как вход GitOps?
