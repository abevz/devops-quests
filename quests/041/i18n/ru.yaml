title: Ветки Gitea
brief: 'В `~/quest/repository` объявление выпуска находится в приватной ветке `release-candidate`, а `main` всё ещё содержит старое объявление. Ветка указывает на коммит; предок — более ранний коммит в его истории. Прочитайте `baseline-commit` в `~/quest`, сравните историю веток и перенесите изменение через merge или cherry-pick. Отправьте `main` в выданный приватный удалённый репозиторий. Работайте только в офлайн-песочнице.


  Для проверки получите `origin/main` и `origin/release-candidate`, переключитесь на локальную `main` и оставьте рабочее дерево чистым. И `HEAD:notice.txt`, и `origin/main:notice.txt` должны содержать `north-41`. Коммит из `baseline-commit` должен быть предком `origin/main`, а `HEAD` должен совпадать с `origin/main` как коммит, а не только по содержимому файла. Последнее условие показывает, что выбранный результат опубликован. Проверка наблюдает содержимое и историю предков, но не точный способ переноса.'
debrief: Выбранная main, удалённый коммит, объявление и происхождение от baseline соответствовали проверкам.
stages.0.brief: Выбранная main, чистое дерево, совпадающие локальный и удалённый коммиты, содержимое объявления и происхождение от baseline соответствуют заданию.
stages.0.objectives.0.text: Выбранная main, чистое дерево, совпадающие локальный и удалённый коммиты, содержимое объявления и происхождение от baseline соответствуют заданию.
hints.0.text: Сравните вершины веток и файл уведомления до изменения истории.
hints.1.text: Коммит принадлежит графу, а не навсегда одной ветке.
hints.2.text: Перенесите candidate через cherry-pick в main и отправьте только main.
phrases.0: Я сравнил локальный и удалённый refs доставки до переноса коммита релиза.
phrases.1: Я сохранил исходную историю и отправил нужную ветку main.
phrases.2: После push я проверил удалённый файл и чистоту рабочего дерева.
questions.0.points.0: Сначала изучить refs и граф коммитов.
questions.0.points.1: Выбрать merge или cherry-pick по требуемой истории.
questions.0.points.2: Проверить удалённый ref доставки, а не только локальный файл.
questions.0.prompt: Как вернуть изменение, сделанное не в той ветке доставки?
questions.1.points.0: Она указывает проверенное требуемое состояние.
questions.1.points.1: Контроллеру всё ещё нужны учётные данные и сверка состояния.
questions.1.points.2: Успешный push сам по себе не доказывает исправность выкатки.
questions.1.prompt: Почему ветка Git удобна как вход GitOps?
