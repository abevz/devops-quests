title: Oddziały Gitea
brief: |
  Powiadomienie o wydaniu jest niedostępne w opublikowanym wyniku.

  Pracuj na workstation w `~/quest` z plikami `repository/notice.txt`, `platform.env`, `baseline-commit`.

  **Wymagania:**
  - Repozytorium Git na workstation:
    - Ścieżka: `~/quest/repository`.
    - Dostępne gałęzie zdalne: `origin/main`, `origin/release-candidate`.
    - Aktywna gałąź: `main`.
    - Czyste drzewo robocze; `HEAD` i `origin/main` to ten sam istniejący commit.
    - `HEAD:notice.txt`, `origin/main:notice.txt`: `north-41`.
  - Historia publikacji:
    - Commit z `~/quest/baseline-commit` na workstation jest przodkiem `origin/main`.

  **Sprawdź przed Check & finish:**
  - `git -C repository ls-remote --heads origin main release-candidate` — Widoczne są obie gałęzie zdalne.
  - `git -C repository status --short --branch; git -C repository show HEAD:notice.txt; git -C repository show origin/main:notice.txt; git -C repository rev-parse HEAD origin/main` — Gałąź `main`, brak zmienionych ścieżek, `north-41` w obu powiadomieniach i dwa jednakowe ID commita.
  - `git -C repository merge-base --is-ancestor "$(cat baseline-commit)" origin/main; printf "ancestry status: %s\n" "$?"` — Wypisuje `ancestry status: 0`.

  Sprawdzenie obserwuje treść, pochodzenie commitów i tożsamość publikacji, a nie metodę przeniesienia.
debrief: Wybrana main, zdalny commit, powiadomienie i pochodzenie od baseline odpowiadały kontrolom.
stages.0.brief: Opublikowane powiadomienie musi zachować wymaganą historię Git.
hints.0.text: Przed zmianą historii porównaj wskazówki dotyczące oddziałów i plik powiadomień.
hints.1.text: Wymagane powiadomienie jest na release-candidate, a main nadal zawiera stare powiadomienie. Commit
  należy do grafu, a nie na stałe do jednej gałęzi.
hints.2.text: Przenieś kandydata do main przez merge lub cherry-pick, pobierz referencje prywatnego remote i wypchnij
  main. Pozostaw main aktywną i czyste drzewo robocze.
phrases.0: Porównałem wdrożenie lokalne i zdalne refs przed przesłaniem zatwierdzenia wydania.
phrases.1: Zachowałem początkową historię i opublikowałem zamierzoną gałąź main.
phrases.2: Zweryfikowałem zdalny plik i czyste drzewo robocze po push.
questions.0.points.0: Najpierw sprawdź refs i wykres zatwierdzeń.
questions.0.points.1: Wybierz merge lub cherry-pick zgodnie z zamierzoną historią.
questions.0.points.2: Sprawdź zdalną instalację ref, a nie tylko plik lokalny.
questions.0.prompt: Jak odzyskać zmianę dokonaną w niewłaściwej gałęzi dostawy?
questions.1.points.0: Identyfikuje sprawdzany stan pożądany.
questions.1.points.1: Administrator nadal potrzebuje poświadczeń i uzgodnienia.
questions.1.points.2: Sam udany push nie oznacza zdrowego wdrożenia.
questions.1.prompt: Co sprawia, że ​​gałąź Git jest użytecznym wejściem GitOps?
diagnostics.fetch: git fetch origin main release-candidate musi się powieść.
diagnostics.branch: Bieżąca gałąź repozytorium musi być main.
diagnostics.origin_file: origin/main:notice.txt musi być równe north-41.
diagnostics.head_file: HEAD:notice.txt musi być równe north-41.
diagnostics.ancestor: baseline-commit musi być niepusty i być przodkiem origin/main.
diagnostics.clean: Wyjście git status --porcelain musi być puste.
diagnostics.head: HEAD musi istnieć i być równy origin/main.
stages.0.objectives.0.text: Obie gałęzie `main` i `release-candidate` można pobrać ze zdalnego `origin` repozytorium
  na workstation.
stages.0.objectives.1.text: Repozytorium `~/quest/repository` na workstation jest na gałęzi `main` z czystym drzewem
  roboczym.
stages.0.objectives.2.text: W `~/quest/repository` na workstation zarówno `HEAD:notice.txt`, jak i `origin/main:notice.txt`
  zawierają `north-41`.
stages.0.objectives.3.text: Commit zapisany w `~/quest/baseline-commit` na workstation jest przodkiem `origin/main`.
stages.0.objectives.4.text: '`HEAD` i `origin/main` repozytorium na workstation wskazują ten sam istniejący commit.'
