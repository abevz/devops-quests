diagnostics.platform_inputs: Kontrola Git zatrzymała się przed odczytem repozytorium; platform.env może nie istnieć, być nieczytelny lub kończyć się błędem podczas ładowania. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=git-environment)
diagnostics.fetch: Pobranie main i release-candidate nie powiodło się; origin może mieć błędny URL, brak dostępu lub brak jednej z gałęzi. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=git-fetch)
diagnostics.branch: Bieżąca gałąź nie jest main lub nie można jej odczytać; repozytorium może nadal być na release-candidate albo w stanie detached HEAD. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=git-worktree)
diagnostics.clean: Drzewo robocze ma zmiany lub nieśledzone pliki; edycja mogła nie zostać zatwierdzona albo pozostały pliki tymczasowe. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=git-worktree)
diagnostics.origin_file: origin/main:notice.txt jest nieczytelny lub różni się od north-41; main mógł nie zostać wysłany albo pobrana referencja jest nieaktualna. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=git-committed-notice)
diagnostics.head_file: HEAD:notice.txt jest nieczytelny lub różni się od north-41; lokalny main może nie zawierać zatwierdzenia kandydata mimo edycji pliku roboczego. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=git-committed-notice)
diagnostics.probe_0_2: Nie udało się sprawdzić zatwierdzonych komunikatów; platform.env, repozytorium, Git lub Python mogą być niedostępne przed kontrolą referencji. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=git-environment)
diagnostics.ancestor: Punkt bazowy nie istnieje, jest nieprawidłowy lub nie jest przodkiem origin/main; opublikowana historia mogła zostać zastąpiona zamiast rozszerzona. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=git-publication-history)
diagnostics.head: HEAD jest nieprawidłowy lub różni się od origin/main; lokalny commit mógł nie zostać wysłany albo referencja zdalna nie została odświeżona. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=git-publication-history)
