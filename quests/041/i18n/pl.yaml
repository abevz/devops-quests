title: Oddziały Gitea
brief: 'W `~/quest/repository` powiadomienie wydania znajduje się na prywatnej gałęzi `release-candidate`, a `main` nadal
  zawiera stare powiadomienie. Gałąź wskazuje commit; przodek to wcześniejszy commit w jego historii. Przeczytaj `baseline-commit`
  w `~/quest`, porównaj historię gałęzi i przenieś zmianę przez merge lub cherry-pick. Wypchnij `main` do dostarczonego prywatnego
  zdalnego repozytorium. Pracuj tylko w zatoce offline.


  Aby sprawdzić wynik, pobierz `origin/main` i `origin/release-candidate`, przełącz się na lokalną `main` i pozostaw czyste
  drzewo robocze. Zarówno `HEAD:notice.txt`, jak i `origin/main:notice.txt` muszą zawierać `north-41`. Commit z `baseline-commit`
  musi być przodkiem `origin/main`, a `HEAD` musi być tym samym commitem co `origin/main`, nie tylko mieć tę samą zawartość
  pliku. Ten ostatni warunek pokazuje, że opublikowano sprawdzony wynik. Kontrola obserwuje zawartość i pochodzenie, nie dokładny
  sposób przeniesienia.'
debrief: Wybrana main, zdalny commit, powiadomienie i pochodzenie od baseline odpowiadały kontrolom.
stages.0.brief: Wybrana gałąź main, czyste drzewo, zgodne lokalne i zdalne commity, treść powiadomienia oraz pochodzenie od
  baseline odpowiadają opisowi.
stages.0.objectives.0.text: Wybrana gałąź main, czyste drzewo, zgodne lokalne i zdalne commity, treść powiadomienia oraz pochodzenie
  od baseline odpowiadają opisowi.
hints.0.text: Przed zmianą historii porównaj wskazówki dotyczące oddziałów i plik powiadomień.
hints.1.text: Zatwierdzenie należy do wykresu, a nie na stałe do jednej gałęzi.
hints.2.text: Wybierz candidate na main, a następnie wciśnij tylko main.
phrases.0: Porównałem wdrożenie lokalne i zdalne refs przed przesłaniem zatwierdzenia wydania.
phrases.1: Zachowałem początkową historię i opublikowałem zamierzoną gałąź main.
phrases.2: Zweryfikowałem zdalny plik i czyste drzewo robocze po push.
questions.0.points.0: Najpierw sprawdź refs i wykres zatwierdzeń.
questions.0.points.1: Wybierz merge lub cherry-pick zgodnie z zamierzoną historią.
questions.0.points.2: Sprawdź zdalną instalację ref, a nie tylko plik lokalny.
questions.0.prompt: Jak odzyskać zmianę dokonaną w niewłaściwej gałęzi dostawy?
questions.1.points.0: Identyfikuje sprawdzany stan pożądany.
questions.1.points.1: Administrator nadal potrzebuje poświadczeń i uzgodnienia.
questions.1.points.2: Sam udany push nie oznacza zdrowego wdrożenia.
questions.1.prompt: Co sprawia, że ​​gałąź Git jest użytecznym wejściem GitOps?
diagnostics.fetch: git fetch origin main release-candidate musi się powieść.
diagnostics.branch: Bieżąca gałąź repozytorium musi być main.
diagnostics.origin_file: origin/main:notice.txt musi być równe north-41.
diagnostics.head_file: HEAD:notice.txt musi być równe north-41.
diagnostics.ancestor: baseline-commit musi być niepusty i być przodkiem origin/main.
diagnostics.clean: Wyjście git status --porcelain musi być puste.
diagnostics.head: HEAD musi istnieć i być równy origin/main.
