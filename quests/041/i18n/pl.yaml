title: Oddziały Gitea
brief: 'Powiadomienie o wydaniu zostało zatwierdzone i przekazane do release-candidate, podczas gdy prywatna
  gałąź Gitea main nadal obsługuje retired. Przenieś tę zmianę do main i opublikuj ją w tym repozytorium
  gier, zachowując początkowe zatwierdzenie i czyste drzewo robocze. W tej wnęce nie ma zależności Kubernetes.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `platform.env`, `repository/notice.txt`,
  `baseline-commit`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: Lokalne main i origin/main zawierają north-41; linia bazowa pozostaje przodkiem,
  a drzewo robocze jest czyste.'
debrief: Zamierzona zmiana dotarła do gałęzi wdrożenia bez ponownego zapisywania jej istniejącej historii.
stages.0.brief: 'Kryteria sukcesu: Lokalne main i origin/main zawierają north-41; linia bazowa pozostaje
  przodkiem, a drzewo robocze jest czyste.'
stages.0.objectives.0.text: Lokalne main i origin/main zawierają north-41; linia bazowa pozostaje przodkiem,
  a drzewo robocze jest czyste.
hints.0.text: Przed zmianą historii porównaj wskazówki dotyczące oddziałów i plik powiadomień.
hints.1.text: Zatwierdzenie należy do wykresu, a nie na stałe do jednej gałęzi.
hints.2.text: Wybierz candidate na main, a następnie wciśnij tylko main.
phrases.0: Porównałem wdrożenie lokalne i zdalne refs przed przesłaniem zatwierdzenia wydania.
phrases.1: Zachowałem początkową historię i opublikowałem zamierzoną gałąź main.
phrases.2: Zweryfikowałem zdalny plik i czyste drzewo robocze po push.
questions.0.points.0: Najpierw sprawdź refs i wykres zatwierdzeń.
questions.0.points.1: Wybierz merge lub cherry-pick zgodnie z zamierzoną historią.
questions.0.points.2: Sprawdź zdalną instalację ref, a nie tylko plik lokalny.
questions.0.prompt: Jak odzyskać zmianę dokonaną w niewłaściwej gałęzi dostawy?
questions.1.points.0: Identyfikuje sprawdzany stan pożądany.
questions.1.points.1: Administrator nadal potrzebuje poświadczeń i uzgodnienia.
questions.1.points.2: Sam udany push nie oznacza zdrowego wdrożenia.
questions.1.prompt: Co sprawia, że ​​gałąź Git jest użytecznym wejściem GitOps?
