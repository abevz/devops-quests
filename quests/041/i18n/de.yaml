title: Gitea-Filialen
brief: 'In `~/quest/repository` liegt der Release-Hinweis auf dem privaten Branch `release-candidate`, während `main` noch
  den alten Hinweis enthält. Ein Branch zeigt auf einen Commit; ein Vorfahr ist ein früherer Commit in dessen Historie. Lies
  `baseline-commit` in `~/quest`, vergleiche die Branch-Historien und übertrage die Änderung per Merge oder Cherry-pick. Pushe
  `main` zum bereitgestellten privaten Remote. Arbeite nur in der Offline-Umgebung.


  Hole zur Prüfung `origin/main` und `origin/release-candidate`, checke das lokale `main` aus und halte den Arbeitsbaum sauber.
  Sowohl `HEAD:notice.txt` als auch `origin/main:notice.txt` müssen `north-41` enthalten. Der Commit in `baseline-commit`
  muss ein Vorfahr von `origin/main` sein, und `HEAD` muss derselbe Commit wie `origin/main` sein, nicht nur denselben Dateiinhalt
  haben. Die letzte Bedingung zeigt, dass das ausgecheckte Ergebnis veröffentlicht wurde. Die Prüfung beobachtet Inhalt und
  Abstammung, nicht die genaue Übertragungsmethode.'
debrief: Ausgechecktes main, Remote-Commit, Hinweis und baseline-Abstammung entsprachen den Prüfungen.
stages.0.brief: Ausgechecktes main, sauberer Arbeitsbaum, übereinstimmende lokale und entfernte Commits, Hinweisinhalt und
  baseline-Abstammung entsprechen der Aufgabe.
stages.0.objectives.0.text: Ausgechecktes main, sauberer Arbeitsbaum, übereinstimmende lokale und entfernte Commits, Hinweisinhalt
  und baseline-Abstammung entsprechen der Aufgabe.
hints.0.text: Vergleichen Sie die Filialtipps und die Mitteilungsdatei, bevor Sie den Verlauf ändern.
hints.1.text: Ein Commit gehört zum Diagramm und nicht dauerhaft zu einem Zweig.
hints.2.text: Cherry-pick und candidate auf main, dann nur main schieben.
phrases.0: Ich habe die lokale und die Remote-Bereitstellung refs verglichen, bevor ich das Release-Commit übertragen habe.
phrases.1: Ich habe den ursprünglichen Verlauf beibehalten und den beabsichtigten main-Zweig veröffentlicht.
phrases.2: Ich habe die Remote-Datei und einen sauberen Arbeitsbaum nach dem push überprüft.
questions.0.points.0: Überprüfen Sie zunächst refs und das Commit-Diagramm.
questions.0.points.1: Wählen Sie entsprechend der beabsichtigten Historie merge oder cherry-pick.
questions.0.points.2: Überprüfen Sie die Remote-Bereitstellung ref, nicht nur die lokale Datei.
questions.0.prompt: Wie kann eine Änderung, die in der falschen Lieferfiliale vorgenommen wurde, wiederhergestellt werden?
questions.1.points.0: Es identifiziert den überprüften gewünschten Zustand.
questions.1.points.1: Ein Controller benötigt weiterhin Anmeldeinformationen und einen Abgleich.
questions.1.points.2: Ein erfolgreicher push allein beweist noch keinen gesunden Rollout.
questions.1.prompt: Was macht einen Git-Zweig zu einer nützlichen GitOps-Eingabe?
diagnostics.fetch: git fetch origin main release-candidate muss erfolgreich sein.
diagnostics.branch: Der aktuelle Repository-Branch muss main sein.
diagnostics.origin_file: origin/main:notice.txt muss north-41 entsprechen.
diagnostics.head_file: HEAD:notice.txt muss north-41 entsprechen.
diagnostics.ancestor: baseline-commit darf nicht leer sein und muss ein Vorfahr von origin/main sein.
diagnostics.clean: Die Ausgabe von git status --porcelain muss leer sein.
diagnostics.head: HEAD muss existieren und origin/main entsprechen.
