diagnostics.platform_inputs: Die Git-Prüfung endete vor dem Lesen des Repositorys; platform.env fehlt möglicherweise, ist unlesbar oder schlägt beim Laden fehl. [Ursache und Prüfung](guides#guide=gitops-delivery&section=git-environment)
diagnostics.fetch: main und release-candidate konnten nicht abgerufen werden; origin hat möglicherweise eine falsche URL, keinen Zugriff oder eine fehlende Branch. [Ursache und Prüfung](guides#guide=gitops-delivery&section=git-fetch)
diagnostics.branch: Der aktuelle Branch ist nicht main oder nicht lesbar; möglicherweise ist noch release-candidate oder ein losgelöster HEAD ausgecheckt. [Ursache und Prüfung](guides#guide=gitops-delivery&section=git-worktree)
diagnostics.clean: Das Arbeitsverzeichnis enthält Änderungen oder unversionierte Dateien; möglicherweise fehlen Commits oder temporäre Dateien sind übrig. [Ursache und Prüfung](guides#guide=gitops-delivery&section=git-worktree)
diagnostics.origin_file: origin/main:notice.txt ist unlesbar oder weicht von north-41 ab; main wurde möglicherweise nicht gepusht oder die lokale Remote-Referenz ist veraltet. [Ursache und Prüfung](guides#guide=gitops-delivery&section=git-committed-notice)
diagnostics.head_file: HEAD:notice.txt ist unlesbar oder weicht von north-41 ab; möglicherweise fehlt der Kandidaten-Commit auf lokalem main trotz bearbeiteter Arbeitsdatei. [Ursache und Prüfung](guides#guide=gitops-delivery&section=git-committed-notice)
diagnostics.probe_0_2: Die eingecheckten Meldungen konnten nicht geprüft werden; platform.env, Repository, Git oder Python sind möglicherweise vor den Referenzprüfungen nicht verfügbar. [Ursache und Prüfung](guides#guide=gitops-delivery&section=git-environment)
diagnostics.ancestor: Die Basis fehlt, ist ungültig oder kein Vorfahr von origin/main; die veröffentlichte Historie wurde möglicherweise ersetzt statt erweitert. [Ursache und Prüfung](guides#guide=gitops-delivery&section=git-publication-history)
diagnostics.head: HEAD ist ungültig oder weicht von origin/main ab; ein lokaler Commit wurde möglicherweise nicht gepusht oder die Remote-Referenz nicht aktualisiert. [Ursache und Prüfung](guides#guide=gitops-delivery&section=git-publication-history)
