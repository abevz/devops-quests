title: Gitea-Filialen
brief: 'Die Veröffentlichungsmitteilung wurde festgeschrieben und an release-candidate weitergeleitet,
  während der private Zweig Gitea main weiterhin retired bedient. Übertragen Sie diese Änderung an main
  und veröffentlichen Sie sie in diesem Spiel-Repository, wobei das ursprüngliche Commit und ein sauberer
  Arbeitsbaum erhalten bleiben. In diesem Schacht gibt es keine Kubernetes-Abhängigkeit.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `platform.env`, `repository/notice.txt`,
  `baseline-commit`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: Lokal main und origin/main enthalten north-41; Die Grundlinie bleibt ein Vorfahre
  und der Arbeitsbaum ist sauber.'
debrief: Die beabsichtigte Änderung erreichte den Bereitstellungszweig, ohne den vorhandenen Verlauf neu
  zu schreiben.
stages.0.brief: 'Erfolgskriterien: Lokal main und origin/main enthalten north-41; Die Grundlinie bleibt
  ein Vorfahre und der Arbeitsbaum ist sauber.'
stages.0.objectives.0.text: Lokale main und origin/main enthalten north-41; Die Grundlinie bleibt ein
  Vorfahre und der Arbeitsbaum ist sauber.
hints.0.text: Vergleichen Sie die Filialtipps und die Mitteilungsdatei, bevor Sie den Verlauf ändern.
hints.1.text: Ein Commit gehört zum Diagramm und nicht dauerhaft zu einem Zweig.
hints.2.text: Cherry-pick und candidate auf main, dann nur main schieben.
phrases.0: Ich habe die lokale und die Remote-Bereitstellung refs verglichen, bevor ich das Release-Commit
  übertragen habe.
phrases.1: Ich habe den ursprünglichen Verlauf beibehalten und den beabsichtigten main-Zweig veröffentlicht.
phrases.2: Ich habe die Remote-Datei und einen sauberen Arbeitsbaum nach dem push überprüft.
questions.0.points.0: Überprüfen Sie zunächst refs und das Commit-Diagramm.
questions.0.points.1: Wählen Sie entsprechend der beabsichtigten Historie merge oder cherry-pick.
questions.0.points.2: Überprüfen Sie die Remote-Bereitstellung ref, nicht nur die lokale Datei.
questions.0.prompt: Wie kann eine Änderung, die in der falschen Lieferfiliale vorgenommen wurde, wiederhergestellt
  werden?
questions.1.points.0: Es identifiziert den überprüften gewünschten Zustand.
questions.1.points.1: Ein Controller benötigt weiterhin Anmeldeinformationen und einen Abgleich.
questions.1.points.2: Ein erfolgreicher push allein beweist noch keinen gesunden Rollout.
questions.1.prompt: Was macht einen Git-Zweig zu einer nützlichen GitOps-Eingabe?
