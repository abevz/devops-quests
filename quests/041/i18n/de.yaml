title: Gitea-Filialen
brief: 'Die Versionsnachricht ist im veröffentlichten Ergebnis nicht verfügbar.


  Arbeiten Sie auf der Workstation in `~/quest` mit `repository/notice.txt`, `platform.env`.


  **Anforderungen:**

  - Beide Branches `main` und `release-candidate` sind vom Remote `origin` des Workstation-Repositorys abrufbar.

  - Das Workstation-Repository `~/quest/repository` ist auf Branch `main` mit sauberem Arbeitsbaum.

  - Im Workstation-Repository `~/quest/repository` enthalten sowohl `HEAD:notice.txt` als auch `origin/main:notice.txt`
  den Wert `north-41`.

  - Die ursprünglich veröffentlichte Historie bleibt ein Vorfahr von `origin/main`.

  - `HEAD` und `origin/main` im Workstation-Repository bezeichnen denselben existierenden Commit.


  Die Prüfung beobachtet Inhalt, Abstammung und Veröffentlichungsidentität, nicht die Übertragungsmethode.

  '
debrief: Ausgechecktes main, Remote-Commit, Hinweis und baseline-Abstammung entsprachen den Prüfungen.
stages.0.brief: Die veröffentlichte Nachricht muss die erforderliche Git-Historie erhalten.
hints.0.text: Ein veröffentlichtes Git-Ergebnis umfasst Dateiinhalte und ihre Historie.
hints.1.text: 'Vergleichen Sie die Filialtipps und die Mitteilungsdatei, bevor Sie den Verlauf ändern.


  Die vorgesehene Nachricht liegt auf release-candidate, während main noch die veraltete Nachricht enthält.
  Ein Commit gehört zum Graphen, nicht dauerhaft zu einem Branch.


  Prüfen Sie die mitgelieferten Eingaben und den beobachteten Zustand:


  ```sh

  git -C repository log --all --oneline --decorate

  git -C repository show origin/release-candidate:notice.txt

  ```'
hints.2.text: 'Übernimm den Candidate per Merge oder Cherry-Pick in main, rufe die privaten Remote-Refs ab
  und pushe main. Lasse main ausgecheckt und den Arbeitsbaum sauber.


  Prüfen Sie das beobachtete Ergebnis:


  - `git -C repository ls-remote --heads origin main release-candidate` — Beide Remote-Branches werden aufgeführt.

  - `git -C repository status --short --branch; git -C repository show HEAD:notice.txt; git -C repository show
  origin/main:notice.txt; git -C repository rev-parse HEAD origin/main` — Branch `main`, keine geänderten Pfade,
  `north-41` in beiden Nachrichten und zwei gleiche Commit-IDs.

  - `git -C repository merge-base --is-ancestor "$(cat baseline-commit)" origin/main; printf "ancestry status:
  %s\n" "$?"` — Gibt `ancestry status: 0` aus.'
phrases.0: Ich habe die lokale und die Remote-Bereitstellung refs verglichen, bevor ich das Release-Commit
  übertragen habe.
phrases.1: Ich habe den ursprünglichen Verlauf beibehalten und den beabsichtigten main-Zweig veröffentlicht.
phrases.2: Ich habe die Remote-Datei und einen sauberen Arbeitsbaum nach dem push überprüft.
questions.0.points.0: Überprüfen Sie zunächst refs und das Commit-Diagramm.
questions.0.points.1: Wählen Sie entsprechend der beabsichtigten Historie merge oder cherry-pick.
questions.0.points.2: Überprüfen Sie die Remote-Bereitstellung ref, nicht nur die lokale Datei.
questions.0.prompt: Wie kann eine Änderung, die in der falschen Lieferfiliale vorgenommen wurde, wiederhergestellt
  werden?
questions.1.points.0: Es identifiziert den überprüften gewünschten Zustand.
questions.1.points.1: Ein Controller benötigt weiterhin Anmeldeinformationen und einen Abgleich.
questions.1.points.2: Ein erfolgreicher push allein beweist noch keinen gesunden Rollout.
questions.1.prompt: Was macht einen Git-Zweig zu einer nützlichen GitOps-Eingabe?
diagnostics.fetch: git fetch origin main release-candidate muss erfolgreich sein.
diagnostics.branch: Der aktuelle Repository-Branch muss main sein.
diagnostics.origin_file: origin/main:notice.txt muss north-41 entsprechen.
diagnostics.head_file: HEAD:notice.txt muss north-41 entsprechen.
diagnostics.ancestor: baseline-commit darf nicht leer sein und muss ein Vorfahr von origin/main sein.
diagnostics.clean: Die Ausgabe von git status --porcelain muss leer sein.
diagnostics.head: HEAD muss existieren und origin/main entsprechen.
