  - DQ_NAMESPACE
  - DQ_APP_IMAGE
  - KUBECONFIG
  - TF_CLI_CONFIG_FILE
  files:
  - platform.env
  - repository/notice.txt
  - baseline-commit
  services: []
book:
  chapter: 11
  section: Versioned desired state
  topics:
  - gitops
  - git-branches
