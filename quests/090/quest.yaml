id: 90
title: title
track: Boss
difficulty: expert
brief: brief
stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    check: 'tofu state list | grep -Fx local_file.release >/dev/null

      test "$(cat release.txt)" = release-90

      tofu plan -input=false -detailed-exitcode -no-color >/dev/null'
- brief: stages.1.brief
  objectives:
  - text: stages.1.objectives.0.text
    check: 'ssh -n -o BatchMode=yes -p 2222 root@app1-"${DQ_NAMESPACE#dq-}" ''test "$(cat /srv/site/message)"
      = release-90 && test "$(stat -c %a /srv/site/message)" = 644''

      ssh -n -o BatchMode=yes -p 2222 root@app2-"${DQ_NAMESPACE#dq-}" ''test "$(cat /srv/site/message)" =
      release-90 && test "$(stat -c %a /srv/site/message)" = 644''

      ssh -n -o BatchMode=yes -p 2222 root@app3-"${DQ_NAMESPACE#dq-}" ''test "$(cat /srv/site/message)" =
      release-90 && test "$(stat -c %a /srv/site/message)" = 644''

      test "$(curl -fsS --max-time 3 http://app1-${DQ_NAMESPACE#dq-}:8080)" = release-90

      test "$(curl -fsS --max-time 3 http://app2-${DQ_NAMESPACE#dq-}:8080)" = release-90

      test "$(curl -fsS --max-time 3 http://app3-${DQ_NAMESPACE#dq-}:8080)" = release-90'
- brief: stages.2.brief
  objectives:
  - text: stages.2.objectives.0.text
    check: 'kubectl rollout status deployment/relay --timeout=3s >/dev/null

      test "$(kubectl exec deployment/relay -- printenv RELEASE)" = release-90'
hints:
- text: hints.0.text
  guide: terraform-3
- text: hints.1.text
  guide: terraform-3
- text: hints.2.text
  guide: terraform-3
debrief: debrief
phrases:
- phrases.0
- phrases.1
- phrases.2
questions: []
facts:
  environment:
  - DQ_NAMESPACE
  - DQ_APP_IMAGE
  - KUBECONFIG
  - TF_CLI_CONFIG_FILE
  - DOCKER_HOST
  - DOCKER_TLS_VERIFY
  - DOCKER_CERT_PATH
  files:
  - inventory.ini
  - ansible.cfg
  - main.tf
  - rollout.yml
  - deployment.json
  services: []
