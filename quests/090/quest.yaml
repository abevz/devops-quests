id: 90
title: title
track: Boss
difficulty: expert
brief: brief
stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    check: |-
      dq_probe_output=$(mktemp)
      trap 'rm -f "$dq_probe_output"' EXIT
      set +e
      (
      set -euo pipefail
      set -euo pipefail
      cd ~/quest
      python3 -I - <<'DQ_BOSS'
      import json, os, re, subprocess, sys
      from pathlib import Path
      from decimal import Decimal

      def require(good, marker):
          if not good:raise AssertionError(marker)

      try:
          document=json.loads(subprocess.check_output(['tofu','show','-json'],stderr=subprocess.DEVNULL,timeout=5))
          pending=[document['values']['root_module']];found=False
          while pending:
              module=pending.pop();pending.extend(module.get('child_modules',[]))
              for resource in module.get('resources',[]):
                  value=resource.get('values',{});filename=value.get('filename')
                  if resource.get('mode')=='managed' and resource.get('type')=='local_file' and isinstance(filename,str):
                      try:found=found or Path(filename).samefile('release.txt')
                      except OSError:pass
          require(found,'state')

      except Exception as error:
          marker = str(error) if isinstance(error,AssertionError) and re.fullmatch(r'[a-z0-9_]+',str(error)) else 'state'
          print('Required result is missing: ✗ [DQ:'+marker+']')
          sys.exit(1)
      DQ_BOSS
      ) >"$dq_probe_output" 2>/dev/null
      dq_probe_status=$?
      set -e
      cat "$dq_probe_output"
      if [ "$dq_probe_status" -ne 0 ] && ! grep -Eq '\[DQ:[a-z0-9_]+\]' "$dq_probe_output"; then
      printf '%s\n' 'Current inputs could not verify this objective: ✗ [DQ:probe_0_0]'
      fi
      rm -f "$dq_probe_output"
      trap - EXIT
      test "$dq_probe_status" -eq 0
      facts=/run/dq/facts/0/recovery-contract.json
      archive_hash=$(sha256sum recovery/checkpoint.tfstate 2>/dev/null | cut -d ' ' -f 1 || true)
      if ! test -n "$archive_hash" || ! test "$archive_hash" = "$(jq -er .sha256 "$facts" 2>/dev/null || true)"; then
        printf '%s\n' 'Trusted checkpoint contents changed: ✗ [DQ:checkpoint_digest]'
        exit 1
      fi
      state=$(timeout 5s tofu state pull 2>/dev/null || true)
      release_id=$(jq -er .release_id "$facts" 2>/dev/null || true)
      handover_id=$(jq -er .handover_id "$facts" 2>/dev/null || true)
      lineage=$(jq -er .lineage "$facts" 2>/dev/null || true)
      record_matches() {
        jq -e --arg name "$1" --arg id "$2" '
          any(.resources[]?; .mode=="managed" and .type=="terraform_data" and
              (.module // "")=="" and .name==$name and
              (.instances | length)==1 and .instances[0].attributes.id==$id)
        ' <<<"$state" >/dev/null 2>&1
      }
      failed=0
      if ! test -n "$lineage" || ! jq -e --arg lineage "$lineage" '.lineage==$lineage' <<<"$state" >/dev/null 2>&1 ||
         ! test -n "$handover_id" || ! record_matches handover "$handover_id"; then
        printf '%s\n' 'The newer handover binding or active lineage was lost: ✗ [DQ:handover_state]'
        failed=1
      fi
      if ! test -n "$release_id" || ! record_matches release_record "$release_id"; then
        printf '%s\n' 'Release binding differs from the trusted checkpoint: ✗ [DQ:checkpoint_binding]'
        failed=1
      fi
      exit "$failed"
  - text: stages.0.objectives.1.text
    check: |-
      set -euo pipefail
      cd ~/quest
      failed=0
      if ! test "$(cat release.txt 2>/dev/null)" = release-90; then
        printf '%s\n' 'release.txt = release-90: ✗ [DQ:file]'
        failed=1
      fi
      exit "$failed"
  - text: stages.0.objectives.2.text
    check: |-
      set -euo pipefail
      cd ~/quest
      failed=0
      if ! tofu plan -input=false -detailed-exitcode -no-color >/dev/null 2>&1; then
        printf '%s\n' 'tofu plan -input=false -detailed-exitcode -no-color → 0: ✗ [DQ:plan]'
        failed=1
      fi
      exit "$failed"
- brief: stages.1.brief
  objectives:
  - text: stages.1.objectives.0.text
    check: |-
      set -euo pipefail
      cd ~/quest
      failed=0
      for n in 1 2 3; do
        host="app${n}-${DQ_NAMESPACE#dq-}"
        result=$(timeout 4s ssh -n -o BatchMode=yes -o ConnectTimeout=3 -p 2222 "root@$host" 'actual=$(sha256sum /srv/site/message 2>/dev/null | cut -d " " -f 1); if test "$actual" = 2c26e5e7347924bc4a8bab2268a1ee392c9ad6dffd932f8c400703df102f851c || test "$actual" = 5915cb21bb1ee7653775dad5a2dbfc324c46bb047d227b6e8f2e486c0961bf9d; then printf "content-ok\n"; fi; if test "$(stat -c %a /srv/site/message 2>/dev/null)" = 644; then printf "mode-ok\n"; fi' 2>/dev/null || true)
        if ! grep -Fxq content-ok <<<"$result"; then
          printf '%s\n' "$host /srv/site/message = release-90: ✗ [DQ:content_$n]"; failed=1
        fi
        if ! grep -Fxq mode-ok <<<"$result"; then
          printf '%s\n' "$host /srv/site/message mode = 644: ✗ [DQ:mode_$n]"; failed=1
        fi
      done
      expected=$(jq -er .recovery_id /run/dq/facts/1/recovered-release.json 2>/dev/null || true)
      for n in 1 2 3; do
        host="app${n}-${DQ_NAMESPACE#dq-}"
        identity=$(timeout 3s ssh -n -o BatchMode=yes -o ConnectTimeout=2 -p 2222 "root@$host" 'cat /srv/site/recovery-id' 2>/dev/null || true)
        if ! test -n "$expected" || ! test "$identity" = "$expected"; then
          printf '%s\n' "$host recovery identity differs from the recovered release: ✗ [DQ:fleet_identity_$n]"
          failed=1
        fi
      done
      exit "$failed"
  - text: stages.1.objectives.1.text
    check: |-
      set -euo pipefail
      cd ~/quest
      failed=0
      for n in 1 2 3; do
        host="app${n}-${DQ_NAMESPACE#dq-}"
        if ! test "$(curl -fsS --max-time 3 "http://$host:8080" 2>/dev/null)" = release-90; then
          printf '%s\n' "$host:8080 = release-90: ✗ [DQ:http_$n]"; failed=1
        fi
      done
      exit "$failed"
- brief: stages.2.brief
  objectives:
  - text: stages.2.objectives.0.text
    check: |-
      set -euo pipefail
      cd ~/quest
      failed=0
      if ! bash -euo pipefail <<'DQ_LEGACY'
      set -euo pipefail
      cd ~/quest
      failed=0
      if ! kubectl rollout status deployment/relay --timeout=3s >/dev/null 2>&1; then
        printf '%s\n' 'deployment/relay rollout complete: ✗ [DQ:rollout]'; failed=1
      fi
      if ! test "$(timeout 4s kubectl exec --pod-running-timeout=2s deployment/relay -c worker -- printenv RELEASE 2>/dev/null)" = release-90; then
        printf '%s\n' 'deployment/relay RELEASE = release-90: ✗ [DQ:relay]'; failed=1
      fi
      exit "$failed"
      DQ_LEGACY
      then failed=1; fi
      expected=$(cat /run/dq/facts/2/relay-handover-id 2>/dev/null || true)
      uid=$(cat /run/dq/facts/2/relay-publication-uid 2>/dev/null || true)
      publication=$(kubectl --request-timeout=3s get configmap relay-recovery -o json 2>/dev/null || true)
      deployment=$(kubectl --request-timeout=3s get deployment relay -o json 2>/dev/null || true)
      if ! test -n "$expected" || ! test -n "$uid" ||
         ! jq -e --arg id "$expected" --arg uid "$uid" '.metadata.uid==$uid and .data["recovery-id"]==$id' <<<"$publication" >/dev/null 2>&1 ||
         ! jq -e '.spec.template.spec as $pod |
            any($pod.volumes[]?; .configMap.name=="relay-recovery" and
              (.name as $volume | any($pod.containers[]?; .name=="worker" and
                any(.volumeMounts[]?; .name==$volume and .mountPath=="/run/recovery" and .readOnly==true))))' <<<"$deployment" >/dev/null 2>&1; then
        printf '%s\n' 'Relay publication must project the recovered identity from its original ConfigMap: ✗ [DQ:relay_publication]'
        failed=1
      else
        observed=$(timeout 5s kubectl exec --pod-running-timeout=2s deployment/relay -c worker -- sh -ec '
          test "$(cat /proc/1/comm)" = httpd
          test "$(readlink /proc/1/cwd)" = /tmp/www
          test /tmp/www/recovery-id -ef /run/recovery/recovery-id
          projected=$(cat /run/recovery/recovery-id)
          response=$(wget -qO- -T 2 http://127.0.0.1:8080/recovery-id)
          printf "%s\n%s\n" "$projected" "$response"
        ' 2>/dev/null || true)
        if ! test "$observed" = "$(printf '%s\n%s' "$expected" "$expected")"; then
          printf '%s\n' 'Relay worker does not serve its projected recovery identity: ✗ [DQ:relay_identity]'
          failed=1
        fi
      fi
      exit "$failed"
hints:
