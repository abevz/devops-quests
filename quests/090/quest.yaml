  - text: stages.0.objectives.0.text
    check: "set -euo pipefail\ncd ~/quest\nfailed=0\nif ! tofu state list 2>/dev/null | grep -Fx local_file.release >/dev/null; then\n  printf '%s\\n' 'tofu state list ∋ local_file.release: ✗ [DQ:state]'\n  failed=1\nfi\nif ! test \"$(cat release.txt 2>/dev/null)\" = release-90; then\n  printf '%s\\n' 'release.txt = release-90: ✗ [DQ:file]'\n  failed=1\nfi\nif ! tofu plan -input=false -detailed-exitcode -no-color >/dev/null 2>&1; then\n  printf '%s\\n' 'tofu plan -input=false -detailed-exitcode -no-color → 0: ✗ [DQ:plan]'\n  failed=1\nfi\nexit \"$failed\"\n"
- brief: stages.1.brief
  objectives:
  - text: stages.1.objectives.0.text
    check: "set -euo pipefail\ncd ~/quest\nfailed=0\nfor n in 1 2 3; do\n  host=\"app${n}-${DQ_NAMESPACE#dq-}\"\n  result=$(timeout 4s ssh -n -o BatchMode=yes -o ConnectTimeout=3 -p 2222 \"root@$host\" 'actual=$(sha256sum /srv/site/message 2>/dev/null | cut -d \" \" -f 1); if test \"$actual\" = 2c26e5e7347924bc4a8bab2268a1ee392c9ad6dffd932f8c400703df102f851c || test \"$actual\" = 5915cb21bb1ee7653775dad5a2dbfc324c46bb047d227b6e8f2e486c0961bf9d; then printf \"content-ok\\n\"; fi; if test \"$(stat -c %a /srv/site/message 2>/dev/null)\" = 644; then printf \"mode-ok\\n\"; fi' 2>/dev/null || true)\n  if ! grep -Fxq content-ok <<<\"$result\"; then\n    printf '%s\\n' \"$host /srv/site/message = release-90: ✗ [DQ:content_$n]\"; failed=1\n  fi\n  if ! grep -Fxq mode-ok <<<\"$result\"; then\n    printf '%s\\n' \"$host /srv/site/message mode = 644: ✗ [DQ:mode_$n]\"; failed=1\n  fi\n  if ! test \"$(curl -fsS --max-time 3 \"http://$host:8080\" 2>/dev/null)\" = release-90; then\n    printf '%s\\n' \"$host:8080 = release-90: ✗ [DQ:http_$n]\"; failed=1\n  fi\ndone\nexit \"$failed\"\n"
- brief: stages.2.brief
  objectives:
  - text: stages.2.objectives.0.text
    check: "set -euo pipefail\ncd ~/quest\nfailed=0\nif ! kubectl rollout status deployment/relay --timeout=3s >/dev/null 2>&1; then\n  printf '%s\\n' 'deployment/relay rollout complete: ✗ [DQ:rollout]'; failed=1\nfi\nif ! test \"$(timeout 4s kubectl exec --pod-running-timeout=2s deployment/relay -- printenv RELEASE 2>/dev/null)\" = release-90; then\n  printf '%s\\n' 'deployment/relay RELEASE = release-90: ✗ [DQ:relay]'; failed=1\nfi\nexit \"$failed\"\n"
