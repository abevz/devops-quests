title: Recuperación ante desastres
brief: "El marcador gestionado, los banners de la flota y el servicio aún no presentan una versión coherente.\n\n\
  Trabaja en `~/quest` en la estación de trabajo. Entradas por etapa:\n- Etapa 1: `main.tf`.\n- Etapa 2: `inventory.ini`,\
  \ `ansible.cfg`, `rollout.yml`.\n- Etapa 3: `deployment.yaml`.\n\n**Requisitos:**\n\n- Etapa 1:\n  - OpenTofu\
  \ registra el artefacto de versión gestionado en el state.\n  - En la workstation, `~/quest/release.txt` contiene\
  \ `release-90`.\n  - OpenTofu no planea cambios y termina con código `0`.\n- Etapa 2:\n  - En cada host gestionado\
  \ (`app1`, `app2`, `app3`), `/srv/site/message` contiene `release-90` con modo `0644`.\n  - HTTP en el puerto\
  \ `8080` devuelve `release-90` desde cada host gestionado (`app1`, `app2`, `app3`).\n- Etapa 3:\n  - El Deployment\
  \ `relay` completa su rollout y su proceso en ejecución está configurado para `release-90`.\n\nLa comprobación\
  \ observa el marcador, los archivos y resultados HTTP de la flota y el estado del consumidor; no demuestra los\
  \ comandos de recuperación usados."
stages.0.brief: El marcador gestionado debe ser estable.
stages.1.brief: La flota debe servir de forma coherente la versión recuperada.
stages.2.brief: El consumidor en ejecución debe coincidir con la versión recuperada.
hints.0.text: Recupere una capa a la vez y verifique cada resultado en vivo.
hints.1.text: 'El marcador, los banners fleet y el entorno reader deben nombrar la misma versión.


  Inspecciona las definiciones suministradas, descripciones de recursos y eventos de la etapa correspondiente.


  ```sh

  cat main.tf

  cat rollout.yml

  kubectl describe deployment relay

  ```'
hints.2.text: |-
  Aplique el marcador, vuelva a cargar el fleet correctamente configurado, luego repare el Kubernetes reader y espere readiness.

  Verifica la etapa reparada y compara el resultado observado.

  Etapa 1: El state incluye `release.txt`, el archivo de la workstation muestra `release-90` y el plan termina con código `0` sin cambios.

  ```sh
  tofu show -json
  cat release.txt
  printf "\n"
  tofu plan -input=false -detailed-exitcode -no-color
  ```

  Etapa 2: Cada host gestionado muestra `release-90`, modo de archivo `644` y HTTP `release-90` en el puerto `8080`.

  ```sh
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    printf "%s: " "$host"
    ssh -n -o BatchMode=yes -p 2222 "root@$host" 'cat /srv/site/message; stat -c %a /srv/site/message'
    curl -fsS --max-time 3 "http://$host:8080"
    printf "\n"
  done
  ```

  Etapa 3: El rollout está completo y el proceso en ejecución imprime `release-90`.

  ```sh
  kubectl rollout status deployment/relay --timeout=3s
  kubectl exec deployment/relay -c worker -- printenv RELEASE
  ```

debrief: Las comprobaciones verificaron el marcador gestionado, archivos y respuestas de la flota, y el rollout
  y entorno de relay.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el estado de workload y su preparación después del cambio.
diagnostics.state: |-
  El estado de OpenTofu debe registrar el artefacto administrado release.txt.

diagnostics.file: release.txt debe ser igual a release-90.
diagnostics.plan: El plan de OpenTofu debe terminar con código 0.
diagnostics.rollout: El despliegue del Deployment relay debe completarse.
diagnostics.relay: RELEASE del Deployment relay debe ser release-90.
diagnostics.content_1: En app1, /srv/site/message debe contener exactamente release-90, opcionalmente seguido de
  un salto de línea.
diagnostics.mode_1: En app1, el modo de /srv/site/message debe ser 644.
diagnostics.http_1: app1 en el puerto 8080 debe devolver release-90.
diagnostics.content_2: En app2, /srv/site/message debe contener exactamente release-90, opcionalmente seguido de
  un salto de línea.
diagnostics.mode_2: En app2, el modo de /srv/site/message debe ser 644.
diagnostics.http_2: app2 en el puerto 8080 debe devolver release-90.
diagnostics.content_3: En app3, /srv/site/message debe contener exactamente release-90, opcionalmente seguido de
  un salto de línea.
diagnostics.mode_3: En app3, el modo de /srv/site/message debe ser 644.
diagnostics.http_3: app3 en el puerto 8080 debe devolver release-90.
