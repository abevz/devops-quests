title: Recuperación ante desastres
brief: 'Te uniste a las operaciones de SignalRail. Recuperar un marcador administrado, el fleet y un servicio fallido. Trabajar
  en ~/quest. Mantenga todos los cambios dentro de esta bahía de entrenamiento.


  Archivos de búsqueda en `~/quest` (algunos se introducen en etapas posteriores): `inventory.ini`, `ansible.cfg`, `main.tf`,
  `rollout.yml`, `deployment.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente los archivos suministrados, las imágenes precargadas y los
  servicios privados. Todos los cambios deben permanecer dentro de esta bahía.


  Criterios de éxito iniciales: el marcador de liberación gestionada es correcto.'
stages.0.brief: 'Lee `main.tf` en `~/quest`: declara el proveedor local sin conexión y `local_file.release`. Inicializa y
  aplica el marcador. Comprueba que `tofu state list` contiene `local_file.release`, `release.txt` contiene `release-90` y
  `tofu plan -input=false -detailed-exitcode -no-color` termina con código 0 (sin cambios). La guía enlazada introduce el
  estado de OpenTofu. Trabaja solo en la bahía.'
stages.0.objectives.0.text: La dirección de estado y el archivo de la versión coinciden, y el plan termina con código 0.
stages.1.brief: Lee `inventory.ini`, `ansible.cfg` y `rollout.yml` en `~/quest`. Ansible envía tareas por SSH a cada host
  de la flota privada. Entrega `release-90` en `/srv/site/message` con modo `0644` en app1, app2 y app3. Usa el handler proporcionado
  con `dq-service reload` para que el servicio relea el archivo; ejecuta `ansible-playbook rollout.yml`. Comprueba que la
  respuesta HTTP de cada host en el puerto 8080 sea `release-90`. Las comprobaciones observan archivos, modos y respuestas;
  no demuestran qué comandos se usaron.
stages.1.objectives.0.text: Los archivos, modos y respuestas HTTP de los tres hosts coinciden con `release-90`.
stages.2.brief: Repara el lector de Kubernetes con `deployment.json`. Establece `RELEASE` en `release-90` en `deployment/relay`
  y espera su rollout. La comprobación lee el entorno del proceso en ejecución y el estado del rollout; no comprueba lo que
  sirve el lector.
stages.2.objectives.0.text: El rollout de relay termina y su proceso en ejecución tiene `RELEASE=release-90`.
hints.0.text: Recupere una capa a la vez y verifique cada resultado en vivo.
hints.1.text: El marcador, los banners fleet y el entorno reader deben nombrar la misma versión.
hints.2.text: Aplique el marcador, vuelva a cargar el fleet correctamente configurado, luego repare el Kubernetes reader y
  espere readiness.
debrief: Las comprobaciones verificaron el marcador gestionado, archivos y respuestas de la flota, y el rollout y entorno
  de relay.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el estado de workload y su preparación después del cambio.
