title: Recuperación ante desastres
brief: 'Te uniste a las operaciones de SignalRail. Recuperar un marcador administrado, el fleet y un servicio
  fallido. Trabajar en ~/quest. Mantenga todos los cambios dentro de esta bahía de entrenamiento.


  Archivos de búsqueda en `~/quest` (algunos se introducen en etapas posteriores): `inventory.ini`, `ansible.cfg`,
  `main.tf`, `rollout.yml`, `deployment.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente los archivos suministrados, las imágenes
  precargadas y los servicios privados. Todos los cambios deben permanecer dentro de esta bahía.


  Criterios de éxito iniciales: el marcador de liberación gestionada es correcto.'
stages.0.brief: 'Lee `main.tf` en `~/quest`: declara el proveedor local sin conexión y `local_file.release`. Inicializa y aplica el marcador. Comprueba que `tofu state list` contiene `local_file.release`, `release.txt` contiene `release-90` y `tofu plan -input=false -detailed-exitcode -no-color` termina con código 0 (sin cambios). La guía enlazada introduce el estado de OpenTofu. Trabaja solo en la bahía.'
stages.0.objectives.0.text: La dirección de estado y el archivo de la versión coinciden, y el plan termina con código 0.
stages.1.brief: 'Se disparó la alerta station. Entregue release-90 a todo el fleet y recargue su banner
  en vivo.


  Criterios de éxito: los tres banners en vivo fleet muestran release-90.'
stages.1.objectives.0.text: Los tres carteles de flotas en vivo muestran release-90.
stages.2.brief: 'El lanzamiento llegó al station. Apareció un incidente reader: repare su entorno RELEASE.


  Criterios de éxito: el reader en vivo sirve para la versión prevista.'
stages.2.objectives.0.text: El reader en vivo sirve para la versión prevista.
hints.0.text: Recupere una capa a la vez y verifique cada resultado en vivo.
hints.1.text: El marcador, los banners fleet y el entorno reader deben nombrar la misma versión.
hints.2.text: Aplique el marcador, vuelva a cargar el fleet correctamente configurado, luego repare el
  Kubernetes reader y espere readiness.
debrief: Estado, fleet y reader necesitaban recuperación. Restauraste el marcador administrado, recargaste
  el fleet y verificaste el reader final en vivo.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el estado de workload y su preparación después del cambio.
