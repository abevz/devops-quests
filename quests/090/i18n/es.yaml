diagnostics.probe_0_0: |-
  La comprobación del estado no devolvió un diagnóstico. Inspecciona el estado por separado desde el directorio de trabajo. [Documentación](https://opentofu.org/docs/cli/commands/show/#json-output)
diagnostics.checkpoint_binding: |-
  Compara el vínculo activo con la copia verificada. Recrear un registro puede cambiar su identidad. [Documentación](https://opentofu.org/docs/cli/commands/state/mv/#usage)
diagnostics.handover_state: |-
  Sustituir el estado activo por una copia anterior puede perder vínculos más recientes. Compara ambos estados y su linaje. [Documentación](https://opentofu.org/docs/cli/commands/state/mv/#usage)
diagnostics.checkpoint_digest: |-
  La copia puede haberse editado o sustituido. Verifica la copia original con su suma de comprobación. [Documentación](https://opentofu.org/docs/cli/commands/state/mv/#usage)
diagnostics.fleet_identity_1: |-
  La copia puede haber omitido el registro recuperado o su modo. Compara el resultado de cada host con el artefacto de traspaso. [Documentación](https://docs.ansible.com/projects/ansible/latest/collections/ansible/builtin/copy_module.html)
diagnostics.fleet_identity_2: |-
  La copia puede haber omitido el registro recuperado o su modo. Compara el resultado de cada host con el artefacto de traspaso. [Documentación](https://docs.ansible.com/projects/ansible/latest/collections/ansible/builtin/copy_module.html)
diagnostics.fleet_identity_3: |-
  La copia puede haber omitido el registro recuperado o su modo. Compara el resultado de cada host con el artefacto de traspaso. [Documentación](https://docs.ansible.com/projects/ansible/latest/collections/ansible/builtin/copy_module.html)
diagnostics.relay_publication: |-
  La publicación de relay puede usar un registro anterior u otro origen. Compara el ConfigMap original, su proyección y la respuesta HTTP del worker. [Documentación](https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/#add-configmap-data-to-a-volume)
diagnostics.relay_identity: |-
  Comprueba que el worker HTTP suministrado sirve el archivo proyectado directamente desde su directorio raíz original. [Documentación](https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/#add-configmap-data-to-a-volume)
