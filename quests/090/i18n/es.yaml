title: Recuperación ante desastres
brief: |-
  El registro de versión se perdió del estado activo. Recupera la versión verificada, conserva los datos de traspaso más recientes y restaura la flota y relay.

  Trabaja en la estación de trabajo en `~/quest`. La etapa 1 usa `main.tf`, `incident.auto.tfvars.json` y `recovery/`. La etapa 2 usa `rollout.yml`, `inventory.ini`, `ansible.cfg` y `recovered-release.json`. La etapa 3 usa `deployment.yaml`, `relay-publication.yaml` y `relay-handover-id`.

  **Requirements:**

  - OpenTofu registra el artefacto administrado y restaura el registro de versión con la identidad del punto verificado. Conserva los bytes de la copia, el linaje del estado activo y el registro de traspaso más reciente.
  - En la workstation, `~/quest/release.txt` contiene `release-90`.
  - OpenTofu no planea cambios y termina con código `0`.
  - En `app1`, `app2` y `app3`, `/srv/site/message` contiene `release-90` con modo `0644`. `/srv/site/recovery-id` coincide con el ID de `recovered-release.json`.
  - HTTP en el puerto `8080` devuelve `release-90` desde cada host gestionado (`app1`, `app2`, `app3`).
  - El Deployment `relay` termina su despliegue y worker usa `release-90` en `RELEASE`. Conserva el ConfigMap suministrado y su proyección de solo lectura en `/run/recovery`. Conserva el worker HTTP suministrado y su directorio raíz. Sirve el propio archivo proyectado con el ID de `relay-handover-id` en `http://127.0.0.1:8080/recovery-id`.

  La comprobación solo confirma el estado resultante y las observaciones en vivo a partir de los identificadores registrados. Tú eliges los comandos de recuperación.
stages.0.brief: El marcador gestionado debe ser estable.
stages.1.brief: La flota debe servir de forma coherente la versión recuperada.
stages.2.brief: El consumidor en ejecución debe coincidir con la versión recuperada.
hints.0.text: |-
  Compara la copia con el estado activo antes de restaurar los vínculos que faltan. La identidad recuperada debe llegar a cada capa posterior.
hints.1.text: |-
  Inspecciona el linaje y las identidades de recursos en ambos archivos de estado. Sigue la identidad registrada a través del artefacto de la flota y la publicación de Kubernetes.

  ```sh
  (cd recovery && sha256sum -c checkpoint.sha256)
  jq '{lineage,serial,resources:[.resources[] | {type,name,ids:[.instances[].attributes.id]}]}' terraform.tfstate recovery/checkpoint.tfstate
  ```

  ```sh
  cat recovered-release.json rollout.yml
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    curl -fsS --max-time 3 "http://$host:8080/"
  done
  ```

  ```sh
  cat relay-publication.yaml relay-handover-id
  kubectl get deployment relay -o yaml
  kubectl get configmap -o yaml
  ```
hints.2.text: |-
  Usa una copia del punto verificado. Restaura los vínculos ausentes y conserva el registro de traspaso más reciente. Comprueba archivos, respuestas HTTP y la proyección del ConfigMap original desde el worker.

  ```sh
  (cd recovery && sha256sum -c checkpoint.sha256)
  tofu state list
  tofu output -raw recovery_id
  printf '\n'
  cat release.txt
  tofu plan -input=false -detailed-exitcode -no-color
  ```

  ```sh
  jq -r .recovery_id recovered-release.json
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    ssh -n -o BatchMode=yes -p 2222 "root@$host" 'cat /srv/site/message; stat -c %a /srv/site/message; cat /srv/site/recovery-id'
    curl -fsS --max-time 3 "http://$host:8080/"
    printf '\n'
  done
  ```

  ```sh
  kubectl get configmap relay-recovery -o yaml
  kubectl rollout status deployment/relay --timeout=3s
  kubectl exec deployment/relay -c worker -- printenv RELEASE
  kubectl exec deployment/relay -c worker -- wget -qO- -T 3 http://127.0.0.1:8080/recovery-id
  cat relay-handover-id
  ```
debrief: |-
  La restauración selectiva conserva el vínculo más reciente y recupera la identidad de la versión. Los archivos y las respuestas HTTP muestran partes distintas de la distribución. La proyección lleva la identidad recuperada a relay.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el estado de workload y su preparación después del cambio.
diagnostics.state: |-
  El estado de OpenTofu debe registrar el artefacto administrado release.txt. Compara el vínculo activo con la copia verificada. Recrear un registro puede cambiar su identidad. [Documentación](https://opentofu.org/docs/cli/commands/show/#json-output)
diagnostics.file: |-
  release.txt debe ser igual a release-90. El estado o el artefacto pueden diferir de la entrada prevista. Compara el archivo administrado y el plan actual. [Documentación](https://opentofu.org/docs/cli/commands/plan/)
diagnostics.plan: |-
  El plan de OpenTofu debe terminar con código 0. El estado o el artefacto pueden diferir de la entrada prevista. Compara el archivo administrado y el plan actual. [Documentación](https://opentofu.org/docs/cli/commands/plan/)
diagnostics.rollout: |-
  El despliegue del Deployment relay debe completarse. Compara la plantilla del Pod con el worker activo de relay. El valor actualizado se aplica al iniciar los Pods nuevos. [Documentación](https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#updating-a-deployment)
diagnostics.relay: |-
  RELEASE del Deployment relay debe ser release-90. Compara la plantilla del Pod con el worker activo de relay. El valor actualizado se aplica al iniciar los Pods nuevos. [Documentación](https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#updating-a-deployment)
diagnostics.content_1: |-
  En app1, /srv/site/message debe contener exactamente release-90, opcionalmente seguido de un salto de línea. La copia puede haber omitido el registro recuperado o su modo. Compara el resultado de cada host con el artefacto de traspaso. [Documentación](https://docs.ansible.com/projects/ansible/latest/collections/ansible/builtin/copy_module.html)
diagnostics.mode_1: |-
  En app1, el modo de /srv/site/message debe ser 644. La copia puede haber omitido el registro recuperado o su modo. Compara el resultado de cada host con el artefacto de traspaso. [Documentación](https://docs.ansible.com/projects/ansible/latest/collections/ansible/builtin/copy_module.html)
diagnostics.http_1: |-
  app1 en el puerto 8080 debe devolver release-90. El proceso puede seguir usando contenido anterior. Compara el mensaje guardado con la respuesta HTTP. [Documentación](https://docs.ansible.com/projects/ansible/latest/playbook_guide/playbooks_handlers.html#notifying-handlers)
