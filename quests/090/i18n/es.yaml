diagnostics.state: Setup elimina vínculo gestionado y release.txt; recuperar solo vínculo puede dejar archivo ausente para comparación del archivo físico. Recupere vínculos registrados y aplique configuración; errores de estado, análisis y destino también dan marcador. [Causa y comprobación](guides#guide=terraform-4&section=verified-recovery-managed-release-file)
diagnostics.probe_0_0: Observador inicial puede no arrancar antes de resultado nombrado; compruebe inicio Python y workspace actual. Errores ordinarios state-show, análisis y vínculo de archivo ausente dentro del observer ya usan state. [Causa y comprobación](guides#guide=terraform-4&section=verified-recovery-state-observer-startup)
diagnostics.checkpoint_digest: Checkpoint puede editarse o usarse directamente en traslado de estado; conserve recovery/checkpoint.tfstate y trabaje sobre copia. Hash autorizado está congelado en recovery contract; reescribir checksum de trabajo no autoriza bytes cambiados. [Causa y comprobación](guides#guide=terraform-4&section=verified-recovery-protected-checkpoint-bytes)
diagnostics.handover_state: Reemplazar estado activo con checkpoint antiguo entero puede perder identidad handover más reciente o cambiar lineage; combine solo vínculos release ausentes conservando registro root handover actual y lineage original. [Causa y comprobación](guides#guide=terraform-4&section=verified-recovery-newer-handover-and-lineage)
diagnostics.checkpoint_binding: Un apply nuevo puede crear otro ID release_record tras eliminar vínculo; recupere registro root original del checkpoint verificado. Handover más reciente pertenece a estado actual y debe sobrevivir combinación. [Causa y comprobación](guides#guide=terraform-4&section=verified-recovery-original-release-record)
diagnostics.file: Archivo puede seguir borrado o contener valor manual antiguo tras restaurar estado; aplique configuración recuperada para release-90 en release.txt. Vínculos solos no aportan bytes ausentes en disco. [Causa y comprobación](guides#guide=terraform-4&section=verified-recovery-actual-restored-release)
diagnostics.plan: Estado recuperado puede discrepar de configuración o proponer reemplazos, o fallar planificación; inspeccione plan nuevo detallado y exija exit 0. Cambios propuestos y errores incumplen condición. [Causa y comprobación](guides#guide=terraform-4&section=verified-recovery-converged-recovery-plan)
diagnostics.content_1: 'app1: Play suministrado puede seguir copiando retired en vez de publicación recuperada, o SSH no leer mensaje; use recovered-release.json y entregue release-90 sin salto o con exactamente uno. [Causa y comprobación](guides#guide=ansible-10&section=verified-recovery-app1-content)'
diagnostics.mode_1: 'app1: Copiar al recuperar puede dejar permisos imprevistos o fallar stat SSH; declare explícitamente mode 0644 de /srv/site/message. [Causa y comprobación](guides#guide=ansible-10&section=verified-recovery-app1-mode)'
diagnostics.fleet_identity_1: 'app1: Mensaje puede ser correcto mientras /srv/site/recovery-id falta o viene de otra recuperación; copie ID recuperado del JSON suministrado. Se compara valor con publicación congelada, no identidad nueva generada. [Causa y comprobación](guides#guide=ansible-10&section=verified-recovery-app1-identity)'
diagnostics.http_1: 'app1: Servicio legacy puede conservar respuesta antigua en memoria tras copy correcto, o HTTP estar indisponible; notifique reload handler y verifique release-90 en puerto 8080. [Causa y comprobación](guides#guide=ansible-10&section=verified-recovery-app1-http)'
