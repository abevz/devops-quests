diagnostics.rollout: Readiness suministrada rechaza RELEASE retired u otro problema bloquea rollout; actualice entorno efectivo e inspeccione eventos. Rollout completo solo no demuestra publicación de recuperación proyectada. [Causa y comprobación](guides#guide=kubernetes-12&section=verified-recovery-relay-readiness)
diagnostics.relay: Editar deployment YAML local o ConfigMap puede dejar RELEASE retired en proceso; reconcilie entorno real a release-90. Actualizar recovery ID proyectado no cambia esta variable separada. [Causa y comprobación](guides#guide=kubernetes-12&section=verified-recovery-effective-release-value)
diagnostics.relay_publication: ConfigMap original puede conservar retired, recrearse o dejar de vincularse al contenedor nombrado en /run/recovery con readOnly=true. Actualice publication identity existente y mantenga proyección read-only explícita antes de inspeccionar archivo servido. [Causa y comprobación](guides#guide=kubernetes-12&section=verified-recovery-original-readonly-projection)
diagnostics.relay_identity: ID copiado o programa HTTP reemplazado puede devolver texto coincidente sin servir proyección; conserve PID 1 httpd, document root /tmp/www y mismo archivo que /run/recovery/recovery-id. Valor proyectado y respuesta HTTP real deben igualar ID recuperado; fallos de ejecución/lectura también dan marcador. [Causa y comprobación](guides#guide=kubernetes-12&section=verified-recovery-serve-the-projected-file)
