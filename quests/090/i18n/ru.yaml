title: Восстановление после аварии
brief: |-
  Запись релиза потеряна из активного состояния. Восстановите проверенный релиз, сохраните более свежую запись передачи и поднимите fleet и relay.

  Работайте на рабочей станции в `~/quest`. На первом этапе используйте `main.tf`, `incident.auto.tfvars.json` и `recovery/`. На втором используйте `rollout.yml`, `inventory.ini`, `ansible.cfg` и `recovered-release.json`. На третьем используйте `deployment.yaml`, `relay-publication.yaml` и `relay-handover-id`.

  **Requirements:**

  - OpenTofu учитывает управляемый артефакт и восстанавливает запись релиза с идентичностью из проверенной копии. Сохраните содержимое копии, lineage активного состояния и более свежую запись передачи.
  - На workstation файл `~/quest/release.txt` содержит `release-90`.
  - План OpenTofu не содержит изменений и завершается с кодом `0`.
  - На `app1`, `app2` и `app3` файл `/srv/site/message` содержит `release-90` с правами `0644`. Файл `/srv/site/recovery-id` совпадает с идентификатором из `recovered-release.json`.
  - HTTP на порту `8080` возвращает `release-90` с каждого управляемого хоста (`app1`, `app2`, `app3`).
  - Deployment `relay` завершает rollout, а worker получает `release-90` в `RELEASE`. Сохраните выданную ConfigMap и проекцию только для чтения в `/run/recovery`. Сохраните выданный HTTP-воркер и его корневой каталог. По адресу `http://127.0.0.1:8080/recovery-id` отдайте сам файл из проекции с идентификатором из `relay-handover-id`.

  Проверка подтверждает только итоговое состояние и фактическое поведение по зафиксированным идентификаторам. Команды восстановления выберите сами.
stages.0.brief: Управляемый маркер должен быть стабилен.
stages.1.brief: Парк хостов должен согласованно обслуживать восстановленный релиз.
stages.2.brief: Работающий потребитель должен соответствовать восстановленному релизу.
hints.0.text: |-
  Перед восстановлением пропавших привязок сравните копию с активным состоянием. Восстановленный идентификатор должен дойти до каждого следующего слоя.
hints.1.text: |-
  Проверьте lineage и идентичности ресурсов в обоих файлах состояния. Проследите записанный идентификатор через артефакт fleet и публикацию Kubernetes.

  Сравните действующие привязки с проверенной контрольной точкой и найдите более свежую запись передачи. Проследите исходный ID из состояния до артефакта парка и проекции ConfigMap работающего `worker`.

  ```sh
  (cd recovery && sha256sum -c checkpoint.sha256)
  jq '{lineage,serial,resources:[.resources[] | {type,name,ids:[.instances[].attributes.id]}]}' terraform.tfstate recovery/checkpoint.tfstate
  ```

  ```sh
  cat recovered-release.json rollout.yml
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    curl -fsS --max-time 3 "http://$host:8080/"
  done
  ```

  ```sh
  cat relay-publication.yaml relay-handover-id
  kubectl get deployment relay -o yaml
  kubectl get configmap -o yaml
  ```
hints.2.text: |-
  Проверьте файлы, HTTP-ответы и проекцию исходной ConfigMap из работающего контейнера worker.

  Этап 1. Проверьте доверенный архив, восстановленную привязку релиза и сохранённую привязку передачи.

  ```sh
  (
  set -euo pipefail
  cd ~/quest
  printf '%s  recovery/checkpoint.tfstate\n' "$(jq -er .sha256 /run/dq/facts/0/recovery-contract.json)" | sha256sum -c -
  tofu state pull | jq -e --slurpfile expected /run/dq/facts/0/recovery-contract.json '
    def has_binding($name; $id): any(.resources[]?; .mode=="managed" and .type=="terraform_data" and
      (.module // "")=="" and .name==$name and (.instances | length)==1 and .instances[0].attributes.id==$id);
    $expected[0] as $contract | .lineage==$contract.lineage and
      has_binding("release_record"; $contract.release_id) and has_binding("handover"; $contract.handover_id)'
  (cd recovery && sha256sum -c checkpoint.sha256)
  tofu state list
  tofu output -raw recovery_id
  printf '\n'
  cat release.txt
  tofu plan -input=false -detailed-exitcode -no-color
  )
  ```

  Этап 2. Проверьте файлы и HTTP на всех трёх хостах.

  ```sh
  (
  set -euo pipefail
  cd ~/quest
  source platform.env
  expected=$(jq -er .recovery_id /run/dq/facts/1/recovered-release.json)
  with_newline=$(printf '%s\n' release-90 | sha256sum | cut -d' ' -f1)
  without_newline=$(printf '%s' release-90 | sha256sum | cut -d' ' -f1)
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    observed=$(ssh -n -o BatchMode=yes -o ConnectTimeout=2 -p 2222 "root@$host"     'set -e; stat -c %a /srv/site/message; sha256sum /srv/site/message; cat /srv/site/recovery-id')
    mapfile -t files <<<"$observed"
    test "${files[0]}" = 644
    digest=${files[1]%% *}
    [[ "$digest" == "$with_newline" || "$digest" == "$without_newline" ]]
    test "${files[2]}" = "$expected"
    test "$(curl -fsS --max-time 3 "http://$host:8080/")" = release-90
    printf '%s: release files and HTTP match\n' "$host"
  done
  )
  ```

  Этап 3. Проверьте исходный ConfigMap и значение, которое текущий worker отдаёт из проекции.

  ```sh
  (
  set -euo pipefail
  cd ~/quest
  source platform.env
  expected=$(cat /run/dq/facts/2/relay-handover-id)
  original_uid=$(cat /run/dq/facts/2/relay-publication-uid)
  kubectl get configmap relay-recovery -o json |
    jq -e --arg uid "$original_uid" --arg id "$expected" '.metadata.uid==$uid and .data["recovery-id"]==$id'
  kubectl get deployment relay -o json | jq -e '
    .spec.template.spec as $pod | any($pod.volumes[]?; .configMap.name=="relay-recovery" and
      (.name as $volume | any($pod.containers[]?; .name=="worker" and
        any(.volumeMounts[]?; .name==$volume and .mountPath=="/run/recovery" and .readOnly==true))))'
  kubectl rollout status deployment/relay --timeout=3s
  test "$(kubectl exec deployment/relay -c worker -- printenv RELEASE)" = release-90
  observed=$(kubectl exec deployment/relay -c worker -- sh -ec '
    test "$(cat /proc/1/comm)" = httpd
    test "$(readlink /proc/1/cwd)" = /tmp/www
    test /tmp/www/recovery-id -ef /run/recovery/recovery-id
    projected=$(cat /run/recovery/recovery-id)
    response=$(wget -qO- -T 2 http://127.0.0.1:8080/recovery-id)
    printf "%s\n%s\n" "$projected" "$response"
  ')
  test "$observed" = "$(printf '%s\n%s' "$expected" "$expected")"
  )
  ```
debrief: |-
  Выборочное восстановление сохраняет более свежую привязку и возвращает идентичность релиза из копии. Файлы на хостах и HTTP подтверждают разные части доставки. Проекция передаёт восстановленный идентификатор в relay.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: После изменения я проверил состояние workload и его готовность.
