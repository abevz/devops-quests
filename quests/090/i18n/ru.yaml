title: Восстановление после аварии
brief: 'Вы в команде эксплуатации SignalRail. Восстановите маркер, fleet и сервис. Работайте в ~/quest.
  Все изменения — только в этой песочнице.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `inventory.ini`, `ansible.cfg`, `main.tf`,
  `rollout.yml`, `deployment.json`.


  В песочнице нет интернета и внешнего DNS. Используйте только выданные файлы, предварительно загруженные
  образы и приватные сервисы. Все изменения — только в этой песочнице.


  Цели первого этапа: Управляемый маркер корректен.'
stages.0.brief: 'Восстановите управляемый маркер release-90.


  Результат проверки: Управляемый маркер корректен.'
stages.0.objectives.0.text: Управляемый маркер корректен.
stages.1.brief: 'Пришёл новый инцидент: доставьте release-90 на fleet и обновите banner.


  Результат проверки: Три live banner показывают release-90.'
stages.1.objectives.0.text: Три live banner показывают release-90.
stages.2.brief: 'Релиз доставлен. Новый инцидент reader: исправьте RELEASE.


  Результат проверки: Работающий reader обслуживает нужный release.'
stages.2.objectives.0.text: Работающий reader обслуживает нужный release.
hints.0.text: Восстанавливайте по одному слою и проверяйте фактический результат.
hints.1.text: Маркер, banner fleet и окружение reader должны указывать один релиз.
hints.2.text: Примените маркер, обновите корректно настроенный fleet, затем исправьте Kubernetes reader
  и дождитесь readiness.
debrief: Восстановления требовали state, fleet и reader. Вы восстановили маркер, обновили fleet и проверили
  конечный работающий reader.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: После изменения я проверил состояние workload и его готовность.
