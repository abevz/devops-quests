diagnostics.state: Setup удаляет привязку управляемого файла и release.txt; восстановление привязки может ещё не создать файл для сравнения физического файла. Восстановите записанные привязки и примените конфигурацию; ошибки state, разбора и цели файла дают тот же маркер. [Причина и проверка](guides#guide=terraform-4&section=verified-recovery-managed-release-file)
diagnostics.probe_0_0: Ранний state observer может не запуститься до именованного результата; проверьте запуск Python и текущий workspace. Обычные ошибки state-show, разбора и отсутствия файловой привязки внутри observer уже дают state. [Причина и проверка](guides#guide=terraform-4&section=verified-recovery-state-observer-startup)
diagnostics.checkpoint_digest: Checkpoint мог быть изменён или напрямую использован в переносе state; сохраните recovery/checkpoint.tfstate и работайте с копией. Авторитетный хэш зафиксирован в recovery contract, поэтому переписывание рабочего checksum не разрешает менять байты. [Причина и проверка](guides#guide=terraform-4&section=verified-recovery-protected-checkpoint-bytes)
diagnostics.handover_state: Замена активного state целым старым checkpoint может потерять более новую handover-идентичность или изменить lineage; объедините лишь недостающие release-привязки, сохранив текущую root handover-запись и исходный lineage. [Причина и проверка](guides#guide=terraform-4&section=verified-recovery-newer-handover-and-lineage)
diagnostics.checkpoint_binding: Новый apply может создать другой ID release_record после удаления привязки; восстановите исходную root-запись из проверенного checkpoint. Более новая handover-запись принадлежит текущему state и сохраняется при объединении. [Причина и проверка](guides#guide=terraform-4&section=verified-recovery-original-release-record)
diagnostics.file: Файл релиза может оставаться удалённым или содержать старую ручную правку после восстановления state; примените восстановленную конфигурацию до release-90 в release.txt. Одни привязки не создают отсутствующие байты диска. [Причина и проверка](guides#guide=terraform-4&section=verified-recovery-actual-restored-release)
diagnostics.plan: Восстановленный state может расходиться с конфигурацией или предлагать замены, либо plan завершается ошибкой; изучите новый detailed plan и добейтесь exit 0. Предлагаемые изменения и ошибки планирования одинаково нарушают условие. [Причина и проверка](guides#guide=terraform-4&section=verified-recovery-converged-recovery-plan)
diagnostics.content_1: 'app1: Выданный play может сохранять retired вместо восстановленного релиза, либо SSH не читает сообщение; используйте recovered-release.json и доставьте release-90 без перевода строки либо ровно с одним. [Причина и проверка](guides#guide=ansible-10&section=verified-recovery-app1-content)'
diagnostics.mode_1: 'app1: Копирование при восстановлении могло оставить случайные права, либо SSH не выполняет stat сообщения; явно задайте /srv/site/message mode 0644. [Причина и проверка](guides#guide=ansible-10&section=verified-recovery-app1-mode)'
diagnostics.fleet_identity_1: 'app1: Сообщение может быть верным, пока /srv/site/recovery-id отсутствует или относится к другому восстановлению; скопируйте восстановленный ID из выданного JSON. Значение сравнивается с зафиксированным релизом, а не новым сгенерированным ID. [Причина и проверка](guides#guide=ansible-10&section=verified-recovery-app1-identity)'
diagnostics.http_1: 'app1: Legacy-сервис может хранить старый ответ в памяти после правильного copy, либо HTTP недоступен; уведомите reload handler и проверьте release-90 на порту 8080. [Причина и проверка](guides#guide=ansible-10&section=verified-recovery-app1-http)'
diagnostics.content_2: 'app2: Выданный play может сохранять retired вместо восстановленного релиза, либо SSH не читает сообщение; используйте recovered-release.json и доставьте release-90 без перевода строки либо ровно с одним. [Причина и проверка](guides#guide=ansible-10&section=verified-recovery-app2-content)'
diagnostics.mode_2: 'app2: Копирование при восстановлении могло оставить случайные права, либо SSH не выполняет stat сообщения; явно задайте /srv/site/message mode 0644. [Причина и проверка](guides#guide=ansible-10&section=verified-recovery-app2-mode)'
diagnostics.fleet_identity_2: 'app2: Сообщение может быть верным, пока /srv/site/recovery-id отсутствует или относится к другому восстановлению; скопируйте восстановленный ID из выданного JSON. Значение сравнивается с зафиксированным релизом, а не новым сгенерированным ID. [Причина и проверка](guides#guide=ansible-10&section=verified-recovery-app2-identity)'
diagnostics.http_2: 'app2: Legacy-сервис может хранить старый ответ в памяти после правильного copy, либо HTTP недоступен; уведомите reload handler и проверьте release-90 на порту 8080. [Причина и проверка](guides#guide=ansible-10&section=verified-recovery-app2-http)'
diagnostics.content_3: 'app3: Выданный play может сохранять retired вместо восстановленного релиза, либо SSH не читает сообщение; используйте recovered-release.json и доставьте release-90 без перевода строки либо ровно с одним. [Причина и проверка](guides#guide=ansible-10&section=verified-recovery-app3-content)'
diagnostics.mode_3: 'app3: Копирование при восстановлении могло оставить случайные права, либо SSH не выполняет stat сообщения; явно задайте /srv/site/message mode 0644. [Причина и проверка](guides#guide=ansible-10&section=verified-recovery-app3-mode)'
diagnostics.fleet_identity_3: 'app3: Сообщение может быть верным, пока /srv/site/recovery-id отсутствует или относится к другому восстановлению; скопируйте восстановленный ID из выданного JSON. Значение сравнивается с зафиксированным релизом, а не новым сгенерированным ID. [Причина и проверка](guides#guide=ansible-10&section=verified-recovery-app3-identity)'
diagnostics.http_3: 'app3: Legacy-сервис может хранить старый ответ в памяти после правильного copy, либо HTTP недоступен; уведомите reload handler и проверьте release-90 на порту 8080. [Причина и проверка](guides#guide=ansible-10&section=verified-recovery-app3-http)'
diagnostics.rollout: Выданная readiness-проверка отвергает retired RELEASE, либо другой сбой запуска блокирует rollout; обновите эффективное окружение и изучите события. Один завершённый rollout не доказывает проекцию recovery publication. [Причина и проверка](guides#guide=kubernetes-12&section=verified-recovery-relay-readiness)
diagnostics.relay: Правка локального deployment YAML или ConfigMap может оставить retired RELEASE у процесса; согласуйте реальное окружение до release-90. Обновление projected recovery ID не меняет эту отдельную переменную. [Причина и проверка](guides#guide=kubernetes-12&section=verified-recovery-effective-release-value)
diagnostics.relay_publication: Исходный ConfigMap может сохранять retired, быть пересоздан либо не связываться с именованным контейнером в /run/recovery с readOnly=true. Обновите существующую publication identity и сохраните явную read-only проекцию перед проверкой HTTP-файла. [Причина и проверка](guides#guide=kubernetes-12&section=verified-recovery-original-readonly-projection)
diagnostics.relay_identity: Скопированный ID или заменённая HTTP-программа могут вернуть совпадающий текст без самой проекции; сохраните PID 1 httpd, document root /tmp/www и тот же файл, что /run/recovery/recovery-id. Projected value и реальный HTTP-ответ совпадают с восстановленным ID; ошибки выполнения/чтения дают тот же маркер. [Причина и проверка](guides#guide=kubernetes-12&section=verified-recovery-serve-the-projected-file)
