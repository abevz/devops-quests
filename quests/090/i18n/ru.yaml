diagnostics.fleet_identity_3: |-
  Копирование могло пропустить восстановленную запись или её режим. Сопоставьте результат каждого хоста с артефактом передачи. [Документация](https://docs.ansible.com/projects/ansible/latest/collections/ansible/builtin/copy_module.html)
diagnostics.relay_publication: |-
  Публикация relay может ссылаться на прежнюю запись или другой источник. Сравните исходную ConfigMap, проекцию и HTTP-ответ контейнера worker. [Документация](https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/#add-configmap-data-to-a-volume)
diagnostics.relay_identity: |-
  Проверьте, что HTTP-воркер отдаёт файл из проекции через исходный корневой каталог. [Документация](https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/#add-configmap-data-to-a-volume)
