diagnostics.probe_0_0: |-
  Проверка состояния не вернула диагностический результат. Просмотрите состояние отдельно из рабочего каталога. [Документация](https://opentofu.org/docs/cli/commands/show/#json-output)
diagnostics.checkpoint_binding: |-
  Сопоставьте активную привязку с проверенной копией. После пересоздания у записи может оказаться другой идентификатор. [Документация](https://opentofu.org/docs/cli/commands/state/mv/#usage)
diagnostics.handover_state: |-
  Замена активного состояния старой копией может затереть новые привязки. Сопоставьте оба состояния и их lineage. [Документация](https://opentofu.org/docs/cli/commands/state/mv/#usage)
diagnostics.checkpoint_digest: |-
  Копию могли отредактировать или заменить. Сверьте исходную копию с её контрольной суммой. [Документация](https://opentofu.org/docs/cli/commands/state/mv/#usage)
diagnostics.fleet_identity_1: |-
  Копирование могло пропустить восстановленную запись или её режим. Сопоставьте результат каждого хоста с артефактом передачи. [Документация](https://docs.ansible.com/projects/ansible/latest/collections/ansible/builtin/copy_module.html)
diagnostics.fleet_identity_2: |-
