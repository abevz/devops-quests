title: Восстановление после аварии
brief: "Управляемый маркер, баннеры парка хостов и сервис ещё не показывают согласованный релиз.\n\nРаботайте в\
  \ `~/quest` на рабочей станции. Входные файлы по этапам:\n- Этап 1: `main.tf`.\n- Этап 2: `inventory.ini`, `ansible.cfg`,\
  \ `rollout.yml`.\n- Этап 3: `deployment.yaml`.\n\n**Требования:**\n\n- Этап 1:\n  - OpenTofu учитывает управляемый\
  \ артефакт релиза в state.\n  - На workstation файл `~/quest/release.txt` содержит `release-90`.\n  - План OpenTofu\
  \ не содержит изменений и завершается с кодом `0`.\n- Этап 2:\n  - На каждом управляемом хосте (`app1`, `app2`,\
  \ `app3`) файл `/srv/site/message` содержит `release-90` и имеет режим `0644`.\n  - HTTP на порту `8080` возвращает\
  \ `release-90` с каждого управляемого хоста (`app1`, `app2`, `app3`).\n- Этап 3:\n  - Deployment `relay` завершает\
  \ развёртывание, его работающий процесс настроен на `release-90`.\n\nПроверка наблюдает маркер, файлы и HTTP-результаты\
  \ парка хостов и состояние работающего потребителя; она не доказывает использованные команды восстановления."
stages.0.brief: Управляемый маркер должен быть стабилен.
stages.1.brief: Парк хостов должен согласованно обслуживать восстановленный релиз.
stages.2.brief: Работающий потребитель должен соответствовать восстановленному релизу.
hints.0.text: Восстанавливайте по одному слою и проверяйте фактический результат.
hints.1.text: 'Маркер, banner fleet и окружение reader должны указывать один релиз.


  Изучите поставленные определения, описания ресурсов и события соответствующего этапа.


  ```sh

  cat main.tf

  cat rollout.yml

  kubectl describe deployment relay

  ```'
hints.2.text: |-
  Примените маркер, обновите корректно настроенный fleet, затем исправьте Kubernetes reader и дождитесь readiness.

  Проверьте исправленный этап и сравните наблюдаемый результат.

  Этап 1: State включает `release.txt`, файл workstation показывает `release-90`, план завершается с кодом `0` без изменений.

  ```sh
  tofu show -json
  cat release.txt
  printf "\n"
  tofu plan -input=false -detailed-exitcode -no-color
  ```

  Этап 2: Каждый управляемый хост показывает `release-90`, режим файла `644` и HTTP `release-90` на порту `8080`.

  ```sh
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    printf "%s: " "$host"
    ssh -n -o BatchMode=yes -p 2222 "root@$host" 'cat /srv/site/message; stat -c %a /srv/site/message'
    curl -fsS --max-time 3 "http://$host:8080"
    printf "\n"
  done
  ```

  Этап 3: Развёртывание завершено, работающий процесс выводит `release-90`.

  ```sh
  kubectl rollout status deployment/relay --timeout=3s
  kubectl exec deployment/relay -c worker -- printenv RELEASE
  ```

debrief: Проверки подтвердили управляемый маркер, файлы и ответы парка, а также rollout и окружение relay.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: После изменения я проверил состояние workload и его готовность.
