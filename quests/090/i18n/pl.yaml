diagnostics.state: Setup usuwa powiązanie zarządzanego pliku i release.txt; samo odzyskanie powiązania może nie utworzyć pliku dla porównania fizycznego pliku. Odzyskaj zapisane powiązania i zastosuj konfigurację; błędy stanu, parsowania i celu pliku też dają marker. [Przyczyna i kontrola](guides#guide=terraform-4&section=verified-recovery-managed-release-file)
diagnostics.probe_0_0: Wczesny state observer może nie wystartować przed nazwanym wynikiem; sprawdź start Python i bieżący workspace. Zwykłe błędy state-show, parsowania i brakującego powiązania pliku wewnątrz observer dają już state. [Przyczyna i kontrola](guides#guide=terraform-4&section=verified-recovery-state-observer-startup)
diagnostics.checkpoint_digest: Checkpoint mógł zostać zmieniony lub użyty bezpośrednio w przeniesieniu stanu; zachowaj recovery/checkpoint.tfstate i pracuj na kopii. Właściwy hash jest zamrożony w recovery contract, więc zmiana roboczego checksum nie uprawnia do innych bajtów. [Przyczyna i kontrola](guides#guide=terraform-4&section=verified-recovery-protected-checkpoint-bytes)
diagnostics.handover_state: Zastąpienie aktywnego stanu całym starszym checkpoint może utracić nowszą tożsamość handover lub zmienić lineage; scal tylko brakujące powiązania release, zachowując bieżący root handover i pierwotny lineage. [Przyczyna i kontrola](guides#guide=terraform-4&section=verified-recovery-newer-handover-and-lineage)
diagnostics.checkpoint_binding: Nowy apply może utworzyć inny ID release_record po usunięciu powiązania; odzyskaj pierwotny root record ze zweryfikowanego checkpoint. Nowszy handover należy do bieżącego stanu i musi przetrwać scalanie. [Przyczyna i kontrola](guides#guide=terraform-4&section=verified-recovery-original-release-record)
diagnostics.file: Plik wydania może pozostać usunięty lub zawierać starą ręczną wartość po odzyskaniu stanu; zastosuj odzyskaną konfigurację do release-90 w release.txt. Same powiązania nie dostarczają brakujących bajtów dysku. [Przyczyna i kontrola](guides#guide=terraform-4&section=verified-recovery-actual-restored-release)
diagnostics.plan: Odzyskany stan może różnić się od konfiguracji lub proponować zamiany albo planowanie zawodzi; sprawdź nowy detailed plan i wymagaj exit 0. Zarówno zmiany, jak i błędy planowania nie spełniają warunku. [Przyczyna i kontrola](guides#guide=terraform-4&section=verified-recovery-converged-recovery-plan)
diagnostics.content_1: 'app1: Dostarczony play może nadal kopiować retired zamiast odzyskanego wydania albo SSH nie czyta wiadomości; użyj recovered-release.json i dostarcz release-90 bez nowej linii lub z dokładnie jedną. [Przyczyna i kontrola](guides#guide=ansible-10&section=verified-recovery-app1-content)'
diagnostics.mode_1: 'app1: Kopiowanie przy naprawie mogło pozostawić niezamierzone prawa albo SSH nie wykonuje stat wiadomości; zadeklaruj jawnie mode 0644 dla /srv/site/message. [Przyczyna i kontrola](guides#guide=ansible-10&section=verified-recovery-app1-mode)'
diagnostics.fleet_identity_1: 'app1: Wiadomość może być poprawna, gdy /srv/site/recovery-id brak lub pochodzi z innej naprawy; skopiuj odzyskany ID z dostarczonego JSON. Wartość porównuje się z zamrożonym wydaniem, nie nowo wygenerowaną tożsamością. [Przyczyna i kontrola](guides#guide=ansible-10&section=verified-recovery-app1-identity)'
diagnostics.http_1: 'app1: Usługa legacy może zachować starą odpowiedź w pamięci po poprawnym copy albo HTTP jest niedostępne; powiadom reload handler i sprawdź release-90 na porcie 8080. [Przyczyna i kontrola](guides#guide=ansible-10&section=verified-recovery-app1-http)'
