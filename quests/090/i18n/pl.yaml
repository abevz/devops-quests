diagnostics.probe_0_0: |-
  Sprawdzenie stanu nie dało diagnozy. Sprawdź stan osobno z katalogu roboczego. [Dokumentacja](https://opentofu.org/docs/cli/commands/show/#json-output)
diagnostics.checkpoint_binding: |-
  Porównaj aktywne powiązanie ze zweryfikowaną kopią. Nowo utworzony rekord może mieć inną tożsamość. [Dokumentacja](https://opentofu.org/docs/cli/commands/state/mv/#usage)
diagnostics.handover_state: |-
  Zastąpienie aktywnego stanu starszą kopią może utracić nowsze powiązania. Porównaj oba stany i ich pochodzenie. [Dokumentacja](https://opentofu.org/docs/cli/commands/state/mv/#usage)
diagnostics.checkpoint_digest: |-
  Kopia mogła zostać zmieniona lub zastąpiona. Sprawdź oryginalną kopię względem sumy kontrolnej. [Dokumentacja](https://opentofu.org/docs/cli/commands/state/mv/#usage)
diagnostics.fleet_identity_1: |-
  Kopiowanie mogło pominąć odzyskany rekord lub jego tryb. Porównaj wynik każdego hosta z artefaktem przekazania. [Dokumentacja](https://docs.ansible.com/projects/ansible/latest/collections/ansible/builtin/copy_module.html)
