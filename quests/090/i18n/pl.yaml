title: Odzyskiwanie po awarii
brief: |-
  Rekord wydania zniknął z aktywnego stanu. Odzyskaj zweryfikowane wydanie, zachowaj nowsze dane przekazania, a następnie odtwórz flotę i relay.

  Pracuj na stacji roboczej w `~/quest`. Etap 1 używa `main.tf`, `incident.auto.tfvars.json` i `recovery/`. Etap 2 używa `rollout.yml`, `inventory.ini`, `ansible.cfg` i `recovered-release.json`. Etap 3 używa `deployment.yaml`, `relay-publication.yaml` i `relay-handover-id`.

  **Requirements:**

  - OpenTofu zarządza artefaktem wydania w stanie i przywraca rekord z tożsamością ze zweryfikowanej kopii. Zachowaj bajty kopii, pochodzenie aktywnego stanu i nowszy rekord przekazania.
  - Na workstation plik `~/quest/release.txt` zawiera `release-90`.
  - OpenTofu nie planuje zmian i kończy się kodem `0`.
  - Na `app1`, `app2` i `app3` plik `/srv/site/message` zawiera `release-90` w trybie `0644`. `/srv/site/recovery-id` odpowiada identyfikatorowi z `recovered-release.json`.
  - HTTP na porcie `8080` zwraca `release-90` z każdego zarządzanego hosta (`app1`, `app2`, `app3`).
  - Deployment `relay` kończy rollout, a worker używa `release-90` w `RELEASE`. Zachowaj dostarczoną ConfigMap i projekcję tylko do odczytu pod `/run/recovery`. Zachowaj dostarczony proces HTTP w kontenerze worker i jego katalog główny. Udostępnij bezpośrednio plik z projekcji, zawierający ID z `relay-handover-id`, pod adresem `http://127.0.0.1:8080/recovery-id`.

  Sprawdzenie potwierdza tylko stan końcowy i rzeczywiste działanie na podstawie zapisanych identyfikatorów. Samodzielnie wybierz polecenia odzyskiwania.
stages.0.brief: Zarządzany znacznik musi być stabilny.
stages.1.brief: Flota musi spójnie udostępniać odzyskane wydanie.
stages.2.brief: Działający odbiorca musi być zgodny z odzyskanym wydaniem.
hints.0.text: |-
  Porównaj kopię z aktywnym stanem przed przywróceniem brakujących powiązań. Odzyskana tożsamość musi dotrzeć do każdej kolejnej warstwy.
hints.1.text: |-
  Sprawdź pochodzenie i tożsamości zasobów w obu plikach stanu. Śledź zapisaną tożsamość w artefakcie floty i publikacji Kubernetes.

  Porównaj bieżące powiązania ze zweryfikowanym punktem kontrolnym i odszukaj nowszy zapis przekazania. Prześledź pierwotny ID ze stanu do artefaktu floty i projekcji ConfigMap działającego `worker`.

  ```sh
  (cd recovery && sha256sum -c checkpoint.sha256)
  jq '{lineage,serial,resources:[.resources[] | {type,name,ids:[.instances[].attributes.id]}]}' terraform.tfstate recovery/checkpoint.tfstate
  ```

  ```sh
  cat recovered-release.json rollout.yml
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    curl -fsS --max-time 3 "http://$host:8080/"
  done
  ```

  ```sh
  cat relay-publication.yaml relay-handover-id
  kubectl get deployment relay -o yaml
  kubectl get configmap -o yaml
  ```
hints.2.text: |-
  Sprawdź pliki, odpowiedzi HTTP oraz projekcję pierwotnej ConfigMap w działającym worker.

  Etap 1. Sprawdź zaufane archiwum, odtworzone powiązanie wydania i zachowane powiązanie przekazania.

  ```sh
  (
  set -euo pipefail
  cd ~/quest
  printf '%s  recovery/checkpoint.tfstate\n' "$(jq -er .sha256 /run/dq/facts/0/recovery-contract.json)" | sha256sum -c -
  tofu state pull | jq -e --slurpfile expected /run/dq/facts/0/recovery-contract.json '
    def has_binding($name; $id): any(.resources[]?; .mode=="managed" and .type=="terraform_data" and
      (.module // "")=="" and .name==$name and (.instances | length)==1 and .instances[0].attributes.id==$id);
    $expected[0] as $contract | .lineage==$contract.lineage and
      has_binding("release_record"; $contract.release_id) and has_binding("handover"; $contract.handover_id)'
  (cd recovery && sha256sum -c checkpoint.sha256)
  tofu state list
  tofu output -raw recovery_id
  printf '\n'
  cat release.txt
  tofu plan -input=false -detailed-exitcode -no-color
  )
  ```

  Etap 2. Sprawdź pliki i HTTP na wszystkich trzech hostach floty.

  ```sh
  (
  set -euo pipefail
  cd ~/quest
  source platform.env
  expected=$(jq -er .recovery_id /run/dq/facts/1/recovered-release.json)
  with_newline=$(printf '%s\n' release-90 | sha256sum | cut -d' ' -f1)
  without_newline=$(printf '%s' release-90 | sha256sum | cut -d' ' -f1)
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    observed=$(ssh -n -o BatchMode=yes -o ConnectTimeout=2 -p 2222 "root@$host"     'set -e; stat -c %a /srv/site/message; sha256sum /srv/site/message; cat /srv/site/recovery-id')
    mapfile -t files <<<"$observed"
    test "${files[0]}" = 644
    digest=${files[1]%% *}
    [[ "$digest" == "$with_newline" || "$digest" == "$without_newline" ]]
    test "${files[2]}" = "$expected"
    test "$(curl -fsS --max-time 3 "http://$host:8080/")" = release-90
    printf '%s: release files and HTTP match\n' "$host"
  done
  )
  ```

  Etap 3. Sprawdź pierwotny ConfigMap i wartość udostępnianą z projekcji przez bieżący worker.

  ```sh
  (
  set -euo pipefail
  cd ~/quest
  source platform.env
  expected=$(cat /run/dq/facts/2/relay-handover-id)
  original_uid=$(cat /run/dq/facts/2/relay-publication-uid)
  kubectl get configmap relay-recovery -o json |
    jq -e --arg uid "$original_uid" --arg id "$expected" '.metadata.uid==$uid and .data["recovery-id"]==$id'
  kubectl get deployment relay -o json | jq -e '
    .spec.template.spec as $pod | any($pod.volumes[]?; .configMap.name=="relay-recovery" and
      (.name as $volume | any($pod.containers[]?; .name=="worker" and
        any(.volumeMounts[]?; .name==$volume and .mountPath=="/run/recovery" and .readOnly==true))))'
  kubectl rollout status deployment/relay --timeout=3s
  test "$(kubectl exec deployment/relay -c worker -- printenv RELEASE)" = release-90
  observed=$(kubectl exec deployment/relay -c worker -- sh -ec '
    test "$(cat /proc/1/comm)" = httpd
    test "$(readlink /proc/1/cwd)" = /tmp/www
    test /tmp/www/recovery-id -ef /run/recovery/recovery-id
    projected=$(cat /run/recovery/recovery-id)
    response=$(wget -qO- -T 2 http://127.0.0.1:8080/recovery-id)
    printf "%s\n%s\n" "$projected" "$response"
  ')
  test "$observed" = "$(printf '%s\n%s' "$expected" "$expected")"
  )
  ```
debrief: |-
  Selektywne przywracanie zachowuje nowsze powiązanie i odzyskuje tożsamość wydania z kopii. Pliki hostów i HTTP potwierdzają różne części dystrybucji. Projekcja przekazuje tożsamość do relay.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
