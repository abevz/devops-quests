title: Odzyskiwanie po awarii
brief: 'Dołączyłeś do operacji SignalRail. Odzyskaj zarządzany znacznik, fleet i nieudaną usługę. Pracuj
  w ~/quest.. Wszystkie zmiany przechowuj w tej komorze szkoleniowej.


  Pliki zadań w `~/quest` (niektóre zostały wprowadzone w późniejszych etapach): `inventory.ini`, `ansible.cfg`,
  `main.tf`, `rollout.yml`, `deployment.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Wszystkie zmiany muszą pozostać w tej zatoce.


  Początkowe kryteria sukcesu: znacznik zarządzanej wersji jest poprawny.'
stages.0.brief: 'Przeczytaj `main.tf` w `~/quest`: deklaruje dostawcę local offline i `local_file.release`. Zainicjuj i zastosuj znacznik. Sprawdź, czy `tofu state list` zawiera `local_file.release`, `release.txt` zawiera `release-90`, a `tofu plan -input=false -detailed-exitcode -no-color` zwraca kod 0 (brak zmian). Połączony przewodnik przedstawia stan OpenTofu. Pracuj tylko w zatoce.'
stages.0.objectives.0.text: Adres stanu i plik wydania są poprawne, a plan zwraca kod 0.
stages.1.brief: 'Uruchomiono alarm na station. Dostarcz release-90 do całego fleet i przeładuj jego live
  banner.


  Kryteria sukcesu: wszystkie trzy aktywne banery fleet przedstawiają release-90.'
stages.1.objectives.0.text: Wszystkie trzy banery floty na żywo przedstawiają release-90.
stages.2.brief: 'release dotarł do station. Pojawił się incydent reader: napraw środowisko RELEASE.


  Kryteria sukcesu: Aktywny reader obsługuje zamierzony release.'
stages.2.objectives.0.text: Aktywny reader obsługuje zamierzony release.
hints.0.text: Odzyskuj jedną warstwę na raz i sprawdzaj każdy wynik na żywo.
hints.1.text: Znacznik, banery floty i środowisko reader muszą mieć tę samą nazwę wersji.
hints.2.text: Zastosuj znacznik, załaduj ponownie poprawnie skonfigurowany fleet, następnie napraw Kubernetes
  reader i poczekaj na readiness.
debrief: State, fleet i reader wymagały odzyskania. Przywróciłeś zarządzany znacznik, ponownie załadowałeś
  fleet i zweryfikowałeś ostateczną wersję aktywnego reader.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
