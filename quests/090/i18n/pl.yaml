title: Odzyskiwanie po awarii
brief: "Zarządzany znacznik, banery floty i usługa nie pokazują jeszcze spójnego wydania.\n\nPracuj w `~/quest`\
  \ na stacji roboczej. Dane wejściowe według etapu:\n- Etap 1: `main.tf`.\n- Etap 2: `inventory.ini`, `ansible.cfg`,\
  \ `rollout.yml`.\n- Etap 3: `deployment.yaml`.\n\n**Wymagania:**\n\n- Etap 1:\n  - OpenTofu rejestruje zarządzany\
  \ artefakt wydania w state.\n  - Na workstation plik `~/quest/release.txt` zawiera `release-90`.\n  - OpenTofu\
  \ nie planuje zmian i kończy się kodem `0`.\n- Etap 2:\n  - Na każdym zarządzanym hoście (`app1`, `app2`, `app3`)\
  \ plik `/srv/site/message` zawiera `release-90` i ma tryb `0644`.\n  - HTTP na porcie `8080` zwraca `release-90`\
  \ z każdego zarządzanego hosta (`app1`, `app2`, `app3`).\n- Etap 3:\n  - Deployment `relay` kończy rollout, a\
  \ jego działający proces jest skonfigurowany dla `release-90`.\n\nSprawdzenie obserwuje znacznik, pliki i wyniki\
  \ HTTP floty oraz stan działającego odbiorcy; nie dowodzi użytych poleceń odzyskiwania."
stages.0.brief: Zarządzany znacznik musi być stabilny.
stages.1.brief: Flota musi spójnie udostępniać odzyskane wydanie.
stages.2.brief: Działający odbiorca musi być zgodny z odzyskanym wydaniem.
hints.0.text: Odzyskuj jedną warstwę na raz i sprawdzaj każdy wynik na żywo.
hints.1.text: 'Znacznik, banery floty i środowisko reader muszą mieć tę samą nazwę wersji.


  Sprawdź dostarczone definicje, opisy zasobów i zdarzenia odpowiedniego etapu.


  ```sh

  cat main.tf

  cat rollout.yml

  kubectl describe deployment relay

  ```'
hints.2.text: |-
  Zastosuj znacznik, załaduj ponownie poprawnie skonfigurowany fleet, następnie napraw Kubernetes reader i poczekaj na readiness.

  Sprawdź naprawiony etap i porównaj obserwowany wynik.

  Etap 1: State zawiera `release.txt`, plik workstation pokazuje `release-90`, a plan kończy się kodem `0` bez zmian.

  ```sh
  tofu show -json
  cat release.txt
  printf "\n"
  tofu plan -input=false -detailed-exitcode -no-color
  ```

  Etap 2: Każdy zarządzany host pokazuje `release-90`, tryb pliku `644` oraz HTTP `release-90` na porcie `8080`.

  ```sh
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    printf "%s: " "$host"
    ssh -n -o BatchMode=yes -p 2222 "root@$host" 'cat /srv/site/message; stat -c %a /srv/site/message'
    curl -fsS --max-time 3 "http://$host:8080"
    printf "\n"
  done
  ```

  Etap 3: Rollout jest zakończony, a działający proces wypisuje `release-90`.

  ```sh
  kubectl rollout status deployment/relay --timeout=3s
  kubectl exec deployment/relay -c worker -- printenv RELEASE
  ```

debrief: Kontrole sprawdziły zarządzany znacznik, pliki i odpowiedzi floty oraz rollout i środowisko relay.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
