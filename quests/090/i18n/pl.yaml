title: Odzyskiwanie po awarii
brief: 'Dołączyłeś do operacji SignalRail. Odzyskaj zarządzany znacznik, fleet i nieudaną usługę. Pracuj w ~/quest.. Wszystkie
  zmiany przechowuj w tej komorze szkoleniowej.


  Pliki zadań w `~/quest` (niektóre zostały wprowadzone w późniejszych etapach): `inventory.ini`, `ansible.cfg`, `main.tf`,
  `rollout.yml`, `deployment.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie załadowanych obrazów
  i usług prywatnych. Wszystkie zmiany muszą pozostać w tej zatoce.


  Początkowe kryteria sukcesu: znacznik zarządzanej wersji jest poprawny.'
stages.0.brief: 'Przeczytaj `main.tf` w `~/quest`: deklaruje dostawcę local offline i `local_file.release`. Zainicjuj i zastosuj
  znacznik. Sprawdź, czy `tofu state list` zawiera `local_file.release`, `release.txt` zawiera `release-90`, a `tofu plan
  -input=false -detailed-exitcode -no-color` zwraca kod 0 (brak zmian). Połączony przewodnik przedstawia stan OpenTofu. Pracuj
  tylko w zatoce.'
stages.0.objectives.0.text: Adres stanu i plik wydania są poprawne, a plan zwraca kod 0.
stages.1.brief: 'Przeczytaj `inventory.ini`, `ansible.cfg` i `rollout.yml` w `~/quest`. Ansible wysyła zadania przez SSH do
  każdego hosta prywatnej floty. Dostarcz `release-90` do `/srv/site/message` z trybem `0644` na app1, app2 i app3. Użyj dostarczonego
  handlera z `dq-service reload`, aby usługa ponownie odczytała plik; uruchom `ansible-playbook rollout.yml`. Sprawdź odpowiedź
  HTTP każdego hosta na porcie 8080: ma wynosić `release-90`. Kontrole sprawdzają pliki, tryby i odpowiedzi; nie dowodzą użytych
  poleceń. Plik wiadomości musi zawierać dokładnie ten tekst, po którym może wystąpić jeden znak nowej linii.'
stages.1.objectives.0.text: Pliki, tryby i odpowiedzi HTTP wszystkich trzech hostów floty odpowiadają `release-90`.
stages.2.brief: Napraw czytnik Kubernetes, korzystając z `deployment.json`. Ustaw `RELEASE` na `release-90` w `deployment/relay`
  i poczekaj na rollout. Kontrola odczytuje środowisko działającego procesu i stan rolloutu; nie sprawdza treści serwowanej
  przez czytnik.
stages.2.objectives.0.text: Rollout relay kończy się, a jego działający proces ma `RELEASE=release-90`.
hints.0.text: Odzyskuj jedną warstwę na raz i sprawdzaj każdy wynik na żywo.
hints.1.text: Znacznik, banery floty i środowisko reader muszą mieć tę samą nazwę wersji.
hints.2.text: Zastosuj znacznik, załaduj ponownie poprawnie skonfigurowany fleet, następnie napraw Kubernetes reader i poczekaj
  na readiness.
debrief: Kontrole sprawdziły zarządzany znacznik, pliki i odpowiedzi floty oraz rollout i środowisko relay.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
