diagnostics.rollout: Dostarczona readiness odrzuca retired RELEASE albo inny problem startu blokuje rollout; zaktualizuj skuteczne środowisko i sprawdź zdarzenia. Sam zakończony rollout nie dowodzi projected recovery publication. [Przyczyna i kontrola](guides#guide=kubernetes-12&section=verified-recovery-relay-readiness)
diagnostics.relay: Edycja lokalnego deployment YAML lub ConfigMap może pozostawić retired RELEASE w procesie; uzgodnij rzeczywiste środowisko do release-90. Zmiana projected recovery ID nie zmienia tej osobnej zmiennej. [Przyczyna i kontrola](guides#guide=kubernetes-12&section=verified-recovery-effective-release-value)
diagnostics.relay_publication: Pierwotny ConfigMap może zachować retired, zostać odtworzony lub nie być połączony z nazwanym kontenerem w /run/recovery z readOnly=true. Zaktualizuj istniejącą publication identity i zachowaj jawną projekcję read-only przed kontrolą serwowanego pliku. [Przyczyna i kontrola](guides#guide=kubernetes-12&section=verified-recovery-original-readonly-projection)
diagnostics.relay_identity: Skopiowany ID lub zastępczy program HTTP może zwrócić zgodny tekst bez serwowania projekcji; zachowaj PID 1 httpd, document root /tmp/www i ten sam plik co /run/recovery/recovery-id. Projected value i rzeczywista odpowiedź HTTP mają odpowiadać odzyskanemu ID; błędy wykonania/odczytu też dają marker. [Przyczyna i kontrola](guides#guide=kubernetes-12&section=verified-recovery-serve-the-projected-file)
