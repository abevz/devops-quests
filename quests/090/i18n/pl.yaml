diagnostics.relay_publication: |-
  Publikacja relay może używać starego rekordu lub innego źródła. Porównaj pierwotną ConfigMap, projekcję i odpowiedź HTTP kontenera worker. [Dokumentacja](https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/#add-configmap-data-to-a-volume)
diagnostics.relay_identity: |-
  Sprawdź, czy dostarczony proces HTTP w kontenerze worker serwuje plik z projekcji bezpośrednio ze swojego pierwotnego katalogu głównego. [Dokumentacja](https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/#add-configmap-data-to-a-volume)
