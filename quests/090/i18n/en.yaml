title: Disaster recovery
brief: |-
  The release record was lost from the active state. Recover the verified release while preserving newer handover data, then restore the fleet and the relay.

  Work on the workstation in `~/quest`. Stage 1 uses `main.tf`, `incident.auto.tfvars.json` and `recovery/`. Stage 2 uses `rollout.yml`, `inventory.ini`, `ansible.cfg` and `recovered-release.json`. Stage 3 uses `deployment.yaml`, `relay-publication.yaml` and `relay-handover-id`.

  **Requirements:**

  - OpenTofu tracks the managed release artifact and restores the release record with the identity from the verified checkpoint. Preserve the checkpoint bytes, current state lineage and newer handover record.
  - On the workstation, `~/quest/release.txt` contains `release-90`.
  - OpenTofu plans no changes and exits `0`.
  - On `app1`, `app2` and `app3`, `/srv/site/message` contains `release-90` with mode `0644`, and `/srv/site/recovery-id` matches the recovery ID from `recovered-release.json`.
  - HTTP on port `8080` returns `release-90` from every managed host (`app1`, `app2`, `app3`).
  - Deployment `relay` completes its rollout and worker uses `release-90` in `RELEASE`. Preserve the supplied ConfigMap and the read-only publication under `/run/recovery`. Keep the supplied HTTP worker and document root. Serve the projected file itself, with the ID from `relay-handover-id`, at `http://127.0.0.1:8080/recovery-id`.

  The check establishes only the resulting state and live observations against the recorded identities. The choice of recovery commands is yours.
stages.0.brief: The managed marker must be stable.
stages.1.brief: The fleet must serve the recovered release consistently.
stages.2.brief: The running consumer must agree with the recovered release.
hints.0.text: |-
  Compare the checkpoint with the active state before restoring missing bindings. The recovered identity must reach each downstream layer.
hints.1.text: |-
  Inspect lineage and resource identities in both state files. Follow the recorded identity through the fleet artifact and the Kubernetes publication.

  ```sh
  (cd recovery && sha256sum -c checkpoint.sha256)
  jq '{lineage,serial,resources:[.resources[] | {type,name,ids:[.instances[].attributes.id]}]}' terraform.tfstate recovery/checkpoint.tfstate
  ```

  ```sh
  cat recovered-release.json rollout.yml
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    curl -fsS --max-time 3 "http://$host:8080/"
  done
  ```

  ```sh
  cat relay-publication.yaml relay-handover-id
  kubectl get deployment relay -o yaml
  kubectl get configmap -o yaml
  ```
hints.2.text: |-
  Work from a copy of the verified checkpoint. Restore the missing bindings while retaining the newer handover record. Verify the files, HTTP responses, and the original ConfigMap’s projection through the running worker.

  ```sh
  (cd recovery && sha256sum -c checkpoint.sha256)
  tofu state list
  tofu output -raw recovery_id
  printf '\n'
  cat release.txt
  tofu plan -input=false -detailed-exitcode -no-color
  ```

  ```sh
  jq -r .recovery_id recovered-release.json
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    ssh -n -o BatchMode=yes -p 2222 "root@$host" 'cat /srv/site/message; stat -c %a /srv/site/message; cat /srv/site/recovery-id'
    curl -fsS --max-time 3 "http://$host:8080/"
    printf '\n'
  done
  ```

  ```sh
  kubectl get configmap relay-recovery -o yaml
  kubectl rollout status deployment/relay --timeout=3s
  kubectl exec deployment/relay -c worker -- printenv RELEASE
  kubectl exec deployment/relay -c worker -- wget -qO- -T 3 http://127.0.0.1:8080/recovery-id
  cat relay-handover-id
  ```
debrief: |-
  Selective restoration keeps the newer binding and recovers the release identity from the checkpoint. Host files and live HTTP prove different parts of distribution. The relay projection carries the recovered identity to the final consumer.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked the workload state and its readiness after the change.
