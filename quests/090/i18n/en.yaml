diagnostics.rollout: The supplied readiness condition rejects the retired RELEASE, or another startup problem blocks rollout; update the effective environment and inspect events. A completed rollout alone does not establish the projected recovery publication. [Cause and check](guides#guide=kubernetes-12&section=verified-recovery-relay-readiness)
diagnostics.relay: Editing local deployment YAML or ConfigMap data may leave the existing process with retired RELEASE; reconcile its actual environment to release-90. Updating the projected recovery ID does not change this separate process variable. [Cause and check](guides#guide=kubernetes-12&section=verified-recovery-effective-release-value)
diagnostics.relay_publication: The original ConfigMap may still contain retired, have been recreated, or no longer be linked to the named container at /run/recovery with readOnly=true. Update the existing publication identity and retain that explicit read-only projection before inspecting the served file. [Cause and check](guides#guide=kubernetes-12&section=verified-recovery-original-readonly-projection)
diagnostics.relay_identity: A copied ID or replacement HTTP program may return matching text without serving the projection; retain PID 1 httpd, document root /tmp/www and the same file as /run/recovery/recovery-id. The projected value and actual HTTP response must both match the recovered ID; execution/read failures also report this marker. [Cause and check](guides#guide=kubernetes-12&section=verified-recovery-serve-the-projected-file)
