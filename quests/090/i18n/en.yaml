diagnostics.probe_0_0: |-
  The state probe produced no diagnostic result. Inspect the state separately in the working directory. [Reference](https://opentofu.org/docs/cli/commands/show/#json-output)
diagnostics.checkpoint_binding: |-
  Compare the current binding with the verified checkpoint. A recreated record can have a new identity. [Reference](https://opentofu.org/docs/cli/commands/state/mv/#usage)
diagnostics.handover_state: |-
  Replacing active state with an old checkpoint can lose newer bindings. Compare the two states and their lineage. [Reference](https://opentofu.org/docs/cli/commands/state/mv/#usage)
diagnostics.checkpoint_digest: |-
  The checkpoint may have been edited or replaced. Verify the original saved copy against its checksum. [Reference](https://opentofu.org/docs/cli/commands/state/mv/#usage)
diagnostics.fleet_identity_1: |-
  A copy may have omitted the recovered record or its mode. Compare the stored result on each host with the handover artifact. [Reference](https://docs.ansible.com/projects/ansible/latest/collections/ansible/builtin/copy_module.html)
diagnostics.fleet_identity_2: |-
  A copy may have omitted the recovered record or its mode. Compare the stored result on each host with the handover artifact. [Reference](https://docs.ansible.com/projects/ansible/latest/collections/ansible/builtin/copy_module.html)
diagnostics.fleet_identity_3: |-
  A copy may have omitted the recovered record or its mode. Compare the stored result on each host with the handover artifact. [Reference](https://docs.ansible.com/projects/ansible/latest/collections/ansible/builtin/copy_module.html)
diagnostics.relay_publication: |-
  The relay publication may still use an old record or an incorrect source. Compare the original ConfigMap, its projection and HTTP returned by worker. [Reference](https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/#add-configmap-data-to-a-volume)
diagnostics.relay_identity: |-
  Check that the supplied HTTP worker serves the projected file directly from its original document root. [Reference](https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/#add-configmap-data-to-a-volume)
