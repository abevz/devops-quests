title: Disaster recovery
brief: 'You joined SignalRail operations. Recover a managed marker, the fleet and a failed service. Work
  in ~/quest. Keep all changes inside this training bay.


  Quest files in `~/quest` (some are introduced in later stages): `inventory.ini`, `ansible.cfg`, `main.tf`,
  `rollout.yml`, `deployment.json`.


  The bay has no Internet or external DNS. Use only its supplied files, preloaded images and private services.
  All changes must stay inside this bay.


  Initial success criteria: The managed release marker is correct.'
stages.0.brief: 'Restore the managed release marker release-90.


  Success criteria: The managed release marker is correct.'
stages.0.objectives.0.text: The managed release marker is correct.
stages.1.brief: 'The station alert fired. Deliver release-90 to the whole fleet and reload its live banner.


  Success criteria: All three live fleet banners show release-90.'
stages.1.objectives.0.text: All three live fleet banners show release-90.
stages.2.brief: 'The release reached the station. A reader incident appeared: repair its RELEASE environment.


  Success criteria: The live reader serves the intended release.'
stages.2.objectives.0.text: The live reader serves the intended release.
hints.0.text: Recover one layer at a time and verify each live result.
hints.1.text: The marker, fleet banners and reader environment must name the same release.
hints.2.text: Apply the marker, reload the correctly configured fleet, then repair the Kubernetes reader
  and wait for readiness.
debrief: State, fleet and reader all needed recovery. You restored the managed marker, reloaded the fleet
  and verified the final live reader.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked the workload state and its readiness after the change.
