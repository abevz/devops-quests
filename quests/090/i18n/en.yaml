title: Disaster recovery
brief: "The managed marker, fleet banners and service do not yet present a consistent release.\n\nWork in `~/quest`\
  \ on the workstation. Inputs by stage:\n- Stage 1: `main.tf`.\n- Stage 2: `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n\
  - Stage 3: `deployment.yaml`.\n\n**Requirements:**\n\n- Stage 1:\n  - OpenTofu records the managed release artifact\
  \ in state.\n  - On the workstation, `~/quest/release.txt` contains `release-90`.\n  - OpenTofu plans no changes\
  \ and exits `0`.\n- Stage 2:\n  - On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` contains\
  \ `release-90` with mode `0644`.\n  - HTTP on port `8080` returns `release-90` from every managed host (`app1`,\
  \ `app2`, `app3`).\n- Stage 3:\n  - Deployment `relay` completes its rollout and its running process is configured\
  \ for `release-90`.\n\nThe check observes the marker, fleet file and HTTP results, and running consumer state;\
  \ it does not prove the recovery commands used."
stages.0.brief: The managed marker must be stable.
stages.1.brief: The fleet must serve the recovered release consistently.
stages.2.brief: The running consumer must agree with the recovered release.
hints.0.text: Recover one layer at a time and verify each live result.
hints.1.text: 'The marker, fleet banners and reader environment must name the same release.


  Inspect the supplied definitions, resource descriptions and events for the relevant stage.


  ```sh

  cat main.tf

  cat rollout.yml

  kubectl describe deployment relay

  ```'
hints.2.text: |-
  Apply the marker, reload the correctly configured fleet, then repair the Kubernetes reader and wait for readiness.

  Verify the repaired stage and compare the observed result.

  Stage 1: State includes `release.txt`, the workstation file shows `release-90`, and the plan exits `0` without changes.

  ```sh
  tofu show -json
  cat release.txt
  printf "\n"
  tofu plan -input=false -detailed-exitcode -no-color
  ```

  Stage 2: Each managed host shows `release-90`, file mode `644`, and HTTP `release-90` on port `8080`.

  ```sh
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    printf "%s: " "$host"
    ssh -n -o BatchMode=yes -p 2222 "root@$host" 'cat /srv/site/message; stat -c %a /srv/site/message'
    curl -fsS --max-time 3 "http://$host:8080"
    printf "\n"
  done
  ```

  Stage 3: The rollout is complete and the running process prints `release-90`.

  ```sh
  kubectl rollout status deployment/relay --timeout=3s
  kubectl exec deployment/relay -c worker -- printenv RELEASE
  ```

debrief: The checks verified the managed marker, the fleet files and responses, and the relay rollout and environment.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked the workload state and its readiness after the change.
