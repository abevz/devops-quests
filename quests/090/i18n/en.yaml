diagnostics.state: Setup removes the managed file binding and deletes release.txt; restoring a binding alone may still leave no actual file for the physical file comparison. Recover the recorded bindings and apply the configuration; state-read, parsing and file-target errors also report this marker. [Cause and check](guides#guide=terraform-4&section=verified-recovery-managed-release-file)
diagnostics.probe_0_0: The early state observer may fail to start before producing a named result; verify Python startup and the current workspace. Ordinary state-show, parsing and missing-file-binding failures inside the observer already use state. [Cause and check](guides#guide=terraform-4&section=verified-recovery-state-observer-startup)
diagnostics.checkpoint_digest: The checkpoint may have been edited or consumed directly by a state move operation; keep recovery/checkpoint.tfstate unchanged and work on a copy. The authoritative hash is frozen in the recovery contract, so rewriting the working checksum receipt does not authorize changed bytes. [Cause and check](guides#guide=terraform-4&section=verified-recovery-protected-checkpoint-bytes)
diagnostics.handover_state: Replacing active state with the whole older checkpoint may lose the newer handover identity or change lineage; merge only the missing release bindings while retaining the current root handover record and original lineage. [Cause and check](guides#guide=terraform-4&section=verified-recovery-newer-handover-and-lineage)
diagnostics.checkpoint_binding: A fresh apply may create a different release_record ID after its binding was removed; recover the original root record from the verified checkpoint instead. The newer handover record belongs to current state and must survive that merge. [Cause and check](guides#guide=terraform-4&section=verified-recovery-original-release-record)
diagnostics.file: The release file may remain deleted or contain an old manual value after restoring state; apply the recovered configuration so the actual release.txt contains release-90. State bindings alone do not supply missing disk bytes. [Cause and check](guides#guide=terraform-4&section=verified-recovery-actual-restored-release)
diagnostics.plan: Recovered state may still disagree with configuration or contain pending replacements, or planning may fail; inspect a fresh detailed plan and require command exit 0. Proposed changes and planning errors both fail this condition. [Cause and check](guides#guide=terraform-4&section=verified-recovery-converged-recovery-plan)
diagnostics.content_1: 'app1: The supplied play may still copy retired instead of the recovered release, or SSH could not read the message; use recovered-release.json and deliver release-90 with no newline or exactly one newline. [Cause and check](guides#guide=ansible-10&section=verified-recovery-app1-content)'
diagnostics.mode_1: 'app1: Recovery copying may leave unintended file permissions, or SSH cannot stat the message; declare /srv/site/message mode explicitly as 0644. [Cause and check](guides#guide=ansible-10&section=verified-recovery-app1-mode)'
diagnostics.fleet_identity_1: 'app1: The message may be correct while /srv/site/recovery-id is missing or comes from another recovery; copy the recovered ID from the supplied JSON. The check compares its value with the frozen recovered release, not a freshly generated identity. [Cause and check](guides#guide=ansible-10&section=verified-recovery-app1-identity)'
diagnostics.http_1: 'app1: The legacy service may retain its old in-memory response after a correct file copy, or HTTP is unavailable; notify the reload handler and verify port 8080 returns release-90. [Cause and check](guides#guide=ansible-10&section=verified-recovery-app1-http)'
diagnostics.content_2: 'app2: The supplied play may still copy retired instead of the recovered release, or SSH could not read the message; use recovered-release.json and deliver release-90 with no newline or exactly one newline. [Cause and check](guides#guide=ansible-10&section=verified-recovery-app2-content)'
diagnostics.mode_2: 'app2: Recovery copying may leave unintended file permissions, or SSH cannot stat the message; declare /srv/site/message mode explicitly as 0644. [Cause and check](guides#guide=ansible-10&section=verified-recovery-app2-mode)'
