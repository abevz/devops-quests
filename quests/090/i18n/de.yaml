title: Notfallwiederherstellung
brief: "Verwalteter Marker, Host-Gruppen-Banner und Dienst zeigen noch kein einheitliches Release.\n\nArbeiten Sie\
  \ in `~/quest` auf der Workstation. Eingaben je Phase:\n- Phase 1: `main.tf`.\n- Phase 2: `inventory.ini`, `ansible.cfg`,\
  \ `rollout.yml`.\n- Phase 3: `deployment.yaml`.\n\n**Anforderungen:**\n\n- Phase 1:\n  - OpenTofu erfasst das\
  \ verwaltete Release-Artefakt im State.\n  - Auf der Workstation enthält `~/quest/release.txt` den Wert `release-90`.\n\
  \  - OpenTofu plant keine Änderungen und endet mit Code `0`.\n- Phase 2:\n  - Auf jedem verwalteten Host (`app1`,\
  \ `app2`, `app3`) enthält `/srv/site/message` den Wert `release-90` mit Modus `0644`.\n  - HTTP auf Port `8080`\
  \ liefert `release-90` von jedem verwalteten Host (`app1`, `app2`, `app3`).\n- Phase 3:\n  - Deployment `relay`\
  \ schließt seinen Rollout ab und sein laufender Prozess ist für `release-90` konfiguriert.\n\nDie Prüfung beobachtet\
  \ Marker, Dateien und HTTP-Ergebnisse der Host-Gruppe sowie den laufenden Verbraucherzustand; sie belegt die verwendeten\
  \ Wiederherstellungsbefehle nicht."
stages.0.brief: Der verwaltete Marker muss stabil sein.
stages.1.brief: Die Host-Gruppe muss das wiederhergestellte Release einheitlich ausliefern.
stages.2.brief: Der laufende Verbraucher muss dem wiederhergestellten Release entsprechen.
hints.0.text: Stellen Sie jeweils eine Ebene wieder her und überprüfen Sie jedes Live-Ergebnis.
hints.1.text: 'Der Marker, die fleet-Banner und die reader-Umgebung müssen dieselbe Version heißen.


  Prüfen Sie mitgelieferte Definitionen, Ressourcenbeschreibungen und Ereignisse der jeweiligen Phase.


  ```sh

  cat main.tf

  cat rollout.yml

  kubectl describe deployment relay

  ```'
hints.2.text: "Tragen Sie den Marker auf, laden Sie das korrekt konfigurierte fleet neu, reparieren Sie dann das\
  \ Kubernetes reader und warten Sie auf readiness.\n\nPrüfen Sie die reparierte Phase und vergleichen Sie das beobachtete\
  \ Ergebnis.\n\nPhase 1: Der State enthält `local_file.release`, die Workstation-Datei zeigt `release-90` und der\
  \ Plan endet mit Code `0` ohne Änderungen.\n\n```sh\ntofu state list\ncat release.txt\nprintf \"\\n\"\ntofu plan\
  \ -input=false -detailed-exitcode -no-color\n```\n\nPhase 2: Jeder verwaltete Host zeigt `release-90`, Dateimodus\
  \ `644` und HTTP `release-90` auf Port `8080`.\n\n```sh\nfor n in 1 2 3; do\n  host=\"app${n}-${DQ_NAMESPACE#dq-}\"\
  \n  printf \"%s: \" \"$host\"\n  ssh -n -o BatchMode=yes -p 2222 \"root@$host\" 'cat /srv/site/message; stat -c\
  \ %a /srv/site/message'\n  curl -fsS --max-time 3 \"http://$host:8080\"\n  printf \"\\n\"\ndone\n```\n\nPhase\
  \ 3: Der Rollout ist abgeschlossen und der laufende Prozess gibt `release-90` aus.\n\n```sh\nkubectl rollout status\
  \ deployment/relay --timeout=3s\nkubectl exec deployment/relay -- printenv RELEASE\n```"
debrief: Die Prüfungen bestätigten den verwalteten Marker, Flottendateien und Antworten sowie Relay-Rollout und
  Umgebung.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe den workload-Status und seine Bereitschaft nach der Änderung überprüft.
diagnostics.state: Der OpenTofu-State muss local_file.release enthalten.
diagnostics.file: release.txt muss release-90 entsprechen.
diagnostics.plan: Der OpenTofu-Plan muss mit Code 0 enden.
diagnostics.rollout: Der Rollout des Deployment relay muss abgeschlossen sein.
diagnostics.relay: RELEASE des Deployment relay muss release-90 sein.
diagnostics.content_1: Auf app1 muss /srv/site/message genau release-90 enthalten, optional mit einem Zeilenumbruch.
diagnostics.mode_1: Auf app1 muss der Modus von /srv/site/message 644 sein.
diagnostics.http_1: app1 muss auf Port 8080 release-90 liefern.
diagnostics.content_2: Auf app2 muss /srv/site/message genau release-90 enthalten, optional mit einem Zeilenumbruch.
diagnostics.mode_2: Auf app2 muss der Modus von /srv/site/message 644 sein.
diagnostics.http_2: app2 muss auf Port 8080 release-90 liefern.
diagnostics.content_3: Auf app3 muss /srv/site/message genau release-90 enthalten, optional mit einem Zeilenumbruch.
diagnostics.mode_3: Auf app3 muss der Modus von /srv/site/message 644 sein.
diagnostics.http_3: app3 muss auf Port 8080 release-90 liefern.
