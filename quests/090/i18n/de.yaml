diagnostics.relay_publication: |-
  Die Veröffentlichung für relay kann einen alten Datensatz oder eine andere Quelle verwenden. Vergleichen Sie ursprüngliche ConfigMap, Projektion und HTTP-Antwort des worker. [Dokumentation](https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/#add-configmap-data-to-a-volume)
diagnostics.relay_identity: |-
  Prüfen Sie, ob der bereitgestellte HTTP-Worker die projizierte Datei direkt aus seinem ursprünglichen Dokumentenverzeichnis ausliefert. [Dokumentation](https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/#add-configmap-data-to-a-volume)
