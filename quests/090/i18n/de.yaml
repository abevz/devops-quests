title: Notfallwiederherstellung
brief: 'Sie sind dem Betrieb SignalRail beigetreten. Stellen Sie einen verwalteten Marker, den fleet und
  einen ausgefallenen Dienst wieder her. Arbeiten Sie in ~/quest.. Bewahren Sie alle Änderungen in diesem
  Schulungsbereich auf.


  Questdateien in `~/quest` (einige werden in späteren Phasen eingeführt): `inventory.ini`, `ansible.cfg`,
  `main.tf`, `rollout.yml`, `deployment.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur die bereitgestellten Dateien,
  vorinstallierten Bilder und privaten Dienste. Alle Änderungen müssen innerhalb dieser Bucht bleiben.


  Anfängliche Erfolgskriterien: Der verwaltete Release-Marker ist korrekt.'
stages.0.brief: 'Stellen Sie den verwalteten Release-Marker release-90 wieder her.


  Erfolgskriterium: Der verwaltete Release-Marker ist korrekt.'
stages.0.objectives.0.text: Der verwaltete Release-Marker ist korrekt.
stages.1.brief: 'Die Warnung station wurde ausgelöst. Liefern Sie release-90 an den gesamten fleet und
  laden Sie dessen Live-banner neu.


  Erfolgskriterien: Alle drei Live-fleet-Banner zeigen release-90.'
stages.1.objectives.0.text: Alle drei Live-Flottenbanner zeigen release-90.
stages.2.brief: 'Die Veröffentlichung erreichte den station. Es ist ein reader-Vorfall aufgetreten: Reparieren
  Sie die RELEASE-Umgebung.


  Erfolgskriterium: Der Live-reader dient der beabsichtigten Veröffentlichung.'
stages.2.objectives.0.text: Der Live-reader dient der beabsichtigten Veröffentlichung.
hints.0.text: Stellen Sie jeweils eine Ebene wieder her und überprüfen Sie jedes Live-Ergebnis.
hints.1.text: Der Marker, die fleet-Banner und die reader-Umgebung müssen dieselbe Version heißen.
hints.2.text: Tragen Sie den Marker auf, laden Sie das korrekt konfigurierte fleet neu, reparieren Sie
  dann das Kubernetes reader und warten Sie auf readiness.
debrief: State, fleet und reader mussten alle wiederhergestellt werden. Sie haben den verwalteten Marker
  wiederhergestellt, den fleet neu geladen und den endgültigen Live-Marker reader überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe den workload-Status und seine Bereitschaft nach der Änderung überprüft.
