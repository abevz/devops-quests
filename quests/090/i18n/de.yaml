diagnostics.probe_0_0: |-
  Die State-Prüfung lieferte keine Diagnose. Prüfen Sie den State separat aus dem Arbeitsverzeichnis. [Dokumentation](https://opentofu.org/docs/cli/commands/show/#json-output)
diagnostics.checkpoint_binding: |-
  Vergleichen Sie die aktive Bindung mit dem geprüften Checkpoint. Ein neu erzeugter Datensatz kann eine neue Identität haben. [Dokumentation](https://opentofu.org/docs/cli/commands/state/mv/#usage)
diagnostics.handover_state: |-
  Das Ersetzen des aktiven State durch einen alten Checkpoint kann neuere Bindungen verlieren. Vergleichen Sie beide States und ihre Lineage. [Dokumentation](https://opentofu.org/docs/cli/commands/state/mv/#usage)
diagnostics.checkpoint_digest: |-
  Der Checkpoint wurde möglicherweise geändert oder ersetzt. Prüfen Sie die Originalkopie anhand ihrer Prüfsumme. [Dokumentation](https://opentofu.org/docs/cli/commands/state/mv/#usage)
diagnostics.fleet_identity_1: |-
  Die Kopie kann den wiederhergestellten Inhalt oder Modus ausgelassen haben. Vergleichen Sie das Ergebnis auf jedem Host mit dem Übergabeartefakt. [Dokumentation](https://docs.ansible.com/projects/ansible/latest/collections/ansible/builtin/copy_module.html)
diagnostics.fleet_identity_2: |-
  Die Kopie kann den wiederhergestellten Inhalt oder Modus ausgelassen haben. Vergleichen Sie das Ergebnis auf jedem Host mit dem Übergabeartefakt. [Dokumentation](https://docs.ansible.com/projects/ansible/latest/collections/ansible/builtin/copy_module.html)
diagnostics.fleet_identity_3: |-
