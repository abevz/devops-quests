diagnostics.rollout: Die gelieferte Readiness-Bedingung lehnt retired RELEASE ab oder ein anderes Startproblem blockiert den Rollout; aktualisieren Sie die wirksame Umgebung und prüfen Sie Ereignisse. Ein abgeschlossener Rollout allein belegt keine projizierte Wiederherstellungsveröffentlichung. [Ursache und Prüfung](guides#guide=kubernetes-12&section=verified-recovery-relay-readiness)
diagnostics.relay: Lokales Deployment-YAML oder ConfigMap-Daten zu bearbeiten kann den vorhandenen Prozess bei retired RELEASE belassen; gleichen Sie seine tatsächliche Umgebung auf release-90 ab. Die projizierte Recovery-ID zu ändern aktualisiert diese separate Prozessvariable nicht. [Ursache und Prüfung](guides#guide=kubernetes-12&section=verified-recovery-effective-release-value)
diagnostics.relay_publication: Das ursprüngliche ConfigMap enthält möglicherweise noch retired, wurde neu erstellt oder ist nicht mehr mit dem benannten Container bei /run/recovery mit readOnly=true verbunden. Aktualisieren Sie die vorhandene Veröffentlichungsidentität und erhalten Sie diese explizite read-only Projektion vor Prüfung der ausgelieferten Datei. [Ursache und Prüfung](guides#guide=kubernetes-12&section=verified-recovery-original-readonly-projection)
diagnostics.relay_identity: Eine kopierte ID oder ein Ersatz-HTTP-Programm liefert möglicherweise passenden Text, ohne die Projektion auszuliefern; erhalten Sie PID 1 httpd, Dokumentwurzel /tmp/www und dieselbe Datei wie /run/recovery/recovery-id. Projizierter Wert und tatsächliche HTTP-Antwort müssen beide zur wiederhergestellten ID passen; Ausführungs-/Lesefehler melden denselben Marker. [Ursache und Prüfung](guides#guide=kubernetes-12&section=verified-recovery-serve-the-projected-file)
