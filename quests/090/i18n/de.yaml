diagnostics.state: Setup entfernt die verwaltete Dateibindung und release.txt; nur die Bindung wiederherzustellen kann noch keine Datei für den Vergleich der tatsächlichen Datei erzeugen. Stellen Sie aufgezeichnete Bindungen her und wenden Sie die Konfiguration an; Zustands-, Parse- und Dateizielfehler melden denselben Marker. [Ursache und Prüfung](guides#guide=terraform-4&section=verified-recovery-managed-release-file)
diagnostics.probe_0_0: Der frühe Zustandsobserver startet möglicherweise nicht vor einem benannten Ergebnis; prüfen Sie Python-Start und aktuellen Workspace. Gewöhnliche State-Show-, Parse- und fehlende Dateibindungsfehler innerhalb des Observers nutzen bereits state. [Ursache und Prüfung](guides#guide=terraform-4&section=verified-recovery-state-observer-startup)
diagnostics.checkpoint_digest: Der Checkpoint wurde möglicherweise bearbeitet oder direkt durch eine Zustandsverschiebung verändert; erhalten Sie recovery/checkpoint.tfstate unverändert und arbeiten Sie mit einer Kopie. Der maßgebliche Hash ist im Wiederherstellungsvertrag eingefroren, ein neuer Arbeits-Checksum-Beleg erlaubt daher keine geänderten Bytes. [Ursache und Prüfung](guides#guide=terraform-4&section=verified-recovery-protected-checkpoint-bytes)
diagnostics.handover_state: Aktiven Zustand vollständig durch den älteren Checkpoint zu ersetzen kann die neuere Handover-Identität verlieren oder die Lineage ändern; führen Sie nur fehlende Release-Bindungen zusammen und erhalten Sie aktuellen Root-Handover-Datensatz und ursprüngliche Lineage. [Ursache und Prüfung](guides#guide=terraform-4&section=verified-recovery-newer-handover-and-lineage)
diagnostics.checkpoint_binding: Ein frischer Apply kann nach entfernter Bindung eine andere release_record ID erzeugen; stellen Sie den ursprünglichen Root-Datensatz aus dem geprüften Checkpoint wieder her. Der neuere Handover gehört zum aktuellen Zustand und muss die Zusammenführung überstehen. [Ursache und Prüfung](guides#guide=terraform-4&section=verified-recovery-original-release-record)
diagnostics.file: Die Release-Datei bleibt nach Zustandswiederherstellung möglicherweise gelöscht oder enthält einen alten manuellen Wert; wenden Sie die wiederhergestellte Konfiguration für release-90 in release.txt an. Bindungen allein liefern keine fehlenden Plattenbytes. [Ursache und Prüfung](guides#guide=terraform-4&section=verified-recovery-actual-restored-release)
diagnostics.plan: Wiederhergestellter Zustand weicht möglicherweise von der Konfiguration ab oder schlägt Ersatz vor, oder Planung scheitert; prüfen Sie einen frischen detaillierten Plan und verlangen Sie Befehls-Exit 0. Änderungen und Planungsfehler verletzen beide diese Bedingung. [Ursache und Prüfung](guides#guide=terraform-4&section=verified-recovery-converged-recovery-plan)
diagnostics.content_1: 'app1: Das gelieferte Play kopiert möglicherweise noch retired statt des wiederhergestellten Releases oder SSH kann die Nachricht nicht lesen; nutzen Sie recovered-release.json und liefern Sie release-90 ohne oder mit genau einem Zeilenumbruch. [Ursache und Prüfung](guides#guide=ansible-10&section=verified-recovery-app1-content)'
diagnostics.mode_1: 'app1: Wiederherstellungskopien haben möglicherweise unerwünschte Dateirechte hinterlassen oder SSH kann stat nicht ausführen; deklarieren Sie den Mode von /srv/site/message ausdrücklich als 0644. [Ursache und Prüfung](guides#guide=ansible-10&section=verified-recovery-app1-mode)'
diagnostics.fleet_identity_1: 'app1: Die Nachricht kann korrekt sein, während /srv/site/recovery-id fehlt oder aus einer anderen Wiederherstellung stammt; kopieren Sie die wiederhergestellte ID aus dem gelieferten JSON. Verglichen wird mit dem eingefrorenen wiederhergestellten Release, keiner neu erzeugten Identität. [Ursache und Prüfung](guides#guide=ansible-10&section=verified-recovery-app1-identity)'
diagnostics.http_1: 'app1: Der Legacy-Dienst hält möglicherweise nach korrekter Dateikopie seine alte Antwort im Speicher oder HTTP ist unerreichbar; benachrichtigen Sie den Reload-Handler und prüfen Sie release-90 an Port 8080. [Ursache und Prüfung](guides#guide=ansible-10&section=verified-recovery-app1-http)'
