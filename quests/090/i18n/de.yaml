title: Notfallwiederherstellung
brief: 'Sie sind dem Betrieb SignalRail beigetreten. Stellen Sie einen verwalteten Marker, den fleet und einen ausgefallenen
  Dienst wieder her. Arbeiten Sie in ~/quest.. Bewahren Sie alle Änderungen in diesem Schulungsbereich auf.


  Questdateien in `~/quest` (einige werden in späteren Phasen eingeführt): `inventory.ini`, `ansible.cfg`, `main.tf`, `rollout.yml`,
  `deployment.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur die bereitgestellten Dateien, vorinstallierten
  Bilder und privaten Dienste. Alle Änderungen müssen innerhalb dieser Bucht bleiben.


  Anfängliche Erfolgskriterien: Der verwaltete Release-Marker ist korrekt.'
stages.0.brief: 'Lies `main.tf` in `~/quest`: Es deklariert den lokalen Offline-Provider und `local_file.release`. Initialisiere
  und wende den Marker an. Prüfe, dass `tofu state list` `local_file.release` enthält, `release.txt` `release-90` enthält
  und `tofu plan -input=false -detailed-exitcode -no-color` mit Code 0 endet (keine Änderungen). Die verlinkte Anleitung führt
  in den OpenTofu-Zustand ein. Arbeite nur in der Übungsumgebung.'
stages.0.objectives.0.text: Zustandsadresse und Release-Datei stimmen, und der Plan endet mit Code 0.
stages.1.brief: Lies `inventory.ini`, `ansible.cfg` und `rollout.yml` in `~/quest`. Ansible sendet Aufgaben über SSH an jeden
  Host der privaten Flotte. Schreibe `release-90` nach `/srv/site/message` mit Modus `0644` auf app1, app2 und app3. Nutze
  den bereitgestellten Handler mit `dq-service reload`, damit der Dienst die Datei neu liest; führe `ansible-playbook rollout.yml`
  aus. Prüfe, dass die HTTP-Antwort jedes Hosts auf Port 8080 `release-90` ist. Die Prüfungen beobachten Dateien, Modi und
  Antworten; sie beweisen nicht die verwendeten Befehle. Die Nachrichtendatei muss genau diesen Text enthalten, optional gefolgt
  von einem Zeilenumbruch.
stages.1.objectives.0.text: Dateien, Modi und HTTP-Antworten aller drei Flotten-Hosts entsprechen `release-90`.
stages.2.brief: Repariere den Kubernetes-Reader anhand von `deployment.json`. Setze `RELEASE` in `deployment/relay` auf `release-90`
  und warte auf den Rollout. Die Prüfung liest die Umgebung des laufenden Prozesses und den Rollout-Status; sie prüft nicht,
  was der Reader ausliefert.
stages.2.objectives.0.text: Der Relay-Rollout ist abgeschlossen und sein laufender Prozess hat `RELEASE=release-90`.
hints.0.text: Stellen Sie jeweils eine Ebene wieder her und überprüfen Sie jedes Live-Ergebnis.
hints.1.text: Der Marker, die fleet-Banner und die reader-Umgebung müssen dieselbe Version heißen.
hints.2.text: Tragen Sie den Marker auf, laden Sie das korrekt konfigurierte fleet neu, reparieren Sie dann das Kubernetes
  reader und warten Sie auf readiness.
debrief: Die Prüfungen bestätigten den verwalteten Marker, Flottendateien und Antworten sowie Relay-Rollout und Umgebung.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe den workload-Status und seine Bereitschaft nach der Änderung überprüft.
diagnostics.state: Der OpenTofu-State muss local_file.release enthalten.
diagnostics.file: release.txt muss release-90 entsprechen.
diagnostics.plan: Der OpenTofu-Plan muss mit Code 0 enden.
diagnostics.rollout: Der Rollout des Deployment relay muss abgeschlossen sein.
diagnostics.relay: RELEASE des Deployment relay muss release-90 sein.
diagnostics.content_1: Auf app1 muss /srv/site/message genau release-90 enthalten, optional mit einem Zeilenumbruch.
diagnostics.mode_1: Auf app1 muss der Modus von /srv/site/message 644 sein.
diagnostics.http_1: app1 muss auf Port 8080 release-90 liefern.
diagnostics.content_2: Auf app2 muss /srv/site/message genau release-90 enthalten, optional mit einem Zeilenumbruch.
diagnostics.mode_2: Auf app2 muss der Modus von /srv/site/message 644 sein.
diagnostics.http_2: app2 muss auf Port 8080 release-90 liefern.
diagnostics.content_3: Auf app3 muss /srv/site/message genau release-90 enthalten, optional mit einem Zeilenumbruch.
diagnostics.mode_3: Auf app3 muss der Modus von /srv/site/message 644 sein.
diagnostics.http_3: app3 muss auf Port 8080 release-90 liefern.
