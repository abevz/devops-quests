title: Notfallwiederherstellung
brief: |-
  Der Release-Datensatz fehlt im aktiven State. Stellen Sie das geprüfte Release wieder her, erhalten Sie die neueren Übergabedaten und stellen Sie dann Fleet und relay wieder her.

  Arbeiten Sie auf der Workstation in `~/quest`. Phase 1 verwendet `main.tf`, `incident.auto.tfvars.json` und `recovery/`. Phase 2 verwendet `rollout.yml`, `inventory.ini`, `ansible.cfg` und `recovered-release.json`. Phase 3 verwendet `deployment.yaml`, `relay-publication.yaml` und `relay-handover-id`.

  **Requirements:**

  - OpenTofu verwaltet das Release-Artefakt im State und stellt den Release-Datensatz mit seiner Identität aus dem geprüften Checkpoint wieder her. Erhalten Sie Inhalt des Checkpoints, die aktive State-Lineage und den neueren Übergabedatensatz.
  - Auf der Workstation enthält `~/quest/release.txt` den Wert `release-90`.
  - OpenTofu plant keine Änderungen und endet mit Code `0`.
  - Auf `app1`, `app2` und `app3` enthält `/srv/site/message` den Wert `release-90` mit Modus `0644`. `/srv/site/recovery-id` entspricht der Wiederherstellungs-ID aus `recovered-release.json`.
  - HTTP auf Port `8080` liefert `release-90` von jedem verwalteten Host (`app1`, `app2`, `app3`).
  - Deployment `relay` schließt den Rollout ab und worker verwendet `release-90` in `RELEASE`. Erhalten Sie die bereitgestellte ConfigMap und die schreibgeschützte Projektion unter `/run/recovery`. Behalten Sie den bereitgestellten HTTP-Worker und sein Dokumentenverzeichnis bei. Liefern Sie die projizierte Datei mit der ID aus `relay-handover-id` unter `http://127.0.0.1:8080/recovery-id`.

  Die Prüfung belegt anhand der erfassten IDs lediglich den erreichten Zustand und das beobachtete Verhalten. Sie wählen die Befehle für die Wiederherstellung.
stages.0.brief: Der verwaltete Marker muss stabil sein.
stages.1.brief: Die Host-Gruppe muss das wiederhergestellte Release einheitlich ausliefern.
stages.2.brief: Der laufende Verbraucher muss dem wiederhergestellten Release entsprechen.
hints.0.text: |-
  Vergleichen Sie den Checkpoint mit dem aktiven State. Die wiederhergestellte Identität muss alle nachgelagerten Schichten erreichen.
hints.1.text: |-
  Prüfen Sie Lineage und Ressourcenidentitäten in beiden State-Dateien. Verfolgen Sie die aufgezeichnete Identität durch das Fleet-Artefakt und die Kubernetes-Veröffentlichung.

  ```sh
  (cd recovery && sha256sum -c checkpoint.sha256)
  jq '{lineage,serial,resources:[.resources[] | {type,name,ids:[.instances[].attributes.id]}]}' terraform.tfstate recovery/checkpoint.tfstate
  ```

  ```sh
  cat recovered-release.json rollout.yml
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    curl -fsS --max-time 3 "http://$host:8080/"
  done
  ```

  ```sh
  cat relay-publication.yaml relay-handover-id
  kubectl get deployment relay -o yaml
  kubectl get configmap -o yaml
  ```
hints.2.text: |-
  Verwenden Sie eine Kopie des geprüften Checkpoints. Stellen Sie fehlende Bindungen wieder her und erhalten Sie den neueren Übergabedatensatz. Prüfen Sie Dateien, HTTP-Antworten und die Projektion der ursprünglichen ConfigMap am laufenden worker.

  ```sh
  (cd recovery && sha256sum -c checkpoint.sha256)
  tofu state list
  tofu output -raw recovery_id
  printf '\n'
  cat release.txt
  tofu plan -input=false -detailed-exitcode -no-color
  ```

  ```sh
  jq -r .recovery_id recovered-release.json
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    ssh -n -o BatchMode=yes -p 2222 "root@$host" 'cat /srv/site/message; stat -c %a /srv/site/message; cat /srv/site/recovery-id'
    curl -fsS --max-time 3 "http://$host:8080/"
    printf '\n'
  done
  ```

  ```sh
  kubectl get configmap relay-recovery -o yaml
  kubectl rollout status deployment/relay --timeout=3s
  kubectl exec deployment/relay -c worker -- printenv RELEASE
  kubectl exec deployment/relay -c worker -- wget -qO- -T 3 http://127.0.0.1:8080/recovery-id
  cat relay-handover-id
  ```
debrief: |-
  Gezielte Wiederherstellung erhält die neuere Bindung und gewinnt die Release-Identität aus dem Checkpoint zurück. Hostdateien und Live-HTTP zeigen verschiedene Teile der Verteilung. Die Projektion überträgt die Identität an relay.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe den workload-Status und seine Bereitschaft nach der Änderung überprüft.
