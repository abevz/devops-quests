id: 81
title: title
track: OpenTofu
difficulty: expert
brief: brief
stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    check: "set -euo pipefail\ncd ~/quest\nfailed=0\nif ! tofu state list 2>/dev/null | grep -Fx local_file.release >/dev/null; then\n  printf '%s\\n' 'tofu state list: local_file.release missing: ✗ [DQ:state]'; failed=1\nfi\nif ! test \"$(cat release.txt 2>/dev/null)\" = release-81; then\n  printf '%s\\n' 'release.txt = release-81: ✗ [DQ:file]'; failed=1\nfi\nif ! tofu plan -input=false -detailed-exitcode -no-color >/dev/null 2>&1; then\n  printf '%s\\n' 'tofu plan exits 0: ✗ [DQ:plan]'; failed=1\nfi\nexit \"$failed\"\n"
- brief: stages.1.brief
  objectives:
  - text: stages.1.objectives.0.text
    check: "set -euo pipefail\ncd ~/quest\nfailed=0\nfor n in 1 2 3; do\n  host=\"app${n}-${DQ_NAMESPACE#dq-}\"\n  result=$(timeout 4s ssh -n -o BatchMode=yes -o ConnectTimeout=3 -p 2222 \"root@$host\" 'actual=$(sha256sum /srv/site/message 2>/dev/null | cut -d \" \" -f 1); if test \"$actual\" = 679654d8c0b2d19d0c05fa59f6830658bb6dcbf0e0872a66360ad0b032813982 || test \"$actual\" = facfe2047ac974e0f4348307cc1a8a543df489b6c451b5fbb3de2d546a89f0cb; then printf \"content-ok\\n\"; fi; if test \"$(stat -c %a /srv/site/message 2>/dev/null)\" = 644; then printf \"mode-ok\\n\"; fi' 2>/dev/null || true)\n  if ! grep -Fxq content-ok <<<\"$result\"; then\n    printf '%s\\n' \"$host /srv/site/message = release-81: ✗ [DQ:content_$n]\"; failed=1\n  fi\n  if ! grep -Fxq mode-ok <<<\"$result\"; then\n    printf '%s\\n' \"$host /srv/site/message mode = 644: ✗ [DQ:mode_$n]\"; failed=1\n  fi\n  if ! test \"$(curl -fsS --max-time 3 \"http://$host:8080\" 2>/dev/null)\" = release-81; then\n    printf '%s\\n' \"$host:8080 = release-81: ✗ [DQ:http_$n]\"; failed=1\n  fi\ndone\nexit \"$failed\"\n"
- brief: stages.2.brief
  objectives:
  - text: stages.2.objectives.0.text
    check: "set -euo pipefail\ncd ~/quest\nfailed=0\nif ! kubectl rollout status deployment/relay --timeout=3s >/dev/null 2>&1; then\n  printf '%s\\n' 'deployment/relay rollout complete: ✗ [DQ:rollout]'; failed=1\nfi\nif ! test \"$(timeout 4s kubectl exec --pod-running-timeout=2s deployment/relay -- printenv RELEASE 2>/dev/null)\" = release-81; then\n  printf '%s\\n' 'deployment/relay RELEASE = release-81: ✗ [DQ:relay]'; failed=1\nfi\nexit \"$failed\"\n"
