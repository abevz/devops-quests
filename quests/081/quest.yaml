id: 81
title: title
track: OpenTofu
difficulty: expert
brief: brief
stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    check: |-
      dq_probe_output=$(mktemp)
      trap 'rm -f "$dq_probe_output"' EXIT
      set +e
      (
      set -euo pipefail
      python3 -I - <<'DQ_PROPERTY'
      import json
      import os
      import stat
      import sys
      from pathlib import Path


      from dq_check import read_json


      from dq_check import resource_records


      from dq_check import same_target


      from dq_check import file_resources


      from dq_check import number_is

      import subprocess

      from dq_check import tofu_json

      matched = file_resources(resource_records(tofu_json("show", "-json")), 'release.txt', in_module=False)
      if not matched:
          print("Managed producer file is missing: ✗ [DQ:state]")
          sys.exit(1)
      DQ_PROPERTY
      python3 -I - <<'DQ_DELIVERY_PRODUCER'
      import json,os,subprocess,sys,tempfile
      from pathlib import Path
      from dq_check import resource_records,file_resources,tofu_json

      def expected(release,identity):
          return {'release':release,'producer_id':identity,'targets':{host:{'target':host,'release':release,'producer_id':identity} for host in ['app1','app2','app3']}}
      def current():
          identity=json.loads(Path('/run/dq/facts/0/producer-identity.json').read_text())
          assert isinstance(identity,str) and identity
          document=tofu_json('show','-json');records=resource_records(document)
          producers=[r for _,r in records if r.get('mode')=='managed' and r.get('address')=='terraform_data.producer']
          assert len(producers)==1 and producers[0]['values']['id']==identity
          files=file_resources(records,'release.txt',in_module=False)
          assert len(files)==1 and files[0][1]['values']['content'].strip()=='release-81'
          contract=tofu_json('output','-json','delivery');assert contract==expected('release-81',identity)
          return contract

      def receipts(contract):
          suffix=os.environ['DQ_NAMESPACE'].removeprefix('dq-')
          for host,entry in contract['targets'].items():
              result=subprocess.run(['ssh','-n','-o','BatchMode=yes','-o','ConnectTimeout=3','-p','2222','root@'+host+'-'+suffix,'cat /srv/site/delivery.json; printf "\\n"; stat -c %a /srv/site/delivery.json'],capture_output=True,text=True,timeout=5)
              assert result.returncode==0
              content,mode=result.stdout.rstrip('\n').rsplit('\n',1)
              assert mode=='644' and json.loads(content)==entry

      try:
          contract=current()
          identity=contract['producer_id']
          schema=json.loads(Path('/run/dq/facts/0/delivery-schema.json').read_text())
          for release in schema['input_cases']:
              with tempfile.TemporaryDirectory(prefix='dq-delivery-') as directory:
                  saved=str(Path(directory)/'input.plan')
                  subprocess.run(['tofu','plan','-input=false','-no-color','-var','release='+release,'-out='+saved],check=True,capture_output=True,timeout=30)
                  plan=tofu_json('show','-json',saved)
                  assert plan['planned_values']['outputs']['delivery']['value']==expected(release,identity)
                  records=resource_records(plan,'planned_values')
                  files=file_resources(records,'release.txt',in_module=False)
                  assert len(files)==1 and files[0][1]['values']['content'].strip()==release
                  identities=[r for _,r in records if r.get('address')=='terraform_data.producer']
                  assert len(identities)==1 and identities[0]['values']['id']==identity
      except (AssertionError,KeyError,ValueError,TypeError,AttributeError,OSError,subprocess.SubprocessError):
          print('The delivery contract must follow caller input and retain the recorded producer identity: ✗ [DQ:delivery_producer]')
          sys.exit(1)
      DQ_DELIVERY_PRODUCER
      ) >"$dq_probe_output" 2>/dev/null
      dq_probe_status=$?
      set -e
      cat "$dq_probe_output"
      if [ "$dq_probe_status" -ne 0 ] && ! grep -Eq '\[DQ:[a-z0-9_]+\]' "$dq_probe_output"; then
      printf '%s\n' 'Current inputs could not verify this objective: ✗ [DQ:probe_0_0]'
      fi
      rm -f "$dq_probe_output"
      trap - EXIT
      test "$dq_probe_status" -eq 0
  - text: stages.0.objectives.1.text
    check: |-
      failed=0
      if ! test "$(cat release.txt 2>/dev/null)" = release-81; then
        printf '%s\n' 'release.txt = release-81: ✗ [DQ:file]'; failed=1
      fi
      exit "$failed"
    keep: true
  - text: stages.0.objectives.2.text
    check: |-
      failed=0
      if ! tofu plan -input=false -detailed-exitcode -no-color >/dev/null 2>&1; then
        printf '%s\n' 'tofu plan exits 0: ✗ [DQ:plan]'; failed=1
      fi
      exit "$failed"
    keep: true
- brief: stages.1.brief
  objectives:
  - text: stages.1.objectives.0.text
    check: |-
      dq_probe_output=$(mktemp)
      trap 'rm -f "$dq_probe_output"' EXIT
      set +e
      (
      set -euo pipefail
      failed=0
      for n in 1 2 3; do
        host="app${n}-${DQ_NAMESPACE#dq-}"
        result=$(timeout 4s ssh -n -o BatchMode=yes -o ConnectTimeout=3 -p 2222 "root@$host" 'actual=$(sha256sum /srv/site/message 2>/dev/null | cut -d " " -f 1); if test "$actual" = 679654d8c0b2d19d0c05fa59f6830658bb6dcbf0e0872a66360ad0b032813982 || test "$actual" = facfe2047ac974e0f4348307cc1a8a543df489b6c451b5fbb3de2d546a89f0cb; then printf "content-ok\n"; fi; if test "$(stat -c %a /srv/site/message 2>/dev/null)" = 644; then printf "mode-ok\n"; fi' 2>/dev/null || true)
        if ! grep -Fxq content-ok <<<"$result"; then
          printf '%s\n' "$host /srv/site/message = release-81: ✗ [DQ:content_$n]"; failed=1
        fi
        if ! grep -Fxq mode-ok <<<"$result"; then
          printf '%s\n' "$host /srv/site/message mode = 644: ✗ [DQ:mode_$n]"; failed=1
        fi
      done
      test "$failed" -eq 0
      python3 -I - <<'DQ_DELIVERY_FLEET'
      import json,os,subprocess,sys,tempfile
      from pathlib import Path
      from dq_check import resource_records,file_resources,tofu_json

      def expected(release,identity):
          return {'release':release,'producer_id':identity,'targets':{host:{'target':host,'release':release,'producer_id':identity} for host in ['app1','app2','app3']}}
      def current():
          identity=json.loads(Path('/run/dq/facts/0/producer-identity.json').read_text())
          assert isinstance(identity,str) and identity
          document=tofu_json('show','-json');records=resource_records(document)
          producers=[r for _,r in records if r.get('mode')=='managed' and r.get('address')=='terraform_data.producer']
          assert len(producers)==1 and producers[0]['values']['id']==identity
          files=file_resources(records,'release.txt',in_module=False)
          assert len(files)==1 and files[0][1]['values']['content'].strip()=='release-81'
          contract=tofu_json('output','-json','delivery');assert contract==expected('release-81',identity)
          return contract

      def receipts(contract):
          suffix=os.environ['DQ_NAMESPACE'].removeprefix('dq-')
          for host,entry in contract['targets'].items():
              result=subprocess.run(['ssh','-n','-o','BatchMode=yes','-o','ConnectTimeout=3','-p','2222','root@'+host+'-'+suffix,'cat /srv/site/delivery.json; printf "\\n"; stat -c %a /srv/site/delivery.json'],capture_output=True,text=True,timeout=5)
              assert result.returncode==0
              content,mode=result.stdout.rstrip('\n').rsplit('\n',1)
              assert mode=='644' and json.loads(content)==entry

      try:
          contract=current()
          receipts(contract)
      except (AssertionError,KeyError,ValueError,TypeError,AttributeError,OSError,subprocess.SubprocessError):
          print('Every target receipt must contain its current producer contract with mode 0644: ✗ [DQ:delivery_fleet]')
          sys.exit(1)
      DQ_DELIVERY_FLEET
      ) >"$dq_probe_output" 2>/dev/null
      dq_probe_status=$?
      set -e
      cat "$dq_probe_output"
      if [ "$dq_probe_status" -ne 0 ] && ! grep -Eq '\[DQ:[a-z0-9_]+\]' "$dq_probe_output"; then
      printf '%s\n' 'Current inputs could not verify this objective: ✗ [DQ:probe_1_0]'
      fi
      rm -f "$dq_probe_output"
      trap - EXIT
      test "$dq_probe_status" -eq 0
  - text: stages.1.objectives.1.text
    check: |-
      failed=0
      for n in 1 2 3; do
        host="app${n}-${DQ_NAMESPACE#dq-}"
        if ! test "$(curl -fsS --max-time 3 "http://$host:8080" 2>/dev/null)" = release-81; then
          printf '%s\n' "$host:8080 = release-81: ✗ [DQ:http_$n]"; failed=1
        fi
      done
      exit "$failed"
- brief: stages.2.brief
  objectives:
  - text: stages.2.objectives.0.text
    check: |-
      dq_probe_output=$(mktemp)
      trap 'rm -f "$dq_probe_output"' EXIT
      set +e
      (
      set -euo pipefail
      failed=0
      if ! kubectl rollout status deployment/relay --timeout=3s >/dev/null 2>&1; then
        printf '%s\n' 'deployment/relay rollout complete: ✗ [DQ:rollout]'; failed=1
      fi
      test "$failed" -eq 0
      python3 -I - <<'DQ_DELIVERY_RELAY'
      import json,os,subprocess,sys,tempfile
      from pathlib import Path
      from dq_check import resource_records,file_resources,tofu_json

      def expected(release,identity):
          return {'release':release,'producer_id':identity,'targets':{host:{'target':host,'release':release,'producer_id':identity} for host in ['app1','app2','app3']}}
      def current():
          identity=json.loads(Path('/run/dq/facts/0/producer-identity.json').read_text())
          assert isinstance(identity,str) and identity
          document=tofu_json('show','-json');records=resource_records(document)
          producers=[r for _,r in records if r.get('mode')=='managed' and r.get('address')=='terraform_data.producer']
          assert len(producers)==1 and producers[0]['values']['id']==identity
          files=file_resources(records,'release.txt',in_module=False)
          assert len(files)==1 and files[0][1]['values']['content'].strip()=='release-81'
          contract=tofu_json('output','-json','delivery');assert contract==expected('release-81',identity)
          return contract

      def receipts(contract):
          suffix=os.environ['DQ_NAMESPACE'].removeprefix('dq-')
          for host,entry in contract['targets'].items():
              result=subprocess.run(['ssh','-n','-o','BatchMode=yes','-o','ConnectTimeout=3','-p','2222','root@'+host+'-'+suffix,'cat /srv/site/delivery.json; printf "\\n"; stat -c %a /srv/site/delivery.json'],capture_output=True,text=True,timeout=5)
              assert result.returncode==0
              content,mode=result.stdout.rstrip('\n').rsplit('\n',1)
              assert mode=='644' and json.loads(content)==entry

      try:
          contract=current()
          receipts(contract)
          subprocess.run(['tofu','plan','-input=false','-detailed-exitcode','-no-color'],capture_output=True,check=True,timeout=30)
          value=subprocess.run(['kubectl','exec','--pod-running-timeout=5s','deployment/relay','-c','worker','--','printenv','DELIVERY_CONTRACT'],capture_output=True,text=True,check=True,timeout=10)
          assert json.loads(value.stdout)==contract
      except (AssertionError,KeyError,ValueError,TypeError,AttributeError,OSError,subprocess.SubprocessError):
          print('The running relay must carry the current producer contract and the fleet must retain the same delivery: ✗ [DQ:delivery_relay]')
          sys.exit(1)
      DQ_DELIVERY_RELAY
      ) >"$dq_probe_output" 2>/dev/null
      dq_probe_status=$?
      set -e
      cat "$dq_probe_output"
      if [ "$dq_probe_status" -ne 0 ] && ! grep -Eq '\[DQ:[a-z0-9_]+\]' "$dq_probe_output"; then
      printf '%s\n' 'Current inputs could not verify this objective: ✗ [DQ:probe_2_0]'
      fi
      rm -f "$dq_probe_output"
      trap - EXIT
      test "$dq_probe_status" -eq 0
  - text: stages.2.objectives.1.text
    check: |-
      failed=0
      if ! test "$(timeout 4s kubectl exec --pod-running-timeout=2s deployment/relay -c worker -- printenv RELEASE 2>/dev/null)" = release-81; then
        printf '%s\n' 'deployment/relay RELEASE = release-81: ✗ [DQ:relay]'; failed=1
      fi
      exit "$failed"
