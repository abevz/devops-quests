id: 81
title: title
track: OpenTofu
difficulty: expert
brief: brief
stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    check: |-
      python3 -I - <<'DQ_PROPERTY'
      import json
      import os
      import stat
      import sys
      from pathlib import Path


      def read_json(path, successful=True):
          if not successful:
              return None
          try:
              return json.loads(Path(path).read_text())
          except (OSError, ValueError):
              return None


      def resource_records(document, section='values'):
          if not isinstance(document, dict):
              return []
          values = document.get(section)
          root = values.get('root_module') if isinstance(values, dict) else None
          if not isinstance(root, dict):
              return []
          records = []
          pending = [root]
          while pending:
              module = pending.pop()
              resources = module.get('resources') or []
              children = module.get('child_modules') or []
              if not isinstance(resources, list) or not isinstance(children, list):
                  return []
              for resource in resources:
                  if not isinstance(resource, dict):
                      return []
                  records.append((module.get('address'), resource))
              if not all(isinstance(child, dict) for child in children):
                  return []
              pending.extend(children)
          return records


      def same_target(value, expected, existing=False):
          if not isinstance(value, str) or not value:
              return False
          try:
              expanded = os.path.expanduser(value)
              parent, leaf = os.path.split(expanded)
              if leaf in ('', '.', '..'):
                  return False
              # Validate raw traversal before pathlib normalizes it: file/.. and
              # absent/../file are not usable aliases of an existing file.
              if not stat.S_ISDIR(os.stat(parent or '.').st_mode):
                  return False
              target = Path(expected)
              if existing or target.exists():
                  if not stat.S_ISREG(os.stat(expanded).st_mode):
                      return False
                  return Path(expanded).resolve(strict=True) == target.resolve(strict=True)
              candidate = Path(parent or '.').resolve(strict=True) / leaf
              return candidate == target.parent.resolve(strict=True) / target.name
          except (OSError, RuntimeError, ValueError):
              return False


      def file_resources(records, filename, in_module=False):
          found = []
          for module, resource in records:
              values = resource.get('values')
              if (resource.get('mode') == 'managed' and resource.get('type') == 'local_file'
                      and isinstance(values, dict) and same_target(values.get('filename'), filename)
                      and (not in_module or isinstance(module, str) and bool(module))):
                  found.append((module, resource))
          return found


      def number_is(value, expected):
          return type(value) in (int, float) and value == expected

      import subprocess

      def tofu_json(*arguments):
          result = subprocess.run(['tofu', *arguments], capture_output=True, text=True)
          if result.returncode != 0:
              return None
          try:
              return json.loads(result.stdout)
          except ValueError:
              return None

      matched = file_resources(resource_records(tofu_json("show", "-json")), 'release.txt', in_module=False)
      if not matched:
          print("Managed producer file is missing: ✗ [DQ:state]")
          sys.exit(1)
      DQ_PROPERTY
  - text: stages.0.objectives.1.text
    check: |-
      failed=0
      if ! test "$(cat release.txt 2>/dev/null)" = release-81; then
        printf '%s\n' 'release.txt = release-81: ✗ [DQ:file]'; failed=1
      fi
      exit "$failed"
  - text: stages.0.objectives.2.text
    check: |-
      failed=0
      if ! tofu plan -input=false -detailed-exitcode -no-color >/dev/null 2>&1; then
        printf '%s\n' 'tofu plan exits 0: ✗ [DQ:plan]'; failed=1
      fi
      exit "$failed"
- brief: stages.1.brief
  objectives:
  - text: stages.1.objectives.0.text
    check: |-
      failed=0
      for n in 1 2 3; do
        host="app${n}-${DQ_NAMESPACE#dq-}"
        result=$(timeout 4s ssh -n -o BatchMode=yes -o ConnectTimeout=3 -p 2222 "root@$host" 'actual=$(sha256sum /srv/site/message 2>/dev/null | cut -d " " -f 1); if test "$actual" = 679654d8c0b2d19d0c05fa59f6830658bb6dcbf0e0872a66360ad0b032813982 || test "$actual" = facfe2047ac974e0f4348307cc1a8a543df489b6c451b5fbb3de2d546a89f0cb; then printf "content-ok\n"; fi; if test "$(stat -c %a /srv/site/message 2>/dev/null)" = 644; then printf "mode-ok\n"; fi' 2>/dev/null || true)
        if ! grep -Fxq content-ok <<<"$result"; then
          printf '%s\n' "$host /srv/site/message = release-81: ✗ [DQ:content_$n]"; failed=1
        fi
        if ! grep -Fxq mode-ok <<<"$result"; then
          printf '%s\n' "$host /srv/site/message mode = 644: ✗ [DQ:mode_$n]"; failed=1
        fi
      done
      exit "$failed"
  - text: stages.1.objectives.1.text
    check: |-
      failed=0
      for n in 1 2 3; do
        host="app${n}-${DQ_NAMESPACE#dq-}"
        if ! test "$(curl -fsS --max-time 3 "http://$host:8080" 2>/dev/null)" = release-81; then
          printf '%s\n' "$host:8080 = release-81: ✗ [DQ:http_$n]"; failed=1
        fi
      done
      exit "$failed"
- brief: stages.2.brief
  objectives:
  - text: stages.2.objectives.0.text
    check: |-
      failed=0
      if ! kubectl rollout status deployment/relay --timeout=3s >/dev/null 2>&1; then
        printf '%s\n' 'deployment/relay rollout complete: ✗ [DQ:rollout]'; failed=1
      fi
      exit "$failed"
  - text: stages.2.objectives.1.text
    check: |-
      failed=0
      if ! test "$(timeout 4s kubectl exec --pod-running-timeout=2s deployment/relay -c worker -- printenv RELEASE 2>/dev/null)" = release-81; then
        printf '%s\n' 'deployment/relay RELEASE = release-81: ✗ [DQ:relay]'; failed=1
      fi
      exit "$failed"
