id: 81
title: title
track: OpenTofu
difficulty: expert
brief: brief
stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    check: |-
      dq_probe_output=$(mktemp)
      trap 'rm -f "$dq_probe_output"' EXIT
      set +e
      (
      set -euo pipefail
      python3 -I - <<'DQ_PROPERTY'
      import json
      import os
      import stat
      import sys
      from pathlib import Path


      from dq_check import read_json


      from dq_check import resource_records


      from dq_check import same_target


      from dq_check import file_resources


      from dq_check import number_is

      import subprocess

      from dq_check import tofu_json

      matched = file_resources(resource_records(tofu_json("show", "-json")), 'release.txt', in_module=False)
      if not matched:
          print("Managed producer file is missing: ✗ [DQ:state]")
          sys.exit(1)
      DQ_PROPERTY
      ) >"$dq_probe_output" 2>/dev/null
      dq_probe_status=$?
      set -e
      cat "$dq_probe_output"
      if [ "$dq_probe_status" -ne 0 ] && ! grep -Eq '\[DQ:[a-z0-9_]+\]' "$dq_probe_output"; then
      printf '%s\n' 'Current inputs could not verify this objective: ✗ [DQ:probe_0_0]'
      fi
      rm -f "$dq_probe_output"
      trap - EXIT
      test "$dq_probe_status" -eq 0
  - text: stages.0.objectives.1.text
    check: |-
      failed=0
      if ! test "$(cat release.txt 2>/dev/null)" = release-81; then
        printf '%s\n' 'release.txt = release-81: ✗ [DQ:file]'; failed=1
      fi
      exit "$failed"
  - text: stages.0.objectives.2.text
    check: |-
      failed=0
      if ! tofu plan -input=false -detailed-exitcode -no-color >/dev/null 2>&1; then
        printf '%s\n' 'tofu plan exits 0: ✗ [DQ:plan]'; failed=1
      fi
      exit "$failed"
- brief: stages.1.brief
  objectives:
  - text: stages.1.objectives.0.text
    check: |-
      failed=0
      for n in 1 2 3; do
        host="app${n}-${DQ_NAMESPACE#dq-}"
        result=$(timeout 4s ssh -n -o BatchMode=yes -o ConnectTimeout=3 -p 2222 "root@$host" 'actual=$(sha256sum /srv/site/message 2>/dev/null | cut -d " " -f 1); if test "$actual" = 679654d8c0b2d19d0c05fa59f6830658bb6dcbf0e0872a66360ad0b032813982 || test "$actual" = facfe2047ac974e0f4348307cc1a8a543df489b6c451b5fbb3de2d546a89f0cb; then printf "content-ok\n"; fi; if test "$(stat -c %a /srv/site/message 2>/dev/null)" = 644; then printf "mode-ok\n"; fi' 2>/dev/null || true)
        if ! grep -Fxq content-ok <<<"$result"; then
          printf '%s\n' "$host /srv/site/message = release-81: ✗ [DQ:content_$n]"; failed=1
        fi
        if ! grep -Fxq mode-ok <<<"$result"; then
          printf '%s\n' "$host /srv/site/message mode = 644: ✗ [DQ:mode_$n]"; failed=1
        fi
      done
      exit "$failed"
  - text: stages.1.objectives.1.text
    check: |-
      failed=0
      for n in 1 2 3; do
        host="app${n}-${DQ_NAMESPACE#dq-}"
        if ! test "$(curl -fsS --max-time 3 "http://$host:8080" 2>/dev/null)" = release-81; then
          printf '%s\n' "$host:8080 = release-81: ✗ [DQ:http_$n]"; failed=1
        fi
      done
      exit "$failed"
- brief: stages.2.brief
  objectives:
  - text: stages.2.objectives.0.text
    check: |-
      failed=0
      if ! kubectl rollout status deployment/relay --timeout=3s >/dev/null 2>&1; then
        printf '%s\n' 'deployment/relay rollout complete: ✗ [DQ:rollout]'; failed=1
      fi
      exit "$failed"
  - text: stages.2.objectives.1.text
    check: |-
      failed=0
      if ! test "$(timeout 4s kubectl exec --pod-running-timeout=2s deployment/relay -c worker -- printenv RELEASE 2>/dev/null)" = release-81; then
        printf '%s\n' 'deployment/relay RELEASE = release-81: ✗ [DQ:relay]'; failed=1
      fi
      exit "$failed"
hints:
- text: hints.0.text
  guide: terraform-3
- text: hints.1.text
  guide: terraform-3
- text: hints.2.text
  guide: terraform-3
debrief: debrief
phrases:
- phrases.0
- phrases.1
- phrases.2
questions: []
facts:
  environment:
  - DQ_NAMESPACE
  - DQ_APP_IMAGE
  - KUBECONFIG
  - TF_CLI_CONFIG_FILE
  - DOCKER_HOST
  - DOCKER_TLS_VERIFY
  - DOCKER_CERT_PATH
  files:
  - inventory.ini
  - ansible.cfg
  - main.tf
  - rollout.yml
  - deployment.yaml
  services: []
