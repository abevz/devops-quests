title: Доставка через несколько систем
brief: |-
  Маркер релиза существует, но его контракт доставки ещё не согласован между потребителями.

  Работайте на workstation в `~/quest` с `main.tf`, `modules/delivery/main.tf`, `delivery-schema.json`, `inventory.ini` и `ansible.cfg`. На следующих этапах появятся `rollout.yml` и `deployment.yaml`.

  **Требования:**
  - Корневой output `delivery` соответствует поставляемой схеме для каждого описанного варианта входных данных и сохраняет записанную идентичность производителя. Настроенный файл производителя остаётся управляемым ресурсом в корне state OpenTofu.
  - На workstation файл `~/quest/release.txt` содержит `release-81`; итоговый detailed plan завершается с кодом `0`.
  - На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/message` содержит ровно `release-81`, возможно с одним переводом строки, и имеет режим `0644`. HTTP на порту `8080` по пути `/` возвращает `release-81`.
  - На каждом управляемом хосте файл `/srv/site/delivery.json` имеет режим `0644` и соответствует записи этого получателя в текущем контракте производителя, включая записанную идентичность производителя.
  - Deployment `relay` завершает rollout в namespace стенда. В его работающем контейнере `worker` значение `RELEASE` равно `release-81`, а `DELIVERY_CONTRACT` соответствует текущему структурированному контракту производителя. К завершению контракты производителя и хостов по-прежнему согласованы.

  Проверки наблюдают текущие state, файлы, HTTP, rollout и окружение процесса; совпадение данных доставки не доказывает историю команд или содержимое, обслуживаемое последним контейнером.
stages.0.brief: Корневой производитель публикует текущий контракт с сохранением записанной идентичности.
stages.1.brief: Каждый хост должен получить свой текущий контракт и обслуживать релиз.
stages.2.brief: Работающий потребитель должен сохранять тот же текущий контракт, что производитель и хосты.
hints.0.text: Независимым потребителям нужен один текущий контракт; знакомое имя релиза само по себе не определяет
  его производителя.
hints.1.text: |-
  Сначала сравните поставляемую схему, конфигурацию и текущий state. На следующих этапах сравнивайте полученные данные с текущим output производителя, включая идентичность получателя: успешного ответа для этого недостаточно.

  ```sh
  cat main.tf modules/delivery/main.tf delivery-schema.json
  tofu show -no-color
  tofu output -json delivery
  test ! -f rollout.yml || cat rollout.yml
  test ! -f deployment.yaml || cat deployment.yaml
  ```
hints.2.text: |-
  Проверьте производителя до доставки, затем каждую квитанцию и работающий потребитель. Квитанции и данные процесса должны соответствовать текущему output, а не прошлому экспорту. Команды ниже наблюдают результат, но не выполняют исправления.

  ```sh
  tofu output -json delivery
  tofu plan -input=false -detailed-exitcode -no-color
  ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'cat /srv/site/message /srv/site/delivery.json; stat -c %a /srv/site/message /srv/site/delivery.json'
  for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done
  kubectl rollout status deployment/relay --timeout=10s
  kubectl exec --pod-running-timeout=5s deployment/relay -c worker -- printenv RELEASE DELIVERY_CONTRACT
  ```
debrief: Контракт производителя теперь следует входным данным, сохраняет его идентичность и доходит до квитанций
  хостов и работающего потребителя. Исходные файлы релиза, HTTP и окружение также корректны.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я сравнил ID живого ресурса с state OpenTofu.
stages.0.objectives.0.text: Корневой output `delivery` следует поставляемой схеме и входным данным, сохраняя исходную
  идентичность производителя.
stages.0.objectives.1.text: На workstation `release.txt` содержит `release-81`.
stages.0.objectives.2.text: OpenTofu не сообщает об ожидающих изменениях инфраструктуры.
stages.1.objectives.0.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/message` содержит
  `release-81` с режимом `0644`, а `/srv/site/delivery.json` соответствует текущему контракту получателя и имеет
  режим `0644`.
stages.1.objectives.1.text: HTTP на порту `8080` возвращает `release-81` на каждом управляемом хосте (`app1`, `app2`,
  `app3`).
stages.2.objectives.0.text: Deployment `relay` завершает rollout с текущим структурированным контрактом производителя
  в работающем `worker`; контракты производителя и хостов по-прежнему согласованы.
stages.2.objectives.1.text: В работающем контейнере Deployment `relay` предоставленный контракт окружения передаёт
  `release-81`.
diagnostics.state: Файл может существовать лишь на диске, если управляемый local_file не применён, либо state не читается; state должен содержать управляемый ресурс для release.txt. [Причина и проверка](guides#guide=terraform-3&section=delivery-contract-managed-file)
diagnostics.file: release.txt может отсутствовать или содержать старое значение после ручной правки либо неприменённого изменения; нужен release-81, с допустимыми завершающими переводами строк, удаляемыми shell. [Причина и проверка](guides#guide=terraform-3&section=delivery-contract-local-content)
diagnostics.plan: У источника могли остаться неприменённые изменения, включая выданный retired аргумент модуля или отсутствующий output contract, либо plan завершается ошибкой; detailed-exitcode нужен 0, код 2 означает изменения, 1 — ошибку. [Причина и проверка](guides#guide=terraform-3&section=delivery-contract-no-pending-change)
diagnostics.delivery_producer: Дочерний contract может быть пустым, жёстко задавать retired или не зависеть от управляемого файла, а исходная идентичность terraform_data.producer — заменена. Текущие state/output и планы обоих выданных input cases должны нести точный структурированный delivery contract с сохранённой идентичностью; ошибки разбора, команд и входов дают тот же маркер. [Причина и проверка](guides#guide=terraform-3&section=delivery-contract-input-and-identity)
diagnostics.probe_0_0: Наблюдение state или contract может оборваться при загрузке Python helpers до именованного результата; проверьте dq_check и читаемость выданных фактов. Именованные сбои сохраняют state или delivery_producer. [Причина и проверка](guides#guide=terraform-3&section=delivery-contract-producer-startup)
diagnostics.delivery_fleet: На хосте delivery.json может отсутствовать, иметь mode не 644 либо содержать другую цель, релиз или идентичность; формируйте полную JSON-квитанцию из текущего delivery.targets для этого хоста. Несогласованность источника, SSH, разбор и команды также дают этот маркер. [Причина и проверка](guides#guide=terraform-3&section=delivery-contract-target-receipts)
diagnostics.probe_1_0: Наблюдение файлов/квитанций может оборваться до результата из-за загрузки helpers или недоступного runtime-контекста; проверьте загрузку и выданный контекст соединений. Обычные ошибки чтения файлов через SSH уже получают content/mode маркеры хоста. [Причина и проверка](guides#guide=terraform-3&section=delivery-contract-fleet-startup)
diagnostics.content_1: На app1 сообщение может быть старым, отсутствовать или не читаться через SSH; /srv/site/message содержит release-81 без перевода строки либо ровно с одним. Экспортируйте текущий output перед применением выданного пустого play. [Причина и проверка](guides#guide=terraform-3&section=delivery-contract-app1-message)
diagnostics.mode_1: На app1 могли сохраниться ограничивающие права либо SSH не смог выполнить stat; явно задайте /srv/site/message mode 0644 в play. [Причина и проверка](guides#guide=terraform-3&section=delivery-contract-app1-permissions)
diagnostics.http_1: app1 может отдавать старое сообщение из памяти при исправленном файле, либо HTTP недоступен; используйте выданный reload handler, чтобы порт 8080 вернул release-81. [Причина и проверка](guides#guide=terraform-3&section=delivery-contract-app1-http)
diagnostics.content_2: На app2 сообщение может быть старым, отсутствовать или не читаться через SSH; /srv/site/message содержит release-81 без перевода строки либо ровно с одним. Экспортируйте текущий output перед применением выданного пустого play. [Причина и проверка](guides#guide=terraform-3&section=delivery-contract-app2-message)
diagnostics.mode_2: На app2 могли сохраниться ограничивающие права либо SSH не смог выполнить stat; явно задайте /srv/site/message mode 0644 в play. [Причина и проверка](guides#guide=terraform-3&section=delivery-contract-app2-permissions)
diagnostics.http_2: app2 может отдавать старое сообщение из памяти при исправленном файле, либо HTTP недоступен; используйте выданный reload handler, чтобы порт 8080 вернул release-81. [Причина и проверка](guides#guide=terraform-3&section=delivery-contract-app2-http)
diagnostics.content_3: На app3 сообщение может быть старым, отсутствовать или не читаться через SSH; /srv/site/message содержит release-81 без перевода строки либо ровно с одним. Экспортируйте текущий output перед применением выданного пустого play. [Причина и проверка](guides#guide=terraform-3&section=delivery-contract-app3-message)
diagnostics.mode_3: На app3 могли сохраниться ограничивающие права либо SSH не смог выполнить stat; явно задайте /srv/site/message mode 0644 в play. [Причина и проверка](guides#guide=terraform-3&section=delivery-contract-app3-permissions)
diagnostics.http_3: app3 может отдавать старое сообщение из памяти при исправленном файле, либо HTTP недоступен; используйте выданный reload handler, чтобы порт 8080 вернул release-81. [Причина и проверка](guides#guide=terraform-3&section=delivery-contract-app3-http)
diagnostics.rollout: Потребитель запускается с retired релизом и может оставаться неготовым до обновления эффективного RELEASE; изучите события rollout и выданное readiness-условие до проверки согласованности. [Причина и проверка](guides#guide=terraform-3&section=delivery-contract-consumer-rollout)
diagnostics.delivery_relay: Готовый процесс может получать пустой или старый DELIVERY_CONTRACT, либо state источника, квитанции целей и plan без изменений расходятся. Сравните JSON реального процесса с текущим output и полными квитанциями хостов; ошибки команд, разбора и входов дают этот же маркер. [Причина и проверка](guides#guide=terraform-3&section=delivery-contract-end-to-end-agreement)
diagnostics.relay: Процесс может сохранять выданный retired RELEASE после правки локального манифеста или ConfigMap; изучите реальное окружение и согласуйте/перезапустите его до RELEASE=release-81. [Причина и проверка](guides#guide=terraform-3&section=delivery-contract-effective-release)
diagnostics.probe_2_0: Наблюдение согласованности может оборваться при загрузке helpers до именованного результата; проверьте dq_check. Ошибки rollout сохраняют rollout, а источника, квитанций, процесса и команд обычно дают delivery_relay. [Причина и проверка](guides#guide=terraform-3&section=delivery-contract-consumer-startup)
