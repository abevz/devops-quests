title: Доставка через несколько систем
brief: 'Вы в команде эксплуатации SignalRail. Создайте маркер, настройте fleet и запустите reader. Работайте в ~/quest. Все
  изменения — только в этой песочнице.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `inventory.ini`, `ansible.cfg`, `main.tf`, `rollout.yml`,
  `deployment.json`.


  В песочнице нет интернета и внешнего DNS. Используйте только выданные файлы, предварительно загруженные образы и приватные
  сервисы. Все изменения — только в этой песочнице.


  Цели первого этапа: Управляемый маркер корректен.'
stages.0.brief: 'Изучите `main.tf` в `~/quest`: он объявляет локальный офлайн-провайдер и `local_file.release`. Инициализируйте
  и примените маркер. Проверьте, что `tofu state list` содержит `local_file.release`, `release.txt` содержит `release-81`,
  а `tofu plan -input=false -detailed-exitcode -no-color` завершается с кодом 0 (изменений нет). Связанное руководство знакомит
  с состоянием OpenTofu. Работайте только в песочнице.'
stages.0.objectives.0.text: Адрес состояния и файл выпуска совпадают, план завершается с кодом 0.
stages.1.brief: Изучите `inventory.ini`, `ansible.cfg` и `rollout.yml` в `~/quest`. Ansible отправляет задачи по SSH каждому
  узлу приватного парка. Запишите `release-81` в `/srv/site/message` с режимом `0644` на app1, app2 и app3. Используйте готовый
  обработчик с `dq-service reload`, чтобы сервис перечитал файл; выполните `ansible-playbook rollout.yml`. Проверьте, что
  HTTP-ответ каждого узла на порту 8080 равен `release-81`. Проверки наблюдают файлы, режимы и ответы, но не доказывают, какие
  команды применялись.
stages.1.objectives.0.text: Файлы, режимы и HTTP-ответы всех трёх узлов соответствуют `release-81`.
stages.2.brief: Исправьте читатель Kubernetes с помощью `deployment.json`. Установите `RELEASE` в `release-81` на `deployment/relay`
  и дождитесь rollout. Проверка читает окружение работающего процесса и состояние rollout, но не проверяет, что отдаёт читатель.
stages.2.objectives.0.text: Rollout relay завершён, а работающий процесс имеет `RELEASE=release-81`.
hints.0.text: Проследите релиз от state через fleet до pod.
hints.1.text: У каждого этапа свой live check; правка позднего звена не заменит раннее.
hints.2.text: Примените маркер, доставьте его на fleet с reload и исправьте окружение reader.
debrief: Проверки подтвердили управляемый маркер, файлы и ответы парка, а также rollout и окружение relay.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я сравнил ID живого ресурса с state OpenTofu.
