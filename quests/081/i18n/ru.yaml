title: Доставка через несколько систем
brief: |-
  Выпуск не доступен согласованно всем своим потребителям.

  Работайте на workstation в `~/quest` с файлами `main.tf`, `inventory.ini`, `ansible.cfg`, `rollout.yml`, `deployment.yaml`.

  **Требования:**
  - Этап 1:
    - Состояние OpenTofu:
      - Предоставленный файл производителя релиза учтён в state OpenTofu.
    - Файлы на workstation:
      - `~/quest/release.txt`: `release-81`.
    - Согласованность инфраструктуры:
      - Нет ожидающих изменений инфраструктуры; код завершения подробного плана `0`.
  - Этап 2:
    - Файл на каждом управляемом хосте (`app1`, `app2`, `app3`):
      - Путь: `/srv/site/message`.
      - Содержимое: `release-81`.
      - Точный текст, возможно с одним переводом строки в конце.
      - Режим доступа: `0644`.
    - HTTP на каждом управляемом хосте (`app1`, `app2`, `app3`):
      - Порт и путь: `8080`, `/`.
      - Ответ: `release-81`.
  - Этап 3:
    - Потребитель в namespace песочницы:
      - Deployment: `relay`.
      - Rollout завершён.
      - В работающем контейнере Deployment `relay` предоставленный контракт окружения передаёт `release-81`.

  Проверки флота наблюдают значения файлов, режимы и HTTP, а не использованные команды; итоговая проверка потребителя читает статус rollout и окружение процесса, а не отдаваемое содержимое.
stages.0.brief: Маркер выпуска на workstation должен соответствовать контракту.
stages.1.brief: Каждый потребитель флота должен получить требуемый выпуск.
stages.2.brief: Потребитель Kubernetes должен работать с требуемым выпуском.
hints.0.text: Независимые уровни доставки могут разделять единый контракт релиза.
hints.1.text: |-
  Проследите релиз от state через fleet до pod. У каждого этапа свой live check; правка позднего звена не заменит раннее.

  Изучите предоставленную конфигурацию и текущие наблюдения на workstation:

  ```sh
  cat main.tf rollout.yml deployment.yaml
  tofu state list
  ```
hints.2.text: |-
  Инициализируйте и примените маркер из main.tf. Выполните ansible-playbook rollout.yml с обработчиком dq-service reload для доставки и перезагрузки флота. Исправьте deployment.yaml и обновите переменную RELEASE в deployment/relay.

  Проверьте результат из `~/quest` на workstation:

  - `tofu show -no-color; cat release.txt; tofu plan -input=false -detailed-exitcode -no-color` — Этап 1: состояние содержит `release.txt`, файл показывает `release-81`, планирование завершается с кодом `0`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'cat -A /srv/site/message; ls -l /srv/site/message'; for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done` — Этап 2: Каждый хост показывает `release-81` не более чем с одним маркером конца строки, режим файла `-rw-r--r--` и HTTP-ответ `release-81`.
  - `kubectl rollout status deployment/relay --timeout=10s; kubectl exec --pod-running-timeout=5s deployment/relay -c worker -- printenv RELEASE` — Этап 3: rollout завершается, процесс печатает `release-81`.

  Состояние учитывает управляемый файл-источник release.txt.
debrief: Проверки подтвердили управляемый маркер, файлы и ответы парка, а также rollout и окружение relay.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я сравнил ID живого ресурса с state OpenTofu.
