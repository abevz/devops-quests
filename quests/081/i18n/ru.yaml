title: Доставка через несколько систем
brief: 'Вы в команде эксплуатации SignalRail. Создайте маркер, настройте fleet и запустите reader. Работайте
  в ~/quest. Все изменения — только в этой песочнице.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `inventory.ini`, `ansible.cfg`, `main.tf`,
  `rollout.yml`, `deployment.json`.


  В песочнице нет интернета и внешнего DNS. Используйте только выданные файлы, предварительно загруженные
  образы и приватные сервисы. Все изменения — только в этой песочнице.


  Цели первого этапа: Управляемый маркер корректен.'
stages.0.brief: 'Восстановите управляемый маркер release-81.


  Результат проверки: Управляемый маркер корректен.'
stages.0.objectives.0.text: Управляемый маркер корректен.
stages.1.brief: 'Пришёл новый инцидент: доставьте release-81 на fleet и обновите banner.


  Результат проверки: Три live banner показывают release-81.'
stages.1.objectives.0.text: Три live banner показывают release-81.
stages.2.brief: 'Релиз доставлен. Новый инцидент reader: исправьте RELEASE.


  Результат проверки: Работающий reader обслуживает нужный release.'
stages.2.objectives.0.text: Работающий reader обслуживает нужный release.
hints.0.text: Проследите релиз от state через fleet до pod.
hints.1.text: У каждого этапа свой live check; правка позднего звена не заменит раннее.
hints.2.text: Примените маркер, доставьте его на fleet с reload и исправьте окружение reader.
debrief: Релиз проходил через state, настройку хостов и Kubernetes. Вы проверили маркер, живые banner
  всех хостов и конечный reader.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я сравнил ID живого ресурса с state OpenTofu.
