title: Cross-system delivery
brief: |-
  The release marker exists, but its delivery agreement is not available consistently to the consumers.

  Work on the workstation in `~/quest` with `main.tf`, `modules/delivery/main.tf`, `delivery-schema.json`, `inventory.ini` and `ansible.cfg`. Later stages supply `rollout.yml` and `deployment.yaml`.

  **Requirements:**
  - The root output `delivery` follows the supplied schema for every documented caller-input case and retains the recorded producer identity. The configured producer file remains tracked at the root of OpenTofu state.
  - On the workstation, `~/quest/release.txt` contains `release-81`; the final detailed plan exits `0`.
  - On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` contains exactly `release-81`, optionally followed by one newline, with mode `0644`. HTTP on port `8080` at `/` returns `release-81`.
  - On every managed host, `/srv/site/delivery.json` has mode `0644` and matches that target entry of the current producer agreement, including the recorded producer identity.
  - Deployment `relay` completes its rollout in the bay namespace. Its running `worker` container has `RELEASE` equal to `release-81` and `DELIVERY_CONTRACT` equal to the current structured producer agreement. The producer and fleet agreements still match at completion.

  Checks observe current state, files, HTTP, rollout and process environment; matching delivery data does not prove command history or served content in the final container.
stages.0.brief: The root producer publishes the documented current agreement while retaining its recorded identity.
stages.1.brief: Each fleet target must receive its current agreement and serve the release.
stages.2.brief: The running consumer must retain the same current agreement as the producer and fleet.
hints.0.text: Independent consumers need the same current agreement; a familiar release label alone does not identify
  its producer.
hints.1.text: |-
  Compare the supplied schema, configuration and current state first. At each later stage compare the received data with the current producer output, including target identity; a healthy response alone does not establish that correspondence.

  ```sh
  cat main.tf modules/delivery/main.tf delivery-schema.json
  tofu show -no-color
  tofu output -json delivery
  test ! -f rollout.yml || cat rollout.yml
  test ! -f deployment.yaml || cat deployment.yaml
  ```
hints.2.text: |-
  Verify the producer before delivery, then inspect every target receipt and the running consumer. The receipts and process data must match the current output, not a previous export. These commands inspect results; they do not perform the repairs.

  ```sh
  tofu output -json delivery
  tofu plan -input=false -detailed-exitcode -no-color
  ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'cat /srv/site/message /srv/site/delivery.json; stat -c %a /srv/site/message /srv/site/delivery.json'
  for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done
  kubectl rollout status deployment/relay --timeout=10s
  kubectl exec --pod-running-timeout=5s deployment/relay -c worker -- printenv RELEASE DELIVERY_CONTRACT
  ```
debrief: The producer agreement now follows caller input, retains its identity and reaches the fleet receipts and
  running consumer. Legacy release files, HTTP and environment remain correct.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I compared the live resource ID with the OpenTofu state.
stages.0.objectives.0.text: The root output `delivery` follows the supplied schema and caller input, with the original
  producer identity.
stages.0.objectives.1.text: On the workstation, `release.txt` contains `release-81`.
stages.0.objectives.2.text: OpenTofu reports no pending infrastructure changes.
stages.1.objectives.0.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` contains `release-81`
  with mode `0644`, and `/srv/site/delivery.json` matches its current target agreement with mode `0644`.
stages.1.objectives.1.text: HTTP on port `8080` returns `release-81` on every managed host (`app1`, `app2`, `app3`).
stages.2.objectives.0.text: Deployment `relay` completes its rollout with the current structured producer agreement
  in its running `worker`; the producer and fleet still match.
stages.2.objectives.1.text: In the running container of Deployment `relay`, the supplied environment contract provides
  `release-81`.
diagnostics.state: The file may exist only on disk because its managed local_file has not been applied, or state could not be read; state must contain a managed resource targeting release.txt. [Cause and check](guides#guide=terraform-3&section=delivery-contract-managed-file)
diagnostics.file: release.txt may be missing or contain an old value after a manual edit or unapplied change; its actual content must be release-81, allowing trailing line feeds removed by the shell. [Cause and check](guides#guide=terraform-3&section=delivery-contract-local-content)
diagnostics.plan: The producer may still have unapplied changes, including the supplied retired module argument or missing output contract, or planning may fail; detailed-exitcode must return 0, while 2 means pending change and 1 means error. [Cause and check](guides#guide=terraform-3&section=delivery-contract-no-pending-change)
diagnostics.delivery_producer: The child contract may be empty, hardcoded to retired or disconnected from the managed file, or the original terraform_data.producer identity may have been replaced. Current state/output and both supplied input-case plans must carry the exact structured delivery contract and retained identity; parsing, command and input errors also report this marker. [Cause and check](guides#guide=terraform-3&section=delivery-contract-input-and-identity)
diagnostics.probe_0_0: The state or contract observation may stop while loading Python helpers before emitting a named state/contract result; verify dq_check availability and readable supplied facts. Named producer failures retain state or delivery_producer. [Cause and check](guides#guide=terraform-3&section=delivery-contract-producer-startup)
diagnostics.delivery_fleet: A per-host delivery.json may be absent, have mode other than 644, or contain another target, release or producer identity; derive each complete JSON receipt from the current delivery.targets entry. Current producer disagreement, SSH, parsing and command errors also reach this marker. [Cause and check](guides#guide=terraform-3&section=delivery-contract-target-receipts)
diagnostics.probe_1_0: The file/receipt observation may stop before a named result because helpers cannot load or runtime context is unavailable; verify helper loading and the supplied connection context. Ordinary SSH file failures already receive per-host content/mode markers. [Cause and check](guides#guide=terraform-3&section=delivery-contract-fleet-startup)
diagnostics.content_1: app1 may still have an old or missing message, or SSH could not read it; /srv/site/message must contain release-81 with no newline or exactly one newline. Export the current output before applying the otherwise empty supplied play. [Cause and check](guides#guide=terraform-3&section=delivery-contract-app1-message)
diagnostics.mode_1: app1 may have retained restrictive file permissions or SSH could not stat the message; set /srv/site/message mode explicitly to 0644 in the play. [Cause and check](guides#guide=terraform-3&section=delivery-contract-app1-permissions)
diagnostics.http_1: app1 may still serve its old in-memory message despite a corrected file, or HTTP may be unavailable; use the supplied reload handler so port 8080 returns release-81. [Cause and check](guides#guide=terraform-3&section=delivery-contract-app1-http)
diagnostics.content_2: app2 may still have an old or missing message, or SSH could not read it; /srv/site/message must contain release-81 with no newline or exactly one newline. Export the current output before applying the otherwise empty supplied play. [Cause and check](guides#guide=terraform-3&section=delivery-contract-app2-message)
diagnostics.mode_2: app2 may have retained restrictive file permissions or SSH could not stat the message; set /srv/site/message mode explicitly to 0644 in the play. [Cause and check](guides#guide=terraform-3&section=delivery-contract-app2-permissions)
diagnostics.http_2: app2 may still serve its old in-memory message despite a corrected file, or HTTP may be unavailable; use the supplied reload handler so port 8080 returns release-81. [Cause and check](guides#guide=terraform-3&section=delivery-contract-app2-http)
diagnostics.content_3: app3 may still have an old or missing message, or SSH could not read it; /srv/site/message must contain release-81 with no newline or exactly one newline. Export the current output before applying the otherwise empty supplied play. [Cause and check](guides#guide=terraform-3&section=delivery-contract-app3-message)
diagnostics.mode_3: app3 may have retained restrictive file permissions or SSH could not stat the message; set /srv/site/message mode explicitly to 0644 in the play. [Cause and check](guides#guide=terraform-3&section=delivery-contract-app3-permissions)
diagnostics.http_3: app3 may still serve its old in-memory message despite a corrected file, or HTTP may be unavailable; use the supplied reload handler so port 8080 returns release-81. [Cause and check](guides#guide=terraform-3&section=delivery-contract-app3-http)
diagnostics.rollout: The consumer starts with a retired release and may remain unready until its effective RELEASE is updated; inspect rollout events and the supplied readiness condition before checking agreement. [Cause and check](guides#guide=terraform-3&section=delivery-contract-consumer-rollout)
diagnostics.delivery_relay: A ready process may still receive an empty or stale DELIVERY_CONTRACT, or producer state, target receipts or the no-change plan may disagree. Compare the actual process JSON with the current output and complete per-host receipts; command, parsing and input errors share this marker. [Cause and check](guides#guide=terraform-3&section=delivery-contract-end-to-end-agreement)
diagnostics.relay: The process may still use the supplied retired RELEASE even after editing a local manifest or ConfigMap; inspect its actual environment and reconcile/restart it so RELEASE equals release-81. [Cause and check](guides#guide=terraform-3&section=delivery-contract-effective-release)
diagnostics.probe_2_0: The agreement observation may stop loading helpers before a named result; verify dq_check availability. Rollout failures keep rollout, while current producer, receipt, process and command failures normally keep delivery_relay. [Cause and check](guides#guide=terraform-3&section=delivery-contract-consumer-startup)
