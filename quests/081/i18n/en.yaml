title: Cross-system delivery
brief: 'You joined SignalRail operations. Publish a release marker, configure the fleet and deploy its
  reader. Work in ~/quest. Keep all changes inside this training bay.


  Quest files in `~/quest` (some are introduced in later stages): `inventory.ini`, `ansible.cfg`, `main.tf`,
  `rollout.yml`, `deployment.json`.


  The bay has no Internet or external DNS. Use only its supplied files, preloaded images and private services.
  All changes must stay inside this bay.


  Initial success criteria: The managed release marker is correct.'
stages.0.brief: 'Restore the managed release marker release-81.


  Success criteria: The managed release marker is correct.'
stages.0.objectives.0.text: The managed release marker is correct.
stages.1.brief: 'The station alert fired. Deliver release-81 to the whole fleet and reload its live banner.


  Success criteria: All three live fleet banners show release-81.'
stages.1.objectives.0.text: All three live fleet banners show release-81.
stages.2.brief: 'The release reached the station. A reader incident appeared: repair its RELEASE environment.


  Success criteria: The live reader serves the intended release.'
stages.2.objectives.0.text: The live reader serves the intended release.
hints.0.text: Follow the release from state through the fleet to the pod.
hints.1.text: Each stage has its own live check; changing a later system cannot satisfy an earlier stage.
hints.2.text: Apply the marker, deliver and reload the fleet, then repair the reader environment.
debrief: The release crossed state, host configuration and Kubernetes. You verified the managed marker,
  all live banners and the final reader.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I compared the live resource ID with the OpenTofu state.
