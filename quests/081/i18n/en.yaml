title: Cross-system delivery
brief: |-
  The release is not consistently available across its consumers.

  Work on the workstation in `~/quest` with `main.tf`, `inventory.ini`, `ansible.cfg`, `rollout.yml`, `deployment.yaml`.

  **Requirements:**
  - Stage 1:
    - OpenTofu state:
      - The supplied release producer file is tracked in OpenTofu state.
    - Files on the workstation:
      - `~/quest/release.txt`: `release-81`.
    - Infrastructure convergence:
      - No pending infrastructure changes; detailed-plan exit code `0`.
  - Stage 2:
    - File on every managed host (`app1`, `app2`, `app3`):
      - Path: `/srv/site/message`.
      - Content: `release-81`.
      - Exact text, optionally followed by one newline.
      - Access mode: `0644`.
    - HTTP on every managed host (`app1`, `app2`, `app3`):
      - Port and endpoint: `8080`, `/`.
      - Response: `release-81`.
  - Stage 3:
    - Consumer in the bay namespace:
      - Deployment: `relay`.
      - Rollout complete.
      - In the running container of Deployment `relay`, the supplied environment contract provides `release-81`.

  Fleet checks observe file values, modes and HTTP, not the commands used; the final consumer check reads rollout status and process environment, not served content.
stages.0.brief: The workstation release marker must meet its contract.
stages.1.brief: Every fleet consumer must receive the required release.
stages.2.brief: The Kubernetes consumer must run with the required release.
hints.0.text: Independent delivery layers can share one release agreement.
hints.1.text: |-
  Follow the release from state through the fleet to the pod. Each stage has its own live check; changing a later system cannot satisfy an earlier stage.

  Inspect the supplied configuration and live observations on the workstation:

  ```sh
  cat main.tf rollout.yml deployment.yaml
  tofu state list
  ```
hints.2.text: |-
  Initialize and apply the marker from main.tf. Run ansible-playbook rollout.yml with its dq-service reload handler to deliver and reload the fleet. Repair deployment.yaml and update the RELEASE environment of deployment/relay.

  Verify the result from `~/quest` on the workstation:

  - `tofu show -no-color; cat release.txt; tofu plan -input=false -detailed-exitcode -no-color` — Stage 1: state contains `release.txt`, the file reads `release-81`, and planning exits `0`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'cat -A /srv/site/message; ls -l /srv/site/message'; for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done` — Stage 2: Every host shows `release-81` with at most one end-of-line marker, file mode `-rw-r--r--`, and the HTTP response `release-81`.
  - `kubectl rollout status deployment/relay --timeout=10s; kubectl exec --pod-running-timeout=5s deployment/relay -c worker -- printenv RELEASE` — Stage 3: rollout completes and the process prints `release-81`.

  State tracks the managed release.txt producer file.
debrief: The checks verified the managed marker, the fleet files and responses, and the relay rollout
  and environment.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I compared the live resource ID with the OpenTofu state.
