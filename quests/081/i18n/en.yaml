title: Cross-system delivery
brief: |-
  The release marker exists, but its delivery agreement is not available consistently to the consumers.

  Work on the workstation in `~/quest` with `main.tf`, `modules/delivery/main.tf`, `delivery-schema.json`, `inventory.ini` and `ansible.cfg`. Later stages supply `rollout.yml` and `deployment.yaml`.

  **Requirements:**
  - The root output `delivery` follows the supplied schema for every documented caller-input case and retains the recorded producer identity. The configured producer file remains tracked at the root of OpenTofu state.
  - On the workstation, `~/quest/release.txt` contains `release-81`; the final detailed plan exits `0`.
  - On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` contains exactly `release-81`, optionally followed by one newline, with mode `0644`. HTTP on port `8080` at `/` returns `release-81`.
  - On every managed host, `/srv/site/delivery.json` has mode `0644` and matches that target entry of the current producer agreement, including the recorded producer identity.
  - Deployment `relay` completes its rollout in the bay namespace. Its running `worker` container has `RELEASE` equal to `release-81` and `DELIVERY_CONTRACT` equal to the current structured producer agreement. The producer and fleet agreements still match at completion.

  Checks observe current state, files, HTTP, rollout and process environment; matching delivery data does not prove command history or served content in the final container.
stages.0.brief: The root producer publishes the documented current agreement while retaining its recorded identity.
stages.1.brief: Each fleet target must receive its current agreement and serve the release.
stages.2.brief: The running consumer must retain the same current agreement as the producer and fleet.
hints.0.text: Independent consumers need the same current agreement; a familiar release label alone does not identify
  its producer.
hints.1.text: |-
  Compare the supplied schema, configuration and current state first. At each later stage compare the received data with the current producer output, including target identity; a healthy response alone does not establish that correspondence.

  ```sh
  cat main.tf modules/delivery/main.tf delivery-schema.json
  tofu show -no-color
  tofu output -json delivery
  test ! -f rollout.yml || cat rollout.yml
  test ! -f deployment.yaml || cat deployment.yaml
  ```
hints.2.text: |-
  Verify the producer before delivery, then inspect every target receipt and the running consumer. The receipts and process data must match the current output, not a previous export. These commands inspect results; they do not perform the repairs.

  ```sh
  tofu output -json delivery
  tofu plan -input=false -detailed-exitcode -no-color
  ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'cat /srv/site/message /srv/site/delivery.json; stat -c %a /srv/site/message /srv/site/delivery.json'
  for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done
  kubectl rollout status deployment/relay --timeout=10s
  kubectl exec --pod-running-timeout=5s deployment/relay -c worker -- printenv RELEASE DELIVERY_CONTRACT
  ```
debrief: The producer agreement now follows caller input, retains its identity and reaches the fleet receipts and
  running consumer. Legacy release files, HTTP and environment remain correct.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I compared the live resource ID with the OpenTofu state.
