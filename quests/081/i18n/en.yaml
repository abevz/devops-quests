title: Cross-system delivery
brief: 'You joined SignalRail operations. Publish a release marker, configure the fleet and deploy its reader. Work in ~/quest.
  Keep all changes inside this training bay.


  Quest files in `~/quest` (some are introduced in later stages): `inventory.ini`, `ansible.cfg`, `main.tf`, `rollout.yml`,
  `deployment.json`.


  The bay has no Internet or external DNS. Use only its supplied files, preloaded images and private services. All changes
  must stay inside this bay.


  Initial success criteria: The managed release marker is correct.'
stages.0.brief: 'Read `main.tf` in `~/quest`: it declares the offline local provider and `local_file.release`. Initialize
  and apply the marker. Verify `tofu state list` contains `local_file.release`, `release.txt` contains `release-81`, and `tofu
  plan -input=false -detailed-exitcode -no-color` exits 0 (no changes). The linked guide introduces OpenTofu state. Work only
  inside the bay.'
stages.0.objectives.0.text: The release state address and file match, and the plan exits 0.
stages.1.brief: Read `inventory.ini`, `ansible.cfg` and `rollout.yml` in `~/quest`. Ansible sends tasks over SSH to each private
  fleet host. Deliver `release-81` to `/srv/site/message` with mode `0644` on app1, app2 and app3. Use the supplied handler
  with `dq-service reload` so the service rereads the file; run `ansible-playbook rollout.yml`. Verify each host's HTTP response
  on port 8080 is `release-81`. The checks inspect the files, modes and responses; they do not prove which commands were used.
  The message file must contain exactly this text, optionally followed by one newline.
stages.1.objectives.0.text: All three fleet files, modes and HTTP responses match `release-81`.
stages.2.brief: Repair the Kubernetes consumer using `deployment.json`. Set `RELEASE` to `release-81` on `deployment/relay`
  and wait for its rollout. The check reads the running process environment and rollout status; it does not test what the
  consumer serves.
stages.2.objectives.0.text: The relay rollout completes and its running process has `RELEASE=release-81`.
hints.0.text: Follow the release from state through the fleet to the pod.
hints.1.text: Each stage has its own live check; changing a later system cannot satisfy an earlier stage.
hints.2.text: Apply the marker, deliver and reload the fleet, then repair the reader environment.
debrief: The checks verified the managed marker, the fleet files and responses, and the relay rollout and environment.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I compared the live resource ID with the OpenTofu state.
diagnostics.state: OpenTofu state must contain local_file.release.
diagnostics.file: release.txt must equal release-81.
diagnostics.plan: The OpenTofu plan must exit with code 0.
diagnostics.rollout: The relay Deployment rollout must complete.
diagnostics.relay: Deployment relay RELEASE must equal release-81.
diagnostics.content_1: app1 /srv/site/message must contain exactly release-81, optionally followed by one newline.
diagnostics.mode_1: app1 /srv/site/message mode must be 644.
diagnostics.http_1: app1 on port 8080 must return release-81.
diagnostics.content_2: app2 /srv/site/message must contain exactly release-81, optionally followed by one newline.
diagnostics.mode_2: app2 /srv/site/message mode must be 644.
diagnostics.http_2: app2 on port 8080 must return release-81.
diagnostics.content_3: app3 /srv/site/message must contain exactly release-81, optionally followed by one newline.
diagnostics.mode_3: app3 /srv/site/message mode must be 644.
diagnostics.http_3: app3 on port 8080 must return release-81.
