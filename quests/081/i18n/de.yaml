title: Systemübergreifende Bereitstellung
brief: |-
  Der Release-Marker existiert, doch seine Liefervereinbarung ist bei den Verbrauchern noch nicht durchgehend verfügbar.

  Arbeite auf der Workstation in `~/quest` mit `main.tf`, `modules/delivery/main.tf`, `delivery-schema.json`, `inventory.ini` und `ansible.cfg`. Spätere Phasen liefern `rollout.yml` und `deployment.yaml`.

  **Anforderungen:**
  - Die Root-Ausgabe `delivery` entspricht dem gelieferten Schema für jeden dokumentierten Eingabefall und behält die aufgezeichnete Erzeugeridentität. Die konfigurierte Erzeugerdatei bleibt als Root-Ressource im OpenTofu-State erfasst.
  - Auf der Workstation enthält `~/quest/release.txt` den Wert `release-81`; der abschließende detaillierte Plan endet mit Code `0`.
  - Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/message` genau `release-81`, optional mit einem Zeilenumbruch, und hat Modus `0644`. HTTP auf Port `8080` unter `/` liefert `release-81`.
  - Auf jedem verwalteten Host hat `/srv/site/delivery.json` Modus `0644` und entspricht dessen Zieleintrag in der aktuellen Erzeugervereinbarung einschließlich der aufgezeichneten Erzeugeridentität.
  - Deployment `relay` schließt den Rollout im Bay-Namespace ab. Im laufenden Container `worker` ist `RELEASE` gleich `release-81` und `DELIVERY_CONTRACT` entspricht der aktuellen strukturierten Erzeugervereinbarung. Erzeuger und Hosts stimmen beim Abschluss weiterhin überein.

  Die Prüfungen beobachten aktuellen State, Dateien, HTTP, Rollout und Prozessumgebung; übereinstimmende Lieferdaten belegen weder den Befehlsverlauf noch den vom letzten Container ausgelieferten Inhalt.
stages.0.brief: Der Root-Erzeuger veröffentlicht die aktuelle Vereinbarung mit seiner aufgezeichneten Identität.
stages.1.brief: Jeder Host muss seine aktuelle Vereinbarung erhalten und das Release ausliefern.
stages.2.brief: Der laufende Verbraucher muss dieselbe aktuelle Vereinbarung wie Erzeuger und Hosts behalten.
hints.0.text: Unabhängige Verbraucher benötigen dieselbe aktuelle Vereinbarung; eine bekannte Release-Bezeichnung
  allein identifiziert ihren Erzeuger nicht.
hints.1.text: |-
  Vergleiche zuerst geliefertes Schema, Konfiguration und aktuellen State. Vergleiche in späteren Phasen empfangene Daten samt Zielidentität mit der aktuellen Erzeugerausgabe; eine erfolgreiche Antwort allein belegt diese Beziehung nicht.

  ```sh
  cat main.tf modules/delivery/main.tf delivery-schema.json
  tofu show -no-color
  tofu output -json delivery
  test ! -f rollout.yml || cat rollout.yml
  test ! -f deployment.yaml || cat deployment.yaml
  ```
hints.2.text: |-
  Prüfe den Erzeuger vor der Lieferung, danach jeden Zielbeleg und den laufenden Verbraucher. Belege und Prozessdaten müssen der aktuellen Ausgabe entsprechen, nicht einem früheren Export. Diese Befehle prüfen Ergebnisse und führen keine Reparaturen aus.

  ```sh
  tofu output -json delivery
  tofu plan -input=false -detailed-exitcode -no-color
  ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'cat /srv/site/message /srv/site/delivery.json; stat -c %a /srv/site/message /srv/site/delivery.json'
  for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done
  kubectl rollout status deployment/relay --timeout=10s
  kubectl exec --pod-running-timeout=5s deployment/relay -c worker -- printenv RELEASE DELIVERY_CONTRACT
  ```
debrief: Die Erzeugervereinbarung folgt nun den Eingaben, behält ihre Identität und erreicht die Host-Belege und
  den laufenden Verbraucher. Die ursprünglichen Release-Dateien, HTTP und Umgebung bleiben korrekt.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe die Live-Ressource ID mit dem Status OpenTofu verglichen.
stages.0.objectives.0.text: Die Root-Ausgabe `delivery` folgt dem gelieferten Schema und den Eingaben mit der ursprünglichen
  Erzeugeridentität.
stages.0.objectives.1.text: 'Auf der Workstation: `release.txt` enthält `release-81`.'
stages.0.objectives.2.text: OpenTofu meldet keine ausstehenden Infrastrukturänderungen.
stages.1.objectives.0.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/message` den
  Wert `release-81` mit Modus `0644`; `/srv/site/delivery.json` entspricht seiner aktuellen Zielvereinbarung mit
  Modus `0644`.
stages.1.objectives.1.text: HTTP auf Port `8080` liefert auf jedem verwalteten Host (`app1`, `app2`, `app3`) `release-81`.
stages.2.objectives.0.text: Deployment `relay` schließt den Rollout mit der aktuellen strukturierten Erzeugervereinbarung
  im laufenden `worker` ab; Erzeuger und Hosts stimmen weiterhin überein.
stages.2.objectives.1.text: Im laufenden Container von Deployment `relay` liefert der bereitgestellte Umgebungsvertrag
  `release-81`.
diagnostics.state: Die Datei existiert möglicherweise nur auf der Platte, weil der verwaltete local_file nicht angewendet wurde, oder der Zustand ist unlesbar; er muss eine verwaltete Ressource für release.txt enthalten. [Ursache und Prüfung](guides#guide=terraform-3&section=delivery-contract-managed-file)
diagnostics.file: release.txt fehlt möglicherweise oder enthält nach manueller Änderung oder fehlender Anwendung einen alten Wert; erforderlich ist release-81, mit durch die Shell entfernten abschließenden Zeilenumbrüchen. [Ursache und Prüfung](guides#guide=terraform-3&section=delivery-contract-local-content)
diagnostics.plan: Die Quelle hat möglicherweise noch ausstehende Änderungen, etwa das gelieferte retired Modulargument oder den fehlenden Output-Vertrag, oder die Planung scheitert; detailed-exitcode muss 0 liefern, 2 bedeutet Änderungen, 1 Fehler. [Ursache und Prüfung](guides#guide=terraform-3&section=delivery-contract-no-pending-change)
diagnostics.delivery_producer: Der untergeordnete Vertrag ist möglicherweise leer, auf retired festgelegt oder von der verwalteten Datei getrennt, oder die ursprüngliche terraform_data.producer Identität wurde ersetzt. Aktueller Zustand/Output und Pläne beider gelieferten Eingabefälle müssen den exakten strukturierten delivery Vertrag und die erhaltene Identität enthalten; Parse-, Befehls- und Eingabefehler ergeben denselben Marker. [Ursache und Prüfung](guides#guide=terraform-3&section=delivery-contract-input-and-identity)
diagnostics.probe_0_0: Die Zustands- oder Vertragsbeobachtung endet möglicherweise beim Laden von Python helpers vor einem benannten Ergebnis; prüfen Sie dq_check und lesbare Fakten. Benannte Quellenfehler behalten state oder delivery_producer. [Ursache und Prüfung](guides#guide=terraform-3&section=delivery-contract-producer-startup)
diagnostics.delivery_fleet: delivery.json eines Hosts fehlt möglicherweise, hat einen anderen Mode als 644 oder enthält ein anderes Ziel, eine andere Veröffentlichung oder Identität; erzeugen Sie den vollständigen JSON-Beleg aus dem aktuellen delivery.targets Eintrag dieses Hosts. Quellenabweichung, SSH-, Parse- und Befehlsfehler ergeben ebenfalls diesen Marker. [Ursache und Prüfung](guides#guide=terraform-3&section=delivery-contract-target-receipts)
diagnostics.probe_1_0: Die Datei-/Belegbeobachtung endet möglicherweise vor einem Ergebnis wegen nicht ladbarer helpers oder fehlendem Runtime-Kontext; prüfen Sie Laden und gelieferten Verbindungskontext. Gewöhnliche SSH-Dateifehler erhalten bereits Content-/Mode-Marker pro Host. [Ursache und Prüfung](guides#guide=terraform-3&section=delivery-contract-fleet-startup)
diagnostics.content_1: app1 hat möglicherweise eine alte oder fehlende Nachricht oder SSH kann sie nicht lesen; /srv/site/message muss release-81 ohne oder mit genau einem Zeilenumbruch enthalten. Exportieren Sie den aktuellen Output vor Anwendung des gelieferten leeren Plays. [Ursache und Prüfung](guides#guide=terraform-3&section=delivery-contract-app1-message)
diagnostics.mode_1: app1 hat möglicherweise einschränkende Dateirechte behalten oder SSH konnte stat nicht ausführen; setzen Sie den Mode von /srv/site/message im Play ausdrücklich auf 0644. [Ursache und Prüfung](guides#guide=terraform-3&section=delivery-contract-app1-permissions)
diagnostics.http_1: app1 liefert möglicherweise trotz korrigierter Datei die alte Nachricht aus dem Speicher oder HTTP ist unerreichbar; nutzen Sie den gelieferten reload handler, damit Port 8080 release-81 liefert. [Ursache und Prüfung](guides#guide=terraform-3&section=delivery-contract-app1-http)
diagnostics.content_2: app2 hat möglicherweise eine alte oder fehlende Nachricht oder SSH kann sie nicht lesen; /srv/site/message muss release-81 ohne oder mit genau einem Zeilenumbruch enthalten. Exportieren Sie den aktuellen Output vor Anwendung des gelieferten leeren Plays. [Ursache und Prüfung](guides#guide=terraform-3&section=delivery-contract-app2-message)
diagnostics.mode_2: app2 hat möglicherweise einschränkende Dateirechte behalten oder SSH konnte stat nicht ausführen; setzen Sie den Mode von /srv/site/message im Play ausdrücklich auf 0644. [Ursache und Prüfung](guides#guide=terraform-3&section=delivery-contract-app2-permissions)
diagnostics.http_2: app2 liefert möglicherweise trotz korrigierter Datei die alte Nachricht aus dem Speicher oder HTTP ist unerreichbar; nutzen Sie den gelieferten reload handler, damit Port 8080 release-81 liefert. [Ursache und Prüfung](guides#guide=terraform-3&section=delivery-contract-app2-http)
diagnostics.content_3: app3 hat möglicherweise eine alte oder fehlende Nachricht oder SSH kann sie nicht lesen; /srv/site/message muss release-81 ohne oder mit genau einem Zeilenumbruch enthalten. Exportieren Sie den aktuellen Output vor Anwendung des gelieferten leeren Plays. [Ursache und Prüfung](guides#guide=terraform-3&section=delivery-contract-app3-message)
