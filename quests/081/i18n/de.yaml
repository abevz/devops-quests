diagnostics.rollout: Der Verbraucher startet mit retired und bleibt möglicherweise bis zur Aktualisierung des wirksamen RELEASE unbereit; prüfen Sie Rollout-Ereignisse und gelieferte Readiness-Bedingung vor dem Vertragsvergleich. [Ursache und Prüfung](guides#guide=terraform-3&section=delivery-contract-consumer-rollout)
diagnostics.delivery_relay: Ein bereiter Prozess erhält möglicherweise einen leeren oder alten DELIVERY_CONTRACT, oder Quellenzustand, Zielbelege und unveränderter Plan stimmen nicht überein. Vergleichen Sie das tatsächliche Prozess-JSON mit aktuellem Output und vollständigen Host-Belegen; Befehls-, Parse- und Eingabefehler teilen diesen Marker. [Ursache und Prüfung](guides#guide=terraform-3&section=delivery-contract-end-to-end-agreement)
diagnostics.relay: Der Prozess verwendet möglicherweise nach Änderung von Manifest oder ConfigMap weiterhin das gelieferte retired RELEASE; prüfen Sie die tatsächliche Umgebung und gleichen Sie ab/starten Sie neu bis RELEASE=release-81. [Ursache und Prüfung](guides#guide=terraform-3&section=delivery-contract-effective-release)
diagnostics.probe_2_0: Die Vertragsbeobachtung endet möglicherweise beim Laden von helpers vor einem benannten Ergebnis; prüfen Sie dq_check. Rollout-Fehler behalten rollout, aktuelle Quellen-, Beleg-, Prozess- und Befehlsfehler normalerweise delivery_relay. [Ursache und Prüfung](guides#guide=terraform-3&section=delivery-contract-consumer-startup)
