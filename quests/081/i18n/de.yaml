title: Systemübergreifende Bereitstellung
brief: |-
  Die Version ist nicht konsistent für alle Verbraucher verfügbar.

  Arbeite auf der Workstation in `~/quest` mit `main.tf`, `inventory.ini`, `ansible.cfg`, `rollout.yml`, `deployment.yaml`.

  **Anforderungen:**
  - Stufe 1:
    - OpenTofu-State:
      - Die bereitgestellte Release-Erzeugerdatei wird im OpenTofu-State verwaltet.
    - Dateien auf der Workstation:
      - `~/quest/release.txt`: `release-81`.
    - Infrastrukturkonvergenz:
      - Keine ausstehenden Infrastrukturänderungen; Exit-Code des detaillierten Plans `0`.
  - Stufe 2:
    - Datei auf jedem verwalteten Host (`app1`, `app2`, `app3`):
      - Pfad: `/srv/site/message`.
      - Inhalt: `release-81`.
      - Genauer Text, optional mit einem abschließenden Zeilenumbruch.
      - Zugriffsmodus: `0644`.
    - HTTP auf jedem verwalteten Host (`app1`, `app2`, `app3`):
      - Port und Endpunkt: `8080`, `/`.
      - Antwort: `release-81`.
  - Stufe 3:
    - Verbraucher im Bay-Namespace:
      - Deployment: `relay`.
      - Rollout abgeschlossen.
      - Im laufenden Container von Deployment `relay` liefert der bereitgestellte Umgebungsvertrag `release-81`.

  Die Flottenprüfungen beobachten Dateiinhalte, Modi und HTTP, nicht die verwendeten Befehle; die abschließende Verbraucherprüfung liest Rollout-Status und Prozessumgebung, nicht ausgelieferte Inhalte.
stages.0.brief: Die Versionsmarkierung auf der Workstation muss ihren Vertrag erfüllen.
stages.1.brief: Jeder Verbraucher der Flotte muss die erforderliche Version erhalten.
stages.2.brief: Der Kubernetes-Verbraucher muss mit der erforderlichen Version laufen.
hints.0.text: Unabhängige Auslieferungsebenen können einen gemeinsamen Release-Vertrag haben.
hints.1.text: |-
  Verfolgen Sie die Freigabe vom Zustand über fleet bis pod. Jede Stufe hat ihren eigenen Live-Check; Die Änderung eines späteren Systems kann eine frühere Stufe nicht erfüllen.

  Prüfen Sie die bereitgestellte Konfiguration und aktuelle Beobachtungen auf der Workstation:

  ```sh
  cat main.tf rollout.yml deployment.yaml
  tofu state list
  ```
hints.2.text: |-
  Initialisiere die Markierung aus main.tf und wende sie an. Führe ansible-playbook rollout.yml mit dem Handler dq-service reload aus, um die Flotte zu beliefern und neu zu laden. Repariere deployment.yaml und aktualisiere die Umgebung RELEASE von deployment/relay.

  Prüfen Sie das Ergebnis in `~/quest` auf der Workstation:

  - `tofu show -no-color; cat release.txt; tofu plan -input=false -detailed-exitcode -no-color` — Stufe 1: Der State enthält `release.txt`, die Datei zeigt `release-81` und die Planung endet mit `0`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'cat -A /srv/site/message; ls -l /srv/site/message'; for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done` — Stufe 2: Jeder Host zeigt `release-81` mit höchstens einer Zeilenendemarkierung, Dateimodus `-rw-r--r--` und die HTTP-Antwort `release-81`.
  - `kubectl rollout status deployment/relay --timeout=10s; kubectl exec --pod-running-timeout=5s deployment/relay -c worker -- printenv RELEASE` — Stufe 3: Der Rollout wird abgeschlossen und der Prozess gibt `release-81` aus.

  Der State erfasst die verwaltete Quelldatei release.txt.
debrief: Die Prüfungen bestätigten den verwalteten Marker, Flottendateien und Antworten sowie Relay-Rollout
  und Umgebung.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe die Live-Ressource ID mit dem Status OpenTofu verglichen.
