title: Systemübergreifende Bereitstellung
brief: 'Sie sind dem Betrieb SignalRail beigetreten. Veröffentlichen Sie einen Release-Marker, konfigurieren
  Sie fleet und deploy seinen reader. Arbeiten Sie in ~/quest.. Bewahren Sie alle Änderungen in diesem
  Trainingsbereich auf.


  Questdateien in `~/quest` (einige werden in späteren Phasen eingeführt): `inventory.ini`, `ansible.cfg`,
  `main.tf`, `rollout.yml`, `deployment.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur die bereitgestellten Dateien,
  vorinstallierten Bilder und privaten Dienste. Alle Änderungen müssen innerhalb dieser Bucht bleiben.


  Anfängliche Erfolgskriterien: Der verwaltete Release-Marker ist korrekt.'
stages.0.brief: 'Stellen Sie den verwalteten Release-Marker release-81 wieder her.


  Erfolgskriterium: Der verwaltete Release-Marker ist korrekt.'
stages.0.objectives.0.text: Der verwaltete Release-Marker ist korrekt.
stages.1.brief: 'Die Warnung station wurde ausgelöst. Liefern Sie release-81 an das gesamte fleet und
  laden Sie dessen Live-banner neu.


  Erfolgskriterien: Alle drei Live-fleet-Banner zeigen release-81.'
stages.1.objectives.0.text: Alle drei Live-Flottenbanner zeigen release-81.
stages.2.brief: 'Die Veröffentlichung erreichte den station. Es ist ein reader-Vorfall aufgetreten: Reparieren
  Sie die RELEASE-Umgebung.


  Erfolgskriterium: Der Live-reader dient der beabsichtigten Veröffentlichung.'
stages.2.objectives.0.text: Der Live-reader dient der beabsichtigten Veröffentlichung.
hints.0.text: Verfolgen Sie die Freigabe vom Zustand über fleet bis pod.
hints.1.text: Jede Stufe hat ihren eigenen Live-Check; Die Änderung eines späteren Systems kann eine frühere
  Stufe nicht erfüllen.
hints.2.text: Bringen Sie den Marker an, liefern Sie reload den fleet und reparieren Sie dann die reader-Umgebung.
debrief: Die Veröffentlichung kreuzte Status, Hostkonfiguration und Kubernetes. Sie haben den verwalteten
  Marker, alle Live-Banner und das endgültige reader überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe die Live-Ressource ID mit dem Status OpenTofu verglichen.
