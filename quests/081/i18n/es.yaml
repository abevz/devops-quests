title: Entrega entre sistemas
brief: 'Te uniste a las operaciones de SignalRail. Publicar un marcador de versión, configurar el fleet y el deploy con su
  reader. Trabajar en ~/quest. Mantenga todos los cambios dentro de esta bahía de entrenamiento.


  Archivos de búsqueda en `~/quest` (algunos se introducen en etapas posteriores): `inventory.ini`, `ansible.cfg`, `main.tf`,
  `rollout.yml`, `deployment.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente los archivos suministrados, las imágenes precargadas y los
  servicios privados. Todos los cambios deben permanecer dentro de esta bahía.


  Criterios de éxito iniciales: el marcador de liberación gestionada es correcto.'
stages.0.brief: 'Lee `main.tf` en `~/quest`: declara el proveedor local sin conexión y `local_file.release`. Inicializa y
  aplica el marcador. Comprueba que `tofu state list` contiene `local_file.release`, `release.txt` contiene `release-81` y
  `tofu plan -input=false -detailed-exitcode -no-color` termina con 0 (sin cambios). La guía enlazada presenta el estado de
  OpenTofu. Trabaja solo en la bahía.'
stages.0.objectives.0.text: La dirección del estado y el archivo de versión coinciden, y el plan termina con 0.
stages.1.brief: Lee `inventory.ini`, `ansible.cfg` y `rollout.yml` en `~/quest`. Ansible envía tareas por SSH a cada host
  de la flota privada. Entrega `release-81` en `/srv/site/message` con modo `0644` en app1, app2 y app3. Usa el handler proporcionado
  con `dq-service reload` para que el servicio relea el archivo; ejecuta `ansible-playbook rollout.yml`. Comprueba que la
  respuesta HTTP de cada host en el puerto 8080 sea `release-81`. Las comprobaciones observan archivos, modos y respuestas;
  no demuestran qué comandos se usaron.
stages.1.objectives.0.text: Los archivos, modos y respuestas HTTP de los tres hosts coinciden con `release-81`.
stages.2.brief: Repara el lector de Kubernetes con `deployment.json`. Establece `RELEASE` en `release-81` en `deployment/relay`
  y espera su rollout. La comprobación lee el entorno del proceso en ejecución y el estado del rollout; no comprueba lo que
  sirve el lector.
stages.2.objectives.0.text: El rollout de relay termina y su proceso en ejecución tiene `RELEASE=release-81`.
hints.0.text: Siga la liberación del estado a través del fleet hasta el pod.
hints.1.text: Cada etapa tiene su propia verificación en vivo; cambiar un sistema posterior no puede satisfacer una etapa
  anterior.
hints.2.text: Aplique el marcador, entregue y reload el fleet, luego repare el entorno reader.
debrief: Las comprobaciones verificaron el marcador gestionado, archivos y respuestas de la flota, y el rollout y entorno
  de relay.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Comparé el recurso en vivo ID con el estado OpenTofu.
