title: Entrega entre sistemas
brief: |-
  El marcador de versión existe, pero su contrato de entrega aún no está disponible de forma coherente para los consumidores.

  Trabaja en la workstation, en `~/quest`, con `main.tf`, `modules/delivery/main.tf`, `delivery-schema.json`, `inventory.ini` y `ansible.cfg`. Las etapas posteriores proporcionan `rollout.yml` y `deployment.yaml`.

  **Requisitos:**
  - La salida raíz `delivery` cumple el esquema suministrado para cada caso de entrada documentado y conserva la identidad registrada del productor. El archivo configurado del productor sigue gestionado en la raíz del estado de OpenTofu.
  - En la workstation, `~/quest/release.txt` contiene `release-81`; el plan detallado final termina con código `0`.
  - En cada host gestionado (`app1`, `app2`, `app3`), `/srv/site/message` contiene exactamente `release-81`, con un salto de línea final opcional, y tiene modo `0644`. HTTP en el puerto `8080` y la ruta `/` devuelve `release-81`.
  - En cada host gestionado, `/srv/site/delivery.json` tiene modo `0644` y coincide con la entrada de ese destino en el contrato actual del productor, incluida su identidad registrada.
  - El Deployment `relay` completa el rollout en el namespace del entorno. Su contenedor `worker` en ejecución tiene `RELEASE` igual a `release-81` y `DELIVERY_CONTRACT` igual al contrato estructurado actual del productor. Al finalizar, los contratos del productor y de los hosts siguen coincidiendo.

  Las comprobaciones observan estado, archivos, HTTP, rollout y entorno del proceso actuales; los datos coincidentes no demuestran el historial de comandos ni el contenido servido por el último contenedor.
stages.0.brief: El productor raíz publica el contrato actual conservando su identidad registrada.
stages.1.brief: Cada host debe recibir su contrato actual y servir la versión.
stages.2.brief: El consumidor en ejecución debe conservar el mismo contrato actual que el productor y los hosts.
hints.0.text: Los consumidores independientes necesitan el mismo contrato actual; una etiqueta de versión conocida
  no identifica por sí sola a su productor.
hints.1.text: |-
  Compara primero el esquema suministrado, la configuración y el estado actual. En las etapas posteriores compara los datos recibidos y la identidad de destino con la salida actual del productor; una respuesta correcta no demuestra por sí sola esa relación.

  ```sh
  cat main.tf modules/delivery/main.tf delivery-schema.json
  tofu show -no-color
  tofu output -json delivery
  test ! -f rollout.yml || cat rollout.yml
  test ! -f deployment.yaml || cat deployment.yaml
  ```
hints.2.text: |-
  Verifica el productor antes de entregar y después cada recibo de destino y el consumidor en ejecución. Los recibos y los datos del proceso deben coincidir con la salida actual, no con una exportación anterior. Estos comandos inspeccionan resultados y no realizan las reparaciones.

  ```sh
  tofu output -json delivery
  tofu plan -input=false -detailed-exitcode -no-color
  ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'cat /srv/site/message /srv/site/delivery.json; stat -c %a /srv/site/message /srv/site/delivery.json'
  for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done
  kubectl rollout status deployment/relay --timeout=10s
  kubectl exec --pod-running-timeout=5s deployment/relay -c worker -- printenv RELEASE DELIVERY_CONTRACT
  ```
debrief: El contrato del productor sigue ahora las entradas, conserva su identidad y llega a los recibos de los
  hosts y al consumidor en ejecución. Los archivos de versión, HTTP y entorno originales siguen siendo correctos.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Comparé el recurso en vivo ID con el estado OpenTofu.
