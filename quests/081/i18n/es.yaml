title: Entrega entre sistemas
brief: 'Te uniste a las operaciones de SignalRail. Publicar un marcador de versión, configurar el fleet
  y el deploy con su reader. Trabajar en ~/quest. Mantenga todos los cambios dentro de esta bahía de entrenamiento.


  Archivos de búsqueda en `~/quest` (algunos se introducen en etapas posteriores): `inventory.ini`, `ansible.cfg`,
  `main.tf`, `rollout.yml`, `deployment.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente los archivos suministrados, las imágenes
  precargadas y los servicios privados. Todos los cambios deben permanecer dentro de esta bahía.


  Criterios de éxito iniciales: el marcador de liberación gestionada es correcto.'
stages.0.brief: 'Restaure el marcador de versión administrada release-81.


  Criterios de éxito: el marcador de versión gestionada es correcto.'
stages.0.objectives.0.text: El marcador de liberación gestionada es correcto.
stages.1.brief: 'Se disparó la alerta station. Entregue release-81 a todo el fleet y recargue su banner
  en vivo.


  Criterios de éxito: los tres banners en vivo fleet muestran release-81.'
stages.1.objectives.0.text: Los tres carteles de flotas en vivo muestran release-81.
stages.2.brief: 'El lanzamiento llegó al station. Apareció un incidente reader: repare su entorno RELEASE.


  Criterios de éxito: el reader en vivo sirve para la versión prevista.'
stages.2.objectives.0.text: El reader en vivo sirve para la versión prevista.
hints.0.text: Siga la liberación del estado a través del fleet hasta el pod.
hints.1.text: Cada etapa tiene su propia verificación en vivo; cambiar un sistema posterior no puede satisfacer
  una etapa anterior.
hints.2.text: Aplique el marcador, entregue y reload el fleet, luego repare el entorno reader.
debrief: El lanzamiento cruzó el estado, la configuración del host y Kubernetes. Verificaste el marcador
  administrado, todos los banners en vivo y el reader final.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Comparé el recurso en vivo ID con el estado OpenTofu.
