title: Entrega entre sistemas
brief: |-
  La versión no está disponible de forma coherente para todos sus consumidores.

  Trabaja en la workstation en `~/quest` con `main.tf`, `inventory.ini`, `ansible.cfg`, `rollout.yml`, `deployment.yaml`.

  **Requisitos:**
  - Etapa 1:
    - Estado de OpenTofu:
      - El archivo productor de la versión suministrado está registrado en el estado de OpenTofu.
    - Archivos en la workstation:
      - `~/quest/release.txt`: `release-81`.
    - Convergencia de infraestructura:
      - Sin cambios de infraestructura pendientes; código de salida del plan detallado `0`.
  - Etapa 2:
    - Archivo en cada host administrado (`app1`, `app2`, `app3`):
      - Ruta: `/srv/site/message`.
      - Contenido: `release-81`.
      - Texto exacto, opcionalmente seguido de un salto de línea.
      - Modo de acceso: `0644`.
    - HTTP en cada host administrado (`app1`, `app2`, `app3`):
      - Puerto y ruta: `8080`, `/`.
      - Respuesta: `release-81`.
  - Etapa 3:
    - Consumidor en el namespace de la bahía:
      - Deployment: `relay`.
      - Rollout completo.
      - En el contenedor activo del Deployment `relay`, el contrato de entorno suministrado proporciona `release-81`.

  Las comprobaciones de flota observan valores de archivo, modos y HTTP, no los comandos usados; la comprobación final del consumidor lee el estado del rollout y el entorno del proceso, no el contenido servido.
stages.0.brief: El marcador de versión en la workstation debe cumplir su contrato.
stages.1.brief: Cada consumidor de la flota debe recibir la versión requerida.
stages.2.brief: El consumidor de Kubernetes debe ejecutarse con la versión requerida.
hints.0.text: Las capas independientes de entrega pueden compartir un mismo contrato de versión.
hints.1.text: |-
  Siga la liberación del estado a través del fleet hasta el pod. Cada etapa tiene su propia verificación en vivo; cambiar un sistema posterior no puede satisfacer una etapa anterior.

  Inspecciona la configuración suministrada y las observaciones actuales en la workstation:

  ```sh
  cat main.tf rollout.yml deployment.yaml
  tofu state list
  ```
hints.2.text: |-
  Inicializa y aplica el marcador de main.tf. Ejecuta ansible-playbook rollout.yml con su handler dq-service reload para entregar y recargar la flota. Repara deployment.yaml y actualiza el entorno RELEASE de deployment/relay.

  Verifica el resultado desde `~/quest` en la workstation:

  - `tofu show -no-color; cat release.txt; tofu plan -input=false -detailed-exitcode -no-color` — Etapa 1: el estado contiene `local_file.release`, el archivo muestra `release-81` y el plan termina con `0`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'cat -A /srv/site/message; ls -l /srv/site/message'; for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done` — Etapa 2: Cada host muestra `release-81` con como máximo un marcador de fin de línea, modo de archivo `-rw-r--r--` y respuesta HTTP `release-81`.
  - `kubectl rollout status deployment/relay --timeout=10s; kubectl exec --pod-running-timeout=5s deployment/relay -- printenv RELEASE` — Etapa 3: el rollout se completa y el proceso imprime `release-81`.
debrief: Las comprobaciones verificaron el marcador gestionado, archivos y respuestas de la flota, y el
  rollout y entorno de relay.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Comparé el recurso en vivo ID con el estado OpenTofu.
diagnostics.state: El estado de OpenTofu debe contener local_file.release.
diagnostics.file: release.txt debe ser igual a release-81.
diagnostics.plan: El plan de OpenTofu debe terminar con código 0.
diagnostics.rollout: El despliegue del Deployment relay debe completarse.
diagnostics.relay: RELEASE del Deployment relay debe ser release-81.
diagnostics.content_1: En app1, /srv/site/message debe contener exactamente release-81, opcionalmente
  seguido de un salto de línea.
diagnostics.mode_1: En app1, el modo de /srv/site/message debe ser 644.
diagnostics.http_1: app1 en el puerto 8080 debe devolver release-81.
diagnostics.content_2: En app2, /srv/site/message debe contener exactamente release-81, opcionalmente
  seguido de un salto de línea.
diagnostics.mode_2: En app2, el modo de /srv/site/message debe ser 644.
diagnostics.http_2: app2 en el puerto 8080 debe devolver release-81.
diagnostics.content_3: En app3, /srv/site/message debe contener exactamente release-81, opcionalmente
  seguido de un salto de línea.
diagnostics.mode_3: En app3, el modo de /srv/site/message debe ser 644.
diagnostics.http_3: app3 en el puerto 8080 debe devolver release-81.
stages.0.objectives.0.text: El archivo productor de la versión suministrado está registrado en el estado
  de OpenTofu.
stages.0.objectives.1.text: En la workstation, `release.txt` contiene `release-81`.
stages.0.objectives.2.text: OpenTofu no informa cambios de infraestructura pendientes.
stages.1.objectives.0.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` contiene
  exactamente `release-81`, opcionalmente seguido de un salto de línea, con modo `0644`.
stages.1.objectives.1.text: HTTP en el puerto `8080` devuelve `release-81` en cada host administrado (`app1`,
  `app2`, `app3`).
stages.2.objectives.0.text: El Deployment `relay` completa su rollout en el namespace de la bahía.
stages.2.objectives.1.text: En el contenedor activo del Deployment `relay`, el contrato de entorno suministrado
  proporciona `release-81`.
