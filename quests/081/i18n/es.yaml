title: Entrega entre sistemas
brief: |-
  El marcador de versión existe, pero su contrato de entrega aún no está disponible de forma coherente para los consumidores.

  Trabaja en la workstation, en `~/quest`, con `main.tf`, `modules/delivery/main.tf`, `delivery-schema.json`, `inventory.ini` y `ansible.cfg`. Las etapas posteriores proporcionan `rollout.yml` y `deployment.yaml`.

  **Requisitos:**
  - La salida raíz `delivery` cumple el esquema suministrado para cada caso de entrada documentado y conserva la identidad registrada del productor. El archivo configurado del productor sigue gestionado en la raíz del estado de OpenTofu.
  - En la workstation, `~/quest/release.txt` contiene `release-81`; el plan detallado final termina con código `0`.
  - En cada host gestionado (`app1`, `app2`, `app3`), `/srv/site/message` contiene exactamente `release-81`, con un salto de línea final opcional, y tiene modo `0644`. HTTP en el puerto `8080` y la ruta `/` devuelve `release-81`.
  - En cada host gestionado, `/srv/site/delivery.json` tiene modo `0644` y coincide con la entrada de ese destino en el contrato actual del productor, incluida su identidad registrada.
  - El Deployment `relay` completa el rollout en el namespace del entorno. Su contenedor `worker` en ejecución tiene `RELEASE` igual a `release-81` y `DELIVERY_CONTRACT` igual al contrato estructurado actual del productor. Al finalizar, los contratos del productor y de los hosts siguen coincidiendo.

  Las comprobaciones observan estado, archivos, HTTP, rollout y entorno del proceso actuales; los datos coincidentes no demuestran el historial de comandos ni el contenido servido por el último contenedor.
stages.0.brief: El productor raíz publica el contrato actual conservando su identidad registrada.
stages.1.brief: Cada host debe recibir su contrato actual y servir la versión.
stages.2.brief: El consumidor en ejecución debe conservar el mismo contrato actual que el productor y los hosts.
hints.0.text: Los consumidores independientes necesitan el mismo contrato actual; una etiqueta de versión conocida
  no identifica por sí sola a su productor.
hints.1.text: |-
  Compara primero el esquema suministrado, la configuración y el estado actual. En las etapas posteriores compara los datos recibidos y la identidad de destino con la salida actual del productor; una respuesta correcta no demuestra por sí sola esa relación.

  ```sh
  cat main.tf modules/delivery/main.tf delivery-schema.json
  tofu show -no-color
  tofu output -json delivery
  test ! -f rollout.yml || cat rollout.yml
  test ! -f deployment.yaml || cat deployment.yaml
  ```
hints.2.text: |-
  Verifica el productor antes de entregar y después cada recibo de destino y el consumidor en ejecución. Los recibos y los datos del proceso deben coincidir con la salida actual, no con una exportación anterior. Estos comandos inspeccionan resultados y no realizan las reparaciones.

  ```sh
  tofu output -json delivery
  tofu plan -input=false -detailed-exitcode -no-color
  ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'cat /srv/site/message /srv/site/delivery.json; stat -c %a /srv/site/message /srv/site/delivery.json'
  for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done
  kubectl rollout status deployment/relay --timeout=10s
  kubectl exec --pod-running-timeout=5s deployment/relay -c worker -- printenv RELEASE DELIVERY_CONTRACT
  ```
debrief: El contrato del productor sigue ahora las entradas, conserva su identidad y llega a los recibos de los
  hosts y al consumidor en ejecución. Los archivos de versión, HTTP y entorno originales siguen siendo correctos.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Comparé el recurso en vivo ID con el estado OpenTofu.
stages.0.objectives.0.text: La salida raíz `delivery` sigue el esquema suministrado y las entradas con la identidad
  original del productor.
stages.0.objectives.1.text: En la workstation, `release.txt` contiene `release-81`.
stages.0.objectives.2.text: OpenTofu no informa cambios de infraestructura pendientes.
stages.1.objectives.0.text: En cada host gestionado (`app1`, `app2`, `app3`), `/srv/site/message` contiene `release-81`
  con modo `0644`, y `/srv/site/delivery.json` coincide con su contrato actual de destino con modo `0644`.
stages.1.objectives.1.text: HTTP en el puerto `8080` devuelve `release-81` en cada host administrado (`app1`, `app2`,
  `app3`).
stages.2.objectives.0.text: El Deployment `relay` completa el rollout con el contrato estructurado actual del productor
  en su `worker` en ejecución; el productor y los hosts siguen coincidiendo.
stages.2.objectives.1.text: En el contenedor activo del Deployment `relay`, el contrato de entorno suministrado
  proporciona `release-81`.
diagnostics.state: El archivo puede existir solo en disco porque local_file gestionado no se aplicó, o no se pudo leer estado; este debe contener recurso gestionado para release.txt. [Causa y comprobación](guides#guide=terraform-3&section=delivery-contract-managed-file)
diagnostics.file: release.txt puede faltar o conservar valor antiguo tras edición manual o cambio sin aplicar; contenido debe ser release-81, permitiendo saltos finales que elimina shell. [Causa y comprobación](guides#guide=terraform-3&section=delivery-contract-local-content)
diagnostics.plan: El productor puede tener cambios pendientes, incluido argumento retired del módulo o contrato output ausente, o fallar plan; detailed-exitcode debe devolver 0, 2 indica cambios y 1 error. [Causa y comprobación](guides#guide=terraform-3&section=delivery-contract-no-pending-change)
diagnostics.delivery_producer: El contrato hijo puede estar vacío, fijado a retired o desconectado del archivo gestionado, o haberse reemplazado identidad original terraform_data.producer. Estado/output actuales y planes de ambos input cases deben contener contrato delivery estructurado exacto e identidad conservada; errores de análisis, comandos y entradas dan mismo marcador. [Causa y comprobación](guides#guide=terraform-3&section=delivery-contract-input-and-identity)
diagnostics.probe_0_0: La observación de estado o contrato puede detenerse al cargar Python helpers antes del resultado nombrado; compruebe dq_check y hechos legibles. Fallos nombrados conservan state o delivery_producer. [Causa y comprobación](guides#guide=terraform-3&section=delivery-contract-producer-startup)
diagnostics.delivery_fleet: delivery.json por host puede faltar, tener mode distinto de 644 o incluir otro destino, publicación o identidad; derive recibo JSON completo de entrada actual delivery.targets del host. Desacuerdo del productor, SSH, análisis y comandos también dan este marcador. [Causa y comprobación](guides#guide=terraform-3&section=delivery-contract-target-receipts)
diagnostics.probe_1_0: Observación de archivos/recibos puede detenerse antes del resultado por carga de helpers o contexto runtime ausente; compruebe carga y contexto de conexiones. Fallos ordinarios de archivos SSH ya reciben marcadores content/mode por host. [Causa y comprobación](guides#guide=terraform-3&section=delivery-contract-fleet-startup)
diagnostics.content_1: app1 puede tener mensaje antiguo, ausente o ilegible por SSH; /srv/site/message debe contener release-81 sin salto o con exactamente uno. Exporte output actual antes de aplicar play suministrado vacío. [Causa y comprobación](guides#guide=terraform-3&section=delivery-contract-app1-message)
diagnostics.mode_1: app1 puede conservar permisos restrictivos o fallar stat por SSH; fije explícitamente mode 0644 de /srv/site/message en play. [Causa y comprobación](guides#guide=terraform-3&section=delivery-contract-app1-permissions)
diagnostics.http_1: app1 puede servir mensaje antiguo de memoria con archivo corregido, o HTTP estar indisponible; use reload handler suministrado para devolver release-81 en puerto 8080. [Causa y comprobación](guides#guide=terraform-3&section=delivery-contract-app1-http)
diagnostics.content_2: app2 puede tener mensaje antiguo, ausente o ilegible por SSH; /srv/site/message debe contener release-81 sin salto o con exactamente uno. Exporte output actual antes de aplicar play suministrado vacío. [Causa y comprobación](guides#guide=terraform-3&section=delivery-contract-app2-message)
diagnostics.mode_2: app2 puede conservar permisos restrictivos o fallar stat por SSH; fije explícitamente mode 0644 de /srv/site/message en play. [Causa y comprobación](guides#guide=terraform-3&section=delivery-contract-app2-permissions)
diagnostics.http_2: app2 puede servir mensaje antiguo de memoria con archivo corregido, o HTTP estar indisponible; use reload handler suministrado para devolver release-81 en puerto 8080. [Causa y comprobación](guides#guide=terraform-3&section=delivery-contract-app2-http)
diagnostics.content_3: app3 puede tener mensaje antiguo, ausente o ilegible por SSH; /srv/site/message debe contener release-81 sin salto o con exactamente uno. Exporte output actual antes de aplicar play suministrado vacío. [Causa y comprobación](guides#guide=terraform-3&section=delivery-contract-app3-message)
diagnostics.mode_3: app3 puede conservar permisos restrictivos o fallar stat por SSH; fije explícitamente mode 0644 de /srv/site/message en play. [Causa y comprobación](guides#guide=terraform-3&section=delivery-contract-app3-permissions)
diagnostics.http_3: app3 puede servir mensaje antiguo de memoria con archivo corregido, o HTTP estar indisponible; use reload handler suministrado para devolver release-81 en puerto 8080. [Causa y comprobación](guides#guide=terraform-3&section=delivery-contract-app3-http)
diagnostics.rollout: El consumidor inicia con publicación retired y puede seguir no disponible hasta actualizar RELEASE efectivo; inspeccione eventos rollout y condición readiness antes de comprobar acuerdo. [Causa y comprobación](guides#guide=terraform-3&section=delivery-contract-consumer-rollout)
diagnostics.delivery_relay: Un proceso listo puede recibir DELIVERY_CONTRACT vacío o antiguo, o discrepar estado del productor, recibos y plan sin cambios. Compare JSON real del proceso con output actual y recibos completos por host; errores de comandos, análisis y entradas comparten marcador. [Causa y comprobación](guides#guide=terraform-3&section=delivery-contract-end-to-end-agreement)
diagnostics.relay: El proceso puede conservar RELEASE retired tras editar manifiesto local o ConfigMap; inspeccione entorno real y reconcilie/reinicie hasta RELEASE=release-81. [Causa y comprobación](guides#guide=terraform-3&section=delivery-contract-effective-release)
diagnostics.probe_2_0: La observación del acuerdo puede detenerse cargando helpers antes de resultado nombrado; compruebe dq_check. Fallos rollout conservan rollout y los de productor, recibos, proceso y comandos normalmente delivery_relay. [Causa y comprobación](guides#guide=terraform-3&section=delivery-contract-consumer-startup)
