stages.0.objectives.0.text: La salida raíz `delivery` sigue el esquema suministrado y las entradas con la identidad
  original del productor.
stages.0.objectives.1.text: En la workstation, `release.txt` contiene `release-81`.
stages.0.objectives.2.text: OpenTofu no informa cambios de infraestructura pendientes.
stages.1.objectives.0.text: En cada host gestionado (`app1`, `app2`, `app3`), `/srv/site/message` contiene `release-81`
  con modo `0644`, y `/srv/site/delivery.json` coincide con su contrato actual de destino con modo `0644`.
stages.1.objectives.1.text: HTTP en el puerto `8080` devuelve `release-81` en cada host administrado (`app1`, `app2`,
  `app3`).
stages.2.objectives.0.text: El Deployment `relay` completa el rollout con el contrato estructurado actual del productor
  en su `worker` en ejecución; el productor y los hosts siguen coincidiendo.
stages.2.objectives.1.text: En el contenedor activo del Deployment `relay`, el contrato de entorno suministrado
  proporciona `release-81`.
