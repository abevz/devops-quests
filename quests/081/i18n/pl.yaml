title: Dostawa międzysystemowa
brief: |-
  Wydanie nie jest spójnie dostępne dla wszystkich odbiorców.

  Pracuj na workstation w `~/quest` z plikami `main.tf`, `inventory.ini`, `ansible.cfg`, `rollout.yml`, `deployment.yaml`.

  **Wymagania:**
  - Etap 1:
    - Stan OpenTofu:
      - Dostarczony plik producenta wydania jest zarządzany w stanie OpenTofu.
    - Pliki na workstation:
      - `~/quest/release.txt`: `release-81`.
    - Zbieżność infrastruktury:
      - Brak oczekujących zmian infrastruktury; kod zakończenia szczegółowego planu `0`.
  - Etap 2:
    - Plik na każdym zarządzanym hoście (`app1`, `app2`, `app3`):
      - Ścieżka: `/srv/site/message`.
      - Treść: `release-81`.
      - Dokładny tekst, opcjonalnie z jednym końcowym znakiem nowego wiersza.
      - Tryb dostępu: `0644`.
    - HTTP na każdym zarządzanym hoście (`app1`, `app2`, `app3`):
      - Port i ścieżka: `8080`, `/`.
      - Odpowiedź: `release-81`.
  - Etap 3:
    - Odbiorca w przestrzeni nazw zatoki:
      - Deployment: `relay`.
      - Rollout zakończony.
      - W działającym kontenerze Deployment `relay` dostarczony kontrakt środowiska przekazuje `release-81`.

  Sprawdzenia floty obserwują wartości plików, tryby i HTTP, a nie użyte polecenia; końcowe sprawdzenie odbiorcy odczytuje status rollout i środowisko procesu, a nie udostępnianą treść.
stages.0.brief: Znacznik wydania na workstation musi spełniać kontrakt.
stages.1.brief: Każdy odbiorca floty musi otrzymać wymagane wydanie.
stages.2.brief: Odbiorca Kubernetes musi działać z wymaganym wydaniem.
hints.0.text: Niezależne warstwy dostarczania mogą współdzielić jeden kontrakt wydania.
hints.1.text: |-
  Śledź wydanie od state przez fleet do pod. Każdy stopień ma swój własny live check; zmiana późniejszego systemu nie może zaspokoić wcześniejszego etapu.

  Sprawdź dostarczoną konfigurację i bieżące obserwacje na workstation:

  ```sh
  cat main.tf rollout.yml deployment.yaml
  tofu state list
  ```
hints.2.text: |-
  Zainicjalizuj i zastosuj znacznik z main.tf. Uruchom ansible-playbook rollout.yml z handlerem dq-service reload, aby dostarczyć i przeładować flotę. Napraw deployment.yaml i zaktualizuj środowisko RELEASE w deployment/relay.

  Sprawdź wynik z `~/quest` na workstation:

  - `tofu show -no-color; cat release.txt; tofu plan -input=false -detailed-exitcode -no-color` — Etap 1: stan zawiera `release.txt`, plik pokazuje `release-81`, a plan kończy się kodem `0`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'cat -A /srv/site/message; ls -l /srv/site/message'; for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done` — Etap 2: Każdy host pokazuje `release-81` z najwyżej jednym znacznikiem końca wiersza, tryb pliku `-rw-r--r--` i odpowiedź HTTP `release-81`.
  - `kubectl rollout status deployment/relay --timeout=10s; kubectl exec --pod-running-timeout=5s deployment/relay -c worker -- printenv RELEASE` — Etap 3: rollout się kończy, a proces wypisuje `release-81`.

  Stan śledzi zarządzany plik źródłowy release.txt.
debrief: Kontrole sprawdziły zarządzany znacznik, pliki i odpowiedzi floty oraz rollout i środowisko relay.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Porównałem aktywny zasób ID ze stanem OpenTofu.
