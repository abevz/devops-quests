title: Dostawa międzysystemowa
brief: 'Dołączyłeś do operacji SignalRail. Opublikuj znacznik wydania, skonfiguruj fleet i wdróż reader.
  Pracuj w ~/quest. Wszystkie zmiany przechowuj w tej komorze szkoleniowej.


  Pliki zadań w `~/quest` (niektóre zostały wprowadzone w późniejszych etapach): `inventory.ini`, `ansible.cfg`,
  `main.tf`, `rollout.yml`, `deployment.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Wszystkie zmiany muszą pozostać w tej zatoce.


  Początkowe kryteria sukcesu: znacznik zarządzanej wersji jest poprawny.'
stages.0.brief: 'Przywróć znacznik zarządzanego wydania release-81.


  Kryteria sukcesu: znacznik zarządzanej wersji jest poprawny.'
stages.0.objectives.0.text: Znacznik zarządzanej wersji jest poprawny.
stages.1.brief: 'Uruchomiono alarm na station. Dostarcz release-81 do całego fleet i przeładuj jego live
  banner.


  Kryteria sukcesu: wszystkie trzy aktywne banery fleet przedstawiają release-81.'
stages.1.objectives.0.text: Wszystkie trzy banery floty na żywo przedstawiają release-81.
stages.2.brief: 'release dotarł do station. Pojawił się incydent reader: napraw środowisko RELEASE.


  Kryteria sukcesu: Aktywny reader obsługuje zamierzony release.'
stages.2.objectives.0.text: Aktywny reader obsługuje zamierzony release.
hints.0.text: Śledź wydanie od state przez fleet do pod.
hints.1.text: Każdy stopień ma swój własny live check; zmiana późniejszego systemu nie może zaspokoić
  wcześniejszego etapu.
hints.2.text: Zastosuj znacznik, dostarcz i reload fleet, a następnie napraw środowisko reader.
debrief: Wydanie przekroczyło state, konfigurację hosta i Kubernetes. Zweryfikowałeś zarządzany znacznik,
  wszystkie aktywne banery i ostateczny reader.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Porównałem aktywny zasób ID ze stanem OpenTofu.
