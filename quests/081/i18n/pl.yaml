title: Dostawa międzysystemowa
brief: |-
  Znacznik wydania istnieje, ale jego kontrakt dostarczania nie jest jeszcze spójnie dostępny u odbiorców.

  Pracuj na workstation w `~/quest` z `main.tf`, `modules/delivery/main.tf`, `delivery-schema.json`, `inventory.ini` i `ansible.cfg`. Późniejsze etapy dostarczą `rollout.yml` i `deployment.yaml`.

  **Wymagania:**
  - Wyjście główne `delivery` odpowiada dostarczonemu schematowi dla każdego opisanego przypadku wejściowego i zachowuje zapisaną tożsamość producenta. Skonfigurowany plik producenta pozostaje zarządzanym zasobem w katalogu głównym stanu OpenTofu.
  - Na workstation plik `~/quest/release.txt` zawiera `release-81`; końcowy plan szczegółowy kończy się kodem `0`.
  - Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/message` zawiera dokładnie `release-81`, opcjonalnie z jednym końcem wiersza, i ma tryb `0644`. HTTP na porcie `8080` pod ścieżką `/` zwraca `release-81`.
  - Na każdym zarządzanym hoście plik `/srv/site/delivery.json` ma tryb `0644` i odpowiada wpisowi tego odbiorcy w bieżącym kontrakcie producenta, łącznie z zapisaną tożsamością producenta.
  - Deployment `relay` kończy rollout w namespace środowiska. W jego działającym kontenerze `worker` zmienna `RELEASE` ma wartość `release-81`, a `DELIVERY_CONTRACT` odpowiada bieżącemu strukturalnemu kontraktowi producenta. Przy zakończeniu kontrakty producenta i hostów nadal są zgodne.

  Sprawdzenia obserwują bieżący stan, pliki, HTTP, rollout i środowisko procesu; zgodne dane nie dowodzą historii poleceń ani treści obsługiwanej przez ostatni kontener.
stages.0.brief: Producent główny publikuje bieżący kontrakt z zachowaniem zapisanej tożsamości.
stages.1.brief: Każdy host musi otrzymać swój bieżący kontrakt i obsługiwać wydanie.
stages.2.brief: Działający odbiorca musi zachować ten sam bieżący kontrakt co producent i hosty.
hints.0.text: Niezależni odbiorcy potrzebują tego samego bieżącego kontraktu; sama znajoma nazwa wydania nie identyfikuje
  producenta.
hints.1.text: |-
  Najpierw porównaj dostarczony schemat, konfigurację i bieżący stan. W późniejszych etapach porównuj odebrane dane wraz z tożsamością odbiorcy z bieżącym wyjściem producenta; poprawna odpowiedź sama nie potwierdza tej relacji.

  ```sh
  cat main.tf modules/delivery/main.tf delivery-schema.json
  tofu show -no-color
  tofu output -json delivery
  test ! -f rollout.yml || cat rollout.yml
  test ! -f deployment.yaml || cat deployment.yaml
  ```
hints.2.text: |-
  Zweryfikuj producenta przed dostarczeniem, a następnie każde potwierdzenie i działającego odbiorcę. Potwierdzenia i dane procesu muszą odpowiadać bieżącemu wyjściu, a nie wcześniejszemu eksportowi. Te polecenia obserwują wyniki i nie wykonują napraw.

  ```sh
  tofu output -json delivery
  tofu plan -input=false -detailed-exitcode -no-color
  ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'cat /srv/site/message /srv/site/delivery.json; stat -c %a /srv/site/message /srv/site/delivery.json'
  for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done
  kubectl rollout status deployment/relay --timeout=10s
  kubectl exec --pod-running-timeout=5s deployment/relay -c worker -- printenv RELEASE DELIVERY_CONTRACT
  ```
debrief: Kontrakt producenta podąża teraz za wejściami, zachowuje jego tożsamość i dociera do potwierdzeń hostów
  oraz działającego odbiorcy. Pierwotne pliki wydania, HTTP i środowisko nadal są poprawne.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Porównałem aktywny zasób ID ze stanem OpenTofu.
stages.0.objectives.0.text: Wyjście główne `delivery` podąża za dostarczonym schematem i wejściami z pierwotną tożsamością
  producenta.
stages.0.objectives.1.text: Na workstation `release.txt` zawiera `release-81`.
stages.0.objectives.2.text: OpenTofu nie zgłasza oczekujących zmian infrastruktury.
stages.1.objectives.0.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/message` zawiera
  `release-81` z trybem `0644`, a `/srv/site/delivery.json` odpowiada bieżącemu kontraktowi odbiorcy i ma tryb `0644`.
stages.1.objectives.1.text: HTTP na porcie `8080` zwraca `release-81` na każdym zarządzanym hoście (`app1`, `app2`,
  `app3`).
stages.2.objectives.0.text: Deployment `relay` kończy rollout z bieżącym strukturalnym kontraktem producenta w działającym
  `worker`; producent i hosty nadal są zgodne.
stages.2.objectives.1.text: W działającym kontenerze Deployment `relay` dostarczony kontrakt środowiska przekazuje
  `release-81`.
diagnostics.state: Plik może istnieć tylko na dysku, gdy zarządzany local_file nie został zastosowany, albo stan jest nieczytelny; stan ma zawierać zarządzany zasób dla release.txt. [Przyczyna i kontrola](guides#guide=terraform-3&section=delivery-contract-managed-file)
diagnostics.file: release.txt może brakować lub zawierać starą wartość po ręcznej edycji albo niezastosowanej zmianie; wymagana treść to release-81, z końcowymi znakami nowej linii usuwanymi przez shell. [Przyczyna i kontrola](guides#guide=terraform-3&section=delivery-contract-local-content)
diagnostics.plan: Źródło może mieć niezastosowane zmiany, w tym dostarczony argument retired modułu lub brak output contract, albo plan zawodzi; detailed-exitcode ma zwrócić 0, kod 2 oznacza zmiany, 1 błąd. [Przyczyna i kontrola](guides#guide=terraform-3&section=delivery-contract-no-pending-change)
diagnostics.delivery_producer: Kontrakt potomny może być pusty, ustawiony na retired lub odłączony od zarządzanego pliku, albo pierwotna tożsamość terraform_data.producer została zastąpiona. Bieżący stan/output i plany obu dostarczonych input cases muszą zawierać dokładny strukturalny delivery contract z zachowaną tożsamością; błędy parsowania, poleceń i danych też dają ten marker. [Przyczyna i kontrola](guides#guide=terraform-3&section=delivery-contract-input-and-identity)
diagnostics.probe_0_0: Obserwacja stanu lub kontraktu może zakończyć się przy ładowaniu Python helpers przed nazwanym wynikiem; sprawdź dq_check i czytelność faktów. Nazwane błędy zachowują state lub delivery_producer. [Przyczyna i kontrola](guides#guide=terraform-3&section=delivery-contract-producer-startup)
diagnostics.delivery_fleet: delivery.json na hoście może brakować, mieć mode inne niż 644 lub zawierać inny cel, wydanie albo tożsamość; twórz pełne potwierdzenie JSON z bieżącego wpisu delivery.targets tego hosta. Niezgodność źródła, SSH, parsowanie i polecenia też dają ten marker. [Przyczyna i kontrola](guides#guide=terraform-3&section=delivery-contract-target-receipts)
diagnostics.probe_1_0: Obserwacja plików/potwierdzeń może zakończyć się przed wynikiem przez ładowanie helpers lub brak kontekstu runtime; sprawdź ładowanie i dostarczony kontekst połączeń. Zwykłe błędy plików SSH mają już markery content/mode hosta. [Przyczyna i kontrola](guides#guide=terraform-3&section=delivery-contract-fleet-startup)
diagnostics.content_1: app1 może mieć starą lub brakującą wiadomość albo SSH nie odczytuje jej; /srv/site/message ma zawierać release-81 bez nowej linii albo z dokładnie jedną. Eksportuj bieżący output przed zastosowaniem pustego dostarczonego play. [Przyczyna i kontrola](guides#guide=terraform-3&section=delivery-contract-app1-message)
diagnostics.mode_1: app1 mógł zachować ograniczające prawa lub SSH nie wykonał stat; ustaw jawnie mode 0644 dla /srv/site/message w play. [Przyczyna i kontrola](guides#guide=terraform-3&section=delivery-contract-app1-permissions)
diagnostics.http_1: app1 może serwować starą wiadomość z pamięci mimo poprawnego pliku albo HTTP jest niedostępne; użyj dostarczonego reload handler, aby port 8080 zwracał release-81. [Przyczyna i kontrola](guides#guide=terraform-3&section=delivery-contract-app1-http)
diagnostics.content_2: app2 może mieć starą lub brakującą wiadomość albo SSH nie odczytuje jej; /srv/site/message ma zawierać release-81 bez nowej linii albo z dokładnie jedną. Eksportuj bieżący output przed zastosowaniem pustego dostarczonego play. [Przyczyna i kontrola](guides#guide=terraform-3&section=delivery-contract-app2-message)
diagnostics.mode_2: app2 mógł zachować ograniczające prawa lub SSH nie wykonał stat; ustaw jawnie mode 0644 dla /srv/site/message w play. [Przyczyna i kontrola](guides#guide=terraform-3&section=delivery-contract-app2-permissions)
diagnostics.http_2: app2 może serwować starą wiadomość z pamięci mimo poprawnego pliku albo HTTP jest niedostępne; użyj dostarczonego reload handler, aby port 8080 zwracał release-81. [Przyczyna i kontrola](guides#guide=terraform-3&section=delivery-contract-app2-http)
diagnostics.content_3: app3 może mieć starą lub brakującą wiadomość albo SSH nie odczytuje jej; /srv/site/message ma zawierać release-81 bez nowej linii albo z dokładnie jedną. Eksportuj bieżący output przed zastosowaniem pustego dostarczonego play. [Przyczyna i kontrola](guides#guide=terraform-3&section=delivery-contract-app3-message)
diagnostics.mode_3: app3 mógł zachować ograniczające prawa lub SSH nie wykonał stat; ustaw jawnie mode 0644 dla /srv/site/message w play. [Przyczyna i kontrola](guides#guide=terraform-3&section=delivery-contract-app3-permissions)
diagnostics.http_3: app3 może serwować starą wiadomość z pamięci mimo poprawnego pliku albo HTTP jest niedostępne; użyj dostarczonego reload handler, aby port 8080 zwracał release-81. [Przyczyna i kontrola](guides#guide=terraform-3&section=delivery-contract-app3-http)
diagnostics.rollout: Odbiorca startuje z wydaniem retired i może pozostać niegotowy do aktualizacji skutecznego RELEASE; sprawdź zdarzenia rollout i dostarczony warunek readiness przed kontrolą zgodności. [Przyczyna i kontrola](guides#guide=terraform-3&section=delivery-contract-consumer-rollout)
diagnostics.delivery_relay: Gotowy proces może otrzymywać pusty lub stary DELIVERY_CONTRACT, albo stan źródła, potwierdzenia celów i plan bez zmian są niezgodne. Porównaj rzeczywisty JSON procesu z bieżącym output i pełnymi potwierdzeniami hostów; błędy poleceń, parsowania i danych dzielą ten marker. [Przyczyna i kontrola](guides#guide=terraform-3&section=delivery-contract-end-to-end-agreement)
diagnostics.relay: Proces może nadal używać dostarczonego retired RELEASE po edycji lokalnego manifestu lub ConfigMap; sprawdź rzeczywiste środowisko i uzgodnij/uruchom ponownie do RELEASE=release-81. [Przyczyna i kontrola](guides#guide=terraform-3&section=delivery-contract-effective-release)
diagnostics.probe_2_0: Obserwacja zgodności może zakończyć się przy ładowaniu helpers przed nazwanym wynikiem; sprawdź dq_check. Błędy rollout zachowują rollout, a źródła, potwierdzeń, procesu i poleceń zwykle delivery_relay. [Przyczyna i kontrola](guides#guide=terraform-3&section=delivery-contract-consumer-startup)
