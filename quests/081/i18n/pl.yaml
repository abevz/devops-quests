title: Dostawa międzysystemowa
brief: 'Dołączyłeś do operacji SignalRail. Opublikuj znacznik wydania, skonfiguruj fleet i wdróż reader. Pracuj w ~/quest.
  Wszystkie zmiany przechowuj w tej komorze szkoleniowej.


  Pliki zadań w `~/quest` (niektóre zostały wprowadzone w późniejszych etapach): `inventory.ini`, `ansible.cfg`, `main.tf`,
  `rollout.yml`, `deployment.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie załadowanych obrazów
  i usług prywatnych. Wszystkie zmiany muszą pozostać w tej zatoce.


  Początkowe kryteria sukcesu: znacznik zarządzanej wersji jest poprawny.'
stages.0.brief: 'Przeczytaj `main.tf` w `~/quest`: deklaruje lokalny provider offline i `local_file.release`. Zainicjuj i
  zastosuj znacznik. Sprawdź, czy `tofu state list` zawiera `local_file.release`, `release.txt` zawiera `release-81`, a `tofu
  plan -input=false -detailed-exitcode -no-color` kończy się kodem 0 (brak zmian). Połączony przewodnik wprowadza stan OpenTofu.
  Pracuj tylko w zatoce.'
stages.0.objectives.0.text: Adres stanu i plik wydania są zgodne, a plan kończy się kodem 0.
stages.1.brief: 'Przeczytaj `inventory.ini`, `ansible.cfg` i `rollout.yml` w `~/quest`. Ansible wysyła zadania przez SSH do
  każdego hosta prywatnej floty. Dostarcz `release-81` do `/srv/site/message` z trybem `0644` na app1, app2 i app3. Użyj dostarczonego
  handlera z `dq-service reload`, aby usługa ponownie odczytała plik; uruchom `ansible-playbook rollout.yml`. Sprawdź odpowiedź
  HTTP każdego hosta na porcie 8080: ma wynosić `release-81`. Kontrole sprawdzają pliki, tryby i odpowiedzi; nie dowodzą użytych
  poleceń. Plik wiadomości musi zawierać dokładnie ten tekst, po którym może wystąpić jeden znak nowej linii.'
stages.1.objectives.0.text: Pliki, tryby i odpowiedzi HTTP wszystkich trzech hostów floty odpowiadają `release-81`.
stages.2.brief: Napraw czytnik Kubernetes, korzystając z `deployment.json`. Ustaw `RELEASE` na `release-81` w `deployment/relay`
  i poczekaj na rollout. Kontrola odczytuje środowisko działającego procesu i stan rolloutu; nie sprawdza treści serwowanej
  przez czytnik.
stages.2.objectives.0.text: Rollout relay kończy się, a jego działający proces ma `RELEASE=release-81`.
hints.0.text: Śledź wydanie od state przez fleet do pod.
hints.1.text: Każdy stopień ma swój własny live check; zmiana późniejszego systemu nie może zaspokoić wcześniejszego etapu.
hints.2.text: Zastosuj znacznik, dostarcz i reload fleet, a następnie napraw środowisko reader.
debrief: Kontrole sprawdziły zarządzany znacznik, pliki i odpowiedzi floty oraz rollout i środowisko relay.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Porównałem aktywny zasób ID ze stanem OpenTofu.
