title: Pod logs
brief: 'The route worker crashes after reading a ConfigMap. Find its exact diagnostic line in current
  or previous container logs and save that line in diagnosis.txt. Then repair the source configuration
  and roll out the reader. The Deployment must remain route-worker; the required route is stated by the
  diagnostic.


  Quest files in `~/quest` (some appear in later stages): `route.json`, `worker.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: diagnosis.txt contains the exact diagnostic, and the live route-worker runs
  with ROUTE=north.'
debrief: The logs identified a route mismatch. A new Pod was required because environment variables are
  captured when the container starts; editing a ConfigMap alone is insufficient.
stages.0.brief: 'Capture the evidence before restarting. ConfigMap values injected as environment variables
  do not update inside existing processes.


  Success criteria: diagnosis.txt contains the exact diagnostic, and the live route-worker runs with ROUTE=north.'
stages.0.objectives.0.text: diagnosis.txt contains the exact diagnostic, and the live route-worker runs
  with ROUTE=north.
hints.0.text: Compare current logs with --previous when a container has restarted.
hints.1.text: Follow the environment reference back to its ConfigMap key.
hints.2.text: After repairing the source, recreate the process that read the old environment.
phrases.0: I captured the failed container logs before restarting it.
phrases.1: I corrected the ConfigMap value used by the process.
phrases.2: I replaced the Pod so its environment received the new value.
questions.0.points.0: Previous-container logs and termination details describe a specific failed instance.
questions.0.points.1: Events add timing and the component that initiated the failure.
questions.0.points.2: Save the useful evidence before replacing the Pod.
questions.0.prompt: The Pod has restarted several times. What evidence can disappear when you start another
  rollout?
questions.1.points.0: Distinguish environment injection from a mounted file.
questions.1.points.1: Existing process environments are not rewritten by a ConfigMap update.
questions.1.points.2: A controlled rollout is needed for this environment-based reader.
questions.1.prompt: The ConfigMap is now correct, yet the process still reports the old value. Which update
  path would you check?
