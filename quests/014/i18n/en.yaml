title: Pod logs
brief: |-
  The route processing service repeatedly stops.

  Work on the workstation in `~/quest` with the supplied files:
  - `route.yaml`, `worker.yaml`.

  **Requirements:**

  - Evidence on the workstation:
    - File: `~/quest/diagnosis.txt`.
    - Content: the exact diagnostic line from the current or previous container logs of Deployment `route-worker`.
  - Workload availability:
    - Deployment: `route-worker`.
    - Status: Rollout completes.
  - Runtime route in Deployment `route-worker`:
    - Environment variable: `ROUTE`.
    - Its value matches the route required by the diagnostic.

  Saved evidence and the runtime value do not prove how the diagnosis was reached.
debrief: The logs identified a route mismatch. A new Pod was required because environment variables are
  captured when the container starts; editing a ConfigMap alone is insufficient.
stages.0.brief: Evidence comes from the failed process logs.
stages.0.objectives.0.text: '`diagnosis.txt` contains the exact diagnostic line from the worker''s logs.'
stages.0.objectives.1.text: Deployment `route-worker` completes its rollout.
stages.0.objectives.2.text: Deployment `route-worker` exposes `ROUTE` with the value required by the diagnostic.
hints.0.text: A failing process can describe the configuration contract it needs in its logs.
hints.1.text: |-
  Compare current logs with --previous when a container has restarted. Capture the diagnostic evidence before restarting. Follow the environment reference back to its ConfigMap key. ConfigMap values injected as environment variables do not change inside an existing process.

  Inspect the supplied inputs and live observations:

  ```sh
  kubectl logs deployment/route-worker
  kubectl logs deployment/route-worker --previous
  ```
hints.2.text: |-
  After repairing the source, recreate the process that read the old environment.

  Verify the result from `~/quest` on the workstation:

  - `cat ~/quest/diagnosis.txt` — shows the exact diagnostic line from the failing process, saved on the workstation.
  - `kubectl rollout status deployment/route-worker --timeout=3s` — exits `0` and reports a completed rollout.
  - `kubectl exec deployment/route-worker -- printenv ROUTE` — prints the route required by the saved diagnostic.
phrases.0: I captured the failed container logs before restarting it.
phrases.1: I corrected the ConfigMap value used by the process.
phrases.2: I replaced the Pod so its environment received the new value.
questions.0.points.0: Previous-container logs and termination details describe a specific failed instance.
questions.0.points.1: Events add timing and the component that initiated the failure.
questions.0.points.2: Save the useful evidence before replacing the Pod.
questions.0.prompt: The Pod has restarted several times. What evidence can disappear when you start another
  rollout?
questions.1.points.0: Distinguish environment injection from a mounted file.
questions.1.points.1: Existing process environments are not rewritten by a ConfigMap update.
questions.1.points.2: A controlled rollout is needed for this environment-based reader.
questions.1.prompt: The ConfigMap is now correct, yet the process still reports the old value. Which update
  path would you check?
