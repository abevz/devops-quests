title: Pod-Protokolle
brief: |-
  Der Dienst zur Routenverarbeitung stoppt wiederholt.

  Arbeiten Sie auf der Workstation in `~/quest` mit den bereitgestellten Dateien:
  - `route.yaml`, `worker.yaml`.

  **Anforderungen:**

  - Nachweis auf der Workstation:
    - Datei: `~/quest/diagnosis.txt`.
    - Inhalt: die exakte Diagnosezeile aus den aktuellen oder vorherigen Container-Logs von Deployment `route-worker`.
  - Verfügbarkeit des Workloads:
    - Deployment: `route-worker`.
    - Status: Rollout abgeschlossen.
  - Laufzeitroute in Deployment `route-worker`:
    - Umgebungsvariable: `ROUTE`.
    - Der Wert entspricht der in der Diagnose geforderten Route.

  Gesicherte Belege und Laufzeitwert beweisen nicht, wie die Diagnose zustande kam.
debrief: In den Protokollen wurde eine Nichtübereinstimmung zwischen route festgestellt. Ein neues Pod
  war erforderlich, da Umgebungsvariablen beim Start des Containers erfasst werden; Das Bearbeiten eines
  ConfigMap allein reicht nicht aus.
stages.0.brief: Der Beleg stammt aus den Logs des fehlgeschlagenen Prozesses.
stages.0.objectives.0.text: '`diagnosis.txt` enthält die genaue Diagnosezeile aus den Logs von worker.'
stages.0.objectives.1.text: Deployment `route-worker` schließt seinen Rollout ab.
stages.0.objectives.2.text: Deployment `route-worker` stellt `ROUTE` mit dem in der Diagnose geforderten
  Wert bereit.
hints.0.text: Ein fehlschlagender Prozess kann seinen benötigten Konfigurationsvertrag in den Logs beschreiben.
hints.1.text: |-
  Vergleichen Sie aktuelle Protokolle mit --previous, wenn ein Container neu gestartet wurde. Sichern Sie den Diagnosenachweis vor einem Neustart. Folgen Sie der Umgebungsreferenz zurück zum Schlüssel ConfigMap. Als Umgebungsvariablen übergebene ConfigMap-Werte ändern sich nicht in einem bestehenden Prozess.

  Prüfen Sie die bereitgestellten Eingaben und laufenden Beobachtungen:

  ```sh
  kubectl logs deployment/route-worker
  kubectl logs deployment/route-worker --previous
  ```
hints.2.text: 'Erstellen Sie nach der Reparatur der Quelle den Prozess neu, der die alte Umgebung liest.


  Prüfen Sie das Ergebnis in `~/quest` auf der Workstation:


  - `cat ~/quest/diagnosis.txt` — zeigt die exakte Diagnosezeile des fehlgeschlagenen Prozesses, gespeichert auf der Workstation.

  - `kubectl rollout status deployment/route-worker --timeout=3s` — endet mit Code `0` und meldet einen abgeschlossenen Rollout.

  - `kubectl exec deployment/route-worker -c worker -- printenv ROUTE` — gibt die von der gespeicherten Diagnose geforderte Route aus.'
phrases.0: Ich habe die fehlgeschlagenen Containerprotokolle erfasst, bevor ich sie neu gestartet habe.
phrases.1: Ich habe den vom Prozess verwendeten Wert ConfigMap korrigiert.
phrases.2: Ich habe Pod ersetzt, damit seine Umgebung den neuen Wert erhält.
questions.0.points.0: Vorherige Containerprotokolle und Beendigungsdetails beschreiben eine bestimmte
  fehlgeschlagene Instanz.
questions.0.points.1: Ereignisse fügen das Timing und die Komponente hinzu, die den Fehler ausgelöst hat.
questions.0.points.2: Bewahren Sie die nützlichen Beweise auf, bevor Sie den Pod austauschen.
questions.0.prompt: Der Pod wurde mehrmals neu gestartet. Welche Beweise können verschwinden, wenn Sie
  einen weiteren rollout starten?
questions.1.points.0: Unterscheiden Sie die Umgebungsinjektion von einer gemounteten Datei.
questions.1.points.1: Bestehende Prozessumgebungen werden durch ein ConfigMap-Update nicht neu geschrieben.
questions.1.points.2: Für diesen umgebungsbasierten reader wird ein gesteuerter rollout benötigt.
questions.1.prompt: Der ConfigMap ist jetzt korrekt, der Prozess meldet jedoch immer noch den alten Wert.
  Welchen Update-Pfad würden Sie prüfen?
