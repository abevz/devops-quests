title: Pod-Protokolle
brief: 'Der route worker stürzt nach dem Lesen eines ConfigMap ab. Suchen Sie die genaue Diagnosezeile
  in aktuellen oder früheren Containerprotokollen und speichern Sie diese Zeile in diagnosis.txt. Reparieren
  Sie dann die Quellkonfiguration und führen Sie reader aus. Der Deployment muss route-worker bleiben;
  Der erforderliche route wird von der Diagnose angegeben.


  Questdateien in `~/quest` (einige erscheinen in späteren Phasen): `route.json`, `worker.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: diagnosis.txt enthält die genaue Diagnose und der laufende route-worker läuft
  mit ROUTE=north.'
debrief: In den Protokollen wurde eine Nichtübereinstimmung zwischen route festgestellt. Ein neues Pod
  war erforderlich, da Umgebungsvariablen beim Start des Containers erfasst werden; Das Bearbeiten eines
  ConfigMap allein reicht nicht aus.
stages.0.brief: 'Erfassen Sie die Beweise, bevor Sie neu starten. ConfigMap-Werte, die als Umgebungsvariablen
  eingefügt werden, werden in vorhandenen Prozessen nicht aktualisiert.


  Erfolgskriterien: diagnosis.txt enthält die genaue Diagnose und der laufende route-worker läuft mit
  ROUTE=north.'
stages.0.objectives.0.text: diagnosis.txt enthält die genaue Diagnose, und der laufende route-worker läuft
  mit ROUTE=north.
hints.0.text: Vergleichen Sie aktuelle Protokolle mit --previous, wenn ein Container neu gestartet wurde.
hints.1.text: Folgen Sie der Umgebungsreferenz zurück zum Schlüssel ConfigMap.
hints.2.text: Erstellen Sie nach der Reparatur der Quelle den Prozess neu, der die alte Umgebung liest.
phrases.0: Ich habe die fehlgeschlagenen Containerprotokolle erfasst, bevor ich sie neu gestartet habe.
phrases.1: Ich habe den vom Prozess verwendeten Wert ConfigMap korrigiert.
phrases.2: Ich habe Pod ersetzt, damit seine Umgebung den neuen Wert erhält.
questions.0.points.0: Vorherige Containerprotokolle und Beendigungsdetails beschreiben eine bestimmte
  fehlgeschlagene Instanz.
questions.0.points.1: Ereignisse fügen das Timing und die Komponente hinzu, die den Fehler ausgelöst hat.
questions.0.points.2: Bewahren Sie die nützlichen Beweise auf, bevor Sie den Pod austauschen.
questions.0.prompt: Der Pod wurde mehrmals neu gestartet. Welche Beweise können verschwinden, wenn Sie
  einen weiteren rollout starten?
questions.1.points.0: Unterscheiden Sie die Umgebungsinjektion von einer gemounteten Datei.
questions.1.points.1: Bestehende Prozessumgebungen werden durch ein ConfigMap-Update nicht neu geschrieben.
questions.1.points.2: Für diesen umgebungsbasierten reader wird ein gesteuerter rollout benötigt.
questions.1.prompt: Der ConfigMap ist jetzt korrekt, der Prozess meldet jedoch immer noch den alten Wert.
  Welchen Update-Pfad würden Sie prüfen?
