title: Registros Pod
brief: 'El route worker falla después de leer un ConfigMap. Encuentre su línea de diagnóstico exacta en
  los registros de contenedor actuales o anteriores y guarde esa línea en diagnosis.txt. Luego repare
  la configuración de origen e implemente reader. El Deployment debe permanecer como route-worker; El
  diagnóstico indica el route requerido.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `route.json`, `worker.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: diagnosis.txt contiene el diagnóstico exacto y el route-worker en vivo
  se ejecuta con ROUTE=north..'
debrief: Los registros identificaron una discrepancia en route. Se requirió un nuevo Pod porque las variables
  de entorno se capturan cuando se inicia el contenedor; editar un ConfigMap por sí solo no es suficiente.
stages.0.brief: 'Capture la evidencia antes de reiniciar. Los valores ConfigMap inyectados como variables
  de entorno no se actualizan dentro de los procesos existentes.


  Criterios de éxito: diagnosis.txt contiene el diagnóstico exacto y el route-worker en vivo se ejecuta
  con ROUTE=north..'
stages.0.objectives.0.text: diagnosis.txt contiene el diagnóstico exacto y el route-worker en vivo se
  ejecuta con ROUTE=north..
hints.0.text: Compare los registros actuales con --previous cuando se reinicie un contenedor.
hints.1.text: Siga la referencia del entorno hasta su clave ConfigMap.
hints.2.text: Después de reparar la fuente, vuelva a crear el proceso que leyó el entorno anterior.
phrases.0: Capturé los registros del contenedor fallido antes de reiniciarlo.
phrases.1: Corregí el valor ConfigMap utilizado por el proceso.
phrases.2: Reemplacé el Pod para que su entorno recibiera el nuevo valor.
questions.0.points.0: Los registros del contenedor anterior y los detalles de terminación describen una
  instancia fallida específica.
questions.0.points.1: Los eventos agregan tiempo y el componente que inició la falla.
questions.0.points.2: Guarde la evidencia útil antes de reemplazar el Pod.
questions.0.prompt: El Pod se ha reiniciado varias veces. ¿Qué evidencia puede desaparecer al iniciar
  otro rollout?
questions.1.points.0: Distinga la inyección de entorno de un archivo montado.
questions.1.points.1: Los entornos de procesos existentes no se reescriben mediante una actualización
  de ConfigMap.
questions.1.points.2: Se necesita un rollout controlado para este reader basado en entorno.
questions.1.prompt: El ConfigMap ahora es correcto, pero el proceso aún informa el valor anterior. ¿Qué
  ruta de actualización comprobarías?
