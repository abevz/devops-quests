title: Registros Pod
brief: |
  El servicio de procesamiento de rutas se detiene repetidamente.

  Trabaja en la workstation en `~/quest` con `route.yaml`, `worker.yaml`.

  **Requisitos:**
  - Evidencia en la workstation:
    - Archivo: `~/quest/diagnosis.txt`.
    - Contenido: la línea de diagnóstico exacta de los logs actuales o anteriores del contenedor de Deployment `route-worker`.
  - Disponibilidad de la carga:
    - Deployment: `route-worker`.
    - Estado: Rollout completado.
  - Ruta en ejecución en Deployment `route-worker`:
    - Variable de entorno: `ROUTE`.
    - Su valor coincide con la ruta requerida por el diagnóstico.

  **Verifica antes de Check & finish:**
  - `cat ~/quest/diagnosis.txt` — muestra la línea de diagnóstico exacta del proceso fallido, guardada en la workstation.
  - `kubectl rollout status deployment/route-worker --timeout=3s` — termina con código `0` e informa de un rollout completado.
  - `kubectl exec deployment/route-worker -- printenv ROUTE` — imprime la ruta requerida por el diagnóstico guardado.
debrief: Los registros identificaron una discrepancia en route. Se requirió un nuevo Pod porque las variables
  de entorno se capturan cuando se inicia el contenedor; editar un ConfigMap por sí solo no es suficiente.
stages.0.brief: |
  El diagnóstico y el servicio en ejecución deben coincidir.
stages.0.objectives.0.text: '`diagnosis.txt` contiene la línea exacta de diagnóstico de los logs del worker.'
stages.0.objectives.1.text: El Deployment `route-worker` completa su rollout.
stages.0.objectives.2.text: El Deployment `route-worker` expone `ROUTE` con el valor indicado en el diagnóstico.
hints.0.text: |
  Compare los registros actuales con --previous cuando se reinicie un contenedor. Guarda la evidencia de diagnóstico antes de reiniciar.
hints.1.text: |
  Siga la referencia del entorno hasta su clave ConfigMap. Los valores de ConfigMap inyectados como variables de entorno no cambian dentro de un proceso existente.
hints.2.text: Después de reparar la fuente, vuelva a crear el proceso que leyó el entorno anterior.
phrases.0: Capturé los registros del contenedor fallido antes de reiniciarlo.
phrases.1: Corregí el valor ConfigMap utilizado por el proceso.
phrases.2: Reemplacé el Pod para que su entorno recibiera el nuevo valor.
questions.0.points.0: Los registros del contenedor anterior y los detalles de terminación describen una
  instancia fallida específica.
questions.0.points.1: Los eventos agregan tiempo y el componente que inició la falla.
questions.0.points.2: Guarde la evidencia útil antes de reemplazar el Pod.
questions.0.prompt: El Pod se ha reiniciado varias veces. ¿Qué evidencia puede desaparecer al iniciar
  otro rollout?
questions.1.points.0: Distinga la inyección de entorno de un archivo montado.
questions.1.points.1: Los entornos de procesos existentes no se reescriben mediante una actualización
  de ConfigMap.
questions.1.points.2: Se necesita un rollout controlado para este reader basado en entorno.
questions.1.prompt: El ConfigMap ahora es correcto, pero el proceso aún informa el valor anterior. ¿Qué
  ruta de actualización comprobarías?
