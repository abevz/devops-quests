title: Dzienniki Pod
brief: 'worker trasy ulega awarii po odczytaniu ConfigMap. Znajdź dokładną linię diagnostyczną w bieżących
  lub poprzednich dziennikach kontenerów i zapisz tę linię w diagnosis.txt. Następnie napraw konfigurację
  źródłową i wdróż reader. Deployment musi pozostać route-worker; wymagana trasa jest wskazywana przez
  diagnostykę.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `route.json`, `worker.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: diagnosis.txt zawiera dokładną diagnostykę, a na żywo route-worker działa
  z ROUTE=north.'
debrief: Dzienniki wykazały niezgodność trasy. Wymagany był nowy Pod, ponieważ zmienne środowiskowe są
  przechwytywane podczas uruchamiania kontenera; edycja samego ConfigMap jest niewystarczająca.
stages.0.brief: 'Przechwyć dowody przed ponownym uruchomieniem. Wartości ConfigMap wstrzykiwane jako zmienne
  środowiskowe nie są aktualizowane w istniejących procesach.


  Kryteria sukcesu: diagnosis.txt zawiera dokładną diagnostykę, a działający route-worker działa z ROUTE=north.'
stages.0.objectives.0.text: diagnosis.txt zawiera dokładną diagnostykę, a na żywo route-worker działa
  z ROUTE=north.
hints.0.text: Porównaj bieżące logi z --previous po ponownym uruchomieniu kontenera.
hints.1.text: Postępuj zgodnie z odniesieniem do środowiska z powrotem do jego klucza ConfigMap.
hints.2.text: Po naprawieniu źródła odtwórz proces odczytujący stare środowisko.
phrases.0: Przechwyciłem nieudane dzienniki kontenerów przed ponownym uruchomieniem.
phrases.1: Poprawiłem wartość ConfigMap używaną przez proces.
phrases.2: Wymieniłem Pod dzięki czemu jego środowisko otrzymało nową wartość.
questions.0.points.0: Dzienniki poprzedniego kontenera i szczegóły zakończenia opisują konkretne wystąpienie
  zakończone niepowodzeniem.
questions.0.points.1: Zdarzenia dodają czas i komponent, który zainicjował awarię.
questions.0.points.2: Zapisz przydatne dowody przed wymianą Pod.
questions.0.prompt: Pod uruchomił się ponownie kilka razy. Jakie dowody mogą zniknąć po uruchomieniu kolejnego
  rollout?
questions.1.points.0: Rozróżnij wstrzykiwanie środowiska od zamontowanego pliku.
questions.1.points.1: Istniejące środowiska procesowe nie są przepisywane przez aktualizację ConfigMap.
questions.1.points.2: Do tego opartego na środowisku reader potrzebny jest kontrolowany rollout.
questions.1.prompt: ConfigMap jest teraz poprawny, ale proces nadal zgłasza starą wartość. Którą ścieżkę
  aktualizacji byś sprawdził?
