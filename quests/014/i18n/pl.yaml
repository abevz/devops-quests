title: Dzienniki Pod
brief: |-
  Usługa przetwarzania trasy wielokrotnie się zatrzymuje.

  Pracuj na workstation w `~/quest` z dostarczonymi plikami:
  - `route.yaml`, `worker.yaml`.

  **Wymagania:**

  - Dowód na workstation:
    - Plik: `~/quest/diagnosis.txt`.
    - Treść: dokładny wiersz diagnostyczny z bieżących lub poprzednich logów kontenera Deployment `route-worker`.
  - Dostępność obciążenia:
    - Deployment: `route-worker`.
    - Stan: Rollout zakończony.
  - Trasa działającego procesu w Deployment `route-worker`:
    - Zmienna środowiskowa: `ROUTE`.
    - Wartość odpowiada trasie wymaganej w diagnostyce.

  Zapisane dowody i wartość w czasie działania nie dowodzą, jak postawiono diagnozę.
debrief: Dzienniki wykazały niezgodność trasy. Wymagany był nowy Pod, ponieważ zmienne środowiskowe są
  przechwytywane podczas uruchamiania kontenera; edycja samego ConfigMap jest niewystarczająca.
stages.0.brief: Dowód pochodzi z logów procesu zakończonego błędem.
stages.0.objectives.0.text: '`diagnosis.txt` zawiera dokładny wiersz diagnostyczny z logów worker.'
stages.0.objectives.1.text: Deployment `route-worker` kończy rollout.
stages.0.objectives.2.text: Deployment `route-worker` udostępnia `ROUTE` o wartości wskazanej w komunikacie
  diagnostycznym.
hints.0.text: Proces kończący się błędem może opisać wymagany kontrakt konfiguracji w swoich logach.
hints.1.text: |-
  Porównaj bieżące logi z --previous po ponownym uruchomieniu kontenera. Zachowaj dowód diagnostyczny przed ponownym uruchomieniem. Postępuj zgodnie z odniesieniem do środowiska z powrotem do jego klucza ConfigMap. Wartości ConfigMap wstrzyknięte jako zmienne środowiskowe nie zmieniają się wewnątrz istniejącego procesu.

  Sprawdź dostarczone dane i bieżące obserwacje:

  ```sh
  kubectl logs deployment/route-worker
  kubectl logs deployment/route-worker --previous
  ```
hints.2.text: |-
  Po naprawieniu źródła odtwórz proces odczytujący stare środowisko.

  Sprawdź wynik z `~/quest` na workstation:

  - `cat ~/quest/diagnosis.txt` — pokazuje dokładny wiersz diagnostyczny błędnie działającego procesu, zapisany na workstation.
  - `kubectl rollout status deployment/route-worker --timeout=3s` — kończy się kodem `0` i zgłasza zakończony rollout.
  - `kubectl exec deployment/route-worker -- printenv ROUTE` — wypisuje trasę wymaganą w zapisanej diagnostyce.
phrases.0: Przechwyciłem nieudane dzienniki kontenerów przed ponownym uruchomieniem.
phrases.1: Poprawiłem wartość ConfigMap używaną przez proces.
phrases.2: Wymieniłem Pod dzięki czemu jego środowisko otrzymało nową wartość.
questions.0.points.0: Dzienniki poprzedniego kontenera i szczegóły zakończenia opisują konkretne wystąpienie
  zakończone niepowodzeniem.
questions.0.points.1: Zdarzenia dodają czas i komponent, który zainicjował awarię.
questions.0.points.2: Zapisz przydatne dowody przed wymianą Pod.
questions.0.prompt: Pod uruchomił się ponownie kilka razy. Jakie dowody mogą zniknąć po uruchomieniu kolejnego
  rollout?
questions.1.points.0: Rozróżnij wstrzykiwanie środowiska od zamontowanego pliku.
questions.1.points.1: Istniejące środowiska procesowe nie są przepisywane przez aktualizację ConfigMap.
questions.1.points.2: Do tego opartego na środowisku reader potrzebny jest kontrolowany rollout.
questions.1.prompt: ConfigMap jest teraz poprawny, ale proces nadal zgłasza starą wartość. Którą ścieżkę
  aktualizacji byś sprawdził?
