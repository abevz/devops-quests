title: Логи pod
brief: 'Route worker падает после чтения ConfigMap. Найдите точную диагностическую строку в текущих или
  предыдущих логах контейнера и сохраните её в diagnosis.txt. Затем исправьте исходную конфигурацию и
  обновите reader. Сохраните Deployment route-worker; требуемый маршрут указан в диагностике.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `route.json`, `worker.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: diagnosis.txt содержит точную диагностику, работающий route-worker использует ROUTE=north.'
debrief: 'Логи показали несовпадение маршрута. Понадобился новый Pod: env фиксируется при запуске контейнера,
  одной правки ConfigMap недостаточно.'
stages.0.brief: 'Сохраните свидетельство до перезапуска. Значение ConfigMap, переданное как env, не меняется
  в уже работающем процессе.


  Результат проверки: diagnosis.txt содержит точную диагностику, работающий route-worker использует ROUTE=north.'
stages.0.objectives.0.text: diagnosis.txt содержит точную диагностику, работающий route-worker использует
  ROUTE=north.
hints.0.text: При рестартах сравните текущие логи с --previous.
hints.1.text: Проследите env до ключа ConfigMap.
hints.2.text: После исправления источника пересоздайте процесс со старым env.
phrases.0: Я сохранил логи упавшего контейнера до перезапуска.
phrases.1: Я исправил значение ConfigMap, используемое процессом.
phrases.2: Я заменил Pod, чтобы его окружение получило новое значение.
questions.0.points.0: Логи предыдущего контейнера и завершение относятся к конкретному отказавшему экземпляру.
questions.0.points.1: События добавляют время и компонент, инициировавший отказ.
questions.0.points.2: Сохраните полезные свидетельства до замены Pod.
questions.0.prompt: Pod уже несколько раз перезапускался. Какие свидетельства можно потерять новым rollout?
questions.1.points.0: Отличите передачу через env от смонтированного файла.
questions.1.points.1: Обновление ConfigMap не переписывает env работающего процесса.
questions.1.points.2: Для этого reader с env нужен управляемый rollout.
questions.1.prompt: ConfigMap уже правильный, но процесс видит старое значение. Какой путь обновления
  нужно проверить?
