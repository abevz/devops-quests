title: Логи pod
brief: |-
  Сервис обработки маршрута постоянно останавливается.

  Работайте на workstation в `~/quest` с предоставленными файлами:
  - `route.yaml`, `worker.yaml`.

  **Требования:**

  - Свидетельство на workstation:
    - Файл: `~/quest/diagnosis.txt`.
    - Содержимое: точная диагностическая строка из текущих или предыдущих логов контейнера Deployment `route-worker`.
  - Доступность нагрузки:
    - Deployment: `route-worker`.
    - Состояние: Rollout завершён.
  - Маршрут работающего процесса в Deployment `route-worker`:
    - Переменная окружения: `ROUTE`.
    - Значение соответствует маршруту, требуемому в диагностике.

  Сохранённое свидетельство и значение процесса не доказывают, как был поставлен диагноз.
debrief: 'Логи показали несовпадение маршрута. Понадобился новый Pod: env фиксируется при запуске контейнера,
  одной правки ConfigMap недостаточно.'
stages.0.brief: Свидетельство берётся из логов сбойного процесса.
stages.0.objectives.0.text: '`diagnosis.txt` содержит точную строку диагностики из логов worker.'
stages.0.objectives.1.text: Deployment `route-worker` завершает rollout.
stages.0.objectives.2.text: В Deployment `route-worker` переменная `ROUTE` имеет значение, указанное в
  диагностике.
hints.0.text: Сбойный процесс может описать требуемый контракт конфигурации в своих логах.
hints.1.text: |-
  При рестартах сравните текущие логи с --previous. Сохраните диагностическое свидетельство до перезапуска. Проследите env до ключа ConfigMap. Значения ConfigMap, переданные как переменные окружения, не изменяются внутри существующего процесса.

  Изучите предоставленные файлы и живые наблюдения:

  ```sh
  kubectl logs deployment/route-worker
  kubectl logs deployment/route-worker --previous
  ```
hints.2.text: |-
  После исправления источника пересоздайте процесс со старым env.

  Проверьте результат из `~/quest` на workstation:

  - `cat ~/quest/diagnosis.txt` — показывает точную диагностическую строку сбойного процесса, сохранённую на workstation.
  - `kubectl rollout status deployment/route-worker --timeout=3s` — завершается с кодом `0` и сообщает о завершённом rollout.
  - `kubectl exec deployment/route-worker -- printenv ROUTE` — выводит маршрут, требуемый в сохранённой диагностике.
phrases.0: Я сохранил логи упавшего контейнера до перезапуска.
phrases.1: Я исправил значение ConfigMap, используемое процессом.
phrases.2: Я заменил Pod, чтобы его окружение получило новое значение.
questions.0.points.0: Логи предыдущего контейнера и завершение относятся к конкретному отказавшему экземпляру.
questions.0.points.1: События добавляют время и компонент, инициировавший отказ.
questions.0.points.2: Сохраните полезные свидетельства до замены Pod.
questions.0.prompt: Pod уже несколько раз перезапускался. Какие свидетельства можно потерять новым rollout?
questions.1.points.0: Отличите передачу через env от смонтированного файла.
questions.1.points.1: Обновление ConfigMap не переписывает env работающего процесса.
questions.1.points.2: Для этого reader с env нужен управляемый rollout.
questions.1.prompt: ConfigMap уже правильный, но процесс видит старое значение. Какой путь обновления
  нужно проверить?
