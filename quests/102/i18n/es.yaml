diagnostics.strategy: El Deployment puede seguir usando Recreate, que quita los Pods existentes antes del reemplazo. Verifique que la estrategia activa sea RollingUpdate. [Causa y comprobación](guides#guide=kubernetes-workloads&section=q102-rolling-strategy)
diagnostics.rolling: El presupuesto puede permitir Pods no disponibles o resolver a otro excedente. Calcule con las réplicas deseadas, redondeando surge hacia arriba y unavailable hacia abajo. Debe quedar uno adicional y cero no disponibles. [Causa y comprobación](guides#guide=kubernetes-workloads&section=q102-replacement-budget)
diagnostics.readiness: La sonda de worker puede seguir en 8099 o usar otro protocolo, host o puerto nombrado. Revise la única acción HTTP del worker y resuelva su puerto a 8080. [Causa y comprobación](guides#guide=kubernetes-workloads&section=q102-worker-http-readiness)
diagnostics.uid_file: El UID original fijado puede faltar o estar vacío. Compruebe el registro original antes de comparar con el UID activo. [Causa y comprobación](guides#guide=kubernetes-workloads&section=q102-original-deployment-receipt)
diagnostics.uid: Volver a crear el Deployment con el mismo nombre cambia el UID de forma irreversible. Compare el UID activo con el registro original antes de revertir el objeto existente. [Causa y comprobación](guides#guide=kubernetes-workloads&section=q102-deployment-identity)
diagnostics.replicas: El escalado o reemplazo del manifiesto puede haber cambiado el total deseado. Compruebe que .spec.replicas siga en dos. [Causa y comprobación](guides#guide=kubernetes-workloads&section=q102-desired-replicas)
diagnostics.ready: Incluso con dos réplicas deseadas, los workers de reemplazo pueden fallar la sonda. Revise los Pods actuales y espere dos réplicas listas en el estado del Deployment. [Causa y comprobación](guides#guide=kubernetes-workloads&section=q102-ready-replica-count)
diagnostics.http_v1: La reversión puede no haber recuperado la respuesta original o el Service puede no tener endpoints listos. Lea la respuesta de board y compárela con north-102. [Causa y comprobación](guides#guide=kubernetes-workloads&section=q102-baseline-service-response)
diagnostics.http_v3: Los Pods nuevos pueden seguir sin estar listos, o el Service puede dirigir temporalmente las solicitudes a workers antiguos. Compare la respuesta con north-102-v3 tras el despliegue y revise aparte los timeouts o endpoints ausentes. [Causa y comprobación](guides#guide=kubernetes-workloads&section=q102-updated-service-response)
diagnostics.probe_0_0: El observador puede detenerse antes de indicar estrategia, presupuesto o sonda si Python no inicia. Revise Python y el acceso al Deployment board. [Causa y comprobación](guides#guide=kubernetes-workloads&section=q102-rollout-observer-input)
diagnostics.probe_1_0: El observador puede detenerse antes de indicar estrategia, presupuesto o sonda si Python no inicia. Revise Python y el acceso al Deployment board. [Causa y comprobación](guides#guide=kubernetes-workloads&section=q102-rollout-observer-input)
diagnostics.probe_1_2: El observador HTTP puede detenerse antes de mostrar la última respuesta si falla Python o su entrada. Revise las herramientas y el Service antes de reintentar. [Causa y comprobación](guides#guide=kubernetes-workloads&section=q102-service-observer-input)
