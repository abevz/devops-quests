title: Estrategias de implementación y reversión
brief: 'Trabaja en `~/quest` con `board.json`, `service.json`, `healthy-revision` y `original-deployment-uid`. Se desplegó
  una readiness probe defectuosa con `Recreate`, retirando el board anterior. La revisión registrada es un punto de partida:
  inspecciona el historial y usa `kubectl rollout undo deployment/board --to-revision=N`, sustituyendo N por `healthy-revision`.
  Configura `RollingUpdate` con exactamente `maxUnavailable: 0` y `maxSurge: 1` numéricos, sin campos rollingUpdate adicionales.
  Conserva el UID original del Deployment y dos réplicas. Espera dos réplicas listas y comprueba el puerto HTTP de readiness
  8080 del primer contenedor y la respuesta `north-102` de `board:8080`. La siguiente etapa introduce contenido nuevo; repara
  su probe y verifica `north-102-v3`. Las comprobaciones observan configuración y respuestas actuales, no toda la plantilla
  histórica ni qué comandos se usaron. Trabaja solo en la bahía sin conexión.'
debrief: Las comprobaciones observaron la identidad del Deployment, la estrategia, el puerto de readiness y la respuesta de
  cada etapa.
stages.0.brief: El UID original del Deployment, dos réplicas listas, estrategia indicada, puerto de readiness 8080 y respuesta
  `north-102` coinciden con la descripción.
