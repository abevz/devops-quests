title: Estrategias de implementación y reversión
brief: 'Se implementó un readiness probe incorrecto con Recreate, derribando el antiguo board. Recupere
  la plantilla saludable registrada con rollout undo y configure RollingUpdate con maxUnavailable: 0 y
  maxSurge: 1 para cambios futuros. Conserve el Deployment UID y dos réplicas. Una segunda etapa introduce
  una nueva revisión de board con un probe defectuoso; repare ese probe en lugar de revertir el nuevo
  contenido. La estrategia por sí sola no garantiza la disponibilidad: readiness, la capacidad excedente
  y el comportamiento de las aplicaciones también son importantes.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `board.json`, `service.json`,
  `healthy-revision`, `original-deployment-uid`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: la plantilla en buen estado registrada se restaura en el mismo Deployment;
  Hay dos réplicas listas y se configuran límites de seguridad de actualización continua.'
debrief: La recuperación separó la estrategia de implementación, el historial de plantillas y readiness
  en lugar de tratar a undo como una política de disponibilidad completa.
stages.0.brief: 'Criterios de éxito: la plantilla en buen estado registrada se restaura en el mismo Deployment;
  Hay dos réplicas listas y se configuran límites de seguridad de actualización continua.'
stages.0.objectives.0.text: La plantilla sana registrada se restaura en el mismo Deployment; Hay dos réplicas
