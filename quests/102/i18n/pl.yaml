title: Strategie wdrażania i wycofywania
brief: 'Zły readiness probe został wdrożony wraz z Recreate, zdejmując starą board. Odzyskaj zarejestrowany
  zdrowy szablon za pomocą rollout undo i skonfiguruj RollingUpdate za pomocą maxUnavailable: 0 i maxSurge:
  1 na potrzeby przyszłych zmian. Zachowaj Deployment UID i dwie repliki. Drugi etap wprowadza nową wersję
  board ze złym probe; napraw probe zamiast wycofywać nową zawartość. Sama strategia nie gwarantuje dostępności:
  readiness, wolne moce produkcyjne i zachowanie aplikacji również mają znaczenie.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `board.json`, `service.json`,
  `healthy-revision`, `original-deployment-uid`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: zarejestrowany, zdrowy szablon zostanie przywrócony na tym samym urządzeniu
  Deployment; dwie repliki są gotowe i skonfigurowano limity bezpieczeństwa aktualizacji stopniowej.'
debrief: Oddzielna strategia wdrażania, historia szablonów i readiness, zamiast traktowania undo jako
  kompletnej polityki dostępności.
stages.0.brief: 'Kryteria sukcesu: Zarejestrowany zdrowy szablon zostaje przywrócony na tym samym urządzeniu
  Deployment; dwie repliki są gotowe i skonfigurowano limity bezpieczeństwa aktualizacji stopniowej.'
