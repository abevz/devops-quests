title: Strategie wdrażania i wycofywania
brief: "Dostępność usługi została utracona podczas wydania. Przywróć pierwszą odpowiedź, a następnie zachowaj\
  \ nową treść wprowadzaną w kolejnym etapie.\n\nPracuj w `~/quest` na workstation. Dostarczone pliki: `board.yaml`,\
  \ `service.yaml`, `healthy-revision`.\n\n**Wymagania:**\n- Etap 1:\n  - Deployment `board` zastępuje repliki\
  \ bez planowanej niedostępności, z najwyżej `1` dodatkową repliką i dostarczonym zachowaniem gotowości HTTP.\n\
  \  - Oryginalny Deployment `board` zachowuje dokładnie `2` repliki, obie gotowe.\n  - Z `deployment/board`\
  \ HTTP `http://board:8080` zwraca `north-102`.\n- Etap 2:\n  - Deployment `board` zastępuje repliki bez planowanej\
  \ niedostępności, z najwyżej `1` dodatkową repliką i dostarczonym zachowaniem gotowości HTTP.\n  - Oryginalny\
  \ Deployment `board` zachowuje dokładnie `2` repliki, obie gotowe.\n  - Z `deployment/board` HTTP `http://board:8080`\
  \ zwraca `north-102-v3`.\n\nSprawdzane są bieżące ustawienia i odpowiedzi, nie cały historyczny szablon ani\
  \ użyte polecenia.\n"
debrief: Kontrole sprawdziły tożsamość Deployment, strategię, port readiness i odpowiedź każdego etapu.
stages.0.brief: Przywróć początkową odpowiedź z oryginalnym Deployment i wymaganymi ustawieniami dostępności.
stages.1.brief: Zachowaj dostępność treści następnego etapu z tą samą tożsamością i gwarancjami dostępności.
hints.0.text: Wydanie musi równoważyć postęp wymiany z ciągłą dostępnością usługi.
hints.1.text: |-
  Recreate usuwa starą rewizję przed gotowością nowej. Tutaj nieprawidłową sondę readiness wdrożono z Recreate.

  Undo zmienia szablon Pod; strategy jest odrębnym polem Deployment.

  Sprawdź dostarczone definicje, bieżące zasoby i zdarzenia.

  Przywróć znaną zdrową rewizję, zachowaj limity rolling i zdiagnozuj następną sondę bez utraty nowej treści. Sprawdź historię i użyj kubectl rollout undo deployment/board --to-revision=N z N z healthy-revision. Użyj RollingUpdate z liczbowymi maxUnavailable=0 i maxSurge=1, bez dodatkowych pól rollingUpdate.

  ```sh
  cat board.yaml
  kubectl get deployment board -o yaml
  kubectl rollout history deployment/board
  ```
hints.2.text: |-
  Sprawdź obserwowany wynik:

  ```sh
  kubectl rollout status deployment/board --timeout=3s
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080
  ```

  Oczekuj dwóch gotowych replik i north-102 w etapie 1, następnie north-102-v3 w etapie 2; przez cały czas zachowaj oryginalny Deployment.

  Dostarczone ograniczenia i szczegóły: Deployment `board` używa `RollingUpdate` z `0` niedostępnych i `1` dodatkową repliką oraz HTTP readiness na porcie `8080`. Deployment `board` używa `RollingUpdate` z `0` niedostępnych i `1` dodatkową repliką oraz HTTP readiness na porcie `8080`.
phrases.0: Odzyskałem znaną, zdrową wersję Deployment.
phrases.1: Skonfigurowałem jawnie limity przepięć i unavailable.
phrases.2: Po wdrożeniu zweryfikowałem nową zawartość i readiness.
questions.0.points.0: NIE; W readiness liczy się także poprawność, pojemność i zamykanie aplikacji.
questions.0.points.1: Ogranicza dostępny budżet repliki kontrolera.
questions.0.prompt: Czy maxUnavailable zero gwarantuje zero przestojów?
questions.1.points.0: Przywraca poprzedni szablon Pod z historii wersji.
questions.1.points.1: Przejrzyj oddzielnie strategy i inne pola niebędące szablonami.
questions.1.prompt: Czy rollout undo przywraca każde pole Deployment?
stages.0.objectives.0.text: Deployment `board` zastępuje repliki bez planowanej niedostępności, z najwyżej
  `1` dodatkową repliką i dostarczonym zachowaniem gotowości HTTP.
stages.0.objectives.1.text: Oryginalny Deployment `board` zachowuje dokładnie `2` repliki, obie gotowe.
stages.0.objectives.2.text: Z `deployment/board` HTTP `http://board:8080` zwraca `north-102`.
stages.1.objectives.0.text: Deployment `board` zastępuje repliki bez planowanej niedostępności, z najwyżej
  `1` dodatkową repliką i dostarczonym zachowaniem gotowości HTTP.
stages.1.objectives.1.text: Oryginalny Deployment `board` zachowuje dokładnie `2` repliki, obie gotowe.
stages.1.objectives.2.text: Z `deployment/board` HTTP `http://board:8080` zwraca `north-102-v3`.
diagnostics.strategy: Deployment może nadal używać Recreate, które usuwa istniejące pody przed zastąpieniem. Sprawdź, czy aktywna strategia to RollingUpdate. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q102-rolling-strategy)
diagnostics.rolling: Budżet może zezwalać na niedostępność podów lub dawać inną liczbę dodatkowych replik. Dla żądanej liczby zaokrąglij surge w górę, a unavailable w dół. Potrzeba jednej dodatkowej i zera niedostępnych. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q102-replacement-budget)
diagnostics.readiness: Sonda gotowości kontenera worker może nadal wskazywać 8099, inny protokół, host lub nazwany port. Sprawdź pojedynczą akcję HTTP w kontenerze worker i jej port 8080. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q102-worker-http-readiness)
diagnostics.uid_file: Zamrożony UID pierwotnego Deploymentu może być niedostępny lub pusty. Sprawdź zapis przed porównaniem z aktualnym UID. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q102-original-deployment-receipt)
diagnostics.uid: Ponowne utworzenie Deploymentu pod tą samą nazwą trwale zmienia UID. Przed wycofaniem istniejącego obiektu porównaj jego aktualny UID z pierwotnym zapisem. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q102-deployment-identity)
diagnostics.replicas: Skalowanie lub zastąpienie manifestu mogło zmienić żądaną liczbę. Sprawdź, czy .spec.replicas nadal wynosi dwa. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q102-desired-replicas)
diagnostics.ready: Przy dwóch żądanych replikach nowi workerzy mogą nie przechodzić gotowości. Sprawdź bieżące pody i poczekaj na dwie gotowe repliki w statusie Deploymentu. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q102-ready-replica-count)
diagnostics.http_v1: Wycofanie mogło nie przywrócić pierwotnej odpowiedzi lub Service może nie mieć gotowych endpointów. Odczytaj odpowiedź board i porównaj z north-102. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q102-baseline-service-response)
diagnostics.http_v3: Nowe pody mogą nadal nie przechodzić gotowości lub Service może chwilowo kierować do starszych workerów. Po wdrożeniu porównaj odpowiedź z north-102-v3 i osobno sprawdź timeouty lub brak endpointów. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q102-updated-service-response)
diagnostics.probe_0_0: Kontrola wdrożenia może przerwać działanie przed wskazaniem strategii, budżetu lub sondy, gdy Python nie startuje. Sprawdź Python i dostęp do Deployment board. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q102-rollout-observer-input)
diagnostics.probe_1_0: Kontrola wdrożenia może przerwać działanie przed wskazaniem strategii, budżetu lub sondy, gdy Python nie startuje. Sprawdź Python i dostęp do Deployment board. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q102-rollout-observer-input)
diagnostics.probe_1_2: Kontrola HTTP może nie dojść do podania ostatniej odpowiedzi przez błąd Pythona lub wejścia. Sprawdź narzędzia i aktywny Service przed powtórką. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q102-service-observer-input)
