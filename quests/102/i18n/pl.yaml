title: Strategie wdrażania i wycofywania
brief: 'Pracuj w `~/quest` z `board.json`, `service.json`, `healthy-revision` i `original-deployment-uid`. Błędny readiness
  probe wdrożono z `Recreate`, co wyłączyło stary board. Zapisana rewizja jest punktem wyjścia do naprawy: sprawdź historię
  rolloutu i użyj `kubectl rollout undo deployment/board --to-revision=N`, zastępując N wartością `healthy-revision`. Ustaw
  `RollingUpdate` z dokładnie liczbowymi `maxUnavailable: 0` i `maxSurge: 1`, bez dodatkowych pól rollingUpdate. Zachowaj
  pierwotny UID Deployment i dwie repliki. Poczekaj na dwie gotowe repliki, sprawdź port HTTP readiness pierwszego kontenera
  8080 i odpowiedź `north-102` z `board:8080`. Następny etap wprowadza nową treść; napraw probe i sprawdź `north-102-v3`.
  Kontrole obserwują bieżące ustawienia i odpowiedzi, a nie cały historyczny szablon ani użyte polecenia. Pracuj tylko w zatoce
  offline.'
debrief: Kontrole sprawdziły tożsamość Deployment, strategię, port readiness i odpowiedź każdego etapu.
stages.0.brief: Pierwotny UID Deployment, dwie gotowe repliki, podana strategia, port readiness 8080 i odpowiedź `north-102`
  odpowiadają opisowi.
stages.0.objectives.0.text: Pierwotny UID Deployment, dwie gotowe repliki, podana strategia, port readiness 8080 i odpowiedź
  `north-102` odpowiadają opisowi.
