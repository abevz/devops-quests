title: Strategie wdrażania i wycofywania
brief: "Dostępność usługi została utracona podczas wydania. Przywróć pierwszą odpowiedź, a następnie zachowaj nową\
  \ treść wprowadzaną w kolejnym etapie.\n\nPracuj w `~/quest` na workstation. Dostarczone pliki: `board.json`,\
  \ `service.json`, `healthy-revision`, `original-deployment-uid`.\n\n**Wymagania:**\n- Etap 1:\n  - Deployment\
  \ `board` zachowuje oryginalny UID z `/run/dq/facts/0/original-deployment-uid` na workstation.\n  - Deployment\
  \ `board`:\n    - repliki `2`.\n  - Deployment `board` używa `RollingUpdate`, dopuszczając `0` niedostępnych replik\
  \ i `1` dodatkową replikę.\n  - Deployment `board`:\n    - port HTTP readiness `8080`.\n  - Deployment `board`:\n\
  \    - gotowe repliki `2`.\n  - Z `deployment/board` HTTP `http://board:8080` zwraca `north-102`.\n- Etap 2:\n\
  \  - Deployment `board` zachowuje oryginalny UID z `/run/dq/facts/0/original-deployment-uid` na workstation.\n\
  \  - Deployment `board`:\n    - repliki `2`.\n  - Deployment `board` używa `RollingUpdate`, dopuszczając `0` niedostępnych\
  \ replik i `1` dodatkową replikę.\n  - Deployment `board`:\n    - port HTTP readiness `8080`.\n  - Deployment\
  \ `board`:\n    - gotowe repliki `2`.\n  - Z `deployment/board` HTTP `http://board:8080` zwraca `north-102-v3`.\n\
  \n**Sprawdź samodzielnie przed Check & finish:**\nWykonuj te polecenia obserwacyjne w `~/quest` na workstation;\
  \ `kubectl exec` obserwuje kontener wskazanego obciążenia.\n- Ustawienia, tożsamość i status odpowiadają wymaganiom.\n\
  \n  ```sh\n  kubectl get deployment board -o yaml\n  cat /run/dq/facts/0/original-deployment-uid\n  ```\n- `kubectl\
  \ exec deployment/board -- wget -qO- -T 3 http://board:8080` — Etap 1 zwraca `north-102`; etap 2 zwraca `north-102-v3`,\
  \ z dwiema gotowymi replikami w obu etapach.\n\nSprawdzane są bieżące ustawienia i odpowiedzi, nie cały historyczny\
  \ szablon ani użyte polecenia.\n"
debrief: Kontrole sprawdziły tożsamość Deployment, strategię, port readiness i odpowiedź każdego etapu.
stages.0.brief: 'Przywróć początkową odpowiedź z oryginalnym Deployment i wymaganymi ustawieniami dostępności.

  '
stages.1.brief: 'Zachowaj dostępność treści następnego etapu z tą samą tożsamością i gwarancjami dostępności.

  '
hints.0.text: 'Recreate usuwa starą rewizję przed gotowością nowej. Tutaj nieprawidłową sondę readiness wdrożono
  z Recreate.

  '
hints.1.text: Undo zmienia szablon Pod; strategy jest odrębnym polem Deployment.
hints.2.text: 'Przywróć znaną zdrową rewizję, zachowaj limity rolling i zdiagnozuj następną sondę bez utraty nowej
  treści. Sprawdź historię i użyj kubectl rollout undo deployment/board --to-revision=N z N z healthy-revision.
  Użyj RollingUpdate z liczbowymi maxUnavailable=0 i maxSurge=1, bez dodatkowych pól rollingUpdate.

  '
phrases.0: Odzyskałem znaną, zdrową wersję Deployment.
phrases.1: Skonfigurowałem jawnie limity przepięć i unavailable.
phrases.2: Po wdrożeniu zweryfikowałem nową zawartość i readiness.
questions.0.points.0: NIE; W readiness liczy się także poprawność, pojemność i zamykanie aplikacji.
questions.0.points.1: Ogranicza dostępny budżet repliki kontrolera.
questions.0.prompt: Czy maxUnavailable zero gwarantuje zero przestojów?
questions.1.points.0: Przywraca poprzedni szablon Pod z historii wersji.
questions.1.points.1: Przejrzyj oddzielnie strategy i inne pola niebędące szablonami.
questions.1.prompt: Czy rollout undo przywraca każde pole Deployment?
