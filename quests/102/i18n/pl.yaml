diagnostics.rolling: Budżet wymiany deployment/board musi dopuszczać 0 niedostępnych i najwyżej 1 dodatkową replikę.
diagnostics.ready: deployment/board readyReplicas musi być równe 2.
diagnostics.readiness: Sonda HTTP readiness kontenera worker musi docierać do portu nasłuchującego aplikacji.
