title: Стратегии выкатки и откат
brief: 'Работайте в `~/quest` с `board.json`, `service.json`, `healthy-revision` и `original-deployment-uid`. Ошибочный readiness
  probe был развёрнут через `Recreate` и остановил старый board. Записанная ревизия — отправная точка: изучите историю rollout
  и выполните `kubectl rollout undo deployment/board --to-revision=N`, заменив N значением `healthy-revision`. Настройте `RollingUpdate`
  с ровно числовыми `maxUnavailable: 0` и `maxSurge: 1`, без дополнительных полей rollingUpdate. Сохраните исходный UID Deployment
  и две реплики. Дождитесь двух готовых реплик, проверьте HTTP-порт readiness 8080 первого контейнера и ответ `north-102`
  от `board:8080`. Следующий этап добавляет новое содержимое; исправьте его probe и проверьте `north-102-v3`. Проверки наблюдают
  текущие настройки и ответы, но не весь исторический шаблон или использованные команды. Работайте только в офлайн-песочнице.'
debrief: Проверки наблюдали идентичность Deployment, стратегию, порт readiness и ответ каждого этапа.
stages.0.brief: Исходный UID Deployment, две готовые реплики, указанная стратегия, порт readiness 8080 и ответ `north-102`
  соответствуют описанию.
stages.0.objectives.0.text: Исходный UID Deployment, две готовые реплики, указанная стратегия, порт readiness 8080 и ответ
