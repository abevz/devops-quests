title: Стратегии выкатки и откат
brief: "Доступность сервиса потеряна во время выпуска. Восстановите первый ответ, затем сохраните новый контент\
  \ следующего этапа.\n\nРаботайте в `~/quest` на workstation. Предоставленные файлы: `board.json`, `service.json`,\
  \ `healthy-revision`, `original-deployment-uid`.\n\n**Требования:**\n- Этап 1:\n  - Deployment `board` использует\
  \ `RollingUpdate` с `0` недоступных и `1` дополнительной репликой и HTTP readiness на порту `8080`.\n  - Исходный\
  \ Deployment `board` сохраняет ровно `2` реплики, обе готовы.\n    - Эталон исходного UID — `/run/dq/facts/0/original-deployment-uid`\
  \ на workstation.\n  - Из `deployment/board` HTTP `http://board:8080` возвращает `north-102`.\n- Этап 2:\n  -\
  \ Deployment `board` использует `RollingUpdate` с `0` недоступных и `1` дополнительной репликой и HTTP readiness\
  \ на порту `8080`.\n  - Исходный Deployment `board` сохраняет ровно `2` реплики, обе готовы.\n    - Эталон исходного\
  \ UID — `/run/dq/facts/0/original-deployment-uid` на workstation.\n  - Из `deployment/board` HTTP `http://board:8080`\
  \ возвращает `north-102-v3`.\n\n**Проверьте самостоятельно перед Check & finish:**\nВыполняйте эти команды наблюдения\
  \ из `~/quest` на workstation; `kubectl exec` наблюдает контейнер указанной нагрузки.\n- Настройки, идентичность\
  \ и статус соответствуют требованиям.\n\n  ```sh\n  kubectl get deployment board -o yaml\n  cat /run/dq/facts/0/original-deployment-uid\n\
  \  ```\n- `kubectl exec deployment/board -- wget -qO- -T 3 http://board:8080` — Этап 1 возвращает `north-102`;\
  \ этап 2 — `north-102-v3`, с двумя готовыми репликами на обоих этапах.\n\nПроверка наблюдает текущие настройки\
  \ и ответы, а не весь исторический шаблон или использованные команды.\n"
debrief: Проверки наблюдали идентичность Deployment, стратегию, порт readiness и ответ каждого этапа.
stages.0.brief: 'Восстановите исходный ответ с исходным Deployment и требуемыми настройками доступности.

  '
stages.1.brief: 'Сохраните доступность контента следующего этапа с прежней идентичностью и гарантиями доступности.

  '
hints.0.text: 'Recreate удаляет старую ревизию до готовности замены. Здесь неверный readiness probe был выпущен
  с Recreate.

  '
hints.1.text: Undo меняет шаблон Pod; strategy — отдельное поле Deployment.
hints.2.text: 'Восстановите известную здоровую ревизию, сохраните пределы rolling и диагностируйте следующий probe
  без потери нового контента. Проверьте историю rollout и используйте kubectl rollout undo deployment/board --to-revision=N
  с N из healthy-revision. Используйте RollingUpdate с числовыми maxUnavailable=0 и maxSurge=1 без дополнительных
  полей rollingUpdate.

  '
phrases.0: Я восстановил известную исправную ревизию Deployment.
phrases.1: Я явно задал limits surge и unavailable.
phrases.2: Я проверил новое содержимое и readiness после выкатки.
questions.0.points.0: 'Нет: важны корректность readiness, ресурсы и завершение приложения.'
questions.0.points.1: Он ограничивает бюджет доступных реплик контроллера.
questions.0.prompt: Гарантирует ли maxUnavailable zero отсутствие простоя?
questions.1.points.0: Он восстанавливает прежний шаблон Pod из истории ревизий.
questions.1.points.1: Отдельно проверяйте strategy и другие поля вне шаблона.
questions.1.prompt: Восстанавливает ли rollout undo все поля Deployment?
diagnostics.uid_file: original-deployment-uid должен присутствовать.
diagnostics.uid: deployment/board UID должен совпадать с original-deployment-uid.
diagnostics.replicas: deployment/board replicas должен совпадать с 2.
diagnostics.strategy: deployment/board strategy должен совпадать с RollingUpdate.
diagnostics.rolling: deployment/board rollingUpdate должен совпадать с {maxSurge:1,maxUnavailable:0}.
diagnostics.ready: deployment/board readyReplicas должен совпадать с 2.
diagnostics.readiness: HTTP-порт готовности первого контейнера должен быть 8080.
diagnostics.http_v1: board:8080 должен совпадать с north-102.
diagnostics.http_v3: board:8080 должен совпадать с north-102-v3.
