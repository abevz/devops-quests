diagnostics.strategy: Deployment мог остаться на стратегии Recreate, при которой старые Pod удаляются до замены. Проверьте, что в кластере задан RollingUpdate. [Причина и проверка](guides#guide=kubernetes-workloads&section=q102-rolling-strategy)
diagnostics.rolling: Параметры обновления могли разрешить недоступность Pod или дать другое число дополнительных реплик. Для желаемого числа реплик округлите maxSurge вверх и maxUnavailable вниз. Нужна одна дополнительная реплика и ноль недоступных. [Причина и проверка](guides#guide=kubernetes-workloads&section=q102-replacement-budget)
diagnostics.readiness: Readiness worker мог остаться на порту 8099 или использовать другой протокол, хост либо именованный порт. Проверьте единственное HTTP-действие у worker и его фактический порт 8080. [Причина и проверка](guides#guide=kubernetes-workloads&section=q102-worker-http-readiness)
diagnostics.uid_file: Зафиксированный UID исходного Deployment мог быть недоступен или пуст. Проверьте исходную запись перед сравнением с UID в кластере. [Причина и проверка](guides#guide=kubernetes-workloads&section=q102-original-deployment-receipt)
diagnostics.uid: При пересоздании Deployment под тем же именем исходный UID теряется. Перед откатом существующего объекта сравните его текущий UID с исходной записью. [Причина и проверка](guides#guide=kubernetes-workloads&section=q102-deployment-identity)
diagnostics.replicas: Масштабирование или замена манифеста могли изменить желаемое число реплик. Проверьте, что .spec.replicas равно двум. [Причина и проверка](guides#guide=kubernetes-workloads&section=q102-desired-replicas)
diagnostics.ready: При желаемых двух репликах новые worker могут не проходить проверку готовности. Проверьте текущие Pod и дождитесь двух готовых реплик в статусе Deployment. [Причина и проверка](guides#guide=kubernetes-workloads&section=q102-ready-replica-count)
diagnostics.http_v1: Откат мог не вернуть исходный ответ, либо у Service может не быть готовых endpoints. Прочитайте реальный ответ board и сравните с north-102. [Причина и проверка](guides#guide=kubernetes-workloads&section=q102-baseline-service-response)
diagnostics.http_v3: Новые Pod могли ещё не пройти readiness, либо Service может временно направлять запросы на старые worker. После rollout сравните ответ с north-102-v3 и отдельно проверьте тайм-ауты или отсутствие endpoints. [Причина и проверка](guides#guide=kubernetes-workloads&section=q102-updated-service-response)
diagnostics.probe_0_0: Проверка rollout может остановиться до сообщения о стратегии, лимите или readiness, если не запускается Python. Проверьте Python и доступ к Deployment board. [Причина и проверка](guides#guide=kubernetes-workloads&section=q102-rollout-observer-input)
diagnostics.probe_1_0: Проверка rollout может остановиться до сообщения о стратегии, лимите или readiness, если не запускается Python. Проверьте Python и доступ к Deployment board. [Причина и проверка](guides#guide=kubernetes-workloads&section=q102-rollout-observer-input)
diagnostics.probe_1_2: HTTP-наблюдение может завершиться до вывода последнего ответа при ошибке Python или входных данных. Проверьте инструменты и Service перед повтором. [Причина и проверка](guides#guide=kubernetes-workloads&section=q102-service-observer-input)
