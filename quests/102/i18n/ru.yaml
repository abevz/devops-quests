title: Стратегии выкатки и откат
brief: "Доступность сервиса потеряна во время выпуска. Восстановите первый ответ, затем сохраните новый контент\
  \ следующего этапа.\n\nРаботайте в `~/quest` на workstation. Предоставленные файлы: `board.yaml`, `service.yaml`,\
  \ `healthy-revision`.\n\n**Требования:**\n- Этап 1:\n  - Deployment `board` заменяет реплики без плановой\
  \ недоступности, не более чем с `1` дополнительной репликой и с поставленной HTTP-проверкой готовности.\n\
  \  - Исходный Deployment `board` сохраняет ровно `2` реплики, обе готовы.\n  - Из `deployment/board` HTTP\
  \ `http://board:8080` возвращает `north-102`.\n- Этап 2:\n  - Deployment `board` заменяет реплики без плановой\
  \ недоступности, не более чем с `1` дополнительной репликой и с поставленной HTTP-проверкой готовности.\n\
  \  - Исходный Deployment `board` сохраняет ровно `2` реплики, обе готовы.\n  - Из `deployment/board` HTTP\
  \ `http://board:8080` возвращает `north-102-v3`.\n\nПроверка наблюдает текущие настройки и ответы, а не весь\
  \ исторический шаблон или использованные команды.\n"
debrief: Проверки наблюдали идентичность Deployment, стратегию, порт readiness и ответ каждого этапа.
stages.0.brief: Восстановите исходный ответ с исходным Deployment и требуемыми настройками доступности.
stages.1.brief: Сохраните доступность контента следующего этапа с прежней идентичностью и гарантиями доступности.
hints.0.text: Релиз должен сочетать замену реплик с сохранением доступности сервиса.
hints.1.text: 'Recreate удаляет старую ревизию до готовности замены. Здесь неверный readiness probe был выпущен
  с Recreate.


  Undo меняет шаблон Pod; strategy — отдельное поле Deployment.


  Изучите поставленные определения, текущие ресурсы и события.


  ```sh

  cat board.yaml

  kubectl get deployment board -o yaml

  kubectl rollout history deployment/board

  ```'
hints.2.text: 'Восстановите известную здоровую ревизию, сохраните пределы rolling и диагностируйте следующий probe без потери нового контента. Проверьте историю rollout и используйте kubectl rollout undo deployment/board --to-revision=N с N из healthy-revision. Используйте RollingUpdate с числовыми maxUnavailable=0 и maxSurge=1 без дополнительных полей rollingUpdate.


  Проверьте наблюдаемый результат:


  ```sh

  kubectl rollout status deployment/board --timeout=3s

  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080

  ```


  Ожидаются две готовые реплики и north-102 на этапе 1, затем north-102-v3 на этапе 2; всё время сохраняйте исходный Deployment.


  Поставленные ограничения и подробности: Deployment `board` использует `RollingUpdate` с `0` недоступных и `1` дополнительной репликой и HTTP readiness на порту `8080`. Deployment `board` использует `RollingUpdate` с `0` недоступных и `1` дополнительной репликой и HTTP readiness на порту `8080`.'
phrases.0: Я восстановил известную исправную ревизию Deployment.
phrases.1: Я явно задал limits surge и unavailable.
phrases.2: Я проверил новое содержимое и readiness после выкатки.
questions.0.points.0: 'Нет: важны корректность readiness, ресурсы и завершение приложения.'
questions.0.points.1: Он ограничивает бюджет доступных реплик контроллера.
questions.0.prompt: Гарантирует ли maxUnavailable zero отсутствие простоя?
questions.1.points.0: Он восстанавливает прежний шаблон Pod из истории ревизий.
questions.1.points.1: Отдельно проверяйте strategy и другие поля вне шаблона.
questions.1.prompt: Восстанавливает ли rollout undo все поля Deployment?
