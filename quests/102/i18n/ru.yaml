title: Стратегии выкатки и откат
brief: 'Ошибочный readiness probe выкатили через Recreate, остановив прежнее табло.
  Верните сохранённый исправный шаблон через rollout undo и задайте RollingUpdate
  с maxUnavailable: 0 и maxSurge: 1 для последующих изменений. Сохраните UID Deployment
  и две реплики. Второй этап добавит новую ревизию табло с ошибочным probe: исправьте
  probe, не отменяя новое содержимое. Стратегия сама по себе не гарантирует доступность:
  важны readiness, запас ресурсов и поведение приложения.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `board.json`, `service.json`,
  `healthy-revision`, `original-deployment-uid`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно
  загруженные образы и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Сохранённый исправный шаблон восстановлен в том же Deployment;
  две реплики готовы, ограничения rolling update заданы.'
debrief: Восстановление разделило стратегию выкатки, историю шаблонов и readiness;
  undo не подменяет политику доступности.
stages.0.brief: 'Результат проверки: Сохранённый исправный шаблон восстановлен в том
  же Deployment; две реплики готовы, ограничения rolling update заданы.'
stages.0.objectives.0.text: Сохранённый исправный шаблон восстановлен в том же Deployment;
  две реплики готовы, ограничения rolling update заданы.
stages.1.brief: 'Результат проверки: Новая ревизия отдаёт north-102-v3 двумя готовыми
  репликами, с прежней identity Deployment и требуемой rolling strategy.'
stages.1.objectives.0.text: Новая ревизия отдаёт north-102-v3 двумя готовыми репликами,
  с прежней identity Deployment и требуемой rolling strategy.
hints.0.text: Recreate убирает прежнюю ревизию до готовности замены.
hints.1.text: Undo меняет шаблон Pod; strategy — отдельное поле Deployment.
hints.2.text: Верните исправную ревизию, сохраните rolling limits, затем исправьте
  следующий probe без потери нового содержимого.
phrases.0: Я восстановил известную исправную ревизию Deployment.
phrases.1: Я явно задал limits surge и unavailable.
phrases.2: Я проверил новое содержимое и readiness после выкатки.
questions.0.points.0: 'Нет: важны корректность readiness, ресурсы и завершение приложения.'
questions.0.points.1: Он ограничивает бюджет доступных реплик контроллера.
questions.0.prompt: Гарантирует ли maxUnavailable zero отсутствие простоя?
questions.1.points.0: Он восстанавливает прежний шаблон Pod из истории ревизий.
questions.1.points.1: Отдельно проверяйте strategy и другие поля вне шаблона.
questions.1.prompt: Восстанавливает ли rollout undo все поля Deployment?
