diagnostics.readiness: HTTP readiness probe контейнера worker должна обращаться к слушателю приложения.
diagnostics.http_v1: board:8080 должен совпадать с north-102.
diagnostics.http_v3: board:8080 должен совпадать с north-102-v3.
