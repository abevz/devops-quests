stages.1.brief: Исходный UID Deployment, две готовые реплики, указанная стратегия, порт readiness 8080 и ответ `north-102-v3`
  соответствуют описанию.
stages.1.objectives.0.text: Исходный UID Deployment, две готовые реплики, указанная стратегия, порт readiness 8080 и ответ
