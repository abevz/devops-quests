title: Rollout-Strategien und Rollback
brief: "Während einer Veröffentlichung ging die Dienstverfügbarkeit verloren. Stellen Sie die erste Antwort wieder\
  \ her und behalten Sie danach den neuen Inhalt der nächsten Stufe bei.\n\nArbeiten Sie in `~/quest` auf der Workstation.\
  \ Bereitgestellte Dateien: `board.json`, `service.json`, `healthy-revision`, `original-deployment-uid`.\n\n**Anforderungen:**\n\
  - Stufe 1:\n  - Deployment `board` behält seine ursprüngliche UID aus `/run/dq/facts/0/original-deployment-uid`\
  \ auf der Workstation.\n  - Deployment `board`:\n    - Replikate `2`.\n  - Deployment `board` nutzt `RollingUpdate`\
  \ mit `0` nicht verfügbaren und `1` zusätzlichem Replikat.\n  - Deployment `board`:\n    - HTTP-Readiness-Port\
  \ `8080`.\n  - Deployment `board`:\n    - bereite Replikate `2`.\n  - Von `deployment/board` liefert HTTP `http://board:8080`\
  \ den Wert `north-102`.\n- Stufe 2:\n  - Deployment `board` behält seine ursprüngliche UID aus `/run/dq/facts/0/original-deployment-uid`\
  \ auf der Workstation.\n  - Deployment `board`:\n    - Replikate `2`.\n  - Deployment `board` nutzt `RollingUpdate`\
  \ mit `0` nicht verfügbaren und `1` zusätzlichem Replikat.\n  - Deployment `board`:\n    - HTTP-Readiness-Port\
  \ `8080`.\n  - Deployment `board`:\n    - bereite Replikate `2`.\n  - Von `deployment/board` liefert HTTP `http://board:8080`\
  \ den Wert `north-102-v3`.\n\n**Vor Check & finish selbst prüfen:**\nFühren Sie diese Beobachtungsbefehle in `~/quest`\
  \ auf der Workstation aus; `kubectl exec` beobachtet den Container des genannten Workloads.\n- Einstellungen,\
  \ Identität und Status entsprechen den Anforderungen.\n\n  ```sh\n  kubectl get deployment board -o yaml\n  cat\
  \ /run/dq/facts/0/original-deployment-uid\n  ```\n- `kubectl exec deployment/board -- wget -qO- -T 3 http://board:8080`\
  \ — Stufe 1 liefert `north-102`; Stufe 2 liefert `north-102-v3`, jeweils mit zwei bereiten Replikaten.\n\nGeprüft\
  \ werden aktuelle Einstellungen und Antworten, nicht die gesamte historische Vorlage oder verwendete Befehle.\n"
debrief: Die Prüfungen beobachteten Deployment-Identität, Rollout-Strategie, Readiness-Port und die Antwort jeder
  Phase.
stages.0.brief: 'Stellen Sie die ursprüngliche Antwort mit dem ursprünglichen Deployment und den geforderten Verfügbarkeitseinstellungen
  her.

  '
stages.1.brief: 'Halten Sie den Inhalt der nächsten Stufe mit derselben Identität und denselben Verfügbarkeitsgarantien
  bereit.

  '
hints.0.text: 'Recreate entfernt die alte Revision, bevor der Ersatz bereit ist. Hier wurde eine fehlerhafte Readiness-Probe
  mit Recreate ausgerollt.

  '
hints.1.text: Undo ändert die Vorlage Pod; strategy ist ein separates Deployment-Feld.
hints.2.text: 'Stellen Sie die bekannte gesunde Revision wieder her, behalten Sie Rolling-Grenzen bei und diagnostizieren
  Sie die nächste Probe ohne Inhaltsverlust. Prüfen Sie den Rollout-Verlauf und verwenden Sie kubectl rollout undo
  deployment/board --to-revision=N mit N aus healthy-revision. Verwenden Sie RollingUpdate mit numerischen maxUnavailable=0
  und maxSurge=1 ohne zusätzliche rollingUpdate-Felder.

  '
phrases.0: Ich habe eine bekanntermaßen fehlerfreie Deployment-Revision wiederhergestellt.
phrases.1: Ich habe surge und unavailable limits explizit konfiguriert.
phrases.2: Ich habe den neuen Inhalt und readiness nach der Einführung überprüft.
questions.0.points.0: NEIN; readiness Korrektheit, Kapazität und Anwendungsabschaltung sind ebenfalls wichtig.
questions.0.points.1: Dadurch wird das verfügbare Replikatbudget des Controllers eingeschränkt.
questions.0.prompt: Garantiert maxUnavailable zero zero Ausfallzeiten?
questions.1.points.0: Es stellt eine frühere Pod-Vorlage aus dem Revisionsverlauf wieder her.
questions.1.points.1: Überprüfen Sie strategy und andere Nicht-Vorlagenfelder separat.
questions.1.prompt: Stellt rollout undo jedes Deployment-Feld wieder her?
