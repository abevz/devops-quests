title: Rollout-Strategien und Rollback
brief: "Während einer Veröffentlichung ging die Dienstverfügbarkeit verloren. Stellen Sie die erste Antwort\
  \ wieder her und behalten Sie danach den neuen Inhalt der nächsten Stufe bei.\n\nArbeiten Sie in `~/quest`\
  \ auf der Workstation. Bereitgestellte Dateien: `board.yaml`, `service.yaml`, `healthy-revision`.\n\n**Anforderungen:**\n\
  - Phase 1:\n  - Deployment `board` ersetzt Replikate ohne geplante Nichtverfügbarkeit, mit höchstens `1`\
  \ zusätzlichem Replikat und dem mitgelieferten HTTP-Bereitschaftsverhalten.\n  - Das ursprüngliche Deployment\
  \ `board` behält genau `2` Replikate, beide bereit.\n  - Von `deployment/board` liefert HTTP `http://board:8080`\
  \ den Wert `north-102`.\n- Phase 2:\n  - Deployment `board` ersetzt Replikate ohne geplante Nichtverfügbarkeit,\
  \ mit höchstens `1` zusätzlichem Replikat und dem mitgelieferten HTTP-Bereitschaftsverhalten.\n  - Das ursprüngliche\
  \ Deployment `board` behält genau `2` Replikate, beide bereit.\n  - Von `deployment/board` liefert HTTP `http://board:8080`\
  \ den Wert `north-102-v3`.\n\nGeprüft werden aktuelle Einstellungen und Antworten, nicht die gesamte historische\
  \ Vorlage oder verwendete Befehle.\n"
debrief: Die Prüfungen beobachteten Deployment-Identität, Rollout-Strategie, Readiness-Port und die Antwort
  jeder Phase.
stages.0.brief: Stellen Sie die ursprüngliche Antwort mit dem ursprünglichen Deployment und den geforderten
  Verfügbarkeitseinstellungen her.
stages.1.brief: Halten Sie den Inhalt der nächsten Stufe mit derselben Identität und denselben Verfügbarkeitsgarantien
  bereit.
hints.0.text: Ein Release muss den Austauschfortschritt mit fortgesetzter Dienstverfügbarkeit vereinbaren.
hints.1.text: |-
  Recreate entfernt die alte Revision, bevor der Ersatz bereit ist. Hier wurde eine fehlerhafte Readiness-Probe mit Recreate ausgerollt.

  Undo ändert die Vorlage Pod; strategy ist ein separates Deployment-Feld.

  Prüfen Sie die mitgelieferten Definitionen, aktuellen Ressourcen und Ereignisse.

  Stellen Sie die bekannte gesunde Revision wieder her, behalten Sie Rolling-Grenzen bei und diagnostizieren Sie die nächste Probe ohne Inhaltsverlust. Prüfen Sie den Rollout-Verlauf und verwenden Sie kubectl rollout undo deployment/board --to-revision=N mit N aus healthy-revision. Verwenden Sie RollingUpdate mit numerischen maxUnavailable=0 und maxSurge=1 ohne zusätzliche rollingUpdate-Felder.

  ```sh
  cat board.yaml
  kubectl get deployment board -o yaml
  kubectl rollout history deployment/board
  ```
hints.2.text: |-
  Prüfen Sie das beobachtete Ergebnis:

  ```sh
  kubectl rollout status deployment/board --timeout=3s
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080
  ```

  Erwartet werden zwei bereite Replikate und north-102 in Phase 1, danach north-102-v3 in Phase 2; das ursprüngliche Deployment durchgehend behalten.

  Mitgelieferte Einschränkungen und Details: Deployment `board` nutzt `RollingUpdate` mit `0` nicht verfügbaren und `1` zusätzlichen Replikat sowie HTTP-Readiness auf Port `8080`. Deployment `board` nutzt `RollingUpdate` mit `0` nicht verfügbaren und `1` zusätzlichen Replikat sowie HTTP-Readiness auf Port `8080`.
phrases.0: Ich habe eine bekanntermaßen fehlerfreie Deployment-Revision wiederhergestellt.
phrases.1: Ich habe surge und unavailable limits explizit konfiguriert.
phrases.2: Ich habe den neuen Inhalt und readiness nach der Einführung überprüft.
questions.0.points.0: NEIN; readiness Korrektheit, Kapazität und Anwendungsabschaltung sind ebenfalls wichtig.
questions.0.points.1: Dadurch wird das verfügbare Replikatbudget des Controllers eingeschränkt.
questions.0.prompt: Garantiert maxUnavailable zero zero Ausfallzeiten?
questions.1.points.0: Es stellt eine frühere Pod-Vorlage aus dem Revisionsverlauf wieder her.
questions.1.points.1: Überprüfen Sie strategy und andere Nicht-Vorlagenfelder separat.
questions.1.prompt: Stellt rollout undo jedes Deployment-Feld wieder her?
stages.0.objectives.0.text: Deployment `board` ersetzt Replikate ohne geplante Nichtverfügbarkeit, mit höchstens
  `1` zusätzlichem Replikat und dem mitgelieferten HTTP-Bereitschaftsverhalten.
stages.0.objectives.1.text: Das ursprüngliche Deployment `board` behält genau `2` Replikate, beide bereit.
stages.0.objectives.2.text: Von `deployment/board` liefert HTTP `http://board:8080` den Wert `north-102`.
stages.1.objectives.0.text: Deployment `board` ersetzt Replikate ohne geplante Nichtverfügbarkeit, mit höchstens
  `1` zusätzlichem Replikat und dem mitgelieferten HTTP-Bereitschaftsverhalten.
stages.1.objectives.1.text: Das ursprüngliche Deployment `board` behält genau `2` Replikate, beide bereit.
stages.1.objectives.2.text: Von `deployment/board` liefert HTTP `http://board:8080` den Wert `north-102-v3`.
diagnostics.strategy: Das Deployment verwendet möglicherweise noch Recreate und entfernt vorhandene Pods vor dem Ersatz. Prüfen Sie, ob die aktive Strategie RollingUpdate ist. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q102-rolling-strategy)
diagnostics.rolling: Das Rollout-Budget erlaubt möglicherweise nicht verfügbare Pods oder ergibt eine andere Zusatzanzahl. Berechnen Sie die Grenzen bei der gewünschten Replikazahl, surge aufgerundet und unavailable abgerundet. Gefordert sind eine zusätzliche und null nicht verfügbare Repliken. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q102-replacement-budget)
diagnostics.readiness: Die Readiness-Prüfung im Worker-Container verwendet möglicherweise noch 8099 oder ein anderes Protokoll, einen anderen Host oder Portnamen. Prüfen Sie die einzige HTTP-Aktion des Containers worker und lösen Sie ihren Port als 8080 auf. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q102-worker-http-readiness)
diagnostics.uid_file: Die festgehaltene ursprüngliche Deployment-UID fehlt möglicherweise oder ist leer. Prüfen Sie den ursprünglichen Beleg vor dem Vergleich mit der aktiven UID. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q102-original-deployment-receipt)
diagnostics.uid: Das Neuerstellen des Deployments unter gleichem Namen ändert seine UID dauerhaft. Vergleichen Sie vor einem Rollback die UID des vorhandenen Deployments mit dem ursprünglichen Beleg. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q102-deployment-identity)
diagnostics.replicas: Skalierung oder ein anderes Manifest können die gewünschte Anzahl geändert haben. Prüfen Sie, ob .spec.replicas weiterhin zwei beträgt. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q102-desired-replicas)
diagnostics.ready: Trotz zweier gewünschter Repliken können Ersatz-Worker die Bereitschaftsprüfung verfehlen. Prüfen Sie aktuelle Pods und warten Sie auf zwei bereite Repliken im Deployment-Status. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q102-ready-replica-count)
diagnostics.http_v1: Der Rollback hat möglicherweise die ursprüngliche Antwort nicht wiederhergestellt oder dem Service könnten bereite Endpunkte fehlen. Lesen Sie die Antwort von board und vergleichen Sie sie mit north-102. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q102-baseline-service-response)
diagnostics.http_v3: Neue Pods sind möglicherweise noch nicht bereit oder der Service könnte kurzzeitig ältere Worker erreichen. Vergleichen Sie nach dem Rollout mit north-102-v3 und prüfen Sie Timeouts oder fehlende Endpunkte separat. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q102-updated-service-response)
diagnostics.probe_0_0: Die Rollout-Prüfung kann vor Angaben zu Strategie, Budget oder Probe abbrechen, wenn Python nicht startet. Prüfen Sie Python und den Zugriff auf Deployment board. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q102-rollout-observer-input)
diagnostics.probe_1_0: Die Rollout-Prüfung kann vor Angaben zu Strategie, Budget oder Probe abbrechen, wenn Python nicht startet. Prüfen Sie Python und den Zugriff auf Deployment board. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q102-rollout-observer-input)
diagnostics.probe_1_2: Die HTTP-Prüfung kann vor der Meldung der letzten Antwort abbrechen, wenn Python oder Eingaben ausfallen. Prüfen Sie Werkzeuge und den aktiven Service vor dem nächsten Versuch. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q102-service-observer-input)
