diagnostics.ready: deployment/board readyReplicas muss 2 entsprechen.
diagnostics.readiness: Der HTTP-Readiness-Port des ersten Containers muss 8080 sein.
diagnostics.http_v1: board:8080 muss north-102 entsprechen.
diagnostics.http_v3: board:8080 muss north-102-v3 entsprechen.
