stages.1.brief: 'Erfolgskriterium: Die neue Revision bedient north-102-v3 mit zwei fertigen Nachbildungen,
  dem gleichen Deployment identity und dem vorgesehenen rolling strategy.'
stages.1.objectives.0.text: Die neue Revision bedient north-102-v3 mit zwei fertigen Nachbildungen, dem
