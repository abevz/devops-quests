title: Rollout-Strategien und Rollback
brief: 'Ein fehlerhafter readiness probe wurde mit Recreate eingeführt, wodurch der alte board außer Gefecht
  gesetzt wurde. Stellen Sie die aufgezeichnete fehlerfreie Vorlage mit rollout undo wieder her und konfigurieren
  Sie RollingUpdate mit maxUnavailable: 0 und maxSurge: 1 für zukünftige Änderungen. Bewahren Sie den
  Deployment UID und zwei Replikate auf. In einer zweiten Stufe wird eine neue board-Revision mit einem
  fehlerhaften probe eingeführt. Reparieren Sie probe, anstatt den neuen Inhalt zurückzusetzen. Strategie
  allein garantiert keine Verfügbarkeit: readiness, freie Kapazität und Anwendungsverhalten spielen ebenfalls
  eine Rolle.


  Questdateien in `~/quest` (einige erscheinen in späteren Phasen): `board.json`, `service.json`, `healthy-revision`,
  `original-deployment-uid`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Anfängliche Erfolgskriterien: Die aufgezeichnete fehlerfreie Vorlage wird auf demselben Deployment wiederhergestellt.
  Zwei Replikate sind bereit und die Sicherheitsgrenzen für fortlaufende Updates sind konfiguriert.'
debrief: Bei der Wiederherstellung wurden Rollout-Strategie, Vorlagenverlauf und readiness getrennt, anstatt
  undo als vollständige Verfügbarkeitsrichtlinie zu behandeln.
stages.0.brief: 'Erfolgskriterien: Die aufgezeichnete fehlerfreie Vorlage wird auf demselben Deployment
