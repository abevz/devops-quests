title: Rollout-Strategien und Rollback
brief: 'Arbeite in `~/quest` mit `board.json`, `service.json`, `healthy-revision` und `original-deployment-uid`. Eine fehlerhafte
  Readiness-Probe wurde mit `Recreate` ausgerollt und nahm das alte Board außer Betrieb. Die gespeicherte Revision ist ein
  Ausgangspunkt: Prüfe die Rollout-Historie und nutze `kubectl rollout undo deployment/board --to-revision=N`, wobei N durch
  `healthy-revision` ersetzt wird. Konfiguriere `RollingUpdate` mit genau numerischem `maxUnavailable: 0` und `maxSurge: 1`,
  ohne zusätzliche rollingUpdate-Felder. Bewahre die ursprüngliche Deployment-UID und zwei Replikate. Warte auf zwei bereite
  Replikate und prüfe den Readiness-HTTP-Port 8080 des ersten Containers und die Antwort `north-102` von `board:8080`. Die
  nächste Phase bringt neuen Inhalt; repariere ihre Probe und prüfe `north-102-v3`. Die Prüfungen beobachten aktuelle Einstellungen
  und Antworten, nicht die gesamte historische Vorlage oder verwendete Befehle. Arbeite nur in der Offline-Umgebung.'
debrief: Die Prüfungen beobachteten Deployment-Identität, Rollout-Strategie, Readiness-Port und die Antwort jeder Phase.
stages.0.brief: Ursprüngliche Deployment-UID, zwei bereite Replikate, angegebene Rollout-Strategie, Readiness-Port 8080 und
  Antwort `north-102` entsprechen der Beschreibung.
