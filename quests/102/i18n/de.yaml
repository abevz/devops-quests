title: Rollout-Strategien und Rollback
brief: "Während einer Veröffentlichung ging die Dienstverfügbarkeit verloren. Stellen Sie die erste Antwort\
  \ wieder her und behalten Sie danach den neuen Inhalt der nächsten Stufe bei.\n\nArbeiten Sie in `~/quest`\
  \ auf der Workstation. Bereitgestellte Dateien: `board.yaml`, `service.yaml`, `healthy-revision`.\n\n**Anforderungen:**\n\
  - Phase 1:\n  - Deployment `board` ersetzt Replikate ohne geplante Nichtverfügbarkeit, mit höchstens `1`\
  \ zusätzlichem Replikat und dem mitgelieferten HTTP-Bereitschaftsverhalten.\n  - Das ursprüngliche Deployment\
  \ `board` behält genau `2` Replikate, beide bereit.\n  - Von `deployment/board` liefert HTTP `http://board:8080`\
  \ den Wert `north-102`.\n- Phase 2:\n  - Deployment `board` ersetzt Replikate ohne geplante Nichtverfügbarkeit,\
  \ mit höchstens `1` zusätzlichem Replikat und dem mitgelieferten HTTP-Bereitschaftsverhalten.\n  - Das ursprüngliche\
  \ Deployment `board` behält genau `2` Replikate, beide bereit.\n  - Von `deployment/board` liefert HTTP `http://board:8080`\
  \ den Wert `north-102-v3`.\n\nGeprüft werden aktuelle Einstellungen und Antworten, nicht die gesamte historische\
  \ Vorlage oder verwendete Befehle.\n"
debrief: Die Prüfungen beobachteten Deployment-Identität, Rollout-Strategie, Readiness-Port und die Antwort
  jeder Phase.
stages.0.brief: Stellen Sie die ursprüngliche Antwort mit dem ursprünglichen Deployment und den geforderten
  Verfügbarkeitseinstellungen her.
stages.1.brief: Halten Sie den Inhalt der nächsten Stufe mit derselben Identität und denselben Verfügbarkeitsgarantien
  bereit.
hints.0.text: Ein Release muss den Austauschfortschritt mit fortgesetzter Dienstverfügbarkeit vereinbaren.
hints.1.text: 'Recreate entfernt die alte Revision, bevor der Ersatz bereit ist. Hier wurde eine fehlerhafte
  Readiness-Probe mit Recreate ausgerollt.


  Undo ändert die Vorlage Pod; strategy ist ein separates Deployment-Feld.


  Prüfen Sie die mitgelieferten Definitionen, aktuellen Ressourcen und Ereignisse.


  ```sh

  cat board.yaml

  kubectl get deployment board -o yaml

  kubectl rollout history deployment/board

  ```'
hints.2.text: 'Stellen Sie die bekannte gesunde Revision wieder her, behalten Sie Rolling-Grenzen bei und diagnostizieren Sie die nächste Probe ohne Inhaltsverlust. Prüfen Sie den Rollout-Verlauf und verwenden Sie kubectl rollout undo deployment/board --to-revision=N mit N aus healthy-revision. Verwenden Sie RollingUpdate mit numerischen maxUnavailable=0 und maxSurge=1 ohne zusätzliche rollingUpdate-Felder.


  Prüfen Sie das beobachtete Ergebnis:


  ```sh

  kubectl rollout status deployment/board --timeout=3s

  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080

  ```


  Erwartet werden zwei bereite Replikate und north-102 in Phase 1, danach north-102-v3 in Phase 2; das ursprüngliche Deployment durchgehend behalten.


  Mitgelieferte Einschränkungen und Details: Deployment `board` nutzt `RollingUpdate` mit `0` nicht verfügbaren und `1` zusätzlichen Replikat sowie HTTP-Readiness auf Port `8080`. Deployment `board` nutzt `RollingUpdate` mit `0` nicht verfügbaren und `1` zusätzlichen Replikat sowie HTTP-Readiness auf Port `8080`.'
phrases.0: Ich habe eine bekanntermaßen fehlerfreie Deployment-Revision wiederhergestellt.
phrases.1: Ich habe surge und unavailable limits explizit konfiguriert.
phrases.2: Ich habe den neuen Inhalt und readiness nach der Einführung überprüft.
questions.0.points.0: NEIN; readiness Korrektheit, Kapazität und Anwendungsabschaltung sind ebenfalls wichtig.
questions.0.points.1: Dadurch wird das verfügbare Replikatbudget des Controllers eingeschränkt.
questions.0.prompt: Garantiert maxUnavailable zero zero Ausfallzeiten?
questions.1.points.0: Es stellt eine frühere Pod-Vorlage aus dem Revisionsverlauf wieder her.
questions.1.points.1: Überprüfen Sie strategy und andere Nicht-Vorlagenfelder separat.
questions.1.prompt: Stellt rollout undo jedes Deployment-Feld wieder her?
diagnostics.uid_file: original-deployment-uid muss vorhanden sein.
diagnostics.uid: deployment/board UID muss original-deployment-uid entsprechen.
diagnostics.replicas: deployment/board replicas muss 2 entsprechen.
diagnostics.strategy: deployment/board strategy muss RollingUpdate entsprechen.
diagnostics.rolling: Das Austauschbudget von deployment/board muss 0 nicht verfügbare und höchstens 1 zusätzliche Replik erlauben.
diagnostics.ready: deployment/board readyReplicas muss 2 entsprechen.
diagnostics.readiness: Die HTTP-Readiness-Probe von worker muss den Listener der Anwendung erreichen.
diagnostics.http_v1: board:8080 muss north-102 entsprechen.
diagnostics.http_v3: board:8080 muss north-102-v3 entsprechen.
