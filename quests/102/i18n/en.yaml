title: Rollout strategies and rollback
brief: "Service availability was lost during a release. Recover the first response, then retain the new content\
  \ introduced in the next stage.\n\nWork in `~/quest` on the workstation. Supplied files: `board.yaml`, `service.yaml`,\
  \ `healthy-revision`.\n\n**Requirements:**\n- Stage 1:\n  - Deployment `board` replaces replicas without\
  \ planned unavailability, with at most `1` extra replica and the supplied HTTP readiness behavior.\n  - The\
  \ original Deployment `board` keeps exactly `2` replicas, both ready.\n  - From `deployment/board`, HTTP\
  \ `http://board:8080` returns `north-102`.\n- Stage 2:\n  - Deployment `board` replaces replicas without\
  \ planned unavailability, with at most `1` extra replica and the supplied HTTP readiness behavior.\n  - The\
  \ original Deployment `board` keeps exactly `2` replicas, both ready.\n  - From `deployment/board`, HTTP\
  \ `http://board:8080` returns `north-102-v3`.\n\nChecks observe current settings and responses, not the entire\
  \ historical template or the commands used.\n"
debrief: The checks observed Deployment identity, rolling strategy, readiness port and each stage response.
stages.0.brief: Restore the initial response with the original Deployment and required availability settings.
stages.1.brief: Keep the next-stage content available with the same identity and availability guarantees.
hints.0.text: A release must balance replacement progress with continued service availability.
hints.1.text: 'Recreate removes the old revision before the replacement is ready. Here a bad readiness probe
  was rolled out with Recreate.


  Undo changes the Pod template; strategy is a separate Deployment field.


  Inspect the supplied definitions, current resources and events.


  ```sh

  cat board.yaml

  kubectl get deployment board -o yaml

  kubectl rollout history deployment/board

  ```'
hints.2.text: 'Restore the known healthy revision, retain rolling limits, then diagnose the next probe without discarding new content. Inspect rollout history and use kubectl rollout undo deployment/board --to-revision=N with N from healthy-revision. Use RollingUpdate with numeric maxUnavailable=0 and maxSurge=1, without extra rollingUpdate fields.


  Verify the observed result:


  ```sh

  kubectl rollout status deployment/board --timeout=3s

  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080

  ```


  Expect two ready replicas and north-102 in stage 1, then north-102-v3 in stage 2; retain the original Deployment throughout.


  Supplied constraints and details: Deployment `board` uses `RollingUpdate` with `0` unavailable and `1` surge replica, and HTTP readiness on port `8080`. Deployment `board` uses `RollingUpdate` with `0` unavailable and `1` surge replica, and HTTP readiness on port `8080`.'
phrases.0: I recovered a known healthy Deployment revision.
phrases.1: I configured surge and unavailable limits explicitly.
phrases.2: I verified the new content and readiness after rollout.
questions.0.points.0: No; readiness correctness, capacity and application shutdown also matter.
questions.0.points.1: It constrains the controller's available replica budget.
questions.0.prompt: Does maxUnavailable zero guarantee zero downtime?
questions.1.points.0: It restores a previous Pod template from revision history.
questions.1.points.1: Review strategy and other non-template fields separately.
questions.1.prompt: Does rollout undo restore every Deployment field?
stages.0.objectives.0.text: Deployment `board` replaces replicas without planned unavailability, with at most
  `1` extra replica and the supplied HTTP readiness behavior.
stages.0.objectives.1.text: The original Deployment `board` keeps exactly `2` replicas, both ready.
stages.0.objectives.2.text: From `deployment/board`, HTTP `http://board:8080` returns `north-102`.
stages.1.objectives.0.text: Deployment `board` replaces replicas without planned unavailability, with at most
  `1` extra replica and the supplied HTTP readiness behavior.
stages.1.objectives.1.text: The original Deployment `board` keeps exactly `2` replicas, both ready.
stages.1.objectives.2.text: From `deployment/board`, HTTP `http://board:8080` returns `north-102-v3`.
diagnostics.strategy: The Deployment may still use Recreate, which removes the existing Pods before replacement. Check that the live strategy is RollingUpdate. [Cause and check](guides#guide=kubernetes-workloads&section=q102-rolling-strategy)
diagnostics.rolling: The rollout budget may permit unavailable Pods or resolve to the wrong surge count. Evaluate the limits at the desired replica count, rounding surge up and unavailable down, for an effective budget of one extra and zero unavailable. [Cause and check](guides#guide=kubernetes-workloads&section=q102-replacement-budget)
diagnostics.readiness: The worker readiness probe may still target port 8099 or a different protocol, host or named port. Inspect the single HTTP action on the unique worker and resolve its port to 8080. [Cause and check](guides#guide=kubernetes-workloads&section=q102-worker-http-readiness)
diagnostics.uid_file: The frozen original Deployment UID may be unavailable or empty, making identity verification impossible. Check that the original receipt exists before comparing the live UID. [Cause and check](guides#guide=kubernetes-workloads&section=q102-original-deployment-receipt)
diagnostics.uid: Recreating the Deployment under the same name permanently changes its UID. Compare the live UID with the original receipt before rolling back the existing object. [Cause and check](guides#guide=kubernetes-workloads&section=q102-deployment-identity)
diagnostics.replicas: Scaling or replacing the manifest may have changed the desired count. Check that .spec.replicas remains two. [Cause and check](guides#guide=kubernetes-workloads&section=q102-desired-replicas)
diagnostics.ready: The desired count can be two while replacement workers fail readiness. Inspect the current Pods and wait for two ready replicas in the Deployment status. [Cause and check](guides#guide=kubernetes-workloads&section=q102-ready-replica-count)
diagnostics.http_v1: The rollback may not have restored the healthy payload or the Service may have no ready endpoints. Read the live response from board and compare it with north-102. [Cause and check](guides#guide=kubernetes-workloads&section=q102-baseline-service-response)
diagnostics.http_v3: The new Pods may still fail readiness or the Service may temporarily reach older workers. Compare the observed body with north-102-v3 after rollout and examine timeouts or missing endpoints separately. [Cause and check](guides#guide=kubernetes-workloads&section=q102-updated-service-response)
diagnostics.probe_0_0: The rollout observer can fail before it reports a strategy, budget or probe field if its Python process cannot start. Verify Python and access to the board Deployment. [Cause and check](guides#guide=kubernetes-workloads&section=q102-rollout-observer-input)
diagnostics.probe_1_0: The rollout observer can fail before it reports a strategy, budget or probe field if its Python process cannot start. Verify Python and access to the board Deployment. [Cause and check](guides#guide=kubernetes-workloads&section=q102-rollout-observer-input)
diagnostics.probe_1_2: The bounded HTTP observer can fail before reporting a last response when Python or its input fails. Check the tools and the live Service before retrying. [Cause and check](guides#guide=kubernetes-workloads&section=q102-service-observer-input)
