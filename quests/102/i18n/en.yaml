title: Rollout strategies and rollback
brief: 'A bad readiness probe was rolled out with Recreate, taking the old board down.
  Recover the recorded healthy template with rollout undo and configure RollingUpdate
  with maxUnavailable: 0 and maxSurge: 1 for future changes. Preserve the Deployment
  UID and two replicas. A second stage introduces a new board revision with a bad
  probe; repair that probe instead of reverting the new content. Strategy alone does
  not guarantee availability: readiness, spare capacity and application behavior also
  matter.


  Quest files in `~/quest` (some appear in later stages): `board.json`, `service.json`,
  `healthy-revision`, `original-deployment-uid`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images
  and private services. Change only this bay.


  Initial success criteria: The recorded healthy template is restored on the same
  Deployment; two replicas are ready and rolling-update safety limits are configured.'
debrief: Recovery separated rollout strategy, template history and readiness rather
  than treating undo as a complete availability policy.
stages.0.brief: 'Success criteria: The recorded healthy template is restored on the
  same Deployment; two replicas are ready and rolling-update safety limits are configured.'
stages.0.objectives.0.text: The recorded healthy template is restored on the same
  Deployment; two replicas are ready and rolling-update safety limits are configured.
stages.1.brief: 'Success criteria: The new revision serves north-102-v3 with two ready
  replicas, the same Deployment identity and the intended rolling strategy.'
stages.1.objectives.0.text: The new revision serves north-102-v3 with two ready replicas,
  the same Deployment identity and the intended rolling strategy.
hints.0.text: Recreate removes the old revision before the replacement is ready.
hints.1.text: Undo changes the Pod template; strategy is a separate Deployment field.
hints.2.text: Restore the known healthy revision, retain rolling limits, then diagnose
  the next probe without discarding new content.
phrases.0: I recovered a known healthy Deployment revision.
phrases.1: I configured surge and unavailable limits explicitly.
phrases.2: I verified the new content and readiness after rollout.
questions.0.points.0: No; readiness correctness, capacity and application shutdown
  also matter.
questions.0.points.1: It constrains the controller's available replica budget.
questions.0.prompt: Does maxUnavailable zero guarantee zero downtime?
questions.1.points.0: It restores a previous Pod template from revision history.
questions.1.points.1: Review strategy and other non-template fields separately.
questions.1.prompt: Does rollout undo restore every Deployment field?
