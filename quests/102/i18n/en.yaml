title: Rollout strategies and rollback
brief: 'Work in `~/quest` with `board.json`, `service.json`, `healthy-revision` and `original-deployment-uid`. A bad readiness
  probe was rolled out with `Recreate`, taking the old board down. The recorded revision is a recovery starting point: inspect
  rollout history and use `kubectl rollout undo deployment/board --to-revision=N`, replacing N with `healthy-revision`. Configure
  `RollingUpdate` with exactly numeric `maxUnavailable: 0` and `maxSurge: 1`, with no extra rollingUpdate fields. Keep the
  original Deployment UID and two replicas. Wait for two ready replicas and verify the first container readiness HTTP port
  is 8080 and `board:8080` returns `north-102`. The next stage introduces new content; repair its probe and verify `north-102-v3`.
  The checks observe these current settings and responses, not the entire historical template or which commands were used.
  Work only in the offline bay.'
debrief: The checks observed Deployment identity, rolling strategy, readiness port and each stage response.
stages.0.brief: The original Deployment UID, two ready replicas, specified rolling strategy, readiness port 8080 and `north-102`
  response match the brief.
stages.0.objectives.0.text: The original Deployment UID, two ready replicas, specified rolling strategy, readiness port 8080
  and `north-102` response match the brief.
stages.1.brief: The original Deployment UID, two ready replicas, specified rolling strategy, readiness port 8080 and `north-102-v3`
  response match the brief.
stages.1.objectives.0.text: The original Deployment UID, two ready replicas, specified rolling strategy, readiness port 8080
  and `north-102-v3` response match the brief.
hints.0.text: Recreate removes the old revision before the replacement is ready.
hints.1.text: Undo changes the Pod template; strategy is a separate Deployment field.
hints.2.text: Restore the known healthy revision, retain rolling limits, then diagnose the next probe without discarding new
  content.
phrases.0: I recovered a known healthy Deployment revision.
phrases.1: I configured surge and unavailable limits explicitly.
phrases.2: I verified the new content and readiness after rollout.
questions.0.points.0: No; readiness correctness, capacity and application shutdown also matter.
questions.0.points.1: It constrains the controller's available replica budget.
questions.0.prompt: Does maxUnavailable zero guarantee zero downtime?
questions.1.points.0: It restores a previous Pod template from revision history.
questions.1.points.1: Review strategy and other non-template fields separately.
questions.1.prompt: Does rollout undo restore every Deployment field?
