title: Rollout strategies and rollback
brief: "Service availability was lost during a release. Recover the first response, then retain the new content\
  \ introduced in the next stage.\n\nWork in `~/quest` on the workstation. Supplied files: `board.yaml`, `service.yaml`,\
  \ `healthy-revision`.\n\n**Requirements:**\n- Stage 1:\n  - Deployment `board` replaces replicas without\
  \ planned unavailability, with at most `1` extra replica and the supplied HTTP readiness behavior.\n  - The\
  \ original Deployment `board` keeps exactly `2` replicas, both ready.\n  - From `deployment/board`, HTTP\
  \ `http://board:8080` returns `north-102`.\n- Stage 2:\n  - Deployment `board` replaces replicas without\
  \ planned unavailability, with at most `1` extra replica and the supplied HTTP readiness behavior.\n  - The\
  \ original Deployment `board` keeps exactly `2` replicas, both ready.\n  - From `deployment/board`, HTTP\
  \ `http://board:8080` returns `north-102-v3`.\n\nChecks observe current settings and responses, not the entire\
  \ historical template or the commands used.\n"
debrief: The checks observed Deployment identity, rolling strategy, readiness port and each stage response.
stages.0.brief: Restore the initial response with the original Deployment and required availability settings.
stages.1.brief: Keep the next-stage content available with the same identity and availability guarantees.
hints.0.text: A release must balance replacement progress with continued service availability.
hints.1.text: 'Recreate removes the old revision before the replacement is ready. Here a bad readiness probe
  was rolled out with Recreate.


  Undo changes the Pod template; strategy is a separate Deployment field.


  Inspect the supplied definitions, current resources and events.


  ```sh

  cat board.yaml

  kubectl get deployment board -o yaml

  kubectl rollout history deployment/board

  ```'
hints.2.text: 'Restore the known healthy revision, retain rolling limits, then diagnose the next probe without discarding new content. Inspect rollout history and use kubectl rollout undo deployment/board --to-revision=N with N from healthy-revision. Use RollingUpdate with numeric maxUnavailable=0 and maxSurge=1, without extra rollingUpdate fields.


  Verify the observed result:


  ```sh

  kubectl rollout status deployment/board --timeout=3s

  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080

  ```


  Expect two ready replicas and north-102 in stage 1, then north-102-v3 in stage 2; retain the original Deployment throughout.


  Supplied constraints and details: Deployment `board` uses `RollingUpdate` with `0` unavailable and `1` surge replica, and HTTP readiness on port `8080`. Deployment `board` uses `RollingUpdate` with `0` unavailable and `1` surge replica, and HTTP readiness on port `8080`.'
phrases.0: I recovered a known healthy Deployment revision.
phrases.1: I configured surge and unavailable limits explicitly.
phrases.2: I verified the new content and readiness after rollout.
questions.0.points.0: No; readiness correctness, capacity and application shutdown also matter.
questions.0.points.1: It constrains the controller's available replica budget.
questions.0.prompt: Does maxUnavailable zero guarantee zero downtime?
questions.1.points.0: It restores a previous Pod template from revision history.
questions.1.points.1: Review strategy and other non-template fields separately.
questions.1.prompt: Does rollout undo restore every Deployment field?
diagnostics.uid_file: original-deployment-uid must be present.
diagnostics.uid: deployment/board UID must equal original-deployment-uid.
diagnostics.replicas: deployment/board replicas must equal 2.
diagnostics.strategy: deployment/board strategy must equal RollingUpdate.
diagnostics.rolling: deployment/board replacement budget must allow 0 unavailable and at most 1 extra replica.
diagnostics.ready: deployment/board readyReplicas must equal 2.
diagnostics.readiness: The worker HTTP readiness probe must reach its application listener.
diagnostics.http_v1: board:8080 must equal north-102.
diagnostics.http_v3: board:8080 must equal north-102-v3.
