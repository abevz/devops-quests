id: 102
title: title
track: Kubernetes
difficulty: medium
brief: brief
stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    check: 'test "$(kubectl get deployment board -o jsonpath=''{.metadata.uid}'')" = "$(cat /run/dq/facts/0/original-deployment-uid)"

      kubectl get deployment board -o json | jq -e ''.spec.replicas==2 and .spec.strategy.type=="RollingUpdate"
      and .spec.strategy.rollingUpdate=={maxSurge:1,maxUnavailable:0} and .status.readyReplicas==2 and
      .spec.template.spec.containers[0].readinessProbe.httpGet.port==8080'' >/dev/null

      test "$(kubectl exec deployment/board -- wget -qO- -T 3 http://board:8080)" = north-102'
- brief: stages.1.brief
  objectives:
  - text: stages.1.objectives.0.text
    check: 'test "$(kubectl get deployment board -o jsonpath=''{.metadata.uid}'')" = "$(cat /run/dq/facts/0/original-deployment-uid)"

      kubectl get deployment board -o json | jq -e ''.spec.replicas==2 and .spec.strategy.type=="RollingUpdate"
      and .spec.strategy.rollingUpdate=={maxSurge:1,maxUnavailable:0} and .status.readyReplicas==2 and
      .spec.template.spec.containers[0].readinessProbe.httpGet.port==8080'' >/dev/null

      test "$(kubectl exec deployment/board -- wget -qO- -T 3 http://board:8080)" = north-102-v3'
