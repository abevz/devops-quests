id: 102
title: title
track: Kubernetes
difficulty: medium
brief: brief
stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    check: 'set -euo pipefail

      cd ~/quest

      failed=0

      board=$(kubectl get deployment board -o json 2>/dev/null || true)

      uid=$(cat /run/dq/facts/0/original-deployment-uid 2>/dev/null || true)

      check() { local label=$1 expression=$2; if ! jq -e --arg uid "$uid" "$expression" <<<"$board" >/dev/null 2>&1;
      then printf ''%s\n'' "$label: ✗"; failed=1; fi; }

      if ! test -n "$uid"; then printf ''%s\n'' ''original-deployment-uid exists: ✗ [DQ:uid_file]''; failed=1; fi

      check ''deployment/board UID = original-deployment-uid [DQ:uid]'' ''.metadata.uid==$uid''

      exit "$failed"

      '
  - text: stages.0.objectives.1.text
    check: 'set -euo pipefail

      cd ~/quest

      failed=0

      board=$(kubectl get deployment board -o json 2>/dev/null || true)

      uid=$(cat /run/dq/facts/0/original-deployment-uid 2>/dev/null || true)

      check() { local label=$1 expression=$2; if ! jq -e --arg uid "$uid" "$expression" <<<"$board" >/dev/null 2>&1;
      then printf ''%s\n'' "$label: ✗"; failed=1; fi; }

      check ''deployment/board replicas = 2 [DQ:replicas]'' ''.spec.replicas==2''

      exit "$failed"

      '
  - text: stages.0.objectives.2.text
    check: 'set -euo pipefail

      cd ~/quest

      failed=0

      board=$(kubectl get deployment board -o json 2>/dev/null || true)

      uid=$(cat /run/dq/facts/0/original-deployment-uid 2>/dev/null || true)

      check() { local label=$1 expression=$2; if ! jq -e --arg uid "$uid" "$expression" <<<"$board" >/dev/null 2>&1;
      then printf ''%s\n'' "$label: ✗"; failed=1; fi; }

      check ''deployment/board strategy = RollingUpdate [DQ:strategy]'' ''.spec.strategy.type=="RollingUpdate"''

      check ''deployment/board rollingUpdate = {maxSurge:1,maxUnavailable:0} [DQ:rolling]'' ''.spec.strategy.rollingUpdate=={maxSurge:1,maxUnavailable:0}''

      exit "$failed"

      '
  - text: stages.0.objectives.3.text
    check: 'set -euo pipefail

      cd ~/quest

      failed=0

      board=$(kubectl get deployment board -o json 2>/dev/null || true)

      uid=$(cat /run/dq/facts/0/original-deployment-uid 2>/dev/null || true)

      check() { local label=$1 expression=$2; if ! jq -e --arg uid "$uid" "$expression" <<<"$board" >/dev/null 2>&1;
      then printf ''%s\n'' "$label: ✗"; failed=1; fi; }

      check ''first container readiness HTTP port = 8080 [DQ:readiness]'' ''.spec.template.spec.containers[0].readinessProbe.httpGet.port==8080''

      exit "$failed"

      '
  - text: stages.0.objectives.4.text
    check: 'set -euo pipefail

      cd ~/quest

      failed=0

      board=$(kubectl get deployment board -o json 2>/dev/null || true)

      uid=$(cat /run/dq/facts/0/original-deployment-uid 2>/dev/null || true)

      check() { local label=$1 expression=$2; if ! jq -e --arg uid "$uid" "$expression" <<<"$board" >/dev/null 2>&1;
      then printf ''%s\n'' "$label: ✗"; failed=1; fi; }

      check ''deployment/board readyReplicas = 2 [DQ:ready]'' ''.status.readyReplicas==2''

      exit "$failed"

      '
  - text: stages.0.objectives.5.text
    check: 'set -euo pipefail

      cd ~/quest

      failed=0

      if ! test "$(timeout 4s kubectl exec --pod-running-timeout=2s deployment/board -- wget -qO- -T 3 http://board:8080
      2>/dev/null)" = north-102; then printf ''%s\n'' ''board:8080 = north-102: ✗ [DQ:http_v1]''; failed=1; fi

      exit "$failed"

      '
