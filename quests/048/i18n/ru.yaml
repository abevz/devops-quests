title: Продление Vault
brief: 'Workload `reader` не может получить конфигурацию из Vault.


  Работайте на рабочей станции в `~/quest` с `platform.env`, `station-token`, `issue-token.sh`, `issue-request.json`,
  `renew-token.sh`, `renew-request.json`, `sync-secret.sh`, `reader.yaml`.


  **Требования:**

  - Файл `~/quest/station-token` на workstation имеет режим `0600`.

  - Токен из `station-token` на workstation возобновляемый, имеет TTL больше `90` секунд, максимальный TTL
  `600` и ровно политики `default` и `rail-reader`.

  - Токен из `station-token` на рабочей станции может читать требуемую конфигурацию диспетчеризации, но не
  другие данные и не управлять монтированиями.

  - Поставленный издатель может выдавать токены только через профиль станции; другие профили и изменение политики
  читателя остаются запрещены.

  - Внутри Pod Deployment `reader` файл `/tmp/route` содержит поставленную конфигурацию диспетчеризации из
  существующего Kubernetes Secret; workload не содержит токена Vault.

  - Deployment `reader` завершает rollout в namespace песочницы.

  '
debrief: Выпуск, продление и доставка учётных данных проверены отдельно, включая реальный остаток lease.
stages.0.brief: Потребитель конфигурации должен иметь действительную ограниченную аренду и приватный доступ.
hints.0.text: Срок действия учётных данных и их доставка потребителю — разные задачи.
hints.1.text: 'Истёкший токен не может возобновить себя; сначала выпустите новый ограниченный токен доступа
  через issue-token.sh.


  Изучите поставленные входные данные и наблюдаемое состояние:


  ```sh

  cat issue-request.json renew-request.json reader.yaml

  cat issue-token.sh renew-token.sh sync-secret.sh

  kubectl describe deployment reader

  ```'
hints.2.text: |-
  Новый токен живёт лишь 60s. Увеличьте increment в renew-request.json до 180s (в пределах лимита роли 600s) и выполните renew-token.sh, чтобы остаток lease превысил 90s.

  Сохраните mode 0600 на station-token, выполните sync-secret.sh для доставки прикладного значения в Kubernetes Secret и восстановите нагрузку reader.

  Проверьте наблюдаемый результат:

  - `source platform.env; token=$(cat station-token); ls -l station-token; curl -fsS -H @<(printf 'X-Vault-Token: %s\n' "$token") "$VAULT_ADDR/v1/auth/token/lookup-self" | jq '.data | {ttl,renewable,explicit_max_ttl,policies}'` — Режим `-rw-------`, TTL больше `90`, renewable `true`, максимальный TTL `600`, политики `default`, `rail-reader`.
  - `source platform.env; token=$(cat station-token); curl -fsS -X POST -H @<(printf 'X-Vault-Token: %s\n' "$token") -H 'Content-Type: application/json' --data '{"paths":["secret/data/dispatch","secret/data/other","sys/mounts"]}' "$VAULT_ADDR/v1/sys/capabilities-self" | jq '.data // .'; curl -fsS -X POST -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_MANAGER_TOKEN") -H 'Content-Type: application/json' --data '{"paths":["sys/policies/acl/rail-reader","auth/token/create/rail-station","auth/token/create/other"]}' "$VAULT_ADDR/v1/sys/capabilities-self" | jq '.data // .'` — Токен имеет `read` только для dispatch; издатель имеет `update` для `auth/token/create/rail-station`; остальные названные пути имеют `deny`.
  - `kubectl rollout status deployment/reader --timeout=10s; kubectl exec deployment/reader -c worker -- sh -c 'test "$(cat /tmp/route)" = north-secret && printf "configuration matches\n"'` — Rollout завершается; потребитель выводит `configuration matches`.

  Убедитесь, что Deployment и каждый контейнер приложения в его активных Pod не содержат предоставленных Vault-токенов. При успехе выводится только `true`; значения credentials остаются на workstation и не выводятся.

  ```sh
  source platform.env
  VAULT_MANAGER_TOKEN="${VAULT_MANAGER_TOKEN:-}" VAULT_READER_TOKEN="${VAULT_READER_TOKEN:-}" python3 -I - <<'VERIFY_WORKLOAD_ENV'
  import json,os,subprocess,sys
  from pathlib import Path
  try:
      deployment=json.loads(subprocess.check_output(['kubectl','get','deployment','reader','-o','json'],stderr=subprocess.DEVNULL,timeout=4))
      tokens={value for value in (Path('station-token').read_text().strip(),os.environ.get('VAULT_MANAGER_TOKEN'),os.environ.get('VAULT_READER_TOKEN')) if value}
      assert tokens and all(value not in json.dumps(deployment) for value in tokens)
      def observed(args):
          return subprocess.check_output(['kubectl']+args,stderr=subprocess.DEVNULL,timeout=4)
      replicasets=json.loads(observed(['get','replicasets','-o','json']))
      pods=json.loads(observed(['get','pods','-o','json']))
      uid=deployment['metadata']['uid']
      owners={rs['metadata']['uid'] for rs in replicasets.get('items',[]) if any(ref.get('kind')=='Deployment' and ref.get('uid')==uid and ref.get('controller') is True for ref in rs.get('metadata',{}).get('ownerReferences',[]))}
      active=[pod for pod in pods.get('items',[]) if pod.get('metadata',{}).get('deletionTimestamp') is None and pod.get('status',{}).get('phase') not in ('Failed','Succeeded') and any(ref.get('kind')=='ReplicaSet' and ref.get('uid') in owners and ref.get('controller') is True for ref in pod.get('metadata',{}).get('ownerReferences',[]))]
      assert active
      for pod in active:
          assert pod.get('status',{}).get('phase')=='Running'
          for container in pod['spec']['containers']:
              environment=observed(['exec','--pod-running-timeout=2s',pod['metadata']['name'],'-c',container['name'],'--','env'])
              assert all(value.encode() not in environment for value in tokens)
      print('true')
  except Exception:
      print('false');sys.exit(1)
  VERIFY_WORKLOAD_ENV
  ```
phrases.0: Я отделил выпуск учётных данных от продления оставшейся lease.
phrases.1: Я проверил реальный TTL в пределах ограниченного абсолютного срока.
phrases.2: Я сохранил приватность Vault token и доставил только значение приложения через Kubernetes Secret.
