title: Продление Vault
brief: 'Workload `reader` не может получить конфигурацию из Vault.


  Работайте на рабочей станции в `~/quest` с `platform.env`, `station-token`, `issue-token.sh`, `issue-request.json`,
  `renew-token.sh`, `renew-request.json`, `sync-secret.sh`, `reader.yaml`.


  **Требования:**

  - Файл `~/quest/station-token` на workstation имеет режим `0600`.

  - Токен из `station-token` на workstation возобновляемый, имеет TTL больше `90` секунд, максимальный TTL
  `600` и ровно политики `default` и `rail-reader`.

  - Токен из `station-token` на рабочей станции может читать требуемую конфигурацию диспетчеризации, но не
  другие данные и не управлять монтированиями.

  - Поставленный издатель может выдавать токены только через профиль станции; другие профили и изменение политики
  читателя остаются запрещены.

  - Внутри Pod Deployment `reader` файл `/tmp/route` содержит поставленную конфигурацию диспетчеризации из
  существующего Kubernetes Secret; workload не содержит токена Vault.

  - Deployment `reader` завершает rollout в namespace песочницы.

  '
debrief: Выпуск, продление и доставка учётных данных проверены отдельно, включая реальный остаток lease.
stages.0.brief: Потребитель конфигурации должен иметь действительную ограниченную аренду и приватный доступ.
hints.0.text: Срок действия учётных данных и их доставка потребителю — разные задачи.
hints.1.text: 'Истёкший токен не может возобновить себя; сначала выпустите новый ограниченный токен доступа
  через issue-token.sh.


  Изучите поставленные входные данные и наблюдаемое состояние:


  ```sh

  cat issue-request.json renew-request.json reader.yaml

  cat issue-token.sh renew-token.sh sync-secret.sh

  kubectl describe deployment reader

  ```'
hints.2.text: 'Новый токен живёт лишь 60s. Увеличьте increment в renew-request.json до 180s (в пределах лимита
  роли 600s) и выполните renew-token.sh, чтобы остаток lease превысил 90s.


  Сохраните mode 0600 на station-token, выполните sync-secret.sh для доставки прикладного значения в Kubernetes
  Secret и восстановите нагрузку reader.


  Проверьте наблюдаемый результат:


  - `source platform.env; token=$(cat station-token); ls -l station-token; curl -fsS -H @<(printf ''X-Vault-Token:
  %s\n'' "$token") "$VAULT_ADDR/v1/auth/token/lookup-self" | jq ''.data | {ttl,renewable,explicit_max_ttl,policies}''`
  — Режим `-rw-------`, TTL больше `90`, renewable `true`, максимальный TTL `600`, политики `default`, `rail-reader`.

  - `source platform.env; token=$(cat station-token); curl -fsS -X POST -H @<(printf ''X-Vault-Token: %s\n''
  "$token") -H ''Content-Type: application/json'' --data ''{"paths":["secret/data/dispatch","secret/data/other","sys/mounts"]}''
  "$VAULT_ADDR/v1/sys/capabilities-self" | jq ''.data // .''; curl -fsS -X POST -H @<(printf ''X-Vault-Token:
  %s\n'' "$VAULT_MANAGER_TOKEN") -H ''Content-Type: application/json'' --data ''{"paths":["sys/policies/acl/rail-reader","auth/token/create/rail-station","auth/token/create/other"]}''
  "$VAULT_ADDR/v1/sys/capabilities-self" | jq ''.data // .''` — Токен имеет `read` только для dispatch; издатель
  имеет `update` для `auth/token/create/rail-station`; остальные названные пути имеют `deny`.

  - `kubectl rollout status deployment/reader --timeout=10s; kubectl get deployment reader -o json | jq -e
  --rawfile token station-token ''tostring|contains($token|sub("\n+$";""))|not''; kubectl exec deployment/reader
  -- sh -c ''test "$(cat /tmp/route)" = north-secret && printf "configuration matches\n"''` — Rollout завершается,
  проверка отсутствия токена печатает `true`, потребитель печатает `configuration matches`.'
phrases.0: Я отделил выпуск учётных данных от продления оставшейся lease.
phrases.1: Я проверил реальный TTL в пределах ограниченного абсолютного срока.
phrases.2: Я сохранил приватность Vault token и доставил только значение приложения через Kubernetes Secret.
stages.0.objectives.0.text: Файл `~/quest/station-token` на workstation имеет режим `0600`.
stages.0.objectives.1.text: Токен из `station-token` на workstation возобновляемый, имеет TTL больше `90` секунд,
  максимальный TTL `600` и ровно политики `default` и `rail-reader`.
stages.0.objectives.2.text: Токен из `station-token` на рабочей станции может читать требуемую конфигурацию
  диспетчеризации, но не другие данные и не управлять монтированиями.
stages.0.objectives.3.text: Поставленный издатель может выдавать токены только через профиль станции; другие
  профили и изменение политики читателя остаются запрещены.
stages.0.objectives.4.text: Внутри Pod Deployment `reader` файл `/tmp/route` содержит поставленную конфигурацию
  диспетчеризации из существующего Kubernetes Secret; workload не содержит токена Vault.
stages.0.objectives.5.text: Deployment `reader` завершает rollout в namespace песочницы.
