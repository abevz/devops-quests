title: Продление Vault
brief: 'Нагрузка reader не может получить конфигурацию из Vault: локальный reader
  token в station-token выпускается с коротким начальным сроком 60s (при абсолютном
  лимите роли 600s). Доставьте секрет в нагрузку reader и оставьте в station-token
  (mode 0600) действующий возобновляемый reader token с остатком TTL более 90 секунд
  (целевой шаг продления — 180s). Помещать сам Vault token в манифест нагрузки нельзя.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `platform.env`,
  `station-token`, `reader.hcl`, `issue-token.sh`, `issue-request.json`, `renew-token.sh`,
  `renew-request.json`, `sync-secret.sh`, `reader.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно
  загруженные образы и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Ограниченный renewable reader token имеет TTL >90s и mode 0600;
  reader получает north-secret из доставленного Secret. Фактические capabilities reader
  и issuer ограничены чтением dispatch и выданной ролью выпуска token.


  Issuer может выпускать token только через выданную роль reader; менять политику
  reader в Vault он не может.'
debrief: Выпуск, продление и доставка учётных данных проверены отдельно, включая реальный
  остаток lease.
stages.0.brief: 'Результат проверки: Ограниченный renewable reader token имеет TTL
  >90s и mode 0600; reader получает north-secret из доставленного Secret. Фактические
  capabilities reader и issuer ограничены чтением dispatch и выданной ролью выпуска
  token.'
stages.0.objectives.0.text: Ограниченный renewable reader token имеет TTL >90s и mode
  0600; reader получает north-secret из доставленного Secret. Фактические capabilities
  reader и issuer ограничены чтением dispatch и выданной ролью выпуска token.
hints.0.text: Проверьте текущее состояние токена через lookup-self (не выводя сам
  токен). Истёкший token не может продлить себя — сначала перевыпустите ограниченный
  reader token через issue-token.sh.
hints.1.text: Новый токен живёт лишь 60s. Увеличьте increment в renew-request.json
  до 180s (в пределах лимита роли 600s) и выполните renew-token.sh, чтобы остаток
  lease превысил 90s.
hints.2.text: Сохраните mode 0600 на station-token, выполните sync-secret.sh для доставки
  прикладного значения в Kubernetes Secret и восстановите нагрузку reader.
phrases.0: Я отделил выпуск учётных данных от продления оставшейся lease.
phrases.1: Я проверил реальный TTL в пределах ограниченного абсолютного срока.
phrases.2: Я сохранил приватность Vault token и доставил только значение приложения
  через Kubernetes Secret.
