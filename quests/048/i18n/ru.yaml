stages.0.objectives.1.text: Токен из `station-token` на workstation возобновляемый, имеет TTL больше `90` секунд,
  максимальный TTL `600` и ровно политики `default` и `rail-reader`.
stages.0.objectives.2.text: Токен из `station-token` на рабочей станции может читать требуемую конфигурацию
  диспетчеризации, но не другие данные и не управлять монтированиями.
stages.0.objectives.3.text: Поставленный издатель может выдавать токены только через профиль станции; другие
  профили и изменение политики читателя остаются запрещены.
stages.0.objectives.4.text: Внутри Pod Deployment `reader` файл `/tmp/route` содержит поставленную конфигурацию
  диспетчеризации из существующего Kubernetes Secret; workload не содержит токена Vault.
