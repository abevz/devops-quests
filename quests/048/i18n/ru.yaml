title: Продление Vault
brief: 'Игровой reader token Vault имеет короткую возобновляемую lease. Новый token сам по себе живёт
  не больше 60 секунд и не решает задачу. Увеличьте increment в renew-request.json до 180s, при истечении
  перевыпустите через issue-token.sh, продлите через renew-token.sh, затем запустите sync-secret.sh и
  восстановите reader. Выданная роль ограничивает абсолютный срок 600s. Сохраните mode 0600 station-token;
  в манифест нагрузки его помещать нельзя. Reader должен получить доставленный Secret, проверяемый token
  должен иметь остаток больше 90 секунд.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `platform.env`, `station-token`, `reader.hcl`,
  `issue-token.sh`, `issue-request.json`, `renew-token.sh`, `renew-request.json`, `sync-secret.sh`, `reader.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Ограниченный renewable reader token имеет TTL >90s и mode 0600; reader получает
  north-secret из доставленного Secret.


  Issuer может выпускать token только через выданную роль reader; менять политику reader в Vault он не
  может.'
debrief: Выпуск, продление и доставка учётных данных проверены отдельно, включая реальный остаток lease.
stages.0.brief: 'Ограниченный renewable reader token имеет TTL >90s и mode 0600; reader получает north-secret
  из доставленного Secret.


  Результат проверки: Ограниченный renewable reader token имеет TTL >90s и mode 0600; reader получает
  north-secret из доставленного Secret. Фактические capabilities reader и issuer ограничены чтением dispatch
  и выданной ролью выпуска token.'
stages.0.objectives.0.text: Ограниченный renewable reader token имеет TTL >90s и mode 0600; reader получает
  north-secret из доставленного Secret. Фактические capabilities reader и issuer ограничены чтением dispatch
  и выданной ролью выпуска token.
hints.0.text: Истёкший token не может продлить себя; сначала выпустите новый ограниченный reader token.
hints.1.text: Increment при продлении — запрашиваемый срок, ограниченный maximum TTL.
hints.2.text: Продлите до 180s, проверьте lookup-self без вывода token и доставьте Secret.
phrases.0: Я отделил выпуск учётных данных от продления оставшейся lease.
phrases.1: Я проверил реальный TTL в пределах ограниченного абсолютного срока.
phrases.2: Я сохранил приватность Vault token и доставил только значение приложения через Kubernetes Secret.
