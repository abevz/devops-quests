diagnostics.probe_0_4: 'Mit den aktuellen Eingaben konnte dieses Ziel nicht geprüft werden: In einem Pod von Deployment
  `reader` enthält `/tmp/route` die mitgelieferte Dispatch-Konfiguration aus dem vorhandenen Kubernetes-Secret;
  der Workload enthält kein Vault-Token.'
