title: Vault Erneuerung
brief: 'Der Workload station reader kann seine Vault-gestützte Konfiguration nicht lesen, da der lokale
  Vault reader token in station-token einen Kurzschluss aufweist Erster Leasingvertrag 60s (durch seine
  Rolle auf max. TTL 600s begrenzt). Liefern Sie das Geheimnis an den reader-Workload und hinterlassen
  Sie einen gültigen renewable reader token in station-token (Modus 0600) mit mehr als 90 Sekunden verbleibender
  TTL (Ziel a 180s Erneuerungsinkrement). Betten Sie Vault token niemals direkt in das Workload-Manifest
  ein.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `platform.env`, `station-token`,
  `reader.hcl`, `issue-token.sh`, `issue-request.json`, `renew-token.sh`, `renew-request.json`, `sync-secret.sh`,
  `reader.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Anfängliche Erfolgskriterien: Das begrenzte renewable reader token hat TTL >90s und den Modus 0600;
  reader verbraucht north-secret aus dem gelieferten Secret. Effektiv bleiben reader und issuer capabilities
  auf dispatch-Lesevorgänge und die bereitgestellte token-Rolle beschränkt.


  Der issuer kann nur die bereitgestellte Rolle reader token erstellen; Die Richtlinie Vault reader kann
  nicht bearbeitet werden.'
debrief: Das Ausstellen, Erneuern und Übermitteln von Anmeldeinformationen wurde als separate Aktionen
  verifiziert, einschließlich eines echten verbleibenden lease.
stages.0.brief: 'Erfolgskriterien: Das begrenzte renewable reader token hat TTL >90s und den Modus 0600;
  reader verbraucht north-secret aus seinem gelieferten Secret. Effektiv bleiben reader und issuer capabilities
  auf dispatch-Lesevorgänge und die bereitgestellte token-Rolle beschränkt.'
stages.0.objectives.0.text: Der begrenzte renewable reader token hat TTL >90s und den Modus 0600; reader
  verbraucht north-secret aus dem gelieferten Secret. Effektiv bleiben reader und issuer capabilities
  auf dispatch-Lesevorgänge und die bereitgestellte token-Rolle beschränkt.
hints.0.text: Überprüfen Sie den aktuellen token-Status mit lookup-self (ohne token zu drucken). Ein abgelaufener
  token kann sich nicht selbst erneuern; Geben Sie zuerst ein neues, gebundenes reader token über issue-token.sh
  aus.
hints.1.text: Ein neuer Token ist nur 60s gültig. Setzen Sie die Erneuerung increment in renew-request.json
  auf 180s (innerhalb der Rollenobergrenze 600s) und führen Sie renew-token.sh aus, sodass der verbleibende
  lease 90s übersteigt.
hints.2.text: Halten Sie station-token im Modus 0600, führen Sie sync-secret.sh aus, um den Anwendungswert
  an Kubernetes Secret zu liefern, und stellen Sie die Arbeitslast reader wieder her.
phrases.0: Ich habe die Ausstellung einer Berechtigung von der Erneuerung der verbleibenden lease unterschieden.
phrases.1: Ich habe den echten TTL innerhalb einer begrenzten Lebensdauer getestet.
phrases.2: Ich habe den Vault token privat gehalten und nur den Anwendungswert in einem Kubernetes Secret
  geliefert.
