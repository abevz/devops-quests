title: Vault renewal
brief: 'The game Vault reader has a short renewable lease. A fresh token alone lasts at most 60 seconds
  and is insufficient for this task. Increase renew-request.json increment to 180s, reissue with issue-token.sh
  if expired, renew with renew-token.sh, then sync-secret.sh and recover reader. The supplied role caps
  the absolute lifetime at 600s. Keep station-token mode 0600; never put it in the workload manifest.
  Reader must consume the delivered Secret and the checked token must have more than 90 seconds remaining.


  Quest files in `~/quest` (some appear in later stages): `platform.env`, `station-token`, `reader.hcl`,
  `issue-token.sh`, `issue-request.json`, `renew-token.sh`, `renew-request.json`, `sync-secret.sh`, `reader.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: The bounded renewable reader token has TTL >90s and mode 0600; reader consumes
  north-secret from its delivered Secret.


  The issuer can create only the supplied reader token role; it cannot edit the Vault reader policy.'
debrief: Issuing, renewing and delivering credentials were verified as separate actions, including a real
  remaining lease.
stages.0.brief: 'The bounded renewable reader token has TTL >90s and mode 0600; reader consumes north-secret
  from its delivered Secret.


  Success criteria: The bounded renewable reader token has TTL >90s and mode 0600; reader consumes north-secret
  from its delivered Secret. Effective reader and issuer capabilities stay limited to dispatch reads and
  the supplied token role.'
stages.0.objectives.0.text: The bounded renewable reader token has TTL >90s and mode 0600; reader consumes
  north-secret from its delivered Secret. Effective reader and issuer capabilities stay limited to dispatch
  reads and the supplied token role.
hints.0.text: An expired token cannot renew itself; issue a new bounded reader token first.
hints.1.text: A renewal increment is a requested lifetime, still capped by maximum TTL.
hints.2.text: Renew to 180s, inspect lookup-self without printing the token, then deliver the Secret.
phrases.0: I distinguished issuing a credential from renewing its remaining lease.
phrases.1: I checked the real TTL within a bounded absolute lifetime.
phrases.2: I kept the Vault token private and delivered only the application value in a Kubernetes Secret.
