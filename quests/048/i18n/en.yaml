title: Vault renewal
brief: 'The station reader workload cannot read its Vault-backed configuration because
  the local Vault reader token in station-token has a short 60s initial lease (capped
  at 600s max TTL by its role). Deliver the secret to the reader workload and leave
  a valid renewable reader token in station-token (mode 0600) with more than 90 seconds
  of remaining TTL (target a 180s renewal increment). Never embed the Vault token
  directly in the workload manifest.


  Quest files in `~/quest` (some appear in later stages): `platform.env`, `station-token`,
  `reader.hcl`, `issue-token.sh`, `issue-request.json`, `renew-token.sh`, `renew-request.json`,
  `sync-secret.sh`, `reader.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images
  and private services. Change only this bay.


  Initial success criteria: The bounded renewable reader token has TTL >90s and mode
  0600; reader consumes north-secret from its delivered Secret. Effective reader and
  issuer capabilities stay limited to dispatch reads and the supplied token role.


  The issuer can create only the supplied reader token role; it cannot edit the Vault
  reader policy.'
debrief: Issuing, renewing and delivering credentials were verified as separate actions,
  including a real remaining lease.
stages.0.brief: 'Success criteria: The bounded renewable reader token has TTL >90s
  and mode 0600; reader consumes north-secret from its delivered Secret. Effective
  reader and issuer capabilities stay limited to dispatch reads and the supplied token
  role.'
stages.0.objectives.0.text: The bounded renewable reader token has TTL >90s and mode
  0600; reader consumes north-secret from its delivered Secret. Effective reader and
  issuer capabilities stay limited to dispatch reads and the supplied token role.
hints.0.text: Inspect the current token state with lookup-self (without printing the
  token). An expired token cannot renew itself; reissue a fresh bounded reader token
  via issue-token.sh first.
hints.1.text: A fresh token only lasts 60s. Set the renewal increment in renew-request.json
  to 180s (within the 600s role cap) and run renew-token.sh so the remaining lease
  exceeds 90s.
hints.2.text: Keep station-token at mode 0600, run sync-secret.sh to deliver the application
  value into the Kubernetes Secret, and recover the reader workload.
phrases.0: I distinguished issuing a credential from renewing its remaining lease.
phrases.1: I checked the real TTL within a bounded absolute lifetime.
phrases.2: I kept the Vault token private and delivered only the application value
  in a Kubernetes Secret.
