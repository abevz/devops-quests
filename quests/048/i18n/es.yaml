title: Renovación Vault
brief: 'La carga de trabajo station reader no puede leer su configuración respaldada por Vault porque
  el Vault reader token local en station-token tiene un corto Arrendamiento inicial 60s (limitado a 600s
  max TTL por su función). Entregue el secreto a la carga de trabajo reader y deje un renewable reader
  token válido en station-token (modo 0600) con más de 90 segundos de TTL restantes (objetivo de un incremento
  de renovación 180s). Nunca incruste Vault token directamente en el manifiesto de carga de trabajo.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `platform.env`, `station-token`,
  `reader.hcl`, `issue-token.sh`, `issue-request.json`, `renew-token.sh`, `renew-request.json`, `sync-secret.sh`,
  `reader.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: el renewable reader token limitado tiene TTL >90s y modo 0600; reader
  consume north-secret de su Secret entregado. Los reader y issuer efectivos capabilities permanecen limitados
  a lecturas dispatch y la función token suministrada.


  El issuer puede crear solo el rol reader token suministrado; no puede editar la política Vault reader.'
debrief: La emisión, renovación y entrega de credenciales se verificaron como acciones separadas, incluida
  una lease real restante.
stages.0.brief: 'Criterios de éxito: el renewable reader token limitado tiene TTL >90s y modo 0600; reader
  consume north-secret de su Secret entregado. reader y issuer capabilities efectivos permanecen limitados
  a lecturas dispatch y la función token suministrada.'
stages.0.objectives.0.text: El renewable reader token acotado tiene TTL >90s y modo 0600; reader consume
  north-secret de su Secret entregado. reader y issuer capabilities efectivos permanecen limitados a lecturas
  dispatch y la función token suministrada.
hints.0.text: Inspeccione el estado actual de token con lookup-self (sin imprimir el token). Un token
  caducado no puede renovarse; Vuelva a emitir primero un reader token nuevo y delimitado a través de
  issue-token.sh.
hints.1.text: Un token nuevo solo dura 60s. Establezca la renovación increment en renew-request.json en
  180s (dentro del límite de rol 600s) y ejecute renew-token.sh para que el lease restante supere 90s.
hints.2.text: Mantenga station-token en el modo 0600, ejecute sync-secret.sh para entregar el valor de
  la aplicación en Kubernetes Secret y recupere la carga de trabajo reader.
phrases.0: Distinguí la emisión de una credencial de la renovación de su restante lease.
phrases.1: Verifiqué el TTL real dentro de una vida útil limitada.
phrases.2: Mantuve el Vault token privado y entregué solo el valor de la aplicación en un Kubernetes Secret.
