title: Odnowienie Vault
brief: 'station reader nie może odczytać konfiguracji opartej na Vault, ponieważ lokalny Vault reader
  token w station-token ma krótką początkową dzierżawę trwającą 60 s (ograniczoną maksymalnie do 600 s
  TTL ze względu na jej rolę). Dostarcz sekret do obciążenia reader i pozostaw prawidłowy kod renewable
  reader token w station-token (mode 0600) z ponad 90 sekundami pozostałego TTL (docelowo przyrost odnowienia
  180 s). Nigdy nie osadzaj Vault token bezpośrednio w manifeście obciążenia.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `platform.env`, `station-token`,
  `reader.hcl`, `issue-token.sh`, `issue-request.json`, `renew-token.sh`, `renew-request.json`, `sync-secret.sh`,
  `reader.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: ograniczony renewable reader token ma TTL > 90s i mode 0600; reader zużywa
  north-secret z dostarczonego Secret. Efektywne możliwości reader i issuer pozostają ograniczone do odczytów
  dispatch i dostarczonej roli token.


  issuer może utworzyć tylko dostarczoną rolę reader token; nie może edytować profilu Vault reader.'
debrief: Wydawanie, odnawianie i dostarczanie poświadczeń weryfikowano jako osobne działania, obejmujące
  rzeczywisty pozostały lease.
stages.0.brief: 'Kryteria sukcesu: Ograniczony renewable reader token ma TTL > 90s i mode 0600; reader
  zużywa north-secret z dostarczonego Secret. Efektywne możliwości reader i issuer pozostają ograniczone
  do odczytów dispatch i dostarczonej roli token.'
stages.0.objectives.0.text: Ograniczony renewable reader token ma TTL > 90s i mode 0600; reader zużywa
  north-secret z dostarczonego Secret. Efektywne możliwości reader i issuer pozostają ograniczone do odczytów
  dispatch i dostarczonej roli token.
hints.0.text: Sprawdź bieżący stan token za pomocą lookup-self (bez drukowania token). Wygasły token nie
  może zostać odnowiony; ponownie wyślij najpierw świeży, ograniczony reader token poprzez issue-token.sh.
hints.1.text: Nowy token trwa tylko 60 s. Ustaw odnowienie increment w renew-request.json na 180 s (w
  ramach limitu roli 600) i uruchom renew-token.sh, tak aby pozostały lease przekroczył 90 s.
hints.2.text: Zachowaj station-token pod adresem mode 0600, uruchom sync-secret.sh, aby dostarczyć wartość
  aplikacji do Kubernetes Secret i odzyskaj obciążenie reader.
phrases.0: Rozróżniłem wydanie referencji od odnowienia pozostałego lease.
phrases.1: Sprawdziłem prawdziwy TTL w ograniczonym absolutnym czasie życia.
phrases.2: Zachowałem Vault token jako prywatny i dostarczyłem tylko wartość aplikacji w Kubernetes Secret.
