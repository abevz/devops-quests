title: Incidente progresivo
brief: |-
  La recuperación de publicación y failover está incompleta. Recupera la ruta pública desde los datos suministrados y transfiérela al backup conservando el producer operativo.

  Trabaja en `~/quest` de la estación con `progressive-contract.json`; inspecciona workloads, datos de origen y objetos de enrutamiento del namespace Kubernetes.

  **Requisitos:**
  - Conserva la identidad del Deployment producer original y la identidad/datos del ConfigMap de origen. El producer proyecta ese origen y publica el registro suministrado mediante el ClusterIP Service basado en selector y la interfaz HTTP del contrato.
  - El Service dirige tráfico a Pods preparados controlados por el Deployment original activo.
  - En el failover, conserva la identidad del Service y del Deployment backup original. El backup obtiene `ROUTE` y `PRODUCER_ID` del mismo ConfigMap mediante referencias del entorno del contenedor y consume su proyección de datos.
  - El registro público del consumer coincide con la ruta e identidad de publicación originales. El Service público dirige ahora a los Pods preparados del backup.
  - Mantén sano el producer recuperado en su interfaz HTTP establecida y conserva su publicación original.

  Las comprobaciones observan identidades actuales de controladores/objetos, referencias de datos, endpoints preparados, entorno y registros HTTP; no prueban disponibilidad continua ni historial de comandos.
stages.0.brief: Recupera la publicación original tras un Service público estable.
stages.0.objectives.0.text: El producer original publica los datos intactos mediante el Service público declarado.
stages.1.brief: Activa el backup vinculado al origen en ese mismo Service conservando el producer sano.
stages.1.objectives.0.text: El backup original usa la ruta e identidad del origen, ocupa la ruta pública y conserva
  el producer recuperado.
hints.0.text: Readiness, datos publicados y enrutamiento del Service son contratos distintos. Un proceso sano no
  demuestra qué datos o controlador atienden la ruta pública.
hints.1.text: Compara `cat progressive-contract.json`, `kubectl get deployments,configmaps,services,endpointslices
  -o yaml` y eventos de Pods. Inspecciona proyecciones, referencias del entorno, propietarios controladores y registros
  HTTP reales de la etapa actual.
hints.2.text: Construye el consumo del origen y el Service público; verifica rollout y publicación del producer.
  Prepara luego referencias y registro de runtime del backup antes de cambiar el Service conservado. Compara `kubectl
  rollout status deployment/<name>`, entorno del contenedor, ambas rutas HTTP y propietarios de los Pods preparados
  con el contrato. Espera ruta/identidad originales y UID conservados sin cambios.
debrief: Los datos de origen llegan a un producer real y un backup vinculado al origen. La ruta pública cambió entre
  Pods preparados controlados conservando datos, workloads y Service establecido.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el estado de workload y su preparación después del cambio.
diagnostics.probe_0_0: El producer original publica los datos intactos mediante el Service público declarado.
diagnostics.probe_1_0: El backup original usa la ruta e identidad del origen, ocupa la ruta pública y conserva el
  producer recuperado.
diagnostics.progressive_producer: El producer original debe seguir desplegado y atender su interfaz de publicación
  original.
diagnostics.progressive_route: ROUTE del backup debe coincidir con la ruta original del origen.
diagnostics.progressive_identity: Conserva identidades originales de workloads, datos y Service público establecido.
diagnostics.progressive_source: Conserva cada entrada de datos suministrada.
diagnostics.progressive_projection: El producer debe proyectar el ConfigMap original.
diagnostics.progressive_consumer: El backup debe consumir el origen mediante referencias del entorno y proyección
  y publicar el registro de runtime correspondiente.
diagnostics.progressive_service: El ClusterIP Service público debe seleccionar Pods preparados del Deployment original
  activo.
diagnostics.progressive_publication: El registro HTTP público real debe coincidir con los datos originales.
