title: Incidente progresivo
brief: |-
  La recuperación de publicación y failover está incompleta. Recupera la ruta pública desde los datos suministrados y transfiérela al backup conservando el producer operativo.

  Trabaja en `~/quest` de la estación con `progressive-contract.json`; inspecciona workloads, datos de origen y objetos de enrutamiento del namespace Kubernetes.

  **Requisitos:**
  - Conserva la identidad del Deployment producer original y la identidad/datos del ConfigMap de origen. El producer proyecta ese origen y publica el registro suministrado mediante el ClusterIP Service basado en selector y la interfaz HTTP del contrato.
  - El Service dirige tráfico a Pods preparados controlados por el Deployment original activo.
  - En el failover, conserva la identidad del Service y del Deployment backup original. El backup obtiene `ROUTE` y `PRODUCER_ID` del mismo ConfigMap mediante referencias del entorno del contenedor y consume su proyección de datos.
  - El registro público del consumer coincide con la ruta e identidad de publicación originales. El Service público dirige ahora a los Pods preparados del backup.
  - Mantén sano el producer recuperado en su interfaz HTTP establecida y conserva su publicación original.

  Las comprobaciones observan identidades actuales de controladores/objetos, referencias de datos, endpoints preparados, entorno y registros HTTP; no prueban disponibilidad continua ni historial de comandos.
stages.0.brief: Recupera la publicación original tras un Service público estable.
stages.0.objectives.0.text: El producer original publica los datos intactos mediante el Service público declarado.
stages.1.brief: Activa el backup vinculado al origen en ese mismo Service conservando el producer sano.
stages.1.objectives.0.text: El backup original usa la ruta e identidad del origen, ocupa la ruta pública y conserva
  el producer recuperado.
hints.0.text: Readiness, datos publicados y enrutamiento del Service son contratos distintos. Un proceso sano no
  demuestra qué datos o controlador atienden la ruta pública.
hints.1.text: |-
  Compara `cat progressive-contract.json`, `kubectl get deployments,configmaps,services,endpointslices -o yaml` y eventos de Pods. Inspecciona proyecciones, referencias del entorno, propietarios controladores y registros HTTP reales de la etapa actual.

  Observa cómo el productor referencia el origen y cómo el Service público selecciona su backend. En la segunda etapa, compara las referencias y el registro de la aplicación de respaldo con los del productor y revisa el selector y los EndpointSlice del Service conservado.
hints.2.text: |-
  Compara `kubectl rollout status deployment/<name>`, entorno del contenedor, ambas rutas HTTP y propietarios de los Pods preparados con el contrato. Espera ruta/identidad originales y UID conservados sin cambios.
debrief: Los datos de origen llegan a un producer real y un backup vinculado al origen. La ruta pública cambió entre
  Pods preparados controlados conservando datos, workloads y Service establecido.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el estado de workload y su preparación después del cambio.
diagnostics.progressive_producer: El productor original no completó el despliegue o no sirve su interfaz conservada; el puerto readiness inicial difiere del servidor, la fuente HTTP está mal proyectada o falló la observación API/exec. [Causa y comprobación](guides#guide=kubernetes-4&section=progressive-producer-readiness)
diagnostics.progressive_route: ROUTE del respaldo no es north o no puede leerse; puede persistir el literal inicial retired, una referencia ConfigMap estar eclipsada, los Pods conservar un entorno anterior o fallar exec. [Causa y comprobación](guides#guide=kubernetes-12&section=progressive-consumer-route)
diagnostics.progressive_identity: Cambió un UID original de publicación; borrar y recrear una carga, ConfigMap fuente o Service establecido puede conservar el nombre pero sustituye la identidad guardada por el setup. [Causa y comprobación](guides#guide=kubernetes-4&section=progressive-retained-identities)
diagnostics.progressive_source: Las entradas originales difieren o no se puede observar el ConfigMap; editar ruta o publicación, generar otra identidad productora o consultar otros datos puede romper el conjunto conservado. [Causa y comprobación](guides#guide=kubernetes-12&section=progressive-source-data)
diagnostics.progressive_projection: El productor no monta un volumen del ConfigMap fuente original; puede seguir usando el directorio HTTP temporal inicial o el montaje worker no conecta con el volumen. [Causa y comprobación](guides#guide=kubernetes-12&section=progressive-source-projection)
diagnostics.progressive_consumer: El respaldo no consume y publica de forma coherente la fuente original; un literal o entorno que sobrescribe, proyección ausente, Pods antiguos, registro distinto o fallo API/exec pueden explicarlo. [Causa y comprobación](guides#guide=kubernetes-12&section=progressive-consumer-source)
diagnostics.progressive_service: El Service público puede faltar o no selecciona Pods listos del Deployment original activo o no puede observarse; el selector puede seguir en el productor tras failover, endpoints estar vacíos o ser ajenos o el puerto/tipo ser incorrecto. [Causa y comprobación](guides#guide=kubernetes-10&section=progressive-service-targets)
diagnostics.progressive_publication: La publicación HTTP pública difiere del registro original o no puede leerse; el Service puede alcanzar otra carga, worker servir otro directorio o datos antiguos o fallar HTTP/JSON. [Causa y comprobación](guides#guide=kubernetes-10&section=progressive-public-record)
diagnostics.probe_0_0: La prueba productora se detuvo sin marcador detallado; evidencia protegida del setup, estructura de carga, inicio de Python o una observación API interrumpida pueden impedir las comprobaciones de fuente y publicación. [Causa y comprobación](guides#guide=kubernetes-4&section=progressive-observer-inputs)
diagnostics.probe_1_0: La prueba failover se detuvo sin marcador detallado; datos originales o de fase de identidad, estructura de carga, inicio de Python u observación interrumpida pueden impedir comprobar respaldo y productor conservado. [Causa y comprobación](guides#guide=kubernetes-4&section=progressive-observer-inputs)
