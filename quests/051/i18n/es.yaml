title: Incidente progresivo
brief: 'Te uniste a las operaciones de SignalRail. Repare readiness antes de un segundo incidente de configuración.
  Trabajar en ~/quest. Mantenga todos los cambios dentro de esta bahía de entrenamiento.


  Archivos de búsqueda en `~/quest` (algunos se introducen en etapas posteriores): `deployment.json`,
  `backup.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente los archivos suministrados, las imágenes
  precargadas y los servicios privados. Todos los cambios deben permanecer dentro de esta bahía.


  Criterios de éxito iniciales: el primer worker está listo.'
stages.0.brief: 'Un incidente de probe bloqueó el primer worker. Reparación readiness.


  Criterios de éxito: El primer worker está listo.'
stages.0.objectives.0.text: El primer worker está listo.
stages.1.brief: 'Nuevo incidente: el backup reader recibió un retired route. Restaurar ROUTE=north.


  Criterios de éxito: backup reader ejecuta north route.'
stages.1.objectives.0.text: La copia de seguridad reader ejecuta el north route.
hints.0.text: El primer worker falló en su HTTP readiness probe.
hints.1.text: Compare el puerto probe con el HTTP listener; Mire el canal del equipo después de la recuperación.
hints.2.text: 'El segundo incidente utiliza otra implementación: verifique la variable RUTA backup reader.'
debrief: El primer error fue un puerto probe. Después de la recuperación, apareció un nuevo incidente
  de configuración backup-reader. Reparaste y verificaste ambas etapas.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el estado de workload y su preparación después del cambio.
