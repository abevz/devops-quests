title: Incidente progresivo
brief: |
  Dos incidentes consecutivos interrumpen el procesamiento de rutas. Completa la primera recuperación antes de abordar el segundo incidente.

  Trabaja en `~/quest` en la workstation. Archivos de entrada suministrados: `deployment.yaml`.

  La etapa 2 incorpora `backup.yaml` en `~/quest` en la workstation.

  **Requisitos:**
  - Etapa 1: el Deployment `relay` completa su rollout.
  - Etapa 2: dentro del contenedor `worker` del Deployment `backup`, el proceso en ejecución expone:
    - `ROUTE`: `north`

  **Verifica antes de Check & finish:**
  Ejecuta estos comandos de observación desde `~/quest` en la workstation.
  - `kubectl rollout status deployment/relay --timeout=3s` — Etapa 1: el rollout está completo.
  - `kubectl exec deployment/backup -c worker -- printenv ROUTE` — Etapa 2, cuando esté disponible: el proceso de respaldo en ejecución imprime `north`.
stages.0.brief: |
  El Deployment `relay` debe completar su rollout antes del siguiente incidente.
stages.0.objectives.0.text: El Deployment `relay` completa su rollout.
stages.1.brief: |
  La carga de respaldo en ejecución debe exponer la ruta requerida.
stages.1.objectives.0.text: El Deployment `backup` expone `ROUTE` con el valor `north`.
hints.0.text: El primer worker falló en su HTTP readiness probe.
hints.1.text: Compare el puerto probe con el HTTP listener; Mire el canal del equipo después de la recuperación.
hints.2.text: |
  El segundo incidente afecta a otro deployment: revisa la variable ROUTE del reader de respaldo. Recibió la ruta retired; restaura ROUTE=north.
debrief: El primer error fue un puerto probe. Después de la recuperación, apareció un nuevo incidente
  de configuración backup-reader. Reparaste y verificaste ambas etapas.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el estado de workload y su preparación después del cambio.
