title: Progressive incident
brief: 'You joined SignalRail operations. Repair readiness before a second configuration incident. Work
  in ~/quest. Keep all changes inside this training bay.


  Quest files in `~/quest` (some are introduced in later stages): `deployment.json`, `backup.json`.


  The bay has no Internet or external DNS. Use only its supplied files, preloaded images and private services.
  All changes must stay inside this bay.


  Initial success criteria: The first worker is ready.'
stages.0.brief: 'A probe incident blocked the first worker. Repair readiness.


  Success criteria: The first worker is ready.'
stages.0.objectives.0.text: The first worker is ready.
stages.1.brief: 'New incident: the backup reader received a retired route. Restore ROUTE=north.


  Success criteria: The backup reader runs the north route.'
stages.1.objectives.0.text: The backup reader runs the north route.
hints.0.text: The first worker failed its HTTP readiness probe.
hints.1.text: Compare the probe port with the HTTP listener; watch the team channel after recovery.
hints.2.text: 'The second incident uses another deployment: verify the backup reader ROUTE variable.'
debrief: The first failure was a probe port. After recovery, a new backup-reader configuration incident
  appeared. You repaired and verified both stages.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked the workload state and its readiness after the change.
