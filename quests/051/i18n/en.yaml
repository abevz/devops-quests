title: Progressive incident
brief: |-
  Two successive incidents interrupt route processing. Complete the first recovery before handling the second incident.

  Work on the workstation in `~/quest` with the supplied files:
  - `deployment.yaml`, `backup.yaml`.

  `backup.yaml` is introduced in stage 2.

  **Requirements:**

  - Stage 1: Deployment `relay` completes its rollout.
  - Stage 2: inside container `worker` of Deployment `backup`, the running process exposes:
    - `ROUTE`: `north`

  The stage checks confirm point-in-time outcomes, not continuous availability between incidents.
stages.0.brief: |
  Deployment `relay` must finish its rollout before the next incident.
stages.0.objectives.0.text: Deployment `relay` completes its rollout.
stages.1.brief: |
  The running backup workload must expose the required route.
stages.1.objectives.0.text: Deployment `backup` exposes `ROUTE` with value `north`.
hints.0.text: An incident can have successive recovery milestones with different observable results.
hints.1.text: |-
  The first worker failed its HTTP readiness probe. Compare the probe port with the HTTP listener; watch the team channel after recovery.

  Inspect the supplied inputs and live observations:

  ```sh
  # Stage 1
  kubectl describe deployment relay
  # Stage 2, after it appears
  kubectl describe deployment backup
  ```
hints.2.text: |-
  The second incident uses another deployment: verify the backup reader ROUTE variable. It received the retired route; restore ROUTE=north.

  Verify the result from `~/quest` on the workstation:

  Run these observation commands from `~/quest` on the workstation.
  - `kubectl rollout status deployment/relay --timeout=3s` — Stage 1: the rollout is complete.
  - `kubectl exec deployment/backup -c worker -- printenv ROUTE` — Stage 2, after it becomes available: the running backup process prints `north`.
debrief: The first failure was a probe port. After recovery, a new backup-reader configuration incident
  appeared. You repaired and verified both stages.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked the workload state and its readiness after the change.
