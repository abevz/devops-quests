title: Progressive incident
brief: |-
  Publication and failover recovery is incomplete. Restore the public path from the supplied source dataset, then transfer it to the backup while retaining the working producer.

  Work in `~/quest` on the workstation with `progressive-contract.json`; inspect the Kubernetes namespace for the current workloads, source data and routing objects.

  **Requirements:**
  - Keep the original producer Deployment identity and the original source ConfigMap identity/data. The producer projects that source and publishes the supplied record through the selector-based ClusterIP Service and HTTP interface declared in the contract.
  - The Service targets ready Pods controlled by the active original Deployment.
  - During failover, retain that Service identity and the original backup Deployment identity. The backup obtains `ROUTE` and `PRODUCER_ID` from the same source ConfigMap through container environment references and consumes its projected data.
  - The public consumer record agrees with the original source route and publication identity. The public Service now targets the ready backup Pods.
  - Keep the restored producer healthy on its established HTTP interface and keep its original source publication intact.

  Checks observe current controller/object identities, declared data references, ready endpoints, container environment and HTTP records; they do not prove uninterrupted availability or command history.
stages.0.brief: Restore the original source publication behind a stable public Service.
stages.0.objectives.0.text: The original producer publishes the intact source dataset through the declared public
  Service.
stages.1.brief: Activate the source-bound backup on that same public Service while keeping the producer healthy.
stages.1.objectives.0.text: The original backup uses the source route and identity, owns the public path, and leaves
  the restored producer intact.
hints.0.text: Readiness, published data and Service routing are different contracts. A healthy process alone does
  not establish which dataset or controller the public path uses.
hints.1.text: Compare `cat progressive-contract.json`, `kubectl get deployments,configmaps,services,endpointslices
  -o yaml` and Pod events. Inspect projected sources, environment references, controller ownership and the actual
  HTTP records at the current stage.
hints.2.text: Construct source consumption and the public Service, verify the producer’s rollout and published record,
  then prepare the backup’s source references and runtime record before switching the retained Service. Verify `kubectl
  rollout status deployment/<name>`, container environment, both declared HTTP paths and ready endpoint Pod owners
  against the supplied contract. Expect the original route/publication identity and unchanged retained object UIDs.
debrief: The source bundle now reaches a real producer and a source-bound backup. Public routing moved between controlled
  ready Pods while retaining the dataset, workloads and established Service.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked the workload state and its readiness after the change.
diagnostics.probe_0_0: The original producer publishes the intact source dataset through the declared public Service.
diagnostics.probe_1_0: The original backup uses the source route and identity, owns the public path, and leaves
  the restored producer intact.
diagnostics.progressive_producer: The original producer must remain rolled out and serve its original publication
  interface.
diagnostics.progressive_route: The backup ROUTE must match the original source route.
diagnostics.progressive_identity: Retain the original workload, dataset and established public Service identities.
diagnostics.progressive_source: Keep every supplied source data entry intact.
diagnostics.progressive_projection: The producer must project the original source ConfigMap.
diagnostics.progressive_consumer: The backup must consume the source through environment references and projection
  and publish the matching runtime record.
diagnostics.progressive_service: The public ClusterIP Service must select ready Pods controlled by the active original
  Deployment.
diagnostics.progressive_publication: The actual public HTTP record must match the original source dataset.
