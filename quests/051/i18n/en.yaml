title: Progressive incident
brief: |-
  Publication and failover recovery is incomplete. Restore the public path from the supplied source dataset, then transfer it to the backup while retaining the working producer.

  Work in `~/quest` on the workstation with `progressive-contract.json`; inspect the Kubernetes namespace for the current workloads, source data and routing objects.

  **Requirements:**
  - Keep the original producer Deployment identity and the original source ConfigMap identity/data. The producer projects that source and publishes the supplied record through the selector-based ClusterIP Service and HTTP interface declared in the contract.
  - The Service targets ready Pods controlled by the active original Deployment.
  - During failover, retain that Service identity and the original backup Deployment identity. The backup obtains `ROUTE` and `PRODUCER_ID` from the same source ConfigMap through container environment references and consumes its projected data.
  - The public consumer record agrees with the original source route and publication identity. The public Service now targets the ready backup Pods.
  - Keep the restored producer healthy on its established HTTP interface and keep its original source publication intact.

  Checks observe current controller/object identities, declared data references, ready endpoints, container environment and HTTP records; they do not prove uninterrupted availability or command history.
stages.0.brief: Restore the original source publication behind a stable public Service.
stages.0.objectives.0.text: The original producer publishes the intact source dataset through the declared public
  Service.
stages.1.brief: Activate the source-bound backup on that same public Service while keeping the producer healthy.
stages.1.objectives.0.text: The original backup uses the source route and identity, owns the public path, and leaves
  the restored producer intact.
hints.0.text: Readiness, published data and Service routing are different contracts. A healthy process alone does
  not establish which dataset or controller the public path uses.
hints.1.text: |-
  Compare `cat progressive-contract.json`, `kubectl get deployments,configmaps,services,endpointslices -o yaml` and Pod events. Inspect projected sources, environment references, controller ownership and the actual HTTP records at the current stage.

  Look at how the producer references its source and how the public Service selects its backend. In the second stage, compare the backup’s source references and record with the producer’s before inspecting the retained Service’s selector and EndpointSlices.
hints.2.text: |-
  Verify `kubectl rollout status deployment/<name>`, container environment, both declared HTTP paths and ready endpoint Pod owners against the supplied contract. Expect the original route/publication identity and unchanged retained object UIDs.
debrief: The source bundle now reaches a real producer and a source-bound backup. Public routing moved between controlled
  ready Pods while retaining the dataset, workloads and established Service.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked the workload state and its readiness after the change.
diagnostics.progressive_producer: The original producer is not rolled out or cannot serve its retained publication interface; the initial readiness port differs from the listener, its projected HTTP source may be wrong, or API/exec observation failed. [Cause and check](guides#guide=kubernetes-4&section=progressive-producer-readiness)
diagnostics.progressive_route: The backup ROUTE is not north or cannot be read; the initial literal retired may remain, a ConfigMap reference may be shadowed, old Pods may retain an earlier environment, or exec failed. [Cause and check](guides#guide=kubernetes-12&section=progressive-consumer-route)
diagnostics.progressive_identity: An original publication object UID changed; deleting and recreating a workload, source ConfigMap or established Service can retain its name while replacing the identity that the setup preserved. [Cause and check](guides#guide=kubernetes-4&section=progressive-retained-identities)
diagnostics.progressive_source: The original source entries differ or the ConfigMap cannot be observed; editing the route/publication record, generating a new producer identity or querying the wrong data can break the preserved dataset. [Cause and check](guides#guide=kubernetes-12&section=progressive-source-data)
diagnostics.progressive_projection: The producer does not mount a volume backed by the original source ConfigMap; the initial temporary HTTP directory may still be used, or the worker mount and volume reference do not connect. [Cause and check](guides#guide=kubernetes-12&section=progressive-source-projection)
diagnostics.progressive_consumer: The backup does not consume and publish the original source consistently; a literal or later environment override, missing projection, stale Pods, mismatched runtime record or failed API/exec observation may explain it. [Cause and check](guides#guide=kubernetes-12&section=progressive-consumer-source)
diagnostics.progressive_service: The public Service may be missing, or it does not select ready Pods of the active original Deployment or cannot be observed; the selector may still target the producer during failover, endpoints may be empty or unrelated, or the port/type contract is wrong. [Cause and check](guides#guide=kubernetes-10&section=progressive-service-targets)
diagnostics.progressive_publication: The public HTTP publication differs from the original record or cannot be read; the Service may reach the wrong workload, the worker may serve another directory or stale data, or HTTP/JSON observation failed. [Cause and check](guides#guide=kubernetes-10&section=progressive-public-record)
diagnostics.probe_0_0: The producer probe stopped without a detailed marker; protected setup evidence, workload structure, Python startup or an interrupted API observation may prevent the source/publication checks from completing. [Cause and check](guides#guide=kubernetes-4&section=progressive-observer-inputs)
diagnostics.probe_1_0: The failover probe stopped without a detailed marker; original or phase-specific identity evidence, workload structure, Python startup or an interrupted observation may prevent checking the backup and retained producer. [Cause and check](guides#guide=kubernetes-4&section=progressive-observer-inputs)
