title: Fortschreitender Vorfall
brief: 'Sie sind dem Betrieb SignalRail beigetreten. Reparieren Sie readiness vor einem zweiten Konfigurationsvorfall.
  Arbeiten Sie in ~/quest.. Bewahren Sie alle Änderungen in diesem Trainingsbereich auf.


  Questdateien in `~/quest` (einige werden in späteren Phasen eingeführt): `deployment.json`, `backup.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur die bereitgestellten Dateien,
  vorinstallierten Bilder und privaten Dienste. Alle Änderungen müssen innerhalb dieser Bucht bleiben.


  Erste Erfolgskriterien: Der erste worker ist fertig.'
stages.0.brief: 'Ein probe-Vorfall blockierte den ersten worker. Reparatur readiness.


  Erfolgskriterium: Der erste worker ist fertig.'
stages.0.objectives.0.text: Der erste worker ist fertig.
stages.1.brief: 'Neuer Vorfall: Der backup reader erhielt einen retired route. Stellen Sie ROUTE=north.
  wieder her


  Erfolgskriterium: Auf dem backup reader läuft der north route.'
stages.1.objectives.0.text: Das Backup reader führt den north route aus.
hints.0.text: Der erste worker scheiterte an seinem HTTP readiness probe.
hints.1.text: Vergleichen Sie den probe-Port mit dem HTTP listener; Schauen Sie sich nach der Genesung
  den Teamkanal an.
hints.2.text: 'Der zweite Vorfall verwendet eine andere Bereitstellung: Überprüfen Sie die ROUTE-Variable
  backup reader.'
debrief: Der erste Fehler war ein probe-Port. Nach der Wiederherstellung trat ein neuer Konfigurationsvorfall
  backup-reader auf. Sie haben beide Phasen repariert und überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe den workload-Status und seine Bereitschaft nach der Änderung überprüft.
