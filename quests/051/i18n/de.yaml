title: Fortschreitender Vorfall
brief: |
  Zwei aufeinanderfolgende Vorfälle unterbrechen die Routenverarbeitung. Schließen Sie die erste Wiederherstellung ab, bevor Sie den zweiten Vorfall bearbeiten.

  Arbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte Eingabedateien: `deployment.yaml`.

  Stufe 2 stellt `backup.yaml` in `~/quest` auf der Workstation bereit.

  **Anforderungen:**
  - Stufe 1: Deployment `relay` schließt seinen Rollout ab.
  - Stufe 2: Im Container `worker` von Deployment `backup` stellt der laufende Prozess Folgendes bereit:
    - `ROUTE`: `north`

  **Vor Check & finish selbst prüfen:**
  Führen Sie diese Beobachtungsbefehle in `~/quest` auf der Workstation aus.
  - `kubectl rollout status deployment/relay --timeout=3s` — Stufe 1: Der Rollout ist abgeschlossen.
  - `kubectl exec deployment/backup -c worker -- printenv ROUTE` — Stufe 2, sobald sie verfügbar ist: Der laufende Ersatzprozess gibt `north` aus.
stages.0.brief: |
  Deployment `relay` muss vor dem nächsten Vorfall seinen Rollout abschließen.
stages.0.objectives.0.text: Deployment `relay` schließt seinen Rollout ab.
stages.1.brief: |
  Der laufende Ersatz-Workload muss die geforderte Route bereitstellen.
stages.1.objectives.0.text: Deployment `backup` stellt `ROUTE` mit dem Wert `north` bereit.
hints.0.text: Der erste worker scheiterte an seinem HTTP readiness probe.
hints.1.text: Vergleichen Sie den probe-Port mit dem HTTP listener; Schauen Sie sich nach der Genesung
  den Teamkanal an.
hints.2.text: |
  Der zweite Vorfall betrifft ein anderes Deployment: Prüfen Sie die ROUTE-Variable des Ersatz-reader. Er erhielt die Route retired; stellen Sie ROUTE=north wieder her.
debrief: Der erste Fehler war ein probe-Port. Nach der Wiederherstellung trat ein neuer Konfigurationsvorfall
  backup-reader auf. Sie haben beide Phasen repariert und überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe den workload-Status und seine Bereitschaft nach der Änderung überprüft.
