title: Fortschreitender Vorfall
brief: |-
  Die Wiederherstellung von Veröffentlichung und Failover ist unvollständig. Stelle den öffentlichen Pfad aus dem bereitgestellten Datensatz wieder her und übergib ihn an das Backup, während der Producer erhalten bleibt.

  Arbeite auf der Workstation in `~/quest` mit `progressive-contract.json`; untersuche aktuelle Workloads, Quelldaten und Routingobjekte im Kubernetes-Namespace.

  **Anforderungen:**
  - Erhalte Identität des ursprünglichen Producer-Deployments sowie Identität und Daten der Quell-ConfigMap. Der Producer projiziert diese Quelle und veröffentlicht den bereitgestellten Datensatz über selectorbasierten ClusterIP Service und HTTP-Schnittstelle des Vertrags.
  - Der Service leitet an bereite Pods unter Kontrolle des aktiven ursprünglichen Deployments.
  - Erhalte beim Failover die Service-Identität und das ursprüngliche Backup-Deployment. Das Backup bezieht `ROUTE` und `PRODUCER_ID` über Container-Umgebungsreferenzen aus derselben ConfigMap und nutzt deren Datenprojektion.
  - Der öffentliche Consumer-Datensatz entspricht ursprünglicher Route und Veröffentlichungsidentität. Der öffentliche Service leitet nun an bereite Backup-Pods.
  - Halte den wiederhergestellten Producer an seiner etablierten HTTP-Schnittstelle gesund und seine ursprüngliche Veröffentlichung intakt.

  Prüfungen beobachten aktuelle Controller-/Objektidentitäten, Datenreferenzen, bereite Endpoints, Container-Umgebung und HTTP-Datensätze; sie beweisen weder lückenlose Verfügbarkeit noch Befehlsverlauf.
stages.0.brief: Stelle die ursprüngliche Veröffentlichung hinter einem stabilen öffentlichen Service wieder her.
stages.0.objectives.0.text: Der ursprüngliche Producer veröffentlicht den intakten Datensatz über den deklarierten
  öffentlichen Service.
stages.1.brief: Aktiviere das quellengebundene Backup an demselben Service und erhalte den Producer.
stages.1.objectives.0.text: Das ursprüngliche Backup nutzt Route und Identität der Quelle, übernimmt den öffentlichen
  Pfad und erhält den Producer.
hints.0.text: Readiness, veröffentlichte Daten und Service-Routing sind getrennte Verträge. Ein gesunder Prozess
  beweist nicht, welcher Datensatz oder Controller den öffentlichen Pfad bedient.
hints.1.text: |-
  Vergleiche `cat progressive-contract.json`, `kubectl get deployments,configmaps,services,endpointslices -o yaml` und Pod-Ereignisse. Untersuche Projektionen, Umgebungsreferenzen, Controller-Eigentümerschaft und tatsächliche HTTP-Datensätze der aktuellen Stufe.

  Prüfe, wie der Producer auf die Quelle verweist und wie der öffentliche Service sein Backend auswählt. Vergleiche in der zweiten Phase die Quellverweise und den Datensatz des Backups mit dem Producer. Sieh dir dann den Selektor und die EndpointSlices des beibehaltenen Service an.
hints.2.text: |-
  Vergleiche `kubectl rollout status deployment/<name>`, Container-Umgebung, beide HTTP-Pfade und Eigentümer der bereiten Endpoint-Pods mit dem Vertrag. Erwartet werden ursprüngliche Route/Identität und unveränderte erhaltene Objekt-UIDs.
debrief: Der Quelldatensatz erreicht einen echten Producer und ein quellengebundenes Backup. Öffentliches Routing
  wechselte zwischen kontrollierten bereiten Pods; Daten, Workloads und etablierter Service blieben erhalten.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe den workload-Status und seine Bereitschaft nach der Änderung überprüft.
diagnostics.progressive_producer: Der ursprüngliche Produzent ist nicht ausgerollt oder bedient seine erhaltene Schnittstelle nicht; der anfängliche Readiness-Port weicht vom Listener ab, die HTTP-Quelle ist falsch eingebunden oder API-/exec-Beobachtung schlug fehl. [Ursache und Prüfung](guides#guide=kubernetes-4&section=progressive-producer-readiness)
diagnostics.progressive_route: ROUTE der Ersatzanwendung ist nicht north oder ist unlesbar; möglicherweise bleibt der anfängliche Literalwert retired, eine ConfigMap-Referenz wird überlagert, alte Pods behalten ihre Umgebung oder exec schlug fehl. [Ursache und Prüfung](guides#guide=kubernetes-12&section=progressive-consumer-route)
diagnostics.progressive_identity: Die UID eines ursprünglichen Publikationsobjekts hat sich geändert; Löschen und Neuerstellen von Anwendung, Quell-ConfigMap oder bestehendem Service kann den Namen bewahren, ersetzt jedoch die im Setup festgehaltene Identität. [Ursache und Prüfung](guides#guide=kubernetes-4&section=progressive-retained-identities)
diagnostics.progressive_source: Die ursprünglichen Einträge weichen ab oder die ConfigMap ist nicht beobachtbar; geänderte Route oder Publikation, eine neue Produzentenidentität oder andere gelesene Daten können den erhaltenen Datensatz verletzen. [Ursache und Prüfung](guides#guide=kubernetes-12&section=progressive-source-data)
diagnostics.progressive_projection: Der Produzent mountet kein Volume aus der ursprünglichen Quell-ConfigMap; möglicherweise wird noch das anfängliche temporäre HTTP-Verzeichnis verwendet oder worker-Mount und Volume-Referenz passen nicht zusammen. [Ursache und Prüfung](guides#guide=kubernetes-12&section=progressive-source-projection)
diagnostics.progressive_consumer: Die Ersatzanwendung konsumiert und veröffentlicht die ursprüngliche Quelle nicht konsistent; Literalwert oder spätere Umgebungsüberlagerung, fehlende Einbindung, alte Pods, falscher Laufzeitdatensatz oder API-/exec-Fehler können die Ursache sein. [Ursache und Prüfung](guides#guide=kubernetes-12&section=progressive-consumer-source)
diagnostics.progressive_service: Der öffentliche Service fehlt möglicherweise oder wählt keine bereiten Pods des aktiven ursprünglichen Deployments oder ist nicht beobachtbar; der Selektor zeigt nach dem Failover möglicherweise noch zum Produzenten, Endpoints sind leer oder fremd oder Port beziehungsweise Typ sind falsch. [Ursache und Prüfung](guides#guide=kubernetes-10&section=progressive-service-targets)
diagnostics.progressive_publication: Die öffentliche HTTP-Publikation weicht vom ursprünglichen Datensatz ab oder ist unlesbar; der Service erreicht möglicherweise eine andere Anwendung, worker liefert ein anderes Verzeichnis oder veraltete Daten oder HTTP-/JSON-Beobachtung schlug fehl. [Ursache und Prüfung](guides#guide=kubernetes-10&section=progressive-public-record)
diagnostics.probe_0_0: Die Produzentenprüfung endete ohne Detailmarker; geschützte Setup-Belege, Workload-Struktur, Python-Start oder eine unterbrochene API-Beobachtung können den Abschluss der Quell-/Publikationsprüfung verhindern. [Ursache und Prüfung](guides#guide=kubernetes-4&section=progressive-observer-inputs)
diagnostics.probe_1_0: Die Failover-Prüfung endete ohne Detailmarker; ursprüngliche oder phasenbezogene Identitätsbelege, Workload-Struktur, Python-Start oder eine unterbrochene Beobachtung können die Prüfung von Ersatz und erhaltenem Produzenten verhindern. [Ursache und Prüfung](guides#guide=kubernetes-4&section=progressive-observer-inputs)
