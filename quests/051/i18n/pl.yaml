title: Postępujący incydent
brief: |-
  Dwa kolejne incydenty przerywają przetwarzanie tras. Zakończ pierwsze przywracanie działania przed obsługą drugiego incydentu.

  Pracuj na workstation w `~/quest` z dostarczonymi plikami:
  - `deployment.yaml`, `backup.yaml`.

  `backup.yaml` pojawia się w etapie 2.

  **Wymagania:**

  - Etap 1: Deployment `relay` kończy rollout.
  - Etap 2: wewnątrz kontenera `worker` Deployment `backup` działający proces udostępnia:
    - `ROUTE`: `north`

  Sprawdzenia etapów potwierdzają wyniki w danym momencie, a nie ciągłą dostępność między incydentami.
stages.0.brief: |
  Deployment `relay` ma zakończyć rollout przed kolejnym incydentem.
stages.0.objectives.0.text: Deployment `relay` kończy rollout.
stages.1.brief: |
  Działające obciążenie zapasowe ma udostępniać wymaganą trasę.
stages.1.objectives.0.text: Deployment `backup` udostępnia `ROUTE` o wartości `north`.
hints.0.text: Incydent może mieć kolejne etapy odzyskiwania z różnymi obserwowalnymi wynikami.
hints.1.text: |-
  Pierwszy worker zawiódł HTTP readiness probe. Porównaj port probe z HTTP listener; obejrzyj kanał zespołu po powrocie do zdrowia.

  Sprawdź dostarczone dane i bieżące obserwacje:

  ```sh
  # Stage 1
  kubectl describe deployment relay
  # Stage 2, after it appears
  kubectl describe deployment backup
  ```
hints.2.text: |-
  Drugi incydent dotyczy innego deployment: sprawdź zmienną ROUTE zapasowego reader. Otrzymał trasę retired; przywróć ROUTE=north.

  Sprawdź wynik z `~/quest` na workstation:

  Wykonaj te polecenia obserwacyjne w `~/quest` na workstation.
  - `kubectl rollout status deployment/relay --timeout=3s` — Etap 1: rollout jest zakończony.
  - `kubectl exec deployment/backup -c worker -- printenv ROUTE` — Etap 2, po jego udostępnieniu: działający proces zapasowy wypisuje `north`.
debrief: Pierwszą awarią był port probe. Po przywróceniu pojawił się nowy incydent związany z konfiguracją
  backup-reader. Naprawiłeś i zweryfikowałeś oba etapy.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
