title: Postępujący incydent
brief: 'Dołączyłeś do operacji SignalRail. Napraw readiness przed drugim zdarzeniem konfiguracyjnym. Pracuj
  w ~/quest.. Wszystkie zmiany przechowuj w tej komorze szkoleniowej.


  Pliki zadań w `~/quest` (niektóre zostały wprowadzone w późniejszych etapach): `deployment.json`, `backup.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Wszystkie zmiany muszą pozostać w tej zatoce.'
stages.0.brief: Incydent probe zablokował pierwszy worker. Napraw readiness.
stages.0.objectives.0.text: Deployment `relay` kończy rollout.
stages.1.brief: 'Nowy incydent: backup reader przeszedł na emeryturę. Przywróć ROUTE=north.'
stages.1.objectives.0.text: 'Deployment `backup`: `ROUTE` = `north`.'
hints.0.text: Pierwszy worker zawiódł HTTP readiness probe.
hints.1.text: Porównaj port probe z HTTP listener; obejrzyj kanał zespołu po powrocie do zdrowia.
hints.2.text: 'Drugi incydent wykorzystuje inne wdrożenie: sprawdź zmienną backup reader ROUTE.'
debrief: Pierwszą awarią był port probe. Po przywróceniu pojawił się nowy incydent związany z konfiguracją
  backup-reader. Naprawiłeś i zweryfikowałeś oba etapy.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
