title: Postępujący incydent
brief: |-
  Odzyskiwanie publikacji i failover jest niepełne. Przywróć publiczną ścieżkę z dostarczonego zbioru danych, następnie przekaż ją do backupu, zachowując działającego producera.

  Pracuj w `~/quest` na stacji roboczej z `progressive-contract.json`; sprawdź bieżące workloady, dane źródłowe i routing w namespace Kubernetes.

  **Wymagania:**
  - Zachowaj tożsamość pierwotnego Deploymentu producera oraz tożsamość/dane źródłowego ConfigMap. Producer projektuje to źródło i publikuje dostarczony rekord przez ClusterIP Service z selektorem i interfejs HTTP opisany w kontrakcie.
  - Service kieruje do gotowych Podów kontrolowanych przez aktywny pierwotny Deployment.
  - Podczas failover zachowaj tożsamość Service i pierwotnego Deploymentu backupu. Backup pobiera `ROUTE` i `PRODUCER_ID` z tego samego ConfigMap przez referencje środowiska kontenera i korzysta z projekcji jego danych.
  - Publiczny rekord consumera odpowiada pierwotnej trasie i tożsamości publikacji. Publiczny Service kieruje teraz do gotowych Podów backupu.
  - Zachowaj zdrowego odzyskanego producera na jego ustalonym interfejsie HTTP i jego pierwotną publikację.

  Testy obserwują bieżące tożsamości kontrolerów/obiektów, referencje danych, gotowe endpointy, środowisko kontenera i rekordy HTTP; nie dowodzą ciągłej dostępności ani historii poleceń.
stages.0.brief: Przywróć pierwotną publikację za stabilnym publicznym Service.
stages.0.objectives.0.text: Pierwotny producer publikuje nienaruszone dane przez zadeklarowany publiczny Service.
stages.1.brief: Aktywuj backup powiązany ze źródłem na tym samym Service, zachowując zdrowego producera.
stages.1.objectives.0.text: Pierwotny backup używa trasy i tożsamości źródła, przejmuje publiczną ścieżkę i zachowuje
  odzyskanego producera.
hints.0.text: Readiness, publikowane dane i routing Service to odrębne kontrakty. Zdrowy proces nie dowodzi, które
  dane lub kontroler obsługują publiczną ścieżkę.
hints.1.text: Porównaj `cat progressive-contract.json`, `kubectl get deployments,configmaps,services,endpointslices
  -o yaml` i zdarzenia Podów. Sprawdź projekcje źródeł, referencje środowiska, właścicieli-kontrolerów i rzeczywiste
  rekordy HTTP bieżącego etapu.
hints.2.text: Zbuduj korzystanie ze źródła i publiczny Service; sprawdź rollout i publikację producera. Następnie
  przygotuj referencje i rekord runtime backupu przed przełączeniem zachowanego Service. Porównaj `kubectl rollout
  status deployment/<name>`, środowisko kontenera, obie ścieżki HTTP i właścicieli gotowych Podów endpointów z kontraktem.
  Oczekuj pierwotnej trasy/tożsamości i niezmienionych zachowanych UID.
debrief: Dane źródłowe docierają do rzeczywistego producera i backupu powiązanego ze źródłem. Publiczny routing
  przeniesiono między kontrolowanymi gotowymi Podami, zachowując dane, workloady i ustalony Service.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
diagnostics.progressive_producer: Pierwotny producent nie zakończył rollout lub nie obsługuje zachowanego interfejsu; początkowy port readiness różni się od nasłuchu, źródło HTTP jest źle zamontowane albo obserwacja API/exec zawiodła. [Przyczyna i kontrola](guides#guide=kubernetes-4&section=progressive-producer-readiness)
diagnostics.progressive_route: ROUTE zapasowej aplikacji nie wynosi north lub jest nieczytelny; mógł pozostać początkowy literał retired, referencja ConfigMap jest przesłonięta, stare Pody zachowały środowisko albo exec zawiódł. [Przyczyna i kontrola](guides#guide=kubernetes-12&section=progressive-consumer-route)
diagnostics.progressive_identity: Zmienił się UID pierwotnego obiektu publikacji; usunięcie i odtworzenie aplikacji, źródłowego ConfigMap lub ustalonego Service może zachować nazwę, ale zastępuje tożsamość zapisaną przez setup. [Przyczyna i kontrola](guides#guide=kubernetes-4&section=progressive-retained-identities)
diagnostics.progressive_source: Pierwotne wpisy różnią się lub ConfigMap jest nieczytelny; edycja trasy lub publikacji, nowa tożsamość producenta albo odczyt innych danych może naruszyć zachowany zestaw. [Przyczyna i kontrola](guides#guide=kubernetes-12&section=progressive-source-data)
diagnostics.progressive_projection: Producent nie montuje wolumenu pierwotnego ConfigMap; nadal może używać początkowego tymczasowego katalogu HTTP albo montowanie worker i referencja wolumenu nie łączą się. [Przyczyna i kontrola](guides#guide=kubernetes-12&section=progressive-source-projection)
diagnostics.progressive_consumer: Zapasowa aplikacja nie pobiera i nie publikuje spójnie pierwotnych danych; przyczyną może być literał lub późniejsze nadpisanie środowiska, brak montowania, stare Pody, błędny rekord albo błąd API/exec. [Przyczyna i kontrola](guides#guide=kubernetes-12&section=progressive-consumer-source)
diagnostics.progressive_service: Publiczny Service może nie istnieć albo nie wybiera gotowych Podów aktywnego pierwotnego Deployment lub jest nieczytelny; selector może nadal wskazywać producenta po przełączeniu, endpointy są puste lub obce albo port i typ są błędne. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=progressive-service-targets)
diagnostics.progressive_publication: Publiczna publikacja HTTP różni się od pierwotnego rekordu lub jest nieczytelna; Service może prowadzić do innej aplikacji, worker podawać inny katalog lub stare dane albo obserwacja HTTP/JSON zawiodła. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=progressive-public-record)
diagnostics.probe_0_0: Kontrola producenta zatrzymała się bez szczegółowego markera; chronione dane setup, struktura aplikacji, start Pythona lub przerwana obserwacja API mogą uniemożliwić kontrolę źródła i publikacji. [Przyczyna i kontrola](guides#guide=kubernetes-4&section=progressive-observer-inputs)
diagnostics.probe_1_0: Kontrola przełączenia zatrzymała się bez szczegółowego markera; pierwotne lub fazowe dane tożsamości, struktura aplikacji, start Pythona lub przerwana obserwacja mogą uniemożliwić sprawdzenie zapasu i zachowanego producenta. [Przyczyna i kontrola](guides#guide=kubernetes-4&section=progressive-observer-inputs)
