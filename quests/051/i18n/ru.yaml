title: Развивающийся инцидент
brief: |-
  Восстановление публикации и failover не завершено. Верните публичный путь к предоставленному набору данных, затем передайте его backup, сохранив работающий producer.

  Работайте в `~/quest` на рабочей станции с `progressive-contract.json`; изучите текущие workloads, исходные данные и маршрутизацию в namespace Kubernetes.

  **Требования:**
  - Сохраните исходный UID Deployment producer и UID/данные исходного ConfigMap. Producer проецирует этот источник и публикует предоставленную запись через selector-based ClusterIP Service и HTTP-интерфейс из контракта.
  - Service направляет трафик в готовые Pod под управлением активного исходного Deployment.
  - При failover сохраните UID этого Service и исходного Deployment backup. Backup получает `ROUTE` и `PRODUCER_ID` из того же ConfigMap через ссылки переменных окружения контейнера и использует его проекцию данных.
  - Публичная запись consumer совпадает с исходными маршрутом и идентичностью публикации. Публичный Service теперь направляет трафик в готовые Pod backup.
  - Сохраните работоспособность восстановленного producer на его установленном HTTP-интерфейсе и его исходную публикацию.

  Проверки наблюдают текущие идентичности контроллеров и объектов, ссылки данных, готовые endpoints, окружение контейнера и HTTP-записи; непрерывную доступность и историю команд они не доказывают.
stages.0.brief: Восстановите исходную публикацию через стабильный публичный Service.
stages.0.objectives.0.text: Исходный producer публикует неизменный набор данных через объявленный публичный Service.
stages.1.brief: Активируйте backup с исходными данными на том же Service, сохранив producer.
stages.1.objectives.0.text: Исходный backup использует маршрут и идентичность источника, обслуживает публичный путь
  и сохраняет восстановленный producer.
hints.0.text: Readiness, опубликованные данные и маршрутизация Service — разные контракты. Здоровый процесс ещё
  не показывает, какие данные и контроллер обслуживают публичный путь.
hints.1.text: |-
  Сопоставьте `cat progressive-contract.json`, `kubectl get deployments,configmaps,services,endpointslices -o yaml` и события Pod. Изучите проекции источников, ссылки окружения, владельцев-контроллеров и фактические HTTP-записи текущего этапа.

  Посмотрите, как производитель ссылается на источник и как публичный Service выбирает бэкенд. На втором этапе сравните ссылки и запись резервного приложения с данными производителя, затем изучите селектор и EndpointSlice сохранённого Service.
hints.2.text: |-
  Сверьте `kubectl rollout status deployment/<name>`, окружение контейнера, оба HTTP-пути и владельцев готовых endpoint Pod с контрактом. Ожидаются исходные маршрут и идентичность публикации, а также неизменные UID сохраняемых объектов.
debrief: Исходный набор данных доходит до настоящего producer и связанного с источником backup. Публичный маршрут
  перенесён между управляемыми готовыми Pod с сохранением данных, workloads и установленного Service.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: После изменения я проверил состояние workload и его готовность.
diagnostics.progressive_producer: 'Исходный производитель не завершил rollout либо не обслуживает сохранённый интерфейс: начальный порт readiness отличается от порта сервера, источник HTTP смонтирован неверно или наблюдение API/exec завершилось ошибкой. [Причина и проверка](guides#guide=kubernetes-4&section=progressive-producer-readiness)'
diagnostics.progressive_route: 'ROUTE резервной нагрузки не равен north либо недоступен: мог остаться начальный литерал retired, ссылка ConfigMap перекрыта, старые Pod сохранили прежнее окружение или exec завершился ошибкой. [Причина и проверка](guides#guide=kubernetes-12&section=progressive-consumer-route)'
diagnostics.progressive_identity: 'Изменился UID исходного объекта публикации: удаление и пересоздание нагрузки, исходного ConfigMap или установленного Service сохраняет имя, но заменяет идентичность, зафиксированную setup. [Причина и проверка](guides#guide=kubernetes-4&section=progressive-retained-identities)'
diagnostics.progressive_source: 'Исходные записи отличаются либо ConfigMap недоступен: правка маршрута или записи публикации, создание новой идентичности производителя либо чтение других данных нарушают сохранённый набор. [Причина и проверка](guides#guide=kubernetes-12&section=progressive-source-data)'
diagnostics.progressive_projection: 'Производитель не монтирует том исходного ConfigMap: мог остаться начальный временный каталог HTTP либо монтирование worker не связано с нужным томом. [Причина и проверка](guides#guide=kubernetes-12&section=progressive-source-projection)'
diagnostics.progressive_consumer: 'Резервная нагрузка не потребляет и не публикует исходные данные согласованно: причиной могут быть литерал или перекрывающее окружение, отсутствие монтирования, старые Pod, неверная запись или сбой API/exec. [Причина и проверка](guides#guide=kubernetes-12&section=progressive-consumer-source)'
diagnostics.progressive_service: 'Публичный Service может отсутствовать либо не выбирает готовые Pod активного исходного Deployment либо недоступен: selector мог остаться на производителе после переключения, endpoints пусты или посторонние либо неверны порт и тип. [Причина и проверка](guides#guide=kubernetes-10&section=progressive-service-targets)'
diagnostics.progressive_publication: 'Публичная HTTP-публикация отличается от исходной записи либо недоступна: Service может вести к другой нагрузке, worker выдаёт другой каталог или старые данные либо наблюдение HTTP/JSON завершилось ошибкой. [Причина и проверка](guides#guide=kubernetes-10&section=progressive-public-record)'
diagnostics.probe_0_0: 'Проверка производителя остановилась без подробного маркера: защищённые данные setup, структура нагрузки, запуск Python или прерванное наблюдение API могли помешать завершить проверку источника и публикации. [Причина и проверка](guides#guide=kubernetes-4&section=progressive-observer-inputs)'
diagnostics.probe_1_0: 'Проверка переключения остановилась без подробного маркера: исходные или фазовые свидетельства идентичности, структура нагрузки, запуск Python или прерванное наблюдение могли помешать проверить резерв и сохранённого производителя. [Причина и проверка](guides#guide=kubernetes-4&section=progressive-observer-inputs)'
