title: Развивающийся инцидент
brief: 'Вы в команде эксплуатации SignalRail. После readiness произошёл второй инцидент. Работайте в ~/quest.
  Все изменения — только в этой песочнице.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `deployment.json`, `backup.json`.


  В песочнице нет интернета и внешнего DNS. Используйте только выданные файлы, предварительно загруженные
  образы и приватные сервисы. Все изменения — только в этой песочнице.


  Цели первого этапа: Первый worker готов.'
stages.0.brief: 'Первый worker заблокирован probe. Исправьте readiness.


  Результат проверки: Первый worker готов.'
stages.0.objectives.0.text: Первый worker готов.
stages.1.brief: 'Новый инцидент: backup reader получил старый маршрут. Верните ROUTE=north.


  Результат проверки: Backup reader работает с north.'
stages.1.objectives.0.text: Backup reader работает с north.
hints.0.text: Первый worker не прошёл HTTP readiness probe.
hints.1.text: Сравните порт probe с listener; после восстановления следите за каналом команды.
hints.2.text: 'Второй инцидент — в другом Deployment: проверьте ROUTE у backup reader.'
debrief: Сначала был неверный порт probe. После восстановления возник инцидент конфигурации backup-reader.
  Вы исправили и проверили оба этапа.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: После изменения я проверил состояние workload и его готовность.
