title: Развивающийся инцидент
brief: |-
  Два последовательных инцидента прерывают обработку маршрутов. Завершите первое восстановление, прежде чем переходить ко второму инциденту.

  Работайте на workstation в `~/quest` с предоставленными файлами:
  - `deployment.yaml`, `backup.yaml`.

  `backup.yaml` появляется на этапе 2.

  **Требования:**

  - Этап 1: Deployment `relay` завершает rollout.
  - Этап 2: внутри контейнера `worker` Deployment `backup` работающий процесс предоставляет:
    - `ROUTE`: `north`

  Проверки этапов подтверждают результаты в отдельные моменты, а не непрерывную доступность между инцидентами.
stages.0.brief: |
  Deployment `relay` должен завершить rollout до следующего инцидента.
stages.0.objectives.0.text: Deployment `relay` завершает rollout.
stages.1.brief: |
  Работающая резервная нагрузка должна предоставлять требуемый маршрут.
stages.1.objectives.0.text: В Deployment `backup` переменная `ROUTE` имеет значение `north`.
hints.0.text: У инцидента могут быть последовательные этапы восстановления с разными наблюдаемыми результатами.
hints.1.text: |-
  Первый worker не прошёл HTTP readiness probe. Сравните порт probe с listener; после восстановления следите за каналом команды.

  Изучите предоставленные файлы и живые наблюдения:

  ```sh
  # Stage 1
  kubectl describe deployment relay
  # Stage 2, after it appears
  kubectl describe deployment backup
  ```
hints.2.text: |-
  Второй инцидент использует другой deployment: проверьте переменную ROUTE резервного reader. Он получил маршрут retired; восстановите ROUTE=north.

  Проверьте результат из `~/quest` на workstation:

  Выполняйте эти команды наблюдения из `~/quest` на workstation.
  - `kubectl rollout status deployment/relay --timeout=3s` — Этап 1: rollout завершён.
  - `kubectl exec deployment/backup -c worker -- printenv ROUTE` — Этап 2, после его открытия: работающий резервный процесс выводит `north`.
debrief: Сначала был неверный порт probe. После восстановления возник инцидент конфигурации backup-reader.
  Вы исправили и проверили оба этапа.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: После изменения я проверил состояние workload и его готовность.
