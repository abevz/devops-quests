title: Zdrowie Argo
brief: 'Prywatny Application może synchronizować, ale zatwierdzony readiness probe celuje w 9090, podczas
  gdy HTTP nasłuchuje w 8080. Popraw repository/manifests/board.json, zatwierdź i wypchnij do jednorazowej
  gałęzi Gitea main, a następnie odśwież Argo. Zachowaj historię baseline-commit. Sam Synced jest niewystarczający:
  zarejestrowany prąd revision musi stać się Healthy i faktycznie służyć north-68. Kontroler aplikacji
  może krótko zgłosić Progressing w oczekiwaniu na nieprawidłowe wdrożenie.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `platform.env`, `application.json`,
  `repository/manifests/board.json`, `repository/manifests/service.json`, `baseline-commit`, `release-commit`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: poprawiony Git commit jest synchronizowany i Healthy, readiness używa 8080,
  a prawdziwy endpoint zwraca north-68.


  Wiarygodne dowody konfiguracji są przeznaczone tylko do odczytu w ramach `/run/dq/facts/0/`; pasujące
  pliki w `~/quest` są kopiami roboczymi.'
debrief: Zamiar Git i stan workload są teraz zgodne; bezpośredni live patch zostałby przywrócony przez
  self-heal.
stages.0.brief: 'Kryteria sukcesu: Poprawiony Git commit jest synchronizowany i Healthy, readiness używa
