hints.0.text: Sync porównuje pożądane zasoby; health opisuje ich zaobserwowany stan.
hints.1.text: Przeczytaj probe w Git i porównaj je z uruchomionym poleceniem.
hints.2.text: Zatwierdź korektę portu w Git, odśwież i zweryfikuj revision, readiness i HTTP.
phrases.0: Oddzieliłem synchronizację od kondycji aplikacji.
phrases.1: Naprawiłem źródło commit zamiast walczyć z self-heal.
phrases.2: Sprawdziłem zaobserwowaną odpowiedź revision i rzeczywistą odpowiedź HTTP.
questions.0.points.0: Pożądany manifests może wiernie opisać uszkodzony probe.
questions.0.points.1: Health zależy od zaobserwowanego stanu workload.
questions.0.points.2: Przetestuj readiness i rzeczywisty ruch serwisowy.
questions.0.prompt: Czy Application może być Synced i nadal niedostępny?
questions.1.points.0: Zmień wiarygodne źródło Git.
questions.1.points.1: Po uzgodnieniu sprawdź nową zaobserwowaną wartość revision.
questions.1.points.2: Unikaj polegania na przejściowym live patch.
questions.1.prompt: Na czym polega trwała naprawa, gdy włączona jest funkcja automatycznego self-heal?
