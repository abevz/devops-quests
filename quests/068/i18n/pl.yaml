title: Zdrowie Argo
brief: 'Zarządzane przez Git wydanie `board` nie jest zdrowe dla swoich odbiorców.


  Pracuj na stacji roboczej w `~/quest` z `platform.env`, `application.yaml`, `repository/manifests/board.yaml`.


  **Wymagania:**

  - Application `board` wdraża dostarczone wydanie z prywatnego repozytorium Git.

  - Application `board` zgłasza `Synced` i `Healthy` dla opublikowanego wydania, automatycznie przywraca stan
  zadany w Git i usuwa zasoby usunięte z Git.

  - Deployment `board` kończy rollout w przestrzeni nazw zatoki.

  - Wewnątrz Poda Deployment `board` adres `http://board:8080` zwraca `north-68`.

  - Zdalny `origin/main` i zapis publikacji na stacji roboczej wskazują tego samego nowego potomka pierwotnego
  wydania.

  - Opublikowane wydanie Git i działający Deployment `board` spełniają wymagany kontrakt zdrowia odbiorcy.


  Dane setup pod `/run/dq/facts/0/` na workstation są autorytatywne; odpowiadające im pliki w `~/quest` to
  kopie robocze.

  '
debrief: Zamiar Git i stan workload są teraz zgodne; bezpośredni live patch zostałby przywrócony przez self-heal.
stages.0.brief: Opublikowana rewizja Git musi być zdrowa dla swoich odbiorców.
hints.0.text: Sync porównuje pożądane zasoby; health opisuje ich zaobserwowany stan.
hints.1.text: 'Zacommitowana sonda gotowości wskazuje 9090, a HTTP nasłuchuje na 8080. Podczas nieudanego rollout
  application-controller może krótko zgłaszać Progressing.


  Sprawdź dostarczone dane wejściowe i obserwowany stan:


  ```sh

  cat application.yaml repository/manifests/board.yaml

  kubectl describe application board

  kubectl describe pod -l app=board

  ```'
hints.2.text: |-
  Popraw repository/manifests/board.yaml, wykonaj commit i push do prywatnej gałęzi main, a następnie odśwież Argo. Zachowaj historię baseline-commit.

  Sprawdź obserwowany wynik:

  - `kubectl get application board -o custom-columns=NAME:.metadata.name,PROJECT:.spec.project,REPO:.spec.source.repoURL,PATH:.spec.source.path,BRANCH:.spec.source.targetRevision,NAMESPACE:.spec.destination.namespace,SERVER:.spec.destination.server,SYNC:.status.sync.status,HEALTH:.status.health.status,REVISION:.status.sync.revision; cat release-commit` — Pokazuje dostarczone repozytorium, `main` / `manifests`, `Synced` / `Healthy` i rewizję równą zapisanemu commitowi.
  - `git -C repository ls-remote origin refs/heads/main; cat release-commit /run/dq/facts/0/baseline-commit; git -C repository merge-base --is-ancestor "$(cat /run/dq/facts/0/baseline-commit)" origin/main; printf "ancestry status: %s\n" "$?"; git -C repository diff --stat "$(cat /run/dq/facts/0/baseline-commit)" origin/main` — ID zdalnego commita i wydania są zgodne i różnią się od bazy; ancestry status to `0`; podsumowanie zmian obejmuje `manifests/board.yaml`.
  - `kubectl rollout status deployment/board --timeout=10s; kubectl exec --pod-running-timeout=5s deployment/board -c worker -- wget -qO- -T 3 http://board:8080` — Rollout się kończy, a HTTP zwraca `north-68`.

  Utrzymuj zgodność zapisu publikacji release-commit na stacji roboczej z opublikowanym commitem.

phrases.0: Oddzieliłem synchronizację od kondycji aplikacji.
phrases.1: Naprawiłem źródło commit zamiast walczyć z self-heal.
phrases.2: Sprawdziłem zaobserwowaną odpowiedź revision i rzeczywistą odpowiedź HTTP.
questions.0.points.0: Pożądany manifests może wiernie opisać uszkodzony probe.
questions.0.points.1: Health zależy od zaobserwowanego stanu workload.
questions.0.points.2: Przetestuj readiness i rzeczywisty ruch serwisowy.
questions.0.prompt: Czy Application może być Synced i nadal niedostępny?
questions.1.points.0: Zmień wiarygodne źródło Git.
questions.1.points.1: Po uzgodnieniu sprawdź nową zaobserwowaną wartość revision.
questions.1.points.2: Unikaj polegania na przejściowym live patch.
questions.1.prompt: Na czym polega trwała naprawa, gdy włączona jest funkcja automatycznego self-heal?
