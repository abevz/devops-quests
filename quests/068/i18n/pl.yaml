title: Zdrowie Argo
brief: 'Zarządzane przez Git wydanie `board` nie jest zdrowe dla swoich odbiorców.


  Pracuj na stacji roboczej w `~/quest` z `platform.env`, `application.yaml`, `repository/manifests/board.yaml`.


  **Wymagania:**

  - Application `board` wdraża dostarczone wydanie z prywatnego repozytorium Git.

  - Application `board` zgłasza `Synced` i `Healthy` dla opublikowanego wydania, automatycznie przywraca stan zadany
  w Git i usuwa zasoby usunięte z Git.

  - Deployment `board` kończy rollout w przestrzeni nazw zatoki.

  - Wewnątrz Poda Deployment `board` adres `http://board:8080` zwraca `north-68`.

  - Zdalny `origin/main` i zapis publikacji na stacji roboczej wskazują tego samego nowego potomka pierwotnego wydania.

  - Opublikowane wydanie Git i działający Deployment `board` spełniają wymagany kontrakt zdrowia odbiorcy.


  Dane setup pod `/run/dq/facts/0/` na workstation są autorytatywne; odpowiadające im pliki w `~/quest` to kopie
  robocze.


  Dodatkowe dane wejściowe: `publication/index.html`, `publication/contract.json`, `publication-contract.json`.


  Dostarczony serwer HTTP ma udostępniać zatwierdzoną publikację z projekcji ConfigMap tylko do odczytu w katalogu
  dokumentów. Opublikowane manifesty Git i aktywna projekcja muszą być zgodne, a rzeczywisty HTTP ma udostępniać
  zatwierdzone metadane oraz komunikat. Zachowaj tożsamości pierwotnych Application i Deployment oraz dostarczony
  obraz. Wzorem jest zamrożony zapis początkowy; pliki robocze go nie zastępują.'
debrief: Zbudowano dostarczanie konfiguracji przez Git, uzgodniono kontrakt zdrowia i sprawdzono rzeczywistą publikację
  z zachowaniem tożsamości.
stages.0.brief: Opublikowana rewizja Git musi być zdrowa dla swoich odbiorców.
hints.0.text: Gotowość, dostarczona konfiguracja i rzeczywista odpowiedź opisują różne aspekty zdrowia. Gotowy proces
  może nadal udostępniać wcześniejsze źródło.
hints.1.text: |-
  Porównaj `publication-contract.json`, dostarczone pliki, zatwierdzone manifesty, aktywne montowania, katalog dokumentów, zdarzenia i odpowiedzi HTTP. Prześledź, jakie dane docierają do procesu i jaką ścieżkę obserwuje sonda.

  Znajdź publiczne pliki w manifestach Git, ścieżkę montowania i katalog udostępniany przez serwer. Porównaj aktualną ścieżkę gotowości z odpowiedzią i zapisem publikacji.
hints.2.text: |-
  Sprawdź zdalną rewizję, pierwotne UID i obraz, `/` oraz `/contract.json`, a metadane porównaj z zamrożonym zapisem. Zachowaj historię rewizji początkowej.

  `kubectl get application board; kubectl rollout status deployment/board --timeout=10s; kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080/contract.json` — Oczekiwane: Synced/Healthy, zakończony rollout i metadane zgodne z zamrożonym zapisem publikacji.

  Porównaj zdalną main, zapis wydania na stacji roboczej i obserwowaną rewizję Application. Porównaj aktywne UID, obraz i zamontowaną publikację z dostarczonym potwierdzeniem. Pierwsza ścieżka HTTP zwraca `north-68`, a metadane muszą odpowiadać zatwierdzonemu kontraktowi.

  ```bash
  git -C repository ls-remote origin refs/heads/main
  cat release-commit
  jq '{applicationUID,deploymentUID,image,contract}' publication-contract.json
  kubectl get application/board deployment/board -o yaml
  kubectl rollout status deployment/board --timeout=10s
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080/
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080/contract.json
  ```
phrases.0: Oddzieliłem synchronizację od kondycji aplikacji.
phrases.1: Naprawiłem źródło commit zamiast walczyć z self-heal.
phrases.2: Sprawdziłem zaobserwowaną odpowiedź revision i rzeczywistą odpowiedź HTTP.
questions.0.points.0: Pożądany manifests może wiernie opisać uszkodzony probe.
questions.0.points.1: Health zależy od zaobserwowanego stanu workload.
questions.0.points.2: Przetestuj readiness i rzeczywisty ruch serwisowy.
questions.0.prompt: Czy Application może być Synced i nadal niedostępny?
questions.1.points.0: Zmień wiarygodne źródło Git.
questions.1.points.1: Po uzgodnieniu sprawdź nową zaobserwowaną wartość revision.
questions.1.points.2: Unikaj polegania na przejściowym live patch.
questions.1.prompt: Na czym polega trwała naprawa, gdy włączona jest funkcja automatycznego self-heal?
stages.0.objectives.0.text: Application `board` wdraża dostarczone wydanie z prywatnego repozytorium Git.
stages.0.objectives.1.text: Application `board` zgłasza `Synced` i `Healthy` dla opublikowanego wydania, automatycznie
  przywraca stan zadany w Git i usuwa zasoby usunięte z Git.
stages.0.objectives.2.text: Deployment `board` kończy rollout w przestrzeni nazw zatoki.
stages.0.objectives.3.text: Wewnątrz Poda Deployment `board` adres `http://board:8080` zwraca `north-68`.
stages.0.objectives.4.text: Zdalny `origin/main` i zapis publikacji na stacji roboczej wskazują tego samego nowego
  potomka pierwotnego wydania.
stages.0.objectives.5.text: Opublikowane wydanie Git i działający Deployment `board` spełniają wymagany kontrakt
  zdrowia odbiorcy. Zatwierdzona publikacja jest projektowana tylko do odczytu w katalogu dokumentów dostarczonego
  serwera HTTP i widoczna przez HTTP, z zachowaniem tożsamości Application, Deployment i obrazu.
diagnostics.git_source: Application może wybierać inne repozytorium, gałąź lub katalog manifestów; porównaj source z platform.env i dostarczonym manifests. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=health-application-git-source)
diagnostics.git_health: Wydanie może być niesprawne lub niezsynchronizowane albo selfHeal/prune są wyłączone; porównaj status Application, release-commit i flagi automatyzacji. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=health-synced-revision-and-automation)
diagnostics.git_rollout: Dostarczona sonda readiness wskazuje 9090; rollout może nie zakończyć się, dopóki aplikacja z Git nie udostępnia publikacji na 8080. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=health-git-declared-readiness)
diagnostics.git_http: Żądanie przez Service może nie docierać lub zwracać inną trasę; porównaj selector, gotowość endpoints i index z dostarczoną publikacją. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=health-service-route-response)
diagnostics.git_descendant: Sam patch żywego obiektu nie publikuje nowej rewizji Git; wypchnij potomka zamrożonej bazy i uzgodnij release-commit z origin/main. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=health-published-descendant-commit)
diagnostics.probe_0_5: Polecenie worker, środowisko lub sondy health w Git i live mogą się różnić, albo starsza kontrola rollout/HTTP zawodzi; błędy startu też dają ten fallback. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=health-git-live-agreement-fallback)
diagnostics.publication_identity: Odtworzenie Application lub Deployment zmienia zamrożony UID; popraw pierwotne obiekty, zachowując ich tożsamość. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=health-retain-original-object-uids)
diagnostics.publication_source: Stara rewizja Application, inne repozytorium/image lub zmiana ConfigMap tylko live naruszają zgodność; porównaj całe data ConfigMap z Git. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=health-git-image-and-full-configmap-data)
diagnostics.publication_projection: Serwer HTTP może nadal serwować wygenerowany katalog zamiast zatwierdzonych kluczy ConfigMap; prześledź mounts Git i live do rzeczywistego katalogu serwera. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=health-actual-http-root-projection)
diagnostics.publication_http: Odczytany contract.json może mieć inne pola publikacji; porównaj HTTP JSON z zamrożonym kontraktem po uzgodnieniu źródła. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=health-public-http-contract-fields)
diagnostics.publication_budget: Polecenie API, Git lub kontenera może przekraczać limit obserwacji; znajdź blokującą operację przed ponowną kontrolą publikacji. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=health-bounded-publication-observation)
diagnostics.publication_observation: Nieczytelne receipts, błędne manifesty/JSON lub awarie API/HTTP blokują obserwację; odróżnij je od poprawnie odczytanego, ale niewłaściwego kontraktu HTTP. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=health-publication-input-and-api-errors)
