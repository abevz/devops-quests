title: Здоровье Argo CD
brief: 'Приватный Application может синхронизироваться, но probe в Git обращается
  к 9090, а HTTP слушает 8080. Исправьте repository/manifests/board.json, закоммитьте
  и отправьте в main одноразовой Gitea, затем обновите Argo. Сохраните историю baseline-commit.
  Одного Synced недостаточно: записанный текущий revision должен стать Healthy и реально
  отдавать north-68. Во время ожидания неисправного rollout controller может показывать
  Progressing.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `platform.env`,
  `application.json`, `repository/manifests/board.json`, `repository/manifests/service.json`,
  `baseline-commit`, `release-commit`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно
  загруженные образы и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Исправленный Git commit синхронизирован и Healthy, readiness
  использует 8080, реальный endpoint возвращает north-68.


  Исходные метки проверки доступны только для чтения в `/run/dq/facts/0/`; одноимённые
  файлы в `~/quest` — рабочие копии.'
debrief: Git и исправность workload согласованы; прямой live patch был бы отменён
  self-heal.
stages.0.brief: 'Результат проверки: Исправленный Git commit синхронизирован и Healthy,
  readiness использует 8080, реальный endpoint возвращает north-68.'
stages.0.objectives.0.text: Исправленный Git commit синхронизирован и Healthy, readiness
  использует 8080, реальный endpoint возвращает north-68.
hints.0.text: Sync сравнивает желаемые ресурсы; health описывает их состояние.
hints.1.text: Сравните probe в Git с командой работающего контейнера.
hints.2.text: Закоммитьте исправление порта в Git, обновите и проверьте revision,
  readiness и HTTP.
phrases.0: Я разделил синхронизацию и исправность приложения.
phrases.1: Я исправил исходный commit вместо борьбы с self-heal.
phrases.2: Я проверил наблюдаемый revision и реальный HTTP-ответ.
questions.0.points.0: Желаемые manifests могут точно описывать неверную probe.
questions.0.points.1: Health зависит от наблюдаемого состояния workload.
questions.0.points.2: Проверять readiness и реальный трафик сервиса.
questions.0.prompt: Может ли Application быть Synced и недоступным?
questions.1.points.0: Изменить основной источник в Git.
questions.1.points.1: Проверить новый наблюдаемый revision после сверки.
questions.1.points.2: Не полагаться на временный live patch.
questions.1.prompt: Какое исправление сохранится при включённом self-heal?
