title: Здоровье Argo CD
brief: 'Управляемый через Git выпуск `board` не готов для своих потребителей.


  Работайте на рабочей станции в `~/quest` с `platform.env`, `application.yaml`, `repository/manifests/board.yaml`.


  **Требования:**

  - Application `board` развёртывает поставленный релиз из приватного Git-репозитория.

  - Application `board` сообщает `Synced` и `Healthy` для опубликованного релиза, автоматически восстанавливает
  желаемое состояние из Git и удаляет ресурсы, удалённые из Git.

  - Deployment `board` завершает rollout в namespace песочницы.

  - Внутри Pod Deployment `board` адрес `http://board:8080` возвращает `north-68`.

  - Удалённая ветка `origin/main` и запись о публикации на рабочей станции указывают на одного и того же нового
  потомка исходного релиза.

  - Опубликованный Git-релиз и работающий Deployment `board` соответствуют требуемому контракту состояния потребителя.


  Данные setup в `/run/dq/facts/0/` на workstation авторитетны; совпадающие файлы в `~/quest` — рабочие копии.

  '
debrief: Git и исправность workload согласованы; прямой live patch был бы отменён self-heal.
stages.0.brief: Опубликованная ревизия Git должна быть готова для своих потребителей.
hints.0.text: Sync сравнивает желаемые ресурсы; health описывает их состояние.
hints.1.text: 'Закоммиченный readiness probe направлен на 9090, а HTTP слушает 8080. Во время неуспешного rollout
  application-controller может кратко сообщать Progressing.


  Изучите поставленные входные данные и наблюдаемое состояние:


  ```sh

  cat application.yaml repository/manifests/board.yaml

  kubectl describe application board

  kubectl describe pod -l app=board

  ```'
hints.2.text: |-
  Исправьте repository/manifests/board.yaml, закоммитьте и отправьте в приватную ветку main, затем обновите Argo. Сохраните историю baseline-commit.

  Проверьте наблюдаемый результат:

  - `kubectl get application board -o custom-columns=NAME:.metadata.name,PROJECT:.spec.project,REPO:.spec.source.repoURL,PATH:.spec.source.path,BRANCH:.spec.source.targetRevision,NAMESPACE:.spec.destination.namespace,SERVER:.spec.destination.server,SYNC:.status.sync.status,HEALTH:.status.health.status,REVISION:.status.sync.revision; cat release-commit` — Показывает предоставленный репозиторий, `main` / `manifests`, `Synced` / `Healthy` и ревизию, совпадающую с записанным коммитом.
  - `git -C repository ls-remote origin refs/heads/main; cat release-commit /run/dq/facts/0/baseline-commit; git -C repository merge-base --is-ancestor "$(cat /run/dq/facts/0/baseline-commit)" origin/main; printf "ancestry status: %s\n" "$?"; git -C repository diff --stat "$(cat /run/dq/facts/0/baseline-commit)" origin/main` — ID удалённого коммита и выпуска совпадают и отличаются от исходного; ancestry status равен `0`; сводка изменений включает `manifests/board.yaml`.
  - `kubectl rollout status deployment/board --timeout=10s; kubectl exec --pod-running-timeout=5s deployment/board -c worker -- wget -qO- -T 3 http://board:8080` — Rollout завершается, HTTP возвращает `north-68`.

  Согласуйте запись о публикации release-commit на рабочей станции с опубликованным коммитом.

phrases.0: Я разделил синхронизацию и исправность приложения.
phrases.1: Я исправил исходный commit вместо борьбы с self-heal.
phrases.2: Я проверил наблюдаемый revision и реальный HTTP-ответ.
questions.0.points.0: Желаемые manifests могут точно описывать неверную probe.
questions.0.points.1: Health зависит от наблюдаемого состояния workload.
questions.0.points.2: Проверять readiness и реальный трафик сервиса.
questions.0.prompt: Может ли Application быть Synced и недоступным?
questions.1.points.0: Изменить основной источник в Git.
questions.1.points.1: Проверить новый наблюдаемый revision после сверки.
questions.1.points.2: Не полагаться на временный live patch.
questions.1.prompt: Какое исправление сохранится при включённом self-heal?
