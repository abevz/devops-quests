title: Argo health
brief: 'The Git-managed `board` release is not healthy for its consumers.


  Work on the workstation in `~/quest` with `platform.env`, `application.yaml`, `repository/manifests/board.yaml`.


  **Requirements:**

  - Application `board` deploys the supplied release from the private Git repository.

  - Application `board` reports `Synced` and `Healthy` at the published release, automatically restores Git-desired
  state and removes resources removed from Git.

  - Deployment `board` completes its rollout in the bay namespace.

  - Inside a Pod of Deployment `board`, `http://board:8080` returns `north-68`.

  - Remote `origin/main` and the workstation publication record identify the same new descendant of the original
  release.

  - The published Git release and live Deployment `board` both satisfy the required consumer health contract.


  Setup evidence under workstation `/run/dq/facts/0/` is authoritative; matching files in `~/quest` are working
  copies.


  Additional inputs: `publication/index.html`, `publication/contract.json`, `publication-contract.json`.


  The supplied HTTP server must serve the approved publication from a read-only ConfigMap projection at its document
  root. The published Git manifests and live projection must agree, and actual HTTP must expose the approved metadata
  as well as the banner. Preserve the original Application and Deployment identities and supplied container image.
  Use the frozen setup receipt as the reference; working input files do not replace it.'
debrief: You constructed Git-managed configuration delivery, reconciled the health contract and verified the actual
  publication while preserving existing identities.
stages.0.brief: The published Git revision must be healthy for its consumers.
hints.0.text: Readiness, delivered configuration and a real application response describe different parts of health.
  A process can be ready while still serving an older source.
hints.1.text: Compare `publication-contract.json`, the supplied publication files, committed manifests, live mounts,
  server document root, events and HTTP responses. Follow which data reaches the process and which path the health
  check observes.
hints.2.text: 'Construct the ConfigMap publication and read-only projection at the supplied server''s document root,
  and align the health probe with the actual service. Commit and push, update the publication record and refresh
  Argo. Verify the remote revision, original UIDs and image, `/` and `/contract.json`, and compare the metadata
  with the frozen receipt. Preserve baseline ancestry.


  `kubectl get application board; kubectl rollout status deployment/board --timeout=10s; kubectl exec deployment/board
  -c worker -- wget -qO- -T 3 http://board:8080/contract.json` — Expect Synced/Healthy, a completed rollout and
  metadata matching the frozen publication receipt.'
phrases.0: I separated synchronization from application health.
phrases.1: I repaired the source commit instead of fighting self-heal.
phrases.2: I verified the observed revision and a real HTTP response.
questions.0.points.0: The desired manifests can faithfully describe a broken probe.
questions.0.points.1: Health depends on observed workload state.
questions.0.points.2: Test readiness and real service traffic.
questions.0.prompt: Can an Application be Synced and still unavailable?
questions.1.points.0: Change the authoritative Git source.
questions.1.points.1: Verify the new observed revision after reconciliation.
questions.1.points.2: Avoid relying on a transient live patch.
questions.1.prompt: What is the durable repair when automated self-heal is enabled?
stages.0.objectives.0.text: Application `board` deploys the supplied release from the private Git repository.
stages.0.objectives.1.text: Application `board` reports `Synced` and `Healthy` at the published release, automatically
  restores Git-desired state and removes resources removed from Git.
stages.0.objectives.2.text: Deployment `board` completes its rollout in the bay namespace.
stages.0.objectives.3.text: Inside a Pod of Deployment `board`, `http://board:8080` returns `north-68`.
stages.0.objectives.4.text: Remote `origin/main` and the workstation publication record identify the same new descendant
  of the original release.
stages.0.objectives.5.text: The published Git release and live Deployment `board` both satisfy the required consumer
  health contract. The approved publication is projected read-only into the supplied HTTP server's document root
  and is observable through HTTP, with original Application, Deployment and image identities retained.
diagnostics.probe_0_5: The publication could not be observed. Inspect receipts, manifest formats, mounted inputs
  and the supplied HTTP server.
diagnostics.publication_identity: The original Application or Deployment was replaced. Compare UIDs with the publication
  receipt.
diagnostics.publication_source: Published intent, live configuration or the supplied image differs. Compare the
  Git revision, image and ConfigMap data.
diagnostics.publication_projection: The approved data is not projected at the actual HTTP server document root.
  Inspect mounts, their sources and the running server.
diagnostics.publication_http: Actual HTTP metadata differs from the approved publication. Compare its fields with
  the receipt after reconciliation.
diagnostics.publication_budget: Publication observation exceeded its budget. Inspect blocking API requests and endpoint
  availability.
diagnostics.publication_observation: The publication could not be observed. Inspect receipts, manifest formats,
  mounted inputs and the supplied HTTP server.
