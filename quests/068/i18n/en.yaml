title: Argo health
brief: 'The Git-managed `board` release is not healthy for its consumers.


  Work on the workstation in `~/quest` with `platform.env`, `application.yaml`, `repository/manifests/board.yaml`.


  **Requirements:**

  - Application `board` deploys the supplied release from the private Git repository.

  - Application `board` reports `Synced` and `Healthy` at the published release, automatically restores Git-desired
  state and removes resources removed from Git.

  - Deployment `board` completes its rollout in the bay namespace.

  - Inside a Pod of Deployment `board`, `http://board:8080` returns `north-68`.

  - Remote `origin/main` and the workstation publication record identify the same new descendant of the original
  release.

  - The published Git release and live Deployment `board` both satisfy the required consumer health contract.


  Setup evidence under workstation `/run/dq/facts/0/` is authoritative; matching files in `~/quest` are working
  copies.

  '
debrief: Git intent and workload health now agree; a direct live patch would have been reverted by self-heal.
stages.0.brief: The published Git revision must be healthy for its consumers.
hints.0.text: Sync compares desired resources; health describes their observed condition.
hints.1.text: 'The committed readiness probe targets 9090 while HTTP listens on 8080. The application-controller
  may briefly report Progressing during the failed rollout.


  Inspect the supplied inputs and observed state:


  ```sh

  cat application.yaml repository/manifests/board.yaml

  kubectl describe application board

  kubectl describe pod -l app=board

  ```'
hints.2.text: |-
  Correct repository/manifests/board.yaml, commit and push to the private main branch, then refresh Argo. Preserve baseline-commit history.

  Verify the observed result:

  - `kubectl get application board -o custom-columns=NAME:.metadata.name,PROJECT:.spec.project,REPO:.spec.source.repoURL,PATH:.spec.source.path,BRANCH:.spec.source.targetRevision,NAMESPACE:.spec.destination.namespace,SERVER:.spec.destination.server,SYNC:.status.sync.status,HEALTH:.status.health.status,REVISION:.status.sync.revision; cat release-commit` — Shows the supplied repository, `main` / `manifests`, `Synced` / `Healthy`, and a revision equal to the recorded commit.
  - `git -C repository ls-remote origin refs/heads/main; cat release-commit /run/dq/facts/0/baseline-commit; git -C repository merge-base --is-ancestor "$(cat /run/dq/facts/0/baseline-commit)" origin/main; printf "ancestry status: %s\n" "$?"; git -C repository diff --stat "$(cat /run/dq/facts/0/baseline-commit)" origin/main` — Remote and release commit IDs agree and differ from the baseline; ancestry status is `0`; the change summary includes `manifests/board.yaml`.
  - `kubectl rollout status deployment/board --timeout=10s; kubectl exec --pod-running-timeout=5s deployment/board -c worker -- wget -qO- -T 3 http://board:8080` — Rollout completes and HTTP returns `north-68`.

  Keep the workstation publication record release-commit in agreement with the published commit.

phrases.0: I separated synchronization from application health.
phrases.1: I repaired the source commit instead of fighting self-heal.
phrases.2: I verified the observed revision and a real HTTP response.
questions.0.points.0: The desired manifests can faithfully describe a broken probe.
questions.0.points.1: Health depends on observed workload state.
questions.0.points.2: Test readiness and real service traffic.
questions.0.prompt: Can an Application be Synced and still unavailable?
questions.1.points.0: Change the authoritative Git source.
questions.1.points.1: Verify the new observed revision after reconciliation.
questions.1.points.2: Avoid relying on a transient live patch.
questions.1.prompt: What is the durable repair when automated self-heal is enabled?
