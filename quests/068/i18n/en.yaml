title: Argo health
brief: 'The private Application can synchronize, but the committed readiness probe
  targets 9090 while HTTP listens on 8080. Correct repository/manifests/board.json,
  commit and push to the disposable Gitea main branch, then refresh Argo. Preserve
  baseline-commit history. Synced alone is insufficient: the recorded current revision
  must become Healthy and actually serve north-68. The application-controller may
  briefly report Progressing while the bad rollout waits.


  Quest files in `~/quest` (some appear in later stages): `platform.env`, `application.json`,
  `repository/manifests/board.json`, `repository/manifests/service.json`, `baseline-commit`,
  `release-commit`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images
  and private services. Change only this bay.


  Initial success criteria: The corrected Git commit is synchronized and Healthy,
  readiness uses 8080 and the real endpoint returns north-68.


  The authoritative setup evidence is read-only under `/run/dq/facts/0/`; matching
  files in `~/quest` are working copies.'
debrief: Git intent and workload health now agree; a direct live patch would have
  been reverted by self-heal.
stages.0.brief: 'Success criteria: The corrected Git commit is synchronized and Healthy,
  readiness uses 8080 and the real endpoint returns north-68.'
stages.0.objectives.0.text: The corrected Git commit is synchronized and Healthy,
  readiness uses 8080 and the real endpoint returns north-68.
hints.0.text: Sync compares desired resources; health describes their observed condition.
hints.1.text: Read the probe in Git and compare it with the running command.
hints.2.text: Commit the port correction in Git, refresh and verify revision, readiness
  and HTTP.
phrases.0: I separated synchronization from application health.
phrases.1: I repaired the source commit instead of fighting self-heal.
phrases.2: I verified the observed revision and a real HTTP response.
questions.0.points.0: The desired manifests can faithfully describe a broken probe.
questions.0.points.1: Health depends on observed workload state.
questions.0.points.2: Test readiness and real service traffic.
questions.0.prompt: Can an Application be Synced and still unavailable?
questions.1.points.0: Change the authoritative Git source.
questions.1.points.1: Verify the new observed revision after reconciliation.
questions.1.points.2: Avoid relying on a transient live patch.
questions.1.prompt: What is the durable repair when automated self-heal is enabled?
