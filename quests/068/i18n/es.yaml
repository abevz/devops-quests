title: Argo salud
brief: 'El Application privado se puede sincronizar, pero el readiness probe comprometido apunta a 9090
  mientras que el HTTP escucha en 8080. Corrija repository/manifests/board.json, confirme y envíe al Gitea
  desechable. Rama main, luego actualice Argo. Preservar el historial de baseline-commit. Synced por sí
  solo es insuficiente: el revision actual registrado debe convertirse en Healthy y servir realmente a
  north-68. El controlador de la aplicación puede informar brevemente sobre Progressing mientras el rollout
  defectuoso espera.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `platform.env`, `application.json`,
  `repository/manifests/board.json`, `repository/manifests/service.json`, `baseline-commit`, `release-commit`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: la confirmación Git corregida está sincronizada y Healthy, readiness usa
  8080 y el endpoint real devuelve north-68.


  La evidencia de configuración autorizada es de solo lectura en `/run/dq/facts/0/`; Los archivos coincidentes
  en `~/quest` son copias de trabajo.'
debrief: La intención de Git y el estado de workload ahora coinciden; Un patch directo en vivo habría
  sido revertido por self-heal.
stages.0.brief: 'Criterios de éxito: la confirmación Git corregida está sincronizada y Healthy, readiness
  usa 8080 y el endpoint real devuelve north-68.'
stages.0.objectives.0.text: La confirmación Git corregida está sincronizada y Healthy, readiness usa 8080
  y el endpoint real devuelve north-68.
hints.0.text: Sync compara los recursos deseados; health describe su condición observada.
hints.1.text: Lea el probe en Git y compárelo con el comando en ejecución.
hints.2.text: Confirme la corrección del puerto en Git, actualice y verifique revision, readiness y HTTP.
phrases.0: Separé la sincronización del estado de la aplicación.
phrases.1: Reparé la confirmación de la fuente en lugar de luchar contra self-heal.
phrases.2: Verifiqué el revision observado y una respuesta real de HTTP.
questions.0.points.0: El deseado manifests puede describir fielmente un probe roto.
questions.0.points.1: Health depende del estado observado de workload.
questions.0.points.2: Pruebe readiness y el tráfico de servicio real.
questions.0.prompt: ¿Puede un Application ser Synced y aún no estar disponible?
questions.1.points.0: Cambie la fuente autorizada Git.
questions.1.points.1: Verifique el nuevo revision observado después de la conciliación.
questions.1.points.2: Evite depender de un patch transitorio en vivo.
questions.1.prompt: ¿Cuál es la reparación duradera cuando se habilita el self-heal automatizado?
