title: Argo salud
brief: |
  La versión `board` administrada mediante Git no está saludable para sus consumidores.

  Trabaja en la workstation en `~/quest` con `platform.env`, `application.yaml`, `repository/manifests/board.yaml`, `release-commit`.

  **Requisitos:**
  - Application en el namespace de la bahía:
    - Nombre: `board`.
    - Repositorio: `GIT_URL` de `~/quest/platform.env` en la workstation.
    - Rama y directorio fuente: `main`, `manifests`.
  - Resultado observado de la Application:
    - Estado: `Synced`, `Healthy`.
    - La revisión sincronizada coincide con `~/quest/release-commit` en la workstation.
  - Deployment en el namespace de la bahía:
    - Nombre: `board`.
    - Rollout completo.
  - HTTP dentro de un Pod del Deployment `board`:
    - Ruta: `http://board:8080`.
    - Respuesta: `north-68`.
  - Resultado Git publicado en `~/quest/repository` en la workstation:
    - `origin/main` coincide con `~/quest/release-commit` en la workstation y difiere de la base de `/run/dq/facts/0/baseline-commit` en la workstation.
    - La base sigue siendo un ancestro del commit publicado.
    - Manifiesto en `origin/main` de `~/quest/repository` en la workstation: `manifests/board.yaml`.
    - El Deployment `board` activo coincide con ese manifiesto; la versión está `Healthy`.

  **Verifica antes de Check & finish:**
  - `kubectl get application board -o custom-columns=NAME:.metadata.name,PROJECT:.spec.project,REPO:.spec.source.repoURL,PATH:.spec.source.path,BRANCH:.spec.source.targetRevision,NAMESPACE:.spec.destination.namespace,SERVER:.spec.destination.server,SYNC:.status.sync.status,HEALTH:.status.health.status,REVISION:.status.sync.revision; cat release-commit` — Muestra el repositorio suministrado, `main` / `manifests`, `Synced` / `Healthy` y una revisión igual al commit registrado.
  - `git -C repository ls-remote origin refs/heads/main; cat release-commit /run/dq/facts/0/baseline-commit; git -C repository merge-base --is-ancestor "$(cat /run/dq/facts/0/baseline-commit)" origin/main; printf "ancestry status: %s\n" "$?"; git -C repository diff --stat "$(cat /run/dq/facts/0/baseline-commit)" origin/main` — Los ID de commit remoto y de versión coinciden y difieren de la base; ancestry status es `0`; el resumen de cambios incluye `manifests/board.yaml`.
  - `kubectl rollout status deployment/board --timeout=10s; kubectl exec --pod-running-timeout=5s deployment/board -- wget -qO- -T 3 http://board:8080` — El rollout se completa y HTTP devuelve `north-68`.

  La evidencia de setup en `/run/dq/facts/0/` en la workstation es autoritativa; los archivos correspondientes de `~/quest` son copias de trabajo.
debrief: La intención de Git y el estado de workload ahora coinciden; Un patch directo en vivo habría sido revertido
  por self-heal.
stages.0.brief: La revisión Git publicada debe estar saludable para sus consumidores.
hints.0.text: Sync compara los recursos deseados; health describe su condición observada.
hints.1.text: La sonda de readiness confirmada apunta a 9090 mientras HTTP escucha en 8080. El application-controller
  puede informar brevemente Progressing durante el rollout fallido.
hints.2.text: Corrige repository/manifests/board.yaml, confirma y publica en la rama main privada, y actualiza Argo.
  Conserva el historial de baseline-commit.
phrases.0: Separé la sincronización del estado de la aplicación.
phrases.1: Reparé la confirmación de la fuente en lugar de luchar contra self-heal.
phrases.2: Verifiqué el revision observado y una respuesta real de HTTP.
questions.0.points.0: El deseado manifests puede describir fielmente un probe roto.
questions.0.points.1: Health depende del estado observado de workload.
questions.0.points.2: Pruebe readiness y el tráfico de servicio real.
questions.0.prompt: ¿Puede un Application ser Synced y aún no estar disponible?
questions.1.points.0: Cambie la fuente autorizada Git.
questions.1.points.1: Verifique el nuevo revision observado después de la conciliación.
questions.1.points.2: Evite depender de un patch transitorio en vivo.
questions.1.prompt: ¿Cuál es la reparación duradera cuando se habilita el self-heal automatizado?
stages.0.objectives.0.text: La Application `board` sigue `main` / `manifests` en el repositorio privado indicado
  por `platform.env` en la workstation (`GIT_URL`).
stages.0.objectives.1.text: La Application `board` informa `Synced` y `Healthy` en `~/quest/release-commit`.
stages.0.objectives.2.text: El Deployment `board` completa su rollout en el namespace de la bahía.
stages.0.objectives.3.text: Dentro de un Pod del Deployment `board`, `http://board:8080` devuelve `north-68`.
stages.0.objectives.4.text: El remoto `origin/main` coincide con `release-commit` en la workstation y es un nuevo
  descendiente de la base registrada en `/run/dq/facts/0/baseline-commit`.
stages.0.objectives.5.text: 'La corrección está confirmada en Git: el Deployment `board` activo coincide con `manifests/board.yaml`
  del repositorio y la versión está Healthy.'
