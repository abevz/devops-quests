title: Argo salud
brief: 'La versión `board` administrada mediante Git no está saludable para sus consumidores.


  Trabaja en la estación de trabajo en `~/quest` con `platform.env`, `application.yaml`, `repository/manifests/board.yaml`.


  **Requisitos:**

  - La Application `board` despliega la versión suministrada desde el repositorio Git privado.

  - La Application `board` indica `Synced` y `Healthy` para la versión publicada, restaura automáticamente el estado
  deseado de Git y elimina los recursos retirados de Git.

  - El Deployment `board` completa su rollout en el namespace de la bahía.

  - Dentro de un Pod del Deployment `board`, `http://board:8080` devuelve `north-68`.

  - El `origin/main` remoto y el registro de publicación de la estación de trabajo identifican el mismo descendiente
  nuevo de la versión original.

  - La versión publicada en Git y el Deployment `board` activo cumplen ambos el contrato de salud requerido del
  consumidor.


  La evidencia de setup en `/run/dq/facts/0/` en la workstation es autoritativa; los archivos correspondientes de
  `~/quest` son copias de trabajo.


  Entradas adicionales: `publication/index.html`, `publication/contract.json`, `publication-contract.json`.


  El servidor HTTP suministrado debe servir la publicación aprobada desde una proyección ConfigMap de solo lectura
  en su raíz de documentos. Los manifiestos Git publicados y la proyección activa deben coincidir; HTTP real debe
  mostrar los metadatos aprobados además del mensaje. Conserva las identidades de la Application y Deployment originales
  y la imagen suministrada. La referencia es el registro inicial congelado; los archivos de trabajo no lo sustituyen.'
debrief: Construiste la entrega de configuración gestionada por Git, reconciliaste el contrato de salud y verificaste
  la publicación real conservando las identidades.
stages.0.brief: La revisión Git publicada debe estar saludable para sus consumidores.
hints.0.text: La disponibilidad, la configuración entregada y una respuesta real describen aspectos distintos de
  la salud. Un proceso disponible puede seguir sirviendo una fuente anterior.
hints.1.text: Compara `publication-contract.json`, los archivos suministrados, los manifiestos confirmados, los
  montajes activos, la raíz de documentos, los eventos y las respuestas HTTP. Sigue qué datos llegan al proceso
  y qué ruta observa la comprobación de salud.
hints.2.text: 'Construye la publicación ConfigMap y su proyección de solo lectura en la raíz de documentos del servidor
  suministrado; alinea la sonda con el servicio real. Realiza commit y push, actualiza el registro y refresca Argo.
  Verifica la revisión remota, los UID y la imagen originales, `/` y `/contract.json`, y compara los metadatos con
  el registro congelado. Conserva la ascendencia inicial.


  `kubectl get application board; kubectl rollout status deployment/board --timeout=10s; kubectl exec deployment/board
  -c worker -- wget -qO- -T 3 http://board:8080/contract.json` — Se esperan Synced/Healthy, rollout completado y
  metadatos que coincidan con el registro congelado de publicación.'
phrases.0: Separé la sincronización del estado de la aplicación.
phrases.1: Reparé la confirmación de la fuente en lugar de luchar contra self-heal.
phrases.2: Verifiqué el revision observado y una respuesta real de HTTP.
questions.0.points.0: El deseado manifests puede describir fielmente un probe roto.
questions.0.points.1: Health depende del estado observado de workload.
questions.0.points.2: Pruebe readiness y el tráfico de servicio real.
questions.0.prompt: ¿Puede un Application ser Synced y aún no estar disponible?
questions.1.points.0: Cambie la fuente autorizada Git.
questions.1.points.1: Verifique el nuevo revision observado después de la conciliación.
questions.1.points.2: Evite depender de un patch transitorio en vivo.
questions.1.prompt: ¿Cuál es la reparación duradera cuando se habilita el self-heal automatizado?
stages.0.objectives.0.text: La Application `board` despliega la versión suministrada desde el repositorio Git privado.
stages.0.objectives.1.text: La Application `board` indica `Synced` y `Healthy` para la versión publicada, restaura
  automáticamente el estado deseado de Git y elimina los recursos retirados de Git.
stages.0.objectives.2.text: El Deployment `board` completa su rollout en el namespace de la bahía.
stages.0.objectives.3.text: Dentro de un Pod del Deployment `board`, `http://board:8080` devuelve `north-68`.
stages.0.objectives.4.text: El `origin/main` remoto y el registro de publicación de la estación de trabajo identifican
  el mismo descendiente nuevo de la versión original.
stages.0.objectives.5.text: La versión publicada en Git y el Deployment `board` activo cumplen ambos el contrato
  de salud requerido del consumidor. La publicación aprobada se proyecta en modo de solo lectura en la raíz de documentos
  del servidor HTTP suministrado y se observa mediante HTTP, conservando las identidades de Application, Deployment
  e imagen.
diagnostics.probe_0_5: No se pudo observar la publicación. Revisa registros, formatos de manifiesto, entradas montadas
  y servidor HTTP suministrado.
diagnostics.publication_identity: Se sustituyó la Application o el Deployment original. Compara los UID con el registro
  de publicación.
diagnostics.publication_source: La intención publicada, la configuración activa o la imagen suministrada difieren.
  Compara revisión Git, imagen y datos ConfigMap.
diagnostics.publication_projection: Los datos aprobados no se proyectan en la raíz real de documentos HTTP. Inspecciona
  montajes, fuentes y servidor en ejecución.
diagnostics.publication_http: Los metadatos HTTP reales difieren de la publicación aprobada. Compara sus campos
  con el registro tras la reconciliación.
diagnostics.publication_budget: La observación de la publicación superó su tiempo. Revisa solicitudes API bloqueadas
  y disponibilidad del destino.
diagnostics.publication_observation: No se pudo observar la publicación. Revisa registros, formatos de manifiesto,
  entradas montadas y servidor HTTP suministrado.
