title: Argo salud
brief: 'La versión `board` administrada mediante Git no está saludable para sus consumidores.


  Trabaja en la estación de trabajo en `~/quest` con `platform.env`, `application.yaml`, `repository/manifests/board.yaml`.


  **Requisitos:**

  - La Application `board` despliega la versión suministrada desde el repositorio Git privado.

  - La Application `board` indica `Synced` y `Healthy` para la versión publicada, restaura automáticamente
  el estado deseado de Git y elimina los recursos retirados de Git.

  - El Deployment `board` completa su rollout en el namespace de la bahía.

  - Dentro de un Pod del Deployment `board`, `http://board:8080` devuelve `north-68`.

  - El `origin/main` remoto y el registro de publicación de la estación de trabajo identifican el mismo descendiente
  nuevo de la versión original.

  - La versión publicada en Git y el Deployment `board` activo cumplen ambos el contrato de salud requerido
  del consumidor.


  La evidencia de setup en `/run/dq/facts/0/` en la workstation es autoritativa; los archivos correspondientes
  de `~/quest` son copias de trabajo.

  '
debrief: La intención de Git y el estado de workload ahora coinciden; Un patch directo en vivo habría sido
  revertido por self-heal.
stages.0.brief: La revisión Git publicada debe estar saludable para sus consumidores.
hints.0.text: Sync compara los recursos deseados; health describe su condición observada.
hints.1.text: 'La sonda de readiness confirmada apunta a 9090 mientras HTTP escucha en 8080. El application-controller
  puede informar brevemente Progressing durante el rollout fallido.


  Inspecciona las entradas suministradas y el estado observado:


  ```sh

  cat application.yaml repository/manifests/board.yaml

  kubectl describe application board

  kubectl describe pod -l app=board

  ```'
hints.2.text: |-
  Corrige repository/manifests/board.yaml, confirma y publica en la rama main privada, y actualiza Argo. Conserva el historial de baseline-commit.

  Verifica el resultado observado:

  - `kubectl get application board -o custom-columns=NAME:.metadata.name,PROJECT:.spec.project,REPO:.spec.source.repoURL,PATH:.spec.source.path,BRANCH:.spec.source.targetRevision,NAMESPACE:.spec.destination.namespace,SERVER:.spec.destination.server,SYNC:.status.sync.status,HEALTH:.status.health.status,REVISION:.status.sync.revision; cat release-commit` — Muestra el repositorio suministrado, `main` / `manifests`, `Synced` / `Healthy` y una revisión igual al commit registrado.
  - `git -C repository ls-remote origin refs/heads/main; cat release-commit /run/dq/facts/0/baseline-commit; git -C repository merge-base --is-ancestor "$(cat /run/dq/facts/0/baseline-commit)" origin/main; printf "ancestry status: %s\n" "$?"; git -C repository diff --stat "$(cat /run/dq/facts/0/baseline-commit)" origin/main` — Los ID de commit remoto y de versión coinciden y difieren de la base; ancestry status es `0`; el resumen de cambios incluye `manifests/board.yaml`.
  - `kubectl rollout status deployment/board --timeout=10s; kubectl exec --pod-running-timeout=5s deployment/board -c worker -- wget -qO- -T 3 http://board:8080` — El rollout se completa y HTTP devuelve `north-68`.

  Mantén el registro de publicación release-commit de la estación de trabajo de acuerdo con el commit publicado.

phrases.0: Separé la sincronización del estado de la aplicación.
phrases.1: Reparé la confirmación de la fuente en lugar de luchar contra self-heal.
phrases.2: Verifiqué el revision observado y una respuesta real de HTTP.
questions.0.points.0: El deseado manifests puede describir fielmente un probe roto.
questions.0.points.1: Health depende del estado observado de workload.
questions.0.points.2: Pruebe readiness y el tráfico de servicio real.
questions.0.prompt: ¿Puede un Application ser Synced y aún no estar disponible?
questions.1.points.0: Cambie la fuente autorizada Git.
questions.1.points.1: Verifique el nuevo revision observado después de la conciliación.
questions.1.points.2: Evite depender de un patch transitorio en vivo.
questions.1.prompt: ¿Cuál es la reparación duradera cuando se habilita el self-heal automatizado?
