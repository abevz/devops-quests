title: Argo salud
brief: 'La versión `board` administrada mediante Git no está saludable para sus consumidores.


  Trabaja en la estación de trabajo en `~/quest` con `platform.env`, `application.yaml`, `repository/manifests/board.yaml`.


  **Requisitos:**

  - La Application `board` despliega la versión suministrada desde el repositorio Git privado.

  - La Application `board` indica `Synced` y `Healthy` para la versión publicada, restaura automáticamente el estado
  deseado de Git y elimina los recursos retirados de Git.

  - El Deployment `board` completa su rollout en el namespace de la bahía.

  - Dentro de un Pod del Deployment `board`, `http://board:8080` devuelve `north-68`.

  - El `origin/main` remoto y el registro de publicación de la estación de trabajo identifican el mismo descendiente
  nuevo de la versión original.

  - La versión publicada en Git y el Deployment `board` activo cumplen ambos el contrato de salud requerido del
  consumidor.


  La evidencia de setup en `/run/dq/facts/0/` en la workstation es autoritativa; los archivos correspondientes de
  `~/quest` son copias de trabajo.


  Entradas adicionales: `publication/index.html`, `publication/contract.json`, `publication-contract.json`.


  El servidor HTTP suministrado debe servir la publicación aprobada desde una proyección ConfigMap de solo lectura
  en su raíz de documentos. Los manifiestos Git publicados y la proyección activa deben coincidir; HTTP real debe
  mostrar los metadatos aprobados además del mensaje. Conserva las identidades de la Application y Deployment originales
  y la imagen suministrada. La referencia es el registro inicial congelado; los archivos de trabajo no lo sustituyen.'
debrief: Construiste la entrega de configuración gestionada por Git, reconciliaste el contrato de salud y verificaste
  la publicación real conservando las identidades.
stages.0.brief: La revisión Git publicada debe estar saludable para sus consumidores.
hints.0.text: La disponibilidad, la configuración entregada y una respuesta real describen aspectos distintos de
  la salud. Un proceso disponible puede seguir sirviendo una fuente anterior.
hints.1.text: |-
  Compara `publication-contract.json`, los archivos suministrados, los manifiestos confirmados, los montajes activos, la raíz de documentos, los eventos y las respuestas HTTP. Sigue qué datos llegan al proceso y qué ruta observa la comprobación de salud.

  Localiza los archivos públicos en los manifiestos de Git, la ruta de montaje y el directorio servido. Compara la ruta actual de disponibilidad con la respuesta y el registro de publicación.
hints.2.text: |-
  Verifica la revisión remota, los UID y la imagen originales, `/` y `/contract.json`, y compara los metadatos con el registro congelado. Conserva la ascendencia inicial.

  `kubectl get application board; kubectl rollout status deployment/board --timeout=10s; kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080/contract.json` — Se esperan Synced/Healthy, rollout completado y metadatos que coincidan con el registro congelado de publicación.

  Compara main remota, el registro de versión de la estación y la revisión observada de Application. Contrasta UID, imagen y publicación montada con el comprobante suministrado. La primera ruta HTTP devuelve `north-68`; la ruta de metadatos debe coincidir con el contrato aprobado.

  ```bash
  git -C repository ls-remote origin refs/heads/main
  cat release-commit
  jq '{applicationUID,deploymentUID,image,contract}' publication-contract.json
  kubectl get application/board deployment/board -o yaml
  kubectl rollout status deployment/board --timeout=10s
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080/
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080/contract.json
  ```
phrases.0: Separé la sincronización del estado de la aplicación.
phrases.1: Reparé la confirmación de la fuente en lugar de luchar contra self-heal.
phrases.2: Verifiqué el revision observado y una respuesta real de HTTP.
questions.0.points.0: El deseado manifests puede describir fielmente un probe roto.
questions.0.points.1: Health depende del estado observado de workload.
questions.0.points.2: Pruebe readiness y el tráfico de servicio real.
questions.0.prompt: ¿Puede un Application ser Synced y aún no estar disponible?
questions.1.points.0: Cambie la fuente autorizada Git.
questions.1.points.1: Verifique el nuevo revision observado después de la conciliación.
questions.1.points.2: Evite depender de un patch transitorio en vivo.
questions.1.prompt: ¿Cuál es la reparación duradera cuando se habilita el self-heal automatizado?
stages.0.objectives.0.text: La Application `board` despliega la versión suministrada desde el repositorio Git privado.
stages.0.objectives.1.text: La Application `board` indica `Synced` y `Healthy` para la versión publicada, restaura
  automáticamente el estado deseado de Git y elimina los recursos retirados de Git.
stages.0.objectives.2.text: El Deployment `board` completa su rollout en el namespace de la bahía.
stages.0.objectives.3.text: Dentro de un Pod del Deployment `board`, `http://board:8080` devuelve `north-68`.
stages.0.objectives.4.text: El `origin/main` remoto y el registro de publicación de la estación de trabajo identifican
  el mismo descendiente nuevo de la versión original.
stages.0.objectives.5.text: La versión publicada en Git y el Deployment `board` activo cumplen ambos el contrato
  de salud requerido del consumidor. La publicación aprobada se proyecta en modo de solo lectura en la raíz de documentos
  del servidor HTTP suministrado y se observa mediante HTTP, conservando las identidades de Application, Deployment
  e imagen.
diagnostics.git_source: Application puede seleccionar otro repositorio, rama o directorio; compare source con platform.env y manifests suministrado. [Causa y comprobación](guides#guide=gitops-delivery&section=health-application-git-source)
diagnostics.git_health: La versión puede seguir no saludable o sin sincronizar, o selfHeal/prune estar desactivados; compare estado Application, release-commit y automatización. [Causa y comprobación](guides#guide=gitops-delivery&section=health-synced-revision-and-automation)
diagnostics.git_rollout: La sonda readiness suministrada apunta a 9090; rollout puede fallar hasta que la carga de Git sirva la publicación declarada en 8080. [Causa y comprobación](guides#guide=gitops-delivery&section=health-git-declared-readiness)
diagnostics.git_http: La petición por Service puede fallar o devolver otra ruta; compare selector, disponibilidad de endpoints e index con la publicación suministrada. [Causa y comprobación](guides#guide=gitops-delivery&section=health-service-route-response)
diagnostics.git_descendant: Un parche solo vivo no publica una nueva revisión Git; publique un descendiente de la base fijada y ajuste release-commit a origin/main. [Causa y comprobación](guides#guide=gitops-delivery&section=health-published-descendant-commit)
diagnostics.probe_0_5: El comando worker, entorno o sondas health pueden diferir entre Git y live, o fallar rollout/HTTP anterior; errores de inicio también dejan este fallback. [Causa y comprobación](guides#guide=gitops-delivery&section=health-git-live-agreement-fallback)
diagnostics.publication_identity: Recrear Application o Deployment cambia un UID fijado; reconcilie los objetos originales conservando su identidad. [Causa y comprobación](guides#guide=gitops-delivery&section=health-retain-original-object-uids)
diagnostics.publication_source: Una revisión Application antigua, otro repositorio/image o editar ConfigMap solo live rompe concordancia; compare todos los data ConfigMap con Git. [Causa y comprobación](guides#guide=gitops-delivery&section=health-git-image-and-full-configmap-data)
diagnostics.publication_projection: El servidor HTTP puede servir su directorio generado en vez de claves ConfigMap aprobadas; siga mounts de Git y live hasta su raíz real. [Causa y comprobación](guides#guide=gitops-delivery&section=health-actual-http-root-projection)
diagnostics.publication_http: El contract.json observado puede contener otros campos; compare HTTP JSON con el contrato fijado tras reconciliar la fuente. [Causa y comprobación](guides#guide=gitops-delivery&section=health-public-http-contract-fields)
diagnostics.publication_budget: Un comando API, Git o contenedor puede exceder el tiempo de observación; revise la operación bloqueada antes de repetir. [Causa y comprobación](guides#guide=gitops-delivery&section=health-bounded-publication-observation)
diagnostics.publication_observation: Receipts ilegibles, manifiestos/JSON inválidos o fallos API/HTTP impiden observar; distíngalos de un contrato HTTP leído correctamente pero incorrecto. [Causa y comprobación](guides#guide=gitops-delivery&section=health-publication-input-and-api-errors)
