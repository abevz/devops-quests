title: Argo Gesundheit
brief: 'Der private Application kann synchronisieren, aber der festgeschriebene readiness probe zielt
  auf 9090, während HTTP auf 8080 lauscht. repository/manifests/board.json korrigieren, festschreiben
  und an den verfügbaren Gitea übertragen main verzweigen, dann Argo aktualisieren. Behalten Sie den "baseline-commit"-Verlauf
  bei. Synced allein reicht nicht aus: Der aufgezeichnete aktuelle revision muss zu Healthy werden und
  tatsächlich north-68 bedienen. Der Anwendungscontroller meldet möglicherweise kurz Progressing, während
  der fehlerhafte rollout wartet.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `platform.env`, `application.json`,
  `repository/manifests/board.json`, `repository/manifests/service.json`, `baseline-commit`, `release-commit`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Anfängliche Erfolgskriterien: Der korrigierte Git-Commit ist synchronisiert und Healthy, readiness verwendet
  8080 und der echte endpoint gibt north-68 zurück.


  Der maßgebliche Setup-Beweis ist unter `/run/dq/facts/0/` schreibgeschützt; übereinstimmende Dateien
  in `~/quest` sind Arbeitskopien.'
debrief: Git-Absicht und workload-Gesundheit stimmen jetzt überein; Ein direkter Live-patch wäre durch
  self-heal zurückgesetzt worden.
