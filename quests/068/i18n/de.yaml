title: Argo Gesundheit
brief: 'Die über Git verwaltete Version von `board` ist für ihre Verbraucher nicht gesund.


  Arbeiten Sie auf der Workstation in `~/quest` mit `platform.env`, `application.yaml`, `repository/manifests/board.yaml`.


  **Anforderungen:**

  - Application `board` stellt die mitgelieferte Version aus dem privaten Git-Repository bereit.

  - Application `board` meldet `Synced` und `Healthy` für die veröffentlichte Version, stellt den Git-Sollzustand
  automatisch wieder her und entfernt aus Git entfernte Ressourcen.

  - Deployment `board` schließt seinen Rollout im Bay-Namespace ab.

  - In einem Pod von Deployment `board` liefert `http://board:8080` den Wert `north-68`.

  - Das entfernte `origin/main` und der Veröffentlichungsnachweis auf der Workstation bezeichnen denselben neuen
  Nachfolger der ursprünglichen Version.

  - Die veröffentlichte Git-Version und das laufende Deployment `board` erfüllen beide den geforderten Zustandsvertrag
  des Verbrauchers.


  Setup-Belege unter `/run/dq/facts/0/` auf der Workstation sind maßgeblich; entsprechende Dateien in `~/quest`
  sind Arbeitskopien.


  Zusätzliche Eingaben: `publication/index.html`, `publication/contract.json`, `publication-contract.json`.


  Der bereitgestellte HTTP-Server muss die freigegebene Veröffentlichung aus einer schreibgeschützten ConfigMap-Projektion
  in seinem Dokumentenstamm ausliefern. Veröffentlichte Git-Manifeste und aktive Projektion müssen übereinstimmen;
  echtes HTTP muss neben dem Banner die freigegebenen Metadaten zeigen. Bewahre die Identitäten der ursprünglichen
  Application und des Deployments sowie das bereitgestellte Container-Image. Maßgeblich ist der eingefrorene Ausgangsbeleg;
  Arbeitsdateien ersetzen ihn nicht.'
debrief: Du hast Git-gesteuerte Konfigurationslieferung aufgebaut, den Gesundheitsvertrag abgeglichen und die tatsächliche
  Veröffentlichung bei erhaltenen Identitäten geprüft.
stages.0.brief: Die veröffentlichte Git-Revision muss für ihre Verbraucher gesund sein.
hints.0.text: Bereitschaft, gelieferte Konfiguration und eine echte Anwendungsantwort beschreiben verschiedene Aspekte
  der Gesundheit. Ein bereiter Prozess kann weiterhin eine ältere Quelle ausliefern.
hints.1.text: Vergleiche `publication-contract.json`, bereitgestellte Veröffentlichungsdateien, eingecheckte Manifeste,
  aktive Mounts, Dokumentenstamm, Ereignisse und HTTP-Antworten. Verfolge, welche Daten den Prozess erreichen und
  welchen Pfad die Gesundheitsprüfung beobachtet.
hints.2.text: 'Erstelle die ConfigMap-Veröffentlichung und ihre schreibgeschützte Projektion im Dokumentenstamm
  des bereitgestellten Servers; richte die Gesundheitsprüfung am tatsächlichen Dienst aus. Führe Commit und Push
  aus, aktualisiere den Veröffentlichungsbeleg und aktualisiere Argo. Prüfe entfernte Revision, ursprüngliche UIDs
  und Image, `/` und `/contract.json` und vergleiche Metadaten mit dem eingefrorenen Beleg. Bewahre die Ausgangsrevision
  in der Historie.


  `kubectl get application board; kubectl rollout status deployment/board --timeout=10s; kubectl exec deployment/board
  -c worker -- wget -qO- -T 3 http://board:8080/contract.json` — Erwartet werden Synced/Healthy, ein abgeschlossener
  Rollout und Metadaten passend zum eingefrorenen Veröffentlichungsbeleg.'
phrases.0: Ich habe die Synchronisierung vom Anwendungszustand getrennt.
phrases.1: Ich habe das Quell-Commit repariert, anstatt gegen self-heal zu kämpfen.
phrases.2: Ich habe die beobachtete revision- und eine echte HTTP-Antwort verifiziert.
questions.0.points.0: Der gewünschte manifests kann einen kaputten probe getreu beschreiben.
questions.0.points.1: Health hängt vom beobachteten workload-Status ab.
questions.0.points.2: Testen Sie readiness und echten Serviceverkehr.
questions.0.prompt: Kann ein Application Synced sein und immer noch nicht verfügbar?
questions.1.points.0: Ändern Sie die maßgebliche Git-Quelle.
questions.1.points.1: Überprüfen Sie nach dem Abgleich den neuen beobachteten revision.
questions.1.points.2: Vermeiden Sie es, sich auf einen vorübergehenden, aktiven patch zu verlassen.
questions.1.prompt: Was ist die dauerhafte Reparatur, wenn die automatisierte self-heal aktiviert ist?
stages.0.objectives.0.text: Application `board` stellt die mitgelieferte Version aus dem privaten Git-Repository
  bereit.
stages.0.objectives.1.text: Application `board` meldet `Synced` und `Healthy` für die veröffentlichte Version, stellt
  den Git-Sollzustand automatisch wieder her und entfernt aus Git entfernte Ressourcen.
stages.0.objectives.2.text: Deployment `board` schließt seinen Rollout im Bay-Namespace ab.
stages.0.objectives.3.text: In einem Pod von Deployment `board` liefert `http://board:8080` den Wert `north-68`.
stages.0.objectives.4.text: Das entfernte `origin/main` und der Veröffentlichungsnachweis auf der Workstation bezeichnen
  denselben neuen Nachfolger der ursprünglichen Version.
stages.0.objectives.5.text: Die veröffentlichte Git-Version und das laufende Deployment `board` erfüllen beide den
  geforderten Zustandsvertrag des Verbrauchers. Die freigegebene Veröffentlichung wird schreibgeschützt in den Dokumentenstamm
  des bereitgestellten HTTP-Servers projiziert und über HTTP beobachtet; ursprüngliche Application-, Deployment-
  und Image-Identitäten bleiben erhalten.
diagnostics.git_source: Application wählt möglicherweise ein anderes Repository, einen anderen Branch oder Manifestordner; vergleichen Sie source mit platform.env und geliefertem manifests. [Ursache und Prüfung](guides#guide=gitops-delivery&section=health-application-git-source)
diagnostics.git_health: Das Release ist möglicherweise noch nicht gesund oder synchronisiert, oder selfHeal/prune sind deaktiviert; vergleichen Sie Application Status, release-commit und Automatisierung. [Ursache und Prüfung](guides#guide=gitops-delivery&section=health-synced-revision-and-automation)
diagnostics.git_rollout: Die gelieferte Readiness-Probe zeigt auf 9090; der Rollout kann scheitern, bis die Git-Workload die deklarierte Veröffentlichung auf 8080 ausliefert. [Ursache und Prüfung](guides#guide=gitops-delivery&section=health-git-declared-readiness)
diagnostics.git_http: Die Service-Anfrage kann scheitern oder eine andere Route liefern; vergleichen Sie selector, bereite Endpoints und index mit der gelieferten Veröffentlichung. [Ursache und Prüfung](guides#guide=gitops-delivery&section=health-service-route-response)
diagnostics.git_descendant: Ein reiner Live-Patch veröffentlicht keine neue Git-Revision; pushen Sie einen Nachfolger der eingefrorenen Basis und gleichen Sie release-commit mit origin/main ab. [Ursache und Prüfung](guides#guide=gitops-delivery&section=health-published-descendant-commit)
diagnostics.probe_0_5: worker Befehl, Umgebung oder Health-Probes können zwischen Git und live abweichen, oder die ältere Rollout-/HTTP-Prüfung scheitert; auch Startfehler ergeben diesen Fallback. [Ursache und Prüfung](guides#guide=gitops-delivery&section=health-git-live-agreement-fallback)
diagnostics.publication_identity: Neuanlegen von Application oder Deployment ändert eine eingefrorene UID; korrigieren Sie die ursprünglichen Objekte unter Erhalt ihrer Identität. [Ursache und Prüfung](guides#guide=gitops-delivery&section=health-retain-original-object-uids)
diagnostics.publication_source: Eine alte Application Revision, anderes Repository/image oder eine reine Live-Änderung an ConfigMap verletzt die Übereinstimmung; vergleichen Sie sämtliche ConfigMap data mit Git. [Ursache und Prüfung](guides#guide=gitops-delivery&section=health-git-image-and-full-configmap-data)
diagnostics.publication_projection: Der HTTP-Server bedient möglicherweise sein erzeugtes Verzeichnis statt freigegebener ConfigMap Schlüssel; verfolgen Sie Git- und Live-Mounts bis zu seinem tatsächlichen Dokumentstamm. [Ursache und Prüfung](guides#guide=gitops-delivery&section=health-actual-http-root-projection)
diagnostics.publication_http: Das beobachtete contract.json kann andere Veröffentlichungsfelder enthalten; vergleichen Sie HTTP JSON nach dem Quellenabgleich mit dem eingefrorenen Vertrag. [Ursache und Prüfung](guides#guide=gitops-delivery&section=health-public-http-contract-fields)
diagnostics.publication_budget: Ein API-, Git- oder Containerbefehl kann das Beobachtungszeitlimit überschreiten; untersuchen Sie die blockierte Operation vor der erneuten Prüfung. [Ursache und Prüfung](guides#guide=gitops-delivery&section=health-bounded-publication-observation)
diagnostics.publication_observation: Unlesbare Receipts, ungültige Manifeste/JSON oder fehlgeschlagene API-/HTTP-Anfragen verhindern die Beobachtung; unterscheiden Sie dies von einem erfolgreich gelesenen, aber falschen HTTP-Vertrag. [Ursache und Prüfung](guides#guide=gitops-delivery&section=health-publication-input-and-api-errors)
