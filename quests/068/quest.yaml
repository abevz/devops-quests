id: 68
title: title
track: Platform
difficulty: complex
brief: brief
stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    check: |-
      source platform.env
      kubectl get application board -o json | jq -e --arg rev "$(cat release-commit)" --arg url "$GIT_URL" '.spec.source.repoURL==$url and .spec.source.path=="manifests" and .spec.source.targetRevision=="main"' >/dev/null
  - text: stages.0.objectives.1.text
    check: |-
      source platform.env
      kubectl get application board -o json | jq -e --arg rev "$(cat release-commit)" --arg url "$GIT_URL" '.status.sync.status=="Synced" and .status.health.status=="Healthy" and .status.sync.revision==$rev' >/dev/null
      kubectl get application board -o json | jq -e '.spec.syncPolicy.automated.selfHeal==true and .spec.syncPolicy.automated.prune==true' >/dev/null
  - text: stages.0.objectives.2.text
    check: kubectl rollout status deployment/board --timeout=3s >/dev/null
  - text: stages.0.objectives.3.text
    check: test "$(kubectl exec deployment/board -- wget -qO- -T 3 http://board:8080)" = north-68
  - text: stages.0.objectives.4.text
    check: |-
      source platform.env
      git -C repository fetch origin main >/dev/null 2>&1
      test "$(git -C repository rev-parse origin/main)" = "$(cat release-commit)"
      git -C repository merge-base --is-ancestor "$(cat /run/dq/facts/0/baseline-commit)" origin/main
      test "$(git -C repository rev-parse origin/main)" != "$(cat /run/dq/facts/0/baseline-commit)"
  - text: stages.0.objectives.5.text
    check: |-
      kubectl get deployment board -o json | jq -e '.spec.template.spec.containers[0].readinessProbe.httpGet.port==8080' >/dev/null
      git -C repository show origin/main:manifests/board.yaml | python3 -c 'import json,sys,yaml; json.dump(yaml.safe_load(sys.stdin),sys.stdout)' | jq -e '.spec.template.spec.containers[0].readinessProbe.httpGet.port==8080' >/dev/null
hints:
- text: hints.0.text
  guide: gitops-delivery
- text: hints.1.text
  guide: gitops-delivery
- text: hints.2.text
  guide: gitops-delivery
debrief: debrief
phrases:
- phrases.0
- phrases.1
- phrases.2
questions:
- prompt: questions.0.prompt
  points:
  - questions.0.points.0
  - questions.0.points.1
  - questions.0.points.2
- prompt: questions.1.prompt
  points:
  - questions.1.points.0
  - questions.1.points.1
  - questions.1.points.2
facts:
  environment:
  - DQ_NAMESPACE
  - DQ_APP_IMAGE
  - KUBECONFIG
  - TF_CLI_CONFIG_FILE
  files:
  - platform.env
  - application.yaml
  - repository/manifests/board.yaml
  - repository/manifests/service.yaml
  - baseline-commit
  - release-commit
  services: []
book:
  chapter: 11
  section: Synchronization and health
  topics:
  - argocd
  - gitops
  - readiness
immutable:
  0:
  - baseline-commit
