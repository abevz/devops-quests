id: 68
title: title
track: Platform
difficulty: complex
brief: brief
stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    check: 'source platform.env

      kubectl get application board -o json | jq -e --arg rev "$(cat release-commit)" --arg url "$GIT_URL"
      ''.spec.source.repoURL==$url and .spec.source.path=="manifests" and .spec.source.targetRevision=="main"
      and .status.sync.status=="Synced" and .status.health.status=="Healthy" and .status.sync.revision==$rev''
      >/dev/null

      kubectl rollout status deployment/board --timeout=3s >/dev/null

      test "$(kubectl exec deployment/board -- wget -qO- -T 3 http://board:8080)" = north-68

      git -C repository fetch origin main >/dev/null 2>&1

      test "$(git -C repository rev-parse origin/main)" = "$(cat release-commit)"

      git -C repository merge-base --is-ancestor "$(cat /run/dq/facts/0/baseline-commit)" origin/main

      kubectl get deployment board -o json | jq -e ''.spec.template.spec.containers[0].readinessProbe.httpGet.port==8080''
      >/dev/null

      test "$(git -C repository rev-parse origin/main)" != "$(cat /run/dq/facts/0/baseline-commit)"

      git -C repository show origin/main:manifests/board.json | jq -e ''.spec.template.spec.containers[0].readinessProbe.httpGet.port==8080''
      >/dev/null

      kubectl get application board -o json | jq -e ''.spec.syncPolicy.automated.selfHeal==true and .spec.syncPolicy.automated.prune==true''
      >/dev/null'
