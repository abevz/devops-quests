diagnostics.command: CoreDNS startet möglicherweise mit seiner Standardkonfiguration oder einer anderen Datei. Prüfen Sie Programm und Argumente im Worker-Container auf /etc/station/Corefile. [Ursache und Prüfung](guides#guide=private-dns&section=q105-resolver-corefile-command)
diagnostics.ports: Am Service-Port fehlt möglicherweise ein DNS-Protokoll oder er verweist auf den falschen Listener. Prüfen Sie TCP und UDP auf Port 53, jeweils mit numerischem oder benanntem Zielport 1053. [Ursache und Prüfung](guides#guide=private-dns&section=q105-resolver-service-ports)
diagnostics.core: Das gelieferte Corefile verweist für north.station.internal möglicherweise noch auf Loopback oder der Resolver hat die Änderung möglicherweise nicht geladen. Fragen Sie station-dns direkt ab und vergleichen Sie die Antwort mit der Adresse von board. [Ursache und Prüfung](guides#guide=private-dns&section=q105-configured-resolver-answer)
diagnostics.dns_policy: Die Vorlage des Deployments client verwendet möglicherweise wieder die Cluster-DNS-Richtlinie. Prüfen Sie dnsPolicy und behalten Sie None für die gelieferte Nameserver-Konfiguration bei. [Ursache und Prüfung](guides#guide=private-dns&section=q105-client-dns-policy)
diagnostics.nameserver: Beim Deployment client stehen möglicherweise noch eine alte Adresse oder zusätzliche Resolver. Vergleichen Sie nameservers mit der aktuellen ClusterIP von station-dns und behalten Sie nur diese Adresse. [Ursache und Prüfung](guides#guide=private-dns&section=q105-client-nameserver-address)
diagnostics.answer: Trotz korrekter Konfiguration kann client vom ausdrücklich gewählten Resolver eine falsche oder keine Antwort erhalten. Prüfen Sie die Adresse für north.station.internal aus dem Pod client. [Ursache und Prüfung](guides#guide=private-dns&section=q105-client-explicit-dns-answer)
diagnostics.http: Die DNS-Antwort kann stimmen, obwohl der Service oder Endpoint nicht bereit ist oder anderen Inhalt liefert. Rufen Sie den Namen aus client auf und vergleichen Sie die Antwort mit north-105. [Ursache und Prüfung](guides#guide=private-dns&section=q105-client-hostname-http)
diagnostics.probe_0_0: Die Resolver-Prüfung kann vor der Meldung einer Bedingung abbrechen, wenn Werkzeuge oder Eingaben fehlschlagen. Prüfen Sie zuerst Werkzeuge und Zugriff auf die Resolver-Ressourcen. [Ursache und Prüfung](guides#guide=private-dns&section=q105-resolver-observer-input)
