title: CoreDNS-Konfiguration
brief: |-
  Die Route ist über ihren privaten DNS-Namen nicht erreichbar. Stellen Sie konsistente private Namensauflösung und die geforderte HTTP-Antwort her.

  Arbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte Dateien: `dns-config.yaml`, `dns.yaml`, `dns-service.yaml`, `client.yaml`.

  **Anforderungen:**
  - Der bestehende private Resolver bedient `north.station.internal` mit seiner mitgelieferten CoreDNS-Laufzeit und ausschließlich der mitgelieferten DNS-Erreichbarkeit.
  - Deployment `client` verwendet ausschließlich den bestehenden privaten DNS-Resolver.
  - Von Deployment `client` wird `north.station.internal` zur vollständigen Adresse des vorgesehenen privaten Anwendungs-Service aufgelöst.
  - Von `deployment/client` liefert HTTP `http://north.station.internal:8080` den Wert `north-105`.

  Geprüft werden aktuelle Konfiguration und Antworten, nicht früher geänderte Objekte.
debrief: Die Prüfungen beobachteten die private DNS-Konfiguration und namensbasierten Verkehr.
stages.0.brief: Privates DNS und Anwendungsantwort müssen dem bereitgestellten Adressvertrag entsprechen.
hints.0.text: Erfolgreicher direkter IP-Verkehr beweist nicht, dass DNS funktioniert.
hints.1.text: 'Dieser client verwendet den privaten DNS Service anstelle des Cluster-Standards.


  Prüfen Sie die mitgelieferten Definitionen, aktuellen Ressourcen und Ereignisse.


  ```sh

  cat dns-config.yaml

  kubectl get deployment station-dns client -o yaml

  kubectl get service station-dns -o yaml

  kubectl get configmap station-dns -o yaml

  ```'
hints.2.text: |-
  Korrigieren Sie den hosts-Eintrag anhand der eingefrorenen Service-IP und laden Sie nur den privaten Klon neu. Starten Sie nach dem ConfigMap-Update nur deployment/station-dns neu und warten Sie auf den Rollout; DNS-Verbreitung kann dauern.

  Prüfen Sie das beobachtete Ergebnis:

  ```sh
  kubectl exec deployment/client -- nslookup north.station.internal
  kubectl exec deployment/client -- wget -qO- -T 3 http://north.station.internal:8080
  ```

  Erwartet werden die vollständige Adresse des privaten Anwendungs-Service in der DNS-Antwort und die HTTP-Antwort north-105.

  Mitgelieferte Einschränkungen und Details: Der private Resolver `station-dns` führt CoreDNS mit `/etc/station/Corefile` im DNS-Container aus, liefert den geforderten Eintrag `north.station.internal` und stellt nur TCP/UDP `53` nach `1053` bereit. Deployment `client` nutzt DNS-Richtlinie `None` und nur die Service-IP von `station-dns` als Resolver. Die DNS-Abfrage aus Deployment `client` für `north.station.internal` enthält die vollständige Adresse aus `/run/dq/facts/0/expected-dns-address` auf der Workstation.
phrases.0: Ich habe die Namensauflösung von der Transporterreichbarkeit getrennt.
phrases.1: Ich habe den client DNS policy überprüft, bevor ich einen resolver ausgetauscht habe.
phrases.2: Ich habe lookup und den Anwendungsverkehr über denselben Hostnamen überprüft.
questions.0.points.0: Das DNS-Mapping oder das client resolver können unabhängig vom Transport falsch sein.
questions.0.points.1: Vergleichen Sie den tatsächlichen resolver, die Antwort und die Anwendung endpoint.
questions.0.prompt: Warum kann der direkte IP funktionieren, während der hostname ausfällt?
questions.1.points.0: Dateien werden möglicherweise irgendwann aktualisiert, der Prozess muss sie jedoch erneut
  lesen.
questions.1.points.1: Umgebungsvariablen und subPath mounts haben ein unterschiedliches Aktualisierungsverhalten.
questions.1.prompt: Lädt die Änderung eines geplanten ConfigMap automatisch jede Anwendung neu?
