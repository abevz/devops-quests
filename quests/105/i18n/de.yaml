title: CoreDNS-Konfiguration
brief: 'Arbeite in `~/quest` mit `components.env`, `dns-config.json`, `dns.json`, `dns-service.json`, `client.json`, `expected-dns-address`
  und `Corefile`. Diese Umgebung hat einen privaten CoreDNS-Klon. DNS übersetzt Namen in Adressen; das Plugin `hosts` und
  `ttl` steuern den Eintrag und die Cache-Dauer. Korrigiere `north.station.internal` auf die Adresse aus `expected-dns-address`.
  Behalte die genaue Corefile-Struktur (`errors`, ein `hosts`-Block, `ttl 1`, Listener 1053) ohne zusätzliche Direktiven.
  Behalte den DNS-Containerbefehl aus `dns.json` und genau die TCP- und UDP-Service-Ports 53 auf 1053 aus `dns-service.json`.
  Der Client aus `client.json` muss `dnsPolicy: None` und genau die IP des privaten DNS-Service als Nameserver nutzen.


  Starte nach der ConfigMap-Änderung nur `deployment/station-dns` neu und warte auf den Rollout; die DNS-Verteilung kann dauern.
  Prüfe vom Client, dass die DNS-Antwort die vollständige erwartete Adresse enthält und `http://north.station.internal:8080`
  `north-105` liefert. Die Prüfungen beobachten aktuelle Konfiguration und Antworten, nicht welche Objekte zuvor geändert
  wurden. Nutze nur die Offline-Umgebung.'
debrief: Die Prüfungen beobachteten die private DNS-Konfiguration und namensbasierten Verkehr.
stages.0.brief: Private DNS-Konfiguration, Client-Nameserver, Abfrage und HTTP-Antwort entsprechen der Beschreibung.
stages.0.objectives.0.text: Private DNS-Konfiguration, Client-Nameserver, Abfrage und HTTP-Antwort entsprechen der Beschreibung.
hints.0.text: Erfolgreicher direkter IP-Verkehr beweist nicht, dass DNS funktioniert.
hints.1.text: Dieser client verwendet den privaten DNS Service anstelle des Cluster-Standards.
hints.2.text: Korrigieren Sie den hosts record aus dem eingefrorenen Service IP und laden Sie nur den privaten Klon neu.
phrases.0: Ich habe die Namensauflösung von der Transporterreichbarkeit getrennt.
phrases.1: Ich habe den client DNS policy überprüft, bevor ich einen resolver ausgetauscht habe.
phrases.2: Ich habe lookup und den Anwendungsverkehr über denselben Hostnamen überprüft.
questions.0.points.0: Das DNS-Mapping oder das client resolver können unabhängig vom Transport falsch sein.
questions.0.points.1: Vergleichen Sie den tatsächlichen resolver, die Antwort und die Anwendung endpoint.
questions.0.prompt: Warum kann der direkte IP funktionieren, während der hostname ausfällt?
questions.1.points.0: Dateien werden möglicherweise irgendwann aktualisiert, der Prozess muss sie jedoch erneut lesen.
questions.1.points.1: Umgebungsvariablen und subPath mounts haben ein unterschiedliches Aktualisierungsverhalten.
questions.1.prompt: Lädt die Änderung eines geplanten ConfigMap automatisch jede Anwendung neu?
