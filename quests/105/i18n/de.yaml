title: CoreDNS-Konfiguration
brief: "Die Route ist über ihren privaten DNS-Namen nicht erreichbar. Stellen Sie konsistente private Namensauflösung\
  \ und die geforderte HTTP-Antwort her.\n\nArbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte Dateien:\
  \ `dns-config.json`, `dns.json`, `dns-service.json`, `client.json`, `expected-dns-address`.\n\n**Anforderungen:**\n\
  - Der private Resolver `station-dns` führt CoreDNS mit `/etc/station/Corefile` im DNS-Container aus, liefert den\
  \ geforderten Eintrag `north.station.internal` und stellt nur TCP/UDP `53` nach `1053` bereit.\n  - Der DNS-Corefile-Vertrag\
  \ enthält Listener `1053`, `errors`, einen `hosts`-Block für die geschützte erwartete Adresse und TTL `1`, ohne\
  \ zusätzliche Direktiven.\n- Deployment `client` nutzt DNS-Richtlinie `None` und nur die Service-IP von `station-dns`\
  \ als Resolver.\n- Die DNS-Abfrage aus Deployment `client` für `north.station.internal` enthält die vollständige\
  \ Adresse aus `/run/dq/facts/0/expected-dns-address` auf der Workstation.\n- Von `deployment/client` liefert HTTP\
  \ `http://north.station.internal:8080` den Wert `north-105`.\n\n**Vor Check & finish selbst prüfen:**\nFühren\
  \ Sie diese Beobachtungsbefehle in `~/quest` auf der Workstation aus; `kubectl exec` beobachtet den Container\
  \ des genannten Workloads.\n- Die Antwort enthält die vollständige erwartete Adresse.\n\n  ```sh\n  kubectl exec\
  \ deployment/client -- nslookup north.station.internal\n  cat /run/dq/facts/0/expected-dns-address\n  ```\n- `kubectl\
  \ exec deployment/client -- wget -qO- -T 3 http://north.station.internal:8080` — Der Verbraucher erhält `north-105`.\n\
  - Einstellungen, Identität und Status entsprechen den Anforderungen.\n\n  ```sh\n  kubectl get deployment station-dns\
  \ client -o yaml\n  kubectl get service station-dns -o yaml\n  kubectl get configmap station-dns -o yaml\n  ```\n\
  \nGeprüft werden aktuelle Konfiguration und Antworten, nicht früher geänderte Objekte.\n"
debrief: Die Prüfungen beobachteten die private DNS-Konfiguration und namensbasierten Verkehr.
stages.0.brief: 'Privates DNS und Anwendungsantwort müssen dem bereitgestellten Adressvertrag entsprechen.

  '
hints.0.text: Erfolgreicher direkter IP-Verkehr beweist nicht, dass DNS funktioniert.
hints.1.text: Dieser client verwendet den privaten DNS Service anstelle des Cluster-Standards.
hints.2.text: 'Korrigieren Sie den hosts-Eintrag anhand der eingefrorenen Service-IP und laden Sie nur den privaten
  Klon neu. Starten Sie nach dem ConfigMap-Update nur deployment/station-dns neu und warten Sie auf den Rollout;
  DNS-Verbreitung kann dauern.

  '
phrases.0: Ich habe die Namensauflösung von der Transporterreichbarkeit getrennt.
phrases.1: Ich habe den client DNS policy überprüft, bevor ich einen resolver ausgetauscht habe.
phrases.2: Ich habe lookup und den Anwendungsverkehr über denselben Hostnamen überprüft.
questions.0.points.0: Das DNS-Mapping oder das client resolver können unabhängig vom Transport falsch sein.
questions.0.points.1: Vergleichen Sie den tatsächlichen resolver, die Antwort und die Anwendung endpoint.
questions.0.prompt: Warum kann der direkte IP funktionieren, während der hostname ausfällt?
questions.1.points.0: Dateien werden möglicherweise irgendwann aktualisiert, der Prozess muss sie jedoch erneut
  lesen.
questions.1.points.1: Umgebungsvariablen und subPath mounts haben ein unterschiedliches Aktualisierungsverhalten.
questions.1.prompt: Lädt die Änderung eines geplanten ConfigMap automatisch jede Anwendung neu?
diagnostics.command: station-dns command muss /coredns -conf /etc/station/Corefile entsprechen.
diagnostics.ports: station-dns ports muss TCP/UDP 53 → 1053 entsprechen.
diagnostics.core: Der Corefile von station-dns muss nach Normalisierung des Leerraums der geforderten Struktur,
  Adresse, dem Port und TTL entsprechen.
diagnostics.dns_policy: deployment/client dnsPolicy muss None entsprechen.
diagnostics.nameserver: deployment/client nameservers muss [station-dns Service IP] entsprechen.
diagnostics.answer: Die DNS-Antwort von north.station.internal muss expected-dns-address enthalten.
diagnostics.http: Die Anfrage an north.station.internal:8080 muss north-105 liefern.
