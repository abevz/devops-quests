title: CoreDNS-Konfiguration
brief: 'Ein privater CoreDNS-Klon bedient nur diesen Schacht. Sein hosts record verweist auf north.station.internal
  auf loopback anstelle des board Service. client verwendet explizit dieses DNS Service bis dnsPolicy:
  Keine. Reparieren Sie den hosts record zum eingefrorenen expected-dns-address, behalten Sie Port 1053
  und TTL 1 bei und starten Sie dann nur station-dns neu, damit der ConfigMap neu geladen wird. Überprüfen
  Sie eine tatsächliche DNS lookup- und HTTP-Anfrage von client. Bearbeiten Sie nicht kube-system CoreDNS,
  Cluster DNS oder externes resolvers.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `components.env`, `dns-config.json`,
  `dns.json`, `dns-service.json`, `client.json`, `expected-dns-address`, `Corefile`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Anfängliche Erfolgskriterien: Der benutzerdefinierte DNS Service löst die Adresse board auf und client
  erreicht north-105 über diesen hostname; Cluster DNS bleibt außerhalb der Übung.'
debrief: Eine bereichsbezogene DNS-Konfiguration wurde repariert und durch echten namensbasierten Datenverkehr
  überprüft.
stages.0.brief: 'Erfolgskriterien: Der benutzerdefinierte DNS Service löst die board-Adresse auf und client
  erreicht north-105 über diesen hostname; Cluster DNS bleibt außerhalb der Übung.'
stages.0.objectives.0.text: Der benutzerdefinierte DNS Service löst die board-Adresse auf und client erreicht
  north-105 über diesen hostname; Cluster DNS bleibt außerhalb der Übung.
hints.0.text: Erfolgreicher direkter IP-Verkehr beweist nicht, dass DNS funktioniert.
hints.1.text: Dieser client verwendet den privaten DNS Service anstelle des Cluster-Standards.
hints.2.text: Korrigieren Sie den hosts record aus dem eingefrorenen Service IP und laden Sie nur den
  privaten Klon neu.
phrases.0: Ich habe die Namensauflösung von der Transporterreichbarkeit getrennt.
phrases.1: Ich habe den client DNS policy überprüft, bevor ich einen resolver ausgetauscht habe.
phrases.2: Ich habe lookup und den Anwendungsverkehr über denselben Hostnamen überprüft.
questions.0.points.0: Das DNS-Mapping oder das client resolver können unabhängig vom Transport falsch
  sein.
questions.0.points.1: Vergleichen Sie den tatsächlichen resolver, die Antwort und die Anwendung endpoint.
questions.0.prompt: Warum kann der direkte IP funktionieren, während der hostname ausfällt?
questions.1.points.0: Dateien werden möglicherweise irgendwann aktualisiert, der Prozess muss sie jedoch
  erneut lesen.
questions.1.points.1: Umgebungsvariablen und subPath mounts haben ein unterschiedliches Aktualisierungsverhalten.
questions.1.prompt: Lädt die Änderung eines geplanten ConfigMap automatisch jede Anwendung neu?
