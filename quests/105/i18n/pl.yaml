title: Konfiguracja CoreDNS
brief: 'Prywatny klon CoreDNS obsługuje tylko tę zatokę. Jego hosts record wskazuje north.station.internal
  na loopback zamiast board Service. client jawnie używa tego DNS Service do dnsPolicy: None. Napraw hosts
  record na zamrożonym expected-dns-address, zachowaj port 1053 i TTL 1, a następnie uruchom ponownie
  tylko station-dns, aby ponownie załadować ConfigMap. Zweryfikuj rzeczywiste żądanie DNS lookup i HTTP
  z client. Nie edytuj kube-system CoreDNS, klastra DNS ani zewnętrznego resolvers.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `components.env`, `dns-config.json`,
  `dns.json`, `dns-service.json`, `client.json`, `expected-dns-address`, `Corefile`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: niestandardowy DNS Service rozpoznaje adres board, a client osiąga north-105
  poprzez ten hostname; klaster DNS pozostaje poza ćwiczeniem.'
debrief: Naprawiono i zweryfikowano konfigurację DNS o określonym zakresie poprzez ruch oparty na prawdziwych
  nazwach.
stages.0.brief: 'Kryteria sukcesu: Niestandardowy DNS Service rozpoznaje adres board, a client osiąga
  north-105 poprzez ten hostname; klaster DNS pozostaje poza ćwiczeniem.'
stages.0.objectives.0.text: Niestandardowy DNS Service rozpoznaje adres board, a client osiąga north-105
  przez ten hostname; klaster DNS pozostaje poza ćwiczeniem.
hints.0.text: Pomyślny bezpośredni ruch IP nie dowodzi, że DNS działa.
hints.1.text: Ten client używa prywatnego DNS Service zamiast domyślnego klastra.
hints.2.text: Popraw hosts record z zamrożonego Service IP i załaduj ponownie tylko prywatny klon.
phrases.0: Oddzieliłem rozpoznawanie nazw od osiągalności transportu.
phrases.1: Sprawdziłem client DNS policy przed zmianą resolver.
phrases.2: Zweryfikowałem ruch lookup i aplikacji za pośrednictwem tej samej nazwy hosta.
questions.0.points.0: Mapowanie DNS lub client resolver może być błędny niezależnie od transportu.
questions.0.points.1: Porównaj aktualny resolver, odpowiedź i aplikację endpoint.
questions.0.prompt: Dlaczego bezpośredni IP może działać, podczas gdy hostname zawodzi?
questions.1.points.0: Pliki mogą w końcu zostać odświeżone, ale proces musi je ponownie odczytać.
questions.1.points.1: Zmienne środowiskowe i subPath mounts mają różne zachowanie podczas aktualizacji.
questions.1.prompt: Czy zmiana projektowanego ConfigMap powoduje automatyczne ponowne załadowanie każdej
  aplikacji?
