title: Konfiguracja CoreDNS
brief: "Trasa jest niedostępna przez prywatną nazwę DNS. Przywróć spójne prywatne rozwiązywanie nazw i wymaganą\
  \ odpowiedź HTTP.\n\nPracuj w `~/quest` na workstation. Dostarczone pliki: `dns-config.json`, `dns.json`, `dns-service.json`,\
  \ `client.json`, `expected-dns-address`.\n\n**Wymagania:**\n- Deployment `station-dns` uruchamia CoreDNS z `/etc/station/Corefile`\
  \ wewnątrz kontenera DNS.\n- Service `station-dns` udostępnia tylko port `53` TCP i UDP, oba do portu docelowego\
  \ `1053`.\n- ConfigMap `station-dns` zachowuje dostarczoną strukturę Corefile:\n  - listener `1053`, `errors`,\
  \ jeden blok `hosts` dla `north.station.internal` z chronionym oczekiwanym adresem i TTL `1`.\n- Deployment `client`:\n\
  \  - zasada DNS `None`.\n- Deployment `client` używa wyłącznie IP Service `station-dns` jako nameserver.\n- Zapytanie\
  \ DNS z Deployment `client` o `north.station.internal` zawiera pełny adres z `/run/dq/facts/0/expected-dns-address`\
  \ na workstation.\n- Z `deployment/client` HTTP `http://north.station.internal:8080` zwraca `north-105`.\n\n**Sprawdź\
  \ samodzielnie przed Check & finish:**\nWykonuj te polecenia obserwacyjne w `~/quest` na workstation; `kubectl\
  \ exec` obserwuje kontener wskazanego obciążenia.\n- Odpowiedź zawiera pełny oczekiwany adres.\n\n  ```sh\n  kubectl\
  \ exec deployment/client -- nslookup north.station.internal\n  cat /run/dq/facts/0/expected-dns-address\n  ```\n\
  - `kubectl exec deployment/client -- wget -qO- -T 3 http://north.station.internal:8080` — Odbiorca otrzymuje `north-105`.\n\
  - Ustawienia, tożsamość i status odpowiadają wymaganiom.\n\n  ```sh\n  kubectl get deployment station-dns client\
  \ -o yaml\n  kubectl get service station-dns -o yaml\n  kubectl get configmap station-dns -o yaml\n  ```\n\nSprawdzana\
  \ jest bieżąca konfiguracja i odpowiedzi, nie to, które obiekty zmieniono wcześniej.\n"
debrief: Kontrole sprawdziły prywatną konfigurację DNS i ruch oparty na nazwie.
stages.0.brief: 'Prywatny DNS i odpowiedź aplikacji mają odpowiadać dostarczonemu kontraktowi adresu.

  '
hints.0.text: Pomyślny bezpośredni ruch IP nie dowodzi, że DNS działa.
hints.1.text: Ten client używa prywatnego DNS Service zamiast domyślnego klastra.
hints.2.text: 'Popraw wpis hosts według zamrożonego IP Service i przeładuj tylko prywatny klon. Po aktualizacji
  ConfigMap uruchom ponownie tylko deployment/station-dns i poczekaj na rollout; propagacja DNS może potrwać.

  '
phrases.0: Oddzieliłem rozpoznawanie nazw od osiągalności transportu.
phrases.1: Sprawdziłem client DNS policy przed zmianą resolver.
phrases.2: Zweryfikowałem ruch lookup i aplikacji za pośrednictwem tej samej nazwy hosta.
questions.0.points.0: Mapowanie DNS lub client resolver może być błędny niezależnie od transportu.
questions.0.points.1: Porównaj aktualny resolver, odpowiedź i aplikację endpoint.
questions.0.prompt: Dlaczego bezpośredni IP może działać, podczas gdy hostname zawodzi?
questions.1.points.0: Pliki mogą w końcu zostać odświeżone, ale proces musi je ponownie odczytać.
questions.1.points.1: Zmienne środowiskowe i subPath mounts mają różne zachowanie podczas aktualizacji.
questions.1.prompt: Czy zmiana projektowanego ConfigMap powoduje automatyczne ponowne załadowanie każdej aplikacji?
diagnostics.command: station-dns command musi być równe /coredns -conf /etc/station/Corefile.
diagnostics.ports: station-dns ports musi być równe TCP/UDP 53 → 1053.
diagnostics.core: Corefile station-dns musi odpowiadać wymaganej strukturze, adresowi, portowi i TTL po normalizacji
  białych znaków.
diagnostics.dns_policy: deployment/client dnsPolicy musi być równe None.
diagnostics.nameserver: deployment/client nameservers musi być równe [station-dns Service IP].
diagnostics.answer: Odpowiedź DNS north.station.internal musi zawierać expected-dns-address.
diagnostics.http: Żądanie do north.station.internal:8080 musi zwrócić north-105.
