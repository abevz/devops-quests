title: Konfiguracja CoreDNS
brief: 'Pracuj w `~/quest` z `components.env`, `dns-config.json`, `dns.json`, `dns-service.json`, `client.json`, `expected-dns-address`
  i `Corefile`. Ta zatoka ma prywatną kopię CoreDNS. DNS tłumaczy nazwę na adres; wtyczka `hosts` i `ttl` sterują rekordem
  oraz czasem buforowania. Popraw `north.station.internal` na adres z `expected-dns-address`. Zachowaj dokładną strukturę
  Corefile (`errors`, jeden blok `hosts`, `ttl 1`, nasłuch 1053) bez dodatkowych dyrektyw. Zachowaj polecenie kontenera DNS
  z `dns.json` oraz dokładnie porty Service TCP i UDP 53 do 1053 z `dns-service.json`. Deployment client z `client.json` musi
  używać `dnsPolicy: None` i dokładnie adresu IP prywatnego Service DNS jako serwera nazw.


  Po zmianie ConfigMap zrestartuj tylko `deployment/station-dns` i poczekaj na rollout; propagacja DNS może potrwać. Z Deploymentu
  client sprawdź, czy odpowiedź DNS zawiera pełny oczekiwany adres, a `http://north.station.internal:8080` zwraca `north-105`.
  Kontrole obserwują bieżącą konfigurację i odpowiedzi, a nie wcześniej zmienione obiekty. Używaj tylko zatoki offline.'
debrief: Kontrole sprawdziły prywatną konfigurację DNS i ruch oparty na nazwie.
stages.0.brief: Prywatna konfiguracja DNS, serwer nazw Deploymentu client, wynik wyszukiwania i odpowiedź HTTP odpowiadają
  opisowi.
stages.0.objectives.0.text: Prywatna konfiguracja DNS, serwer nazw Deploymentu client, wynik wyszukiwania i odpowiedź HTTP
  odpowiadają opisowi.
hints.0.text: Pomyślny bezpośredni ruch IP nie dowodzi, że DNS działa.
hints.1.text: Ten client używa prywatnego DNS Service zamiast domyślnego klastra.
hints.2.text: Popraw hosts record z zamrożonego Service IP i załaduj ponownie tylko prywatny klon.
phrases.0: Oddzieliłem rozpoznawanie nazw od osiągalności transportu.
phrases.1: Sprawdziłem client DNS policy przed zmianą resolver.
phrases.2: Zweryfikowałem ruch lookup i aplikacji za pośrednictwem tej samej nazwy hosta.
questions.0.points.0: Mapowanie DNS lub client resolver może być błędny niezależnie od transportu.
questions.0.points.1: Porównaj aktualny resolver, odpowiedź i aplikację endpoint.
questions.0.prompt: Dlaczego bezpośredni IP może działać, podczas gdy hostname zawodzi?
questions.1.points.0: Pliki mogą w końcu zostać odświeżone, ale proces musi je ponownie odczytać.
questions.1.points.1: Zmienne środowiskowe i subPath mounts mają różne zachowanie podczas aktualizacji.
questions.1.prompt: Czy zmiana projektowanego ConfigMap powoduje automatyczne ponowne załadowanie każdej aplikacji?
