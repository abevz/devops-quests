title: Konfiguracja CoreDNS
brief: |-
  Trasa jest niedostępna przez prywatną nazwę DNS. Przywróć spójne prywatne rozwiązywanie nazw i wymaganą odpowiedź HTTP.

  Pracuj w `~/quest` na workstation. Dostarczone pliki: `dns-config.yaml`, `dns.yaml`, `dns-service.yaml`, `client.yaml`.

  **Wymagania:**
  - Istniejący prywatny resolver obsługuje `north.station.internal`, zachowując dostarczone środowisko CoreDNS i wyłącznie dostarczony dostęp DNS.
  - Deployment `client` używa wyłącznie istniejącego prywatnego resolvera DNS.
  - Z Deployment `client` `north.station.internal` rozwiązuje się na pełny adres właściwego prywatnego Service aplikacji.
  - Z `deployment/client` HTTP `http://north.station.internal:8080` zwraca `north-105`.

  Sprawdzana jest bieżąca konfiguracja i odpowiedzi, nie to, które obiekty zmieniono wcześniej.
debrief: Kontrole sprawdziły prywatną konfigurację DNS i ruch oparty na nazwie.
stages.0.brief: Prywatny DNS i odpowiedź aplikacji mają odpowiadać dostarczonemu kontraktowi adresu.
hints.0.text: Pomyślny bezpośredni ruch IP nie dowodzi, że DNS działa.
hints.1.text: |-
  Ten client używa prywatnego DNS Service zamiast domyślnego klastra.

  Sprawdź dostarczone definicje, bieżące zasoby i zdarzenia.

  Popraw wpis hosts według zamrożonego IP Service i przeładuj tylko prywatny klon. Po aktualizacji ConfigMap uruchom ponownie tylko deployment/station-dns i poczekaj na rollout; propagacja DNS może potrwać.

  ```sh
  cat dns-config.yaml
  kubectl get deployment station-dns client -o yaml
  kubectl get service station-dns -o yaml
  kubectl get configmap station-dns -o yaml
  ```
hints.2.text: |-
  Sprawdź obserwowany wynik:

  ```sh
  kubectl exec deployment/client -- nslookup north.station.internal
  kubectl exec deployment/client -- wget -qO- -T 3 http://north.station.internal:8080
  ```

  Oczekuj pełnego adresu prywatnego Service aplikacji w odpowiedzi DNS i odpowiedzi HTTP north-105.

  Dostarczone ograniczenia i szczegóły: Prywatny resolver `station-dns` uruchamia CoreDNS z `/etc/station/Corefile` w kontenerze DNS, obsługuje wymagany rekord `north.station.internal` i udostępnia tylko TCP/UDP `53` do `1053`. Deployment `client` używa zasady DNS `None` i wyłącznie IP Service `station-dns` jako resolver. Zapytanie DNS z Deployment `client` o `north.station.internal` zawiera pełny adres z `/run/dq/facts/0/expected-dns-address` na workstation.
phrases.0: Oddzieliłem rozpoznawanie nazw od osiągalności transportu.
phrases.1: Sprawdziłem client DNS policy przed zmianą resolver.
phrases.2: Zweryfikowałem ruch lookup i aplikacji za pośrednictwem tej samej nazwy hosta.
questions.0.points.0: Mapowanie DNS lub client resolver może być błędny niezależnie od transportu.
questions.0.points.1: Porównaj aktualny resolver, odpowiedź i aplikację endpoint.
questions.0.prompt: Dlaczego bezpośredni IP może działać, podczas gdy hostname zawodzi?
questions.1.points.0: Pliki mogą w końcu zostać odświeżone, ale proces musi je ponownie odczytać.
questions.1.points.1: Zmienne środowiskowe i subPath mounts mają różne zachowanie podczas aktualizacji.
questions.1.prompt: Czy zmiana projektowanego ConfigMap powoduje automatyczne ponowne załadowanie każdej aplikacji?
stages.0.objectives.0.text: |-
  Istniejący prywatny resolver obsługuje `north.station.internal`, zachowując dostarczone środowisko CoreDNS i wyłącznie dostarczony dostęp DNS.
stages.0.objectives.1.text: Deployment `client` używa wyłącznie istniejącego prywatnego resolvera DNS.
stages.0.objectives.2.text: Z Deployment `client` `north.station.internal` rozwiązuje się na pełny adres właściwego
  prywatnego Service aplikacji.
stages.0.objectives.3.text: Z `deployment/client` HTTP `http://north.station.internal:8080` zwraca `north-105`.
diagnostics.command: CoreDNS może uruchamiać się z domyślną konfiguracją lub innym plikiem. Sprawdź program i argumenty kontenera worker pod kątem /etc/station/Corefile. [Przyczyna i kontrola](guides#guide=private-dns&section=q105-resolver-corefile-command)
diagnostics.ports: Port Service może pomijać jeden protokół DNS lub wskazywać zły cel. Sprawdź TCP i UDP na 53, oba z numerycznym lub nazwanym celem 1053. [Przyczyna i kontrola](guides#guide=private-dns&section=q105-resolver-service-ports)
diagnostics.core: Dostarczony Corefile może nadal kierować north.station.internal na loopback albo resolver mógł nie wczytać zmian. Zapytaj station-dns bezpośrednio i porównaj odpowiedź z podanym adresem board. [Przyczyna i kontrola](guides#guide=private-dns&section=q105-configured-resolver-answer)
diagnostics.dns_policy: Szablon klienta może wrócić do polityki DNS klastra. Sprawdź dnsPolicy Deploymentu client i zachowaj None dla dostarczonego serwera nazw. [Przyczyna i kontrola](guides#guide=private-dns&section=q105-client-dns-policy)
diagnostics.nameserver: Na liście client może pozostać stary adres lub dodatkowy resolver. Porównaj nameservers z aktualnym ClusterIP station-dns i zostaw tylko ten adres. [Przyczyna i kontrola](guides#guide=private-dns&section=q105-client-nameserver-address)
diagnostics.answer: Nawet przy poprawnej konfiguracji client może dostać złą odpowiedź albo nie dostać jej od wskazanego resolvera. Sprawdź adres north.station.internal z poda client. [Przyczyna i kontrola](guides#guide=private-dns&section=q105-client-explicit-dns-answer)
diagnostics.http: Odpowiedź DNS może być poprawna, mimo że Service lub endpoint nie jest gotowy lub zwraca inną treść. Odpytaj nazwę z poda client i porównaj z north-105. [Przyczyna i kontrola](guides#guide=private-dns&section=q105-client-hostname-http)
diagnostics.probe_0_0: Kontrola resolvera może skończyć się przed wskazaniem warunku przez błąd narzędzi lub wejścia. Najpierw sprawdź narzędzia i dostęp do zasobów resolvera. [Przyczyna i kontrola](guides#guide=private-dns&section=q105-resolver-observer-input)
