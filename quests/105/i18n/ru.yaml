title: Конфигурация CoreDNS
brief: 'Приватный клон CoreDNS обслуживает только эту песочницу. Его hosts record
  указывает north.station.internal на loopback вместо Service табло. client явно использует
  этот DNS Service через dnsPolicy: None. Исправьте запись по сохранённому expected-dns-address,
  сохранив порт 1053 и TTL 1, затем перезапустите только station-dns для загрузки
  ConfigMap. Проверьте реальный DNS lookup и HTTP из client. Не меняйте CoreDNS в
  kube-system, DNS кластера и внешние resolvers.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `components.env`,
  `dns-config.json`, `dns.json`, `dns-service.json`, `client.json`, `expected-dns-address`,
  `Corefile`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно
  загруженные образы и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Собственный DNS Service разрешает адрес табло, client получает
  north-105 через hostname; DNS кластера остаётся вне упражнения.'
debrief: Изолированная конфигурация DNS исправлена и проверена реальным запросом по
  имени.
stages.0.brief: 'Результат проверки: Собственный DNS Service разрешает адрес табло,
  client получает north-105 через hostname; DNS кластера остаётся вне упражнения.'
stages.0.objectives.0.text: Собственный DNS Service разрешает адрес табло, client
  получает north-105 через hostname; DNS кластера остаётся вне упражнения.
hints.0.text: Успешный запрос по IP не доказывает работоспособность DNS.
hints.1.text: Этот client использует приватный DNS Service вместо DNS кластера.
hints.2.text: Исправьте hosts record по сохранённому IP Service и перезагрузите только
  приватный клон.
phrases.0: Я отделил разрешение имени от доступности транспорта.
phrases.1: Я изучил DNS policy клиента до изменения resolver.
phrases.2: Я проверил lookup и запрос приложения через одно имя.
questions.0.points.0: DNS-запись или resolver клиента могут быть неверны при исправном
  транспорте.
questions.0.points.1: Сравнивайте реальный resolver, ответ и endpoint приложения.
questions.0.prompt: Почему IP может работать при отказе hostname?
questions.1.points.0: Файлы могут обновиться со временем, но процесс должен их перечитать.
questions.1.points.1: Env и subPath mounts обновляются иначе.
questions.1.prompt: Перезагружает ли изменение проецируемого ConfigMap любое приложение?
