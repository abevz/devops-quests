title: Конфигурация CoreDNS
brief: 'Маршрут недоступен по частному DNS-имени. Восстановите согласованное частное разрешение имён и требуемый
  HTTP-ответ.


  Работайте в `~/quest` на workstation. Предоставленные файлы: `dns-config.yaml`, `dns.yaml`, `dns-service.yaml`,
  `client.yaml`.


  **Требования:**

  - Существующий приватный резолвер обслуживает `north.station.internal`, сохраняя поставленные runtime CoreDNS
  и доступ к DNS.

  - Deployment `client` использует только существующий приватный DNS-резолвер.

  - Из Deployment `client` `north.station.internal` разрешается в полный адрес требуемого приватного Service
  приложения.

  - Из `deployment/client` HTTP `http://north.station.internal:8080` возвращает `north-105`.


  Проверка наблюдает текущие конфигурацию и ответы, а не то, какие объекты изменялись раньше.

  '
debrief: Проверки наблюдали приватную конфигурацию DNS и трафик по имени.
stages.0.brief: Частный DNS и ответ приложения должны соответствовать предоставленному контракту адреса.
hints.0.text: Успешный запрос по IP не доказывает работоспособность DNS.
hints.1.text: 'Этот client использует приватный DNS Service вместо DNS кластера.


  Изучите поставленные определения, текущие ресурсы и события.


  ```sh

  cat dns-config.yaml

  kubectl get deployment station-dns client -o yaml

  kubectl get service station-dns -o yaml

  kubectl get configmap station-dns -o yaml

  ```'
hints.2.text: 'Исправьте запись hosts по зафиксированному Service IP и перезагрузите только частный клон. После
  обновления ConfigMap перезапустите только deployment/station-dns и дождитесь rollout; распространение DNS
  занимает время.


  Проверьте наблюдаемый результат:


  ```sh

  kubectl exec deployment/client -- nslookup north.station.internal

  kubectl exec deployment/client -- wget -qO- -T 3 http://north.station.internal:8080

  ```


  Ожидаются полный адрес приватного Service приложения в DNS-ответе и HTTP-ответ north-105.


  Поставленные ограничения и подробности: Частный resolver `station-dns` запускает CoreDNS с `/etc/station/Corefile`
  внутри DNS-контейнера, обслуживает требуемую запись `north.station.internal` и предоставляет только TCP/UDP
  `53` к `1053`. Deployment `client` использует политику DNS `None` и только Service IP `station-dns` как resolver.
  DNS-запрос из Deployment `client` для `north.station.internal` содержит полный адрес из `/run/dq/facts/0/expected-dns-address`
  на workstation.


  Контракт Corefile: один listener на 1053, errors и один блок hosts с защищённым ожидаемым адресом, north.station.internal
  и ttl 1, без других директив.'
phrases.0: Я отделил разрешение имени от доступности транспорта.
phrases.1: Я изучил DNS policy клиента до изменения resolver.
phrases.2: Я проверил lookup и запрос приложения через одно имя.
questions.0.points.0: DNS-запись или resolver клиента могут быть неверны при исправном транспорте.
questions.0.points.1: Сравнивайте реальный resolver, ответ и endpoint приложения.
questions.0.prompt: Почему IP может работать при отказе hostname?
questions.1.points.0: Файлы могут обновиться со временем, но процесс должен их перечитать.
questions.1.points.1: Env и subPath mounts обновляются иначе.
questions.1.prompt: Перезагружает ли изменение проецируемого ConfigMap любое приложение?
