diagnostics.command: CoreDNS мог запускаться с обычной конфигурацией или другим Corefile. Проверьте команду и аргументы контейнера worker, чтобы он читал /etc/station/Corefile. [Причина и проверка](guides#guide=private-dns&section=q105-resolver-corefile-command)
diagnostics.ports: В Service мог отсутствовать один из протоколов DNS или быть указан другой порт назначения. Проверьте TCP и UDP на 53 с числовым или именованным портом назначения 1053. [Причина и проверка](guides#guide=private-dns&section=q105-resolver-service-ports)
diagnostics.core: Выданный Corefile мог всё ещё направлять north.station.internal на loopback, либо работающий resolver мог не прочитать изменённый файл. Запросите station-dns напрямую и сравните ответ с выданным адресом board. [Причина и проверка](guides#guide=private-dns&section=q105-configured-resolver-answer)
diagnostics.dns_policy: Шаблон client мог вернуться к DNS-политике кластера. Проверьте dnsPolicy и сохраните None для выданной настройки nameserver. [Причина и проверка](guides#guide=private-dns&section=q105-client-dns-policy)
diagnostics.nameserver: В client мог остаться старый адрес или дополнительные резолверы. Сравните nameservers с текущим ClusterIP station-dns и оставьте только этот адрес. [Причина и проверка](guides#guide=private-dns&section=q105-client-nameserver-address)
diagnostics.answer: Даже при верной конфигурации client может получить неверный ответ или не получить его от явно указанного резолвера. Проверьте адрес north.station.internal из Pod client. [Причина и проверка](guides#guide=private-dns&section=q105-client-explicit-dns-answer)
diagnostics.http: DNS-ответ может быть верным, пока Service или endpoint за ним не готовы либо отдают другое содержимое. Запросите имя из client и сравните ответ с north-105. [Причина и проверка](guides#guide=private-dns&section=q105-client-hostname-http)
diagnostics.probe_0_0: Проверка резолвера может завершиться до указания условия при ошибке инструментов или входов. Сначала проверьте инструменты и доступ к объектам резолвера. [Причина и проверка](guides#guide=private-dns&section=q105-resolver-observer-input)
