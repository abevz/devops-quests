title: Конфигурация CoreDNS
brief: "Маршрут недоступен по частному DNS-имени. Восстановите согласованное частное разрешение имён и требуемый\
  \ HTTP-ответ.\n\nРаботайте в `~/quest` на workstation. Предоставленные файлы: `dns-config.json`, `dns.json`, `dns-service.json`,\
  \ `client.json`, `expected-dns-address`.\n\n**Требования:**\n- Deployment `station-dns` запускает CoreDNS с `/etc/station/Corefile`\
  \ внутри своего DNS-контейнера.\n- Service `station-dns` предоставляет только TCP и UDP порт `53`, каждый направлен\
  \ на порт `1053`.\n- ConfigMap `station-dns` сохраняет исходную структуру Corefile:\n  - listener `1053`, `errors`,\
  \ один блок `hosts` для `north.station.internal` с защищённым ожидаемым адресом и TTL `1`.\n- Deployment `client`:\n\
  \  - политика DNS `None`.\n- Deployment `client` использует только Service IP `station-dns` как nameserver.\n\
  - DNS-запрос из Deployment `client` для `north.station.internal` содержит полный адрес из `/run/dq/facts/0/expected-dns-address`\
  \ на workstation.\n- Из `deployment/client` HTTP `http://north.station.internal:8080` возвращает `north-105`.\n\
  \n**Проверьте самостоятельно перед Check & finish:**\nВыполняйте эти команды наблюдения из `~/quest` на workstation;\
  \ `kubectl exec` наблюдает контейнер указанной нагрузки.\n- Ответ содержит полный ожидаемый адрес.\n\n  ```sh\n\
  \  kubectl exec deployment/client -- nslookup north.station.internal\n  cat /run/dq/facts/0/expected-dns-address\n\
  \  ```\n- `kubectl exec deployment/client -- wget -qO- -T 3 http://north.station.internal:8080` — Потребитель\
  \ получает `north-105`.\n- Настройки, идентичность и статус соответствуют требованиям.\n\n  ```sh\n  kubectl get\
  \ deployment station-dns client -o yaml\n  kubectl get service station-dns -o yaml\n  kubectl get configmap station-dns\
  \ -o yaml\n  ```\n\nПроверка наблюдает текущие конфигурацию и ответы, а не то, какие объекты изменялись раньше.\n"
debrief: Проверки наблюдали приватную конфигурацию DNS и трафик по имени.
stages.0.brief: 'Частный DNS и ответ приложения должны соответствовать предоставленному контракту адреса.

  '
hints.0.text: Успешный запрос по IP не доказывает работоспособность DNS.
hints.1.text: Этот client использует приватный DNS Service вместо DNS кластера.
hints.2.text: 'Исправьте запись hosts по зафиксированному Service IP и перезагрузите только частный клон. После
  обновления ConfigMap перезапустите только deployment/station-dns и дождитесь rollout; распространение DNS занимает
  время.

  '
phrases.0: Я отделил разрешение имени от доступности транспорта.
phrases.1: Я изучил DNS policy клиента до изменения resolver.
phrases.2: Я проверил lookup и запрос приложения через одно имя.
questions.0.points.0: DNS-запись или resolver клиента могут быть неверны при исправном транспорте.
questions.0.points.1: Сравнивайте реальный resolver, ответ и endpoint приложения.
questions.0.prompt: Почему IP может работать при отказе hostname?
questions.1.points.0: Файлы могут обновиться со временем, но процесс должен их перечитать.
questions.1.points.1: Env и subPath mounts обновляются иначе.
questions.1.prompt: Перезагружает ли изменение проецируемого ConfigMap любое приложение?
