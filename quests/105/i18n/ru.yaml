title: Конфигурация CoreDNS
brief: 'Работайте в `~/quest` с `components.env`, `dns-config.json`, `dns.json`, `dns-service.json`, `client.json`, `expected-dns-address`
  и `Corefile`. В этой песочнице есть приватная копия CoreDNS. DNS преобразует имя в адрес; плагин `hosts` и `ttl` задают
  запись и время кэширования. Исправьте `north.station.internal` на адрес из `expected-dns-address`. Сохраните точную структуру
  Corefile (`errors`, один блок `hosts`, `ttl 1`, порт 1053) без дополнительных директив. Сохраните команду DNS-контейнера
  из `dns.json` и ровно TCP и UDP порты Service 53 на 1053 из `dns-service.json`. Клиент из `client.json` должен использовать
  `dnsPolicy: None` и ровно IP приватного DNS Service в качестве сервера имён.


  После изменения ConfigMap перезапустите только `deployment/station-dns` и дождитесь rollout; распространение DNS может занять
  время. Из клиента проверьте, что ответ DNS содержит полный нужный адрес, а `http://north.station.internal:8080` возвращает
  `north-105`. Проверки наблюдают текущую конфигурацию и ответы, но не историю изменений объектов. Используйте только офлайн-песочницу.'
debrief: Проверки наблюдали приватную конфигурацию DNS и трафик по имени.
stages.0.brief: Приватная конфигурация DNS, сервер имён клиента, ответ DNS и HTTP соответствуют описанию.
stages.0.objectives.0.text: Приватная конфигурация DNS, сервер имён клиента, ответ DNS и HTTP соответствуют описанию.
hints.0.text: Успешный запрос по IP не доказывает работоспособность DNS.
hints.1.text: Этот client использует приватный DNS Service вместо DNS кластера.
hints.2.text: Исправьте hosts record по сохранённому IP Service и перезагрузите только приватный клон.
phrases.0: Я отделил разрешение имени от доступности транспорта.
phrases.1: Я изучил DNS policy клиента до изменения resolver.
phrases.2: Я проверил lookup и запрос приложения через одно имя.
questions.0.points.0: DNS-запись или resolver клиента могут быть неверны при исправном транспорте.
questions.0.points.1: Сравнивайте реальный resolver, ответ и endpoint приложения.
questions.0.prompt: Почему IP может работать при отказе hostname?
questions.1.points.0: Файлы могут обновиться со временем, но процесс должен их перечитать.
questions.1.points.1: Env и subPath mounts обновляются иначе.
questions.1.prompt: Перезагружает ли изменение проецируемого ConfigMap любое приложение?
