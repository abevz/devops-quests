title: CoreDNS configuration
brief: 'A private CoreDNS clone serves only this bay. Its hosts record points north.station.internal to
  loopback instead of the board Service. client explicitly uses this DNS Service through dnsPolicy: None.
  Repair the hosts record to the frozen expected-dns-address, retain port 1053 and TTL 1, then restart
  only station-dns so it reloads the ConfigMap. Verify an actual DNS lookup and HTTP request from client.
  Do not edit kube-system CoreDNS, cluster DNS or external resolvers.


  Quest files in `~/quest` (some appear in later stages): `components.env`, `dns-config.json`, `dns.json`,
  `dns-service.json`, `client.json`, `expected-dns-address`, `Corefile`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: The custom DNS Service resolves the board address and client reaches north-105
  through that hostname; cluster DNS remains outside the exercise.'
debrief: A scoped DNS configuration was repaired and verified through real name-based traffic.
