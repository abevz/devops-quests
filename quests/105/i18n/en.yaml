title: CoreDNS configuration
brief: 'Work in `~/quest` with `components.env`, `dns-config.json`, `dns.json`, `dns-service.json`, `client.json`, `expected-dns-address`
  and `Corefile`. This bay has its own CoreDNS clone. DNS translates a name into an address; its `hosts` plugin and `ttl`
  control the supplied record and cache lifetime. Repair `north.station.internal` to the address in `expected-dns-address`.
  Keep the exact supplied Corefile structure (`errors`, one `hosts` block, `ttl 1`, listener 1053) without extra directives.
  Keep the DNS container command from `dns.json`, and exactly TCP and UDP Service ports 53 to 1053 from `dns-service.json`.
  The client in `client.json` must use `dnsPolicy: None` and exactly the private DNS Service IP as its nameserver.


  After changing the ConfigMap, restart only `deployment/station-dns` and wait for rollout; DNS propagation can take time.
  From the client, verify the DNS answer contains the complete expected address and `http://north.station.internal:8080` returns
  `north-105`. The checks observe current configuration and responses, not which objects were changed earlier. Use only the
  offline bay.'
debrief: The checks observed the private DNS configuration and name-based traffic.
stages.0.brief: The private DNS configuration, client nameserver, lookup and HTTP response match the brief.
stages.0.objectives.0.text: The private DNS configuration, client nameserver, lookup and HTTP response match the brief.
hints.0.text: Successful direct IP traffic does not prove DNS works.
hints.1.text: This client uses the private DNS Service rather than the cluster default.
hints.2.text: Correct the hosts record from the frozen Service IP and reload only the private clone.
phrases.0: I separated name resolution from transport reachability.
phrases.1: I inspected the client DNS policy before changing a resolver.
phrases.2: I verified lookup and application traffic through the same hostname.
questions.0.points.0: DNS mapping or the client resolver can be wrong independently of transport.
questions.0.points.1: Compare the actual resolver, answer and application endpoint.
questions.0.prompt: Why can direct IP work while the hostname fails?
questions.1.points.0: Files may refresh eventually, but the process must reread them.
questions.1.points.1: Environment variables and subPath mounts have different update behavior.
questions.1.prompt: Does changing a projected ConfigMap automatically reload every application?
diagnostics.command: station-dns command must equal /coredns -conf /etc/station/Corefile.
diagnostics.ports: station-dns ports must equal TCP/UDP 53 → 1053.
diagnostics.core: The station-dns Corefile must match the required structure, address, port and TTL after normalizing whitespace.
diagnostics.dns_policy: deployment/client dnsPolicy must equal None.
diagnostics.nameserver: deployment/client nameservers must equal [station-dns Service IP].
diagnostics.answer: The north.station.internal DNS answer must contain expected-dns-address.
diagnostics.http: The request to north.station.internal:8080 must return north-105.
