title: CoreDNS configuration
brief: |-
  The route cannot be reached by its private DNS name. Restore consistent private name resolution and the required HTTP response.

  Work in `~/quest` on the workstation. Supplied files: `dns-config.yaml`, `dns.yaml`, `dns-service.yaml`, `client.yaml`.

  **Requirements:**
  - The existing private resolver serves `north.station.internal` using its supplied CoreDNS runtime and only the supplied DNS exposure.
  - Deployment `client` uses only the existing private DNS resolver.
  - From Deployment `client`, `north.station.internal` resolves to the complete address of the intended private application Service.
  - From `deployment/client`, HTTP `http://north.station.internal:8080` returns `north-105`.

  Checks observe current configuration and responses, not which objects were changed earlier.
debrief: The checks observed the private DNS configuration and name-based traffic.
stages.0.brief: Private DNS and the application response must agree with the supplied address contract.
hints.0.text: Successful direct IP traffic does not prove DNS works.
hints.1.text: 'This client uses the private DNS Service rather than the cluster default.


  Inspect the supplied definitions, current resources and events.


  ```sh

  cat dns-config.yaml

  kubectl get deployment station-dns client -o yaml

  kubectl get service station-dns -o yaml

  kubectl get configmap station-dns -o yaml

  ```'
hints.2.text: |-
  Correct the hosts record from the frozen Service IP and reload only the private clone. After updating its ConfigMap, restart only deployment/station-dns and wait for rollout; DNS propagation can take time.

  Verify the observed result:

  ```sh
  kubectl exec deployment/client -- nslookup north.station.internal
  kubectl exec deployment/client -- wget -qO- -T 3 http://north.station.internal:8080
  ```

  Expect the full address of the private application Service in the DNS answer and HTTP response north-105.

  Supplied constraints and details: Private resolver `station-dns` runs CoreDNS with `/etc/station/Corefile` inside its DNS container, serves the required `north.station.internal` record, and exposes only TCP/UDP `53` to `1053`. Deployment `client` uses DNS policy `None` and only the Service IP of `station-dns` as its resolver. DNS lookup from Deployment `client` for `north.station.internal` includes the full address recorded in `/run/dq/facts/0/expected-dns-address` on the workstation.
phrases.0: I separated name resolution from transport reachability.
phrases.1: I inspected the client DNS policy before changing a resolver.
phrases.2: I verified lookup and application traffic through the same hostname.
questions.0.points.0: DNS mapping or the client resolver can be wrong independently of transport.
questions.0.points.1: Compare the actual resolver, answer and application endpoint.
questions.0.prompt: Why can direct IP work while the hostname fails?
questions.1.points.0: Files may refresh eventually, but the process must reread them.
questions.1.points.1: Environment variables and subPath mounts have different update behavior.
questions.1.prompt: Does changing a projected ConfigMap automatically reload every application?
diagnostics.command: station-dns must run /coredns with /etc/station/Corefile as its configuration.
diagnostics.ports: station-dns ports must equal TCP/UDP 53 → 1053.
diagnostics.core: |-
  The private resolver must answer north.station.internal with the intended Service address.
diagnostics.dns_policy: deployment/client dnsPolicy must equal None.
diagnostics.nameserver: deployment/client nameservers must equal [station-dns Service IP].
diagnostics.answer: The north.station.internal DNS answer must contain expected-dns-address.
diagnostics.http: The request to north.station.internal:8080 must return north-105.
