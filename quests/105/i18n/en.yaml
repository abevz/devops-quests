title: CoreDNS configuration
brief: "The route cannot be reached by its private DNS name. Restore consistent private name resolution and the\
  \ required HTTP response.\n\nWork in `~/quest` on the workstation. Supplied files: `dns-config.json`, `dns.json`,\
  \ `dns-service.json`, `client.json`, `expected-dns-address`.\n\n**Requirements:**\n- Private resolver `station-dns`\
  \ runs CoreDNS with `/etc/station/Corefile` inside its DNS container, serves the required `north.station.internal`\
  \ record, and exposes only TCP/UDP `53` to `1053`.\n  - The DNS Corefile contract has listener `1053`, `errors`,\
  \ one `hosts` block for the protected expected address and TTL `1`, without extra directives.\n- Deployment `client`\
  \ uses DNS policy `None` and only the Service IP of `station-dns` as its resolver.\n- DNS lookup from Deployment\
  \ `client` for `north.station.internal` includes the full address recorded in `/run/dq/facts/0/expected-dns-address`\
  \ on the workstation.\n- From `deployment/client`, HTTP `http://north.station.internal:8080` returns `north-105`.\n\
  \n**Verify yourself before Check & finish:**\nRun these observation commands from `~/quest` on the workstation;\
  \ `kubectl exec` observes the named workload container.\n- The answer contains the complete expected address.\n\
  \n  ```sh\n  kubectl exec deployment/client -- nslookup north.station.internal\n  cat /run/dq/facts/0/expected-dns-address\n\
  \  ```\n- `kubectl exec deployment/client -- wget -qO- -T 3 http://north.station.internal:8080` — The consumer\
  \ receives `north-105`.\n- Settings, identity and status match Requirements.\n\n  ```sh\n  kubectl get deployment\
  \ station-dns client -o yaml\n  kubectl get service station-dns -o yaml\n  kubectl get configmap station-dns -o\
  \ yaml\n  ```\n\nChecks observe current configuration and responses, not which objects were changed earlier.\n"
debrief: The checks observed the private DNS configuration and name-based traffic.
stages.0.brief: 'Private DNS and the application response must agree with the supplied address contract.

  '
hints.0.text: Successful direct IP traffic does not prove DNS works.
hints.1.text: This client uses the private DNS Service rather than the cluster default.
hints.2.text: 'Correct the hosts record from the frozen Service IP and reload only the private clone. After updating
  its ConfigMap, restart only deployment/station-dns and wait for rollout; DNS propagation can take time.

  '
phrases.0: I separated name resolution from transport reachability.
phrases.1: I inspected the client DNS policy before changing a resolver.
phrases.2: I verified lookup and application traffic through the same hostname.
questions.0.points.0: DNS mapping or the client resolver can be wrong independently of transport.
questions.0.points.1: Compare the actual resolver, answer and application endpoint.
questions.0.prompt: Why can direct IP work while the hostname fails?
questions.1.points.0: Files may refresh eventually, but the process must reread them.
questions.1.points.1: Environment variables and subPath mounts have different update behavior.
questions.1.prompt: Does changing a projected ConfigMap automatically reload every application?
diagnostics.command: station-dns command must equal /coredns -conf /etc/station/Corefile.
diagnostics.ports: station-dns ports must equal TCP/UDP 53 → 1053.
diagnostics.core: The station-dns Corefile must match the required structure, address, port and TTL after normalizing
  whitespace.
diagnostics.dns_policy: deployment/client dnsPolicy must equal None.
diagnostics.nameserver: deployment/client nameservers must equal [station-dns Service IP].
diagnostics.answer: The north.station.internal DNS answer must contain expected-dns-address.
diagnostics.http: The request to north.station.internal:8080 must return north-105.
