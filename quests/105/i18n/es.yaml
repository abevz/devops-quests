title: Configuración CoreDNS
brief: 'Trabaja en `~/quest` con `components.env`, `dns-config.json`, `dns.json`, `dns-service.json`, `client.json`, `expected-dns-address`
  y `Corefile`. Esta bahía tiene una copia privada de CoreDNS. DNS traduce un nombre a una dirección; el plugin `hosts` y
  `ttl` controlan el registro y la duración en caché. Corrige `north.station.internal` a la dirección de `expected-dns-address`.
  Conserva la estructura exacta de Corefile (`errors`, un bloque `hosts`, `ttl 1`, listener 1053) sin directivas adicionales.
  Conserva el comando del contenedor DNS de `dns.json` y exactamente los puertos TCP y UDP 53 a 1053 del Service de `dns-service.json`.
  El Deployment client de `client.json` debe usar `dnsPolicy: None` y exactamente la IP del Service DNS privado como servidor
  de nombres.


  Tras cambiar el ConfigMap, reinicia solo `deployment/station-dns` y espera el rollout; la propagación DNS puede tardar.
  Desde el Deployment client, verifica que la respuesta DNS contiene la dirección prevista completa y que `http://north.station.internal:8080`
  devuelve `north-105`. Las comprobaciones observan configuración y respuestas actuales, no qué objetos se cambiaron antes.
  Usa solo la bahía sin conexión.'
debrief: Las comprobaciones observaron la configuración DNS privada y el tráfico por nombre.
stages.0.brief: La configuración DNS privada, el servidor de nombres del Deployment client, la consulta y la respuesta HTTP
  coinciden con la descripción.
stages.0.objectives.0.text: La configuración DNS privada, el servidor de nombres del Deployment client, la consulta y la respuesta
  HTTP coinciden con la descripción.
hints.0.text: El tráfico directo exitoso de IP no prueba que DNS funcione.
hints.1.text: Este client utiliza el DNS Service privado en lugar del clúster predeterminado.
hints.2.text: Corrija el hosts record del Service IP congelado y vuelva a cargar solo el clon privado.
phrases.0: Separé la resolución de nombres de la accesibilidad del transporte.
phrases.1: Inspeccioné el client DNS policy antes de cambiar un resolver.
phrases.2: Verifiqué lookup y el tráfico de la aplicación a través del mismo nombre de host.
questions.0.points.0: El mapeo DNS o el client resolver pueden ser incorrectos independientemente del transporte.
questions.0.points.1: Compare el resolver real, la respuesta y la aplicación endpoint.
questions.0.prompt: ¿Por qué el IP directo puede funcionar mientras que el hostname falla?
questions.1.points.0: Los archivos pueden actualizarse eventualmente, pero el proceso debe volver a leerlos.
questions.1.points.1: Las variables de entorno y subPath mounts tienen un comportamiento de actualización diferente.
questions.1.prompt: ¿El cambio de un ConfigMap proyectado recarga automáticamente todas las aplicaciones?
diagnostics.command: station-dns command debe ser igual a /coredns -conf /etc/station/Corefile.
diagnostics.ports: station-dns ports debe ser igual a TCP/UDP 53 → 1053.
diagnostics.core: Corefile de station-dns debe coincidir con la estructura, dirección, puerto y TTL requeridos tras normalizar
  espacios.
diagnostics.dns_policy: deployment/client dnsPolicy debe ser igual a None.
diagnostics.nameserver: deployment/client nameservers debe ser igual a [station-dns Service IP].
diagnostics.answer: La respuesta DNS de north.station.internal debe contener expected-dns-address.
diagnostics.http: La petición a north.station.internal:8080 debe devolver north-105.
