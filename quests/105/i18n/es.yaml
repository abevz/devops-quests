title: Configuración CoreDNS
brief: "La ruta no es accesible por su nombre DNS privado. Recupera una resolución privada coherente y la respuesta\
  \ HTTP requerida.\n\nTrabaja en `~/quest` en la workstation. Archivos suministrados: `dns-config.json`, `dns.json`,\
  \ `dns-service.json`, `client.json`, `expected-dns-address`.\n\n**Requisitos:**\n- El resolver privado `station-dns`\
  \ ejecuta CoreDNS con `/etc/station/Corefile` dentro de su contenedor DNS, sirve el registro requerido `north.station.internal`\
  \ y expone solo TCP/UDP `53` hacia `1053`.\n  - El contrato DNS Corefile tiene listener `1053`, `errors`, un bloque\
  \ `hosts` para la dirección esperada protegida y TTL `1`, sin directivas adicionales.\n- El Deployment `client`\
  \ usa política DNS `None` y solo la IP del Service `station-dns` como resolver.\n- La consulta DNS desde el Deployment\
  \ `client` para `north.station.internal` incluye la dirección completa de `/run/dq/facts/0/expected-dns-address`\
  \ en la workstation.\n- Desde `deployment/client`, HTTP `http://north.station.internal:8080` devuelve `north-105`.\n\
  \n**Verifica antes de Check & finish:**\nEjecuta estos comandos de observación desde `~/quest` en la workstation;\
  \ `kubectl exec` observa el contenedor de la carga indicada.\n- La respuesta contiene la dirección esperada completa.\n\
  \n  ```sh\n  kubectl exec deployment/client -- nslookup north.station.internal\n  cat /run/dq/facts/0/expected-dns-address\n\
  \  ```\n- `kubectl exec deployment/client -- wget -qO- -T 3 http://north.station.internal:8080` — El consumidor\
  \ recibe `north-105`.\n- Los ajustes, la identidad y el estado coinciden con Requisitos.\n\n  ```sh\n  kubectl\
  \ get deployment station-dns client -o yaml\n  kubectl get service station-dns -o yaml\n  kubectl get configmap\
  \ station-dns -o yaml\n  ```\n\nSe observan configuración y respuestas actuales, no qué objetos se cambiaron antes.\n"
debrief: Las comprobaciones observaron la configuración DNS privada y el tráfico por nombre.
stages.0.brief: 'El DNS privado y la respuesta de la aplicación deben coincidir con el contrato de dirección suministrado.

  '
hints.0.text: El tráfico directo exitoso de IP no prueba que DNS funcione.
hints.1.text: Este client utiliza el DNS Service privado en lugar del clúster predeterminado.
hints.2.text: 'Corrige el registro hosts con la IP de Service congelada y recarga solo el clon privado. Tras actualizar
  su ConfigMap, reinicia solo deployment/station-dns y espera el rollout; la propagación DNS puede tardar.

  '
phrases.0: Separé la resolución de nombres de la accesibilidad del transporte.
phrases.1: Inspeccioné el client DNS policy antes de cambiar un resolver.
phrases.2: Verifiqué lookup y el tráfico de la aplicación a través del mismo nombre de host.
questions.0.points.0: El mapeo DNS o el client resolver pueden ser incorrectos independientemente del transporte.
questions.0.points.1: Compare el resolver real, la respuesta y la aplicación endpoint.
questions.0.prompt: ¿Por qué el IP directo puede funcionar mientras que el hostname falla?
questions.1.points.0: Los archivos pueden actualizarse eventualmente, pero el proceso debe volver a leerlos.
questions.1.points.1: Las variables de entorno y subPath mounts tienen un comportamiento de actualización diferente.
questions.1.prompt: ¿El cambio de un ConfigMap proyectado recarga automáticamente todas las aplicaciones?
diagnostics.command: station-dns command debe ser igual a /coredns -conf /etc/station/Corefile.
diagnostics.ports: station-dns ports debe ser igual a TCP/UDP 53 → 1053.
diagnostics.core: Corefile de station-dns debe coincidir con la estructura, dirección, puerto y TTL requeridos tras
  normalizar espacios.
diagnostics.dns_policy: deployment/client dnsPolicy debe ser igual a None.
diagnostics.nameserver: deployment/client nameservers debe ser igual a [station-dns Service IP].
diagnostics.answer: La respuesta DNS de north.station.internal debe contener expected-dns-address.
diagnostics.http: La petición a north.station.internal:8080 debe devolver north-105.
