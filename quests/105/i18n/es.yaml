title: Configuración CoreDNS
brief: 'Un clon privado de CoreDNS sirve únicamente a esta bahía. Su hosts record apunta north.station.internal
  a loopback en lugar del board Service. client utiliza explícitamente este DNS Service hasta dnsPolicy:
  Ninguno. Repare el hosts record al expected-dns-address congelado, conserve el puerto 1053 y TTL 1,
  luego reinicie solo station-dns para que recargue el ConfigMap. Verifique una solicitud DNS lookup y
  HTTP real de client. No edite kube-system CoreDNS, el clúster DNS o el resolvers externo.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `components.env`, `dns-config.json`,
  `dns.json`, `dns-service.json`, `client.json`, `expected-dns-address`, `Corefile`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: el DNS Service personalizado resuelve la dirección board y client llega
  a north-105 a través de ese hostname; El grupo DNS permanece fuera del ejercicio.'
debrief: Se reparó y verificó una configuración de ámbito DNS mediante tráfico basado en nombres reales.
stages.0.brief: 'Criterios de éxito: El DNS Service personalizado resuelve la dirección board y client
  llega a north-105 a través de ese hostname; El cluster DNS queda fuera del ejercicio.'
stages.0.objectives.0.text: El DNS Service personalizado resuelve la dirección board y client llega a
  north-105 a través de ese hostname; El cluster DNS permanece fuera del ejercicio.
hints.0.text: El tráfico directo exitoso de IP no prueba que DNS funcione.
hints.1.text: Este client utiliza el DNS Service privado en lugar del clúster predeterminado.
hints.2.text: Corrija el hosts record del Service IP congelado y vuelva a cargar solo el clon privado.
phrases.0: Separé la resolución de nombres de la accesibilidad del transporte.
phrases.1: Inspeccioné el client DNS policy antes de cambiar un resolver.
phrases.2: Verifiqué lookup y el tráfico de la aplicación a través del mismo nombre de host.
questions.0.points.0: El mapeo DNS o el client resolver pueden ser incorrectos independientemente del
  transporte.
questions.0.points.1: Compare el resolver real, la respuesta y la aplicación endpoint.
questions.0.prompt: ¿Por qué el IP directo puede funcionar mientras que el hostname falla?
questions.1.points.0: Los archivos pueden actualizarse eventualmente, pero el proceso debe volver a leerlos.
questions.1.points.1: Las variables de entorno y subPath mounts tienen un comportamiento de actualización
  diferente.
questions.1.prompt: ¿El cambio de un ConfigMap proyectado recarga automáticamente todas las aplicaciones?
