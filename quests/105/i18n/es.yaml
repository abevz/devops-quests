title: Configuración CoreDNS
brief: |-
  La ruta no es accesible por su nombre DNS privado. Recupera una resolución privada coherente y la respuesta HTTP requerida.

  Trabaja en `~/quest` en la workstation. Archivos suministrados: `dns-config.yaml`, `dns.yaml`, `dns-service.yaml`, `client.yaml`.

  **Requisitos:**
  - El resolvedor privado existente sirve `north.station.internal` con su runtime CoreDNS suministrado y únicamente la exposición DNS suministrada.
  - El Deployment `client` usa únicamente el resolvedor DNS privado existente.
  - Desde el Deployment `client`, `north.station.internal` se resuelve a la dirección completa del Service privado de aplicación previsto.
  - Desde `deployment/client`, HTTP `http://north.station.internal:8080` devuelve `north-105`.

  Se observan configuración y respuestas actuales, no qué objetos se cambiaron antes.
debrief: Las comprobaciones observaron la configuración DNS privada y el tráfico por nombre.
stages.0.brief: El DNS privado y la respuesta de la aplicación deben coincidir con el contrato de dirección
  suministrado.
hints.0.text: El tráfico directo exitoso de IP no prueba que DNS funcione.
hints.1.text: 'Este client utiliza el DNS Service privado en lugar del clúster predeterminado.


  Inspecciona las definiciones suministradas, los recursos actuales y los eventos.


  ```sh

  cat dns-config.yaml

  kubectl get deployment station-dns client -o yaml

  kubectl get service station-dns -o yaml

  kubectl get configmap station-dns -o yaml

  ```'
hints.2.text: |-
  Corrige el registro hosts con la IP de Service congelada y recarga solo el clon privado. Tras actualizar su ConfigMap, reinicia solo deployment/station-dns y espera el rollout; la propagación DNS puede tardar.

  Verifica el resultado observado:

  ```sh
  kubectl exec deployment/client -- nslookup north.station.internal
  kubectl exec deployment/client -- wget -qO- -T 3 http://north.station.internal:8080
  ```

  Se esperan la dirección completa del Service privado de aplicación en la respuesta DNS y la respuesta HTTP north-105.

  Restricciones y detalles suministrados: El resolver privado `station-dns` ejecuta CoreDNS con `/etc/station/Corefile` dentro de su contenedor DNS, sirve el registro requerido `north.station.internal` y expone solo TCP/UDP `53` hacia `1053`. El Deployment `client` usa política DNS `None` y solo la IP del Service `station-dns` como resolver. La consulta DNS desde el Deployment `client` para `north.station.internal` incluye la dirección completa de `/run/dq/facts/0/expected-dns-address` en la workstation.
phrases.0: Separé la resolución de nombres de la accesibilidad del transporte.
phrases.1: Inspeccioné el client DNS policy antes de cambiar un resolver.
phrases.2: Verifiqué lookup y el tráfico de la aplicación a través del mismo nombre de host.
questions.0.points.0: El mapeo DNS o el client resolver pueden ser incorrectos independientemente del transporte.
questions.0.points.1: Compare el resolver real, la respuesta y la aplicación endpoint.
questions.0.prompt: ¿Por qué el IP directo puede funcionar mientras que el hostname falla?
questions.1.points.0: Los archivos pueden actualizarse eventualmente, pero el proceso debe volver a leerlos.
questions.1.points.1: Las variables de entorno y subPath mounts tienen un comportamiento de actualización diferente.
questions.1.prompt: ¿El cambio de un ConfigMap proyectado recarga automáticamente todas las aplicaciones?
stages.0.objectives.0.text: |-
  El resolvedor privado existente sirve `north.station.internal` con su runtime CoreDNS suministrado y únicamente la exposición DNS suministrada.
stages.0.objectives.1.text: El Deployment `client` usa únicamente el resolvedor DNS privado existente.
stages.0.objectives.2.text: Desde el Deployment `client`, `north.station.internal` se resuelve a la dirección
  completa del Service privado de aplicación previsto.
stages.0.objectives.3.text: Desde `deployment/client`, HTTP `http://north.station.internal:8080` devuelve `north-105`.
diagnostics.command: CoreDNS puede iniciar con su configuración predeterminada o con otro archivo. Revise el programa y los argumentos del contenedor worker para /etc/station/Corefile. [Causa y comprobación](guides#guide=private-dns&section=q105-resolver-corefile-command)
diagnostics.ports: Un puerto del Service puede omitir un protocolo DNS o apuntar al destino incorrecto. Revise TCP y UDP en el puerto 53, ambos con destino numérico o nombrado 1053. [Causa y comprobación](guides#guide=private-dns&section=q105-resolver-service-ports)
diagnostics.core: El Corefile suministrado puede seguir apuntando north.station.internal a loopback, o puede que el resolutor activo no haya cargado el cambio. Consulte station-dns directamente y compare con la dirección de board. [Causa y comprobación](guides#guide=private-dns&section=q105-configured-resolver-answer)
diagnostics.dns_policy: La plantilla del Deployment client puede volver a la política DNS del clúster. Revise dnsPolicy y mantenga None para aplicar el servidor suministrado. [Causa y comprobación](guides#guide=private-dns&section=q105-client-dns-policy)
diagnostics.nameserver: El Deployment client puede conservar una dirección antigua o resolutores adicionales. Compare nameservers con el ClusterIP actual de station-dns y deje solo esa dirección. [Causa y comprobación](guides#guide=private-dns&section=q105-client-nameserver-address)
diagnostics.answer: Aunque la configuración de client parezca correcta, el resolutor explícito puede dar una respuesta incorrecta o ninguna. Revise la dirección de north.station.internal desde el Pod client. [Causa y comprobación](guides#guide=private-dns&section=q105-client-explicit-dns-answer)
diagnostics.http: La respuesta DNS puede ser correcta mientras el Service o endpoint no está listo o sirve otra cosa. Solicite el nombre desde client y compare con north-105. [Causa y comprobación](guides#guide=private-dns&section=q105-client-hostname-http)
diagnostics.probe_0_0: El observador puede detenerse antes de señalar una condición si fallan las herramientas o sus entradas. Revise primero las herramientas y el acceso a los recursos del resolutor. [Causa y comprobación](guides#guide=private-dns&section=q105-resolver-observer-input)
