  - text: stages.0.objectives.0.text
    check: "set -euo pipefail\ncd ~/quest\nfailed=0\ncheck() { local label=$1 expression=$2 document=$3; if ! jq -e \"$expression\" <<<\"$document\" >/dev/null 2>&1; then printf '%s\\n' \"$label: ✗\"; failed=1; fi; }\ndns_answer_has() {\n  local result=$1 expected=$2\n  awk -v expected=\"$expected\" '\n    /^[[:space:]]*Name([[:space:]]+[0-9]+)?:/ { answer=1; next }\n    answer && /^[[:space:]]*Address([[:space:]]+[0-9]+)?:/ {\n      sub(/^[^:]*:[[:space:]]*/, \"\"); split($0, fields, /[[:space:]]+/)\n      if (fields[1] == expected) found=1\n    }\n    END { exit !found }\n  ' <<<\"$result\"\n}\ndns=$(kubectl get deployment station-dns -o json 2>/dev/null || true)\nservice=$(kubectl get service station-dns -o json 2>/dev/null || true)\ncheck 'station-dns command = /coredns -conf /etc/station/Corefile' '.spec.template.spec.containers[0].command==[\"/coredns\",\"-conf\",\"/etc/station/Corefile\"]' \"$dns\"\ncheck 'station-dns ports = TCP/UDP 53 to 1053' '[.spec.ports[] | [.port,.targetPort,.protocol]] | sort == [[53,1053,\"TCP\"],[53,1053,\"UDP\"]]' \"$service\"\ncore=$(kubectl get configmap station-dns -o jsonpath='{.data.Corefile}' 2>/dev/null || true)\nexpected=$(cat /run/dq/facts/0/expected-dns-address 2>/dev/null || true)\nif ! test -n \"$expected\" || ! python3 - \"$core\" \"$expected\" <<'DQ_CORE'\nimport re,sys\nactual=re.sub(r'\\s+',' ',sys.argv[1]).strip()\nexpected='.:1053 { errors hosts { '+sys.argv[2].strip()+' north.station.internal ttl 1 } }'\nsys.exit(actual!=expected)\nDQ_CORE\nthen printf '%s\\n' 'station-dns Corefile matches supplied hosts, port and TTL: ✗'; failed=1; fi\ndns_ip=$(kubectl get service station-dns -o jsonpath='{.spec.clusterIP}' 2>/dev/null || true)\nclient=$(kubectl get deployment client -o json 2>/dev/null || true)\ncheck 'deployment/client dnsPolicy = None' '.spec.template.spec.dnsPolicy==\"None\"' \"$client\"\nif ! test -n \"$dns_ip\" || ! jq -e --arg ip \"$dns_ip\" '.spec.template.spec.dnsConfig.nameservers==[$ip]' <<<\"$client\" >/dev/null 2>&1; then printf '%s\\n' 'deployment/client nameservers = [station-dns Service IP]: ✗'; failed=1; fi\nexpected=$(cat /run/dq/facts/0/expected-dns-address 2>/dev/null || true)\nlookup=''\nif test -n \"$dns_ip\" && test -n \"$expected\"; then\n  if ! lookup=$(timeout 4s kubectl exec --pod-running-timeout=2s deployment/client -- nslookup north.station.internal \"$dns_ip\" 2>/dev/null); then lookup=''; fi\nfi\nif ! test -n \"$expected\" || ! dns_answer_has \"$lookup\" \"$expected\"; then printf '%s\\n' 'client DNS north.station.internal answer = expected-dns-address: ✗'; failed=1; fi\nif ! test \"$(timeout 4s kubectl exec --pod-running-timeout=2s deployment/client -- wget -qO- -T 3 http://north.station.internal:8080 2>/dev/null)\" = north-105; then printf '%s\\n' 'client north.station.internal:8080 = north-105: ✗'; failed=1; fi\nexit \"$failed\"\n"
