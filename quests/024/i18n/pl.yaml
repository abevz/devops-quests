title: Ograniczenia planowania
brief: |-
  SignalRail nie może uruchomić obciążenia przetwarzającego.

  Pracuj na workstation w `~/quest` z dostarczonymi plikami:
  - `deployment.yaml`.

  **Wymagania:**

  - Dostępność obciążenia:
    - Deployment: `relay`.
    - Stan: Rollout zakończony.

  Wynik rollout opisuje stan w chwili sprawdzenia; nie dowodzi metody naprawy ani przyszłej dostępności.
stages.0.brief: Ogranicz odzyskiwanie do dostarczonego obciążenia.
stages.0.objectives.0.text: Deployment `relay` kończy rollout.
hints.0.text: Planowanie wymaga odpowiedniego umiejscowienia i dostępnych zasobów.
hints.1.text: |-
  Opisz Pending pod i przeczytaj planowanie wydarzeń. Istnieją dwie blokady: node selector i nadmierne żądanie CPU.

  Sprawdź dostarczone dane i bieżące obserwacje:

  ```sh
  kubectl get nodes --show-labels
  kubectl describe pod -l app=relay
  ```
hints.2.text: |-
  Usuń ograniczenie fikcyjnej strefy, użyj małego CPU request i sprawdź rollout.

  Sprawdź wynik z `~/quest` na workstation:

  - `kubectl get deployment relay` — pokazuje liczbę zaktualizowanych i dostępnych replik zgodną z liczbą żądaną.
  - `kubectl rollout status deployment/relay --timeout=3s` — kończy się kodem `0` i zgłasza zakończony rollout.
debrief: worker zażądał niemożliwego węzła i za dużo CPU. Poprawiłeś oba ograniczenia i zweryfikowałeś
  scheduling i readiness.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
