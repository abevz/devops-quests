title: Ograniczenia planowania
brief: 'Dołączyłeś do operacji SignalRail. worker zażądał węzła, który nie istnieje. Pracuj w ~/quest.
  Wszystkie zmiany przechowuj w tej komorze szkoleniowej.


  Wejścia w `~/quest`: `deployment.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Wszystkie zmiany muszą pozostać w tej zatoce.


  Początkowe kryteria sukcesu: Relay jest zaplanowany i gotowy.'
stages.0.brief: 'Ograniczenie harmonogramu i żądanie CPU zablokowały worker.


  Kryteria sukcesu: Relay jest zaplanowany i gotowy.'
stages.0.objectives.0.text: Relay jest zaplanowany i gotowy.
hints.0.text: Opisz Pending pod i przeczytaj planowanie wydarzeń.
hints.1.text: 'Istnieją dwie blokady: node selector i nadmierne żądanie CPU.'
hints.2.text: Usuń ograniczenie fikcyjnej strefy, użyj małego CPU request i sprawdź rollout.
debrief: worker zażądał niemożliwego węzła i za dużo CPU. Poprawiłeś oba ograniczenia i zweryfikowałeś
  scheduling i readiness.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
