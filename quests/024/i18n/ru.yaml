title: Ограничения планирования
brief: |-
  SignalRail не может запустить обработку.

  Работайте на workstation в `~/quest` с предоставленными файлами:
  - `deployment.yaml`.

  **Требования:**

  - Доступность нагрузки:
    - Deployment: `relay`.
    - Состояние: Rollout завершён.

  Результат rollout описывает состояние в момент проверки, но не доказывает способ исправления или будущую доступность.
stages.0.brief: Ограничьте восстановление предоставленной нагрузкой.
stages.0.objectives.0.text: Deployment `relay` завершает rollout.
hints.0.text: Для планирования нужны и подходящее размещение, и доступные ресурсы.
hints.1.text: |-
  Выполните describe для Pending pod и прочитайте события scheduler. Есть два препятствия: node selector и чрезмерный запрос CPU.

  Изучите предоставленные файлы и живые наблюдения:

  ```sh
  kubectl get nodes --show-labels
  kubectl describe pod -l app=relay
  ```
hints.2.text: |-
  Уберите вымышленный zone selector, задайте небольшой CPU request и проверьте rollout.

  Проверьте результат из `~/quest` на workstation:

  - `kubectl get deployment relay` — показывает, что число обновлённых и доступных реплик соответствует желаемому.
  - `kubectl rollout status deployment/relay --timeout=3s` — завершается с кодом `0` и сообщает о завершённом rollout.
debrief: Worker запросил несуществующий узел и слишком много CPU. Вы исправили оба ограничения и проверили
  scheduling и readiness.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: После изменения я проверил состояние workload и его готовность.
