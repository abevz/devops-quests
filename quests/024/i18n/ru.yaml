title: Ограничения планирования
brief: |
  SignalRail не может запустить обработку.

  Работайте на workstation в `~/quest` с файлами `deployment.yaml`.

  **Требования:**
  - Доступность нагрузки:
    - Deployment: `relay`.
    - Состояние: Rollout завершён.

  **Самопроверка перед Check & finish:**
  - `kubectl get deployment relay` — показывает, что число обновлённых и доступных реплик соответствует желаемому.
  - `kubectl rollout status deployment/relay --timeout=3s` — завершается с кодом `0` и сообщает о завершённом rollout.
stages.0.brief: |
  Обрабатывающая нагрузка должна стать доступной.
stages.0.objectives.0.text: Deployment `relay` завершает rollout.
hints.0.text: Выполните describe для Pending pod и прочитайте события scheduler.
hints.1.text: 'Есть два препятствия: node selector и чрезмерный запрос CPU.'
hints.2.text: Уберите вымышленный zone selector, задайте небольшой CPU request и проверьте rollout.
debrief: Worker запросил несуществующий узел и слишком много CPU. Вы исправили оба ограничения и проверили
  scheduling и readiness.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: После изменения я проверил состояние workload и его готовность.
