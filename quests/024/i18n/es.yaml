title: Restricciones de programación
brief: |
  SignalRail no puede ejecutar su carga de procesamiento.

  Trabaja en la workstation en `~/quest` con `deployment.yaml`.

  **Requisitos:**
  - Disponibilidad de la carga:
    - Deployment: `relay`.
    - Estado: Rollout completado.

  **Verifica antes de Check & finish:**
  - `kubectl get deployment relay` — muestra que las réplicas actualizadas y disponibles coinciden con la cantidad deseada.
  - `kubectl rollout status deployment/relay --timeout=3s` — termina con código `0` e informa de un rollout completado.
stages.0.brief: |
  La carga de procesamiento debe estar disponible.
stages.0.objectives.0.text: El Deployment `relay` completa su rollout.
hints.0.text: Describe el Pending pod y lee la programación de eventos.
hints.1.text: 'Hay dos bloqueadores: el node selector y una solicitud excesiva de CPU.'
hints.2.text: Elimine la restricción ficticia zone, use un pequeño CPU request y verifique el rollout.
debrief: El worker solicitó un nodo imposible y demasiado CPU. Corregió ambas restricciones y verificó
  scheduling y readiness.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el estado de workload y su preparación después del cambio.
