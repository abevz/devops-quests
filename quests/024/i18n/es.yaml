title: Restricciones de programación
brief: |-
  SignalRail no puede ejecutar su carga de procesamiento.

  Trabaja en la workstation en `~/quest` con los archivos suministrados:
  - `deployment.yaml`.

  **Requisitos:**

  - Disponibilidad de la carga:
    - Deployment: `relay`.
    - Estado: Rollout completado.

  El resultado del rollout describe el estado al comprobarlo; no demuestra el método de reparación ni disponibilidad futura.
stages.0.brief: Limita la recuperación a la carga suministrada.
stages.0.objectives.0.text: El Deployment `relay` completa su rollout.
hints.0.text: La planificación requiere una ubicación válida y recursos disponibles.
hints.1.text: |-
  Describe el Pending pod y lee la programación de eventos. Hay dos bloqueadores: el node selector y una solicitud excesiva de CPU.

  Inspecciona los datos suministrados y las observaciones activas:

  ```sh
  kubectl get nodes --show-labels
  kubectl describe pod -l app=relay
  ```
hints.2.text: |-
  Elimine la restricción ficticia zone, use un pequeño CPU request y verifique el rollout.

  Verifica el resultado desde `~/quest` en la workstation:

  - `kubectl get deployment relay` — muestra que las réplicas actualizadas y disponibles coinciden con la cantidad deseada.
  - `kubectl rollout status deployment/relay --timeout=3s` — termina con código `0` e informa de un rollout completado.
debrief: El worker solicitó un nodo imposible y demasiado CPU. Corregió ambas restricciones y verificó
  scheduling y readiness.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el estado de workload y su preparación después del cambio.
