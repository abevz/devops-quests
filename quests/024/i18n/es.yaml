title: Restricciones de programación
brief: 'Te uniste a las operaciones de SignalRail. Un worker solicitó un nodo que no existía. Trabajar
  en ~/quest. Mantenga todos los cambios dentro de esta bahía de entrenamiento.


  Entradas en `~/quest`: `deployment.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente los archivos suministrados, las imágenes
  precargadas y los servicios privados. Todos los cambios deben permanecer dentro de esta bahía.


  Criterios de éxito iniciales: Relay está programado y listo.'
stages.0.brief: 'Una restricción de programación y una solicitud CPU bloquearon el worker.


  Criterios de éxito: Relay está programado y listo.'
stages.0.objectives.0.text: Relay está programado y listo.
hints.0.text: Describe el Pending pod y lee la programación de eventos.
hints.1.text: 'Hay dos bloqueadores: el node selector y una solicitud excesiva de CPU.'
hints.2.text: Elimine la restricción ficticia zone, use un pequeño CPU request y verifique el rollout.
debrief: El worker solicitó un nodo imposible y demasiado CPU. Corregió ambas restricciones y verificó
  scheduling y readiness.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el estado de workload y su preparación después del cambio.
