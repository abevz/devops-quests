title: Scheduling constraints
brief: |-
  SignalRail cannot run its processing workload.

  Work on the workstation in `~/quest` with the supplied files:
  - `deployment.yaml`.

  **Requirements:**

  - Workload availability:
    - Deployment: `relay`.
    - Status: Rollout completes.

  The rollout result describes the state at the time of the check; it does not prove the repair method or future availability.
stages.0.brief: Keep recovery scoped to the supplied workload.
stages.0.objectives.0.text: Deployment `relay` completes its rollout.
hints.0.text: Scheduling requires both eligible placement and available resources.
hints.1.text: |-
  Describe the Pending pod and read scheduling events. There are two blockers: the node selector and an excessive CPU request.

  Inspect the supplied inputs and live observations:

  ```sh
  kubectl get nodes --show-labels
  kubectl describe pod -l app=relay
  ```
hints.2.text: |-
  Remove the fictional zone constraint, use a small CPU request and verify the rollout.

  Verify the result from `~/quest` on the workstation:

  - `kubectl get deployment relay` — shows the updated and available replica counts matching the desired count.
  - `kubectl rollout status deployment/relay --timeout=3s` — exits `0` and reports a completed rollout.
debrief: The worker requested an impossible node and too much CPU. You corrected both constraints and
  verified scheduling and readiness.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked the workload state and its readiness after the change.
