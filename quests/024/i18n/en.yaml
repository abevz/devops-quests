title: Scheduling constraints
brief: |
  SignalRail cannot run its processing workload.

  Work on the workstation in `~/quest` with `deployment.json`.

  **Requirements:**
  - Workload availability:
    - Deployment: `relay`.
    - Status: Rollout completes.

  **Verify yourself before Check & finish:**
  - `kubectl get deployment relay` — shows the updated and available replica counts matching the desired count.
  - `kubectl rollout status deployment/relay --timeout=3s` — exits `0` and reports a completed rollout.
stages.0.brief: |
  The processing workload must become available.
stages.0.objectives.0.text: Deployment `relay` completes its rollout.
hints.0.text: Describe the Pending pod and read scheduling events.
hints.1.text: 'There are two blockers: the node selector and an excessive CPU request.'
hints.2.text: Remove the fictional zone constraint, use a small CPU request and verify the rollout.
debrief: The worker requested an impossible node and too much CPU. You corrected both constraints and
  verified scheduling and readiness.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked the workload state and its readiness after the change.
