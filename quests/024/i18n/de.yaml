title: Terminbeschränkungen
brief: |-
  SignalRail kann seine Verarbeitungslast nicht ausführen.

  Arbeiten Sie auf der Workstation in `~/quest` mit den bereitgestellten Dateien:
  - `deployment.yaml`.

  **Anforderungen:**

  - Verfügbarkeit des Workloads:
    - Deployment: `relay`.
    - Status: Rollout abgeschlossen.

  Das Rollout-Ergebnis beschreibt den Zustand zum Prüfzeitpunkt, beweist aber weder die Reparaturmethode noch künftige Verfügbarkeit.
stages.0.brief: Beschränken Sie die Wiederherstellung auf den bereitgestellten Workload.
stages.0.objectives.0.text: Deployment `relay` schließt seinen Rollout ab.
hints.0.text: Scheduling erfordert sowohl geeignete Platzierung als auch verfügbare Ressourcen.
hints.1.text: |-
  Beschreiben Sie die Pending pod und lesen Sie Planungsereignisse. Es gibt zwei Blocker: die node selector und eine übermäßige CPU-Anfrage.

  Prüfen Sie die bereitgestellten Eingaben und laufenden Beobachtungen:

  ```sh
  kubectl get nodes --show-labels
  kubectl describe pod -l app=relay
  ```
hints.2.text: |-
  Entfernen Sie die fiktive zone-Einschränkung, verwenden Sie eine kleine CPU-Anfrage und überprüfen Sie rollout.

  Prüfen Sie das Ergebnis in `~/quest` auf der Workstation:

  - `kubectl get deployment relay` — zeigt aktualisierte und verfügbare Replikazahlen entsprechend der Sollzahl.
  - `kubectl rollout status deployment/relay --timeout=3s` — endet mit Code `0` und meldet einen abgeschlossenen Rollout.
debrief: Der worker hat einen unmöglichen Knoten und zu viel CPU angefordert. Sie haben beide Einschränkungen
  korrigiert und scheduling und readiness überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe den workload-Status und seine Bereitschaft nach der Änderung überprüft.
