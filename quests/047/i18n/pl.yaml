title: Wersjonowanie modułu
brief: |-
  Odbiorca `station` potrzebuje nowszego kontraktu, a `depot` musi zachować swój kontrakt.

  Pracuj na workstation w `~/quest` z plikami `main.tf`, `modules/v1/main.tf`, `modules/v2/main.tf`.

  **Wymagania:**
  - Stan OpenTofu:
    - OpenTofu zachowuje pierwotny niepusty zbiór zasobów.
  - Wyjścia główne:
    - Nazwa wyjścia: `ids`.
    - Wyjście `ids` zachowuje pierwotne identyfikatory dostawcy.
  - Pliki na workstation:
    - `~/quest/north.txt`: `north-47`.
    - `~/quest/depot.txt`: `depot-47`.
  - Wyjścia główne:
    - `contracts`: `station`, `depot`.
    - `station`: release `2`; `depot`: release `1`.
    - Suma kontrolna `station` jest równa SHA-256 pliku `~/quest/north.txt` na workstation.
  - Zapisany plan na workstation:
    - Ścieżka: `~/quest/upgrade-plan.json`.
    - Każda akcja zasobu to `no-op`.
  - Zbieżność infrastruktury:
    - Brak oczekujących zmian infrastruktury; kod zakończenia szczegółowego planu `0`.

  Sprawdzenie bada zapisany plan; nie dowodzi czasu jego utworzenia.
debrief: Zapisane adresy i wyjścia ID, zawartość plików, kontrakty modułów i zapisany plan odpowiadają
  kontrolom aktualizacji.
stages.0.brief: Spełnij oba kontrakty modułów z zapisanymi tożsamościami zasobów.
hints.0.text: Zmiana source nie wymaga zmiany adresów modułów ani zasobów.
hints.1.text: |-
  Zaktualizowany interfejs jest w modules/v2; depot musi zachować modules/v1.

  Sprawdź dostarczoną konfigurację i bieżące obserwacje na workstation:

  Zmień tylko źródło station na ./modules/v2. Po edycji ponownie zainicjalizuj konfigurację i zapisz plan do sprawdzenia. Przed zastosowaniem zapisanego planu potwierdź, że wszystkie akcje zarządzanych zasobów to no-op.

  ```sh
  cat main.tf
  cat modules/v1/main.tf
  cat modules/v2/main.tf
  tofu state list
  ```

  Po zmianie źródła wygeneruj pliki do sprawdzenia.

  ```sh
  tofu init -input=false -no-color &&
    tofu plan -input=false -no-color -out=upgrade.plan &&
    tofu show -json upgrade.plan > upgrade-plan.json
  ```

  Sprawdź zapisany plan i zastosuj go tylko wtedy, gdy wszystkie akcje zasobów to no-op.

  ```sh
  jq -e 'all(.resource_changes[]; .change.actions == ["no-op"])' upgrade-plan.json >/dev/null &&
    tofu apply -input=false -no-color upgrade.plan
  ```
hints.2.text: |-
  Sprawdź wynik z `~/quest` na workstation:

  - `diff -u <(tofu state list | sort) <(sort original-addresses); tofu output -json ids | jq -e --slurpfile old original-ids.json '. == $old[0]'` — Brak różnic listy zasobów; porównanie ID wypisuje `true`.
  - `cat north.txt depot.txt; tofu output -json contracts; sha256sum north.txt` — Pliki pokazują `north-47` i `depot-47`; `station` podaje wydanie `2` i wyświetloną sumę kontrolną, a `depot` wydanie `1`.
  - `jq -r '.resource_changes[] | .address + " " + (.change.actions | join(","))' upgrade-plan.json; tofu plan -input=false -detailed-exitcode -no-color` — Każda zapisana akcja to `no-op`; bieżący plan kończy się kodem `0` bez zmian.

  Zapisany plan musi też zawierać wydanie 2 i bieżącą sumę station oraz wydanie 1 dla depot.

  ```sh
  jq '.planned_values.outputs.contracts.value' upgrade-plan.json
  ```
phrases.0: Zaktualizowałem jedno źródło modułu lokalnego, zachowując jego adresy wywołań i zasobów.
phrases.1: Sprawdziłem zapisany plan, do którego dodano output bez wymiany plików.
phrases.2: Po aktualizacji modułu zweryfikowałem dostawcę IDs i pusty końcowy plan.
stages.0.objectives.0.text: OpenTofu zachowuje pierwotny niepusty zbiór zasobów.
stages.0.objectives.1.text: Wyjście `ids` zachowuje pierwotne identyfikatory dostawcy.
stages.0.objectives.2.text: Na workstation `north.txt` zawiera `north-47`; `depot.txt` zawiera `depot-47`.
stages.0.objectives.3.text: Wyjście `contracts` podaje wydanie `2` dla `station` z SHA-256 pliku `north.txt`
  na workstation oraz wydanie `1` dla `depot`.
stages.0.objectives.4.text: Plik `upgrade-plan.json` na workstation zawiera tylko akcje zasobów `no-op`.
stages.0.objectives.5.text: OpenTofu nie zgłasza oczekujących zmian infrastruktury.
diagnostics.condition_0: Bieżące adresy stanu różnią się od original-addresses lub są nieczytelne; mogło zmienić się wywołanie modułu albo adres zasobu, dodano zasoby lub brakuje zapisanej listy. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=module-upgrade-addresses)
diagnostics.condition_1: Wyjście ids różni się od original-ids.json lub jest nieczytelne; mogła zmienić się treść plików lub tożsamość zasobów, wyjścia nie zostały zastosowane albo zapisany JSON jest brakujący lub błędny. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=module-upgrade-identities)
diagnostics.condition_2: north.txt jest nieczytelny lub nie zawiera north-47; aktualizacja module.station mogła zmienić treść albo zarządzany plik zmieniono lub usunięto. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=module-upgrade-files)
diagnostics.condition_3: depot.txt jest nieczytelny lub nie zawiera depot-47; edycja albo apply mogły zmienić plik, który ma pozostać bez zmian wraz z module.depot. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=module-upgrade-files)
diagnostics.condition_4: contracts.station.release nie wynosi 2 lub jest nieczytelny; module.station może nadal używać modules/v1, inicjalizacja jest nieaktualna lub nowe wyjścia nie zostały zastosowane. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=module-upgrade-current-contracts)
diagnostics.condition_5: contracts.station.checksum nie odpowiada sha256(north.txt) lub jest nieczytelny; wyjście może nadal być nieobsługiwane albo nieaktualne lub north.txt zmieniono po apply. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=module-upgrade-current-contracts)
diagnostics.condition_6: contracts.depot.release nie wynosi 1 lub jest nieczytelny; module.depot mógł zostać zaktualizowany razem z module.station lub konfiguracja wyjść nie zachowuje poprzedniego kontraktu. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=module-upgrade-current-contracts)
diagnostics.condition_7: Zapisany upgrade-plan.json nie zawiera release 2 i bieżącej sumy pliku dla module.station; plan może być brakujący, błędny, starszy niż zmiana source albo nieaktualny po edycji pliku. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=module-upgrade-saved-contracts)
diagnostics.condition_8: Zapisany upgrade-plan.json nie zachowuje release 1 dla module.depot lub jest nieczytelny; mógł powstać po aktualizacji obu źródeł modułów albo z niewłaściwej konfiguracji. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=module-upgrade-saved-contracts)
diagnostics.condition_9: upgrade-plan.json jest nieczytelny lub zawiera działania zasobów inne niż no-op; zmiana adresów albo treści przy aktualizacji modułu może dodać tworzenie, aktualizację lub wymianę. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=module-upgrade-plan-actions)
diagnostics.condition_10: Bieżący plan nie zakończył się kodem 0; mogły pozostać niezastosowane wyjścia lub drift albo błędy konfiguracji, inicjalizacji modułu lub providera uniemożliwiły kontrolę. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=module-upgrade-live-plan)
