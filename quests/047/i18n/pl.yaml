title: Wersjonowanie modułu
brief: 'Dwie wersje modułów lokalnych są dostarczane w trybie offline. Wersja 2 dodaje wyjście checksum,
  zachowując jednocześnie adres i treść zasobu local_file. Aktualizacja tylko module.station z modules/v1
  do modules/v2; depot pozostaje na v1. Zapisz upgrade-plan.json przed złożeniem wniosku i zachowaj zapisane
  adresy i dostawcę IDs obu plików powiadomień. Nie jest konieczne pobieranie modułu.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `main.tf`, `modules/v1/main.tf`,
  `modules/v2/main.tf`, `original-addresses`, `original-ids.json`, `upgrade-plan.json`, `north.txt`, `depot.txt`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: Tylko station używa v2 i udostępnia swój prawdziwy plik checksum; depot
  pozostaje v1, oba adresy/IDs przetrwają, a końcowy plan jest pusty.'
debrief: Kontrakt na moduł lokalny zyskał output bez zmiany tożsamości zarządzanych zasobów.
stages.0.brief: 'Kryteria sukcesu: Tylko station używa v2 i udostępnia swój prawdziwy plik checksum; depot
  pozostaje v1, oba adresy/IDs przetrwają, a końcowy plan jest pusty.'
