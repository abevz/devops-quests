title: Wersjonowanie modułu
brief: |-
  Odbiorca `station` potrzebuje nowszego kontraktu, a `depot` musi zachować swój kontrakt.

  Pracuj na workstation w `~/quest` z plikami `main.tf`, `modules/v1/main.tf`, `modules/v2/main.tf`.

  **Wymagania:**
  - Stan OpenTofu:
    - OpenTofu zachowuje pierwotny niepusty zbiór zasobów.
  - Wyjścia główne:
    - Nazwa wyjścia: `ids`.
    - Wyjście `ids` zachowuje pierwotne identyfikatory dostawcy.
  - Pliki na workstation:
    - `~/quest/north.txt`: `north-47`.
    - `~/quest/depot.txt`: `depot-47`.
  - Wyjścia główne:
    - `contracts`: `station`, `depot`.
    - `station`: release `2`; `depot`: release `1`.
    - Suma kontrolna `station` jest równa SHA-256 pliku `~/quest/north.txt` na workstation.
  - Zapisany plan na workstation:
    - Ścieżka: `~/quest/upgrade-plan.json`.
    - Każda akcja zasobu to `no-op`.
  - Zbieżność infrastruktury:
    - Brak oczekujących zmian infrastruktury; kod zakończenia szczegółowego planu `0`.

  Sprawdzenie bada zapisany plan; nie dowodzi czasu jego utworzenia.
debrief: Zapisane adresy i wyjścia ID, zawartość plików, kontrakty modułów i zapisany plan odpowiadają
  kontrolom aktualizacji.
stages.0.brief: Spełnij oba kontrakty modułów z zapisanymi tożsamościami zasobów.
hints.0.text: Zmiana source nie wymaga zmiany adresów modułów ani zasobów.
hints.1.text: |-
  Zaktualizowany interfejs jest w modules/v2; depot musi zachować modules/v1.

  Sprawdź dostarczoną konfigurację i bieżące obserwacje na workstation:

  ```sh
  cat main.tf modules/v1/main.tf modules/v2/main.tf
  tofu state list
  ```
hints.2.text: |-
  Zmień tylko źródło station na ./modules/v2, ponownie zainicjalizuj i zastosuj zapisany plan.
  Zapisz plan binarny i wyeksportuj go przez tofu show -json do wymaganego artefaktu JSON.

  Sprawdź wynik z `~/quest` na workstation:

  - `diff -u <(tofu state list | sort) <(sort original-addresses); tofu output -json ids | jq -e --slurpfile old original-ids.json '. == $old[0]'` — Brak różnic listy zasobów; porównanie ID wypisuje `true`.
  - `cat north.txt depot.txt; tofu output -json contracts; sha256sum north.txt` — Pliki pokazują `north-47` i `depot-47`; `station` podaje wydanie `2` i wyświetloną sumę kontrolną, a `depot` wydanie `1`.
  - `jq -r '.resource_changes[] | .address + " " + (.change.actions | join(","))' upgrade-plan.json; tofu plan -input=false -detailed-exitcode -no-color` — Każda zapisana akcja to `no-op`; bieżący plan kończy się kodem `0` bez zmian.
phrases.0: Zaktualizowałem jedno źródło modułu lokalnego, zachowując jego adresy wywołań i zasobów.
phrases.1: Sprawdziłem zapisany plan, do którego dodano output bez wymiany plików.
phrases.2: Po aktualizacji modułu zweryfikowałem dostawcę IDs i pusty końcowy plan.
diagnostics.condition_0: original-addresses musi być niepusty i zawierać te same adresy co tofu state
  list.
diagnostics.condition_1: tofu output -json ids musi być równe original-ids.json.
diagnostics.condition_2: north.txt musi być równe north-47.
diagnostics.condition_3: depot.txt musi być równe depot-47.
diagnostics.condition_4: contracts.station.release musi być równe 2.
diagnostics.condition_5: contracts.station.checksum musi być równe sha256(north.txt).
diagnostics.condition_6: contracts.depot.release musi być równe 1.
diagnostics.condition_7: upgrade-plan.json station.source musi być równe ./modules/v2.
diagnostics.condition_8: upgrade-plan.json depot.source musi być równe ./modules/v1.
diagnostics.condition_9: Każdy wpis w upgrade-plan.json resource_changes musi mieć actions ["no-op"].
diagnostics.condition_10: Plan OpenTofu z detailed-exitcode musi zakończyć się kodem 0.
stages.0.objectives.0.text: OpenTofu zachowuje pierwotny niepusty zbiór zasobów.
stages.0.objectives.1.text: Wyjście `ids` zachowuje pierwotne identyfikatory dostawcy.
stages.0.objectives.2.text: Na workstation `north.txt` zawiera `north-47`; `depot.txt` zawiera `depot-47`.
stages.0.objectives.3.text: Wyjście `contracts` podaje wydanie `2` dla `station` z SHA-256 pliku `north.txt`
  na workstation oraz wydanie `1` dla `depot`.
stages.0.objectives.4.text: Plik `upgrade-plan.json` na workstation zawiera tylko akcje zasobów `no-op`.
stages.0.objectives.5.text: OpenTofu nie zgłasza oczekujących zmian infrastruktury.
