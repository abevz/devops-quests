title: Wersjonowanie modułu
brief: 'W `~/quest` przeczytaj `main.tf`, `modules/v1/main.tf`, `modules/v2/main.tf`, `original-addresses` i `original-ids.json`. Obie wersje modułu są lokalne i deklarują dostawcę offline. Zaktualizuj `module.station` z `./modules/v1` do `./modules/v2`, pozostawiając `module.depot` w `./modules/v1`. Połączony w podpowiedziach przewodnik wyjaśnia źródła i wyjścia modułów.


  Zapisz plan binarny i wyeksportuj go przez `tofu show -json` jako `upgrade-plan.json`. Zastosuj i sprawdź: zbiór adresów stanu odpowiada `original-addresses`, wyjście JSON `ids` odpowiada `original-ids.json`, `north.txt` zawiera `north-47`, a `depot.txt` zawiera `depot-47`. Wyjście `contracts` musi podawać wersję station 2 i sumę SHA-256 pliku `north.txt` oraz wersję depot 1. Zapisany plan JSON musi wskazywać powyższe źródła station i depot, a każda zmiana zasobu musi mieć akcje `["no-op"]`. Na koniec `tofu plan -input=false -detailed-exitcode -no-color` musi zwrócić kod 0 (brak zmian). Kontrola bada zapisany JSON, ale nie dowodzi, kiedy powstał. Pracuj tylko w zatoce offline.'
debrief: Zapisane adresy i wyjścia ID, zawartość plików, kontrakty modułów i zapisany plan odpowiadają kontrolom aktualizacji.
stages.0.brief: Adresy, ID, pliki, kontrakty i zapisany plan odpowiadają opisowi, a końcowy plan zwraca kod 0.
stages.0.objectives.0.text: Adresy, ID, pliki, kontrakty i zapisany plan odpowiadają opisowi, a końcowy plan zwraca kod 0.
hints.0.text: Zmiana source nie wymaga zmiany adresów modułów ani zasobów.
hints.1.text: Przed zastosowaniem sprawdź zapisany plan; to uaktualnienie nie powinno zastępować plików.
hints.2.text: Zmień tylko źródło station, zainicjuj ponownie, przejrzyj i zastosuj zapisany plan.
phrases.0: Zaktualizowałem jedno źródło modułu lokalnego, zachowując jego adresy wywołań i zasobów.
phrases.1: Sprawdziłem zapisany plan, do którego dodano output bez wymiany plików.
phrases.2: Po aktualizacji modułu zweryfikowałem dostawcę IDs i pusty końcowy plan.
