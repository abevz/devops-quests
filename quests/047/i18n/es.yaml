title: Versionado del módulo
brief: |-
  El consumidor de `station` necesita un contrato más reciente, mientras `depot` debe conservar el suyo.

  Trabaja en la workstation en `~/quest` con `main.tf`, `modules/v1/main.tf`, `modules/v2/main.tf`.

  **Requisitos:**
  - Estado de OpenTofu:
    - OpenTofu conserva el inventario original no vacío de recursos.
  - Salidas raíz:
    - Nombre de salida: `ids`.
    - La salida `ids` conserva los ID originales del proveedor.
  - Archivos en la workstation:
    - `~/quest/north.txt`: `north-47`.
    - `~/quest/depot.txt`: `depot-47`.
  - Salidas raíz:
    - `contracts`: `station`, `depot`.
    - `station`: release `2`; `depot`: release `1`.
    - La suma de `station` es el SHA-256 de `~/quest/north.txt` en la workstation.
  - Plan guardado en la workstation:
    - Ruta: `~/quest/upgrade-plan.json`.
    - Cada acción de recurso es `no-op`.
  - Convergencia de infraestructura:
    - Sin cambios de infraestructura pendientes; código de salida del plan detallado `0`.

  La comprobación examina el plan guardado; no demuestra cuándo se creó.
debrief: Las direcciones registradas y las salidas de ID, los archivos, los contratos de módulos y el
  plan guardado coinciden con las comprobaciones de actualización.
stages.0.brief: Cumple ambos contratos de módulo con las identidades de recurso registradas.
hints.0.text: Cambiar la fuente no necesita cambiar las direcciones del módulo o del recurso.
hints.1.text: |-
  La interfaz actualizada está en modules/v2; depot debe conservar modules/v1.

  Inspecciona la configuración suministrada y las observaciones actuales en la workstation:

  ```sh
  cat main.tf modules/v1/main.tf modules/v2/main.tf
  tofu state list
  ```
hints.2.text: |-
  Cambia solo la fuente de station a ./modules/v2, reinicializa y aplica el plan guardado.
  Guarda el plan binario y expórtalo con tofu show -json al artefacto JSON solicitado.

  Verifica el resultado desde `~/quest` en la workstation:

  - `diff -u <(tofu state list | sort) <(sort original-addresses); tofu output -json ids | jq -e --slurpfile old original-ids.json '. == $old[0]'` — No hay diferencias de inventario; la comparación de ID imprime `true`.
  - `cat north.txt depot.txt; tofu output -json contracts; sha256sum north.txt` — Los archivos muestran `north-47` y `depot-47`; `station` informa la versión `2` y la suma mostrada, y `depot` la versión `1`.
  - `jq -r '.resource_changes[] | .address + " " + (.change.actions | join(","))' upgrade-plan.json; tofu plan -input=false -detailed-exitcode -no-color` — Cada acción guardada es `no-op`; el plan actual termina con `0` sin cambios.
phrases.0: Actualicé la fuente de un módulo local manteniendo sus direcciones de llamadas y recursos.
phrases.1: Revisé un plan guardado que agregó una salida sin reemplazar los archivos.
phrases.2: Verifiqué provider IDs y un plan final vacío después de la actualización del módulo.
stages.0.objectives.0.text: OpenTofu conserva el inventario original no vacío de recursos.
stages.0.objectives.1.text: La salida `ids` conserva los ID originales del proveedor.
stages.0.objectives.2.text: En la workstation, `north.txt` contiene `north-47`; `depot.txt` contiene `depot-47`.
stages.0.objectives.3.text: La salida `contracts` informa la versión `2` de `station` con el SHA-256 de
  `north.txt` en la workstation, y la versión `1` de `depot`.
stages.0.objectives.4.text: El archivo `upgrade-plan.json` en la workstation registra solo acciones de
  recurso `no-op`.
stages.0.objectives.5.text: OpenTofu no informa cambios de infraestructura pendientes.
diagnostics.condition_0: Las direcciones actuales del estado difieren de original-addresses o no pueden leerse; puede haber cambiado una llamada de módulo o dirección, recursos extra o falta el inventario guardado. [Causa y comprobación](guides#guide=terraform-7.1&section=module-upgrade-addresses)
diagnostics.condition_1: La salida ids difiere de original-ids.json o es ilegible; puede haber cambiado el contenido o la identidad, las salidas no se aplicaron o el JSON guardado falta o es inválido. [Causa y comprobación](guides#guide=terraform-7.1&section=module-upgrade-identities)
diagnostics.condition_2: north.txt no puede leerse o no contiene north-47; la actualización de module.station puede haber cambiado el contenido o el archivo gestionado fue editado o eliminado. [Causa y comprobación](guides#guide=terraform-7.1&section=module-upgrade-files)
diagnostics.condition_3: depot.txt no puede leerse o no contiene depot-47; una edición o apply puede haber cambiado el archivo que debe conservarse con module.depot. [Causa y comprobación](guides#guide=terraform-7.1&section=module-upgrade-files)
diagnostics.condition_4: contracts.station.release no es 2 o no puede leerse; module.station puede seguir usando modules/v1, la inicialización está desactualizada o las salidas no se aplicaron. [Causa y comprobación](guides#guide=terraform-7.1&section=module-upgrade-current-contracts)
diagnostics.condition_5: contracts.station.checksum no coincide con sha256(north.txt) o no puede observarse; la salida puede seguir sin soporte o desactualizada, o north.txt cambió tras apply. [Causa y comprobación](guides#guide=terraform-7.1&section=module-upgrade-current-contracts)
diagnostics.condition_6: contracts.depot.release no es 1 o no puede leerse; module.depot puede haberse actualizado junto con module.station o las salidas ya no conservan su contrato anterior. [Causa y comprobación](guides#guide=terraform-7.1&section=module-upgrade-current-contracts)
diagnostics.condition_7: El upgrade-plan.json guardado no tiene release 2 y la suma actual para module.station; puede faltar, ser inválido, anterior al cambio de source o quedar desactualizado tras editar el archivo. [Causa y comprobación](guides#guide=terraform-7.1&section=module-upgrade-saved-contracts)
diagnostics.condition_8: El upgrade-plan.json guardado no conserva release 1 para module.depot o no puede leerse; puede haberse generado con ambos módulos actualizados o desde otra configuración. [Causa y comprobación](guides#guide=terraform-7.1&section=module-upgrade-saved-contracts)
diagnostics.condition_9: upgrade-plan.json no puede leerse o contiene acciones distintas de no-op; cambiar direcciones o contenido al actualizar el módulo puede introducir creaciones, cambios o reemplazos. [Causa y comprobación](guides#guide=terraform-7.1&section=module-upgrade-plan-actions)
diagnostics.condition_10: El plan actual no terminó con código 0; pueden quedar salidas sin aplicar o drift, o errores de configuración, inicialización de módulo o proveedor impidieron ejecutarlo. [Causa y comprobación](guides#guide=terraform-7.1&section=module-upgrade-live-plan)
