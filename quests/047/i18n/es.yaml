title: Versionado del módulo
brief: 'En `~/quest`, lee `main.tf`, `modules/v1/main.tf`, `modules/v2/main.tf`, `original-addresses` y `original-ids.json`. Ambas versiones del módulo son locales y declaran el proveedor sin conexión. Actualiza `module.station` de `./modules/v1` a `./modules/v2`, dejando `module.depot` en `./modules/v1`. La guía enlazada en las pistas explica fuentes y salidas de módulos.


  Guarda un plan binario y expórtalo con `tofu show -json` como `upgrade-plan.json`. Aplica y verifica: el conjunto de direcciones de estado coincide con `original-addresses`, la salida JSON `ids` con `original-ids.json`, `north.txt` contiene `north-47` y `depot.txt` contiene `depot-47`. La salida `contracts` debe indicar la versión 2 de station y la suma SHA-256 de `north.txt`, y la versión 1 de depot. El plan JSON guardado debe indicar las fuentes anteriores de station y depot, y cada cambio de recurso debe tener acciones `["no-op"]`. Finalmente, `tofu plan -input=false -detailed-exitcode -no-color` debe terminar con código 0 (sin cambios). La comprobación inspecciona el JSON guardado, pero no demuestra cuándo se creó. Trabaja solo en la bahía sin conexión.'
debrief: Las direcciones registradas y las salidas de ID, los archivos, los contratos de módulos y el plan guardado coinciden con las comprobaciones de actualización.
stages.0.brief: Las direcciones, ID, archivos, contratos y plan guardado coinciden con el enunciado, y el plan final termina con código 0.
stages.0.objectives.0.text: Las direcciones, ID, archivos, contratos y plan guardado coinciden con el enunciado, y el plan final termina con código 0.
hints.0.text: Cambiar la fuente no necesita cambiar las direcciones del módulo o del recurso.
hints.1.text: Inspeccione el plan guardado antes de aplicarlo; esta actualización no debería reemplazar
  los archivos.
hints.2.text: Cambie únicamente la fuente station, reinicie, revise y aplique el plan guardado.
phrases.0: Actualicé la fuente de un módulo local manteniendo sus direcciones de llamadas y recursos.
phrases.1: Revisé un plan guardado que agregó una salida sin reemplazar los archivos.
phrases.2: Verifiqué provider IDs y un plan final vacío después de la actualización del módulo.
