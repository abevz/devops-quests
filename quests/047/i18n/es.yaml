title: Versionado del módulo
brief: 'Se suministran dos versiones de módulo local sin conexión. La versión 2 agrega una salida checksum
  y al mismo tiempo conserva la dirección y el contenido del recurso local_file. Actualice solo module.station
  de modules/v1 a modules/v2; depot permanece en v1. Guarde upgrade-plan.json antes de aplicar y conserve
  las direcciones registradas y provider IDs de ambos archivos de aviso. No es necesario descargar ningún
  módulo.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `main.tf`, `modules/v1/main.tf`,
  `modules/v2/main.tf`, `original-addresses`, `original-ids.json`, `upgrade-plan.json`, `north.txt`, `depot.txt`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: solo station usa v2 y expone su archivo real checksum; depot sigue siendo
  v1, ambos addresses/IDs sobreviven y el último plan está vacío.'
debrief: Un contrato de módulo local obtuvo un resultado sin cambiar las identidades de los recursos administrados.
stages.0.brief: 'Criterios de éxito: solo station usa v2 y expone su archivo real checksum; depot sigue
  siendo v1, ambos addresses/IDs sobreviven y el último plan está vacío.'
stages.0.objectives.0.text: Sólo station usa v2 y expone su archivo real checksum; depot sigue siendo
  v1, ambos addresses/IDs sobreviven y el último plan está vacío.
hints.0.text: Cambiar la fuente no necesita cambiar las direcciones del módulo o del recurso.
hints.1.text: Inspeccione el plan guardado antes de aplicarlo; esta actualización no debería reemplazar
  los archivos.
hints.2.text: Cambie únicamente la fuente station, reinicie, revise y aplique el plan guardado.
phrases.0: Actualicé la fuente de un módulo local manteniendo sus direcciones de llamadas y recursos.
phrases.1: Revisé un plan guardado que agregó una salida sin reemplazar los archivos.
phrases.2: Verifiqué provider IDs y un plan final vacío después de la actualización del módulo.
