title: Versionado del módulo
brief: |-
  El consumidor de `station` necesita un contrato más reciente, mientras `depot` debe conservar el suyo.

  Trabaja en la workstation en `~/quest` con `main.tf`, `modules/v1/main.tf`, `modules/v2/main.tf`.

  **Requisitos:**
  - Estado de OpenTofu:
    - OpenTofu conserva el inventario original no vacío de recursos.
  - Salidas raíz:
    - Nombre de salida: `ids`.
    - La salida `ids` conserva los ID originales del proveedor.
  - Archivos en la workstation:
    - `~/quest/north.txt`: `north-47`.
    - `~/quest/depot.txt`: `depot-47`.
  - Salidas raíz:
    - `contracts`: `station`, `depot`.
    - `station`: release `2`; `depot`: release `1`.
    - La suma de `station` es el SHA-256 de `~/quest/north.txt` en la workstation.
  - Plan guardado en la workstation:
    - Ruta: `~/quest/upgrade-plan.json`.
    - Cada acción de recurso es `no-op`.
  - Convergencia de infraestructura:
    - Sin cambios de infraestructura pendientes; código de salida del plan detallado `0`.

  La comprobación examina el plan guardado; no demuestra cuándo se creó.
debrief: Las direcciones registradas y las salidas de ID, los archivos, los contratos de módulos y el
  plan guardado coinciden con las comprobaciones de actualización.
stages.0.brief: Cumple ambos contratos de módulo con las identidades de recurso registradas.
hints.0.text: Cambiar la fuente no necesita cambiar las direcciones del módulo o del recurso.
hints.1.text: |-
  La interfaz actualizada está en modules/v2; depot debe conservar modules/v1.

  Inspecciona la configuración suministrada y las observaciones actuales en la workstation:

  ```sh
  cat main.tf modules/v1/main.tf modules/v2/main.tf
  tofu state list
  ```
hints.2.text: |-
  Cambia solo la fuente de station a ./modules/v2, reinicializa y aplica el plan guardado.
  Guarda el plan binario y expórtalo con tofu show -json al artefacto JSON solicitado.

  Verifica el resultado desde `~/quest` en la workstation:

  - `diff -u <(tofu state list | sort) <(sort original-addresses); tofu output -json ids | jq -e --slurpfile old original-ids.json '. == $old[0]'` — No hay diferencias de inventario; la comparación de ID imprime `true`.
  - `cat north.txt depot.txt; tofu output -json contracts; sha256sum north.txt` — Los archivos muestran `north-47` y `depot-47`; `station` informa la versión `2` y la suma mostrada, y `depot` la versión `1`.
  - `jq -r '.resource_changes[] | .address + " " + (.change.actions | join(","))' upgrade-plan.json; tofu plan -input=false -detailed-exitcode -no-color` — Cada acción guardada es `no-op`; el plan actual termina con `0` sin cambios.
phrases.0: Actualicé la fuente de un módulo local manteniendo sus direcciones de llamadas y recursos.
phrases.1: Revisé un plan guardado que agregó una salida sin reemplazar los archivos.
phrases.2: Verifiqué provider IDs y un plan final vacío después de la actualización del módulo.
diagnostics.condition_0: original-addresses no debe estar vacío y debe listar las mismas direcciones que
  tofu state list.
diagnostics.condition_1: tofu output -json ids debe ser igual a original-ids.json.
diagnostics.condition_2: north.txt debe ser igual a north-47.
diagnostics.condition_3: depot.txt debe ser igual a depot-47.
diagnostics.condition_4: contracts.station.release debe ser igual a 2.
diagnostics.condition_5: contracts.station.checksum debe ser igual a sha256(north.txt).
diagnostics.condition_6: contracts.depot.release debe ser igual a 1.
diagnostics.condition_7: |-
  El contrato station de upgrade-plan.json debe indicar la versión 2 y el SHA-256 de north.txt.

diagnostics.condition_8: |-
  El contrato depot de upgrade-plan.json debe conservar la versión 1.

diagnostics.condition_9: Cada entrada de upgrade-plan.json resource_changes debe tener actions ["no-op"].
diagnostics.condition_10: El plan de OpenTofu con detailed-exitcode debe terminar con código 0.
stages.0.objectives.0.text: OpenTofu conserva el inventario original no vacío de recursos.
stages.0.objectives.1.text: La salida `ids` conserva los ID originales del proveedor.
stages.0.objectives.2.text: En la workstation, `north.txt` contiene `north-47`; `depot.txt` contiene `depot-47`.
stages.0.objectives.3.text: La salida `contracts` informa la versión `2` de `station` con el SHA-256 de
  `north.txt` en la workstation, y la versión `1` de `depot`.
stages.0.objectives.4.text: El archivo `upgrade-plan.json` en la workstation registra solo acciones de
  recurso `no-op`.
stages.0.objectives.5.text: OpenTofu no informa cambios de infraestructura pendientes.
