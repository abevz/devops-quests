title: Версии модулей
brief: |
  Потребителю `station` нужен новый контракт, а `depot` должен сохранить свой контракт.

  Работайте на workstation в `~/quest` с файлами `main.tf`, `modules/v1/main.tf`, `modules/v2/main.tf`, `original-addresses`, `original-ids.json`.

  **Требования:**
  - Состояние OpenTofu:
    - Состав совпадает с непустым `~/quest/original-addresses` на workstation.
  - Корневые выводы:
    - Имя вывода: `ids`.
    - Соответствующая квитанция на workstation: `~/quest/original-ids.json`.
  - Файлы на workstation:
    - `~/quest/north.txt`: `north-47`.
    - `~/quest/depot.txt`: `depot-47`.
  - Корневые выводы:
    - `contracts`: `station`, `depot`.
    - `station`: release `2`; `depot`: release `1`.
    - Контрольная сумма `station` равна SHA-256 файла `~/quest/north.txt` на workstation.
  - Сохранённый план на workstation:
    - Путь: `~/quest/upgrade-plan.json`.
    - Каждое действие ресурса — `no-op`.
  - Согласованность инфраструктуры:
    - Нет ожидающих изменений инфраструктуры; код завершения подробного плана `0`.

  **Самопроверка перед Check & finish:**
  - `diff -u <(tofu state list | sort) <(sort original-addresses); tofu output -json ids | jq -e --slurpfile old original-ids.json '. == $old[0]'` — Нет различий в составе; сравнение ID печатает `true`.
  - `cat north.txt depot.txt; tofu output -json contracts; sha256sum north.txt` — Файлы показывают `north-47` и `depot-47`; `station` сообщает версию `2` и показанную контрольную сумму, а `depot` — версию `1`.
  - `jq -r '.resource_changes[] | .address + " " + (.change.actions | join(","))' upgrade-plan.json; tofu plan -input=false -detailed-exitcode -no-color` — Каждое сохранённое действие — `no-op`; текущее планирование завершается с кодом `0` без изменений.

  Проверка изучает сохранённый план; она не доказывает, когда он был создан.
debrief: Записанные адреса и выходы ID, содержимое файлов, контракты модулей и сохранённый план соответствуют проверкам
  обновления.
stages.0.brief: Обеспечьте оба контракта модулей с записанными идентичностями ресурсов.
hints.0.text: Смена source не обязательно меняет адрес модуля или ресурса.
hints.1.text: Обновлённый интерфейс находится в modules/v2; depot должен сохранить modules/v1.
hints.2.text: |-
  Измените только источник station на ./modules/v2, выполните повторную инициализацию и примените сохранённый план.
  Сохраните бинарный план и экспортируйте его через tofu show -json в требуемый JSON-артефакт.
phrases.0: Я обновил источник одного локального модуля и сохранил адреса вызова и ресурсов.
phrases.1: Я изучил сохранённый plan с новым output без пересоздания файлов.
phrases.2: Я проверил provider ID и пустой итоговый plan после обновления модуля.
diagnostics.condition_0: original-addresses должен быть непустым и содержать те же адреса, что и tofu state list.
diagnostics.condition_1: tofu output -json ids должен совпадать с original-ids.json.
diagnostics.condition_2: north.txt должен совпадать с north-47.
diagnostics.condition_3: depot.txt должен совпадать с depot-47.
diagnostics.condition_4: contracts.station.release должен совпадать с 2.
diagnostics.condition_5: contracts.station.checksum должен совпадать с sha256(north.txt).
diagnostics.condition_6: contracts.depot.release должен совпадать с 1.
diagnostics.condition_7: upgrade-plan.json station.source должен совпадать с ./modules/v2.
diagnostics.condition_8: upgrade-plan.json depot.source должен совпадать с ./modules/v1.
diagnostics.condition_9: У каждой записи в upgrade-plan.json resource_changes должно быть actions ["no-op"].
diagnostics.condition_10: План OpenTofu с detailed-exitcode должен завершиться с кодом 0.
stages.0.objectives.0.text: Состав ресурсов состояния совпадает с непустым файлом `original-addresses` на workstation.
stages.0.objectives.1.text: Вывод `ids` совпадает с файлом `original-ids.json` на workstation.
stages.0.objectives.2.text: На workstation `north.txt` содержит `north-47`; `depot.txt` содержит `depot-47`.
stages.0.objectives.3.text: Вывод `contracts` сообщает версию `2` для `station` с SHA-256 файла `north.txt` на workstation
  и версию `1` для `depot`.
stages.0.objectives.4.text: Файл `upgrade-plan.json` на workstation содержит только действия ресурсов `no-op`.
stages.0.objectives.5.text: OpenTofu не сообщает об ожидающих изменениях инфраструктуры.
