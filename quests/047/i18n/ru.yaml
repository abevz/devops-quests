title: Версии модулей
brief: 'В `~/quest` изучите `main.tf`, `modules/v1/main.tf`, `modules/v2/main.tf`, `original-addresses` и `original-ids.json`. Обе версии модуля локальные и объявляют офлайн-провайдер. Обновите `module.station` с `./modules/v1` до `./modules/v2`, оставив `module.depot` на `./modules/v1`. Руководство в подсказках объясняет источники и выходы модулей.


  Сохраните бинарный план и экспортируйте его через `tofu show -json` в `upgrade-plan.json`. Примените и проверьте: множество адресов состояния совпадает с `original-addresses`, JSON-выход `ids` — с `original-ids.json`, `north.txt` содержит `north-47`, а `depot.txt` — `depot-47`. Выход `contracts` должен сообщать версию station 2 и SHA-256 файла `north.txt`, а также версию depot 1. Сохранённый JSON-план должен указывать вышеуказанные источники station и depot, а каждое изменение ресурса — действия `["no-op"]`. Наконец, `tofu plan -input=false -detailed-exitcode -no-color` должен завершиться с кодом 0 (изменений нет). Проверка читает сохранённый JSON, но не доказывает время его создания. Работайте только в офлайн-песочнице.'
debrief: Записанные адреса и выходы ID, содержимое файлов, контракты модулей и сохранённый план соответствуют проверкам обновления.
stages.0.brief: Адреса, ID, файлы, контракты и сохранённый план соответствуют заданию, итоговый план завершается с кодом 0.
stages.0.objectives.0.text: Адреса, ID, файлы, контракты и сохранённый план соответствуют заданию, итоговый план завершается с кодом 0.
hints.0.text: Смена source не обязательно меняет адрес модуля или ресурса.
hints.1.text: Изучите сохранённый plan до apply; это обновление не должно пересоздавать
  файлы.
hints.2.text: Измените только source station, повторите init, изучите и примените
  сохранённый plan.
phrases.0: Я обновил источник одного локального модуля и сохранил адреса вызова и
  ресурсов.
phrases.1: Я изучил сохранённый plan с новым output без пересоздания файлов.
phrases.2: Я проверил provider ID и пустой итоговый plan после обновления модуля.
