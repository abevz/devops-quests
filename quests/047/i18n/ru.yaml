title: Версии модулей
brief: 'Две версии локального модуля выданы без внешней загрузки. Версия 2 добавляет
  output checksum, сохраняя адрес и содержимое local_file. Обновите только module.station
  с modules/v1 на modules/v2; depot остаётся на v1. Перед apply сохраните upgrade-plan.json
  и сохраните записанные адреса и provider ID двух файлов. Скачивать модуль не нужно.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `main.tf`, `modules/v1/main.tf`,
  `modules/v2/main.tf`, `original-addresses`, `original-ids.json`, `upgrade-plan.json`,
  `north.txt`, `depot.txt`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно
  загруженные образы и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Только station использует v2 и выдаёт checksum реального файла;
  depot остаётся v1, адреса и ID сохранены, итоговый plan пуст.'
debrief: Контракт локального модуля получил output без изменения identity управляемых
  ресурсов.
stages.0.brief: 'Результат проверки: Только station использует v2 и выдаёт checksum
  реального файла; depot остаётся v1, адреса и ID сохранены, итоговый plan пуст.'
stages.0.objectives.0.text: Только station использует v2 и выдаёт checksum реального
  файла; depot остаётся v1, адреса и ID сохранены, итоговый plan пуст.
hints.0.text: Смена source не обязательно меняет адрес модуля или ресурса.
hints.1.text: Изучите сохранённый plan до apply; это обновление не должно пересоздавать
  файлы.
hints.2.text: Измените только source station, повторите init, изучите и примените
  сохранённый plan.
phrases.0: Я обновил источник одного локального модуля и сохранил адреса вызова и
  ресурсов.
phrases.1: Я изучил сохранённый plan с новым output без пересоздания файлов.
phrases.2: Я проверил provider ID и пустой итоговый plan после обновления модуля.
