title: Версии модулей
brief: |-
  Потребителю `station` нужен новый контракт, а `depot` должен сохранить свой контракт.

  Работайте на workstation в `~/quest` с файлами `main.tf`, `modules/v1/main.tf`, `modules/v2/main.tf`.

  **Требования:**
  - Состояние OpenTofu:
    - OpenTofu сохраняет исходный непустой состав ресурсов.
  - Корневые выводы:
    - Имя вывода: `ids`.
    - Выходное значение `ids` сохраняет исходные ID провайдера.
  - Файлы на workstation:
    - `~/quest/north.txt`: `north-47`.
    - `~/quest/depot.txt`: `depot-47`.
  - Корневые выводы:
    - `contracts`: `station`, `depot`.
    - `station`: release `2`; `depot`: release `1`.
    - Контрольная сумма `station` равна SHA-256 файла `~/quest/north.txt` на workstation.
  - Сохранённый план на workstation:
    - Путь: `~/quest/upgrade-plan.json`.
    - Каждое действие ресурса — `no-op`.
  - Согласованность инфраструктуры:
    - Нет ожидающих изменений инфраструктуры; код завершения подробного плана `0`.

  Проверка изучает сохранённый план; она не доказывает, когда он был создан.
debrief: Записанные адреса и выходы ID, содержимое файлов, контракты модулей и сохранённый план соответствуют
  проверкам обновления.
stages.0.brief: Обеспечьте оба контракта модулей с записанными идентичностями ресурсов.
hints.0.text: Смена source не обязательно меняет адрес модуля или ресурса.
hints.1.text: |-
  Обновлённый интерфейс находится в modules/v2; depot должен сохранить modules/v1.

  Изучите предоставленную конфигурацию и текущие наблюдения на workstation:

  ```sh
  cat main.tf modules/v1/main.tf modules/v2/main.tf
  tofu state list
  ```
hints.2.text: |-
  Измените только источник station на ./modules/v2, выполните повторную инициализацию и примените сохранённый план.
  Сохраните бинарный план и экспортируйте его через tofu show -json в требуемый JSON-артефакт.

  Проверьте результат из `~/quest` на workstation:

  - `diff -u <(tofu state list | sort) <(sort original-addresses); tofu output -json ids | jq -e --slurpfile old original-ids.json '. == $old[0]'` — Нет различий в составе; сравнение ID печатает `true`.
  - `cat north.txt depot.txt; tofu output -json contracts; sha256sum north.txt` — Файлы показывают `north-47` и `depot-47`; `station` сообщает версию `2` и показанную контрольную сумму, а `depot` — версию `1`.
  - `jq -r '.resource_changes[] | .address + " " + (.change.actions | join(","))' upgrade-plan.json; tofu plan -input=false -detailed-exitcode -no-color` — Каждое сохранённое действие — `no-op`; текущее планирование завершается с кодом `0` без изменений.
phrases.0: Я обновил источник одного локального модуля и сохранил адреса вызова и ресурсов.
phrases.1: Я изучил сохранённый plan с новым output без пересоздания файлов.
phrases.2: Я проверил provider ID и пустой итоговый plan после обновления модуля.
stages.0.objectives.0.text: OpenTofu сохраняет исходный непустой состав ресурсов.
stages.0.objectives.1.text: Выходное значение `ids` сохраняет исходные ID провайдера.
stages.0.objectives.2.text: На workstation `north.txt` содержит `north-47`; `depot.txt` содержит `depot-47`.
stages.0.objectives.3.text: Вывод `contracts` сообщает версию `2` для `station` с SHA-256 файла `north.txt`
  на workstation и версию `1` для `depot`.
stages.0.objectives.4.text: Файл `upgrade-plan.json` на workstation содержит только действия ресурсов
  `no-op`.
stages.0.objectives.5.text: OpenTofu не сообщает об ожидающих изменениях инфраструктуры.
diagnostics.condition_0: 'Текущие адреса state отличаются от original-addresses либо недоступны: могли измениться вызов модуля или адрес ресурса, добавиться ресурсы либо исчезнуть сохранённый список. [Причина и проверка](guides#guide=terraform-7.1&section=module-upgrade-addresses)'
diagnostics.condition_1: 'Выход ids отличается от original-ids.json либо недоступен: могли измениться содержимое файлов или идентичность ресурсов, outputs ещё не применены либо сохранённый JSON отсутствует или некорректен. [Причина и проверка](guides#guide=terraform-7.1&section=module-upgrade-identities)'
diagnostics.condition_2: 'north.txt недоступен либо не содержит north-47: обновление module.station могло изменить содержимое либо управляемый файл был изменён или удалён. [Причина и проверка](guides#guide=terraform-7.1&section=module-upgrade-files)'
diagnostics.condition_3: 'depot.txt недоступен либо не содержит depot-47: правка или apply могли изменить файл, который должен сохраняться вместе с module.depot. [Причина и проверка](guides#guide=terraform-7.1&section=module-upgrade-files)'
diagnostics.condition_4: 'contracts.station.release не равен 2 либо недоступен: module.station мог остаться на modules/v1, инициализация устарела либо новые outputs ещё не применены. [Причина и проверка](guides#guide=terraform-7.1&section=module-upgrade-current-contracts)'
diagnostics.condition_5: 'contracts.station.checksum не совпадает с sha256(north.txt) либо не прочитан: output мог остаться неподдерживаемым или устареть либо north.txt изменён после apply. [Причина и проверка](guides#guide=terraform-7.1&section=module-upgrade-current-contracts)'
diagnostics.condition_6: 'contracts.depot.release не равен 1 либо недоступен: module.depot мог обновиться вместе с module.station либо конфигурация outputs не сохраняет прежний контракт. [Причина и проверка](guides#guide=terraform-7.1&section=module-upgrade-current-contracts)'
diagnostics.condition_7: 'В сохранённом upgrade-plan.json для module.station нет release 2 и текущей контрольной суммы: план может отсутствовать, быть некорректен, создан до правки source либо устарел после изменения файла. [Причина и проверка](guides#guide=terraform-7.1&section=module-upgrade-saved-contracts)'
diagnostics.condition_8: 'Сохранённый upgrade-plan.json не сохраняет release 1 для module.depot либо недоступен: он мог быть создан с обновлением обоих source или из другой конфигурации. [Причина и проверка](guides#guide=terraform-7.1&section=module-upgrade-saved-contracts)'
diagnostics.condition_9: 'upgrade-plan.json недоступен либо содержит действия ресурсов помимо no-op: изменение адресов или содержимого при обновлении модуля может добавить создание, обновление или замену. [Причина и проверка](guides#guide=terraform-7.1&section=module-upgrade-plan-actions)'
diagnostics.condition_10: 'Живой plan не завершился с кодом 0: могли остаться неприменённые outputs или drift либо ошибки конфигурации, инициализации модуля или провайдера помешали проверке. [Причина и проверка](guides#guide=terraform-7.1&section=module-upgrade-live-plan)'
