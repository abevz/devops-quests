title: Module versioning
brief: |-
  The consumer of `station` needs a newer contract while `depot` must retain its contract.

  Work on the workstation in `~/quest` with `main.tf`, `modules/v1/main.tf`, `modules/v2/main.tf`.

  **Requirements:**
  - OpenTofu state:
    - OpenTofu retains the original nonempty resource inventory.
  - Root outputs:
    - Output name: `ids`.
    - The `ids` output retains the original provider IDs.
  - Files on the workstation:
    - `~/quest/north.txt`: `north-47`.
    - `~/quest/depot.txt`: `depot-47`.
  - Root outputs:
    - `contracts`: `station`, `depot`.
    - `station`: release `2`; `depot`: release `1`.
    - The `station` checksum equals SHA-256 of `~/quest/north.txt` on the workstation.
  - Saved plan on the workstation:
    - Path: `~/quest/upgrade-plan.json`.
    - Every resource action is `no-op`.
  - Infrastructure convergence:
    - No pending infrastructure changes; detailed-plan exit code `0`.

  The check inspects the saved plan; it cannot prove when it was created.
debrief: The recorded addresses and ID outputs, file contents, module contracts and saved plan match the
  upgrade checks.
stages.0.brief: Meet both module contracts with the recorded resource identities.
hints.0.text: Changing source need not change module or resource addresses.
hints.1.text: |-
  The upgraded interface is in modules/v2; depot must keep modules/v1.

  Inspect the supplied configuration and live observations on the workstation:

  ```sh
  cat main.tf modules/v1/main.tf modules/v2/main.tf
  tofu state list
  ```
hints.2.text: |-
  Change only the station source to ./modules/v2, reinitialize and apply the saved plan.
  Save the binary plan and export it with tofu show -json to the requested JSON artifact.

  Verify the result from `~/quest` on the workstation:

  - `diff -u <(tofu state list | sort) <(sort original-addresses); tofu output -json ids | jq -e --slurpfile old original-ids.json '. == $old[0]'` — No inventory differences; the ID comparison prints `true`.
  - `cat north.txt depot.txt; tofu output -json contracts; sha256sum north.txt` — Files show `north-47` and `depot-47`; `station` reports release `2` and the displayed checksum, while `depot` reports release `1`.
  - `jq -r '.resource_changes[] | .address + " " + (.change.actions | join(","))' upgrade-plan.json; tofu plan -input=false -detailed-exitcode -no-color` — Every saved action is `no-op`; current planning exits `0` with no changes.
phrases.0: I upgraded one local module source while keeping its call and resource addresses.
phrases.1: I reviewed a saved plan that added an output without replacing the files.
phrases.2: I verified provider IDs and an empty final plan after the module upgrade.
stages.0.objectives.0.text: OpenTofu retains the original nonempty resource inventory.
stages.0.objectives.1.text: The `ids` output retains the original provider IDs.
stages.0.objectives.2.text: On the workstation, `north.txt` contains `north-47`; `depot.txt` contains
  `depot-47`.
stages.0.objectives.3.text: The `contracts` output reports `station` release `2` with the SHA-256 of workstation
  `north.txt`, and `depot` release `1`.
stages.0.objectives.4.text: Workstation `upgrade-plan.json` records only `no-op` resource actions.
stages.0.objectives.5.text: OpenTofu reports no pending infrastructure changes.
diagnostics.condition_0: The current state addresses differ from original-addresses or cannot be read; a module call or resource address may have changed, extra resources were added, or the saved inventory is missing. [Cause and check](guides#guide=terraform-7.1&section=module-upgrade-addresses)
diagnostics.condition_1: The ids output differs from original-ids.json or is unreadable; file content or resource identity may have changed, outputs may not have been applied, or the saved JSON is missing or invalid. [Cause and check](guides#guide=terraform-7.1&section=module-upgrade-identities)
diagnostics.condition_2: north.txt is unreadable or does not contain north-47; upgrading module.station may have changed its file content or the managed file has been edited or removed. [Cause and check](guides#guide=terraform-7.1&section=module-upgrade-files)
diagnostics.condition_3: depot.txt is unreadable or does not contain depot-47; an edit or apply may have changed the file that should remain unchanged with module.depot. [Cause and check](guides#guide=terraform-7.1&section=module-upgrade-files)
diagnostics.condition_4: contracts.station.release is not 2 or cannot be read; module.station may still use modules/v1, initialization may be stale, or the changed outputs have not been applied. [Cause and check](guides#guide=terraform-7.1&section=module-upgrade-current-contracts)
diagnostics.condition_5: contracts.station.checksum does not match sha256(north.txt) or cannot be observed; the output may still be unsupported or stale, or north.txt changed after the apply. [Cause and check](guides#guide=terraform-7.1&section=module-upgrade-current-contracts)
diagnostics.condition_6: contracts.depot.release is not 1 or cannot be read; module.depot may have been upgraded along with module.station or the output configuration no longer retains its old contract. [Cause and check](guides#guide=terraform-7.1&section=module-upgrade-current-contracts)
diagnostics.condition_7: The saved upgrade-plan.json lacks the required release 2 and current file checksum for module.station; the plan may be missing, invalid, older than the source change or stale after a file edit. [Cause and check](guides#guide=terraform-7.1&section=module-upgrade-saved-contracts)
diagnostics.condition_8: The saved upgrade-plan.json does not retain release 1 for module.depot or cannot be read; it may have been generated with both module sources upgraded or from the wrong configuration. [Cause and check](guides#guide=terraform-7.1&section=module-upgrade-saved-contracts)
diagnostics.condition_9: upgrade-plan.json is unreadable or contains resource actions other than no-op; changing resource addresses or file content during the module upgrade can introduce creates, updates or replacements. [Cause and check](guides#guide=terraform-7.1&section=module-upgrade-plan-actions)
diagnostics.condition_10: The live plan did not exit 0; unapplied output changes or drift may remain, or configuration, module initialization or provider errors prevented the plan from running. [Cause and check](guides#guide=terraform-7.1&section=module-upgrade-live-plan)
