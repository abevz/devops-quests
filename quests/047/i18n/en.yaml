title: Module versioning
brief: |-
  The consumer of `station` needs a newer contract while `depot` must retain its contract.

  Work on the workstation in `~/quest` with `main.tf`, `modules/v1/main.tf`, `modules/v2/main.tf`.

  **Requirements:**
  - OpenTofu state:
    - OpenTofu retains the original nonempty resource inventory.
  - Root outputs:
    - Output name: `ids`.
    - The `ids` output retains the original provider IDs.
  - Files on the workstation:
    - `~/quest/north.txt`: `north-47`.
    - `~/quest/depot.txt`: `depot-47`.
  - Root outputs:
    - `contracts`: `station`, `depot`.
    - `station`: release `2`; `depot`: release `1`.
    - The `station` checksum equals SHA-256 of `~/quest/north.txt` on the workstation.
  - Saved plan on the workstation:
    - Path: `~/quest/upgrade-plan.json`.
    - Every resource action is `no-op`.
  - Infrastructure convergence:
    - No pending infrastructure changes; detailed-plan exit code `0`.

  The check inspects the saved plan; it cannot prove when it was created.
debrief: The recorded addresses and ID outputs, file contents, module contracts and saved plan match the
  upgrade checks.
stages.0.brief: Meet both module contracts with the recorded resource identities.
hints.0.text: Changing source need not change module or resource addresses.
hints.1.text: |-
  The upgraded interface is in modules/v2; depot must keep modules/v1.

  Inspect the supplied configuration and live observations on the workstation:

  ```sh
  cat main.tf modules/v1/main.tf modules/v2/main.tf
  tofu state list
  ```
hints.2.text: |-
  Change only the station source to ./modules/v2, reinitialize and apply the saved plan.
  Save the binary plan and export it with tofu show -json to the requested JSON artifact.

  Verify the result from `~/quest` on the workstation:

  - `diff -u <(tofu state list | sort) <(sort original-addresses); tofu output -json ids | jq -e --slurpfile old original-ids.json '. == $old[0]'` — No inventory differences; the ID comparison prints `true`.
  - `cat north.txt depot.txt; tofu output -json contracts; sha256sum north.txt` — Files show `north-47` and `depot-47`; `station` reports release `2` and the displayed checksum, while `depot` reports release `1`.
  - `jq -r '.resource_changes[] | .address + " " + (.change.actions | join(","))' upgrade-plan.json; tofu plan -input=false -detailed-exitcode -no-color` — Every saved action is `no-op`; current planning exits `0` with no changes.
phrases.0: I upgraded one local module source while keeping its call and resource addresses.
phrases.1: I reviewed a saved plan that added an output without replacing the files.
phrases.2: I verified provider IDs and an empty final plan after the module upgrade.
diagnostics.condition_0: original-addresses must be nonempty and list the same addresses as tofu state
  list.
diagnostics.condition_1: tofu output -json ids must equal original-ids.json.
diagnostics.condition_2: north.txt must equal north-47.
diagnostics.condition_3: depot.txt must equal depot-47.
diagnostics.condition_4: contracts.station.release must equal 2.
diagnostics.condition_5: contracts.station.checksum must equal sha256(north.txt).
diagnostics.condition_6: contracts.depot.release must equal 1.
diagnostics.condition_7: upgrade-plan.json station.source must equal ./modules/v2.
diagnostics.condition_8: upgrade-plan.json depot.source must equal ./modules/v1.
diagnostics.condition_9: Every entry in upgrade-plan.json resource_changes must have actions ["no-op"].
diagnostics.condition_10: The OpenTofu detailed plan must exit with code 0.
stages.0.objectives.0.text: OpenTofu retains the original nonempty resource inventory.
stages.0.objectives.1.text: The `ids` output retains the original provider IDs.
stages.0.objectives.2.text: On the workstation, `north.txt` contains `north-47`; `depot.txt` contains
  `depot-47`.
stages.0.objectives.3.text: The `contracts` output reports `station` release `2` with the SHA-256 of workstation
  `north.txt`, and `depot` release `1`.
stages.0.objectives.4.text: Workstation `upgrade-plan.json` records only `no-op` resource actions.
stages.0.objectives.5.text: OpenTofu reports no pending infrastructure changes.
