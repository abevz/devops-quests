title: Module versioning
brief: 'In `~/quest`, read `main.tf`, `modules/v1/main.tf`, `modules/v2/main.tf`, `original-addresses` and `original-ids.json`. Both module versions are local and already declare the offline provider. Upgrade `module.station` from `./modules/v1` to `./modules/v2`, leaving `module.depot` on `./modules/v1`. The local module guide linked in the hints explains module sources and outputs.


  Save a binary plan and export it with `tofu show -json` as `upgrade-plan.json`. Apply and verify: the set of state addresses matches `original-addresses`, the JSON output `ids` matches `original-ids.json`, `north.txt` is `north-47`, and `depot.txt` is `depot-47`. The `contracts` output must report station release 2 and the SHA-256 checksum of `north.txt`, and depot release 1. The saved JSON plan must name the station and depot sources above and every resource change must have actions `["no-op"]`. Finally `tofu plan -input=false -detailed-exitcode -no-color` must exit 0 (no changes). The check inspects the saved JSON but cannot prove when it was created. Work only in the offline bay.'
debrief: The recorded addresses and ID outputs, file contents, module contracts and saved plan match the upgrade checks.
stages.0.brief: The addresses, IDs, files, contracts and saved plan match the brief, and the final plan exits 0.
stages.0.objectives.0.text: The addresses, IDs, files, contracts and saved plan match the brief, and the final plan exits 0.
hints.0.text: Changing source need not change module or resource addresses.
hints.1.text: Inspect the saved plan before applying; this upgrade should not replace
  the files.
hints.2.text: Change the station source only, reinitialize, review and apply the saved
  plan.
phrases.0: I upgraded one local module source while keeping its call and resource
  addresses.
phrases.1: I reviewed a saved plan that added an output without replacing the files.
phrases.2: I verified provider IDs and an empty final plan after the module upgrade.
