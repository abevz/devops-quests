title: Module versioning
brief: 'Two local module versions are supplied offline. Version 2 adds a checksum output while preserving
  the local_file resource address and content. Upgrade only module.station from modules/v1 to modules/v2;
  depot stays on v1. Save upgrade-plan.json before applying and preserve the recorded addresses and provider
  IDs of both notice files. No module download is needed.


  Quest files in `~/quest` (some appear in later stages): `main.tf`, `modules/v1/main.tf`, `modules/v2/main.tf`,
  `original-addresses`, `original-ids.json`, `upgrade-plan.json`, `north.txt`, `depot.txt`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: Only station uses v2 and exposes its real file checksum; depot remains v1,
  both addresses/IDs survive, and the final plan is empty.'
debrief: A local module contract gained an output without changing managed resource identities.
