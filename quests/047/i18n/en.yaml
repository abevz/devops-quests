hints.0.text: Changing source need not change module or resource addresses.
hints.1.text: Inspect the saved plan before applying; this upgrade should not replace the files.
hints.2.text: Change the station source only, reinitialize, review and apply the saved plan.
phrases.0: I upgraded one local module source while keeping its call and resource addresses.
phrases.1: I reviewed a saved plan that added an output without replacing the files.
phrases.2: I verified provider IDs and an empty final plan after the module upgrade.
