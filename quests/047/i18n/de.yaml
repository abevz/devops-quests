title: Modulversionierung
brief: 'Lies in `~/quest` die Dateien `main.tf`, `modules/v1/main.tf`, `modules/v2/main.tf`, `original-addresses` und `original-ids.json`.
  Beide Modulversionen liegen lokal vor und deklarieren den Offline-Provider. Aktualisiere `module.station` von `./modules/v1`
  auf `./modules/v2`; `module.depot` bleibt auf `./modules/v1`. Die in den Hinweisen verlinkte Anleitung erklärt Modulquellen
  und -ausgaben.


  Speichere einen binären Plan und exportiere ihn mit `tofu show -json` als `upgrade-plan.json`. Wende an und prüfe: Die Menge
  der Zustandsadressen entspricht `original-addresses`, die JSON-Ausgabe `ids` entspricht `original-ids.json`, `north.txt`
  enthält `north-47` und `depot.txt` enthält `depot-47`. Die Ausgabe `contracts` muss für station Release 2 und die SHA-256-Prüfsumme
  von `north.txt`, für depot Release 1 melden. Der gespeicherte JSON-Plan muss die obigen Quellen für station und depot nennen
  und jede Ressourcenänderung muss Aktionen `["no-op"]` haben. Schließlich muss `tofu plan -input=false -detailed-exitcode
  -no-color` mit Code 0 enden (keine Änderungen). Die Prüfung liest das gespeicherte JSON, beweist aber nicht dessen Erstellungszeitpunkt.
  Arbeite nur in der Offline-Umgebung.'
debrief: Die gespeicherten Adressen und ID-Ausgaben, Dateiinhalte, Modulverträge und der gespeicherte Plan entsprechen den
  Upgrade-Prüfungen.
stages.0.brief: Adressen, IDs, Dateien, Verträge und gespeicherter Plan entsprechen der Aufgabe; der abschließende Plan endet
  mit Code 0.
stages.0.objectives.0.text: Adressen, IDs, Dateien, Verträge und gespeicherter Plan entsprechen der Aufgabe; der abschließende
  Plan endet mit Code 0.
hints.0.text: Beim Ändern der Quelle müssen sich die Modul- oder Ressourcenadressen nicht ändern.
hints.1.text: Überprüfen Sie den gespeicherten plan vor der Anwendung; Dieses Upgrade sollte die Dateien nicht ersetzen.
hints.2.text: Ändern Sie nur die station-Quelle, initialisieren Sie sie erneut, überprüfen Sie sie und wenden Sie die gespeicherte
  plan an.
phrases.0: Ich habe eine lokale Modulquelle aktualisiert und dabei ihre Aufruf- und Ressourcenadressen beibehalten.
phrases.1: Ich habe einen gespeicherten plan überprüft, der eine Ausgabe hinzugefügt hat, ohne die Dateien zu ersetzen.
phrases.2: Ich habe provider IDs und ein leeres endgültiges plan nach dem Modul-Upgrade überprüft.
diagnostics.condition_0: original-addresses darf nicht leer sein und muss dieselben Adressen wie tofu state list auflisten.
diagnostics.condition_1: tofu output -json ids muss original-ids.json entsprechen.
diagnostics.condition_2: north.txt muss north-47 entsprechen.
diagnostics.condition_3: depot.txt muss depot-47 entsprechen.
diagnostics.condition_4: contracts.station.release muss 2 entsprechen.
diagnostics.condition_5: contracts.station.checksum muss sha256(north.txt) entsprechen.
diagnostics.condition_6: contracts.depot.release muss 1 entsprechen.
diagnostics.condition_7: upgrade-plan.json station.source muss ./modules/v2 entsprechen.
diagnostics.condition_8: upgrade-plan.json depot.source muss ./modules/v1 entsprechen.
diagnostics.condition_9: Jeder Eintrag in upgrade-plan.json resource_changes muss actions ["no-op"] haben.
diagnostics.condition_10: Der OpenTofu-Plan mit detailed-exitcode muss mit Code 0 enden.
