title: Modulversionierung
brief: |-
  Der Verbraucher von `station` benötigt einen neueren Vertrag, während `depot` seinen Vertrag behalten muss.

  Arbeite auf der Workstation in `~/quest` mit `main.tf`, `modules/v1/main.tf`, `modules/v2/main.tf`.

  **Anforderungen:**
  - OpenTofu-State:
    - OpenTofu behält den ursprünglichen nicht leeren Ressourcenbestand bei.
  - Root-Ausgaben:
    - Ausgabename: `ids`.
    - Die Ausgabe `ids` behält die ursprünglichen Provider-IDs bei.
  - Dateien auf der Workstation:
    - `~/quest/north.txt`: `north-47`.
    - `~/quest/depot.txt`: `depot-47`.
  - Root-Ausgaben:
    - `contracts`: `station`, `depot`.
    - `station`: release `2`; `depot`: release `1`.
    - Die Prüfsumme von `station` entspricht SHA-256 der Workstation-Datei `~/quest/north.txt`.
  - Gespeicherter Plan auf der Workstation:
    - Pfad: `~/quest/upgrade-plan.json`.
    - Jede Ressourcenaktion ist `no-op`.
  - Infrastrukturkonvergenz:
    - Keine ausstehenden Infrastrukturänderungen; Exit-Code des detaillierten Plans `0`.

  Die Prüfung untersucht den gespeicherten Plan; sie beweist nicht, wann er erstellt wurde.
debrief: Die gespeicherten Adressen und ID-Ausgaben, Dateiinhalte, Modulverträge und der gespeicherte
  Plan entsprechen den Upgrade-Prüfungen.
stages.0.brief: Erfülle beide Modulverträge mit den aufgezeichneten Ressourcenidentitäten.
hints.0.text: Beim Ändern der Quelle müssen sich die Modul- oder Ressourcenadressen nicht ändern.
hints.1.text: |-
  Die aktualisierte Schnittstelle liegt in modules/v2; depot muss modules/v1 behalten.

  Prüfen Sie die bereitgestellte Konfiguration und aktuelle Beobachtungen auf der Workstation:

  ```sh
  cat main.tf modules/v1/main.tf modules/v2/main.tf
  tofu state list
  ```
hints.2.text: |-
  Ändere nur die Quelle von station auf ./modules/v2, initialisiere erneut und wende den gespeicherten Plan an.
  Speichere den binären Plan und exportiere ihn mit tofu show -json in das angeforderte JSON-Artefakt.

  Prüfen Sie das Ergebnis in `~/quest` auf der Workstation:

  - `diff -u <(tofu state list | sort) <(sort original-addresses); tofu output -json ids | jq -e --slurpfile old original-ids.json '. == $old[0]'` — Keine Inventarunterschiede; der ID-Vergleich gibt `true` aus.
  - `cat north.txt depot.txt; tofu output -json contracts; sha256sum north.txt` — Die Dateien zeigen `north-47` und `depot-47`; `station` meldet Version `2` und die angezeigte Prüfsumme, `depot` dagegen Version `1`.
  - `jq -r '.resource_changes[] | .address + " " + (.change.actions | join(","))' upgrade-plan.json; tofu plan -input=false -detailed-exitcode -no-color` — Jede gespeicherte Aktion ist `no-op`; die aktuelle Planung endet mit `0` ohne Änderungen.
phrases.0: Ich habe eine lokale Modulquelle aktualisiert und dabei ihre Aufruf- und Ressourcenadressen
  beibehalten.
phrases.1: Ich habe einen gespeicherten plan überprüft, der eine Ausgabe hinzugefügt hat, ohne die Dateien
  zu ersetzen.
phrases.2: Ich habe provider IDs und ein leeres endgültiges plan nach dem Modul-Upgrade überprüft.
diagnostics.condition_0: original-addresses darf nicht leer sein und muss dieselben Adressen wie tofu
  state list auflisten.
diagnostics.condition_1: tofu output -json ids muss original-ids.json entsprechen.
diagnostics.condition_2: north.txt muss north-47 entsprechen.
diagnostics.condition_3: depot.txt muss depot-47 entsprechen.
diagnostics.condition_4: contracts.station.release muss 2 entsprechen.
diagnostics.condition_5: contracts.station.checksum muss sha256(north.txt) entsprechen.
diagnostics.condition_6: contracts.depot.release muss 1 entsprechen.
diagnostics.condition_7: upgrade-plan.json station.source muss ./modules/v2 entsprechen.
diagnostics.condition_8: upgrade-plan.json depot.source muss ./modules/v1 entsprechen.
diagnostics.condition_9: Jeder Eintrag in upgrade-plan.json resource_changes muss actions ["no-op"] haben.
diagnostics.condition_10: Der OpenTofu-Plan mit detailed-exitcode muss mit Code 0 enden.
stages.0.objectives.0.text: OpenTofu behält den ursprünglichen nicht leeren Ressourcenbestand bei.
stages.0.objectives.1.text: Die Ausgabe `ids` behält die ursprünglichen Provider-IDs bei.
stages.0.objectives.2.text: 'Auf der Workstation: `north.txt` enthält `north-47`; `depot.txt` enthält
  `depot-47`.'
stages.0.objectives.3.text: Die Ausgabe `contracts` meldet für `station` Version `2` mit SHA-256 der Workstation-Datei
  `north.txt` und für `depot` Version `1`.
stages.0.objectives.4.text: Die Workstation-Datei `upgrade-plan.json` enthält nur Ressourcenaktionen `no-op`.
stages.0.objectives.5.text: OpenTofu meldet keine ausstehenden Infrastrukturänderungen.
