title: Modulversionierung
brief: |-
  Der Verbraucher von `station` benötigt einen neueren Vertrag, während `depot` seinen Vertrag behalten muss.

  Arbeite auf der Workstation in `~/quest` mit `main.tf`, `modules/v1/main.tf`, `modules/v2/main.tf`.

  **Anforderungen:**
  - OpenTofu-State:
    - OpenTofu behält den ursprünglichen nicht leeren Ressourcenbestand bei.
  - Root-Ausgaben:
    - Ausgabename: `ids`.
    - Die Ausgabe `ids` behält die ursprünglichen Provider-IDs bei.
  - Dateien auf der Workstation:
    - `~/quest/north.txt`: `north-47`.
    - `~/quest/depot.txt`: `depot-47`.
  - Root-Ausgaben:
    - `contracts`: `station`, `depot`.
    - `station`: release `2`; `depot`: release `1`.
    - Die Prüfsumme von `station` entspricht SHA-256 der Workstation-Datei `~/quest/north.txt`.
  - Gespeicherter Plan auf der Workstation:
    - Pfad: `~/quest/upgrade-plan.json`.
    - Jede Ressourcenaktion ist `no-op`.
  - Infrastrukturkonvergenz:
    - Keine ausstehenden Infrastrukturänderungen; Exit-Code des detaillierten Plans `0`.

  Die Prüfung untersucht den gespeicherten Plan; sie beweist nicht, wann er erstellt wurde.
debrief: Die gespeicherten Adressen und ID-Ausgaben, Dateiinhalte, Modulverträge und der gespeicherte
  Plan entsprechen den Upgrade-Prüfungen.
stages.0.brief: Erfülle beide Modulverträge mit den aufgezeichneten Ressourcenidentitäten.
hints.0.text: Beim Ändern der Quelle müssen sich die Modul- oder Ressourcenadressen nicht ändern.
hints.1.text: |-
  Die aktualisierte Schnittstelle liegt in modules/v2; depot muss modules/v1 behalten.

  Prüfen Sie die bereitgestellte Konfiguration und aktuelle Beobachtungen auf der Workstation:

  ```sh
  cat main.tf modules/v1/main.tf modules/v2/main.tf
  tofu state list
  ```
hints.2.text: |-
  Ändere nur die Quelle von station auf ./modules/v2, initialisiere erneut und wende den gespeicherten Plan an.
  Speichere den binären Plan und exportiere ihn mit tofu show -json in das angeforderte JSON-Artefakt.

  Prüfen Sie das Ergebnis in `~/quest` auf der Workstation:

  - `diff -u <(tofu state list | sort) <(sort original-addresses); tofu output -json ids | jq -e --slurpfile old original-ids.json '. == $old[0]'` — Keine Inventarunterschiede; der ID-Vergleich gibt `true` aus.
  - `cat north.txt depot.txt; tofu output -json contracts; sha256sum north.txt` — Die Dateien zeigen `north-47` und `depot-47`; `station` meldet Version `2` und die angezeigte Prüfsumme, `depot` dagegen Version `1`.
  - `jq -r '.resource_changes[] | .address + " " + (.change.actions | join(","))' upgrade-plan.json; tofu plan -input=false -detailed-exitcode -no-color` — Jede gespeicherte Aktion ist `no-op`; die aktuelle Planung endet mit `0` ohne Änderungen.
phrases.0: Ich habe eine lokale Modulquelle aktualisiert und dabei ihre Aufruf- und Ressourcenadressen
  beibehalten.
phrases.1: Ich habe einen gespeicherten plan überprüft, der eine Ausgabe hinzugefügt hat, ohne die Dateien
  zu ersetzen.
phrases.2: Ich habe provider IDs und ein leeres endgültiges plan nach dem Modul-Upgrade überprüft.
stages.0.objectives.0.text: OpenTofu behält den ursprünglichen nicht leeren Ressourcenbestand bei.
stages.0.objectives.1.text: Die Ausgabe `ids` behält die ursprünglichen Provider-IDs bei.
stages.0.objectives.2.text: 'Auf der Workstation: `north.txt` enthält `north-47`; `depot.txt` enthält
  `depot-47`.'
stages.0.objectives.3.text: Die Ausgabe `contracts` meldet für `station` Version `2` mit SHA-256 der Workstation-Datei
  `north.txt` und für `depot` Version `1`.
stages.0.objectives.4.text: Die Workstation-Datei `upgrade-plan.json` enthält nur Ressourcenaktionen `no-op`.
stages.0.objectives.5.text: OpenTofu meldet keine ausstehenden Infrastrukturänderungen.
diagnostics.condition_0: Die aktuellen State-Adressen weichen von original-addresses ab oder sind unlesbar; ein Modulaufruf oder eine Ressourcenadresse hat sich möglicherweise geändert, zusätzliche Ressourcen wurden ergänzt oder die gespeicherte Liste fehlt. [Ursache und Prüfung](guides#guide=terraform-7.1&section=module-upgrade-addresses)
diagnostics.condition_1: Das ids-Output weicht von original-ids.json ab oder ist unlesbar; Dateiinhalte oder Ressourcenidentitäten wurden möglicherweise geändert, Outputs noch nicht angewendet oder das gespeicherte JSON fehlt beziehungsweise ist ungültig. [Ursache und Prüfung](guides#guide=terraform-7.1&section=module-upgrade-identities)
diagnostics.condition_2: north.txt ist unlesbar oder enthält nicht north-47; das Upgrade von module.station hat möglicherweise den Inhalt geändert oder die verwaltete Datei wurde bearbeitet beziehungsweise entfernt. [Ursache und Prüfung](guides#guide=terraform-7.1&section=module-upgrade-files)
diagnostics.condition_3: depot.txt ist unlesbar oder enthält nicht depot-47; eine Bearbeitung oder apply hat möglicherweise die Datei verändert, die mit module.depot erhalten bleiben soll. [Ursache und Prüfung](guides#guide=terraform-7.1&section=module-upgrade-files)
diagnostics.condition_4: contracts.station.release ist nicht 2 oder unlesbar; module.station verwendet möglicherweise noch modules/v1, die Initialisierung ist veraltet oder die neuen Outputs wurden nicht angewendet. [Ursache und Prüfung](guides#guide=terraform-7.1&section=module-upgrade-current-contracts)
diagnostics.condition_5: contracts.station.checksum stimmt nicht mit sha256(north.txt) überein oder ist nicht beobachtbar; das Output wird möglicherweise noch nicht unterstützt, ist veraltet oder north.txt wurde nach apply geändert. [Ursache und Prüfung](guides#guide=terraform-7.1&section=module-upgrade-current-contracts)
diagnostics.condition_6: contracts.depot.release ist nicht 1 oder unlesbar; module.depot wurde möglicherweise zusammen mit module.station aktualisiert oder die Output-Konfiguration bewahrt den alten Vertrag nicht. [Ursache und Prüfung](guides#guide=terraform-7.1&section=module-upgrade-current-contracts)
diagnostics.condition_7: Im gespeicherten upgrade-plan.json fehlen release 2 und die aktuelle Dateiprüfsumme für module.station; der Plan fehlt möglicherweise, ist ungültig, älter als die Source-Änderung oder nach einer Dateiänderung veraltet. [Ursache und Prüfung](guides#guide=terraform-7.1&section=module-upgrade-saved-contracts)
diagnostics.condition_8: Der gespeicherte upgrade-plan.json bewahrt release 1 für module.depot nicht oder ist unlesbar; er wurde möglicherweise mit beiden Modul-Upgrades oder aus der falschen Konfiguration erzeugt. [Ursache und Prüfung](guides#guide=terraform-7.1&section=module-upgrade-saved-contracts)
diagnostics.condition_9: upgrade-plan.json ist unlesbar oder enthält Ressourcenaktionen außer no-op; geänderte Adressen oder Dateiinhalte können beim Modul-Upgrade Erstellungen, Änderungen oder Ersetzungen verursachen. [Ursache und Prüfung](guides#guide=terraform-7.1&section=module-upgrade-plan-actions)
diagnostics.condition_10: Der aktuelle Plan endete nicht mit Code 0; nicht angewendete Outputs oder Drift sind möglicherweise übrig oder Konfigurations-, Modulinitialisierungs- beziehungsweise Providerfehler verhinderten den Plan. [Ursache und Prüfung](guides#guide=terraform-7.1&section=module-upgrade-live-plan)
