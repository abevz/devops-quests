title: Modulversionierung
brief: 'Zwei lokale Modulversionen werden offline bereitgestellt. Version 2 fügt eine checksum-Ausgabe
  hinzu, während die local_file-Ressourcenadresse und der Inhalt erhalten bleiben. Upgrade nur module.station
  von modules/v1 auf modules/v2; depot bleibt auf v1. Speichern Sie upgrade-plan.json vor der Bewerbung
  und bewahren Sie die aufgezeichneten Adressen und provider IDs beider Bekanntmachungsdateien auf. Es
  ist kein Modul-Download erforderlich.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `main.tf`, `modules/v1/main.tf`,
  `modules/v2/main.tf`, `original-addresses`, `original-ids.json`, `upgrade-plan.json`, `north.txt`, `depot.txt`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Anfängliche Erfolgskriterien: Nur station verwendet v2 und stellt seine echte Datei checksum bereit;
  depot bleibt v1, beide addresses/IDs überleben und das letzte plan ist leer.'
debrief: Ein lokaler Modulvertrag hat eine Ausgabe erhalten, ohne dass die verwalteten Ressourcenidentitäten
  geändert wurden.
stages.0.brief: 'Erfolgskriterien: Nur station verwendet v2 und stellt seine echte Datei checksum bereit;
  depot bleibt v1, beide addresses/IDs überleben und der letzte plan ist leer.'
stages.0.objectives.0.text: Nur station verwendet v2 und stellt seine echte Datei checksum bereit; depot
  bleibt v1, beide addresses/IDs überleben und der letzte plan ist leer.
hints.0.text: Beim Ändern der Quelle müssen sich die Modul- oder Ressourcenadressen nicht ändern.
hints.1.text: Überprüfen Sie den gespeicherten plan vor der Anwendung; Dieses Upgrade sollte die Dateien
  nicht ersetzen.
hints.2.text: Ändern Sie nur die station-Quelle, initialisieren Sie sie erneut, überprüfen Sie sie und
  wenden Sie die gespeicherte plan an.
phrases.0: Ich habe eine lokale Modulquelle aktualisiert und dabei ihre Aufruf- und Ressourcenadressen
  beibehalten.
phrases.1: Ich habe einen gespeicherten plan überprüft, der eine Ausgabe hinzugefügt hat, ohne die Dateien
  zu ersetzen.
phrases.2: Ich habe provider IDs und ein leeres endgültiges plan nach dem Modul-Upgrade überprüft.
