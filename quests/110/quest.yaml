id: 110
title: title
track: Boss
difficulty: medium
brief: brief
stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    check: 'set -euo pipefail

      cd ~/quest

      failed=0

      check() { local label=$1 expression=$2 document=$3; if ! jq -e "$expression" <<<"$document" >/dev/null 2>&1;
      then printf ''%s\n'' "$label: ✗"; failed=1; fi; }

      dns_ip=$(kubectl get service station-dns -o jsonpath=''{.spec.clusterIP}'' 2>/dev/null || true)

      client=$(kubectl get deployment client -o json 2>/dev/null || true)

      check ''deployment/client dnsPolicy = None [DQ:dns_policy]'' ''.spec.template.spec.dnsPolicy=="None"'' "$client"

      if ! test -n "$dns_ip" || ! jq -e --arg ip "$dns_ip" ''.spec.template.spec.dnsConfig.nameservers==[$ip]''
      <<<"$client" >/dev/null 2>&1; then printf ''%s\n'' ''deployment/client nameservers = [station-dns Service
      IP]: ✗ [DQ:nameserver]''; failed=1; fi

      exit "$failed"

      '
  - text: stages.0.objectives.1.text
    check: "set -euo pipefail\ncd ~/quest\nfailed=0\ncheck() { local label=$1 expression=$2 document=$3; if ! jq\
      \ -e \"$expression\" <<<\"$document\" >/dev/null 2>&1; then printf '%s\\n' \"$label: ✗\"; failed=1; fi; }\n\
      dns_answer_has() {\n  local result=$1 expected=$2\n  awk -v expected=\"$expected\" '\n    /^[[:space:]]*Name([[:space:]]+[0-9]+)?:/\
      \ { answer=1; next }\n    answer && /^[[:space:]]*Address([[:space:]]+[0-9]+)?:/ {\n      sub(/^[^:]*:[[:space:]]*/,\
      \ \"\"); split($0, fields, /[[:space:]]+/)\n      if (fields[1] == expected) found=1\n    }\n    END { exit\
      \ !found }\n  ' <<<\"$result\"\n}\ndns_ip=$(kubectl get service station-dns -o jsonpath='{.spec.clusterIP}'\
      \ 2>/dev/null || true)\nexpected=$(cat /run/dq/facts/0/expected-dns-address 2>/dev/null || true)\nlookup=''\n\
      if test -n \"$dns_ip\" && test -n \"$expected\"; then\n  if ! lookup=$(timeout 4s kubectl exec --pod-running-timeout=2s\
      \ deployment/client -- nslookup station.internal \"$dns_ip\" 2>/dev/null); then lookup=''; fi\nfi\nif ! test\
      \ -n \"$expected\" || ! dns_answer_has \"$lookup\" \"$expected\"; then printf '%s\\n' 'client DNS station.internal\
      \ answer = expected-dns-address: ✗ [DQ:answer]'; failed=1; fi\nexit \"$failed\"\n"
- brief: stages.1.brief
  objectives:
  - text: stages.1.objectives.0.text
    check: 'set -euo pipefail

      cd ~/quest

      failed=0

      check() { local label=$1 expression=$2 document=$3; if ! jq -e "$expression" <<<"$document" >/dev/null 2>&1;
      then printf ''%s\n'' "$label: ✗"; failed=1; fi; }

      dns_ip=$(kubectl get service station-dns -o jsonpath=''{.spec.clusterIP}'' 2>/dev/null || true)

      client=$(kubectl get deployment client -o json 2>/dev/null || true)

      check ''deployment/client dnsPolicy = None [DQ:dns_policy]'' ''.spec.template.spec.dnsPolicy=="None"'' "$client"

      if ! test -n "$dns_ip" || ! jq -e --arg ip "$dns_ip" ''.spec.template.spec.dnsConfig.nameservers==[$ip]''
      <<<"$client" >/dev/null 2>&1; then printf ''%s\n'' ''deployment/client nameservers = [station-dns Service
      IP]: ✗ [DQ:nameserver]''; failed=1; fi

      exit "$failed"

      '
  - text: stages.1.objectives.1.text
    check: "set -euo pipefail\ncd ~/quest\nfailed=0\ncheck() { local label=$1 expression=$2 document=$3; if ! jq\
      \ -e \"$expression\" <<<\"$document\" >/dev/null 2>&1; then printf '%s\\n' \"$label: ✗\"; failed=1; fi; }\n\
      dns_answer_has() {\n  local result=$1 expected=$2\n  awk -v expected=\"$expected\" '\n    /^[[:space:]]*Name([[:space:]]+[0-9]+)?:/\
      \ { answer=1; next }\n    answer && /^[[:space:]]*Address([[:space:]]+[0-9]+)?:/ {\n      sub(/^[^:]*:[[:space:]]*/,\
      \ \"\"); split($0, fields, /[[:space:]]+/)\n      if (fields[1] == expected) found=1\n    }\n    END { exit\
      \ !found }\n  ' <<<\"$result\"\n}\ndns_ip=$(kubectl get service station-dns -o jsonpath='{.spec.clusterIP}'\
      \ 2>/dev/null || true)\nexpected=$(cat /run/dq/facts/0/expected-dns-address 2>/dev/null || true)\nlookup=''\n\
      if test -n \"$dns_ip\" && test -n \"$expected\"; then\n  if ! lookup=$(timeout 4s kubectl exec --pod-running-timeout=2s\
      \ deployment/client -- nslookup station.internal \"$dns_ip\" 2>/dev/null); then lookup=''; fi\nfi\nif ! test\
      \ -n \"$expected\" || ! dns_answer_has \"$lookup\" \"$expected\"; then printf '%s\\n' 'client DNS station.internal\
      \ answer = expected-dns-address: ✗ [DQ:answer]'; failed=1; fi\nexit \"$failed\"\n"
  - text: stages.1.objectives.2.text
    check: 'set -euo pipefail

      cd ~/quest

      failed=0

      check() { local label=$1 expression=$2 document=$3; if ! jq -e "$expression" <<<"$document" >/dev/null 2>&1;
      then printf ''%s\n'' "$label: ✗"; failed=1; fi; }

      class=$(jq -r ''.class // ""'' /run/dq/facts/0/ingress-target.json 2>/dev/null || true)

      ingress=$(kubectl get ingress board -o json 2>/dev/null || true)

      if ! test -n "$class" || ! jq -e --arg class "$class" ''.spec.ingressClassName==$class'' <<<"$ingress" >/dev/null
      2>&1; then printf ''%s\n'' ''ingress/board class = supplied private class: ✗ [DQ:ingress_class]''; failed=1;
      fi

      check ''ingress/board first host = station.internal [DQ:host]'' ''.spec.rules[0].host=="station.internal"''
      "$ingress"

      check ''ingress/board first path = / [DQ:path]'' ''.spec.rules[0].http.paths[0].path=="/"'' "$ingress"

      check ''ingress/board first pathType = Prefix [DQ:path_type]'' ''.spec.rules[0].http.paths[0].pathType=="Prefix"''
      "$ingress"

      check ''ingress/board first backend = board:8080 [DQ:backend]'' ''.spec.rules[0].http.paths[0].backend.service=={name:"board",port:{number:8080}}''
      "$ingress"

      exit "$failed"

      '
  - text: stages.1.objectives.3.text
    check: 'set -euo pipefail

      cd ~/quest

      failed=0

      check() { local label=$1 expression=$2 document=$3; if ! jq -e "$expression" <<<"$document" >/dev/null 2>&1;
      then printf ''%s\n'' "$label: ✗"; failed=1; fi; }

      url=http://station.internal:8000

      if ! test -n "$url" || ! test "$(timeout 4s kubectl exec --pod-running-timeout=2s deployment/client -- wget
      -qO- -T 3 --header=''Host: station.internal'' "$url" 2>/dev/null)" = north-110; then printf ''%s\n'' ''matching
      Host response = north-110: ✗ [DQ:http]''; failed=1; fi

      if test -n "$url" && timeout 4s kubectl exec --pod-running-timeout=2s deployment/client -- wget -qO- -T 3
      --header=''Host: wrong.station.internal'' "$url" >/dev/null 2>&1; then printf ''%s\n'' ''wrong Host request
      fails: ✗ [DQ:wrong]''; failed=1; fi

      exit "$failed"

      '
