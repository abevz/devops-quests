diagnostics.dns_policy: Шаблон client мог вернуться к DNS-политике кластера. Проверьте dnsPolicy и сохраните None для выданной настройки nameserver. [Причина и проверка](guides#guide=private-dns&section=q110-client-dns-policy)
diagnostics.ingress_class: Ingress мог использовать класс другого контроллера, либо не читается выданный класс. Сравните ingressClassName с предоставленным приватным классом перед проверкой маршрутов. [Причина и проверка](guides#guide=kubernetes-10&section=q110-ingress-private-class)
diagnostics.http: Ingress мог быть настроен, пока контроллер ещё применяет изменения либо endpoint board недоступен. Отправьте подходящий заголовок Host на station.internal:8000 и сравните ответ с north-110. [Причина и проверка](guides#guide=kubernetes-10&section=q110-ingress-live-request)
diagnostics.wrong: Правило для всех хостов или backend по умолчанию может принимать неподходящий хост. Отправьте другой заголовок Host через тот же URL и проверьте, что запрос не проходит. [Причина и проверка](guides#guide=kubernetes-10&section=q110-ingress-unmatched-host)
diagnostics.nameserver: В client мог отсутствовать nameserver, остаться старый адрес или появиться другой резолвер. Сравните адреса с единственным текущим ClusterIP station-dns. Ошибка чтения Service или Deployment также даёт этот маркер. [Причина и проверка](guides#guide=private-dns&section=q110-incident-current-dns-server)
diagnostics.answer: Резолвер мог всё ещё возвращать для station.internal старый loopback или не прочитать изменённый Corefile. Запросите station-dns явно из client и сравните ответ с зафиксированным адресом прокси. [Причина и проверка](guides#guide=private-dns&section=q110-incident-resolver-answer)
diagnostics.host: Правило station.internal могло отсутствовать или не иметь подходящего корневого пути. Проверьте / с Exact или Prefix. Если заданы оба типа, для корневого запроса сначала смотрите Exact. [Причина и проверка](guides#guide=kubernetes-10&section=q110-incident-station-root-rule)
diagnostics.backend: Выбранный корневой маршрут мог остаться на отсутствующем порту 8099 или указывать на другой Service. Проверьте для каждого выбранного пути ровно один TCP-порт board по номеру или имени. Ошибка чтения Ingress, Service или исходной записи даёт тот же маркер. [Причина и проверка](guides#guide=kubernetes-10&section=q110-incident-ingress-service-port)
diagnostics.probe_0_0: Наблюдение DNS может завершиться до указания поля при ошибке процесса или входов. Проверьте Python и доступ на чтение к client и station-dns. [Причина и проверка](guides#guide=private-dns&section=q110-incident-dns-observer-input)
diagnostics.probe_1_0: Наблюдение DNS может завершиться до указания поля при ошибке процесса или входов. Проверьте Python и доступ на чтение к client и station-dns. [Причина и проверка](guides#guide=private-dns&section=q110-incident-dns-observer-input)
diagnostics.probe_1_2: Проверка Ingress может прерваться до сравнения выбранного пути. Проверьте инструменты станции и доступ к Ingress и Service board. [Причина и проверка](guides#guide=kubernetes-10&section=q110-incident-ingress-observer-input)
