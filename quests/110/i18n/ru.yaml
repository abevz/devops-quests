title: Инцидент входа на станцию
brief: 'Работайте в `~/quest` с `components.env`, `expected-dns-address`, `Corefile`, `dns-config.json`, `dns.json`, `dns-service.json`,
  `client.json`, `ingress-target.json` и `ingress.json`. Ошибки приватного DNS и backend Ingress прерывают путь к board. Сначала
  исправьте приватную запись `station.internal` на IP Service контроллера из `expected-dns-address`, перезапустите `deployment/station-dns`
  и дождитесь распространения DNS. Клиент должен сохранить `dnsPolicy: None` и ровно IP приватного DNS Service как сервер
  имён; ответ DNS должен содержать полный ожидаемый адрес.


  Затем исправьте Ingress `board`: приватный класс берётся из `ingress-target.json`, первый хост — `station.internal`, путь
  — `/`, тип — `Prefix`, первый backend — ровно Service `board` порт 8080. Дождитесь согласования контроллера. Из клиента
  `http://station.internal:8000` с Host `station.internal` должен вернуть `north-110`; тот же запрос с Host `wrong.station.internal`
  должен завершиться ошибкой. Ошибка не доказывает причину, а текущие проверки не доказывают прошлые изменения или перезапуски.
  Используйте только офлайн-песочницу.'
debrief: Проверки наблюдали DNS клиента и результаты приватной маршрутизации.
stages.0.brief: DNS-политика, сервер имён и ответ клиента соответствуют описанию.
stages.0.objectives.0.text: DNS-политика, сервер имён и ответ клиента соответствуют описанию.
stages.1.brief: Результат DNS, поля Ingress, правильный ответ и ошибка запроса неверного хоста соответствуют описанию.
stages.1.objectives.0.text: Результат DNS, поля Ingress, правильный ответ и ошибка запроса неверного хоста соответствуют описанию.
hints.0.text: Проверьте разрешение имени до анализа отказа HTTP-маршрутизации.
hints.1.text: DNS должен возвращать Service контроллера, а не Service приложения.
hints.2.text: Исправьте DNS, затем backend Ingress; проверьте подходящий и посторонний Host headers.
phrases.0: Я отделил разрешение DNS от ingress routing.
phrases.1: Я сохранил требуемый путь запроса без обхода границ.
phrases.2: Я наблюдал ошибку запроса с неверным Host.
