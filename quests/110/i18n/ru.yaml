title: Инцидент входа на станцию
brief: 'Два независимых сбоя нарушили путь client → приватный DNS → приватный ingress → табло. Сначала
  исправьте собственную DNS-запись station.internal по IP Service контроллера из expected-dns-address;
  client намеренно использует только station-dns. Затем исправьте backend port Ingress на 8080, сохранив
  host, Prefix path и class. Проверьте реальный HTTP через http://station.internal:8000 из client, включая
  отказ постороннему Host header. Не обходите контроллер через IP табло и не меняйте DNS кластера.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `components.env`, `expected-dns-address`,
  `Corefile`, `dns-config.json`, `client.json`, `ingress-target.json`, `ingress.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Ответ собственного DNS соответствует IP Service приватного контроллера; следующий
  этап посвящён HTTP-маршрутизации.'
debrief: Независимые сбои DNS и HTTP-маршрутизации исправлены с сохранением полного приватного пути запроса.
stages.0.brief: 'Ответ собственного DNS соответствует IP Service приватного контроллера; следующий этап
