title: Инцидент входа на станцию
brief: "Клиент ещё не может обратиться к станции через её приватное имя и точку входа.\n\nРаботайте в `~/quest`\
  \ на рабочей станции. Входные файлы по этапам:\n- Этап 1: `components.env`, `expected-dns-address`, `Corefile`,\
  \ `dns-config.yaml`, `dns.yaml`, `dns-service.yaml`, `client.yaml`.\n- Этап 2: `ingress-target.json`, `ingress.yaml`.\n\
  \n**Требования:**\n\n- Этап 1:\n  - Deployment `client` использует только поставленный приватный DNS-resolver.\n\
  \  - Из Deployment `client` имя `station.internal` разрешается в полный требуемый адрес приватной точки входа.\n\
  - Этап 2:\n  - Deployment `client` использует только поставленный приватный DNS-resolver.\n  - Из Deployment `client`\
  \ имя `station.internal` разрешается в полный требуемый адрес приватной точки входа.\n  - Приватный Ingress направляет\
  \ `/` для `station.internal` к приложению.\n  - Из Deployment `client` адрес `http://station.internal:8000` возвращает\
  \ `north-110` для Host `station.internal` и отклоняет Host `wrong.station.internal`.\n\nНеуспех запроса не устанавливает\
  \ его причину, а текущие наблюдения DNS и Ingress не доказывают, какие изменения или перезапуски произошли."
debrief: Проверки наблюдали DNS клиента и результаты приватной маршрутизации.
stages.0.brief: Клиент должен получать полный поставленный приватный DNS-адрес.
stages.1.brief: Приватная точка входа должна различать целевой и посторонний хост.
hints.0.text: Проверьте разрешение имени до анализа отказа HTTP-маршрутизации.
hints.1.text: 'DNS должен возвращать Service контроллера, а не Service приложения. После обновления приватной записи
  перезапустите `deployment/station-dns` и дождитесь распространения.


  Изучите поставленные определения, описания ресурсов и события соответствующего этапа.


  ```sh

  cat Corefile

  kubectl describe deployment client

  kubectl describe ingress board

  ```


  Этап 1/2: Изучите определения этих ресурсов для данного этапа.


  ```sh

  kubectl get deployment client -o yaml

  ```


  Этап 2: Изучите определения этих ресурсов для данного этапа.


  ```sh

  kubectl get ingress board -o yaml

  cat ingress-target.json

  ```'
hints.2.text: "Исправьте DNS, затем backend Ingress; проверьте подходящий и посторонний Host headers.\n\nПроверьте\
  \ исправленный этап и сравните наблюдаемый результат.\n\nЭтап 1/2: Полный DNS-ответ совпадает с поставленным ожидаемым\
  \ адресом.\n\n```sh\nkubectl get service station-dns -o wide\ncat expected-dns-address\nkubectl exec deployment/client\
  \ -- nslookup station.internal \"$(kubectl get service station-dns -o jsonpath='{.spec.clusterIP}')\"\n```\n\n\
  Этап 2: Целевой Host возвращает `north-110`; запрос постороннего Host завершается неуспешно.\n\n```sh\nkubectl\
  \ exec deployment/client -- wget -qO- -T 3 --header='Host: station.internal' http://station.internal:8000\nif\
  \ kubectl exec deployment/client -- wget -qO- -T 3 --header='Host: wrong.station.internal' http://station.internal:8000\
  \ >/dev/null 2>&1; then\n  printf 'Unexpected Host accepted\\n' >&2; exit 1\nelse\n  printf 'Unrelated Host rejected\\\
  n'\nfi\n```\n\nОжидаемые наблюдения для этапа целиком:\n- Этап 1/2: Конфигурация DNS соответствует требованиям,\
  \ полный ответ равен `expected-dns-address`.\n- Этап 2: Приватный класс, хост, путь и backend соответствуют требованиям."
phrases.0: Я отделил разрешение DNS от ingress routing.
phrases.1: Я сохранил требуемый путь запроса без обхода границ.
phrases.2: Я наблюдал ошибку запроса с неверным Host.
questions.0.points.0: Ingress-контроллер обрабатывает правила Host и path.
questions.0.points.1: Указание прямо на табло обходит эту границу маршрутизации.
questions.0.prompt: Почему hostname здесь должен указывать на ingress endpoint?
questions.1.points.0: 'Нет: выбор backend, порт Service и здоровье приложения — отдельные проверки.'
questions.1.points.1: Проверяйте разрешение имени и реальный трафик из одного клиента.
questions.1.prompt: Доказывает ли правильный DNS-ответ исправность HTTP-маршрута?
diagnostics.dns_policy: deployment/client dnsPolicy должен совпадать с None.
diagnostics.nameserver: deployment/client nameservers должен совпадать с [station-dns Service IP].
diagnostics.answer: Ответ DNS station.internal должен содержать expected-dns-address.
diagnostics.ingress_class: Ingress board должен использовать выданный приватный класс.
diagnostics.host: ingress/board rules[0].host должен совпадать с station.internal.
diagnostics.path: ingress/board paths[0].path должен совпадать с /.
diagnostics.path_type: ingress/board paths[0].pathType должен совпадать с Prefix.
diagnostics.backend: ingress/board backend должен совпадать с board:8080.
diagnostics.http: Запрос с Host station.internal должен вернуть north-110.
diagnostics.wrong: Запрос с Host wrong.station.internal должен завершиться ошибкой.
