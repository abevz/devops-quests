title: Incidente de entrada Station
brief: 'Dos fallas independientes interrumpen client → privado DNS → privado ingress → board. Primero
  repare el registro personalizado DNS station.internal para que se resuelva en el controlador Service
  IP congelado en expected-dns-address; el client utiliza intencionalmente solo station-dns. Luego repare
  el puerto Ingress backend Service a 8080, conservando su host, la ruta Prefix y class. Verifique el
  HTTP real hasta el http://station.internal:8000 desde client, incluido el rechazo de un host header
  no relacionado. No omita el controlador con el board IP ni cambie el clúster DNS.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `components.env`, `expected-dns-address`,
  `Corefile`, `dns-config.json`, `client.json`, `ingress-target.json`, `ingress.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: la respuesta personalizada DNS coincide con el controlador privado Service
  IP; la siguiente etapa diagnostica el enrutamiento HTTP.'
debrief: Se recuperaron las fallas de enrutamiento independientes DNS y HTTP conservando la ruta de solicitud
  privada completa.
stages.0.brief: 'Criterios de éxito: la respuesta personalizada DNS coincide con el controlador privado
  Service IP; la siguiente etapa diagnostica el enrutamiento HTTP.'
stages.0.objectives.0.text: La respuesta personalizada DNS coincide con el controlador privado Service
  IP; la siguiente etapa diagnostica el enrutamiento HTTP.
stages.1.brief: 'Criterios de éxito: El mismo client resuelve station.internal y llega a north-110 a través
  del ingress real rule; un Host no relacionado no route.'
stages.1.objectives.0.text: El mismo client resuelve station.internal y llega a north-110 a través del
  ingress real rule; un Host no relacionado no route.
hints.0.text: Pruebe el límite de resolución de nombres antes de interpretar una falla de enrutamiento
  HTTP.
hints.1.text: La respuesta DNS debe ser el controlador Service, no la aplicación Service.
hints.2.text: Reparar DNS, luego Ingress backend; verifique tanto el host headers correcto como el no
  relacionado.
phrases.0: Aislé la resolución DNS de ingress routing.
phrases.1: Mantuve la ruta de solicitud prevista en lugar de pasar por alto un límite.
phrases.2: Verifiqué el tráfico de un extremo a otro y una coincidencia de host negativa.
questions.0.points.0: El controlador de ingreso evalúa las reglas de ruta y host.
questions.0.points.1: Apuntar directamente al board evita ese límite de ruta.
questions.0.prompt: ¿Por qué un hostname debería resolverse en ingress endpoint aquí?
questions.1.points.0: No; La selección de backend, el puerto Service y el estado de la aplicación son
  independientes.
questions.1.points.1: Resolución de prueba y tráfico real del mismo client.
questions.1.prompt: ¿Una respuesta válida DNS demuestra que el HTTP route está en buen estado?
