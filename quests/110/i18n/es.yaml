title: Incidente de entrada Station
brief: "El cliente aún no puede acceder a la estación mediante su nombre privado y punto de entrada.\n\nTrabaja\
  \ en `~/quest` en la estación de trabajo. Entradas por etapa:\n- Etapa 1: `components.env`, `expected-dns-address`,\
  \ `Corefile`, `dns-config.yaml`, `dns.yaml`, `dns-service.yaml`, `client.yaml`.\n- Etapa 2: `ingress-target.json`,\
  \ `ingress.yaml`.\n\n**Requisitos:**\n\n- Etapa 1:\n  - El Deployment `client` usa solo el resolver DNS privado\
  \ suministrado.\n  - Desde el Deployment `client`, `station.internal` se resuelve a la dirección completa prevista\
  \ de la entrada privada.\n- Etapa 2:\n  - El Deployment `client` usa solo el resolver DNS privado suministrado.\n\
  \  - Desde el Deployment `client`, `station.internal` se resuelve a la dirección completa prevista de la entrada\
  \ privada.\n  - El Ingress privado enruta `/` de `station.internal` hacia la aplicación.\n  - Desde el Deployment\
  \ `client`, `http://station.internal:8000` devuelve `north-110` para Host `station.internal` y rechaza Host `wrong.station.internal`.\n\
  \nEl fallo de una petición no establece su causa, y las observaciones actuales de DNS e Ingress no demuestran\
  \ qué cambios o reinicios ocurrieron."
debrief: Las comprobaciones observaron el DNS del Deployment client y los resultados del enrutamiento privado.
stages.0.brief: El cliente debe recibir la dirección DNS privada completa suministrada.
stages.1.brief: La entrada privada debe distinguir el host previsto de uno ajeno.
hints.0.text: Pruebe el límite de resolución de nombres antes de interpretar una falla de enrutamiento HTTP.
hints.1.text: 'La respuesta DNS debe ser el controlador Service, no la aplicación Service. Tras actualizar el registro
  privado, reinicia `deployment/station-dns` y espera la propagación.


  Inspecciona las definiciones suministradas, descripciones de recursos y eventos de la etapa correspondiente.


  ```sh

  cat Corefile

  kubectl describe deployment client

  kubectl describe ingress board

  ```


  Etapa 1/2: Inspecciona estas definiciones de recursos para esta etapa.


  ```sh

  kubectl get deployment client -o yaml

  ```


  Etapa 2: Inspecciona estas definiciones de recursos para esta etapa.


  ```sh

  kubectl get ingress board -o yaml

  cat ingress-target.json

  ```'
hints.2.text: |-
  Reparar DNS, luego Ingress backend; verifique tanto el host headers correcto como el no relacionado.

  Verifica la etapa reparada y compara el resultado observado.

  Etapa 1/2: La respuesta DNS completa coincide con la dirección esperada suministrada.

  ```sh
  kubectl get service station-dns -o wide
  cat expected-dns-address
  kubectl exec deployment/client -c worker -- nslookup station.internal "$(kubectl get service station-dns -o jsonpath='{.spec.clusterIP}')"
  ```

  Etapa 2: El Host previsto devuelve `north-110`; la petición con Host ajeno falla.

  ```sh
  kubectl exec deployment/client -c worker -- wget -qO- -T 3 --header='Host: station.internal' http://station.internal:8000
  if kubectl exec deployment/client -c worker -- wget -qO- -T 3 --header='Host: wrong.station.internal' http://station.internal:8000 >/dev/null 2>&1; then
    printf 'Unexpected Host accepted\n' >&2; exit 1
  else
    printf 'Unrelated Host rejected\n'
  fi
  ```

  Observaciones esperadas para la etapa completa:
  - Etapa 1/2: La configuración DNS cumple los requisitos y la respuesta completa coincide con `expected-dns-address`.
  - Etapa 2: La clase privada, el host, la ruta y el backend cumplen los requisitos.

phrases.0: Aislé la resolución DNS de ingress routing.
phrases.1: Mantuve la ruta de solicitud prevista en lugar de pasar por alto un límite.
phrases.2: Observé que falló la petición con Host incorrecto.
questions.0.points.0: El controlador de ingreso evalúa las reglas de ruta y host.
questions.0.points.1: Apuntar directamente al board evita ese límite de ruta.
questions.0.prompt: ¿Por qué un hostname debería resolverse en ingress endpoint aquí?
questions.1.points.0: No; La selección de backend, el puerto Service y el estado de la aplicación son independientes.
questions.1.points.1: Resolución de prueba y tráfico real del mismo client.
questions.1.prompt: ¿Una respuesta válida DNS demuestra que el HTTP route está en buen estado?
stages.0.objectives.0.text: El Deployment `client` usa solo el resolver DNS privado suministrado.
stages.0.objectives.1.text: Desde el Deployment `client`, `station.internal` se resuelve a la dirección completa
  prevista de la entrada privada.
stages.1.objectives.0.text: El Deployment `client` usa solo el resolver DNS privado suministrado.
stages.1.objectives.1.text: Desde el Deployment `client`, `station.internal` se resuelve a la dirección completa
  prevista de la entrada privada.
stages.1.objectives.2.text: El Ingress privado enruta `/` de `station.internal` hacia la aplicación.
stages.1.objectives.3.text: Desde el Deployment `client`, `http://station.internal:8000` devuelve `north-110` para
  Host `station.internal` y rechaza Host `wrong.station.internal`.
diagnostics.dns_policy: La plantilla del Deployment client puede volver a la política DNS del clúster. Revise dnsPolicy y mantenga None para aplicar el servidor suministrado. [Causa y comprobación](guides#guide=private-dns&section=q110-client-dns-policy)
diagnostics.ingress_class: Ingress puede usar la clase de otro controlador o no poder leer la clase suministrada. Compare ingressClassName con la clase privada antes de revisar las rutas. [Causa y comprobación](guides#guide=kubernetes-10&section=q110-ingress-private-class)
diagnostics.http: Ingress puede estar configurado pero sin reconciliar, o no responder un endpoint de board. Envíe la cabecera Host al URL station.internal:8000 y compare el cuerpo con north-110. [Causa y comprobación](guides#guide=kubernetes-10&section=q110-ingress-live-request)
diagnostics.wrong: Una regla general o backend por defecto puede aceptar un host sin coincidencia. Envíe la cabecera Host distinta al mismo URL y compruebe que la petición no tenga éxito. [Causa y comprobación](guides#guide=kubernetes-10&section=q110-ingress-unmatched-host)
diagnostics.nameserver: Client puede carecer de servidor, apuntar a una dirección antigua o incluir otro resolutor. Compare las direcciones con el único ClusterIP actual de station-dns. Un fallo de lectura del Service o Deployment puede activar la misma condición. [Causa y comprobación](guides#guide=private-dns&section=q110-incident-current-dns-server)
diagnostics.answer: El resolutor puede seguir devolviendo loopback para station.internal o no haber leído el Corefile revisado. Consulte station-dns explícitamente desde client y compare con la dirección fijada del proxy. [Causa y comprobación](guides#guide=private-dns&section=q110-incident-resolver-answer)
diagnostics.host: La regla station.internal puede faltar o no tener una ruta raíz válida. Revise / con Exact o Prefix. Si existen ambas, inspeccione primero Exact para la petición raíz. [Causa y comprobación](guides#guide=kubernetes-10&section=q110-incident-station-root-rule)
diagnostics.backend: La ruta raíz elegida puede seguir en el puerto inexistente 8099 o apuntar a otro Service. Compruebe que cada ruta elegida resuelva un solo puerto TCP de board por nombre o número. Un Ingress, Service o registro ilegible activa la misma condición. [Causa y comprobación](guides#guide=kubernetes-10&section=q110-incident-ingress-service-port)
diagnostics.probe_0_0: El observador DNS puede detenerse antes de señalar un campo si falla el proceso o la entrada. Revise Python y el acceso de lectura a client y station-dns. [Causa y comprobación](guides#guide=private-dns&section=q110-incident-dns-observer-input)
diagnostics.probe_1_0: El observador DNS puede detenerse antes de señalar un campo si falla el proceso o la entrada. Revise Python y el acceso de lectura a client y station-dns. [Causa y comprobación](guides#guide=private-dns&section=q110-incident-dns-observer-input)
diagnostics.probe_1_2: El observador Ingress puede detenerse antes de comparar la ruta elegida. Revise las herramientas y el acceso al Ingress y al Service board. [Causa y comprobación](guides#guide=kubernetes-10&section=q110-incident-ingress-observer-input)
