title: Incidente de entrada Station
brief: "El cliente aún no puede acceder a la estación mediante su nombre privado y punto de entrada.\n\nTrabaja\
  \ en `~/quest` en la estación de trabajo. Entradas por etapa:\n- Etapa 1: `components.env`, `expected-dns-address`,\
  \ `Corefile`, `dns-config.yaml`, `dns.yaml`, `dns-service.yaml`, `client.yaml`.\n- Etapa 2: `ingress-target.json`,\
  \ `ingress.yaml`.\n\n**Requisitos:**\n\n- Etapa 1:\n  - El Deployment `client` usa solo el resolver DNS privado\
  \ suministrado.\n  - Desde el Deployment `client`, `station.internal` se resuelve a la dirección completa prevista\
  \ de la entrada privada.\n- Etapa 2:\n  - El Deployment `client` usa solo el resolver DNS privado suministrado.\n\
  \  - Desde el Deployment `client`, `station.internal` se resuelve a la dirección completa prevista de la entrada\
  \ privada.\n  - El Ingress privado enruta `/` de `station.internal` hacia la aplicación.\n  - Desde el Deployment\
  \ `client`, `http://station.internal:8000` devuelve `north-110` para Host `station.internal` y rechaza Host `wrong.station.internal`.\n\
  \nEl fallo de una petición no establece su causa, y las observaciones actuales de DNS e Ingress no demuestran\
  \ qué cambios o reinicios ocurrieron."
debrief: Las comprobaciones observaron el DNS del Deployment client y los resultados del enrutamiento privado.
stages.0.brief: El cliente debe recibir la dirección DNS privada completa suministrada.
stages.1.brief: La entrada privada debe distinguir el host previsto de uno ajeno.
hints.0.text: Pruebe el límite de resolución de nombres antes de interpretar una falla de enrutamiento HTTP.
hints.1.text: 'La respuesta DNS debe ser el controlador Service, no la aplicación Service. Tras actualizar el registro
  privado, reinicia `deployment/station-dns` y espera la propagación.


  Inspecciona las definiciones suministradas, descripciones de recursos y eventos de la etapa correspondiente.


  ```sh

  cat Corefile

  kubectl describe deployment client

  kubectl describe ingress board

  ```


  Etapa 1/2: Inspecciona estas definiciones de recursos para esta etapa.


  ```sh

  kubectl get deployment client -o yaml

  ```


  Etapa 2: Inspecciona estas definiciones de recursos para esta etapa.


  ```sh

  kubectl get ingress board -o yaml

  cat ingress-target.json

  ```'
hints.2.text: "Reparar DNS, luego Ingress backend; verifique tanto el host headers correcto como el no relacionado.\n\
  \nVerifica la etapa reparada y compara el resultado observado.\n\nEtapa 1/2: La respuesta DNS completa coincide\
  \ con la dirección esperada suministrada.\n\n```sh\nkubectl get service station-dns -o wide\ncat expected-dns-address\n\
  kubectl exec deployment/client -- nslookup station.internal \"$(kubectl get service station-dns -o jsonpath='{.spec.clusterIP}')\"\
  \n```\n\nEtapa 2: El Host previsto devuelve `north-110`; la petición con Host ajeno falla.\n\n```sh\nkubectl exec\
  \ deployment/client -- wget -qO- -T 3 --header='Host: station.internal' http://station.internal:8000\nif kubectl\
  \ exec deployment/client -- wget -qO- -T 3 --header='Host: wrong.station.internal' http://station.internal:8000\
  \ >/dev/null 2>&1; then\n  printf 'Unexpected Host accepted\\n' >&2; exit 1\nelse\n  printf 'Unrelated Host rejected\\\
  n'\nfi\n```\n\nObservaciones esperadas para la etapa completa:\n- Etapa 1/2: La configuración DNS cumple los requisitos\
  \ y la respuesta completa coincide con `expected-dns-address`.\n- Etapa 2: La clase privada, el host, la ruta\
  \ y el backend cumplen los requisitos."
phrases.0: Aislé la resolución DNS de ingress routing.
phrases.1: Mantuve la ruta de solicitud prevista en lugar de pasar por alto un límite.
phrases.2: Observé que falló la petición con Host incorrecto.
questions.0.points.0: El controlador de ingreso evalúa las reglas de ruta y host.
questions.0.points.1: Apuntar directamente al board evita ese límite de ruta.
questions.0.prompt: ¿Por qué un hostname debería resolverse en ingress endpoint aquí?
questions.1.points.0: No; La selección de backend, el puerto Service y el estado de la aplicación son independientes.
questions.1.points.1: Resolución de prueba y tráfico real del mismo client.
questions.1.prompt: ¿Una respuesta válida DNS demuestra que el HTTP route está en buen estado?
diagnostics.dns_policy: deployment/client dnsPolicy debe ser igual a None.
diagnostics.nameserver: deployment/client nameservers debe ser igual a [station-dns Service IP].
diagnostics.answer: La respuesta DNS de station.internal debe contener expected-dns-address.
diagnostics.ingress_class: Ingress board debe usar la clase privada proporcionada.
diagnostics.host: ingress/board rules[0].host debe ser igual a station.internal.
diagnostics.path: ingress/board paths[0].path debe ser igual a /.
diagnostics.path_type: ingress/board paths[0].pathType debe ser igual a Prefix.
diagnostics.backend: ingress/board backend debe ser igual a board:8080.
diagnostics.http: La petición con Host station.internal debe devolver north-110.
diagnostics.wrong: La petición con Host wrong.station.internal debe fallar.
