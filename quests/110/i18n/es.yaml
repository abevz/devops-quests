title: Incidente de entrada Station
brief: 'Trabaja en `~/quest` con `components.env`, `expected-dns-address`, `Corefile`, `dns-config.json`, `dns.json`, `dns-service.json`,
  `client.json`, `ingress-target.json` e `ingress.json`. Un fallo del DNS privado y otro del backend Ingress interrumpen la
  ruta a board. Primero corrige el registro privado `station.internal` a la IP del Service del controlador de `expected-dns-address`,
  reinicia `deployment/station-dns` y espera la propagación DNS. El Deployment client debe conservar `dnsPolicy: None` y exactamente
  la IP del Service DNS privado como servidor de nombres; su respuesta DNS debe contener la dirección prevista completa.


  Después repara Ingress `board`: la clase privada viene de `ingress-target.json`, el primer host es `station.internal`, la
  ruta `/`, el tipo `Prefix` y el primer backend exactamente Service `board` puerto 8080. Espera la reconciliación del controlador.
  Desde el Deployment client, `http://station.internal:8000` con Host `station.internal` debe devolver `north-110`; la misma
  petición con Host `wrong.station.internal` debe fallar. El fallo no demuestra la causa y las comprobaciones actuales no
  prueban qué cambios o reinicios ocurrieron. Usa solo la bahía sin conexión.'
debrief: Las comprobaciones observaron el DNS del Deployment client y los resultados del enrutamiento privado.
stages.0.brief: La política DNS, servidor de nombres y consulta del Deployment client coinciden con la descripción.
stages.0.objectives.0.text: La política DNS, servidor de nombres y consulta del Deployment client coinciden con la descripción.
stages.1.brief: El resultado DNS, campos de Ingress, respuesta correcta y fallo del host incorrecto coinciden con la descripción.
stages.1.objectives.0.text: El resultado DNS, campos de Ingress, respuesta correcta y fallo del host incorrecto coinciden
  con la descripción.
hints.0.text: Pruebe el límite de resolución de nombres antes de interpretar una falla de enrutamiento HTTP.
hints.1.text: La respuesta DNS debe ser el controlador Service, no la aplicación Service.
hints.2.text: Reparar DNS, luego Ingress backend; verifique tanto el host headers correcto como el no relacionado.
phrases.0: Aislé la resolución DNS de ingress routing.
phrases.1: Mantuve la ruta de solicitud prevista en lugar de pasar por alto un límite.
phrases.2: Observé que falló la petición con Host incorrecto.
questions.0.points.0: El controlador de ingreso evalúa las reglas de ruta y host.
questions.0.points.1: Apuntar directamente al board evita ese límite de ruta.
questions.0.prompt: ¿Por qué un hostname debería resolverse en ingress endpoint aquí?
questions.1.points.0: No; La selección de backend, el puerto Service y el estado de la aplicación son independientes.
questions.1.points.1: Resolución de prueba y tráfico real del mismo client.
questions.1.prompt: ¿Una respuesta válida DNS demuestra que el HTTP route está en buen estado?
