title: Station entry incident
brief: "The consumer cannot yet reach the service through its private name and entrypoint.\n\nWork in `~/quest`\
  \ on the workstation. Inputs by stage:\n- Stage 1: `components.env`, `expected-dns-address`, `Corefile`, `dns-config.yaml`,\
  \ `dns.yaml`, `dns-service.yaml`, `client.yaml`.\n- Stage 2: `ingress-target.json`, `ingress.yaml`.\n\n**Requirements:**\n\
  \n- Stage 1:\n  - Deployment `client` uses only the supplied private DNS resolver.\n  - From Deployment `client`,\
  \ `station.internal` resolves to the complete intended private-entrypoint address.\n- Stage 2:\n  - Deployment\
  \ `client` uses only the supplied private DNS resolver.\n  - From Deployment `client`, `station.internal` resolves\
  \ to the complete intended private-entrypoint address.\n  - The private Ingress routes `/` for `station.internal`\
  \ to the application.\n  - From Deployment `client`, `http://station.internal:8000` returns `north-110` for Host\
  \ `station.internal` and rejects Host `wrong.station.internal`.\n\nRequest failure does not establish its cause,\
  \ and current DNS and Ingress observations do not prove which changes or restarts occurred."
debrief: The checks observed the client DNS and private routing results.
stages.0.brief: The requester must receive the complete supplied private DNS address.
stages.1.brief: The private entrypoint must distinguish the intended host from an unrelated host.
hints.0.text: Test the name-resolution boundary before interpreting an HTTP routing failure.
hints.1.text: |-
  The DNS answer must be the controller Service, not the application Service. After updating the private record, restart `deployment/station-dns` and wait for propagation.

  Inspect the supplied definitions, resource descriptions and events for the relevant stage.

  Repair DNS, then the Ingress backend; verify both the correct and unrelated Host headers.

  ```sh
  cat Corefile
  kubectl describe deployment client
  kubectl describe ingress board
  ```

  Stage 1/2: Inspect these resource definitions for this stage.

  ```sh
  kubectl get deployment client -o yaml
  ```

  Stage 2: Inspect these resource definitions for this stage.

  ```sh
  kubectl get ingress board -o yaml
  cat ingress-target.json
  ```
hints.2.text: |-
  Verify the repaired stage and compare the observed result.

  Stage 1/2: The complete DNS answer matches the supplied expected address.

  ```sh
  kubectl get service station-dns -o wide
  cat expected-dns-address
  kubectl exec deployment/client -c worker -- nslookup station.internal "$(kubectl get service station-dns -o jsonpath='{.spec.clusterIP}')"
  ```

  Stage 2: The intended Host returns `north-110`; the unrelated Host request fails.

  ```sh
  kubectl exec deployment/client -c worker -- wget -qO- -T 3 --header='Host: station.internal' http://station.internal:8000
  if kubectl exec deployment/client -c worker -- wget -qO- -T 3 --header='Host: wrong.station.internal' http://station.internal:8000 >/dev/null 2>&1; then
    printf 'Unexpected Host accepted\n' >&2; exit 1
  else
    printf 'Unrelated Host rejected\n'
  fi
  ```

  Expected observations for the complete stage:
  - Stage 1/2: The DNS configuration matches Requirements and the complete answer equals `expected-dns-address`.
  - Stage 2: The private class, host, path and backend match Requirements.
phrases.0: I isolated DNS resolution from ingress routing.
phrases.1: I retained the intended request path instead of bypassing a boundary.
phrases.2: I observed the wrong-Host request fail.
questions.0.points.0: The ingress controller evaluates the Host and path rules.
questions.0.points.1: Pointing directly at the board bypasses that routing boundary.
questions.0.prompt: Why should a hostname resolve to the ingress endpoint here?
questions.1.points.0: No; backend selection, Service port and application health are separate.
questions.1.points.1: Test resolution and actual traffic from the same client.
questions.1.prompt: Does a valid DNS answer prove the HTTP route is healthy?
stages.0.objectives.0.text: Deployment `client` uses only the supplied private DNS resolver.
stages.0.objectives.1.text: From Deployment `client`, `station.internal` resolves to the complete intended private-entrypoint
  address.
stages.1.objectives.0.text: Deployment `client` uses only the supplied private DNS resolver.
stages.1.objectives.1.text: From Deployment `client`, `station.internal` resolves to the complete intended private-entrypoint
  address.
stages.1.objectives.2.text: The private Ingress routes `/` for `station.internal` to the application.
stages.1.objectives.3.text: From Deployment `client`, `http://station.internal:8000` returns `north-110` for Host
  `station.internal` and rejects Host `wrong.station.internal`.
diagnostics.dns_policy: The client template may have reverted to the cluster DNS policy. Inspect its declared dnsPolicy and preserve None so the supplied nameserver configuration can apply. [Cause and check](guides#guide=private-dns&section=q110-client-dns-policy)
diagnostics.ingress_class: The Ingress may use another controller class or the supplied class input may be unreadable. Compare ingressClassName with the provided private class before checking routes. [Cause and check](guides#guide=kubernetes-10&section=q110-ingress-private-class)
diagnostics.http: The Ingress may be configured while the controller has not reconciled it, or no usable board endpoint answers. Send the matching Host header to the station.internal:8000 and compare the live body with north-110. [Cause and check](guides#guide=kubernetes-10&section=q110-ingress-live-request)
diagnostics.wrong: A catch-all rule or default backend may still accept an unmatched host. Send the unrelated Host header through the same URL and verify that the request does not succeed. [Cause and check](guides#guide=kubernetes-10&section=q110-ingress-unmatched-host)
diagnostics.nameserver: The client may have no nameserver, point at an obsolete address or list another resolver. Compare the deployed addresses with the sole current station-dns ClusterIP. Missing Service or Deployment observations can trigger the same condition. [Cause and check](guides#guide=private-dns&section=q110-incident-current-dns-server)
diagnostics.answer: The resolver may still answer station.internal with the old loopback address or fail to read its revised Corefile. Query the station-dns Service explicitly from client and compare the answer with the frozen proxy address. [Cause and check](guides#guide=private-dns&section=q110-incident-resolver-answer)
diagnostics.host: The station.internal rule may be missing or have no usable root path. Check for / with Exact or Prefix. When both exist, inspect Exact first for the root request. [Cause and check](guides#guide=kubernetes-10&section=q110-incident-station-root-rule)
diagnostics.backend: The selected root route may still point at the nonexistent port 8099 or a different Service. Check that each selected path resolves exactly one TCP port on board by number or name. An unreadable Ingress, service or receipt also triggers this condition. [Cause and check](guides#guide=kubernetes-10&section=q110-incident-ingress-service-port)
diagnostics.probe_0_0: The DNS settings observer may exit before it can identify a field if its local process or input fails. Check Python and read access to client and station-dns. [Cause and check](guides#guide=private-dns&section=q110-incident-dns-observer-input)
diagnostics.probe_1_0: The DNS settings observer may exit before it can identify a field if its local process or input fails. Check Python and read access to client and station-dns. [Cause and check](guides#guide=private-dns&section=q110-incident-dns-observer-input)
diagnostics.probe_1_2: The live Ingress observer may fail to start before comparing the selected route. Verify the workstation tools and access to the Ingress and board Service. [Cause and check](guides#guide=kubernetes-10&section=q110-incident-ingress-observer-input)
