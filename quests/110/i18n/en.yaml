title: Station entry incident
brief: 'Work in `~/quest` with `components.env`, `expected-dns-address`, `Corefile`, `dns-config.json`, `dns.json`, `dns-service.json`,
  `client.json`, `ingress-target.json` and `ingress.json`. A private DNS fault and an Ingress backend fault interrupt the
  path to board. First repair the private `station.internal` record to the controller Service IP in `expected-dns-address`,
  restart `deployment/station-dns` and wait for DNS propagation. The client must retain `dnsPolicy: None` and exactly the
  private DNS Service IP as nameserver; its DNS answer must contain the complete expected address.


  Then repair Ingress `board`: its private class comes from `ingress-target.json`, its first host is `station.internal`, path
  `/`, path type `Prefix`, and first backend is exactly Service `board` port 8080. Wait for controller reconciliation. From
  the client, `http://station.internal:8000` with Host `station.internal` must return `north-110`; the same request with Host
  `wrong.station.internal` must fail. Failure does not establish the cause, and current checks do not prove which changes
  or restarts occurred. Use only the offline bay.'
debrief: The checks observed the client DNS and private routing results.
stages.0.brief: The client DNS policy, nameserver and lookup match the brief.
stages.0.objectives.0.text: The client DNS policy, nameserver and lookup match the brief.
stages.1.brief: The DNS result, Ingress fields, matching-host response and failed wrong-host request match the brief.
stages.1.objectives.0.text: The DNS result, Ingress fields, matching-host response and failed wrong-host request match the
  brief.
hints.0.text: Test the name-resolution boundary before interpreting an HTTP routing failure.
hints.1.text: The DNS answer must be the controller Service, not the application Service.
hints.2.text: Repair DNS, then the Ingress backend; verify both the correct and unrelated Host headers.
phrases.0: I isolated DNS resolution from ingress routing.
phrases.1: I retained the intended request path instead of bypassing a boundary.
phrases.2: I observed the wrong-Host request fail.
questions.0.points.0: The ingress controller evaluates the Host and path rules.
questions.0.points.1: Pointing directly at the board bypasses that routing boundary.
questions.0.prompt: Why should a hostname resolve to the ingress endpoint here?
questions.1.points.0: No; backend selection, Service port and application health are separate.
questions.1.points.1: Test resolution and actual traffic from the same client.
questions.1.prompt: Does a valid DNS answer prove the HTTP route is healthy?
diagnostics.dns_policy: deployment/client dnsPolicy must equal None.
diagnostics.nameserver: deployment/client nameservers must equal [station-dns Service IP].
diagnostics.answer: The station.internal DNS answer must contain expected-dns-address.
diagnostics.ingress_class: Ingress board must use the supplied private class.
diagnostics.host: ingress/board rules[0].host must equal station.internal.
diagnostics.path: ingress/board paths[0].path must equal /.
diagnostics.path_type: ingress/board paths[0].pathType must equal Prefix.
diagnostics.backend: ingress/board backend must equal board:8080.
diagnostics.http: The request with Host station.internal must return north-110.
diagnostics.wrong: The request with Host wrong.station.internal must fail.
