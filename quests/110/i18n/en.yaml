title: Station entry incident
brief: 'Two independent faults interrupt client → private DNS → private ingress → board. First repair
  the custom DNS record station.internal so it resolves to the controller Service IP frozen in expected-dns-address;
  the client intentionally uses only station-dns. Then repair the Ingress backend Service port to 8080,
  preserving its host, Prefix path and class. Verify actual HTTP through http://station.internal:8000
  from client, including rejection of an unrelated Host header. Do not bypass the controller with the
  board IP or change cluster DNS.


  Quest files in `~/quest` (some appear in later stages): `components.env`, `expected-dns-address`, `Corefile`,
  `dns-config.json`, `client.json`, `ingress-target.json`, `ingress.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: The custom DNS answer matches the private controller Service IP; the next
  stage diagnoses HTTP routing.'
debrief: Independent DNS and HTTP routing faults were recovered while retaining the complete private request
  path.
