hints.0.text: Test the name-resolution boundary before interpreting an HTTP routing failure.
hints.1.text: The DNS answer must be the controller Service, not the application Service.
hints.2.text: Repair DNS, then the Ingress backend; verify both the correct and unrelated Host headers.
phrases.0: I isolated DNS resolution from ingress routing.
phrases.1: I retained the intended request path instead of bypassing a boundary.
phrases.2: I verified end-to-end traffic and a negative host match.
questions.0.points.0: The ingress controller evaluates the Host and path rules.
questions.0.points.1: Pointing directly at the board bypasses that routing boundary.
questions.0.prompt: Why should a hostname resolve to the ingress endpoint here?
questions.1.points.0: No; backend selection, Service port and application health are separate.
questions.1.points.1: Test resolution and actual traffic from the same client.
questions.1.prompt: Does a valid DNS answer prove the HTTP route is healthy?
