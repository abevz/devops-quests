title: Incydent z wejściem na station
brief: 'Dwie niezależne usterki przerywają ścieżkę client → prywatny DNS → prywatny ingress → board. Najpierw
  napraw niestandardowy rekord DNS station.internal, aby wskazywał na Service kontrolera o IP zapisanym
  w expected-dns-address; client celowo używa wyłącznie station-dns. Następnie napraw port zaplecza Service
  w Ingress, ustawiając go na 8080 i zachowując host, Prefix path oraz class. Sprawdź rzeczywisty ruch
  HTTP przez http://station.internal:8000 z client, w tym odrzucenie niepowiązanego Host header. Nie omijaj
  kontrolera, używając IP board, ani nie zmieniaj DNS klastra.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `components.env`, `expected-dns-address`,
  `Corefile`, `dns-config.json`, `client.json`, `ingress-target.json`, `ingress.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: niestandardowa odpowiedź DNS pasuje do prywatnego kontrolera Service IP;
  kolejny etap diagnozuje routing HTTP.'
debrief: Naprawiono niezależne błędy routingu DNS i HTTP, zachowując pełną ścieżkę prywatnych żądań.
stages.0.brief: 'Kryteria sukcesu: niestandardowa odpowiedź DNS pasuje do prywatnego kontrolera Service
  IP; kolejny etap diagnozuje routing HTTP.'
stages.0.objectives.0.text: Niestandardowa odpowiedź DNS pasuje do prywatnego kontrolera Service IP; kolejny
  etap diagnozuje routing HTTP.
stages.1.brief: 'Kryteria sukcesu: ten sam client rozwiązuje station.internal i osiąga north-110 poprzez
  prawdziwy ingress rule; niepowiązany Host nie jest trasowany.'
stages.1.objectives.0.text: Ten sam client rozwiązuje station.internal i osiąga north-110 poprzez prawdziwy
  ingress rule; niepowiązany Host nie jest trasowany.
hints.0.text: Przed zinterpretowaniem błędu routingu HTTP przetestuj granicę rozpoznawania nazw.
hints.1.text: Odpowiedzią DNS musi być kontroler Service, a nie aplikacja Service.
hints.2.text: Napraw DNS, a następnie backend Ingress; sprawdź zarówno poprawny, jak i niepowiązany Host
  headers.
phrases.0: Odizolowałem rozdzielczość DNS od ingress routing.
phrases.1: Zachowałem zamierzoną ścieżkę żądania zamiast omijać granicę.
phrases.2: Zweryfikowałem ruch typu end-to-end i negatywny wynik host.
questions.0.points.0: Kontroler wejściowy ocenia reguły Host i path.
questions.0.points.1: Wskazywanie bezpośrednio na board omija tę granicę routingu.
questions.0.prompt: Dlaczego tutaj hostname powinno odpowiadać ingress endpoint?
questions.1.points.0: NIE; Wybór backend, port Service i stan aplikacji są oddzielne.
questions.1.points.1: Testuj rozdzielczość i rzeczywisty ruch z tego samego client.
questions.1.prompt: Czy prawidłowa odpowiedź DNS dowodzi, że trasa HTTP jest sprawna?
