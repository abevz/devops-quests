title: Incydent z wejściem na station
brief: 'Pracuj w `~/quest` z `components.env`, `expected-dns-address`, `Corefile`, `dns-config.json`, `dns.json`, `dns-service.json`,
  `client.json`, `ingress-target.json` i `ingress.json`. Błąd prywatnego DNS i backendu Ingress przerywają drogę do board.
  Najpierw popraw prywatny rekord `station.internal` na IP Service kontrolera z `expected-dns-address`, zrestartuj `deployment/station-dns`
  i poczekaj na propagację DNS. Deployment client musi zachować `dnsPolicy: None` i dokładnie IP prywatnego Service DNS jako
  serwer nazw; odpowiedź DNS musi zawierać pełny oczekiwany adres.


  Następnie napraw Ingress `board`: prywatna klasa pochodzi z `ingress-target.json`, pierwszy host to `station.internal`,
  ścieżka `/`, typ `Prefix`, a pierwszy backend to dokładnie Service `board` port 8080. Poczekaj na uzgodnienie kontrolera.
  Z Deploymentu client `http://station.internal:8000` z Host `station.internal` musi zwrócić `north-110`; to samo żądanie
  z Host `wrong.station.internal` musi się nie udać. Błąd nie dowodzi przyczyny, a bieżące kontrole nie dowodzą wykonanych
  zmian lub restartów. Używaj tylko zatoki offline.'
debrief: Kontrole sprawdziły DNS Deploymentu client i wyniki prywatnego routingu.
stages.0.brief: Polityka DNS Deploymentu client, serwer nazw i wynik wyszukiwania odpowiadają opisowi.
stages.0.objectives.0.text: Polityka DNS Deploymentu client, serwer nazw i wynik wyszukiwania odpowiadają opisowi.
stages.1.brief: Wynik DNS, pola Ingress, właściwa odpowiedź i nieudane żądanie błędnego hosta odpowiadają opisowi.
stages.1.objectives.0.text: Wynik DNS, pola Ingress, właściwa odpowiedź i nieudane żądanie błędnego hosta odpowiadają opisowi.
hints.0.text: Przed zinterpretowaniem błędu routingu HTTP przetestuj granicę rozpoznawania nazw.
hints.1.text: Odpowiedzią DNS musi być kontroler Service, a nie aplikacja Service.
hints.2.text: Napraw DNS, a następnie backend Ingress; sprawdź zarówno poprawny, jak i niepowiązany Host headers.
phrases.0: Odizolowałem rozdzielczość DNS od ingress routing.
phrases.1: Zachowałem zamierzoną ścieżkę żądania zamiast omijać granicę.
phrases.2: Zaobserwowałem nieudane żądanie z błędnym Host.
questions.0.points.0: Kontroler wejściowy ocenia reguły Host i path.
questions.0.points.1: Wskazywanie bezpośrednio na board omija tę granicę routingu.
questions.0.prompt: Dlaczego tutaj hostname powinno odpowiadać ingress endpoint?
questions.1.points.0: NIE; Wybór backend, port Service i stan aplikacji są oddzielne.
questions.1.points.1: Testuj rozdzielczość i rzeczywisty ruch z tego samego client.
questions.1.prompt: Czy prawidłowa odpowiedź DNS dowodzi, że trasa HTTP jest sprawna?
