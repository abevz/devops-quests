title: Incydent z wejściem na station
brief: "Klient nie może jeszcze dotrzeć do stacji przez jej prywatną nazwę i punkt wejścia.\n\nPracuj w `~/quest`\
  \ na stacji roboczej. Dane wejściowe według etapu:\n- Etap 1: `components.env`, `expected-dns-address`, `Corefile`,\
  \ `dns-config.yaml`, `dns.yaml`, `dns-service.yaml`, `client.yaml`.\n- Etap 2: `ingress-target.json`, `ingress.yaml`.\n\
  \n**Wymagania:**\n\n- Etap 1:\n  - Deployment `client` używa tylko dostarczonego prywatnego resolvera DNS.\n \
  \ - Z Deployment `client` nazwa `station.internal` rozwiązuje się do pełnego właściwego adresu prywatnego punktu\
  \ wejścia.\n- Etap 2:\n  - Deployment `client` używa tylko dostarczonego prywatnego resolvera DNS.\n  - Z Deployment\
  \ `client` nazwa `station.internal` rozwiązuje się do pełnego właściwego adresu prywatnego punktu wejścia.\n \
  \ - Prywatny Ingress kieruje `/` dla `station.internal` do aplikacji.\n  - Z Deployment `client` adres `http://station.internal:8000`\
  \ zwraca `north-110` dla Host `station.internal` i odrzuca Host `wrong.station.internal`.\n\nNiepowodzenie żądania\
  \ nie ustala jego przyczyny, a bieżące obserwacje DNS i Ingress nie dowodzą, jakie zmiany lub restarty nastąpiły."
debrief: Kontrole sprawdziły DNS Deploymentu client i wyniki prywatnego routingu.
stages.0.brief: Klient musi otrzymywać pełny dostarczony prywatny adres DNS.
stages.1.brief: Prywatny punkt wejścia musi odróżniać właściwy host od obcego.
hints.0.text: Przed zinterpretowaniem błędu routingu HTTP przetestuj granicę rozpoznawania nazw.
hints.1.text: 'Odpowiedzią DNS musi być kontroler Service, a nie aplikacja Service. Po aktualizacji prywatnego rekordu
  zrestartuj `deployment/station-dns` i poczekaj na propagację.


  Sprawdź dostarczone definicje, opisy zasobów i zdarzenia odpowiedniego etapu.


  ```sh

  cat Corefile

  kubectl describe deployment client

  kubectl describe ingress board

  ```


  Etap 1/2: Sprawdź te definicje zasobów dla tego etapu.


  ```sh

  kubectl get deployment client -o yaml

  ```


  Etap 2: Sprawdź te definicje zasobów dla tego etapu.


  ```sh

  kubectl get ingress board -o yaml

  cat ingress-target.json

  ```'
hints.2.text: |-
  Napraw DNS, a następnie backend Ingress; sprawdź zarówno poprawny, jak i niepowiązany Host headers.

  Sprawdź naprawiony etap i porównaj obserwowany wynik.

  Etap 1/2: Pełna odpowiedź DNS odpowiada dostarczonemu oczekiwanemu adresowi.

  ```sh
  kubectl get service station-dns -o wide
  cat expected-dns-address
  kubectl exec deployment/client -c worker -- nslookup station.internal "$(kubectl get service station-dns -o jsonpath='{.spec.clusterIP}')"
  ```

  Etap 2: Właściwy Host zwraca `north-110`; żądanie z obcym Host kończy się niepowodzeniem.

  ```sh
  kubectl exec deployment/client -c worker -- wget -qO- -T 3 --header='Host: station.internal' http://station.internal:8000
  if kubectl exec deployment/client -c worker -- wget -qO- -T 3 --header='Host: wrong.station.internal' http://station.internal:8000 >/dev/null 2>&1; then
    printf 'Unexpected Host accepted\n' >&2; exit 1
  else
    printf 'Unrelated Host rejected\n'
  fi
  ```

  Oczekiwane obserwacje dla całego etapu:
  - Etap 1/2: Konfiguracja DNS spełnia wymagania, a pełna odpowiedź odpowiada `expected-dns-address`.
  - Etap 2: Prywatna klasa, host, ścieżka i backend spełniają wymagania.

phrases.0: Odizolowałem rozdzielczość DNS od ingress routing.
phrases.1: Zachowałem zamierzoną ścieżkę żądania zamiast omijać granicę.
phrases.2: Zaobserwowałem nieudane żądanie z błędnym Host.
questions.0.points.0: Kontroler wejściowy ocenia reguły Host i path.
questions.0.points.1: Wskazywanie bezpośrednio na board omija tę granicę routingu.
questions.0.prompt: Dlaczego tutaj hostname powinno odpowiadać ingress endpoint?
questions.1.points.0: NIE; Wybór backend, port Service i stan aplikacji są oddzielne.
questions.1.points.1: Testuj rozdzielczość i rzeczywisty ruch z tego samego client.
questions.1.prompt: Czy prawidłowa odpowiedź DNS dowodzi, że trasa HTTP jest sprawna?
