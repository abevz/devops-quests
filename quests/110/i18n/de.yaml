title: Station Eintrittsvorfall
brief: 'Zwei unabhängige Fehler unterbrechen client → privat DNS → privat ingress → board. Reparieren
  Sie zunächst den benutzerdefinierten DNS-Datensatz station.internal, damit er in den Controller Service
  IP eingefroren in expected-dns-address aufgelöst wird. Der client verwendet bewusst nur station-dns.
  Reparieren Sie dann den Port Ingress backend Service auf 8080 und behalten Sie dabei den Host, den Prefix-Pfad
  und class bei. Überprüfen Sie den tatsächlichen HTTP bis http://station.internal:8000 von client, einschließlich
  der Ablehnung eines nicht verwandten Hosts header. Umgehen Sie den Controller nicht mit dem board IP
  oder ändern Sie den Cluster DNS.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `components.env`, `expected-dns-address`,
  `Corefile`, `dns-config.json`, `client.json`, `ingress-target.json`, `ingress.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Anfängliche Erfolgskriterien: Die benutzerdefinierte Antwort DNS entspricht dem privaten Controller
  Service IP; In der nächsten Phase wird das HTTP-Routing diagnostiziert.'
debrief: Unabhängige Routingfehler DNS und HTTP wurden unter Beibehaltung des vollständigen privaten Anforderungspfads
  behoben.
stages.0.brief: 'Erfolgskriterien: Die benutzerdefinierte Antwort DNS entspricht dem privaten Controller
  Service IP; In der nächsten Phase wird das HTTP-Routing diagnostiziert.'
stages.0.objectives.0.text: Die benutzerdefinierte Antwort DNS entspricht dem privaten Controller Service
  IP; In der nächsten Phase wird das HTTP-Routing diagnostiziert.
stages.1.brief: 'Erfolgskriterium: Derselbe client löst station.internal auf und erreicht north-110 über
  den echten ingress rule; ein unabhängiger Host nicht route.'
stages.1.objectives.0.text: Derselbe client löst station.internal auf und erreicht north-110 über den
  echten ingress rule; ein unabhängiger Host nicht route.
hints.0.text: Testen Sie die Namensauflösungsgrenze, bevor Sie einen HTTP-Routing-Fehler interpretieren.
hints.1.text: Die Antwort DNS muss der Controller Service sein, nicht die Anwendung Service.
hints.2.text: Reparatur DNS, dann Ingress backend; Überprüfen Sie sowohl den richtigen als auch den nicht
  zugehörigen Host headers.
phrases.0: Ich habe die Auflösung DNS von ingress routing isoliert.
phrases.1: Ich habe den beabsichtigten Anforderungspfad beibehalten, anstatt eine Grenze zu umgehen.
phrases.2: Ich habe den End-to-End-Verkehr und eine negative Host-Übereinstimmung überprüft.
questions.0.points.0: Der Eingangscontroller wertet die Host- und Pfadregeln aus.
questions.0.points.1: Wenn Sie direkt auf den board zeigen, wird diese Routing-Grenze umgangen.
questions.0.prompt: Warum sollte hier ein hostname zum ingress endpoint aufgelöst werden?
questions.1.points.0: NEIN; backend-Auswahl, Service-Port und Anwendungszustand sind getrennt.
questions.1.points.1: Testauflösung und tatsächlicher Datenverkehr vom gleichen client.
questions.1.prompt: Beweist eine gültige DNS-Antwort, dass der HTTP route fehlerfrei ist?
