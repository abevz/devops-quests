title: Station Eintrittsvorfall
brief: "Der Client erreicht die Station noch nicht über ihren privaten Namen und Einstiegspunkt.\n\nArbeiten Sie\
  \ in `~/quest` auf der Workstation. Eingaben je Phase:\n- Phase 1: `components.env`, `expected-dns-address`, `Corefile`,\
  \ `dns-config.yaml`, `dns.yaml`, `dns-service.yaml`, `client.yaml`.\n- Phase 2: `ingress-target.json`, `ingress.yaml`.\n\
  \n**Anforderungen:**\n\n- Phase 1:\n  - Deployment `client` verwendet nur den mitgelieferten privaten DNS-Resolver.\n\
  \  - Von Deployment `client` wird `station.internal` zur vollständigen vorgesehenen Adresse des privaten Einstiegspunkts\
  \ aufgelöst.\n- Phase 2:\n  - Deployment `client` verwendet nur den mitgelieferten privaten DNS-Resolver.\n  -\
  \ Von Deployment `client` wird `station.internal` zur vollständigen vorgesehenen Adresse des privaten Einstiegspunkts\
  \ aufgelöst.\n  - Der private Ingress leitet `/` für `station.internal` an die Anwendung weiter.\n  - Von Deployment\
  \ `client` liefert `http://station.internal:8000` für Host `station.internal` den Wert `north-110` und weist Host\
  \ `wrong.station.internal` ab.\n\nEin fehlgeschlagener Request belegt seine Ursache nicht, und aktuelle DNS- und\
  \ Ingress-Beobachtungen zeigen nicht, welche Änderungen oder Neustarts erfolgten."
debrief: Die Prüfungen beobachteten Client-DNS und Ergebnisse des privaten Routings.
stages.0.brief: Der Client muss die vollständige mitgelieferte private DNS-Adresse erhalten.
stages.1.brief: Der private Einstiegspunkt muss den vorgesehenen von einem fremden Host unterscheiden.
hints.0.text: Testen Sie die Namensauflösungsgrenze, bevor Sie einen HTTP-Routing-Fehler interpretieren.
hints.1.text: 'Die Antwort DNS muss der Controller Service sein, nicht die Anwendung Service. Starten Sie nach dem
  Ändern des privaten Eintrags `deployment/station-dns` neu und warten Sie auf die Verbreitung.


  Prüfen Sie mitgelieferte Definitionen, Ressourcenbeschreibungen und Ereignisse der jeweiligen Phase.


  ```sh

  cat Corefile

  kubectl describe deployment client

  kubectl describe ingress board

  ```


  Phase 1/2: Prüfen Sie diese Ressourcendefinitionen für diese Phase.


  ```sh

  kubectl get deployment client -o yaml

  ```


  Phase 2: Prüfen Sie diese Ressourcendefinitionen für diese Phase.


  ```sh

  kubectl get ingress board -o yaml

  cat ingress-target.json

  ```'
hints.2.text: "Reparatur DNS, dann Ingress backend; Überprüfen Sie sowohl den richtigen als auch den nicht zugehörigen\
  \ Host headers.\n\nPrüfen Sie die reparierte Phase und vergleichen Sie das beobachtete Ergebnis.\n\nPhase 1/2:\
  \ Die vollständige DNS-Antwort entspricht der mitgelieferten erwarteten Adresse.\n\n```sh\nkubectl get service\
  \ station-dns -o wide\ncat expected-dns-address\nkubectl exec deployment/client -- nslookup station.internal \"\
  $(kubectl get service station-dns -o jsonpath='{.spec.clusterIP}')\"\n```\n\nPhase 2: Der vorgesehene Host liefert\
  \ `north-110`; die Anfrage mit fremdem Host schlägt fehl.\n\n```sh\nkubectl exec deployment/client -- wget -qO-\
  \ -T 3 --header='Host: station.internal' http://station.internal:8000\nif kubectl exec deployment/client -- wget\
  \ -qO- -T 3 --header='Host: wrong.station.internal' http://station.internal:8000 >/dev/null 2>&1; then\n  printf\
  \ 'Unexpected Host accepted\\n' >&2; exit 1\nelse\n  printf 'Unrelated Host rejected\\n'\nfi\n```\n\nErwartete\
  \ Beobachtungen für die gesamte Phase:\n- Phase 1/2: Die DNS-Konfiguration erfüllt die Anforderungen und die vollständige\
  \ Antwort entspricht `expected-dns-address`.\n- Phase 2: Private Klasse, Host, Pfad und Backend erfüllen die Anforderungen."
phrases.0: Ich habe die Auflösung DNS von ingress routing isoliert.
phrases.1: Ich habe den beabsichtigten Anforderungspfad beibehalten, anstatt eine Grenze zu umgehen.
phrases.2: Ich habe beobachtet, dass die Anfrage mit falschem Host fehlschlug.
questions.0.points.0: Der Eingangscontroller wertet die Host- und Pfadregeln aus.
questions.0.points.1: Wenn Sie direkt auf den board zeigen, wird diese Routing-Grenze umgangen.
questions.0.prompt: Warum sollte hier ein hostname zum ingress endpoint aufgelöst werden?
questions.1.points.0: NEIN; backend-Auswahl, Service-Port und Anwendungszustand sind getrennt.
questions.1.points.1: Testauflösung und tatsächlicher Datenverkehr vom gleichen client.
questions.1.prompt: Beweist eine gültige DNS-Antwort, dass der HTTP route fehlerfrei ist?
diagnostics.dns_policy: deployment/client dnsPolicy muss None entsprechen.
diagnostics.nameserver: deployment/client nameservers muss [station-dns Service IP] entsprechen.
diagnostics.answer: Die DNS-Antwort von station.internal muss expected-dns-address enthalten.
diagnostics.ingress_class: Ingress board muss die bereitgestellte private Klasse verwenden.
diagnostics.host: ingress/board rules[0].host muss station.internal entsprechen.
diagnostics.path: ingress/board paths[0].path muss / entsprechen.
diagnostics.path_type: ingress/board paths[0].pathType muss Prefix entsprechen.
diagnostics.backend: ingress/board backend muss board:8080 entsprechen.
diagnostics.http: Die Anfrage mit Host station.internal muss north-110 liefern.
diagnostics.wrong: Die Anfrage mit Host wrong.station.internal muss fehlschlagen.
