diagnostics.dns_policy: Die Vorlage des Deployments client verwendet möglicherweise wieder die Cluster-DNS-Richtlinie. Prüfen Sie dnsPolicy und behalten Sie None für die gelieferte Nameserver-Konfiguration bei. [Ursache und Prüfung](guides#guide=private-dns&section=q110-client-dns-policy)
diagnostics.ingress_class: Der Ingress verwendet möglicherweise die Klasse eines anderen Controllers oder die gelieferte Klasse ist nicht lesbar. Vergleichen Sie ingressClassName vor der Routenprüfung mit der privaten Klasse. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q110-ingress-private-class)
diagnostics.http: Der Ingress ist möglicherweise konfiguriert, aber noch nicht abgeglichen, oder kein nutzbarer board-Endpoint antwortet. Senden Sie den passenden Host-Header an die URL station.internal:8000 und vergleichen Sie mit north-110. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q110-ingress-live-request)
diagnostics.wrong: Eine Auffangregel oder das Standard-Backend akzeptiert möglicherweise einen fremden Host. Senden Sie den anderen Host-Header an dieselbe URL und prüfen Sie, dass die Anfrage scheitert. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q110-ingress-unmatched-host)
diagnostics.nameserver: Client hat möglicherweise keinen Nameserver, nutzt eine alte Adresse oder enthält einen anderen Resolver. Vergleichen Sie die Adressen mit der einzigen aktuellen ClusterIP von station-dns. Lesefehler bei Service oder Deployment können dieselbe Meldung auslösen. [Ursache und Prüfung](guides#guide=private-dns&section=q110-incident-current-dns-server)
diagnostics.answer: Der Resolver liefert für station.internal möglicherweise noch Loopback oder hat das geänderte Corefile nicht geladen. Fragen Sie station-dns ausdrücklich aus client ab und vergleichen Sie mit der festgehaltenen Proxy-Adresse. [Ursache und Prüfung](guides#guide=private-dns&section=q110-incident-resolver-answer)
diagnostics.host: Die Regel station.internal fehlt möglicherweise oder hat keinen passenden Wurzelpfad. Prüfen Sie / mit Exact oder Prefix. Wenn beide vorliegen, prüfen Sie für die Wurzelanfrage zunächst Exact. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q110-incident-station-root-rule)
diagnostics.backend: Die ausgewählte Wurzelroute verweist möglicherweise noch auf Port 8099 oder einen anderen Service. Prüfen Sie für jeden ausgewählten Pfad eine eindeutige TCP-Portauflösung an board nach Name oder Nummer. Nicht lesbarer Ingress, Service oder Beleg führt zur gleichen Meldung. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q110-incident-ingress-service-port)
diagnostics.probe_0_0: Die DNS-Prüfung kann vor der Feldmeldung abbrechen, wenn Prozess oder Eingaben fehlschlagen. Prüfen Sie Python und Lesezugriff auf client und station-dns. [Ursache und Prüfung](guides#guide=private-dns&section=q110-incident-dns-observer-input)
diagnostics.probe_1_0: Die DNS-Prüfung kann vor der Feldmeldung abbrechen, wenn Prozess oder Eingaben fehlschlagen. Prüfen Sie Python und Lesezugriff auf client und station-dns. [Ursache und Prüfung](guides#guide=private-dns&section=q110-incident-dns-observer-input)
diagnostics.probe_1_2: Die Ingress-Prüfung kann vor dem Vergleich der ausgewählten Route abbrechen. Prüfen Sie die Workstation-Werkzeuge und den Zugriff auf Ingress und Service board. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q110-incident-ingress-observer-input)
