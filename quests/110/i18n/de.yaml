title: Station Eintrittsvorfall
brief: 'Arbeite in `~/quest` mit `components.env`, `expected-dns-address`, `Corefile`, `dns-config.json`, `dns.json`, `dns-service.json`,
  `client.json`, `ingress-target.json` und `ingress.json`. Ein privater DNS-Fehler und ein Ingress-Backend-Fehler unterbrechen
  den Weg zum Board. Korrigiere zuerst den privaten Eintrag `station.internal` auf die Controller-Service-IP aus `expected-dns-address`,
  starte `deployment/station-dns` neu und warte auf die DNS-Verteilung. Der Client muss `dnsPolicy: None` und genau die private
  DNS-Service-IP als Nameserver behalten; seine DNS-Antwort muss die vollständige erwartete Adresse enthalten.


  Repariere dann Ingress `board`: Die private Klasse stammt aus `ingress-target.json`, der erste Host ist `station.internal`,
  Pfad `/`, Typ `Prefix`, und das erste Backend genau Service `board` Port 8080. Warte auf den Controller-Abgleich. Vom Client
  muss `http://station.internal:8000` mit Host `station.internal` `north-110` liefern; dieselbe Anfrage mit Host `wrong.station.internal`
  muss fehlschlagen. Der Fehlschlag beweist die Ursache nicht, und aktuelle Prüfungen beweisen keine vergangenen Änderungen
  oder Neustarts. Nutze nur die Offline-Umgebung.'
debrief: Die Prüfungen beobachteten Client-DNS und Ergebnisse des privaten Routings.
stages.0.brief: DNS-Policy, Nameserver und Abfrage des Deployment client entsprechen der Beschreibung.
stages.0.objectives.0.text: DNS-Policy, Nameserver und Abfrage des Deployment client entsprechen der Beschreibung.
stages.1.brief: DNS-Ergebnis, Ingress-Felder, passende Antwort und fehlgeschlagene Anfrage des falschen Hosts entsprechen
  der Beschreibung.
stages.1.objectives.0.text: DNS-Ergebnis, Ingress-Felder, passende Antwort und fehlgeschlagene Anfrage des falschen Hosts
  entsprechen der Beschreibung.
hints.0.text: Testen Sie die Namensauflösungsgrenze, bevor Sie einen HTTP-Routing-Fehler interpretieren.
hints.1.text: Die Antwort DNS muss der Controller Service sein, nicht die Anwendung Service.
hints.2.text: Reparatur DNS, dann Ingress backend; Überprüfen Sie sowohl den richtigen als auch den nicht zugehörigen Host
  headers.
phrases.0: Ich habe die Auflösung DNS von ingress routing isoliert.
phrases.1: Ich habe den beabsichtigten Anforderungspfad beibehalten, anstatt eine Grenze zu umgehen.
phrases.2: Ich habe beobachtet, dass die Anfrage mit falschem Host fehlschlug.
questions.0.points.0: Der Eingangscontroller wertet die Host- und Pfadregeln aus.
questions.0.points.1: Wenn Sie direkt auf den board zeigen, wird diese Routing-Grenze umgangen.
questions.0.prompt: Warum sollte hier ein hostname zum ingress endpoint aufgelöst werden?
questions.1.points.0: NEIN; backend-Auswahl, Service-Port und Anwendungszustand sind getrennt.
questions.1.points.1: Testauflösung und tatsächlicher Datenverkehr vom gleichen client.
questions.1.prompt: Beweist eine gültige DNS-Antwort, dass der HTTP route fehlerfrei ist?
diagnostics.dns_policy: deployment/client dnsPolicy muss None entsprechen.
diagnostics.nameserver: deployment/client nameservers muss [station-dns Service IP] entsprechen.
diagnostics.answer: Die DNS-Antwort von station.internal muss expected-dns-address enthalten.
diagnostics.ingress_class: Ingress board muss die bereitgestellte private Klasse verwenden.
diagnostics.host: ingress/board rules[0].host muss station.internal entsprechen.
diagnostics.path: ingress/board paths[0].path muss / entsprechen.
diagnostics.path_type: ingress/board paths[0].pathType muss Prefix entsprechen.
diagnostics.backend: ingress/board backend muss board:8080 entsprechen.
diagnostics.http: Die Anfrage mit Host station.internal muss north-110 liefern.
diagnostics.wrong: Die Anfrage mit Host wrong.station.internal muss fehlschlagen.
