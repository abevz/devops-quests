title: Сломанный контракт модуля
brief: |-
  Общий модуль сообщений не предоставляет сообщение станции получателю. Восстановите управляемое сообщение и выходное значение корневого модуля.

  Работайте в `~/quest` на workstation. Предоставленные входные файлы: `main.tf`, `terraform.tfvars`, `module-contract.json`, `modules/notice/main.tf`, `modules/dispatch/main.tf`.

  **Требования:**
  - State OpenTofu содержит:
    - Файл сообщения предоставленного модуля учтён в state OpenTofu.
  - Выходные значения корневого модуля:
    - `message`: `north-ready`
  - OpenTofu сообщает об отсутствии ожидающих изменений инфраструктуры.

  - Поведение задано в `module-contract.json`. Оба модуля должны сохранять сообщение, определяемое caller, а существующую идентичность consumer нельзя заменять.

  Проверка наблюдает текущие результаты; она не устанавливает полную историю выполнения.
stages.0.brief: Общий модуль должен предоставлять требуемое управляемое сообщение станции.
stages.0.objectives.0.text: Файлы producer и consumer остаются управляемыми в соответствующих модулях
  с сохранением исходной идентичности consumer.
stages.0.objectives.1.text: Корневое сообщение следует контракту caller для каждого выданного варианта
  station; его текущее значение — `north-ready`.
stages.0.objectives.2.text: OpenTofu сообщает об отсутствии ожидающих изменений инфраструктуры.
hints.0.text: Интерфейсы модулей связывают caller, producer и consumer; правильный локальный output не
  подтверждает весь контракт.
hints.1.text: |-
  Сравните корневые вызовы, оба дочерних модуля и ошибки validate. Изучите существующий state до принятия плана с заменой consumer.

  ```sh
  cat main.tf terraform.tfvars module-contract.json
  tofu validate
  tofu show -no-color
  ```
hints.2.text: |-
  Постройте недостающие объявления producer и согласуйте типизированные input/output downstream-модуля. Проверьте сохранённый ID consumer, каждый вариант caller и итоговый пустой план.

  - `tofu output -raw message`
  - `tofu plan -input=false -detailed-exitcode -no-color`

  ```sh
  cat module-contract.json
  tofu state list
  cat original-consumer-id
  tofu output -raw message
  tofu plan -input=false -var=station=south -no-color
  tofu plan -input=false -detailed-exitcode -no-color
  ```
debrief: Файлы producer и consumer остаются управляемыми в соответствующих модулях с сохранением исходной
  идентичности consumer. Корневое сообщение следует контракту caller для каждого выданного варианта station;
  его текущее значение — `north-ready`.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я сравнил ID живого ресурса с state OpenTofu.
diagnostics.probe_0_0: Файлы producer и consumer остаются управляемыми в соответствующих модулях с сохранением
  исходной идентичности consumer.
diagnostics.module_contract: Обе границы модулей должны передавать сообщение от caller в корректном плане.
diagnostics.probe_0_1: Корневое сообщение следует контракту caller для каждого выданного варианта station;
  его текущее значение — `north-ready`.
