title: Сломанный контракт модуля
brief: |-
  Общий модуль сообщений не предоставляет сообщение станции получателю. Восстановите управляемое сообщение и выходное значение корневого модуля.

  Работайте в `~/quest` на workstation. Предоставленные входные файлы: `main.tf`, `modules/notice/main.tf`.

  **Требования:**
  - State OpenTofu содержит:
    - Файл сообщения предоставленного модуля учтён в state OpenTofu.
  - Выходные значения корневого модуля:
    - `message`: `north-ready`
  - OpenTofu сообщает об отсутствии ожидающих изменений инфраструктуры.

  Проверка наблюдает текущие результаты; она не устанавливает полную историю выполнения.
stages.0.brief: Общий модуль должен предоставлять требуемое управляемое сообщение станции.
stages.0.objectives.0.text: Файл сообщения предоставленного модуля учтён в state OpenTofu.
stages.0.objectives.1.text: Output `message` возвращает `north-ready`.
stages.0.objectives.2.text: OpenTofu сообщает об отсутствии ожидающих изменений инфраструктуры.
hints.0.text: Дочерний модуль публикует контракт, который использует корневая конфигурация.
hints.1.text: |-
  Прочитайте ошибки validate на границе дочернего модуля. Модуль использует необъявленную station и возвращает отсутствующий ресурс.

  Изучите предоставленную конфигурацию и текущие наблюдения на workstation:

  ```sh
  tofu validate
  cat main.tf modules/notice/main.tf
  ```
hints.2.text: |-
  Объявите строковую station, верните local_file.notice.content как message, затем apply и повторный plan.

  Проверьте результат из `~/quest` на workstation:

  Выполняйте эти команды наблюдения из `~/quest` на workstation.
  - `tofu state list` — Ожидаются адреса state из требований.
  - `tofu output -raw message` — Ожидается, что получатель получает `north-ready`.
  - `tofu plan -input=false -detailed-exitcode -no-color` — Ожидаются отсутствие изменений и код завершения `0`.
debrief: Дочерний модуль не объявлял вход и ссылался на отсутствующий ресурс в output. Вы исправили контракт,
  проверили значение и пустой plan.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я сравнил ID живого ресурса с state OpenTofu.
