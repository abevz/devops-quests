title: Сломанный контракт модуля
brief: 'Вы в команде эксплуатации SignalRail. Исправьте входную переменную и выход модуля. Работайте в
  ~/quest. Все изменения — только в этой песочнице.


  Входные файлы в `~/quest`: `main.tf`, `modules/notice/main.tf`.


  В песочнице нет интернета и внешнего DNS. Используйте только выданные файлы, предварительно загруженные
  образы и приватные сервисы. Все изменения — только в этой песочнице.


  Цели первого этапа: Исправленный модуль возвращает нужный output и plan пуст.'
stages.0.brief: 'Исправьте контракт модуля: явный вход station и фактический выход message.


  Результат проверки: Исправленный модуль возвращает нужный output и plan пуст.'
stages.0.objectives.0.text: Исправленный модуль возвращает нужный output и plan пуст.
hints.0.text: Прочитайте ошибки validate на границе дочернего модуля.
hints.1.text: Модуль использует необъявленную station и возвращает отсутствующий ресурс.
hints.2.text: Объявите строковую station, верните local_file.notice.content как message, затем apply и
  повторный plan.
debrief: Дочерний модуль не объявлял вход и ссылался на отсутствующий ресурс в output. Вы исправили контракт,
  проверили значение и пустой plan.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я сравнил ID живого ресурса с state OpenTofu.
