  y se conserva la identidad original del consumer.
diagnostics.module_contract: Ambas fronteras de módulos deben propagar el mensaje derivado del caller
  en un plan válido.
diagnostics.probe_0_1: El mensaje raíz sigue el contrato del caller para cada caso station suministrado;
  su valor actual es `north-ready`.
