title: Contrato de módulo roto
brief: |-
  El módulo compartido de avisos no proporciona el mensaje de estación a su consumidor. Recupera un aviso gestionado utilizable y una salida del módulo raíz.

  Trabaja en `~/quest` en la workstation. Archivos de entrada suministrados: `main.tf`, `modules/notice/main.tf`.

  **Requisitos:**
  - El estado de OpenTofu contiene:
    - El archivo de aviso del módulo suministrado está registrado en el estado de OpenTofu.
  - Salidas del módulo raíz:
    - `message`: `north-ready`
  - OpenTofu informa de que no hay cambios de infraestructura pendientes.

  La comprobación observa los resultados actuales; no establece todo el historial de ejecución.
stages.0.brief: El módulo compartido debe proporcionar el mensaje de estación gestionado requerido.
stages.0.objectives.0.text: El archivo de aviso del módulo suministrado está registrado en el estado de
  OpenTofu.
stages.0.objectives.1.text: El output `message` devuelve `north-ready`.
stages.0.objectives.2.text: OpenTofu informa de que no hay cambios de infraestructura pendientes.
hints.0.text: Un módulo hijo publica un contrato que consume la configuración raíz.
hints.1.text: |-
  Lea los errores validate en el límite del módulo secundario. El módulo hace referencia a station sin declararlo y exporta un recurso faltante.

  Inspecciona la configuración suministrada y las observaciones actuales en la workstation:

  ```sh
  tofu validate
  cat main.tf modules/notice/main.tf
  ```
hints.2.text: |-
  Declare station como una cadena y exporte local_file.notice.content como message, luego apply y vuelva a planificar.

  Verifica el resultado desde `~/quest` en la workstation:

  Ejecuta estos comandos de observación desde `~/quest` en la workstation.
  - `tofu state list` — Se esperan las direcciones de estado indicadas en Requisitos.
  - `tofu output -raw message` — Se espera que el consumidor reciba `north-ready`.
  - `tofu plan -input=false -detailed-exitcode -no-color` — Se esperan ausencia de cambios y código de salida `0`.
debrief: El módulo secundario carecía de su declaración de entrada y hacía referencia a un recurso de
  salida faltante. Reparó el contrato y verificó el valor exportado y el plan vacío.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Comparé el recurso en vivo ID con el estado OpenTofu.
diagnostics.probe_0_0: 'Los datos actuales no permiten verificar este objetivo: El archivo de aviso del módulo suministrado
  está registrado en el estado de OpenTofu.'
