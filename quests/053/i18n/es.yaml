title: Contrato de módulo roto
brief: 'Te uniste a las operaciones de SignalRail. Reparar entradas faltantes y salidas incorrectas en
  un módulo compartido. Trabajar en ~/quest. Mantenga todos los cambios dentro de esta bahía de entrenamiento.


  Entradas en `~/quest`: `main.tf`, `modules/notice/main.tf`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente los archivos suministrados, las imágenes
  precargadas y los servicios privados. Todos los cambios deben permanecer dentro de esta bahía.'
stages.0.brief: Reparar el contrato del módulo. Mantenga station como entrada explícita y message como
  salida real.
stages.0.objectives.0.text: El state contiene `module.notice.local_file.notice`.
stages.0.objectives.1.text: El output `message` devuelve `north-ready`.
stages.0.objectives.2.text: '`tofu plan` termina con código 0 sin cambios.'
hints.0.text: Lea los errores validate en el límite del módulo secundario.
hints.1.text: El módulo hace referencia a station sin declararlo y exporta un recurso faltante.
hints.2.text: Declare station como una cadena y exporte local_file.notice.content como message, luego
  apply y vuelva a planificar.
debrief: El módulo secundario carecía de su declaración de entrada y hacía referencia a un recurso de
  salida faltante. Reparó el contrato y verificó el valor exportado y el plan vacío.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Comparé el recurso en vivo ID con el estado OpenTofu.
