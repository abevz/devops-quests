title: Broken module contract
brief: 'You joined SignalRail operations. Repair missing input and wrong output in a shared module. Work
  in ~/quest. Keep all changes inside this training bay.


  Inputs in `~/quest`: `main.tf`, `modules/notice/main.tf`.


  The bay has no Internet or external DNS. Use only its supplied files, preloaded images and private services.
  All changes must stay inside this bay.


  Initial success criteria: The repaired module has an empty plan and correct output.'
stages.0.brief: 'Repair the module contract. Keep station as an explicit input and message as a real output.


  Success criteria: The repaired module has an empty plan and correct output.'
stages.0.objectives.0.text: The repaired module has an empty plan and correct output.
hints.0.text: Read validate errors at the child-module boundary.
hints.1.text: The module references station without declaring it and exports a missing resource.
hints.2.text: Declare station as a string and export local_file.notice.content as message, then apply
  and re-plan.
debrief: The child module lacked its input declaration and referenced a missing output resource. You repaired
  the contract and verified the exported value and empty plan.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I compared the live resource ID with the OpenTofu state.
