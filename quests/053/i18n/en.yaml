title: Broken module contract
brief: |-
  The shared notice module does not provide the required message to its consumer. Restore a usable managed notice and root output.

  Work in `~/quest` on the workstation. Supplied inputs: `main.tf`, `terraform.tfvars`, `module-contract.json`, `modules/notice/main.tf`, `modules/dispatch/main.tf`.

  **Requirements:**
  - OpenTofu state contains:
    - The notice file of the supplied module is tracked in OpenTofu state.
  - Root outputs:
    - `message`: `north-ready`
  - OpenTofu reports no pending infrastructure changes.

  - Use the supplied `module-contract.json` as the behavior contract. Both modules must preserve the caller-derived message, and the existing consumer identity must not be replaced.

  The check observes current results; it does not establish the full execution history.
stages.0.brief: The shared module must provide the required managed message.
stages.0.objectives.0.text: Both the producer and consumer files remain managed in their respective modules,
  with the original consumer identity preserved.
stages.0.objectives.1.text: The root message follows the caller contract for every supplied station case;
  its current value is `north-ready`.
stages.0.objectives.2.text: OpenTofu reports no pending infrastructure changes.
hints.0.text: Module interfaces connect the caller, producer and consumer; a locally correct output does
  not establish the whole contract.
hints.1.text: |-
  Compare the root calls, both child modules and validation errors. Read existing state before accepting a plan that replaces a consumer.

  ```sh
  cat main.tf terraform.tfvars module-contract.json
  tofu validate
  tofu show -no-color
  ```
hints.2.text: |-
  Construct the missing producer declarations and reconcile the downstream typed input/output contract. Verify the preserved consumer ID, each caller case and the final empty plan.

  - `tofu output -raw message`
  - `tofu plan -input=false -detailed-exitcode -no-color`

  ```sh
  cat module-contract.json
  tofu state list
  cat original-consumer-id
  tofu output -raw message
  tofu plan -input=false -var=station=south -no-color
  tofu plan -input=false -detailed-exitcode -no-color
  ```
debrief: Both the producer and consumer files remain managed in their respective modules, with the original
  consumer identity preserved. The root message follows the caller contract for every supplied station
  case; its current value is `north-ready`.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I compared the live resource ID with the OpenTofu state.
