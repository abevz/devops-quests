title: Broken module contract
brief: |-
  The shared notice module does not provide the required message to its consumer. Restore a usable managed notice and root output.

  Work in `~/quest` on the workstation. Supplied inputs: `main.tf`, `modules/notice/main.tf`.

  **Requirements:**
  - OpenTofu state contains:
    - The notice file of the supplied module is tracked in OpenTofu state.
  - Root outputs:
    - `message`: `north-ready`
  - OpenTofu reports no pending infrastructure changes.

  The check observes current results; it does not establish the full execution history.
stages.0.brief: The shared module must provide the required managed message.
stages.0.objectives.0.text: The notice file of the supplied module is tracked in OpenTofu state.
stages.0.objectives.1.text: Output `message` returns `north-ready`.
stages.0.objectives.2.text: OpenTofu reports no pending infrastructure changes.
hints.0.text: A child module publishes a contract that the root configuration consumes.
hints.1.text: |-
  Read validate errors at the child-module boundary. The module references station without declaring it and exports a missing resource.

  Inspect the supplied configuration and live observations on the workstation:

  ```sh
  tofu validate
  cat main.tf modules/notice/main.tf
  ```
hints.2.text: |-
  Declare station as a string and export local_file.notice.content as message, then apply and re-plan.

  Verify the result from `~/quest` on the workstation:

  Run these observation commands from `~/quest` on the workstation.
  - `tofu state list` — Expected: the state addresses listed in Requirements.
  - `tofu output -raw message` — Expected: the consumer receives `north-ready`.
  - `tofu plan -input=false -detailed-exitcode -no-color` — Expected: no changes, exit code `0`.
debrief: The child module lacked its input declaration and referenced a missing output resource. You repaired
  the contract and verified the exported value and empty plan.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I compared the live resource ID with the OpenTofu state.
diagnostics.probe_0_0: 'The current inputs could not verify this objective: The notice file of the supplied module
  is tracked in OpenTofu state.'
