title: Modulvertrag gebrochen
brief: |-
  Das gemeinsame Meldungsmodul liefert dem Verbraucher keine Stationsmeldung. Stellen Sie eine nutzbare verwaltete Meldung und eine Ausgabe im Wurzelmodul her.

  Arbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte Eingabedateien: `main.tf`, `terraform.tfvars`, `module-contract.json`, `modules/notice/main.tf`, `modules/dispatch/main.tf`.

  **Anforderungen:**
  - Der OpenTofu-State enthält:
    - Die Hinweisdatei des bereitgestellten Moduls wird im OpenTofu-State verwaltet.
  - Ausgaben des Wurzelmoduls:
    - `message`: `north-ready`
  - OpenTofu meldet keine ausstehenden Infrastrukturänderungen.

  - Das Verhalten ist in `module-contract.json` festgelegt. Beide Module müssen die vom Caller abgeleitete Nachricht erhalten; die bestehende Consumer-Identität darf nicht ersetzt werden.

  Die Prüfung beobachtet aktuelle Ergebnisse; sie belegt nicht die vollständige Ausführungshistorie.
stages.0.brief: Das gemeinsame Modul muss die geforderte verwaltete Stationsmeldung bereitstellen.
stages.0.objectives.0.text: Producer- und Consumer-Dateien bleiben in ihren jeweiligen Modulen verwaltet;
  die ursprüngliche Consumer-Identität bleibt erhalten.
stages.0.objectives.1.text: Die Root-Nachricht folgt für jeden vorgegebenen station-Fall dem Caller-Vertrag;
  ihr aktueller Wert ist `north-ready`.
stages.0.objectives.2.text: OpenTofu meldet keine ausstehenden Infrastrukturänderungen.
hints.0.text: Modulschnittstellen verbinden Caller, Producer und Consumer; ein lokal korrekter Output
  beweist nicht den gesamten Vertrag.
hints.1.text: |-
  Vergleiche Root-Aufrufe, beide Kindmodule und Validierungsfehler. Lies den bestehenden State, bevor du einen Plan mit Consumer-Ersetzung akzeptierst.

  ```sh
  cat main.tf terraform.tfvars module-contract.json
  tofu validate
  tofu show -no-color
  ```
hints.2.text: |-
  Erstelle die fehlenden Producer-Deklarationen und gleiche den typisierten Input-/Output-Vertrag des nachgelagerten Moduls ab. Prüfe erhaltene Consumer-ID, jeden Caller-Fall und den abschließenden leeren Plan.

  - `tofu output -raw message`
  - `tofu plan -input=false -detailed-exitcode -no-color`

  ```sh
  cat module-contract.json
  tofu state list
  cat original-consumer-id
  tofu output -raw message
  tofu plan -input=false -var=station=south -no-color
  tofu plan -input=false -detailed-exitcode -no-color
  ```
debrief: Producer- und Consumer-Dateien bleiben in ihren jeweiligen Modulen verwaltet; die ursprüngliche
  Consumer-Identität bleibt erhalten. Die Root-Nachricht folgt für jeden vorgegebenen station-Fall dem
  Caller-Vertrag; ihr aktueller Wert ist `north-ready`.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe die Live-Ressource ID mit dem Status OpenTofu verglichen.
