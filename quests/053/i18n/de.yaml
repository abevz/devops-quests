title: Modulvertrag gebrochen
brief: 'Sie sind dem Betrieb SignalRail beigetreten. Reparieren Sie fehlende Eingaben und falsche Ausgaben
  in einem gemeinsam genutzten Modul. Arbeiten Sie in ~/quest.. Bewahren Sie alle Änderungen in diesem
  Schulungsbereich auf.


  Eingaben in `~/quest`: `main.tf`, `modules/notice/main.tf`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur die bereitgestellten Dateien,
  vorinstallierten Bilder und privaten Dienste. Alle Änderungen müssen innerhalb dieser Bucht bleiben.


  Erste Erfolgskriterien: Das reparierte Modul hat einen leeren plan und eine korrekte Ausgabe.'
stages.0.brief: 'Reparieren Sie den Modulvertrag. Behalten Sie station als explizite Eingabe und message
  als echte Ausgabe bei.


  Erfolgskriterium: Das reparierte Modul hat einen leeren plan und eine korrekte Ausgabe.'
stages.0.objectives.0.text: Das reparierte Modul hat einen leeren plan und einen korrekten Ausgang.
hints.0.text: Lesen Sie validate-Fehler an der Grenze des untergeordneten Moduls.
hints.1.text: Das Modul referenziert station, ohne es zu deklarieren, und exportiert eine fehlende Ressource.
hints.2.text: Deklarieren Sie station als Zeichenfolge und exportieren Sie local_file.notice.content als
  message, dann apply und planen Sie neu.
debrief: Dem untergeordneten Modul fehlte seine Eingabedeklaration und es verwies auf eine fehlende Ausgaberessource.
  Sie haben den Vertrag repariert, den exportierten Wert überprüft und plan geleert.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe die Live-Ressource ID mit dem Status OpenTofu verglichen.
