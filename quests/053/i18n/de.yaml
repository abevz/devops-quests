title: Modulvertrag gebrochen
brief: |-
  Das gemeinsame Meldungsmodul liefert dem Verbraucher keine Stationsmeldung. Stellen Sie eine nutzbare verwaltete Meldung und eine Ausgabe im Wurzelmodul her.

  Arbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte Eingabedateien: `main.tf`, `modules/notice/main.tf`.

  **Anforderungen:**
  - Der OpenTofu-State enthält:
    - Die Hinweisdatei des bereitgestellten Moduls wird im OpenTofu-State verwaltet.
  - Ausgaben des Wurzelmoduls:
    - `message`: `north-ready`
  - OpenTofu meldet keine ausstehenden Infrastrukturänderungen.

  Die Prüfung beobachtet aktuelle Ergebnisse; sie belegt nicht die vollständige Ausführungshistorie.
stages.0.brief: Das gemeinsame Modul muss die geforderte verwaltete Stationsmeldung bereitstellen.
stages.0.objectives.0.text: Die Hinweisdatei des bereitgestellten Moduls wird im OpenTofu-State verwaltet.
stages.0.objectives.1.text: Output `message` liefert `north-ready`.
stages.0.objectives.2.text: OpenTofu meldet keine ausstehenden Infrastrukturänderungen.
hints.0.text: Ein Kindmodul veröffentlicht einen Vertrag, den die Root-Konfiguration nutzt.
hints.1.text: |-
  Lesen Sie validate-Fehler an der Grenze des untergeordneten Moduls. Das Modul referenziert station, ohne es zu deklarieren, und exportiert eine fehlende Ressource.

  Prüfen Sie die bereitgestellte Konfiguration und aktuelle Beobachtungen auf der Workstation:

  ```sh
  tofu validate
  cat main.tf modules/notice/main.tf
  ```
hints.2.text: |-
  Deklarieren Sie station als Zeichenfolge und exportieren Sie local_file.notice.content als message, dann apply und planen Sie neu.

  Prüfen Sie das Ergebnis in `~/quest` auf der Workstation:

  Führen Sie diese Beobachtungsbefehle in `~/quest` auf der Workstation aus.
  - `tofu state list` — Erwartet: die unter Anforderungen genannten State-Adressen.
  - `tofu output -raw message` — Erwartet: Der Verbraucher erhält `north-ready`.
  - `tofu plan -input=false -detailed-exitcode -no-color` — Erwartet: keine Änderungen, Exit-Code `0`.
debrief: Dem untergeordneten Modul fehlte seine Eingabedeklaration und es verwies auf eine fehlende Ausgaberessource.
  Sie haben den Vertrag repariert, den exportierten Wert überprüft und plan geleert.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe die Live-Ressource ID mit dem Status OpenTofu verglichen.
