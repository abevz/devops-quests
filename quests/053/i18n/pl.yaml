title: Zerwana umowa na moduł
brief: |-
  Wspólny moduł komunikatów nie udostępnia odbiorcy komunikatu stacji. Przywróć działający zarządzany komunikat i wynik modułu głównego.

  Pracuj w `~/quest` na workstation. Dostarczone pliki wejściowe: `main.tf`, `terraform.tfvars`, `module-contract.json`, `modules/notice/main.tf`, `modules/dispatch/main.tf`.

  **Wymagania:**
  - Stan OpenTofu zawiera:
    - Plik komunikatu dostarczonego modułu jest zarządzany w stanie OpenTofu.
  - Wyniki modułu głównego:
    - `message`: `north-ready`
  - OpenTofu nie zgłasza oczekujących zmian infrastruktury.

  - Zachowanie opisuje `module-contract.json`. Oba moduły muszą zachować komunikat wynikający z caller, a istniejącej tożsamości consumer nie wolno zastąpić.

  Sprawdzenie obserwuje bieżące wyniki; nie ustala pełnej historii wykonania.
stages.0.brief: Wspólny moduł ma udostępniać wymagany zarządzany komunikat stacji.
stages.0.objectives.0.text: Pliki producer i consumer pozostają zarządzane w odpowiednich modułach, z
  zachowaniem pierwotnej tożsamości consumer.
stages.0.objectives.1.text: Komunikat główny jest zgodny z kontraktem caller dla każdego dostarczonego
  przypadku station; jego bieżąca wartość to `north-ready`.
stages.0.objectives.2.text: OpenTofu nie zgłasza oczekujących zmian infrastruktury.
hints.0.text: Interfejsy modułów łączą caller, producer i consumer; poprawny lokalny output nie dowodzi
  zgodności całego kontraktu.
hints.1.text: |-
  Porównaj wywołania główne, oba moduły potomne i błędy walidacji. Odczytaj istniejący state przed przyjęciem planu zastępującego consumer.

  ```sh
  cat main.tf terraform.tfvars module-contract.json
  tofu validate
  tofu show -no-color
  ```
hints.2.text: |-
  Zbuduj brakujące deklaracje producer i uzgodnij typowany kontrakt input/output modułu dalszego. Sprawdź zachowane ID consumer, każdy przypadek caller i końcowy pusty plan.

  - `tofu output -raw message`
  - `tofu plan -input=false -detailed-exitcode -no-color`

  ```sh
  cat module-contract.json
  tofu state list
  cat original-consumer-id
  tofu output -raw message
  tofu plan -input=false -var=station=south -no-color
  tofu plan -input=false -detailed-exitcode -no-color
  ```
debrief: Pliki producer i consumer pozostają zarządzane w odpowiednich modułach, z zachowaniem pierwotnej
  tożsamości consumer. Komunikat główny jest zgodny z kontraktem caller dla każdego dostarczonego przypadku
  station; jego bieżąca wartość to `north-ready`.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Porównałem aktywny zasób ID ze stanem OpenTofu.
diagnostics.probe_0_0: Pliki producer i consumer pozostają zarządzane w odpowiednich modułach, z zachowaniem
  pierwotnej tożsamości consumer.
diagnostics.module_contract: Obie granice modułów muszą przekazywać komunikat wynikający z caller w poprawnym
  planie.
diagnostics.probe_0_1: Komunikat główny jest zgodny z kontraktem caller dla każdego dostarczonego przypadku
  station; jego bieżąca wartość to `north-ready`.
