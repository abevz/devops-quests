title: Zerwana umowa na moduł
brief: 'Dołączyłeś do operacji SignalRail. Napraw brakujące wejście i błędny output we współdzielonym
  module. Pracuj w ~/quest.. Wszystkie zmiany przechowuj w tej komorze szkoleniowej.


  Wejścia w `~/quest`: `main.tf`, `modules/notice/main.tf`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Wszystkie zmiany muszą pozostać w tej zatoce.


  Wstępne kryteria sukcesu: Naprawiony moduł ma pusty plan i prawidłowy output.'
stages.0.brief: 'Napraw umowę modułu. Zachowaj station jako jawne wejście i message jako prawdziwe output.


  Kryteria sukcesu: Naprawiony moduł ma pusty plan i prawidłowy output.'
stages.0.objectives.0.text: Naprawiony moduł posiada pusty plan i prawidłowy output.
hints.0.text: Odczytaj błędy validate na granicy modułu podrzędnego.
hints.1.text: Moduł odwołuje się do station bez deklarowania tego i eksportuje brakujący zasób.
hints.2.text: Zadeklaruj station jako ciąg znaków i wyeksportuj local_file.notice.content jako message,
  następnie apply i ponownie plan.
debrief: Moduł podrzędny nie miał deklaracji wejściowej i odwoływał się do brakującego zasobu output.
  Naprawiłeś umowę i zweryfikowałeś wyeksportowaną wartość oraz pusty plan.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Porównałem aktywny zasób ID ze stanem OpenTofu.
