title: Zerwana umowa na moduł
brief: |-
  Wspólny moduł komunikatów nie udostępnia odbiorcy komunikatu stacji. Przywróć działający zarządzany komunikat i wynik modułu głównego.

  Pracuj w `~/quest` na workstation. Dostarczone pliki wejściowe: `main.tf`, `modules/notice/main.tf`.

  **Wymagania:**
  - Stan OpenTofu zawiera:
    - Plik komunikatu dostarczonego modułu jest zarządzany w stanie OpenTofu.
  - Wyniki modułu głównego:
    - `message`: `north-ready`
  - OpenTofu nie zgłasza oczekujących zmian infrastruktury.

  Sprawdzenie obserwuje bieżące wyniki; nie ustala pełnej historii wykonania.
stages.0.brief: Wspólny moduł ma udostępniać wymagany zarządzany komunikat stacji.
stages.0.objectives.0.text: Plik komunikatu dostarczonego modułu jest zarządzany w stanie OpenTofu.
stages.0.objectives.1.text: Output `message` zwraca `north-ready`.
stages.0.objectives.2.text: OpenTofu nie zgłasza oczekujących zmian infrastruktury.
hints.0.text: Moduł potomny publikuje kontrakt używany przez konfigurację główną.
hints.1.text: |-
  Odczytaj błędy validate na granicy modułu podrzędnego. Moduł odwołuje się do station bez deklarowania tego i eksportuje brakujący zasób.

  Sprawdź dostarczoną konfigurację i bieżące obserwacje na workstation:

  ```sh
  tofu validate
  cat main.tf modules/notice/main.tf
  ```
hints.2.text: |-
  Zadeklaruj station jako ciąg znaków i wyeksportuj local_file.notice.content jako message, następnie apply i ponownie plan.

  Sprawdź wynik z `~/quest` na workstation:

  Wykonaj te polecenia obserwacyjne w `~/quest` na workstation.
  - `tofu state list` — Oczekiwane są adresy stanu wymienione w wymaganiach.
  - `tofu output -raw message` — Oczekiwane: odbiorca otrzymuje `north-ready`.
  - `tofu plan -input=false -detailed-exitcode -no-color` — Oczekiwane: brak zmian i kod zakończenia `0`.
debrief: Moduł podrzędny nie miał deklaracji wejściowej i odwoływał się do brakującego zasobu output.
  Naprawiłeś umowę i zweryfikowałeś wyeksportowaną wartość oraz pusty plan.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Porównałem aktywny zasób ID ze stanem OpenTofu.
diagnostics.probe_0_0: 'Bieżące dane nie pozwalają potwierdzić tego celu: Plik komunikatu dostarczonego modułu jest
  zarządzany w stanie OpenTofu.'
