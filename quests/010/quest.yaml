    check: "set -euo pipefail\ncd ~/quest\nfailed=0\nfor n in 1 2 3; do\n  host=\"app${n}-${DQ_NAMESPACE#dq-}\"\n  result=$(ssh -n -o BatchMode=yes -o ConnectTimeout=3 -p 2222 \"root@$host\" 'value=$(cat /srv/site/message 2>/dev/null || true); mode=$(stat -c %a /srv/site/message 2>/dev/null || true); if test \"$value\" = release-10; then printf \"content-ok\\n\"; fi; if test \"$mode\" = 644; then printf \"mode-ok\\n\"; fi' 2>/dev/null || true)\n  if ! grep -Fxq content-ok <<<\"$result\"; then printf '%s\\n' \"$host /srv/site/message = release-10: ✗\"; failed=1; fi\n  if ! grep -Fxq mode-ok <<<\"$result\"; then printf '%s\\n' \"$host /srv/site/message mode = 644: ✗\"; failed=1; fi\n  if ! test \"$(curl -fsS --max-time 3 \"http://$host:8080\" 2>/dev/null)\" = release-10; then\n    printf '%s\\n' \"$host:8080 = release-10: ✗\"; failed=1\n  fi\ndone\nexit \"$failed\"\n"
