id: 10
title: title
track: Boss
difficulty: basics
brief: brief
stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    check: |-
      set -euo pipefail
      cd ~/quest
      failed=0
      for n in 1 2 3; do
        host="app${n}-${DQ_NAMESPACE#dq-}"
        result=$(ssh -n -o BatchMode=yes -o ConnectTimeout=3 -p 2222 "root@$host" 'value=$(cat /srv/site/message 2>/dev/null || true); mode=$(stat -c %a /srv/site/message 2>/dev/null || true); if test "$value" = release-10; then printf "content-ok\n"; fi; if test "$mode" = 644; then printf "mode-ok\n"; fi' 2>/dev/null || true)
        if ! grep -Fxq content-ok <<<"$result"; then printf '%s\n' "$host /srv/site/message = release-10: ✗ [DQ:content_$n]"; failed=1; fi
        if ! grep -Fxq mode-ok <<<"$result"; then printf '%s\n' "$host /srv/site/message mode = 644: ✗ [DQ:mode_$n]"; failed=1; fi

      done
      exit "$failed"
  - text: stages.0.objectives.1.text
    check: |-
      set -euo pipefail
      cd ~/quest
      failed=0
      for n in 1 2 3; do
        host="app${n}-${DQ_NAMESPACE#dq-}"
        if ! test "$(curl -fsS --max-time 3 "http://$host:8080" 2>/dev/null)" = release-10; then
          printf '%s\n' "$host:8080 = release-10: ✗ [DQ:http_$n]"; failed=1
        fi
      done
      exit "$failed"
- brief: stages.1.brief
  objectives:
  - text: stages.1.objectives.0.text
    check: |-
      set -euo pipefail
      cd ~/quest
      failed=0
      if ! kubectl rollout status deployment/relay --timeout=3s >/dev/null 2>&1; then
        printf '%s\n' 'deployment/relay rollout complete: ✗ [DQ:rollout]'; failed=1
      fi
      if ! test "$(timeout 4s kubectl exec --pod-running-timeout=2s deployment/relay -c worker -- printenv RELEASE 2>/dev/null)" = release-10; then
        printf '%s\n' 'deployment/relay RELEASE = release-10: ✗ [DQ:release]'; failed=1
      fi
      exit "$failed"
hints:
- text: hints.0.text
  guide: ansible-10
- text: hints.1.text
  guide: ansible-10
- text: hints.2.text
  guide: kubernetes-12
debrief: debrief
phrases:
- phrases.0
- phrases.1
- phrases.2
questions: []
facts:
  environment:
  - DQ_NAMESPACE
  - DQ_APP_IMAGE
  - KUBECONFIG
  - TF_CLI_CONFIG_FILE
  files:
  - inventory.ini
  - ansible.cfg
  - rollout.yml
  - deployment.yaml
  services: []
