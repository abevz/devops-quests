diagnostics.mode_1: |-
  Файл на app1 мог сохранить неверные права, если задача копирования задала другой режим или пропустила этот хост. [Гайд](guides#guide=ansible-10&section=fleet-release-delivery)
diagnostics.mode_2: |-
  Файл на app2 мог сохранить неверные права, если задача копирования задала другой режим или пропустила этот хост. [Гайд](guides#guide=ansible-10&section=fleet-release-delivery)
