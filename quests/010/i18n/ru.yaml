title: Доставка конфигурации
brief: "Передача релиза не завершена на парке хостов и в его потребителе Kubernetes.\n\nРаботайте в `~/quest` на\
  \ рабочей станции. Входные файлы по этапам:\n- Этап 1: `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n- Этап\
  \ 2: `deployment.yaml`.\n\n**Требования:**\n\n- Этап 1:\n  - На каждом управляемом хосте (`app1`, `app2`, `app3`)\
  \ `/srv/site/message` содержит `release-10` и имеет режим `0644`.\n  - С рабочей станции каждый из хостов `app1`,\
  \ `app2` и `app3` возвращает `release-10` по HTTP на порту `8080`.\n- Этап 2:\n  - Deployment `relay` завершает\
  \ развёртывание, а его работающий процесс имеет `RELEASE=release-10`.\n\n**Проверьте себя перед Check & finish:**\n\
  \n- Этап 1: Каждый управляемый хост показывает `release-10`, режим файла `644` и HTTP `release-10` на порту `8080`.\n\
  \n  ```sh\n  for n in 1 2 3; do\n    host=\"app${n}-${DQ_NAMESPACE#dq-}\"\n    printf \"%s: \" \"$host\"\n   \
  \ ssh -n -o BatchMode=yes -p 2222 \"root@$host\" 'cat /srv/site/message; stat -c %a /srv/site/message'\n    curl\
  \ -fsS --max-time 3 \"http://$host:8080\"\n    printf \"\\n\"\n  done\n  ```\n\n- Этап 2: Развёртывание завершено,\
  \ работающий процесс выводит `release-10`.\n\n  ```sh\n  kubectl rollout status deployment/relay --timeout=3s\n\
  \  kubectl exec deployment/relay -- printenv RELEASE\n  ```\n\nПроверка наблюдает текущие файлы, режимы и HTTP\
  \ парка, а также развёртывание и окружение процесса потребителя; HTTP потребителя и исходно использованные команды\
  \ эта проверка не подтверждает."
stages.0.brief: Живой парк хостов должен быть согласован по требуемому релизу.
stages.1.brief: Работающий потребитель должен отражать тот же релиз.
hints.0.text: Сначала сравните живые banner fleet с нужным релизом.
hints.1.text: Доставленному banner нужен reload handler; следующий инцидент — в Kubernetes. При изменении `/srv/site/message`
  уведомляйте handler с `dq-service reload`; запускайте доставку через `ansible-playbook rollout.yml`.
hints.2.text: После fleet проверьте RELEASE у reader и его readiness probe.
debrief: Проверки подтвердили управляемый маркер, файлы и ответы парка, а также rollout и окружение relay.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: После изменения я проверил состояние workload и его готовность.
