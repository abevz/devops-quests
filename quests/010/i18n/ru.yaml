title: Доставка конфигурации
brief: 'Вы в команде эксплуатации SignalRail. Доставьте объявление через две системы. Работайте в ~/quest. Все изменения —
  только в этой песочнице.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `inventory.ini`, `ansible.cfg`, `rollout.yml`, `deployment.json`.


  В песочнице нет интернета и внешнего DNS. Используйте только выданные файлы, предварительно загруженные образы и приватные
  сервисы. Все изменения — только в этой песочнице.


  Цели первого этапа: Три live banner показывают release-10.'
stages.0.brief: Изучите `inventory.ini`, `ansible.cfg` и `rollout.yml` в `~/quest`. Ansible отправляет задачи по SSH каждому
  узлу приватного парка. Запишите `release-10` в `/srv/site/message` с режимом `0644` на app1, app2 и app3. Добавьте обработчик
  с `dq-service reload` и уведомляйте его при изменении файла, чтобы сервис перечитал файл; выполните `ansible-playbook rollout.yml`.
  Проверьте, что HTTP-ответ каждого узла на порту 8080 равен `release-10`. Проверки наблюдают файлы, режимы и ответы, но не
  доказывают, какие команды применялись.
stages.0.objectives.0.text: Файлы, режимы и HTTP-ответы всех трёх узлов соответствуют `release-10`.
stages.1.brief: Исправьте читатель Kubernetes с помощью `deployment.json`. Установите `RELEASE` в `release-10` на `deployment/relay`
  и дождитесь rollout. Проверка читает окружение работающего процесса и состояние rollout, но не проверяет, что отдаёт читатель.
stages.1.objectives.0.text: Rollout relay завершён, а работающий процесс имеет `RELEASE=release-10`.
hints.0.text: Сначала сравните живые banner fleet с нужным релизом.
hints.1.text: Доставленному banner нужен reload handler; следующий инцидент — в Kubernetes.
hints.2.text: После fleet проверьте RELEASE у reader и его readiness probe.
debrief: Проверки подтвердили управляемый маркер, файлы и ответы парка, а также rollout и окружение relay.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: После изменения я проверил состояние workload и его готовность.
