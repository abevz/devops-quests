diagnostics.http_1: |-
  Сервис на app1 может отдавать предыдущий релиз из памяти, если доставка изменила файл без запуска обработчика перечитывания. [Гайд](guides#guide=ansible-10&section=fleet-release-delivery)
diagnostics.http_2: |-
  Сервис на app2 может отдавать предыдущий релиз из памяти, если доставка изменила файл без запуска обработчика перечитывания. [Гайд](guides#guide=ansible-10&section=fleet-release-delivery)
diagnostics.http_3: |-
  Сервис на app3 может отдавать предыдущий релиз из памяти, если доставка изменила файл без запуска обработчика перечитывания. [Гайд](guides#guide=ansible-10&section=fleet-release-delivery)
diagnostics.rollout: |-
  Проба готовности relay сверяет RELEASE с ожидаемым релизом. Старое значение в новом Pod мешает завершить rollout. [Гайд](guides#guide=kubernetes-12&section=relay-release-readiness)
diagnostics.release: |-
  Процесс relay получает RELEASE при старте. Значение может остаться старым, если шаблон Deployment не обновили или новый Pod ещё не запустился. [Гайд](guides#guide=kubernetes-12&section=relay-release-readiness)
