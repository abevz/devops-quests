title: Доставка конфигурации
brief: 'Вы в команде эксплуатации SignalRail. Доставьте объявление через две системы. Работайте в ~/quest.
  Все изменения — только в этой песочнице.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `inventory.ini`, `ansible.cfg`, `rollout.yml`,
  `deployment.json`.


  В песочнице нет интернета и внешнего DNS. Используйте только выданные файлы, предварительно загруженные
  образы и приватные сервисы. Все изменения — только в этой песочнице.


  Цели первого этапа: Три live banner показывают release-10.'
stages.0.brief: 'Пришёл новый инцидент: доставьте release-10 на fleet и обновите banner.


  Результат проверки: Три live banner показывают release-10.'
stages.0.objectives.0.text: Три live banner показывают release-10.
stages.1.brief: 'Релиз доставлен. Новый инцидент reader: исправьте RELEASE.


  Результат проверки: Работающий reader обслуживает нужный release.'
stages.1.objectives.0.text: Работающий reader обслуживает нужный release.
hints.0.text: Сначала сравните живые banner fleet с нужным релизом.
hints.1.text: Доставленному banner нужен reload handler; следующий инцидент — в Kubernetes.
hints.2.text: После fleet проверьте RELEASE у reader и его readiness probe.
debrief: Banner fleet и reader расходились. Вы доставили релиз, обновили процессы хостов и исправили окружение
  reader.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: После изменения я проверил состояние workload и его готовность.
