title: Konfigurationslieferung
brief: 'Sie sind dem Betrieb SignalRail beigetreten. Übermitteln Sie eine station-Benachrichtigung über zwei Systeme. Arbeiten
  Sie in ~/quest.. Bewahren Sie alle Änderungen in diesem Trainingsbereich auf.


  Questdateien in `~/quest` (einige werden in späteren Phasen eingeführt): `inventory.ini`, `ansible.cfg`, `rollout.yml`,
  `deployment.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur die bereitgestellten Dateien, vorinstallierten
  Bilder und privaten Dienste. Alle Änderungen müssen innerhalb dieser Bucht bleiben.


  Erste Erfolgskriterien: Alle drei Live-Flottenbanner zeigen release-10.'
stages.0.brief: Lies `inventory.ini`, `ansible.cfg` und `rollout.yml` in `~/quest`. Ansible sendet Aufgaben über SSH an jeden
  Host der privaten Flotte. Schreibe `release-10` nach `/srv/site/message` mit Modus `0644` auf app1, app2 und app3. Ergänze
  einen Handler mit `dq-service reload` und benachrichtige ihn bei Dateiänderungen, damit der Dienst die Datei neu liest;
  führe `ansible-playbook rollout.yml` aus. Prüfe, dass die HTTP-Antwort jedes Hosts auf Port 8080 `release-10` ist. Die Prüfungen
  beobachten Dateien, Modi und Antworten; sie beweisen nicht die verwendeten Befehle.
stages.0.objectives.0.text: Dateien, Modi und HTTP-Antworten aller drei Flotten-Hosts entsprechen `release-10`.
stages.1.brief: Repariere den Kubernetes-Reader anhand von `deployment.json`. Setze `RELEASE` in `deployment/relay` auf `release-10`
  und warte auf den Rollout. Die Prüfung liest die Umgebung des laufenden Prozesses und den Rollout-Status; sie prüft nicht,
  was der Reader ausliefert.
stages.1.objectives.0.text: Der Relay-Rollout ist abgeschlossen und sein laufender Prozess hat `RELEASE=release-10`.
hints.0.text: Vergleichen Sie zunächst die Live-Banner fleet mit der angeforderten Veröffentlichung.
hints.1.text: Ein kopierter banner benötigt einen reload handler; Der nächste Vorfall ist in Kubernetes.
hints.2.text: Nachdem fleet bestanden wurde, werden inspect, die RELEASE-Variable reader und ihr readiness probe übergeben.
debrief: Die Prüfungen bestätigten den verwalteten Marker, Flottendateien und Antworten sowie Relay-Rollout und Umgebung.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe den workload-Status und seine Bereitschaft nach der Änderung überprüft.
