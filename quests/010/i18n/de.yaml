title: Konfigurationslieferung
brief: 'Sie sind dem Betrieb SignalRail beigetreten. Übermitteln Sie eine station-Benachrichtigung über
  zwei Systeme. Arbeiten Sie in ~/quest.. Bewahren Sie alle Änderungen in diesem Trainingsbereich auf.


  Questdateien in `~/quest` (einige werden in späteren Phasen eingeführt): `inventory.ini`, `ansible.cfg`,
  `rollout.yml`, `deployment.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur die bereitgestellten Dateien,
  vorinstallierten Bilder und privaten Dienste. Alle Änderungen müssen innerhalb dieser Bucht bleiben.


  Erste Erfolgskriterien: Alle drei Live-Flottenbanner zeigen release-10.'
stages.0.brief: 'Die Warnung station wurde ausgelöst. Liefern Sie release-10 an das gesamte fleet und
  laden Sie dessen Live-banner neu.


  Erfolgskriterium: Alle drei Live-fleet-Banner zeigen release-10.'
stages.0.objectives.0.text: Alle drei Live-Flottenbanner zeigen release-10.
stages.1.brief: 'Die Veröffentlichung erreichte den station. Es ist ein reader-Vorfall aufgetreten: Reparieren
  Sie die RELEASE-Umgebung.


  Erfolgskriterium: Der Live-reader dient der beabsichtigten Veröffentlichung.'
stages.1.objectives.0.text: Der Live-reader dient der beabsichtigten Veröffentlichung.
hints.0.text: Vergleichen Sie zunächst die Live-Banner fleet mit der angeforderten Veröffentlichung.
hints.1.text: Ein kopierter banner benötigt einen reload handler; Der nächste Vorfall ist in Kubernetes.
hints.2.text: Nachdem fleet bestanden wurde, werden inspect, die RELEASE-Variable reader und ihr readiness
  probe übergeben.
debrief: Das Banner fleet und reader waren anderer Meinung. Sie haben das Release bereitgestellt, die
  Hosts neu geladen und die reader-Umgebung repariert.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe den workload-Status und seine Bereitschaft nach der Änderung überprüft.
