title: Konfigurationslieferung
brief: "Eine Release-Übergabe ist in der Host-Gruppe und ihrem Kubernetes-Verbraucher noch unvollständig.\n\nArbeiten\
  \ Sie in `~/quest` auf der Workstation. Eingaben je Phase:\n- Phase 1: `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n\
  - Phase 2: `deployment.yaml`.\n\n**Anforderungen:**\n\n- Phase 1:\n  - Auf jedem verwalteten Host (`app1`, `app2`,\
  \ `app3`) enthält `/srv/site/message` den Wert `release-10` und hat Modus `0644`.\n  - Von der Workstation liefern\
  \ `app1`, `app2` und `app3` jeweils `release-10` über HTTP auf Port `8080`.\n- Phase 2:\n  - Deployment `relay`\
  \ schließt seinen Rollout ab und sein laufender Prozess ist für `release-10` konfiguriert.\n\nDie Prüfung beobachtet\
  \ aktuelle Dateien, Modi und HTTP der Host-Gruppe sowie Rollout und Prozessumgebung des Verbrauchers; dessen HTTP-Antwort\
  \ und ursprünglich verwendete Befehle sind nicht Teil dieses Nachweises."
stages.0.brief: Die aktive Host-Gruppe muss beim geforderten Release übereinstimmen.
stages.1.brief: Der laufende Verbraucher muss dasselbe Release widerspiegeln.
hints.0.text: Vergleichen Sie zunächst die Live-Banner fleet mit der angeforderten Veröffentlichung.
hints.1.text: 'Ein kopierter banner benötigt einen reload handler; Der nächste Vorfall ist in Kubernetes. Benachrichtigen
  Sie bei Änderungen an `/srv/site/message` einen Handler mit `dq-service reload`; führen Sie die Auslieferung mit
  `ansible-playbook rollout.yml` aus.


  Prüfen Sie die Auslieferungsdefinition und Workload-Beschreibung.


  ```sh

  cat rollout.yml

  kubectl describe deployment relay

  ```'
hints.2.text: "Nachdem fleet bestanden wurde, werden inspect, die RELEASE-Variable reader und ihr readiness probe\
  \ übergeben.\n\nPrüfen Sie die jeweilige Phase nach der Reparatur.\n\nPhase 1: Jeder verwaltete Host zeigt `release-10`,\
  \ Dateimodus `644` und HTTP `release-10` auf Port `8080`.\n\n```sh\nfor n in 1 2 3; do\n  host=\"app${n}-${DQ_NAMESPACE#dq-}\"\
  \n  printf \"%s: \" \"$host\"\n  ssh -n -o BatchMode=yes -p 2222 \"root@$host\" 'cat /srv/site/message; stat -c\
  \ %a /srv/site/message'\n  curl -fsS --max-time 3 \"http://$host:8080\"\n  printf \"\\n\"\ndone\n```\n\nPhase\
  \ 2: Der Rollout ist abgeschlossen und der laufende Prozess gibt `release-10` aus.\n\n```sh\nkubectl rollout status\
  \ deployment/relay --timeout=3s\nkubectl exec deployment/relay -- printenv RELEASE\n```"
debrief: Die Prüfungen bestätigten den verwalteten Marker, Flottendateien und Antworten sowie Relay-Rollout und
  Umgebung.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe den workload-Status und seine Bereitschaft nach der Änderung überprüft.
