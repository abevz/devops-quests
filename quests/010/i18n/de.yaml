title: Konfigurationslieferung
brief: "Eine Release-Übergabe ist in der Host-Gruppe und ihrem Kubernetes-Verbraucher noch unvollständig.\n\nArbeiten\
  \ Sie in `~/quest` auf der Workstation. Eingaben je Phase:\n- Phase 1: `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n\
  - Phase 2: `deployment.yaml`.\n\n**Anforderungen:**\n\n- Phase 1:\n  - Auf jedem verwalteten Host (`app1`, `app2`,\
  \ `app3`) enthält `/srv/site/message` den Wert `release-10` und hat Modus `0644`.\n  - Von der Workstation liefern\
  \ `app1`, `app2` und `app3` jeweils `release-10` über HTTP auf Port `8080`.\n- Phase 2:\n  - Deployment `relay`\
  \ schließt seinen Rollout ab und sein laufender Prozess ist für `release-10` konfiguriert.\n\nDie Prüfung beobachtet\
  \ aktuelle Dateien, Modi und HTTP der Host-Gruppe sowie Rollout und Prozessumgebung des Verbrauchers; dessen HTTP-Antwort\
  \ und ursprünglich verwendete Befehle sind nicht Teil dieses Nachweises."
stages.0.brief: Die aktive Host-Gruppe muss beim geforderten Release übereinstimmen.
stages.1.brief: Der laufende Verbraucher muss dasselbe Release widerspiegeln.
hints.0.text: |-
  Das Release muss jeden laufenden Verbraucher erreichen.
hints.1.text: |-
  Prüfe in der Auslieferungsphase `rollout.yml` und benachrichtige bei einer Änderung an `/srv/site/message` den Handler, der `dq-service reload` ausführt. Führe `ansible-playbook rollout.yml` aus. Prüfe in der relay-Phase `RELEASE` und die Readiness-Probe des Deployments.

  ```sh
  cat rollout.yml
  ansible-inventory -i inventory.ini --graph
  kubectl describe deployment relay
  ```
hints.2.text: |-
  Prüfe das Ergebnis der aktuellen Phase.

  Phase 1: Jeder verwaltete Host zeigt `release-10`, Dateimodus `644` und HTTP `release-10` auf Port `8080`.

  ```sh
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    printf "%s: " "$host"
    ssh -n -o BatchMode=yes -p 2222 "root@$host" 'cat /srv/site/message; stat -c %a /srv/site/message'
    curl -fsS --max-time 3 "http://$host:8080"
    printf "\n"
  done
  ```

  Phase 2: Der Rollout ist abgeschlossen und der laufende Prozess gibt `release-10` aus.

  ```sh
  kubectl rollout status deployment/relay --timeout=3s
  kubectl exec deployment/relay -c worker -- printenv RELEASE
  ```
debrief: Die Prüfungen bestätigten den verwalteten Marker, Flottendateien und Antworten sowie Relay-Rollout und
  Umgebung.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe den workload-Status und seine Bereitschaft nach der Änderung überprüft.
diagnostics.content_1: |-
  Auf app1 kann noch das alte Release liegen, wenn die Copy-Aufgabe alten Inhalt verwendet oder das aktualisierte Play den Host nicht erreicht hat. [Leitfaden](guides#guide=ansible-10&section=fleet-release-delivery)
diagnostics.content_2: |-
  Auf app2 kann noch das alte Release liegen, wenn die Copy-Aufgabe alten Inhalt verwendet oder das aktualisierte Play den Host nicht erreicht hat. [Leitfaden](guides#guide=ansible-10&section=fleet-release-delivery)
diagnostics.content_3: |-
  Auf app3 kann noch das alte Release liegen, wenn die Copy-Aufgabe alten Inhalt verwendet oder das aktualisierte Play den Host nicht erreicht hat. [Leitfaden](guides#guide=ansible-10&section=fleet-release-delivery)
diagnostics.mode_1: |-
  Die Datei auf app1 kann den falschen Modus behalten, wenn die Copy-Aufgabe andere Zugriffsrechte gesetzt oder den Host übersprungen hat. [Leitfaden](guides#guide=ansible-10&section=fleet-release-delivery)
diagnostics.mode_2: |-
  Die Datei auf app2 kann den falschen Modus behalten, wenn die Copy-Aufgabe andere Zugriffsrechte gesetzt oder den Host übersprungen hat. [Leitfaden](guides#guide=ansible-10&section=fleet-release-delivery)
diagnostics.mode_3: |-
  Die Datei auf app3 kann den falschen Modus behalten, wenn die Copy-Aufgabe andere Zugriffsrechte gesetzt oder den Host übersprungen hat. [Leitfaden](guides#guide=ansible-10&section=fleet-release-delivery)
diagnostics.http_1: |-
  Der Dienst auf app1 kann weiterhin das gespeicherte Release ausliefern, wenn die Zustellung die Datei ohne Ausführen des Reload-Handlers geändert hat. [Leitfaden](guides#guide=ansible-10&section=fleet-release-delivery)
diagnostics.http_2: |-
  Der Dienst auf app2 kann weiterhin das gespeicherte Release ausliefern, wenn die Zustellung die Datei ohne Ausführen des Reload-Handlers geändert hat. [Leitfaden](guides#guide=ansible-10&section=fleet-release-delivery)
diagnostics.http_3: |-
  Der Dienst auf app3 kann weiterhin das gespeicherte Release ausliefern, wenn die Zustellung die Datei ohne Ausführen des Reload-Handlers geändert hat. [Leitfaden](guides#guide=ansible-10&section=fleet-release-delivery)
diagnostics.rollout: |-
  Die Readiness-Probe von relay vergleicht RELEASE mit dem erwarteten Release. Ein alter Wert im neuen Pod verhindert den Abschluss des Rollouts. [Leitfaden](guides#guide=kubernetes-12&section=relay-release-readiness)
diagnostics.release: |-
  Der Prozess von relay erhält RELEASE beim Start. Der Wert kann veraltet bleiben, wenn das Deployment-Template unverändert ist oder noch kein neuer Pod gestartet wurde. [Leitfaden](guides#guide=kubernetes-12&section=relay-release-readiness)
