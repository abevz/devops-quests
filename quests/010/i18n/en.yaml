  with mode `0644`.
stages.0.objectives.1.text: From the workstation, `app1`, `app2` and `app3` each return `release-10` over HTTP on
  port `8080`.
stages.1.objectives.0.text: Deployment `relay` completes its rollout and its running process is configured for `release-10`.
