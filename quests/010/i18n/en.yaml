diagnostics.mode_1: Host app1 /srv/site/message mode must be 644.
diagnostics.mode_2: Host app2 /srv/site/message mode must be 644.
diagnostics.mode_3: Host app3 /srv/site/message mode must be 644.
diagnostics.http_1: Host app1 on port 8080 must return release-10.
diagnostics.http_2: Host app2 on port 8080 must return release-10.
diagnostics.http_3: Host app3 on port 8080 must return release-10.
