title: Configuration delivery
brief: 'You joined SignalRail operations. Deliver a station notice through two systems. Work in ~/quest.
  Keep all changes inside this training bay.


  Quest files in `~/quest` (some are introduced in later stages): `inventory.ini`, `ansible.cfg`, `rollout.yml`,
  `deployment.json`.


  The bay has no Internet or external DNS. Use only its supplied files, preloaded images and private services.
  All changes must stay inside this bay.


  Initial success criteria: All three live fleet banners show release-10.'
stages.0.brief: 'The station alert fired. Deliver release-10 to the whole fleet and reload its live banner.


  Success criteria: All three live fleet banners show release-10.'
stages.0.objectives.0.text: All three live fleet banners show release-10.
stages.1.brief: 'The release reached the station. A reader incident appeared: repair its RELEASE environment.


  Success criteria: The live reader serves the intended release.'
stages.1.objectives.0.text: The live reader serves the intended release.
hints.0.text: First compare the live fleet banners with the requested release.
hints.1.text: A copied banner needs a reload handler; the next incident is in Kubernetes.
hints.2.text: After the fleet passes, inspect the reader RELEASE variable and its readiness probe.
debrief: The fleet banner and reader disagreed. You delivered the release, reloaded the hosts and repaired
  the reader environment.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked the workload state and its readiness after the change.
