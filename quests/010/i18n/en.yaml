title: Configuration delivery
brief: "A release handover is incomplete across the fleet and its Kubernetes consumer.\n\nWork in `~/quest` on the\
  \ workstation. Inputs by stage:\n- Stage 1: `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n- Stage 2: `deployment.yaml`.\n\
  \n**Requirements:**\n\n- Stage 1:\n  - On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` contains\
  \ `release-10` with mode `0644`.\n  - From the workstation, `app1`, `app2` and `app3` each return `release-10`\
  \ over HTTP on port `8080`.\n- Stage 2:\n  - Deployment `relay` completes its rollout and its running process\
  \ has `RELEASE=release-10`.\n\n**Verify yourself before Check & finish:**\n\n- Stage 1: Each managed host shows\
  \ `release-10`, file mode `644`, and HTTP `release-10` on port `8080`.\n\n  ```sh\n  for n in 1 2 3; do\n    host=\"\
  app${n}-${DQ_NAMESPACE#dq-}\"\n    printf \"%s: \" \"$host\"\n    ssh -n -o BatchMode=yes -p 2222 \"root@$host\"\
  \ 'cat /srv/site/message; stat -c %a /srv/site/message'\n    curl -fsS --max-time 3 \"http://$host:8080\"\n  \
  \  printf \"\\n\"\n  done\n  ```\n\n- Stage 2: The rollout is complete and the running process prints `release-10`.\n\
  \n  ```sh\n  kubectl rollout status deployment/relay --timeout=3s\n  kubectl exec deployment/relay -- printenv\
  \ RELEASE\n  ```\n\nThe check observes current fleet files, modes and HTTP plus the consumer rollout and process\
  \ environment; the consumer HTTP response and the commands originally used are outside this proof."
stages.0.brief: The live fleet must agree on the required release.
stages.1.brief: The running consumer must reflect the same release.
hints.0.text: First compare the live fleet banners with the requested release.
hints.1.text: A copied banner needs a reload handler; the next incident is in Kubernetes. Notify a handler that
  runs `dq-service reload` when `/srv/site/message` changes; run the delivery with `ansible-playbook rollout.yml`.
hints.2.text: After the fleet passes, inspect the reader RELEASE variable and its readiness probe.
debrief: The checks verified the managed marker, the fleet files and responses, and the relay rollout and environment.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked the workload state and its readiness after the change.
