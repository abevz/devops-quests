title: Configuration delivery
brief: "A release handover is incomplete across the fleet and its Kubernetes consumer.\n\nWork in `~/quest` on the\
  \ workstation. Inputs by stage:\n- Stage 1: `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n- Stage 2: `deployment.yaml`.\n\
  \n**Requirements:**\n\n- Stage 1:\n  - On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` contains\
  \ `release-10` with mode `0644`.\n  - From the workstation, `app1`, `app2` and `app3` each return `release-10`\
  \ over HTTP on port `8080`.\n- Stage 2:\n  - Deployment `relay` completes its rollout and its running process\
  \ is configured for `release-10`.\n\nThe check observes current fleet files, modes and HTTP plus the consumer\
  \ rollout and process environment; the consumer HTTP response and the commands originally used are outside this\
  \ proof."
stages.0.brief: The live fleet must agree on the required release.
stages.1.brief: The running consumer must reflect the same release.
hints.0.text: |-
  A release needs to reach each live consumer.
hints.1.text: |-
  In the fleet stage, inspect `rollout.yml` and notify a handler running `dq-service reload` when `/srv/site/message` changes. Run `ansible-playbook rollout.yml`. In the relay stage, inspect the Deployment’s `RELEASE` and readiness probe.

  ```sh
  cat rollout.yml
  ansible-inventory -i inventory.ini --graph
  kubectl describe deployment relay
  ```
hints.2.text: |-
  Verify the result for the current stage.

  Stage 1: Each managed host shows `release-10`, file mode `644`, and HTTP `release-10` on port `8080`.

  ```sh
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    printf "%s: " "$host"
    ssh -n -o BatchMode=yes -p 2222 "root@$host" 'cat /srv/site/message; stat -c %a /srv/site/message'
    curl -fsS --max-time 3 "http://$host:8080"
    printf "\n"
  done
  ```

  Stage 2: The rollout is complete and the running process prints `release-10`.

  ```sh
  kubectl rollout status deployment/relay --timeout=3s
  kubectl exec deployment/relay -c worker -- printenv RELEASE
  ```
debrief: The checks verified the managed marker, the fleet files and responses, and the relay rollout and environment.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked the workload state and its readiness after the change.
diagnostics.content_1: |-
  app1 may still have the old release if the copy task used old content or the updated play did not reach this host. [Guide](guides#guide=ansible-10&section=fleet-release-delivery)
diagnostics.content_2: |-
  app2 may still have the old release if the copy task used old content or the updated play did not reach this host. [Guide](guides#guide=ansible-10&section=fleet-release-delivery)
diagnostics.content_3: |-
  app3 may still have the old release if the copy task used old content or the updated play did not reach this host. [Guide](guides#guide=ansible-10&section=fleet-release-delivery)
diagnostics.mode_1: |-
  The file on app1 can keep the wrong mode if the copy task used different permissions or skipped this host. [Guide](guides#guide=ansible-10&section=fleet-release-delivery)
diagnostics.mode_2: |-
  The file on app2 can keep the wrong mode if the copy task used different permissions or skipped this host. [Guide](guides#guide=ansible-10&section=fleet-release-delivery)
diagnostics.mode_3: |-
  The file on app3 can keep the wrong mode if the copy task used different permissions or skipped this host. [Guide](guides#guide=ansible-10&section=fleet-release-delivery)
diagnostics.http_1: |-
  The service on app1 may still serve a cached release if the delivery changed the file without running the reload handler. [Guide](guides#guide=ansible-10&section=fleet-release-delivery)
diagnostics.http_2: |-
  The service on app2 may still serve a cached release if the delivery changed the file without running the reload handler. [Guide](guides#guide=ansible-10&section=fleet-release-delivery)
diagnostics.http_3: |-
  The service on app3 may still serve a cached release if the delivery changed the file without running the reload handler. [Guide](guides#guide=ansible-10&section=fleet-release-delivery)
diagnostics.rollout: |-
  The relay readiness probe compares RELEASE to the expected release. An older value in the new Pod prevents the rollout from completing. [Guide](guides#guide=kubernetes-12&section=relay-release-readiness)
diagnostics.release: |-
  The relay process receives RELEASE at startup. The live value can be stale if the Deployment template was not updated or a replacement Pod has not started. [Guide](guides#guide=kubernetes-12&section=relay-release-readiness)
