title: Configuration delivery
brief: 'You joined SignalRail operations. Deliver a station notice through two systems. Work in ~/quest. Keep all changes
  inside this training bay.


  Quest files in `~/quest` (some are introduced in later stages): `inventory.ini`, `ansible.cfg`, `rollout.yml`, `deployment.json`.


  The bay has no Internet or external DNS. Use only its supplied files, preloaded images and private services. All changes
  must stay inside this bay.


  Initial success criteria: All three live fleet banners show release-10.'
stages.0.brief: Read `inventory.ini`, `ansible.cfg` and `rollout.yml` in `~/quest`. Ansible sends tasks over SSH to each private
  fleet host. Deliver `release-10` to `/srv/site/message` with mode `0644` on app1, app2 and app3. Add a handler with `dq-service
  reload` and notify it when the file changes so the service rereads the file; run `ansible-playbook rollout.yml`. Verify
  each host's HTTP response on port 8080 is `release-10`. The checks inspect the files, modes and responses; they do not prove
  which commands were used.
stages.0.objectives.0.text: All three fleet files, modes and HTTP responses match `release-10`.
stages.1.brief: Repair the Kubernetes consumer using `deployment.json`. Set `RELEASE` to `release-10` on `deployment/relay`
  and wait for its rollout. The check reads the running process environment and rollout status; it does not test what the
  consumer serves.
stages.1.objectives.0.text: The relay rollout completes and its running process has `RELEASE=release-10`.
hints.0.text: First compare the live fleet banners with the requested release.
hints.1.text: A copied banner needs a reload handler; the next incident is in Kubernetes.
hints.2.text: After the fleet passes, inspect the reader RELEASE variable and its readiness probe.
debrief: The checks verified the managed marker, the fleet files and responses, and the relay rollout and environment.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked the workload state and its readiness after the change.
