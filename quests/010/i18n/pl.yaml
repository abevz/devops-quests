title: Dostawa konfiguracji
brief: "Przekazanie wydania jest niekompletne we flocie i jej konsumencie Kubernetes.\n\nPracuj w `~/quest` na stacji\
  \ roboczej. Dane wejściowe według etapu:\n- Etap 1: `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n- Etap 2:\
  \ `deployment.yaml`.\n\n**Wymagania:**\n\n- Etap 1:\n  - Na każdym zarządzanym hoście (`app1`, `app2`, `app3`)\
  \ `/srv/site/message` zawiera `release-10` i ma tryb `0644`.\n  - Ze stacji roboczej każdy z hostów `app1`, `app2`\
  \ i `app3` zwraca `release-10` przez HTTP na porcie `8080`.\n- Etap 2:\n  - Deployment `relay` kończy rollout,\
  \ a jego działający proces jest skonfigurowany dla `release-10`.\n\nKontrola obserwuje bieżące pliki, tryby i\
  \ HTTP floty oraz rollout i środowisko procesu konsumenta; jego odpowiedź HTTP i pierwotnie użyte polecenia są\
  \ poza tym dowodem."
stages.0.brief: Aktywna flota musi być zgodna co do wymaganego wydania.
stages.1.brief: Działający konsument musi odzwierciedlać to samo wydanie.
hints.0.text: Najpierw porównaj banery aktywnej floty z żądaną wersją.
hints.1.text: 'Skopiowany banner wymaga reload handler; następny incydent ma miejsce w Kubernetes. Powiadom handler
  z `dq-service reload`, gdy zmieni się `/srv/site/message`; uruchom dostarczenie przez `ansible-playbook rollout.yml`.


  Sprawdź definicję dostarczania i opis obciążenia.


  ```sh

  cat rollout.yml

  kubectl describe deployment relay

  ```'
hints.2.text: |-
  Po przejściu fleet sprawdź zmienną reader RELEASE i jej readiness probe.

  Sprawdź odpowiedni etap po naprawie.

  Etap 1: Każdy zarządzany host pokazuje `release-10`, tryb pliku `644` oraz HTTP `release-10` na porcie `8080`.

  ```sh
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    printf "%s: " "$host"
    ssh -n -o BatchMode=yes -p 2222 "root@$host" 'cat /srv/site/message; stat -c %a /srv/site/message'
    curl -fsS --max-time 3 "http://$host:8080"
    printf "\n"
  done
  ```

  Etap 2: Rollout jest zakończony, a działający proces wypisuje `release-10`.

  ```sh
  kubectl rollout status deployment/relay --timeout=3s
  kubectl exec deployment/relay -c worker -- printenv RELEASE
  ```

debrief: Kontrole sprawdziły zarządzany znacznik, pliki i odpowiedzi floty oraz rollout i środowisko relay.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
