diagnostics.mode_1: |-
  Plik na app1 może nadal mieć niewłaściwy tryb, jeśli zadanie kopiowania ustawiło inne uprawnienia lub pominęło ten host. [Przewodnik](guides#guide=ansible-10&section=fleet-release-delivery)
diagnostics.mode_2: |-
  Plik na app2 może nadal mieć niewłaściwy tryb, jeśli zadanie kopiowania ustawiło inne uprawnienia lub pominęło ten host. [Przewodnik](guides#guide=ansible-10&section=fleet-release-delivery)
diagnostics.mode_3: |-
  Plik na app3 może nadal mieć niewłaściwy tryb, jeśli zadanie kopiowania ustawiło inne uprawnienia lub pominęło ten host. [Przewodnik](guides#guide=ansible-10&section=fleet-release-delivery)
diagnostics.http_1: |-
  Usługa na app1 może nadal podawać wydanie z pamięci, jeśli dostawa zmieniła plik bez uruchomienia procedury przeładowania. [Przewodnik](guides#guide=ansible-10&section=fleet-release-delivery)
diagnostics.http_2: |-
  Usługa na app2 może nadal podawać wydanie z pamięci, jeśli dostawa zmieniła plik bez uruchomienia procedury przeładowania. [Przewodnik](guides#guide=ansible-10&section=fleet-release-delivery)
diagnostics.http_3: |-
  Usługa na app3 może nadal podawać wydanie z pamięci, jeśli dostawa zmieniła plik bez uruchomienia procedury przeładowania. [Przewodnik](guides#guide=ansible-10&section=fleet-release-delivery)
diagnostics.rollout: |-
  Sonda gotowości relay porównuje RELEASE z oczekiwanym wydaniem. Stara wartość w nowym Podzie uniemożliwia zakończenie rolloutu. [Przewodnik](guides#guide=kubernetes-12&section=relay-release-readiness)
diagnostics.release: |-
  Proces relay pobiera RELEASE przy starcie. Wartość może być nieaktualna, jeśli szablon Deploymentu nie został zmieniony lub nowy Pod jeszcze nie wystartował. [Przewodnik](guides#guide=kubernetes-12&section=relay-release-readiness)
