title: Dostawa konfiguracji
brief: 'Dołączyłeś do operacji SignalRail. Dostarcz zawiadomienie o station za pośrednictwem dwóch systemów. Pracuj w ~/quest.
  Wszystkie zmiany przechowuj w tej komorze szkoleniowej.


  Pliki zadań w `~/quest` (niektóre zostały wprowadzone w późniejszych etapach): `inventory.ini`, `ansible.cfg`, `rollout.yml`,
  `deployment.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie załadowanych obrazów
  i usług prywatnych. Wszystkie zmiany muszą pozostać w tej zatoce.


  Początkowe kryteria sukcesu: wszystkie trzy banery floty na żywo przedstawiają release-10.'
stages.0.brief: 'Przeczytaj `inventory.ini`, `ansible.cfg` i `rollout.yml` w `~/quest`. Ansible wysyła zadania przez SSH do
  każdego hosta prywatnej floty. Dostarcz `release-10` do `/srv/site/message` z trybem `0644` na app1, app2 i app3. Dodaj
  handler z `dq-service reload` i powiadamiaj go przy zmianie pliku, aby usługa ponownie odczytała plik; uruchom `ansible-playbook
  rollout.yml`. Sprawdź odpowiedź HTTP każdego hosta na porcie 8080: ma wynosić `release-10`. Kontrole sprawdzają pliki, tryby
  i odpowiedzi; nie dowodzą użytych poleceń.'
stages.0.objectives.0.text: Pliki, tryby i odpowiedzi HTTP wszystkich trzech hostów floty odpowiadają `release-10`.
stages.1.brief: Napraw czytnik Kubernetes, korzystając z `deployment.json`. Ustaw `RELEASE` na `release-10` w `deployment/relay`
  i poczekaj na rollout. Kontrola odczytuje środowisko działającego procesu i stan rolloutu; nie sprawdza treści serwowanej
  przez czytnik.
stages.1.objectives.0.text: Rollout relay kończy się, a jego działający proces ma `RELEASE=release-10`.
hints.0.text: Najpierw porównaj banery aktywnej floty z żądaną wersją.
hints.1.text: Skopiowany banner wymaga reload handler; następny incydent ma miejsce w Kubernetes.
hints.2.text: Po przejściu fleet sprawdź zmienną reader RELEASE i jej readiness probe.
debrief: Kontrole sprawdziły zarządzany znacznik, pliki i odpowiedzi floty oraz rollout i środowisko relay.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
