title: Dostawa konfiguracji
brief: 'Dołączyłeś do operacji SignalRail. Dostarcz zawiadomienie o station za pośrednictwem dwóch systemów.
  Pracuj w ~/quest. Wszystkie zmiany przechowuj w tej komorze szkoleniowej.


  Pliki zadań w `~/quest` (niektóre zostały wprowadzone w późniejszych etapach): `inventory.ini`, `ansible.cfg`,
  `rollout.yml`, `deployment.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Wszystkie zmiany muszą pozostać w tej zatoce.


  Początkowe kryteria sukcesu: wszystkie trzy banery floty na żywo przedstawiają release-10.'
stages.0.brief: 'Uruchomiono alarm na station. Dostarcz release-10 do całego fleet i przeładuj jego live
  banner.


  Kryteria sukcesu: wszystkie trzy aktywne banery fleet przedstawiają release-10.'
stages.0.objectives.0.text: Wszystkie trzy banery floty na żywo przedstawiają release-10.
stages.1.brief: 'release dotarł do station. Pojawił się incydent reader: napraw środowisko RELEASE.


  Kryteria sukcesu: Aktywny reader obsługuje zamierzony release.'
stages.1.objectives.0.text: Aktywny reader obsługuje zamierzony release.
hints.0.text: Najpierw porównaj banery aktywnej floty z żądaną wersją.
hints.1.text: Skopiowany banner wymaga reload handler; następny incydent ma miejsce w Kubernetes.
hints.2.text: Po przejściu fleet sprawdź zmienną reader RELEASE i jej readiness probe.
debrief: Baner floty i reader nie zgodziły się z tym. Dostarczyłeś wydanie, przeładowałeś hosty i naprawiłeś
  środowisko reader.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
