title: Entrega de configuración
brief: "La entrega de una versión está incompleta en la flota y su consumidor Kubernetes.\n\nTrabaja en `~/quest`\
  \ en la estación de trabajo. Entradas por etapa:\n- Etapa 1: `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n\
  - Etapa 2: `deployment.yaml`.\n\n**Requisitos:**\n\n- Etapa 1:\n  - En cada host gestionado (`app1`, `app2`, `app3`),\
  \ `/srv/site/message` contiene `release-10` con modo `0644`.\n  - Desde la estación de trabajo, `app1`, `app2`\
  \ y `app3` devuelven cada uno `release-10` por HTTP en el puerto `8080`.\n- Etapa 2:\n  - El Deployment `relay`\
  \ completa su rollout y su proceso en ejecución está configurado para `release-10`.\n\nLa comprobación observa\
  \ archivos, modos y HTTP actuales de la flota, además del rollout y entorno del consumidor; su respuesta HTTP\
  \ y los comandos usados originalmente quedan fuera de esta prueba."
stages.0.brief: La flota activa debe coincidir en la versión requerida.
stages.1.brief: El consumidor en ejecución debe reflejar la misma versión.
hints.0.text: Primero compare los banners en vivo fleet con la versión solicitada.
hints.1.text: 'Un banner copiado necesita un reload handler; el siguiente incidente está en Kubernetes. Notifica
  un handler con `dq-service reload` cuando cambie `/srv/site/message`; ejecuta la entrega con `ansible-playbook
  rollout.yml`.


  Inspecciona la definición de entrega y la descripción de la carga.


  ```sh

  cat rollout.yml

  kubectl describe deployment relay

  ```'
hints.2.text: |-
  Luego de pasar el fleet, inspect la variable reader RELEASE y su readiness probe.

  Verifica la etapa correspondiente tras repararla.

  Etapa 1: Cada host gestionado muestra `release-10`, modo de archivo `644` y HTTP `release-10` en el puerto `8080`.

  ```sh
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    printf "%s: " "$host"
    ssh -n -o BatchMode=yes -p 2222 "root@$host" 'cat /srv/site/message; stat -c %a /srv/site/message'
    curl -fsS --max-time 3 "http://$host:8080"
    printf "\n"
  done
  ```

  Etapa 2: El rollout está completo y el proceso en ejecución imprime `release-10`.

  ```sh
  kubectl rollout status deployment/relay --timeout=3s
  kubectl exec deployment/relay -c worker -- printenv RELEASE
  ```

debrief: Las comprobaciones verificaron el marcador gestionado, archivos y respuestas de la flota, y el rollout
  y entorno de relay.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el estado de workload y su preparación después del cambio.
diagnostics.content_1: |-
  app1 puede conservar la versión anterior si la copia usó contenido antiguo o si el play actualizado no llegó a ese host. [Guía](guides#guide=ansible-10&section=fleet-release-delivery)
diagnostics.content_2: |-
  app2 puede conservar la versión anterior si la copia usó contenido antiguo o si el play actualizado no llegó a ese host. [Guía](guides#guide=ansible-10&section=fleet-release-delivery)
diagnostics.content_3: |-
  app3 puede conservar la versión anterior si la copia usó contenido antiguo o si el play actualizado no llegó a ese host. [Guía](guides#guide=ansible-10&section=fleet-release-delivery)
diagnostics.mode_1: |-
  El archivo de app1 puede conservar un modo incorrecto si la copia aplicó otros permisos u omitió ese host. [Guía](guides#guide=ansible-10&section=fleet-release-delivery)
diagnostics.mode_2: |-
  El archivo de app2 puede conservar un modo incorrecto si la copia aplicó otros permisos u omitió ese host. [Guía](guides#guide=ansible-10&section=fleet-release-delivery)
diagnostics.mode_3: |-
  El archivo de app3 puede conservar un modo incorrecto si la copia aplicó otros permisos u omitió ese host. [Guía](guides#guide=ansible-10&section=fleet-release-delivery)
diagnostics.http_1: |-
  El servicio de app1 puede seguir sirviendo la versión guardada si la entrega cambió el archivo sin ejecutar el controlador de recarga. [Guía](guides#guide=ansible-10&section=fleet-release-delivery)
diagnostics.http_2: |-
  El servicio de app2 puede seguir sirviendo la versión guardada si la entrega cambió el archivo sin ejecutar el controlador de recarga. [Guía](guides#guide=ansible-10&section=fleet-release-delivery)
diagnostics.http_3: |-
  El servicio de app3 puede seguir sirviendo la versión guardada si la entrega cambió el archivo sin ejecutar el controlador de recarga. [Guía](guides#guide=ansible-10&section=fleet-release-delivery)
diagnostics.rollout: |-
  La sonda de disponibilidad de relay compara RELEASE con la versión esperada. Un valor anterior en el Pod nuevo impide que termine el despliegue. [Guía](guides#guide=kubernetes-12&section=relay-release-readiness)
diagnostics.release: |-
  El proceso de relay recibe RELEASE al arrancar. El valor puede seguir obsoleto si no se actualizó la plantilla del Deployment o aún no arrancó un Pod nuevo. [Guía](guides#guide=kubernetes-12&section=relay-release-readiness)
stages.0.objectives.0.text: En cada host gestionado (`app1`, `app2`, `app3`), `/srv/site/message` contiene `release-10`
  con modo `0644`.
stages.0.objectives.1.text: Desde la estación de trabajo, `app1`, `app2` y `app3` devuelven cada uno `release-10`
  por HTTP en el puerto `8080`.
stages.1.objectives.0.text: El Deployment `relay` completa su rollout y su proceso en ejecución está configurado
  para `release-10`.
