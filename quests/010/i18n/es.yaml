title: Entrega de configuración
brief: 'Te uniste a las operaciones de SignalRail. Entregar un aviso station a través de dos sistemas. Trabajar en ~/quest.
  Mantenga todos los cambios dentro de esta bahía de entrenamiento.


  Archivos de búsqueda en `~/quest` (algunos se introducen en etapas posteriores): `inventory.ini`, `ansible.cfg`, `rollout.yml`,
  `deployment.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente los archivos suministrados, las imágenes precargadas y los
  servicios privados. Todos los cambios deben permanecer dentro de esta bahía.


  Criterios de éxito iniciales: los tres carteles de flotas en vivo muestran release-10.'
stages.0.brief: Lee `inventory.ini`, `ansible.cfg` y `rollout.yml` en `~/quest`. Ansible envía tareas por SSH a cada host
  de la flota privada. Entrega `release-10` en `/srv/site/message` con modo `0644` en app1, app2 y app3. Añade un handler
  con `dq-service reload` y notifícalo cuando cambie el archivo para que el servicio relea el archivo; ejecuta `ansible-playbook
  rollout.yml`. Comprueba que la respuesta HTTP de cada host en el puerto 8080 sea `release-10`. Las comprobaciones observan
  archivos, modos y respuestas; no demuestran qué comandos se usaron.
stages.0.objectives.0.text: Los archivos, modos y respuestas HTTP de los tres hosts coinciden con `release-10`.
stages.1.brief: Repara el lector de Kubernetes con `deployment.json`. Establece `RELEASE` en `release-10` en `deployment/relay`
  y espera su rollout. La comprobación lee el entorno del proceso en ejecución y el estado del rollout; no comprueba lo que
  sirve el lector.
stages.1.objectives.0.text: El rollout de relay termina y su proceso en ejecución tiene `RELEASE=release-10`.
hints.0.text: Primero compare los banners en vivo fleet con la versión solicitada.
hints.1.text: Un banner copiado necesita un reload handler; el siguiente incidente está en Kubernetes.
hints.2.text: Luego de pasar el fleet, inspect la variable reader RELEASE y su readiness probe.
debrief: Las comprobaciones verificaron el marcador gestionado, archivos y respuestas de la flota, y el rollout y entorno
  de relay.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el estado de workload y su preparación después del cambio.
