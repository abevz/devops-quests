title: Entrega de configuración
brief: "La entrega de una versión está incompleta en la flota y su consumidor Kubernetes.\n\nTrabaja en `~/quest`\
  \ en la estación de trabajo. Entradas por etapa:\n- Etapa 1: `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n\
  - Etapa 2: `deployment.yaml`.\n\n**Requisitos:**\n\n- Etapa 1:\n  - En cada host gestionado (`app1`, `app2`, `app3`),\
  \ `/srv/site/message` contiene `release-10` con modo `0644`.\n  - Desde la estación de trabajo, `app1`, `app2`\
  \ y `app3` devuelven cada uno `release-10` por HTTP en el puerto `8080`.\n- Etapa 2:\n  - El Deployment `relay`\
  \ completa su rollout y su proceso en ejecución está configurado para `release-10`.\n\nLa comprobación observa\
  \ archivos, modos y HTTP actuales de la flota, además del rollout y entorno del consumidor; su respuesta HTTP\
  \ y los comandos usados originalmente quedan fuera de esta prueba."
stages.0.brief: La flota activa debe coincidir en la versión requerida.
stages.1.brief: El consumidor en ejecución debe reflejar la misma versión.
hints.0.text: Primero compare los banners en vivo fleet con la versión solicitada.
hints.1.text: 'Un banner copiado necesita un reload handler; el siguiente incidente está en Kubernetes. Notifica
  un handler con `dq-service reload` cuando cambie `/srv/site/message`; ejecuta la entrega con `ansible-playbook
  rollout.yml`.


  Inspecciona la definición de entrega y la descripción de la carga.


  ```sh

  cat rollout.yml

  kubectl describe deployment relay

  ```'
hints.2.text: |-
  Luego de pasar el fleet, inspect la variable reader RELEASE y su readiness probe.

  Verifica la etapa correspondiente tras repararla.

  Etapa 1: Cada host gestionado muestra `release-10`, modo de archivo `644` y HTTP `release-10` en el puerto `8080`.

  ```sh
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    printf "%s: " "$host"
    ssh -n -o BatchMode=yes -p 2222 "root@$host" 'cat /srv/site/message; stat -c %a /srv/site/message'
    curl -fsS --max-time 3 "http://$host:8080"
    printf "\n"
  done
  ```

  Etapa 2: El rollout está completo y el proceso en ejecución imprime `release-10`.

  ```sh
  kubectl rollout status deployment/relay --timeout=3s
  kubectl exec deployment/relay -c worker -- printenv RELEASE
  ```

debrief: Las comprobaciones verificaron el marcador gestionado, archivos y respuestas de la flota, y el rollout
  y entorno de relay.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el estado de workload y su preparación después del cambio.
diagnostics.content_1: En el host app1 /srv/site/message debe ser igual a release-10.
diagnostics.content_2: En el host app2 /srv/site/message debe ser igual a release-10.
diagnostics.content_3: En el host app3 /srv/site/message debe ser igual a release-10.
diagnostics.mode_1: En el host app1 el modo de /srv/site/message debe ser 644.
diagnostics.mode_2: En el host app2 el modo de /srv/site/message debe ser 644.
diagnostics.mode_3: En el host app3 el modo de /srv/site/message debe ser 644.
diagnostics.http_1: El host app1 en el puerto 8080 debe devolver release-10.
diagnostics.http_2: El host app2 en el puerto 8080 debe devolver release-10.
diagnostics.http_3: El host app3 en el puerto 8080 debe devolver release-10.
diagnostics.rollout: El despliegue del Deployment relay debe completarse.
diagnostics.release: RELEASE del Deployment relay debe ser release-10.
