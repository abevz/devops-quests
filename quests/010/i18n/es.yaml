title: Entrega de configuración
brief: 'Te uniste a las operaciones de SignalRail. Entregar un aviso station a través de dos sistemas.
  Trabajar en ~/quest. Mantenga todos los cambios dentro de esta bahía de entrenamiento.


  Archivos de búsqueda en `~/quest` (algunos se introducen en etapas posteriores): `inventory.ini`, `ansible.cfg`,
  `rollout.yml`, `deployment.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente los archivos suministrados, las imágenes
  precargadas y los servicios privados. Todos los cambios deben permanecer dentro de esta bahía.


  Criterios de éxito iniciales: los tres carteles de flotas en vivo muestran release-10.'
stages.0.brief: 'Se disparó la alerta station. Entregue release-10 a todo el fleet y recargue su banner
  en vivo.


  Criterios de éxito: los tres banners en vivo fleet muestran release-10.'
stages.0.objectives.0.text: Los tres carteles de flotas en vivo muestran release-10.
stages.1.brief: 'El lanzamiento llegó al station. Apareció un incidente reader: repare su entorno RELEASE.


  Criterios de éxito: el reader en vivo sirve para la versión prevista.'
stages.1.objectives.0.text: El reader en vivo sirve para la versión prevista.
hints.0.text: Primero compare los banners en vivo fleet con la versión solicitada.
hints.1.text: Un banner copiado necesita un reload handler; el siguiente incidente está en Kubernetes.
hints.2.text: Luego de pasar el fleet, inspect la variable reader RELEASE y su readiness probe.
debrief: El banner fleet y reader no estaban de acuerdo. Usted entregó la versión, recargó los hosts y
  reparó el entorno reader.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el estado de workload y su preparación después del cambio.
