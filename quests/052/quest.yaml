id: 52
title: title
track: Ansible
difficulty: complex
brief: brief
stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    keep: true
    check: 'dq_group_failed=0

      set +e

      (

      set -e

      ssh -n -o BatchMode=yes -p 2222 root@app1-"${DQ_NAMESPACE#dq-}" ''test "$(cat /srv/site/message)" = north-ready''

      )

      dq_condition_rc=$?

      if [ "$dq_condition_rc" -ne 0 ]; then

      printf ''%s\n'' ''Host app1 /srv/site/message: content = north-ready : ✗ [DQ:content_1]''

      dq_group_failed=1

      fi

      (

      set -e

      ssh -n -o BatchMode=yes -p 2222 root@app2-"${DQ_NAMESPACE#dq-}" ''test "$(cat /srv/site/message)" = north-ready''

      )

      dq_condition_rc=$?

      if [ "$dq_condition_rc" -ne 0 ]; then

      printf ''%s\n'' ''Host app2 /srv/site/message: content = north-ready : ✗ [DQ:content_2]''

      dq_group_failed=1

      fi

      (

      set -e

      ssh -n -o BatchMode=yes -p 2222 root@app3-"${DQ_NAMESPACE#dq-}" ''test "$(cat /srv/site/message)" = north-ready''

      )

      dq_condition_rc=$?

      if [ "$dq_condition_rc" -ne 0 ]; then

      printf ''%s\n'' ''Host app3 /srv/site/message: content = north-ready : ✗ [DQ:content_3]''

      dq_group_failed=1

      fi

      set -e

      test "$dq_group_failed" -eq 0'
  - text: stages.0.objectives.1.text
    check: 'dq_group_failed=0

      set +e

      (

      set -e

      ssh -n -o BatchMode=yes -p 2222 root@app1-"${DQ_NAMESPACE#dq-}" ''test "$(stat -c %a /srv/site/message)" =
      644''

      )

      dq_condition_rc=$?

      if [ "$dq_condition_rc" -ne 0 ]; then

      printf ''%s\n'' ''Host app1 /srv/site/message: mode = 644 : ✗ [DQ:mode_1]''

      dq_group_failed=1

      fi

      (

      set -e

      ssh -n -o BatchMode=yes -p 2222 root@app2-"${DQ_NAMESPACE#dq-}" ''test "$(stat -c %a /srv/site/message)" =
      644''

      )

      dq_condition_rc=$?

      if [ "$dq_condition_rc" -ne 0 ]; then

      printf ''%s\n'' ''Host app2 /srv/site/message: mode = 644 : ✗ [DQ:mode_2]''

      dq_group_failed=1

      fi

      (

      set -e

      ssh -n -o BatchMode=yes -p 2222 root@app3-"${DQ_NAMESPACE#dq-}" ''test "$(stat -c %a /srv/site/message)" =
      644''

      )

      dq_condition_rc=$?

      if [ "$dq_condition_rc" -ne 0 ]; then

      printf ''%s\n'' ''Host app3 /srv/site/message: mode = 644 : ✗ [DQ:mode_3]''

      dq_group_failed=1

      fi

      set -e

      test "$dq_group_failed" -eq 0'
  - text: stages.0.objectives.2.text
    check: "dq_probe_output=$(mktemp)\ntrap 'rm -f \"$dq_probe_output\"' EXIT\nset +e\n(\nset -euo pipefail\ncd\
      \ ~/quest\ntimeout --kill-after=1s 10s bash -euo pipefail <<'DQ_LEGACY_052'\ndq_group_failed=0\nset +e\n(\n\
      set -e\ntest \"$(curl -fsS --max-time 3 http://app1-${DQ_NAMESPACE#dq-}:8080)\" = north-ready\n)\ndq_condition_rc=$?\n\
      if [ \"$dq_condition_rc\" -ne 0 ]; then\nprintf '%s\\n' 'Host app1 HTTP / on port 8080 = north-ready : ✗ [DQ:http_1]'\n\
      dq_group_failed=1\nfi\n(\nset -e\ntest \"$(curl -fsS --max-time 3 http://app2-${DQ_NAMESPACE#dq-}:8080)\"\
      \ = north-ready\n)\ndq_condition_rc=$?\nif [ \"$dq_condition_rc\" -ne 0 ]; then\nprintf '%s\\n' 'Host app2\
      \ HTTP / on port 8080 = north-ready : ✗ [DQ:http_2]'\ndq_group_failed=1\nfi\n(\nset -e\ntest \"$(curl -fsS\
      \ --max-time 3 http://app3-${DQ_NAMESPACE#dq-}:8080)\" = north-ready\n)\ndq_condition_rc=$?\nif [ \"$dq_condition_rc\"\
      \ -ne 0 ]; then\nprintf '%s\\n' 'Host app3 HTTP / on port 8080 = north-ready : ✗ [DQ:http_3]'\ndq_group_failed=1\n\
      fi\nset -e\ntest \"$dq_group_failed\" -eq 0\nDQ_LEGACY_052\npython3 -I - <<'DQ_CONSUMERS'\nimport json, os,\
      \ shlex, subprocess, sys, time, urllib.request\nfrom pathlib import Path\n\ndeadline = time.monotonic() +\
      \ 10\nobserver = \"import hashlib\\nimport json\\nimport sys\\nfrom pathlib import Path\\n\\nresult = {}\\\
      nfor item in json.loads(sys.argv[1]):\\n    pid = Path(item['pidFile']).read_text().strip()\\n    proc = Path('/proc')\
      \ / pid\\n    status = dict(line.split(':', 1) for line in (proc / 'status').read_text().splitlines() if ':'\
      \ in line)\\n    result[item['name']] = {\\n        'pid': pid,\\n        'starttime': (proc / 'stat').read_text().rsplit(')\
      \ ', 1)[1].split()[19],\\n        'uid': status['Uid'].split(),\\n        'gid': status['Gid'].split(),\\\
      n        'groups': status['Groups'].split(),\\n        'caps': {key: status[key].strip() for key in ('CapInh',\
      \ 'CapPrm', 'CapEff', 'CapBnd', 'CapAmb')},\\n        'command': (proc / 'cmdline').read_bytes().decode().split(chr(0)),\\\
      n        'code': hashlib.sha256(Path(item['programPath']).read_bytes()).hexdigest(),\\n    }\\nprint(json.dumps(result))\\\
      n\"\nfacts = Path('/run/dq/facts/0')\ntry:\n    contract = json.loads((facts / 'consumer-contract.json').read_text())\n\
      \    expected = json.loads((facts / 'consumer-identities.json').read_text())\n    opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))\n\
      \    for host in ('app1', 'app2', 'app3'):\n        address = host + '-' + os.environ['DQ_NAMESPACE'][3:]\n\
      \        remote = '/usr/bin/python3 -c ' + shlex.quote(observer) + ' ' + shlex.quote(json.dumps(contract['consumers']))\n\
      \        result = subprocess.run(['ssh', '-n', '-o', 'BatchMode=yes', '-p', '2222', 'root@' + address, remote],\
      \ check=True, capture_output=True, text=True, timeout=max(.01, deadline-time.monotonic()))\n        if json.loads(result.stdout)\
      \ != expected[host]:\n            print('Provided application identity changed: ✗ [DQ:consumer_identity]')\n\
      \            sys.exit(1)\n        for item in contract['consumers']:\n            with opener.open('http://'\
      \ + address + ':' + str(item['port']) + '/', timeout=max(.01, deadline-time.monotonic())) as response:\n \
      \               if response.read(65536).decode().strip() != contract['response']:\n                    print('Live\
      \ application cache is stale: ✗ [DQ:consumer_cache]')\n                    sys.exit(1)\nexcept subprocess.TimeoutExpired:\n\
      \    print('Application observation timed out: ✗ [DQ:consumer_budget]')\n    sys.exit(1)\nexcept (OSError,\
      \ ValueError, KeyError, subprocess.CalledProcessError):\n    print('Application could not be observed: ✗ [DQ:consumer_observation]')\n\
      \    sys.exit(1)\nDQ_CONSUMERS\n) >\"$dq_probe_output\" 2>/dev/null\ndq_probe_status=$?\nset -e\ncat \"$dq_probe_output\"\
      \nif [ \"$dq_probe_status\" -ne 0 ] && ! grep -Eq '\\[DQ:[a-z0-9_]+\\]' \"$dq_probe_output\"; then\n printf\
      \ '%s\\n' 'Current inputs could not verify this objective: ✗ [DQ:probe_0_2]'\nfi\nrm -f \"$dq_probe_output\"\
      \ntrap - EXIT\ntest \"$dq_probe_status\" -eq 0"
