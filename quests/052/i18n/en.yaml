diagnostics.consumer_identity: The supplied application identity changed. Compare its process, principal, privileges,
  command line and installed program with the original receipt.
diagnostics.consumer_cache: The supplied application still serves another message. A readable file does not refresh
  a process cache automatically.
diagnostics.consumer_budget: The application observation exceeded its budget. Check SSH availability and HTTP responsiveness
  on the managed hosts.
diagnostics.consumer_observation: The supplied application could not be observed. Check its process, identity receipt,
  SSH connection and HTTP endpoint.
