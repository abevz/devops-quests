title: Handlers and permissions
brief: 'The fleet applications disagree about the delivered message.


  Work on the workstation in `~/quest` with `inventory.ini`, `ansible.cfg`, `rollout.yml`, `consumer-contract.json`,
  `consumer-identities.json` and `provided-consumer.py`.


  **Requirements:**

  - On every managed host (`app1`, `app2`, `app3`), preserve `/srv/site/message` content `north-ready` and deliver
  access mode `0644`.

  - Both live applications on every managed host must return `north-ready` from HTTP `/`, on ports `8080` and `8081`.

  - Preserve the supplied application identities listed in `consumer-identities.json`: processes, principals, privileges,
  command lines and installed program bytes. The contract describes their interfaces and the operator’s authority.


  The check observes current results and identities; it does not establish the full execution history.'
stages.0.brief: Both live applications agree with the delivered file while their supplied identities remain intact.
stages.0.objectives.0.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` contains `north-ready`.
stages.0.objectives.1.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` has mode `0644`.
stages.0.objectives.2.text: HTTP on ports `8080` and `8081` returns `north-ready` on every managed host (`app1`,
  `app2`, `app3`); the supplied application identities remain unchanged.
hints.0.text: A shared file can feed independent process caches. Access and refresh authority belong to different
  principals.
hints.1.text: |-
  Compare `rollout.yml` with `consumer-contract.json` and `provided-consumer.py`. On the managed hosts, inspect `/var/log/quest-banner-reader.log`, the input permissions and the process identity listed in `consumer-identities.json`. Compare both HTTP responses.

  Trace which tasks notify handlers in rollout.yml and which principal owns the process that handles SIGHUP in provided-consumer.py. Compare both processes’ access to the shared file.
hints.2.text: |-
  From the workstation, use `ansible fleet -m ansible.builtin.stat -a "path=/srv/site/message"` to confirm mode `0644`, then request `/` on ports `8080` and `8081` for all three hosts: all six responses must be `north-ready`. Compare process identity and installed program bytes with `consumer-identities.json`.

  For each host, compare the supplied `banner-reader` record with the observed PID and start time, UID, GID, groups, capabilities, command arguments, and program SHA-256.

  ```sh
  ansible fleet -m ansible.builtin.stat -a "path=/srv/site/message"
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    for port in 8080 8081; do
      printf "%s:%s " "$host" "$port"
      curl -fsS --max-time 3 "http://$host:$port/"
      printf '\n'
    done
    jq --arg station "app$n" '.[$station]["banner-reader"]' consumer-identities.json
    ssh -n -o BatchMode=yes -o ConnectTimeout=3 -p 2222 "root@$host" '
      set -eu
      pid=$(cat /run/quest-banner-reader.pid)
      printf "pid: %s\nstarttime: " "$pid"
      sed "s/^.*) //" "/proc/$pid/stat" | cut -d " " -f20
      grep -E "^(Uid|Gid|Groups|Cap(Inh|Prm|Eff|Bnd|Amb)):" "/proc/$pid/status"
      tr "\000" "\n" < "/proc/$pid/cmdline"
      sha256sum /usr/local/libexec/quest-banner-reader.py'
  done
  ```
debrief: You coordinated delivery, file access and refresh across consumers with different principals while preserving
  their process identities.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I verified the result on every managed host.
diagnostics.content_1: app1 did not return north-ready from /srv/site/message; delivery may not have run on that host, the file may have changed, or SSH/namespace inputs may prevent reading it. [Cause and check](guides#guide=ansible-10&section=handler-shared-content)
diagnostics.mode_1: app1 did not report mode 644 for /srv/site/message; the supplied task may still enforce 0600, or SSH/stat observation may have failed. [Cause and check](guides#guide=ansible-10&section=handler-file-access)
diagnostics.http_1: app1 did not serve north-ready on port 8080; the file may be correct but the reload handler was not notified, or the HTTP request or namespace lookup failed. [Cause and check](guides#guide=ansible-10&section=handler-root-cache)
diagnostics.content_2: app2 did not return north-ready from /srv/site/message; delivery may not have run on that host, the file may have changed, or SSH/namespace inputs may prevent reading it. [Cause and check](guides#guide=ansible-10&section=handler-shared-content)
diagnostics.mode_2: app2 did not report mode 644 for /srv/site/message; the supplied task may still enforce 0600, or SSH/stat observation may have failed. [Cause and check](guides#guide=ansible-10&section=handler-file-access)
diagnostics.http_2: app2 did not serve north-ready on port 8080; the file may be correct but the reload handler was not notified, or the HTTP request or namespace lookup failed. [Cause and check](guides#guide=ansible-10&section=handler-root-cache)
diagnostics.content_3: app3 did not return north-ready from /srv/site/message; delivery may not have run on that host, the file may have changed, or SSH/namespace inputs may prevent reading it. [Cause and check](guides#guide=ansible-10&section=handler-shared-content)
diagnostics.mode_3: app3 did not report mode 644 for /srv/site/message; the supplied task may still enforce 0600, or SSH/stat observation may have failed. [Cause and check](guides#guide=ansible-10&section=handler-file-access)
diagnostics.http_3: app3 did not serve north-ready on port 8080; the file may be correct but the reload handler was not notified, or the HTTP request or namespace lookup failed. [Cause and check](guides#guide=ansible-10&section=handler-root-cache)
diagnostics.consumer_identity: The supplied process no longer matches its frozen identity; restarting it, changing its principal or privileges, or editing its command/program can break the retained PID, start time and identity contract. [Cause and check](guides#guide=ansible-10&section=handler-retained-principal)
diagnostics.consumer_cache: The supplied consumer still serves stale content; mode 0600 can block its principal, and a permission fix alone does not refresh its cache if the SIGHUP handler was not notified or the signal could not be sent as that principal. [Cause and check](guides#guide=ansible-10&section=handler-unprivileged-cache)
diagnostics.consumer_budget: The SSH process observation exceeded the remaining budget; an unresponsive managed host or time already spent waiting on earlier consumer responses can leave too little time to inspect all hosts. [Cause and check](guides#guide=ansible-10&section=handler-observation-budget)
diagnostics.consumer_observation: The supplied consumer could not be observed; its process or frozen receipt may be missing, SSH/HTTP may fail, or a namespace or JSON observation may be unavailable or invalid. [Cause and check](guides#guide=ansible-10&section=handler-observer-inputs)
diagnostics.probe_0_2: The combined HTTP/consumer probe stopped without a named diagnostic; the workstation directory, Python startup or an interrupted legacy HTTP group may have prevented detailed observations. [Cause and check](guides#guide=ansible-10&section=handler-observer-inputs)
