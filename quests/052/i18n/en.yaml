title: Handlers and permissions
brief: 'You joined SignalRail operations. Fix both the delivered file and the live relay process. Work
  in ~/quest. Keep all changes inside this training bay.


  Inputs in `~/quest`: `inventory.ini`, `ansible.cfg`, `prepare.yml`, `rollout.yml`.


  The bay has no Internet or external DNS. Use only its supplied files, preloaded images and private services.
  All changes must stay inside this bay.


  Initial success criteria: All three /srv/site/message files contain north-ready, mode 0644, and all
  live HTTP banners return north-ready.'
stages.0.brief: 'The banner file has wrong permissions and the service cached old data. Fix mode 0644
  and reload on change.


  Success criteria: All three /srv/site/message files contain north-ready, mode 0644, and all live HTTP
  banners return north-ready.'
stages.0.objectives.0.text: All three /srv/site/message files contain north-ready, mode 0644, and all
  live HTTP banners return north-ready.
hints.0.text: Verify both the file and the live process response.
hints.1.text: Permissions and a stale process cache are separate causes.
hints.2.text: Deliver mode 0644 and notify a reload handler on change.
debrief: 'The rollout had two failures: file permissions and a stale process cache. You fixed both and
  verified remote state and live service responses.'
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I verified the result on every managed host.
