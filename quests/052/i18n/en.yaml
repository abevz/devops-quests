title: Handlers and permissions
brief: |-
  The fleet is not serving the requested route message.

  Work on the workstation in `~/quest` with `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Requirements:**
  - File on every managed host (`app1`, `app2`, `app3`):
    - Path: `/srv/site/message`.
    - Content: `north-ready`.
    - Access mode: `0644`.
  - Live service on every managed host (`app1`, `app2`, `app3`):
    - HTTP: `8080`, `/`.
    - Response: `north-ready`.

  The check observes current results; it does not establish the full execution history.
stages.0.brief: The delivered message and live service must agree on every managed host.
stages.0.objectives.0.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` contains
  `north-ready`.
stages.0.objectives.1.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` has mode
  `0644`.
stages.0.objectives.2.text: HTTP on port `8080` returns `north-ready` on every managed host (`app1`, `app2`,
  `app3`).
hints.0.text: A stored message and a running service can expose different versions of the same data.
hints.1.text: |-
  Verify both the file and the live process response. Permissions and a stale process cache are separate causes.

  Inspect the inventory and the supplied playbook on the workstation:

  ```sh
  ansible-inventory -i inventory.ini --graph
  cat rollout.yml
  ```
hints.2.text: |-
  Deliver mode 0644 and notify a reload handler on change.

  Verify the result from `~/quest` on the workstation:

  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/message'` — Shows `north-ready` from `app1`, `app2`, `app3`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/site/message'` — Shows `-rw-r--r--` on each host.
  - `for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done` — Shows `north-ready` from `app1`, `app2`, `app3`.
debrief: 'The rollout had two failures: file permissions and a stale process cache. You fixed both and
  verified remote state and live service responses.'
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I verified the result on every managed host.
