title: Handlers и права
brief: 'Вы в команде эксплуатации SignalRail. Исправьте файл и обновите работающий процесс. Работайте
  в ~/quest. Все изменения — только в этой песочнице.


  Входные файлы в `~/quest`: `inventory.ini`, `ansible.cfg`, `prepare.yml`, `rollout.yml`.


  В песочнице нет интернета и внешнего DNS. Используйте только выданные файлы, предварительно загруженные
  образы и приватные сервисы. Все изменения — только в этой песочнице.


  Цели первого этапа: На всех трёх узлах /srv/site/message содержит north-ready, режим 0644; все живые
  HTTP-баннеры возвращают north-ready.'
stages.0.brief: 'У файла неверные права, сервис закешировал старые данные. Нужны 0644 и reload при изменении.


  Результат проверки: На всех трёх узлах /srv/site/message содержит north-ready, режим 0644; все живые
  HTTP-баннеры возвращают north-ready.'
stages.0.objectives.0.text: На всех трёх узлах /srv/site/message содержит north-ready, режим 0644; все
  живые HTTP-баннеры возвращают north-ready.
hints.0.text: Проверьте файл и ответ работающего процесса.
hints.1.text: Права файла и старый cache процесса — разные причины.
hints.2.text: Доставьте файл с 0644 и вызовите reload handler при изменении.
debrief: 'У rollout было два сбоя: права файла и старый cache процесса. Вы исправили оба и проверили файлы
  и живые ответы сервиса.'
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я проверил результат на каждом управляемом хосте.
