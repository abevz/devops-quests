title: Handlers и права
brief: 'Приложения парка показывают разные версии доставленного сообщения.


  Работайте на рабочей станции в `~/quest` с `inventory.ini`, `ansible.cfg`, `rollout.yml`, `consumer-contract.json`,
  `consumer-identities.json` и `provided-consumer.py`.


  **Требования:**

  - На каждом управляемом узле (`app1`, `app2`, `app3`) сохраните содержимое `north-ready` в `/srv/site/message`
  и установите права `0644`.

  - Оба работающих приложения на каждом управляемом узле должны возвращать `north-ready` по HTTP `/` на портах `8080`
  и `8081`.

  - Сохраните исходные идентичности приложений из `consumer-identities.json`: процессы, учётные записи, привилегии,
  командные строки и байты установленной программы. Контракт описывает интерфейсы приложений и полномочия оператора.


  Проверка наблюдает текущие результаты и идентичности, но не устанавливает полную историю выполнения.'
stages.0.brief: Оба работающих приложения согласованы с доставленным файлом; исходные идентичности сохранены.
stages.0.objectives.0.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/message` содержит
  `north-ready`.
stages.0.objectives.1.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) путь `/srv/site/message` имеет
  режим `0644`.
stages.0.objectives.2.text: HTTP на портах `8080` и `8081` возвращает `north-ready` на каждом управляемом узле (`app1`,
  `app2`, `app3`); исходные идентичности приложений сохранены.
hints.0.text: Общий файл может питать независимые кеши процессов. Доступ и полномочия обновления принадлежат разным
  учётным записям.
hints.1.text: |-
  Сопоставьте `rollout.yml`, `consumer-contract.json` и `provided-consumer.py`. На управляемых узлах изучите `/var/log/quest-banner-reader.log`, права входного файла и идентичность процесса из `consumer-identities.json`. Сравните оба HTTP-ответа.

  Проследите, какие задачи в rollout.yml уведомляют обработчики и от какого пользователя работает процесс, обрабатывающий SIGHUP в provided-consumer.py. Сравните доступ обоих процессов к общему файлу.
hints.2.text: |-
  На рабочей станции проверьте права `0644` командой `ansible fleet -m ansible.builtin.stat -a "path=/srv/site/message"`, затем запросите `/` на портах `8080` и `8081` всех трёх узлов: все шесть ответов должны быть `north-ready`. Сопоставьте идентичность процесса и байты установленной программы с `consumer-identities.json`.

  Для каждого хоста сверяйте выданную запись `banner-reader` с наблюдаемыми PID, временем запуска, UID, GID, группами, capabilities, аргументами команды и SHA-256 программы.

  ```sh
  ansible fleet -m ansible.builtin.stat -a "path=/srv/site/message"
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    for port in 8080 8081; do
      printf "%s:%s " "$host" "$port"
      curl -fsS --max-time 3 "http://$host:$port/"
      printf '\n'
    done
    jq --arg station "app$n" '.[$station]["banner-reader"]' consumer-identities.json
    ssh -n -o BatchMode=yes -o ConnectTimeout=3 -p 2222 "root@$host" '
      set -eu
      pid=$(cat /run/quest-banner-reader.pid)
      printf "pid: %s\nstarttime: " "$pid"
      sed "s/^.*) //" "/proc/$pid/stat" | cut -d " " -f20
      grep -E "^(Uid|Gid|Groups|Cap(Inh|Prm|Eff|Bnd|Amb)):" "/proc/$pid/status"
      tr "\000" "\n" < "/proc/$pid/cmdline"
      sha256sum /usr/local/libexec/quest-banner-reader.py'
  done
  ```
debrief: Вы согласовали доставку, доступ к файлу и обновление потребителей с разными учётными записями, сохранив
  идентичности процессов.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я проверил результат на каждом управляемом хосте.
diagnostics.content_1: 'app1 не вернул north-ready из /srv/site/message: доставка могла не выполниться на хосте, файл изменён либо SSH или namespace мешают чтению. [Причина и проверка](guides#guide=ansible-10&section=handler-shared-content)'
diagnostics.mode_1: 'app1 не подтвердил режим 644 для /srv/site/message: выданная задача могла сохранить 0600 либо наблюдение SSH/stat завершилось ошибкой. [Причина и проверка](guides#guide=ansible-10&section=handler-file-access)'
diagnostics.http_1: 'app1 не выдал north-ready на порту 8080: файл может быть правильным, но обработчик reload не получил уведомление либо запрос HTTP или разрешение namespace завершились ошибкой. [Причина и проверка](guides#guide=ansible-10&section=handler-root-cache)'
