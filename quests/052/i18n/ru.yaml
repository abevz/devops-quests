diagnostics.consumer_identity: 'Выданный процесс не совпадает с зафиксированной идентичностью: перезапуск, смена пользователя или привилегий, команды или программы нарушают контракт сохранённых PID, времени старта и идентичности. [Причина и проверка](guides#guide=ansible-10&section=handler-retained-principal)'
diagnostics.consumer_cache: 'Выданный потребитель выдаёт старое содержимое: режим 0600 может блокировать его пользователя, а одни исправленные права не обновят кэш, если обработчик SIGHUP не уведомлён или сигнал не удалось отправить от этого пользователя. [Причина и проверка](guides#guide=ansible-10&section=handler-unprivileged-cache)'
diagnostics.consumer_budget: 'Наблюдение процесса через SSH превысило оставшийся лимит: недоступный управляемый хост или время, потраченное на предыдущие ответы потребителей, могли помешать проверить все хосты. [Причина и проверка](guides#guide=ansible-10&section=handler-observation-budget)'
diagnostics.consumer_observation: 'Не удалось наблюдать выданного потребителя: процесс или зафиксированное свидетельство могут отсутствовать, SSH/HTTP завершиться ошибкой либо namespace или JSON недоступны или некорректны. [Причина и проверка](guides#guide=ansible-10&section=handler-observer-inputs)'
diagnostics.probe_0_2: 'Общая проверка HTTP и потребителя остановилась без именованной диагностики: рабочий каталог, запуск Python или прерванная группа прежних HTTP-проверок могли помешать подробному наблюдению. [Причина и проверка](guides#guide=ansible-10&section=handler-observer-inputs)'
