title: Handlers и права
brief: 'Приложения парка показывают разные версии доставленного сообщения.


  Работайте на рабочей станции в `~/quest` с `inventory.ini`, `ansible.cfg`, `rollout.yml`, `consumer-contract.json`,
  `consumer-identities.json` и `provided-consumer.py`.


  **Требования:**

  - На каждом управляемом узле (`app1`, `app2`, `app3`) сохраните содержимое `north-ready` в `/srv/site/message`
  и установите права `0644`.

  - Оба работающих приложения на каждом управляемом узле должны возвращать `north-ready` по HTTP `/` на портах `8080`
  и `8081`.

  - Сохраните исходные идентичности приложений из `consumer-identities.json`: процессы, учётные записи, привилегии,
  командные строки и байты установленной программы. Контракт описывает интерфейсы приложений и полномочия оператора.


  Проверка наблюдает текущие результаты и идентичности, но не устанавливает полную историю выполнения.'
stages.0.brief: Оба работающих приложения согласованы с доставленным файлом; исходные идентичности сохранены.
stages.0.objectives.0.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/message` содержит
  `north-ready`.
stages.0.objectives.1.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) путь `/srv/site/message` имеет
  режим `0644`.
stages.0.objectives.2.text: HTTP на портах `8080` и `8081` возвращает `north-ready` на каждом управляемом узле (`app1`,
  `app2`, `app3`); исходные идентичности приложений сохранены.
hints.0.text: Общий файл может питать независимые кеши процессов. Доступ и полномочия обновления принадлежат разным
  учётным записям.
hints.1.text: Сопоставьте `rollout.yml`, `consumer-contract.json` и `provided-consumer.py`. На управляемых узлах
  изучите `/var/log/quest-banner-reader.log`, права входного файла и идентичность процесса из `consumer-identities.json`.
  Сравните оба HTTP-ответа.
hints.2.text: 'Постройте доставку и уведомления для обоих приложений. Предоставленный потребитель обновляется по
  SIGHUP; отправьте сигнал от его учётной записи через `runuser`. На рабочей станции проверьте права `0644` командой
  `ansible fleet -m ansible.builtin.stat -a "path=/srv/site/message"`, затем запросите `/` на портах `8080` и `8081`
  всех трёх узлов: все шесть ответов должны быть `north-ready`. Сопоставьте идентичность процесса и байты установленной
  программы с `consumer-identities.json`.'
debrief: Вы согласовали доставку, доступ к файлу и обновление потребителей с разными учётными записями, сохранив
  идентичности процессов.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я проверил результат на каждом управляемом хосте.
