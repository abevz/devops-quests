title: Handlers и права
brief: |-
  Флот не выдаёт требуемое сообщение маршрута.

  Работайте на workstation в `~/quest` с файлами `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Требования:**
  - Файл на каждом управляемом хосте (`app1`, `app2`, `app3`):
    - Путь: `/srv/site/message`.
    - Содержимое: `north-ready`.
    - Режим доступа: `0644`.
  - Живой сервис на каждом управляемом хосте (`app1`, `app2`, `app3`):
    - HTTP: `8080`, `/`.
    - Ответ: `north-ready`.

  Проверка наблюдает текущие результаты; она не устанавливает полную историю выполнения.
stages.0.brief: Доставленное сообщение и живой сервис должны совпадать на каждом управляемом хосте.
stages.0.objectives.0.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/message`
  содержит `north-ready`.
stages.0.objectives.1.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) путь `/srv/site/message`
  имеет режим `0644`.
stages.0.objectives.2.text: HTTP на порту `8080` возвращает `north-ready` на каждом управляемом хосте
  (`app1`, `app2`, `app3`).
hints.0.text: Сохранённое сообщение и работающий сервис могут показывать разные версии одних данных.
hints.1.text: |-
  Проверьте файл и ответ работающего процесса. Права файла и старый cache процесса — разные причины.

  Изучите inventory и предоставленный плейбук на workstation:

  ```sh
  ansible-inventory -i inventory.ini --graph
  cat rollout.yml
  ```
hints.2.text: |-
  Доставьте файл с 0644 и вызовите reload handler при изменении.

  Проверьте результат из `~/quest` на workstation:

  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/message'` — Показывает `north-ready` от `app1`, `app2`, `app3`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/site/message'` — Показывает `-rw-r--r--` на каждом хосте.
  - `for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done` — Показывает `north-ready` от `app1`, `app2`, `app3`.
debrief: 'У rollout было два сбоя: права файла и старый cache процесса. Вы исправили оба и проверили файлы
  и живые ответы сервиса.'
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я проверил результат на каждом управляемом хосте.
