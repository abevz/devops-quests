diagnostics.consumer_identity: Dostarczony proces nie odpowiada zamrożonej tożsamości; restart, zmiana użytkownika lub uprawnień, polecenia albo programu może naruszyć zachowany PID, czas startu i kontrakt tożsamości. [Przyczyna i kontrola](guides#guide=ansible-10&section=handler-retained-principal)
diagnostics.consumer_cache: Dostarczony odbiorca nadal podaje stare dane; 0600 może blokować jego użytkownika, a sama poprawa praw nie odświeża pamięci podręcznej, gdy handler SIGHUP nie został powiadomiony lub sygnału nie wysłano jako ten użytkownik. [Przyczyna i kontrola](guides#guide=ansible-10&section=handler-unprivileged-cache)
diagnostics.consumer_budget: Obserwacja procesu przez SSH przekroczyła pozostały limit; nieodpowiadający host lub czas zużyty na wcześniejsze odpowiedzi odbiorców może uniemożliwić kontrolę wszystkich hostów. [Przyczyna i kontrola](guides#guide=ansible-10&section=handler-observation-budget)
diagnostics.consumer_observation: Nie można obserwować dostarczonego odbiorcy; proces lub zamrożony zapis może nie istnieć, SSH/HTTP może zawieść albo namespace lub JSON jest niedostępny lub błędny. [Przyczyna i kontrola](guides#guide=ansible-10&section=handler-observer-inputs)
diagnostics.probe_0_2: Połączona kontrola HTTP i odbiorcy zatrzymała się bez nazwanej diagnostyki; katalog roboczy, start Pythona lub przerwana wcześniejsza grupa HTTP mogły uniemożliwić szczegółową obserwację. [Przyczyna i kontrola](guides#guide=ansible-10&section=handler-observer-inputs)
