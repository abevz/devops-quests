title: Handlers i uprawnienia
brief: 'Dołączyłeś do operacji SignalRail. Napraw zarówno dostarczony plik, jak i działający proces relay.
  Pracuj w ~/quest. Wszystkie zmiany przechowuj w tej komorze szkoleniowej.


  Wejścia w `~/quest`: `inventory.ini`, `ansible.cfg`, `prepare.yml`, `rollout.yml`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Wszystkie zmiany muszą pozostać w tej zatoce.


  Początkowe kryteria sukcesu: wszystkie trzy pliki /srv/site/message zawierają north-ready, tryb 0644,
  a wszystkie aktywne banery HTTP zwracają north-ready.'
stages.0.brief: 'Plik banera ma nieprawidłowe uprawnienia, a usługa buforuje stare dane. Napraw tryb 0644
  i reload po zmianie.


  Kryteria sukcesu: wszystkie trzy pliki /srv/site/message zawierają north-ready, tryb 0644, a wszystkie
  aktywne banery HTTP zwracają north-ready.'
stages.0.objectives.0.text: Wszystkie trzy pliki /srv/site/message zawierają north-ready, tryb 0644, a
  wszystkie aktywne banery HTTP zwracają north-ready.
hints.0.text: Sprawdź zarówno plik, jak i odpowiedź procesu na żywo.
hints.1.text: Uprawnienia i przestarzały proces cache to osobne przyczyny.
hints.2.text: Dostarcz tryb 0644 i powiadom reload handler o zmianie.
debrief: 'W rollout wystąpiły dwie awarie: uprawnienia do plików i nieaktualny proces cache. Naprawiono
  oba i zweryfikowano odpowiedzi na stan zdalny i usługi na żywo.'
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem wynik na każdym zarządzanym hoście.
