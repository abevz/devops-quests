title: Handlers i uprawnienia
brief: |-
  Flota nie udostępnia wymaganego komunikatu trasy.

  Pracuj na workstation w `~/quest` z plikami `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Wymagania:**
  - Plik na każdym zarządzanym hoście (`app1`, `app2`, `app3`):
    - Ścieżka: `/srv/site/message`.
    - Treść: `north-ready`.
    - Tryb dostępu: `0644`.
  - Aktywna usługa na każdym zarządzanym hoście (`app1`, `app2`, `app3`):
    - HTTP: `8080`, `/`.
    - Odpowiedź: `north-ready`.

  Sprawdzenie obserwuje bieżące wyniki; nie ustala pełnej historii wykonania.
stages.0.brief: Dostarczony komunikat i aktywna usługa muszą być zgodne na każdym zarządzanym hoście.
stages.0.objectives.0.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/message`
  zawiera `north-ready`.
stages.0.objectives.1.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) ścieżka `/srv/site/message`
  ma tryb `0644`.
stages.0.objectives.2.text: HTTP na porcie `8080` zwraca `north-ready` na każdym zarządzanym hoście (`app1`,
  `app2`, `app3`).
hints.0.text: Zapisana wiadomość i działająca usługa mogą pokazywać różne wersje tych samych danych.
hints.1.text: |-
  Sprawdź zarówno plik, jak i odpowiedź procesu na żywo. Uprawnienia i przestarzały proces cache to osobne przyczyny.

  Sprawdź inventory i dostarczony playbook na workstation:

  ```sh
  ansible-inventory -i inventory.ini --graph
  cat rollout.yml
  ```
hints.2.text: |-
  Dostarcz tryb 0644 i powiadom reload handler o zmianie.

  Sprawdź wynik z `~/quest` na workstation:

  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/message'` — Pokazuje `north-ready` z `app1`, `app2`, `app3`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/site/message'` — Pokazuje `-rw-r--r--` na każdym hoście.
  - `for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done` — Pokazuje `north-ready` z `app1`, `app2`, `app3`.
debrief: 'W rollout wystąpiły dwie awarie: uprawnienia do plików i nieaktualny proces cache. Naprawiono
  oba i zweryfikowano odpowiedzi na stan zdalny i usługi na żywo.'
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem wynik na każdym zarządzanym hoście.
