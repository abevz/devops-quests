title: Handlers i uprawnienia
brief: 'Aplikacje floty pokazują różne wersje dostarczonego komunikatu.


  Pracuj na stacji roboczej w `~/quest` z `inventory.ini`, `ansible.cfg`, `rollout.yml`, `consumer-contract.json`,
  `consumer-identities.json` i `provided-consumer.py`.


  **Wymagania:**

  - Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) zachowaj treść `north-ready` w `/srv/site/message` i ustaw
  uprawnienia `0644`.

  - Obie działające aplikacje na każdym zarządzanym hoście mają zwracać `north-ready` przez HTTP `/` na portach
  `8080` i `8081`.

  - Zachowaj oryginalne tożsamości aplikacji z `consumer-identities.json`: procesy, konta, przywileje, wiersze poleceń
  i bajty zainstalowanego programu. Kontrakt opisuje interfejsy oraz uprawnienia operatora.


  Sprawdzenie obserwuje bieżące wyniki i tożsamości; nie ustala pełnej historii wykonania.'
stages.0.brief: Obie działające aplikacje są zgodne z dostarczonym plikiem; ich oryginalne tożsamości pozostają
  zachowane.
stages.0.objectives.0.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/message` zawiera
  `north-ready`.
stages.0.objectives.1.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) ścieżka `/srv/site/message` ma
  tryb `0644`.
stages.0.objectives.2.text: HTTP na portach `8080` i `8081` zwraca `north-ready` na każdym zarządzanym hoście (`app1`,
  `app2`, `app3`); oryginalne tożsamości aplikacji pozostają bez zmian.
hints.0.text: Wspólny plik może zasilać niezależne pamięci podręczne procesów. Dostęp i uprawnienia do odświeżania
  należą do różnych kont.
hints.1.text: |-
  Porównaj `rollout.yml`, `consumer-contract.json` i `provided-consumer.py`. Na zarządzanych hostach sprawdź `/var/log/quest-banner-reader.log`, uprawnienia pliku wejściowego oraz tożsamość procesu z `consumer-identities.json`. Porównaj obie odpowiedzi HTTP.

  Sprawdź, które zadania w rollout.yml powiadamiają procedury obsługi i do którego użytkownika należy proces obsługujący SIGHUP w provided-consumer.py. Porównaj dostęp obu procesów do współdzielonego pliku.
hints.2.text: |-
  Na stacji roboczej potwierdź tryb `0644` poleceniem `ansible fleet -m ansible.builtin.stat -a "path=/srv/site/message"`, a następnie odpytaj `/` na portach `8080` i `8081` wszystkich trzech hostów: wszystkie sześć odpowiedzi ma zawierać `north-ready`. Porównaj tożsamość procesu i bajty zainstalowanego programu z `consumer-identities.json`.

  Na każdym hoście porównaj dostarczony rekord `banner-reader` z obserwowanymi PID, czasem startu, UID, GID, grupami, capabilities, argumentami polecenia i sumą SHA-256 programu.

  ```sh
  ansible fleet -m ansible.builtin.stat -a "path=/srv/site/message"
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    for port in 8080 8081; do
      printf "%s:%s " "$host" "$port"
      curl -fsS --max-time 3 "http://$host:$port/"
      printf '\n'
    done
    jq --arg station "app$n" '.[$station]["banner-reader"]' consumer-identities.json
    ssh -n -o BatchMode=yes -o ConnectTimeout=3 -p 2222 "root@$host" '
      set -eu
      pid=$(cat /run/quest-banner-reader.pid)
      printf "pid: %s\nstarttime: " "$pid"
      sed "s/^.*) //" "/proc/$pid/stat" | cut -d " " -f20
      grep -E "^(Uid|Gid|Groups|Cap(Inh|Prm|Eff|Bnd|Amb)):" "/proc/$pid/status"
      tr "\000" "\n" < "/proc/$pid/cmdline"
      sha256sum /usr/local/libexec/quest-banner-reader.py'
  done
  ```
debrief: Skoordynowano dostarczanie, dostęp do pliku i odświeżanie między konsumentami o różnych kontach, zachowując
  tożsamości procesów.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem wynik na każdym zarządzanym hoście.
diagnostics.content_1: app1 nie zwrócił north-ready z /srv/site/message; dostarczenie mogło nie objąć hosta, plik się zmienił albo SSH lub namespace uniemożliwia odczyt. [Przyczyna i kontrola](guides#guide=ansible-10&section=handler-shared-content)
diagnostics.mode_1: app1 nie potwierdził trybu 644 dla /srv/site/message; dostarczone zadanie może nadal wymuszać 0600 albo obserwacja SSH/stat zawiodła. [Przyczyna i kontrola](guides#guide=ansible-10&section=handler-file-access)
diagnostics.http_1: app1 nie podał north-ready na porcie 8080; plik może być poprawny, ale handler reload nie został powiadomiony albo żądanie HTTP lub namespace zawiodło. [Przyczyna i kontrola](guides#guide=ansible-10&section=handler-root-cache)
