title: Handlers y permisos
brief: |-
  La flota no sirve el mensaje de ruta solicitado.

  Trabaja en la workstation en `~/quest` con `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Requisitos:**
  - Archivo en cada host administrado (`app1`, `app2`, `app3`):
    - Ruta: `/srv/site/message`.
    - Contenido: `north-ready`.
    - Modo de acceso: `0644`.
  - Servicio activo en cada host administrado (`app1`, `app2`, `app3`):
    - HTTP: `8080`, `/`.
    - Respuesta: `north-ready`.

  La comprobación observa los resultados actuales; no establece todo el historial de ejecución.
stages.0.brief: El mensaje entregado y el servicio activo deben coincidir en cada host administrado.
stages.0.objectives.0.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` contiene
  `north-ready`.
stages.0.objectives.1.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` tiene
  el modo `0644`.
stages.0.objectives.2.text: HTTP en el puerto `8080` devuelve `north-ready` en cada host administrado
  (`app1`, `app2`, `app3`).
hints.0.text: Un mensaje almacenado y un servicio activo pueden mostrar versiones distintas de los mismos
  datos.
hints.1.text: |-
  Verifique tanto el archivo como la respuesta del proceso en vivo. Los permisos y un proceso obsoleto cache son causas distintas.

  Inspecciona el inventario y el playbook suministrado en la workstation:

  ```sh
  ansible-inventory -i inventory.ini --graph
  cat rollout.yml
  ```
hints.2.text: |-
  Entregue el modo 0644 y notifique a reload handler sobre el cambio.

  Verifica el resultado desde `~/quest` en la workstation:

  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/message'` — Muestra `north-ready` de `app1`, `app2`, `app3`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/site/message'` — Muestra `-rw-r--r--` en cada host.
  - `for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done` — Muestra `north-ready` de `app1`, `app2`, `app3`.
debrief: 'El rollout tuvo dos fallas: permisos de archivos y un proceso obsoleto cache. Usted arregló
  ambos y verificó el estado remoto y las respuestas del servicio en vivo.'
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el resultado en cada host administrado.
