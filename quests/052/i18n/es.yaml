title: Handlers y permisos
brief: 'Las aplicaciones de la flota muestran versiones distintas del mensaje entregado.


  Trabaja en la estación de trabajo, en `~/quest`, con `inventory.ini`, `ansible.cfg`, `rollout.yml`, `consumer-contract.json`,
  `consumer-identities.json` y `provided-consumer.py`.


  **Requisitos:**

  - En cada host administrado (`app1`, `app2`, `app3`), conserva el contenido `north-ready` de `/srv/site/message`
  y entrega permisos `0644`.

  - Ambas aplicaciones en ejecución deben devolver `north-ready` mediante HTTP `/` en los puertos `8080` y `8081`
  de cada host administrado.

  - Conserva las identidades originales de las aplicaciones de `consumer-identities.json`: procesos, usuarios, privilegios,
  líneas de órdenes y bytes del programa instalado. El contrato describe sus interfaces y la autoridad del operador.


  La comprobación observa resultados e identidades actuales; no demuestra todo el historial de ejecución.'
stages.0.brief: Ambas aplicaciones coinciden con el archivo entregado y conservan sus identidades originales.
stages.0.objectives.0.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` contiene `north-ready`.
stages.0.objectives.1.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` tiene el modo
  `0644`.
stages.0.objectives.2.text: HTTP en los puertos `8080` y `8081` devuelve `north-ready` en cada host administrado
  (`app1`, `app2`, `app3`); las identidades originales de las aplicaciones no cambian.
hints.0.text: Un archivo compartido puede alimentar cachés de procesos independientes. El acceso y la autoridad
  para actualizar pertenecen a usuarios distintos.
hints.1.text: Compara `rollout.yml`, `consumer-contract.json` y `provided-consumer.py`. En los hosts administrados,
  inspecciona `/var/log/quest-banner-reader.log`, los permisos del archivo de entrada y la identidad del proceso
  de `consumer-identities.json`. Compara ambas respuestas HTTP.
hints.2.text: 'Construye la entrega y las notificaciones para ambas aplicaciones. El consumidor proporcionado se
  actualiza con SIGHUP; envía la señal con su propio usuario mediante `runuser`. Desde la estación de trabajo, confirma
  los permisos `0644` con `ansible fleet -m ansible.builtin.stat -a "path=/srv/site/message"` y solicita `/` en
  los puertos `8080` y `8081` de los tres hosts: las seis respuestas deben ser `north-ready`. Compara la identidad
  del proceso y los bytes del programa instalado con `consumer-identities.json`.'
debrief: Coordinaste la entrega, el acceso al archivo y la actualización entre consumidores con usuarios distintos,
  conservando las identidades de sus procesos.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el resultado en cada host administrado.
diagnostics.content_1: app1 no devolvió north-ready desde /srv/site/message; la entrega puede no haberse ejecutado allí, el archivo cambió o SSH o namespace impiden leerlo. [Causa y comprobación](guides#guide=ansible-10&section=handler-shared-content)
diagnostics.mode_1: app1 no informó modo 644 en /srv/site/message; la tarea suministrada puede mantener 0600 o falló la observación SSH/stat. [Causa y comprobación](guides#guide=ansible-10&section=handler-file-access)
diagnostics.http_1: app1 no sirvió north-ready en el puerto 8080; el archivo puede estar correcto pero no se notificó al handler reload, o falló la petición HTTP o la resolución namespace. [Causa y comprobación](guides#guide=ansible-10&section=handler-root-cache)
diagnostics.content_2: app2 no devolvió north-ready desde /srv/site/message; la entrega puede no haberse ejecutado allí, el archivo cambió o SSH o namespace impiden leerlo. [Causa y comprobación](guides#guide=ansible-10&section=handler-shared-content)
diagnostics.mode_2: app2 no informó modo 644 en /srv/site/message; la tarea suministrada puede mantener 0600 o falló la observación SSH/stat. [Causa y comprobación](guides#guide=ansible-10&section=handler-file-access)
diagnostics.http_2: app2 no sirvió north-ready en el puerto 8080; el archivo puede estar correcto pero no se notificó al handler reload, o falló la petición HTTP o la resolución namespace. [Causa y comprobación](guides#guide=ansible-10&section=handler-root-cache)
diagnostics.content_3: app3 no devolvió north-ready desde /srv/site/message; la entrega puede no haberse ejecutado allí, el archivo cambió o SSH o namespace impiden leerlo. [Causa y comprobación](guides#guide=ansible-10&section=handler-shared-content)
diagnostics.mode_3: app3 no informó modo 644 en /srv/site/message; la tarea suministrada puede mantener 0600 o falló la observación SSH/stat. [Causa y comprobación](guides#guide=ansible-10&section=handler-file-access)
diagnostics.http_3: app3 no sirvió north-ready en el puerto 8080; el archivo puede estar correcto pero no se notificó al handler reload, o falló la petición HTTP o la resolución namespace. [Causa y comprobación](guides#guide=ansible-10&section=handler-root-cache)
diagnostics.consumer_identity: El proceso suministrado ya no coincide con su identidad fijada; reiniciarlo, cambiar usuario o privilegios, comando o programa puede romper el contrato de PID, inicio e identidad conservados. [Causa y comprobación](guides#guide=ansible-10&section=handler-retained-principal)
diagnostics.consumer_cache: El consumidor suministrado sigue sirviendo contenido antiguo; 0600 puede bloquear a su usuario y corregir permisos no refresca la caché si no se notificó al handler SIGHUP o no pudo enviarse la señal con esa identidad. [Causa y comprobación](guides#guide=ansible-10&section=handler-unprivileged-cache)
diagnostics.consumer_budget: La observación del proceso por SSH superó el tiempo restante; un host que no responde o el tiempo consumido esperando respuestas anteriores puede impedir inspeccionar todos los hosts. [Causa y comprobación](guides#guide=ansible-10&section=handler-observation-budget)
diagnostics.consumer_observation: No se pudo observar el consumidor suministrado; pueden faltar su proceso o registro fijado, fallar SSH/HTTP o no estar disponibles o ser inválidos namespace o JSON. [Causa y comprobación](guides#guide=ansible-10&section=handler-observer-inputs)
diagnostics.probe_0_2: La prueba conjunta HTTP y consumidor se detuvo sin diagnóstico específico; el directorio de trabajo, el inicio de Python o el grupo HTTP anterior interrumpido pueden impedir observaciones detalladas. [Causa y comprobación](guides#guide=ansible-10&section=handler-observer-inputs)
