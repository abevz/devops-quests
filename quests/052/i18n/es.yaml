title: Handlers y permisos
brief: 'Te uniste a las operaciones de SignalRail. Corrija tanto el archivo entregado como el proceso
  relay en vivo. Trabajar en ~/quest. Mantenga todos los cambios dentro de esta bahía de entrenamiento.


  Entradas en `~/quest`: `inventory.ini`, `ansible.cfg`, `prepare.yml`, `rollout.yml`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente los archivos suministrados, las imágenes
  precargadas y los servicios privados. Todos los cambios deben permanecer dentro de esta bahía.


  Criterios de éxito iniciales: los tres archivos /srv/site/message contienen north-ready, modo 0644,
  y todos los banners activos HTTP devuelven north-ready.'
stages.0.brief: 'El archivo de banner tiene permisos incorrectos y el servicio almacenó en caché datos
  antiguos. Se corrigió el modo 0644 y reload al cambiar.


  Criterios de éxito: los tres archivos /srv/site/message contienen north-ready, modo 0644, y todos los
  banners activos HTTP devuelven north-ready.'
stages.0.objectives.0.text: Los tres archivos /srv/site/message contienen north-ready, modo 0644, y todos
  los banners HTTP activos devuelven north-ready.
hints.0.text: Verifique tanto el archivo como la respuesta del proceso en vivo.
hints.1.text: Los permisos y un proceso obsoleto cache son causas distintas.
hints.2.text: Entregue el modo 0644 y notifique a reload handler sobre el cambio.
debrief: 'El rollout tuvo dos fallas: permisos de archivos y un proceso obsoleto cache. Usted arregló
  ambos y verificó el estado remoto y las respuestas del servicio en vivo.'
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el resultado en cada host administrado.
