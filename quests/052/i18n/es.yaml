title: Handlers y permisos
brief: 'Las aplicaciones de la flota muestran versiones distintas del mensaje entregado.


  Trabaja en la estación de trabajo, en `~/quest`, con `inventory.ini`, `ansible.cfg`, `rollout.yml`, `consumer-contract.json`,
  `consumer-identities.json` y `provided-consumer.py`.


  **Requisitos:**

  - En cada host administrado (`app1`, `app2`, `app3`), conserva el contenido `north-ready` de `/srv/site/message`
  y entrega permisos `0644`.

  - Ambas aplicaciones en ejecución deben devolver `north-ready` mediante HTTP `/` en los puertos `8080` y `8081`
  de cada host administrado.

  - Conserva las identidades originales de las aplicaciones de `consumer-identities.json`: procesos, usuarios, privilegios,
  líneas de órdenes y bytes del programa instalado. El contrato describe sus interfaces y la autoridad del operador.


  La comprobación observa resultados e identidades actuales; no demuestra todo el historial de ejecución.'
stages.0.brief: Ambas aplicaciones coinciden con el archivo entregado y conservan sus identidades originales.
stages.0.objectives.0.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` contiene `north-ready`.
stages.0.objectives.1.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` tiene el modo
  `0644`.
stages.0.objectives.2.text: HTTP en los puertos `8080` y `8081` devuelve `north-ready` en cada host administrado
  (`app1`, `app2`, `app3`); las identidades originales de las aplicaciones no cambian.
hints.0.text: Un archivo compartido puede alimentar cachés de procesos independientes. El acceso y la autoridad
  para actualizar pertenecen a usuarios distintos.
hints.1.text: Compara `rollout.yml`, `consumer-contract.json` y `provided-consumer.py`. En los hosts administrados,
  inspecciona `/var/log/quest-banner-reader.log`, los permisos del archivo de entrada y la identidad del proceso
  de `consumer-identities.json`. Compara ambas respuestas HTTP.
hints.2.text: 'Construye la entrega y las notificaciones para ambas aplicaciones. El consumidor proporcionado se
  actualiza con SIGHUP; envía la señal con su propio usuario mediante `runuser`. Desde la estación de trabajo, confirma
  los permisos `0644` con `ansible fleet -m ansible.builtin.stat -a "path=/srv/site/message"` y solicita `/` en
  los puertos `8080` y `8081` de los tres hosts: las seis respuestas deben ser `north-ready`. Compara la identidad
  del proceso y los bytes del programa instalado con `consumer-identities.json`.'
debrief: Coordinaste la entrega, el acceso al archivo y la actualización entre consumidores con usuarios distintos,
  conservando las identidades de sus procesos.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el resultado en cada host administrado.
