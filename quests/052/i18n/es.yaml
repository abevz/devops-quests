diagnostics.consumer_identity: Cambió la identidad de la aplicación proporcionada. Compara proceso, usuario, privilegios,
  línea de órdenes y programa instalado con el registro original.
diagnostics.consumer_cache: La aplicación proporcionada sigue devolviendo otro mensaje. Un archivo legible no actualiza
  automáticamente la caché del proceso.
diagnostics.consumer_budget: Se agotó el tiempo de observación de la aplicación. Comprueba la disponibilidad de
  SSH y las respuestas HTTP de los hosts administrados.
diagnostics.consumer_observation: No se pudo observar la aplicación proporcionada. Comprueba su proceso, el registro
  de identidad, SSH y el punto de acceso HTTP.
