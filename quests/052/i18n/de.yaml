diagnostics.consumer_identity: Der gelieferte Prozess entspricht nicht mehr seiner eingefrorenen Identität; Neustart, geänderte Benutzerrechte, Befehl oder Programm können den Vertrag für erhaltene PID, Startzeit und Identität verletzen. [Ursache und Prüfung](guides#guide=ansible-10&section=handler-retained-principal)
diagnostics.consumer_cache: Der gelieferte Verbraucher liefert veraltete Inhalte; 0600 kann seinen Benutzer blockieren, und korrigierte Rechte allein aktualisieren den Cache nicht, wenn der SIGHUP-Handler nicht benachrichtigt oder das Signal nicht als dieser Benutzer gesendet wurde. [Ursache und Prüfung](guides#guide=ansible-10&section=handler-unprivileged-cache)
diagnostics.consumer_budget: Die SSH-Prozessbeobachtung überschritt das verbleibende Zeitbudget; ein nicht antwortender Host oder Wartezeit für frühere Verbraucherantworten kann zu wenig Zeit für alle Hosts lassen. [Ursache und Prüfung](guides#guide=ansible-10&section=handler-observation-budget)
diagnostics.consumer_observation: Der gelieferte Verbraucher konnte nicht beobachtet werden; Prozess oder eingefrorener Beleg fehlen möglicherweise, SSH/HTTP scheitert oder Namespace-/JSON-Beobachtungen sind nicht verfügbar beziehungsweise ungültig. [Ursache und Prüfung](guides#guide=ansible-10&section=handler-observer-inputs)
diagnostics.probe_0_2: Die kombinierte HTTP-/Verbraucherprüfung endete ohne benannte Diagnose; Arbeitsverzeichnis, Python-Start oder eine unterbrochene frühere HTTP-Gruppe haben möglicherweise Detailbeobachtungen verhindert. [Ursache und Prüfung](guides#guide=ansible-10&section=handler-observer-inputs)
