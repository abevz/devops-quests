title: Handlers und Berechtigungen
brief: 'Die Anwendungen der Flotte zeigen unterschiedliche Versionen der ausgelieferten Nachricht.


  Arbeite auf der Workstation in `~/quest` mit `inventory.ini`, `ansible.cfg`, `rollout.yml`, `consumer-contract.json`,
  `consumer-identities.json` und `provided-consumer.py`.


  **Anforderungen:**

  - Bewahre auf jedem verwalteten Host (`app1`, `app2`, `app3`) den Inhalt `north-ready` in `/srv/site/message`
  und liefere den Zugriffsmodus `0644`.

  - Beide laufenden Anwendungen müssen auf jedem verwalteten Host über HTTP `/` an den Ports `8080` und `8081` den
  Text `north-ready` liefern.

  - Bewahre die bereitgestellten Anwendungsidentitäten aus `consumer-identities.json`: Prozesse, Benutzer, Rechte,
  Befehlszeilen und Bytes des installierten Programms. Der Vertrag beschreibt Schnittstellen und Befugnisse des
  Operators.


  Die Prüfung beobachtet aktuelle Ergebnisse und Identitäten; sie belegt nicht den vollständigen Ausführungsverlauf.'
stages.0.brief: Beide laufenden Anwendungen stimmen mit der ausgelieferten Datei überein; ihre ursprünglichen Identitäten
  bleiben erhalten.
stages.0.objectives.0.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/message` den
  Inhalt `north-ready`.
stages.0.objectives.1.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) hat `/srv/site/message` den Modus
  `0644`.
stages.0.objectives.2.text: HTTP an den Ports `8080` und `8081` liefert auf jedem verwalteten Host (`app1`, `app2`,
  `app3`) `north-ready`; die bereitgestellten Anwendungsidentitäten bleiben unverändert.
hints.0.text: Eine gemeinsame Datei kann unabhängige Prozess-Caches versorgen. Zugriff und Aktualisierungsrechte
  gehören verschiedenen Benutzern.
hints.1.text: |-
  Vergleiche `rollout.yml`, `consumer-contract.json` und `provided-consumer.py`. Untersuche auf den verwalteten Hosts `/var/log/quest-banner-reader.log`, die Dateirechte und die Prozessidentität aus `consumer-identities.json`. Vergleiche beide HTTP-Antworten.

  Prüfe, welche Aufgaben in rollout.yml Handler benachrichtigen und welchem Benutzer der Prozess gehört, der in provided-consumer.py SIGHUP verarbeitet. Vergleiche den Zugriff beider Prozesse auf die gemeinsame Datei.
hints.2.text: |-
  Prüfe auf der Workstation mit `ansible fleet -m ansible.builtin.stat -a "path=/srv/site/message"` den Modus `0644` und frage `/` an den Ports `8080` und `8081` aller drei Hosts ab: Alle sechs Antworten müssen `north-ready` sein. Vergleiche Prozessidentität und installierte Programmbytes mit `consumer-identities.json`.

  Vergleiche auf jedem Host den bereitgestellten Datensatz für `banner-reader` mit beobachteter PID und Startzeit, UID, GID, Gruppen, Capabilities, Befehlsargumenten und SHA-256 des Programms.

  ```sh
  ansible fleet -m ansible.builtin.stat -a "path=/srv/site/message"
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    for port in 8080 8081; do
      printf "%s:%s " "$host" "$port"
      curl -fsS --max-time 3 "http://$host:$port/"
      printf '\n'
    done
    jq --arg station "app$n" '.[$station]["banner-reader"]' consumer-identities.json
    ssh -n -o BatchMode=yes -o ConnectTimeout=3 -p 2222 "root@$host" '
      set -eu
      pid=$(cat /run/quest-banner-reader.pid)
      printf "pid: %s\nstarttime: " "$pid"
      sed "s/^.*) //" "/proc/$pid/stat" | cut -d " " -f20
      grep -E "^(Uid|Gid|Groups|Cap(Inh|Prm|Eff|Bnd|Amb)):" "/proc/$pid/status"
      tr "\000" "\n" < "/proc/$pid/cmdline"
      sha256sum /usr/local/libexec/quest-banner-reader.py'
  done
  ```
debrief: Du hast Auslieferung, Dateizugriff und Aktualisierung für Verbraucher mit verschiedenen Benutzern koordiniert
  und ihre Prozessidentitäten bewahrt.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe das Ergebnis auf jedem verwalteten Host überprüft.
diagnostics.content_1: app1 lieferte nicht north-ready aus /srv/site/message; die Zustellung lief möglicherweise nicht auf diesem Host, die Datei wurde geändert oder SSH-/Namespace-Eingaben verhindern das Lesen. [Ursache und Prüfung](guides#guide=ansible-10&section=handler-shared-content)
diagnostics.mode_1: app1 meldete für /srv/site/message nicht Modus 644; die gelieferte Aufgabe erzwingt möglicherweise noch 0600 oder die SSH-/stat-Beobachtung schlug fehl. [Ursache und Prüfung](guides#guide=ansible-10&section=handler-file-access)
diagnostics.http_1: app1 lieferte auf Port 8080 nicht north-ready; die Datei kann korrekt sein, während der Reload-Handler nicht benachrichtigt wurde oder HTTP-Anfrage beziehungsweise Namespace-Auflösung fehlschlugen. [Ursache und Prüfung](guides#guide=ansible-10&section=handler-root-cache)
