title: Handlers und Berechtigungen
brief: 'Sie sind dem Betrieb SignalRail beigetreten. Korrigieren Sie sowohl die gelieferte Datei als auch
  den Live-relay-Prozess. Arbeiten Sie in ~/quest.. Bewahren Sie alle Änderungen in diesem Schulungsbereich
  auf.


  Eingänge in `~/quest`: `inventory.ini`, `ansible.cfg`, `prepare.yml`, `rollout.yml`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur die bereitgestellten Dateien,
  vorinstallierten Bilder und privaten Dienste. Alle Änderungen müssen innerhalb dieser Bucht bleiben.


  Anfängliche Erfolgskriterien: Alle drei /srv/site/message-Dateien enthalten north-ready, Modus 0644,
  und alle Live-HTTP-Banner geben north-ready zurück.'
stages.0.brief: 'Die Bannerdatei hat falsche Berechtigungen und der Dienst hat alte Daten zwischengespeichert.
  Korrigieren Sie den Modus 0644 und reload bei Änderung.


  Erfolgskriterien: Alle drei /srv/site/message-Dateien enthalten north-ready, Modus 0644, und alle Live-HTTP-Banner
  geben north-ready zurück.'
stages.0.objectives.0.text: Alle drei /srv/site/message-Dateien enthalten north-ready, Modus 0644, und
  alle Live-HTTP-Banner geben north-ready zurück.
hints.0.text: Überprüfen Sie sowohl die Datei als auch die Live-Prozessantwort.
hints.1.text: Berechtigungen und ein veralteter Prozess cache sind verschiedene Ursachen.
hints.2.text: Stellen Sie den Modus 0644 bereit und benachrichtigen Sie einen reload handler bei Änderung.
debrief: 'Der rollout hatte zwei Fehler: Dateiberechtigungen und einen veralteten Prozess cache. Sie haben
  beides behoben und die Remote-Status- und Live-Service-Antworten überprüft.'
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe das Ergebnis auf jedem verwalteten Host überprüft.
