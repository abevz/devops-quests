title: Handlers und Berechtigungen
brief: |-
  Die Flotte liefert nicht die angeforderte Routennachricht.

  Arbeite auf der Workstation in `~/quest` mit `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Anforderungen:**
  - Datei auf jedem verwalteten Host (`app1`, `app2`, `app3`):
    - Pfad: `/srv/site/message`.
    - Inhalt: `north-ready`.
    - Zugriffsmodus: `0644`.
  - Aktiver Dienst auf jedem verwalteten Host (`app1`, `app2`, `app3`):
    - HTTP: `8080`, `/`.
    - Antwort: `north-ready`.

  Die Prüfung beobachtet aktuelle Ergebnisse; sie belegt nicht die vollständige Ausführungshistorie.
stages.0.brief: Ausgelieferte Nachricht und aktiver Dienst müssen auf jedem verwalteten Host übereinstimmen.
stages.0.objectives.0.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/message`
  den Inhalt `north-ready`.
stages.0.objectives.1.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) hat `/srv/site/message`
  den Modus `0644`.
stages.0.objectives.2.text: HTTP auf Port `8080` liefert auf jedem verwalteten Host (`app1`, `app2`, `app3`)
  `north-ready`.
hints.0.text: Eine gespeicherte Nachricht und ein laufender Dienst können verschiedene Versionen derselben
  Daten zeigen.
hints.1.text: |-
  Überprüfen Sie sowohl die Datei als auch die Live-Prozessantwort. Berechtigungen und ein veralteter Prozess cache sind verschiedene Ursachen.

  Prüfen Sie Inventory und das bereitgestellte Playbook auf der Workstation:

  ```sh
  ansible-inventory -i inventory.ini --graph
  cat rollout.yml
  ```
hints.2.text: |-
  Stellen Sie den Modus 0644 bereit und benachrichtigen Sie einen reload handler bei Änderung.

  Prüfen Sie das Ergebnis in `~/quest` auf der Workstation:

  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/message'` — Zeigt `north-ready` von `app1`, `app2`, `app3`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/site/message'` — Zeigt `-rw-r--r--` auf jedem Host.
  - `for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done` — Zeigt `north-ready` von `app1`, `app2`, `app3`.
debrief: 'Der rollout hatte zwei Fehler: Dateiberechtigungen und einen veralteten Prozess cache. Sie haben
  beides behoben und die Remote-Status- und Live-Service-Antworten überprüft.'
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe das Ergebnis auf jedem verwalteten Host überprüft.
