title: Teilweise Wiederherstellung des Zustands
brief: |-
  Die Auslieferung ist unvollständig, und erhaltene Checkpoints beschreiben unterschiedliche abgeschlossene Arbeit. Schließe die Wiederherstellung ab, ohne neueren Fortschritt zu verlieren.

  Arbeite in `~/quest` auf der Workstation mit `main.tf` und `recovery-checkpoint.tfstate`.

  **Anforderungen:**

  - Output `north_id` behält seine ursprüngliche Provider-ID.
  - Auf der Workstation entsprechen `north.txt` und `south.txt` der vorgegebenen Konfiguration.
  - State verfolgt genau beide Routendateien und erhält die zwei aufgezeichneten Operationsidentitäten.
  - `recovery-plan.json` erhält bestehende Identitäten und erstellt nur die fehlende Datei; Checkpoint und Sicherung vor der Wiederherstellung bleiben gültig.
  - OpenTofu meldet keine ausstehenden Infrastrukturänderungen.
  - Erhalte den Checkpoint unverändert und alle aufgezeichneten abgeschlossenen Operationen aus dem neueren partiellen State.
  - `~/quest/before-recovery.tfstate` auf der Workstation stellt den vorgegebenen partiellen State vor der Wiederherstellung mit gleicher Lineage, Serial und IDs abgeschlossener Objekte dar.
  - `~/quest/recovery-plan.json` auf der Workstation enthält zwei Routendateieinträge: Die bestehende Datei bleibt unverändert, nur die fehlende wird erstellt. Beide Operationsbegleiter haben no-op-Einträge mit ihren aufgezeichneten IDs. Fremde Einträge sind unzulässig.
  - Die verwalteten Dateien liegen unter `~/quest/north.txt` und `~/quest/south.txt` auf der Workstation. Erhalte den bestehenden Inhalt und vervollständige die fehlende Datei gemäß der Konfiguration.

  Die Prüfungen untersuchen aktuellen State, erhaltene Artefakte und nicht angewandte Pläne; sie beweisen weder den exakt angewandten Plan noch den vollständigen Befehlsverlauf.
debrief: Der ältere Checkpoint enthielt die fehlende Bindung, aber keine später abgeschlossene Operation.
  Nur die Bindung wiederherzustellen erhielt beide Operationsidentitäten und die ursprüngliche Route;
  der gespeicherte Plan erstellte die fehlende Route ohne vorhandene Arbeit zu ersetzen.
stages.0.brief: Stelle die unvollständige Bindung unter Erhalt neuerer abgeschlossener Arbeit her.
hints.0.text: Konfiguration, älterer vollständiger Checkpoint und neuerer partieller State können einzeln
  gültig sein und dennoch unterschiedliche Arbeit beschreiben. Blindes Wiederholen oder vollständiges
  Zurückrollen kann eine Identität ändern.
hints.1.text: |-
  Vergleiche Konfiguration mit aktuellem und erhaltenem State-Inventar. Untersuche geplante Aktionen: Was steht nur im älteren Checkpoint, was nur im neueren State?

  ```sh
  tofu state list
  tofu state list -state=recovery-checkpoint.tfstate
  tofu plan -input=false -no-color
  ```
hints.2.text: |-
  Sichere den aktuellen partiellen State vor Änderungen und arbeite mit einer Kopie des vertrauenswürdigen Checkpoints. Stelle nur die fehlende Bindung im bestehenden lokalen State wieder her, ohne neuere Einträge zu überschreiben. Speichere und exportiere dann einen Plan, der aufgezeichnete Identitäten erhält und nur die fehlende Route erstellt. Prüfe Eingabe, Sicherungs-Lineage/Serial, Planaktionen und abschließende Konvergenz.

  ```sh
  tofu state list
  tofu output -raw north_id
  cat recovery-plan.json
  tofu plan -input=false -detailed-exitcode -no-color
  ```
phrases.0: Ich habe den Teilzustand überprüft, bevor ich einen apply erneut versucht habe.
phrases.1: Ich habe die bereits korrekt verwaltete Ressource beibehalten.
phrases.2: Ich habe den gespeicherten recovery plan und den endgültigen leeren plan überprüft.
stages.0.objectives.0.text: Output `north_id` behält seine ursprüngliche Provider-ID.
stages.0.objectives.1.text: Auf der Workstation entsprechen `north.txt` und `south.txt` der vorgegebenen
  Konfiguration.
stages.0.objectives.2.text: State verfolgt genau beide Routendateien und erhält die zwei aufgezeichneten
  Operationsidentitäten.
stages.0.objectives.3.text: '`recovery-plan.json` erhält bestehende Identitäten und erstellt nur die fehlende
  Datei; Checkpoint und Sicherung vor der Wiederherstellung bleiben gültig.'
stages.0.objectives.4.text: OpenTofu meldet keine ausstehenden Infrastrukturänderungen.
diagnostics.condition_0: Der Output fehlt möglicherweise oder verweist auf eine neu angelegte north Datei; erhalten Sie die ursprüngliche Provider-ID aus dem eingefrorenen Nachweis. [Ursache und Prüfung](guides#guide=terraform-3&section=recovery-original-north-output)
diagnostics.condition_1: Das vorhandene north.txt wurde möglicherweise geändert oder ist unlesbar; vergleichen Sie den Inhalt vor State-Änderungen mit der gelieferten Konfiguration. [Ursache und Prüfung](guides#guide=terraform-3&section=recovery-existing-north-content)
diagnostics.condition_2: Die gelieferte Konfiguration ergänzt south.txt ohne apply; die Datei fehlt oder weicht ab, bis der Wiederherstellungsplan die deklarierte Route anlegt. [Ursache und Prüfung](guides#guide=terraform-3&section=recovery-missing-south-content)
diagnostics.recovery_bindings: Ein erneutes apply kann guardian neu anlegen, der gesamte alte Checkpoint verwirft progress; stellen Sie nur die fehlende Bindung unter Erhalt beider Operations-IDs wieder her. Fehlgeschlagenes tofu show oder ungültiges JSON ergibt ebenfalls diese Diagnose. [Ursache und Prüfung](guides#guide=terraform-3&section=recovery-merge-old-binding-with-new-progress)
diagnostics.condition_3: Die übrigen State-Einträge zeigen möglicherweise auf andere Dateien oder doppelte Routen; nach Erhalt beider Companions ist je ein managed local_file für north.txt und south.txt erforderlich. [Ursache und Prüfung](guides#guide=terraform-3&section=recovery-two-managed-route-targets)
diagnostics.recovery_binding_plan: Fehlendes/veraltetes recovery-plan.json oder ein Plan mit ersetztem Companion erhält abgeschlossene Arbeit nicht; exportieren Sie nach Bindungswiederherstellung und halten Sie beide Companions mit ursprünglichen IDs auf no-op. [Ursache und Prüfung](guides#guide=terraform-3&section=recovery-plan-preserves-companion-identities)
diagnostics.condition_4: Ein zusätzlicher Routeneintrag verletzt das Inventar des gespeicherten Plans; das Artefakt beschreibt zwei Routen und zwei erhaltene Operations-Companions. [Ursache und Prüfung](guides#guide=terraform-3&section=recovery-plan-route-inventory)
diagnostics.condition_5: Der gespeicherte Plan ersetzt/ändert möglicherweise north.txt oder verwendet eine andere ID; erhalten Sie den bestehenden Routeneintrag als no-op mit eingefrorener Provider-Identität. [Ursache und Prüfung](guides#guide=terraform-3&section=recovery-plan-existing-route-no-op)
diagnostics.condition_6: Das Artefakt wurde möglicherweise nach apply exportiert, sodass south.txt no-op ist, oder die Route fehlt; erhalten Sie den vor apply gespeicherten Plan zum Anlegen von south.txt. [Ursache und Prüfung](guides#guide=terraform-3&section=recovery-plan-only-missing-route-create)
diagnostics.recovery_backup: Überschreiben des vertrauenswürdigen Checkpoints oder ein Backup nach Wiederherstellung verliert Nachweise; erhalten Sie Checkpoint-Bytes und den neueren Teil-State mit ursprünglicher lineage, serial und Objekt-IDs. [Ursache und Prüfung](guides#guide=terraform-3&section=recovery-trusted-checkpoint-and-partial-backup)
diagnostics.condition_7: Nicht angewandte Konfiguration, Datei-Drift oder Planfehler lassen den Abschlussplan ungleich null enden; prüfen Sie vorgeschlagene Änderungen nach Anwendung des erhaltenen Wiederherstellungsplans. [Ursache und Prüfung](guides#guide=terraform-3&section=recovery-final-converged-plan)
diagnostics.probe_0_2: Der State-Observer kann vor Bindungsprüfung scheitern, etwa beim Start von tofu oder Helper-Imports; normaler Fehlercode/ungültiges tofu JSON ergibt recovery_bindings. [Ursache und Prüfung](guides#guide=terraform-3&section=recovery-state-helper-startup)
diagnostics.probe_0_3: Der Plan-Observer kann vor einem spezifischen Marker bei Imports oder unerwarteter Artefaktstruktur scheitern; normal fehlendes/ungültiges recovery-plan.json ergibt recovery_binding_plan. [Ursache und Prüfung](guides#guide=terraform-3&section=recovery-plan-helper-startup)
