title: Teilweise Wiederherstellung des Zustands
brief: |-
  Die angeforderte Auslieferung ist unvollständig.

  Arbeite auf der Workstation in `~/quest` mit `main.tf`.

  **Anforderungen:**
  - Root-Ausgaben:
    - Ausgabename: `north_id`.
    - Die Ausgabe `north_id` behält die ursprünglich vom Provider vergebene Ressourcen-ID bei.
  - Dateien auf der Workstation:
    - `~/quest/north.txt`: `north-71`.
    - `~/quest/south.txt`: `south-71`.
  - OpenTofu-State:
    - OpenTofu verwaltet genau die zwei in der bereitgestellten Konfiguration definierten Dateien.
  - Gespeicherter Wiederherstellungsplan auf der Workstation:
    - Pfad: `~/quest/recovery-plan.json`.
    - Die Workstation-Datei `recovery-plan.json` enthält genau zwei Ressourceneinträge: die vorhandene verwaltete Datei bleibt unverändert, nur die fehlende verwaltete Datei wird erstellt.
  - Infrastrukturkonvergenz:
    - Keine ausstehenden Infrastrukturänderungen; Exit-Code des detaillierten Plans `0`.

  Die Prüfung untersucht aktuellen State und gespeicherte Plandaten; sie beweist nicht, dass genau dieser Plan angewendet wurde.
debrief: Die gespeicherte north-ID, Dateiinhalte, Zustandsadressen und der gespeicherte Wiederherstellungsplan
  entsprechen den Prüfungen; der abschließende Plan enthält keine Änderungen.
stages.0.brief: Vervollständige die Auslieferung unter Erhalt der aufgezeichneten Identität.
hints.0.text: Ein unterbrochener apply kann gültige Ressourcen belassen, die bereits im Status aufgezeichnet
  wurden.
hints.1.text: |-
  Das unterbrochene Apply hat north bereits erfasst; south muss noch erstellt werden.

  Prüfen Sie die bereitgestellte Konfiguration und aktuelle Beobachtungen auf der Workstation:

  ```sh
  cat main.tf
  tofu state list
  ls -l north.txt south.txt
  ```
hints.2.text: |-
  Wende den gespeicherten Plan mit north no-op und south create an.
  Speichere den binären Plan und exportiere ihn mit tofu show -json in das angeforderte JSON-Artefakt.

  Prüfen Sie das Ergebnis in `~/quest` auf der Workstation:

  - `cat north.txt south.txt` — Zeigt jeweils `north-71` und `south-71`.
  - `tofu output -raw north_id; printf '\n'; cat /run/dq/facts/0/original-north-id; tofu show -no-color` — Die IDs stimmen überein; der State enthält genau `local_file.north` und `local_file.south`.
  - `jq -r '.resource_changes[] | .address + " " + (.change.actions | join(","))' recovery-plan.json; tofu plan -input=false -detailed-exitcode -no-color` — Der gespeicherte Plan hat zwei Einträge: `no-op` für `local_file.north`, `create` für `local_file.south`; die aktuelle Planung endet mit `0`.
phrases.0: Ich habe den Teilzustand überprüft, bevor ich einen apply erneut versucht habe.
phrases.1: Ich habe die bereits korrekt verwaltete Ressource beibehalten.
phrases.2: Ich habe den gespeicherten recovery plan und den endgültigen leeren plan überprüft.
diagnostics.condition_0: /run/dq/facts/0/original-north-id darf nicht leer sein und tofu output -raw north_id
  muss dem Inhalt entsprechen.
diagnostics.condition_1: north.txt muss north-71 entsprechen.
diagnostics.condition_2: south.txt muss south-71 entsprechen.
diagnostics.condition_3: tofu state list muss {local_file.north, local_file.south} entsprechen.
diagnostics.condition_4: recovery-plan.json resource_changes length muss 2 entsprechen.
diagnostics.condition_5: recovery-plan.json muss einen Eintrag für local_file.north mit actions ["no-op"]
  enthalten.
diagnostics.condition_6: recovery-plan.json muss einen Eintrag für local_file.south mit actions ["create"]
  enthalten.
diagnostics.condition_7: Der OpenTofu-Plan mit detailed-exitcode muss mit Code 0 enden.
stages.0.objectives.0.text: Die Ausgabe `north_id` behält die ursprünglich vom Provider vergebene Ressourcen-ID
  bei.
stages.0.objectives.1.text: 'Auf der Workstation: `north.txt` enthält `north-71`; `south.txt` enthält
  `south-71`.'
stages.0.objectives.2.text: OpenTofu verwaltet genau die zwei in der bereitgestellten Konfiguration definierten
  Dateien.
stages.0.objectives.3.text: 'Die Workstation-Datei `recovery-plan.json` enthält genau zwei Ressourceneinträge:
  die vorhandene verwaltete Datei bleibt unverändert, nur die fehlende verwaltete Datei wird erstellt.'
stages.0.objectives.4.text: OpenTofu meldet keine ausstehenden Infrastrukturänderungen.
