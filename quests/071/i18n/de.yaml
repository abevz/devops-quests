title: Teilweise Wiederherstellung des Zustands
brief: 'Bei einem unterbrochenen local-Rollout wurde north.txt erstellt und im Status aufgezeichnet, jedoch
  nie south.txt erstellt. Die Konfiguration beschreibt nun beides. Überprüfen Sie den Status und speichern
  Sie recovery-plan.json, bevor Sie sich bewerben. Erstellen Sie nur die fehlende Ressource south und
  behalten Sie die Ressource north provider ID und den Inhalt bei. Es ist keine Statuslöschung, import
  oder Cloud-Zugriff erforderlich. Verwenden Sie das mitgelieferte offline local provider. Original north
  identity ist unter /run/dq/facts/0/. eingefroren


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `main.tf`, `original-north-id`, `north.txt`,
  `south.txt`, `recovery-plan.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Anfängliche Erfolgskriterien: Nur south wird erstellt, north behält seinen eingefrorenen provider ID,
  beide Dateien sind korrekt und der endgültige plan ist leer.'
debrief: Der unterbrochene Rollout wurde abgeglichen, ohne die bereits fehlerfreie Ressource zu ersetzen.
stages.0.brief: 'Erfolgskriterien: Nur south wird erstellt, north behält seinen eingefrorenen provider
  ID, beide Dateien sind korrekt und der endgültige plan ist leer.'
stages.0.objectives.0.text: Es wird nur south erstellt, north behält seinen eingefrorenen provider ID
  bei, beide Dateien sind korrekt und der endgültige plan ist leer.
hints.0.text: Ein unterbrochener apply kann gültige Ressourcen belassen, die bereits im Status aufgezeichnet
  wurden.
hints.1.text: Überprüfen Sie no-op und erstellen Sie es separat, bevor Sie die Wiederherstellung genehmigen.
hints.2.text: Anwenden des gespeicherten plan mit north no-op und south erstellen; Überprüfen Sie identity
  und den Inhalt.
phrases.0: Ich habe den Teilzustand überprüft, bevor ich einen apply erneut versucht habe.
phrases.1: Ich habe die bereits korrekt verwaltete Ressource beibehalten.
phrases.2: Ich habe den gespeicherten recovery plan und den endgültigen leeren plan überprüft.
