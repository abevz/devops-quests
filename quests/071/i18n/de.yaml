title: Teilweise Wiederherstellung des Zustands
brief: |-
  Die Auslieferung ist unvollständig, und erhaltene Checkpoints beschreiben unterschiedliche abgeschlossene Arbeit. Schließe die Wiederherstellung ab, ohne neueren Fortschritt zu verlieren.

  Arbeite in `~/quest` auf der Workstation mit `main.tf` und `recovery-checkpoint.tfstate`.

  **Anforderungen:**

  - Output `north_id` behält seine ursprüngliche Provider-ID.
  - Auf der Workstation entsprechen `north.txt` und `south.txt` der vorgegebenen Konfiguration.
  - State verfolgt genau beide Routendateien und erhält die zwei aufgezeichneten Operationsidentitäten.
  - `recovery-plan.json` erhält bestehende Identitäten und erstellt nur die fehlende Datei; Checkpoint und Sicherung vor der Wiederherstellung bleiben gültig.
  - OpenTofu meldet keine ausstehenden Infrastrukturänderungen.
  - Erhalte den Checkpoint unverändert und alle aufgezeichneten abgeschlossenen Operationen aus dem neueren partiellen State.
  - `~/quest/before-recovery.tfstate` auf der Workstation stellt den vorgegebenen partiellen State vor der Wiederherstellung mit gleicher Lineage, Serial und IDs abgeschlossener Objekte dar.
  - `~/quest/recovery-plan.json` auf der Workstation enthält zwei Routendateieinträge: Die bestehende Datei bleibt unverändert, nur die fehlende wird erstellt. Beide Operationsbegleiter haben no-op-Einträge mit ihren aufgezeichneten IDs. Fremde Einträge sind unzulässig.
  - Die verwalteten Dateien liegen unter `~/quest/north.txt` und `~/quest/south.txt` auf der Workstation. Erhalte den bestehenden Inhalt und vervollständige die fehlende Datei gemäß der Konfiguration.

  Die Prüfungen untersuchen aktuellen State, erhaltene Artefakte und nicht angewandte Pläne; sie beweisen weder den exakt angewandten Plan noch den vollständigen Befehlsverlauf.
debrief: Der ältere Checkpoint enthielt die fehlende Bindung, aber keine später abgeschlossene Operation.
  Nur die Bindung wiederherzustellen erhielt beide Operationsidentitäten und die ursprüngliche Route;
  der gespeicherte Plan erstellte die fehlende Route ohne vorhandene Arbeit zu ersetzen.
stages.0.brief: Stelle die unvollständige Bindung unter Erhalt neuerer abgeschlossener Arbeit her.
hints.0.text: Konfiguration, älterer vollständiger Checkpoint und neuerer partieller State können einzeln
  gültig sein und dennoch unterschiedliche Arbeit beschreiben. Blindes Wiederholen oder vollständiges
  Zurückrollen kann eine Identität ändern.
hints.1.text: |-
  Vergleiche Konfiguration mit aktuellem und erhaltenem State-Inventar. Untersuche geplante Aktionen: Was steht nur im älteren Checkpoint, was nur im neueren State?

  ```sh
  tofu state list
  tofu state list -state=recovery-checkpoint.tfstate
  tofu plan -input=false -no-color
  ```
hints.2.text: |-
  Sichere den aktuellen partiellen State vor Änderungen und arbeite mit einer Kopie des vertrauenswürdigen Checkpoints. Stelle nur die fehlende Bindung im bestehenden lokalen State wieder her, ohne neuere Einträge zu überschreiben. Speichere und exportiere dann einen Plan, der aufgezeichnete Identitäten erhält und nur die fehlende Route erstellt. Prüfe Eingabe, Sicherungs-Lineage/Serial, Planaktionen und abschließende Konvergenz.

  ```sh
  tofu state list
  tofu output -raw north_id
  cat recovery-plan.json
  tofu plan -input=false -detailed-exitcode -no-color
  ```
phrases.0: Ich habe den Teilzustand überprüft, bevor ich einen apply erneut versucht habe.
phrases.1: Ich habe die bereits korrekt verwaltete Ressource beibehalten.
phrases.2: Ich habe den gespeicherten recovery plan und den endgültigen leeren plan überprüft.
diagnostics.condition_0: /run/dq/facts/0/original-north-id darf nicht leer sein und tofu output -raw north_id
  muss dem Inhalt entsprechen.
diagnostics.condition_1: north.txt muss north-71 entsprechen.
diagnostics.condition_2: south.txt muss south-71 entsprechen.
diagnostics.condition_3: State verfolgt genau beide Routendateien und erhält die zwei aufgezeichneten
  Operationsidentitäten.
diagnostics.condition_4: '`~/quest/recovery-plan.json` auf der Workstation enthält zwei Routendateieinträge:
  Die bestehende Datei bleibt unverändert, nur die fehlende wird erstellt. Beide Operationsbegleiter haben
  no-op-Einträge mit ihren aufgezeichneten IDs. Fremde Einträge sind unzulässig.'
diagnostics.condition_5: recovery-plan.json muss die ursprüngliche Ressource north.txt mit ihrer ursprünglichen
  Provider-ID unverändert lassen.
diagnostics.condition_6: recovery-plan.json muss die fehlende Ressource south.txt erstellen.
diagnostics.condition_7: Der OpenTofu-Plan mit detailed-exitcode muss mit Code 0 enden.
