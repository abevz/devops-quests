title: Teilweise Wiederherstellung des Zustands
brief: 'Arbeite in `~/quest` und lies `main.tf` und `original-north-id`. Ein unterbrochenes Anwenden erstellte die north-Datei
  und ihren Zustandseintrag, aber nicht south. Die ursprüngliche north-ID ist auch unter `/run/dq/facts/0/original-north-id`
  unveränderlich hinterlegt. Nutze den bereitgestellten Offline-Provider. Die verlinkte Anleitung führt in den OpenTofu-Zustand
  ein; die Hinweise erklären no-op- und create-Aktionen.


  Speichere einen binären Wiederherstellungsplan und exportiere ihn mit `tofu show -json` nach `recovery-plan.json`, dann
  wende ihn an. Prüfe, dass die Root-Ausgabe `north_id` der hinterlegten ID entspricht, `north.txt` `north-71` und `south.txt`
  `south-71` enthält und der Zustand genau `local_file.north` und `local_file.south` enthält. Der gespeicherte JSON-Plan muss
  genau zwei Ressourcenänderungen haben: north mit Aktionen `["no-op"]` und south mit `["create"]`. Zum Schluss muss `tofu
  plan -input=false -detailed-exitcode -no-color` mit Code 0 enden (keine Änderungen). Die Prüfung untersucht Zustand und
  gespeichertes JSON, nicht ob genau dieser Plan angewendet wurde. Arbeite nur in der Übungsumgebung.'
debrief: Die gespeicherte north-ID, Dateiinhalte, Zustandsadressen und der gespeicherte Wiederherstellungsplan entsprechen
  den Prüfungen; der abschließende Plan enthält keine Änderungen.
stages.0.brief: Die hinterlegte north-ID, beide Dateien, die genauen Zustandsadressen und der gespeicherte Plan stimmen mit
  der Aufgabe überein; der abschließende Plan endet mit Code 0.
stages.0.objectives.0.text: Die hinterlegte north-ID, beide Dateien, die genauen Zustandsadressen und der gespeicherte Plan
  stimmen mit der Aufgabe überein; der abschließende Plan endet mit Code 0.
hints.0.text: Ein unterbrochener apply kann gültige Ressourcen belassen, die bereits im Status aufgezeichnet wurden.
hints.1.text: Überprüfen Sie no-op und erstellen Sie es separat, bevor Sie die Wiederherstellung genehmigen.
hints.2.text: Anwenden des gespeicherten plan mit north no-op und south erstellen; Überprüfen Sie identity und den Inhalt.
phrases.0: Ich habe den Teilzustand überprüft, bevor ich einen apply erneut versucht habe.
phrases.1: Ich habe die bereits korrekt verwaltete Ressource beibehalten.
phrases.2: Ich habe den gespeicherten recovery plan und den endgültigen leeren plan überprüft.
diagnostics.condition_0: /run/dq/facts/0/original-north-id darf nicht leer sein und tofu output -raw north_id muss dem Inhalt
  entsprechen.
diagnostics.condition_1: north.txt muss north-71 entsprechen.
diagnostics.condition_2: south.txt muss south-71 entsprechen.
diagnostics.condition_3: tofu state list muss {local_file.north, local_file.south} entsprechen.
diagnostics.condition_4: recovery-plan.json resource_changes length muss 2 entsprechen.
diagnostics.condition_5: recovery-plan.json muss einen Eintrag für local_file.north mit actions ["no-op"] enthalten.
diagnostics.condition_6: recovery-plan.json muss einen Eintrag für local_file.south mit actions ["create"] enthalten.
diagnostics.condition_7: Der OpenTofu-Plan mit detailed-exitcode muss mit Code 0 enden.
