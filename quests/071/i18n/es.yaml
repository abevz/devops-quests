title: Recuperación parcial del estado
brief: |
  La entrega solicitada está incompleta.

  Trabaja en la workstation en `~/quest` con `main.tf`.

  **Requisitos:**
  - Salidas raíz:
    - Nombre de salida: `north_id`.
    - Comprobante correspondiente en la workstation: `/run/dq/facts/0/original-north-id`.
  - Archivos en la workstation:
    - `~/quest/north.txt`: `north-71`.
    - `~/quest/south.txt`: `south-71`.
  - Estado de OpenTofu:
    - Inventario exacto: `local_file.north`, `local_file.south`.
  - Plan de recuperación guardado en la workstation:
    - Ruta: `~/quest/recovery-plan.json`.
    - Exactamente dos entradas: `local_file.north` — `no-op`; `local_file.south` — `create`.
  - Convergencia de infraestructura:
    - Sin cambios de infraestructura pendientes; código de salida del plan detallado `0`.

  **Verifica antes de Check & finish:**
  - `cat north.txt south.txt` — Muestra `north-71` y `south-71`, respectivamente.
  - `tofu output -raw north_id; printf '\n'; cat /run/dq/facts/0/original-north-id; tofu show -no-color` — Los ID coinciden; el estado contiene exactamente `local_file.north` y `local_file.south`.
  - `jq -r '.resource_changes[] | .address + " " + (.change.actions | join(","))' recovery-plan.json; tofu plan -input=false -detailed-exitcode -no-color` — El plan guardado tiene dos entradas: `no-op` para `local_file.north`, `create` para `local_file.south`; el plan actual termina con `0`.

  La comprobación examina el estado actual y los datos del plan guardado; no demuestra que se aplicara ese plan exacto.
debrief: El ID registrado de north, los archivos, las direcciones de estado y el plan de recuperación guardado coinciden
  con las comprobaciones, y el plan final no tiene cambios.
stages.0.brief: Completa la entrega conservando la identidad registrada.
hints.0.text: Un apply interrumpido puede dejar recursos válidos ya registrados en el estado.
hints.1.text: El apply interrumpido ya registró north; aún debe crearse south.
hints.2.text: |-
  Aplica el plan guardado con north no-op y south create.
  Guarda el plan binario y expórtalo con tofu show -json al artefacto JSON solicitado.
phrases.0: Inspeccioné el estado parcial antes de volver a intentar un apply.
phrases.1: Conservé el recurso que ya estaba administrado correctamente.
phrases.2: Verifiqué el recovery plan guardado y el plan vacío final.
diagnostics.condition_0: /run/dq/facts/0/original-north-id no debe estar vacío y tofu output -raw north_id debe
  ser igual a su contenido.
diagnostics.condition_1: north.txt debe ser igual a north-71.
diagnostics.condition_2: south.txt debe ser igual a south-71.
diagnostics.condition_3: tofu state list debe ser igual a {local_file.north, local_file.south}.
diagnostics.condition_4: recovery-plan.json resource_changes length debe ser igual a 2.
diagnostics.condition_5: recovery-plan.json debe contener una entrada para local_file.north con actions ["no-op"].
diagnostics.condition_6: recovery-plan.json debe contener una entrada para local_file.south con actions ["create"].
diagnostics.condition_7: El plan de OpenTofu con detailed-exitcode debe terminar con código 0.
stages.0.objectives.0.text: La salida `north_id` coincide con `/run/dq/facts/0/original-north-id` en la workstation.
stages.0.objectives.1.text: En la workstation, `north.txt` contiene `north-71`; `south.txt` contiene `south-71`.
stages.0.objectives.2.text: El estado de OpenTofu contiene exactamente `local_file.north`, `local_file.south`.
stages.0.objectives.3.text: 'El archivo `recovery-plan.json` en la workstation registra exactamente dos entradas
  de recurso: `no-op` para `local_file.north` y `create` para `local_file.south`.'
stages.0.objectives.4.text: OpenTofu no informa cambios de infraestructura pendientes.
