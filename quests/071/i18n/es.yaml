title: Recuperación parcial del estado
brief: |-
  La entrega está incompleta y los checkpoints conservados describen distintos conjuntos de trabajo completado. Completa la recuperación sin descartar progreso más reciente.

  Trabaja en `~/quest` en la estación con `main.tf` y `recovery-checkpoint.tfstate`.

  **Requisitos:**

  - El output `north_id` conserva su ID original del proveedor.
  - En la estación, `north.txt` y `south.txt` coinciden con la configuración suministrada.
  - State registra exactamente ambos archivos de rutas y conserva las dos identidades de operaciones registradas.
  - `recovery-plan.json` conserva identidades existentes y crea solo el archivo ausente; el checkpoint y la copia previa siguen siendo válidos.
  - OpenTofu no indica cambios de infraestructura pendientes.
  - Conserva el checkpoint sin cambios y todas las operaciones completadas registradas en el state parcial más reciente.
  - `~/quest/before-recovery.tfstate` en la estación representa el state parcial suministrado antes de recuperar, con el mismo lineage, serial e ID de objetos completados.
  - `~/quest/recovery-plan.json` en la estación contiene dos entradas de archivos de rutas: el existente no cambia y solo se crea el ausente. Ambos acompañantes de operaciones tienen entradas no-op con sus ID registrados. No se permiten entradas ajenas.
  - Los archivos administrados están en `~/quest/north.txt` y `~/quest/south.txt` en la estación. Conserva el contenido existente y completa el ausente según la configuración.

  Las comprobaciones inspeccionan state actual, artefactos conservados y planes sin aplicar; no demuestran qué plan exacto se aplicó ni todo el historial de comandos.
debrief: El checkpoint antiguo contenía el binding ausente, pero no una operación posterior completada.
  Recuperar solo ese binding conservó ambas identidades y la ruta original; el plan guardado creó la ruta
  ausente sin sustituir trabajo existente.
stages.0.brief: Recupera el binding incompleto conservando trabajo posterior completado.
hints.0.text: La configuración, un checkpoint completo antiguo y un state parcial nuevo pueden ser válidos
  por separado y describir trabajos diferentes. Reintentar a ciegas o restaurar todo el checkpoint puede
  cambiar una identidad.
hints.1.text: |-
  Compara la configuración con los inventarios de state actual y conservado. Revisa las acciones propuestas e identifica qué existe solo en el checkpoint antiguo y qué solo en el state nuevo.

  Compara lineage, serial e ID de recursos en el estado actual y el punto de control. Busca en el enunciado el requisito de conservar el estado parcial original e identifica qué vínculo falta solo en el estado actual.

  ```sh
  cat main.tf
  tofu state list
  tofu state list -state=recovery-checkpoint.tfstate
  jq '{file:input_filename,lineage,serial,resources:[.resources[] | {module,type,name,ids:[.instances[].attributes.id]}]}' terraform.tfstate recovery-checkpoint.tfstate
  tofu plan -input=false -no-color
  ```
hints.2.text: |-
  Verifica la entrada, lineage/serial de la copia, acciones y convergencia final.

  ```sh
  tofu state list
  tofu output -raw north_id
  jq '[.resource_changes[] | {address,mode,type,actions:.change.actions,before_id:.change.before.id,after_id:.change.after.id,before_file:.change.before.filename,after_file:.change.after.filename}]' recovery-plan.json
  jq '{file:input_filename,lineage,serial,resources:[.resources[] | {module,type,name,ids:[.instances[].attributes.id]}]}' before-recovery.tfstate recovery-checkpoint.tfstate
  tofu plan -input=false -detailed-exitcode -no-color
  ```

  Compara `before-recovery.tfstate` con los valores observados del estado parcial antes de recuperar. El punto de control conservado es un registro anterior separado. En `recovery-plan.json`, el archivo norte existente y las dos identidades de operación deben mostrar `no-op`, y el archivo sur ausente `create`. Los dos ID de operación deben coincidir con sus valores registrados antes y después en el plan.
phrases.0: Inspeccioné el estado parcial antes de volver a intentar un apply.
phrases.1: Conservé el recurso que ya estaba administrado correctamente.
phrases.2: Verifiqué el recovery plan guardado y el plan vacío final.
stages.0.objectives.0.text: El output `north_id` conserva su ID original del proveedor.
stages.0.objectives.1.text: En la estación, `north.txt` y `south.txt` coinciden con la configuración suministrada.
stages.0.objectives.2.text: State registra exactamente ambos archivos de rutas y conserva las dos identidades
  de operaciones registradas.
stages.0.objectives.3.text: '`recovery-plan.json` conserva identidades existentes y crea solo el archivo
  ausente; el checkpoint y la copia previa siguen siendo válidos.'
stages.0.objectives.4.text: OpenTofu no indica cambios de infraestructura pendientes.
diagnostics.condition_0: Output puede faltar o referirse a archivo north recreado; conserve provider ID original del registro fijado. [Causa y comprobación](guides#guide=terraform-3&section=recovery-original-north-output)
diagnostics.condition_1: El north.txt existente puede haberse editado o ser ilegible; compare contenido con configuración suministrada antes de cambiar state. [Causa y comprobación](guides#guide=terraform-3&section=recovery-existing-north-content)
diagnostics.condition_2: La configuración añade south.txt sin apply; puede faltar o diferir hasta que el plan de recuperación cree la ruta declarada. [Causa y comprobación](guides#guide=terraform-3&section=recovery-missing-south-content)
diagnostics.recovery_bindings: Repetir apply puede recrear guardian y restaurar checkpoint completo pierde progress; restaure solo vínculo ausente conservando ambos ID de operaciones. Fallo tofu show o JSON inválido también usa este diagnóstico. [Causa y comprobación](guides#guide=terraform-3&section=recovery-merge-old-binding-with-new-progress)
diagnostics.condition_3: Las entradas restantes pueden apuntar a otros archivos o duplicar ruta; tras conservar dos companions exija un managed local_file por north.txt y south.txt. [Causa y comprobación](guides#guide=terraform-3&section=recovery-two-managed-route-targets)
diagnostics.recovery_binding_plan: Un recovery-plan.json ausente/antiguo o plan que reemplaza companion no conserva trabajo; exporte plan tras restaurar vínculo y mantenga ambos companions no-op con ID originales. [Causa y comprobación](guides#guide=terraform-3&section=recovery-plan-preserves-companion-identities)
diagnostics.condition_4: Una entrada de ruta adicional incumple inventario del plan guardado; el artefacto describe dos rutas y dos companions de operaciones conservados. [Causa y comprobación](guides#guide=terraform-3&section=recovery-plan-route-inventory)
diagnostics.condition_5: El plan guardado puede reemplazar/modificar north.txt o usar otro ID; mantenga entrada existente no-op con identidad provider fijada. [Causa y comprobación](guides#guide=terraform-3&section=recovery-plan-existing-route-no-op)
diagnostics.condition_6: El artefacto puede exportarse después de apply, dejando south.txt no-op, u omitir ruta; conserve plan previo a apply que crea south.txt. [Causa y comprobación](guides#guide=terraform-3&section=recovery-plan-only-missing-route-create)
diagnostics.recovery_backup: Sobrescribir checkpoint confiable o copiar state después de recuperación pierde evidencia; conserve bytes checkpoint y state parcial reciente con lineage, serial e ID originales. [Causa y comprobación](guides#guide=terraform-3&section=recovery-trusted-checkpoint-and-partial-backup)
diagnostics.condition_7: Configuración sin aplicar, drift o error plan dejan código final distinto de cero; revise cambios propuestos tras aplicar plan de recuperación conservado. [Causa y comprobación](guides#guide=terraform-3&section=recovery-final-converged-plan)
diagnostics.probe_0_2: El observer state puede fallar antes de vínculos, por ejemplo al iniciar tofu o importar helper; código no cero/JSON inválido ordinario usa recovery_bindings. [Causa y comprobación](guides#guide=terraform-3&section=recovery-state-helper-startup)
diagnostics.probe_0_3: El observer plan puede fallar sin marcador específico por imports o estructura inesperada; recovery-plan.json ausente/inválido ordinario usa recovery_binding_plan. [Causa y comprobación](guides#guide=terraform-3&section=recovery-plan-helper-startup)
