title: Recuperación parcial del estado
brief: |-
  La entrega está incompleta y los checkpoints conservados describen distintos conjuntos de trabajo completado. Completa la recuperación sin descartar progreso más reciente.

  Trabaja en `~/quest` en la estación con `main.tf` y `recovery-checkpoint.tfstate`.

  **Requisitos:**

  - El output `north_id` conserva su ID original del proveedor.
  - En la estación, `north.txt` y `south.txt` coinciden con la configuración suministrada.
  - State registra exactamente ambos archivos de rutas y conserva las dos identidades de operaciones registradas.
  - `recovery-plan.json` conserva identidades existentes y crea solo el archivo ausente; el checkpoint y la copia previa siguen siendo válidos.
  - OpenTofu no indica cambios de infraestructura pendientes.
  - Conserva el checkpoint sin cambios y todas las operaciones completadas registradas en el state parcial más reciente.
  - `~/quest/before-recovery.tfstate` en la estación representa el state parcial suministrado antes de recuperar, con el mismo lineage, serial e ID de objetos completados.
  - `~/quest/recovery-plan.json` en la estación contiene dos entradas de archivos de rutas: el existente no cambia y solo se crea el ausente. Ambos acompañantes de operaciones tienen entradas no-op con sus ID registrados. No se permiten entradas ajenas.
  - Los archivos administrados están en `~/quest/north.txt` y `~/quest/south.txt` en la estación. Conserva el contenido existente y completa el ausente según la configuración.

  Las comprobaciones inspeccionan state actual, artefactos conservados y planes sin aplicar; no demuestran qué plan exacto se aplicó ni todo el historial de comandos.
debrief: El checkpoint antiguo contenía el binding ausente, pero no una operación posterior completada.
  Recuperar solo ese binding conservó ambas identidades y la ruta original; el plan guardado creó la ruta
  ausente sin sustituir trabajo existente.
stages.0.brief: Recupera el binding incompleto conservando trabajo posterior completado.
hints.0.text: La configuración, un checkpoint completo antiguo y un state parcial nuevo pueden ser válidos
  por separado y describir trabajos diferentes. Reintentar a ciegas o restaurar todo el checkpoint puede
  cambiar una identidad.
hints.1.text: |-
  Compara la configuración con los inventarios de state actual y conservado. Revisa las acciones propuestas e identifica qué existe solo en el checkpoint antiguo y qué solo en el state nuevo.

  ```sh
  tofu state list
  tofu state list -state=recovery-checkpoint.tfstate
  tofu plan -input=false -no-color
  ```
hints.2.text: |-
  Captura el state parcial actual antes de modificarlo y trabaja con una copia del checkpoint de confianza. Restaura solo el binding ausente en el state local existente sin sobrescribir registros posteriores. Guarda y exporta un plan que conserve las identidades y cree solo la ruta ausente. Verifica la entrada, lineage/serial de la copia, acciones y convergencia final.

  ```sh
  tofu state list
  tofu output -raw north_id
  cat recovery-plan.json
  tofu plan -input=false -detailed-exitcode -no-color
  ```
phrases.0: Inspeccioné el estado parcial antes de volver a intentar un apply.
phrases.1: Conservé el recurso que ya estaba administrado correctamente.
phrases.2: Verifiqué el recovery plan guardado y el plan vacío final.
