title: Recuperación parcial del estado
brief: |-
  La entrega solicitada está incompleta.

  Trabaja en la workstation en `~/quest` con `main.tf`.

  **Requisitos:**
  - Salidas raíz:
    - Nombre de salida: `north_id`.
    - La salida `north_id` conserva el ID del recurso asignado originalmente por el proveedor.
  - Archivos en la workstation:
    - `~/quest/north.txt`: `north-71`.
    - `~/quest/south.txt`: `south-71`.
  - Estado de OpenTofu:
    - OpenTofu registra exactamente los dos archivos gestionados definidos en la configuración suministrada.
  - Plan de recuperación guardado en la workstation:
    - Ruta: `~/quest/recovery-plan.json`.
    - El archivo `recovery-plan.json` de la workstation registra exactamente dos entradas de recurso: el archivo gestionado existente no cambia y solo se crea el archivo gestionado que falta.
  - Convergencia de infraestructura:
    - Sin cambios de infraestructura pendientes; código de salida del plan detallado `0`.

  La comprobación examina el estado actual y los datos del plan guardado; no demuestra que se aplicara ese plan exacto.
debrief: El ID registrado de north, los archivos, las direcciones de estado y el plan de recuperación
  guardado coinciden con las comprobaciones, y el plan final no tiene cambios.
stages.0.brief: Completa la entrega conservando la identidad registrada.
hints.0.text: Un apply interrumpido puede dejar recursos válidos ya registrados en el estado.
hints.1.text: |-
  El apply interrumpido ya registró north; aún debe crearse south.

  Inspecciona la configuración suministrada y las observaciones actuales en la workstation:

  ```sh
  cat main.tf
  tofu state list
  ls -l north.txt south.txt
  ```
hints.2.text: |-
  Aplica el plan guardado con north no-op y south create.
  Guarda el plan binario y expórtalo con tofu show -json al artefacto JSON solicitado.

  Verifica el resultado desde `~/quest` en la workstation:

  - `cat north.txt south.txt` — Muestra `north-71` y `south-71`, respectivamente.
  - `tofu output -raw north_id; printf '\n'; cat /run/dq/facts/0/original-north-id; tofu show -no-color` — Los ID coinciden; el estado contiene exactamente `north.txt` y `south.txt`.
  - `jq -r '.resource_changes[] | .address + " " + (.change.actions | join(","))' recovery-plan.json; tofu plan -input=false -detailed-exitcode -no-color` — El plan guardado tiene dos entradas: `no-op` para `north.txt`, `create` para `south.txt`; el plan actual termina con `0`.

  El estado registra exactamente north.txt y south.txt. El plan guardado conserva el ID original con no-op y crea solo el archivo que falta.
phrases.0: Inspeccioné el estado parcial antes de volver a intentar un apply.
phrases.1: Conservé el recurso que ya estaba administrado correctamente.
phrases.2: Verifiqué el recovery plan guardado y el plan vacío final.
diagnostics.condition_0: /run/dq/facts/0/original-north-id no debe estar vacío y tofu output -raw north_id
  debe ser igual a su contenido.
diagnostics.condition_1: north.txt debe ser igual a north-71.
diagnostics.condition_2: south.txt debe ser igual a south-71.
diagnostics.condition_3: |-
  El estado de OpenTofu debe registrar exactamente los archivos configurados north.txt y south.txt.

diagnostics.condition_4: recovery-plan.json resource_changes length debe ser igual a 2.
diagnostics.condition_5: |-
  recovery-plan.json debe dejar sin cambios el recurso north.txt original con su ID original del proveedor.

diagnostics.condition_6: |-
  recovery-plan.json debe crear el recurso south.txt que falta.

diagnostics.condition_7: El plan de OpenTofu con detailed-exitcode debe terminar con código 0.
stages.0.objectives.0.text: La salida `north_id` conserva el ID del recurso asignado originalmente por
  el proveedor.
stages.0.objectives.1.text: En la workstation, `north.txt` contiene `north-71`; `south.txt` contiene `south-71`.
stages.0.objectives.2.text: OpenTofu registra exactamente los dos archivos gestionados definidos en la
  configuración suministrada.
stages.0.objectives.3.text: 'El archivo `recovery-plan.json` de la workstation registra exactamente dos
  entradas de recurso: el archivo gestionado existente no cambia y solo se crea el archivo gestionado
  que falta.'
stages.0.objectives.4.text: OpenTofu no informa cambios de infraestructura pendientes.
