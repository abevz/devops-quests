title: Recuperación parcial del estado
brief: 'Una implementación interrumpida de local creó north.txt y lo registró en estado, pero nunca creó
  south.txt. La configuración ahora describe ambos. Inspeccione el estado y guarde recovery-plan.json
  antes de aplicar. Cree solo el recurso south que falta, conservando el north provider ID y el contenido.
  No se necesita eliminación de estado, import o acceso a la nube; utilice el offline local provider suministrado.
  north identity original está congelado bajo /run/dq/facts/0/.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `main.tf`, `original-north-id`,
  `north.txt`, `south.txt`, `recovery-plan.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: solo se crea south, north mantiene congelado su provider ID, ambos archivos
  son correctos y el plan final está vacío.'
debrief: El lanzamiento interrumpido se concilió sin reemplazar el recurso que ya estaba en buen estado.
stages.0.brief: 'Criterios de éxito: Solo se crea south, north mantiene su provider ID congelado, ambos
  archivos son correctos y el plan final está vacío.'
stages.0.objectives.0.text: Solo se crea south, north mantiene congelado su provider ID, ambos archivos
  son correctos y el plan final está vacío.
hints.0.text: Un apply interrumpido puede dejar recursos válidos ya registrados en el estado.
hints.1.text: Revise no-op y créelo por separado antes de aprobar la recuperación.
hints.2.text: Aplique el plan guardado con north no-op y south crear; verificar identity y su contenido.
phrases.0: Inspeccioné el estado parcial antes de volver a intentar un apply.
phrases.1: Conservé el recurso que ya estaba administrado correctamente.
phrases.2: Verifiqué el recovery plan guardado y el plan vacío final.
