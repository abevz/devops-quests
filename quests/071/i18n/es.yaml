title: Recuperación parcial del estado
brief: 'Trabaja en `~/quest` y lee `main.tf` y `original-north-id`. Una aplicación interrumpida creó el archivo north y su
  entrada en el estado, pero no south. El ID original de north también está fijado en `/run/dq/facts/0/original-north-id`.
  Usa el proveedor suministrado sin conexión. La guía enlazada introduce el estado de OpenTofu y las pistas describen las
  acciones no-op y create.


  Guarda un plan binario de recuperación y expórtalo con `tofu show -json` a `recovery-plan.json`, luego aplícalo. Comprueba
  que la salida raíz `north_id` coincide con el ID fijado, `north.txt` contiene `north-71`, `south.txt` contiene `south-71`
  y el estado contiene exactamente `local_file.north` y `local_file.south`. El plan JSON guardado debe tener exactamente dos
  cambios de recurso: north con acciones `["no-op"]` y south con `["create"]`. Finalmente, `tofu plan -input=false -detailed-exitcode
  -no-color` debe terminar con código 0 (sin cambios). La comprobación inspecciona el estado actual y el JSON guardado, no
  si se aplicó ese plan concreto. Trabaja solo en la bahía.'
debrief: El ID registrado de north, los archivos, las direcciones de estado y el plan de recuperación guardado coinciden con
  las comprobaciones, y el plan final no tiene cambios.
stages.0.brief: El ID fijado de north, los dos archivos, las direcciones exactas del estado y el plan guardado coinciden con
  el enunciado, y el plan final termina con código 0.
stages.0.objectives.0.text: El ID fijado de north, los dos archivos, las direcciones exactas del estado y el plan guardado
  coinciden con el enunciado, y el plan final termina con código 0.
hints.0.text: Un apply interrumpido puede dejar recursos válidos ya registrados en el estado.
hints.1.text: Revise no-op y créelo por separado antes de aprobar la recuperación.
hints.2.text: Aplique el plan guardado con north no-op y south crear; verificar identity y su contenido.
phrases.0: Inspeccioné el estado parcial antes de volver a intentar un apply.
phrases.1: Conservé el recurso que ya estaba administrado correctamente.
phrases.2: Verifiqué el recovery plan guardado y el plan vacío final.
diagnostics.condition_0: /run/dq/facts/0/original-north-id no debe estar vacío y tofu output -raw north_id debe ser igual
  a su contenido.
diagnostics.condition_1: north.txt debe ser igual a north-71.
diagnostics.condition_2: south.txt debe ser igual a south-71.
diagnostics.condition_3: tofu state list debe ser igual a {local_file.north, local_file.south}.
diagnostics.condition_4: recovery-plan.json resource_changes length debe ser igual a 2.
diagnostics.condition_5: recovery-plan.json debe contener una entrada para local_file.north con actions ["no-op"].
diagnostics.condition_6: recovery-plan.json debe contener una entrada para local_file.south con actions ["create"].
diagnostics.condition_7: El plan de OpenTofu con detailed-exitcode debe terminar con código 0.
