title: Частичное восстановление state
brief: |
  Требуемая доставка не завершена.

  Работайте на workstation в `~/quest` с файлами `main.tf`.

  **Требования:**
  - Корневые выводы:
    - Имя вывода: `north_id`.
    - Соответствующая квитанция на workstation: `/run/dq/facts/0/original-north-id`.
  - Файлы на workstation:
    - `~/quest/north.txt`: `north-71`.
    - `~/quest/south.txt`: `south-71`.
  - Состояние OpenTofu:
    - Точный состав: `local_file.north`, `local_file.south`.
  - Сохранённый план восстановления на workstation:
    - Путь: `~/quest/recovery-plan.json`.
    - Ровно две записи: `local_file.north` — `no-op`; `local_file.south` — `create`.
  - Согласованность инфраструктуры:
    - Нет ожидающих изменений инфраструктуры; код завершения подробного плана `0`.

  **Самопроверка перед Check & finish:**
  - `cat north.txt south.txt` — Показывает соответственно `north-71` и `south-71`.
  - `tofu output -raw north_id; printf '\n'; cat /run/dq/facts/0/original-north-id; tofu show -no-color` — ID совпадают; состояние содержит в точности `local_file.north` и `local_file.south`.
  - `jq -r '.resource_changes[] | .address + " " + (.change.actions | join(","))' recovery-plan.json; tofu plan -input=false -detailed-exitcode -no-color` — Сохранённый план содержит две записи: `no-op` для `local_file.north`, `create` для `local_file.south`; текущее планирование завершается с кодом `0`.

  Проверка изучает текущее состояние и сохранённые данные плана; она не доказывает, что был применён именно этот план.
debrief: Записанный ID north, содержимое файлов, адреса состояния и сохранённый план восстановления соответствуют
  проверкам, а итоговый план не содержит изменений.
stages.0.brief: Завершите доставку с сохранением записанной идентичности.
hints.0.text: После прерванного apply в state могут остаться корректно созданные ресурсы.
hints.1.text: Прерванный apply уже записал north; south ещё нужно создать.
hints.2.text: |-
  Примените сохранённый план с north no-op и south create.
  Сохраните бинарный план и экспортируйте его через tofu show -json в требуемый JSON-артефакт.
phrases.0: Я изучил частичный state до повторного apply.
phrases.1: Я сохранил ресурс, которым state уже управлял корректно.
phrases.2: Я проверил сохранённый recovery plan и пустой итоговый plan.
diagnostics.condition_0: /run/dq/facts/0/original-north-id должен быть непустым, а tofu output -raw north_id должен
  совпадать с его содержимым.
diagnostics.condition_1: north.txt должен совпадать с north-71.
diagnostics.condition_2: south.txt должен совпадать с south-71.
diagnostics.condition_3: tofu state list должен совпадать с {local_file.north, local_file.south}.
diagnostics.condition_4: recovery-plan.json resource_changes length должен совпадать с 2.
diagnostics.condition_5: recovery-plan.json должен содержать запись для local_file.north с actions ["no-op"].
diagnostics.condition_6: recovery-plan.json должен содержать запись для local_file.south с actions ["create"].
diagnostics.condition_7: План OpenTofu с detailed-exitcode должен завершиться с кодом 0.
stages.0.objectives.0.text: Вывод `north_id` совпадает с `/run/dq/facts/0/original-north-id` на workstation.
stages.0.objectives.1.text: На workstation `north.txt` содержит `north-71`; `south.txt` содержит `south-71`.
stages.0.objectives.2.text: Состояние OpenTofu содержит в точности `local_file.north`, `local_file.south`.
stages.0.objectives.3.text: 'Файл `recovery-plan.json` на workstation содержит ровно две записи ресурсов: `no-op`
  для `local_file.north` и `create` для `local_file.south`.'
stages.0.objectives.4.text: OpenTofu не сообщает об ожидающих изменениях инфраструктуры.
