title: Частичное восстановление state
brief: |-
  Требуемая доставка не завершена.

  Работайте на workstation в `~/quest` с файлами `main.tf`.

  **Требования:**
  - Корневые выводы:
    - Имя вывода: `north_id`.
    - Выходное значение `north_id` сохраняет ID ресурса, изначально назначенный провайдером.
  - Файлы на workstation:
    - `~/quest/north.txt`: `north-71`.
    - `~/quest/south.txt`: `south-71`.
  - Состояние OpenTofu:
    - OpenTofu учитывает ровно два управляемых файла из предоставленной конфигурации.
  - Сохранённый план восстановления на workstation:
    - Путь: `~/quest/recovery-plan.json`.
    - Файл `recovery-plan.json` на workstation содержит ровно две записи ресурсов: существующий управляемый файл не меняется, создаётся только недостающий управляемый файл.
  - Согласованность инфраструктуры:
    - Нет ожидающих изменений инфраструктуры; код завершения подробного плана `0`.

  Проверка изучает текущее состояние и сохранённые данные плана; она не доказывает, что был применён именно этот план.
debrief: Записанный ID north, содержимое файлов, адреса состояния и сохранённый план восстановления соответствуют
  проверкам, а итоговый план не содержит изменений.
stages.0.brief: Завершите доставку с сохранением записанной идентичности.
hints.0.text: После прерванного apply в state могут остаться корректно созданные ресурсы.
hints.1.text: |-
  Прерванный apply уже записал north; south ещё нужно создать.

  Изучите предоставленную конфигурацию и текущие наблюдения на workstation:

  ```sh
  cat main.tf
  tofu state list
  ls -l north.txt south.txt
  ```
hints.2.text: |-
  Примените сохранённый план с north no-op и south create.
  Сохраните бинарный план и экспортируйте его через tofu show -json в требуемый JSON-артефакт.

  Проверьте результат из `~/quest` на workstation:

  - `cat north.txt south.txt` — Показывает соответственно `north-71` и `south-71`.
  - `tofu output -raw north_id; printf '\n'; cat /run/dq/facts/0/original-north-id; tofu show -no-color` — ID совпадают; состояние содержит в точности `north.txt` и `south.txt`.
  - `jq -r '.resource_changes[] | .address + " " + (.change.actions | join(","))' recovery-plan.json; tofu plan -input=false -detailed-exitcode -no-color` — Сохранённый план содержит две записи: `no-op` для `north.txt`, `create` для `south.txt`; текущее планирование завершается с кодом `0`.

  Состояние учитывает ровно north.txt и south.txt. Сохранённый план оставляет исходный ID файла с no-op и создаёт только недостающий файл.
phrases.0: Я изучил частичный state до повторного apply.
phrases.1: Я сохранил ресурс, которым state уже управлял корректно.
phrases.2: Я проверил сохранённый recovery plan и пустой итоговый plan.
diagnostics.condition_0: /run/dq/facts/0/original-north-id должен быть непустым, а tofu output -raw north_id
  должен совпадать с его содержимым.
diagnostics.condition_1: north.txt должен совпадать с north-71.
diagnostics.condition_2: south.txt должен совпадать с south-71.
diagnostics.condition_3: |-
  Состояние OpenTofu должно учитывать ровно настроенные файлы north.txt и south.txt.

diagnostics.condition_4: recovery-plan.json resource_changes length должен совпадать с 2.
diagnostics.condition_5: |-
  recovery-plan.json должен оставлять исходный ресурс north.txt без изменений, с исходным ID провайдера.

diagnostics.condition_6: |-
  recovery-plan.json должен создавать недостающий ресурс south.txt.

diagnostics.condition_7: План OpenTofu с detailed-exitcode должен завершиться с кодом 0.
stages.0.objectives.0.text: Выходное значение `north_id` сохраняет ID ресурса, изначально назначенный
  провайдером.
stages.0.objectives.1.text: На workstation `north.txt` содержит `north-71`; `south.txt` содержит `south-71`.
stages.0.objectives.2.text: OpenTofu учитывает ровно два управляемых файла из предоставленной конфигурации.
stages.0.objectives.3.text: 'Файл `recovery-plan.json` на workstation содержит ровно две записи ресурсов:
  существующий управляемый файл не меняется, создаётся только недостающий управляемый файл.'
stages.0.objectives.4.text: OpenTofu не сообщает об ожидающих изменениях инфраструктуры.
diagnostics.probe_0_2: 'Текущие данные не позволили проверить эту цель: OpenTofu учитывает ровно два управляемых
  файла из предоставленной конфигурации.'
diagnostics.probe_0_3: 'Текущие данные не позволили проверить эту цель: Файл `recovery-plan.json` на workstation
  содержит ровно две записи ресурсов: существующий управляемый файл не меняется, создаётся только недостающий управляемый
  файл.'
