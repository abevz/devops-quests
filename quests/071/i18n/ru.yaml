title: Частичное восстановление state
brief: 'Работайте в `~/quest`, изучите `main.tf` и `original-north-id`. Прерванное применение создало файл north и запись
  в состоянии, но не создало south. Исходный ID north также закреплён в `/run/dq/facts/0/original-north-id`. Используйте выданный
  офлайн-провайдер. Руководство вводит понятие состояния OpenTofu, а подсказки объясняют действия no-op и create.


  Сохраните бинарный план восстановления и экспортируйте его через `tofu show -json` в `recovery-plan.json`, затем примените.
  Проверьте, что корневой выход `north_id` равен закреплённому ID, `north.txt` содержит `north-71`, `south.txt` содержит `south-71`,
  а состояние содержит ровно `local_file.north` и `local_file.south`. В сохранённом JSON-плане должно быть ровно два изменения
  ресурсов: north с действиями `["no-op"]` и south с `["create"]`. Наконец, `tofu plan -input=false -detailed-exitcode -no-color`
  должен завершиться с кодом 0 (изменений нет). Проверка исследует текущее состояние и сохранённый JSON, но не доказывает
  применение именно этого плана. Работайте только в песочнице.'
debrief: Записанный ID north, содержимое файлов, адреса состояния и сохранённый план восстановления соответствуют проверкам,
  а итоговый план не содержит изменений.
stages.0.brief: Закреплённый ID north, оба файла, точные адреса состояния и сохранённый план соответствуют заданию, итоговый
  план завершается с кодом 0.
stages.0.objectives.0.text: Закреплённый ID north, оба файла, точные адреса состояния и сохранённый план соответствуют заданию,
  итоговый план завершается с кодом 0.
hints.0.text: После прерванного apply в state могут остаться корректно созданные ресурсы.
hints.1.text: До восстановления отдельно изучите no-op и create.
hints.2.text: Примените сохранённый plan с north no-op и south create; проверьте identity и содержимое.
phrases.0: Я изучил частичный state до повторного apply.
phrases.1: Я сохранил ресурс, которым state уже управлял корректно.
phrases.2: Я проверил сохранённый recovery plan и пустой итоговый plan.
diagnostics.condition_0: /run/dq/facts/0/original-north-id должен быть непустым, а tofu output -raw north_id должен совпадать
  с его содержимым.
diagnostics.condition_1: north.txt должен совпадать с north-71.
diagnostics.condition_2: south.txt должен совпадать с south-71.
diagnostics.condition_3: tofu state list должен совпадать с {local_file.north, local_file.south}.
diagnostics.condition_4: recovery-plan.json resource_changes length должен совпадать с 2.
diagnostics.condition_5: recovery-plan.json должен содержать запись для local_file.north с actions ["no-op"].
diagnostics.condition_6: recovery-plan.json должен содержать запись для local_file.south с actions ["create"].
diagnostics.condition_7: План OpenTofu с detailed-exitcode должен завершиться с кодом 0.
