title: Частичное восстановление state
brief: 'Прерванная локальная выкатка создала north.txt и записала его в state, но не создала south.txt.
  Конфигурация уже описывает оба. Изучите state и сохраните recovery-plan.json до apply. Создайте только
  недостающий south, сохранив provider ID и содержимое north. Удаление state, import и облако не нужны;
  используйте offline local provider. Исходная identity north сохранена в /run/dq/facts/0/.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `main.tf`, `original-north-id`, `north.txt`,
  `south.txt`, `recovery-plan.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Создан только south, north сохранил исходный provider ID, оба файла верны, итоговый
  plan пуст.'
debrief: Прерванная выкатка восстановлена без замены исправного ресурса.
stages.0.brief: 'Создан только south, north сохранил исходный provider ID, оба файла верны, итоговый plan
  пуст.


  Результат проверки: Создан только south, north сохранил исходный provider ID, оба файла верны, итоговый
  plan пуст.'
stages.0.objectives.0.text: Создан только south, north сохранил исходный provider ID, оба файла верны,
  итоговый plan пуст.
hints.0.text: После прерванного apply в state могут остаться корректно созданные ресурсы.
hints.1.text: До восстановления отдельно изучите no-op и create.
hints.2.text: Примените сохранённый plan с north no-op и south create; проверьте identity и содержимое.
phrases.0: Я изучил частичный state до повторного apply.
phrases.1: Я сохранил ресурс, которым state уже управлял корректно.
phrases.2: Я проверил сохранённый recovery plan и пустой итоговый plan.
