title: Частичное восстановление state
brief: |-
  Доставка не завершена, а сохранённые checkpoint описывают разные наборы выполненной работы. Завершите восстановление, не теряя более новый прогресс.

  Работайте в `~/quest` на рабочей станции с `main.tf` и `recovery-checkpoint.tfstate`.

  **Требования:**

  - Output `north_id` сохраняет исходный ID провайдера.
  - На рабочей станции `north.txt` и `south.txt` соответствуют предоставленной конфигурации.
  - State отслеживает ровно оба маршрутных файла и сохраняет два записанных идентификатора операций.
  - `recovery-plan.json` сохраняет существующие идентификаторы и создаёт только недостающий файл; checkpoint и копия state до восстановления корректны.
  - OpenTofu не сообщает об ожидающих изменениях инфраструктуры.
  - Сохраните исходный checkpoint без изменений и все записанные завершённые операции более нового частичного state.
  - Файл `~/quest/before-recovery.tfstate` на рабочей станции представляет предоставленный частичный state до восстановления с теми же lineage, serial и ID выполненных объектов.
  - Файл `~/quest/recovery-plan.json` на рабочей станции содержит две записи маршрутных файлов: существующий файл не меняется, создаётся только недостающий. Оба спутника операций имеют no-op с записанными ID. Посторонние записи недопустимы.
  - Управляемые файлы находятся в `~/quest/north.txt` и `~/quest/south.txt` на рабочей станции. Сохраните содержимое существующего файла и создайте недостающий по предоставленной конфигурации.

  Проверки анализируют текущее состояние, сохранённые артефакты и планы без применения; они не доказывают, какой именно план применялся, или полную историю команд.
debrief: Старый checkpoint содержал недостающую привязку, но не более позднюю завершённую операцию. Восстановление
  только привязки сохранило обе идентичности операций и исходный маршрут; сохранённый план создал недостающий
  маршрут без замены существующей работы.
stages.0.brief: Восстановите неполную привязку, сохранив более новую выполненную работу.
hints.0.text: Конфигурация, старый полный checkpoint и новый частичный state могут быть корректны по отдельности,
  но описывать разную работу. Слепой повтор или полный откат checkpoint способен изменить идентификатор.
hints.1.text: |-
  Сопоставьте конфигурацию со списками текущего и сохранённого state. Изучите предлагаемые действия: что есть только в старом checkpoint, а что появилось только в новом state?

  ```sh
  tofu state list
  tofu state list -state=recovery-checkpoint.tfstate
  tofu plan -input=false -no-color
  ```
hints.2.text: |-
  До изменений сохраните текущий частичный state и работайте с копией доверенного checkpoint. Восстановите только недостающую привязку в существующий локальный state, не перезаписывая новые записи. Затем сохраните и экспортируйте план, оставляющий записанные ID и создающий только недостающий маршрут. Проверьте исходный checkpoint, lineage/serial копии, действия плана и итоговую сходимость.

  ```sh
  tofu state list
  tofu output -raw north_id
  cat recovery-plan.json
  tofu plan -input=false -detailed-exitcode -no-color
  ```
phrases.0: Я изучил частичный state до повторного apply.
phrases.1: Я сохранил ресурс, которым state уже управлял корректно.
phrases.2: Я проверил сохранённый recovery plan и пустой итоговый plan.
