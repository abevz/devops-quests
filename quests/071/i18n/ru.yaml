title: Частичное восстановление state
brief: |-
  Доставка не завершена, а сохранённые checkpoint описывают разные наборы выполненной работы. Завершите восстановление, не теряя более новый прогресс.

  Работайте в `~/quest` на рабочей станции с `main.tf` и `recovery-checkpoint.tfstate`.

  **Требования:**

  - Output `north_id` сохраняет исходный ID провайдера.
  - На рабочей станции `north.txt` и `south.txt` соответствуют предоставленной конфигурации.
  - State отслеживает ровно оба маршрутных файла и сохраняет два записанных идентификатора операций.
  - `recovery-plan.json` сохраняет существующие идентификаторы и создаёт только недостающий файл; checkpoint и копия state до восстановления корректны.
  - OpenTofu не сообщает об ожидающих изменениях инфраструктуры.
  - Сохраните исходный checkpoint без изменений и все записанные завершённые операции более нового частичного state.
  - Файл `~/quest/before-recovery.tfstate` на рабочей станции представляет предоставленный частичный state до восстановления с теми же lineage, serial и ID выполненных объектов.
  - Файл `~/quest/recovery-plan.json` на рабочей станции содержит две записи маршрутных файлов: существующий файл не меняется, создаётся только недостающий. Оба спутника операций имеют no-op с записанными ID. Посторонние записи недопустимы.
  - Управляемые файлы находятся в `~/quest/north.txt` и `~/quest/south.txt` на рабочей станции. Сохраните содержимое существующего файла и создайте недостающий по предоставленной конфигурации.

  Проверки анализируют текущее состояние, сохранённые артефакты и планы без применения; они не доказывают, какой именно план применялся, или полную историю команд.
debrief: Старый checkpoint содержал недостающую привязку, но не более позднюю завершённую операцию. Восстановление
  только привязки сохранило обе идентичности операций и исходный маршрут; сохранённый план создал недостающий
  маршрут без замены существующей работы.
stages.0.brief: Восстановите неполную привязку, сохранив более новую выполненную работу.
hints.0.text: Конфигурация, старый полный checkpoint и новый частичный state могут быть корректны по отдельности,
  но описывать разную работу. Слепой повтор или полный откат checkpoint способен изменить идентификатор.
hints.1.text: |-
  Сопоставьте конфигурацию со списками текущего и сохранённого state. Изучите предлагаемые действия: что есть только в старом checkpoint, а что появилось только в новом state?

  ```sh
  tofu state list
  tofu state list -state=recovery-checkpoint.tfstate
  tofu plan -input=false -no-color
  ```
hints.2.text: |-
  До изменений сохраните текущий частичный state и работайте с копией доверенного checkpoint. Восстановите только недостающую привязку в существующий локальный state, не перезаписывая новые записи. Затем сохраните и экспортируйте план, оставляющий записанные ID и создающий только недостающий маршрут. Проверьте исходный checkpoint, lineage/serial копии, действия плана и итоговую сходимость.

  ```sh
  tofu state list
  tofu output -raw north_id
  cat recovery-plan.json
  tofu plan -input=false -detailed-exitcode -no-color
  ```
phrases.0: Я изучил частичный state до повторного apply.
phrases.1: Я сохранил ресурс, которым state уже управлял корректно.
phrases.2: Я проверил сохранённый recovery plan и пустой итоговый plan.
stages.0.objectives.0.text: Output `north_id` сохраняет исходный ID провайдера.
stages.0.objectives.1.text: На рабочей станции `north.txt` и `south.txt` соответствуют предоставленной
  конфигурации.
stages.0.objectives.2.text: State отслеживает ровно оба маршрутных файла и сохраняет два записанных идентификатора
  операций.
stages.0.objectives.3.text: '`recovery-plan.json` сохраняет существующие идентификаторы и создаёт только
  недостающий файл; checkpoint и копия state до восстановления корректны.'
stages.0.objectives.4.text: OpenTofu не сообщает об ожидающих изменениях инфраструктуры.
diagnostics.condition_0: Output может отсутствовать или ссылаться на пересозданный north-файл; сохраните исходный provider ID из зафиксированной записи. [Причина и проверка](guides#guide=terraform-3&section=recovery-original-north-output)
diagnostics.condition_1: Существующий north.txt мог измениться или стать недоступным; сравните содержимое с выданной конфигурацией до изменения state. [Причина и проверка](guides#guide=terraform-3&section=recovery-existing-north-content)
diagnostics.condition_2: Выданная конфигурация добавляет south.txt без apply; файл может отсутствовать или отличаться, пока план восстановления не создаст объявленный маршрут. [Причина и проверка](guides#guide=terraform-3&section=recovery-missing-south-content)
diagnostics.recovery_bindings: Повторный apply может пересоздать guardian, а откат всего checkpoint теряет progress; восстановите только отсутствующую привязку, сохраняя оба ID операций. Ошибка tofu show или неверный JSON также дают эту диагностику. [Причина и проверка](guides#guide=terraform-3&section=recovery-merge-old-binding-with-new-progress)
diagnostics.condition_3: Оставшиеся записи state могут указывать на другие файлы или дублировать маршрут; после сохранения двух companions нужен ровно один managed local_file для north.txt и south.txt. [Причина и проверка](guides#guide=terraform-3&section=recovery-two-managed-route-targets)
diagnostics.recovery_binding_plan: Отсутствующий/старый recovery-plan.json либо замена companion в плане не сохраняют завершённую работу; экспортируйте план после восстановления привязки, оставляя оба companions no-op с исходными ID. [Причина и проверка](guides#guide=terraform-3&section=recovery-plan-preserves-companion-identities)
diagnostics.condition_4: Лишняя запись маршрута нарушает состав сохранённого плана; артефакт описывает два маршрута вместе с двумя сохранёнными companions операций. [Причина и проверка](guides#guide=terraform-3&section=recovery-plan-route-inventory)
diagnostics.condition_5: Сохранённый план может заменять/менять north.txt либо использовать другой исходный ID; оставьте запись существующего маршрута no-op с зафиксированной идентичностью. [Причина и проверка](guides#guide=terraform-3&section=recovery-plan-existing-route-no-op)
diagnostics.condition_6: Артефакт могли экспортировать после apply, когда south.txt уже no-op, либо пропустить маршрут; сохраните план до apply, создающий south.txt. [Причина и проверка](guides#guide=terraform-3&section=recovery-plan-only-missing-route-create)
diagnostics.recovery_backup: Изменение доверенного checkpoint либо backup после восстановления теряет нужные данные; сохраните байты checkpoint и новую частичную state с исходными lineage, serial и ID завершённых объектов. [Причина и проверка](guides#guide=terraform-3&section=recovery-trusted-checkpoint-and-partial-backup)
diagnostics.condition_7: Неприменённая конфигурация, drift файлов или ошибка plan дают ненулевой финальный код; изучите изменения после применения сохранённого плана восстановления. [Причина и проверка](guides#guide=terraform-3&section=recovery-final-converged-plan)
diagnostics.probe_0_2: Наблюдение state может завершиться до проверки привязок, например при невозможности запуска tofu или импорта helper; обычный ненулевой код/неверный JSON tofu дают recovery_bindings. [Причина и проверка](guides#guide=terraform-3&section=recovery-state-helper-startup)
diagnostics.probe_0_3: Наблюдение плана может завершиться до конкретного маркера на импортах или неожиданной структуре артефакта; обычный отсутствующий/неверный recovery-plan.json даёт recovery_binding_plan. [Причина и проверка](guides#guide=terraform-3&section=recovery-plan-helper-startup)
