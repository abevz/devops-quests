title: Częściowe odzyskiwanie state
brief: |-
  Dostarczenie jest niepełne, a zachowane checkpointy opisują różne zestawy ukończonej pracy. Zakończ odtwarzanie bez utraty nowszego postępu.

  Pracuj w `~/quest` na stacji roboczej z `main.tf` i `recovery-checkpoint.tfstate`.

  **Wymagania:**

  - Output `north_id` zachowuje pierwotne ID dostawcy.
  - Na stacji roboczej `north.txt` i `south.txt` odpowiadają dostarczonej konfiguracji.
  - State śledzi dokładnie oba pliki tras i zachowuje dwie zapisane tożsamości operacji.
  - `recovery-plan.json` zachowuje istniejące tożsamości i tworzy tylko brakujący plik; checkpoint i kopia sprzed odtwarzania pozostają poprawne.
  - OpenTofu nie zgłasza oczekujących zmian infrastruktury.
  - Zachowaj checkpoint bez zmian i wszystkie zapisane ukończone operacje nowszego częściowego state.
  - `~/quest/before-recovery.tfstate` na stacji roboczej przedstawia dostarczony częściowy state przed odtworzeniem z tym samym lineage, serial i ID ukończonych obiektów.
  - `~/quest/recovery-plan.json` na stacji roboczej zawiera dwa wpisy plików tras: istniejący plik nie zmienia się, powstaje tylko brakujący. Oba obiekty tożsamości operacji mają wpisy no-op z zapisanymi ID. Obce wpisy są niedozwolone.
  - Zarządzane pliki znajdują się w `~/quest/north.txt` i `~/quest/south.txt` na stacji roboczej. Zachowaj istniejącą zawartość i uzupełnij brakujący plik zgodnie z konfiguracją.

  Kontrole badają bieżący state, zachowane artefakty i plany bez zastosowania; nie dowodzą zastosowania konkretnego planu ani pełnej historii poleceń.
debrief: Starszy checkpoint zawierał brakujące powiązanie, lecz nie późniejszą ukończoną operację. Przywrócenie
  tylko powiązania zachowało obie tożsamości i pierwotną trasę; zapisany plan utworzył brakującą trasę
  bez zastępowania istniejącej pracy.
stages.0.brief: Odtwórz niekompletne powiązanie, zachowując nowszą ukończoną pracę.
hints.0.text: Konfiguracja, starszy pełny checkpoint i nowszy częściowy state mogą osobno być poprawne
  i opisywać różną pracę. Ślepe ponowienie lub pełny rollback może zmienić tożsamość.
hints.1.text: |-
  Porównaj konfigurację z bieżącym i zachowanym inwentarzem state. Zbadaj proponowane działania: co jest tylko w starszym checkpoincie, a co wyłącznie w nowszym state?

  ```sh
  tofu state list
  tofu state list -state=recovery-checkpoint.tfstate
  tofu plan -input=false -no-color
  ```
hints.2.text: |-
  Przed zmianami zapisz bieżący częściowy state i pracuj na kopii zaufanego checkpointu. Przywróć wyłącznie brakujące powiązanie do istniejącego lokalnego state bez nadpisania nowszych wpisów. Zapisz i wyeksportuj plan zachowujący tożsamości i tworzący tylko brakującą trasę. Sprawdź wejście, lineage/serial kopii, działania planu i końcową zbieżność.

  ```sh
  tofu state list
  tofu output -raw north_id
  cat recovery-plan.json
  tofu plan -input=false -detailed-exitcode -no-color
  ```
phrases.0: Przed ponowną próbą apply sprawdziłem częściowy state.
phrases.1: Zachowałem zasób, który był już poprawnie zarządzany.
phrases.2: Sprawdziłem zapisany recovery plan i końcowy pusty plan.
