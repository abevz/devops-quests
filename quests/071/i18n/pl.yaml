title: Częściowe odzyskiwanie state
brief: 'Pracuj w `~/quest` i przeczytaj `main.tf` oraz `original-north-id`. Przerwane zastosowanie utworzyło plik north i
  jego wpis w stanie, ale nie utworzyło south. Pierwotny ID north jest też utrwalony w `/run/dq/facts/0/original-north-id`.
  Użyj dostarczonego dostawcy offline. Połączony przewodnik przedstawia stan OpenTofu, a podpowiedzi opisują akcje no-op i
  create.


  Zapisz binarny plan odzyskiwania i wyeksportuj go przez `tofu show -json` do `recovery-plan.json`, a następnie zastosuj.
  Sprawdź, czy główne wyjście `north_id` jest równe utrwalonemu ID, `north.txt` zawiera `north-71`, `south.txt` zawiera `south-71`,
  a stan zawiera dokładnie `local_file.north` i `local_file.south`. Zapisany plan JSON musi mieć dokładnie dwie zmiany zasobów:
  north z akcjami `["no-op"]` i south z `["create"]`. Na koniec `tofu plan -input=false -detailed-exitcode -no-color` musi
  zwrócić kod 0 (brak zmian). Kontrola bada obecny stan i zapisany JSON, nie potwierdza zastosowania tego konkretnego planu.
  Pracuj tylko w zatoce.'
debrief: Zapisany ID north, zawartość plików, adresy stanu i zapisany plan odzyskiwania odpowiadają kontrolom, a końcowy plan
  nie zawiera zmian.
stages.0.brief: Utrwalony ID north, dwa pliki, dokładne adresy stanu i zapisany plan odpowiadają opisowi, a końcowy plan zwraca
  kod 0.
stages.0.objectives.0.text: Utrwalony ID north, dwa pliki, dokładne adresy stanu i zapisany plan odpowiadają opisowi, a końcowy
  plan zwraca kod 0.
hints.0.text: Przerwane apply może pozostawić ważne zasoby już zapisane w state.
hints.1.text: Przed zatwierdzeniem odzyskiwania przejrzyj oddzielnie no-op i create.
hints.2.text: Zastosuj zapisane plan z north no-op i south create; sprawdź identity i zawartość.
phrases.0: Przed ponowną próbą apply sprawdziłem częściowy state.
phrases.1: Zachowałem zasób, który był już poprawnie zarządzany.
phrases.2: Sprawdziłem zapisany recovery plan i końcowy pusty plan.
diagnostics.condition_0: /run/dq/facts/0/original-north-id musi być niepuste, a tofu output -raw north_id musi mu odpowiadać.
diagnostics.condition_1: north.txt musi być równe north-71.
diagnostics.condition_2: south.txt musi być równe south-71.
diagnostics.condition_3: tofu state list musi być równe {local_file.north, local_file.south}.
diagnostics.condition_4: recovery-plan.json resource_changes length musi być równe 2.
diagnostics.condition_5: recovery-plan.json musi zawierać wpis dla local_file.north z actions ["no-op"].
diagnostics.condition_6: recovery-plan.json musi zawierać wpis dla local_file.south z actions ["create"].
diagnostics.condition_7: Plan OpenTofu z detailed-exitcode musi zakończyć się kodem 0.
