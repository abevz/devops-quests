title: Częściowe odzyskiwanie state
brief: |-
  Wymagane dostarczenie jest niekompletne.

  Pracuj na workstation w `~/quest` z plikami `main.tf`.

  **Wymagania:**
  - Wyjścia główne:
    - Nazwa wyjścia: `north_id`.
    - Wyjście `north_id` zachowuje ID zasobu pierwotnie nadany przez dostawcę.
  - Pliki na workstation:
    - `~/quest/north.txt`: `north-71`.
    - `~/quest/south.txt`: `south-71`.
  - Stan OpenTofu:
    - OpenTofu zarządza dokładnie dwoma plikami zdefiniowanymi w dostarczonej konfiguracji.
  - Zapisany plan odzyskiwania na workstation:
    - Ścieżka: `~/quest/recovery-plan.json`.
    - Plik `recovery-plan.json` na workstation zapisuje dokładnie dwa zasoby: istniejący zarządzany plik pozostaje bez zmian, a tworzony jest tylko brakujący zarządzany plik.
  - Zbieżność infrastruktury:
    - Brak oczekujących zmian infrastruktury; kod zakończenia szczegółowego planu `0`.

  Sprawdzenie bada bieżący stan i zapisane dane planu; nie dowodzi zastosowania dokładnie tego planu.
debrief: Zapisany ID north, zawartość plików, adresy stanu i zapisany plan odzyskiwania odpowiadają kontrolom,
  a końcowy plan nie zawiera zmian.
stages.0.brief: Dokończ dostarczenie, zachowując zapisaną tożsamość.
hints.0.text: Przerwane apply może pozostawić ważne zasoby już zapisane w state.
hints.1.text: |-
  Przerwany apply zapisał już north; south wymaga jeszcze utworzenia.

  Sprawdź dostarczoną konfigurację i bieżące obserwacje na workstation:

  ```sh
  cat main.tf
  tofu state list
  ls -l north.txt south.txt
  ```
hints.2.text: |-
  Zastosuj zapisany plan z north no-op i south create.
  Zapisz plan binarny i wyeksportuj go przez tofu show -json do wymaganego artefaktu JSON.

  Sprawdź wynik z `~/quest` na workstation:

  - `cat north.txt south.txt` — Pokazuje odpowiednio `north-71` i `south-71`.
  - `tofu output -raw north_id; printf '\n'; cat /run/dq/facts/0/original-north-id; tofu show -no-color` — ID są zgodne; stan zawiera dokładnie `local_file.north` i `local_file.south`.
  - `jq -r '.resource_changes[] | .address + " " + (.change.actions | join(","))' recovery-plan.json; tofu plan -input=false -detailed-exitcode -no-color` — Zapisany plan ma dwa wpisy: `no-op` dla `local_file.north`, `create` dla `local_file.south`; bieżący plan kończy się kodem `0`.
phrases.0: Przed ponowną próbą apply sprawdziłem częściowy state.
phrases.1: Zachowałem zasób, który był już poprawnie zarządzany.
phrases.2: Sprawdziłem zapisany recovery plan i końcowy pusty plan.
diagnostics.condition_0: /run/dq/facts/0/original-north-id musi być niepuste, a tofu output -raw north_id
  musi mu odpowiadać.
diagnostics.condition_1: north.txt musi być równe north-71.
diagnostics.condition_2: south.txt musi być równe south-71.
diagnostics.condition_3: tofu state list musi być równe {local_file.north, local_file.south}.
diagnostics.condition_4: recovery-plan.json resource_changes length musi być równe 2.
diagnostics.condition_5: recovery-plan.json musi zawierać wpis dla local_file.north z actions ["no-op"].
diagnostics.condition_6: recovery-plan.json musi zawierać wpis dla local_file.south z actions ["create"].
diagnostics.condition_7: Plan OpenTofu z detailed-exitcode musi zakończyć się kodem 0.
stages.0.objectives.0.text: Wyjście `north_id` zachowuje ID zasobu pierwotnie nadany przez dostawcę.
stages.0.objectives.1.text: Na workstation `north.txt` zawiera `north-71`; `south.txt` zawiera `south-71`.
stages.0.objectives.2.text: OpenTofu zarządza dokładnie dwoma plikami zdefiniowanymi w dostarczonej konfiguracji.
stages.0.objectives.3.text: 'Plik `recovery-plan.json` na workstation zapisuje dokładnie dwa zasoby: istniejący
  zarządzany plik pozostaje bez zmian, a tworzony jest tylko brakujący zarządzany plik.'
stages.0.objectives.4.text: OpenTofu nie zgłasza oczekujących zmian infrastruktury.
