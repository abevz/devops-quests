title: Częściowe odzyskiwanie state
brief: 'Przerwane wdrożenie lokalne spowodowało utworzenie north.txt i zarejestrowanie go w state, ale
  nigdy nie spowodowało utworzenia south.txt. Konfiguracja opisuje teraz oba. Przed zastosowaniem sprawdź
  state i zapisz recovery-plan.json. Utwórz tylko brakujący zasób south, zachowując north provider ID
  i zawartość. Nie jest potrzebne usuwanie state, import ani dostęp do chmury; użyj dostarczonego offline
  local provider. Oryginalna tożsamość north jest zamrożona pod /run/dq/facts/0/.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `main.tf`, `original-north-id`,
  `north.txt`, `south.txt`, `recovery-plan.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: Utworzono tylko south, north zachowuje zamrożony plik provider ID, oba
  pliki są poprawne, a końcowy plan jest pusty.'
debrief: Przerwane wdrożenie zostało uzgodnione bez zastępowania już sprawnego zasobu.
stages.0.brief: 'Kryteria sukcesu: Utworzono tylko south, north zachowuje zamrożony plik provider ID,
  oba pliki są poprawne, a końcowy plan jest pusty.'
stages.0.objectives.0.text: Tworzony jest tylko south, north zachowuje zamrożony provider ID, oba pliki
  są poprawne, a końcowy plan jest pusty.
hints.0.text: Przerwane apply może pozostawić ważne zasoby już zapisane w state.
hints.1.text: Przed zatwierdzeniem odzyskiwania przejrzyj oddzielnie no-op i create.
hints.2.text: Zastosuj zapisane plan z north no-op i south create; sprawdź identity i zawartość.
phrases.0: Przed ponowną próbą apply sprawdziłem częściowy state.
phrases.1: Zachowałem zasób, który był już poprawnie zarządzany.
phrases.2: Sprawdziłem zapisany recovery plan i końcowy pusty plan.
