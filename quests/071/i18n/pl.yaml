title: Częściowe odzyskiwanie state
brief: |-
  Dostarczenie jest niepełne, a zachowane checkpointy opisują różne zestawy ukończonej pracy. Zakończ odtwarzanie bez utraty nowszego postępu.

  Pracuj w `~/quest` na stacji roboczej z `main.tf` i `recovery-checkpoint.tfstate`.

  **Wymagania:**

  - Output `north_id` zachowuje pierwotne ID dostawcy.
  - Na stacji roboczej `north.txt` i `south.txt` odpowiadają dostarczonej konfiguracji.
  - State śledzi dokładnie oba pliki tras i zachowuje dwie zapisane tożsamości operacji.
  - `recovery-plan.json` zachowuje istniejące tożsamości i tworzy tylko brakujący plik; checkpoint i kopia sprzed odtwarzania pozostają poprawne.
  - OpenTofu nie zgłasza oczekujących zmian infrastruktury.
  - Zachowaj checkpoint bez zmian i wszystkie zapisane ukończone operacje nowszego częściowego state.
  - `~/quest/before-recovery.tfstate` na stacji roboczej przedstawia dostarczony częściowy state przed odtworzeniem z tym samym lineage, serial i ID ukończonych obiektów.
  - `~/quest/recovery-plan.json` na stacji roboczej zawiera dwa wpisy plików tras: istniejący plik nie zmienia się, powstaje tylko brakujący. Oba obiekty tożsamości operacji mają wpisy no-op z zapisanymi ID. Obce wpisy są niedozwolone.
  - Zarządzane pliki znajdują się w `~/quest/north.txt` i `~/quest/south.txt` na stacji roboczej. Zachowaj istniejącą zawartość i uzupełnij brakujący plik zgodnie z konfiguracją.

  Kontrole badają bieżący state, zachowane artefakty i plany bez zastosowania; nie dowodzą zastosowania konkretnego planu ani pełnej historii poleceń.
debrief: Starszy checkpoint zawierał brakujące powiązanie, lecz nie późniejszą ukończoną operację. Przywrócenie
  tylko powiązania zachowało obie tożsamości i pierwotną trasę; zapisany plan utworzył brakującą trasę
  bez zastępowania istniejącej pracy.
stages.0.brief: Odtwórz niekompletne powiązanie, zachowując nowszą ukończoną pracę.
hints.0.text: Konfiguracja, starszy pełny checkpoint i nowszy częściowy state mogą osobno być poprawne
  i opisywać różną pracę. Ślepe ponowienie lub pełny rollback może zmienić tożsamość.
hints.1.text: |-
  Porównaj konfigurację z bieżącym i zachowanym inwentarzem state. Zbadaj proponowane działania: co jest tylko w starszym checkpoincie, a co wyłącznie w nowszym state?

  ```sh
  tofu state list
  tofu state list -state=recovery-checkpoint.tfstate
  tofu plan -input=false -no-color
  ```
hints.2.text: |-
  Przed zmianami zapisz bieżący częściowy state i pracuj na kopii zaufanego checkpointu. Przywróć wyłącznie brakujące powiązanie do istniejącego lokalnego state bez nadpisania nowszych wpisów. Zapisz i wyeksportuj plan zachowujący tożsamości i tworzący tylko brakującą trasę. Sprawdź wejście, lineage/serial kopii, działania planu i końcową zbieżność.

  ```sh
  tofu state list
  tofu output -raw north_id
  cat recovery-plan.json
  tofu plan -input=false -detailed-exitcode -no-color
  ```
phrases.0: Przed ponowną próbą apply sprawdziłem częściowy state.
phrases.1: Zachowałem zasób, który był już poprawnie zarządzany.
phrases.2: Sprawdziłem zapisany recovery plan i końcowy pusty plan.
stages.0.objectives.0.text: Output `north_id` zachowuje pierwotne ID dostawcy.
stages.0.objectives.1.text: Na stacji roboczej `north.txt` i `south.txt` odpowiadają dostarczonej konfiguracji.
stages.0.objectives.2.text: State śledzi dokładnie oba pliki tras i zachowuje dwie zapisane tożsamości
  operacji.
stages.0.objectives.3.text: '`recovery-plan.json` zachowuje istniejące tożsamości i tworzy tylko brakujący
  plik; checkpoint i kopia sprzed odtwarzania pozostają poprawne.'
stages.0.objectives.4.text: OpenTofu nie zgłasza oczekujących zmian infrastruktury.
diagnostics.condition_0: Output może nie istnieć lub wskazywać odtworzony plik north; zachowaj pierwotny provider ID z zamrożonego zapisu. [Przyczyna i kontrola](guides#guide=terraform-3&section=recovery-original-north-output)
diagnostics.condition_1: Istniejący north.txt mógł się zmienić lub stać nieczytelny; porównaj treść z dostarczoną konfiguracją przed zmianą state. [Przyczyna i kontrola](guides#guide=terraform-3&section=recovery-existing-north-content)
diagnostics.condition_2: Dostarczona konfiguracja dodaje south.txt bez apply; pliku może brakować lub mieć inną treść, dopóki plan odtwarzania nie utworzy trasy. [Przyczyna i kontrola](guides#guide=terraform-3&section=recovery-missing-south-content)
diagnostics.recovery_bindings: Ponowny apply może odtworzyć guardian, a cały stary checkpoint usuwa progress; przywróć tylko brakujące powiązanie i oba zamrożone ID operacji. Błąd tofu show lub błędny JSON też daje tę diagnostykę. [Przyczyna i kontrola](guides#guide=terraform-3&section=recovery-merge-old-binding-with-new-progress)
diagnostics.condition_3: Pozostałe wpisy state mogą wskazywać inne pliki lub powielać trasę; po zachowaniu dwóch companions potrzebny jest jeden managed local_file dla north.txt i south.txt. [Przyczyna i kontrola](guides#guide=terraform-3&section=recovery-two-managed-route-targets)
diagnostics.recovery_binding_plan: Brakujący/stary recovery-plan.json lub plan zastępujący companion nie zachowuje wykonanej pracy; eksportuj plan po przywróceniu powiązania, pozostawiając oba companions no-op z pierwotnymi ID. [Przyczyna i kontrola](guides#guide=terraform-3&section=recovery-plan-preserves-companion-identities)
diagnostics.condition_4: Dodatkowy wpis trasy narusza inwentarz zapisanego planu; artefakt opisuje dwie trasy i dwa zachowane companions operacji. [Przyczyna i kontrola](guides#guide=terraform-3&section=recovery-plan-route-inventory)
diagnostics.condition_5: Zapisany plan może zastępować/zmieniać north.txt lub używać innego ID; zachowaj istniejącą trasę no-op z zamrożoną tożsamością providera. [Przyczyna i kontrola](guides#guide=terraform-3&section=recovery-plan-existing-route-no-op)
diagnostics.condition_6: Artefakt mógł zostać wyeksportowany po apply, gdy south.txt jest no-op, lub pomijać trasę; zachowaj plan sprzed apply tworzący south.txt. [Przyczyna i kontrola](guides#guide=terraform-3&section=recovery-plan-only-missing-route-create)
diagnostics.recovery_backup: Nadpisanie zaufanego checkpoint lub backup po odtworzeniu traci wymagane dane; zachowaj bajty checkpoint i nowszy częściowy state z pierwotnym lineage, serial i ID obiektów. [Przyczyna i kontrola](guides#guide=terraform-3&section=recovery-trusted-checkpoint-and-partial-backup)
diagnostics.condition_7: Niezastosowana konfiguracja, drift plików lub błąd plan może dać niezerowy kod końcowy; sprawdź proponowane zmiany po zastosowaniu zachowanego planu odtwarzania. [Przyczyna i kontrola](guides#guide=terraform-3&section=recovery-final-converged-plan)
diagnostics.probe_0_2: Obserwacja state może zawieść przed sprawdzeniem powiązań, np. przy braku startu tofu lub importów helper; zwykły niezerowy kod/błędny JSON tofu daje recovery_bindings. [Przyczyna i kontrola](guides#guide=terraform-3&section=recovery-state-helper-startup)
diagnostics.probe_0_3: Observer planu może zawieść przed konkretnym markerem przy importach lub nieoczekiwanej strukturze artefaktu; brakujący/błędny recovery-plan.json daje recovery_binding_plan. [Przyczyna i kontrola](guides#guide=terraform-3&section=recovery-plan-helper-startup)
