title: Partial state recovery
brief: |-
  The requested delivery is incomplete.

  Work on the workstation in `~/quest` with `main.tf`.

  **Requirements:**
  - Root outputs:
    - Output name: `north_id`.
    - The `north_id` output retains the resource ID originally assigned by the provider.
  - Files on the workstation:
    - `~/quest/north.txt`: `north-71`.
    - `~/quest/south.txt`: `south-71`.
  - OpenTofu state:
    - OpenTofu tracks exactly the two managed files defined in the supplied configuration.
  - Saved recovery plan on the workstation:
    - Path: `~/quest/recovery-plan.json`.
    - Workstation `recovery-plan.json` records exactly two resource entries: the existing managed file stays unchanged and only the missing managed file is created.
  - Infrastructure convergence:
    - No pending infrastructure changes; detailed-plan exit code `0`.

  The check inspects current state and saved plan data; it does not prove that this exact plan was applied.
debrief: The recorded north ID, file contents, state addresses and saved recovery plan match the checks,
  and the final plan has no changes.
stages.0.brief: Complete the delivery while retaining the recorded identity.
hints.0.text: An interrupted apply can leave valid resources already recorded in state.
hints.1.text: |-
  The interrupted apply already recorded north; south still needs creation.

  Inspect the supplied configuration and live observations on the workstation:

  ```sh
  cat main.tf
  tofu state list
  ls -l north.txt south.txt
  ```
hints.2.text: |-
  Apply the saved plan with north no-op and south create.
  Save the binary plan and export it with tofu show -json to the requested JSON artifact.

  Verify the result from `~/quest` on the workstation:

  - `cat north.txt south.txt` — Shows `north-71` and `south-71` respectively.
  - `tofu output -raw north_id; printf '\n'; cat /run/dq/facts/0/original-north-id; tofu show -no-color` — The IDs agree; state contains exactly `north.txt` and `south.txt`.
  - `jq -r '.resource_changes[] | .address + " " + (.change.actions | join(","))' recovery-plan.json; tofu plan -input=false -detailed-exitcode -no-color` — The saved plan has two entries: `no-op` for `north.txt`, `create` for `south.txt`; current planning exits `0`.

  State tracks exactly north.txt and south.txt. The saved plan retains the original file ID with no-op and creates only the missing file.
phrases.0: I inspected partial state before retrying an apply.
phrases.1: I preserved the resource that was already managed correctly.
phrases.2: I verified the saved recovery plan and final empty plan.
diagnostics.condition_0: /run/dq/facts/0/original-north-id must be nonempty, and tofu output -raw north_id
  must equal it.
diagnostics.condition_1: north.txt must equal north-71.
diagnostics.condition_2: south.txt must equal south-71.
diagnostics.condition_3: |-
  OpenTofu state must track exactly the configured north.txt and south.txt files.

diagnostics.condition_4: recovery-plan.json resource_changes length must equal 2.
diagnostics.condition_5: |-
  recovery-plan.json must leave the original north.txt resource unchanged with its original provider ID.

diagnostics.condition_6: |-
  recovery-plan.json must create the missing south.txt resource.

diagnostics.condition_7: The OpenTofu detailed plan must exit with code 0.
stages.0.objectives.0.text: The `north_id` output retains the resource ID originally assigned by the provider.
stages.0.objectives.1.text: On the workstation, `north.txt` contains `north-71`; `south.txt` contains
  `south-71`.
stages.0.objectives.2.text: OpenTofu tracks exactly the two managed files defined in the supplied configuration.
stages.0.objectives.3.text: 'Workstation `recovery-plan.json` records exactly two resource entries: the
  existing managed file stays unchanged and only the missing managed file is created.'
stages.0.objectives.4.text: OpenTofu reports no pending infrastructure changes.
