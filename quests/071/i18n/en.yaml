title: Partial state recovery
brief: |
  The requested delivery is incomplete.

  Work on the workstation in `~/quest` with `main.tf`.

  **Requirements:**
  - Root outputs:
    - Output name: `north_id`.
    - Matching receipt on the workstation: `/run/dq/facts/0/original-north-id`.
  - Files on the workstation:
    - `~/quest/north.txt`: `north-71`.
    - `~/quest/south.txt`: `south-71`.
  - OpenTofu state:
    - Exact inventory: `local_file.north`, `local_file.south`.
  - Saved recovery plan on the workstation:
    - Path: `~/quest/recovery-plan.json`.
    - Exactly two entries: `local_file.north` — `no-op`; `local_file.south` — `create`.
  - Infrastructure convergence:
    - No pending infrastructure changes; detailed-plan exit code `0`.

  **Verify yourself before Check & finish:**
  - `cat north.txt south.txt` — Shows `north-71` and `south-71` respectively.
  - `tofu output -raw north_id; printf '\n'; cat /run/dq/facts/0/original-north-id; tofu show -no-color` — The IDs agree; state contains exactly `local_file.north` and `local_file.south`.
  - `jq -r '.resource_changes[] | .address + " " + (.change.actions | join(","))' recovery-plan.json; tofu plan -input=false -detailed-exitcode -no-color` — The saved plan has two entries: `no-op` for `local_file.north`, `create` for `local_file.south`; current planning exits `0`.

  The check inspects current state and saved plan data; it does not prove that this exact plan was applied.
debrief: The recorded north ID, file contents, state addresses and saved recovery plan match the checks, and the
  final plan has no changes.
stages.0.brief: Complete the delivery while retaining the recorded identity.
hints.0.text: An interrupted apply can leave valid resources already recorded in state.
hints.1.text: The interrupted apply already recorded north; south still needs creation.
hints.2.text: |-
  Apply the saved plan with north no-op and south create.
  Save the binary plan and export it with tofu show -json to the requested JSON artifact.
phrases.0: I inspected partial state before retrying an apply.
phrases.1: I preserved the resource that was already managed correctly.
phrases.2: I verified the saved recovery plan and final empty plan.
diagnostics.condition_0: /run/dq/facts/0/original-north-id must be nonempty, and tofu output -raw north_id must
  equal it.
diagnostics.condition_1: north.txt must equal north-71.
diagnostics.condition_2: south.txt must equal south-71.
diagnostics.condition_3: tofu state list must equal {local_file.north, local_file.south}.
diagnostics.condition_4: recovery-plan.json resource_changes length must equal 2.
diagnostics.condition_5: recovery-plan.json must include an entry for local_file.north with actions ["no-op"].
diagnostics.condition_6: recovery-plan.json must include an entry for local_file.south with actions ["create"].
diagnostics.condition_7: The OpenTofu detailed plan must exit with code 0.
stages.0.objectives.0.text: The `north_id` output matches workstation `/run/dq/facts/0/original-north-id`.
stages.0.objectives.1.text: On the workstation, `north.txt` contains `north-71`; `south.txt` contains `south-71`.
stages.0.objectives.2.text: OpenTofu state contains exactly `local_file.north`, `local_file.south`.
stages.0.objectives.3.text: 'Workstation `recovery-plan.json` records exactly two resource entries: `no-op` for
  `local_file.north` and `create` for `local_file.south`.'
stages.0.objectives.4.text: OpenTofu reports no pending infrastructure changes.
