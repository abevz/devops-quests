title: Partial state recovery
brief: 'Work in `~/quest` and read `main.tf` and `original-north-id`. An interrupted apply created the north file and its state entry, but not south. The original north ID is also frozen at `/run/dq/facts/0/original-north-id`. Use the supplied offline provider. The linked guide introduces OpenTofu state and the hints describe no-op and create actions.


  Save a binary recovery plan and export it with `tofu show -json` to `recovery-plan.json`, then apply. Verify that the root output `north_id` equals the frozen ID, `north.txt` contains `north-71` and `south.txt` contains `south-71`, and state contains exactly `local_file.north` and `local_file.south`. The saved JSON plan must have exactly two resource changes: north with actions `["no-op"]` and south with `["create"]`. Finally `tofu plan -input=false -detailed-exitcode -no-color` must exit 0 (no changes). The check inspects current state and the saved JSON, not whether that exact plan was applied. Work only inside the bay.'
debrief: The recorded north ID, file contents, state addresses and saved recovery plan match the checks, and the final plan has no changes.
stages.0.brief: The frozen north ID, two files, exact state addresses and saved plan match the brief, and the final plan exits 0.
stages.0.objectives.0.text: The frozen north ID, two files, exact state addresses and saved plan match the brief, and the final plan exits 0.
hints.0.text: An interrupted apply can leave valid resources already recorded in state.
hints.1.text: Review no-op and create separately before approving recovery.
hints.2.text: Apply the saved plan with north no-op and south create; verify identity
  and contents.
phrases.0: I inspected partial state before retrying an apply.
phrases.1: I preserved the resource that was already managed correctly.
phrases.2: I verified the saved recovery plan and final empty plan.
