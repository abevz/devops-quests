title: Partial state recovery
brief: 'An interrupted local rollout created north.txt and recorded it in state, but never created south.txt.
  The configuration now describes both. Inspect state and save recovery-plan.json before applying. Create
  only the missing south resource, retaining the north provider ID and content. No state deletion, import
  or cloud access is needed; use the supplied offline local provider. Original north identity is frozen
  under /run/dq/facts/0/.


  Quest files in `~/quest` (some appear in later stages): `main.tf`, `original-north-id`, `north.txt`,
  `south.txt`, `recovery-plan.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: Only south is created, north keeps its frozen provider ID, both files are
  correct and the final plan is empty.'
debrief: The interrupted rollout was reconciled without replacing the already healthy resource.
stages.0.brief: 'Only south is created, north keeps its frozen provider ID, both files are correct and
