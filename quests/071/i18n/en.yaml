title: Partial state recovery
brief: |-
  Delivery is incomplete, and the retained checkpoints describe different sets of completed work. Complete recovery without discarding newer progress.

  Work in `~/quest` on the workstation with `main.tf` and `recovery-checkpoint.tfstate`.

  **Requirements:**

  - The `north_id` output retains its original provider ID.
  - On the workstation, `north.txt` and `south.txt` match their supplied configuration.
  - State tracks exactly both route files and preserves the two recorded operation identities.
  - `recovery-plan.json` preserves existing identities and creates only the missing file; the checkpoint and pre-recovery backup remain valid.
  - OpenTofu reports no pending infrastructure changes.
  - Keep the supplied checkpoint unchanged and retain every recorded completed operation from the newer partial state.
  - Workstation `~/quest/before-recovery.tfstate` represents the supplied partial state before recovery, with the same lineage, serial and completed-object IDs.
  - Workstation `~/quest/recovery-plan.json` contains two route-file entries: the original file is unchanged and only the missing file is created. Both operation companions have no-op entries with their recorded IDs. No unrelated entries are allowed.
  - The managed files are `~/quest/north.txt` and `~/quest/south.txt` on the workstation. Preserve the existing file’s content and complete the missing file from the supplied configuration.

  Checks inspect current state, retained artifacts and read-only plans; they do not prove which exact plan was applied or the complete command history.
debrief: The older checkpoint contained the missing binding but lacked a later completed operation. Recovering
  only that binding retained both operation identities and the original route; the saved plan then created
  the missing route without replacing existing work.
stages.0.brief: Recover the incomplete binding while retaining newer completed work.
hints.0.text: A configuration, an older complete checkpoint and a newer partial state can all be internally
  valid while describing different work. A blind retry or whole-checkpoint rollback can change an identity.
hints.1.text: |-
  Compare configuration with the current and retained state inventories. Read the proposed actions and identify what is present only in the older checkpoint and what exists only in newer state.

  Compare the lineage, serial and resource IDs in current state and the checkpoint. Locate the original partial-state backup requirement in the brief and inspect which binding is absent only from the current inventory.

  ```sh
  cat main.tf
  tofu state list
  tofu state list -state=recovery-checkpoint.tfstate
  jq '{file:input_filename,lineage,serial,resources:[.resources[] | {module,type,name,ids:[.instances[].attributes.id]}]}' terraform.tfstate recovery-checkpoint.tfstate
  tofu plan -input=false -no-color
  ```
hints.2.text: |-
  Verify the retained input, backup lineage/serial, plan actions and final convergence.

  ```sh
  tofu state list
  tofu output -raw north_id
  jq '[.resource_changes[] | {address,mode,type,actions:.change.actions,before_id:.change.before.id,after_id:.change.after.id,before_file:.change.before.filename,after_file:.change.after.filename}]' recovery-plan.json
  jq '{file:input_filename,lineage,serial,resources:[.resources[] | {module,type,name,ids:[.instances[].attributes.id]}]}' before-recovery.tfstate recovery-checkpoint.tfstate
  tofu plan -input=false -detailed-exitcode -no-color
  ```

  Match `before-recovery.tfstate` to the partial-state values observed before recovery. The retained checkpoint is a separate earlier receipt. In `recovery-plan.json`, the existing north file and both operation identities must be `no-op`, and the missing south file must be `create`. The two operation IDs must match their recorded values before and after in the plan.
phrases.0: I inspected partial state before retrying an apply.
phrases.1: I preserved the resource that was already managed correctly.
phrases.2: I verified the saved recovery plan and final empty plan.
stages.0.objectives.0.text: The `north_id` output retains its original provider ID.
stages.0.objectives.1.text: On the workstation, `north.txt` and `south.txt` match their supplied configuration.
stages.0.objectives.2.text: State tracks exactly both route files and preserves the two recorded operation
  identities.
stages.0.objectives.3.text: '`recovery-plan.json` preserves existing identities and creates only the missing
  file; the checkpoint and pre-recovery backup remain valid.'
stages.0.objectives.4.text: OpenTofu reports no pending infrastructure changes.
diagnostics.condition_0: The output may be absent or refer to a recreated north file; retain the original provider ID from the frozen receipt. [Cause and check](guides#guide=terraform-3&section=recovery-original-north-output)
diagnostics.condition_1: The existing north.txt may have been edited or become unreadable; compare its content with the retained configuration before changing state. [Cause and check](guides#guide=terraform-3&section=recovery-existing-north-content)
diagnostics.condition_2: The supplied configuration adds south.txt without applying it; a missing or different file can remain until the recovery plan creates the declared route. [Cause and check](guides#guide=terraform-3&section=recovery-missing-south-content)
diagnostics.recovery_bindings: A blind retry can recreate guardian, while restoring the whole old checkpoint discards progress; restore only the missing binding and retain both frozen operation IDs. Failed or invalid tofu show output also reaches this diagnostic. [Cause and check](guides#guide=terraform-3&section=recovery-merge-old-binding-with-new-progress)
diagnostics.condition_3: The remaining state entries may target different files or duplicate a route; require exactly one managed local_file for each north.txt and south.txt after retaining both companions. [Cause and check](guides#guide=terraform-3&section=recovery-two-managed-route-targets)
diagnostics.recovery_binding_plan: A missing/stale recovery-plan.json or a plan that replaces an operation companion cannot preserve completed work; export the recovery plan after restoring the binding and keep both companions no-op with their original IDs. [Cause and check](guides#guide=terraform-3&section=recovery-plan-preserves-companion-identities)
diagnostics.condition_4: An unrelated route entry would violate the saved-plan inventory; the recovery artifact describes the two routes alongside the two retained operation companions. [Cause and check](guides#guide=terraform-3&section=recovery-plan-route-inventory)
diagnostics.condition_5: The saved plan may replace or modify north.txt, or use a different original ID; keep its existing route entry no-op with the frozen provider identity. [Cause and check](guides#guide=terraform-3&section=recovery-plan-existing-route-no-op)
diagnostics.condition_6: The artifact may have been exported after apply, leaving south.txt no-op, or may omit the missing route; retain the pre-apply plan that creates south.txt. [Cause and check](guides#guide=terraform-3&section=recovery-plan-only-missing-route-create)
diagnostics.recovery_backup: Overwriting the trusted checkpoint or backing up state after recovery loses the required evidence; retain checkpoint bytes and the newer partial state with its original lineage, serial and completed-object IDs. [Cause and check](guides#guide=terraform-3&section=recovery-trusted-checkpoint-and-partial-backup)
diagnostics.condition_7: Unapplied configuration, file drift or a planning error can leave the final detailed plan nonzero; inspect its proposed changes after applying the retained recovery plan. [Cause and check](guides#guide=terraform-3&section=recovery-final-converged-plan)
diagnostics.probe_0_2: The state observer may fail before inspecting bindings, for example if tofu cannot start or helper imports fail; ordinary nonzero/invalid tofu JSON instead reaches recovery_bindings. [Cause and check](guides#guide=terraform-3&section=recovery-state-helper-startup)
diagnostics.probe_0_3: The plan observer may fail before producing a specific marker, for example during imports or unexpected artifact traversal; ordinary missing/invalid recovery-plan.json reaches recovery_binding_plan. [Cause and check](guides#guide=terraform-3&section=recovery-plan-helper-startup)
