hints.0.text: An interrupted apply can leave valid resources already recorded in state.
hints.1.text: Review no-op and create separately before approving recovery.
hints.2.text: Apply the saved plan with north no-op and south create; verify identity and contents.
phrases.0: I inspected partial state before retrying an apply.
phrases.1: I preserved the resource that was already managed correctly.
phrases.2: I verified the saved recovery plan and final empty plan.
