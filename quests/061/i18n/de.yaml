title: Git-Anmeldeinformationen
brief: |
  Die über Git verwaltete Version von `board` ist nicht verfügbar.

  Arbeite auf der Workstation in `~/quest` mit `platform.env`, `application.yaml`, `release-commit`.

  **Anforderungen:**
  - Spielerzugriff in `ARGO_NAMESPACE`:
    - `patch secret/station-repository`: `yes`.
    - `list secrets`, `patch secret/unrelated`: `no`.
  - Repository-Secret in `ARGO_NAMESPACE`:
    - Name: `station-repository`.
    - Das Passwort entspricht `GIT_PASSWORD` in der Workstation-Datei `~/quest/platform.env`.
  - Application im Bay-Namespace:
    - Name: `board`.
    - Repository: `GIT_URL` aus der Workstation-Datei `~/quest/platform.env`.
    - Branch und Quellverzeichnis: `main`, `manifests`.
  - Beobachtetes Application-Ergebnis:
    - Status: `Synced`, `Healthy`.
    - Die synchronisierte Revision entspricht der Workstation-Datei `~/quest/release-commit`.
  - Deployment im Bay-Namespace:
    - Name: `board`.
    - Rollout abgeschlossen.
  - HTTP in einem Pod von Deployment `board`:
    - Pfad: `http://board:8080`.
    - Antwort: `north-61`.

  **Selbstprüfung vor Check & finish:**
  - `source platform.env; kubectl auth can-i patch secret/station-repository -n "$ARGO_NAMESPACE"; kubectl auth can-i list secrets -n "$ARGO_NAMESPACE" || true; kubectl auth can-i patch secret/unrelated -n "$ARGO_NAMESPACE" || true; kubectl -n "$ARGO_NAMESPACE" get secret station-repository -o json | jq -e '(.data.password|@base64d)==env.GIT_PASSWORD'` — Die Autorisierungsantworten sind `yes`, `no`, `no`; der Zugangsdatenvergleich gibt `true` aus, ohne das Passwort offenzulegen.
  - `kubectl get application board -o custom-columns=NAME:.metadata.name,PROJECT:.spec.project,REPO:.spec.source.repoURL,PATH:.spec.source.path,BRANCH:.spec.source.targetRevision,NAMESPACE:.spec.destination.namespace,SERVER:.spec.destination.server,SYNC:.status.sync.status,HEALTH:.status.health.status,REVISION:.status.sync.revision; cat release-commit` — Zeigt das bereitgestellte Repository, `main` / `manifests`, `Synced` / `Healthy` und eine Revision gleich dem erfassten Commit.
  - `kubectl rollout status deployment/board --timeout=10s; kubectl exec --pod-running-timeout=5s deployment/board -- wget -qO- -T 3 http://board:8080` — Der Rollout wird abgeschlossen; HTTP liefert `north-61`.
debrief: Ein reines Spiel-Repository credential wurde ohne allgemeinen Plattformzugriff Secret repariert.
stages.0.brief: Die veröffentlichte Version muss innerhalb des erlaubten Zugangsdatenbereichs verfügbar sein.
hints.0.text: Trennen Sie die Git-Authentifizierung von Quellpfad- und workload-Fehlern.
hints.1.text: Das veraltete Passwort liegt im benannten Secret station-repository in ARGO_NAMESPACE; eine Workload-Änderung
  repariert diese Authentifizierung nicht. Gib das Passwort nie aus.
hints.2.text: Patche stringData.password und fordere einen Hard Refresh an.
phrases.0: Ich habe die Repository-Authentifizierung diagnostiziert, bevor ich die Anwendung geändert habe.
phrases.1: Ich habe die Reparatur von credential auf eine mit dem Namen Secret beschränkt.
phrases.2: Ich habe den Git revision und den tatsächlichen endpoint nach dem Abgleich überprüft.
questions.0.points.0: Untersuchen Sie Repository-Abruffehler und Application conditions.
questions.0.points.1: Vergleichen Sie gewünschte und beobachtete Revisionen vor dem rollout-Gesundheitszustand.
questions.0.points.2: Überprüfen Sie den workload unabhängig, nachdem die Authentifizierung erfolgreich war.
questions.0.prompt: Wie unterscheidet man fehlerhafte Git credentials von einer fehlerhaften Bereitstellung?
questions.1.points.0: Beschränken Sie einen Role durch resourceNames auf einen Secret.
questions.1.points.1: Binden Sie nur den Bay-Player ServiceAccount.
questions.1.points.2: Überprüfen Sie die Ablehnung nicht verwandter Geheimnisse und die Auflistung.
questions.1.prompt: Was ist die kleinste erforderliche Genehmigung für diese Reparatur?
stages.0.objectives.0.text: In `ARGO_NAMESPACE` darf der Spieler Secret `station-repository` patchen, darf Secrets
  nicht auflisten und Secret `unrelated` nicht patchen.
stages.0.objectives.1.text: Secret `station-repository` in `ARGO_NAMESPACE` hat das Passwort aus der Workstation-Datei
  `platform.env` (`GIT_PASSWORD`).
stages.0.objectives.2.text: Application `board` verfolgt `main` / `manifests` im privaten Repository aus der Workstation-Datei
  `platform.env` (`GIT_URL`).
stages.0.objectives.3.text: Application `board` meldet `Synced` und `Healthy` für `~/quest/release-commit`.
stages.0.objectives.4.text: Deployment `board` schließt seinen Rollout im Bay-Namespace ab.
stages.0.objectives.5.text: In einem Pod von Deployment `board` liefert `http://board:8080` den Wert `north-61`.
