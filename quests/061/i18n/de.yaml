title: Git-Anmeldeinformationen
brief: 'Argo CD kann das private Gitea-Repository nicht lesen, da das gespeicherte Kennwort retired lautet.
  Reparieren Sie nur station-repository in ARGO_NAMESPACE mit den aktuellen Spielzugangsdaten in platform.env.
  Ihre Spieleridentität kann get/patch/update oder Secret sein; Es kann keine Plattformgeheimnisse auflisten
  oder andere credentials bearbeiten. Der Application weist bereits auf die Verifizierung des main/manifests.
  und die north-61 HTTP-Antwort hin.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `platform.env`, `repository/manifests/board.json`,
  `repository/manifests/service.json`, `release-commit`, `application.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: Das Repository Secret verfügt über das aktuelle Passwort, der Plattformzugriff
  bleibt eingeschränkt und Argo stellt den aufgezeichneten Commit mit HTTP north-61 bereit.'
debrief: Ein reines Spiel-Repository credential wurde ohne allgemeinen Plattformzugriff Secret repariert.
stages.0.brief: 'Erfolgskriterien: Das Repository Secret hat das aktuelle Passwort, der Plattformzugriff
  bleibt eingeschränkt und Argo stellt den aufgezeichneten Commit mit HTTP north-61 bereit.'
stages.0.objectives.0.text: Das Repository Secret hat das aktuelle Passwort, der Plattformzugriff bleibt
  eingeschränkt und Argo stellt den aufgezeichneten Commit mit HTTP north-61 bereit.
hints.0.text: Trennen Sie die Git-Authentifizierung von Quellpfad- und workload-Fehlern.
hints.1.text: Überprüfen Sie nur das genannte Secret in ARGO_NAMESPACE; Drucken Sie niemals sein Passwort
  aus.
hints.2.text: Patchen Sie stringData.password, fordern Sie einen hard refresh an und überprüfen Sie dann
  revision und HTTP.
phrases.0: Ich habe die Repository-Authentifizierung diagnostiziert, bevor ich die Anwendung geändert
  habe.
phrases.1: Ich habe die Reparatur von credential auf eine mit dem Namen Secret beschränkt.
phrases.2: Ich habe den Git revision und den tatsächlichen endpoint nach dem Abgleich überprüft.
questions.0.points.0: Untersuchen Sie Repository-Abruffehler und Application conditions.
questions.0.points.1: Vergleichen Sie gewünschte und beobachtete Revisionen vor dem rollout-Gesundheitszustand.
questions.0.points.2: Überprüfen Sie den workload unabhängig, nachdem die Authentifizierung erfolgreich
  war.
questions.0.prompt: Wie unterscheidet man fehlerhafte Git credentials von einer fehlerhaften Bereitstellung?
questions.1.points.0: Beschränken Sie einen Role durch resourceNames auf einen Secret.
questions.1.points.1: Binden Sie nur den Bay-Player ServiceAccount.
questions.1.points.2: Überprüfen Sie die Ablehnung nicht verwandter Geheimnisse und die Auflistung.
questions.1.prompt: Was ist die kleinste erforderliche Genehmigung für diese Reparatur?
