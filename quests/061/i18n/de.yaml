title: Git-Anmeldeinformationen
brief: 'Die über Git verwaltete Version von `board` ist nicht verfügbar.


  Arbeiten Sie auf der Workstation in `~/quest` mit `platform.env`, `application.yaml`.


  **Anforderungen:**

  - Im Controller-Namespace kann der Spieler das vorhandene Secret mit Repository-Zugangsdaten aktualisieren, aber
  keine Secrets auflisten oder ein unbeteiligtes Secret aktualisieren.

  - Das vorhandene Secret mit Repository-Zugangsdaten entspricht den mitgelieferten privaten Git-Zugangsdaten.

  - Application `board` stellt die mitgelieferte Version aus dem privaten Git-Repository bereit.

  - Application `board` meldet `Synced` und `Healthy` für die ursprünglich veröffentlichte Version.

  - Deployment `board` schließt seinen Rollout im Bay-Namespace ab.

  - In einem Pod von Deployment `board` liefert `http://board:8080` den Wert `north-61`.


  Untersuche auch `delivery-access.json`. Stelle den Zugriff des Git-Clients der Workstation und des Delivery-Controllers
  auf das ursprüngliche private Repository und die veröffentlichte Referenz wieder her. Bewahre die Identitäten
  der ursprünglichen Application und des Zugangsdaten-Secrets sowie die bestehende enge Berechtigung. Die Controller-Zugangsdaten
  müssen ihre maßgebliche Repository-Bindung und ihren ursprünglichen Wert behalten. Git-Konfigurationsdateien mit
  aktuellen Zugangsdaten dürfen nur dem Eigentümer zugänglich sein.


  Der Ausgangsbeleg unter `/run/dq/facts/0/` ist maßgeblich; Dateien in `~/quest` sind Arbeitskopien. URL-Umschreibungen
  dürfen den ursprünglichen Repository-Server nicht ersetzen.'
debrief: Du hast zwei unabhängige Git-Authentifizierungskontexte wiederhergestellt, Bindungen und Objektidentitäten
  bewahrt und die Berechtigungen eng gehalten.
stages.0.brief: Die veröffentlichte Version muss innerhalb des erlaubten Zugangsdatenbereichs verfügbar sein.
hints.0.text: Workstation und Delivery-Controller authentifizieren sich unabhängig. Die Reparatur eines Clients
  belegt keinen Zugriff des anderen.
hints.1.text: |-
  Vergleiche `delivery-access.json`, die Speicherorte der wirksamen Git-Konfiguration der Workstation, die Metadaten des bestehenden Secrets und Repository-Abruffehler der Application. Untersuche Namen und Rechte, ohne Authentifizierungswerte auszugeben.

  Suche die Repository-Identität in der Application-Quelle und vergleiche sie mit der lokalen Git-Konfiguration und den Metadaten des benannten Secrets. Prüfe, welche Ressourcennamen und Verben die gebundene Role erlaubt.
hints.2.text: |-
  Prüfe `git -C repository ls-remote $GIT_URL refs/heads/main`, die ursprüngliche veröffentlichte Revision, Application-Gesundheit und echtes HTTP. Prüfe die engen Berechtigungen und ursprünglichen Objekt-UIDs erneut.

  Der benannte Secret muss patchbar sein. Das Auflisten von Secrets und Patchen des fremden Secrets muss `no` liefern. Vergleiche ursprüngliche UIDs und Revision mit der aktuellen Application und den Secret-Metadaten. Die Anwendung muss `north-61` liefern.

  ```bash
  source platform.env
  git -C repository ls-remote "$GIT_URL" refs/heads/main
  jq '{credentialName,credentialNamespace,credentialUID,applicationUID,revision}' delivery-access.json
  kubectl auth can-i patch secret/station-repository -n "$ARGO_NAMESPACE"
  kubectl auth can-i list secrets -n "$ARGO_NAMESPACE" || test "$?" -eq 1
  kubectl auth can-i patch secret/unrelated -n "$ARGO_NAMESPACE" || test "$?" -eq 1
  kubectl get secret station-repository -n "$ARGO_NAMESPACE" -o custom-columns=NAME:.metadata.name,UID:.metadata.uid
  kubectl get application board -o json | jq '{uid:.metadata.uid,sync:.status.sync,health:.status.health}'
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080
  ```
phrases.0: Ich habe die Repository-Authentifizierung diagnostiziert, bevor ich die Anwendung geändert habe.
phrases.1: Ich habe die Reparatur von credential auf eine mit dem Namen Secret beschränkt.
phrases.2: Ich habe den Git revision und den tatsächlichen endpoint nach dem Abgleich überprüft.
questions.0.points.0: Untersuchen Sie Repository-Abruffehler und Application conditions.
questions.0.points.1: Vergleichen Sie gewünschte und beobachtete Revisionen vor dem rollout-Gesundheitszustand.
questions.0.points.2: Überprüfen Sie den workload unabhängig, nachdem die Authentifizierung erfolgreich war.
questions.0.prompt: Wie unterscheidet man fehlerhafte Git credentials von einer fehlerhaften Bereitstellung?
questions.1.points.0: Beschränken Sie einen Role durch resourceNames auf einen Secret.
questions.1.points.1: Binden Sie nur den Bay-Player ServiceAccount.
questions.1.points.2: Überprüfen Sie die Ablehnung nicht verwandter Geheimnisse und die Auflistung.
questions.1.prompt: Was ist die kleinste erforderliche Genehmigung für diese Reparatur?
stages.0.objectives.0.text: Im Controller-Namespace kann der Spieler das vorhandene Secret mit Repository-Zugangsdaten
  aktualisieren, aber keine Secrets auflisten oder ein unbeteiligtes Secret aktualisieren.
stages.0.objectives.1.text: Das vorhandene Secret mit Repository-Zugangsdaten entspricht den mitgelieferten privaten
  Git-Zugangsdaten. Ursprüngliche Zugangsdatenbindung und Objektidentitäten bleiben erhalten. Beide Git-Clients
  erreichen die ursprüngliche veröffentlichte Referenz, und Git-Konfiguration mit Zugangsdaten bleibt privat.
stages.0.objectives.2.text: Application `board` stellt die mitgelieferte Version aus dem privaten Git-Repository
  bereit.
stages.0.objectives.3.text: Application `board` meldet `Synced` und `Healthy` für die ursprünglich veröffentlichte
  Version.
stages.0.objectives.4.text: Deployment `board` schließt seinen Rollout im Bay-Namespace ab.
stages.0.objectives.5.text: In einem Pod von Deployment `board` liefert `http://board:8080` den Wert `north-61`.
diagnostics.credential_identity: Die UID des Repository-Secrets wurde geändert; eine Neuerstellung von station-repository erhält den Namen, verliert jedoch das beim Setup erfasste ursprüngliche Zugangsdatenobjekt. [Ursache und Prüfung](guides#guide=gitops-delivery&section=delivery-original-secret-identity)
diagnostics.credential_binding: Das ursprüngliche Secret bezeichnet das gelieferte Git-Repository und Konto nicht mehr als Argo-Zugangsdaten; die veraltete URL, geänderte username/type oder ein fehlendes repository Label verhindern die Verwendung. [Ursache und Prüfung](guides#guide=gitops-delivery&section=delivery-secret-repository-binding)
diagnostics.credential_value: Das Secret-Passwort entspricht nicht dem geschützten freigegebenen Wert; das gelieferte veraltete Passwort oder eine unvollständige Korrektur verhindert möglicherweise Argos Anmeldung am ursprünglichen Repository. [Ursache und Prüfung](guides#guide=gitops-delivery&section=delivery-approved-secret-password)
diagnostics.application_identity: Die UID der Application board wurde geändert; Löschen und Neuerstellen ersetzt die ursprüngliche Bereitstellungsidentität, selbst wenn Name und Manifeste gleich bleiben. [Ursache und Prüfung](guides#guide=gitops-delivery&section=delivery-original-application-identity)
diagnostics.git_storage: Eine geprüfte Git-Konfiguration enthält das Passwort oder dessen Basic-Kodierung und gewährt Gruppen-/Fremdrechte; ein korrigierter Header in einer allgemein zugänglichen Konfiguration kann die funktionierenden Zugangsdaten offenlegen. [Ursache und Prüfung](guides#guide=gitops-delivery&section=delivery-private-git-configuration)
diagnostics.git_target: Git löst die gelieferte Repository-URL zu einer anderen Gegenstelle oder einem anderen Pfad auf; eine URL-Umschreibung kann die Workstation trotz zufällig passender Branch auf ein anderes Repository lenken. [Ursache und Prüfung](guides#guide=gitops-delivery&section=delivery-direct-git-authority)
diagnostics.git_access: Das ursprüngliche Repository kann nicht abgefragt werden oder main weicht vom geschützten Release ab; der veraltete Authorization-Header auf der Workstation, fehlender Zugriff oder eine geänderte Remote-Publikation können die Ursache sein. [Ursache und Prüfung](guides#guide=gitops-delivery&section=delivery-authenticated-remote-main)
diagnostics.git_budget: Eine Git- oder Kubernetes-Beobachtung überschritt Befehls- oder Gesamtfrist; langsame API, Netzwerk- oder Authentifizierungsendpunkte verhindern rechtzeitige Zugriffsvergleiche. [Ursache und Prüfung](guides#guide=gitops-delivery&section=delivery-access-observation-budget)
diagnostics.git_observation: Der Bereitstellungszugriff konnte nicht beobachtet werden; fehlender geschützter Beleg oder Objekte, ungültiges JSON beziehungsweise Zugangsdatenkodierung, unlesbare Git-Konfiguration oder API-Fehler können die Ursache sein. [Ursache und Prüfung](guides#guide=gitops-delivery&section=delivery-access-observation-inputs)
diagnostics.probe_0_1: Der alte Secret-Passwortvergleich schlug fehl oder die Zugriffsprüfung endete vor einem benannten Marker; ein nicht korrigiertes Passwort, geänderte Erwartung in platform.env oder fehlende Umgebungs-/Python-Eingaben können die Ursache sein. [Ursache und Prüfung](guides#guide=gitops-delivery&section=delivery-password-gate-and-startup)
diagnostics.delivery_permissions: Der erforderliche begrenzte Secret-Zugriff wurde nicht bestätigt; fehlendes patch für station-repository, falscher Namespace, weitergehende list-/Fremd-Secret-Rechte oder fehlende platform.env beziehungsweise API-Eingaben können die Ursache sein. [Ursache und Prüfung](guides#guide=gitops-delivery&section=delivery-scoped-secret-permissions)
diagnostics.delivery_source: Die Application board wählt nicht das gelieferte Repository, den relativen Pfad manifests und Revision main oder ihre Definition war nicht lesbar; eine veraltete oder geänderte Quelle kann eine andere Publikation abgleichen. [Ursache und Prüfung](guides#guide=gitops-delivery&section=delivery-board-git-source)
diagnostics.delivery_sync: Die Application board ist nicht Synced und Healthy bei release-commit oder ihr Status konnte nicht gelesen werden; korrigierte Zugangsdaten benötigen möglicherweise noch refresh und Abgleich oder ausgewähltes Release und beobachtete Revision weichen ab. [Ursache und Prüfung](guides#guide=gitops-delivery&section=delivery-board-release-adoption)
diagnostics.delivery_rollout: Das Deployment board hat den Rollout nicht innerhalb von 3 Sekunden abgeschlossen; die Git-Bereitstellung hat die Workload möglicherweise noch nicht erzeugt, Pods sind noch nicht verfügbar oder die API-Beobachtung schlug fehl. [Ursache und Prüfung](guides#guide=gitops-delivery&section=delivery-board-workload-rollout)
diagnostics.delivery_http: Der Service-Pfad von board lieferte nicht north-61 oder exec/HTTP schlug fehl; eine noch nicht bereitgestellte Workload, falsches Service-Routing oder veralteter Inhalt verhindert die beabsichtigte Publikation beim Verbraucher. [Ursache und Prüfung](guides#guide=gitops-delivery&section=delivery-board-service-response)
