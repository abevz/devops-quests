title: Poświadczenia Git
brief: 'Argo CD nie może odczytać prywatnego repozytorium Gitea, ponieważ zapisane w nim hasło zostało
  wycofane. Napraw tylko station-repository w ARGO_NAMESPACE, używając aktualnych danych logowania do
  gry w platform.env. Twoja tożsamość gracza może get/patch/update ta Secret; nie może wyświetlać tajemnic
  platformy ani edytować innych poświadczeń. Aplikacja wskazuje już na main/manifests. Sprawdź uzgodnienie
  i odpowiedź north-61 HTTP.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `platform.env`, `repository/manifests/board.json`,
  `repository/manifests/service.json`, `release-commit`, `application.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: repozytorium Secret ma aktualne hasło, dostęp do platformy pozostaje ograniczony,
  a Argo wdraża zarejestrowany commit z HTTP north-61.'
debrief: Repozytorium przeznaczone wyłącznie do gier credential zostało naprawione bez ogólnego dostępu
  do platformy Secret.
stages.0.brief: 'Kryteria sukcesu: Repozytorium Secret ma aktualne hasło, dostęp do platformy pozostaje
  ograniczony, a Argo wdraża zarejestrowany commit z HTTP north-61.'
stages.0.objectives.0.text: Repozytorium Secret ma aktualne hasło, dostęp do platformy pozostaje ograniczony,
  a Argo wdraża zapisane commit z HTTP north-61.
hints.0.text: Oddziel uwierzytelnianie Git od błędów ścieżki źródłowej i workload.
hints.1.text: Sprawdź tylko nazwane Secret w ARGO_NAMESPACE; nigdy nie drukuj jego hasła.
hints.2.text: Popraw stringData.password, poproś o hard refresh, a następnie sprawdź revision i HTTP.
phrases.0: Przed zmianą aplikacji zdiagnozowałem uwierzytelnianie repozytorium.
phrases.1: Ograniczyłem naprawę credential do takiej o nazwie Secret.
phrases.2: Po uzgodnieniu zweryfikowałem Git revision i aktualne endpoint.
questions.0.points.0: Sprawdź błędy pobierania repozytorium i warunki aplikacji.
questions.0.points.1: Porównaj pożądane i zaobserwowane wersje przed stanem rollout.
questions.0.points.2: Sprawdź niezależnie workload po pomyślnym uwierzytelnieniu.
questions.0.prompt: Jak odróżnić złe wdrożenie Git credentials od niezdrowego wdrożenia?
questions.1.points.0: Ogranicz Role przez resourceNames do jednego Secret.
questions.1.points.1: Binduj tylko odtwarzacz zatoki ServiceAccount.
questions.1.points.2: Zweryfikuj odmowę niepowiązanych sekretów i listy.
questions.1.prompt: Jakie jest najmniejsze pozwolenie potrzebne do tej naprawy?
