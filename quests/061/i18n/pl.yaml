title: Poświadczenia Git
brief: 'Zarządzane przez Git wydanie `board` jest niedostępne.


  Pracuj na stacji roboczej w `~/quest` z `platform.env`, `application.yaml`.


  **Wymagania:**

  - W namespace kontrolera gracz może aktualizować istniejący Secret z danymi logowania do repozytorium, ale nie
  może wyświetlać listy Secrets ani aktualizować niezwiązanego Secret.

  - Istniejący Secret z danymi logowania do repozytorium odpowiada dostarczonym prywatnym danym logowania Git.

  - Application `board` wdraża dostarczone wydanie z prywatnego repozytorium Git.

  - Application `board` zgłasza `Synced` i `Healthy` dla pierwotnego opublikowanego wydania.

  - Deployment `board` kończy rollout w przestrzeni nazw zatoki.

  - Wewnątrz Poda Deployment `board` adres `http://board:8080` zwraca `north-61`.


  Sprawdź też `delivery-access.json`. Przywróć dostęp klienta Git stacji i kontrolera dostarczania do pierwotnego
  prywatnego repozytorium oraz opublikowanej referencji. Zachowaj tożsamości pierwotnych Application i Secret z
  poświadczeniami oraz istniejące wąskie uprawnienia. Poświadczenia kontrolera muszą zachować kanoniczne powiązanie
  z repozytorium i pierwotną wartość. Pliki konfiguracji Git zawierające bieżące poświadczenia mają być dostępne
  tylko dla właściciela.


  Zapis początkowy w `/run/dq/facts/0/` jest wiążący; pliki w `~/quest` są kopiami roboczymi. Przepisywanie URL
  nie może zastąpić pierwotnego serwera repozytorium.'
debrief: Przywrócono dwa niezależne konteksty uwierzytelniania Git, zachowano powiązania i tożsamości obiektów oraz
  wąskie uprawnienia.
stages.0.brief: Opublikowane wydanie musi być dostępne w dozwolonym zakresie danych dostępowych.
hints.0.text: Stacja i kontroler dostarczania uwierzytelniają się niezależnie. Naprawa jednego klienta nie dowodzi
  dostępu drugiego.
hints.1.text: |-
  Porównaj `delivery-access.json`, lokalizacje skutecznej konfiguracji Git stacji, metadane istniejącego Secret i błędy pobierania repozytorium przez Application. Sprawdzaj nazwy i uprawnienia bez wypisywania danych uwierzytelniających.

  Znajdź tożsamość repozytorium w źródle Application i porównaj ją z konfiguracją Git oraz metadanymi wskazanego Secretu. Sprawdź, jakie nazwy zasobów i operacje dopuszcza powiązana Role.
hints.2.text: |-
  Sprawdź `git -C repository ls-remote $GIT_URL refs/heads/main`, pierwotną opublikowaną rewizję, zdrowie Application i rzeczywisty HTTP. Ponownie sprawdź wąskie uprawnienia i pierwotne UID obiektów.

  Modyfikowanie wskazanego Secretu musi być dozwolone, a listowanie Secretów i modyfikowanie innego Secretu powinno zwrócić `no`. Porównaj pierwotne UID i rewizję z bieżącą Application i metadanymi Secretu. Odpowiedź aplikacji musi wynosić `north-61`.

  ```bash
  source platform.env
  git -C repository ls-remote "$GIT_URL" refs/heads/main
  jq '{credentialName,credentialNamespace,credentialUID,applicationUID,revision}' delivery-access.json
  kubectl auth can-i patch secret/station-repository -n "$ARGO_NAMESPACE"
  kubectl auth can-i list secrets -n "$ARGO_NAMESPACE" || test "$?" -eq 1
  kubectl auth can-i patch secret/unrelated -n "$ARGO_NAMESPACE" || test "$?" -eq 1
  kubectl get secret station-repository -n "$ARGO_NAMESPACE" -o custom-columns=NAME:.metadata.name,UID:.metadata.uid
  kubectl get application board -o json | jq '{uid:.metadata.uid,sync:.status.sync,health:.status.health}'
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080
  ```
phrases.0: Przed zmianą aplikacji zdiagnozowałem uwierzytelnianie repozytorium.
phrases.1: Ograniczyłem naprawę credential do takiej o nazwie Secret.
phrases.2: Po uzgodnieniu zweryfikowałem Git revision i aktualne endpoint.
questions.0.points.0: Sprawdź błędy pobierania repozytorium i warunki aplikacji.
questions.0.points.1: Porównaj pożądane i zaobserwowane wersje przed stanem rollout.
questions.0.points.2: Sprawdź niezależnie workload po pomyślnym uwierzytelnieniu.
questions.0.prompt: Jak odróżnić złe wdrożenie Git credentials od niezdrowego wdrożenia?
questions.1.points.0: Ogranicz Role przez resourceNames do jednego Secret.
questions.1.points.1: Binduj tylko odtwarzacz zatoki ServiceAccount.
questions.1.points.2: Zweryfikuj odmowę niepowiązanych sekretów i listy.
questions.1.prompt: Jakie jest najmniejsze pozwolenie potrzebne do tej naprawy?
stages.0.objectives.0.text: W namespace kontrolera gracz może aktualizować istniejący Secret z danymi logowania
  do repozytorium, ale nie może wyświetlać listy Secrets ani aktualizować niezwiązanego Secret.
stages.0.objectives.1.text: Istniejący Secret z danymi logowania do repozytorium odpowiada dostarczonym prywatnym
  danym logowania Git. Zachowano pierwotne powiązanie poświadczeń i tożsamości obiektów. Oba klienty Git mają dostęp
  do pierwotnej opublikowanej referencji, a konfiguracja z poświadczeniami pozostaje prywatna.
stages.0.objectives.2.text: Application `board` wdraża dostarczone wydanie z prywatnego repozytorium Git.
stages.0.objectives.3.text: Application `board` zgłasza `Synced` i `Healthy` dla pierwotnego opublikowanego wydania.
stages.0.objectives.4.text: Deployment `board` kończy rollout w przestrzeni nazw zatoki.
stages.0.objectives.5.text: Wewnątrz Poda Deployment `board` adres `http://board:8080` zwraca `north-61`.
diagnostics.credential_identity: UID Secret repozytorium zmienił się; odtworzenie station-repository zachowuje nazwę, lecz traci pierwotny obiekt poświadczeń zapisany przy setup. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=delivery-original-secret-identity)
diagnostics.credential_binding: Pierwotny Secret nie wskazuje dostarczonego repozytorium i konta Git jako poświadczeń Argo; stary URL, zmienione username/type lub brak etykiety repository blokują użycie. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=delivery-secret-repository-binding)
diagnostics.credential_value: Hasło Secret nie odpowiada chronionej zatwierdzonej wartości; dostarczone stare hasło lub niepełna naprawa poświadczeń może blokować uwierzytelnienie Argo w pierwotnym repozytorium. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=delivery-approved-secret-password)
diagnostics.application_identity: UID Application board zmienił się; usunięcie i odtworzenie zastępuje pierwotną tożsamość dostarczenia mimo zachowania nazwy i manifestów. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=delivery-original-application-identity)
diagnostics.git_storage: Sprawdzana konfiguracja Git zawiera hasło lub kodowanie Basic i przyznaje prawa grupie/innym; zapis naprawionego nagłówka w szeroko dostępnej konfiguracji może ujawnić działające poświadczenie. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=delivery-private-git-configuration)
diagnostics.git_target: Git rozwiązuje dostarczony URL na inny adres lub ścieżkę; przepisanie URL może kierować workstation do innego repozytorium mimo przypadkowo zgodnej gałęzi. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=delivery-direct-git-authority)
diagnostics.git_access: Nie można odpytać pierwotnego repozytorium lub main różni się od chronionego wydania; stary nagłówek Authorization na workstation, brak dostępu lub zmieniona zdalna publikacja mogą to wyjaśniać. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=delivery-authenticated-remote-main)
diagnostics.git_budget: Obserwacja Git lub Kubernetes przekroczyła limit polecenia lub całości; wolne API, sieć lub endpoint uwierzytelnienia blokują terminowe porównanie dostępu. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=delivery-access-observation-budget)
diagnostics.git_observation: Nie dało się obserwować dostępu; brak chronionego zapisu lub obiektów, błędny JSON/kodowanie poświadczeń, nieczytelna konfiguracja Git lub błędy API mogą to wyjaśniać. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=delivery-access-observation-inputs)
diagnostics.probe_0_1: Porównanie hasła Secret w kontroli legacy zawiodło lub próba zakończyła się przed markerem; nienaprawione hasło, zmienione oczekiwanie platform.env lub niedostępne dane środowiska/Python mogą to wyjaśniać. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=delivery-password-gate-and-startup)
diagnostics.delivery_permissions: Nie potwierdzono wymaganego wąskiego dostępu do Secret; brak patch dla station-repository, zły namespace, szersze list/prawa innego Secret lub niedostępne platform.env lub API mogą to wyjaśniać. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=delivery-scoped-secret-permissions)
diagnostics.delivery_source: Application board nie wybiera dostarczonego repozytorium, względnej ścieżki manifests i rewizji main lub nie odczytano definicji; stare lub zmienione źródło może uzgadniać inną publikację. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=delivery-board-git-source)
diagnostics.delivery_sync: Application board nie jest Synced i Healthy przy release-commit lub nie odczytano statusu; naprawione poświadczenia mogą wymagać refresh i uzgodnienia albo wybrane wydanie różni się od obserwowanej rewizji. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=delivery-board-release-adoption)
diagnostics.delivery_rollout: Deployment board nie ukończył rollout w 3 sekundy; dostarczenie Git mogło jeszcze nie utworzyć aplikacji, Pody są niedostępne lub obserwacja API zawiodła. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=delivery-board-workload-rollout)
diagnostics.delivery_http: Ścieżka Service board nie zwróciła north-61 lub exec/HTTP zawiódł; niedostarczona aplikacja, błędny routing Service lub stara treść blokuje dotarcie publikacji do odbiorcy. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=delivery-board-service-response)
