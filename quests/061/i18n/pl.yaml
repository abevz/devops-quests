title: Poświadczenia Git
brief: |
  Zarządzane przez Git wydanie `board` jest niedostępne.

  Pracuj na workstation w `~/quest` z plikami `platform.env`, `application.yaml`, `release-commit`.

  **Wymagania:**
  - Dostęp gracza w `ARGO_NAMESPACE`:
    - `patch secret/station-repository`: `yes`.
    - `list secrets`, `patch secret/unrelated`: `no`.
  - Secret repozytorium w `ARGO_NAMESPACE`:
    - Nazwa: `station-repository`.
    - Hasło odpowiada `GIT_PASSWORD` w `~/quest/platform.env` na workstation.
  - Application w przestrzeni nazw zatoki:
    - Nazwa: `board`.
    - Repozytorium: `GIT_URL` z `~/quest/platform.env` na workstation.
    - Gałąź i katalog źródłowy: `main`, `manifests`.
  - Obserwowany wynik Application:
    - Status: `Synced`, `Healthy`.
    - Zsynchronizowana rewizja odpowiada plikowi `~/quest/release-commit` na workstation.
  - Deployment w przestrzeni nazw zatoki:
    - Nazwa: `board`.
    - Rollout zakończony.
  - HTTP wewnątrz Poda Deployment `board`:
    - Ścieżka: `http://board:8080`.
    - Odpowiedź: `north-61`.

  **Sprawdź przed Check & finish:**
  - `source platform.env; kubectl auth can-i patch secret/station-repository -n "$ARGO_NAMESPACE"; kubectl auth can-i list secrets -n "$ARGO_NAMESPACE" || true; kubectl auth can-i patch secret/unrelated -n "$ARGO_NAMESPACE" || true; kubectl -n "$ARGO_NAMESPACE" get secret station-repository -o json | jq -e '(.data.password|@base64d)==env.GIT_PASSWORD'` — Odpowiedzi autoryzacji to `yes`, `no`, `no`; porównanie danych dostępowych wypisuje `true` bez ujawniania hasła.
  - `kubectl get application board -o custom-columns=NAME:.metadata.name,PROJECT:.spec.project,REPO:.spec.source.repoURL,PATH:.spec.source.path,BRANCH:.spec.source.targetRevision,NAMESPACE:.spec.destination.namespace,SERVER:.spec.destination.server,SYNC:.status.sync.status,HEALTH:.status.health.status,REVISION:.status.sync.revision; cat release-commit` — Pokazuje dostarczone repozytorium, `main` / `manifests`, `Synced` / `Healthy` i rewizję równą zapisanemu commitowi.
  - `kubectl rollout status deployment/board --timeout=10s; kubectl exec --pod-running-timeout=5s deployment/board -- wget -qO- -T 3 http://board:8080` — Rollout się kończy; HTTP zwraca `north-61`.
debrief: Repozytorium przeznaczone wyłącznie do gier credential zostało naprawione bez ogólnego dostępu do platformy
  Secret.
stages.0.brief: Opublikowane wydanie musi być dostępne w dozwolonym zakresie danych dostępowych.
hints.0.text: Oddziel uwierzytelnianie Git od błędów ścieżki źródłowej i workload.
hints.1.text: Stare hasło jest w nazwanym Secrecie station-repository w ARGO_NAMESPACE; zmiana workload nie naprawi
  tego uwierzytelniania. Nigdy nie wyświetlaj hasła.
hints.2.text: Wykonaj patch stringData.password i zażądaj hard refresh.
phrases.0: Przed zmianą aplikacji zdiagnozowałem uwierzytelnianie repozytorium.
phrases.1: Ograniczyłem naprawę credential do takiej o nazwie Secret.
phrases.2: Po uzgodnieniu zweryfikowałem Git revision i aktualne endpoint.
questions.0.points.0: Sprawdź błędy pobierania repozytorium i warunki aplikacji.
questions.0.points.1: Porównaj pożądane i zaobserwowane wersje przed stanem rollout.
questions.0.points.2: Sprawdź niezależnie workload po pomyślnym uwierzytelnieniu.
questions.0.prompt: Jak odróżnić złe wdrożenie Git credentials od niezdrowego wdrożenia?
questions.1.points.0: Ogranicz Role przez resourceNames do jednego Secret.
questions.1.points.1: Binduj tylko odtwarzacz zatoki ServiceAccount.
questions.1.points.2: Zweryfikuj odmowę niepowiązanych sekretów i listy.
questions.1.prompt: Jakie jest najmniejsze pozwolenie potrzebne do tej naprawy?
stages.0.objectives.0.text: W `ARGO_NAMESPACE` gracz może wykonać patch Secretu `station-repository`, nie może wyświetlać
  listy Secrets ani wykonać patch Secretu `unrelated`.
stages.0.objectives.1.text: Secret `station-repository` w `ARGO_NAMESPACE` ma hasło z `platform.env` na workstation
  (`GIT_PASSWORD`).
stages.0.objectives.2.text: Application `board` śledzi `main` / `manifests` w prywatnym repozytorium wskazanym przez
  `platform.env` na workstation (`GIT_URL`).
stages.0.objectives.3.text: Application `board` zgłasza `Synced` i `Healthy` dla `~/quest/release-commit`.
stages.0.objectives.4.text: Deployment `board` kończy rollout w przestrzeni nazw zatoki.
stages.0.objectives.5.text: Wewnątrz Poda Deployment `board` adres `http://board:8080` zwraca `north-61`.
