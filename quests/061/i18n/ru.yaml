title: Учётные данные Git
brief: 'Управляемый через Git выпуск `board` недоступен.


  Работайте на рабочей станции в `~/quest` с `platform.env`, `application.yaml`.


  **Требования:**

  - В namespace контроллера игрок может обновлять существующий Secret учётных данных репозитория, но не может
  просматривать список Secret или обновлять посторонний Secret.

  - Существующий Secret учётных данных репозитория соответствует поставленным учётным данным приватного Git.

  - Application `board` развёртывает поставленный релиз из приватного Git-репозитория.

  - Application `board` сообщает `Synced` и `Healthy` для исходного опубликованного релиза.

  - Deployment `board` завершает rollout в namespace песочницы.

  - Внутри Pod Deployment `board` адрес `http://board:8080` возвращает `north-61`.

  '
debrief: Игровой credential репозитория восстановлен без общего доступа к Secret платформы.
stages.0.brief: Опубликованный выпуск должен быть доступен в разрешённых границах доступа к credentials.
hints.0.text: Контроллеру доставки нужен собственный доступ к исходному репозиторию.
hints.1.text: 'Отделите аутентификацию Git от ошибок пути и workload.


  Устаревший пароль хранится в указанном Secret station-repository в ARGO_NAMESPACE; изменение workload не
  исправит эту аутентификацию. Никогда не выводите пароль.


  Изучите поставленные входные данные и наблюдаемое состояние:


  ```sh

  cat application.yaml

  source platform.env

  kubectl -n "$ARGO_NAMESPACE" describe secret station-repository

  kubectl describe application board

  ```'
hints.2.text: |-
  Обновите stringData.password через patch и запросите hard refresh.

  Проверьте наблюдаемый результат:

  - `source platform.env; kubectl auth can-i patch secret/station-repository -n "$ARGO_NAMESPACE"; kubectl auth can-i list secrets -n "$ARGO_NAMESPACE" || true; kubectl auth can-i patch secret/unrelated -n "$ARGO_NAMESPACE" || true; kubectl -n "$ARGO_NAMESPACE" get secret station-repository -o json | jq -e '(.data.password|@base64d)==env.GIT_PASSWORD'` — Ответы авторизации — `yes`, `no`, `no`; сравнение credentials печатает `true`, не раскрывая пароль.
  - `kubectl get application board -o custom-columns=NAME:.metadata.name,PROJECT:.spec.project,REPO:.spec.source.repoURL,PATH:.spec.source.path,BRANCH:.spec.source.targetRevision,NAMESPACE:.spec.destination.namespace,SERVER:.spec.destination.server,SYNC:.status.sync.status,HEALTH:.status.health.status,REVISION:.status.sync.revision; cat release-commit` — Показывает предоставленный репозиторий, `main` / `manifests`, `Synced` / `Healthy` и ревизию, совпадающую с записанным коммитом.
  - `kubectl rollout status deployment/board --timeout=10s; kubectl exec --pod-running-timeout=5s deployment/board -c worker -- wget -qO- -T 3 http://board:8080` — Rollout завершается; HTTP возвращает `north-61`.

phrases.0: Я проверил аутентификацию репозитория до изменения приложения.
phrases.1: Я ограничил исправление credential одним названным Secret.
phrases.2: После сверки я проверил Git revision и фактический endpoint.
questions.0.points.0: Изучить ошибки получения репозитория и conditions Application.
questions.0.points.1: Сравнить желаемый и наблюдаемый revision до анализа rollout.
questions.0.points.2: После успешной аутентификации отдельно проверить workload.
questions.0.prompt: Как отличить неверные Git credentials от неисправного Deployment?
questions.1.points.0: Ограничить Role через resourceNames одним Secret.
questions.1.points.1: Связать только ServiceAccount игрока этой песочницы.
questions.1.points.2: Проверить запрет других Secret и получения их списка.
questions.1.prompt: Какое минимальное разрешение нужно для этого исправления?
