title: Учётные данные Git
brief: |
  Управляемый через Git выпуск `board` недоступен.

  Работайте на workstation в `~/quest` с файлами `platform.env`, `application.yaml`, `release-commit`.

  **Требования:**
  - Доступ игрока в `ARGO_NAMESPACE`:
    - `patch secret/station-repository`: `yes`.
    - `list secrets`, `patch secret/unrelated`: `no`.
  - Secret репозитория в `ARGO_NAMESPACE`:
    - Имя: `station-repository`.
    - Пароль совпадает с `GIT_PASSWORD` в `~/quest/platform.env` на workstation.
  - Application в namespace песочницы:
    - Имя: `board`.
    - Репозиторий: `GIT_URL` из `~/quest/platform.env` на workstation.
    - Ветка и каталог источника: `main`, `manifests`.
  - Наблюдаемый результат Application:
    - Статус: `Synced`, `Healthy`.
    - Синхронизированная ревизия совпадает с `~/quest/release-commit` на workstation.
  - Deployment в namespace песочницы:
    - Имя: `board`.
    - Rollout завершён.
  - HTTP внутри Pod Deployment `board`:
    - Путь: `http://board:8080`.
    - Ответ: `north-61`.

  **Самопроверка перед Check & finish:**
  - `source platform.env; kubectl auth can-i patch secret/station-repository -n "$ARGO_NAMESPACE"; kubectl auth can-i list secrets -n "$ARGO_NAMESPACE" || true; kubectl auth can-i patch secret/unrelated -n "$ARGO_NAMESPACE" || true; kubectl -n "$ARGO_NAMESPACE" get secret station-repository -o json | jq -e '(.data.password|@base64d)==env.GIT_PASSWORD'` — Ответы авторизации — `yes`, `no`, `no`; сравнение credentials печатает `true`, не раскрывая пароль.
  - `kubectl get application board -o custom-columns=NAME:.metadata.name,PROJECT:.spec.project,REPO:.spec.source.repoURL,PATH:.spec.source.path,BRANCH:.spec.source.targetRevision,NAMESPACE:.spec.destination.namespace,SERVER:.spec.destination.server,SYNC:.status.sync.status,HEALTH:.status.health.status,REVISION:.status.sync.revision; cat release-commit` — Показывает предоставленный репозиторий, `main` / `manifests`, `Synced` / `Healthy` и ревизию, совпадающую с записанным коммитом.
  - `kubectl rollout status deployment/board --timeout=10s; kubectl exec --pod-running-timeout=5s deployment/board -- wget -qO- -T 3 http://board:8080` — Rollout завершается; HTTP возвращает `north-61`.
debrief: Игровой credential репозитория восстановлен без общего доступа к Secret платформы.
stages.0.brief: Опубликованный выпуск должен быть доступен в разрешённых границах доступа к credentials.
hints.0.text: Отделите аутентификацию Git от ошибок пути и workload.
hints.1.text: Устаревший пароль хранится в указанном Secret station-repository в ARGO_NAMESPACE; изменение workload
  не исправит эту аутентификацию. Никогда не выводите пароль.
hints.2.text: Обновите stringData.password через patch и запросите hard refresh.
phrases.0: Я проверил аутентификацию репозитория до изменения приложения.
phrases.1: Я ограничил исправление credential одним названным Secret.
phrases.2: После сверки я проверил Git revision и фактический endpoint.
questions.0.points.0: Изучить ошибки получения репозитория и conditions Application.
questions.0.points.1: Сравнить желаемый и наблюдаемый revision до анализа rollout.
questions.0.points.2: После успешной аутентификации отдельно проверить workload.
questions.0.prompt: Как отличить неверные Git credentials от неисправного Deployment?
questions.1.points.0: Ограничить Role через resourceNames одним Secret.
questions.1.points.1: Связать только ServiceAccount игрока этой песочницы.
questions.1.points.2: Проверить запрет других Secret и получения их списка.
questions.1.prompt: Какое минимальное разрешение нужно для этого исправления?
stages.0.objectives.0.text: В `ARGO_NAMESPACE` игрок может изменять Secret `station-repository` через patch, не
  может перечислять Secrets и не может изменять Secret `unrelated` через patch.
stages.0.objectives.1.text: Secret `station-repository` в `ARGO_NAMESPACE` имеет пароль из `platform.env` на workstation
  (`GIT_PASSWORD`).
stages.0.objectives.2.text: Application `board` отслеживает `main` / `manifests` в приватном репозитории из `platform.env`
  на workstation (`GIT_URL`).
stages.0.objectives.3.text: Application `board` сообщает `Synced` и `Healthy` для `~/quest/release-commit`.
stages.0.objectives.4.text: Deployment `board` завершает rollout в namespace песочницы.
stages.0.objectives.5.text: Внутри Pod Deployment `board` адрес `http://board:8080` возвращает `north-61`.
