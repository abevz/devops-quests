title: Учётные данные Git
brief: ' Argo CD не читает приватный репозиторий Gitea: сохранённый пароль устарел. Исправьте только station-repository
  в ARGO_NAMESPACE, используя текущий игровой пароль из platform.env. Игроку разрешены get/patch/update
  только этого Secret, без списка секретов платформы и изменения других credentials. Application уже смотрит
  на main/manifests. Проверьте сверку и HTTP-ответ north-61.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `platform.env`, `repository/manifests/board.json`,
  `repository/manifests/service.json`, `release-commit`, `application.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Repository Secret содержит текущий пароль, доступ к платформе ограничен, Argo разворачивает
  записанный commit с HTTP north-61.'
debrief: Игровой credential репозитория восстановлен без общего доступа к Secret платформы.
stages.0.brief: 'Repository Secret содержит текущий пароль, доступ к платформе ограничен, Argo разворачивает
  записанный commit с HTTP north-61.


  Результат проверки: Repository Secret содержит текущий пароль, доступ к платформе ограничен, Argo разворачивает
  записанный commit с HTTP north-61.'
stages.0.objectives.0.text: Repository Secret содержит текущий пароль, доступ к платформе ограничен, Argo
  разворачивает записанный commit с HTTP north-61.
hints.0.text: Отделите аутентификацию Git от ошибок пути и workload.
hints.1.text: Изучайте только названный Secret в ARGO_NAMESPACE; не печатайте пароль.
hints.2.text: Исправьте stringData.password, запросите hard refresh, проверьте revision и HTTP.
phrases.0: Я проверил аутентификацию репозитория до изменения приложения.
phrases.1: Я ограничил исправление credential одним названным Secret.
phrases.2: После сверки я проверил Git revision и фактический endpoint.
questions.0.points.0: Изучить ошибки получения репозитория и conditions Application.
questions.0.points.1: Сравнить желаемый и наблюдаемый revision до анализа rollout.
questions.0.points.2: После успешной аутентификации отдельно проверить workload.
questions.0.prompt: Как отличить неверные Git credentials от неисправного Deployment?
questions.1.points.0: Ограничить Role через resourceNames одним Secret.
questions.1.points.1: Связать только ServiceAccount игрока этой песочницы.
questions.1.points.2: Проверить запрет других Secret и получения их списка.
questions.1.prompt: Какое минимальное разрешение нужно для этого исправления?
