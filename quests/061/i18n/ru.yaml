title: Учётные данные Git
brief: 'Управляемый через Git выпуск `board` недоступен.


  Работайте на рабочей станции в `~/quest` с `platform.env`, `application.yaml`.


  **Требования:**

  - В namespace контроллера игрок может обновлять существующий Secret учётных данных репозитория, но не может просматривать
  список Secret или обновлять посторонний Secret.

  - Существующий Secret учётных данных репозитория соответствует поставленным учётным данным приватного Git.

  - Application `board` развёртывает поставленный релиз из приватного Git-репозитория.

  - Application `board` сообщает `Synced` и `Healthy` для исходного опубликованного релиза.

  - Deployment `board` завершает rollout в namespace песочницы.

  - Внутри Pod Deployment `board` адрес `http://board:8080` возвращает `north-61`.


  Также изучите `delivery-access.json`. Восстановите доступ Git-клиента рабочей станции и контроллера доставки к
  исходному приватному репозиторию и опубликованной ссылке. Сохраните идентичности исходных Application и Secret
  с учётными данными и действующие узкие права. Учётные данные контроллера должны сохранять эталонную привязку к
  репозиторию и исходное значение. Файлы конфигурации Git с текущими учётными данными должны быть доступны только
  владельцу.


  Исходная запись в `/run/dq/facts/0/` является эталоном; файлы в `~/quest` — рабочие копии. Переписывание URL не
  должно подменять исходный сервер репозитория.'
debrief: Вы восстановили два независимых контекста аутентификации Git, сохранили привязки и идентичности объектов
  и не расширили права.
stages.0.brief: Опубликованный выпуск должен быть доступен в разрешённых границах доступа к credentials.
hints.0.text: Рабочая станция и контроллер доставки проходят аутентификацию независимо. Исправление одного клиента
  не подтверждает доступ другого.
hints.1.text: |-
  Сопоставьте `delivery-access.json`, расположения действующей конфигурации Git рабочей станции, метаданные существующего Secret и ошибки получения репозитория у Application. Изучайте имена и права, не выводя значения аутентификации.

  Найдите идентификатор репозитория в источнике Application и сопоставьте его с настройками Git рабочей копии и метаданными указанного Secret. Проверьте, какие имена ресурсов и действия разрешает привязанная Role.
hints.2.text: |-
  Проверьте `git -C repository ls-remote $GIT_URL refs/heads/main`, исходную опубликованную ревизию, здоровье Application и реальный HTTP. Повторно проверьте узкие права и исходные UID объектов.

  Разрешено изменение указанного Secret, а перечисление Secret и изменение постороннего Secret должны вернуть `no`. Сверьте исходные UID и ревизию с текущими Application и метаданными Secret. Ответ приложения должен быть `north-61`.

  ```bash
  source platform.env
  git -C repository ls-remote "$GIT_URL" refs/heads/main
  jq '{credentialName,credentialNamespace,credentialUID,applicationUID,revision}' delivery-access.json
  kubectl auth can-i patch secret/station-repository -n "$ARGO_NAMESPACE"
  kubectl auth can-i list secrets -n "$ARGO_NAMESPACE" || test "$?" -eq 1
  kubectl auth can-i patch secret/unrelated -n "$ARGO_NAMESPACE" || test "$?" -eq 1
  kubectl get secret station-repository -n "$ARGO_NAMESPACE" -o custom-columns=NAME:.metadata.name,UID:.metadata.uid
  kubectl get application board -o json | jq '{uid:.metadata.uid,sync:.status.sync,health:.status.health}'
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080
  ```
phrases.0: Я проверил аутентификацию репозитория до изменения приложения.
phrases.1: Я ограничил исправление credential одним названным Secret.
phrases.2: После сверки я проверил Git revision и фактический endpoint.
questions.0.points.0: Изучить ошибки получения репозитория и conditions Application.
questions.0.points.1: Сравнить желаемый и наблюдаемый revision до анализа rollout.
questions.0.points.2: После успешной аутентификации отдельно проверить workload.
questions.0.prompt: Как отличить неверные Git credentials от неисправного Deployment?
questions.1.points.0: Ограничить Role через resourceNames одним Secret.
questions.1.points.1: Связать только ServiceAccount игрока этой песочницы.
questions.1.points.2: Проверить запрет других Secret и получения их списка.
questions.1.prompt: Какое минимальное разрешение нужно для этого исправления?
stages.0.objectives.0.text: В namespace контроллера игрок может обновлять существующий Secret учётных данных репозитория,
  но не может просматривать список Secret или обновлять посторонний Secret.
stages.0.objectives.1.text: Существующий Secret учётных данных репозитория соответствует поставленным учётным данным
  приватного Git. Сохранены исходная привязка учётных данных и идентичности объектов. Оба Git-клиента имеют доступ
  к исходной опубликованной ссылке, а конфигурация Git с учётными данными остаётся приватной.
stages.0.objectives.2.text: Application `board` развёртывает поставленный релиз из приватного Git-репозитория.
stages.0.objectives.3.text: Application `board` сообщает `Synced` и `Healthy` для исходного опубликованного релиза.
stages.0.objectives.4.text: Deployment `board` завершает rollout в namespace песочницы.
stages.0.objectives.5.text: Внутри Pod Deployment `board` адрес `http://board:8080` возвращает `north-61`.
diagnostics.credential_identity: 'UID Secret репозитория изменился: пересоздание station-repository сохраняет имя, но теряет исходный объект учётных данных из записи setup. [Причина и проверка](guides#guide=gitops-delivery&section=delivery-original-secret-identity)'
diagnostics.credential_binding: 'Исходный Secret больше не задаёт выданный Git-репозиторий и аккаунт как учётные данные Argo: устаревший URL, другие username/type или отсутствующая метка repository мешают использованию. [Причина и проверка](guides#guide=gitops-delivery&section=delivery-secret-repository-binding)'
diagnostics.credential_value: 'Пароль Secret не совпадает с защищённым одобренным значением: выданный устаревший пароль или неполное исправление учётных данных мешают Argo войти в исходный репозиторий. [Причина и проверка](guides#guide=gitops-delivery&section=delivery-approved-secret-password)'
diagnostics.application_identity: 'UID Application board изменился: удаление и пересоздание заменяет исходную идентичность доставки, даже если имя и манифесты остались прежними. [Причина и проверка](guides#guide=gitops-delivery&section=delivery-original-application-identity)'
diagnostics.git_storage: 'Проверяемая конфигурация Git содержит пароль или его Basic-кодирование и разрешает доступ группе либо остальным: сохранение исправленного заголовка в общедоступном файле раскрывает рабочие учётные данные. [Причина и проверка](guides#guide=gitops-delivery&section=delivery-private-git-configuration)'
diagnostics.git_target: 'Git разрешает выданный URL в другой адрес или путь: переписывание URL может направлять workstation в другой репозиторий, даже если ветка случайно совпадает. [Причина и проверка](guides#guide=gitops-delivery&section=delivery-direct-git-authority)'
diagnostics.git_access: 'Исходный репозиторий недоступен для запроса либо его main отличается от замороженного выпуска: причиной могут быть устаревший заголовок Authorization на workstation, отсутствие доступа или другая удалённая публикация. [Причина и проверка](guides#guide=gitops-delivery&section=delivery-authenticated-remote-main)'
diagnostics.git_budget: 'Наблюдение Git или Kubernetes превысило лимит команды либо общий срок: медленные API, сеть или endpoint аутентификации мешают завершить все сравнения доступа вовремя. [Причина и проверка](guides#guide=gitops-delivery&section=delivery-access-observation-budget)'
diagnostics.git_observation: 'Не удалось наблюдать доступ доставки: причиной могут быть отсутствующие защищённая запись или объекты, некорректный JSON и кодирование учётных данных, нечитаемая конфигурация Git или ошибки API. [Причина и проверка](guides#guide=gitops-delivery&section=delivery-access-observation-inputs)'
diagnostics.probe_0_1: 'Legacy-сравнение пароля Secret не пройдено либо проверка остановилась до именованного маркера: причиной могут быть неисправленный пароль, изменённое ожидание в platform.env или недоступные данные окружения и Python. [Причина и проверка](guides#guide=gitops-delivery&section=delivery-password-gate-and-startup)'
diagnostics.delivery_permissions: 'Нужный узкий доступ к Secret не подтверждён: причиной могут быть отсутствие patch для station-repository, другой namespace, лишние права list и изменения постороннего Secret либо недоступные platform.env и API. [Причина и проверка](guides#guide=gitops-delivery&section=delivery-scoped-secret-permissions)'
diagnostics.delivery_source: 'Application board не выбирает выданный репозиторий, относительный путь manifests и ревизию main либо его описание не прочитано: устаревший или изменённый источник может применять другую публикацию. [Причина и проверка](guides#guide=gitops-delivery&section=delivery-board-git-source)'
diagnostics.delivery_sync: 'Application board не Synced и Healthy на release-commit либо его статус не прочитан: исправленные учётные данные ещё требуют refresh и согласования либо выбранный выпуск отличается от наблюдаемой ревизии. [Причина и проверка](guides#guide=gitops-delivery&section=delivery-board-release-adoption)'
diagnostics.delivery_rollout: 'Deployment board не завершил rollout за 3 секунды: доставка Git ещё могла не создать нагрузку, Pod могут быть недоступны либо наблюдение API завершилось ошибкой. [Причина и проверка](guides#guide=gitops-delivery&section=delivery-board-workload-rollout)'
diagnostics.delivery_http: 'Путь Service board не вернул north-61 либо exec и HTTP завершились ошибкой: недоставленная нагрузка, неверная маршрутизация Service или старое содержимое мешают доставке публикации потребителю. [Причина и проверка](guides#guide=gitops-delivery&section=delivery-board-service-response)'
