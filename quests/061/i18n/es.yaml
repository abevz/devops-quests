title: Credenciales Git
brief: |
  La versión `board` administrada mediante Git no está disponible.

  Trabaja en la workstation en `~/quest` con `platform.env`, `application.yaml`, `release-commit`.

  **Requisitos:**
  - Acceso del jugador en `ARGO_NAMESPACE`:
    - `patch secret/station-repository`: `yes`.
    - `list secrets`, `patch secret/unrelated`: `no`.
  - Secret del repositorio en `ARGO_NAMESPACE`:
    - Nombre: `station-repository`.
    - La contraseña coincide con `GIT_PASSWORD` en `~/quest/platform.env` en la workstation.
  - Application en el namespace de la bahía:
    - Nombre: `board`.
    - Repositorio: `GIT_URL` de `~/quest/platform.env` en la workstation.
    - Rama y directorio fuente: `main`, `manifests`.
  - Resultado observado de la Application:
    - Estado: `Synced`, `Healthy`.
    - La revisión sincronizada coincide con `~/quest/release-commit` en la workstation.
  - Deployment en el namespace de la bahía:
    - Nombre: `board`.
    - Rollout completo.
  - HTTP dentro de un Pod del Deployment `board`:
    - Ruta: `http://board:8080`.
    - Respuesta: `north-61`.

  **Verifica antes de Check & finish:**
  - `source platform.env; kubectl auth can-i patch secret/station-repository -n "$ARGO_NAMESPACE"; kubectl auth can-i list secrets -n "$ARGO_NAMESPACE" || true; kubectl auth can-i patch secret/unrelated -n "$ARGO_NAMESPACE" || true; kubectl -n "$ARGO_NAMESPACE" get secret station-repository -o json | jq -e '(.data.password|@base64d)==env.GIT_PASSWORD'` — Las respuestas de autorización son `yes`, `no`, `no`; la comparación de credenciales imprime `true` sin revelar la contraseña.
  - `kubectl get application board -o custom-columns=NAME:.metadata.name,PROJECT:.spec.project,REPO:.spec.source.repoURL,PATH:.spec.source.path,BRANCH:.spec.source.targetRevision,NAMESPACE:.spec.destination.namespace,SERVER:.spec.destination.server,SYNC:.status.sync.status,HEALTH:.status.health.status,REVISION:.status.sync.revision; cat release-commit` — Muestra el repositorio suministrado, `main` / `manifests`, `Synced` / `Healthy` y una revisión igual al commit registrado.
  - `kubectl rollout status deployment/board --timeout=10s; kubectl exec --pod-running-timeout=5s deployment/board -- wget -qO- -T 3 http://board:8080` — El rollout se completa; HTTP devuelve `north-61`.
debrief: Se reparó un repositorio exclusivo de juegos credential sin acceso a la plataforma general Secret.
stages.0.brief: La versión publicada debe estar disponible dentro del ámbito de credenciales permitido.
hints.0.text: Separe la autenticación Git de la ruta de origen y los errores de workload.
hints.1.text: La contraseña retirada está en el Secret nombrado station-repository de ARGO_NAMESPACE; cambiar la
  carga de trabajo no repara esa autenticación. Nunca muestres la contraseña.
hints.2.text: Aplica patch a stringData.password y solicita un hard refresh.
phrases.0: Diagnostiqué la autenticación del repositorio antes de cambiar la aplicación.
phrases.1: Limité la reparación de credential a una llamada Secret.
phrases.2: Verifiqué el Git revision y el endpoint real después de la conciliación.
questions.0.points.0: Inspeccione los errores de recuperación del repositorio y Application conditions.
questions.0.points.1: Compare las revisiones deseadas y observadas antes del estado de rollout.
questions.0.points.2: Pruebe el workload de forma independiente después de que la autenticación sea exitosa.
questions.0.prompt: ¿Cómo se distingue un Git credentials incorrecto de una implementación en mal estado?
questions.1.points.0: Restrinja un Role por resourceNames a un Secret.
questions.1.points.1: Vincula solo el reproductor de bahía ServiceAccount.
questions.1.points.2: Verificar la denegación de listados y secretos no relacionados.
questions.1.prompt: ¿Cuál es el permiso mínimo necesario para esta reparación?
stages.0.objectives.0.text: En `ARGO_NAMESPACE`, el jugador puede aplicar patch al Secret `station-repository`,
  no puede listar Secrets ni aplicar patch al Secret `unrelated`.
stages.0.objectives.1.text: El Secret `station-repository` en `ARGO_NAMESPACE` tiene la contraseña de `platform.env`
  en la workstation (`GIT_PASSWORD`).
stages.0.objectives.2.text: La Application `board` sigue `main` / `manifests` en el repositorio privado indicado
  por `platform.env` en la workstation (`GIT_URL`).
stages.0.objectives.3.text: La Application `board` informa `Synced` y `Healthy` en `~/quest/release-commit`.
stages.0.objectives.4.text: El Deployment `board` completa su rollout en el namespace de la bahía.
stages.0.objectives.5.text: Dentro de un Pod del Deployment `board`, `http://board:8080` devuelve `north-61`.
