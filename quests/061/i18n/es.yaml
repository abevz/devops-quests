title: Credenciales Git
brief: 'Argo CD no puede leer el repositorio privado Gitea porque su contraseña almacenada es retired.
  Repare solo station-repository en ARGO_NAMESPACE usando la credencial del juego actual en platform.env.
  Su identidad de jugador puede ser get/patch/update esa Secret; no puede enumerar secretos de plataforma
  ni editar otros credentials. El Application ya apunta a main/manifests. Verificar conciliación y la
  respuesta north-61 HTTP.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `platform.env`, `repository/manifests/board.json`,
  `repository/manifests/service.json`, `release-commit`, `application.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: el repositorio Secret tiene la contraseña actual, el acceso a la plataforma
  sigue siendo limitado y Argo implementa la confirmación registrada con HTTP north-61.'
debrief: Se reparó un repositorio exclusivo de juegos credential sin acceso a la plataforma general Secret.
stages.0.brief: 'Criterios de éxito: el repositorio Secret tiene la contraseña actual, el acceso a la
  plataforma sigue siendo limitado y Argo implementa la confirmación registrada con HTTP north-61.'
stages.0.objectives.0.text: El repositorio Secret tiene la contraseña actual, el acceso a la plataforma
  sigue siendo limitado y Argo implementa la confirmación registrada con HTTP north-61.
hints.0.text: Separe la autenticación Git de la ruta de origen y los errores de workload.
hints.1.text: Inspeccione solo el denominado Secret en ARGO_NAMESPACE; nunca imprima su contraseña.
hints.2.text: Parche stringData.password, solicite un hard refresh, luego verifique revision y HTTP.
phrases.0: Diagnostiqué la autenticación del repositorio antes de cambiar la aplicación.
phrases.1: Limité la reparación de credential a una llamada Secret.
phrases.2: Verifiqué el Git revision y el endpoint real después de la conciliación.
questions.0.points.0: Inspeccione los errores de recuperación del repositorio y Application conditions.
questions.0.points.1: Compare las revisiones deseadas y observadas antes del estado de rollout.
questions.0.points.2: Pruebe el workload de forma independiente después de que la autenticación sea exitosa.
questions.0.prompt: ¿Cómo se distingue un Git credentials incorrecto de una implementación en mal estado?
questions.1.points.0: Restrinja un Role por resourceNames a un Secret.
questions.1.points.1: Vincula solo el reproductor de bahía ServiceAccount.
questions.1.points.2: Verificar la denegación de listados y secretos no relacionados.
questions.1.prompt: ¿Cuál es el permiso mínimo necesario para esta reparación?
