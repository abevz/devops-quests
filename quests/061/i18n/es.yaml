title: Credenciales Git
brief: 'La versión `board` administrada mediante Git no está disponible.


  Trabaja en la estación de trabajo en `~/quest` con `platform.env`, `application.yaml`.


  **Requisitos:**

  - En el namespace del controlador, el jugador puede actualizar el Secret existente de credenciales del repositorio,
  pero no listar Secrets ni actualizar uno ajeno.

  - El Secret existente de credenciales del repositorio coincide con las credenciales Git privadas suministradas.

  - La Application `board` despliega la versión suministrada desde el repositorio Git privado.

  - La Application `board` indica `Synced` y `Healthy` para la versión publicada original.

  - El Deployment `board` completa su rollout en el namespace de la bahía.

  - Dentro de un Pod del Deployment `board`, `http://board:8080` devuelve `north-61`.


  Consulta también `delivery-access.json`. Restaura el acceso del cliente Git de la estación y del controlador de
  entrega al repositorio privado original y a la referencia publicada. Conserva las identidades de la Application
  y del Secret de credenciales originales y los permisos restringidos existentes. Las credenciales del controlador
  deben mantener su vinculación canónica al repositorio y su valor original. Solo el propietario debe poder acceder
  a los archivos de configuración Git que contienen las credenciales actuales.


  El registro inicial en `/run/dq/facts/0/` es la referencia; los archivos de `~/quest` son copias de trabajo. Las
  reescrituras de URL no deben sustituir al servidor original.'
debrief: Recuperaste dos contextos independientes de autenticación Git, conservaste las vinculaciones e identidades
  y mantuviste los permisos restringidos.
stages.0.brief: La versión publicada debe estar disponible dentro del ámbito de credenciales permitido.
hints.0.text: La estación y el controlador de entrega se autentican de forma independiente. Reparar un cliente no
  demuestra el acceso del otro.
hints.1.text: |-
  Compara `delivery-access.json`, las ubicaciones de la configuración Git efectiva de la estación, los metadatos del Secret existente y los errores de descarga de la Application. Inspecciona nombres y permisos sin imprimir valores de autenticación.

  Localiza la identidad del repositorio en el origen de Application y compárala con la configuración local de Git y los metadatos del Secret indicado. Revisa qué nombres de recurso y acciones permite la Role vinculada.
hints.2.text: |-
  Verifica `git -C repository ls-remote $GIT_URL refs/heads/main`, la revisión publicada original, la salud de la Application y HTTP real. Revisa de nuevo los permisos restringidos y los UID originales.

  Debe permitirse modificar el Secret indicado, mientras que listar Secrets y modificar el Secret ajeno deben devolver `no`. Compara los UID y la revisión originales con la Application y los metadatos actuales del Secret. La aplicación debe devolver `north-61`.

  ```bash
  source platform.env
  git -C repository ls-remote "$GIT_URL" refs/heads/main
  jq '{credentialName,credentialNamespace,credentialUID,applicationUID,revision}' delivery-access.json
  kubectl auth can-i patch secret/station-repository -n "$ARGO_NAMESPACE"
  kubectl auth can-i list secrets -n "$ARGO_NAMESPACE" || test "$?" -eq 1
  kubectl auth can-i patch secret/unrelated -n "$ARGO_NAMESPACE" || test "$?" -eq 1
  kubectl get secret station-repository -n "$ARGO_NAMESPACE" -o custom-columns=NAME:.metadata.name,UID:.metadata.uid
  kubectl get application board -o json | jq '{uid:.metadata.uid,sync:.status.sync,health:.status.health}'
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080
  ```
phrases.0: Diagnostiqué la autenticación del repositorio antes de cambiar la aplicación.
phrases.1: Limité la reparación de credential a una llamada Secret.
phrases.2: Verifiqué el Git revision y el endpoint real después de la conciliación.
questions.0.points.0: Inspeccione los errores de recuperación del repositorio y Application conditions.
questions.0.points.1: Compare las revisiones deseadas y observadas antes del estado de rollout.
questions.0.points.2: Pruebe el workload de forma independiente después de que la autenticación sea exitosa.
questions.0.prompt: ¿Cómo se distingue un Git credentials incorrecto de una implementación en mal estado?
questions.1.points.0: Restrinja un Role por resourceNames a un Secret.
questions.1.points.1: Vincula solo el reproductor de bahía ServiceAccount.
questions.1.points.2: Verificar la denegación de listados y secretos no relacionados.
questions.1.prompt: ¿Cuál es el permiso mínimo necesario para esta reparación?
stages.0.objectives.0.text: En el namespace del controlador, el jugador puede actualizar el Secret existente de
  credenciales del repositorio, pero no listar Secrets ni actualizar uno ajeno.
stages.0.objectives.1.text: El Secret existente de credenciales del repositorio coincide con las credenciales Git
  privadas suministradas. Se conservan la vinculación original de credenciales y las identidades de los objetos.
  Ambos clientes Git acceden a la referencia publicada original y la configuración con credenciales permanece privada.
stages.0.objectives.2.text: La Application `board` despliega la versión suministrada desde el repositorio Git privado.
stages.0.objectives.3.text: La Application `board` indica `Synced` y `Healthy` para la versión publicada original.
stages.0.objectives.4.text: El Deployment `board` completa su rollout en el namespace de la bahía.
stages.0.objectives.5.text: Dentro de un Pod del Deployment `board`, `http://board:8080` devuelve `north-61`.
diagnostics.credential_identity: Cambió el UID del Secret de repositorio; recrear station-repository conserva el nombre y pierde el objeto de credenciales original registrado por setup. [Causa y comprobación](guides#guide=gitops-delivery&section=delivery-original-secret-identity)
diagnostics.credential_binding: El Secret original ya no identifica el repositorio y cuenta Git suministrados como credencial Argo; URL retirado, username/type cambiado o etiqueta repository ausente impiden usarlo. [Causa y comprobación](guides#guide=gitops-delivery&section=delivery-secret-repository-binding)
diagnostics.credential_value: La contraseña Secret no coincide con el valor aprobado protegido; la contraseña retirada suministrada o una reparación incompleta puede impedir autenticar Argo en el repositorio original. [Causa y comprobación](guides#guide=gitops-delivery&section=delivery-approved-secret-password)
diagnostics.application_identity: Cambió el UID de Application board; eliminarla y recrearla sustituye la identidad de entrega original aunque conserve nombre y manifiestos. [Causa y comprobación](guides#guide=gitops-delivery&section=delivery-original-application-identity)
diagnostics.git_storage: Una configuración Git comprobada contiene contraseña o codificación Basic con permisos de grupo/otros; guardar el encabezado reparado en configuración accesible puede exponer la credencial activa. [Causa y comprobación](guides#guide=gitops-delivery&section=delivery-private-git-configuration)
diagnostics.git_target: Git resuelve el URL suministrado a otra autoridad o ruta; una reescritura puede dirigir workstation a otro repositorio aunque coincida la rama por casualidad. [Causa y comprobación](guides#guide=gitops-delivery&section=delivery-direct-git-authority)
diagnostics.git_access: No se puede consultar el repositorio original o main difiere de la versión protegida; encabezado Authorization retirado en workstation, acceso ausente o publicación remota cambiada pueden explicarlo. [Causa y comprobación](guides#guide=gitops-delivery&section=delivery-authenticated-remote-main)
diagnostics.git_budget: Una observación Git o Kubernetes superó el plazo del comando o total; API, red o endpoint de autenticación lentos impiden completar las comparaciones de acceso a tiempo. [Causa y comprobación](guides#guide=gitops-delivery&section=delivery-access-observation-budget)
diagnostics.git_observation: No se pudo observar el acceso; registro protegido u objetos ausentes, JSON/codificación de credenciales inválidos, configuración Git ilegible u operaciones API fallidas pueden explicarlo. [Causa y comprobación](guides#guide=gitops-delivery&section=delivery-access-observation-inputs)
diagnostics.probe_0_1: Falló comparar la contraseña Secret en la prueba legacy o terminó antes de un marcador; contraseña sin reparar, expectativa platform.env cambiada o entradas de entorno/Python no disponibles pueden explicarlo. [Causa y comprobación](guides#guide=gitops-delivery&section=delivery-password-gate-and-startup)
diagnostics.delivery_permissions: No se verificó el acceso Secret limitado requerido; falta patch de station-repository, namespace incorrecto, permisos más amplios de list/otro Secret o entradas platform.env o API no disponibles pueden explicarlo. [Causa y comprobación](guides#guide=gitops-delivery&section=delivery-scoped-secret-permissions)
diagnostics.delivery_source: Application board no selecciona repositorio suministrado, ruta relativa manifests y revisión main, o no pudo leerse; un origen obsoleto o cambiado puede reconciliar otra publicación. [Causa y comprobación](guides#guide=gitops-delivery&section=delivery-board-git-source)
diagnostics.delivery_sync: Application board no está Synced y Healthy en release-commit o no pudo leerse su estado; credenciales reparadas pueden requerir refresh y reconciliación, o versión y revisión observada difieren. [Causa y comprobación](guides#guide=gitops-delivery&section=delivery-board-release-adoption)
diagnostics.delivery_rollout: Deployment board no completó rollout en 3 segundos; la entrega Git puede no haber creado aún la aplicación, Pods seguir no disponibles o fallar observar API. [Causa y comprobación](guides#guide=gitops-delivery&section=delivery-board-workload-rollout)
diagnostics.delivery_http: La ruta Service board no devolvió north-61 o falló exec/HTTP; aplicación sin entregar, enrutamiento Service incorrecto o contenido obsoleto impide alcanzar al consumidor. [Causa y comprobación](guides#guide=gitops-delivery&section=delivery-board-service-response)
