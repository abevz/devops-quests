title: Git credentials
brief: 'The Git-managed `board` release is unavailable.


  Work on the workstation in `~/quest` with `platform.env`, `application.yaml`.


  **Requirements:**

  - In the controller namespace, the player can update the existing repository credential Secret, but cannot
  list Secrets or update an unrelated Secret.

  - The existing repository credential Secret matches the supplied private Git credentials.

  - Application `board` deploys the supplied release from the private Git repository.

  - Application `board` reports `Synced` and `Healthy` at the original published release.

  - Deployment `board` completes its rollout in the bay namespace.

  - Inside a Pod of Deployment `board`, `http://board:8080` returns `north-61`.

  '
debrief: A game-only repository credential was repaired without general platform Secret access.
stages.0.brief: The published release must be available within the permitted credential scope.
hints.0.text: A delivery controller needs its own access to the source repository.
hints.1.text: 'Separate Git authentication from source-path and workload failures.


  The retired password is stored only in the named station-repository Secret in ARGO_NAMESPACE; changing the
  workload cannot repair that authentication. Never print the password.


  Inspect the supplied inputs and observed state:


  ```sh

  cat application.yaml

  source platform.env

  kubectl -n "$ARGO_NAMESPACE" describe secret station-repository

  kubectl describe application board

  ```'
hints.2.text: 'Patch stringData.password and request a hard refresh.


  Verify the observed result:


  - `source platform.env; kubectl auth can-i patch secret/station-repository -n "$ARGO_NAMESPACE"; kubectl
  auth can-i list secrets -n "$ARGO_NAMESPACE" || true; kubectl auth can-i patch secret/unrelated -n "$ARGO_NAMESPACE"
  || true; kubectl -n "$ARGO_NAMESPACE" get secret station-repository -o json | jq -e ''(.data.password|@base64d)==env.GIT_PASSWORD''`
  — Authorization answers are `yes`, `no`, `no`; credential comparison prints `true` without exposing the password.

  - `kubectl get application board -o custom-columns=NAME:.metadata.name,PROJECT:.spec.project,REPO:.spec.source.repoURL,PATH:.spec.source.path,BRANCH:.spec.source.targetRevision,NAMESPACE:.spec.destination.namespace,SERVER:.spec.destination.server,SYNC:.status.sync.status,HEALTH:.status.health.status,REVISION:.status.sync.revision;
  cat release-commit` — Shows the supplied repository, `main` / `manifests`, `Synced` / `Healthy`, and a revision
  equal to the recorded commit.

  - `kubectl rollout status deployment/board --timeout=10s; kubectl exec --pod-running-timeout=5s deployment/board
  -- wget -qO- -T 3 http://board:8080` — Rollout completes; HTTP returns `north-61`.'
phrases.0: I diagnosed repository authentication before changing the application.
phrases.1: I limited credential repair to one named Secret.
phrases.2: I verified the Git revision and actual endpoint after reconciliation.
questions.0.points.0: Inspect repository fetch errors and Application conditions.
questions.0.points.1: Compare desired and observed revisions before rollout health.
questions.0.points.2: Probe the workload independently after authentication succeeds.
questions.0.prompt: How do you distinguish bad Git credentials from an unhealthy deployment?
questions.1.points.0: Constrain a Role by resourceNames to one Secret.
questions.1.points.1: Bind only the bay player ServiceAccount.
questions.1.points.2: Verify denial of unrelated secrets and listing.
questions.1.prompt: What is the smallest permission needed for this repair?
