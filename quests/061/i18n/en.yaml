title: Git credentials
brief: 'Argo CD cannot read the private Gitea repository because its stored password is retired. Repair
  only station-repository in ARGO_NAMESPACE using the current game credential in platform.env. Your player
  identity may get/patch/update that one Secret; it cannot list platform secrets or edit other credentials.
  The Application already points at main/manifests. Verify reconciliation and the north-61 HTTP response.


  Quest files in `~/quest` (some appear in later stages): `platform.env`, `repository/manifests/board.json`,
  `repository/manifests/service.json`, `release-commit`, `application.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: The repository Secret has the current password, platform access remains limited,
  and Argo deploys the recorded commit with HTTP north-61.'
debrief: A game-only repository credential was repaired without general platform Secret access.
