title: Git credentials
brief: 'The Git-managed `board` release is unavailable.


  Work on the workstation in `~/quest` with `platform.env`, `application.yaml`.


  **Requirements:**

  - In the controller namespace, the player can update the existing repository credential Secret, but cannot list
  Secrets or update an unrelated Secret.

  - The existing repository credential Secret matches the supplied private Git credentials.

  - Application `board` deploys the supplied release from the private Git repository.

  - Application `board` reports `Synced` and `Healthy` at the original published release.

  - Deployment `board` completes its rollout in the bay namespace.

  - Inside a Pod of Deployment `board`, `http://board:8080` returns `north-61`.


  Also inspect `delivery-access.json`. Restore Git access from both the workstation and the delivery controller
  to the original private repository and published ref. Retain the original Application and credential Secret identities
  and the existing narrow authorization grant. The controller credential must retain its canonical repository binding
  and original value. Git configuration files containing the current credentials must be accessible only to their
  owner.


  The setup receipt under `/run/dq/facts/0/` is authoritative; files in `~/quest` are working copies. URL rewrites
  must not replace the original repository authority.'
debrief: You recovered two independent Git authentication contexts, preserved bindings and object identities, and
  retained narrow authorization.
stages.0.brief: The published release must be available within the permitted credential scope.
hints.0.text: The workstation and delivery controller authenticate independently. Repairing one context does not
  establish access for the other.
hints.1.text: Compare `delivery-access.json`, the workstation's effective Git configuration locations, the existing
  Secret metadata and Application fetch errors. Inspect names and permissions without printing authentication values.
hints.2.text: Restore the repository binding and current credentials in both authentication contexts, keep credential-bearing
  configuration private, and request a hard refresh. Verify `git -C repository ls-remote $GIT_URL refs/heads/main`,
  the original publication revision, Application health and actual HTTP. Recheck the narrow authorization answers
  and original object UIDs.
phrases.0: I diagnosed repository authentication before changing the application.
phrases.1: I limited credential repair to one named Secret.
phrases.2: I verified the Git revision and actual endpoint after reconciliation.
questions.0.points.0: Inspect repository fetch errors and Application conditions.
questions.0.points.1: Compare desired and observed revisions before rollout health.
questions.0.points.2: Probe the workload independently after authentication succeeds.
questions.0.prompt: How do you distinguish bad Git credentials from an unhealthy deployment?
questions.1.points.0: Constrain a Role by resourceNames to one Secret.
questions.1.points.1: Bind only the bay player ServiceAccount.
questions.1.points.2: Verify denial of unrelated secrets and listing.
questions.1.prompt: What is the smallest permission needed for this repair?
stages.0.objectives.0.text: In the controller namespace, the player can update the existing repository credential
  Secret, but cannot list Secrets or update an unrelated Secret.
stages.0.objectives.1.text: The existing repository credential Secret matches the supplied private Git credentials.
  The original credential binding and object identities are retained. Both Git access contexts reach the original
  published ref, and credential-bearing Git configuration remains private.
stages.0.objectives.2.text: Application `board` deploys the supplied release from the private Git repository.
stages.0.objectives.3.text: Application `board` reports `Synced` and `Healthy` at the original published release.
stages.0.objectives.4.text: Deployment `board` completes its rollout in the bay namespace.
stages.0.objectives.5.text: Inside a Pod of Deployment `board`, `http://board:8080` returns `north-61`.
diagnostics.credential_identity: The repository Secret UID changed; recreating station-repository keeps its name while losing the original credential object recorded by setup. [Cause and check](guides#guide=gitops-delivery&section=delivery-original-secret-identity)
diagnostics.credential_binding: The original Secret no longer identifies the supplied Git repository and account as an Argo repository credential; the retired URL, changed username/type or missing repository label can prevent its use. [Cause and check](guides#guide=gitops-delivery&section=delivery-secret-repository-binding)
diagnostics.credential_value: The Secret password does not match the protected approved value; the supplied retired password or an incomplete credential repair can leave Argo unable to authenticate to the original repository. [Cause and check](guides#guide=gitops-delivery&section=delivery-approved-secret-password)
diagnostics.application_identity: The board Application UID changed; deleting and recreating the Application replaces the original delivery identity even if its name and manifests remain the same. [Cause and check](guides#guide=gitops-delivery&section=delivery-original-application-identity)
diagnostics.git_storage: A checked Git configuration contains the credential password or its Basic encoding while granting group/other permissions; storing the repaired header in a broadly accessible configuration can expose the working credential. [Cause and check](guides#guide=gitops-delivery&section=delivery-private-git-configuration)
diagnostics.git_target: Git resolves the supplied repository URL to a different authority or path; a URL rewrite may redirect the workstation to another repository even when its branch happens to match. [Cause and check](guides#guide=gitops-delivery&section=delivery-direct-git-authority)
diagnostics.git_access: The original repository cannot be queried or its main ref differs from the frozen release; the retired workstation Authorization header, missing access or a changed remote publication can explain it. [Cause and check](guides#guide=gitops-delivery&section=delivery-authenticated-remote-main)
diagnostics.git_budget: A Git or Kubernetes observation exceeded its command or overall deadline; a slow API, network or authentication endpoint can prevent completing all delivery-access comparisons in time. [Cause and check](guides#guide=gitops-delivery&section=delivery-access-observation-budget)
diagnostics.git_observation: Delivery access could not be observed; missing protected receipt or objects, invalid JSON/credential encoding, unreadable Git configuration or failed API operations may explain it. [Cause and check](guides#guide=gitops-delivery&section=delivery-access-observation-inputs)
diagnostics.probe_0_1: The legacy Secret password comparison failed or the access probe stopped before a named marker; an unrepaired password, a changed platform.env expectation or unavailable environment/Python inputs may explain it. [Cause and check](guides#guide=gitops-delivery&section=delivery-password-gate-and-startup)
diagnostics.delivery_permissions: The required narrow Secret access was not verified; missing patch permission for station-repository, a wrong namespace, broader list/unrelated-Secret permissions or unavailable platform.env or API inputs can explain it. [Cause and check](guides#guide=gitops-delivery&section=delivery-scoped-secret-permissions)
diagnostics.delivery_source: Application board does not select the supplied repository, relative manifests path and main revision, or its definition could not be read; a stale or changed Application source can reconcile another publication. [Cause and check](guides#guide=gitops-delivery&section=delivery-board-git-source)
diagnostics.delivery_sync: Application board is not Synced and Healthy at release-commit, or its status could not be read; repaired credentials may still need a refresh and reconciliation, or the selected release and observed revision may differ. [Cause and check](guides#guide=gitops-delivery&section=delivery-board-release-adoption)
diagnostics.delivery_rollout: Deployment board did not complete rollout within 3 seconds; Git delivery may not have created the workload yet, Pods may still be unavailable, or the API observation failed. [Cause and check](guides#guide=gitops-delivery&section=delivery-board-workload-rollout)
diagnostics.delivery_http: The board Service path did not return north-61 or exec/HTTP failed; an undelivered workload, wrong Service routing or stale served content can prevent the intended publication from reaching its consumer. [Cause and check](guides#guide=gitops-delivery&section=delivery-board-service-response)
