hints.0.text: Separate Git authentication from source-path and workload failures.
hints.1.text: Inspect only the named Secret in ARGO_NAMESPACE; never print its password.
hints.2.text: Patch stringData.password, request a hard refresh, then verify revision and HTTP.
phrases.0: I diagnosed repository authentication before changing the application.
phrases.1: I limited credential repair to one named Secret.
phrases.2: I verified the Git revision and actual endpoint after reconciliation.
questions.0.points.0: Inspect repository fetch errors and Application conditions.
questions.0.points.1: Compare desired and observed revisions before rollout health.
questions.0.points.2: Probe the workload independently after authentication succeeds.
questions.0.prompt: How do you distinguish bad Git credentials from an unhealthy deployment?
questions.1.points.0: Constrain a Role by resourceNames to one Secret.
questions.1.points.1: Bind only the bay player ServiceAccount.
questions.1.points.2: Verify denial of unrelated secrets and listing.
questions.1.prompt: What is the smallest permission needed for this repair?
