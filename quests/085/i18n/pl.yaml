title: Konserwacja przy różnych właścicielach polityk
brief: |
  Dobrowolna konserwacja jest zablokowana, choć obie usługi są zdrowe. Przywróć bezpieczną konserwację z zachowaniem obecnych odpowiedzialności, bez opróżniania wspólnego węzła.

  Pracuj w `~/quest` na stacji roboczej. Dostępne pliki: `relay.yaml`, `companion.yaml`, `companion-budget.yaml`, `repository/policies/budget.yaml`, `application.yaml` i `maintenance-baseline.json`. Zamrożona kopia danych początkowych jest też w `/run/dq/facts/0/`.

  **Wymagania:**

  - Zachowaj pierwotne kontrolery, usługi i budżety; każda pula chroni co najmniej jeden zdrowy Pod własną polityką, a polityka z Git pozostaje zsynchronizowana.
  - Obie pule zwracają pierwotne odpowiedzi HTTP i mają dokładnie dwie gotowe repliki; pierwotny główny budżet zgłasza co najmniej dwa zdrowe Pody.
  - Wykonaj po jednej zaobserwowanej eviction z kontrolą UID na pierwotną pulę, zachowaj po jednym pierwotnym sąsiednim Podzie i przywróć co najmniej jedno dozwolone przerwanie w każdym budżecie.

  Zapisz dwa żądania policy/v1 Eviction jako tablicę w `~/quest/evictions.json` na stacji roboczej. Każde żądanie zawiera nazwę pierwotnego Poda, ten namespace i `deleteOptions.preconditions.uid`. Pierwotne tożsamości są w danych początkowych. Zachowaj dostarczone okno obserwacji podczas kończenia; `/run/dq/observations/evictions.json` zapisuje pierwotne UID, dla których serwer zaobserwował Eviction API. Plik żądania ani bezpośrednie usunięcie Poda nie dowodzą eviction. Zachowaj automatyczne samonaprawianie, istniejące źródło i cel; patch statusu Poda pozostaje niedostępny dla gracza.
stages.0.brief: Przywróć zbieżność polityk i zakończ bezpieczną konserwację obu pierwotnych pul.
stages.0.objectives.0.text: Zachowaj pierwotne kontrolery, usługi i budżety; każda pula chroni co najmniej
  jeden zdrowy Pod własną polityką, a polityka z Git pozostaje zsynchronizowana.
stages.0.objectives.1.text: Obie pule zwracają pierwotne odpowiedzi HTTP i mają dokładnie dwie gotowe
  repliki; pierwotny główny budżet zgłasza co najmniej dwa zdrowe Pody.
stages.0.objectives.2.text: Wykonaj po jednej zaobserwowanej eviction z kontrolą UID na pierwotną pulę,
  zachowaj po jednym pierwotnym sąsiednim Podzie i przywróć co najmniej jedno dozwolone przerwanie w każdym
  budżecie.
hints.0.text: Budżet dostępności, jego właściciel i faktyczna decyzja eviction opisują różne części tej
  samej operacji. Zdrowa usługa sama nie dowodzi możliwości dobrowolnej konserwacji.
hints.1.text: Porównaj `kubectl get pdb -o yaml`, `kubectl get applications -o yaml`, opublikowaną politykę
  Git oraz etykiety z `kubectl get pods --show-labels`. Sprawdź cały błąd Eviction API i conditions aplikacji;
  zestaw oba selektory z obiema pulami i odróżnij zmiany lokalne od źródła kontrolera.
hints.2.text: |-
  Sprawdź zgodność opublikowanej i aktywnej polityki przy zachowanym automatycznym samonaprawianiu. Przed każdym żądaniem sprawdź `kubectl get pdb` i wybierz pierwotną nazwę/UID z zamrożonych danych. Po każdej prawdziwej eviction poczekaj na gotowość zastępstwa; sprawdź `cat evictions.json`, `cat /run/dq/observations/evictions.json` i `kubectl get pods -o wide`. Oczekuj po jednym zaobserwowanym pierwotnym UID i zachowanym pierwotnym sąsiedzie na pulę, dwóch gotowych replik i odzyskanej możliwości przerwania. Sprawdź obie odpowiedzi HTTP z Poda aplikacji.

  ```sh
  (
    set -euo pipefail
    head=$(git -C repository ls-remote origin refs/heads/main | cut -f1)
    kubectl get application maintenance -o json |
      jq -e --arg head "$head" '.status.sync.revision==$head and .status.sync.status=="Synced" and .spec.syncPolicy.automated.selfHeal==true'
    jq -er '.[].deleteOptions.preconditions.uid' evictions.json
    jq -er '.[]' /run/dq/observations/evictions.json
    for pool in relay companion; do
      jq --arg pool "$pool" '.pools[$pool]' maintenance-baseline.json
      kubectl get pods -l "app=$pool" -o json |
        jq '.items[] | {name:.metadata.name,uid:.metadata.uid,ready:any(.status.conditions[]?; .type=="Ready" and .status=="True")}'
      kubectl get pdb "$pool" -o json |
        jq -e '.status.observedGeneration==.metadata.generation and .status.currentHealthy>=2 and .status.disruptionsAllowed>=1'
      test "$(kubectl exec deployment/relay -- wget -qO- -T 3 "http://$pool:8080")" = "$pool-85"
    done
  )
  ```
debrief: Minimum zarządzane przez Git i niezależnie zarządzany selektor wymagały różnych poprawek. Dodatni
  zapas przerwań nie usuwał nakładania się polityk. Zachowane tożsamości, eviction zaobserwowane przez
  serwer oraz przywrócone usługi potwierdzają wynik konserwacji.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
diagnostics.probe_0_0: Główny budget może wybierać inną aplikację lub nie zachowywać zdrowego minimum; wczesna kontrola wymaga tożsamości puli i dokładnie jednego pola dostępności z zaokrąglonym minimum co najmniej jeden. Błędy Git fetch, odczytu zasobów i startu przed nazwanymi wynikami też dają fallback. [Przyczyna i kontrola](guides#guide=kubernetes-17&section=maintenance-pools-primary-policy-and-observer)
diagnostics.maintenance_source: Lokalna zmiana głównego budget może być cofana przez self-healing albo opublikowana policy i zsynchronizowana revision są różne. Opublikuj naprawę przez zachowane źródło i czekaj na tę samą revision; zachowaj source, project, destination i automatyczne self-healing/pruning. [Przyczyna i kontrola](guides#guide=kubernetes-17&section=maintenance-pools-git-policy-owner)
diagnostics.maintenance_identity: Kontroler, Service, budget lub aplikacja mogły zostać odtworzone, albo wybrany Pod pozostał przy wymianie pierwotnego sąsiada. Zachowaj zapisane UID zasobów i po każdej evikcji dokładnie jednego pierwotnego sąsiada w puli przy nieobecnym wybranym UID. [Przyczyna i kontrola](guides#guide=kubernetes-17&section=maintenance-pools-resources-and-sibling)
diagnostics.maintenance_scope: Dostarczony companion selector obejmuje obie pule, więc policy się nakładają; każdy budget ma zachować tożsamość własnej aplikacji, pasować do własnego template i wykluczać drugą pulę. [Przyczyna i kontrola](guides#guide=kubernetes-17&section=maintenance-pools-separate-selectors)
diagnostics.maintenance_policy: Budget może pomijać pole dostępności, ustawiać oba lub dopuszczać utratę wszystkich replik; użyj dokładnie jednego minAvailable/maxUnavailable z zaokrąglonym minimum przy dwóch replikach co najmniej jeden. Zgoda na następne disruption jest sprawdzana osobno. [Przyczyna i kontrola](guides#guide=kubernetes-17&section=maintenance-pools-healthy-minimum)
diagnostics.maintenance_health: Pula mogła zmienić liczbę replik, pozostać niegotowa po evikcji lub zwracać błędną/niedostępną odpowiedź. Zachowaj dwie gotowe repliki na pulę, aktualne observed generations i pierwotne odpowiedzi Service; główny budget ma widzieć co najmniej dwa zdrowe Pod. [Przyczyna i kontrola](guides#guide=kubernetes-17&section=maintenance-pools-two-ready-and-http)
diagnostics.maintenance_authority: Uprawnienia gracza mogły zostać rozszerzone przy omijaniu kontroli zdrowia lub disruption; patch Pod status ma pozostać zabroniony. Oczekiwane stdout to no, także przy zwykłym niezerowym statusie odmowy polecenia autoryzacji. [Przyczyna i kontrola](guides#guide=kubernetes-17&section=maintenance-pools-status-remains-denied)
diagnostics.probe_0_1: Obserwacja zdrowia może zakończyć się przed nazwanym wynikiem error trap; sprawdź polecenia i kontekst klastra. Zwykłe błędy API, rollout generation i HTTP w grupie dają już maintenance_health. [Przyczyna i kontrola](guides#guide=kubernetes-17&section=maintenance-pools-health-observer-startup)
diagnostics.maintenance_requests: evictions.json może brakować, być wadliwy lub wybierać tę samą pulę dwa razy; zapisz dokładnie dwa policy/v1 Eviction, po jednym pierwotnym Pod z każdej puli, z pierwotną nazwą, tym namespace i zgodnym UID precondition. [Przyczyna i kontrola](guides#guide=kubernetes-17&section=maintenance-pools-two-original-uid-requests)
diagnostics.maintenance_evictions: Plik żądania lub bezpośrednie usunięcie nie dowodzi wyniku Eviction API; serwer musi zaobserwować evikcję API każdego wybranego pierwotnego UID. Zachowaj dostarczone okno zakończenia dla obserwacji; brak lub nieczytelne potwierdzenie też daje marker. [Przyczyna i kontrola](guides#guide=kubernetes-17&section=maintenance-pools-protected-api-observation)
diagnostics.maintenance_allowance: Główny budget zaczyna z minAvailable równym obu replikom albo gotowość zastępstwa i uzgodnienie statusu nadal blokują disruption. Każdy budget po wybranej evikcji ma obserwować bieżącą generation, co najmniej dwa zdrowe Pod i jedno dozwolone disruption. [Przyczyna i kontrola](guides#guide=kubernetes-17&section=maintenance-pools-next-disruption)
diagnostics.probe_0_2: Obserwacja evikcji może zakończyć się podczas odczytu zasobów lub ładowania Python helpers przed nazwanym wynikiem; sprawdź klaster i dq_check. Błędy żądań, potwierdzeń, tożsamości, zdrowia i allowance w nazwanej kontroli zachowują swoje markery. [Przyczyna i kontrola](guides#guide=kubernetes-17&section=maintenance-pools-eviction-observer-startup)
