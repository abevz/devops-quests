title: Konserwacja przy różnych właścicielach polityk
brief: |
  Dobrowolna konserwacja jest zablokowana, choć obie usługi są zdrowe. Przywróć bezpieczną konserwację z zachowaniem obecnych odpowiedzialności, bez opróżniania wspólnego węzła.

  Pracuj w `~/quest` na stacji roboczej. Dostępne pliki: `relay.yaml`, `companion.yaml`, `companion-budget.yaml`, `repository/policies/budget.yaml`, `application.yaml` i `maintenance-baseline.json`. Zamrożona kopia danych początkowych jest też w `/run/dq/facts/0/`.

  **Wymagania:**

  - Zachowaj pierwotne kontrolery, usługi i budżety; każda pula chroni co najmniej jeden zdrowy Pod własną polityką, a polityka z Git pozostaje zsynchronizowana.
  - Obie pule zwracają pierwotne odpowiedzi HTTP i mają dokładnie dwie gotowe repliki; pierwotny główny budżet zgłasza co najmniej dwa zdrowe Pody.
  - Wykonaj po jednej zaobserwowanej eviction z kontrolą UID na pierwotną pulę, zachowaj po jednym pierwotnym sąsiednim Podzie i przywróć co najmniej jedno dozwolone przerwanie w każdym budżecie.

  Zapisz dwa żądania policy/v1 Eviction jako tablicę w `~/quest/evictions.json` na stacji roboczej. Każde żądanie zawiera nazwę pierwotnego Poda, ten namespace i `deleteOptions.preconditions.uid`. Pierwotne tożsamości są w danych początkowych. Zachowaj dostarczone okno obserwacji podczas kończenia; `/run/dq/observations/evictions.json` zapisuje pierwotne UID, dla których serwer zaobserwował Eviction API. Plik żądania ani bezpośrednie usunięcie Poda nie dowodzą eviction. Zachowaj automatyczne samonaprawianie, istniejące źródło i cel; patch statusu Poda pozostaje niedostępny dla gracza.
stages.0.brief: Przywróć zbieżność polityk i zakończ bezpieczną konserwację obu pierwotnych pul.
stages.0.objectives.0.text: Zachowaj pierwotne kontrolery, usługi i budżety; każda pula chroni co najmniej
  jeden zdrowy Pod własną polityką, a polityka z Git pozostaje zsynchronizowana.
stages.0.objectives.1.text: Obie pule zwracają pierwotne odpowiedzi HTTP i mają dokładnie dwie gotowe
  repliki; pierwotny główny budżet zgłasza co najmniej dwa zdrowe Pody.
stages.0.objectives.2.text: Wykonaj po jednej zaobserwowanej eviction z kontrolą UID na pierwotną pulę,
  zachowaj po jednym pierwotnym sąsiednim Podzie i przywróć co najmniej jedno dozwolone przerwanie w każdym
  budżecie.
hints.0.text: Budżet dostępności, jego właściciel i faktyczna decyzja eviction opisują różne części tej
  samej operacji. Zdrowa usługa sama nie dowodzi możliwości dobrowolnej konserwacji.
hints.1.text: Porównaj `kubectl get pdb -o yaml`, `kubectl get applications -o yaml`, opublikowaną politykę
  Git oraz etykiety z `kubectl get pods --show-labels`. Sprawdź cały błąd Eviction API i conditions aplikacji;
  zestaw oba selektory z obiema pulami i odróżnij zmiany lokalne od źródła kontrolera.
hints.2.text: Sprawdź zgodność opublikowanej i aktywnej polityki przy zachowanym automatycznym samonaprawianiu.
  Przed każdym żądaniem sprawdź `kubectl get pdb` i wybierz pierwotną nazwę/UID z zamrożonych danych.
  Po każdej prawdziwej eviction poczekaj na gotowość zastępstwa; sprawdź `cat evictions.json`, `cat /run/dq/observations/evictions.json`
  i `kubectl get pods -o wide`. Oczekuj po jednym zaobserwowanym pierwotnym UID i zachowanym pierwotnym
  sąsiedzie na pulę, dwóch gotowych replik i odzyskanej możliwości przerwania. Sprawdź obie odpowiedzi
  HTTP z Poda aplikacji.
debrief: Minimum zarządzane przez Git i niezależnie zarządzany selektor wymagały różnych poprawek. Dodatni
  zapas przerwań nie usuwał nakładania się polityk. Zachowane tożsamości, eviction zaobserwowane przez
  serwer oraz przywrócone usługi potwierdzają wynik konserwacji.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
