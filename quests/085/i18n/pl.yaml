title: Bezpieczeństwo przed zakłóceniami PDB
brief: 'Zestaw replik potrzebuje zapasu na dobrowolną konserwację z zachowaniem dostępności. Wspólny węzeł
  ma pozostać uruchomiony.


  Pracuj w `~/quest` na workstation. Dostarczone pliki wejściowe: `deployment.yaml`, `budget.yaml`.


  **Wymagania:**

  - PDB `relay` wymaga co najmniej jednego zdrowego Poda.

  - PDB `relay` zgłasza co najmniej dwa zdrowe Pody.

  - PDB `relay` pozwala na co najmniej jedno dobrowolne zakłócenie.

  '
stages.0.brief: Zachowaj zdrowe minimum, dopuszczając dobrowolne zakłócenie.
stages.0.objectives.0.text: PDB `relay` wymaga co najmniej jednego zdrowego Poda.
stages.0.objectives.1.text: PDB `relay` zgłasza co najmniej dwa zdrowe Pody.
stages.0.objectives.2.text: PDB `relay` pozwala na co najmniej jedno dobrowolne zakłócenie.
hints.0.text: Dobrowolna konserwacja wymaga zapasu w budżecie dostępności.
hints.1.text: 'Przeczytaj currentHealthy i disruptionsAllowed na PDB.


  Dzięki dwóm replikom minAvailable=2 nie pozostawia żadnego budżetu na zakłócenia.


  Sprawdź dostarczone definicje, bieżące zasoby i zdarzenia.


  ```sh

  kubectl get pdb relay -o yaml

  kubectl describe deployment relay

  ```'
hints.2.text: 'Zachowaj minAvailable=1 i zweryfikuj dwie sprawne repliki oraz jedną dozwoloną przerwę; nie
  opróżniaj węzła współdzielonego.


  Sprawdź obserwowany wynik:


  ```sh

  kubectl get pdb relay

  kubectl get pods -l app=relay

  ```


  Oczekuj co najmniej dwóch zdrowych Podów, jednej dozwolonej przerwy i minimum jednego; nie wykonuj drain
  współdzielonego węzła.'
debrief: minAvailable dorównał pełnej liczbie replik i zablokował wszelkie zakłócenia. Zachowałeś jedną wymaganą
  replikę i zweryfikowałeś, że jedna pozwala na zakłócenie dwóch zdrowych kapsuł.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
diagnostics.probe_0_0: 'Bieżące dane nie pozwalają potwierdzić tego celu: PDB `relay` wymaga co najmniej jednego
  zdrowego Poda.'
