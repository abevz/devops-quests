diagnostics.maintenance_policy: Każdy oddzielny budżet musi zachować co najmniej jeden zdrowy Pod.
diagnostics.maintenance_evictions: Serwer musi zaobserwować Eviction API dla każdego wybranego pierwotnego
  UID; bezpośrednie usunięcie i pliki żądań nie wystarczą.
diagnostics.maintenance_source: Opublikuj politykę w pierwotnym źródle i poczekaj na synchronizację tej
  samej rewizji z automatycznym samonaprawianiem.
diagnostics.maintenance_identity: Zachowaj pierwotne kontrolery, usługi, budżety i tożsamości niewybranych
  pierwotnych Podów.
diagnostics.maintenance_scope: Każda polityka musi wybierać własną pierwotną pulę bez obejmowania drugiej.
diagnostics.maintenance_health: Przywróć dwie gotowe repliki i pierwotną odpowiedź HTTP w każdej puli.
diagnostics.maintenance_authority: Gracz nie może mieć prawa do patch statusu Poda.
diagnostics.maintenance_requests: Zapisz dwa żądania policy/v1 dla różnych pierwotnych Podów z tym namespace,
  pasującymi nazwami i warunkami UID.
diagnostics.maintenance_allowance: Poczekaj, aż oba budżety zaobserwują poprawioną generację i pozwolą
  na kolejne dobrowolne przerwanie.
