title: Bezpieczeństwo przed zakłóceniami PDB
brief: 'Dołączyłeś do operacji SignalRail. Pozwól na bezpieczną eksmisję, zachowując jedną zdrową replikę.
  Pracuj w ~/quest. Wszystkie zmiany przechowuj w tej komorze szkoleniowej.


  Wejścia w `~/quest`: `deployment.json`, `budget.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Wszystkie zmiany muszą pozostać w tej zatoce.'
stages.0.brief: Zachowaj dostępną jedną replikę i pozwól na jedno zakłócenie. Nie opróżniaj udostępnionego
  węzła.
stages.0.objectives.0.text: PDB `relay` wymaga co najmniej jednego zdrowego Poda.
stages.0.objectives.1.text: PDB `relay` zgłasza co najmniej dwa zdrowe Pody.
stages.0.objectives.2.text: PDB `relay` pozwala na co najmniej jedno dobrowolne zakłócenie.
hints.0.text: Przeczytaj currentHealthy i disruptionsAllowed na PDB.
hints.1.text: Dzięki dwóm replikom minAvailable=2 nie pozostawia żadnego budżetu na zakłócenia.
hints.2.text: Zachowaj minAvailable=1 i zweryfikuj dwie sprawne repliki oraz jedną dozwoloną przerwę;
  nie opróżniaj węzła współdzielonego.
debrief: minAvailable dorównał pełnej liczbie replik i zablokował wszelkie zakłócenia. Zachowałeś jedną
  wymaganą replikę i zweryfikowałeś, że jedna pozwala na zakłócenie dwóch zdrowych kapsuł.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
