title: Seguridad contra interrupciones PDB
brief: 'El conjunto de réplicas necesita margen para mantenimiento voluntario sin perder disponibilidad. Mantén
  en funcionamiento el nodo compartido.


  Trabaja en `~/quest` en la workstation. Archivos de entrada suministrados: `deployment.yaml`, `budget.yaml`.


  **Requisitos:**

  - El PDB `relay` requiere al menos un Pod sano.

  - El PDB `relay` indica al menos dos Pods sanos.

  - El PDB `relay` permite al menos una interrupción voluntaria.

  '
stages.0.brief: Conserva un mínimo sano y permite una interrupción voluntaria.
stages.0.objectives.0.text: El PDB `relay` requiere al menos un Pod sano.
stages.0.objectives.1.text: El PDB `relay` indica al menos dos Pods sanos.
stages.0.objectives.2.text: El PDB `relay` permite al menos una interrupción voluntaria.
hints.0.text: El mantenimiento voluntario necesita margen en el presupuesto de disponibilidad.
hints.1.text: 'Lea currentHealthy y disruptionsAllowed en PDB.


  Con dos réplicas, minAvailable=2 no deja ningún presupuesto de interrupción.


  Inspecciona las definiciones suministradas, los recursos actuales y los eventos.


  ```sh

  kubectl get pdb relay -o yaml

  kubectl describe deployment relay

  ```'
hints.2.text: 'Mantenga minAvailable=1 y verifique dos réplicas en buen estado más una interrupción permitida;
  no drene el nodo compartido.


  Verifica el resultado observado:


  ```sh

  kubectl get pdb relay

  kubectl get pods -l app=relay

  ```


  Se esperan al menos dos Pods sanos, al menos una interrupción permitida y un mínimo sano de uno; no drenes
  el nodo compartido.'
debrief: minAvailable igualó el recuento completo de réplicas y bloqueó todas las interrupciones. Conservó
  una réplica requerida y verificó una interrupción permitida con dos pods en buen estado.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el estado de workload y su preparación después del cambio.
diagnostics.probe_0_0: 'Los datos actuales no permiten verificar este objetivo: El PDB `relay` requiere al menos
  un Pod sano.'
