title: Mantenimiento con responsables de políticas distintos
brief: |
  El mantenimiento voluntario está bloqueado aunque ambos servicios están sanos. Recupera el mantenimiento seguro respetando las responsabilidades existentes, sin drenar el nodo compartido.

  Trabaja en `~/quest` en la estación. Entradas: `relay.yaml`, `companion.yaml`, `companion-budget.yaml`, `repository/policies/budget.yaml`, `application.yaml` y `maintenance-baseline.json`. La referencia también está congelada en `/run/dq/facts/0/`.

  **Requisitos:**

  - Conserva los controladores, servicios y presupuestos originales; cada pool protege al menos un Pod sano con su propia política, y la política de Git permanece sincronizada.
  - Ambos pools sirven sus respuestas HTTP originales con exactamente dos réplicas listas; el presupuesto primario original indica al menos dos Pods sanos.
  - Completa una eviction observada y protegida por UID por pool original, conserva un Pod vecino original por pool y recupera al menos una interrupción permitida en cada presupuesto.

  Guarda las dos solicitudes policy/v1 Eviction como un array en `~/quest/evictions.json` en la estación. Cada solicitud identifica el nombre de un Pod original, este namespace y `deleteOptions.preconditions.uid`. Las identidades originales están en la referencia. Conserva la ventana de observación al terminar; `/run/dq/observations/evictions.json` registra los UID originales cuya eviction observó el servidor mediante Eviction API. Un archivo de solicitud o borrar directamente el Pod no prueba una eviction. Conserva la autocorrección automática, la fuente y su destino existentes; el jugador sigue sin poder aplicar patch al estado de Pods.
stages.0.brief: Recupera la convergencia de políticas y completa el mantenimiento seguro de ambos pools
  originales.
stages.0.objectives.0.text: Conserva los controladores, servicios y presupuestos originales; cada pool
  protege al menos un Pod sano con su propia política, y la política de Git permanece sincronizada.
stages.0.objectives.1.text: Ambos pools sirven sus respuestas HTTP originales con exactamente dos réplicas
  listas; el presupuesto primario original indica al menos dos Pods sanos.
stages.0.objectives.2.text: Completa una eviction observada y protegida por UID por pool original, conserva
  un Pod vecino original por pool y recupera al menos una interrupción permitida en cada presupuesto.
hints.0.text: El presupuesto de disponibilidad, su responsable y la decisión real de eviction describen
  partes distintas de una misma operación. La salud local no demuestra por sí sola que pueda realizarse
  mantenimiento voluntario.
hints.1.text: Compara `kubectl get pdb -o yaml`, `kubectl get applications -o yaml`, la política publicada
  en Git y las etiquetas de `kubectl get pods --show-labels`. Revisa el error completo de Eviction API
  y las condiciones de la aplicación; compara ambos selectores con ambos pools y distingue cambios locales
  de la fuente del controlador.
hints.2.text: Verifica que la política publicada y la activa coincidan, conservando la autocorrección
  automática. Antes de cada solicitud, consulta `kubectl get pdb` y selecciona nombre/UID originales de
  la referencia congelada. Tras cada eviction real, espera las réplicas de reemplazo listas; revisa `cat
  evictions.json`, `cat /run/dq/observations/evictions.json` y `kubectl get pods -o wide`. Debe haber
  un UID original observado y un vecino original conservado por pool, dos réplicas listas y capacidad
  de interrupción recuperada. Prueba ambas respuestas HTTP desde un Pod de carga.
debrief: El mínimo gestionado por Git y el selector gestionado de forma independiente necesitaron reparaciones
  distintas. Un margen positivo de interrupciones no anulaba las políticas superpuestas. Las identidades
  conservadas, las evictions observadas por el servidor y los servicios recuperados demuestran el resultado.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el estado de workload y su preparación después del cambio.
