  servicios y presupuestos originales; cada pool protege al menos un Pod sano con su propia política,
  y la política de Git permanece sincronizada.'
diagnostics.probe_0_1: 'Las entradas actuales no permitieron verificar este objetivo: Ambos pools sirven
  sus respuestas HTTP originales con exactamente dos réplicas listas; el presupuesto primario original
  indica al menos dos Pods sanos.'
diagnostics.probe_0_2: 'Las entradas actuales no permitieron verificar este objetivo: Completa una eviction
  observada y protegida por UID por pool original, conserva un Pod vecino original por pool y recupera
  al menos una interrupción permitida en cada presupuesto.'
diagnostics.maintenance_policy: Cada presupuesto separado debe conservar al menos un Pod sano.
diagnostics.maintenance_evictions: El servidor debe observar Eviction API para cada UID original seleccionado;
  el borrado directo y los archivos de solicitud son insuficientes.
diagnostics.maintenance_source: Publica la política en la fuente original y espera la sincronización de
  la misma revisión con autocorrección automática.
diagnostics.maintenance_identity: Conserva los controladores, servicios, presupuestos e identidades de
  Pods originales no seleccionados.
diagnostics.maintenance_scope: Cada política debe seleccionar su propio pool original sin cubrir el otro.
diagnostics.maintenance_health: Recupera dos réplicas listas y la respuesta HTTP original en cada pool.
diagnostics.maintenance_authority: El jugador no debe poder aplicar patch al estado de Pods.
diagnostics.maintenance_requests: Guarda dos solicitudes policy/v1 para distintos Pods originales con
  este namespace, nombres correspondientes y precondiciones UID.
diagnostics.maintenance_allowance: Espera a que ambos presupuestos observen la generación reparada y permitan
  otra interrupción voluntaria.
