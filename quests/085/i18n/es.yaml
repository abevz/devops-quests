title: Seguridad contra interrupciones PDB
brief: 'Te uniste a las operaciones de SignalRail. Permitir el desalojo seguro manteniendo una réplica
  saludable. Trabajar en ~/quest. Mantenga todos los cambios dentro de esta bahía de entrenamiento.


  Entradas en `~/quest`: `deployment.json`, `budget.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente los archivos suministrados, las imágenes
  precargadas y los servicios privados. Todos los cambios deben permanecer dentro de esta bahía.


  Criterios de éxito iniciales: se permite una interrupción con dos réplicas en buen estado.'
stages.0.brief: 'Mantenga una réplica disponible y permita una interrupción. No drene el nodo compartido.


  Criterios de éxito: se permite una interrupción con dos réplicas en buen estado.'
stages.0.objectives.0.text: Se permite una interrupción con dos réplicas sanas.
hints.0.text: Lea currentHealthy y disruptionsAllowed en PDB.
hints.1.text: Con dos réplicas, minAvailable=2 no deja ningún presupuesto de interrupción.
hints.2.text: Mantenga minAvailable=1 y verifique dos réplicas en buen estado más una interrupción permitida;
  no drene el nodo compartido.
debrief: minAvailable igualó el recuento completo de réplicas y bloqueó todas las interrupciones. Conservó
  una réplica requerida y verificó una interrupción permitida con dos pods en buen estado.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el estado de workload y su preparación después del cambio.
