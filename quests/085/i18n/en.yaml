title: Maintenance across policy owners
brief: |
  Voluntary maintenance is blocked although both services are healthy. Restore safe maintenance across the existing ownership paths without draining the shared node.

  Work in `~/quest` on the workstation. Supplied inputs: `relay.yaml`, `companion.yaml`, `companion-budget.yaml`, `repository/policies/budget.yaml`, `application.yaml` and `maintenance-baseline.json`. The baseline is also frozen under `/run/dq/facts/0/`.

  **Requirements:**

  - Retain the original controllers, services and budgets; each pool protects at least one healthy Pod with its own policy, and the Git-managed policy remains synchronized.
  - Both pools serve their original HTTP responses with exactly two ready replicas; the original primary budget reports at least two healthy Pods.
  - Complete one observed UID-guarded eviction per original pool, retain one original sibling per pool, and restore at least one allowed disruption in each budget.

  Save the two policy/v1 Eviction requests as an array in `~/quest/evictions.json` on the workstation. Each request identifies an original Pod name, this namespace and `deleteOptions.preconditions.uid`. Original identities are in the baseline. Preserve the supplied termination observation window; `/run/dq/observations/evictions.json` records original UIDs observed by the server through the Eviction API. A request file or direct Pod deletion does not prove eviction. Keep automatic self-healing, the existing source and its destination; Pod status remains unavailable for player patches.
stages.0.brief: Recover policy convergence and complete safe maintenance across both original pools.
stages.0.objectives.0.text: Retain the original controllers, services and budgets; each pool protects
  at least one healthy Pod with its own policy, and the Git-managed policy remains synchronized.
stages.0.objectives.1.text: Both pools serve their original HTTP responses with exactly two ready replicas;
  the original primary budget reports at least two healthy Pods.
stages.0.objectives.2.text: Complete one observed UID-guarded eviction per original pool, retain one original
  sibling per pool, and restore at least one allowed disruption in each budget.
hints.0.text: An availability budget, its owner and the actual eviction decision describe different parts
  of the same operation. Local health alone does not prove that voluntary maintenance can proceed.
hints.1.text: Compare `kubectl get pdb -o yaml`, `kubectl get applications -o yaml`, the published Git
  policy and Pod labels from `kubectl get pods --show-labels`. Inspect the complete Eviction API error
  and application conditions; compare both policy selectors with both pools, and distinguish local edits
  from the controller’s source.
hints.2.text: |-
  Verify the published source and live policy agree, with automated self-healing retained. Before each request, check `kubectl get pdb` and select an original name/UID from the frozen baseline. After each real eviction, wait for replacement readiness; check `cat evictions.json`, `cat /run/dq/observations/evictions.json` and `kubectl get pods -o wide`. Expect one observed original UID per pool, one original sibling retained in each pool, two ready replicas and renewed disruption capacity. Probe both service HTTP responses from a workload Pod.

  ```sh
  (
    set -euo pipefail
    head=$(git -C repository ls-remote origin refs/heads/main | cut -f1)
    kubectl get application maintenance -o json |
      jq -e --arg head "$head" '.status.sync.revision==$head and .status.sync.status=="Synced" and .spec.syncPolicy.automated.selfHeal==true'
    jq -er '.[].deleteOptions.preconditions.uid' evictions.json
    jq -er '.[]' /run/dq/observations/evictions.json
    for pool in relay companion; do
      jq --arg pool "$pool" '.pools[$pool]' maintenance-baseline.json
      kubectl get pods -l "app=$pool" -o json |
        jq '.items[] | {name:.metadata.name,uid:.metadata.uid,ready:any(.status.conditions[]?; .type=="Ready" and .status=="True")}'
      kubectl get pdb "$pool" -o json |
        jq -e '.status.observedGeneration==.metadata.generation and .status.currentHealthy>=2 and .status.disruptionsAllowed>=1'
      test "$(kubectl exec deployment/relay -- wget -qO- -T 3 "http://$pool:8080")" = "$pool-85"
    done
  )
  ```
debrief: The Git-owned minimum and independently managed selector required different repairs. An apparently
  positive disruption allowance did not override overlapping policies. Preserved identities, server-observed
  evictions and restored services demonstrate the maintenance outcome.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked the workload state and its readiness after the change.
diagnostics.probe_0_0: The primary budget may select the wrong application or retain no healthy minimum; its early check requires the pool identity and exactly one availability field with a rounded minimum of at least one. Git fetch, resource reads and observer startup errors before named results also use this fallback. [Cause and check](guides#guide=kubernetes-17&section=maintenance-pools-primary-policy-and-observer)
diagnostics.maintenance_source: A local primary-budget edit may be reverted by self-healing, or the published policy and synchronized revision may differ. Publish the repaired policy through the retained source and wait for the same revision; preserve its source, project, destination and automatic self-healing/pruning. [Cause and check](guides#guide=kubernetes-17&section=maintenance-pools-git-policy-owner)
diagnostics.maintenance_identity: A controller, Service, budget or application may have been recreated, or the selected Pod remains while the original sibling was also replaced. Preserve recorded resource UIDs and, after each eviction, retain exactly one original sibling per pool with the selected UID absent. [Cause and check](guides#guide=kubernetes-17&section=maintenance-pools-resources-and-sibling)
diagnostics.maintenance_scope: The supplied companion selector covers both pools, so the policies overlap; each budget must retain its own application identity, match its own template and exclude the other pool. [Cause and check](guides#guide=kubernetes-17&section=maintenance-pools-separate-selectors)
diagnostics.maintenance_policy: A budget may omit its availability field, set both fields or permit loss of every replica; use exactly one of minAvailable/maxUnavailable so its rounded minimum at two replicas remains at least one. Permission for the next disruption is checked separately. [Cause and check](guides#guide=kubernetes-17&section=maintenance-pools-healthy-minimum)
diagnostics.maintenance_health: A pool may have changed replica count, remain unready after eviction, or serve a wrong or unavailable response. Retain two ready replicas per pool, current observed generations and the original Service responses; the primary budget must see at least two healthy Pods. [Cause and check](guides#guide=kubernetes-17&section=maintenance-pools-two-ready-and-http)
diagnostics.maintenance_authority: Player authority may have been broadened while attempting to bypass health or disruption checks; patching Pod status must remain denied. The expected observation is stdout no, including the normal denied authorization command status. [Cause and check](guides#guide=kubernetes-17&section=maintenance-pools-status-remains-denied)
diagnostics.probe_0_1: The health observation may stop before its error trap can name a result; verify the command and cluster context. Ordinary API, rollout-generation and HTTP failures within this group already report maintenance_health. [Cause and check](guides#guide=kubernetes-17&section=maintenance-pools-health-observer-startup)
diagnostics.maintenance_requests: evictions.json may be missing, malformed or select the same pool twice; save exactly two policy/v1 Eviction requests, one original Pod per pool, with its original name, this namespace and matching UID precondition. [Cause and check](guides#guide=kubernetes-17&section=maintenance-pools-two-original-uid-requests)
diagnostics.maintenance_evictions: A request file or direct deletion does not establish an Eviction API outcome; the server must observe each selected original UID as an API eviction. Preserve the supplied termination window so observation can occur; a missing or unreadable receipt also reports this marker. [Cause and check](guides#guide=kubernetes-17&section=maintenance-pools-protected-api-observation)
diagnostics.maintenance_allowance: The primary budget starts with minAvailable equal to both replicas, or replacement readiness/status reconciliation may still block disruption. Each budget must observe its current generation, at least two healthy Pods and at least one allowed disruption after the selected eviction. [Cause and check](guides#guide=kubernetes-17&section=maintenance-pools-next-disruption)
diagnostics.probe_0_2: The eviction observation may stop during resource retrieval or Python helper loading before a named result; verify cluster access and dq_check. Request, receipt, identity, health and allowance failures that reach the named producer retain their specific markers. [Cause and check](guides#guide=kubernetes-17&section=maintenance-pools-eviction-observer-startup)
