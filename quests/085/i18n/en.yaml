title: PDB disruption safety
brief: |
  The replica set needs room for voluntary maintenance while remaining available. Keep the shared node running.

  Work in `~/quest` on the workstation. Supplied inputs: `deployment.json`, `budget.json`.

  **Requirements:**
  - PDB `relay` requires at least one healthy Pod.
  - PDB `relay` reports at least two healthy Pods and at least one allowed voluntary disruption.

  **Verify yourself before Check & finish:**
  Run these observation commands from `~/quest` on the workstation.
  - `kubectl get pdb relay -o yaml` — The healthy minimum is one, at least two Pods are healthy, and at least one voluntary disruption is allowed.
  - `kubectl get pods -l app=relay` — The protected replicas are healthy and available. No eviction or node drain is needed for this observation.
stages.0.brief: |
  Keep a healthy minimum while allowing a voluntary disruption.
stages.0.objectives.0.text: PDB `relay` requires at least one healthy Pod.
stages.0.objectives.1.text: PDB `relay` reports at least two healthy Pods.
stages.0.objectives.2.text: PDB `relay` allows at least one voluntary disruption.
hints.0.text: Read currentHealthy and disruptionsAllowed on the PDB.
hints.1.text: With two replicas, minAvailable=2 leaves no disruption budget.
hints.2.text: Keep minAvailable=1 and verify two healthy replicas plus one allowed disruption; do not
  drain the shared node.
debrief: minAvailable equaled the full replica count and blocked all disruptions. You retained one required
  replica and verified one allowed disruption with two healthy pods.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked the workload state and its readiness after the change.
