title: Maintenance across policy owners
brief: |
  Voluntary maintenance is blocked although both services are healthy. Restore safe maintenance across the existing ownership paths without draining the shared node.

  Work in `~/quest` on the workstation. Supplied inputs: `relay.yaml`, `companion.yaml`, `companion-budget.yaml`, `repository/policies/budget.yaml`, `application.yaml` and `maintenance-baseline.json`. The baseline is also frozen under `/run/dq/facts/0/`.

  **Requirements:**

  - Retain the original controllers, services and budgets; each pool protects at least one healthy Pod with its own policy, and the Git-managed policy remains synchronized.
  - Both pools serve their original HTTP responses with exactly two ready replicas; the original primary budget reports at least two healthy Pods.
  - Complete one observed UID-guarded eviction per original pool, retain one original sibling per pool, and restore at least one allowed disruption in each budget.

  Save the two policy/v1 Eviction requests as an array in `~/quest/evictions.json` on the workstation. Each request identifies an original Pod name, this namespace and `deleteOptions.preconditions.uid`. Original identities are in the baseline. Preserve the supplied termination observation window; `/run/dq/observations/evictions.json` records original UIDs observed by the server through the Eviction API. A request file or direct Pod deletion does not prove eviction. Keep automatic self-healing, the existing source and its destination; Pod status remains unavailable for player patches.
stages.0.brief: Recover policy convergence and complete safe maintenance across both original pools.
stages.0.objectives.0.text: Retain the original controllers, services and budgets; each pool protects
  at least one healthy Pod with its own policy, and the Git-managed policy remains synchronized.
stages.0.objectives.1.text: Both pools serve their original HTTP responses with exactly two ready replicas;
  the original primary budget reports at least two healthy Pods.
stages.0.objectives.2.text: Complete one observed UID-guarded eviction per original pool, retain one original
  sibling per pool, and restore at least one allowed disruption in each budget.
hints.0.text: An availability budget, its owner and the actual eviction decision describe different parts
  of the same operation. Local health alone does not prove that voluntary maintenance can proceed.
hints.1.text: Compare `kubectl get pdb -o yaml`, `kubectl get applications -o yaml`, the published Git
  policy and Pod labels from `kubectl get pods --show-labels`. Inspect the complete Eviction API error
  and application conditions; compare both policy selectors with both pools, and distinguish local edits
  from the controller’s source.
hints.2.text: Verify the published source and live policy agree, with automated self-healing retained.
  Before each request, check `kubectl get pdb` and select an original name/UID from the frozen baseline.
  After each real eviction, wait for replacement readiness; check `cat evictions.json`, `cat /run/dq/observations/evictions.json`
  and `kubectl get pods -o wide`. Expect one observed original UID per pool, one original sibling retained
  in each pool, two ready replicas and renewed disruption capacity. Probe both service HTTP responses
  from a workload Pod.
debrief: The Git-owned minimum and independently managed selector required different repairs. An apparently
  positive disruption allowance did not override overlapping policies. Preserved identities, server-observed
  evictions and restored services demonstrate the maintenance outcome.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked the workload state and its readiness after the change.
diagnostics.probe_0_0: 'Current inputs could not verify this objective: Retain the original controllers,
  services and budgets; each pool protects at least one healthy Pod with its own policy, and the Git-managed
  policy remains synchronized.'
diagnostics.probe_0_1: 'Current inputs could not verify this objective: Both pools serve their original
  HTTP responses with exactly two ready replicas; the original primary budget reports at least two healthy
  Pods.'
diagnostics.probe_0_2: 'Current inputs could not verify this objective: Complete one observed UID-guarded
  eviction per original pool, retain one original sibling per pool, and restore at least one allowed disruption
  in each budget.'
diagnostics.maintenance_policy: Each separate budget must retain a healthy minimum of at least one Pod.
diagnostics.maintenance_evictions: The server must observe an Eviction API outcome for each selected original
  UID; direct deletion and request files are insufficient.
diagnostics.maintenance_source: Publish the policy at the retained source and wait for the same revision
  to synchronize with automatic self-healing.
diagnostics.maintenance_identity: Retain the baseline controllers, services, budgets and unselected original
  Pod identities.
diagnostics.maintenance_scope: Each policy must select its own original pool without covering the other
  pool.
diagnostics.maintenance_health: Restore two ready replicas and the original HTTP response in each pool.
diagnostics.maintenance_authority: Player patches must not modify Pod status.
diagnostics.maintenance_requests: Save two policy/v1 requests for different original Pods with this namespace,
  matching names and UID preconditions.
diagnostics.maintenance_allowance: Wait for both budgets to observe the repaired generation and allow
  another voluntary disruption.
