title: PDB disruption safety
brief: 'You joined SignalRail operations. Allow safe eviction while retaining one healthy replica. Work
  in ~/quest. Keep all changes inside this training bay.


  Inputs in `~/quest`: `deployment.json`, `budget.json`.


  The bay has no Internet or external DNS. Use only its supplied files, preloaded images and private services.
  All changes must stay inside this bay.


  Initial success criteria: One disruption is allowed with two healthy replicas.'
stages.0.brief: 'Keep one replica available and allow one disruption. Do not drain the shared node.


  Success criteria: One disruption is allowed with two healthy replicas.'
stages.0.objectives.0.text: One disruption is allowed with two healthy replicas.
hints.0.text: Read currentHealthy and disruptionsAllowed on the PDB.
hints.1.text: With two replicas, minAvailable=2 leaves no disruption budget.
hints.2.text: Keep minAvailable=1 and verify two healthy replicas plus one allowed disruption; do not
  drain the shared node.
debrief: minAvailable equaled the full replica count and blocked all disruptions. You retained one required
  replica and verified one allowed disruption with two healthy pods.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked the workload state and its readiness after the change.
