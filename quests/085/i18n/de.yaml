title: PDB Störungssicherheit
brief: 'Sie sind dem Betrieb SignalRail beigetreten. Ermöglichen Sie eine sichere Entfernung und behalten
  Sie gleichzeitig ein gesundes Replikat bei. Arbeiten Sie in ~/quest.. Bewahren Sie alle Änderungen in
  diesem Trainingsbereich auf.


  Eingänge in `~/quest`: `deployment.json`, `budget.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur die bereitgestellten Dateien,
  vorinstallierten Bilder und privaten Dienste. Alle Änderungen müssen innerhalb dieser Bucht bleiben.


  Anfängliche Erfolgskriterien: Eine Unterbrechung ist mit zwei fehlerfreien Replikaten zulässig.'
stages.0.brief: 'Halten Sie ein Replikat verfügbar und lassen Sie eine Unterbrechung zu. Entleeren Sie
  den gemeinsam genutzten Knoten nicht.


  Erfolgskriterien: Eine Unterbrechung ist mit zwei fehlerfreien Replikaten zulässig.'
stages.0.objectives.0.text: Bei zwei fehlerfreien Replikaten ist eine Unterbrechung zulässig.
hints.0.text: Lesen Sie currentHealthy und disruptionsAllowed auf der Seite PDB.
hints.1.text: Mit zwei Nachbildungen hinterlässt minAvailable=2 kein Unterbrechungsbudget.
hints.2.text: Behalten Sie minAvailable=1 bei und überprüfen Sie zwei fehlerfreie Replikate plus eine
  zulässige Unterbrechung. Entleeren Sie den gemeinsam genutzten Knoten nicht.
debrief: minAvailable erreichte die vollständige Replikatanzahl und blockierte alle Störungen. Sie haben
  ein erforderliches Replikat beibehalten und eine zulässige Unterbrechung mit zwei fehlerfreien Pods
  überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe den workload-Status und seine Bereitschaft nach der Änderung überprüft.
