title: Wartung bei getrennten Richtlinienverantwortlichen
brief: |
  Freiwillige Wartung ist blockiert, obwohl beide Dienste gesund sind. Stelle sichere Wartung über die bestehenden Zuständigkeiten wieder her, ohne den gemeinsamen Knoten zu leeren.

  Arbeite in `~/quest` auf der Workstation. Vorhanden sind `relay.yaml`, `companion.yaml`, `companion-budget.yaml`, `repository/policies/budget.yaml`, `application.yaml` und `maintenance-baseline.json`. Die Baseline liegt auch unveränderlich unter `/run/dq/facts/0/`.

  **Anforderungen:**

  - Erhalte die ursprünglichen Controller, Dienste und Budgets; jeder Pool schützt mindestens einen gesunden Pod mit seiner eigenen Richtlinie, und die Git-Richtlinie bleibt synchronisiert.
  - Beide Pools liefern ihre ursprünglichen HTTP-Antworten mit genau zwei bereiten Replikaten; das ursprüngliche primäre Budget meldet mindestens zwei gesunde Pods.
  - Führe pro ursprünglichem Pool eine beobachtete UID-gesicherte Eviction durch, erhalte je einen ursprünglichen Nachbar-Pod und stelle mindestens eine erlaubte Unterbrechung pro Budget wieder her.

  Speichere die beiden policy/v1-Eviction-Anfragen als Array in `~/quest/evictions.json` auf der Workstation. Jede Anfrage enthält ursprünglichen Pod-Namen, diesen Namespace und `deleteOptions.preconditions.uid`. Die ursprünglichen Identitäten stehen in der Baseline. Erhalte das vorgegebene Beobachtungsfenster beim Beenden; `/run/dq/observations/evictions.json` enthält die ursprünglichen UIDs, deren Eviction der Server über die Eviction API beobachtet hat. Eine Anfragedatei oder direktes Pod-Löschen beweist keine Eviction. Erhalte automatische Selbstheilung, vorhandene Quelle und Ziel; der Spieler darf den Pod-Status weiterhin nicht patchen.
stages.0.brief: Stelle Richtlinienkonvergenz her und schließe sichere Wartung beider ursprünglichen Pools
  ab.
stages.0.objectives.0.text: Erhalte die ursprünglichen Controller, Dienste und Budgets; jeder Pool schützt
  mindestens einen gesunden Pod mit seiner eigenen Richtlinie, und die Git-Richtlinie bleibt synchronisiert.
stages.0.objectives.1.text: Beide Pools liefern ihre ursprünglichen HTTP-Antworten mit genau zwei bereiten
  Replikaten; das ursprüngliche primäre Budget meldet mindestens zwei gesunde Pods.
stages.0.objectives.2.text: Führe pro ursprünglichem Pool eine beobachtete UID-gesicherte Eviction durch,
  erhalte je einen ursprünglichen Nachbar-Pod und stelle mindestens eine erlaubte Unterbrechung pro Budget
  wieder her.
hints.0.text: Verfügbarkeitsbudget, Verantwortlicher und tatsächliche Eviction-Entscheidung beschreiben
  verschiedene Teile derselben Operation. Ein gesunder Dienst allein beweist noch keine mögliche freiwillige
  Wartung.
hints.1.text: Vergleiche `kubectl get pdb -o yaml`, `kubectl get applications -o yaml`, die veröffentlichte
  Git-Richtlinie und Labels aus `kubectl get pods --show-labels`. Lies den vollständigen Eviction-API-Fehler
  und die Application-Conditions; vergleiche beide Selektoren mit beiden Pools und unterscheide lokale
  Änderungen von der Controller-Quelle.
hints.2.text: Prüfe, dass veröffentlichte und aktive Richtlinie übereinstimmen und automatische Selbstheilung
  aktiv bleibt. Prüfe vor jeder Anfrage `kubectl get pdb` und wähle ursprünglichen Namen/UID aus der unveränderlichen
  Baseline. Warte nach jeder echten Eviction auf bereite Ersatz-Pods; prüfe `cat evictions.json`, `cat
  /run/dq/observations/evictions.json` und `kubectl get pods -o wide`. Erwartet werden je eine beobachtete
  ursprüngliche UID und ein erhaltener ursprünglicher Nachbar pro Pool, zwei bereite Replikate und erneute
  Unterbrechungskapazität. Prüfe beide HTTP-Antworten aus einem Workload-Pod.
debrief: Das von Git verwaltete Minimum und der unabhängig verwaltete Selektor brauchten verschiedene
  Korrekturen. Eine positive Unterbrechungskapazität hob überlappende Richtlinien nicht auf. Erhaltene
  Identitäten, vom Server beobachtete Evictions und wiederhergestellte Dienste belegen das Wartungsergebnis.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe den workload-Status und seine Bereitschaft nach der Änderung überprüft.
diagnostics.probe_0_0: Das primäre Budget wählt möglicherweise eine andere Anwendung oder erhält kein gesundes Minimum; die frühe Prüfung verlangt Pool-Identität und genau ein Verfügbarkeitsfeld mit aufgerundetem Minimum mindestens eins. Git-Fetch-, Ressourcenabruf- und Startfehler vor benannten Ergebnissen ergeben ebenfalls diesen Fallback. [Ursache und Prüfung](guides#guide=kubernetes-17&section=maintenance-pools-primary-policy-and-observer)
diagnostics.maintenance_source: Eine lokale Änderung des primären Budgets wird möglicherweise durch self-healing zurückgesetzt oder veröffentlichte Policy und synchronisierte Revision weichen ab. Veröffentlichen Sie über die erhaltene Quelle und warten Sie auf dieselbe Revision; erhalten Sie Source, Project, Destination und automatisches self-healing/Pruning. [Ursache und Prüfung](guides#guide=kubernetes-17&section=maintenance-pools-git-policy-owner)
diagnostics.maintenance_identity: Controller, Service, Budget oder Anwendung wurden möglicherweise neu erstellt, oder der ausgewählte Pod bleibt vorhanden, während auch sein ursprünglicher Nachbar ersetzt wurde. Erhalten Sie aufgezeichnete Ressourcen-UIDs und nach jeder Eviction genau einen ursprünglichen Nachbarn je Pool bei fehlender ausgewählter UID. [Ursache und Prüfung](guides#guide=kubernetes-17&section=maintenance-pools-resources-and-sibling)
diagnostics.maintenance_scope: Der gelieferte companion Selector umfasst beide Pools und lässt die Policies überlappen; jedes Budget muss seine eigene Anwendungsidentität erhalten, zum eigenen Template passen und den anderen Pool ausschließen. [Ursache und Prüfung](guides#guide=kubernetes-17&section=maintenance-pools-separate-selectors)
diagnostics.maintenance_policy: Ein Budget lässt möglicherweise sein Verfügbarkeitsfeld aus, setzt beide oder erlaubt den Verlust aller Repliken; verwenden Sie genau eines von minAvailable/maxUnavailable mit aufgerundetem Minimum mindestens eins bei zwei Repliken. Die nächste Disruption-Erlaubnis wird separat geprüft. [Ursache und Prüfung](guides#guide=kubernetes-17&section=maintenance-pools-healthy-minimum)
diagnostics.maintenance_health: Ein Pool hat möglicherweise die Replikenzahl geändert, bleibt nach Eviction unbereit oder liefert eine falsche beziehungsweise unerreichbare Antwort. Erhalten Sie zwei bereite Repliken je Pool, aktuelle observed generations und ursprüngliche Service-Antworten; das primäre Budget muss mindestens zwei gesunde Pods sehen. [Ursache und Prüfung](guides#guide=kubernetes-17&section=maintenance-pools-two-ready-and-http)
diagnostics.maintenance_authority: Die Spielerrechte wurden möglicherweise beim Umgehen von Gesundheits- oder Disruption-Prüfungen erweitert; Pod-Status-Patches müssen verweigert bleiben. Erwartet wird stdout no, einschließlich des gewöhnlichen Nichtnullstatus der verweigerten Autorisierungsabfrage. [Ursache und Prüfung](guides#guide=kubernetes-17&section=maintenance-pools-status-remains-denied)
diagnostics.probe_0_1: Die Gesundheitsbeobachtung endet möglicherweise, bevor der Error-Trap ein Ergebnis benennt; prüfen Sie Befehle und Clusterkontext. Gewöhnliche API-, Rollout-Generation- und HTTP-Fehler innerhalb dieser Gruppe melden bereits maintenance_health. [Ursache und Prüfung](guides#guide=kubernetes-17&section=maintenance-pools-health-observer-startup)
diagnostics.maintenance_requests: evictions.json fehlt möglicherweise, ist fehlerhaft oder wählt denselben Pool zweimal; speichern Sie genau zwei policy/v1 Eviction-Anfragen, je einen ursprünglichen Pod pro Pool, mit ursprünglichem Namen, aktuellem Namespace und passender UID-Vorbedingung. [Ursache und Prüfung](guides#guide=kubernetes-17&section=maintenance-pools-two-original-uid-requests)
diagnostics.maintenance_evictions: Eine Anfragedatei oder direktes Löschen belegt keinen Eviction-API-Ausgang; der Server muss jede ausgewählte ursprüngliche UID als API-Eviction beobachten. Erhalten Sie das gelieferte Beendigungsfenster für die Beobachtung; ein fehlender oder unlesbarer Beleg meldet denselben Marker. [Ursache und Prüfung](guides#guide=kubernetes-17&section=maintenance-pools-protected-api-observation)
diagnostics.maintenance_allowance: Das primäre Budget startet mit minAvailable gleich beiden Repliken, oder Ersatzbereitschaft und Statusabgleich blockieren noch Disruption. Jedes Budget muss nach der gewählten Eviction seine aktuelle Generation, mindestens zwei gesunde Pods und mindestens eine erlaubte Disruption beobachten. [Ursache und Prüfung](guides#guide=kubernetes-17&section=maintenance-pools-next-disruption)
diagnostics.probe_0_2: Die Eviction-Beobachtung endet möglicherweise beim Ressourcenabruf oder Laden von Python helpers vor einem benannten Ergebnis; prüfen Sie Clusterzugang und dq_check. Anfrage-, Beleg-, Identitäts-, Gesundheits- und Allowance-Fehler im benannten Prüfteil behalten eigene Marker. [Ursache und Prüfung](guides#guide=kubernetes-17&section=maintenance-pools-eviction-observer-startup)
