title: PDB Störungssicherheit
brief: |
  Der Replikatsatz benötigt Spielraum für freiwillige Wartung bei erhaltener Verfügbarkeit. Der gemeinsam genutzte Knoten muss weiterlaufen.

  Arbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte Eingabedateien: `deployment.yaml`, `budget.yaml`.

  **Anforderungen:**
  - PDB `relay` verlangt mindestens einen gesunden Pod.
  - PDB `relay` meldet mindestens zwei gesunde Pods und mindestens eine erlaubte freiwillige Unterbrechung.

  **Vor Check & finish selbst prüfen:**
  Führen Sie diese Beobachtungsbefehle in `~/quest` auf der Workstation aus.
  - `kubectl get pdb relay -o yaml` — Das gesunde Minimum beträgt eins, mindestens zwei Pods sind gesund und mindestens eine freiwillige Unterbrechung ist erlaubt.
  - `kubectl get pods -l app=relay` — Die geschützten Replikate sind gesund und verfügbar. Für diese Beobachtung sind weder Verdrängung noch Node-Drain erforderlich.
stages.0.brief: |
  Behalten Sie ein gesundes Minimum bei und erlauben Sie eine freiwillige Unterbrechung.
stages.0.objectives.0.text: PDB `relay` verlangt mindestens einen gesunden Pod.
stages.0.objectives.1.text: PDB `relay` meldet mindestens zwei gesunde Pods.
stages.0.objectives.2.text: PDB `relay` erlaubt mindestens eine freiwillige Unterbrechung.
hints.0.text: Lesen Sie currentHealthy und disruptionsAllowed auf der Seite PDB.
hints.1.text: Mit zwei Nachbildungen hinterlässt minAvailable=2 kein Unterbrechungsbudget.
hints.2.text: Behalten Sie minAvailable=1 bei und überprüfen Sie zwei fehlerfreie Replikate plus eine
  zulässige Unterbrechung. Entleeren Sie den gemeinsam genutzten Knoten nicht.
debrief: minAvailable erreichte die vollständige Replikatanzahl und blockierte alle Störungen. Sie haben
  ein erforderliches Replikat beibehalten und eine zulässige Unterbrechung mit zwei fehlerfreien Pods
  überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe den workload-Status und seine Bereitschaft nach der Änderung überprüft.
