diagnostics.maintenance_policy: Jedes getrennte Budget muss mindestens einen gesunden Pod erhalten.
diagnostics.maintenance_evictions: Der Server muss für jede gewählte ursprüngliche UID eine Eviction API
  beobachten; direktes Löschen und Anfragedateien reichen nicht.
diagnostics.maintenance_source: Veröffentliche die Richtlinie in der ursprünglichen Quelle und warte auf
  dieselbe synchronisierte Revision mit automatischer Selbstheilung.
diagnostics.maintenance_identity: Erhalte ursprüngliche Controller, Dienste, Budgets und Identitäten nicht
  gewählter ursprünglicher Pods.
diagnostics.maintenance_scope: Jede Richtlinie muss ihren eigenen ursprünglichen Pool auswählen, ohne
  den anderen zu erfassen.
diagnostics.maintenance_health: Stelle zwei bereite Replikate und die ursprüngliche HTTP-Antwort je Pool
  wieder her.
diagnostics.maintenance_authority: Der Spieler darf den Pod-Status nicht patchen.
diagnostics.maintenance_requests: Speichere zwei policy/v1-Anfragen für verschiedene ursprüngliche Pods
  mit diesem Namespace, passenden Namen und UID-Vorbedingungen.
diagnostics.maintenance_allowance: Warte, bis beide Budgets die korrigierte Generation beobachten und
  eine weitere freiwillige Unterbrechung zulassen.
