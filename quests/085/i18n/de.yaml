title: PDB Störungssicherheit
brief: 'Der Replikatsatz benötigt Spielraum für freiwillige Wartung bei erhaltener Verfügbarkeit. Der gemeinsam
  genutzte Knoten muss weiterlaufen.


  Arbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte Eingabedateien: `deployment.yaml`, `budget.yaml`.


  **Anforderungen:**

  - PDB `relay` verlangt mindestens einen gesunden Pod.

  - PDB `relay` meldet mindestens zwei gesunde Pods.

  - PDB `relay` erlaubt mindestens eine freiwillige Unterbrechung.

  '
stages.0.brief: Behalten Sie ein gesundes Minimum bei und erlauben Sie eine freiwillige Unterbrechung.
stages.0.objectives.0.text: PDB `relay` verlangt mindestens einen gesunden Pod.
stages.0.objectives.1.text: PDB `relay` meldet mindestens zwei gesunde Pods.
stages.0.objectives.2.text: PDB `relay` erlaubt mindestens eine freiwillige Unterbrechung.
hints.0.text: Freiwillige Wartung benötigt Spielraum im Verfügbarkeitsbudget.
hints.1.text: 'Lesen Sie currentHealthy und disruptionsAllowed auf der Seite PDB.


  Mit zwei Nachbildungen hinterlässt minAvailable=2 kein Unterbrechungsbudget.


  Prüfen Sie die mitgelieferten Definitionen, aktuellen Ressourcen und Ereignisse.


  ```sh

  kubectl get pdb relay -o yaml

  kubectl describe deployment relay

  ```'
hints.2.text: 'Behalten Sie minAvailable=1 bei und überprüfen Sie zwei fehlerfreie Replikate plus eine zulässige
  Unterbrechung. Entleeren Sie den gemeinsam genutzten Knoten nicht.


  Prüfen Sie das beobachtete Ergebnis:


  ```sh

  kubectl get pdb relay

  kubectl get pods -l app=relay

  ```


  Erwartet werden mindestens zwei gesunde Pods, mindestens eine erlaubte Unterbrechung und ein gesundes Minimum
  von einem; den gemeinsamen Knoten nicht drainen.'
debrief: minAvailable erreichte die vollständige Replikatanzahl und blockierte alle Störungen. Sie haben ein
  erforderliches Replikat beibehalten und eine zulässige Unterbrechung mit zwei fehlerfreien Pods überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe den workload-Status und seine Bereitschaft nach der Änderung überprüft.
diagnostics.probe_0_0: 'Mit den aktuellen Eingaben konnte dieses Ziel nicht geprüft werden: PDB `relay` verlangt
  mindestens einen gesunden Pod.'
