title: Wartung bei getrennten Richtlinienverantwortlichen
brief: |
  Freiwillige Wartung ist blockiert, obwohl beide Dienste gesund sind. Stelle sichere Wartung über die bestehenden Zuständigkeiten wieder her, ohne den gemeinsamen Knoten zu leeren.

  Arbeite in `~/quest` auf der Workstation. Vorhanden sind `relay.yaml`, `companion.yaml`, `companion-budget.yaml`, `repository/policies/budget.yaml`, `application.yaml` und `maintenance-baseline.json`. Die Baseline liegt auch unveränderlich unter `/run/dq/facts/0/`.

  **Anforderungen:**

  - Erhalte die ursprünglichen Controller, Dienste und Budgets; jeder Pool schützt mindestens einen gesunden Pod mit seiner eigenen Richtlinie, und die Git-Richtlinie bleibt synchronisiert.
  - Beide Pools liefern ihre ursprünglichen HTTP-Antworten mit genau zwei bereiten Replikaten; das ursprüngliche primäre Budget meldet mindestens zwei gesunde Pods.
  - Führe pro ursprünglichem Pool eine beobachtete UID-gesicherte Eviction durch, erhalte je einen ursprünglichen Nachbar-Pod und stelle mindestens eine erlaubte Unterbrechung pro Budget wieder her.

  Speichere die beiden policy/v1-Eviction-Anfragen als Array in `~/quest/evictions.json` auf der Workstation. Jede Anfrage enthält ursprünglichen Pod-Namen, diesen Namespace und `deleteOptions.preconditions.uid`. Die ursprünglichen Identitäten stehen in der Baseline. Erhalte das vorgegebene Beobachtungsfenster beim Beenden; `/run/dq/observations/evictions.json` enthält die ursprünglichen UIDs, deren Eviction der Server über die Eviction API beobachtet hat. Eine Anfragedatei oder direktes Pod-Löschen beweist keine Eviction. Erhalte automatische Selbstheilung, vorhandene Quelle und Ziel; der Spieler darf den Pod-Status weiterhin nicht patchen.
stages.0.brief: Stelle Richtlinienkonvergenz her und schließe sichere Wartung beider ursprünglichen Pools
  ab.
stages.0.objectives.0.text: Erhalte die ursprünglichen Controller, Dienste und Budgets; jeder Pool schützt
  mindestens einen gesunden Pod mit seiner eigenen Richtlinie, und die Git-Richtlinie bleibt synchronisiert.
stages.0.objectives.1.text: Beide Pools liefern ihre ursprünglichen HTTP-Antworten mit genau zwei bereiten
  Replikaten; das ursprüngliche primäre Budget meldet mindestens zwei gesunde Pods.
stages.0.objectives.2.text: Führe pro ursprünglichem Pool eine beobachtete UID-gesicherte Eviction durch,
  erhalte je einen ursprünglichen Nachbar-Pod und stelle mindestens eine erlaubte Unterbrechung pro Budget
  wieder her.
hints.0.text: Verfügbarkeitsbudget, Verantwortlicher und tatsächliche Eviction-Entscheidung beschreiben
  verschiedene Teile derselben Operation. Ein gesunder Dienst allein beweist noch keine mögliche freiwillige
  Wartung.
hints.1.text: Vergleiche `kubectl get pdb -o yaml`, `kubectl get applications -o yaml`, die veröffentlichte
  Git-Richtlinie und Labels aus `kubectl get pods --show-labels`. Lies den vollständigen Eviction-API-Fehler
  und die Application-Conditions; vergleiche beide Selektoren mit beiden Pools und unterscheide lokale
  Änderungen von der Controller-Quelle.
hints.2.text: Prüfe, dass veröffentlichte und aktive Richtlinie übereinstimmen und automatische Selbstheilung
  aktiv bleibt. Prüfe vor jeder Anfrage `kubectl get pdb` und wähle ursprünglichen Namen/UID aus der unveränderlichen
  Baseline. Warte nach jeder echten Eviction auf bereite Ersatz-Pods; prüfe `cat evictions.json`, `cat
  /run/dq/observations/evictions.json` und `kubectl get pods -o wide`. Erwartet werden je eine beobachtete
  ursprüngliche UID und ein erhaltener ursprünglicher Nachbar pro Pool, zwei bereite Replikate und erneute
  Unterbrechungskapazität. Prüfe beide HTTP-Antworten aus einem Workload-Pod.
debrief: Das von Git verwaltete Minimum und der unabhängig verwaltete Selektor brauchten verschiedene
  Korrekturen. Eine positive Unterbrechungskapazität hob überlappende Richtlinien nicht auf. Erhaltene
  Identitäten, vom Server beobachtete Evictions und wiederhergestellte Dienste belegen das Wartungsergebnis.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe den workload-Status und seine Bereitschaft nach der Änderung überprüft.
