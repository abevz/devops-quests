title: Безопасное нарушение PDB
brief: 'Набору реплик нужен запас для добровольного обслуживания с сохранением доступности. Общий узел должен
  продолжать работать.


  Работайте в `~/quest` на workstation. Предоставленные входные файлы: `deployment.yaml`, `budget.yaml`.


  **Требования:**

  - PDB `relay` требует хотя бы один здоровый Pod.

  - PDB `relay` сообщает как минимум о двух здоровых Pods.

  - PDB `relay` разрешает хотя бы одно добровольное прерывание.

  '
stages.0.brief: Сохраните здоровый минимум с возможностью добровольного прерывания.
stages.0.objectives.0.text: PDB `relay` требует хотя бы один здоровый Pod.
stages.0.objectives.1.text: PDB `relay` сообщает как минимум о двух здоровых Pods.
stages.0.objectives.2.text: PDB `relay` разрешает хотя бы одно добровольное прерывание.
hints.0.text: Добровольное обслуживание требует запаса в бюджете доступности.
hints.1.text: 'Проверьте currentHealthy и disruptionsAllowed у PDB.


  При двух репликах minAvailable=2 не оставляет бюджета нарушений.


  Изучите поставленные определения, текущие ресурсы и события.


  ```sh

  kubectl get pdb relay -o yaml

  kubectl describe deployment relay

  ```'
hints.2.text: 'Оставьте minAvailable=1 и проверьте две здоровые реплики и одно разрешённое нарушение; общий
  узел не дренировать.


  Проверьте наблюдаемый результат:


  ```sh

  kubectl get pdb relay

  kubectl get pods -l app=relay

  ```


  Ожидаются хотя бы два исправных Pod, хотя бы одно разрешённое прерывание и минимум один; не выполняйте drain
  общего узла.'
debrief: minAvailable совпадал с числом реплик и блокировал все нарушения. Вы сохранили обязательную реплику
  и проверили разрешённое нарушение при двух готовых pod.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: После изменения я проверил состояние workload и его готовность.
diagnostics.probe_0_0: 'Текущие данные не позволили проверить эту цель: PDB `relay` требует хотя бы один здоровый
  Pod.'
