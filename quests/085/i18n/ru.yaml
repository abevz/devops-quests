title: Обслуживание при разных владельцах политик
brief: |
  Добровольное обслуживание заблокировано, хотя оба сервиса исправны. Восстановите безопасное обслуживание с существующими владельцами ресурсов, не выполняя drain общего узла.

  Работайте в `~/quest` на рабочей станции. Даны `relay.yaml`, `companion.yaml`, `companion-budget.yaml`, `repository/policies/budget.yaml`, `application.yaml` и `maintenance-baseline.json`. Неизменяемая копия исходных данных находится в `/run/dq/facts/0/`.

  **Требования:**

  - Сохраните исходные контроллеры, сервисы и бюджеты; каждый пул защищает хотя бы один исправный Pod собственной политикой, а политика из Git остаётся синхронизированной.
  - Оба пула возвращают исходные HTTP-ответы и имеют ровно две готовые реплики; исходный основной бюджет сообщает хотя бы о двух исправных Pod.
  - Выполните по одному подтверждённому eviction с проверкой UID на каждый исходный пул, сохраните по одному исходному соседнему Pod и восстановите хотя бы одно допустимое прерывание в каждом бюджете.

  Сохраните два запроса policy/v1 Eviction массивом в `~/quest/evictions.json` на рабочей станции. Каждый запрос содержит имя исходного Pod, этот namespace и `deleteOptions.preconditions.uid`. Исходные идентификаторы указаны в baseline. Сохраните заданное окно наблюдения при завершении; `/run/dq/observations/evictions.json` содержит исходные UID, для которых сервер наблюдал Eviction API. Файл запроса и прямое удаление Pod не доказывают eviction. Сохраните автоматическое самовосстановление, существующий источник и его назначение; patch статуса Pod остаётся недоступен игроку.
stages.0.brief: Восстановите согласованность политик и завершите безопасное обслуживание обоих исходных
  пулов.
stages.0.objectives.0.text: Сохраните исходные контроллеры, сервисы и бюджеты; каждый пул защищает хотя
  бы один исправный Pod собственной политикой, а политика из Git остаётся синхронизированной.
stages.0.objectives.1.text: Оба пула возвращают исходные HTTP-ответы и имеют ровно две готовые реплики;
  исходный основной бюджет сообщает хотя бы о двух исправных Pod.
stages.0.objectives.2.text: Выполните по одному подтверждённому eviction с проверкой UID на каждый исходный
  пул, сохраните по одному исходному соседнему Pod и восстановите хотя бы одно допустимое прерывание в
  каждом бюджете.
hints.0.text: Бюджет доступности, его владелец и фактическое решение об eviction описывают разные стороны
  одной операции. Исправность сервиса сама по себе не гарантирует возможность добровольного обслуживания.
hints.1.text: Сопоставьте `kubectl get pdb -o yaml`, `kubectl get applications -o yaml`, опубликованную
  политику Git и метки из `kubectl get pods --show-labels`. Изучите полный отказ Eviction API и conditions
  приложения; сравните оба селектора с обоими пулами и отличайте локальные изменения от источника контроллера.
hints.2.text: |-
  Проверьте совпадение опубликованной и действующей политики при сохранённом автоматическом самовосстановлении. Перед каждым запросом смотрите `kubectl get pdb` и выбирайте исходные имя/UID из неизменяемого baseline. После реального eviction дождитесь готовности замены; проверьте `cat evictions.json`, `cat /run/dq/observations/evictions.json` и `kubectl get pods -o wide`. Ожидаются по одному подтверждённому исходному UID и сохранённому исходному соседу в каждом пуле, две готовые реплики и восстановленный запас прерываний. Проверьте HTTP обоих сервисов из Pod приложения.

  ```sh
  (
    set -euo pipefail
    head=$(git -C repository ls-remote origin refs/heads/main | cut -f1)
    kubectl get application maintenance -o json |
      jq -e --arg head "$head" '.status.sync.revision==$head and .status.sync.status=="Synced" and .spec.syncPolicy.automated.selfHeal==true'
    jq -er '.[].deleteOptions.preconditions.uid' evictions.json
    jq -er '.[]' /run/dq/observations/evictions.json
    for pool in relay companion; do
      jq --arg pool "$pool" '.pools[$pool]' maintenance-baseline.json
      kubectl get pods -l "app=$pool" -o json |
        jq '.items[] | {name:.metadata.name,uid:.metadata.uid,ready:any(.status.conditions[]?; .type=="Ready" and .status=="True")}'
      kubectl get pdb "$pool" -o json |
        jq -e '.status.observedGeneration==.metadata.generation and .status.currentHealthy>=2 and .status.disruptionsAllowed>=1'
      test "$(kubectl exec deployment/relay -- wget -qO- -T 3 "http://$pool:8080")" = "$pool-85"
    done
  )
  ```
debrief: Минимум под управлением Git и независимо управляемый селектор требовали разных исправлений. Положительный
  запас прерываний не отменял перекрытия политик. Сохранённые идентификаторы, наблюдаемые сервером eviction
  и восстановленные сервисы подтверждают результат обслуживания.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: После изменения я проверил состояние workload и его готовность.
diagnostics.probe_0_0: Основной budget может выбирать другое приложение или не сохранять здоровый минимум; ранняя проверка требует идентичность пула и ровно одно поле доступности с округлённым минимумом не меньше единицы. Ошибки Git fetch, чтения ресурсов и запуска до именованных результатов также дают fallback. [Причина и проверка](guides#guide=kubernetes-17&section=maintenance-pools-primary-policy-and-observer)
diagnostics.maintenance_source: Локальная правка основного budget может откатываться self-healing, либо опубликованная policy и синхронизированная revision расходятся. Опубликуйте исправление через сохранённый источник и дождитесь той же revision; сохраните source, project, destination и автоматические self-healing/pruning. [Причина и проверка](guides#guide=kubernetes-17&section=maintenance-pools-git-policy-owner)
diagnostics.maintenance_identity: Контроллер, Service, budget или приложение могли быть пересозданы, либо выбранный Pod остался, а исходный сосед также заменён. Сохраните записанные UID ресурсов и после каждого eviction ровно одного исходного соседа в пуле при отсутствии выбранного UID. [Причина и проверка](guides#guide=kubernetes-17&section=maintenance-pools-resources-and-sibling)
diagnostics.maintenance_scope: Выданный companion selector охватывает оба пула, создавая пересечение policy; каждый budget сохраняет идентичность своего приложения, выбирает свой template и исключает другой пул. [Причина и проверка](guides#guide=kubernetes-17&section=maintenance-pools-separate-selectors)
diagnostics.maintenance_policy: Budget может не иметь поля доступности, содержать оба поля или допускать потерю всех реплик; задайте ровно одно minAvailable/maxUnavailable с округлённым минимумом при двух репликах не меньше единицы. Разрешение следующего disruption проверяется отдельно. [Причина и проверка](guides#guide=kubernetes-17&section=maintenance-pools-healthy-minimum)
diagnostics.maintenance_health: Пул мог изменить число реплик, не восстановиться после eviction или отдавать неверный/недоступный ответ. Нужны две готовые реплики каждого пула, актуальные observed generations и исходные ответы Service; основной budget видит не меньше двух здоровых Pod. [Причина и проверка](guides#guide=kubernetes-17&section=maintenance-pools-two-ready-and-http)
diagnostics.maintenance_authority: Права игрока могли быть расширены для обхода health или disruption-проверок; изменение Pod status остаётся запрещено. Ожидается stdout no, включая обычный ненулевой статус отказа authorization-команды. [Причина и проверка](guides#guide=kubernetes-17&section=maintenance-pools-status-remains-denied)
diagnostics.probe_0_1: Наблюдение здоровья может оборваться до именованного результата через error trap; проверьте команды и контекст кластера. Обычные ошибки API, rollout generation и HTTP внутри группы уже дают maintenance_health. [Причина и проверка](guides#guide=kubernetes-17&section=maintenance-pools-health-observer-startup)
diagnostics.maintenance_requests: evictions.json может отсутствовать, иметь неверную структуру или дважды выбирать один пул; сохраните ровно два policy/v1 Eviction, по исходному Pod каждого пула, с исходным именем, текущим namespace и совпадающим UID precondition. [Причина и проверка](guides#guide=kubernetes-17&section=maintenance-pools-two-original-uid-requests)
diagnostics.maintenance_evictions: Файл запроса или прямое удаление не доказывают исход Eviction API; сервер должен наблюдать API-вытеснение каждого выбранного исходного UID. Сохраните выданное окно завершения для наблюдения; отсутствующая или нечитаемая квитанция даёт тот же маркер. [Причина и проверка](guides#guide=kubernetes-17&section=maintenance-pools-protected-api-observation)
diagnostics.maintenance_allowance: Основной budget начинает с minAvailable, равным обеим репликам, либо readiness замены и согласование статуса ещё блокируют disruption. Каждый budget после выбранного eviction наблюдает текущую generation, не меньше двух здоровых Pod и хотя бы одно разрешённое disruption. [Причина и проверка](guides#guide=kubernetes-17&section=maintenance-pools-next-disruption)
diagnostics.probe_0_2: Наблюдение eviction может оборваться при чтении ресурсов или загрузке Python helpers до именованного результата; проверьте кластер и dq_check. Ошибки запросов, квитанций, идентичности, здоровья и allowance внутри именованной проверки сохраняют свои маркеры. [Причина и проверка](guides#guide=kubernetes-17&section=maintenance-pools-eviction-observer-startup)
