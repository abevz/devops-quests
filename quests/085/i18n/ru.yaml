title: Обслуживание при разных владельцах политик
brief: |
  Добровольное обслуживание заблокировано, хотя оба сервиса исправны. Восстановите безопасное обслуживание с существующими владельцами ресурсов, не выполняя drain общего узла.

  Работайте в `~/quest` на рабочей станции. Даны `relay.yaml`, `companion.yaml`, `companion-budget.yaml`, `repository/policies/budget.yaml`, `application.yaml` и `maintenance-baseline.json`. Неизменяемая копия исходных данных находится в `/run/dq/facts/0/`.

  **Требования:**

  - Сохраните исходные контроллеры, сервисы и бюджеты; каждый пул защищает хотя бы один исправный Pod собственной политикой, а политика из Git остаётся синхронизированной.
  - Оба пула возвращают исходные HTTP-ответы и имеют ровно две готовые реплики; исходный основной бюджет сообщает хотя бы о двух исправных Pod.
  - Выполните по одному подтверждённому eviction с проверкой UID на каждый исходный пул, сохраните по одному исходному соседнему Pod и восстановите хотя бы одно допустимое прерывание в каждом бюджете.

  Сохраните два запроса policy/v1 Eviction массивом в `~/quest/evictions.json` на рабочей станции. Каждый запрос содержит имя исходного Pod, этот namespace и `deleteOptions.preconditions.uid`. Исходные идентификаторы указаны в baseline. Сохраните заданное окно наблюдения при завершении; `/run/dq/observations/evictions.json` содержит исходные UID, для которых сервер наблюдал Eviction API. Файл запроса и прямое удаление Pod не доказывают eviction. Сохраните автоматическое самовосстановление, существующий источник и его назначение; patch статуса Pod остаётся недоступен игроку.
stages.0.brief: Восстановите согласованность политик и завершите безопасное обслуживание обоих исходных
  пулов.
stages.0.objectives.0.text: Сохраните исходные контроллеры, сервисы и бюджеты; каждый пул защищает хотя
  бы один исправный Pod собственной политикой, а политика из Git остаётся синхронизированной.
stages.0.objectives.1.text: Оба пула возвращают исходные HTTP-ответы и имеют ровно две готовые реплики;
  исходный основной бюджет сообщает хотя бы о двух исправных Pod.
stages.0.objectives.2.text: Выполните по одному подтверждённому eviction с проверкой UID на каждый исходный
  пул, сохраните по одному исходному соседнему Pod и восстановите хотя бы одно допустимое прерывание в
  каждом бюджете.
hints.0.text: Бюджет доступности, его владелец и фактическое решение об eviction описывают разные стороны
  одной операции. Исправность сервиса сама по себе не гарантирует возможность добровольного обслуживания.
hints.1.text: Сопоставьте `kubectl get pdb -o yaml`, `kubectl get applications -o yaml`, опубликованную
  политику Git и метки из `kubectl get pods --show-labels`. Изучите полный отказ Eviction API и conditions
  приложения; сравните оба селектора с обоими пулами и отличайте локальные изменения от источника контроллера.
hints.2.text: Проверьте совпадение опубликованной и действующей политики при сохранённом автоматическом
  самовосстановлении. Перед каждым запросом смотрите `kubectl get pdb` и выбирайте исходные имя/UID из
  неизменяемого baseline. После реального eviction дождитесь готовности замены; проверьте `cat evictions.json`,
  `cat /run/dq/observations/evictions.json` и `kubectl get pods -o wide`. Ожидаются по одному подтверждённому
  исходному UID и сохранённому исходному соседу в каждом пуле, две готовые реплики и восстановленный запас
  прерываний. Проверьте HTTP обоих сервисов из Pod приложения.
debrief: Минимум под управлением Git и независимо управляемый селектор требовали разных исправлений. Положительный
  запас прерываний не отменял перекрытия политик. Сохранённые идентификаторы, наблюдаемые сервером eviction
  и восстановленные сервисы подтверждают результат обслуживания.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: После изменения я проверил состояние workload и его готовность.
