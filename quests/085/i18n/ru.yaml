  сервисы и бюджеты; каждый пул защищает хотя бы один исправный Pod собственной политикой, а политика
  из Git остаётся синхронизированной.'
diagnostics.probe_0_1: 'Текущие данные не позволили проверить эту цель: Оба пула возвращают исходные HTTP-ответы
  и имеют ровно две готовые реплики; исходный основной бюджет сообщает хотя бы о двух исправных Pod.'
diagnostics.probe_0_2: 'Текущие данные не позволили проверить эту цель: Выполните по одному подтверждённому
  eviction с проверкой UID на каждый исходный пул, сохраните по одному исходному соседнему Pod и восстановите
  хотя бы одно допустимое прерывание в каждом бюджете.'
diagnostics.maintenance_policy: Каждый отдельный бюджет должен сохранять минимум хотя бы один исправный
  Pod.
diagnostics.maintenance_evictions: Сервер должен наблюдать Eviction API для каждого выбранного исходного
  UID; прямого удаления и файлов запросов недостаточно.
diagnostics.maintenance_source: Опубликуйте политику в исходном источнике и дождитесь синхронизации той
  же ревизии с автоматическим самовосстановлением.
diagnostics.maintenance_identity: Сохраните исходные контроллеры, сервисы, бюджеты и идентификаторы невыбранных
  исходных Pod.
diagnostics.maintenance_scope: Каждая политика должна выбирать свой исходный пул, не охватывая другой.
diagnostics.maintenance_health: Восстановите две готовые реплики и исходный HTTP-ответ каждого пула.
diagnostics.maintenance_authority: Игрок не должен иметь право изменять статус Pod через patch.
diagnostics.maintenance_requests: Сохраните два запроса policy/v1 для разных исходных Pod с этим namespace,
  соответствующими именами и предусловиями UID.
diagnostics.maintenance_allowance: Дождитесь, когда оба бюджета увидят исправленное поколение и разрешат
  следующее добровольное прерывание.
