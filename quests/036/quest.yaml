id: 36
title: title
track: OpenTofu
difficulty: medium
brief: brief
stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    check: |-
      dq_probe_output=$(mktemp)
      trap 'rm -f "$dq_probe_output"' EXIT
      set +e
      (
      set -euo pipefail
      python3 -I - <<'DQ_PROPERTY'
      import json
      import os
      import stat
      import sys
      from pathlib import Path


      from dq_check import read_json


      from dq_check import resource_records


      from dq_check import same_target


      from dq_check import file_resources


      from dq_check import number_is

      plan = read_json('rejected-plan.json')
      try:
          original = Path('original-id').read_text().strip()
      except OSError:
          original = ''
      changes = plan.get('resource_changes', []) if isinstance(plan, dict) else []
      valid = False
      for resource in changes if isinstance(changes, list) else []:
          change = resource.get('change', {})
          before = change.get('before') or {}
          actions = change.get('actions')
          if (resource.get('mode') == 'managed' and resource.get('type') == 'local_file'
                  and same_target(before.get('filename'), 'ledger.txt')
                  and original and before.get('id') == original
                  and isinstance(actions, list) and sorted(actions) == ['create', 'delete']):
              valid = True
      sys.exit(0 if valid else 1)
      DQ_PROPERTY
      ) >"$dq_probe_output" 2>/dev/null
      dq_probe_status=$?
      set -e
      cat "$dq_probe_output"
      if [ "$dq_probe_status" -ne 0 ] && ! grep -Eq '\[DQ:[a-z0-9_]+\]' "$dq_probe_output"; then
      printf '%s\n' 'Current inputs could not verify this objective: ✗ [DQ:probe_0_0]'
      fi
      rm -f "$dq_probe_output"
      trap - EXIT
      test "$dq_probe_status" -eq 0
  - text: stages.0.objectives.1.text
    keep: true
    check: test "$(cat ledger.txt)" = revision-36
  - text: stages.0.objectives.2.text
    keep: true
    check: test ! -e retired-ledger.txt
  - text: stages.0.objectives.3.text
    keep: true
    check: test "$(tofu output -raw ledger_id)" = "$(cat original-id)"
  - text: stages.0.objectives.4.text
    check: tofu plan -input=false -detailed-exitcode -no-color >/dev/null
hints:
- text: hints.0.text
  guide: terraform-6
- text: hints.1.text
  guide: terraform-6
- text: hints.2.text
  guide: terraform-6
debrief: debrief
phrases:
- phrases.0
- phrases.1
- phrases.2
