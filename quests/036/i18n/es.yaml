title: Inspección de planos
brief: 'Un cambio propuesto en el registro requiere una revisión de seguridad. Conserva el registro gestionado
  original y un documento legible por máquina de la propuesta rechazada.


  Trabaja en la estación de trabajo en `~/quest` con `main.tf`.


  **Requisitos:**

  - En la estación de trabajo, `~/quest/rejected-plan.json` registra la sustitución propuesta del registro.

  - En la estación de trabajo, el archivo original del registro permanece en su ruta original con su contenido
  original.

  - El archivo de sustitución propuesto no se ha creado en la estación de trabajo.

  - La salida existente de identidad del registro conserva el ID original del proveedor.

  - Un plan detallado no muestra cambios de infraestructura pendientes y termina con código `0`.

  '
debrief: La inspección del plan evitó una sustitución innecesaria de recursos.
stages.0.brief: Conserva la identidad original del registro; la sustitución rechazada debe quedar solo como
  propuesta documentada.
stages.0.objectives.0.text: En la estación de trabajo, `~/quest/rejected-plan.json` registra la sustitución
  propuesta del registro.
stages.0.objectives.1.text: En la estación de trabajo, el archivo original del registro permanece en su ruta
  original con su contenido original.
stages.0.objectives.2.text: El archivo de sustitución propuesto no se ha creado en la estación de trabajo.
stages.0.objectives.3.text: La salida existente de identidad del registro conserva el ID original del proveedor.
stages.0.objectives.4.text: OpenTofu no informa cambios de infraestructura pendientes.
hints.0.text: Un cambio propuesto es distinto de un cambio aplicado a un objeto gestionado.
hints.1.text: 'Inspeccione actions antes de la aprobación.


  Inspecciona las entradas suministradas y el estado gestionado actual:


  ```sh

  cat main.tf

  tofu show -no-color

  tofu plan -input=false -no-color

  ```'
hints.2.text: "Guarde un binario plan, luego use tofu show -json.\n\nCambiar filename en local_file fuerza\
  \ la sustitución. El cambio revisado era de ledger.txt a retired-ledger.txt; recupera el nombre previsto\
  \ sin aplicar esa propuesta.\n\nVerifica el resultado observado:\n\n- `jq '.resource_changes[] | {address,\
  \ actions: .change.actions}' rejected-plan.json` — Se espera que la propuesta rechazada del registro incluya\
  \ eliminación y creación.\n\n- Se espera `revision-36`; `ls` indica que el archivo retirado no existe; ambos\
  \ ID coinciden.\n\n  ```sh\n  cat ledger.txt\n  ls retired-ledger.txt\n  cat original-id\n  tofu output -raw\
  \ ledger_id\n  ```\n\n- `tofu plan -input=false -detailed-exitcode -no-color` — Se esperan ausencia de cambios\
  \ y código de salida `0`."
phrases.0: Inspeccioné las acciones de reemplazo en un plan guardado.
phrases.1: Rechacé un cambio destructivo antes de aplicarlo.
phrases.2: Conservé la identidad del libro mayor y verifiqué una recuperación vacía plan.
diagnostics.probe_0_0: 'Los datos actuales no permiten verificar este objetivo: En la estación de trabajo, `~/quest/rejected-plan.json`
  registra la sustitución propuesta del registro.'
