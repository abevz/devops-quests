title: Inspección de planos
brief: |
  Un cambio propuesto en el registro requiere una revisión de seguridad. Conserva el registro gestionado original y un documento legible por máquina de la propuesta rechazada.

  Trabaja en `~/quest` en la workstation. Archivos de entrada suministrados: `main.tf`, `original-id`.

  **Requisitos:**
  - En `~/quest` en la workstation, `rejected-plan.json` documenta la sustitución propuesta del registro.
    - `local_file.ledger`: `delete` + `create`
  - Archivos en `~/quest` en la workstation:
    - `ledger.txt`: `revision-36`
  - `retired-ledger.txt` no existe en `~/quest` en la workstation.
  - La salida `ledger_id` coincide con el ID original del proveedor de `~/quest/original-id` en la workstation.
  - `tofu plan` termina con código `0` sin cambios.

  **Verifica antes de Check & finish:**
  Ejecuta estos comandos de observación desde `~/quest` en la workstation.
  - `jq '.resource_changes[] | {address, actions: .change.actions}' rejected-plan.json` — Se espera que la propuesta rechazada del registro incluya eliminación y creación.
  - Se espera `revision-36`; `ls` indica que el archivo retirado no existe; ambos ID coinciden.

    ```sh
    cat ledger.txt
    ls retired-ledger.txt
    cat original-id
    tofu output -raw ledger_id
    ```
  - `tofu plan -input=false -detailed-exitcode -no-color` — Se esperan ausencia de cambios y código de salida `0`.
debrief: La inspección del plan evitó una sustitución innecesaria de recursos.
stages.0.brief: |
  Conserva la identidad original del registro; la sustitución rechazada debe quedar solo como propuesta documentada.
stages.0.objectives.0.text: '`rejected-plan.json` registra la sustitución propuesta de ledger.'
stages.0.objectives.1.text: '`ledger.txt` contiene `revision-36`.'
stages.0.objectives.2.text: '`retired-ledger.txt` no existe.'
stages.0.objectives.3.text: El output `ledger_id` conserva el ID original del proveedor.
stages.0.objectives.4.text: '`tofu plan` termina con código 0 sin cambios.'
hints.0.text: Inspeccione actions antes de la aprobación.
hints.1.text: Guarde un binario plan, luego use tofu show -json.
hints.2.text: |
  Cambiar filename en local_file fuerza la sustitución. El cambio revisado era de ledger.txt a retired-ledger.txt; recupera el nombre previsto sin aplicar esa propuesta.
phrases.0: Inspeccioné las acciones de reemplazo en un plan guardado.
phrases.1: Rechacé un cambio destructivo antes de aplicarlo.
phrases.2: Conservé la identidad del libro mayor y verifiqué una recuperación vacía plan.
