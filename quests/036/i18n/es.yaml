title: Inspección de planos
brief: 'Un cambio propuesto en el registro requiere una revisión de seguridad. Conserva el registro gestionado
  original y un documento legible por máquina de la propuesta rechazada.


  Trabaja en la estación de trabajo en `~/quest` con `main.tf`.


  **Requisitos:**

  - En la estación de trabajo, `~/quest/rejected-plan.json` registra la sustitución propuesta del registro.

  - En la estación de trabajo, el archivo original del registro permanece en su ruta original con su contenido
  original.

  - El archivo de sustitución propuesto no se ha creado en la estación de trabajo.

  - La salida existente de identidad del registro conserva el ID original del proveedor.

  - Un plan detallado no muestra cambios de infraestructura pendientes y termina con código `0`.

  '
debrief: La inspección del plan evitó una sustitución innecesaria de recursos.
stages.0.brief: Conserva la identidad original del registro; la sustitución rechazada debe quedar solo como
  propuesta documentada.
stages.0.objectives.0.text: En la estación de trabajo, `~/quest/rejected-plan.json` registra la sustitución
  propuesta del registro.
stages.0.objectives.1.text: En la estación de trabajo, el archivo original del registro permanece en su ruta
  original con su contenido original.
stages.0.objectives.2.text: El archivo de sustitución propuesto no se ha creado en la estación de trabajo.
stages.0.objectives.3.text: La salida existente de identidad del registro conserva el ID original del proveedor.
stages.0.objectives.4.text: OpenTofu no informa cambios de infraestructura pendientes.
hints.0.text: Un cambio propuesto es distinto de un cambio aplicado a un objeto gestionado.
hints.1.text: |-
  Compara la ruta del archivo en main.tf con el estado gestionado. Guarda y exporta la propuesta de sustitución mientras siga configurado el nombre propuesto. Una vez registrada, restaura el nombre previsto ledger.txt y deja la propuesta sin aplicar.

  ```sh
  cat main.tf
  tofu show -no-color
  tofu plan -input=false -no-color -out=rejected.tfplan &&
    tofu show -json rejected.tfplan > rejected-plan.json
  ```
hints.2.text: |-
  El cambio local_file guardado incluye creación y eliminación. La ruta anterior apunta a ledger.txt y el ID anterior coincide con original-id.

  ```sh
  jq '.resource_changes[]
    | select(.mode == "managed" and .type == "local_file")
    | {address, actions: .change.actions, before_path: .change.before.filename,
       before_id: .change.before.id}' rejected-plan.json
  cat original-id
  ```

  El archivo original contiene revision-36. La comprobación de ausencia pasa y el ID actual coincide con original-id.

  ```sh
  cat ledger.txt
  test ! -e retired-ledger.txt
  test "$(tofu output -raw ledger_id)" = "$(cat original-id)"
  ```

  El plan detallado final indica que no hay cambios y termina con código 0.

  ```sh
  tofu plan -input=false -detailed-exitcode -no-color
  ```
phrases.0: Inspeccioné las acciones de reemplazo en un plan guardado.
phrases.1: Rechacé un cambio destructivo antes de aplicarlo.
phrases.2: Conservé la identidad del libro mayor y verifiqué una recuperación vacía plan.
diagnostics.probe_0_0: El plan puede haberse guardado tras corregir el nombre o no contener el reemplazo del ledger registrado; datos ilegibles o fallos de Python/módulo también fallan. [Causa y comprobación](guides#guide=terraform-6&section=ledger-rejected-plan)
diagnostics.ledger_content: Aplicar el cambio de nombre rechazado puede eliminar ledger.txt y una edición externa cambiar su revisión; un archivo ausente o ilegible también falla. [Causa y comprobación](guides#guide=terraform-6&section=ledger-retained-files)
diagnostics.retired_absent: El reemplazo rechazado puede haberse aplicado o puede quedar un retired-ledger.txt en la ruta no deseada. [Causa y comprobación](guides#guide=terraform-6&section=ledger-retained-files)
diagnostics.ledger_identity: Contenido gestionado cambiado o una salida antigua puede hacer que ledger_id difiera del ID registrado; fallos al leer la salida o el registro también impiden comparar. [Causa y comprobación](guides#guide=terraform-6&section=ledger-recorded-output)
diagnostics.ledger_plan: Puede quedar el nombre rechazado u otro cambio sin aplicar, o un error de configuración, proveedor o estado puede impedir el plan final. [Causa y comprobación](guides#guide=terraform-6&section=ledger-recovery-plan)
