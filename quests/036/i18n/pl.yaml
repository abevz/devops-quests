title: Zaplanuj inspekcję
brief: 'W recenzji zmieniono ledger.txt na retired-ledger.txt. Nie stosuj tej propozycji. Zapisz plik
  plan do odczytu maszynowego jako rejected-plan.json, zidentyfikuj replacement, przywróć zamierzoną nazwę
  pliku i zachowaj oryginalny provider ID zapisany w original-id.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `main.tf`, `original-id`, `rejected-plan.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.'
debrief: Kontrola planu zapobiegła niepotrzebnej wymianie zasobów.
stages.0.brief: Zmień tylko tę zatokę.
stages.0.objectives.0.text: '`rejected-plan.json` zapisuje proponowaną wymianę ledger.'
stages.0.objectives.1.text: '`ledger.txt` zawiera `revision-36`.'
stages.0.objectives.2.text: '`retired-ledger.txt` nie istnieje.'
stages.0.objectives.3.text: Output `ledger_id` zachowuje oryginalny ID providera.
stages.0.objectives.4.text: '`tofu plan` kończy się kodem 0 bez zmian.'
hints.0.text: Przed zatwierdzeniem sprawdź actions.
hints.1.text: Zapisz plik binarny plan, a następnie użyj tofu show -json.
hints.2.text: zmiany nazwy pliku pliku_lokalnego wymuszają replacement.
phrases.0: Sprawdziłem działania zastępcze w zapisanym plan.
phrases.1: Odrzuciłem destrukcyjną zmianę przed jej zastosowaniem.
phrases.2: Zachowałem tożsamość księgi i zweryfikowałem puste odzyskiwanie plan.
