title: Zaplanuj inspekcję
brief: |
  Proponowana zmiana rejestru wymaga oceny bezpieczeństwa. Zachowaj oryginalny zarządzany rejestr oraz maszynowo czytelny zapis odrzuconej propozycji.

  Pracuj w `~/quest` na workstation. Dostarczone pliki wejściowe: `main.tf`, `original-id`.

  **Wymagania:**
  - W `~/quest` na workstation plik `rejected-plan.json` zawiera zapis proponowanej zamiany rejestru.
    - `local_file.ledger`: `delete` + `create`
  - Pliki w `~/quest` na workstation:
    - `ledger.txt`: `revision-36`
  - Plik `retired-ledger.txt` nie istnieje w `~/quest` na workstation.
  - Wynik `ledger_id` odpowiada oryginalnemu ID dostawcy z `~/quest/original-id` na workstation.
  - `tofu plan` kończy się kodem `0` i nie wykazuje zmian.

  **Sprawdź samodzielnie przed Check & finish:**
  Wykonaj te polecenia obserwacyjne w `~/quest` na workstation.
  - `jq '.resource_changes[] | {address, actions: .change.actions}' rejected-plan.json` — Oczekiwane: odrzucona propozycja dotycząca rejestru obejmuje usunięcie i utworzenie.
  - Oczekiwane: `revision-36`; `ls` zgłasza brak wycofanego pliku; oba ID są zgodne.

    ```sh
    cat ledger.txt
    ls retired-ledger.txt
    cat original-id
    tofu output -raw ledger_id
    ```
  - `tofu plan -input=false -detailed-exitcode -no-color` — Oczekiwane: brak zmian i kod zakończenia `0`.
debrief: Kontrola planu zapobiegła niepotrzebnej wymianie zasobów.
stages.0.brief: |
  Zachowaj oryginalną tożsamość rejestru; odrzucona zamiana ma pozostać jedynie zapisaną propozycją.
stages.0.objectives.0.text: '`rejected-plan.json` zapisuje proponowaną wymianę ledger.'
stages.0.objectives.1.text: '`ledger.txt` zawiera `revision-36`.'
stages.0.objectives.2.text: '`retired-ledger.txt` nie istnieje.'
stages.0.objectives.3.text: Output `ledger_id` zachowuje oryginalny ID providera.
stages.0.objectives.4.text: '`tofu plan` kończy się kodem 0 bez zmian.'
hints.0.text: Przed zatwierdzeniem sprawdź actions.
hints.1.text: Zapisz plik binarny plan, a następnie użyj tofu show -json.
hints.2.text: |
  Zmiana filename w local_file wymusza zamianę. Oceniana zmiana prowadziła z ledger.txt do retired-ledger.txt; przywróć właściwą nazwę pliku bez stosowania tej propozycji.
phrases.0: Sprawdziłem działania zastępcze w zapisanym plan.
phrases.1: Odrzuciłem destrukcyjną zmianę przed jej zastosowaniem.
phrases.2: Zachowałem tożsamość księgi i zweryfikowałem puste odzyskiwanie plan.
