title: Zaplanuj inspekcję
brief: 'Proponowana zmiana rejestru wymaga oceny bezpieczeństwa. Zachowaj oryginalny zarządzany rejestr oraz
  maszynowo czytelny zapis odrzuconej propozycji.


  Pracuj na stacji roboczej w `~/quest` z `main.tf`.


  **Wymagania:**

  - Na stacji roboczej `~/quest/rejected-plan.json` zapisuje proponowaną wymianę rejestru.

  - Na stacji roboczej oryginalny plik rejestru pozostaje pod oryginalną ścieżką z oryginalną zawartością.

  - Proponowany plik zastępczy nie został utworzony na stacji roboczej.

  - Istniejący wynik tożsamości rejestru zachowuje oryginalny ID dostawcy.

  - Szczegółowy plan nie zawiera oczekujących zmian infrastruktury i kończy się kodem `0`.

  '
debrief: Kontrola planu zapobiegła niepotrzebnej wymianie zasobów.
stages.0.brief: Zachowaj oryginalną tożsamość rejestru; odrzucona zamiana ma pozostać jedynie zapisaną propozycją.
stages.0.objectives.0.text: Na stacji roboczej `~/quest/rejected-plan.json` zapisuje proponowaną wymianę rejestru.
stages.0.objectives.1.text: Na stacji roboczej oryginalny plik rejestru pozostaje pod oryginalną ścieżką z
  oryginalną zawartością.
stages.0.objectives.2.text: Proponowany plik zastępczy nie został utworzony na stacji roboczej.
stages.0.objectives.3.text: Istniejący wynik tożsamości rejestru zachowuje oryginalny ID dostawcy.
stages.0.objectives.4.text: OpenTofu nie zgłasza oczekujących zmian infrastruktury.
hints.0.text: Proponowana zmiana różni się od zastosowanej zmiany zarządzanego obiektu.
hints.1.text: 'Przed zatwierdzeniem sprawdź actions.


  Sprawdź dostarczone dane wejściowe i bieżący zarządzany stan:


  ```sh

  cat main.tf

  tofu show -no-color

  tofu plan -input=false -no-color

  ```'
hints.2.text: "Zapisz plik binarny plan, a następnie użyj tofu show -json.\n\nZmiana filename w local_file\
  \ wymusza zamianę. Oceniana zmiana prowadziła z ledger.txt do retired-ledger.txt; przywróć właściwą nazwę\
  \ pliku bez stosowania tej propozycji.\n\nSprawdź obserwowany wynik:\n\n- `jq '.resource_changes[] | {address,\
  \ actions: .change.actions}' rejected-plan.json` — Oczekiwane: odrzucona propozycja dotycząca rejestru obejmuje\
  \ usunięcie i utworzenie.\n\n- Oczekiwane: `revision-36`; `ls` zgłasza brak wycofanego pliku; oba ID są zgodne.\n\
  \n  ```sh\n  cat ledger.txt\n  ls retired-ledger.txt\n  cat original-id\n  tofu output -raw ledger_id\n \
  \ ```\n\n- `tofu plan -input=false -detailed-exitcode -no-color` — Oczekiwane: brak zmian i kod zakończenia\
  \ `0`."
phrases.0: Sprawdziłem działania zastępcze w zapisanym plan.
phrases.1: Odrzuciłem destrukcyjną zmianę przed jej zastosowaniem.
phrases.2: Zachowałem tożsamość księgi i zweryfikowałem puste odzyskiwanie plan.
