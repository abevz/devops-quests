title: Zaplanuj inspekcję
brief: 'Proponowana zmiana rejestru wymaga oceny bezpieczeństwa. Zachowaj oryginalny zarządzany rejestr oraz
  maszynowo czytelny zapis odrzuconej propozycji.


  Pracuj na stacji roboczej w `~/quest` z `main.tf`.


  **Wymagania:**

  - Na stacji roboczej `~/quest/rejected-plan.json` zapisuje proponowaną wymianę rejestru.

  - Na stacji roboczej oryginalny plik rejestru pozostaje pod oryginalną ścieżką z oryginalną zawartością.

  - Proponowany plik zastępczy nie został utworzony na stacji roboczej.

  - Istniejący wynik tożsamości rejestru zachowuje oryginalny ID dostawcy.

  - Szczegółowy plan nie zawiera oczekujących zmian infrastruktury i kończy się kodem `0`.

  '
debrief: Kontrola planu zapobiegła niepotrzebnej wymianie zasobów.
stages.0.brief: Zachowaj oryginalną tożsamość rejestru; odrzucona zamiana ma pozostać jedynie zapisaną propozycją.
stages.0.objectives.0.text: Na stacji roboczej `~/quest/rejected-plan.json` zapisuje proponowaną wymianę rejestru.
stages.0.objectives.1.text: Na stacji roboczej oryginalny plik rejestru pozostaje pod oryginalną ścieżką z
  oryginalną zawartością.
stages.0.objectives.2.text: Proponowany plik zastępczy nie został utworzony na stacji roboczej.
stages.0.objectives.3.text: Istniejący wynik tożsamości rejestru zachowuje oryginalny ID dostawcy.
stages.0.objectives.4.text: OpenTofu nie zgłasza oczekujących zmian infrastruktury.
hints.0.text: Proponowana zmiana różni się od zastosowanej zmiany zarządzanego obiektu.
hints.1.text: |-
  Porównaj ścieżkę ledger w main.tf ze stanem zarządzanym. Zapisz i wyeksportuj propozycję zastąpienia, gdy proponowana nazwa jest nadal w konfiguracji. Następnie przywróć właściwą nazwę ledger.txt i pozostaw propozycję niezastosowaną.

  ```sh
  cat main.tf
  tofu show -no-color
  tofu plan -input=false -no-color -out=rejected.tfplan &&
    tofu show -json rejected.tfplan > rejected-plan.json
  ```
hints.2.text: |-
  Zapisana zmiana local_file obejmuje utworzenie i usunięcie. Poprzednia ścieżka wskazuje ledger.txt, a poprzednie ID jest zgodne z original-id.

  ```sh
  jq '.resource_changes[]
    | select(.mode == "managed" and .type == "local_file")
    | {address, actions: .change.actions, before_path: .change.before.filename,
       before_id: .change.before.id}' rejected-plan.json
  cat original-id
  ```

  Pierwotny plik zawiera revision-36. Sprawdzenie braku zastępczego pliku przechodzi, a bieżące ID ledger jest zgodne z original-id.

  ```sh
  cat ledger.txt
  test ! -e retired-ledger.txt
  test "$(tofu output -raw ledger_id)" = "$(cat original-id)"
  ```

  Końcowy szczegółowy plan nie wykazuje zmian i kończy się z kodem 0.

  ```sh
  tofu plan -input=false -detailed-exitcode -no-color
  ```
phrases.0: Sprawdziłem działania zastępcze w zapisanym plan.
phrases.1: Odrzuciłem destrukcyjną zmianę przed jej zastosowaniem.
phrases.2: Zachowałem tożsamość księgi i zweryfikowałem puste odzyskiwanie plan.
diagnostics.probe_0_0: Plan mógł zostać zapisany po poprawieniu nazwy pliku albo nie zawierać zastąpienia zapisanego ledger; nieczytelne dane lub błąd Pythona/modułu też zawodzą. [Przyczyna i kontrola](guides#guide=terraform-6&section=ledger-rejected-plan)
diagnostics.ledger_content: Zastosowanie odrzuconej zmiany nazwy może usunąć ledger.txt, a zewnętrzna edycja zmienić wersję; brak pliku lub błąd odczytu też zawodzi. [Przyczyna i kontrola](guides#guide=terraform-6&section=ledger-retained-files)
diagnostics.retired_absent: Odrzucone zastąpienie mogło zostać zastosowane albo w niepożądanej ścieżce pozostał retired-ledger.txt. [Przyczyna i kontrola](guides#guide=terraform-6&section=ledger-retained-files)
diagnostics.ledger_identity: Zmieniona zarządzana treść lub stary wynik może zmienić ledger_id względem zapisanego ID; błędy odczytu wyniku lub zapisu też blokują porównanie. [Przyczyna i kontrola](guides#guide=terraform-6&section=ledger-recorded-output)
diagnostics.ledger_plan: Odrzucona nazwa pliku lub inna niezastosowana zmiana mogła pozostać albo błąd konfiguracji, dostawcy lub stanu blokuje końcowy plan. [Przyczyna i kontrola](guides#guide=terraform-6&section=ledger-recovery-plan)
