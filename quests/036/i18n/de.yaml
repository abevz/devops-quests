title: Inspektion planen
brief: 'Eine vorgeschlagene Ledger-Änderung muss auf Sicherheit geprüft werden. Bewahren Sie das ursprüngliche
  verwaltete Ledger und einen maschinenlesbaren Nachweis des abgelehnten Vorschlags.


  Arbeiten Sie auf der Workstation in `~/quest` mit `main.tf`.


  **Anforderungen:**

  - Auf der Workstation zeichnet `~/quest/rejected-plan.json` den vorgeschlagenen Ledger-Ersatz auf.

  - Auf der Workstation bleibt die ursprüngliche Ledger-Datei an ihrem ursprünglichen Pfad mit ihrem ursprünglichen
  Inhalt.

  - Die vorgeschlagene Ersatzdatei wurde auf der Workstation nicht erstellt.

  - Die bestehende Ausgabe zur Ledger-Identität behält die ursprüngliche Provider-ID.

  - Ein detaillierter Plan meldet keine ausstehenden Infrastrukturänderungen und endet mit Code `0`.

  '
debrief: Die Planinspektion verhinderte einen unnötigen Ressourcenaustausch.
stages.0.brief: Bewahren Sie die ursprüngliche Ledger-Identität; der abgelehnte Ersatz darf nur als dokumentierter
  Vorschlag bestehen.
stages.0.objectives.0.text: Auf der Workstation zeichnet `~/quest/rejected-plan.json` den vorgeschlagenen Ledger-Ersatz
  auf.
stages.0.objectives.1.text: Auf der Workstation bleibt die ursprüngliche Ledger-Datei an ihrem ursprünglichen
  Pfad mit ihrem ursprünglichen Inhalt.
stages.0.objectives.2.text: Die vorgeschlagene Ersatzdatei wurde auf der Workstation nicht erstellt.
stages.0.objectives.3.text: Die bestehende Ausgabe zur Ledger-Identität behält die ursprüngliche Provider-ID.
stages.0.objectives.4.text: OpenTofu meldet keine ausstehenden Infrastrukturänderungen.
hints.0.text: Eine vorgeschlagene Änderung ist etwas anderes als eine ausgeführte Änderung an einem verwalteten
  Objekt.
hints.1.text: |-
  Vergleiche den Ledger-Pfad in main.tf mit dem verwalteten Zustand. Speichere und exportiere den Ersatzvorschlag, solange der vorgeschlagene Dateiname konfiguriert ist. Stelle anschließend den vorgesehenen Namen ledger.txt wieder her und lasse den Vorschlag unangewendet.

  ```sh
  cat main.tf
  tofu show -no-color
  tofu plan -input=false -no-color -out=rejected.tfplan &&
    tofu show -json rejected.tfplan > rejected-plan.json
  ```
hints.2.text: |-
  Die gespeicherte local_file-Änderung umfasst Erstellen und Löschen. Der vorherige Pfad verweist auf ledger.txt und die vorherige ID entspricht original-id.

  ```sh
  jq '.resource_changes[]
    | select(.mode == "managed" and .type == "local_file")
    | {address, actions: .change.actions, before_path: .change.before.filename,
       before_id: .change.before.id}' rejected-plan.json
  cat original-id
  ```

  Die ursprüngliche Datei enthält revision-36. Die Abwesenheitsprüfung ist erfolgreich und die aktuelle Ledger-ID entspricht original-id.

  ```sh
  cat ledger.txt
  test ! -e retired-ledger.txt
  test "$(tofu output -raw ledger_id)" = "$(cat original-id)"
  ```

  Der abschließende Detailplan meldet keine Änderungen und endet mit Exit-Code 0.

  ```sh
  tofu plan -input=false -detailed-exitcode -no-color
  ```
phrases.0: Ich habe die Austauschaktionen in einem gespeicherten plan überprüft.
phrases.1: Ich habe eine destruktive Änderung abgelehnt, bevor ich sie angewendet habe.
phrases.2: Ich habe die Ledger-Identität beibehalten und eine leere Wiederherstellung überprüft plan.
diagnostics.probe_0_0: Der Plan kann nach der Dateinamenkorrektur gespeichert worden sein oder den aufgezeichneten Ledger-Austausch auslassen; unlesbare Eingaben oder Python-/Modulfehler scheitern ebenfalls. [Ursache und Prüfung](guides#guide=terraform-6&section=ledger-rejected-plan)
diagnostics.ledger_content: Anwenden der verworfenen Dateinamenänderung kann ledger.txt entfernen, eine externe Bearbeitung die Revision ändern; fehlende oder unlesbare Dateien scheitern ebenfalls. [Ursache und Prüfung](guides#guide=terraform-6&section=ledger-retained-files)
diagnostics.retired_absent: Der verworfene Austausch wurde möglicherweise angewendet, oder retired-ledger.txt blieb am unerwünschten Pfad zurück. [Ursache und Prüfung](guides#guide=terraform-6&section=ledger-retained-files)
diagnostics.ledger_identity: Geänderter verwalteter Inhalt oder ein veralteter Output kann ledger_id von der aufgezeichneten ID abweichen lassen; auch Fehler beim Lesen von Output oder Datensatz verhindern den Vergleich. [Ursache und Prüfung](guides#guide=terraform-6&section=ledger-recorded-output)
diagnostics.ledger_plan: Der verworfene Dateiname oder eine andere unangewendete Änderung kann verbleiben; auch ein Konfigurations-, Provider- oder State-Fehler verhindert den Abschlussplan. [Ursache und Prüfung](guides#guide=terraform-6&section=ledger-recovery-plan)
