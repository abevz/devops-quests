title: Inspektion planen
brief: |
  Eine vorgeschlagene Ledger-Änderung muss auf Sicherheit geprüft werden. Bewahren Sie das ursprüngliche verwaltete Ledger und einen maschinenlesbaren Nachweis des abgelehnten Vorschlags.

  Arbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte Eingabedateien: `main.tf`, `original-id`.

  **Anforderungen:**
  - In `~/quest` auf der Workstation dokumentiert `rejected-plan.json` den vorgeschlagenen Ledger-Ersatz.
    - `local_file.ledger`: `delete` + `create`
  - Dateien in `~/quest` auf der Workstation:
    - `ledger.txt`: `revision-36`
  - `retired-ledger.txt` existiert nicht in `~/quest` auf der Workstation.
  - Die Ausgabe `ledger_id` entspricht der ursprünglichen Provider-ID in `~/quest/original-id` auf der Workstation.
  - `tofu plan` endet mit Code `0` und meldet keine Änderungen.

  **Vor Check & finish selbst prüfen:**
  Führen Sie diese Beobachtungsbefehle in `~/quest` auf der Workstation aus.
  - `jq '.resource_changes[] | {address, actions: .change.actions}' rejected-plan.json` — Erwartet: Der abgelehnte Ledger-Vorschlag umfasst Löschen und Erstellen.
  - Erwartet: `revision-36`; `ls` meldet die ausgemusterte Datei als nicht vorhanden; beide IDs stimmen überein.

    ```sh
    cat ledger.txt
    ls retired-ledger.txt
    cat original-id
    tofu output -raw ledger_id
    ```
  - `tofu plan -input=false -detailed-exitcode -no-color` — Erwartet: keine Änderungen, Exit-Code `0`.
debrief: Die Planinspektion verhinderte einen unnötigen Ressourcenaustausch.
stages.0.brief: |
  Bewahren Sie die ursprüngliche Ledger-Identität; der abgelehnte Ersatz darf nur als dokumentierter Vorschlag bestehen.
stages.0.objectives.0.text: '`rejected-plan.json` dokumentiert den vorgeschlagenen Ersatz von ledger.'
stages.0.objectives.1.text: '`ledger.txt` enthält `revision-36`.'
stages.0.objectives.2.text: '`retired-ledger.txt` ist nicht vorhanden.'
stages.0.objectives.3.text: Output `ledger_id` behält die ursprüngliche Provider-ID.
stages.0.objectives.4.text: '`tofu plan` endet mit Exit-Code 0 ohne Änderungen.'
hints.0.text: Überprüfen Sie actions vor der Genehmigung.
hints.1.text: Speichern Sie eine Binärdatei plan und verwenden Sie dann tofu show -json.
hints.2.text: |
  Änderungen an filename bei local_file erzwingen Ersatz. Die geprüfte Änderung führte von ledger.txt zu retired-ledger.txt; stellen Sie den vorgesehenen Dateinamen wieder her, ohne diesen Vorschlag anzuwenden.
phrases.0: Ich habe die Austauschaktionen in einem gespeicherten plan überprüft.
phrases.1: Ich habe eine destruktive Änderung abgelehnt, bevor ich sie angewendet habe.
phrases.2: Ich habe die Ledger-Identität beibehalten und eine leere Wiederherstellung überprüft plan.
