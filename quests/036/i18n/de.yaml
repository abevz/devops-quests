title: Inspektion planen
brief: 'Durch eine Überprüfung wurde ledger.txt in retired-ledger.txt geändert. Wenden Sie diesen Vorschlag
  nicht an. Speichern Sie das maschinenlesbare plan als rejected-plan.json, identifizieren Sie das replacement,
  stellen Sie den beabsichtigten Dateinamen wieder her und behalten Sie das ursprüngliche provider ID
  bei, das in original-id aufgezeichnet wurde.


  Questdateien in `~/quest` (einige erscheinen in späteren Phasen): `main.tf`, `original-id`, `rejected-plan.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.'
debrief: Die Planinspektion verhinderte einen unnötigen Ressourcenaustausch.
stages.0.brief: Ändern Sie nur diese Bucht.
stages.0.objectives.0.text: '`rejected-plan.json` dokumentiert den vorgeschlagenen Ersatz von ledger.'
stages.0.objectives.1.text: '`ledger.txt` enthält `revision-36`.'
stages.0.objectives.2.text: '`retired-ledger.txt` ist nicht vorhanden.'
stages.0.objectives.3.text: Output `ledger_id` behält die ursprüngliche Provider-ID.
stages.0.objectives.4.text: '`tofu plan` endet mit Exit-Code 0 ohne Änderungen.'
hints.0.text: Überprüfen Sie actions vor der Genehmigung.
hints.1.text: Speichern Sie eine Binärdatei plan und verwenden Sie dann tofu show -json.
hints.2.text: local_file filename ändert Kraft replacement.
phrases.0: Ich habe die Austauschaktionen in einem gespeicherten plan überprüft.
phrases.1: Ich habe eine destruktive Änderung abgelehnt, bevor ich sie angewendet habe.
phrases.2: Ich habe die Ledger-Identität beibehalten und eine leere Wiederherstellung überprüft plan.
