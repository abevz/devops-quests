title: Inspektion planen
brief: 'Eine vorgeschlagene Ledger-Änderung muss auf Sicherheit geprüft werden. Bewahren Sie das ursprüngliche
  verwaltete Ledger und einen maschinenlesbaren Nachweis des abgelehnten Vorschlags.


  Arbeiten Sie auf der Workstation in `~/quest` mit `main.tf`.


  **Anforderungen:**

  - Auf der Workstation zeichnet `~/quest/rejected-plan.json` den vorgeschlagenen Ledger-Ersatz auf.

  - Auf der Workstation bleibt die ursprüngliche Ledger-Datei an ihrem ursprünglichen Pfad mit ihrem ursprünglichen
  Inhalt.

  - Die vorgeschlagene Ersatzdatei wurde auf der Workstation nicht erstellt.

  - Die bestehende Ausgabe zur Ledger-Identität behält die ursprüngliche Provider-ID.

  - Ein detaillierter Plan meldet keine ausstehenden Infrastrukturänderungen und endet mit Code `0`.

  '
debrief: Die Planinspektion verhinderte einen unnötigen Ressourcenaustausch.
stages.0.brief: Bewahren Sie die ursprüngliche Ledger-Identität; der abgelehnte Ersatz darf nur als dokumentierter
  Vorschlag bestehen.
stages.0.objectives.0.text: Auf der Workstation zeichnet `~/quest/rejected-plan.json` den vorgeschlagenen Ledger-Ersatz
  auf.
stages.0.objectives.1.text: Auf der Workstation bleibt die ursprüngliche Ledger-Datei an ihrem ursprünglichen
  Pfad mit ihrem ursprünglichen Inhalt.
stages.0.objectives.2.text: Die vorgeschlagene Ersatzdatei wurde auf der Workstation nicht erstellt.
stages.0.objectives.3.text: Die bestehende Ausgabe zur Ledger-Identität behält die ursprüngliche Provider-ID.
stages.0.objectives.4.text: OpenTofu meldet keine ausstehenden Infrastrukturänderungen.
hints.0.text: Eine vorgeschlagene Änderung ist etwas anderes als eine ausgeführte Änderung an einem verwalteten
  Objekt.
hints.1.text: 'Überprüfen Sie actions vor der Genehmigung.


  Prüfen Sie die mitgelieferten Eingaben und den aktuellen verwalteten Zustand:


  ```sh

  cat main.tf

  tofu show -no-color

  tofu plan -input=false -no-color

  ```'
hints.2.text: "Speichern Sie eine Binärdatei plan und verwenden Sie dann tofu show -json.\n\nÄnderungen an\
  \ filename bei local_file erzwingen Ersatz. Die geprüfte Änderung führte von ledger.txt zu retired-ledger.txt;\
  \ stellen Sie den vorgesehenen Dateinamen wieder her, ohne diesen Vorschlag anzuwenden.\n\nPrüfen Sie das\
  \ beobachtete Ergebnis:\n\n- `jq '.resource_changes[] | {address, actions: .change.actions}' rejected-plan.json`\
  \ — Erwartet: Der abgelehnte Ledger-Vorschlag umfasst Löschen und Erstellen.\n\n- Erwartet: `revision-36`;\
  \ `ls` meldet die ausgemusterte Datei als nicht vorhanden; beide IDs stimmen überein.\n\n  ```sh\n  cat ledger.txt\n\
  \  ls retired-ledger.txt\n  cat original-id\n  tofu output -raw ledger_id\n  ```\n\n- `tofu plan -input=false\
  \ -detailed-exitcode -no-color` — Erwartet: keine Änderungen, Exit-Code `0`."
phrases.0: Ich habe die Austauschaktionen in einem gespeicherten plan überprüft.
phrases.1: Ich habe eine destruktive Änderung abgelehnt, bevor ich sie angewendet habe.
phrases.2: Ich habe die Ledger-Identität beibehalten und eine leere Wiederherstellung überprüft plan.
diagnostics.probe_0_0: 'Mit den aktuellen Eingaben konnte dieses Ziel nicht geprüft werden: Auf der Workstation
  zeichnet `~/quest/rejected-plan.json` den vorgeschlagenen Ledger-Ersatz auf.'
