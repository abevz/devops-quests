title: Plan inspection
brief: 'A proposed ledger change needs a safety review. Preserve the original managed ledger and retain a machine-readable
  record of the rejected proposal.


  Work on the workstation in `~/quest` with `main.tf`.


  **Requirements:**

  - On the workstation, `~/quest/rejected-plan.json` records the proposed ledger replacement.

  - On the workstation, the original ledger file stays at its original path with its original content.

  - The proposed replacement file has not been created on the workstation.

  - The existing ledger identity output keeps the original provider ID.

  - A detailed plan reports no pending infrastructure changes and exits with code `0`.

  '
debrief: Plan inspection prevented an unnecessary resource replacement.
stages.0.brief: Keep the original ledger identity; the rejected replacement must remain only a recorded proposal.
stages.0.objectives.0.text: On the workstation, `~/quest/rejected-plan.json` records the proposed ledger replacement.
stages.0.objectives.1.text: On the workstation, the original ledger file stays at its original path with its
  original content.
stages.0.objectives.2.text: The proposed replacement file has not been created on the workstation.
stages.0.objectives.3.text: The existing ledger identity output keeps the original provider ID.
stages.0.objectives.4.text: OpenTofu reports no pending infrastructure changes.
hints.0.text: A proposed change is different from a committed change to a managed object.
hints.1.text: 'Inspect actions before approval.


  Inspect the supplied inputs and current managed state:


  ```sh

  cat main.tf

  tofu show -no-color

  tofu plan -input=false -no-color

  ```'
hints.2.text: "Save a binary plan, then use tofu show -json.\n\nlocal_file filename changes force replacement.\
  \ The reviewed change was from ledger.txt to retired-ledger.txt; restore the intended filename without applying\
  \ that proposal.\n\nVerify the observed result:\n\n- `jq '.resource_changes[] | {address, actions: .change.actions}'\
  \ rejected-plan.json` — Expected: the rejected ledger proposal includes both deletion and creation.\n\n-\
  \ Expected: `revision-36`; `ls` reports the retired file absent; the two IDs match.\n\n  ```sh\n  cat ledger.txt\n\
  \  ls retired-ledger.txt\n  cat original-id\n  tofu output -raw ledger_id\n  ```\n\n- `tofu plan -input=false\
  \ -detailed-exitcode -no-color` — Expected: no changes, exit code `0`."
phrases.0: I inspected replacement actions in a saved plan.
phrases.1: I rejected a destructive change before applying it.
phrases.2: I preserved the ledger identity and verified an empty recovery plan.
diagnostics.probe_0_0: 'The current inputs could not verify this objective: On the workstation, `~/quest/rejected-plan.json`
  records the proposed ledger replacement.'
