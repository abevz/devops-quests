title: Plan inspection
brief: 'A proposed ledger change needs a safety review. Preserve the original managed ledger and retain a machine-readable
  record of the rejected proposal.


  Work on the workstation in `~/quest` with `main.tf`.


  **Requirements:**

  - On the workstation, `~/quest/rejected-plan.json` records the proposed ledger replacement.

  - On the workstation, the original ledger file stays at its original path with its original content.

  - The proposed replacement file has not been created on the workstation.

  - The existing ledger identity output keeps the original provider ID.

  - A detailed plan reports no pending infrastructure changes and exits with code `0`.

  '
debrief: Plan inspection prevented an unnecessary resource replacement.
stages.0.brief: Keep the original ledger identity; the rejected replacement must remain only a recorded proposal.
stages.0.objectives.0.text: On the workstation, `~/quest/rejected-plan.json` records the proposed ledger replacement.
stages.0.objectives.1.text: On the workstation, the original ledger file stays at its original path with its
  original content.
stages.0.objectives.2.text: The proposed replacement file has not been created on the workstation.
stages.0.objectives.3.text: The existing ledger identity output keeps the original provider ID.
stages.0.objectives.4.text: OpenTofu reports no pending infrastructure changes.
hints.0.text: A proposed change is different from a committed change to a managed object.
hints.1.text: |-
  Compare the ledger path in main.tf with the managed state. Save and export the replacement proposal while the proposed filename is still configured. After recording it, restore the intended ledger.txt name and leave the proposal unapplied.

  ```sh
  cat main.tf
  tofu show -no-color
  tofu plan -input=false -no-color -out=rejected.tfplan &&
    tofu show -json rejected.tfplan > rejected-plan.json
  ```
hints.2.text: |-
  The saved local_file change includes create and delete. Its prior path points to ledger.txt and its prior ID matches original-id.

  ```sh
  jq '.resource_changes[]
    | select(.mode == "managed" and .type == "local_file")
    | {address, actions: .change.actions, before_path: .change.before.filename,
       before_id: .change.before.id}' rejected-plan.json
  cat original-id
  ```

  The original file contains revision-36. The absence check succeeds and the current ledger ID matches original-id.

  ```sh
  cat ledger.txt
  test ! -e retired-ledger.txt
  test "$(tofu output -raw ledger_id)" = "$(cat original-id)"
  ```

  The final detailed plan reports no changes and exits with code 0.

  ```sh
  tofu plan -input=false -detailed-exitcode -no-color
  ```
phrases.0: I inspected replacement actions in a saved plan.
phrases.1: I rejected a destructive change before applying it.
phrases.2: I preserved the ledger identity and verified an empty recovery plan.
diagnostics.probe_0_0: The saved plan may have been captured after the filename was repaired, or lack the recorded ledger replacement; unreadable inputs or Python/helper failure also fail. [Cause and check](guides#guide=terraform-6&section=ledger-rejected-plan)
diagnostics.ledger_content: Applying the rejected filename change can remove ledger.txt, while an external edit can change its revision; a missing or unreadable file also fails. [Cause and check](guides#guide=terraform-6&section=ledger-retained-files)
diagnostics.retired_absent: The rejected replacement may have been applied, or a leftover retired-ledger.txt may remain at the unwanted path. [Cause and check](guides#guide=terraform-6&section=ledger-retained-files)
diagnostics.ledger_identity: Changed managed content or a stale output may make ledger_id differ from the recorded ID; failed output or record reads can also prevent comparison. [Cause and check](guides#guide=terraform-6&section=ledger-recorded-output)
diagnostics.ledger_plan: The rejected filename or another unapplied change may remain, or a configuration, provider or state error may prevent the final plan. [Cause and check](guides#guide=terraform-6&section=ledger-recovery-plan)
