title: Plan inspection
brief: |
  A proposed ledger change needs a safety review. Preserve the original managed ledger and retain a machine-readable record of the rejected proposal.

  Work in `~/quest` on the workstation. Supplied inputs: `main.tf`, `original-id`.

  **Requirements:**
  - In `~/quest` on the workstation, `rejected-plan.json` records the proposed ledger replacement.
    - `local_file.ledger`: `delete` + `create`
  - Files in `~/quest` on the workstation:
    - `ledger.txt`: `revision-36`
  - `retired-ledger.txt` does not exist in `~/quest` on the workstation.
  - Output `ledger_id` matches the original provider ID in `~/quest/original-id` on the workstation.
  - `tofu plan` exits with code `0` and reports no changes.

  **Verify yourself before Check & finish:**
  Run these observation commands from `~/quest` on the workstation.
  - `jq '.resource_changes[] | {address, actions: .change.actions}' rejected-plan.json` — Expected: the rejected ledger proposal includes both deletion and creation.
  - Expected: `revision-36`; `ls` reports the retired file absent; the two IDs match.

    ```sh
    cat ledger.txt
    ls retired-ledger.txt
    cat original-id
    tofu output -raw ledger_id
    ```
  - `tofu plan -input=false -detailed-exitcode -no-color` — Expected: no changes, exit code `0`.
debrief: Plan inspection prevented an unnecessary resource replacement.
stages.0.brief: |
  Keep the original ledger identity; the rejected replacement must remain only a recorded proposal.
stages.0.objectives.0.text: '`rejected-plan.json` records the replacement proposed for the ledger.'
stages.0.objectives.1.text: '`ledger.txt` contains `revision-36`.'
stages.0.objectives.2.text: '`retired-ledger.txt` does not exist.'
stages.0.objectives.3.text: Output `ledger_id` retains the original provider ID.
stages.0.objectives.4.text: '`tofu plan` exits 0 with no changes.'
hints.0.text: Inspect actions before approval.
hints.1.text: Save a binary plan, then use tofu show -json.
hints.2.text: |
  local_file filename changes force replacement. The reviewed change was from ledger.txt to retired-ledger.txt; restore the intended filename without applying that proposal.
phrases.0: I inspected replacement actions in a saved plan.
phrases.1: I rejected a destructive change before applying it.
phrases.2: I preserved the ledger identity and verified an empty recovery plan.
