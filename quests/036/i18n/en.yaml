title: Plan inspection
brief: 'A review changed ledger.txt to retired-ledger.txt. Do not apply that proposal.
  Save its machine-readable plan as rejected-plan.json, identify the replacement,
  restore the intended filename and retain the original provider ID recorded in original-id.


  Quest files in `~/quest` (some appear in later stages): `main.tf`, `original-id`,
  `rejected-plan.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images
  and private services. Change only this bay.


  Initial success criteria: Rejected plan records a replacement; the ledger and its
  ID survive; final plan is empty.'
debrief: Plan inspection prevented an unnecessary resource replacement.
