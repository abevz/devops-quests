title: Проверка plan
brief: 'Предложенное изменение реестра требует проверки безопасности. Сохраните исходный управляемый реестр
  и машиночитаемую запись отклонённого предложения.


  Работайте на рабочей станции в `~/quest` с `main.tf`.


  **Требования:**

  - На рабочей станции `~/quest/rejected-plan.json` содержит запись о предложенной замене реестра.

  - На рабочей станции исходный файл реестра остаётся по исходному пути с исходным содержимым.

  - Предложенный файл замены не создан на рабочей станции.

  - Существующий выход идентичности реестра сохраняет исходный ID провайдера.

  - Подробный план не содержит ожидающих изменений инфраструктуры и завершается с кодом `0`.

  '
debrief: Изучение plan предотвратило ненужное пересоздание ресурса.
stages.0.brief: Сохраните исходную идентичность реестра; отклонённая замена должна остаться только записанным
  предложением.
stages.0.objectives.0.text: На рабочей станции `~/quest/rejected-plan.json` содержит запись о предложенной
  замене реестра.
stages.0.objectives.1.text: На рабочей станции исходный файл реестра остаётся по исходному пути с исходным
  содержимым.
stages.0.objectives.2.text: Предложенный файл замены не создан на рабочей станции.
stages.0.objectives.3.text: Существующий выход идентичности реестра сохраняет исходный ID провайдера.
stages.0.objectives.4.text: OpenTofu не сообщает об ожидающих изменениях инфраструктуры.
hints.0.text: Предложенное изменение отличается от применённого изменения управляемого объекта.
hints.1.text: 'Изучите actions до согласия.


  Изучите поставленные входные данные и текущее управляемое состояние:


  ```sh

  cat main.tf

  tofu show -no-color

  tofu plan -input=false -no-color

  ```'
hints.2.text: "Сохраните бинарный plan и используйте tofu show -json.\n\nИзменение filename у local_file вызывает\
  \ замену. Проверяемое изменение было с ledger.txt на retired-ledger.txt; восстановите требуемое имя файла,\
  \ не применяя это предложение.\n\nПроверьте наблюдаемый результат:\n\n- `jq '.resource_changes[] | {address,\
  \ actions: .change.actions}' rejected-plan.json` — Ожидается, что отклонённое предложение по реестру включает\
  \ удаление и создание.\n\n- Ожидается `revision-36`; `ls` сообщает об отсутствии старого файла; оба ID совпадают.\n\
  \n  ```sh\n  cat ledger.txt\n  ls retired-ledger.txt\n  cat original-id\n  tofu output -raw ledger_id\n \
  \ ```\n\n- `tofu plan -input=false -detailed-exitcode -no-color` — Ожидаются отсутствие изменений и код завершения\
  \ `0`."
phrases.0: Я изучил действия замены в сохранённом plan.
phrases.1: Я отклонил разрушительное изменение до применения.
phrases.2: Я сохранил идентичность реестра и проверил пустой plan после восстановления.
