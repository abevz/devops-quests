title: Проверка plan
brief: |
  Предложенное изменение реестра требует проверки безопасности. Сохраните исходный управляемый реестр и машиночитаемую запись отклонённого предложения.

  Работайте в `~/quest` на workstation. Предоставленные входные файлы: `main.tf`, `original-id`.

  **Требования:**
  - В `~/quest` на workstation файл `rejected-plan.json` содержит запись предложенной замены реестра.
    - `local_file.ledger`: `delete` + `create`
  - Файлы в `~/quest` на workstation:
    - `ledger.txt`: `revision-36`
  - Файл `retired-ledger.txt` отсутствует в `~/quest` на workstation.
  - Выходное значение `ledger_id` совпадает с исходным ID провайдера из `~/quest/original-id` на workstation.
  - `tofu plan` завершается с кодом `0` без изменений.

  **Проверьте самостоятельно перед Check & finish:**
  Выполняйте эти команды наблюдения из `~/quest` на workstation.
  - `jq '.resource_changes[] | {address, actions: .change.actions}' rejected-plan.json` — Ожидается, что отклонённое предложение по реестру включает удаление и создание.
  - Ожидается `revision-36`; `ls` сообщает об отсутствии старого файла; оба ID совпадают.

    ```sh
    cat ledger.txt
    ls retired-ledger.txt
    cat original-id
    tofu output -raw ledger_id
    ```
  - `tofu plan -input=false -detailed-exitcode -no-color` — Ожидаются отсутствие изменений и код завершения `0`.
debrief: Изучение plan предотвратило ненужное пересоздание ресурса.
stages.0.brief: |
  Сохраните исходную идентичность реестра; отклонённая замена должна остаться только записанным предложением.
stages.0.objectives.0.text: '`rejected-plan.json` содержит запись о предложенной замене ledger.'
stages.0.objectives.1.text: '`ledger.txt` содержит `revision-36`.'
stages.0.objectives.2.text: '`retired-ledger.txt` отсутствует.'
stages.0.objectives.3.text: Output `ledger_id` сохраняет исходный ID провайдера.
stages.0.objectives.4.text: '`tofu plan` завершается с кодом 0 без изменений.'
hints.0.text: Изучите actions до согласия.
hints.1.text: Сохраните бинарный plan и используйте tofu show -json.
hints.2.text: |
  Изменение filename у local_file вызывает замену. Проверяемое изменение было с ledger.txt на retired-ledger.txt; восстановите требуемое имя файла, не применяя это предложение.
phrases.0: Я изучил действия замены в сохранённом plan.
phrases.1: Я отклонил разрушительное изменение до применения.
phrases.2: Я сохранил идентичность реестра и проверил пустой plan после восстановления.
