title: Проверка plan
brief: 'Предложенное изменение реестра требует проверки безопасности. Сохраните исходный управляемый реестр
  и машиночитаемую запись отклонённого предложения.


  Работайте на рабочей станции в `~/quest` с `main.tf`.


  **Требования:**

  - На рабочей станции `~/quest/rejected-plan.json` содержит запись о предложенной замене реестра.

  - На рабочей станции исходный файл реестра остаётся по исходному пути с исходным содержимым.

  - Предложенный файл замены не создан на рабочей станции.

  - Существующий выход идентичности реестра сохраняет исходный ID провайдера.

  - Подробный план не содержит ожидающих изменений инфраструктуры и завершается с кодом `0`.

  '
debrief: Изучение plan предотвратило ненужное пересоздание ресурса.
stages.0.brief: Сохраните исходную идентичность реестра; отклонённая замена должна остаться только записанным
  предложением.
stages.0.objectives.0.text: На рабочей станции `~/quest/rejected-plan.json` содержит запись о предложенной
  замене реестра.
stages.0.objectives.1.text: На рабочей станции исходный файл реестра остаётся по исходному пути с исходным
  содержимым.
stages.0.objectives.2.text: Предложенный файл замены не создан на рабочей станции.
stages.0.objectives.3.text: Существующий выход идентичности реестра сохраняет исходный ID провайдера.
stages.0.objectives.4.text: OpenTofu не сообщает об ожидающих изменениях инфраструктуры.
hints.0.text: Предложенное изменение отличается от применённого изменения управляемого объекта.
hints.1.text: |-
  Сопоставьте путь ledger в main.tf с управляемым состоянием. Сохраните и экспортируйте предложение о замене, пока в конфигурации указано предложенное имя. После записи верните требуемое имя ledger.txt и оставьте предложение неприменённым.

  ```sh
  cat main.tf
  tofu show -no-color
  tofu plan -input=false -no-color -out=rejected.tfplan &&
    tofu show -json rejected.tfplan > rejected-plan.json
  ```
hints.2.text: |-
  Сохранённое изменение local_file включает создание и удаление. Прежний путь указывает на ledger.txt, а прежний ID совпадает с original-id.

  ```sh
  jq '.resource_changes[]
    | select(.mode == "managed" and .type == "local_file")
    | {address, actions: .change.actions, before_path: .change.before.filename,
       before_id: .change.before.id}' rejected-plan.json
  cat original-id
  ```

  Исходный файл содержит revision-36. Проверка отсутствия проходит, а текущий ID ledger совпадает с original-id.

  ```sh
  cat ledger.txt
  test ! -e retired-ledger.txt
  test "$(tofu output -raw ledger_id)" = "$(cat original-id)"
  ```

  Итоговый детальный план сообщает об отсутствии изменений и завершается с кодом 0.

  ```sh
  tofu plan -input=false -detailed-exitcode -no-color
  ```
phrases.0: Я изучил действия замены в сохранённом plan.
phrases.1: Я отклонил разрушительное изменение до применения.
phrases.2: Я сохранил идентичность реестра и проверил пустой plan после восстановления.
diagnostics.probe_0_0: План мог быть сохранён после исправления имени файла или не содержать замену записанного ledger; нечитаемые данные или ошибка Python/модуля также дают отказ. [Причина и проверка](guides#guide=terraform-6&section=ledger-rejected-plan)
diagnostics.ledger_content: Применение отвергнутой смены имени может удалить ledger.txt, а внешнее изменение — поменять ревизию; отсутствие файла или ошибка чтения также дают отказ. [Причина и проверка](guides#guide=terraform-6&section=ledger-retained-files)
diagnostics.retired_absent: Отвергнутая замена могла быть применена, либо на нежелательном пути остался retired-ledger.txt. [Причина и проверка](guides#guide=terraform-6&section=ledger-retained-files)
diagnostics.ledger_identity: Изменённое управляемое содержимое или устаревший выход могут отличать ledger_id от записанного ID; ошибки чтения выхода или записи также мешают сравнению. [Причина и проверка](guides#guide=terraform-6&section=ledger-recorded-output)
diagnostics.ledger_plan: Отвергнутое имя файла или другое неприменённое изменение могло остаться, либо итоговому плану мешает ошибка конфигурации, провайдера или state. [Причина и проверка](guides#guide=terraform-6&section=ledger-recovery-plan)
