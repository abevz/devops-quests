title: Проверка plan
brief: 'При правке ledger.txt изменили на retired-ledger.txt. Не применяйте предложение.
  Сохраните машиночитаемый plan в rejected-plan.json, найдите replacement, восстановите
  имя и сохраните provider ID из original-id.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `main.tf`, `original-id`,
  `rejected-plan.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно
  загруженные образы и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Отклонённый plan содержит replacement; ledger и ID сохранены;
  итоговый plan пуст.'
debrief: Изучение plan предотвратило ненужное пересоздание ресурса.
stages.0.brief: 'Результат проверки: Отклонённый plan содержит replacement; ledger
  и ID сохранены; итоговый plan пуст.'
stages.0.objectives.0.text: Отклонённый plan содержит replacement; ledger и ID сохранены;
  итоговый plan пуст.
hints.0.text: Изучите actions до согласия.
hints.1.text: Сохраните бинарный plan и используйте tofu show -json.
hints.2.text: Смена filename local_file вызывает replacement.
phrases.0: Я изучил действия замены в сохранённом plan.
phrases.1: Я отклонил разрушительное изменение до применения.
phrases.2: Я сохранил идентичность реестра и проверил пустой plan после восстановления.
