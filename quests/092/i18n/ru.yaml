title: Восстановление модуля
brief: 'Безопасный экспорт state связывает module.north с существующим ledger. Затем ошибочный state move
  назвал его module.orphan; новая конфигурация использует module.station. Проверьте checksum резервной
  копии, сравните адреса и исправьте текущую карту state без замены ledger и без push всего старого state.
  До применения проверенного plan сохраните recovery-plan.json. Используйте только offline local provider.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `main.tf`, `modules/ledger/main.tf`,
  `safe-state.json`, `safe-state.sha256`, `original-id`, `recovery-plan.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Карта модулей и outputs восстановлены, исходные ID и содержимое ledger сохранены,
  backup не изменён, итоговый plan пуст.'
debrief: Проверенная копия использована как карта для восстановления, без полной перезаписи текущего state.
stages.0.brief: 'Карта модулей и outputs восстановлены, исходные ID и содержимое ledger сохранены, backup
  не изменён, итоговый plan пуст.


  Результат проверки: Карта модулей и outputs восстановлены, исходные ID и содержимое ledger сохранены,
  backup не изменён, итоговый plan пуст.'
stages.0.objectives.0.text: Карта модулей и outputs восстановлены, исходные ID и содержимое ledger сохранены,
  backup не изменён, итоговый plan пуст.
hints.0.text: Backup state — свидетельство; восстановление всего файла может потерять более новое корректное
  состояние.
hints.1.text: Сопоставьте module.north в backup с module.orphan в текущем state.
hints.2.text: Переместите текущий адрес в module.station и изучите plan без изменений ресурсов.
phrases.0: Я проверил backup до использования при восстановлении.
phrases.1: Я согласовал адреса модулей без замены ресурса.
phrases.2: Я проверил identity, outputs и пустой итоговый plan.
