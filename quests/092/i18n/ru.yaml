title: Восстановление модулей между state
brief: |-
  Восстановление после разделения модулей не завершено. Восстановите объявленные модули в обоих корнях state, сохранив завершённую работу.

  Работайте на рабочей станции в `~/quest` с `main.tf`, `modules/ledger/main.tf`, `safe-state.json`, `infra/main.tf`, `infra/runtime-inputs.json` и `infra/module-contract.json`.

  **Требования:**
  - Предоставленный backup `~/quest/safe-state.json` на рабочей станции остаётся неизменным.
  - Основной state OpenTofu содержит только настроенный ресурс ledger; корневой `ledger_id` сохраняет исходный ID провайдера, а `~/quest/ledger.txt` на рабочей станции содержит `north-92`.
  - Инфраструктурный корень сохраняет более новую завершённую запись обслуживания и управляет исходными сетью, томом и работающим контейнером через предоставленный интерфейс модуля. Сохраните исходные live ID, идентичность создания тома, подключение сети, монтирование тома и все байты файла тома `/data/ledger` внутри сохранённого Docker-контейнера. Сохраните исходный ID провайдера записи обслуживания и её завершённые данные input/output.
  - Output `runtime` инфраструктурного caller сообщает фактические `container_id`, `network_id` и `volume_name`, описанные в `infra/module-contract.json`.
  - Оба корня state сохраняют собственную исходную lineage и serial не ниже предоставленного. Сохраните их исходные текущие снимки в `~/quest/before-recovery.tfstate` и `~/quest/infra/before-recovery.tfstate` на рабочей станции.
  - В `~/quest/recovery-plan.json` на рабочей станции ровно одна исходная запись ledger с действием `no-op`; `~/quest/infra/recovery-plan.json` охватывает все четыре исходные управляемые привязки с действиями `no-op`. В инфраструктурном плане разрешены read-only записи data.
  - Свежие подробные планы в обоих корнях завершаются с кодом `0`.

  Проверки наблюдают текущее содержимое backup, границы state, outputs, планы и физические идентичности/данные. Они не доказывают непрерывную историю или время сохранения плана либо backup.
debrief: Восстановлен интерфейс модуля и согласованы исходные привязки между независимыми state. Новая работа обслуживания,
  обе lineage, исходная физическая инфраструктура и данные сохранены.
stages.0.brief: Восстановите границы модулей и обоих state, сохранив исходные объекты и более новую завершённую
  работу.
hints.0.text: Пакет модуля, привязка ресурса и граница state — разные задачи восстановления. Корректный старый backup
  может не содержать работу, завершённую в более новом независимом state.
hints.1.text: |-
  Сопоставьте `cat main.tf infra/main.tf infra/module-contract.json`, `find modules infra -type f`, `tofu state list`, `tofu -chdir=infra state pull` и `jq . safe-state.json`. Изучите текущие Docker-объекты и содержимое тома. Отделите lineage, текущие привязки и завершённые ID каждого корня от старого backup; используйте `tofu providers schema -json` и native help для интерфейсов провайдера и модуля.

  Проследите ожидаемый интерфейс вызова в infra и сравните адреса привязанных модулей со старой копией. Для каждого корня изучите исходные ID провайдера, lineage и serial в текущем состоянии.
hints.2.text: |-
  После согласования привязок и до применения изменений выходов выгрузите оба плана, если JSON-квитанции ещё не сохранены. Команды сохраняют существующие квитанции и выгружают только планы без изменений управляемых ресурсов.

  ```sh
  for root in . infra; do
    (
      set -euo pipefail
      expected=1
      if test "$root" = infra; then expected=4; fi
      cd "$root"
      test -s recovery-plan.json && exit 0
      tmp=$(mktemp -d)
      trap 'rm -rf -- "$tmp"' EXIT
      tofu plan -input=false -no-color -out="$tmp/recovery.plan"
      tofu show -json "$tmp/recovery.plan" > "$tmp/recovery.json"
      jq -e --argjson expected "$expected" '
        ([.resource_changes[] | select(.mode=="managed")] | length)==$expected
        and all(.resource_changes[];
        if .mode=="managed" then .change.actions==["no-op"]
        else .mode=="data" and (.change.actions==["read"] or .change.actions==["no-op"]) end)' \
        "$tmp/recovery.json" >/dev/null
      set -o noclobber
      cat "$tmp/recovery.json" > recovery-plan.json
    )
  done
  ```

  Сохраните и экспортируйте план в каждом корне, проверьте исходные ID и только `no-op` для управляемых ресурсов до применения изменений одних outputs; затем убедитесь, что оба свежих подробных плана дают код `0`, а байты сохранённого тома не изменились.

  Сверьте каждый сохранённый снимок с исходным состоянием в его корне. В основном плане нужна одна управляемая запись ledger с `no-op`; в плане инфраструктуры — четыре сохранённые управляемые записи с `no-op`, записи чтения данных допустимы. Сверьте ID runtime и контрольную сумму файла тома с исходными наблюдениями.

  ```sh
  (
    set -euo pipefail
    ref=/run/dq/facts/0/recovery-identities.json
    test "$(sha256sum safe-state.json | cut -d ' ' -f1)" = "$(cat /run/dq/facts/0/safe-state.sha256)"
    python3 -I - <<'VERIFY_BACKUPS'
  import hashlib, json
  from pathlib import Path
  reference = json.loads(Path('/run/dq/facts/0/recovery-identities.json').read_text())
  for key, name in (('root', 'before-recovery.tfstate'), ('infra', 'infra/before-recovery.tfstate')):
      backup = json.loads(Path(name).read_text())
      canonical = json.dumps(backup, sort_keys=True, separators=(',', ':')).encode()
      assert hashlib.sha256(canonical).hexdigest() == reference[key + '_backup_sha256']
  VERIFY_BACKUPS
    jq -c '{file:input_filename,changes:[.resource_changes[] | {address,mode,actions:.change.actions,before_id:.change.before.id,after_id:.change.after.id}]}' \
      recovery-plan.json infra/recovery-plan.json
    test "$(tofu output -raw ledger_id)" = "$(cat /run/dq/facts/0/original-id)"
    cat ledger.txt
    tofu -chdir=infra output -json runtime | jq -e --slurpfile ref "$ref" '
      . == ($ref[0] | {container_id,network_id,volume_name})'
    container=$(jq -er .container_id "$ref")
    volume=$(jq -er .volume_name "$ref")
    docker inspect "$container" | jq -e --slurpfile ref "$ref" '
      $ref[0] as $want | .[0] | .Id==$want.container_id and .State.Running==true
      and any(.NetworkSettings.Networks[]; .NetworkID==$want.network_id)
      and any(.Mounts[]; .Type=="volume" and .Name==$want.volume_name and .Destination=="/data")'
    docker volume inspect "$volume" | jq -e --slurpfile ref "$ref" '.[0].CreatedAt==$ref[0].volume_created_at'
    digest=$(docker exec "$container" cat /data/ledger | sha256sum | cut -d ' ' -f1)
    test "$digest" = "$(jq -er .data_sha256 "$ref")"
    tofu plan -input=false -detailed-exitcode -no-color
    tofu -chdir=infra plan -input=false -detailed-exitcode -no-color
  )
  ```
phrases.0: Я проверил backup до использования при восстановлении.
phrases.1: Я согласовал адреса модулей без замены ресурса.
phrases.2: Я проверил identity, outputs и пустой итоговый plan.
stages.0.objectives.0.text: Предоставленная резервная копия восстановления `safe-state.json` на workstation остаётся
  неповреждённой.
stages.0.objectives.1.text: State OpenTofu содержит только настроенный ресурс реестра.
stages.0.objectives.2.text: Выходное значение `ledger_id` сохраняет ID ресурса, изначально назначенный провайдером.
stages.0.objectives.3.text: На workstation `ledger.txt` содержит `north-92`.
stages.0.objectives.4.text: Сохранённый основной план содержит ровно один исходный ledger с `no-op`; инфраструктурный
  план содержит все четыре исходные управляемые привязки с `no-op`.
stages.0.objectives.5.text: Оба корня state сходятся с сохранёнными lineage, исходными снимками, новой идентичностью
  обслуживания и исходными инфраструктурой и данными.
diagnostics.condition_0: Перенос state прямо из safe-state.json или правка копии меняет хэш её исходных байтов. Верните выданную копию и работайте с дубликатами; контрольная сумма зафиксирована, правка рабочего файла checksum не разрешает другие байты. [Причина и проверка](guides#guide=terraform-4&section=module-recovery-untouched-source-backup)
diagnostics.condition_1: Копия могла быть заменена текущим снимком после переименования модуля. Выданный источник восстановления содержит module.north.local_file.ledger; храните его отдельно от текущего снимка root и переносите привязки только на дубликате. [Причина и проверка](guides#guide=terraform-4&section=module-recovery-original-backup-binding)
diagnostics.condition_2: Setup оставляет ledger в module.orphan, хотя main.tf вызывает module.station. Перенесите существующую привязку по адресу конфигурации без замены файла, а привязки fabric держите в infra; root должен содержать только module.station.local_file.ledger. Ошибка CLI или backend тоже нарушает сравнение. [Причина и проверка](guides#guide=terraform-4&section=module-recovery-configured-root-address)
diagnostics.condition_3: Выход ledger_id может ссылаться на старый модуль, отсутствовать в state или содержать ID нового файла. Исправьте привязку и выход, изучите сохранённый план перед применением изменений выходов и сохраните исходный ID; ошибка чтения выхода тоже нарушает сравнение. [Причина и проверка](guides#guide=terraform-4&section=module-recovery-original-ledger-output)
diagnostics.condition_4: Файл ledger.txt на workstation мог исчезнуть или измениться после исправления модуля. Содержимое при чтении shell должно быть north-92; это другой файл, не файл сохранённого Docker volume, чьи полные байты проверяются отдельно. [Причина и проверка](guides#guide=terraform-4&section=module-recovery-workstation-ledger-content)
diagnostics.condition_5: recovery-plan.json может отсутствовать, быть некорректным, экспортированным из другого root или описывать лишние привязки. Экспортируйте сохранённый план основного root через tofu show -json и проверьте ровно одну запись resource_changes перед проверкой идентичности. [Причина и проверка](guides#guide=terraform-4&section=module-recovery-root-plan-entry-count)
diagnostics.condition_6: Старый план или план до восстановления может предлагать create, delete или update. Исправьте существующую привязку ledger и конфигурацию, затем заново сохраните основной план; каждая запись resource_changes должна иметь точный список действий no-op. Некорректный JSON тоже не проходит. [Причина и проверка](guides#guide=terraform-4&section=module-recovery-saved-root-no-op)
diagnostics.recovery_plans: Оба JSON-плана могут читаться, но описывать новые ID, другие адреса или неполный набор привязок. Основной план сохраняет исходный ledger в module.station.local_file.ledger; infra содержит четыре исходных управляемых типа с no-op, сохранёнными ID и адресами модуля fabric для Docker. В infra разрешены записи data только для чтения. [Причина и проверка](guides#guide=terraform-4&section=module-recovery-saved-plan-original-identities)
diagnostics.condition_7: Подробный план даёт код 2 при изменениях или 1 при ошибке модуля, провайдера либо backend; оба не равны требуемому 0. Восстановите пакет, существующие привязки и выходы после просмотра плана, не заменяя исходные объекты. [Причина и проверка](guides#guide=terraform-4&section=module-recovery-fresh-root-plan)
diagnostics.recovery_target: Замена infra state целиком старой копией теряет новую завершённую запись terraform_data. Объедините только отсутствующие fabric-привязки с копией текущего infra state; сохраните четыре исходных управляемых типа, по одному исходному экземпляру, input/output progress и точный выход runtime. Ошибка чтения state или выхода даёт тот же маркер. [Причина и проверка](guides#guide=terraform-4&section=module-recovery-retained-target-state)
diagnostics.recovery_lineage: Публикация целого старого state в любой root может заменить lineage или откатить serial. Сохраните каждый текущий root отдельно и переносите только нужные привязки; оба serial должны быть целыми не ниже зафиксированных начальных значений. [Причина и проверка](guides#guide=terraform-4&section=module-recovery-independent-lineages-and-serials)
diagnostics.recovery_identity: Пересоздание контейнера или volume может дать внешне правильный план, потеряв исходную идентичность. Сохраните provider ID ledger, исходный работающий контейнер, подключение к исходной сети и volume в /data с зафиксированным временем создания. Ошибки наблюдения Docker дают тот же маркер; правка ID в state не чинит заменённый объект. [Причина и проверка](guides#guide=terraform-4&section=module-recovery-physical-original-objects)
diagnostics.recovery_data: Файл volume мог исчезнуть, быть переписан или читаться из другого volume, даже если первая строка верна. Исходные полные байты включают запись sequence; сравните SHA-256 /data/ledger внутри исходного контейнера. Ошибка Docker exec или чтения даёт тот же маркер. [Причина и проверка](guides#guide=terraform-4&section=module-recovery-retained-volume-bytes)
diagnostics.recovery_backups: Нужные снимки могут отсутствовать, быть сохранены после восстановления или перепутаны со старой safe-state.json. Сохраните начальные текущие снимки root и infra по объявленным путям до переноса привязок. Здесь сравнивается канонический декодированный JSON, поэтому только изменение пробелов не нарушает условие. [Причина и проверка](guides#guide=terraform-4&section=module-recovery-initial-current-snapshots)
diagnostics.recovery_convergence: Инфраструктурный root после восстановления state может предлагать изменения или не загружать восстановленный пакет либо provider. Сохранённого JSON с no-op недостаточно; запустите свежий подробный infra-план и различайте код 2 с изменениями и код 1 с ошибкой наблюдения или конфигурации. [Причина и проверка](guides#guide=terraform-4&section=module-recovery-fresh-infra-plan)
diagnostics.probe_0_4: Основной план прошёл начальные именованные проверки, но Python observer не прочитал зафиксированные идентичности или infra-план, не разобрал JSON либо форму документа до именованного результата. Проверьте пути обоих экспортов и их структуру; ранее выданные маркеры подавляют этот fallback. [Причина и проверка](guides#guide=terraform-4&section=module-recovery-saved-plan-observation)
diagnostics.probe_0_5: Начальный root-план прошёл, но Python мог упасть из-за отсутствующих frozen inputs, неожиданной формы state/Docker JSON или необработанного исключения финального infra-плана до именованного результата. Проверьте входы и ошибки плана; пойманные CLI-сбои уже дают recovery-маркер, а предыдущие маркеры подавляют fallback. [Причина и проверка](guides#guide=terraform-4&section=module-recovery-recovery-observation-fallback)
