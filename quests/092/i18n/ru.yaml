title: Восстановление модуля
brief: 'В `~/quest` изучите `main.tf`, `modules/ledger/main.tf`, `safe-state.json`, `safe-state.sha256` и `original-id`. Безопасный
  экспорт состояния описывает ledger по адресу `module.north.local_file.ledger`; ошибочный перенос состояния переименовал
  его в module.orphan, а конфигурация теперь вызывает module.station. Используйте резервную копию как карту и согласуйте текущее
  состояние; офлайн-провайдер дочернего модуля уже объявлен. Руководство знакомит с адресами модулей, а `tofu state mv` изменяет
  адрес в состоянии.


  Сохраните `safe-state.json` без изменений: его SHA-256 должен совпадать с `/run/dq/facts/0/safe-state.sha256`, а ресурсы
  JSON должны включать `module.north.local_file.ledger`. Сохраните бинарный план и экспортируйте его через `tofu show -json`
  в `recovery-plan.json`, затем примените. Проверьте, что `tofu state list` содержит ровно `module.station.local_file.ledger`,
  корневой выход `ledger_id` равен `/run/dq/facts/0/original-id`, а `ledger.txt` содержит `north-92`. Сохранённый JSON-план
  должен содержать ровно одно изменение ресурса с действиями `["no-op"]`. Наконец, `tofu plan -input=false -detailed-exitcode
  -no-color` должен завершиться с кодом 0 (изменений нет). Проверка исследует копию, текущее состояние и сохранённый JSON,
  но не доказывает историю восстановления или время сохранения плана. Работайте только в офлайн-песочнице.'
debrief: Контрольная сумма копии, текущий адрес состояния, ID и файл ledger и сохранённый план соответствуют условиям восстановления;
  итоговый план не содержит изменений.
stages.0.brief: Копия, адрес состояния, ID и файл ledger, сохранённый и итоговый планы соответствуют заданию.
stages.0.objectives.0.text: Копия, адрес состояния, ID и файл ledger, сохранённый и итоговый планы соответствуют заданию.
hints.0.text: Backup state — свидетельство; восстановление всего файла может потерять более новое корректное состояние.
hints.1.text: Сопоставьте module.north в backup с module.orphan в текущем state.
hints.2.text: Переместите текущий адрес в module.station и изучите plan без изменений ресурсов.
phrases.0: Я проверил backup до использования при восстановлении.
phrases.1: Я согласовал адреса модулей без замены ресурса.
phrases.2: Я проверил identity, outputs и пустой итоговый plan.
diagnostics.condition_0: /run/dq/facts/0/safe-state.sha256 должен быть непустым, а sha256(safe-state.json) должен совпадать
  с его содержимым.
diagnostics.condition_1: safe-state.json resources должен содержать module.north.local_file.ledger.
diagnostics.condition_2: tofu state list должен совпадать с module.station.local_file.ledger.
diagnostics.condition_3: /run/dq/facts/0/original-id должен быть непустым, а tofu output -raw ledger_id должен совпадать с
  его содержимым.
diagnostics.condition_4: ledger.txt должен совпадать с north-92.
diagnostics.condition_5: recovery-plan.json resource_changes length должен совпадать с 1.
diagnostics.condition_6: У каждой записи в recovery-plan.json resource_changes должно быть actions ["no-op"].
diagnostics.condition_7: План OpenTofu с detailed-exitcode должен завершиться с кодом 0.
