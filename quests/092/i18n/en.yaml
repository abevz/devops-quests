title: Module recovery
brief: |
  The ledger is unavailable through the required managed address.

  Work on the workstation in `~/quest` with `main.tf`, `modules/ledger/main.tf`, `safe-state.json`.

  **Requirements:**
  - Backup on the workstation:
    - Path: `~/quest/safe-state.json`.
    - Frozen SHA-256 receipt: `/run/dq/facts/0/safe-state.sha256`.
    - Includes `module.north.local_file.ledger`.
  - OpenTofu state:
    - Exact inventory: `module.station.local_file.ledger`.
  - Root outputs:
    - Output name: `ledger_id`.
    - Matching receipt on the workstation: `/run/dq/facts/0/original-id`.
  - Files on the workstation:
    - `~/quest/ledger.txt`: `north-92`.
  - Saved recovery plan on the workstation:
    - Path: `~/quest/recovery-plan.json`.
    - Exactly `1` resource entry with action `no-op`.
  - Infrastructure convergence:
    - No pending infrastructure changes; detailed-plan exit code `0`.

  **Verify yourself before Check & finish:**
  - `sha256sum safe-state.json; cat /run/dq/facts/0/safe-state.sha256; jq -r '.resources[] | select(.type=="local_file" and .name=="ledger") | .module + "." + .type + "." + .name' safe-state.json` — The digests match and the backup contains `module.north.local_file.ledger`.
  - `tofu output -raw ledger_id; printf '\n'; cat /run/dq/facts/0/original-id; cat ledger.txt; tofu show -no-color` — The IDs match; `ledger.txt` reads `north-92`; state contains only `module.station.local_file.ledger`.
  - `jq -r '.resource_changes[] | .address + " " + (.change.actions | join(","))' recovery-plan.json; tofu plan -input=false -detailed-exitcode -no-color` — Exactly one saved entry has action `no-op`; current planning exits `0`.

  The check inspects the backup, current state and saved plan; it does not prove recovery history or when the plan was saved.
debrief: The backup checksum, current state address, ledger ID, file and saved plan now match the recovery contract;
  the final plan has no changes.
stages.0.brief: The ledger must meet the result contract with its recorded identity and intact backup.
hints.0.text: A state backup is evidence; restoring the whole file can discard newer valid state.
hints.1.text: Compare module.north in the backup with module.orphan in current state.
hints.2.text: |-
  Move the current module address to module.station.
  Save the binary plan and export it with tofu show -json to the requested JSON artifact.
phrases.0: I verified a backup before using it as recovery evidence.
phrases.1: I reconciled module addresses without replacing the resource.
phrases.2: I verified identity, outputs and an empty final plan.
diagnostics.condition_0: /run/dq/facts/0/safe-state.sha256 must be nonempty, and sha256(safe-state.json) must equal
  it.
diagnostics.condition_1: safe-state.json resources must contain module.north.local_file.ledger.
diagnostics.condition_2: tofu state list must equal module.station.local_file.ledger.
diagnostics.condition_3: /run/dq/facts/0/original-id must be nonempty, and tofu output -raw ledger_id must equal
  it.
diagnostics.condition_4: ledger.txt must equal north-92.
diagnostics.condition_5: recovery-plan.json resource_changes length must equal 1.
diagnostics.condition_6: Every entry in recovery-plan.json resource_changes must have actions ["no-op"].
diagnostics.condition_7: The OpenTofu detailed plan must exit with code 0.
stages.0.objectives.0.text: Workstation `safe-state.json` matches `/run/dq/facts/0/safe-state.sha256` and contains
  `module.north.local_file.ledger`.
stages.0.objectives.1.text: OpenTofu state contains exactly `module.station.local_file.ledger`.
stages.0.objectives.2.text: The `ledger_id` output matches workstation `/run/dq/facts/0/original-id`.
stages.0.objectives.3.text: On the workstation, `ledger.txt` contains `north-92`.
stages.0.objectives.4.text: Workstation `recovery-plan.json` records exactly one resource entry with action `no-op`.
stages.0.objectives.5.text: OpenTofu reports no pending infrastructure changes.
