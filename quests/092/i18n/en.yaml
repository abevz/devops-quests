title: Module recovery
brief: 'In `~/quest`, read `main.tf`, `modules/ledger/main.tf`, `safe-state.json`, `safe-state.sha256` and `original-id`. A safe state export describes the ledger under `module.north.local_file.ledger`; a mistaken state move renamed it to module.orphan, while the configuration now calls it module.station. Use the backup as a map and reconcile the current state; the offline child provider is already declared. The linked module guide introduces module addresses, and `tofu state mv` changes an address in state.


  Keep `safe-state.json` unchanged: its SHA-256 must match `/run/dq/facts/0/safe-state.sha256`, and its JSON resources must include `module.north.local_file.ledger`. Save a binary plan and export it with `tofu show -json` to `recovery-plan.json`, then apply. Verify that `tofu state list` contains exactly `module.station.local_file.ledger`, root output `ledger_id` equals `/run/dq/facts/0/original-id`, and `ledger.txt` contains `north-92`. The saved JSON plan must contain exactly one resource change with actions `["no-op"]`. Finally `tofu plan -input=false -detailed-exitcode -no-color` must exit 0 (no changes). The check inspects the backup, current state and saved JSON; it does not prove the history of the recovery or when the plan was saved. Work only inside the offline bay.'
debrief: The backup checksum, current state address, ledger ID, file and saved plan now match the recovery contract; the final plan has no changes.
stages.0.brief: The backup, state address, ledger ID and file, saved plan and final plan match the brief.
stages.0.objectives.0.text: The backup, state address, ledger ID and file, saved plan and final plan match the brief.
hints.0.text: A state backup is evidence; restoring the whole file can discard newer
  valid state.
hints.1.text: Compare module.north in the backup with module.orphan in current state.
hints.2.text: Move the current module address to module.station, then inspect a no-op
  resource plan.
phrases.0: I verified a backup before using it as recovery evidence.
phrases.1: I reconciled module addresses without replacing the resource.
phrases.2: I verified identity, outputs and an empty final plan.
