title: Module recovery across states
brief: |-
  Recovery after a module split is incomplete. Restore the declared modules across both state roots without losing completed work.

  Work on the workstation in `~/quest` with `main.tf`, `modules/ledger/main.tf`, `safe-state.json`, `infra/main.tf`, `infra/runtime-inputs.json` and `infra/module-contract.json`.

  **Requirements:**
  - The supplied workstation recovery backup `~/quest/safe-state.json` remains intact.
  - The main OpenTofu state contains only the configured ledger resource; root `ledger_id` retains its original provider ID, and workstation `~/quest/ledger.txt` contains `north-92`.
  - The infrastructure root retains its newer completed maintenance record and manages the original network, volume and running container through the supplied module interface. Keep the original live IDs, volume creation identity, network attachment, volume mount and all bytes of the volume file `/data/ledger` inside the retained Docker container. Keep the maintenance record’s original provider ID and its completed input/output data.
  - The infrastructure caller’s `runtime` output reports the actual `container_id`, `network_id` and `volume_name` described in `infra/module-contract.json`.
  - Both state roots retain their own original lineage and at least their supplied serial. Retain their initial current snapshots in workstation `~/quest/before-recovery.tfstate` and `~/quest/infra/before-recovery.tfstate`.
  - Workstation `~/quest/recovery-plan.json` records exactly one original ledger entry with action `no-op`; `~/quest/infra/recovery-plan.json` covers all four original managed bindings with actions `no-op`. Read-only data entries in the infrastructure plan are allowed.
  - Fresh detailed plans in both roots exit `0`.

  Checks inspect current backup contents, state boundaries, outputs, plans and physical identities/data. They do not establish uninterrupted history or when a plan or backup was saved.
debrief: Recovery reconstructed a module interface and reconciled original bindings across independent state boundaries.
  Newer maintenance work, both lineages and the original physical infrastructure/data survived.
stages.0.brief: Recover both module/state boundaries while preserving original objects and newer completed work.
hints.0.text: A module package, a resource binding and a state boundary are different recovery concerns. A valid
  old backup can omit work completed in a newer independent state.
hints.1.text: Compare `cat main.tf infra/main.tf infra/module-contract.json`, `find modules infra -type f`, `tofu
  state list`, `tofu -chdir=infra state pull` and `jq . safe-state.json`. Inspect current Docker objects and volume
  contents. Separate each root’s lineage, current bindings and completed IDs from the older backup; use `tofu providers
  schema -json` and native help for the supplied provider/module interfaces.
hints.2.text: Reconstruct the declared module interface and retain both current snapshots before changing bindings.
  Work on copies of the old backup and the current destination state; `tofu state mv -state=... -state-out=...`
  can transfer only the missing module bindings without overwriting newer destination work. Publish the reconciled
  state with normal lineage/serial safeguards and repair the main root’s configured address. Save/export a plan
  in each root, inspect original IDs and only `no-op` managed actions before applying any output-only changes, then
  verify both fresh detailed plans exit `0` and the retained volume bytes remain unchanged.
phrases.0: I verified a backup before using it as recovery evidence.
phrases.1: I reconciled module addresses without replacing the resource.
phrases.2: I verified identity, outputs and an empty final plan.
diagnostics.condition_0: /run/dq/facts/0/safe-state.sha256 must be nonempty, and sha256(safe-state.json) must equal
  it.
diagnostics.condition_1: safe-state.json resources must contain module.north.local_file.ledger.
diagnostics.condition_2: tofu state list must equal module.station.local_file.ledger.
diagnostics.condition_3: /run/dq/facts/0/original-id must be nonempty, and tofu output -raw ledger_id must equal
  it.
diagnostics.condition_4: ledger.txt must equal north-92.
diagnostics.condition_5: recovery-plan.json resource_changes length must equal 1.
diagnostics.condition_6: Every entry in recovery-plan.json resource_changes must have actions ["no-op"].
diagnostics.condition_7: The OpenTofu detailed plan must exit with code 0.
stages.0.objectives.0.text: The supplied workstation recovery backup `safe-state.json` remains intact.
stages.0.objectives.1.text: OpenTofu state contains only the configured ledger resource.
stages.0.objectives.2.text: The `ledger_id` output retains the resource ID originally assigned by the provider.
stages.0.objectives.3.text: On the workstation, `ledger.txt` contains `north-92`.
stages.0.objectives.4.text: The saved main plan records exactly one original ledger `no-op`; the infrastructure
  plan records all four original managed bindings as `no-op`.
stages.0.objectives.5.text: Both state roots converge with retained lineages, initial snapshots, newer maintenance
  identity and original live infrastructure/data.
diagnostics.recovery_plans: Both saved plans must cover their current original managed bindings with no-op actions
  and original IDs.
diagnostics.recovery_target: The infrastructure state and runtime interface must retain the original module resources
  and the genuine newer maintenance record.
diagnostics.recovery_identity: Retain the original provider ledger ID, live Docker IDs, attached network and original
  mounted volume creation identity.
diagnostics.recovery_lineage: Keep each state’s original lineage and do not roll back its serial.
diagnostics.recovery_data: Keep every original byte of the retained volume’s /data/ledger file.
diagnostics.recovery_backups: Retain each initial current state snapshot at before-recovery.tfstate and infra/before-recovery.tfstate.
diagnostics.recovery_convergence: The infrastructure root must also produce a fresh detailed-plan exit code 0.
diagnostics.probe_0_4: The saved main plan records exactly one original ledger `no-op`; the infrastructure plan
  records all four original managed bindings as `no-op`.
diagnostics.probe_0_5: Both state roots converge with retained lineages, initial snapshots, newer maintenance identity
  and original live infrastructure/data.
