title: Module recovery across states
brief: |-
  Recovery after a module split is incomplete. Restore the declared modules across both state roots without losing completed work.

  Work on the workstation in `~/quest` with `main.tf`, `modules/ledger/main.tf`, `safe-state.json`, `infra/main.tf`, `infra/runtime-inputs.json` and `infra/module-contract.json`.

  **Requirements:**
  - The supplied workstation recovery backup `~/quest/safe-state.json` remains intact.
  - The main OpenTofu state contains only the configured ledger resource; root `ledger_id` retains its original provider ID, and workstation `~/quest/ledger.txt` contains `north-92`.
  - The infrastructure root retains its newer completed maintenance record and manages the original network, volume and running container through the supplied module interface. Keep the original live IDs, volume creation identity, network attachment, volume mount and all bytes of the volume file `/data/ledger` inside the retained Docker container. Keep the maintenance record’s original provider ID and its completed input/output data.
  - The infrastructure caller’s `runtime` output reports the actual `container_id`, `network_id` and `volume_name` described in `infra/module-contract.json`.
  - Both state roots retain their own original lineage and at least their supplied serial. Retain their initial current snapshots in workstation `~/quest/before-recovery.tfstate` and `~/quest/infra/before-recovery.tfstate`.
  - Workstation `~/quest/recovery-plan.json` records exactly one original ledger entry with action `no-op`; `~/quest/infra/recovery-plan.json` covers all four original managed bindings with actions `no-op`. Read-only data entries in the infrastructure plan are allowed.
  - Fresh detailed plans in both roots exit `0`.

  Checks inspect current backup contents, state boundaries, outputs, plans and physical identities/data. They do not establish uninterrupted history or when a plan or backup was saved.
debrief: Recovery reconstructed a module interface and reconciled original bindings across independent state boundaries.
  Newer maintenance work, both lineages and the original physical infrastructure/data survived.
stages.0.brief: Recover both module/state boundaries while preserving original objects and newer completed work.
hints.0.text: A module package, a resource binding and a state boundary are different recovery concerns. A valid
  old backup can omit work completed in a newer independent state.
hints.1.text: Compare `cat main.tf infra/main.tf infra/module-contract.json`, `find modules infra -type f`, `tofu
  state list`, `tofu -chdir=infra state pull` and `jq . safe-state.json`. Inspect current Docker objects and volume
  contents. Separate each root’s lineage, current bindings and completed IDs from the older backup; use `tofu providers
  schema -json` and native help for the supplied provider/module interfaces.
hints.2.text: Reconstruct the declared module interface and retain both current snapshots before changing bindings.
  Work on copies of the old backup and the current destination state; `tofu state mv -state=... -state-out=...`
  can transfer only the missing module bindings without overwriting newer destination work. Publish the reconciled
  state with normal lineage/serial safeguards and repair the main root’s configured address. Save/export a plan
  in each root, inspect original IDs and only `no-op` managed actions before applying any output-only changes, then
  verify both fresh detailed plans exit `0` and the retained volume bytes remain unchanged.
phrases.0: I verified a backup before using it as recovery evidence.
phrases.1: I reconciled module addresses without replacing the resource.
phrases.2: I verified identity, outputs and an empty final plan.
stages.0.objectives.0.text: The supplied workstation recovery backup `safe-state.json` remains intact.
stages.0.objectives.1.text: OpenTofu state contains only the configured ledger resource.
stages.0.objectives.2.text: The `ledger_id` output retains the resource ID originally assigned by the provider.
stages.0.objectives.3.text: On the workstation, `ledger.txt` contains `north-92`.
stages.0.objectives.4.text: The saved main plan records exactly one original ledger `no-op`; the infrastructure
  plan records all four original managed bindings as `no-op`.
stages.0.objectives.5.text: Both state roots converge with retained lineages, initial snapshots, newer maintenance
  identity and original live infrastructure/data.
diagnostics.condition_0: A state move against safe-state.json itself or an edited backup changes its raw-byte hash. Recover the issued backup and work on copies; the authoritative checksum is frozen, so editing a working checksum file cannot approve different bytes. [Cause and check](guides#guide=terraform-4&section=module-recovery-untouched-source-backup)
diagnostics.condition_1: The backup may have been replaced with a current snapshot after the module rename. The issued recovery source contains module.north.local_file.ledger; keep it separate from the current root snapshot and move bindings only on a duplicate. [Cause and check](guides#guide=terraform-4&section=module-recovery-original-backup-binding)
diagnostics.condition_2: Setup leaves the ledger under module.orphan while main.tf calls module.station. Move that existing binding to its configured address without replacing the file, and keep recovered fabric bindings in infra; the root listing must contain exactly module.station.local_file.ledger. CLI or backend failures also make the listing differ. [Cause and check](guides#guide=terraform-4&section=module-recovery-configured-root-address)
diagnostics.condition_3: The ledger_id output may still refer to an old module, be absent from state, or point to a newly created file ID. Repair the configured binding and output, inspect a saved plan before applying output changes, and retain the frozen original ID; failed output reads also fail this comparison. [Cause and check](guides#guide=terraform-4&section=module-recovery-original-ledger-output)
diagnostics.condition_4: The workstation ledger.txt may be missing or changed after repairing the module. Its shell-read content must be north-92; this file is distinct from the retained Docker volume file, whose complete bytes are checked separately. [Cause and check](guides#guide=terraform-4&section=module-recovery-workstation-ledger-content)
diagnostics.condition_5: recovery-plan.json may be missing, invalid, exported from the wrong root or still describe extra bindings. Export the saved main-root plan with tofu show -json and confirm resource_changes contains exactly one entry before checking its identity. [Cause and check](guides#guide=terraform-4&section=module-recovery-root-plan-entry-count)
diagnostics.condition_6: A stale or pre-recovery plan may still propose create, delete or update actions. Repair the existing ledger binding and configuration, then regenerate the saved main plan; every resource_changes entry must report the exact no-op action list. Invalid JSON also fails this test. [Cause and check](guides#guide=terraform-4&section=module-recovery-saved-root-no-op)
diagnostics.recovery_plans: Both JSON plans may be readable yet describe replacement IDs, wrong module addresses or missing managed bindings. The main plan must retain the original ledger at module.station.local_file.ledger; infra must cover all four original managed types with no-op actions, retained IDs and fabric module addresses for Docker resources. Read-only data entries are allowed in infra. [Cause and check](guides#guide=terraform-4&section=module-recovery-saved-plan-original-identities)
diagnostics.condition_7: A detailed plan can exit 2 for pending changes or 1 for a module, provider or backend error; both fail the required exit 0. Reconstruct the missing package, recover existing bindings and reconcile outputs after reviewing the plan instead of replacing the original objects. [Cause and check](guides#guide=terraform-4&section=module-recovery-fresh-root-plan)
diagnostics.recovery_target: Replacing infra state with the entire older backup loses the newer completed terraform_data record. Merge only the missing fabric bindings into a copy of the current infra state; retain its four original managed types, one original instance per type, progress input/output and exact runtime output. State or output read errors also report this marker. [Cause and check](guides#guide=terraform-4&section=module-recovery-retained-target-state)
diagnostics.recovery_lineage: Publishing an entire old state into either root may replace its lineage or roll its serial back. Preserve each current root separately and transfer only required bindings; both serials must be integers at least as high as their frozen initial values. [Cause and check](guides#guide=terraform-4&section=module-recovery-independent-lineages-and-serials)
diagnostics.recovery_identity: Recreating a container or volume can make a plan appear valid while losing original identity. Retain the ledger provider ID, original running container, original network attachment and volume mounted at /data, including its recorded creation time. Docker observation failures also use this marker; changing only a state ID does not repair a replaced object. [Cause and check](guides#guide=terraform-4&section=module-recovery-physical-original-objects)
diagnostics.recovery_data: The volume file may be missing, rewritten or mounted from the wrong volume even when its first line still looks correct. Its entire original bytes include the sequence record; compare the SHA-256 of /data/ledger inside the original container. A failed Docker exec or read also emits this marker. [Cause and check](guides#guide=terraform-4&section=module-recovery-retained-volume-bytes)
diagnostics.recovery_backups: The required snapshots may be absent, saved after recovery or confused with the older safe-state.json. Preserve the initial current root and infra snapshots at their declared paths before moving bindings. This predicate compares canonical decoded JSON, so whitespace changes alone do not fail it. [Cause and check](guides#guide=terraform-4&section=module-recovery-initial-current-snapshots)
diagnostics.recovery_convergence: The infrastructure root may still propose changes after state recovery or fail to load the reconstructed package/provider. A saved no-op JSON alone is insufficient; run a fresh detailed infra plan and inspect whether exit 2 means changes or exit 1 means an observation/configuration error. [Cause and check](guides#guide=terraform-4&section=module-recovery-fresh-infra-plan)
diagnostics.probe_0_4: The root plan passed its named preliminary checks, but the Python observer could not read frozen identities or the infra plan, decode JSON or handle the document shape before emitting a named result. Check both export paths and their structures; earlier named failures suppress this fallback. [Cause and check](guides#guide=terraform-4&section=module-recovery-saved-plan-observation)
diagnostics.probe_0_5: The initial root plan passed, but Python may fail on missing frozen inputs, unexpected state/Docker document shape or an uncaught final infra-plan exception before producing a named result. Inspect current inputs and plan errors; caught CLI failures already use their recovery marker, and prior named failures suppress this fallback. [Cause and check](guides#guide=terraform-4&section=module-recovery-recovery-observation-fallback)
