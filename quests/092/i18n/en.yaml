title: Module recovery
brief: 'A safe state export maps module.north to the existing ledger. A mistaken state
  move then renamed it module.orphan; the new configuration calls it module.station.
  Verify the backup checksum, compare addresses and reconcile the current state map
  without replacing the ledger or pushing the entire old state. Save recovery-plan.json
  before applying the reviewed plan. Use only the offline local provider.


  Quest files in `~/quest` (some appear in later stages): `main.tf`, `modules/ledger/main.tf`,
  `safe-state.json`, `safe-state.sha256`, `original-id`, `recovery-plan.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images
  and private services. Change only this bay.


  Initial success criteria: The module map and outputs are recovered, the original
  ledger ID and content are preserved, the backup is unchanged and the final plan
  is empty.'
debrief: Recovery used the verified backup as a map rather than overwriting the current
  state wholesale.
stages.0.brief: 'Success criteria: The module map and outputs are recovered, the original
  ledger ID and content are preserved, the backup is unchanged and the final plan
  is empty.'
stages.0.objectives.0.text: The module map and outputs are recovered, the original
  ledger ID and content are preserved, the backup is unchanged and the final plan
  is empty.
hints.0.text: A state backup is evidence; restoring the whole file can discard newer
  valid state.
hints.1.text: Compare module.north in the backup with module.orphan in current state.
hints.2.text: Move the current module address to module.station, then inspect a no-op
  resource plan.
phrases.0: I verified a backup before using it as recovery evidence.
phrases.1: I reconciled module addresses without replacing the resource.
phrases.2: I verified identity, outputs and an empty final plan.
