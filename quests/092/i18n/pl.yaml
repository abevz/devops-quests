title: Odzyskiwanie modułu
brief: 'Bezpieczny eksport state mapuje module.north do istniejącego ledger. Błędny state move, a następnie
  przemianowany na module.orphan; nowa konfiguracja nazywa ją module.station. Zweryfikuj backup checksum,
  porównaj adresy i uzgodnij aktualną mapę state bez wymiany ledger lub wciskania całego starego state.
  Zapisz recovery-plan.json przed zastosowaniem recenzowanego plan. Używaj wyłącznie offline local provider.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `main.tf`, `modules/ledger/main.tf`,
  `safe-state.json`, `safe-state.sha256`, `original-id`, `recovery-plan.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: Odzyskano mapę modułu i outputs, oryginalny ledger ID i zawartość zostają
  zachowane, backup pozostaje niezmieniony, a ostateczny plan jest pusty.'
debrief: Funkcja odzyskiwania wykorzystała zweryfikowaną kopię zapasową jako mapę, zamiast nadpisywać
  bieżącą wersję hurtową state.
stages.0.brief: 'Kryteria sukcesu: Odzyskano mapę modułu i outputs, oryginalny ledger ID i zawartość zostają
  zachowane, backup pozostaje niezmieniony, a ostateczny plan jest pusty.'
stages.0.objectives.0.text: Mapa modułu i outputs zostały odzyskane, oryginalny ledger ID i zawartość
  zostają zachowane, backup pozostaje niezmieniony, a ostateczny plan jest pusty.
hints.0.text: Kopia zapasowa stanu jest dowodem; przywrócenie całego pliku może odrzucić nowszy prawidłowy
  stan.
hints.1.text: Porównaj module.north w backup z module.orphan w obecnym state.
hints.2.text: Przenieś bieżący adres modułu do module.station, a następnie sprawdź plan bez zmian zasobów
  (no-op).
phrases.0: Zweryfikowałem backup przed użyciem go jako dowodu odzyskiwania.
phrases.1: Uzgodniłem adresy modułów bez wymiany zasobu.
phrases.2: Zweryfikowałem identity, outputs i pusty końcowy plan.
