title: Odzyskiwanie modułu
brief: |
  Rejestr jest niedostępny pod wymaganym zarządzanym adresem.

  Pracuj na workstation w `~/quest` z plikami `main.tf`, `modules/ledger/main.tf`, `safe-state.json`.

  **Wymagania:**
  - Kopia zapasowa na workstation:
    - Ścieżka: `~/quest/safe-state.json`.
    - Zamrożone potwierdzenie SHA-256: `/run/dq/facts/0/safe-state.sha256`.
    - Zawiera `module.north.local_file.ledger`.
  - Stan OpenTofu:
    - Dokładna lista: `module.station.local_file.ledger`.
  - Wyjścia główne:
    - Nazwa wyjścia: `ledger_id`.
    - Zgodne potwierdzenie na workstation: `/run/dq/facts/0/original-id`.
  - Pliki na workstation:
    - `~/quest/ledger.txt`: `north-92`.
  - Zapisany plan odzyskiwania na workstation:
    - Ścieżka: `~/quest/recovery-plan.json`.
    - Dokładnie `1` wpis zasobu z akcją `no-op`.
  - Zbieżność infrastruktury:
    - Brak oczekujących zmian infrastruktury; kod zakończenia szczegółowego planu `0`.

  **Sprawdź przed Check & finish:**
  - `sha256sum safe-state.json; cat /run/dq/facts/0/safe-state.sha256; jq -r '.resources[] | select(.type=="local_file" and .name=="ledger") | .module + "." + .type + "." + .name' safe-state.json` — Sumy są zgodne, a kopia zawiera `module.north.local_file.ledger`.
  - `tofu output -raw ledger_id; printf '\n'; cat /run/dq/facts/0/original-id; cat ledger.txt; tofu show -no-color` — ID są zgodne; `ledger.txt` pokazuje `north-92`; stan zawiera tylko `module.station.local_file.ledger`.
  - `jq -r '.resource_changes[] | .address + " " + (.change.actions | join(","))' recovery-plan.json; tofu plan -input=false -detailed-exitcode -no-color` — Dokładnie jeden zapisany wpis ma akcję `no-op`; bieżący plan kończy się kodem `0`.

  Sprawdzenie bada kopię, bieżący stan i zapisany plan; nie dowodzi historii odzyskiwania ani czasu zapisania planu.
debrief: Suma kopii, bieżący adres stanu, ID i plik ledger oraz zapisany plan odpowiadają wymaganiom odzyskiwania;
  końcowy plan nie zawiera zmian.
stages.0.brief: Rejestr musi spełniać kontrakt wyniku z zapisaną tożsamością i nienaruszoną kopią.
hints.0.text: Kopia zapasowa stanu jest dowodem; przywrócenie całego pliku może odrzucić nowszy prawidłowy stan.
hints.1.text: Porównaj module.north w backup z module.orphan w obecnym state.
hints.2.text: |-
  Przenieś bieżący adres modułu do module.station.
  Zapisz plan binarny i wyeksportuj go przez tofu show -json do wymaganego artefaktu JSON.
phrases.0: Zweryfikowałem backup przed użyciem go jako dowodu odzyskiwania.
phrases.1: Uzgodniłem adresy modułów bez wymiany zasobu.
phrases.2: Zweryfikowałem identity, outputs i pusty końcowy plan.
diagnostics.condition_0: /run/dq/facts/0/safe-state.sha256 musi być niepuste, a sha256(safe-state.json) musi mu
  odpowiadać.
diagnostics.condition_1: safe-state.json resources musi zawierać module.north.local_file.ledger.
diagnostics.condition_2: tofu state list musi być równe module.station.local_file.ledger.
diagnostics.condition_3: /run/dq/facts/0/original-id musi być niepuste, a tofu output -raw ledger_id musi mu odpowiadać.
diagnostics.condition_4: ledger.txt musi być równe north-92.
diagnostics.condition_5: recovery-plan.json resource_changes length musi być równe 1.
diagnostics.condition_6: Każdy wpis w recovery-plan.json resource_changes musi mieć actions ["no-op"].
diagnostics.condition_7: Plan OpenTofu z detailed-exitcode musi zakończyć się kodem 0.
stages.0.objectives.0.text: Plik `safe-state.json` na workstation jest zgodny z `/run/dq/facts/0/safe-state.sha256`
  i zawiera `module.north.local_file.ledger`.
stages.0.objectives.1.text: Stan OpenTofu zawiera dokładnie `module.station.local_file.ledger`.
stages.0.objectives.2.text: Wyjście `ledger_id` jest zgodne z `/run/dq/facts/0/original-id` na workstation.
stages.0.objectives.3.text: Na workstation `ledger.txt` zawiera `north-92`.
stages.0.objectives.4.text: Plik `recovery-plan.json` na workstation zawiera dokładnie jeden wpis zasobu z akcją
  `no-op`.
stages.0.objectives.5.text: OpenTofu nie zgłasza oczekujących zmian infrastruktury.
