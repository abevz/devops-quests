title: Odzyskiwanie modułu
brief: 'W `~/quest` przeczytaj `main.tf`, `modules/ledger/main.tf`, `safe-state.json`, `safe-state.sha256` i `original-id`.
  Bezpieczny eksport stanu opisuje ledger pod adresem `module.north.local_file.ledger`; błędne przeniesienie stanu zmieniło
  go na module.orphan, a konfiguracja wywołuje teraz module.station. Użyj kopii jako mapy i uzgodnij bieżący stan; dostawca
  offline modułu podrzędnego jest już zadeklarowany. Połączony przewodnik przedstawia adresy modułów, a `tofu state mv` zmienia
  adres w stanie.


  Zachowaj `safe-state.json` bez zmian: jego SHA-256 musi odpowiadać `/run/dq/facts/0/safe-state.sha256`, a zasoby JSON muszą
  zawierać `module.north.local_file.ledger`. Zapisz plan binarny i wyeksportuj go przez `tofu show -json` do `recovery-plan.json`,
  a następnie zastosuj. Sprawdź, czy `tofu state list` zawiera dokładnie `module.station.local_file.ledger`, główne wyjście
  `ledger_id` odpowiada `/run/dq/facts/0/original-id`, a `ledger.txt` zawiera `north-92`. Zapisany plan JSON musi zawierać
  dokładnie jedną zmianę zasobu z akcjami `["no-op"]`. Na koniec `tofu plan -input=false -detailed-exitcode -no-color` musi
  zwrócić kod 0 (brak zmian). Kontrola bada kopię, bieżący stan i zapisany JSON; nie dowodzi historii odzyskiwania ani czasu
  zapisu planu. Pracuj tylko w zatoce offline.'
debrief: Suma kopii, bieżący adres stanu, ID i plik ledger oraz zapisany plan odpowiadają wymaganiom odzyskiwania; końcowy
  plan nie zawiera zmian.
stages.0.brief: Kopia, adres stanu, ID i plik ledger, zapisany plan oraz końcowy plan odpowiadają opisowi.
stages.0.objectives.0.text: Kopia, adres stanu, ID i plik ledger, zapisany plan oraz końcowy plan odpowiadają opisowi.
hints.0.text: Kopia zapasowa stanu jest dowodem; przywrócenie całego pliku może odrzucić nowszy prawidłowy stan.
hints.1.text: Porównaj module.north w backup z module.orphan w obecnym state.
hints.2.text: Przenieś bieżący adres modułu do module.station, a następnie sprawdź plan bez zmian zasobów (no-op).
phrases.0: Zweryfikowałem backup przed użyciem go jako dowodu odzyskiwania.
phrases.1: Uzgodniłem adresy modułów bez wymiany zasobu.
phrases.2: Zweryfikowałem identity, outputs i pusty końcowy plan.
diagnostics.condition_0: /run/dq/facts/0/safe-state.sha256 musi być niepuste, a sha256(safe-state.json) musi mu odpowiadać.
diagnostics.condition_1: safe-state.json resources musi zawierać module.north.local_file.ledger.
diagnostics.condition_2: tofu state list musi być równe module.station.local_file.ledger.
diagnostics.condition_3: /run/dq/facts/0/original-id musi być niepuste, a tofu output -raw ledger_id musi mu odpowiadać.
diagnostics.condition_4: ledger.txt musi być równe north-92.
diagnostics.condition_5: recovery-plan.json resource_changes length musi być równe 1.
diagnostics.condition_6: Każdy wpis w recovery-plan.json resource_changes musi mieć actions ["no-op"].
diagnostics.condition_7: Plan OpenTofu z detailed-exitcode musi zakończyć się kodem 0.
