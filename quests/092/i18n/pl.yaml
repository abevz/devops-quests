title: Odzyskiwanie modułów między stanami
brief: |-
  Odzyskiwanie po podziale modułów jest niepełne. Przywróć zadeklarowane moduły w obu głównych konfiguracjach stanu, zachowując ukończoną pracę.

  Pracuj w `~/quest` na stacji roboczej z `main.tf`, `modules/ledger/main.tf`, `safe-state.json`, `infra/main.tf`, `infra/runtime-inputs.json` i `infra/module-contract.json`.

  **Wymagania:**
  - Dostarczona kopia odzyskiwania `~/quest/safe-state.json` na stacji roboczej pozostaje bez zmian.
  - Główny stan OpenTofu zawiera tylko skonfigurowany zasób ledger; główne wyjście `ledger_id` zachowuje pierwotne ID providera, a `~/quest/ledger.txt` na stacji roboczej zawiera `north-92`.
  - Konfiguracja infrastruktury zachowuje nowszy ukończony rekord konserwacji i zarządza pierwotną siecią, wolumenem oraz działającym kontenerem przez dostarczony interfejs modułu. Zachowaj pierwotne rzeczywiste ID, tożsamość utworzenia wolumenu, połączenie z siecią, montowanie i wszystkie bajty pliku wolumenu `/data/ledger` wewnątrz zachowanego kontenera Docker. Zachowaj pierwotne ID providera i ukończone dane input/output rekordu konserwacji.
  - Wyjście `runtime` infrastruktury podaje rzeczywiste `container_id`, `network_id` i `volume_name` opisane w `infra/module-contract.json`.
  - Oba stany zachowują własną pierwotną lineage i serial nie mniejszy niż dostarczony. Zachowaj ich początkowe bieżące migawki w `~/quest/before-recovery.tfstate` i `~/quest/infra/before-recovery.tfstate` na stacji roboczej.
  - Na stacji roboczej `~/quest/recovery-plan.json` zawiera dokładnie jeden pierwotny wpis ledger z akcją `no-op`; `~/quest/infra/recovery-plan.json` obejmuje wszystkie cztery pierwotne zarządzane powiązania z akcjami `no-op`. W planie infrastruktury dozwolone są wpisy data tylko do odczytu.
  - Nowe szczegółowe plany w obu konfiguracjach kończą się kodem `0`.

  Testy obserwują bieżącą zawartość kopii, granice stanów, wyjścia, plany oraz fizyczne tożsamości i dane. Nie potwierdzają nieprzerwanej historii ani czasu zapisania planu lub kopii.
debrief: Odzyskiwanie odtworzyło interfejs modułu i uzgodniło pierwotne powiązania między niezależnymi stanami.
  Zachowano nowszą konserwację, obie lineage oraz pierwotną fizyczną infrastrukturę i dane.
stages.0.brief: Przywróć granice modułów i stanów, zachowując pierwotne obiekty i nowszą ukończoną pracę.
hints.0.text: Pakiet modułu, powiązanie zasobu i granica stanu to różne zagadnienia odzyskiwania. Poprawna stara
  kopia może pomijać pracę ukończoną w nowszym niezależnym stanie.
hints.1.text: Porównaj `cat main.tf infra/main.tf infra/module-contract.json`, `find modules infra -type f`, `tofu
  state list`, `tofu -chdir=infra state pull` i `jq . safe-state.json`. Sprawdź bieżące obiekty Docker i zawartość
  wolumenu. Oddziel lineage, bieżące powiązania i ukończone ID każdego stanu od starszej kopii; użyj `tofu providers
  schema -json` i natywnej pomocy dla interfejsów providera i modułu.
hints.2.text: Odtwórz zadeklarowany interfejs modułu i zachowaj obie bieżące migawki przed zmianą powiązań. Pracuj
  na kopiach starego backupu i bieżącego stanu docelowego; `tofu state mv -state=... -state-out=...` przenosi tylko
  brakujące powiązania modułu bez nadpisywania nowszej pracy celu. Wyślij uzgodniony stan ze zwykłymi zabezpieczeniami
  lineage/serial i popraw skonfigurowany adres głównego stanu. Zapisz i wyeksportuj plan w każdej konfiguracji;
  sprawdź pierwotne ID i wyłącznie zarządzane akcje `no-op` przed zastosowaniem zmian samych wyjść. Następnie sprawdź
  kod `0` obu nowych szczegółowych planów i niezmienione bajty wolumenu.
phrases.0: Zweryfikowałem backup przed użyciem go jako dowodu odzyskiwania.
phrases.1: Uzgodniłem adresy modułów bez wymiany zasobu.
phrases.2: Zweryfikowałem identity, outputs i pusty końcowy plan.
stages.0.objectives.0.text: Dostarczona kopia odzyskiwania `safe-state.json` na workstation pozostaje nienaruszona.
stages.0.objectives.1.text: Stan OpenTofu zawiera tylko skonfigurowany zasób rejestru.
stages.0.objectives.2.text: Wyjście `ledger_id` zachowuje ID zasobu pierwotnie nadany przez dostawcę.
stages.0.objectives.3.text: Na workstation `ledger.txt` zawiera `north-92`.
stages.0.objectives.4.text: Zapisany główny plan zawiera dokładnie jeden pierwotny ledger z `no-op`; plan infrastruktury
  zawiera wszystkie cztery pierwotne zarządzane powiązania z `no-op`.
stages.0.objectives.5.text: Oba stany osiągają zbieżność z zachowanymi lineage, początkowymi migawkami, nowszą tożsamością
  konserwacji oraz pierwotną infrastrukturą i danymi.
diagnostics.condition_0: Przeniesienie stanu bezpośrednio z safe-state.json lub edycja kopii zmienia hash surowych bajtów. Przywróć dostarczoną kopię i pracuj na duplikatach; właściwa suma jest zamrożona, zmiana roboczego checksum nie zatwierdza innych bajtów. [Przyczyna i kontrola](guides#guide=terraform-4&section=module-recovery-untouched-source-backup)
diagnostics.condition_1: Kopia mogła zostać zastąpiona bieżącym stanem po zmianie nazwy modułu. Dostarczone źródło zawiera module.north.local_file.ledger; oddziel je od bieżącego zrzutu root i przenoś powiązania wyłącznie na duplikacie. [Przyczyna i kontrola](guides#guide=terraform-4&section=module-recovery-original-backup-binding)
diagnostics.condition_2: Setup zostawia ledger pod module.orphan, lecz main.tf wywołuje module.station. Przenieś istniejące powiązanie bez zastępowania pliku, a fabric zachowaj w infra; root ma zawierać tylko module.station.local_file.ledger. Błąd CLI lub backendu również zmienia wynik. [Przyczyna i kontrola](guides#guide=terraform-4&section=module-recovery-configured-root-address)
diagnostics.condition_3: Wyjście ledger_id może wskazywać stary moduł, nie istnieć w stanie lub zawierać ID nowego pliku. Napraw powiązanie i wyjście, sprawdź zapisany plan przed zastosowaniem zmian wyjść i zachowaj pierwotny ID; błąd odczytu też nie przejdzie porównania. [Przyczyna i kontrola](guides#guide=terraform-4&section=module-recovery-original-ledger-output)
diagnostics.condition_4: Plik ledger.txt na workstation może zniknąć lub zmienić się po naprawie modułu. Treść odczytana przez shell ma wynosić north-92; to inny plik niż plik zachowanego Docker volume, którego pełne bajty sprawdza osobny warunek. [Przyczyna i kontrola](guides#guide=terraform-4&section=module-recovery-workstation-ledger-content)
diagnostics.condition_5: recovery-plan.json może nie istnieć, być niepoprawny, pochodzić z innego root lub opisywać dodatkowe powiązania. Wyeksportuj zapisany plan głównego root przez tofu show -json i sprawdź dokładnie jeden wpis resource_changes przed tożsamością. [Przyczyna i kontrola](guides#guide=terraform-4&section=module-recovery-root-plan-entry-count)
diagnostics.condition_6: Stary plan lub plan sprzed odzyskania może proponować create, delete albo update. Napraw istniejące powiązanie ledger i konfigurację, następnie zapisz nowy plan główny; każdy wpis resource_changes ma zawierać dokładną listę no-op. Niepoprawny JSON też nie przejdzie. [Przyczyna i kontrola](guides#guide=terraform-4&section=module-recovery-saved-root-no-op)
diagnostics.recovery_plans: Oba plany JSON mogą być czytelne, lecz opisywać nowe ID, złe adresy lub brakujące powiązania. Plan główny zachowuje ledger pod module.station.local_file.ledger; infra obejmuje cztery pierwotne typy zarządzane z no-op, zachowanymi ID i adresami modułu fabric dla Docker. W infra wolno odczytywać wpisy data. [Przyczyna i kontrola](guides#guide=terraform-4&section=module-recovery-saved-plan-original-identities)
diagnostics.condition_7: Plan szczegółowy zwraca 2 przy zmianach albo 1 przy błędzie modułu, dostawcy lub backendu; oba nie spełniają wymaganego 0. Odtwórz pakiet, istniejące powiązania i wyjścia po przejrzeniu planu zamiast zastępować pierwotne obiekty. [Przyczyna i kontrola](guides#guide=terraform-4&section=module-recovery-fresh-root-plan)
diagnostics.recovery_target: Zastąpienie infra całym starszym stanem usuwa nowszy ukończony rekord terraform_data. Scal tylko brakujące powiązania fabric z kopią bieżącego infra; zachowaj cztery pierwotne typy zarządzane, po jednej oryginalnej instancji, input/output progress i dokładne runtime. Błędy odczytu stanu lub wyjścia też dają marker. [Przyczyna i kontrola](guides#guide=terraform-4&section=module-recovery-retained-target-state)
diagnostics.recovery_lineage: Wgranie całego starego stanu do dowolnego root może zastąpić lineage lub cofnąć serial. Zachowaj każdy bieżący root oddzielnie i przenieś tylko potrzebne powiązania; oba serial muszą być całkowite i nie mniejsze od zamrożonych wartości początkowych. [Przyczyna i kontrola](guides#guide=terraform-4&section=module-recovery-independent-lineages-and-serials)
diagnostics.recovery_identity: Odtworzenie kontenera lub volume może dać poprawnie wyglądający plan, lecz utracić tożsamość. Zachowaj ID dostawcy ledger, pierwotny działający kontener, pierwotną sieć i volume w /data wraz z datą utworzenia. Błędy obserwacji Docker też dają marker; sama zmiana ID w stanie nie naprawia zastąpionego obiektu. [Przyczyna i kontrola](guides#guide=terraform-4&section=module-recovery-physical-original-objects)
diagnostics.recovery_data: Plik volume może zniknąć, zostać nadpisany lub pochodzić z innego volume, choć pierwsza linia wygląda poprawnie. Pełne oryginalne bajty obejmują rekord sequence; porównaj SHA-256 /data/ledger w pierwotnym kontenerze. Błąd Docker exec lub odczytu też daje marker. [Przyczyna i kontrola](guides#guide=terraform-4&section=module-recovery-retained-volume-bytes)
diagnostics.recovery_backups: Wymaganych kopii może brakować, mogą pochodzić już z odzyskanego stanu albo być pomylone ze starszą safe-state.json. Zapisz początkowe bieżące root i infra pod zadanymi ścieżkami przed przenoszeniem powiązań. Sprawdzany jest kanoniczny odkodowany JSON, więc same białe znaki nie powodują błędu. [Przyczyna i kontrola](guides#guide=terraform-4&section=module-recovery-initial-current-snapshots)
diagnostics.recovery_convergence: Root infrastruktury po odzyskaniu stanu może nadal proponować zmiany lub nie ładować odtworzonego pakietu/dostawcy. Zapisany JSON no-op nie wystarcza; uruchom świeży szczegółowy plan infra i rozróżnij kod 2 ze zmianami od kodu 1 z błędem obserwacji/konfiguracji. [Przyczyna i kontrola](guides#guide=terraform-4&section=module-recovery-fresh-infra-plan)
diagnostics.probe_0_4: Plan główny przeszedł nazwane kontrole wstępne, ale obserwator Python nie odczytał zamrożonych tożsamości lub planu infra, JSON albo struktury przed nazwanym wynikiem. Sprawdź obie ścieżki eksportu i struktury; wcześniejsze nazwane błędy tłumią ten fallback. [Przyczyna i kontrola](guides#guide=terraform-4&section=module-recovery-saved-plan-observation)
diagnostics.probe_0_5: Początkowy plan root przeszedł, lecz Python mógł zawieść przez brak zamrożonych danych, złą strukturę state/Docker JSON lub nieobsłużony wyjątek końcowego planu infra przed nazwanym wynikiem. Sprawdź wejścia i błędy planu; przechwycone błędy CLI mają recovery-marker, a wcześniejsze markery tłumią fallback. [Przyczyna i kontrola](guides#guide=terraform-4&section=module-recovery-recovery-observation-fallback)
