title: Recuperación del módulo
brief: |
  El registro no está disponible mediante la dirección administrada requerida.

  Trabaja en la workstation en `~/quest` con `main.tf`, `modules/ledger/main.tf`, `safe-state.json`.

  **Requisitos:**
  - Copia de seguridad en la workstation:
    - Ruta: `~/quest/safe-state.json`.
    - Comprobante SHA-256 congelado: `/run/dq/facts/0/safe-state.sha256`.
    - Incluye `module.north.local_file.ledger`.
  - Estado de OpenTofu:
    - Inventario exacto: `module.station.local_file.ledger`.
  - Salidas raíz:
    - Nombre de salida: `ledger_id`.
    - Comprobante correspondiente en la workstation: `/run/dq/facts/0/original-id`.
  - Archivos en la workstation:
    - `~/quest/ledger.txt`: `north-92`.
  - Plan de recuperación guardado en la workstation:
    - Ruta: `~/quest/recovery-plan.json`.
    - Exactamente `1` entrada de recurso con la acción `no-op`.
  - Convergencia de infraestructura:
    - Sin cambios de infraestructura pendientes; código de salida del plan detallado `0`.

  **Verifica antes de Check & finish:**
  - `sha256sum safe-state.json; cat /run/dq/facts/0/safe-state.sha256; jq -r '.resources[] | select(.type=="local_file" and .name=="ledger") | .module + "." + .type + "." + .name' safe-state.json` — Los resúmenes coinciden y la copia contiene `module.north.local_file.ledger`.
  - `tofu output -raw ledger_id; printf '\n'; cat /run/dq/facts/0/original-id; cat ledger.txt; tofu show -no-color` — Los ID coinciden; `ledger.txt` muestra `north-92`; el estado solo contiene `module.station.local_file.ledger`.
  - `jq -r '.resource_changes[] | .address + " " + (.change.actions | join(","))' recovery-plan.json; tofu plan -input=false -detailed-exitcode -no-color` — Exactamente una entrada guardada tiene la acción `no-op`; el plan actual termina con `0`.

  La comprobación examina copia, estado actual y plan guardado; no demuestra la historia de recuperación ni cuándo se guardó el plan.
debrief: La suma de la copia, la dirección de estado actual, el ID y archivo del ledger y el plan guardado coinciden
  con los requisitos de recuperación; el plan final no tiene cambios.
stages.0.brief: El registro debe cumplir el contrato de resultado con su identidad registrada y copia intacta.
hints.0.text: Un respaldo estatal es evidencia; restaurar todo el archivo puede descartar el estado válido más reciente.
hints.1.text: Compare module.north en backup con module.orphan en el estado actual.
hints.2.text: |-
  Mueve la dirección actual del módulo a module.station.
  Guarda el plan binario y expórtalo con tofu show -json al artefacto JSON solicitado.
phrases.0: Verifiqué un backup antes de usarlo como evidencia de recuperación.
phrases.1: Concilié las direcciones de los módulos sin reemplazar el recurso.
phrases.2: Verifiqué identity, outputs y un plan final vacío.
diagnostics.condition_0: /run/dq/facts/0/safe-state.sha256 no debe estar vacío y sha256(safe-state.json) debe ser
  igual a su contenido.
diagnostics.condition_1: safe-state.json resources debe contener module.north.local_file.ledger.
diagnostics.condition_2: tofu state list debe ser igual a module.station.local_file.ledger.
diagnostics.condition_3: /run/dq/facts/0/original-id no debe estar vacío y tofu output -raw ledger_id debe ser igual
  a su contenido.
diagnostics.condition_4: ledger.txt debe ser igual a north-92.
diagnostics.condition_5: recovery-plan.json resource_changes length debe ser igual a 1.
diagnostics.condition_6: Cada entrada de recovery-plan.json resource_changes debe tener actions ["no-op"].
diagnostics.condition_7: El plan de OpenTofu con detailed-exitcode debe terminar con código 0.
stages.0.objectives.0.text: El archivo `safe-state.json` en la workstation coincide con `/run/dq/facts/0/safe-state.sha256`
  y contiene `module.north.local_file.ledger`.
stages.0.objectives.1.text: El estado de OpenTofu contiene exactamente `module.station.local_file.ledger`.
stages.0.objectives.2.text: La salida `ledger_id` coincide con `/run/dq/facts/0/original-id` en la workstation.
stages.0.objectives.3.text: En la workstation, `ledger.txt` contiene `north-92`.
stages.0.objectives.4.text: El archivo `recovery-plan.json` en la workstation registra exactamente una entrada de
  recurso con la acción `no-op`.
stages.0.objectives.5.text: OpenTofu no informa cambios de infraestructura pendientes.
