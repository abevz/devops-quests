title: Recuperación de módulos entre estados
brief: |-
  La recuperación tras dividir módulos está incompleta. Recupera los módulos declarados en ambas raíces de estado conservando el trabajo completado.

  Trabaja en `~/quest` de la estación con `main.tf`, `modules/ledger/main.tf`, `safe-state.json`, `infra/main.tf`, `infra/runtime-inputs.json` e `infra/module-contract.json`.

  **Requisitos:**
  - El backup de recuperación suministrado `~/quest/safe-state.json` de la estación permanece intacto.
  - El estado principal de OpenTofu contiene solo el recurso ledger configurado; la salida raíz `ledger_id` conserva su ID original del proveedor y `~/quest/ledger.txt` de la estación contiene `north-92`.
  - La raíz de infraestructura conserva su registro de mantenimiento completado más reciente y gestiona la red, el volumen y el contenedor en ejecución originales mediante la interfaz de módulo suministrada. Conserva los ID reales originales, la identidad de creación del volumen, la conexión de red, el montaje y todos los bytes del archivo del volumen `/data/ledger` dentro del contenedor Docker conservado. Conserva el ID original del proveedor y los datos input/output completados del registro de mantenimiento.
  - La salida `runtime` del caller de infraestructura informa los valores reales `container_id`, `network_id` y `volume_name` descritos en `infra/module-contract.json`.
  - Ambas raíces conservan su propia lineage original y un serial al menos igual al suministrado. Conserva sus instantáneas actuales iniciales en `~/quest/before-recovery.tfstate` y `~/quest/infra/before-recovery.tfstate` de la estación.
  - En la estación, `~/quest/recovery-plan.json` registra exactamente una entrada ledger original con acción `no-op`; `~/quest/infra/recovery-plan.json` cubre los cuatro vínculos gestionados originales con acciones `no-op`. Se permiten entradas data de solo lectura en el plan de infraestructura.
  - Los nuevos planes detallados de ambas raíces terminan con código `0`.

  Las comprobaciones observan contenidos actuales de backups, límites de estados, salidas, planes e identidades y datos físicos. No prueban un historial ininterrumpido ni cuándo se guardó un plan o backup.
debrief: La recuperación reconstruyó una interfaz de módulo y reconcilió vínculos originales entre estados independientes.
  Se conservaron el mantenimiento más reciente, ambas lineages y la infraestructura física y datos originales.
stages.0.brief: Recupera los límites de módulos y estados conservando objetos originales y trabajo completado más
  reciente.
hints.0.text: El paquete de un módulo, un vínculo de recurso y un límite de estado son aspectos distintos de recuperación.
  Un backup antiguo válido puede omitir trabajo de un estado independiente más reciente.
hints.1.text: Compara `cat main.tf infra/main.tf infra/module-contract.json`, `find modules infra -type f`, `tofu
  state list`, `tofu -chdir=infra state pull` y `jq . safe-state.json`. Inspecciona los objetos Docker actuales
  y el contenido del volumen. Separa lineage, vínculos actuales e ID completados de cada raíz del backup antiguo;
  usa `tofu providers schema -json` y la ayuda nativa para las interfaces del proveedor y módulo.
hints.2.text: Reconstruye la interfaz declarada del módulo y guarda ambas instantáneas actuales antes de cambiar
  vínculos. Trabaja sobre copias del backup antiguo y del estado de destino actual; `tofu state mv -state=... -state-out=...`
  transfiere solo los vínculos de módulo ausentes sin sobrescribir trabajo nuevo del destino. Publica el estado
  reconciliado con las protecciones normales de lineage/serial y corrige la dirección configurada de la raíz principal.
  Guarda y exporta un plan por raíz; inspecciona los ID originales y solo acciones gestionadas `no-op` antes de
  aplicar cambios únicamente de salidas. Después verifica código `0` en ambos planes detallados nuevos y que los
  bytes del volumen no cambiaron.
phrases.0: Verifiqué un backup antes de usarlo como evidencia de recuperación.
phrases.1: Concilié las direcciones de los módulos sin reemplazar el recurso.
phrases.2: Verifiqué identity, outputs y un plan final vacío.
stages.0.objectives.0.text: La copia de recuperación `safe-state.json` suministrada en la workstation permanece
  intacta.
stages.0.objectives.1.text: El estado de OpenTofu contiene solo el recurso ledger configurado.
stages.0.objectives.2.text: La salida `ledger_id` conserva el ID del recurso asignado originalmente por el proveedor.
stages.0.objectives.3.text: En la workstation, `ledger.txt` contiene `north-92`.
stages.0.objectives.4.text: El plan principal guardado registra exactamente un ledger original con `no-op`; el plan
  de infraestructura registra los cuatro vínculos gestionados originales con `no-op`.
stages.0.objectives.5.text: Ambas raíces convergen conservando lineages, instantáneas iniciales, la identidad de
  mantenimiento más reciente y la infraestructura y datos originales.
diagnostics.condition_0: Mover estado directamente desde safe-state.json o editar la copia cambia su hash de bytes. Recupere la copia suministrada y trabaje con duplicados; la suma autorizada está congelada y cambiar el checksum de trabajo no permite otros bytes. [Causa y comprobación](guides#guide=terraform-4&section=module-recovery-untouched-source-backup)
diagnostics.condition_1: La copia puede haberse sustituido por un estado actual tras renombrar el módulo. La fuente suministrada contiene module.north.local_file.ledger; sepárela del estado root actual y mueva vínculos solo en un duplicado. [Causa y comprobación](guides#guide=terraform-4&section=module-recovery-original-backup-binding)
diagnostics.condition_2: Setup deja ledger en module.orphan aunque main.tf llama module.station. Mueva el vínculo existente sin sustituir el archivo y conserve fabric en infra; root debe listar solo module.station.local_file.ledger. Un fallo CLI o backend también altera la comparación. [Causa y comprobación](guides#guide=terraform-4&section=module-recovery-configured-root-address)
diagnostics.condition_3: La salida ledger_id puede apuntar al módulo antiguo, faltar en estado o contener el ID de un archivo nuevo. Repare vínculo y salida, inspeccione el plan guardado antes de aplicar cambios de salidas y conserve el ID original; un error de lectura también falla. [Causa y comprobación](guides#guide=terraform-4&section=module-recovery-original-ledger-output)
diagnostics.condition_4: ledger.txt en workstation puede faltar o cambiar tras reparar el módulo. Su contenido leído por shell debe ser north-92; es distinto del archivo del Docker volume conservado, cuyos bytes completos se verifican por separado. [Causa y comprobación](guides#guide=terraform-4&section=module-recovery-workstation-ledger-content)
diagnostics.condition_5: recovery-plan.json puede faltar, ser inválido, proceder de otra raíz o describir vínculos extra. Exporte el plan guardado de root con tofu show -json y compruebe exactamente una entrada resource_changes antes de verificar su identidad. [Causa y comprobación](guides#guide=terraform-4&section=module-recovery-root-plan-entry-count)
diagnostics.condition_6: Un plan antiguo o previo a recuperación puede proponer create, delete o update. Repare vínculo existente de ledger y configuración, y regenere el plan guardado; cada entrada resource_changes debe indicar la lista exacta no-op. JSON inválido también falla. [Causa y comprobación](guides#guide=terraform-4&section=module-recovery-saved-root-no-op)
diagnostics.recovery_plans: Ambos planes JSON pueden leerse pero describir IDs nuevos, direcciones incorrectas o vínculos ausentes. El principal conserva ledger en module.station.local_file.ledger; infra cubre cuatro tipos gestionados originales con no-op, IDs retenidos y direcciones fabric para Docker. Se permiten entradas data de solo lectura en infra. [Causa y comprobación](guides#guide=terraform-4&section=module-recovery-saved-plan-original-identities)
diagnostics.condition_7: El plan detallado devuelve 2 por cambios pendientes o 1 por error de módulo, proveedor o backend; ambos incumplen el 0 requerido. Reconstruya paquete, vínculos existentes y salidas tras revisar el plan sin sustituir objetos originales. [Causa y comprobación](guides#guide=terraform-4&section=module-recovery-fresh-root-plan)
diagnostics.recovery_target: Sustituir infra por toda la copia antigua pierde el registro terraform_data posterior ya completado. Combine solo vínculos fabric ausentes con una copia del estado infra actual; conserve cuatro tipos gestionados originales, una instancia original por tipo, input/output de progress y salida runtime exacta. Errores de lectura también dan este marcador. [Causa y comprobación](guides#guide=terraform-4&section=module-recovery-retained-target-state)
diagnostics.recovery_lineage: Publicar un estado antiguo completo puede sustituir lineage o retroceder serial en cualquier raíz. Conserve cada raíz actual por separado y transfiera solo vínculos necesarios; ambos serial deben ser enteros no inferiores a los valores iniciales congelados. [Causa y comprobación](guides#guide=terraform-4&section=module-recovery-independent-lineages-and-serials)
diagnostics.recovery_identity: Recrear contenedor o volume puede producir un plan aparentemente válido perdiendo identidad. Conserve el ID de proveedor de ledger, contenedor original activo, conexión a la red original y volume en /data con su fecha de creación. Errores de observación Docker también dan este marcador; cambiar un ID de estado no repara un objeto sustituido. [Causa y comprobación](guides#guide=terraform-4&section=module-recovery-physical-original-objects)
diagnostics.recovery_data: El archivo puede faltar, reescribirse o venir de otro volume aunque su primera línea parezca correcta. Sus bytes originales completos incluyen el registro sequence; compare SHA-256 de /data/ledger dentro del contenedor original. Fallos de Docker exec o lectura también dan este marcador. [Causa y comprobación](guides#guide=terraform-4&section=module-recovery-retained-volume-bytes)
diagnostics.recovery_backups: Las copias pueden faltar, guardarse después de recuperación o confundirse con safe-state.json antiguo. Conserve los estados actuales iniciales de root e infra en las rutas indicadas antes de mover vínculos. Se compara JSON decodificado canónico, por lo que cambiar solo espacios no falla. [Causa y comprobación](guides#guide=terraform-4&section=module-recovery-initial-current-snapshots)
diagnostics.recovery_convergence: Infra puede seguir proponiendo cambios tras recuperar estado o no cargar el paquete/proveedor reconstruido. Un JSON no-op guardado no basta; ejecute un plan infra detallado nuevo y distinga código 2 por cambios de código 1 por error de observación o configuración. [Causa y comprobación](guides#guide=terraform-4&section=module-recovery-fresh-infra-plan)
diagnostics.probe_0_4: El plan principal pasó controles iniciales nombrados, pero Python no pudo leer identidades congeladas o el plan infra, decodificar JSON o manejar su estructura antes de un resultado nombrado. Revise ambas rutas y estructuras; errores nombrados anteriores suprimen este fallback. [Causa y comprobación](guides#guide=terraform-4&section=module-recovery-saved-plan-observation)
diagnostics.probe_0_5: El plan root inicial pasó, pero Python puede fallar por entradas congeladas ausentes, estructura state/Docker inesperada o excepción no capturada del plan infra final antes de nombrar resultado. Revise entradas y errores; fallos CLI capturados ya usan recovery-marker y marcadores previos suprimen este fallback. [Causa y comprobación](guides#guide=terraform-4&section=module-recovery-recovery-observation-fallback)
