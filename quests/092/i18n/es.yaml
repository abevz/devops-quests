title: Recuperación del módulo
brief: 'Una exportación de estado seguro asigna module.north al ledger existente. Un estado erróneo move
  luego le cambió el nombre a module.orphan; la nueva configuración lo llama module.station. Verifique
  el backup checksum, compare direcciones y concilie el mapa de estado actual sin reemplazar el ledger
  ni actualizar todo el estado anterior. Guarde recovery-plan.json antes de aplicar el plan revisado.
  Utilice únicamente el offline local provider.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `main.tf`, `modules/ledger/main.tf`,
  `safe-state.json`, `safe-state.sha256`, `original-id`, `recovery-plan.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: se recuperan el mapa del módulo y el outputs, el ledger ID original y
  el contenido se conservan, el backup no se modifica y el plan final está vacío.'
debrief: La recuperación utilizó la copia de seguridad verificada como un mapa en lugar de sobrescribir
  el estado actual al por mayor.
stages.0.brief: 'Criterios de éxito: se recuperan el mapa del módulo y outputs, el ledger ID original
  y el contenido se conservan, el backup no se modifica y el plan final está vacío.'
stages.0.objectives.0.text: Se recuperan el mapa del módulo y outputs, el ledger ID original y el contenido
  se conservan, el backup no se modifica y el plan final está vacío.
hints.0.text: Un respaldo estatal es evidencia; restaurar todo el archivo puede descartar el estado válido
  más reciente.
hints.1.text: Compare module.north en backup con module.orphan en el estado actual.
hints.2.text: Mueva la dirección del módulo actual a module.station, luego a inspect un recurso no operativo
  plan.
phrases.0: Verifiqué un backup antes de usarlo como evidencia de recuperación.
phrases.1: Concilié las direcciones de los módulos sin reemplazar el recurso.
phrases.2: Verifiqué identity, outputs y un plan final vacío.
