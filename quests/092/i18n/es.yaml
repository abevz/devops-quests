title: Recuperación de módulos entre estados
brief: |-
  La recuperación tras dividir módulos está incompleta. Recupera los módulos declarados en ambas raíces de estado conservando el trabajo completado.

  Trabaja en `~/quest` de la estación con `main.tf`, `modules/ledger/main.tf`, `safe-state.json`, `infra/main.tf`, `infra/runtime-inputs.json` e `infra/module-contract.json`.

  **Requisitos:**
  - El backup de recuperación suministrado `~/quest/safe-state.json` de la estación permanece intacto.
  - El estado principal de OpenTofu contiene solo el recurso ledger configurado; la salida raíz `ledger_id` conserva su ID original del proveedor y `~/quest/ledger.txt` de la estación contiene `north-92`.
  - La raíz de infraestructura conserva su registro de mantenimiento completado más reciente y gestiona la red, el volumen y el contenedor en ejecución originales mediante la interfaz de módulo suministrada. Conserva los ID reales originales, la identidad de creación del volumen, la conexión de red, el montaje y todos los bytes del archivo del volumen `/data/ledger` dentro del contenedor Docker conservado. Conserva el ID original del proveedor y los datos input/output completados del registro de mantenimiento.
  - La salida `runtime` del caller de infraestructura informa los valores reales `container_id`, `network_id` y `volume_name` descritos en `infra/module-contract.json`.
  - Ambas raíces conservan su propia lineage original y un serial al menos igual al suministrado. Conserva sus instantáneas actuales iniciales en `~/quest/before-recovery.tfstate` y `~/quest/infra/before-recovery.tfstate` de la estación.
  - En la estación, `~/quest/recovery-plan.json` registra exactamente una entrada ledger original con acción `no-op`; `~/quest/infra/recovery-plan.json` cubre los cuatro vínculos gestionados originales con acciones `no-op`. Se permiten entradas data de solo lectura en el plan de infraestructura.
  - Los nuevos planes detallados de ambas raíces terminan con código `0`.

  Las comprobaciones observan contenidos actuales de backups, límites de estados, salidas, planes e identidades y datos físicos. No prueban un historial ininterrumpido ni cuándo se guardó un plan o backup.
debrief: La recuperación reconstruyó una interfaz de módulo y reconcilió vínculos originales entre estados independientes.
  Se conservaron el mantenimiento más reciente, ambas lineages y la infraestructura física y datos originales.
stages.0.brief: Recupera los límites de módulos y estados conservando objetos originales y trabajo completado más
  reciente.
hints.0.text: El paquete de un módulo, un vínculo de recurso y un límite de estado son aspectos distintos de recuperación.
  Un backup antiguo válido puede omitir trabajo de un estado independiente más reciente.
hints.1.text: Compara `cat main.tf infra/main.tf infra/module-contract.json`, `find modules infra -type f`, `tofu
  state list`, `tofu -chdir=infra state pull` y `jq . safe-state.json`. Inspecciona los objetos Docker actuales
  y el contenido del volumen. Separa lineage, vínculos actuales e ID completados de cada raíz del backup antiguo;
  usa `tofu providers schema -json` y la ayuda nativa para las interfaces del proveedor y módulo.
hints.2.text: Reconstruye la interfaz declarada del módulo y guarda ambas instantáneas actuales antes de cambiar
  vínculos. Trabaja sobre copias del backup antiguo y del estado de destino actual; `tofu state mv -state=... -state-out=...`
  transfiere solo los vínculos de módulo ausentes sin sobrescribir trabajo nuevo del destino. Publica el estado
  reconciliado con las protecciones normales de lineage/serial y corrige la dirección configurada de la raíz principal.
  Guarda y exporta un plan por raíz; inspecciona los ID originales y solo acciones gestionadas `no-op` antes de
  aplicar cambios únicamente de salidas. Después verifica código `0` en ambos planes detallados nuevos y que los
  bytes del volumen no cambiaron.
phrases.0: Verifiqué un backup antes de usarlo como evidencia de recuperación.
phrases.1: Concilié las direcciones de los módulos sin reemplazar el recurso.
phrases.2: Verifiqué identity, outputs y un plan final vacío.
diagnostics.condition_0: /run/dq/facts/0/safe-state.sha256 no debe estar vacío y sha256(safe-state.json) debe ser
  igual a su contenido.
diagnostics.condition_1: safe-state.json resources debe contener module.north.local_file.ledger.
diagnostics.condition_2: tofu state list debe ser igual a module.station.local_file.ledger.
diagnostics.condition_3: /run/dq/facts/0/original-id no debe estar vacío y tofu output -raw ledger_id debe ser igual
  a su contenido.
diagnostics.condition_4: ledger.txt debe ser igual a north-92.
diagnostics.condition_5: recovery-plan.json resource_changes length debe ser igual a 1.
diagnostics.condition_6: Cada entrada de recovery-plan.json resource_changes debe tener actions ["no-op"].
diagnostics.condition_7: El plan de OpenTofu con detailed-exitcode debe terminar con código 0.
stages.0.objectives.0.text: La copia de recuperación `safe-state.json` suministrada en la workstation permanece
  intacta.
stages.0.objectives.1.text: El estado de OpenTofu contiene solo el recurso ledger configurado.
stages.0.objectives.2.text: La salida `ledger_id` conserva el ID del recurso asignado originalmente por el proveedor.
stages.0.objectives.3.text: En la workstation, `ledger.txt` contiene `north-92`.
stages.0.objectives.4.text: El plan principal guardado registra exactamente un ledger original con `no-op`; el plan
  de infraestructura registra los cuatro vínculos gestionados originales con `no-op`.
stages.0.objectives.5.text: Ambas raíces convergen conservando lineages, instantáneas iniciales, la identidad de
  mantenimiento más reciente y la infraestructura y datos originales.
diagnostics.recovery_plans: Ambos planes guardados deben cubrir sus vínculos gestionados originales actuales con
  no-op e ID originales.
diagnostics.recovery_target: El estado de infraestructura y la interfaz runtime deben conservar los recursos originales
  del módulo y el registro de mantenimiento nuevo real.
diagnostics.recovery_identity: Conserva el ID original del ledger del proveedor, los ID reales Docker, la red conectada
  y la identidad de creación del volumen montado original.
diagnostics.recovery_lineage: Conserva la lineage original de cada estado sin retroceder su serial.
diagnostics.recovery_data: Conserva cada byte original del archivo /data/ledger del volumen retenido.
diagnostics.recovery_backups: Conserva cada instantánea actual inicial como before-recovery.tfstate e infra/before-recovery.tfstate.
diagnostics.recovery_convergence: La raíz de infraestructura también debe devolver código 0 en un nuevo plan detallado.
diagnostics.probe_0_4: El plan principal guardado registra exactamente un ledger original con `no-op`; el plan de
  infraestructura registra los cuatro vínculos gestionados originales con `no-op`.
diagnostics.probe_0_5: Ambas raíces convergen conservando lineages, instantáneas iniciales, la identidad de mantenimiento
  más reciente y la infraestructura y datos originales.
