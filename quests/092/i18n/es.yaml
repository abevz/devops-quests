title: Recuperación del módulo
brief: 'En `~/quest`, lee `main.tf`, `modules/ledger/main.tf`, `safe-state.json`, `safe-state.sha256` y `original-id`. Una
  exportación segura del estado describe el ledger en `module.north.local_file.ledger`; un movimiento erróneo lo renombró
  a module.orphan, mientras que la configuración ahora lo llama module.station. Usa la copia como mapa y reconcilia el estado
  actual; el proveedor hijo sin conexión ya está declarado. La guía enlazada introduce las direcciones de módulos y `tofu
  state mv` cambia una dirección en el estado.


  Mantén `safe-state.json` sin cambios: su SHA-256 debe coincidir con `/run/dq/facts/0/safe-state.sha256`, y sus recursos
  JSON deben incluir `module.north.local_file.ledger`. Guarda un plan binario y expórtalo con `tofu show -json` a `recovery-plan.json`,
  luego aplícalo. Comprueba que `tofu state list` contiene exactamente `module.station.local_file.ledger`, la salida raíz
  `ledger_id` coincide con `/run/dq/facts/0/original-id` y `ledger.txt` contiene `north-92`. El plan JSON guardado debe contener
  exactamente un cambio de recurso con acciones `["no-op"]`. Finalmente, `tofu plan -input=false -detailed-exitcode -no-color`
  debe terminar con código 0 (sin cambios). La comprobación inspecciona la copia, el estado actual y el JSON guardado; no
  demuestra la historia de la recuperación ni cuándo se guardó el plan. Trabaja solo en la bahía sin conexión.'
debrief: La suma de la copia, la dirección de estado actual, el ID y archivo del ledger y el plan guardado coinciden con los
  requisitos de recuperación; el plan final no tiene cambios.
stages.0.brief: La copia, dirección de estado, ID y archivo del ledger, plan guardado y plan final coinciden con el enunciado.
stages.0.objectives.0.text: La copia, dirección de estado, ID y archivo del ledger, plan guardado y plan final coinciden con
  el enunciado.
hints.0.text: Un respaldo estatal es evidencia; restaurar todo el archivo puede descartar el estado válido más reciente.
hints.1.text: Compare module.north en backup con module.orphan en el estado actual.
hints.2.text: Mueva la dirección del módulo actual a module.station, luego a inspect un recurso no operativo plan.
phrases.0: Verifiqué un backup antes de usarlo como evidencia de recuperación.
phrases.1: Concilié las direcciones de los módulos sin reemplazar el recurso.
phrases.2: Verifiqué identity, outputs y un plan final vacío.
diagnostics.condition_0: /run/dq/facts/0/safe-state.sha256 no debe estar vacío y sha256(safe-state.json) debe ser igual a
  su contenido.
diagnostics.condition_1: safe-state.json resources debe contener module.north.local_file.ledger.
diagnostics.condition_2: tofu state list debe ser igual a module.station.local_file.ledger.
diagnostics.condition_3: /run/dq/facts/0/original-id no debe estar vacío y tofu output -raw ledger_id debe ser igual a su
  contenido.
diagnostics.condition_4: ledger.txt debe ser igual a north-92.
diagnostics.condition_5: recovery-plan.json resource_changes length debe ser igual a 1.
diagnostics.condition_6: Cada entrada de recovery-plan.json resource_changes debe tener actions ["no-op"].
diagnostics.condition_7: El plan de OpenTofu con detailed-exitcode debe terminar con código 0.
