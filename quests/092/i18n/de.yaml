title: Modulwiederherstellung über State-Grenzen
brief: |-
  Die Wiederherstellung nach einer Modulaufteilung ist unvollständig. Stelle die deklarierten Module in beiden State-Roots wieder her und erhalte abgeschlossene Arbeit.

  Arbeite auf der Workstation in `~/quest` mit `main.tf`, `modules/ledger/main.tf`, `safe-state.json`, `infra/main.tf`, `infra/runtime-inputs.json` und `infra/module-contract.json`.

  **Anforderungen:**
  - Das bereitgestellte Wiederherstellungsbackup `~/quest/safe-state.json` auf der Workstation bleibt unverändert.
  - Der Haupt-State von OpenTofu enthält nur die konfigurierte Ledger-Ressource; Root-Ausgabe `ledger_id` behält ihre ursprüngliche Provider-ID, und `~/quest/ledger.txt` auf der Workstation enthält `north-92`.
  - Der Infrastruktur-Root behält seinen neueren abgeschlossenen Wartungseintrag und verwaltet ursprüngliches Netzwerk, Volume und laufenden Container über die bereitgestellte Modulschnittstelle. Erhalte ursprüngliche Live-IDs, Volume-Erstellungsidentität, Netzwerkanbindung, Volume-Mount und alle Bytes der Volume-Datei `/data/ledger` im beibehaltenen Docker-Container. Erhalte die ursprüngliche Provider-ID und die abgeschlossenen input/output-Daten des Wartungseintrags.
  - Die Ausgabe `runtime` des Infrastruktur-Callers meldet die tatsächlichen `container_id`, `network_id` und `volume_name` gemäß `infra/module-contract.json`.
  - Beide State-Roots behalten ihre jeweilige ursprüngliche Lineage und mindestens die bereitgestellte Serial. Bewahre ihre ursprünglichen aktuellen Snapshots unter `~/quest/before-recovery.tfstate` und `~/quest/infra/before-recovery.tfstate` auf der Workstation auf.
  - Auf der Workstation enthält `~/quest/recovery-plan.json` genau einen ursprünglichen Ledger-Eintrag mit Aktion `no-op`; `~/quest/infra/recovery-plan.json` deckt alle vier ursprünglichen verwalteten Bindungen mit Aktionen `no-op` ab. Schreibgeschützte Data-Einträge im Infrastrukturplan sind erlaubt.
  - Neue detaillierte Pläne in beiden Roots enden mit Code `0`.

  Die Prüfungen beobachten aktuelle Backup-Inhalte, State-Grenzen, Ausgaben, Pläne und physische Identitäten/Daten. Sie beweisen weder lückenlose Historie noch den Speicherzeitpunkt eines Plans oder Backups.
debrief: Die Wiederherstellung rekonstruierte eine Modulschnittstelle und glich ursprüngliche Bindungen zwischen
  unabhängigen States ab. Neuere Wartungsarbeit, beide Lineages und ursprüngliche physische Infrastruktur/Daten
  blieben erhalten.
stages.0.brief: Stelle Modul- und State-Grenzen wieder her und erhalte ursprüngliche Objekte sowie neuere abgeschlossene
  Arbeit.
hints.0.text: Modulpaket, Ressourcenbindung und State-Grenze sind unterschiedliche Wiederherstellungsfragen. Ein
  gültiges altes Backup kann Arbeit aus einem neueren unabhängigen State auslassen.
hints.1.text: |-
  Vergleiche `cat main.tf infra/main.tf infra/module-contract.json`, `find modules infra -type f`, `tofu state list`, `tofu -chdir=infra state pull` und `jq . safe-state.json`. Untersuche aktuelle Docker-Objekte und Volume-Inhalte. Trenne Lineage, aktuelle Bindungen und abgeschlossene IDs jedes Roots vom älteren Backup; verwende `tofu providers schema -json` und native Hilfe für die Provider-/Modulschnittstellen.

  Verfolge die erwartete Aufrufschnittstelle in infra und vergleiche die gebundenen Modul-Adressen mit der alten Sicherung. Prüfe pro Root die ursprünglichen Provider-IDs, Lineage und Serial im aktuellen Zustand.
hints.2.text: |-
  Exportiere nach dem Abgleich der Bindungen und vor Anwendung der Ausgabeänderungen beide Pläne, falls die JSON-Nachweise fehlen. Die Befehle erhalten vorhandene Nachweise und speichern Pläne ohne Änderungen verwalteter Ressourcen.

  ```sh
  for root in . infra; do
    (
      set -euo pipefail
      expected=1
      if test "$root" = infra; then expected=4; fi
      cd "$root"
      test -s recovery-plan.json && exit 0
      tmp=$(mktemp -d)
      trap 'rm -rf -- "$tmp"' EXIT
      tofu plan -input=false -no-color -out="$tmp/recovery.plan"
      tofu show -json "$tmp/recovery.plan" > "$tmp/recovery.json"
      jq -e --argjson expected "$expected" '
        ([.resource_changes[] | select(.mode=="managed")] | length)==$expected
        and all(.resource_changes[];
        if .mode=="managed" then .change.actions==["no-op"]
        else .mode=="data" and (.change.actions==["read"] or .change.actions==["no-op"]) end)' \
        "$tmp/recovery.json" >/dev/null
      set -o noclobber
      cat "$tmp/recovery.json" > recovery-plan.json
    )
  done
  ```

  Speichere und exportiere in jedem Root einen Plan; prüfe ursprüngliche IDs und ausschließlich `no-op` für verwaltete Ressourcen, bevor reine Ausgabeänderungen angewendet werden. Prüfe danach Exit `0` beider neuen detaillierten Pläne und unveränderte Volume-Bytes.

  Vergleiche jeden gespeicherten Snapshot mit dem Anfangszustand im zugehörigen Root. Der Hauptplan muss einen verwalteten ledger-Eintrag mit `no-op` enthalten, der Infrastrukturplan vier beibehaltene verwaltete Einträge mit `no-op`. Lesende Dateneinträge sind erlaubt. Vergleiche Runtime-IDs und Datei-Prüfsumme des Volumes mit den ursprünglichen Beobachtungen.

  ```sh
  (
    set -euo pipefail
    ref=/run/dq/facts/0/recovery-identities.json
    test "$(sha256sum safe-state.json | cut -d ' ' -f1)" = "$(cat /run/dq/facts/0/safe-state.sha256)"
    python3 -I - <<'VERIFY_BACKUPS'
  import hashlib, json
  from pathlib import Path
  reference = json.loads(Path('/run/dq/facts/0/recovery-identities.json').read_text())
  for key, name in (('root', 'before-recovery.tfstate'), ('infra', 'infra/before-recovery.tfstate')):
      backup = json.loads(Path(name).read_text())
      canonical = json.dumps(backup, sort_keys=True, separators=(',', ':')).encode()
      assert hashlib.sha256(canonical).hexdigest() == reference[key + '_backup_sha256']
  VERIFY_BACKUPS
    jq -c '{file:input_filename,changes:[.resource_changes[] | {address,mode,actions:.change.actions,before_id:.change.before.id,after_id:.change.after.id}]}' \
      recovery-plan.json infra/recovery-plan.json
    test "$(tofu output -raw ledger_id)" = "$(cat /run/dq/facts/0/original-id)"
    cat ledger.txt
    tofu -chdir=infra output -json runtime | jq -e --slurpfile ref "$ref" '
      . == ($ref[0] | {container_id,network_id,volume_name})'
    container=$(jq -er .container_id "$ref")
    volume=$(jq -er .volume_name "$ref")
    docker inspect "$container" | jq -e --slurpfile ref "$ref" '
      $ref[0] as $want | .[0] | .Id==$want.container_id and .State.Running==true
      and any(.NetworkSettings.Networks[]; .NetworkID==$want.network_id)
      and any(.Mounts[]; .Type=="volume" and .Name==$want.volume_name and .Destination=="/data")'
    docker volume inspect "$volume" | jq -e --slurpfile ref "$ref" '.[0].CreatedAt==$ref[0].volume_created_at'
    digest=$(docker exec "$container" cat /data/ledger | sha256sum | cut -d ' ' -f1)
    test "$digest" = "$(jq -er .data_sha256 "$ref")"
    tofu plan -input=false -detailed-exitcode -no-color
    tofu -chdir=infra plan -input=false -detailed-exitcode -no-color
  )
  ```
phrases.0: Ich habe einen backup verifiziert, bevor ich ihn als Wiederherstellungsbeweis verwendet habe.
phrases.1: Ich habe die Moduladressen abgeglichen, ohne die Ressource zu ersetzen.
phrases.2: Ich habe identity, outputs und einen leeren endgültigen plan überprüft.
stages.0.objectives.0.text: Die bereitgestellte Workstation-Wiederherstellungssicherung `safe-state.json` bleibt
  unverändert.
stages.0.objectives.1.text: Der OpenTofu-State enthält nur die konfigurierte Ledger-Ressource.
stages.0.objectives.2.text: Die Ausgabe `ledger_id` behält die ursprünglich vom Provider vergebene Ressourcen-ID
  bei.
stages.0.objectives.3.text: 'Auf der Workstation: `ledger.txt` enthält `north-92`.'
stages.0.objectives.4.text: Der gespeicherte Hauptplan enthält genau ein ursprüngliches Ledger mit `no-op`; der
  Infrastrukturplan enthält alle vier ursprünglichen verwalteten Bindungen mit `no-op`.
stages.0.objectives.5.text: Beide State-Roots konvergieren mit erhaltenen Lineages, ursprünglichen Snapshots, neuerer
  Wartungsidentität sowie ursprünglicher Infrastruktur und Daten.
diagnostics.condition_0: Eine Zustandsverschiebung direkt aus safe-state.json oder eine Bearbeitung verändert den Hash der Originalbytes. Stellen Sie die gelieferte Kopie wieder her und arbeiten Sie mit Duplikaten; eine geänderte Arbeitsprüfsumme erlaubt keine anderen Bytes. [Ursache und Prüfung](guides#guide=terraform-4&section=module-recovery-untouched-source-backup)
diagnostics.condition_1: Die Kopie wurde möglicherweise nach der Modulumbenennung durch einen aktuellen Snapshot ersetzt. Die gelieferte Quelle enthält module.north.local_file.ledger; halten Sie sie vom aktuellen Root-Snapshot getrennt und verschieben Sie Bindungen nur in einem Duplikat. [Ursache und Prüfung](guides#guide=terraform-4&section=module-recovery-original-backup-binding)
diagnostics.condition_2: Setup lässt ledger unter module.orphan, main.tf verwendet jedoch module.station. Verschieben Sie die vorhandene Bindung ohne Dateiersatz zur konfigurierten Adresse und halten Sie fabric in infra; Root darf nur module.station.local_file.ledger auflisten. Auch CLI- oder Backendfehler verletzen den Vergleich. [Ursache und Prüfung](guides#guide=terraform-4&section=module-recovery-configured-root-address)
diagnostics.condition_3: ledger_id verweist möglicherweise auf ein altes Modul, fehlt im Zustand oder enthält die ID einer neu erstellten Datei. Reparieren Sie Bindung und Ausgabe, prüfen Sie den gespeicherten Plan vor Ausgabeänderungen und erhalten Sie die ursprüngliche ID; auch Lesefehler scheitern am Vergleich. [Ursache und Prüfung](guides#guide=terraform-4&section=module-recovery-original-ledger-output)
diagnostics.condition_4: ledger.txt auf der Workstation fehlt möglicherweise oder wurde nach der Modulreparatur geändert. Der per Shell gelesene Inhalt muss north-92 sein; die vollständigen Bytes der separaten Datei im erhaltenen Docker-Volume prüft eine andere Bedingung. [Ursache und Prüfung](guides#guide=terraform-4&section=module-recovery-workstation-ledger-content)
diagnostics.condition_5: recovery-plan.json fehlt möglicherweise, ist ungültig, stammt aus dem falschen Root oder enthält zusätzliche Bindungen. Exportieren Sie den gespeicherten Hauptplan mit tofu show -json und prüfen Sie vor der Identität genau einen resource_changes-Eintrag. [Ursache und Prüfung](guides#guide=terraform-4&section=module-recovery-root-plan-entry-count)
diagnostics.condition_6: "Ein veralteter Plan kann weiterhin create, delete oder update vorschlagen. Reparieren Sie Ledger-Bindung und Konfiguration und speichern Sie den Hauptplan neu; jeder resource_changes-Eintrag muss die exakte Aktionsliste no-op haben. Auch ungültiges JSON scheitert. [Ursache und Prüfung](guides#guide=terraform-4&section=module-recovery-saved-root-no-op)"
diagnostics.recovery_plans: Beide JSON-Pläne sind möglicherweise lesbar, beschreiben aber neue IDs, falsche Moduladressen oder fehlende Bindungen. Der Hauptplan erhält ledger unter module.station.local_file.ledger; infra umfasst alle vier ursprünglichen verwalteten Typen mit no-op, erhaltenen IDs und fabric-Adressen für Docker. Lesende data-Einträge sind in infra zulässig. [Ursache und Prüfung](guides#guide=terraform-4&section=module-recovery-saved-plan-original-identities)
diagnostics.condition_7: Ein detaillierter Plan liefert 2 bei Änderungen oder 1 bei Modul-, Provider- oder Backendfehlern; beide scheitern am geforderten 0. Stellen Sie Paket, vorhandene Bindungen und Ausgaben nach Planprüfung wieder her, statt Originalobjekte zu ersetzen. [Ursache und Prüfung](guides#guide=terraform-4&section=module-recovery-fresh-root-plan)
diagnostics.recovery_target: Der vollständige ältere Zustand verliert im infra-Root den neueren abgeschlossenen terraform_data-Datensatz. Ergänzen Sie nur fehlende fabric-Bindungen in einer Kopie des aktuellen infra-Zustands; erhalten Sie vier ursprüngliche verwaltete Typen, je eine Originalinstanz, progress input/output und die exakte runtime-Ausgabe. Auch Lesefehler melden diesen Marker. [Ursache und Prüfung](guides#guide=terraform-4&section=module-recovery-retained-target-state)
diagnostics.recovery_lineage: Ein vollständiger alter Zustand kann in jedem Root die Lineage ersetzen oder die Seriennummer zurücksetzen. Erhalten Sie beide aktuellen Roots getrennt und übertragen Sie nur nötige Bindungen; beide Seriennummern müssen ganzzahlig und mindestens so hoch wie ihre eingefrorenen Anfangswerte sein. [Ursache und Prüfung](guides#guide=terraform-4&section=module-recovery-independent-lineages-and-serials)
diagnostics.recovery_identity: Ein neu erstellter Container oder ein neues Volume kann trotz plausiblen Plans die Originalidentität verlieren. Erhalten Sie Ledger-Provider-ID, laufenden Originalcontainer, ursprünglichen Netzanschluss und Volume unter /data samt aufgezeichneter Erstellungszeit. Auch Docker-Lesefehler nutzen diesen Marker; eine geänderte Zustands-ID repariert kein ersetztes Objekt. [Ursache und Prüfung](guides#guide=terraform-4&section=module-recovery-physical-original-objects)
diagnostics.recovery_data: Die Datei kann fehlen, überschrieben sein oder trotz korrekter erster Zeile aus einem anderen Volume stammen. Zu den vollständigen Originalbytes gehört der sequence-Datensatz; vergleichen Sie SHA-256 von /data/ledger im Originalcontainer. Auch Docker-exec- oder Lesefehler melden diesen Marker. [Ursache und Prüfung](guides#guide=terraform-4&section=module-recovery-retained-volume-bytes)
diagnostics.recovery_backups: Die Snapshots fehlen möglicherweise, wurden erst nach der Wiederherstellung gespeichert oder mit safe-state.json verwechselt. Erhalten Sie vor Bindungsverschiebungen beide anfänglichen aktuellen Zustände unter den vorgesehenen Pfaden. Dieser Vergleich verwendet kanonisches dekodiertes JSON; reine Leerraumänderungen scheitern daher nicht. [Ursache und Prüfung](guides#guide=terraform-4&section=module-recovery-initial-current-snapshots)
diagnostics.recovery_convergence: "Der Infrastruktur-Root schlägt nach der Zustandsreparatur möglicherweise Änderungen vor oder lädt Paket beziehungsweise Provider nicht. Gespeichertes JSON mit no-op allein genügt nicht; prüfen Sie einen frischen detaillierten infra-Plan und unterscheiden Sie Code 2 für Änderungen von Code 1 für Beobachtungs- oder Konfigurationsfehler. [Ursache und Prüfung](guides#guide=terraform-4&section=module-recovery-fresh-infra-plan)"
diagnostics.probe_0_4: Der Hauptplan bestand die benannten Vorprüfungen, doch Python konnte eingefrorene Identitäten oder den infra-Plan nicht lesen, JSON nicht dekodieren oder die Struktur vor einem benannten Ergebnis nicht verarbeiten. Prüfen Sie beide Exportpfade und Strukturen; frühere benannte Fehler unterdrücken diesen Fallback. [Ursache und Prüfung](guides#guide=terraform-4&section=module-recovery-saved-plan-observation)
diagnostics.probe_0_5: Der erste Root-Plan bestand, doch fehlende eingefrorene Eingaben, unerwartete State-/Docker-Strukturen oder eine unbehandelte Ausnahme des abschließenden infra-Plans können Python vor einem benannten Ergebnis beenden. Prüfen Sie Eingaben und Planfehler; abgefangene CLI-Fehler nutzen bereits Recovery-Marker, frühere Marker unterdrücken diesen Fallback. [Ursache und Prüfung](guides#guide=terraform-4&section=module-recovery-recovery-observation-fallback)
