title: Modulwiederherstellung
brief: 'Ein sicherer Statusexport ordnet module.north dem vorhandenen ledger zu. Ein falscher Zustand
  move benannte ihn dann in module.orphan um; die neue Konfiguration nennt es module.station. Überprüfen
  Sie den backup checksum, vergleichen Sie Adressen und gleichen Sie die aktuelle Statuskarte ab, ohne
  den ledger zu ersetzen oder den gesamten alten Status zu übertragen. Speichern Sie recovery-plan.json,
  bevor Sie das überprüfte plan anwenden. Verwenden Sie nur offline local provider.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `main.tf`, `modules/ledger/main.tf`,
  `safe-state.json`, `safe-state.sha256`, `original-id`, `recovery-plan.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Anfängliche Erfolgskriterien: Die Modulzuordnung und outputs werden wiederhergestellt, der ursprüngliche
  ledger ID und der Inhalt bleiben erhalten, der backup bleibt unverändert und der endgültige plan ist
  leer.'
debrief: Bei der Wiederherstellung wurde die verifizierte Sicherung als Karte verwendet, anstatt den aktuellen
  Status vollständig zu überschreiben.
stages.0.brief: 'Erfolgskriterien: Die Modulzuordnung und outputs werden wiederhergestellt, der ursprüngliche
  ledger ID und der Inhalt bleiben erhalten, der backup bleibt unverändert und der endgültige plan ist
  leer.'
stages.0.objectives.0.text: Die Modulzuordnung und outputs werden wiederhergestellt, der ursprüngliche
  ledger ID und der Inhalt bleiben erhalten, der backup bleibt unverändert und der endgültige plan ist
  leer.
hints.0.text: Eine staatliche Sicherung ist ein Beweis; Durch das Wiederherstellen der gesamten Datei
  kann der neuere gültige Status verworfen werden.
hints.1.text: Vergleichen Sie module.north im backup mit module.orphan im aktuellen Zustand.
hints.2.text: Verschieben Sie die aktuelle Moduladresse auf module.station und dann auf inspect, eine
  No-Op-Ressource plan.
phrases.0: Ich habe einen backup verifiziert, bevor ich ihn als Wiederherstellungsbeweis verwendet habe.
phrases.1: Ich habe die Moduladressen abgeglichen, ohne die Ressource zu ersetzen.
phrases.2: Ich habe identity, outputs und einen leeren endgültigen plan überprüft.
