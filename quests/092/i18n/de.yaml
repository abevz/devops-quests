title: Modulwiederherstellung
brief: 'Lies in `~/quest` die Dateien `main.tf`, `modules/ledger/main.tf`, `safe-state.json`, `safe-state.sha256` und `original-id`.
  Ein sicherer Zustandsexport beschreibt das Ledger unter `module.north.local_file.ledger`; eine irrtümliche Zustandsverschiebung
  benannte es in module.orphan um, während die Konfiguration es nun module.station nennt. Nutze die Sicherung als Karte und
  gleiche den aktuellen Zustand ab; der Offline-Provider des Kindmoduls ist bereits deklariert. Die verlinkte Anleitung führt
  in Moduladressen ein; `tofu state mv` ändert eine Adresse im Zustand.


  Lass `safe-state.json` unverändert: Seine SHA-256-Summe muss `/run/dq/facts/0/safe-state.sha256` entsprechen, und seine
  JSON-Ressourcen müssen `module.north.local_file.ledger` enthalten. Speichere einen binären Plan und exportiere ihn mit `tofu
  show -json` nach `recovery-plan.json`, dann wende ihn an. Prüfe, dass `tofu state list` genau `module.station.local_file.ledger`
  enthält, die Root-Ausgabe `ledger_id` `/run/dq/facts/0/original-id` entspricht und `ledger.txt` `north-92` enthält. Der
  gespeicherte JSON-Plan muss genau eine Ressourcenänderung mit Aktionen `["no-op"]` enthalten. Schließlich muss `tofu plan
  -input=false -detailed-exitcode -no-color` mit Code 0 enden (keine Änderungen). Die Prüfung untersucht Sicherung, aktuellen
  Zustand und gespeichertes JSON; sie beweist weder die Wiederherstellungsgeschichte noch den Speicherzeitpunkt des Plans.
  Arbeite nur in der Offline-Umgebung.'
debrief: Prüfsumme der Sicherung, aktuelle Zustandsadresse, Ledger-ID und -Datei sowie gespeicherter Plan entsprechen dem
  Wiederherstellungsvertrag; der abschließende Plan enthält keine Änderungen.
stages.0.brief: Sicherung, Zustandsadresse, Ledger-ID und -Datei, gespeicherter und abschließender Plan stimmen mit der Aufgabe
  überein.
stages.0.objectives.0.text: Sicherung, Zustandsadresse, Ledger-ID und -Datei, gespeicherter und abschließender Plan stimmen
  mit der Aufgabe überein.
hints.0.text: Eine staatliche Sicherung ist ein Beweis; Durch das Wiederherstellen der gesamten Datei kann der neuere gültige
  Status verworfen werden.
hints.1.text: Vergleichen Sie module.north im backup mit module.orphan im aktuellen Zustand.
hints.2.text: Verschieben Sie die aktuelle Moduladresse auf module.station und dann auf inspect, eine No-Op-Ressource plan.
phrases.0: Ich habe einen backup verifiziert, bevor ich ihn als Wiederherstellungsbeweis verwendet habe.
phrases.1: Ich habe die Moduladressen abgeglichen, ohne die Ressource zu ersetzen.
phrases.2: Ich habe identity, outputs und einen leeren endgültigen plan überprüft.
diagnostics.condition_0: /run/dq/facts/0/safe-state.sha256 darf nicht leer sein und sha256(safe-state.json) muss dem Inhalt
  entsprechen.
diagnostics.condition_1: safe-state.json resources muss module.north.local_file.ledger enthalten.
diagnostics.condition_2: tofu state list muss module.station.local_file.ledger entsprechen.
diagnostics.condition_3: /run/dq/facts/0/original-id darf nicht leer sein und tofu output -raw ledger_id muss dem Inhalt entsprechen.
diagnostics.condition_4: ledger.txt muss north-92 entsprechen.
diagnostics.condition_5: recovery-plan.json resource_changes length muss 1 entsprechen.
diagnostics.condition_6: Jeder Eintrag in recovery-plan.json resource_changes muss actions ["no-op"] haben.
diagnostics.condition_7: Der OpenTofu-Plan mit detailed-exitcode muss mit Code 0 enden.
