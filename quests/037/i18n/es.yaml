title: RBAC
brief: 'ServiceAccount reader está vinculado a un Role que nombra una configuración retired. Permitir
  exactamente entrar en ConfigMap route; leer restricted y enumerar Secrets debe permanecer prohibido.
  identity se ejecuta con la cuenta reader y expone su propio token montado para una verificación de autorización
  real. No se necesita ningún rol cluster-wide.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `account.json`, `role.json`,
  `binding.json`, `identity.json`, `route.json`, `restricted.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito inicial: Reader puede obtener route; Ambas pruebas de permiso negativas siguen siendo
  denegadas.'
debrief: La carga de trabajo real identity aprobó una acción permitida y falló dos acciones prohibidas.
