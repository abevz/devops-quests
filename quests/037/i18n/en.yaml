title: RBAC
brief: |
  The configuration consumer cannot read its route.

  Work on the workstation in `~/quest` with `account.json`, `role.json`, `binding.json`, `identity.json`, `route.json`, `restricted.json`.

  **Requirements:**
  - Role `route-reader` has exactly one rule with only these fields:
    - `apiGroups`: `[""]`.
    - `resources`: `["configmaps"]`.
    - `resourceNames`: `["route"]`.
    - `verbs`: `["get"]`.
  - Access using the mounted token inside Pod `app=identity`:
    - Token: `/var/run/secrets/kubernetes.io/serviceaccount/token`.
    - Getting ConfigMap `route` succeeds; its `route` key contains `north`.
    - Getting ConfigMap `restricted` is forbidden.
    - Listing Secrets is forbidden.

  **Verify yourself before Check & finish:**
  - `kubectl get role route-reader -o json` — shows exactly the one rule listed in Requirements.
  - `identity_token=$(kubectl exec deployment/identity -- cat /var/run/secrets/kubernetes.io/serviceaccount/token)` and `kubectl --token="$identity_token" get configmap route -o jsonpath='{.data.route}'` — prints `north` using the token read inside the Pod; the token itself is not printed.
  - `kubectl --token="$identity_token" get configmap restricted` and `kubectl --token="$identity_token" get secrets` — both fail with `Forbidden` using the same Pod token.
debrief: The real workload identity passed one allowed action and failed two forbidden
  actions.
stages.0.brief: |
  The consumer must retain its narrow access boundary.
stages.0.objectives.0.text: Role `route-reader` allows only `get` on ConfigMap `route`.
stages.0.objectives.1.text: The mounted token of the identity Pod can get ConfigMap `route`, whose `route`
  key contains `north`.
stages.0.objectives.2.text: The mounted token of Pod `app=identity` cannot get ConfigMap `restricted`.
stages.0.objectives.3.text: The mounted token of Pod `app=identity` cannot list Secrets.
hints.0.text: Use the reader identity, not the player identity.
hints.1.text: |
  resourceNames narrows named get access. The Role names a retired configuration.
hints.2.text: |
  Preserve core API group, configmaps/get and one resource name. No cluster-wide role is needed.
phrases.0: I granted only the required named ConfigMap read.
phrases.1: I checked denied operations as well as the allowed request.
phrases.2: I kept the service account role inside its namespace.
questions.0.points.0: Authorization applies to the actual identity.
questions.0.points.1: Exercise a real allowed workload action.
questions.0.points.2: Test denied actions to catch excessive grants.
questions.0.prompt: Why is an administrator check insufficient for an RBAC repair?
questions.1.points.0: It limits named resource operations.
questions.1.points.1: List/watch require separate consideration.
questions.1.points.2: Other role grants are additive.
questions.1.prompt: What are the limits of resourceNames?
