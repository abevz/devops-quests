title: RBAC
brief: 'ServiceAccount reader is bound to a Role naming a retired configuration. Allow exactly get on
  ConfigMap route; reading restricted and listing Secrets must remain forbidden. identity runs with the
  reader account and exposes its own mounted token for an actual authorization check. No cluster-wide
  role is needed.


  Quest files in `~/quest` (some appear in later stages): `account.json`, `role.json`, `binding.json`,
  `identity.json`, `route.json`, `restricted.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: Reader can get route; both negative permission tests remain denied.'
debrief: The real workload identity passed one allowed action and failed two forbidden actions.
stages.0.brief: 'Reader can get route; both negative permission tests remain denied.


  Success criteria: Reader can get route; both negative permission tests remain denied.'
stages.0.objectives.0.text: Reader can get route; both negative permission tests remain denied.
hints.0.text: Use the reader identity, not the player identity.
hints.1.text: resourceNames narrows named get access.
hints.2.text: Preserve core API group, configmaps/get and one resource name.
phrases.0: I granted only the required named ConfigMap read.
phrases.1: I checked denied operations as well as the allowed request.
phrases.2: I kept the service account role inside its namespace.
questions.0.points.0: Authorization applies to the actual identity.
questions.0.points.1: Exercise a real allowed workload action.
questions.0.points.2: Test denied actions to catch excessive grants.
questions.0.prompt: Why is an administrator check insufficient for an RBAC repair?
questions.1.points.0: It limits named resource operations.
questions.1.points.1: List/watch require separate consideration.
questions.1.points.2: Other role grants are additive.
questions.1.prompt: What are the limits of resourceNames?
