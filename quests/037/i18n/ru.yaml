title: Права RBAC
brief: 'ServiceAccount reader связан с Role для устаревшей конфигурации. Разрешите ровно get ConfigMap
  route; чтение restricted и список Secrets должны оставаться запрещены. identity работает от reader и
  даёт свой смонтированный token для фактической проверки. Cluster-wide Role не нужен.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `account.json`, `role.json`, `binding.json`,
  `identity.json`, `route.json`, `restricted.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.'
debrief: Реальная identity нагрузки выполнила разрешённое действие и получила отказ
  на два запрещённых.
stages.0.brief: Менять можно только эту песочницу.
stages.0.objectives.0.text: Role `route-reader` разрешает только `get` для ConfigMap `route`.
stages.0.objectives.1.text: Смонтированный токен Pod identity позволяет получить ConfigMap `route`, в
  ключе `route` которого находится `north`.
stages.0.objectives.2.text: Смонтированный токен Pod `app=identity` не позволяет получить ConfigMap `restricted`.
stages.0.objectives.3.text: Смонтированный токен Pod `app=identity` не позволяет получить список Secrets.
hints.0.text: Используйте identity reader, а не player.
hints.1.text: resourceNames ограничивает именованный get.
hints.2.text: Сохраните core API group, configmaps/get и одно имя.
phrases.0: Я выдал только нужное чтение именованного ConfigMap.
phrases.1: Я проверил запрещённые операции вместе с разрешённым запросом.
phrases.2: Я сохранил роль service account в пределах namespace.
questions.0.points.0: Авторизация применяется к фактической identity.
questions.0.points.1: Выполните реальное разрешённое действие нагрузки.
questions.0.points.2: Проверьте отказы для обнаружения лишних прав.
questions.0.prompt: Почему проверки от администратора недостаточно для исправления
  RBAC?
questions.1.points.0: Он ограничивает именованные операции.
questions.1.points.1: List/watch требуют отдельного внимания.
questions.1.points.2: Права других ролей суммируются.
questions.1.prompt: Каковы границы resourceNames?
