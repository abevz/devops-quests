title: Права RBAC
brief: 'ServiceAccount reader связан с Role для устаревшей конфигурации. Разрешите
  ровно get ConfigMap route; чтение restricted и список Secrets должны оставаться
  запрещены. identity работает от reader и даёт свой смонтированный token для фактической
  проверки. Cluster-wide Role не нужен.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `account.json`,
  `role.json`, `binding.json`, `identity.json`, `route.json`, `restricted.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно
  загруженные образы и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Reader читает route; две отрицательные проверки прав остаются
  запрещены.'
debrief: Реальная identity нагрузки выполнила разрешённое действие и получила отказ
  на два запрещённых.
stages.0.brief: 'Результат проверки: Reader читает route; две отрицательные проверки
  прав остаются запрещены.'
