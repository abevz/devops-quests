title: RBAC
brief: |
  Odbiorca konfiguracji nie może odczytać swojej trasy.

  Pracuj na workstation w `~/quest` z plikami `account.yaml`, `role.yaml`, `binding.yaml`, `identity.yaml`, `route.yaml`, `restricted.yaml`.

  **Wymagania:**
  - Role `route-reader` ma dokładnie jedną regułę zawierającą tylko te pola:
    - `apiGroups`: `[""]`.
    - `resources`: `["configmaps"]`.
    - `resourceNames`: `["route"]`.
    - `verbs`: `["get"]`.
  - Dostęp z tokenem zamontowanym wewnątrz Poda `app=identity`:
    - Token: `/var/run/secrets/kubernetes.io/serviceaccount/token`.
    - Pobranie ConfigMap `route` jest dozwolone; klucz `route` zawiera `north`.
    - Pobranie ConfigMap `restricted` jest zabronione.
    - Wyświetlanie listy Secrets jest zabronione.

  **Sprawdź przed Check & finish:**
  - `kubectl get role route-reader -o json` — pokazuje dokładnie jedną regułę podaną w wymaganiach.
  - `identity_token=$(kubectl exec deployment/identity -- cat /var/run/secrets/kubernetes.io/serviceaccount/token)` i `kubectl --token="$identity_token" get configmap route -o jsonpath='{.data.route}'` — wypisuje `north` z tokenem odczytanym wewnątrz Poda; sam token nie jest wypisywany.
  - `kubectl --token="$identity_token" get configmap restricted` i `kubectl --token="$identity_token" get secrets` — obie kończą się odmową `Forbidden` przy użyciu tego samego tokenu Poda.
debrief: Rzeczywiste obciążenie identity przeszło jedną dozwoloną akcję i nie przeszło dwóch zabronionych.
stages.0.brief: |
  Odbiorca musi zachować wąski zakres dostępu.
stages.0.objectives.0.text: Role `route-reader` zezwala tylko na `get` dla ConfigMap `route`.
stages.0.objectives.1.text: Zamontowany token Poda identity pozwala pobrać ConfigMap `route`, której klucz
  `route` zawiera `north`.
stages.0.objectives.2.text: Zamontowany token Poda `app=identity` nie pozwala pobrać ConfigMap `restricted`.
stages.0.objectives.3.text: Zamontowany token Poda `app=identity` nie pozwala wyświetlić listy Secrets.
hints.0.text: Użyj tożsamości reader, a nie tożsamości player.
hints.1.text: |
  resourceNames zawęża dostęp o nazwie get. Role wskazuje wycofaną konfigurację.
hints.2.text: |
  Zachowaj core API group, configmaps/get i jedną nazwę zasobu. Rola o zasięgu klastra nie jest potrzebna.
phrases.0: Przyznałem tylko wymagany odczyt o nazwie ConfigMap.
phrases.1: Sprawdziłem odrzucone operacje, a także dozwolone żądania.
phrases.2: Zachowałem rolę service account w jego namespace.
questions.0.points.0: Autoryzacja dotyczy aktualnego identity.
questions.0.points.1: Wykonaj naprawdę dozwoloną akcję obciążenia.
questions.0.points.2: Test odrzucił działania mające na celu wyłapanie nadmiernych dotacji.
questions.0.prompt: Dlaczego kontrola administratora nie wystarczy do naprawy RBAC?
questions.1.points.0: Ogranicza operacje na nazwanych zasobach.
questions.1.points.1: List/watch wymagają osobnego rozważenia.
questions.1.points.2: Inne przydziały ról mają charakter addytywny.
questions.1.prompt: Jakie są ograniczenia resourceNames?
