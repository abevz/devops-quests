title: RBAC
brief: |
  Der Konfigurationsnutzer kann seine Route nicht lesen.

  Arbeiten Sie auf der Workstation in `~/quest` mit `account.yaml`, `role.yaml`, `binding.yaml`, `identity.yaml`, `route.yaml`, `restricted.yaml`.

  **Anforderungen:**
  - Role `route-reader` hat genau eine Regel mit ausschließlich diesen Feldern:
    - `apiGroups`: `[""]`.
    - `resources`: `["configmaps"]`.
    - `resourceNames`: `["route"]`.
    - `verbs`: `["get"]`.
  - Zugriff mit dem im Pod `app=identity` eingebundenen Token:
    - Token: `/var/run/secrets/kubernetes.io/serviceaccount/token`.
    - Das Abrufen von ConfigMap `route` gelingt; ihr Schlüssel `route` enthält `north`.
    - Das Abrufen von ConfigMap `restricted` ist verboten.
    - Das Auflisten von Secrets ist verboten.

  **Selbstprüfung vor Check & finish:**
  - `kubectl get role route-reader -o json` — zeigt genau die eine in den Anforderungen aufgeführte Regel.
  - `identity_token=$(kubectl exec deployment/identity -- cat /var/run/secrets/kubernetes.io/serviceaccount/token)` und `kubectl --token="$identity_token" get configmap route -o jsonpath='{.data.route}'` — gibt `north` mit dem im Pod gelesenen Token aus; das Token selbst wird nicht ausgegeben.
  - `kubectl --token="$identity_token" get configmap restricted` und `kubectl --token="$identity_token" get secrets` — schlagen beide mit `Forbidden` unter demselben Pod-Token fehl.
debrief: Die tatsächliche Arbeitslast identity hat eine zulässige Aktion bestanden und zwei verbotene
  Aktionen fehlgeschlagen.
stages.0.brief: |
  Der Nutzer muss seine eng begrenzten Zugriffsrechte beibehalten.
stages.0.objectives.0.text: Role `route-reader` erlaubt nur `get` für ConfigMap `route`.
stages.0.objectives.1.text: Das eingebundene Token des identity-Pods darf ConfigMap `route` abrufen, deren
  Schlüssel `route` den Wert `north` enthält.
stages.0.objectives.2.text: Das eingebundene Token des Pods `app=identity` darf ConfigMap `restricted`
  nicht abrufen.
stages.0.objectives.3.text: Das eingebundene Token des Pods `app=identity` darf Secrets nicht auflisten.
hints.0.text: Verwenden Sie reader identity, nicht player identity.
hints.1.text: |
  resourceNames schränkt den benannten Get-Zugriff ein. Die Role nennt eine veraltete Konfiguration.
hints.2.text: |
  Behalten Sie core API group, configmaps/get und einen Ressourcennamen bei. Eine clusterweite Rolle ist nicht erforderlich.
phrases.0: Ich habe nur den erforderlichen Lesevorgang mit dem Namen ConfigMap gewährt.
phrases.1: Ich habe sowohl abgelehnte Vorgänge als auch zulässige Anfragen überprüft.
phrases.2: Ich habe die Rolle service account in ihrer Rolle namespace behalten.
questions.0.points.0: Die Autorisierung gilt für den aktuellen identity.
questions.0.points.1: Führen Sie eine tatsächlich zulässige Workload-Aktion aus.
questions.0.points.2: Test verweigerte Maßnahmen, um übermäßige Zuschüsse abzufangen.
questions.0.prompt: Warum reicht eine Administratorprüfung für eine RBAC-Reparatur nicht aus?
questions.1.points.0: Es schränkt benannte Ressourcenoperationen ein.
questions.1.points.1: List/watch bedürfen einer gesonderten Betrachtung.
questions.1.points.2: Andere Rollenzuteilungen sind additiv.
questions.1.prompt: Was sind die Grenzen von resourceNames?
