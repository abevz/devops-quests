title: RBAC
brief: 'ServiceAccount reader ist an einen Role gebunden, der eine retired-Konfiguration benennt. Ermöglichen
  Sie genau das Einsteigen auf ConfigMap route; Das Lesen von restricted und das Auflisten von Secrets
  muss verboten bleiben. identity wird mit dem reader-Konto ausgeführt und stellt sein eigenes gemountetes
  token für eine tatsächliche Autorisierungsprüfung bereit. Es ist keine cluster-wide-Rolle erforderlich.


  Questdateien in `~/quest` (einige erscheinen in späteren Phasen): `account.json`, `role.json`, `binding.json`,
  `identity.json`, `route.json`, `restricted.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: Reader kann route erhalten; Beide negativen Zulassungstests bleiben verweigert.'
debrief: Die tatsächliche Arbeitslast identity hat eine zulässige Aktion bestanden und zwei verbotene
  Aktionen fehlgeschlagen.
