title: RBAC
brief: |-
  Der Konfigurationsnutzer kann seine Route nicht lesen.

  Arbeiten Sie auf der Workstation in `~/quest` mit den bereitgestellten Dateien:
  - `account.yaml`, `role.yaml`, `binding.yaml`, `identity.yaml`, `route.yaml`, `restricted.yaml`.

  **Anforderungen:**

  - Die bereitgestellte Role im Namespace erlaubt nur benannten Lesezugriff auf die vorhandene Routenkonfiguration.
  - In Pod `app=identity` kann der eingebundene Token unter `/var/run/secrets/kubernetes.io/serviceaccount/token`:
    - Den vorhandenen Routenwert `north` lesen.
    - Die separate geschützte Konfiguration aus der Workstation-Datei `restricted.yaml` nicht abrufen.
    - Secrets nicht auflisten.

  Die negativen Prüfungen decken die genannten Anfragen ab; sie sind kein clusterweites Autorisierungsaudit.
debrief: Die tatsächliche Arbeitslast identity hat eine zulässige Aktion bestanden und zwei verbotene
  Aktionen fehlgeschlagen.
stages.0.brief: Bewerten Sie den Zugriff mit der eingebundenen Identität des Verbrauchers.
stages.0.objectives.0.text: Die bereitgestellte Role im Namespace erlaubt nur benannten Lesezugriff auf
  die vorhandene Routenkonfiguration.
stages.0.objectives.1.text: Der eingebundene Token von Pod `app=identity` liest den vorhandenen Routenwert
  `north`.
stages.0.objectives.2.text: Der eingebundene Token von Pod `app=identity` kann die separate geschützte
