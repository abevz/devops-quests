stages.0.objectives.3.text: Das eingebundene Token des Pods `app=identity` darf Secrets nicht auflisten.
hints.0.text: Verwenden Sie reader identity, nicht player identity.
hints.1.text: |-
  resourceNames schränkt den benannten Get-Zugriff ein. Die Role nennt eine veraltete Konfiguration.

  Prüfen Sie die bereitgestellten Eingaben und laufenden Beobachtungen:

  ```sh
  kubectl get role,rolebinding -o yaml
  kubectl get configmap -o yaml
  ```
hints.2.text: |-
  Behalten Sie core API group, configmaps/get und einen Ressourcennamen bei. Eine clusterweite Rolle ist nicht erforderlich.

  Prüfen Sie das Ergebnis in `~/quest` auf der Workstation:

  - `kubectl get role route-reader -o json` — zeigt eine Core-API-Regel, die nur `configmaps` / `get` für den einzelnen Ressourcennamen `route` erlaubt, ohne zusätzliche Felder.
  - `identity_token=$(kubectl exec deployment/identity -- cat /var/run/secrets/kubernetes.io/serviceaccount/token)` und `kubectl --token="$identity_token" get configmap route -o jsonpath='{.data.route}'` — gibt `north` mit dem im Pod gelesenen Token aus; das Token selbst wird nicht ausgegeben.
  - `kubectl --token="$identity_token" get configmap restricted` und `kubectl --token="$identity_token" get secrets` — schlagen beide mit `Forbidden` unter demselben Pod-Token fehl.
phrases.0: Ich habe nur den erforderlichen Lesevorgang mit dem Namen ConfigMap gewährt.
phrases.1: Ich habe sowohl abgelehnte Vorgänge als auch zulässige Anfragen überprüft.
phrases.2: Ich habe die Rolle service account in ihrer Rolle namespace behalten.
