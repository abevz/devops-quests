title: Variablen
brief: 'Die Abgangsmitteilung bezieht ihre Daten von terraform.tfvars, aber station hat den falschen Variablentyp.
  Behalten Sie den Namen north station und vier Abfahrten bei, reparieren Sie den Vertrag in main.tf und
  wenden Sie die lokale Konfiguration an. notice.txt ist eine Ausgabe, keine bereitgestellte Eingabe.


  Questdateien in `~/quest` (einige erscheinen in späteren Phasen): `main.tf`, `terraform.tfvars`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Anfängliche Erfolgskriterien: Die verwaltete Mitteilung enthält north:4, station ist zeichenfolgentypisiert,
  outputs ist korrekt und die endgültige Meldung plan ist leer.'
debrief: Der Eingabewert waren gültige Geschäftsdaten, der deklarierte Typ war jedoch falsch. Der reparierte
  Vertrag behält die Unterscheidung von Text und Zahlen bei und erzeugt einen leeren Folgevertrag plan.
stages.0.brief: 'Die Kennung station ist Text; Die Anzahl der Abgänge ist numerisch.


  Erfolgskriterien: Die verwaltete Benachrichtigung enthält north:4, station ist zeichenfolgentypisiert,
  outputs ist korrekt und das endgültige plan ist leer.'
stages.0.objectives.0.text: Der verwaltete Hinweis enthält north:4, station ist stringtypisiert, outputs
  ist korrekt und der endgültige plan ist leer.
hints.0.text: Lesen Sie den Eingabekonvertierungsfehler, bevor Sie die bereitgestellten Werte ändern.
hints.1.text: Variablentypen beschreiben einen Vertrag, keinen zufälligen Standard.
hints.2.text: Verwenden Sie tofu console für den resultierenden Typ inspect, dann inspect outputs und
  plan.
phrases.0: Ich habe die Eingabetypen überprüft, bevor ich die Infrastruktur erstellt habe.
phrases.1: Ich habe die Kennung station als Text beibehalten.
phrases.2: Ich habe im Ressourcenvertrag eine numerische Abgangsanzahl verwendet.
