title: Variablen
brief: "Die Abfahrtsmeldung lässt sich mit den bereitgestellten Stationsdaten nicht erzeugen. Behalten Sie\
  \ Station und Abfahrtsanzahl bei.\n\nArbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte Eingabedateien:\
  \ `main.tf`, `terraform.tfvars`.\n\n**Anforderungen:**\n- Der OpenTofu-State enthält:\n  - `local_file.notice`\n\
  - Die Eingabe `station` hat den Typ `string`.\n- Dateien in `~/quest` auf der Workstation:\n  - `notice.txt`:\
  \ `north:4`\n- Die Ausgaben des Wurzelmoduls behalten Werte und Typen bei:\n  - `station`: `north`\n  - `departures`:\
  \ `4` (Zahl)\n- Ein detaillierter Plan meldet keine ausstehenden Infrastrukturänderungen und endet mit Code\
  \ `0`.\n"
debrief: Der Eingabewert waren gültige Geschäftsdaten, der deklarierte Typ war jedoch falsch. Der reparierte
  Vertrag behält die Unterscheidung von Text und Zahlen bei und erzeugt einen leeren Folgevertrag plan.
stages.0.brief: Meldung und typisierte Ausgaben müssen die bereitgestellten Stationsdaten beibehalten.
stages.0.objectives.0.text: Der Eingabewert `station` hat den Typ `string`.
stages.0.objectives.1.text: Der State enthält `local_file.notice`.
stages.0.objectives.2.text: '`notice.txt` enthält `north:4`.'
stages.0.objectives.3.text: Output `station` liefert `north`.
stages.0.objectives.4.text: Output `departures` liefert die Zahl `4`.
stages.0.objectives.5.text: OpenTofu meldet keine ausstehenden Infrastrukturänderungen.
hints.0.text: Eingabetypen schränken Daten ein, ohne die vorgesehenen Werte zu ändern.
hints.1.text: 'Lesen Sie den Eingabekonvertierungsfehler, bevor Sie die bereitgestellten Werte ändern.


  Variablentypen beschreiben einen Vertrag, keinen zufälligen Standardwert. Die bereitgestellte Deklaration
  von station hat den falschen Variablentyp.


  Prüfen Sie die mitgelieferten Eingaben und den aktuellen verwalteten Zustand:


  ```sh

  cat main.tf terraform.tfvars

  tofu show -no-color

  ```'
hints.2.text: "Prüfen Sie den resultierenden Typ mit tofu console, wenden Sie dann die lokale Konfiguration\
  \ an und prüfen Sie Ausgaben und Plan.\n\nPrüfen Sie das beobachtete Ergebnis:\n\n- `tofu state list` — Erwartet:\
  \ die unter Anforderungen genannten State-Adressen.\n\n- Erwartet: Die Eingabe `station` akzeptiert Text;\
  \ Meldung und Ausgaben des Wurzelmoduls entsprechen den Anforderungen, einschließlich der numerischen Abfahrtsanzahl.\n\
  \n  ```sh\n  cat notice.txt\n  tofu output -json\n  ```\n\n- `tofu plan -input=false -detailed-exitcode -no-color`\
  \ — Erwartet: keine Änderungen, Exit-Code `0`.\n\n```sh\ntofu console <<< 'type(var.station)'\n```\n\nErwarteter\
  \ Eingabetyp: `string`."
phrases.0: Ich habe die Eingabetypen überprüft, bevor ich die Infrastruktur erstellt habe.
phrases.1: Ich habe die Kennung station als Text beibehalten.
phrases.2: Ich habe im Ressourcenvertrag eine numerische Abgangsanzahl verwendet.
