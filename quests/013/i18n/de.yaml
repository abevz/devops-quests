title: Variablen
brief: |
  Die Abfahrtsmeldung lässt sich mit den bereitgestellten Stationsdaten nicht erzeugen. Behalten Sie Station und Abfahrtsanzahl bei.

  Arbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte Eingabedateien: `main.tf`, `terraform.tfvars`.

  **Anforderungen:**
  - Der OpenTofu-State enthält:
    - `local_file.notice`
  - Die Eingabe `station` hat den Typ `string`.
  - Dateien in `~/quest` auf der Workstation:
    - `notice.txt`: `north:4`
  - Die Ausgaben des Wurzelmoduls behalten Werte und Typen bei:
    - `station`: `north`
    - `departures`: `4` (Zahl)
  - `tofu plan` endet mit Code `0` und meldet keine Änderungen.

  **Vor Check & finish selbst prüfen:**
  Führen Sie diese Beobachtungsbefehle in `~/quest` auf der Workstation aus.
  - `tofu state list` — Erwartet: die unter Anforderungen genannten State-Adressen.
  - Erwartet: Die Eingabe `station` akzeptiert Text; Meldung und Ausgaben des Wurzelmoduls entsprechen den Anforderungen, einschließlich der numerischen Abfahrtsanzahl.

    ```sh
    cat main.tf
    cat notice.txt
    tofu output -json
    ```
  - `tofu plan -input=false -detailed-exitcode -no-color` — Erwartet: keine Änderungen, Exit-Code `0`.
debrief: Der Eingabewert waren gültige Geschäftsdaten, der deklarierte Typ war jedoch falsch. Der reparierte
  Vertrag behält die Unterscheidung von Text und Zahlen bei und erzeugt einen leeren Folgevertrag plan.
stages.0.brief: |
  Meldung und typisierte Ausgaben müssen die bereitgestellten Stationsdaten beibehalten.
stages.0.objectives.0.text: Der Eingabewert `station` hat den Typ `string`.
stages.0.objectives.1.text: Der State enthält `local_file.notice`.
stages.0.objectives.2.text: '`notice.txt` enthält `north:4`.'
stages.0.objectives.3.text: Output `station` liefert `north`.
stages.0.objectives.4.text: Output `departures` liefert die Zahl `4`.
stages.0.objectives.5.text: '`tofu plan` endet mit Exit-Code 0 ohne Änderungen.'
hints.0.text: Lesen Sie den Eingabekonvertierungsfehler, bevor Sie die bereitgestellten Werte ändern.
hints.1.text: |
  Variablentypen beschreiben einen Vertrag, keinen zufälligen Standardwert. Die bereitgestellte Deklaration von station hat den falschen Variablentyp.
hints.2.text: |
  Prüfen Sie den resultierenden Typ mit tofu console, wenden Sie dann die lokale Konfiguration an und prüfen Sie Ausgaben und Plan.
phrases.0: Ich habe die Eingabetypen überprüft, bevor ich die Infrastruktur erstellt habe.
phrases.1: Ich habe die Kennung station als Text beibehalten.
phrases.2: Ich habe im Ressourcenvertrag eine numerische Abgangsanzahl verwendet.
