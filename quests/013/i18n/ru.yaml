title: Переменные
brief: |
  Сообщение об отправлениях не удаётся получить с предоставленными данными станции. Сохраните исходные станцию и число отправлений.

  Работайте в `~/quest` на workstation. Предоставленные входные файлы: `main.tf`, `terraform.tfvars`.

  **Требования:**
  - State OpenTofu содержит:
    - `local_file.notice`
  - Входная переменная `station` имеет тип `string`.
  - Файлы в `~/quest` на workstation:
    - `notice.txt`: `north:4`
  - Выходные значения корневого модуля сохраняют значения и типы:
    - `station`: `north`
    - `departures`: `4` (число)
  - `tofu plan` завершается с кодом `0` без изменений.

  **Проверьте самостоятельно перед Check & finish:**
  Выполняйте эти команды наблюдения из `~/quest` на workstation.
  - `tofu state list` — Ожидаются адреса state из требований.
  - Ожидается, что входная переменная `station` принимает текст; сообщение и выходные значения корневого модуля соответствуют требованиям, включая числовой тип числа отправлений.

    ```sh
    cat main.tf
    cat notice.txt
    tofu output -json
    ```
  - `tofu plan -input=false -detailed-exitcode -no-color` — Ожидаются отсутствие изменений и код завершения `0`.
debrief: Входные данные были корректны, ошибся объявленный тип. Исправленный контракт разделяет текст
  и числа и даёт пустой повторный plan.
stages.0.brief: |
  Сообщение и типизированные выходные значения должны сохранять исходные данные станции.
stages.0.objectives.0.text: Входное значение `station` имеет тип `string`.
stages.0.objectives.1.text: В state есть `local_file.notice`.
stages.0.objectives.2.text: '`notice.txt` содержит `north:4`.'
stages.0.objectives.3.text: Output `station` возвращает `north`.
stages.0.objectives.4.text: Output `departures` возвращает число `4`.
stages.0.objectives.5.text: '`tofu plan` завершается с кодом 0 без изменений.'
hints.0.text: Перед изменением выданных значений прочитайте ошибку преобразования.
hints.1.text: |
  Типы переменных описывают контракт, а не случайное значение по умолчанию. В предоставленном объявлении station указан неверный тип переменной.
hints.2.text: |
  Используйте tofu console для проверки полученного типа, затем примените локальную конфигурацию и проверьте выходные значения и план.
phrases.0: Я проверил типы входных данных до создания инфраструктуры.
phrases.1: Я сохранил идентификатор станции как текст.
phrases.2: Я использовал числовое количество отправлений в контракте ресурса.
