title: Переменные
brief: "Сообщение об отправлениях не удаётся получить с предоставленными данными станции. Сохраните исходные\
  \ станцию и число отправлений.\n\nРаботайте в `~/quest` на workstation. Предоставленные входные файлы: `main.tf`,\
  \ `terraform.tfvars`.\n\n**Требования:**\n- State OpenTofu содержит:\n  - `local_file.notice`\n- Входная\
  \ переменная `station` имеет тип `string`.\n- Файлы в `~/quest` на workstation:\n  - `notice.txt`: `north:4`\n\
  - Выходные значения корневого модуля сохраняют значения и типы:\n  - `station`: `north`\n  - `departures`:\
  \ `4` (число)\n- Подробный план не содержит ожидающих изменений инфраструктуры и завершается с кодом `0`.\n"
debrief: Входные данные были корректны, ошибся объявленный тип. Исправленный контракт разделяет текст и числа
  и даёт пустой повторный plan.
stages.0.brief: Сообщение и типизированные выходные значения должны сохранять исходные данные станции.
stages.0.objectives.0.text: Входное значение `station` имеет тип `string`.
stages.0.objectives.1.text: В state есть `local_file.notice`.
stages.0.objectives.2.text: '`notice.txt` содержит `north:4`.'
stages.0.objectives.3.text: Output `station` возвращает `north`.
stages.0.objectives.4.text: Output `departures` возвращает число `4`.
stages.0.objectives.5.text: OpenTofu не сообщает об ожидающих изменениях инфраструктуры.
hints.0.text: Типы входных данных задают ограничения, не меняя требуемые значения.
hints.1.text: 'Перед изменением выданных значений прочитайте ошибку преобразования.


  Типы переменных описывают контракт, а не случайное значение по умолчанию. В предоставленном объявлении station
  указан неверный тип переменной.


  Изучите поставленные входные данные и текущее управляемое состояние:


  ```sh

  cat main.tf terraform.tfvars

  tofu show -no-color

  ```'
hints.2.text: "Используйте tofu console для проверки полученного типа, затем примените локальную конфигурацию\
  \ и проверьте выходные значения и план.\n\nПроверьте наблюдаемый результат:\n\n- `tofu state list` — Ожидаются\
  \ адреса state из требований.\n\n- Ожидается, что входная переменная `station` принимает текст; сообщение\
  \ и выходные значения корневого модуля соответствуют требованиям, включая числовой тип числа отправлений.\n\
  \n  ```sh\n  cat notice.txt\n  tofu output -json\n  ```\n\n- `tofu plan -input=false -detailed-exitcode -no-color`\
  \ — Ожидаются отсутствие изменений и код завершения `0`.\n\n```sh\ntofu console <<< 'type(var.station)'\n\
  ```\n\nОжидаемый тип входа: `string`."
phrases.0: Я проверил типы входных данных до создания инфраструктуры.
phrases.1: Я сохранил идентификатор станции как текст.
phrases.2: Я использовал числовое количество отправлений в контракте ресурса.
