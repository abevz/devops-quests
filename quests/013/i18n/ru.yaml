title: Переменные
brief: 'Данные отправлений находятся в terraform.tfvars, но у station неверный тип. Сохраните имя north
  и четыре отправления, исправьте контракт main.tf и примените локальную конфигурацию. notice.txt — результат,
  а не входной файл.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `main.tf`, `terraform.tfvars`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.'
debrief: Входные данные были корректны, ошибся объявленный тип. Исправленный контракт разделяет текст
  и числа и даёт пустой повторный plan.
stages.0.brief: Идентификатор станции — текст, число отправлений — число.
stages.0.objectives.0.text: Входное значение `station` имеет тип `string`.
stages.0.objectives.1.text: В state есть `local_file.notice`.
stages.0.objectives.2.text: '`notice.txt` содержит `north:4`.'
stages.0.objectives.3.text: Output `station` возвращает `north`.
stages.0.objectives.4.text: Output `departures` возвращает число `4`.
stages.0.objectives.5.text: '`tofu plan` завершается с кодом 0 без изменений.'
hints.0.text: Перед изменением выданных значений прочитайте ошибку преобразования.
hints.1.text: Тип переменной описывает контракт, а не случайное значение по умолчанию.
hints.2.text: Проверьте тип через tofu console, затем outputs и plan.
phrases.0: Я проверил типы входных данных до создания инфраструктуры.
phrases.1: Я сохранил идентификатор станции как текст.
phrases.2: Я использовал числовое количество отправлений в контракте ресурса.
