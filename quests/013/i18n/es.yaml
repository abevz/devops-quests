title: variables
brief: 'El aviso de salida toma sus datos de terraform.tfvars, pero station tiene el tipo de variable
  incorrecto. Conserve el nombre north station y cuatro salidas, repare el contrato en main.tf y aplique
  la configuración local. notice.txt es una salida, no una entrada suministrada.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `main.tf`, `terraform.tfvars`.


  La bahía no dispone de Internet ni DNS externos. Utilice únicamente archivos proporcionados, imágenes
  precargadas y servicios privados. Cambie sólo esta bahía.'
debrief: El valor de entrada eran datos comerciales válidos, pero su tipo declarado era incorrecto. El
  contrato reparado mantiene el texto y los números distintos y produce un seguimiento vacío plan.
stages.0.brief: El identificador station es texto; el recuento de salidas es numérico.
stages.0.objectives.0.text: La entrada `station` tiene tipo `string`.
stages.0.objectives.1.text: El state contiene `local_file.notice`.
stages.0.objectives.2.text: '`notice.txt` contiene `north:4`.'
stages.0.objectives.3.text: El output `station` devuelve `north`.
stages.0.objectives.4.text: El output `departures` devuelve el número `4`.
stages.0.objectives.5.text: '`tofu plan` termina con código 0 sin cambios.'
hints.0.text: Lea el error de conversión de entrada antes de cambiar los valores proporcionados.
hints.1.text: Los tipos de variables describen un contrato, no un incumplimiento incidental.
hints.2.text: Utilice tofu console hasta inspect el tipo resultante, luego inspect outputs y plan.
phrases.0: Verifiqué los tipos de entrada antes de crear la infraestructura.
phrases.1: Conservé el identificador station como texto.
phrases.2: Utilicé un recuento de salidas numérico en el contrato de recursos.
