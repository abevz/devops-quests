title: variables
brief: "No se puede generar el aviso de salidas con los datos de estación suministrados. Conserva la estación\
  \ y el número de salidas.\n\nTrabaja en `~/quest` en la workstation. Archivos de entrada suministrados: `main.tf`,\
  \ `terraform.tfvars`.\n\n**Requisitos:**\n- El estado de OpenTofu contiene:\n  - `local_file.notice`\n- La\
  \ entrada `station` tiene tipo `string`.\n- Archivos en `~/quest` en la workstation:\n  - `notice.txt`: `north:4`\n\
  - Las salidas del módulo raíz conservan sus valores y tipos:\n  - `station`: `north`\n  - `departures`: `4`\
  \ (número)\n- Un plan detallado no muestra cambios de infraestructura pendientes y termina con código `0`.\n"
debrief: El valor de entrada eran datos comerciales válidos, pero su tipo declarado era incorrecto. El contrato
  reparado mantiene el texto y los números distintos y produce un seguimiento vacío plan.
stages.0.brief: El aviso y las salidas tipadas deben conservar los datos de estación suministrados.
stages.0.objectives.0.text: La entrada `station` tiene tipo `string`.
stages.0.objectives.1.text: El state contiene `local_file.notice`.
stages.0.objectives.2.text: '`notice.txt` contiene `north:4`.'
stages.0.objectives.3.text: El output `station` devuelve `north`.
stages.0.objectives.4.text: El output `departures` devuelve el número `4`.
stages.0.objectives.5.text: OpenTofu no informa cambios de infraestructura pendientes.
hints.0.text: Los tipos de entrada limitan los datos sin cambiar los valores previstos.
hints.1.text: 'Lea el error de conversión de entrada antes de cambiar los valores proporcionados.


  Los tipos de variables describen un contrato, no un valor predeterminado casual. La declaración suministrada
  de station tiene un tipo de variable incorrecto.


  Inspecciona las entradas suministradas y el estado gestionado actual:


  ```sh

  cat main.tf terraform.tfvars

  tofu show -no-color

  ```'
hints.2.text: "Usa tofu console para inspeccionar el tipo resultante; después aplica la configuración local\
  \ e inspecciona las salidas y el plan.\n\nVerifica el resultado observado:\n\n- `tofu state list` — Se esperan\
  \ las direcciones de estado indicadas en Requisitos.\n\n- Se espera que la entrada `station` acepte texto;\
  \ el aviso y las salidas del módulo raíz coinciden con Requisitos, incluida la cantidad numérica de salidas.\n\
  \n  ```sh\n  cat notice.txt\n  tofu output -json\n  ```\n\n- `tofu plan -input=false -detailed-exitcode -no-color`\
  \ — Se esperan ausencia de cambios y código de salida `0`.\n\n```sh\ntofu console <<< 'type(var.station)'\n\
  ```\n\nTipo de entrada esperado: `string`."
phrases.0: Verifiqué los tipos de entrada antes de crear la infraestructura.
phrases.1: Conservé el identificador station como texto.
phrases.2: Utilicé un recuento de salidas numérico en el contrato de recursos.
