title: variables
brief: |
  No se puede generar el aviso de salidas con los datos de estación suministrados. Conserva la estación y el número de salidas.

  Trabaja en `~/quest` en la workstation. Archivos de entrada suministrados: `main.tf`, `terraform.tfvars`.

  **Requisitos:**
  - El estado de OpenTofu contiene:
    - `local_file.notice`
  - La entrada `station` tiene tipo `string`.
  - Archivos en `~/quest` en la workstation:
    - `notice.txt`: `north:4`
  - Las salidas del módulo raíz conservan sus valores y tipos:
    - `station`: `north`
    - `departures`: `4` (número)
  - `tofu plan` termina con código `0` sin cambios.

  **Verifica antes de Check & finish:**
  Ejecuta estos comandos de observación desde `~/quest` en la workstation.
  - `tofu state list` — Se esperan las direcciones de estado indicadas en Requisitos.
  - Se espera que la entrada `station` acepte texto; el aviso y las salidas del módulo raíz coinciden con Requisitos, incluida la cantidad numérica de salidas.

    ```sh
    cat main.tf
    cat notice.txt
    tofu output -json
    ```
  - `tofu plan -input=false -detailed-exitcode -no-color` — Se esperan ausencia de cambios y código de salida `0`.
debrief: El valor de entrada eran datos comerciales válidos, pero su tipo declarado era incorrecto. El
  contrato reparado mantiene el texto y los números distintos y produce un seguimiento vacío plan.
stages.0.brief: |
  El aviso y las salidas tipadas deben conservar los datos de estación suministrados.
stages.0.objectives.0.text: La entrada `station` tiene tipo `string`.
stages.0.objectives.1.text: El state contiene `local_file.notice`.
stages.0.objectives.2.text: '`notice.txt` contiene `north:4`.'
stages.0.objectives.3.text: El output `station` devuelve `north`.
stages.0.objectives.4.text: El output `departures` devuelve el número `4`.
stages.0.objectives.5.text: '`tofu plan` termina con código 0 sin cambios.'
hints.0.text: Lea el error de conversión de entrada antes de cambiar los valores proporcionados.
hints.1.text: |
  Los tipos de variables describen un contrato, no un valor predeterminado casual. La declaración suministrada de station tiene un tipo de variable incorrecto.
hints.2.text: |
  Usa tofu console para inspeccionar el tipo resultante; después aplica la configuración local e inspecciona las salidas y el plan.
phrases.0: Verifiqué los tipos de entrada antes de crear la infraestructura.
phrases.1: Conservé el identificador station como texto.
phrases.2: Utilicé un recuento de salidas numérico en el contrato de recursos.
