title: Zmienne
brief: |
  Nie można utworzyć komunikatu odjazdów z dostarczonych danych stacji. Zachowaj stację i liczbę odjazdów.

  Pracuj w `~/quest` na workstation. Dostarczone pliki wejściowe: `main.tf`, `terraform.tfvars`.

  **Wymagania:**
  - Stan OpenTofu zawiera:
    - `local_file.notice`
  - Zmienna wejściowa `station` ma typ `string`.
  - Pliki w `~/quest` na workstation:
    - `notice.txt`: `north:4`
  - Wyniki modułu głównego zachowują wartości i typy:
    - `station`: `north`
    - `departures`: `4` (liczba)
  - `tofu plan` kończy się kodem `0` i nie wykazuje zmian.

  **Sprawdź samodzielnie przed Check & finish:**
  Wykonaj te polecenia obserwacyjne w `~/quest` na workstation.
  - `tofu state list` — Oczekiwane są adresy stanu wymienione w wymaganiach.
  - Oczekiwane: wejście `station` przyjmuje tekst; komunikat i wyniki modułu głównego odpowiadają wymaganiom, w tym liczbowy typ liczby odjazdów.

    ```sh
    cat main.tf
    cat notice.txt
    tofu output -json
    ```
  - `tofu plan -input=false -detailed-exitcode -no-color` — Oczekiwane: brak zmian i kod zakończenia `0`.
debrief: Wartością wejściową były prawidłowe dane biznesowe, ale zadeklarowany typ był nieprawidłowy.
  Naprawiona umowa zapewnia odrębność tekstu i liczb i tworzy pustą kontynuację plan.
stages.0.brief: |
  Komunikat i typowane wyniki mają zachować dostarczone dane stacji.
stages.0.objectives.0.text: Wartość wejściowa `station` ma typ `string`.
stages.0.objectives.1.text: State zawiera `local_file.notice`.
stages.0.objectives.2.text: '`notice.txt` zawiera `north:4`.'
stages.0.objectives.3.text: Output `station` zwraca `north`.
stages.0.objectives.4.text: Output `departures` zwraca liczbę `4`.
stages.0.objectives.5.text: '`tofu plan` kończy się kodem 0 bez zmian.'
hints.0.text: Przed zmianą podanych wartości należy przeczytać błąd konwersji sygnału wejściowego.
hints.1.text: |
  Typy zmiennych opisują kontrakt, a nie przypadkową wartość domyślną. Dostarczona deklaracja station ma nieprawidłowy typ zmiennej.
hints.2.text: |
  Sprawdź wynikowy typ za pomocą tofu console, następnie zastosuj lokalną konfigurację i sprawdź wyniki oraz plan.
phrases.0: Sprawdziłem typy danych wejściowych przed utworzeniem infrastruktury.
phrases.1: Zachowałem identyfikator station jako tekst.
phrases.2: W umowie o zasobach użyłem numerycznego licznika odlotów.
