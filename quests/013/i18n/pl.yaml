title: Zmienne
brief: "Nie można utworzyć komunikatu odjazdów z dostarczonych danych stacji. Zachowaj stację i liczbę odjazdów.\n\
  \nPracuj w `~/quest` na workstation. Dostarczone pliki wejściowe: `main.tf`, `terraform.tfvars`.\n\n**Wymagania:**\n\
  - Stan OpenTofu zawiera:\n  - `local_file.notice`\n- Zmienna wejściowa `station` ma typ `string`.\n- Pliki\
  \ w `~/quest` na workstation:\n  - `notice.txt`: `north:4`\n- Wyniki modułu głównego zachowują wartości i\
  \ typy:\n  - `station`: `north`\n  - `departures`: `4` (liczba)\n- Szczegółowy plan nie zawiera oczekujących\
  \ zmian infrastruktury i kończy się kodem `0`.\n"
debrief: Wartością wejściową były prawidłowe dane biznesowe, ale zadeklarowany typ był nieprawidłowy. Naprawiona
  umowa zapewnia odrębność tekstu i liczb i tworzy pustą kontynuację plan.
stages.0.brief: Komunikat i typowane wyniki mają zachować dostarczone dane stacji.
stages.0.objectives.0.text: Wartość wejściowa `station` ma typ `string`.
stages.0.objectives.1.text: State zawiera `local_file.notice`.
stages.0.objectives.2.text: '`notice.txt` zawiera `north:4`.'
stages.0.objectives.3.text: Output `station` zwraca `north`.
stages.0.objectives.4.text: Output `departures` zwraca liczbę `4`.
stages.0.objectives.5.text: OpenTofu nie zgłasza oczekujących zmian infrastruktury.
hints.0.text: Typy danych wejściowych określają ograniczenia bez zmiany zamierzonych wartości.
hints.1.text: 'Przed zmianą podanych wartości należy przeczytać błąd konwersji danych wejściowych.


  Typy zmiennych opisują kontrakt, a nie przypadkową wartość domyślną. Dostarczona deklaracja station ma nieprawidłowy
  typ zmiennej.


  Sprawdź dostarczone dane wejściowe i bieżący zarządzany stan:


  ```sh

  cat main.tf terraform.tfvars

  tofu show -no-color

  ```'
hints.2.text: "Sprawdź wynikowy typ za pomocą tofu console, następnie zastosuj lokalną konfigurację i sprawdź\
  \ wyniki oraz plan.\n\nSprawdź obserwowany wynik:\n\n- `tofu state list` — Oczekiwane są adresy stanu wymienione\
  \ w wymaganiach.\n\n- Oczekiwane: wejście `station` przyjmuje tekst; komunikat i wyniki modułu głównego odpowiadają\
  \ wymaganiom, w tym liczbowy typ liczby odjazdów.\n\n  ```sh\n  cat notice.txt\n  tofu output -json\n  ```\n\
  \n- `tofu plan -input=false -detailed-exitcode -no-color` — Oczekiwane: brak zmian i kod zakończenia `0`.\n\
  \n```sh\ntofu console <<< 'type(var.station)'\n```\n\nOczekiwany typ wejścia: `string`."
phrases.0: Sprawdziłem typy danych wejściowych przed utworzeniem infrastruktury.
phrases.1: Zachowałem identyfikator station jako tekst.
phrases.2: W umowie o zasobach użyłem numerycznego licznika odlotów.
