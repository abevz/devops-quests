title: Zmienne
brief: 'Powiadomienie o odjeździe pobiera dane z terraform.tfvars, ale station ma niewłaściwy typ zmiennej.
  Zachowaj nazwę north station i cztery odjazdy, napraw kontrakt w main.tf i zastosuj konfigurację lokalną.
  notice.txt jest wyjściem, a nie zasilanym wejściem.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `main.tf`, `terraform.tfvars`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: zarządzane powiadomienie zawiera north:4, station ma typ string, outputs
  jest poprawne, a końcowe plan jest puste.'
debrief: Wartością wejściową były prawidłowe dane biznesowe, ale zadeklarowany typ był nieprawidłowy.
  Naprawiona umowa zapewnia odrębność tekstu i liczb i tworzy pustą kontynuację plan.
stages.0.brief: 'Identyfikator station jest tekstowy; liczba odjazdów jest numeryczna.


  Kryteria sukcesu: zarządzane powiadomienie zawiera north:4, station ma typ string, outputs jest poprawne,
  a końcowe plan jest puste.'
stages.0.objectives.0.text: Zarządzane powiadomienie zawiera north:4, station ma typ string, outputs jest
  poprawne, a końcowe plan jest puste.
hints.0.text: Przed zmianą podanych wartości należy przeczytać błąd konwersji sygnału wejściowego.
hints.1.text: Typy zmiennych opisują umowę, a nie przypadkowe niewykonanie zobowiązania.
hints.2.text: Użyj tofu console, aby sprawdzić wynikowy typ, a następnie sprawdź outputs i plan.
phrases.0: Sprawdziłem typy danych wejściowych przed utworzeniem infrastruktury.
phrases.1: Zachowałem identyfikator station jako tekst.
phrases.2: W umowie o zasobach użyłem numerycznego licznika odlotów.
