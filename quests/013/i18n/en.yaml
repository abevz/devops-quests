title: Variables
brief: 'The departure notice takes its data from terraform.tfvars, but station has the wrong variable
  type. Preserve the north station name and four departures, repair the contract in main.tf and apply
  the local configuration. notice.txt is an output, not a supplied input.


  Quest files in `~/quest` (some appear in later stages): `main.tf`, `terraform.tfvars`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: The managed notice contains north:4, station is string-typed, outputs are
  correct and the final plan is empty.'
debrief: The input value was valid business data, but its declared type was wrong. The repaired contract
  keeps text and numbers distinct and produces an empty follow-up plan.
stages.0.brief: 'The station identifier is text; the departure count is numeric.


  Success criteria: The managed notice contains north:4, station is string-typed, outputs are correct
  and the final plan is empty.'
stages.0.objectives.0.text: The managed notice contains north:4, station is string-typed, outputs are
  correct and the final plan is empty.
hints.0.text: Read the input conversion error before changing supplied values.
hints.1.text: Variable types describe a contract, not an incidental default.
hints.2.text: Use tofu console to inspect the resulting type, then inspect outputs and plan.
phrases.0: I checked input types before creating infrastructure.
phrases.1: I preserved the station identifier as text.
phrases.2: I used a numeric departure count in the resource contract.
