title: Variables
brief: |
  The departure notice cannot be produced with the supplied input data. Keep the supplied location name and departure count.

  Work in `~/quest` on the workstation. Supplied inputs: `main.tf`, `terraform.tfvars`.

  **Requirements:**
  - OpenTofu state contains:
    - `local_file.notice`
  - Input `station` has type `string`.
  - Files in `~/quest` on the workstation:
    - `notice.txt`: `north:4`
  - Root outputs preserve their values and types:
    - `station`: `north`
    - `departures`: `4` (number)
  - `tofu plan` exits with code `0` and reports no changes.

  **Verify yourself before Check & finish:**
  Run these observation commands from `~/quest` on the workstation.
  - `tofu state list` — Expected: the state addresses listed in Requirements.
  - Expected: the `station` input accepts text; the notice and root outputs match Requirements, including the numeric departure count.

    ```sh
    cat main.tf
    cat notice.txt
    tofu output -json
    ```
  - `tofu plan -input=false -detailed-exitcode -no-color` — Expected: no changes, exit code `0`.
debrief: The input value was valid business data, but its declared type was wrong. The repaired contract
  keeps text and numbers distinct and produces an empty follow-up plan.
stages.0.brief: |
  The notice and typed outputs must preserve the supplied input data.
stages.0.objectives.0.text: The `station` input has type `string`.
stages.0.objectives.1.text: The state tracks `local_file.notice`.
stages.0.objectives.2.text: '`notice.txt` contains `north:4`.'
stages.0.objectives.3.text: Output `station` returns `north`.
stages.0.objectives.4.text: Output `departures` returns the number `4`.
stages.0.objectives.5.text: '`tofu plan` exits 0 with no changes.'
hints.0.text: Read the input conversion error before changing supplied values.
hints.1.text: |
  Variable types describe a contract, not an incidental default. The supplied station declaration has the wrong variable type.
hints.2.text: |
  Use tofu console to inspect the resulting type, then apply the local configuration and inspect outputs and plan.
phrases.0: I checked input types before creating infrastructure.
phrases.1: I preserved the station identifier as text.
phrases.2: I used a numeric departure count in the resource contract.
