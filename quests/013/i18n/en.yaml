title: Variables
brief: "The departure notice cannot be produced with the supplied input data. Keep the supplied location name\
  \ and departure count.\n\nWork in `~/quest` on the workstation. Supplied inputs: `main.tf`, `terraform.tfvars`.\n\
  \n**Requirements:**\n- OpenTofu state contains:\n  - `local_file.notice`\n- Input `station` has type `string`.\n\
  - Files in `~/quest` on the workstation:\n  - `notice.txt`: `north:4`\n- Root outputs preserve their values\
  \ and types:\n  - `station`: `north`\n  - `departures`: `4` (number)\n- A detailed plan reports no pending\
  \ infrastructure changes and exits with code `0`.\n"
debrief: The input value was valid business data, but its declared type was wrong. The repaired contract keeps
  text and numbers distinct and produces an empty follow-up plan.
stages.0.brief: The notice and typed outputs must preserve the supplied input data.
stages.0.objectives.0.text: The `station` input has type `string`.
stages.0.objectives.1.text: The state tracks `local_file.notice`.
stages.0.objectives.2.text: '`notice.txt` contains `north:4`.'
stages.0.objectives.3.text: Output `station` returns `north`.
stages.0.objectives.4.text: Output `departures` returns the number `4`.
stages.0.objectives.5.text: OpenTofu reports no pending infrastructure changes.
hints.0.text: Input types constrain data without changing the intended values.
hints.1.text: 'Read the input conversion error before changing supplied values.


  Variable types describe a contract, not an incidental default. The supplied station declaration has the wrong
  variable type.


  Inspect the supplied inputs and current managed state:


  ```sh

  cat main.tf terraform.tfvars

  tofu show -no-color

  ```'
hints.2.text: "Use tofu console to inspect the resulting type, then apply the local configuration and inspect\
  \ outputs and plan.\n\nVerify the observed result:\n\n- `tofu state list` — Expected: the state addresses\
  \ listed in Requirements.\n\n- Expected: the `station` input accepts text; the notice and root outputs match\
  \ Requirements, including the numeric departure count.\n\n  ```sh\n  cat notice.txt\n  tofu output -json\n\
  \  ```\n\n- `tofu plan -input=false -detailed-exitcode -no-color` — Expected: no changes, exit code `0`.\n\
  \n```sh\ntofu console <<< 'type(var.station)'\n```\n\nExpected input type: `string`."
phrases.0: I checked input types before creating infrastructure.
phrases.1: I preserved the station identifier as text.
phrases.2: I used a numeric departure count in the resource contract.
