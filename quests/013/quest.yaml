id: 13
title: title
track: OpenTofu
difficulty: basics
brief: brief
stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    check: |-
      tofu console <<< 'type(var.station)' | grep -Fx string || {
        code=$?
        printf '%s\n' 'station input is a string: ✗ [DQ:condition_0]' >&2
        exit "$code"
      }
  - text: stages.0.objectives.1.text
    check: |-
      tofu state list | grep -Fx local_file.notice || {
        code=$?
        printf '%s\n' 'OpenTofu tracks local_file.notice: ✗ [DQ:condition_1]' >&2
        exit "$code"
      }
  - text: stages.0.objectives.2.text
    check: |-
      test "$(cat notice.txt)" = north:4 || {
        code=$?
        printf '%s\n' 'notice.txt contains north:4: ✗ [DQ:condition_2]' >&2
        exit "$code"
      }
  - text: stages.0.objectives.3.text
    check: |-
      test "$(tofu output -raw station)" = north || {
        code=$?
        printf '%s\n' 'station output is north: ✗ [DQ:condition_3]' >&2
        exit "$code"
      }
  - text: stages.0.objectives.4.text
    check: |-
      tofu output -json departures | jq -e '.==4' >/dev/null || {
        code=$?
        printf '%s\n' 'departures output is numeric 4: ✗ [DQ:condition_4]' >&2
        exit "$code"
      }
  - text: stages.0.objectives.5.text
    check: |-
      tofu plan -input=false -detailed-exitcode -no-color >/dev/null || {
        code=$?
        printf '%s\n' 'OpenTofu detailed plan exits with 0: ✗ [DQ:condition_5]' >&2
        exit "$code"
      }
hints:
- text: hints.0.text
  guide: terraform-2
- text: hints.1.text
  guide: terraform-2
- text: hints.2.text
  guide: terraform-2
debrief: debrief
phrases:
- phrases.0
- phrases.1
- phrases.2
questions: []
facts:
  environment:
  - DQ_NAMESPACE
  - DQ_APP_IMAGE
  - KUBECONFIG
  - TF_CLI_CONFIG_FILE
  - DOCKER_HOST
  - DOCKER_TLS_VERIFY
  - DOCKER_CERT_PATH
  files:
  - main.tf
  - terraform.tfvars
  services: []
