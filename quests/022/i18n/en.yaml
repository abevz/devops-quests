title: Template variables
brief: |-
  Different hosts display the same identity.

  Work on the workstation in `~/quest` with `inventory.ini`, `ansible.cfg`, `message.j2`, `rollout.yml`.

  **Requirements:**
  - Host `app1`:
    - On app1, /srv/site/message contains the complete line station=app1.
    - On app1, /srv/site/message contains the complete line route=north.
  - Host `app2`:
    - On app2, /srv/site/message contains the complete line station=app2.
    - On app2, /srv/site/message contains the complete line route=north.
  - Host `app3`:
    - On app3, /srv/site/message contains the complete line station=app3.
    - On app3, /srv/site/message contains the complete line route=north.

  **Verify yourself before Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'cat /srv/site/message'` — shows station=app1/app2/app3; route=north from each managed host.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'grep -x route=north /srv/site/message'` — prints the complete route=north line on every managed host.
stages.0.brief: The remote identities must be distinct while the route is shared.
