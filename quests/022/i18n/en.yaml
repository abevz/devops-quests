title: Template variables
brief: 'Fleet banners do not follow the host inputs. Restore the current banners and the supplied template''s behavior
  when route inputs change.


  Work on the workstation in `~/quest` with the supplied files:

  - `inventory.ini`.

  - `ansible.cfg`.

  - `message.j2`.

  - `rollout.yml`.

  - `route-declarations.yml`.

  - `template-contract.json`.


  **Requirements:**


  - On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` identifies that same host in its `station`
  line.

  - On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` contains the complete line `route=north`.
  The supplied template also honors the changing host and route inputs declared in `template-contract.json`; its
  current rendering capability is verified separately from the stored fleet banners.'
stages.0.brief: The remote identities must be distinct while the route is shared.
stages.0.objectives.0.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` identifies that
  same host in its `station` line.
stages.0.objectives.1.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` contains the complete
  line `route=north`. The supplied template also honors the changing host and route inputs declared in `template-contract.json`;
  its current rendering capability is verified separately from the stored fleet banners.
hints.0.text: A template is evaluated in the current host context on the controller. A value shaped as a record
  is different from a host name or a map indexed by host. Separate context errors from valid text that merely contains
  a fixed route.
hints.1.text: 'Compare the template context with the declared data and inspect the real rendering error. Inventory
  host variables and a keyed input table are different observations.


  ```sh

  cd ~/quest

  cat message.j2 route-declarations.yml template-contract.json

  ansible-inventory --list

  ansible-playbook rollout.yml --check --diff

  ```'
hints.2.text: 'Apply the current inputs, then use check mode with alternative inputs. Each host identity must stay
  correct, route differences must follow the supplied data, and the check-mode run must not change stored banners.


  ```sh

  cd ~/quest

  ansible-playbook rollout.yml

  ansible fleet -m ansible.builtin.command -a ''cat /srv/site/message''

  ansible-playbook rollout.yml --check --diff -e ''{"station_routes":{"app1":{"active":"south"},"app2":{"active":"east"},"app3":{"active":"north"}}}''

  ```'
debrief: The fleet identities and route matched, and the current template rendered the declared alternative caller
  inputs. These checks establish current capability, not the complete delivery history.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I verified the result on every managed host.
diagnostics.identity_1: On app1, /srv/site/message contains the complete line station=app1.
diagnostics.identity_2: On app2, /srv/site/message contains the complete line station=app2.
diagnostics.identity_3: On app3, /srv/site/message contains the complete line station=app3.
diagnostics.route_1: On app1, /srv/site/message contains the complete line route=north.
diagnostics.route_2: On app2, /srv/site/message contains the complete line route=north.
diagnostics.route_3: On app3, /srv/site/message contains the complete line route=north.
diagnostics.template_render: The template could not render the caller inputs. An undefined value or a different
  data shape can make the supplied context invalid.
diagnostics.template_inputs: Rendered host or route lines do not follow the caller inputs. A fixed literal or a
  lookup in the wrong host context can still produce a correct stored banner once.
diagnostics.template_observation: The bounded rendering observation was unavailable. The template must finish and
  produce its declared output under the supplied inputs.
diagnostics.probe_0_1: The bounded rendering observation was unavailable. The template must finish and produce its
  declared output under the supplied inputs.
