title: Template variables
brief: "Different hosts display the same identity.\n\nWork on the workstation in `~/quest` with `inventory.ini`,\
  \ `ansible.cfg`, `message.j2`, `rollout.yml`.\n\n**Requirements:**\n- Message lines on the managed hosts\
  \ (`app1`, `app2`, `app3`):\n  - Path: `/srv/site/message`.\n  - `app1`: `station=app1`.\n  - `app2`: `station=app2`.\n\
  \  - `app3`: `station=app3`.\n- Shared complete line: `route=north`.\n"
stages.0.brief: The remote identities must be distinct while the route is shared.
stages.0.objectives.0.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` identifies
  that same host in its `station` line.
stages.0.objectives.1.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` contains the
  complete line `route=north`.
hints.0.text: Shared configuration and per-host identity are different parts of a fleet message.
hints.1.text: 'Inspect the Jinja template and each rendered host file.


  A constant app1 cannot identify all three stations.


  Inspect the supplied inputs and execution scope:


  ```sh

  cat message.j2 rollout.yml

  ansible-inventory -i inventory.ini --list

  ```'
hints.2.text: 'Render inventory_hostname and route=north, then rerun the template task.


  Verify the observed result:


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''cat /srv/site/message''` — shows station=app1/app2/app3;
  route=north from each managed host.


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''grep -x route=north /srv/site/message''`
  — prints the complete route=north line on every managed host.'
debrief: A hard-coded name reached every station. You used inventory_hostname and verified a distinct rendered
  file on each host.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I verified the result on every managed host.
diagnostics.identity_1: On app1, /srv/site/message contains the complete line station=app1.
diagnostics.identity_2: On app2, /srv/site/message contains the complete line station=app2.
diagnostics.identity_3: On app3, /srv/site/message contains the complete line station=app3.
diagnostics.route_1: On app1, /srv/site/message contains the complete line route=north.
diagnostics.route_2: On app2, /srv/site/message contains the complete line route=north.
diagnostics.route_3: On app3, /srv/site/message contains the complete line route=north.
