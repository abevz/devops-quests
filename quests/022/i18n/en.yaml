title: Template variables
brief: 'You joined SignalRail operations. Two stations showed the same name. Work in ~/quest. Keep all
  changes inside this training bay.


  Inputs in `~/quest`: `inventory.ini`, `ansible.cfg`, `message.j2`, `rollout.yml`.


  The bay has no Internet or external DNS. Use only its supplied files, preloaded images and private services.
  All changes must stay inside this bay.


  Initial success criteria: Each host message contains its own station=app1/app2/app3 and route=north.'
stages.0.brief: 'Each host needs its own station name and route=north in the template output.


  Success criteria: Each host message contains its own station=app1/app2/app3 and route=north.'
stages.0.objectives.0.text: Each host message contains its own station=app1/app2/app3 and route=north.
hints.0.text: Inspect the Jinja template and each rendered host file.
hints.1.text: A constant app1 cannot identify all three stations.
hints.2.text: Render inventory_hostname and route=north, then rerun the template task.
debrief: A hard-coded name reached every station. You used inventory_hostname and verified a distinct
  rendered file on each host.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I verified the result on every managed host.
