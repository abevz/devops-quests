title: Template variables
brief: |-
  Different hosts display the same identity.

  Work on the workstation in `~/quest` with `inventory.ini`, `ansible.cfg`, `message.j2`, `rollout.yml`.

  **Requirements:**
  - Message lines on the managed hosts (`app1`, `app2`, `app3`):
    - Path: `/srv/site/message`.
    - `app1`: `station=app1`.
    - `app2`: `station=app2`.
    - `app3`: `station=app3`.
    - Shared complete line: `route=north`.

  **Verify yourself before Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'cat /srv/site/message'` — shows station=app1/app2/app3; route=north from each managed host.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'grep -x route=north /srv/site/message'` — prints the complete route=north line on every managed host.
stages.0.brief: The remote identities must be distinct while the route is shared.
stages.0.objectives.0.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` identifies that
  same host in its `station` line.
stages.0.objectives.1.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` contains the complete
  line `route=north`.
hints.0.text: Inspect the Jinja template and each rendered host file.
hints.1.text: A constant app1 cannot identify all three stations.
hints.2.text: Render inventory_hostname and route=north, then rerun the template task.
debrief: A hard-coded name reached every station. You used inventory_hostname and verified a distinct rendered file
  on each host.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I verified the result on every managed host.
