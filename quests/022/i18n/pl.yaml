title: Zmienne szablonu
brief: |-
  Różne hosty pokazują tę samą tożsamość.

  Pracuj na workstation w `~/quest` z plikami `inventory.ini`, `ansible.cfg`, `message.j2`, `rollout.yml`.

  **Wymagania:**
  - Wiersze komunikatów na zarządzanych hostach (`app1`, `app2`, `app3`):
    - Ścieżka: `/srv/site/message`.
    - `app1`: `station=app1`.
    - `app2`: `station=app2`.
    - `app3`: `station=app3`.
    - Wspólny pełny wiersz: `route=north`.

  **Sprawdź przed Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'cat /srv/site/message'` — pokazuje station=app1/app2/app3; route=north z każdego zarządzanego hosta.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'grep -x route=north /srv/site/message'` — wypisuje pełny wiersz route=north na każdym zarządzanym hoście.
stages.0.brief: Zdalne tożsamości muszą się różnić przy wspólnej trasie.
stages.0.objectives.0.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/message` wskazuje
  tego samego hosta w wierszu `station`.
stages.0.objectives.1.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/message` zawiera
  pełny wiersz `route=north`.
hints.0.text: Sprawdź szablon Jinja i każdy wyrenderowany plik hosta.
hints.1.text: Stała app1 nie może zidentyfikować wszystkich trzech stacji.
hints.2.text: Wyrenderuj inventory_hostname i route=north, a następnie uruchom ponownie template task.
debrief: Do każdej station docierała zakodowana na stałe nazwa. Użyłeś inventory_hostname i zweryfikowałeś odrębny
  renderowany plik na każdym hoście.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem wynik na każdym zarządzanym hoście.
