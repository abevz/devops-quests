title: Zmienne szablonu
brief: "Różne hosty pokazują tę samą tożsamość.\n\nPracuj na workstation w `~/quest` z plikami `inventory.ini`,\
  \ `ansible.cfg`, `message.j2`, `rollout.yml`.\n\n**Wymagania:**\n- Wiersze komunikatów na zarządzanych hostach\
  \ (`app1`, `app2`, `app3`):\n  - Ścieżka: `/srv/site/message`.\n  - `app1`: `station=app1`.\n  - `app2`:\
  \ `station=app2`.\n  - `app3`: `station=app3`.\n- Wspólny pełny wiersz: `route=north`.\n"
stages.0.brief: Zdalne tożsamości muszą się różnić przy wspólnej trasie.
stages.0.objectives.0.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/message`
  wskazuje tego samego hosta w wierszu `station`.
stages.0.objectives.1.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/message`
  zawiera pełny wiersz `route=north`.
hints.0.text: Wspólna konfiguracja i tożsamość każdego hosta to różne części komunikatu floty.
hints.1.text: 'Sprawdź szablon Jinja i każdy wyrenderowany plik hosta.


  Stała app1 nie może zidentyfikować wszystkich trzech stacji.


  Sprawdź dostarczone dane wejściowe i zakres wykonania:


  ```sh

  cat message.j2 rollout.yml

  ansible-inventory -i inventory.ini --list

  ```'
hints.2.text: 'Wyrenderuj inventory_hostname i route=north, a następnie uruchom ponownie template task.


  Sprawdź obserwowany wynik:


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''cat /srv/site/message''` — pokazuje station=app1/app2/app3;
  route=north z każdego zarządzanego hosta.


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''grep -x route=north /srv/site/message''`
  — wypisuje pełny wiersz route=north na każdym zarządzanym hoście.'
debrief: Do każdej station docierała zakodowana na stałe nazwa. Użyłeś inventory_hostname i zweryfikowałeś
  odrębny renderowany plik na każdym hoście.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem wynik na każdym zarządzanym hoście.
