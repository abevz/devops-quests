title: Zmienne szablonu
brief: 'Banery floty nie odpowiadają wejściom stacji. Przywróć bieżące banery i działanie dostarczonego szablonu
  przy zmianie tras wejściowych.


  Pracuj na workstation w `~/quest` z dostarczonymi plikami:

  - `inventory.ini`.

  - `ansible.cfg`.

  - `message.j2`.

  - `rollout.yml`.

  - `route-declarations.yml`.

  - `template-contract.json`.


  **Wymagania:**


  - Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/message` wskazuje tego samego hosta w
  wierszu `station`.

  - Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/message` zawiera pełny wiersz `route=north`.
  Dostarczony szablon uwzględnia również zmienne wejścia hosta i trasy zadeklarowane w `template-contract.json`;
  jego bieżąca zdolność renderowania jest sprawdzana oddzielnie od zapisanych banerów floty.'
stages.0.brief: Zdalne tożsamości muszą się różnić przy wspólnej trasie.
stages.0.objectives.0.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/message` wskazuje
  tego samego hosta w wierszu `station`.
stages.0.objectives.1.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/message` zawiera
  pełny wiersz `route=north`. Dostarczony szablon uwzględnia również zmienne wejścia hosta i trasy zadeklarowane
  w `template-contract.json`; jego bieżąca zdolność renderowania jest sprawdzana oddzielnie od zapisanych banerów
  floty.
hints.0.text: Szablon jest obliczany na kontrolerze w kontekście bieżącego hosta. Rekord różni się od nazwy hosta
  i mapy indeksowanej hostem. Odróżnij błąd kontekstu od poprawnego tekstu ze stałą trasą.
hints.1.text: 'Porównaj kontekst szablonu z zadeklarowanymi danymi i obejrzyj rzeczywisty błąd renderowania. Zmienne
  hosta inventory i tabela wejść indeksowana hostami to różne obserwacje.


  ```sh

  cd ~/quest

  cat message.j2 route-declarations.yml template-contract.json

  ansible-inventory --list

  ansible-playbook rollout.yml --check --diff

  ```'
hints.2.text: 'Zastosuj bieżące wejścia, a następnie użyj check mode z innymi danymi. Tożsamość każdej stacji musi
  pozostać poprawna, różnice tras mają wynikać z danych, a check mode nie może zmieniać zapisanych banerów.


  ```sh

  cd ~/quest

  ansible-playbook rollout.yml

  ansible fleet -m ansible.builtin.command -a ''cat /srv/site/message''

  ansible-playbook rollout.yml --check --diff -e ''{"station_routes":{"app1":{"active":"south"},"app2":{"active":"east"},"app3":{"active":"north"}}}''

  ```'
debrief: Tożsamości i trasa floty były zgodne, a bieżący szablon wyrenderował zadeklarowane alternatywne wejścia.
  Kontrole potwierdzają bieżącą zdolność, nie pełną historię dostarczania.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem wynik na każdym zarządzanym hoście.
diagnostics.identity_1: Na app1 plik /srv/site/message zawiera pełny wiersz station=app1.
diagnostics.identity_2: Na app2 plik /srv/site/message zawiera pełny wiersz station=app2.
diagnostics.identity_3: Na app3 plik /srv/site/message zawiera pełny wiersz station=app3.
diagnostics.route_1: Na app1 plik /srv/site/message zawiera pełny wiersz route=north.
diagnostics.route_2: Na app2 plik /srv/site/message zawiera pełny wiersz route=north.
diagnostics.route_3: Na app3 plik /srv/site/message zawiera pełny wiersz route=north.
diagnostics.template_render: Szablon nie mógł wyrenderować wejść wywołującego. Niezdefiniowana wartość lub inny
  kształt danych może unieważnić dostarczony kontekst.
diagnostics.template_inputs: Wiersze stacji lub trasy nie odpowiadają wejściom wywołania. Stała albo odwołanie do
  niewłaściwego kontekstu hosta może jednorazowo dać poprawny zapisany baner.
diagnostics.template_observation: Ograniczona obserwacja renderowania była niedostępna. Szablon musi zakończyć pracę
  i utworzyć zadeklarowany wynik dla dostarczonych wejść.
diagnostics.probe_0_1: Ograniczona obserwacja renderowania była niedostępna. Szablon musi zakończyć pracę i utworzyć
  zadeklarowany wynik dla dostarczonych wejść.
