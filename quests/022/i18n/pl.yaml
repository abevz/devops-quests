title: Zmienne szablonu
brief: 'Dołączyłeś do operacji SignalRail. Dwie stacje miały tę samą nazwę. Pracuj w ~/quest. Wszystkie
  zmiany przechowuj w tej komorze szkoleniowej.


  Wejścia w `~/quest`: `inventory.ini`, `ansible.cfg`, `message.j2`, `rollout.yml`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Wszystkie zmiany muszą pozostać w tej zatoce.


  Początkowe kryteria sukcesu: każdy host message zawiera własne station=app1/app2/app3 i route=north.'
stages.0.brief: 'Każdy host potrzebuje własnej nazwy station i route=north w wynikach szablonu.


  Kryteria sukcesu: Każdy host message zawiera własne station=app1/app2/app3 i route=north.'
stages.0.objectives.0.text: Każdy host message zawiera własne station=app1/app2/app3 i route=north.
hints.0.text: Sprawdź szablon Jinja i każdy wyrenderowany plik hosta.
hints.1.text: Stała app1 nie może zidentyfikować wszystkich trzech stacji.
hints.2.text: Wyrenderuj inventory_hostname i route=north, a następnie uruchom ponownie template task.
debrief: Do każdej station docierała zakodowana na stałe nazwa. Użyłeś inventory_hostname i zweryfikowałeś
  odrębny renderowany plik na każdym hoście.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem wynik na każdym zarządzanym hoście.
