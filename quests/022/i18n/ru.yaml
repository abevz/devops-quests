title: Переменные шаблона
brief: |-
  Разные хосты показывают одинаковое имя.

  Работайте на workstation в `~/quest` с файлами `inventory.ini`, `ansible.cfg`, `message.j2`, `rollout.yml`.

  **Требования:**
  - Хост `app1`:
    - На app1 файл /srv/site/message содержит полную строку station=app1.
    - На app1 файл /srv/site/message содержит полную строку route=north.
  - Хост `app2`:
    - На app2 файл /srv/site/message содержит полную строку station=app2.
    - На app2 файл /srv/site/message содержит полную строку route=north.
  - Хост `app3`:
    - На app3 файл /srv/site/message содержит полную строку station=app3.
    - На app3 файл /srv/site/message содержит полную строку route=north.

  **Самопроверка перед Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'cat /srv/site/message'` — показывает station=app1/app2/app3; route=north с каждого управляемого хоста.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'grep -x route=north /srv/site/message'` — выводит полную строку route=north на каждом управляемом хосте.
stages.0.brief: Имена удалённых хостов должны различаться при общем маршруте.
