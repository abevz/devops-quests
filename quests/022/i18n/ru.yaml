title: Переменные шаблона
brief: |-
  Разные хосты показывают одинаковое имя.

  Работайте на workstation в `~/quest` с файлами `inventory.ini`, `ansible.cfg`, `message.j2`, `rollout.yml`.

  **Требования:**
  - Строки сообщений на управляемых хостах (`app1`, `app2`, `app3`):
    - Путь: `/srv/site/message`.
    - `app1`: `station=app1`.
    - `app2`: `station=app2`.
    - `app3`: `station=app3`.
    - Общая полная строка: `route=north`.

  **Самопроверка перед Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'cat /srv/site/message'` — показывает station=app1/app2/app3; route=north с каждого управляемого хоста.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'grep -x route=north /srv/site/message'` — выводит полную строку route=north на каждом управляемом хосте.
stages.0.brief: Имена удалённых хостов должны различаться при общем маршруте.
stages.0.objectives.0.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/message` указывает
  именно этот хост в строке `station`.
stages.0.objectives.1.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/message` содержит
  полную строку `route=north`.
hints.0.text: Проверьте Jinja-шаблон и результат каждого хоста.
hints.1.text: Константа app1 не может обозначать три разные станции.
hints.2.text: Используйте inventory_hostname и route=north, затем повторите template task.
debrief: Жёстко заданное имя попало на все станции. Вы использовали inventory_hostname и проверили отдельный файл
  каждого хоста.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я проверил результат на каждом управляемом хосте.
