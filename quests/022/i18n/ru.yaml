title: Переменные шаблона
brief: "Разные хосты показывают одинаковое имя.\n\nРаботайте на workstation в `~/quest` с файлами `inventory.ini`,\
  \ `ansible.cfg`, `message.j2`, `rollout.yml`.\n\n**Требования:**\n- Строки сообщений на управляемых хостах\
  \ (`app1`, `app2`, `app3`):\n  - Путь: `/srv/site/message`.\n  - `app1`: `station=app1`.\n  - `app2`: `station=app2`.\n\
  \  - `app3`: `station=app3`.\n- Общая полная строка: `route=north`.\n"
stages.0.brief: Имена удалённых хостов должны различаться при общем маршруте.
stages.0.objectives.0.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/message` указывает
  именно этот хост в строке `station`.
stages.0.objectives.1.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/message` содержит
  полную строку `route=north`.
hints.0.text: Общая конфигурация и идентичность отдельного хоста — разные части сообщения парка.
hints.1.text: 'Проверьте Jinja-шаблон и результат каждого хоста.


  Константа app1 не может обозначать три разные станции.


  Изучите поставленные входные данные и область выполнения:


  ```sh

  cat message.j2 rollout.yml

  ansible-inventory -i inventory.ini --list

  ```'
hints.2.text: 'Используйте inventory_hostname и route=north, затем повторите template task.


  Проверьте наблюдаемый результат:


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''cat /srv/site/message''` — показывает station=app1/app2/app3;
  route=north с каждого управляемого хоста.


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''grep -x route=north /srv/site/message''`
  — выводит полную строку route=north на каждом управляемом хосте.'
debrief: Жёстко заданное имя попало на все станции. Вы использовали inventory_hostname и проверили отдельный
  файл каждого хоста.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я проверил результат на каждом управляемом хосте.
diagnostics.identity_1: На app1 файл /srv/site/message содержит полную строку station=app1.
diagnostics.identity_2: На app2 файл /srv/site/message содержит полную строку station=app2.
diagnostics.identity_3: На app3 файл /srv/site/message содержит полную строку station=app3.
diagnostics.route_1: На app1 файл /srv/site/message содержит полную строку route=north.
diagnostics.route_2: На app2 файл /srv/site/message содержит полную строку route=north.
diagnostics.route_3: На app3 файл /srv/site/message содержит полную строку route=north.
