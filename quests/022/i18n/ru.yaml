title: Переменные шаблона
brief: 'Вы в команде эксплуатации SignalRail. Две станции получили одинаковое имя. Работайте в ~/quest.
  Все изменения — только в этой песочнице.


  Входные файлы в `~/quest`: `inventory.ini`, `ansible.cfg`, `message.j2`, `rollout.yml`.


  В песочнице нет интернета и внешнего DNS. Используйте только выданные файлы, предварительно загруженные
  образы и приватные сервисы. Все изменения — только в этой песочнице.


  Цели первого этапа: Файл message каждого узла содержит его station=app1/app2/app3 и route=north.'
stages.0.brief: 'Каждому хосту нужно своё имя station и route=north.


  Результат проверки: Файл message каждого узла содержит его station=app1/app2/app3 и route=north.'
stages.0.objectives.0.text: Файл message каждого узла содержит его station=app1/app2/app3 и route=north.
hints.0.text: Проверьте Jinja-шаблон и результат каждого хоста.
hints.1.text: Константа app1 не может обозначать три разные станции.
hints.2.text: Используйте inventory_hostname и route=north, затем повторите template task.
debrief: Жёстко заданное имя попало на все станции. Вы использовали inventory_hostname и проверили отдельный
  файл каждого хоста.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я проверил результат на каждом управляемом хосте.
