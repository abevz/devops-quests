title: Переменные шаблона
brief: 'Баннеры флота не соответствуют входным данным станций. Восстановите текущие баннеры и работу предоставленного
  шаблона при изменении входных маршрутов.


  Работайте на workstation в `~/quest` с предоставленными файлами:

  - `inventory.ini`.

  - `ansible.cfg`.

  - `message.j2`.

  - `rollout.yml`.

  - `route-declarations.yml`.

  - `template-contract.json`.


  **Требования:**


  - На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/message` указывает именно этот хост в строке
  `station`.

  - На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/message` содержит полную строку `route=north`.
  Предоставленный шаблон также учитывает меняющиеся входные данные хоста и маршрута из `template-contract.json`;
  его текущая способность к рендерингу проверяется отдельно от сохранённых баннеров флота.'
stages.0.brief: Имена удалённых хостов должны различаться при общем маршруте.
stages.0.objectives.0.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/message` указывает
  именно этот хост в строке `station`.
stages.0.objectives.1.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/message` содержит
  полную строку `route=north`. Предоставленный шаблон также учитывает меняющиеся входные данные хоста и маршрута
  из `template-contract.json`; его текущая способность к рендерингу проверяется отдельно от сохранённых баннеров
  флота.
hints.0.text: Шаблон вычисляется на контроллере в контексте текущего хоста. Значение-запись отличается от имени
  хоста или словаря, индексированного по хосту. Различайте ошибку контекста и допустимый текст с постоянным маршрутом.
hints.1.text: 'Сопоставьте контекст шаблона с объявленными данными и изучите реальную ошибку рендеринга. Переменные
  хоста inventory и таблица входных данных по хостам — разные наблюдения.


  ```sh

  cd ~/quest

  cat message.j2 route-declarations.yml template-contract.json

  ansible-inventory --list

  ansible-playbook rollout.yml --check --diff

  ```'
hints.2.text: 'Примените текущие входные данные, затем используйте check mode с другими данными. Идентичность каждой
  станции должна сохраняться, отличия маршрутов должны следовать данным, а check mode не должен менять сохранённые
  баннеры.


  ```sh

  cd ~/quest

  ansible-playbook rollout.yml

  ansible fleet -m ansible.builtin.command -a ''cat /srv/site/message''

  ansible-playbook rollout.yml --check --diff -e ''{"station_routes":{"app1":{"active":"south"},"app2":{"active":"east"},"app3":{"active":"north"}}}''

  ```'
debrief: Идентичности станций и маршрут совпали с условиями, а текущий шаблон отрисовал другие объявленные входы.
  Проверки подтверждают текущую способность программы, а не полную историю доставки.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я проверил результат на каждом управляемом хосте.
diagnostics.identity_1: На app1 файл /srv/site/message содержит полную строку station=app1.
diagnostics.identity_2: На app2 файл /srv/site/message содержит полную строку station=app2.
diagnostics.identity_3: На app3 файл /srv/site/message содержит полную строку station=app3.
diagnostics.route_1: На app1 файл /srv/site/message содержит полную строку route=north.
diagnostics.route_2: На app2 файл /srv/site/message содержит полную строку route=north.
diagnostics.route_3: На app3 файл /srv/site/message содержит полную строку route=north.
diagnostics.template_render: Шаблон не смог отрисовать входы вызывающего контекста. Неопределённое значение или
  другая структура данных могут делать предоставленный контекст недопустимым.
diagnostics.template_inputs: Строки станции или маршрута не следуют входным данным вызова. Постоянное значение или
  поиск в контексте другого хоста могут один раз дать правильный сохранённый баннер.
diagnostics.template_observation: Ограниченное наблюдение рендеринга недоступно. Шаблон должен завершиться и создать
  объявленный результат для предоставленных входов.
diagnostics.probe_0_1: Ограниченное наблюдение рендеринга недоступно. Шаблон должен завершиться и создать объявленный
  результат для предоставленных входов.
