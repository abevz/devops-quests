title: Variables de plantilla
brief: |-
  Distintos hosts muestran la misma identidad.

  Trabaja en la workstation en `~/quest` con `inventory.ini`, `ansible.cfg`, `message.j2`, `rollout.yml`.

  **Requisitos:**
  - Líneas de mensaje en los hosts administrados (`app1`, `app2`, `app3`):
    - Ruta: `/srv/site/message`.
    - `app1`: `station=app1`.
    - `app2`: `station=app2`.
    - `app3`: `station=app3`.
    - Línea completa compartida: `route=north`.

  **Verifica antes de Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'cat /srv/site/message'` — muestra station=app1/app2/app3; route=north de cada host administrado.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'grep -x route=north /srv/site/message'` — imprime la línea completa route=north en cada host administrado.
stages.0.brief: Las identidades remotas deben ser distintas y compartir la ruta.
stages.0.objectives.0.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` identifica a
  ese mismo host en la línea `station`.
stages.0.objectives.1.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` contiene la
  línea completa `route=north`.
hints.0.text: Inspeccione la plantilla de Jinja y cada archivo host renderizado.
hints.1.text: Una constante app1 no puede identificar las tres estaciones.
hints.2.text: Renderice inventory_hostname y route=north, luego vuelva a ejecutar template task.
debrief: Un nombre codificado llegó a cada station. Utilizó inventory_hostname y verificó un archivo renderizado
  distinto en cada host.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el resultado en cada host administrado.
diagnostics.identity_1: En app1, /srv/site/message contiene la línea completa station=app1.
diagnostics.identity_2: En app2, /srv/site/message contiene la línea completa station=app2.
diagnostics.identity_3: En app3, /srv/site/message contiene la línea completa station=app3.
diagnostics.route_1: En app1, /srv/site/message contiene la línea completa route=north.
diagnostics.route_2: En app2, /srv/site/message contiene la línea completa route=north.
diagnostics.route_3: En app3, /srv/site/message contiene la línea completa route=north.
