title: Variables de plantilla
brief: "Distintos hosts muestran la misma identidad.\n\nTrabaja en la workstation en `~/quest` con `inventory.ini`,\
  \ `ansible.cfg`, `message.j2`, `rollout.yml`.\n\n**Requisitos:**\n- Líneas de mensaje en los hosts administrados\
  \ (`app1`, `app2`, `app3`):\n  - Ruta: `/srv/site/message`.\n  - `app1`: `station=app1`.\n  - `app2`: `station=app2`.\n\
  \  - `app3`: `station=app3`.\n- Línea completa compartida: `route=north`.\n"
stages.0.brief: Las identidades remotas deben ser distintas y compartir la ruta.
stages.0.objectives.0.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` identifica
  a ese mismo host en la línea `station`.
stages.0.objectives.1.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` contiene
  la línea completa `route=north`.
hints.0.text: La configuración compartida y la identidad de cada host son partes distintas del mensaje de una
  flota.
hints.1.text: 'Inspeccione la plantilla de Jinja y cada archivo host renderizado.


  Una constante app1 no puede identificar las tres estaciones.


  Inspecciona las entradas suministradas y el ámbito de ejecución:


  ```sh

  cat message.j2 rollout.yml

  ansible-inventory -i inventory.ini --list

  ```'
hints.2.text: 'Renderice inventory_hostname y route=north, luego vuelva a ejecutar template task.


  Verifica el resultado observado:


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''cat /srv/site/message''` — muestra station=app1/app2/app3;
  route=north de cada host administrado.


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''grep -x route=north /srv/site/message''`
  — imprime la línea completa route=north en cada host administrado.'
debrief: Un nombre codificado llegó a cada station. Utilizó inventory_hostname y verificó un archivo renderizado
  distinto en cada host.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el resultado en cada host administrado.
diagnostics.identity_1: En app1, /srv/site/message contiene la línea completa station=app1.
diagnostics.identity_2: En app2, /srv/site/message contiene la línea completa station=app2.
diagnostics.identity_3: En app3, /srv/site/message contiene la línea completa station=app3.
diagnostics.route_1: En app1, /srv/site/message contiene la línea completa route=north.
diagnostics.route_2: En app2, /srv/site/message contiene la línea completa route=north.
diagnostics.route_3: En app3, /srv/site/message contiene la línea completa route=north.
