title: Variables de plantilla
brief: 'Te uniste a las operaciones de SignalRail. Dos estaciones mostraban el mismo nombre. Trabajar
  en ~/quest. Mantenga todos los cambios dentro de esta bahía de entrenamiento.


  Entradas en `~/quest`: `inventory.ini`, `ansible.cfg`, `message.j2`, `rollout.yml`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente los archivos suministrados, las imágenes
  precargadas y los servicios privados. Todos los cambios deben permanecer dentro de esta bahía.


  Criterios de éxito iniciales: cada host message contiene su propio station=app1/app2/app3 y route=north..'
stages.0.brief: 'Cada host necesita su propio nombre station y route=north en la salida de la plantilla.


  Criterios de éxito: cada host message contiene su propio station=app1/app2/app3 y route=north..'
stages.0.objectives.0.text: Cada host message contiene su propio station=app1/app2/app3 y route=north..
hints.0.text: Inspeccione la plantilla de Jinja y cada archivo host renderizado.
hints.1.text: Una constante app1 no puede identificar las tres estaciones.
hints.2.text: Renderice inventory_hostname y route=north, luego vuelva a ejecutar template task.
debrief: Un nombre codificado llegó a cada station. Utilizó inventory_hostname y verificó un archivo renderizado
  distinto en cada host.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el resultado en cada host administrado.
