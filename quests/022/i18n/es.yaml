title: Variables de plantilla
brief: 'Los banners de la flota no siguen las entradas de las estaciones. Recupera los banners actuales y el comportamiento
  de la plantilla suministrada al cambiar las rutas de entrada.


  Trabaja en la workstation en `~/quest` con los archivos suministrados:

  - `inventory.ini`.

  - `ansible.cfg`.

  - `message.j2`.

  - `rollout.yml`.

  - `route-declarations.yml`.

  - `template-contract.json`.


  **Requisitos:**


  - En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` identifica a ese mismo host en la línea
  `station`.

  - En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` contiene la línea completa `route=north`.
  La plantilla suministrada también respeta las entradas cambiantes de host y ruta declaradas en `template-contract.json`;
  su capacidad actual de renderizado se verifica aparte de los banners almacenados.'
stages.0.brief: Las identidades remotas deben ser distintas y compartir la ruta.
stages.0.objectives.0.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` identifica a
  ese mismo host en la línea `station`.
stages.0.objectives.1.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` contiene la
  línea completa `route=north`. La plantilla suministrada también respeta las entradas cambiantes de host y ruta
  declaradas en `template-contract.json`; su capacidad actual de renderizado se verifica aparte de los banners almacenados.
hints.0.text: Una plantilla se evalúa en el controlador con el contexto del host actual. Un registro no equivale
  a un nombre de host ni a un mapa indexado por host. Distingue errores de contexto de texto válido con una ruta
  constante.
hints.1.text: 'Compara el contexto de la plantilla con los datos declarados y observa el error real de renderizado.
  Las variables de host del inventario y una tabla de entradas por host son observaciones distintas.


  ```sh

  cd ~/quest

  cat message.j2 route-declarations.yml template-contract.json

  ansible-inventory --list

  ansible-playbook rollout.yml --check --diff

  ```'
hints.2.text: 'Aplica las entradas actuales y luego usa check mode con otras entradas. Cada identidad debe seguir
  siendo correcta, las diferencias de ruta deben seguir los datos y check mode no debe cambiar los banners almacenados.


  ```sh

  cd ~/quest

  ansible-playbook rollout.yml

  ansible fleet -m ansible.builtin.command -a ''cat /srv/site/message''

  ansible-playbook rollout.yml --check --diff -e ''{"station_routes":{"app1":{"active":"south"},"app2":{"active":"east"},"app3":{"active":"north"}}}''

  ```'
debrief: Las identidades y la ruta coincidieron, y la plantilla actual renderizó las entradas alternativas declaradas.
  Se verifica la capacidad actual, no toda la historia de entrega.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el resultado en cada host administrado.
diagnostics.identity_1: |-
  El banner de app1 puede indicar otra station si la plantilla usa un valor fijo en vez del host actual. [Guía](guides#guide=ansible-7&section=rendering-station-routes)
diagnostics.identity_2: |-
  El banner de app2 puede indicar otra station si la plantilla usa un valor fijo en vez del host actual. [Guía](guides#guide=ansible-7&section=rendering-station-routes)
diagnostics.identity_3: |-
  El banner de app3 puede indicar otra station si la plantilla usa un valor fijo en vez del host actual. [Guía](guides#guide=ansible-7&section=rendering-station-routes)
diagnostics.route_1: |-
  El banner de app1 puede conservar otra ruta si la plantilla lee el registro de otro host o no se entregó la versión actualizada. [Guía](guides#guide=ansible-7&section=rendering-station-routes)
diagnostics.route_2: |-
  El banner de app2 puede conservar otra ruta si la plantilla lee el registro de otro host o no se entregó la versión actualizada. [Guía](guides#guide=ansible-7&section=rendering-station-routes)
diagnostics.route_3: |-
  El banner de app3 puede conservar otra ruta si la plantilla lee el registro de otro host o no se entregó la versión actualizada. [Guía](guides#guide=ansible-7&section=rendering-station-routes)
diagnostics.template_render: |-
  La plantilla no pudo renderizar las entradas del llamador. Un valor indefinido o una estructura distinta puede invalidar el contexto suministrado. [Guía](guides#guide=ansible-7&section=rendering-station-routes)
diagnostics.template_inputs: |-
  Las líneas de estación o ruta no siguen las entradas. Una constante o una búsqueda en el contexto de otro host puede producir una vez un banner almacenado correcto. [Guía](guides#guide=ansible-7&section=rendering-station-routes)
diagnostics.template_observation: |-
  La prueba de renderizado puede fallar si se supera su tiempo o no se pueden leer los archivos esperados. [Guía](guides#guide=ansible-7&section=rendering-station-routes)
diagnostics.probe_0_1: |-
  La falta de Python o del módulo de prueba puede interrumpir la comprobación antes de informar de una condición. [Guía](guides#guide=ansible-7&section=rendering-station-routes)
