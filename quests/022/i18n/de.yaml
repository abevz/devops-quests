title: Vorlagenvariablen
brief: "Verschiedene Hosts zeigen dieselbe Identität.\n\nArbeiten Sie auf der Workstation in `~/quest` mit\
  \ `inventory.ini`, `ansible.cfg`, `message.j2`, `rollout.yml`.\n\n**Anforderungen:**\n- Nachrichtenzeilen\
  \ auf den verwalteten Hosts (`app1`, `app2`, `app3`):\n  - Pfad: `/srv/site/message`.\n  - `app1`: `station=app1`.\n\
  \  - `app2`: `station=app2`.\n  - `app3`: `station=app3`.\n- Gemeinsame vollständige Zeile: `route=north`.\n"
stages.0.brief: Die entfernten Identitäten müssen verschieden sein, während die Route gemeinsam ist.
stages.0.objectives.0.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) nennt `/srv/site/message` genau
  diesen Host in seiner `station`-Zeile.
stages.0.objectives.1.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/message`
  die vollständige Zeile `route=north`.
hints.0.text: Gemeinsame Konfiguration und individuelle Hostidentität sind verschiedene Teile einer Flottenmeldung.
hints.1.text: 'Überprüfen Sie die Jinja-Vorlage und jede gerenderte Hostdatei.


  Eine Konstante app1 kann nicht alle drei Stationen identifizieren.


  Prüfen Sie die mitgelieferten Eingaben und den Ausführungsumfang:


  ```sh

  cat message.j2 rollout.yml

  ansible-inventory -i inventory.ini --list

  ```'
hints.2.text: 'Rendern Sie inventory_hostname und route=north und führen Sie dann template task erneut aus.


  Prüfen Sie das beobachtete Ergebnis:


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''cat /srv/site/message''` — zeigt station=app1/app2/app3;
  route=north von jedem verwalteten Host.


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''grep -x route=north /srv/site/message''`
  — gibt die vollständige Zeile route=north auf jedem verwalteten Host aus.'
debrief: Ein fest codierter Name erreichte jeden station. Sie haben inventory_hostname verwendet und auf jedem
  Host eine eigene gerenderte Datei überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe das Ergebnis auf jedem verwalteten Host überprüft.
diagnostics.identity_1: Auf app1 enthält /srv/site/message die vollständige Zeile station=app1.
diagnostics.identity_2: Auf app2 enthält /srv/site/message die vollständige Zeile station=app2.
diagnostics.identity_3: Auf app3 enthält /srv/site/message die vollständige Zeile station=app3.
diagnostics.route_1: Auf app1 enthält /srv/site/message die vollständige Zeile route=north.
diagnostics.route_2: Auf app2 enthält /srv/site/message die vollständige Zeile route=north.
diagnostics.route_3: Auf app3 enthält /srv/site/message die vollständige Zeile route=north.
