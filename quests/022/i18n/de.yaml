title: Vorlagenvariablen
brief: 'Die Flottenbanner entsprechen den Stationseingaben nicht. Stelle die aktuellen Banner und das Verhalten
  der bereitgestellten Vorlage bei wechselnden Routeneingaben wieder her.


  Arbeite auf der Workstation in `~/quest` mit den bereitgestellten Dateien:

  - `inventory.ini`.

  - `ansible.cfg`.

  - `message.j2`.

  - `rollout.yml`.

  - `route-declarations.yml`.

  - `template-contract.json`.


  **Anforderungen:**


  - Auf jedem verwalteten Host (`app1`, `app2`, `app3`) nennt `/srv/site/message` genau diesen Host in seiner `station`-Zeile.

  - Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/message` die vollständige Zeile `route=north`.
  Die bereitgestellte Vorlage berücksichtigt auch die wechselnden Host- und Routeneingaben aus `template-contract.json`;
  ihre aktuelle Rendering-Fähigkeit wird getrennt von gespeicherten Flottenbannern geprüft.'
stages.0.brief: Die entfernten Identitäten müssen verschieden sein, während die Route gemeinsam ist.
stages.0.objectives.0.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) nennt `/srv/site/message` genau
  diesen Host in seiner `station`-Zeile.
stages.0.objectives.1.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/message` die
  vollständige Zeile `route=north`. Die bereitgestellte Vorlage berücksichtigt auch die wechselnden Host- und Routeneingaben
  aus `template-contract.json`; ihre aktuelle Rendering-Fähigkeit wird getrennt von gespeicherten Flottenbannern
  geprüft.
hints.0.text: Eine Vorlage wird auf dem Controller im Kontext des aktuellen Hosts ausgewertet. Ein Datensatz unterscheidet
  sich von einem Hostnamen oder einer nach Hosts indizierten Zuordnung. Trenne Kontextfehler von gültigem Text mit
  einer konstanten Route.
hints.1.text: 'Vergleiche den Vorlagenkontext mit den deklarierten Daten und untersuche den tatsächlichen Rendering-Fehler.
  Inventory-Hostvariablen und eine nach Hosts indizierte Eingabetabelle sind verschiedene Beobachtungen.


  ```sh

  cd ~/quest

  cat message.j2 route-declarations.yml template-contract.json

  ansible-inventory --list

  ansible-playbook rollout.yml --check --diff

  ```'
hints.2.text: 'Wende die aktuellen Eingaben an und verwende dann Check-Mode mit anderen Eingaben. Jede Stationsidentität
  muss stimmen, Routendifferenzen müssen den Daten folgen, und Check-Mode darf gespeicherte Banner nicht ändern.


  ```sh

  cd ~/quest

  ansible-playbook rollout.yml

  ansible fleet -m ansible.builtin.command -a ''cat /srv/site/message''

  ansible-playbook rollout.yml --check --diff -e ''{"station_routes":{"app1":{"active":"south"},"app2":{"active":"east"},"app3":{"active":"north"}}}''

  ```'
debrief: Die Flottenidentitäten und Route stimmten; die aktuelle Vorlage renderte auch die deklarierten alternativen
  Eingaben. Geprüft wird die aktuelle Fähigkeit, nicht die gesamte Auslieferungsgeschichte.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe das Ergebnis auf jedem verwalteten Host überprüft.
diagnostics.identity_1: |-
  Das Banner auf app1 kann eine falsche station nennen, wenn die Vorlage einen festen Wert statt des aktuellen Inventarhosts verwendet. [Leitfaden](guides#guide=ansible-7&section=rendering-station-routes)
diagnostics.identity_2: |-
  Das Banner auf app2 kann eine falsche station nennen, wenn die Vorlage einen festen Wert statt des aktuellen Inventarhosts verwendet. [Leitfaden](guides#guide=ansible-7&section=rendering-station-routes)
diagnostics.identity_3: |-
  Das Banner auf app3 kann eine falsche station nennen, wenn die Vorlage einen festen Wert statt des aktuellen Inventarhosts verwendet. [Leitfaden](guides#guide=ansible-7&section=rendering-station-routes)
diagnostics.route_1: |-
  Das Banner auf app1 kann die falsche Route behalten, wenn die Vorlage einen anderen Hostdatensatz liest oder das Update nicht zugestellt wurde. [Leitfaden](guides#guide=ansible-7&section=rendering-station-routes)
diagnostics.route_2: |-
  Das Banner auf app2 kann die falsche Route behalten, wenn die Vorlage einen anderen Hostdatensatz liest oder das Update nicht zugestellt wurde. [Leitfaden](guides#guide=ansible-7&section=rendering-station-routes)
diagnostics.route_3: |-
  Das Banner auf app3 kann die falsche Route behalten, wenn die Vorlage einen anderen Hostdatensatz liest oder das Update nicht zugestellt wurde. [Leitfaden](guides#guide=ansible-7&section=rendering-station-routes)
diagnostics.template_render: |-
  Die Vorlage konnte die Aufrufereingaben nicht rendern. Ein undefinierter Wert oder eine andere Datenform kann den bereitgestellten Kontext ungültig machen. [Leitfaden](guides#guide=ansible-7&section=rendering-station-routes)
diagnostics.template_inputs: |-
  Stations- oder Routenzeilen folgen den Aufrufereingaben nicht. Eine Konstante oder eine Suche im falschen Hostkontext kann einmalig trotzdem ein korrekt gespeichertes Banner ergeben. [Leitfaden](guides#guide=ansible-7&section=rendering-station-routes)
diagnostics.template_observation: |-
  Die Rendering-Prüfung kann fehlschlagen, wenn das Zeitbudget überschritten wird oder erwartete Ausgabedateien nicht lesbar sind. [Leitfaden](guides#guide=ansible-7&section=rendering-station-routes)
diagnostics.probe_0_1: |-
  Ein fehlender Python-Interpreter oder ein fehlendes Prüfmodul kann die Prüfung vor einem Einzelergebnis abbrechen. [Leitfaden](guides#guide=ansible-7&section=rendering-station-routes)
