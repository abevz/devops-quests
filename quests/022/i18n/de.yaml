title: Vorlagenvariablen
brief: 'Sie sind dem Betrieb SignalRail beigetreten. Zwei Stationen trugen den gleichen Namen. Arbeiten
  Sie in ~/quest.. Bewahren Sie alle Änderungen in diesem Schulungsbereich auf.


  Eingaben in `~/quest`: `inventory.ini`, `ansible.cfg`, `message.j2`, `rollout.yml`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur die bereitgestellten Dateien,
  vorinstallierten Bilder und privaten Dienste. Alle Änderungen müssen innerhalb dieser Bucht bleiben.


  Erste Erfolgskriterien: Jeder Host message enthält seinen eigenen station=app1/app2/app3 und route=north.'
stages.0.brief: 'Jeder Host benötigt seinen eigenen station-Namen und route=north in der Vorlagenausgabe.


  Erfolgskriterien: Jeder Host message enthält seinen eigenen station=app1/app2/app3 und route=north.'
stages.0.objectives.0.text: Jeder Host message enthält seinen eigenen station=app1/app2/app3 und route=north.
hints.0.text: Überprüfen Sie die Jinja-Vorlage und jede gerenderte Hostdatei.
hints.1.text: Eine Konstante app1 kann nicht alle drei Stationen identifizieren.
hints.2.text: Rendern Sie inventory_hostname und route=north und führen Sie dann template task erneut
  aus.
debrief: Ein fest codierter Name erreichte jeden station. Sie haben inventory_hostname verwendet und auf
  jedem Host eine eigene gerenderte Datei überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe das Ergebnis auf jedem verwalteten Host überprüft.
