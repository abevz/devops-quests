title: Contratos cruzados
brief: |-
  Los consumidores no coinciden con el contrato de ruta requerido.

  Trabaja en la workstation en `~/quest` con `main.tf`, `modules/station/main.tf`, `rollout.yml`, `inventory.ini`, `ansible.cfg`, `route.yaml`, `board.yaml`.

  **Requisitos:**
  - Salidas raíz:
    - Nombre de salida: `managed_id`.
    - La salida `managed_id` conserva el ID del recurso asignado originalmente por el proveedor.
  - Archivos en la workstation:
    - `~/quest/managed-route.txt`: `north-98`.
  - Salidas raíz:
    - La salida `contract` tiene `route` con el valor `north-98`.
  - Archivos en la workstation:
    - Ruta: `~/quest/contract.json`.
    - Campo `route`: `north-98`.
  - Convergencia de infraestructura:
    - Sin cambios de infraestructura pendientes; código de salida del plan detallado `0`.
  - Archivo en cada host administrado (`app1`, `app2`, `app3`):
    - Ruta: `/srv/site/message`.
    - Contenido: `north-98`.
    - Texto exacto, opcionalmente seguido de un salto de línea.
    - Modo de acceso: `0644`.
  - HTTP en cada host administrado (`app1`, `app2`, `app3`):
    - Puerto y ruta: `8080`, `/`.
    - Respuesta: `north-98`.
  - Datos de ruta en el namespace de la bahía:
    - El ConfigMap de ruta suministrado proporciona `north-98`.
  - Consumidor en el namespace de la bahía:
    - Deployment: `board`.
    - Réplicas: `1`.
    - El Deployment `board` tiene una réplica y su contenedor activo recibe `north-98` mediante el contrato de entorno suministrado.
    - Desde dentro del contenedor `board`, HTTP `http://board:8080` devuelve `north-98`.

  La comprobación observa los valores actuales y las restricciones conservadas de referencia de salida, no si se revisó un plan ni cómo se suministraron los consumidores.
debrief: Las comprobaciones observaron valores coincidentes del productor, la flota y board, el ID conservado
  y la referencia de salida del módulo.
stages.0.brief: El productor y cada consumidor deben cumplir el contrato de ruta.
hints.0.text: Un contrato productor puede abastecer a varios consumidores gestionados de forma independiente.
hints.1.text: |-
  Empieza por el productor: un valor de salida obsoleto puede hacer que varios consumidores sanos muestren de forma consistente un resultado incorrecto. Deriva la salida raíz directamente de local_file.contract.content y regenera contract.json con tofu output -json contract.

  Inspecciona la configuración suministrada y las observaciones actuales en la workstation:

  ```sh
  cat main.tf modules/station/main.tf route.yaml board.yaml
  tofu state list
  ```
hints.2.text: |-
  Usa el contrato tanto para Ansible como para ConfigMap; los Pods que usan variables de entorno necesitan reiniciarse.

  Verifica el resultado desde `~/quest` en la workstation:

  - `cat managed-route.txt; tofu output -raw managed_id; printf '\n'; cat /run/dq/facts/0/original-id; tofu output -json contract; cat contract.json; tofu plan -input=false -detailed-exitcode -no-color` — El productor y ambos contratos muestran `north-98`, el ID coincide con su comprobante y el plan termina con `0`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'cat -A /srv/site/message; ls -l /srv/site/message'; for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done` — Cada host muestra `north-98` con como máximo un marcador de fin de línea, modo de archivo `-rw-r--r--` y respuesta HTTP `north-98`.
  - `kubectl get configmap route -o jsonpath='{.data.route}'; printf '\n'; kubectl get deployment board -o custom-columns=NAME:.metadata.name,REPLICAS:.spec.replicas; kubectl exec --pod-running-timeout=5s deployment/board -c worker -- printenv ROUTE; kubectl exec --pod-running-timeout=5s deployment/board -c worker -- wget -qO- -T 3 http://board:8080` — El ConfigMap `route`, el `ROUTE` activo y la respuesta HTTP de `board` muestran `north-98`; el Deployment `board` tiene el número deseado de réplicas `1`.
phrases.0: Rastreé a los consumidores inconsistentes hasta una producción obsoleta del productor.
phrases.1: Propagué un contrato entre la configuración y runtime.
phrases.2: Verifiqué identity y a cada consumidor vivo después de la conciliación.
diagnostics.managed_id: La salida managed_id de OpenTofu debe coincidir con original-id no vacío.
diagnostics.route_file: managed-route.txt debe ser igual a north-98.
diagnostics.contract_output: |-
  OpenTofu contract debe publicar route como north-98; se permiten otras entradas.

diagnostics.contract_file: |-
  contract.json debe publicar route como north-98; se permiten otras entradas.

diagnostics.plan: El plan de OpenTofu debe terminar con código 0.
diagnostics.reference: |-
  La salida route del módulo debe transmitir el contenido del archivo productor gestionado.

diagnostics.configmap: |-
  ConfigMap route debe publicar route como north-98; se permiten otras entradas.

diagnostics.replicas: Las réplicas del Deployment board deben ser 1.
diagnostics.board_env: |-
  El worker activo de board debe recibir ROUTE=north-98 mediante la referencia al ConfigMap suministrado, sin valor incrustado.

diagnostics.board_http: La petición a board:8080 debe devolver north-98.
diagnostics.content_1: En app1, /srv/site/message debe contener exactamente north-98, opcionalmente seguido
  de un salto de línea.
diagnostics.mode_1: En app1, el modo de /srv/site/message debe ser 644.
diagnostics.http_1: app1 en el puerto 8080 debe devolver north-98.
diagnostics.content_2: En app2, /srv/site/message debe contener exactamente north-98, opcionalmente seguido
  de un salto de línea.
diagnostics.mode_2: En app2, el modo de /srv/site/message debe ser 644.
diagnostics.http_2: app2 en el puerto 8080 debe devolver north-98.
diagnostics.content_3: En app3, /srv/site/message debe contener exactamente north-98, opcionalmente seguido
  de un salto de línea.
diagnostics.mode_3: En app3, el modo de /srv/site/message debe ser 644.
diagnostics.http_3: app3 en el puerto 8080 debe devolver north-98.
stages.0.objectives.0.text: La salida `managed_id` conserva el ID del recurso asignado originalmente por
  el proveedor.
stages.0.objectives.1.text: El archivo productor y los contratos publicados en la workstation, los servicios
  HTTP de la flota, la configuración de ruta suministrada y la respuesta de `board` indican `north-98`.
stages.0.objectives.2.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` contiene
  exactamente `north-98`, opcionalmente seguido de un salto de línea, con modo `0644`.
stages.0.objectives.3.text: OpenTofu no informa cambios de infraestructura pendientes.
stages.0.objectives.4.text: El Deployment `board` tiene una réplica y su contenedor activo recibe `north-98`
  mediante el contrato de entorno suministrado.
