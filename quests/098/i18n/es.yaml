title: Contratos cruzados
brief: |-
  Los consumidores no coinciden con el contrato de ruta requerido.

  Trabaja en la workstation en `~/quest` con `main.tf`, `modules/station/main.tf`, `rollout.yml`, `inventory.ini`, `ansible.cfg`, `route.yaml`, `board.yaml`.

  **Requisitos:**
  - Salidas raíz:
    - Nombre de salida: `managed_id`.
    - La salida `managed_id` conserva el ID del recurso asignado originalmente por el proveedor.
  - Archivos en la workstation:
    - `~/quest/managed-route.txt`: `north-98`.
  - Salidas raíz:
    - La salida `contract` tiene `route` con el valor `north-98`.
  - Archivos en la workstation:
    - Ruta: `~/quest/contract.json`.
    - Campo `route`: `north-98`.
  - Los contratos publicados obtienen su ruta del archivo productor administrado.
  - Convergencia de infraestructura:
    - Sin cambios de infraestructura pendientes; código de salida del plan detallado `0`.
  - Archivo en cada host administrado (`app1`, `app2`, `app3`):
    - Ruta: `/srv/site/message`.
    - Contenido: `north-98`.
    - Texto exacto, opcionalmente seguido de un salto de línea.
    - Modo de acceso: `0644`.
  - HTTP en cada host administrado (`app1`, `app2`, `app3`):
    - Puerto y ruta: `8080`, `/`.
    - Respuesta: `north-98`.
  - Datos de ruta en el namespace de la bahía:
    - El ConfigMap de ruta suministrado proporciona `north-98`.
  - Consumidor en el namespace de la bahía:
    - Deployment: `board`.
    - Réplicas: `1`.
    - El Deployment `board` tiene una réplica y su contenedor activo recibe `north-98` mediante el contrato de entorno suministrado.
    - Desde dentro del contenedor `board`, HTTP `http://board:8080` devuelve `north-98`.

  La comprobación observa los valores actuales y las restricciones conservadas de referencia de salida, no si se revisó un plan ni cómo se suministraron los consumidores.
debrief: Las comprobaciones observaron valores coincidentes del productor, la flota y board, el ID conservado
  y la referencia de salida del módulo.
stages.0.brief: El productor y cada consumidor deben cumplir el contrato de ruta.
hints.0.text: Un contrato productor puede abastecer a varios consumidores gestionados de forma independiente.
hints.1.text: |-
  Revisa la expresión de salida raíz del productor y contrástala con el archivo gestionado del contrato. Localiza dónde Ansible lee el contrato y de dónde toma el Pod su entorno en el ConfigMap.

  ```sh
  cat main.tf modules/station/main.tf
  cat route.yaml board.yaml
  tofu state list
  ```
hints.2.text: |-
  Verifica el resultado desde `~/quest` en la workstation:

  - `cat managed-route.txt; tofu output -raw managed_id; printf '\n'; cat /run/dq/facts/0/original-id; tofu output -json contract; cat contract.json; tofu plan -input=false -detailed-exitcode -no-color` — El productor y ambos contratos muestran `north-98`, el ID coincide con su comprobante y el plan termina con `0`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'cat -A /srv/site/message; ls -l /srv/site/message'; for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done` — Cada host muestra `north-98` con como máximo un marcador de fin de línea, modo de archivo `-rw-r--r--` y respuesta HTTP `north-98`.
  - `kubectl get configmap route -o jsonpath='{.data.route}'; printf '\n'; kubectl get deployment board -o custom-columns=NAME:.metadata.name,REPLICAS:.spec.replicas; kubectl exec --pod-running-timeout=5s deployment/board -c worker -- printenv ROUTE; kubectl exec --pod-running-timeout=5s deployment/board -c worker -- wget -qO- -T 3 http://board:8080` — El ConfigMap `route`, el `ROUTE` activo y la respuesta HTTP de `board` muestran `north-98`; el Deployment `board` tiene el número deseado de réplicas `1`.
phrases.0: Rastreé a los consumidores inconsistentes hasta una producción obsoleta del productor.
phrases.1: Propagué un contrato entre la configuración y runtime.
phrases.2: Verifiqué identity y a cada consumidor vivo después de la conciliación.
stages.0.objectives.0.text: La salida `managed_id` conserva el ID del recurso asignado originalmente por
  el proveedor.
stages.0.objectives.1.text: |-
  El archivo productor y los contratos publicados en la estación de trabajo, los servicios HTTP de la flota, la configuración de ruta suministrada y la respuesta de `board` indican `north-98`; los contratos publicados obtienen su ruta del archivo productor administrado.
stages.0.objectives.2.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` contiene
  exactamente `north-98`, opcionalmente seguido de un salto de línea, con modo `0644`.
stages.0.objectives.3.text: OpenTofu no informa cambios de infraestructura pendientes.
stages.0.objectives.4.text: El Deployment `board` tiene una réplica y su contenedor activo recibe `north-98`
  mediante el contrato de entorno suministrado.
diagnostics.managed_id: La salida del estado puede faltar o corresponder a un recurso recreado. Revise el recurso original y conserve su identidad al actualizar el módulo. [Causa y comprobación](guides#guide=terraform-7.1&section=q098-retained-identity)
diagnostics.route_file: El archivo gestionado puede faltar o contener otra ruta. Revise el recurso y el archivo aplicado antes de propagar el valor. [Causa y comprobación](guides#guide=terraform-7.1&section=q098-producer-file)
diagnostics.contract_output: La salida raíz puede seguir usando la antigua salida del módulo. Siga la ruta desde el archivo hasta el contrato raíz aplicado. [Causa y comprobación](guides#guide=terraform-7.1&section=q098-root-contract)
diagnostics.contract_file: El JSON de trabajo puede proceder de una exportación anterior. Tras corregir la salida raíz, vuelva a exportar el contrato. [Causa y comprobación](guides#guide=terraform-7.1&section=q098-published-contract)
diagnostics.plan: Un cambio pendiente da código 2 y un error de planificación da 1. Revise la deriva, el reemplazo inesperado y la configuración hasta obtener el código 0. [Causa y comprobación](guides#guide=terraform-7.1&section=q098-clean-plan)
diagnostics.reference: Un literal o una referencia sin usar puede coincidir con la ruta. Siga la expresión de salida a través de locals hasta content del recurso y quite el salto final si hace falta. [Causa y comprobación](guides#guide=terraform-7.1&section=q098-module-file-reference)
diagnostics.configmap: El ConfigMap puede faltar o conservar el valor anterior. Tras publicar el contrato, revise la clave route en el clúster. [Causa y comprobación](guides#guide=terraform-7.1&section=q098-published-configmap)
diagnostics.replicas: El Deployment board puede faltar o solicitar otro número de réplicas. Revise la cantidad deseada en su especificación. [Causa y comprobación](guides#guide=terraform-7.1&section=q098-board-replicas)
diagnostics.board_env: Un entorno antiguo del contenedor worker o una referencia incorrecta al ConfigMap puede mantener la ruta anterior. Compruebe la única entrada ROUTE con route/route y el valor del worker tras el despliegue. [Causa y comprobación](guides#guide=terraform-7.1&section=q098-worker-route-config)
diagnostics.board_http: El Service puede dirigir a Pods antiguos, carecer de endpoints listos o devolver la ruta anterior. Revise la respuesta HTTP cuando el worker actualizado esté listo. [Causa y comprobación](guides#guide=terraform-7.1&section=q098-board-service)
diagnostics.content_1: El archivo del host señalado puede estar obsoleto o ser ilegible. Compare sus bytes con north-98 con cero o un salto final y revise el acceso al host. [Causa y comprobación](guides#guide=terraform-7.1&section=q098-fleet-file-content)
diagnostics.content_2: El archivo del host señalado puede estar obsoleto o ser ilegible. Compare sus bytes con north-98 con cero o un salto final y revise el acceso al host. [Causa y comprobación](guides#guide=terraform-7.1&section=q098-fleet-file-content)
diagnostics.content_3: El archivo del host señalado puede estar obsoleto o ser ilegible. Compare sus bytes con north-98 con cero o un salto final y revise el acceso al host. [Causa y comprobación](guides#guide=terraform-7.1&section=q098-fleet-file-content)
diagnostics.mode_1: El despliegue puede haber escrito los bytes correctos con permisos incorrectos. Compruebe el modo 644 y el acceso al host señalado. [Causa y comprobación](guides#guide=terraform-7.1&section=q098-fleet-file-mode)
diagnostics.mode_2: El despliegue puede haber escrito los bytes correctos con permisos incorrectos. Compruebe el modo 644 y el acceso al host señalado. [Causa y comprobación](guides#guide=terraform-7.1&section=q098-fleet-file-mode)
diagnostics.mode_3: El despliegue puede haber escrito los bytes correctos con permisos incorrectos. Compruebe el modo 644 y el acceso al host señalado. [Causa y comprobación](guides#guide=terraform-7.1&section=q098-fleet-file-mode)
diagnostics.http_1: El host puede tener el archivo actualizado y seguir sirviendo la respuesta anterior o no responder. Compruebe el puerto 8080 del host señalado y compare el cuerpo con north-98. [Causa y comprobación](guides#guide=terraform-7.1&section=q098-fleet-http)
diagnostics.http_2: El host puede tener el archivo actualizado y seguir sirviendo la respuesta anterior o no responder. Compruebe el puerto 8080 del host señalado y compare el cuerpo con north-98. [Causa y comprobación](guides#guide=terraform-7.1&section=q098-fleet-http)
diagnostics.http_3: El host puede tener el archivo actualizado y seguir sirviendo la respuesta anterior o no responder. Compruebe el puerto 8080 del host señalado y compare el cuerpo con north-98. [Causa y comprobación](guides#guide=terraform-7.1&section=q098-fleet-http)
diagnostics.probe_0_1: La sonda puede detenerse antes de identificar un fallo si faltan el directorio, las entradas del plan o las herramientas. Revise el entorno y compruebe por separado archivo, contrato y clúster. [Causa y comprobación](guides#guide=terraform-7.1&section=q098-cross-stack-observation)
