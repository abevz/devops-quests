title: Contratos cruzados
brief: 'El archivo local administrado ya contiene north-98, pero la salida del módulo aún exporta retired-98.
  Tanto la flota Ansible como un consumidor Kubernetes dependen de ese contrato de producción. Repare
  la salida del módulo derivándola de local_file.contract.content, conserve el recurso administrado ID,
  aplique el cambio de solo salida revisado y regenere contract.json. Alimente ese mismo contrato a rollout.yml
  y ConfigMap route, luego reinicie el consumidor basado en env. No codifique el éxito de forma independiente
  en cada consumidor.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `main.tf`, `modules/station/main.tf`,
  `managed-route.txt`, `original-id`, `contract.json`, `rollout.yml`, `route.json`, `board.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: se conserva el recurso ID, el módulo outputs y el contrato están de acuerdo,
  todos los objetivos de la flota y el Pod respaldado por ConfigMap sirven a north-98, y el plan final
  está vacío.'
debrief: Un único contrato de productor corregido ahora impulsa ambos sistemas posteriores sin reemplazo
  de recursos.
stages.0.brief: 'Criterios de éxito: el recurso ID se conserva, el módulo outputs y el contrato están
  de acuerdo, todos los objetivos de la flota y el Pod respaldado por ConfigMap sirven a north-98, y el
  plan final está vacío.'
stages.0.objectives.0.text: El recurso ID se conserva, el módulo outputs y el contrato están de acuerdo,
  todos los objetivos de la flota y el Pod respaldado por ConfigMap sirven a north-98, y el plan final
  está vacío.
hints.0.text: 'Comience por el productor: una producción obsoleta puede hacer que muchos consumidores
  sanos se equivoquen sistemáticamente.'
hints.1.text: Obtenga el resultado del archivo administrado y luego regenere un contrato.
hints.2.text: Utilice el contrato tanto para Ansible como para ConfigMap; Los pods basados ​​en env necesitan
  reiniciarse.
phrases.0: Rastreé a los consumidores inconsistentes hasta una producción obsoleta del productor.
phrases.1: Propagué un contrato entre la configuración y runtime.
phrases.2: Verifiqué identity y a cada consumidor vivo después de la conciliación.
