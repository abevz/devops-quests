title: Contratos cruzados
brief: 'Trabaja en `~/quest`. `main.tf` llama a `modules/station/main.tf`: su archivo gestionado `managed-route.txt` contiene
  `north-98`, pero su salida está obsoleta. El estado de OpenTofu conserva un ID de recurso; mantén el ID de `original-id`.
  Haz que la salida route del módulo referencie `local_file.contract.content`, aplica y escribe la salida en `contract.json`
  con `tofu output -json contract > contract.json`. Tanto la salida como el archivo deben ser exactamente `{ "route": "north-98"
  }`, y el plan final con detailed-exitcode debe terminar con 0. El plan debe referenciar `local_file.contract.content` en
  la salida route del módulo.


  Usa `rollout.yml`, `inventory.ini` y `ansible.cfg` para la flota SSH privada: app1, app2 y app3 deben tener `/srv/site/message`
  igual a `north-98` con modo `0644`, y cada servicio HTTP en el puerto 8080 debe devolver `north-98`. El handler suministrado
  ejecuta `dq-service reload`; usa `ansible-playbook rollout.yml -e @contract.json`. Establece los datos del ConfigMap `route`
  exactamente en `{ "route": "north-98" }`. De `board.json`, conserva una réplica y exactamente una entrada de entorno del
  primer contenedor: `ROUTE` del ConfigMap `route`, clave `route`. Reinicia el Deployment para actualizar su entorno y comprueba
  que `board:8080` devuelve `north-98`. Las comprobaciones observan estos valores y la referencia de salida, no si se revisó
  el plan ni cómo se abasteció a cada consumidor. Usa solo la bahía sin conexión. El archivo de mensaje debe contener exactamente
  este texto, opcionalmente seguido de un salto de línea.'
debrief: Las comprobaciones observaron valores coincidentes del productor, la flota y board, el ID conservado y la referencia
  de salida del módulo.
stages.0.brief: El ID original, la referencia y valores de salida, el plan vacío, los archivos y respuestas de la flota y
  la configuración y respuesta de board coinciden con la descripción.
stages.0.objectives.0.text: El ID original, la referencia y valores de salida, el plan vacío, los archivos y respuestas de
  la flota y la configuración y respuesta de board coinciden con la descripción.
hints.0.text: 'Comience por el productor: una producción obsoleta puede hacer que muchos consumidores sanos se equivoquen
  sistemáticamente.'
hints.1.text: Obtenga el resultado del archivo administrado y luego regenere un contrato.
hints.2.text: Utilice el contrato tanto para Ansible como para ConfigMap; Los pods basados ​​en env necesitan reiniciarse.
phrases.0: Rastreé a los consumidores inconsistentes hasta una producción obsoleta del productor.
phrases.1: Propagué un contrato entre la configuración y runtime.
phrases.2: Verifiqué identity y a cada consumidor vivo después de la conciliación.
