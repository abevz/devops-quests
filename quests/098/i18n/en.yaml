title: Cross-stack contracts
brief: |-
  The consumers do not agree with the required route contract.

  Work on the workstation in `~/quest` with `main.tf`, `modules/station/main.tf`, `rollout.yml`, `inventory.ini`, `ansible.cfg`, `route.yaml`, `board.yaml`.

  **Requirements:**
  - Root outputs:
    - Output name: `managed_id`.
    - The `managed_id` output retains the resource ID originally assigned by the provider.
  - Files on the workstation:
    - `~/quest/managed-route.txt`: `north-98`.
  - Root outputs:
    - The `contract` output has `route` with value `north-98`.
  - Files on the workstation:
    - Path: `~/quest/contract.json`.
    - Field `route`: `north-98`.
  - The published contracts derive their route from the managed producer file.
  - Infrastructure convergence:
    - No pending infrastructure changes; detailed-plan exit code `0`.
  - File on every managed host (`app1`, `app2`, `app3`):
    - Path: `/srv/site/message`.
    - Content: `north-98`.
    - Exact text, optionally followed by one newline.
    - Access mode: `0644`.
  - HTTP on every managed host (`app1`, `app2`, `app3`):
    - Port and endpoint: `8080`, `/`.
    - Response: `north-98`.
  - Route data in the bay namespace:
    - The supplied route ConfigMap provides `north-98`.
  - Consumer in the bay namespace:
    - Deployment: `board`.
    - Replicas: `1`.
    - Deployment `board` has one replica, and its running container receives `north-98` through the supplied environment contract.
    - From inside the `board` container, HTTP `http://board:8080` returns `north-98`.

  The check observes current values and retained output-reference constraints, not whether a plan was reviewed or how consumers were supplied.
debrief: The checks observed matching producer, fleet and board values, the retained ID and the module
  output reference.
stages.0.brief: The producer and every consumer must meet the route contract.
hints.0.text: One producer contract can supply several independently managed consumers.
hints.1.text: |-
  Inspect the producer's root output expression and compare it with the managed contract file. Look for where Ansible reads the contract and where the Pod takes its environment from the ConfigMap.

  ```sh
  cat main.tf modules/station/main.tf
  cat route.yaml board.yaml
  tofu state list
  ```
hints.2.text: |-
  Verify the result from `~/quest` on the workstation:

  - `cat managed-route.txt; tofu output -raw managed_id; printf '\n'; cat /run/dq/facts/0/original-id; tofu output -json contract; cat contract.json; tofu plan -input=false -detailed-exitcode -no-color` — The producer and both contracts show `north-98`, the ID matches its receipt, and planning exits `0`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'cat -A /srv/site/message; ls -l /srv/site/message'; for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done` — Every host shows `north-98` with at most one end-of-line marker, file mode `-rw-r--r--`, and the HTTP response `north-98`.
  - `kubectl get configmap route -o jsonpath='{.data.route}'; printf '\n'; kubectl get deployment board -o custom-columns=NAME:.metadata.name,REPLICAS:.spec.replicas; kubectl exec --pod-running-timeout=5s deployment/board -c worker -- printenv ROUTE; kubectl exec --pod-running-timeout=5s deployment/board -c worker -- wget -qO- -T 3 http://board:8080` — ConfigMap `route`, the running `ROUTE` and the `board` HTTP response show `north-98`; Deployment `board` has desired replica count `1`.
phrases.0: I traced inconsistent consumers to a stale producer output.
phrases.1: I propagated one contract across configuration and runtime.
phrases.2: I verified identity and each live consumer after reconciliation.
stages.0.objectives.0.text: The `managed_id` output retains the resource ID originally assigned by the
  provider.
stages.0.objectives.1.text: |-
  The workstation producer file and published contracts, fleet HTTP services, supplied route configuration and `board` response all report `north-98`; the published contracts derive their route from the managed producer file.
stages.0.objectives.2.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` contains
  exactly `north-98`, optionally followed by one newline, with mode `0644`.
stages.0.objectives.3.text: OpenTofu reports no pending infrastructure changes.
stages.0.objectives.4.text: Deployment `board` has one replica, and its running container receives `north-98`
  through the supplied environment contract.
diagnostics.managed_id: The state output may be missing or refer to a recreated producer. Inspect the original resource in state and preserve its identity when updating the module. [Cause and check](guides#guide=terraform-7.1&section=q098-retained-identity)
diagnostics.route_file: The managed file may be absent or have the wrong route. Check the producer and its applied file before propagating the value. [Cause and check](guides#guide=terraform-7.1&section=q098-producer-file)
diagnostics.contract_output: The root output may still read the old module output. Follow the route from the producer through the module into the applied root contract. [Cause and check](guides#guide=terraform-7.1&section=q098-root-contract)
diagnostics.contract_file: The working JSON may have been exported before the root output was corrected. Once the output is current, regenerate the published contract from it. [Cause and check](guides#guide=terraform-7.1&section=q098-published-contract)
diagnostics.plan: An outstanding change yields exit 2, and a planning error yields exit 1. Inspect the plan for drift, unintended replacement or invalid configuration and confirm exit 0. [Cause and check](guides#guide=terraform-7.1&section=q098-clean-plan)
diagnostics.reference: A literal or an unused reference can match the route without forwarding the file. Follow the module output expression through any locals to the producer’s content and trim its terminal newline if needed. [Cause and check](guides#guide=terraform-7.1&section=q098-module-file-reference)
diagnostics.configmap: The ConfigMap may still contain the previous contract value or be missing. Check the live route key after publishing the new contract. [Cause and check](guides#guide=terraform-7.1&section=q098-published-configmap)
diagnostics.replicas: The board Deployment may be missing or specify a replica count other than one. Inspect its desired replica count. [Cause and check](guides#guide=terraform-7.1&section=q098-board-replicas)
diagnostics.board_env: A stale process environment or wrong ConfigMap reference can keep the old route. Inspect the worker’s single ROUTE entry for route/route and check the running worker after rollout. [Cause and check](guides#guide=terraform-7.1&section=q098-worker-route-config)
diagnostics.board_http: The Service may still reach older Pods, have no ready endpoints, or receive the old route. Check the live HTTP body after the updated worker becomes ready. [Cause and check](guides#guide=terraform-7.1&section=q098-board-service)
diagnostics.content_1: The flagged host may have a stale or unreadable message file. Compare its bytes to north-98 with zero or one trailing newline and check access to that host. [Cause and check](guides#guide=terraform-7.1&section=q098-fleet-file-content)
diagnostics.content_2: The flagged host may have a stale or unreadable message file. Compare its bytes to north-98 with zero or one trailing newline and check access to that host. [Cause and check](guides#guide=terraform-7.1&section=q098-fleet-file-content)
diagnostics.content_3: The flagged host may have a stale or unreadable message file. Compare its bytes to north-98 with zero or one trailing newline and check access to that host. [Cause and check](guides#guide=terraform-7.1&section=q098-fleet-file-content)
diagnostics.mode_1: The deployment may have written the right bytes with the wrong permissions. Verify mode 644 and access on the flagged host. [Cause and check](guides#guide=terraform-7.1&section=q098-fleet-file-mode)
diagnostics.mode_2: The deployment may have written the right bytes with the wrong permissions. Verify mode 644 and access on the flagged host. [Cause and check](guides#guide=terraform-7.1&section=q098-fleet-file-mode)
diagnostics.mode_3: The deployment may have written the right bytes with the wrong permissions. Verify mode 644 and access on the flagged host. [Cause and check](guides#guide=terraform-7.1&section=q098-fleet-file-mode)
diagnostics.http_1: A host may have updated its file but still serve an old response, or the request may fail. Check port 8080 on the flagged host and compare the actual body with north-98. [Cause and check](guides#guide=terraform-7.1&section=q098-fleet-http)
diagnostics.http_2: A host may have updated its file but still serve an old response, or the request may fail. Check port 8080 on the flagged host and compare the actual body with north-98. [Cause and check](guides#guide=terraform-7.1&section=q098-fleet-http)
diagnostics.http_3: A host may have updated its file but still serve an old response, or the request may fail. Check port 8080 on the flagged host and compare the actual body with north-98. [Cause and check](guides#guide=terraform-7.1&section=q098-fleet-http)
diagnostics.probe_0_1: The probe can stop before naming a condition when the workspace, plan inputs or local tools are unavailable. Check the workstation and try the producer, contract and cluster observations individually. [Cause and check](guides#guide=terraform-7.1&section=q098-cross-stack-observation)
