title: Cross-stack contracts
brief: 'The managed local file already contains north-98, but the module output still exports retired-98.
  Both the Ansible fleet and a Kubernetes consumer depend on that output contract. Repair the module output
  by deriving it from local_file.contract.content, preserve the managed resource ID, apply the reviewed
  output-only change and regenerate contract.json. Feed that same contract to rollout.yml and ConfigMap
  route, then restart the env-based consumer. Do not hard-code success independently in each consumer.


  Quest files in `~/quest` (some appear in later stages): `main.tf`, `modules/station/main.tf`, `managed-route.txt`,
  `original-id`, `contract.json`, `rollout.yml`, `route.json`, `board.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: The resource ID is preserved, module outputs and contract agree, all fleet
  targets and the ConfigMap-backed Pod serve north-98, and the final plan is empty.'
debrief: A single corrected producer contract now drives both downstream systems without resource replacement.
