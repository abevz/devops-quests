title: Cross-stack contracts
brief: 'Work in `~/quest`. `main.tf` calls `modules/station/main.tf`: its managed file `managed-route.txt` contains `north-98`,
  but its output is stale. OpenTofu state keeps a resource ID; retain the ID in `original-id`. Make the module route output
  reference `local_file.contract.content`, apply and write the output to `contract.json` with `tofu output -json contract
  > contract.json`. The output and file must each be exactly `{ "route": "north-98" }`, and the final detailed-exitcode plan
  must exit 0. The plan must reference `local_file.contract.content` in the module route output.


  Use `rollout.yml`, `inventory.ini` and `ansible.cfg` for the private SSH fleet: app1, app2 and app3 must have `/srv/site/message`
  equal to `north-98` with mode `0644`, and each HTTP service on port 8080 must return `north-98`. The supplied handler runs
  `dq-service reload`; use `ansible-playbook rollout.yml -e @contract.json`. Set ConfigMap `route` data exactly to `{ "route":
  "north-98" }`. From `board.json`, retain one replica and exactly one first-container environment entry: `ROUTE` from ConfigMap
  `route`, key `route`. Restart the Deployment to refresh its environment and verify `board:8080` returns `north-98`. The
  checks observe these values and the output reference, not whether a plan was reviewed or how each consumer was supplied.
  Use only the offline bay.'
debrief: The checks observed matching producer, fleet and board values, the retained ID and the module output reference.
stages.0.brief: The original ID, output reference and values, empty plan, fleet files and responses, and board configuration
  and response match the brief.
stages.0.objectives.0.text: The original ID, output reference and values, empty plan, fleet files and responses, and board
  configuration and response match the brief.
hints.0.text: 'Start at the producer: a stale output can make many healthy consumers consistently wrong.'
hints.1.text: Derive the output from the managed file, then regenerate one contract.
hints.2.text: Use the contract for both Ansible and ConfigMap; env-based Pods need a restart.
phrases.0: I traced inconsistent consumers to a stale producer output.
phrases.1: I propagated one contract across configuration and runtime.
phrases.2: I verified identity and each live consumer after reconciliation.
