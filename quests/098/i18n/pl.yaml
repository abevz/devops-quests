hints.0.text: 'Zacznij od producenta: nieaktualny output może sprawić, że wielu zdrowych konsumentów będzie
  stale się mylić.'
hints.1.text: Wyprowadź output z zarządzanego pliku, a następnie ponownie wygeneruj jeden kontrakt.
hints.2.text: Użyj kontraktu zarówno dla Ansible, jak i ConfigMap; Pody oparte na env wymagają ponownego
  uruchomienia.
phrases.0: Wyśledziłem niespójnych konsumentów do nieaktualnego producenta output.
phrases.1: Propagowałem jeden kontrakt w całej konfiguracji i runtime.
phrases.2: Po uzgodnieniu zweryfikowałem identity i każdego żywego konsumenta.
