title: Kontrakty cross-stackowe
brief: 'Zarządzany plik lokalny zawiera już north-98, ale moduł output nadal eksportuje retired-98. Zarówno
  flota Ansible, jak i konsument Kubernetes są uzależnieni od tej umowy output. Napraw moduł output, wywodząc
  go z local_file.contract.content, zachowaj zarządzany zasób ID, zastosuj sprawdzoną zmianę output i
  zregeneruj contract.json. Podaj ten sam kontrakt do rollout.yml i ConfigMap route, a następnie uruchom
  ponownie konsumenta opartego na env. Nie koduj sukcesu niezależnie u każdego konsumenta.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `main.tf`, `modules/station/main.tf`,
  `managed-route.txt`, `original-id`, `contract.json`, `rollout.yml`, `route.json`, `board.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: zasób ID jest zachowany, moduł outputs i umowa są zgodne, wszystkie cele
  floty i Pod oparte na ConfigMap obsługują north-98, a końcowy plan jest pusty.'
debrief: Pojedyncza poprawiona umowa producenta obsługuje obecnie oba systemy niższego szczebla bez wymiany
  zasobów.
stages.0.brief: 'Kryteria sukcesu: Zasób ID jest zachowany, moduł outputs i umowa są zgodne, wszystkie
  cele floty i Pod oparte na ConfigMap obsługują north-98, a końcowy plan jest pusty.'
stages.0.objectives.0.text: Zasób ID zostaje zachowany, moduł outputs i umowa są zgodne, wszystkie cele
