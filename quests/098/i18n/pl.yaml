diagnostics.http_3: Host app3 na porcie 8080 musi zwrócić north-98.
stages.0.objectives.0.text: Wyjście `managed_id` zachowuje ID zasobu pierwotnie nadany przez dostawcę.
stages.0.objectives.1.text: |-
  Plik producenta i opublikowane kontrakty na stacji roboczej, usługi HTTP floty, dostarczona konfiguracja trasy i odpowiedź `board` wskazują `north-98`; opublikowane kontrakty pobierają trasę z zarządzanego pliku producenta.
stages.0.objectives.2.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/message`
  zawiera dokładnie `north-98`, opcjonalnie z jednym końcowym znakiem nowego wiersza, i ma tryb `0644`.
stages.0.objectives.3.text: OpenTofu nie zgłasza oczekujących zmian infrastruktury.
stages.0.objectives.4.text: Deployment `board` ma jedną replikę, a jego działający kontener otrzymuje
  `north-98` przez dostarczony kontrakt środowiska.
diagnostics.probe_0_1: |-
  Bieżące dane nie pozwalają potwierdzić tego celu: Plik producenta i opublikowane kontrakty na stacji roboczej, usługi HTTP floty, dostarczona konfiguracja trasy i odpowiedź `board` wskazują `north-98`; opublikowane kontrakty pobierają trasę z zarządzanego pliku producenta.
