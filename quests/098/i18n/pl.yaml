title: Kontrakty cross-stackowe
brief: |-
  Odbiorcy nie są zgodni z wymaganym kontraktem trasy.

  Pracuj na workstation w `~/quest` z plikami `main.tf`, `modules/station/main.tf`, `rollout.yml`, `inventory.ini`, `ansible.cfg`, `route.yaml`, `board.yaml`.

  **Wymagania:**
  - Wyjścia główne:
    - Nazwa wyjścia: `managed_id`.
    - Wyjście `managed_id` zachowuje ID zasobu pierwotnie nadany przez dostawcę.
  - Pliki na workstation:
    - `~/quest/managed-route.txt`: `north-98`.
  - Wyjścia główne:
    - Wyjście `contract` zawiera `route` o wartości `north-98`.
  - Pliki na workstation:
    - Ścieżka: `~/quest/contract.json`.
    - Pole `route`: `north-98`.
  - Opublikowane kontrakty pobierają trasę z zarządzanego pliku producenta.
  - Zbieżność infrastruktury:
    - Brak oczekujących zmian infrastruktury; kod zakończenia szczegółowego planu `0`.
  - Plik na każdym zarządzanym hoście (`app1`, `app2`, `app3`):
    - Ścieżka: `/srv/site/message`.
    - Treść: `north-98`.
    - Dokładny tekst, opcjonalnie z jednym końcowym znakiem nowego wiersza.
    - Tryb dostępu: `0644`.
  - HTTP na każdym zarządzanym hoście (`app1`, `app2`, `app3`):
    - Port i ścieżka: `8080`, `/`.
    - Odpowiedź: `north-98`.
  - Dane trasy w przestrzeni nazw zatoki:
    - Dostarczony ConfigMap trasy przekazuje `north-98`.
  - Odbiorca w przestrzeni nazw zatoki:
    - Deployment: `board`.
    - Repliki: `1`.
    - Deployment `board` ma jedną replikę, a jego działający kontener otrzymuje `north-98` przez dostarczony kontrakt środowiska.
    - Wewnątrz kontenera `board` HTTP `http://board:8080` zwraca `north-98`.

  Sprawdzenie obserwuje bieżące wartości i zachowane ograniczenia odwołania wyjścia, a nie fakt przejrzenia planu ani sposób dostarczenia danych odbiorcom.
debrief: Kontrole wykazały zgodne wartości producenta, floty i board, zachowane ID oraz referencję output
  modułu.
stages.0.brief: Producent i każdy odbiorca muszą spełniać kontrakt trasy.
hints.0.text: Jeden kontrakt producenta może zasilać wielu niezależnie zarządzanych konsumentów.
hints.1.text: |-
  Sprawdź wyrażenie wyjścia głównego producenta i porównaj je z zarządzanym plikiem kontraktu. Odszukaj odczyt kontraktu w Ansible i źródło środowiska Poda w ConfigMap.

  ```sh
  cat main.tf modules/station/main.tf
  cat route.yaml board.yaml
  tofu state list
  ```
hints.2.text: |-
  Sprawdź wynik z `~/quest` na workstation:

  - `cat managed-route.txt; tofu output -raw managed_id; printf '\n'; cat /run/dq/facts/0/original-id; tofu output -json contract; cat contract.json; tofu plan -input=false -detailed-exitcode -no-color` — Producent i oba kontrakty pokazują `north-98`, ID jest zgodny z potwierdzeniem, a plan kończy się kodem `0`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'cat -A /srv/site/message; ls -l /srv/site/message'; for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done` — Każdy host pokazuje `north-98` z najwyżej jednym znacznikiem końca wiersza, tryb pliku `-rw-r--r--` i odpowiedź HTTP `north-98`.
  - `kubectl get configmap route -o jsonpath='{.data.route}'; printf '\n'; kubectl get deployment board -o custom-columns=NAME:.metadata.name,REPLICAS:.spec.replicas; kubectl exec --pod-running-timeout=5s deployment/board -c worker -- printenv ROUTE; kubectl exec --pod-running-timeout=5s deployment/board -c worker -- wget -qO- -T 3 http://board:8080` — ConfigMap `route`, działające `ROUTE` i odpowiedź HTTP `board` pokazują `north-98`; Deployment `board` ma żądaną liczbę replik `1`.
phrases.0: Wyśledziłem niespójnych konsumentów do nieaktualnego producenta output.
phrases.1: Propagowałem jeden kontrakt w całej konfiguracji i runtime.
phrases.2: Po uzgodnieniu zweryfikowałem identity i każdego żywego konsumenta.
stages.0.objectives.0.text: Wyjście `managed_id` zachowuje ID zasobu pierwotnie nadany przez dostawcę.
stages.0.objectives.1.text: |-
  Plik producenta i opublikowane kontrakty na stacji roboczej, usługi HTTP floty, dostarczona konfiguracja trasy i odpowiedź `board` wskazują `north-98`; opublikowane kontrakty pobierają trasę z zarządzanego pliku producenta.
stages.0.objectives.2.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/message`
  zawiera dokładnie `north-98`, opcjonalnie z jednym końcowym znakiem nowego wiersza, i ma tryb `0644`.
stages.0.objectives.3.text: OpenTofu nie zgłasza oczekujących zmian infrastruktury.
stages.0.objectives.4.text: Deployment `board` ma jedną replikę, a jego działający kontener otrzymuje
  `north-98` przez dostarczony kontrakt środowiska.
diagnostics.managed_id: Wyjście stanu mogło zniknąć lub wskazywać odtworzony zasób. Sprawdź pierwotny zasób i zachowaj jego identyfikator podczas zmiany modułu. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=q098-retained-identity)
diagnostics.route_file: Zarządzany plik mógł zniknąć lub zawierać inną trasę. Sprawdź zasób i zapisany plik przed przekazaniem wartości dalej. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=q098-producer-file)
diagnostics.contract_output: Wyjście główne może nadal używać starego wyjścia modułu. Prześledź trasę od pliku przez moduł do zastosowanego kontraktu głównego. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=q098-root-contract)
diagnostics.contract_file: Roboczy JSON mógł zostać wyeksportowany przed naprawą wyjścia głównego. Po jego aktualizacji wygeneruj plik kontraktu ponownie. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=q098-published-contract)
diagnostics.plan: Planowana zmiana daje kod 2, a błąd planowania kod 1. Sprawdź rozbieżności, niezamierzoną wymianę i konfigurację, potem potwierdź kod 0. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=q098-clean-plan)
diagnostics.reference: Literał lub nieużyta referencja może dać tę samą trasę. Prześledź wyrażenie wyjścia przez locals do content zasobu i w razie potrzeby usuń końcowy znak nowej linii. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=q098-module-file-reference)
diagnostics.configmap: ConfigMap może nadal zawierać poprzednią wartość lub nie istnieć. Po opublikowaniu kontraktu sprawdź aktywny klucz route. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=q098-published-configmap)
diagnostics.replicas: Deployment board może nie istnieć lub mieć inną liczbę replik. Sprawdź liczbę żądanych replik w specyfikacji. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=q098-board-replicas)
diagnostics.board_env: Nieaktualne środowisko kontenera worker lub błędna referencja ConfigMap może utrzymywać starą trasę. Sprawdź pojedynczy wpis ROUTE z route/route i wartość w kontenerze worker po wdrożeniu. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=q098-worker-route-config)
diagnostics.board_http: Service może nadal kierować do starych podów, nie mieć gotowych endpointów lub zwracać starą trasę. Sprawdź odpowiedź HTTP po gotowości nowego kontenera worker. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=q098-board-service)
diagnostics.content_1: Plik na wskazanym hoście może być stary lub nieczytelny. Porównaj bajty z north-98 bez lub z jednym końcowym znakiem nowej linii i sprawdź dostęp do hosta. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=q098-fleet-file-content)
diagnostics.content_2: Plik na wskazanym hoście może być stary lub nieczytelny. Porównaj bajty z north-98 bez lub z jednym końcowym znakiem nowej linii i sprawdź dostęp do hosta. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=q098-fleet-file-content)
diagnostics.content_3: Plik na wskazanym hoście może być stary lub nieczytelny. Porównaj bajty z north-98 bez lub z jednym końcowym znakiem nowej linii i sprawdź dostęp do hosta. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=q098-fleet-file-content)
diagnostics.mode_1: Wdrożenie mogło zapisać prawidłowe bajty ze złymi uprawnieniami. Sprawdź tryb 644 i dostęp do wskazanego hosta. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=q098-fleet-file-mode)
diagnostics.mode_2: Wdrożenie mogło zapisać prawidłowe bajty ze złymi uprawnieniami. Sprawdź tryb 644 i dostęp do wskazanego hosta. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=q098-fleet-file-mode)
diagnostics.mode_3: Wdrożenie mogło zapisać prawidłowe bajty ze złymi uprawnieniami. Sprawdź tryb 644 i dostęp do wskazanego hosta. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=q098-fleet-file-mode)
diagnostics.http_1: Plik hosta mógł się zaktualizować, choć usługa zwraca starą odpowiedź lub nie odpowiada. Sprawdź port 8080 wskazanego hosta i porównaj treść z north-98. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=q098-fleet-http)
diagnostics.http_2: Plik hosta mógł się zaktualizować, choć usługa zwraca starą odpowiedź lub nie odpowiada. Sprawdź port 8080 wskazanego hosta i porównaj treść z north-98. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=q098-fleet-http)
diagnostics.http_3: Plik hosta mógł się zaktualizować, choć usługa zwraca starą odpowiedź lub nie odpowiada. Sprawdź port 8080 wskazanego hosta i porównaj treść z north-98. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=q098-fleet-http)
diagnostics.probe_0_1: Kontrola może zakończyć się przed nazwaniem warunku z powodu katalogu, wejść planu lub narzędzi. Sprawdź środowisko i osobno zbadaj plik, kontrakt i klaster. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=q098-cross-stack-observation)
