diagnostics.mode_2: Na hoście app2 uprawnienia /srv/site/message muszą wynosić 644.
diagnostics.http_2: Host app2 na porcie 8080 musi zwrócić north-98.
diagnostics.content_3: Na hoście app3 /srv/site/message musi zawierać dokładnie north-98, opcjonalnie
