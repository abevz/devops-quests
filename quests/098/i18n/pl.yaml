title: Kontrakty cross-stackowe
brief: 'Pracuj w `~/quest`. `main.tf` wywołuje `modules/station/main.tf`: jego zarządzany plik `managed-route.txt` zawiera
  `north-98`, ale output jest nieaktualny. Stan OpenTofu przechowuje ID zasobu; zachowaj ID z `original-id`. Uwzględnij `local_file.contract.content`
  w wyrażeniu output route modułu, zastosuj i zapisz output do `contract.json` poleceniem `tofu output -json contract > contract.json`.
  Output i plik muszą być dokładnie `{ "route": "north-98" }`, a końcowy plan z detailed-exitcode musi zwrócić 0. Plan musi
  wskazywać `local_file.contract.content` w output route modułu.


  Użyj `rollout.yml`, `inventory.ini` i `ansible.cfg` dla prywatnej floty SSH: app1, app2 i app3 muszą mieć `/srv/site/message`
  o wartości `north-98` i trybie `0644`, a usługa HTTP każdego hosta na porcie 8080 musi zwrócić `north-98`. Dostarczony handler
  wykonuje `dq-service reload`; użyj `ansible-playbook rollout.yml -e @contract.json`. Ustaw dane ConfigMap `route` dokładnie
  na `{ "route": "north-98" }`. Z `board.json` zachowaj jedną replikę i dokładnie jeden wpis środowiska pierwszego kontenera:
  `ROUTE` z ConfigMap `route`, klucz `route`. Zrestartuj Deployment, aby odświeżyć środowisko, i sprawdź, czy `board:8080`
  zwraca `north-98`. Kontrole obserwują wartości i referencję output, a nie to, czy plan przejrzano lub jak zasilono konsumentów.
  Używaj tylko zatoki offline.'
debrief: Kontrole wykazały zgodne wartości producenta, floty i board, zachowane ID oraz referencję output modułu.
stages.0.brief: Pierwotne ID, referencja i wartości output, pusty plan, pliki i odpowiedzi floty oraz konfiguracja i odpowiedź
  board odpowiadają opisowi.
stages.0.objectives.0.text: Pierwotne ID, referencja i wartości output, pusty plan, pliki i odpowiedzi floty oraz konfiguracja
  i odpowiedź board odpowiadają opisowi.
hints.0.text: 'Zacznij od producenta: nieaktualny output może sprawić, że wielu zdrowych konsumentów będzie stale się mylić.'
hints.1.text: Wyprowadź output z zarządzanego pliku, a następnie ponownie wygeneruj jeden kontrakt.
hints.2.text: Użyj kontraktu zarówno dla Ansible, jak i ConfigMap; Pody oparte na env wymagają ponownego uruchomienia.
phrases.0: Wyśledziłem niespójnych konsumentów do nieaktualnego producenta output.
phrases.1: Propagowałem jeden kontrakt w całej konfiguracji i runtime.
phrases.2: Po uzgodnieniu zweryfikowałem identity i każdego żywego konsumenta.
