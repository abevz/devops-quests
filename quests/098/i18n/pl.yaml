title: Kontrakty cross-stackowe
brief: |
  Odbiorcy nie są zgodni z wymaganym kontraktem trasy.

  Pracuj na workstation w `~/quest` z plikami `main.tf`, `modules/station/main.tf`, `rollout.yml`, `inventory.ini`, `ansible.cfg`, `route.yaml`, `board.yaml`.

  **Wymagania:**
  - Wyjścia główne:
    - Nazwa wyjścia: `managed_id`.
    - Zgodne potwierdzenie na workstation: `/run/dq/facts/0/original-id`.
  - Pliki na workstation:
    - `~/quest/managed-route.txt`: `north-98`.
  - Wyjścia główne:
    - Wyjście `contract` zawiera `route` o wartości `north-98`.
  - Pliki na workstation:
    - Ścieżka: `~/quest/contract.json`.
    - Pole `route`: `north-98`.
  - Zbieżność infrastruktury:
    - Brak oczekujących zmian infrastruktury; kod zakończenia szczegółowego planu `0`.
  - Plik na każdym zarządzanym hoście (`app1`, `app2`, `app3`):
    - Ścieżka: `/srv/site/message`.
    - Treść: `north-98`.
    - Dokładny tekst, opcjonalnie z jednym końcowym znakiem nowego wiersza.
    - Tryb dostępu: `0644`.
  - HTTP na każdym zarządzanym hoście (`app1`, `app2`, `app3`):
    - Port i ścieżka: `8080`, `/`.
    - Odpowiedź: `north-98`.
  - Dane trasy w przestrzeni nazw zatoki:
    - ConfigMap: `route`.
    - `route`: `north-98`.
  - Odbiorca w przestrzeni nazw zatoki:
    - Deployment: `board`.
    - Repliki: `1`.
    - Jego kontener udostępnia `ROUTE` o wartości `north-98`.
    - Wewnątrz kontenera `board` HTTP `http://board:8080` zwraca `north-98`.

  **Sprawdź przed Check & finish:**
  - `cat managed-route.txt; tofu output -raw managed_id; printf '\n'; cat /run/dq/facts/0/original-id; tofu output -json contract; cat contract.json; tofu plan -input=false -detailed-exitcode -no-color` — Producent i oba kontrakty pokazują `north-98`, ID jest zgodny z potwierdzeniem, a plan kończy się kodem `0`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'cat -A /srv/site/message; ls -l /srv/site/message'; for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done` — Każdy host pokazuje `north-98` z najwyżej jednym znacznikiem końca wiersza, tryb pliku `-rw-r--r--` i odpowiedź HTTP `north-98`.
  - `kubectl get configmap route -o jsonpath='{.data.route}'; printf '\n'; kubectl get deployment board -o custom-columns=NAME:.metadata.name,REPLICAS:.spec.replicas; kubectl exec --pod-running-timeout=5s deployment/board -- printenv ROUTE; kubectl exec --pod-running-timeout=5s deployment/board -- wget -qO- -T 3 http://board:8080` — ConfigMap `route`, działające `ROUTE` i odpowiedź HTTP `board` pokazują `north-98`; Deployment `board` ma żądaną liczbę replik `1`.

  Sprawdzenie obserwuje bieżące wartości i zachowane ograniczenia odwołania wyjścia, a nie fakt przejrzenia planu ani sposób dostarczenia danych odbiorcom.
debrief: Kontrole wykazały zgodne wartości producenta, floty i board, zachowane ID oraz referencję output modułu.
stages.0.brief: Producent i każdy odbiorca muszą spełniać kontrakt trasy.
hints.0.text: 'Zacznij od producenta: nieaktualny output może sprawić, że wielu zdrowych konsumentów będzie stale
  się mylić.'
hints.1.text: Wyprowadź główne wyjście bezpośrednio z local_file.contract.content, a następnie odtwórz contract.json
  przez tofu output -json contract.
hints.2.text: Użyj kontraktu zarówno dla Ansible, jak i ConfigMap; Pody oparte na env wymagają ponownego uruchomienia.
phrases.0: Wyśledziłem niespójnych konsumentów do nieaktualnego producenta output.
phrases.1: Propagowałem jeden kontrakt w całej konfiguracji i runtime.
phrases.2: Po uzgodnieniu zweryfikowałem identity i każdego żywego konsumenta.
