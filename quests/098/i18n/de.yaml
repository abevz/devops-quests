diagnostics.plan: Der OpenTofu-Plan muss mit Code 0 enden.
diagnostics.reference: Die route-Ausgabe des Moduls muss im gespeicherten Plan auf local_file.contract.content verweisen.
diagnostics.configmap: Die Daten der ConfigMap route müssen {route:north-98} entsprechen.
diagnostics.replicas: Die Replikate des Deployment board müssen 1 sein.
diagnostics.board_env: Das env des ersten board-Containers darf nur ROUTE aus ConfigMap route, Schlüssel route, enthalten.
diagnostics.board_http: Die Anfrage an board:8080 muss north-98 liefern.
