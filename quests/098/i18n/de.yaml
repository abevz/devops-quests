title: Cross-Stack-Verträge
brief: |-
  Die Verbraucher stimmen nicht mit dem erforderlichen Routenvertrag überein.

  Arbeite auf der Workstation in `~/quest` mit `main.tf`, `modules/station/main.tf`, `rollout.yml`, `inventory.ini`, `ansible.cfg`, `route.yaml`, `board.yaml`.

  **Anforderungen:**
  - Root-Ausgaben:
    - Ausgabename: `managed_id`.
    - Die Ausgabe `managed_id` behält die ursprünglich vom Provider vergebene Ressourcen-ID bei.
  - Dateien auf der Workstation:
    - `~/quest/managed-route.txt`: `north-98`.
  - Root-Ausgaben:
    - Die Ausgabe `contract` enthält `route` mit dem Wert `north-98`.
  - Dateien auf der Workstation:
    - Pfad: `~/quest/contract.json`.
    - Feld `route`: `north-98`.
  - Die veröffentlichten Verträge beziehen ihre Route aus der verwalteten Erzeugerdatei.
  - Infrastrukturkonvergenz:
    - Keine ausstehenden Infrastrukturänderungen; Exit-Code des detaillierten Plans `0`.
  - Datei auf jedem verwalteten Host (`app1`, `app2`, `app3`):
    - Pfad: `/srv/site/message`.
    - Inhalt: `north-98`.
    - Genauer Text, optional mit einem abschließenden Zeilenumbruch.
    - Zugriffsmodus: `0644`.
  - HTTP auf jedem verwalteten Host (`app1`, `app2`, `app3`):
    - Port und Endpunkt: `8080`, `/`.
    - Antwort: `north-98`.
  - Routendaten im Bay-Namespace:
    - Die bereitgestellte Routen-ConfigMap liefert `north-98`.
  - Verbraucher im Bay-Namespace:
    - Deployment: `board`.
    - Repliken: `1`.
    - Deployment `board` hat eine Replik; sein laufender Container erhält `north-98` über den bereitgestellten Umgebungsvertrag.
    - Im Container `board` liefert HTTP `http://board:8080` den Wert `north-98`.

  Die Prüfung beobachtet aktuelle Werte und beibehaltene Ausgabereferenz-Vorgaben, nicht eine Planprüfung oder die Art der Verbraucherversorgung.
debrief: Die Prüfungen beobachteten passende Werte von Produzent, Flotte und Board, die erhaltene ID und
  die Modul-Output-Referenz.
stages.0.brief: Der Produzent und jeder Verbraucher müssen den Routenvertrag erfüllen.
hints.0.text: Ein Erzeugervertrag kann mehrere unabhängig verwaltete Verbraucher versorgen.
hints.1.text: |-
  Beginnen Sie beim Produzenten: Eine veraltete Produktion kann dazu führen, dass viele gesunde Verbraucher immer wieder falsch liegen. Leite die Root-Ausgabe direkt von local_file.contract.content ab und erstelle contract.json erneut mit tofu output -json contract.

  Prüfen Sie die bereitgestellte Konfiguration und aktuelle Beobachtungen auf der Workstation:

  ```sh
  cat main.tf modules/station/main.tf route.yaml board.yaml
  tofu state list
  ```
hints.2.text: |-
  Verwenden Sie den Vertrag sowohl für Ansible als auch für ConfigMap; Env-basierte Pods benötigen einen Neustart.

  Prüfen Sie das Ergebnis in `~/quest` auf der Workstation:

  - `cat managed-route.txt; tofu output -raw managed_id; printf '\n'; cat /run/dq/facts/0/original-id; tofu output -json contract; cat contract.json; tofu plan -input=false -detailed-exitcode -no-color` — Produzent und beide Verträge zeigen `north-98`, die ID stimmt mit dem Beleg überein und die Planung endet mit `0`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'cat -A /srv/site/message; ls -l /srv/site/message'; for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done` — Jeder Host zeigt `north-98` mit höchstens einer Zeilenendemarkierung, Dateimodus `-rw-r--r--` und die HTTP-Antwort `north-98`.
  - `kubectl get configmap route -o jsonpath='{.data.route}'; printf '\n'; kubectl get deployment board -o custom-columns=NAME:.metadata.name,REPLICAS:.spec.replicas; kubectl exec --pod-running-timeout=5s deployment/board -c worker -- printenv ROUTE; kubectl exec --pod-running-timeout=5s deployment/board -c worker -- wget -qO- -T 3 http://board:8080` — ConfigMap `route`, das laufende `ROUTE` und die HTTP-Antwort von `board` zeigen `north-98`; Deployment `board` hat die gewünschte Replikazahl `1`.
phrases.0: Ich habe inkonsistente Verbraucher auf eine veraltete Produzentenausgabe zurückgeführt.
phrases.1: Ich habe einen Vertrag über die Konfiguration und runtime verteilt.
phrases.2: Ich habe identity und jeden Live-Verbraucher nach dem Abgleich überprüft.
stages.0.objectives.0.text: Die Ausgabe `managed_id` behält die ursprünglich vom Provider vergebene Ressourcen-ID
  bei.
stages.0.objectives.1.text: |-
  Die Erzeugerdatei und veröffentlichten Verträge auf der Workstation, die HTTP-Dienste der Flotte, die bereitgestellte Routenkonfiguration und die Antwort von `board` melden `north-98`; die veröffentlichten Verträge beziehen ihre Route aus der verwalteten Erzeugerdatei.
stages.0.objectives.2.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/message`
  genau `north-98`, optional mit einem abschließenden Zeilenumbruch, mit Modus `0644`.
stages.0.objectives.3.text: OpenTofu meldet keine ausstehenden Infrastrukturänderungen.
stages.0.objectives.4.text: Deployment `board` hat eine Replik; sein laufender Container erhält `north-98`
  über den bereitgestellten Umgebungsvertrag.
diagnostics.managed_id: Die Zustandsausgabe fehlt möglicherweise oder verweist auf eine neu erstellte Ressource. Prüfen Sie die ursprüngliche Ressource und bewahren Sie beim Modulumbau ihre Identität. [Ursache und Prüfung](guides#guide=terraform-7.1&section=q098-retained-identity)
diagnostics.route_file: Die verwaltete Datei fehlt möglicherweise oder enthält eine andere Route. Prüfen Sie die Ressource und ihre Datei vor der Weitergabe des Werts. [Ursache und Prüfung](guides#guide=terraform-7.1&section=q098-producer-file)
diagnostics.contract_output: Die Root-Ausgabe nutzt möglicherweise noch die alte Modulausgabe. Verfolgen Sie die Route von der Datei über das Modul bis zum angewendeten Root-Vertrag. [Ursache und Prüfung](guides#guide=terraform-7.1&section=q098-root-contract)
diagnostics.contract_file: Die Arbeitsdatei wurde möglicherweise vor der Korrektur der Root-Ausgabe exportiert. Erzeugen Sie den veröffentlichten Vertrag erneut aus der aktuellen Ausgabe. [Ursache und Prüfung](guides#guide=terraform-7.1&section=q098-published-contract)
diagnostics.plan: Ausstehende Änderungen ergeben Code 2, Planungsfehler Code 1. Prüfen Sie Drift, unbeabsichtigten Ersatz und Konfiguration und bestätigen Sie Code 0. [Ursache und Prüfung](guides#guide=terraform-7.1&section=q098-clean-plan)
diagnostics.reference: Ein Literal oder ungenutzter Verweis kann denselben Routenwert liefern. Verfolgen Sie den Ausgabeausdruck über lokale Werte bis zu content der Ressource und entfernen Sie bei Bedarf den abschließenden Zeilenumbruch. [Ursache und Prüfung](guides#guide=terraform-7.1&section=q098-module-file-reference)
diagnostics.configmap: Die ConfigMap fehlt möglicherweise oder enthält den alten Wert. Prüfen Sie nach der Veröffentlichung des Vertrags den aktiven Schlüssel route. [Ursache und Prüfung](guides#guide=terraform-7.1&section=q098-published-configmap)
diagnostics.replicas: Das Deployment board fehlt möglicherweise oder fordert eine andere Replikazahl an. Prüfen Sie die gewünschte Anzahl in seiner Spezifikation. [Ursache und Prüfung](guides#guide=terraform-7.1&section=q098-board-replicas)
diagnostics.board_env: Eine alte Prozessumgebung im Worker-Container oder ein falscher ConfigMap-Verweis kann die alte Route erhalten. Prüfen Sie den einzelnen ROUTE-Eintrag mit route/route und den Wert im laufenden Worker nach dem Rollout. [Ursache und Prüfung](guides#guide=terraform-7.1&section=q098-worker-route-config)
diagnostics.board_http: Der Service erreicht möglicherweise alte Pods, hat keine bereiten Endpunkte oder liefert die alte Route. Prüfen Sie die HTTP-Antwort, sobald der aktualisierte Worker bereit ist. [Ursache und Prüfung](guides#guide=terraform-7.1&section=q098-board-service)
diagnostics.content_1: Die Datei auf dem gemeldeten Host ist möglicherweise veraltet oder nicht lesbar. Vergleichen Sie ihre Bytes mit north-98 ohne oder mit einem abschließenden Zeilenumbruch und prüfen Sie den Hostzugriff. [Ursache und Prüfung](guides#guide=terraform-7.1&section=q098-fleet-file-content)
diagnostics.content_2: Die Datei auf dem gemeldeten Host ist möglicherweise veraltet oder nicht lesbar. Vergleichen Sie ihre Bytes mit north-98 ohne oder mit einem abschließenden Zeilenumbruch und prüfen Sie den Hostzugriff. [Ursache und Prüfung](guides#guide=terraform-7.1&section=q098-fleet-file-content)
diagnostics.content_3: Die Datei auf dem gemeldeten Host ist möglicherweise veraltet oder nicht lesbar. Vergleichen Sie ihre Bytes mit north-98 ohne oder mit einem abschließenden Zeilenumbruch und prüfen Sie den Hostzugriff. [Ursache und Prüfung](guides#guide=terraform-7.1&section=q098-fleet-file-content)
diagnostics.mode_1: Die Bereitstellung hat möglicherweise die richtigen Bytes mit falschen Rechten geschrieben. Prüfen Sie Modus 644 und den Zugriff auf den gemeldeten Host. [Ursache und Prüfung](guides#guide=terraform-7.1&section=q098-fleet-file-mode)
diagnostics.mode_2: Die Bereitstellung hat möglicherweise die richtigen Bytes mit falschen Rechten geschrieben. Prüfen Sie Modus 644 und den Zugriff auf den gemeldeten Host. [Ursache und Prüfung](guides#guide=terraform-7.1&section=q098-fleet-file-mode)
diagnostics.mode_3: Die Bereitstellung hat möglicherweise die richtigen Bytes mit falschen Rechten geschrieben. Prüfen Sie Modus 644 und den Zugriff auf den gemeldeten Host. [Ursache und Prüfung](guides#guide=terraform-7.1&section=q098-fleet-file-mode)
diagnostics.http_1: Der Host hat möglicherweise die neue Datei, liefert aber noch die alte Antwort oder ist nicht erreichbar. Prüfen Sie Port 8080 des gemeldeten Hosts und vergleichen Sie die Antwort mit north-98. [Ursache und Prüfung](guides#guide=terraform-7.1&section=q098-fleet-http)
diagnostics.http_2: Der Host hat möglicherweise die neue Datei, liefert aber noch die alte Antwort oder ist nicht erreichbar. Prüfen Sie Port 8080 des gemeldeten Hosts und vergleichen Sie die Antwort mit north-98. [Ursache und Prüfung](guides#guide=terraform-7.1&section=q098-fleet-http)
diagnostics.http_3: Der Host hat möglicherweise die neue Datei, liefert aber noch die alte Antwort oder ist nicht erreichbar. Prüfen Sie Port 8080 des gemeldeten Hosts und vergleichen Sie die Antwort mit north-98. [Ursache und Prüfung](guides#guide=terraform-7.1&section=q098-fleet-http)
diagnostics.probe_0_1: Die Prüfung kann vor einer konkreten Meldung abbrechen, wenn Arbeitsverzeichnis, Planeingaben oder Werkzeuge fehlen. Prüfen Sie die Umgebung und beobachten Sie Datei, Vertrag und Cluster einzeln. [Ursache und Prüfung](guides#guide=terraform-7.1&section=q098-cross-stack-observation)
