title: Cross-Stack-Verträge
brief: 'Arbeite in `~/quest`. `main.tf` ruft `modules/station/main.tf` auf: Seine verwaltete Datei `managed-route.txt` enthält
  `north-98`, aber der Output ist veraltet. Der OpenTofu-State hält eine Ressourcen-ID; bewahre die ID aus `original-id`.
  Lass den Modul-Output route auf `local_file.contract.content` verweisen, wende ihn an und schreibe den Output mit `tofu
  output -json contract > contract.json` nach `contract.json`. Output und Datei müssen jeweils genau `{ "route": "north-98"
  }` sein, und der abschließende Plan mit detailed-exitcode muss mit 0 enden. Der Plan muss im Modul-Output route auf `local_file.contract.content`
  verweisen.


  Nutze `rollout.yml`, `inventory.ini` und `ansible.cfg` für die private SSH-Flotte: app1, app2 und app3 müssen `/srv/site/message`
  mit Inhalt `north-98` und Modus `0644` haben; jeder HTTP-Dienst auf Port 8080 muss `north-98` liefern. Der bereitgestellte
  Handler führt `dq-service reload` aus; nutze `ansible-playbook rollout.yml -e @contract.json`. Setze die Daten der ConfigMap
  `route` genau auf `{ "route": "north-98" }`. Bewahre aus `board.json` eine Replik und genau einen Umgebungseintrag des ersten
  Containers: `ROUTE` aus ConfigMap `route`, Schlüssel `route`. Starte das Deployment neu, um die Umgebung zu aktualisieren,
  und prüfe `north-98` von `board:8080`. Die Prüfungen beobachten Werte und Output-Referenz, nicht ob ein Plan geprüft oder
  wie jeder Verbraucher versorgt wurde. Nutze nur die Offline-Umgebung.'
debrief: Die Prüfungen beobachteten passende Werte von Produzent, Flotte und Board, die erhaltene ID und die Modul-Output-Referenz.
stages.0.brief: Ursprüngliche ID, Output-Referenz und Werte, leerer Plan, Flottendateien und Antworten sowie Board-Konfiguration
  und Antwort entsprechen der Beschreibung.
stages.0.objectives.0.text: Ursprüngliche ID, Output-Referenz und Werte, leerer Plan, Flottendateien und Antworten sowie Board-Konfiguration
  und Antwort entsprechen der Beschreibung.
hints.0.text: 'Beginnen Sie beim Produzenten: Eine veraltete Produktion kann dazu führen, dass viele gesunde Verbraucher immer
  wieder falsch liegen.'
hints.1.text: Leiten Sie die Ausgabe aus der verwalteten Datei ab und generieren Sie dann einen Vertrag neu.
hints.2.text: Verwenden Sie den Vertrag sowohl für Ansible als auch für ConfigMap; Env-basierte Pods benötigen einen Neustart.
phrases.0: Ich habe inkonsistente Verbraucher auf eine veraltete Produzentenausgabe zurückgeführt.
phrases.1: Ich habe einen Vertrag über die Konfiguration und runtime verteilt.
phrases.2: Ich habe identity und jeden Live-Verbraucher nach dem Abgleich überprüft.
