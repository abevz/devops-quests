title: Cross-Stack-Verträge
brief: 'Die verwaltete lokale Datei enthält bereits north-98, aber die Modulausgabe exportiert weiterhin
  retired-98. Sowohl die Ansible-Flotte als auch ein Kubernetes-Verbraucher sind von diesem Ausgangsvertrag
  abhängig. Reparieren Sie die Modulausgabe, indem Sie sie von local_file.contract.content ableiten, behalten
  Sie die verwaltete Ressource ID bei, wenden Sie die überprüfte Nur-Ausgabe-Änderung an und generieren
  Sie contract.json neu. Geben Sie denselben Vertrag an rollout.yml und ConfigMap route weiter und starten
  Sie dann den env-basierten Verbraucher neu. Kodieren Sie den Erfolg nicht für jeden Verbraucher einzeln
  fest.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `main.tf`, `modules/station/main.tf`,
  `managed-route.txt`, `original-id`, `contract.json`, `rollout.yml`, `route.json`, `board.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Anfängliche Erfolgskriterien: Die Ressource ID bleibt erhalten, Modul outputs und Vertrag stimmen überein,
  alle Flottenziele und das von ConfigMap unterstützte Pod bedienen north-98 und das endgültige plan ist
  leer.'
debrief: Ein einziger korrigierter Produzentenvertrag steuert nun beide nachgelagerten Systeme ohne Ressourcenersatz.
stages.0.brief: 'Erfolgskriterien: Die Ressource ID bleibt erhalten, Modul outputs und Vertrag stimmen
  überein, alle Flottenziele und das von ConfigMap unterstützte Pod bedienen north-98 und das endgültige
  plan ist leer.'
stages.0.objectives.0.text: Die Ressource ID bleibt erhalten, das Modul outputs und der Vertrag stimmen
  überein, alle Flottenziele und das von ConfigMap unterstützte Pod bedienen north-98 und das endgültige
  plan ist leer.
hints.0.text: 'Beginnen Sie beim Produzenten: Eine veraltete Produktion kann dazu führen, dass viele gesunde
  Verbraucher immer wieder falsch liegen.'
hints.1.text: Leiten Sie die Ausgabe aus der verwalteten Datei ab und generieren Sie dann einen Vertrag
  neu.
hints.2.text: Verwenden Sie den Vertrag sowohl für Ansible als auch für ConfigMap; Env-basierte Pods benötigen
  einen Neustart.
phrases.0: Ich habe inkonsistente Verbraucher auf eine veraltete Produzentenausgabe zurückgeführt.
phrases.1: Ich habe einen Vertrag über die Konfiguration und runtime verteilt.
phrases.2: Ich habe identity und jeden Live-Verbraucher nach dem Abgleich überprüft.
