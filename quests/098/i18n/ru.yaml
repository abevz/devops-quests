title: Контракты между системами
brief: 'Управляемый локальный файл уже содержит north-98, но output модуля экспортирует retired-98. От
  контракта зависят флот Ansible и потребитель Kubernetes. Исправьте output через local_file.contract.content,
  сохраните ID ресурса, примените проверенное изменение outputs и заново создайте contract.json. Передайте
  этот контракт в rollout.yml и ConfigMap route, затем перезапустите потребитель с env. Не подставляйте
  готовый результат независимо в каждом потребителе.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `main.tf`, `modules/station/main.tf`,
  `managed-route.txt`, `original-id`, `contract.json`, `rollout.yml`, `route.json`, `board.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: ID ресурса сохранён, outputs и контракт согласованы, флот и Pod с ConfigMap отдают
  north-98, итоговый plan пуст.'
debrief: Исправленный единый контракт управляет двумя системами без замены ресурса.
