title: Контракты между системами
brief: |-
  Потребители не соответствуют требуемому контракту маршрута.

  Работайте на workstation в `~/quest` с файлами `main.tf`, `modules/station/main.tf`, `rollout.yml`, `inventory.ini`, `ansible.cfg`, `route.yaml`, `board.yaml`.

  **Требования:**
  - Корневые выводы:
    - Имя вывода: `managed_id`.
    - Выходное значение `managed_id` сохраняет ID ресурса, изначально назначенный провайдером.
  - Файлы на workstation:
    - `~/quest/managed-route.txt`: `north-98`.
  - Корневые выводы:
    - Вывод `contract` содержит `route` со значением `north-98`.
  - Файлы на workstation:
    - Путь: `~/quest/contract.json`.
    - Поле `route`: `north-98`.
  - Опубликованные контракты получают маршрут из управляемого файла производителя.
  - Согласованность инфраструктуры:
    - Нет ожидающих изменений инфраструктуры; код завершения подробного плана `0`.
  - Файл на каждом управляемом хосте (`app1`, `app2`, `app3`):
    - Путь: `/srv/site/message`.
    - Содержимое: `north-98`.
    - Точный текст, возможно с одним переводом строки в конце.
    - Режим доступа: `0644`.
  - HTTP на каждом управляемом хосте (`app1`, `app2`, `app3`):
    - Порт и путь: `8080`, `/`.
    - Ответ: `north-98`.
  - Данные маршрута в namespace песочницы:
    - Предоставленный ConfigMap маршрута передаёт `north-98`.
  - Потребитель в namespace песочницы:
    - Deployment: `board`.
    - Реплики: `1`.
    - Deployment `board` имеет одну реплику, а его работающий контейнер получает `north-98` через предоставленный контракт окружения.
    - Изнутри контейнера `board` HTTP `http://board:8080` возвращает `north-98`.

  Проверка наблюдает текущие значения и сохранённые ограничения ссылки вывода, а не факт просмотра плана или способ снабжения потребителей.
debrief: Проверки обнаружили совпадающие значения производителя, парка и board, сохранённый ID и ссылку
  выхода модуля.
stages.0.brief: Производитель и каждый потребитель должны соответствовать контракту маршрута.
hints.0.text: Один контракт производителя может снабжать несколько независимо управляемых потребителей.
hints.1.text: |-
  Начните с производителя: устаревший output делает несколько исправных потребителей одинаково неверными. Получите корневой вывод непосредственно из local_file.contract.content, затем заново создайте contract.json через tofu output -json contract.

  Изучите предоставленную конфигурацию и текущие наблюдения на workstation:

  ```sh
  cat main.tf modules/station/main.tf route.yaml board.yaml
  tofu state list
  ```
hints.2.text: |-
  Используйте контракт в Ansible и ConfigMap; Pod с env требует перезапуска.

  Проверьте результат из `~/quest` на workstation:

  - `cat managed-route.txt; tofu output -raw managed_id; printf '\n'; cat /run/dq/facts/0/original-id; tofu output -json contract; cat contract.json; tofu plan -input=false -detailed-exitcode -no-color` — Производитель и оба контракта показывают `north-98`, ID совпадает с квитанцией, планирование завершается с кодом `0`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'cat -A /srv/site/message; ls -l /srv/site/message'; for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done` — Каждый хост показывает `north-98` не более чем с одним маркером конца строки, режим файла `-rw-r--r--` и HTTP-ответ `north-98`.
  - `kubectl get configmap route -o jsonpath='{.data.route}'; printf '\n'; kubectl get deployment board -o custom-columns=NAME:.metadata.name,REPLICAS:.spec.replicas; kubectl exec --pod-running-timeout=5s deployment/board -c worker -- printenv ROUTE; kubectl exec --pod-running-timeout=5s deployment/board -c worker -- wget -qO- -T 3 http://board:8080` — ConfigMap `route`, работающая переменная `ROUTE` и HTTP-ответ `board` показывают `north-98`; требуемое число реплик Deployment `board` — `1`.
phrases.0: Я нашёл источник рассогласования потребителей в устаревшем output.
phrases.1: Я передал единый контракт в конфигурацию и runtime.
phrases.2: Я проверил identity и каждого работающего потребителя после согласования.
stages.0.objectives.0.text: Выходное значение `managed_id` сохраняет ID ресурса, изначально назначенный
  провайдером.
stages.0.objectives.1.text: |-
  Файл производителя и опубликованные контракты на рабочей станции, HTTP-сервисы флота, предоставленная конфигурация маршрута и ответ `board` сообщают `north-98`; опубликованные контракты получают маршрут из управляемого файла производителя.
stages.0.objectives.2.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/message`
  содержит в точности `north-98`, возможно с одним переводом строки в конце, и имеет режим `0644`.
stages.0.objectives.3.text: OpenTofu не сообщает об ожидающих изменениях инфраструктуры.
stages.0.objectives.4.text: Deployment `board` имеет одну реплику, а его работающий контейнер получает
  `north-98` через предоставленный контракт окружения.
diagnostics.managed_id: Выход state мог исчезнуть или указывать на пересозданный ресурс. Найдите исходный ресурс в состоянии и сохраните его идентификатор при правке модуля. [Причина и проверка](guides#guide=terraform-7.1&section=q098-retained-identity)
diagnostics.route_file: Управляемый файл мог исчезнуть или содержать другой маршрут. Проверьте ресурс и созданный им файл перед распространением значения. [Причина и проверка](guides#guide=terraform-7.1&section=q098-producer-file)
diagnostics.contract_output: Корневой выход мог сохранить старый результат модуля. Проследите маршрут от файла через модуль до применённого корневого контракта. [Причина и проверка](guides#guide=terraform-7.1&section=q098-root-contract)
diagnostics.contract_file: Рабочий JSON могли выгрузить до исправления корневого выхода. Когда выход обновится, заново выгрузите из него контракт. [Причина и проверка](guides#guide=terraform-7.1&section=q098-published-contract)
diagnostics.plan: Запланированное изменение даёт код 2, ошибка планирования — 1. Проверьте план на дрейф, замену ресурса и ошибки конфигурации, затем добейтесь кода 0. [Причина и проверка](guides#guide=terraform-7.1&section=q098-clean-plan)
diagnostics.reference: Литерал или неиспользуемая ссылка могут совпасть со значением маршрута. Проследите выражение выхода через locals до content ресурса и при необходимости уберите завершающий перевод строки. [Причина и проверка](guides#guide=terraform-7.1&section=q098-module-file-reference)
diagnostics.configmap: В ConfigMap могло остаться прежнее значение либо объект отсутствует. После публикации контракта проверьте ключ route в кластере. [Причина и проверка](guides#guide=terraform-7.1&section=q098-published-configmap)
diagnostics.replicas: Deployment board мог отсутствовать или запрашивать другое число реплик. Проверьте желаемое число реплик в его спецификации. [Причина и проверка](guides#guide=terraform-7.1&section=q098-board-replicas)
diagnostics.board_env: Старое окружение процесса или неверная ссылка на ConfigMap могут удерживать прежний маршрут. Проверьте единственную переменную ROUTE со ссылкой route/route и её значение в работающем worker после rollout. [Причина и проверка](guides#guide=terraform-7.1&section=q098-worker-route-config)
diagnostics.board_http: Service может ещё вести к старым Pod, не иметь готовых endpoints или отдавать прежний маршрут. Проверьте тело HTTP-ответа после готовности обновлённого worker. [Причина и проверка](guides#guide=terraform-7.1&section=q098-board-service)
diagnostics.content_1: Файл на указанном хосте мог устареть или не читаться. Сравните байты с north-98 без перевода строки или с одним переводом в конце и проверьте доступ к хосту. [Причина и проверка](guides#guide=terraform-7.1&section=q098-fleet-file-content)
diagnostics.content_2: Файл на указанном хосте мог устареть или не читаться. Сравните байты с north-98 без перевода строки или с одним переводом в конце и проверьте доступ к хосту. [Причина и проверка](guides#guide=terraform-7.1&section=q098-fleet-file-content)
diagnostics.content_3: Файл на указанном хосте мог устареть или не читаться. Сравните байты с north-98 без перевода строки или с одним переводом в конце и проверьте доступ к хосту. [Причина и проверка](guides#guide=terraform-7.1&section=q098-fleet-file-content)
diagnostics.mode_1: Развёртывание могло записать верные байты с другими правами. Проверьте режим 644 и доступ к указанному хосту. [Причина и проверка](guides#guide=terraform-7.1&section=q098-fleet-file-mode)
diagnostics.mode_2: Развёртывание могло записать верные байты с другими правами. Проверьте режим 644 и доступ к указанному хосту. [Причина и проверка](guides#guide=terraform-7.1&section=q098-fleet-file-mode)
diagnostics.mode_3: Развёртывание могло записать верные байты с другими правами. Проверьте режим 644 и доступ к указанному хосту. [Причина и проверка](guides#guide=terraform-7.1&section=q098-fleet-file-mode)
diagnostics.http_1: Файл на хосте мог обновиться, пока сервис отдаёт старый ответ или недоступен. Проверьте порт 8080 указанного хоста и сравните фактическое тело с north-98. [Причина и проверка](guides#guide=terraform-7.1&section=q098-fleet-http)
diagnostics.http_2: Файл на хосте мог обновиться, пока сервис отдаёт старый ответ или недоступен. Проверьте порт 8080 указанного хоста и сравните фактическое тело с north-98. [Причина и проверка](guides#guide=terraform-7.1&section=q098-fleet-http)
diagnostics.http_3: Файл на хосте мог обновиться, пока сервис отдаёт старый ответ или недоступен. Проверьте порт 8080 указанного хоста и сравните фактическое тело с north-98. [Причина и проверка](guides#guide=terraform-7.1&section=q098-fleet-http)
diagnostics.probe_0_1: Проверка может остановиться до определения условия из-за рабочей папки, входов плана или локальных инструментов. Проверьте окружение и выполните наблюдения файла, контракта и кластера по отдельности. [Причина и проверка](guides#guide=terraform-7.1&section=q098-cross-stack-observation)
