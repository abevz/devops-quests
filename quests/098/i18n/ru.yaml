title: Контракты между системами
brief: 'Работайте в `~/quest`. `main.tf` вызывает `modules/station/main.tf`: управляемый файл `managed-route.txt` содержит
  `north-98`, но выход устарел. Состояние OpenTofu хранит ID ресурса; сохраните ID из `original-id`. Добавьте ссылку на `local_file.contract.content`
  в выражение выхода route модуля, примените изменение и запишите выход в `contract.json` командой `tofu output -json contract
  > contract.json`. Выход и файл должны быть ровно `{ "route": "north-98" }`, а итоговый план с detailed-exitcode должен завершаться
  с 0. План должен ссылаться на `local_file.contract.content` в выходе route модуля.


  Используйте `rollout.yml`, `inventory.ini` и `ansible.cfg` для приватного парка SSH: на app1, app2 и app3 файл `/srv/site/message`
  должен содержать `north-98` и иметь режим `0644`, а HTTP-сервис каждого узла на порту 8080 должен возвращать `north-98`.
  Готовый обработчик выполняет `dq-service reload`; используйте `ansible-playbook rollout.yml -e @contract.json`. Установите
  данные ConfigMap `route` ровно в `{ "route": "north-98" }`. Из `board.json` сохраните одну реплику и ровно одну запись окружения
  первого контейнера: `ROUTE` из ConfigMap `route`, ключ `route`. Перезапустите Deployment для обновления окружения и проверьте
  ответ `north-98` от `board:8080`. Проверки наблюдают значения и ссылку выхода, но не доказывают проверку плана или способ
  передачи данных потребителям. Используйте только офлайн-песочницу. Файл сообщения должен содержать точно этот текст, после
  которого допускается один символ новой строки.'
debrief: Проверки обнаружили совпадающие значения производителя, парка и board, сохранённый ID и ссылку выхода модуля.
stages.0.brief: Исходный ID, ссылка и значения выхода, пустой план, файлы и ответы парка, конфигурация и ответ board соответствуют
  описанию.
stages.0.objectives.0.text: Исходный ID, ссылка и значения выхода, пустой план, файлы и ответы парка, конфигурация и ответ
  board соответствуют описанию.
hints.0.text: 'Начните с производителя: устаревший output делает несколько исправных потребителей одинаково неверными.'
hints.1.text: Выведите output из управляемого файла и пересоздайте единый контракт.
hints.2.text: Используйте контракт в Ansible и ConfigMap; Pod с env требует перезапуска.
phrases.0: Я нашёл источник рассогласования потребителей в устаревшем output.
phrases.1: Я передал единый контракт в конфигурацию и runtime.
phrases.2: Я проверил identity и каждого работающего потребителя после согласования.
