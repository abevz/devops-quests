id: 20
title: title
track: Boss
difficulty: basics
brief: brief
stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    check: |-
      set -euo pipefail
      cd ~/quest
      python3 -I - <<'DQ_BOSS'
      import json, os, re, subprocess, sys
      from pathlib import Path
      from decimal import Decimal

      def require(good, marker):
          if not good:raise AssertionError(marker)

      try:
          document=json.loads(subprocess.check_output(['tofu','show','-json'],stderr=subprocess.DEVNULL,timeout=5))
          pending=[document['values']['root_module']];found=False
          while pending:
              module=pending.pop();pending.extend(module.get('child_modules',[]))
              for resource in module.get('resources',[]):
                  value=resource.get('values',{});filename=value.get('filename')
                  if resource.get('mode')=='managed' and resource.get('type')=='local_file' and isinstance(filename,str):
                      try:found=found or Path(filename).samefile('release.txt')
                      except OSError:pass
          require(found,'state')

      except Exception as error:
          marker = str(error) if isinstance(error,AssertionError) and re.fullmatch(r'[a-z0-9_]+',str(error)) else 'state'
          print('Required result is missing: ✗ [DQ:'+marker+']')
          sys.exit(1)
      DQ_BOSS
  - text: stages.0.objectives.1.text
    check: |-
      set -euo pipefail
      cd ~/quest
      failed=0
      if ! test "$(cat release.txt 2>/dev/null)" = release-20; then printf '%s\n' 'release.txt = release-20: ✗ [DQ:file]'; failed=1; fi
      exit "$failed"
  - text: stages.0.objectives.2.text
    check: |-
      set -euo pipefail
      cd ~/quest
      failed=0
      if ! test "$(tofu output -raw release 2>/dev/null)" = release-20; then printf '%s\n' 'tofu output release = release-20: ✗ [DQ:output]'; failed=1; fi
      exit "$failed"
  - text: stages.0.objectives.3.text
    check: |-
      set -euo pipefail
      cd ~/quest
      failed=0
      if ! tofu plan -input=false -detailed-exitcode -no-color >/dev/null 2>&1; then printf '%s\n' 'tofu plan exits 0: ✗ [DQ:plan]'; failed=1; fi
      exit "$failed"
- brief: stages.1.brief
  objectives:
  - text: stages.1.objectives.0.text
    check: |-
      set -euo pipefail
      cd ~/quest
      failed=0
      for n in 1 2 3; do
        host="app${n}-${DQ_NAMESPACE#dq-}"
        result=$(ssh -n -o BatchMode=yes -o ConnectTimeout=3 -p 2222 "root@$host" 'value=$(cat /srv/site/message 2>/dev/null || true); mode=$(stat -c %a /srv/site/message 2>/dev/null || true); if test "$value" = release-20; then printf "content-ok\n"; fi; if test "$mode" = 644; then printf "mode-ok\n"; fi' 2>/dev/null || true)
        if ! grep -Fxq content-ok <<<"$result"; then printf '%s\n' "$host /srv/site/message = release-20: ✗ [DQ:content_$n]"; failed=1; fi
        if ! grep -Fxq mode-ok <<<"$result"; then printf '%s\n' "$host /srv/site/message mode = 644: ✗ [DQ:mode_$n]"; failed=1; fi

      done
      exit "$failed"
  - text: stages.1.objectives.1.text
    check: |-
      set -euo pipefail
      cd ~/quest
      failed=0
      for n in 1 2 3; do
        host="app${n}-${DQ_NAMESPACE#dq-}"
        if ! test "$(curl -fsS --max-time 3 "http://$host:8080" 2>/dev/null)" = release-20; then
          printf '%s\n' "$host:8080 = release-20: ✗ [DQ:http_$n]"; failed=1
        fi
      done
      exit "$failed"
  - text: stages.1.objectives.2.text
    check: |-
      set -euo pipefail
      cd ~/quest
      replay_failed=0
      if ! ANSIBLE_NOCOLOR=1 ansible-playbook rollout.yml > second-run.txt 2>&1; then printf '%s\n' 'Second delivery failed: ✗ [DQ:rerun]'; replay_failed=1; fi
      python3 -I - <<'DQ_RECAP'
      import json
      import re
      from pathlib import Path


      def count(value):
          if isinstance(value, bool):
              return None
          if isinstance(value, int) and value >= 0:
              return value
          if isinstance(value, str) and re.fullmatch(r'[0-9]+', value):
              return int(value)
          return None


      def unique_counter_fields(pairs):
          result = {}
          for key, value in pairs:
              if key in result:
                  raise RuntimeError('Ambiguous recap field')
              result[key] = value
          return result


      def recap(text):
          # Read an actual recap, not task output which happens to mention a counter.
          records = []
          try:
              records.append(json.loads(text, object_pairs_hook=unique_counter_fields))
          except ValueError:
              for line in text.splitlines():
                  try:
                      records.append(json.loads(line, object_pairs_hook=unique_counter_fields))
                  except ValueError:
                      pass
          for record in reversed(records):
              if not isinstance(record, dict):
                  continue
              stats = record.get('stats')
              if record.get('event') == 'playbook_on_stats':
                  event = record.get('event_data', {})
                  if isinstance(event, dict):
                      stats = {host: {key: values.get(host) for key, values in event.items()
                                      if isinstance(values, dict)}
                               for host in event.get('processed', {})}
              if isinstance(stats, dict):
                  rows = {}
                  for host, values in stats.items():
                      if not isinstance(values, dict):
                          continue
                      row = {}
                      for key, value in values.items():
                          key = {'failures':'failed','dark':'unreachable'}.get(key, key)
                          if key in row:
                              raise RuntimeError('Ambiguous normalized recap field')
                          row[key] = count(value)
                      rows[host] = row
                  return rows
          rows = {}
          body = text.rsplit('PLAY RECAP', 1)[-1]
          for line in body.splitlines():
              match = re.match(r'^([^\s:]+)\s*:\s*(.*)$', line)
              if not match:
                  continue
              fields = re.findall(r'\b(ok|changed|unreachable|failed|skipped|rescued|ignored)\s*=\s*([0-9]+)(?=\s|$)', match[2])
              if fields:
                  # Duplicate rows cannot stand in for another managed host.
                  if match[1] in rows or len({key for key, _ in fields}) != len(fields):
                      return {}
                  rows[match[1]] = {key: int(value) for key, value in fields}
          return rows


      def require_recaps(path, required, positive=(), prefix='recap'):
          try: text = Path(path).read_text()
          except OSError: text = ''
          rows = recap(text)
          failed = False
          for number in (1, 2, 3):
              row = rows.get('app' + str(number), {})
              for key, expected in required.items():
                  if key == 'unreachable' and not row:
                      continue
                  if row.get(key) != expected:
                      marker = prefix + '_' + str(number) + '_' + key if key in ('changed', 'failed') else 'rerun'
                      print('app' + str(number) + ' second delivery counter ' + key + ' must equal ' + str(expected) + ': ✗ [DQ:' + marker + ']')
                      failed = True
          assert not failed, 'Every required managed host needs its own successful recap'

      try:
          require_recaps('second-run.txt', {'changed':0, 'failed':0, 'unreachable':0})
      except AssertionError:
          raise SystemExit(1)
      except Exception:
          print('Unreadable or ambiguous delivery recap: ✗ [DQ:rerun]')
          raise SystemExit(1)
      DQ_RECAP
      test "$replay_failed" -eq 0
