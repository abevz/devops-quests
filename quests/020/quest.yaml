id: 20
title: title
track: Boss
difficulty: basics
brief: brief
stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    check: 'test "$(cat release.txt)" = release-20

      test "$(tofu output -raw release)" = release-20

      tofu state list | grep -Fx local_file.release

      tofu plan -input=false -detailed-exitcode -no-color >/dev/null'
- brief: stages.1.brief
  objectives:
  - text: stages.1.objectives.0.text
    check: 'ssh -n -o BatchMode=yes -p 2222 root@app1-"${DQ_NAMESPACE#dq-}" ''set -eu; test "$(cat /srv/site/message)"
      = release-20; test "$(stat -c %a /srv/site/message)" = 644''

      ssh -n -o BatchMode=yes -p 2222 root@app2-"${DQ_NAMESPACE#dq-}" ''set -eu; test "$(cat /srv/site/message)"
      = release-20; test "$(stat -c %a /srv/site/message)" = 644''

      ssh -n -o BatchMode=yes -p 2222 root@app3-"${DQ_NAMESPACE#dq-}" ''set -eu; test "$(cat /srv/site/message)"
      = release-20; test "$(stat -c %a /srv/site/message)" = 644''

      test "$(curl -fsS --max-time 3 http://app1-${DQ_NAMESPACE#dq-}:8080)" = release-20

      test "$(curl -fsS --max-time 3 http://app2-${DQ_NAMESPACE#dq-}:8080)" = release-20

      test "$(curl -fsS --max-time 3 http://app3-${DQ_NAMESPACE#dq-}:8080)" = release-20

      ANSIBLE_NOCOLOR=1 ansible-playbook rollout.yml > second-run.txt

      test "$(grep -Ec ''^(app1|app2|app3)[[:space:]]+:.*changed=0.*failed=0'' second-run.txt)" = 3'
hints:
- text: hints.0.text
  guide: ansible-10
- text: hints.1.text
  guide: ansible-10
- text: hints.2.text
  guide: ansible-10
debrief: debrief
phrases:
- phrases.0
- phrases.1
