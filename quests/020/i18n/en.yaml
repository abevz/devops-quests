title: Repeatable rollout
brief: 'Bring a small station fleet online from one managed release marker. First make OpenTofu produce release-20 in release.txt.
  Then deliver that file to the three target banners, reload only when it changes and prove a repeated playbook run changes
  nothing. The fleet inventory is already supplied.


  Quest files in `~/quest` (some appear in later stages): `inventory.ini`, `ansible.cfg`, `main.tf`, `rollout.yml`, `release.txt`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services. Change only this
  bay.


  Initial success criteria: The managed release marker and output are release-20 with an empty plan.'
debrief: The local artifact became a shared contract between OpenTofu and Ansible. File state, live HTTP responses and the
  second-run recap prove delivery and repeatability separately.
stages.0.brief: 'Read `main.tf` in `~/quest`: it declares the offline provider, `local_file.release` and output `release`.
  Initialize and apply. Verify `release.txt` and `tofu output -raw release` equal `release-20`, `tofu state list` contains
  `local_file.release`, and `tofu plan -input=false -detailed-exitcode -no-color` exits 0 (no changes).'
stages.0.objectives.0.text: The managed release marker and output are release-20 with an empty plan.
stages.1.brief: 'Read `inventory.ini`, `ansible.cfg` and `rollout.yml` in `~/quest`. Ansible sends tasks over SSH to each
  private fleet host. Deliver `release-20` to `/srv/site/message` with mode `0644` on app1, app2 and app3. Add a handler with
  `dq-service reload` and notify it when the file changes so the service rereads the file; run `ansible-playbook rollout.yml`.
  Verify each host''s HTTP response on port 8080 is `release-20`. The checks inspect the files, modes and responses; they
  do not prove which commands were used.


  Run `ansible-playbook rollout.yml` again. Its recap must show `changed=0` and `failed=0` for each host; the check saves
  that repeat run to `second-run.txt`. The response and recap do not prove when a reload occurred.'
stages.1.objectives.0.text: All three live banners serve release-20, files have mode 0644 and a repeated rollout has changed=0/failed=0
  for every host.
hints.0.text: Separate the managed local artifact from its remote delivery.
hints.1.text: A successful play with zero matched hosts does not configure the fleet.
hints.2.text: Use a handler for the live banner reload and inspect the second recap.
phrases.0: I repaired the release as declared state.
phrases.1: I let the local_file resource create the release artifact.
phrases.2: I verified the deployed contract and a repeatable empty plan.
