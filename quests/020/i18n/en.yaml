title: Repeatable rollout
brief: "Release delivery is incomplete between the managed local artifact and the live fleet banners.\n\nWork in\
  \ `~/quest` on the workstation. Inputs by stage:\n- Stage 1: `main.tf`.\n- Stage 2: `inventory.ini`, `ansible.cfg`,\
  \ `rollout.yml`.\n\n**Requirements:**\n\n- Stage 1:\n  - OpenTofu records the managed release artifact in state.\n\
  \  - On the workstation, `release.txt` contains `release-20`.\n  - The configured release output reports `release-20`.\n\
  \  - The OpenTofu plan exits `0` with no changes.\n- Stage 2:\n  - On every managed host (`app1`, `app2`, `app3`),\
  \ `/srv/site/message` contains `release-20` with mode `0644`.\n  - From the workstation, `app1`, `app2` and `app3`\
  \ each return `release-20` over HTTP on port `8080`.\n  - Repeating delivery succeeds without changing any managed\
  \ host.\n\nThe read-only preview predicts repeat behavior; Check actually repeats `rollout.yml` and saves its\
  \ recap in `~/quest/second-run.txt` on the workstation. Current responses and recap do not prove the original\
  \ delivery commands or when a reload occurred."
debrief: The local artifact became a shared contract between OpenTofu and Ansible. File state, live HTTP responses
  and the second-run recap prove delivery and repeatability separately.
stages.0.brief: The local release must be consistent with its saved management state.
stages.1.brief: Delivery must remain stable when repeated.
hints.0.text: Separate the managed local artifact from its remote delivery.
hints.1.text: 'A successful play with zero matched hosts does not configure the fleet.


  Inspect the managed artifact and inventory before comparing hosts.


  ```sh

  cat main.tf

  cat rollout.yml

  ansible-inventory --list

  ```'
hints.2.text: |-
  Use `tofu init` and `tofu apply` for the managed local artifact.

  Use a handler for the live banner reload and inspect the second recap. Notify a handler that runs `dq-service reload` when `/srv/site/message` changes; run the delivery with `ansible-playbook rollout.yml`.

  Verify the relevant stage after repairing it.

  Stage 1: The state includes `release.txt`; the file and output both show `release-20`; the plan exits `0` without changes.

  ```sh
  tofu show -json
  cat release.txt
  printf "\n"
  tofu output -raw release
  printf "\n"
  tofu plan -input=false -detailed-exitcode -no-color
  ```

  Stage 2: Each managed host shows `release-20`, file mode `644`, and HTTP `release-20` on port `8080`.

  ```sh
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    printf "%s: " "$host"
    ssh -n -o BatchMode=yes -p 2222 "root@$host" 'cat /srv/site/message; stat -c %a /srv/site/message'
    curl -fsS --max-time 3 "http://$host:8080"
    printf "\n"
  done
  ```

  Stage 2: The preview reports `changed=0` and `failed=0` for `app1`, `app2` and `app3`.

  ```sh
  ansible-playbook rollout.yml --check
  ```

phrases.0: I repaired the release as declared state.
phrases.1: I let the local_file resource create the release artifact.
phrases.2: I verified the deployed contract and a repeatable empty plan.
diagnostics.file: |-
  The release file can still hold the previous value if the corrected configuration has not been applied or the file was edited afterward. [Guide](guides#guide=terraform-3&section=release-artifact-production)
diagnostics.output: |-
  The root output can remain empty or stale if it is not linked to the managed release or the output change has not been applied. [Guide](guides#guide=terraform-3&section=release-artifact-production)
diagnostics.state: |-
  A file on disk can exist without a local_file resource in state that manages that exact path. [Guide](guides#guide=terraform-3&section=release-artifact-production)
diagnostics.plan: |-
  The plan can report pending changes if the release declaration differs from the applied state or the managed file has drifted. [Guide](guides#guide=terraform-3&section=release-artifact-production)
diagnostics.content_1: |-
  app1 may still have the old release if the copy task used old content or the updated play did not reach this host. [Guide](guides#guide=ansible-2&section=release-fleet-targets)
diagnostics.content_2: |-
  app2 may still have the old release if the copy task used old content or the updated play did not reach this host. [Guide](guides#guide=ansible-2&section=release-fleet-targets)
diagnostics.content_3: |-
  app3 may still have the old release if the copy task used old content or the updated play did not reach this host. [Guide](guides#guide=ansible-2&section=release-fleet-targets)
diagnostics.mode_1: |-
  The file on app1 can keep the wrong mode if the copy task used different permissions or skipped this host. [Guide](guides#guide=ansible-2&section=release-fleet-targets)
diagnostics.mode_2: |-
  The file on app2 can keep the wrong mode if the copy task used different permissions or skipped this host. [Guide](guides#guide=ansible-2&section=release-fleet-targets)
diagnostics.mode_3: |-
  The file on app3 can keep the wrong mode if the copy task used different permissions or skipped this host. [Guide](guides#guide=ansible-2&section=release-fleet-targets)
diagnostics.http_1: |-
  The service on app1 may still serve a cached release if the delivery changed the file without running the reload handler. [Guide](guides#guide=ansible-10&section=release-repeat-delivery)
diagnostics.http_2: |-
  The service on app2 may still serve a cached release if the delivery changed the file without running the reload handler. [Guide](guides#guide=ansible-10&section=release-repeat-delivery)
diagnostics.http_3: |-
  The service on app3 may still serve a cached release if the delivery changed the file without running the reload handler. [Guide](guides#guide=ansible-10&section=release-repeat-delivery)
diagnostics.rerun: |-
  The second run may fail to reach a host or leave an incomplete recap. Check second-run.txt for the play error and all three host rows. [Guide](guides#guide=ansible-10&section=release-repeat-delivery)
diagnostics.recap_1_changed: |-
  A nonzero changed count for app1 can mean the play rewrites an already correct file or reloads unconditionally. [Guide](guides#guide=ansible-10&section=release-repeat-delivery)
diagnostics.recap_1_failed: |-
  The recap for app1 can be missing or report failures when a task fails or that host is not selected. Inspect its task output. [Guide](guides#guide=ansible-10&section=release-repeat-delivery)
diagnostics.recap_2_changed: |-
  A nonzero changed count for app2 can mean the play rewrites an already correct file or reloads unconditionally. [Guide](guides#guide=ansible-10&section=release-repeat-delivery)
diagnostics.recap_2_failed: |-
  The recap for app2 can be missing or report failures when a task fails or that host is not selected. Inspect its task output. [Guide](guides#guide=ansible-10&section=release-repeat-delivery)
diagnostics.recap_3_changed: |-
  A nonzero changed count for app3 can mean the play rewrites an already correct file or reloads unconditionally. [Guide](guides#guide=ansible-10&section=release-repeat-delivery)
diagnostics.recap_3_failed: |-
  The recap for app3 can be missing or report failures when a task fails or that host is not selected. Inspect its task output. [Guide](guides#guide=ansible-10&section=release-repeat-delivery)
stages.0.objectives.0.text: OpenTofu records the managed release artifact in state.
stages.0.objectives.1.text: On the workstation, `release.txt` contains `release-20`.
stages.0.objectives.2.text: The configured release output reports `release-20`.
stages.0.objectives.3.text: The OpenTofu plan exits `0` with no changes.
stages.1.objectives.0.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` contains `release-20`
  with mode `0644`.
stages.1.objectives.1.text: From the workstation, `app1`, `app2` and `app3` each return `release-20` over HTTP on
  port `8080`.
stages.1.objectives.2.text: Repeating delivery succeeds without changing any managed host.
diagnostics.probe_0_0: |-
  If the state probe returns no result, check that the workstation can launch Python before inspecting the managed resource. [Guide](guides#guide=terraform-3&section=release-artifact-production)
diagnostics.probe_1_2: |-
  The probe can stop before reading the recap if its runtime is unavailable. Check the workstation and the saved second-run output. [Guide](guides#guide=ansible-10&section=release-repeat-delivery)
