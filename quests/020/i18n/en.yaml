title: Repeatable rollout
brief: 'Bring a small station fleet online from one managed release marker. First make OpenTofu produce
  release-20 in release.txt. Then deliver that file to the three target banners, reload only when it changes
  and prove a repeated playbook run changes nothing. The fleet inventory is already supplied.


  Quest files in `~/quest` (some appear in later stages): `inventory.ini`, `ansible.cfg`, `main.tf`, `rollout.yml`,
  `release.txt`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: The managed release marker and output are release-20 with an empty plan.'
debrief: The local artifact became a shared contract between OpenTofu and Ansible. File state, live HTTP
  responses and the second-run recap prove delivery and repeatability separately.
stages.0.brief: 'Repair the desired release in main.tf. release.txt is created by the local_file resource.


  Success criteria: The managed release marker and output are release-20 with an empty plan.'
stages.0.objectives.0.text: The managed release marker and output are release-20 with an empty plan.
stages.1.brief: 'The marker is ready. Repair the play target and change-triggered reload, then converge
  the fleet.


  Success criteria: All three live banners serve release-20, files have mode 0644 and a repeated rollout
  has changed=0/failed=0 for every host.'
stages.1.objectives.0.text: All three live banners serve release-20, files have mode 0644 and a repeated
  rollout has changed=0/failed=0 for every host.
hints.0.text: Separate the managed local artifact from its remote delivery.
hints.1.text: A successful play with zero matched hosts does not configure the fleet.
hints.2.text: Use a handler for the live banner reload and inspect the second recap.
phrases.0: I repaired the release as declared state.
phrases.1: I let the local_file resource create the release artifact.
phrases.2: I verified the deployed contract and a repeatable empty plan.
