title: Повторяемый rollout
brief: "Доставка релиза не завершена между управляемым локальным артефактом и живыми баннерами парка хостов.\n\n\
  Работайте в `~/quest` на рабочей станции. Входные файлы по этапам:\n- Этап 1: `main.tf`.\n- Этап 2: `inventory.ini`,\
  \ `ansible.cfg`, `rollout.yml`.\n\n**Требования:**\n\n- Этап 1:\n  - OpenTofu учитывает управляемый артефакт релиза\
  \ в state.\n  - На рабочей станции `release.txt` содержит `release-20`.\n  - Настроенный output релиза сообщает\
  \ `release-20`.\n  - План OpenTofu завершается с кодом `0` без изменений.\n- Этап 2:\n  - На каждом управляемом\
  \ хосте (`app1`, `app2`, `app3`) `/srv/site/message` содержит `release-20` и имеет режим `0644`.\n  - С рабочей\
  \ станции каждый из хостов `app1`, `app2` и `app3` возвращает `release-20` по HTTP на порту `8080`.\n  - Повторная\
  \ доставка завершается успешно без изменений на управляемых хостах.\n\nПредварительный прогон без изменений прогнозирует\
  \ повторное выполнение; Check действительно повторяет `rollout.yml` и сохраняет итог в `~/quest/second-run.txt`\
  \ на рабочей станции. Текущие ответы и итог не доказывают исходные команды доставки и момент перезагрузки."
debrief: Локальный артефакт стал общим контрактом OpenTofu и Ansible. Файлы, живые HTTP-ответы и recap второго запуска
  отдельно доказывают доставку и повторяемость.
stages.0.brief: Локальный релиз должен быть согласован с сохранённым состоянием управления.
stages.1.brief: Повторная доставка должна сохранять стабильное состояние.
hints.0.text: Отделите локальный управляемый артефакт от его удалённой доставки.
hints.1.text: 'Успешный play без подходящих хостов не настраивает парк.


  Изучите управляемый артефакт и inventory перед сравнением хостов.


  ```sh

  cat main.tf

  cat rollout.yml

  ansible-inventory --list

  ```'
hints.2.text: |-
  Для управляемого локального артефакта используйте `tofu init` и `tofu apply`.

  Используйте handler для reload и изучите второй recap. При изменении `/srv/site/message` уведомляйте handler с `dq-service reload`; запускайте доставку через `ansible-playbook rollout.yml`.

  Проверьте соответствующий этап после исправления.

  Этап 1: State включает `release.txt`; файл и output показывают `release-20`; план завершается с кодом `0` без изменений.

  ```sh
  tofu show -json
  cat release.txt
  printf "\n"
  tofu output -raw release
  printf "\n"
  tofu plan -input=false -detailed-exitcode -no-color
  ```

  Этап 2: Каждый управляемый хост показывает `release-20`, режим файла `644` и HTTP `release-20` на порту `8080`.

  ```sh
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    printf "%s: " "$host"
    ssh -n -o BatchMode=yes -p 2222 "root@$host" 'cat /srv/site/message; stat -c %a /srv/site/message'
    curl -fsS --max-time 3 "http://$host:8080"
    printf "\n"
  done
  ```

  Этап 2: Предварительный прогон показывает `changed=0` и `failed=0` для `app1`, `app2` и `app3`.

  ```sh
  ansible-playbook rollout.yml --check
  ```

phrases.0: Я исправил релиз в декларативном состоянии.
phrases.1: Я предоставил ресурсу local_file создать артефакт релиза.
phrases.2: Я проверил контракт выкладки и повторяемый пустой plan.
diagnostics.file: |-
  Файл может хранить прежний релиз, если исправленную конфигурацию не применили или файл затем изменили вручную. [Гайд](guides#guide=terraform-3&section=release-artifact-production)
diagnostics.output: |-
  Корневой выход может быть пустым или устаревшим, если он не связан с управляемым релизом или правку ещё не применили. [Гайд](guides#guide=terraform-3&section=release-artifact-production)
diagnostics.state: |-
  Файл на диске может существовать без ресурса local_file в состоянии, управляющего именно этим путём. [Гайд](guides#guide=terraform-3&section=release-artifact-production)
diagnostics.plan: |-
  План может показать изменения, если объявление релиза расходится с применённым состоянием или файл изменили вручную. [Гайд](guides#guide=terraform-3&section=release-artifact-production)
diagnostics.content_1: |-
  На app1 мог остаться старый релиз, если задача копировала прежнее содержимое или обновлённый play не дошёл до этого хоста. [Гайд](guides#guide=ansible-2&section=release-fleet-targets)
diagnostics.content_2: |-
  На app2 мог остаться старый релиз, если задача копировала прежнее содержимое или обновлённый play не дошёл до этого хоста. [Гайд](guides#guide=ansible-2&section=release-fleet-targets)
diagnostics.content_3: |-
  На app3 мог остаться старый релиз, если задача копировала прежнее содержимое или обновлённый play не дошёл до этого хоста. [Гайд](guides#guide=ansible-2&section=release-fleet-targets)
diagnostics.mode_1: |-
  Файл на app1 мог сохранить неверные права, если задача копирования задала другой режим или пропустила этот хост. [Гайд](guides#guide=ansible-2&section=release-fleet-targets)
diagnostics.mode_2: |-
  Файл на app2 мог сохранить неверные права, если задача копирования задала другой режим или пропустила этот хост. [Гайд](guides#guide=ansible-2&section=release-fleet-targets)
diagnostics.mode_3: |-
