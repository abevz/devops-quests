title: Повторяемый rollout
brief: 'Запустите небольшой парк станций из одного управляемого маркера. Сначала получите через OpenTofu
  release-20 в release.txt. Затем доставьте файл трём banner-процессам, перезагружайте только при изменении
  и подтвердите повторный запуск без изменений. Inventory уже выдан.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `inventory.ini`, `ansible.cfg`, `main.tf`,
  `rollout.yml`, `release.txt`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Управляемый маркер и output равны release-20, plan пуст.'
debrief: Локальный артефакт стал общим контрактом OpenTofu и Ansible. Файлы, живые HTTP-ответы и recap
  второго запуска отдельно доказывают доставку и повторяемость.
stages.0.brief: 'Исправьте требуемый релиз в main.tf. release.txt создаётся ресурсом local_file.


  Результат проверки: Управляемый маркер и output равны release-20, plan пуст.'
stages.0.objectives.0.text: Управляемый маркер и output равны release-20, plan пуст.
stages.1.brief: 'Маркер готов. Исправьте группу целей и reload по изменению, затем приведите парк к требуемому
  состоянию.


  Результат проверки: Три работающих banner возвращают release-20, файлы имеют mode 0644, повторный rollout
  даёт changed=0/failed=0 на каждом хосте.'
stages.1.objectives.0.text: Три работающих banner возвращают release-20, файлы имеют mode 0644, повторный
  rollout даёт changed=0/failed=0 на каждом хосте.
hints.0.text: Отделите локальный управляемый артефакт от его удалённой доставки.
hints.1.text: Успешный play без подходящих хостов не настраивает парк.
hints.2.text: Используйте handler для reload и изучите второй recap.
phrases.0: Я исправил релиз в декларативном состоянии.
phrases.1: Я предоставил ресурсу local_file создать артефакт релиза.
phrases.2: Я проверил контракт выкладки и повторяемый пустой plan.
