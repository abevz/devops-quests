stages.1.objectives.2.text: Повторная доставка завершается успешно без изменений на управляемых хостах.
diagnostics.probe_0_0: |-
  Если проверка состояния не выводит результат, проверьте запуск Python на рабочей станции и затем управляемый ресурс. [Гайд](guides#guide=terraform-3&section=release-artifact-production)
diagnostics.probe_1_2: |-
  Проверка может остановиться до чтения сводки, если недоступно окружение для её запуска. Проверьте рабочую станцию и сохранённый вывод повторного запуска. [Гайд](guides#guide=ansible-10&section=release-repeat-delivery)
