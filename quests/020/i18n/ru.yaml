diagnostics.http_1: |-
  Сервис на app1 может отдавать предыдущий релиз из памяти, если доставка изменила файл без запуска обработчика перечитывания. [Гайд](guides#guide=ansible-10&section=release-repeat-delivery)
diagnostics.http_2: |-
  Сервис на app2 может отдавать предыдущий релиз из памяти, если доставка изменила файл без запуска обработчика перечитывания. [Гайд](guides#guide=ansible-10&section=release-repeat-delivery)
diagnostics.http_3: |-
