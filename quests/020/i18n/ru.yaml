diagnostics.rerun: |-
  Повторный запуск мог не подключиться к хосту или оставить неполную сводку. Проверьте ошибку play и строки трёх хостов в second-run.txt. [Гайд](guides#guide=ansible-10&section=release-repeat-delivery)
diagnostics.recap_1_changed: |-
  Ненулевой changed для app1 может означать, что play переписывает уже правильный файл или безусловно перечитывает баннер. [Гайд](guides#guide=ansible-10&section=release-repeat-delivery)
diagnostics.recap_1_failed: |-
  Сводка для app1 может отсутствовать или содержать отказ, если задача не выполнилась или хост не выбран. Проверьте вывод задач. [Гайд](guides#guide=ansible-10&section=release-repeat-delivery)
