title: Повторяемый rollout
brief: 'Запустите небольшой парк станций из одного управляемого маркера. Сначала получите через OpenTofu release-20 в release.txt.
  Затем доставьте файл трём banner-процессам, перезагружайте только при изменении и подтвердите повторный запуск без изменений.
  Inventory уже выдан.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `inventory.ini`, `ansible.cfg`, `main.tf`, `rollout.yml`,
  `release.txt`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы и приватные сервисы.
  Менять можно только эту песочницу.


  Цели первого этапа: Управляемый маркер и output равны release-20, plan пуст.'
debrief: Локальный артефакт стал общим контрактом OpenTofu и Ansible. Файлы, живые HTTP-ответы и recap второго запуска отдельно
  доказывают доставку и повторяемость.
stages.0.brief: 'Изучите `main.tf` в `~/quest`: он объявляет офлайн-провайдер, `local_file.release` и выход `release`. Инициализируйте
  и примените. Проверьте, что `release.txt` и `tofu output -raw release` равны `release-20`, `tofu state list` содержит `local_file.release`,
  а `tofu plan -input=false -detailed-exitcode -no-color` завершается с 0 (изменений нет).'
stages.0.objectives.0.text: Управляемый маркер и output равны release-20, plan пуст.
stages.1.brief: 'Изучите `inventory.ini`, `ansible.cfg` и `rollout.yml` в `~/quest`. Ansible отправляет задачи по SSH каждому
  узлу приватного парка. Запишите `release-20` в `/srv/site/message` с режимом `0644` на app1, app2 и app3. Добавьте обработчик
  с `dq-service reload` и уведомляйте его при изменении файла, чтобы сервис перечитал файл; выполните `ansible-playbook rollout.yml`.
  Проверьте, что HTTP-ответ каждого узла на порту 8080 равен `release-20`. Проверки наблюдают файлы, режимы и ответы, но не
  доказывают, какие команды применялись.


  Повторно выполните `ansible-playbook rollout.yml`. Сводка должна показывать `changed=0` и `failed=0` для каждого узла; проверка
  сохраняет повторный запуск в `second-run.txt`. Ответ и сводка не доказывают, когда произошла перезагрузка.'
stages.1.objectives.0.text: Три работающих banner возвращают release-20, файлы имеют mode 0644, повторный rollout даёт changed=0/failed=0
  на каждом хосте.
hints.0.text: Отделите локальный управляемый артефакт от его удалённой доставки.
hints.1.text: Успешный play без подходящих хостов не настраивает парк.
hints.2.text: Используйте handler для reload и изучите второй recap.
phrases.0: Я исправил релиз в декларативном состоянии.
phrases.1: Я предоставил ресурсу local_file создать артефакт релиза.
phrases.2: Я проверил контракт выкладки и повторяемый пустой plan.
