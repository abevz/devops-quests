title: Repetible rollout
brief: "La entrega de la versión está incompleta entre el artefacto local gestionado y los banners activos de la\
  \ flota.\n\nTrabaja en `~/quest` en la estación de trabajo. Entradas por etapa:\n- Etapa 1: `main.tf`.\n- Etapa\
  \ 2: `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n\n**Requisitos:**\n\n- Etapa 1:\n  - OpenTofu registra el\
  \ artefacto de versión gestionado en el state.\n  - En la estación de trabajo, `release.txt` contiene `release-20`.\n\
  \  - El output de versión configurado informa `release-20`.\n  - El plan de OpenTofu termina con código `0` sin\
  \ cambios.\n- Etapa 2:\n  - En cada host gestionado (`app1`, `app2`, `app3`), `/srv/site/message` contiene `release-20`\
  \ con modo `0644`.\n  - Desde la estación de trabajo, `app1`, `app2` y `app3` devuelven cada uno `release-20`\
  \ por HTTP en el puerto `8080`.\n  - Repetir la entrega tiene éxito sin cambiar ningún host gestionado.\n\nLa\
  \ vista previa de solo lectura predice la repetición; Check repite realmente `rollout.yml` y guarda el resumen\
  \ en `~/quest/second-run.txt` en la estación de trabajo. Las respuestas actuales y el resumen no prueban los comandos\
  \ originales de entrega ni cuándo ocurrió una recarga."
debrief: El artefacto local se convirtió en un contrato compartido entre OpenTofu y Ansible. El estado del archivo,
  las respuestas HTTP en vivo y el recap de segunda ejecución demuestran la entrega y la repetibilidad por separado.
stages.0.brief: La versión local debe ser coherente con su estado de gestión guardado.
stages.1.brief: La entrega debe mantenerse estable al repetirse.
hints.0.text: Separe el artefacto local administrado de su entrega remota.
hints.1.text: 'Un play exitoso sin hosts coincidentes no configura la flota.


  Inspecciona el artefacto gestionado y el inventario antes de comparar hosts.


  ```sh

  cat main.tf

  cat rollout.yml

  ansible-inventory --list

  ```'
hints.2.text: "Usa `tofu init` y `tofu apply` para el artefacto local gestionado.\n\nUtilice un handler para el\
  \ banner en vivo reload y un inspect para el segundo recap. Notifica un handler con `dq-service reload` cuando\
  \ cambie `/srv/site/message`; ejecuta la entrega con `ansible-playbook rollout.yml`.\n\nVerifica la etapa correspondiente\
  \ tras repararla.\n\nEtapa 1: El state incluye `local_file.release`; el archivo y el output muestran `release-20`;\
  \ el plan termina con código `0` sin cambios.\n\n```sh\ntofu state list\ncat release.txt\nprintf \"\\n\"\ntofu\
  \ output -raw release\nprintf \"\\n\"\ntofu plan -input=false -detailed-exitcode -no-color\n```\n\nEtapa 2: Cada\
  \ host gestionado muestra `release-20`, modo de archivo `644` y HTTP `release-20` en el puerto `8080`.\n\n```sh\n\
  for n in 1 2 3; do\n  host=\"app${n}-${DQ_NAMESPACE#dq-}\"\n  printf \"%s: \" \"$host\"\n  ssh -n -o BatchMode=yes\
  \ -p 2222 \"root@$host\" 'cat /srv/site/message; stat -c %a /srv/site/message'\n  curl -fsS --max-time 3 \"http://$host:8080\"\
  \n  printf \"\\n\"\ndone\n```\n\nEtapa 2: La vista previa informa `changed=0` y `failed=0` para `app1`, `app2`\
  \ y `app3`.\n\n```sh\nansible-playbook rollout.yml --check\n```"
phrases.0: Reparé el lanzamiento como estado declarado.
phrases.1: Dejé que el recurso local_file creara el artefacto de lanzamiento.
phrases.2: Verifiqué el contrato implementado y un plan vacío repetible.
