title: Repetible rollout
brief: "La entrega de la versión está incompleta entre el artefacto local gestionado y los banners activos de la\
  \ flota.\n\nTrabaja en `~/quest` en la estación de trabajo. Entradas por etapa:\n- Etapa 1: `main.tf`.\n- Etapa\
  \ 2: `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n\n**Requisitos:**\n\n- Etapa 1:\n  - OpenTofu registra el\
  \ artefacto de versión gestionado en el state.\n  - En la estación de trabajo, `release.txt` contiene `release-20`.\n\
  \  - El output de versión configurado informa `release-20`.\n  - El plan de OpenTofu termina con código `0` sin\
  \ cambios.\n- Etapa 2:\n  - En cada host gestionado (`app1`, `app2`, `app3`), `/srv/site/message` contiene `release-20`\
  \ con modo `0644`.\n  - Desde la estación de trabajo, `app1`, `app2` y `app3` devuelven cada uno `release-20`\
  \ por HTTP en el puerto `8080`.\n  - Repetir la entrega tiene éxito sin cambiar ningún host gestionado.\n\nLa\
  \ vista previa de solo lectura predice la repetición; Check repite realmente `rollout.yml` y guarda el resumen\
  \ en `~/quest/second-run.txt` en la estación de trabajo. Las respuestas actuales y el resumen no prueban los comandos\
  \ originales de entrega ni cuándo ocurrió una recarga."
debrief: El artefacto local se convirtió en un contrato compartido entre OpenTofu y Ansible. El estado del archivo,
  las respuestas HTTP en vivo y el recap de segunda ejecución demuestran la entrega y la repetibilidad por separado.
stages.0.brief: La versión local debe ser coherente con su estado de gestión guardado.
stages.1.brief: La entrega debe mantenerse estable al repetirse.
hints.0.text: Separe el artefacto local administrado de su entrega remota.
hints.1.text: 'Un play exitoso sin hosts coincidentes no configura la flota.


  Inspecciona el artefacto gestionado y el inventario antes de comparar hosts.


  ```sh

  cat main.tf

  cat rollout.yml

  ansible-inventory --list

  ```'
hints.2.text: |-
  Usa `tofu init` y `tofu apply` para el artefacto local gestionado.

  Utilice un handler para el banner en vivo reload y un inspect para el segundo recap. Notifica un handler con `dq-service reload` cuando cambie `/srv/site/message`; ejecuta la entrega con `ansible-playbook rollout.yml`.

  Verifica la etapa correspondiente tras repararla.

  Etapa 1: El state incluye `release.txt`; el archivo y el output muestran `release-20`; el plan termina con código `0` sin cambios.

  ```sh
  tofu show -json
  cat release.txt
  printf "\n"
  tofu output -raw release
  printf "\n"
  tofu plan -input=false -detailed-exitcode -no-color
  ```

  Etapa 2: Cada host gestionado muestra `release-20`, modo de archivo `644` y HTTP `release-20` en el puerto `8080`.

  ```sh
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    printf "%s: " "$host"
    ssh -n -o BatchMode=yes -p 2222 "root@$host" 'cat /srv/site/message; stat -c %a /srv/site/message'
    curl -fsS --max-time 3 "http://$host:8080"
    printf "\n"
  done
  ```

  Etapa 2: La vista previa informa `changed=0` y `failed=0` para `app1`, `app2` y `app3`.

  ```sh
  ansible-playbook rollout.yml --check
  ```

phrases.0: Reparé el lanzamiento como estado declarado.
phrases.1: Dejé que el recurso local_file creara el artefacto de lanzamiento.
phrases.2: Verifiqué el contrato implementado y un plan vacío repetible.
diagnostics.file: |-
  El archivo puede conservar la versión anterior si no se aplicó la configuración corregida o si se editó después. [Guía](guides#guide=terraform-3&section=release-artifact-production)
diagnostics.output: |-
  La salida raíz puede estar vacía u obsoleta si no apunta a la versión gestionada o si el cambio aún no se aplicó. [Guía](guides#guide=terraform-3&section=release-artifact-production)
diagnostics.state: |-
  El archivo puede existir en disco sin un recurso local_file en el estado que gestione esa ruta exacta. [Guía](guides#guide=terraform-3&section=release-artifact-production)
diagnostics.plan: |-
  El plan puede mostrar cambios pendientes si la declaración difiere del estado aplicado o si el archivo gestionado cambió. [Guía](guides#guide=terraform-3&section=release-artifact-production)
diagnostics.content_1: |-
  app1 puede conservar la versión anterior si la copia usó contenido antiguo o si el play actualizado no llegó a ese host. [Guía](guides#guide=ansible-2&section=release-fleet-targets)
diagnostics.content_2: |-
  app2 puede conservar la versión anterior si la copia usó contenido antiguo o si el play actualizado no llegó a ese host. [Guía](guides#guide=ansible-2&section=release-fleet-targets)
diagnostics.content_3: |-
  app3 puede conservar la versión anterior si la copia usó contenido antiguo o si el play actualizado no llegó a ese host. [Guía](guides#guide=ansible-2&section=release-fleet-targets)
diagnostics.mode_1: |-
  El archivo de app1 puede conservar un modo incorrecto si la copia aplicó otros permisos u omitió ese host. [Guía](guides#guide=ansible-2&section=release-fleet-targets)
diagnostics.mode_2: |-
  El archivo de app2 puede conservar un modo incorrecto si la copia aplicó otros permisos u omitió ese host. [Guía](guides#guide=ansible-2&section=release-fleet-targets)
diagnostics.mode_3: |-
  El archivo de app3 puede conservar un modo incorrecto si la copia aplicó otros permisos u omitió ese host. [Guía](guides#guide=ansible-2&section=release-fleet-targets)
diagnostics.http_1: |-
  El servicio de app1 puede seguir sirviendo la versión guardada si la entrega cambió el archivo sin ejecutar el controlador de recarga. [Guía](guides#guide=ansible-10&section=release-repeat-delivery)
diagnostics.http_2: |-
  El servicio de app2 puede seguir sirviendo la versión guardada si la entrega cambió el archivo sin ejecutar el controlador de recarga. [Guía](guides#guide=ansible-10&section=release-repeat-delivery)
diagnostics.http_3: |-
  El servicio de app3 puede seguir sirviendo la versión guardada si la entrega cambió el archivo sin ejecutar el controlador de recarga. [Guía](guides#guide=ansible-10&section=release-repeat-delivery)
diagnostics.rerun: |-
  La segunda ejecución puede no llegar a un host o dejar un resumen incompleto. Revisa el error y las tres filas en second-run.txt. [Guía](guides#guide=ansible-10&section=release-repeat-delivery)
diagnostics.recap_1_changed: |-
  Un changed distinto de cero en app1 puede indicar que el play reescribe un archivo correcto o recarga siempre. [Guía](guides#guide=ansible-10&section=release-repeat-delivery)
diagnostics.recap_1_failed: |-
  El resumen de app1 puede faltar o indicar un fallo si una tarea falla o el host no se selecciona. Revisa la salida de la tarea. [Guía](guides#guide=ansible-10&section=release-repeat-delivery)
diagnostics.recap_2_changed: |-
  Un changed distinto de cero en app2 puede indicar que el play reescribe un archivo correcto o recarga siempre. [Guía](guides#guide=ansible-10&section=release-repeat-delivery)
diagnostics.recap_2_failed: |-
  El resumen de app2 puede faltar o indicar un fallo si una tarea falla o el host no se selecciona. Revisa la salida de la tarea. [Guía](guides#guide=ansible-10&section=release-repeat-delivery)
diagnostics.recap_3_changed: |-
  Un changed distinto de cero en app3 puede indicar que el play reescribe un archivo correcto o recarga siempre. [Guía](guides#guide=ansible-10&section=release-repeat-delivery)
diagnostics.recap_3_failed: |-
  El resumen de app3 puede faltar o indicar un fallo si una tarea falla o el host no se selecciona. Revisa la salida de la tarea. [Guía](guides#guide=ansible-10&section=release-repeat-delivery)
stages.0.objectives.0.text: OpenTofu registra el artefacto de versión gestionado en el state.
stages.0.objectives.1.text: En la estación de trabajo, `release.txt` contiene `release-20`.
stages.0.objectives.2.text: El output de versión configurado informa `release-20`.
stages.0.objectives.3.text: El plan de OpenTofu termina con código `0` sin cambios.
stages.1.objectives.0.text: En cada host gestionado (`app1`, `app2`, `app3`), `/srv/site/message` contiene `release-20`
  con modo `0644`.
stages.1.objectives.1.text: Desde la estación de trabajo, `app1`, `app2` y `app3` devuelven cada uno `release-20`
