stages.1.objectives.2.text: Repetir la entrega tiene éxito sin cambiar ningún host gestionado.
diagnostics.probe_0_0: |-
  Si la prueba del estado no da resultado, comprueba que la estación pueda iniciar Python antes de inspeccionar el recurso. [Guía](guides#guide=terraform-3&section=release-artifact-production)
diagnostics.probe_1_2: |-
  La prueba puede detenerse antes de leer el resumen si falta su entorno de ejecución. Revisa la estación y la salida guardada de la segunda ejecución. [Guía](guides#guide=ansible-10&section=release-repeat-delivery)
