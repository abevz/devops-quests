title: Repetible rollout
brief: 'Ponga en línea una pequeña flota de station desde un marcador de lanzamiento administrado. Primero haga que OpenTofu
  produzca release-20 en release.txt. Luego entregue ese archivo a los tres banners de destino, vuelva a cargarlo solo cuando
  cambie y demuestre que una ejecución repetida del libro de jugadas no cambia nada. El inventario de la flota ya está abastecido.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `inventory.ini`, `ansible.cfg`, `main.tf`, `rollout.yml`,
  `release.txt`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas y servicios
  privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: el marcador de versión administrado y la salida son release-20 con un plan vacío.'
debrief: El artefacto local se convirtió en un contrato compartido entre OpenTofu y Ansible. El estado del archivo, las respuestas
  HTTP en vivo y el recap de segunda ejecución demuestran la entrega y la repetibilidad por separado.
stages.0.brief: 'Lee `main.tf` en `~/quest`: declara el proveedor sin conexión, `local_file.release` y la salida `release`.
  Inicializa y aplica. Comprueba que `release.txt` y `tofu output -raw release` sean `release-20`, que `tofu state list` contenga
  `local_file.release` y que `tofu plan -input=false -detailed-exitcode -no-color` termine con 0 (sin cambios).'
stages.0.objectives.0.text: El marcador de versión administrada y la salida son release-20 con un plan vacío.
stages.1.brief: 'Lee `inventory.ini`, `ansible.cfg` y `rollout.yml` en `~/quest`. Ansible envía tareas por SSH a cada host
  de la flota privada. Entrega `release-20` en `/srv/site/message` con modo `0644` en app1, app2 y app3. Añade un handler
  con `dq-service reload` y notifícalo cuando cambie el archivo para que el servicio relea el archivo; ejecuta `ansible-playbook
  rollout.yml`. Comprueba que la respuesta HTTP de cada host en el puerto 8080 sea `release-20`. Las comprobaciones observan
  archivos, modos y respuestas; no demuestran qué comandos se usaron.


  Vuelve a ejecutar `ansible-playbook rollout.yml`. El resumen debe mostrar `changed=0` y `failed=0` para cada host; la comprobación
  guarda la repetición en `second-run.txt`. La respuesta y el resumen no demuestran cuándo ocurrió la recarga.'
stages.1.objectives.0.text: Los tres banners en vivo sirven release-20, los archivos tienen el modo 0644 y un rollout repetido
  tiene changed=0/failed=0 para cada host.
hints.0.text: Separe el artefacto local administrado de su entrega remota.
hints.1.text: Un play exitoso sin hosts coincidentes no configura la flota.
hints.2.text: Utilice un handler para el banner en vivo reload y un inspect para el segundo recap.
phrases.0: Reparé el lanzamiento como estado declarado.
phrases.1: Dejé que el recurso local_file creara el artefacto de lanzamiento.
phrases.2: Verifiqué el contrato implementado y un plan vacío repetible.
