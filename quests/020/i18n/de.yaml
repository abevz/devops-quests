diagnostics.http_1: |-
  Der Dienst auf app1 kann weiterhin das gespeicherte Release ausliefern, wenn die Zustellung die Datei ohne Ausführen des Reload-Handlers geändert hat. [Leitfaden](guides#guide=ansible-10&section=release-repeat-delivery)
