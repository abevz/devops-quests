title: Wiederholbar rollout
brief: 'Bringen Sie eine kleine station-Flotte von einem verwalteten Release-Marker aus online. Lassen
  Sie zunächst OpenTofu release-20 in release.txt produzieren. Stellen Sie diese Datei dann auf die drei
  Zielbanner, laden Sie sie nur dann neu, wenn sie sich ändert, und beweisen Sie, dass eine wiederholte
  Playbook-Ausführung nichts ändert. Der Flottenbestand ist bereits vorhanden.


  Questdateien in `~/quest` (einige erscheinen in späteren Phasen): `inventory.ini`, `ansible.cfg`, `main.tf`,
  `rollout.yml`, `release.txt`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Anfängliche Erfolgskriterien: Der verwaltete Release-Marker und die Ausgabe sind release-20 mit einem
  leeren plan.'
debrief: Das lokale Artefakt wurde zu einem gemeinsamen Vertrag zwischen OpenTofu und Ansible. Dateistatus,
  Live-Antworten HTTP und der zweite Lauf recap beweisen Lieferung und Wiederholbarkeit separat.
stages.0.brief: 'Reparieren Sie das gewünschte Release in main.tf. release.txt wird von der Ressource
  local_file erstellt.


  Erfolgskriterien: Der verwaltete Release-Marker und die Ausgabe sind release-20 mit einem leeren plan.'
stages.0.objectives.0.text: Der verwaltete Release-Marker und die Ausgabe sind release-20 mit einem leeren
  plan.
stages.1.brief: 'Der Marker ist fertig. Reparieren Sie das Spielziel und den durch Änderung ausgelösten
  reload und konvergieren Sie dann die Flotte.


  Erfolgskriterien: Alle drei Live-Banner bedienen release-20, Dateien haben den Modus 0644 und ein wiederholtes
  rollout hat changed=0/failed=0 für jeden Host.'
stages.1.objectives.0.text: Alle drei Live-Banner bedienen release-20, Dateien haben den Modus 0644 und
  ein wiederholtes rollout hat changed=0/failed=0 für jeden Host.
hints.0.text: Trennen Sie das verwaltete lokale Artefakt von seiner Remote-Zustellung.
hints.1.text: Ein erfolgreicher play mit null übereinstimmenden Hosts konfiguriert die Flotte nicht.
hints.2.text: Verwenden Sie einen handler für den Live-Banner reload und inspect den zweiten recap.
phrases.0: Ich habe die Version im deklarierten Zustand repariert.
phrases.1: Ich habe die Ressource local_file das Release-Artefakt erstellen lassen.
phrases.2: Ich habe den bereitgestellten Vertrag und einen wiederholbaren leeren plan überprüft.
