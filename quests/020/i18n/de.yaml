title: Wiederholbar rollout
brief: "Die Release-Auslieferung zwischen dem verwalteten lokalen Artefakt und den aktiven Bannern der Host-Gruppe\
  \ ist unvollständig.\n\nArbeiten Sie in `~/quest` auf der Workstation. Eingaben je Phase:\n- Phase 1: `main.tf`.\n\
  - Phase 2: `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n\n**Anforderungen:**\n\n- Phase 1:\n  - OpenTofu erfasst\
  \ das verwaltete Release-Artefakt im State.\n  - Auf der Workstation enthält `release.txt` den Wert `release-20`.\n\
  \  - Der konfigurierte Release-Output meldet `release-20`.\n  - Der OpenTofu-Plan endet mit Code `0` ohne Änderungen.\n\
  - Phase 2:\n  - Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/message` den Wert `release-20`\
  \ und hat Modus `0644`.\n  - Von der Workstation liefern `app1`, `app2` und `app3` jeweils `release-20` über HTTP\
  \ auf Port `8080`.\n  - Wiederholte Auslieferung ist erfolgreich, ohne verwaltete Hosts zu ändern.\n\nDie schreibgeschützte\
  \ Vorschau sagt das Wiederholungsverhalten voraus; Check wiederholt `rollout.yml` tatsächlich und speichert den\
  \ Recap in `~/quest/second-run.txt` auf der Workstation. Aktuelle Antworten und Recap belegen weder die ursprünglichen\
  \ Auslieferungsbefehle noch den Zeitpunkt eines Reloads."
debrief: Das lokale Artefakt wurde zu einem gemeinsamen Vertrag zwischen OpenTofu und Ansible. Dateistatus, Live-Antworten
  HTTP und der zweite Lauf recap beweisen Lieferung und Wiederholbarkeit separat.
stages.0.brief: Das lokale Release muss mit seinem gespeicherten Verwaltungszustand übereinstimmen.
stages.1.brief: Die Auslieferung muss bei Wiederholung stabil bleiben.
hints.0.text: Trennen Sie das verwaltete lokale Artefakt von seiner Remote-Zustellung.
hints.1.text: 'Ein erfolgreicher play mit null übereinstimmenden Hosts konfiguriert die Flotte nicht.


  Prüfen Sie verwaltetes Artefakt und Inventar vor dem Host-Vergleich.


  ```sh

  cat main.tf

  cat rollout.yml

  ansible-inventory --list

  ```'
hints.2.text: |-
  Verwenden Sie `tofu init` und `tofu apply` für das verwaltete lokale Artefakt.

  Verwenden Sie einen handler für den Live-Banner reload und inspect den zweiten recap. Benachrichtigen Sie bei Änderungen an `/srv/site/message` einen Handler mit `dq-service reload`; führen Sie die Auslieferung mit `ansible-playbook rollout.yml` aus.

  Prüfen Sie die jeweilige Phase nach der Reparatur.

  Phase 1: Der State enthält `release.txt`; Datei und Output zeigen `release-20`; der Plan endet mit Code `0` ohne Änderungen.

  ```sh
  tofu show -json
  cat release.txt
  printf "\n"
  tofu output -raw release
  printf "\n"
  tofu plan -input=false -detailed-exitcode -no-color
  ```

  Phase 2: Jeder verwaltete Host zeigt `release-20`, Dateimodus `644` und HTTP `release-20` auf Port `8080`.

  ```sh
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    printf "%s: " "$host"
    ssh -n -o BatchMode=yes -p 2222 "root@$host" 'cat /srv/site/message; stat -c %a /srv/site/message'
    curl -fsS --max-time 3 "http://$host:8080"
    printf "\n"
  done
  ```

  Phase 2: Die Vorschau meldet `changed=0` und `failed=0` für `app1`, `app2` und `app3`.

  ```sh
  ansible-playbook rollout.yml --check
  ```

phrases.0: Ich habe die Version im deklarierten Zustand repariert.
phrases.1: Ich habe die Ressource local_file das Release-Artefakt erstellen lassen.
phrases.2: Ich habe den bereitgestellten Vertrag und einen wiederholbaren leeren plan überprüft.
