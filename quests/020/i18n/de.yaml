title: Wiederholbar rollout
brief: 'Bringen Sie eine kleine station-Flotte von einem verwalteten Release-Marker aus online. Lassen Sie zunächst OpenTofu
  release-20 in release.txt produzieren. Stellen Sie diese Datei dann auf die drei Zielbanner, laden Sie sie nur dann neu,
  wenn sie sich ändert, und beweisen Sie, dass eine wiederholte Playbook-Ausführung nichts ändert. Der Flottenbestand ist
  bereits vorhanden.


  Questdateien in `~/quest` (einige erscheinen in späteren Phasen): `inventory.ini`, `ansible.cfg`, `main.tf`, `rollout.yml`,
  `release.txt`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien, vorinstallierte Bilder
  und private Dienste. Ändern Sie nur diese Bucht.


  Anfängliche Erfolgskriterien: Der verwaltete Release-Marker und die Ausgabe sind release-20 mit einem leeren plan.'
debrief: Das lokale Artefakt wurde zu einem gemeinsamen Vertrag zwischen OpenTofu und Ansible. Dateistatus, Live-Antworten
  HTTP und der zweite Lauf recap beweisen Lieferung und Wiederholbarkeit separat.
stages.0.brief: 'Lies `main.tf` in `~/quest`: Es deklariert den Offline-Provider, `local_file.release` und den Output `release`.
  Initialisiere und wende an. Prüfe, dass `release.txt` und `tofu output -raw release` `release-20` entsprechen, `tofu state
  list` `local_file.release` enthält und `tofu plan -input=false -detailed-exitcode -no-color` mit 0 endet (keine Änderungen).'
stages.0.objectives.0.text: Der verwaltete Release-Marker und die Ausgabe sind release-20 mit einem leeren plan.
stages.1.brief: 'Lies `inventory.ini`, `ansible.cfg` und `rollout.yml` in `~/quest`. Ansible sendet Aufgaben über SSH an jeden
  Host der privaten Flotte. Schreibe `release-20` nach `/srv/site/message` mit Modus `0644` auf app1, app2 und app3. Ergänze
  einen Handler mit `dq-service reload` und benachrichtige ihn bei Dateiänderungen, damit der Dienst die Datei neu liest;
  führe `ansible-playbook rollout.yml` aus. Prüfe, dass die HTTP-Antwort jedes Hosts auf Port 8080 `release-20` ist. Die Prüfungen
  beobachten Dateien, Modi und Antworten; sie beweisen nicht die verwendeten Befehle.


  Führe `ansible-playbook rollout.yml` erneut aus. Die Zusammenfassung muss für jeden Host `changed=0` und `failed=0` zeigen;
  die Prüfung speichert den Wiederholungslauf in `second-run.txt`. Antwort und Zusammenfassung beweisen nicht, wann neu geladen
  wurde.'
stages.1.objectives.0.text: Alle drei Live-Banner bedienen release-20, Dateien haben den Modus 0644 und ein wiederholtes rollout
  hat changed=0/failed=0 für jeden Host.
hints.0.text: Trennen Sie das verwaltete lokale Artefakt von seiner Remote-Zustellung.
hints.1.text: Ein erfolgreicher play mit null übereinstimmenden Hosts konfiguriert die Flotte nicht.
hints.2.text: Verwenden Sie einen handler für den Live-Banner reload und inspect den zweiten recap.
phrases.0: Ich habe die Version im deklarierten Zustand repariert.
phrases.1: Ich habe die Ressource local_file das Release-Artefakt erstellen lassen.
phrases.2: Ich habe den bereitgestellten Vertrag und einen wiederholbaren leeren plan überprüft.
