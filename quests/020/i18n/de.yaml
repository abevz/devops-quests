title: Wiederholbar rollout
brief: "Die Release-Auslieferung zwischen dem verwalteten lokalen Artefakt und den aktiven Bannern der Host-Gruppe\
  \ ist unvollständig.\n\nArbeiten Sie in `~/quest` auf der Workstation. Eingaben je Phase:\n- Phase 1: `main.tf`.\n\
  - Phase 2: `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n\n**Anforderungen:**\n\n- Phase 1:\n  - Der OpenTofu-State\
  \ enthält `local_file.release`.\n  - Auf der Workstation enthält `release.txt` den Wert `release-20`.\n  - Der\
  \ OpenTofu-Output `release` ist `release-20`.\n  - Der OpenTofu-Plan endet mit Code `0` ohne Änderungen.\n  -\
  \ Die verwaltete Datei ist `~/quest/release.txt` auf der Workstation.\n- Phase 2:\n  - Auf jedem verwalteten Host\
  \ (`app1`, `app2`, `app3`) enthält `/srv/site/message` den Wert `release-20` und hat Modus `0644`.\n  - Von der\
  \ Workstation liefern `app1`, `app2` und `app3` jeweils `release-20` über HTTP auf Port `8080`.\n  - Eine Wiederholung\
  \ von `rollout.yml` ist erfolgreich und meldet `changed=0` und `failed=0` für `app1`, `app2` und `app3`.\n\n**Vor\
  \ Check & finish selbst prüfen:**\n\n- Phase 1: Der State enthält `local_file.release`; Datei und Output zeigen\
  \ `release-20`; der Plan endet mit Code `0` ohne Änderungen.\n\n  ```sh\n  tofu state list\n  cat release.txt\n\
  \  printf \"\\n\"\n  tofu output -raw release\n  printf \"\\n\"\n  tofu plan -input=false -detailed-exitcode -no-color\n\
  \  ```\n\n- Phase 2: Jeder verwaltete Host zeigt `release-20`, Dateimodus `644` und HTTP `release-20` auf Port\
  \ `8080`.\n\n  ```sh\n  for n in 1 2 3; do\n    host=\"app${n}-${DQ_NAMESPACE#dq-}\"\n    printf \"%s: \" \"$host\"\
  \n    ssh -n -o BatchMode=yes -p 2222 \"root@$host\" 'cat /srv/site/message; stat -c %a /srv/site/message'\n \
  \   curl -fsS --max-time 3 \"http://$host:8080\"\n    printf \"\\n\"\n  done\n  ```\n\n- Phase 2: Die Vorschau\
  \ meldet `changed=0` und `failed=0` für `app1`, `app2` und `app3`.\n\n  ```sh\n  ansible-playbook rollout.yml\
  \ --check\n  ```\n\nDie schreibgeschützte Vorschau sagt das Wiederholungsverhalten voraus; Check wiederholt `rollout.yml`\
  \ tatsächlich und speichert den Recap in `~/quest/second-run.txt` auf der Workstation. Aktuelle Antworten und\
  \ Recap belegen weder die ursprünglichen Auslieferungsbefehle noch den Zeitpunkt eines Reloads."
debrief: Das lokale Artefakt wurde zu einem gemeinsamen Vertrag zwischen OpenTofu und Ansible. Dateistatus, Live-Antworten
  HTTP und der zweite Lauf recap beweisen Lieferung und Wiederholbarkeit separat.
stages.0.brief: Das lokale Release muss mit seinem gespeicherten Verwaltungszustand übereinstimmen.
stages.1.brief: Die Auslieferung muss bei Wiederholung stabil bleiben.
hints.0.text: Trennen Sie das verwaltete lokale Artefakt von seiner Remote-Zustellung. Verwenden Sie `tofu init`
  und `tofu apply` für das verwaltete lokale Artefakt.
hints.1.text: Ein erfolgreicher play mit null übereinstimmenden Hosts konfiguriert die Flotte nicht.
hints.2.text: Verwenden Sie einen handler für den Live-Banner reload und inspect den zweiten recap. Benachrichtigen
  Sie bei Änderungen an `/srv/site/message` einen Handler mit `dq-service reload`; führen Sie die Auslieferung mit
  `ansible-playbook rollout.yml` aus.
phrases.0: Ich habe die Version im deklarierten Zustand repariert.
phrases.1: Ich habe die Ressource local_file das Release-Artefakt erstellen lassen.
phrases.2: Ich habe den bereitgestellten Vertrag und einen wiederholbaren leeren plan überprüft.
