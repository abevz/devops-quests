diagnostics.rerun: |-
  Der zweite Lauf kann einen Host verfehlen oder eine unvollständige Zusammenfassung hinterlassen. Prüfen Sie den Fehler und die drei Hostzeilen in second-run.txt. [Leitfaden](guides#guide=ansible-10&section=release-repeat-delivery)
diagnostics.recap_1_changed: |-
  Ein changed-Wert ungleich null für app1 kann bedeuten, dass das Play eine korrekte Datei neu schreibt oder bedingungslos neu lädt. [Leitfaden](guides#guide=ansible-10&section=release-repeat-delivery)
diagnostics.recap_1_failed: |-
  Die Zusammenfassung für app1 kann fehlen oder Fehler melden, wenn eine Aufgabe fehlschlägt oder der Host nicht ausgewählt ist. Prüfen Sie die Aufgabenausgabe. [Leitfaden](guides#guide=ansible-10&section=release-repeat-delivery)
