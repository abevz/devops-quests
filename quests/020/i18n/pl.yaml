diagnostics.probe_0_0: |-
  Jeśli sonda stanu nie zwraca wyniku, sprawdź uruchamianie Pythona na stacji i potem zarządzany zasób. [Przewodnik](guides#guide=terraform-3&section=release-artifact-production)
diagnostics.probe_1_2: |-
  Sonda może przerwać przed odczytem podsumowania, jeśli jej środowisko nie jest dostępne. Sprawdź stację i zapisany wynik drugiego przebiegu. [Przewodnik](guides#guide=ansible-10&section=release-repeat-delivery)
