title: Powtarzalny rollout
brief: "Dostarczenie wydania jest niekompletne między zarządzanym lokalnym artefaktem a aktywnymi banerami floty.\n\
  \nPracuj w `~/quest` na stacji roboczej. Dane wejściowe według etapu:\n- Etap 1: `main.tf`.\n- Etap 2: `inventory.ini`,\
  \ `ansible.cfg`, `rollout.yml`.\n\n**Wymagania:**\n\n- Etap 1:\n  - OpenTofu rejestruje zarządzany artefakt wydania\
  \ w state.\n  - Na stacji roboczej `release.txt` zawiera `release-20`.\n  - Skonfigurowany output wydania zgłasza\
  \ `release-20`.\n  - Plan OpenTofu kończy się kodem `0` bez zmian.\n- Etap 2:\n  - Na każdym zarządzanym hoście\
  \ (`app1`, `app2`, `app3`) `/srv/site/message` zawiera `release-20` i ma tryb `0644`.\n  - Ze stacji roboczej\
  \ każdy z hostów `app1`, `app2` i `app3` zwraca `release-20` przez HTTP na porcie `8080`.\n  - Powtórne dostarczenie\
  \ kończy się sukcesem bez zmian na zarządzanych hostach.\n\nPodgląd tylko do odczytu przewiduje powtórzenie; Check\
  \ faktycznie powtarza `rollout.yml` i zapisuje podsumowanie w `~/quest/second-run.txt` na stacji roboczej. Bieżące\
  \ odpowiedzi i podsumowanie nie dowodzą pierwotnych poleceń dostarczenia ani chwili przeładowania."
debrief: Lokalny artefakt stał się wspólnym kontraktem pomiędzy OpenTofu i Ansible. Stan pliku, odpowiedzi na żywo
  HTTP i drugie uruchomienie recap potwierdzają dostawę i powtarzalność oddzielnie.
stages.0.brief: Lokalne wydanie musi być zgodne z zapisanym stanem zarządzania.
stages.1.brief: Dostarczenie musi zachować stabilność po powtórzeniu.
hints.0.text: |-
  Wdrożenie obejmuje lokalny artefakt i dostarczenie go do zarządzanych hostów.
hints.1.text: |-
  Sprawdź `main.tf` i użyj `tofu init` oraz `tofu apply` dla lokalnego artefaktu. Porównaj cele play w `rollout.yml` z inventory. Uruchom `ansible-playbook rollout.yml` z handlerem wywołującym `dq-service reload`, gdy zmieni się `/srv/site/message`.

  ```sh
  cat main.tf
  cat rollout.yml
  ansible-inventory --list
  ```
hints.2.text: |-
  Sprawdź wynik bieżącego etapu.

  Etap 1: State zawiera `release.txt`; plik i output pokazują `release-20`; plan kończy się kodem `0` bez zmian.

  ```sh
  tofu show -json
  cat release.txt
  printf "\n"
  tofu output -raw release
  printf "\n"
  tofu plan -input=false -detailed-exitcode -no-color
  ```

  Etap 2: Każdy zarządzany host pokazuje `release-20`, tryb pliku `644` oraz HTTP `release-20` na porcie `8080`.

  ```sh
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    printf "%s: " "$host"
    ssh -n -o BatchMode=yes -p 2222 "root@$host" 'cat /srv/site/message; stat -c %a /srv/site/message'
    curl -fsS --max-time 3 "http://$host:8080"
    printf "\n"
  done
  ```

  Etap 2. Ponowne dostarczenie zgłasza `changed=0`, `failed=0` i `unreachable=0` dla `app1`, `app2` i `app3`.

  ```sh
  ansible-playbook rollout.yml
  ```
phrases.0: Naprawiłem wydanie w stanie zadeklarowanym.
phrases.1: Pozwoliłem zasóbowi local_file utworzyć artefakt wydania.
phrases.2: Sprawdziłem wdrożony kontrakt i powtarzalny pusty plan.
diagnostics.file: |-
  Plik może zachować poprzednie wydanie, jeśli nie zastosowano poprawionej konfiguracji lub później ręcznie go zmieniono. [Przewodnik](guides#guide=terraform-3&section=release-artifact-production)
diagnostics.output: |-
  Wynik główny może być pusty lub stary, jeśli nie jest połączony z zarządzanym wydaniem albo nie zastosowano zmiany. [Przewodnik](guides#guide=terraform-3&section=release-artifact-production)
diagnostics.state: |-
  Plik na dysku może istnieć bez zasobu local_file w stanie, który zarządza tą ścieżką. [Przewodnik](guides#guide=terraform-3&section=release-artifact-production)
diagnostics.plan: |-
  Plan może wykazać zmiany, jeśli deklaracja wydania różni się od zastosowanego stanu lub zmienił się zarządzany plik. [Przewodnik](guides#guide=terraform-3&section=release-artifact-production)
diagnostics.content_1: |-
  Na app1 może być stare wydanie, jeśli zadanie kopiowania użyło starej treści lub zaktualizowany play nie objął tego hosta. [Przewodnik](guides#guide=ansible-2&section=release-fleet-targets)
diagnostics.content_2: |-
  Na app2 może być stare wydanie, jeśli zadanie kopiowania użyło starej treści lub zaktualizowany play nie objął tego hosta. [Przewodnik](guides#guide=ansible-2&section=release-fleet-targets)
diagnostics.content_3: |-
  Na app3 może być stare wydanie, jeśli zadanie kopiowania użyło starej treści lub zaktualizowany play nie objął tego hosta. [Przewodnik](guides#guide=ansible-2&section=release-fleet-targets)
diagnostics.mode_1: |-
  Plik na app1 może nadal mieć niewłaściwy tryb, jeśli zadanie kopiowania ustawiło inne uprawnienia lub pominęło ten host. [Przewodnik](guides#guide=ansible-2&section=release-fleet-targets)
diagnostics.mode_2: |-
  Plik na app2 może nadal mieć niewłaściwy tryb, jeśli zadanie kopiowania ustawiło inne uprawnienia lub pominęło ten host. [Przewodnik](guides#guide=ansible-2&section=release-fleet-targets)
diagnostics.mode_3: |-
  Plik na app3 może nadal mieć niewłaściwy tryb, jeśli zadanie kopiowania ustawiło inne uprawnienia lub pominęło ten host. [Przewodnik](guides#guide=ansible-2&section=release-fleet-targets)
diagnostics.http_1: |-
  Usługa na app1 może nadal podawać wydanie z pamięci, jeśli dostawa zmieniła plik bez uruchomienia procedury przeładowania. [Przewodnik](guides#guide=ansible-10&section=release-repeat-delivery)
diagnostics.http_2: |-
  Usługa na app2 może nadal podawać wydanie z pamięci, jeśli dostawa zmieniła plik bez uruchomienia procedury przeładowania. [Przewodnik](guides#guide=ansible-10&section=release-repeat-delivery)
diagnostics.http_3: |-
