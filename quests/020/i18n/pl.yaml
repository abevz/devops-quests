title: Powtarzalny rollout
brief: 'Włącz online flotę małych station za pomocą jednego zarządzanego znacznika wydań. Najpierw wykonaj OpenTofu i wyprodukuj
  release-20 w release.txt. Następnie dostarcz ten plik do trzech docelowych banerów, załaduj ponownie tylko wtedy, gdy ulegnie
  zmianie i udowodnij, że wielokrotne uruchomienie podręcznika niczego nie zmienia. Inwentarz floty jest już dostarczony.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `inventory.ini`, `ansible.cfg`, `main.tf`, `rollout.yml`,
  `release.txt`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie załadowanych obrazów
  i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: znacznik zarządzanej wersji i output to release-20 z pustym plan.'
debrief: Lokalny artefakt stał się wspólnym kontraktem pomiędzy OpenTofu i Ansible. Stan pliku, odpowiedzi na żywo HTTP i
  drugie uruchomienie recap potwierdzają dostawę i powtarzalność oddzielnie.
stages.0.brief: 'Przeczytaj `main.tf` w `~/quest`: deklaruje provider offline, `local_file.release` i output `release`. Zainicjuj
  i zastosuj. Sprawdź, czy `release.txt` i `tofu output -raw release` są równe `release-20`, `tofu state list` zawiera `local_file.release`,
  a `tofu plan -input=false -detailed-exitcode -no-color` kończy się kodem 0 (brak zmian).'
stages.0.objectives.0.text: Znacznik zarządzanego wydania i output to release-20 z pustym plan.
stages.1.brief: 'Przeczytaj `inventory.ini`, `ansible.cfg` i `rollout.yml` w `~/quest`. Ansible wysyła zadania przez SSH do
  każdego hosta prywatnej floty. Dostarcz `release-20` do `/srv/site/message` z trybem `0644` na app1, app2 i app3. Dodaj
  handler z `dq-service reload` i powiadamiaj go przy zmianie pliku, aby usługa ponownie odczytała plik; uruchom `ansible-playbook
  rollout.yml`. Sprawdź odpowiedź HTTP każdego hosta na porcie 8080: ma wynosić `release-20`. Kontrole sprawdzają pliki, tryby
  i odpowiedzi; nie dowodzą użytych poleceń.


  Uruchom ponownie `ansible-playbook rollout.yml`. Podsumowanie musi pokazać `changed=0` i `failed=0` dla każdego hosta; kontrola
  zapisuje powtórny przebieg do `second-run.txt`. Odpowiedź i podsumowanie nie dowodzą czasu przeładowania.'
stages.1.objectives.0.text: Wszystkie trzy aktywne banery obsługują release-20, pliki mają mode 0644, a powtarzający się rollout
  ma changed=0/failed=0 dla każdego hosta.
hints.0.text: Oddziel zarządzany artefakt lokalny od jego zdalnego dostarczania.
hints.1.text: Pomyślne wykonanie play z zerowym dopasowaniem hostów nie powoduje skonfigurowania floty.
hints.2.text: Użyj handler dla aktywnego banera reload i sprawdź drugi recap.
phrases.0: Naprawiłem wydanie w stanie zadeklarowanym.
phrases.1: Pozwoliłem zasóbowi local_file utworzyć artefakt wydania.
phrases.2: Sprawdziłem wdrożony kontrakt i powtarzalny pusty plan.
