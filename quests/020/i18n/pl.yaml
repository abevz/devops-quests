title: Powtarzalny rollout
brief: "Dostarczenie wydania jest niekompletne między zarządzanym lokalnym artefaktem a aktywnymi banerami floty.\n\
  \nPracuj w `~/quest` na stacji roboczej. Dane wejściowe według etapu:\n- Etap 1: `main.tf`.\n- Etap 2: `inventory.ini`,\
  \ `ansible.cfg`, `rollout.yml`.\n\n**Wymagania:**\n\n- Etap 1:\n  - State OpenTofu zawiera `local_file.release`.\n\
  \  - Na stacji roboczej `release.txt` zawiera `release-20`.\n  - Output OpenTofu `release` ma wartość `release-20`.\n\
  \  - Plan OpenTofu kończy się kodem `0` bez zmian.\n  - Zarządzany plik to `~/quest/release.txt` na stacji roboczej.\n\
  - Etap 2:\n  - Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) `/srv/site/message` zawiera `release-20`\
  \ i ma tryb `0644`.\n  - Ze stacji roboczej każdy z hostów `app1`, `app2` i `app3` zwraca `release-20` przez HTTP\
  \ na porcie `8080`.\n  - Powtórzenie `rollout.yml` kończy się powodzeniem i zgłasza `changed=0` oraz `failed=0`\
  \ dla `app1`, `app2` i `app3`.\n\n**Sprawdź przed Check & finish:**\n\n- Etap 1: State zawiera `local_file.release`;\
  \ plik i output pokazują `release-20`; plan kończy się kodem `0` bez zmian.\n\n  ```sh\n  tofu state list\n  cat\
  \ release.txt\n  printf \"\\n\"\n  tofu output -raw release\n  printf \"\\n\"\n  tofu plan -input=false -detailed-exitcode\
  \ -no-color\n  ```\n\n- Etap 2: Każdy zarządzany host pokazuje `release-20`, tryb pliku `644` oraz HTTP `release-20`\
  \ na porcie `8080`.\n\n  ```sh\n  for n in 1 2 3; do\n    host=\"app${n}-${DQ_NAMESPACE#dq-}\"\n    printf \"\
  %s: \" \"$host\"\n    ssh -n -o BatchMode=yes -p 2222 \"root@$host\" 'cat /srv/site/message; stat -c %a /srv/site/message'\n\
  \    curl -fsS --max-time 3 \"http://$host:8080\"\n    printf \"\\n\"\n  done\n  ```\n\n- Etap 2: Podgląd zgłasza\
  \ `changed=0` oraz `failed=0` dla `app1`, `app2` i `app3`.\n\n  ```sh\n  ansible-playbook rollout.yml --check\n\
  \  ```\n\nPodgląd tylko do odczytu przewiduje powtórzenie; Check faktycznie powtarza `rollout.yml` i zapisuje\
  \ podsumowanie w `~/quest/second-run.txt` na stacji roboczej. Bieżące odpowiedzi i podsumowanie nie dowodzą pierwotnych\
  \ poleceń dostarczenia ani chwili przeładowania."
debrief: Lokalny artefakt stał się wspólnym kontraktem pomiędzy OpenTofu i Ansible. Stan pliku, odpowiedzi na żywo
  HTTP i drugie uruchomienie recap potwierdzają dostawę i powtarzalność oddzielnie.
stages.0.brief: Lokalne wydanie musi być zgodne z zapisanym stanem zarządzania.
stages.1.brief: Dostarczenie musi zachować stabilność po powtórzeniu.
hints.0.text: Oddziel zarządzany artefakt lokalny od jego zdalnego dostarczania. Użyj `tofu init` i `tofu apply`
  dla zarządzanego lokalnego artefaktu.
hints.1.text: Pomyślne wykonanie play z zerowym dopasowaniem hostów nie powoduje skonfigurowania floty.
hints.2.text: Użyj handler dla aktywnego banera reload i sprawdź drugi recap. Powiadom handler z `dq-service reload`,
  gdy zmieni się `/srv/site/message`; uruchom dostarczenie przez `ansible-playbook rollout.yml`.
phrases.0: Naprawiłem wydanie w stanie zadeklarowanym.
phrases.1: Pozwoliłem zasóbowi local_file utworzyć artefakt wydania.
phrases.2: Sprawdziłem wdrożony kontrakt i powtarzalny pusty plan.
