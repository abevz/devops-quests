diagnostics.rerun: |-
  Drugi przebieg mógł nie połączyć się z hostem lub zostawić niepełne podsumowanie. Sprawdź błąd play i trzy wiersze w second-run.txt. [Przewodnik](guides#guide=ansible-10&section=release-repeat-delivery)
diagnostics.recap_1_changed: |-
  Niezerowe changed dla app1 może wskazywać ponowny zapis poprawnego pliku albo bezwarunkowe przeładowanie. [Przewodnik](guides#guide=ansible-10&section=release-repeat-delivery)
diagnostics.recap_1_failed: |-
  Podsumowania app1 może brakować lub może zawierać błąd, jeśli zadanie zawiodło albo nie wybrano hosta. Sprawdź wynik zadania. [Przewodnik](guides#guide=ansible-10&section=release-repeat-delivery)
