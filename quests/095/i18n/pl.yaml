title: Powrót Argo
brief: 'W prywatnym wydaniu Git wprowadzono zły readiness probe. Argo CD, który ciągle go uzgadnia, więc
  izolowany live rollback zostałby nadpisany. Sprawdź healthy-commit i faulty-commit, następnie utwórz
  i wypchnij nowy Git revert na main. Zachowaj błędne zatwierdzenie w historii, zachowaj automatyczne
  self-heal/prune i zapisz nowe HEAD w release-commit. Przywróć oryginalny zdrowy manifest i wynik HTTP.
  Nie resetuj historii ani nie wykonuj force-push. Nie wyłączaj GitOps i nie wycofuj wyłącznie Deployment.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `application.json`, `healthy-commit`,
  `faulty-commit`, `release-commit`, `repository/manifests/board.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: nowe zatwierdzenie potomka przywraca zdrowy manifest; Argo pozostaje zautomatyzowany,
  ze stanami Synced i Healthy, z odpowiedzią north-95 przez HTTP.'
debrief: Wycofanie zostało wyrażone jako zmiana w przód w stosunku do desired state, zachowując błędną
  wersję do zbadania.
