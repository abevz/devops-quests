title: Powrót Argo
brief: 'Najnowsze wydanie z prywatnego Git nie działa poprawnie. Przywróć znaną poprawną zawartość, zachowując historię
  incydentu.


  Pracuj na workstation w `~/quest` z plikami `platform.env`, `application.yaml`, `healthy-commit`, `faulty-commit`,
  `release-commit`, `repository/`.


  O ile nie wskazano inaczej, zasoby Kubernetes znajdują się w przestrzeni nazw zatoki (`DQ_NAMESPACE`); ścieżki
  w `~/quest` są na workstation.


  **Requirements:**


  - Opublikowane `origin/main` odpowiada plikowi `release-commit` na workstation, różni się od zamrożonego wadliwego
  commita i zachowuje go jako przodka.

  - Application `board` zachowuje dostarczone prywatne źródło Git, gałąź wydania i istniejący katalog obciążenia.

  - Application `board` zgłasza `Synced` i `Healthy` dla commita w `~/quest/release-commit` na workstation.

  - Deployment `board` kończy rollout w przestrzeni nazw zatoki.

  - Wewnątrz Poda Deployment `board` adres `http://board:8080` zwraca `north-95`.

  - Opublikowany plik Git `manifests/board.yaml` przywraca znaną poprawną konfigurację obciążenia.


  Bieżąca zawartość i historia przodków Git nie dowodzą, którego polecenia odzyskiwania użyto.


  Dodatkowe dane wejściowe: `rollback-contract.json`, `current-publication.json`, `consumer-baseline-commit`, `original-release-identities.json`,
  `repository/readers/`.


  Przywróć znaną zdrową konfigurację producenta i dostarcz bieżącą zatwierdzoną publikację istniejącym niezależnie
  przypiętym odbiorcom. Każdy odbiorca ma zachować niezmienne przypięcie do commita opublikowanego wydania. Zachowaj
  tożsamości pierwotnych Application i Deployment oraz dostarczone obrazy i programy odbiorców. Każdy należący do
  nich aktywny Pod i punkt Service mają udostępniać zatwierdzoną publikację z projekcji Git tylko do odczytu. Zachowaj
  zapisaną rewizję początkową odbiorców w historii Git.


  Zamrożony zapis początkowy jest wiążący; kopie robocze go nie zastępują. Sprawdzany jest bieżący stan i historia
  commitów, a nie użyte polecenia naprawcze.'
debrief: Przywrócono zdrową konfigurację producenta i przekazano bieżącą publikację niezależnie przypiętym odbiorcom,
  zachowując tożsamości oraz historię Git.
stages.0.brief: Zachowaj wadliwy commit w opublikowanej historii.
hints.0.text: Zdrowe historyczne wydanie producenta i bieżące zobowiązania odbiorców mogą mieć różne okresy życia.
  Przywrócenie jednego nie aktualizuje automatycznie niezależnie przypiętych odbiorców.
hints.1.text: |-
  Porównaj `rollback-contract.json`, `current-publication.json`, zapisane commity, manifesty odbiorców, źródła Application i obserwowane rewizje. Prześledź publikację przez rzeczywiście należące do nich Pody i odpowiedzi Service.

  Porównaj zapisane działające wersje producenta i konsumenta z opublikowaną rewizją. Dla każdego zachowanego konsumenta sprawdź przypiętą rewizję źródła, zamontowaną publikację i łańcuch właścicieli.
hints.2.text: |-
  Sprawdź pierwotne UID i programy, obserwowane rewizje, gotowość oraz HTTP każdego należącego do odbiorcy Pod i Service.

  Sprawdź każdy Pod należący do istniejącego łańcucha Deployment/ReplicaSet, a następnie każdy Service:

  ```sh
  (
    set -euo pipefail
    cd ~/quest
    source platform.env
    receipt=/run/dq/facts/0/rollback-contract.json
    revision=$(git -C repository ls-remote origin refs/heads/main | cut -f1)
    test -n "$revision"
    kubectl get applications board reader-a reader-b -o json |
      jq -e --arg revision "$revision" --slurpfile expected "$receipt" '
        def relative_parts: select(type=="string" and (startswith("/")|not)) | split("/") | map(select(.!="" and .!="."));
        ([.items[].metadata.name] | sort)==["board","reader-a","reader-b"] and
        all(.items[]; .metadata.name as $name |
          .metadata.uid==$expected[0].originalIdentities["application/"+$name] and
          .spec.source.repoURL==$expected[0].repoURL and
          .status.sync.revision==$revision and .status.sync.status=="Synced" and .status.health.status=="Healthy" and
          (if $name=="board" then true else
             ($expected[0].consumers[] | select(.name==$name)) as $supplied |
             (.spec.source.targetRevision | ascii_downcase)==$revision and
             (.spec.source.path | relative_parts)==($supplied.path | relative_parts) and
             .spec.project==$supplied.project and .spec.destination==$supplied.destination
           end))'
    verify_projection() {
      python3 -I - "$revision" "$receipt" "$1" "$2" <<'VERIFY_PROJECTION'
  import json
  import posixpath
  import subprocess
  import sys
  from pathlib import Path

  import yaml

  revision, receipt_path, name, pod = sys.argv[1:]
  receipt = json.loads(Path(receipt_path).read_text())
  profile = next(item for item in receipt["consumers"] if item["name"] == name)
  target = posixpath.join(profile["documentRoot"], "index.html")
  git = ["git", "-C", "repository"]
  paths = subprocess.check_output([*git, "ls-tree", "-r", "--name-only", revision, "--", profile["path"]], text=True).splitlines()

  def manifests(document):
      if isinstance(document, dict):
          if document.get("kind") == "List":
              for item in document.get("items", []):
                  yield from manifests(item)
          elif document.get("kind") in ("Deployment", "ConfigMap"):
              yield document

  published = {}
  for path in paths:
      if Path(path).suffix not in (".yaml", ".yml", ".json"):
          continue
      for root in yaml.safe_load_all(subprocess.check_output([*git, "show", revision + ":" + path])):
          for document in manifests(root):
              identity = document["kind"], document["metadata"]["name"]
              assert identity not in published
              published[identity] = document

  def get(kind, resource):
      return json.loads(subprocess.check_output(["kubectl", "get", kind, resource, "-o", "json"]))

  def binding(spec, data_for):
      worker = next(item for item in spec["containers"] if item["name"] == "worker")
      volumes = {volume["name"]: volume for volume in spec.get("volumes", [])}
      matches = []
      for mount in worker.get("volumeMounts", []):
          base = mount["mountPath"]
          subpath = mount.get("subPath")
          if subpath is not None and base != target:
              continue
          if subpath is None and not target.startswith(base.rstrip("/") + "/"):
              continue
          volume = volumes[mount["name"]]
          sources = [volume["configMap"]] if "configMap" in volume else [
              item["configMap"] for item in volume.get("projected", {}).get("sources", []) if "configMap" in item]
          for source in sources:
              data = data_for(source["name"])
              items = source.get("items", [{"key": key, "path": key} for key in data])
              for item in items:
                  path = base if subpath == item["path"] else None
                  if subpath is None:
                      path = posixpath.normpath(posixpath.join(base, item["path"]))
                  if path == target:
                      matches.append((source["name"], item["key"]))
      assert len(matches) == 1
      return matches[0]

  declared = published["Deployment", name]["spec"]["template"]["spec"]
  worker = next(container for container in declared["containers"] if container["name"] == "worker")
  assert {field: worker.get(field) for field in ("image", "command", "args")} == profile["program"]
  live = get("deployment", name)["spec"]["template"]["spec"]
  observed_pod = get("pod", pod)["spec"]
  published_map = lambda configmap: published["ConfigMap", configmap]["data"]
  live_map = lambda configmap: get("configmap", configmap)["data"]
  configmap, key = binding(declared, published_map)
  assert binding(live, live_map) == binding(observed_pod, live_map) == (configmap, key)
  published_data = published_map(configmap)
  assert live_map(configmap) == published_data
  mounted = subprocess.check_output(["kubectl", "exec", pod, "-c", "worker", "--", "cat", target], text=True)
  assert mounted == published_data[key]
  assert all(json.loads(mounted).get(key) == value for key, value in receipt["publication"].items())
  print(name + "/" + pod + ": Git, ConfigMap and mounted publication match")
  VERIFY_PROJECTION
    }
    for name in reader-a reader-b; do
      deployment=$(kubectl get deployment "$name" -o json)
      deployment_uid=$(jq -er .metadata.uid <<<"$deployment")
      program=$(jq -cer --arg name "$name" '.consumers[] | select(.name==$name) | .program' "$receipt")
      digest=$(jq -er '.image | split("@") | last | select(test("^sha256:[0-9a-f]{64}$"))' <<<"$program")
      jq -e --argjson program "$program" '
        any(.spec.template.spec.containers[]; .name=="worker" and ({image,command,args}==$program))
      ' <<<"$deployment" >/dev/null
      replicas=$(jq -er 'select(.spec.replicas>0 and .status.observedGeneration>=.metadata.generation and
        .status.readyReplicas==.spec.replicas) | .spec.replicas' <<<"$deployment")
      test "$deployment_uid" = "$(jq -er --arg name "$name" '.originalIdentities["deployment/"+$name]' "$receipt")"
      replica_uids=$(kubectl get replicasets -o json | jq -c --arg uid "$deployment_uid" '
        [.items[] | select(any(.metadata.ownerReferences[]?; .kind=="Deployment" and .controller==true and .uid==$uid)) | .metadata.uid]')
      pods=$(kubectl get pods -o json | jq -er --argjson owners "$replica_uids" --argjson replicas "$replicas" --argjson program "$program" --arg digest "$digest" '
        [.items[] | select(.metadata.deletionTimestamp==null and .status.phase!="Failed" and .status.phase!="Succeeded" and
          any(.metadata.ownerReferences[]?; .kind=="ReplicaSet" and .controller==true and (.uid as $uid | $owners | index($uid)!=null)))]
        | select(length==$replicas and all(.[]; .status.phase=="Running" and
            any(.status.conditions[]?; .type=="Ready" and .status=="True") and
            any(.spec.containers[]?; .name=="worker" and ({image,command,args}==$program)) and
            any(.status.containerStatuses[]?; .name=="worker" and .ready==true and (.state.running | type)=="object" and
              ((.imageID | split("@") | last | split("/") | last) == $digest))))
        | .[].metadata.name')
      matches_publication() {
        jq -e --slurpfile expected "$receipt" '
          . as $observed | all($expected[0].publication | to_entries[]; $observed[.key]==.value)'
      }
      while IFS= read -r pod; do
        verify_projection "$name" "$pod"
        kubectl exec "$pod" -c worker -- wget -qO- -T 3 http://127.0.0.1:8080 | matches_publication
      done <<<"$pods"
      kubectl exec "${pods%%$'\n'*}" -c worker -- wget -qO- -T 3 "http://$name:8080" | matches_publication
    done
  )
  ```

  Oczekiwane: wszystkie Application Synced/Healthy i odpowiedzi obu odbiorców zgodne z bieżącą zatwierdzoną publikacją.
phrases.0: Przywróciłem desired state za pomocą Git revert.
phrases.1: Podczas odzyskiwania miałem włączone reconciliation.
phrases.2: Sprawdziłem zaobserwowaną wersję i stan aplikacji.
questions.0.points.0: Sterownik ponownie zastosuje Git desired state.
questions.0.points.1: Popraw źródło i zweryfikuj zaobserwowaną wersję.
questions.0.prompt: Dlaczego live rollout undo może być tymczasowy w ramach GitOps?
questions.1.points.0: Błędne zatwierdzenie pozostaje osiągalne w historii main.
questions.1.points.1: Powrót do zdrowia to nowa zmiana, którą można sprawdzić.
questions.1.prompt: Co zachowuje revert, co traci reset?
stages.0.objectives.0.text: Opublikowane `origin/main` odpowiada plikowi `release-commit` na workstation, różni
  się od zamrożonego wadliwego commita i zachowuje go jako przodka.
stages.0.objectives.1.text: Application `board` zachowuje dostarczone prywatne źródło Git, gałąź wydania i istniejący
  katalog obciążenia.
stages.0.objectives.2.text: Application `board` zgłasza `Synced` i `Healthy` dla commita w `~/quest/release-commit`
  na workstation.
stages.0.objectives.3.text: Deployment `board` kończy rollout w przestrzeni nazw zatoki.
stages.0.objectives.4.text: Wewnątrz Poda Deployment `board` adres `http://board:8080` zwraca `north-95`.
stages.0.objectives.5.text: Opublikowany plik Git `manifests/board.yaml` przywraca znaną poprawną konfigurację obciążenia.
  Istniejący przypięci odbiorcy przyjmują bieżącą zatwierdzoną publikację z zachowaniem programów i tożsamości.
  Ich Pody i punkty Service są zgodne z projekcją Git i bieżącymi niezmiennymi przypięciami wydania.
diagnostics.rollback_head: Reset main do zdrowego commitu usuwa wymagane pochodzenie od faulty-commit, a stary release-commit może nadal wskazywać błędny lub wcześniejszy head. Cofnij zmianę nowym commitem, opublikuj dalsze odzyskiwanie i ustaw robocze potwierdzenie na pobrany origin/main. Błędy wejść, fetch i polecenia ancestry też dają marker. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=forward-rollback-retained-faulty-history)
diagnostics.rollback_source: Przekierowanie Application board do innego repozytorium, gałęzi lub katalogu omija źródło odzyskiwania. Zachowaj dostarczony Git URL, cel main i względną ścieżkę do manifests bez przejścia do rodzica. Brak danych platformy, błąd API lub porównania JSON też daje marker. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=forward-rollback-retained-main-source)
diagnostics.rollback_sync: Producent może nadal uzgadniać błędną rewizję, być niezdrowy lub mieć wyłączone self-healing/pruning. Napraw definicję Git i poczekaj na Synced i Healthy dla bieżącego release-commit z obiema flagami true; to jeszcze nie dowodzi przyjęcia nowej publikacji przez osobno przypięte reader Applications. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=forward-rollback-reconciled-main-revision)
diagnostics.rollback_rollout: Błędna readiness probe używa portu 8099, choć serwer słucha na 8080, więc rollout może stać mimo synchronizacji Git. Napraw definicję Git przez nowe commity i sprawdź rollout/events; błąd CLI lub trzysekundowy limit obserwacji też nie przejdzie. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=forward-rollback-producer-rollout)
diagnostics.rollback_http: Zsynchronizowane Application może nie mieć gotowego endpoint Service przez złą probe albo zwracać treść inną niż north-95. Sprawdź rzeczywisty endpoint board z jego worker po naprawie; timeout lub błąd exec/HTTP też narusza pierwotne porównanie. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=forward-rollback-producer-http)
diagnostics.rollback_identity_board: Usunięcie i odtworzenie board, reader-a lub reader-b zachowuje nazwę, lecz zmienia zamrożony UID Application albo Deployment. Napraw każdy oryginalny obiekt na miejscu; marker wskazuje producenta lub linię reader. To obserwacja bieżącej tożsamości, nie ciągłości historii. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=forward-rollback-original-application-identities)
diagnostics.rollback_identity_a: Usunięcie i odtworzenie board, reader-a lub reader-b zachowuje nazwę, lecz zmienia zamrożony UID Application albo Deployment. Napraw każdy oryginalny obiekt na miejscu; marker wskazuje producenta lub linię reader. To obserwacja bieżącej tożsamości, nie ciągłości historii. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=forward-rollback-original-application-identities)
diagnostics.rollback_identity_b: Usunięcie i odtworzenie board, reader-a lub reader-b zachowuje nazwę, lecz zmienia zamrożony UID Application albo Deployment. Napraw każdy oryginalny obiekt na miejscu; marker wskazuje producenta lub linię reader. To obserwacja bieżącej tożsamości, nie ciągłości historii. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=forward-rollback-original-application-identities)
diagnostics.rollback_history: Pobrany head może nadal być wcześniejszym reader baseline lub producent wskazywać inne repozytorium. Zachowaj pochodzenie od baseline i opublikuj nowszy commit z zatwierdzonymi danymi reader. Błąd polecenia ancestry daje rollback_observation zamiast tego markera porównania. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=forward-rollback-forward-consumer-history)
diagnostics.rollback_source_a: Reader zaczynają przypięte do starego commitu, więc naprawa producenta nie przesuwa ich rewizji. Opublikuj zatwierdzone manifesty, przypnij każde pierwotne reader Application do bieżącego pełnego Git commit, zachowaj ścieżkę, project i destination i poczekaj na Synced i Healthy tej rewizji; samo main nie spełnia porównania immutable pin. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=forward-rollback-current-reader-commit-pins)
diagnostics.rollback_source_b: Reader zaczynają przypięte do starego commitu, więc naprawa producenta nie przesuwa ich rewizji. Opublikuj zatwierdzone manifesty, przypnij każde pierwotne reader Application do bieżącego pełnego Git commit, zachowaj ścieżkę, project i destination i poczekaj na Synced i Healthy tej rewizji; samo main nie spełnia porównania immutable pin. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=forward-rollback-current-reader-commit-pins)
diagnostics.rollback_delivery_a: Zdrowy reader może nadal uruchamiać pierwotny program ze starą publikacją. Zachowaj image, command i args reader w Git, żywym Deployment i każdym bieżącym należącym Pod; zakończ rollout i opublikuj zatwierdzony JSON przez dokładnie jedną zgodną projekcję ConfigMap w document root. Dane Git i żywego ConfigMap mają być równe jako pełne mapy, a publikacja zawierać zatwierdzone wartości. Równoważne bezpośrednie lub projected powiązania ConfigMap mogą przejść. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=forward-rollback-published-reader-projection)
diagnostics.rollback_delivery_b: Zdrowy reader może nadal uruchamiać pierwotny program ze starą publikacją. Zachowaj image, command i args reader w Git, żywym Deployment i każdym bieżącym należącym Pod; zakończ rollout i opublikuj zatwierdzony JSON przez dokładnie jedną zgodną projekcję ConfigMap w document root. Dane Git i żywego ConfigMap mają być równe jako pełne mapy, a publikacja zawierać zatwierdzone wartości. Równoważne bezpośrednie lub projected powiązania ConfigMap mogą przejść. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=forward-rollback-published-reader-projection)
diagnostics.rollback_http_a: 'Git, żywy ConfigMap i zdrowy status nie dowodzą przyjęcia danych przez każdy reader Pod. Sprawdź każdy bieżący należący Pod przez localhost i Service: HTTP JSON musi zawierać zatwierdzone schema, generation i route. Stary plik mount może potrzebować czasu aktualizacji; nie zastępuj zachowanego programu reader sfabrykowaną odpowiedzią. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=forward-rollback-every-reader-publication)'
diagnostics.rollback_http_b: 'Git, żywy ConfigMap i zdrowy status nie dowodzą przyjęcia danych przez każdy reader Pod. Sprawdź każdy bieżący należący Pod przez localhost i Service: HTTP JSON musi zawierać zatwierdzone schema, generation i route. Stary plik mount może potrzebować czasu aktualizacji; nie zastępuj zachowanego programu reader sfabrykowaną odpowiedzią. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=forward-rollback-every-reader-publication)'
diagnostics.rollback_budget: Polecenie Git lub Kubernetes mogło przekroczyć pozostały czas albo wspólny budżet 14 sekund wygasł przed obserwacją obu linii reader. Sprawdź API/Git i zbieżność przed ponownym odpytywaniem; nazwany budżet dotyczy obserwatora i nie dowodzi błędu konkretnego predykatu. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=forward-rollback-bounded-rollback-observation)
diagnostics.rollback_observation: Obserwator może nie odczytać zamrożonego kontraktu, historii Git, dokumentów Kubernetes lub projected danych reader. Przechwycone błędy CLI, zły JSON/YAML, brak pól i zduplikowane tożsamości zasobów dają marker; błąd polecenia ancestry baseline też trafia tutaj. Sprawdź rzeczywiste dane przed zmianą obiektów na podstawie niedostępnej obserwacji. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=forward-rollback-readable-rollback-inputs)
diagnostics.probe_0_5: Pierwotny health observer może odrzucić desired/live zasoby lub zabezpieczenia zmienione względem zdrowego Git baseline, złe liveness/startup probes, różnice zachowania desired/live, zablokowany rollout albo brak north-95. Daje ten fallback bez dokładniejszych markerów. Późniejszy nienazwany błąd startu, platform input lub struktury dokumentu też trafia tutaj; nazwane błędy rollback go tłumią. Zachowaj zasoby i bezpieczeństwo baseline, naprawiając readiness przez Git. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=forward-rollback-healthy-contract-and-early-fallback)
