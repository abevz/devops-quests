title: Argo-Rollback
brief: 'Das neueste Release aus dem privaten Git ist nicht gesund. Stellen Sie den bekannten gesunden Inhalt wieder
  her und erhalten Sie die Vorfallhistorie.


  Arbeiten Sie auf der Workstation in `~/quest` mit `platform.env`, `application.yaml`, `healthy-commit`, `faulty-commit`,
  `release-commit`, `repository/`.


  Sofern nicht anders angegeben, liegen Kubernetes-Ressourcen im Bay-Namespace (`DQ_NAMESPACE`); Pfade unter `~/quest`
  liegen auf der Workstation.


  **Requirements:**


  - Veröffentlichtes `origin/main` entspricht der Workstation-Datei `release-commit`, unterscheidet sich vom eingefrorenen
  fehlerhaften Commit und erhält ihn als Vorfahren.

  - Application `board` behält die bereitgestellte private Git-Quelle, den Release-Branch und das vorhandene Workload-Verzeichnis
  bei.

  - Application `board` meldet `Synced` und `Healthy` für den Commit in der Workstation-Datei `~/quest/release-commit`.

  - Deployment `board` schließt seinen Rollout im Bay-Namespace ab.

  - In einem Pod von Deployment `board` liefert `http://board:8080` den Wert `north-95`.

  - Das veröffentlichte Git `manifests/board.yaml` stellt die bekannte gesunde Workload-Konfiguration wieder her.


  Aktueller Git-Inhalt und Abstammung beweisen nicht, welcher Wiederherstellungsbefehl verwendet wurde.


  Zusätzliche Eingaben: `rollback-contract.json`, `current-publication.json`, `consumer-baseline-commit`, `original-release-identities.json`,
  `repository/readers/`.


  Stelle die bekannte gesunde Erzeugerkonfiguration wieder her und liefere die aktuelle freigegebene Veröffentlichung
  an die bestehenden unabhängig fixierten Verbraucher. Jeder Verbraucher muss an einen unveränderlichen Commit der
  veröffentlichten Version gebunden bleiben. Bewahre ursprüngliche Application- und Deployment-Identitäten sowie
  die bereitgestellten Verbraucher-Images und Programme. Jeder zugehörige aktive Verbraucher-Pod und sein Service-Endpunkt
  müssen die Freigabe aus der Git-gesteuerten schreibgeschützten Projektion ausliefern. Bewahre die aufgezeichnete
  Verbraucher-Ausgangsrevision in Git.


  Der eingefrorene Ausgangsbeleg ist maßgeblich; Arbeitskopien ersetzen ihn nicht. Geprüft werden aktueller Zustand
  und Abstammung, nicht die verwendeten Wiederherstellungsbefehle.'
debrief: Du hast die gesunde Erzeugerkonfiguration wiederhergestellt und die aktuelle Freigabe an unabhängig fixierte
  Verbraucher weitergegeben, bei erhaltenen Identitäten und Git-Historie.
stages.0.brief: Erhalten Sie den fehlerhaften Commit in der veröffentlichten Historie.
hints.0.text: Ein gesunder historischer Erzeugerstand und die aktuellen Pflichten seiner Verbraucher können unterschiedliche
  Lebenszeiten haben. Die Wiederherstellung des einen aktualisiert unabhängig fixierte Verbraucher nicht automatisch.
hints.1.text: |-
  Vergleiche `rollback-contract.json`, `current-publication.json`, aufgezeichnete Commits, Verbrauchermanifeste, Application-Quellen und beobachtete Revisionen. Verfolge die Veröffentlichung durch tatsächlich zugehörige Pods und Service-Antworten.

  Vergleiche aufgezeichnete funktionsfähige Stände von Produzent und Verbraucher mit der veröffentlichten Revision. Prüfe pro Verbraucher die festgelegte Quellrevision, eingehängte Publikation und Kette der Workload-Besitzer.
hints.2.text: |-
  Prüfe ursprüngliche UIDs und Programme, beobachtete Revisionen, Bereitschaft und HTTP jedes zugehörigen Pods und Services.

  Prüfe jeden Pod der bestehenden Deployment-/ReplicaSet-Eigentümerkette und danach jeden Service:

  ```sh
  (
    set -euo pipefail
    cd ~/quest
    source platform.env
    receipt=/run/dq/facts/0/rollback-contract.json
    revision=$(git -C repository ls-remote origin refs/heads/main | cut -f1)
    test -n "$revision"
    kubectl get applications board reader-a reader-b -o json |
      jq -e --arg revision "$revision" --slurpfile expected "$receipt" '
        def relative_parts: select(type=="string" and (startswith("/")|not)) | split("/") | map(select(.!="" and .!="."));
        ([.items[].metadata.name] | sort)==["board","reader-a","reader-b"] and
        all(.items[]; .metadata.name as $name |
          .metadata.uid==$expected[0].originalIdentities["application/"+$name] and
          .spec.source.repoURL==$expected[0].repoURL and
          .status.sync.revision==$revision and .status.sync.status=="Synced" and .status.health.status=="Healthy" and
          (if $name=="board" then true else
             ($expected[0].consumers[] | select(.name==$name)) as $supplied |
             (.spec.source.targetRevision | ascii_downcase)==$revision and
             (.spec.source.path | relative_parts)==($supplied.path | relative_parts) and
             .spec.project==$supplied.project and .spec.destination==$supplied.destination
           end))'
    verify_projection() {
      python3 -I - "$revision" "$receipt" "$1" "$2" <<'VERIFY_PROJECTION'
  import json
  import posixpath
  import subprocess
  import sys
  from pathlib import Path

  import yaml

  revision, receipt_path, name, pod = sys.argv[1:]
  receipt = json.loads(Path(receipt_path).read_text())
  profile = next(item for item in receipt["consumers"] if item["name"] == name)
  target = posixpath.join(profile["documentRoot"], "index.html")
  git = ["git", "-C", "repository"]
  paths = subprocess.check_output([*git, "ls-tree", "-r", "--name-only", revision, "--", profile["path"]], text=True).splitlines()

  def manifests(document):
      if isinstance(document, dict):
          if document.get("kind") == "List":
              for item in document.get("items", []):
                  yield from manifests(item)
          elif document.get("kind") in ("Deployment", "ConfigMap"):
              yield document

  published = {}
  for path in paths:
      if Path(path).suffix not in (".yaml", ".yml", ".json"):
          continue
      for root in yaml.safe_load_all(subprocess.check_output([*git, "show", revision + ":" + path])):
          for document in manifests(root):
              identity = document["kind"], document["metadata"]["name"]
              assert identity not in published
              published[identity] = document

  def get(kind, resource):
      return json.loads(subprocess.check_output(["kubectl", "get", kind, resource, "-o", "json"]))

  def binding(spec, data_for):
      worker = next(item for item in spec["containers"] if item["name"] == "worker")
      volumes = {volume["name"]: volume for volume in spec.get("volumes", [])}
      matches = []
      for mount in worker.get("volumeMounts", []):
          base = mount["mountPath"]
          subpath = mount.get("subPath")
          if subpath is not None and base != target:
              continue
          if subpath is None and not target.startswith(base.rstrip("/") + "/"):
              continue
          volume = volumes[mount["name"]]
          sources = [volume["configMap"]] if "configMap" in volume else [
              item["configMap"] for item in volume.get("projected", {}).get("sources", []) if "configMap" in item]
          for source in sources:
              data = data_for(source["name"])
              items = source.get("items", [{"key": key, "path": key} for key in data])
              for item in items:
                  path = base if subpath == item["path"] else None
                  if subpath is None:
                      path = posixpath.normpath(posixpath.join(base, item["path"]))
                  if path == target:
                      matches.append((source["name"], item["key"]))
      assert len(matches) == 1
      return matches[0]

  declared = published["Deployment", name]["spec"]["template"]["spec"]
  worker = next(container for container in declared["containers"] if container["name"] == "worker")
  assert {field: worker.get(field) for field in ("image", "command", "args")} == profile["program"]
  live = get("deployment", name)["spec"]["template"]["spec"]
  observed_pod = get("pod", pod)["spec"]
  published_map = lambda configmap: published["ConfigMap", configmap]["data"]
  live_map = lambda configmap: get("configmap", configmap)["data"]
  configmap, key = binding(declared, published_map)
  assert binding(live, live_map) == binding(observed_pod, live_map) == (configmap, key)
  published_data = published_map(configmap)
  assert live_map(configmap) == published_data
  mounted = subprocess.check_output(["kubectl", "exec", pod, "-c", "worker", "--", "cat", target], text=True)
  assert mounted == published_data[key]
  assert all(json.loads(mounted).get(key) == value for key, value in receipt["publication"].items())
  print(name + "/" + pod + ": Git, ConfigMap and mounted publication match")
  VERIFY_PROJECTION
    }
    for name in reader-a reader-b; do
      deployment=$(kubectl get deployment "$name" -o json)
      deployment_uid=$(jq -er .metadata.uid <<<"$deployment")
      program=$(jq -cer --arg name "$name" '.consumers[] | select(.name==$name) | .program' "$receipt")
      digest=$(jq -er '.image | split("@") | last | select(test("^sha256:[0-9a-f]{64}$"))' <<<"$program")
      jq -e --argjson program "$program" '
        any(.spec.template.spec.containers[]; .name=="worker" and ({image,command,args}==$program))
      ' <<<"$deployment" >/dev/null
      replicas=$(jq -er 'select(.spec.replicas>0 and .status.observedGeneration>=.metadata.generation and
        .status.readyReplicas==.spec.replicas) | .spec.replicas' <<<"$deployment")
      test "$deployment_uid" = "$(jq -er --arg name "$name" '.originalIdentities["deployment/"+$name]' "$receipt")"
      replica_uids=$(kubectl get replicasets -o json | jq -c --arg uid "$deployment_uid" '
        [.items[] | select(any(.metadata.ownerReferences[]?; .kind=="Deployment" and .controller==true and .uid==$uid)) | .metadata.uid]')
      pods=$(kubectl get pods -o json | jq -er --argjson owners "$replica_uids" --argjson replicas "$replicas" --argjson program "$program" --arg digest "$digest" '
        [.items[] | select(.metadata.deletionTimestamp==null and .status.phase!="Failed" and .status.phase!="Succeeded" and
          any(.metadata.ownerReferences[]?; .kind=="ReplicaSet" and .controller==true and (.uid as $uid | $owners | index($uid)!=null)))]
        | select(length==$replicas and all(.[]; .status.phase=="Running" and
            any(.status.conditions[]?; .type=="Ready" and .status=="True") and
            any(.spec.containers[]?; .name=="worker" and ({image,command,args}==$program)) and
            any(.status.containerStatuses[]?; .name=="worker" and .ready==true and (.state.running | type)=="object" and
              ((.imageID | split("@") | last | split("/") | last) == $digest))))
        | .[].metadata.name')
      matches_publication() {
        jq -e --slurpfile expected "$receipt" '
          . as $observed | all($expected[0].publication | to_entries[]; $observed[.key]==.value)'
      }
      while IFS= read -r pod; do
        verify_projection "$name" "$pod"
        kubectl exec "$pod" -c worker -- wget -qO- -T 3 http://127.0.0.1:8080 | matches_publication
      done <<<"$pods"
      kubectl exec "${pods%%$'\n'*}" -c worker -- wget -qO- -T 3 "http://$name:8080" | matches_publication
    done
  )
  ```

  Erwartet werden Synced/Healthy für alle Applications und beide Verbraucherantworten passend zur aktuellen Freigabe.
phrases.0: Ich habe den desired-Status mit einem Git revert wiederhergestellt.
phrases.1: Ich habe reconciliation während der Wiederherstellung aktiviert gelassen.
phrases.2: Ich habe die beobachtete Revision und den Anwendungszustand überprüft.
questions.0.points.0: Der Controller wendet den Git desired-Status erneut an.
questions.0.points.1: Korrigieren Sie die Quelle und überprüfen Sie die beobachtete Revision.
questions.0.prompt: Warum kann ein Live-rollout undo unter GitOps vorübergehend sein?
questions.1.points.0: Der fehlerhafte Commit bleibt im main-Verlauf erreichbar.
questions.1.points.1: Bei der Wiederherstellung handelt es sich um eine überprüfbare neue Änderung.
questions.1.prompt: Was behält revert, was reset verliert?
stages.0.objectives.0.text: Veröffentlichtes `origin/main` entspricht der Workstation-Datei `release-commit`, unterscheidet
  sich vom eingefrorenen fehlerhaften Commit und erhält ihn als Vorfahren.
stages.0.objectives.1.text: Application `board` behält die bereitgestellte private Git-Quelle, den Release-Branch
  und das vorhandene Workload-Verzeichnis bei.
stages.0.objectives.2.text: Application `board` meldet `Synced` und `Healthy` für den Commit in der Workstation-Datei
  `~/quest/release-commit`.
stages.0.objectives.3.text: Deployment `board` schließt seinen Rollout im Bay-Namespace ab.
stages.0.objectives.4.text: In einem Pod von Deployment `board` liefert `http://board:8080` den Wert `north-95`.
stages.0.objectives.5.text: Das veröffentlichte Git `manifests/board.yaml` stellt die bekannte gesunde Workload-Konfiguration
  wieder her. Die bestehenden fixierten Verbraucher übernehmen die aktuelle Freigabe mit ursprünglichen Programmen
  und Identitäten. Ihre Pods und Service-Endpunkte stimmen mit der Git-Projektion und aktuellen unveränderlichen
  Versionsbindungen überein.
diagnostics.rollback_head: Ein Reset von main auf den gesunden Commit entfernt die geforderte Abstammung von faulty-commit; ein veralteter release-commit kann noch den fehlerhaften oder früheren Stand nennen. Revertieren Sie die Änderung mit neuem Commit, veröffentlichen Sie weitere Reparaturen und aktualisieren Sie den Beleg auf abgerufenes origin/main. Eingabe-, Fetch- und Abstammungsbefehlsfehler nutzen denselben Marker. [Ursache und Prüfung](guides#guide=gitops-delivery&section=forward-rollback-retained-faulty-history)
diagnostics.rollback_source: Eine andere Repository-, Branch- oder Verzeichnisquelle der board-Application umgeht die gelieferte Wiederherstellung. Erhalten Sie Git-URL, Ziel main und relativen Pfad zu manifests ohne Elternwechsel. Fehlende Plattformeingabe, API-Fehler oder gescheiterter JSON-Vergleich nutzen denselben Marker. [Ursache und Prüfung](guides#guide=gitops-delivery&section=forward-rollback-retained-main-source)
diagnostics.rollback_sync: Der Produzent gleicht möglicherweise noch die falsche Revision ab, ist nicht bereit oder hat self-healing/pruning deaktiviert. Reparieren Sie die Git-Definition und warten Sie auf Synced und Healthy bei aktuellem release-commit mit beiden Flags true; das beweist noch keine neue Publikation bei unabhängig gepinnten reader Applications. [Ursache und Prüfung](guides#guide=gitops-delivery&section=forward-rollback-reconciled-main-revision)
diagnostics.rollback_rollout: Die fehlerhafte readiness probe verwendet 8099, der Server hört jedoch auf 8080; der Rollout kann trotz Git-Synchronisierung blockieren. Reparieren Sie die Git-Definition über neue Commits und prüfen Sie Rollout und Ereignisse; CLI-Fehler oder die dreisekündige Beobachtungsgrenze scheitern ebenfalls. [Ursache und Prüfung](guides#guide=gitops-delivery&section=forward-rollback-producer-rollout)
diagnostics.rollback_http: Eine synchronisierte Application kann wegen der fehlerhaften Probe keinen bereiten Service-Endpunkt haben oder einen anderen Inhalt als north-95 liefern. Beobachten Sie nach der Reparatur den board-Endpunkt aus seinem worker; exec-/HTTP-Timeout oder Befehlsfehler scheitern ebenfalls am ursprünglichen Vergleich. [Ursache und Prüfung](guides#guide=gitops-delivery&section=forward-rollback-producer-http)
diagnostics.rollback_identity_board: Löschen und Neuerstellen von board, reader-a oder reader-b erhält Namen, ändert aber eingefrorene Application- oder Deployment-UIDs. Reparieren Sie jedes Originalobjekt vor Ort; der Identitätsmarker nennt Produzent oder reader-Lane. Geprüft wird aktuelle Identität, keine unterbrechungsfreie Geschichte. [Ursache und Prüfung](guides#guide=gitops-delivery&section=forward-rollback-original-application-identities)
diagnostics.rollback_identity_a: Löschen und Neuerstellen von board, reader-a oder reader-b erhält Namen, ändert aber eingefrorene Application- oder Deployment-UIDs. Reparieren Sie jedes Originalobjekt vor Ort; der Identitätsmarker nennt Produzent oder reader-Lane. Geprüft wird aktuelle Identität, keine unterbrechungsfreie Geschichte. [Ursache und Prüfung](guides#guide=gitops-delivery&section=forward-rollback-original-application-identities)
diagnostics.rollback_identity_b: Löschen und Neuerstellen von board, reader-a oder reader-b erhält Namen, ändert aber eingefrorene Application- oder Deployment-UIDs. Reparieren Sie jedes Originalobjekt vor Ort; der Identitätsmarker nennt Produzent oder reader-Lane. Geprüft wird aktuelle Identität, keine unterbrechungsfreie Geschichte. [Ursache und Prüfung](guides#guide=gitops-delivery&section=forward-rollback-original-application-identities)
diagnostics.rollback_history: Der abgerufene Stand entspricht möglicherweise noch dem früheren reader-Baseline oder der Produzent zeigt auf ein anderes Repository. Erhalten Sie Baseline-Abstammung und veröffentlichen Sie einen neueren Commit mit freigegebenen reader-Daten. Ein Fehler des Abstammungsbefehls meldet rollback_observation statt dieses Vergleichsmarkers. [Ursache und Prüfung](guides#guide=gitops-delivery&section=forward-rollback-forward-consumer-history)
diagnostics.rollback_source_a: Reader sind anfangs an einen älteren Commit gebunden; eine Produzentenreparatur verschiebt ihre Revision nicht. Veröffentlichen Sie freigegebene Manifeste, pinnen Sie jede originale reader Application auf den aktuellen vollständigen Git-Commit, erhalten Sie Pfad, project und destination und warten Sie auf Synced und Healthy bei dieser Revision; main allein erfüllt den immutable Pin-Vergleich nicht. [Ursache und Prüfung](guides#guide=gitops-delivery&section=forward-rollback-current-reader-commit-pins)
diagnostics.rollback_source_b: Reader sind anfangs an einen älteren Commit gebunden; eine Produzentenreparatur verschiebt ihre Revision nicht. Veröffentlichen Sie freigegebene Manifeste, pinnen Sie jede originale reader Application auf den aktuellen vollständigen Git-Commit, erhalten Sie Pfad, project und destination und warten Sie auf Synced und Healthy bei dieser Revision; main allein erfüllt den immutable Pin-Vergleich nicht. [Ursache und Prüfung](guides#guide=gitops-delivery&section=forward-rollback-current-reader-commit-pins)
diagnostics.rollback_delivery_a: Ein gesunder reader kann sein Originalprogramm weiterhin mit alter Publikation ausführen. Erhalten Sie image, command und args des reader in Git, Live-Deployment und jedem aktuellen zugehörigen Pod; schließen Sie den Rollout ab und veröffentlichen Sie freigegebenes JSON über genau eine passende ConfigMap-Projektion in der document root. Git- und Live-ConfigMap-data müssen als vollständige Maps übereinstimmen, dekodierte Publikation muss alle freigegebenen Werte enthalten. Äquivalente direkte oder projected ConfigMap-Bindungen sind möglich. [Ursache und Prüfung](guides#guide=gitops-delivery&section=forward-rollback-published-reader-projection)
diagnostics.rollback_delivery_b: Ein gesunder reader kann sein Originalprogramm weiterhin mit alter Publikation ausführen. Erhalten Sie image, command und args des reader in Git, Live-Deployment und jedem aktuellen zugehörigen Pod; schließen Sie den Rollout ab und veröffentlichen Sie freigegebenes JSON über genau eine passende ConfigMap-Projektion in der document root. Git- und Live-ConfigMap-data müssen als vollständige Maps übereinstimmen, dekodierte Publikation muss alle freigegebenen Werte enthalten. Äquivalente direkte oder projected ConfigMap-Bindungen sind möglich. [Ursache und Prüfung](guides#guide=gitops-delivery&section=forward-rollback-published-reader-projection)
diagnostics.rollback_http_a: 'Git, Live-ConfigMap und gesunder Status beweisen keine aktuellen Daten in jedem reader Pod. Prüfen Sie jeden aktuellen zugehörigen Pod über localhost und dessen Service: HTTP-JSON muss freigegebene schema, generation und route enthalten. Alte Mount-Dateien können Aktualisierungszeit benötigen; ersetzen Sie das erhaltene reader-Programm nicht durch eine erfundene Antwort. [Ursache und Prüfung](guides#guide=gitops-delivery&section=forward-rollback-every-reader-publication)'
diagnostics.rollback_http_b: 'Git, Live-ConfigMap und gesunder Status beweisen keine aktuellen Daten in jedem reader Pod. Prüfen Sie jeden aktuellen zugehörigen Pod über localhost und dessen Service: HTTP-JSON muss freigegebene schema, generation und route enthalten. Alte Mount-Dateien können Aktualisierungszeit benötigen; ersetzen Sie das erhaltene reader-Programm nicht durch eine erfundene Antwort. [Ursache und Prüfung](guides#guide=gitops-delivery&section=forward-rollback-every-reader-publication)'
diagnostics.rollback_budget: Ein Git- oder Kubernetes-Befehl überschritt möglicherweise die verbleibende Zeit oder das gemeinsame 14-Sekunden-Budget endete vor Beobachtung beider reader-Lanes. Prüfen Sie API/Git-Zugriff und Konvergenz vor erneutem Abfragen; das benannte Budget gehört zum Observer und beweist keinen bestimmten Konfigurationsfehler. [Ursache und Prüfung](guides#guide=gitops-delivery&section=forward-rollback-bounded-rollback-observation)
diagnostics.rollback_observation: Der Observer kann eingefrorenen Vertrag, Git-Verlauf, Kubernetes-Dokumente oder projected reader-Daten nicht lesen. Abgefangene CLI-Fehler, ungültiges JSON/YAML, fehlende Felder und doppelte veröffentlichte Ressourcenidentitäten melden diesen Marker; auch ein Fehler des Baseline-Abstammungsbefehls landet hier. Prüfen Sie tatsächliche Eingaben vor Objektänderungen aufgrund unzugänglicher Beobachtung. [Ursache und Prüfung](guides#guide=gitops-delivery&section=forward-rollback-readable-rollback-inputs)
diagnostics.probe_0_5: Der ursprüngliche Health-Observer kann gegenüber gesundem Git-Baseline veränderte desired/live-Ressourcen oder Sicherheit, inkompatible liveness/startup probes, unterschiedliches Verhalten, blockierten Rollout oder fehlendes north-95 ablehnen. Er meldet diesen Fallback statt feinerer Marker. Spätere unbenannte Start-, Plattformeingabe- oder unbehandelte Strukturfehler gelangen ebenfalls hierher; benannte Rollback-Fehler unterdrücken ihn. Erhalten Sie Baseline-Ressourcen und Sicherheit beim Reparieren der readiness über Git. [Ursache und Prüfung](guides#guide=gitops-delivery&section=forward-rollback-healthy-contract-and-early-fallback)
