title: Argo-Rollback
brief: 'Eine Änderung im privaten Git hat eine fehlerhafte Readiness-Probe eingeführt. Argo CD gleicht
  sie weiterhin ab und würde deshalb ein isoliertes Rollback des laufenden Zustands überschreiben. Prüfe
  healthy-commit und faulty-commit, erstelle anschließend auf main einen neuen Git-Revert-Commit und pushe
  ihn in das private Repository. Bewahre den fehlerhaften Commit im Verlauf, erhalte automatisches self-heal/prune
  und halte den neuen HEAD in release-commit fest. Stelle das ursprüngliche gesunde Manifest und das HTTP-Ergebnis
  wieder her. Setze den Verlauf nicht zurück und führe keinen force-push aus. Deaktiviere GitOps nicht
  und rolle nicht nur das Deployment zurück.


  Questdateien in `~/quest` (einige erscheinen in späteren Phasen): `application.json`, `healthy-commit`,
  `faulty-commit`, `release-commit`, `repository/manifests/board.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Anfängliche Erfolgskriterien: Ein neuer nachfolgender Commit stellt das gesunde Manifest wieder her;
  Argo bleibt automatisiert und in den Zuständen Synced und Healthy, mit north-95 über HTTP.'
debrief: Rollback wurde als Vorwärtsänderung des desired-Status ausgedrückt, wobei die fehlerhafte Revision
  zur Untersuchung beibehalten wurde.
stages.0.brief: 'Erfolgskriterien: Ein neuer nachfolgender Commit stellt das gesunde Manifest wieder her;
  Argo bleibt automatisiert und in den Zuständen Synced und Healthy, mit north-95 über HTTP.'
stages.0.objectives.0.text: Ein neuer nachfolgender Commit stellt das gesunde Manifest wieder her; Argo
  bleibt automatisiert und in den Zuständen Synced und Healthy, mit north-95 über HTTP.
hints.0.text: Self-heal gleicht den Git desired-Status ab, einschließlich Fehlern.
hints.1.text: Bei einem Zurücksetzen wird ein neuer korrigierender Commit aufgezeichnet und der Vorfallverlauf
  gespeichert.
hints.2.text: Erstelle einen Revert des festgehaltenen fehlerhaften Commits, pushe main und prüfe beobachtete
  Revision und Zustand.
phrases.0: Ich habe den desired-Status mit einem Git revert wiederhergestellt.
phrases.1: Ich habe reconciliation während der Wiederherstellung aktiviert gelassen.
phrases.2: Ich habe die beobachtete Revision und den Anwendungszustand überprüft.
questions.0.points.0: Der Controller wendet den Git desired-Status erneut an.
questions.0.points.1: Korrigieren Sie die Quelle und überprüfen Sie die beobachtete Revision.
questions.0.prompt: Warum kann ein Live-rollout undo unter GitOps vorübergehend sein?
questions.1.points.0: Der fehlerhafte Commit bleibt im main-Verlauf erreichbar.
questions.1.points.1: Bei der Wiederherstellung handelt es sich um eine überprüfbare neue Änderung.
questions.1.prompt: Was behält revert, was reset verliert?
