title: Reversión de Argo
brief: 'La última versión del Git privado no está sana. Recupera el contenido conocido como sano conservando el
  historial del incidente.


  Trabaja en la workstation en `~/quest` con `platform.env`, `application.yaml`, `healthy-commit`, `faulty-commit`,
  `release-commit`, `repository/`.


  Salvo indicación contraria, los recursos Kubernetes están en el namespace de la bahía (`DQ_NAMESPACE`); las rutas
  bajo `~/quest` están en la workstation.


  **Requirements:**


  - El `origin/main` publicado coincide con `release-commit` en la workstation, difiere del commit defectuoso congelado
  y lo conserva como ancestro.

  - La Application `board` conserva la fuente Git privada suministrada, la rama de la versión y el directorio existente
  de la carga.

  - La Application `board` informa `Synced` y `Healthy` en el commit de `~/quest/release-commit` en la workstation.

  - El Deployment `board` completa su rollout en el namespace de la bahía.

  - Dentro de un Pod del Deployment `board`, `http://board:8080` devuelve `north-95`.

  - El archivo Git publicado `manifests/board.yaml` recupera la configuración de carga conocida como sana.


  El contenido y la ascendencia actuales de Git no demuestran qué comando de recuperación se utilizó.


  Entradas adicionales: `rollback-contract.json`, `current-publication.json`, `consumer-baseline-commit`, `original-release-identities.json`,
  `repository/readers/`.


  Recupera la configuración sana conocida del productor y entrega la publicación aprobada actual a los consumidores
  existentes fijados de forma independiente. Cada consumidor debe conservar una referencia inmutable al commit de
  la versión publicada. Conserva las identidades de Application y Deployment originales y las imágenes y programas
  suministrados. Cada Pod activo que les pertenezca y su destino Service deben servir la publicación desde la proyección
  Git de solo lectura. Conserva la revisión inicial registrada de los consumidores en Git.


  El registro inicial congelado es la referencia; las copias de trabajo no lo sustituyen. Se comprueban el estado
  actual y la ascendencia, no los comandos usados para recuperar.'
debrief: Restauraste la configuración sana del productor y propagaste la publicación actual a consumidores fijados
  de forma independiente, conservando identidades e historia Git.
stages.0.brief: Conserva el commit defectuoso en el historial publicado.
hints.0.text: Una versión histórica sana del productor y las obligaciones actuales de sus consumidores pueden tener
  vidas distintas. Recuperar una no actualiza automáticamente a consumidores fijados de forma independiente.
hints.1.text: Compara `rollback-contract.json`, `current-publication.json`, los commits registrados, los manifiestos
  de consumidores, las fuentes Application y las revisiones observadas. Sigue la publicación a través de los Pods
  que realmente les pertenecen y las respuestas Service.
hints.2.text: "Restaura la configuración sana del productor e incorpora la publicación aprobada actual de los consumidores.\
  \ Realiza commit y push sin descartar el incidente ni la revisión inicial de consumidores. Avanza la referencia\
  \ inmutable de cada consumidor existente al commit publicado, refresca las Applications y espera la adopción real\
  \ de la proyección. Verifica UID y programas originales, revisiones observadas, disponibilidad y HTTP de cada\
  \ Pod y Service perteneciente al consumidor.\n\nVerifica cada Pod perteneciente a la cadena Deployment/ReplicaSet\
  \ existente y después cada Service:\n\n```sh\nset -euo pipefail\nkubectl get applications board reader-a reader-b\n\
  for name in reader-a reader-b; do\n  deployment_uid=$(kubectl get deployment \"$name\" -o jsonpath='{.metadata.uid}')\n\
  \  replica_uids=$(kubectl get replicasets -o json | jq -c --arg uid \"$deployment_uid\" '[.items[] | select(any(.metadata.ownerReferences[]?;\
  \ .kind==\"Deployment\" and .controller==true and .uid==$uid)) | .metadata.uid]')\n  kubectl get pods -o json\
  \ | jq -r --argjson owners \"$replica_uids\" '.items[] | select(.metadata.deletionTimestamp==null and .status.phase!=\"\
  Failed\" and .status.phase!=\"Succeeded\") | select(any(.metadata.ownerReferences[]?; .kind==\"ReplicaSet\" and\
  \ .controller==true and (.uid as $uid | $owners | index($uid)!=null))) | .metadata.name' |\n    while IFS= read\
  \ -r pod; do\n      kubectl exec \"$pod\" -c worker -- wget -qO- -T 3 http://127.0.0.1:8080\n    done\n  kubectl\
  \ exec \"deployment/$name\" -c worker -- wget -qO- -T 3 \"http://$name:8080\"\ndone\n```\n\nSe esperan todas las\
  \ Applications Synced/Healthy y ambas respuestas de consumidores coincidentes con la publicación aprobada actual."
phrases.0: Restauré el estado desired con un Git revert.
phrases.1: Mantuve reconciliation habilitado durante la recuperación.
phrases.2: Verifiqué la revisión observada y el estado de la aplicación.
questions.0.points.0: El controlador vuelve a aplicar el estado Git desired.
questions.0.points.1: Corrija la fuente y verifique la revisión observada.
questions.0.prompt: ¿Por qué un rollout undo activo puede ser temporal en GitOps?
questions.1.points.0: La confirmación defectuosa sigue siendo accesible en el historial main.
questions.1.points.1: La recuperación es un nuevo cambio reseñable.
questions.1.prompt: ¿Qué preserva revert que pierde reset?
stages.0.objectives.0.text: El `origin/main` publicado coincide con `release-commit` en la workstation, difiere
  del commit defectuoso congelado y lo conserva como ancestro.
stages.0.objectives.1.text: La Application `board` conserva la fuente Git privada suministrada, la rama de la versión
  y el directorio existente de la carga.
stages.0.objectives.2.text: La Application `board` informa `Synced` y `Healthy` en el commit de `~/quest/release-commit`
  en la workstation.
stages.0.objectives.3.text: El Deployment `board` completa su rollout en el namespace de la bahía.
stages.0.objectives.4.text: Dentro de un Pod del Deployment `board`, `http://board:8080` devuelve `north-95`.
stages.0.objectives.5.text: El archivo Git publicado `manifests/board.yaml` recupera la configuración de carga conocida
  como sana. Los consumidores existentes adoptan la publicación aprobada actual con sus programas e identidades
  originales. Sus Pods y destinos Service concuerdan con la proyección Git y las referencias inmutables actuales.
diagnostics.rollback_head: Restablecer main al commit sano borra la ascendencia requerida de faulty-commit; release-commit obsoleto puede seguir apuntando al commit erróneo o anterior. Revierta el cambio con un commit nuevo, publique recuperación posterior y actualice recibo a origin/main obtenido. Fallos de entradas, fetch o comando ancestry también dan marcador. [Causa y comprobación](guides#guide=gitops-delivery&section=forward-rollback-retained-faulty-history)
diagnostics.rollback_source: Redirigir Application board a otro repositorio, rama o directorio evita la fuente suministrada. Conserve Git URL, destino main y ruta relativa a manifests sin recorrido al padre. Entrada plataforma ausente, error API o comparación JSON también da marcador. [Causa y comprobación](guides#guide=gitops-delivery&section=forward-rollback-retained-main-source)
diagnostics.rollback_sync: El productor puede reconciliar revisión errónea, mostrar readiness no sana o desactivar self-healing/pruning. Restaure definición Git y espere Synced y Healthy en release-commit actual con ambas flags true; no prueba adopción de publicación nueva por reader Applications fijadas independientemente. [Causa y comprobación](guides#guide=gitops-delivery&section=forward-rollback-reconciled-main-revision)
diagnostics.rollback_rollout: La readiness probe errónea usa 8099 mientras servidor escucha 8080; rollout puede bloquearse aun con Git sincronizado. Repare definición Git con historial hacia delante e inspeccione rollout/events; error CLI o límite de tres segundos también falla. [Causa y comprobación](guides#guide=gitops-delivery&section=forward-rollback-producer-rollout)
diagnostics.rollback_http: Application sincronizada puede carecer de endpoint listo por la probe errónea o devolver cuerpo distinto de north-95. Observe endpoint real board desde su worker tras recuperar; timeout o error exec/HTTP también falla comparación original. [Causa y comprobación](guides#guide=gitops-delivery&section=forward-rollback-producer-http)
diagnostics.rollback_identity_board: Eliminar y recrear board, reader-a o reader-b conserva nombre pero cambia UID congelado de Application o Deployment. Repare objetos originales en sitio; el marcador identifica productor o línea reader. Se comprueba identidad actual, no historial ininterrumpido. [Causa y comprobación](guides#guide=gitops-delivery&section=forward-rollback-original-application-identities)
diagnostics.rollback_identity_a: Eliminar y recrear board, reader-a o reader-b conserva nombre pero cambia UID congelado de Application o Deployment. Repare objetos originales en sitio; el marcador identifica productor o línea reader. Se comprueba identidad actual, no historial ininterrumpido. [Causa y comprobación](guides#guide=gitops-delivery&section=forward-rollback-original-application-identities)
diagnostics.rollback_identity_b: Eliminar y recrear board, reader-a o reader-b conserva nombre pero cambia UID congelado de Application o Deployment. Repare objetos originales en sitio; el marcador identifica productor o línea reader. Se comprueba identidad actual, no historial ininterrumpido. [Causa y comprobación](guides#guide=gitops-delivery&section=forward-rollback-original-application-identities)
diagnostics.rollback_history: La cabecera obtenida puede seguir igual al baseline reader anterior o el productor apuntar a otro repositorio. Conserve ascendencia baseline y publique commit nuevo con datos reader aprobados. Fallo del comando ancestry usa rollback_observation, no este marcador de comparación. [Causa y comprobación](guides#guide=gitops-delivery&section=forward-rollback-forward-consumer-history)
diagnostics.rollback_source_a: Reader empiezan fijados a un commit anterior; reparar productor no mueve sus revisiones. Publique manifests aprobados, fije cada reader Application original al Git commit completo actual, conserve ruta, project y destination y espere Synced y Healthy en esa revisión; apuntar solo a main no cumple comparación immutable pin. [Causa y comprobación](guides#guide=gitops-delivery&section=forward-rollback-current-reader-commit-pins)
diagnostics.rollback_source_b: Reader empiezan fijados a un commit anterior; reparar productor no mueve sus revisiones. Publique manifests aprobados, fije cada reader Application original al Git commit completo actual, conserve ruta, project y destination y espere Synced y Healthy en esa revisión; apuntar solo a main no cumple comparación immutable pin. [Causa y comprobación](guides#guide=gitops-delivery&section=forward-rollback-current-reader-commit-pins)
diagnostics.rollback_delivery_a: Un reader sano puede seguir ejecutando programa original con publicación anterior. Conserve image, command y args reader en Git, Deployment vivo y cada Pod actual propio; complete rollout y publique JSON aprobado mediante exactamente una proyección ConfigMap coincidente en document root. Data Git y ConfigMap vivo deben coincidir como mapas completos, y publicación decodificada incluir valores aprobados. Pueden aceptarse vínculos ConfigMap directos o projected equivalentes. [Causa y comprobación](guides#guide=gitops-delivery&section=forward-rollback-published-reader-projection)
diagnostics.rollback_delivery_b: Un reader sano puede seguir ejecutando programa original con publicación anterior. Conserve image, command y args reader en Git, Deployment vivo y cada Pod actual propio; complete rollout y publique JSON aprobado mediante exactamente una proyección ConfigMap coincidente en document root. Data Git y ConfigMap vivo deben coincidir como mapas completos, y publicación decodificada incluir valores aprobados. Pueden aceptarse vínculos ConfigMap directos o projected equivalentes. [Causa y comprobación](guides#guide=gitops-delivery&section=forward-rollback-published-reader-projection)
diagnostics.rollback_http_a: 'Git, ConfigMap vivo y estado sano no prueban datos actuales en cada reader Pod. Observe cada Pod propio actual por localhost y su Service: JSON HTTP debe incluir schema, generation y route aprobados. Archivo montado antiguo puede requerir propagación; no sustituya programa reader conservado por respuesta fabricada. [Causa y comprobación](guides#guide=gitops-delivery&section=forward-rollback-every-reader-publication)'
diagnostics.rollback_http_b: 'Git, ConfigMap vivo y estado sano no prueban datos actuales en cada reader Pod. Observe cada Pod propio actual por localhost y su Service: JSON HTTP debe incluir schema, generation y route aprobados. Archivo montado antiguo puede requerir propagación; no sustituya programa reader conservado por respuesta fabricada. [Causa y comprobación](guides#guide=gitops-delivery&section=forward-rollback-every-reader-publication)'
diagnostics.rollback_budget: Un comando Git o Kubernetes puede agotar plazo restante o presupuesto común de 14 segundos antes de observar ambas líneas reader. Verifique acceso API/Git y convergencia antes de repetir; presupuesto nombrado pertenece al observador y no prueba fallo de predicado concreto. [Causa y comprobación](guides#guide=gitops-delivery&section=forward-rollback-bounded-rollback-observation)
diagnostics.rollback_observation: El observador puede no leer contrato congelado, historial Git, documentos Kubernetes o datos projected reader. Errores CLI capturados, JSON/YAML inválido, campos ausentes o identidades duplicadas producen marcador; fallo del comando ancestry baseline también llega aquí. Inspeccione entradas reales antes de cambiar objetos por una observación inaccesible. [Causa y comprobación](guides#guide=gitops-delivery&section=forward-rollback-readable-rollback-inputs)
diagnostics.probe_0_5: El health observer original puede rechazar recursos o seguridad desired/live cambiados respecto al Git baseline sano, probes liveness/startup incompatibles, comportamiento divergente, rollout bloqueado o falta de north-95. Emite este fallback sin marcadores más precisos. Fallos posteriores sin nombre de arranque, platform input o estructura también llegan aquí; fallos rollback nombrados lo suprimen. Conserve recursos y seguridad baseline reparando readiness por Git. [Causa y comprobación](guides#guide=gitops-delivery&section=forward-rollback-healthy-contract-and-early-fallback)
