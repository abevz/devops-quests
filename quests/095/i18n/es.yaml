title: Reversión de Argo
brief: 'Una versión del Git privado introdujo una sonda readiness incorrecta. Argo CD sigue reconciliándola,
  por lo que sobrescribiría una reversión aislada del estado en ejecución. Inspecciona healthy-commit
  y faulty-commit; después crea un nuevo commit de reversión (Git revert) en main y haz push al repositorio
  privado. Conserva el commit defectuoso en el historial, mantén self-heal/prune automáticos y registra
  el nuevo HEAD en release-commit. Restaura el manifiesto sano original y el resultado HTTP. No hagas
  reset ni force-push del historial. No desactives GitOps ni reviertas únicamente el Deployment.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `application.json`, `healthy-commit`,
  `faulty-commit`, `release-commit`, `repository/manifests/board.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios iniciales de éxito: Un nuevo commit descendiente restaura el manifiesto sano; Argo mantiene
  la automatización y los estados Synced y Healthy, con north-95 a través de HTTP.'
debrief: La reversión se expresó como un cambio hacia adelante al estado desired, reteniendo la revisión
  defectuosa para su investigación.
