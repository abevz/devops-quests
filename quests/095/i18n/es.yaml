title: Reversión de Argo
brief: |-
  La última versión del Git privado no está sana. Recupera el contenido conocido como sano conservando el historial del incidente.

  Trabaja en la workstation en `~/quest` con `platform.env`, `application.yaml`, `healthy-commit`, `faulty-commit`, `release-commit`, `repository/`.

  Salvo indicación contraria, los recursos Kubernetes están en el namespace de la bahía (`DQ_NAMESPACE`); las rutas bajo `~/quest` están en la workstation.

  **Requirements:**

  - El `origin/main` publicado coincide con `release-commit` en la workstation, difiere del commit defectuoso congelado y lo conserva como ancestro.
  - La Application `board` conserva la fuente Git privada suministrada, la rama de la versión y el directorio existente de la carga.
  - La Application `board` informa `Synced` y `Healthy` en el commit de `~/quest/release-commit` en la workstation.
  - El Deployment `board` completa su rollout en el namespace de la bahía.
  - Dentro de un Pod del Deployment `board`, `http://board:8080` devuelve `north-95`.
  - El archivo Git publicado `manifests/board.yaml` recupera la configuración de carga conocida como sana.

  El contenido y la ascendencia actuales de Git no demuestran qué comando de recuperación se utilizó.
debrief: La reversión se expresó como un cambio hacia adelante al estado desired, reteniendo la revisión
  defectuosa para su investigación.
stages.0.brief: Conserva el commit defectuoso en el historial publicado.
hints.0.text: Self-heal concilia el estado de Git desired, incluidos los errores.
hints.1.text: |-
  Inspecciona el historial de la versión y los síntomas actuales de fallo de la carga.

  ```bash
  git -C repository log --oneline -5
  kubectl describe deployment board
  ```
hints.2.text: |-
  Revierte el commit defectuoso registrado, haz push de main y verifica la revisión observada y el estado. Una reversión registra una nueva confirmación correctiva y mantiene el historial de incidentes.

  Verifica desde `~/quest` en la workstation:

  - `source platform.env`
  - `git -C repository ls-remote origin refs/heads/main`
  - `cat release-commit`
  - `git -C repository merge-base --is-ancestor "$(cat /run/dq/facts/0/faulty-commit)" "$(cat release-commit)"`
  - `git -C repository show --stat --oneline "$(cat release-commit)"`

  El hash de `main` remoto coincide con `release-commit`. La lectura de ascendencia termina con código `0`; el nuevo commit conserva el historial del incidente.

  - `kubectl get application board -o json | jq '{sync:.status.sync.status, health:.status.health.status, revision:.status.sync.revision,repo:.spec.source.repoURL,path:.spec.source.path,branch:.spec.source.targetRevision}'`

  `Synced`, `Healthy` y la revisión de `release-commit`. La fuente es el repositorio privado suministrado, `manifests`, `main`.

  - `kubectl rollout status deployment/board --timeout=3s`
  - `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080`

  El rollout termina; `north-95`.
phrases.0: Restauré el estado desired con un Git revert.
phrases.1: Mantuve reconciliation habilitado durante la recuperación.
phrases.2: Verifiqué la revisión observada y el estado de la aplicación.
questions.0.points.0: El controlador vuelve a aplicar el estado Git desired.
questions.0.points.1: Corrija la fuente y verifique la revisión observada.
questions.0.prompt: ¿Por qué un rollout undo activo puede ser temporal en GitOps?
questions.1.points.0: La confirmación defectuosa sigue siendo accesible en el historial main.
questions.1.points.1: La recuperación es un nuevo cambio reseñable.
questions.1.prompt: ¿Qué preserva revert que pierde reset?
