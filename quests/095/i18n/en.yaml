title: Argo rollback
brief: 'The latest private Git release is not healthy. Restore the known healthy release content while retaining
  the incident history.


  Work on the workstation in `~/quest` with `platform.env`, `application.yaml`, `healthy-commit`, `faulty-commit`,
  `release-commit`, `repository/`.


  Unless stated otherwise, Kubernetes resources live in the bay namespace (`DQ_NAMESPACE`); `~/quest` paths are
  on the workstation.


  **Requirements:**


  - Published `origin/main` equals workstation `release-commit`, differs from the frozen faulty commit, and retains
  that commit as an ancestor.

  - Application `board` retains the supplied private Git source, release branch and existing workload directory.

  - Application `board` reports `Synced` and `Healthy` at the commit in workstation `~/quest/release-commit`.

  - Deployment `board` completes its rollout in the bay namespace.

  - Inside a Pod of Deployment `board`, `http://board:8080` returns `north-95`.

  - Published Git `manifests/board.yaml` restores the known healthy workload configuration.


  Current Git content and ancestry do not prove which recovery command was used.


  Additional inputs: `rollback-contract.json`, `current-publication.json`, `consumer-baseline-commit`, `original-release-identities.json`,
  `repository/readers/`.


  Recover the known healthy producer configuration while delivering the current approved publication to the existing
  independently pinned consumers. Each consumer must retain an immutable commit pin to the published release. Preserve
  the original Application and Deployment identities and the supplied consumer images and programs. Every owned
  active consumer Pod and its Service endpoint must serve the approved publication from the Git-managed read-only
  projection. Retain the recorded consumer baseline in Git history.


  The frozen setup receipt is authoritative; working copies do not replace it. Checks observe current state and
  ancestry, not the recovery command history.'
debrief: You restored healthy producer configuration and propagated the current publication to independently pinned
  consumers while preserving their identities and Git history.
stages.0.brief: Retain the faulty commit in published history.
hints.0.text: A healthy historical producer release and the current obligations of its consumers can have different
  lifetimes. Recovering one does not automatically advance independently pinned consumers.
hints.1.text: |-
  Compare `rollback-contract.json`, `current-publication.json`, the recorded commits, consumer manifests, Application sources and observed revisions. Follow the publication through the actual owned Pods and Service responses.

  Compare the recorded healthy producer and consumer baselines with the published revision. In each retained consumer, inspect the pinned source revision, mounted publication and current workload owner chain.
hints.2.text: |-
  Verify original UIDs and programs, current observed revisions, readiness and HTTP from every owned consumer Pod and Service.

  Verify each Pod owned through the existing Deployment/ReplicaSet chain, then each Service:

  ```sh
  (
    set -euo pipefail
    cd ~/quest
    source platform.env
    receipt=/run/dq/facts/0/rollback-contract.json
    revision=$(git -C repository ls-remote origin refs/heads/main | cut -f1)
    test -n "$revision"
    kubectl get applications board reader-a reader-b -o json |
      jq -e --arg revision "$revision" --slurpfile expected "$receipt" '
        def relative_parts: select(type=="string" and (startswith("/")|not)) | split("/") | map(select(.!="" and .!="."));
        ([.items[].metadata.name] | sort)==["board","reader-a","reader-b"] and
        all(.items[]; .metadata.name as $name |
          .metadata.uid==$expected[0].originalIdentities["application/"+$name] and
          .spec.source.repoURL==$expected[0].repoURL and
          .status.sync.revision==$revision and .status.sync.status=="Synced" and .status.health.status=="Healthy" and
          (if $name=="board" then true else
             ($expected[0].consumers[] | select(.name==$name)) as $supplied |
             (.spec.source.targetRevision | ascii_downcase)==$revision and
             (.spec.source.path | relative_parts)==($supplied.path | relative_parts) and
             .spec.project==$supplied.project and .spec.destination==$supplied.destination
           end))'
    verify_projection() {
      python3 -I - "$revision" "$receipt" "$1" "$2" <<'VERIFY_PROJECTION'
  import json
  import posixpath
  import subprocess
  import sys
  from pathlib import Path

  import yaml

  revision, receipt_path, name, pod = sys.argv[1:]
  receipt = json.loads(Path(receipt_path).read_text())
  profile = next(item for item in receipt["consumers"] if item["name"] == name)
  target = posixpath.join(profile["documentRoot"], "index.html")
  git = ["git", "-C", "repository"]
  paths = subprocess.check_output([*git, "ls-tree", "-r", "--name-only", revision, "--", profile["path"]], text=True).splitlines()

  def manifests(document):
      if isinstance(document, dict):
          if document.get("kind") == "List":
              for item in document.get("items", []):
                  yield from manifests(item)
          elif document.get("kind") in ("Deployment", "ConfigMap"):
              yield document

  published = {}
  for path in paths:
      if Path(path).suffix not in (".yaml", ".yml", ".json"):
          continue
      for root in yaml.safe_load_all(subprocess.check_output([*git, "show", revision + ":" + path])):
          for document in manifests(root):
              identity = document["kind"], document["metadata"]["name"]
              assert identity not in published
              published[identity] = document

  def get(kind, resource):
      return json.loads(subprocess.check_output(["kubectl", "get", kind, resource, "-o", "json"]))

  def binding(spec, data_for):
      worker = next(item for item in spec["containers"] if item["name"] == "worker")
      volumes = {volume["name"]: volume for volume in spec.get("volumes", [])}
      matches = []
      for mount in worker.get("volumeMounts", []):
          base = mount["mountPath"]
          subpath = mount.get("subPath")
          if subpath is not None and base != target:
              continue
          if subpath is None and not target.startswith(base.rstrip("/") + "/"):
              continue
          volume = volumes[mount["name"]]
          sources = [volume["configMap"]] if "configMap" in volume else [
              item["configMap"] for item in volume.get("projected", {}).get("sources", []) if "configMap" in item]
          for source in sources:
              data = data_for(source["name"])
              items = source.get("items", [{"key": key, "path": key} for key in data])
              for item in items:
                  path = base if subpath == item["path"] else None
                  if subpath is None:
                      path = posixpath.normpath(posixpath.join(base, item["path"]))
                  if path == target:
                      matches.append((source["name"], item["key"]))
      assert len(matches) == 1
      return matches[0]

  declared = published["Deployment", name]["spec"]["template"]["spec"]
  worker = next(container for container in declared["containers"] if container["name"] == "worker")
  assert {field: worker.get(field) for field in ("image", "command", "args")} == profile["program"]
  live = get("deployment", name)["spec"]["template"]["spec"]
  observed_pod = get("pod", pod)["spec"]
  published_map = lambda configmap: published["ConfigMap", configmap]["data"]
  live_map = lambda configmap: get("configmap", configmap)["data"]
  configmap, key = binding(declared, published_map)
  assert binding(live, live_map) == binding(observed_pod, live_map) == (configmap, key)
  published_data = published_map(configmap)
  assert live_map(configmap) == published_data
  mounted = subprocess.check_output(["kubectl", "exec", pod, "-c", "worker", "--", "cat", target], text=True)
  assert mounted == published_data[key]
  assert all(json.loads(mounted).get(key) == value for key, value in receipt["publication"].items())
  print(name + "/" + pod + ": Git, ConfigMap and mounted publication match")
  VERIFY_PROJECTION
    }
    for name in reader-a reader-b; do
      deployment=$(kubectl get deployment "$name" -o json)
      deployment_uid=$(jq -er .metadata.uid <<<"$deployment")
      program=$(jq -cer --arg name "$name" '.consumers[] | select(.name==$name) | .program' "$receipt")
      digest=$(jq -er '.image | split("@") | last | select(test("^sha256:[0-9a-f]{64}$"))' <<<"$program")
      jq -e --argjson program "$program" '
        any(.spec.template.spec.containers[]; .name=="worker" and ({image,command,args}==$program))
      ' <<<"$deployment" >/dev/null
      replicas=$(jq -er 'select(.spec.replicas>0 and .status.observedGeneration>=.metadata.generation and
        .status.readyReplicas==.spec.replicas) | .spec.replicas' <<<"$deployment")
      test "$deployment_uid" = "$(jq -er --arg name "$name" '.originalIdentities["deployment/"+$name]' "$receipt")"
      replica_uids=$(kubectl get replicasets -o json | jq -c --arg uid "$deployment_uid" '
        [.items[] | select(any(.metadata.ownerReferences[]?; .kind=="Deployment" and .controller==true and .uid==$uid)) | .metadata.uid]')
      pods=$(kubectl get pods -o json | jq -er --argjson owners "$replica_uids" --argjson replicas "$replicas" --argjson program "$program" --arg digest "$digest" '
        [.items[] | select(.metadata.deletionTimestamp==null and .status.phase!="Failed" and .status.phase!="Succeeded" and
          any(.metadata.ownerReferences[]?; .kind=="ReplicaSet" and .controller==true and (.uid as $uid | $owners | index($uid)!=null)))]
        | select(length==$replicas and all(.[]; .status.phase=="Running" and
            any(.status.conditions[]?; .type=="Ready" and .status=="True") and
            any(.spec.containers[]?; .name=="worker" and ({image,command,args}==$program)) and
            any(.status.containerStatuses[]?; .name=="worker" and .ready==true and (.state.running | type)=="object" and
              ((.imageID | split("@") | last | split("/") | last) == $digest))))
        | .[].metadata.name')
      matches_publication() {
        jq -e --slurpfile expected "$receipt" '
          . as $observed | all($expected[0].publication | to_entries[]; $observed[.key]==.value)'
      }
      while IFS= read -r pod; do
        verify_projection "$name" "$pod"
        kubectl exec "$pod" -c worker -- wget -qO- -T 3 http://127.0.0.1:8080 | matches_publication
      done <<<"$pods"
      kubectl exec "${pods%%$'\n'*}" -c worker -- wget -qO- -T 3 "http://$name:8080" | matches_publication
    done
  )
  ```

  Expect all Applications Synced/Healthy and both consumer responses matching the current approved publication.
phrases.0: I restored desired state with a Git revert.
phrases.1: I kept reconciliation enabled during recovery.
phrases.2: I verified the observed revision and application health.
questions.0.points.0: The controller reapplies the Git desired state.
questions.0.points.1: Correct the source and verify the observed revision.
questions.0.prompt: Why can a live rollout undo be temporary under GitOps?
questions.1.points.0: The faulty commit remains reachable in the main history.
questions.1.points.1: The recovery is a reviewable new change.
questions.1.prompt: What does revert preserve that reset loses?
stages.0.objectives.0.text: Published `origin/main` equals workstation `release-commit`, differs from the frozen
  faulty commit, and retains that commit as an ancestor.
stages.0.objectives.1.text: Application `board` retains the supplied private Git source, release branch and existing
  workload directory.
stages.0.objectives.2.text: Application `board` reports `Synced` and `Healthy` at the commit in workstation `~/quest/release-commit`.
stages.0.objectives.3.text: Deployment `board` completes its rollout in the bay namespace.
stages.0.objectives.4.text: Inside a Pod of Deployment `board`, `http://board:8080` returns `north-95`.
stages.0.objectives.5.text: Published Git `manifests/board.yaml` restores the known healthy workload configuration.
  The existing pinned consumers adopt the current approved publication on their original programs and identities.
  Their owned Pods and Service endpoints agree with the Git-managed projection and current immutable release pins.
diagnostics.rollback_head: Resetting main to the healthy commit erases the required faulty-commit ancestry, while a stale release-commit may still name the faulty or earlier head. Revert the faulty change through a new commit, publish subsequent recovery work, and update the working receipt to fetched origin/main. Input/fetch failures and a failed ancestry command also use this marker. [Cause and check](guides#guide=gitops-delivery&section=forward-rollback-retained-faulty-history)
diagnostics.rollback_source: Redirecting the board Application to another repository, branch or directory bypasses the supplied recovery source. Keep the provided Git URL, main target and relative path resolving to manifests without parent traversal. Missing platform input, API failure or failed JSON comparison also uses this marker. [Cause and check](guides#guide=gitops-delivery&section=forward-rollback-retained-main-source)
diagnostics.rollback_sync: The producer may still reconcile the faulty revision, report unhealthy readiness or have automated self-healing/pruning disabled. Restore the Git definition and wait for Synced and Healthy at the current release-commit with both automation flags true; this producer result does not prove that independently pinned reader Applications adopted the newer publication. [Cause and check](guides#guide=gitops-delivery&section=forward-rollback-reconciled-main-revision)
diagnostics.rollback_rollout: The supplied faulty readiness probe uses port 8099 while the server listens on 8080, so the rollout can remain blocked even while Git is synchronized. Repair the Git definition through the forward history and inspect rollout/events; a CLI error or the three-second rollout observation limit also fails this condition. [Cause and check](guides#guide=gitops-delivery&section=forward-rollback-producer-rollout)
diagnostics.rollback_http: A synchronized Application can still have no ready Service endpoint because the bad probe excludes its serving Pod, or the response body may differ from north-95. Observe the actual board endpoint from its worker after recovery; exec/HTTP timeout or command failure also fails the original value comparison. [Cause and check](guides#guide=gitops-delivery&section=forward-rollback-producer-http)
diagnostics.rollback_identity_board: Deleting and recreating board, reader-a or reader-b can retain the name while changing the frozen Application or Deployment UID. Repair each original object in place; the specific identity marker identifies the producer or reader lane. These checks establish current identity, not uninterrupted history. [Cause and check](guides#guide=gitops-delivery&section=forward-rollback-original-application-identities)
diagnostics.rollback_identity_a: Deleting and recreating board, reader-a or reader-b can retain the name while changing the frozen Application or Deployment UID. Repair each original object in place; the specific identity marker identifies the producer or reader lane. These checks establish current identity, not uninterrupted history. [Cause and check](guides#guide=gitops-delivery&section=forward-rollback-original-application-identities)
diagnostics.rollback_identity_b: Deleting and recreating board, reader-a or reader-b can retain the name while changing the frozen Application or Deployment UID. Repair each original object in place; the specific identity marker identifies the producer or reader lane. These checks establish current identity, not uninterrupted history. [Cause and check](guides#guide=gitops-delivery&section=forward-rollback-original-application-identities)
diagnostics.rollback_history: The fetched head may still equal the earlier reader baseline or the producer may point at another repository. Preserve baseline ancestry and publish a newer commit containing the approved reader data. A failing ancestry CLI call is reported by rollback_observation rather than this explicit comparison marker. [Cause and check](guides#guide=gitops-delivery&section=forward-rollback-forward-consumer-history)
diagnostics.rollback_source_a: The readers start pinned to an earlier commit, so repairing the producer does not move their source revision. Publish the approved reader manifests, pin each original reader Application to the current full Git commit, retain its own path, project and destination, and wait for its Synced and Healthy status at that revision; pointing these readers at main alone does not satisfy their immutable pin comparison. [Cause and check](guides#guide=gitops-delivery&section=forward-rollback-current-reader-commit-pins)
diagnostics.rollback_source_b: The readers start pinned to an earlier commit, so repairing the producer does not move their source revision. Publish the approved reader manifests, pin each original reader Application to the current full Git commit, retain its own path, project and destination, and wait for its Synced and Healthy status at that revision; pointing these readers at main alone does not satisfy their immutable pin comparison. [Cause and check](guides#guide=gitops-delivery&section=forward-rollback-current-reader-commit-pins)
diagnostics.rollback_delivery_a: A healthy reader may still run its original program against the old publication. Retain the supplied reader image, command and args in Git, the live Deployment and every current owned Pod; complete the rollout and publish the approved JSON through exactly one matching ConfigMap projection at the declared document root. Git and live ConfigMap data must agree as complete maps, while the decoded publication must include every approved value. Equivalent direct or projected ConfigMap bindings can be accepted. [Cause and check](guides#guide=gitops-delivery&section=forward-rollback-published-reader-projection)
diagnostics.rollback_delivery_b: A healthy reader may still run its original program against the old publication. Retain the supplied reader image, command and args in Git, the live Deployment and every current owned Pod; complete the rollout and publish the approved JSON through exactly one matching ConfigMap projection at the declared document root. Git and live ConfigMap data must agree as complete maps, while the decoded publication must include every approved value. Equivalent direct or projected ConfigMap bindings can be accepted. [Cause and check](guides#guide=gitops-delivery&section=forward-rollback-published-reader-projection)
diagnostics.rollback_http_a: 'Git, the live ConfigMap and healthy status do not alone prove that every reader Pod serves the current data. Inspect each current owned Pod through localhost and its Service: decoded HTTP JSON must include the approved schema, generation and route. A stale mounted file can require propagation time; do not replace the retained reader program with a fabricated response. [Cause and check](guides#guide=gitops-delivery&section=forward-rollback-every-reader-publication)'
diagnostics.rollback_http_b: 'Git, the live ConfigMap and healthy status do not alone prove that every reader Pod serves the current data. Inspect each current owned Pod through localhost and its Service: decoded HTTP JSON must include the approved schema, generation and route. A stale mounted file can require propagation time; do not replace the retained reader program with a fabricated response. [Cause and check](guides#guide=gitops-delivery&section=forward-rollback-every-reader-publication)'
diagnostics.rollback_budget: A Git or Kubernetes command may exceed its remaining observer deadline, or the shared 14-second observer budget may expire before both reader lanes are observed. Verify current API/Git access and convergence before polling again; this named budget belongs to the observer and does not prove a particular configuration predicate failed. [Cause and check](guides#guide=gitops-delivery&section=forward-rollback-bounded-rollback-observation)
diagnostics.rollback_observation: The observer may fail to read the frozen contract, Git history, Kubernetes documents or projected reader data. Caught CLI errors, malformed JSON/YAML, missing fields and duplicate published resource identities use this marker; a failed baseline-ancestry command also arrives here. Inspect the actual inputs before changing objects based only on an unavailable observation. [Cause and check](guides#guide=gitops-delivery&section=forward-rollback-readable-rollback-inputs)
diagnostics.probe_0_5: The original health observer can reject desired/live resources or safety settings changed from the healthy Git baseline, incompatible liveness/startup probes, disagreement between desired and live behavior, a blocked rollout or missing north-95 response. It emits this fallback rather than finer markers. Later unlabelled startup, platform-input or unhandled document-shape errors can reach the same fallback; named rollback failures suppress it. Retain baseline resources and security while repairing readiness through Git. [Cause and check](guides#guide=gitops-delivery&section=forward-rollback-healthy-contract-and-early-fallback)
