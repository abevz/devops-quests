title: Argo rollback
brief: 'A private Git release introduced a bad readiness probe. Argo CD keeps reconciling
  it, so an isolated live rollback would be overwritten. Inspect healthy-commit and
  faulty-commit, then create and push a new Git revert on main. Keep the faulty commit
  in history, preserve automatic self-heal/prune, and record the new HEAD in release-commit.
  Restore the original healthy manifest and HTTP result. Do not reset or force-push
  history, disable GitOps or roll back only the Deployment.


  Quest files in `~/quest` (some appear in later stages): `application.json`, `healthy-commit`,
  `faulty-commit`, `release-commit`, `repository/manifests/board.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images
  and private services. Change only this bay.


  Initial success criteria: A new descendant commit restores the healthy manifest;
  Argo remains automated, Synced and Healthy, with north-95 over HTTP.'
debrief: Rollback was expressed as a forward change to desired state, retaining the
  faulty revision for investigation.
stages.0.brief: 'Success criteria: A new descendant commit restores the healthy manifest;
  Argo remains automated, Synced and Healthy, with north-95 over HTTP.'
stages.0.objectives.0.text: A new descendant commit restores the healthy manifest;
  Argo remains automated, Synced and Healthy, with north-95 over HTTP.
hints.0.text: Self-heal reconciles Git desired state, including mistakes.
hints.1.text: A revert records a new corrective commit and keeps incident history.
hints.2.text: Revert the frozen faulty commit, push main and verify the observed revision
  and health.
phrases.0: I restored desired state with a Git revert.
phrases.1: I kept reconciliation enabled during recovery.
phrases.2: I verified the observed revision and application health.
questions.0.points.0: The controller reapplies the Git desired state.
questions.0.points.1: Correct the source and verify the observed revision.
questions.0.prompt: Why can a live rollout undo be temporary under GitOps?
questions.1.points.0: The faulty commit remains reachable in the main history.
questions.1.points.1: The recovery is a reviewable new change.
questions.1.prompt: What does revert preserve that reset loses?
