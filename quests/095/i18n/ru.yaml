title: Откат Argo CD
brief: 'Релиз в приватном Git добавил ошибочный readiness probe. Argo CD продолжает его применять, поэтому
  отдельный live rollback будет перезаписан. Изучите healthy-commit и faulty-commit, создайте и отправьте
  новый Git revert в main. Сохраните ошибочный коммит в истории и автоматические self-heal/prune, запишите
  новый HEAD в release-commit. Восстановите исходный исправный манифест и HTTP. Не делайте reset/force-push
  истории, не отключайте GitOps и не ограничивайтесь rollback Deployment.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `application.json`, `healthy-commit`,
  `faulty-commit`, `release-commit`, `repository/manifests/board.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Новый коммит-потомок восстановил исправный манифест; автоматический Argo имеет Synced/Healthy,
  HTTP отдаёт north-95.'
debrief: Откат выражен новым изменением desired state, ошибочная ревизия сохранена для расследования.
