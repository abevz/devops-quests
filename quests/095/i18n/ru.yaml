title: Откат Argo CD
brief: 'Последний релиз из приватного Git неработоспособен. Восстановите известное исправное содержимое, сохранив
  историю инцидента.


  Работайте на workstation в `~/quest` с файлами `platform.env`, `application.yaml`, `healthy-commit`, `faulty-commit`,
  `release-commit`, `repository/`.


  Если не указано иное, ресурсы Kubernetes находятся в namespace песочницы (`DQ_NAMESPACE`); пути в `~/quest` —
  на workstation.


  **Requirements:**


  - Опубликованная `origin/main` совпадает с `release-commit` на workstation, отличается от замороженного faulty-коммита
  и сохраняет его как предка.

  - Application `board` сохраняет предоставленный приватный источник Git, ветку релиза и существующий каталог нагрузки.

  - Application `board` сообщает `Synced` и `Healthy` для коммита из `~/quest/release-commit` на workstation.

  - Deployment `board` завершает rollout в namespace песочницы.

  - Внутри Pod Deployment `board` адрес `http://board:8080` возвращает `north-95`.

  - Опубликованный файл Git `manifests/board.yaml` восстанавливает известную исправную конфигурацию нагрузки.


  Текущее содержимое Git и происхождение коммитов не доказывают, какая команда восстановления применялась.


  Дополнительные входные файлы: `rollback-contract.json`, `current-publication.json`, `consumer-baseline-commit`,
  `original-release-identities.json`, `repository/readers/`.


  Восстановите заведомо здоровую конфигурацию производителя и доставьте текущую одобренную публикацию существующим
  независимо закреплённым потребителям. Каждый потребитель должен сохранять привязку к неизменяемому коммиту опубликованного
  релиза. Сохраните идентичности исходных Application и Deployment, предоставленные образы и программы потребителей.
  Каждый принадлежащий им активный Pod и конечная точка Service должны обслуживать одобренную публикацию из управляемой
  Git проекции только для чтения. Сохраните зафиксированную исходную ревизию потребителей в истории Git.


  Эталоном является зафиксированная исходная запись; рабочие копии её не заменяют. Проверяется текущее состояние
  и история коммитов, а не использованные команды восстановления.'
debrief: Вы восстановили здоровую конфигурацию производителя и доставили текущую публикацию независимо закреплённым
  потребителям, сохранив их идентичности и историю Git.
stages.0.brief: Сохраните faulty-коммит в опубликованной истории.
hints.0.text: Здоровый исторический релиз производителя и текущие обязательства потребителей могут иметь разные
  сроки жизни. Восстановление одного не обновляет независимо закреплённых потребителей автоматически.
hints.1.text: Сопоставьте `rollback-contract.json`, `current-publication.json`, зафиксированные коммиты, манифесты
  потребителей, источники Application и наблюдаемые ревизии. Проследите публикацию через фактические принадлежащие
  им Pod и ответы Service.
hints.2.text: "Восстановите здоровую конфигурацию производителя, сохранив актуальную одобренную публикацию потребителей.\
  \ Сделайте commit и push, не отбрасывая инцидент и исходную ревизию потребителей. Обновите неизменяемую привязку\
  \ каждого существующего потребителя до опубликованного коммита, запросите обновление Application и дождитесь реального\
  \ применения проекции. Проверьте исходные UID и программы, наблюдаемые ревизии, готовность и HTTP каждого принадлежащего\
  \ потребителю Pod и Service.\n\nПроверьте каждый Pod, принадлежащий существующей цепочке Deployment/ReplicaSet,\
  \ затем каждый Service:\n\n```sh\nset -euo pipefail\nkubectl get applications board reader-a reader-b\nfor name\
  \ in reader-a reader-b; do\n  deployment_uid=$(kubectl get deployment \"$name\" -o jsonpath='{.metadata.uid}')\n\
  \  replica_uids=$(kubectl get replicasets -o json | jq -c --arg uid \"$deployment_uid\" '[.items[] | select(any(.metadata.ownerReferences[]?;\
  \ .kind==\"Deployment\" and .controller==true and .uid==$uid)) | .metadata.uid]')\n  kubectl get pods -o json\
  \ | jq -r --argjson owners \"$replica_uids\" '.items[] | select(.metadata.deletionTimestamp==null and .status.phase!=\"\
  Failed\" and .status.phase!=\"Succeeded\") | select(any(.metadata.ownerReferences[]?; .kind==\"ReplicaSet\" and\
  \ .controller==true and (.uid as $uid | $owners | index($uid)!=null))) | .metadata.name' |\n    while IFS= read\
  \ -r pod; do\n      kubectl exec \"$pod\" -c worker -- wget -qO- -T 3 http://127.0.0.1:8080\n    done\n  kubectl\
  \ exec \"deployment/$name\" -c worker -- wget -qO- -T 3 \"http://$name:8080\"\ndone\n```\n\nОжидаются Synced/Healthy\
  \ у всех Application и ответы обоих потребителей, соответствующие текущей одобренной публикации."
phrases.0: Я восстановил desired state через Git revert.
phrases.1: Я сохранил reconciliation при восстановлении.
phrases.2: Я проверил наблюдаемую ревизию и здоровье приложения.
questions.0.points.0: Контроллер вновь применяет desired state из Git.
questions.0.points.1: Исправьте источник и проверьте наблюдаемую ревизию.
questions.0.prompt: Почему live rollout undo может быть временным при GitOps?
questions.1.points.0: Ошибочный коммит остаётся в истории main.
questions.1.points.1: Восстановление становится отдельным проверяемым изменением.
questions.1.prompt: Что сохраняет revert в отличие от reset?
