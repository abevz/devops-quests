hints.0.text: Self-heal приводит к desired state из Git, включая ошибки.
hints.1.text: Revert создаёт исправляющий коммит и сохраняет историю инцидента.
hints.2.text: Отмените сохранённый ошибочный коммит, отправьте main и проверьте наблюдаемую revision и
