title: Откат Argo CD
brief: 'Последний релиз из приватного Git неработоспособен. Восстановите известное исправное содержимое, сохранив
  историю инцидента.


  Работайте на workstation в `~/quest` с файлами `platform.env`, `application.yaml`, `healthy-commit`, `faulty-commit`,
  `release-commit`, `repository/`.


  Если не указано иное, ресурсы Kubernetes находятся в namespace песочницы (`DQ_NAMESPACE`); пути в `~/quest` —
  на workstation.


  **Requirements:**


  - Опубликованная `origin/main` совпадает с `release-commit` на workstation, отличается от замороженного faulty-коммита
  и сохраняет его как предка.

  - Application `board` сохраняет предоставленный приватный источник Git, ветку релиза и существующий каталог нагрузки.

  - Application `board` сообщает `Synced` и `Healthy` для коммита из `~/quest/release-commit` на workstation.

  - Deployment `board` завершает rollout в namespace песочницы.

  - Внутри Pod Deployment `board` адрес `http://board:8080` возвращает `north-95`.

  - Опубликованный файл Git `manifests/board.yaml` восстанавливает известную исправную конфигурацию нагрузки.


  Текущее содержимое Git и происхождение коммитов не доказывают, какая команда восстановления применялась.


  Дополнительные входные файлы: `rollback-contract.json`, `current-publication.json`, `consumer-baseline-commit`,
  `original-release-identities.json`, `repository/readers/`.


  Восстановите заведомо здоровую конфигурацию производителя и доставьте текущую одобренную публикацию существующим
  независимо закреплённым потребителям. Каждый потребитель должен сохранять привязку к неизменяемому коммиту опубликованного
  релиза. Сохраните идентичности исходных Application и Deployment, предоставленные образы и программы потребителей.
  Каждый принадлежащий им активный Pod и конечная точка Service должны обслуживать одобренную публикацию из управляемой
  Git проекции только для чтения. Сохраните зафиксированную исходную ревизию потребителей в истории Git.


  Эталоном является зафиксированная исходная запись; рабочие копии её не заменяют. Проверяется текущее состояние
  и история коммитов, а не использованные команды восстановления.'
debrief: Вы восстановили здоровую конфигурацию производителя и доставили текущую публикацию независимо закреплённым
  потребителям, сохранив их идентичности и историю Git.
stages.0.brief: Сохраните faulty-коммит в опубликованной истории.
hints.0.text: Здоровый исторический релиз производителя и текущие обязательства потребителей могут иметь разные
  сроки жизни. Восстановление одного не обновляет независимо закреплённых потребителей автоматически.
hints.1.text: |-
  Сопоставьте `rollback-contract.json`, `current-publication.json`, зафиксированные коммиты, манифесты потребителей, источники Application и наблюдаемые ревизии. Проследите публикацию через фактические принадлежащие им Pod и ответы Service.

  Сравните записанные рабочие базовые версии производителя и потребителя с опубликованной ревизией. Для каждого сохранённого потребителя изучите закреплённую ревизию источника, смонтированную публикацию и цепочку владельцев приложения.
hints.2.text: |-
  Проверьте исходные UID и программы, наблюдаемые ревизии, готовность и HTTP каждого принадлежащего потребителю Pod и Service.

  Проверьте каждый Pod, принадлежащий существующей цепочке Deployment/ReplicaSet, затем каждый Service:

  ```sh
  (
    set -euo pipefail
    cd ~/quest
    source platform.env
    receipt=/run/dq/facts/0/rollback-contract.json
    revision=$(git -C repository ls-remote origin refs/heads/main | cut -f1)
    test -n "$revision"
    kubectl get applications board reader-a reader-b -o json |
      jq -e --arg revision "$revision" --slurpfile expected "$receipt" '
        def relative_parts: select(type=="string" and (startswith("/")|not)) | split("/") | map(select(.!="" and .!="."));
        ([.items[].metadata.name] | sort)==["board","reader-a","reader-b"] and
        all(.items[]; .metadata.name as $name |
          .metadata.uid==$expected[0].originalIdentities["application/"+$name] and
          .spec.source.repoURL==$expected[0].repoURL and
          .status.sync.revision==$revision and .status.sync.status=="Synced" and .status.health.status=="Healthy" and
          (if $name=="board" then true else
             ($expected[0].consumers[] | select(.name==$name)) as $supplied |
             (.spec.source.targetRevision | ascii_downcase)==$revision and
             (.spec.source.path | relative_parts)==($supplied.path | relative_parts) and
             .spec.project==$supplied.project and .spec.destination==$supplied.destination
           end))'
    verify_projection() {
      python3 -I - "$revision" "$receipt" "$1" "$2" <<'VERIFY_PROJECTION'
  import json
  import posixpath
  import subprocess
  import sys
  from pathlib import Path

  import yaml

  revision, receipt_path, name, pod = sys.argv[1:]
  receipt = json.loads(Path(receipt_path).read_text())
  profile = next(item for item in receipt["consumers"] if item["name"] == name)
  target = posixpath.join(profile["documentRoot"], "index.html")
  git = ["git", "-C", "repository"]
  paths = subprocess.check_output([*git, "ls-tree", "-r", "--name-only", revision, "--", profile["path"]], text=True).splitlines()

  def manifests(document):
      if isinstance(document, dict):
          if document.get("kind") == "List":
              for item in document.get("items", []):
                  yield from manifests(item)
          elif document.get("kind") in ("Deployment", "ConfigMap"):
              yield document

  published = {}
  for path in paths:
      if Path(path).suffix not in (".yaml", ".yml", ".json"):
          continue
      for root in yaml.safe_load_all(subprocess.check_output([*git, "show", revision + ":" + path])):
          for document in manifests(root):
              identity = document["kind"], document["metadata"]["name"]
              assert identity not in published
              published[identity] = document

  def get(kind, resource):
      return json.loads(subprocess.check_output(["kubectl", "get", kind, resource, "-o", "json"]))

  def binding(spec, data_for):
      worker = next(item for item in spec["containers"] if item["name"] == "worker")
      volumes = {volume["name"]: volume for volume in spec.get("volumes", [])}
      matches = []
      for mount in worker.get("volumeMounts", []):
          base = mount["mountPath"]
          subpath = mount.get("subPath")
          if subpath is not None and base != target:
              continue
          if subpath is None and not target.startswith(base.rstrip("/") + "/"):
              continue
          volume = volumes[mount["name"]]
          sources = [volume["configMap"]] if "configMap" in volume else [
              item["configMap"] for item in volume.get("projected", {}).get("sources", []) if "configMap" in item]
          for source in sources:
              data = data_for(source["name"])
              items = source.get("items", [{"key": key, "path": key} for key in data])
              for item in items:
                  path = base if subpath == item["path"] else None
                  if subpath is None:
                      path = posixpath.normpath(posixpath.join(base, item["path"]))
                  if path == target:
                      matches.append((source["name"], item["key"]))
      assert len(matches) == 1
      return matches[0]

  declared = published["Deployment", name]["spec"]["template"]["spec"]
  worker = next(container for container in declared["containers"] if container["name"] == "worker")
  assert {field: worker.get(field) for field in ("image", "command", "args")} == profile["program"]
  live = get("deployment", name)["spec"]["template"]["spec"]
  observed_pod = get("pod", pod)["spec"]
  published_map = lambda configmap: published["ConfigMap", configmap]["data"]
  live_map = lambda configmap: get("configmap", configmap)["data"]
  configmap, key = binding(declared, published_map)
  assert binding(live, live_map) == binding(observed_pod, live_map) == (configmap, key)
  published_data = published_map(configmap)
  assert live_map(configmap) == published_data
  mounted = subprocess.check_output(["kubectl", "exec", pod, "-c", "worker", "--", "cat", target], text=True)
  assert mounted == published_data[key]
  assert all(json.loads(mounted).get(key) == value for key, value in receipt["publication"].items())
  print(name + "/" + pod + ": Git, ConfigMap and mounted publication match")
  VERIFY_PROJECTION
    }
    for name in reader-a reader-b; do
      deployment=$(kubectl get deployment "$name" -o json)
      deployment_uid=$(jq -er .metadata.uid <<<"$deployment")
      program=$(jq -cer --arg name "$name" '.consumers[] | select(.name==$name) | .program' "$receipt")
      digest=$(jq -er '.image | split("@") | last | select(test("^sha256:[0-9a-f]{64}$"))' <<<"$program")
      jq -e --argjson program "$program" '
        any(.spec.template.spec.containers[]; .name=="worker" and ({image,command,args}==$program))
      ' <<<"$deployment" >/dev/null
      replicas=$(jq -er 'select(.spec.replicas>0 and .status.observedGeneration>=.metadata.generation and
        .status.readyReplicas==.spec.replicas) | .spec.replicas' <<<"$deployment")
      test "$deployment_uid" = "$(jq -er --arg name "$name" '.originalIdentities["deployment/"+$name]' "$receipt")"
      replica_uids=$(kubectl get replicasets -o json | jq -c --arg uid "$deployment_uid" '
        [.items[] | select(any(.metadata.ownerReferences[]?; .kind=="Deployment" and .controller==true and .uid==$uid)) | .metadata.uid]')
      pods=$(kubectl get pods -o json | jq -er --argjson owners "$replica_uids" --argjson replicas "$replicas" --argjson program "$program" --arg digest "$digest" '
        [.items[] | select(.metadata.deletionTimestamp==null and .status.phase!="Failed" and .status.phase!="Succeeded" and
          any(.metadata.ownerReferences[]?; .kind=="ReplicaSet" and .controller==true and (.uid as $uid | $owners | index($uid)!=null)))]
        | select(length==$replicas and all(.[]; .status.phase=="Running" and
            any(.status.conditions[]?; .type=="Ready" and .status=="True") and
            any(.spec.containers[]?; .name=="worker" and ({image,command,args}==$program)) and
            any(.status.containerStatuses[]?; .name=="worker" and .ready==true and (.state.running | type)=="object" and
              ((.imageID | split("@") | last | split("/") | last) == $digest))))
        | .[].metadata.name')
      matches_publication() {
        jq -e --slurpfile expected "$receipt" '
          . as $observed | all($expected[0].publication | to_entries[]; $observed[.key]==.value)'
      }
      while IFS= read -r pod; do
        verify_projection "$name" "$pod"
        kubectl exec "$pod" -c worker -- wget -qO- -T 3 http://127.0.0.1:8080 | matches_publication
      done <<<"$pods"
      kubectl exec "${pods%%$'\n'*}" -c worker -- wget -qO- -T 3 "http://$name:8080" | matches_publication
    done
  )
  ```

  Ожидаются Synced/Healthy у всех Application и ответы обоих потребителей, соответствующие текущей одобренной публикации.
phrases.0: Я восстановил desired state через Git revert.
phrases.1: Я сохранил reconciliation при восстановлении.
phrases.2: Я проверил наблюдаемую ревизию и здоровье приложения.
questions.0.points.0: Контроллер вновь применяет desired state из Git.
questions.0.points.1: Исправьте источник и проверьте наблюдаемую ревизию.
questions.0.prompt: Почему live rollout undo может быть временным при GitOps?
questions.1.points.0: Ошибочный коммит остаётся в истории main.
questions.1.points.1: Восстановление становится отдельным проверяемым изменением.
questions.1.prompt: Что сохраняет revert в отличие от reset?
stages.0.objectives.0.text: Опубликованная `origin/main` совпадает с `release-commit` на workstation, отличается
  от замороженного faulty-коммита и сохраняет его как предка.
stages.0.objectives.1.text: Application `board` сохраняет предоставленный приватный источник Git, ветку релиза и
  существующий каталог нагрузки.
stages.0.objectives.2.text: Application `board` сообщает `Synced` и `Healthy` для коммита из `~/quest/release-commit`
  на workstation.
stages.0.objectives.3.text: Deployment `board` завершает rollout в namespace песочницы.
stages.0.objectives.4.text: Внутри Pod Deployment `board` адрес `http://board:8080` возвращает `north-95`.
stages.0.objectives.5.text: Опубликованный файл Git `manifests/board.yaml` восстанавливает известную исправную конфигурацию
  нагрузки. Существующие закреплённые потребители применяют текущую одобренную публикацию с исходными программами
  и идентичностями. Их Pod и конечные точки Service согласованы с проекцией Git и текущими неизменяемыми привязками
  релиза.
diagnostics.rollback_head: Сброс main на здоровый коммит стирает требуемое присутствие faulty-commit в истории, а старый release-commit может указывать на faulty или прежний head. Отмените ошибочную правку новым коммитом, опубликуйте дальнейшее восстановление и обновите рабочую квитанцию до полученного origin/main. Ошибка входов, fetch или команды ancestry даёт тот же маркер. [Причина и проверка](guides#guide=gitops-delivery&section=forward-rollback-retained-faulty-history)
diagnostics.rollback_source: Перенаправление Application board в другой репозиторий, ветку или каталог обходит выданный источник восстановления. Сохраните выданный Git URL, main и относительный путь к manifests без перехода к родителю. Отсутствующий platform input, ошибка API или сравнения JSON дают тот же маркер. [Причина и проверка](guides#guide=gitops-delivery&section=forward-rollback-retained-main-source)
diagnostics.rollback_sync: Производитель может согласовывать ошибочную ревизию, иметь нездоровую readiness или выключенные self-healing/pruning. Исправьте Git-определение и дождитесь Synced и Healthy на текущем release-commit с обоими флагами true; это ещё не доказывает принятие новой публикации независимо закреплёнными reader Applications. [Причина и проверка](guides#guide=gitops-delivery&section=forward-rollback-reconciled-main-revision)
diagnostics.rollback_rollout: Выданная ошибочная readiness probe использует 8099, хотя сервер слушает 8080, поэтому rollout блокируется даже при синхронизации Git. Исправьте Git-определение через новые коммиты и изучите rollout/events; ошибка CLI или трёхсекундный предел наблюдения тоже нарушает условие. [Причина и проверка](guides#guide=gitops-delivery&section=forward-rollback-producer-rollout)
diagnostics.rollback_http: Синхронизированное Application может не иметь готового endpoint Service из-за ошибочной probe либо отдавать тело не north-95. Наблюдайте реальный endpoint board из его worker после восстановления; timeout или ошибка exec/HTTP тоже нарушает исходное сравнение. [Причина и проверка](guides#guide=gitops-delivery&section=forward-rollback-producer-http)
diagnostics.rollback_identity_board: Удаление и создание board, reader-a или reader-b сохраняет имя, но меняет зафиксированный UID Application либо Deployment. Исправляйте исходные объекты на месте; маркер идентичности указывает производителя или линию reader. Проверяется текущая идентичность, не непрерывная история. [Причина и проверка](guides#guide=gitops-delivery&section=forward-rollback-original-application-identities)
diagnostics.rollback_identity_a: Удаление и создание board, reader-a или reader-b сохраняет имя, но меняет зафиксированный UID Application либо Deployment. Исправляйте исходные объекты на месте; маркер идентичности указывает производителя или линию reader. Проверяется текущая идентичность, не непрерывная история. [Причина и проверка](guides#guide=gitops-delivery&section=forward-rollback-original-application-identities)
diagnostics.rollback_identity_b: Удаление и создание board, reader-a или reader-b сохраняет имя, но меняет зафиксированный UID Application либо Deployment. Исправляйте исходные объекты на месте; маркер идентичности указывает производителя или линию reader. Проверяется текущая идентичность, не непрерывная история. [Причина и проверка](guides#guide=gitops-delivery&section=forward-rollback-original-application-identities)
diagnostics.rollback_history: Полученный head может оставаться на раннем reader baseline либо производитель использовать другой репозиторий. Сохраните ancestry baseline и опубликуйте новый коммит с одобренными данными reader. Ошибка команды проверки ancestry даёт rollback_observation, а не этот маркер явного сравнения. [Причина и проверка](guides#guide=gitops-delivery&section=forward-rollback-forward-consumer-history)
diagnostics.rollback_source_a: Reader изначально закреплены на старом коммите, поэтому исправление производителя не меняет их ревизию. Опубликуйте одобренные manifests, закрепите каждое исходное reader Application на текущем полном Git commit, сохраните его путь, project и destination и дождитесь Synced и Healthy на этой ревизии; одного main для сравнения immutable pin недостаточно. [Причина и проверка](guides#guide=gitops-delivery&section=forward-rollback-current-reader-commit-pins)
diagnostics.rollback_source_b: Reader изначально закреплены на старом коммите, поэтому исправление производителя не меняет их ревизию. Опубликуйте одобренные manifests, закрепите каждое исходное reader Application на текущем полном Git commit, сохраните его путь, project и destination и дождитесь Synced и Healthy на этой ревизии; одного main для сравнения immutable pin недостаточно. [Причина и проверка](guides#guide=gitops-delivery&section=forward-rollback-current-reader-commit-pins)
diagnostics.rollback_delivery_a: Здоровый reader может исполнять исходную программу со старой публикацией. Сохраните image, command и args reader в Git, живом Deployment и каждом текущем принадлежащем Pod; завершите rollout и опубликуйте одобренный JSON ровно через одну совпадающую ConfigMap-проекцию в document root. Data Git и живого ConfigMap совпадают как полные maps, а декодированная публикация включает все одобренные значения. Допустимы эквивалентные прямые или projected ConfigMap-привязки. [Причина и проверка](guides#guide=gitops-delivery&section=forward-rollback-published-reader-projection)
diagnostics.rollback_delivery_b: Здоровый reader может исполнять исходную программу со старой публикацией. Сохраните image, command и args reader в Git, живом Deployment и каждом текущем принадлежащем Pod; завершите rollout и опубликуйте одобренный JSON ровно через одну совпадающую ConfigMap-проекцию в document root. Data Git и живого ConfigMap совпадают как полные maps, а декодированная публикация включает все одобренные значения. Допустимы эквивалентные прямые или projected ConfigMap-привязки. [Причина и проверка](guides#guide=gitops-delivery&section=forward-rollback-published-reader-projection)
diagnostics.rollback_http_a: 'Git, живой ConfigMap и здоровый статус не доказывают принятие данных каждым reader Pod. Проверьте каждый текущий принадлежащий Pod через localhost и его Service: HTTP JSON должен включать одобренные schema, generation и route. Старому mounted-файлу может требоваться время обновления; не заменяйте сохранённую программу reader поддельным ответом. [Причина и проверка](guides#guide=gitops-delivery&section=forward-rollback-every-reader-publication)'
diagnostics.rollback_http_b: 'Git, живой ConfigMap и здоровый статус не доказывают принятие данных каждым reader Pod. Проверьте каждый текущий принадлежащий Pod через localhost и его Service: HTTP JSON должен включать одобренные schema, generation и route. Старому mounted-файлу может требоваться время обновления; не заменяйте сохранённую программу reader поддельным ответом. [Причина и проверка](guides#guide=gitops-delivery&section=forward-rollback-every-reader-publication)'
diagnostics.rollback_budget: Команда Git или Kubernetes могла превысить остаток времени observer либо общий бюджет 14 секунд истёк до наблюдения обеих reader-линий. Проверьте API/Git и сходимость перед повторной проверкой; этот именованный бюджет относится к observer и не доказывает сбой конкретного предиката конфигурации. [Причина и проверка](guides#guide=gitops-delivery&section=forward-rollback-bounded-rollback-observation)
diagnostics.rollback_observation: Observer мог не прочитать зафиксированный контракт, историю Git, документы Kubernetes или projected-данные reader. Пойманные ошибки CLI, некорректный JSON/YAML, недостающие поля и дубликаты опубликованных resource identities дают этот маркер; сюда же попадает ошибка команды ancestry baseline. Изучите реальные входы до правок объектов по недоступному наблюдению. [Причина и проверка](guides#guide=gitops-delivery&section=forward-rollback-readable-rollback-inputs)
diagnostics.probe_0_5: Исходный health observer может отклонить desired/live ресурсы или безопасность, изменённые относительно здорового Git baseline, несовместимые liveness/startup probes, различия поведения desired/live, блокированный rollout либо отсутствие north-95. Он даёт этот fallback без более точных маркеров. Поздний сбой запуска, platform input или необработанная форма документа без имени дают тот же fallback; именованные rollback-сбои его подавляют. Сохраните ресурсы и безопасность baseline, исправляя readiness через Git. [Причина и проверка](guides#guide=gitops-delivery&section=forward-rollback-healthy-contract-and-early-fallback)
