title: Check mode limits
brief: |-
  The live fleet still serves the previous release. A preview and a verified deployment must have distinct evidence.

  Work on the workstation in `~/quest` with `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Requirements:**
  - Evidence on the workstation:
    - Nonempty file: `~/quest/check.log`.
    - Nonempty file: `~/quest/apply.log`.
  - Preview record on the workstation:
    - Path: `~/quest/check.log`.
    - `app1`, `app2`, `app3`: `changed>0`, `skipped>0`, `failed=0`.
  - File on every managed host (`app1`, `app2`, `app3`):
    - Path: `/srv/site/message`.
    - Content: `north-74`.
    - Access mode: `0644`.
  - Live service on every managed host (`app1`, `app2`, `app3`):
    - HTTP: `8080`, `/`.
    - Response: `north-74`.

  A preview predicts changes; it does not prove that a live reload occurred.
debrief: A predicted change was followed by a verified real deployment.
stages.0.brief: Preview evidence and the live deployment must satisfy their separate result contracts.
stages.0.objectives.0.text: 'Nonempty evidence on the workstation: `check.log`, `apply.log`.'
stages.0.objectives.1.text: The workstation `check.log` reports predicted changes, skipped tasks and `failed=0`
  for `app1`, `app2`, `app3`.
stages.0.objectives.2.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` contains
  `north-74`.
stages.0.objectives.3.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` has mode
  `0644`.
stages.0.objectives.4.text: HTTP on port `8080` returns `north-74` on every managed host (`app1`, `app2`,
  `app3`).
hints.0.text: Check mode is a prediction, not an alternative deployment.
hints.1.text: |-
  Inspect skipped command tasks in the recap.

  Inspect the inventory and the supplied playbook on the workstation:

  ```sh
  ansible-inventory -i inventory.ini --graph
  cat rollout.yml
  ```
hints.2.text: |-
  Verify the result from `~/quest` on the workstation:

  - `cat ~/quest/check.log ~/quest/apply.log` — Both records are nonempty; `check.log` has predicted changes, skipped tasks and `failed=0` for all three hosts.
  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'cat /srv/site/message; ls -l /srv/site/message'` — Every host shows `north-74` and `-rw-r--r--`.
  - `for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done` — Shows `north-74` from `app1`, `app2`, `app3`.
phrases.0: I identified check-mode gaps in command tasks and handlers.
phrases.1: I reviewed the diff before executing changes.
phrases.2: I verified managed files and actual HTTP behavior.
