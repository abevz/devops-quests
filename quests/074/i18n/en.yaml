title: Check mode limits
brief: "The live fleet still serves the previous release. A preview and a verified deployment must have distinct\
  \ evidence.\n\nWork on the workstation in `~/quest` with `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n\n**Requirements:**\n\
  - Evidence on the workstation:\n  - Nonempty file: `~/quest/check.log`.\n  - Nonempty file: `~/quest/apply.log`.\n\
  - Preview record on the workstation:\n  - Path: `~/quest/check.log`.\n  - `app1`, `app2`, `app3`: `changed>0`,\
  \ `skipped>0`, `failed=0`.\n- File on every managed host (`app1`, `app2`, `app3`):\n  - Path: `/srv/site/message`.\n\
  \  - Content: `north-74`.\n  - Access mode: `0644`.\n- Live service on every managed host (`app1`, `app2`, `app3`):\n\
  \  - HTTP: `8080`, `/`.\n  - Response: `north-74`.\n- Construct the current deployment program for the caller\
  \ interface in workstation `~/quest/caller-contract.json`; `caller-cache.py` models a local consumer refresh.\
  \ A pending preview must predict changes and skip unsupported inspection without changing live data, its cache\
  \ or other caller inputs. Applying must deliver the caller’s release and refresh its consumer. A converged preview\
  \ must report no changes, still skip unsupported inspection and leave data unchanged.\n\nA preview predicts changes;\
  \ it does not prove that a live reload occurred."
debrief: You built a deployment whose forecasts, actual consumer refresh and convergence agree, preserving data
  during both previews.
stages.0.brief: Preview evidence and the live deployment must satisfy their separate result contracts.
stages.0.objectives.0.text: 'Nonempty evidence on the workstation: `check.log`, `apply.log`.'
stages.0.objectives.1.text: The workstation `check.log` reports predicted changes, skipped tasks and `failed=0`
  for `app1`, `app2`, `app3`. The stored preview record and the current program satisfy pending preview, application
  and converged preview outcomes from the caller contract.
stages.0.objectives.2.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` contains `north-74`.
stages.0.objectives.3.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` has mode `0644`.
stages.0.objectives.4.text: HTTP on port `8080` returns `north-74` on every managed host (`app1`, `app2`, `app3`).
hints.0.text: A truthful preview must predict work while respecting side-effect boundaries. The same program must
  also deploy and converge.
hints.1.text: Compare `rollout.yml`, `caller-contract.json` and the supplied consumer adapter. Trace the delivery,
  inspection and refresh operations in preview and normal execution; compare their actual effects with recap counters.
hints.2.text: 'Construct delivery and its refresh notification using the supplied caller inputs; keep unsupported
  inspection skipped in check mode. Verify `ansible-playbook --check --diff rollout.yml` before applying, record
  the pending preview in `check.log` and the normal run in `apply.log`, and compare live responses. Repeat the preview
  after deployment: expect `changed=0`, `skipped>0`, `failed=0` and unchanged data. A forced command handler must
  not modify the cache during preview.'
phrases.0: I identified check-mode gaps in command tasks and handlers.
phrases.1: I reviewed the diff before executing changes.
phrases.2: I verified managed files and actual HTTP behavior.
diagnostics.check_log: The preview may not have been captured or check.log may be empty; retain the output of the check-mode run separately from application. [Cause and check](guides#guide=ansible-4&section=preview-retain-nonempty-check-log)
diagnostics.apply_log: The apply run may not have been captured or apply.log may be empty; retain its execution output. This file condition checks nonempty output rather than an apply recap. [Cause and check](guides#guide=ansible-4&section=preview-retain-nonempty-apply-log)
diagnostics.preview_recaps: The supplied inspection-only play predicts no delivery; each host needs a check recap with predicted changes, skipped tasks and failed=0. Missing or malformed recaps also fail. [Cause and check](guides#guide=ansible-4&section=preview-every-host-predicts-changes-and-skips)
diagnostics.probe_0_1: The early 8s recap group may time out before a marker, or the replay helper may fail before starting its guarded child; inspect startup/imports and distinguish named replay errors. [Cause and check](guides#guide=ansible-4&section=preview-legacy-timeout-and-helper-startup)
diagnostics.preview_effects: Hardcoded paths/releases, check-mode mutations or a missing cache handler can fail replay; accept caller inputs, leave preview files unchanged, deliver and refresh on apply, then converge to zero predicted changes. [Cause and check](guides#guide=ansible-4&section=preview-parameterized-three-phase-replay)
diagnostics.caller_original: The legacy caller-input guard concerns unavailable or changed retained inputs; its selected file list is empty in this quest, so ordinary replay failures use effects, observation or budget diagnostics. [Cause and check](guides#guide=ansible-4&section=preview-retained-caller-input-guard)
diagnostics.caller_observation: The child replay may fail to run Ansible or read its local files/cache adapter before it prints an accepted marker; inner command timeouts can also return this observation failure. [Cause and check](guides#guide=ansible-4&section=preview-child-replay-observation-errors)
diagnostics.caller_budget: The outer replay process may exceed its 14s budget; inspect blocking Ansible operations. An inner timeout returned before that deadline instead reaches the observation diagnostic. [Cause and check](guides#guide=ansible-4&section=preview-outer-fourteen-second-budget)
diagnostics.content_1: app1 may still contain previous-74 because the supplied play only inspects; deliver the declared release to /srv/site/message, and check SSH/file access if reading failed. [Cause and check](guides#guide=ansible-4&section=preview-host-1-delivered-file)
diagnostics.mode_1: app1 may have a different file mode or stat/SSH failed; retain mode 644 on /srv/site/message while repairing delivery. [Cause and check](guides#guide=ansible-4&section=preview-host-1-delivered-mode)
diagnostics.http_1: app1 may still serve its old cache after the file changes; notify the supplied reload handler on apply and verify actual HTTP, including transport availability. [Cause and check](guides#guide=ansible-4&section=preview-host-1-notified-cache-refresh)
diagnostics.content_2: app2 may still contain previous-74 because the supplied play only inspects; deliver the declared release to /srv/site/message, and check SSH/file access if reading failed. [Cause and check](guides#guide=ansible-4&section=preview-host-2-delivered-file)
