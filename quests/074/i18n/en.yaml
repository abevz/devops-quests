title: Check mode limits
brief: 'The playbook describes north-74, while all three targets still serve the previous
  release. Run ansible-playbook --check --diff rollout.yml > check.log first. Notice
  that command tasks and handlers without check-mode support are skipped: this predicts
  a change but does not prove a reload occurred. Then run the real playbook into apply.log
  and verify files, permissions and HTTP on every target. Do not remove the read-only
  cat /run/quest-service.pid task.


  Quest files in `~/quest` (some appear in later stages): `inventory.ini`, `ansible.cfg`,
  `rollout.yml`, `check.log`, `apply.log`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images
  and private services. Change only this bay.


  Initial success criteria: The check report predicts changes and skipped commands;
  the real run delivers north-74 at mode 0644 and all three HTTP endpoints agree.'
debrief: A predicted change was followed by a verified real deployment.
