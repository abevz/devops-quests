  und konvergierte Vorschau des Aufrufervertrags.'
diagnostics.preview_effects: Das aktuelle Programm besteht ausstehende Vorschau, Anwendung oder konvergierte Vorschau
  nicht. Vergleiche tatsächliche Datei- und Cache-Effekte mit den gemeldeten Änderungen.
