title: Überprüfen Sie die Modusgrenzen
brief: 'playbook beschreibt north-74, während alle drei Ziele weiterhin die vorherige Version bedienen.
  Führen Sie zuerst ansible-playbook --check --diff rollout.yml > check.log aus. Beachten Sie, dass command-Aufgaben
  und handlers ohne Prüfmodus-Unterstützung übersprungen werden: Dies sagt eine Änderung voraus, beweist
  jedoch nicht, dass ein reload aufgetreten ist. Führen Sie dann den echten playbook in apply.log aus
  und überprüfen Sie Dateien, Berechtigungen und HTTP auf jedem Ziel. Entfernen Sie nicht die schreibgeschützte
  Aufgabe cat /run/quest-service.pid.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `inventory.ini`, `ansible.cfg`, `rollout.yml`,
  `check.log`, `apply.log`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: Der Check report sagt Änderungen und übersprungene Befehle voraus; Der reale
  Lauf liefert north-74 im Modus 0644 und alle drei HTTP endpoints stimmen überein.'
debrief: Auf eine vorhergesagte Änderung folgte ein verifizierter realer Einsatz.
stages.0.brief: 'Erfolgskriterien: Der Check report sagt Änderungen und übersprungene Befehle voraus;
  Der reale Lauf liefert north-74 im Modus 0644 und alle drei HTTP endpoints stimmen überein.'
stages.0.objectives.0.text: Der Check report sagt Änderungen und übersprungene Befehle voraus; Der reale
  Lauf liefert north-74 im Modus 0644 und alle drei HTTP endpoints stimmen überein.
hints.0.text: Der Prüfmodus ist eine Vorhersage, keine alternative Bereitstellung.
hints.1.text: Überprüfen Sie das übersprungene command tasks im recap.
hints.2.text: Führen Sie den echten playbook aus, nachdem Sie den diff überprüft haben, und testen Sie
  dann jeden Live-endpoint.
phrases.0: Ich habe Lücken im Prüfmodus in den Aufgaben command und handlers identifiziert.
phrases.1: Ich habe den diff überprüft, bevor ich Änderungen vorgenommen habe.
phrases.2: Ich habe die verwalteten Dateien und das tatsächliche HTTP-Verhalten überprüft.
