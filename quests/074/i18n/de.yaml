title: Überprüfen Sie die Modusgrenzen
brief: "Die laufende Flotte liefert noch die vorherige Version aus. Vorschau und überprüfte Bereitstellung benötigen\
  \ getrennte Nachweise.\n\nArbeite auf der Workstation in `~/quest` mit `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n\
  \n**Anforderungen:**\n- Nachweise auf der Workstation:\n  - Nicht leere Datei: `~/quest/check.log`.\n  - Nicht\
  \ leere Datei: `~/quest/apply.log`.\n- Vorschauprotokoll auf der Workstation:\n  - Pfad: `~/quest/check.log`.\n\
  \  - `app1`, `app2`, `app3`: `changed>0`, `skipped>0`, `failed=0`.\n- Datei auf jedem verwalteten Host (`app1`,\
  \ `app2`, `app3`):\n  - Pfad: `/srv/site/message`.\n  - Inhalt: `north-74`.\n  - Zugriffsmodus: `0644`.\n- Aktiver\
  \ Dienst auf jedem verwalteten Host (`app1`, `app2`, `app3`):\n  - HTTP: `8080`, `/`.\n  - Antwort: `north-74`.\n\
  - Erstelle das aktuelle Bereitstellungsprogramm für die Aufruferschnittstelle in `~/quest/caller-contract.json`\
  \ auf der Workstation; `caller-cache.py` modelliert die Aktualisierung eines lokalen Verbrauchers. Eine Vorschau\
  \ anstehender Änderungen muss Änderungen vorhersagen und nicht unterstützte Inspektion überspringen, ohne Live-Daten,\
  \ Cache oder andere Aufrufereingaben zu ändern. Die Anwendung liefert die gewünschte Version und aktualisiert\
  \ den Verbraucher. Eine konvergierte Vorschau meldet keine Änderungen, überspringt weiterhin die Inspektion und\
  \ bewahrt die Daten.\n\nEine Vorschau sagt Änderungen voraus; sie beweist nicht, dass ein aktiver Dienst neu geladen\
  \ wurde."
debrief: Du hast eine Bereitstellung erstellt, deren Vorhersagen, Verbraucheraktualisierung und Konvergenz übereinstimmen
  und die Daten in beiden Vorschauen bewahrt.
stages.0.brief: Vorschaunachweis und laufende Bereitstellung müssen ihre getrennten Ergebnisanforderungen erfüllen.
stages.0.objectives.0.text: 'Nicht leere Nachweise auf der Workstation: `check.log`, `apply.log`.'
stages.0.objectives.1.text: Die Workstation-Datei `check.log` meldet vorhergesagte Änderungen, übersprungene Aufgaben
  und `failed=0` für `app1`, `app2`, `app3`. Der gespeicherte Vorschau-Beleg und das aktuelle Programm erfüllen
  die Ergebnisse für ausstehende Vorschau, Anwendung und konvergierte Vorschau des Aufrufervertrags.
stages.0.objectives.2.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/message` den
  Inhalt `north-74`.
stages.0.objectives.3.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) hat `/srv/site/message` den Modus
  `0644`.
stages.0.objectives.4.text: HTTP auf Port `8080` liefert auf jedem verwalteten Host (`app1`, `app2`, `app3`) `north-74`.
hints.0.text: Eine wahrheitsgemäße Vorschau sagt Arbeit voraus und respektiert Grenzen von Nebenwirkungen. Dasselbe
  Programm muss bereitstellen und konvergieren.
hints.1.text: Vergleiche `rollout.yml`, `caller-contract.json` und den bereitgestellten Verbraucheradapter. Verfolge
  Auslieferung, Inspektion und Aktualisierung in Vorschau und normalem Lauf; vergleiche tatsächliche Effekte mit
  den Zählern.
hints.2.text: 'Erstelle Auslieferung und Aktualisierungsbenachrichtigung anhand der Aufrufereingaben; nicht unterstützte
  Inspektion bleibt im Check-Modus übersprungen. Prüfe `ansible-playbook --check --diff rollout.yml` vor der Anwendung,
  speichere die anstehende Vorschau in `check.log` und den normalen Lauf in `apply.log`, und vergleiche Live-Antworten.
  Wiederhole die Vorschau nach der Bereitstellung: erwartet werden `changed=0`, `skipped>0`, `failed=0` und unveränderte
  Daten. Ein erzwungener Befehlshandler darf den Cache in der Vorschau nicht ändern.'
phrases.0: Ich habe Lücken im Prüfmodus in den Aufgaben command und handlers identifiziert.
phrases.1: Ich habe den diff überprüft, bevor ich Änderungen vorgenommen habe.
phrases.2: Ich habe die verwalteten Dateien und das tatsächliche HTTP-Verhalten überprüft.
diagnostics.check_log: Die Vorschau wurde möglicherweise nicht aufgezeichnet oder check.log ist leer; erhalten Sie die Check-Mode-Ausgabe getrennt von der Anwendung. [Ursache und Prüfung](guides#guide=ansible-4&section=preview-retain-nonempty-check-log)
diagnostics.apply_log: Die Anwendung wurde möglicherweise nicht aufgezeichnet oder apply.log ist leer; erhalten Sie die Ausführungsausgabe. Diese Bedingung prüft nichtleere Ausgabe statt eines Anwendungs-Recaps. [Ursache und Prüfung](guides#guide=ansible-4&section=preview-retain-nonempty-apply-log)
diagnostics.preview_recaps: Das gelieferte Play beobachtet nur und sagt keine Zustellung voraus; jeder Host benötigt einen Check-Recap mit vorhergesagten Änderungen, übersprungenen Aufgaben und failed=0. Fehlende oder ungültige Recaps scheitern ebenfalls. [Ursache und Prüfung](guides#guide=ansible-4&section=preview-every-host-predicts-changes-and-skips)
diagnostics.probe_0_1: Die frühe Recap-Gruppe mit 8s Limit kann vor einem Marker auslaufen oder der Replay-Helper scheitert vor seinem geschützten Kindprozess; prüfen Sie Start/Imports und unterscheiden Sie benannte Replay-Fehler. [Ursache und Prüfung](guides#guide=ansible-4&section=preview-legacy-timeout-and-helper-startup)
diagnostics.preview_effects: Feste Pfade/Release, Check-Mode-Änderungen oder fehlender Cache-Handler können das Replay verletzen; übernehmen Sie Caller-Eingaben, erhalten Sie Vorschau-Dateien unverändert, liefern und aktualisieren Sie bei apply, dann konvergieren Sie auf null vorhergesagte Änderungen. [Ursache und Prüfung](guides#guide=ansible-4&section=preview-parameterized-three-phase-replay)
diagnostics.caller_original: Der alte Caller-Eingaben-Guard betrifft unzugängliche oder geänderte erhaltene Eingaben; seine Dateiliste ist hier leer, daher verwenden normale Replay-Fehler effects, observation oder budget Diagnosen. [Ursache und Prüfung](guides#guide=ansible-4&section=preview-retained-caller-input-guard)
diagnostics.caller_observation: Der Kindprozess kann vor einem akzeptierten Marker beim Ansible-Start oder Lesen lokaler Dateien/Cache-Adapter scheitern; innere Befehlszeitlimits können ebenfalls diesen Beobachtungsfehler ergeben. [Ursache und Prüfung](guides#guide=ansible-4&section=preview-child-replay-observation-errors)
diagnostics.caller_budget: Der äußere Replay-Prozess kann sein 14s Budget überschreiten; prüfen Sie blockierende Ansible-Vorgänge. Ein früher zurückgekehrtes inneres Zeitlimit ergibt stattdessen die Beobachtungsdiagnose. [Ursache und Prüfung](guides#guide=ansible-4&section=preview-outer-fourteen-second-budget)
diagnostics.content_1: app1 enthält möglicherweise previous-74, da das gelieferte Play nur beobachtet; liefern Sie nach /srv/site/message und prüfen Sie bei Lesefehlern SSH/Dateizugriff. [Ursache und Prüfung](guides#guide=ansible-4&section=preview-host-1-delivered-file)
diagnostics.mode_1: app1 hat möglicherweise einen anderen Dateimodus oder stat/SSH scheitert; erhalten Sie mode 644 für /srv/site/message bei Zustellungsreparatur. [Ursache und Prüfung](guides#guide=ansible-4&section=preview-host-1-delivered-mode)
diagnostics.http_1: app1 liefert möglicherweise nach Dateiänderung noch den alten Cache; benachrichtigen Sie den gelieferten Reload-Handler bei apply und prüfen Sie tatsächliches HTTP samt Transport. [Ursache und Prüfung](guides#guide=ansible-4&section=preview-host-1-notified-cache-refresh)
