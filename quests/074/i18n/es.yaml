title: Comprobar límites del modo
brief: 'playbook describe north-74, mientras que los tres objetivos aún sirven a la versión anterior.
  Ejecute ansible-playbook --check --diff rollout.yml > check.log primero. Tenga en cuenta que las tareas
  command y handlers sin compatibilidad con el modo de verificación se omiten: esto predice un cambio
  pero no prueba que se haya producido un reload. Luego ejecute el playbook real en apply.log y verifique
  los archivos, los permisos y el HTTP en cada objetivo. No elimine la tarea de solo lectura cat /run/quest-service.pid.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `inventory.ini`, `ansible.cfg`,
  `rollout.yml`, `check.log`, `apply.log`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: la verificación report predice cambios y comandos omitidos; la ejecución
  real entrega north-74 en el modo 0644 y los tres HTTP endpoints están de acuerdo.'
debrief: A un cambio previsto le siguió un despliegue real verificado.
