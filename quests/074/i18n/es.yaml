title: Comprobar límites del modo
brief: "La flota sigue sirviendo la versión anterior. La vista previa y el despliegue verificado necesitan evidencias\
  \ separadas.\n\nTrabaja en la workstation en `~/quest` con `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n\n\
  **Requisitos:**\n- Evidencia en la workstation:\n  - Archivo no vacío: `~/quest/check.log`.\n  - Archivo no vacío:\
  \ `~/quest/apply.log`.\n- Registro de vista previa en la workstation:\n  - Ruta: `~/quest/check.log`.\n  - `app1`,\
  \ `app2`, `app3`: `changed>0`, `skipped>0`, `failed=0`.\n- Archivo en cada host administrado (`app1`, `app2`,\
  \ `app3`):\n  - Ruta: `/srv/site/message`.\n  - Contenido: `north-74`.\n  - Modo de acceso: `0644`.\n- Servicio\
  \ activo en cada host administrado (`app1`, `app2`, `app3`):\n  - HTTP: `8080`, `/`.\n  - Respuesta: `north-74`.\n\
  - Construye el programa actual de despliegue para la interfaz del invocador de `~/quest/caller-contract.json`\
  \ en la estación de trabajo; `caller-cache.py` modela la actualización de un consumidor local. La vista previa\
  \ pendiente debe predecir cambios y omitir la inspección no compatible sin modificar datos activos, caché u otras\
  \ entradas del invocador. La aplicación debe entregar la versión solicitada y actualizar al consumidor. Una vista\
  \ previa convergida debe informar ausencia de cambios, seguir omitiendo la inspección y conservar los datos.\n\
  \nUna vista previa predice cambios; no demuestra que se haya recargado el servicio activo."
debrief: Construiste un despliegue cuyas predicciones, actualización del consumidor y convergencia coinciden, conservando
  datos en ambas vistas previas.
stages.0.brief: La evidencia de vista previa y el despliegue activo deben cumplir sus contratos de resultado separados.
stages.0.objectives.0.text: 'Evidencia no vacía en la workstation: `check.log`, `apply.log`.'
stages.0.objectives.1.text: El archivo `check.log` de la workstation informa cambios previstos, tareas omitidas
  y `failed=0` para `app1`, `app2`, `app3`. El registro guardado y el programa actual cumplen los resultados de
  vista previa pendiente, aplicación y vista previa convergida del contrato del invocador.
stages.0.objectives.2.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` contiene `north-74`.
stages.0.objectives.3.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` tiene el modo
  `0644`.
stages.0.objectives.4.text: HTTP en el puerto `8080` devuelve `north-74` en cada host administrado (`app1`, `app2`,
  `app3`).
hints.0.text: Una vista previa fiel predice trabajo respetando los límites de efectos secundarios. El mismo programa
  debe desplegar y converger.
hints.1.text: Compara `rollout.yml`, `caller-contract.json` y el adaptador de consumidor proporcionado. Sigue entrega,
  inspección y actualización en vista previa y ejecución normal; compara sus efectos reales con los contadores.
hints.2.text: 'Construye entrega y notificación de actualización usando las entradas del invocador; mantén omitida
  la inspección no compatible en modo de comprobación. Verifica `ansible-playbook --check --diff rollout.yml` antes
  de aplicar, guarda la vista previa pendiente en `check.log` y la ejecución normal en `apply.log`, y compara respuestas
  activas. Repite la vista previa tras desplegar: espera `changed=0`, `skipped>0`, `failed=0` y datos sin cambios.
  Un handler de órdenes forzado no debe modificar la caché durante la vista previa.'
phrases.0: Identifiqué lagunas en el modo de verificación en las tareas command y handlers.
phrases.1: Revisé el diff antes de ejecutar cambios.
phrases.2: Verifiqué los archivos administrados y el comportamiento real de HTTP.
diagnostics.check_log: El preview puede no capturarse o check.log estar vacío; conserve salida check-mode separada de aplicación. [Causa y comprobación](guides#guide=ansible-4&section=preview-retain-nonempty-check-log)
diagnostics.apply_log: La aplicación puede no capturarse o apply.log estar vacío; conserve salida de ejecución. Este requisito comprueba salida no vacía, no recap de aplicación. [Causa y comprobación](guides#guide=ansible-4&section=preview-retain-nonempty-apply-log)
diagnostics.preview_recaps: El play suministrado solo observa y no prevé entrega; cada host necesita check recap con cambios previstos, tareas omitidas y failed=0. Recaps ausentes o inválidos también fallan. [Causa y comprobación](guides#guide=ansible-4&section=preview-every-host-predicts-changes-and-skips)
diagnostics.probe_0_1: El grupo recap inicial de 8s puede agotarse sin marcador o el helper fallar antes del hijo protegido; revise inicio/imports y distinga errores de repetición nombrados. [Causa y comprobación](guides#guide=ansible-4&section=preview-legacy-timeout-and-helper-startup)
diagnostics.preview_effects: Rutas/versión fijas, mutaciones check-mode o falta de handler caché fallan repetición; acepte entradas caller, no cambie archivos en preview, entregue y actualice caché en apply, luego converja a cero cambios previstos. [Causa y comprobación](guides#guide=ansible-4&section=preview-parameterized-three-phase-replay)
diagnostics.caller_original: El guard antiguo de entradas caller corresponde a entradas retenidas inaccesibles o cambiadas; su lista de archivos está vacía aquí, por lo que fallos ordinarios usan effects, observation o budget. [Causa y comprobación](guides#guide=ansible-4&section=preview-retained-caller-input-guard)
diagnostics.caller_observation: El hijo puede fallar al ejecutar Ansible o leer archivos/adaptador caché antes de marcador aceptado; tiempos de comandos internos también pueden dar fallo de observación. [Causa y comprobación](guides#guide=ansible-4&section=preview-child-replay-observation-errors)
diagnostics.caller_budget: El proceso externo de repetición puede superar 14s; revise operaciones Ansible bloqueadas. Un tiempo interno devuelto antes usa diagnóstico de observación. [Causa y comprobación](guides#guide=ansible-4&section=preview-outer-fourteen-second-budget)
diagnostics.content_1: app1 puede conservar previous-74 porque el play solo observa; entregue versión a /srv/site/message y revise SSH/lectura si falla. [Causa y comprobación](guides#guide=ansible-4&section=preview-host-1-delivered-file)
diagnostics.mode_1: app1 puede tener otro modo o fallar stat/SSH; conserve mode 644 en /srv/site/message al reparar entrega. [Causa y comprobación](guides#guide=ansible-4&section=preview-host-1-delivered-mode)
diagnostics.http_1: app1 puede servir caché antiguo tras cambiar archivo; notifique reload-handler suministrado en apply y verifique HTTP real y transporte. [Causa y comprobación](guides#guide=ansible-4&section=preview-host-1-notified-cache-refresh)
diagnostics.content_2: app2 puede conservar previous-74 porque el play solo observa; entregue versión a /srv/site/message y revise SSH/lectura si falla. [Causa y comprobación](guides#guide=ansible-4&section=preview-host-2-delivered-file)
diagnostics.mode_2: app2 puede tener otro modo o fallar stat/SSH; conserve mode 644 en /srv/site/message al reparar entrega. [Causa y comprobación](guides#guide=ansible-4&section=preview-host-2-delivered-mode)
diagnostics.http_2: app2 puede servir caché antiguo tras cambiar archivo; notifique reload-handler suministrado en apply y verifique HTTP real y transporte. [Causa y comprobación](guides#guide=ansible-4&section=preview-host-2-notified-cache-refresh)
