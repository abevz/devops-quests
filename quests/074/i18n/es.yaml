title: Comprobar límites del modo
brief: |-
  La flota sigue sirviendo la versión anterior. La vista previa y el despliegue verificado necesitan evidencias separadas.

  Trabaja en la workstation en `~/quest` con `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Requisitos:**
  - Entrega e inspección de servicio configuradas:
    - Alcance: `app1`, `app2`, `app3`.
    - La inspección de servicio solo lee `/run/quest-service.pid` en cada host, no informa cambios ni se fuerza durante la vista previa.
    - La entrega actualiza el banner activo.
  - Evidencia en la workstation:
    - Archivo no vacío: `~/quest/check.log`.
    - Archivo no vacío: `~/quest/apply.log`.
  - Registro de vista previa en la workstation:
    - Ruta: `~/quest/check.log`.
    - `app1`, `app2`, `app3`: `changed>0`, `skipped>0`, `failed=0`.
  - Archivo en cada host administrado (`app1`, `app2`, `app3`):
    - Ruta: `/srv/site/message`.
    - Contenido: `north-74`.
    - Modo de acceso: `0644`.
  - Servicio activo en cada host administrado (`app1`, `app2`, `app3`):
    - HTTP: `8080`, `/`.
    - Respuesta: `north-74`.

  **Verifica antes de Check & finish:**
  - `cat ~/quest/check.log ~/quest/apply.log` — Ambos registros contienen datos; `check.log` muestra cambios previstos, tareas omitidas y `failed=0` para los tres hosts.
  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'cat /srv/site/message; ls -l /srv/site/message'` — Cada host muestra `north-74` y `-rw-r--r--`.
  - `for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done` — Muestra `north-74` de `app1`, `app2`, `app3`.

  Una vista previa predice cambios; no demuestra que se haya recargado el servicio activo.
debrief: A un cambio previsto le siguió un despliegue real verificado.
stages.0.brief: La evidencia de vista previa y el despliegue activo deben cumplir sus contratos de resultado separados.
stages.0.objectives.0.text: La entrega a la flota conserva una inspección de servicio de solo lectura que no informa
  cambios ni se fuerza durante la vista previa, con actualización del banner activo tras la entrega.
stages.0.objectives.1.text: 'Evidencia no vacía en la workstation: `check.log`, `apply.log`.'
stages.0.objectives.2.text: El archivo `check.log` de la workstation informa cambios previstos, tareas omitidas
  y `failed=0` para `app1`, `app2`, `app3`.
stages.0.objectives.3.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` contiene `north-74`.
stages.0.objectives.4.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` tiene el modo
  `0644`.
stages.0.objectives.5.text: HTTP en el puerto `8080` devuelve `north-74` en cada host administrado (`app1`, `app2`,
  `app3`).
hints.0.text: El modo de verificación es una predicción, no una implementación alternativa.
hints.1.text: Inspeccione el command tasks omitido en el recap.
hints.2.text: Ejecute el playbook real después de revisar el diff, luego pruebe cada endpoint en vivo. Guarda primero
  `ansible-playbook --check --diff rollout.yml > check.log` y después la ejecución real con `ansible-playbook rollout.yml
  > apply.log`. Conserva la tarea de solo lectura `cat /run/quest-service.pid`; las tareas command sin soporte de
  check mode se omiten en la vista previa.
phrases.0: Identifiqué lagunas en el modo de verificación en las tareas command y handlers.
phrases.1: Revisé el diff antes de ejecutar cambios.
phrases.2: Verifiqué los archivos administrados y el comportamiento real de HTTP.
