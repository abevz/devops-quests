title: Пределы check mode
brief: 'Playbook описывает north-74, но три цели ещё отдают прежний релиз. Сначала
  выполните ansible-playbook --check --diff rollout.yml > check.log. Обратите внимание:
  command и handlers без поддержки check mode пропускаются; прогноз изменения не доказывает
  reload. Затем выполните реальный playbook с выводом в apply.log и проверьте файлы,
  права и HTTP каждой цели. Не удаляйте задачу чтения cat /run/quest-service.pid.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `inventory.ini`,
  `ansible.cfg`, `rollout.yml`, `check.log`, `apply.log`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно
  загруженные образы и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Check report показывает прогноз изменений и пропуски command;
  реальный запуск доставляет north-74 при mode 0644, три HTTP endpoints согласованы.'
debrief: За прогнозом изменения последовал проверенный реальный деплой.
stages.0.brief: 'Результат проверки: Check report показывает прогноз изменений и пропуски
  command; реальный запуск доставляет north-74 при mode 0644, три HTTP endpoints согласованы.'
stages.0.objectives.0.text: Check report показывает прогноз изменений и пропуски command;
  реальный запуск доставляет north-74 при mode 0644, три HTTP endpoints согласованы.
hints.0.text: Check mode — прогноз, а не альтернативный деплой.
hints.1.text: Изучите пропущенные command tasks в recap.
hints.2.text: После изучения diff выполните реальный playbook и проверьте каждый endpoint.
phrases.0: Я определил ограничения check mode для command и handlers.
phrases.1: Я изучил diff до выполнения изменений.
phrases.2: Я проверил управляемые файлы и фактический HTTP-ответ.
