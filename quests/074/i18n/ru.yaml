title: Пределы check mode
brief: "Флот по-прежнему обслуживает предыдущий выпуск. Предварительный просмотр и проверенное развёртывание должны\
  \ иметь отдельные свидетельства.\n\nРаботайте на workstation в `~/quest` с файлами `inventory.ini`, `ansible.cfg`,\
  \ `rollout.yml`.\n\n**Требования:**\n- Свидетельства на workstation:\n  - Непустой файл: `~/quest/check.log`.\n\
  \  - Непустой файл: `~/quest/apply.log`.\n- Запись предварительного просмотра на workstation:\n  - Путь: `~/quest/check.log`.\n\
  \  - `app1`, `app2`, `app3`: `changed>0`, `skipped>0`, `failed=0`.\n- Файл на каждом управляемом хосте (`app1`,\
  \ `app2`, `app3`):\n  - Путь: `/srv/site/message`.\n  - Содержимое: `north-74`.\n  - Режим доступа: `0644`.\n\
  - Живой сервис на каждом управляемом хосте (`app1`, `app2`, `app3`):\n  - HTTP: `8080`, `/`.\n  - Ответ: `north-74`.\n\
  - Постройте текущую программу развёртывания для интерфейса вызывающей стороны из `~/quest/caller-contract.json`\
  \ на рабочей станции; `caller-cache.py` моделирует обновление локального потребителя. Предварительный просмотр\
  \ ожидающих изменений должен предсказывать изменения и пропускать неподдерживаемую инспекцию, не меняя рабочие\
  \ данные, кеш и другие входы вызывающей стороны. Применение должно доставлять заданный выпуск и обновлять потребитель.\
  \ Просмотр после сходимости должен сообщать отсутствие изменений, по-прежнему пропускать неподдерживаемую инспекцию\
  \ и сохранять данные.\n\nПредварительный просмотр прогнозирует изменения; он не доказывает, что произошла перезагрузка\
  \ живого сервиса."
debrief: Вы построили развёртывание с согласованными прогнозами, обновлением потребителя и сходимостью, сохранив
  данные в обоих предварительных просмотрах.
stages.0.brief: Свидетельства предварительного просмотра и живое развёртывание должны соответствовать своим отдельным
  требованиям к результату.
stages.0.objectives.0.text: 'Непустые свидетельства на workstation: `check.log`, `apply.log`.'
stages.0.objectives.1.text: Файл `check.log` на workstation сообщает о прогнозируемых изменениях, пропущенных задачах
  и `failed=0` для `app1`, `app2`, `app3`. Сохранённый отчёт и текущая программа обеспечивают результаты предварительного
  просмотра, применения и просмотра после сходимости по контракту вызывающей стороны.
stages.0.objectives.2.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/message` содержит
  `north-74`.
stages.0.objectives.3.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) путь `/srv/site/message` имеет
  режим `0644`.
stages.0.objectives.4.text: HTTP на порту `8080` возвращает `north-74` на каждом управляемом хосте (`app1`, `app2`,
  `app3`).
hints.0.text: Правдивый предварительный просмотр предсказывает работу, соблюдая границы побочных эффектов. Та же
  программа должна применять изменения и сходиться.
hints.1.text: |-
  Сопоставьте `rollout.yml`, `caller-contract.json` и предоставленный адаптер потребителя. Проследите доставку, инспекцию и обновление в предварительном и обычном запуске; сравните фактические эффекты со счётчиками отчёта.

  В rollout.yml найдите задачи, которые могут изменить файлы или кэш. Проверьте настройки предпросмотра у этих задач и у проверки потребителя, затем сравните их пути с контрактом вызова.

  ```sh
  cat rollout.yml
  cat caller-contract.json
  cat caller-cache.py
  ```
hints.2.text: |-
  Проверьте `ansible-playbook --check --diff rollout.yml` до применения, сохраните прогноз ожидающих изменений в `check.log`, обычный запуск — в `apply.log`, сравните живые ответы. Повторите просмотр после развёртывания: ожидаются `changed=0`, `skipped>0`, `failed=0` и неизменные данные. Принудительный командный handler не должен менять кеш при просмотре.

  Повторите наблюдения до и после каждого предпросмотра. Идентификаторы файлов, режимы, время изменения, контрольные суммы и HTTP-ответы должны совпасть. После применения все три HTTP-ответа должны быть `north-74`.

  ```sh
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    printf "%s\n" "$host"
    ssh -n -o BatchMode=yes -p 2222 "root@$host" 'stat -c "%i %a %y %n" /srv/site/message; sha256sum /srv/site/message'
    curl -fsS --max-time 3 "http://$host:8080/"
    printf '\n'
  done
  ```
phrases.0: Я определил ограничения check mode для command и handlers.
phrases.1: Я изучил diff до выполнения изменений.
phrases.2: Я проверил управляемые файлы и фактический HTTP-ответ.
diagnostics.check_log: Вывод preview могли не сохранить либо check.log пуст; сохраните результат check-mode отдельно от применения. [Причина и проверка](guides#guide=ansible-4&section=preview-retain-nonempty-check-log)
diagnostics.apply_log: Вывод применения могли не сохранить либо apply.log пуст; сохраните журнал выполнения. Это условие проверяет непустой вывод, а не recap применения. [Причина и проверка](guides#guide=ansible-4&section=preview-retain-nonempty-apply-log)
diagnostics.preview_recaps: Выданный play только наблюдает и не предсказывает доставку; каждому хосту нужен check recap с ожидаемыми изменениями, пропусками задач и failed=0. Отсутствующий или неверный recap также не проходит. [Причина и проверка](guides#guide=ansible-4&section=preview-every-host-predicts-changes-and-skips)
diagnostics.probe_0_1: Ранняя recap-группа с лимитом 8s может оборваться без маркера либо helper повтора не запускает защищённый дочерний процесс; проверьте запуск/импорты и отличайте именованные ошибки повтора. [Причина и проверка](guides#guide=ansible-4&section=preview-legacy-timeout-and-helper-startup)
diagnostics.preview_effects: Захардкоженные пути/выпуск, изменения файлов в check-mode или отсутствие handler кэша нарушают повтор; примите входы caller, не меняйте файлы в preview, доставьте и обновите кэш при apply, затем получите ноль ожидаемых изменений. [Причина и проверка](guides#guide=ansible-4&section=preview-parameterized-three-phase-replay)
diagnostics.caller_original: Старый guard входов caller относится к недоступным или изменённым сохранённым входам; список сравниваемых файлов в этом квесте пуст, поэтому обычные сбои повтора дают диагностики effects, observation или budget. [Причина и проверка](guides#guide=ansible-4&section=preview-retained-caller-input-guard)
diagnostics.caller_observation: Дочерний повтор может не запустить Ansible или не прочитать файлы/адаптер кэша до выдачи принятого маркера; таймауты внутренних команд также могут дать ошибку наблюдения. [Причина и проверка](guides#guide=ansible-4&section=preview-child-replay-observation-errors)
diagnostics.caller_budget: Внешний процесс повтора может превысить лимит 14s; найдите блокирующие операции Ansible. Внутренний таймаут, вернувшийся раньше, даёт диагностику наблюдения. [Причина и проверка](guides#guide=ansible-4&section=preview-outer-fourteen-second-budget)
diagnostics.content_1: 'app1 может сохранять previous-74: выданный play только наблюдает; доставьте выпуск в /srv/site/message и проверьте SSH/чтение при ошибке. [Причина и проверка](guides#guide=ansible-4&section=preview-host-1-delivered-file)'
diagnostics.mode_1: app1 может иметь другой режим файла либо stat/SSH не прошли; сохраните mode 644 для /srv/site/message при исправлении доставки. [Причина и проверка](guides#guide=ansible-4&section=preview-host-1-delivered-mode)
diagnostics.http_1: app1 может выдавать старый кэш после изменения файла; уведомите выданный reload-handler при apply и проверьте реальный HTTP вместе с доступностью транспорта. [Причина и проверка](guides#guide=ansible-4&section=preview-host-1-notified-cache-refresh)
