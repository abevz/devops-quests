title: Пределы check mode
brief: "Флот по-прежнему обслуживает предыдущий выпуск. Предварительный просмотр и проверенное развёртывание должны\
  \ иметь отдельные свидетельства.\n\nРаботайте на workstation в `~/quest` с файлами `inventory.ini`, `ansible.cfg`,\
  \ `rollout.yml`.\n\n**Требования:**\n- Свидетельства на workstation:\n  - Непустой файл: `~/quest/check.log`.\n\
  \  - Непустой файл: `~/quest/apply.log`.\n- Запись предварительного просмотра на workstation:\n  - Путь: `~/quest/check.log`.\n\
  \  - `app1`, `app2`, `app3`: `changed>0`, `skipped>0`, `failed=0`.\n- Файл на каждом управляемом хосте (`app1`,\
  \ `app2`, `app3`):\n  - Путь: `/srv/site/message`.\n  - Содержимое: `north-74`.\n  - Режим доступа: `0644`.\n\
  - Живой сервис на каждом управляемом хосте (`app1`, `app2`, `app3`):\n  - HTTP: `8080`, `/`.\n  - Ответ: `north-74`.\n\
  - Постройте текущую программу развёртывания для интерфейса вызывающей стороны из `~/quest/caller-contract.json`\
  \ на рабочей станции; `caller-cache.py` моделирует обновление локального потребителя. Предварительный просмотр\
  \ ожидающих изменений должен предсказывать изменения и пропускать неподдерживаемую инспекцию, не меняя рабочие\
  \ данные, кеш и другие входы вызывающей стороны. Применение должно доставлять заданный выпуск и обновлять потребитель.\
  \ Просмотр после сходимости должен сообщать отсутствие изменений, по-прежнему пропускать неподдерживаемую инспекцию\
  \ и сохранять данные.\n\nПредварительный просмотр прогнозирует изменения; он не доказывает, что произошла перезагрузка\
  \ живого сервиса."
debrief: Вы построили развёртывание с согласованными прогнозами, обновлением потребителя и сходимостью, сохранив
  данные в обоих предварительных просмотрах.
stages.0.brief: Свидетельства предварительного просмотра и живое развёртывание должны соответствовать своим отдельным
  требованиям к результату.
stages.0.objectives.0.text: 'Непустые свидетельства на workstation: `check.log`, `apply.log`.'
stages.0.objectives.1.text: Файл `check.log` на workstation сообщает о прогнозируемых изменениях, пропущенных задачах
  и `failed=0` для `app1`, `app2`, `app3`. Сохранённый отчёт и текущая программа обеспечивают результаты предварительного
  просмотра, применения и просмотра после сходимости по контракту вызывающей стороны.
stages.0.objectives.2.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/message` содержит
  `north-74`.
stages.0.objectives.3.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) путь `/srv/site/message` имеет
  режим `0644`.
stages.0.objectives.4.text: HTTP на порту `8080` возвращает `north-74` на каждом управляемом хосте (`app1`, `app2`,
  `app3`).
hints.0.text: Правдивый предварительный просмотр предсказывает работу, соблюдая границы побочных эффектов. Та же
  программа должна применять изменения и сходиться.
hints.1.text: Сопоставьте `rollout.yml`, `caller-contract.json` и предоставленный адаптер потребителя. Проследите
  доставку, инспекцию и обновление в предварительном и обычном запуске; сравните фактические эффекты со счётчиками
  отчёта.
hints.2.text: 'Постройте доставку и уведомление обновления на входах вызывающей стороны; неподдерживаемая инспекция
  должна пропускаться в check mode. Проверьте `ansible-playbook --check --diff rollout.yml` до применения, сохраните
  прогноз ожидающих изменений в `check.log`, обычный запуск — в `apply.log`, сравните живые ответы. Повторите просмотр
  после развёртывания: ожидаются `changed=0`, `skipped>0`, `failed=0` и неизменные данные. Принудительный командный
  handler не должен менять кеш при просмотре.'
phrases.0: Я определил ограничения check mode для command и handlers.
phrases.1: Я изучил diff до выполнения изменений.
phrases.2: Я проверил управляемые файлы и фактический HTTP-ответ.
