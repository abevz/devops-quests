title: Sprawdź ograniczenia trybu
brief: "Działająca flota nadal udostępnia poprzednie wydanie. Podgląd i zweryfikowane wdrożenie wymagają oddzielnych\
  \ dowodów.\n\nPracuj na workstation w `~/quest` z plikami `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n\n**Wymagania:**\n\
  - Dowody na workstation:\n  - Niepusty plik: `~/quest/check.log`.\n  - Niepusty plik: `~/quest/apply.log`.\n-\
  \ Rejestr podglądu na workstation:\n  - Ścieżka: `~/quest/check.log`.\n  - `app1`, `app2`, `app3`: `changed>0`,\
  \ `skipped>0`, `failed=0`.\n- Plik na każdym zarządzanym hoście (`app1`, `app2`, `app3`):\n  - Ścieżka: `/srv/site/message`.\n\
  \  - Treść: `north-74`.\n  - Tryb dostępu: `0644`.\n- Aktywna usługa na każdym zarządzanym hoście (`app1`, `app2`,\
  \ `app3`):\n  - HTTP: `8080`, `/`.\n  - Odpowiedź: `north-74`.\n- Zbuduj bieżący program wdrożenia dla interfejsu\
  \ wywołującego z `~/quest/caller-contract.json` na stacji roboczej; `caller-cache.py` modeluje odświeżanie lokalnego\
  \ konsumenta. Podgląd oczekujących zmian ma przewidywać zmiany i pomijać nieobsługiwaną inspekcję bez modyfikacji\
  \ danych roboczych, pamięci podręcznej i pozostałych wejść wywołującego. Zastosowanie ma dostarczać żądaną wersję\
  \ i odświeżać konsumenta. Podgląd po osiągnięciu zbieżności ma zgłaszać brak zmian, nadal pomijać inspekcję i\
  \ zachowywać dane.\n\nPodgląd przewiduje zmiany; nie dowodzi przeładowania aktywnej usługi."
debrief: Zbudowano wdrożenie o zgodnych prognozach, odświeżaniu konsumenta i zbieżności, zachowujące dane podczas
  obu podglądów.
stages.0.brief: Dowody podglądu i aktywne wdrożenie muszą spełniać swoje oddzielne wymagania wyniku.
stages.0.objectives.0.text: 'Niepuste dowody na workstation: `check.log`, `apply.log`.'
stages.0.objectives.1.text: Plik `check.log` na workstation zgłasza przewidywane zmiany, pominięte zadania i `failed=0`
  dla `app1`, `app2`, `app3`. Zapisany raport i bieżący program spełniają wyniki podglądu oczekujących zmian, zastosowania
  i podglądu po zbieżności z kontraktu wywołującego.
stages.0.objectives.2.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/message` zawiera
  `north-74`.
stages.0.objectives.3.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) ścieżka `/srv/site/message` ma
  tryb `0644`.
stages.0.objectives.4.text: HTTP na porcie `8080` zwraca `north-74` na każdym zarządzanym hoście (`app1`, `app2`,
  `app3`).
hints.0.text: Prawdziwy podgląd przewiduje pracę, przestrzegając granic skutków ubocznych. Ten sam program musi
  wdrażać i osiągać zbieżność.
hints.1.text: |-
  Porównaj `rollout.yml`, `caller-contract.json` i dostarczony adapter konsumenta. Prześledź dostarczanie, inspekcję i odświeżanie w podglądzie oraz zwykłym uruchomieniu; porównaj rzeczywiste skutki z licznikami raportu.

  W rollout.yml odszukaj zadania mogące zmienić pliki lub pamięć podręczną. Sprawdź ich ustawienia podglądu i ustawienia inspekcji konsumenta, a następnie porównaj używane ścieżki z kontraktem wywołania.

  ```sh
  cat rollout.yml
  cat caller-contract.json
  cat caller-cache.py
  ```
hints.2.text: |-
  Sprawdź `ansible-playbook --check --diff rollout.yml` przed zastosowaniem, zapisz podgląd oczekujących zmian w `check.log`, a zwykły przebieg w `apply.log`, i porównaj odpowiedzi działających usług. Powtórz podgląd po wdrożeniu: oczekuj `changed=0`, `skipped>0`, `failed=0` i niezmiennych danych. Wymuszony handler polecenia nie może zmieniać pamięci podręcznej podczas podglądu.

  Wykonaj te obserwacje przed każdym podglądem i po nim. Tożsamość plików, tryby, czasy modyfikacji, sumy i odpowiedzi HTTP muszą być takie same. Po właściwym zastosowaniu wszystkie trzy odpowiedzi HTTP muszą wynosić `north-74`.

  ```sh
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    printf "%s\n" "$host"
    ssh -n -o BatchMode=yes -p 2222 "root@$host" 'stat -c "%i %a %y %n" /srv/site/message; sha256sum /srv/site/message'
    curl -fsS --max-time 3 "http://$host:8080/"
    printf '\n'
  done
  ```
phrases.0: Zidentyfikowałem luki w trybie sprawdzania w zadaniach command i handlers.
phrases.1: Przed wprowadzeniem zmian sprawdziłem diff.
phrases.2: Sprawdziłem zarządzane pliki i rzeczywiste zachowanie HTTP.
diagnostics.check_log: Wyjście preview mogło nie zostać zapisane lub check.log jest pusty; zachowaj wynik check-mode oddzielnie od zastosowania. [Przyczyna i kontrola](guides#guide=ansible-4&section=preview-retain-nonempty-check-log)
diagnostics.apply_log: Wyjście zastosowania mogło nie zostać zapisane lub apply.log jest pusty; zachowaj log wykonania. Ten warunek sprawdza niepuste wyjście, nie recap zastosowania. [Przyczyna i kontrola](guides#guide=ansible-4&section=preview-retain-nonempty-apply-log)
diagnostics.preview_recaps: Dostarczony play tylko obserwuje i nie przewiduje dostawy; każdy host potrzebuje check recap z przewidywanymi zmianami, pominięciami zadań i failed=0. Brak lub błędny recap też zawodzi. [Przyczyna i kontrola](guides#guide=ansible-4&section=preview-every-host-predicts-changes-and-skips)
diagnostics.probe_0_1: Wczesna grupa recap z limitem 8s może skończyć się bez markera lub helper nie uruchamia chronionego procesu potomnego; sprawdź start/importy i odróżnij nazwane błędy powtórzenia. [Przyczyna i kontrola](guides#guide=ansible-4&section=preview-legacy-timeout-and-helper-startup)
diagnostics.preview_effects: Stałe ścieżki/wydanie, zmiany plików w check-mode lub brak handler cache naruszają powtórzenie; przyjmij wejścia caller, nie zmieniaj plików w preview, dostarcz i odśwież cache przy apply, potem osiągnij zero przewidywanych zmian. [Przyczyna i kontrola](guides#guide=ansible-4&section=preview-parameterized-three-phase-replay)
diagnostics.caller_original: Stary guard wejść caller dotyczy niedostępnych lub zmienionych zachowanych wejść; lista porównywanych plików w tym zadaniu jest pusta, więc zwykłe awarie powtórzenia dają diagnostyki effects, observation lub budget. [Przyczyna i kontrola](guides#guide=ansible-4&section=preview-retained-caller-input-guard)
diagnostics.caller_observation: Proces potomny może nie uruchomić Ansible lub nie odczytać plików/adaptera cache przed markerem; limity czasu wewnętrznych poleceń też mogą dać błąd obserwacji. [Przyczyna i kontrola](guides#guide=ansible-4&section=preview-child-replay-observation-errors)
diagnostics.caller_budget: Zewnętrzny proces powtórzenia może przekroczyć limit 14s; sprawdź blokujące operacje Ansible. Wewnętrzny timeout zwrócony wcześniej daje diagnostykę obserwacji. [Przyczyna i kontrola](guides#guide=ansible-4&section=preview-outer-fourteen-second-budget)
diagnostics.content_1: app1 może nadal zawierać previous-74, bo dostarczony play tylko obserwuje; dostarcz wydanie do /srv/site/message i sprawdź SSH/odczyt przy błędzie. [Przyczyna i kontrola](guides#guide=ansible-4&section=preview-host-1-delivered-file)
diagnostics.mode_1: app1 może mieć inny tryb pliku lub stat/SSH zawiódł; zachowaj mode 644 na /srv/site/message przy naprawie dostawy. [Przyczyna i kontrola](guides#guide=ansible-4&section=preview-host-1-delivered-mode)
diagnostics.http_1: app1 może podawać stary cache po zmianie pliku; powiadom dostarczony reload-handler przy apply i sprawdź rzeczywisty HTTP oraz łączność. [Przyczyna i kontrola](guides#guide=ansible-4&section=preview-host-1-notified-cache-refresh)
diagnostics.content_2: app2 może nadal zawierać previous-74, bo dostarczony play tylko obserwuje; dostarcz wydanie do /srv/site/message i sprawdź SSH/odczyt przy błędzie. [Przyczyna i kontrola](guides#guide=ansible-4&section=preview-host-2-delivered-file)
