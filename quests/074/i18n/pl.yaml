title: Sprawdź ograniczenia trybu
brief: "Działająca flota nadal udostępnia poprzednie wydanie. Podgląd i zweryfikowane wdrożenie wymagają oddzielnych\
  \ dowodów.\n\nPracuj na workstation w `~/quest` z plikami `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n\n**Wymagania:**\n\
  - Dowody na workstation:\n  - Niepusty plik: `~/quest/check.log`.\n  - Niepusty plik: `~/quest/apply.log`.\n-\
  \ Rejestr podglądu na workstation:\n  - Ścieżka: `~/quest/check.log`.\n  - `app1`, `app2`, `app3`: `changed>0`,\
  \ `skipped>0`, `failed=0`.\n- Plik na każdym zarządzanym hoście (`app1`, `app2`, `app3`):\n  - Ścieżka: `/srv/site/message`.\n\
  \  - Treść: `north-74`.\n  - Tryb dostępu: `0644`.\n- Aktywna usługa na każdym zarządzanym hoście (`app1`, `app2`,\
  \ `app3`):\n  - HTTP: `8080`, `/`.\n  - Odpowiedź: `north-74`.\n- Zbuduj bieżący program wdrożenia dla interfejsu\
  \ wywołującego z `~/quest/caller-contract.json` na stacji roboczej; `caller-cache.py` modeluje odświeżanie lokalnego\
  \ konsumenta. Podgląd oczekujących zmian ma przewidywać zmiany i pomijać nieobsługiwaną inspekcję bez modyfikacji\
  \ danych roboczych, pamięci podręcznej i pozostałych wejść wywołującego. Zastosowanie ma dostarczać żądaną wersję\
  \ i odświeżać konsumenta. Podgląd po osiągnięciu zbieżności ma zgłaszać brak zmian, nadal pomijać inspekcję i\
  \ zachowywać dane.\n\nPodgląd przewiduje zmiany; nie dowodzi przeładowania aktywnej usługi."
debrief: Zbudowano wdrożenie o zgodnych prognozach, odświeżaniu konsumenta i zbieżności, zachowujące dane podczas
  obu podglądów.
stages.0.brief: Dowody podglądu i aktywne wdrożenie muszą spełniać swoje oddzielne wymagania wyniku.
stages.0.objectives.0.text: 'Niepuste dowody na workstation: `check.log`, `apply.log`.'
stages.0.objectives.1.text: Plik `check.log` na workstation zgłasza przewidywane zmiany, pominięte zadania i `failed=0`
  dla `app1`, `app2`, `app3`. Zapisany raport i bieżący program spełniają wyniki podglądu oczekujących zmian, zastosowania
  i podglądu po zbieżności z kontraktu wywołującego.
stages.0.objectives.2.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/message` zawiera
  `north-74`.
stages.0.objectives.3.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) ścieżka `/srv/site/message` ma
  tryb `0644`.
stages.0.objectives.4.text: HTTP na porcie `8080` zwraca `north-74` na każdym zarządzanym hoście (`app1`, `app2`,
  `app3`).
hints.0.text: Prawdziwy podgląd przewiduje pracę, przestrzegając granic skutków ubocznych. Ten sam program musi
  wdrażać i osiągać zbieżność.
hints.1.text: Porównaj `rollout.yml`, `caller-contract.json` i dostarczony adapter konsumenta. Prześledź dostarczanie,
  inspekcję i odświeżanie w podglądzie oraz zwykłym uruchomieniu; porównaj rzeczywiste skutki z licznikami raportu.
hints.2.text: 'Zbuduj dostarczanie i powiadomienie odświeżania na wejściach wywołującego; nieobsługiwana inspekcja
  pozostaje pominięta w check mode. Sprawdź `ansible-playbook --check --diff rollout.yml` przed zastosowaniem, zapisz
  podgląd oczekujących zmian w `check.log`, a zwykły przebieg w `apply.log`, i porównaj odpowiedzi działających
  usług. Powtórz podgląd po wdrożeniu: oczekuj `changed=0`, `skipped>0`, `failed=0` i niezmiennych danych. Wymuszony
  handler polecenia nie może zmieniać pamięci podręcznej podczas podglądu.'
phrases.0: Zidentyfikowałem luki w trybie sprawdzania w zadaniach command i handlers.
phrases.1: Przed wprowadzeniem zmian sprawdziłem diff.
phrases.2: Sprawdziłem zarządzane pliki i rzeczywiste zachowanie HTTP.
