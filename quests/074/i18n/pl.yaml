title: Sprawdź ograniczenia trybu
brief: |-
  Działająca flota nadal udostępnia poprzednie wydanie. Podgląd i zweryfikowane wdrożenie wymagają oddzielnych dowodów.

  Pracuj na workstation w `~/quest` z plikami `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Wymagania:**
  - Skonfigurowane wdrożenie i inspekcja usługi:
    - Zakres: `app1`, `app2`, `app3`.
    - Inspekcja usługi tylko odczytuje `/run/quest-service.pid` na każdym hoście, nie zgłasza zmian i nie jest wymuszana w podglądzie.
    - Wdrożenie odświeża aktywny baner.
  - Dowody na workstation:
    - Niepusty plik: `~/quest/check.log`.
    - Niepusty plik: `~/quest/apply.log`.
  - Rejestr podglądu na workstation:
    - Ścieżka: `~/quest/check.log`.
    - `app1`, `app2`, `app3`: `changed>0`, `skipped>0`, `failed=0`.
  - Plik na każdym zarządzanym hoście (`app1`, `app2`, `app3`):
    - Ścieżka: `/srv/site/message`.
    - Treść: `north-74`.
    - Tryb dostępu: `0644`.
  - Aktywna usługa na każdym zarządzanym hoście (`app1`, `app2`, `app3`):
    - HTTP: `8080`, `/`.
    - Odpowiedź: `north-74`.

  **Sprawdź przed Check & finish:**
  - `cat ~/quest/check.log ~/quest/apply.log` — Oba rejestry są niepuste; `check.log` zawiera przewidywane zmiany, pominięte zadania i `failed=0` dla wszystkich trzech hostów.
  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'cat /srv/site/message; ls -l /srv/site/message'` — Każdy host pokazuje `north-74` i `-rw-r--r--`.
  - `for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done` — Pokazuje `north-74` z `app1`, `app2`, `app3`.

  Podgląd przewiduje zmiany; nie dowodzi przeładowania aktywnej usługi.
debrief: Po przewidywanej zmianie nastąpiło zweryfikowane rzeczywiste wdrożenie.
stages.0.brief: Dowody podglądu i aktywne wdrożenie muszą spełniać swoje oddzielne wymagania wyniku.
stages.0.objectives.0.text: Wdrożenie we flocie zachowuje inspekcję usługi tylko do odczytu, która nie zgłasza zmian
  i nie jest wymuszana w podglądzie, oraz odświeża aktywny baner po wdrożeniu.
stages.0.objectives.1.text: 'Niepuste dowody na workstation: `check.log`, `apply.log`.'
stages.0.objectives.2.text: Plik `check.log` na workstation zgłasza przewidywane zmiany, pominięte zadania i `failed=0`
  dla `app1`, `app2`, `app3`.
stages.0.objectives.3.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/message` zawiera
  `north-74`.
stages.0.objectives.4.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) ścieżka `/srv/site/message` ma
  tryb `0644`.
stages.0.objectives.5.text: HTTP na porcie `8080` zwraca `north-74` na każdym zarządzanym hoście (`app1`, `app2`,
  `app3`).
hints.0.text: Check mode to prognoza, a nie alternatywne wdrożenie.
hints.1.text: Kontrola pominęła command tasks w recap.
hints.2.text: Uruchom prawdziwy playbook po przejrzeniu diff, a następnie przetestuj każdy działający endpoint.
  Najpierw zapisz `ansible-playbook --check --diff rollout.yml > check.log`, a następnie rzeczywiste wykonanie przez
  `ansible-playbook rollout.yml > apply.log`. Zachowaj zadanie tylko do odczytu `cat /run/quest-service.pid`; zadania
  command bez obsługi check mode są pomijane w podglądzie.
phrases.0: Zidentyfikowałem luki w trybie sprawdzania w zadaniach command i handlers.
phrases.1: Przed wprowadzeniem zmian sprawdziłem diff.
phrases.2: Sprawdziłem zarządzane pliki i rzeczywiste zachowanie HTTP.
