diagnostics.caller_observation: Nie można ponownie uruchomić bieżącego programu. Sprawdź ścieżki wywołującego, lokalne
  wykonanie i błędy playbooka.
diagnostics.caller_budget: Przekroczono czas uruchomienia wywołującego. Sprawdź blokujące polecenia i niedostępne
  zależności.
