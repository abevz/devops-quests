title: Sprawdź ograniczenia trybu
brief: 'playbook opisuje north-74, podczas gdy wszystkie trzy cele nadal obsługują poprzednią wersję.
  Najpierw uruchom ansible-playbook --check --diff rollout.yml > check.log. Należy zauważyć, że zadania
  command i handlers bez obsługi check-mode są pomijane: przewiduje to zmianę, ale nie dowodzi, że wystąpił
  reload. Następnie uruchom prawdziwy playbook w apply.log i sprawdź pliki, uprawnienia i HTTP na każdym
  celu. Nie usuwaj zadania tylko do odczytu cat /run/quest-service.pid.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `inventory.ini`, `ansible.cfg`,
  `rollout.yml`, `check.log`, `apply.log`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: raport check przewiduje zmiany i pominięte polecenia; prawdziwy przebieg
  dostarcza north-74 o mode 0644 i wszystkie trzy HTTP endpoints się zgadzają.'
debrief: Po przewidywanej zmianie nastąpiło zweryfikowane rzeczywiste wdrożenie.
stages.0.brief: 'Kryteria sukcesu: raport kontrolny przewiduje zmiany i pominięte polecenia; prawdziwy
  przebieg dostarcza north-74 o mode 0644 i wszystkie trzy HTTP endpoints się zgadzają.'
stages.0.objectives.0.text: Raport kontrolny przewiduje zmiany i pominięte polecenia; prawdziwy przebieg
  dostarcza north-74 o mode 0644 i wszystkie trzy HTTP endpoints się zgadzają.
hints.0.text: Check mode to prognoza, a nie alternatywne wdrożenie.
hints.1.text: Kontrola pominęła command tasks w recap.
hints.2.text: Uruchom prawdziwy playbook po przejrzeniu diff, a następnie przetestuj każdy działający
  endpoint.
phrases.0: Zidentyfikowałem luki w trybie sprawdzania w zadaniach command i handlers.
phrases.1: Przed wprowadzeniem zmian sprawdziłem diff.
phrases.2: Sprawdziłem zarządzane pliki i rzeczywiste zachowanie HTTP.
