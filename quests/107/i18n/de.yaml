title: Ingress-Routing
brief: 'Der private Ingress-Controller ist bereit und der board Service bedient Port 8080. Ingress board
  wählt den richtigen privaten IngressClass und station.internal Host aus, zeigt aber auf Service-Port
  8099. Reparieren Sie nur den backend-Port und behalten Sie dabei den Host, den Prefix-Pfad und class
  bei. Testen Sie den tatsächlichen privaten Controller endpoint in components.env mit Host: station.internal
  von client. Der falsche Host darf nicht route zum board sein. In diesem Schacht sind keine VM nginx,
  öffentlichen DNS, Zertifikate oder Host-Ports enthalten.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `components.env`, `ingress-target.json`,
  `ingress.json`, `board.json`, `service.json`, `client.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Anfängliche Erfolgskriterien: Der passende Host leitet über den angehefteten privaten Ingress-Controller
  an board:8080 weiter und gibt north-107 zurück; ein anderer Host wird abgelehnt.'
debrief: Das Routing wurde an der realen Controller-Grenze überprüft, einschließlich einer negativen Host-Übereinstimmung.
