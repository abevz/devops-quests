title: Ingress-Routing
brief: 'Arbeite in `~/quest` mit `components.env`, `ingress-target.json`, `ingress.json`, `board.json`, `service.json` und
  `client.json`. Ein Ingress leitet Anfragen nach Host und Pfad über einen Controller an einen Service. Repariere Ingress
  `board`: Nutze die private Klasse aus `ingress-target.json`, den ersten Host `station.internal`, Pfad `/`, Pfadtyp `Prefix`
  und als erstes Backend genau Service `board` auf Port 8080. Warte auf den Abgleich des Controllers. Frage vom Client die
  private Controller-URL aus `ingress-target.json` mit Host `station.internal` ab und erwarte `north-107`; eine Anfrage mit
  Host `wrong.station.internal` muss fehlschlagen. Ein Fehlschlag allein beweist seine Ursache nicht. Die Prüfungen beobachten
  aktuelles Routing, nicht welche Felder vorher geändert wurden. Nutze nur die Offline-Umgebung.'
debrief: Die Prüfungen beobachteten die passende Antwort und eine fehlgeschlagene Anfrage mit anderem Host.
stages.0.brief: Ingress-Felder und Antwort des passenden Hosts entsprechen der Beschreibung; die Anfrage des falschen Hosts
  schlägt fehl.
stages.0.objectives.0.text: Ingress-Felder und Antwort des passenden Hosts entsprechen der Beschreibung; die Anfrage des falschen
  Hosts schlägt fehl.
hints.0.text: Ein Ingress-Backend verweist auf den Service-Port, nicht auf einen beliebigen Container-Port.
hints.1.text: Der Controller muss die ausgewählten IngressClass und namespace überwachen.
hints.2.text: Fixieren Sie backend auf 8080 und testen Sie den Host header über den Controller, nicht direkt über board Service.
phrases.0: Ich habe class, Host, Pfad und Service-Port unabhängig voneinander überprüft.
phrases.1: Ich habe den Datenverkehr über den Eingangscontroller überprüft.
phrases.2: Ich habe beobachtet, dass die Anfrage mit falschem Host fehlschlug.
questions.0.points.0: NEIN; Ein Eingangscontroller muss die ausgewählten class abgleichen.
questions.0.points.1: Überprüfen Sie die Controller-Bereitschaft und die tatsächliche Anforderungsweiterleitung.
questions.0.prompt: Bewältigt die Erstellung eines Ingress allein den HTTP-Verkehr?
questions.1.points.0: Ein benannter oder nummerierter Service-Port.
questions.1.points.1: Der Service ordnet es dann seinem targetPort und endpoints zu.
questions.1.prompt: Welchen Port wählt der backend aus?
