hints.0.text: Ein Ingress-Backend verweist auf den Service-Port, nicht auf einen beliebigen Container-Port.
hints.1.text: Der Controller muss die ausgewählten IngressClass und namespace überwachen.
hints.2.text: Fixieren Sie backend auf 8080 und testen Sie den Host header über den Controller, nicht
  direkt über board Service.
