title: Ingress-Routing
brief: 'Der private HTTP-Ingress liefert nicht die vorgesehene Host-Antwort. Der andere Host muss über denselben
  Controller unerreichbar bleiben.


  Arbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte Dateien: `ingress-target.json`, `ingress.yaml`,
  `board.yaml`, `service.yaml`, `client.yaml`.


  **Anforderungen:**

  - Der bestehende private Ingress leitet Host `station.internal` für `/` und seine Unterpfade über den mitgelieferten
  Controller zur vorgesehenen Anwendung.

  - Von Deployment `client` liefert die private Controller-URL mit Host `station.internal` den Wert `north-107`.

  - Von Deployment `client` scheitert eine Anfrage an diesen Controller mit Host `wrong.station.internal`.


  Eine fehlgeschlagene Anfrage allein belegt nicht ihre Ursache; geprüft wird aktuelles Routing, nicht geänderte
  Felder.

  '
debrief: Die Prüfungen beobachteten die passende Antwort und eine fehlgeschlagene Anfrage mit anderem Host.
stages.0.brief: Der vorgesehene Host muss die geforderte Antwort über den privaten Controller erhalten.
hints.0.text: Ein Ingress-Backend verweist auf den Service-Port, nicht auf einen beliebigen Container-Port.
hints.1.text: 'Der Controller muss die ausgewählten IngressClass und namespace überwachen.


  Prüfen Sie die mitgelieferten Definitionen, aktuellen Ressourcen und Ereignisse.


  ```sh

  cat ingress.yaml

  kubectl describe ingress board

  cat ingress-target.json

  ```'
hints.2.text: 'Fixieren Sie backend auf 8080 und testen Sie den Host header über den Controller, nicht direkt
  über board Service.


  Prüfen Sie das beobachtete Ergebnis:


  ```sh

  url=$(jq -r .url /run/dq/facts/0/ingress-target.json)

  kubectl exec deployment/client -- wget -qO- -T 3 --header=''Host: station.internal'' "$url"

  kubectl exec deployment/client -- wget -qO- -T 3 --header=''Host: wrong.station.internal'' "$url"

  ```


  Erwartet werden north-107 für Host station.internal und eine fehlgeschlagene Anfrage für wrong.station.internal
  über denselben privaten Controller.


  Mitgelieferte Einschränkungen und Details: Ingress `board` nutzt die bereitgestellte private Klasse und leitet
  Host `station.internal`, Pfad `/` vom Typ `Prefix`, an den deklarierten HTTP-Port von Service `board`.'
phrases.0: Ich habe class, Host, Pfad und Service-Port unabhängig voneinander überprüft.
phrases.1: Ich habe den Datenverkehr über den Eingangscontroller überprüft.
phrases.2: Ich habe beobachtet, dass die Anfrage mit falschem Host fehlschlug.
questions.0.points.0: NEIN; Ein Eingangscontroller muss die ausgewählten class abgleichen.
questions.0.points.1: Überprüfen Sie die Controller-Bereitschaft und die tatsächliche Anforderungsweiterleitung.
questions.0.prompt: Bewältigt die Erstellung eines Ingress allein den HTTP-Verkehr?
questions.1.points.0: Ein benannter oder nummerierter Service-Port.
questions.1.points.1: Der Service ordnet es dann seinem targetPort und endpoints zu.
questions.1.prompt: Welchen Port wählt der backend aus?
