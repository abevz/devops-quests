title: Enrutamiento Ingress
brief: 'El ingress HTTP privado no proporciona la respuesta del host previsto. Mantén el otro host inaccesible
  a través del mismo controlador.


  Trabaja en `~/quest` en la workstation. Archivos suministrados: `ingress-target.json`, `ingress.yaml`, `board.yaml`,
  `service.yaml`, `client.yaml`.


  **Requisitos:**

  - El ingress privado existente dirige Host `station.internal`, para `/` y sus subrutas, a la aplicación prevista
  mediante el controlador suministrado.

  - Desde el Deployment `client`, la URL privada del controlador con Host `station.internal` devuelve `north-107`.

  - Desde el Deployment `client`, una solicitud a ese controlador con Host `wrong.station.internal` falla.


  Una solicitud fallida por sí sola no demuestra el motivo; se observa el enrutamiento actual, no los campos
  cambiados.

  '
debrief: Las comprobaciones observaron la respuesta correcta y un fallo de petición con otro Host.
stages.0.brief: El Host previsto debe recibir la respuesta requerida mediante el controlador privado.
hints.0.text: Un backend Ingress hace referencia al puerto Service, no a un puerto de contenedor arbitrario.
hints.1.text: 'El controlador debe vigilar los IngressClass y namespace seleccionados.


  Inspecciona las definiciones suministradas, los recursos actuales y los eventos.


  ```sh

  cat ingress.yaml

  kubectl describe ingress board

  cat ingress-target.json

  ```'
hints.2.text: 'Fije el backend a 8080 y pruebe el Host header a través del controlador, no directamente a través
  del board Service.


  Verifica el resultado observado:


  ```sh

  url=$(jq -r .url /run/dq/facts/0/ingress-target.json)

  kubectl exec deployment/client -- wget -qO- -T 3 --header=''Host: station.internal'' "$url"

  kubectl exec deployment/client -- wget -qO- -T 3 --header=''Host: wrong.station.internal'' "$url"

  ```


  Se esperan north-107 para Host station.internal y una petición fallida para wrong.station.internal mediante
  el mismo controlador privado.


  Restricciones y detalles suministrados: El Ingress `board` usa la clase privada suministrada y enruta Host
  `station.internal`, ruta `/` de tipo `Prefix`, al puerto HTTP declarado del Service `board`.'
phrases.0: Verifiqué class, host, ruta y puerto Service de forma independiente.
phrases.1: Verifiqué el tráfico a través del controlador de ingreso.
phrases.2: Observé que falló la petición con Host incorrecto.
questions.0.points.0: No; un controlador de ingreso debe conciliar el class seleccionado.
questions.0.points.1: Verifique la preparación del controlador y el enrutamiento de solicitudes real.
questions.0.prompt: ¿La creación de un Ingress por sí sola maneja el tráfico de HTTP?
questions.1.points.0: Un puerto Service con nombre o número.
questions.1.points.1: Luego, el Service lo asigna a su targetPort y endpoints.
questions.1.prompt: ¿Qué puerto selecciona el backend?
