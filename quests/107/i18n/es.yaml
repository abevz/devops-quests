title: Enrutamiento Ingress
brief: "El ingress HTTP privado no proporciona la respuesta del host previsto. Mantén el otro host inaccesible a\
  \ través del mismo controlador.\n\nTrabaja en `~/quest` en la workstation. Archivos suministrados: `ingress-target.json`,\
  \ `ingress.json`, `board.json`, `service.json`, `client.json`.\n\n**Requisitos:**\n- El Ingress `board` usa la\
  \ clase privada de `/run/dq/facts/0/ingress-target.json` en la workstation.\n- Ingress `board`:\n  - host `station.internal`.\n\
  - Ingress `board`:\n  - ruta HTTP `/`.\n- Ingress `board`:\n  - tipo de ruta `Prefix`.\n- El Ingress `board` enruta\
  \ al puerto HTTP declarado del Service `board`.\n- Desde el Deployment `client`, la URL privada del controlador\
  \ con Host `station.internal` devuelve `north-107`.\n- Desde el Deployment `client`, una solicitud a ese controlador\
  \ con Host `wrong.station.internal` falla.\n\n**Verifica antes de Check & finish:**\nEjecuta estos comandos de\
  \ observación desde `~/quest` en la workstation; `kubectl exec` observa el contenedor de la carga indicada.\n\
  - Los ajustes, la identidad y el estado coinciden con Requisitos.\n\n  ```sh\n  kubectl get ingress board -o yaml\n\
  \  cat /run/dq/facts/0/ingress-target.json\n  ```\n- El Host coincidente devuelve `north-107`.\n\n  ```sh\n  url=$(jq\
  \ -r .url /run/dq/facts/0/ingress-target.json)\n  kubectl exec deployment/client -- wget -qO- -T 3 --header='Host:\
  \ station.internal' \"$url\"\n  ```\n- La solicitud con Host incorrecto falla.\n\n  ```sh\n  url=$(jq -r .url\
  \ /run/dq/facts/0/ingress-target.json)\n  kubectl exec deployment/client -- wget -qO- -T 3 --header='Host: wrong.station.internal'\
  \ \"$url\"\n  ```\n\nUna solicitud fallida por sí sola no demuestra el motivo; se observa el enrutamiento actual,\
  \ no los campos cambiados.\n"
debrief: Las comprobaciones observaron la respuesta correcta y un fallo de petición con otro Host.
stages.0.brief: 'El Host previsto debe recibir la respuesta requerida mediante el controlador privado.

  '
hints.0.text: Un backend Ingress hace referencia al puerto Service, no a un puerto de contenedor arbitrario.
hints.1.text: El controlador debe vigilar los IngressClass y namespace seleccionados.
hints.2.text: Fije el backend a 8080 y pruebe el Host header a través del controlador, no directamente a través
  del board Service.
phrases.0: Verifiqué class, host, ruta y puerto Service de forma independiente.
phrases.1: Verifiqué el tráfico a través del controlador de ingreso.
phrases.2: Observé que falló la petición con Host incorrecto.
questions.0.points.0: No; un controlador de ingreso debe conciliar el class seleccionado.
questions.0.points.1: Verifique la preparación del controlador y el enrutamiento de solicitudes real.
questions.0.prompt: ¿La creación de un Ingress por sí sola maneja el tráfico de HTTP?
questions.1.points.0: Un puerto Service con nombre o número.
questions.1.points.1: Luego, el Service lo asigna a su targetPort y endpoints.
questions.1.prompt: ¿Qué puerto selecciona el backend?
