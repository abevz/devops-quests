title: Enrutamiento Ingress
brief: 'Trabaja en `~/quest` con `components.env`, `ingress-target.json`, `ingress.json`, `board.json`, `service.json` y `client.json`.
  Un Ingress dirige peticiones por host y ruta a través de un controlador hacia un Service. Repara el Ingress `board`: usa
  la clase privada de `ingress-target.json`, primer host `station.internal`, ruta `/`, tipo `Prefix` y primer backend exactamente
  Service `board` puerto 8080. Espera la reconciliación del controlador. Desde el Deployment client, solicita la URL privada
  del controlador de `ingress-target.json` con Host `station.internal` y espera `north-107`; una petición con Host `wrong.station.internal`
  debe fallar. Un fallo por sí solo no demuestra su causa. Las comprobaciones observan el enrutamiento actual, no qué campos
  se cambiaron antes. Usa solo la bahía sin conexión.'
debrief: Las comprobaciones observaron la respuesta correcta y un fallo de petición con otro Host.
stages.0.brief: Los campos de Ingress y la respuesta del host correcto coinciden con la descripción, y la petición del host
  incorrecto falla.
stages.0.objectives.0.text: Los campos de Ingress y la respuesta del host correcto coinciden con la descripción, y la petición
  del host incorrecto falla.
hints.0.text: Un backend Ingress hace referencia al puerto Service, no a un puerto de contenedor arbitrario.
hints.1.text: El controlador debe vigilar los IngressClass y namespace seleccionados.
hints.2.text: Fije el backend a 8080 y pruebe el Host header a través del controlador, no directamente a través del board
  Service.
phrases.0: Verifiqué class, host, ruta y puerto Service de forma independiente.
phrases.1: Verifiqué el tráfico a través del controlador de ingreso.
phrases.2: Observé que falló la petición con Host incorrecto.
questions.0.points.0: No; un controlador de ingreso debe conciliar el class seleccionado.
questions.0.points.1: Verifique la preparación del controlador y el enrutamiento de solicitudes real.
questions.0.prompt: ¿La creación de un Ingress por sí sola maneja el tráfico de HTTP?
questions.1.points.0: Un puerto Service con nombre o número.
questions.1.points.1: Luego, el Service lo asigna a su targetPort y endpoints.
questions.1.prompt: ¿Qué puerto selecciona el backend?
