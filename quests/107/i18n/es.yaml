title: Enrutamiento Ingress
brief: 'El controlador de ingreso privado está listo y board Service presta servicio al puerto 8080. Ingress
  board selecciona el host privado IngressClass y station.internal correcto, pero apunta a Puerto Service
  8099. Repare solo ese puerto backend, manteniendo el host, la ruta Prefix y class. Pruebe a través del
  controlador privado real endpoint en components.env usando el Host: station.internal de client. El host
  incorrecto no debe ser route al board. Ningún VM nginx, DNS público, certificados o puertos de host
  forman parte de esta bahía.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `components.env`, `ingress-target.json`,
  `ingress.json`, `board.json`, `service.json`, `client.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: el host coincidente se enruta a través del controlador de ingreso privado
  anclado a board:8080 y devuelve north-107; se rechaza un host diferente.'
debrief: El enrutamiento se verificó en el límite del controlador real, incluida una coincidencia negativa
  del host.
stages.0.brief: 'Criterios de éxito: el host coincidente se enruta a través del controlador de ingreso
  privado anclado a board:8080 y devuelve north-107; se rechaza un host diferente.'
stages.0.objectives.0.text: El host coincidente se enruta a través del controlador de ingreso privado
  anclado a board:8080 y devuelve north-107; se rechaza un host diferente.
hints.0.text: Un backend Ingress hace referencia al puerto Service, no a un puerto de contenedor arbitrario.
hints.1.text: El controlador debe vigilar los IngressClass y namespace seleccionados.
hints.2.text: Fije el backend a 8080 y pruebe el Host header a través del controlador, no directamente
  a través del board Service.
phrases.0: Verifiqué class, host, ruta y puerto Service de forma independiente.
phrases.1: Verifiqué el tráfico a través del controlador de ingreso.
phrases.2: Probé que un host no relacionado no selecciona route.
questions.0.points.0: No; un controlador de ingreso debe conciliar el class seleccionado.
questions.0.points.1: Verifique la preparación del controlador y el enrutamiento de solicitudes real.
questions.0.prompt: ¿La creación de un Ingress por sí sola maneja el tráfico de HTTP?
questions.1.points.0: Un puerto Service con nombre o número.
questions.1.points.1: Luego, el Service lo asigna a su targetPort y endpoints.
questions.1.prompt: ¿Qué puerto selecciona el backend?
