diagnostics.path_type: La ruta raíz de station.internal debe incluir las subrutas mediante Prefix.
diagnostics.backend: ingress/board backend debe ser igual a board:8080.
diagnostics.http: La petición con Host station.internal debe devolver north-107.
diagnostics.wrong: La petición con Host wrong.station.internal debe fallar.
