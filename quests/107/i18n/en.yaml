title: Ingress routing
brief: 'Work in `~/quest` with `components.env`, `ingress-target.json`, `ingress.json`, `board.json`, `service.json` and `client.json`.
  An Ingress directs requests by host and path through a controller to a Service. Repair Ingress `board`: use the private
  class from `ingress-target.json`, first host `station.internal`, path `/`, path type `Prefix`, and first backend exactly
  Service `board` port 8080. Wait for the controller to reconcile. From the client, request the private controller URL in
  `ingress-target.json` with Host `station.internal` and expect `north-107`; a request with Host `wrong.station.internal`
  must fail. A failed request alone does not prove why it failed. The checks observe current routing, not which fields were
  changed. Use only the offline bay.'
debrief: The checks observed the matching response and a failed request with the other Host.
stages.0.brief: The Ingress fields and matching-host response match the brief, and the wrong-host request fails.
stages.0.objectives.0.text: The Ingress fields and matching-host response match the brief, and the wrong-host request fails.
hints.0.text: An Ingress backend references the Service port, not an arbitrary container port.
hints.1.text: The controller must watch the selected IngressClass and namespace.
hints.2.text: Fix the backend to 8080 and test the Host header through the controller, not directly through the board Service.
phrases.0: I checked class, host, path and Service port independently.
phrases.1: I verified traffic through the ingress controller.
phrases.2: I observed the wrong-Host request fail.
questions.0.points.0: No; an ingress controller must reconcile the selected class.
questions.0.points.1: Verify controller readiness and actual request routing.
questions.0.prompt: Does creating an Ingress alone handle HTTP traffic?
questions.1.points.0: A named or numbered Service port.
questions.1.points.1: The Service then maps it to its targetPort and endpoints.
questions.1.prompt: Which port does the backend select?
