title: Ingress routing
brief: 'The private ingress controller is ready, and the board Service serves port 8080. Ingress board
  selects the correct private IngressClass and station.internal host but points to Service port 8099.
  Repair only that backend port, keeping host, Prefix path and class. Test through the actual private
  controller endpoint in components.env using Host: station.internal from client. The wrong host must
  not route to the board. No VM nginx, public DNS, certificates or host ports are part of this bay.


  Quest files in `~/quest` (some appear in later stages): `components.env`, `ingress-target.json`, `ingress.json`,
  `board.json`, `service.json`, `client.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: The matching host routes through the pinned private ingress controller to
  board:8080 and returns north-107; a different host is rejected.'
debrief: Routing was verified at the real controller boundary, including a negative host match.
