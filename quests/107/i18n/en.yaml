title: Ingress routing
brief: 'Private HTTP ingress is not providing the intended host response. Keep the other host unavailable through
  the same controller.


  Work in `~/quest` on the workstation. Supplied files: `ingress-target.json`, `ingress.yaml`, `board.yaml`,
  `service.yaml`, `client.yaml`.


  **Requirements:**

  - The existing private ingress routes Host `station.internal`, for `/` and its subpaths, to the intended
  application through the supplied controller.

  - From Deployment `client`, the private controller URL with Host `station.internal` returns `north-107`.

  - From Deployment `client`, a request to that controller with Host `wrong.station.internal` fails.


  A failed request alone does not prove why it failed; checks observe current routing, not which fields were
  changed.

  '
debrief: The checks observed the matching response and a failed request with the other Host.
stages.0.brief: The intended Host must receive the required response through the private controller.
hints.0.text: An Ingress backend references the Service port, not an arbitrary container port.
hints.1.text: 'The controller must watch the selected IngressClass and namespace.


  Inspect the supplied definitions, current resources and events.


  ```sh

  cat ingress.yaml

  kubectl describe ingress board

  cat ingress-target.json

  ```'
hints.2.text: 'Fix the backend to 8080 and test the Host header through the controller, not directly through
  the board Service.


  Verify the observed result:


  ```sh

  url=$(jq -r .url /run/dq/facts/0/ingress-target.json)

  kubectl exec deployment/client -- wget -qO- -T 3 --header=''Host: station.internal'' "$url"

  kubectl exec deployment/client -- wget -qO- -T 3 --header=''Host: wrong.station.internal'' "$url"

  ```


  Expect north-107 for Host station.internal and a failed request for wrong.station.internal through the same
  private controller.


  Supplied constraints and details: Ingress `board` uses the supplied private class and routes Host `station.internal`,
  path `/` of type `Prefix`, to the declared HTTP port of Service `board`.'
phrases.0: I checked class, host, path and Service port independently.
phrases.1: I verified traffic through the ingress controller.
phrases.2: I observed the wrong-Host request fail.
questions.0.points.0: No; an ingress controller must reconcile the selected class.
questions.0.points.1: Verify controller readiness and actual request routing.
questions.0.prompt: Does creating an Ingress alone handle HTTP traffic?
questions.1.points.0: A named or numbered Service port.
questions.1.points.1: The Service then maps it to its targetPort and endpoints.
questions.1.prompt: Which port does the backend select?
diagnostics.ingress_class: Ingress board must use the supplied private class.
diagnostics.host: ingress/board must contain the station.internal host rule.
diagnostics.path: The station.internal rule must cover path /.
diagnostics.path_type: The station.internal root path must include subpaths through Prefix matching.
diagnostics.backend: ingress/board backend must equal board:8080.
diagnostics.http: The request with Host station.internal must return north-107.
diagnostics.wrong: The request with Host wrong.station.internal must fail.
