title: Ingress routing
brief: "Private HTTP ingress is not providing the intended host response. Keep the other host unavailable through\
  \ the same controller.\n\nWork in `~/quest` on the workstation. Supplied files: `ingress-target.json`, `ingress.yaml`,\
  \ `board.yaml`, `service.yaml`, `client.yaml`.\n\n**Requirements:**\n- Ingress `board` uses the supplied private\
  \ class and routes Host `station.internal`, path `/` of type `Prefix`, to the declared HTTP port of Service `board`.\n\
  \  - The controller class and private URL are recorded in `/run/dq/facts/0/ingress-target.json` on the workstation.\n\
  - From Deployment `client`, the private controller URL with Host `station.internal` returns `north-107`.\n- From\
  \ Deployment `client`, a request to that controller with Host `wrong.station.internal` fails.\n\n**Verify yourself\
  \ before Check & finish:**\nRun these observation commands from `~/quest` on the workstation; `kubectl exec` observes\
  \ the named workload container.\n- Settings, identity and status match Requirements.\n\n  ```sh\n  kubectl get\
  \ ingress board -o yaml\n  cat /run/dq/facts/0/ingress-target.json\n  ```\n- The matching Host returns `north-107`.\n\
  \n  ```sh\n  url=$(jq -r .url /run/dq/facts/0/ingress-target.json)\n  kubectl exec deployment/client -- wget -qO-\
  \ -T 3 --header='Host: station.internal' \"$url\"\n  ```\n- The wrong Host request fails.\n\n  ```sh\n  url=$(jq\
  \ -r .url /run/dq/facts/0/ingress-target.json)\n  kubectl exec deployment/client -- wget -qO- -T 3 --header='Host:\
  \ wrong.station.internal' \"$url\"\n  ```\n\nA failed request alone does not prove why it failed; checks observe\
  \ current routing, not which fields were changed.\n"
debrief: The checks observed the matching response and a failed request with the other Host.
stages.0.brief: 'The intended Host must receive the required response through the private controller.

  '
hints.0.text: An Ingress backend references the Service port, not an arbitrary container port.
hints.1.text: The controller must watch the selected IngressClass and namespace.
hints.2.text: Fix the backend to 8080 and test the Host header through the controller, not directly through the
  board Service.
phrases.0: I checked class, host, path and Service port independently.
phrases.1: I verified traffic through the ingress controller.
phrases.2: I observed the wrong-Host request fail.
questions.0.points.0: No; an ingress controller must reconcile the selected class.
questions.0.points.1: Verify controller readiness and actual request routing.
questions.0.prompt: Does creating an Ingress alone handle HTTP traffic?
questions.1.points.0: A named or numbered Service port.
questions.1.points.1: The Service then maps it to its targetPort and endpoints.
questions.1.prompt: Which port does the backend select?
