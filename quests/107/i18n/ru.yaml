title: Маршрутизация Ingress
brief: "Частный HTTP ingress не выдаёт требуемый ответ для целевого хоста. Другой хост должен оставаться недоступным\
  \ через тот же контроллер.\n\nРаботайте в `~/quest` на workstation. Предоставленные файлы: `ingress-target.json`,\
  \ `ingress.yaml`, `board.yaml`, `service.yaml`, `client.yaml`.\n\n**Требования:**\n- Ingress `board` использует\
  \ предоставленный частный класс и направляет Host `station.internal`, путь `/` типа `Prefix`, на объявленный HTTP-порт\
  \ Service `board`.\n  - Класс контроллера и частный URL записаны в `/run/dq/facts/0/ingress-target.json` на workstation.\n\
  - Из Deployment `client` частный URL контроллера с Host `station.internal` возвращает `north-107`.\n- Из Deployment\
  \ `client` запрос к этому контроллеру с Host `wrong.station.internal` завершается ошибкой.\n\n**Проверьте самостоятельно\
  \ перед Check & finish:**\nВыполняйте эти команды наблюдения из `~/quest` на workstation; `kubectl exec` наблюдает\
  \ контейнер указанной нагрузки.\n- Настройки, идентичность и статус соответствуют требованиям.\n\n  ```sh\n  kubectl\
  \ get ingress board -o yaml\n  cat /run/dq/facts/0/ingress-target.json\n  ```\n- Подходящий Host возвращает `north-107`.\n\
  \n  ```sh\n  url=$(jq -r .url /run/dq/facts/0/ingress-target.json)\n  kubectl exec deployment/client -- wget -qO-\
  \ -T 3 --header='Host: station.internal' \"$url\"\n  ```\n- Запрос с неверным Host завершается ошибкой.\n\n  ```sh\n\
  \  url=$(jq -r .url /run/dq/facts/0/ingress-target.json)\n  kubectl exec deployment/client -- wget -qO- -T 3 --header='Host:\
  \ wrong.station.internal' \"$url\"\n  ```\n\nОдин лишь отказ запроса не доказывает его причину; проверка наблюдает\
  \ текущую маршрутизацию, а не изменённые поля.\n"
debrief: Проверки наблюдали правильный ответ и ошибку запроса с другим Host.
stages.0.brief: 'Требуемый Host должен получать нужный ответ через частный контроллер.

  '
hints.0.text: Backend Ingress ссылается на порт Service, а не произвольный порт контейнера.
hints.1.text: Контроллер должен обслуживать выбранные IngressClass и namespace.
hints.2.text: Исправьте backend на 8080 и проверьте Host header через контроллер, а не напрямую через Service табло.
phrases.0: Я отдельно проверил class, host, path и порт Service.
phrases.1: Я проверил трафик через ingress-контроллер.
phrases.2: Я наблюдал ошибку запроса с неверным Host.
