title: Маршрутизация Ingress
brief: 'Частный HTTP ingress не выдаёт требуемый ответ для целевого хоста. Другой хост должен оставаться недоступным
  через тот же контроллер.


  Работайте в `~/quest` на workstation. Предоставленные файлы: `ingress-target.json`, `ingress.yaml`, `board.yaml`,
  `service.yaml`, `client.yaml`.


  **Требования:**

  - Существующий приватный ingress направляет Host `station.internal`, для `/` и его подпутей, к требуемому
  приложению через поставленный контроллер.

  - Из Deployment `client` частный URL контроллера с Host `station.internal` возвращает `north-107`.

  - Из Deployment `client` запрос к этому контроллеру с Host `wrong.station.internal` завершается ошибкой.


  Один лишь отказ запроса не доказывает его причину; проверка наблюдает текущую маршрутизацию, а не изменённые
  поля.

  '
debrief: Проверки наблюдали правильный ответ и ошибку запроса с другим Host.
stages.0.brief: Требуемый Host должен получать нужный ответ через частный контроллер.
hints.0.text: Backend Ingress ссылается на порт Service, а не произвольный порт контейнера.
hints.1.text: 'Контроллер должен обслуживать выбранные IngressClass и namespace.


  Изучите поставленные определения, текущие ресурсы и события.


  ```sh

  cat ingress.yaml

  kubectl describe ingress board

  cat ingress-target.json

  ```'
hints.2.text: 'Исправьте backend на 8080 и проверьте Host header через контроллер, а не напрямую через Service
  табло.


  Проверьте наблюдаемый результат:


  ```sh

  url=$(jq -r .url /run/dq/facts/0/ingress-target.json)

  kubectl exec deployment/client -- wget -qO- -T 3 --header=''Host: station.internal'' "$url"

  kubectl exec deployment/client -- wget -qO- -T 3 --header=''Host: wrong.station.internal'' "$url"

  ```


  Ожидаются north-107 для Host station.internal и неуспешный запрос для wrong.station.internal через тот же
  приватный контроллер.


  Поставленные ограничения и подробности: Ingress `board` использует предоставленный частный класс и направляет
  Host `station.internal`, путь `/` типа `Prefix`, на объявленный HTTP-порт Service `board`.'
phrases.0: Я отдельно проверил class, host, path и порт Service.
phrases.1: Я проверил трафик через ingress-контроллер.
phrases.2: Я наблюдал ошибку запроса с неверным Host.
questions.0.points.0: 'Нет: ingress-контроллер должен согласовать выбранный class.'
questions.0.points.1: Проверяйте готовность контроллера и реальную маршрутизацию запроса.
questions.0.prompt: Обрабатывает ли само создание Ingress HTTP-трафик?
questions.1.points.0: Именованный или числовой порт Service.
questions.1.points.1: Service далее связывает его с targetPort и endpoints.
questions.1.prompt: Какой порт выбирает backend?
stages.0.objectives.0.text: Существующий приватный ingress направляет Host `station.internal`, для `/` и его
  подпутей, к требуемому приложению через поставленный контроллер.
stages.0.objectives.1.text: Из Deployment `client` частный URL контроллера с Host `station.internal` возвращает
  `north-107`.
stages.0.objectives.2.text: Из Deployment `client` запрос к этому контроллеру с Host `wrong.station.internal`
  завершается ошибкой.
diagnostics.ingress_class: Ingress мог использовать класс другого контроллера, либо не читается выданный класс. Сравните ingressClassName с предоставленным приватным классом перед проверкой маршрутов. [Причина и проверка](guides#guide=kubernetes-10&section=q107-ingress-private-class)
diagnostics.host: Правило хоста могло исчезнуть или содержать другое имя. Найдите station.internal в текущем Ingress перед проверкой путей. [Причина и проверка](guides#guide=kubernetes-10&section=q107-ingress-station-host)
diagnostics.path: Хост может совпадать, даже если в его списке нет корневого пути. Проверьте путь / в правиле station.internal. [Причина и проверка](guides#guide=kubernetes-10&section=q107-ingress-root-path)
diagnostics.path_type: Правило могло объявить / с Exact или другим типом пути. Для / под station.internal проверьте Prefix. [Причина и проверка](guides#guide=kubernetes-10&section=q107-ingress-prefix-matching)
diagnostics.backend: Путь для station.internal мог остаться на 8099 или ссылаться на другой backend. Проверьте, что каждый путь ведёт к Service board на 8080 напрямую или через однозначное имя TCP-порта. [Причина и проверка](guides#guide=kubernetes-10&section=q107-ingress-board-service-port)
diagnostics.http: Ingress мог быть настроен, пока контроллер ещё применяет изменения либо endpoint board недоступен. Отправьте подходящий заголовок Host на выданный URL и сравните ответ с north-107. [Причина и проверка](guides#guide=kubernetes-10&section=q107-ingress-live-request)
diagnostics.wrong: Правило для всех хостов или backend по умолчанию может принимать неподходящий хост. Отправьте другой заголовок Host через тот же URL и проверьте, что запрос не проходит. [Причина и проверка](guides#guide=kubernetes-10&section=q107-ingress-unmatched-host)
diagnostics.probe_0_0: Проверка маршрута может остановиться до указания условия при ошибке процесса или входов. Проверьте Python и доступ к Ingress и Service. [Причина и проверка](guides#guide=kubernetes-10&section=q107-ingress-contract-observer-input)
