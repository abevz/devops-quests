title: Маршрутизация Ingress
brief: 'Работайте в `~/quest` с `components.env`, `ingress-target.json`, `ingress.json`, `board.json`, `service.json` и `client.json`.
  Ingress направляет запросы по хосту и пути через контроллер к Service. Исправьте Ingress `board`: используйте приватный
  класс из `ingress-target.json`, первый хост `station.internal`, путь `/`, тип `Prefix` и первый backend ровно Service `board`
  порт 8080. Дождитесь согласования контроллера. Из клиента запросите приватный URL контроллера из `ingress-target.json` с
  Host `station.internal` и ожидайте `north-107`; запрос с Host `wrong.station.internal` должен завершиться ошибкой. Ошибка
  сама по себе не доказывает её причину. Проверки наблюдают текущую маршрутизацию, но не историю изменений полей. Используйте
  только офлайн-песочницу.'
debrief: Проверки наблюдали правильный ответ и ошибку запроса с другим Host.
stages.0.brief: Поля Ingress и ответ нужного хоста соответствуют описанию, а запрос с неверным хостом завершается ошибкой.
stages.0.objectives.0.text: Поля Ingress и ответ нужного хоста соответствуют описанию, а запрос с неверным хостом завершается
  ошибкой.
hints.0.text: Backend Ingress ссылается на порт Service, а не произвольный порт контейнера.
hints.1.text: Контроллер должен обслуживать выбранные IngressClass и namespace.
hints.2.text: Исправьте backend на 8080 и проверьте Host header через контроллер, а не напрямую через Service табло.
phrases.0: Я отдельно проверил class, host, path и порт Service.
phrases.1: Я проверил трафик через ingress-контроллер.
phrases.2: Я наблюдал ошибку запроса с неверным Host.
questions.0.points.0: 'Нет: ingress-контроллер должен согласовать выбранный class.'
questions.0.points.1: Проверяйте готовность контроллера и реальную маршрутизацию запроса.
questions.0.prompt: Обрабатывает ли само создание Ingress HTTP-трафик?
questions.1.points.0: Именованный или числовой порт Service.
questions.1.points.1: Service далее связывает его с targetPort и endpoints.
questions.1.prompt: Какой порт выбирает backend?
