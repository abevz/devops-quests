title: Маршрутизация Ingress
brief: 'Приватный ingress-контроллер готов, Service табло слушает порт 8080. Ingress board выбирает правильный
  приватный IngressClass и host station.internal, но направляет к порту Service 8099. Исправьте только
  backend port, сохранив host, Prefix path и class. Проверьте запрос из client через реальный приватный
  endpoint контроллера в components.env с Host: station.internal. Неверный host не должен вести к табло.
  Nginx VM, публичный DNS, сертификаты и порты хоста не входят в песочницу.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `components.env`, `ingress-target.json`,
  `ingress.json`, `board.json`, `service.json`, `client.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Подходящий host проходит через закреплённый приватный ingress-контроллер к board:8080
  и получает north-107; другой host отвергается.'
debrief: Маршрутизация проверена на реальной границе контроллера, включая отрицательную проверку host.
