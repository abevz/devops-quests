title: Trasowanie Ingress
brief: 'Pracuj w `~/quest` z `components.env`, `ingress-target.json`, `ingress.json`, `board.json`, `service.json` i `client.json`.
  Ingress kieruje żądania według hosta i ścieżki przez kontroler do Service. Napraw Ingress `board`: użyj prywatnej klasy
  z `ingress-target.json`, pierwszego hosta `station.internal`, ścieżki `/`, typu `Prefix` i dokładnie pierwszego backendu
  Service `board` na porcie 8080. Poczekaj na uzgodnienie kontrolera. Z Deploymentu client odpytaj prywatny URL kontrolera
  z `ingress-target.json` z Host `station.internal` i oczekuj `north-107`; żądanie z Host `wrong.station.internal` musi się
  nie udać. Sam błąd żądania nie dowodzi jego przyczyny. Kontrole obserwują bieżący routing, nie zmienione wcześniej pola.
  Używaj tylko zatoki offline.'
debrief: Kontrole sprawdziły właściwą odpowiedź i nieudane żądanie z innym Host.
stages.0.brief: Pola Ingress i odpowiedź właściwego hosta odpowiadają opisowi, a żądanie z błędnym hostem się nie udaje.
stages.0.objectives.0.text: Pola Ingress i odpowiedź właściwego hosta odpowiadają opisowi, a żądanie z błędnym hostem się
  nie udaje.
hints.0.text: Backend Ingress odwołuje się do portu Service, a nie do dowolnego portu kontenera.
hints.1.text: Sterownik musi obserwować wybrane IngressClass i namespace.
hints.2.text: Napraw backend na 8080 i przetestuj Host header poprzez kontroler, a nie bezpośrednio przez board Service.
phrases.0: Sprawdzałem niezależnie port class, host, path i Service.
phrases.1: Zweryfikowałem ruch poprzez kontroler ruchu przychodzącego.
phrases.2: Zaobserwowałem nieudane żądanie z błędnym Host.
questions.0.points.0: NIE; kontroler wejściowy musi uzgodnić wybrany class.
questions.0.points.1: Sprawdź gotowość kontrolera i faktyczne kierowanie żądań.
questions.0.prompt: Czy samo utworzenie Ingress obsługuje ruch HTTP?
questions.1.points.0: Nazwany lub numerowany port Service.
questions.1.points.1: Następnie Service mapuje go na swoje targetPort i endpoints.
questions.1.prompt: Który port wybiera backend?
