title: Trasowanie Ingress
brief: 'Prywatny kontroler ingress jest gotowy, a Service board obsługuje port 8080. Ingress board wybiera
  poprawny prywatny IngressClass i host station.internal, ale wskazuje na port Service 8099. Napraw wyłącznie
  ten port zaplecza, zachowując host, ścieżkę Prefix i klasę. Sprawdź ruch z client przez rzeczywisty
  prywatny endpoint kontrolera z components.env, używając Host: station.internal. Błędny host nie może
  kierować ruchu do board. VM nginx, publiczny DNS, certyfikaty ani porty hosta nie są częścią tej strefy.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `components.env`, `ingress-target.json`,
  `ingress.json`, `board.json`, `service.json`, `client.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: pasujący host kieruje przez przypięty prywatny kontroler wejściowy do board:8080
  i zwraca north-107; inny host zostaje odrzucony.'
debrief: Routing został zweryfikowany na granicy rzeczywistego kontrolera, łącznie z ujemnym dopasowaniem
  host.
stages.0.brief: 'Kryteria sukcesu: pasujący host kieruje przez przypięty prywatny kontroler wejściowy
  do board:8080 i zwraca north-107; inny host zostanie odrzucony.'
stages.0.objectives.0.text: Pasujący host kieruje przez przypięty prywatny kontroler wejściowy do board:8080
  i zwraca north-107; inny host zostanie odrzucony.
hints.0.text: Backend Ingress odwołuje się do portu Service, a nie do dowolnego portu kontenera.
hints.1.text: Sterownik musi obserwować wybrane IngressClass i namespace.
hints.2.text: Napraw backend na 8080 i przetestuj Host header poprzez kontroler, a nie bezpośrednio przez
  board Service.
phrases.0: Sprawdzałem niezależnie port class, host, path i Service.
phrases.1: Zweryfikowałem ruch poprzez kontroler ruchu przychodzącego.
phrases.2: Sprawdziłem, że niepowiązany host nie wybiera trasy.
questions.0.points.0: NIE; kontroler wejściowy musi uzgodnić wybrany class.
questions.0.points.1: Sprawdź gotowość kontrolera i faktyczne kierowanie żądań.
questions.0.prompt: Czy samo utworzenie Ingress obsługuje ruch HTTP?
questions.1.points.0: Nazwany lub numerowany port Service.
questions.1.points.1: Następnie Service mapuje go na swoje targetPort i endpoints.
questions.1.prompt: Który port wybiera backend?
