diagnostics.path_type: Ścieżka główna station.internal musi obejmować podścieżki przez dopasowanie Prefix.
diagnostics.backend: ingress/board backend musi być równe board:8080.
diagnostics.http: Żądanie z Host station.internal musi zwrócić north-107.
diagnostics.wrong: Żądanie z Host wrong.station.internal musi się nie powieść.
