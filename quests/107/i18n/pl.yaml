title: Trasowanie Ingress
brief: "Prywatny ingress HTTP nie udostępnia odpowiedzi oczekiwanego hosta. Drugi host ma pozostać niedostępny przez\
  \ ten sam kontroler.\n\nPracuj w `~/quest` na workstation. Dostarczone pliki: `ingress-target.json`, `ingress.yaml`,\
  \ `board.yaml`, `service.yaml`, `client.yaml`.\n\n**Wymagania:**\n- Ingress `board` używa dostarczonej prywatnej\
  \ klasy i kieruje Host `station.internal`, ścieżkę `/` typu `Prefix`, do zadeklarowanego portu HTTP Service `board`.\n\
  \  - Klasa kontrolera i prywatny URL są zapisane w `/run/dq/facts/0/ingress-target.json` na workstation.\n- Z\
  \ Deployment `client` prywatny URL kontrolera z Host `station.internal` zwraca `north-107`.\n- Z Deployment `client`\
  \ żądanie do tego kontrolera z Host `wrong.station.internal` kończy się błędem.\n\n**Sprawdź samodzielnie przed\
  \ Check & finish:**\nWykonuj te polecenia obserwacyjne w `~/quest` na workstation; `kubectl exec` obserwuje kontener\
  \ wskazanego obciążenia.\n- Ustawienia, tożsamość i status odpowiadają wymaganiom.\n\n  ```sh\n  kubectl get ingress\
  \ board -o yaml\n  cat /run/dq/facts/0/ingress-target.json\n  ```\n- Pasujący Host zwraca `north-107`.\n\n  ```sh\n\
  \  url=$(jq -r .url /run/dq/facts/0/ingress-target.json)\n  kubectl exec deployment/client -- wget -qO- -T 3 --header='Host:\
  \ station.internal' \"$url\"\n  ```\n- Żądanie z nieprawidłowym Host kończy się błędem.\n\n  ```sh\n  url=$(jq\
  \ -r .url /run/dq/facts/0/ingress-target.json)\n  kubectl exec deployment/client -- wget -qO- -T 3 --header='Host:\
  \ wrong.station.internal' \"$url\"\n  ```\n\nSam błąd żądania nie dowodzi jego przyczyny; sprawdzany jest bieżący\
  \ routing, nie zmienione pola.\n"
debrief: Kontrole sprawdziły właściwą odpowiedź i nieudane żądanie z innym Host.
stages.0.brief: 'Oczekiwany Host ma otrzymywać wymaganą odpowiedź przez prywatny kontroler.

  '
hints.0.text: Backend Ingress odwołuje się do portu Service, a nie do dowolnego portu kontenera.
hints.1.text: Sterownik musi obserwować wybrane IngressClass i namespace.
hints.2.text: Napraw backend na 8080 i przetestuj Host header poprzez kontroler, a nie bezpośrednio przez board
  Service.
phrases.0: Sprawdzałem niezależnie port class, host, path i Service.
phrases.1: Zweryfikowałem ruch poprzez kontroler ruchu przychodzącego.
phrases.2: Zaobserwowałem nieudane żądanie z błędnym Host.
questions.0.points.0: NIE; kontroler wejściowy musi uzgodnić wybrany class.
questions.0.points.1: Sprawdź gotowość kontrolera i faktyczne kierowanie żądań.
questions.0.prompt: Czy samo utworzenie Ingress obsługuje ruch HTTP?
questions.1.points.0: Nazwany lub numerowany port Service.
questions.1.points.1: Następnie Service mapuje go na swoje targetPort i endpoints.
questions.1.prompt: Który port wybiera backend?
