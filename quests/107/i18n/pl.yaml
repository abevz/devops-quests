title: Trasowanie Ingress
brief: 'Prywatny ingress HTTP nie udostępnia odpowiedzi oczekiwanego hosta. Drugi host ma pozostać niedostępny
  przez ten sam kontroler.


  Pracuj w `~/quest` na workstation. Dostarczone pliki: `ingress-target.json`, `ingress.yaml`, `board.yaml`,
  `service.yaml`, `client.yaml`.


  **Wymagania:**

  - Istniejący prywatny ingress kieruje Host `station.internal`, dla `/` i jego podścieżek, do właściwej aplikacji
  przez dostarczony kontroler.

  - Z Deployment `client` prywatny URL kontrolera z Host `station.internal` zwraca `north-107`.

  - Z Deployment `client` żądanie do tego kontrolera z Host `wrong.station.internal` kończy się błędem.


  Sam błąd żądania nie dowodzi jego przyczyny; sprawdzany jest bieżący routing, nie zmienione pola.

  '
debrief: Kontrole sprawdziły właściwą odpowiedź i nieudane żądanie z innym Host.
stages.0.brief: Oczekiwany Host ma otrzymywać wymaganą odpowiedź przez prywatny kontroler.
hints.0.text: Backend Ingress odwołuje się do portu Service, a nie do dowolnego portu kontenera.
hints.1.text: 'Sterownik musi obserwować wybrane IngressClass i namespace.


  Sprawdź dostarczone definicje, bieżące zasoby i zdarzenia.


  ```sh

  cat ingress.yaml

  kubectl describe ingress board

  cat ingress-target.json

  ```'
hints.2.text: 'Napraw backend na 8080 i przetestuj Host header poprzez kontroler, a nie bezpośrednio przez
  board Service.


  Sprawdź obserwowany wynik:


  ```sh

  url=$(jq -r .url /run/dq/facts/0/ingress-target.json)

  kubectl exec deployment/client -- wget -qO- -T 3 --header=''Host: station.internal'' "$url"

  kubectl exec deployment/client -- wget -qO- -T 3 --header=''Host: wrong.station.internal'' "$url"

  ```


  Oczekuj north-107 dla Host station.internal i nieudanego żądania dla wrong.station.internal przez ten sam
  prywatny kontroler.


  Dostarczone ograniczenia i szczegóły: Ingress `board` używa dostarczonej prywatnej klasy i kieruje Host `station.internal`,
  ścieżkę `/` typu `Prefix`, do zadeklarowanego portu HTTP Service `board`.'
phrases.0: Sprawdzałem niezależnie port class, host, path i Service.
phrases.1: Zweryfikowałem ruch poprzez kontroler ruchu przychodzącego.
phrases.2: Zaobserwowałem nieudane żądanie z błędnym Host.
questions.0.points.0: NIE; kontroler wejściowy musi uzgodnić wybrany class.
questions.0.points.1: Sprawdź gotowość kontrolera i faktyczne kierowanie żądań.
questions.0.prompt: Czy samo utworzenie Ingress obsługuje ruch HTTP?
questions.1.points.0: Nazwany lub numerowany port Service.
questions.1.points.1: Następnie Service mapuje go na swoje targetPort i endpoints.
questions.1.prompt: Który port wybiera backend?
