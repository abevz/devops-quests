title: Допуск ResourceQuota и LimitRange
brief: 'Шаблон board намеренно не содержит поля ресурсов: их должны задать значения namespace по умолчанию. LimitRange добавляет
  request 300m и limit 400m, превышая фиксированный бюджет ResourceQuota. Исправьте только значения CPU по умолчанию на request
  100m и limit 200m; сохраните значения памяти 16Mi/32Mi, quota и шаблон Deployment без ресурсов. Повторите выкатку и изучите
  фактически допущенный Pod. Значения по умолчанию действуют при новом допуске и не переписывают существующие Pod. Это допуск
  API; quota не создаёт ресурсы узла.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `client.json`, `quota.json`, `defaults.json`, `board.json`,
  `service.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы и приватные сервисы.
  Менять можно только эту песочницу.


  Прочитайте `quota.json`, `defaults.json`, `board.json`, `service.json` и `client.json`. Hard-спецификация ResourceQuota
  `station` должна точно содержать requests CPU `200m`, limits CPU `400m`, requests memory `32Mi`, limits memory `64Mi` и
  pods `2`. Первый элемент LimitRange `defaults` должен иметь CPU default `200m` и defaultRequest `100m`; resources первого
  контейнера Deployment должны быть пусты, одна реплика готова. Хотя бы один Pod `app=board`, не находящийся в процессе удаления,
  должен иметь ровно requests CPU `100m`/memory `16Mi`, limits CPU `200m`/memory `32Mi` и готовый контейнер. deployment/client
  должен получать `north-126` от `board:8080`. Проверка изучает память допущенного Pod, а не текущие значения памяти LimitRange;
  она не доказывает историю изменений.'
debrief: Политика defaults исправлена в пределах бюджета namespace; ресурсы scheduler остались отдельным ограничением.
stages.0.brief: Quota, значения CPU, шаблон Deployment, ресурсы допущенного готового Pod и HTTP-ответ соответствуют описанию.
stages.0.objectives.0.text: Quota, значения CPU, шаблон Deployment, ресурсы допущенного готового Pod и HTTP-ответ соответствуют
  описанию.
hints.0.text: Читайте события ReplicaSet, чтобы отличить отказ допуска от Pending при scheduling.
hints.1.text: LimitRange задаёт defaults до проверки потребления ResourceQuota.
hints.2.text: Исправьте defaults, повторите выкатку и смотрите resources Pod, а не только шаблона.
phrases.0: Я отличил отказ допуска от ошибки scheduling.
phrases.1: Я проверил ресурсы после применения defaults.
phrases.2: Я сохранил quota namespace.
questions.0.points.0: Defaults применяются при допуске новых Pod.
questions.0.points.1: Осознанно повторите создание или выкатку нагрузки.
questions.0.prompt: Меняет ли редактирование LimitRange существующие Pod?
questions.1.points.0: Quota — бюджет допуска namespace.
questions.1.points.1: Scheduler отдельно проверяет requests узлов и размещение.
questions.1.prompt: Совпадает ли исчерпание quota с нехваткой CPU узла?
diagnostics.quota: Hard-спецификация ResourceQuota station должна совпадать с quota.json.
diagnostics.default: Стандартный лимит CPU LimitRange defaults должен быть 200m.
diagnostics.request: Стандартный запрос CPU LimitRange defaults должен быть 100m.
diagnostics.ready: У Deployment board должна быть одна готовая реплика.
diagnostics.template: Шаблон первого контейнера board не должен иметь resources.
diagnostics.pod_requests: Pod board, не находящийся в процессе удаления, должен иметь точные запросы CPU и памяти из описания.
diagnostics.pod_limits: Pod board, не находящийся в процессе удаления, должен иметь точные лимиты CPU и памяти из описания.
diagnostics.pod_ready: У Pod board, не находящегося в процессе удаления, должен быть готовый контейнер.
diagnostics.same_pod: Один Pod board, не находящийся в процессе удаления, должен иметь все нужные ресурсы и готовый контейнер.
diagnostics.http: board:8080 должен вернуть north-126.
