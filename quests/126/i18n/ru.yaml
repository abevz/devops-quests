title: Допуск ResourceQuota и LimitRange
brief: 'Шаблон board намеренно не содержит resources: их должны задать defaults namespace.
  LimitRange добавляет request 300m и limit 400m, превышая фиксированный бюджет ResourceQuota.
  Исправьте только CPU defaults на request 100m и limit 200m; сохраните memory 16Mi/32Mi,
  quota и Deployment без resources. Повторите выкатку и изучите реально допущенный
  Pod. Defaults действуют при новом допуске, а не переписывают существующие Pod. Это
  допуск API; quota не создаёт ресурсы узла.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `client.json`,
  `quota.json`, `defaults.json`, `board.json`, `service.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно
  загруженные образы и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Допущенный готовый board получает CPU defaults 100m/200m и memory
  16Mi/32Mi при прежней quota и отдаёт north-126.'
debrief: Политика defaults исправлена в пределах бюджета namespace; ресурсы scheduler
  остались отдельным ограничением.
stages.0.brief: 'Результат проверки: Допущенный готовый board получает CPU defaults
