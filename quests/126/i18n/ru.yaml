title: Допуск ResourceQuota и LimitRange
brief: |-
  Нагрузки не достигают требуемого admitted-состояния в общем бюджете. Восстановите обоих потребителей, не заменяя заданную квоту.

  Работайте на workstation в `~/quest` с заданными входами подключения/результата: `admission-contract.json`. Определения нагрузок доступны в текущих объектах кластера.

  **Требования:**

  - ResourceQuota `station` сохраняет предоставленный бюджет: запросы CPU `200m`, лимиты CPU `400m`, запросы памяти `32Mi`, лимиты памяти `64Mi` и `2` Pod.
  - Предоставленные значения admission по умолчанию обеспечивают требуемый бюджет CPU приложению board без явного бюджета ресурсов в шаблоне Deployment. Эта политика CPU defaults и отсутствие явных ресурсных бюджетов применяются к обоим шаблонам Deployment. Сохраните их исходные идентичности, образы и по одной желаемой реплике, а также идентичность исходной квоты.
  - Deployment `board` имеет одну готовую реплику и не завершающийся Pod с готовым контейнером, запросом/лимитом CPU `100m`/`200m` и запросом/лимитом памяти `16Mi`/`32Mi` на том же Pod. У другой заданной нагрузки тоже ровно один текущий готовый Pod с теми же admitted-бюджетами CPU и памяти. Потребление namespace-квоты соответствует двум согласованным бюджетам потребителей.
  - Из Deployment `client` адрес `http://board:8080` возвращает `north-126`.

  Проверки наблюдают текущие идентичность/использование квоты, CPU defaults и admitted-память, а не текущие memory defaults или историю изменений. Непрерывная доступность не утверждается.
debrief: Политика defaults, ресурсы admitted Pod и замена контроллером живут отдельно. Перенесите CPU-модель через
  обоих потребителей, осознанно распределяя бюджет, а не расширяя квоту.
stages.0.brief: Не меняйте предоставленную квоту.
hints.0.text: Admission учитывает всех текущих потребителей. Defaults применяются к новым Pod; замена или surge
  могут потребовать бюджет до освобождения старого Pod.
hints.1.text: |-
  Сопоставьте использование квоты, defaults, текущие admitted-ресурсы и сообщения условий ReplicaSet. Одно ожидание не меняет несовместимый бюджет.

  ```sh
  cat admission-contract.json
  kubectl get resourcequota,limitrange,deployment,pods -o yaml
  kubectl get replicasets -o yaml
  kubectl describe resourcequota station
  ```
hints.2.text: |-
  Проверьте исходную квоту, оба шаблона на defaults, оба текущих набора admitted-ресурсов и ответ нагрузки. Использование должно соответствовать двум потребителям.

  ```sh
  kubectl get resourcequota station -o yaml
  kubectl get deployment client board -o yaml
  kubectl get pods -o yaml
  kubectl exec deployment/client -c worker -- wget -qO- -T 3 http://board:8080
  ```
phrases.0: Я отличил отказ допуска от ошибки scheduling.
phrases.1: Я проверил ресурсы после применения defaults.
phrases.2: Я сохранил quota namespace.
questions.0.points.0: Defaults применяются при допуске новых Pod.
questions.0.points.1: Осознанно повторите создание или выкатку нагрузки.
questions.0.prompt: Меняет ли редактирование LimitRange существующие Pod?
questions.1.points.0: Quota — бюджет допуска namespace.
questions.1.points.1: Scheduler отдельно проверяет requests узлов и размещение.
questions.1.prompt: Совпадает ли исчерпание quota с нехваткой CPU узла?
