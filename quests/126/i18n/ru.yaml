diagnostics.default: Стандартный лимит CPU LimitRange defaults должен быть 200m.
diagnostics.request: Стандартный запрос CPU LimitRange defaults должен быть 100m.
diagnostics.ready: У Deployment board должна быть одна готовая реплика.
diagnostics.template: Шаблон worker в board не должен содержать явный бюджет ресурсов.
diagnostics.pod_requests: Pod board, не находящийся в процессе удаления, должен иметь точные запросы CPU
  и памяти из описания.
diagnostics.pod_limits: Pod board, не находящийся в процессе удаления, должен иметь точные лимиты CPU
  и памяти из описания.
diagnostics.pod_ready: У Pod board, не находящегося в процессе удаления, должен быть готовый контейнер.
diagnostics.same_pod: Один Pod board, не находящийся в процессе удаления, должен иметь все нужные ресурсы
  и готовый контейнер.
diagnostics.http: board:8080 должен вернуть north-126.
