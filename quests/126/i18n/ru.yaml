title: Допуск ResourceQuota и LimitRange
brief: |-
  Нагрузки не достигают требуемого admitted-состояния в общем бюджете. Восстановите обоих потребителей, не заменяя заданную квоту.

  Работайте на workstation в `~/quest` с заданными входами подключения/результата: `admission-contract.json`. Определения нагрузок доступны в текущих объектах кластера.

  **Требования:**

  - ResourceQuota `station` сохраняет предоставленный бюджет: запросы CPU `200m`, лимиты CPU `400m`, запросы памяти `32Mi`, лимиты памяти `64Mi` и `2` Pod.
  - Предоставленные значения admission по умолчанию обеспечивают требуемый бюджет CPU приложению board без явного бюджета ресурсов в шаблоне Deployment. Эта политика CPU defaults и отсутствие явных ресурсных бюджетов применяются к обоим шаблонам Deployment. Сохраните их исходные идентичности, образы и по одной желаемой реплике, а также идентичность исходной квоты.
  - Deployment `board` имеет одну готовую реплику и не завершающийся Pod с готовым контейнером, запросом/лимитом CPU `100m`/`200m` и запросом/лимитом памяти `16Mi`/`32Mi` на том же Pod. У другой заданной нагрузки тоже ровно один текущий готовый Pod с теми же admitted-бюджетами CPU и памяти. Потребление namespace-квоты соответствует двум согласованным бюджетам потребителей.
  - Из Deployment `client` адрес `http://board:8080` возвращает `north-126`.

  Проверки наблюдают текущие идентичность/использование квоты, CPU defaults и admitted-память, а не текущие memory defaults или историю изменений. Непрерывная доступность не утверждается.
debrief: Политика defaults, ресурсы admitted Pod и замена контроллером живут отдельно. Перенесите CPU-модель через
  обоих потребителей, осознанно распределяя бюджет, а не расширяя квоту.
stages.0.brief: Не меняйте предоставленную квоту.
hints.0.text: Admission учитывает всех текущих потребителей. Defaults применяются к новым Pod; замена или surge
  могут потребовать бюджет до освобождения старого Pod.
hints.1.text: |-
  Сопоставьте использование квоты, defaults, текущие admitted-ресурсы и сообщения условий ReplicaSet. Одно ожидание не меняет несовместимый бюджет.

  ```sh
  cat admission-contract.json
  kubectl get resourcequota,limitrange,deployment,pods -o yaml
  kubectl get replicasets -o yaml
  kubectl describe resourcequota station
  ```
hints.2.text: |-
  Проверьте исходную квоту, оба шаблона на defaults, оба текущих набора admitted-ресурсов и ответ нагрузки. Использование должно соответствовать двум потребителям.

  ```sh
  kubectl get resourcequota station -o yaml
  kubectl get deployment client board -o yaml
  kubectl get pods -o yaml
  kubectl exec deployment/client -c worker -- wget -qO- -T 3 http://board:8080
  ```
phrases.0: Я отличил отказ допуска от ошибки scheduling.
phrases.1: Я проверил ресурсы после применения defaults.
phrases.2: Я сохранил quota namespace.
questions.0.points.0: Defaults применяются при допуске новых Pod.
questions.0.points.1: Осознанно повторите создание или выкатку нагрузки.
questions.0.prompt: Меняет ли редактирование LimitRange существующие Pod?
questions.1.points.0: Quota — бюджет допуска namespace.
questions.1.points.1: Scheduler отдельно проверяет requests узлов и размещение.
questions.1.prompt: Совпадает ли исчерпание quota с нехваткой CPU узла?
stages.0.objectives.0.text: 'ResourceQuota `station` сохраняет предоставленный бюджет: запросы CPU `200m`, лимиты
  CPU `400m`, запросы памяти `32Mi`, лимиты памяти `64Mi` и `2` Pod.'
stages.0.objectives.1.text: Предоставленные значения admission по умолчанию обеспечивают требуемый бюджет CPU приложению
  board без явного бюджета ресурсов в шаблоне Deployment. Эта политика CPU defaults и отсутствие явных ресурсных
  бюджетов применяются к обоим шаблонам Deployment. Сохраните их исходные идентичности, образы и по одной желаемой
  реплике, а также идентичность исходной квоты.
stages.0.objectives.2.text: Deployment `board` имеет одну готовую реплику и не завершающийся Pod с готовым контейнером,
  запросом/лимитом CPU `100m`/`200m` и запросом/лимитом памяти `16Mi`/`32Mi` на том же Pod. У другой заданной нагрузки
  тоже ровно один текущий готовый Pod с теми же admitted-бюджетами CPU и памяти. Потребление namespace-квоты соответствует
  двум согласованным бюджетам потребителей.
stages.0.objectives.3.text: Из Deployment `client` адрес `http://board:8080` возвращает `north-126`.
diagnostics.quota: ResourceQuota station мог отсутствовать или содержать другие значения hard. Сверьте запросы CPU 200m и памяти 32Mi, лимиты CPU 400m и памяти 64Mi и число Pod 2. [Причина и проверка](guides#guide=admission-metrics&section=q126-station-quota-budget)
diagnostics.probe_0_0: Проверка квоты могла остановиться до вывода конкретного условия. Убедитесь, что упражнение может прочитать текущую ResourceQuota station. [Причина и проверка](guides#guide=admission-metrics&section=q126-station-quota-observer)
diagnostics.default: В LimitRange defaults может отсутствовать запись Container или в ней задан другой лимит CPU по умолчанию. Проверьте значение 200m. [Причина и проверка](guides#guide=admission-metrics&section=q126-station-limitrange-default)
diagnostics.request: В LimitRange defaults может отсутствовать запись Container или в ней задан другой запрос CPU по умолчанию. Проверьте значение 100m. [Причина и проверка](guides#guide=admission-metrics&section=q126-station-limitrange-request)
diagnostics.template: Шаблон board может явно задавать resources для worker, либо worker отсутствует. Оставьте resources в шаблоне пустым, чтобы значения подставила admission-проверка. [Причина и проверка](guides#guide=admission-metrics&section=q126-station-board-empty-resources)
diagnostics.probe_0_1: Проверка правил admission могла остановиться до вывода конкретного условия. Проверьте LimitRange, квоту и Deployment в пространстве имён упражнения. [Причина и проверка](guides#guide=admission-metrics&section=q126-station-admission-policy-observer)
diagnostics.admission_identity: Защищённая ResourceQuota или Deployment могли исчезнуть или получить новый UID. Сравните текущие объекты с выданными исходными идентификаторами. [Причина и проверка](guides#guide=admission-metrics&section=q126-station-retained-admission-objects)
diagnostics.admission_template: Шаблон board или client мог отклониться от контракта. Проверьте число реплик, исходный образ worker и пустое поле resources для значений admission. [Причина и проверка](guides#guide=admission-metrics&section=q126-station-retained-admission-templates)
diagnostics.ready: Deployment board может ещё обновляться, или число готовых реплик отличается от одной. Проверьте текущее состояние. [Причина и проверка](guides#guide=admission-metrics&section=q126-station-board-ready-replica)
diagnostics.pod_requests: У worker ни в одном действующем Pod board могут не быть одновременно заданы запросы CPU 100m и памяти 16Mi. Проверьте spec созданного Pod. [Причина и проверка](guides#guide=admission-metrics&section=q126-station-admitted-worker-requests)
diagnostics.pod_limits: У worker ни в одном действующем Pod board могут не быть одновременно заданы лимиты CPU 200m и памяти 32Mi. Проверьте spec созданного Pod. [Причина и проверка](guides#guide=admission-metrics&section=q126-station-admitted-worker-limits)
diagnostics.pod_ready: Worker может быть не готов во всех действующих Pod board. Проверьте готовность контейнера в текущих Pod. [Причина и проверка](guides#guide=admission-metrics&section=q126-station-admitted-worker-readiness)
diagnostics.same_pod: Ожидаемые requests, limits и готовность могли оказаться в разных Pod. Найдите один действующий Pod board, у которого worker выполняет все три условия. [Причина и проверка](guides#guide=admission-metrics&section=q126-station-admitted-single-example)
diagnostics.admission_client: Rollout client может быть устаревшим, относиться к изменённой нагрузке или содержать текущий worker с другими ресурсами либо неготовым состоянием. Проверьте поколение Deployment, цепочку владения и созданный Pod. [Причина и проверка](guides#guide=admission-metrics&section=q126-station-admitted-client)
diagnostics.admission_usage: Контроллер квоты может ещё пересчитывать потребление, или ресурсы созданных нагрузок отличаются от бюджета. Когда board и client стабилизируются, сравните requests, limits и число Pod в status.used. [Причина и проверка](guides#guide=admission-metrics&section=q126-station-observed-quota-usage)
diagnostics.probe_0_2: Проверка результата admission могла остановиться до вывода конкретного условия. Проверьте доступность данных квоты, нагрузок и созданных Pod. [Причина и проверка](guides#guide=admission-metrics&section=q126-station-admitted-pods-observer)
diagnostics.http: Созданный client может не достучаться до board:8080 или получить ответ, отличный от north-126. Проверьте фактический запрос из client. [Причина и проверка](guides#guide=admission-metrics&section=q126-station-admitted-board-http)
