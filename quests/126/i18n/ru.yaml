title: Допуск ResourceQuota и LimitRange
brief: |-
  Нагрузка board не становится готовой в пределах бюджета admission. Восстановите требуемые допущенные ресурсы без изменения предоставленной квоты.

  Работайте на workstation в `~/quest` с предоставленными файлами:
  - `client.yaml`, `quota.yaml`, `defaults.yaml`, `board.yaml`, `service.yaml`.

  **Requirements:**

  - Сохраните согласованный бюджет ресурсов:
    - ResourceQuota `station` сохраняет предоставленный бюджет: запросы CPU `200m`, лимиты CPU `400m`, запросы памяти `32Mi`, лимиты памяти `64Mi` и `2` Pod.
  - Предоставленные значения admission по умолчанию обеспечивают требуемый бюджет CPU приложению board без явного бюджета ресурсов в шаблоне Deployment.
  - Deployment `board` имеет одну готовую реплику и не завершающийся Pod с готовым контейнером, запросом/лимитом CPU `100m`/`200m` и запросом/лимитом памяти `16Mi`/`32Mi` на том же Pod.
  - Из Deployment `client` адрес `http://board:8080` возвращает `north-126`.

  Проверка исследует память допущенного Pod, а не текущие значения памяти по умолчанию LimitRange или историю правок; квота admission не создаёт ёмкость узла.
debrief: Политика defaults исправлена в пределах бюджета namespace; ресурсы scheduler остались отдельным
  ограничением.
stages.0.brief: Не меняйте предоставленную квоту.
hints.0.text: Читайте события ReplicaSet, чтобы отличить отказ допуска от Pending при scheduling.
hints.1.text: |-
  LimitRange задаёт defaults до проверки потребления ResourceQuota. Предоставленные значения CPU по умолчанию — запрос `300m` и лимит `400m`, превышающие фиксированную квоту. Значения по умолчанию действуют на новые допускаемые Pod, а не существующие.

  Изучите предоставленные файлы и живые наблюдения:

  ```sh
  kubectl get resourcequota station -o yaml
    kubectl get limitrange defaults -o yaml
    kubectl get deployment board -o yaml
  ```
hints.2.text: |-
  Исправьте defaults, повторите выкатку и смотрите resources Pod, а не только шаблона.

  Проверьте результат из `~/quest` на workstation:

  - `kubectl get pods -l app=board -o yaml` — Один не завершающийся Pod имеет одновременно требуемые ресурсы и готовый контейнер.

  - `kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080` — Потребитель получает `north-126`.
phrases.0: Я отличил отказ допуска от ошибки scheduling.
phrases.1: Я проверил ресурсы после применения defaults.
phrases.2: Я сохранил quota namespace.
questions.0.points.0: Defaults применяются при допуске новых Pod.
questions.0.points.1: Осознанно повторите создание или выкатку нагрузки.
questions.0.prompt: Меняет ли редактирование LimitRange существующие Pod?
questions.1.points.0: Quota — бюджет допуска namespace.
questions.1.points.1: Scheduler отдельно проверяет requests узлов и размещение.
questions.1.prompt: Совпадает ли исчерпание quota с нехваткой CPU узла?
