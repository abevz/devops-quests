title: Cuota y admisión LimitRange
brief: 'La plantilla board omite intencionalmente campos de recursos para que namespace defaults pueda
  proporcionarlos. El LimitRange inyecta request 300m y limit 400m, superando el presupuesto fijo de ResourceQuota.
  Repare únicamente los modelos CPU defaults a request 100m y limit 200m; conserve memory defaults 16Mi/32Mi,
  el quota y la plantilla Deployment sin recursos. Vuelva a intentar la implementación y inspect es el
  Pod real admitido. Defaults afecta a los Pods recién admitidos; cambiarlos no reescribe los Pods existentes.
  Esta es una admisión de API, no una afirmación de que quota cree capacidad de nodo.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `client.json`, `quota.json`,
  `defaults.json`, `board.json`, `service.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: Un board admitido y listo recibe CPU defaults 100m/200m y memory 16Mi/32Mi
  bajo el quota sin cambios y sirve para north-126.'
debrief: La póliza morosa fue reparada dentro del presupuesto namespace; La capacidad de scheduler siguió
  siendo una limitación separada.
