title: Cuota y admisión LimitRange
brief: "La carga board no está lista dentro del presupuesto de admisión. Restaure los recursos admitidos requeridos\
  \ sin cambiar la cuota suministrada.\n\nTrabaje en `~/quest` en la estación de trabajo. Archivos suministrados:\
  \ `client.json`, `quota.json`, `defaults.json`, `board.json`, `service.json`.\n\n**Requirements:**\n\n- ResourceQuota\
  \ `station` conserva el presupuesto suministrado: solicitudes CPU `200m`, límites CPU `400m`, solicitudes de memoria\
  \ `32Mi`, límites de memoria `64Mi` y `2` Pods.\n- LimitRange `defaults` proporciona los recursos CPU requeridos\
  \ cuando el contenedor de aplicación de la plantilla del Deployment `board` no tiene recursos explícitos.\n- El\
  \ Deployment `board` tiene una réplica lista y un Pod sin terminar con contenedor listo, solicitud/límite CPU\
  \ `100m`/`200m` y solicitud/límite de memoria `16Mi`/`32Mi`, todo en el mismo Pod.\n- Desde el Deployment `client`,\
  \ `http://board:8080` devuelve `north-126`.\n\n**Verify yourself before Check & finish:** Ejecute estos comandos\
  \ de observación desde `~/quest` en la estación de trabajo.\n\n- La configuración, identidades y estado cumplen\
  \ los requisitos.\n\n  ```sh\n  kubectl get resourcequota station -o yaml\n  kubectl get limitrange defaults -o\
  \ yaml\n  kubectl get deployment board -o yaml\n  ```\n\n- `kubectl get pods -l app=board -o yaml` — Un Pod sin\
  \ terminar tiene juntos los recursos requeridos y un contenedor listo.\n\n- `kubectl exec deployment/client --\
  \ wget -qO- -T 3 http://board:8080` — El consumidor recibe `north-126`.\n\nLa comprobación inspecciona la memoria\
  \ del Pod admitido, no los valores actuales de memoria de LimitRange ni el historial; la cuota de admisión no\
  \ crea capacidad de nodo."
debrief: La póliza morosa fue reparada dentro del presupuesto namespace; La capacidad de scheduler siguió siendo
  una limitación separada.
stages.0.brief: El Pod board admitido debe estar listo dentro del presupuesto fijo de recursos.
hints.0.text: Lea los eventos ReplicaSet para distinguir el rechazo de admisión del Pending scheduling.
hints.1.text: LimitRange suministra defaults antes de que ResourceQuota evalúe el consumo. Los valores CPU suministrados
  solicitan `300m` y limitan a `400m`, superando la cuota fija. Los valores afectan a Pods recién admitidos, no
  a los existentes.
hints.2.text: Repare defaults, vuelva a intentar la implementación y inspect Pod resources en lugar de solo su plantilla.
phrases.0: Distinguí el fracaso de admisión del fracaso de scheduling.
phrases.1: Revisé los recursos después de incumplir.
phrases.2: Conservé el namespace quota.
questions.0.points.0: Defaults se aplica durante la admisión de nuevos Pods.
questions.0.points.1: Vuelva a intentar o recrear deliberadamente la carga de trabajo prevista.
questions.0.prompt: ¿La edición de un LimitRange cambia los Pods existentes?
questions.1.points.0: Quota es un presupuesto de admisión namespace.
questions.1.points.1: El programador verifica por separado el nodo requests y su ubicación.
questions.1.prompt: ¿El agotamiento de quota es lo mismo que el nodo insuficiente CPU?
diagnostics.quota: La especificación hard de ResourceQuota station debe coincidir con quota.json.
diagnostics.default: El límite CPU predeterminado del LimitRange defaults debe ser 200m.
diagnostics.request: La solicitud CPU predeterminada del LimitRange defaults debe ser 100m.
diagnostics.ready: Deployment board debe tener una réplica lista.
diagnostics.template: La plantilla del primer contenedor board no debe tener resources.
diagnostics.pod_requests: Un Pod board no marcado para eliminación debe tener las solicitudes exactas de CPU y memoria
  de la descripción.
diagnostics.pod_limits: Un Pod board no marcado para eliminación debe tener los límites exactos de CPU y memoria
  de la descripción.
diagnostics.pod_ready: Un Pod board no marcado para eliminación debe tener un contenedor listo.
diagnostics.same_pod: Un mismo Pod board no marcado para eliminación debe tener todos los recursos requeridos y
  un contenedor listo.
diagnostics.http: board:8080 debe devolver north-126.
