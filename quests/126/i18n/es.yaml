title: Cuota y admisión LimitRange
brief: |-
  La carga board no está lista dentro del presupuesto de admisión. Restaure los recursos admitidos requeridos sin cambiar la cuota suministrada.

  Trabaja en la workstation en `~/quest` con los archivos suministrados:
  - `client.yaml`, `quota.yaml`, `defaults.yaml`, `board.yaml`, `service.yaml`.

  **Requirements:**

  - Conserva el presupuesto de recursos acordado:
    - ResourceQuota `station` conserva el presupuesto suministrado: solicitudes CPU `200m`, límites CPU `400m`, solicitudes de memoria `32Mi`, límites de memoria `64Mi` y `2` Pods.
  - Los valores predeterminados de admisión suministrados proporcionan el presupuesto CPU requerido a la aplicación board sin un presupuesto explícito en su plantilla Deployment.
  - El Deployment `board` tiene una réplica lista y un Pod sin terminar con contenedor listo, solicitud/límite CPU `100m`/`200m` y solicitud/límite de memoria `16Mi`/`32Mi`, todo en el mismo Pod.
  - Desde el Deployment `client`, `http://board:8080` devuelve `north-126`.

  La comprobación inspecciona la memoria del Pod admitido, no los valores actuales de memoria de LimitRange ni el historial; la cuota de admisión no crea capacidad de nodo.
debrief: La póliza morosa fue reparada dentro del presupuesto namespace; La capacidad de scheduler siguió
  siendo una limitación separada.
stages.0.brief: Conserva la cuota suministrada sin cambios.
hints.0.text: Lea los eventos ReplicaSet para distinguir el rechazo de admisión del Pending scheduling.
hints.1.text: |-
  LimitRange suministra defaults antes de que ResourceQuota evalúe el consumo. Los valores CPU suministrados solicitan `300m` y limitan a `400m`, superando la cuota fija. Los valores afectan a Pods recién admitidos, no a los existentes.

  Inspecciona los datos suministrados y las observaciones activas:

  ```sh
  kubectl get resourcequota station -o yaml
    kubectl get limitrange defaults -o yaml
    kubectl get deployment board -o yaml
  ```
hints.2.text: |-
  Repare defaults, vuelva a intentar la implementación y inspect Pod resources en lugar de solo su plantilla.

  Verifica el resultado desde `~/quest` en la workstation:

  - `kubectl get pods -l app=board -o yaml` — Un Pod sin terminar tiene juntos los recursos requeridos y un contenedor listo.

  - `kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080` — El consumidor recibe `north-126`.
phrases.0: Distinguí el fracaso de admisión del fracaso de scheduling.
phrases.1: Revisé los recursos después de incumplir.
phrases.2: Conservé el namespace quota.
