title: Cuota y admisión LimitRange
brief: |-
  Las cargas no alcanzan el estado admitido requerido dentro del presupuesto compartido. Recupera ambos consumidores sin sustituir la cuota suministrada.

  Trabaja en la workstation en `~/quest` con las entradas de conexión/resultado: `admission-contract.json`. Las definiciones de cargas están en los objetos actuales del clúster.

  **Requisitos:**

  - ResourceQuota `station` conserva el presupuesto suministrado: solicitudes CPU `200m`, límites CPU `400m`, solicitudes de memoria `32Mi`, límites de memoria `64Mi` y `2` Pods.
  - Los valores predeterminados de admisión suministrados proporcionan el presupuesto CPU requerido a la aplicación board sin un presupuesto explícito en su plantilla Deployment. Esta política CPU por defecto y ausencia de presupuestos explícitos se aplican a ambas plantillas Deployment. Conserva identidades, imágenes y una réplica deseada de cada una, además de la identidad original de la cuota.
  - El Deployment `board` tiene una réplica lista y un Pod sin terminar con contenedor listo, solicitud/límite CPU `100m`/`200m` y solicitud/límite de memoria `16Mi`/`32Mi`, todo en el mismo Pod. La otra carga también tiene exactamente un Pod actual listo con los mismos presupuestos admitidos CPU y memoria. El consumo de cuota del namespace coincide con los dos presupuestos acordados.
  - Desde el Deployment `client`, `http://board:8080` devuelve `north-126`.

  Se observan identidad/uso de cuota, CPU defaults y memoria admitida actuales, no defaults de memoria ni historial. No se afirma disponibilidad ininterrumpida.
debrief: Política por defecto, recursos admitidos y reemplazo del controlador tienen vidas distintas. Propaga el
  modelo CPU por ambos consumidores secuenciando el presupuesto, sin ampliar cuota.
stages.0.brief: Conserva la cuota suministrada sin cambios.
hints.0.text: Admission cuenta todos los consumidores actuales. Los defaults se aplican a nuevas admisiones; reemplazo
  o surge puede necesitar presupuesto antes de liberarlo un Pod viejo.
hints.1.text: |-
  Compara uso de cuota, defaults, recursos admitidos actuales y mensajes de condiciones ReplicaSet. Esperar no modifica un presupuesto incompatible.

  ```sh
  cat admission-contract.json
  kubectl get resourcequota,limitrange,deployment,pods -o yaml
  kubectl get replicasets -o yaml
  kubectl describe resourcequota station
  ```
hints.2.text: |-
  Verifica cuota original, ambas plantillas basadas en defaults, ambos recursos admitidos y respuesta. El consumo debe corresponder a ambos consumidores.

  ```sh
  kubectl get resourcequota station -o yaml
  kubectl get deployment client board -o yaml
  kubectl get pods -o yaml
  kubectl exec deployment/client -c worker -- wget -qO- -T 3 http://board:8080
  ```

  ```sh
  kubectl get resourcequota station -o json | jq '{hard:.spec.hard, used:.status.used}'
  kubectl get limitrange defaults -o json | jq '.spec.limits[] | select(.type=="Container") | {default,defaultRequest}'
  kubectl get deployment board client -o json | jq '.items[] | {name:.metadata.name, ready:.status.readyReplicas, resources:(.spec.template.spec.containers[] | select(.name=="worker") | .resources)}'
  kubectl get rs -o json | jq '.items[] | {name:.metadata.name, uid:.metadata.uid, owners:.metadata.ownerReferences}'
  kubectl get pods -o json | jq '.items[] | select(.metadata.deletionTimestamp==null) | {pod:.metadata.name, owners:.metadata.ownerReferences, resources:(.spec.containers[] | select(.name=="worker") | .resources), ready:(.status.containerStatuses[]? | select(.name=="worker") | .ready)}'
  ```

  La cuota station coincide con el presupuesto y refleja el uso de los dos consumidores. LimitRange asigna una solicitud de CPU de 100m y un límite de 200m. En las dos plantillas de Deployment, worker usa los valores por defecto. Sigue el ReplicaSet de cada worker en ejecución hasta su Deployment actual y comprueba las solicitudes, los límites y la disponibilidad frente al contrato. La petición desde client devuelve north-126.
phrases.0: Distinguí el fracaso de admisión del fracaso de scheduling.
phrases.1: Revisé los recursos después de incumplir.
phrases.2: Conservé el namespace quota.
questions.0.points.0: Defaults se aplica durante la admisión de nuevos Pods.
questions.0.points.1: Vuelva a intentar o recrear deliberadamente la carga de trabajo prevista.
questions.0.prompt: ¿La edición de un LimitRange cambia los Pods existentes?
questions.1.points.0: Quota es un presupuesto de admisión namespace.
questions.1.points.1: El programador verifica por separado el nodo requests y su ubicación.
questions.1.prompt: ¿El agotamiento de quota es lo mismo que el nodo insuficiente CPU?
