hints.0.text: Lea los eventos ReplicaSet para distinguir el rechazo de admisión del Pending scheduling.
hints.1.text: LimitRange suministra defaults antes de que ResourceQuota evalúe el consumo.
hints.2.text: Repare defaults, vuelva a intentar la implementación y inspect Pod resources en lugar de
  solo su plantilla.
phrases.0: Distinguí el fracaso de admisión del fracaso de scheduling.
phrases.1: Revisé los recursos después de incumplir.
phrases.2: Conservé el namespace quota.
questions.0.points.0: Defaults se aplica durante la admisión de nuevos Pods.
questions.0.points.1: Vuelva a intentar o recrear deliberadamente la carga de trabajo prevista.
questions.0.prompt: ¿La edición de un LimitRange cambia los Pods existentes?
questions.1.points.0: Quota es un presupuesto de admisión namespace.
questions.1.points.1: El programador verifica por separado el nodo requests y su ubicación.
questions.1.prompt: ¿El agotamiento de quota es lo mismo que el nodo insuficiente CPU?
