diagnostics.quota: Puede faltar el ResourceQuota station o sus valores hard pueden diferir de las solicitudes de CPU 200m y memoria 32Mi, los límites de CPU 400m y memoria 64Mi y los 2 Pods. [Causa y comprobación](guides#guide=admission-metrics&section=q126-station-quota-budget)
diagnostics.probe_0_0: La comprobación de cuota puede haberse detenido antes de indicar una condición. Confirma que el ejercicio puede leer el ResourceQuota station actual. [Causa y comprobación](guides#guide=admission-metrics&section=q126-station-quota-observer)
diagnostics.default: Puede faltar la entrada Container en el LimitRange defaults o puede tener otro límite de CPU predeterminado. Comprueba el valor 200m. [Causa y comprobación](guides#guide=admission-metrics&section=q126-station-limitrange-default)
diagnostics.request: Puede faltar la entrada Container en el LimitRange defaults o puede tener otra solicitud de CPU predeterminada. Comprueba el valor 100m. [Causa y comprobación](guides#guide=admission-metrics&section=q126-station-limitrange-request)
diagnostics.template: La plantilla de board puede fijar resources en worker o puede faltar worker. Deja resources vacío en la plantilla para que la admisión aplique los valores predeterminados. [Causa y comprobación](guides#guide=admission-metrics&section=q126-station-board-empty-resources)
diagnostics.probe_0_1: La comprobación de la política de admisión puede haberse detenido antes de indicar una condición. Comprueba LimitRange, la cuota y los Deployments del ejercicio. [Causa y comprobación](guides#guide=admission-metrics&section=q126-station-admission-policy-observer)
diagnostics.admission_identity: Puede faltar un ResourceQuota o Deployment protegido o puede tener otro UID. Compara los objetos actuales con el registro de identidades proporcionado. [Causa y comprobación](guides#guide=admission-metrics&section=q126-station-retained-admission-objects)
diagnostics.admission_template: La plantilla de board o client puede diferir del contrato. Comprueba el número de réplicas, la imagen original de worker y el campo resources vacío para la admisión. [Causa y comprobación](guides#guide=admission-metrics&section=q126-station-retained-admission-templates)
diagnostics.ready: El Deployment board puede seguir reconciliándose o tener un número de réplicas listas distinto de uno. Comprueba el estado actual. [Causa y comprobación](guides#guide=admission-metrics&section=q126-station-board-ready-replica)
diagnostics.pod_requests: Puede que ningún Pod de board que siga activo tenga en worker solicitudes de CPU 100m y memoria 16Mi. Comprueba la especificación del Pod admitido. [Causa y comprobación](guides#guide=admission-metrics&section=q126-station-admitted-worker-requests)
diagnostics.pod_limits: Puede que ningún Pod de board que siga activo tenga en worker límites de CPU 200m y memoria 32Mi. Comprueba la especificación del Pod admitido. [Causa y comprobación](guides#guide=admission-metrics&section=q126-station-admitted-worker-limits)
diagnostics.pod_ready: El worker puede seguir sin estar listo en todos los Pods activos de board. Comprueba la disponibilidad del contenedor en los Pods actuales. [Causa y comprobación](guides#guide=admission-metrics&section=q126-station-admitted-worker-readiness)
diagnostics.same_pod: Las solicitudes, los límites y la disponibilidad esperados pueden aparecer en distintos Pods. Busca un Pod activo de board cuyo worker cumpla las tres condiciones. [Causa y comprobación](guides#guide=admission-metrics&section=q126-station-admitted-single-example)
diagnostics.admission_client: El despliegue de client puede estar desactualizado, corresponder a una carga modificada o incluir un worker actual con recursos o disponibilidad inesperados. Comprueba la generación del Deployment, la cadena de propietarios y el Pod admitido. [Causa y comprobación](guides#guide=admission-metrics&section=q126-station-admitted-client)
diagnostics.admission_usage: El controlador de cuota puede seguir reconciliando el estado o el uso de las cargas admitidas puede diferir del presupuesto. Cuando board y client se estabilicen, compara las solicitudes, límites y Pods en status.used. [Causa y comprobación](guides#guide=admission-metrics&section=q126-station-observed-quota-usage)
diagnostics.probe_0_2: La observación de la admisión puede haberse detenido antes de indicar una condición. Comprueba las lecturas de cuota y cargas y la disponibilidad de los Pods admitidos. [Causa y comprobación](guides#guide=admission-metrics&section=q126-station-admitted-pods-observer)
diagnostics.http: El client admitido puede no llegar a board:8080 o no recibir la respuesta esperada north-126. Comprueba la solicitud real desde client. [Causa y comprobación](guides#guide=admission-metrics&section=q126-station-admitted-board-http)
