title: Quota and LimitRange admission
brief: |-
  The workloads are not reaching their required admitted state within the shared budget. Recover both consumers without replacing the supplied quota.

  Work on the workstation in `~/quest` with the supplied connection/result inputs: `admission-contract.json`. Existing cluster objects provide the workload definitions.

  **Requirements:**

  - ResourceQuota `station` retains the supplied budget: CPU requests `200m`, CPU limits `400m`, memory requests `32Mi`, memory limits `64Mi` and `2` Pods.
  - The supplied admission defaults provide the required CPU budget to the board application without an explicit resource budget in its Deployment template. This default CPU policy and absence of explicit resource budgets apply to both supplied Deployment templates. Keep their original identities, images and one desired replica each, together with the original quota identity.
  - Deployment `board` has one ready replica and a nonterminating Pod with a ready container, CPU request/limit `100m`/`200m` and memory request/limit `16Mi`/`32Mi`, all on that same Pod. The other supplied workload also has exactly one current ready Pod with the same admitted CPU and memory budgets. Namespace quota consumption matches the two agreed consumer budgets.
  - From Deployment `client`, `http://board:8080` returns `north-126`.

  Checks observe current quota identity/usage, CPU defaults and admitted memory, not current memory defaults or editing history. No uninterrupted-availability claim is made.
debrief: Default policy, admitted Pod resources and controller replacement are separate lifetimes. Propagate the
  CPU model through both consumers with deliberate budget sequencing instead of expanding the quota.
stages.0.brief: Keep the supplied quota unchanged.
hints.0.text: Admission accounts for all current consumers. Defaults apply to new admissions, and a replacement
  or surge can require budget before an old Pod releases it.
hints.1.text: |-
  Compare quota usage, default policy, current admitted resources and ReplicaSet condition messages. Waiting alone does not change an incompatible budget.

  ```sh
  cat admission-contract.json
  kubectl get resourcequota,limitrange,deployment,pods -o yaml
  kubectl get replicasets -o yaml
  kubectl describe resourcequota station
  ```
hints.2.text: |-
  Verify the original quota, both default-driven templates, both current admitted resource sets and the workload response. Reported usage must match those two consumers.

  ```sh
  kubectl get resourcequota station -o yaml
  kubectl get deployment client board -o yaml
  kubectl get pods -o yaml
  kubectl exec deployment/client -c worker -- wget -qO- -T 3 http://board:8080
  ```

  ```sh
  kubectl get resourcequota station -o json | jq '{hard:.spec.hard, used:.status.used}'
  kubectl get limitrange defaults -o json | jq '.spec.limits[] | select(.type=="Container") | {default,defaultRequest}'
  kubectl get deployment board client -o json | jq '.items[] | {name:.metadata.name, ready:.status.readyReplicas, resources:(.spec.template.spec.containers[] | select(.name=="worker") | .resources)}'
  kubectl get rs -o json | jq '.items[] | {name:.metadata.name, uid:.metadata.uid, owners:.metadata.ownerReferences}'
  kubectl get pods -o json | jq '.items[] | select(.metadata.deletionTimestamp==null) | {pod:.metadata.name, owners:.metadata.ownerReferences, resources:(.spec.containers[] | select(.name=="worker") | .resources), ready:(.status.containerStatuses[]? | select(.name=="worker") | .ready)}'
  ```

  Quota station matches the supplied budget and reports usage for both consumers. LimitRange supplies 100m request and 200m limit for CPU. In each Deployment template, worker uses the supplied defaults. Trace each running worker back to its current Deployment via its ReplicaSet and compare its requests, limits and readiness with the contract. The request from client returns north-126.
phrases.0: I distinguished admission failure from scheduling failure.
phrases.1: I checked resources after defaulting.
phrases.2: I preserved the namespace quota.
questions.0.points.0: Defaults apply during admission of new Pods.
questions.0.points.1: Retry or recreate the intended workload deliberately.
questions.0.prompt: Does editing a LimitRange change existing Pods?
questions.1.points.0: Quota is a namespace admission budget.
questions.1.points.1: The scheduler separately checks node requests and placement.
questions.1.prompt: Is quota exhaustion the same as insufficient node CPU?
