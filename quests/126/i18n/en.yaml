title: Quota and LimitRange admission
brief: "The board workload is not becoming ready within its admission budget. Restore the required admitted resources\
  \ without changing the supplied quota.\n\nWork in `~/quest` on the workstation. Supplied files: `client.json`,\
  \ `quota.json`, `defaults.json`, `board.json`, `service.json`.\n\n**Requirements:**\n\n- ResourceQuota `station`\
  \ retains the supplied budget: CPU requests `200m`, CPU limits `400m`, memory requests `32Mi`, memory limits `64Mi`\
  \ and `2` Pods.\n- LimitRange `defaults` supplies the required CPU resources when the application container in\
  \ the `board` Deployment template has no explicit resources.\n- Deployment `board` has one ready replica and a\
  \ nonterminating Pod with a ready container, CPU request/limit `100m`/`200m` and memory request/limit `16Mi`/`32Mi`,\
  \ all on that same Pod.\n- From Deployment `client`, `http://board:8080` returns `north-126`.\n\n**Verify yourself\
  \ before Check & finish:** Run these observation commands from `~/quest` on the workstation.\n\n- Settings, identities\
  \ and status match Requirements.\n\n  ```sh\n  kubectl get resourcequota station -o yaml\n  kubectl get limitrange\
  \ defaults -o yaml\n  kubectl get deployment board -o yaml\n  ```\n\n- `kubectl get pods -l app=board -o yaml`\
  \ — One nonterminating Pod has the required resources and a ready container together.\n\n- `kubectl exec deployment/client\
  \ -- wget -qO- -T 3 http://board:8080` — The consumer receives `north-126`.\n\nThe check inspects admitted Pod\
  \ memory, not current LimitRange memory defaults or edit history; admission quota does not create node capacity."
debrief: The defaulting policy was repaired within the namespace budget; scheduler capacity remained a separate
  constraint.
stages.0.brief: The admitted board Pod must be ready within the fixed resource budget.
hints.0.text: Read ReplicaSet events to distinguish admission rejection from Pending scheduling.
hints.1.text: LimitRange supplies defaults before ResourceQuota evaluates consumption. The supplied CPU defaults
  request `300m` and limit `400m`, exceeding the fixed quota. Defaults affect newly admitted Pods, not existing
  ones.
hints.2.text: Repair defaults, retry the rollout and inspect Pod resources rather than only its template.
phrases.0: I distinguished admission failure from scheduling failure.
phrases.1: I checked resources after defaulting.
phrases.2: I preserved the namespace quota.
questions.0.points.0: Defaults apply during admission of new Pods.
questions.0.points.1: Retry or recreate the intended workload deliberately.
questions.0.prompt: Does editing a LimitRange change existing Pods?
questions.1.points.0: Quota is a namespace admission budget.
questions.1.points.1: The scheduler separately checks node requests and placement.
questions.1.prompt: Is quota exhaustion the same as insufficient node CPU?
diagnostics.quota: ResourceQuota station hard spec must match quota.json.
diagnostics.default: LimitRange defaults CPU limit default must be 200m.
diagnostics.request: LimitRange defaults CPU request default must be 100m.
diagnostics.ready: Deployment board must have one ready replica.
diagnostics.template: The first board container template must have no resources.
diagnostics.pod_requests: A board Pod not marked for deletion must have the exact CPU and memory requests in the
  brief.
diagnostics.pod_limits: A board Pod not marked for deletion must have the exact CPU and memory limits in the brief.
diagnostics.pod_ready: A board Pod not marked for deletion must have a ready container.
diagnostics.same_pod: One board Pod not marked for deletion must have all required resources and a ready container.
diagnostics.http: board:8080 must return north-126.
stages.0.objectives.0.text: 'ResourceQuota `station` retains the supplied budget: CPU requests `200m`, CPU limits
  `400m`, memory requests `32Mi`, memory limits `64Mi` and `2` Pods.'
stages.0.objectives.1.text: LimitRange `defaults` supplies the required CPU resources when the application container
  in the `board` Deployment template has no explicit resources.
stages.0.objectives.2.text: Deployment `board` has one ready replica and a nonterminating Pod with a ready container,
  CPU request/limit `100m`/`200m` and memory request/limit `16Mi`/`32Mi`, all on that same Pod.
stages.0.objectives.3.text: From Deployment `client`, `http://board:8080` returns `north-126`.
