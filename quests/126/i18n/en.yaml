diagnostics.quota: The station ResourceQuota may be missing or its hard values may differ from CPU requests 200m, limits 400m, memory requests 32Mi, limits 64Mi and 2 Pods. [Cause and check](guides#guide=admission-metrics&section=q126-station-quota-budget)
diagnostics.probe_0_0: The quota observer may have stopped before reporting a condition. Confirm that the exercise can read the current ResourceQuota station. [Cause and check](guides#guide=admission-metrics&section=q126-station-quota-observer)
diagnostics.default: The Container entry in LimitRange defaults may be missing or use a different default CPU limit. Check for 200m. [Cause and check](guides#guide=admission-metrics&section=q126-station-limitrange-default)
diagnostics.request: The Container entry in LimitRange defaults may be missing or use a different default CPU request. Check for 100m. [Cause and check](guides#guide=admission-metrics&section=q126-station-limitrange-request)
diagnostics.template: The board worker template may explicitly set resources, or the worker may be missing. Leave resources empty in the template so that admission supplies the defaults. [Cause and check](guides#guide=admission-metrics&section=q126-station-board-empty-resources)
diagnostics.probe_0_1: The policy observer may have stopped before reporting a condition. Check the LimitRange, quota and Deployments in the exercise namespace. [Cause and check](guides#guide=admission-metrics&section=q126-station-admission-policy-observer)
diagnostics.admission_identity: A protected ResourceQuota or Deployment may be missing or have a different UID. Compare live objects with the supplied admission identity records. [Cause and check](guides#guide=admission-metrics&section=q126-station-retained-admission-objects)
diagnostics.admission_template: The board or client template may differ from the contract. Check the replica count, the original worker image and the empty resources field for admission defaults. [Cause and check](guides#guide=admission-metrics&section=q126-station-retained-admission-templates)
diagnostics.ready: The board Deployment may still be reconciling, or its ready count may differ from one. Check the current status. [Cause and check](guides#guide=admission-metrics&section=q126-station-board-ready-replica)
diagnostics.pod_requests: There may be no non-terminating board Pod with worker requests of CPU 100m and memory 16Mi. Check the admitted Pod spec. [Cause and check](guides#guide=admission-metrics&section=q126-station-admitted-worker-requests)
diagnostics.pod_limits: There may be no non-terminating board Pod with worker limits of CPU 200m and memory 32Mi. Check the admitted Pod spec. [Cause and check](guides#guide=admission-metrics&section=q126-station-admitted-worker-limits)
diagnostics.pod_ready: The worker may be unready on all non-terminating board Pods. Check container readiness on the current Pods. [Cause and check](guides#guide=admission-metrics&section=q126-station-admitted-worker-readiness)
diagnostics.same_pod: The expected requests, limits and readiness may occur in different Pods. Check for one non-terminating board Pod whose worker meets all three conditions. [Cause and check](guides#guide=admission-metrics&section=q126-station-admitted-single-example)
diagnostics.admission_client: The client rollout may be stale, point to a changed workload or contain a current worker with unexpected resources or readiness. Check the Deployment generation, current owner chain and admitted Pod. [Cause and check](guides#guide=admission-metrics&section=q126-station-admitted-client)
diagnostics.admission_usage: The quota controller may still be reconciling or the admitted workload usage may differ from the budget. Compare status.used for requests, limits and Pods after board and client settle. [Cause and check](guides#guide=admission-metrics&section=q126-station-observed-quota-usage)
diagnostics.probe_0_2: The live admission observer may have stopped before reporting a condition. Check quota and workload reads and the availability of the admitted Pods. [Cause and check](guides#guide=admission-metrics&section=q126-station-admitted-pods-observer)
diagnostics.http: The admitted client may be unable to reach board:8080 or receive the expected north-126 response. Check the live request from client. [Cause and check](guides#guide=admission-metrics&section=q126-station-admitted-board-http)
