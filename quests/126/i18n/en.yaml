title: Quota and LimitRange admission
brief: 'The board template intentionally omits resource fields so namespace defaults
  can supply them. The LimitRange injects request 300m and limit 400m, exceeding the
  fixed ResourceQuota budget. Repair only the CPU defaults to request 100m and limit
  200m; keep memory defaults 16Mi/32Mi, the quota and the resource-free Deployment
  template. Retry the rollout and inspect the actual admitted Pod. Defaults affect
  newly admitted Pods; changing them does not rewrite existing Pods. This is API admission,
  not a claim that quota creates node capacity.


  Quest files in `~/quest` (some appear in later stages): `client.json`, `quota.json`,
  `defaults.json`, `board.json`, `service.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images
  and private services. Change only this bay.


  Initial success criteria: An admitted ready board receives CPU defaults 100m/200m
  and memory 16Mi/32Mi under the unchanged quota and serves north-126.'
debrief: The defaulting policy was repaired within the namespace budget; scheduler
  capacity remained a separate constraint.
stages.0.brief: 'Success criteria: An admitted ready board receives CPU defaults 100m/200m
  and memory 16Mi/32Mi under the unchanged quota and serves north-126.'
stages.0.objectives.0.text: An admitted ready board receives CPU defaults 100m/200m
