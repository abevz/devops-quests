title: Quota and LimitRange admission
brief: 'The board template intentionally omits resource fields so namespace defaults can supply them. The LimitRange injects
  request 300m and limit 400m, exceeding the fixed ResourceQuota budget. Repair only the CPU defaults to request 100m and
  limit 200m; keep memory defaults 16Mi/32Mi, the quota and the resource-free Deployment template. Retry the rollout and inspect
  the actual admitted Pod. Defaults affect newly admitted Pods; changing them does not rewrite existing Pods. This is API
  admission, not a claim that quota creates node capacity.


  Quest files in `~/quest` (some appear in later stages): `client.json`, `quota.json`, `defaults.json`, `board.json`, `service.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services. Change only this
  bay.


  Read `quota.json`, `defaults.json`, `board.json`, `service.json` and `client.json`. The `station` ResourceQuota hard spec
  must exactly match requests CPU `200m`, limits CPU `400m`, requests memory `32Mi`, limits memory `64Mi` and pods `2`. The
  first `defaults` LimitRange entry must have CPU default `200m` and defaultRequest `100m`; the Deployment’s first-container
  resources must be empty and one replica ready. At least one `app=board` Pod not marked for deletion must have exactly requests
  CPU `100m`/memory `16Mi`, limits CPU `200m`/memory `32Mi`, and a ready container. deployment/client must receive `north-126`
  from `board:8080`. The check inspects admitted Pod memory, not the current LimitRange memory defaults; it does not prove
  the edit history.'
debrief: The defaulting policy was repaired within the namespace budget; scheduler capacity remained a separate constraint.
stages.0.brief: The quota, CPU defaults, Deployment template and admitted ready Pod resources and HTTP response match the
  brief.
stages.0.objectives.0.text: The quota, CPU defaults, Deployment template and admitted ready Pod resources and HTTP response
  match the brief.
hints.0.text: Read ReplicaSet events to distinguish admission rejection from Pending scheduling.
hints.1.text: LimitRange supplies defaults before ResourceQuota evaluates consumption.
hints.2.text: Repair defaults, retry the rollout and inspect Pod resources rather than only its template.
phrases.0: I distinguished admission failure from scheduling failure.
phrases.1: I checked resources after defaulting.
phrases.2: I preserved the namespace quota.
questions.0.points.0: Defaults apply during admission of new Pods.
questions.0.points.1: Retry or recreate the intended workload deliberately.
questions.0.prompt: Does editing a LimitRange change existing Pods?
questions.1.points.0: Quota is a namespace admission budget.
questions.1.points.1: The scheduler separately checks node requests and placement.
questions.1.prompt: Is quota exhaustion the same as insufficient node CPU?
diagnostics.quota: ResourceQuota station hard spec must match quota.json.
diagnostics.default: LimitRange defaults CPU limit default must be 200m.
diagnostics.request: LimitRange defaults CPU request default must be 100m.
diagnostics.ready: Deployment board must have one ready replica.
diagnostics.template: The first board container template must have no resources.
diagnostics.pod_requests: A board Pod not marked for deletion must have the exact CPU and memory requests in the brief.
diagnostics.pod_limits: A board Pod not marked for deletion must have the exact CPU and memory limits in the brief.
diagnostics.pod_ready: A board Pod not marked for deletion must have a ready container.
diagnostics.same_pod: One board Pod not marked for deletion must have all required resources and a ready container.
diagnostics.http: board:8080 must return north-126.
