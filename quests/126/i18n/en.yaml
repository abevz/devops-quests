title: Quota and LimitRange admission
brief: |-
  The board workload is not becoming ready within its admission budget. Restore the required admitted resources without changing the supplied quota.

  Work on the workstation in `~/quest` with the supplied files:
  - `client.yaml`, `quota.yaml`, `defaults.yaml`, `board.yaml`, `service.yaml`.

  **Requirements:**

  - Keep the agreed resource budget:
    - ResourceQuota `station` retains the supplied budget: CPU requests `200m`, CPU limits `400m`, memory requests `32Mi`, memory limits `64Mi` and `2` Pods.
  - The supplied admission defaults provide the required CPU budget to the board application without an explicit resource budget in its Deployment template.
  - Deployment `board` has one ready replica and a nonterminating Pod with a ready container, CPU request/limit `100m`/`200m` and memory request/limit `16Mi`/`32Mi`, all on that same Pod.
  - From Deployment `client`, `http://board:8080` returns `north-126`.

  The check inspects admitted Pod memory, not current LimitRange memory defaults or edit history; admission quota does not create node capacity.
debrief: The defaulting policy was repaired within the namespace budget; scheduler capacity remained a
  separate constraint.
stages.0.brief: Keep the supplied quota unchanged.
hints.0.text: Read ReplicaSet events to distinguish admission rejection from Pending scheduling.
hints.1.text: |-
  LimitRange supplies defaults before ResourceQuota evaluates consumption. The supplied CPU defaults request `300m` and limit `400m`, exceeding the fixed quota. Defaults affect newly admitted Pods, not existing ones.

  Inspect the supplied inputs and live observations:

  ```sh
  kubectl get resourcequota station -o yaml
    kubectl get limitrange defaults -o yaml
    kubectl get deployment board -o yaml
  ```
hints.2.text: |-
  Repair defaults, retry the rollout and inspect Pod resources rather than only its template.

  Verify the result from `~/quest` on the workstation:

  - `kubectl get pods -l app=board -o yaml` — One nonterminating Pod has the required resources and a ready container together.

  - `kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080` — The consumer receives `north-126`.
phrases.0: I distinguished admission failure from scheduling failure.
phrases.1: I checked resources after defaulting.
phrases.2: I preserved the namespace quota.
questions.0.points.0: Defaults apply during admission of new Pods.
questions.0.points.1: Retry or recreate the intended workload deliberately.
questions.0.prompt: Does editing a LimitRange change existing Pods?
questions.1.points.0: Quota is a namespace admission budget.
questions.1.points.1: The scheduler separately checks node requests and placement.
questions.1.prompt: Is quota exhaustion the same as insufficient node CPU?
diagnostics.quota: ResourceQuota station must retain the supplied CPU, memory and Pod budgets.
diagnostics.default: LimitRange defaults CPU limit default must be 200m.
diagnostics.request: LimitRange defaults CPU request default must be 100m.
diagnostics.ready: Deployment board must have one ready replica.
diagnostics.template: The board worker template must have no explicit resource budget.
diagnostics.pod_requests: A board Pod not marked for deletion must have the exact CPU and memory requests
  in the brief.
diagnostics.pod_limits: A board Pod not marked for deletion must have the exact CPU and memory limits
  in the brief.
diagnostics.pod_ready: A board Pod not marked for deletion must have a ready container.
diagnostics.same_pod: One board Pod not marked for deletion must have all required resources and a ready
  container.
diagnostics.http: board:8080 must return north-126.
