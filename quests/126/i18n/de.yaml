diagnostics.quota: Die ResourceQuota station fehlt möglicherweise oder ihre hard-Werte weichen ab. Prüfe CPU-Requests 200m, CPU-Limits 400m, Speicher-Requests 32Mi, Speicher-Limits 64Mi und 2 Pods. [Ursache und Prüfung](guides#guide=admission-metrics&section=q126-station-quota-budget)
diagnostics.probe_0_0: Die Quotenprüfung könnte vor Meldung einer Bedingung abgebrochen sein. Prüfe, ob die aktuelle ResourceQuota station lesbar ist. [Ursache und Prüfung](guides#guide=admission-metrics&section=q126-station-quota-observer)
diagnostics.default: Im LimitRange defaults fehlt möglicherweise der Container-Eintrag oder sein Standardlimit für CPU weicht ab. Prüfe den Wert 200m. [Ursache und Prüfung](guides#guide=admission-metrics&section=q126-station-limitrange-default)
diagnostics.request: Im LimitRange defaults fehlt möglicherweise der Container-Eintrag oder sein Standardrequest für CPU weicht ab. Prüfe den Wert 100m. [Ursache und Prüfung](guides#guide=admission-metrics&section=q126-station-limitrange-request)
diagnostics.template: Die board-Vorlage setzt möglicherweise resources für worker oder worker fehlt. Lass resources in der Vorlage leer, damit die Zulassung Standardwerte einträgt. [Ursache und Prüfung](guides#guide=admission-metrics&section=q126-station-board-empty-resources)
diagnostics.probe_0_1: Die Richtlinienprüfung könnte vor Meldung einer Bedingung abgebrochen sein. Prüfe LimitRange, Quote und Deployments im Übungs-Namespace. [Ursache und Prüfung](guides#guide=admission-metrics&section=q126-station-admission-policy-observer)
diagnostics.admission_identity: Eine geschützte ResourceQuota oder ein geschütztes Deployment fehlt möglicherweise oder hat eine andere UID. Vergleiche die aktuellen Objekte mit den bereitgestellten Identitätsdaten. [Ursache und Prüfung](guides#guide=admission-metrics&section=q126-station-retained-admission-objects)
diagnostics.admission_template: Die Vorlage von board oder client weicht möglicherweise vom Vertrag ab. Prüfe Replikatzahl, ursprüngliches worker-Image und das leere Feld resources für Zulassungsstandardwerte. [Ursache und Prüfung](guides#guide=admission-metrics&section=q126-station-retained-admission-templates)
diagnostics.ready: Das Deployment board ist möglicherweise noch im Abgleich oder die Zahl bereiter Replikate weicht von eins ab. Prüfe den aktuellen Zustand. [Ursache und Prüfung](guides#guide=admission-metrics&section=q126-station-board-ready-replica)
diagnostics.pod_requests: Möglicherweise hat kein board-Pod außerhalb der Beendigung für worker CPU-Requests von 100m und Speicher-Requests von 16Mi. Prüfe die zugelassene Pod-Spezifikation. [Ursache und Prüfung](guides#guide=admission-metrics&section=q126-station-admitted-worker-requests)
diagnostics.pod_limits: Möglicherweise hat kein board-Pod außerhalb der Beendigung für worker CPU-Limits von 200m und Speicher-Limits von 32Mi. Prüfe die zugelassene Pod-Spezifikation. [Ursache und Prüfung](guides#guide=admission-metrics&section=q126-station-admitted-worker-limits)
diagnostics.pod_ready: worker ist möglicherweise in allen board-Pods außerhalb der Beendigung noch nicht bereit. Prüfe die Containerbereitschaft in den aktuellen Pods. [Ursache und Prüfung](guides#guide=admission-metrics&section=q126-station-admitted-worker-readiness)
diagnostics.same_pod: Die erwarteten Requests, Limits und die Bereitschaft verteilen sich möglicherweise auf verschiedene Pods. Prüfe einen board-Pod außerhalb der Beendigung, dessen worker alle drei Bedingungen erfüllt. [Ursache und Prüfung](guides#guide=admission-metrics&section=q126-station-admitted-single-example)
diagnostics.admission_client: Der Rollout von client ist möglicherweise veraltet, gehört zu einem geänderten Workload oder enthält einen aktuellen worker mit unerwarteten Ressourcen oder fehlender Bereitschaft. Prüfe Deployment-Generation, Eigentümerkette und zugelassenen Pod. [Ursache und Prüfung](guides#guide=admission-metrics&section=q126-station-admitted-client)
diagnostics.admission_usage: Der Quotencontroller gleicht den Zustand möglicherweise noch ab oder der Verbrauch der zugelassenen Workloads weicht vom Budget ab. Vergleiche Requests, Limits und Pods in status.used, sobald board und client stabil sind. [Ursache und Prüfung](guides#guide=admission-metrics&section=q126-station-observed-quota-usage)
diagnostics.probe_0_2: Die Beobachtung der Zulassung könnte vor Meldung einer Bedingung abgebrochen sein. Prüfe, ob Quoten, Workloads und zugelassene Pods lesbar sind. [Ursache und Prüfung](guides#guide=admission-metrics&section=q126-station-admitted-pods-observer)
diagnostics.http: Der zugelassene client erreicht board:8080 möglicherweise nicht oder erhält nicht die erwartete Antwort north-126. Prüfe die tatsächliche Anfrage aus client. [Ursache und Prüfung](guides#guide=admission-metrics&section=q126-station-admitted-board-http)
