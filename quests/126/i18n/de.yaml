title: Kontingent und LimitRange-Zulassung
brief: 'Die Board-Vorlage lässt Ressourcenfelder bewusst weg, damit Namespace-Standards sie ergänzen. Die LimitRange fügt
  Request 300m und Limit 400m ein und überschreitet damit das feste ResourceQuota-Budget. Korrigiere nur die CPU-Standards
  auf Request 100m und Limit 200m; behalte Speicherstandards 16Mi/32Mi, Quota und die ressourcenfreie Deployment-Vorlage bei.
  Wiederhole den Rollout und prüfe den tatsächlich zugelassenen Pod. Standards betreffen neu zugelassene Pods; ihre Änderung
  schreibt bestehende Pods nicht um. Dies ist API-Admission, keine Aussage, dass eine Quota Node-Kapazität schafft.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `client.json`, `quota.json`, `defaults.json`, `board.json`,
  `service.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien, vorinstallierte Bilder
  und private Dienste. Ändern Sie nur diese Bucht.


  Lies `quota.json`, `defaults.json`, `board.json`, `service.json` und `client.json`. Die Hard-Spec der ResourceQuota `station`
  muss genau requests CPU `200m`, limits CPU `400m`, requests memory `32Mi`, limits memory `64Mi` und pods `2` entsprechen.
  Der erste LimitRange-Eintrag `defaults` muss CPU default `200m` und defaultRequest `100m` haben; die Ressourcen des ersten
  Deployment-Containers müssen leer und ein Replikat bereit sein. Mindestens ein nicht zum Löschen markierter Pod `app=board`
  muss genau requests CPU `100m`/memory `16Mi`, limits CPU `200m`/memory `32Mi` und einen bereiten Container haben. deployment/client
  muss von `board:8080` `north-126` erhalten. Die Prüfung prüft den Speicher des zugelassenen Pods, nicht die aktuellen LimitRange-Speicherstandards;
  sie beweist keine Änderungshistorie.'
debrief: Die fehlerhafte Richtlinie wurde im Rahmen des namespace-Budgets repariert. Die Kapazität von scheduler blieb eine
  separate Einschränkung.
stages.0.brief: Quota, CPU-Standards, Deployment-Vorlage, Ressourcen des zugelassenen bereiten Pods und HTTP-Antwort entsprechen
  der Beschreibung.
stages.0.objectives.0.text: Quota, CPU-Standards, Deployment-Vorlage, Ressourcen des zugelassenen bereiten Pods und HTTP-Antwort
  entsprechen der Beschreibung.
hints.0.text: Lesen Sie ReplicaSet-Ereignisse, um die Zulassungsablehnung von Pending scheduling zu unterscheiden.
hints.1.text: LimitRange liefert defaults, bevor ResourceQuota den Verbrauch auswertet.
hints.2.text: Reparieren Sie defaults, wiederholen Sie den Rollout und inspect Pod resources und nicht nur die Vorlage.
phrases.0: Ich habe den Zulassungsfehler vom scheduling-Fehler unterschieden.
phrases.1: Ich habe die Ressourcen nach der Standardeinstellung überprüft.
phrases.2: Ich habe den namespace quota erhalten.
questions.0.points.0: Defaults gelten bei der Zulassung neuer Pods.
questions.0.points.1: Versuchen Sie es erneut oder erstellen Sie die beabsichtigte Arbeitslast absichtlich neu.
questions.0.prompt: Ändert die Bearbeitung eines LimitRange vorhandene Pods?
questions.1.points.0: Quota ist ein namespace-Eintrittsbudget.
questions.1.points.1: Der Scheduler prüft den Knoten requests und seine Platzierung separat.
questions.1.prompt: Ist quota-Erschöpfung dasselbe wie unzureichender Knoten CPU?
diagnostics.quota: Die Hard-Spec der ResourceQuota station muss quota.json entsprechen.
diagnostics.default: Das CPU-Standardlimit der LimitRange defaults muss 200m sein.
diagnostics.request: Der CPU-Standardrequest der LimitRange defaults muss 100m sein.
diagnostics.ready: Deployment board muss ein bereites Replikat haben.
diagnostics.template: Die Vorlage des ersten Board-Containers darf keine resources haben.
diagnostics.pod_requests: Ein nicht zum Löschen markierter Board-Pod muss die genauen CPU- und Memory-Requests aus der Beschreibung
  haben.
diagnostics.pod_limits: Ein nicht zum Löschen markierter Board-Pod muss die genauen CPU- und Memory-Limits aus der Beschreibung
  haben.
diagnostics.pod_ready: Ein nicht zum Löschen markierter Board-Pod muss einen bereiten Container haben.
diagnostics.same_pod: Ein einzelner nicht zum Löschen markierter Board-Pod muss alle erforderlichen Ressourcen und einen bereiten
  Container haben.
diagnostics.http: board:8080 muss north-126 liefern.
