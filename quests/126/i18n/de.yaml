hints.0.text: Lesen Sie ReplicaSet-Ereignisse, um die Zulassungsablehnung von Pending scheduling zu unterscheiden.
hints.1.text: LimitRange liefert defaults, bevor ResourceQuota den Verbrauch auswertet.
hints.2.text: Reparieren Sie defaults, wiederholen Sie den Rollout und inspect Pod resources und nicht
  nur die Vorlage.
