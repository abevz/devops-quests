title: Kontingent und LimitRange-Zulassung
brief: 'In der Vorlage board werden Ressourcenfelder absichtlich weggelassen, damit namespace defaults
  diese bereitstellen kann. Der LimitRange injiziert die Anforderungen 300m und limit 400m und überschreitet
  damit das feste ResourceQuota-Budget. Reparieren Sie nur CPU defaults, um 100m und limit 200m anzufordern;
  Behalten Sie memory defaults 16Mi/32Mi, die quota und die ressourcenfreie Deployment-Vorlage bei. Versuchen
  Sie den Rollout erneut und geben Sie inspect den tatsächlich zugelassenen Pod ein. Defaults betrifft
  neu zugelassene Pods; Wenn Sie sie ändern, werden vorhandene Pods nicht neu geschrieben. Dies ist eine
  API-Zulassung und keine Behauptung, dass quota Knotenkapazität schafft.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `client.json`, `quota.json`, `defaults.json`,
  `board.json`, `service.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: Ein zugelassener bereiter board erhält CPU defaults 100m/200m und memory 16Mi/32Mi
  unter dem unveränderten quota und bedient north-126.'
debrief: Die fehlerhafte Richtlinie wurde im Rahmen des namespace-Budgets repariert. Die Kapazität von
  scheduler blieb eine separate Einschränkung.
