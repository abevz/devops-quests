title: Kontingent und LimitRange-Zulassung
brief: |-
  Die Workloads erreichen ihren erforderlichen zugelassenen Zustand im gemeinsamen Budget nicht. Repariere beide Verbraucher ohne Ersatz der vorgegebenen Quote.

  Arbeite auf der Workstation in `~/quest` mit den vorgegebenen Verbindungs-/Ergebniseingaben: `admission-contract.json`. Die Workload-Definitionen stehen in aktuellen Clusterobjekten.

  **Anforderungen:**

  - ResourceQuota `station` behält das vorgegebene Budget: CPU-Anforderungen `200m`, CPU-Limits `400m`, Speicheranforderungen `32Mi`, Speicherlimits `64Mi` und `2` Pods.
  - Die bereitgestellten Admission-Standardwerte liefern der board-Anwendung das erforderliche CPU-Budget, ohne explizites Ressourcenbudget in ihrer Deployment-Vorlage. Diese CPU-Standardrichtlinie und das Fehlen expliziter Ressourcenbudgets gelten für beide Deployment-Vorlagen. Erhalte ursprüngliche Identitäten, Images und jeweils eine gewünschte Replik sowie die ursprüngliche Quotenidentität.
  - Deployment `board` hat ein bereites Replikat und einen nicht terminierenden Pod mit bereitem Container, CPU-Anforderung/Limit `100m`/`200m` und Speicheranforderung/Limit `16Mi`/`32Mi`, alles auf demselben Pod. Auch der andere vorgegebene Workload hat genau einen aktuellen bereiten Pod mit denselben zugelassenen CPU- und Speicherbudgets. Der Namespace-Verbrauch entspricht den zwei vereinbarten Verbraucherbudgets.
  - Von Deployment `client` liefert `http://board:8080` den Wert `north-126`.

  Prüfungen beobachten aktuelle Quotenidentität/Nutzung, CPU-Standards und zugelassenen Speicher, nicht aktuelle Speicherstandards oder Änderungsverlauf. Unterbrechungsfreiheit wird nicht behauptet.
debrief: Standardrichtlinie, zugelassene Pod-Ressourcen und Controller-Ersatz haben getrennte Lebenszeiten. Propagiere
  das CPU-Modell durch beide Verbraucher mit bewusster Budgetreihenfolge statt höherer Quote.
stages.0.brief: Lassen Sie die bereitgestellte Quote unverändert.
hints.0.text: Admission zählt alle aktuellen Verbraucher. Standards gelten für neue Zulassungen; Ersatz oder Surge
  kann Budget brauchen, bevor ein alter Pod es freigibt.
hints.1.text: |-
  Vergleiche Quotenverbrauch, Standards, aktuell zugelassene Ressourcen und ReplicaSet-Bedingungsmeldungen. Warten allein ändert kein unvereinbares Budget.

  ```sh
  cat admission-contract.json
  kubectl get resourcequota,limitrange,deployment,pods -o yaml
  kubectl get replicasets -o yaml
  kubectl describe resourcequota station
  ```
hints.2.text: |-
  Prüfe ursprüngliche Quote, beide standardgesteuerten Vorlagen, beide aktuellen zugelassenen Ressourcensätze und die Antwort. Verbrauch muss beiden Verbrauchern entsprechen.

  ```sh
  kubectl get resourcequota station -o yaml
  kubectl get deployment client board -o yaml
  kubectl get pods -o yaml
  kubectl exec deployment/client -c worker -- wget -qO- -T 3 http://board:8080
  ```

  ```sh
  kubectl get resourcequota station -o json | jq '{hard:.spec.hard, used:.status.used}'
  kubectl get limitrange defaults -o json | jq '.spec.limits[] | select(.type=="Container") | {default,defaultRequest}'
  kubectl get deployment board client -o json | jq '.items[] | {name:.metadata.name, ready:.status.readyReplicas, resources:(.spec.template.spec.containers[] | select(.name=="worker") | .resources)}'
  kubectl get rs -o json | jq '.items[] | {name:.metadata.name, uid:.metadata.uid, owners:.metadata.ownerReferences}'
  kubectl get pods -o json | jq '.items[] | select(.metadata.deletionTimestamp==null) | {pod:.metadata.name, owners:.metadata.ownerReferences, resources:(.spec.containers[] | select(.name=="worker") | .resources), ready:(.status.containerStatuses[]? | select(.name=="worker") | .ready)}'
  ```

  ResourceQuota station entspricht dem Budget und meldet die Nutzung beider Verbraucher. LimitRange setzt 100m CPU als Request und 200m als Limit. Worker verwendet in beiden Deployment-Templates die vorgegebenen Standardwerte. Ermittle über das ReplicaSet das aktuelle Deployment jedes laufenden Containers worker und prüfe Requests, Limits und Bereitschaft anhand der Vorgabe. Die Anfrage aus client liefert north-126.
phrases.0: Ich habe den Zulassungsfehler vom scheduling-Fehler unterschieden.
phrases.1: Ich habe die Ressourcen nach der Standardeinstellung überprüft.
phrases.2: Ich habe den namespace quota erhalten.
questions.0.points.0: Defaults gelten bei der Zulassung neuer Pods.
questions.0.points.1: Versuchen Sie es erneut oder erstellen Sie die beabsichtigte Arbeitslast absichtlich neu.
questions.0.prompt: Ändert die Bearbeitung eines LimitRange vorhandene Pods?
questions.1.points.0: Quota ist ein namespace-Eintrittsbudget.
questions.1.points.1: Der Scheduler prüft den Knoten requests und seine Platzierung separat.
questions.1.prompt: Ist quota-Erschöpfung dasselbe wie unzureichender Knoten CPU?
