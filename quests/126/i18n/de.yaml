title: Kontingent und LimitRange-Zulassung
brief: "Der Board-Workload wird innerhalb seines Admission-Budgets nicht bereit. Stellen Sie die erforderlichen\
  \ zugelassenen Ressourcen ohne Änderung der vorgegebenen Quote her.\n\nArbeiten Sie in `~/quest` auf der Workstation.\
  \ Bereitgestellte Dateien: `client.yaml`, `quota.yaml`, `defaults.yaml`, `board.yaml`, `service.yaml`.\n\n**Requirements:**\n\
  \n- ResourceQuota `station` behält das vorgegebene Budget: CPU-Anforderungen `200m`, CPU-Limits `400m`, Speicheranforderungen\
  \ `32Mi`, Speicherlimits `64Mi` und `2` Pods.\n- LimitRange `defaults` liefert die erforderlichen CPU-Ressourcen,\
  \ wenn der Anwendungscontainer in der Deployment-Vorlage `board` keine expliziten Ressourcen hat.\n- Deployment\
  \ `board` hat ein bereites Replikat und einen nicht terminierenden Pod mit bereitem Container, CPU-Anforderung/Limit\
  \ `100m`/`200m` und Speicheranforderung/Limit `16Mi`/`32Mi`, alles auf demselben Pod.\n- Von Deployment `client`\
  \ liefert `http://board:8080` den Wert `north-126`.\n\n**Verify yourself before Check & finish:** Führen Sie diese\
  \ Beobachtungsbefehle aus `~/quest` auf der Workstation aus.\n\n- Einstellungen, Identitäten und Status entsprechen\
  \ den Anforderungen.\n\n  ```sh\n  kubectl get resourcequota station -o yaml\n  kubectl get limitrange defaults\
  \ -o yaml\n  kubectl get deployment board -o yaml\n  ```\n\n- `kubectl get pods -l app=board -o yaml` — Ein nicht\
  \ terminierender Pod hat die erforderlichen Ressourcen und einen bereiten Container zugleich.\n\n- `kubectl exec\
  \ deployment/client -- wget -qO- -T 3 http://board:8080` — Der Verbraucher erhält `north-126`.\n\nDie Prüfung\
  \ untersucht den Speicher des zugelassenen Pods, nicht aktuelle LimitRange-Speicherdefaults oder den Änderungsverlauf;\
  \ Admission-Quote schafft keine Node-Kapazität."
debrief: Die fehlerhafte Richtlinie wurde im Rahmen des namespace-Budgets repariert. Die Kapazität von scheduler
  blieb eine separate Einschränkung.
stages.0.brief: Der zugelassene Board-Pod muss innerhalb des festen Ressourcenbudgets bereit sein.
hints.0.text: Lesen Sie ReplicaSet-Ereignisse, um die Zulassungsablehnung von Pending scheduling zu unterscheiden.
hints.1.text: LimitRange liefert defaults, bevor ResourceQuota den Verbrauch auswertet. Die vorgegebenen CPU-Defaults
  sind Anforderung `300m` und Limit `400m` und überschreiten die feste Quote. Defaults wirken auf neu zugelassene
  Pods, nicht bestehende.
hints.2.text: Reparieren Sie defaults, wiederholen Sie den Rollout und inspect Pod resources und nicht nur die Vorlage.
phrases.0: Ich habe den Zulassungsfehler vom scheduling-Fehler unterschieden.
phrases.1: Ich habe die Ressourcen nach der Standardeinstellung überprüft.
phrases.2: Ich habe den namespace quota erhalten.
questions.0.points.0: Defaults gelten bei der Zulassung neuer Pods.
questions.0.points.1: Versuchen Sie es erneut oder erstellen Sie die beabsichtigte Arbeitslast absichtlich neu.
questions.0.prompt: Ändert die Bearbeitung eines LimitRange vorhandene Pods?
questions.1.points.0: Quota ist ein namespace-Eintrittsbudget.
questions.1.points.1: Der Scheduler prüft den Knoten requests und seine Platzierung separat.
questions.1.prompt: Ist quota-Erschöpfung dasselbe wie unzureichender Knoten CPU?
diagnostics.quota: Die Hard-Spec der ResourceQuota station muss quota.yaml entsprechen.
diagnostics.default: Das CPU-Standardlimit der LimitRange defaults muss 200m sein.
diagnostics.request: Der CPU-Standardrequest der LimitRange defaults muss 100m sein.
diagnostics.ready: Deployment board muss ein bereites Replikat haben.
diagnostics.template: Die Vorlage des ersten Board-Containers darf keine resources haben.
diagnostics.pod_requests: Ein nicht zum Löschen markierter Board-Pod muss die genauen CPU- und Memory-Requests aus
  der Beschreibung haben.
diagnostics.pod_limits: Ein nicht zum Löschen markierter Board-Pod muss die genauen CPU- und Memory-Limits aus der
  Beschreibung haben.
diagnostics.pod_ready: Ein nicht zum Löschen markierter Board-Pod muss einen bereiten Container haben.
diagnostics.same_pod: Ein einzelner nicht zum Löschen markierter Board-Pod muss alle erforderlichen Ressourcen und
  einen bereiten Container haben.
diagnostics.http: board:8080 muss north-126 liefern.
