title: Wstęp kwotowy i LimitRange
brief: 'Szablon board celowo pomija pola zasobów, aby mogły je uzupełnić wartości domyślne namespace. LimitRange wstawia request
  300m i limit 400m, przekraczając stały budżet ResourceQuota. Popraw tylko domyślne wartości CPU na request 100m i limit
  200m; zachowaj domyślną pamięć 16Mi/32Mi, quota oraz szablon Deployment bez zasobów. Ponów wdrożenie i sprawdź faktycznie
  przyjęty Pod. Wartości domyślne dotyczą nowo przyjmowanych Podów; ich zmiana nie przepisuje istniejących. To dopuszczenie
  przez API, a nie twierdzenie, że quota tworzy zasoby węzła.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `client.json`, `quota.json`, `defaults.json`, `board.json`,
  `service.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie załadowanych obrazów
  i usług prywatnych. Zmień tylko tę zatokę.


  Przeczytaj `quota.json`, `defaults.json`, `board.json`, `service.json` i `client.json`. Specyfikacja hard ResourceQuota
  `station` musi dokładnie odpowiadać requests CPU `200m`, limits CPU `400m`, requests memory `32Mi`, limits memory `64Mi`
  i pods `2`. Pierwszy wpis LimitRange `defaults` musi mieć CPU default `200m` i defaultRequest `100m`; resources pierwszego
  kontenera Deployment muszą być puste, a jedna replika gotowa. Co najmniej jeden Pod `app=board` nieoznaczony do usunięcia
  musi mieć dokładnie requests CPU `100m`/memory `16Mi`, limits CPU `200m`/memory `32Mi` i gotowy kontener. deployment/client
  musi otrzymać `north-126` z `board:8080`. Kontrola sprawdza pamięć przyjętego Poda, nie bieżące domyślne wartości pamięci
  LimitRange; nie dowodzi historii zmian.'
debrief: Niedotrzymana polisa została naprawiona w ramach budżetu namespace; Pojemność scheduler pozostała odrębnym ograniczeniem.
stages.0.brief: Quota, domyślne CPU, szablon Deployment, zasoby przyjętego gotowego Poda i odpowiedź HTTP odpowiadają opisowi.
stages.0.objectives.0.text: Quota, domyślne CPU, szablon Deployment, zasoby przyjętego gotowego Poda i odpowiedź HTTP odpowiadają
  opisowi.
hints.0.text: Przeczytaj zdarzenia ReplicaSet, aby odróżnić odmowę przyjęcia od Pending scheduling.
hints.1.text: LimitRange dostarcza defaults, zanim ResourceQuota oceni zużycie.
hints.2.text: Napraw defaults, ponów próbę wdrożenia i sprawdź zasoby Pod, a nie tylko jego szablon.
phrases.0: Rozróżniłem niepowodzenie przyjęcia od niepowodzenia scheduling.
phrases.1: Sprawdziłem zasoby po domyślnym.
phrases.2: Zachowałem limit przestrzeni nazw.
questions.0.points.0: Defaults obowiązuje podczas przyjmowania nowych kapsuł.
questions.0.points.1: Spróbuj ponownie lub celowo odtwórz zamierzone obciążenie.
questions.0.prompt: Czy edycja LimitRange zmienia istniejące Pody?
questions.1.points.0: Quota to budżet wstępu namespace.
questions.1.points.1: Program planujący osobno sprawdza węzeł requests i położenie.
questions.1.prompt: Czy wyczerpanie quota jest tym samym, co niewystarczający węzeł CPU?
