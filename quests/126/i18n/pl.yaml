title: Wstęp kwotowy i LimitRange
brief: |-
  Obciążenia nie osiągają wymaganego przyjętego stanu we wspólnym budżecie. Przywróć obu odbiorców bez zastępowania podanej kwoty.

  Pracuj na workstation w `~/quest` z podanymi danymi połączenia/wyniku: `admission-contract.json`. Definicje obciążeń są dostępne w bieżących obiektach klastra.

  **Wymagania:**

  - ResourceQuota `station` zachowuje dostarczony budżet: żądania CPU `200m`, limity CPU `400m`, żądania pamięci `32Mi`, limity pamięci `64Mi` i `2` Pody.
  - Dostarczone domyślne ustawienia admission zapewniają wymagany budżet CPU aplikacji board bez jawnego budżetu zasobów w szablonie Deployment. Ta polityka domyślnego CPU i brak jawnych budżetów zasobów dotyczą obu szablonów Deployment. Zachowaj pierwotne tożsamości, obrazy i po jednej docelowej replice oraz pierwotną tożsamość kwoty.
  - Deployment `board` ma jedną gotową replikę i niekończony Pod z gotowym kontenerem, żądaniem/limitem CPU `100m`/`200m` i żądaniem/limitem pamięci `16Mi`/`32Mi`, wszystko w tym samym Podzie. Drugie podane obciążenie także ma dokładnie jeden bieżący gotowy Pod z tymi samymi przyjętymi budżetami CPU i pamięci. Zużycie kwoty namespace odpowiada dwóm uzgodnionym budżetom odbiorców.
  - Z Deployment `client` adres `http://board:8080` zwraca `north-126`.

  Testy obserwują bieżącą tożsamość/zużycie kwoty, CPU defaults i przyjętą pamięć, nie defaults pamięci ani historię. Nie deklarują ciągłej dostępności.
debrief: Polityka defaults, przyjęte zasoby Podów i zastępowanie przez kontroler mają osobne czasy życia. Propaguj
  model CPU przez obu odbiorców świadomą kolejnością budżetu zamiast powiększania kwoty.
stages.0.brief: Zachowaj dostarczoną kwotę bez zmian.
hints.0.text: Admission uwzględnia wszystkich bieżących odbiorców. Defaults dotyczą nowych przyjęć; zastąpienie
  lub surge może wymagać budżetu, zanim stary Pod go zwolni.
hints.1.text: |-
  Porównaj zużycie kwoty, defaults, przyjęte zasoby i komunikaty warunków ReplicaSet. Samo czekanie nie zmienia niezgodnego budżetu.

  ```sh
  cat admission-contract.json
  kubectl get resourcequota,limitrange,deployment,pods -o yaml
  kubectl get replicasets -o yaml
  kubectl describe resourcequota station
  ```
hints.2.text: |-
  Sprawdź pierwotną kwotę, oba szablony oparte na defaults, oba bieżące zestawy przyjętych zasobów i odpowiedź. Zużycie ma odpowiadać obu odbiorcom.

  ```sh
  kubectl get resourcequota station -o yaml
  kubectl get deployment client board -o yaml
  kubectl get pods -o yaml
  kubectl exec deployment/client -c worker -- wget -qO- -T 3 http://board:8080
  ```
phrases.0: Rozróżniłem niepowodzenie przyjęcia od niepowodzenia scheduling.
phrases.1: Sprawdziłem zasoby po domyślnym.
phrases.2: Zachowałem limit przestrzeni nazw.
questions.0.points.0: Defaults obowiązuje podczas przyjmowania nowych kapsuł.
questions.0.points.1: Spróbuj ponownie lub celowo odtwórz zamierzone obciążenie.
questions.0.prompt: Czy edycja LimitRange zmienia istniejące Pody?
questions.1.points.0: Quota to budżet wstępu namespace.
questions.1.points.1: Program planujący osobno sprawdza węzeł requests i położenie.
questions.1.prompt: Czy wyczerpanie quota jest tym samym, co niewystarczający węzeł CPU?
