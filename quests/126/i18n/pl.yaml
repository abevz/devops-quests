stages.0.objectives.3.text: Z Deployment `client` adres `http://board:8080` zwraca `north-126`.
diagnostics.quota: Może brakować ResourceQuota station lub wartości hard mogą odbiegać od żądań CPU 200m i pamięci 32Mi, limitów CPU 400m i pamięci 64Mi oraz liczby Podów 2. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q126-station-quota-budget)
diagnostics.probe_0_0: Kontrola kwoty mogła się zatrzymać przed zgłoszeniem warunku. Sprawdź, czy można odczytać bieżący ResourceQuota station. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q126-station-quota-observer)
diagnostics.default: W LimitRange defaults może brakować wpisu Container lub domyślny limit CPU może być inny. Sprawdź wartość 200m. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q126-station-limitrange-default)
diagnostics.request: W LimitRange defaults może brakować wpisu Container lub domyślne żądanie CPU może być inne. Sprawdź wartość 100m. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q126-station-limitrange-request)
diagnostics.template: Szablon board może jawnie ustawiać resources dla worker lub worker może nie istnieć. Pozostaw resources puste w szablonie, aby mechanizm admission wstawił wartości domyślne. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q126-station-board-empty-resources)
diagnostics.probe_0_1: Kontrola zasad admission mogła się zatrzymać przed zgłoszeniem warunku. Sprawdź LimitRange, kwotę i Deploymenty w przestrzeni nazw ćwiczenia. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q126-station-admission-policy-observer)
diagnostics.admission_identity: Chroniony ResourceQuota lub Deployment może nie istnieć lub mieć inny UID. Porównaj bieżące obiekty z zapisanymi identyfikatorami. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q126-station-retained-admission-objects)
diagnostics.admission_template: Szablon board lub client może odbiegać od kontraktu. Sprawdź liczbę replik, pierwotny obraz worker oraz puste pole resources dla wartości admission. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q126-station-retained-admission-templates)
diagnostics.ready: Deployment board może nadal uzgadniać stan lub liczba gotowych replik może być inna niż jeden. Sprawdź bieżący stan. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q126-station-board-ready-replica)
diagnostics.pod_requests: W żadnym nieusuwanym Podzie board żądania worker mogą nie wynosić jednocześnie CPU 100m i pamięci 16Mi. Sprawdź specyfikację przyjętego Poda. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q126-station-admitted-worker-requests)
diagnostics.pod_limits: W żadnym nieusuwanym Podzie board limity worker mogą nie wynosić jednocześnie CPU 200m i pamięci 32Mi. Sprawdź specyfikację przyjętego Poda. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q126-station-admitted-worker-limits)
diagnostics.pod_ready: Kontener worker może być niegotowy we wszystkich nieusuwanych Podach board. Sprawdź gotowość kontenera w bieżących Podach. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q126-station-admitted-worker-readiness)
diagnostics.same_pod: Oczekiwane żądania, limity i gotowość mogą występować w różnych Podach. Sprawdź jeden nieusuwany Pod board, którego worker spełnia wszystkie trzy warunki. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q126-station-admitted-single-example)
diagnostics.admission_client: Wdrożenie client może być nieaktualne, wskazywać zmienione obciążenie lub zawierać bieżący worker z innymi zasobami albo bez gotowości. Sprawdź generację Deploymentu, łańcuch właścicieli i przyjęty Pod. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q126-station-admitted-client)
diagnostics.admission_usage: Kontroler kwoty może nadal uzgadniać stan lub zużycie przyjętych obciążeń może odbiegać od budżetu. Po ustabilizowaniu board i client porównaj w status.used żądania, limity i Pody. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q126-station-observed-quota-usage)
diagnostics.probe_0_2: Kontrola skutków admission mogła się zatrzymać przed zgłoszeniem warunku. Sprawdź odczyty kwoty, obciążeń i dostępność przyjętych Podów. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q126-station-admitted-pods-observer)
diagnostics.http: Przyjęty client może nie mieć dostępu do board:8080 lub nie otrzymywać odpowiedzi north-126. Sprawdź rzeczywiste żądanie z client. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q126-station-admitted-board-http)
