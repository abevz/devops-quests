  CPU `100m`/`200m` i żądaniem/limitem pamięci `16Mi`/`32Mi`, wszystko w tym samym Podzie. Drugie podane obciążenie
  także ma dokładnie jeden bieżący gotowy Pod z tymi samymi przyjętymi budżetami CPU i pamięci. Zużycie kwoty namespace
