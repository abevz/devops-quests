title: Wstęp kwotowy i LimitRange
brief: 'Szablon board celowo pomija pola zasobów, aby mogły je dostarczyć domyślne przestrzenie nazw.
  LimitRange wtryskuje request 300m i limit 400m, przekraczając ustalony budżet ResourceQuota. Naprawiaj
  tylko CPU defaults do request 100m i limit 200m; zachowaj domyślne ustawienia memory 16Mi/32Mi, quota
  i szablon Deployment bez zasobów. Ponów próbę wdrożenia i sprawdź, czy faktycznie przyjęte Pod. Defaults
  wpływają na nowo przyjęte Pody; ich zmiana nie powoduje przepisania istniejących Podów. To jest przyjmowanie
  zasobów przez API, a nie twierdzenie, że quota zwiększa zasoby węzła.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `client.json`, `quota.json`,
  `defaults.json`, `board.json`, `service.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Wstępne kryteria sukcesu: Dopuszczony gotowy board otrzymuje CPU defaults 100m/200m i memory 16Mi/32Mi
  pod niezmienionym quota i służy north-126.'
debrief: Niedotrzymana polisa została naprawiona w ramach budżetu namespace; Pojemność scheduler pozostała
  odrębnym ograniczeniem.
