  bez jawnego budżetu zasobów w szablonie Deployment. Ta polityka domyślnego CPU i brak jawnych budżetów zasobów
  dotyczą obu szablonów Deployment. Zachowaj pierwotne tożsamości, obrazy i po jednej docelowej replice oraz pierwotną
  tożsamość kwoty.
