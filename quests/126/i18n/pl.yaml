title: Wstęp kwotowy i LimitRange
brief: |-
  Obciążenie board nie osiąga gotowości w budżecie admission. Przywróć wymagane dopuszczone zasoby bez zmiany dostarczonej kwoty.

  Pracuj na workstation w `~/quest` z dostarczonymi plikami:
  - `client.yaml`, `quota.yaml`, `defaults.yaml`, `board.yaml`, `service.yaml`.

  **Requirements:**

  - Zachowaj uzgodniony budżet zasobów:
    - ResourceQuota `station` zachowuje dostarczony budżet: żądania CPU `200m`, limity CPU `400m`, żądania pamięci `32Mi`, limity pamięci `64Mi` i `2` Pody.
  - Dostarczone domyślne ustawienia admission zapewniają wymagany budżet CPU aplikacji board bez jawnego budżetu zasobów w szablonie Deployment.
  - Deployment `board` ma jedną gotową replikę i niekończony Pod z gotowym kontenerem, żądaniem/limitem CPU `100m`/`200m` i żądaniem/limitem pamięci `16Mi`/`32Mi`, wszystko w tym samym Podzie.
  - Z Deployment `client` adres `http://board:8080` zwraca `north-126`.

  Kontrola sprawdza pamięć dopuszczonego Poda, nie bieżące domyślne wartości pamięci LimitRange ani historię zmian; kwota admission nie tworzy pojemności węzła.
debrief: Niedotrzymana polisa została naprawiona w ramach budżetu namespace; Pojemność scheduler pozostała
  odrębnym ograniczeniem.
stages.0.brief: Zachowaj dostarczoną kwotę bez zmian.
hints.0.text: Przeczytaj zdarzenia ReplicaSet, aby odróżnić odmowę przyjęcia od Pending scheduling.
hints.1.text: |-
  LimitRange dostarcza defaults, zanim ResourceQuota oceni zużycie. Dostarczone domyślne CPU to żądanie `300m` i limit `400m`, przekraczające stałą kwotę. Wartości domyślne dotyczą nowo dopuszczanych Podów, nie istniejących.

  Sprawdź dostarczone dane i bieżące obserwacje:

  ```sh
  kubectl get resourcequota station -o yaml
    kubectl get limitrange defaults -o yaml
    kubectl get deployment board -o yaml
  ```
hints.2.text: |-
  Napraw defaults, ponów próbę wdrożenia i sprawdź zasoby Pod, a nie tylko jego szablon.

  Sprawdź wynik z `~/quest` na workstation:

  - `kubectl get pods -l app=board -o yaml` — Jeden niekończony Pod ma jednocześnie wymagane zasoby i gotowy kontener.

  - `kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080` — Odbiorca otrzymuje `north-126`.
phrases.0: Rozróżniłem niepowodzenie przyjęcia od niepowodzenia scheduling.
phrases.1: Sprawdziłem zasoby po domyślnym.
phrases.2: Zachowałem limit przestrzeni nazw.
questions.0.points.0: Defaults obowiązuje podczas przyjmowania nowych kapsuł.
questions.0.points.1: Spróbuj ponownie lub celowo odtwórz zamierzone obciążenie.
questions.0.prompt: Czy edycja LimitRange zmienia istniejące Pody?
questions.1.points.0: Quota to budżet wstępu namespace.
questions.1.points.1: Program planujący osobno sprawdza węzeł requests i położenie.
questions.1.prompt: Czy wyczerpanie quota jest tym samym, co niewystarczający węzeł CPU?
