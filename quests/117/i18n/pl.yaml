title: Statyczna własność Pod
brief: "Lokalny dla węzła endpoint board jest niedostępny. Przywróć obciążenie pochodzące z pliku przez dostarczony\
  \ ograniczony adapter.\n\nPracuj w `~/quest` na stacji roboczej. Dostarczone pliki: `client.json`, `service.json`,\
  \ `static-pod.json`.\n\n**Requirements:**\n\n- Zweryfikowany statyczny Pod pochodzący z pliku jest gotowy na `DQ_NODE_NAME`,\
  \ a lustrzany Pod `static-board-$DQ_NODE_NAME` odpowiada tożsamości i konfiguracji zaobserwowanym przez adapter.\n\
  - Z Deployment `client` adres `http://board:8080` zwraca `north-117`.\n\n**Verify yourself before Check & finish:**\
  \ Wykonaj te polecenia obserwacji z `~/quest` na stacji roboczej.\n\n- Zweryfikowana obserwacja źródła plikowego\
  \ i gotowy lustrzany Pod zgadzają się co do tożsamości, konfiguracji i węzła.\n\n  ```sh\n  cat /run/dq/observations/static-pod.json\n\
  \  kubectl get pod \"static-board-$DQ_NODE_NAME\" -o yaml\n  ```\n\n- `kubectl exec deployment/client -- wget\
  \ -qO- -T 3 http://board:8080` — Odbiorca otrzymuje `north-117`.\n\nPoczekaj na asynchroniczny adapter i kubelet;\
  \ obserwacje i bieżący HTTP nie dowodzą pełnej historii zmian. Montowania hosta, uprawnienia i powłoka węzła są\
  \ niedostępne; sprzątanie usuwa manifest węzła przed namespace."
debrief: Lustro zostało sprawdzone w porównaniu z rzeczywistą piaskownicą CRI, a nie tylko annotation zapisywaną
  przez użytkownika. Wszystkie zapisy węzłów pozostały w jednorazowym kontenerze kind.
stages.0.brief: Rzeczywiste statyczne obciążenie musi być gotowe i osiągalne.
hints.0.text: Kubelet obserwuje lokalny katalog manifestu węzła.
hints.1.text: Usunięcie kopii lustrzanej poprzez API nie powoduje usunięcia jego manifestu źródłowego.
hints.2.text: 'Zmień tylko listener w pliku testowym i poczekaj na ograniczony adapter i kubelet. Przygotowany nasłuch
  używa `8099`; popraw tylko go na `8080`. Nie używaj kubectl apply: Pod utworzony przez API nie jest statyczny.
  Adapter weryfikuje dostarczony bezpieczny kształt przed zapisem we własnym węźle kind.'
phrases.0: Odróżniłem lustro Pod od jego manifestu węzła.
phrases.1: Zweryfikowałem prawdziwą tożsamość kubelet i CRI.
phrases.2: Trzymałem static workload w ramach bezpiecznej umowy manifestu.
questions.0.points.0: Manifest węzła pozostaje źródłem prawdy kubelet.
questions.0.points.1: Kubelet odtwarza lustro API.
questions.0.prompt: Dlaczego usunięcie kopii lustrzanej Pod nie usuwa trwale obciążenia?
questions.1.points.0: Static Pods nie obsługuje tych odniesień zależnych od API.
questions.1.points.1: Użyj samodzielnej konfiguracji węzła i ścisłych limitów.
questions.1.prompt: Czy static Pod może używać zwykłych referencji opartych na API, takich jak service account?
