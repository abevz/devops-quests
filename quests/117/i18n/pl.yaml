title: Statyczna własność Pod
brief: 'static-pod.json to manifest przygotowany dla ściśle ograniczonego adaptera węzła. Nasłuchuje na 8099; popraw tylko
  ten port na 8080. Podczas zwykłego cyklu odpytywania gry adapter sprawdza cały manifest według dostarczonego bezpiecznego
  wzorca, zapisuje go tylko wewnątrz węzła kind tej zatoki i pozwala prawdziwemu kubeletowi utworzyć statyczny Pod. Nie stosuj
  manifestu przez kubectl apply: Pod utworzony przez API nie jest statyczny. Montowanie hosta, uprawnienia i powłoka węzła
  są niedostępne. Sprawdź tożsamość mirror Poda i rzeczywisty HTTP; sprzątanie usuwa manifest węzła przed namespace.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `client.json`, `service.json`, `static-pod.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie załadowanych obrazów
  i usług prywatnych. Zmień tylko tę zatokę.


  Adapter zapisuje obserwację w `/run/dq/observations/static-pod.json`. Musi ona podawać `verified: true`, `source: file`
  i węzeł zatoki. Mirror Pod `static-board-$DQ_NODE_NAME` musi mieć `mirrorUID` z obserwacji, adnotację `kubernetes.io/config.mirror`
  równą jej `configHash`, ten sam węzeł i co najmniej jeden gotowy kontener. Żądanie deployment/client do `board:8080` musi
  zwrócić `north-117`. Obserwacja i bieżący wynik HTTP nie dowodzą całej historii zmian. Przed sprawdzeniem poczekaj na asynchroniczny
  adapter i kubelet.'
debrief: Lustro zostało sprawdzone w porównaniu z rzeczywistą piaskownicą CRI, a nie tylko annotation zapisywaną przez użytkownika.
  Wszystkie zapisy węzłów pozostały w jednorazowym kontenerze kind.
stages.0.brief: Obserwacja backendu, tożsamość i gotowość mirror Poda oraz odpowiedź board odpowiadają opisowi.
stages.0.objectives.0.text: Obserwacja backendu, tożsamość i gotowość mirror Poda oraz odpowiedź board odpowiadają opisowi.
hints.0.text: Kubelet obserwuje lokalny katalog manifestu węzła.
hints.1.text: Usunięcie kopii lustrzanej poprzez API nie powoduje usunięcia jego manifestu źródłowego.
hints.2.text: Zmień tylko listener w pliku testowym i poczekaj na ograniczony adapter i kubelet.
phrases.0: Odróżniłem lustro Pod od jego manifestu węzła.
phrases.1: Zweryfikowałem prawdziwą tożsamość kubelet i CRI.
phrases.2: Trzymałem static workload w ramach bezpiecznej umowy manifestu.
questions.0.points.0: Manifest węzła pozostaje źródłem prawdy kubelet.
questions.0.points.1: Kubelet odtwarza lustro API.
questions.0.prompt: Dlaczego usunięcie kopii lustrzanej Pod nie usuwa trwale obciążenia?
questions.1.points.0: Static Pods nie obsługuje tych odniesień zależnych od API.
questions.1.points.1: Użyj samodzielnej konfiguracji węzła i ścisłych limitów.
questions.1.prompt: Czy static Pod może używać zwykłych referencji opartych na API, takich jak service account?
