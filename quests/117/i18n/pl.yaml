title: Statyczna własność Pod
brief: |-
  Lokalny endpoint węzła pozostaje niedostępny mimo działającego Poda w bay. Przywróć zweryfikowaną aplikację ze źródła plikowego przez ograniczony adapter.

  Pracuj na workstation w `~/quest` z dostarczonymi plikami:
  - `client.yaml`, `service.yaml`, `static-pod.yaml`.

  **Requirements:**

  - Zweryfikowany statyczny Pod pochodzący z pliku jest gotowy na `DQ_NODE_NAME`, a lustrzany Pod `static-board-$DQ_NODE_NAME` odpowiada tożsamości i konfiguracji zaobserwowanym przez adapter.
  - Z Deployment `client` adres `http://board:8080` zwraca `north-117`.

  Poczekaj na asynchroniczny adapter i kubelet; obserwacje i bieżący HTTP nie dowodzą pełnej historii zmian. Montowania hosta, uprawnienia i powłoka węzła są niedostępne; sprzątanie usuwa manifest węzła przed namespace.
debrief: Lustro zostało sprawdzone w porównaniu z rzeczywistą piaskownicą CRI, a nie tylko annotation
  zapisywaną przez użytkownika. Wszystkie zapisy węzłów pozostały w jednorazowym kontenerze kind.
stages.0.brief: Ogranicz dostęp do węzła do dostarczonego ograniczonego adaptera.
hints.0.text: Sama nazwa Poda nie określa właściciela. Porównaj źródło plikowe kubeleta z obiektami utworzonymi
  przez API, zanim zdecydujesz, który obiekt zmienić.
hints.1.text: |-
  Zbadaj `static-pod.yaml`, Service oraz pełne metadane i polecenia Poda. Porównaj adnotacje źródła i referencje właściciela; gotowy obiekt API nie dowodzi źródła plikowego.

  ```sh
  cat static-pod.yaml
  kubectl get service board -o yaml
  kubectl get pods -o yaml
  ```
hints.2.text: |-
  Dopasuj listener przygotowanego pliku do portu docelowego Service. Pod utworzony przez API, zajmujący oczekiwaną nazwę lustra, musi zostać usunięty, zanim kubelet opublikuje własne lustro; usunięcie prawdziwego lustra nie usuwa źródła. Zachowaj bezpieczną strukturę manifestu i poczekaj na adapter oraz kubelet.

  ```sh
  cat /run/dq/observations/static-pod.json
  kubectl get pod "static-board-$DQ_NODE_NAME" -o yaml
  kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080
  ```
phrases.0: Odróżniłem lustro Pod od jego manifestu węzła.
phrases.1: Zweryfikowałem prawdziwą tożsamość kubelet i CRI.
phrases.2: Trzymałem static workload w ramach bezpiecznej umowy manifestu.
questions.0.points.0: Manifest węzła pozostaje źródłem prawdy kubelet.
questions.0.points.1: Kubelet odtwarza lustro API.
questions.0.prompt: Dlaczego usunięcie kopii lustrzanej Pod nie usuwa trwale obciążenia?
questions.1.points.0: Static Pods nie obsługuje tych odniesień zależnych od API.
questions.1.points.1: Użyj samodzielnej konfiguracji węzła i ścisłych limitów.
questions.1.prompt: Czy static Pod może używać zwykłych referencji opartych na API, takich jak service
  account?
