title: Statyczna własność Pod
brief: 'static-pod.json to manifest przygotowany dla adaptera węzła o wąskich ograniczeniach. Jego słuchacz
  to 8099; napraw tylko tego słuchacza dla 8080. W zwykłej ankiecie gry adapter sprawdza pełny manifest
  w oparciu o dostarczony bezpieczny kształt, zapisuje go tylko w węźle kind należącym do tej zatoki i
  pozwala prawdziwemu kubelet utworzyć static Pod. Nie kubectl stosuj manifest: API utworzony w Pod nie
  jest static Pod. Nie są dostępne żadne podłączenia hosta, uprawnienia ani węzeł shell. Sprawdź lustro
  identity i prawdziwe HTTP; czyszczenie usuwa manifest węzła przed namespace.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `client.json`, `service.json`,
  `static-pod.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: Prawdziwy kubelet static Pod ma lustro zweryfikowane przez CRI i obsługuje
  north-117 poprzez swój Service.'
debrief: Lustro zostało sprawdzone w porównaniu z rzeczywistą piaskownicą CRI, a nie tylko annotation
  zapisywaną przez użytkownika. Wszystkie zapisy węzłów pozostały w jednorazowym kontenerze kind.
stages.0.brief: 'Kryteria sukcesu: Prawdziwy statyczny kubelet Pod ma lustro zweryfikowane przez CRI i
  obsługuje north-117 poprzez Service.'
stages.0.objectives.0.text: Prawdziwy statyczny kubelet Pod ma lustro zweryfikowane przez CRI i obsługuje
  north-117 poprzez Service.
hints.0.text: Kubelet obserwuje lokalny katalog manifestu węzła.
hints.1.text: Usunięcie kopii lustrzanej poprzez API nie powoduje usunięcia jego manifestu źródłowego.
hints.2.text: Zmień tylko listener w pliku testowym i poczekaj na ograniczony adapter i kubelet.
phrases.0: Odróżniłem lustro Pod od jego manifestu węzła.
phrases.1: Zweryfikowałem prawdziwą tożsamość kubelet i CRI.
phrases.2: Trzymałem static workload w ramach bezpiecznej umowy manifestu.
questions.0.points.0: Manifest węzła pozostaje źródłem prawdy kubelet.
questions.0.points.1: Kubelet odtwarza lustro API.
questions.0.prompt: Dlaczego usunięcie kopii lustrzanej Pod nie usuwa trwale obciążenia?
questions.1.points.0: Static Pods nie obsługuje tych odniesień zależnych od API.
questions.1.points.1: Użyj samodzielnej konfiguracji węzła i ścisłych limitów.
questions.1.prompt: Czy static Pod może używać zwykłych referencji opartych na API, takich jak service
  account?
