title: Владелец static Pod
brief: |-
  Локальный endpoint узла остаётся недоступным, хотя в bay работает Pod. Восстановите подтверждённое приложение из файла через ограниченный адаптер.

  Работайте на workstation в `~/quest` с предоставленными файлами:
  - `client.yaml`, `service.yaml`, `static-pod.yaml`.

  **Requirements:**

  - Проверенный статический Pod из файла готов на `DQ_NODE_NAME`, а зеркальный Pod `static-board-$DQ_NODE_NAME` соответствует наблюдаемым адаптером идентичности и конфигурации.
  - Из Deployment `client` адрес `http://board:8080` возвращает `north-117`.

  Дождитесь асинхронного адаптера и kubelet; наблюдения и текущий HTTP не доказывают полную историю правок. Монтирования хоста, привилегии и оболочка узла недоступны; очистка удаляет манифест узла перед пространством имён.
debrief: Зеркало проверено по настоящей CRI-песочнице, а не только доступной пользователю annotation.
  Все записи узла остались внутри одноразового контейнера kind.
stages.0.brief: Сохраните доступ к узлу в пределах предоставленного ограниченного адаптера.
hints.0.text: Одно имя Pod не определяет его владельца. Сравните файловый источник kubelet с объектами,
  созданными через API, прежде чем выбирать объект для изменения.
hints.1.text: |-
  Изучите `static-pod.yaml`, Service, полные metadata и команды Pod. Сравните аннотации источника и owner references; готовый объект API не доказывает файловый источник.

  ```sh
  cat static-pod.yaml
  kubectl get service board -o yaml
  kubectl get pods -o yaml
  ```
hints.2.text: |-
  Согласуйте listener в подготовленном файле с targetPort Service. Pod, созданный через API и занимающий ожидаемое имя зеркала, нужно удалить, прежде чем kubelet сможет опубликовать своё зеркало; удаление только настоящего зеркала не удаляет источник. Сохраните выданную безопасную структуру манифеста и дождитесь адаптера и kubelet.

  ```sh
  cat /run/dq/observations/static-pod.json
  kubectl get pod "static-board-$DQ_NODE_NAME" -o yaml
  kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080
  ```
phrases.0: Я отличил зеркало Pod от манифеста узла.
phrases.1: Я проверил настоящий kubelet и identity CRI.
phrases.2: Я сохранил static workload в безопасном контракте манифеста.
questions.0.points.0: Источником правды kubelet остаётся манифест узла.
questions.0.points.1: Kubelet воссоздаёт зеркало API.
questions.0.prompt: Почему удаление зеркала Pod не убирает нагрузку навсегда?
questions.1.points.0: Static Pods не поддерживают такие API-зависимые ссылки.
questions.1.points.1: Используйте автономную конфигурацию узла и строгие ограничения.
questions.1.prompt: Может ли static Pod использовать обычные API-ссылки вроде service account?
diagnostics.verified: Наблюдение статического Pod должно быть проверено.
diagnostics.source: Источник наблюдения статического Pod должен быть file.
diagnostics.node: Наблюдаемый узел должен совпадать с узлом песочницы.
diagnostics.uid: UID зеркального Pod должен совпадать с наблюдаемым mirrorUID.
diagnostics.hash: Аннотация зеркала должна совпадать с наблюдаемым configHash.
diagnostics.pod_node: Узел зеркального Pod должен совпадать с узлом песочницы.
diagnostics.ready: У зеркального Pod должен быть готовый контейнер.
diagnostics.http: board:8080 должен вернуть north-117.
stages.0.objectives.0.text: Проверенный статический Pod из файла готов на `DQ_NODE_NAME`, а зеркальный
  Pod `static-board-$DQ_NODE_NAME` соответствует наблюдаемым адаптером идентичности и конфигурации.
stages.0.objectives.1.text: Из Deployment `client` адрес `http://board:8080` возвращает `north-117`.
