title: Владелец static Pod
brief: 'static-pod.json — манифест для строго ограниченного адаптера узла. Listener
  равен 8099; исправьте только его на 8080. На обычном опросе игры адаптер проверяет
  весь манифест по выданной безопасной форме, записывает его только внутри принадлежащего
  песочнице узла kind, затем настоящий kubelet создаёт static Pod. Не делайте kubectl
  apply: созданный через API Pod не является static Pod. Host mounts, привилегии и
  shell узла недоступны. Проверьте identity зеркала и реальный HTTP; очистка убирает
  манифест узла перед namespace.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `client.json`,
  `service.json`, `static-pod.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно
  загруженные образы и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Настоящий static Pod kubelet имеет зеркало, подтверждённое CRI,
  и отдаёт north-117 через Service.'
debrief: Зеркало проверено по настоящей CRI-песочнице, а не только доступной пользователю
  annotation. Все записи узла остались внутри одноразового контейнера kind.
stages.0.brief: 'Результат проверки: Настоящий static Pod kubelet имеет зеркало, подтверждённое
  CRI, и отдаёт north-117 через Service.'
stages.0.objectives.0.text: Настоящий static Pod kubelet имеет зеркало, подтверждённое
  CRI, и отдаёт north-117 через Service.
hints.0.text: Kubelet следит за локальным каталогом манифестов узла.
hints.1.text: Удаление зеркала через API не удаляет исходный манифест.
hints.2.text: Измените только listener в подготовленном файле и дождитесь адаптера
  и kubelet.
phrases.0: Я отличил зеркало Pod от манифеста узла.
phrases.1: Я проверил настоящий kubelet и identity CRI.
phrases.2: Я сохранил static workload в безопасном контракте манифеста.
questions.0.points.0: Источником правды kubelet остаётся манифест узла.
questions.0.points.1: Kubelet воссоздаёт зеркало API.
questions.0.prompt: Почему удаление зеркала Pod не убирает нагрузку навсегда?
questions.1.points.0: Static Pods не поддерживают такие API-зависимые ссылки.
questions.1.points.1: Используйте автономную конфигурацию узла и строгие ограничения.
questions.1.prompt: Может ли static Pod использовать обычные API-ссылки вроде service
  account?
