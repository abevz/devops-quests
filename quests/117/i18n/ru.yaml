title: Владелец static Pod
brief: 'static-pod.json — манифест для строго ограниченного адаптера узла. Listener работает на 8099; исправьте только этот
  порт на 8080. В обычном цикле опроса игры адаптер проверяет весь манифест по выданному безопасному образцу, записывает его
  только внутри узла kind этой песочницы, затем настоящий kubelet создаёт статический Pod. Не применяйте манифест через kubectl
  apply: Pod, созданный через API, не является статическим. Монтирование хоста, привилегии и shell узла недоступны. Проверьте
  идентичность зеркального Pod и настоящий HTTP; очистка удаляет манифест узла перед namespace.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `client.json`, `service.json`, `static-pod.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы и приватные сервисы.
  Менять можно только эту песочницу.


  Адаптер записывает наблюдение в `/run/dq/observations/static-pod.json`. В нём должны быть `verified: true`, `source: file`
  и узел песочницы. Зеркальный Pod `static-board-$DQ_NODE_NAME` должен иметь наблюдаемый `mirrorUID`, аннотацию `kubernetes.io/config.mirror`,
  равную `configHash`, тот же узел и хотя бы один готовый контейнер. Запрос deployment/client к `board:8080` должен вернуть
  `north-117`. Наблюдение и текущий HTTP-результат не доказывают полную историю изменений. Перед проверкой дождитесь асинхронного
  адаптера и kubelet.'
debrief: Зеркало проверено по настоящей CRI-песочнице, а не только доступной пользователю annotation. Все записи узла остались
  внутри одноразового контейнера kind.
stages.0.brief: Наблюдение backend, идентичность и готовность зеркального Pod и ответ board соответствуют описанию.
stages.0.objectives.0.text: Наблюдение backend, идентичность и готовность зеркального Pod и ответ board соответствуют описанию.
hints.0.text: Kubelet следит за локальным каталогом манифестов узла.
hints.1.text: Удаление зеркала через API не удаляет исходный манифест.
hints.2.text: Измените только listener в подготовленном файле и дождитесь адаптера и kubelet.
phrases.0: Я отличил зеркало Pod от манифеста узла.
phrases.1: Я проверил настоящий kubelet и identity CRI.
phrases.2: Я сохранил static workload в безопасном контракте манифеста.
questions.0.points.0: Источником правды kubelet остаётся манифест узла.
questions.0.points.1: Kubelet воссоздаёт зеркало API.
questions.0.prompt: Почему удаление зеркала Pod не убирает нагрузку навсегда?
questions.1.points.0: Static Pods не поддерживают такие API-зависимые ссылки.
questions.1.points.1: Используйте автономную конфигурацию узла и строгие ограничения.
questions.1.prompt: Может ли static Pod использовать обычные API-ссылки вроде service account?
diagnostics.verified: Наблюдение статического Pod должно быть проверено.
diagnostics.source: Источник наблюдения статического Pod должен быть file.
diagnostics.node: Наблюдаемый узел должен совпадать с узлом песочницы.
diagnostics.uid: UID зеркального Pod должен совпадать с наблюдаемым mirrorUID.
diagnostics.hash: Аннотация зеркала должна совпадать с наблюдаемым configHash.
diagnostics.pod_node: Узел зеркального Pod должен совпадать с узлом песочницы.
diagnostics.ready: У зеркального Pod должен быть готовый контейнер.
diagnostics.http: board:8080 должен вернуть north-117.
