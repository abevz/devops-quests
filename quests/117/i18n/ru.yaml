title: Владелец static Pod
brief: "Локальная конечная точка board на узле недоступна. Восстановите нагрузку из файла через предоставленный\
  \ ограниченный адаптер.\n\nРаботайте в `~/quest` на рабочей станции. Предоставлены файлы: `client.yaml`, `service.yaml`,\
  \ `static-pod.yaml`.\n\n**Requirements:**\n\n- Проверенный статический Pod из файла готов на `DQ_NODE_NAME`, а\
  \ зеркальный Pod `static-board-$DQ_NODE_NAME` соответствует наблюдаемым адаптером идентичности и конфигурации.\n\
  - Из Deployment `client` адрес `http://board:8080` возвращает `north-117`.\n\n**Verify yourself before Check &\
  \ finish:** Выполните эти команды наблюдения из `~/quest` на рабочей станции.\n\n- Проверенное наблюдение источника-файла\
  \ и готовый зеркальный Pod совпадают по идентичности, конфигурации и узлу песочницы.\n\n  ```sh\n  cat /run/dq/observations/static-pod.json\n\
  \  kubectl get pod \"static-board-$DQ_NODE_NAME\" -o yaml\n  ```\n\n- `kubectl exec deployment/client -- wget\
  \ -qO- -T 3 http://board:8080` — Потребитель получает `north-117`.\n\nДождитесь асинхронного адаптера и kubelet;\
  \ наблюдения и текущий HTTP не доказывают полную историю правок. Монтирования хоста, привилегии и оболочка узла\
  \ недоступны; очистка удаляет манифест узла перед пространством имён."
debrief: Зеркало проверено по настоящей CRI-песочнице, а не только доступной пользователю annotation. Все записи
  узла остались внутри одноразового контейнера kind.
stages.0.brief: Настоящая статическая нагрузка должна быть готова и доступна.
hints.0.text: Kubelet следит за локальным каталогом манифестов узла.
hints.1.text: Удаление зеркала через API не удаляет исходный манифест.
hints.2.text: 'Измените только listener в подготовленном файле и дождитесь адаптера и kubelet. Подготовленный слушатель
  использует `8099`; исправьте только его на `8080`. Не используйте kubectl apply: созданный через API Pod не статический.
  Адаптер проверяет предоставленную безопасную структуру перед записью внутри собственного узла kind.'
phrases.0: Я отличил зеркало Pod от манифеста узла.
phrases.1: Я проверил настоящий kubelet и identity CRI.
phrases.2: Я сохранил static workload в безопасном контракте манифеста.
questions.0.points.0: Источником правды kubelet остаётся манифест узла.
questions.0.points.1: Kubelet воссоздаёт зеркало API.
questions.0.prompt: Почему удаление зеркала Pod не убирает нагрузку навсегда?
questions.1.points.0: Static Pods не поддерживают такие API-зависимые ссылки.
questions.1.points.1: Используйте автономную конфигурацию узла и строгие ограничения.
questions.1.prompt: Может ли static Pod использовать обычные API-ссылки вроде service account?
diagnostics.verified: Наблюдение статического Pod должно быть проверено.
diagnostics.source: Источник наблюдения статического Pod должен быть file.
diagnostics.node: Наблюдаемый узел должен совпадать с узлом песочницы.
diagnostics.uid: UID зеркального Pod должен совпадать с наблюдаемым mirrorUID.
diagnostics.hash: Аннотация зеркала должна совпадать с наблюдаемым configHash.
diagnostics.pod_node: Узел зеркального Pod должен совпадать с узлом песочницы.
diagnostics.ready: У зеркального Pod должен быть готовый контейнер.
diagnostics.http: board:8080 должен вернуть north-117.
stages.0.objectives.0.text: Проверенный статический Pod из файла готов на `DQ_NODE_NAME`, а зеркальный Pod `static-board-$DQ_NODE_NAME`
  соответствует наблюдаемым адаптером идентичности и конфигурации.
stages.0.objectives.1.text: Из Deployment `client` адрес `http://board:8080` возвращает `north-117`.
