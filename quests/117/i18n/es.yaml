title: Propiedad estática de Pod
brief: |-
  El endpoint local del nodo sigue inaccesible aunque hay un Pod ejecutándose en la bahía. Restaura la aplicación verificada desde archivo mediante el adaptador limitado.

  Trabaja en la workstation en `~/quest` con los archivos suministrados:
  - `client.yaml`, `service.yaml`, `static-pod.yaml`.

  **Requirements:**

  - Un Pod estático verificado con origen en archivo está listo en `DQ_NODE_NAME`, con Pod espejo `static-board-$DQ_NODE_NAME` que coincide con la identidad y configuración observadas por el adaptador.
  - Desde Deployment `client`, `http://board:8080` devuelve `north-117`.

  Espere al adaptador asíncrono y kubelet; las observaciones y el HTTP actual no prueban todo el historial. No hay montajes del host, privilegios ni shell del nodo; la limpieza retira el manifiesto antes del namespace.
debrief: El espejo se comparó con un entorno de pruebas CRI real, no solo con un annotation en el que
  puede escribir el usuario. Todas las escrituras de nodos permanecieron dentro del contenedor desechable
  kind.
stages.0.brief: Mantén el acceso al nodo dentro del adaptador limitado suministrado.
hints.0.text: El nombre de un Pod no identifica por sí solo a su propietario. Compara el origen de archivo
  del kubelet con los objetos creados por API antes de decidir qué objeto cambiar.
hints.1.text: |-
  Inspecciona `static-pod.yaml`, el Service, los metadatos completos y los comandos del Pod. Compara anotaciones de origen y referencias al propietario; un objeto API listo no demuestra origen de archivo.

  Compara el puerto de escucha del manifiesto preparado con el puerto de destino del Service. Revisa las anotaciones de origen del Pod con el nombre de espejo esperado y contrástalas con la observación del adaptador.

  ```sh
  cat static-pod.yaml
  kubectl get service board -o yaml
  kubectl get pods -o yaml
  ```
hints.2.text: |-
  ```sh
  cat /run/dq/observations/static-pod.json
  kubectl get pod "static-board-$DQ_NODE_NAME" -o yaml
  kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080
  ```

  Espera que la observación muestre `verified: true`, `source: file` y el nodo suministrado. El Pod espejo debe estar en ese nodo, su UID debe coincidir con `mirrorUID` y su anotación `kubernetes.io/config.mirror` debe coincidir con `configHash`. Al menos un contenedor debe estar listo y el Service debe devolver `north-117`.
phrases.0: Distinguí un espejo Pod de su manifiesto de nodo.
phrases.1: Verifiqué los kubelet y CRI identity reales.
phrases.2: Mantuve el static workload dentro del contrato de manifiesto seguro.
questions.0.points.0: El manifiesto del nodo sigue siendo la fuente de verdad kubelet.
questions.0.points.1: El kubelet recrea el espejo API.
questions.0.prompt: ¿Por qué eliminar un espejo Pod no elimina la carga de trabajo de forma permanente?
questions.1.points.0: Static Pods no admite esas referencias dependientes de API.
questions.1.points.1: Utilice una configuración de nodo independiente y límites estrictos.
questions.1.prompt: ¿Puede un static Pod utilizar referencias ordinarias respaldadas por API como un service
  account?
stages.0.objectives.0.text: Un Pod estático verificado con origen en archivo está listo en `DQ_NODE_NAME`,
  con Pod espejo `static-board-$DQ_NODE_NAME` que coincide con la identidad y configuración observadas
  por el adaptador.
stages.0.objectives.1.text: Desde Deployment `client`, `http://board:8080` devuelve `north-117`.
diagnostics.verified: El entorno puede no haber verificado el Pod estático gestionado por kubelet. Revise el manifiesto y la observación tras aplicar el archivo. Un Pod de la API con el mismo nombre no prueba gestión estática. [Causa y comprobación](guides#guide=controllers-static&section=q117-verified-static-observation)
diagnostics.source: La carga observada puede venir de la API en vez del manifiesto estático. Revise el origen y confirme el valor file. [Causa y comprobación](guides#guide=controllers-static&section=q117-static-manifest-file-source)
diagnostics.node: La observación puede pertenecer a otro nodo o faltar. Compare el nodo registrado con el nodo del entorno antes de revisar el objeto espejo. [Causa y comprobación](guides#guide=controllers-static&section=q117-static-source-bay-node)
diagnostics.uid: Un objeto API con el nombre espejo o una demora de kubelet pueden dejar otro UID activo. Compare el UID del Pod con el mirrorUID verificado actual. [Causa y comprobación](guides#guide=controllers-static&section=q117-mirror-pod-observed-uid)
diagnostics.hash: Tras el cambio de manifiesto pueden faltar las anotaciones o quedar antiguas. Compare config.mirror con el configHash observado por el entorno. [Causa y comprobación](guides#guide=controllers-static&section=q117-mirror-pod-config-hash)
diagnostics.pod_node: Un Pod API con el mismo nombre puede estar en otro nodo. Compare nodeName del Pod espejo con el nodo del entorno. [Causa y comprobación](guides#guide=controllers-static&section=q117-mirror-pod-node-placement)
diagnostics.ready: El objeto espejo puede existir antes de que haya un contenedor listo. Revise los estados y espere un contenedor listo del Pod activo basado en archivo. [Causa y comprobación](guides#guide=controllers-static&section=q117-mirror-pod-container-readiness)
diagnostics.http: El worker estático puede escuchar en 8099, o el Service puede no dirigir las solicitudes a un Pod estático listo. Consulte board desde client y compare con north-117. [Causa y comprobación](guides#guide=controllers-static&section=q117-static-board-service-response)
