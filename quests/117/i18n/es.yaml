title: Propiedad estática de Pod
brief: 'static-pod.json es un manifiesto preparado para un adaptador de nodo estrictamente limitado. Su listener usa 8099;
  corrige solo ese puerto a 8080. En el ciclo habitual de sondeo del juego el adaptador valida el manifiesto completo frente
  a la forma segura proporcionada, lo escribe solo dentro del nodo kind de esta bahía y permite que el kubelet real cree un
  Pod estático. No apliques el manifiesto con kubectl apply: un Pod creado por API no es estático. No hay montajes del host,
  privilegios ni shell del nodo. Verifica la identidad del Pod espejo y HTTP real; la limpieza elimina el manifiesto del nodo
  antes del namespace.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `client.json`, `service.json`, `static-pod.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas y servicios
  privados. Cambie sólo esta bahía.


  El adaptador escribe su observación en `/run/dq/observations/static-pod.json`. Debe indicar `verified: true`, `source: file`
  y el nodo de la bahía. El Pod espejo `static-board-$DQ_NODE_NAME` debe tener el `mirrorUID` observado, anotación `kubernetes.io/config.mirror`
  igual a su `configHash`, el mismo nodo y al menos un contenedor listo. La petición de deployment/client a `board:8080` debe
  devolver `north-117`. La observación y el resultado HTTP actual no demuestran todo el historial de edición. Espera al adaptador
  asíncrono y al kubelet antes de comprobar.'
debrief: El espejo se comparó con un entorno de pruebas CRI real, no solo con un annotation en el que puede escribir el usuario.
  Todas las escrituras de nodos permanecieron dentro del contenedor desechable kind.
stages.0.brief: La observación del backend, identidad y disponibilidad del Pod espejo y respuesta board coinciden con la descripción.
stages.0.objectives.0.text: La observación del backend, identidad y disponibilidad del Pod espejo y respuesta board coinciden
  con la descripción.
hints.0.text: El kubelet observa un directorio de manifiesto local de nodo.
hints.1.text: Eliminar un espejo a través de API no elimina su manifiesto de origen.
hints.2.text: Cambie solo el listener en el archivo preparado y espere el adaptador limitado y el kubelet.
phrases.0: Distinguí un espejo Pod de su manifiesto de nodo.
phrases.1: Verifiqué los kubelet y CRI identity reales.
phrases.2: Mantuve el static workload dentro del contrato de manifiesto seguro.
questions.0.points.0: El manifiesto del nodo sigue siendo la fuente de verdad kubelet.
questions.0.points.1: El kubelet recrea el espejo API.
questions.0.prompt: ¿Por qué eliminar un espejo Pod no elimina la carga de trabajo de forma permanente?
questions.1.points.0: Static Pods no admite esas referencias dependientes de API.
questions.1.points.1: Utilice una configuración de nodo independiente y límites estrictos.
questions.1.prompt: ¿Puede un static Pod utilizar referencias ordinarias respaldadas por API como un service account?
diagnostics.verified: La observación del Pod estático debe estar verificada.
diagnostics.source: La fuente de la observación del Pod estático debe ser file.
diagnostics.node: El nodo observado debe coincidir con el nodo de la bahía.
diagnostics.uid: El UID del Pod espejo debe coincidir con el mirrorUID observado.
diagnostics.hash: La anotación del espejo debe coincidir con el configHash observado.
diagnostics.pod_node: El nodo del Pod espejo debe coincidir con el nodo de la bahía.
diagnostics.ready: El Pod espejo debe tener un contenedor listo.
diagnostics.http: board:8080 debe devolver north-117.
