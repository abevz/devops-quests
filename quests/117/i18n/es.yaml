title: Propiedad estática de Pod
brief: 'static-pod.json es un manifiesto preparado para un adaptador de nodo con restricciones estrictas.
  Su oyente es 8099; repare solo ese oyente en 8080. En la encuesta de juego ordinaria, el adaptador valida
  el manifiesto completo con la forma segura proporcionada, lo escribe solo dentro del nodo kind propiedad
  de esta bahía y permite que el kubelet real cree un static Pod. No kubectl apply el manifiesto: un Pod
  creado por API no es un static Pod. No hay ningún host mounts, privilegio o nodo shell disponible. Verifique
  el espejo identity y el real HTTP; La limpieza elimina el manifiesto del nodo antes de namespace.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `client.json`, `service.json`,
  `static-pod.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: Un kubelet real static Pod tiene un espejo verificado por CRI y sirve
  a north-117 a través de su Service.'
debrief: El espejo se comparó con un entorno de pruebas CRI real, no solo con un annotation en el que
  puede escribir el usuario. Todas las escrituras de nodos permanecieron dentro del contenedor desechable
  kind.
stages.0.brief: 'Criterios de éxito: Un kubelet real static Pod tiene un espejo verificado por CRI y sirve
  a north-117 a través de su Service.'
stages.0.objectives.0.text: Un kubelet static Pod real tiene un espejo verificado por CRI y sirve a north-117
  a través de su Service.
hints.0.text: El kubelet observa un directorio de manifiesto local de nodo.
hints.1.text: Eliminar un espejo a través de API no elimina su manifiesto de origen.
hints.2.text: Cambie solo el listener en el archivo preparado y espere el adaptador limitado y el kubelet.
phrases.0: Distinguí un espejo Pod de su manifiesto de nodo.
phrases.1: Verifiqué los kubelet y CRI identity reales.
phrases.2: Mantuve el static workload dentro del contrato de manifiesto seguro.
questions.0.points.0: El manifiesto del nodo sigue siendo la fuente de verdad kubelet.
questions.0.points.1: El kubelet recrea el espejo API.
questions.0.prompt: ¿Por qué eliminar un espejo Pod no elimina la carga de trabajo de forma permanente?
questions.1.points.0: Static Pods no admite esas referencias dependientes de API.
questions.1.points.1: Utilice una configuración de nodo independiente y límites estrictos.
questions.1.prompt: ¿Puede un static Pod utilizar referencias ordinarias respaldadas por API como un service
  account?
