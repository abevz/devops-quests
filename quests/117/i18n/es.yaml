title: Propiedad estática de Pod
brief: |-
  El endpoint board local al nodo no está disponible. Restaure la carga basada en archivo mediante el adaptador limitado suministrado.

  Trabaja en la workstation en `~/quest` con los archivos suministrados:
  - `client.yaml`, `service.yaml`, `static-pod.yaml`.

  **Requirements:**

  - Un Pod estático verificado con origen en archivo está listo en `DQ_NODE_NAME`, con Pod espejo `static-board-$DQ_NODE_NAME` que coincide con la identidad y configuración observadas por el adaptador.
  - Desde Deployment `client`, `http://board:8080` devuelve `north-117`.

  Espere al adaptador asíncrono y kubelet; las observaciones y el HTTP actual no prueban todo el historial. No hay montajes del host, privilegios ni shell del nodo; la limpieza retira el manifiesto antes del namespace.
debrief: El espejo se comparó con un entorno de pruebas CRI real, no solo con un annotation en el que
  puede escribir el usuario. Todas las escrituras de nodos permanecieron dentro del contenedor desechable
  kind.
stages.0.brief: Mantén el acceso al nodo dentro del adaptador limitado suministrado.
hints.0.text: El kubelet observa un directorio de manifiesto local de nodo.
hints.1.text: |-
  Eliminar un espejo a través de API no elimina su manifiesto de origen.

  Inspecciona los datos suministrados y las observaciones activas:

  ```sh
  cat /run/dq/observations/static-pod.json
    kubectl get pod "static-board-$DQ_NODE_NAME" -o yaml
  ```
hints.2.text: |-
  Cambie solo el listener en el archivo preparado y espere el adaptador limitado y el kubelet. El listener preparado usa `8099`; corrija solo ese listener a `8080`. No use kubectl apply: un Pod creado por API no es estático. El adaptador valida la forma segura suministrada antes de escribir en su nodo kind.

  Verifica el resultado desde `~/quest` en la workstation:

  - `kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080` — El consumidor recibe `north-117`.
phrases.0: Distinguí un espejo Pod de su manifiesto de nodo.
phrases.1: Verifiqué los kubelet y CRI identity reales.
phrases.2: Mantuve el static workload dentro del contrato de manifiesto seguro.
questions.0.points.0: El manifiesto del nodo sigue siendo la fuente de verdad kubelet.
questions.0.points.1: El kubelet recrea el espejo API.
questions.0.prompt: ¿Por qué eliminar un espejo Pod no elimina la carga de trabajo de forma permanente?
questions.1.points.0: Static Pods no admite esas referencias dependientes de API.
questions.1.points.1: Utilice una configuración de nodo independiente y límites estrictos.
questions.1.prompt: ¿Puede un static Pod utilizar referencias ordinarias respaldadas por API como un service
  account?
diagnostics.verified: La observación del Pod estático debe estar verificada.
diagnostics.source: La fuente de la observación del Pod estático debe ser file.
diagnostics.node: El nodo observado debe coincidir con el nodo de la bahía.
diagnostics.uid: El UID del Pod espejo debe coincidir con el mirrorUID observado.
diagnostics.hash: La anotación del espejo debe coincidir con el configHash observado.
diagnostics.pod_node: El nodo del Pod espejo debe coincidir con el nodo de la bahía.
diagnostics.ready: El Pod espejo debe tener un contenedor listo.
diagnostics.http: board:8080 debe devolver north-117.
