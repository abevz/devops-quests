title: Statischer Pod-Eigentum
brief: |-
  Der Node-lokale Endpunkt bleibt trotz eines laufenden Pods in der Bay nicht erreichbar. Stelle die verifizierte dateibasierte Anwendung über den begrenzten Adapter wieder her.

  Arbeiten Sie auf der Workstation in `~/quest` mit den bereitgestellten Dateien:
  - `client.yaml`, `service.yaml`, `static-pod.yaml`.

  **Requirements:**

  - Ein verifizierter dateibasierter statischer Pod läuft bereit auf `DQ_NODE_NAME`; Mirror-Pod `static-board-$DQ_NODE_NAME` entspricht der vom Adapter beobachteten Identität und Konfiguration.
  - Von Deployment `client` liefert `http://board:8080` den Wert `north-117`.

  Warten Sie auf asynchronen Adapter und kubelet; Beobachtungen und aktuelles HTTP beweisen keinen vollständigen Änderungsverlauf. Host-Mounts, Privilegien und Node-Shell sind nicht verfügbar; die Bereinigung entfernt das Node-Manifest vor dem Namespace.
debrief: Der Spiegel wurde mit einer tatsächlichen CRI-Sandbox verglichen, nicht nur mit einer vom Benutzer
  beschreibbaren annotation. Alle Knotenschreibvorgänge blieben im Einwegcontainer kind.
stages.0.brief: Beschränken Sie den Knotenzugriff auf den bereitgestellten begrenzten Adapter.
hints.0.text: Ein Pod-Name allein bestimmt seinen Eigentümer nicht. Vergleiche die Dateiquelle des Kubelets
  mit über die API erstellten Objekten, bevor du ein Objekt änderst.
hints.1.text: |-
  Untersuche `static-pod.yaml`, den Service sowie vollständige Pod-Metadaten und Befehle. Vergleiche Quellannotationen und Owner-Referenzen; ein bereites API-Objekt beweist keine Dateiquelle.

  ```sh
  cat static-pod.yaml
  kubectl get service board -o yaml
  kubectl get pods -o yaml
  ```
hints.2.text: |-
  Stimme den Listener der bereitgestellten Datei mit dem Service-Zielport ab. Ein über die API erstellter Pod, der den erwarteten Mirror-Namen belegt, muss entfernt werden, bevor das Kubelet seinen eigenen Mirror veröffentlichen kann; das Löschen eines echten Mirrors entfernt die Quelle nicht. Behalte die sichere Manifeststruktur bei und warte auf Adapter und Kubelet.

  ```sh
  cat /run/dq/observations/static-pod.json
  kubectl get pod "static-board-$DQ_NODE_NAME" -o yaml
  kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080
  ```
phrases.0: Ich habe einen Spiegel Pod anhand seines Knotenmanifests unterschieden.
phrases.1: Ich habe den echten kubelet und CRI identity überprüft.
phrases.2: Ich habe den static workload innerhalb des sicheren Manifestvertrags behalten.
questions.0.points.0: Das Knotenmanifest bleibt die Quelle der Wahrheit kubelet.
questions.0.points.1: Der kubelet bildet den API-Spiegel nach.
questions.0.prompt: Warum wird durch das Löschen eines Spiegels Pod die Arbeitslast nicht dauerhaft entfernt?
questions.1.points.0: Static Pods unterstützen diese API-abhängigen Referenzen nicht.
questions.1.points.1: Verwenden Sie eine eigenständige Knotenkonfiguration und strenge Grenzwerte.
questions.1.prompt: Kann ein static Pod gewöhnliche API-gestützte Referenzen wie ein service account verwenden?
stages.0.objectives.0.text: Ein verifizierter dateibasierter statischer Pod läuft bereit auf `DQ_NODE_NAME`;
  Mirror-Pod `static-board-$DQ_NODE_NAME` entspricht der vom Adapter beobachteten Identität und Konfiguration.
stages.0.objectives.1.text: Von Deployment `client` liefert `http://board:8080` den Wert `north-117`.
diagnostics.verified: Die Laufzeit hat möglicherweise noch keinen vom Kubelet verwalteten statischen Pod bestätigt. Prüfen Sie Manifest und Beobachtung nach der Dateianwendung. Ein API-Pod mit gleichem Namen belegt keine statische Verwaltung. [Ursache und Prüfung](guides#guide=controllers-static&section=q117-verified-static-observation)
diagnostics.source: Die beobachtete Arbeitslast stammt möglicherweise aus der API statt aus dem statischen Manifest. Prüfen Sie die beobachtete Quelle auf den Wert file. [Ursache und Prüfung](guides#guide=controllers-static&section=q117-static-manifest-file-source)
diagnostics.node: Die Beobachtung gehört möglicherweise zu einem anderen Knoten oder fehlt. Vergleichen Sie den erfassten Knoten mit dem Übungsknoten vor der Prüfung des Mirror-Pods. [Ursache und Prüfung](guides#guide=controllers-static&section=q117-static-source-bay-node)
diagnostics.uid: Ein API-Objekt mit Mirror-Namen oder eine verzögerte Kubelet-Aktualisierung kann eine andere UID hinterlassen. Vergleichen Sie die Pod-UID mit der aktuell verifizierten mirrorUID. [Ursache und Prüfung](guides#guide=controllers-static&section=q117-mirror-pod-observed-uid)
diagnostics.hash: Nach einer Manifeständerung sind Mirror-Annotationen möglicherweise veraltet oder fehlen. Vergleichen Sie config.mirror mit dem beobachteten configHash. [Ursache und Prüfung](guides#guide=controllers-static&section=q117-mirror-pod-config-hash)
diagnostics.pod_node: Ein gleichnamiger API-Pod kann woanders eingeplant sein. Vergleichen Sie nodeName des Mirror-Pods mit dem bereitgestellten Übungsknoten. [Ursache und Prüfung](guides#guide=controllers-static&section=q117-mirror-pod-node-placement)
diagnostics.ready: Der Mirror-Pod kann bestehen, bevor ein Container bereit ist. Prüfen Sie die Statuswerte und warten Sie auf einen bereiten Container des aktuellen dateibasierten Pods. [Ursache und Prüfung](guides#guide=controllers-static&section=q117-mirror-pod-container-readiness)
diagnostics.http: Der statische Worker lauscht möglicherweise auf 8099 oder der Service erreicht keinen bereiten statischen Pod. Rufen Sie board aus client auf und vergleichen Sie mit north-117. [Ursache und Prüfung](guides#guide=controllers-static&section=q117-static-board-service-response)
