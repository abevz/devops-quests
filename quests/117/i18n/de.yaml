title: Statischer Pod-Eigentum
brief: 'static-pod.json ist ein Manifest, das für einen eng eingeschränkten Knotenadapter bereitgestellt
  wird. Sein Listener ist 8099; Reparieren Sie nur diesen Listener auf 8080. Bei der normalen Spielabfrage
  validiert der Adapter das vollständige Manifest anhand der bereitgestellten sicheren Form, schreibt
  es nur in den kind-Knoten dieses Schachts und lässt den echten kubelet einen static Pod erstellen. Nicht
  kubectl apply das Manifest: Ein von der API erstelltes Pod ist kein static Pod. Es ist kein Host mounts,
  Privileg oder Knoten shell verfügbar. Überprüfen Sie den Spiegel identity und den echten HTTP. Durch
  die Bereinigung wird das Knotenmanifest vor namespace entfernt.


  Questdateien in `~/quest` (einige erscheinen in späteren Phasen): `client.json`, `service.json`, `static-pod.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: Ein echter kubelet static Pod verfügt über einen CRI-verifizierten Spiegel und
  bedient north-117 über seinen Service.'
debrief: Der Spiegel wurde mit einer tatsächlichen CRI-Sandbox verglichen, nicht nur mit einer vom Benutzer
  beschreibbaren annotation. Alle Knotenschreibvorgänge blieben im Einwegcontainer kind.
stages.0.brief: 'Erfolgskriterien: Ein echter kubelet static Pod verfügt über einen CRI-verifizierten
  Spiegel und bedient north-117 über seinen Service.'
stages.0.objectives.0.text: Ein echter kubelet static Pod verfügt über einen CRI-verifizierten Spiegel
