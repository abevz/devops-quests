title: Statischer Pod-Eigentum
brief: 'static-pod.json ist ein Manifest für einen stark eingeschränkten Node-Adapter. Sein Listener nutzt 8099; korrigiere
  nur diesen Port auf 8080. Im normalen Abfragezyklus des Spiels prüft der Adapter das gesamte Manifest anhand der bereitgestellten
  sicheren Form, schreibt es nur in den kind-Node dieser Umgebung und lässt den echten Kubelet einen statischen Pod erstellen.
  Wende das Manifest nicht mit kubectl apply an: Ein über die API erstellter Pod ist kein statischer Pod. Host-Mounts, Privilegien
  und eine Node-Shell sind nicht verfügbar. Prüfe die Mirror-Pod-Identität und echtes HTTP; die Bereinigung entfernt das Node-Manifest
  vor dem Namespace.


  Questdateien in `~/quest` (einige erscheinen in späteren Phasen): `client.json`, `service.json`, `static-pod.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien, vorinstallierte Bilder
  und private Dienste. Ändern Sie nur diese Bucht.


  Der Adapter schreibt seine Beobachtung nach `/run/dq/observations/static-pod.json`. Sie muss `verified: true`, `source:
  file` und den Node der Umgebung melden. Der Mirror-Pod `static-board-$DQ_NODE_NAME` muss die beobachtete `mirrorUID`, die
  Annotation `kubernetes.io/config.mirror` gleich dem `configHash`, denselben Node und mindestens einen bereiten Container
  haben. Die Anfrage von deployment/client an `board:8080` muss `north-117` liefern. Beobachtung und aktuelles HTTP-Ergebnis
  beweisen nicht die vollständige Änderungshistorie. Warte vor der Prüfung auf den asynchronen Adapter und Kubelet.'
debrief: Der Spiegel wurde mit einer tatsächlichen CRI-Sandbox verglichen, nicht nur mit einer vom Benutzer beschreibbaren
  annotation. Alle Knotenschreibvorgänge blieben im Einwegcontainer kind.
stages.0.brief: Backend-Beobachtung, Mirror-Pod-Identität und Bereitschaft sowie Board-Antwort entsprechen der Beschreibung.
stages.0.objectives.0.text: Backend-Beobachtung, Mirror-Pod-Identität und Bereitschaft sowie Board-Antwort entsprechen der
  Beschreibung.
hints.0.text: Der kubelet überwacht ein knotenlokales Manifestverzeichnis.
hints.1.text: Durch das Löschen eines Spiegels über API wird sein Quellmanifest nicht gelöscht.
hints.2.text: Ändern Sie nur listener in der bereitgestellten Datei und warten Sie auf den begrenzten Adapter und kubelet.
phrases.0: Ich habe einen Spiegel Pod anhand seines Knotenmanifests unterschieden.
phrases.1: Ich habe den echten kubelet und CRI identity überprüft.
phrases.2: Ich habe den static workload innerhalb des sicheren Manifestvertrags behalten.
questions.0.points.0: Das Knotenmanifest bleibt die Quelle der Wahrheit kubelet.
questions.0.points.1: Der kubelet bildet den API-Spiegel nach.
questions.0.prompt: Warum wird durch das Löschen eines Spiegels Pod die Arbeitslast nicht dauerhaft entfernt?
questions.1.points.0: Static Pods unterstützen diese API-abhängigen Referenzen nicht.
questions.1.points.1: Verwenden Sie eine eigenständige Knotenkonfiguration und strenge Grenzwerte.
questions.1.prompt: Kann ein static Pod gewöhnliche API-gestützte Referenzen wie ein service account verwenden?
