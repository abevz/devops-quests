diagnostics.hash: Die Mirror-Annotation muss dem beobachteten configHash entsprechen.
diagnostics.pod_node: Der Mirror-Pod-Node muss dem Node der Umgebung entsprechen.
diagnostics.ready: Der Mirror-Pod muss einen bereiten Container haben.
