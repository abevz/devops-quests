title: Statischer Pod-Eigentum
brief: |-
  Der node-lokale Board-Endpunkt ist nicht verfügbar. Stellen Sie den dateibasierten Workload über den bereitgestellten begrenzten Adapter wieder her.

  Arbeiten Sie auf der Workstation in `~/quest` mit den bereitgestellten Dateien:
  - `client.yaml`, `service.yaml`, `static-pod.yaml`.

  **Requirements:**

  - Ein verifizierter dateibasierter statischer Pod läuft bereit auf `DQ_NODE_NAME`; Mirror-Pod `static-board-$DQ_NODE_NAME` entspricht der vom Adapter beobachteten Identität und Konfiguration.
  - Von Deployment `client` liefert `http://board:8080` den Wert `north-117`.

  Warten Sie auf asynchronen Adapter und kubelet; Beobachtungen und aktuelles HTTP beweisen keinen vollständigen Änderungsverlauf. Host-Mounts, Privilegien und Node-Shell sind nicht verfügbar; die Bereinigung entfernt das Node-Manifest vor dem Namespace.
debrief: Der Spiegel wurde mit einer tatsächlichen CRI-Sandbox verglichen, nicht nur mit einer vom Benutzer
  beschreibbaren annotation. Alle Knotenschreibvorgänge blieben im Einwegcontainer kind.
stages.0.brief: Beschränken Sie den Knotenzugriff auf den bereitgestellten begrenzten Adapter.
hints.0.text: Der kubelet überwacht ein knotenlokales Manifestverzeichnis.
hints.1.text: |-
  Durch das Löschen eines Spiegels über API wird sein Quellmanifest nicht gelöscht.

  Prüfen Sie die bereitgestellten Eingaben und laufenden Beobachtungen:

  ```sh
  cat /run/dq/observations/static-pod.json
    kubectl get pod "static-board-$DQ_NODE_NAME" -o yaml
  ```
hints.2.text: |-
  Ändern Sie nur listener in der bereitgestellten Datei und warten Sie auf den begrenzten Adapter und kubelet. Der bereitgestellte Listener nutzt `8099`; korrigieren Sie nur ihn auf `8080`. Kein kubectl apply: ein API-erstellter Pod ist nicht statisch. Der Adapter prüft die vorgegebene sichere Form vor dem Schreiben im eigenen kind-Node.

  Prüfen Sie das Ergebnis in `~/quest` auf der Workstation:

  - `kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080` — Der Verbraucher erhält `north-117`.
phrases.0: Ich habe einen Spiegel Pod anhand seines Knotenmanifests unterschieden.
phrases.1: Ich habe den echten kubelet und CRI identity überprüft.
phrases.2: Ich habe den static workload innerhalb des sicheren Manifestvertrags behalten.
questions.0.points.0: Das Knotenmanifest bleibt die Quelle der Wahrheit kubelet.
questions.0.points.1: Der kubelet bildet den API-Spiegel nach.
questions.0.prompt: Warum wird durch das Löschen eines Spiegels Pod die Arbeitslast nicht dauerhaft entfernt?
questions.1.points.0: Static Pods unterstützen diese API-abhängigen Referenzen nicht.
questions.1.points.1: Verwenden Sie eine eigenständige Knotenkonfiguration und strenge Grenzwerte.
questions.1.prompt: Kann ein static Pod gewöhnliche API-gestützte Referenzen wie ein service account verwenden?
