title: Static Pod ownership
brief: |-
  The node-local endpoint remains unavailable despite a running Pod in the bay. Restore the verified file-sourced workload through the bounded adapter.

  Work on the workstation in `~/quest` with the supplied files:
  - `client.yaml`, `service.yaml`, `static-pod.yaml`.

  **Requirements:**

  - A verified file-sourced static Pod runs ready on `DQ_NODE_NAME`, with mirror Pod `static-board-$DQ_NODE_NAME` matching the adapter-observed identity and configuration.
  - From Deployment `client`, `http://board:8080` returns `north-117`.

  Wait for the asynchronous adapter and kubelet; observations and current HTTP do not prove complete edit history. No host mounts, privilege or node shell is available; cleanup removes the node manifest before the namespace.
debrief: The mirror was checked against an actual CRI sandbox, not just a user-writable annotation. All
  node writes stayed inside the disposable kind container.
stages.0.brief: Keep node access within the supplied bounded adapter.
hints.0.text: A Pod name alone does not identify its owner. Compare the kubelet file source with API-created
  objects before deciding which object to change.
hints.1.text: |-
  Inspect `static-pod.yaml`, the Service, and the full Pod metadata and commands. Compare source annotations and owner references; a ready API object does not prove a file source.

  ```sh
  cat static-pod.yaml
  kubectl get service board -o yaml
  kubectl get pods -o yaml
  ```
hints.2.text: |-
  Align the staged listener with the Service target. An API-created Pod occupying the expected mirror name must be removed before the kubelet can publish its own mirror; deleting only a genuine mirror would not remove the source. Keep the supplied safe manifest shape and wait for the adapter and kubelet.

  ```sh
  cat /run/dq/observations/static-pod.json
  kubectl get pod "static-board-$DQ_NODE_NAME" -o yaml
  kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080
  ```
phrases.0: I distinguished a mirror Pod from its node manifest.
phrases.1: I verified the real kubelet and CRI identity.
phrases.2: I kept the static workload within the safe manifest contract.
questions.0.points.0: The node manifest remains the kubelet source of truth.
questions.0.points.1: The kubelet recreates the API mirror.
questions.0.prompt: Why does deleting a mirror Pod not remove the workload permanently?
questions.1.points.0: Static Pods do not support those API-dependent references.
questions.1.points.1: Use self-contained node configuration and strict limits.
questions.1.prompt: Can a static Pod use ordinary API-backed references like a service account?
diagnostics.verified: The static Pod observation must be verified.
diagnostics.source: The static Pod observation source must be file.
diagnostics.node: The observation node must match the bay node.
diagnostics.uid: The mirror Pod UID must match the observed mirrorUID.
diagnostics.hash: The mirror annotation must match the observed configHash.
diagnostics.pod_node: The mirror Pod node must match the bay node.
diagnostics.ready: The mirror Pod must have a ready container.
diagnostics.http: board:8080 must return north-117.
stages.0.objectives.0.text: A verified file-sourced static Pod runs ready on `DQ_NODE_NAME`, with mirror
  Pod `static-board-$DQ_NODE_NAME` matching the adapter-observed identity and configuration.
stages.0.objectives.1.text: From Deployment `client`, `http://board:8080` returns `north-117`.
