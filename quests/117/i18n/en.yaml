title: Static Pod ownership
brief: 'static-pod.json is a manifest staged for a narrowly constrained node adapter. Its listener is 8099; repair only that
  listener to 8080. On the ordinary game poll the adapter validates the complete manifest against the supplied safe shape,
  writes it only inside this bay''s owned kind node, and lets the real kubelet create a static Pod. Do not kubectl apply the
  manifest: an API-created Pod is not a static Pod. No host mounts, privilege or node shell is available. Verify mirror identity
  and real HTTP; cleanup removes the node manifest before the namespace.


  Quest files in `~/quest` (some appear in later stages): `client.json`, `service.json`, `static-pod.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services. Change only this
  bay.


  The adapter writes its observation to `/run/dq/observations/static-pod.json`. It must report `verified: true`, `source:
  file` and the bay node. The mirror Pod `static-board-$DQ_NODE_NAME` must have the observation’s `mirrorUID`, `kubernetes.io/config.mirror`
  annotation equal to its `configHash`, the same node and at least one ready container. The deployment/client request to `board:8080`
  must return `north-117`. The observation and current HTTP result do not prove the complete edit history. Wait for the asynchronous
  adapter and kubelet before checking.'
debrief: The mirror was checked against an actual CRI sandbox, not just a user-writable annotation. All node writes stayed
  inside the disposable kind container.
stages.0.brief: The backend observation, mirror Pod identity and readiness, and board response match the brief.
stages.0.objectives.0.text: The backend observation, mirror Pod identity and readiness, and board response match the brief.
hints.0.text: The kubelet watches a node-local manifest directory.
hints.1.text: Deleting a mirror through the API does not delete its source manifest.
hints.2.text: Change only the listener in the staged file and wait for the bounded adapter and kubelet.
phrases.0: I distinguished a mirror Pod from its node manifest.
phrases.1: I verified the real kubelet and CRI identity.
phrases.2: I kept the static workload within the safe manifest contract.
questions.0.points.0: The node manifest remains the kubelet source of truth.
questions.0.points.1: The kubelet recreates the API mirror.
questions.0.prompt: Why does deleting a mirror Pod not remove the workload permanently?
questions.1.points.0: Static Pods do not support those API-dependent references.
questions.1.points.1: Use self-contained node configuration and strict limits.
questions.1.prompt: Can a static Pod use ordinary API-backed references like a service account?
diagnostics.verified: The static Pod observation must be verified.
diagnostics.source: The static Pod observation source must be file.
diagnostics.node: The observation node must match the bay node.
diagnostics.uid: The mirror Pod UID must match the observed mirrorUID.
diagnostics.hash: The mirror annotation must match the observed configHash.
diagnostics.pod_node: The mirror Pod node must match the bay node.
diagnostics.ready: The mirror Pod must have a ready container.
diagnostics.http: board:8080 must return north-117.
