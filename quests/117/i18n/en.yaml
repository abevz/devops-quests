title: Static Pod ownership
brief: |-
  The node-local endpoint remains unavailable despite a running Pod in the bay. Restore the verified file-sourced workload through the bounded adapter.

  Work on the workstation in `~/quest` with the supplied files:
  - `client.yaml`, `service.yaml`, `static-pod.yaml`.

  **Requirements:**

  - A verified file-sourced static Pod runs ready on `DQ_NODE_NAME`, with mirror Pod `static-board-$DQ_NODE_NAME` matching the adapter-observed identity and configuration.
  - From Deployment `client`, `http://board:8080` returns `north-117`.

  Wait for the asynchronous adapter and kubelet; observations and current HTTP do not prove complete edit history. No host mounts, privilege or node shell is available; cleanup removes the node manifest before the namespace.
debrief: The mirror was checked against an actual CRI sandbox, not just a user-writable annotation. All
  node writes stayed inside the disposable kind container.
stages.0.brief: Keep node access within the supplied bounded adapter.
hints.0.text: A Pod name alone does not identify its owner. Compare the kubelet file source with API-created
  objects before deciding which object to change.
hints.1.text: |-
  Inspect `static-pod.yaml`, the Service, and the full Pod metadata and commands. Compare source annotations and owner references; a ready API object does not prove a file source.

  Check which listener port the staged manifest declares and compare it with the Service target. Look at the source annotations on the Pod with the expected mirror name and compare them with the adapter observation.

  ```sh
  cat static-pod.yaml
  kubectl get service board -o yaml
  kubectl get pods -o yaml
  ```
hints.2.text: |-
  ```sh
  cat /run/dq/observations/static-pod.json
  kubectl get pod "static-board-$DQ_NODE_NAME" -o yaml
  kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080
  ```

  Expect the observation to report `verified: true`, `source: file`, and the supplied bay node. The API mirror must be on that node, its UID must equal `mirrorUID`, and its `kubernetes.io/config.mirror` annotation must equal `configHash`. At least one container must be ready, and the Service must return `north-117`.
phrases.0: I distinguished a mirror Pod from its node manifest.
phrases.1: I verified the real kubelet and CRI identity.
phrases.2: I kept the static workload within the safe manifest contract.
questions.0.points.0: The node manifest remains the kubelet source of truth.
questions.0.points.1: The kubelet recreates the API mirror.
questions.0.prompt: Why does deleting a mirror Pod not remove the workload permanently?
questions.1.points.0: Static Pods do not support those API-dependent references.
questions.1.points.1: Use self-contained node configuration and strict limits.
questions.1.prompt: Can a static Pod use ordinary API-backed references like a service account?
stages.0.objectives.0.text: A verified file-sourced static Pod runs ready on `DQ_NODE_NAME`, with mirror
  Pod `static-board-$DQ_NODE_NAME` matching the adapter-observed identity and configuration.
stages.0.objectives.1.text: From Deployment `client`, `http://board:8080` returns `north-117`.
diagnostics.verified: The runtime may not yet have verified a kubelet-managed static Pod. Check the local manifest and the runtime observation after the file is applied. An API Pod with the same name cannot establish static ownership. [Cause and check](guides#guide=controllers-static&section=q117-verified-static-observation)
diagnostics.source: The observed workload may originate from the API rather than the static manifest. Inspect the runtime source and confirm the reported source is file. [Cause and check](guides#guide=controllers-static&section=q117-static-manifest-file-source)
diagnostics.node: The runtime observation may belong to another node or be missing. Compare the recorded node with the supplied bay node before examining mirror identity. [Cause and check](guides#guide=controllers-static&section=q117-static-source-bay-node)
diagnostics.uid: An API object occupying the mirror name or a delayed kubelet update can leave a different live UID. Compare the Pod UID with the current verified mirrorUID receipt. [Cause and check](guides#guide=controllers-static&section=q117-mirror-pod-observed-uid)
diagnostics.hash: The mirror may expose stale or missing config annotations after a manifest change. Compare its config.mirror value with the runtime-observed configHash. [Cause and check](guides#guide=controllers-static&section=q117-mirror-pod-config-hash)
diagnostics.pod_node: A same-name API Pod may be scheduled elsewhere. Compare the actual mirror Pod nodeName with the supplied bay node. [Cause and check](guides#guide=controllers-static&section=q117-mirror-pod-node-placement)
diagnostics.ready: The mirror can exist before any container is ready. Inspect actual container statuses and wait for a ready container from the current file-backed Pod. [Cause and check](guides#guide=controllers-static&section=q117-mirror-pod-container-readiness)
diagnostics.http: The static worker may listen on 8099 or the Service may not route to a ready static Pod. Query board from client and compare the response with north-117. [Cause and check](guides#guide=controllers-static&section=q117-static-board-service-response)
