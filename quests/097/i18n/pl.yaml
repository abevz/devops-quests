title: Odtworzenie i aktywacja wydania
brief: |-
  Prywatny rejestr jest dostępny, ale dostarczanie wydania i odbiorca wsadowy nie mogą go pobrać. Odtwórz zarchiwizowane wydanie przez obie istniejące ścieżki dostarczania.

  Pracuj w `~/quest` na stacji roboczej. Dane: `platform.env`, `recovery-image.tar`, `archive.sha256`, `release-image`, `registry-ca.crt`, `protected-image`, `repository/manifests/web.yaml`, `batch.yaml`, `application.yaml`. Zamrożone dane są w `/run/dq/facts/0/`.

  **Wymagania:**

  - Plik stacji roboczej `~/quest/recovery-image.tar` zachowuje dostarczoną sumę kontrolną.
  - Rejestr udostępnia pierwotne bajty wydania przez zweryfikowany TLS; obaj zachowani odbiorcy wykonują to niezmienne wydanie, a niezależny chroniony artefakt pozostaje nienaruszony.
    - Zachowaj pierwotny manifest pod tagiem z archiwum i digest, ze wszystkimi bajtami config/warstw oraz zadeklarowanymi rozmiarami.
    - Chroniony artefakt zachowuje zapisane tag, digest i wszystkie bloby.
    - Zachowaj tożsamości pierwotnych Application, Deployment, Service i CronJob, istniejące źródło Git, project, destination oraz automatyczne pruning i samonaprawianie.
    - Opublikowana definicja web pozostaje pod dostarczoną ścieżką repozytorium, a obserwowana rewizja aplikacji odpowiada opublikowanej zdalnej rewizji.
    - Obrazy zadeklarowane u obu odbiorców muszą wskazywać niezmienny digest z archiwum, a rzeczywiste image ID muszą mu odpowiadać.
    - Usługa web zwraca dostarczoną odpowiedź.
    - Pozostaw zwykły harmonogram wsadowy zawieszony; zachowaj dokładnie jeden nowy ukończony Job z naprawionego szablonu (lub równoważny poprawny Job), jego rzeczywisty ukończony Pod, kod wyjścia zero i dostarczony wynik wsadowy.
    - Zapisana poprzednia próba się nie liczy.
    - Patch statusu Podów i Jobów pozostaje niedostępny dla gracza.

  Kontrole obserwują bieżący stan zawartości i dostarczania oraz zachowane dowody wykonania; nie dowodzą nieprzerwanej dostępności ani odtworzenia hosta rejestru lub pamięci masowej.
debrief: Archiwum odtworzyło pierwotny artefakt, ale dostarczenie wymagało świadomej publikacji i aktywacji
  u dwóch niezależnych właścicieli. Bajty rejestru, rzeczywiste image ID, zakończenie zadania i zachowane
  tożsamości potwierdzają odtworzenie.
stages.0.brief: Zachowaj archiwum i odtwórz to samo wydanie w rejestrze i u obu odbiorców.
hints.0.text: Dostępność artefaktu i aktywacja odbiorcy to oddzielne granice. Przywrócony tag sam nie
  dowodzi, że niezależnie zarządzani odbiorcy wykonują właściwe bajty.
hints.1.text: |-
  Porównaj `tar tf recovery-image.tar`, `cat release-image` i `docker image ls` z odpowiedziami rejestru. Zbadaj `kubectl get applications,deployments,cronjobs,jobs,pods -o yaml`, zdarzenia pobierania obrazów Podów oraz definicje Git/batch. Ustal właściciela każdego zadeklarowanego obrazu; zamrożone dane odróżniają poprzednią próbę od nowego wykonania.

  Porównaj osobno referencje archiwum, rejestru i Git. W zasobach wsadowych odszukaj wstrzymany harmonogram, szablon obrazu przyszłych uruchomień i zapisany wyjściowy Job.
hints.2.text: |-
  Sprawdź `git -C repository log -1`, `kubectl get applications,jobs,pods -o wide` i `kubectl logs <completed-pod> -c worker`. Oczekuj opublikowanej rewizji, pierwotnego digest w obu szablonach i rzeczywistych kontenerach, dostarczonych odpowiedzi HTTP/batch oraz faktycznie ukończonego nowego Joba. Zachowaj Job i Pod do weryfikacji.

  Archiwum i rejestr. Sprawdź niezmienne bajty odzyskanego wydania i chronionego artefaktu.

  ```bash
  (
    set -euo pipefail
    cd ~/quest
    set -a
    source platform.env
    set +a
    printf '%s  recovery-image.tar\n' "$(cat /run/dq/facts/0/archive.sha256)" | sha256sum -c -
    python3 -I - <<'VERIFY_REGISTRY'
  import base64
  import hashlib
  import http.client
  import json
  import os
  import ssl
  from pathlib import Path

  facts = Path("/run/dq/facts/0")
  registry = os.environ["REGISTRY"]
  credentials = (os.environ["REGISTRY_USER"] + ":" + os.environ["REGISTRY_PASSWORD"]).encode()
  authorization = "Basic " + base64.b64encode(credentials).decode()
  context = ssl.create_default_context(cafile=str(facts / "registry-ca.crt"))
  headers = {"Authorization": authorization, "Accept": (
      "application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json")}

  def manifest(repository, reference):
      with_response = http.client.HTTPSConnection(registry, timeout=4, context=context)
      try:
          with_response.request("GET", f"/v2/{repository}/manifests/{reference}", headers=headers)
          response = with_response.getresponse()
          assert response.status == 200
          return response.read()
      finally:
          with_response.close()

  def verify_blobs(repository, manifest_bytes):
      document = json.loads(manifest_bytes)
      for blob in [document["config"], *document["layers"]]:
          wanted = blob["digest"]
          digest = hashlib.sha256()
          size = 0
          connection = http.client.HTTPSConnection(registry, timeout=4, context=context)
          try:
              connection.request("GET", f"/v2/{repository}/blobs/{wanted}", headers={"Authorization": authorization})
              response = connection.getresponse()
              assert response.status == 200
              while chunk := response.read(65536):
                  digest.update(chunk)
                  size += len(chunk)
          finally:
              connection.close()
          assert "sha256:" + digest.hexdigest() == wanted and size == blob["size"]

  release_digest = (facts / "release-image").read_text().strip().rsplit("@", 1)[1]
  release = manifest("parcel", release_digest)
  assert "sha256:" + hashlib.sha256(release).hexdigest() == release_digest
  assert manifest("parcel", "1") == release
  verify_blobs("parcel", release)
  baseline = json.loads((facts / "recovery-baseline.json").read_text())
  protected_digest = baseline["protected_image"].rsplit("@", 1)[1]
  protected = manifest("protected", baseline["protected_tag"])
  assert "sha256:" + hashlib.sha256(protected).hexdigest() == protected_digest
  verify_blobs("protected", protected)
  print("Restored and protected registry bytes match")
  VERIFY_REGISTRY
  )
  ```

  Git i aktywni konsumenci. Sprawdź bieżące wdrożenie web i zakończony oddzielny Job.

  ```bash
  (
    set -euo pipefail
    cd ~/quest
    source platform.env
    baseline=/run/dq/facts/0/recovery-baseline.json
    image=$(cat /run/dq/facts/0/release-image)
    digest=${image##*@}
    repository=${image%@*}
    git -C repository fetch -q origin main
    head=$(git -C repository rev-parse origin/main)
    kubectl get deployment,service,cronjob,application -o json |
      jq -e --slurpfile baseline "$baseline" '
        .items as $current | all($baseline[0].identities | to_entries[]; . as $original |
          any($current[]; (.kind+"/"+.metadata.name)==$original.key and .metadata.uid==$original.value))'
    declared_web_image=$(git -C repository show "$head:manifests/web.yaml" |
      python3 -I -c 'import sys,yaml
  docs = yaml.safe_load_all(sys.stdin)
  web = next(doc for doc in docs if isinstance(doc, dict) and doc.get("kind") == "Deployment"
             and doc["metadata"]["name"] == "archive-web")
  print(next(container["image"] for container in web["spec"]["template"]["spec"]["containers"]
             if container["name"] == "worker"))')
    kubectl get application release -o json |
      jq -e --arg head "$head" --slurpfile baseline "$baseline" '
        .spec.source == $baseline[0].source and
        .spec.project == "station" and .spec.destination == {server:"https://kubernetes.default.svc",namespace:.metadata.namespace} and
        .spec.syncPolicy.automated.enabled != false and .spec.syncPolicy.automated.prune == true and
        .spec.syncPolicy.automated.selfHeal == true and
        .status.sync.status == "Synced" and .status.sync.revision == $head'
    pin_matches() {
      [[ "$1" == "$repository@$digest" || "$1" == "$repository:"*"@$digest" ]]
    }
    web=$(kubectl get deployment archive-web -o json)
    web_uid=$(jq -er .metadata.uid <<<"$web")
    web_image=$(jq -er '.spec.template.spec.containers[] | select(.name=="worker") | .image' <<<"$web")
    pin_matches "$web_image"
    test "$declared_web_image" = "$web_image"
    replicas=$(jq -er 'select(.spec.replicas>0 and .status.readyReplicas==.spec.replicas and
      .status.observedGeneration==.metadata.generation) | .spec.replicas' <<<"$web")
    web_sets=$(kubectl get rs -o json | jq -c --arg uid "$web_uid" '
      [.items[] | select(any(.metadata.ownerReferences[]?; .kind=="Deployment" and .controller==true and .uid==$uid)) | .metadata.uid]')
    kubectl get pods -o json | jq -e --argjson owners "$web_sets" --argjson replicas "$replicas" --arg image "$web_image" --arg digest "$digest" '
      [.items[] | select(.metadata.deletionTimestamp==null and .status.phase!="Failed" and .status.phase!="Succeeded" and
        any(.metadata.ownerReferences[]?; .kind=="ReplicaSet" and .controller==true and (.uid as $uid | $owners | index($uid)!=null)))]
      | length==$replicas and all(.[]; .status.phase=="Running" and
        any(.spec.containers[]; .name=="worker" and .image==$image) and
        any(.status.containerStatuses[]?; .name=="worker" and .ready==true and (.state.running|type)=="object" and
          ((.imageID | split("@") | last | split("/") | last) == $digest)))'
    test "$(kubectl exec deployment/archive-web -c worker -- wget -qO- -T 3 http://archive-web:8080)" = "$(jq -er .http_response "$baseline")"
    template=$(kubectl get cronjob archive-scan -o json |
      jq -cer 'select(.spec.suspend == true) | .spec.jobTemplate.spec.template.spec')
    declared=$(jq -er '.containers[] | select(.name=="worker") | .image' <<<"$template")
    pin_matches "$declared"
    job_uid=$(kubectl get jobs -o json | jq -er --argjson template "$template" --slurpfile baseline "$baseline" '
      [$baseline[0].previous_jobs as $old | .items[] | .metadata.uid as $uid |
        select(($old | index($uid)) == null and
               any(.status.conditions[]?; .type=="Complete" and .status=="True"))]
      | select(length == 1) | .[0] | select(.spec.template.spec == $template) | .metadata.uid')
    pod=$(kubectl get pods -o json | jq -er --arg owner "$job_uid" --arg image "$declared" --arg digest "$digest" '
      [.items[] | select(.status.phase=="Succeeded" and
        any(.metadata.ownerReferences[]?; .kind=="Job" and .controller==true and .uid==$owner))]
      | select(length>0 and all(.[];
        any(.spec.containers[]; .name=="worker" and .image==$image) and
        any(.status.containerStatuses[]?; .name=="worker" and .state.terminated.exitCode==0 and
          ((.imageID | split("@") | last | split("/") | last) == $digest))))
      | .[0].metadata.name')
    test -n "$pod"
    test "$(kubectl logs "$pod" -c worker)" = "$(jq -er .batch_response "$baseline")"
    test "$(kubectl auth can-i patch pods --subresource=status)" = no
    test "$(kubectl auth can-i patch jobs --subresource=status)" = no
    printf '%s\n' 'Current Git, suspended template and completed Job observed.'
  )
  ```
phrases.0: Oddzieliłem dostępność usługi od utraty artifact.
phrases.1: Odzyskałem oryginalną, niezmienną wersję ze zweryfikowanego archiwum.
phrases.2: Zweryfikowałem manifest i config poprzez uwierzytelnione TLS.
stages.0.objectives.0.text: Plik stacji roboczej `~/quest/recovery-image.tar` zachowuje dostarczoną sumę
  kontrolną.
stages.0.objectives.1.text: Rejestr udostępnia pierwotne bajty wydania przez zweryfikowany TLS; obaj zachowani
  odbiorcy wykonują to niezmienne wydanie, a niezależny chroniony artefakt pozostaje nienaruszony.
diagnostics.recovery_archive: Dostarczony recovery-image.tar może zniknąć lub zmienić się po odzyskiwaniu albo zamrożona suma jest nieczytelna. Zachowaj archiwum i porównaj SHA-256 surowych bajtów z potwierdzeniem. Podobny nowy image lub zmiana roboczego checksum nie potwierdza pierwotnych bajtów. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=archived-release-untouched-archive-bytes)
diagnostics.recovery_registry: Setup usuwa użyteczne lokalne aliasy wydania i manifest registry; archiwum ma przywrócić dokładnie to wydanie, nie nowy build. Sprawdź zaufany TLS, dostarczone uwierzytelnienie, immutable manifest digest, identyczne bajty tagu 1 i digest/rozmiar każdego config/layer. Niezależny protected artefakt i jego blobs też muszą przetrwać. Każdy błąd polecenia lub porównania tej fazy registry daje ten sam marker. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=archived-release-exact-registry-bytes-and-protected-artifact)
diagnostics.recovery_identity: Odtworzenie kontrolerów, Service lub definicji batch zachowuje nazwy, lecz zmienia UID. Napraw pierwotne obiekty i pozostaw CronJob wstrzymany; ręczne uruchomienie odzyskiwania nie wymaga włączania harmonogramu. Brak lub złe dokumenty baseline/obiektu przed fazą source też dają marker tożsamości. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=archived-release-original-suspended-consumers)
diagnostics.recovery_source: Odtworzenie registry samo nie aktualizuje Git ani odbiorcy. Opublikuj digest archiwalnego image w istniejącym web Deployment, zachowaj source Application, project station i destination, poczekaj na synchronizację bieżącego Git head przy automatycznych self-healing/pruning. Image żywego worker ma dokładnie odpowiadać zadeklarowanej referencji digest-pinned; sam zmienny tag nie przejdzie. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=archived-release-published-immutable-source)
diagnostics.recovery_web: Web Deployment może wskazywać odzyskany image, gdy rollout używa starych lub niegotowych Pod. Zachowaj dodatnie całkowite replicas, bieżącą observed generation i dokładnie gotowe aktualne należące Pod z tym image; rzeczywisty HTTP archive-web ma zwracać pierwotne archive-97. Błędy API, exec lub HTTP w fazie web dają ten sam marker. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=archived-release-real-web-adoption)
diagnostics.recovery_batch: Naprawa szablonu wstrzymanego CronJob nie naprawia poprzedniego Job ani nie tworzy sukcesu. Zachowaj wyłączony harmonogram i utwórz jeden nowy udany Job z naprawionego szablonu archiwalnego image. Pełny Pod spec ma odpowiadać szablonowi, rzeczywisty należący worker Pod zakończyć się kodem 0, runtime image digest być archiwalny, logi checked-97; dozwolony jest dokładnie jeden nowy ukończony Job, stare błędy mogą zostać. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=archived-release-real-completed-manual-execution)
diagnostics.recovery_authority: Nadanie graczowi prawa zmiany status Pod lub Job umożliwia fałszywy dowód wykonania. Zachowaj odmowę obu kontroli status patch i obserwuj rzeczywiste zakończenie kontenera, image identity i logi. Błąd odczytu autoryzacji lub wynik inny niż no również nie przejdzie. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=archived-release-observe-without-status-forgery)
diagnostics.probe_0_1: Po fazie registry może zawieść Git fetch, odczyt opublikowanego web manifest, zbiorczy zrzut Kubernetes lub start Python/helper przed nazwanym porównaniem. Sprawdź rzeczywiste odczyty i workspace. Błędy registry mają recovery_registry, przechwycone identity/source/web/batch zachowują markery; fallback pojawia się tylko bez nich. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=archived-release-unlabelled-consumer-input)
