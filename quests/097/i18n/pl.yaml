title: Przywrócenie rejestru
brief: |-
  Odbiorcy docierają do prywatnego rejestru, ale nie mogą pobrać obrazu wydania. Odtwórz jego pierwotną zawartość z dostarczonego archiwum.

  Pracuj na workstation w `~/quest` z plikami `platform.env`, `recovery-image.tar`, `release-image`, `registry-ca.crt`.

  **Requirements:**

  - Plik `~/quest/recovery-image.tar` na workstation zachowuje dostarczoną sumę kontrolną.
  - Dostarczony prywatny rejestr udostępnia pierwotne wydanie pod tagiem zapisanym w archiwum odzyskiwania i jego niezmiennym digestem; blob konfiguracji jest dostępny przez zweryfikowany TLS.

  Ćwiczenie przywraca zawartość obrazu, a nie host rejestru ani dowolny magazyn.
debrief: Niezmienna wersja została odzyskana z zachowanej zawartości obrazu i zweryfikowana za pomocą
  rejestru API.
stages.0.brief: Zachowaj dostarczone archiwum odzyskiwania bez zmian.
hints.0.text: Dostępność procesu nie oznacza dostępności treści obrazu.
hints.1.text: |-
  Sprawdź dostarczone odwołanie do obrazu i listę obrazów prywatnego Docker daemon.

  ```bash
  cat release-image
  docker image ls
  ```
hints.2.text: |-
  Załaduj zatwierdzone archiwum, wypchnij oryginalne odniesienie i sprawdź rzeczywiste bajty manifest. Użyj zamrożonego digest i zarchiwizuj checksum jako osobne kontrole.

  Sprawdź z `~/quest` na workstation:

  - `sha256sum recovery-image.tar`
  - `cat /run/dq/facts/0/archive.sha256`

  Wartości SHA-256 są zgodne.

  - `source platform.env`
  - `curl -fsS --cacert registry-ca.crt --config <(printf 'user = "%s:%s"\n' "$REGISTRY_USER" "$REGISTRY_PASSWORD") -H 'Accept: application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json' -I "https://$REGISTRY/v2/parcel/manifests/1"`
  - `config=$(curl -fsS --cacert registry-ca.crt --config <(printf 'user = "%s:%s"\n' "$REGISTRY_USER" "$REGISTRY_PASSWORD") -H 'Accept: application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json' "https://$REGISTRY/v2/parcel/manifests/1" | jq -r .config.digest)`
  - `curl -fsS --cacert registry-ca.crt --config <(printf 'user = "%s:%s"\n' "$REGISTRY_USER" "$REGISTRY_PASSWORD") -I "https://$REGISTRY/v2/parcel/blobs/$config"`

  HTTP `200`; `Docker-Content-Digest` odpowiada digestowi z `release-image`. Blob konfiguracji również zwraca HTTP `200`.
phrases.0: Oddzieliłem dostępność usługi od utraty artifact.
phrases.1: Odzyskałem oryginalną, niezmienną wersję ze zweryfikowanego archiwum.
phrases.2: Zweryfikowałem manifest i config poprzez uwierzytelnione TLS.
stages.0.objectives.0.text: Plik `~/quest/recovery-image.tar` na workstation zachowuje dostarczoną sumę
  kontrolną.
stages.0.objectives.1.text: Dostarczony prywatny rejestr udostępnia pierwotne wydanie pod tagiem zapisanym
  w archiwum odzyskiwania i jego niezmiennym digestem; blob konfiguracji jest dostępny przez zweryfikowany
  TLS.
