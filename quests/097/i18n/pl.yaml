title: Przywrócenie rejestru
brief: 'Prywatny proces registry i TLS są w dobrej kondycji, ale wersja manifest została usunięta. W tej
  wnęce pozostaje archiwum Docker recovery-image.tar. Sprawdź to względem zamrożonego SHA-256, załaduj
  go do prywatnego Docker daemon i wypchnij parcel:1 z powrotem do tego samego registry. Odzyskaj dokładny
  oryginalny skrót manifest i config blob; nowy tag wskazujący na inne bajty nie umożliwia odzyskania.
  Zamrożony CA pozostaje wiarygodny. To ćwiczenie przywraca zawartość obrazu, a nie host registry lub
  dowolną pamięć.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `platform.env`, `recovery-image.tar`,
  `archive.sha256`, `release-image`, `registry-ca.crt`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: zweryfikowane archiwum zostaje zachowane, a parcel:1 ponownie przekształca
  się w oryginalny immutable manifest z jego config dostępnym w zweryfikowanym TLS.'
debrief: Niezmienna wersja została odzyskana z zachowanej zawartości obrazu i zweryfikowana za pomocą
  rejestru API.
stages.0.brief: 'Kryteria sukcesu: zweryfikowane archiwum zostaje zachowane, a parcel:1 ponownie przekształca
  się w oryginalne immutable manifest z dostępnym config w zweryfikowanym TLS.'
stages.0.objectives.0.text: Zweryfikowane archiwum zostaje zachowane, a parcel:1 ponownie przekształca
  się w oryginalne immutable manifest z jego config dostępnym w stosunku do zweryfikowanego TLS.
hints.0.text: Dostępność procesu nie oznacza dostępności treści obrazu.
hints.1.text: Użyj zamrożonego digest i zarchiwizuj checksum jako osobne kontrole.
hints.2.text: Załaduj zatwierdzone archiwum, wypchnij oryginalne odniesienie i sprawdź rzeczywiste bajty
  manifest.
phrases.0: Oddzieliłem dostępność usługi od utraty artifact.
phrases.1: Odzyskałem oryginalną, niezmienną wersję ze zweryfikowanego archiwum.
phrases.2: Zweryfikowałem manifest i config poprzez uwierzytelnione TLS.
