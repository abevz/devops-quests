title: Release-Wiederherstellung und Aktivierung
brief: |-
  Die private Registry ist erreichbar, aber Release-Auslieferung und Batch-Verbraucher können das Release nicht abrufen. Stelle das archivierte Release über beide vorhandenen Auslieferungswege wieder her.

  Arbeite in `~/quest` auf der Workstation. Eingaben: `platform.env`, `recovery-image.tar`, `archive.sha256`, `release-image`, `registry-ca.crt`, `protected-image`, `repository/manifests/web.yaml`, `batch.yaml`, `application.yaml`. Unveränderliche Fakten liegen unter `/run/dq/facts/0/`.

  **Anforderungen:**

  - Die Workstation-Datei `~/quest/recovery-image.tar` behält ihre vorgegebene Prüfsumme.
  - Die Registry liefert die ursprünglichen Release-Bytes über geprüftes TLS; beide erhaltenen Verbraucher führen dieses unveränderliche Release aus, und das unabhängige geschützte Artefakt bleibt intakt.
    - Erhalte das ursprüngliche Manifest unter Archiv-Tag und Digest einschließlich aller Config-/Layer-Bytes und angegebenen Größen.
    - Das geschützte Artefakt muss unter aufgezeichnetem Tag und Digest mit allen Blobs erhalten bleiben.
    - Erhalte Identitäten von Application, Deployment, Service und CronJob, vorhandene Git-Quelle, Project, Destination sowie automatisches Pruning und Selbstheilung.
    - Die veröffentlichte Web-Definition bleibt am vorgegebenen Repository-Pfad, und die beobachtete Application-Revision entspricht der veröffentlichten Remote-Revision.
    - Beide deklarierten Images müssen den unveränderlichen Archiv-Digest angeben; echte Container-Image-IDs müssen dazu passen.
    - Der Web-Dienst liefert die vorgegebene Antwort.
    - Lasse den regulären Batch-Zeitplan ausgesetzt; erhalte genau einen neuen abgeschlossenen Job aus der reparierten Vorlage (oder einen gleichwertigen gültigen Job), seinen echten abgeschlossenen Pod, Exit-Code null und die vorgegebene Batch-Ausgabe.
    - Der aufgezeichnete frühere Versuch zählt nicht.
    - Pod- und Job-Status dürfen weiterhin nicht vom Spieler gepatcht werden.

  Die Prüfungen beobachten den aktuellen Inhalts-/Auslieferungszustand und erhaltene Ausführungsnachweise; sie belegen weder unterbrechungsfreie Verfügbarkeit noch Wiederherstellung von Registry-Host oder Speicher.
debrief: Das Archiv stellte das ursprüngliche Artefakt wieder her, doch die Auslieferung erforderte bewusste
  Veröffentlichung und Aktivierung bei zwei unabhängigen Verantwortlichen. Registry-Bytes, echte Image-IDs,
  Batch-Beendigung und erhaltene Identitäten belegen das Ergebnis.
stages.0.brief: Erhalte das Archiv und stelle dasselbe Release in Registry und beiden Verbrauchern wieder
  her.
hints.0.text: Artefaktverfügbarkeit und Verbraucheraktivierung sind getrennte Grenzen. Ein wiederhergestelltes
  Tag allein beweist nicht, dass unabhängig verwaltete Verbraucher die beabsichtigten Bytes ausführen.
hints.1.text: Vergleiche `tar tf recovery-image.tar`, `cat release-image` und `docker image ls` mit Registry-Antworten.
  Prüfe `kubectl get applications,deployments,cronjobs,jobs,pods -o yaml`, Image-Pull-Ereignisse der Pods
  und die Git-/Batch-Definitionen. Verfolge die Zuständigkeit jedes deklarierten Images; die unveränderliche
  Baseline unterscheidet frühere Versuche von neuer Ausführung.
hints.2.text: Prüfe die Archiv-Prüfsumme vor dem Laden in den privaten Daemon. Stelle die ursprüngliche
  Registry-Referenz wieder her und vergleiche echte Manifest-/Config-/Layer-Bytes einschließlich des geschützten
  Artefakts. Veröffentliche das wiederhergestellte unveränderliche Image in Git, repariere die unabhängige
  Batch-Vorlage und starte eine neue Ausführung bei weiterhin ausgesetztem Zeitplan. Prüfe `git -C repository
  log -1`, `kubectl get applications,jobs,pods -o wide` und `kubectl logs <completed-pod> -c worker`.
  Erwartet werden die veröffentlichte Revision, der ursprüngliche Digest in beiden Vorlagen und echten
  Containern, vorgegebene HTTP-/Batch-Antworten und ein wirklich abgeschlossener neuer Job. Erhalte Job
  und Pod bis zur Prüfung.
phrases.0: Ich habe die Serviceverfügbarkeit vom artifact-Verlust getrennt.
phrases.1: Ich habe die ursprüngliche unveränderliche Version aus einem verifizierten Archiv wiederhergestellt.
phrases.2: Ich habe manifest und config durch authentifiziertes TLS überprüft.
stages.0.objectives.0.text: Die Workstation-Datei `~/quest/recovery-image.tar` behält ihre vorgegebene
  Prüfsumme.
stages.0.objectives.1.text: Die Registry liefert die ursprünglichen Release-Bytes über geprüftes TLS;
  beide erhaltenen Verbraucher führen dieses unveränderliche Release aus, und das unabhängige geschützte
  Artefakt bleibt intakt.
diagnostics.recovery_archive: recovery-image.tar fehlt möglicherweise, wurde nach Wiederherstellung verändert oder die eingefrorene Prüfsumme ist unlesbar. Erhalten Sie das gelieferte Archiv und vergleichen Sie rohe SHA-256 mit dem Beleg. Ein ähnliches neues Image oder geänderte Arbeitsprüfsumme belegt keine Originalbytes. [Ursache und Prüfung](guides#guide=gitops-delivery&section=archived-release-untouched-archive-bytes)
diagnostics.recovery_registry: Setup entfernt verwendbare lokale Release-Aliasse und das Registry-Manifest; das Archiv muss exakt dieses Release statt eines Neubaus wiederherstellen. Prüfen Sie vertrauenswürdiges TLS, gelieferte Authentifizierung, Immutable-Manifest-Digest, identische Tag-1-Bytes sowie Digest und Größe jedes Config-/Layer-Blobs. Das unabhängige protected-Artefakt samt Blobs muss erhalten bleiben. Jeder Befehls- oder Vergleichsfehler dieser Registry-Phase nutzt denselben Marker. [Ursache und Prüfung](guides#guide=gitops-delivery&section=archived-release-exact-registry-bytes-and-protected-artifact)
diagnostics.recovery_identity: Neue Controller, Services oder Batch-Definitionen erhalten Namen, ändern aber eingefrorene UIDs. Reparieren Sie Originalobjekte und lassen Sie den CronJob angehalten; eine manuelle Wiederherstellung verlangt keinen aktiven Zeitplan. Fehlende oder ungültige Baseline-/Objektdokumente vor der Source-Phase nutzen ebenfalls diesen Identitätsmarker. [Ursache und Prüfung](guides#guide=gitops-delivery&section=archived-release-original-suspended-consumers)
diagnostics.recovery_source: Eine wiederhergestellte Registry aktualisiert Git und Verbraucher nicht automatisch. Veröffentlichen Sie den archivierten Image-Digest in der vorhandenen Web-Deployment-Definition, erhalten Sie Application-Source, Projekt station und Ziel und warten Sie auf Synchronisierung des aktuellen Git-Stands mit self-healing/pruning. Das Live-worker-Image muss exakt der deklarierten digest-pinned Referenz entsprechen; ein veränderlicher Tag allein scheitert. [Ursache und Prüfung](guides#guide=gitops-delivery&section=archived-release-published-immutable-source)
diagnostics.recovery_web: Das Web-Deployment kann das richtige Image nennen, während alte oder nicht bereite Pods laufen. Erhalten Sie positive ganzzahlige replicas, aktuelle observed generation und genau die bereiten aktuellen zugehörigen Pods mit diesem Image; archive-web muss per HTTP den ursprünglichen Wert archive-97 liefern. API-, exec- und HTTP-Fehler dieser Web-Phase nutzen denselben Marker. [Ursache und Prüfung](guides#guide=gitops-delivery&section=archived-release-real-web-adoption)
diagnostics.recovery_batch: Eine reparierte angehaltene CronJob-Vorlage repariert keinen alten unterbrochenen Job und erzeugt keinen Erfolg. Lassen Sie den Zeitplan aus und erstellen Sie einen neuen erfolgreichen Job aus der korrigierten Archiv-Image-Vorlage. Vollständige Pod-Spec muss der Vorlage entsprechen, ein echter zugehöriger worker Pod mit Code 0, archiviertem Runtime-Digest und Logs mit checked-97 erfolgreich sein; genau ein neuer abgeschlossener Job wird akzeptiert, alte Fehlversuche dürfen bleiben. [Ursache und Prüfung](guides#guide=gitops-delivery&section=archived-release-real-completed-manual-execution)
diagnostics.recovery_authority: Patch-Rechte des Spielers auf Pod- oder Job-status erlaubten erfundene Ausführungsbelege. Erhalten Sie die Ablehnung beider Status-Patch-Prüfungen und beobachten Sie echte Containerbeendigung, Image-Identität und Logs. Fehlgeschlagene Berechtigungsbeobachtung oder andere Ausgabe als no scheitert ebenfalls. [Ursache und Prüfung](guides#guide=gitops-delivery&section=archived-release-observe-without-status-forgery)
diagnostics.probe_0_1: Nach der Registry-Phase können Git-Fetch, veröffentlichtes Web-Manifest, gemeinsamer Kubernetes-Snapshot oder Python-/Helper-Start vor einem benannten Vergleich scheitern. Prüfen Sie diese tatsächlichen Lesewege und den Workspace. Registry-Fehler haben recovery_registry, abgefangene identity/source/web/batch-Fehler behalten eigene Marker; der Fallback erscheint nur ohne sie. [Ursache und Prüfung](guides#guide=gitops-delivery&section=archived-release-unlabelled-consumer-input)
