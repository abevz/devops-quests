title: Registry-Wiederherstellung
brief: |-
  Verbraucher erreichen die private Registry, können aber das Release-Image nicht abrufen. Stellen Sie den ursprünglichen Image-Inhalt aus dem bereitgestellten Archiv wieder her.

  Arbeiten Sie auf der Workstation in `~/quest` mit `platform.env`, `recovery-image.tar`, `release-image`, `registry-ca.crt`.

  **Requirements:**

  - Die Workstation-Datei `~/quest/recovery-image.tar` behält ihre bereitgestellte Prüfsumme.
  - Die bereitgestellte private Registry liefert das ursprüngliche Release unter dem im Wiederherstellungsarchiv aufgezeichneten Tag und seinem unveränderlichen Digest; der Config-Blob ist über geprüftes TLS verfügbar.

  Diese Übung stellt Image-Inhalt wieder her, nicht den Registry-Host oder beliebigen Speicher.
debrief: Die unveränderliche Version wurde aus dem beibehaltenen Bildinhalt wiederhergestellt und durch
  registry API überprüft.
stages.0.brief: Erhalten Sie das bereitgestellte Wiederherstellungsarchiv unverändert.
hints.0.text: Die Prozessverfügbarkeit bedeutet nicht die Verfügbarkeit von Bildinhalten.
hints.1.text: |-
  Prüfen Sie die bereitgestellte Image-Referenz und den Image-Bestand des privaten Docker-Daemons.

  ```bash
  cat release-image
  docker image ls
  ```
hints.2.text: |-
  Laden Sie das genehmigte Archiv, übertragen Sie die Originalreferenz und überprüfen Sie die tatsächlichen manifest-Bytes. Verwenden Sie das eingefrorene digest und das Archiv checksum als separate Prüfungen.

  Prüfen Sie in `~/quest` auf der Workstation:

  - `sha256sum recovery-image.tar`
  - `cat /run/dq/facts/0/archive.sha256`

  Die SHA-256-Werte stimmen überein.

  - `source platform.env`
  - `curl -fsS --cacert registry-ca.crt --config <(printf 'user = "%s:%s"\n' "$REGISTRY_USER" "$REGISTRY_PASSWORD") -H 'Accept: application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json' -I "https://$REGISTRY/v2/parcel/manifests/1"`
  - `config=$(curl -fsS --cacert registry-ca.crt --config <(printf 'user = "%s:%s"\n' "$REGISTRY_USER" "$REGISTRY_PASSWORD") -H 'Accept: application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json' "https://$REGISTRY/v2/parcel/manifests/1" | jq -r .config.digest)`
  - `curl -fsS --cacert registry-ca.crt --config <(printf 'user = "%s:%s"\n' "$REGISTRY_USER" "$REGISTRY_PASSWORD") -I "https://$REGISTRY/v2/parcel/blobs/$config"`

  HTTP `200`; `Docker-Content-Digest` entspricht dem Digest aus `release-image`. Der Config-Blob liefert ebenfalls HTTP `200`.
phrases.0: Ich habe die Serviceverfügbarkeit vom artifact-Verlust getrennt.
phrases.1: Ich habe die ursprüngliche unveränderliche Version aus einem verifizierten Archiv wiederhergestellt.
phrases.2: Ich habe manifest und config durch authentifiziertes TLS überprüft.
stages.0.objectives.0.text: Die Workstation-Datei `~/quest/recovery-image.tar` behält ihre bereitgestellte
  Prüfsumme.
stages.0.objectives.1.text: Die bereitgestellte private Registry liefert das ursprüngliche Release unter
  dem im Wiederherstellungsarchiv aufgezeichneten Tag und seinem unveränderlichen Digest; der Config-Blob
  ist über geprüftes TLS verfügbar.
