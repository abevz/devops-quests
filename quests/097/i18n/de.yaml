title: Registry-Wiederherstellung
brief: 'Der private Prozess registry und TLS sind fehlerfrei, aber die Version manifest wurde gelöscht.
  In diesem Schacht verbleibt ein Docker-Archiv recovery-image.tar. Überprüfen Sie es anhand des eingefrorenen
  SHA-256, laden Sie es in das private Docker daemon und verschieben Sie parcel:1 zurück in dasselbe registry.
  Stellen Sie das exakte Original manifest digest und config blob wieder her; Ein neuer tag, der auf andere
  Bytes zeigt, stellt keine Wiederherstellung dar. Der eingefrorene CA bleibt maßgeblich. Bei dieser Übung
  wird der Bildinhalt wiederhergestellt, nicht der registry-Host oder ein beliebiger Speicher.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `platform.env`, `recovery-image.tar`,
  `archive.sha256`, `release-image`, `registry-ca.crt`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Anfängliche Erfolgskriterien: Das verifizierte Archiv bleibt erhalten und parcel:1 wird erneut in das
  ursprüngliche immutable manifest mit seinem über verifizierten TLS verfügbaren config aufgelöst.'
debrief: Die unveränderliche Version wurde aus dem beibehaltenen Bildinhalt wiederhergestellt und durch
  registry API überprüft.
stages.0.brief: 'Erfolgskriterium: Das verifizierte Archiv bleibt erhalten und parcel:1 wird erneut in
  das ursprüngliche immutable manifest mit seinem über verifizierten TLS verfügbaren config aufgelöst.'
stages.0.objectives.0.text: Das verifizierte Archiv bleibt erhalten und parcel:1 wird wieder in das ursprüngliche
  immutable manifest mit seinem über verifizierten TLS verfügbaren config aufgelöst.
hints.0.text: Die Prozessverfügbarkeit bedeutet nicht die Verfügbarkeit von Bildinhalten.
hints.1.text: Verwenden Sie das eingefrorene digest und das Archiv checksum als separate Prüfungen.
hints.2.text: Laden Sie das genehmigte Archiv, übertragen Sie die Originalreferenz und überprüfen Sie
  die tatsächlichen manifest-Bytes.
phrases.0: Ich habe die Serviceverfügbarkeit vom artifact-Verlust getrennt.
phrases.1: Ich habe die ursprüngliche unveränderliche Version aus einem verifizierten Archiv wiederhergestellt.
phrases.2: Ich habe manifest und config durch authentifiziertes TLS überprüft.
