title: Восстановление реестра
brief: |-
  Потребители достигают приватного реестра, но не могут получить образ релиза. Восстановите исходное содержимое образа из предоставленного архива.

  Работайте на workstation в `~/quest` с файлами `platform.env`, `recovery-image.tar`, `release-image`, `registry-ca.crt`.

  **Requirements:**

  - Файл `~/quest/recovery-image.tar` на workstation сохраняет предоставленную контрольную сумму.
  - Предоставленный приватный реестр отдаёт исходный релиз по тегу из архива восстановления и по неизменяемому digest; config blob доступен через TLS с проверкой сертификата.

  Это упражнение восстанавливает содержимое образа, а не хост реестра или произвольное хранилище.
debrief: Immutable-релиз восстановлен из сохранённого образа и проверен через API registry.
stages.0.brief: Сохраните предоставленный архив восстановления без изменений.
hints.0.text: Доступность процесса не означает доступность содержимого образа.
hints.1.text: |-
  Изучите предоставленную ссылку на образ и список образов приватного Docker daemon.

  ```bash
  cat release-image
  docker image ls
  ```
hints.2.text: |-
  Загрузите проверенный архив, отправьте исходную ссылку и проверьте реальные байты manifest. Отдельно проверяйте сохранённый digest и checksum архива.

  Проверьте из `~/quest` на workstation:

  - `sha256sum recovery-image.tar`
  - `cat /run/dq/facts/0/archive.sha256`

  Значения SHA-256 совпадают.

  - `source platform.env`
  - `curl -fsS --cacert registry-ca.crt --config <(printf 'user = "%s:%s"\n' "$REGISTRY_USER" "$REGISTRY_PASSWORD") -H 'Accept: application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json' -I "https://$REGISTRY/v2/parcel/manifests/1"`
  - `config=$(curl -fsS --cacert registry-ca.crt --config <(printf 'user = "%s:%s"\n' "$REGISTRY_USER" "$REGISTRY_PASSWORD") -H 'Accept: application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json' "https://$REGISTRY/v2/parcel/manifests/1" | jq -r .config.digest)`
  - `curl -fsS --cacert registry-ca.crt --config <(printf 'user = "%s:%s"\n' "$REGISTRY_USER" "$REGISTRY_PASSWORD") -I "https://$REGISTRY/v2/parcel/blobs/$config"`

  HTTP `200`; `Docker-Content-Digest` совпадает с digest из `release-image`. Config blob также возвращает HTTP `200`.
phrases.0: Я отделил доступность сервиса от потери artifact.
phrases.1: Я восстановил исходный immutable-релиз из проверенного архива.
phrases.2: Я проверил manifest и config через TLS с аутентификацией.
stages.0.objectives.0.text: Файл `~/quest/recovery-image.tar` на workstation сохраняет предоставленную
  контрольную сумму.
stages.0.objectives.1.text: Предоставленный приватный реестр отдаёт исходный релиз по тегу из архива восстановления
  и по неизменяемому digest; config blob доступен через TLS с проверкой сертификата.
