title: Восстановление реестра
brief: 'Процесс приватного registry и TLS исправны, но manifest релиза удалён. В песочнице остался Docker-архив
  recovery-image.tar. Проверьте его по сохранённому SHA-256, загрузите в приватный Docker daemon и отправьте
  parcel:1 в тот же registry. Восстановите точный исходный digest manifest и config blob; новый tag с
  другими байтами не является восстановлением. Сохранённый CA остаётся доверенным. Упражнение восстанавливает
  содержимое образа, а не хост registry или произвольное хранилище.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `platform.env`, `recovery-image.tar`,
  `archive.sha256`, `release-image`, `registry-ca.crt`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Проверенный архив сохранён, parcel:1 вновь указывает на исходный immutable manifest,
  config доступен через проверенный TLS.'
debrief: Immutable-релиз восстановлен из сохранённого образа и проверен через API registry.
