title: Восстановление и активация релиза
brief: |-
  Частный реестр доступен, но доставка релиза и пакетный потребитель не могут получить образ. Восстановите архивный релиз по обоим существующим путям доставки.

  Работайте в `~/quest` на рабочей станции. Даны `platform.env`, `recovery-image.tar`, `archive.sha256`, `release-image`, `registry-ca.crt`, `protected-image`, `repository/manifests/web.yaml`, `batch.yaml`, `application.yaml`. Неизменяемые данные находятся в `/run/dq/facts/0/`.

  **Требования:**

  - Файл рабочей станции `~/quest/recovery-image.tar` сохраняет исходную контрольную сумму.
  - Реестр отдаёт исходные байты релиза по проверенному TLS; оба сохранённых потребителя исполняют этот неизменяемый релиз, а посторонний защищённый артефакт остаётся целым.
    - Сохраните исходный manifest по тегу из архива и digest, все байты config/слоёв и их объявленные размеры.
    - Защищённый артефакт должен сохраняться по записанным тегу и digest со всеми blob.
    - Сохраните идентификаторы исходных Application, Deployment, Service и CronJob, существующие источник Git, project, destination, автоматические prune и self-heal.
    - Опубликованное описание веб-приложения остаётся по заданному пути репозитория, а наблюдаемая ревизия приложения совпадает с опубликованной удалённой ревизией.
    - Объявленные образы обоих потребителей должны указывать на неизменяемый digest из архива, фактические image ID контейнеров — совпадать с ним.
    - Веб-сервис возвращает заданный ответ.
    - Оставьте регулярное расписание пакета приостановленным; сохраните ровно один новый завершённый Job из исправленного шаблона (или эквивалентный допустимый Job), его реальный завершённый Pod, код выхода ноль и заданный вывод.
    - Записанная предыдущая попытка не засчитывается.
    - Patch статуса Pod и Job должен оставаться недоступен игроку.

  Проверки наблюдают текущее состояние содержимого и доставки и сохранённое подтверждение выполнения; они не доказывают непрерывную доступность или восстановление хоста реестра и хранилища.
debrief: Архив вернул исходный артефакт, но доставка потребовала явной публикации и активации у двух независимых
  владельцев. Проверка байтов реестра, реальных image ID, завершения пакета и сохранённых идентификаторов
  подтверждает восстановление.
stages.0.brief: Сохраните архив и восстановите один и тот же релиз в реестре и у обоих потребителей.
hints.0.text: Доступность артефакта и активация потребителя — отдельные границы. Восстановленный тег сам
  по себе не доказывает, что независимо управляемые потребители исполняют нужные байты.
hints.1.text: |-
  Сопоставьте `tar tf recovery-image.tar`, `cat release-image` и `docker image ls` с ответами реестра. Изучите `kubectl get applications,deployments,cronjobs,jobs,pods -o yaml`, события загрузки образов Pod и описания в Git и batch-файле. Определите владельца каждого объявленного образа; неизменяемый baseline отличает прошлую попытку от нового выполнения.

  Отдельно сравните ссылки архива, реестра и Git. В пакетных ресурсах найдите приостановленное расписание, его шаблон образа для будущих запусков и записанный исходный Job.
hints.2.text: |-
  Проверьте `git -C repository log -1`, `kubectl get applications,jobs,pods -o wide` и `kubectl logs <completed-pod> -c worker`. Ожидаются опубликованная ревизия, исходный digest в обоих шаблонах и реальных контейнерах, заданные HTTP-ответ и пакетный вывод, действительно завершённый новый Job. Сохраните этот Job и его Pod до проверки.

  Архив и реестр. Сверьте байты восстановленного релиза и защищённого артефакта.

  ```bash
  (
    set -euo pipefail
    cd ~/quest
    set -a
    source platform.env
    set +a
    printf '%s  recovery-image.tar\n' "$(cat /run/dq/facts/0/archive.sha256)" | sha256sum -c -
    python3 -I - <<'VERIFY_REGISTRY'
  import base64
  import hashlib
  import http.client
  import json
  import os
  import ssl
  from pathlib import Path

  facts = Path("/run/dq/facts/0")
  registry = os.environ["REGISTRY"]
  credentials = (os.environ["REGISTRY_USER"] + ":" + os.environ["REGISTRY_PASSWORD"]).encode()
  authorization = "Basic " + base64.b64encode(credentials).decode()
  context = ssl.create_default_context(cafile=str(facts / "registry-ca.crt"))
  headers = {"Authorization": authorization, "Accept": (
      "application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json")}

  def manifest(repository, reference):
      with_response = http.client.HTTPSConnection(registry, timeout=4, context=context)
      try:
          with_response.request("GET", f"/v2/{repository}/manifests/{reference}", headers=headers)
          response = with_response.getresponse()
          assert response.status == 200
          return response.read()
      finally:
          with_response.close()

  def verify_blobs(repository, manifest_bytes):
      document = json.loads(manifest_bytes)
      for blob in [document["config"], *document["layers"]]:
          wanted = blob["digest"]
          digest = hashlib.sha256()
          size = 0
          connection = http.client.HTTPSConnection(registry, timeout=4, context=context)
          try:
              connection.request("GET", f"/v2/{repository}/blobs/{wanted}", headers={"Authorization": authorization})
              response = connection.getresponse()
              assert response.status == 200
              while chunk := response.read(65536):
                  digest.update(chunk)
                  size += len(chunk)
          finally:
              connection.close()
          assert "sha256:" + digest.hexdigest() == wanted and size == blob["size"]

  release_digest = (facts / "release-image").read_text().strip().rsplit("@", 1)[1]
  release = manifest("parcel", release_digest)
  assert "sha256:" + hashlib.sha256(release).hexdigest() == release_digest
  assert manifest("parcel", "1") == release
  verify_blobs("parcel", release)
  baseline = json.loads((facts / "recovery-baseline.json").read_text())
  protected_digest = baseline["protected_image"].rsplit("@", 1)[1]
  protected = manifest("protected", baseline["protected_tag"])
  assert "sha256:" + hashlib.sha256(protected).hexdigest() == protected_digest
  verify_blobs("protected", protected)
  print("Restored and protected registry bytes match")
  VERIFY_REGISTRY
  )
  ```

  Git и живые потребители. Проверьте текущий веб-роллаут и отдельно завершившийся Job.

  ```bash
  (
    set -euo pipefail
    cd ~/quest
    source platform.env
    baseline=/run/dq/facts/0/recovery-baseline.json
    image=$(cat /run/dq/facts/0/release-image)
    digest=${image##*@}
    repository=${image%@*}
    git -C repository fetch -q origin main
    head=$(git -C repository rev-parse origin/main)
    kubectl get deployment,service,cronjob,application -o json |
      jq -e --slurpfile baseline "$baseline" '
        .items as $current | all($baseline[0].identities | to_entries[]; . as $original |
          any($current[]; (.kind+"/"+.metadata.name)==$original.key and .metadata.uid==$original.value))'
    declared_web_image=$(git -C repository show "$head:manifests/web.yaml" |
      python3 -I -c 'import sys,yaml
  docs = yaml.safe_load_all(sys.stdin)
  web = next(doc for doc in docs if isinstance(doc, dict) and doc.get("kind") == "Deployment"
             and doc["metadata"]["name"] == "archive-web")
  print(next(container["image"] for container in web["spec"]["template"]["spec"]["containers"]
             if container["name"] == "worker"))')
    kubectl get application release -o json |
      jq -e --arg head "$head" --slurpfile baseline "$baseline" '
        .spec.source == $baseline[0].source and
        .spec.project == "station" and .spec.destination == {server:"https://kubernetes.default.svc",namespace:.metadata.namespace} and
        .spec.syncPolicy.automated.enabled != false and .spec.syncPolicy.automated.prune == true and
        .spec.syncPolicy.automated.selfHeal == true and
        .status.sync.status == "Synced" and .status.sync.revision == $head'
    pin_matches() {
      [[ "$1" == "$repository@$digest" || "$1" == "$repository:"*"@$digest" ]]
    }
    web=$(kubectl get deployment archive-web -o json)
    web_uid=$(jq -er .metadata.uid <<<"$web")
    web_image=$(jq -er '.spec.template.spec.containers[] | select(.name=="worker") | .image' <<<"$web")
    pin_matches "$web_image"
    test "$declared_web_image" = "$web_image"
    replicas=$(jq -er 'select(.spec.replicas>0 and .status.readyReplicas==.spec.replicas and
      .status.observedGeneration==.metadata.generation) | .spec.replicas' <<<"$web")
    web_sets=$(kubectl get rs -o json | jq -c --arg uid "$web_uid" '
      [.items[] | select(any(.metadata.ownerReferences[]?; .kind=="Deployment" and .controller==true and .uid==$uid)) | .metadata.uid]')
    kubectl get pods -o json | jq -e --argjson owners "$web_sets" --argjson replicas "$replicas" --arg image "$web_image" --arg digest "$digest" '
      [.items[] | select(.metadata.deletionTimestamp==null and .status.phase!="Failed" and .status.phase!="Succeeded" and
        any(.metadata.ownerReferences[]?; .kind=="ReplicaSet" and .controller==true and (.uid as $uid | $owners | index($uid)!=null)))]
      | length==$replicas and all(.[]; .status.phase=="Running" and
        any(.spec.containers[]; .name=="worker" and .image==$image) and
        any(.status.containerStatuses[]?; .name=="worker" and .ready==true and (.state.running|type)=="object" and
          ((.imageID | split("@") | last | split("/") | last) == $digest)))'
    test "$(kubectl exec deployment/archive-web -c worker -- wget -qO- -T 3 http://archive-web:8080)" = "$(jq -er .http_response "$baseline")"
    template=$(kubectl get cronjob archive-scan -o json |
      jq -cer 'select(.spec.suspend == true) | .spec.jobTemplate.spec.template.spec')
    declared=$(jq -er '.containers[] | select(.name=="worker") | .image' <<<"$template")
    pin_matches "$declared"
    job_uid=$(kubectl get jobs -o json | jq -er --argjson template "$template" --slurpfile baseline "$baseline" '
      [$baseline[0].previous_jobs as $old | .items[] | .metadata.uid as $uid |
        select(($old | index($uid)) == null and
               any(.status.conditions[]?; .type=="Complete" and .status=="True"))]
      | select(length == 1) | .[0] | select(.spec.template.spec == $template) | .metadata.uid')
    pod=$(kubectl get pods -o json | jq -er --arg owner "$job_uid" --arg image "$declared" --arg digest "$digest" '
      [.items[] | select(.status.phase=="Succeeded" and
        any(.metadata.ownerReferences[]?; .kind=="Job" and .controller==true and .uid==$owner))]
      | select(length>0 and all(.[];
        any(.spec.containers[]; .name=="worker" and .image==$image) and
        any(.status.containerStatuses[]?; .name=="worker" and .state.terminated.exitCode==0 and
          ((.imageID | split("@") | last | split("/") | last) == $digest))))
      | .[0].metadata.name')
    test -n "$pod"
    test "$(kubectl logs "$pod" -c worker)" = "$(jq -er .batch_response "$baseline")"
    test "$(kubectl auth can-i patch pods --subresource=status)" = no
    test "$(kubectl auth can-i patch jobs --subresource=status)" = no
    printf '%s\n' 'Current Git, suspended template and completed Job observed.'
  )
  ```
phrases.0: Я отделил доступность сервиса от потери artifact.
phrases.1: Я восстановил исходный immutable-релиз из проверенного архива.
phrases.2: Я проверил manifest и config через TLS с аутентификацией.
stages.0.objectives.0.text: Файл рабочей станции `~/quest/recovery-image.tar` сохраняет исходную контрольную
  сумму.
stages.0.objectives.1.text: Реестр отдаёт исходные байты релиза по проверенному TLS; оба сохранённых потребителя
  исполняют этот неизменяемый релиз, а посторонний защищённый артефакт остаётся целым.
diagnostics.recovery_archive: Выданный recovery-image.tar мог исчезнуть или измениться после восстановления либо зафиксированная сумма не читается. Сохраните архив и сравните SHA-256 исходных байтов с frozen receipt. Внешне похожий новый image или правка рабочего checksum не подтверждают исходные байты архива. [Причина и проверка](guides#guide=gitops-delivery&section=archived-release-untouched-archive-bytes)
diagnostics.recovery_registry: Setup удаляет все пригодные локальные aliases релиза и manifest из registry; архив восстанавливает именно этот релиз, не новую сборку. Проверьте доверенный TLS, выданную аутентификацию, immutable manifest digest, одинаковые байты тега 1 и digest/размер каждого config/layer. Независимый protected-артефакт и его blobs тоже сохраняются. Любой сбой команды или сравнения этой registry-фазы даёт тот же маркер. [Причина и проверка](guides#guide=gitops-delivery&section=archived-release-exact-registry-bytes-and-protected-artifact)
diagnostics.recovery_identity: 'Пересоздание контроллеров доставки, Service или batch-определения сохраняет имена, но меняет UID. Исправьте исходные объекты и оставьте CronJob приостановленным: ручной запуск восстановления не требует включать расписание. Отсутствующие или неверные baseline/object-документы до source-фазы тоже дают этот маркер идентичности. [Причина и проверка](guides#guide=gitops-delivery&section=archived-release-original-suspended-consumers)'
diagnostics.recovery_source: Восстановление registry само не обновляет Git и живого потребителя. Опубликуйте digest архивного image в существующем web Deployment, сохраните исходные source Application, project station и destination и дождитесь синхронизации текущего Git head с автоматическими self-healing/pruning. Image живого worker точно совпадает с объявленной digest-pinned ссылкой; одного изменяемого тега недостаточно. [Причина и проверка](guides#guide=gitops-delivery&section=archived-release-published-immutable-source)
diagnostics.recovery_web: Web Deployment может указывать восстановленный image, пока rollout использует старые или неготовые Pod. Сохраните положительное целое число replicas, актуальное observed generation и ровно готовые текущие принадлежащие Pod с нужным image; реальный HTTP archive-web возвращает исходный archive-97. Ошибки API, exec или HTTP внутри web-фазы дают тот же маркер. [Причина и проверка](guides#guide=gitops-delivery&section=archived-release-real-web-adoption)
diagnostics.recovery_batch: Исправление шаблона приостановленного CronJob не чинит старый прерванный Job и не создаёт успешный запуск. Оставьте расписание выключенным и создайте один новый успешный Job из исправленного шаблона с архивным image. Его полный Pod spec совпадает с шаблоном, настоящий принадлежащий worker Pod завершён с кодом 0, runtime image digest архивный, логи checked-97; принимается ровно один новый завершённый Job, старые неудачные попытки могут остаться. [Причина и проверка](guides#guide=gitops-delivery&section=archived-release-real-completed-manual-execution)
diagnostics.recovery_authority: Право игрока менять status Pod или Job позволяет подделывать выполнение. Сохраните запрет обеих status patch-проверок и наблюдайте реальное завершение контейнера, image identity и логи. Ошибка наблюдения авторизации или ответ не no тоже нарушает сравнение. [Причина и проверка](guides#guide=gitops-delivery&section=archived-release-observe-without-status-forgery)
diagnostics.probe_0_1: После registry-фазы могут упасть текущий Git fetch, чтение опубликованного web manifest, общего снимка Kubernetes или запуск Python/helper до именованного сравнения. Проверьте эти чтения и выданный workspace. Ошибки registry уже дают recovery_registry, пойманные identity/source/web/batch сохраняют свой маркер; fallback появляется только без них. [Причина и проверка](guides#guide=gitops-delivery&section=archived-release-unlabelled-consumer-input)
