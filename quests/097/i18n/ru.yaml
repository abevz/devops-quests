hints.0.text: Доступность процесса не означает доступность содержимого образа.
hints.1.text: Отдельно проверяйте сохранённый digest и checksum архива.
hints.2.text: Загрузите проверенный архив, отправьте исходную ссылку и проверьте реальные байты manifest.
phrases.0: Я отделил доступность сервиса от потери artifact.
phrases.1: Я восстановил исходный immutable-релиз из проверенного архива.
phrases.2: Я проверил manifest и config через TLS с аутентификацией.
