title: Recuperación y activación del release
brief: |-
  El registro privado responde, pero la entrega del release y el consumidor batch no pueden recuperarlo. Restaura el release archivado por ambas rutas de entrega existentes.

  Trabaja en `~/quest` en la estación. Entradas: `platform.env`, `recovery-image.tar`, `archive.sha256`, `release-image`, `registry-ca.crt`, `protected-image`, `repository/manifests/web.yaml`, `batch.yaml`, `application.yaml`. Los datos congelados están en `/run/dq/facts/0/`.

  **Requisitos:**

  - El archivo de la estación `~/quest/recovery-image.tar` conserva su suma de comprobación original.
  - El registro sirve los bytes originales del release por TLS verificado; ambos consumidores conservados ejecutan ese release inmutable y el artefacto protegido independiente sigue intacto.
    - Conserva el manifiesto original en el tag del archivo y su digest, con todos los bytes de config/capas y sus tamaños declarados.
    - El artefacto protegido conserva tag, digest y blobs registrados.
    - Conserva las identidades de Application, Deployment, Service y CronJob, la fuente Git, project y destination existentes, pruning y autocorrección automáticos.
    - La definición web publicada permanece en la ruta suministrada del repositorio y la revisión observada de la aplicación coincide con la revisión remota publicada.
    - Las imágenes declaradas de ambos consumidores deben indicar el digest inmutable archivado y los image ID reales deben coincidir.
    - El servicio web devuelve la respuesta suministrada.
    - Mantén suspendido el horario batch regular; conserva exactamente un Job nuevo completado desde la plantilla reparada (o un Job válido equivalente), con su Pod real completado, salida cero y el resultado batch suministrado.
    - El intento anterior registrado no cuenta.
    - El jugador sigue sin poder aplicar patch al estado de Pods o Jobs.

  Las comprobaciones observan el estado actual del contenido y entrega y la evidencia de ejecución conservada; no demuestran disponibilidad ininterrumpida ni recuperación del host o almacenamiento del registro.
debrief: El archivo recuperó el artefacto original, pero la entrega exigió publicación y activación deliberadas
  en dos autoridades independientes. Los bytes del registro, image ID reales, terminación batch e identidades
  conservadas demuestran la recuperación.
stages.0.brief: Conserva el archivo y recupera el mismo release en el registro y ambos consumidores.
hints.0.text: La disponibilidad del artefacto y la activación del consumidor son fronteras distintas.
  Restaurar un tag no demuestra por sí solo que consumidores con responsables independientes ejecuten
  los bytes previstos.
hints.1.text: |-
  Compara `tar tf recovery-image.tar`, `cat release-image` y `docker image ls` con las respuestas del registro. Inspecciona `kubectl get applications,deployments,cronjobs,jobs,pods -o yaml`, eventos de descarga de los Pods y las definiciones Git/batch. Identifica quién administra cada imagen declarada; la referencia congelada distingue el intento anterior de una ejecución nueva.

  Compara por separado las referencias del archivo, registro y Git. En los recursos de lote, localiza la programación suspendida, la plantilla de imagen futura y el Job inicial registrado.
hints.2.text: |-
  Revisa `git -C repository log -1`, `kubectl get applications,jobs,pods -o wide` y `kubectl logs <completed-pod> -c worker`. Se esperan la revisión publicada, el digest original en ambas plantillas y contenedores reales, las respuestas HTTP/batch suministradas y un Job nuevo realmente completado. Conserva ese Job y su Pod hasta verificar.

  Archivo y registro. Verifica los bytes inmutables de la versión restaurada y del artefacto protegido.

  ```bash
  (
    set -euo pipefail
    cd ~/quest
    set -a
    source platform.env
    set +a
    printf '%s  recovery-image.tar\n' "$(cat /run/dq/facts/0/archive.sha256)" | sha256sum -c -
    python3 -I - <<'VERIFY_REGISTRY'
  import base64
  import hashlib
  import http.client
  import json
  import os
  import ssl
  from pathlib import Path

  facts = Path("/run/dq/facts/0")
  registry = os.environ["REGISTRY"]
  credentials = (os.environ["REGISTRY_USER"] + ":" + os.environ["REGISTRY_PASSWORD"]).encode()
  authorization = "Basic " + base64.b64encode(credentials).decode()
  context = ssl.create_default_context(cafile=str(facts / "registry-ca.crt"))
  headers = {"Authorization": authorization, "Accept": (
      "application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json")}

  def manifest(repository, reference):
      with_response = http.client.HTTPSConnection(registry, timeout=4, context=context)
      try:
          with_response.request("GET", f"/v2/{repository}/manifests/{reference}", headers=headers)
          response = with_response.getresponse()
          assert response.status == 200
          return response.read()
      finally:
          with_response.close()

  def verify_blobs(repository, manifest_bytes):
      document = json.loads(manifest_bytes)
      for blob in [document["config"], *document["layers"]]:
          wanted = blob["digest"]
          digest = hashlib.sha256()
          size = 0
          connection = http.client.HTTPSConnection(registry, timeout=4, context=context)
          try:
              connection.request("GET", f"/v2/{repository}/blobs/{wanted}", headers={"Authorization": authorization})
              response = connection.getresponse()
              assert response.status == 200
              while chunk := response.read(65536):
                  digest.update(chunk)
                  size += len(chunk)
          finally:
              connection.close()
          assert "sha256:" + digest.hexdigest() == wanted and size == blob["size"]

  release_digest = (facts / "release-image").read_text().strip().rsplit("@", 1)[1]
  release = manifest("parcel", release_digest)
  assert "sha256:" + hashlib.sha256(release).hexdigest() == release_digest
  assert manifest("parcel", "1") == release
  verify_blobs("parcel", release)
  baseline = json.loads((facts / "recovery-baseline.json").read_text())
  protected_digest = baseline["protected_image"].rsplit("@", 1)[1]
  protected = manifest("protected", baseline["protected_tag"])
  assert "sha256:" + hashlib.sha256(protected).hexdigest() == protected_digest
  verify_blobs("protected", protected)
  print("Restored and protected registry bytes match")
  VERIFY_REGISTRY
  )
  ```

  Git y consumidores activos. Verifica el despliegue web actual y el Job completado aparte.

  ```bash
  (
    set -euo pipefail
    cd ~/quest
    source platform.env
    baseline=/run/dq/facts/0/recovery-baseline.json
    image=$(cat /run/dq/facts/0/release-image)
    digest=${image##*@}
    repository=${image%@*}
    git -C repository fetch -q origin main
    head=$(git -C repository rev-parse origin/main)
    kubectl get deployment,service,cronjob,application -o json |
      jq -e --slurpfile baseline "$baseline" '
        .items as $current | all($baseline[0].identities | to_entries[]; . as $original |
          any($current[]; (.kind+"/"+.metadata.name)==$original.key and .metadata.uid==$original.value))'
    declared_web_image=$(git -C repository show "$head:manifests/web.yaml" |
      python3 -I -c 'import sys,yaml
  docs = yaml.safe_load_all(sys.stdin)
  web = next(doc for doc in docs if isinstance(doc, dict) and doc.get("kind") == "Deployment"
             and doc["metadata"]["name"] == "archive-web")
  print(next(container["image"] for container in web["spec"]["template"]["spec"]["containers"]
             if container["name"] == "worker"))')
    kubectl get application release -o json |
      jq -e --arg head "$head" --slurpfile baseline "$baseline" '
        .spec.source == $baseline[0].source and
        .spec.project == "station" and .spec.destination == {server:"https://kubernetes.default.svc",namespace:.metadata.namespace} and
        .spec.syncPolicy.automated.enabled != false and .spec.syncPolicy.automated.prune == true and
        .spec.syncPolicy.automated.selfHeal == true and
        .status.sync.status == "Synced" and .status.sync.revision == $head'
    pin_matches() {
      [[ "$1" == "$repository@$digest" || "$1" == "$repository:"*"@$digest" ]]
    }
    web=$(kubectl get deployment archive-web -o json)
    web_uid=$(jq -er .metadata.uid <<<"$web")
    web_image=$(jq -er '.spec.template.spec.containers[] | select(.name=="worker") | .image' <<<"$web")
    pin_matches "$web_image"
    test "$declared_web_image" = "$web_image"
    replicas=$(jq -er 'select(.spec.replicas>0 and .status.readyReplicas==.spec.replicas and
      .status.observedGeneration==.metadata.generation) | .spec.replicas' <<<"$web")
    web_sets=$(kubectl get rs -o json | jq -c --arg uid "$web_uid" '
      [.items[] | select(any(.metadata.ownerReferences[]?; .kind=="Deployment" and .controller==true and .uid==$uid)) | .metadata.uid]')
    kubectl get pods -o json | jq -e --argjson owners "$web_sets" --argjson replicas "$replicas" --arg image "$web_image" --arg digest "$digest" '
      [.items[] | select(.metadata.deletionTimestamp==null and .status.phase!="Failed" and .status.phase!="Succeeded" and
        any(.metadata.ownerReferences[]?; .kind=="ReplicaSet" and .controller==true and (.uid as $uid | $owners | index($uid)!=null)))]
      | length==$replicas and all(.[]; .status.phase=="Running" and
        any(.spec.containers[]; .name=="worker" and .image==$image) and
        any(.status.containerStatuses[]?; .name=="worker" and .ready==true and (.state.running|type)=="object" and
          ((.imageID | split("@") | last | split("/") | last) == $digest)))'
    test "$(kubectl exec deployment/archive-web -c worker -- wget -qO- -T 3 http://archive-web:8080)" = "$(jq -er .http_response "$baseline")"
    template=$(kubectl get cronjob archive-scan -o json |
      jq -cer 'select(.spec.suspend == true) | .spec.jobTemplate.spec.template.spec')
    declared=$(jq -er '.containers[] | select(.name=="worker") | .image' <<<"$template")
    pin_matches "$declared"
    job_uid=$(kubectl get jobs -o json | jq -er --argjson template "$template" --slurpfile baseline "$baseline" '
      [$baseline[0].previous_jobs as $old | .items[] | .metadata.uid as $uid |
        select(($old | index($uid)) == null and
               any(.status.conditions[]?; .type=="Complete" and .status=="True"))]
      | select(length == 1) | .[0] | select(.spec.template.spec == $template) | .metadata.uid')
    pod=$(kubectl get pods -o json | jq -er --arg owner "$job_uid" --arg image "$declared" --arg digest "$digest" '
      [.items[] | select(.status.phase=="Succeeded" and
        any(.metadata.ownerReferences[]?; .kind=="Job" and .controller==true and .uid==$owner))]
      | select(length>0 and all(.[];
        any(.spec.containers[]; .name=="worker" and .image==$image) and
        any(.status.containerStatuses[]?; .name=="worker" and .state.terminated.exitCode==0 and
          ((.imageID | split("@") | last | split("/") | last) == $digest))))
      | .[0].metadata.name')
    test -n "$pod"
    test "$(kubectl logs "$pod" -c worker)" = "$(jq -er .batch_response "$baseline")"
    test "$(kubectl auth can-i patch pods --subresource=status)" = no
    test "$(kubectl auth can-i patch jobs --subresource=status)" = no
    printf '%s\n' 'Current Git, suspended template and completed Job observed.'
  )
  ```
phrases.0: Separé la disponibilidad del servicio de la pérdida de artifact.
phrases.1: Recuperé la versión inmutable original de un archivo verificado.
phrases.2: Verifiqué manifest y config a través de TLS autenticado.
stages.0.objectives.0.text: El archivo de la estación `~/quest/recovery-image.tar` conserva su suma de
  comprobación original.
stages.0.objectives.1.text: El registro sirve los bytes originales del release por TLS verificado; ambos
  consumidores conservados ejecutan ese release inmutable y el artefacto protegido independiente sigue
  intacto.
diagnostics.recovery_archive: recovery-image.tar suministrado puede faltar o cambiar tras recuperar, o la suma congelada ser ilegible. Conserve archivo y compare SHA-256 de bytes con recibo congelado. Crear image parecido o cambiar checksum de trabajo no acredita bytes archivados originales. [Causa y comprobación](guides#guide=gitops-delivery&section=archived-release-untouched-archive-bytes)
diagnostics.recovery_registry: Setup elimina alias locales utilizables y manifest registry; el archivo debe recuperar esa publicación exacta, no build nuevo. Verifique TLS confiable, autenticación suministrada, immutable manifest digest, bytes idénticos del tag 1 y digest/tamaño de cada config/layer. Artefacto protected independiente y blobs deben sobrevivir. Todo fallo de comando o comparación en fase registry usa el mismo marcador. [Causa y comprobación](guides#guide=gitops-delivery&section=archived-release-exact-registry-bytes-and-protected-artifact)
diagnostics.recovery_identity: Recrear controladores, Service o definición batch conserva nombres pero cambia UID. Repare objetos originales y mantenga CronJob suspendido; ejecución manual de recuperación no exige habilitar calendario. Documentos baseline/objeto ausentes o inválidos antes de fase source también dan marcador identidad. [Causa y comprobación](guides#guide=gitops-delivery&section=archived-release-original-suspended-consumers)
diagnostics.recovery_source: Restaurar registry no actualiza Git ni consumidor automáticamente. Publique digest image archivado en definición web Deployment existente, conserve source Application, project station y destination y espere sincronización del Git head actual con self-healing/pruning automáticos. Image worker vivo debe igualar exactamente referencia digest-pinned declarada; tag mutable solo falla. [Causa y comprobación](guides#guide=gitops-delivery&section=archived-release-published-immutable-source)
diagnostics.recovery_web: Web Deployment puede nombrar image restaurado mientras rollout usa Pods viejos o no listos. Conserve replicas entero positivo, observed generation actual y exactamente Pods actuales propios listos con ese image; HTTP archive-web debe devolver archive-97 original. Errores API, exec o HTTP dentro de fase web usan mismo marcador. [Causa y comprobación](guides#guide=gitops-delivery&section=archived-release-real-web-adoption)
diagnostics.recovery_batch: Reparar plantilla del CronJob suspendido no arregla Job interrumpido ni crea ejecución completada. Mantenga calendario suspendido y cree un Job nuevo exitoso desde plantilla reparada con image archivado. Pod spec completo debe igualar plantilla, con worker Pod real propio exitoso, salida 0, runtime image digest archivado y logs checked-97; se acepta exactamente un Job nuevo completado, intentos viejos fallidos pueden quedar. [Causa y comprobación](guides#guide=gitops-delivery&section=archived-release-real-completed-manual-execution)
diagnostics.recovery_authority: Dar permiso al jugador para patch status de Pod o Job permitiría ejecución fabricada. Mantenga ambas comprobaciones status patch denegadas y observe terminación real, image identity y logs. Error de observación de autorización o salida distinta de no también falla. [Causa y comprobación](guides#guide=gitops-delivery&section=archived-release-observe-without-status-forgery)
diagnostics.probe_0_1: Tras fase registry pueden fallar Git fetch, manifest web publicado, snapshot Kubernetes combinado o arranque Python/helper antes de comparación nombrada. Inspeccione lecturas reales y workspace. Errores registry ya tienen recovery_registry, fallos identity/source/web/batch capturados conservan marcadores; fallback aparece solo sin ellos. [Causa y comprobación](guides#guide=gitops-delivery&section=archived-release-unlabelled-consumer-input)
