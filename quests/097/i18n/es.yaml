title: Restauración del registro
brief: 'El proceso privado registry y TLS están en buen estado, pero se eliminó la versión manifest. En
  esta bahía permanece un archivo Docker recovery-image.tar. Verifíquelo con el SHA-256 congelado, cárguelo
  en el Docker daemon privado y presione parcel:1 nuevamente al mismo registry. Recupera los originales
  exactos manifest digest y config blob; un nuevo tag que apunta a diferentes bytes no es recuperación.
  El CA congelado sigue teniendo autoridad. Este ejercicio restaura el contenido de la imagen, no el host
  registry ni el almacenamiento arbitrario.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `platform.env`, `recovery-image.tar`,
  `archive.sha256`, `release-image`, `registry-ca.crt`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: el archivo verificado se conserva y parcel:1 vuelve a resolverse en el
  immutable manifest original con su config disponible sobre el TLS verificado.'
debrief: La versión inmutable se recuperó del contenido de la imagen retenida y se verificó a través del
  registry API.
stages.0.brief: 'Criterios de éxito: el archivo verificado se conserva y parcel:1 vuelve a resolverse
  en el immutable manifest original con su config disponible sobre el TLS verificado.'
stages.0.objectives.0.text: El archivo verificado se conserva y parcel:1 vuelve a resolverse en el immutable
  manifest original con su config disponible sobre el TLS verificado.
hints.0.text: La disponibilidad del proceso no implica disponibilidad del contenido de la imagen.
hints.1.text: Utilice el digest congelado y archive el checksum como comprobaciones independientes.
hints.2.text: Cargue el archivo aprobado, envíe la referencia original y verifique los bytes manifest
  reales.
phrases.0: Separé la disponibilidad del servicio de la pérdida de artifact.
phrases.1: Recuperé la versión inmutable original de un archivo verificado.
phrases.2: Verifiqué manifest y config a través de TLS autenticado.
