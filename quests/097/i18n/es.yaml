title: Recuperación y activación del release
brief: |-
  El registro privado responde, pero la entrega del release y el consumidor batch no pueden recuperarlo. Restaura el release archivado por ambas rutas de entrega existentes.

  Trabaja en `~/quest` en la estación. Entradas: `platform.env`, `recovery-image.tar`, `archive.sha256`, `release-image`, `registry-ca.crt`, `protected-image`, `repository/manifests/web.yaml`, `batch.yaml`, `application.yaml`. Los datos congelados están en `/run/dq/facts/0/`.

  **Requisitos:**

  - El archivo de la estación `~/quest/recovery-image.tar` conserva su suma de comprobación original.
  - El registro sirve los bytes originales del release por TLS verificado; ambos consumidores conservados ejecutan ese release inmutable y el artefacto protegido independiente sigue intacto.
    - Conserva el manifiesto original en el tag del archivo y su digest, con todos los bytes de config/capas y sus tamaños declarados.
    - El artefacto protegido conserva tag, digest y blobs registrados.
    - Conserva las identidades de Application, Deployment, Service y CronJob, la fuente Git, project y destination existentes, pruning y autocorrección automáticos.
    - La definición web publicada permanece en la ruta suministrada del repositorio y la revisión observada de la aplicación coincide con la revisión remota publicada.
    - Las imágenes declaradas de ambos consumidores deben indicar el digest inmutable archivado y los image ID reales deben coincidir.
    - El servicio web devuelve la respuesta suministrada.
    - Mantén suspendido el horario batch regular; conserva exactamente un Job nuevo completado desde la plantilla reparada (o un Job válido equivalente), con su Pod real completado, salida cero y el resultado batch suministrado.
    - El intento anterior registrado no cuenta.
    - El jugador sigue sin poder aplicar patch al estado de Pods o Jobs.

  Las comprobaciones observan el estado actual del contenido y entrega y la evidencia de ejecución conservada; no demuestran disponibilidad ininterrumpida ni recuperación del host o almacenamiento del registro.
debrief: El archivo recuperó el artefacto original, pero la entrega exigió publicación y activación deliberadas
  en dos autoridades independientes. Los bytes del registro, image ID reales, terminación batch e identidades
  conservadas demuestran la recuperación.
stages.0.brief: Conserva el archivo y recupera el mismo release en el registro y ambos consumidores.
hints.0.text: La disponibilidad del artefacto y la activación del consumidor son fronteras distintas.
  Restaurar un tag no demuestra por sí solo que consumidores con responsables independientes ejecuten
  los bytes previstos.
hints.1.text: Compara `tar tf recovery-image.tar`, `cat release-image` y `docker image ls` con las respuestas
  del registro. Inspecciona `kubectl get applications,deployments,cronjobs,jobs,pods -o yaml`, eventos
  de descarga de los Pods y las definiciones Git/batch. Identifica quién administra cada imagen declarada;
  la referencia congelada distingue el intento anterior de una ejecución nueva.
hints.2.text: Verifica la suma del archivo antes de cargarlo en el daemon privado. Restaura la referencia
  original y compara bytes reales de manifiesto/config/capas, incluido el artefacto protegido. Publica
  la imagen inmutable recuperada en Git, repara la plantilla batch independiente e inicia una ejecución
  nueva manteniendo el horario suspendido. Revisa `git -C repository log -1`, `kubectl get applications,jobs,pods
  -o wide` y `kubectl logs <completed-pod> -c worker`. Se esperan la revisión publicada, el digest original
  en ambas plantillas y contenedores reales, las respuestas HTTP/batch suministradas y un Job nuevo realmente
  completado. Conserva ese Job y su Pod hasta verificar.
phrases.0: Separé la disponibilidad del servicio de la pérdida de artifact.
phrases.1: Recuperé la versión inmutable original de un archivo verificado.
phrases.2: Verifiqué manifest y config a través de TLS autenticado.
stages.0.objectives.0.text: El archivo de la estación `~/quest/recovery-image.tar` conserva su suma de
  comprobación original.
stages.0.objectives.1.text: El registro sirve los bytes originales del release por TLS verificado; ambos
  consumidores conservados ejecutan ese release inmutable y el artefacto protegido independiente sigue
  intacto.
diagnostics.recovery_identity: Conserva los controladores de entrega, servicio y definición batch suspendida
  originales.
diagnostics.recovery_source: Publica la imagen inmutable recuperada en la fuente Git existente y espera
  la sincronización de esa revisión con autocorrección automática.
diagnostics.recovery_web: El consumidor web conservado debe ejecutar la imagen inmutable archivada y devolver
  la respuesta HTTP original.
diagnostics.recovery_batch: Repara la plantilla batch suspendida y conserva una ejecución nueva completada
  con un Pod real usando la imagen inmutable archivada.
diagnostics.recovery_registry: Recupera los bytes exactos de manifiesto/config/capas del release y del
  artefacto protegido por TLS verificado.
diagnostics.recovery_authority: Los patches del jugador no deben falsificar el estado de ejecución de
  Pods o Jobs.
diagnostics.probe_0_1: 'Las entradas actuales no permitieron verificar este objetivo: El registro sirve
  los bytes originales del release por TLS verificado; ambos consumidores conservados ejecutan ese release
  inmutable y el artefacto protegido independiente sigue intacto.'
