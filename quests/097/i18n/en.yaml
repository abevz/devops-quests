title: Registry restore
brief: |-
  Consumers can reach the private registry but cannot retrieve the release image. Recover the original image content from the supplied archive.

  Work on the workstation in `~/quest` with `platform.env`, `recovery-image.tar`, `release-image`, `registry-ca.crt`.

  **Requirements:**

  - Workstation `~/quest/recovery-image.tar` retains its supplied checksum.
  - The supplied private registry serves the original release at the tag recorded in the recovery archive and at its immutable digest, with its config blob available over verified TLS.

  This exercise restores image content, not the registry host or arbitrary storage.
debrief: The immutable release was recovered from retained image content and verified through the registry
  API.
stages.0.brief: Keep the supplied recovery archive unchanged.
hints.0.text: Process availability does not imply image-content availability.
hints.1.text: |-
  Inspect the supplied image reference and the private Docker daemon’s image inventory.

  ```bash
  cat release-image
  docker image ls
  ```
hints.2.text: |-
  Load the approved archive, push the original reference and verify actual manifest bytes. Use the frozen digest and archive checksum as separate checks.

  Verify from `~/quest` on the workstation:

  - `sha256sum recovery-image.tar`
  - `cat /run/dq/facts/0/archive.sha256`

  The SHA-256 values match.

  - `source platform.env`
  - `curl -fsS --cacert registry-ca.crt --config <(printf 'user = "%s:%s"\n' "$REGISTRY_USER" "$REGISTRY_PASSWORD") -H 'Accept: application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json' -I "https://$REGISTRY/v2/parcel/manifests/1"`
  - `config=$(curl -fsS --cacert registry-ca.crt --config <(printf 'user = "%s:%s"\n' "$REGISTRY_USER" "$REGISTRY_PASSWORD") -H 'Accept: application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json' "https://$REGISTRY/v2/parcel/manifests/1" | jq -r .config.digest)`
  - `curl -fsS --cacert registry-ca.crt --config <(printf 'user = "%s:%s"\n' "$REGISTRY_USER" "$REGISTRY_PASSWORD") -I "https://$REGISTRY/v2/parcel/blobs/$config"`

  HTTP `200`; `Docker-Content-Digest` equals the digest in `release-image`. The config blob also returns HTTP `200`.
phrases.0: I separated service availability from artifact loss.
phrases.1: I recovered the original immutable release from a verified archive.
phrases.2: I verified manifest and config through authenticated TLS.
stages.0.objectives.0.text: Workstation `~/quest/recovery-image.tar` retains its supplied checksum.
stages.0.objectives.1.text: The supplied private registry serves the original release at the tag recorded
  in the recovery archive and at its immutable digest, with its config blob available over verified TLS.
