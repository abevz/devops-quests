title: Release recovery and activation
brief: |-
  The private registry is reachable, but release delivery and the batch consumer cannot retrieve the release. Recover the archived release across both existing delivery paths.

  Work in `~/quest` on the workstation. Inputs: `platform.env`, `recovery-image.tar`, `archive.sha256`, `release-image`, `registry-ca.crt`, `protected-image`, `repository/manifests/web.yaml`, `batch.yaml`, `application.yaml`. Frozen facts are under `/run/dq/facts/0/`.

  **Requirements:**

  - Workstation `~/quest/recovery-image.tar` retains its supplied checksum.
  - The registry serves the original release bytes over verified TLS; both retained consumers execute that immutable release, and the unrelated protected artifact remains intact.
    - Preserve the original manifest at its archive tag and digest, with every config/layer byte and declared size intact.
    - Keep the protected artifact at its recorded tag and digest with all its blobs.
    - Preserve the original Application, Deployment, Service and CronJob identities, the existing Git source/project/destination, automatic pruning and self-healing.
    - The published web definition remains at its supplied repository path, and the observed application revision matches the published remote revision.
    - Both declared consumer images must identify the archived immutable digest, and the actual running image IDs must match it.
    - The web service returns its supplied response.
    - Keep the regular batch schedule suspended; retain exactly one new completed Job from the repaired template (or an equivalent valid Job), with a real completed Pod, exit zero and the supplied batch output.
    - The recorded previous attempt does not count.
    - Keep Pod and Job status unavailable to player patches.

  Checks observe current content/delivery state and retained execution evidence; they do not establish uninterrupted availability or recovery of the registry host or storage.
debrief: The archive recovered the original artifact, but delivery required deliberate publication and
  activation at two independent authorities. Registry byte checks, actual container image IDs, genuine
  batch termination and retained identities establish the recovered outcome.
stages.0.brief: Preserve the archive and recover the same release across the registry and both consumers.
hints.0.text: Artifact availability and consumer activation are separate boundaries. A restored tag does
  not by itself prove that independently managed consumers execute the intended bytes.
hints.1.text: Compare `tar tf recovery-image.tar`, `cat release-image` and `docker image ls` with registry
  responses. Inspect `kubectl get applications,deployments,cronjobs,jobs,pods -o yaml`, Pod image-pull
  events and the supplied Git and batch definitions. Trace which authority owns each declared image; use
  the frozen baseline to distinguish the previous attempt from a new execution.
hints.2.text: Verify the archive checksum before loading it into the private daemon. Restore the original
  registry reference and compare actual manifest/config/layer bytes, including the protected artifact.
  Publish the recovered immutable image in Git, repair the independent batch template and start a new
  execution while leaving the schedule suspended. Check `git -C repository log -1`, `kubectl get applications,jobs,pods
  -o wide` and `kubectl logs <completed-pod> -c worker`. Expect the published revision, original image
  digest in both templates and real containers, the supplied HTTP/batch responses and a genuinely completed
  new Job. Retain that Job and its Pod until verification.
phrases.0: I separated service availability from artifact loss.
phrases.1: I recovered the original immutable release from a verified archive.
phrases.2: I verified manifest and config through authenticated TLS.
stages.0.objectives.0.text: Workstation `~/quest/recovery-image.tar` retains its supplied checksum.
stages.0.objectives.1.text: The registry serves the original release bytes over verified TLS; both retained
  consumers execute that immutable release, and the unrelated protected artifact remains intact.
diagnostics.recovery_archive: The supplied recovery-image.tar may be missing or altered after recovery, or the frozen checksum may be unreadable. Keep the issued archive intact and compare its raw SHA-256 with the frozen receipt. Recreating a visually similar image or rewriting a working checksum cannot establish the original archived bytes. [Cause and check](guides#guide=gitops-delivery&section=archived-release-untouched-archive-bytes)
diagnostics.recovery_registry: Setup removes every usable local release alias and deletes its registry manifest; the supplied archive must restore that exact release, not a new build. Verify trusted TLS, supplied authentication, the immutable manifest digest, identical tag 1 bytes and every referenced config/layer digest and size. The independent protected artifact and its blobs must also survive. Any command or comparison failure in this registry phase uses the same marker. [Cause and check](guides#guide=gitops-delivery&section=archived-release-exact-registry-bytes-and-protected-artifact)
diagnostics.recovery_identity: Recreating the delivery controllers, Service or batch definition can keep names while changing their frozen UIDs. Repair the original objects and leave the CronJob suspended; manual recovery execution is separate from enabling its schedule. Missing or malformed baseline/object documents encountered before the source phase also use this identity marker. [Cause and check](guides#guide=gitops-delivery&section=archived-release-original-suspended-consumers)
diagnostics.recovery_source: Restoring the registry does not update Git or the live consumer automatically. Publish the archived image digest in the existing web Deployment definition, keep the original Application source, station project and destination, and wait for automatic self-healing/pruning to synchronize the current Git head. The live worker image must exactly equal the declared digest-pinned reference; a mutable tag alone fails. [Cause and check](guides#guide=gitops-delivery&section=archived-release-published-immutable-source)
diagnostics.recovery_web: The web Deployment can name the restored image while rollout still uses unready or old Pods. Retain a positive integer replica count, current observed generation and exactly the ready current owned Pods running that image; the actual archive-web HTTP response must equal the original archive-97 value. API, exec or HTTP errors inside this web phase use the same marker. [Cause and check](guides#guide=gitops-delivery&section=archived-release-real-web-adoption)
diagnostics.recovery_batch: Fixing the suspended CronJob template does not repair the previous interrupted Job or create a completed execution. Keep the schedule suspended and create one new successful Job from its repaired archived-image template. Its complete Pod specification must equal that template, with a real owned successful worker Pod, exit code 0, the archived runtime image digest and checked-97 logs; exactly one new completed Job is accepted, while old failed attempts may remain. [Cause and check](guides#guide=gitops-delivery&section=archived-release-real-completed-manual-execution)
diagnostics.recovery_authority: Granting the player permission to patch Pod or Job status would allow fabricated execution evidence. Keep both status patch checks denied; observe real container termination, image identity and logs instead. A failed authorization observation or output other than no also fails this comparison. [Cause and check](guides#guide=gitops-delivery&section=archived-release-observe-without-status-forgery)
diagnostics.probe_0_1: After the registry phase, the current Git fetch, published web manifest, combined Kubernetes snapshot or Python/helper startup can fail before a named consumer comparison. Inspect those actual reads and the provided workspace. Registry errors already have recovery_registry, and caught identity/source/web/batch failures keep their own marker; the fallback appears only when none was emitted. [Cause and check](guides#guide=gitops-delivery&section=archived-release-unlabelled-consumer-input)
