hints.0.text: Process availability does not imply image-content availability.
hints.1.text: Use the frozen digest and archive checksum as separate checks.
hints.2.text: Load the approved archive, push the original reference and verify actual manifest bytes.
phrases.0: I separated service availability from artifact loss.
phrases.1: I recovered the original immutable release from a verified archive.
phrases.2: I verified manifest and config through authenticated TLS.
