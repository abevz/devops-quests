title: Registry restore
brief: 'The private registry process and TLS are healthy, but the release manifest was deleted. A Docker
  archive recovery-image.tar remains in this bay. Verify it against the frozen SHA-256, load it in the
  private Docker daemon and push parcel:1 back to the same registry. Recover the exact original manifest
  digest and config blob; a new tag pointing at different bytes is not recovery. The frozen CA remains
  authoritative. This exercise restores image content, not the registry host or arbitrary storage.


  Quest files in `~/quest` (some appear in later stages): `platform.env`, `recovery-image.tar`, `archive.sha256`,
  `release-image`, `registry-ca.crt`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: The verified archive is retained and parcel:1 again resolves to the original
  immutable manifest with its config available over verified TLS.'
debrief: The immutable release was recovered from retained image content and verified through the registry
  API.
stages.0.brief: 'The verified archive is retained and parcel:1 again resolves to the original immutable
  manifest with its config available over verified TLS.


  Success criteria: The verified archive is retained and parcel:1 again resolves to the original immutable
