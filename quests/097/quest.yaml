id: 97
title: title
track: Platform
difficulty: expert
brief: brief
stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    check: 'source platform.env

      test "$(sha256sum recovery-image.tar | cut -d'' '' -f1)" = "$(cat /run/dq/facts/0/archive.sha256)"

      image=$(cat /run/dq/facts/0/release-image);digest=${image##*@}

      curl -fsS --cacert /run/dq/facts/0/registry-ca.crt -u "$REGISTRY_USER:$REGISTRY_PASSWORD" -H ''Accept:
      application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json''
      "https://$REGISTRY/v2/parcel/manifests/$digest" > /tmp/restored-manifest.json

      test "sha256:$(sha256sum /tmp/restored-manifest.json | cut -d'' '' -f1)" = "$digest"

      curl -fsS --cacert /run/dq/facts/0/registry-ca.crt -u "$REGISTRY_USER:$REGISTRY_PASSWORD" -H ''Accept:
      application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json''
      "https://$REGISTRY/v2/parcel/manifests/1" > /tmp/restored-tag.json

      cmp /tmp/restored-manifest.json /tmp/restored-tag.json

      config=$(jq -er .config.digest /tmp/restored-manifest.json)

      curl -fsS --cacert /run/dq/facts/0/registry-ca.crt -u "$REGISTRY_USER:$REGISTRY_PASSWORD" "https://$REGISTRY/v2/parcel/blobs/$config"
      >/dev/null'
hints:
- text: hints.0.text
  guide: kubernetes-20
- text: hints.1.text
  guide: kubernetes-20
- text: hints.2.text
  guide: kubernetes-20
debrief: debrief
phrases:
- phrases.0
- phrases.1
- phrases.2
questions: []
facts:
  environment:
  - DQ_NAMESPACE
  - DQ_APP_IMAGE
  - KUBECONFIG
  - TF_CLI_CONFIG_FILE
  - DOCKER_HOST
  - DOCKER_TLS_VERIFY
  - DOCKER_CERT_PATH
  files:
  - platform.env
  - recovery-image.tar
  - archive.sha256
  - release-image
  - registry-ca.crt
  services: []
immutable:
  0:
  - archive.sha256
  - release-image
  - registry-ca.crt
