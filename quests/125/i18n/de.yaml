title: RBAC-Verträge mit den geringsten Privilegien
brief: |-
  Der Routenleser benötigt eng begrenzten Zugriff. Stellen Sie die beabsichtigte Controller-Antwort her, während andere und Observer-Anfragen verboten bleiben.

  Arbeiten Sie auf der Workstation in `~/quest` mit den bereitgestellten Dateien:
  - `controller-sa.yaml`, `observer-sa.yaml`, `controller.yaml`, `observer.yaml`, `role.yaml`, `binding.yaml`, `route.yaml`, `offlimits.yaml`, `secret.yaml`, `api-ca.pem`, `api-endpoint`.

  **Requirements:**

  - Die bereitgestellte Role im Namespace gewährt nur benannten Lesezugriff auf die vorhandene Routenkonfiguration; ihre Bindung gewährt diesen Zugriff nur der bereitgestellten Controller-Identität.
  - Ein CA-geprüftes API-GET mit dem eingebundenen Controller-Zugang liefert HTTP `200` und Route `north-125` aus der vorhandenen Routenkonfiguration.
  - Controller-Anfragen zum Auflisten von ConfigMaps oder Secrets, Lesen der separaten geschützten Konfiguration oder des Kontroll-Secrets sowie die Observer-Anfrage zum Lesen der Route erhalten alle HTTP `403`.

  Die Prüfungen betreffen die angegebenen Anfragen und Objekte, nicht alle möglichen Berechtigungen oder den Ausführer der Befehle; Token niemals ausgeben.
debrief: Die geringste Berechtigung wurde für beide Vorgänge und identities überprüft, einschließlich
  echter negativer API-Anfragen.
stages.0.brief: Halten Sie beide Zugangsdaten privat und bewahren Sie die Zugriffsverbote.
hints.0.text: Eine Bindung wählt identities; a Role definiert erlaubte Operationen. Die bereitgestellte
  Role erlaubt zusätzliche ConfigMap-Listen und Secret-Lesezugriffe; das Binding enthält den Observer.
  Beide Workloads besitzen bereits kurzlebige projizierte Token.
hints.1.text: |-
  get by resourceName ist schmaler als list, selbst für die gleiche Ressource kind.

  Prüfen Sie die bereitgestellten Eingaben und laufenden Beobachtungen:

  ```sh
  kubectl get role station-reader -o yaml
    kubectl get rolebinding station-reader -o yaml
  ```
hints.2.text: |-
  Beschränken Sie sowohl Role rules als auch subjects und testen Sie dann explizit verweigerte Pfade.

  Prüfen Sie das Ergebnis in `~/quest` auf der Workstation:

  - Die benannte Route liefert `north-125` mit HTTP `200`; die anderen vier Anfragen liefern HTTP `403`. Token niemals ausgeben oder speichern.

    ```sh
    api=$(cat api-endpoint)
    token=$(kubectl exec deployment/controller -- cat /credential/token)
    for path in configmaps/route configmaps configmaps/offlimits secrets secrets/control; do
      printf 'header = "Authorization: Bearer %s"\n' "$token" |
        curl --config - --cacert api-ca.pem -sS -w '\nHTTP %{http_code}\n' \
        "$api/api/v1/namespaces/$DQ_NAMESPACE/$path"
    done
    unset token
    ```

  - Die Observer-Anfrage liefert HTTP `403`, ohne Zugangsdaten offenzulegen.

    ```sh
    api=$(cat api-endpoint)
    token=$(kubectl exec deployment/observer -- cat /credential/token)
    printf 'header = "Authorization: Bearer %s"\n' "$token" |
      curl --config - --cacert api-ca.pem -sS -o /dev/null -w 'HTTP %{http_code}\n' \
      "$api/api/v1/namespaces/$DQ_NAMESPACE/configmaps/route"
    unset token
    ```
phrases.0: Ich habe den Lesezugriff auf ein benanntes Objekt eingeschränkt.
phrases.1: Ich habe das unbeabsichtigte RoleBinding subject entfernt.
phrases.2: Ich habe verweigerte Vorgänge anhand des tatsächlichen identities überprüft.
questions.0.points.0: get greift auf eine einzelne benannte Ressource zu; list ermittelt eine Sammlung
  von Ressourcen.
questions.0.points.1: Die Autorisierung prüft jeden verb separat.
questions.0.prompt: Warum bedeutet get für einen einzelnen resourceName nicht auch die Berechtigung list?
questions.1.points.0: NEIN; Der falsche principal erhält diese Berechtigungen weiterhin.
questions.1.points.1: Überprüfen Sie identity und den Betriebsumfang gemeinsam.
questions.1.prompt: Kann die Korrektur Role rules das falsche binding subject kompensieren?
diagnostics.role: role/station-reader rules muss get configmaps resourceNames [route] entsprechen.
diagnostics.binding: Das RoleBinding darf nur ServiceAccount controller im Namespace dieser Umgebung enthalten.
diagnostics.allowed: controller GET configmaps/route muss HTTP 200 entsprechen.
diagnostics.value: configmaps/route data.route muss north-125 entsprechen.
diagnostics.observer: observer GET configmaps/route muss HTTP 403 liefern.
diagnostics.denied_configmaps: controller GET configmaps muss HTTP 403 liefern.
diagnostics.denied_configmaps_offlimits: controller GET configmaps/offlimits muss HTTP 403 liefern.
diagnostics.denied_secrets: controller GET secrets muss HTTP 403 liefern.
diagnostics.denied_secrets_control: controller GET secrets/control muss HTTP 403 liefern.
