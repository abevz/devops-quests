diagnostics.authority_actors: Vorgegebene Workloads und Identitätsobjekte müssen über die aktuelle Namespace-API
  verfügbar sein.
diagnostics.authority_identity: Ein ursprünglicher Workload, eine Kontrollidentität oder ein vorgegebenes Image
  wurde geändert; erhalte die Komponenten.
diagnostics.authority_split: Abhängige Verbraucher brauchen unterschiedliche dedizierte ServiceAccounts, getrennt
  von reservierten Kontroll-, Standard- und Workstation-Identitäten.
diagnostics.authority_projection: Nutze das Credential des aktuellen eigenen Pods für seinen deklarierten ServiceAccount;
  automatisches Mounting bleibt für Verbraucher aus.
diagnostics.authority_grants: Wirksame Namespace-Bindungen dürfen nur get der benannten Konfiguration dieses Verbrauchers
  erlauben; zusätzliche Grants verletzen die Absicht.
diagnostics.authority_live: Beobachte aktuelle eigene bereite Pods und gebundene Credential-Identitäten, nicht beendende
  Pods oder fremde Token.
diagnostics.authority_allowed: Jedes aktuelle Verbraucher-Credential muss HTTP 200 und den deklarierten eigenen
  Datensatzwert erhalten.
diagnostics.authority_denied: Anfragen fremder Datensätze, Route, geschützter Daten und Listen außerhalb der Absicht
  müssen HTTP 403 liefern.
diagnostics.probe_0_0: Aktuelle Eingaben konnten diese Bedingung nicht bestätigen; prüfe Objektstatus und Vertrag.
diagnostics.probe_0_2: Aktuelle Eingaben konnten diese Bedingung nicht bestätigen; prüfe Objektstatus und Vertrag.
