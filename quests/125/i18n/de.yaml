title: RBAC-Verträge mit den geringsten Privilegien
brief: 'Ein controller soll nur die ConfigMap route lesen. Seine Role erlaubt zusätzlich das Auflisten von ConfigMaps und
  das Lesen von Secrets; das Binding enthält versehentlich auch die Identität observer. Beschränke station-reader auf get
  für configmaps mit resourceNames [route] und binde nur den ServiceAccount controller in diesem Namespace. Beide Pods besitzen
  bereits kurzlebige projizierte API-Tokens. Teste echte HTTPS-Anfragen mit der festgehaltenen CA und dem Endpoint; gib niemals
  Tokens aus. controller darf nur get für route ausführen. Andere ConfigMaps, list-Operationen und Secrets müssen 403 liefern,
  und observer muss den Zugriff auf route verlieren.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `controller-sa.json`, `observer-sa.json`, `controller.json`,
  `observer.json`, `role.json`, `binding.json`, `route.json`, `offlimits.json`, `secret.json`, `api-ca.pem`, `api-endpoint`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien, vorinstallierte Bilder
  und private Dienste. Ändern Sie nur diese Bucht.


  Anfängliche Erfolgskriterien: Nur controller kann get für das benannte Objekt route ausführen; echte Anfragen belegen die
  Ablehnung von list, anderen Objekten, Secrets und observer-Zugriffen.


  Role `station-reader` muss genau eine Core-API-Regel enthalten: `get` auf `configmaps` mit `resourceNames: [route]`. Ihr
  RoleBinding muss genau ein Subjekt enthalten: ServiceAccount `controller` im Namespace dieser Umgebung. Die CA-verifizierte
  Controller-Anfrage an `configmaps/route` muss 200 und `.data.route: north-125` liefern; Controller-Anfragen an `configmaps`,
  `configmaps/offlimits`, `secrets` und `secrets/control` müssen jeweils 403 liefern. Die Observer-Anfrage an `configmaps/route`
  muss ebenfalls 403 liefern. Die Prüfungen beobachten diese konkreten Anfragen und Objekte, nicht alle möglichen Berechtigungen
  oder den Urheber der Befehle.'
debrief: Die geringste Berechtigung wurde für beide Vorgänge und identities überprüft, einschließlich echter negativer API-Anfragen.
stages.0.brief: Genaue Role und Binding, Controller-Antwort für route und angegebene abgelehnte Anfragen entsprechen der Beschreibung.
stages.0.objectives.0.text: Genaue Role und Binding, Controller-Antwort für route und angegebene abgelehnte Anfragen entsprechen
  der Beschreibung.
hints.0.text: Eine Bindung wählt identities; a Role definiert erlaubte Operationen.
hints.1.text: get by resourceName ist schmaler als list, selbst für die gleiche Ressource kind.
hints.2.text: Beschränken Sie sowohl Role rules als auch subjects und testen Sie dann explizit verweigerte Pfade.
phrases.0: Ich habe den Lesezugriff auf ein benanntes Objekt eingeschränkt.
phrases.1: Ich habe das unbeabsichtigte RoleBinding subject entfernt.
phrases.2: Ich habe verweigerte Vorgänge anhand des tatsächlichen identities überprüft.
questions.0.points.0: get greift auf eine einzelne benannte Ressource zu; list ermittelt eine Sammlung von Ressourcen.
questions.0.points.1: Die Autorisierung prüft jeden verb separat.
questions.0.prompt: Warum bedeutet get für einen einzelnen resourceName nicht auch die Berechtigung list?
questions.1.points.0: NEIN; Der falsche principal erhält diese Berechtigungen weiterhin.
questions.1.points.1: Überprüfen Sie identity und den Betriebsumfang gemeinsam.
questions.1.prompt: Kann die Korrektur Role rules das falsche binding subject kompensieren?
diagnostics.role: role/station-reader rules muss get configmaps resourceNames [route] entsprechen.
diagnostics.binding: Das RoleBinding darf nur ServiceAccount controller im Namespace dieser Umgebung enthalten.
diagnostics.allowed: controller GET configmaps/route muss HTTP 200 entsprechen.
diagnostics.value: configmaps/route data.route muss north-125 entsprechen.
diagnostics.observer: observer GET configmaps/route muss HTTP 403 liefern.
diagnostics.denied_configmaps: controller GET configmaps muss HTTP 403 liefern.
diagnostics.denied_configmaps_offlimits: controller GET configmaps/offlimits muss HTTP 403 liefern.
diagnostics.denied_secrets: controller GET secrets muss HTTP 403 liefern.
diagnostics.denied_secrets_control: controller GET secrets/control muss HTTP 403 liefern.
