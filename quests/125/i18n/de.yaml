diagnostics.role: Die Role station-reader erlaubt möglicherweise mehr als get für die ConfigMap route. Prüfe jede Regel für die benannte Ressource der Core-API. [Ursache und Prüfung](guides#guide=workload-access&section=q125-station-reader-role)
diagnostics.binding: Im RoleBinding station-reader fehlt möglicherweise ein Subjekt oder es ist ein anderes eingetragen. Prüfe, ob jedes Subjekt controller im Übungs-Namespace bezeichnet. [Ursache und Prüfung](guides#guide=workload-access&section=q125-station-reader-subject)
diagnostics.allowed: Der aktuellen Anfrage von controller an configmaps/route fehlt möglicherweise die Freigabe für diesen Namen, oder die Zugangsdaten stammen aus einem unvollständigen Rollout. Prüfe Selektor, Bindung und Rollout vor dem erneuten Test auf HTTP 200. [Ursache und Prüfung](guides#guide=workload-access&section=q125-station-reader-live-allow)
diagnostics.value: Die Anfrage von controller liefert möglicherweise keinen Routenwert oder einen anderen Wert als north-125. Prüfe die aktuelle ConfigMap, nachdem die Anfrage erfolgreich war. [Ursache und Prüfung](guides#guide=workload-access&section=q125-station-reader-route-value)
diagnostics.denied_configmaps: Controller hat möglicherweise zu weit gefasste Rechte, oder die Anfrage erreichte die API nicht mit gültigen Zugangsdaten. Prüfe Bindungen auf zu breite Rechte für Ressourcen, Namen oder Verben und wiederhole die markierte Prüfung auf HTTP 403. [Ursache und Prüfung](guides#guide=workload-access&section=q125-station-reader-denials)
diagnostics.denied_configmaps_offlimits: Controller hat möglicherweise zu weit gefasste Rechte, oder die Anfrage erreichte die API nicht mit gültigen Zugangsdaten. Prüfe Bindungen auf zu breite Rechte für Ressourcen, Namen oder Verben und wiederhole die markierte Prüfung auf HTTP 403. [Ursache und Prüfung](guides#guide=workload-access&section=q125-station-reader-denials)
diagnostics.denied_secrets: Controller hat möglicherweise zu weit gefasste Rechte, oder die Anfrage erreichte die API nicht mit gültigen Zugangsdaten. Prüfe Bindungen auf zu breite Rechte für Ressourcen, Namen oder Verben und wiederhole die markierte Prüfung auf HTTP 403. [Ursache und Prüfung](guides#guide=workload-access&section=q125-station-reader-denials)
diagnostics.denied_secrets_control: Controller hat möglicherweise zu weit gefasste Rechte, oder die Anfrage erreichte die API nicht mit gültigen Zugangsdaten. Prüfe Bindungen auf zu breite Rechte für Ressourcen, Namen oder Verben und wiederhole die markierte Prüfung auf HTTP 403. [Ursache und Prüfung](guides#guide=workload-access&section=q125-station-reader-denials)
diagnostics.observer: Die Anfrage von observer an configmaps/route hat möglicherweise Zugriff oder scheitert vor der Autorisierung. Prüfe den Rollout und die Bindungen von observer und wiederhole die Prüfung auf HTTP 403. [Ursache und Prüfung](guides#guide=workload-access&section=q125-station-reader-observer-denial)
diagnostics.authority_actors: Die Prüfung kann aktuelle Deployments oder ServiceAccounts möglicherweise nicht lesen. Prüfe den Bestand an Workloads und Identitäten im Übungs-Namespace. [Ursache und Prüfung](guides#guide=workload-access&section=q125-consumer-authority-actors)
diagnostics.authority_identity: Die ursprüngliche UID, das worker-Image oder das Kontrollkonto hat sich möglicherweise geändert. Vergleiche aktuelle Workloads und geschützte ServiceAccounts mit dem bereitgestellten Identitätsnachweis. [Ursache und Prüfung](guides#guide=workload-access&section=q125-consumer-authority-retained-identity)
diagnostics.authority_split: Die Verbraucher teilen sich möglicherweise einen ServiceAccount oder nutzen eine reservierte Identität. Prüfe, ob publisher und sampler im aktuellen Rollout verschiedene, nicht reservierte Konten verwenden. [Ursache und Prüfung](guides#guide=workload-access&section=q125-consumer-authority-separate-accounts)
diagnostics.authority_projection: Das Standard-Token ist möglicherweise noch eingehängt, oder die explizit projizierten Zugangsdaten sind nicht verfügbar oder einem anderen Konto oder Pod zugeordnet. Prüfe Automount-Einstellungen und Projektion im aktuellen Rollout. [Ursache und Prüfung](guides#guide=workload-access&section=q125-consumer-authority-projected-credential)
diagnostics.authority_grants: Bindungen sind möglicherweise nicht lesbar, fehlen oder gehen über eine Role im Namespace mit get auf die einzige zugewiesene ConfigMap hinaus. Prüfe passende Konto- und Gruppensubjekte und die referenzierten Roles. [Ursache und Prüfung](guides#guide=workload-access&section=q125-consumer-authority-named-grants)
diagnostics.authority_live: Die Übung kann möglicherweise keinen aktuellen lauffähigen worker beobachten oder keine gültige API-Antwort erhalten. Prüfe das Deployment und dessen aktuelles ReplicaSet samt Pod vor der erneuten Anfrageprüfung. [Ursache und Prüfung](guides#guide=workload-access&section=q125-consumer-authority-live-observation)
diagnostics.authority_allowed: Die erlaubte Anfrage eines Verbrauchers ist möglicherweise fehlgeschlagen oder lieferte den falschen Datensatz. Prüfe die Rechte für die benannte ConfigMap und die aktuellen Verbraucherdaten anhand des bereitgestellten Vertrags. [Ursache und Prüfung](guides#guide=workload-access&section=q125-consumer-authority-allowed-record)
diagnostics.authority_denied: Eine unzulässige Anfrage hat möglicherweise einen anderen Status als 403 erhalten. Prüfe Rechte auf fremde Verbraucher-Datensätze, Listen und Kontrollressourcen sowie Fehler vor der Autorisierung. [Ursache und Prüfung](guides#guide=workload-access&section=q125-consumer-authority-denied-records)
diagnostics.probe_0_0: Die Richtlinienprüfung wurde möglicherweise vor Meldung einer konkreten Bedingung unterbrochen. Prüfe den bereitgestellten Identitätsnachweis und API-Daten zu Workloads, Konten und Rechten. [Ursache und Prüfung](guides#guide=workload-access&section=q125-consumer-authority-policy-observer)
diagnostics.probe_0_2: Die Anfrageprüfung wurde möglicherweise vor Meldung einer konkreten Bedingung unterbrochen. Prüfe den bereitgestellten API-Endpunkt, die CA-Datei und die Bereitschaft der aktuellen Pods. [Ursache und Prüfung](guides#guide=workload-access&section=q125-consumer-authority-request-observer)
