title: RBAC-Verträge mit den geringsten Privilegien
brief: |-
  Die Workload-Autorisierung entspricht den deklarierten Zugriffsabsichten nicht. Stelle enge Rechte und aktuelle Verbraucher-Lesezugriffe bei erhaltenem Kontrollzugriff her.

  Arbeite auf der Workstation in `~/quest` mit den vorgegebenen Verbindungs-/Ergebniseingaben: `authority-contract.json`, `api-ca.pem`, `api-endpoint`. Die Workload-Definitionen stehen in aktuellen Clusterobjekten.

  **Anforderungen:**

  - Die bereitgestellte Role im Namespace gewährt nur benannten Lesezugriff auf die vorhandene Routenkonfiguration; ihre Bindung gewährt diesen Zugriff nur der bereitgestellten Controller-Identität. Erhalte Identitäten und Images aller vorgegebenen Workloads und die ursprünglichen Kontroll-ServiceAccounts. Jeder abhängige Verbraucher nutzt eine eigene eindeutige dedizierte Identität, ohne automatisches Credential-Mounting. Im Übungs-Namespace verweist jedes passende RoleBinding auf eine Role, die nur get für die zugewiesene ConfigMap erlaubt.
  - Ein CA-geprüftes API-GET mit dem eingebundenen Controller-Zugang liefert HTTP `200` und Route `north-125` aus der vorhandenen Routenkonfiguration.
  - Controller-Anfragen zum Auflisten von ConfigMaps oder Secrets, Lesen der separaten geschützten Konfiguration oder des Kontroll-Secrets sowie die Observer-Anfrage zum Lesen der Route erhalten alle HTTP `403`. Das aktuelle Pod-gebundene Credential jedes abhängigen Verbrauchers liest seinen Datensatz mit HTTP 200 und deklariertem Wert. Route, geschützte Daten, fremde Datensätze und Listen liefern HTTP 403; ursprüngliche Kontroll- und Beobachteridentitäten dürfen abhängige Datensätze nicht lesen.

  Prüfungen beobachten aktuelle Namespace-Rollen, Identitäten und angegebene API-Anfragen, nicht jede mögliche Berechtigung oder den Befehlsverlauf. Token nie ausgeben.
debrief: Least Privilege ist ein wirksamer Graph aus Identitäten, Grants und aktuellen Credentials. Getrennte Principals
  durch Verbraucher zu propagieren repariert Abhängigkeiten ohne breiten gemeinsamen Grant.
stages.0.brief: Halten Sie beide Zugangsdaten privat und bewahren Sie die Zugriffsverbote.
hints.0.text: Rechte gehören zu Identitäten, nicht zu Workload-Labels. Die Einschränkung eines gemeinsamen Grants
  kann abhängige Lesezugriffe brechen; Vorlagenänderung ersetzt kein Credential eines bestehenden Pods.
hints.1.text: |-
  Vergleiche Absichtsvertrag mit aktuellen ServiceAccounts, RoleBindings und Pod-Identitäten. Dekodiere nur Identitätsmetadaten, gib niemals Bearer-Zugangsdaten aus.

  ```sh
  cat authority-contract.json
  kubectl get deployment,serviceaccount,role,rolebinding -o yaml
  kubectl get pods -o yaml
  kubectl exec deployment/publisher -c worker -- cat /credential/token |
    python3 -I -c 'import base64,json,sys; token=sys.stdin.read().strip(); c=json.loads(base64.urlsafe_b64decode(token.split(".")[1]+"===")); print(json.dumps({"sub":c.get("sub"),"podUID":c.get("kubernetes.io",{}).get("pod",{}).get("uid")}))'

  ```
hints.2.text: |-
  Prüfe jeden erlaubten benannten Zugriff und jede verweigerte Anfrage gemäß Absichtskarte mit dem tatsächlichen Workload-Credential. Verwerfe sämtliche verweigerten Antwortkörper.

  ```sh
  api=$(cat api-endpoint)
  for actor in controller observer publisher sampler; do
    token=$(kubectl exec "deployment/$actor" -c worker -- cat /credential/token)
    for path in configmaps/route configmaps/release-plan configmaps/sampling configmaps secrets secrets/control configmaps/offlimits; do
      printf '%s %s ' "$actor" "$path"
      printf 'header = "Authorization: Bearer %s"\n' "$token" |
        curl --config - --cacert api-ca.pem -sS -o /dev/null -w 'HTTP %{http_code}\n' "$api/api/v1/namespaces/$DQ_NAMESPACE/$path"
    done
    unset token
  done
  ```

  ```sh
  api=$(cat api-endpoint)
  jq -c '.consumers[], (.control + {key:"route"})' authority-contract.json |
  while IFS= read -r entry; do
    actor=$(jq -r .deployment <<<"$entry")
    name=$(jq -r .configMap <<<"$entry")
    key=$(jq -r .key <<<"$entry")
    expected=$(jq -r .response <<<"$entry")
    token=$(kubectl exec "deployment/$actor" -c worker -- cat /credential/token)
    if printf 'header = "Authorization: Bearer %s"\n' "$token" |
      curl --config - --cacert api-ca.pem -fsS "$api/api/v1/namespaces/$DQ_NAMESPACE/configmaps/$name" |
      jq -e --arg key "$key" --arg expected "$expected" '.data[$key] == $expected' >/dev/null;
    then
      printf '%s %s: match\n' "$actor" "$name"
    else
      printf '%s %s: mismatch\n' "$actor" "$name"
    fi
    unset token
  done
  ```

  Die laut Vertrag erlaubten benannten Lesezugriffe liefern HTTP 200. Jede abgelehnte Anfrage liefert HTTP 403.
phrases.0: Ich habe den Lesezugriff auf ein benanntes Objekt eingeschränkt.
phrases.1: Ich habe das unbeabsichtigte RoleBinding subject entfernt.
phrases.2: Ich habe verweigerte Vorgänge anhand des tatsächlichen identities überprüft.
questions.0.points.0: get greift auf eine einzelne benannte Ressource zu; list ermittelt eine Sammlung von Ressourcen.
questions.0.points.1: Die Autorisierung prüft jeden verb separat.
questions.0.prompt: Warum bedeutet get für einen einzelnen resourceName nicht auch die Berechtigung list?
questions.1.points.0: NEIN; Der falsche principal erhält diese Berechtigungen weiterhin.
questions.1.points.1: Überprüfen Sie identity und den Betriebsumfang gemeinsam.
questions.1.prompt: Kann die Korrektur Role rules das falsche binding subject kompensieren?
