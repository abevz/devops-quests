title: RBAC-Verträge mit den geringsten Privilegien
brief: 'Ein controller soll nur die ConfigMap route lesen. Seine Role erlaubt zusätzlich das Auflisten
  von ConfigMaps und das Lesen von Secrets; das Binding enthält versehentlich auch die Identität observer.
  Beschränke station-reader auf get für configmaps mit resourceNames [route] und binde nur den ServiceAccount
  controller in diesem Namespace. Beide Pods besitzen bereits kurzlebige projizierte API-Tokens. Teste
  echte HTTPS-Anfragen mit der festgehaltenen CA und dem Endpoint; gib niemals Tokens aus. controller
  darf nur get für route ausführen. Andere ConfigMaps, list-Operationen und Secrets müssen 403 liefern,
  und observer muss den Zugriff auf route verlieren.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `controller-sa.json`, `observer-sa.json`,
  `controller.json`, `observer.json`, `role.json`, `binding.json`, `route.json`, `offlimits.json`, `secret.json`,
  `api-ca.pem`, `api-endpoint`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Anfängliche Erfolgskriterien: Nur controller kann get für das benannte Objekt route ausführen; echte
  Anfragen belegen die Ablehnung von list, anderen Objekten, Secrets und observer-Zugriffen.'
debrief: Die geringste Berechtigung wurde für beide Vorgänge und identities überprüft, einschließlich
  echter negativer API-Anfragen.
stages.0.brief: 'Erfolgskriterien: Nur controller kann get für das benannte Objekt route ausführen; echte
