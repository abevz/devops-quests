title: Contratos RBAC con privilegios mínimos
brief: |-
  La autorización no coincide con las intenciones de acceso declaradas. Recupera privilegios limitados y lecturas actuales de consumidores conservando acceso de control.

  Trabaja en la workstation en `~/quest` con las entradas de conexión/resultado: `authority-contract.json`, `api-ca.pem`, `api-endpoint`. Las definiciones de cargas están en los objetos actuales del clúster.

  **Requisitos:**

  - El Role del namespace suministrado concede solo lectura por nombre de la configuración de ruta existente, y su binding concede ese acceso solo a la identidad controller suministrada. Conserva identidades e imágenes de todas las cargas y los ServiceAccounts de control originales. Cada consumidor dependiente usa su identidad dedicada y distinta, con montaje automático de credenciales deshabilitado. En el espacio de nombres del ejercicio, cada RoleBinding aplicable apunta a un Role limitado a get sobre el ConfigMap asignado.
  - Un GET de API verificado con CA y la credencial controller montada devuelve HTTP `200` y ruta `north-125` de la configuración existente.
  - Las solicitudes controller para listar ConfigMap o Secret, leer la configuración protegida separada o el Secret de control, y la solicitud observer para leer la ruta reciben HTTP `403`. La credencial vinculada al Pod actual de cada consumidor lee su registro con HTTP 200 y valor declarado. Ruta, datos protegidos, registros de otro consumidor y listas devuelven HTTP 403; las identidades originales de control y observación no leen los registros dependientes.

  Se observan roles del namespace, identidades y peticiones API especificadas, no todos los permisos posibles ni historial. Nunca imprimas tokens.
debrief: Least privilege es un grafo efectivo de identidades, permisos y credenciales actuales. Propagar principals
  separados recupera dependencias sin restaurar permisos compartidos amplios.
stages.0.brief: Mantén privadas ambas credenciales y conserva las denegaciones de acceso.
hints.0.text: Los permisos se asocian a identidades, no a etiquetas de cargas. Reducir un permiso compartido puede
  romper lecturas dependientes; cambiar la plantilla no sustituye credenciales de un Pod existente.
hints.1.text: |-
  Compara contrato de intenciones con ServiceAccounts, RoleBindings e identidades Pod actuales. Decodifica solo metadatos de identidad, nunca imprimas credenciales bearer.

  ```sh
  cat authority-contract.json
  kubectl get deployment,serviceaccount,role,rolebinding -o yaml
  kubectl get pods -o yaml
  kubectl exec deployment/publisher -c worker -- cat /credential/token |
    python3 -I -c 'import base64,json,sys; token=sys.stdin.read().strip(); c=json.loads(base64.urlsafe_b64decode(token.split(".")[1]+"===")); print(json.dumps({"sub":c.get("sub"),"podUID":c.get("kubernetes.io",{}).get("pod",{}).get("uid")}))'

  ```
hints.2.text: |-
  Verifica cada lectura permitida por nombre y cada petición prohibida según las intenciones con la credencial real de la carga. Descarta todos los cuerpos de respuestas prohibidas.

  ```sh
  api=$(cat api-endpoint)
  for actor in controller observer publisher sampler; do
    token=$(kubectl exec "deployment/$actor" -c worker -- cat /credential/token)
    for path in configmaps/route configmaps/release-plan configmaps/sampling configmaps secrets secrets/control configmaps/offlimits; do
      printf '%s %s ' "$actor" "$path"
      printf 'header = "Authorization: Bearer %s"\n' "$token" |
        curl --config - --cacert api-ca.pem -sS -o /dev/null -w 'HTTP %{http_code}\n' "$api/api/v1/namespaces/$DQ_NAMESPACE/$path"
    done
    unset token
  done
  ```

  ```sh
  api=$(cat api-endpoint)
  jq -c '.consumers[], (.control + {key:"route"})' authority-contract.json |
  while IFS= read -r entry; do
    actor=$(jq -r .deployment <<<"$entry")
    name=$(jq -r .configMap <<<"$entry")
    key=$(jq -r .key <<<"$entry")
    expected=$(jq -r .response <<<"$entry")
    token=$(kubectl exec "deployment/$actor" -c worker -- cat /credential/token)
    if printf 'header = "Authorization: Bearer %s"\n' "$token" |
      curl --config - --cacert api-ca.pem -fsS "$api/api/v1/namespaces/$DQ_NAMESPACE/configmaps/$name" |
      jq -e --arg key "$key" --arg expected "$expected" '.data[$key] == $expected' >/dev/null;
    then
      printf '%s %s: match\n' "$actor" "$name"
    else
      printf '%s %s: mismatch\n' "$actor" "$name"
    fi
    unset token
  done
  ```

  Las lecturas por nombre permitidas en el contrato devuelven HTTP 200. Cada petición denegada devuelve HTTP 403.
phrases.0: Obtuve acceso de lectura a un objeto con nombre.
phrases.1: Quité el RoleBinding subject no deseado.
phrases.2: Verifiqué operaciones denegadas utilizando el identities real.
questions.0.points.0: get accede a un recurso concreto por su nombre; list descubre una colección de recursos.
questions.0.points.1: La autorización verifica cada verb por separado.
questions.0.prompt: ¿Por qué get sobre un único resourceName no implica permiso para list?
questions.1.points.0: No; el principal incorrecto aún recibe esos permisos.
questions.1.points.1: Revise identity y el alcance de la operación juntos.
questions.1.prompt: ¿Puede el Role rules correcto compensar el binding subject incorrecto?
