diagnostics.role: El Role station-reader puede conceder más que get sobre ConfigMap route. Comprueba cada regla para el recurso nombrado del grupo principal de la API. [Causa y comprobación](guides#guide=workload-access&section=q125-station-reader-role)
diagnostics.binding: Es posible que falte un sujeto en el RoleBinding station-reader o que se haya indicado otro. Comprueba que cada sujeto identifique a controller en el espacio de nombres del ejercicio. [Causa y comprobación](guides#guide=workload-access&section=q125-station-reader-subject)
diagnostics.allowed: La solicitud real de controller a configmaps/route puede carecer del permiso para ese nombre o usar una credencial de un despliegue pendiente. Comprueba el selector, el vínculo y el rollout antes de repetir la comprobación de HTTP 200. [Causa y comprobación](guides#guide=workload-access&section=q125-station-reader-live-allow)
diagnostics.value: La solicitud de controller puede no devolver un valor de ruta o devolver uno distinto de north-125. Tras confirmar que la solicitud funciona, comprueba el ConfigMap actual. [Causa y comprobación](guides#guide=workload-access&section=q125-station-reader-route-value)
diagnostics.denied_configmaps: Controller puede tener un permiso demasiado amplio o la solicitud puede no haber llegado a la API con una credencial válida. Revisa los vínculos para detectar permisos excesivos de recursos, nombres o verbos y repite la comprobación marcada para HTTP 403. [Causa y comprobación](guides#guide=workload-access&section=q125-station-reader-denials)
diagnostics.denied_configmaps_offlimits: Controller puede tener un permiso demasiado amplio o la solicitud puede no haber llegado a la API con una credencial válida. Revisa los vínculos para detectar permisos excesivos de recursos, nombres o verbos y repite la comprobación marcada para HTTP 403. [Causa y comprobación](guides#guide=workload-access&section=q125-station-reader-denials)
diagnostics.denied_secrets: Controller puede tener un permiso demasiado amplio o la solicitud puede no haber llegado a la API con una credencial válida. Revisa los vínculos para detectar permisos excesivos de recursos, nombres o verbos y repite la comprobación marcada para HTTP 403. [Causa y comprobación](guides#guide=workload-access&section=q125-station-reader-denials)
diagnostics.denied_secrets_control: Controller puede tener un permiso demasiado amplio o la solicitud puede no haber llegado a la API con una credencial válida. Revisa los vínculos para detectar permisos excesivos de recursos, nombres o verbos y repite la comprobación marcada para HTTP 403. [Causa y comprobación](guides#guide=workload-access&section=q125-station-reader-denials)
diagnostics.observer: La solicitud de observer a configmaps/route puede tener acceso o fallar antes de la autorización. Comprueba el rollout y los vínculos de observer y repite la comprobación de HTTP 403. [Causa y comprobación](guides#guide=workload-access&section=q125-station-reader-observer-denial)
diagnostics.authority_actors: Es posible que la comprobación no pueda leer los Deployments o ServiceAccounts actuales. Verifica el inventario de cargas e identidades del espacio de nombres del ejercicio. [Causa y comprobación](guides#guide=workload-access&section=q125-consumer-authority-actors)
diagnostics.authority_identity: Es posible que hayan cambiado el UID original, la imagen de worker o la cuenta de control. Compara las cargas y los ServiceAccounts protegidos con el registro de identidades proporcionado. [Causa y comprobación](guides#guide=workload-access&section=q125-consumer-authority-retained-identity)
diagnostics.authority_split: Los consumidores pueden compartir un ServiceAccount o usar una identidad reservada. Comprueba que publisher y sampler tengan cuentas distintas y no reservadas en el despliegue actual. [Causa y comprobación](guides#guide=workload-access&section=q125-consumer-authority-separate-accounts)
diagnostics.authority_projection: Es posible que el token predeterminado siga montado o que la credencial proyectada no esté disponible o corresponda a otra cuenta o Pod. Comprueba el montaje automático y la proyección en el despliegue actual. [Causa y comprobación](guides#guide=workload-access&section=q125-consumer-authority-projected-credential)
diagnostics.authority_grants: Los vínculos pueden ser ilegibles, inexistentes o más amplios que un Role del espacio de nombres con get sobre el único ConfigMap asignado al consumidor. Revisa los sujetos que coincidan con las cuentas y los grupos y los Roles referenciados. [Causa y comprobación](guides#guide=workload-access&section=q125-consumer-authority-named-grants)
diagnostics.authority_live: El ejercicio puede no detectar un worker actual y listo o no recibir una respuesta válida de la API. Comprueba el Deployment, su ReplicaSet actual y el Pod antes de repetir las solicitudes. [Causa y comprobación](guides#guide=workload-access&section=q125-consumer-authority-live-observation)
diagnostics.authority_allowed: La solicitud permitida de un consumidor puede haber fallado o devuelto un registro incorrecto. Verifica su permiso sobre el ConfigMap nombrado y los datos actuales de ese consumidor según el contrato proporcionado. [Causa y comprobación](guides#guide=workload-access&section=q125-consumer-authority-allowed-record)
diagnostics.authority_denied: Una solicitud prohibida puede haber recibido un estado distinto de 403. Revisa los permisos entre consumidores, de listado y de recursos de control, así como los fallos previos a la autorización. [Causa y comprobación](guides#guide=workload-access&section=q125-consumer-authority-denied-records)
diagnostics.probe_0_0: La observación de políticas puede haberse interrumpido antes de indicar una condición concreta. Comprueba el registro de identidades proporcionado y las lecturas de la API sobre cargas, cuentas y permisos. [Causa y comprobación](guides#guide=workload-access&section=q125-consumer-authority-policy-observer)
diagnostics.probe_0_2: La observación de solicitudes puede haberse interrumpido antes de indicar una condición concreta. Verifica el endpoint de la API, el archivo de CA y la disponibilidad de los Pods actuales. [Causa y comprobación](guides#guide=workload-access&section=q125-consumer-authority-request-observer)
