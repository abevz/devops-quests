diagnostics.authority_actors: Las cargas e identidades suministradas deben estar disponibles mediante la API del
  namespace actual.
diagnostics.authority_identity: Cambió una carga original, identidad de control o imagen; conserva los componentes
  suministrados.
diagnostics.authority_split: Los consumidores necesitan ServiceAccounts dedicados y distintos, separados de identidades
  reservadas de control, default y workstation.
diagnostics.authority_projection: Usa la credencial del Pod actual propio para su ServiceAccount; conserva deshabilitado
  el montaje automático en consumidores.
diagnostics.authority_grants: Los vínculos del namespace solo permiten get de la configuración propia por nombre;
  permisos compartidos o extras incumplen la intención.
diagnostics.authority_live: Observa Pods actuales propios y listos con sus identidades vinculadas, no Pods en retirada
  ni tokens ajenos.
diagnostics.authority_allowed: Cada credencial actual del consumidor debe recibir HTTP 200 y el valor propio declarado.
diagnostics.authority_denied: Peticiones de otros consumidores, ruta, datos protegidos y listas fuera de la intención
  deben devolver HTTP 403.
diagnostics.probe_0_0: Las entradas actuales no verifican esta condición; inspecciona estado de objetos y contrato.
diagnostics.probe_0_2: Las entradas actuales no verifican esta condición; inspecciona estado de objetos y contrato.
