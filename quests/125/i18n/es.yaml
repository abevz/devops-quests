title: Contratos RBAC con privilegios mínimos
brief: 'Un controller debe leer únicamente el ConfigMap route. Su Role también permite listar ConfigMaps y leer Secrets, y
  el binding incluye por error la identidad observer. Restringe station-reader a get sobre configmaps con resourceNames [route]
  y vincula únicamente el ServiceAccount controller en este namespace. Ambos Pods ya tienen tokens API proyectados de corta
  duración. Prueba peticiones HTTPS reales utilizando la CA y el endpoint registrados; nunca imprimas los tokens. controller
  solo puede hacer get de route; otros ConfigMaps, las operaciones list y los Secrets deben devolver 403, y observer debe
  perder el acceso a route.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `controller-sa.json`, `observer-sa.json`, `controller.json`,
  `observer.json`, `role.json`, `binding.json`, `route.json`, `offlimits.json`, `secret.json`, `api-ca.pem`, `api-endpoint`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas y servicios
  privados. Cambie sólo esta bahía.


  Criterios iniciales de éxito: Solo controller puede hacer get del objeto llamado route; las peticiones reales demuestran
  que se deniegan list, los objetos no relacionados, Secrets y el acceso de observer.


  La Role `station-reader` debe contener exactamente una regla de la API core: `get` sobre `configmaps` con `resourceNames:
  [route]`. Su RoleBinding debe contener exactamente un sujeto, la ServiceAccount `controller` en el namespace de la bahía.
  La petición controller a `configmaps/route` verificada con CA debe devolver 200 y `.data.route: north-125`; las peticiones
  controller a `configmaps`, `configmaps/offlimits`, `secrets` y `secrets/control` deben devolver cada una 403. La petición
  observer a `configmaps/route` también debe devolver 403. Las comprobaciones observan esas peticiones y objetos, no todos
  los permisos posibles ni quién ejecutó los comandos.'
debrief: Se verificó el privilegio mínimo tanto para las operaciones como para identities, incluidas las solicitudes API negativas
  reales.
stages.0.brief: La Role y binding exactos, la respuesta controller para route y las peticiones denegadas indicadas coinciden
  con la descripción.
stages.0.objectives.0.text: La Role y binding exactos, la respuesta controller para route y las peticiones denegadas indicadas
  coinciden con la descripción.
hints.0.text: Un enlace selecciona identities; a Role define las operaciones permitidas.
hints.1.text: get by resourceName es más estrecho que list, incluso para el mismo recurso kind.
hints.2.text: Restrinja tanto Role rules como subjects y luego pruebe las rutas de acceso denegadas explícitas.
phrases.0: Obtuve acceso de lectura a un objeto con nombre.
phrases.1: Quité el RoleBinding subject no deseado.
phrases.2: Verifiqué operaciones denegadas utilizando el identities real.
questions.0.points.0: get accede a un recurso concreto por su nombre; list descubre una colección de recursos.
questions.0.points.1: La autorización verifica cada verb por separado.
questions.0.prompt: ¿Por qué get sobre un único resourceName no implica permiso para list?
questions.1.points.0: No; el principal incorrecto aún recibe esos permisos.
questions.1.points.1: Revise identity y el alcance de la operación juntos.
questions.1.prompt: ¿Puede el Role rules correcto compensar el binding subject incorrecto?
diagnostics.role: role/station-reader rules debe ser igual a get configmaps resourceNames [route].
diagnostics.binding: La RoleBinding debe contener solo la ServiceAccount controller en el namespace de esta bahía.
diagnostics.allowed: controller GET configmaps/route debe ser igual a HTTP 200.
diagnostics.value: configmaps/route data.route debe ser igual a north-125.
diagnostics.observer: observer GET configmaps/route debe devolver HTTP 403.
diagnostics.denied_configmaps: controller GET configmaps debe devolver HTTP 403.
diagnostics.denied_configmaps_offlimits: controller GET configmaps/offlimits debe devolver HTTP 403.
diagnostics.denied_secrets: controller GET secrets debe devolver HTTP 403.
diagnostics.denied_secrets_control: controller GET secrets/control debe devolver HTTP 403.
