title: Контракты RBAC с минимальными правами
brief: |-
  Авторизация нагрузок не соответствует заданным намерениям доступа. Восстановите узкие права и чтение потребителей, сохранив доступ управляющей нагрузки.

  Работайте на workstation в `~/quest` с заданными входами подключения/результата: `authority-contract.json`, `api-ca.pem`, `api-endpoint`. Определения нагрузок доступны в текущих объектах кластера.

  **Требования:**

  - Предоставленный Role в namespace разрешает только чтение по имени существующей конфигурации маршрута, а его привязка предоставляет этот доступ только предоставленной идентичности controller. Сохраните идентичности и образы всех заданных нагрузок и исходные управляющие ServiceAccount. У каждого зависимого потребителя своя отдельная выделенная идентичность, автоматическое монтирование credential выключено, а namespaced grants разрешают только чтение его записи по имени.
  - API GET с проверкой CA и смонтированной учётной информацией controller возвращает HTTP `200` и маршрут `north-125` из существующей конфигурации маршрута.
  - Запросы controller на списки ConfigMap или Secret, чтение отдельной защищённой конфигурации или контрольного Secret, а также запрос observer на чтение маршрута получают HTTP `403`. Credential текущего Pod каждого зависимого потребителя читает его объявленную запись с HTTP 200 и заданным значением. Маршрут, защищённые данные, записи другого потребителя и списки запрещены с HTTP 403; исходные управляющая и наблюдающая идентичности не читают зависимые записи.

  Проверки наблюдают текущие namespace-роли, идентичности и указанные API-запросы, а не все возможные права или историю команд. Не выводите токены.
debrief: Least privilege — эффективный граф идентичностей, grants и текущих credentials. Разделение principals и
  перенос их через потребителей восстанавливают зависимости без возврата широкого общего grant.
stages.0.brief: Сохраняйте обе учётные записи в тайне и запреты доступа.
hints.0.text: Права привязаны к идентичностям, а не к меткам нагрузок. Сужение общего grant может нарушить зависимые
  чтения; изменение шаблона не заменяет credential существующего Pod.
hints.1.text: |-
  Сопоставьте контракт намерений с текущими ServiceAccount, RoleBinding и идентичностями Pod. Декодируйте только метаданные идентичности, не выводите bearer credentials.

  ```sh
  cat authority-contract.json
  kubectl get deployment,serviceaccount,role,rolebinding -o yaml
  kubectl get pods -o yaml
  kubectl exec deployment/publisher -c worker -- cat /credential/token |
    python3 -I -c 'import base64,json,sys; token=sys.stdin.read().strip(); c=json.loads(base64.urlsafe_b64decode(token.split(".")[1]+"===")); print(json.dumps({"sub":c.get("sub"),"podUID":c.get("kubernetes.io",{}).get("pod",{}).get("uid")}))'

  ```
hints.2.text: |-
  Проверьте каждое разрешённое чтение по имени и каждый запрет по карте намерений с фактическим credential нагрузки. Тела всех запрещённых ответов отбрасывайте.

  ```sh
  api=$(cat api-endpoint)
  for actor in controller observer publisher sampler; do
    token=$(kubectl exec "deployment/$actor" -c worker -- cat /credential/token)
    for path in configmaps/route configmaps/release-plan configmaps/sampling configmaps secrets secrets/control configmaps/offlimits; do
      printf '%s %s ' "$actor" "$path"
      printf 'header = "Authorization: Bearer %s"\n' "$token" |
        curl --config - --cacert api-ca.pem -sS -o /dev/null -w 'HTTP %{http_code}\n' "$api/api/v1/namespaces/$DQ_NAMESPACE/$path"
    done
    unset token
  done
  ```
phrases.0: Я ограничил чтение одним именованным объектом.
phrases.1: Я убрал лишний subject RoleBinding.
phrases.2: Я проверил запреты от имени реальных identities.
questions.0.points.0: Get обращается к одному объекту; list раскрывает коллекцию.
questions.0.points.1: Авторизация проверяет каждый verb отдельно.
questions.0.prompt: Почему get одного resourceName не означает list?
questions.1.points.0: 'Нет: неверный principal всё равно получает эти права.'
questions.1.points.1: Проверяйте вместе identity и область операций.
questions.1.prompt: Компенсируют ли корректные rules Role неверный subject binding?
diagnostics.role: role/station-reader rules должен совпадать с get configmaps resourceNames [route].
diagnostics.binding: RoleBinding должен предоставлять доступ только идентичности controller в namespace этой песочницы.
diagnostics.allowed: controller GET configmaps/route должен совпадать с HTTP 200.
diagnostics.value: configmaps/route data.route должен совпадать с north-125.
diagnostics.observer: observer GET configmaps/route должен вернуть HTTP 403.
diagnostics.denied_configmaps: controller GET configmaps должен вернуть HTTP 403.
diagnostics.denied_configmaps_offlimits: controller GET configmaps/offlimits должен вернуть HTTP 403.
diagnostics.denied_secrets: controller GET secrets должен вернуть HTTP 403.
diagnostics.denied_secrets_control: controller GET secrets/control должен вернуть HTTP 403.
