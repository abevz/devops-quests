title: Контракты RBAC с минимальными правами
brief: 'Контроллер должен читать только ConfigMap route. Его Role также позволяет list ConfigMaps и чтение
  Secrets, а binding ошибочно включает observer. Ограничьте station-reader до get для configmaps с resourceNames
  [route] и оставьте в binding только ServiceAccount controller этого namespace. У обоих Pod уже есть
  краткоживущие projected API tokens. Проверьте реальные HTTPS-запросы с сохранёнными CA и endpoint; токены
  не печатайте. Контроллеру разрешён только get route; другие ConfigMaps, lists и Secrets должны давать
  403, observer должен потерять доступ к route.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `controller-sa.json`, `observer-sa.json`,
  `controller.json`, `observer.json`, `role.json`, `binding.json`, `route.json`, `offlimits.json`, `secret.json`,
  `api-ca.pem`, `api-endpoint`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Только controller получает именованный route; реальные запросы подтверждают запрет
  lists, посторонних объектов, Secrets и доступа observer.'
debrief: Минимальные права проверены и для операций, и для identities, включая реальные отрицательные
  API-запросы.
stages.0.brief: 'Только controller получает именованный route; реальные запросы подтверждают запрет lists,
  посторонних объектов, Secrets и доступа observer.


  Результат проверки: Только controller получает именованный route; реальные запросы подтверждают запрет
  lists, посторонних объектов, Secrets и доступа observer.'
stages.0.objectives.0.text: Только controller получает именованный route; реальные запросы подтверждают
  запрет lists, посторонних объектов, Secrets и доступа observer.
hints.0.text: Binding выбирает identities; Role задаёт допустимые операции.
hints.1.text: get по resourceName уже, чем list, даже для одного вида ресурсов.
hints.2.text: Ограничьте и rules Role, и subjects, затем проверьте явные запрещённые пути.
phrases.0: Я ограничил чтение одним именованным объектом.
phrases.1: Я убрал лишний subject RoleBinding.
phrases.2: Я проверил запреты от имени реальных identities.
questions.0.points.0: Get обращается к одному объекту; list раскрывает коллекцию.
questions.0.points.1: Авторизация проверяет каждый verb отдельно.
questions.0.prompt: Почему get одного resourceName не означает list?
questions.1.points.0: 'Нет: неверный principal всё равно получает эти права.'
questions.1.points.1: Проверяйте вместе identity и область операций.
questions.1.prompt: Компенсируют ли корректные rules Role неверный subject binding?
