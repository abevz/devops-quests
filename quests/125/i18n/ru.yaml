title: Контракты RBAC с минимальными правами
brief: "Читающий маршрут компонент должен иметь строго ограниченный доступ. Восстановите требуемый ответ controller,\
  \ сохранив запрет на посторонние запросы и запросы observer.\n\nРаботайте в `~/quest` на рабочей станции. Предоставлены\
  \ файлы: `controller-sa.json`, `observer-sa.json`, `controller.json`, `observer.json`, `role.json`, `binding.json`,\
  \ `route.json`, `offlimits.json`, `secret.json`, `api-ca.pem`, `api-endpoint`.\n\n**Requirements:**\n\n- Role\
  \ `station-reader` разрешает только `get` ConfigMap `route` основного API, а её RoleBinding содержит только ServiceAccount\
  \ `controller` из пространства имён песочницы.\n- Проверенный через CA запрос GET API с монтированным токеном\
  \ controller возвращает HTTP `200` и маршрут `north-125` для ConfigMap `route`.\n- Запросы controller на список\
  \ ConfigMap, чтение ConfigMap `offlimits`, список Secret и чтение Secret `control`, а также GET ConfigMap `route`\
  \ от observer получают HTTP `403`.\n\n**Verify yourself before Check & finish:** Выполните эти команды наблюдения\
  \ из `~/quest` на рабочей станции.\n\n- Настройки, идентичности и состояние соответствуют требованиям.\n\n  ```sh\n\
  \  kubectl get role station-reader -o yaml\n  kubectl get rolebinding station-reader -o yaml\n  ```\n\n- Указанный\
  \ маршрут возвращает `north-125` с HTTP `200`; остальные четыре запроса возвращают HTTP `403`. Не выводите и не\
  \ сохраняйте токен.\n\n  ```sh\n  api=$(cat api-endpoint)\n  token=$(kubectl exec deployment/controller -- cat\
  \ /credential/token)\n  for path in configmaps/route configmaps configmaps/offlimits secrets secrets/control;\
  \ do\n    printf 'header = \"Authorization: Bearer %s\"\\n' \"$token\" |\n      curl --config - --cacert api-ca.pem\
  \ -sS -w '\\nHTTP %{http_code}\\n' \\\n      \"$api/api/v1/namespaces/$DQ_NAMESPACE/$path\"\n  done\n  unset token\n\
  \  ```\n\n- Запрос observer возвращает HTTP `403` без раскрытия учётных данных.\n\n  ```sh\n  api=$(cat api-endpoint)\n\
  \  token=$(kubectl exec deployment/observer -- cat /credential/token)\n  printf 'header = \"Authorization: Bearer\
  \ %s\"\\n' \"$token\" |\n    curl --config - --cacert api-ca.pem -sS -o /dev/null -w 'HTTP %{http_code}\\n' \\\
  \n    \"$api/api/v1/namespaces/$DQ_NAMESPACE/configmaps/route\"\n  unset token\n  ```\n\nПроверки охватывают указанные\
  \ запросы и объекты, а не все возможные права или автора команд; никогда не выводите токены."
debrief: Минимальные права проверены и для операций, и для identities, включая реальные отрицательные API-запросы.
stages.0.brief: Только предназначенный читатель может получать указанный маршрут.
hints.0.text: Binding выбирает identities; Role задаёт допустимые операции. Предоставленная Role разрешает лишние
  списки ConfigMap и чтение Secret, а привязка включает observer. Обе нагрузки уже имеют короткоживущие проецируемые
  токены.
hints.1.text: get по resourceName уже, чем list, даже для одного вида ресурсов.
hints.2.text: Ограничьте и rules Role, и subjects, затем проверьте явные запрещённые пути.
phrases.0: Я ограничил чтение одним именованным объектом.
phrases.1: Я убрал лишний subject RoleBinding.
phrases.2: Я проверил запреты от имени реальных identities.
questions.0.points.0: Get обращается к одному объекту; list раскрывает коллекцию.
questions.0.points.1: Авторизация проверяет каждый verb отдельно.
questions.0.prompt: Почему get одного resourceName не означает list?
questions.1.points.0: 'Нет: неверный principal всё равно получает эти права.'
questions.1.points.1: Проверяйте вместе identity и область операций.
questions.1.prompt: Компенсируют ли корректные rules Role неверный subject binding?
diagnostics.role: role/station-reader rules должен совпадать с get configmaps resourceNames [route].
diagnostics.binding: RoleBinding должна содержать только ServiceAccount controller в namespace этой песочницы.
diagnostics.allowed: controller GET configmaps/route должен совпадать с HTTP 200.
diagnostics.value: configmaps/route data.route должен совпадать с north-125.
diagnostics.observer: observer GET configmaps/route должен вернуть HTTP 403.
diagnostics.denied_configmaps: controller GET configmaps должен вернуть HTTP 403.
diagnostics.denied_configmaps_offlimits: controller GET configmaps/offlimits должен вернуть HTTP 403.
diagnostics.denied_secrets: controller GET secrets должен вернуть HTTP 403.
diagnostics.denied_secrets_control: controller GET secrets/control должен вернуть HTTP 403.
stages.0.objectives.0.text: Role `station-reader` разрешает только `get` ConfigMap `route` основного API, а её RoleBinding
  содержит только ServiceAccount `controller` из пространства имён песочницы.
stages.0.objectives.1.text: Проверенный через CA запрос GET API с монтированным токеном controller возвращает HTTP
  `200` и маршрут `north-125` для ConfigMap `route`.
stages.0.objectives.2.text: Запросы controller на список ConfigMap, чтение ConfigMap `offlimits`, список Secret
  и чтение Secret `control`, а также GET ConfigMap `route` от observer получают HTTP `403`.
