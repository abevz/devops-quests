diagnostics.role: Роль station-reader может разрешать больше, чем get для ConfigMap route. Проверьте каждое правило для именованного ресурса основной группы API. [Причина и проверка](guides#guide=workload-access&section=q125-station-reader-role)
diagnostics.binding: В RoleBinding station-reader может не быть субъекта или указан другой субъект. Проверьте, что каждый субъект обозначает controller в пространстве имён упражнения. [Причина и проверка](guides#guide=workload-access&section=q125-station-reader-subject)
diagnostics.allowed: У фактического запроса controller к configmaps/route может не быть разрешения на это имя или его токен идёт из неготового rollout. Проверьте селектор, привязку и rollout, затем повторите проверку HTTP 200. [Причина и проверка](guides#guide=workload-access&section=q125-station-reader-live-allow)
diagnostics.value: Запрос controller мог не вернуть значение маршрута или вернуть значение, отличное от north-125. Убедитесь, что запрос проходит, затем проверьте действующий ConfigMap. [Причина и проверка](guides#guide=workload-access&section=q125-station-reader-route-value)
diagnostics.denied_configmaps: У controller могут быть слишком широкие права, или запрос мог не дойти до API с действующим токеном. Проверьте привязки на лишние ресурсы, имена и глаголы API и повторите отмеченную проверку HTTP 403. [Причина и проверка](guides#guide=workload-access&section=q125-station-reader-denials)
diagnostics.denied_configmaps_offlimits: У controller могут быть слишком широкие права, или запрос мог не дойти до API с действующим токеном. Проверьте привязки на лишние ресурсы, имена и глаголы API и повторите отмеченную проверку HTTP 403. [Причина и проверка](guides#guide=workload-access&section=q125-station-reader-denials)
diagnostics.denied_secrets: У controller могут быть слишком широкие права, или запрос мог не дойти до API с действующим токеном. Проверьте привязки на лишние ресурсы, имена и глаголы API и повторите отмеченную проверку HTTP 403. [Причина и проверка](guides#guide=workload-access&section=q125-station-reader-denials)
diagnostics.denied_secrets_control: У controller могут быть слишком широкие права, или запрос мог не дойти до API с действующим токеном. Проверьте привязки на лишние ресурсы, имена и глаголы API и повторите отмеченную проверку HTTP 403. [Причина и проверка](guides#guide=workload-access&section=q125-station-reader-denials)
diagnostics.observer: Запрос observer к configmaps/route мог получить разрешение или завершиться до авторизации. Проверьте rollout и привязки observer, затем повторите проверку HTTP 403. [Причина и проверка](guides#guide=workload-access&section=q125-station-reader-observer-denial)
diagnostics.authority_actors: Проверка могла не прочитать текущие Deployment или ServiceAccount. Проверьте список нагрузок и учётных записей в пространстве имён упражнения. [Причина и проверка](guides#guide=workload-access&section=q125-consumer-authority-actors)
diagnostics.authority_identity: Могли измениться исходный UID, образ worker или управляющая учётная запись. Сравните текущие нагрузки и защищённые ServiceAccount с выданной записью идентификаторов. [Причина и проверка](guides#guide=workload-access&section=q125-consumer-authority-retained-identity)
diagnostics.authority_split: Потребители могут использовать один ServiceAccount или зарезервированную учётную запись. Проверьте, что у publisher и sampler в текущем rollout разные незарезервированные учётные записи. [Причина и проверка](guides#guide=workload-access&section=q125-consumer-authority-separate-accounts)
diagnostics.authority_projection: Токен по умолчанию мог остаться смонтированным, а явно спроецированный токен мог быть недоступен или относиться к другому Pod либо учётной записи. Проверьте настройки автомонтирования и проекцию в текущем rollout. [Причина и проверка](guides#guide=workload-access&section=q125-consumer-authority-projected-credential)
diagnostics.authority_grants: Привязки могут не читаться, отсутствовать или выходить за рамки Role с get на единственный назначенный ConfigMap в пространстве имён. Проверьте подходящих субъектов-аккаунты и группы и указанные в их привязках Role. [Причина и проверка](guides#guide=workload-access&section=q125-consumer-authority-named-grants)
diagnostics.authority_live: Проверка могла не увидеть текущий готовый worker или не получить корректный ответ API. Проверьте Deployment, его текущий ReplicaSet и Pod, затем повторите проверки запросов. [Причина и проверка](guides#guide=workload-access&section=q125-consumer-authority-live-observation)
diagnostics.authority_allowed: Разрешённый запрос потребителя мог завершиться ошибкой или вернуть не ту запись. Проверьте право на именованный ConfigMap и действующие данные этого потребителя по выданному контракту. [Причина и проверка](guides#guide=workload-access&section=q125-consumer-authority-allowed-record)
diagnostics.authority_denied: Запрещённый запрос мог получить статус, отличный от 403. Проверьте права на записи другого потребителя, перечисление ресурсов и управляющие ресурсы, а также сбои до авторизации. [Причина и проверка](guides#guide=workload-access&section=q125-consumer-authority-denied-records)
diagnostics.probe_0_0: Проверка политик могла остановиться до вывода конкретного условия. Проверьте выданную запись идентификаторов и доступность данных API о нагрузках, учётных записях и правах. [Причина и проверка](guides#guide=workload-access&section=q125-consumer-authority-policy-observer)
diagnostics.probe_0_2: Проверка запросов могла остановиться до вывода конкретного условия. Проверьте выданный адрес API, файл CA и готовность текущих Pod. [Причина и проверка](guides#guide=workload-access&section=q125-consumer-authority-request-observer)
