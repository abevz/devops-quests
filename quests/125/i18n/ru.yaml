title: Контракты RBAC с минимальными правами
brief: |-
  Читающий маршрут компонент должен иметь строго ограниченный доступ. Восстановите требуемый ответ controller, сохранив запрет на посторонние запросы и запросы observer.

  Работайте на workstation в `~/quest` с предоставленными файлами:
  - `controller-sa.yaml`, `observer-sa.yaml`, `controller.yaml`, `observer.yaml`, `role.yaml`, `binding.yaml`, `route.yaml`, `offlimits.yaml`, `secret.yaml`, `api-ca.pem`, `api-endpoint`.

  **Requirements:**

  - Предоставленный Role в namespace разрешает только чтение по имени существующей конфигурации маршрута, а его привязка предоставляет этот доступ только предоставленной идентичности controller.
  - API GET с проверкой CA и смонтированной учётной информацией controller возвращает HTTP `200` и маршрут `north-125` из существующей конфигурации маршрута.
  - Запросы controller на списки ConfigMap или Secret, чтение отдельной защищённой конфигурации или контрольного Secret, а также запрос observer на чтение маршрута получают HTTP `403`.

  Проверки охватывают указанные запросы и объекты, а не все возможные права или автора команд; никогда не выводите токены.
debrief: Минимальные права проверены и для операций, и для identities, включая реальные отрицательные
  API-запросы.
stages.0.brief: Сохраняйте обе учётные записи в тайне и запреты доступа.
hints.0.text: Binding выбирает identities; Role задаёт допустимые операции. Предоставленная Role разрешает
  лишние списки ConfigMap и чтение Secret, а привязка включает observer. Обе нагрузки уже имеют короткоживущие
  проецируемые токены.
hints.1.text: |-
  get по resourceName уже, чем list, даже для одного вида ресурсов.

  Изучите предоставленные файлы и живые наблюдения:

  ```sh
  kubectl get role station-reader -o yaml
    kubectl get rolebinding station-reader -o yaml
  ```
hints.2.text: |-
  Ограничьте и rules Role, и subjects, затем проверьте явные запрещённые пути.

  Проверьте результат из `~/quest` на workstation:

  - Указанный маршрут возвращает `north-125` с HTTP `200`; остальные четыре запроса возвращают HTTP `403`. Не выводите и не сохраняйте токен.

    ```sh
    api=$(cat api-endpoint)
    token=$(kubectl exec deployment/controller -- cat /credential/token)
    for path in configmaps/route configmaps configmaps/offlimits secrets secrets/control; do
      printf 'header = "Authorization: Bearer %s"\n' "$token" |
        curl --config - --cacert api-ca.pem -sS -w '\nHTTP %{http_code}\n' \
        "$api/api/v1/namespaces/$DQ_NAMESPACE/$path"
    done
    unset token
    ```

  - Запрос observer возвращает HTTP `403` без раскрытия учётных данных.

    ```sh
    api=$(cat api-endpoint)
    token=$(kubectl exec deployment/observer -- cat /credential/token)
    printf 'header = "Authorization: Bearer %s"\n' "$token" |
      curl --config - --cacert api-ca.pem -sS -o /dev/null -w 'HTTP %{http_code}\n' \
      "$api/api/v1/namespaces/$DQ_NAMESPACE/configmaps/route"
    unset token
    ```
phrases.0: Я ограничил чтение одним именованным объектом.
phrases.1: Я убрал лишний subject RoleBinding.
phrases.2: Я проверил запреты от имени реальных identities.
questions.0.points.0: Get обращается к одному объекту; list раскрывает коллекцию.
questions.0.points.1: Авторизация проверяет каждый verb отдельно.
questions.0.prompt: Почему get одного resourceName не означает list?
questions.1.points.0: 'Нет: неверный principal всё равно получает эти права.'
questions.1.points.1: Проверяйте вместе identity и область операций.
questions.1.prompt: Компенсируют ли корректные rules Role неверный subject binding?
diagnostics.role: role/station-reader rules должен совпадать с get configmaps resourceNames [route].
diagnostics.binding: RoleBinding должна содержать только ServiceAccount controller в namespace этой песочницы.
diagnostics.allowed: controller GET configmaps/route должен совпадать с HTTP 200.
diagnostics.value: configmaps/route data.route должен совпадать с north-125.
diagnostics.observer: observer GET configmaps/route должен вернуть HTTP 403.
diagnostics.denied_configmaps: controller GET configmaps должен вернуть HTTP 403.
diagnostics.denied_configmaps_offlimits: controller GET configmaps/offlimits должен вернуть HTTP 403.
diagnostics.denied_secrets: controller GET secrets должен вернуть HTTP 403.
diagnostics.denied_secrets_control: controller GET secrets/control должен вернуть HTTP 403.
