diagnostics.authority_actors: Заданные нагрузки и объекты идентичности должны быть доступны через API текущего namespace.
diagnostics.authority_identity: Изменена исходная нагрузка, управляющая идентичность или заданный образ; сохраните
  предоставленные компоненты.
diagnostics.authority_split: Зависимым потребителям нужны разные выделенные ServiceAccount, отличные от зарезервированных
  управляющих, default и workstation-идентичностей.
diagnostics.authority_projection: Используйте credential текущего Pod с правильным владельцем и объявленным ServiceAccount;
  автоматическое монтирование у зависимых потребителей выключено.
diagnostics.authority_grants: Действующие namespace-привязки разрешают только get конфигурации этого потребителя
  по имени; общие или лишние grants нарушают намерение.
diagnostics.authority_live: Наблюдайте текущие готовые Pod с правильными владельцами и связанные credential-идентичности,
  а не завершающийся Pod или посторонний токен.
diagnostics.authority_allowed: Каждый текущий credential зависимого потребителя должен получать HTTP 200 и объявленное
  значение своей записи.
diagnostics.authority_denied: Запросы записей другого потребителя, маршрута, защищённых данных и списков вне намерения
  должны возвращать HTTP 403.
diagnostics.probe_0_0: Текущие входы не подтверждают это условие; изучите состояние живых объектов и заданный контракт.
diagnostics.probe_0_2: Текущие входы не подтверждают это условие; изучите состояние живых объектов и заданный контракт.
