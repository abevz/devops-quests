title: Least-privilege RBAC contracts
brief: |-
  Workload authorization does not match the declared access intents. Restore narrow privileges and current consumer reads while retaining control access.

  Work on the workstation in `~/quest` with the supplied connection/result inputs: `authority-contract.json`, `api-ca.pem`, `api-endpoint`. Existing cluster objects provide the workload definitions.

  **Requirements:**

  - The supplied namespaced Role grants only named-read access to the existing route configuration, and its binding grants that access only to the supplied controller identity. Retain all supplied workload identities and images and the original control ServiceAccounts. Each dependent consumer uses its own distinct dedicated identity, with automatic credential mounting disabled. In the exercise namespace, each matching RoleBinding refers to a Role limited to get for the consumer’s named ConfigMap.
  - A CA-verified API GET with the mounted controller credential returns HTTP `200` and route `north-125` from the existing route configuration.
  - Controller requests to list ConfigMaps or Secrets, read the separate protected configuration or control Secret, and the observer request to read the route all receive HTTP `403`. Each dependent consumer's current Pod-bound credential reads its own declared record with HTTP 200 and the declared value. Route, protected data, cross-consumer reads and lists are forbidden with HTTP 403; the original control and observer identities cannot read the dependent records.

  Checks observe current namespace roles, identities and the specified API requests, not every possible permission or command history. Never print tokens.
debrief: Least privilege is an effective graph of identities, grants and current credentials. Propagating distinct
  principals through consumers repairs dependencies without restoring a broad shared grant.
stages.0.brief: Keep both credentials private and preserve denied access.
hints.0.text: Permissions attach to identities, not to workload labels. Tightening a shared grant can break dependent
  reads; changing a template does not replace credentials in an existing Pod.
hints.1.text: |-
  Compare the intent contract with live ServiceAccounts, RoleBindings and current Pod identities. Decode only identity metadata, never print bearer credentials.

  ```sh
  cat authority-contract.json
  kubectl get deployment,serviceaccount,role,rolebinding -o yaml
  kubectl get pods -o yaml
  kubectl exec deployment/publisher -c worker -- cat /credential/token |
    python3 -I -c 'import base64,json,sys; token=sys.stdin.read().strip(); c=json.loads(base64.urlsafe_b64decode(token.split(".")[1]+"===")); print(json.dumps({"sub":c.get("sub"),"podUID":c.get("kubernetes.io",{}).get("pod",{}).get("uid")}))'

  ```
hints.2.text: |-
  Verify each allowed named read against the intent map and every forbidden request with the actual workload credential. All forbidden response bodies must be discarded.

  ```sh
  api=$(cat api-endpoint)
  for actor in controller observer publisher sampler; do
    token=$(kubectl exec "deployment/$actor" -c worker -- cat /credential/token)
    for path in configmaps/route configmaps/release-plan configmaps/sampling configmaps secrets secrets/control configmaps/offlimits; do
      printf '%s %s ' "$actor" "$path"
      printf 'header = "Authorization: Bearer %s"\n' "$token" |
        curl --config - --cacert api-ca.pem -sS -o /dev/null -w 'HTTP %{http_code}\n' "$api/api/v1/namespaces/$DQ_NAMESPACE/$path"
    done
    unset token
  done
  ```

  ```sh
  api=$(cat api-endpoint)
  jq -c '.consumers[], (.control + {key:"route"})' authority-contract.json |
  while IFS= read -r entry; do
    actor=$(jq -r .deployment <<<"$entry")
    name=$(jq -r .configMap <<<"$entry")
    key=$(jq -r .key <<<"$entry")
    expected=$(jq -r .response <<<"$entry")
    token=$(kubectl exec "deployment/$actor" -c worker -- cat /credential/token)
    if printf 'header = "Authorization: Bearer %s"\n' "$token" |
      curl --config - --cacert api-ca.pem -fsS "$api/api/v1/namespaces/$DQ_NAMESPACE/configmaps/$name" |
      jq -e --arg key "$key" --arg expected "$expected" '.data[$key] == $expected' >/dev/null;
    then
      printf '%s %s: match\n' "$actor" "$name"
    else
      printf '%s %s: mismatch\n' "$actor" "$name"
    fi
    unset token
  done
  ```

  The named reads allowed by the contract return HTTP 200. Each denied request returns HTTP 403.
phrases.0: I scoped read access to one named object.
phrases.1: I removed the unintended RoleBinding subject.
phrases.2: I verified denied operations using the actual identities.
questions.0.points.0: Get addresses one named resource; list discovers a collection.
questions.0.points.1: Authorization checks each verb separately.
questions.0.prompt: Why does get on one resourceName not imply list?
questions.1.points.0: No; the wrong principal still receives those permissions.
questions.1.points.1: Review identity and operation scope together.
questions.1.prompt: Can correct Role rules compensate for the wrong binding subject?
