diagnostics.role: The station-reader Role may grant more than get on ConfigMap route. Check every rule for the named core API resource. [Cause and check](guides#guide=workload-access&section=q125-station-reader-role)
diagnostics.binding: The station-reader RoleBinding may have a missing or different subject. Check that each subject identifies controller in the exercise namespace. [Cause and check](guides#guide=workload-access&section=q125-station-reader-subject)
diagnostics.allowed: The live controller request for configmaps/route may lack the named grant or use a credential from an unready rollout. Check the selector, binding and rollout before repeating the exercise check for HTTP 200. [Cause and check](guides#guide=workload-access&section=q125-station-reader-live-allow)
diagnostics.value: The controller request may return no route value or a value other than north-125. Check the live ConfigMap after confirming that the request succeeds. [Cause and check](guides#guide=workload-access&section=q125-station-reader-route-value)
diagnostics.denied_configmaps: The controller request may have an overly broad grant or may not have reached the API with a valid credential. Check the bindings for broad resource, name or verb access and repeat the marked request for HTTP 403. [Cause and check](guides#guide=workload-access&section=q125-station-reader-denials)
diagnostics.denied_configmaps_offlimits: The controller request may have an overly broad grant or may not have reached the API with a valid credential. Check the bindings for broad resource, name or verb access and repeat the marked request for HTTP 403. [Cause and check](guides#guide=workload-access&section=q125-station-reader-denials)
diagnostics.denied_secrets: The controller request may have an overly broad grant or may not have reached the API with a valid credential. Check the bindings for broad resource, name or verb access and repeat the marked request for HTTP 403. [Cause and check](guides#guide=workload-access&section=q125-station-reader-denials)
diagnostics.denied_secrets_control: The controller request may have an overly broad grant or may not have reached the API with a valid credential. Check the bindings for broad resource, name or verb access and repeat the marked request for HTTP 403. [Cause and check](guides#guide=workload-access&section=q125-station-reader-denials)
diagnostics.observer: The observer request to configmaps/route may be granted access or fail before authorization. Check the observer rollout and bindings, then repeat the check for HTTP 403. [Cause and check](guides#guide=workload-access&section=q125-station-reader-observer-denial)
diagnostics.authority_actors: The check may be unable to read current Deployments or ServiceAccounts. Verify the workload and identity inventory in the exercise namespace. [Cause and check](guides#guide=workload-access&section=q125-consumer-authority-actors)
diagnostics.authority_identity: The original UID, worker image or control account may have changed. Compare the live workloads and protected ServiceAccounts with the supplied identity record. [Cause and check](guides#guide=workload-access&section=q125-consumer-authority-retained-identity)
diagnostics.authority_split: The consumers may share a ServiceAccount or use a reserved identity. Check that publisher and sampler have distinct, nonreserved accounts in the current rollout. [Cause and check](guides#guide=workload-access&section=q125-consumer-authority-separate-accounts)
diagnostics.authority_projection: The default token may still be mounted or the explicit projected credential may be unavailable or tied to a different account or Pod. Check automount settings and projection in the current rollout. [Cause and check](guides#guide=workload-access&section=q125-consumer-authority-projected-credential)
diagnostics.authority_grants: Bindings may be unreadable, absent or broader than a namespace Role with get on the consumer's one assigned ConfigMap. Check matching account and group subjects and their referenced Roles. [Cause and check](guides#guide=workload-access&section=q125-consumer-authority-named-grants)
diagnostics.authority_live: The exercise may not be able to observe a current ready worker or receive a valid API response. Check the Deployment and its current ReplicaSet and Pod before repeating the request checks. [Cause and check](guides#guide=workload-access&section=q125-consumer-authority-live-observation)
diagnostics.authority_allowed: An allowed consumer request may have failed or returned the wrong record. Verify its named ConfigMap grant and the current data for that consumer in the supplied contract. [Cause and check](guides#guide=workload-access&section=q125-consumer-authority-allowed-record)
diagnostics.authority_denied: A forbidden request may have received a status other than 403. Check for cross-consumer, list and control-resource grants and for requests that fail before authorization. [Cause and check](guides#guide=workload-access&section=q125-consumer-authority-denied-records)
diagnostics.probe_0_0: The policy observer may have stopped before returning a specific condition. Check the supplied identity record and API observations for workloads, accounts and grants. [Cause and check](guides#guide=workload-access&section=q125-consumer-authority-policy-observer)
diagnostics.probe_0_2: The request observer may have stopped before returning a specific condition. Check the supplied API endpoint and CA file and the readiness of current Pods. [Cause and check](guides#guide=workload-access&section=q125-consumer-authority-request-observer)
