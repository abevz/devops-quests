diagnostics.authority_actors: The supplied workload and identity objects must be available through the current namespace
  API.
diagnostics.authority_identity: An original workload, control identity or supplied image changed; preserve the provided
  components.
diagnostics.authority_split: Dependent consumers need distinct dedicated ServiceAccounts, separate from the reserved
  control, default and workstation identities.
diagnostics.authority_projection: Use the current owned Pod credential for its declared ServiceAccount; keep automatic
  mounting disabled for dependent consumers.
diagnostics.authority_grants: Effective namespaced bindings must grant only get on that consumer named configuration;
  shared or extra grants violate the intent.
diagnostics.authority_live: Observe current owned ready Pods and their bound credential identities, rather than
  a retiring Pod or an unrelated token.
diagnostics.authority_allowed: Each dependent current credential must receive HTTP 200 and its declared record value.
diagnostics.authority_denied: Cross-consumer, route, protected-data and list requests outside the intent must return
  HTTP 403.
diagnostics.probe_0_0: Current inputs could not verify this condition; inspect the live object status and supplied
  contract.
diagnostics.probe_0_2: Current inputs could not verify this condition; inspect the live object status and supplied
  contract.
