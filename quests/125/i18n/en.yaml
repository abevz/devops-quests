title: Least-privilege RBAC contracts
brief: 'A controller should read only the route ConfigMap. Its Role also permits listing ConfigMaps and reading Secrets, and
  the binding accidentally includes the observer identity. Restrict station-reader to get on configmaps resourceNames [route]
  and bind only the controller ServiceAccount in this namespace. Both Pods already have short-lived projected API tokens.
  Test actual HTTPS requests using the frozen CA and endpoint; never print tokens. The controller may get route only; other
  ConfigMaps, lists and Secrets must return 403, and observer must lose route access.


  Quest files in `~/quest` (some appear in later stages): `controller-sa.json`, `observer-sa.json`, `controller.json`, `observer.json`,
  `role.json`, `binding.json`, `route.json`, `offlimits.json`, `secret.json`, `api-ca.pem`, `api-endpoint`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services. Change only this
  bay.


  Initial success criteria: Only the controller can get the named route; real requests prove denied lists, unrelated objects,
  Secrets and observer access.


  Role `station-reader` must contain exactly one core-API rule: `get` on `configmaps` with `resourceNames: [route]`. Its RoleBinding
  must contain exactly one subject, ServiceAccount `controller` in this bay namespace. The CA-verified controller request
  for `configmaps/route` must return 200 and `.data.route: north-125`; controller requests for `configmaps`, `configmaps/offlimits`,
  `secrets` and `secrets/control` must each return 403. The observer request for `configmaps/route` must also return 403.
  The checks observe those specific requests and objects, not all possible permissions or who issued your commands.'
debrief: Least privilege was verified for both operations and identities, including real negative API requests.
stages.0.brief: The exact Role and binding, controller route response and specified denied requests match the brief.
stages.0.objectives.0.text: The exact Role and binding, controller route response and specified denied requests match the
  brief.
hints.0.text: A binding selects identities; a Role defines allowed operations.
hints.1.text: get by resourceName is narrower than list, even for the same resource kind.
hints.2.text: Restrict both the Role rules and subjects, then test explicit denied paths.
phrases.0: I scoped read access to one named object.
phrases.1: I removed the unintended RoleBinding subject.
phrases.2: I verified denied operations using the actual identities.
questions.0.points.0: Get addresses one named resource; list discovers a collection.
questions.0.points.1: Authorization checks each verb separately.
questions.0.prompt: Why does get on one resourceName not imply list?
questions.1.points.0: No; the wrong principal still receives those permissions.
questions.1.points.1: Review identity and operation scope together.
questions.1.prompt: Can correct Role rules compensate for the wrong binding subject?
diagnostics.role: role/station-reader rules must equal get configmaps resourceNames [route].
diagnostics.binding: The RoleBinding must contain only ServiceAccount controller in this bay namespace.
diagnostics.allowed: controller GET configmaps/route must equal HTTP 200.
diagnostics.value: configmaps/route data.route must equal north-125.
diagnostics.observer: observer GET configmaps/route must return HTTP 403.
diagnostics.denied_configmaps: controller GET configmaps must return HTTP 403.
diagnostics.denied_configmaps_offlimits: controller GET configmaps/offlimits must return HTTP 403.
diagnostics.denied_secrets: controller GET secrets must return HTTP 403.
diagnostics.denied_secrets_control: controller GET secrets/control must return HTTP 403.
