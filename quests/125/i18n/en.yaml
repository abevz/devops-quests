title: Least-privilege RBAC contracts
brief: 'A controller should read only the route ConfigMap. Its Role also permits listing
  ConfigMaps and reading Secrets, and the binding accidentally includes the observer
  identity. Restrict station-reader to get on configmaps resourceNames [route] and
  bind only the controller ServiceAccount in this namespace. Both Pods already have
  short-lived projected API tokens. Test actual HTTPS requests using the frozen CA
  and endpoint; never print tokens. The controller may get route only; other ConfigMaps,
  lists and Secrets must return 403, and observer must lose route access.


  Quest files in `~/quest` (some appear in later stages): `controller-sa.json`, `observer-sa.json`,
  `controller.json`, `observer.json`, `role.json`, `binding.json`, `route.json`, `offlimits.json`,
  `secret.json`, `api-ca.pem`, `api-endpoint`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images
  and private services. Change only this bay.


  Initial success criteria: Only the controller can get the named route; real requests
  prove denied lists, unrelated objects, Secrets and observer access.'
debrief: Least privilege was verified for both operations and identities, including
  real negative API requests.
