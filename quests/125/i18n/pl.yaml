title: Umowy RBAC o najniższych uprawnieniach
brief: "Czytnik trasy musi mieć wąsko ograniczony dostęp. Przywróć zamierzoną odpowiedź controller, a inne żądania\
  \ i żądania observer mają pozostać zabronione.\n\nPracuj w `~/quest` na stacji roboczej. Dostarczone pliki: `controller-sa.yaml`,\
  \ `observer-sa.yaml`, `controller.yaml`, `observer.yaml`, `role.yaml`, `binding.yaml`, `route.yaml`, `offlimits.yaml`,\
  \ `secret.yaml`, `api-ca.pem`, `api-endpoint`.\n\n**Requirements:**\n\n- Role `station-reader` pozwala tylko na\
  \ `get` ConfigMap `route` z głównego API, a jej RoleBinding zawiera tylko ServiceAccount `controller` z namespace\
  \ piaskownicy.\n- Żądanie GET API zweryfikowane przez CA z zamontowanym tokenem controller zwraca HTTP `200` i\
  \ trasę `north-125` dla ConfigMap `route`.\n- Żądania controller o listę ConfigMap, odczyt ConfigMap `offlimits`,\
  \ listę Secret i odczyt Secret `control` oraz GET ConfigMap `route` od observer otrzymują HTTP `403`.\n\n**Verify\
  \ yourself before Check & finish:** Wykonaj te polecenia obserwacji z `~/quest` na stacji roboczej.\n\n- Ustawienia,\
  \ tożsamości i stan odpowiadają wymaganiom.\n\n  ```sh\n  kubectl get role station-reader -o yaml\n  kubectl get\
  \ rolebinding station-reader -o yaml\n  ```\n\n- Wskazana trasa zwraca `north-125` z HTTP `200`; pozostałe cztery\
  \ żądania zwracają HTTP `403`. Nie wyświetlaj ani nie zapisuj tokena.\n\n  ```sh\n  api=$(cat api-endpoint)\n\
  \  token=$(kubectl exec deployment/controller -- cat /credential/token)\n  for path in configmaps/route configmaps\
  \ configmaps/offlimits secrets secrets/control; do\n    printf 'header = \"Authorization: Bearer %s\"\\n' \"$token\"\
  \ |\n      curl --config - --cacert api-ca.pem -sS -w '\\nHTTP %{http_code}\\n' \\\n      \"$api/api/v1/namespaces/$DQ_NAMESPACE/$path\"\
  \n  done\n  unset token\n  ```\n\n- Żądanie observer zwraca HTTP `403` bez ujawnienia poświadczeń.\n\n  ```sh\n\
  \  api=$(cat api-endpoint)\n  token=$(kubectl exec deployment/observer -- cat /credential/token)\n  printf 'header\
  \ = \"Authorization: Bearer %s\"\\n' \"$token\" |\n    curl --config - --cacert api-ca.pem -sS -o /dev/null -w\
  \ 'HTTP %{http_code}\\n' \\\n    \"$api/api/v1/namespaces/$DQ_NAMESPACE/configmaps/route\"\n  unset token\n  ```\n\
  \nKontrole obejmują wskazane żądania i obiekty, nie wszystkie możliwe uprawnienia ani autora poleceń; nigdy nie\
  \ wyświetlaj tokenów."
debrief: Zweryfikowano najniższe uprawnienia dla obu operacji i identities, w tym dla rzeczywistych negatywnych
  żądań API.
stages.0.brief: Tylko zamierzony czytnik może pobierać wskazaną trasę.
hints.0.text: Powiązanie wybiera identities; a Role definiuje dozwolone operacje. Dostarczona Role pozwala na dodatkowe
  listy ConfigMap i odczyty Secret, a binding obejmuje observer. Oba obciążenia mają już krótkotrwałe projektowane
  tokeny.
hints.1.text: get by resourceName jest węższy niż list, nawet dla tego samego rodzaju zasobu.
hints.2.text: Ogranicz reguły Role i subjects, a następnie przetestuj jawnie zabronione ścieżki.
phrases.0: Ograniczyłem dostęp do odczytu do jednego nazwanego obiektu.
phrases.1: Usunąłem niezamierzony temat RoleBinding.
phrases.2: Sprawdziłem odrzucone operacje przy użyciu rzeczywistego identities.
questions.0.points.0: Get adresuje jeden nazwany zasób; list odkrywa kolekcję.
questions.0.points.1: Autoryzacja sprawdza każdy verb osobno.
questions.0.prompt: Dlaczego get na jednym resourceName nie oznacza list?
questions.1.points.0: NIE; niewłaściwy principal nadal otrzymuje te uprawnienia.
questions.1.points.1: Przejrzyj razem identity i zakres działania.
questions.1.prompt: Czy poprawne reguły Role mogą zrekompensować niewłaściwy wiążący temat?
diagnostics.role: role/station-reader rules musi być równe get configmaps resourceNames [route].
diagnostics.binding: RoleBinding musi zawierać tylko ServiceAccount controller w namespace tej zatoki.
diagnostics.allowed: controller GET configmaps/route musi być równe HTTP 200.
diagnostics.value: configmaps/route data.route musi być równe north-125.
diagnostics.observer: observer GET configmaps/route musi zwrócić HTTP 403.
diagnostics.denied_configmaps: controller GET configmaps musi zwrócić HTTP 403.
diagnostics.denied_configmaps_offlimits: controller GET configmaps/offlimits musi zwrócić HTTP 403.
diagnostics.denied_secrets: controller GET secrets musi zwrócić HTTP 403.
diagnostics.denied_secrets_control: controller GET secrets/control musi zwrócić HTTP 403.
