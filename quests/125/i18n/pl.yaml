title: Umowy RBAC o najniższych uprawnieniach
brief: |-
  Czytnik trasy musi mieć wąsko ograniczony dostęp. Przywróć zamierzoną odpowiedź controller, a inne żądania i żądania observer mają pozostać zabronione.

  Pracuj na workstation w `~/quest` z dostarczonymi plikami:
  - `controller-sa.yaml`, `observer-sa.yaml`, `controller.yaml`, `observer.yaml`, `role.yaml`, `binding.yaml`, `route.yaml`, `offlimits.yaml`, `secret.yaml`, `api-ca.pem`, `api-endpoint`.

  **Requirements:**

  - Dostarczony Role w namespace przyznaje tylko odczyt istniejącej konfiguracji trasy po nazwie, a jego binding przyznaje ten dostęp tylko dostarczonej tożsamości controller.
  - GET API z weryfikacją CA i zamontowanym poświadczeniem controller zwraca HTTP `200` i trasę `north-125` z istniejącej konfiguracji.
  - Żądania controller dotyczące list ConfigMap lub Secret, odczytu oddzielnej chronionej konfiguracji lub kontrolnego Secret oraz żądanie observer odczytu trasy otrzymują HTTP `403`.

  Kontrole obejmują wskazane żądania i obiekty, nie wszystkie możliwe uprawnienia ani autora poleceń; nigdy nie wyświetlaj tokenów.
debrief: Zweryfikowano najniższe uprawnienia dla obu operacji i identities, w tym dla rzeczywistych negatywnych
  żądań API.
stages.0.brief: Zachowaj poufność obu poświadczeń oraz odmowy dostępu.
hints.0.text: Powiązanie wybiera identities; a Role definiuje dozwolone operacje. Dostarczona Role pozwala
  na dodatkowe listy ConfigMap i odczyty Secret, a binding obejmuje observer. Oba obciążenia mają już
  krótkotrwałe projektowane tokeny.
hints.1.text: |-
  get by resourceName jest węższy niż list, nawet dla tego samego rodzaju zasobu.

  Sprawdź dostarczone dane i bieżące obserwacje:

  ```sh
  kubectl get role station-reader -o yaml
    kubectl get rolebinding station-reader -o yaml
  ```
hints.2.text: |-
  Ogranicz reguły Role i subjects, a następnie przetestuj jawnie zabronione ścieżki.

  Sprawdź wynik z `~/quest` na workstation:

  - Wskazana trasa zwraca `north-125` z HTTP `200`; pozostałe cztery żądania zwracają HTTP `403`. Nie wyświetlaj ani nie zapisuj tokena.

    ```sh
    api=$(cat api-endpoint)
    token=$(kubectl exec deployment/controller -- cat /credential/token)
    for path in configmaps/route configmaps configmaps/offlimits secrets secrets/control; do
      printf 'header = "Authorization: Bearer %s"\n' "$token" |
        curl --config - --cacert api-ca.pem -sS -w '\nHTTP %{http_code}\n' \
        "$api/api/v1/namespaces/$DQ_NAMESPACE/$path"
    done
    unset token
    ```

  - Żądanie observer zwraca HTTP `403` bez ujawnienia poświadczeń.

    ```sh
    api=$(cat api-endpoint)
    token=$(kubectl exec deployment/observer -- cat /credential/token)
    printf 'header = "Authorization: Bearer %s"\n' "$token" |
      curl --config - --cacert api-ca.pem -sS -o /dev/null -w 'HTTP %{http_code}\n' \
      "$api/api/v1/namespaces/$DQ_NAMESPACE/configmaps/route"
    unset token
    ```
phrases.0: Ograniczyłem dostęp do odczytu do jednego nazwanego obiektu.
phrases.1: Usunąłem niezamierzony temat RoleBinding.
phrases.2: Sprawdziłem odrzucone operacje przy użyciu rzeczywistego identities.
questions.0.points.0: Get adresuje jeden nazwany zasób; list odkrywa kolekcję.
questions.0.points.1: Autoryzacja sprawdza każdy verb osobno.
questions.0.prompt: Dlaczego get na jednym resourceName nie oznacza list?
questions.1.points.0: NIE; niewłaściwy principal nadal otrzymuje te uprawnienia.
questions.1.points.1: Przejrzyj razem identity i zakres działania.
questions.1.prompt: Czy poprawne reguły Role mogą zrekompensować niewłaściwy wiążący temat?
diagnostics.role: role/station-reader rules musi być równe get configmaps resourceNames [route].
diagnostics.binding: RoleBinding musi zawierać tylko ServiceAccount controller w namespace tej zatoki.
diagnostics.allowed: controller GET configmaps/route musi być równe HTTP 200.
diagnostics.value: configmaps/route data.route musi być równe north-125.
diagnostics.observer: observer GET configmaps/route musi zwrócić HTTP 403.
diagnostics.denied_configmaps: controller GET configmaps musi zwrócić HTTP 403.
diagnostics.denied_configmaps_offlimits: controller GET configmaps/offlimits musi zwrócić HTTP 403.
diagnostics.denied_secrets: controller GET secrets musi zwrócić HTTP 403.
diagnostics.denied_secrets_control: controller GET secrets/control musi zwrócić HTTP 403.
stages.0.objectives.0.text: Dostarczony Role w namespace przyznaje tylko odczyt istniejącej konfiguracji
  trasy po nazwie, a jego binding przyznaje ten dostęp tylko dostarczonej tożsamości controller.
stages.0.objectives.1.text: GET API z weryfikacją CA i zamontowanym poświadczeniem controller zwraca HTTP
  `200` i trasę `north-125` z istniejącej konfiguracji.
stages.0.objectives.2.text: Żądania controller dotyczące list ConfigMap lub Secret, odczytu oddzielnej
  chronionej konfiguracji lub kontrolnego Secret oraz żądanie observer odczytu trasy otrzymują HTTP `403`.
