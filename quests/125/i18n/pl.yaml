diagnostics.role: Rola station-reader może przyznawać więcej niż get dla ConfigMap route. Sprawdź każdą regułę dla nazwanego zasobu z podstawowej grupy API. [Przyczyna i kontrola](guides#guide=workload-access&section=q125-station-reader-role)
diagnostics.binding: W RoleBinding station-reader może brakować podmiotu lub może być wpisany inny podmiot. Sprawdź, czy każdy podmiot wskazuje controller w przestrzeni nazw ćwiczenia. [Przyczyna i kontrola](guides#guide=workload-access&section=q125-station-reader-subject)
diagnostics.allowed: Bieżącemu żądaniu controller do configmaps/route może brakować uprawnienia do tej nazwy lub poświadczenie może pochodzić z niegotowego wdrożenia. Sprawdź selektor, powiązanie i rollout, a następnie ponów sprawdzenie HTTP 200. [Przyczyna i kontrola](guides#guide=workload-access&section=q125-station-reader-live-allow)
diagnostics.value: Żądanie controller mogło nie zwrócić wartości trasy lub zwrócić inną wartość niż north-125. Po potwierdzeniu, że żądanie się powiodło, sprawdź bieżący ConfigMap. [Przyczyna i kontrola](guides#guide=workload-access&section=q125-station-reader-route-value)
diagnostics.denied_configmaps: Controller może mieć zbyt szerokie uprawnienia lub żądanie mogło nie dotrzeć do API z ważnym poświadczeniem. Sprawdź powiązania pod kątem nadmiarowego dostępu do zasobów, nazw lub czasowników i ponów oznaczone żądanie, oczekując HTTP 403. [Przyczyna i kontrola](guides#guide=workload-access&section=q125-station-reader-denials)
diagnostics.denied_configmaps_offlimits: Controller może mieć zbyt szerokie uprawnienia lub żądanie mogło nie dotrzeć do API z ważnym poświadczeniem. Sprawdź powiązania pod kątem nadmiarowego dostępu do zasobów, nazw lub czasowników i ponów oznaczone żądanie, oczekując HTTP 403. [Przyczyna i kontrola](guides#guide=workload-access&section=q125-station-reader-denials)
diagnostics.denied_secrets: Controller może mieć zbyt szerokie uprawnienia lub żądanie mogło nie dotrzeć do API z ważnym poświadczeniem. Sprawdź powiązania pod kątem nadmiarowego dostępu do zasobów, nazw lub czasowników i ponów oznaczone żądanie, oczekując HTTP 403. [Przyczyna i kontrola](guides#guide=workload-access&section=q125-station-reader-denials)
diagnostics.denied_secrets_control: Controller może mieć zbyt szerokie uprawnienia lub żądanie mogło nie dotrzeć do API z ważnym poświadczeniem. Sprawdź powiązania pod kątem nadmiarowego dostępu do zasobów, nazw lub czasowników i ponów oznaczone żądanie, oczekując HTTP 403. [Przyczyna i kontrola](guides#guide=workload-access&section=q125-station-reader-denials)
diagnostics.observer: Żądanie observer do configmaps/route mogło uzyskać dostęp lub zakończyć się przed autoryzacją. Sprawdź rollout i powiązania observer, a następnie ponów sprawdzenie HTTP 403. [Przyczyna i kontrola](guides#guide=workload-access&section=q125-station-reader-observer-denial)
diagnostics.authority_actors: Kontrola mogła nie odczytać bieżących Deploymentów lub ServiceAccountów. Sprawdź listę obciążeń i tożsamości w przestrzeni nazw ćwiczenia. [Przyczyna i kontrola](guides#guide=workload-access&section=q125-consumer-authority-actors)
diagnostics.authority_identity: Mógł się zmienić pierwotny UID, obraz worker lub konto kontrolne. Porównaj bieżące obciążenia i chronione ServiceAccounty z dostarczonym zapisem tożsamości. [Przyczyna i kontrola](guides#guide=workload-access&section=q125-consumer-authority-retained-identity)
diagnostics.authority_split: Konsumenci mogą współdzielić ServiceAccount lub używać zarezerwowanej tożsamości. Sprawdź, czy publisher i sampler mają różne, niezarezerwowane konta w bieżącym wdrożeniu. [Przyczyna i kontrola](guides#guide=workload-access&section=q125-consumer-authority-separate-accounts)
diagnostics.authority_projection: Domyślny token może wciąż być montowany, a jawnie projektowane poświadczenie może być niedostępne albo powiązane z innym kontem lub Podem. Sprawdź ustawienia automatycznego montowania i projekcję w bieżącym wdrożeniu. [Przyczyna i kontrola](guides#guide=workload-access&section=q125-consumer-authority-projected-credential)
diagnostics.authority_grants: Powiązania mogą być niedostępne, nie istnieć lub mieć szerszy zakres niż Role w przestrzeni nazw z get dla jednego przypisanego ConfigMap. Sprawdź pasujące podmioty reprezentujące konta i grupy oraz wskazane przez nie Role. [Przyczyna i kontrola](guides#guide=workload-access&section=q125-consumer-authority-named-grants)
diagnostics.authority_live: Ćwiczenie mogło nie odczytać bieżącego gotowego worker lub nie otrzymać prawidłowej odpowiedzi API. Sprawdź Deployment oraz jego bieżący ReplicaSet i Pod, a następnie ponów sprawdzenie żądań. [Przyczyna i kontrola](guides#guide=workload-access&section=q125-consumer-authority-live-observation)
diagnostics.authority_allowed: Dozwolone żądanie konsumenta mogło się nie powieść lub zwrócić niewłaściwy rekord. Sprawdź uprawnienie do nazwanego ConfigMap i bieżące dane konsumenta według dostarczonego kontraktu. [Przyczyna i kontrola](guides#guide=workload-access&section=q125-consumer-authority-allowed-record)
diagnostics.authority_denied: Niedozwolone żądanie mogło otrzymać status inny niż 403. Sprawdź uprawnienia do rekordów innych konsumentów, listowania i zasobów kontrolnych oraz błędy przed autoryzacją. [Przyczyna i kontrola](guides#guide=workload-access&section=q125-consumer-authority-denied-records)
diagnostics.probe_0_0: Kontrola polityk mogła się przerwać przed wskazaniem konkretnego warunku. Sprawdź dostarczony zapis tożsamości i dane API o obciążeniach, kontach i uprawnieniach. [Przyczyna i kontrola](guides#guide=workload-access&section=q125-consumer-authority-policy-observer)
diagnostics.probe_0_2: Kontrola żądań mogła się przerwać przed wskazaniem konkretnego warunku. Sprawdź dostarczony adres API, plik CA oraz gotowość bieżących Podów. [Przyczyna i kontrola](guides#guide=workload-access&section=q125-consumer-authority-request-observer)
