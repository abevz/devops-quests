title: Umowy RBAC o najniższych uprawnieniach
brief: 'controller powinien czytać tylko route ConfigMap. Jego Role pozwala również na wyświetlenie ConfigMaps i odczytanie
  Secrets, a binding przypadkowo zawiera tożsamość observer. Ogranicz station-reader do get na configmaps resourceNames [route]
  i powiąż tylko controller ServiceAccount w tym namespace. Obydwa Pody mają już krótkotrwałe projected API tokens. Przetestuj
  rzeczywiste żądania HTTPS przy użyciu zamrożonych CA i endpoint; nigdy nie drukuj tokenów. kontroler może wykonać wyłącznie
  get route; inne ConfigMaps, lists i Secrets muszą zwrócić 403, a observer musi utracić dostęp route.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `controller-sa.json`, `observer-sa.json`, `controller.json`,
  `observer.json`, `role.json`, `binding.json`, `route.json`, `offlimits.json`, `secret.json`, `api-ca.pem`, `api-endpoint`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie załadowanych obrazów
  i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: Tylko controller może get o nazwie route; prawdziwe żądania wskazują na odmowę dostępu lists,
  niepowiązane obiekty, Secrets i observer.


  Role `station-reader` musi zawierać dokładnie jedną regułę core API: `get` na `configmaps` z `resourceNames: [route]`. Jej
  RoleBinding musi mieć dokładnie jeden podmiot, ServiceAccount `controller` w namespace zatoki. Zweryfikowane przez CA żądanie
  controller do `configmaps/route` musi zwrócić 200 i `.data.route: north-125`; żądania controller do `configmaps`, `configmaps/offlimits`,
  `secrets` i `secrets/control` muszą każde zwrócić 403. Żądanie observer do `configmaps/route` też musi zwrócić 403. Kontrole
  obserwują te konkretne żądania i obiekty, a nie wszystkie możliwe uprawnienia ani autora poleceń.'
debrief: Zweryfikowano najniższe uprawnienia dla obu operacji i identities, w tym dla rzeczywistych negatywnych żądań API.
stages.0.brief: Dokładna Role i binding, odpowiedź controller dla route oraz wskazane odrzucone żądania odpowiadają opisowi.
stages.0.objectives.0.text: Dokładna Role i binding, odpowiedź controller dla route oraz wskazane odrzucone żądania odpowiadają
  opisowi.
hints.0.text: Powiązanie wybiera identities; a Role definiuje dozwolone operacje.
hints.1.text: get by resourceName jest węższy niż list, nawet dla tego samego rodzaju zasobu.
hints.2.text: Ogranicz reguły Role i subjects, a następnie przetestuj jawnie zabronione ścieżki.
phrases.0: Ograniczyłem dostęp do odczytu do jednego nazwanego obiektu.
phrases.1: Usunąłem niezamierzony temat RoleBinding.
phrases.2: Sprawdziłem odrzucone operacje przy użyciu rzeczywistego identities.
questions.0.points.0: Get adresuje jeden nazwany zasób; list odkrywa kolekcję.
questions.0.points.1: Autoryzacja sprawdza każdy verb osobno.
questions.0.prompt: Dlaczego get na jednym resourceName nie oznacza list?
questions.1.points.0: NIE; niewłaściwy principal nadal otrzymuje te uprawnienia.
questions.1.points.1: Przejrzyj razem identity i zakres działania.
questions.1.prompt: Czy poprawne reguły Role mogą zrekompensować niewłaściwy wiążący temat?
diagnostics.role: role/station-reader rules musi być równe get configmaps resourceNames [route].
diagnostics.binding: RoleBinding musi zawierać tylko ServiceAccount controller w namespace tej zatoki.
diagnostics.allowed: controller GET configmaps/route musi być równe HTTP 200.
diagnostics.value: configmaps/route data.route musi być równe north-125.
diagnostics.observer: observer GET configmaps/route musi zwrócić HTTP 403.
diagnostics.denied_configmaps: controller GET configmaps musi zwrócić HTTP 403.
diagnostics.denied_configmaps_offlimits: controller GET configmaps/offlimits musi zwrócić HTTP 403.
diagnostics.denied_secrets: controller GET secrets musi zwrócić HTTP 403.
diagnostics.denied_secrets_control: controller GET secrets/control musi zwrócić HTTP 403.
