title: Umowy RBAC o najniższych uprawnieniach
brief: |-
  Autoryzacja obciążeń nie odpowiada zadeklarowanym intencjom dostępu. Przywróć wąskie uprawnienia i bieżące odczyty odbiorców, zachowując dostęp sterujący.

  Pracuj na workstation w `~/quest` z podanymi danymi połączenia/wyniku: `authority-contract.json`, `api-ca.pem`, `api-endpoint`. Definicje obciążeń są dostępne w bieżących obiektach klastra.

  **Wymagania:**

  - Dostarczony Role w namespace przyznaje tylko odczyt istniejącej konfiguracji trasy po nazwie, a jego binding przyznaje ten dostęp tylko dostarczonej tożsamości controller. Zachowaj tożsamości i obrazy wszystkich podanych obciążeń oraz pierwotne sterujące ServiceAccount. Każdy zależny odbiorca ma osobną, unikalną dedykowaną tożsamość, wyłączone automatyczne montowanie poświadczeń. W przestrzeni nazw ćwiczenia każde pasujące powiązanie RoleBinding wskazuje Role ograniczoną do get dla przydzielonego ConfigMap.
  - GET API z weryfikacją CA i zamontowanym poświadczeniem controller zwraca HTTP `200` i trasę `north-125` z istniejącej konfiguracji.
  - Żądania controller dotyczące list ConfigMap lub Secret, odczytu oddzielnej chronionej konfiguracji lub kontrolnego Secret oraz żądanie observer odczytu trasy otrzymują HTTP `403`. Poświadczenie związane z bieżącym Podem każdego odbiorcy odczytuje własny rekord z HTTP 200 i zadeklarowaną wartością. Trasa, chronione dane, rekordy innego odbiorcy i listy zwracają HTTP 403; pierwotne tożsamości sterująca i obserwująca nie odczytują rekordów zależnych.

  Testy obserwują bieżące role namespace, tożsamości i podane żądania API, nie wszystkie możliwe prawa ani historię. Nie wyświetlaj tokenów.
debrief: Least privilege to efektywny graf tożsamości, grantów i bieżących poświadczeń. Propagacja osobnych principals
  przywraca zależności bez szerokiego wspólnego grantu.
stages.0.brief: Zachowaj poufność obu poświadczeń oraz odmowy dostępu.
hints.0.text: Prawa należą do tożsamości, nie etykiet obciążeń. Ograniczenie wspólnego grantu może przerwać zależne
  odczyty; zmiana szablonu nie zastępuje poświadczeń istniejącego Poda.
hints.1.text: |-
  Porównaj kontrakt intencji z bieżącymi ServiceAccount, RoleBinding i tożsamościami Podów. Dekoduj tylko metadane tożsamości, nigdy nie wyświetlaj poświadczeń bearer.

  ```sh
  cat authority-contract.json
  kubectl get deployment,serviceaccount,role,rolebinding -o yaml
  kubectl get pods -o yaml
  kubectl exec deployment/publisher -c worker -- cat /credential/token |
    python3 -I -c 'import base64,json,sys; token=sys.stdin.read().strip(); c=json.loads(base64.urlsafe_b64decode(token.split(".")[1]+"===")); print(json.dumps({"sub":c.get("sub"),"podUID":c.get("kubernetes.io",{}).get("pod",{}).get("uid")}))'

  ```
hints.2.text: |-
  Sprawdź każdy dozwolony odczyt po nazwie i każde zabronione żądanie zgodnie z intencjami poświadczeniem obciążenia. Odrzucaj wszystkie ciała zabronionych odpowiedzi.

  ```sh
  api=$(cat api-endpoint)
  for actor in controller observer publisher sampler; do
    token=$(kubectl exec "deployment/$actor" -c worker -- cat /credential/token)
    for path in configmaps/route configmaps/release-plan configmaps/sampling configmaps secrets secrets/control configmaps/offlimits; do
      printf '%s %s ' "$actor" "$path"
      printf 'header = "Authorization: Bearer %s"\n' "$token" |
        curl --config - --cacert api-ca.pem -sS -o /dev/null -w 'HTTP %{http_code}\n' "$api/api/v1/namespaces/$DQ_NAMESPACE/$path"
    done
    unset token
  done
  ```
phrases.0: Ograniczyłem dostęp do odczytu do jednego nazwanego obiektu.
phrases.1: Usunąłem niezamierzony temat RoleBinding.
phrases.2: Sprawdziłem odrzucone operacje przy użyciu rzeczywistego identities.
questions.0.points.0: Get adresuje jeden nazwany zasób; list odkrywa kolekcję.
questions.0.points.1: Autoryzacja sprawdza każdy verb osobno.
questions.0.prompt: Dlaczego get na jednym resourceName nie oznacza list?
questions.1.points.0: NIE; niewłaściwy principal nadal otrzymuje te uprawnienia.
questions.1.points.1: Przejrzyj razem identity i zakres działania.
questions.1.prompt: Czy poprawne reguły Role mogą zrekompensować niewłaściwy wiążący temat?
