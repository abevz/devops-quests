diagnostics.authority_actors: Podane obciążenia i obiekty tożsamości muszą być dostępne przez API bieżącego namespace.
diagnostics.authority_identity: Zmieniono pierwotne obciążenie, tożsamość sterującą lub obraz; zachowaj podane komponenty.
diagnostics.authority_split: Odbiorcy wymagają odrębnych dedykowanych ServiceAccount, różnych od zarezerwowanych
  tożsamości sterujących, default i workstation.
diagnostics.authority_projection: Używaj poświadczenia bieżącego własnego Poda dla zadeklarowanego ServiceAccount;
  automatyczne montowanie u odbiorców pozostaje wyłączone.
diagnostics.authority_grants: Efektywne powiązania namespace pozwalają tylko na get własnej konfiguracji po nazwie;
  wspólne lub dodatkowe granty naruszają intencję.
diagnostics.authority_live: Obserwuj bieżące własne gotowe Pody i związane tożsamości poświadczeń, nie kończące
  się Pody ani cudze tokeny.
diagnostics.authority_allowed: Każde bieżące poświadczenie odbiorcy musi uzyskać HTTP 200 i zadeklarowaną wartość
  własnego rekordu.
diagnostics.authority_denied: Żądania danych innego odbiorcy, trasy, chronionych danych i list poza intencją muszą
  zwracać HTTP 403.
diagnostics.probe_0_0: Bieżące dane nie potwierdzają tego warunku; sprawdź stan obiektów i kontrakt.
diagnostics.probe_0_2: Bieżące dane nie potwierdzają tego warunku; sprawdź stan obiektów i kontrakt.
