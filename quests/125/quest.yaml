id: 125
title: title
track: Kubernetes
difficulty: expert
brief: brief
stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    check: |-
      set -euo pipefail
      cd ~/quest
      failed=0
      check() { local label=$1 expression=$2 document=$3; if ! jq -e "$expression" <<<"$document" >/dev/null 2>&1; then printf '%s\n' "$label: ✗"; failed=1; fi; }
      umask 077
      role=$(timeout 2s kubectl get role station-reader -o json 2>/dev/null || true)
      check 'role/station-reader rules = named route get only [DQ:role]' 'def exact($items): type=="array" and unique==$items; .rules | type=="array" and length>0 and all(.[]; (.apiGroups|exact([""])) and (.resources|exact(["configmaps"])) and (.resourceNames|exact(["route"])) and (.verbs|exact(["get"])) and ((.nonResourceURLs//[])|length==0))' "$role"
      binding=$(timeout 2s kubectl get rolebinding station-reader -o json 2>/dev/null || true)
      if ! jq -e --arg ns "$DQ_NAMESPACE" '.subjects | type=="array" and length>0 and all(.[]; (.kind=="ServiceAccount" and .name=="controller" and (.namespace==null or .namespace=="" or .namespace==$ns) and (.apiGroup==null or .apiGroup=="")) or (.kind=="User" and .name==("system:serviceaccount:"+$ns+":controller") and (.apiGroup==null or .apiGroup=="" or .apiGroup=="rbac.authorization.k8s.io") and (.namespace==null or .namespace=="")))' <<<"$binding" >/dev/null 2>&1; then printf '%s\n' 'rolebinding/station-reader subjects = controller in bay namespace: ✗ [DQ:binding]'; failed=1; fi
      exit "$failed"
  - text: stages.0.objectives.1.text
    keep: true
    check: "set -euo pipefail\ncd ~/quest\nfailed=0\numask 077\nscratch=$(mktemp -d)\ntrap 'rm -rf \"$scratch\"\
      ' EXIT\napi=$(cat /run/dq/facts/0/api-endpoint 2>/dev/null || true)\nrequest() {\n  local credential=$1 path=$2\
      \ output=$3\n  if ! [[ \"$credential\" =~ ^[A-Za-z0-9._-]+$ ]] || ! test -n \"$api\"; then return 1; fi\n\
      \  printf 'header = \"Authorization: Bearer %s\"\\n' \"$credential\" | timeout 2s curl --config - --cacert\
      \ /run/dq/facts/0/api-ca.pem -sS -o \"$output\" -w '%{http_code}' \"$api/api/v1/namespaces/$DQ_NAMESPACE/$path\"\
      \ 2>/dev/null\n}\ncontroller=$(timeout 2s kubectl exec --pod-running-timeout=2s deployment/controller -- cat\
      \ /credential/token 2>/dev/null || true)\nstatus=$(request \"$controller\" configmaps/route \"$scratch/route\"\
      \ || true)\nif ! test \"$status\" = 200; then printf '%s\\n' 'controller GET configmaps/route status = 200:\
      \ ✗ [DQ:allowed]'; failed=1; fi\nif ! jq -e '.data.route==\"north-125\"' \"$scratch/route\" >/dev/null 2>&1;\
      \ then printf '%s\\n' 'controller route data = north-125: ✗ [DQ:value]'; failed=1; fi\nexit \"$failed\"\n"
  - text: stages.0.objectives.2.text
    check: "set -euo pipefail\ncd ~/quest\nfailed=0\numask 077\nscratch=$(mktemp -d)\ntrap 'rm -rf \"$scratch\"\
      ' EXIT\napi=$(cat /run/dq/facts/0/api-endpoint 2>/dev/null || true)\nrequest() {\n  local credential=$1 path=$2\
      \ output=$3\n  if ! [[ \"$credential\" =~ ^[A-Za-z0-9._-]+$ ]] || ! test -n \"$api\"; then return 1; fi\n\
      \  printf 'header = \"Authorization: Bearer %s\"\\n' \"$credential\" | timeout 2s curl --config - --cacert\
      \ /run/dq/facts/0/api-ca.pem -sS -o \"$output\" -w '%{http_code}' \"$api/api/v1/namespaces/$DQ_NAMESPACE/$path\"\
      \ 2>/dev/null\n}\ncontroller=$(timeout 2s kubectl exec --pod-running-timeout=2s deployment/controller -- cat\
      \ /credential/token 2>/dev/null || true)\nobserver=$(timeout 2s kubectl exec --pod-running-timeout=2s deployment/observer\
      \ -- cat /credential/token 2>/dev/null || true)\nfor path in configmaps configmaps/offlimits secrets secrets/control;\
      \ do\n  status=$(request \"$controller\" \"$path\" /dev/null || true)\n  if ! test \"$status\" = 403; then\
      \ printf '%s\\n' \"controller GET $path status = 403: ✗ [DQ:denied_${path//\\//_}]\"; failed=1; fi\ndone\n\
      status=$(request \"$observer\" configmaps/route /dev/null || true)\nif ! test \"$status\" = 403; then printf\
      \ '%s\\n' 'observer GET configmaps/route status = 403: ✗ [DQ:observer]'; failed=1; fi\nexit \"$failed\"\n"
