      \ deployment/controller -- cat /credential/token)\nobserver=$(kubectl exec deployment/observer --\
      \ cat /credential/token)\ntest \"$(curl --cacert /run/dq/facts/0/api-ca.pem -sS -o /tmp/allowed-route\
      \ -w '%{http_code}' -H \"Authorization: Bearer $controller\" \"$api/api/v1/namespaces/$DQ_NAMESPACE/configmaps/route\"\
      )\" = 200\njq -e '.data.route==\"north-125\"' /tmp/allowed-route >/dev/null\nfor path in configmaps\
      \ configmaps/offlimits secrets secrets/control; do\n test \"$(curl --cacert /run/dq/facts/0/api-ca.pem\
      \ -sS -o /dev/null -w '%{http_code}' -H \"Authorization: Bearer $controller\" \"$api/api/v1/namespaces/$DQ_NAMESPACE/$path\"\
      )\" = 403\ndone\ntest \"$(curl --cacert /run/dq/facts/0/api-ca.pem -sS -o /dev/null -w '%{http_code}'\
      \ -H \"Authorization: Bearer $observer\" \"$api/api/v1/namespaces/$DQ_NAMESPACE/configmaps/route\"\
      )\" = 403\nunset controller observer"
