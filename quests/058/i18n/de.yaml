title: Role Abhängigkeiten
brief: |-
  Das angeforderte Routenbanner ist auf den verwalteten Hosts nicht verfügbar.

  Arbeiten Sie auf der Workstation in `~/quest` mit den bereitgestellten Dateien:
  - `inventory.ini`, `ansible.cfg`, `roles/base/tasks/main.yml`, `roles/banner/tasks/main.yml`, `roles/banner/meta/main.yml`, `rollout.yml`.

  **Anforderungen:**
  - Datei auf jedem verwalteten Host (`app1`, `app2`, `app3`):
    - Pfad: `/srv/routes/current`.
    - Inhalt: `north-ready`.

  Die Prüfung beobachtet aktuelle Ergebnisse; sie belegt nicht die vollständige Ausführungshistorie.
stages.0.brief: Das angeforderte Banner muss auf jedem verwalteten Host vorhanden sein.
stages.0.objectives.0.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/routes/current`
  den Inhalt `north-ready`.
hints.0.text: Eine wiederverwendbare Rolle kann Voraussetzungen einer anderen Rolle benötigen.
hints.1.text: |-
  Lesen Sie die Fehlermeldung der Rolle banner, bevor Sie ignore_errors hinzufügen. Die Rolle base besitzt das Verzeichnis, das von der Bannerrolle benötigt wird.

  Prüfen Sie Inventory und das bereitgestellte Playbook auf der Workstation:

  ```sh
  cat roles/banner/meta/main.yml roles/banner/tasks/main.yml roles/base/tasks/main.yml
  ```
hints.2.text: |-
  Deklarieren Sie base in banner/meta/main.yml dependencies und überprüfen Sie die Remote-Datei.

  Prüfen Sie das Ergebnis in `~/quest` auf der Workstation:

  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'cat /srv/routes/current'` — Zeigt `north-ready` von `app1`, `app2`, `app3`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/routes/current'` — Zeigt den erforderlichen Eintrag `current` auf jedem Host.
debrief: Die Rolle banner ging davon aus, dass ein Verzeichnis bereits vorhanden war. Sie haben die Basisrolle
  dependency hinzugefügt und das verwaltete Ergebnis überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe das Ergebnis auf jedem verwalteten Host überprüft.
diagnostics.content_1: 'app1, `/srv/routes/current`: inhalt `north-ready`.'
diagnostics.content_2: 'app2, `/srv/routes/current`: inhalt `north-ready`.'
diagnostics.content_3: 'app3, `/srv/routes/current`: inhalt `north-ready`.'
