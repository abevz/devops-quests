title: Role Abhängigkeiten
brief: 'Das Flottenbanner ist nicht verfügbar, und die zusammengesetzte Rolle berücksichtigt ihre Aufrufer nicht.
  Stelle die Standardauslieferung und das im Vertrag beschriebene Verhalten des Rolleneinstiegs wieder her.


  Arbeite auf der Workstation in `~/quest` mit den bereitgestellten Dateien:

  - `inventory.ini`.

  - `ansible.cfg`.

  - `roles/`.

  - `rollout.yml`.

  - `role-contract.json`.


  **Anforderungen:**


  - Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/routes/current` den Inhalt `north-ready`.
  Der bereitgestellte Rolleneinstieg berücksichtigt außerdem die Aufrufereingaben aus `role-contract.json`, einschließlich
  mehrerer Aufrufe in einem Play, bewahrt andere Aufruferdaten und meldet bei einer zweiten Anwendung keine Änderungen.'
stages.0.brief: Das angeforderte Banner muss auf jedem verwalteten Host vorhanden sein.
stages.0.objectives.0.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/routes/current` den
  Inhalt `north-ready`. Der bereitgestellte Rolleneinstieg berücksichtigt außerdem die Aufrufereingaben aus `role-contract.json`,
  einschließlich mehrerer Aufrufe in einem Play, bewahrt andere Aufruferdaten und meldet bei einer zweiten Anwendung
  keine Änderungen.
hints.0.text: Eine zusammengesetzte Rolle muss Voraussetzungen für jeden Aufruferkontext erfüllen. Rolleneingaben
  und Abhängigkeitsausführung haben verschiedene Geltungsbereiche; ein erfolgreicher Standardaufruf belegt nicht,
  dass ein anderer parametrisierter Aufruf seine Ausgabe erstellen und konvergieren kann.
hints.1.text: 'Untersuche Einstiegsrolle, Voraussetzungen und Defaults und vergleiche ausgeführte Tasks für jeden
  Aufrufer. Ein fehlendes Elternverzeichnis kann auch aus einer übersprungenen Abhängigkeit statt einer fehlenden
  Deklaration entstehen.


  ```sh

  cd ~/quest

  cat role-contract.json

  cat roles/banner/meta/main.yml roles/base/meta/main.yml roles/banner/defaults/main.yml

  cat roles/base/tasks/main.yml roles/banner/tasks/main.yml

  ansible-playbook rollout.yml --list-tasks

  ```'
hints.2.text: 'Prüfe Standardauslieferung und wiederhole die deklarierten Aufruferfälle in einem isolierten lokalen
  Play ohne Rechteerhöhung. Vergleiche beide Ausgaben und bewahrte Daten und verlange bei erneuter Anwendung einen
  Recap ohne Änderungen.


  ```sh

  cd ~/quest

  ansible-playbook rollout.yml

  ansible fleet -m ansible.builtin.command -a ''cat /srv/routes/current''

  ansible-playbook rollout.yml --check --diff

  cat role-contract.json

  ```'
debrief: Die Standardauslieferung und aktuelle zusammengesetzte Rolle bestanden die deklarierten Aufruferfälle,
  bewahrten andere Daten und konvergierten bei Wiederholung. Dies belegt nicht die vollständige Bereitstellungsgeschichte.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe das Ergebnis auf jedem verwalteten Host überprüft.
diagnostics.content_1: 'app1, `/srv/routes/current`: inhalt `north-ready`.'
diagnostics.content_2: 'app2, `/srv/routes/current`: inhalt `north-ready`.'
diagnostics.content_3: 'app3, `/srv/routes/current`: inhalt `north-ready`.'
diagnostics.role_entrypoint: Der Rolleneinstieg konnte eine Aufruferausgabe nicht erstellen. Eine Abhängigkeit kann
  fehlen oder für einen anderen Aufruferkontext übersprungen werden.
diagnostics.role_inputs: Eine Aufruferausgabe enthält die angeforderte Route nicht. Eine Standardkonstante oder
  nicht weitergegebene Eingabe kann durch erfolgreiche Standardauslieferung verdeckt bleiben.
diagnostics.role_preservation: Andere Aufruferdaten wurden geändert oder verloren. Begrenze Schreibvorgänge auf
  die deklarierte Ausgabe und bewahre fremde Daten bei wiederholter Anwendung.
diagnostics.role_convergence: Die zweite Anwendung meldete keinen erfolgreichen unveränderten Zustand. Tasks können
  trotz gleicher Eingabe weiter Änderungen erzeugen oder nicht konvergieren.
diagnostics.role_observation: Die begrenzte Rollenwiederholung konnte nicht beobachtet werden. Prüfe verfügbare
  Aufruferausgaben und einen vollständigen Recap.
diagnostics.probe_0_0: Die begrenzte Rollenwiederholung konnte nicht beobachtet werden. Prüfe verfügbare Aufruferausgaben
  und einen vollständigen Recap.
diagnostics.role_budget: Die aktuelle Rollenwiederholung wurde innerhalb des begrenzten Beobachtungszeitraums nicht
  abgeschlossen. Lange Tasks oder ein ausgelasteter Controller können die Prüfung verzögern.
