title: Role Abhängigkeiten
brief: |-
  Das angeforderte Routenbanner ist auf den verwalteten Hosts nicht verfügbar.

  Arbeite auf der Workstation in `~/quest` mit `inventory.ini`, `ansible.cfg`, `roles/base/tasks/main.yml`, `roles/banner/tasks/main.yml`, `roles/banner/meta/main.yml`, `rollout.yml`.

  **Anforderungen:**
  - Datei auf jedem verwalteten Host (`app1`, `app2`, `app3`):
    - Pfad: `/srv/routes/current`.
    - Inhalt: `north-ready`.

  **Selbstprüfung vor Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'cat /srv/routes/current'` — Zeigt `north-ready` von `app1`, `app2`, `app3`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/routes/current'` — Zeigt den erforderlichen Eintrag `current` auf jedem Host.
stages.0.brief: Das angeforderte Banner muss auf jedem verwalteten Host vorhanden sein.
stages.0.objectives.0.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/routes/current` den
  Inhalt `north-ready`.
hints.0.text: Lesen Sie den Rollenfehler banner, bevor Sie ignore_errors. hinzufügen
hints.1.text: Die Rolle base besitzt das Verzeichnis, das von der Bannerrolle benötigt wird.
hints.2.text: Deklarieren Sie base in banner/meta/main.yml dependencies und überprüfen Sie die Remote-Datei.
debrief: Die Rolle banner ging davon aus, dass ein Verzeichnis bereits vorhanden war. Sie haben die Basisrolle dependency
  hinzugefügt und das verwaltete Ergebnis überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe das Ergebnis auf jedem verwalteten Host überprüft.
