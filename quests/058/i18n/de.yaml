title: Role Abhängigkeiten
brief: 'Das Flottenbanner ist nicht verfügbar, und die zusammengesetzte Rolle berücksichtigt ihre Aufrufer nicht.
  Stelle die Standardauslieferung und das im Vertrag beschriebene Verhalten des Rolleneinstiegs wieder her.


  Arbeite auf der Workstation in `~/quest` mit den bereitgestellten Dateien:

  - `inventory.ini`.

  - `ansible.cfg`.

  - `roles/`.

  - `rollout.yml`.

  - `role-contract.json`.


  **Anforderungen:**


  - Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/routes/current` den Inhalt `north-ready`.
  Der bereitgestellte Rolleneinstieg berücksichtigt außerdem die Aufrufereingaben aus `role-contract.json`, einschließlich
  mehrerer Aufrufe in einem Play, bewahrt andere Aufruferdaten und meldet bei einer zweiten Anwendung keine Änderungen.'
stages.0.brief: Das angeforderte Banner muss auf jedem verwalteten Host vorhanden sein.
stages.0.objectives.0.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/routes/current` den
  Inhalt `north-ready`. Der bereitgestellte Rolleneinstieg berücksichtigt außerdem die Aufrufereingaben aus `role-contract.json`,
  einschließlich mehrerer Aufrufe in einem Play, bewahrt andere Aufruferdaten und meldet bei einer zweiten Anwendung
  keine Änderungen.
hints.0.text: Eine zusammengesetzte Rolle muss Voraussetzungen für jeden Aufruferkontext erfüllen. Rolleneingaben
  und Abhängigkeitsausführung haben verschiedene Geltungsbereiche; ein erfolgreicher Standardaufruf belegt nicht,
  dass ein anderer parametrisierter Aufruf seine Ausgabe erstellen und konvergieren kann.
hints.1.text: 'Untersuche Einstiegsrolle, Voraussetzungen und Defaults und vergleiche ausgeführte Tasks für jeden
  Aufrufer. Ein fehlendes Elternverzeichnis kann auch aus einer übersprungenen Abhängigkeit statt einer fehlenden
  Deklaration entstehen.


  ```sh

  cd ~/quest

  cat role-contract.json

  cat roles/banner/meta/main.yml roles/base/meta/main.yml roles/banner/defaults/main.yml

  cat roles/base/tasks/main.yml roles/banner/tasks/main.yml

  ansible-playbook rollout.yml --list-tasks

  ```'
hints.2.text: |-
  Prüfe Standardauslieferung und wiederhole die deklarierten Aufruferfälle in einem isolierten lokalen Play ohne Rechteerhöhung. Vergleiche beide Ausgaben und bewahrte Daten und verlange bei erneuter Anwendung einen Recap ohne Änderungen.

  ```sh
  cd ~/quest
  ansible-playbook rollout.yml
  ansible fleet -m ansible.builtin.command -a 'cat /srv/routes/current'
  ansible-playbook rollout.yml --check --diff
  cat role-contract.json
  ```

  Führe zur Konvergenzprüfung dasselbe isolierte lokale Play erneut aus und bestätige für localhost changed=0, failed=0 und unreachable=0.
debrief: Die Standardauslieferung und aktuelle zusammengesetzte Rolle bestanden die deklarierten Aufruferfälle,
  bewahrten andere Daten und konvergierten bei Wiederholung. Dies belegt nicht die vollständige Bereitstellungsgeschichte.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe das Ergebnis auf jedem verwalteten Host überprüft.
diagnostics.role_entrypoint: Die wiederholte Rollenausführung schlug fehl; banner kann die Abhängigkeit base auslassen, das falsche Verzeichnis erzeugen, eine wiederholte Abhängigkeit unterdrücken oder beim lokalen unprivilegierten Aufruf scheitern. [Ursache und Prüfung](guides#guide=ansible-12&section=role-repeated-caller-entry)
diagnostics.role_inputs: Eine Aufrufausgabe fehlt oder enthält die falsche Route; fest eingetragene /srv/routes oder north-ready beziehungsweise eine beim zweiten Aufruf übersprungene Abhängigkeit können install_root und banner_route ignorieren. [Ursache und Prüfung](guides#guide=ansible-12&section=role-caller-specific-output)
diagnostics.role_preservation: Die erhaltene Kontrolldatei oder vorhandene Daten im Aufrufverzeichnis wurden geändert oder entfernt; großflächiges Aufräumen oder Ersetzen des gesamten Verzeichnisses kann Daten außerhalb der rolleneigenen Datei current löschen. [Ursache und Prüfung](guides#guide=ansible-12&section=role-preserve-caller-data)
diagnostics.role_convergence: Der zweite Durchlauf meldete localhost nicht mit changed, failed und unreachable gleich null; bedingungsloses Neuschreiben, nicht idempotente Tasks oder fehlgeschlagene Host-Ausführung können Konvergenz verhindern. [Ursache und Prüfung](guides#guide=ansible-12&section=role-second-run-convergence)
diagnostics.role_budget: Der Rollenprozess überschritt die verbleibende Frist; langsame Tasks oder Warten auf unerreichbare externe Dienste können das Budget der zwei Durchläufe erschöpfen. [Ursache und Prüfung](guides#guide=ansible-12&section=role-bounded-replay)
diagnostics.role_observation: Die Rollenausführung konnte nicht beobachtet werden; fehlender geschützter Vertrag oder Aufrufverzeichnisse, unlesbare Ausgabe, fehlerhafter recap, Werkzeugfehler oder ein erschöpftes Beobachtungsbudget verhindern die Auswertung. [Ursache und Prüfung](guides#guide=ansible-12&section=role-replay-observation)
diagnostics.probe_0_0: Die gemeinsame Host-/Rollenprüfung endete ohne Detailmarker; ein fehlendes Arbeitsverzeichnis, Python oder Modul beziehungsweise eine unterbrochene zeitbegrenzte SSH-Gruppe kann die Rollenausführung verhindern. [Ursache und Prüfung](guides#guide=ansible-12&section=role-probe-startup)
diagnostics.content_1: app1 liefert nicht north-ready in /srv/routes/current; eine fehlende Abhängigkeit base oder fehlgeschlagene Bereitstellung kann die Standardroute fehlen lassen, und SSH-/Namespace-Fehler verhindern ebenfalls die Beobachtung. [Ursache und Prüfung](guides#guide=ansible-12&section=role-default-fleet-result)
diagnostics.content_2: app2 liefert nicht north-ready in /srv/routes/current; eine fehlende Abhängigkeit base oder fehlgeschlagene Bereitstellung kann die Standardroute fehlen lassen, und SSH-/Namespace-Fehler verhindern ebenfalls die Beobachtung. [Ursache und Prüfung](guides#guide=ansible-12&section=role-default-fleet-result)
diagnostics.content_3: app3 liefert nicht north-ready in /srv/routes/current; eine fehlende Abhängigkeit base oder fehlgeschlagene Bereitstellung kann die Standardroute fehlen lassen, und SSH-/Namespace-Fehler verhindern ebenfalls die Beobachtung. [Ursache und Prüfung](guides#guide=ansible-12&section=role-default-fleet-result)
