title: Role Abhängigkeiten
brief: 'Sie sind dem Betrieb SignalRail beigetreten. Das Live-Banner wurde gestartet, bevor sein Verzeichnis
  existierte. Arbeiten Sie in ~/quest.. Bewahren Sie alle Änderungen in diesem Trainingsbereich auf.


  Beginnen Sie mit rollout.yml und roles/*/tasks/main.yml.


  Eingänge in `~/quest`: `inventory.ini`, `ansible.cfg`, `roles/base/tasks/main.yml`, `roles/banner/tasks/main.yml`,
  `roles/banner/meta/main.yml`, `rollout.yml`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur die bereitgestellten Dateien,
  vorinstallierten Bilder und privaten Dienste. Alle Änderungen müssen innerhalb dieser Bucht bleiben.


  Erste Erfolgskriterien: Alle drei Hosts haben /srv/routes/current mit north-ready.'
stages.0.brief: 'Die Rolle banner benötigt zunächst base, um /srv/routes zu erstellen. Verwenden Sie eine
  Rolle dependency.


  Erfolgskriterien: Alle drei Hosts verfügen über /srv/routes/current mit north-ready.'
stages.0.objectives.0.text: Alle drei Hosts verfügen über /srv/routes/current mit north-ready.
hints.0.text: Lesen Sie den Rollenfehler banner, bevor Sie ignore_errors. hinzufügen
hints.1.text: Die Rolle base besitzt das Verzeichnis, das von der Bannerrolle benötigt wird.
hints.2.text: Deklarieren Sie base in banner/meta/main.yml dependencies und überprüfen Sie die Remote-Datei.
debrief: Die Rolle banner ging davon aus, dass ein Verzeichnis bereits vorhanden war. Sie haben die Basisrolle
  dependency hinzugefügt und das verwaltete Ergebnis überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe das Ergebnis auf jedem verwalteten Host überprüft.
