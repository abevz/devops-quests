title: Zależności Role
brief: 'Baner floty jest niedostępny, a złożona rola nie respektuje kontekstów wywołania. Przywróć domyślne dostarczanie
  i zachowanie punktu wejścia zadeklarowane w kontrakcie.


  Pracuj na workstation w `~/quest` z dostarczonymi plikami:

  - `inventory.ini`.

  - `ansible.cfg`.

  - `roles/`.

  - `rollout.yml`.

  - `role-contract.json`.


  **Wymagania:**


  - Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/routes/current` zawiera `north-ready`. Dostarczony
  punkt wejścia roli uwzględnia również wejścia z `role-contract.json`, w tym wiele wywołań w jednym play, zachowuje
  inne dane wywołującego i nie zgłasza zmian przy drugim zastosowaniu.'
stages.0.brief: Wymagany baner musi istnieć na każdym zarządzanym hoście.
stages.0.objectives.0.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/routes/current` zawiera
  `north-ready`. Dostarczony punkt wejścia roli uwzględnia również wejścia z `role-contract.json`, w tym wiele wywołań
  w jednym play, zachowuje inne dane wywołującego i nie zgłasza zmian przy drugim zastosowaniu.
hints.0.text: Złożona rola musi spełniać wymagania każdego kontekstu wywołania. Wejścia roli i wykonanie zależności
  mają różne zakresy; poprawne wywołanie domyślne nie dowodzi, że inne wywołanie z parametrami utworzy swój wynik
  i osiągnie zbieżność.
hints.1.text: 'Zbadaj rolę wejściową, jej wymagania i defaults oraz porównaj zadania wykonywane dla każdego wywołania.
  Brak katalogu nadrzędnego może wynikać także z pominiętej zależności, nie tylko z brakującej deklaracji.


  ```sh

  cd ~/quest

  cat role-contract.json

  cat roles/banner/meta/main.yml roles/base/meta/main.yml roles/banner/defaults/main.yml

  cat roles/base/tasks/main.yml roles/banner/tasks/main.yml

  ansible-playbook rollout.yml --list-tasks

  ```'
hints.2.text: 'Sprawdź domyślne dostarczanie i odtwórz zadeklarowane przypadki w odizolowanym lokalnym play bez
  podnoszenia uprawnień. Porównaj oba wyniki i zachowane dane, powtórz zastosowanie i wymagaj podsumowania bez zmian.


  ```sh

  cd ~/quest

  ansible-playbook rollout.yml

  ansible fleet -m ansible.builtin.command -a ''cat /srv/routes/current''

  ansible-playbook rollout.yml --check --diff

  cat role-contract.json

  ```'
debrief: Domyślne dostarczanie i bieżąca złożona rola przeszły zadeklarowane przypadki, zachowały inne dane i osiągnęły
  zbieżność przy powtórzeniu. Nie dowodzi to pełnej historii wdrożenia.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem wynik na każdym zarządzanym hoście.
diagnostics.content_1: 'app1, `/srv/routes/current`: treść `north-ready`.'
diagnostics.content_2: 'app2, `/srv/routes/current`: treść `north-ready`.'
diagnostics.content_3: 'app3, `/srv/routes/current`: treść `north-ready`.'
diagnostics.role_entrypoint: Punkt wejścia roli nie mógł utworzyć wyniku wywołania. Zależność może być nieobecna
  lub pominięta dla innego kontekstu.
diagnostics.role_inputs: Wynik nie zawiera żądanej trasy. Stała domyślna lub nieprzekazane wejście może pozostać
  ukryte za poprawnym domyślnym dostarczaniem.
diagnostics.role_preservation: Inne dane wywołującego zmieniono lub utracono. Ogranicz zapisy do zadeklarowanego
  wyniku i zachowuj pozostałe dane przy powtarzaniu.
diagnostics.role_convergence: Drugie zastosowanie nie zgłosiło poprawnego wyniku bez zmian. Zadania mogą nadal zmieniać
  te same wejścia lub nie osiągać zbieżności.
diagnostics.role_observation: Nie udało się zaobserwować ograniczonego odtworzenia roli. Sprawdź dostępność wyników
  wywołań i pełnego podsumowania.
diagnostics.probe_0_0: Nie udało się zaobserwować ograniczonego odtworzenia roli. Sprawdź dostępność wyników wywołań
  i pełnego podsumowania.
diagnostics.role_budget: Bieżące odtworzenie roli nie zakończyło się w ograniczonym czasie obserwacji. Długie zadania
  lub zajęty kontroler mogą opóźniać weryfikację.
