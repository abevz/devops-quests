title: Zależności Role
brief: 'Baner floty jest niedostępny, a złożona rola nie respektuje kontekstów wywołania. Przywróć domyślne dostarczanie
  i zachowanie punktu wejścia zadeklarowane w kontrakcie.


  Pracuj na workstation w `~/quest` z dostarczonymi plikami:

  - `inventory.ini`.

  - `ansible.cfg`.

  - `roles/`.

  - `rollout.yml`.

  - `role-contract.json`.


  **Wymagania:**


  - Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/routes/current` zawiera `north-ready`. Dostarczony
  punkt wejścia roli uwzględnia również wejścia z `role-contract.json`, w tym wiele wywołań w jednym play, zachowuje
  inne dane wywołującego i nie zgłasza zmian przy drugim zastosowaniu.'
stages.0.brief: Wymagany baner musi istnieć na każdym zarządzanym hoście.
stages.0.objectives.0.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/routes/current` zawiera
  `north-ready`. Dostarczony punkt wejścia roli uwzględnia również wejścia z `role-contract.json`, w tym wiele wywołań
  w jednym play, zachowuje inne dane wywołującego i nie zgłasza zmian przy drugim zastosowaniu.
hints.0.text: Złożona rola musi spełniać wymagania każdego kontekstu wywołania. Wejścia roli i wykonanie zależności
  mają różne zakresy; poprawne wywołanie domyślne nie dowodzi, że inne wywołanie z parametrami utworzy swój wynik
  i osiągnie zbieżność.
hints.1.text: 'Zbadaj rolę wejściową, jej wymagania i defaults oraz porównaj zadania wykonywane dla każdego wywołania.
  Brak katalogu nadrzędnego może wynikać także z pominiętej zależności, nie tylko z brakującej deklaracji.


  ```sh

  cd ~/quest

  cat role-contract.json

  cat roles/banner/meta/main.yml roles/base/meta/main.yml roles/banner/defaults/main.yml

  cat roles/base/tasks/main.yml roles/banner/tasks/main.yml

  ansible-playbook rollout.yml --list-tasks

  ```'
hints.2.text: 'Sprawdź domyślne dostarczanie i odtwórz zadeklarowane przypadki w odizolowanym lokalnym play bez
  podnoszenia uprawnień. Porównaj oba wyniki i zachowane dane, powtórz zastosowanie i wymagaj podsumowania bez zmian.


  ```sh

  cd ~/quest

  ansible-playbook rollout.yml

  ansible fleet -m ansible.builtin.command -a ''cat /srv/routes/current''

  ansible-playbook rollout.yml --check --diff

  cat role-contract.json

  ```'
debrief: Domyślne dostarczanie i bieżąca złożona rola przeszły zadeklarowane przypadki, zachowały inne dane i osiągnęły
  zbieżność przy powtórzeniu. Nie dowodzi to pełnej historii wdrożenia.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem wynik na każdym zarządzanym hoście.
diagnostics.role_entrypoint: Ponowne wykonanie roli zakończyło się błędem; banner może nie deklarować zależności base, tworzyć błędny katalog, pomijać powtórzoną zależność lub nie działać dla lokalnego nieuprzywilejowanego wywołania. [Przyczyna i kontrola](guides#guide=ansible-12&section=role-repeated-caller-entry)
diagnostics.role_inputs: Brakuje wyniku wywołania lub zawiera inną trasę; wpisane na stałe /srv/routes lub north-ready albo pominięta zależność drugiego wywołania mogą ignorować install_root i banner_route. [Przyczyna i kontrola](guides#guide=ansible-12&section=role-caller-specific-output)
diagnostics.role_preservation: Plik kontrolny lub istniejące dane w katalogu wywołania zmieniły się lub zniknęły; szerokie czyszczenie lub wymiana całego katalogu może usunąć dane poza plikiem current należącym do roli. [Przyczyna i kontrola](guides#guide=ansible-12&section=role-preserve-caller-data)
diagnostics.role_convergence: Drugie wykonanie nie zgłosiło localhost z zerowymi changed, failed i unreachable; bezwarunkowe zapisy, nieidempotentne zadania lub błędy wykonania hosta mogą uniemożliwiać zbieżność. [Przyczyna i kontrola](guides#guide=ansible-12&section=role-second-run-convergence)
diagnostics.role_budget: Proces wykonania roli przekroczył pozostały czas; wolne zadania lub oczekiwanie na niedostępne usługi zewnętrzne mogą wyczerpać limit dwóch wykonań. [Przyczyna i kontrola](guides#guide=ansible-12&section=role-bounded-replay)
diagnostics.role_observation: Nie dało się obserwować roli; brak chronionego kontraktu lub katalogów wywołań, nieczytelny wynik, błędny recap, błędy narzędzi lub wyczerpany czas blokują ocenę. [Przyczyna i kontrola](guides#guide=ansible-12&section=role-replay-observation)
diagnostics.probe_0_0: Łączna kontrola hostów i roli zatrzymała się bez szczegółowego markera; brak katalogu roboczego, Python lub modułu albo przerwana ograniczona czasowo grupa SSH może blokować wykonanie roli. [Przyczyna i kontrola](guides#guide=ansible-12&section=role-probe-startup)
diagnostics.content_1: app1 nie udostępnia north-ready w /srv/routes/current; brak zależności base lub błąd dostarczenia może pozostawić brak domyślnej trasy, a błędy SSH lub namespace też blokują obserwację. [Przyczyna i kontrola](guides#guide=ansible-12&section=role-default-fleet-result)
