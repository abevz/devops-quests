title: Zależności Role
brief: 'Dołączyłeś do operacji SignalRail. Aktywny baner został uruchomiony, zanim istniał jego katalog.
  Pracuj w ~/quest. Wszystkie zmiany przechowuj w tej komorze szkoleniowej.


  Zacznij od rollout.yml i roles/*/tasks/main.yml.


  Wejścia w `~/quest`: `inventory.ini`, `ansible.cfg`, `roles/base/tasks/main.yml`, `roles/banner/tasks/main.yml`,
  `roles/banner/meta/main.yml`, `rollout.yml`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Wszystkie zmiany muszą pozostać w tej zatoce.


  Początkowe kryteria sukcesu: wszystkie trzy hosty mają /srv/routes/current zawierający north-ready.'
stages.0.brief: 'Rola banner wymaga bazy, aby najpierw utworzyć /srv/routes. Użyj roli dependency.


  Kryteria sukcesu: Wszystkie trzy hosty mają /srv/routes/current zawierający north-ready.'
stages.0.objectives.0.text: Wszystkie trzy hosty mają /srv/routes/current zawierający north-ready.
hints.0.text: Przeczytaj błąd roli banner przed dodaniem ignore_errors.
hints.1.text: Rola base jest właścicielem katalogu wymaganego przez rolę banera.
hints.2.text: Zadeklaruj base w banner/meta/main.yml dependencies i zweryfikuj plik zdalny.
debrief: Rola banner zakłada, że ​​katalog już istnieje. Dodałeś jego rolę base dependency i zweryfikowałeś
  zarządzany wynik.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem wynik na każdym zarządzanym hoście.
