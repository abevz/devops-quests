title: Zależności Role
brief: |-
  Wymagany baner trasy jest niedostępny na zarządzanych hostach.

  Pracuj na workstation w `~/quest` z plikami `inventory.ini`, `ansible.cfg`, `roles/base/tasks/main.yml`, `roles/banner/tasks/main.yml`, `roles/banner/meta/main.yml`, `rollout.yml`.

  **Wymagania:**
  - Plik na każdym zarządzanym hoście (`app1`, `app2`, `app3`):
    - Ścieżka: `/srv/routes/current`.
    - Treść: `north-ready`.

  **Sprawdź przed Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'cat /srv/routes/current'` — Pokazuje `north-ready` z `app1`, `app2`, `app3`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/routes/current'` — Pokazuje wymagany wpis `current` na każdym hoście.
stages.0.brief: Wymagany baner musi istnieć na każdym zarządzanym hoście.
stages.0.objectives.0.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/routes/current` zawiera
  `north-ready`.
hints.0.text: Przeczytaj błąd roli banner przed dodaniem ignore_errors.
hints.1.text: Rola base jest właścicielem katalogu wymaganego przez rolę banera.
hints.2.text: Zadeklaruj base w banner/meta/main.yml dependencies i zweryfikuj plik zdalny.
debrief: Rola banner zakłada, że ​​katalog już istnieje. Dodałeś jego rolę base dependency i zweryfikowałeś zarządzany
  wynik.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem wynik na każdym zarządzanym hoście.
diagnostics.content_1: 'app1, `/srv/routes/current`: treść `north-ready`.'
diagnostics.content_2: 'app2, `/srv/routes/current`: treść `north-ready`.'
diagnostics.content_3: 'app3, `/srv/routes/current`: treść `north-ready`.'
