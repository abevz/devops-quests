title: Зависимости ролей
brief: |-
  Требуемый баннер маршрута недоступен на управляемых хостах.

  Работайте на workstation в `~/quest` с файлами `inventory.ini`, `ansible.cfg`, `roles/base/tasks/main.yml`, `roles/banner/tasks/main.yml`, `roles/banner/meta/main.yml`, `rollout.yml`.

  **Требования:**
  - Файл на каждом управляемом хосте (`app1`, `app2`, `app3`):
    - Путь: `/srv/routes/current`.
    - Содержимое: `north-ready`.

  **Самопроверка перед Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'cat /srv/routes/current'` — Показывает `north-ready` от `app1`, `app2`, `app3`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/routes/current'` — Показывает требуемую запись `current` на каждом хосте.
stages.0.brief: Требуемый баннер должен существовать на каждом управляемом хосте.
stages.0.objectives.0.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/routes/current` содержит
  `north-ready`.
hints.0.text: Прочитайте ошибку роли banner, не добавляя ignore_errors.
hints.1.text: Нужным каталогом управляет роль base.
hints.2.text: Укажите base в dependencies файла banner/meta/main.yml и проверьте удалённый файл.
debrief: Роль banner ожидала существующий каталог. Вы добавили dependency на base и проверили фактический результат.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я проверил результат на каждом управляемом хосте.
