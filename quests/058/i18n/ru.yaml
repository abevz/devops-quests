title: Зависимости ролей
brief: 'Баннер флота недоступен, а составная роль не учитывает вызывающие контексты. Восстановите обычную доставку
  и поведение точки входа роли, объявленное в контракте.


  Работайте на workstation в `~/quest` с предоставленными файлами:

  - `inventory.ini`.

  - `ansible.cfg`.

  - `roles/`.

  - `rollout.yml`.

  - `role-contract.json`.


  **Требования:**


  - На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/routes/current` содержит `north-ready`. Предоставленная
  точка входа роли также учитывает входы вызывающих контекстов из `role-contract.json`, включая несколько вызовов
  в одном play, сохраняет прочие данные и не сообщает изменений при повторном применении.'
stages.0.brief: Требуемый баннер должен существовать на каждом управляемом хосте.
stages.0.objectives.0.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/routes/current` содержит
  `north-ready`. Предоставленная точка входа роли также учитывает входы вызывающих контекстов из `role-contract.json`,
  включая несколько вызовов в одном play, сохраняет прочие данные и не сообщает изменений при повторном применении.
hints.0.text: Составная роль должна обеспечивать предпосылки для каждого вызывающего контекста. Входы роли и выполнение
  зависимостей имеют разные области действия; один успешный вызов по умолчанию не доказывает, что другой вызов с
  параметрами создаст свой результат и сойдётся.
hints.1.text: 'Изучите входную роль, её предпосылки и defaults; сравните выполнение задач для каждого вызова. Отсутствующий
  родительский каталог может быть следствием пропущенной зависимости, а не только отсутствующей декларации.


  ```sh

  cd ~/quest

  cat role-contract.json

  cat roles/banner/meta/main.yml roles/base/meta/main.yml roles/banner/defaults/main.yml

  cat roles/base/tasks/main.yml roles/banner/tasks/main.yml

  ansible-playbook rollout.yml --list-tasks

  ```'
hints.2.text: |-
  Проверьте обычную доставку и воспроизведите объявленные вызовы в изолированном локальном play без повышения привилегий. Сравните оба результата и сохранённые данные, затем повторите применение и требуйте recap без изменений.

  ```sh
  cd ~/quest
  ansible-playbook rollout.yml
  ansible fleet -m ansible.builtin.command -a 'cat /srv/routes/current'
  ansible-playbook rollout.yml --check --diff
  cat role-contract.json
  ```

  Для проверки сходимости повторите тот же изолированный локальный play и подтвердите, что у localhost changed=0, failed=0 и unreachable=0.
debrief: Обычная доставка флоту и текущая составная роль прошли объявленные случаи вызова, сохранили прочие данные
  и сошлись при повторном применении. Эти наблюдения не доказывают полную историю развёртывания.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я проверил результат на каждом управляемом хосте.
diagnostics.role_entrypoint: 'Повторное выполнение роли завершилось ошибкой: у banner может отсутствовать зависимость base, создаваться неверный каталог, подавляться повторная зависимость или возникать сбой у локального пользователя без привилегий. [Причина и проверка](guides#guide=ansible-12&section=role-repeated-caller-entry)'
diagnostics.role_inputs: 'Выход вызывающего кода отсутствует или содержит другой маршрут: захардкоженные /srv/routes или north-ready либо пропущенная зависимость второго вызова могут игнорировать install_root и banner_route. [Причина и проверка](guides#guide=ansible-12&section=role-caller-specific-output)'
diagnostics.role_preservation: 'Контрольный файл или существующие данные внутри каталога вызывающего кода изменены либо исчезли: широкая очистка или замена всего каталога может удалить данные помимо принадлежащего роли current. [Причина и проверка](guides#guide=ansible-12&section=role-preserve-caller-data)'
diagnostics.role_convergence: 'Второй запуск не сообщил localhost с нулевыми changed, failed и unreachable: безусловная перезапись, неидемпотентные задачи или сбой выполнения на хосте могут мешать сходимости. [Причина и проверка](guides#guide=ansible-12&section=role-second-run-convergence)'
diagnostics.role_budget: 'Процесс повторного выполнения роли превысил оставшееся время: медленные задачи или ожидание недоступных внешних сервисов могут исчерпать лимит проверки двух запусков. [Причина и проверка](guides#guide=ansible-12&section=role-bounded-replay)'
diagnostics.role_observation: 'Не удалось наблюдать выполнение роли: отсутствующий защищённый контракт или каталоги вызовов, нечитаемый результат, некорректный recap, ошибки инструментов или исчерпанное время мешают оценке. [Причина и проверка](guides#guide=ansible-12&section=role-replay-observation)'
diagnostics.probe_0_0: 'Общая проверка хостов и роли остановилась без подробного маркера: отсутствующий рабочий каталог, Python или модуль либо прерванная SSH-группа с лимитом времени могут мешать запуску роли. [Причина и проверка](guides#guide=ansible-12&section=role-probe-startup)'
diagnostics.content_1: 'app1 не предоставляет north-ready в /srv/routes/current: отсутствующая зависимость base или сбой доставки могут оставить маршрут по умолчанию отсутствующим; ошибки SSH или namespace также мешают наблюдению. [Причина и проверка](guides#guide=ansible-12&section=role-default-fleet-result)'
diagnostics.content_2: 'app2 не предоставляет north-ready в /srv/routes/current: отсутствующая зависимость base или сбой доставки могут оставить маршрут по умолчанию отсутствующим; ошибки SSH или namespace также мешают наблюдению. [Причина и проверка](guides#guide=ansible-12&section=role-default-fleet-result)'
diagnostics.content_3: 'app3 не предоставляет north-ready в /srv/routes/current: отсутствующая зависимость base или сбой доставки могут оставить маршрут по умолчанию отсутствующим; ошибки SSH или namespace также мешают наблюдению. [Причина и проверка](guides#guide=ansible-12&section=role-default-fleet-result)'
