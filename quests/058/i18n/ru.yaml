title: Зависимости ролей
brief: 'Вы в команде эксплуатации SignalRail. Сервис стартовал до создания каталога. Работайте в ~/quest.
  Все изменения — только в этой песочнице.


  Начните с rollout.yml и roles/*/tasks/main.yml.


  Входные файлы в `~/quest`: `inventory.ini`, `ansible.cfg`, `roles/base/tasks/main.yml`, `roles/banner/tasks/main.yml`,
  `roles/banner/meta/main.yml`, `rollout.yml`.


  В песочнице нет интернета и внешнего DNS. Используйте только выданные файлы, предварительно загруженные
  образы и приватные сервисы. Все изменения — только в этой песочнице.


  Цели первого этапа: На всех трёх узлах /srv/routes/current содержит north-ready.'
stages.0.brief: 'Роли banner нужна base: сначала создать /srv/routes. Используйте dependency.


  Результат проверки: На всех трёх узлах /srv/routes/current содержит north-ready.'
stages.0.objectives.0.text: На всех трёх узлах /srv/routes/current содержит north-ready.
hints.0.text: Прочитайте ошибку роли banner, не добавляя ignore_errors.
hints.1.text: Нужным каталогом управляет роль base.
hints.2.text: Укажите base в dependencies файла banner/meta/main.yml и проверьте удалённый файл.
debrief: Роль banner ожидала существующий каталог. Вы добавили dependency на base и проверили фактический
  результат.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я проверил результат на каждом управляемом хосте.
