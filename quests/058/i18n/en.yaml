title: Role dependencies
brief: 'The fleet banner is unavailable and the composed role does not honor its callers. Restore default delivery
  and the role entry point behavior declared in the supplied contract.


  Work on the workstation in `~/quest` with the supplied files:

  - `inventory.ini`.

  - `ansible.cfg`.

  - `roles/`.

  - `rollout.yml`.

  - `role-contract.json`.


  **Requirements:**


  - On every managed host (`app1`, `app2`, `app3`), `/srv/routes/current` contains `north-ready`. The supplied role
  entry point also honors the caller inputs in `role-contract.json`, including multiple calls in one play, preserves
  other caller data, and reports no changes on a second application.'
stages.0.brief: The requested banner must exist on every managed host.
stages.0.objectives.0.text: On every managed host (`app1`, `app2`, `app3`), `/srv/routes/current` contains `north-ready`.
  The supplied role entry point also honors the caller inputs in `role-contract.json`, including multiple calls
  in one play, preserves other caller data, and reports no changes on a second application.
hints.0.text: A composed role must satisfy prerequisites for each caller context. Role inputs and dependency execution
  have different scopes; one successful default invocation does not establish that another parameterized call can
  construct its output or converge.
hints.1.text: 'Inspect the entry role, its prerequisites and defaults, and compare which tasks run for each caller.
  An absent parent directory may come from a skipped dependency as well as a missing declaration.


  ```sh

  cd ~/quest

  cat role-contract.json

  cat roles/banner/meta/main.yml roles/base/meta/main.yml roles/banner/defaults/main.yml

  cat roles/base/tasks/main.yml roles/banner/tasks/main.yml

  ansible-playbook rollout.yml --list-tasks

  ```'
hints.2.text: 'Check default delivery and replay the declared caller cases in an isolated local play without privilege
  escalation. Compare both outputs and preserved data, then repeat the same application and require a recap without
  changes.


  ```sh

  cd ~/quest

  ansible-playbook rollout.yml

  ansible fleet -m ansible.builtin.command -a ''cat /srv/routes/current''

  ansible-playbook rollout.yml --check --diff

  cat role-contract.json

  ```'
debrief: Default fleet delivery and the current composed role passed the declared caller cases, preserved other
  data and converged on a repeated application. These observations do not prove the full deployment history.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I verified the result on every managed host.
diagnostics.content_1: 'app1, `/srv/routes/current`: content `north-ready`.'
diagnostics.content_2: 'app2, `/srv/routes/current`: content `north-ready`.'
diagnostics.content_3: 'app3, `/srv/routes/current`: content `north-ready`.'
diagnostics.role_entrypoint: The role entry point could not produce a caller output. A dependency may be missing
  or skipped for a different caller context.
diagnostics.role_inputs: A caller output does not contain its requested route. A default literal or an input not
  forwarded through the composition can hide behind successful default delivery.
diagnostics.role_preservation: Other caller data was changed or lost. Limit role writes to the declared output and
  retain unrelated data across repeated applications.
diagnostics.role_convergence: The second application did not report a successful result without changes. Tasks may
  continue to change an unchanged input or fail to converge.
diagnostics.role_observation: The bounded role replay could not be observed. Check that caller outputs and a complete
  recap are available.
diagnostics.probe_0_0: The bounded role replay could not be observed. Check that caller outputs and a complete recap
  are available.
diagnostics.role_budget: The current role replay did not finish within the observation budget. Tasks that take a
  long time or a busy controller can delay verification.
