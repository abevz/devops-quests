title: Role dependencies
brief: 'You joined SignalRail operations. The live banner started before its directory existed. Work in
  ~/quest. Keep all changes inside this training bay.


  Start with rollout.yml and roles/*/tasks/main.yml.


  Inputs in `~/quest`: `inventory.ini`, `ansible.cfg`, `roles/base/tasks/main.yml`, `roles/banner/tasks/main.yml`,
  `roles/banner/meta/main.yml`, `rollout.yml`.


  The bay has no Internet or external DNS. Use only its supplied files, preloaded images and private services.
  All changes must stay inside this bay.


  Initial success criteria: All three hosts have /srv/routes/current containing north-ready.'
stages.0.brief: 'The banner role needs base to create /srv/routes first. Use a role dependency.


  Success criteria: All three hosts have /srv/routes/current containing north-ready.'
stages.0.objectives.0.text: All three hosts have /srv/routes/current containing north-ready.
hints.0.text: Read the banner role failure before adding ignore_errors.
hints.1.text: The base role owns the directory needed by the banner role.
hints.2.text: Declare base in banner/meta/main.yml dependencies and verify the remote file.
debrief: The banner role assumed a directory already existed. You added its base-role dependency and verified
  the managed result.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I verified the result on every managed host.
