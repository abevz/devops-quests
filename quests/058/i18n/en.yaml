title: Role dependencies
brief: 'The fleet banner is unavailable and the composed role does not honor its callers. Restore default delivery
  and the role entry point behavior declared in the supplied contract.


  Work on the workstation in `~/quest` with the supplied files:

  - `inventory.ini`.

  - `ansible.cfg`.

  - `roles/`.

  - `rollout.yml`.

  - `role-contract.json`.


  **Requirements:**


  - On every managed host (`app1`, `app2`, `app3`), `/srv/routes/current` contains `north-ready`. The supplied role
  entry point also honors the caller inputs in `role-contract.json`, including multiple calls in one play, preserves
  other caller data, and reports no changes on a second application.'
stages.0.brief: The requested banner must exist on every managed host.
stages.0.objectives.0.text: On every managed host (`app1`, `app2`, `app3`), `/srv/routes/current` contains `north-ready`.
  The supplied role entry point also honors the caller inputs in `role-contract.json`, including multiple calls
  in one play, preserves other caller data, and reports no changes on a second application.
hints.0.text: A composed role must satisfy prerequisites for each caller context. Role inputs and dependency execution
  have different scopes; one successful default invocation does not establish that another parameterized call can
  construct its output or converge.
hints.1.text: 'Inspect the entry role, its prerequisites and defaults, and compare which tasks run for each caller.
  An absent parent directory may come from a skipped dependency as well as a missing declaration.


  ```sh

  cd ~/quest

  cat role-contract.json

  cat roles/banner/meta/main.yml roles/base/meta/main.yml roles/banner/defaults/main.yml

  cat roles/base/tasks/main.yml roles/banner/tasks/main.yml

  ansible-playbook rollout.yml --list-tasks

  ```'
hints.2.text: 'Check default delivery and replay the declared caller cases in an isolated local play without privilege
  escalation. Compare both outputs and preserved data, then repeat the same application and require a recap without
  changes.


  ```sh

  cd ~/quest

  ansible-playbook rollout.yml

  ansible fleet -m ansible.builtin.command -a ''cat /srv/routes/current''

  ansible-playbook rollout.yml --check --diff

  cat role-contract.json

  ```'
debrief: Default fleet delivery and the current composed role passed the declared caller cases, preserved other
  data and converged on a repeated application. These observations do not prove the full deployment history.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I verified the result on every managed host.
diagnostics.role_entrypoint: The role replay failed to execute successfully; the banner role may omit its base dependency, create the wrong directory, suppress a repeated dependency, or fail under the unprivileged local caller. [Cause and check](guides#guide=ansible-12&section=role-repeated-caller-entry)
diagnostics.role_inputs: A caller output is missing or contains the wrong route; hardcoded /srv/routes or north-ready, or a skipped dependency on the second call, may ignore install_root and banner_route. [Cause and check](guides#guide=ansible-12&section=role-caller-specific-output)
diagnostics.role_preservation: The retained control file or existing data inside a caller directory changed or disappeared; broad cleanup or replacing an entire output directory can erase data outside the role-owned current file. [Cause and check](guides#guide=ansible-12&section=role-preserve-caller-data)
diagnostics.role_convergence: The second replay did not report localhost with zero changed, failed and unreachable counters; unconditional rewrites, non-idempotent tasks or failed host execution may prevent a converged second application. [Cause and check](guides#guide=ansible-12&section=role-second-run-convergence)
diagnostics.role_budget: The role replay subprocess exceeded the remaining observation deadline; slow tasks or waiting for unavailable external services can exhaust the two-run probe budget. [Cause and check](guides#guide=ansible-12&section=role-bounded-replay)
diagnostics.role_observation: The role replay could not be observed; missing protected contract or caller directories, unreadable output, a malformed recap, tool errors or an exhausted observation budget can prevent evaluating its result. [Cause and check](guides#guide=ansible-12&section=role-replay-observation)
diagnostics.probe_0_0: The combined fleet/role probe stopped without a detailed marker; a missing workstation directory, Python or its module, or an interrupted bounded SSH group, may prevent reaching the role replay. [Cause and check](guides#guide=ansible-12&section=role-probe-startup)
diagnostics.content_1: app1 does not provide north-ready in /srv/routes/current; a missing base dependency or failed fleet delivery can leave the default route absent, and SSH/namespace failures can also prevent observing it. [Cause and check](guides#guide=ansible-12&section=role-default-fleet-result)
diagnostics.content_2: app2 does not provide north-ready in /srv/routes/current; a missing base dependency or failed fleet delivery can leave the default route absent, and SSH/namespace failures can also prevent observing it. [Cause and check](guides#guide=ansible-12&section=role-default-fleet-result)
diagnostics.content_3: app3 does not provide north-ready in /srv/routes/current; a missing base dependency or failed fleet delivery can leave the default route absent, and SSH/namespace failures can also prevent observing it. [Cause and check](guides#guide=ansible-12&section=role-default-fleet-result)
