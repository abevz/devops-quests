title: Role dependencies
brief: |-
  The requested route banner is unavailable on the managed hosts.

  Work on the workstation in `~/quest` with the supplied files:
  - `inventory.ini`, `ansible.cfg`, `roles/base/tasks/main.yml`, `roles/banner/tasks/main.yml`, `roles/banner/meta/main.yml`, `rollout.yml`.

  **Requirements:**
  - File on every managed host (`app1`, `app2`, `app3`):
    - Path: `/srv/routes/current`.
    - Content: `north-ready`.

  The check observes current results; it does not establish the full execution history.
stages.0.brief: The requested banner must exist on every managed host.
stages.0.objectives.0.text: On every managed host (`app1`, `app2`, `app3`), `/srv/routes/current` contains
  `north-ready`.
hints.0.text: A reusable role can depend on another role’s prerequisites.
hints.1.text: |-
  Read the banner role failure before adding ignore_errors. The base role owns the directory needed by the banner role.

  Inspect the inventory and the supplied playbook on the workstation:

  ```sh
  cat roles/banner/meta/main.yml roles/banner/tasks/main.yml roles/base/tasks/main.yml
  ```
hints.2.text: |-
  Declare base in banner/meta/main.yml dependencies and verify the remote file.

  Verify the result from `~/quest` on the workstation:

  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'cat /srv/routes/current'` — Shows `north-ready` from `app1`, `app2`, `app3`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/routes/current'` — Shows the required `current` entry on every host.
debrief: The banner role assumed a directory already existed. You added its base-role dependency and verified
  the managed result.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I verified the result on every managed host.
diagnostics.content_1: 'app1, `/srv/routes/current`: content `north-ready`.'
diagnostics.content_2: 'app2, `/srv/routes/current`: content `north-ready`.'
diagnostics.content_3: 'app3, `/srv/routes/current`: content `north-ready`.'
