title: Dependencias Role
brief: 'El banner de la flota no está disponible y la composición de roles no respeta a sus llamadores. Recupera
  la entrega predeterminada y el comportamiento de entrada declarado en el contrato.


  Trabaja en la workstation en `~/quest` con los archivos suministrados:

  - `inventory.ini`.

  - `ansible.cfg`.

  - `roles/`.

  - `rollout.yml`.

  - `role-contract.json`.


  **Requisitos:**


  - En cada host administrado (`app1`, `app2`, `app3`), `/srv/routes/current` contiene `north-ready`. El punto de
  entrada del rol también respeta las entradas de `role-contract.json`, incluidas varias llamadas en un play, conserva
  otros datos del llamador y no informa cambios en una segunda aplicación.'
stages.0.brief: El banner solicitado debe existir en cada host administrado.
stages.0.objectives.0.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/routes/current` contiene `north-ready`.
  El punto de entrada del rol también respeta las entradas de `role-contract.json`, incluidas varias llamadas en
  un play, conserva otros datos del llamador y no informa cambios en una segunda aplicación.
hints.0.text: Una composición de roles debe satisfacer los requisitos de cada contexto de llamada. Las entradas
  y la ejecución de dependencias tienen ámbitos distintos; una llamada predeterminada correcta no demuestra que
  otra parametrizada pueda construir su salida y converger.
hints.1.text: 'Inspecciona el rol de entrada, sus requisitos y defaults, y compara las tareas ejecutadas para cada
  llamador. La ausencia del directorio padre puede deberse a una dependencia omitida además de una declaración ausente.


  ```sh

  cd ~/quest

  cat role-contract.json

  cat roles/banner/meta/main.yml roles/base/meta/main.yml roles/banner/defaults/main.yml

  cat roles/base/tasks/main.yml roles/banner/tasks/main.yml

  ansible-playbook rollout.yml --list-tasks

  ```'
hints.2.text: 'Verifica la entrega predeterminada y reproduce los casos declarados en un play local aislado sin
  elevar privilegios. Compara ambas salidas y los datos conservados, repite la aplicación y exige un recap sin cambios.


  ```sh

  cd ~/quest

  ansible-playbook rollout.yml

  ansible fleet -m ansible.builtin.command -a ''cat /srv/routes/current''

  ansible-playbook rollout.yml --check --diff

  cat role-contract.json

  ```'
debrief: La entrega predeterminada y la composición actual superaron los casos declarados, conservaron otros datos
  y convergieron al repetir la aplicación. No se demuestra todo el historial de despliegue.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el resultado en cada host administrado.
diagnostics.content_1: 'app1, `/srv/routes/current`: contenido `north-ready`.'
diagnostics.content_2: 'app2, `/srv/routes/current`: contenido `north-ready`.'
diagnostics.content_3: 'app3, `/srv/routes/current`: contenido `north-ready`.'
diagnostics.role_entrypoint: El punto de entrada del rol no pudo producir una salida. Una dependencia puede faltar
  u omitirse para otro contexto de llamada.
diagnostics.role_inputs: Una salida no contiene la ruta solicitada. Una constante predeterminada o una entrada no
  propagada puede quedar oculta tras una entrega predeterminada correcta.
diagnostics.role_preservation: Se cambiaron o perdieron otros datos del llamador. Limita las escrituras a la salida
  declarada y conserva datos ajenos al repetir la aplicación.
diagnostics.role_convergence: La segunda aplicación no informó un resultado correcto sin cambios. Las tareas pueden
  seguir cambiando entradas iguales o no converger.
diagnostics.role_observation: No se pudo observar la reproducción limitada del rol. Comprueba que existan las salidas
  y un recap completo.
diagnostics.probe_0_0: No se pudo observar la reproducción limitada del rol. Comprueba que existan las salidas y
  un recap completo.
diagnostics.role_budget: La reproducción actual del rol no terminó dentro del tiempo de observación. Las tareas
  largas o un controlador ocupado pueden retrasar la verificación.
