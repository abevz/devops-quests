title: Dependencias Role
brief: 'Te uniste a las operaciones de SignalRail. El banner en vivo comenzó antes de que existiera su
  directorio. Trabajar en ~/quest. Mantenga todos los cambios dentro de esta bahía de entrenamiento.


  Comience con rollout.yml y roles/*/tasks/main.yml.


  Entradas en `~/quest`: `inventory.ini`, `ansible.cfg`, `roles/base/tasks/main.yml`, `roles/banner/tasks/main.yml`,
  `roles/banner/meta/main.yml`, `rollout.yml`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente los archivos suministrados, las imágenes
  precargadas y los servicios privados. Todos los cambios deben permanecer dentro de esta bahía.


  Criterios de éxito iniciales: los tres hosts tienen /srv/routes/current que contiene north-ready.'
stages.0.brief: 'El rol banner necesita base para crear primero /srv/routes. Utilice un rol dependency.


  Criterios de éxito: los tres hosts tienen /srv/routes/current que contiene north-ready.'
stages.0.objectives.0.text: Los tres hosts tienen /srv/routes/current que contiene north-ready.
hints.0.text: Lea el error de rol banner antes de agregar ignore_errors.
hints.1.text: La función base posee el directorio que necesita la función de banner.
hints.2.text: Declare base en banner/meta/main.yml dependencies y verifique el archivo remoto.
debrief: La función banner asumió que ya existía un directorio. Agregó su función base dependency y verificó
  el resultado administrado.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el resultado en cada host administrado.
