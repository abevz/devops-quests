title: Dependencias Role
brief: |-
  El banner de ruta solicitado no está disponible en los hosts administrados.

  Trabaja en la workstation en `~/quest` con los archivos suministrados:
  - `inventory.ini`, `ansible.cfg`, `roles/base/tasks/main.yml`, `roles/banner/tasks/main.yml`, `roles/banner/meta/main.yml`, `rollout.yml`.

  **Requisitos:**
  - Archivo en cada host administrado (`app1`, `app2`, `app3`):
    - Ruta: `/srv/routes/current`.
    - Contenido: `north-ready`.

  La comprobación observa los resultados actuales; no establece todo el historial de ejecución.
stages.0.brief: El banner solicitado debe existir en cada host administrado.
stages.0.objectives.0.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/routes/current`
  contiene `north-ready`.
hints.0.text: Un rol reutilizable puede depender de los requisitos previos de otro rol.
hints.1.text: |-
  Lea el error de rol banner antes de agregar ignore_errors. La función base posee el directorio que necesita la función de banner.

  Inspecciona el inventario y el playbook suministrado en la workstation:

  ```sh
  cat roles/banner/meta/main.yml roles/banner/tasks/main.yml roles/base/tasks/main.yml
  ```
hints.2.text: |-
  Declare base en banner/meta/main.yml dependencies y verifique el archivo remoto.

  Verifica el resultado desde `~/quest` en la workstation:

  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'cat /srv/routes/current'` — Muestra `north-ready` de `app1`, `app2`, `app3`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/routes/current'` — Muestra la entrada `current` requerida en cada host.
debrief: La función banner asumió que ya existía un directorio. Agregó su función base dependency y verificó
  el resultado administrado.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el resultado en cada host administrado.
diagnostics.content_1: 'app1, `/srv/routes/current`: contenido `north-ready`.'
diagnostics.content_2: 'app2, `/srv/routes/current`: contenido `north-ready`.'
diagnostics.content_3: 'app3, `/srv/routes/current`: contenido `north-ready`.'
