title: Templates
brief: |-
  The fleet displays incorrect per-host information.

  Work on the workstation in `~/quest` with `inventory.ini`, `ansible.cfg`, `station.yml`, `board.j2`, `rollout.yml`.

  **Requirements:**
  - Host `app1`:
    - On app1, /srv/site/board contains station=app1 route=north slots=3.
    - On app1, /srv/site/board has mode 0644.
  - Host `app2`:
    - On app2, /srv/site/board contains station=app2 route=north slots=3.
    - On app2, /srv/site/board has mode 0644.
  - Host `app3`:
    - On app3, /srv/site/board contains station=app3 route=north slots=3.
    - On app3, /srv/site/board has mode 0644.

  **Verify yourself before Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/board'` — shows station=app1/app2/app3 route=north slots=3 from each managed host.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/site/board'` — shows permissions `-rw-r--r--` on all three remote files.
debrief: A reusable template combines shared route data with each target identity. The live files prove the same
  template produced different station names consistently.
stages.0.brief: Each remote output must describe its own host.
