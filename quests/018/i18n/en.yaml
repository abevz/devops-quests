title: Templates
brief: 'The station board template ignores both the target identity and the supplied route data. Use inventory_hostname,
  route=north and slots=3 from station.yml to render /srv/site/board on each target. Expected form: station=app1
  route=north slots=3, with the corresponding host name.


  Quest files in `~/quest` (some appear in later stages): `inventory.ini`, `ansible.cfg`, `station.yml`,
  `board.j2`, `rollout.yml`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: All boards contain their own station name, route north and three slots, with
  mode 0644.'
debrief: A reusable template combines shared route data with each target identity. The live files prove
  the same template produced different station names consistently.
stages.0.brief: 'Render data with Jinja; do not create a separate hard-coded template for every target.


  Success criteria: All boards contain their own station name, route north and three slots, with mode
  0644.'
stages.0.objectives.0.text: All boards contain their own station name, route north and three slots, with
  mode 0644.
hints.0.text: Inspect the template separately from the data file.
hints.1.text: inventory_hostname is defined by the inventory; route and slots come from vars_files.
hints.2.text: Compare rendered files across all three targets.
phrases.0: I rendered host-specific data with one Jinja template.
phrases.1: I kept variable values separate from presentation.
phrases.2: I checked the rendered files on all managed hosts.
