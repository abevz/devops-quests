title: Templates
brief: "The fleet displays incorrect per-host information.\n\nWork on the workstation in `~/quest` with `inventory.ini`,\
  \ `ansible.cfg`, `station.yml`, `board.j2`, `rollout.yml`.\n\n**Requirements:**\n- Per-host output on the\
  \ managed hosts (`app1`, `app2`, `app3`):\n  - Path: `/srv/site/board`.\n  - `app1`: `station=app1 route=north\
  \ slots=3`.\n  - `app2`: `station=app2 route=north slots=3`.\n  - `app3`: `station=app3 route=north slots=3`.\n\
  - Access mode: `0644`.\n"
debrief: A reusable template combines shared route data with each target identity. The live files prove the
  same template produced different station names consistently.
stages.0.brief: Each remote output must describe its own host.
stages.0.objectives.0.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/board` contains that
  host's `station` identity, `route=north` and `slots=3`.
stages.0.objectives.1.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/board` has mode `0644`.
hints.0.text: A reusable template must still reflect each target’s own data.
hints.1.text: 'Inspect the template separately from the data file.


  inventory_hostname is defined by the inventory; route and slots come from vars_files.


  Inspect the supplied inputs and execution scope:


  ```sh

  cat station.yml board.j2 rollout.yml

  ansible-inventory -i inventory.ini --graph

  ```'
hints.2.text: 'Compare rendered files across all three targets. Use one Jinja template rather than a separate
  hard-coded template for each target.


  Verify the observed result:


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''runuser -u nobody -- cat /srv/site/board''`
  — shows station=app1/app2/app3 route=north slots=3 from each managed host.


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''ls -l /srv/site/board''` — shows permissions
  `-rw-r--r--` on all three remote files.'
phrases.0: I rendered host-specific data with one Jinja template.
phrases.1: I kept variable values separate from presentation.
phrases.2: I checked the rendered files on all managed hosts.
diagnostics.content_1: On app1, /srv/site/board contains station=app1 route=north slots=3.
diagnostics.content_2: On app2, /srv/site/board contains station=app2 route=north slots=3.
diagnostics.content_3: On app3, /srv/site/board contains station=app3 route=north slots=3.
diagnostics.mode_1: On app1, /srv/site/board has mode 0644.
diagnostics.mode_2: On app2, /srv/site/board has mode 0644.
diagnostics.mode_3: On app3, /srv/site/board has mode 0644.
