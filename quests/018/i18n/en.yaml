  The file /srv/site/board on app3 can show stale or shared values when the template does not use that host name and the variables from station.yml. [Guide](guides#guide=ansible-7&section=board-template-values)
diagnostics.mode_1: |-
  The file /srv/site/board on app1 can keep the wrong permissions if the template task applies a different mode or did not run on this host. [Guide](guides#guide=ansible-7&section=board-template-values)
