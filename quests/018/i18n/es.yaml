title: Plantillas
brief: 'La plantilla station board ignora tanto la identidad de destino como los datos route proporcionados.
  Utilice inventory_hostname, route=north y slots=3 de station.yml para representar /srv/site/board en
  cada objetivo. Formato esperado: station=app1 route=north slots=3, con el nombre de host correspondiente.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `inventory.ini`, `ansible.cfg`,
  `station.yml`, `board.j2`, `rollout.yml`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: todas las placas contienen su propio nombre station, route north y tres
  ranuras, con modo 0644.'
debrief: Una plantilla reutilizable combina datos route compartidos con cada identidad de destino. Los
  archivos en vivo demuestran que la misma plantilla produjo diferentes nombres station de manera consistente.
stages.0.brief: 'Renderizar datos con Jinja; no cree una plantilla codificada separada para cada objetivo.


  Criterios de éxito: Todas las placas contienen su propio nombre station, route north y tres ranuras,
  con modo 0644.'
stages.0.objectives.0.text: Todas las placas contienen su propio nombre station, route north y tres ranuras,
  con modo 0644.
hints.0.text: Inspeccione la plantilla por separado del archivo de datos.
hints.1.text: inventory_hostname está definido por inventory; route y slots provienen de vars_files.
hints.2.text: Compare archivos renderizados en los tres objetivos.
phrases.0: Representé datos específicos del host con una plantilla Jinja.
phrases.1: Mantuve los valores de las variables separados de la presentación.
phrases.2: Revisé los archivos renderizados en todos los hosts administrados.
