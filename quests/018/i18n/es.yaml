title: Plantillas
brief: |-
  La flota muestra información incorrecta para cada host.

  Trabaja en la workstation en `~/quest` con `inventory.ini`, `ansible.cfg`, `station.yml`, `board.j2`, `rollout.yml`.

  **Requisitos:**
  - Resultado individual en los hosts administrados (`app1`, `app2`, `app3`):
    - Ruta: `/srv/site/board`.
    - `app1`: `station=app1 route=north slots=3`.
    - `app2`: `station=app2 route=north slots=3`.
    - `app3`: `station=app3 route=north slots=3`.
    - Modo de acceso: `0644`.

  **Verifica antes de Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/board'` — muestra station=app1/app2/app3 route=north slots=3 de cada host administrado.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/site/board'` — muestra permisos `-rw-r--r--` en los tres archivos remotos.
debrief: Una plantilla reutilizable combina datos route compartidos con cada identidad de destino. Los archivos
  en vivo demuestran que la misma plantilla produjo diferentes nombres station de manera consistente.
stages.0.brief: Cada salida remota debe describir su propio host.
stages.0.objectives.0.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/board` contiene su propia
  identidad `station`, `route=north` y `slots=3`.
stages.0.objectives.1.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/board` tiene el modo
  `0644`.
hints.0.text: Inspeccione la plantilla por separado del archivo de datos.
hints.1.text: inventory_hostname está definido por inventory; route y slots provienen de vars_files.
hints.2.text: Compare archivos renderizados en los tres objetivos. Usa una plantilla Jinja en lugar de una plantilla
  fija separada por destino.
phrases.0: Representé datos específicos del host con una plantilla Jinja.
phrases.1: Mantuve los valores de las variables separados de la presentación.
phrases.2: Revisé los archivos renderizados en todos los hosts administrados.
