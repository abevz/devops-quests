title: Plantillas
brief: "La flota muestra información incorrecta para cada host.\n\nTrabaja en la workstation en `~/quest` con\
  \ `inventory.ini`, `ansible.cfg`, `station.yml`, `board.j2`, `rollout.yml`.\n\n**Requisitos:**\n- Resultado\
  \ individual en los hosts administrados (`app1`, `app2`, `app3`):\n  - Ruta: `/srv/site/board`.\n  - `app1`:\
  \ `station=app1 route=north slots=3`.\n  - `app2`: `station=app2 route=north slots=3`.\n  - `app3`: `station=app3\
  \ route=north slots=3`.\n- Modo de acceso: `0644`.\n"
debrief: Una plantilla reutilizable combina datos route compartidos con cada identidad de destino. Los archivos
  en vivo demuestran que la misma plantilla produjo diferentes nombres station de manera consistente.
stages.0.brief: Cada salida remota debe describir su propio host.
stages.0.objectives.0.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/board` contiene
  su propia identidad `station`, `route=north` y `slots=3`.
stages.0.objectives.1.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/board` tiene el
  modo `0644`.
hints.0.text: Una plantilla reutilizable debe reflejar los datos propios de cada destino.
hints.1.text: 'Inspeccione la plantilla por separado del archivo de datos.


  inventory_hostname está definido por inventory; route y slots provienen de vars_files.


  Inspecciona las entradas suministradas y el ámbito de ejecución:


  ```sh

  cat station.yml board.j2 rollout.yml

  ansible-inventory -i inventory.ini --graph

  ```'
hints.2.text: 'Compare archivos renderizados en los tres objetivos. Usa una plantilla Jinja en lugar de una
  plantilla fija separada por destino.


  Verifica el resultado observado:


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''runuser -u nobody -- cat /srv/site/board''`
  — muestra station=app1/app2/app3 route=north slots=3 de cada host administrado.


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''ls -l /srv/site/board''` — muestra permisos
  `-rw-r--r--` en los tres archivos remotos.'
phrases.0: Representé datos específicos del host con una plantilla Jinja.
phrases.1: Mantuve los valores de las variables separados de la presentación.
phrases.2: Revisé los archivos renderizados en todos los hosts administrados.
diagnostics.content_1: En app1, /srv/site/board contiene station=app1 route=north slots=3.
diagnostics.content_2: En app2, /srv/site/board contiene station=app2 route=north slots=3.
diagnostics.content_3: En app3, /srv/site/board contiene station=app3 route=north slots=3.
diagnostics.mode_1: En app1, /srv/site/board tiene el modo 0644.
diagnostics.mode_2: En app2, /srv/site/board tiene el modo 0644.
diagnostics.mode_3: En app3, /srv/site/board tiene el modo 0644.
