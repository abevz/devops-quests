title: Vorlagen
brief: 'Die Vorlage station board ignoriert sowohl die Zielidentität als auch die bereitgestellten route-Daten.
  Verwenden Sie inventory_hostname, route=north und slots=3 von station.yml, um /srv/site/board auf jedem
  Ziel zu rendern. Erwartete Form: station=app1 route=north slots=3, mit dem entsprechenden Hostnamen.


  Questdateien in `~/quest` (einige erscheinen in späteren Phasen): `inventory.ini`, `ansible.cfg`, `station.yml`,
  `board.j2`, `rollout.yml`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: Alle Boards enthalten einen eigenen station-Namen, route north und drei Steckplätze,
  mit Modus 0644.'
debrief: Eine wiederverwendbare Vorlage kombiniert freigegebene route-Daten mit jeder Zielidentität. Die
  Live-Dateien beweisen, dass dieselbe Vorlage konsistent unterschiedliche station-Namen erzeugt hat.
stages.0.brief: 'Daten rendern mit Jinja; Erstellen Sie nicht für jedes Ziel eine separate hartcodierte
  Vorlage.


  Erfolgskriterien: Alle Boards enthalten einen eigenen station-Namen, route north und drei Steckplätze,
  mit Modus 0644.'
stages.0.objectives.0.text: Alle Boards enthalten ihren eigenen station-Namen, route north und drei Steckplätze
  mit Modus 0644.
hints.0.text: Überprüfen Sie die Vorlage getrennt von der Datendatei.
hints.1.text: inventory_hostname wird durch inventory definiert; route und slots stammen von vars_files.
hints.2.text: Vergleichen Sie gerenderte Dateien auf allen drei Zielen.
phrases.0: Ich habe hostspezifische Daten mit einer Jinja-Vorlage gerendert.
phrases.1: Ich habe die Variablenwerte von der Darstellung getrennt gehalten.
phrases.2: Ich habe die gerenderten Dateien auf allen verwalteten Hosts überprüft.
