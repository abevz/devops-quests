hints.0.text: Überprüfen Sie die Vorlage getrennt von der Datendatei.
hints.1.text: inventory_hostname wird durch inventory definiert; route und slots stammen von vars_files.
hints.2.text: Vergleichen Sie gerenderte Dateien auf allen drei Zielen. Nutzen Sie eine Jinja-Vorlage statt einer
  separaten fest codierten Vorlage pro Ziel.
phrases.0: Ich habe hostspezifische Daten mit einer Jinja-Vorlage gerendert.
phrases.1: Ich habe die Variablenwerte von der Darstellung getrennt gehalten.
phrases.2: Ich habe die gerenderten Dateien auf allen verwalteten Hosts überprüft.
