title: Vorlagen
brief: "Die Flotte zeigt falsche hostspezifische Informationen.\n\nArbeiten Sie auf der Workstation in `~/quest`\
  \ mit `inventory.ini`, `ansible.cfg`, `station.yml`, `board.j2`, `rollout.yml`.\n\n**Anforderungen:**\n-\
  \ Hostspezifische Ausgabe auf den verwalteten Hosts (`app1`, `app2`, `app3`):\n  - Pfad: `/srv/site/board`.\n\
  \  - `app1`: `station=app1 route=north slots=3`.\n  - `app2`: `station=app2 route=north slots=3`.\n  - `app3`:\
  \ `station=app3 route=north slots=3`.\n- Zugriffsmodus: `0644`.\n"
debrief: Eine wiederverwendbare Vorlage kombiniert freigegebene route-Daten mit jeder Zielidentität. Die Live-Dateien
  beweisen, dass dieselbe Vorlage konsistent unterschiedliche station-Namen erzeugt hat.
stages.0.brief: Jede entfernte Ausgabe muss ihren eigenen Host beschreiben.
stages.0.objectives.0.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/board` dessen
  eigene `station`-Identität, `route=north` und `slots=3`.
stages.0.objectives.1.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) hat `/srv/site/board` den Modus
  `0644`.
hints.0.text: Eine wiederverwendbare Vorlage muss trotzdem die eigenen Daten jedes Ziels abbilden.
hints.1.text: 'Überprüfen Sie die Vorlage getrennt von der Datendatei.


  inventory_hostname wird durch inventory definiert; route und slots stammen von vars_files.


  Prüfen Sie die mitgelieferten Eingaben und den Ausführungsumfang:


  ```sh

  cat station.yml board.j2 rollout.yml

  ansible-inventory -i inventory.ini --graph

  ```'
hints.2.text: 'Vergleichen Sie gerenderte Dateien auf allen drei Zielen. Nutzen Sie eine Jinja-Vorlage statt
  einer separaten fest codierten Vorlage pro Ziel.


  Prüfen Sie das beobachtete Ergebnis:


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''runuser -u nobody -- cat /srv/site/board''`
  — zeigt station=app1/app2/app3 route=north slots=3 von jedem verwalteten Host.


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''ls -l /srv/site/board''` — zeigt Berechtigungen
  `-rw-r--r--` für alle drei entfernten Dateien.'
phrases.0: Ich habe hostspezifische Daten mit einer Jinja-Vorlage gerendert.
phrases.1: Ich habe die Variablenwerte von der Darstellung getrennt gehalten.
phrases.2: Ich habe die gerenderten Dateien auf allen verwalteten Hosts überprüft.
