title: Vorlagen
brief: |-
  Die Flotte zeigt falsche hostspezifische Informationen.

  Arbeiten Sie auf der Workstation in `~/quest` mit `inventory.ini`, `ansible.cfg`, `station.yml`, `board.j2`, `rollout.yml`.

  **Anforderungen:**
  - Host `app1`:
    - Auf app1 enthält /srv/site/board den Inhalt station=app1 route=north slots=3.
    - Auf app1 hat /srv/site/board den Modus 0644.
  - Host `app2`:
    - Auf app2 enthält /srv/site/board den Inhalt station=app2 route=north slots=3.
    - Auf app2 hat /srv/site/board den Modus 0644.
  - Host `app3`:
    - Auf app3 enthält /srv/site/board den Inhalt station=app3 route=north slots=3.
    - Auf app3 hat /srv/site/board den Modus 0644.

  **Selbstprüfung vor Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/board'` — zeigt station=app1/app2/app3 route=north slots=3 von jedem verwalteten Host.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/site/board'` — zeigt Berechtigungen `-rw-r--r--` für alle drei entfernten Dateien.
debrief: Eine wiederverwendbare Vorlage kombiniert freigegebene route-Daten mit jeder Zielidentität. Die Live-Dateien
  beweisen, dass dieselbe Vorlage konsistent unterschiedliche station-Namen erzeugt hat.
stages.0.brief: Jede entfernte Ausgabe muss ihren eigenen Host beschreiben.
