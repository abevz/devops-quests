  Die Datei /srv/site/board auf app2 kann alte oder gemeinsame Werte zeigen, wenn die Vorlage den Hostnamen und die Variablen aus station.yml nicht verwendet. [Leitfaden](guides#guide=ansible-7&section=board-template-values)
