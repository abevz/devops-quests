diagnostics.mode_1: |-
  Die Datei /srv/site/board auf app1 kann falsche Berechtigungen behalten, wenn die Vorlagenaufgabe einen anderen Modus setzt oder auf dem Host nicht lief. [Leitfaden](guides#guide=ansible-7&section=board-template-values)
