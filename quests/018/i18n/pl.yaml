title: Szablony
brief: 'Szablon board station ignoruje zarówno tożsamość celu, jak i dostarczone dane o trasie. Użyj inventory_hostname,
  route=north i slots=3 z station.yml, aby wyrenderować /srv/site/board na każdym celu. Oczekiwana forma:
  station=app1 route=north slots=3 z odpowiednią nazwą hosta.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `inventory.ini`, `ansible.cfg`,
  `station.yml`, `board.j2`, `rollout.yml`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: wszystkie board zawierają własną nazwę station, trasę north i trzy sloty,
  z mode 0644.'
debrief: Szablon wielokrotnego użytku łączy udostępnione dane trasy z każdą tożsamością docelową. Pliki
  na żywo dowodzą, że ten sam szablon konsekwentnie generował różne nazwy station.
stages.0.brief: 'Renderuj dane za pomocą Jinja; nie twórz osobnego, zakodowanego na stałe szablonu dla
  każdego celu.


  Kryteria sukcesu: Wszystkie tablice zawierają własną nazwę station, trasę north i trzy sloty, z mode
  0644.'
stages.0.objectives.0.text: Wszystkie tablice zawierają własną nazwę station, trasę north i trzy sloty,
  z mode 0644.
hints.0.text: Sprawdź szablon niezależnie od pliku danych.
hints.1.text: inventory_hostname jest zdefiniowany przez inventory; route i slots pochodzą z vars_files.
hints.2.text: Porównaj wyrenderowane pliki ze wszystkich trzech obiektów docelowych.
phrases.0: Wyrenderowałem dane specyficzne dla hosta za pomocą jednego szablonu Jinja.
phrases.1: Wartości zmiennych trzymałem oddzielnie od prezentacji.
phrases.2: Sprawdziłem renderowane pliki na wszystkich zarządzanych hostach.
