title: Szablony
brief: "Hosty pokazują nieprawidłowe informacje indywidualne.\n\nPracuj na workstation w `~/quest` z plikami\
  \ `inventory.ini`, `ansible.cfg`, `station.yml`, `board.j2`, `rollout.yml`.\n\n**Wymagania:**\n- Indywidualny\
  \ wynik na zarządzanych hostach (`app1`, `app2`, `app3`):\n  - Ścieżka: `/srv/site/board`.\n  - `app1`: `station=app1\
  \ route=north slots=3`.\n  - `app2`: `station=app2 route=north slots=3`.\n  - `app3`: `station=app3 route=north\
  \ slots=3`.\n- Tryb dostępu: `0644`.\n"
debrief: Szablon wielokrotnego użytku łączy udostępnione dane trasy z każdą tożsamością docelową. Pliki na
  żywo dowodzą, że ten sam szablon konsekwentnie generował różne nazwy station.
stages.0.brief: Każdy zdalny wynik musi opisywać własnego hosta.
stages.0.objectives.0.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/board` zawiera
  jego własną tożsamość `station`, `route=north` i `slots=3`.
stages.0.objectives.1.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/board` ma
  tryb `0644`.
hints.0.text: Szablon wielokrotnego użytku musi odzwierciedlać własne dane każdego celu.
hints.1.text: 'Sprawdź szablon niezależnie od pliku danych.


  inventory_hostname jest zdefiniowany przez inventory; route i slots pochodzą z vars_files.


  Sprawdź dostarczone dane wejściowe i zakres wykonania:


  ```sh

  cat station.yml board.j2 rollout.yml

  ansible-inventory -i inventory.ini --graph

  ```'
hints.2.text: 'Porównaj wyrenderowane pliki ze wszystkich trzech obiektów docelowych. Użyj jednego szablonu
  Jinja zamiast osobnego sztywnego szablonu dla każdego hosta.


  Sprawdź obserwowany wynik:


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''runuser -u nobody -- cat /srv/site/board''`
  — pokazuje station=app1/app2/app3 route=north slots=3 z każdego zarządzanego hosta.


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''ls -l /srv/site/board''` — pokazuje uprawnienia
  `-rw-r--r--` wszystkich trzech zdalnych plików.'
phrases.0: Wyrenderowałem dane specyficzne dla hosta za pomocą jednego szablonu Jinja.
phrases.1: Wartości zmiennych trzymałem oddzielnie od prezentacji.
phrases.2: Sprawdziłem renderowane pliki na wszystkich zarządzanych hostach.
