title: Szablony
brief: |-
  Hosty pokazują nieprawidłowe informacje indywidualne.

  Pracuj na workstation w `~/quest` z plikami `inventory.ini`, `ansible.cfg`, `station.yml`, `board.j2`, `rollout.yml`.

  **Wymagania:**
  - Host `app1`:
    - Na app1 plik /srv/site/board zawiera station=app1 route=north slots=3.
    - Na app1 plik /srv/site/board ma tryb 0644.
  - Host `app2`:
    - Na app2 plik /srv/site/board zawiera station=app2 route=north slots=3.
    - Na app2 plik /srv/site/board ma tryb 0644.
  - Host `app3`:
    - Na app3 plik /srv/site/board zawiera station=app3 route=north slots=3.
    - Na app3 plik /srv/site/board ma tryb 0644.

  **Sprawdź przed Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/board'` — pokazuje station=app1/app2/app3 route=north slots=3 z każdego zarządzanego hosta.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/site/board'` — pokazuje uprawnienia `-rw-r--r--` wszystkich trzech zdalnych plików.
debrief: Szablon wielokrotnego użytku łączy udostępnione dane trasy z każdą tożsamością docelową. Pliki na żywo
  dowodzą, że ten sam szablon konsekwentnie generował różne nazwy station.
