title: Шаблоны
brief: 'Шаблон табло игнорирует имя цели и выданные данные маршрута. Используйте inventory_hostname, route=north
  и slots=3 из station.yml для /srv/site/board на каждой цели. Формат: station=app1 route=north slots=3
  с соответствующим именем хоста.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `inventory.ini`, `ansible.cfg`, `station.yml`,
  `board.j2`, `rollout.yml`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Каждое табло содержит своё имя станции, маршрут north и три слота с mode 0644.'
debrief: Повторно используемый шаблон соединяет общие данные маршрута с именем каждой цели. Фактические
  файлы доказывают корректную подстановку разных имён.
stages.0.brief: 'Шаблонизируйте данные через Jinja, не создавая отдельный статический шаблон на каждую
  цель.


  Результат проверки: Каждое табло содержит своё имя станции, маршрут north и три слота с mode 0644.'
stages.0.objectives.0.text: Каждое табло содержит своё имя станции, маршрут north и три слота с mode 0644.
hints.0.text: Отдельно изучите шаблон и файл данных.
hints.1.text: inventory_hostname берётся из inventory, route и slots — из vars_files.
hints.2.text: Сравните результаты шаблонизации на трёх целях.
phrases.0: Я сформировал данные узлов одним шаблоном Jinja.
phrases.1: Я отделил значения переменных от представления.
phrases.2: Я проверил сформированные файлы на всех управляемых узлах.
