title: Шаблоны
brief: "Хосты показывают неверные индивидуальные сведения.\n\nРаботайте на workstation в `~/quest` с файлами\
  \ `inventory.ini`, `ansible.cfg`, `station.yml`, `board.j2`, `rollout.yml`.\n\n**Требования:**\n- Индивидуальный\
  \ результат на управляемых хостах (`app1`, `app2`, `app3`):\n  - Путь: `/srv/site/board`.\n  - `app1`: `station=app1\
  \ route=north slots=3`.\n  - `app2`: `station=app2 route=north slots=3`.\n  - `app3`: `station=app3 route=north\
  \ slots=3`.\n- Режим доступа: `0644`.\n"
debrief: Повторно используемый шаблон соединяет общие данные маршрута с именем каждой цели. Фактические файлы
  доказывают корректную подстановку разных имён.
stages.0.brief: Каждый удалённый результат должен описывать свой хост.
stages.0.objectives.0.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/board` содержит
  собственное имя `station`, `route=north` и `slots=3`.
stages.0.objectives.1.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/board` имеет
  режим `0644`.
hints.0.text: Повторно используемый шаблон должен учитывать собственные данные каждой цели.
hints.1.text: |-
  Откройте `board.j2` и найдите `vars_files` в `rollout.yml`. Используйте один шаблон с `inventory_hostname` для каждого хоста и переменными `route` и `slots` из `station.yml`.

  ```sh
  cat station.yml board.j2 rollout.yml
  ansible-inventory -i inventory.ini --graph
  ansible-playbook rollout.yml --syntax-check
  ```
hints.2.text: |-
  Сравните получившиеся файлы на всех трёх хостах и проверьте права доступа.

  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/board'` — показывает station=app1/app2/app3 route=north slots=3 с каждого управляемого хоста.

  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/site/board'` — показывает права `-rw-r--r--` у всех трёх удалённых файлов.
phrases.0: Я сформировал данные узлов одним шаблоном Jinja.
phrases.1: Я отделил значения переменных от представления.
phrases.2: Я проверил сформированные файлы на всех управляемых узлах.
diagnostics.content_1: |-
  В файле /srv/site/board на app1 могут остаться старые или общие значения, если шаблон не использует имя хоста и переменные из station.yml. [Гайд](guides#guide=ansible-7&section=board-template-values)
diagnostics.content_2: |-
  В файле /srv/site/board на app2 могут остаться старые или общие значения, если шаблон не использует имя хоста и переменные из station.yml. [Гайд](guides#guide=ansible-7&section=board-template-values)
diagnostics.content_3: |-
  В файле /srv/site/board на app3 могут остаться старые или общие значения, если шаблон не использует имя хоста и переменные из station.yml. [Гайд](guides#guide=ansible-7&section=board-template-values)
diagnostics.mode_1: |-
  У файла /srv/site/board на app1 могут остаться неверные права, если задача шаблонизации задала другой режим или не выполнялась на хосте. [Гайд](guides#guide=ansible-7&section=board-template-values)
diagnostics.mode_2: |-
  У файла /srv/site/board на app2 могут остаться неверные права, если задача шаблонизации задала другой режим или не выполнялась на хосте. [Гайд](guides#guide=ansible-7&section=board-template-values)
diagnostics.mode_3: |-
  У файла /srv/site/board на app3 могут остаться неверные права, если задача шаблонизации задала другой режим или не выполнялась на хосте. [Гайд](guides#guide=ansible-7&section=board-template-values)
