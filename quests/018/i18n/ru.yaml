title: Шаблоны
brief: "Хосты показывают неверные индивидуальные сведения.\n\nРаботайте на workstation в `~/quest` с файлами\
  \ `inventory.ini`, `ansible.cfg`, `station.yml`, `board.j2`, `rollout.yml`.\n\n**Требования:**\n- Индивидуальный\
  \ результат на управляемых хостах (`app1`, `app2`, `app3`):\n  - Путь: `/srv/site/board`.\n  - `app1`: `station=app1\
  \ route=north slots=3`.\n  - `app2`: `station=app2 route=north slots=3`.\n  - `app3`: `station=app3 route=north\
  \ slots=3`.\n- Режим доступа: `0644`.\n"
debrief: Повторно используемый шаблон соединяет общие данные маршрута с именем каждой цели. Фактические файлы
  доказывают корректную подстановку разных имён.
stages.0.brief: Каждый удалённый результат должен описывать свой хост.
stages.0.objectives.0.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/board` содержит
  собственное имя `station`, `route=north` и `slots=3`.
stages.0.objectives.1.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/board` имеет
  режим `0644`.
hints.0.text: Повторно используемый шаблон должен учитывать собственные данные каждой цели.
hints.1.text: 'Отдельно изучите шаблон и файл данных.


  inventory_hostname берётся из inventory, route и slots — из vars_files.


  Изучите поставленные входные данные и область выполнения:


  ```sh

  cat station.yml board.j2 rollout.yml

  ansible-inventory -i inventory.ini --graph

  ```'
hints.2.text: 'Сравните результаты шаблонизации на трёх целях. Используйте один шаблон Jinja, а не отдельный
  жёстко заданный шаблон для каждого хоста.


  Проверьте наблюдаемый результат:


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''runuser -u nobody -- cat /srv/site/board''`
  — показывает station=app1/app2/app3 route=north slots=3 с каждого управляемого хоста.


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''ls -l /srv/site/board''` — показывает права
  `-rw-r--r--` у всех трёх удалённых файлов.'
phrases.0: Я сформировал данные узлов одним шаблоном Jinja.
phrases.1: Я отделил значения переменных от представления.
phrases.2: Я проверил сформированные файлы на всех управляемых узлах.
diagnostics.content_1: На app1 файл /srv/site/board содержит station=app1 route=north slots=3.
diagnostics.content_2: На app2 файл /srv/site/board содержит station=app2 route=north slots=3.
diagnostics.content_3: На app3 файл /srv/site/board содержит station=app3 route=north slots=3.
diagnostics.mode_1: На app1 файл /srv/site/board имеет режим 0644.
diagnostics.mode_2: На app2 файл /srv/site/board имеет режим 0644.
diagnostics.mode_3: На app3 файл /srv/site/board имеет режим 0644.
