title: Шаблоны
brief: |-
  Хосты показывают неверные индивидуальные сведения.

  Работайте на workstation в `~/quest` с файлами `inventory.ini`, `ansible.cfg`, `station.yml`, `board.j2`, `rollout.yml`.

  **Требования:**
  - Хост `app1`:
    - На app1 файл /srv/site/board содержит station=app1 route=north slots=3.
    - На app1 файл /srv/site/board имеет режим 0644.
  - Хост `app2`:
    - На app2 файл /srv/site/board содержит station=app2 route=north slots=3.
    - На app2 файл /srv/site/board имеет режим 0644.
  - Хост `app3`:
    - На app3 файл /srv/site/board содержит station=app3 route=north slots=3.
    - На app3 файл /srv/site/board имеет режим 0644.

  **Самопроверка перед Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/board'` — показывает station=app1/app2/app3 route=north slots=3 с каждого управляемого хоста.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/site/board'` — показывает права `-rw-r--r--` у всех трёх удалённых файлов.
debrief: Повторно используемый шаблон соединяет общие данные маршрута с именем каждой цели. Фактические файлы доказывают
  корректную подстановку разных имён.
stages.0.brief: Каждый удалённый результат должен описывать свой хост.
stages.0.objectives.0.text: На app1 файл /srv/site/board содержит station=app1 route=north slots=3.
stages.0.objectives.1.text: На app1 файл /srv/site/board имеет режим 0644.
stages.0.objectives.2.text: На app2 файл /srv/site/board содержит station=app2 route=north slots=3.
stages.0.objectives.3.text: На app2 файл /srv/site/board имеет режим 0644.
stages.0.objectives.4.text: На app3 файл /srv/site/board содержит station=app3 route=north slots=3.
stages.0.objectives.5.text: На app3 файл /srv/site/board имеет режим 0644.
hints.0.text: Отдельно изучите шаблон и файл данных.
hints.1.text: inventory_hostname берётся из inventory, route и slots — из vars_files.
hints.2.text: Сравните результаты шаблонизации на трёх целях. Используйте один шаблон Jinja, а не отдельный жёстко
  заданный шаблон для каждого хоста.
phrases.0: Я сформировал данные узлов одним шаблоном Jinja.
phrases.1: Я отделил значения переменных от представления.
phrases.2: Я проверил сформированные файлы на всех управляемых узлах.
