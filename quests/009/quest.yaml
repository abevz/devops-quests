id: 9
title: title
track: OpenTofu
difficulty: basics
brief: brief
stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    keep: true
    check: |-
      tofu state list | grep -Fx local_file.notice >/dev/null || {
        code=$?
        printf '%s\n' 'OpenTofu state tracks local_file.notice: ✗ [DQ:condition_0]' >&2
        exit "$code"
      }
  - text: stages.0.objectives.1.text
    check: |-
      test "$(cat notice.txt)" = north-ready || {
        code=$?
        printf '%s\n' 'notice.txt contains north-ready: ✗ [DQ:condition_1]' >&2
        exit "$code"
      }
  - text: stages.0.objectives.2.text
    check: |-
      tofu plan -input=false -detailed-exitcode -no-color >/dev/null || {
        code=$?
        printf '%s\n' 'OpenTofu detailed plan exits with 0: ✗ [DQ:condition_2]' >&2
        exit "$code"
      }
hints:
- text: hints.0.text
  guide: terraform-3
- text: hints.1.text
  guide: terraform-3
- text: hints.2.text
  guide: terraform-3
debrief: debrief
phrases:
- phrases.0
- phrases.1
- phrases.2
questions: []
facts:
  environment:
  - DQ_NAMESPACE
  - DQ_APP_IMAGE
  - KUBECONFIG
  - TF_CLI_CONFIG_FILE
  - DOCKER_HOST
  - DOCKER_TLS_VERIFY
  - DOCKER_CERT_PATH
  files:
  - main.tf
  services: []
