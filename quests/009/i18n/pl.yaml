title: State i dryf
brief: 'Dołączyłeś do operacji SignalRail. Lokalny znacznik wydania został edytowany ręcznie. Pracuj w
  ~/quest. Wszystkie zmiany przechowuj w tej komorze szkoleniowej.


  Wejścia w `~/quest`: `main.tf`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Wszystkie zmiany muszą pozostać w tej zatoce.


  Początkowe kryteria sukcesu: powiadomienie odpowiada żądanemu stanowi z pustym plan.'
stages.0.brief: 'Przywróć zarządzane powiadomienie do north-ready. plan musi być później pusty.


  Kryteria sukcesu: Powiadomienie odpowiada żądanemu stanowi z pustym plan.'
stages.0.objectives.0.text: Powiadomienie odpowiada żądanemu stanowi z pustym plan.
hints.0.text: Uruchom tofu plan i sprawdź powiadomienie na żywo.
hints.1.text: Konfiguracja nadal wymaga north-ready; ręczna edycja utworzyła drift.
hints.2.text: Zastosuj żądany stan i zweryfikuj zawartość na żywo oraz pustą kontynuację plan.
debrief: Ktoś edytował zarządzany plik poza OpenTofu. Przywróciłeś żądaną zawartość i zweryfikowałeś pusty
  plik plan.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Porównałem aktywny zasób ID ze stanem OpenTofu.
