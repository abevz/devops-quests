title: State i dryf
brief: "Komunikat wydania nie odpowiada oczekiwanemu komunikatowi stacji. Przywróć spójny zarządzany stan.\n\
  \nPracuj w `~/quest` na workstation. Dostarczone pliki wejściowe: `main.tf`.\n\n**Wymagania:**\n- Stan OpenTofu\
  \ zawiera:\n  - `local_file.notice`\n- Pliki w `~/quest` na workstation:\n  - `notice.txt`: `north-ready`\n\
  - Szczegółowy plan nie zawiera oczekujących zmian infrastruktury i kończy się kodem `0`.\n"
stages.0.brief: Zarządzany komunikat ma zawierać wymagany tekst, bez oczekujących zmian.
stages.0.objectives.0.text: State zawiera `local_file.notice`.
stages.0.objectives.1.text: '`notice.txt` zawiera `north-ready`.'
stages.0.objectives.2.text: OpenTofu nie zgłasza oczekujących zmian infrastruktury.
hints.0.text: Zadeklarowany stan pożądany i rzeczywista zawartość mogą się różnić.
hints.1.text: 'Uruchom tofu plan i sprawdź powiadomienie na żywo.


  Konfiguracja nadal wymaga north-ready; ręczna edycja utworzyła drift.


  Sprawdź dostarczone dane wejściowe i bieżący zarządzany stan:


  ```sh

  cat main.tf

  tofu show -no-color

  tofu plan -input=false -no-color

  ```'
hints.2.text: 'Zastosuj żądany stan i zweryfikuj zawartość na żywo oraz pustą kontynuację plan.


  Sprawdź obserwowany wynik:


  - `tofu state list` — Oczekiwane są adresy stanu wymienione w wymaganiach.


  - `cat notice.txt` — Oczekiwane: komunikat zawiera `north-ready`.


  - `tofu plan -input=false -detailed-exitcode -no-color` — Oczekiwane: brak zmian i kod zakończenia `0`.'
debrief: Ktoś edytował zarządzany plik poza OpenTofu. Przywróciłeś żądaną zawartość i zweryfikowałeś pusty
  plik plan.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Porównałem aktywny zasób ID ze stanem OpenTofu.
