title: State i dryf
brief: |
  Komunikat wydania nie odpowiada oczekiwanemu komunikatowi stacji. Przywróć spójny zarządzany stan.

  Pracuj w `~/quest` na workstation. Dostarczone pliki wejściowe: `main.tf`.

  **Wymagania:**
  - Stan OpenTofu zawiera:
    - `local_file.notice`
  - Pliki w `~/quest` na workstation:
    - `notice.txt`: `north-ready`
  - `tofu plan` kończy się kodem `0` i nie wykazuje zmian.

  **Sprawdź samodzielnie przed Check & finish:**
  Wykonaj te polecenia obserwacyjne w `~/quest` na workstation.
  - `tofu state list` — Oczekiwane są adresy stanu wymienione w wymaganiach.
  - `cat notice.txt` — Oczekiwane: komunikat zawiera `north-ready`.
  - `tofu plan -input=false -detailed-exitcode -no-color` — Oczekiwane: brak zmian i kod zakończenia `0`.
stages.0.brief: |
  Zarządzany komunikat ma zawierać wymagany tekst, bez oczekujących zmian.
stages.0.objectives.0.text: State zawiera `local_file.notice`.
stages.0.objectives.1.text: '`notice.txt` zawiera `north-ready`.'
stages.0.objectives.2.text: '`tofu plan` kończy się kodem 0 bez zmian.'
hints.0.text: Uruchom tofu plan i sprawdź powiadomienie na żywo.
hints.1.text: Konfiguracja nadal wymaga north-ready; ręczna edycja utworzyła drift.
hints.2.text: Zastosuj żądany stan i zweryfikuj zawartość na żywo oraz pustą kontynuację plan.
debrief: Ktoś edytował zarządzany plik poza OpenTofu. Przywróciłeś żądaną zawartość i zweryfikowałeś pusty
  plik plan.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Porównałem aktywny zasób ID ze stanem OpenTofu.
