title: State and drift
brief: "The release notice does not match the expected release message. Restore a consistent managed result.\n\
  \nWork in `~/quest` on the workstation. Supplied inputs: `main.tf`.\n\n**Requirements:**\n- OpenTofu state\
  \ contains:\n  - `local_file.notice`\n- Files in `~/quest` on the workstation:\n  - `notice.txt`: `north-ready`\n\
  - A detailed plan reports no pending infrastructure changes and exits with code `0`.\n"
stages.0.brief: The managed notice must match the required message with no pending changes.
stages.0.objectives.0.text: The state tracks `local_file.notice`.
stages.0.objectives.1.text: '`notice.txt` contains `north-ready`.'
stages.0.objectives.2.text: OpenTofu reports no pending infrastructure changes.
hints.0.text: Declared desired state and live content can diverge.
hints.1.text: 'Run tofu plan and inspect the live notice.


  The configuration still requires north-ready; a manual edit created drift.


  Inspect the supplied inputs and current managed state:


  ```sh

  cat main.tf

  tofu show -no-color

  tofu plan -input=false -no-color

  ```'
hints.2.text: 'Apply desired state and verify the live content and an empty follow-up plan.


  Verify the observed result:


  - `tofu state list` — Expected: the state addresses listed in Requirements.


  - `cat notice.txt` — Expected: the notice reads `north-ready`.


  - `tofu plan -input=false -detailed-exitcode -no-color` — Expected: no changes, exit code `0`.'
debrief: Someone edited a managed file outside OpenTofu. You restored desired content and verified an empty
  plan.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I compared the live resource ID with the OpenTofu state.
