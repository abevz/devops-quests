title: State and drift
brief: 'You joined SignalRail operations. A local release marker was edited by hand. Work in ~/quest.
  Keep all changes inside this training bay.


  Inputs in `~/quest`: `main.tf`.


  The bay has no Internet or external DNS. Use only its supplied files, preloaded images and private services.
  All changes must stay inside this bay.


  Initial success criteria: The notice matches desired state with an empty plan.'
stages.0.brief: 'Restore the managed notice to north-ready. The plan must be empty afterwards.


  Success criteria: The notice matches desired state with an empty plan.'
stages.0.objectives.0.text: The notice matches desired state with an empty plan.
hints.0.text: Run tofu plan and inspect the live notice.
hints.1.text: The configuration still requires north-ready; a manual edit created drift.
hints.2.text: Apply desired state and verify the live content and an empty follow-up plan.
debrief: Someone edited a managed file outside OpenTofu. You restored desired content and verified an
  empty plan.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I compared the live resource ID with the OpenTofu state.
