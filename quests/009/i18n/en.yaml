title: State and drift
brief: |
  The release notice does not match the expected release message. Restore a consistent managed result.

  Work in `~/quest` on the workstation. Supplied inputs: `main.tf`.

  **Requirements:**
  - OpenTofu state contains:
    - `local_file.notice`
  - Files in `~/quest` on the workstation:
    - `notice.txt`: `north-ready`
  - `tofu plan` exits with code `0` and reports no changes.

  **Verify yourself before Check & finish:**
  Run these observation commands from `~/quest` on the workstation.
  - `tofu state list` — Expected: the state addresses listed in Requirements.
  - `cat notice.txt` — Expected: the notice reads `north-ready`.
  - `tofu plan -input=false -detailed-exitcode -no-color` — Expected: no changes, exit code `0`.
stages.0.brief: |
  The managed notice must match the required message with no pending changes.
stages.0.objectives.0.text: The state tracks `local_file.notice`.
stages.0.objectives.1.text: '`notice.txt` contains `north-ready`.'
stages.0.objectives.2.text: '`tofu plan` exits 0 with no changes.'
hints.0.text: Run tofu plan and inspect the live notice.
hints.1.text: The configuration still requires north-ready; a manual edit created drift.
hints.2.text: Apply desired state and verify the live content and an empty follow-up plan.
debrief: Someone edited a managed file outside OpenTofu. You restored desired content and verified an
  empty plan.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
