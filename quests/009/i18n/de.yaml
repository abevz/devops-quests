title: Zustand und Drift
brief: |
  Die Freigabemeldung entspricht nicht der erwarteten Stationsmeldung. Stellen Sie einen konsistenten verwalteten Zustand her.

  Arbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte Eingabedateien: `main.tf`.

  **Anforderungen:**
  - Der OpenTofu-State enthält:
    - `local_file.notice`
  - Dateien in `~/quest` auf der Workstation:
    - `notice.txt`: `north-ready`
  - `tofu plan` endet mit Code `0` und meldet keine Änderungen.

  **Vor Check & finish selbst prüfen:**
  Führen Sie diese Beobachtungsbefehle in `~/quest` auf der Workstation aus.
  - `tofu state list` — Erwartet: die unter Anforderungen genannten State-Adressen.
  - `cat notice.txt` — Erwartet: Die Meldung lautet `north-ready`.
  - `tofu plan -input=false -detailed-exitcode -no-color` — Erwartet: keine Änderungen, Exit-Code `0`.
stages.0.brief: |
  Die verwaltete Meldung muss dem geforderten Text entsprechen, ohne ausstehende Änderungen.
stages.0.objectives.0.text: Der State enthält `local_file.notice`.
stages.0.objectives.1.text: '`notice.txt` enthält `north-ready`.'
stages.0.objectives.2.text: '`tofu plan` endet mit Exit-Code 0 ohne Änderungen.'
hints.0.text: Führen Sie die Live-Benachrichtigung tofu plan und inspect aus.
hints.1.text: Die Konfiguration erfordert weiterhin north-ready; Eine manuelle Bearbeitung führte zu einer
  Drift.
hints.2.text: Wenden Sie den gewünschten Status an und überprüfen Sie den Live-Inhalt und ein leeres Follow-up
  plan.
debrief: Jemand hat eine verwaltete Datei außerhalb von OpenTofu bearbeitet. Sie haben den gewünschten
  Inhalt wiederhergestellt und einen leeren plan überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe die Live-Ressource ID mit dem Status OpenTofu verglichen.
