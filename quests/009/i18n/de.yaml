title: Zustand und Drift
brief: "Die Freigabemeldung entspricht nicht der erwarteten Stationsmeldung. Stellen Sie einen konsistenten\
  \ verwalteten Zustand her.\n\nArbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte Eingabedateien:\
  \ `main.tf`.\n\n**Anforderungen:**\n- Der OpenTofu-State enthält:\n  - `local_file.notice`\n- Dateien in\
  \ `~/quest` auf der Workstation:\n  - `notice.txt`: `north-ready`\n- Ein detaillierter Plan meldet keine\
  \ ausstehenden Infrastrukturänderungen und endet mit Code `0`.\n"
stages.0.brief: Die verwaltete Meldung muss dem geforderten Text entsprechen, ohne ausstehende Änderungen.
stages.0.objectives.0.text: Der State enthält `local_file.notice`.
stages.0.objectives.1.text: '`notice.txt` enthält `north-ready`.'
stages.0.objectives.2.text: OpenTofu meldet keine ausstehenden Infrastrukturänderungen.
hints.0.text: Deklarierter Sollzustand und tatsächlicher Inhalt können voneinander abweichen.
hints.1.text: 'Führen Sie tofu plan aus und prüfen Sie den aktuellen Inhalt der Hinweisdatei.


  Die Konfiguration erfordert weiterhin north-ready; Eine manuelle Bearbeitung führte zu einer Drift.


  Prüfen Sie die mitgelieferten Eingaben und den aktuellen verwalteten Zustand:


  ```sh

  cat main.tf

  tofu show -no-color

  tofu plan -input=false -no-color

  ```'
hints.2.text: 'Wenden Sie den gewünschten Status an und überprüfen Sie den Live-Inhalt und ein leeres Follow-up
  plan.


  Prüfen Sie das beobachtete Ergebnis:


  - `tofu state list` — Erwartet: die unter Anforderungen genannten State-Adressen.


  - `cat notice.txt` — Erwartet: Die Meldung lautet `north-ready`.


  - `tofu plan -input=false -detailed-exitcode -no-color` — Erwartet: keine Änderungen, Exit-Code `0`.'
debrief: Jemand hat eine verwaltete Datei außerhalb von OpenTofu bearbeitet. Sie haben den gewünschten Inhalt
  wiederhergestellt und einen leeren plan überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe die Live-Ressource ID mit dem Status OpenTofu verglichen.
