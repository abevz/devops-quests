title: Zustand und Drift
brief: 'Sie sind dem Betrieb SignalRail beigetreten. Eine lokale Freigabemarkierung wurde von Hand bearbeitet.
  Arbeiten Sie in ~/quest.. Bewahren Sie alle Änderungen in diesem Trainingsbereich auf.


  Eingaben in `~/quest`: `main.tf`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur die bereitgestellten Dateien,
  vorinstallierten Bilder und privaten Dienste. Alle Änderungen müssen innerhalb dieser Bucht bleiben.


  Anfängliche Erfolgskriterien: Der Hinweis entspricht dem gewünschten Status mit einem leeren plan.'
stages.0.brief: 'Stellen Sie den verwalteten Hinweis auf north-ready wieder her. Der plan muss danach
  leer sein.


  Erfolgskriterium: Der Hinweis entspricht dem gewünschten Status mit einem leeren plan.'
stages.0.objectives.0.text: Der Hinweis entspricht dem gewünschten Status mit einem leeren plan.
hints.0.text: Führen Sie die Live-Benachrichtigung tofu plan und inspect aus.
hints.1.text: Die Konfiguration erfordert weiterhin north-ready; Eine manuelle Bearbeitung führte zu einer
  Drift.
hints.2.text: Wenden Sie den gewünschten Status an und überprüfen Sie den Live-Inhalt und ein leeres Follow-up
  plan.
debrief: Jemand hat eine verwaltete Datei außerhalb von OpenTofu bearbeitet. Sie haben den gewünschten
  Inhalt wiederhergestellt und einen leeren plan überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe die Live-Ressource ID mit dem Status OpenTofu verglichen.
