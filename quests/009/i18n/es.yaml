title: Estado y deriva
brief: "El aviso de versión no coincide con el mensaje esperado de la estación. Recupera un estado gestionado\
  \ coherente.\n\nTrabaja en `~/quest` en la workstation. Archivos de entrada suministrados: `main.tf`.\n\n\
  **Requisitos:**\n- El estado de OpenTofu contiene:\n  - `local_file.notice`\n- Archivos en `~/quest` en la\
  \ workstation:\n  - `notice.txt`: `north-ready`\n- Un plan detallado no muestra cambios de infraestructura\
  \ pendientes y termina con código `0`.\n"
stages.0.brief: El aviso gestionado debe contener el mensaje requerido, sin cambios pendientes.
stages.0.objectives.0.text: El state contiene `local_file.notice`.
stages.0.objectives.1.text: '`notice.txt` contiene `north-ready`.'
stages.0.objectives.2.text: OpenTofu no informa cambios de infraestructura pendientes.
hints.0.text: El estado deseado declarado y el contenido real pueden diferir.
hints.1.text: 'Ejecuta `tofu plan` e inspecciona el contenido actual del archivo del aviso.


  La configuración aún requiere north-ready; una edición manual creó una deriva.


  Inspecciona las entradas suministradas y el estado gestionado actual:


  ```sh

  cat main.tf

  tofu show -no-color

  tofu plan -input=false -no-color

  ```'
hints.2.text: 'Aplique el estado deseado y verifique el contenido en vivo y un seguimiento vacío plan.


  Verifica el resultado observado:


  - `tofu state list` — Se esperan las direcciones de estado indicadas en Requisitos.


  - `cat notice.txt` — Se espera que el aviso contenga `north-ready`.


  - `tofu plan -input=false -detailed-exitcode -no-color` — Se esperan ausencia de cambios y código de salida
  `0`.'
debrief: Alguien editó un archivo administrado fuera de OpenTofu. Restauraste el contenido deseado y verificaste
  un plan vacío.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Comparé el recurso en vivo ID con el estado OpenTofu.
