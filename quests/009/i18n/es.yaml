title: Estado y deriva
brief: |
  El aviso de versión no coincide con el mensaje esperado de la estación. Recupera un estado gestionado coherente.

  Trabaja en `~/quest` en la workstation. Archivos de entrada suministrados: `main.tf`.

  **Requisitos:**
  - El estado de OpenTofu contiene:
    - `local_file.notice`
  - Archivos en `~/quest` en la workstation:
    - `notice.txt`: `north-ready`
  - `tofu plan` termina con código `0` sin cambios.

  **Verifica antes de Check & finish:**
  Ejecuta estos comandos de observación desde `~/quest` en la workstation.
  - `tofu state list` — Se esperan las direcciones de estado indicadas en Requisitos.
  - `cat notice.txt` — Se espera que el aviso contenga `north-ready`.
  - `tofu plan -input=false -detailed-exitcode -no-color` — Se esperan ausencia de cambios y código de salida `0`.
stages.0.brief: |
  El aviso gestionado debe contener el mensaje requerido, sin cambios pendientes.
stages.0.objectives.0.text: El state contiene `local_file.notice`.
stages.0.objectives.1.text: '`notice.txt` contiene `north-ready`.'
stages.0.objectives.2.text: '`tofu plan` termina con código 0 sin cambios.'
hints.0.text: Ejecute tofu plan y inspect el aviso en vivo.
hints.1.text: La configuración aún requiere north-ready; una edición manual creó una deriva.
hints.2.text: Aplique el estado deseado y verifique el contenido en vivo y un seguimiento vacío plan.
debrief: Alguien editó un archivo administrado fuera de OpenTofu. Restauraste el contenido deseado y verificaste
  un plan vacío.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Comparé el recurso en vivo ID con el estado OpenTofu.
