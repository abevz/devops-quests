title: Estado y deriva
brief: 'Te uniste a las operaciones de SignalRail. Se editó a mano un marcador de lanzamiento local. Trabajar
  en ~/quest. Mantenga todos los cambios dentro de esta bahía de entrenamiento.


  Entradas en `~/quest`: `main.tf`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente los archivos suministrados, las imágenes
  precargadas y los servicios privados. Todos los cambios deben permanecer dentro de esta bahía.


  Criterios de éxito iniciales: el aviso coincide con el estado deseado con un plan vacío.'
stages.0.brief: 'Restaure el aviso administrado en north-ready. El plan debe quedar vacío posteriormente.


  Criterios de éxito: el aviso coincide con el estado deseado con un plan vacío.'
stages.0.objectives.0.text: El aviso coincide con el estado deseado con un plan vacío.
hints.0.text: Ejecute tofu plan y inspect el aviso en vivo.
hints.1.text: La configuración aún requiere north-ready; una edición manual creó una deriva.
hints.2.text: Aplique el estado deseado y verifique el contenido en vivo y un seguimiento vacío plan.
debrief: Alguien editó un archivo administrado fuera de OpenTofu. Restauraste el contenido deseado y verificaste
  un plan vacío.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Comparé el recurso en vivo ID con el estado OpenTofu.
