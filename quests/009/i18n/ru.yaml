title: State и дрейф
brief: |
  Сообщение о выпуске не соответствует ожидаемому сообщению станции. Верните согласованное управляемое состояние.

  Работайте в `~/quest` на workstation. Предоставленные входные файлы: `main.tf`.

  **Требования:**
  - State OpenTofu содержит:
    - `local_file.notice`
  - Файлы в `~/quest` на workstation:
    - `notice.txt`: `north-ready`
  - `tofu plan` завершается с кодом `0` без изменений.

  **Проверьте самостоятельно перед Check & finish:**
  Выполняйте эти команды наблюдения из `~/quest` на workstation.
  - `tofu state list` — Ожидаются адреса state из требований.
  - `cat notice.txt` — Ожидается текст сообщения `north-ready`.
  - `tofu plan -input=false -detailed-exitcode -no-color` — Ожидаются отсутствие изменений и код завершения `0`.
stages.0.brief: |
  Управляемое сообщение должно соответствовать требуемому тексту без ожидающих изменений.
stages.0.objectives.0.text: В state есть `local_file.notice`.
stages.0.objectives.1.text: '`notice.txt` содержит `north-ready`.'
stages.0.objectives.2.text: '`tofu plan` завершается с кодом 0 без изменений.'
hints.0.text: Выполните tofu plan и проверьте фактическое объявление.
hints.1.text: Конфигурация требует north-ready; ручная правка создала дрейф.
hints.2.text: Примените конфигурацию и проверьте содержимое и пустой повторный plan.
debrief: Управляемый файл изменили вне OpenTofu. Вы восстановили содержимое и проверили пустой plan.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я сравнил ID живого ресурса с state OpenTofu.
