title: State и дрейф
brief: 'Вы в команде эксплуатации SignalRail. Маркер выпуска изменили вручную. Работайте в ~/quest. Все
  изменения — только в этой песочнице.


  Входные файлы в `~/quest`: `main.tf`.


  В песочнице нет интернета и внешнего DNS. Используйте только выданные файлы, предварительно загруженные
  образы и приватные сервисы. Все изменения — только в этой песочнице.


  Цели первого этапа: Объявление соответствует конфигурации и plan пуст.'
stages.0.brief: 'Восстановите north-ready. Итоговый plan должен быть пустым.


  Результат проверки: Объявление соответствует конфигурации и plan пуст.'
stages.0.objectives.0.text: Объявление соответствует конфигурации и plan пуст.
hints.0.text: Выполните tofu plan и проверьте фактическое объявление.
hints.1.text: Конфигурация требует north-ready; ручная правка создала дрейф.
hints.2.text: Примените конфигурацию и проверьте содержимое и пустой повторный plan.
debrief: Управляемый файл изменили вне OpenTofu. Вы восстановили содержимое и проверили пустой plan.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я сравнил ID живого ресурса с state OpenTofu.
