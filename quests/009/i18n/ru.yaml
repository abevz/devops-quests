title: State и дрейф
brief: "Сообщение о выпуске не соответствует ожидаемому сообщению станции. Верните согласованное управляемое\
  \ состояние.\n\nРаботайте в `~/quest` на workstation. Предоставленные входные файлы: `main.tf`.\n\n**Требования:**\n\
  - State OpenTofu содержит:\n  - `local_file.notice`\n- Файлы в `~/quest` на workstation:\n  - `notice.txt`:\
  \ `north-ready`\n- Подробный план не содержит ожидающих изменений инфраструктуры и завершается с кодом `0`.\n"
stages.0.brief: Управляемое сообщение должно соответствовать требуемому тексту без ожидающих изменений.
stages.0.objectives.0.text: В state есть `local_file.notice`.
stages.0.objectives.1.text: '`notice.txt` содержит `north-ready`.'
stages.0.objectives.2.text: OpenTofu не сообщает об ожидающих изменениях инфраструктуры.
hints.0.text: Объявленное желаемое состояние и фактическое содержимое могут различаться.
hints.1.text: 'Выполните tofu plan и проверьте фактическое объявление.


  Конфигурация требует north-ready; ручная правка создала дрейф.


  Изучите поставленные входные данные и текущее управляемое состояние:


  ```sh

  cat main.tf

  tofu show -no-color

  tofu plan -input=false -no-color

  ```'
hints.2.text: 'Примените конфигурацию и проверьте содержимое и пустой повторный plan.


  Проверьте наблюдаемый результат:


  - `tofu state list` — Ожидаются адреса state из требований.


  - `cat notice.txt` — Ожидается текст сообщения `north-ready`.


  - `tofu plan -input=false -detailed-exitcode -no-color` — Ожидаются отсутствие изменений и код завершения
  `0`.'
debrief: Управляемый файл изменили вне OpenTofu. Вы восстановили содержимое и проверили пустой plan.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я сравнил ID живого ресурса с state OpenTofu.
