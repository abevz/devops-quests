id: 50
title: title
track: Boss
difficulty: medium
brief: brief
stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    check: 'source platform.env

      git -C repository fetch origin main >/dev/null 2>&1

      test "$(git -C repository branch --show-current)" = main

      test "$(git -C repository rev-parse HEAD)" = "$(git -C repository rev-parse origin/main)"

      test -z "$(git -C repository status --porcelain)"'
  - text: stages.0.objectives.1.text
    check: |-
      dq_probe_output=$(mktemp)
      trap 'rm -f "$dq_probe_output"' EXIT
      set +e
      (
      set -euo pipefail
      set -euo pipefail
      cd ~/quest
      source platform.env
      if ! git -C repository fetch origin main >/dev/null 2>&1; then
        printf '%s\n' 'Published release is unavailable: ✗ [DQ:published]'
        exit 1
      fi
      manifest=$(git -C repository show origin/main:manifests/route.yaml 2>/dev/null || true)
      python3 -I - /dev/fd/3 3<<<"$manifest" <<'DQ_PUBLISHED'
      import sys
      try:
          import yaml
          with open(sys.argv[1]) as stream:
              document=yaml.safe_load(stream)
          value=document.get('data',{}).get('index.html')
          good=isinstance(value,str) and value.rstrip('\n')=='north-50'
      except Exception:
          good=False
      if not good:
          print('Published response content is incorrect: ✗ [DQ:published]')
          raise SystemExit(1)
      DQ_PUBLISHED
      ) >"$dq_probe_output" 2>/dev/null
      dq_probe_status=$?
      set -e
      cat "$dq_probe_output"
      if [ "$dq_probe_status" -ne 0 ] && ! grep -Eq '\[DQ:[a-z0-9_]+\]' "$dq_probe_output"; then
      printf '%s\n' 'Current inputs could not verify this objective: ✗ [DQ:probe_0_1]'
      fi
      rm -f "$dq_probe_output"
      trap - EXIT
      test "$dq_probe_status" -eq 0
  - text: stages.0.objectives.2.text
    keep: true
    check: 'source platform.env

      git -C repository fetch origin main >/dev/null 2>&1

      git -C repository merge-base --is-ancestor "$(cat baseline-commit)" origin/main'
- brief: stages.1.brief
  objectives:
  - text: stages.1.objectives.0.text
    check: |-
      source platform.env
      expected=$(git -C repository ls-remote origin refs/heads/main | cut -f1)
      kubectl get application station -o json | jq -e --arg repo "$GIT_URL" --arg ns "$DQ_NAMESPACE" --arg rev "$expected" '.spec.project=="station" and .spec.source.repoURL==$repo and (.spec.source.path | (startswith("/")|not) and ([splits("/") | select(.!="" and .!=".")]==["manifests"])) and .spec.source.targetRevision=="main" and .spec.destination.namespace==$ns and ((((((.spec.destination.server=="https://kubernetes.default.svc" and ((.spec.destination.name // "")=="" or .spec.destination.name=="in-cluster")) or ((.spec.destination.server // "")=="" and .spec.destination.name=="in-cluster")) and ((.spec.destination.name // "")=="" or .spec.destination.name=="in-cluster")) or ((.spec.destination.server // "")=="" and .spec.destination.name=="in-cluster")) and ((.spec.destination.name // "")=="" or .spec.destination.name=="in-cluster")) or ((.spec.destination.server // "")=="" and .spec.destination.name=="in-cluster")) and .status.sync.revision==$rev and .status.sync.status=="Synced" and .status.health.status=="Healthy"' >/dev/null
  - text: stages.1.objectives.1.text
    keep: true
    check: 'source platform.env

      expected=$(git -C repository ls-remote origin refs/heads/main | cut -f1)

      git -C repository fetch origin main >/dev/null 2>&1

      git -C repository merge-base --is-ancestor "$(cat baseline-commit)" "$expected"'
  - text: stages.1.objectives.2.text
    check: 'kubectl rollout status deployment/board --timeout=3s >/dev/null

      kubectl get deployment board -o json | jq -e ''.metadata.annotations["argocd.argoproj.io/tracking-id"]|length>0''
      >/dev/null'
  - text: stages.1.objectives.3.text
    check: |-
      test "$(kubectl exec deployment/board -c worker -- wget -qO- http://127.0.0.1:8080)" = north-50
hints:
- text: hints.0.text
  guide: cicd-gitops-3
- text: hints.1.text
  guide: cicd-gitops-3
- text: hints.2.text
  guide: cicd-gitops-3
debrief: debrief
phrases:
- phrases.0
- phrases.1
- phrases.2
questions:
- prompt: questions.0.prompt
  points:
  - questions.0.points.0
  - questions.0.points.1
  - questions.0.points.2
- prompt: questions.1.prompt
  points:
  - questions.1.points.0
  - questions.1.points.1
  - questions.1.points.2
facts:
  environment:
  - DQ_NAMESPACE
  - DQ_APP_IMAGE
  - KUBECONFIG
  - TF_CLI_CONFIG_FILE
  files:
  - platform.env
  - repository/manifests/board.yaml
  - repository/manifests/route.yaml
  - application.yaml
  - sync.json
  services: []
book:
  chapter: 11
  section: Private Git delivery incident
  topics:
  - gitops
  - argocd
  - configuration
