id: 50
title: title
track: Boss
difficulty: medium
brief: brief
stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    check: 'source platform.env

      git -C repository fetch origin main >/dev/null 2>&1

      test "$(git -C repository branch --show-current)" = main

      git -C repository show origin/main:manifests/route.json | jq -e ''.data["index.html"]=="north-50"''
      >/dev/null

      git -C repository merge-base --is-ancestor "$(cat baseline-commit)" origin/main

      test "$(git -C repository rev-parse HEAD)" = "$(git -C repository rev-parse origin/main)"

      test -z "$(git -C repository status --porcelain)"'
- brief: stages.1.brief
  objectives:
  - text: stages.1.objectives.0.text
    check: 'source platform.env

      expected=$(git -C repository ls-remote origin refs/heads/main | cut -f1)

      kubectl get application station -o json | jq -e --arg repo "$GIT_URL" --arg ns "$DQ_NAMESPACE" --arg
      rev "$expected" ''.spec.project=="station" and .spec.source.repoURL==$repo and .spec.source.path=="manifests"
      and .spec.source.targetRevision=="main" and .spec.destination.namespace==$ns and .spec.destination.server=="https://kubernetes.default.svc"
      and .status.sync.revision==$rev and .status.sync.status=="Synced" and .status.health.status=="Healthy"''
      >/dev/null

      git -C repository fetch origin main >/dev/null 2>&1

      git -C repository merge-base --is-ancestor "$(cat baseline-commit)" "$expected"

      kubectl rollout status deployment/board --timeout=3s >/dev/null

      kubectl get deployment board -o json | jq -e ''.metadata.annotations["argocd.argoproj.io/tracking-id"]|length>0''
      >/dev/null

      test "$(kubectl exec deployment/board -- wget -qO- http://127.0.0.1:8080)" = north-50'
hints:
- text: hints.0.text
  guide: cicd-gitops-3
- text: hints.1.text
  guide: cicd-gitops-3
- text: hints.2.text
  guide: cicd-gitops-3
debrief: debrief
phrases:
- phrases.0
- phrases.1
- phrases.2
questions:
- prompt: questions.0.prompt
  points:
  - questions.0.points.0
  - questions.0.points.1
  - questions.0.points.2
- prompt: questions.1.prompt
  points:
  - questions.1.points.0
  - questions.1.points.1
  - questions.1.points.2
facts:
  environment:
  - DQ_NAMESPACE
  - DQ_APP_IMAGE
  - KUBECONFIG
  - TF_CLI_CONFIG_FILE
  files:
  - platform.env
  - repository/manifests/board.json
  - repository/manifests/route.json
  - baseline-commit
  - application.json
  - sync.json
  services: []
book:
  chapter: 11
  section: Private Git delivery incident
  topics:
  - gitops
  - argocd
  - configuration
