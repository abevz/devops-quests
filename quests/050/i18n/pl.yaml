title: Prywatna dostawa Git
brief: "Zdalne wydanie i wdrożona aplikacja nie są jeszcze zgodne.\n\nPracuj w `~/quest` na stacji roboczej. Dane\
  \ wejściowe według etapu:\n- Etap 1: `platform.env`, `repository/manifests/board.yaml`, `repository/manifests/route.yaml`,\
  \ `baseline-commit`.\n- Etap 2: `application.yaml`, `sync.json`.\n\n**Wymagania:**\n\n- Etap 1:\n  - Repozytorium\
  \ `repository` na stacji roboczej jest czyste na gałęzi `main`, a jego HEAD odpowiada zdalnej `main`.\n  - Zdalna\
  \ `main` zawiera `manifests/route.yaml`, w którym `index.html` ma wartość `north-50`.\n  - Commit zapisany w `baseline-commit`\
  \ pozostaje przodkiem zdalnej `main`.\n  - Manifest Git to `manifests/route.yaml` w zdalnej `main`; jego kopia\
  \ robocza to `~/quest/repository/manifests/route.yaml` na stacji roboczej. Dostarczony zapis historii to `~/quest/baseline-commit`\
  \ na stacji roboczej.\n- Etap 2:\n  - Application `station` wdraża zdalną `main` z `$GIT_URL` w projekcie `station`\
  \ do `$DQ_NAMESPACE` na `https://kubernetes.default.svc` i zgłasza `Synced` oraz `Healthy` dla tej zdalnej rewizji.\n\
  \  - Commit zapisany w `baseline-commit` pozostaje przodkiem zdalnej `main`.\n  - Deployment `board` kończy rollout\
  \ i ma niepusty identyfikator śledzenia Argo.\n  - Z Deployment `board` adres `http://127.0.0.1:8080` zwraca `north-50`.\n\
  \  - Application używa dostarczonego katalogu manifestów w repozytorium; Deployment ma niepustą adnotację `argocd.argoproj.io/tracking-id`.\n\
  \n**Sprawdź przed Check & finish:**\n\n- Etap 1/2: Kopia robocza jest czysta na `main`; hashe lokalnego HEAD i\
  \ zdalnej `main` są zgodne; manifest `route` zawiera `index.html: north-50`; kontrola pochodzenia kończy się kodem\
  \ `0`.\n\n  ```sh\n  source platform.env\n  git -C repository status --short --branch\n  git -C repository rev-parse\
  \ HEAD\n  git -C repository ls-remote origin refs/heads/main\n  git -C repository show HEAD:manifests/route.yaml\n\
  \  git -C repository merge-base --is-ancestor \"$(cat baseline-commit)\" HEAD\n  ```\n\n- Etap 2: Źródło, cel,\
  \ rewizja oraz stany `Synced` i `Healthy` Application spełniają wymagania; Deployment ma identyfikator śledzenia\
  \ i zakończony rollout.\n\n  ```sh\n  kubectl get application station -o yaml\n  kubectl get deployment board\
  \ -o yaml\n  kubectl rollout status deployment/board --timeout=3s\n  ```\n\n- Etap 2: Konsument otrzymuje `north-50`.\n\
  \n  ```sh\n  kubectl exec deployment/board -- wget -qO- http://127.0.0.1:8080\n  ```\n\nSprawdzane są pochodzenie\
  \ Git, bieżące pola Argo, metadane śledzenia i HTTP; nie dowodzą, który operator wykonał daną zmianę."
debrief: Wydanie zostało odzyskane w Git, a następnie uzgodnione przez prawdziwy kontroler, z niezależnymi sprawdzeniami
  wersji i zachowania aplikacji.
stages.0.brief: Opublikowane wydanie musi zachować zapisane pochodzenie.
stages.1.brief: Opublikowana rewizja musi być widoczna w zdrowym, uzgodnionym wyniku.
hints.0.text: Oddziel odzyskanie wersji Git od jej dostarczenia. Wymagany commit ConfigMap znajduje się na `release-candidate`;
  odtwórz go na `main`, zachowując istniejące pochodzenie.
hints.1.text: Zatwierdź zdalne główne odwołanie przed zapytaniem sterownika do sync.
hints.2.text: Napraw ścieżkę źródłową i powiąż wersję Argo, prześledzone obciążenie i wynik HTTP.
phrases.0: Odzyskałem żądaną konfigurację w prywatnej gałęzi wdrożenia Git.
phrases.1: Skorelowałem zdalne zatwierdzenie z wersją Argo i prześledziłem stan obciążenia.
phrases.2: Zweryfikowałem dostarczone zachowanie, zamiast pozostawiać ręczną naprawę na żywo.
questions.0.points.0: Oczekiwane zdalne zatwierdzenie zawiera sprawdzony manifest.
questions.0.points.1: Kontroler zgłasza tę wersję i monitorowane zasoby w dobrej kondycji.
questions.0.points.2: Żądanie na poziomie aplikacji potwierdza zamierzone zachowanie.
questions.0.prompt: Jakie dowody świadczą o tym, że zamierzona zmiana Git dotarła do aplikacji?
questions.1.points.0: Pożądany stan może nadal zawierać usterkę.
questions.1.points.1: Przyszłe uzgodnienie może cofnąć ręczną zmianę.
questions.1.points.2: Zapisz naprawę w źródle i zweryfikuj uzgodnienie.
questions.1.prompt: Dlaczego edytowanie obciążenia na żywo oznacza słabe, trwałe odzyskiwanie GitOps?
stages.0.objectives.0.text: Repozytorium `repository` na stacji roboczej jest czyste na gałęzi `main`, a jego HEAD
  odpowiada zdalnej `main`.
stages.0.objectives.1.text: Zdalna `main` zawiera `manifests/route.yaml`, w którym `index.html` ma wartość `north-50`.
stages.0.objectives.2.text: Commit zapisany w `baseline-commit` pozostaje przodkiem zdalnej `main`.
stages.1.objectives.0.text: Application `station` wdraża zdalną `main` z `$GIT_URL` w projekcie `station` do `$DQ_NAMESPACE`
  na `https://kubernetes.default.svc` i zgłasza `Synced` oraz `Healthy` dla tej zdalnej rewizji.
stages.1.objectives.1.text: Commit zapisany w `baseline-commit` pozostaje przodkiem zdalnej `main`.
stages.1.objectives.2.text: Deployment `board` kończy rollout i ma niepusty identyfikator śledzenia Argo.
stages.1.objectives.3.text: Z Deployment `board` adres `http://127.0.0.1:8080` zwraca `north-50`.
