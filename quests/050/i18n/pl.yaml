diagnostics.git_state: Drzewo robocze nie jest czyste na main z HEAD równym origin/main lub dane są niedostępne; nadal może być wybrana release-candidate, commit niewysłany albo brak dostępu do origin i środowiska. [Przyczyna i kontrola](guides#guide=cicd-gitops-3&section=delivery-main-state)
diagnostics.published: Zdalne wydanie nie dostarcza north-50 lub nie można go pobrać albo odczytać; zmiana kandydata mogła nie trafić do main, brak dostępu do origin albo manifests/route.yaml jest niedostępny lub błędny. [Przyczyna i kontrola](guides#guide=cicd-gitops-3&section=delivery-published-manifest)
diagnostics.probe_0_1: Kontrola publikacji zatrzymała się przed szczegółową diagnostyką; katalog roboczy, platform.env lub start Pythona mogą być niedostępne przed odczytem zdalnego manifestu. [Przyczyna i kontrola](guides#guide=cicd-gitops-3&section=delivery-observer-inputs)
diagnostics.git_ancestry: Punkt bazowy nie jest przodkiem origin/main lub jest nieczytelny; opublikowana historia mogła zostać zastąpiona, zapisany commit nie istnieje albo środowisko i fetch zawiodły. [Przyczyna i kontrola](guides#guide=cicd-gitops-3&section=delivery-original-history)
diagnostics.argo_release: Application station nie odpowiada opublikowanej rewizji i wymaganemu źródłu/celowi lub jest nieczytelny; przyczyną może być początkowa ścieżka retired, oczekujący sync, niezdrowe zasoby albo błędy środowiska, Git i API. [Przyczyna i kontrola](guides#guide=cicd-gitops-3&section=delivery-argo-release)
diagnostics.remote_ancestry: Punkt bazowy nie jest przodkiem faktycznego zdalnego main lub obserwacja zawiodła; historię mogli zastąpić, baza jest nieczytelna albo środowisko, ls-remote lub fetch zawiodło. [Przyczyna i kontrola](guides#guide=cicd-gitops-3&section=delivery-original-history)
diagnostics.controller_tracking: Deployment board nie zakończył rollout lub nie ma metadanych śledzenia; kontroler mógł go jeszcze nie zastosować, aplikacja jest niezdrowa albo obiekt utworzony ręcznie nie ma adnotacji. [Przyczyna i kontrola](guides#guide=cicd-gitops-3&section=delivery-controller-tracking)
diagnostics.delivery_http: Worker nie zwrócił north-50 na localhost:8080 lub exec zawiódł; opublikowany ConfigMap może nie być zamontowany w aplikacji, nadal podawane są stare dane albo Pod jest niedostępny. [Przyczyna i kontrola](guides#guide=cicd-gitops-3&section=delivery-http-response)
