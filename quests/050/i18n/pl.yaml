title: Prywatna dostawa Git
brief: "Zdalne wydanie i wdrożona aplikacja nie są jeszcze zgodne.\n\nPracuj w `~/quest` na stacji roboczej. Dane\
  \ wejściowe według etapu:\n- Etap 1: `platform.env`, `repository/manifests/board.yaml`, `repository/manifests/route.yaml`.\n\
  - Etap 2: `application.yaml`, `sync.json`.\n\n**Wymagania:**\n\n- Etap 1:\n  - Repozytorium `repository` na stacji\
  \ roboczej jest czyste na gałęzi `main`, a jego HEAD odpowiada zdalnej `main`.\n  - Opublikowane wydanie opisuje\
  \ treść odpowiedzi aplikacji `north-50`.\n  - Pierwotny commit pozostaje przodkiem opublikowanego wydania.\n-\
  \ Etap 2:\n  - Application `station` zgłasza `Synced` i `Healthy` dla opublikowanej rewizji.\n  - Pierwotny commit\
  \ pozostaje przodkiem opublikowanego wydania.\n  - Deployment `board` kończy rollout i ma metadane śledzenia kontrolera.\n\
  \  - Z Deployment `board` adres `http://127.0.0.1:8080` zwraca `north-50`.\n\nSprawdzane są pochodzenie Git, bieżące\
  \ pola Argo, metadane śledzenia i HTTP; nie dowodzą, który operator wykonał daną zmianę."
debrief: Wydanie zostało odzyskane w Git, a następnie uzgodnione przez prawdziwy kontroler, z niezależnymi sprawdzeniami
  wersji i zachowania aplikacji.
stages.0.brief: Opublikowane wydanie musi zachować zapisane pochodzenie.
stages.1.brief: Opublikowana rewizja musi być widoczna w zdrowym, uzgodnionym wyniku.
hints.0.text: Oddziel odzyskanie wersji Git od jej dostarczenia.
hints.1.text: 'Sprawdź zdalną referencję main, zanim zlecisz kontrolerowi synchronizację.


  Sprawdź historię repozytorium i szczegóły uzgadniania kontrolera.


  ```sh

  git -C repository log --all --oneline

  kubectl describe application station

  ```


  Etap 1/2: Sprawdź te definicje zasobów dla tego etapu.


  ```sh

  git -C repository show HEAD:manifests/route.yaml

  ```


  Etap 2: Sprawdź te definicje zasobów dla tego etapu.


  ```sh

  kubectl get application station -o yaml

  kubectl get deployment board -o yaml

  ```'
hints.2.text: |-
  Wymagany commit ConfigMap znajduje się na `release-candidate`; odtwórz go na `main`, zachowując istniejące pochodzenie.

  Napraw ścieżkę źródłową i powiąż wersję Argo, prześledzone obciążenie i wynik HTTP.

  Sprawdź odpowiedni etap po naprawie.

  Etap 1/2: Opublikowany hash odpowiada zapisanemu wydaniu; sprawdzenie pochodzenia, jeśli występuje, kończy się kodem `0`.

  ```sh
  source platform.env
  git -C repository status --short --branch
  git -C repository rev-parse HEAD
  git -C repository ls-remote origin refs/heads/main
  git -C repository merge-base --is-ancestor "$(cat baseline-commit)" HEAD
  ```

  Etap 2: Kontroler zgłasza `Synced` dla oczekiwanej rewizji; w ostatnim etapie zgłasza też `Healthy`, a obciążenie jest gotowe.

  ```sh
  kubectl get application station -o jsonpath='{.status.sync.status} {.status.health.status} {.status.sync.revision}'; printf '\n'
  kubectl rollout status deployment/board --timeout=3s
  ```

  Etap 2: Konsument otrzymuje `north-50`.

  ```sh
  kubectl exec deployment/board -c worker -- wget -qO- http://127.0.0.1:8080
  ```

  Oczekiwane obserwacje dla całego etapu:
  - Etap 1/2: Kopia robocza jest czysta na `main`; hashe lokalnego HEAD i zdalnej `main` są zgodne; manifest `route` zawiera `index.html: north-50`; kontrola pochodzenia kończy się kodem `0`.
  - Etap 2: Źródło, cel, rewizja oraz stany `Synced` i `Healthy` Application spełniają wymagania; Deployment ma identyfikator śledzenia i zakończony rollout.

phrases.0: Odzyskałem żądaną konfigurację w prywatnej gałęzi wdrożenia Git.
phrases.1: Skorelowałem zdalne zatwierdzenie z wersją Argo i prześledziłem stan obciążenia.
phrases.2: Zweryfikowałem dostarczone zachowanie, zamiast pozostawiać ręczną naprawę na żywo.
questions.0.points.0: Oczekiwane zdalne zatwierdzenie zawiera sprawdzony manifest.
questions.0.points.1: Kontroler zgłasza tę wersję i monitorowane zasoby w dobrej kondycji.
questions.0.points.2: Żądanie na poziomie aplikacji potwierdza zamierzone zachowanie.
questions.0.prompt: Jakie dowody świadczą o tym, że zamierzona zmiana Git dotarła do aplikacji?
questions.1.points.0: Pożądany stan może nadal zawierać usterkę.
questions.1.points.1: Przyszłe uzgodnienie może cofnąć ręczną zmianę.
questions.1.points.2: Zapisz naprawę w źródle i zweryfikuj uzgodnienie.
questions.1.prompt: Dlaczego edytowanie obciążenia na żywo oznacza słabe, trwałe odzyskiwanie GitOps?
