title: Prywatna dostawa Git
brief: 'Dwuetapowy incydent z dostawą prywatną. Najpierw odzyskaj zatwierdzenie release-candidate ConfigMap
  na main i opublikuj je bez przepisywania początkowej historii. Następnie napraw incydent związany ze
  ścieżką źródłową Argo i dostarcz tę samą zdalną wersję do sprawnego board. Pracuj nad Git i Argo; ręcznie
  edytowana reakcja na żywo jest niewystarczająca.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `platform.env`, `repository/manifests/board.json`,
  `repository/manifests/route.json`, `baseline-commit`, `application.json`, `sync.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: Czyste lokalne i zdalne main zawiera zatwierdzenie north-50 ConfigMap i
  zachowuje przodka linii bazowej.'
debrief: Wydanie zostało odzyskane w Git, a następnie uzgodnione przez prawdziwy kontroler, z niezależnymi
  sprawdzeniami wersji i zachowania aplikacji.
stages.0.brief: 'Kryteria sukcesu: Czyste lokalne i zdalne main zawiera zatwierdzenie north-50 ConfigMap
  i zachowuje przodka linii bazowej.'
stages.0.objectives.0.text: Czysty lokalny/zdalny main zawiera zatwierdzenie north-50 ConfigMap i zachowuje
  przodka linii bazowej.
stages.1.brief: 'Kryteria sukcesu: Argo zgłasza zamierzoną zdalną wersję Synced/Healthy; jego działający
  board obsługuje north-50.'
stages.1.objectives.0.text: Argo zgłasza zamierzoną zdalną wersję Synced/Healthy; jego działający board
  obsługuje north-50.
hints.0.text: Oddziel odzyskanie wersji Git od jej dostarczenia.
hints.1.text: Zatwierdź zdalne główne odwołanie przed zapytaniem sterownika do sync.
hints.2.text: Napraw ścieżkę źródłową i powiąż wersję Argo, prześledzone obciążenie i wynik HTTP.
phrases.0: Odzyskałem żądaną konfigurację w prywatnej gałęzi wdrożenia Git.
phrases.1: Skorelowałem zdalne zatwierdzenie z wersją Argo i prześledziłem stan obciążenia.
phrases.2: Zweryfikowałem dostarczone zachowanie, zamiast pozostawiać ręczną naprawę na żywo.
questions.0.points.0: Oczekiwane zdalne zatwierdzenie zawiera sprawdzony manifest.
questions.0.points.1: Kontroler zgłasza tę wersję i monitorowane zasoby w dobrej kondycji.
questions.0.points.2: Żądanie na poziomie aplikacji potwierdza zamierzone zachowanie.
questions.0.prompt: Jakie dowody świadczą o tym, że zamierzona zmiana Git dotarła do aplikacji?
questions.1.points.0: Pożądany stan może nadal zawierać usterkę.
questions.1.points.1: Przyszłe uzgodnienie może cofnąć ręczną zmianę.
questions.1.points.2: Zapisz naprawę w źródle i zweryfikuj uzgodnienie.
questions.1.prompt: Dlaczego edytowanie obciążenia na żywo oznacza słabe, trwałe odzyskiwanie GitOps?
