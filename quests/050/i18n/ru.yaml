title: Доставка из частного Git
brief: "Удалённый релиз и развёрнутое приложение ещё не согласованы.\n\nРаботайте в `~/quest` на рабочей станции.\
  \ Входные файлы по этапам:\n- Этап 1: `platform.env`, `repository/manifests/board.yaml`, `repository/manifests/route.yaml`,\
  \ `baseline-commit`.\n- Этап 2: `application.yaml`, `sync.json`.\n\n**Требования:**\n\n- Этап 1:\n  - Рабочая\
  \ копия `repository` на рабочей станции чиста, находится в ветке `main`, а её HEAD совпадает с удалённой `main`.\n\
  \  - Удалённая `main` содержит `manifests/route.yaml`, в котором `index.html` равен `north-50`.\n  - Коммит из\
  \ `baseline-commit` остаётся предком удалённой `main`.\n  - Манифест Git — `manifests/route.yaml` в удалённой\
  \ `main`; рабочая копия — `~/quest/repository/manifests/route.yaml` на рабочей станции. Предоставленная запись\
  \ истории — `~/quest/baseline-commit` на рабочей станции.\n- Этап 2:\n  - Application `station` развёртывает удалённую\
  \ `main` из `$GIT_URL` в проекте `station` в `$DQ_NAMESPACE` на `https://kubernetes.default.svc` и сообщает `Synced`\
  \ и `Healthy` для этой удалённой ревизии.\n  - Коммит из `baseline-commit` остаётся предком удалённой `main`.\n\
  \  - Deployment `board` завершает развёртывание и имеет непустой идентификатор отслеживания Argo.\n  - Из Deployment\
  \ `board` адрес `http://127.0.0.1:8080` возвращает `north-50`.\n  - Application использует предоставленный каталог\
  \ манифестов в репозитории; Deployment имеет непустую аннотацию `argocd.argoproj.io/tracking-id`.\n\n**Проверьте\
  \ себя перед Check & finish:**\n\n- Этап 1/2: Рабочая копия чиста в `main`; хеши локального HEAD и удалённой `main`\
  \ совпадают; манифест `route` содержит `index.html: north-50`; команда проверки предков завершается с кодом `0`.\n\
  \n  ```sh\n  source platform.env\n  git -C repository status --short --branch\n  git -C repository rev-parse HEAD\n\
  \  git -C repository ls-remote origin refs/heads/main\n  git -C repository show HEAD:manifests/route.yaml\n  git\
  \ -C repository merge-base --is-ancestor \"$(cat baseline-commit)\" HEAD\n  ```\n\n- Этап 2: Источник, назначение,\
  \ ревизия, статусы `Synced` и `Healthy` Application соответствуют требованиям; Deployment имеет идентификатор\
  \ отслеживания и завершённое развёртывание.\n\n  ```sh\n  kubectl get application station -o yaml\n  kubectl get\
  \ deployment board -o yaml\n  kubectl rollout status deployment/board --timeout=3s\n  ```\n\n- Этап 2: Потребитель\
  \ получает `north-50`.\n\n  ```sh\n  kubectl exec deployment/board -- wget -qO- http://127.0.0.1:8080\n  ```\n\
  \nПроверяются предки Git, текущие поля Argo, метаданные отслеживания и HTTP; они не доказывают, какой оператор\
  \ выполнил каждое изменение."
debrief: Релиз восстановлен в Git, затем доставлен реальным контроллером; ревизия и поведение приложения проверены
  отдельно.
stages.0.brief: Опубликованный релиз должен сохранять записанную историю предков.
stages.1.brief: Опубликованная ревизия должна отражаться в исправном согласованном результате.
hints.0.text: Разделите восстановление релиза Git и его доставку. Нужный коммит ConfigMap находится в `release-candidate`;
  перенесите его в `main`, сохранив существующую историю предков.
hints.1.text: Проверьте удалённый ref main до запроса sync контроллеру.
hints.2.text: Исправьте путь источника и сопоставьте ревизию Argo, управляемую нагрузку и HTTP-результат.
phrases.0: Я восстановил требуемую конфигурацию в ветке доставки приватного Git.
phrases.1: Я сопоставил удалённый коммит с ревизией Argo и здоровьем управляемой нагрузки.
phrases.2: Я проверил доставленное поведение вместо сохранения ручной live-правки.
questions.0.points.0: Нужный удалённый коммит содержит проверенный манифест.
questions.0.points.1: Контроллер сообщает эту ревизию и исправные управляемые ресурсы.
questions.0.points.2: Запрос к приложению подтверждает нужное поведение.
questions.0.prompt: Какие доказательства подтверждают доставку нужного изменения Git в приложение?
questions.1.points.0: Ошибка может оставаться в требуемом состоянии.
questions.1.points.1: Следующая сверка может отменить ручную правку.
questions.1.points.2: Сохранить исправление в источнике и проверить сверку состояния.
questions.1.prompt: Почему правка live-нагрузки слаба как постоянное восстановление GitOps?
