title: Доставка из частного Git
brief: "Удалённый релиз и развёрнутое приложение ещё не согласованы.\n\nРаботайте в `~/quest` на рабочей станции.\
  \ Входные файлы по этапам:\n- Этап 1: `platform.env`, `repository/manifests/board.yaml`, `repository/manifests/route.yaml`.\n\
  - Этап 2: `application.yaml`, `sync.json`.\n\n**Требования:**\n\n- Этап 1:\n  - Рабочая копия `repository` на\
  \ рабочей станции чиста, находится в ветке `main`, а её HEAD совпадает с удалённой `main`.\n  - Опубликованный\
  \ релиз задаёт содержимое ответа приложения `north-50`.\n  - Исходный коммит остаётся предком опубликованного\
  \ релиза.\n- Этап 2:\n  - Application `station` сообщает `Synced` и `Healthy` для опубликованной ревизии.\n  -\
  \ Исходный коммит остаётся предком опубликованного релиза.\n  - Deployment `board` завершает развёртывание и имеет\
  \ метаданные отслеживания контроллера.\n  - Из Deployment `board` адрес `http://127.0.0.1:8080` возвращает `north-50`.\n\
  \nПроверяются предки Git, текущие поля Argo, метаданные отслеживания и HTTP; они не доказывают, какой оператор\
  \ выполнил каждое изменение."
debrief: Релиз восстановлен в Git, затем доставлен реальным контроллером; ревизия и поведение приложения проверены
  отдельно.
stages.0.brief: Опубликованный релиз должен сохранять записанную историю предков.
stages.1.brief: Опубликованная ревизия должна отражаться в исправном согласованном результате.
hints.0.text: Разделите восстановление релиза Git и его доставку.
hints.1.text: 'Проверьте удалённый ref main до запроса sync контроллеру.


  Изучите историю репозитория и сведения о согласовании контроллера.


  ```sh

  git -C repository log --all --oneline

  kubectl describe application station

  ```


  Этап 1/2: Изучите определения этих ресурсов для данного этапа.


  ```sh

  git -C repository show HEAD:manifests/route.yaml

  ```


  Этап 2: Изучите определения этих ресурсов для данного этапа.


  ```sh

  kubectl get application station -o yaml

  kubectl get deployment board -o yaml

  ```'
hints.2.text: |-
  Нужный коммит ConfigMap находится в `release-candidate`; перенесите его в `main`, сохранив существующую историю предков.

  Исправьте путь источника и сопоставьте ревизию Argo, управляемую нагрузку и HTTP-результат.

  Проверьте соответствующий этап после исправления.

  Этап 1/2: Опубликованный хеш совпадает с записанным релизом; проверка предка, если она есть, завершается с кодом `0`.

  ```sh
  source platform.env
  git -C repository status --short --branch
  git -C repository rev-parse HEAD
  git -C repository ls-remote origin refs/heads/main
  git -C repository merge-base --is-ancestor "$(cat baseline-commit)" HEAD
  ```

  Этап 2: Контроллер сообщает `Synced` для ожидаемой ревизии; на последнем этапе также сообщает `Healthy`, нагрузка готова.

  ```sh
  kubectl get application station -o jsonpath='{.status.sync.status} {.status.health.status} {.status.sync.revision}'; printf '\n'
  kubectl rollout status deployment/board --timeout=3s
  ```

  Этап 2: Потребитель получает `north-50`.

  ```sh
  kubectl exec deployment/board -c worker -- wget -qO- http://127.0.0.1:8080
  ```

  Ожидаемые наблюдения для этапа целиком:
  - Этап 1/2: Рабочая копия чиста в `main`; хеши локального HEAD и удалённой `main` совпадают; манифест `route` содержит `index.html: north-50`; команда проверки предков завершается с кодом `0`.
  - Этап 2: Источник, назначение, ревизия, статусы `Synced` и `Healthy` Application соответствуют требованиям; Deployment имеет идентификатор отслеживания и завершённое развёртывание.

phrases.0: Я восстановил требуемую конфигурацию в ветке доставки приватного Git.
phrases.1: Я сопоставил удалённый коммит с ревизией Argo и здоровьем управляемой нагрузки.
phrases.2: Я проверил доставленное поведение вместо сохранения ручной live-правки.
questions.0.points.0: Нужный удалённый коммит содержит проверенный манифест.
questions.0.points.1: Контроллер сообщает эту ревизию и исправные управляемые ресурсы.
questions.0.points.2: Запрос к приложению подтверждает нужное поведение.
questions.0.prompt: Какие доказательства подтверждают доставку нужного изменения Git в приложение?
questions.1.points.0: Ошибка может оставаться в требуемом состоянии.
questions.1.points.1: Следующая сверка может отменить ручную правку.
questions.1.points.2: Сохранить исправление в источнике и проверить сверку состояния.
questions.1.prompt: Почему правка live-нагрузки слаба как постоянное восстановление GitOps?
