title: Доставка из частного Git
brief: 'Инцидент приватной доставки в два этапа. Сначала перенесите коммит ConfigMap
  из release-candidate в main и отправьте его без переписывания исходной истории.
  Затем исправьте путь источника Argo и доставьте ту же удалённую ревизию в исправный
  board. Используйте Git и Argo; ручной правки live-ответа недостаточно.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `platform.env`,
  `repository/manifests/board.json`, `repository/manifests/route.json`, `baseline-commit`,
  `application.json`, `sync.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно
  загруженные образы и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Чистая локальная и удалённая main содержит коммит ConfigMap
  north-50, исходный коммит остаётся предком.'
debrief: Релиз восстановлен в Git, затем доставлен реальным контроллером; ревизия
  и поведение приложения проверены отдельно.
stages.0.brief: 'Результат проверки: Чистая локальная и удалённая main содержит коммит
  ConfigMap north-50, исходный коммит остаётся предком.'
stages.0.objectives.0.text: Чистая локальная и удалённая main содержит коммит ConfigMap
  north-50, исходный коммит остаётся предком.
stages.1.brief: 'Результат проверки: Argo показывает нужную удалённую ревизию Synced/Healthy;
  управляемый им board отвечает north-50.'
stages.1.objectives.0.text: Argo показывает нужную удалённую ревизию Synced/Healthy;
  управляемый им board отвечает north-50.
hints.0.text: Разделите восстановление релиза Git и его доставку.
hints.1.text: Проверьте удалённый ref main до запроса sync контроллеру.
hints.2.text: Исправьте путь источника и сопоставьте ревизию Argo, управляемую нагрузку
  и HTTP-результат.
phrases.0: Я восстановил требуемую конфигурацию в ветке доставки приватного Git.
phrases.1: Я сопоставил удалённый коммит с ревизией Argo и здоровьем управляемой нагрузки.
phrases.2: Я проверил доставленное поведение вместо сохранения ручной live-правки.
questions.0.points.0: Нужный удалённый коммит содержит проверенный манифест.
questions.0.points.1: Контроллер сообщает эту ревизию и исправные управляемые ресурсы.
questions.0.points.2: Запрос к приложению подтверждает нужное поведение.
questions.0.prompt: Какие доказательства подтверждают доставку нужного изменения Git
  в приложение?
questions.1.points.0: Ошибка может оставаться в требуемом состоянии.
questions.1.points.1: Следующая сверка может отменить ручную правку.
questions.1.points.2: Сохранить исправление в источнике и проверить сверку состояния.
questions.1.prompt: Почему правка live-нагрузки слаба как постоянное восстановление
  GitOps?
