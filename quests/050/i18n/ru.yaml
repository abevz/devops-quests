stages.0.objectives.2.text: Коммит из `baseline-commit` остаётся предком удалённой `main`.
stages.1.objectives.0.text: Application `station` развёртывает удалённую `main` из `$GIT_URL` в проекте `station`
  в `$DQ_NAMESPACE` на `https://kubernetes.default.svc` и сообщает `Synced` и `Healthy` для этой удалённой ревизии.
stages.1.objectives.1.text: Коммит из `baseline-commit` остаётся предком удалённой `main`.
