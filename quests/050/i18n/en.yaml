title: Private Git delivery
brief: 'A two-stage private delivery incident. First recover the release-candidate
  ConfigMap commit onto main and publish it without rewriting the initial history.
  After that, repair an Argo source-path incident and deliver the same remote revision
  to a healthy board. Work through Git and Argo; a manually edited live response is
  insufficient.


  Quest files in `~/quest` (some appear in later stages): `platform.env`, `repository/manifests/board.json`,
  `repository/manifests/route.json`, `baseline-commit`, `application.json`, `sync.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images
  and private services. Change only this bay.


  Initial success criteria: Clean local/remote main contains the north-50 ConfigMap
  commit and retains the baseline ancestor.'
debrief: The release was recovered in Git and then reconciled by a real controller,
  with independent checks for revision and application behavior.
stages.0.brief: 'Success criteria: Clean local/remote main contains the north-50 ConfigMap
  commit and retains the baseline ancestor.'
stages.0.objectives.0.text: Clean local/remote main contains the north-50 ConfigMap
  commit and retains the baseline ancestor.
stages.1.brief: 'Success criteria: Argo reports the intended remote revision Synced/Healthy;
  its tracked board serves north-50.'
stages.1.objectives.0.text: Argo reports the intended remote revision Synced/Healthy;
  its tracked board serves north-50.
hints.0.text: Separate recovering the Git release from delivering it.
hints.1.text: Validate the remote main ref before asking the controller to sync.
hints.2.text: Repair the source path and correlate Argo revision, tracked workload
  and HTTP result.
phrases.0: I recovered the desired configuration in the private Git deployment branch.
phrases.1: I correlated the remote commit with Argo revision and tracked workload
  health.
phrases.2: I verified the delivered behavior instead of leaving a manual live repair.
questions.0.points.0: The expected remote commit contains the reviewed manifest.
questions.0.points.1: The controller reports that revision and healthy tracked resources.
questions.0.points.2: An application-level request confirms the intended behavior.
questions.0.prompt: What evidence proves that the intended Git change reached the
  application?
questions.1.points.0: Desired state may still contain the fault.
questions.1.points.1: Future reconciliation can undo the manual change.
questions.1.points.2: Record the repair in the source and verify reconciliation.
questions.1.prompt: Why is editing a live workload a weak permanent GitOps recovery?
