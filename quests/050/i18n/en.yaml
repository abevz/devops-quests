title: Private Git delivery
brief: "The remote release and the deployed application do not yet agree.\n\nWork in `~/quest` on the workstation.\
  \ Inputs by stage:\n- Stage 1: `platform.env`, `repository/manifests/board.yaml`, `repository/manifests/route.yaml`,\
  \ `baseline-commit`.\n- Stage 2: `application.yaml`, `sync.json`.\n\n**Requirements:**\n\n- Stage 1:\n  - The\
  \ workstation `repository` is clean on branch `main`, with its HEAD equal to remote `main`.\n  - Remote `main`\
  \ contains `manifests/route.yaml` with `index.html` equal to `north-50`.\n  - The commit recorded in `baseline-commit`\
  \ remains an ancestor of remote `main`.\n  - The Git manifest is `manifests/route.yaml` in remote `main`; its\
  \ working copy is `~/quest/repository/manifests/route.yaml` on the workstation. The supplied history record is\
  \ `~/quest/baseline-commit` on the workstation.\n- Stage 2:\n  - Application `station` deploys remote `main` from\
  \ `$GIT_URL` in project `station` to `$DQ_NAMESPACE` at `https://kubernetes.default.svc`, and reports `Synced`\
  \ and `Healthy` at that remote revision.\n  - The commit recorded in `baseline-commit` remains an ancestor of\
  \ remote `main`.\n  - Deployment `board` completes its rollout and carries a nonempty Argo tracking ID.\n  - From\
  \ Deployment `board`, `http://127.0.0.1:8080` returns `north-50`.\n  - The Application uses the supplied manifest\
  \ directory in the repository; the Deployment carries a nonempty `argocd.argoproj.io/tracking-id` annotation.\n\
  \n**Verify yourself before Check & finish:**\n\n- Stage 1/2: The checkout is clean on `main`; local HEAD and remote\
  \ `main` hashes agree; the `route` manifest contains `index.html: north-50`; the ancestry command exits `0`.\n\
  \n  ```sh\n  source platform.env\n  git -C repository status --short --branch\n  git -C repository rev-parse HEAD\n\
  \  git -C repository ls-remote origin refs/heads/main\n  git -C repository show HEAD:manifests/route.yaml\n  git\
  \ -C repository merge-base --is-ancestor \"$(cat baseline-commit)\" HEAD\n  ```\n\n- Stage 2: The Application\
  \ source, target, revision, `Synced` and `Healthy` status match Requirements, and the Deployment has its tracking\
  \ ID and completed rollout.\n\n  ```sh\n  kubectl get application station -o yaml\n  kubectl get deployment board\
  \ -o yaml\n  kubectl rollout status deployment/board --timeout=3s\n  ```\n\n- Stage 2: The consumer receives `north-50`.\n\
  \n  ```sh\n  kubectl exec deployment/board -- wget -qO- http://127.0.0.1:8080\n  ```\n\nGit ancestry and current\
  \ Argo fields, tracking metadata and HTTP are checked; they do not prove which operator performed each change."
debrief: The release was recovered in Git and then reconciled by a real controller, with independent checks for
  revision and application behavior.
stages.0.brief: The published release must preserve the recorded ancestry.
stages.1.brief: The published revision must be visible in healthy reconciled output.
hints.0.text: Separate recovering the Git release from delivering it. The desired ConfigMap commit is on `release-candidate`;
  replay it onto `main` while retaining the existing ancestry.
hints.1.text: Validate the remote main ref before asking the controller to sync.
hints.2.text: Repair the source path and correlate Argo revision, tracked workload and HTTP result.
phrases.0: I recovered the desired configuration in the private Git deployment branch.
phrases.1: I correlated the remote commit with Argo revision and tracked workload health.
phrases.2: I verified the delivered behavior instead of leaving a manual live repair.
questions.0.points.0: The expected remote commit contains the reviewed manifest.
questions.0.points.1: The controller reports that revision and healthy tracked resources.
questions.0.points.2: An application-level request confirms the intended behavior.
questions.0.prompt: What evidence proves that the intended Git change reached the application?
questions.1.points.0: Desired state may still contain the fault.
questions.1.points.1: Future reconciliation can undo the manual change.
questions.1.points.2: Record the repair in the source and verify reconciliation.
questions.1.prompt: Why is editing a live workload a weak permanent GitOps recovery?
stages.0.objectives.0.text: The workstation `repository` is clean on branch `main`, with its HEAD equal to remote
  `main`.
stages.0.objectives.1.text: Remote `main` contains `manifests/route.yaml` with `index.html` equal to `north-50`.
stages.0.objectives.2.text: The commit recorded in `baseline-commit` remains an ancestor of remote `main`.
stages.1.objectives.0.text: Application `station` deploys remote `main` from `$GIT_URL` in project `station` to
  `$DQ_NAMESPACE` at `https://kubernetes.default.svc`, and reports `Synced` and `Healthy` at that remote revision.
stages.1.objectives.1.text: The commit recorded in `baseline-commit` remains an ancestor of remote `main`.
stages.1.objectives.2.text: Deployment `board` completes its rollout and carries a nonempty Argo tracking ID.
stages.1.objectives.3.text: From Deployment `board`, `http://127.0.0.1:8080` returns `north-50`.
