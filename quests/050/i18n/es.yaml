title: Entrega privada Git
brief: "La versión remota y la aplicación desplegada aún no coinciden.\n\nTrabaja en `~/quest` en la estación de\
  \ trabajo. Entradas por etapa:\n- Etapa 1: `platform.env`, `repository/manifests/board.yaml`, `repository/manifests/route.yaml`,\
  \ `baseline-commit`.\n- Etapa 2: `application.yaml`, `sync.json`.\n\n**Requisitos:**\n\n- Etapa 1:\n  - El `repository`\
  \ de la estación de trabajo está limpio en la rama `main`, con HEAD igual al `main` remoto.\n  - El `main` remoto\
  \ contiene `manifests/route.yaml` con `index.html` igual a `north-50`.\n  - El commit registrado en `baseline-commit`\
  \ sigue siendo antecesor del `main` remoto.\n  - El manifiesto Git es `manifests/route.yaml` en el `main` remoto;\
  \ su copia de trabajo es `~/quest/repository/manifests/route.yaml` en la estación de trabajo. El registro de historia\
  \ suministrado es `~/quest/baseline-commit` en la estación de trabajo.\n- Etapa 2:\n  - La Application `station`\
  \ despliega el `main` remoto de `$GIT_URL` en el proyecto `station` hacia `$DQ_NAMESPACE` en `https://kubernetes.default.svc`\
  \ e informa `Synced` y `Healthy` en esa revisión remota.\n  - El commit registrado en `baseline-commit` sigue\
  \ siendo antecesor del `main` remoto.\n  - El Deployment `board` completa su rollout y tiene un ID de seguimiento\
  \ Argo no vacío.\n  - Desde el Deployment `board`, `http://127.0.0.1:8080` devuelve `north-50`.\n  - La Application\
  \ usa el directorio de manifiestos suministrado en el repositorio; el Deployment tiene una anotación `argocd.argoproj.io/tracking-id`\
  \ no vacía.\n\n**Compruébalo antes de Check & finish:**\n\n- Etapa 1/2: La copia está limpia en `main`; los hashes\
  \ de HEAD local y `main` remoto coinciden; el manifiesto `route` contiene `index.html: north-50`; la comprobación\
  \ de ascendencia termina con código `0`.\n\n  ```sh\n  source platform.env\n  git -C repository status --short\
  \ --branch\n  git -C repository rev-parse HEAD\n  git -C repository ls-remote origin refs/heads/main\n  git -C\
  \ repository show HEAD:manifests/route.yaml\n  git -C repository merge-base --is-ancestor \"$(cat baseline-commit)\"\
  \ HEAD\n  ```\n\n- Etapa 2: El origen, destino, revisión y estados `Synced` y `Healthy` de la Application cumplen\
  \ los requisitos; el Deployment tiene su ID de seguimiento y un rollout completo.\n\n  ```sh\n  kubectl get application\
  \ station -o yaml\n  kubectl get deployment board -o yaml\n  kubectl rollout status deployment/board --timeout=3s\n\
  \  ```\n\n- Etapa 2: El consumidor recibe `north-50`.\n\n  ```sh\n  kubectl exec deployment/board -- wget -qO-\
  \ http://127.0.0.1:8080\n  ```\n\nSe comprueban ascendencia Git, campos Argo actuales, metadatos de seguimiento\
  \ y HTTP; no prueban qué operador hizo cada cambio."
debrief: La versión se recuperó en Git y luego se reconcilió mediante un controlador real, con comprobaciones independientes
  de revisión y comportamiento de la aplicación.
stages.0.brief: La versión publicada debe conservar la ascendencia registrada.
stages.1.brief: La revisión publicada debe reflejarse en un resultado reconciliado y saludable.
hints.0.text: Separe la recuperación de la versión Git de la entrega. El commit deseado del ConfigMap está en `release-candidate`;
  reprodúcelo sobre `main` conservando la ascendencia existente.
hints.1.text: Valide el control remoto main ref antes de pedirle al controlador que sync.
hints.2.text: Repare la ruta de origen y correlacione la revisión de Argo, la carga de trabajo rastreada y el resultado
  de HTTP.
phrases.0: Recuperé la configuración deseada en la rama de implementación privada Git.
phrases.1: Correlacioné la confirmación remota con la revisión Argo y realicé un seguimiento del estado de la carga
  de trabajo.
phrases.2: Verifiqué el comportamiento entregado en lugar de dejar una reparación manual en vivo.
questions.0.points.0: La confirmación remota esperada contiene el manifiesto revisado.
questions.0.points.1: El controlador informa esa revisión y los recursos rastreados en buen estado.
questions.0.points.2: Una solicitud a nivel de aplicación confirma el comportamiento previsto.
questions.0.prompt: ¿Qué evidencia demuestra que el cambio Git previsto llegó a la aplicación?
questions.1.points.0: El estado deseado aún puede contener la falla.
questions.1.points.1: La conciliación futura puede deshacer el cambio manual.
questions.1.points.2: Registre la reparación en la fuente y verifique la conciliación.
questions.1.prompt: ¿Por qué editar una carga de trabajo en vivo es una recuperación permanente débil de GitOps?
stages.0.objectives.0.text: El `repository` de la estación de trabajo está limpio en la rama `main`, con HEAD igual
  al `main` remoto.
stages.0.objectives.1.text: El `main` remoto contiene `manifests/route.yaml` con `index.html` igual a `north-50`.
stages.0.objectives.2.text: El commit registrado en `baseline-commit` sigue siendo antecesor del `main` remoto.
stages.1.objectives.0.text: La Application `station` despliega el `main` remoto de `$GIT_URL` en el proyecto `station`
  hacia `$DQ_NAMESPACE` en `https://kubernetes.default.svc` e informa `Synced` y `Healthy` en esa revisión remota.
stages.1.objectives.1.text: El commit registrado en `baseline-commit` sigue siendo antecesor del `main` remoto.
stages.1.objectives.2.text: El Deployment `board` completa su rollout y tiene un ID de seguimiento Argo no vacío.
stages.1.objectives.3.text: Desde el Deployment `board`, `http://127.0.0.1:8080` devuelve `north-50`.
