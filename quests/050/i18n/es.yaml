title: Entrega privada Git
brief: "La versión remota y la aplicación desplegada aún no coinciden.\n\nTrabaja en `~/quest` en la estación de\
  \ trabajo. Entradas por etapa:\n- Etapa 1: `platform.env`, `repository/manifests/board.yaml`, `repository/manifests/route.yaml`.\n\
  - Etapa 2: `application.yaml`, `sync.json`.\n\n**Requisitos:**\n\n- Etapa 1:\n  - El `repository` de la estación\
  \ de trabajo está limpio en la rama `main`, con HEAD igual al `main` remoto.\n  - La versión publicada describe\
  \ el contenido de respuesta de la aplicación `north-50`.\n  - El commit original sigue siendo antecesor de la\
  \ versión publicada.\n- Etapa 2:\n  - La Application `station` informa `Synced` y `Healthy` en la revisión publicada.\n\
  \  - El commit original sigue siendo antecesor de la versión publicada.\n  - El Deployment `board` completa su\
  \ rollout y lleva metadatos de seguimiento del controlador.\n  - Desde el Deployment `board`, `http://127.0.0.1:8080`\
  \ devuelve `north-50`.\n\nSe comprueban ascendencia Git, campos Argo actuales, metadatos de seguimiento y HTTP;\
  \ no prueban qué operador hizo cada cambio."
debrief: La versión se recuperó en Git y luego se reconcilió mediante un controlador real, con comprobaciones independientes
  de revisión y comportamiento de la aplicación.
stages.0.brief: La versión publicada debe conservar la ascendencia registrada.
stages.1.brief: La revisión publicada debe reflejarse en un resultado reconciliado y saludable.
hints.0.text: Separe la recuperación de la versión Git de la entrega.
hints.1.text: 'Comprueba la referencia main remota antes de pedir al controlador que sincronice.


  Inspecciona el historial del repositorio y los detalles de reconciliación del controlador.


  ```sh

  git -C repository log --all --oneline

  kubectl describe application station

  ```


  Etapa 1/2: Inspecciona estas definiciones de recursos para esta etapa.


  ```sh

  git -C repository show HEAD:manifests/route.yaml

  ```


  Etapa 2: Inspecciona estas definiciones de recursos para esta etapa.


  ```sh

  kubectl get application station -o yaml

  kubectl get deployment board -o yaml

  ```'
hints.2.text: |-
  El commit deseado del ConfigMap está en `release-candidate`; reprodúcelo sobre `main` conservando la ascendencia existente.

  Repare la ruta de origen y correlacione la revisión de Argo, la carga de trabajo rastreada y el resultado de HTTP.

  Verifica la etapa correspondiente tras repararla.

  Etapa 1/2: El hash publicado coincide con la versión registrada; la comprobación de ascendencia, cuando existe, termina con código `0`.

  ```sh
  source platform.env
  git -C repository status --short --branch
  git -C repository rev-parse HEAD
  git -C repository ls-remote origin refs/heads/main
  git -C repository merge-base --is-ancestor "$(cat baseline-commit)" HEAD
  ```

  Etapa 2: El controlador informa `Synced` en la revisión esperada; en la etapa final también informa `Healthy` y la carga está lista.

  ```sh
  kubectl get application station -o jsonpath='{.status.sync.status} {.status.health.status} {.status.sync.revision}'; printf '\n'
  kubectl rollout status deployment/board --timeout=3s
  ```

  Etapa 2: El consumidor recibe `north-50`.

  ```sh
  kubectl exec deployment/board -c worker -- wget -qO- http://127.0.0.1:8080
  ```

  Observaciones esperadas para la etapa completa:
  - Etapa 1/2: La copia está limpia en `main`; los hashes de HEAD local y `main` remoto coinciden; el manifiesto `route` contiene `index.html: north-50`; la comprobación de ascendencia termina con código `0`.
  - Etapa 2: El origen, destino, revisión y estados `Synced` y `Healthy` de la Application cumplen los requisitos; el Deployment tiene su ID de seguimiento y un rollout completo.

phrases.0: Recuperé la configuración deseada en la rama de implementación privada Git.
phrases.1: Correlacioné la confirmación remota con la revisión Argo y realicé un seguimiento del estado de la carga
  de trabajo.
phrases.2: Verifiqué el comportamiento entregado en lugar de dejar una reparación manual en vivo.
questions.0.points.0: La confirmación remota esperada contiene el manifiesto revisado.
questions.0.points.1: El controlador informa esa revisión y los recursos rastreados en buen estado.
questions.0.points.2: Una solicitud a nivel de aplicación confirma el comportamiento previsto.
questions.0.prompt: ¿Qué evidencia demuestra que el cambio Git previsto llegó a la aplicación?
questions.1.points.0: El estado deseado aún puede contener la falla.
questions.1.points.1: La conciliación futura puede deshacer el cambio manual.
questions.1.points.2: Registre la reparación en la fuente y verifique la conciliación.
questions.1.prompt: ¿Por qué editar una carga de trabajo en vivo es una recuperación permanente débil de GitOps?
stages.0.objectives.0.text: El `repository` de la estación de trabajo está limpio en la rama `main`, con HEAD igual
  al `main` remoto.
stages.0.objectives.1.text: La versión publicada describe el contenido de respuesta de la aplicación `north-50`.
stages.0.objectives.2.text: El commit original sigue siendo antecesor de la versión publicada.
