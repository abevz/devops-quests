stages.1.objectives.1.text: El commit original sigue siendo antecesor de la versión publicada.
stages.1.objectives.2.text: El Deployment `board` completa su rollout y lleva metadatos de seguimiento del controlador.
stages.1.objectives.3.text: Desde el Deployment `board`, `http://127.0.0.1:8080` devuelve `north-50`.
