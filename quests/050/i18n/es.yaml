title: Entrega privada Git
brief: 'Un incidente de entrega privada en dos etapas. Primero recupere el compromiso release-candidate
  ConfigMap en main y publíquelo sin reescribir el historial inicial. Después de eso, repare un incidente
  de ruta de origen Argo y entregue la misma revisión remota a un board en buen estado. Trabaje a través
  de Git y Argo; una respuesta en vivo editada manualmente es insuficiente.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `platform.env`, `repository/manifests/board.json`,
  `repository/manifests/route.json`, `baseline-commit`, `application.json`, `sync.json`.


  La bahía no dispone de Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes
  precargadas y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: Limpiar local/remote main contiene la confirmación north-50 ConfigMap
  y conserva el antecesor de línea base.'
debrief: La versión se recuperó en Git y luego se reconcilió mediante un controlador real, con comprobaciones
  independientes de revisión y comportamiento de la aplicación.
stages.0.brief: 'Criterios de éxito: Limpiar local/remote main contiene la confirmación north-50 ConfigMap
  y conserva el antecesor de línea base.'
stages.0.objectives.0.text: Clean local/remote main contiene la confirmación north-50 ConfigMap y conserva
  el antecesor de línea base.
stages.1.brief: 'Criterios de éxito: Argo informa la revisión remota prevista Synced/Healthy; su board
  con orugas sirve para north-50.'
stages.1.objectives.0.text: Argo informa la revisión remota prevista Synced/Healthy; su board con orugas
  sirve para north-50.
hints.0.text: Separe la recuperación de la versión Git de la entrega.
hints.1.text: Valide el control remoto main ref antes de pedirle al controlador que sync.
hints.2.text: Repare la ruta de origen y correlacione la revisión de Argo, la carga de trabajo rastreada
  y el resultado de HTTP.
phrases.0: Recuperé la configuración deseada en la rama de implementación privada Git.
phrases.1: Correlacioné la confirmación remota con la revisión Argo y realicé un seguimiento del estado
  de la carga de trabajo.
phrases.2: Verifiqué el comportamiento entregado en lugar de dejar una reparación manual en vivo.
questions.0.points.0: La confirmación remota esperada contiene el manifiesto revisado.
questions.0.points.1: El controlador informa esa revisión y los recursos rastreados en buen estado.
questions.0.points.2: Una solicitud a nivel de aplicación confirma el comportamiento previsto.
questions.0.prompt: ¿Qué evidencia demuestra que el cambio Git previsto llegó a la aplicación?
questions.1.points.0: El estado deseado aún puede contener la falla.
questions.1.points.1: La conciliación futura puede deshacer el cambio manual.
questions.1.points.2: Registre la reparación en la fuente y verifique la conciliación.
questions.1.prompt: ¿Por qué editar una carga de trabajo en vivo es una recuperación permanente débil
  de GitOps?
