title: Private Git-Lieferung
brief: 'Ein zweistufiger Vorfall mit privater Zustellung. Stellen Sie zunächst das release-candidate ConfigMap-Commit
  auf main wieder her und veröffentlichen Sie es, ohne den ursprünglichen Verlauf neu zu schreiben. Reparieren
  Sie anschließend einen Argo-Quellpfadvorfall und übermitteln Sie dieselbe Remote-Revision an einen fehlerfreien
  board. Arbeiten Sie durch Git und Argo; Eine manuell bearbeitete Live-Antwort reicht nicht aus.


  Questdateien in `~/quest` (einige erscheinen in späteren Phasen): `platform.env`, `repository/manifests/board.json`,
  `repository/manifests/route.json`, `baseline-commit`, `application.json`, `sync.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Anfängliche Erfolgskriterien: Bereinigen von local/remote main enthält das north-50 ConfigMap-Commit
  und behält den Basislinienvorfahren bei.'
debrief: Die Version wurde in Git wiederhergestellt und dann von einem echten Controller mit unabhängigen
  Prüfungen auf Revision und Anwendungsverhalten abgeglichen.
stages.0.brief: 'Erfolgskriterien: Bereinigen von local/remote main enthält den north-50 ConfigMap-Commit
  und behält den Baseline-Vorfahren bei.'
stages.0.objectives.0.text: Clean local/remote main enthält den north-50 ConfigMap-Commit und behält den
  Baseline-Vorfahren bei.
stages.1.brief: 'Erfolgskriterien: Argo meldet die beabsichtigte Remote-Revision Synced/Healthy; Sein
  verfolgter board bedient north-50.'
stages.1.objectives.0.text: Argo meldet die beabsichtigte Remote-Revision Synced/Healthy; sein verfolgtes
  board bedient north-50.
hints.0.text: Trennen Sie die Wiederherstellung der Git-Version von der Bereitstellung.
hints.1.text: Validieren Sie die Fernbedienung main ref, bevor Sie den Controller auffordern, sync zu
  verwenden.
hints.2.text: Reparieren Sie den Quellpfad und korrelieren Sie die Argo-Revision, die verfolgte Arbeitslast
  und das HTTP-Ergebnis.
phrases.0: Ich habe die gewünschte Konfiguration im privaten Git-Bereitstellungszweig wiederhergestellt.
phrases.1: Ich habe den Remote-Commit mit der Argo-Revision korreliert und den Workload-Zustand verfolgt.
phrases.2: Ich habe das gelieferte Verhalten überprüft, anstatt eine manuelle Live-Reparatur durchzuführen.
questions.0.points.0: Der erwartete Remote-Commit enthält das überprüfte Manifest.
questions.0.points.1: Der Controller meldet die Revision und die fehlerfreien überwachten Ressourcen.
questions.0.points.2: Eine Anfrage auf Anwendungsebene bestätigt das beabsichtigte Verhalten.
questions.0.prompt: Welche Beweise beweisen, dass die beabsichtigte Git-Änderung den Antrag erreicht hat?
questions.1.points.0: Der gewünschte Zustand kann den Fehler noch enthalten.
questions.1.points.1: Eine zukünftige Abstimmung kann die manuelle Änderung rückgängig machen.
questions.1.points.2: Notieren Sie die Reparatur in der Quelle und überprüfen Sie den Abgleich.
questions.1.prompt: Warum ist das Bearbeiten einer Live-Workload eine schwache dauerhafte GitOps-Wiederherstellung?
