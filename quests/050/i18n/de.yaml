title: Private Git-Lieferung
brief: "Das entfernte Release und die ausgelieferte Anwendung stimmen noch nicht überein.\n\nArbeiten Sie in `~/quest`\
  \ auf der Workstation. Eingaben je Phase:\n- Phase 1: `platform.env`, `repository/manifests/board.yaml`, `repository/manifests/route.yaml`.\n\
  - Phase 2: `application.yaml`, `sync.json`.\n\n**Anforderungen:**\n\n- Phase 1:\n  - Das Workstation-Repository\
  \ `repository` ist auf Branch `main` sauber und sein HEAD entspricht dem entfernten `main`.\n  - Das veröffentlichte\
  \ Release beschreibt den Anwendungsantwortinhalt `north-50`.\n  - Der ursprüngliche Commit bleibt ein Vorgänger\
  \ des veröffentlichten Release.\n- Phase 2:\n  - Application `station` meldet `Synced` und `Healthy` bei der veröffentlichten\
  \ Revision.\n  - Der ursprüngliche Commit bleibt ein Vorgänger des veröffentlichten Release.\n  - Deployment `board`\
  \ schließt seinen Rollout ab und trägt Controller-Tracking-Metadaten.\n  - Von Deployment `board` liefert `http://127.0.0.1:8080`\
  \ den Wert `north-50`.\n\nGit-Abstammung, aktuelle Argo-Felder, Tracking-Metadaten und HTTP werden geprüft; sie\
  \ belegen nicht, welcher Bediener die jeweilige Änderung vorgenommen hat."
debrief: Die Version wurde in Git wiederhergestellt und dann von einem echten Controller mit unabhängigen Prüfungen
  auf Revision und Anwendungsverhalten abgeglichen.
stages.0.brief: Das veröffentlichte Release muss die gespeicherte Abstammung bewahren.
stages.1.brief: Die veröffentlichte Revision muss im gesunden abgeglichenen Ergebnis sichtbar sein.
hints.0.text: Trennen Sie die Wiederherstellung der Git-Version von der Bereitstellung.
hints.1.text: 'Prüfen Sie die Referenz main im entfernten Repository, bevor Sie den Controller synchronisieren lassen.


  Prüfen Sie Repository-Historie und Details des Controller-Abgleichs.


  ```sh

  git -C repository log --all --oneline

  kubectl describe application station

  ```


  Phase 1/2: Prüfen Sie diese Ressourcendefinitionen für diese Phase.


  ```sh

  git -C repository show HEAD:manifests/route.yaml

  ```


  Phase 2: Prüfen Sie diese Ressourcendefinitionen für diese Phase.


  ```sh

  kubectl get application station -o yaml

  kubectl get deployment board -o yaml

  ```'
hints.2.text: 'Der gewünschte ConfigMap-Commit liegt auf `release-candidate`; übernehmen Sie ihn nach `main` und
  bewahren Sie die bestehende Abstammung.


  Reparieren Sie den Quellpfad und korrelieren Sie die Argo-Revision, die verfolgte Arbeitslast und das HTTP-Ergebnis.


  Prüfen Sie die jeweilige Phase nach der Reparatur.


  Phase 1/2: Der veröffentlichte Hash entspricht dem aufgezeichneten Release; die Abstammungsprüfung endet, sofern
  vorhanden, mit Code `0`.


  ```sh

  source platform.env

  git -C repository status --short --branch

  git -C repository rev-parse HEAD

  git -C repository ls-remote origin refs/heads/main

  git -C repository merge-base --is-ancestor "$(cat baseline-commit)" HEAD

  ```


  Phase 2: Der Controller meldet `Synced` bei der erwarteten Revision; in der letzten Phase meldet er auch `Healthy`
  und der Workload ist bereit.


  ```sh

  kubectl get application station -o jsonpath=''{.status.sync.status} {.status.health.status} {.status.sync.revision}'';
  printf ''\n''

  kubectl rollout status deployment/board --timeout=3s

  ```


  Phase 2: Der Verbraucher erhält `north-50`.


  ```sh

  kubectl exec deployment/board -- wget -qO- http://127.0.0.1:8080

  ```


  Erwartete Beobachtungen für die gesamte Phase:

  - Phase 1/2: Die Arbeitskopie ist auf `main` sauber; lokaler HEAD und entferntes `main` haben denselben Hash;
  das Manifest `route` enthält `index.html: north-50`; der Abstammungstest endet mit Code `0`.

  - Phase 2: Quelle, Ziel, Revision und Status `Synced` und `Healthy` der Application erfüllen die Anforderungen;
  das Deployment hat seine Tracking-ID und einen abgeschlossenen Rollout.'
phrases.0: Ich habe die gewünschte Konfiguration im privaten Git-Bereitstellungszweig wiederhergestellt.
phrases.1: Ich habe den Remote-Commit mit der Argo-Revision korreliert und den Workload-Zustand verfolgt.
phrases.2: Ich habe das gelieferte Verhalten überprüft, anstatt eine manuelle Live-Reparatur durchzuführen.
questions.0.points.0: Der erwartete Remote-Commit enthält das überprüfte Manifest.
questions.0.points.1: Der Controller meldet die Revision und die fehlerfreien überwachten Ressourcen.
questions.0.points.2: Eine Anfrage auf Anwendungsebene bestätigt das beabsichtigte Verhalten.
questions.0.prompt: Welche Beweise beweisen, dass die beabsichtigte Git-Änderung den Antrag erreicht hat?
questions.1.points.0: Der gewünschte Zustand kann den Fehler noch enthalten.
questions.1.points.1: Eine zukünftige Abstimmung kann die manuelle Änderung rückgängig machen.
questions.1.points.2: Notieren Sie die Reparatur in der Quelle und überprüfen Sie den Abgleich.
questions.1.prompt: Warum ist das Bearbeiten einer Live-Workload eine schwache dauerhafte GitOps-Wiederherstellung?
