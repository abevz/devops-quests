title: Private Git-Lieferung
brief: "Das entfernte Release und die ausgelieferte Anwendung stimmen noch nicht überein.\n\nArbeiten Sie in `~/quest`\
  \ auf der Workstation. Eingaben je Phase:\n- Phase 1: `platform.env`, `repository/manifests/board.yaml`, `repository/manifests/route.yaml`,\
  \ `baseline-commit`.\n- Phase 2: `application.yaml`, `sync.json`.\n\n**Anforderungen:**\n\n- Phase 1:\n  - Das\
  \ Workstation-Repository `repository` ist auf Branch `main` sauber und sein HEAD entspricht dem entfernten `main`.\n\
  \  - Das entfernte `main` enthält `manifests/route.yaml` mit `index.html` gleich `north-50`.\n  - Der in `baseline-commit`\
  \ gespeicherte Commit bleibt ein Vorgänger des entfernten `main`.\n  - Das Git-Manifest liegt als `manifests/route.yaml`\
  \ im entfernten `main`; seine Arbeitskopie ist `~/quest/repository/manifests/route.yaml` auf der Workstation.\
  \ Der bereitgestellte Verlaufsnachweis ist `~/quest/baseline-commit` auf der Workstation.\n- Phase 2:\n  - Application\
  \ `station` liefert das entfernte `main` aus `$GIT_URL` im Projekt `station` nach `$DQ_NAMESPACE` auf `https://kubernetes.default.svc`\
  \ und meldet für diese entfernte Revision `Synced` und `Healthy`.\n  - Der in `baseline-commit` gespeicherte Commit\
  \ bleibt ein Vorgänger des entfernten `main`.\n  - Deployment `board` schließt seinen Rollout ab und trägt eine\
  \ nicht leere Argo-Tracking-ID.\n  - Von Deployment `board` liefert `http://127.0.0.1:8080` den Wert `north-50`.\n\
  \  - Die Application verwendet das bereitgestellte Manifestverzeichnis im Repository; das Deployment trägt eine\
  \ nicht leere Annotation `argocd.argoproj.io/tracking-id`.\n\n**Vor Check & finish selbst prüfen:**\n\n- Phase\
  \ 1/2: Die Arbeitskopie ist auf `main` sauber; lokaler HEAD und entferntes `main` haben denselben Hash; das Manifest\
  \ `route` enthält `index.html: north-50`; der Abstammungstest endet mit Code `0`.\n\n  ```sh\n  source platform.env\n\
  \  git -C repository status --short --branch\n  git -C repository rev-parse HEAD\n  git -C repository ls-remote\
  \ origin refs/heads/main\n  git -C repository show HEAD:manifests/route.yaml\n  git -C repository merge-base --is-ancestor\
  \ \"$(cat baseline-commit)\" HEAD\n  ```\n\n- Phase 2: Quelle, Ziel, Revision und Status `Synced` und `Healthy`\
  \ der Application erfüllen die Anforderungen; das Deployment hat seine Tracking-ID und einen abgeschlossenen Rollout.\n\
  \n  ```sh\n  kubectl get application station -o yaml\n  kubectl get deployment board -o yaml\n  kubectl rollout\
  \ status deployment/board --timeout=3s\n  ```\n\n- Phase 2: Der Verbraucher erhält `north-50`.\n\n  ```sh\n  kubectl\
  \ exec deployment/board -- wget -qO- http://127.0.0.1:8080\n  ```\n\nGit-Abstammung, aktuelle Argo-Felder, Tracking-Metadaten\
  \ und HTTP werden geprüft; sie belegen nicht, welcher Bediener die jeweilige Änderung vorgenommen hat."
debrief: Die Version wurde in Git wiederhergestellt und dann von einem echten Controller mit unabhängigen Prüfungen
  auf Revision und Anwendungsverhalten abgeglichen.
stages.0.brief: Das veröffentlichte Release muss die gespeicherte Abstammung bewahren.
stages.1.brief: Die veröffentlichte Revision muss im gesunden abgeglichenen Ergebnis sichtbar sein.
hints.0.text: Trennen Sie die Wiederherstellung der Git-Version von der Bereitstellung. Der gewünschte ConfigMap-Commit
  liegt auf `release-candidate`; übernehmen Sie ihn nach `main` und bewahren Sie die bestehende Abstammung.
hints.1.text: Validieren Sie die Fernbedienung main ref, bevor Sie den Controller auffordern, sync zu verwenden.
hints.2.text: Reparieren Sie den Quellpfad und korrelieren Sie die Argo-Revision, die verfolgte Arbeitslast und
  das HTTP-Ergebnis.
phrases.0: Ich habe die gewünschte Konfiguration im privaten Git-Bereitstellungszweig wiederhergestellt.
phrases.1: Ich habe den Remote-Commit mit der Argo-Revision korreliert und den Workload-Zustand verfolgt.
phrases.2: Ich habe das gelieferte Verhalten überprüft, anstatt eine manuelle Live-Reparatur durchzuführen.
questions.0.points.0: Der erwartete Remote-Commit enthält das überprüfte Manifest.
questions.0.points.1: Der Controller meldet die Revision und die fehlerfreien überwachten Ressourcen.
questions.0.points.2: Eine Anfrage auf Anwendungsebene bestätigt das beabsichtigte Verhalten.
questions.0.prompt: Welche Beweise beweisen, dass die beabsichtigte Git-Änderung den Antrag erreicht hat?
questions.1.points.0: Der gewünschte Zustand kann den Fehler noch enthalten.
questions.1.points.1: Eine zukünftige Abstimmung kann die manuelle Änderung rückgängig machen.
questions.1.points.2: Notieren Sie die Reparatur in der Quelle und überprüfen Sie den Abgleich.
questions.1.prompt: Warum ist das Bearbeiten einer Live-Workload eine schwache dauerhafte GitOps-Wiederherstellung?
