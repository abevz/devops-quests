id: 100
title: title
track: Boss
difficulty: expert
brief: brief
stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    check: 'source platform.env

      kubectl get application board -o json | jq -e --arg rev "$(cat /run/dq/facts/0/baseline-commit)"
      --arg url "$GIT_URL" ''.spec.source.repoURL==$url and .spec.source.path=="manifests" and .spec.source.targetRevision=="main"
      and .spec.syncPolicy.automated.selfHeal==true and .spec.syncPolicy.automated.prune==true and .status.sync.status=="Synced"
      and .status.sync.revision==$rev'' >/dev/null'
- brief: stages.1.brief
  objectives:
  - text: stages.1.objectives.0.text
    check: 'source platform.env

      git -C repository fetch origin main >/dev/null 2>&1

      test "$(git -C repository rev-parse origin/main)" = "$(cat release-commit)"

      kubectl get application board -o json | jq -e --arg rev "$(cat release-commit)" --arg url "$GIT_URL"
      ''.spec.source.repoURL==$url and .spec.source.path=="manifests" and .spec.source.targetRevision=="main"
      and .spec.syncPolicy.automated.selfHeal==true and .spec.syncPolicy.automated.prune==true and .status.sync.status=="Synced"
      and .status.health.status=="Healthy" and .status.sync.revision==$rev'' >/dev/null

      kubectl rollout status deployment/board --timeout=3s >/dev/null

      test "$(kubectl exec deployment/board -- wget -qO- -T 3 http://board:8080)" = north-100

      image=$(jq -er .image /run/dq/facts/0/private-release.json)

      kubectl get deployment board -o json | jq -e --arg image "$image" ''.spec.template.spec.containers[0].image==$image
      and .spec.template.spec.containers[0].imagePullPolicy=="Always" and .spec.template.spec.imagePullSecrets==[{name:"registry-pull"}]
      and .spec.template.spec.containers[0].env==[{name:"ROUTE_SECRET",valueFrom:{secretKeyRef:{name:"route-secret",key:"value"}}}]''
      >/dev/null

      kubectl get secret route-secret -o json | jq -er .data.value | base64 -d | grep -qx north-secret

      digest=${image##*@}

      kubectl get pods -l app=board -o json | jq -e --arg digest "$digest" ''any(.items[];any(.status.containerStatuses[]?;.ready==true
      and (.imageID|contains($digest))))'' >/dev/null

      curl -fsS -H "X-Vault-Token: $VAULT_READER_TOKEN" "$VAULT_ADDR/v1/secret/data/dispatch" | jq -e
      ''.data.data.value=="north-secret"'' >/dev/null

      test "$(curl -sS -o /dev/null -w ''%{http_code}'' -H "X-Vault-Token: $VAULT_READER_TOKEN" "$VAULT_ADDR/v1/secret/data/other")"
      = 403

      git -C repository show origin/main:manifests/board.json | jq -e --arg image "$image" ''.spec.template.spec.containers[0].image==$image
      and .spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name=="route-secret"'' >/dev/null'
hints:
- text: hints.0.text
  guide: kubernetes-20
- text: hints.1.text
  guide: kubernetes-20
