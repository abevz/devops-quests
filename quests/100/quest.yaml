  - DOCKER_HOST
  - DOCKER_TLS_VERIFY
  - DOCKER_CERT_PATH
  files:
  - platform.env
  - application.json
  - repository/manifests/board.json
  - baseline-commit
  - private-release.json
  - reader.hcl
  - sync-secret.sh
  services: []
book:
