id: 100
title: title
track: Boss
difficulty: expert
brief: brief
stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    check: 'set -euo pipefail

      cd ~/quest

      source platform.env

      failed=0

      app=$(kubectl get application board -o json 2>/dev/null || true)

      rev=$(cat /run/dq/facts/0/baseline-commit 2>/dev/null || true)

      check() { local label=$1 expression=$2; if ! jq -e --arg rev "$rev" --arg url "$GIT_URL" "$expression" <<<"$app"
      >/dev/null 2>&1; then printf ''%s\n'' "application/board $label: ✗"; failed=1; fi; }

      check ''repoURL = GIT_URL [DQ:repo]'' ''.spec.source.repoURL==$url''

      check ''path = manifests [DQ:path]'' ''.spec.source.path=="manifests"''

      check ''targetRevision = main [DQ:target]'' ''.spec.source.targetRevision=="main"''

      check ''selfHeal = true [DQ:selfheal]'' ''.spec.syncPolicy.automated.selfHeal==true''

      check ''prune = true [DQ:prune]'' ''.spec.syncPolicy.automated.prune==true''

      check ''sync status = Synced [DQ:synced]'' ''.status.sync.status=="Synced"''

      if ! test -n "$rev"; then printf ''%s\n'' ''baseline-commit exists: ✗ [DQ:baseline]''; failed=1; fi

      check ''sync revision = baseline-commit [DQ:baseline_revision]'' ''.status.sync.revision==$rev''

      exit "$failed"

      '
- brief: stages.1.brief
  objectives:
  - text: stages.1.objectives.0.text
    check: 'set -euo pipefail

      cd ~/quest

      source platform.env

      failed=0

      if ! git -C repository fetch origin main >/dev/null 2>&1; then printf ''%s\n'' ''git fetch origin main: ✗
      [DQ:fetch]''; failed=1; fi

      rev=$(cat release-commit 2>/dev/null || true)

      if ! test -n "$rev" || ! test "$(git -C repository rev-parse origin/main 2>/dev/null)" = "$rev"; then printf
      ''%s\n'' ''origin/main = release-commit: ✗ [DQ:origin]''; failed=1; fi

      exit "$failed"

      '
  - text: stages.1.objectives.1.text
    check: 'set -euo pipefail

      cd ~/quest

      source platform.env

      failed=0

      if ! git -C repository fetch origin main >/dev/null 2>&1; then printf ''%s\n'' ''git fetch origin main: ✗
      [DQ:fetch]''; failed=1; fi

      image=$(jq -er .image /run/dq/facts/0/private-release.json 2>/dev/null || true)

      manifest=$(git -C repository show origin/main:manifests/board.yaml 2>/dev/null | python3 -c ''import sys,json,yaml;
      print(json.dumps(yaml.safe_load(sys.stdin)))'' 2>/dev/null || true)

      if ! jq -e --arg image "$image" ''.spec.template.spec.containers[0].image==$image'' <<<"$manifest" >/dev/null
      2>&1; then printf ''%s\n'' ''Git manifest first image = frozen image: ✗ [DQ:git_image]''; failed=1; fi

      if ! jq -e ''.spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name=="route-secret"'' <<<"$manifest"
      >/dev/null 2>&1; then printf ''%s\n'' ''Git manifest first env secret reference = route-secret: ✗ [DQ:git_env]'';
      failed=1; fi

      exit "$failed"

      '
  - text: stages.1.objectives.2.text
    check: 'set -euo pipefail

      cd ~/quest

      source platform.env

      failed=0

      rev=$(cat release-commit 2>/dev/null || true)

      app=$(kubectl get application board -o json 2>/dev/null || true)

      check_app() { local label=$1 expression=$2; if ! jq -e --arg rev "$rev" --arg url "$GIT_URL" "$expression"
      <<<"$app" >/dev/null 2>&1; then printf ''%s\n'' "application/board $label: ✗"; failed=1; fi; }

      check_app ''repoURL = GIT_URL [DQ:repo]'' ''.spec.source.repoURL==$url''

      check_app ''path = manifests [DQ:path]'' ''.spec.source.path=="manifests"''

      check_app ''targetRevision = main [DQ:target]'' ''.spec.source.targetRevision=="main"''

      check_app ''selfHeal = true [DQ:selfheal]'' ''.spec.syncPolicy.automated.selfHeal==true''

      check_app ''prune = true [DQ:prune]'' ''.spec.syncPolicy.automated.prune==true''

      check_app ''sync status = Synced [DQ:synced]'' ''.status.sync.status=="Synced"''

      check_app ''health status = Healthy [DQ:health]'' ''.status.health.status=="Healthy"''

      check_app ''sync revision = release-commit [DQ:release_revision]'' ''.status.sync.revision==$rev''

      exit "$failed"

      '
  - text: stages.1.objectives.3.text
    check: 'set -euo pipefail

      cd ~/quest

      source platform.env

      failed=0

      image=$(jq -er .image /run/dq/facts/0/private-release.json 2>/dev/null || true)

      board=$(kubectl get deployment board -o json 2>/dev/null || true)

      check_board() { local label=$1 expression=$2; if ! jq -e --arg image "$image" "$expression" <<<"$board" >/dev/null
      2>&1; then printf ''%s\n'' "deployment/board $label: ✗"; failed=1; fi; }

      if ! test -n "$image"; then printf ''%s\n'' ''private-release.json image exists: ✗ [DQ:image]''; failed=1;
      fi

      check_board ''first image = frozen image [DQ:board_image]'' ''.spec.template.spec.containers[0].image==$image''

      check_board ''first imagePullPolicy = Always [DQ:board_policy]'' ''.spec.template.spec.containers[0].imagePullPolicy=="Always"''

      check_board ''imagePullSecrets = [registry-pull] [DQ:board_secret]'' ''.spec.template.spec.imagePullSecrets==[{name:"registry-pull"}]''

      check_board ''first env = ROUTE_SECRET from route-secret/value only [DQ:board_env]'' ''.spec.template.spec.containers[0].env==[{name:"ROUTE_SECRET",valueFrom:{secretKeyRef:{name:"route-secret",key:"value"}}}]''

      exit "$failed"

      '
  - text: stages.1.objectives.4.text
    check: 'set -euo pipefail

      cd ~/quest

      source platform.env

      failed=0

      if ! test "$(kubectl get secret route-secret -o json 2>/dev/null | jq -er .data.value 2>/dev/null | base64
      -d 2>/dev/null)" = north-secret; then printf ''%s\n'' ''secret/route-secret value = north-secret: ✗ [DQ:secret]'';
      failed=1; fi

      exit "$failed"

      '
  - text: stages.1.objectives.5.text
    check: 'set -euo pipefail

      cd ~/quest

      source platform.env

      failed=0

      umask 077

      header=$(mktemp)

      trap ''rm -f "$header"'' EXIT

      printf ''X-Vault-Token: %s\n'' "$VAULT_READER_TOKEN" > "$header"

      if ! curl -fsS --max-time 3 -H @"$header" "$VAULT_ADDR/v1/secret/data/dispatch" 2>/dev/null | jq -e ''.data.data.value=="north-secret"''
      >/dev/null 2>&1; then printf ''%s\n'' ''Vault reader dispatch value = north-secret: ✗ [DQ:reader]''; failed=1;
      fi

      if ! test "$(curl -sS --max-time 3 -o /dev/null -w ''%{http_code}'' -H @"$header" "$VAULT_ADDR/v1/secret/data/other"
      2>/dev/null)" = 403; then printf ''%s\n'' ''Vault reader other path HTTP 403: ✗ [DQ:denied]''; failed=1; fi

      exit "$failed"

      '
  - text: stages.1.objectives.6.text
    check: 'set -euo pipefail

      cd ~/quest

      source platform.env

      failed=0

      if ! kubectl rollout status deployment/board --timeout=3s >/dev/null 2>&1; then printf ''%s\n'' ''deployment/board
      rollout complete: ✗ [DQ:rollout]''; failed=1; fi

      image=$(jq -er .image /run/dq/facts/0/private-release.json 2>/dev/null || true)

      if ! test -n "$image"; then printf ''%s\n'' ''private-release.json image exists: ✗ [DQ:image]''; failed=1;
      fi

      digest=${image##*@}

      if ! test -n "$image" || ! kubectl get pods -l app=board -o json 2>/dev/null | jq -e --arg digest "$digest"
      ''any(.items[];any(.status.containerStatuses[]?;.ready==true and (.imageID|contains($digest))))'' >/dev/null
      2>&1; then printf ''%s\n'' ''ready board container imageID contains frozen digest: ✗ [DQ:image_id]''; failed=1;
      fi

      exit "$failed"

      '
  - text: stages.1.objectives.7.text
    check: 'set -euo pipefail

      cd ~/quest

      source platform.env

      failed=0

      if ! test "$(timeout 4s kubectl exec --pod-running-timeout=2s deployment/board -- wget -qO- -T 3 http://board:8080
      2>/dev/null)" = north-100; then printf ''%s\n'' ''board:8080 = north-100: ✗ [DQ:http]''; failed=1; fi

      exit "$failed"

      '
hints:
- text: hints.0.text
  guide: gitops-delivery
- text: hints.1.text
  guide: gitops-delivery
- text: hints.2.text
  guide: vault-recovery
debrief: debrief
phrases:
- phrases.0
- phrases.1
- phrases.2
questions:
- prompt: questions.0.prompt
  points:
  - questions.0.points.0
  - questions.0.points.1
- prompt: questions.1.prompt
  points:
  - questions.1.points.0
  - questions.1.points.1
facts:
  environment:
  - DQ_NAMESPACE
  - DQ_APP_IMAGE
  - KUBECONFIG
  - TF_CLI_CONFIG_FILE
  - DOCKER_HOST
  - DOCKER_TLS_VERIFY
  - DOCKER_CERT_PATH
  files:
  - platform.env
  - application.yaml
  - repository/manifests/board.yaml
  - private-release.json
  - reader.hcl
  - sync-secret.sh
  services: []
book:
  chapter: 11
  topic: Full platform recovery
immutable:
  0:
  - baseline-commit
  - private-release.json
