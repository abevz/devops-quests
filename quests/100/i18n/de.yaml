title: Vollständige Plattformwiederherstellung
brief: 'Die Lieferkette der privaten Plattform (Gitea → privat registry → Argo CD → Vault → board Workload)
  schlägt in zwei Phasen fehl. In Stufe eins gleicht Argo CD den falschen Repository-Pfad ab: Stellen
  Sie den Abgleich des Verzeichnisses manifests auf der main-Revision wieder her und behalten Sie dabei
  die automatisierten Werte self-heal und prune bei. In Stufe zwei schlägt der synchronisierte board-Workload
  immer noch bei runtime fehl: Wiederherstellen des privaten Image-Pull-Zugriffs und der geringsten Berechtigung
  zur Vault-Geheimzustellung (schreibgeschützter Zugriff auf den dispatch KV-Pfad), ohne das unveränderliche
  Image zu ändern oder Secret-Referenzen im Git-Manifest. Jeder Dienst gehört nur zu dieser Einwegbucht.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `platform.env`, `application.json`,
  `repository/manifests/board.json`, `baseline-commit`, `private-release.json`, `reader.hcl`, `sync-secret.sh`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: Argo gleicht den korrekten privaten Git-Pfad und die ursprüngliche main-Revision
  unter Beibehaltung der Automatisierung ab; runtime credentials sind der nächste Vorfall.'
debrief: Der vollständige Lieferpfad Git → registry → Argo CD → Vault wurde wiederhergestellt, ohne den
  desired-Status zu umgehen oder den geheimen Zugriff zu erweitern.
stages.0.brief: 'Erfolgskriterien: Argo gleicht den korrekten privaten Git-Pfad und die ursprüngliche
  main-Revision unter Beibehaltung der Automatisierung ab; runtime credentials sind der nächste Vorfall.'
stages.0.objectives.0.text: Argo gleicht den korrekten privaten Git-Pfad und die ursprüngliche main-Revision
  unter Beibehaltung der Automatisierung ab; runtime credentials sind der nächste Vorfall.
stages.1.brief: 'Erfolgskriterien: Git, unveränderliches registry-Image, Argo desired-Status und Vault-Daten
  mit geringsten Rechten stimmen überein; der echte board bedient north-100.'
stages.1.objectives.0.text: Git, unveränderliches registry-Bild, Argo desired-Zustand und geringste Privilegien
  Vault-Daten stimmen überein; Der echte board bedient north-100.
hints.0.text: 'Stufe 1: inspect application.json – Argo CD zeigt bei der Überarbeitung auf einen retired
  Git-Pfad statt auf source.path=manifests main mit automatisiertem self-heal und prune.'
hints.1.text: 'Stufe 2: Ein Synced Application ist immer noch fehlerhaft, da der private registry pull
  Secret fehlt und reader.hcl auf den falschen Vault verweist KV Pfad.'
hints.2.text: Stellen Sie die Registrierung pull Secret von private-release.json wieder her, legen Sie
  reader.hcl auf schreibgeschützten Bereich dispatch fest, führen Sie sync-secret.sh aus und überprüfen
  Sie das laufende Image digest und HTTP-Antwort.
phrases.0: Ich habe Fehler an jeder Liefergrenze isoliert.
phrases.1: Ich habe die Abstimmung zwischen immutable-Bild identity und Git beibehalten.
phrases.2: Ich habe den geheimen Zugriff mit den geringsten Privilegien und einen echten End-to-End-Service
  überprüft.
questions.0.points.0: Der angewendete desired-Status kann weiterhin auf nicht verfügbare Bilder oder Secrets
  verweisen.
questions.0.points.1: Überprüfen Sie sync, health, events und echte Anfragen separat.
questions.0.prompt: Warum kann ein Application Synced sein, während seine Pods ausfallen?
questions.1.points.0: Korrekte Quellrevision, Ausführung von digest und Gültigkeitsbereich runtime credentials.
questions.1.points.1: Eine sinnvolle Anfrage gelingt über den wiederhergestellten Dienst.
questions.1.prompt: Was überprüft eine vollständige Wiederherstellung über einen green-Controller hinaus?
