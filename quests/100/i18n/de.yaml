title: Vollständige Plattformwiederherstellung
brief: "Die private Auslieferungskette stellt das gewünschte Release noch nicht bereit. Veröffentlichte Revision,\
  \ laufendes Artefakt und Secret-Zugriff müssen übereinstimmen.\n\nArbeiten Sie in `~/quest` auf der Workstation.\
  \ Eingaben je Phase:\n- Phase 1: `platform.env`, `application.yaml`, `repository/manifests/board.yaml`, `repository/manifests/service.yaml`,\
  \ `release-commit`, `private-release.json`.\n- Phase 2: `reader.hcl`, `sync-secret.sh`.\n\n**Anforderungen:**\n\
  \n- Phase 1:\n  - Application `board` meldet `Synced` bei der vorgesehenen veröffentlichten Revision. Sie korrigiert\
  \ Drift automatisch und entfernt Ressourcen, die im gewünschten Release nicht mehr vorhanden sind.\n- Phase 2:\n\
  \  - Das entfernte `main` entspricht der in `release-commit` gespeicherten Revision.\n  - Der veröffentlichte\
  \ Workload nutzt das mitgelieferte eingefrorene Image und bezieht sein Laufzeit-Secret über die vorgesehene Secret-Referenz.\n\
  \  - Application `board` meldet `Synced` und `Healthy` bei der veröffentlichten Release-Revision. Sie korrigiert\
  \ Drift automatisch und entfernt Ressourcen, die im gewünschten Release nicht mehr vorhanden sind.\n  - Deployment\
  \ `board` nutzt das mitgelieferte eingefrorene Image, bewahrt seine ursprünglichen Pull-Vorgaben und bezieht sein\
  \ Laufzeit-Secret ohne eingebetteten Wert.\n  - Das Workload-Secret enthält den Wert des vorgesehenen Vault-Eintrags.\n\
  \  - Das Vault-Zugriffstoken liefert das vorgesehene Auslieferungs-Secret und verweigert einen fremden Dateneintrag.\n\
  \  - Deployment `board` schließt seinen Rollout mit einem bereiten Anwendungscontainer ab, der den mitgelieferten\
  \ eingefrorenen Image-Digest verwendet.\n  - Von Deployment `board` liefert `http://board:8080` den Wert `north-100`.\n\
  \nDie Prüfung beobachtet ausgewählte Konfiguration, Werte und zwei Vault-Pfade; sie belegt weder die gesamte Git-Historie\
  \ noch die Sperrung aller anderen Vault-Pfade."
debrief: Die Prüfungen bestätigten ausgewählte Git-, Argo-, Board- und Vault-Ergebnisse; sie beweisen weder den
  vollständigen Policy-Umfang noch eine unveränderte Historie.
stages.0.brief: Bewahren Sie die ursprüngliche Revision beim Wiederherstellen des Abgleichs.
stages.1.brief: Das veröffentlichte Release muss an Auslieferungs- und Laufzeitgrenzen übereinstimmen.
hints.0.text: Eine abgeglichene Quelle und eine gesunde Laufzeit sind getrennte Ergebnisse. Vergleichen Sie Auslieferungs-
  und Verbrauchergrenze.
hints.1.text: 'Stufe 1: inspect application.yaml – Argo CD zeigt bei der Überarbeitung auf einen retired Git-Pfad
  statt auf source.path=manifests main mit automatisiertem self-heal und prune.


  Stufe 2: Ein Synced Application ist immer noch fehlerhaft, da der private registry pull Secret fehlt und reader.hcl
  auf den falschen Vault verweist KV Pfad.


  Prüfen Sie mitgelieferte Definitionen, Ressourcenbeschreibungen und Ereignisse der jeweiligen Phase.


  ```sh

  git -C repository log --all --oneline

  cat reader.hcl

  kubectl describe application board

  kubectl describe deployment board

  kubectl describe pod -l app=board

  ```


  Phase 1/2: Prüfen Sie diese Ressourcendefinitionen für diese Phase.


  ```sh

  kubectl get application board -o yaml

  kubectl get deployment board -o yaml

  kubectl get pods -l app=board -o yaml

  ```


  Phase 2: Prüfen Sie diese Ressourcendefinitionen für diese Phase.


  ```sh

  git -C repository show origin/main:manifests/board.yaml

  ```'
hints.2.text: 'Stellen Sie die Registrierung pull Secret von private-release.json wieder her, legen Sie reader.hcl
  auf schreibgeschützten Bereich dispatch fest, führen Sie sync-secret.sh aus und überprüfen Sie das laufende Image
  digest und HTTP-Antwort.


  Prüfen Sie die reparierte Phase und vergleichen Sie das beobachtete Ergebnis.


  Phase 1/2: Der Controller meldet `Synced` bei der erwarteten Revision; in der letzten Phase meldet er auch `Healthy`
  und der Workload ist bereit.


  ```sh

  kubectl get application board -o jsonpath=''{.status.sync.status} {.status.health.status} {.status.sync.revision}'';
  printf ''\n''

  kubectl get deployment board

  ```


  Phase 2: Der veröffentlichte Hash entspricht dem aufgezeichneten Release; die Abstammungsprüfung endet, sofern
  vorhanden, mit Code `0`.


  ```sh

  source platform.env

  cat release-commit

  git -C repository ls-remote origin refs/heads/main

  ```


  Phase 2: Secret und erlaubter Vault-Eintrag enthalten `north-secret`, HTTP liefert `north-100` und der andere
  Vault-Pfad HTTP `403`.


  ```sh

  source platform.env

  kubectl get secret route-secret -o jsonpath=''{.data.value}'' | base64 -d

  printf ''\n''

  kubectl exec deployment/board -- wget -qO- -T 3 http://board:8080

  printf ''\n''

  curl -fsS --max-time 3 -H @<(printf ''X-Vault-Token: %s\n'' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch"

  curl -sS --max-time 3 -o /dev/null -w ''%{http_code}\n'' -H @<(printf ''X-Vault-Token: %s\n'' "$VAULT_READER_TOKEN")
  "$VAULT_ADDR/v1/secret/data/other"

  ```


  Erwartete Beobachtungen für die gesamte Phase:

  - Phase 1/2: Angezeigter Abgleich, Workload-Konfiguration und Beobachtungen des laufenden Images erfüllen die
  Anforderungen dieser Phase.

  - Phase 2: Der entfernte Hash entspricht `release-commit`; das Git-Manifest enthält das mitgelieferte eingefrorene
  Image und die Referenz auf Secret `route-secret`.'
phrases.0: Ich habe Fehler an jeder Liefergrenze isoliert.
phrases.1: Ich habe die Abstimmung zwischen immutable-Bild identity und Git beibehalten.
phrases.2: Ich habe den geheimen Zugriff mit den geringsten Privilegien und einen echten End-to-End-Service überprüft.
questions.0.points.0: Der angewendete desired-Status kann weiterhin auf nicht verfügbare Bilder oder Secrets verweisen.
questions.0.points.1: Überprüfen Sie sync, health, events und echte Anfragen separat.
questions.0.prompt: Warum kann ein Application Synced sein, während seine Pods ausfallen?
questions.1.points.0: Korrekte Quellrevision, Ausführung von digest und Gültigkeitsbereich runtime credentials.
questions.1.points.1: Eine sinnvolle Anfrage gelingt über den wiederhergestellten Dienst.
questions.1.prompt: Was überprüft eine vollständige Wiederherstellung über einen green-Controller hinaus?
diagnostics.repo: application/board repoURL muss GIT_URL entsprechen.
diagnostics.path: application/board source.path muss manifests entsprechen.
diagnostics.target: application/board targetRevision muss main entsprechen.
diagnostics.selfheal: application/board selfHeal muss true entsprechen.
diagnostics.prune: application/board prune muss true entsprechen.
diagnostics.synced: application/board sync.status muss Synced entsprechen.
diagnostics.baseline: baseline-commit darf nicht leer sein.
diagnostics.baseline_revision: application/board sync.revision muss baseline-commit entsprechen.
diagnostics.fetch: git fetch origin main muss erfolgreich sein.
diagnostics.origin: release-commit darf nicht leer sein und muss origin/main entsprechen.
diagnostics.health: application/board health.status muss Healthy entsprechen.
diagnostics.release_revision: application/board sync.revision muss release-commit entsprechen.
diagnostics.rollout: Der Rollout von deployment/board muss abgeschlossen sein.
diagnostics.http: Die Anfrage an board:8080 muss north-100 liefern.
diagnostics.image: private-release.json image darf nicht leer sein.
diagnostics.board_image: deployment/board containers[0].image muss private-release.json image entsprechen.
diagnostics.board_policy: deployment/board containers[0].imagePullPolicy muss Always entsprechen.
diagnostics.board_secret: deployment/board imagePullSecrets muss [registry-pull] entsprechen.
diagnostics.board_env: Das env des ersten board-Containers darf nur ROUTE_SECRET aus route-secret, Schlüssel value,
  enthalten.
diagnostics.secret: Der dekodierte Wert von route-secret muss north-secret sein.
diagnostics.image_id: Ein Board-Pod muss einen bereiten Container haben, dessen imageID den festgelegten Digest
  enthält.
diagnostics.reader: Das Vault-Reader-Token muss north-secret aus secret/data/dispatch lesen.
diagnostics.denied: Die Vault-reader-Anfrage an secret/data/other muss HTTP 403 liefern.
diagnostics.git_image: Das erste Board-Image im Git-Manifest muss dem Image aus private-release.json entsprechen.
diagnostics.git_env: Der erste Umgebungseintrag im Git-Manifest muss auf Secret route-secret verweisen.
