diagnostics.repo: Die Application verweist möglicherweise auf ein anderes Git-Repository. Vergleichen Sie die Quell-URL mit GIT_URL aus der bereitgestellten Umgebung. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q100-application-repository)
diagnostics.path: Die Quelle verweist möglicherweise noch auf das stillgelegte Verzeichnis. Verwenden Sie einen relativen Pfad nach manifests ohne Wechsel ins Elternverzeichnis. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q100-application-directory)
diagnostics.target: Die Application verfolgt möglicherweise einen anderen Zweig oder Commit. Prüfen Sie, ob targetRevision im aktiven Objekt main lautet. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q100-application-branch)
diagnostics.selfheal: Die Selbstheilung fehlt möglicherweise oder ist deaktiviert. Prüfen Sie, ob die aktive Richtlinie selfHeal auf den booleschen Wert true setzt. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q100-application-self-heal)
diagnostics.prune: Die automatische Bereinigung fehlt möglicherweise oder ist deaktiviert. Prüfen Sie, ob die aktive Richtlinie prune auf den booleschen Wert true setzt. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q100-application-pruning)
diagnostics.synced: Der Controller sieht möglicherweise noch die alte Quelle oder eine nicht angewendete Revision. Prüfen Sie den Synchronisierungsstatus nach dem Abgleich. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q100-application-sync)
diagnostics.baseline: Der eingefrorene Beleg baseline-commit ist möglicherweise leer oder unlesbar. Prüfen Sie den Beleg der Basisrevision vor dem Statusvergleich. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q100-baseline-receipt)
diagnostics.baseline_revision: In Phase eins kann die Application trotz korrekter Quelle einen anderen Commit melden. Vergleichen Sie sync.revision nach dem Abgleich mit baseline-commit. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q100-application-baseline)
diagnostics.fetch: Das private Remote ist möglicherweise unerreichbar oder Git hat keinen Zugriff. Rufen Sie origin main vor dem Revisionsvergleich erfolgreich ab. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q100-private-git-fetch)
diagnostics.origin: Die Arbeitsdatei release-commit ist möglicherweise leer oder veraltet. Vergleichen Sie sie mit dem frisch abgerufenen origin/main, auch bei scheinbar aktuellem Checkout. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q100-current-release-receipt)
diagnostics.health: In der Release-Phase können fehlende Registry-Zugangsdaten oder ein unveröffentlichtes Routen-Secret die Application beeinträchtigen. Prüfen Sie die aktuellen Pods und warten Sie auf Healthy. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q100-application-health)
diagnostics.release_revision: Der Controller ist möglicherweise mit einem älteren Commit synchronisiert. Vergleichen Sie sync.revision nach der Quellenaktualisierung mit release-commit. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q100-application-release)
diagnostics.http: Der Service liefert möglicherweise einen alten Wert oder die Anfrage läuft in ein Timeout. Rufen Sie ihn aus dem Worker auf und vergleichen Sie die Antwort mit north-100. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q100-release-http)
diagnostics.board_image: Der Worker im Deployment oder einem zugehörigen aktuellen Pod nutzt möglicherweise ein anderes Image. Vergleichen Sie die Images der Worker mit dem festgehaltenen Image und prüfen Sie den Zugriff auf Objekte und Image-Beleg. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q100-live-frozen-image)
diagnostics.board_policy: Der Worker hat möglicherweise eine andere Pull-Policy oder das Deployment hat keine aktuellen Pods. Prüfen Sie Always beim Worker in der Vorlage und in allen aktuellen zugehörigen Pods. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q100-current-pull-policy)
diagnostics.board_secret: Ein aktueller zugehöriger Pod lässt registry-pull möglicherweise aus oder verweist auf ein zusätzliches Secret. Prüfen Sie nach dem Rollout die wirksamen Pod-Verweise und lassen Sie nur registry-pull stehen. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q100-current-registry-reference)
diagnostics.board_env: Im bereitgestellten Worker fehlt ROUTE_SECRET möglicherweise, ist doppelt oder hat ein Feld value. Prüfen Sie den einzigen Eintrag auf secretKeyRef nach route-secret/value. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q100-live-secret-reference)
diagnostics.secret: Das Kubernetes-Secret fehlt möglicherweise oder enthält einen früheren Wert. Führen Sie nach erfolgreichem Lesezugriff mit dem Reader-Token die mitgelieferte Synchronisierung aus und prüfen Sie route-secret/value ohne Ausgabe des Inhalts. [Ursache und Prüfung](guides#guide=vault-recovery&section=q100-published-route-secret)
diagnostics.image_id: Trotz korrekter Image-Deklaration fehlt möglicherweise ein aktueller zugehöriger Pod mit bereitem Worker für den festgehaltenen Digest. Prüfen Sie nach dem Rollout Bereitschaft und imageID im Worker-Container. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q100-ready-frozen-image)
diagnostics.reader: Dem bereitgestellten Reader fehlt möglicherweise der Lesezugriff auf secret/data/dispatch oder der Pfad liefert einen anderen Wert. Prüfen Sie Policy und erwartetes Feld ohne Ausgabe von Token oder Inhalt. [Ursache und Prüfung](guides#guide=vault-recovery&section=q100-reader-dispatch)
diagnostics.denied: Eine zu breite Reader-Policy kann secret/data/other freigeben. Prüfen Sie dort HTTP 403 mit dem Reader-Token und unterscheiden Sie die Ablehnung von Timeout oder einem anderen Status. [Ursache und Prüfung](guides#guide=vault-recovery&section=q100-reader-sibling-denial)
diagnostics.git_image: Im abgerufenen main-Manifest fehlt möglicherweise der Worker des Deployments board oder ein anderes Image ist angegeben. Prüfen Sie den veröffentlichten Worker und den Image-Beleg auch bei Git- oder YAML-Fehlern. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q100-published-frozen-image)
diagnostics.git_env: Der veröffentlichte Eintrag ROUTE_SECRET enthält möglicherweise value oder einen falschen Schlüssel. Prüfen Sie im veröffentlichten Worker den einzigen secretKeyRef auf route-secret/value. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q100-published-secret-reference)
diagnostics.probe_0_0: Die Application-Prüfung kann vor dem Feldvergleich abbrechen, wenn Arbeitsverzeichnis oder Plattformeingabe nicht erreichbar sind. Prüfen Sie Verzeichnis, Umgebungsdatei und Zugriff auf die Application. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q100-application-probe-input)
diagnostics.probe_1_2: Die Application-Prüfung kann vor dem Feldvergleich abbrechen, wenn Arbeitsverzeichnis oder Plattformeingabe nicht erreichbar sind. Prüfen Sie Verzeichnis, Umgebungsdatei und Zugriff auf die Application. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q100-application-probe-input)
diagnostics.probe_1_0: Die Git-Prüfung kann vor der Auswertung von Revision oder Manifest abbrechen. Prüfen Sie platform.env, das Arbeits-Repository und die lokalen Werkzeuge. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q100-git-probe-input)
diagnostics.probe_1_1: Die Git-Prüfung kann vor der Auswertung von Revision oder Manifest abbrechen. Prüfen Sie platform.env, das Arbeits-Repository und die lokalen Werkzeuge. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q100-git-probe-input)
diagnostics.probe_1_3: Die Prüfung kann vor dem Lesen des Worker-Containers abbrechen, wenn Arbeitsverzeichnis oder Python nicht starten. Prüfen Sie Werkzeuge und Zugriff auf das Deployment board. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q100-workload-probe-input)
diagnostics.probe_1_4: Die Secret-Prüfung kann vor dem Inhaltsvergleich abbrechen, wenn Umgebung oder Arbeitsverzeichnis fehlen. Prüfen Sie Eingaben und Zugriff auf route-secret ohne Werte zu protokollieren. [Ursache und Prüfung](guides#guide=vault-recovery&section=q100-secret-probe-input)
diagnostics.probe_1_5: Die Reader-Prüfung kann vor den HTTP-Anfragen abbrechen, wenn platform.env oder der private Anfrage-Header nicht verfügbar ist. Prüfen Sie Eingaben und Werkzeuge ohne Ausgabe des Tokens. [Ursache und Prüfung](guides#guide=vault-recovery&section=q100-reader-probe-input)
diagnostics.probe_1_6: Die kurze Rollout-Wartezeit kann vor der imageID-Prüfung ablaufen. Prüfen Sie vor dem erneuten Versuch den Rollout sowie Pull- und Bereitschaftsereignisse. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q100-rollout-readiness)
diagnostics.probe_1_7: Die HTTP-Prüfung kann vor dem Aufruf abbrechen, wenn Arbeitsverzeichnis oder Plattformeingabe fehlen. Prüfen Sie das Verzeichnis und den Zugriff auf den Service board. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q100-service-probe-input)
