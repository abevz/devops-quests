title: Vollständige Plattformwiederherstellung
brief: Die private Lieferkette verbindet Gitea, eine Registry, Argo CD, Vault und ein Kubernetes-Board. Arbeite nur in `~/quest`
  und dieser Offline-Umgebung. Lies `platform.env`, `application.json`, `repository/manifests/board.json`, `baseline-commit`,
  `release-commit`, `private-release.json`, `reader.hcl` und `sync-secret.sh`. Eine Argo Application beschreibt die Manifestquelle
  und meldet die Abgleichung; eine Vault-Policy steuert den Zugriff auf Secrets. Repariere zuerst die Abgleichung und dann
  die Laufzeit-Zugangsdaten. Die Prüfungen beobachten ausgewählte Konfiguration, Werte und zwei Vault-Pfade; sie beweisen
  weder die gesamte Git-Historie noch die Ablehnung aller anderen Vault-Pfade.
debrief: Die Prüfungen bestätigten ausgewählte Git-, Argo-, Board- und Vault-Ergebnisse; sie beweisen weder den vollständigen
  Policy-Umfang noch eine unveränderte Historie.
stages.0.brief: 'Repariere Application `board`: Die Repo-URL muss `GIT_URL` aus `platform.env` entsprechen, der Pfad `manifests`,
  die Revision `main` und automatisches `selfHeal` und `prune` müssen true sein. Warte auf Sync-Status `Synced` beim eingefrorenen
  `baseline-commit`. Der verlinkte Hinweis beschreibt das Aktualisieren der Application.'
stages.0.objectives.0.text: Application-Quelle, Automatisierung und Basis-Synchronisierung entsprechen der Beschreibung.
stages.1.brief: 'Hole `origin/main` in `repository`; es muss `release-commit` entsprechen. Belasse Application `board` bei
  derselben URL, demselben Pfad, derselben Revision und Automatisierung, nun `Synced` und `Healthy` bei `release-commit`.
  Warte auf den Board-Rollout und prüfe `north-100` von `board:8080`. Der erste Board-Container muss das Image aus `/run/dq/facts/0/private-release.json`,
  `imagePullPolicy: Always`, genau `imagePullSecrets: [{name: registry-pull}]` und genau einen Umgebungseintrag verwenden:
  `ROUTE_SECRET` aus Secret `route-secret`, Schlüssel `value`. Die imageID eines bereiten Board-Containers muss den Image-Digest
  enthalten. Der Secret-Wert und der Vault-Token-Wert von `secret/data/dispatch` müssen `north-secret` sein; Token-Zugriff
  auf `secret/data/other` muss HTTP 403 liefern. Das Git-Manifest unter `origin/main:manifests/board.json` muss das eingefrorene
  erste Image und den Secret-Namen `route-secret` des ersten Umgebungseintrags behalten. Nutze `reader.hcl` und `sync-secret.sh`
  und starte das Board neu. Die zwei geprüften Vault-Pfade beweisen kein vollständiges Least-Privilege-Prinzip.'
stages.1.objectives.0.text: Release-Revision, Application-Zustand, Board-Konfiguration und Antwort sowie ausgewählte Git-Felder
  und Vault-Ergebnisse entsprechen der Beschreibung.
hints.0.text: 'Stufe 1: inspect application.json – Argo CD zeigt bei der Überarbeitung auf einen retired Git-Pfad statt auf
  source.path=manifests main mit automatisiertem self-heal und prune.'
hints.1.text: 'Stufe 2: Ein Synced Application ist immer noch fehlerhaft, da der private registry pull Secret fehlt und reader.hcl
  auf den falschen Vault verweist KV Pfad.'
hints.2.text: Stellen Sie die Registrierung pull Secret von private-release.json wieder her, legen Sie reader.hcl auf schreibgeschützten
  Bereich dispatch fest, führen Sie sync-secret.sh aus und überprüfen Sie das laufende Image digest und HTTP-Antwort.
phrases.0: Ich habe Fehler an jeder Liefergrenze isoliert.
phrases.1: Ich habe die Abstimmung zwischen immutable-Bild identity und Git beibehalten.
phrases.2: Ich habe den geheimen Zugriff mit den geringsten Privilegien und einen echten End-to-End-Service überprüft.
questions.0.points.0: Der angewendete desired-Status kann weiterhin auf nicht verfügbare Bilder oder Secrets verweisen.
questions.0.points.1: Überprüfen Sie sync, health, events und echte Anfragen separat.
questions.0.prompt: Warum kann ein Application Synced sein, während seine Pods ausfallen?
questions.1.points.0: Korrekte Quellrevision, Ausführung von digest und Gültigkeitsbereich runtime credentials.
questions.1.points.1: Eine sinnvolle Anfrage gelingt über den wiederhergestellten Dienst.
questions.1.prompt: Was überprüft eine vollständige Wiederherstellung über einen green-Controller hinaus?
