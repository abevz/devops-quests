hints.0.text: Проследите источник, доступ к artifact и доставку секрета runtime как отдельные границы.
hints.1.text: Synced не означает healthy при отсутствии pull credential и секрета.
hints.2.text: Восстановите путь, ограниченную policy reader и два Secret Kubernetes; проверьте работающий
  digest и HTTP.
