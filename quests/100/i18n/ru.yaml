diagnostics.repo: Application мог ссылаться на другой Git-репозиторий. Сравните URL источника с GIT_URL из выданного окружения. [Причина и проверка](guides#guide=gitops-delivery&section=q100-application-repository)
diagnostics.path: В источнике мог остаться путь к выведенному из работы каталогу. Укажите относительный путь к manifests без перехода через родительский каталог. [Причина и проверка](guides#guide=gitops-delivery&section=q100-application-directory)
diagnostics.target: Application мог отслеживать другую ветку или ревизию. Проверьте, что targetRevision живого объекта равна main. [Причина и проверка](guides#guide=gitops-delivery&section=q100-application-branch)
diagnostics.selfheal: Самовосстановление могло быть выключено или не указано. Проверьте, что в действующей политике selfHeal задан как логическое true. [Причина и проверка](guides#guide=gitops-delivery&section=q100-application-self-heal)
diagnostics.prune: Автоматическое удаление объектов могло быть выключено. Проверьте, что в действующей политике prune задан как логическое true. [Причина и проверка](guides#guide=gitops-delivery&section=q100-application-pruning)
diagnostics.synced: Контроллер мог ещё видеть старый источник или неприменённую ревизию. Проверьте текущий статус синхронизации после согласования. [Причина и проверка](guides#guide=gitops-delivery&section=q100-application-sync)
diagnostics.baseline: Зафиксированный baseline-commit мог быть пустым или нечитаемым. Проверьте выданную запись исходной ревизии перед сравнением со статусом. [Причина и проверка](guides#guide=gitops-delivery&section=q100-baseline-receipt)
diagnostics.baseline_revision: На первой фазе Application может показывать другой коммит даже с верным источником. После согласования сравните sync.revision с записью baseline-commit. [Причина и проверка](guides#guide=gitops-delivery&section=q100-application-baseline)
diagnostics.fetch: Приватный remote мог стать недоступен или Git не получил доступ. Сначала успешно выполните fetch origin main, затем сравнивайте ревизии. [Причина и проверка](guides#guide=gitops-delivery&section=q100-private-git-fetch)
diagnostics.origin: Рабочий release-commit мог быть пустым или устаревшим. Сравните его со свежим origin/main, даже если рабочая копия выглядит актуальной. [Причина и проверка](guides#guide=gitops-delivery&section=q100-current-release-receipt)
diagnostics.health: На фазе релиза отсутствие доступа к registry или неопубликованный Secret маршрута могут мешать готовности Application. Проверьте текущие Pod и дождитесь Healthy. [Причина и проверка](guides#guide=gitops-delivery&section=q100-application-health)
diagnostics.release_revision: Контроллер мог синхронизироваться на прежнем коммите. После обновления источника сравните текущую sync.revision с рабочим release-commit. [Причина и проверка](guides#guide=gitops-delivery&section=q100-application-release)
diagnostics.http: Service может возвращать прежнее значение, либо запрос не успевает завершиться. Выполните запрос из worker и сравните ответ с north-100. [Причина и проверка](guides#guide=gitops-delivery&section=q100-release-http)
diagnostics.board_image: Worker в Deployment или одном из текущих Pod этого Deployment может использовать другой образ. Сравните образы с зафиксированным и проверьте доступность объектов и записи образа. [Причина и проверка](guides#guide=gitops-delivery&section=q100-live-frozen-image)
diagnostics.board_policy: У worker может отличаться политика загрузки, или у Deployment нет текущих Pod. Проверьте Always у worker в шаблоне и во всех текущих Pod этого Deployment. [Причина и проверка](guides#guide=gitops-delivery&section=q100-current-pull-policy)
diagnostics.board_secret: В текущем Pod этого Deployment может отсутствовать registry-pull или быть указан лишний Secret. После rollout проверьте фактические ссылки Pod и оставьте только registry-pull. [Причина и проверка](guides#guide=gitops-delivery&section=q100-current-registry-reference)
diagnostics.board_env: В развёрнутом worker переменная ROUTE_SECRET могла отсутствовать, дублироваться или содержать поле value. Проверьте, что единственная запись ссылается на route-secret/value через secretKeyRef. [Причина и проверка](guides#guide=gitops-delivery&section=q100-live-secret-reference)
diagnostics.secret: Secret Kubernetes мог отсутствовать или сохранять прежнее значение. Когда чтение через reader заработает, выполните выданную синхронизацию и проверьте route-secret/value без вывода содержимого. [Причина и проверка](guides#guide=vault-recovery&section=q100-published-route-secret)
diagnostics.image_id: Даже при верном образе в спецификации у Deployment может не быть текущего Pod с готовым worker на нужном digest. После rollout проверьте готовность worker и его imageID. [Причина и проверка](guides#guide=gitops-delivery&section=q100-ready-frozen-image)
diagnostics.reader: У выданного reader могло не быть доступа к secret/data/dispatch либо источник вернул другое значение. Проверьте политику и ожидаемое поле без вывода токена или содержимого. [Причина и проверка](guides#guide=vault-recovery&section=q100-reader-dispatch)
diagnostics.denied: Слишком широкая политика reader может дать доступ к secret/data/other. Проверьте, что этот запрос получает HTTP 403, и отличайте отказ от тайм-аута или другого статуса. [Причина и проверка](guides#guide=vault-recovery&section=q100-reader-sibling-denial)
diagnostics.git_image: В полученном манифесте main мог отсутствовать worker Deployment board либо указан другой образ. Проверьте опубликованный worker и запись образа, в том числе при ошибках Git или YAML. [Причина и проверка](guides#guide=gitops-delivery&section=q100-published-frozen-image)
diagnostics.git_env: В опубликованной записи ROUTE_SECRET могло остаться поле value или ссылка на другой ключ. У опубликованного worker должна быть одна запись с secretKeyRef на route-secret/value. [Причина и проверка](guides#guide=gitops-delivery&section=q100-published-secret-reference)
diagnostics.probe_0_0: Проверка Application может остановиться до сравнения полей, если рабочая папка или вход платформы недоступны. Проверьте каталог, выданный файл окружения и доступ к Application. [Причина и проверка](guides#guide=gitops-delivery&section=q100-application-probe-input)
diagnostics.probe_1_2: Проверка Application может остановиться до сравнения полей, если рабочая папка или вход платформы недоступны. Проверьте каталог, выданный файл окружения и доступ к Application. [Причина и проверка](guides#guide=gitops-delivery&section=q100-application-probe-input)
diagnostics.probe_1_0: Проверка Git может прерваться до сравнения ревизии или манифеста. Проверьте выданный platform.env, рабочий репозиторий и доступность локальных инструментов. [Причина и проверка](guides#guide=gitops-delivery&section=q100-git-probe-input)
diagnostics.probe_1_1: Проверка Git может прерваться до сравнения ревизии или манифеста. Проверьте выданный platform.env, рабочий репозиторий и доступность локальных инструментов. [Причина и проверка](guides#guide=gitops-delivery&section=q100-git-probe-input)
diagnostics.probe_1_3: Проверка может остановиться до чтения worker, если недоступна рабочая папка или не запускается Python. Проверьте инструменты на станции и доступ к Deployment board. [Причина и проверка](guides#guide=gitops-delivery&section=q100-workload-probe-input)
diagnostics.probe_1_4: Проверка Secret может остановиться до сравнения значения, если недоступны выданное окружение или рабочая папка. Проверьте входы и доступ к route-secret без записи значений в логи. [Причина и проверка](guides#guide=vault-recovery&section=q100-secret-probe-input)
diagnostics.probe_1_5: Проверка reader может остановиться до HTTP-запросов, если не читается platform.env или нельзя подготовить закрытый заголовок. Проверьте входы и инструменты без вывода токена. [Причина и проверка](guides#guide=vault-recovery&section=q100-reader-probe-input)
diagnostics.probe_1_6: Короткое ожидание rollout может закончиться до проверки imageID. Перед повтором проверьте ход rollout и события загрузки образа или готовности. [Причина и проверка](guides#guide=gitops-delivery&section=q100-rollout-readiness)
diagnostics.probe_1_7: HTTP-проверка может остановиться до запроса, если недоступна рабочая папка или вход платформы. Проверьте каталог и доступ к Service board. [Причина и проверка](guides#guide=gitops-delivery&section=q100-service-probe-input)
