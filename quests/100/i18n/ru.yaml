title: Полное восстановление платформы
brief: 'Полная приватная цепочка доставки сломана в трёх местах: Argo смотрит в устаревший путь Git, нет
  credential загрузки приватного образа, policy reader Vault указывает не на тот KV-путь. Сначала восстановите
  source.path=manifests, сохранив main и автоматические self-heal/prune. Затем восстановите pull Secret
  приватного registry и policy reader только для dispatch, выполните sync-secret.sh и восстановите существующее
  табло. Git-манифест уже выбирает правильные immutable-образ и Secret; сохраните их. Все сервисы принадлежат
  только этой временной песочнице.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `platform.env`, `application.json`,
  `repository/manifests/board.json`, `baseline-commit`, `private-release.json`, `reader.hcl`, `sync-secret.sh`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Argo согласует правильный путь приватного Git и исходную ревизию main с сохранением
  автоматики; следующий инцидент касается credentials runtime.'
debrief: Полная цепочка Git → registry → Argo CD → Vault восстановлена без обхода desired state и расширения
  доступа к секретам.
stages.0.brief: 'Argo согласует правильный путь приватного Git и исходную ревизию main с сохранением автоматики;
  следующий инцидент касается credentials runtime.


  Результат проверки: Argo согласует правильный путь приватного Git и исходную ревизию main с сохранением
  автоматики; следующий инцидент касается credentials runtime.'
