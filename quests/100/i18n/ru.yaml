title: Полное восстановление платформы
brief: "Приватная цепочка доставки ещё не обслуживает требуемый релиз. Опубликованная ревизия, работающий артефакт\
  \ и доступ к секрету должны согласоваться.\n\nРаботайте в `~/quest` на рабочей станции. Входные файлы по этапам:\n\
  - Этап 1: `platform.env`, `application.yaml`, `repository/manifests/board.yaml`, `repository/manifests/service.yaml`,\
  \ `release-commit`, `private-release.json`.\n- Этап 2: `reader.hcl`, `sync-secret.sh`.\n\n**Требования:**\n\n\
  - Этап 1:\n  - Application `board` сообщает `Synced` для требуемой опубликованной ревизии. Оно автоматически устраняет\
  \ дрейф и удаляет ресурсы, которых больше нет в желаемом релизе.\n- Этап 2:\n  - Удалённая `main` равна ревизии\
  \ из `release-commit`.\n  - Опубликованная нагрузка использует поставленный зафиксированный образ и получает секрет\
  \ runtime через требуемую ссылку на Secret.\n  - Application `board` сообщает `Synced` и `Healthy` для опубликованной\
  \ ревизии релиза. Оно автоматически устраняет дрейф и удаляет ресурсы, которых больше нет в желаемом релизе.\n\
  \  - Deployment `board` использует поставленный зафиксированный образ, сохраняет исходные требования загрузки\
  \ и получает секрет runtime без встроенного значения.\n  - Secret нагрузки содержит значение требуемой записи\
  \ Vault.\n  - Токен доступа Vault возвращает требуемый секрет доставки и запрещает доступ к посторонней записи\
  \ данных.\n  - Deployment `board` завершает развёртывание с готовым контейнером приложения, работающим с дайджестом\
  \ поставленного зафиксированного образа.\n  - Из Deployment `board` адрес `http://board:8080` возвращает `north-100`.\n\
  \nПроверка наблюдает выбранную конфигурацию, значения и два пути Vault; она не может доказать всю историю Git\
  \ или запрет всех остальных путей Vault."
debrief: Проверки подтвердили выбранные результаты Git, Argo, board и Vault; они не доказывают полный охват политики
  или неизменность истории.
stages.0.brief: Сохраните исходную ревизию при восстановлении согласования.
stages.1.brief: Опубликованный релиз должен согласоваться на границах доставки и runtime.
hints.0.text: Согласованный источник и здоровый runtime — разные результаты. Сравните границу доставки с границей
  потребителя.
hints.1.text: 'Этап 1: проверьте application.yaml — Argo CD смотрит в устаревший путь Git вместо source.path=manifests
  на ревизии main с включёнными self-heal и prune.


  Этап 2: статус Synced не означает готовность Pod — отсутствует pull Secret приватного registry, а policy в reader.hcl
  указывает на неверный KV-путь в Vault.


  Изучите поставленные определения, описания ресурсов и события соответствующего этапа.


  ```sh

  git -C repository log --all --oneline

  cat reader.hcl

  kubectl describe application board

  kubectl describe deployment board

  kubectl describe pod -l app=board

  ```


  Этап 1/2: Изучите определения этих ресурсов для данного этапа.


  ```sh

  kubectl get application board -o yaml

  kubectl get deployment board -o yaml

  kubectl get pods -l app=board -o yaml

  ```


  Этап 2: Изучите определения этих ресурсов для данного этапа.


  ```sh

  git -C repository show origin/main:manifests/board.yaml

  ```'
hints.2.text: 'Восстановите pull Secret из private-release.json, ограничьте reader.hcl чтением dispatch, выполните
  sync-secret.sh и проверьте работающий digest образа и HTTP-ответ.


  Проверьте исправленный этап и сравните наблюдаемый результат.


  Этап 1/2: Контроллер сообщает `Synced` для ожидаемой ревизии; на последнем этапе также сообщает `Healthy`, нагрузка
  готова.


  ```sh

  kubectl get application board -o jsonpath=''{.status.sync.status} {.status.health.status} {.status.sync.revision}'';
  printf ''\n''

  kubectl get deployment board

  ```


  Этап 2: Опубликованный хеш совпадает с записанным релизом; проверка предка, если она есть, завершается с кодом
  `0`.


  ```sh

  source platform.env

  cat release-commit

  git -C repository ls-remote origin refs/heads/main

  ```


  Этап 2: Secret и разрешённая запись Vault содержат `north-secret`, HTTP возвращает `north-100`, другой путь Vault
  возвращает HTTP `403`.


  ```sh

  source platform.env

  kubectl get secret route-secret -o jsonpath=''{.data.value}'' | base64 -d

  printf ''\n''

  kubectl exec deployment/board -- wget -qO- -T 3 http://board:8080

  printf ''\n''

  curl -fsS --max-time 3 -H @<(printf ''X-Vault-Token: %s\n'' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch"

  curl -sS --max-time 3 -o /dev/null -w ''%{http_code}\n'' -H @<(printf ''X-Vault-Token: %s\n'' "$VAULT_READER_TOKEN")
  "$VAULT_ADDR/v1/secret/data/other"

  ```


  Ожидаемые наблюдения для этапа целиком:

  - Этап 1/2: Показанные согласование, конфигурация нагрузки и наблюдения работающего образа соответствуют требованиям
  этого этапа.

  - Этап 2: Удалённый хеш равен `release-commit`; Git-манифест содержит поставленный зафиксированный образ и ссылку
  на Secret `route-secret`.'
phrases.0: Я отделил сбои на каждой границе доставки.
phrases.1: Я сохранил immutable identity образа и согласование Git.
phrases.2: Я проверил минимальные права к секретам и реальную работу сервиса всей цепочки.
questions.0.points.0: Применённый desired state может ссылаться на недоступные образы или Secrets.
questions.0.points.1: Отдельно проверяйте sync, health, events и реальные запросы.
questions.0.prompt: Почему Application может быть Synced при неисправных Pod?
questions.1.points.0: Верную ревизию источника, работающий digest и ограниченные credentials runtime.
questions.1.points.1: Полезный запрос успешно проходит через восстановленный сервис.
questions.1.prompt: Что проверяет полное восстановление помимо зелёного контроллера?
diagnostics.repo: application/board repoURL должен совпадать с GIT_URL.
diagnostics.path: application/board source.path должен совпадать с manifests.
diagnostics.target: application/board targetRevision должен совпадать с main.
diagnostics.selfheal: application/board selfHeal должен совпадать с true.
diagnostics.prune: application/board prune должен совпадать с true.
diagnostics.synced: application/board sync.status должен совпадать с Synced.
diagnostics.baseline: baseline-commit должен быть непустым.
diagnostics.baseline_revision: application/board sync.revision должен совпадать с baseline-commit.
diagnostics.fetch: git fetch origin main должен завершиться успешно.
diagnostics.origin: release-commit должен быть непустым и совпадать с origin/main.
diagnostics.health: application/board health.status должен совпадать с Healthy.
diagnostics.release_revision: application/board sync.revision должен совпадать с release-commit.
diagnostics.rollout: Выкатка deployment/board должна завершиться.
diagnostics.http: Запрос к board:8080 должен вернуть north-100.
diagnostics.image: private-release.json image должен быть непустым.
diagnostics.board_image: deployment/board containers[0].image должен совпадать с private-release.json image.
diagnostics.board_policy: deployment/board containers[0].imagePullPolicy должен совпадать с Always.
diagnostics.board_secret: deployment/board imagePullSecrets должен совпадать с [registry-pull].
diagnostics.board_env: В env первого контейнера board должен быть только ROUTE_SECRET из route-secret, ключ value.
diagnostics.secret: Декодированное значение route-secret должно быть north-secret.
diagnostics.image_id: У Pod board должен быть готовый контейнер, чей imageID содержит зафиксированный digest.
diagnostics.reader: Токен reader Vault должен прочитать north-secret из secret/data/dispatch.
diagnostics.denied: Запрос Vault reader к secret/data/other должен вернуть HTTP 403.
diagnostics.git_image: Первый образ board в манифесте Git должен совпадать с образом из private-release.json.
diagnostics.git_env: Первая переменная окружения в манифесте Git должна ссылаться на Secret route-secret.
