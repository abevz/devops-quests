title: Полное восстановление платформы
brief: 'Приватная цепочка доставки платформы (Gitea → приватный registry → Argo CD
  → Vault → табло board) неисправна на двух этапах. На первом этапе Argo CD сверяет
  неверный каталог репозитория: восстановите синхронизацию каталога manifests на ревизии
  main, сохранив автоматические self-heal и prune. На втором этапе синхронизированная
  нагрузка board не запускается в runtime: восстановите доступ к загрузке приватного
  образа и доставку секрета из Vault с минимальными правами (чтение только KV-пути
  dispatch), не меняя immutable-образ и ссылку на Secret в Git-манифесте. Все сервисы
  принадлежат только этой временной песочнице.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `platform.env`,
  `application.json`, `repository/manifests/board.json`, `baseline-commit`, `private-release.json`,
  `reader.hcl`, `sync-secret.sh`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно
  загруженные образы и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Argo согласует правильный путь приватного Git и исходную ревизию
  main с сохранением автоматики; следующий инцидент касается credentials runtime.'
debrief: Полная цепочка Git → registry → Argo CD → Vault восстановлена без обхода
  desired state и расширения доступа к секретам.
stages.0.brief: 'Результат проверки: Argo согласует правильный путь приватного Git
  и исходную ревизию main с сохранением автоматики; следующий инцидент касается credentials
  runtime.'
stages.0.objectives.0.text: Argo согласует правильный путь приватного Git и исходную
  ревизию main с сохранением автоматики; следующий инцидент касается credentials runtime.
stages.1.brief: 'Результат проверки: Git, immutable-образ registry, desired state
  Argo и данные Vault с минимальными правами согласованы; реальное табло отдаёт north-100.'
stages.1.objectives.0.text: Git, immutable-образ registry, desired state Argo и данные
  Vault с минимальными правами согласованы; реальное табло отдаёт north-100.
hints.0.text: 'Этап 1: проверьте application.json — Argo CD смотрит в устаревший путь
  Git вместо source.path=manifests на ревизии main с включёнными self-heal и prune.'
hints.1.text: 'Этап 2: статус Synced не означает готовность Pod — отсутствует pull
  Secret приватного registry, а policy в reader.hcl указывает на неверный KV-путь
  в Vault.'
hints.2.text: Восстановите pull Secret из private-release.json, ограничьте reader.hcl
  чтением dispatch, выполните sync-secret.sh и проверьте работающий digest образа
  и HTTP-ответ.
phrases.0: Я отделил сбои на каждой границе доставки.
phrases.1: Я сохранил immutable identity образа и согласование Git.
phrases.2: Я проверил минимальные права к секретам и реальную работу сервиса всей
  цепочки.
questions.0.points.0: Применённый desired state может ссылаться на недоступные образы
  или Secrets.
questions.0.points.1: Отдельно проверяйте sync, health, events и реальные запросы.
questions.0.prompt: Почему Application может быть Synced при неисправных Pod?
questions.1.points.0: Верную ревизию источника, работающий digest и ограниченные credentials
  runtime.
questions.1.points.1: Полезный запрос успешно проходит через восстановленный сервис.
questions.1.prompt: Что проверяет полное восстановление помимо зелёного контроллера?
