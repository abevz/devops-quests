  устраняет дрейф и удаляет ресурсы, которых больше нет в желаемом релизе.
stages.1.objectives.0.text: Удалённая `main` равна ревизии из `release-commit`.
stages.1.objectives.1.text: Опубликованная нагрузка использует поставленный зафиксированный образ и получает секрет
  runtime через требуемую ссылку на Secret.
stages.1.objectives.2.text: Application `board` сообщает `Synced` и `Healthy` для опубликованной ревизии релиза.
  Оно автоматически устраняет дрейф и удаляет ресурсы, которых больше нет в желаемом релизе.
stages.1.objectives.3.text: Deployment `board` использует поставленный зафиксированный образ, сохраняет исходные
  требования загрузки и получает секрет runtime без встроенного значения.
stages.1.objectives.4.text: Secret нагрузки содержит значение требуемой записи Vault.
stages.1.objectives.5.text: Токен доступа Vault возвращает требуемый секрет доставки и запрещает доступ к посторонней
  записи данных.
stages.1.objectives.6.text: Deployment `board` завершает развёртывание с готовым контейнером приложения, работающим
  с дайджестом поставленного зафиксированного образа.
stages.1.objectives.7.text: Из Deployment `board` адрес `http://board:8080` возвращает `north-100`.
