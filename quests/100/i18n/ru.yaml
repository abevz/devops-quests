title: Полное восстановление платформы
brief: "Приватная цепочка доставки ещё не обслуживает требуемый релиз. Опубликованная ревизия, работающий артефакт\
  \ и доступ к секрету должны согласоваться.\n\nРаботайте в `~/quest` на рабочей станции. Входные файлы по этапам:\n\
  - Этап 1: `platform.env`, `application.yaml`, `repository/manifests/board.yaml`, `repository/manifests/service.yaml`,\
  \ `release-commit`, `private-release.json`.\n- Этап 2: `reader.hcl`, `sync-secret.sh`.\n\n**Требования:**\n\n\
  - Этап 1:\n  - Application `board` сообщает `Synced` для требуемой опубликованной ревизии. Оно автоматически устраняет\
  \ дрейф и удаляет ресурсы, которых больше нет в желаемом релизе.\n- Этап 2:\n  - Удалённая `main` равна ревизии\
  \ из `release-commit`.\n  - Опубликованная нагрузка использует поставленный зафиксированный образ и получает секрет\
  \ runtime через требуемую ссылку на Secret.\n  - Application `board` сообщает `Synced` и `Healthy` для опубликованной\
  \ ревизии релиза. Оно автоматически устраняет дрейф и удаляет ресурсы, которых больше нет в желаемом релизе.\n\
  \  - Deployment `board` использует поставленный зафиксированный образ, сохраняет исходные требования загрузки\
  \ и получает секрет runtime без встроенного значения.\n  - Secret нагрузки содержит значение требуемой записи\
  \ Vault.\n  - Токен доступа Vault возвращает требуемый секрет доставки и запрещает доступ к посторонней записи\
  \ данных.\n  - Deployment `board` завершает развёртывание с готовым контейнером приложения, работающим с дайджестом\
  \ поставленного зафиксированного образа.\n  - Из Deployment `board` адрес `http://board:8080` возвращает `north-100`.\n\
  \nПроверка наблюдает выбранную конфигурацию, значения и два пути Vault; она не может доказать всю историю Git\
  \ или запрет всех остальных путей Vault."
debrief: Проверки подтвердили выбранные результаты Git, Argo, board и Vault; они не доказывают полный охват политики
  или неизменность истории.
stages.0.brief: Сохраните исходную ревизию при восстановлении согласования.
stages.1.brief: Опубликованный релиз должен согласоваться на границах доставки и runtime.
hints.0.text: Согласованный источник и здоровый runtime — разные результаты. Сравните границу доставки с границей
  потребителя.
hints.1.text: |-
  Изучите объекты текущего этапа и их выданные определения.

  На этапе закрытой доставки сравните выданную ссылку на образ, имена pull Secret и путь политики Vault. Изучите вход синхронизатора и действующее состояние по метаданным и статусам.

  ```sh
  git -C repository log --all --oneline
  cat reader.hcl
  kubectl describe application board
  kubectl describe deployment board
  kubectl describe pod -l app=board
  ```

  Этап 1/2: Изучите определения этих ресурсов для данного этапа.

  ```sh
  kubectl get application board -o yaml
  kubectl get deployment board -o yaml
  kubectl get pods -l app=board -o yaml
  ```

  Этап 2: Изучите определения этих ресурсов для данного этапа.

  ```sh
  git -C repository show origin/main:manifests/board.yaml
  ```
hints.2.text: |-
  Проверьте исправленный этап и сравните наблюдаемый результат.

  Этап 1/2: Контроллер сообщает `Synced` для ожидаемой ревизии; на последнем этапе также сообщает `Healthy`, нагрузка готова.

  ```sh
  kubectl get application board -o jsonpath='{.status.sync.status} {.status.health.status} {.status.sync.revision}'; printf '\n'
  kubectl get deployment board
  ```

  Этап 2: Опубликованный хеш совпадает с записанным релизом; проверка предка, если она есть, завершается с кодом `0`.

  ```sh
  source platform.env
  cat release-commit
  git -C repository ls-remote origin refs/heads/main
  (
  set -euo pipefail
  cd ~/quest
  source platform.env
  image=$(jq -er .image /run/dq/facts/0/private-release.json)
  revision=$(cat release-commit)
  test "$(git -C repository ls-remote origin refs/heads/main | cut -f1)" = "$revision"
  verify_worker() {
    jq -e --arg image "$image" '
      .kind=="Deployment" and .metadata.name=="board" and
      any(.spec.template.spec.containers[]; .name=="worker" and .image==$image and
        any(.env[]?; .name=="ROUTE_SECRET" and (has("value")|not) and
          (.valueFrom | keys)==["secretKeyRef"] and
          .valueFrom.secretKeyRef.name=="route-secret" and .valueFrom.secretKeyRef.key=="value"))'
  }
  git -C repository show "$revision:manifests/board.yaml" |
    python3 -I -c 'import json,sys,yaml; json.dump(yaml.safe_load(sys.stdin),sys.stdout)' |
    verify_worker
  deployment=$(kubectl get deployment board -o json)
  verify_worker <<<"$deployment"
  digest=${image##*@}
  deployment_uid=$(jq -er .metadata.uid <<<"$deployment")
  sets=$(kubectl get rs -o json | jq -c --arg owner "$deployment_uid" '
    [.items[] | select(any(.metadata.ownerReferences[]?; .kind=="Deployment" and .controller==true and .uid==$owner)) | .metadata.uid]')
  kubectl get pods -o json | jq -e --argjson sets "$sets" --arg image "$image" --arg digest "$digest" '
    [.items[] | select(.metadata.deletionTimestamp==null and .status.phase!="Failed" and .status.phase!="Succeeded" and
      any(.metadata.ownerReferences[]?; .kind=="ReplicaSet" and .controller==true and (.uid as $uid | $sets | index($uid)!=null)))]
    | length>0 and all(.[]; .status.phase=="Running" and ([.spec.imagePullSecrets[]?.name] | unique) == ["registry-pull"] and
      any(.spec.containers[]; .name=="worker" and .image==$image) and
      any(.status.containerStatuses[]?; .name=="worker" and .ready==true and (.state.running|type)=="object" and
        ((.imageID | split("@") | last | split("/") | last) == $digest)))'
  )
  ```

  Этап 2. Обе проверки значений завершаются с кодом 0 без вывода. Сервис возвращает `north-100`, а другой путь Vault возвращает HTTP `403`.

  ```sh
  source platform.env
  kubectl get secret route-secret -o jsonpath='{.data.value}' | base64 -d | grep -Fxq 'north-secret'
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080
  printf '\n'
  curl -fsS --max-time 3 -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch" | jq -e '.data.data.value == "north-secret"' >/dev/null
  curl -sS --max-time 3 -o /dev/null -w '%{http_code}\n' -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/other"
  ```

  Ожидаемые наблюдения для этапа целиком:
  - Этап 1/2: Показанные согласование, конфигурация нагрузки и наблюдения работающего образа соответствуют требованиям этого этапа.
  - Этап 2: Удалённый хеш равен `release-commit`; Git-манифест содержит поставленный зафиксированный образ и ссылку на Secret `route-secret`.
phrases.0: Я отделил сбои на каждой границе доставки.
phrases.1: Я сохранил immutable identity образа и согласование Git.
phrases.2: Я проверил минимальные права к секретам и реальную работу сервиса всей цепочки.
questions.0.points.0: Применённый desired state может ссылаться на недоступные образы или Secrets.
questions.0.points.1: Отдельно проверяйте sync, health, events и реальные запросы.
questions.0.prompt: Почему Application может быть Synced при неисправных Pod?
questions.1.points.0: Верную ревизию источника, работающий digest и ограниченные credentials runtime.
questions.1.points.1: Полезный запрос успешно проходит через восстановленный сервис.
questions.1.prompt: Что проверяет полное восстановление помимо зелёного контроллера?
stages.0.objectives.0.text: Application `board` сообщает `Synced` для требуемой опубликованной ревизии. Оно автоматически
  устраняет дрейф и удаляет ресурсы, которых больше нет в желаемом релизе.
stages.1.objectives.0.text: Удалённая `main` равна ревизии из `release-commit`.
stages.1.objectives.1.text: Опубликованная нагрузка использует поставленный зафиксированный образ и получает секрет
