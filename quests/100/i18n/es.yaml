title: Recuperación completa de la plataforma
brief: "La cadena de entrega privada aún no sirve la versión prevista. La revisión publicada, el artefacto en ejecución\
  \ y el acceso al secreto deben coincidir.\n\nTrabaja en `~/quest` en la estación de trabajo. Entradas por etapa:\n\
  - Etapa 1: `platform.env`, `application.yaml`, `repository/manifests/board.yaml`, `repository/manifests/service.yaml`,\
  \ `release-commit`, `private-release.json`.\n- Etapa 2: `reader.hcl`, `sync-secret.sh`.\n\n**Requisitos:**\n\n\
  - Etapa 1:\n  - La Application `board` informa `Synced` en la revisión publicada prevista. Restaura automáticamente\
  \ las desviaciones y elimina los recursos que ya no están en la versión deseada.\n- Etapa 2:\n  - El `main` remoto\
  \ coincide con la revisión registrada en `release-commit`.\n  - La carga publicada usa la imagen congelada suministrada\
  \ y obtiene su secreto de runtime mediante la referencia Secret prevista.\n  - La Application `board` informa\
  \ `Synced` y `Healthy` en la revisión de la versión publicada. Restaura automáticamente las desviaciones y elimina\
  \ los recursos que ya no están en la versión deseada.\n  - El Deployment `board` usa la imagen congelada suministrada,\
  \ conserva sus requisitos originales de descarga y obtiene su secreto de runtime sin incrustar el valor.\n  -\
  \ El Secret de la carga contiene el valor del registro Vault previsto.\n  - El token de acceso Vault devuelve\
  \ el secreto de entrega previsto y deniega un registro de datos ajeno.\n  - El Deployment `board` completa su\
  \ rollout con un contenedor listo de la aplicación que ejecuta el digest de la imagen congelada suministrada.\n\
  \  - Desde el Deployment `board`, `http://board:8080` devuelve `north-100`.\n\nLa comprobación observa configuración\
  \ seleccionada, valores y dos rutas Vault; no demuestra todo el historial Git ni que todas las demás rutas Vault\
  \ estén denegadas."
debrief: Las comprobaciones verificaron resultados seleccionados de Git, Argo, board y Vault; no establecen todo
  el alcance de la política ni una historia intacta.
stages.0.brief: Conserva la revisión original al recuperar la reconciliación.
stages.1.brief: La versión publicada debe coincidir entre los límites de entrega y runtime.
hints.0.text: Un origen reconciliado y un runtime sano son resultados distintos. Compara el límite de entrega con
  el del consumidor.
hints.1.text: 'Etapa 1: inspect application.yaml — Argo CD apunta a una ruta retired Git en lugar de source.path=manifests
  en la revisión main con self-heal y prune automatizados.


  Etapa 2: un Synced Application aún no está en buen estado porque falta el registry pull Secret privado y reader.hcl
  apunta al Vault incorrecto Ruta KV.


  Inspecciona las definiciones suministradas, descripciones de recursos y eventos de la etapa correspondiente.


  ```sh

  git -C repository log --all --oneline

  cat reader.hcl

  kubectl describe application board

  kubectl describe deployment board

  kubectl describe pod -l app=board

  ```


  Etapa 1/2: Inspecciona estas definiciones de recursos para esta etapa.


  ```sh

  kubectl get application board -o yaml

  kubectl get deployment board -o yaml

  kubectl get pods -l app=board -o yaml

  ```


  Etapa 2: Inspecciona estas definiciones de recursos para esta etapa.


  ```sh

  git -C repository show origin/main:manifests/board.yaml

  ```'
hints.2.text: |-
  Restaure el registro pull Secret desde private-release.json, alcance reader.hcl a dispatch de solo lectura, ejecute sync-secret.sh y verifique la imagen en ejecución digest y Respuesta HTTP.

  Verifica la etapa reparada y compara el resultado observado.

  Etapa 1/2: El controlador informa `Synced` en la revisión esperada; en la etapa final también informa `Healthy` y la carga está lista.

  ```sh
  kubectl get application board -o jsonpath='{.status.sync.status} {.status.health.status} {.status.sync.revision}'; printf '\n'
  kubectl get deployment board
  ```

  Etapa 2: El hash publicado coincide con la versión registrada; la comprobación de ascendencia, cuando existe, termina con código `0`.

  ```sh
  source platform.env
  cat release-commit
  git -C repository ls-remote origin refs/heads/main
  ```

  Etapa 2: El Secret y el registro Vault permitido contienen `north-secret`, HTTP devuelve `north-100` y la otra ruta Vault devuelve HTTP `403`.

  ```sh
  source platform.env
  kubectl get secret route-secret -o jsonpath='{.data.value}' | base64 -d
  printf '\n'
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080
  printf '\n'
  curl -fsS --max-time 3 -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch"
  curl -sS --max-time 3 -o /dev/null -w '%{http_code}\n' -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/other"
  ```

  Observaciones esperadas para la etapa completa:
  - Etapa 1/2: La reconciliación, configuración de carga y observaciones de la imagen en ejecución mostradas cumplen los requisitos de esta etapa.
  - Etapa 2: El hash remoto coincide con `release-commit`; el manifiesto Git contiene la imagen congelada suministrada y la referencia al Secret `route-secret`.

phrases.0: Aislé fallas en cada límite de entrega.
phrases.1: Conservé la imagen immutable, la reconciliación identity y Git.
phrases.2: Verifiqué el acceso secreto con privilegios mínimos y un servicio real de extremo a extremo.
questions.0.points.0: El estado desired aplicado aún puede hacer referencia a imágenes no disponibles o Secrets.
questions.0.points.1: Inspeccione sync, health, events y las solicitudes reales por separado.
questions.0.prompt: ¿Por qué un Application puede ser Synced mientras sus Pods fallan?
questions.1.points.0: Revisión de fuente correcta, ejecutando digest y con alcance runtime credentials.
questions.1.points.1: Una solicitud útil tiene éxito a través del servicio recuperado.
questions.1.prompt: ¿Qué verifica una recuperación completa más allá de un controlador green?
stages.0.objectives.0.text: La Application `board` informa `Synced` en la revisión publicada prevista. Restaura
  automáticamente las desviaciones y elimina los recursos que ya no están en la versión deseada.
stages.1.objectives.0.text: El `main` remoto coincide con la revisión registrada en `release-commit`.
stages.1.objectives.1.text: La carga publicada usa la imagen congelada suministrada y obtiene su secreto de runtime
  mediante la referencia Secret prevista.
stages.1.objectives.2.text: La Application `board` informa `Synced` y `Healthy` en la revisión de la versión publicada.
  Restaura automáticamente las desviaciones y elimina los recursos que ya no están en la versión deseada.
stages.1.objectives.3.text: El Deployment `board` usa la imagen congelada suministrada, conserva sus requisitos
  originales de descarga y obtiene su secreto de runtime sin incrustar el valor.
stages.1.objectives.4.text: El Secret de la carga contiene el valor del registro Vault previsto.
stages.1.objectives.5.text: El token de acceso Vault devuelve el secreto de entrega previsto y deniega un registro
  de datos ajeno.
stages.1.objectives.6.text: El Deployment `board` completa su rollout con un contenedor listo de la aplicación que
  ejecuta el digest de la imagen congelada suministrada.
stages.1.objectives.7.text: Desde el Deployment `board`, `http://board:8080` devuelve `north-100`.
diagnostics.repo: Application puede apuntar a otro repositorio Git. Compare la URL con GIT_URL del entorno suministrado. [Causa y comprobación](guides#guide=gitops-delivery&section=q100-application-repository)
diagnostics.path: El origen puede seguir en el directorio retirado. Use una ruta relativa que resuelva a manifests sin subir al directorio padre. [Causa y comprobación](guides#guide=gitops-delivery&section=q100-application-directory)
diagnostics.target: Application puede seguir otra rama o revisión. Compruebe que targetRevision del objeto activo sea main. [Causa y comprobación](guides#guide=gitops-delivery&section=q100-application-branch)
diagnostics.selfheal: La autorreparación puede faltar o estar deshabilitada. Compruebe que la política activa fija selfHeal en el booleano true. [Causa y comprobación](guides#guide=gitops-delivery&section=q100-application-self-heal)
diagnostics.prune: La eliminación automática puede faltar o estar deshabilitada. Compruebe que la política activa fija prune en el booleano true. [Causa y comprobación](guides#guide=gitops-delivery&section=q100-application-pruning)
diagnostics.synced: El controlador puede seguir viendo la fuente anterior o una revisión pendiente. Revise el estado de sincronización tras la reconciliación. [Causa y comprobación](guides#guide=gitops-delivery&section=q100-application-sync)
diagnostics.baseline: El registro congelado baseline-commit puede estar vacío o ilegible. Revise el registro de la revisión base antes de compararlo con el estado. [Causa y comprobación](guides#guide=gitops-delivery&section=q100-baseline-receipt)
diagnostics.baseline_revision: En la primera fase, Application puede mostrar otro commit aunque la fuente sea correcta. Compare sync.revision con baseline-commit tras reconciliar. [Causa y comprobación](guides#guide=gitops-delivery&section=q100-application-baseline)
diagnostics.fetch: El remoto privado puede estar inaccesible o Git puede carecer de acceso. Obtenga origin main antes de comparar revisiones locales. [Causa y comprobación](guides#guide=gitops-delivery&section=q100-private-git-fetch)
diagnostics.origin: El archivo release-commit puede estar vacío o desactualizado. Compárelo con origin/main recién obtenido aunque la copia local parezca actual. [Causa y comprobación](guides#guide=gitops-delivery&section=q100-current-release-receipt)
diagnostics.health: En la fase de lanzamiento, la falta de credenciales del registro o del Secret de ruta puede impedir la salud de Application. Revise los Pods actuales y espere Healthy. [Causa y comprobación](guides#guide=gitops-delivery&section=q100-application-health)
diagnostics.release_revision: El controlador puede estar sincronizado con un commit anterior. Tras refrescar el origen, compare sync.revision con release-commit. [Causa y comprobación](guides#guide=gitops-delivery&section=q100-application-release)
diagnostics.http: El Service puede devolver un valor antiguo o agotar el tiempo. Haga la petición desde el worker y compare la respuesta con north-100. [Causa y comprobación](guides#guide=gitops-delivery&section=q100-release-http)
diagnostics.board_image: El worker del Deployment o de un Pod actual bajo su control puede usar otra imagen. Compare las imágenes de worker con la imagen fijada y revise el acceso a los objetos y al registro de imagen. [Causa y comprobación](guides#guide=gitops-delivery&section=q100-live-frozen-image)
diagnostics.board_policy: El worker puede tener otra política de descarga o el Deployment puede carecer de Pods actuales. Compruebe que el contenedor worker tenga la política Always en la plantilla del Deployment y en todos los Pods actuales de ese Deployment. [Causa y comprobación](guides#guide=gitops-delivery&section=q100-current-pull-policy)
diagnostics.board_secret: Un Pod actual puede omitir registry-pull o nombrar otro Secret. Tras el despliegue, revise las referencias efectivas y conserve únicamente registry-pull. [Causa y comprobación](guides#guide=gitops-delivery&section=q100-current-registry-reference)
diagnostics.board_env: En el worker desplegado puede faltar ROUTE_SECRET, estar duplicada o incluir el campo value. Revise que su única entrada use secretKeyRef a route-secret/value. [Causa y comprobación](guides#guide=gitops-delivery&section=q100-live-secret-reference)
diagnostics.secret: El Secret de Kubernetes puede faltar o tener un valor antiguo. Cuando funcione la lectura con el token reader, ejecute la sincronización suministrada y compruebe route-secret/value sin mostrar el contenido. [Causa y comprobación](guides#guide=vault-recovery&section=q100-published-route-secret)
diagnostics.image_id: Aunque la imagen declarada sea correcta, puede faltar un Pod actual con un worker listo en el digest fijado. Revise la disponibilidad del worker y el imageID del contenedor worker tras el despliegue. [Causa y comprobación](guides#guide=gitops-delivery&section=q100-ready-frozen-image)
diagnostics.reader: El token reader suministrado puede carecer de acceso a secret/data/dispatch o recibir otro valor. Revise la política y el campo esperado sin mostrar el token ni el contenido. [Causa y comprobación](guides#guide=vault-recovery&section=q100-reader-dispatch)
diagnostics.denied: Una política demasiado amplia para el token reader puede permitir secret/data/other. Compruebe que la solicitud autenticada con el token reader obtiene HTTP 403 y distinga la denegación de un timeout u otro estado. [Causa y comprobación](guides#guide=vault-recovery&section=q100-reader-sibling-denial)
diagnostics.git_image: El manifiesto de main puede carecer del worker del Deployment board o indicar otra imagen. Revise el worker publicado y el registro de la imagen, también si falla Git o YAML. [Causa y comprobación](guides#guide=gitops-delivery&section=q100-published-frozen-image)
diagnostics.git_env: La entrada publicada ROUTE_SECRET puede contener value o apuntar a otra clave. Revise que el worker tenga una sola referencia secretKeyRef a route-secret/value. [Causa y comprobación](guides#guide=gitops-delivery&section=q100-published-secret-reference)
diagnostics.probe_0_0: La sonda de Application puede detenerse antes de comparar campos si no puede abrir el directorio o la entrada de la plataforma. Revise el directorio, el archivo de entorno y el acceso a Application. [Causa y comprobación](guides#guide=gitops-delivery&section=q100-application-probe-input)
diagnostics.probe_1_2: La sonda de Application puede detenerse antes de comparar campos si no puede abrir el directorio o la entrada de la plataforma. Revise el directorio, el archivo de entorno y el acceso a Application. [Causa y comprobación](guides#guide=gitops-delivery&section=q100-application-probe-input)
diagnostics.probe_1_0: La comprobación Git puede fallar antes de examinar la revisión o el manifiesto. Revise platform.env, el repositorio de trabajo y las herramientas locales. [Causa y comprobación](guides#guide=gitops-delivery&section=q100-git-probe-input)
diagnostics.probe_1_1: La comprobación Git puede fallar antes de examinar la revisión o el manifiesto. Revise platform.env, el repositorio de trabajo y las herramientas locales. [Causa y comprobación](guides#guide=gitops-delivery&section=q100-git-probe-input)
diagnostics.probe_1_3: La sonda puede fallar antes de leer el worker si no abre el directorio o no inicia Python. Revise las herramientas y el acceso al Deployment board. [Causa y comprobación](guides#guide=gitops-delivery&section=q100-workload-probe-input)
diagnostics.probe_1_4: La sonda del Secret puede detenerse antes de comparar el contenido si el entorno o el directorio no están disponibles. Revise las entradas y el acceso a route-secret sin registrar sus valores. [Causa y comprobación](guides#guide=vault-recovery&section=q100-secret-probe-input)
diagnostics.probe_1_5: La sonda del token reader puede detenerse antes de las solicitudes HTTP si no carga platform.env o no puede preparar la cabecera privada. Revise las entradas y herramientas sin mostrar el token. [Causa y comprobación](guides#guide=vault-recovery&section=q100-reader-probe-input)
diagnostics.probe_1_6: La espera breve del despliegue puede agotarse antes de comprobar imageID. Revise el despliegue y los eventos de descarga o disponibilidad antes de repetir. [Causa y comprobación](guides#guide=gitops-delivery&section=q100-rollout-readiness)
diagnostics.probe_1_7: La sonda HTTP puede detenerse antes de la solicitud si el directorio o la entrada de la plataforma no están disponibles. Revise el directorio y el acceso al Service board. [Causa y comprobación](guides#guide=gitops-delivery&section=q100-service-probe-input)
