title: Pełne odzyskiwanie platformy
brief: "Prywatny łańcuch dostarczania nie udostępnia jeszcze wymaganego wydania. Opublikowana rewizja, działający\
  \ artefakt i dostęp do sekretu muszą być zgodne.\n\nPracuj w `~/quest` na stacji roboczej. Dane wejściowe według\
  \ etapu:\n- Etap 1: `platform.env`, `application.yaml`, `repository/manifests/board.yaml`, `repository/manifests/service.yaml`,\
  \ `release-commit`, `private-release.json`.\n- Etap 2: `reader.hcl`, `sync-secret.sh`.\n\n**Wymagania:**\n\n-\
  \ Etap 1:\n  - Application `board` zgłasza `Synced` dla właściwej opublikowanej rewizji. Automatycznie usuwa dryf\
  \ i zasoby, których nie ma już w pożądanym wydaniu.\n- Etap 2:\n  - Zdalna `main` odpowiada rewizji zapisanej\
  \ w `release-commit`.\n  - Opublikowane obciążenie używa dostarczonego zamrożonego obrazu i pobiera sekret runtime\
  \ przez właściwe odwołanie Secret.\n  - Application `board` zgłasza `Synced` i `Healthy` dla opublikowanej rewizji\
  \ wydania. Automatycznie usuwa dryf i zasoby, których nie ma już w pożądanym wydaniu.\n  - Deployment `board`\
  \ używa dostarczonego zamrożonego obrazu, zachowuje pierwotne wymagania pobierania i pobiera sekret runtime bez\
  \ osadzania wartości.\n  - Secret obciążenia zawiera wartość właściwego wpisu Vault.\n  - Token dostępu Vault\
  \ zwraca właściwy sekret dostarczania i odmawia dostępu do obcego wpisu danych.\n  - Deployment `board` kończy\
  \ rollout z gotowym kontenerem aplikacji używającym dostarczonego zamrożonego digestu obrazu.\n  - Z Deployment\
  \ `board` adres `http://board:8080` zwraca `north-100`.\n\nSprawdzenie obserwuje wybraną konfigurację, wartości\
  \ i dwie ścieżki Vault; nie dowodzi całej historii Git ani blokady wszystkich pozostałych ścieżek Vault."
debrief: Kontrole sprawdziły wybrane wyniki Git, Argo, board i Vault; nie dowodzą pełnego zakresu polityki ani niezmienionej
  historii.
stages.0.brief: Zachowaj pierwotną rewizję podczas przywracania uzgadniania.
stages.1.brief: Opublikowane wydanie musi być zgodne na granicach dostarczania i runtime.
hints.0.text: Uzgodnione źródło i zdrowy runtime to osobne wyniki. Porównaj granicę dostarczania z granicą odbiorcy.
hints.1.text: 'Etap 1: sprawdź application.yaml — Argo CD wskazuje na wycofaną ścieżkę Git zamiast source.path=manifests
  w wersji main z automatycznymi self-heal i prune.


  Etap 2: aplikacja Synced nadal jest w złej kondycji, ponieważ brakuje prywatnego registry pull Secret, a reader.hcl
  wskazuje na niewłaściwą ścieżkę Vault KV.


  Sprawdź dostarczone definicje, opisy zasobów i zdarzenia odpowiedniego etapu.


  ```sh

  git -C repository log --all --oneline

  cat reader.hcl

  kubectl describe application board

  kubectl describe deployment board

  kubectl describe pod -l app=board

  ```


  Etap 1/2: Sprawdź te definicje zasobów dla tego etapu.


  ```sh

  kubectl get application board -o yaml

  kubectl get deployment board -o yaml

  kubectl get pods -l app=board -o yaml

  ```


  Etap 2: Sprawdź te definicje zasobów dla tego etapu.


  ```sh

  git -C repository show origin/main:manifests/board.yaml

  ```'
hints.2.text: 'Przywróć rejestr pull Secret z private-release.json, zakres reader.hcl do dispatch tylko do odczytu,
  uruchom sync-secret.sh i sprawdź odpowiedź działającego obrazu digest i HTTP.


  Sprawdź naprawiony etap i porównaj obserwowany wynik.


  Etap 1/2: Kontroler zgłasza `Synced` dla oczekiwanej rewizji; w ostatnim etapie zgłasza też `Healthy`, a obciążenie
  jest gotowe.


  ```sh

  kubectl get application board -o jsonpath=''{.status.sync.status} {.status.health.status} {.status.sync.revision}'';
  printf ''\n''

  kubectl get deployment board

  ```


  Etap 2: Opublikowany hash odpowiada zapisanemu wydaniu; sprawdzenie pochodzenia, jeśli występuje, kończy się kodem
  `0`.


  ```sh

  source platform.env

  cat release-commit

  git -C repository ls-remote origin refs/heads/main

  ```


  Etap 2: Secret i dozwolony wpis Vault zawierają `north-secret`, HTTP zwraca `north-100`, a druga ścieżka Vault
  zwraca HTTP `403`.


  ```sh

  source platform.env

  kubectl get secret route-secret -o jsonpath=''{.data.value}'' | base64 -d

  printf ''\n''

  kubectl exec deployment/board -- wget -qO- -T 3 http://board:8080

  printf ''\n''

  curl -fsS --max-time 3 -H @<(printf ''X-Vault-Token: %s\n'' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch"

  curl -sS --max-time 3 -o /dev/null -w ''%{http_code}\n'' -H @<(printf ''X-Vault-Token: %s\n'' "$VAULT_READER_TOKEN")
  "$VAULT_ADDR/v1/secret/data/other"

  ```


  Oczekiwane obserwacje dla całego etapu:

  - Etap 1/2: Wyświetlone uzgodnienie, konfiguracja obciążenia i obserwacje działającego obrazu spełniają wymagania
  tego etapu.

  - Etap 2: Zdalny hash odpowiada `release-commit`; manifest Git zawiera dostarczony zamrożony obraz i odwołanie
  do Secret `route-secret`.'
phrases.0: Wyizolowałem awarie na każdej granicy dostawy.
phrases.1: Zachowałem niezmienną tożsamość obrazu i uzgodnienie Git.
phrases.2: Zweryfikowałem tajny dostęp o najniższych uprawnieniach i prawdziwą kompleksową obsługę.
questions.0.points.0: Zastosowany desired state może nadal odwoływać się do niedostępnych obrazów lub Secrets.
questions.0.points.1: Sprawdź osobno sync, health, events i rzeczywiste żądania.
questions.0.prompt: Dlaczego Application może być Synced, podczas gdy jego kapsuły ulegają awarii?
questions.1.points.0: Popraw wersję źródła, uruchamiając digest i poświadczenia środowiska wykonawczego o określonym
  zakresie.
questions.1.points.1: Przydatne żądanie zostanie zrealizowane poprzez odzyskaną usługę.
questions.1.prompt: Co sprawdza pełne odzyskiwanie poza ekologicznym kontrolerem?
diagnostics.repo: application/board repoURL musi być równe GIT_URL.
diagnostics.path: application/board source.path musi być równe manifests.
diagnostics.target: application/board targetRevision musi być równe main.
diagnostics.selfheal: application/board selfHeal musi być równe true.
diagnostics.prune: application/board prune musi być równe true.
diagnostics.synced: application/board sync.status musi być równe Synced.
diagnostics.baseline: baseline-commit musi być niepuste.
diagnostics.baseline_revision: application/board sync.revision musi być równe baseline-commit.
diagnostics.fetch: git fetch origin main musi się powieść.
diagnostics.origin: release-commit musi być niepusty i równy origin/main.
diagnostics.health: application/board health.status musi być równe Healthy.
diagnostics.release_revision: application/board sync.revision musi być równe release-commit.
diagnostics.rollout: Wdrożenie deployment/board musi się zakończyć.
diagnostics.http: Żądanie do board:8080 musi zwrócić north-100.
diagnostics.image: private-release.json image musi być niepuste.
diagnostics.board_image: deployment/board containers[0].image musi być równe private-release.json image.
diagnostics.board_policy: deployment/board containers[0].imagePullPolicy musi być równe Always.
diagnostics.board_secret: deployment/board imagePullSecrets musi być równe [registry-pull].
diagnostics.board_env: Env pierwszego kontenera board musi zawierać tylko ROUTE_SECRET z route-secret, klucz value.
diagnostics.secret: Odkodowana wartość route-secret musi wynosić north-secret.
diagnostics.image_id: Pod board musi mieć gotowy kontener, którego imageID zawiera zamrożony digest.
diagnostics.reader: Token czytelnika (reader) Vault musi odczytać north-secret z secret/data/dispatch.
diagnostics.denied: Żądanie Vault reader do secret/data/other musi zwrócić HTTP 403.
diagnostics.git_image: Pierwszy obraz board w manifeście Git musi odpowiadać obrazowi z private-release.json.
diagnostics.git_env: Pierwszy wpis środowiska w manifeście Git musi wskazywać Secret route-secret.
