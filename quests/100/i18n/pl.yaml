title: Pełne odzyskiwanie platformy
brief: 'Łańcuch dostaw platformy prywatnej (obciążenie Gitea → prywatny registry → Argo CD → Vault → board)
  ulega awarii w dwóch etapach. Na pierwszym etapie Argo CD uzgadnia niewłaściwą ścieżkę repozytorium:
  przywróć uzgadnianie katalogu manifests w wersji main, zachowując jednocześnie automatyczne self-heal
  i prune. Na drugim etapie zsynchronizowane obciążenie board w dalszym ciągu kończy się niepowodzeniem
  przy runtime: przywracanie dostępu do prywatnego obrazu i dostarczania tajnego obrazu Vault z najniższymi
  uprawnieniami (dostęp tylko do odczytu do ścieżki dispatch KV) bez zmiany niezmiennego obrazu lub odniesień
  Secret w Manifest Git. Każda usługa należy wyłącznie do tej jednorazowej zatoki.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `platform.env`, `application.json`,
  `repository/manifests/board.json`, `baseline-commit`, `private-release.json`, `reader.hcl`, `sync-secret.sh`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: Argo uzgadnia poprawną prywatną ścieżkę Git i oryginalną wersję main z
  zachowaniem automatyzacji; poświadczenia środowiska uruchomieniowego są następnym incydentem.'
debrief: Pełna ścieżka dostawy Git → registry → Argo CD → Vault została odzyskana bez omijania desired
  state lub poszerzania tajnego dostępu.
stages.0.brief: 'Kryteria sukcesu: Argo uzgadnia poprawną prywatną ścieżkę Git i oryginalną wersję main
  z zachowaniem automatyzacji; poświadczenia środowiska uruchomieniowego są następnym incydentem.'
stages.0.objectives.0.text: Argo uzgadnia poprawną prywatną ścieżkę Git i oryginalną wersję main z zachowaniem
  automatyzacji; poświadczenia środowiska uruchomieniowego są następnym incydentem.
stages.1.brief: 'Kryteria sukcesu: Git, niezmienny obraz registry, pożądany stan Argo i dane Vault o najniższych
  uprawnieniach zgadzają się; prawdziwa board służy north-100.'
stages.1.objectives.0.text: Git, niezmienny obraz registry, pożądany stan Argo i dane Vault o najniższych
  uprawnieniach zgadzają się; prawdziwa board służy north-100.
hints.0.text: 'Etap 1: sprawdź application.json — Argo CD wskazuje na wycofaną ścieżkę Git zamiast source.path=manifests
  w wersji main z automatycznymi self-heal i prune.'
hints.1.text: 'Etap 2: aplikacja Synced nadal jest w złej kondycji, ponieważ brakuje prywatnego registry
  pull Secret, a reader.hcl wskazuje na niewłaściwą ścieżkę Vault KV.'
hints.2.text: Przywróć rejestr pull Secret z private-release.json, zakres reader.hcl do dispatch tylko
  do odczytu, uruchom sync-secret.sh i sprawdź odpowiedź działającego obrazu digest i HTTP.
phrases.0: Wyizolowałem awarie na każdej granicy dostawy.
phrases.1: Zachowałem niezmienną tożsamość obrazu i uzgodnienie Git.
phrases.2: Zweryfikowałem tajny dostęp o najniższych uprawnieniach i prawdziwą kompleksową obsługę.
questions.0.points.0: Zastosowany desired state może nadal odwoływać się do niedostępnych obrazów lub
  Secrets.
questions.0.points.1: Sprawdź osobno sync, health, events i rzeczywiste żądania.
questions.0.prompt: Dlaczego Application może być Synced, podczas gdy jego kapsuły ulegają awarii?
questions.1.points.0: Popraw wersję źródła, uruchamiając digest i poświadczenia środowiska wykonawczego
  o określonym zakresie.
questions.1.points.1: Przydatne żądanie zostanie zrealizowane poprzez odzyskaną usługę.
questions.1.prompt: Co sprawdza pełne odzyskiwanie poza ekologicznym kontrolerem?
