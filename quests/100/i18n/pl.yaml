title: Pełne odzyskiwanie platformy
brief: "Prywatny łańcuch dostarczania nie udostępnia jeszcze wymaganego wydania. Opublikowana rewizja, działający\
  \ artefakt i dostęp do sekretu muszą być zgodne.\n\nPracuj w `~/quest` na stacji roboczej. Dane wejściowe według\
  \ etapu:\n- Etap 1: `platform.env`, `application.yaml`, `repository/manifests/board.yaml`, `repository/manifests/service.yaml`,\
  \ `release-commit`, `private-release.json`.\n- Etap 2: `reader.hcl`, `sync-secret.sh`.\n\n**Wymagania:**\n\n-\
  \ Etap 1:\n  - Application `board` zgłasza `Synced` dla właściwej opublikowanej rewizji. Automatycznie usuwa dryf\
  \ i zasoby, których nie ma już w pożądanym wydaniu.\n- Etap 2:\n  - Zdalna `main` odpowiada rewizji zapisanej\
  \ w `release-commit`.\n  - Opublikowane obciążenie używa dostarczonego zamrożonego obrazu i pobiera sekret runtime\
  \ przez właściwe odwołanie Secret.\n  - Application `board` zgłasza `Synced` i `Healthy` dla opublikowanej rewizji\
  \ wydania. Automatycznie usuwa dryf i zasoby, których nie ma już w pożądanym wydaniu.\n  - Deployment `board`\
  \ używa dostarczonego zamrożonego obrazu, zachowuje pierwotne wymagania pobierania i pobiera sekret runtime bez\
  \ osadzania wartości.\n  - Secret obciążenia zawiera wartość właściwego wpisu Vault.\n  - Token dostępu Vault\
  \ zwraca właściwy sekret dostarczania i odmawia dostępu do obcego wpisu danych.\n  - Deployment `board` kończy\
  \ rollout z gotowym kontenerem aplikacji używającym dostarczonego zamrożonego digestu obrazu.\n  - Z Deployment\
  \ `board` adres `http://board:8080` zwraca `north-100`.\n\nSprawdzenie obserwuje wybraną konfigurację, wartości\
  \ i dwie ścieżki Vault; nie dowodzi całej historii Git ani blokady wszystkich pozostałych ścieżek Vault."
debrief: Kontrole sprawdziły wybrane wyniki Git, Argo, board i Vault; nie dowodzą pełnego zakresu polityki ani niezmienionej
  historii.
stages.0.brief: Zachowaj pierwotną rewizję podczas przywracania uzgadniania.
stages.1.brief: Opublikowane wydanie musi być zgodne na granicach dostarczania i runtime.
hints.0.text: Uzgodnione źródło i zdrowy runtime to osobne wyniki. Porównaj granicę dostarczania z granicą odbiorcy.
hints.1.text: 'Etap 1: sprawdź application.yaml — Argo CD wskazuje na wycofaną ścieżkę Git zamiast source.path=manifests
  w wersji main z automatycznymi self-heal i prune.


  Etap 2: aplikacja Synced nadal jest w złej kondycji, ponieważ brakuje prywatnego registry pull Secret, a reader.hcl
  wskazuje na niewłaściwą ścieżkę Vault KV.


  Sprawdź dostarczone definicje, opisy zasobów i zdarzenia odpowiedniego etapu.


  ```sh

  git -C repository log --all --oneline

  cat reader.hcl

  kubectl describe application board

  kubectl describe deployment board

  kubectl describe pod -l app=board

  ```


  Etap 1/2: Sprawdź te definicje zasobów dla tego etapu.


  ```sh

  kubectl get application board -o yaml

  kubectl get deployment board -o yaml

  kubectl get pods -l app=board -o yaml

  ```


  Etap 2: Sprawdź te definicje zasobów dla tego etapu.


  ```sh

  git -C repository show origin/main:manifests/board.yaml

  ```'
hints.2.text: |-
  Przywróć rejestr pull Secret z private-release.json, zakres reader.hcl do dispatch tylko do odczytu, uruchom sync-secret.sh i sprawdź odpowiedź działającego obrazu digest i HTTP.

  Sprawdź naprawiony etap i porównaj obserwowany wynik.

  Etap 1/2: Kontroler zgłasza `Synced` dla oczekiwanej rewizji; w ostatnim etapie zgłasza też `Healthy`, a obciążenie jest gotowe.

  ```sh
  kubectl get application board -o jsonpath='{.status.sync.status} {.status.health.status} {.status.sync.revision}'; printf '\n'
  kubectl get deployment board
  ```

  Etap 2: Opublikowany hash odpowiada zapisanemu wydaniu; sprawdzenie pochodzenia, jeśli występuje, kończy się kodem `0`.

  ```sh
  source platform.env
  cat release-commit
  git -C repository ls-remote origin refs/heads/main
  ```

  Etap 2: Secret i dozwolony wpis Vault zawierają `north-secret`, HTTP zwraca `north-100`, a druga ścieżka Vault zwraca HTTP `403`.

  ```sh
  source platform.env
  kubectl get secret route-secret -o jsonpath='{.data.value}' | base64 -d
  printf '\n'
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080
  printf '\n'
  curl -fsS --max-time 3 -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch"
  curl -sS --max-time 3 -o /dev/null -w '%{http_code}\n' -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/other"
  ```

  Oczekiwane obserwacje dla całego etapu:
  - Etap 1/2: Wyświetlone uzgodnienie, konfiguracja obciążenia i obserwacje działającego obrazu spełniają wymagania tego etapu.
  - Etap 2: Zdalny hash odpowiada `release-commit`; manifest Git zawiera dostarczony zamrożony obraz i odwołanie do Secret `route-secret`.

phrases.0: Wyizolowałem awarie na każdej granicy dostawy.
phrases.1: Zachowałem niezmienną tożsamość obrazu i uzgodnienie Git.
phrases.2: Zweryfikowałem tajny dostęp o najniższych uprawnieniach i prawdziwą kompleksową obsługę.
questions.0.points.0: Zastosowany desired state może nadal odwoływać się do niedostępnych obrazów lub Secrets.
questions.0.points.1: Sprawdź osobno sync, health, events i rzeczywiste żądania.
questions.0.prompt: Dlaczego Application może być Synced, podczas gdy jego kapsuły ulegają awarii?
questions.1.points.0: Popraw wersję źródła, uruchamiając digest i poświadczenia środowiska wykonawczego o określonym
  zakresie.
questions.1.points.1: Przydatne żądanie zostanie zrealizowane poprzez odzyskaną usługę.
questions.1.prompt: Co sprawdza pełne odzyskiwanie poza ekologicznym kontrolerem?
stages.0.objectives.0.text: Application `board` zgłasza `Synced` dla właściwej opublikowanej rewizji. Automatycznie
  usuwa dryf i zasoby, których nie ma już w pożądanym wydaniu.
stages.1.objectives.0.text: Zdalna `main` odpowiada rewizji zapisanej w `release-commit`.
stages.1.objectives.1.text: Opublikowane obciążenie używa dostarczonego zamrożonego obrazu i pobiera sekret runtime
  przez właściwe odwołanie Secret.
stages.1.objectives.2.text: Application `board` zgłasza `Synced` i `Healthy` dla opublikowanej rewizji wydania.
  Automatycznie usuwa dryf i zasoby, których nie ma już w pożądanym wydaniu.
stages.1.objectives.3.text: Deployment `board` używa dostarczonego zamrożonego obrazu, zachowuje pierwotne wymagania
  pobierania i pobiera sekret runtime bez osadzania wartości.
stages.1.objectives.4.text: Secret obciążenia zawiera wartość właściwego wpisu Vault.
stages.1.objectives.5.text: Token dostępu Vault zwraca właściwy sekret dostarczania i odmawia dostępu do obcego
  wpisu danych.
stages.1.objectives.6.text: Deployment `board` kończy rollout z gotowym kontenerem aplikacji używającym dostarczonego
  zamrożonego digestu obrazu.
stages.1.objectives.7.text: Z Deployment `board` adres `http://board:8080` zwraca `north-100`.
diagnostics.repo: Application może wskazywać inne repozytorium Git. Porównaj URL źródła z GIT_URL z dostarczonego środowiska. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q100-application-repository)
diagnostics.path: Źródło może nadal wskazywać wycofany katalog. Użyj ścieżki względnej prowadzącej do manifests, bez przechodzenia przez katalog nadrzędny. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q100-application-directory)
diagnostics.target: Application może śledzić inną gałąź lub rewizję. Sprawdź, czy targetRevision działającego obiektu to main. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q100-application-branch)
diagnostics.selfheal: Samonaprawa może być wyłączona lub pominięta. Sprawdź, czy aktywna polityka ustawia selfHeal na wartość logiczną true. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q100-application-self-heal)
diagnostics.prune: Automatyczne usuwanie może być wyłączone. Sprawdź, czy aktywna polityka ustawia prune na wartość logiczną true. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q100-application-pruning)
diagnostics.synced: Kontroler może nadal widzieć stare źródło lub niezastosowaną rewizję. Sprawdź stan synchronizacji po uzgodnieniu. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q100-application-sync)
diagnostics.baseline: Zamrożony baseline-commit może być pusty lub nieczytelny. Sprawdź wskazanie rewizji bazowej przed porównaniem ze stanem. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q100-baseline-receipt)
diagnostics.baseline_revision: W pierwszej fazie Application może wskazywać inny commit mimo prawidłowego źródła. Po uzgodnieniu porównaj sync.revision z baseline-commit. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q100-application-baseline)
diagnostics.fetch: Prywatne repozytorium może być niedostępne lub Git może nie mieć dostępu. Pobierz origin main przed porównaniem rewizji. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q100-private-git-fetch)
diagnostics.origin: Roboczy release-commit może być pusty lub przestarzały. Porównaj go ze świeżym origin/main, nawet jeśli katalog roboczy wygląda na aktualny. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q100-current-release-receipt)
diagnostics.health: W fazie wydania brak danych dostępu do rejestru lub nieopublikowany Secret trasy może blokować gotowość Application. Sprawdź bieżące pody i poczekaj na Healthy. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q100-application-health)
diagnostics.release_revision: Kontroler mógł zsynchronizować poprzedni commit. Po odświeżeniu źródła porównaj sync.revision z roboczym release-commit. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q100-application-release)
diagnostics.http: Service może zwracać starą wartość albo przekraczać limit czasu. Wykonaj żądanie z kontenera worker i porównaj odpowiedź z north-100. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q100-release-http)
diagnostics.board_image: Worker w Deployment lub jego bieżącym Podzie może używać innego obrazu. Porównaj obrazy kontenerów worker z zamrożonym obrazem i sprawdź dostęp do obiektów oraz potwierdzenia. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q100-live-frozen-image)
diagnostics.board_policy: Worker może mieć inną politykę pobierania albo Deployment nie ma bieżących podów. Sprawdź Always dla kontenera worker w szablonie i w każdym bieżącym podzie wdrożenia. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q100-current-pull-policy)
diagnostics.board_secret: Bieżący Pod może pomijać registry-pull lub wskazywać dodatkowy Secret. Po wdrożeniu sprawdź rzeczywiste referencje podów i zachowaj tylko registry-pull. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q100-current-registry-reference)
diagnostics.board_env: We wdrożonym kontenerze worker ROUTE_SECRET może brakować, występować wielokrotnie lub zawierać pole value. Sprawdź pojedynczy wpis z secretKeyRef do route-secret/value. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q100-live-secret-reference)
diagnostics.secret: Secret Kubernetes może nie istnieć lub zawierać starszą wartość. Gdy odczyt z tokenem reader działa, uruchom dostarczoną synchronizację i sprawdź route-secret/value bez wypisywania zawartości. [Przyczyna i kontrola](guides#guide=vault-recovery&section=q100-published-route-secret)
diagnostics.image_id: Mimo prawidłowego obrazu w specyfikacji może nie być bieżącego poda z gotowym kontenerem worker używającym ustalonego digestu. Po wdrożeniu sprawdź gotowość i imageID kontenera worker. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q100-ready-frozen-image)
diagnostics.reader: Dostarczony reader może nie mieć dostępu do secret/data/dispatch lub odpowiedź może zawierać inną wartość. Sprawdź politykę i oczekiwane pole bez wypisywania tokenu lub danych. [Przyczyna i kontrola](guides#guide=vault-recovery&section=q100-reader-dispatch)
diagnostics.denied: Zbyt szeroka polityka przypisana do tokenu reader może pozwalać na secret/data/other. Sprawdź, czy żądanie z tokenem reader zwraca HTTP 403, i odróżnij odmowę od timeoutu lub innego statusu. [Przyczyna i kontrola](guides#guide=vault-recovery&section=q100-reader-sibling-denial)
diagnostics.git_image: Manifest z main może nie zawierać kontenera worker w Deploymencie board lub wskazywać inny obraz. Sprawdź opublikowany kontener worker i potwierdzenie obrazu, także przy błędach Git lub YAML. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q100-published-frozen-image)
diagnostics.git_env: Opublikowany wpis ROUTE_SECRET może zawierać pole value lub błędny klucz. Sprawdź pojedynczy wpis kontenera worker z secretKeyRef do route-secret/value. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q100-published-secret-reference)
diagnostics.probe_0_0: Kontrola Application może zakończyć się przed porównaniem pól, gdy katalog lub dane platformy są niedostępne. Sprawdź katalog, plik środowiska i dostęp do Application. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q100-application-probe-input)
diagnostics.probe_1_2: Kontrola Application może zakończyć się przed porównaniem pól, gdy katalog lub dane platformy są niedostępne. Sprawdź katalog, plik środowiska i dostęp do Application. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q100-application-probe-input)
diagnostics.probe_1_0: Kontrola Git może przerwać działanie przed porównaniem rewizji lub manifestu. Sprawdź platform.env, katalog repozytorium i dostępność narzędzi. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q100-git-probe-input)
diagnostics.probe_1_1: Kontrola Git może przerwać działanie przed porównaniem rewizji lub manifestu. Sprawdź platform.env, katalog repozytorium i dostępność narzędzi. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q100-git-probe-input)
diagnostics.probe_1_3: Kontrola może zakończyć się przed odczytem kontenera worker, gdy katalog jest niedostępny lub Python nie startuje. Sprawdź narzędzia i dostęp do Deployment board. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q100-workload-probe-input)
diagnostics.probe_1_4: Kontrola Secret może przerwać działanie przed porównaniem danych, jeśli brakuje środowiska lub katalogu. Sprawdź wejścia i dostęp do route-secret bez zapisywania wartości. [Przyczyna i kontrola](guides#guide=vault-recovery&section=q100-secret-probe-input)
diagnostics.probe_1_5: Kontrola tokenu reader może przerwać działanie przed żądaniami HTTP, gdy nie można wczytać platform.env lub przygotować prywatnego nagłówka. Sprawdź wejścia i narzędzia bez wypisywania tokenu. [Przyczyna i kontrola](guides#guide=vault-recovery&section=q100-reader-probe-input)
diagnostics.probe_1_6: Krótki czas oczekiwania może upłynąć przed sprawdzeniem imageID. Przed powtórką sprawdź wdrożenie oraz zdarzenia pobierania obrazu i gotowości. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q100-rollout-readiness)
diagnostics.probe_1_7: Kontrola HTTP może przerwać działanie przed żądaniem, gdy katalog lub dane platformy są niedostępne. Sprawdź katalog i dostęp do Service board. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q100-service-probe-input)
