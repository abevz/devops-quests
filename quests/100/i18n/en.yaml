title: Full platform recovery
brief: "The private delivery chain is not yet serving the intended release. Its published revision, runtime artifact\
  \ and secret access must agree.\n\nWork in `~/quest` on the workstation. Inputs by stage:\n- Stage 1: `platform.env`,\
  \ `application.yaml`, `repository/manifests/board.yaml`, `repository/manifests/service.yaml`, `release-commit`,\
  \ `private-release.json`.\n- Stage 2: `reader.hcl`, `sync-secret.sh`.\n\n**Requirements:**\n\n- Stage 1:\n  -\
  \ Application `board` reports `Synced` at the intended published revision. It automatically restores drift and\
  \ removes resources no longer present in the desired release.\n- Stage 2:\n  - Remote `main` equals the revision\
  \ recorded in `release-commit`.\n  - The published workload uses the supplied frozen image and obtains its runtime\
  \ secret through the intended Secret reference.\n  - Application `board` reports `Synced` and `Healthy` at the\
  \ published release revision. It automatically restores drift and removes resources no longer present in the desired\
  \ release.\n  - Deployment `board` uses the supplied frozen image, preserves its original pull requirements and\
  \ obtains its runtime secret without embedding the value.\n  - The workload Secret contains the value of the intended\
  \ Vault record.\n  - The Vault access token returns the intended delivery secret and denies an unrelated data\
  \ record.\n  - Deployment `board` completes its rollout with a ready application container running the supplied\
  \ frozen image digest.\n  - From Deployment `board`, `http://board:8080` returns `north-100`.\n\nThe check observes\
  \ selected configuration, values and two Vault paths; it cannot prove the entire Git history or that every other\
  \ Vault path is denied."
debrief: The checks verified selected Git, Argo, board and Vault results; they do not establish complete policy
  scope or unchanged history.
stages.0.brief: Retain the original revision while restoring reconciliation.
stages.1.brief: The published release must agree across delivery and runtime boundaries.
hints.0.text: A reconciled source and a healthy runtime are separate outcomes. Compare the delivery boundary with
  the consumer boundary.
hints.1.text: 'Stage 1: inspect application.yaml — Argo CD points to a retired Git path instead of source.path=manifests
  on revision main with automated self-heal and prune.


  Stage 2: a Synced Application is still unhealthy because the private registry pull Secret is missing and reader.hcl
  points to the wrong Vault KV path.


  Inspect the supplied definitions, resource descriptions and events for the relevant stage.


  ```sh

  git -C repository log --all --oneline

  cat reader.hcl

  kubectl describe application board

  kubectl describe deployment board

  kubectl describe pod -l app=board

  ```


  Stage 1/2: Inspect these resource definitions for this stage.


  ```sh

  kubectl get application board -o yaml

  kubectl get deployment board -o yaml

  kubectl get pods -l app=board -o yaml

  ```


  Stage 2: Inspect these resource definitions for this stage.


  ```sh

  git -C repository show origin/main:manifests/board.yaml

  ```'
hints.2.text: |-
  Restore the registry pull Secret from private-release.json, scope reader.hcl to dispatch read-only, run sync-secret.sh, and verify the running image digest and HTTP response.

  Verify the repaired stage and compare the observed result.

  Stage 1/2: The controller reports `Synced` at the expected revision; in the final stage it also reports `Healthy` and the workload is ready.

  ```sh
  kubectl get application board -o jsonpath='{.status.sync.status} {.status.health.status} {.status.sync.revision}'; printf '\n'
  kubectl get deployment board
  ```

  Stage 2: The published hash matches the recorded release; the ancestry check, when present, exits `0`.

  ```sh
  source platform.env
  cat release-commit
  git -C repository ls-remote origin refs/heads/main
  ```

  Stage 2: The Secret and allowed Vault record contain `north-secret`, HTTP returns `north-100`, and the other Vault path returns HTTP `403`.

  ```sh
  source platform.env
  kubectl get secret route-secret -o jsonpath='{.data.value}' | base64 -d
  printf '\n'
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080
  printf '\n'
  curl -fsS --max-time 3 -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch"
  curl -sS --max-time 3 -o /dev/null -w '%{http_code}\n' -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/other"
  ```

  Expected observations for the complete stage:
  - Stage 1/2: The displayed reconciliation, workload configuration and running-image observations match this stage’s Requirements.
  - Stage 2: The remote hash equals `release-commit`; the Git manifest has the supplied frozen image and Secret `route-secret` reference.

phrases.0: I isolated failures at each delivery boundary.
phrases.1: I retained immutable image identity and Git reconciliation.
phrases.2: I verified least-privilege secret access and real end-to-end service.
questions.0.points.0: Applied desired state can still reference unavailable images or Secrets.
questions.0.points.1: Inspect sync, health, events and real requests separately.
questions.0.prompt: Why can an Application be Synced while its Pods fail?
questions.1.points.0: Correct source revision, running digest and scoped runtime credentials.
questions.1.points.1: A useful request succeeds through the recovered service.
questions.1.prompt: What does a complete recovery verify beyond a green controller?
stages.0.objectives.0.text: Application `board` reports `Synced` at the intended published revision. It automatically
  restores drift and removes resources no longer present in the desired release.
stages.1.objectives.0.text: Remote `main` equals the revision recorded in `release-commit`.
stages.1.objectives.1.text: The published workload uses the supplied frozen image and obtains its runtime secret
  through the intended Secret reference.
stages.1.objectives.2.text: Application `board` reports `Synced` and `Healthy` at the published release revision.
  It automatically restores drift and removes resources no longer present in the desired release.
stages.1.objectives.3.text: Deployment `board` uses the supplied frozen image, preserves its original pull requirements
  and obtains its runtime secret without embedding the value.
stages.1.objectives.4.text: The workload Secret contains the value of the intended Vault record.
stages.1.objectives.5.text: The Vault access token returns the intended delivery secret and denies an unrelated
  data record.
stages.1.objectives.6.text: Deployment `board` completes its rollout with a ready application container running
  the supplied frozen image digest.
stages.1.objectives.7.text: From Deployment `board`, `http://board:8080` returns `north-100`.
diagnostics.repo: The Application may point to a different Git repository. Compare its source URL with GIT_URL from the supplied platform environment. [Cause and check](guides#guide=gitops-delivery&section=q100-application-repository)
diagnostics.path: The source may still point at the retired directory. Use a relative path resolving to manifests, without any parent traversal. [Cause and check](guides#guide=gitops-delivery&section=q100-application-directory)
diagnostics.target: The Application may track a branch or revision other than main. Check targetRevision on the live object. [Cause and check](guides#guide=gitops-delivery&section=q100-application-branch)
diagnostics.selfheal: Self-healing may be missing or disabled. Check that the live automated policy sets selfHeal to boolean true. [Cause and check](guides#guide=gitops-delivery&section=q100-application-self-heal)
diagnostics.prune: Pruning may be missing or disabled. Check that the live automated policy sets prune to boolean true. [Cause and check](guides#guide=gitops-delivery&section=q100-application-pruning)
diagnostics.synced: The controller may still observe the old source or an unapplied revision. Inspect the current sync status after reconciliation. [Cause and check](guides#guide=gitops-delivery&section=q100-application-sync)
diagnostics.baseline: The frozen baseline-commit may be empty or unreadable. Check the supplied baseline receipt before comparing the observed revision. [Cause and check](guides#guide=gitops-delivery&section=q100-baseline-receipt)
diagnostics.baseline_revision: The first-stage Application may report a different commit even when its source is correct. Compare the sync revision to the baseline receipt after reconciliation. [Cause and check](guides#guide=gitops-delivery&section=q100-application-baseline)
diagnostics.fetch: The private remote may be unreachable or Git access may fail. Fetch origin main successfully before comparing any local revision. [Cause and check](guides#guide=gitops-delivery&section=q100-private-git-fetch)
diagnostics.origin: The working release-commit may be empty or stale. Compare it with the freshly fetched origin/main, including when the checkout appears current. [Cause and check](guides#guide=gitops-delivery&section=q100-current-release-receipt)
diagnostics.health: In the release stage, missing pull credentials or an unpublished route Secret can keep the Application unhealthy. Check current Pods and wait for Healthy. [Cause and check](guides#guide=gitops-delivery&section=q100-application-health)
diagnostics.release_revision: The controller may be synced to a prior commit. Check the current sync revision against the working release-commit after the source refresh. [Cause and check](guides#guide=gitops-delivery&section=q100-application-release)
diagnostics.http: The running Service may still return an older value or the request may time out. Read the live response from the worker and compare it to north-100. [Cause and check](guides#guide=gitops-delivery&section=q100-release-http)
diagnostics.board_image: The Deployment worker or a current owned Pod may use a different image. Compare each worker with the frozen image, and check that the workload and image receipt can be read. [Cause and check](guides#guide=gitops-delivery&section=q100-live-frozen-image)
diagnostics.board_policy: The named worker may have a different pull policy, or there may be no current owned Pods. Check that the Deployment worker and all current owned workers use Always. [Cause and check](guides#guide=gitops-delivery&section=q100-current-pull-policy)
diagnostics.board_secret: A current owned Pod may omit registry-pull or name an additional pull Secret. Inspect the effective Pod references after rollout and keep registry-pull as the only name. [Cause and check](guides#guide=gitops-delivery&section=q100-current-registry-reference)
diagnostics.board_env: The deployed worker may have a missing or duplicate ROUTE_SECRET or a literal value field. Inspect its single entry for a secretKeyRef to route-secret/value. [Cause and check](guides#guide=gitops-delivery&section=q100-live-secret-reference)
diagnostics.secret: The Kubernetes Secret may be absent or retain an earlier value. Run the supplied synchronization after reader access works, then check the decoded route-secret/value without displaying it. [Cause and check](guides#guide=vault-recovery&section=q100-published-route-secret)
diagnostics.image_id: A current owned Pod may lack a ready worker running the frozen digest, even when the declared image is correct. Check the named worker’s readiness and imageID after rollout. [Cause and check](guides#guide=gitops-delivery&section=q100-ready-frozen-image)
diagnostics.reader: The supplied reader may lack read access to secret/data/dispatch, or that endpoint may return a different value. Review the policy and check the expected field without printing the token or payload. [Cause and check](guides#guide=vault-recovery&section=q100-reader-dispatch)
diagnostics.denied: A broad reader policy can grant access to secret/data/other. Check that the supplied reader receives HTTP 403 there, and distinguish denial from a timeout or a different status. [Cause and check](guides#guide=vault-recovery&section=q100-reader-sibling-denial)
diagnostics.git_image: The fetched main manifest may lack the named board Deployment worker or specify a different image. Check the published worker and the frozen receipt, including when Git or YAML reads fail. [Cause and check](guides#guide=gitops-delivery&section=q100-published-frozen-image)
diagnostics.git_env: The published ROUTE_SECRET entry may contain a value field or point to the wrong key. Inspect the published worker for a single reference to route-secret/value through secretKeyRef. [Cause and check](guides#guide=gitops-delivery&section=q100-published-secret-reference)
diagnostics.probe_0_0: The Application probe can stop before comparing fields when the workspace or platform input cannot be opened. Verify the working directory, supplied environment file and access to the Application. [Cause and check](guides#guide=gitops-delivery&section=q100-application-probe-input)
diagnostics.probe_1_2: The Application probe can stop before comparing fields when the workspace or platform input cannot be opened. Verify the working directory, supplied environment file and access to the Application. [Cause and check](guides#guide=gitops-delivery&section=q100-application-probe-input)
diagnostics.probe_1_0: The Git checks can fail before reporting revision or manifest details. Verify the supplied platform.env, working repository and availability of the local tools. [Cause and check](guides#guide=gitops-delivery&section=q100-git-probe-input)
diagnostics.probe_1_1: The Git checks can fail before reporting revision or manifest details. Verify the supplied platform.env, working repository and availability of the local tools. [Cause and check](guides#guide=gitops-delivery&section=q100-git-probe-input)
diagnostics.probe_1_3: The workload probe can fail before evaluating the worker when the workspace or Python observer cannot start. Confirm the workstation tools and access to Deployment board. [Cause and check](guides#guide=gitops-delivery&section=q100-workload-probe-input)
diagnostics.probe_1_4: The Secret probe can stop before checking the payload when the supplied environment or workspace is unavailable. Verify the inputs and access to route-secret without reading its values into logs. [Cause and check](guides#guide=vault-recovery&section=q100-secret-probe-input)
diagnostics.probe_1_5: The reader probe can stop before the HTTP checks if platform.env cannot be loaded or the private request header cannot be prepared. Verify the supplied inputs and local tools without printing the token. [Cause and check](guides#guide=vault-recovery&section=q100-reader-probe-input)
diagnostics.probe_1_6: The short rollout wait can expire before the observer checks imageID. Inspect the rollout and image-pull or readiness events before repeating the check. [Cause and check](guides#guide=gitops-delivery&section=q100-rollout-readiness)
diagnostics.probe_1_7: The HTTP probe can stop before the request when the workspace or supplied platform input is unavailable. Verify the workspace and access to the board Service. [Cause and check](guides#guide=gitops-delivery&section=q100-service-probe-input)
