hints.0.text: Trace source, artifact access and runtime secret delivery as separate boundaries.
hints.1.text: Synced does not imply healthy when pull and secret credentials are absent.
hints.2.text: Recover the path, scoped reader policy and two Kubernetes Secrets; verify the running digest
  and HTTP.
phrases.0: I isolated failures at each delivery boundary.
phrases.1: I retained immutable image identity and Git reconciliation.
phrases.2: I verified least-privilege secret access and real end-to-end service.
questions.0.points.0: Applied desired state can still reference unavailable images or Secrets.
questions.0.points.1: Inspect sync, health, events and real requests separately.
questions.0.prompt: Why can an Application be Synced while its Pods fail?
questions.1.points.0: Correct source revision, running digest and scoped runtime credentials.
questions.1.points.1: A useful request succeeds through the recovered service.
questions.1.prompt: What does a complete recovery verify beyond a green controller?
