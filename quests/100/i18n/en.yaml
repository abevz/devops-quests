title: Full platform recovery
brief: 'The private platform delivery chain (Gitea → private registry → Argo CD →
  Vault → board workload) is failing across two stages. On stage one, Argo CD is reconciling
  the wrong repository path: restore reconciliation of the manifests directory on
  the main revision while preserving automated self-heal and prune. On stage two,
  the synced board workload still fails at runtime: restore private image pull access
  and least-privilege Vault secret delivery (read-only access to the dispatch KV path)
  without altering the immutable image or Secret references in the Git manifest. Every
  service belongs only to this disposable bay.


  Quest files in `~/quest` (some appear in later stages): `platform.env`, `application.json`,
  `repository/manifests/board.json`, `baseline-commit`, `private-release.json`, `reader.hcl`,
  `sync-secret.sh`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images
  and private services. Change only this bay.


  Initial success criteria: Argo reconciles the correct private Git path and original
  main revision with automation retained; runtime credentials are the next incident.'
debrief: The complete Git → registry → Argo CD → Vault delivery path was recovered
  without bypassing desired state or widening secret access.
