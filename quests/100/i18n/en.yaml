  restores drift and removes resources no longer present in the desired release.
stages.1.objectives.0.text: Remote `main` equals the revision recorded in `release-commit`.
stages.1.objectives.1.text: The published workload uses the supplied frozen image and obtains its runtime secret
  through the intended Secret reference.
stages.1.objectives.2.text: Application `board` reports `Synced` and `Healthy` at the published release revision.
  It automatically restores drift and removes resources no longer present in the desired release.
stages.1.objectives.3.text: Deployment `board` uses the supplied frozen image, preserves its original pull requirements
  and obtains its runtime secret without embedding the value.
stages.1.objectives.4.text: The workload Secret contains the value of the intended Vault record.
stages.1.objectives.5.text: The Vault access token returns the intended delivery secret and denies an unrelated
  data record.
stages.1.objectives.6.text: Deployment `board` completes its rollout with a ready application container running
  the supplied frozen image digest.
stages.1.objectives.7.text: From Deployment `board`, `http://board:8080` returns `north-100`.
