title: Full platform recovery
brief: 'The full private delivery chain is broken at three boundaries: Argo points to a retired Git path,
  the private image pull credential is missing, and the Vault reader policy targets the wrong KV path.
  First recover source.path=manifests while preserving the main revision and automated self-heal/prune.
  Then restore the private registry pull Secret and a least-privilege dispatch reader policy, run sync-secret.sh
  and recover the existing board. The Git manifest already selects the correct immutable image and Secret
  reference; retain them. Every service belongs only to this disposable bay.


  Quest files in `~/quest` (some appear in later stages): `platform.env`, `application.json`, `repository/manifests/board.json`,
  `baseline-commit`, `private-release.json`, `reader.hcl`, `sync-secret.sh`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: Argo reconciles the correct private Git path and original main revision with
  automation retained; runtime credentials are the next incident.'
debrief: The complete Git → registry → Argo CD → Vault delivery path was recovered without bypassing desired
  state or widening secret access.
