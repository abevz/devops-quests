stages.1.brief: 'Success criteria: Git, immutable registry image, Argo desired state
  and least-privilege Vault data agree; the real board serves north-100.'
stages.1.objectives.0.text: Git, immutable registry image, Argo desired state and
  least-privilege Vault data agree; the real board serves north-100.
hints.0.text: 'Stage 1: inspect application.json — Argo CD points to a retired Git
  path instead of source.path=manifests on revision main with automated self-heal
  and prune.'
hints.1.text: 'Stage 2: a Synced Application is still unhealthy because the private
  registry pull Secret is missing and reader.hcl points to the wrong Vault KV path.'
hints.2.text: Restore the registry pull Secret from private-release.json, scope reader.hcl
  to dispatch read-only, run sync-secret.sh, and verify the running image digest and
  HTTP response.
phrases.0: I isolated failures at each delivery boundary.
phrases.1: I retained immutable image identity and Git reconciliation.
phrases.2: I verified least-privilege secret access and real end-to-end service.
questions.0.points.0: Applied desired state can still reference unavailable images
  or Secrets.
questions.0.points.1: Inspect sync, health, events and real requests separately.
questions.0.prompt: Why can an Application be Synced while its Pods fail?
questions.1.points.0: Correct source revision, running digest and scoped runtime credentials.
questions.1.points.1: A useful request succeeds through the recovered service.
questions.1.prompt: What does a complete recovery verify beyond a green controller?
