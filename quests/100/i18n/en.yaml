title: Full platform recovery
brief: "The private delivery chain is not yet serving the intended release. Its published revision, runtime artifact\
  \ and secret access must agree.\n\nWork in `~/quest` on the workstation. Inputs by stage:\n- Stage 1: `platform.env`,\
  \ `application.yaml`, `repository/manifests/board.yaml`, `repository/manifests/service.yaml`, `release-commit`,\
  \ `private-release.json`.\n- Stage 2: `reader.hcl`, `sync-secret.sh`.\n\n**Requirements:**\n\n- Stage 1:\n  -\
  \ Application `board` reports `Synced` at the intended published revision. It automatically restores drift and\
  \ removes resources no longer present in the desired release.\n- Stage 2:\n  - Remote `main` equals the revision\
  \ recorded in `release-commit`.\n  - The published workload uses the supplied frozen image and obtains its runtime\
  \ secret through the intended Secret reference.\n  - Application `board` reports `Synced` and `Healthy` at the\
  \ published release revision. It automatically restores drift and removes resources no longer present in the desired\
  \ release.\n  - Deployment `board` uses the supplied frozen image, preserves its original pull requirements and\
  \ obtains its runtime secret without embedding the value.\n  - The workload Secret contains the value of the intended\
  \ Vault record.\n  - The Vault access token returns the intended delivery secret and denies an unrelated data\
  \ record.\n  - Deployment `board` completes its rollout with a ready application container running the supplied\
  \ frozen image digest.\n  - From Deployment `board`, `http://board:8080` returns `north-100`.\n\nThe check observes\
  \ selected configuration, values and two Vault paths; it cannot prove the entire Git history or that every other\
  \ Vault path is denied."
debrief: The checks verified selected Git, Argo, board and Vault results; they do not establish complete policy
  scope or unchanged history.
stages.0.brief: Retain the original revision while restoring reconciliation.
stages.1.brief: The published release must agree across delivery and runtime boundaries.
hints.0.text: A reconciled source and a healthy runtime are separate outcomes. Compare the delivery boundary with
  the consumer boundary.
hints.1.text: 'Stage 1: inspect application.yaml — Argo CD points to a retired Git path instead of source.path=manifests
  on revision main with automated self-heal and prune.


  Stage 2: a Synced Application is still unhealthy because the private registry pull Secret is missing and reader.hcl
  points to the wrong Vault KV path.


  Inspect the supplied definitions, resource descriptions and events for the relevant stage.


  ```sh

  git -C repository log --all --oneline

  cat reader.hcl

  kubectl describe application board

  kubectl describe deployment board

  kubectl describe pod -l app=board

  ```


  Stage 1/2: Inspect these resource definitions for this stage.


  ```sh

  kubectl get application board -o yaml

  kubectl get deployment board -o yaml

  kubectl get pods -l app=board -o yaml

  ```


  Stage 2: Inspect these resource definitions for this stage.


  ```sh

  git -C repository show origin/main:manifests/board.yaml

  ```'
hints.2.text: |-
  Restore the registry pull Secret from private-release.json, scope reader.hcl to dispatch read-only, run sync-secret.sh, and verify the running image digest and HTTP response.

  Verify the repaired stage and compare the observed result.

  Stage 1/2: The controller reports `Synced` at the expected revision; in the final stage it also reports `Healthy` and the workload is ready.

  ```sh
  kubectl get application board -o jsonpath='{.status.sync.status} {.status.health.status} {.status.sync.revision}'; printf '\n'
  kubectl get deployment board
  ```

  Stage 2: The published hash matches the recorded release; the ancestry check, when present, exits `0`.

  ```sh
  source platform.env
  cat release-commit
  git -C repository ls-remote origin refs/heads/main
  ```

  Stage 2: The Secret and allowed Vault record contain `north-secret`, HTTP returns `north-100`, and the other Vault path returns HTTP `403`.

  ```sh
  source platform.env
  kubectl get secret route-secret -o jsonpath='{.data.value}' | base64 -d
  printf '\n'
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080
  printf '\n'
  curl -fsS --max-time 3 -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch"
  curl -sS --max-time 3 -o /dev/null -w '%{http_code}\n' -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/other"
  ```

  Expected observations for the complete stage:
  - Stage 1/2: The displayed reconciliation, workload configuration and running-image observations match this stage’s Requirements.
  - Stage 2: The remote hash equals `release-commit`; the Git manifest has the supplied frozen image and Secret `route-secret` reference.

phrases.0: I isolated failures at each delivery boundary.
phrases.1: I retained immutable image identity and Git reconciliation.
phrases.2: I verified least-privilege secret access and real end-to-end service.
questions.0.points.0: Applied desired state can still reference unavailable images or Secrets.
questions.0.points.1: Inspect sync, health, events and real requests separately.
questions.0.prompt: Why can an Application be Synced while its Pods fail?
questions.1.points.0: Correct source revision, running digest and scoped runtime credentials.
questions.1.points.1: A useful request succeeds through the recovered service.
questions.1.prompt: What does a complete recovery verify beyond a green controller?
diagnostics.repo: application/board repoURL must equal GIT_URL.
diagnostics.path: |-
  The source directory must resolve to manifests inside the repository.

diagnostics.target: application/board targetRevision must equal main.
diagnostics.selfheal: application/board selfHeal must equal true.
diagnostics.prune: application/board prune must equal true.
diagnostics.synced: application/board sync.status must equal Synced.
diagnostics.baseline: baseline-commit must be nonempty.
diagnostics.baseline_revision: application/board sync.revision must equal baseline-commit.
diagnostics.fetch: git fetch origin main must succeed.
diagnostics.origin: release-commit must be nonempty and equal origin/main.
diagnostics.health: application/board health.status must equal Healthy.
diagnostics.release_revision: application/board sync.revision must equal release-commit.
diagnostics.rollout: The deployment/board rollout must complete.
diagnostics.http: The request to board:8080 must return north-100.
diagnostics.image: private-release.json image must be nonempty.
diagnostics.board_image: |-
  The named worker image must match private-release.json.

diagnostics.board_policy: deployment/board containers[0].imagePullPolicy must equal Always.
diagnostics.board_secret: |-
  The worker must use only the existing registry-pull credentials, including effective Pod references.

diagnostics.board_env: |-
  The named worker ROUTE_SECRET must reference route-secret/value without a literal or duplicate variable.

diagnostics.secret: The decoded route-secret value must equal north-secret.
diagnostics.image_id: |-
  A current Deployment-owned Pod must have a ready running worker with the exact frozen image digest.

diagnostics.reader: The Vault reader token must read north-secret from secret/data/dispatch.
diagnostics.denied: The Vault reader request to secret/data/other must return HTTP 403.
diagnostics.git_image: |-
  The named worker image must match private-release.json.

diagnostics.git_env: |-
  The named worker ROUTE_SECRET must reference route-secret/value without a literal or duplicate variable.

