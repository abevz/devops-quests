title: Repository webhook
brief: 'A private Git release is waiting because its repository webhook uses a retired
  URL. Periodic Argo Git polling is disabled in this bay; initial synchronization
  worked, then Gitea pushed a newer board commit. Repair the existing push hook using
  webhook.env and the frozen target in /run/dq/facts/0/webhook-target.json. Gitea
  sends its Gogs-compatible signed format because the pinned Argo version supports
  that parser. The Gitea hook test endpoint provides the normal redelivery path. Restore
  the stored hook configuration and deliver a signed main event; a manual Argo refresh
  alone is insufficient. The receiver is a private NodePort on the owned kind bridge,
  with no VM or host port publication.


  Quest files in `~/quest` (some appear in later stages): `platform.env`, `webhook.env`,
  `webhook-target.json`, `hook-id`, `hook-create.json`, `hook-repair.json`, `initial-commit`,
  `release-commit`, `application.json`, `repository/manifests/board.json`, `repository/manifests/service.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images
  and private services. Change only this bay.


  Initial success criteria: The original signed push hook points to its frozen receiver
  URL, and the newer main revision becomes Synced/Healthy with HTTP north-75.


  A backend observation under `/run/dq/observations/webhook.json` must confirm an
  accepted authenticated main event; a manual Argo refresh does not create it.'
debrief: The configured hook and an accepted signed main event were verified while
  periodic Git polling was disabled.
stages.0.brief: 'Success criteria: The original signed push hook points to its frozen
  receiver URL, and the newer main revision becomes Synced/Healthy with HTTP north-75.'
stages.0.objectives.0.text: The original signed push hook points to its frozen receiver
  URL, and the newer main revision becomes Synced/Healthy with HTTP north-75.
hints.0.text: A webhook-triggered refresh and an automatic periodic poll are different
  mechanisms.
hints.1.text: Use the existing Gogs hook, JSON content type and shared game secret;
  inspect its URL without printing the secret.
hints.2.text: PATCH the frozen hook ID to the supplied receiver, then POST its /tests
  endpoint and observe the new revision.
phrases.0: I separated webhook delivery from periodic reconciliation.
phrases.1: I verified the receiver URL and shared-secret protocol compatibility.
phrases.2: I observed the new commit and real HTTP behavior after redelivery.
questions.0.points.0: A source change still needs a refresh trigger.
questions.0.points.1: Check event delivery, receiver path and signature compatibility.
questions.0.points.2: Observe the commit actually reconciled, not only the sender
  request.
questions.0.prompt: Why can a correct Git commit remain unapplied when polling is
  disabled?
questions.1.points.0: It proves possession of the shared secret and detects payload
  modification.
questions.1.points.1: Both sides need the same secret and supported format.
questions.1.points.2: It does not grant the application broader cluster authority.
questions.1.prompt: What does signing a webhook protect?
