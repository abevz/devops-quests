diagnostics.webhook_hook: The supplied hook points to a retired receiver URL; compare the existing hook with the frozen target, JSON push event and main branch settings. Hook API or environment errors can also stop this check. [Cause and check](guides#guide=gitops-delivery&section=hook-existing-receiver-configuration)
diagnostics.webhook_revision: Setup already published the target descendant; a failed fetch, mismatched release-commit or lost baseline ancestry can break this check. Compare the existing records with origin/main before creating another commit. [Cause and check](guides#guide=gitops-delivery&section=hook-already-published-descendant-revision)
diagnostics.webhook_source: The Application may select another repository, branch or directory; preserve its supplied private Git source and normalized manifests path. [Cause and check](guides#guide=gitops-delivery&section=hook-application-private-source)
diagnostics.webhook_health: The target revision may not have reconciled yet, or Application health may remain degraded; compare sync status and revision with release-commit after repairing event delivery. [Cause and check](guides#guide=gitops-delivery&section=hook-application-reconciled-target)
diagnostics.webhook_rollout: The current Pods may not be ready during adoption or after a rollout; inspect events and rollout status while retaining the original Deployment and pod template specification. [Cause and check](guides#guide=gitops-delivery&section=hook-current-rollout-readiness)
diagnostics.probe_0_5: The supplied server copies its ConfigMap notice only at startup, so synchronized data may leave old HTTP output until the existing Deployment rolls out new Pods. Replaced identities, changed source/template, an unready Pod, wrong HTTP content or observer errors also fail this check. [Cause and check](guides#guide=gitops-delivery&section=hook-configmap-adoption-in-current-pod)
diagnostics.webhook_acceptance: The receiver may never have accepted the intended push because the hook URL, secret or event filter is wrong; inspect server acceptance and retry delivery. An HTTP request alone does not create the protected acceptance receipt. [Cause and check](guides#guide=gitops-delivery&section=hook-server-owned-accepted-event-receipt)
