title: Webhook репозитория
brief: |-
  Опубликованный релиз board не дошёл до потребителей. Восстановите доставку через существующий приёмник событий репозитория.

  Работайте на workstation в `~/quest` с файлами `platform.env`, `webhook.env`, `hook-id`, `hook-repair.json`, `release-commit`, `application.yaml`, `repository/`.

  Если не указано иное, ресурсы Kubernetes находятся в namespace песочницы (`DQ_NAMESPACE`); пути в `~/quest` — на workstation.

  **Requirements:**

  - Существующий push hook репозитория активен для `main` и направлен на предназначенный приватный приёмник событий.
  - Опубликованная `origin/main` совпадает с `~/quest/release-commit` на workstation и является новым потомком существующей истории репозитория.
  - Application `board` сохраняет предоставленный приватный источник Git, ветку релиза и существующий каталог нагрузки.
  - Application `board` сообщает `Synced` и `Healthy` для коммита из `~/quest/release-commit` на workstation.
  - Deployment `board` завершает rollout в namespace песочницы.
  - Внутри Pod Deployment `board` адрес `http://board:8080` возвращает `north-75`.
  - Приватный приёмник принял аутентифицированное событие `main` из предоставленного репозитория.

  Принятое событие и текущий релиз не доказывают успешность всех будущих доставок webhook.
debrief: Проверены конфигурация hook и принятый подписанный main event при отключённом периодическом опросе
  Git.
stages.0.brief: Сохраните исходный hook репозитория и существующую историю Git.
hints.0.text: Webhook refresh и периодический опрос — разные механизмы.
hints.1.text: |-
  Изучите конфигурацию существующего hook и сведения о приёмнике; не выводите общий секрет.

  ```bash
  source platform.env
  source webhook.env
  api="${GIT_URL%/rail/station.git}/api/v1/repos/rail/station"
  curl -fsS --config <(printf 'user = "%s:%s"\n' "$GIT_USER" "$GIT_PASSWORD") "$api/hooks/$(cat hook-id)" | jq '{active,branch_filter,url:.config.url}'
  ```
hints.2.text: |-
  Исправьте сохранённый hook ID через PATCH на выданный receiver, вызовите POST /tests и наблюдайте новый revision. Используйте существующий Gogs hook, JSON и общий игровой secret; изучайте URL без печати secret.

  Проверьте из `~/quest` на workstation:

  - `source platform.env`
  - `git -C repository ls-remote origin refs/heads/main`
  - `cat release-commit`

  Хеш удалённой `main` совпадает с `release-commit`.

  - `kubectl get application board -o json | jq '{sync:.status.sync.status, health:.status.health.status, revision:.status.sync.revision,repo:.spec.source.repoURL,path:.spec.source.path,branch:.spec.source.targetRevision}'`
  - `jq '{repo,branch,authenticated}' /run/dq/observations/webhook.json`

  `Synced`, `Healthy` и ревизия из `release-commit`. Наблюдение указывает предоставленный репозиторий, `branch: "main"` и `authenticated: true`. Источник — предоставленный приватный репозиторий, `manifests`, `main`.

  - `kubectl rollout status deployment/board --timeout=3s`
  - `kubectl exec deployment/board -- wget -qO- -T 3 http://board:8080`

  Rollout завершён; `north-75`.
phrases.0: Я разделил доставку webhook и периодическую сверку.
phrases.1: Я проверил URL receiver и совместимость протокола общего secret.
phrases.2: После повторной доставки я проверил новый commit и реальный HTTP-ответ.
questions.0.points.0: Смена source всё ещё требует refresh trigger.
questions.0.points.1: Проверить доставку события, путь receiver и совместимость подписи.
questions.0.points.2: Проверить фактически применённый commit, а не только запрос sender.
questions.0.prompt: Почему правильный Git commit может не примениться при отключённом опросе?
questions.1.points.0: Она подтверждает знание общего секрета и обнаруживает изменение payload.
questions.1.points.1: Обеим сторонам нужны одинаковый secret и поддерживаемый формат.
questions.1.points.2: Она не даёт приложению более широких прав в кластере.
questions.1.prompt: Что защищает подпись webhook?
