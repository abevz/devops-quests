title: Webhook репозитория
brief: 'Приватный Git-релиз ожидает: repository webhook использует устаревший URL.
  Периодический опрос Git в Argo этой песочницы отключён; начальная синхронизация
  прошла, затем Gitea получила новый commit board. Исправьте существующий push hook
  по webhook.env и сохранённому target из /run/dq/facts/0/webhook-target.json. Gitea
  отправляет подписанный Gogs-совместимый формат, который поддерживает закреплённая
  версия Argo. Штатный путь повторной доставки — endpoint тестирования hook Gitea.
  Восстановите конфигурацию hook и доставьте подписанный main event; одного ручного
  Argo refresh недостаточно. Receiver — приватный NodePort собственной kind bridge
  без публикации портов VM и хоста.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `platform.env`,
  `webhook.env`, `webhook-target.json`, `hook-id`, `hook-create.json`, `hook-repair.json`,
  `initial-commit`, `release-commit`, `application.json`, `repository/manifests/board.json`,
  `repository/manifests/service.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно
  загруженные образы и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Исходный подписанный push hook использует сохранённый URL receiver,
  новый main revision становится Synced/Healthy с HTTP north-75.


  Наблюдение backend в `/run/dq/observations/webhook.json` должно подтвердить принятый
  аутентифицированный main event; ручной Argo refresh его не создаёт.'
debrief: Проверены конфигурация hook и принятый подписанный main event при отключённом
  периодическом опросе Git.
stages.0.brief: 'Результат проверки: Исходный подписанный push hook использует сохранённый
  URL receiver, новый main revision становится Synced/Healthy с HTTP north-75.'
stages.0.objectives.0.text: Исходный подписанный push hook использует сохранённый
  URL receiver, новый main revision становится Synced/Healthy с HTTP north-75.
hints.0.text: Webhook refresh и периодический опрос — разные механизмы.
hints.1.text: Используйте существующий Gogs hook, JSON и общий игровой secret; изучайте
  URL без печати secret.
hints.2.text: Исправьте сохранённый hook ID через PATCH на выданный receiver, вызовите
  POST /tests и наблюдайте новый revision.
phrases.0: Я разделил доставку webhook и периодическую сверку.
phrases.1: Я проверил URL receiver и совместимость протокола общего secret.
phrases.2: После повторной доставки я проверил новый commit и реальный HTTP-ответ.
questions.0.points.0: Смена source всё ещё требует refresh trigger.
questions.0.points.1: Проверить доставку события, путь receiver и совместимость подписи.
questions.0.points.2: Проверить фактически применённый commit, а не только запрос
  sender.
questions.0.prompt: Почему правильный Git commit может не примениться при отключённом
  опросе?
questions.1.points.0: Она подтверждает знание общего секрета и обнаруживает изменение
  payload.
questions.1.points.1: Обеим сторонам нужны одинаковый secret и поддерживаемый формат.
questions.1.points.2: Она не даёт приложению более широких прав в кластере.
questions.1.prompt: Что защищает подпись webhook?
