guides.reference_1: Справочник API и диагностики
guides.reference_2: Справочник проверки публикации и потребителей
diagnostics.webhook_hook: Выданный hook указывает на устаревший URL получателя; сравните существующий hook с зафиксированным адресом, событием push в JSON и веткой main. Ошибки API или окружения также мешают проверке. [Причина и проверка](guides#guide=gitops-delivery&section=hook-existing-receiver-configuration)
diagnostics.webhook_revision: Setup уже опубликовал целевого потомка; ошибка fetch, несовпадающий release-commit или потерянный предок нарушают проверку. Сравните существующие записи с origin/main до создания нового коммита. [Причина и проверка](guides#guide=gitops-delivery&section=hook-already-published-descendant-revision)
diagnostics.webhook_source: Application может выбирать другой репозиторий, ветку или каталог; сохраните выданный приватный источник Git и нормализованный путь manifests. [Причина и проверка](guides#guide=gitops-delivery&section=hook-application-private-source)
diagnostics.webhook_health: Целевая ревизия могла ещё не синхронизироваться либо Application остаётся нездоровым; сравните sync status и revision с release-commit после исправления доставки события. [Причина и проверка](guides#guide=gitops-delivery&section=hook-application-reconciled-target)
diagnostics.webhook_rollout: Текущие Pod могут быть не готовы при принятии данных или после rollout; проверьте events и rollout status, сохраняя исходный Deployment и спецификацию pod template. [Причина и проверка](guides#guide=gitops-delivery&section=hook-current-rollout-readiness)
diagnostics.probe_0_5: 'Выданный сервер копирует notice из ConfigMap только при старте: синхронизация оставляет старый HTTP-ответ до новых Pod через rollout исходного Deployment. Замена идентичностей, изменение источника/template, неготовый Pod, неверный HTTP-ответ или ошибки наблюдения также дают сбой. [Причина и проверка](guides#guide=gitops-delivery&section=hook-configmap-adoption-in-current-pod)'
diagnostics.webhook_acceptance: Получатель мог не принять нужный push из-за неверного URL, secret или фильтра событий hook; проверьте принятие сервером и повторите доставку. Один HTTP-запрос не создаёт защищённое подтверждение принятия. [Причина и проверка](guides#guide=gitops-delivery&section=hook-server-owned-accepted-event-receipt)
