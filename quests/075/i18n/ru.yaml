title: Webhook репозитория
brief: 'Опубликованный релиз не дошёл до работающего приложения через существующий приёмник событий. Восстановите
  цепочку доставки, сохранив идентичность приложения, нагрузки и публикации, а также исходную программу.


  Работайте в `~/quest`. Исходные записи описывают доверенный источник и защищённую публикацию; замороженные копии
  в `/run/dq/facts/0/` остаются авторитетными. Сохраните исходные идентичности, программы, границы доступа и доверие
  TLS. Не выводите учётные данные и не заменяйте защищённый источник.


  Входы: `platform.env`, `webhook.env`, `hook-id`, `release-commit`, `repository/`, `application.yaml` и `webhook-publication.json`.
  Все активные принадлежащие нагрузке pod должны принять утверждённую публикацию Git с сохранением исходных ConfigMap,
  контроллера, ссылки на источник только для чтения и спецификации pod. Текущий приём события не гарантирует будущую
  доставку.


  **Требования:**


  - Существующий push hook репозитория активен для `main` и направлен на предназначенный приватный приёмник событий.

  - Опубликованная `origin/main` совпадает с `~/quest/release-commit` на workstation и является новым потомком существующей
  истории репозитория.

  - Application `board` сохраняет предоставленный приватный источник Git, ветку релиза и существующий каталог нагрузки.

  - Application `board` сообщает `Synced` и `Healthy` для коммита из `~/quest/release-commit` на workstation.

  - Deployment `board` завершает rollout в namespace песочницы.

  - Исходная нагрузка и активный принадлежащий ей pod сохраняют идентичность, программу и источник только для чтения;
  согласованный ConfigMap и HTTP-ответ приложения соответствуют утверждённой публикации Git.

  - Приватный приёмник принял аутентифицированное событие `main` из предоставленного репозитория.'
debrief: Идентичности исходных источников и потребителей сохранены; утверждённый релиз проверен на каждой затронутой
  границе.
stages.0.brief: Опубликованный релиз не дошёл до работающего приложения через существующий приёмник событий. Восстановите
  цепочку доставки, сохранив идентичность приложения, нагрузки и публикации, а также исходную программу.
hints.0.text: Принятое событие, согласованные ресурсы и принятые приложением данные — отдельные границы.
hints.1.text: |-
  Сопоставьте существующий hook, адрес приёмника, публикацию Git, статус контроллера и программу запуска приложения. Смотрите метаданные без вывода общих секретов.

  Проверьте признак активности hook, фильтр веток и URL получателя. Сопоставьте запись о доставке с опубликованной ревизией Git и наблюдаемой ревизией Application.

  ```bash
  source platform.env
  api="${GIT_URL%/rail/station.git}/api/v1/repos/rail/station"
  curl -fsS --max-time 3 --config <(printf 'user = "%s:%s"\n' "$GIT_USER" "$GIT_PASSWORD") "$api/hooks/$(cat hook-id)" | jq '{active,branch_filter,url:.config.url}'
  cat webhook-target.json
  kubectl get application board -o json | jq '{sync:.status.sync.status,health:.status.health.status,revision:.status.sync.revision}'
  cat repository/manifests/publication.yaml repository/manifests/board.yaml
  name=$(jq -er '.approved.metadata.name' webhook-publication.json)
  kubectl get configmap "$name" -o yaml
  ```
hints.2.text: |-
  Проверьте из `~/quest` на workstation:

  - `source platform.env`
  - `git -C repository ls-remote origin refs/heads/main`
  - `cat release-commit`

  Хеш удалённой `main` совпадает с `release-commit`.

  - `kubectl get application board -o json | jq '{sync:.status.sync.status, health:.status.health.status, revision:.status.sync.revision,repo:.spec.source.repoURL,path:.spec.source.path,branch:.spec.source.targetRevision}'`
  - `jq '{repo,branch,authenticated}' /run/dq/observations/webhook.json`

  `Synced`, `Healthy` и ревизия из `release-commit`. Наблюдение указывает предоставленный репозиторий, `branch: "main"` и `authenticated: true`. Источник — предоставленный приватный репозиторий, `manifests`, `main`.

  - `kubectl rollout status deployment/board --timeout=3s`
  - `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080`

  Rollout завершён; `north-75`.

  Исправив исходный hook и подтвердив аутентифицированную доставку, обновите принятую приложением публикацию. Программа запуска копирует проецируемый источник в обслуживаемый каталог; изменение ConfigMap не переписывает эту кешированную копию. Один допустимый способ — rolling restart исходного Deployment с сохранением контроллера, программы и источника только для чтения.

  ```bash
  set -euo pipefail
  cd ~/quest
  source platform.env
  python3 -I - <<'VERIFY_RELEASE'

  import json,subprocess,yaml
  from pathlib import Path
  from dq_check import current_pods,pod_worker,ready_image,workload_worker
  def k(*args):
   return json.loads(subprocess.check_output(['kubectl',*args,'-o','json'],timeout=2))
  contract=json.loads(Path('/run/dq/facts/0/webhook-publication.json').read_text())
  old=contract['deployment']
  deployment=k('get','deployment','board')
  assert deployment['metadata']['uid']==old['metadata']['uid']
  assert deployment['spec']['selector']==old['spec']['selector']
  assert deployment['spec']['replicas']==old['spec']['replicas']==1
  assert deployment['spec']['template']['spec']==old['spec']['template']['spec']
  app=k('get','application','board')
  assert app['metadata']['uid']==contract['application']['metadata']['uid']
  assert app['spec']==contract['application']['spec']
  revision=app['status']['sync']['revision']
  subprocess.run(['git','-C','repository','merge-base','--is-ancestor',contract['release_commit'],revision],check=True,timeout=2)
  desired=yaml.safe_load(subprocess.check_output(['git','-C','repository','show',revision+':'+contract['source_file']],text=True,timeout=2))
  assert desired['kind']=='ConfigMap' and desired['metadata']['name']==contract['approved']['metadata']['name']
  assert desired['data']==contract['approved']['data']
  config=k('get','configmap',desired['metadata']['name'])
  assert config['metadata']['uid']==contract['publication_uid']
  assert config['data']==desired['data']
  worker=workload_worker(deployment)
  pods=current_pods(deployment,k('get','replicasets'),k('get','pods'))
  assert len(pods)==1
  for pod in pods:
   assert ready_image(pod,worker['image'])
   current=pod_worker(pod)
   for key in ('command','args'):
    assert current.get(key)==worker.get(key)
   for mount in worker.get('volumeMounts',[]):
    assert mount.get('readOnly') is True and mount in current.get('volumeMounts',[])
   value=subprocess.check_output(['kubectl','exec',pod['metadata']['name'],'-c','worker','--','wget','-qO-','-T','2','http://127.0.0.1:8080'],timeout=3)
   assert value.decode().rstrip('\n')==desired['data']['notice'].rstrip('\n')

  print('OK')
  VERIFY_RELEASE
  ```

  Ожидается OK. Учётные данные не выводятся.
phrases.0: Я разделил доставку webhook и периодическую сверку.
phrases.1: Я проверил URL receiver и совместимость протокола общего secret.
phrases.2: После повторной доставки я проверил новый commit и реальный HTTP-ответ.
questions.0.points.0: Смена source всё ещё требует refresh trigger.
questions.0.points.1: Проверить доставку события, путь receiver и совместимость подписи.
questions.0.points.2: Проверить фактически применённый commit, а не только запрос sender.
questions.0.prompt: Почему правильный Git commit может не примениться при отключённом опросе?
questions.1.points.0: Она подтверждает знание общего секрета и обнаруживает изменение payload.
questions.1.points.1: Обеим сторонам нужны одинаковый secret и поддерживаемый формат.
questions.1.points.2: Она не даёт приложению более широких прав в кластере.
questions.1.prompt: Что защищает подпись webhook?
