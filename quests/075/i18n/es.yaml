title: Webhook del repositorio
brief: 'Se está esperando una versión privada de Git porque su repository webhook usa un retired URL.
  El sondeo periódico Argo Git está deshabilitado en esta bahía; La sincronización inicial funcionó, luego
  Gitea impulsó una confirmación board más nueva. Repare el push hook existente usando webhook.env y el
  objetivo congelado en /run/dq/facts/0/webhook-target.json. Gitea envía su formato firmado compatible
  con Gogs porque la versión fijada de Argo admite ese analizador. La prueba Gitea hook endpoint proporciona
  la ruta de reenvío normal. Restaure la configuración hook almacenada y entregue un main event firmado;
  un manual Argo refresh por sí solo es insuficiente. El receiver es un NodePort privado en el kind bridge
  de propiedad, sin VM ni publicación de puerto de host.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `platform.env`, `webhook.env`,
  `webhook-target.json`, `hook-id`, `hook-create.json`, `hook-repair.json`, `initial-commit`, `release-commit`,
  `application.json`, `repository/manifests/board.json`, `repository/manifests/service.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: el push hook original firmado apunta a su receiver URL congelado, y el
  nuevo main revision se convierte en Synced/Healthy con HTTP north-75.


  Una observación backend bajo `/run/dq/observations/webhook.json` debe confirmar un main event autenticado
  aceptado; un manual Argo refresh no lo crea.'
debrief: El hook configurado y un main event firmado aceptado se verificaron mientras el sondeo periódico
  Git estaba deshabilitado.
stages.0.brief: 'Criterios de éxito: el push hook original firmado apunta a su receiver URL congelado,
  y el main revision más nuevo se convierte en Synced/Healthy con HTTP north-75.'
stages.0.objectives.0.text: El push hook original firmado apunta a su receiver URL congelado, y el nuevo
  main revision se convierte en Synced/Healthy con HTTP north-75.
hints.0.text: Un refresh activado por webhook y una encuesta periódica automática son mecanismos diferentes.
hints.1.text: Utilice el tipo de contenido Gogs hook, JSON existente y el juego compartido secret; inspect
  es URL sin imprimir el secret.
hints.2.text: PATCH el hook ID congelado al receiver suministrado, luego POST su punto final /tests y
  observe el nuevo revision.
phrases.0: Separé la entrega de webhook de la conciliación periódica.
phrases.1: Verifiqué el receiver URL y la compatibilidad del protocolo de secreto compartido.
phrases.2: Observé la nueva confirmación y el comportamiento real de HTTP después de la nueva entrega.
questions.0.points.0: Un cambio de fuente aún necesita un refresh trigger.
questions.0.points.1: Verifique la entrega de eventos, la ruta receiver y la compatibilidad de firmas.
questions.0.points.2: Observe la confirmación realmente conciliada, no solo la solicitud sender.
questions.0.prompt: ¿Por qué una confirmación Git correcta puede permanecer sin aplicarse cuando el sondeo
  está deshabilitado?
questions.1.points.0: Demuestra posesión del secreto compartido y detecta modificación payload.
questions.1.points.1: Ambas partes necesitan el mismo secret y el mismo formato compatible.
questions.1.points.2: No otorga a la aplicación una autoridad de clúster más amplia.
questions.1.prompt: ¿Qué protege la firma de un webhook?
