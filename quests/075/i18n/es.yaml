title: Webhook del repositorio
brief: |-
  Una versión publicada de board no llega a sus consumidores. Restablece la entrega mediante el receptor de eventos existente del repositorio.

  Trabaja en la workstation en `~/quest` con `platform.env`, `webhook.env`, `hook-id`, `hook-repair.json`, `release-commit`, `application.yaml`, `repository/`.

  Salvo indicación contraria, los recursos Kubernetes están en el namespace de la bahía (`DQ_NAMESPACE`); las rutas bajo `~/quest` están en la workstation.

  **Requirements:**

  - El hook push existente del repositorio está activo para `main` y apunta al receptor privado de eventos previsto.
  - El `origin/main` publicado coincide con `~/quest/release-commit` en la workstation y es un nuevo descendiente del historial existente del repositorio.
  - La Application `board` conserva la fuente Git privada suministrada, la rama de la versión y el directorio existente de la carga.
  - La Application `board` informa `Synced` y `Healthy` en el commit de `~/quest/release-commit` en la workstation.
  - El Deployment `board` completa su rollout en el namespace de la bahía.
  - Dentro de un Pod del Deployment `board`, `http://board:8080` devuelve `north-75`.
  - El receptor privado ha aceptado un evento `main` autenticado del repositorio suministrado.

  El evento aceptado y la versión actual no demuestran que todas las entregas futuras del webhook vayan a funcionar.
debrief: El hook configurado y un main event firmado aceptado se verificaron mientras el sondeo periódico
  Git estaba deshabilitado.
stages.0.brief: Conserva el hook original del repositorio y el historial Git existente.
hints.0.text: Un refresh activado por webhook y una encuesta periódica automática son mecanismos diferentes.
hints.1.text: |-
  Inspecciona la configuración del hook existente y la referencia del receptor; omite el secreto compartido de la salida.

  ```bash
  source platform.env
  source webhook.env
  api="${GIT_URL%/rail/station.git}/api/v1/repos/rail/station"
  curl -fsS --config <(printf 'user = "%s:%s"\n' "$GIT_USER" "$GIT_PASSWORD") "$api/hooks/$(cat hook-id)" | jq '{active,branch_filter,url:.config.url}'
  ```
hints.2.text: |-
  PATCH el hook ID congelado al receiver suministrado, luego POST su punto final /tests y observe el nuevo revision. Utilice el tipo de contenido Gogs hook, JSON existente y el juego compartido secret; inspect es URL sin imprimir el secret.

  Verifica desde `~/quest` en la workstation:

  - `source platform.env`
  - `git -C repository ls-remote origin refs/heads/main`
  - `cat release-commit`

  El hash de `main` remoto coincide con `release-commit`.

  - `kubectl get application board -o json | jq '{sync:.status.sync.status, health:.status.health.status, revision:.status.sync.revision,repo:.spec.source.repoURL,path:.spec.source.path,branch:.spec.source.targetRevision}'`
  - `jq '{repo,branch,authenticated}' /run/dq/observations/webhook.json`

  `Synced`, `Healthy` y la revisión de `release-commit`. La observación indica el repositorio suministrado, `branch: "main"` y `authenticated: true`. La fuente es el repositorio privado suministrado, `manifests`, `main`.

  - `kubectl rollout status deployment/board --timeout=3s`
  - `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080`

  El rollout termina; `north-75`.
phrases.0: Separé la entrega de webhook de la conciliación periódica.
phrases.1: Verifiqué el receiver URL y la compatibilidad del protocolo de secreto compartido.
phrases.2: Observé la nueva confirmación y el comportamiento real de HTTP después de la nueva entrega.
questions.0.points.0: Un cambio de fuente aún necesita un refresh trigger.
questions.0.points.1: Verifique la entrega de eventos, la ruta receiver y la compatibilidad de firmas.
questions.0.points.2: Observe la confirmación realmente conciliada, no solo la solicitud sender.
questions.0.prompt: ¿Por qué una confirmación Git correcta puede permanecer sin aplicarse cuando el sondeo
  está deshabilitado?
questions.1.points.0: Demuestra posesión del secreto compartido y detecta modificación payload.
questions.1.points.1: Ambas partes necesitan el mismo secret y el mismo formato compatible.
questions.1.points.2: No otorga a la aplicación una autoridad de clúster más amplia.
questions.1.prompt: ¿Qué protege la firma de un webhook?
