diagnostics.webhook_hook: El hook suministrado apunta a URL retirado; compare hook existente con destino fijado, evento push JSON y rama main. Errores API o entorno también detienen control. [Causa y comprobación](guides#guide=gitops-delivery&section=hook-existing-receiver-configuration)
diagnostics.webhook_revision: Setup ya publicó el descendiente objetivo; un fetch fallido, release-commit distinto o pérdida de ancestro incumplen control. Compare registros existentes con origin/main antes de crear otro commit. [Causa y comprobación](guides#guide=gitops-delivery&section=hook-already-published-descendant-revision)
diagnostics.webhook_source: Application puede seleccionar otro repositorio, rama o directorio; conserve fuente Git privada suministrada y ruta manifests normalizada. [Causa y comprobación](guides#guide=gitops-delivery&section=hook-application-private-source)
diagnostics.webhook_health: La revisión objetivo puede no reconciliarse aún o Application seguir degradada; compare sync status y revision con release-commit tras reparar entrega de eventos. [Causa y comprobación](guides#guide=gitops-delivery&section=hook-application-reconciled-target)
diagnostics.webhook_rollout: Los Pod actuales pueden no estar listos al adoptar datos o tras rollout; revise events y rollout status conservando Deployment y especificación pod template originales. [Causa y comprobación](guides#guide=gitops-delivery&section=hook-current-rollout-readiness)
diagnostics.probe_0_5: El servidor copia notice de ConfigMap solo al iniciar; datos sincronizados pueden dejar HTTP antiguo hasta nuevos Pod mediante rollout de Deployment original. Identidades reemplazadas, fuente/template cambiados, Pod no listo, HTTP erróneo o errores de observación también fallan. [Causa y comprobación](guides#guide=gitops-delivery&section=hook-configmap-adoption-in-current-pod)
diagnostics.webhook_acceptance: El receptor puede no aceptar push por URL, secret o filtro de eventos incorrecto; revise aceptación del servidor y repita entrega. Una petición HTTP sola no crea recibo protegido de aceptación. [Causa y comprobación](guides#guide=gitops-delivery&section=hook-server-owned-accepted-event-receipt)
