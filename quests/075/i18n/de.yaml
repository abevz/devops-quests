title: Repository-Webhook
brief: |-
  Ein veröffentlichtes Board-Release erreicht seine Verbraucher nicht. Stellen Sie die Zustellung über den vorhandenen Ereignisempfänger des Repositorys wieder her.

  Arbeiten Sie auf der Workstation in `~/quest` mit `platform.env`, `webhook.env`, `hook-id`, `hook-repair.json`, `release-commit`, `application.yaml`, `repository/`.

  Sofern nicht anders angegeben, liegen Kubernetes-Ressourcen im Bay-Namespace (`DQ_NAMESPACE`); Pfade unter `~/quest` liegen auf der Workstation.

  **Requirements:**

  - Der vorhandene Push-Hook des Repositorys ist für `main` aktiv und erreicht den vorgesehenen privaten Ereignisempfänger.
  - Veröffentlichtes `origin/main` entspricht der Workstation-Datei `~/quest/release-commit` und ist ein neuer Nachfolger der vorhandenen Repository-Historie.
  - Application `board` behält die bereitgestellte private Git-Quelle, den Release-Branch und das vorhandene Workload-Verzeichnis bei.
  - Application `board` meldet `Synced` und `Healthy` für den Commit in der Workstation-Datei `~/quest/release-commit`.
  - Deployment `board` schließt seinen Rollout im Bay-Namespace ab.
  - In einem Pod von Deployment `board` liefert `http://board:8080` den Wert `north-75`.
  - Der private Empfänger hat ein authentifiziertes `main`-Ereignis aus dem bereitgestellten Repository angenommen.

  Das angenommene Ereignis und das aktuelle Release beweisen nicht, dass jede künftige Webhook-Zustellung erfolgreich sein wird.
debrief: Der konfigurierte hook und ein akzeptierter signierter main event wurden überprüft, während die
  periodische Git-Abfrage deaktiviert war.
stages.0.brief: Erhalten Sie den ursprünglichen Repository-Hook und die vorhandene Git-Historie.
hints.0.text: Ein durch den Webhook ausgelöster refresh und eine automatische regelmäßige Abfrage sind
  unterschiedliche Mechanismen.
hints.1.text: |-
  Prüfen Sie die vorhandene Hook-Konfiguration und die Empfängerreferenz; geben Sie das gemeinsame Secret nicht aus.

  ```bash
  source platform.env
  source webhook.env
  api="${GIT_URL%/rail/station.git}/api/v1/repos/rail/station"
  curl -fsS --config <(printf 'user = "%s:%s"\n' "$GIT_USER" "$GIT_PASSWORD") "$api/hooks/$(cat hook-id)" | jq '{active,branch_filter,url:.config.url}'
  ```
hints.2.text: |-
  PATCH das eingefrorene hook ID zum bereitgestellten receiver, dann POST seinen /tests-Endpunkt und beobachten Sie den neuen revision. Verwenden Sie den vorhandenen Inhaltstyp Gogs hook, JSON und das freigegebene Spiel secret. inspect ist URL, ohne den secret zu drucken.

  Prüfen Sie in `~/quest` auf der Workstation:

  - `source platform.env`
  - `git -C repository ls-remote origin refs/heads/main`
  - `cat release-commit`

  Der Hash von Remote-`main` entspricht `release-commit`.

  - `kubectl get application board -o json | jq '{sync:.status.sync.status, health:.status.health.status, revision:.status.sync.revision,repo:.spec.source.repoURL,path:.spec.source.path,branch:.spec.source.targetRevision}'`
  - `jq '{repo,branch,authenticated}' /run/dq/observations/webhook.json`

  `Synced`, `Healthy` und die Revision aus `release-commit`. Die Beobachtung nennt das bereitgestellte Repository, `branch: "main"` und `authenticated: true`. Die Quelle ist das bereitgestellte private Repository, `manifests`, `main`.

  - `kubectl rollout status deployment/board --timeout=3s`
  - `kubectl exec deployment/board -- wget -qO- -T 3 http://board:8080`

  Der Rollout ist abgeschlossen; `north-75`.
phrases.0: Ich habe die webhook-Lieferung vom periodischen Abgleich getrennt.
phrases.1: Ich habe die Kompatibilität des receiver URL und des Shared-Secret-Protokolls überprüft.
phrases.2: Ich habe das neue Commit und das echte HTTP-Verhalten nach der erneuten Lieferung beobachtet.
questions.0.points.0: Für einen Quellenwechsel ist noch ein refresh trigger erforderlich.
questions.0.points.1: Überprüfen Sie die Ereigniszustellung, den receiver-Pfad und die Signaturkompatibilität.
questions.0.points.2: Beobachten Sie den tatsächlich abgeglichenen Commit und nicht nur die sender-Anfrage.
questions.0.prompt: Warum kann ein korrektes Git-Commit nicht angewendet werden, wenn die Abfrage deaktiviert
  ist?
questions.1.points.0: Es beweist den Besitz des gemeinsamen Geheimnisses und erkennt die Modifikation
  payload.
questions.1.points.1: Beide Seiten benötigen den gleichen secret und das gleiche unterstützte Format.
questions.1.points.2: Der Anwendung wird dadurch keine umfassendere Clusterberechtigung gewährt.
questions.1.prompt: Was schützt die Unterzeichnung eines webhook?
