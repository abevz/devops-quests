title: Repository-Webhook
brief: 'Eine private Git-Version wartet, da ihr repository webhook einen retired URL verwendet. Die regelmäßige
  Abfrage von Argo Git ist in diesem Schacht deaktiviert. Die anfängliche Synchronisierung hat funktioniert,
  dann hat Gitea einen neueren board-Commit gepusht. Reparieren Sie das vorhandene push hook mit webhook.env
  und das eingefrorene Ziel in /run/dq/facts/0/webhook-target.json.. Gitea sendet sein Gogs-kompatibles
  signiertes Format, da die angeheftete Argo-Version diesen Parser unterstützt. Der Gitea hook-Test endpoint
  bietet den normalen Neuzustellungspfad. Stellen Sie die gespeicherte hook-Konfiguration wieder her und
  liefern Sie ein signiertes main event; Ein Handbuch Argo refresh allein reicht nicht aus. Der receiver
  ist ein privater NodePort auf dem eigenen kind bridge, ohne VM oder Host-Port-Veröffentlichung.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `platform.env`, `webhook.env`, `webhook-target.json`,
  `hook-id`, `hook-create.json`, `hook-repair.json`, `initial-commit`, `release-commit`, `application.json`,
  `repository/manifests/board.json`, `repository/manifests/service.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: Das ursprünglich signierte push hook verweist auf sein eingefrorenes receiver
  URL, und das neuere main revision wird zu Synced/Healthy mit HTTP north-75.


  Eine backend-Beobachtung unter `/run/dq/observations/webhook.json` muss eine akzeptierte authentifizierte
  main event bestätigen; ein Handbuch Argo refresh erstellt es nicht.'
debrief: Der konfigurierte hook und ein akzeptierter signierter main event wurden überprüft, während die
  periodische Git-Abfrage deaktiviert war.
stages.0.brief: 'Erfolgskriterium: Das ursprünglich signierte push hook verweist auf sein eingefrorenes
  receiver URL, und das neuere main revision wird zu Synced/Healthy mit HTTP north-75.'
stages.0.objectives.0.text: Das original signierte push hook verweist auf sein eingefrorenes receiver
  URL, und das neuere main revision wird zu Synced/Healthy mit HTTP north-75.
hints.0.text: Ein durch den Webhook ausgelöster refresh und eine automatische regelmäßige Abfrage sind
  unterschiedliche Mechanismen.
hints.1.text: Verwenden Sie den vorhandenen Inhaltstyp Gogs hook, JSON und das freigegebene Spiel secret.
  inspect ist URL, ohne den secret zu drucken.
hints.2.text: PATCH das eingefrorene hook ID zum bereitgestellten receiver, dann POST seinen /tests-Endpunkt
  und beobachten Sie den neuen revision.
phrases.0: Ich habe die webhook-Lieferung vom periodischen Abgleich getrennt.
phrases.1: Ich habe die Kompatibilität des receiver URL und des Shared-Secret-Protokolls überprüft.
phrases.2: Ich habe das neue Commit und das echte HTTP-Verhalten nach der erneuten Lieferung beobachtet.
questions.0.points.0: Für einen Quellenwechsel ist noch ein refresh trigger erforderlich.
questions.0.points.1: Überprüfen Sie die Ereigniszustellung, den receiver-Pfad und die Signaturkompatibilität.
questions.0.points.2: Beobachten Sie den tatsächlich abgeglichenen Commit und nicht nur die sender-Anfrage.
questions.0.prompt: Warum kann ein korrektes Git-Commit nicht angewendet werden, wenn die Abfrage deaktiviert
  ist?
questions.1.points.0: Es beweist den Besitz des gemeinsamen Geheimnisses und erkennt die Modifikation
  payload.
questions.1.points.1: Beide Seiten benötigen den gleichen secret und das gleiche unterstützte Format.
questions.1.points.2: Der Anwendung wird dadurch keine umfassendere Clusterberechtigung gewährt.
questions.1.prompt: Was schützt die Unterzeichnung eines webhook?
