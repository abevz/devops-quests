guides.reference_1: API- und Diagnosereferenz
guides.reference_2: Referenz zur Publikations- und Verbraucherprüfung
diagnostics.webhook_hook: Der gelieferte Hook zeigt auf eine veraltete Empfänger-URL; vergleichen Sie den bestehenden Hook mit eingefrorenem Ziel, JSON-Push-Ereignis und main Branch. API- oder Umgebungsfehler können die Prüfung ebenfalls stoppen. [Ursache und Prüfung](guides#guide=gitops-delivery&section=hook-existing-receiver-configuration)
diagnostics.webhook_revision: Setup hat die Ziel-Nachfolgerevision bereits veröffentlicht; fehlgeschlagenes fetch, abweichendes release-commit oder verlorene Basis-Abstammung verletzt die Prüfung. Vergleichen Sie vorhandene Nachweise mit origin/main vor einem weiteren Commit. [Ursache und Prüfung](guides#guide=gitops-delivery&section=hook-already-published-descendant-revision)
diagnostics.webhook_source: Application wählt möglicherweise anderes Repository, Branch oder Verzeichnis; erhalten Sie die gelieferte private Git-Quelle und den normalisierten manifests Pfad. [Ursache und Prüfung](guides#guide=gitops-delivery&section=hook-application-private-source)
diagnostics.webhook_health: Die Zielrevision ist möglicherweise noch nicht abgeglichen oder Application bleibt beeinträchtigt; vergleichen Sie sync status und revision nach Ereignisreparatur mit release-commit. [Ursache und Prüfung](guides#guide=gitops-delivery&section=hook-application-reconciled-target)
diagnostics.webhook_rollout: Die aktuellen Pods sind bei Datenübernahme oder nach einem Rollout möglicherweise nicht bereit; prüfen Sie Events und Rollout-Status unter Erhalt von ursprünglichem Deployment und Pod-Template-Spezifikation. [Ursache und Prüfung](guides#guide=gitops-delivery&section=hook-current-rollout-readiness)
diagnostics.probe_0_5: Der gelieferte Server kopiert ConfigMap notice nur beim Start; synchronisierte Daten können bis zu neuen Pods durch Rollout des ursprünglichen Deployments alte HTTP-Ausgabe lassen. Ersetzte Identitäten, geänderte Quelle/Template, unbereiter Pod, falscher HTTP-Inhalt oder Beobachtungsfehler führen ebenfalls zum Fehlschlag. [Ursache und Prüfung](guides#guide=gitops-delivery&section=hook-configmap-adoption-in-current-pod)
diagnostics.webhook_acceptance: Der Empfänger hat den Push wegen falscher URL, secret oder Ereignisfilter möglicherweise nie angenommen; prüfen Sie Serverannahme und wiederholen Sie die Zustellung. Eine HTTP-Anfrage allein erzeugt keinen geschützten Annahmenachweis. [Ursache und Prüfung](guides#guide=gitops-delivery&section=hook-server-owned-accepted-event-receipt)
