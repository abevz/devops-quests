title: Webhook repozytorium
brief: |-
  Opublikowane wydanie board nie dociera do odbiorców. Przywróć dostarczanie przez istniejący odbiornik zdarzeń repozytorium.

  Pracuj na workstation w `~/quest` z plikami `platform.env`, `webhook.env`, `hook-id`, `hook-repair.json`, `release-commit`, `application.yaml`, `repository/`.

  O ile nie wskazano inaczej, zasoby Kubernetes znajdują się w przestrzeni nazw zatoki (`DQ_NAMESPACE`); ścieżki w `~/quest` są na workstation.

  **Requirements:**

  - Istniejący hook push repozytorium jest aktywny dla `main` i wskazuje właściwy prywatny odbiornik zdarzeń.
  - Opublikowane `origin/main` odpowiada plikowi `~/quest/release-commit` na workstation i jest nowym potomkiem istniejącej historii repozytorium.
  - Application `board` zachowuje dostarczone prywatne źródło Git, gałąź wydania i istniejący katalog obciążenia.
  - Application `board` zgłasza `Synced` i `Healthy` dla commita w `~/quest/release-commit` na workstation.
  - Deployment `board` kończy rollout w przestrzeni nazw zatoki.
  - Wewnątrz Poda Deployment `board` adres `http://board:8080` zwraca `north-75`.
  - Prywatny odbiornik przyjął uwierzytelnione zdarzenie `main` z dostarczonego repozytorium.

  Przyjęte zdarzenie i bieżące wydanie nie dowodzą, że każde przyszłe dostarczenie webhooka zakończy się sukcesem.
debrief: Skonfigurowany hook i zaakceptowany podpisany main event zostały zweryfikowane, podczas gdy okresowe
  odpytywanie Git było wyłączone.
stages.0.brief: Zachowaj pierwotny hook repozytorium i istniejącą historię Git.
hints.0.text: Odświeżanie wyzwalane przez element webhook i automatyczne okresowe odpytywanie to różne
  mechanizmy.
hints.1.text: |-
  Sprawdź konfigurację istniejącego hooka i dane odbiornika; pomiń wspólny sekret w wyjściu.

  ```bash
  source platform.env
  source webhook.env
  api="${GIT_URL%/rail/station.git}/api/v1/repos/rail/station"
  curl -fsS --config <(printf 'user = "%s:%s"\n' "$GIT_USER" "$GIT_PASSWORD") "$api/hooks/$(cat hook-id)" | jq '{active,branch_filter,url:.config.url}'
  ```
hints.2.text: |-
  PATCH zamrożony hook ID do dostarczonego receiver, następnie POST jego punkt końcowy /tests i obserwuj nowy revision. Użyj istniejącego typu zawartości Gogs hook, JSON i udostępnionej gry secret; sprawdź swój URL bez drukowania secret.

  Sprawdź z `~/quest` na workstation:

  - `source platform.env`
  - `git -C repository ls-remote origin refs/heads/main`
  - `cat release-commit`

  Hash zdalnego `main` odpowiada `release-commit`.

  - `kubectl get application board -o json | jq '{sync:.status.sync.status, health:.status.health.status, revision:.status.sync.revision,repo:.spec.source.repoURL,path:.spec.source.path,branch:.spec.source.targetRevision}'`
  - `jq '{repo,branch,authenticated}' /run/dq/observations/webhook.json`

  `Synced`, `Healthy` i rewizja z `release-commit`. Obserwacja wskazuje dostarczone repozytorium, `branch: "main"` i `authenticated: true`. Źródłem jest dostarczone prywatne repozytorium, `manifests`, `main`.

  - `kubectl rollout status deployment/board --timeout=3s`
  - `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080`

  Rollout kończy się; `north-75`.
phrases.0: Oddzieliłem dostawę webhook od rozliczenia okresowego.
phrases.1: Sprawdziłem kompatybilność odbiornika URL i protokołu współdzielonego secret.
phrases.2: Zaobserwowałem zachowanie nowego commit i prawdziwego HTTP po ponownej dostawie.
questions.0.points.0: Zmiana source nadal wymaga refresh trigger.
questions.0.points.1: Sprawdź dostarczanie zdarzeń, ścieżkę receiver i zgodność podpisu.
questions.0.points.2: Obserwuj faktycznie uzgodnione commit, a nie tylko żądanie sender.
questions.0.prompt: Dlaczego poprawny Git commit może pozostać niestosowany, gdy odpytywanie jest wyłączone?
questions.1.points.0: Dowodzi posiadania wspólnego sekretu i wykrywa modyfikację payload.
questions.1.points.1: Obie strony potrzebują tego samego secret i obsługiwanego formatu.
questions.1.points.2: Nie przyznaje aplikacji szerszych uprawnień do klastra.
questions.1.prompt: Co chroni podpisanie webhook?
