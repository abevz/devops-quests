guides.reference_1: Dokumentacja API i diagnostyki
guides.reference_2: Dokumentacja weryfikacji publikacji i konsumentów
diagnostics.webhook_hook: Dostarczony hook wskazuje nieaktualny URL odbiorcy; porównaj istniejący hook z zamrożonym adresem, zdarzeniem push JSON i gałęzią main. Błędy API lub środowiska też zatrzymują kontrolę. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=hook-existing-receiver-configuration)
diagnostics.webhook_revision: Setup już opublikował docelowego potomka; błąd fetch, niezgodny release-commit lub utrata przodka narusza kontrolę. Porównaj istniejące zapisy z origin/main przed nowym commitem. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=hook-already-published-descendant-revision)
diagnostics.webhook_source: Application może wybierać inne repozytorium, gałąź lub katalog; zachowaj dostarczone prywatne źródło Git i znormalizowaną ścieżkę manifests. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=hook-application-private-source)
diagnostics.webhook_health: Docelowa rewizja mogła jeszcze nie zostać uzgodniona lub Application jest niesprawny; porównaj sync status i revision z release-commit po naprawie dostarczania zdarzeń. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=hook-application-reconciled-target)
diagnostics.webhook_rollout: Bieżące Pod mogą nie być gotowe przy przyjęciu danych lub po rollout; sprawdź events i rollout status, zachowując pierwotny Deployment i specyfikację pod template. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=hook-current-rollout-readiness)
diagnostics.probe_0_5: Dostarczony serwer kopiuje notice ConfigMap tylko przy starcie; uzgodnione dane mogą pozostawić stary HTTP do nowych Pod przez rollout pierwotnego Deployment. Zastąpione tożsamości, zmienione źródło/template, niegotowy Pod, błędny HTTP lub błędy obserwacji też zawodzą. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=hook-configmap-adoption-in-current-pod)
diagnostics.webhook_acceptance: Odbiorca mógł nie przyjąć push przez błędny URL, secret lub filtr zdarzeń hook; sprawdź przyjęcie przez serwer i ponów dostarczanie. Samo żądanie HTTP nie tworzy chronionego potwierdzenia. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=hook-server-owned-accepted-event-receipt)
