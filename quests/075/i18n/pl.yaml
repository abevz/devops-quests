title: Webhook repozytorium
brief: 'Prywatna wersja Git czeka, ponieważ jej repository webhook korzysta z wycofanego URL. Okresowe
  odpytywanie Argo Git jest wyłączone w tej kieszeni; początkowa synchronizacja zadziałała, następnie
  Gitea wypchnął zatwierdzenie nowszej board. Napraw istniejący push hook przy użyciu webhook.env i zamrożony
  target w /run/dq/facts/0/webhook-target.json. Gitea wysyła swój podpisany format zgodny z Gogs, ponieważ
  przypięta wersja Argo obsługuje ten parser. Test Gitea hook endpoint zapewnia normalną ścieżkę ponownego
  dostarczenia. Przywróć zapisaną konfigurację hook i dostarcz podpisany main event; sama instrukcja Argo
  refresh jest niewystarczająca. Odbiornikiem jest prywatny NodePort na posiadanym kind bridge, bez publikacji
  VM ani portu hosta.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `platform.env`, `webhook.env`,
  `webhook-target.json`, `hook-id`, `hook-create.json`, `hook-repair.json`, `initial-commit`, `release-commit`,
  `application.json`, `repository/manifests/board.json`, `repository/manifests/service.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: Oryginał podpisany push hook wskazuje na zamrożony odbiornik URL, a nowszy
  main revision staje się Synced/Healthy z HTTP north-75.


  Obserwacja backend pod `/run/dq/observations/webhook.json` musi potwierdzać zaakceptowane uwierzytelnione
  main event; instrukcja Argo refresh go nie tworzy.'
debrief: Skonfigurowany hook i zaakceptowany podpisany main event zostały zweryfikowane, podczas gdy okresowe
  odpytywanie Git było wyłączone.
stages.0.brief: 'Kryteria sukcesu: Oryginał podpisany push hook wskazuje na zamrożony odbiornik URL, a
  nowszy main revision staje się Synced/Healthy z HTTP north-75.'
stages.0.objectives.0.text: Oryginał podpisany push hook wskazuje na jego zamrożony odbiornik URL, a nowszy
  main revision staje się Synced/Healthy z HTTP north-75.
hints.0.text: Odświeżanie wyzwalane przez element webhook i automatyczne okresowe odpytywanie to różne
  mechanizmy.
hints.1.text: Użyj istniejącego typu zawartości Gogs hook, JSON i udostępnionej gry secret; sprawdź swój
  URL bez drukowania secret.
hints.2.text: PATCH zamrożony hook ID do dostarczonego receiver, następnie POST jego punkt końcowy /tests
  i obserwuj nowy revision.
phrases.0: Oddzieliłem dostawę webhook od rozliczenia okresowego.
phrases.1: Sprawdziłem kompatybilność odbiornika URL i protokołu współdzielonego secret.
phrases.2: Zaobserwowałem zachowanie nowego commit i prawdziwego HTTP po ponownej dostawie.
questions.0.points.0: Zmiana source nadal wymaga refresh trigger.
questions.0.points.1: Sprawdź dostarczanie zdarzeń, ścieżkę receiver i zgodność podpisu.
questions.0.points.2: Obserwuj faktycznie uzgodnione commit, a nie tylko żądanie sender.
questions.0.prompt: Dlaczego poprawny Git commit może pozostać niestosowany, gdy odpytywanie jest wyłączone?
questions.1.points.0: Dowodzi posiadania wspólnego sekretu i wykrywa modyfikację payload.
questions.1.points.1: Obie strony potrzebują tego samego secret i obsługiwanego formatu.
questions.1.points.2: Nie przyznaje aplikacji szerszych uprawnień do klastra.
questions.1.prompt: Co chroni podpisanie webhook?
