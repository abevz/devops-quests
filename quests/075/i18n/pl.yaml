title: Webhook repozytorium
brief: 'Opublikowane wydanie nie dotarło do aplikacji przez istniejący odbiornik zdarzeń. Odzyskaj łańcuch dostarczania,
  zachowując pierwotne aplikację, obciążenie, publikację i program.


  Pracuj w `~/quest`. Zapisy źródła określają pierwotną tożsamość i chronioną publikację; zamrożone kopie w `/run/dq/facts/0/`
  pozostają autorytatywne. Zachowaj tożsamości, programy, granice dostępu i zaufanie TLS. Nie wypisuj danych uwierzytelniających;
  nie zastępuj chronionego źródła.


  Wejścia: `platform.env`, `webhook.env`, `hook-id`, `release-commit`, `repository/`, `application.yaml` i `webhook-publication.json`.
  Wszystkie aktywne należące do obciążenia pody muszą przyjąć zatwierdzoną publikację Git, zachowując ConfigMap,
  kontroler, źródło tylko do odczytu i specyfikację poda. Bieżące przyjęcie nie gwarantuje przyszłych dostaw.


  **Wymagania:**


  - Istniejący hook push repozytorium jest aktywny dla `main` i wskazuje właściwy prywatny odbiornik zdarzeń.

  - Opublikowane `origin/main` odpowiada plikowi `~/quest/release-commit` na workstation i jest nowym potomkiem
  istniejącej historii repozytorium.

  - Application `board` zachowuje dostarczone prywatne źródło Git, gałąź wydania i istniejący katalog obciążenia.

  - Application `board` zgłasza `Synced` i `Healthy` dla commita w `~/quest/release-commit` na workstation.

  - Deployment `board` kończy rollout w przestrzeni nazw zatoki.

  - Pierwotne obciążenie i aktywny należący do niego pod zachowują tożsamość, program i źródło tylko do odczytu;
  uzgodniony ConfigMap i odpowiedź HTTP odpowiadają zatwierdzonej publikacji Git.

  - Prywatny odbiornik przyjął uwierzytelnione zdarzenie `main` z dostarczonego repozytorium.'
debrief: Zachowano pierwotne tożsamości źródeł i konsumentów; zatwierdzone wydanie sprawdzono na każdej dotkniętej
  granicy.
stages.0.brief: Opublikowane wydanie nie dotarło do aplikacji przez istniejący odbiornik zdarzeń. Odzyskaj łańcuch
  dostarczania, zachowując pierwotne aplikację, obciążenie, publikację i program.
hints.0.text: Przyjęte zdarzenie, uzgodnione zasoby i dane przyjęte przez aplikację to odrębne granice.
hints.1.text: 'Porównaj istniejący hook, adres odbiornika, publikację Git, status kontrolera i program startowy.
  Sprawdzaj metadane bez ujawniania wspólnych sekretów.


  ```bash

  source platform.env

  api="${GIT_URL%/rail/station.git}/api/v1/repos/rail/station"

  curl -fsS --max-time 3 --config <(printf ''user = "%s:%s"\n'' "$GIT_USER" "$GIT_PASSWORD") "$api/hooks/$(cat hook-id)"
  | jq ''{active,branch_filter,url:.config.url}''

  cat webhook-target.json

  kubectl get application board -o json | jq ''{sync:.status.sync.status,health:.status.health.status,revision:.status.sync.revision}''

  cat repository/manifests/publication.yaml repository/manifests/board.yaml

  name=$(jq -er ''.approved.metadata.name'' webhook-publication.json)

  kubectl get configmap "$name" -o yaml

  ```'
hints.2.text: "PATCH zamrożony hook ID do dostarczonego receiver, następnie POST jego punkt końcowy /tests i obserwuj\
  \ nowy revision. Użyj istniejącego typu zawartości Gogs hook, JSON i udostępnionej gry secret; sprawdź swój URL\
  \ bez drukowania secret.\n\nSprawdź z `~/quest` na workstation:\n\n- `source platform.env`\n- `git -C repository\
  \ ls-remote origin refs/heads/main`\n- `cat release-commit`\n\nHash zdalnego `main` odpowiada `release-commit`.\n\
  \n- `kubectl get application board -o json | jq '{sync:.status.sync.status, health:.status.health.status, revision:.status.sync.revision,repo:.spec.source.repoURL,path:.spec.source.path,branch:.spec.source.targetRevision}'`\n\
  - `jq '{repo,branch,authenticated}' /run/dq/observations/webhook.json`\n\n`Synced`, `Healthy` i rewizja z `release-commit`.\
  \ Obserwacja wskazuje dostarczone repozytorium, `branch: \"main\"` i `authenticated: true`. Źródłem jest dostarczone\
  \ prywatne repozytorium, `manifests`, `main`.\n\n- `kubectl rollout status deployment/board --timeout=3s`\n- `kubectl\
  \ exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080`\n\nRollout kończy się; `north-75`.\n\n\
  Po naprawie hook i potwierdzeniu uwierzytelnionej dostawy doprowadź do przyjęcia publikacji. Program startowy\
  \ kopiuje projekcję do katalogu serwowania; aktualizacja ConfigMap nie nadpisuje tej pamięci. Rolling restart\
  \ pierwotnego Deployment jest jednym z rozwiązań; zachowaj kontroler, program i źródło tylko do odczytu.\n\n```bash\n\
  set -euo pipefail\ncd ~/quest\nsource platform.env\npython3 -I - <<'VERIFY_RELEASE'\n\nimport json,subprocess,yaml\n\
  from pathlib import Path\nfrom dq_check import current_pods,pod_worker,ready_image,workload_worker\ndef k(*args):\n\
  \ return json.loads(subprocess.check_output(['kubectl',*args,'-o','json'],timeout=2))\ncontract=json.loads(Path('/run/dq/facts/0/webhook-publication.json').read_text())\n\
  old=contract['deployment']\ndeployment=k('get','deployment','board')\nassert deployment['metadata']['uid']==old['metadata']['uid']\n\
  assert deployment['spec']['selector']==old['spec']['selector']\nassert deployment['spec']['replicas']==old['spec']['replicas']==1\n\
  assert deployment['spec']['template']['spec']==old['spec']['template']['spec']\napp=k('get','application','board')\n\
  assert app['metadata']['uid']==contract['application']['metadata']['uid']\nassert app['spec']==contract['application']['spec']\n\
  revision=app['status']['sync']['revision']\nsubprocess.run(['git','-C','repository','merge-base','--is-ancestor',contract['release_commit'],revision],check=True,timeout=2)\n\
  desired=yaml.safe_load(subprocess.check_output(['git','-C','repository','show',revision+':'+contract['source_file']],text=True,timeout=2))\n\
  assert desired['kind']=='ConfigMap' and desired['metadata']['name']==contract['approved']['metadata']['name']\n\
  assert desired['data']==contract['approved']['data']\nconfig=k('get','configmap',desired['metadata']['name'])\n\
  assert config['metadata']['uid']==contract['publication_uid']\nassert config['data']==desired['data']\nworker=workload_worker(deployment)\n\
  pods=current_pods(deployment,k('get','replicasets'),k('get','pods'))\nassert len(pods)==1\nfor pod in pods:\n\
  \ assert ready_image(pod,worker['image'])\n current=pod_worker(pod)\n for key in ('command','args'):\n  assert\
  \ current.get(key)==worker.get(key)\n for mount in worker.get('volumeMounts',[]):\n  assert mount.get('readOnly')\
  \ is True and mount in current.get('volumeMounts',[])\n value=subprocess.check_output(['kubectl','exec',pod['metadata']['name'],'-c','worker','--','wget','-qO-','-T','2','http://127.0.0.1:8080'],timeout=3)\n\
  \ assert value.decode().rstrip('\\n')==desired['data']['notice'].rstrip('\\n')\n\nprint('OK')\nVERIFY_RELEASE\n\
  ```\n\nOczekiwane: OK. Dane uwierzytelniające nie są wypisywane."
phrases.0: Oddzieliłem dostawę webhook od rozliczenia okresowego.
phrases.1: Sprawdziłem kompatybilność odbiornika URL i protokołu współdzielonego secret.
phrases.2: Zaobserwowałem zachowanie nowego commit i prawdziwego HTTP po ponownej dostawie.
questions.0.points.0: Zmiana source nadal wymaga refresh trigger.
questions.0.points.1: Sprawdź dostarczanie zdarzeń, ścieżkę receiver i zgodność podpisu.
questions.0.points.2: Obserwuj faktycznie uzgodnione commit, a nie tylko żądanie sender.
questions.0.prompt: Dlaczego poprawny Git commit może pozostać niestosowany, gdy odpytywanie jest wyłączone?
questions.1.points.0: Dowodzi posiadania wspólnego sekretu i wykrywa modyfikację payload.
questions.1.points.1: Obie strony potrzebują tego samego secret i obsługiwanego formatu.
questions.1.points.2: Nie przyznaje aplikacji szerszych uprawnień do klastra.
questions.1.prompt: Co chroni podpisanie webhook?
