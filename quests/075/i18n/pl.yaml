title: Webhook repozytorium
brief: 'Opublikowane wydanie nie dotarło do aplikacji przez istniejący odbiornik zdarzeń. Odzyskaj łańcuch dostarczania,
  zachowując pierwotne aplikację, obciążenie, publikację i program.


  Pracuj w `~/quest`. Zapisy źródła określają pierwotną tożsamość i chronioną publikację; zamrożone kopie w `/run/dq/facts/0/`
  pozostają autorytatywne. Zachowaj tożsamości, programy, granice dostępu i zaufanie TLS. Nie wypisuj danych uwierzytelniających;
  nie zastępuj chronionego źródła.


  Wejścia: `platform.env`, `webhook.env`, `hook-id`, `release-commit`, `repository/`, `application.yaml` i `webhook-publication.json`.
  Wszystkie aktywne należące do obciążenia pody muszą przyjąć zatwierdzoną publikację Git, zachowując ConfigMap,
  kontroler, źródło tylko do odczytu i specyfikację poda. Bieżące przyjęcie nie gwarantuje przyszłych dostaw.


  **Wymagania:**


  - Istniejący hook push repozytorium jest aktywny dla `main` i wskazuje właściwy prywatny odbiornik zdarzeń.

  - Opublikowane `origin/main` odpowiada plikowi `~/quest/release-commit` na workstation i jest nowym potomkiem
  istniejącej historii repozytorium.

  - Application `board` zachowuje dostarczone prywatne źródło Git, gałąź wydania i istniejący katalog obciążenia.

  - Application `board` zgłasza `Synced` i `Healthy` dla commita w `~/quest/release-commit` na workstation.

  - Deployment `board` kończy rollout w przestrzeni nazw zatoki.

  - Pierwotne obciążenie i aktywny należący do niego pod zachowują tożsamość, program i źródło tylko do odczytu;
  uzgodniony ConfigMap i odpowiedź HTTP odpowiadają zatwierdzonej publikacji Git.

  - Prywatny odbiornik przyjął uwierzytelnione zdarzenie `main` z dostarczonego repozytorium.'
debrief: Zachowano pierwotne tożsamości źródeł i konsumentów; zatwierdzone wydanie sprawdzono na każdej dotkniętej
  granicy.
stages.0.brief: Opublikowane wydanie nie dotarło do aplikacji przez istniejący odbiornik zdarzeń. Odzyskaj łańcuch
  dostarczania, zachowując pierwotne aplikację, obciążenie, publikację i program.
hints.0.text: Przyjęte zdarzenie, uzgodnione zasoby i dane przyjęte przez aplikację to odrębne granice.
hints.1.text: |-
  Porównaj istniejący hook, adres odbiornika, publikację Git, status kontrolera i program startowy. Sprawdzaj metadane bez ujawniania wspólnych sekretów.

  Sprawdź aktywność hooka, filtr gałęzi i URL odbiornika. Porównaj zapis próby dostarczenia z opublikowaną rewizją Git i rewizją obserwowaną przez Application.

  ```bash
  source platform.env
  api="${GIT_URL%/rail/station.git}/api/v1/repos/rail/station"
  curl -fsS --max-time 3 --config <(printf 'user = "%s:%s"\n' "$GIT_USER" "$GIT_PASSWORD") "$api/hooks/$(cat hook-id)" | jq '{active,branch_filter,url:.config.url}'
  cat webhook-target.json
  kubectl get application board -o json | jq '{sync:.status.sync.status,health:.status.health.status,revision:.status.sync.revision}'
  cat repository/manifests/publication.yaml repository/manifests/board.yaml
  name=$(jq -er '.approved.metadata.name' webhook-publication.json)
  kubectl get configmap "$name" -o yaml
  ```
hints.2.text: |-
  Sprawdź z `~/quest` na workstation:

  - `source platform.env`
  - `git -C repository ls-remote origin refs/heads/main`
  - `cat release-commit`

  Hash zdalnego `main` odpowiada `release-commit`.

  - `kubectl get application board -o json | jq '{sync:.status.sync.status, health:.status.health.status, revision:.status.sync.revision,repo:.spec.source.repoURL,path:.spec.source.path,branch:.spec.source.targetRevision}'`
  - `jq '{repo,branch,authenticated}' /run/dq/observations/webhook.json`

  `Synced`, `Healthy` i rewizja z `release-commit`. Obserwacja wskazuje dostarczone repozytorium, `branch: "main"` i `authenticated: true`. Źródłem jest dostarczone prywatne repozytorium, `manifests`, `main`.

  - `kubectl rollout status deployment/board --timeout=3s`
  - `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080`

  Rollout kończy się; `north-75`.

  Po naprawie hook i potwierdzeniu uwierzytelnionej dostawy doprowadź do przyjęcia publikacji. Program startowy kopiuje projekcję do katalogu serwowania; aktualizacja ConfigMap nie nadpisuje tej pamięci. Rolling restart pierwotnego Deployment jest jednym z rozwiązań; zachowaj kontroler, program i źródło tylko do odczytu.

  ```bash
  set -euo pipefail
  cd ~/quest
  source platform.env
  python3 -I - <<'VERIFY_RELEASE'

  import json,subprocess,yaml
  from pathlib import Path
  from dq_check import current_pods,pod_worker,ready_image,workload_worker
  def k(*args):
   return json.loads(subprocess.check_output(['kubectl',*args,'-o','json'],timeout=2))
  contract=json.loads(Path('/run/dq/facts/0/webhook-publication.json').read_text())
  old=contract['deployment']
  deployment=k('get','deployment','board')
  assert deployment['metadata']['uid']==old['metadata']['uid']
  assert deployment['spec']['selector']==old['spec']['selector']
  assert deployment['spec']['replicas']==old['spec']['replicas']==1
  assert deployment['spec']['template']['spec']==old['spec']['template']['spec']
  app=k('get','application','board')
  assert app['metadata']['uid']==contract['application']['metadata']['uid']
  assert app['spec']==contract['application']['spec']
  revision=app['status']['sync']['revision']
  subprocess.run(['git','-C','repository','merge-base','--is-ancestor',contract['release_commit'],revision],check=True,timeout=2)
  desired=yaml.safe_load(subprocess.check_output(['git','-C','repository','show',revision+':'+contract['source_file']],text=True,timeout=2))
  assert desired['kind']=='ConfigMap' and desired['metadata']['name']==contract['approved']['metadata']['name']
  assert desired['data']==contract['approved']['data']
  config=k('get','configmap',desired['metadata']['name'])
  assert config['metadata']['uid']==contract['publication_uid']
  assert config['data']==desired['data']
  worker=workload_worker(deployment)
  pods=current_pods(deployment,k('get','replicasets'),k('get','pods'))
  assert len(pods)==1
  for pod in pods:
   assert ready_image(pod,worker['image'])
   current=pod_worker(pod)
   for key in ('command','args'):
    assert current.get(key)==worker.get(key)
   for mount in worker.get('volumeMounts',[]):
    assert mount.get('readOnly') is True and mount in current.get('volumeMounts',[])
   value=subprocess.check_output(['kubectl','exec',pod['metadata']['name'],'-c','worker','--','wget','-qO-','-T','2','http://127.0.0.1:8080'],timeout=3)
   assert value.decode().rstrip('\n')==desired['data']['notice'].rstrip('\n')

  print('OK')
  VERIFY_RELEASE
  ```

  Oczekiwane: OK. Dane uwierzytelniające nie są wypisywane.
phrases.0: Oddzieliłem dostawę webhook od rozliczenia okresowego.
phrases.1: Sprawdziłem kompatybilność odbiornika URL i protokołu współdzielonego secret.
phrases.2: Zaobserwowałem zachowanie nowego commit i prawdziwego HTTP po ponownej dostawie.
questions.0.points.0: Zmiana source nadal wymaga refresh trigger.
questions.0.points.1: Sprawdź dostarczanie zdarzeń, ścieżkę receiver i zgodność podpisu.
questions.0.points.2: Obserwuj faktycznie uzgodnione commit, a nie tylko żądanie sender.
questions.0.prompt: Dlaczego poprawny Git commit może pozostać niestosowany, gdy odpytywanie jest wyłączone?
questions.1.points.0: Dowodzi posiadania wspólnego sekretu i wykrywa modyfikację payload.
questions.1.points.1: Obie strony potrzebują tego samego secret i obsługiwanego formatu.
questions.1.points.2: Nie przyznaje aplikacji szerszych uprawnień do klastra.
questions.1.prompt: Co chroni podpisanie webhook?
