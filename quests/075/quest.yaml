id: 75
title: title
track: Platform
difficulty: complex
brief: brief
stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    check: |-
      source platform.env
      source webhook.env
      GITEA_API="${GIT_URL%/rail/station.git}/api/v1/repos/rail/station"
      hook=$(cat /run/dq/facts/0/hook-id)
      curl -fsS -u "$GIT_USER:$GIT_PASSWORD" "$GITEA_API/hooks/$hook" | jq -e --arg url "$(jq -er .url /run/dq/facts/0/webhook-target.json)" '.active==true and .type=="gogs" and .config.url==$url and .config.content_type=="json" and .events==["push"] and .branch_filter=="main"' >/dev/null
  - text: stages.0.objectives.1.text
    check: |-
      source platform.env
      git -C repository fetch origin main >/dev/null 2>&1
      test "$(git -C repository rev-parse origin/main)" = "$(cat release-commit)"
      test "$(cat release-commit)" != "$(cat /run/dq/facts/0/initial-commit)"
      git -C repository merge-base --is-ancestor "$(cat /run/dq/facts/0/initial-commit)" origin/main
  - text: stages.0.objectives.2.text
    check: |-
      source platform.env
      kubectl get application board -o json | jq -e --arg url "$GIT_URL" '.spec.source.repoURL==$url and .spec.source.path=="manifests" and .spec.source.targetRevision=="main"' >/dev/null
  - text: stages.0.objectives.3.text
    check: |-
      source platform.env
      kubectl get application board -o json | jq -e --arg rev "$(cat release-commit)" --arg url "$GIT_URL" '.status.sync.status=="Synced" and .status.health.status=="Healthy" and .status.sync.revision==$rev' >/dev/null
  - text: stages.0.objectives.4.text
    check: kubectl rollout status deployment/board --timeout=3s >/dev/null
  - text: stages.0.objectives.5.text
    check: test "$(timeout 4s kubectl exec --pod-running-timeout=2s deployment/board -- wget -qO- -T 3
      http://board:8080)" = north-75
  - text: stages.0.objectives.6.text
    check: |-
      source platform.env
      jq -e --arg repo "${GIT_URL%.git}" '.repo==$repo and .branch=="main" and .authenticated==true' /run/dq/observations/webhook.json >/dev/null
hints:
