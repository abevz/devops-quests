title: Simulación de incidente de entrevista
brief: |-
  El board de la estación no cumple sus requisitos de escalado y entrada privada. Recupera el resultado observable del servicio en ambas etapas del incidente.

  Trabaja en `~/quest` en la estación de trabajo. Entradas por etapa:
  - Etapa 1: `board.yaml`, `service.yaml`, `client.yaml`, `hpa.yaml`.
  - Etapa 2: `gateway.yaml`, `route.yaml`, `ingress-policy.yaml`, `gateway-target.json`.

  **Requisitos:**

  - Etapa 1:
    - El Deployment `board` tiene `2` réplicas listas sin aumentar el límite de CPU suministrado.
    - El HPA `board` conserva la política de escalado suministrada e informa `2` réplicas actuales y deseadas bajo presión del recurso por encima de su objetivo configurado.
  - Etapa 2:
    - El Deployment `board` tiene `2` réplicas listas sin aumentar el límite de CPU suministrado.
    - El HPA `board` conserva la política de escalado suministrada e informa `2` réplicas actuales y deseadas bajo presión del recurso por encima de su objetivo configurado.
    - El Gateway `station` usa la clase privada suministrada e informa `Accepted=True`.
    - El HTTPRoute `board` informa `ResolvedRefs=True` para un padre.
    - La política de ingress de la aplicación permite TCP `8080` solo desde el controlador Gateway privado suministrado.
    - Desde el Deployment `client`, la URL Gateway suministrada devuelve `north-130` para Host `north.station.internal`; fallan las solicitudes directas a `http://board:8080` y con Host `closed.station.internal`.

  Las comprobaciones observan la configuración declarada de escalado y la utilización actual de CPU, no la causa de escalados anteriores; los fallos de tráfico pueden tener otras causas y las condiciones de estado pueden estar obsoletas o pertenecer a otro parent.

debrief: El incidente se resolvió con escalamiento real, route status y pruebas de tráfico, preservando al mismo
  tiempo un límite de aislamiento explícito.
stages.0.brief: El board debe cumplir el presupuesto de escalado suministrado bajo carga observada.
stages.1.brief: Mantén el escalado dentro del presupuesto al recuperar la entrada privada aislada.
hints.0.text: La presión de recursos, la decisión de escalado y las réplicas listas son observaciones distintas.
  Un controlador necesita mediciones que pueda interpretar.
hints.1.text: 'Etapa 2: inspect route.yaml y ingress-policy.yaml: HTTPRoute apunta al puerto backend incorrecto
  en lugar del puerto 8080 de Service, y NetworkPolicy utiliza una etiqueta de módulo de origen obsoleta.


  Inspecciona las definiciones suministradas, descripciones de recursos y eventos de la etapa correspondiente.


  ```sh

  kubectl describe deployment board

  kubectl describe hpa board

  kubectl describe gateway station

  kubectl describe httproute board

  ```


  Etapa 1/2: Inspecciona estas definiciones de recursos para esta etapa.


  ```sh

  kubectl get deployment board -o yaml

  kubectl get hpa board -o yaml

  ```


  Etapa 2: Inspecciona estas definiciones de recursos para esta etapa.


  ```sh

  cat gateway-target.json

  kubectl get gateway station -o yaml

  kubectl get httproute board -o yaml

  kubectl get networkpolicy board-ingress -o yaml

  ```'
hints.2.text: |-
  Etapa 1: el porcentaje de utilización de HPA requiere un CPU request distinto de cero en el contenedor; inspect board.yaml y conjunto CPU request 100m y limit 200m sin cambiar el Especificaciones HPA.

  Configure el puerto backend HTTPRoute en 8080, permita ingress a board:8080 solo desde podSelector app: gateway en el controlador namespace y verifique tanto el tráfico Gateway permitido como el acceso directo bloqueado.

  Verifica la etapa reparada y compara el resultado observado.

  Etapa 1/2: El Deployment muestra `2` réplicas listas; el HPA informa `2` réplicas y utilización actual del recurso superior a su objetivo configurado.

  ```sh
  kubectl get deployment board
  kubectl get hpa board
  ```

  Etapa 2: El Host Gateway previsto devuelve `north-130`; fallan las peticiones directas y con Host ajeno.

  ```sh
  url=$(jq -r .url gateway-target.json)
  kubectl exec deployment/client -c worker -- wget -qO- -T 3 --header='Host: north.station.internal' "$url"
  for target in direct unrelated; do
    if [ "$target" = direct ]; then
      if kubectl exec deployment/client -c worker -- wget -qO- -T 2 http://board:8080 >/dev/null 2>&1; then exit 1; fi
    else
      if kubectl exec deployment/client -c worker -- wget -qO- -T 2 --header='Host: closed.station.internal' "$url" >/dev/null 2>&1; then exit 1; fi
    fi
    printf '%s rejected\n' "$target"
  done
  ```

  Observaciones esperadas para la etapa completa:
  - Etapa 1/2: El presupuesto de CPU, las réplicas listas, el rango HPA, el objetivo y la utilización observada cumplen los requisitos.
  - Etapa 2: La clase suministrada, el Gateway aceptado, la ruta resuelta y la política de ingress acotada cumplen los requisitos.

phrases.0: Aislé métricas, enrutamiento y fallas de policy.
phrases.1: Verifiqué una ampliación real dentro de un presupuesto limitado.
phrases.2: Probé el camino previsto y negué los caminos de circunvalación.
questions.0.points.0: La evidencia independiente evita fijar la capa equivocada.
questions.0.points.1: Los cambios más pequeños hacen que la recuperación y la reversión sean más fáciles de evaluar.
questions.0.prompt: ¿Por qué diagnosticar cada límite antes de cambiarlo todo?
questions.1.points.0: No; Los caminos permitidos y prohibidos necesitan pruebas separadas.
questions.1.points.1: La coincidencia de hosts Network policy y route impone límites diferentes.
questions.1.prompt: ¿Una solicitud Gateway exitosa demuestra que el acceso directo está bloqueado?
diagnostics.request: |-
  El CPU request de worker debe ser positivo y no superar su CPU limit finito.

diagnostics.limit: |-
  El CPU limit de worker debe ser positivo y como máximo 200m.

diagnostics.ready: Board debe tener dos réplicas listas.
diagnostics.minimum: HPA minReplicas debe ser 1.
diagnostics.maximum: HPA maxReplicas debe ser 2.
diagnostics.target: |-
  El HPA debe escalar Deployment board y conservar el objetivo de utilización de CPU de 50.
diagnostics.current: HPA currentReplicas debe ser 2.
diagnostics.desired: HPA desiredReplicas debe ser 2.
diagnostics.metric: |-
  La utilización actual de CPU debe superar el objetivo suministrado del HPA.

diagnostics.gateway_class: La clase Gateway debe coincidir con gateway-target.json.
diagnostics.gateway_accepted: Gateway Accepted debe ser True.
diagnostics.backend: |-
  La ruta debe referenciar un puerto declarado del Service board suministrado.

diagnostics.resolved: Algún parent de HTTPRoute debe tener ResolvedRefs=True.
diagnostics.policy: |-
  El ingress de la aplicación permite TCP 8080 solo desde el namespace suministrado del Gateway Y sus Pods.

diagnostics.gateway_http: La petición por gateway con Host north.station.internal debe devolver north-130.
diagnostics.direct_denied: La petición directa a board:8080 debe fallar.
diagnostics.wrong_host: La petición por gateway con Host closed.station.internal debe fallar.
