diagnostics.request: El worker de board puede carecer de una solicitud de CPU positiva o superar el límite. Compara las cantidades de CPU del contenedor worker. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q130-storm-board-worker-cpu-request)
diagnostics.limit: El worker de board puede carecer de un límite positivo de CPU o superar 200m. Comprueba el límite efectivo de CPU. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q130-storm-board-worker-cpu-limit)
diagnostics.target: El HPA puede apuntar a otra carga o usar otra métrica de CPU. Comprueba la referencia al Deployment board de apps/v1 y el único objetivo CPU Resource de tipo Utilization al 50 por ciento. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q130-storm-hpa-cpu-target)
diagnostics.metric: El HPA puede no mostrar una muestra actual de utilización CPU Resource por encima del 50 por ciento. Comprueba la métrica actual mientras la carga prevista recibe demanda. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q130-storm-hpa-current-cpu)
diagnostics.gateway_class: Gateway station puede usar otra clase o su registro puede estar inaccesible. Compara gatewayClassName con el gateway-target.json proporcionado. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q130-storm-gateway-class)
diagnostics.gateway_accepted: Gateway station puede no informar aún Accepted=True. Revisa sus condiciones y el motivo que indique el controlador. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q130-storm-gateway-accepted)
diagnostics.backend: La solicitud proporcionada puede no coincidir con la ruta o una regla efectiva puede enviar tráfico con peso positivo a otro backend o puerto. Compara Host north.station.internal y la URL proporcionada con la regla elegida y el puerto del Service board. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q130-storm-effective-http-route)
diagnostics.resolved: El HTTPRoute puede ser ilegible o ninguna entrada de sus padres puede informar ResolvedRefs=True. Revisa las condiciones actuales y comprueba los backends referenciados. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q130-storm-route-reference-status)
diagnostics.policy: La política board-ingress puede seleccionar otros Pods o permitir un origen o puerto más amplio. Comprueba Ingress, ambos selectores en el mismo peer de gateway y solo TCP 8080. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q130-storm-gateway-ingress-policy)
diagnostics.gateway_http: La solicitud con el Host correcto por el Gateway proporcionado puede fallar o devolver otros datos. Repítela desde client y compara el cuerpo con north-130. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q130-storm-live-gateway-response)
diagnostics.direct_denied: Client puede seguir llegando directamente a board:8080. Repite la solicitud directa y revisa las políticas que permiten tráfico de client a board. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q130-storm-live-direct-denial)
diagnostics.wrong_host: Puede faltar la URL proporcionada o el Gateway puede seguir sirviendo closed.station.internal. Comprueba la URL y repite la solicitud con ese Host para confirmar que falla. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q130-storm-live-wrong-host-denial)
diagnostics.minimum: El HPA puede haber perdido su límite inferior. Revise minReplicas y manténgalo en uno. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q130-hpa-minimum-replicas)
diagnostics.maximum: El HPA puede no escalar a dos réplicas o superar el límite previsto. Revise maxReplicas y manténgalo en dos. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q130-hpa-maximum-replicas)
diagnostics.ready: El HPA puede pedir más capacidad mientras un Pod board aún no está listo. Revise eventos y espere dos réplicas listas en el estado del Deployment. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q130-board-ready-replica-count)
diagnostics.current: El controlador puede no ver dos réplicas aún o apuntar a otra carga. Compare la cantidad actual con el Deployment vinculado. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q130-hpa-current-replica-count)
diagnostics.desired: El controlador puede seguir recomendando una réplica por una demanda de CPU baja o no observada. Compara su estado con la métrica de CPU actual. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q130-hpa-desired-replica-count)
diagnostics.probe_0_0: La comprobación de recursos de worker puede haberse detenido antes de indicar una condición. Comprueba la lectura del Deployment board y el comando Python local. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q130-storm-worker-observer-input)
diagnostics.probe_1_0: La comprobación de recursos de worker puede haberse detenido antes de indicar una condición. Comprueba la lectura del Deployment board y el comando Python local. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q130-storm-worker-observer-input)
diagnostics.probe_0_1: La comprobación del HPA puede haberse detenido antes de indicar una condición. Comprueba la lectura del HPA board y el comando Python local. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q130-storm-hpa-observer-input)
diagnostics.probe_1_1: La comprobación del HPA puede haberse detenido antes de indicar una condición. Comprueba la lectura del HPA board y el comando Python local. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q130-storm-hpa-observer-input)
diagnostics.probe_1_3: La comprobación de la ruta puede haberse detenido antes de indicar una condición. Comprueba los datos de la solicitud y la lectura del HTTPRoute y del Service. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q130-storm-route-observer-input)
diagnostics.probe_1_4: La comprobación de la política de entrada puede haberse detenido antes de indicar una condición. Comprueba los datos guardados del Gateway y los objetos actuales NetworkPolicy y Deployment. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q130-storm-policy-observer-input)
