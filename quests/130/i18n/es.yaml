title: Simulación de incidente de entrevista
brief: 'Recupere el servicio station board en dos etapas del incidente. En la etapa uno, el board Deployment
  no logra escalar bajo carga a pesar de que el HPA (objetivo 50% CPU, rango 1 a 2 réplicas) y las métricas
  API están activas; restaurar el escalado real impulsado por la CPU dentro del presupuesto requerido
  del contenedor CPU (request 100m, limit 200m). En la segunda etapa, el tráfico a través del Gateway
  privado (preservar el GatewayClass y el host north.station.internal) no logra llegar al board:8080;
  restaure el enrutamiento y el aislamiento de ingreso para que solo los módulos del controlador Gateway
  (app: gateway en el controlador congelado namespace) puedan alcanzar board en el puerto 8080 mientras
  se mantiene el acceso directo a client y otros hosts. negado. No se necesitan cambios de nodo, DNS global
  o listener público.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `board.json`, `service.json`,
  `client.json`, `hpa.json`, `gateway.json`, `route.json`, `ingress-policy.json`, `gateway-target.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: las métricas reales de CPU impulsan dos réplicas listas bajo el HPA fijo
  y el recurso limits.'
debrief: El incidente se resolvió con escalamiento real, route status y pruebas de tráfico, preservando
  al mismo tiempo un límite de aislamiento explícito.
stages.0.brief: 'Criterios de éxito: las métricas reales de CPU impulsan dos réplicas listas bajo el HPA
  fijo y el recurso limits.'
stages.0.objectives.0.text: Las métricas reales de CPU impulsan dos réplicas listas bajo el HPA fijo y
  el recurso limits.
stages.1.brief: 'Criterios de éxito: El board escalado sirve a north-130 solo a través de su host Gateway
  previsto; El acceso directo a client permanece denegado.'
stages.1.objectives.0.text: El board escalado sirve al north-130 solo a través de su host Gateway previsto;
  El acceso directo a client sigue denegado.
hints.0.text: 'Etapa 1: el porcentaje de utilización de HPA requiere un CPU request distinto de cero en
  el contenedor; inspect board.json y conjunto CPU request 100m y limit 200m sin cambiar el Especificaciones
  HPA.'
hints.1.text: 'Etapa 2: inspect route.json y ingress-policy.json: HTTPRoute apunta al puerto backend incorrecto
  en lugar del puerto 8080 de Service, y NetworkPolicy utiliza una etiqueta de módulo de origen obsoleta.'
hints.2.text: 'Configure el puerto backend HTTPRoute en 8080, permita ingress a board:8080 solo desde
  podSelector app: gateway en el controlador namespace y verifique tanto el tráfico Gateway permitido
  como el acceso directo bloqueado.'
phrases.0: Aislé métricas, enrutamiento y fallas de policy.
phrases.1: Verifiqué una ampliación real dentro de un presupuesto limitado.
phrases.2: Probé el camino previsto y negué los caminos de circunvalación.
questions.0.points.0: La evidencia independiente evita fijar la capa equivocada.
questions.0.points.1: Los cambios más pequeños hacen que la recuperación y la reversión sean más fáciles
  de evaluar.
questions.0.prompt: ¿Por qué diagnosticar cada límite antes de cambiarlo todo?
questions.1.points.0: No; Los caminos permitidos y prohibidos necesitan pruebas separadas.
questions.1.points.1: La coincidencia de hosts Network policy y route impone límites diferentes.
questions.1.prompt: ¿Una solicitud Gateway exitosa demuestra que el acceso directo está bloqueado?
