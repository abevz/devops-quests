diagnostics.request: Worker w board może nie mieć dodatniego żądania CPU lub żądanie może przekraczać limit. Porównaj wartości CPU kontenera worker. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q130-storm-board-worker-cpu-request)
diagnostics.limit: Worker w board może nie mieć dodatniego limitu CPU albo mieć limit powyżej 200m. Sprawdź efektywny limit CPU. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q130-storm-board-worker-cpu-limit)
diagnostics.target: HPA może wskazywać inne obciążenie lub używać innej metryki CPU. Sprawdź odwołanie do Deploymentu board z apps/v1 oraz jeden cel CPU Resource typu Utilization o wartości 50 procent. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q130-storm-hpa-cpu-target)
diagnostics.metric: HPA może nie zgłaszać bieżącej próbki wykorzystania CPU Resource powyżej 50 procent. Sprawdź bieżącą metrykę przy obciążeniu właściwej usługi. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q130-storm-hpa-current-cpu)
diagnostics.gateway_class: Gateway station może używać innej klasy lub jej zapis może być niedostępny. Porównaj gatewayClassName z dostarczonym gateway-target.json. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q130-storm-gateway-class)
diagnostics.gateway_accepted: Gateway station może jeszcze nie zgłaszać Accepted=True. Sprawdź jego warunki oraz przyczynę podaną przez kontroler. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q130-storm-gateway-accepted)
diagnostics.backend: Podane żądanie może nie pasować do trasy albo wybrana reguła może kierować ruch o dodatniej wadze do innego backendu lub portu. Porównaj Host north.station.internal i podany URL z wybraną regułą oraz portem Service board. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q130-storm-effective-http-route)
diagnostics.resolved: HTTPRoute może być nieczytelny lub żaden wpis rodzica nie zgłasza ResolvedRefs=True. Sprawdź bieżące warunki rodziców i wskazane backendy. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q130-storm-route-reference-status)
diagnostics.policy: Polityka board-ingress może wybierać niewłaściwe Pody lub dopuszczać szersze źródło albo port. Sprawdź Ingress, oba selektory w jednym peer dla gateway i wyłącznie TCP 8080. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q130-storm-gateway-ingress-policy)
diagnostics.gateway_http: Żądanie z poprawnym Host przez podany Gateway może się nie powieść lub zwrócić inną treść. Ponów je z client i porównaj odpowiedź z north-130. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q130-storm-live-gateway-response)
diagnostics.direct_denied: Client może nadal docierać bezpośrednio do board:8080. Ponów bezpośrednie żądanie i sprawdź polityki zezwalające na ruch od client do board. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q130-storm-live-direct-denial)
diagnostics.wrong_host: Podanego URL może brakować lub Gateway może nadal obsługiwać closed.station.internal. Sprawdź URL i ponów żądanie z tym Hostem, oczekując niepowodzenia. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q130-storm-live-wrong-host-denial)
diagnostics.minimum: HPA mógł stracić dolną granicę skalowania. Sprawdź minReplicas i zachowaj jedną replikę. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q130-hpa-minimum-replicas)
diagnostics.maximum: HPA może nie osiągać dwóch replik lub przekraczać limit. Sprawdź maxReplicas i zachowaj wartość dwa. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q130-hpa-maximum-replicas)
diagnostics.ready: HPA może żądać większej pojemności, choć pod board nie jest gotowy. Sprawdź zdarzenia i poczekaj na dwie gotowe repliki w stanie Deploymentu. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q130-board-ready-replica-count)
diagnostics.current: Kontroler może nie widzieć dwóch replik lub wskazywać inne obciążenie. Porównaj zgłaszaną liczbę z powiązanym Deploymentem. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q130-hpa-current-replica-count)
diagnostics.desired: Kontroler może nadal zalecać jedną replikę z powodu niskiego odczytu CPU lub braku metryki. Porównaj jego stan z bieżącą metryką CPU. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q130-hpa-desired-replica-count)
diagnostics.probe_0_0: Kontrola zasobów worker mogła się zatrzymać przed zgłoszeniem warunku. Sprawdź odczyt Deploymentu board i dostępność polecenia Python. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q130-storm-worker-observer-input)
diagnostics.probe_1_0: Kontrola zasobów worker mogła się zatrzymać przed zgłoszeniem warunku. Sprawdź odczyt Deploymentu board i dostępność polecenia Python. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q130-storm-worker-observer-input)
diagnostics.probe_0_1: Kontrola HPA mogła się zatrzymać przed zgłoszeniem warunku. Sprawdź odczyt HPA board i dostępność polecenia Python. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q130-storm-hpa-observer-input)
diagnostics.probe_1_1: Kontrola HPA mogła się zatrzymać przed zgłoszeniem warunku. Sprawdź odczyt HPA board i dostępność polecenia Python. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q130-storm-hpa-observer-input)
diagnostics.probe_1_3: Kontrola trasy mogła się zatrzymać przed zgłoszeniem warunku. Sprawdź dostarczone dane żądania i odczyt HTTPRoute oraz Service. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q130-storm-route-observer-input)
diagnostics.probe_1_4: Kontrola polityki ingress mogła się zatrzymać przed zgłoszeniem warunku. Sprawdź zapisane dane Gateway oraz bieżące NetworkPolicy i Deployment. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q130-storm-policy-observer-input)
