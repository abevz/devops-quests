title: Symulacja zdarzenia podczas rozmowy kwalifikacyjnej
brief: 'Odzyskaj usługę station board na dwóch etapach zdarzenia. W pierwszym etapie board Deployment
  nie skaluje się pod obciążeniem, mimo że HPA (docelowe 50% CPU, zakres 1–2 replik) i metryki API są
  aktywne; przywrócić rzeczywiste skalowanie sterowane CPU w ramach wymaganego budżetu kontenera CPU (request
  100m, limit 200m). W drugim etapie ruch przez prywatny Gateway (zachowaj GatewayClass i host north.station.internal)
  nie dociera do board:8080; przywróć routing i izolację wejścia, aby tylko moduły kontrolera Gateway
  (app: gateway w zamrożonym kontrolerze namespace) mogły uzyskać dostęp do board na porcie 8080, podczas
  gdy bezpośredni dostęp client i innych hostów pozostaje zabroniony. Nie są potrzebne żadne zmiany węzłowe,
  globalne DNS ani publiczne listener.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `board.json`, `service.json`,
  `client.json`, `hpa.json`, `gateway.json`, `route.json`, `ingress-policy.json`, `gateway-target.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: Prawdziwe metryki CPU napędzają dwie gotowe repliki w ramach stałego HPA
  i zasobu limits.'
debrief: Incydent został rozwiązany poprzez rzeczywiste skalowanie, trasę status i testy ruchu przy zachowaniu
  wyraźnej granicy izolacji.
stages.0.brief: 'Kryteria sukcesu: Prawdziwe metryki CPU napędzają dwie gotowe repliki w ramach stałego
  HPA i zasobu limits.'
stages.0.objectives.0.text: Prawdziwe metryki CPU napędzają dwie gotowe repliki w ramach stałego HPA i
  zasobu limits.
stages.1.brief: 'Kryteria sukcesu: Skalowana board obsługuje north-130 tylko za pośrednictwem zamierzonego
  hosta Gateway; bezpośredni dostęp client pozostaje zabroniony.'
stages.1.objectives.0.text: Skalowana board obsługuje north-130 tylko poprzez zamierzony host Gateway;
  bezpośredni dostęp client pozostaje zabroniony.
hints.0.text: 'Etap 1: Procentowe wykorzystanie HPA wymaga niezerowego CPU request na kontenerze; sprawdź
  board.json i ustaw CPU request 100m i limit 200m bez zmiany specyfikacji HPA.'
hints.1.text: 'Etap 2: sprawdź route.json i ingress-policy.json — HTTPRoute wskazuje na nieprawidłowy
  port backend port zamiast Service port 8080, a NetworkPolicy używa przestarzałej etykiety źródła.'
hints.2.text: 'Ustaw port zaplecza HTTPRoute na 8080, zezwól ingress na board:8080 tylko z podSelector
  app: gateway w kontrolerze namespace i sprawdź zarówno dozwolony ruch Gateway, jak i zablokowany bezpośredni
  dostęp.'
phrases.0: Wyizolowałem metryki, routing i awarie policy.
phrases.1: Sprawdziłem realne skalowanie w ramach ograniczonego budżetu.
phrases.2: Udowodniłem zamierzoną ścieżkę i odmówiłem ścieżek obejściowych.
questions.0.points.0: Niezależne dowody pozwalają uniknąć naprawienia niewłaściwej warstwy.
questions.0.points.1: Mniejsze zmiany ułatwiają ocenę odzyskiwania i przywracania.
questions.0.prompt: Po co diagnozować każdą granicę przed zmianą wszystkiego?
questions.1.points.0: NIE; dozwolone i zabronione ścieżki wymagają oddzielnych testów.
questions.1.points.1: Dopasowanie Network policy i trasy host wymusza różne granice.
questions.1.prompt: Czy pomyślne żądanie Gateway dowodzi, że bezpośredni dostęp jest zablokowany?
