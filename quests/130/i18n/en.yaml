title: Interview incident simulation
brief: 'Recover a station service with three independent boundaries. Stage one repairs a zero CPU request
  so real metrics drive the fixed HPA from one to two replicas: request 100m, limit 200m, target 50%,
  range 1–2. Stage two introduces a bad HTTPRoute backend port and an obsolete NetworkPolicy source label.
  Restore backend Service port 8080 and allow only app: gateway in the frozen controller namespace to
  board:8080. Preserve the GatewayClass and host north.station.internal. The client must reach the board
  through the private Gateway, while direct board access and a different host remain denied. No node,
  global DNS or public listener changes are needed.


  Quest files in `~/quest` (some appear in later stages): `board.json`, `service.json`, `client.json`,
  `hpa.json`, `gateway.json`, `route.json`, `ingress-policy.json`, `gateway-target.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: Real CPU metrics drive two ready replicas under the fixed HPA and resource
  limits.'
debrief: The incident was resolved with real scaling, route status and traffic tests while preserving
  an explicit isolation boundary.
