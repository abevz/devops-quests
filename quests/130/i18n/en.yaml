diagnostics.request: The board worker may have no positive CPU request or its request may exceed the limit. Compare the CPU quantities on the named worker. [Cause and check](guides#guide=autoscaling-gateway&section=q130-storm-board-worker-cpu-request)
diagnostics.limit: The board worker may have no positive CPU limit or a limit above 200m. Check its effective CPU limit. [Cause and check](guides#guide=autoscaling-gateway&section=q130-storm-board-worker-cpu-limit)
diagnostics.target: The HPA may target another workload or use a different CPU metric. Check the apps/v1 Deployment board reference and the single CPU Resource target of type Utilization at 50 percent. [Cause and check](guides#guide=autoscaling-gateway&section=q130-storm-hpa-cpu-target)
diagnostics.metric: The HPA may not report a current CPU Resource utilization sample above 50 percent. Check the current metric while the intended workload receives demand. [Cause and check](guides#guide=autoscaling-gateway&section=q130-storm-hpa-current-cpu)
diagnostics.gateway_class: Gateway station may use a different class or its class record may be unavailable. Compare gatewayClassName with the supplied gateway-target.json. [Cause and check](guides#guide=autoscaling-gateway&section=q130-storm-gateway-class)
diagnostics.gateway_accepted: Gateway station may not report Accepted=True yet. Inspect its conditions and any reason reported by the controller. [Cause and check](guides#guide=autoscaling-gateway&section=q130-storm-gateway-accepted)
diagnostics.backend: The supplied request may miss the route, or an effective matching rule may send some positive-weight traffic to a different backend or port. Compare Host north.station.internal and the supplied URL with the winning rule and its board Service port. [Cause and check](guides#guide=autoscaling-gateway&section=q130-storm-effective-http-route)
diagnostics.resolved: The HTTPRoute may be unreadable or none of its parent entries may report ResolvedRefs=True. Inspect the current parent conditions and verify referenced backends. [Cause and check](guides#guide=autoscaling-gateway&section=q130-storm-route-reference-status)
diagnostics.policy: The board-ingress policy may select the wrong Pods or admit a broader source or port. Check Ingress, both selectors on the same gateway peer, and only TCP 8080. [Cause and check](guides#guide=autoscaling-gateway&section=q130-storm-gateway-ingress-policy)
diagnostics.gateway_http: The correct Host may fail through the supplied Gateway or reach different content. Repeat the request from client and compare the body with north-130. [Cause and check](guides#guide=autoscaling-gateway&section=q130-storm-live-gateway-response)
diagnostics.direct_denied: The client may still reach board:8080 directly. Repeat the direct request and inspect policies allowing traffic from the client to board. [Cause and check](guides#guide=autoscaling-gateway&section=q130-storm-live-direct-denial)
diagnostics.wrong_host: The supplied URL may be missing or the Gateway may still serve closed.station.internal. Check the URL and repeat the request with that Host to confirm it fails. [Cause and check](guides#guide=autoscaling-gateway&section=q130-storm-live-wrong-host-denial)
diagnostics.minimum: The HPA may have lost its lower scaling bound. Check the actual minReplicas and keep it at one. [Cause and check](guides#guide=autoscaling-gateway&section=q130-hpa-minimum-replicas)
diagnostics.maximum: The HPA may be unable to scale to two replicas or may exceed the intended ceiling. Check maxReplicas and keep it at two. [Cause and check](guides#guide=autoscaling-gateway&section=q130-hpa-maximum-replicas)
diagnostics.ready: The HPA may request more capacity while a board Pod is still unready. Inspect Pod events and wait for the Deployment status to show two ready replicas. [Cause and check](guides#guide=autoscaling-gateway&section=q130-board-ready-replica-count)
diagnostics.current: The controller may not yet observe two replicas or may target the wrong workload. Compare its reported current count with the linked Deployment. [Cause and check](guides#guide=autoscaling-gateway&section=q130-hpa-current-replica-count)
diagnostics.desired: The controller may still recommend one replica because observed CPU demand is low or unavailable. Compare its status with the current CPU metric. [Cause and check](guides#guide=autoscaling-gateway&section=q130-hpa-desired-replica-count)
diagnostics.probe_0_0: The worker resource observer may have stopped before reporting a condition. Verify the board Deployment read and the local Python command. [Cause and check](guides#guide=autoscaling-gateway&section=q130-storm-worker-observer-input)
diagnostics.probe_1_0: The worker resource observer may have stopped before reporting a condition. Verify the board Deployment read and the local Python command. [Cause and check](guides#guide=autoscaling-gateway&section=q130-storm-worker-observer-input)
diagnostics.probe_0_1: The HPA observer may have stopped before reporting a condition. Verify that it can read the board HPA and run the local Python command. [Cause and check](guides#guide=autoscaling-gateway&section=q130-storm-hpa-observer-input)
diagnostics.probe_1_1: The HPA observer may have stopped before reporting a condition. Verify that it can read the board HPA and run the local Python command. [Cause and check](guides#guide=autoscaling-gateway&section=q130-storm-hpa-observer-input)
diagnostics.probe_1_3: The route observer may have stopped before reporting a condition. Check the supplied request facts and that the HTTPRoute and Service can be read. [Cause and check](guides#guide=autoscaling-gateway&section=q130-storm-route-observer-input)
diagnostics.probe_1_4: The ingress-policy observer may have stopped before reporting a condition. Check the saved Gateway facts and the current NetworkPolicy and Deployment. [Cause and check](guides#guide=autoscaling-gateway&section=q130-storm-policy-observer-input)
