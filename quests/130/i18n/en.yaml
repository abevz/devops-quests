title: Interview incident simulation
brief: 'Recover the station board service across two incident stages. In stage one,
  the board Deployment fails to scale under load even though the HPA (target 50% CPU,
  range 1–2 replicas) and metrics API are active; restore real CPU-driven scaling
  within the required container CPU budget (request 100m, limit 200m). In stage two,
  traffic through the private Gateway (preserve the GatewayClass and host north.station.internal)
  fails to reach board:8080; restore routing and ingress isolation so only the Gateway
  controller pods (app: gateway in the frozen controller namespace) can reach board
  on port 8080 while direct client access and other hosts remain denied. No node,
  global DNS or public listener changes are needed.


  Quest files in `~/quest` (some appear in later stages): `board.json`, `service.json`,
  `client.json`, `hpa.json`, `gateway.json`, `route.json`, `ingress-policy.json`,
  `gateway-target.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images
  and private services. Change only this bay.


  Initial success criteria: Real CPU metrics drive two ready replicas under the fixed
  HPA and resource limits.'
debrief: The incident was resolved with real scaling, route status and traffic tests
  while preserving an explicit isolation boundary.
stages.0.brief: 'Success criteria: Real CPU metrics drive two ready replicas under
  the fixed HPA and resource limits.'
stages.0.objectives.0.text: Real CPU metrics drive two ready replicas under the fixed
  HPA and resource limits.
stages.1.brief: 'Success criteria: The scaled board serves north-130 only through
  its intended Gateway host; direct client access remains denied.'
stages.1.objectives.0.text: The scaled board serves north-130 only through its intended
  Gateway host; direct client access remains denied.
hints.0.text: 'Stage 1: HPA percentage utilization requires a non-zero CPU request
  on the container; inspect board.json and set CPU request 100m and limit 200m without
  changing the HPA spec.'
hints.1.text: 'Stage 2: inspect route.json and ingress-policy.json — HTTPRoute points
  to the wrong backend port instead of Service port 8080, and NetworkPolicy uses an
  obsolete source pod label.'
hints.2.text: 'Set the HTTPRoute backend port to 8080, allow ingress to board:8080
  only from podSelector app: gateway in the controller namespace, and verify both
  allowed Gateway traffic and blocked direct access.'
phrases.0: I isolated metrics, routing and policy failures.
phrases.1: I verified real scale-up within a bounded budget.
phrases.2: I proved the intended path and denied bypass paths.
questions.0.points.0: Independent evidence avoids fixing the wrong layer.
questions.0.points.1: Smaller changes make recovery and rollback easier to assess.
questions.0.prompt: Why diagnose each boundary before changing everything?
questions.1.points.0: No; permitted and forbidden paths need separate tests.
questions.1.points.1: Network policy and route host matching enforce different boundaries.
questions.1.prompt: Does a successful Gateway request prove direct access is blocked?
