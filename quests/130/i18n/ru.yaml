title: Комплексный инцидент для интервью
brief: 'Восстановите сервис станции с тремя независимыми границами. На первом этапе исправьте нулевой
  CPU request: реальные метрики должны увеличить фиксированный HPA с одной до двух реплик при request
  100m, limit 200m, цели 50% и диапазоне 1–2. Второй этап задаст неверный backend port HTTPRoute и старую
  source-метку NetworkPolicy. Верните порт Service 8080 и разрешите board:8080 только для app: gateway
  из сохранённого namespace контроллера. Сохраните GatewayClass и host north.station.internal. Клиент
  должен обращаться к board через приватный Gateway; прямой доступ к board и другой host должны отклоняться.
  Изменения узла, общего DNS и публичного listener не нужны.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `board.json`, `service.json`, `client.json`,
  `hpa.json`, `gateway.json`, `route.json`, `ingress-policy.json`, `gateway-target.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Реальные CPU-метрики дают две готовые реплики при фиксированных HPA и limits.'
debrief: Инцидент решён с настоящим масштабированием, status маршрута и тестами трафика при сохранении
  явной границы изоляции.
stages.0.brief: 'Реальные CPU-метрики дают две готовые реплики при фиксированных HPA и limits.


