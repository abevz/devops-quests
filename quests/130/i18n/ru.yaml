diagnostics.request: У worker в board может отсутствовать положительный запрос CPU, либо запрос превышает лимит. Сравните значения CPU у именованного контейнера. [Причина и проверка](guides#guide=autoscaling-gateway&section=q130-storm-board-worker-cpu-request)
diagnostics.limit: У worker в board может отсутствовать положительный лимит CPU либо лимит выше 200m. Проверьте действующий лимит CPU. [Причина и проверка](guides#guide=autoscaling-gateway&section=q130-storm-board-worker-cpu-limit)
diagnostics.target: HPA может ссылаться на другую нагрузку или использовать другую метрику CPU. Проверьте ссылку на Deployment board из apps/v1 и единственную цель CPU Resource типа Utilization со значением 50 процентов. [Причина и проверка](guides#guide=autoscaling-gateway&section=q130-storm-hpa-cpu-target)
diagnostics.metric: HPA может не показывать текущее значение утилизации CPU Resource выше 50 процентов. Проверьте текущую метрику при нагрузке на нужный сервис. [Причина и проверка](guides#guide=autoscaling-gateway&section=q130-storm-hpa-current-cpu)
diagnostics.gateway_class: Gateway station может использовать другой класс, или запись класса может быть недоступна. Сравните gatewayClassName с выданным gateway-target.json. [Причина и проверка](guides#guide=autoscaling-gateway&section=q130-storm-gateway-class)
diagnostics.gateway_accepted: Gateway station может ещё не показывать Accepted=True. Проверьте его условия и причину, указанную контроллером. [Причина и проверка](guides#guide=autoscaling-gateway&section=q130-storm-gateway-accepted)
diagnostics.backend: Выданный запрос может не попадать под маршрут, либо выбранное правило ведёт часть трафика с положительным весом на другой backend или порт. Сверьте Host north.station.internal и выданный URL с выбранным правилом и портом Service board. [Причина и проверка](guides#guide=autoscaling-gateway&section=q130-storm-effective-http-route)
diagnostics.resolved: HTTPRoute может не читаться, или ни одна запись родителя не показывает ResolvedRefs=True. Проверьте условия родителей и ссылки на backend. [Причина и проверка](guides#guide=autoscaling-gateway&section=q130-storm-route-reference-status)
diagnostics.policy: Политика board-ingress может выбирать неверные Pod или разрешать более широкий источник либо порт. Проверьте Ingress, оба селектора в одном peer для gateway и только TCP 8080. [Причина и проверка](guides#guide=autoscaling-gateway&section=q130-storm-gateway-ingress-policy)
diagnostics.gateway_http: Запрос с правильным Host через выданный Gateway может завершиться ошибкой или вернуть другие данные. Повторите запрос из client и сравните ответ с north-130. [Причина и проверка](guides#guide=autoscaling-gateway&section=q130-storm-live-gateway-response)
diagnostics.direct_denied: Клиент может по-прежнему обращаться напрямую к board:8080. Повторите прямой запрос и проверьте политики, разрешающие трафик от client к board. [Причина и проверка](guides#guide=autoscaling-gateway&section=q130-storm-live-direct-denial)
diagnostics.wrong_host: Выданный URL может отсутствовать, или Gateway по-прежнему обслуживает closed.station.internal. Проверьте URL и повторите запрос с этим Host, чтобы убедиться в отказе. [Причина и проверка](guides#guide=autoscaling-gateway&section=q130-storm-live-wrong-host-denial)
diagnostics.minimum: HPA мог потерять нижнюю границу масштабирования. Проверьте minReplicas и сохраните одну реплику. [Причина и проверка](guides#guide=autoscaling-gateway&section=q130-hpa-minimum-replicas)
diagnostics.maximum: HPA может не масштабироваться до двух реплик либо превышать допустимый максимум. Проверьте maxReplicas и сохраните значение два. [Причина и проверка](guides#guide=autoscaling-gateway&section=q130-hpa-maximum-replicas)
diagnostics.ready: HPA мог запросить больше мощности, пока один Pod board ещё не готов. Проверьте события Pod и дождитесь двух готовых реплик в статусе Deployment. [Причина и проверка](guides#guide=autoscaling-gateway&section=q130-board-ready-replica-count)
diagnostics.current: Контроллер мог ещё не увидеть две реплики либо следить за другой нагрузкой. Сравните currentReplicas со связанным Deployment. [Причина и проверка](guides#guide=autoscaling-gateway&section=q130-hpa-current-replica-count)
diagnostics.desired: Контроллер может ещё рекомендовать одну реплику из-за низкой нагрузки CPU или отсутствия метрики. Сравните его статус с текущей метрикой CPU. [Причина и проверка](guides#guide=autoscaling-gateway&section=q130-hpa-desired-replica-count)
diagnostics.probe_0_0: Проверка ресурсов worker могла остановиться до вывода конкретного условия. Проверьте чтение Deployment board и доступность команды Python. [Причина и проверка](guides#guide=autoscaling-gateway&section=q130-storm-worker-observer-input)
diagnostics.probe_1_0: Проверка ресурсов worker могла остановиться до вывода конкретного условия. Проверьте чтение Deployment board и доступность команды Python. [Причина и проверка](guides#guide=autoscaling-gateway&section=q130-storm-worker-observer-input)
diagnostics.probe_0_1: Проверка HPA могла остановиться до вывода конкретного условия. Проверьте чтение HPA board и доступность команды Python. [Причина и проверка](guides#guide=autoscaling-gateway&section=q130-storm-hpa-observer-input)
diagnostics.probe_1_1: Проверка HPA могла остановиться до вывода конкретного условия. Проверьте чтение HPA board и доступность команды Python. [Причина и проверка](guides#guide=autoscaling-gateway&section=q130-storm-hpa-observer-input)
diagnostics.probe_1_3: Проверка маршрута могла остановиться до вывода конкретного условия. Проверьте выданные данные о запросе и доступность HTTPRoute и Service для чтения. [Причина и проверка](guides#guide=autoscaling-gateway&section=q130-storm-route-observer-input)
diagnostics.probe_1_4: Проверка политики ingress могла остановиться до вывода конкретного условия. Проверьте сохранённые данные Gateway и текущие NetworkPolicy и Deployment. [Причина и проверка](guides#guide=autoscaling-gateway&section=q130-storm-policy-observer-input)
