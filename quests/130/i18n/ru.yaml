title: Комплексный инцидент для интервью
brief: |-
  Board станции не выполняет требования масштабирования и приватной точки входа. Восстановите наблюдаемый результат сервиса на обоих этапах инцидента.

  Работайте в `~/quest` на рабочей станции. Входные файлы по этапам:
  - Этап 1: `board.yaml`, `service.yaml`, `client.yaml`, `hpa.yaml`.
  - Этап 2: `gateway.yaml`, `route.yaml`, `ingress-policy.yaml`, `gateway-target.json`.

  **Требования:**

  - Этап 1:
    - Deployment `board` имеет `2` готовые реплики без увеличения поставленного CPU-предела.
    - HPA `board` сохраняет поставленную политику масштабирования и сообщает `2` текущие и желаемые реплики при давлении на ресурс выше настроенной цели.
  - Этап 2:
    - Deployment `board` имеет `2` готовые реплики без увеличения поставленного CPU-предела.
    - HPA `board` сохраняет поставленную политику масштабирования и сообщает `2` текущие и желаемые реплики при давлении на ресурс выше настроенной цели.
    - Gateway `station` использует поставленный приватный класс и сообщает `Accepted=True`.
    - HTTPRoute `board` сообщает `ResolvedRefs=True` для родителя.
    - Ingress-политика приложения разрешает TCP `8080` только от поставленного приватного контроллера Gateway.
    - Из Deployment `client` поставленный URL Gateway возвращает `north-130` для Host `north.station.internal`; прямой запрос к `http://board:8080` и запрос с Host `closed.station.internal` завершаются неуспешно.

  Проверки наблюдают объявленные настройки масштабирования и текущую утилизацию CPU, но не причину прошлого масштабирования; сбои трафика могут иметь другие причины, а статусы могут устареть или относиться к другому parent.

debrief: Инцидент решён с настоящим масштабированием, status маршрута и тестами трафика при сохранении явной границы
  изоляции.
stages.0.brief: Board должен выполнять заданный бюджет масштабирования при наблюдаемой нагрузке.
stages.1.brief: Сохраните масштабирование в пределах бюджета при восстановлении изолированного приватного входа.
hints.0.text: Давление на ресурс, решение масштабирования и готовые реплики — разные наблюдения. Контроллеру нужны
  измерения, которые он может интерпретировать.
hints.1.text: 'Этап 2: проверьте route.yaml и ingress-policy.yaml — HTTPRoute указывает на неверный backend port
  вместо порта Service 8080, а NetworkPolicy использует устаревшую source-метку Pod.


  Изучите поставленные определения, описания ресурсов и события соответствующего этапа.


  ```sh

  kubectl describe deployment board

  kubectl describe hpa board

  kubectl describe gateway station

  kubectl describe httproute board

  ```


  Этап 1/2: Изучите определения этих ресурсов для данного этапа.


  ```sh

  kubectl get deployment board -o yaml

  kubectl get hpa board -o yaml

  ```


  Этап 2: Изучите определения этих ресурсов для данного этапа.


  ```sh

  cat gateway-target.json

  kubectl get gateway station -o yaml

  kubectl get httproute board -o yaml

  kubectl get networkpolicy board-ingress -o yaml

  ```'
hints.2.text: |-
  Этап 1: расчёт процентов HPA требует ненулевого CPU request у контейнера; проверьте board.yaml и задайте CPU request 100m и limit 200m, не меняя сам HPA.

  Укажите порт 8080 в HTTPRoute, разрешите ingress к board:8080 только от podSelector app: gateway из namespace контроллера и проверьте как прохождение запроса через Gateway, так и блокировку прямого доступа.

  Проверьте исправленный этап и сравните наблюдаемый результат.

  Этап 1/2: Deployment показывает `2` готовые реплики; HPA сообщает `2` реплики и текущую утилизацию ресурса выше настроенной цели.

  ```sh
  kubectl get deployment board
  kubectl get hpa board
  ```

  Этап 2: Целевой Host Gateway возвращает `north-130`; прямые запросы и запросы постороннего Host завершаются неуспешно.

  ```sh
  url=$(jq -r .url gateway-target.json)
  kubectl exec deployment/client -c worker -- wget -qO- -T 3 --header='Host: north.station.internal' "$url"
  for target in direct unrelated; do
    if [ "$target" = direct ]; then
      if kubectl exec deployment/client -c worker -- wget -qO- -T 2 http://board:8080 >/dev/null 2>&1; then exit 1; fi
    else
      if kubectl exec deployment/client -c worker -- wget -qO- -T 2 --header='Host: closed.station.internal' "$url" >/dev/null 2>&1; then exit 1; fi
    fi
    printf '%s rejected\n' "$target"
  done
  ```

  Ожидаемые наблюдения для этапа целиком:
  - Этап 1/2: CPU-бюджет, готовые реплики, диапазон HPA, цель и наблюдаемая утилизация соответствуют требованиям.
  - Этап 2: Поставленный класс, принятый Gateway, разрешённый маршрут и ограниченная ingress-политика соответствуют требованиям.

phrases.0: Я разделил сбои метрик, маршрутизации и policy.
phrases.1: Я проверил настоящее масштабирование в ограниченном бюджете.
phrases.2: Я подтвердил нужный путь и запрет обходных путей.
questions.0.points.0: Независимые данные помогают не исправлять неверный уровень.
questions.0.points.1: Небольшие изменения упрощают проверку восстановления и отката.
questions.0.prompt: Зачем диагностировать каждую границу до изменения всей системы?
questions.1.points.0: 'Нет: разрешённые и запрещённые пути проверяются отдельно.'
questions.1.points.1: Network policy и соответствие host маршрута обеспечивают разные границы.
questions.1.prompt: Доказывает ли успешный запрос Gateway запрет прямого доступа?
diagnostics.request: |-
  CPU request worker должен быть положительным и не превышать его конечный CPU limit.

diagnostics.limit: |-
  CPU limit worker должен быть положительным и не больше 200m.

diagnostics.ready: Board должен иметь две готовые реплики.
diagnostics.minimum: HPA minReplicas должен быть 1.
diagnostics.maximum: HPA maxReplicas должен быть 2.
diagnostics.target: |-
  HPA должен масштабировать Deployment board и сохранять цель утилизации CPU 50.
diagnostics.current: HPA currentReplicas должен быть 2.
diagnostics.desired: HPA desiredReplicas должен быть 2.
diagnostics.metric: |-
  Текущая утилизация CPU должна превышать поставленную цель HPA.

diagnostics.gateway_class: Класс Gateway должен совпадать с gateway-target.json.
diagnostics.gateway_accepted: Gateway Accepted должен быть True.
diagnostics.backend: |-
  Маршрут должен ссылаться на объявленный порт поставленного Service board.

diagnostics.resolved: У некоторого parent HTTPRoute должно быть ResolvedRefs=True.
diagnostics.policy: |-
  Ingress приложения разрешает TCP 8080 только из поставленного namespace Gateway И его Pod.

diagnostics.gateway_http: Запрос через gateway с Host north.station.internal должен вернуть north-130.
diagnostics.direct_denied: Прямой запрос к board:8080 должен завершиться ошибкой.
diagnostics.wrong_host: Запрос через gateway с Host closed.station.internal должен завершиться ошибкой.
