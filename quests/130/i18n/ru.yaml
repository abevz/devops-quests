title: Комплексный инцидент для интервью
brief: "Board станции не выполняет требования масштабирования и приватной точки входа. Восстановите наблюдаемый\
  \ результат сервиса на обоих этапах инцидента.\n\nРаботайте в `~/quest` на рабочей станции. Входные файлы по этапам:\n\
  - Этап 1: `board.yaml`, `service.yaml`, `client.yaml`, `hpa.yaml`.\n- Этап 2: `gateway.yaml`, `route.yaml`, `ingress-policy.yaml`,\
  \ `gateway-target.json`.\n\n**Требования:**\n\n- Этап 1:\n  - Deployment `board` имеет `2` готовые реплики без\
  \ увеличения поставленного CPU-предела.\n  - HPA `board` сохраняет поставленную политику масштабирования и сообщает\
  \ `2` текущие и желаемые реплики при давлении на ресурс выше настроенной цели.\n- Этап 2:\n  - Deployment `board`\
  \ имеет `2` готовые реплики без увеличения поставленного CPU-предела.\n  - HPA `board` сохраняет поставленную\
  \ политику масштабирования и сообщает `2` текущие и желаемые реплики при давлении на ресурс выше настроенной цели.\n\
  \  - Gateway `station` использует поставленный приватный класс и сообщает `Accepted=True`.\n  - HTTPRoute `board`\
  \ сообщает `ResolvedRefs=True` для родителя.\n  - Ingress-политика приложения разрешает TCP `8080` только от поставленного\
  \ приватного контроллера Gateway.\n  - Из Deployment `client` поставленный URL Gateway возвращает `north-130`\
  \ для Host `north.station.internal`; прямой запрос к `http://board:8080` и запрос с Host `closed.station.internal`\
  \ завершаются неуспешно.\n\nПроверки не устанавливают, что целевая или текущая утилизация относится к CPU, и не\
  \ доказывают причину масштабирования; неуспешные запросы могут иметь другие причины, а условия статуса могут быть\
  \ устаревшими или относиться к другому родителю."
debrief: Инцидент решён с настоящим масштабированием, status маршрута и тестами трафика при сохранении явной границы
  изоляции.
stages.0.brief: Board должен выполнять заданный бюджет масштабирования при наблюдаемой нагрузке.
stages.1.brief: Сохраните масштабирование в пределах бюджета при восстановлении изолированного приватного входа.
hints.0.text: Давление на ресурс, решение масштабирования и готовые реплики — разные наблюдения. Контроллеру нужны
  измерения, которые он может интерпретировать.
hints.1.text: 'Этап 2: проверьте route.yaml и ingress-policy.yaml — HTTPRoute указывает на неверный backend port
  вместо порта Service 8080, а NetworkPolicy использует устаревшую source-метку Pod.


  Изучите поставленные определения, описания ресурсов и события соответствующего этапа.


  ```sh

  kubectl describe deployment board

  kubectl describe hpa board

  kubectl describe gateway station

  kubectl describe httproute board

  ```


  Этап 1/2: Изучите определения этих ресурсов для данного этапа.


  ```sh

  kubectl get deployment board -o yaml

  kubectl get hpa board -o yaml

  ```


  Этап 2: Изучите определения этих ресурсов для данного этапа.


  ```sh

  cat gateway-target.json

  kubectl get gateway station -o yaml

  kubectl get httproute board -o yaml

  kubectl get networkpolicy board-ingress -o yaml

  ```'
hints.2.text: "Этап 1: расчёт процентов HPA требует ненулевого CPU request у контейнера; проверьте board.yaml и\
  \ задайте CPU request 100m и limit 200m, не меняя сам HPA.\n\nУкажите порт 8080 в HTTPRoute, разрешите ingress\
  \ к board:8080 только от podSelector app: gateway из namespace контроллера и проверьте как прохождение запроса\
  \ через Gateway, так и блокировку прямого доступа.\n\nПроверьте исправленный этап и сравните наблюдаемый результат.\n\
  \nЭтап 1/2: Deployment показывает `2` готовые реплики; HPA сообщает `2` реплики и текущую утилизацию ресурса выше\
  \ настроенной цели.\n\n```sh\nkubectl get deployment board\nkubectl get hpa board\n```\n\nЭтап 2: Целевой Host\
  \ Gateway возвращает `north-130`; прямые запросы и запросы постороннего Host завершаются неуспешно.\n\n```sh\n\
  url=$(jq -r .url gateway-target.json)\nkubectl exec deployment/client -- wget -qO- -T 3 --header='Host: north.station.internal'\
  \ \"$url\"\nfor target in direct unrelated; do\n  if [ \"$target\" = direct ]; then\n    if kubectl exec deployment/client\
  \ -- wget -qO- -T 2 http://board:8080 >/dev/null 2>&1; then exit 1; fi\n  else\n    if kubectl exec deployment/client\
  \ -- wget -qO- -T 2 --header='Host: closed.station.internal' \"$url\" >/dev/null 2>&1; then exit 1; fi\n  fi\n\
  \  printf '%s rejected\\n' \"$target\"\ndone\n```\n\nОжидаемые наблюдения для этапа целиком:\n- Этап 1/2: CPU-бюджет,\
  \ готовые реплики, диапазон HPA, цель и наблюдаемая утилизация соответствуют требованиям.\n- Этап 2: Поставленный\
  \ класс, принятый Gateway, разрешённый маршрут и ограниченная ingress-политика соответствуют требованиям."
phrases.0: Я разделил сбои метрик, маршрутизации и policy.
phrases.1: Я проверил настоящее масштабирование в ограниченном бюджете.
phrases.2: Я подтвердил нужный путь и запрет обходных путей.
questions.0.points.0: Независимые данные помогают не исправлять неверный уровень.
questions.0.points.1: Небольшие изменения упрощают проверку восстановления и отката.
questions.0.prompt: Зачем диагностировать каждую границу до изменения всей системы?
questions.1.points.0: 'Нет: разрешённые и запрещённые пути проверяются отдельно.'
questions.1.points.1: Network policy и соответствие host маршрута обеспечивают разные границы.
questions.1.prompt: Доказывает ли успешный запрос Gateway запрет прямого доступа?
diagnostics.request: Запрос CPU первого контейнера board должен быть 100m.
diagnostics.limit: Лимит CPU первого контейнера board должен быть 200m.
diagnostics.ready: Board должен иметь две готовые реплики.
diagnostics.minimum: HPA minReplicas должен быть 1.
diagnostics.maximum: HPA maxReplicas должен быть 2.
diagnostics.target: Первое целевое использование HPA должно быть 50.
diagnostics.current: HPA currentReplicas должен быть 2.
diagnostics.desired: HPA desiredReplicas должен быть 2.
diagnostics.metric: Текущая метрика ресурса HPA должна иметь использование выше 50.
diagnostics.gateway_class: Класс Gateway должен совпадать с gateway-target.json.
diagnostics.gateway_accepted: Gateway Accepted должен быть True.
diagnostics.backend: Первый порт backend HTTPRoute должен быть 8080.
diagnostics.resolved: У некоторого parent HTTPRoute должно быть ResolvedRefs=True.
diagnostics.policy: Спецификация board-ingress должна совпадать с точной политикой из описания.
diagnostics.gateway_http: Запрос через gateway с Host north.station.internal должен вернуть north-130.
diagnostics.direct_denied: Прямой запрос к board:8080 должен завершиться ошибкой.
diagnostics.wrong_host: Запрос через gateway с Host closed.station.internal должен завершиться ошибкой.
