title: Комплексный инцидент для интервью
brief: 'Восстановите сервис табло станции в два этапа. На первом этапе Deployment
  board не масштабируется под нагрузкой, хотя HPA (цель 50% CPU, диапазон 1–2 реплики)
  и API метрик активны; восстановите масштабирование по реальным CPU-метрикам в рамках
  заданного бюджета контейнера (request 100m, limit 200m). На втором этапе трафик
  через приватный Gateway (сохраните GatewayClass и host north.station.internal) не
  доходит до board:8080; восстановите маршрутизацию и сетевую изоляцию так, чтобы
  доступ к board на порт 8080 был разрешён только Pod''ам контроллера Gateway (метка
  app: gateway в сохранённом namespace контроллера), а прямой доступ клиента и чужие
  host отклонялись. Изменения узла, общего DNS и публичного listener не нужны.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `board.json`, `service.json`,
  `client.json`, `hpa.json`, `gateway.json`, `route.json`, `ingress-policy.json`,
  `gateway-target.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно
  загруженные образы и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Реальные CPU-метрики дают две готовые реплики при фиксированных
  HPA и limits.'
debrief: Инцидент решён с настоящим масштабированием, status маршрута и тестами трафика
  при сохранении явной границы изоляции.
stages.0.brief: 'Результат проверки: Реальные CPU-метрики дают две готовые реплики
  при фиксированных HPA и limits.'
stages.0.objectives.0.text: Реальные CPU-метрики дают две готовые реплики при фиксированных
  HPA и limits.
stages.1.brief: 'Результат проверки: Масштабированное табло отдаёт north-130 только
  через нужный host Gateway; прямой доступ клиента запрещён.'
stages.1.objectives.0.text: Масштабированное табло отдаёт north-130 только через нужный
  host Gateway; прямой доступ клиента запрещён.
hints.0.text: 'Этап 1: расчёт процентов HPA требует ненулевого CPU request у контейнера;
  проверьте board.json и задайте CPU request 100m и limit 200m, не меняя сам HPA.'
hints.1.text: 'Этап 2: проверьте route.json и ingress-policy.json — HTTPRoute указывает
  на неверный backend port вместо порта Service 8080, а NetworkPolicy использует устаревшую
  source-метку Pod.'
hints.2.text: 'Укажите порт 8080 в HTTPRoute, разрешите ingress к board:8080 только
  от podSelector app: gateway из namespace контроллера и проверьте как прохождение
  запроса через Gateway, так и блокировку прямого доступа.'
phrases.0: Я разделил сбои метрик, маршрутизации и policy.
phrases.1: Я проверил настоящее масштабирование в ограниченном бюджете.
phrases.2: Я подтвердил нужный путь и запрет обходных путей.
questions.0.points.0: Независимые данные помогают не исправлять неверный уровень.
questions.0.points.1: Небольшие изменения упрощают проверку восстановления и отката.
questions.0.prompt: Зачем диагностировать каждую границу до изменения всей системы?
questions.1.points.0: 'Нет: разрешённые и запрещённые пути проверяются отдельно.'
questions.1.points.1: Network policy и соответствие host маршрута обеспечивают разные
  границы.
questions.1.prompt: Доказывает ли успешный запрос Gateway запрет прямого доступа?
