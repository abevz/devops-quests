title: Simulation von Interviewvorfällen
brief: 'Stelle den Dienst station board in zwei Vorfallphasen wieder her. In Phase eins skaliert das Deployment board unter
  Last nicht, obwohl HPA (CPU-Ziel 50%, Bereich 1–2 Replikate) und Metrik-API aktiv sind; stelle echte CPU-gesteuerte Skalierung
  im geforderten Containerbudget wieder her (Request 100m, Limit 200m). In Phase zwei erreicht Verkehr über das private Gateway
  board:8080 nicht (GatewayClass und Host north.station.internal beibehalten); stelle Routing und Ingress-Isolation so wieder
  her, dass nur Gateway-Controller-Pods (app: gateway im gespeicherten Controller-Namespace) board auf Port 8080 erreichen,
  während direkter client-Zugriff und andere Hosts verwehrt bleiben. Änderungen an Nodes, globalem DNS oder öffentlichem Listener
  sind nicht nötig.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `board.json`, `service.json`, `client.json`, `hpa.json`,
  `gateway.json`, `route.json`, `ingress-policy.json`, `gateway-target.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien, vorinstallierte Bilder
  und private Dienste. Ändern Sie nur diese Bucht.


  In beiden Phasen verlangen die Prüfungen CPU-Request `100m` und Limit `200m` im ersten Board-Container, zwei bereite Replikate,
  HPA-Minimum 1 und Maximum 2, ersten Utilization-Zielwert 50, aktuelle und gewünschte Replikate 2 und eine aktuelle Ressourcen-Auslastung
  über 50. Die Prüfungen kontrollieren weder beim ersten Ziel noch bei der aktuellen Metrik, ob sie CPU betreffen; der aktuelle
  Zustand beweist nicht die Ursache der Skalierung. In Phase zwei muss die Gateway-Klasse `gateway-target.json` entsprechen
  und Accepted=True sein; der erste HTTPRoute-Backend-Port muss 8080 und ein Parent ResolvedRefs=True haben. Die `board-ingress`-Spec
  muss der Ein-Regel-Struktur des bereitgestellten `ingress-policy.json` entsprechen, nur mit gespeichertem Controller-Namespace
  und Peer `app: gateway` auf TCP 8080. Die Anfrage an die gespeicherte URL mit Host `north.station.internal` muss `north-130`
  liefern; direkte Anfragen an `board:8080` und mit Host `closed.station.internal` müssen fehlschlagen. Fehler können andere
  Ursachen als Policy oder Host-Regel haben; Statusbedingungen können veraltet sein oder einen anderen Parent betreffen.'
debrief: Der Vorfall wurde durch echte Skalierung, route status und Verkehrstests unter Beibehaltung einer expliziten Isolationsgrenze
  behoben.
stages.0.brief: Board-CPU-Budget, bereite Replikate sowie HPA-Einstellungen und aktueller Status entsprechen der Beschreibung.
stages.0.objectives.0.text: Board-CPU-Budget, bereite Replikate sowie HPA-Einstellungen und aktueller Status entsprechen der
  Beschreibung.
stages.1.brief: Die HPA-Bedingungen sowie Gateway, Route, genaue Ingress-Policy und drei Verkehrstests entsprechen der Beschreibung.
stages.1.objectives.0.text: Die HPA-Bedingungen sowie Gateway, Route, genaue Ingress-Policy und drei Verkehrstests entsprechen
  der Beschreibung.
hints.0.text: 'Stufe 1: Die prozentuale Auslastung von HPA erfordert eine CPU-Anfrage ungleich Null für den Container. inspect
  board.json und setzen Sie CPU, fordern Sie 100m und limit 200m an, ohne die HPA-Spezifikation zu ändern.'
hints.1.text: 'Stufe 2: inspect route.json und ingress-policy.json – HTTPRoute zeigt auf den falschen backend-Port statt auf
  Service-Port 8080 und NetworkPolicy verwendet ein veraltetes Quell-Pod-Label.'
hints.2.text: 'Stellen Sie den HTTPRoute-Backend-Port auf 8080 ein und lassen Sie ingress bis board:8080 nur von podSelector
  app: gateway im Controller zu namespace und überprüfen Sie sowohl den zulässigen Gateway-Verkehr als auch den blockierten
  direkten Zugriff.'
phrases.0: Ich habe Metriken, Routing und policy-Fehler isoliert.
phrases.1: Ich habe eine echte Skalierung innerhalb eines begrenzten Budgets überprüft.
phrases.2: Ich habe den beabsichtigten Pfad bewiesen und Umgehungspfade abgelehnt.
questions.0.points.0: Unabhängige Beweise vermeiden die Korrektur der falschen Ebene.
questions.0.points.1: Kleinere Änderungen erleichtern die Beurteilung von Wiederherstellung und Rollback.
questions.0.prompt: Warum jede Grenze diagnostizieren, bevor man alles ändert?
questions.1.points.0: NEIN; Erlaubte und verbotene Pfade erfordern separate Tests.
questions.1.points.1: Network policy und route Host-Matching erzwingen unterschiedliche Grenzen.
questions.1.prompt: Beweist eine erfolgreiche Gateway-Anfrage, dass der direkte Zugriff blockiert ist?
diagnostics.request: Der CPU-Request des ersten Board-Containers muss 100m sein.
diagnostics.limit: Das CPU-Limit des ersten Board-Containers muss 200m sein.
diagnostics.ready: Board muss zwei bereite Replikate haben.
diagnostics.minimum: HPA minReplicas muss 1 sein.
diagnostics.maximum: HPA maxReplicas muss 2 sein.
diagnostics.target: Der erste HPA-Utilization-Zielwert muss 50 sein.
diagnostics.current: HPA currentReplicas muss 2 sein.
diagnostics.desired: HPA desiredReplicas muss 2 sein.
diagnostics.metric: Eine aktuelle HPA-Ressourcenmetrik muss eine Auslastung über 50 haben.
diagnostics.gateway_class: Die Gateway-Klasse muss gateway-target.json entsprechen.
diagnostics.gateway_accepted: Gateway Accepted muss True sein.
diagnostics.backend: Der erste HTTPRoute-Backend-Port muss 8080 sein.
diagnostics.resolved: Ein HTTPRoute-Parent muss ResolvedRefs=True haben.
diagnostics.policy: Die Spezifikation von board-ingress muss der genauen Policy in der Beschreibung entsprechen.
diagnostics.gateway_http: Die Gateway-Anfrage mit Host north.station.internal muss north-130 liefern.
diagnostics.direct_denied: Die direkte Anfrage an board:8080 muss fehlschlagen.
diagnostics.wrong_host: Die Gateway-Anfrage mit Host closed.station.internal muss fehlschlagen.
