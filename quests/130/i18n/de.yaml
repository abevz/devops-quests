title: Simulation von Interviewvorfällen
brief: 'Stellen Sie den Dienst station board über zwei Vorfallphasen wieder her. In der ersten Stufe kann
  der board Deployment unter Last nicht skaliert werden, obwohl der HPA (Ziel 50 % CPU, Bereich 1–2 Replikate)
  und die Metriken API aktiv sind; Stellen Sie die echte CPU-gesteuerte Skalierung innerhalb des erforderlichen
  Container-CPU-Budgets wieder her (Anfrage 100m, limit 200m). In Stufe zwei erreicht der Datenverkehr
  über den privaten Gateway (GatewayClass und Host north.station.internal beibehalten) board:8080 nicht;
  Routing und Eingangsisolation wiederherstellen, sodass nur die Gateway-Controller-Pods (app: gateway
  im eingefrorenen Controller namespace) board auf Port 8080 erreichen können, während direkter client-Zugriff
  und andere Hosts möglich sind bleiben weiterhin verwehrt. Es sind keine Knoten-, globalen DNS- oder
  öffentlichen listener-Änderungen erforderlich.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `board.json`, `service.json`, `client.json`,
  `hpa.json`, `gateway.json`, `route.json`, `ingress-policy.json`, `gateway-target.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: Echte CPU-Metriken führen zu zwei fertigen Replikaten unter dem festen HPA und
  der Ressource limits.'
debrief: Der Vorfall wurde durch echte Skalierung, route status und Verkehrstests unter Beibehaltung einer
  expliziten Isolationsgrenze behoben.
stages.0.brief: 'Erfolgskriterien: Echte CPU-Metriken steuern zwei fertige Replikate unter dem festen
  HPA und der Ressource limits.'
stages.0.objectives.0.text: Echte CPU-Metriken steuern zwei fertige Replikate unter dem festen HPA und
  der Ressource limits.
stages.1.brief: 'Erfolgskriterien: Der skalierte board bedient north-130 nur über seinen vorgesehenen
  Gateway-Host; Der direkte client-Zugriff bleibt weiterhin verweigert.'
stages.1.objectives.0.text: Der skalierte board bedient north-130 nur über seinen vorgesehenen Gateway-Host;
  Der direkte client-Zugriff bleibt verweigert.
hints.0.text: 'Stufe 1: Die prozentuale Auslastung von HPA erfordert eine CPU-Anfrage ungleich Null für
  den Container. inspect board.json und setzen Sie CPU, fordern Sie 100m und limit 200m an, ohne die HPA-Spezifikation
  zu ändern.'
hints.1.text: 'Stufe 2: inspect route.json und ingress-policy.json – HTTPRoute zeigt auf den falschen
  backend-Port statt auf Service-Port 8080 und NetworkPolicy verwendet ein veraltetes Quell-Pod-Label.'
hints.2.text: 'Stellen Sie den HTTPRoute-Backend-Port auf 8080 ein und lassen Sie ingress bis board:8080
  nur von podSelector app: gateway im Controller zu namespace und überprüfen Sie sowohl den zulässigen
  Gateway-Verkehr als auch den blockierten direkten Zugriff.'
phrases.0: Ich habe Metriken, Routing und policy-Fehler isoliert.
phrases.1: Ich habe eine echte Skalierung innerhalb eines begrenzten Budgets überprüft.
phrases.2: Ich habe den beabsichtigten Pfad bewiesen und Umgehungspfade abgelehnt.
questions.0.points.0: Unabhängige Beweise vermeiden die Korrektur der falschen Ebene.
questions.0.points.1: Kleinere Änderungen erleichtern die Beurteilung von Wiederherstellung und Rollback.
questions.0.prompt: Warum jede Grenze diagnostizieren, bevor man alles ändert?
questions.1.points.0: NEIN; Erlaubte und verbotene Pfade erfordern separate Tests.
questions.1.points.1: Network policy und route Host-Matching erzwingen unterschiedliche Grenzen.
questions.1.prompt: Beweist eine erfolgreiche Gateway-Anfrage, dass der direkte Zugriff blockiert ist?
