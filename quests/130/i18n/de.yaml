diagnostics.request: Dem worker in board fehlt möglicherweise ein positiver CPU-Request oder er überschreitet das Limit. Vergleiche die CPU-Werte im Container worker. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q130-storm-board-worker-cpu-request)
diagnostics.limit: Dem worker in board fehlt möglicherweise ein positives CPU-Limit oder es liegt über 200m. Prüfe das wirksame CPU-Limit. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q130-storm-board-worker-cpu-limit)
diagnostics.target: Der HPA zielt möglicherweise auf einen anderen Workload oder nutzt eine andere CPU-Metrik. Prüfe den Verweis auf Deployment board aus apps/v1 und das einzelne CPU-Resource-Ziel vom Typ Utilization bei 50 Prozent. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q130-storm-hpa-cpu-target)
diagnostics.metric: Der HPA meldet möglicherweise keine aktuelle CPU-Resource-Auslastung über 50 Prozent. Prüfe die aktuelle Metrik unter Last am vorgesehenen Workload. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q130-storm-hpa-current-cpu)
diagnostics.gateway_class: Gateway station verwendet möglicherweise eine andere Klasse oder der Klasseneintrag ist nicht verfügbar. Vergleiche gatewayClassName mit der bereitgestellten gateway-target.json. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q130-storm-gateway-class)
diagnostics.gateway_accepted: Gateway station meldet möglicherweise noch kein Accepted=True. Prüfe seine Bedingungen und den vom Controller gemeldeten Grund. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q130-storm-gateway-accepted)
diagnostics.backend: Die vorgegebene Anfrage passt möglicherweise zu keiner Route oder eine wirksame Regel sendet Verkehr mit positivem Gewicht an ein anderes Backend oder einen anderen Port. Vergleiche Host north.station.internal und die bereitgestellte URL mit der gewählten Regel und dem Port des Service board. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q130-storm-effective-http-route)
diagnostics.resolved: Die HTTPRoute ist möglicherweise nicht lesbar oder kein Elterneintrag meldet ResolvedRefs=True. Prüfe die aktuellen Elternbedingungen und die referenzierten Backends. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q130-storm-route-reference-status)
diagnostics.policy: Die Richtlinie board-ingress wählt möglicherweise falsche Pods oder lässt eine breitere Quelle oder einen anderen Port zu. Prüfe Ingress, beide Selektoren im selben gateway-Peer und ausschließlich TCP 8080. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q130-storm-gateway-ingress-policy)
diagnostics.gateway_http: Die Anfrage mit richtigem Host über den bereitgestellten Gateway schlägt möglicherweise fehl oder liefert anderen Inhalt. Wiederhole sie aus client und vergleiche den Antworttext mit north-130. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q130-storm-live-gateway-response)
diagnostics.direct_denied: Client erreicht board:8080 möglicherweise noch direkt. Wiederhole die direkte Anfrage und prüfe Richtlinien, die Verkehr von client zu board erlauben. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q130-storm-live-direct-denial)
diagnostics.wrong_host: Die bereitgestellte URL fehlt möglicherweise oder der Gateway bedient weiterhin closed.station.internal. Prüfe die URL und wiederhole die Anfrage mit diesem Host, um den Fehlschlag zu bestätigen. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q130-storm-live-wrong-host-denial)
diagnostics.minimum: Die Untergrenze des HPA fehlt möglicherweise. Prüfen Sie minReplicas und belassen Sie den Wert bei eins. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q130-hpa-minimum-replicas)
diagnostics.maximum: Der HPA erreicht möglicherweise keine zwei Repliken oder überschreitet die Obergrenze. Prüfen Sie maxReplicas und belassen Sie den Wert bei zwei. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q130-hpa-maximum-replicas)
diagnostics.ready: Der HPA fordert möglicherweise mehr Kapazität an, während ein board-Pod noch nicht bereit ist. Prüfen Sie Ereignisse und warten Sie auf zwei bereite Repliken im Deployment-Status. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q130-board-ready-replica-count)
diagnostics.current: Der Controller sieht möglicherweise noch keine zwei Repliken oder verweist auf eine andere Arbeitslast. Vergleichen Sie die gemeldete Anzahl mit dem verbundenen Deployment. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q130-hpa-current-replica-count)
diagnostics.desired: Der Controller empfiehlt möglicherweise noch ein Replikat, weil die beobachtete CPU-Last niedrig ist oder die Metrik fehlt. Vergleiche seinen Status mit der aktuellen CPU-Metrik. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q130-hpa-desired-replica-count)
diagnostics.probe_0_0: Die Ressourcenprüfung des worker könnte vor Meldung einer Bedingung abgebrochen sein. Prüfe den Lesezugriff auf Deployment board und den lokalen Python-Befehl. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q130-storm-worker-observer-input)
diagnostics.probe_1_0: Die Ressourcenprüfung des worker könnte vor Meldung einer Bedingung abgebrochen sein. Prüfe den Lesezugriff auf Deployment board und den lokalen Python-Befehl. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q130-storm-worker-observer-input)
diagnostics.probe_0_1: Die HPA-Prüfung könnte vor Meldung einer Bedingung abgebrochen sein. Prüfe den Lesezugriff auf HPA board und den lokalen Python-Befehl. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q130-storm-hpa-observer-input)
diagnostics.probe_1_1: Die HPA-Prüfung könnte vor Meldung einer Bedingung abgebrochen sein. Prüfe den Lesezugriff auf HPA board und den lokalen Python-Befehl. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q130-storm-hpa-observer-input)
diagnostics.probe_1_3: Die Routenprüfung könnte vor Meldung einer Bedingung abgebrochen sein. Prüfe die bereitgestellten Anfragedaten und den Lesezugriff auf HTTPRoute und Service. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q130-storm-route-observer-input)
diagnostics.probe_1_4: Die Prüfung der Eingangsrichtlinie könnte vor Meldung einer Bedingung abgebrochen sein. Prüfe die erfassten Gateway-Daten sowie aktuelle NetworkPolicy und Deployment. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q130-storm-policy-observer-input)
