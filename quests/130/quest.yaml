id: 130
title: title
track: Boss
difficulty: expert
brief: brief
stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    check: 'kubectl get deployment board -o json | jq -e ''.spec.template.spec.containers[0].resources.requests.cpu=="100m"
      and .spec.template.spec.containers[0].resources.limits.cpu=="200m" and .status.readyReplicas==2''
      >/dev/null

      kubectl get hpa board -o json | jq -e ''.spec.minReplicas==1 and .spec.maxReplicas==2 and .spec.metrics[0].resource.target.averageUtilization==50
      and .status.currentReplicas==2 and .status.desiredReplicas==2 and any(.status.currentMetrics[]?;.resource.current.averageUtilization>50)''
      >/dev/null'
- brief: stages.1.brief
  objectives:
  - text: stages.1.objectives.0.text
    check: 'kubectl get deployment board -o json | jq -e ''.spec.template.spec.containers[0].resources.requests.cpu=="100m"
      and .spec.template.spec.containers[0].resources.limits.cpu=="200m" and .status.readyReplicas==2''
      >/dev/null

      kubectl get hpa board -o json | jq -e ''.spec.minReplicas==1 and .spec.maxReplicas==2 and .spec.metrics[0].resource.target.averageUtilization==50
      and .status.currentReplicas==2 and .status.desiredReplicas==2 and any(.status.currentMetrics[]?;.resource.current.averageUtilization>50)''
      >/dev/null

      url=$(jq -r .url /run/dq/facts/0/gateway-target.json)

      class=$(jq -r .class /run/dq/facts/0/gateway-target.json)

      ns=$(jq -r .namespace /run/dq/facts/0/gateway-target.json)

      kubectl get gateway station -o json | jq -e --arg class "$class" ''.spec.gatewayClassName==$class
      and any(.status.conditions[]?;.type=="Accepted" and .status=="True")'' >/dev/null

      kubectl get httproute board -o json | jq -e ''.spec.rules[0].backendRefs[0].port==8080 and any(.status.parents[]?;any(.conditions[]?;.type=="ResolvedRefs"
      and .status=="True"))'' >/dev/null

      kubectl get networkpolicy board-ingress -o json | jq -e --arg ns "$ns" ''.spec=={podSelector:{matchLabels:{app:"board"}},policyTypes:["Ingress"],ingress:[{from:[{namespaceSelector:{matchLabels:{"kubernetes.io/metadata.name":$ns}},podSelector:{matchLabels:{app:"gateway"}}}],ports:[{port:8080,protocol:"TCP"}]}]}''
      >/dev/null

      test "$(kubectl exec deployment/client -- wget -qO- -T 3 --header=''Host: north.station.internal''
      "$url")" = north-130

      if kubectl exec deployment/client -- wget -qO- -T 2 http://board:8080 >/dev/null 2>&1; then exit
      1; fi

      if kubectl exec deployment/client -- wget -qO- -T 2 --header=''Host: closed.station.internal'' "$url"
      >/dev/null 2>&1; then exit 1; fi'
hints:
- text: hints.0.text
  guide: kubernetes-20
- text: hints.1.text
  guide: kubernetes-20
- text: hints.2.text
  guide: kubernetes-20
debrief: debrief
phrases:
- phrases.0
- phrases.1
- phrases.2
questions:
- prompt: questions.0.prompt
  points:
  - questions.0.points.0
  - questions.0.points.1
- prompt: questions.1.prompt
  points:
  - questions.1.points.0
  - questions.1.points.1
facts:
  environment:
  - DQ_NAMESPACE
  - DQ_APP_IMAGE
  - KUBECONFIG
  - TF_CLI_CONFIG_FILE
  files:
  - board.json
  - service.json
  - client.json
  - hpa.json
  - gateway.json
  - route.json
  - ingress-policy.json
  - gateway-target.json
  services: []
book:
  chapter: 18
  topic: Composite scaling, routing and isolation incident
immutable:
  0:
  - gateway-target.json
