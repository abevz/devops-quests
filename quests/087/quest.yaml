id: 87
title: title
track: OpenTofu
difficulty: expert
brief: brief
stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    keep: true
    check: |-
      failed=0
      if ! test "$(cat notice.txt 2>/dev/null)" = north-ready; then
        printf '%s\n' 'notice.txt = north-ready: ✗ [DQ:condition_0]'
        failed=1
      fi
      exit "$failed"
  - text: stages.0.objectives.1.text
    keep: true
    check: |-
      dq_probe_output=$(mktemp)
      trap 'rm -f "$dq_probe_output"' EXIT
      set +e
      (
      set -euo pipefail
      python3 -I - <<'DQ_PROPERTY'
      import json
      import os
      import stat
      import sys
      from pathlib import Path


      from dq_check import read_json


      from dq_check import resource_records


      from dq_check import same_target


      from dq_check import file_resources


      from dq_check import number_is

      import subprocess

      from dq_check import tofu_json

      matched = file_resources(resource_records(tofu_json("show", "-json")), 'notice.txt', in_module=False)
      if not matched:
          print("Managed producer file is missing: ✗ [DQ:condition_1]")
          sys.exit(1)
      DQ_PROPERTY
      ) >"$dq_probe_output" 2>/dev/null
      dq_probe_status=$?
      set -e
      cat "$dq_probe_output"
      if [ "$dq_probe_status" -ne 0 ] && ! grep -Eq '\[DQ:[a-z0-9_]+\]' "$dq_probe_output"; then
      printf '%s\n' 'Current inputs could not verify this objective: ✗ [DQ:probe_0_1]'
      fi
      rm -f "$dq_probe_output"
      trap - EXIT
      test "$dq_probe_status" -eq 0
  - text: stages.0.objectives.2.text
    check: |-
      dq_probe_output=$(mktemp)
      trap 'rm -f "$dq_probe_output"' EXIT
      set +e
      (
      set -euo pipefail
      python3 -I - <<'DQ_PROPERTY'
      import hashlib
      import json
      import subprocess
      import sys
      import urllib.request
      from pathlib import Path

      from dq_check import tofu_json

      failed = False

      def require(value, marker):
          global failed
          if not value:
              print('Recovery requirement is unmet: ✗ [DQ:' + marker + ']')
              failed = True

      facts = json.loads(Path('/run/dq/locking-identities.json').read_text())
      current = json.loads(subprocess.run(['tofu', 'state', 'pull'], check=True, capture_output=True, text=True, timeout=30).stdout)
      records = [r for r in current.get('resources', []) if r.get('mode') == 'managed']
      def ids(kind):
          return [i.get('attributes', {}).get('id') for r in records if r.get('type') == kind for i in r.get('instances', [])]
      require(facts['container_id'] in ids('docker_container'), 'locking_binding')
      require(facts['progress_id'] in ids('terraform_data'), 'locking_progress')
      require(current.get('lineage') == facts['lineage'] and type(current.get('serial')) is int and current['serial'] >= facts['serial'], 'locking_lineage')
      physical = json.loads(subprocess.run(['docker', 'inspect', facts['container_id']], check=True, capture_output=True, text=True, timeout=10).stdout)[0]
      require(physical.get('Id') == facts['container_id'] and physical.get('State', {}).get('Running') is True and physical['State'].get('Health', {}).get('Status') == 'healthy', 'locking_binding')
      checkpoint = Path('errored.tfstate')
      require(checkpoint.is_file() and hashlib.sha256(checkpoint.read_bytes()).hexdigest() == facts['checkpoint_sha256'], 'locking_checkpoint')
      try:
          backup = json.loads(Path('before-recovery.tfstate').read_text())
          require(hashlib.sha256(json.dumps(backup, sort_keys=True, separators=(',', ':')).encode()).hexdigest() == facts['backup_sha256'], 'locking_backup')
      except (ValueError, OSError):
          require(False, 'locking_backup')
      with urllib.request.urlopen('http://127.0.0.1:18787/owner', timeout=3) as response:
          owner = json.load(response)
      require(owner.get('completed') is True and owner.get('running') is False, 'locking_owner')
      # Retain the original fresh detailed-plan predicate, including its marker.
      result = subprocess.run(['tofu', 'plan', '-input=false', '-detailed-exitcode', '-no-color'], capture_output=True, text=True, timeout=60)
      require(result.returncode == 0, 'condition_2')
      sys.exit(int(failed))
      DQ_PROPERTY
      ) >"$dq_probe_output" 2>/dev/null
      dq_probe_status=$?
      set -e
      cat "$dq_probe_output"
      if [ "$dq_probe_status" -ne 0 ] && ! grep -Eq '\[DQ:[a-z0-9_]+\]' "$dq_probe_output"; then
        printf '%s\n' 'Current inputs could not verify this objective: ✗ [DQ:probe_0_2]'
      fi
      rm -f "$dq_probe_output"
      trap - EXIT
      test "$dq_probe_status" -eq 0
