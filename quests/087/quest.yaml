id: 87
title: title
track: OpenTofu
difficulty: expert
brief: brief
stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    check: |-
      failed=0
      if ! test "$(cat notice.txt 2>/dev/null)" = north-ready; then
        printf '%s\n' 'notice.txt = north-ready: ✗ [DQ:condition_0]'
        failed=1
      fi
      exit "$failed"
  - text: stages.0.objectives.1.text
    check: |-
      failed=0
      if ! tofu state list 2>/dev/null | grep -Fx local_file.notice >/dev/null; then
        printf '%s\n' 'tofu state list ∋ local_file.notice: ✗ [DQ:condition_1]'
        failed=1
      fi
      exit "$failed"
  - text: stages.0.objectives.2.text
    check: |-
      failed=0
      if ! tofu plan -input=false -detailed-exitcode -no-color >/dev/null 2>&1; then
        printf '%s\n' 'tofu plan -input=false -detailed-exitcode -no-color → 0: ✗ [DQ:condition_2]'
        failed=1
      fi
      exit "$failed"
hints:
