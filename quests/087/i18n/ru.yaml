title: Владение state и восстановление после конкурирующих записей
brief: |-
  После пересекающихся операций со state планирование инфраструктуры заблокировано. Восстановите сходимость, сохранив завершённую работу.

  Работайте в `~/quest` на рабочей станции с `main.tf`, `incident.txt`, `failed-apply.log` и `errored.tfstate`.

  **Требования:**
  - На рабочей станции `~/quest/notice.txt` содержит `north-ready` и остаётся управляемым в корневом state.
  - State сохраняет завершённую запись обслуживания и отслеживает исходный здоровый Docker-контейнер без пересоздания обеих идентичностей.
  - Сохраните исходный `~/quest/errored.tfstate` без изменений. В `~/quest/before-recovery.tfstate` сохраните снимок backend до записей восстановления, с исходной lineage и завершённой работой.
  - Зарегистрированная консоль обслуживания завершается штатно и освобождает собственную блокировку.
  - Восстановленный backend сохраняет исходную lineage и serial не ниже предоставленного; свежий подробный план завершается с кодом `0`.

  **Контракт сервиса отсека:**
  - В `main.tf` указан локальный HTTP backend рабочей станции. GET читает state; POST записывает его с native ID блокировки в query, LOCK/UNLOCK обмениваются native сведениями о блокировке. Конфликт блокировок возвращает `423`, несовпадающий unlock — `409`. Удаление state недоступно.
  - `GET http://127.0.0.1:18787/diagnostic` показывает текущую блокировку и события backend. Старые логи описывают свою операцию, которая может не совпадать с текущим владельцем.
  - `GET http://127.0.0.1:18787/owner` показывает `handle`, `running`, `eof_requested`, `completed` зарегистрированной консоли и итоговые native `exit`/`stderr`, когда они доступны.
  - `POST http://127.0.0.1:18787/owner/finish` принимает только JSON-объект со строковым полем `handle`, не более 16384 байт, для зарегистрированного handle. Он запрашивает EOF stdin исходной консоли, затем ждёт её фактического завершения и native освобождения блокировки; переданные команды или PID не выполняются. Код `202` подтверждает запрос; `400` отклоняет некорректные данные, `409` — неизвестный handle. Повтор того же запроса разрешён.
  - Для `completed` нужны запрошенный EOF, фактический код завершения ноль, отсутствие native stderr и успешный unlock зарегистрированного владельца. Это не подтверждает другую операцию.

  Доверенный сервис фиксирует EOF, фактическое завершение зарегистрированного дочернего процесса и его native unlock; остальные проверки наблюдают текущие файлы, state и идентичность Docker, а не общую историю команд.
stages.0.brief: Восстановите согласованный state и штатное владение, сохранив обе завершённые идентичности.
hints.0.text: Владение блокировкой и ресурсом может разойтись. Снимок восстановления может быть внутренне корректным,
  но не содержать более позднюю завершённую операцию.
hints.1.text: |-
  Сопоставьте `cat incident.txt failed-apply.log`, `tofu state pull`, `cat errored.tfstate`, `docker ps -a` и текущие наблюдения сервиса. Отдельно сравните lineage, serial, ID ресурсов и владельца блокировки; старая ошибка не описывает текущего владельца.

  Найдите зарегистрированного владельца в контракте backend и сравните его состояние с прежней ошибкой apply. В отдельных снимках найдите недостающую исходную привязку и более новый ресурс, который уже записан.

  ```sh
  curl -fsS http://127.0.0.1:18787/diagnostic | jq .lock
  curl -fsS http://127.0.0.1:18787/owner | jq '{registered,handle,running,eof_requested,completed}'
  sha256sum errored.tfstate
  ```
hints.2.text: |-
  Проверьте оба исходных ID, неизменность аварийного снимка, `completed: true` и код `0` у `tofu plan -input=false -detailed-exitcode -no-color`.

  Сверьте lineage, serial и ID завершённых операций в копии с исходным снимком backend. Сравните ID и lineage восстановленного состояния с исходными записями. Контрольная сумма ошибочного состояния должна совпасть с исходной. Файл должен содержать `north-ready`, а ответ владельца — `true`.

  ```sh
  (
    set -euo pipefail
    ref=/run/dq/locking-identities.json
    curl -fsS http://127.0.0.1:18787/owner | jq -e '.completed == true and .running == false'
    test "$(sha256sum errored.tfstate | cut -d ' ' -f1)" = "$(jq -er .checkpoint_sha256 "$ref")"
    python3 -I - <<'VERIFY_BACKUP'
  import hashlib, json
  from pathlib import Path
  reference = json.loads(Path('/run/dq/locking-identities.json').read_text())
  backup = json.loads(Path('before-recovery.tfstate').read_text())
  canonical = json.dumps(backup, sort_keys=True, separators=(',', ':')).encode()
  assert hashlib.sha256(canonical).hexdigest() == reference['backup_sha256']
  VERIFY_BACKUP
    tofu state pull | jq -e --slurpfile ref "$ref" '
      def ids($type): [.resources[] | select(.mode=="managed" and .type==$type) | .instances[].attributes.id];
      $ref[0] as $want | .lineage==$want.lineage and .serial >= $want.serial
      and (ids("docker_container") | index($want.container_id) != null)
      and (ids("terraform_data") | index($want.progress_id) != null)'
    container=$(jq -er .container_id "$ref")
    docker inspect "$container" | jq -e --arg id "$container" '
      .[0] | .Id==$id and .State.Running==true and .State.Health.Status=="healthy"'
    cat notice.txt
    tofu plan -input=false -detailed-exitcode -no-color
  )
  ```
debrief: Передача блокировки позволила двум клиентам разойтись. Восстановление сохранило более новый завершённый
  state и исходный физический ресурс, а настоящий текущий владелец сам освободил блокировку.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я сравнил ID живого ресурса с state OpenTofu.
stages.0.objectives.0.text: На workstation `notice.txt` содержит `north-ready`.
stages.0.objectives.1.text: Настроенный файл сообщения остаётся учтённым в state OpenTofu.
stages.0.objectives.2.text: Сходимость state сохраняет обе завершённые идентичности, свидетельства восстановления
  и штатное завершение зарегистрированного владельца.
diagnostics.condition_0: Notice может отсутствовать или сохранять ручную правку после восстановления state; реальный файл рабочей станции содержит north-ready, с удалением завершающих переводов строк при shell-сравнении. [Причина и проверка](guides#guide=terraform-4&section=state-handover-notice-content)
diagnostics.condition_1: Notice может существовать лишь на диске после перезаписи state, либо state не читается; сохраните управляемый local_file для notice.txt, поскольку содержимое файла не доказывает восстановление state. [Причина и проверка](guides#guide=terraform-4&section=state-handover-managed-notice-state)
diagnostics.probe_0_1: Наблюдение файла в state может оборваться при загрузке Python helpers до именованного результата; проверьте dq_check. Обычное отсутствие управляемого файла или нечитаемый state обычно дают condition_1. [Причина и проверка](guides#guide=terraform-4&section=state-handover-notice-observer-startup)
diagnostics.locking_binding: Неудачный apply создал здоровый контейнер, но не сохранил привязку в обновлённый backend; объедините недостающую привязку без пересоздания контейнера. Исходный ID присутствует в state и по-прежнему указывает на running/healthy контейнер. [Причина и проверка](guides#guide=terraform-4&section=state-handover-original-container-binding)
diagnostics.locking_progress: Публикация целого старого errored state может удалить более новую maintenance-запись; объединяйте недостающую привязку с текущим снимком backend, сохраняя исходную идентичность выполненного terraform_data. [Причина и проверка](guides#guide=terraform-4&section=state-handover-completed-maintenance)
diagnostics.locking_lineage: Замещённый или старый state мог изменить lineage либо откатить serial; восстановленный backend сохраняет исходный lineage и целочисленный serial не ниже записанного снимка backend. [Причина и проверка](guides#guide=terraform-4&section=state-handover-backend-lineage-and-serial)
diagnostics.locking_checkpoint: errored.tfstate мог быть перезаписан, изменён или удалён при объединении; сохраните исходные байты и работайте с копиями. Проверка сравнивает хэш всего файла с зафиксированной квитанцией checkpoint. [Причина и проверка](guides#guide=terraform-4&section=state-handover-original-checkpoint-bytes)
diagnostics.locking_backup: before-recovery.tfstate может отсутствовать, содержать старый checkpoint либо уже изменённый state; сохраните backend с более новым выполненным изменением до записей восстановления. JSON-содержимое совпадает с записанным снимком, форматирование пробелами может отличаться. [Причина и проверка](guides#guide=terraform-4&section=state-handover-before-recovery-snapshot)
diagnostics.locking_owner: Текущая зарегистрированная консоль может удерживать собственный lock; старый ID из incident или принудительный unlock не доказывают штатное завершение. Запросите EOF через документированный handle-интерфейс и дождитесь completed=true и running=false; HTTP 202 лишь принимает запрос. [Причина и проверка](guides#guide=terraform-4&section=state-handover-registered-console-completion)
diagnostics.condition_2: Текущий владелец может блокировать plan, либо восстановление оставило недостающие привязки или изменения; завершите зарегистрированную операцию и согласуйте state до кода нового detailed plan 0. Код 2 означает изменения, код 1 — ошибку. [Причина и проверка](guides#guide=terraform-4&section=state-handover-fresh-convergence-plan)
diagnostics.probe_0_2: Зафиксированные факты, чтение state, Docker inspect, доступ к owner или plan могут оборваться без именованного результата, либо Python helpers не загрузиться. Изучите эти пути наблюдения отдельно; ранние именованные ошибки привязки, checkpoint, backup или owner сохраняют собственные маркеры. [Причина и проверка](guides#guide=terraform-4&section=state-handover-recovery-observation)
