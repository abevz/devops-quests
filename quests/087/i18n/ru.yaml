title: Блокировка state
brief: 'Работайте в `~/quest`; изучите `main.tf`, `hold-state.py`, `lock-holder.pid` и `lock-probe.log`. Локальный процесс обслуживания удерживает блокировку состояния. Руководство объясняет, почему блокировка защищает состояние. Остановите процесс, указанный в `lock-holder.pid`; не удаляйте состояние и не снимайте принудительно чужую блокировку. Используйте только офлайн-песочницу.


  Проверьте, что `notice.txt` содержит `north-ready`, `tofu state list` содержит `local_file.notice`, а `tofu plan -input=false -detailed-exitcode -no-color` завершается с кодом 0 (изменений нет). Проверка наблюдает файл, состояние и план; она напрямую не доказывает, какой процесс остановлен и применялось ли принудительное снятие блокировки.'
stages.0.brief: Файл объявления, адрес состояния и план без изменений соответствуют заданию.
stages.0.objectives.0.text: Файл объявления, адрес состояния и план без изменений соответствуют заданию.
hints.0.text: Проверьте lock-probe.log и PID локального держателя.
hints.1.text: 'State должен сохраниться: удаление файла не освобождает исходную блокировку безопасно.'
hints.2.text: Остановите процесс из lock-holder.pid, сохраните state и проверьте успешный пустой plan.
debrief: Файл объявления и адрес состояния присутствуют, а план завершается без изменений.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я сравнил ID живого ресурса с state OpenTofu.
