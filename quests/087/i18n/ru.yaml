title: Блокировка state
brief: |-
  Обычные операции OpenTofu не завершаются.

  Работайте на workstation в `~/quest` с файлами `main.tf`, `lock-probe.log`.

  **Требования:**
  - Файлы на workstation:
    - `~/quest/notice.txt`: `north-ready`.
  - Состояние OpenTofu:
    - Настроенный файл сообщения остаётся учтённым в state OpenTofu.
  - Согласованность инфраструктуры:
    - Нет ожидающих изменений инфраструктуры; код завершения подробного плана `0`.

  Проверка наблюдает текущий файл, state и результат планирования; она не устанавливает историю или способ снятия блокировки.
stages.0.brief: Обычное планирование инфраструктуры должно завершаться при доступном уведомлении.
hints.0.text: Блокировка state координирует параллельных писателей и защищает выполняемые операции со
  state.
hints.1.text: |-
  Проверьте lock-probe.log и PID локального держателя. State должен сохраниться: удаление файла не освобождает исходную блокировку безопасно. Проверка наблюдает файл, состояние и план; она напрямую не доказывает, какой процесс остановлен и использовался ли force-unlock.

  Изучите предоставленную конфигурацию и текущие наблюдения на workstation:

  ```sh
  cat lock-probe.log
  tofu state list
  ```
hints.2.text: |-
  Остановите процесс из lock-holder.pid и сохраните состояние. Блокировкой владеет процесс обслуживания; force-unlock не заменяет остановку этого живого процесса.

  Проверьте результат из `~/quest` на workstation:

  - `cat notice.txt; tofu show -no-color` — Показывает `north-ready` и отслеживаемый ресурс `local_file.notice`.
  - `tofu plan -input=false -detailed-exitcode -no-color` — Завершается с кодом `0` и не сообщает об ожидающих изменениях инфраструктуры.
debrief: Файл объявления и адрес состояния присутствуют, а план завершается без изменений.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я сравнил ID живого ресурса с state OpenTofu.
diagnostics.condition_0: notice.txt должен совпадать с north-ready.
diagnostics.condition_1: tofu state list должен содержать local_file.notice.
diagnostics.condition_2: План OpenTofu с detailed-exitcode должен завершиться с кодом 0.
stages.0.objectives.0.text: На workstation `notice.txt` содержит `north-ready`.
stages.0.objectives.1.text: Настроенный файл сообщения остаётся учтённым в state OpenTofu.
stages.0.objectives.2.text: OpenTofu не сообщает об ожидающих изменениях инфраструктуры.
