title: Блокировка state
brief: 'Вы в команде эксплуатации SignalRail. Найдите процесс, удерживающий state lock. Работайте в ~/quest.
  Все изменения — только в этой песочнице.


  Входные файлы в `~/quest`: `main.tf`, `hold-state.py`.


  В песочнице нет интернета и внешнего DNS. Используйте только выданные файлы, предварительно загруженные
  образы и приватные сервисы. Все изменения — только в этой песочнице.


  Цели первого этапа: Процесс остановлен, state исправен.'
stages.0.brief: 'Локальный процесс удерживает state lock. Остановите его, сохраните state. Не используйте
  force-unlock чужого состояния.


  Результат проверки: Процесс остановлен, state исправен.'
stages.0.objectives.0.text: Процесс остановлен, state исправен.
hints.0.text: Проверьте lock-probe.log и PID локального держателя.
hints.1.text: 'State должен сохраниться: удаление файла не освобождает исходную блокировку безопасно.'
hints.2.text: Остановите процесс из lock-holder.pid, сохраните state и проверьте успешный пустой plan.
debrief: Локальный процесс удерживал state lock. Вы остановили держателя, сохранили state и проверили
  планирование.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я сравнил ID живого ресурса с state OpenTofu.
