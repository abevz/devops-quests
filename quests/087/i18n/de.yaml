title: Zustandssperre
brief: |-
  Normale OpenTofu-Vorgänge können nicht abgeschlossen werden.

  Arbeite auf der Workstation in `~/quest` mit `main.tf`, `lock-probe.log`.

  **Anforderungen:**
  - Dateien auf der Workstation:
    - `~/quest/notice.txt`: `north-ready`.
  - OpenTofu-State:
    - Die konfigurierte Hinweisdatei bleibt im OpenTofu-State verwaltet.
  - Infrastrukturkonvergenz:
    - Keine ausstehenden Infrastrukturänderungen; Exit-Code des detaillierten Plans `0`.

  Die Prüfung beobachtet die aktuelle Datei, den State und das Planungsergebnis; sie belegt weder Verlauf noch Methode der Entsperrung.
stages.0.brief: Die normale Infrastrukturplanung muss bei verfügbarer Nachricht abgeschlossen werden.
hints.0.text: State-Locking koordiniert gleichzeitige Schreiber und schützt laufende State-Operationen.
hints.1.text: |-
  Überprüfen Sie lock-probe.log und den örtlichen Halter PID. Die Statusdatei muss intakt bleiben; Durch das Löschen wird die ursprüngliche Sperre nicht sicher freigegeben. Die Prüfung beobachtet Datei, State und Plan; sie beweist nicht direkt, welcher Prozess gestoppt oder ob force-unlock verwendet wurde.

  Prüfen Sie die bereitgestellte Konfiguration und aktuelle Beobachtungen auf der Workstation:

  ```sh
  cat lock-probe.log
  tofu state list
  ```
hints.2.text: |-
  Stoppe den in lock-holder.pid erfassten Prozess und erhalte den State. Der Wartungsprozess hält die Sperre; force-unlock ersetzt nicht das Stoppen dieses laufenden Prozesses.

  Prüfen Sie das Ergebnis in `~/quest` auf der Workstation:

  - `cat notice.txt; tofu show -no-color` — Zeigt `north-ready` und die verwaltete Ressource `notice.txt`.
  - `tofu plan -input=false -detailed-exitcode -no-color` — Endet mit `0` und meldet keine ausstehenden Infrastrukturänderungen.

  Der State erfasst weiterhin die konfigurierte Datei notice.txt.
debrief: Hinweisdatei und Zustandsadresse sind vorhanden, und der Plan endet ohne Änderungen.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe die Live-Ressource ID mit dem Status OpenTofu verglichen.
diagnostics.condition_0: notice.txt muss north-ready entsprechen.
diagnostics.condition_1: |-
  Der OpenTofu-State muss die verwaltete Quelldatei notice.txt erfassen.

diagnostics.condition_2: Der OpenTofu-Plan mit detailed-exitcode muss mit Code 0 enden.
stages.0.objectives.0.text: 'Auf der Workstation: `notice.txt` enthält `north-ready`.'
stages.0.objectives.1.text: Die konfigurierte Hinweisdatei bleibt im OpenTofu-State verwaltet.
stages.0.objectives.2.text: OpenTofu meldet keine ausstehenden Infrastrukturänderungen.
