title: Zustandssperre
brief: 'Sie sind dem Betrieb SignalRail beigetreten. Suchen Sie den Inhaber lock, ohne den Status zu löschen.
  Arbeiten Sie in ~/quest.. Bewahren Sie alle Änderungen in diesem Trainingsbereich auf.


  Eingänge in `~/quest`: `main.tf`, `hold-state.py`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur die bereitgestellten Dateien,
  vorinstallierten Bilder und privaten Dienste. Alle Änderungen müssen innerhalb dieser Bucht bleiben.


  Anfängliche Erfolgskriterien: Der lock-Inhaber wurde gestoppt und der Status ist immer noch gültig.'
stages.0.brief: 'Ein lokaler Wartungsprozess hält den Zustand lock. Stoppen Sie diesen Prozess, behalten
  Sie den Status bei und führen Sie bei keinem anderen Benutzer force-unlock aus.


  Erfolgskriterium: Der lock-Inhaber wurde gestoppt und der Status ist immer noch gültig.'
stages.0.objectives.0.text: Der Sperrhalter wurde gestoppt und der Status ist immer noch gültig.
hints.0.text: Überprüfen Sie lock-probe.log und den örtlichen Halter PID.
hints.1.text: Die Statusdatei muss intakt bleiben; Durch das Löschen wird die ursprüngliche Sperre nicht
  sicher freigegeben.
hints.2.text: Stoppen Sie den Prozess in lock-holder.pid, behalten Sie den Status bei und überprüfen Sie,
  ob plan erfolgreich geleert wurde.
debrief: Ein lokaler Wartungsprozess hatte den Status lock. Sie haben den Halter gestoppt, den Zustand
  erhalten und überprüft, ob die Planung wieder funktioniert hat.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe die Live-Ressource ID mit dem Status OpenTofu verglichen.
