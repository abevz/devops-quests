title: Zustandssperre
brief: 'Arbeite in `~/quest`; lies `main.tf`, `hold-state.py`, `lock-holder.pid` und `lock-probe.log`. Ein lokaler Wartungsprozess
  hält die Zustandssperre. Die verlinkte Anleitung erklärt, warum die Sperre den Zustand schützt. Stoppe den in `lock-holder.pid`
  angegebenen Prozess; lösche keinen Zustand und erzwinge nicht das Entsperren eines anderen Benutzers. Nutze nur die Offline-Umgebung.


  Prüfe, dass `notice.txt` `north-ready` enthält, `tofu state list` `local_file.notice` enthält und `tofu plan -input=false
  -detailed-exitcode -no-color` mit Code 0 endet (keine Änderungen). Die Prüfung beobachtet Datei, Zustand und Plan; sie belegt
  nicht direkt, welcher Prozess gestoppt oder ob ein Entsperren erzwungen wurde.'
stages.0.brief: Hinweisdatei, Zustandsadresse und Plan ohne Änderungen stimmen mit der Aufgabe überein.
stages.0.objectives.0.text: Hinweisdatei, Zustandsadresse und Plan ohne Änderungen stimmen mit der Aufgabe überein.
hints.0.text: Überprüfen Sie lock-probe.log und den örtlichen Halter PID.
hints.1.text: Die Statusdatei muss intakt bleiben; Durch das Löschen wird die ursprüngliche Sperre nicht sicher freigegeben.
hints.2.text: Stoppen Sie den Prozess in lock-holder.pid, behalten Sie den Status bei und überprüfen Sie, ob plan erfolgreich
  geleert wurde.
debrief: Hinweisdatei und Zustandsadresse sind vorhanden, und der Plan endet ohne Änderungen.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe die Live-Ressource ID mit dem Status OpenTofu verglichen.
diagnostics.condition_0: notice.txt muss north-ready entsprechen.
diagnostics.condition_1: tofu state list muss local_file.notice enthalten.
diagnostics.condition_2: Der OpenTofu-Plan mit detailed-exitcode muss mit Code 0 enden.
