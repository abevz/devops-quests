title: State-Eigentümerschaft und konkurrierende Wiederherstellung
brief: |-
  Nach überlappenden State-Operationen ist die Infrastrukturplanung blockiert. Stelle die Konvergenz wieder her und erhalte abgeschlossene Arbeit.

  Arbeite in `~/quest` auf der Workstation mit `main.tf`, `incident.txt`, `failed-apply.log` und `errored.tfstate`.

  **Anforderungen:**
  - Auf der Workstation enthält `~/quest/notice.txt` den Wert `north-ready` und bleibt im Root-State verwaltet.
  - Der State behält den abgeschlossenen Wartungseintrag und verwaltet den ursprünglichen gesunden Docker-Container, ohne eine der beiden Identitäten neu zu erzeugen.
  - Behalte das ursprüngliche `~/quest/errored.tfstate` unverändert. Sichere den Backend-Snapshot vor Wiederherstellungsschreibvorgängen samt ursprünglicher Lineage und abgeschlossener Arbeit in `~/quest/before-recovery.tfstate`.
  - Die registrierte Wartungskonsole beendet sich regulär und gibt ihre eigene Sperre frei.
  - Das wiederhergestellte Backend behält seine ursprüngliche Lineage und mindestens die bereitgestellte Serial; ein neuer detaillierter Plan endet mit Code `0`.

  **Dienstvertrag der Bay:**
  - `main.tf` benennt ein Workstation-lokales HTTP-Backend. GET liest den State; POST schreibt mit der nativen Sperr-ID im Query, LOCK/UNLOCK tauschen native Sperrinformationen aus. Sperrkonflikte liefern `423`, ein nicht passendes Unlock `409`. Das Löschen des State ist nicht verfügbar.
  - `GET http://127.0.0.1:18787/diagnostic` zeigt die aktuelle Sperre und Backend-Ereignisse. Frühere Logs beschreiben ihre eigene Operation, nicht zwingend den aktuellen Eigentümer.
  - `GET http://127.0.0.1:18787/owner` zeigt `handle`, `running`, `eof_requested`, `completed` der registrierten Konsole sowie abschließend native `exit`/`stderr`, sobald verfügbar.
  - `POST http://127.0.0.1:18787/owner/finish` akzeptiert nur ein JSON-Objekt mit dem String-Feld `handle`, höchstens 16384 Byte, für das registrierte Handle. Es fordert stdin-EOF für diese ursprüngliche Konsole an und wartet auf deren tatsächliches Ende und native Sperrfreigabe; übergebene Befehle oder PIDs werden nicht ausgeführt. `202` bestätigt die Anfrage; `400` verwirft ungültige Eingaben und `409` ein unbekanntes Handle. Dieselbe Anfrage darf wiederholt werden.
  - `completed` erfordert angefordertes EOF, tatsächlichen Exit null, kein natives stderr und erfolgreiches Unlock durch den registrierten Eigentümer. Eine andere Operation wird damit nicht bestätigt.

  Der vertrauenswürdige Dienst erfasst EOF, das tatsächliche Ende des registrierten Kindprozesses und dessen natives Unlock; andere Prüfungen beobachten aktuelle Dateien, State und Docker-Identität, keinen allgemeinen Befehlsverlauf.
stages.0.brief: Stelle konsistenten State und reguläre Eigentümerschaft wieder her; erhalte beide abgeschlossenen
  Identitäten.
hints.0.text: Sperr- und Ressourceneigentümerschaft können auseinanderlaufen. Ein Wiederherstellungs-Snapshot kann
  intern gültig sein und dennoch eine später abgeschlossene Operation auslassen.
hints.1.text: |-
  Vergleiche `cat incident.txt failed-apply.log`, `tofu state pull`, `cat errored.tfstate`, `docker ps -a` und die aktuellen Dienstbeobachtungen. Vergleiche Lineage, Serial, Ressourcen-IDs und Sperreigentümer getrennt; ein früherer Fehler beschreibt nicht den aktuellen Eigentümer.

  Suche den registrierten Besitzer im Backend-Vertrag und vergleiche seinen Status mit dem alten Apply-Fehler. Ermittle in getrennten Snapshots die fehlende ursprüngliche Bindung und die bereits erfasste neuere Ressource.

  ```sh
  curl -fsS http://127.0.0.1:18787/diagnostic | jq .lock
  curl -fsS http://127.0.0.1:18787/owner | jq '{registered,handle,running,eof_requested,completed}'
  sha256sum errored.tfstate
  ```
hints.2.text: |-
  Prüfe beide ursprünglichen IDs, unveränderte Wiederherstellungsdaten, `completed: true` und Exit `0` von `tofu plan -input=false -detailed-exitcode -no-color`.

  Vergleiche Lineage, Serial und abgeschlossene IDs der Sicherung mit dem anfänglichen Backend-Snapshot. Vergleiche wiederhergestellte IDs und Lineage mit den Originalaufzeichnungen. Die Prüfsumme des Fehlerzustands muss mit der Anfangsbeobachtung übereinstimmen. Die Datei muss `north-ready` enthalten und der Besitzer-Endpunkt `true` melden.

  ```sh
  (
    set -euo pipefail
    ref=/run/dq/locking-identities.json
    curl -fsS http://127.0.0.1:18787/owner | jq -e '.completed == true and .running == false'
    test "$(sha256sum errored.tfstate | cut -d ' ' -f1)" = "$(jq -er .checkpoint_sha256 "$ref")"
    python3 -I - <<'VERIFY_BACKUP'
  import hashlib, json
  from pathlib import Path
  reference = json.loads(Path('/run/dq/locking-identities.json').read_text())
  backup = json.loads(Path('before-recovery.tfstate').read_text())
  canonical = json.dumps(backup, sort_keys=True, separators=(',', ':')).encode()
  assert hashlib.sha256(canonical).hexdigest() == reference['backup_sha256']
  VERIFY_BACKUP
    tofu state pull | jq -e --slurpfile ref "$ref" '
      def ids($type): [.resources[] | select(.mode=="managed" and .type==$type) | .instances[].attributes.id];
      $ref[0] as $want | .lineage==$want.lineage and .serial >= $want.serial
      and (ids("docker_container") | index($want.container_id) != null)
      and (ids("terraform_data") | index($want.progress_id) != null)'
    container=$(jq -er .container_id "$ref")
    docker inspect "$container" | jq -e --arg id "$container" '
      .[0] | .Id==$id and .State.Running==true and .State.Health.Status=="healthy"'
    cat notice.txt
    tofu plan -input=false -detailed-exitcode -no-color
  )
  ```
debrief: Eine Sperrübergabe ließ zwei Clients auseinanderlaufen. Die Wiederherstellung erhielt den neueren abgeschlossenen
  State und die ursprüngliche physische Ressource; der echte aktuelle Eigentümer gab seine eigene Sperre frei.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe die Live-Ressource ID mit dem Status OpenTofu verglichen.
stages.0.objectives.0.text: 'Auf der Workstation: `notice.txt` enthält `north-ready`.'
stages.0.objectives.1.text: Die konfigurierte Hinweisdatei bleibt im OpenTofu-State verwaltet.
stages.0.objectives.2.text: Die State-Konvergenz erhält beide abgeschlossenen Identitäten, Wiederherstellungsdaten
  und das reguläre Ende des registrierten Eigentümers.
diagnostics.condition_0: Die Notice fehlt möglicherweise oder enthält nach der Zustandswiederherstellung eine manuelle Änderung; die tatsächliche Workstation-Datei muss north-ready enthalten, mit durch den Shell-Vergleich entfernten abschließenden Zeilenumbrüchen. [Ursache und Prüfung](guides#guide=terraform-4&section=state-handover-notice-content)
diagnostics.condition_1: Die Notice existiert nach überschriebenem Zustand möglicherweise nur auf der Platte oder der Zustandsabruf scheitert; erhalten Sie eine verwaltete local_file Ressource für notice.txt, da Dateiinhalte keine Zustandswiederherstellung belegen. [Ursache und Prüfung](guides#guide=terraform-4&section=state-handover-managed-notice-state)
diagnostics.probe_0_1: Die Dateizustandsbeobachtung endet möglicherweise beim Laden von Python helpers vor einem benannten Ergebnis; prüfen Sie dq_check. Eine gewöhnlich fehlende verwaltete Datei oder unlesbarer Zustand meldet normalerweise condition_1. [Ursache und Prüfung](guides#guide=terraform-4&section=state-handover-notice-observer-startup)
diagnostics.locking_binding: Der fehlgeschlagene Apply hat den gesunden Container erstellt, konnte seine Bindung aber nicht im neueren Backend speichern; führen Sie die fehlende Bindung zusammen, ohne den Container neu zu erstellen. Seine ursprüngliche ID muss im Zustand stehen und weiterhin einen laufenden gesunden Container identifizieren. [Ursache und Prüfung](guides#guide=terraform-4&section=state-handover-original-container-binding)
diagnostics.locking_progress: Das vollständige ältere Errored-State zu übertragen kann den neueren Wartungsdatensatz verwerfen; führen Sie die fehlende Bindung mit dem aktuellen Backend-Snapshot zusammen und erhalten Sie die ursprüngliche abgeschlossene terraform_data Identität. [Ursache und Prüfung](guides#guide=terraform-4&section=state-handover-completed-maintenance)
diagnostics.locking_lineage: Ein Ersatz- oder älterer Zustand hat möglicherweise die Lineage verändert oder die Serial zurückgesetzt; das wiederhergestellte Backend muss seine ursprüngliche Lineage und eine ganzzahlige Serial mindestens auf Stand des aufgezeichneten Backend-Snapshots erhalten. [Ursache und Prüfung](guides#guide=terraform-4&section=state-handover-backend-lineage-and-serial)
diagnostics.locking_checkpoint: errored.tfstate wurde möglicherweise beim Zusammenführen überschrieben, bearbeitet oder entfernt; erhalten Sie seine ursprünglichen Bytes und arbeiten Sie mit Kopien. Die Prüfung vergleicht den vollständigen Datei-Hash mit dem eingefrorenen Checkpoint-Beleg. [Ursache und Prüfung](guides#guide=terraform-4&section=state-handover-original-checkpoint-bytes)
diagnostics.locking_backup: before-recovery.tfstate fehlt möglicherweise oder enthält den älteren Checkpoint beziehungsweise bereits veränderten Zustand; erhalten Sie den Backend-Snapshot mit der neueren abgeschlossenen Arbeit vor Wiederherstellungsschreibzugriffen. Sein JSON-Inhalt muss dem aufgezeichneten Snapshot entsprechen; Leerraumformatierung darf abweichen. [Ursache und Prüfung](guides#guide=terraform-4&section=state-handover-before-recovery-snapshot)
diagnostics.locking_owner: Die aktuell registrierte Konsole hält möglicherweise noch ihren eigenen Lock; eine alte Incident-Lock-ID oder erzwungenes Unlock belegt keinen normalen Abschluss. Fordern Sie EOF über die dokumentierte Handle-Schnittstelle an und warten Sie auf completed=true und running=false; HTTP 202 bestätigt nur die Anfrage. [Ursache und Prüfung](guides#guide=terraform-4&section=state-handover-registered-console-completion)
diagnostics.condition_2: Der aktuelle Eigentümer blockiert möglicherweise die Planung oder die Wiederherstellung lässt fehlende Bindungen beziehungsweise Änderungen zurück; beenden Sie die registrierte Operation und gleichen Sie den Zustand ab, bis ein frischer detaillierter Plan 0 liefert. Exit 2 bedeutet vorgeschlagene Änderungen, Exit 1 Fehler. [Ursache und Prüfung](guides#guide=terraform-4&section=state-handover-fresh-convergence-plan)
diagnostics.probe_0_2: Eingefrorene Fakten, Zustandsabruf, Docker-Inspektion, Eigentümerzugriff oder Planung brechen möglicherweise ohne benanntes Ergebnis ab, oder Python helpers laden nicht. Prüfen Sie diese Beobachtungspfade separat; frühere benannte Bindungs-, Checkpoint-, Backup- oder Eigentümerfehler behalten eigene Marker. [Ursache und Prüfung](guides#guide=terraform-4&section=state-handover-recovery-observation)
