title: Własność stanu i odzyskiwanie po współbieżnych zapisach
brief: |-
  Planowanie infrastruktury jest zablokowane po nakładających się operacjach stanu. Przywróć zbieżność, zachowując ukończoną pracę.

  Pracuj w `~/quest` na stacji roboczej z `main.tf`, `incident.txt`, `failed-apply.log` i `errored.tfstate`.

  **Wymagania:**
  - Na stacji roboczej `~/quest/notice.txt` zawiera `north-ready` i pozostaje zarządzany w głównym stanie.
  - Stan zachowuje ukończony rekord konserwacji i zarządza pierwotnym zdrowym kontenerem Docker bez odtwarzania żadnej z dwóch tożsamości.
  - Zachowaj pierwotny `~/quest/errored.tfstate` bez zmian. W `~/quest/before-recovery.tfstate` zachowaj migawkę backendu sprzed zapisów odzyskiwania, z pierwotną lineage i ukończoną pracą.
  - Zarejestrowana konsola konserwacji kończy pracę normalnie i zwalnia własną blokadę.
  - Odzyskany backend zachowuje pierwotną lineage oraz serial nie mniejszy niż dostarczony; nowy szczegółowy plan kończy się kodem `0`.

  **Kontrakt usługi zatoki:**
  - `main.tf` wskazuje lokalny backend HTTP stacji roboczej. GET odczytuje stan; POST zapisuje go z natywnym ID blokady w query, a LOCK/UNLOCK wymieniają natywne informacje o blokadzie. Konflikty zwracają `423`, niedopasowane odblokowanie `409`. Usuwanie stanu jest niedostępne.
  - `GET http://127.0.0.1:18787/diagnostic` pokazuje bieżącą blokadę i zdarzenia backendu. Wcześniejsze logi opisują własną operację, niekoniecznie obecnego właściciela.
  - `GET http://127.0.0.1:18787/owner` pokazuje `handle`, `running`, `eof_requested`, `completed` zarejestrowanej konsoli oraz końcowe natywne `exit`/`stderr`, gdy są dostępne.
  - `POST http://127.0.0.1:18787/owner/finish` przyjmuje tylko obiekt JSON z tekstowym polem `handle`, do 16384 bajtów, dla zarejestrowanego identyfikatora. Żąda EOF stdin tej pierwotnej konsoli, następnie czeka na jej rzeczywiste zakończenie i natywne zwolnienie blokady; nie wykonuje przekazanych poleceń ani PID. Kod `202` potwierdza żądanie; `400` odrzuca błędne dane, a `409` nieznany identyfikator. Powtórzenie tego samego żądania jest dozwolone.
  - `completed` wymaga żądanego EOF, faktycznego kodu zakończenia zero, braku natywnego stderr i udanego odblokowania przez zarejestrowanego właściciela. Nie potwierdza innej operacji.

  Zaufana usługa rejestruje EOF, faktyczne zakończenie zarejestrowanego procesu potomnego i jego natywne odblokowanie; pozostałe testy obserwują bieżące pliki, stan i tożsamość Docker, a nie ogólną historię poleceń.
stages.0.brief: Przywróć spójny stan i normalną własność, zachowując obie ukończone tożsamości.
hints.0.text: Własność blokady i zasobu może się rozejść. Migawka odzyskiwania może być wewnętrznie poprawna i nadal
  pomijać późniejszą ukończoną operację.
hints.1.text: |-
  Porównaj `cat incident.txt failed-apply.log`, `tofu state pull`, `cat errored.tfstate`, `docker ps -a` i bieżące obserwacje usługi. Osobno porównaj lineage, serial, ID zasobów i właściciela blokady; wcześniejszy błąd nie opisuje bieżącego właściciela.

  Odszukaj zarejestrowanego właściciela w kontrakcie backendu i porównaj jego stan ze starym błędem apply. W osobnych migawkach odszukaj brakujące pierwotne powiązanie i nowszy zasób już zapisany w stanie.

  ```sh
  curl -fsS http://127.0.0.1:18787/diagnostic | jq .lock
  curl -fsS http://127.0.0.1:18787/owner | jq '{registered,handle,running,eof_requested,completed}'
  sha256sum errored.tfstate
  ```
hints.2.text: |-
  Sprawdź oba pierwotne ID, niezmienione dowody, `completed: true` i kod `0` z `tofu plan -input=false -detailed-exitcode -no-color`.

  Porównaj lineage, serial i ID ukończonych operacji w kopii z początkową migawką backendu. Sprawdź odzyskane ID i lineage z pierwotnymi zapisami. Suma stanu z błędem musi odpowiadać początkowej. Plik musi zawierać `north-ready`, a endpoint właściciela zwrócić `true`.

  ```sh
  (
    set -euo pipefail
    ref=/run/dq/locking-identities.json
    curl -fsS http://127.0.0.1:18787/owner | jq -e '.completed == true and .running == false'
    test "$(sha256sum errored.tfstate | cut -d ' ' -f1)" = "$(jq -er .checkpoint_sha256 "$ref")"
    python3 -I - <<'VERIFY_BACKUP'
  import hashlib, json
  from pathlib import Path
  reference = json.loads(Path('/run/dq/locking-identities.json').read_text())
  backup = json.loads(Path('before-recovery.tfstate').read_text())
  canonical = json.dumps(backup, sort_keys=True, separators=(',', ':')).encode()
  assert hashlib.sha256(canonical).hexdigest() == reference['backup_sha256']
  VERIFY_BACKUP
    tofu state pull | jq -e --slurpfile ref "$ref" '
      def ids($type): [.resources[] | select(.mode=="managed" and .type==$type) | .instances[].attributes.id];
      $ref[0] as $want | .lineage==$want.lineage and .serial >= $want.serial
      and (ids("docker_container") | index($want.container_id) != null)
      and (ids("terraform_data") | index($want.progress_id) != null)'
    container=$(jq -er .container_id "$ref")
    docker inspect "$container" | jq -e --arg id "$container" '
      .[0] | .Id==$id and .State.Running==true and .State.Health.Status=="healthy"'
    cat notice.txt
    tofu plan -input=false -detailed-exitcode -no-color
  )
  ```
debrief: Przekazanie blokady spowodowało rozbieżność dwóch klientów. Odzyskiwanie zachowało nowszy ukończony stan
  i pierwotny zasób fizyczny, a rzeczywisty bieżący właściciel zwolnił własną blokadę.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Porównałem aktywny zasób ID ze stanem OpenTofu.
stages.0.objectives.0.text: Na workstation `notice.txt` zawiera `north-ready`.
stages.0.objectives.1.text: Skonfigurowany plik komunikatu pozostaje zarządzany w stanie OpenTofu.
stages.0.objectives.2.text: Zbieżność stanu zachowuje obie ukończone tożsamości, dowody odzyskiwania i normalne
  zakończenie zarejestrowanego właściciela.
diagnostics.condition_0: Notice może brakować lub zachować ręczną zmianę po odzyskaniu stanu; rzeczywisty plik stacji ma zawierać north-ready, z końcowymi znakami nowej linii usuwanymi przez porównanie shell. [Przyczyna i kontrola](guides#guide=terraform-4&section=state-handover-notice-content)
diagnostics.condition_1: Notice może istnieć tylko na dysku po nadpisaniu stanu albo odczyt stanu zawodzi; zachowaj zarządzany local_file dla notice.txt, bo treść pliku nie dowodzi odzyskania stanu. [Przyczyna i kontrola](guides#guide=terraform-4&section=state-handover-managed-notice-state)
diagnostics.probe_0_1: Obserwacja pliku w stanie może zakończyć się przy ładowaniu Python helpers przed nazwanym wynikiem; sprawdź dq_check. Zwykły brak zarządzanego pliku lub nieczytelny stan zwykle daje condition_1. [Przyczyna i kontrola](guides#guide=terraform-4&section=state-handover-notice-observer-startup)
diagnostics.locking_binding: Nieudany apply utworzył zdrowy kontener, ale nie zapisał powiązania do nowszego backend; scal brakujące powiązanie bez odtwarzania kontenera. Pierwotny ID ma istnieć w stanie i nadal wskazywać działający zdrowy kontener. [Przyczyna i kontrola](guides#guide=terraform-4&section=state-handover-original-container-binding)
diagnostics.locking_progress: Wysłanie całego starszego errored state może usunąć nowszy zapis maintenance; scal brakujące powiązanie z bieżącym snapshot backend, zachowując pierwotną tożsamość zakończonego terraform_data. [Przyczyna i kontrola](guides#guide=terraform-4&section=state-handover-completed-maintenance)
diagnostics.locking_lineage: Zastępczy lub starszy stan mógł zmienić lineage albo cofnąć serial; odzyskany backend ma zachować pierwotny lineage i całkowity serial nie mniejszy niż zapisany snapshot backend. [Przyczyna i kontrola](guides#guide=terraform-4&section=state-handover-backend-lineage-and-serial)
diagnostics.locking_checkpoint: errored.tfstate mógł zostać nadpisany, zmieniony lub usunięty przy scalaniu; zachowaj pierwotne bajty i pracuj na kopiach. Kontrola porównuje hash całego pliku z zamrożonym potwierdzeniem checkpoint. [Przyczyna i kontrola](guides#guide=terraform-4&section=state-handover-original-checkpoint-bytes)
diagnostics.locking_backup: before-recovery.tfstate może brakować albo zawierać starszy checkpoint lub już zmieniony stan; zachowaj snapshot backend z nowszą zakończoną pracą przed zapisami naprawy. Treść JSON ma odpowiadać zapisanemu snapshot, format białych znaków może się różnić. [Przyczyna i kontrola](guides#guide=terraform-4&section=state-handover-before-recovery-snapshot)
diagnostics.locking_owner: Bieżąca zarejestrowana konsola może nadal trzymać własny lock; stary ID z incident lub wymuszony unlock nie dowodzi normalnego zakończenia. Poproś o EOF przez udokumentowany interfejs handle i czekaj na completed=true oraz running=false; HTTP 202 tylko potwierdza żądanie. [Przyczyna i kontrola](guides#guide=terraform-4&section=state-handover-registered-console-completion)
diagnostics.condition_2: Bieżący właściciel może nadal blokować plan lub odzyskanie pozostawiło brakujące powiązania albo zmiany; zakończ zarejestrowaną operację i uzgodnij stan do kodu nowego detailed plan 0. Kod 2 oznacza zmiany, 1 błąd. [Przyczyna i kontrola](guides#guide=terraform-4&section=state-handover-fresh-convergence-plan)
diagnostics.probe_0_2: Zamrożone fakty, odczyt stanu, Docker inspect, dostęp owner lub plan mogą zakończyć się bez nazwanego wyniku albo Python helpers nie ładują się. Sprawdź te ścieżki obserwacji osobno; wcześniejsze nazwane błędy powiązań, checkpoint, backup lub owner zachowują swoje markery. [Przyczyna i kontrola](guides#guide=terraform-4&section=state-handover-recovery-observation)
