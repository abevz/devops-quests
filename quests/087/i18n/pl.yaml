title: Blokowanie stanu
brief: |-
  Zwykłe operacje OpenTofu nie mogą się zakończyć.

  Pracuj na workstation w `~/quest` z plikami `main.tf`, `lock-probe.log`.

  **Wymagania:**
  - Pliki na workstation:
    - `~/quest/notice.txt`: `north-ready`.
  - Stan OpenTofu:
    - Skonfigurowany plik komunikatu pozostaje zarządzany w stanie OpenTofu.
  - Zbieżność infrastruktury:
    - Brak oczekujących zmian infrastruktury; kod zakończenia szczegółowego planu `0`.

  Sprawdzenie obserwuje bieżący plik, stan i wynik planowania; nie ustala historii ani sposobu odblokowania.
stages.0.brief: Zwykłe planowanie infrastruktury musi się zakończyć przy dostępnym powiadomieniu.
hints.0.text: Blokada stanu koordynuje współbieżne zapisy i chroni trwające operacje stanu.
hints.1.text: |-
  Sprawdź lock-probe.log i lokalny uchwyt PID. Plik stanu musi pozostać nienaruszony; usunięcie go nie powoduje bezpiecznego zwolnienia oryginalnej blokady. Sprawdzenie obserwuje plik, stan i plan; nie dowodzi bezpośrednio, który proces zatrzymano ani czy użyto force-unlock.

  Sprawdź dostarczoną konfigurację i bieżące obserwacje na workstation:

  ```sh
  cat lock-probe.log
  tofu state list
  ```
hints.2.text: |-
  Zatrzymaj proces zapisany w lock-holder.pid i zachowaj stan. Proces konserwacyjny posiada blokadę; force-unlock nie zastępuje zatrzymania tego działającego procesu.

  Sprawdź wynik z `~/quest` na workstation:

  - `cat notice.txt; tofu show -no-color` — Pokazuje `north-ready` i śledzony zasób `notice.txt`.
  - `tofu plan -input=false -detailed-exitcode -no-color` — Kończy się kodem `0` i nie zgłasza oczekujących zmian infrastruktury.

  Stan nadal śledzi skonfigurowany plik notice.txt.
debrief: Plik powiadomienia i adres stanu są obecne, a planowanie kończy się bez zmian.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Porównałem aktywny zasób ID ze stanem OpenTofu.
diagnostics.condition_0: notice.txt musi być równe north-ready.
diagnostics.condition_1: |-
  Stan OpenTofu musi śledzić zarządzany plik źródłowy notice.txt.

diagnostics.condition_2: Plan OpenTofu z detailed-exitcode musi zakończyć się kodem 0.
stages.0.objectives.0.text: Na workstation `notice.txt` zawiera `north-ready`.
stages.0.objectives.1.text: Skonfigurowany plik komunikatu pozostaje zarządzany w stanie OpenTofu.
stages.0.objectives.2.text: OpenTofu nie zgłasza oczekujących zmian infrastruktury.
