title: Blokowanie stanu
brief: 'Dołączyłeś do operacji SignalRail. Znajdź uchwyt zamka bez usuwania state. Pracuj w ~/quest..
  Wszystkie zmiany przechowuj w tej komorze szkoleniowej.


  Wejścia w `~/quest`: `main.tf`, `hold-state.py`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Wszystkie zmiany muszą pozostać w tej zatoce.


  Początkowe kryteria sukcesu: Uchwyt zamka zatrzymał się, a state jest nadal ważny.'
stages.0.brief: 'Lokalny proces konserwacji obejmuje state lock. Zatrzymaj ten proces, zachowaj state
  i nie force-unlock innemu użytkownikowi.


  Kryteria sukcesu: Uchwyt zamka zatrzymał się, a state jest nadal ważny.'
stages.0.objectives.0.text: Uchwyt zamka zatrzymał się, a state jest nadal ważny.
hints.0.text: Sprawdź lock-probe.log i lokalny uchwyt PID.
hints.1.text: Plik stanu musi pozostać nienaruszony; usunięcie go nie powoduje bezpiecznego zwolnienia
  oryginalnej blokady.
hints.2.text: Zatrzymaj proces w lock-holder.pid, zachowaj state i zweryfikuj pomyślnie puste plan.
debrief: Lokalny proces konserwacji obejmował state lock. Zatrzymałeś tego posiadacza, zachowałeś state
  i zweryfikowane planowanie znów zadziałało.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Porównałem aktywny zasób ID ze stanem OpenTofu.
