title: Blokowanie stanu
brief: 'Pracuj w `~/quest`; przeczytaj `main.tf`, `hold-state.py`, `lock-holder.pid` i `lock-probe.log`. Lokalny proces konserwacyjny trzyma blokadę stanu. Połączony przewodnik wyjaśnia, dlaczego blokada chroni stan. Zatrzymaj proces wskazany w `lock-holder.pid`; nie usuwaj stanu ani nie wymuszaj odblokowania innego użytkownika. Korzystaj tylko z zatoki offline.


  Sprawdź, czy `notice.txt` zawiera `north-ready`, `tofu state list` zawiera `local_file.notice`, a `tofu plan -input=false -detailed-exitcode -no-color` zwraca kod 0 (brak zmian). Kontrola obserwuje plik, stan i plan; nie dowodzi bezpośrednio, jaki proces zatrzymano ani czy użyto wymuszonego odblokowania.'
stages.0.brief: Plik powiadomienia, adres stanu i plan bez zmian odpowiadają opisowi.
stages.0.objectives.0.text: Plik powiadomienia, adres stanu i plan bez zmian odpowiadają opisowi.
hints.0.text: Sprawdź lock-probe.log i lokalny uchwyt PID.
hints.1.text: Plik stanu musi pozostać nienaruszony; usunięcie go nie powoduje bezpiecznego zwolnienia
  oryginalnej blokady.
hints.2.text: Zatrzymaj proces w lock-holder.pid, zachowaj state i zweryfikuj pomyślnie puste plan.
debrief: Plik powiadomienia i adres stanu są obecne, a planowanie kończy się bez zmian.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Porównałem aktywny zasób ID ze stanem OpenTofu.
