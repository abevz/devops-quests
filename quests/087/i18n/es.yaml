title: Bloqueo de estado
brief: 'Trabaja en `~/quest`; lee `main.tf`, `hold-state.py`, `lock-holder.pid` y `lock-probe.log`. Un proceso local de mantenimiento
  mantiene el bloqueo del estado. La guía enlazada explica por qué el bloqueo protege el estado. Detén el proceso indicado
  en `lock-holder.pid`; no borres el estado ni fuerces el desbloqueo de otro usuario. Usa solo la bahía sin conexión.


  Comprueba que `notice.txt` contiene `north-ready`, `tofu state list` contiene `local_file.notice` y `tofu plan -input=false
  -detailed-exitcode -no-color` termina con código 0 (sin cambios). La comprobación observa el archivo, el estado y el plan;
  no demuestra directamente qué proceso se detuvo ni si se forzó el desbloqueo.'
stages.0.brief: El archivo de aviso, la dirección de estado y el plan sin cambios coinciden con el enunciado.
stages.0.objectives.0.text: El archivo de aviso, la dirección de estado y el plan sin cambios coinciden con el enunciado.
hints.0.text: Inspeccione lock-probe.log y el soporte local PID.
hints.1.text: El expediente estatal debe permanecer intacto; eliminarlo no libera el bloqueo original de forma segura.
hints.2.text: Detenga el proceso en lock-holder.pid, conserve el estado y verifique un plan vacío exitoso.
debrief: El archivo de aviso y la dirección de estado están presentes, y el plan se completa sin cambios.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Comparé el recurso en vivo ID con el estado OpenTofu.
diagnostics.condition_0: notice.txt debe ser igual a north-ready.
diagnostics.condition_1: tofu state list debe contener local_file.notice.
diagnostics.condition_2: El plan de OpenTofu con detailed-exitcode debe terminar con código 0.
