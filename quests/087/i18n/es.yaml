title: Bloqueo de estado
brief: |
  Las operaciones normales de OpenTofu no pueden completarse.

  Trabaja en la workstation en `~/quest` con `main.tf`, `lock-probe.log`.

  **Requisitos:**
  - Archivos en la workstation:
    - `~/quest/notice.txt`: `north-ready`.
  - Estado de OpenTofu:
    - Direcciones requeridas: `local_file.notice`.
  - Convergencia de infraestructura:
    - Sin cambios de infraestructura pendientes; código de salida del plan detallado `0`.

  **Verifica antes de Check & finish:**
  - `cat notice.txt; tofu show -no-color` — Muestra `north-ready` y el recurso registrado `local_file.notice`.
  - `tofu plan -input=false -detailed-exitcode -no-color` — Termina con `0` y no informa cambios de infraestructura pendientes.

  La comprobación observa archivo, estado y plan; no demuestra directamente qué proceso se detuvo ni si se usó force-unlock.
stages.0.brief: La planificación normal de infraestructura debe completarse con el aviso disponible.
hints.0.text: Inspeccione lock-probe.log y el soporte local PID.
hints.1.text: El expediente estatal debe permanecer intacto; eliminarlo no libera el bloqueo original de forma segura.
hints.2.text: Detén el proceso registrado en lock-holder.pid y conserva el estado. El proceso de mantenimiento posee
  el bloqueo; force-unlock no sustituye detener ese proceso activo.
debrief: El archivo de aviso y la dirección de estado están presentes, y el plan se completa sin cambios.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Comparé el recurso en vivo ID con el estado OpenTofu.
diagnostics.condition_0: notice.txt debe ser igual a north-ready.
diagnostics.condition_1: tofu state list debe contener local_file.notice.
diagnostics.condition_2: El plan de OpenTofu con detailed-exitcode debe terminar con código 0.
stages.0.objectives.0.text: En la workstation, `notice.txt` contiene `north-ready`.
stages.0.objectives.1.text: El estado de OpenTofu incluye `local_file.notice`.
stages.0.objectives.2.text: OpenTofu no informa cambios de infraestructura pendientes.
