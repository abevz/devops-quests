title: Bloqueo de estado
brief: 'Te uniste a las operaciones de SignalRail. Busque el titular lock sin eliminar el estado. Trabajar
  en ~/quest. Mantenga todos los cambios dentro de esta bahía de entrenamiento.


  Entradas en `~/quest`: `main.tf`, `hold-state.py`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente los archivos suministrados, las imágenes
  precargadas y los servicios privados. Todos los cambios deben permanecer dentro de esta bahía.


  Criterios de éxito iniciales: el titular de lock se detuvo y el estado sigue siendo válido.'
stages.0.brief: 'Un proceso de mantenimiento local mantiene el estado lock. Detenga ese proceso, mantenga
  el estado y no force-unlock a otro usuario.


  Criterios de éxito: el titular de lock se detuvo y el estado sigue siendo válido.'
stages.0.objectives.0.text: El titular de la cerradura se detuvo y el estado sigue siendo válido.
hints.0.text: Inspeccione lock-probe.log y el soporte local PID.
hints.1.text: El expediente estatal debe permanecer intacto; eliminarlo no libera el bloqueo original
  de forma segura.
hints.2.text: Detenga el proceso en lock-holder.pid, conserve el estado y verifique un plan vacío exitoso.
debrief: Un proceso de mantenimiento local llevó a cabo el estado lock. Detuviste a ese titular, preservaste
  el estado y verificaste que la planificación funcionara nuevamente.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Comparé el recurso en vivo ID con el estado OpenTofu.
