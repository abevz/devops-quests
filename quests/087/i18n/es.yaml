title: Propiedad del estado y recuperación concurrente
brief: |-
  La planificación está bloqueada tras operaciones de estado superpuestas. Recupera la convergencia conservando el trabajo completado.

  Trabaja en `~/quest` de la estación con `main.tf`, `incident.txt`, `failed-apply.log` y `errored.tfstate`.

  **Requisitos:**
  - En la estación, `~/quest/notice.txt` contiene `north-ready` y sigue gestionado en el estado raíz.
  - El estado conserva el registro de mantenimiento completado y gestiona el contenedor Docker original sano, sin recrear ninguna de las dos identidades.
  - Conserva `~/quest/errored.tfstate` original sin cambios. Guarda en `~/quest/before-recovery.tfstate` la instantánea del backend anterior a las escrituras de recuperación, con su lineage original y el trabajo completado.
  - La consola de mantenimiento registrada termina normalmente y libera su propio bloqueo.
  - El backend recuperado conserva su lineage original y un serial al menos igual al suministrado; un nuevo plan detallado termina con código `0`.

  **Contrato del servicio de la bahía:**
  - `main.tf` indica un backend HTTP local de la estación. GET lee el estado; POST escribe con el ID nativo del bloqueo en la query, y LOCK/UNLOCK intercambian información nativa del bloqueo. Los conflictos devuelven `423`; un unlock sin coincidencia devuelve `409`. No se permite borrar el estado.
  - `GET http://127.0.0.1:18787/diagnostic` muestra el bloqueo actual y los eventos del backend. Los registros anteriores describen su propia operación, no necesariamente al propietario actual.
  - `GET http://127.0.0.1:18787/owner` muestra `handle`, `running`, `eof_requested`, `completed` de la consola registrada y los valores nativos finales `exit`/`stderr` cuando estén disponibles.
  - `POST http://127.0.0.1:18787/owner/finish` acepta solo un objeto JSON con el campo de texto `handle`, hasta 16384 bytes, para el identificador registrado. Solicita EOF en stdin de esa consola original y espera su terminación real y la liberación nativa del bloqueo; no ejecuta comandos ni PID proporcionados. `202` confirma la solicitud; `400` rechaza entradas incorrectas y `409` un identificador desconocido. Se permite repetir la misma solicitud.
  - `completed` requiere EOF solicitado, salida real cero, ausencia de stderr nativo y desbloqueo correcto por el propietario registrado. No certifica otra operación.

  El servicio de confianza registra EOF, la salida real del proceso hijo registrado y su desbloqueo nativo; las demás comprobaciones observan archivos actuales, estado e identidad Docker, no un historial general de comandos.
stages.0.brief: Recupera un estado coherente y la propiedad normal conservando ambas identidades completadas.
hints.0.text: La propiedad del bloqueo y del recurso puede divergir. Una instantánea de recuperación puede ser válida
  internamente y omitir una operación completada después.
hints.1.text: |-
  Compara `cat incident.txt failed-apply.log`, `tofu state pull`, `cat errored.tfstate`, `docker ps -a` y las observaciones actuales del servicio. Compara por separado lineage, serial, ID de recursos y propietario del bloqueo; un error anterior no describe al propietario actual.

  Localiza al propietario registrado en el contrato del backend y contrasta su estado con el error anterior de apply. En las instantáneas separadas, identifica el vínculo original que falta y el recurso más reciente ya registrado.

  ```sh
  curl -fsS http://127.0.0.1:18787/diagnostic | jq .lock
  curl -fsS http://127.0.0.1:18787/owner | jq '{registered,handle,running,eof_requested,completed}'
  sha256sum errored.tfstate
  ```
hints.2.text: |-
  Verifica ambos ID originales, evidencias sin cambios, `completed: true` y código `0` de `tofu plan -input=false -detailed-exitcode -no-color`.

  Compara lineage, serial e ID de operaciones completadas de la copia con la instantánea inicial del backend. Contrasta los ID y lineage recuperados con los registros originales. La suma del estado erróneo debe coincidir con la inicial. El archivo debe contener `north-ready` y el endpoint del propietario debe mostrar `true`.

  ```sh
  (
    set -euo pipefail
    ref=/run/dq/locking-identities.json
    curl -fsS http://127.0.0.1:18787/owner | jq -e '.completed == true and .running == false'
    test "$(sha256sum errored.tfstate | cut -d ' ' -f1)" = "$(jq -er .checkpoint_sha256 "$ref")"
    python3 -I - <<'VERIFY_BACKUP'
  import hashlib, json
  from pathlib import Path
  reference = json.loads(Path('/run/dq/locking-identities.json').read_text())
  backup = json.loads(Path('before-recovery.tfstate').read_text())
  canonical = json.dumps(backup, sort_keys=True, separators=(',', ':')).encode()
  assert hashlib.sha256(canonical).hexdigest() == reference['backup_sha256']
  VERIFY_BACKUP
    tofu state pull | jq -e --slurpfile ref "$ref" '
      def ids($type): [.resources[] | select(.mode=="managed" and .type==$type) | .instances[].attributes.id];
      $ref[0] as $want | .lineage==$want.lineage and .serial >= $want.serial
      and (ids("docker_container") | index($want.container_id) != null)
      and (ids("terraform_data") | index($want.progress_id) != null)'
    container=$(jq -er .container_id "$ref")
    docker inspect "$container" | jq -e --arg id "$container" '
      .[0] | .Id==$id and .State.Running==true and .State.Health.Status=="healthy"'
    cat notice.txt
    tofu plan -input=false -detailed-exitcode -no-color
  )
  ```
debrief: Una transferencia del bloqueo hizo divergir dos clientes. La recuperación conservó el estado completado
  más reciente y el recurso físico original; el propietario actual real liberó su propio bloqueo.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Comparé el recurso en vivo ID con el estado OpenTofu.
stages.0.objectives.0.text: En la workstation, `notice.txt` contiene `north-ready`.
stages.0.objectives.1.text: El archivo de aviso configurado sigue registrado en el estado de OpenTofu.
stages.0.objectives.2.text: La convergencia del estado conserva ambas identidades completadas, las evidencias de
  recuperación y la terminación normal del propietario registrado.
diagnostics.condition_0: Notice puede faltar o conservar edición manual tras recuperar estado; archivo real de estación debe contener north-ready, con saltos finales eliminados por comparación shell. [Causa y comprobación](guides#guide=terraform-4&section=state-handover-notice-content)
diagnostics.condition_1: Notice puede existir solo en disco tras sobrescribir estado o fallar lectura; conserve recurso local_file gestionado para notice.txt, pues contenido no prueba recuperación del estado. [Causa y comprobación](guides#guide=terraform-4&section=state-handover-managed-notice-state)
diagnostics.probe_0_1: La observación de archivo en estado puede detenerse cargando Python helpers antes del resultado; compruebe dq_check. Ausencia ordinaria de archivo gestionado o estado ilegible normalmente da condition_1. [Causa y comprobación](guides#guide=terraform-4&section=state-handover-notice-observer-startup)
diagnostics.locking_binding: El apply fallido creó contenedor saludable pero no guardó vínculo en backend más reciente; combine vínculo ausente sin recrear contenedor. Su ID original debe estar en estado y seguir identificando contenedor running/healthy. [Causa y comprobación](guides#guide=terraform-4&section=state-handover-original-container-binding)
diagnostics.locking_progress: Enviar entero errored state antiguo puede borrar registro maintenance más reciente; combine vínculo ausente con snapshot actual del backend conservando identidad original de terraform_data completado. [Causa y comprobación](guides#guide=terraform-4&section=state-handover-completed-maintenance)
diagnostics.locking_lineage: Estado reemplazado o antiguo puede cambiar lineage o retroceder serial; backend recuperado debe mantener lineage original y serial entero al menos tan reciente como snapshot registrado. [Causa y comprobación](guides#guide=terraform-4&section=state-handover-backend-lineage-and-serial)
diagnostics.locking_checkpoint: errored.tfstate puede sobrescribirse, editarse o eliminarse al combinar; conserve bytes originales y opere sobre copias. Se compara hash del archivo completo con recibo checkpoint congelado. [Causa y comprobación](guides#guide=terraform-4&section=state-handover-original-checkpoint-bytes)
diagnostics.locking_backup: before-recovery.tfstate puede faltar o contener checkpoint antiguo o estado ya modificado; guarde snapshot backend con trabajo completado más reciente antes de escribir recuperación. Significado JSON debe coincidir con snapshot registrado; espacios de formato pueden variar. [Causa y comprobación](guides#guide=terraform-4&section=state-handover-before-recovery-snapshot)
diagnostics.locking_owner: La consola registrada actual puede conservar su lock; ID antiguo del incidente o unlock forzado no prueba finalización normal. Solicite EOF por interfaz handle documentada y espere completed=true y running=false; HTTP 202 solo reconoce solicitud. [Causa y comprobación](guides#guide=terraform-4&section=state-handover-registered-console-completion)
diagnostics.condition_2: El propietario actual puede bloquear planificación o recuperación dejar vínculos ausentes o cambios; complete operación registrada y reconcilie estado hasta código 0 de plan nuevo detallado. Código 2 indica cambios y 1 error. [Causa y comprobación](guides#guide=terraform-4&section=state-handover-fresh-convergence-plan)
diagnostics.probe_0_2: Hechos congelados, lectura de estado, Docker inspect, acceso owner o plan pueden abortar sin resultado nombrado, o no cargar Python helpers. Inspeccione esas rutas aparte; fallos nombrados previos de vínculo, checkpoint, backup u owner conservan sus marcadores. [Causa y comprobación](guides#guide=terraform-4&section=state-handover-recovery-observation)
