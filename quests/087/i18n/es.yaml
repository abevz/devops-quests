title: Bloqueo de estado
brief: |-
  Las operaciones normales de OpenTofu no pueden completarse.

  Trabaja en la workstation en `~/quest` con `main.tf`, `lock-probe.log`.

  **Requisitos:**
  - Archivos en la workstation:
    - `~/quest/notice.txt`: `north-ready`.
  - Estado de OpenTofu:
    - El archivo de aviso configurado sigue registrado en el estado de OpenTofu.
  - Convergencia de infraestructura:
    - Sin cambios de infraestructura pendientes; código de salida del plan detallado `0`.

  La comprobación observa el archivo, el estado y el resultado actual de planificación; no establece el historial ni el método de desbloqueo.
stages.0.brief: La planificación normal de infraestructura debe completarse con el aviso disponible.
hints.0.text: El bloqueo del estado coordina escritores concurrentes y protege las operaciones en curso.
hints.1.text: |-
  Inspeccione lock-probe.log y el soporte local PID. El expediente estatal debe permanecer intacto; eliminarlo no libera el bloqueo original de forma segura. La comprobación observa archivo, estado y plan; no demuestra directamente qué proceso se detuvo ni si se usó force-unlock.

  Inspecciona la configuración suministrada y las observaciones actuales en la workstation:

  ```sh
  cat lock-probe.log
  tofu state list
  ```
hints.2.text: |-
  Detén el proceso registrado en lock-holder.pid y conserva el estado. El proceso de mantenimiento posee el bloqueo; force-unlock no sustituye detener ese proceso activo.

  Verifica el resultado desde `~/quest` en la workstation:

  - `cat notice.txt; tofu show -no-color` — Muestra `north-ready` y el recurso registrado `notice.txt`.
  - `tofu plan -input=false -detailed-exitcode -no-color` — Termina con `0` y no informa cambios de infraestructura pendientes.

  El estado sigue registrando el archivo configurado notice.txt.
debrief: El archivo de aviso y la dirección de estado están presentes, y el plan se completa sin cambios.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Comparé el recurso en vivo ID con el estado OpenTofu.
diagnostics.condition_0: notice.txt debe ser igual a north-ready.
diagnostics.condition_1: |-
  El estado de OpenTofu debe registrar el archivo productor gestionado notice.txt.

diagnostics.condition_2: El plan de OpenTofu con detailed-exitcode debe terminar con código 0.
stages.0.objectives.0.text: En la workstation, `notice.txt` contiene `north-ready`.
stages.0.objectives.1.text: El archivo de aviso configurado sigue registrado en el estado de OpenTofu.
stages.0.objectives.2.text: OpenTofu no informa cambios de infraestructura pendientes.
