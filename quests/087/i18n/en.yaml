title: State ownership and concurrent recovery
brief: |-
  Infrastructure planning is blocked after overlapping state operations. Restore convergence without losing completed work.

  Work in `~/quest` on the workstation with `main.tf`, `incident.txt`, `failed-apply.log` and `errored.tfstate`.

  **Requirements:**
  - Workstation `~/quest/notice.txt` contains `north-ready` and remains managed in the root state.
  - The state retains the completed maintenance record and tracks the original healthy Docker container without recreating either identity.
  - Keep the original `~/quest/errored.tfstate` unchanged. Retain the backend snapshot from before recovery writes in `~/quest/before-recovery.tfstate`, with its original lineage and completed work.
  - The registered maintenance console completes normally, releasing its own lock.
  - The recovered backend retains its original lineage and at least its supplied serial; a fresh detailed plan exits `0`.

  **Bay service contract:**
  - `main.tf` names a workstation-local HTTP backend. State reads use GET; writes use POST with the native lock ID query, and LOCK/UNLOCK exchange native lock information. Conflicting locks return `423`; an unmatched unlock returns `409`. State deletion is unavailable.
  - `GET http://127.0.0.1:18787/diagnostic` exposes current lock information and backend events. Earlier logs describe their own operation, not necessarily the current owner.
  - `GET http://127.0.0.1:18787/owner` exposes the registered console's `handle`, `running`, `eof_requested`, `completed`, and final native `exit`/`stderr` when available.
  - `POST http://127.0.0.1:18787/owner/finish` accepts only a JSON object with the string field `handle`, at most 16384 bytes, for that registered handle. It requests stdin EOF for that original console, then waits for its actual exit and native lock release; it executes no supplied command or PID. Status `202` acknowledges the request; `400` rejects malformed input and `409` an unknown handle. Repeating the same request is allowed.
  - `completed` requires requested EOF, actual exit zero, no native stderr and a successful unlock by the registered owner. It cannot certify an unrelated operation.

  The trusted service records EOF, the actual registered child exit and its native unlock; other checks observe current files, state and Docker identity, not general command history.
stages.0.brief: Recover consistent state and normal ownership while retaining both completed identities.
hints.0.text: Lock ownership and resource ownership can diverge. A recovery snapshot may be internally valid and
  still omit a later completed operation.
hints.1.text: |-
  Compare `cat incident.txt failed-apply.log`, `tofu state pull`, `cat errored.tfstate`, `docker ps -a` and the current service observations. Compare lineage, serial, resource IDs and lock ownership separately; an earlier error is not a current-owner observation.

  Locate the registered owner in the backend contract and compare its status with the old apply error. In separate snapshots, identify the missing original binding and which newer resource is already recorded.

  ```sh
  curl -fsS http://127.0.0.1:18787/diagnostic | jq .lock
  curl -fsS http://127.0.0.1:18787/owner | jq '{registered,handle,running,eof_requested,completed}'
  sha256sum errored.tfstate
  ```
hints.2.text: |-
  Verify both original IDs, unchanged recovery evidence, `completed: true`, and `tofu plan -input=false -detailed-exitcode -no-color` exiting `0`.

  Compare the backup lineage, serial and completed IDs with the initial backend snapshot. Compare the recovered live IDs and lineage with the original records. The errored-state checksum must match its initial observation. The file must contain `north-ready`, and the owner endpoint must report `true`.

  ```sh
  (
    set -euo pipefail
    ref=/run/dq/locking-identities.json
    curl -fsS http://127.0.0.1:18787/owner | jq -e '.completed == true and .running == false'
    test "$(sha256sum errored.tfstate | cut -d ' ' -f1)" = "$(jq -er .checkpoint_sha256 "$ref")"
    python3 -I - <<'VERIFY_BACKUP'
  import hashlib, json
  from pathlib import Path
  reference = json.loads(Path('/run/dq/locking-identities.json').read_text())
  backup = json.loads(Path('before-recovery.tfstate').read_text())
  canonical = json.dumps(backup, sort_keys=True, separators=(',', ':')).encode()
  assert hashlib.sha256(canonical).hexdigest() == reference['backup_sha256']
  VERIFY_BACKUP
    tofu state pull | jq -e --slurpfile ref "$ref" '
      def ids($type): [.resources[] | select(.mode=="managed" and .type==$type) | .instances[].attributes.id];
      $ref[0] as $want | .lineage==$want.lineage and .serial >= $want.serial
      and (ids("docker_container") | index($want.container_id) != null)
      and (ids("terraform_data") | index($want.progress_id) != null)'
    container=$(jq -er .container_id "$ref")
    docker inspect "$container" | jq -e --arg id "$container" '
      .[0] | .Id==$id and .State.Running==true and .State.Health.Status=="healthy"'
    cat notice.txt
    tofu plan -input=false -detailed-exitcode -no-color
  )
  ```
debrief: A lock handover allowed two clients to diverge. Recovery preserved newer completed state and the original
  physical resource, and the genuine current owner released its own lock.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I compared the live resource ID with the OpenTofu state.
stages.0.objectives.0.text: On the workstation, `notice.txt` contains `north-ready`.
stages.0.objectives.1.text: The configured notice file remains tracked in OpenTofu state.
stages.0.objectives.2.text: State convergence preserves both completed identities, recovery evidence and normal
  completion of the registered owner.
diagnostics.condition_0: The notice may be missing or retain a manual edit after state recovery; the actual workstation file must contain north-ready, with trailing line feeds removed by the shell comparison. [Cause and check](guides#guide=terraform-4&section=state-handover-notice-content)
diagnostics.condition_1: The notice may exist only on disk after a state overwrite, or state could not be read; retain a managed local_file resource targeting notice.txt rather than treating file content as proof of state recovery. [Cause and check](guides#guide=terraform-4&section=state-handover-managed-notice-state)
diagnostics.probe_0_1: The file-state observation may stop while loading Python helpers before a named result; verify dq_check availability. An ordinary missing managed file or unreadable state normally reports condition_1. [Cause and check](guides#guide=terraform-4&section=state-handover-notice-observer-startup)
diagnostics.locking_binding: The failed apply created the healthy container but could not save its binding to the newer backend; merge that missing binding without recreating the container. Its original ID must be present in state and still identify a running healthy container. [Cause and check](guides#guide=terraform-4&section=state-handover-original-container-binding)
diagnostics.locking_progress: Pushing the entire older errored state may discard the newer maintenance record; merge the missing container binding into the current backend snapshot while retaining the original completed terraform_data identity. [Cause and check](guides#guide=terraform-4&section=state-handover-completed-maintenance)
diagnostics.locking_lineage: A replacement or older state may have changed lineage or rolled serial backward; the recovered backend must keep its original lineage and an integer serial at least as new as the recorded backend snapshot. [Cause and check](guides#guide=terraform-4&section=state-handover-backend-lineage-and-serial)
diagnostics.locking_checkpoint: errored.tfstate may have been overwritten, edited or removed during merging; preserve its original bytes and perform recovery operations on copies. The check compares the complete file hash with the frozen checkpoint receipt. [Cause and check](guides#guide=terraform-4&section=state-handover-original-checkpoint-bytes)
diagnostics.locking_backup: before-recovery.tfstate may be missing or contain the older checkpoint or already-modified state; retain the backend snapshot containing the newer completed work before recovery writes. Its JSON meaning must match the recorded snapshot; whitespace formatting may differ. [Cause and check](guides#guide=terraform-4&section=state-handover-before-recovery-snapshot)
diagnostics.locking_owner: The current registered console may still hold its own lock; an old incident lock ID or a forced unlock does not prove its normal completion. Request EOF through the documented handle interface and wait for completed=true and running=false; HTTP 202 only acknowledges the request. [Cause and check](guides#guide=terraform-4&section=state-handover-registered-console-completion)
diagnostics.condition_2: The current owner may still block planning, or state recovery may leave missing bindings or pending changes; complete the registered operation and reconcile the current state so a fresh detailed plan returns 0. Exit 2 means proposed changes and exit 1 an error. [Cause and check](guides#guide=terraform-4&section=state-handover-fresh-convergence-plan)
diagnostics.probe_0_2: Frozen facts, state retrieval, Docker inspection, owner access or planning may abort without a named result, or Python helpers may fail to load. Inspect these observation paths separately; earlier named binding, checkpoint, backup or owner failures retain their own markers. [Cause and check](guides#guide=terraform-4&section=state-handover-recovery-observation)
