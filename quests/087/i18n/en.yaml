title: State locking
brief: 'You joined SignalRail operations. Find the lock holder without deleting the state. Work in ~/quest.
  Keep all changes inside this training bay.


  Inputs in `~/quest`: `main.tf`, `hold-state.py`.


  The bay has no Internet or external DNS. Use only its supplied files, preloaded images and private services.
  All changes must stay inside this bay.


  Initial success criteria: The lock holder stopped and state is still valid.'
stages.0.brief: 'A local maintenance process holds the state lock. Stop that process, keep state and do
  not force-unlock another user.


  Success criteria: The lock holder stopped and state is still valid.'
stages.0.objectives.0.text: The lock holder stopped and state is still valid.
hints.0.text: Inspect lock-probe.log and the local holder PID.
hints.1.text: The state file must remain intact; deleting it does not release the original lock safely.
hints.2.text: Stop the process in lock-holder.pid, retain state and verify a successful empty plan.
debrief: A local maintenance process held the state lock. You stopped that holder, preserved state and
  verified planning worked again.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I compared the live resource ID with the OpenTofu state.
