title: State locking
brief: |-
  Normal OpenTofu operations cannot complete.

  Work on the workstation in `~/quest` with `main.tf`, `lock-probe.log`.

  **Requirements:**
  - Files on the workstation:
    - `~/quest/notice.txt`: `north-ready`.
  - OpenTofu state:
    - The configured notice file remains tracked in OpenTofu state.
  - Infrastructure convergence:
    - No pending infrastructure changes; detailed-plan exit code `0`.

  The check observes the current file, state and planning result; it does not establish the unlocking history or method.
stages.0.brief: Normal infrastructure planning must complete with the notice available.
hints.0.text: State locking coordinates concurrent writers and protects ongoing state operations.
hints.1.text: |-
  Inspect lock-probe.log and the local holder PID. The state file must remain intact; deleting it does not release the original lock safely. The check observes the file, state and plan; it does not directly prove which process stopped or whether force-unlock was used.

  Inspect the supplied configuration and live observations on the workstation:

  ```sh
  cat lock-probe.log
  tofu state list
  ```
hints.2.text: |-
  Stop the process recorded in lock-holder.pid and retain state. The maintenance process owns the lock; force-unlock is not a replacement for stopping that live process.

  Verify the result from `~/quest` on the workstation:

  - `cat notice.txt; tofu show -no-color` — Shows `north-ready` and tracked resource `local_file.notice`.
  - `tofu plan -input=false -detailed-exitcode -no-color` — Exits `0` and reports no pending infrastructure changes.
debrief: The notice file and state address are present, and planning succeeds with no changes.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I compared the live resource ID with the OpenTofu state.
diagnostics.condition_0: notice.txt must equal north-ready.
diagnostics.condition_1: tofu state list must contain local_file.notice.
diagnostics.condition_2: The OpenTofu detailed plan must exit with code 0.
stages.0.objectives.0.text: On the workstation, `notice.txt` contains `north-ready`.
stages.0.objectives.1.text: The configured notice file remains tracked in OpenTofu state.
stages.0.objectives.2.text: OpenTofu reports no pending infrastructure changes.
