title: State locking
brief: 'Work in `~/quest`; read `main.tf`, `hold-state.py`, `lock-holder.pid` and `lock-probe.log`. A local maintenance process
  holds the state lock. The linked state-locking guide explains why a lock protects state. Stop the process named in `lock-holder.pid`;
  do not delete state or force-unlock another user. Use only this offline bay.


  Verify that `notice.txt` contains `north-ready`, `tofu state list` contains `local_file.notice`, and `tofu plan -input=false
  -detailed-exitcode -no-color` exits 0 (no changes). The check observes the file, state and plan; it does not directly prove
  which process was stopped or whether force-unlock was used.'
stages.0.brief: The notice file, state address and no-change plan match the brief.
stages.0.objectives.0.text: The notice file, state address and no-change plan match the brief.
hints.0.text: Inspect lock-probe.log and the local holder PID.
hints.1.text: The state file must remain intact; deleting it does not release the original lock safely.
hints.2.text: Stop the process in lock-holder.pid, retain state and verify a successful empty plan.
debrief: The notice file and state address are present, and planning succeeds with no changes.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I compared the live resource ID with the OpenTofu state.
diagnostics.condition_0: notice.txt must equal north-ready.
diagnostics.condition_1: tofu state list must contain local_file.notice.
diagnostics.condition_2: The OpenTofu detailed plan must exit with code 0.
