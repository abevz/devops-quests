title: Lieferung von Geheimnissen
brief: "Das aufgezeichnete Git-Release und sein Secret nutzender Dienst sind noch nicht gemeinsam verfügbar.\n\n\
  Arbeiten Sie in `~/quest` auf der Workstation. Eingaben je Phase:\n- Phase 1: `platform.env`, `application.yaml`,\
  \ `repository/manifests/board.yaml`, `repository/manifests/service.yaml`.\n- Phase 2: `reader.hcl`, `reader-policy.json`,\
  \ `sync-secret.sh`.\n\n**Anforderungen:**\n\n- Phase 1:\n  - Application `board` meldet `Synced` bei der vorgesehenen\
  \ veröffentlichten Revision.\n  - Deployment `board` bezieht seinen Laufzeitwert nur über die mitgelieferte Secret-Referenz,\
  \ nie als eingebetteten Wert.\n- Phase 2:\n  - Application `board` meldet `Synced` und `Healthy` bei der veröffentlichten\
  \ Release-Revision.\n  - Deployment `board` schließt seinen Rollout ab.\n  - Deployment `board` bezieht seinen\
  \ Laufzeitwert nur über die mitgelieferte Secret-Referenz, nie als eingebetteten Wert.\n  - Das Workload-Secret\
  \ enthält den Wert des vorgesehenen Vault-Eintrags.\n  - Das Vault-Zugriffstoken hat nur Lesezugriff auf den vorgesehenen\
  \ Auslieferungseintrag; ein separater fremder Eintrag und die Mount-Verwaltung sind gesperrt.\n  - Von Deployment\
  \ `board` liefert `http://board:8080` den Wert `north-70`.\n\nDie Prüfung beobachtet aufgezeichnete Revision,\
  \ ausgewählte Secret-Referenz und drei Leser-Capability-Pfade; sie belegt weder Hintergrundsynchronisation noch\
  \ Rechte auf allen anderen Vault-Pfaden."
debrief: Die Lieferung GitOps und die Lieferung runtime secret wurden als separate Phasen mit einem gemeinsamen
  verifizierten Ergebnis wiederhergestellt.
stages.0.brief: Das aufgezeichnete Release muss vor der Laufzeitbewertung abgeglichen sein.
stages.1.brief: Der abgeglichene Dienst muss das vorgesehene Secret mit begrenztem Leserzugriff nutzen.
hints.0.text: Quellabgleich und Auslieferung des Laufzeit-Secrets sind getrennte Grenzen. Eine aufgezeichnete Revision
  allein belegt nicht, dass ihr Verbraucher starten kann.
hints.1.text: 'Stellen Sie die Git-Synchronisierung wieder her, bevor Sie das fehlende runtime Secret diagnostizieren.
  Das Quellverzeichnis der Application ist `manifests`; synchronisieren Sie die aufgezeichnete Revision, bevor Sie
  einen gesunden Laufzeitzustand erwarten.


  Verwenden Sie den Pfad KV v2 data und gewähren Sie dispatch Schreibschutz.


  Prüfen Sie mitgelieferte Definitionen, Ressourcenbeschreibungen und Ereignisse der jeweiligen Phase.


  ```sh

  cat application.yaml

  cat reader.hcl

  kubectl describe application board

  kubectl describe deployment board

  kubectl describe pod -l app=board

  ```


  Phase 1/2: Prüfen Sie diese Ressourcendefinitionen für diese Phase.


  ```sh

  kubectl get application board -o yaml

  kubectl get deployment board -o yaml

  kubectl get pods -l app=board -o yaml

  ```'
hints.2.text: |-
  Führen Sie den bereitgestellten Synchronizer explizit aus und überprüfen Sie dann die Referenzen capabilities, Secret, health und HTTP. Der Synchronisierer läuft auf Anforderung, nicht im Hintergrund; halten Sie Vault-Token aus dem Workload heraus.

  Prüfen Sie die reparierte Phase und vergleichen Sie das beobachtete Ergebnis.

  Phase 1/2: Der Controller meldet `Synced` bei der erwarteten Revision; in der letzten Phase meldet er auch `Healthy` und der Workload ist bereit.

  ```sh
  kubectl get application board -o jsonpath='{.status.sync.status} {.status.health.status} {.status.sync.revision}'; printf '\n'
  kubectl get deployment board
  ```

  Phase 2: Der Secret-Wert gibt `north-secret` aus; der Anwendungsverbraucher erhält `north-70`.

  ```sh
  kubectl get secret route-secret -o jsonpath='{.data.value}' | base64 -d
  printf '\n'
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080
  ```

  Phase 2: Die Capability-Abfrage liefert `read` für `secret/data/dispatch` und `deny` für `secret/data/unrelated` und `sys/mounts`; sie ändert keine Richtlinie.

  ```sh
  source platform.env
  curl -fsS -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_READER_TOKEN") -H 'Content-Type: application/json' --request POST --data '{"paths":["secret/data/dispatch","secret/data/unrelated","sys/mounts"]}' "$VAULT_ADDR/v1/sys/capabilities-self"
  ```

  Erwartete Beobachtungen für die gesamte Phase:
  - Phase 1/2: Angezeigter Abgleich, Workload-Konfiguration und Beobachtungen des laufenden Images erfüllen die Anforderungen dieser Phase.

phrases.0: Ich habe den Git-Abgleich von der runtime secret-Lieferung getrennt.
phrases.1: Ich habe Vault credentials aus dem workload herausgehalten.
phrases.2: Ich habe die geringste Berechtigung und das Geheimnis verbrauchende endpoint überprüft.
questions.0.points.0: Die Modelle manifests und runtime Secret verfügen über separate Lieferwege.
questions.0.points.1: Eine Secret-Referenz erstellt nicht den referenzierten Wert.
questions.0.points.2: Überprüfen Sie die Autorisierung events, provider und den expliziten Synchronizer.
questions.0.prompt: Warum kann die Git-Synchronisierung erfolgreich sein, während ein Geheimnis verbrauchendes Pod
  blockiert bleibt?
questions.1.points.0: Liefern Sie nur den Wert, den die Anwendung benötigt.
questions.1.points.1: Halten Sie die Berechtigung provider im Gültigkeitsbereich und außerhalb von workload environment.
questions.1.points.2: Überprüfen Sie den verweigerten Zugriff sowie den beabsichtigten Lesezugriff.
questions.1.prompt: Soll die Bewerbung ein Vault administratives token erhalten?
