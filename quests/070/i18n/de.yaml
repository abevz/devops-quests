title: Lieferung von Geheimnissen
brief: 'Eine private Git-Version und die von Vault unterstützte Version runtime secret sind beide blockiert.
  Stellen Sie zunächst den Quellpfad Application auf manifests wieder her und beweisen Sie, dass der aufgezeichnete
  Commit Synced ist. es bleibt bis zur zweiten Stufe ungesund. Reparieren Sie dann das Spiel reader policy
  nur für dispatch, führen Sie explizit sync-secret.sh aus und überprüfen Sie das geheimnisfressende HTTP
  board. Der Helfer ist ein On-Demand-Synchronisierer und kein Hintergrundoperator. Nein Vault token darf
  das workload eingeben.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `platform.env`, `reader.hcl`, `reader-policy.json`,
  `sync-secret.sh`, `application.json`, `repository/manifests/board.json`, `repository/manifests/service.json`,
  `release-commit`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: Der aufgezeichnete Git revision ist Synced von manifests und der Deployment
  fordert nur route-secret/value. an'
debrief: Die Lieferung GitOps und die Lieferung runtime secret wurden als separate Phasen mit einem gemeinsamen
  verifizierten Ergebnis wiederhergestellt.
stages.0.brief: 'Erfolgskriterien: Der aufgezeichnete Git revision ist Synced von manifests und der Deployment
  fordert nur route-secret/value. an'
stages.0.objectives.0.text: Der aufgezeichnete Git revision ist Synced von manifests und der Deployment
  fordert nur route-secret/value. an
stages.1.brief: 'Erfolgskriterien: Der reader mit den geringsten Privilegien liefert den Secret; Argo
  ist Healthy und der echte board gibt north-70 ohne workload Vault-Token zurück.'
stages.1.objectives.0.text: Der reader mit den geringsten Privilegien liefert den Secret; Argo ist Healthy
  und der echte board gibt north-70 ohne workload Vault-Token zurück.
hints.0.text: Stellen Sie die Git-Synchronisierung wieder her, bevor Sie das fehlende runtime Secret diagnostizieren.
hints.1.text: Verwenden Sie den Pfad KV v2 data und gewähren Sie dispatch Schreibschutz.
hints.2.text: Führen Sie den bereitgestellten Synchronizer explizit aus und überprüfen Sie dann die Referenzen
  capabilities, Secret, health und HTTP.
phrases.0: Ich habe den Git-Abgleich von der runtime secret-Lieferung getrennt.
phrases.1: Ich habe Vault credentials aus dem workload herausgehalten.
phrases.2: Ich habe die geringste Berechtigung und das Geheimnis verbrauchende endpoint überprüft.
questions.0.points.0: Die Modelle manifests und runtime Secret verfügen über separate Lieferwege.
questions.0.points.1: Eine Secret-Referenz erstellt nicht den referenzierten Wert.
questions.0.points.2: Überprüfen Sie die Autorisierung events, provider und den expliziten Synchronizer.
questions.0.prompt: Warum kann die Git-Synchronisierung erfolgreich sein, während ein Geheimnis verbrauchendes
  Pod blockiert bleibt?
questions.1.points.0: Liefern Sie nur den Wert, den die Anwendung benötigt.
questions.1.points.1: Halten Sie die Berechtigung provider im Gültigkeitsbereich und außerhalb von workload
  environment.
questions.1.points.2: Überprüfen Sie den verweigerten Zugriff sowie den beabsichtigten Lesezugriff.
questions.1.prompt: Soll die Bewerbung ein Vault administratives token erhalten?
