title: Доставка секретов
brief: 'Заблокированы приватный Git-релиз и его runtime secret из Vault. Сначала верните Application путь
  manifests и подтвердите Synced для записанного commit; до второго этапа workload останется неисправным.
  Затем исправьте игровую reader policy только для dispatch, явно выполните sync-secret.sh и проверьте
  HTTP board, использующий secret. Helper — синхронизатор по запросу, не фоновый оператор; Vault token
  не должен попадать в workload.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `platform.env`, `reader.hcl`, `reader-policy.json`,
  `sync-secret.sh`, `application.json`, `repository/manifests/board.json`, `repository/manifests/service.json`,
  `release-commit`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Записанный Git revision Synced из manifests, Deployment запрашивает только route-secret/value.'
debrief: GitOps и доставка runtime secret восстановлены отдельными этапами с общим проверенным результатом.
