title: Доставка секретов
brief: "Записанный Git-релиз и потребляющий секрет сервис ещё не доступны вместе.\n\nРаботайте в `~/quest` на рабочей\
  \ станции. Входные файлы по этапам:\n- Этап 1: `platform.env`, `application.yaml`, `repository/manifests/board.yaml`,\
  \ `repository/manifests/service.yaml`.\n- Этап 2: `reader.hcl`, `reader-policy.json`, `sync-secret.sh`.\n\n**Требования:**\n\
  \n- Этап 1:\n  - Application `board` сообщает `Synced` для требуемой опубликованной ревизии.\n  - Deployment `board`\
  \ получает значение runtime только через поставленную ссылку на Secret, а не как встроенное значение.\n- Этап\
  \ 2:\n  - Application `board` сообщает `Synced` и `Healthy` для опубликованной ревизии релиза.\n  - Deployment\
  \ `board` завершает развёртывание.\n  - Deployment `board` получает значение runtime только через поставленную\
  \ ссылку на Secret, а не как встроенное значение.\n  - Secret нагрузки содержит значение требуемой записи Vault.\n\
  \  - Токен доступа Vault имеет доступ только на чтение к требуемой записи доставки; отдельная посторонняя запись\
  \ и управление mount запрещены.\n  - Из Deployment `board` адрес `http://board:8080` возвращает `north-70`.\n\n\
  Проверка наблюдает записанную ревизию, выбранную ссылку Secret и три пути capabilities читателя; она не доказывает\
  \ фоновую синхронизацию или права на все остальные пути Vault."
debrief: GitOps и доставка runtime secret восстановлены отдельными этапами с общим проверенным результатом.
stages.0.brief: Записанный релиз должен согласоваться до оценки его runtime.
stages.1.brief: Согласованный сервис должен потреблять нужный секрет при ограниченном доступе читателя.
hints.0.text: Согласование источника и доставка секрета runtime — разные границы. Одна записанная ревизия не доказывает,
  что её потребитель сможет запуститься.
hints.1.text: 'Восстановите синхронизацию Git до анализа недостающего runtime Secret. Каталог источника Application
  — `manifests`; согласуйте записанную ревизию, прежде чем ожидать здоровый runtime.


  Используйте data path KV v2 и read только для dispatch.


  Изучите поставленные определения, описания ресурсов и события соответствующего этапа.


  ```sh

  cat application.yaml

  cat reader.hcl

  kubectl describe application board

  kubectl describe deployment board

  kubectl describe pod -l app=board

  ```


  Этап 1/2: Изучите определения этих ресурсов для данного этапа.


  ```sh

  kubectl get application board -o yaml

  kubectl get deployment board -o yaml

  kubectl get pods -l app=board -o yaml

  ```'
hints.2.text: |-
  Явно запустите выданный синхронизатор, проверьте capabilities, ссылку Secret, health и HTTP. Синхронизатор запускается по запросу, а не в фоне; не помещайте токены Vault в нагрузку.

  Проверьте исправленный этап и сравните наблюдаемый результат.

  Этап 1/2: Контроллер сообщает `Synced` для ожидаемой ревизии; на последнем этапе также сообщает `Healthy`, нагрузка готова.

  ```sh
  kubectl get application board -o jsonpath='{.status.sync.status} {.status.health.status} {.status.sync.revision}'; printf '\n'
  kubectl get deployment board
  ```

  Этап 2: Значение Secret выводит `north-secret`; потребитель приложения получает `north-70`.

  ```sh
  kubectl get secret route-secret -o jsonpath='{.data.value}' | base64 -d
  printf '\n'
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080
  ```

  Этап 2: Запрос capabilities возвращает `read` для `secret/data/dispatch` и `deny` для `secret/data/unrelated` и `sys/mounts`; он не меняет политику.

  ```sh
  source platform.env
  curl -fsS -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_READER_TOKEN") -H 'Content-Type: application/json' --request POST --data '{"paths":["secret/data/dispatch","secret/data/unrelated","sys/mounts"]}' "$VAULT_ADDR/v1/sys/capabilities-self"
  ```

  Ожидаемые наблюдения для этапа целиком:
  - Этап 1/2: Показанные согласование, конфигурация нагрузки и наблюдения работающего образа соответствуют требованиям этого этапа.

phrases.0: Я разделил сверку Git и доставку runtime secret.
phrases.1: Я не передавал credentials Vault в workload.
phrases.2: Я проверил минимальные права и endpoint, использующий secret.
questions.0.points.0: Manifests и runtime Secret доставляются разными путями.
questions.0.points.1: Ссылка Secret не создаёт значение.
questions.0.points.2: Изучить events, авторизацию provider и явный синхронизатор.
questions.0.prompt: Почему Git sync может завершиться, а Pod с secret остаться заблокированным?
questions.1.points.0: Доставлять только нужное приложению значение.
questions.1.points.1: Ограничить полномочия provider и держать их вне workload environment.
questions.1.points.2: Проверять запрещённый доступ наряду с нужным read.
questions.1.prompt: Нужно ли передавать приложению административный token Vault?
