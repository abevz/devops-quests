diagnostics.secret_git_path: Выданный Application начинает с retired; выберите manifests и синхронизируйте release-commit. Первая стадия не требует Healthy, пока Secret отсутствует. [Причина и проверка](guides#guide=gitops-delivery&section=secret-first-stage-path-and-sync)
diagnostics.board_env: ROUTE_SECRET может дублироваться, быть литералом или ссылаться на другой ключ; объявление worker требует только secretKeyRef на route-secret/value в valueFrom без поля value. [Причина и проверка](guides#guide=gitops-delivery&section=secret-declared-env-reference)
diagnostics.probe_0_1: Helper окружения может завершиться до чтения Deployment, например на импортах; ошибки API или структуры нагрузки внутри helper дают board_env. [Причина и проверка](guides#guide=gitops-delivery&section=secret-stage-zero-helper-startup)
diagnostics.probe_1_2: Helper окружения второй стадии может не запуститься до выдачи board_env; проверьте импорты и runtime перед изменением ссылки Secret. [Причина и проверка](guides#guide=gitops-delivery&section=secret-stage-one-helper-startup)
diagnostics.secret_git_health: Application может отслеживать другой репозиторий/ветку/ревизию либо оставаться нездоровым без доставленного Secret; сравните source и status после синхронизации. [Причина и проверка](guides#guide=gitops-delivery&section=secret-second-stage-source-health)
diagnostics.secret_rollout: Отсутствующий Secret/ключ мешает запуску выданного Pod; проверьте events и доставленный вход перед повторным ожиданием rollout. [Причина и проверка](guides#guide=gitops-delivery&section=secret-missing-input-and-rollout)
diagnostics.secret_value: Исправление политики Vault само не доставляет значение в Kubernetes; выданный sync-secret.sh должен прочитать и опубликовать route-secret/value. [Причина и проверка](guides#guide=vault-recovery&section=secret-vault-to-kubernetes-publication)
diagnostics.secret_capabilities: Выданная политика reader обращается к неверному пути KV-v2 либо даёт лишний доступ; нужны read на secret/data/dispatch и deny на secret/data/unrelated и sys/mounts. [Причина и проверка](guides#guide=vault-recovery&section=secret-reader-exact-path-capabilities)
diagnostics.secret_http: Service может не иметь готовых endpoints либо выдавать другой маршрут; проверьте selector, rollout и HTTP-ответ. Сам ответ не доказывает значение окружения процесса. [Причина и проверка](guides#guide=gitops-delivery&section=secret-service-http-route)
