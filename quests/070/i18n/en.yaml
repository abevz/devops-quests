title: Secrets delivery
brief: 'A private Git release and its Vault-backed runtime secret are both blocked. First restore the
  Application source path to manifests and prove the recorded commit is Synced; it will remain unhealthy
  until stage two. Then repair the game reader policy for dispatch only, explicitly run sync-secret.sh
  and verify the secret-consuming HTTP board. The helper is an on-demand synchronizer, not a background
  operator; no Vault token may enter the workload.


  Quest files in `~/quest` (some appear in later stages): `platform.env`, `reader.hcl`, `reader-policy.json`,
  `sync-secret.sh`, `application.json`, `repository/manifests/board.json`, `repository/manifests/service.json`,
  `release-commit`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: The recorded Git revision is Synced from manifests and the Deployment requests
  only route-secret/value.'
debrief: GitOps delivery and runtime secret delivery were recovered as separate stages with a shared verified
  outcome.
