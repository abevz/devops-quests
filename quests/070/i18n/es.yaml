title: Entrega de secretos
brief: 'Tanto una versión privada Git como su runtime secret respaldado por Vault están bloqueados. Primero
  restaure la ruta de origen Application a manifests y demuestre que la confirmación registrada es Synced;
  permanecerá insalubre hasta la etapa dos. Luego repare el juego reader policy solo para dispatch, ejecute
  explícitamente sync-secret.sh y verifique el HTTP board que consume secretos. El asistente es un sincronizador
  bajo demanda, no un operador en segundo plano; ningún Vault token podrá ingresar al workload.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `platform.env`, `reader.hcl`,
  `reader-policy.json`, `sync-secret.sh`, `application.json`, `repository/manifests/board.json`, `repository/manifests/service.json`,
  `release-commit`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: El Git revision registrado es Synced de manifests y el Deployment solo
  solicita route-secret/value..'
debrief: La entrega de GitOps y la entrega de runtime secret se recuperaron como etapas separadas con
  un resultado verificado compartido.
stages.0.brief: 'Criterios de éxito: El Git revision registrado es Synced de manifests y el Deployment
  solo solicita route-secret/value..'
stages.0.objectives.0.text: El Git revision registrado es Synced de manifests y el Deployment solicita
  solo route-secret/value.
stages.1.brief: 'Criterios de éxito: el reader con privilegios mínimos ofrece el Secret; Argo es Healthy
  y el board real devuelve north-70 sin tokens workload Vault.'
stages.1.objectives.0.text: El reader con menos privilegios ofrece el Secret; Argo es Healthy y el board
  real devuelve north-70 sin tokens workload Vault.
hints.0.text: Restaure la sincronización de Git antes de diagnosticar el runtime Secret faltante.
hints.1.text: Utilice la ruta KV v2 data y otorgue solo lectura a dispatch.
hints.2.text: Ejecute el sincronizador suministrado explícitamente, luego verifique capabilities, referencia
  Secret, health y HTTP.
phrases.0: Separé la conciliación Git de la entrega runtime secret.
phrases.1: Mantuve el Vault credentials fuera del workload.
phrases.2: Verifiqué el privilegio mínimo y el endpoint que consume secretos.
questions.0.points.0: manifests y runtime Secret tienen rutas de entrega independientes.
questions.0.points.1: Una referencia Secret no crea el valor referenciado.
questions.0.points.2: Inspeccione la autorización events, provider y el sincronizador explícito.
questions.0.prompt: ¿Por qué la sincronización de Git puede tener éxito mientras un Pod que consume secretos
  permanece bloqueado?
questions.1.points.0: Entregue solo el valor que necesita la aplicación.
questions.1.points.1: Mantenga la autoridad provider dentro del alcance y fuera de workload environment.
questions.1.points.2: Verifique el acceso denegado y la lectura prevista.
questions.1.prompt: ¿La aplicación debe recibir un Vault administrativo token?
