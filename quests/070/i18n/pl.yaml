title: Dostawa tajemnic
brief: "Wydanie zapisane w Git i usługa korzystająca z sekretu nie są jeszcze dostępne razem.\n\nPracuj w `~/quest`\
  \ na stacji roboczej. Dane wejściowe według etapu:\n- Etap 1: `platform.env`, `application.yaml`, `repository/manifests/board.yaml`,\
  \ `repository/manifests/service.yaml`.\n- Etap 2: `reader.hcl`, `reader-policy.json`, `sync-secret.sh`.\n\n**Wymagania:**\n\
  \n- Etap 1:\n  - Application `board` zgłasza `Synced` dla właściwej opublikowanej rewizji.\n  - Deployment `board`\
  \ pobiera wartość runtime tylko przez dostarczone odwołanie Secret, nigdy jako osadzoną wartość.\n- Etap 2:\n\
  \  - Application `board` zgłasza `Synced` i `Healthy` dla opublikowanej rewizji wydania.\n  - Deployment `board`\
  \ kończy rollout.\n  - Deployment `board` pobiera wartość runtime tylko przez dostarczone odwołanie Secret, nigdy\
  \ jako osadzoną wartość.\n  - Secret obciążenia zawiera wartość właściwego wpisu Vault.\n  - Token dostępu Vault\
  \ ma dostęp tylko do odczytu właściwego wpisu dostarczania; osobny obcy wpis i zarządzanie mount są zabronione.\n\
  \  - Z Deployment `board` adres `http://board:8080` zwraca `north-70`.\n\nSprawdzenie obserwuje zapisaną rewizję,\
  \ wybrane odwołanie Secret i trzy ścieżki capabilities czytelnika; nie dowodzi synchronizacji w tle ani uprawnień\
  \ do wszystkich pozostałych ścieżek Vault."
debrief: Dostawę GitOps i dostawę runtime secret odzyskano jako oddzielne etapy, których wynik był wspólny i zweryfikowany.
stages.0.brief: Zapisane wydanie musi zostać uzgodnione przed oceną runtime.
stages.1.brief: Uzgodniona usługa musi korzystać z właściwego sekretu przy ograniczonym dostępie czytelnika.
hints.0.text: Uzgodnienie źródła i dostarczenie sekretu runtime to osobne granice. Sama zapisana rewizja nie dowodzi,
  że jej odbiorca może się uruchomić.
hints.1.text: |-
  Na pierwszym etapie porównaj zapisaną rewizję Git ze źródłem Application i bieżącym statusem. Na drugim sprawdź ścieżkę w polityce Vault, synchronizator i odwołanie do Secretu w działającym workloadzie.

  Sprawdź metadane i stan bieżącego etapu.

  ```sh
  cat application.yaml
  cat reader.hcl
  kubectl describe application board
  kubectl describe deployment board
  kubectl describe pod -l app=board
  ```

  Etap 1/2: Sprawdź te definicje zasobów dla tego etapu.

  ```sh
  kubectl get application board -o yaml
  kubectl get deployment board -o yaml
  kubectl get pods -l app=board -o yaml
  ```
hints.2.text: |-
  Sprawdź naprawiony etap i porównaj obserwowany wynik.

  Etap 1/2: Kontroler zgłasza `Synced` dla oczekiwanej rewizji; w ostatnim etapie zgłasza też `Healthy`, a obciążenie jest gotowe.

  ```sh
  kubectl get application board -o jsonpath='{.status.sync.status} {.status.health.status} {.status.sync.revision}'; printf '\n'
  kubectl get deployment board
  ```

  Etap 2. Porównanie Secretu kończy się kodem 0 bez wyświetlania wartości. Aplikacja zwraca `north-70`.

  ```sh
  kubectl get secret route-secret -o jsonpath='{.data.value}' | base64 -d | grep -Fxq 'north-secret'
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080
  ```

  Etap 2: Zapytanie o capabilities zwraca `read` dla `secret/data/dispatch` i `deny` dla `secret/data/unrelated` oraz `sys/mounts`; nie zmienia polityki.

  ```sh
  source platform.env
  curl -fsS -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_READER_TOKEN") -H 'Content-Type: application/json' --request POST --data '{"paths":["secret/data/dispatch","secret/data/unrelated","sys/mounts"]}' "$VAULT_ADDR/v1/sys/capabilities-self"
  ```

  Oczekiwane obserwacje dla całego etapu:
  - Etap 1/2: Wyświetlone uzgodnienie, konfiguracja obciążenia i obserwacje działającego obrazu spełniają wymagania tego etapu.
phrases.0: Oddzieliłem uzgodnienie Git od dostawy runtime secret.
phrases.1: Trzymałem dane uwierzytelniające Vault poza workload.
phrases.2: Sprawdziłem najniższe uprawnienia i endpoint zużywający secret.
questions.0.points.0: Manifesty i runtime Secret mają oddzielne ścieżki dostawy.
questions.0.points.1: Odniesienie Secret nie tworzy wartości odniesienia.
questions.0.points.2: Sprawdź autoryzację events, provider i jawny synchronizator.
questions.0.prompt: Dlaczego synchronizacja Git może się powieść, podczas gdy Pod zużywający secret pozostaje zablokowany?
questions.1.points.0: Dostarczaj tylko taką wartość, jakiej potrzebuje aplikacja.
questions.1.points.1: Utrzymuj zakres uprawnień provider i poza workload environment.
questions.1.points.2: Sprawdź odmowę dostępu oraz zamierzony read.
questions.1.prompt: Czy aplikacja powinna otrzymać token administracyjny Vault?
stages.0.objectives.0.text: Application `board` zgłasza `Synced` dla właściwej opublikowanej rewizji.
stages.0.objectives.1.text: Deployment `board` pobiera wartość runtime tylko przez dostarczone odwołanie Secret,
  nigdy jako osadzoną wartość.
stages.1.objectives.0.text: Application `board` zgłasza `Synced` i `Healthy` dla opublikowanej rewizji wydania.
stages.1.objectives.1.text: Deployment `board` kończy rollout.
stages.1.objectives.2.text: Deployment `board` pobiera wartość runtime tylko przez dostarczone odwołanie Secret,
  nigdy jako osadzoną wartość.
stages.1.objectives.3.text: Secret obciążenia zawiera wartość właściwego wpisu Vault.
stages.1.objectives.4.text: Token dostępu Vault ma dostęp tylko do odczytu właściwego wpisu dostarczania; osobny
  obcy wpis i zarządzanie mount są zabronione.
stages.1.objectives.5.text: Z Deployment `board` adres `http://board:8080` zwraca `north-70`.
diagnostics.secret_git_path: Dostarczony Application zaczyna od retired; wybierz manifests i zsynchronizuj release-commit. Pierwszy etap nie wymaga Healthy, gdy Secret jeszcze nie istnieje. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=secret-first-stage-path-and-sync)
diagnostics.board_env: ROUTE_SECRET może być powielony, literalny lub wskazywać inny klucz; deklaracja worker wymaga wyłącznie secretKeyRef do route-secret/value w valueFrom, bez pola value. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=secret-declared-env-reference)
diagnostics.probe_0_1: Helper środowiska może zawieść przed odczytem Deployment, np. przy importach; błędy API lub struktury aplikacji wewnątrz helper dają board_env. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=secret-stage-zero-helper-startup)
diagnostics.probe_1_2: Helper środowiska drugiego etapu może zawieść przy starcie przed board_env; sprawdź importy i runtime przed zmianą odwołania Secret. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=secret-stage-one-helper-startup)
diagnostics.secret_git_health: Application może śledzić inne repozytorium/gałąź/rewizję lub być niesprawny bez dostarczonego Secret; porównaj source i status po synchronizacji. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=secret-second-stage-source-health)
diagnostics.secret_rollout: Brak Secret/klucza może blokować start dostarczonego Pod; sprawdź events i dostarczone wejście przed ponownym oczekiwaniem rollout. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=secret-missing-input-and-rollout)
diagnostics.secret_value: Sama poprawa polityki Vault nie dostarcza wartości do Kubernetes; dostarczony sync-secret.sh musi odczytać i opublikować route-secret/value. [Przyczyna i kontrola](guides#guide=vault-recovery&section=secret-vault-to-kubernetes-publication)
diagnostics.secret_capabilities: Dostarczona polityka reader wskazuje błędną ścieżkę KV-v2 lub daje dodatkowy dostęp; wymagane read na secret/data/dispatch oraz deny na secret/data/unrelated i sys/mounts. [Przyczyna i kontrola](guides#guide=vault-recovery&section=secret-reader-exact-path-capabilities)
diagnostics.secret_http: Service może nie mieć gotowych endpoints lub zwracać inną trasę; sprawdź selector, rollout i HTTP. Sama odpowiedź nie dowodzi wartości środowiska procesu. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=secret-service-http-route)
