title: Dostawa tajemnic
brief: 'Zarówno prywatna wersja Git, jak i jej runtime secret oparta na Vault są zablokowane. Najpierw
  przywróć ścieżkę źródłową Application do manifests i udowodnij, że zarejestrowany commit to Synced;
  pozostanie niezdrowy aż do drugiego etapu. Następnie napraw grę reader policy tylko dla dispatch, jawnie
  uruchom sync-secret.sh i zweryfikuj zużywający sekret HTTP board. Pomocnik jest synchronizatorem na
  żądanie, a nie operatorem działającym w tle; żaden Vault token nie może wejść do workload.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `platform.env`, `reader.hcl`,
  `reader-policy.json`, `sync-secret.sh`, `application.json`, `repository/manifests/board.json`, `repository/manifests/service.json`,
  `release-commit`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: zarejestrowana wersja Git to Synced z manifests, a Deployment żąda tylko
  route-secret/value.'
debrief: Dostawę GitOps i dostawę runtime secret odzyskano jako oddzielne etapy, których wynik był wspólny
  i zweryfikowany.
stages.0.brief: 'Kryteria sukcesu: Zarejestrowana wersja Git ma stan Synced z manifests, a Deployment
  żąda tylko route-secret/value.'
stages.0.objectives.0.text: Nagrana wersja Git ma stan Synced z manifests, a Deployment żąda tylko route-secret/value.
stages.1.brief: 'Kryteria sukcesu: reader o najniższych uprawnieniach dostarcza Secret; Argo ma stan Healthy,
  a prawdziwy board zwraca north-70 bez tokenów Vault workload.'
stages.1.objectives.0.text: reader o najniższych uprawnieniach zapewnia Secret; Argo ma stan Healthy,
  a prawdziwy board zwraca north-70 bez tokenów Vault workload.
hints.0.text: Przywróć synchronizację Git przed zdiagnozowaniem brakującego runtime Secret.
hints.1.text: Użyj ścieżki danych KV v2 i nadaj read tylko dispatch.
hints.2.text: Uruchom jawnie dostarczony synchronizator, a następnie sprawdź capabilities, Secret, health
  i HTTP.
phrases.0: Oddzieliłem uzgodnienie Git od dostawy runtime secret.
phrases.1: Trzymałem dane uwierzytelniające Vault poza workload.
phrases.2: Sprawdziłem najniższe uprawnienia i endpoint zużywający secret.
questions.0.points.0: Manifesty i runtime Secret mają oddzielne ścieżki dostawy.
questions.0.points.1: Odniesienie Secret nie tworzy wartości odniesienia.
questions.0.points.2: Sprawdź autoryzację events, provider i jawny synchronizator.
questions.0.prompt: Dlaczego synchronizacja Git może się powieść, podczas gdy Pod zużywający secret pozostaje
  zablokowany?
questions.1.points.0: Dostarczaj tylko taką wartość, jakiej potrzebuje aplikacja.
questions.1.points.1: Utrzymuj zakres uprawnień provider i poza workload environment.
questions.1.points.2: Sprawdź odmowę dostępu oraz zamierzony read.
questions.1.prompt: Czy aplikacja powinna otrzymać token administracyjny Vault?
