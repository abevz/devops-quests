id: 70
title: title
track: Boss
difficulty: complex
brief: brief
stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    check: 'source platform.env

      kubectl get application board -o json | jq -e --arg rev "$(cat release-commit)" ''.spec.source.path=="manifests"
      and .status.sync.status=="Synced" and .status.sync.revision==$rev'' >/dev/null

      '
  - text: stages.0.objectives.1.text
    check: 'kubectl get deployment board -o json | jq -e ''.spec.template.spec.containers[0].env==[{name:"ROUTE_SECRET",valueFrom:{secretKeyRef:{name:"route-secret",key:"value"}}}]''
      >/dev/null

      '
- brief: stages.1.brief
  objectives:
  - text: stages.1.objectives.0.text
    check: 'source platform.env

      kubectl get application board -o json | jq -e --arg rev "$(cat release-commit)" --arg url "$GIT_URL" ''.spec.source.repoURL==$url
      and .spec.source.path=="manifests" and .spec.source.targetRevision=="main" and .status.sync.status=="Synced"
      and .status.health.status=="Healthy" and .status.sync.revision==$rev'' >/dev/null

      '
  - text: stages.1.objectives.1.text
    check: 'source platform.env

      kubectl rollout status deployment/board --timeout=3s >/dev/null

      '
  - text: stages.1.objectives.2.text
    check: 'source platform.env

      kubectl get deployment board -o json | jq -e ''.spec.template.spec.containers[0].env==[{name:"ROUTE_SECRET",valueFrom:{secretKeyRef:{name:"route-secret",key:"value"}}}]''
      >/dev/null

      '
  - text: stages.1.objectives.3.text
    check: 'source platform.env

      test "$(kubectl get secret route-secret -o jsonpath=''{.data.value}'' | base64 -d)" = north-secret

      '
  - text: stages.1.objectives.4.text
    check: 'source platform.env

      curl -fsS -H "X-Vault-Token: $VAULT_READER_TOKEN" -H ''Content-Type: application/json'' --request POST --data
      ''{"paths":["secret/data/dispatch","secret/data/unrelated","sys/mounts"]}'' "$VAULT_ADDR/v1/sys/capabilities-self"
      | jq -e ''."secret/data/dispatch"==["read"] and ."secret/data/unrelated"==["deny"] and ."sys/mounts"==["deny"]''
      >/dev/null

      '
  - text: stages.1.objectives.5.text
    check: 'source platform.env

      test "$(kubectl exec deployment/board -- wget -qO- -T 3 http://board:8080)" = north-70

      '
hints:
- text: hints.0.text
  guide: gitops-delivery
- text: hints.1.text
  guide: vault-recovery
- text: hints.2.text
  guide: vault-recovery
debrief: debrief
phrases:
- phrases.0
- phrases.1
- phrases.2
questions:
- prompt: questions.0.prompt
  points:
  - questions.0.points.0
  - questions.0.points.1
  - questions.0.points.2
- prompt: questions.1.prompt
  points:
  - questions.1.points.0
  - questions.1.points.1
  - questions.1.points.2
facts:
  environment:
  - DQ_NAMESPACE
  - DQ_APP_IMAGE
  - KUBECONFIG
  - TF_CLI_CONFIG_FILE
  files:
  - platform.env
  - reader.hcl
  - reader-policy.json
  - sync-secret.sh
  - application.yaml
  - repository/manifests/board.yaml
  - repository/manifests/service.yaml
  services: []
book:
  chapter: 11
  section: GitOps and runtime secrets
  topics:
  - gitops
  - argocd
  - vault
  - secrets
