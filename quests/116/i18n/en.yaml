title: Custom resource reconciliation
brief: "The managed board endpoint is not providing the required route. Restore a reconciled, ready result under\
  \ the training controller.\n\nWork in `~/quest` on the workstation. Supplied files: `station.json`, `client.json`.\n\
  \n**Requirements:**\n\n- Deployment `board`, ConfigMap `board-route` and Service `board` are controlled by the\
  \ live StationBoard `station`; the Deployment retains controller label `devops-quests.controller=station-board`.\n\
  \  - Controller ownership uses API version `training.devops-quests.local/v1`, kind `StationBoard`, name `station`\
  \ and its live UID. `index.html` is a ConfigMap data entry, not a workstation file.\n- StationBoard `station`\
  \ has desired route `north-116`, is ready for its current generation with one ready `board` replica, and ConfigMap\
  \ `board-route` provides `index.html` containing `north-116` followed by a newline.\n- From Deployment `client`,\
  \ `http://board:8080` returns `north-116`.\n\n**Verify yourself before Check & finish:** Run these observation\
  \ commands from `~/quest` on the workstation.\n\n- Settings, identity and status match Requirements.\n\n  ```sh\n\
  \  kubectl get stationboard station -o yaml\n  kubectl get deployment board -o yaml\n  kubectl get configmap board-route\
  \ -o yaml\n  kubectl get service board -o yaml\n  ```\n\n- `kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080`\
  \ — The consumer receives `north-116`.\n\nChecks observe current state, not whether generated resources were hand-edited;\
  \ this bounded backend-polled training controller is not a general-purpose operator framework."
debrief: The exercise used a real API object, desired-state loop, generated workload and status subresource.
stages.0.brief: The controller-managed route must be reconciled and available.
hints.0.text: A CRD adds an API; the controller implements behavior. The supplied desired route is closed. Change
  the desired spec rather than generated resources or status.
hints.1.text: Change desired spec and inspect status.observedGeneration.
hints.2.text: Set route north-116 and wait for both reconciliation and projected ConfigMap delivery.
phrases.0: I changed desired state on the custom resource.
phrases.1: I checked the controller observed generation.
phrases.2: I verified the reconciled application response.
questions.0.points.0: No; it defines storage, schema and API shape.
questions.0.points.1: A controller must implement the desired-state loop.
questions.0.prompt: Does installing a CRD implement reconciliation?
questions.1.points.0: It identifies which desired revision the controller handled.
questions.1.points.1: Ready from an old generation may be stale.
questions.1.prompt: Why compare observedGeneration with generation?
diagnostics.owner_deployment_board: Deployment board must have station as controller owner.
diagnostics.owner_configmap_board_route: ConfigMap board-route must have station as controller owner.
diagnostics.owner_service_board: Service board must have station as controller owner.
diagnostics.route: Station route must equal north-116.
diagnostics.generation: Station observedGeneration must match the current generation.
diagnostics.station_ready: Station ready must be true.
diagnostics.label: Deployment board controller label must equal station-board.
diagnostics.ready: Board must have one ready replica.
diagnostics.data: ConfigMap board-route index.html must be north-116 followed by a newline.
diagnostics.http: board:8080 must return north-116.
