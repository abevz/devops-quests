title: Custom resource reconciliation
brief: 'A StationBoard custom resource drives a tiny training operator. The operator
  runs in the game backend on its normal poll cadence, reads only this bay''s station
  object and reconciles a bounded ConfigMap, Deployment and Service. Its current desired
  route is closed. Change spec.route to north-116; do not hand-edit generated resources
  or status. Verify observedGeneration, ready status and real HTTP. This controller
  is intentionally narrow, not a general-purpose operator framework.


  Quest files in `~/quest` (some appear in later stages): `station.json`, `client.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images
  and private services. Change only this bay.


  Initial success criteria: The actual operator observes the new generation, reconciles
  one healthy board and serves north-116.'
debrief: The exercise used a real API object, desired-state loop, generated workload
  and status subresource.
