title: Custom resource reconciliation
brief: 'A StationBoard custom resource drives a tiny training operator. The operator runs in the game backend on its normal
  poll cadence, reads only this bay''s station object and reconciles a bounded ConfigMap, Deployment and Service. Its current
  desired route is closed. Change spec.route to north-116; do not hand-edit generated resources or status. Verify observedGeneration,
  ready status and real HTTP. This controller is intentionally narrow, not a general-purpose operator framework.


  Quest files in `~/quest` (some appear in later stages): `station.json`, `client.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services. Change only this
  bay.


  The supplied `station.json` describes the custom resource and `client.json` the deployment/client. The checks require `spec.route:
  north-116`, `status.observedGeneration` equal to the current generation and `status.ready: true`. Deployment `board`, ConfigMap
  `board-route` and Service `board` must each have a controller ownerReference with API version `training.devops-quests.local/v1`,
  kind `StationBoard`, name `station` and the live station UID. The Deployment label `devops-quests.controller` must be `station-board`
  and one replica ready; ConfigMap key `index.html` must be exactly `north-116` followed by a newline, and `board:8080` must
  return `north-116`. This is current state; it does not prove that generated resources were never hand-edited.'
debrief: The exercise used a real API object, desired-state loop, generated workload and status subresource.
stages.0.brief: The station status, owner references, generated objects and board response match the brief.
stages.0.objectives.0.text: The station status, owner references, generated objects and board response match the brief.
hints.0.text: A CRD adds an API; the controller implements behavior.
hints.1.text: Change desired spec and inspect status.observedGeneration.
hints.2.text: Set route north-116 and wait for both reconciliation and projected ConfigMap delivery.
phrases.0: I changed desired state on the custom resource.
phrases.1: I checked the controller observed generation.
phrases.2: I verified the reconciled application response.
questions.0.points.0: No; it defines storage, schema and API shape.
questions.0.points.1: A controller must implement the desired-state loop.
questions.0.prompt: Does installing a CRD implement reconciliation?
questions.1.points.0: It identifies which desired revision the controller handled.
questions.1.points.1: Ready from an old generation may be stale.
questions.1.prompt: Why compare observedGeneration with generation?
