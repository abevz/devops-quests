title: Custom resource reconciliation
brief: |-
  The controller-managed endpoint and its consumer do not agree on the current route. Recover reconciliation and delivery through the supplied resources.

  Work on the workstation in `~/quest` with `station.yaml` and `reconciliation-contract.json`.

  **Requirements:**
  - Keep the original StationBoard, generated route ConfigMap, consumer Deployment and consumer Service identities, and supplied immutable application images. Generated board resources retain their controller owner and supplied controller label.
  - The existing custom resource requests `north-116`. Its status acknowledges the current generation and is ready; the board has one ready replica and its generated route data contains `north-116` followed by a newline.
  - The original consumer completes rollout with one ready replica. Both the producer and consumer HTTP interfaces declared in the contract return the current route from the consumer workload.

  These checks observe current ownership, generation, readiness and HTTP delivery. The bounded backend-polled training controller is not a general-purpose operator framework; edit history and uninterrupted availability are not verified.
debrief: The controller reconciled its owned resources, but that did not by itself refresh a consumer file binding.
  Current generation and actual consumer delivery now agree.
stages.0.brief: The original consumer is rolled out and receives the current producer result through both declared
  HTTP interfaces.
hints.0.text: A controller can acknowledge desired state while a downstream process still consumes an older representation.
  Ownership, reconciliation and actual delivery are separate observations.
hints.1.text: Compare `station.yaml` and `reconciliation-contract.json` with the live custom resource/status, generated
  route data, consumer Pod volume mounts and `kubectl get pods,endpointslices -o yaml`. Compare the two actual HTTP
  responses.
hints.2.text: Recover desired state through the custom resource and check its observed generation and generated
  data. Refresh consumer delivery according to its mount lifetime; a retained file bind needs a new Pod mount. Wait
  for retiring Pods, then verify `kubectl rollout status deployment/client` and both declared HTTP interfaces. Expect
  current readiness, `north-116`, retained identities and controller ownership.
phrases.0: I changed desired state on the custom resource.
phrases.1: I checked the controller observed generation.
phrases.2: I verified the reconciled application response.
questions.0.points.0: No; it defines storage, schema and API shape.
questions.0.points.1: A controller must implement the desired-state loop.
questions.0.prompt: Does installing a CRD implement reconciliation?
questions.1.points.0: It identifies which desired revision the controller handled.
questions.1.points.1: Ready from an old generation may be stale.
questions.1.prompt: Why compare observedGeneration with generation?
diagnostics.owner_deployment_board: Deployment board must have station as controller owner.
diagnostics.owner_configmap_board_route: ConfigMap board-route must have station as controller owner.
diagnostics.owner_service_board: Service board must have station as controller owner.
diagnostics.route: Station route must equal north-116.
diagnostics.generation: Station observedGeneration must match the current generation.
diagnostics.station_ready: Station ready must be true.
diagnostics.label: Deployment board controller label must equal station-board.
diagnostics.ready: Board must have one ready replica.
diagnostics.data: ConfigMap board-route index.html must be north-116 followed by a newline.
diagnostics.http: board:8080 must return north-116.
stages.0.objectives.0.text: Generated resources retain controller ownership; original custom resource, route data
  and consumer identities and supplied images are retained.
stages.0.objectives.1.text: The existing StationBoard requests `north-116` and is ready for its current generation
  with one ready board replica; its generated page in the existing route ConfigMap contains `north-116` followed
  by a newline.
stages.0.objectives.2.text: The original consumer is rolled out and receives the current producer result through
  both declared HTTP interfaces.
diagnostics.reconciliation_identity: Keep the original custom resource, route ConfigMap, consumer Deployment and
  consumer Service UIDs.
diagnostics.reconciliation_image: Keep the supplied immutable producer and consumer images.
diagnostics.reconciliation_delivery: The original consumer must complete rollout with one ready replica and owned
  ready Pods.
diagnostics.reconciliation_service: The retained consumer Service must select its workload and expose the declared
  ClusterIP interface.
diagnostics.reconciliation_publication: The actual consumer interface must publish the current route.
diagnostics.probe_0_0: Generated resources retain controller ownership; original custom resource, route data and
