title: Custom resource reconciliation
brief: |-
  The managed board endpoint is not providing the required route. Restore a reconciled, ready result under the training controller.

  Work on the workstation in `~/quest` with the supplied files:
  - `station.yaml`, `client.yaml`.

  **Requirements:**

  - The board workload, its route data and Service remain owned by the existing StationBoard, with the supplied controller identity retained.
  - The existing StationBoard requests `north-116` and is ready for its current generation with one ready board replica; its generated page in the existing route ConfigMap contains `north-116` followed by a newline.
  - From Deployment `client`, `http://board:8080` returns `north-116`.

  Checks observe current state, not whether generated resources were hand-edited; this bounded backend-polled training controller is not a general-purpose operator framework.
debrief: The exercise used a real API object, desired-state loop, generated workload and status subresource.
stages.0.brief: The generated workload remains under the supplied controller’s ownership.
hints.0.text: A CRD adds an API; the controller implements behavior. The supplied desired route is closed.
  Change the desired spec rather than generated resources or status.
hints.1.text: |-
  Change desired spec and inspect status.observedGeneration.

  Inspect the supplied inputs and live observations:

  ```sh
  kubectl get stationboard station -o yaml
    kubectl get deployment board -o yaml
    kubectl get configmap board-route -o yaml
    kubectl get service board -o yaml
  ```
hints.2.text: |-
  Set route north-116 and wait for both reconciliation and projected ConfigMap delivery.

  Verify the result from `~/quest` on the workstation:

  - `kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080` — The consumer receives `north-116`.
phrases.0: I changed desired state on the custom resource.
phrases.1: I checked the controller observed generation.
phrases.2: I verified the reconciled application response.
questions.0.points.0: No; it defines storage, schema and API shape.
questions.0.points.1: A controller must implement the desired-state loop.
questions.0.prompt: Does installing a CRD implement reconciliation?
questions.1.points.0: It identifies which desired revision the controller handled.
questions.1.points.1: Ready from an old generation may be stale.
questions.1.prompt: Why compare observedGeneration with generation?
diagnostics.owner_deployment_board: Deployment board must have station as controller owner.
diagnostics.owner_configmap_board_route: ConfigMap board-route must have station as controller owner.
diagnostics.owner_service_board: Service board must have station as controller owner.
diagnostics.route: Station route must equal north-116.
diagnostics.generation: Station observedGeneration must match the current generation.
diagnostics.station_ready: Station ready must be true.
diagnostics.label: Deployment board controller label must equal station-board.
diagnostics.ready: Board must have one ready replica.
diagnostics.data: ConfigMap board-route index.html must be north-116 followed by a newline.
diagnostics.http: board:8080 must return north-116.
