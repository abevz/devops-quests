title: Custom resource reconciliation
brief: |-
  The controller-managed endpoint and its consumer do not agree on the current route. Recover reconciliation and delivery through the supplied resources.

  Work on the workstation in `~/quest` with `station.yaml` and `reconciliation-contract.json`.

  **Requirements:**
  - Keep the original StationBoard, generated route ConfigMap, consumer Deployment and consumer Service identities, and supplied immutable application images. Generated board resources retain their controller owner and supplied controller label.
  - The existing custom resource requests `north-116`. Its status acknowledges the current generation and is ready; the board has one ready replica and its generated route data contains `north-116` followed by a newline.
  - The original consumer completes rollout with one ready replica. Both the producer and consumer HTTP interfaces declared in the contract return the current route from the consumer workload.

  These checks observe current ownership, generation, readiness and HTTP delivery. The bounded backend-polled training controller is not a general-purpose operator framework; edit history and uninterrupted availability are not verified.
debrief: The controller reconciled its owned resources, but that did not by itself refresh a consumer file binding.
  Current generation and actual consumer delivery now agree.
stages.0.brief: The original consumer is rolled out and receives the current producer result through both declared
  HTTP interfaces.
hints.0.text: A controller can acknowledge desired state while a downstream process still consumes an older representation.
  Ownership, reconciliation and actual delivery are separate observations.
hints.1.text: Compare `station.yaml` and `reconciliation-contract.json` with the live custom resource/status, generated
  route data, consumer Pod volume mounts and `kubectl get pods,endpointslices -o yaml`. Compare the two actual HTTP
  responses.
hints.2.text: Recover desired state through the custom resource and check its observed generation and generated
  data. Refresh consumer delivery according to its mount lifetime; a retained file bind needs a new Pod mount. Wait
  for retiring Pods, then verify `kubectl rollout status deployment/client` and both declared HTTP interfaces. Expect
  current readiness, `north-116`, retained identities and controller ownership.
phrases.0: I changed desired state on the custom resource.
phrases.1: I checked the controller observed generation.
phrases.2: I verified the reconciled application response.
questions.0.points.0: No; it defines storage, schema and API shape.
questions.0.points.1: A controller must implement the desired-state loop.
questions.0.prompt: Does installing a CRD implement reconciliation?
questions.1.points.0: It identifies which desired revision the controller handled.
questions.1.points.1: Ready from an old generation may be stale.
questions.1.prompt: Why compare observedGeneration with generation?
stages.0.objectives.0.text: Generated resources retain controller ownership; original custom resource, route data
  and consumer identities and supplied images are retained.
stages.0.objectives.1.text: The existing StationBoard requests `north-116` and is ready for its current generation
  with one ready board replica; its generated page in the existing route ConfigMap contains `north-116` followed
  by a newline.
stages.0.objectives.2.text: The original consumer is rolled out and receives the current producer result through
  both declared HTTP interfaces.
diagnostics.owner_deployment_board: The affected object may have been created outside the StationBoard controller or refer to an obsolete owner UID. Compare its controller owner reference with the current StationBoard station in the supplied API group. [Cause and check](guides#guide=controllers-static&section=q116-station-controller-ownership)
diagnostics.owner_configmap_board_route: The affected object may have been created outside the StationBoard controller or refer to an obsolete owner UID. Compare its controller owner reference with the current StationBoard station in the supplied API group. [Cause and check](guides#guide=controllers-static&section=q116-station-controller-ownership)
diagnostics.owner_service_board: The affected object may have been created outside the StationBoard controller or refer to an obsolete owner UID. Compare its controller owner reference with the current StationBoard station in the supplied API group. [Cause and check](guides#guide=controllers-static&section=q116-station-controller-ownership)
diagnostics.label: The generated Deployment may lack its expected controller label or be unreadable. Inspect the board label for devops-quests.controller=station-board. [Cause and check](guides#guide=controllers-static&section=q116-station-controller-label)
diagnostics.reconciliation_identity: An object named in the frozen reconciliation receipt may have been recreated, permanently changing its UID. Compare each live UID with the captured one before repairing existing objects. [Cause and check](guides#guide=controllers-static&section=q116-station-retained-object-identities)
diagnostics.reconciliation_image: A producer or consumer template or a current consumer worker may use a different image. Compare the named containers with the frozen image or its immutable digest. [Cause and check](guides#guide=controllers-static&section=q116-station-retained-workload-image)
diagnostics.route: The source resource may still declare the old route while derived objects were edited. Set the intended route on the StationBoard station and let its controller reconcile. [Cause and check](guides#guide=controllers-static&section=q116-station-desired-route)
diagnostics.generation: The controller may still report an earlier revision of the custom resource. Compare observedGeneration with the live generation after the desired route change. [Cause and check](guides#guide=controllers-static&section=q116-station-current-generation)
diagnostics.station_ready: The reconciler may have observed the current generation without reporting ready. Inspect the StationBoard status and make sure its derived workload converges. [Cause and check](guides#guide=controllers-static&section=q116-station-controller-readiness)
diagnostics.ready: The generated board Deployment may not have its ready replica yet. Inspect current Pod events and wait for exactly one ready replica. [Cause and check](guides#guide=controllers-static&section=q116-station-generated-worker-ready)
diagnostics.data: The reconciler may have published old or incomplete content. Inspect index.html in board-route for north-116 followed by exactly one newline. [Cause and check](guides#guide=controllers-static&section=q116-station-generated-route-bytes)
diagnostics.http: The generated ConfigMap and controller status may be correct while board still serves stale content or is unreachable. Request the source Service from client and compare with north-116. [Cause and check](guides#guide=controllers-static&section=q116-station-source-http-response)
diagnostics.reconciliation_delivery: The client rollout may be pending or its current owned Pods may be unready. Check the rollout status, one desired and ready replica, and the readiness of its current Pods. [Cause and check](guides#guide=controllers-static&section=q116-station-consumer-rollout)
diagnostics.reconciliation_service: The consumer Service may have the wrong type, selector or port. Check that client-view is ClusterIP, its selector matches the client’s template labels, and it exposes one matching TCP 8080 port. [Cause and check](guides#guide=controllers-static&section=q116-station-consumer-publication-interface)
diagnostics.reconciliation_publication: The board source may be current while the separate client caches an earlier response or fails to publish it. Query client-view and check its exact north-116 body including the trailing newline. [Cause and check](guides#guide=controllers-static&section=q116-station-consumer-live-publication)
diagnostics.probe_0_0: The identity observer may exit before it reports a condition when its workstation tools or frozen inputs fail. Check access to the custom resource, generated objects and retained workloads. [Cause and check](guides#guide=controllers-static&section=q116-station-identity-observer-input)
diagnostics.probe_0_2: The delivery observer may exit before distinguishing source and publication failures if its process or inputs cannot start. Check the tools and access to client and client-view. [Cause and check](guides#guide=controllers-static&section=q116-station-delivery-observer-input)
