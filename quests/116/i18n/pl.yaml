title: Niestandardowe uzgadnianie zasobów
brief: 'Zasób niestandardowy StationBoard steruje małym operatorem treningowym. Operator działa w backendzie gry, w zwykłym
  cyklu odpytywania czyta tylko obiekt station tej zatoki i uzgadnia ograniczone ConfigMap, Deployment i Service. Obecna żądana
  trasa to closed. Zmień spec.route na north-116; nie edytuj ręcznie wygenerowanych zasobów ani statusu. Sprawdź observedGeneration,
  stan ready i rzeczywisty HTTP. Ten kontroler jest celowo ograniczony, nie jest uniwersalnym frameworkiem operatorów.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `station.json`, `client.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie załadowanych obrazów
  i usług prywatnych. Zmień tylko tę zatokę.


  Dostarczony `station.json` opisuje zasób niestandardowy, a `client.json` deployment/client. Kontrole wymagają `spec.route:
  north-116`, `status.observedGeneration` równego bieżącej generacji i `status.ready: true`. Deployment `board`, ConfigMap
  `board-route` i Service `board` muszą mieć controller ownerReference z API `training.devops-quests.local/v1`, kind `StationBoard`,
  nazwą `station` i bieżącym UID station. Etykieta Deployment `devops-quests.controller` musi mieć wartość `station-board`,
  a jedna replika być gotowa; klucz `index.html` ConfigMap musi zawierać dokładnie `north-116` i znak nowej linii, a `board:8080`
  zwrócić `north-116`. To stan bieżący; nie dowodzi, że wygenerowanych obiektów nigdy nie edytowano ręcznie.'
debrief: W ćwiczeniu wykorzystano prawdziwy obiekt API, pętlę pożądanego stanu, wygenerowane obciążenie pracą i podzasób stanu.
stages.0.brief: Status station, ownerReference, wygenerowane obiekty i odpowiedź board odpowiadają opisowi.
