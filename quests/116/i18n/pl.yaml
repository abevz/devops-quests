title: Niestandardowe uzgadnianie zasobów
brief: |-
  Endpoint zarządzany przez kontroler i jego odbiorca pokazują różne trasy. Przywróć uzgadnianie i dostarczanie przez udostępnione zasoby.

  Pracuj na stacji roboczej w `~/quest` z `station.yaml` i `reconciliation-contract.json`.

  **Wymagania:**
  - Zachowaj tożsamości pierwotnego StationBoard, wygenerowanego ConfigMap trasy oraz Deployment i Service odbiorcy, a także dostarczone niezmienne obrazy. Wygenerowane zasoby board zachowują właściciela-kontroler i jego pierwotną etykietę.
  - Istniejący zasób niestandardowy żąda `north-116`. Jego status potwierdza bieżącą generację i gotowość; board ma jedną gotową replikę, a wygenerowane dane trasy zawierają `north-116` zakończone nowym wierszem.
  - Pierwotny odbiorca kończy rollout z jedną gotową repliką. Oba interfejsy HTTP producenta i odbiorcy zadeklarowane w kontrakcie zwracają bieżącą trasę z workload odbiorcy.

  Testy obserwują bieżącą własność, generację, gotowość i dostarczanie HTTP. Ograniczony kontroler treningowy jest odpytywany przez backend i nie jest ogólnym frameworkiem operatorów; historia zmian i ciągła dostępność nie są sprawdzane.
debrief: Kontroler uzgodnił swoje zasoby, lecz samo to nie odświeżyło powiązania pliku odbiorcy. Bieżąca generacja
  i faktyczne dostarczanie są teraz zgodne.
stages.0.brief: Pierwotny odbiorca zakończył rollout i otrzymuje bieżący wynik producenta przez oba zadeklarowane
  interfejsy HTTP.
hints.0.text: Kontroler może potwierdzić stan oczekiwany, gdy proces odbiorcy nadal używa starej reprezentacji.
  Własność, uzgadnianie i faktyczne dostarczanie to osobne obserwacje.
hints.1.text: |-
  Porównaj `station.yaml` i `reconciliation-contract.json` z bieżącym zasobem niestandardowym i jego statusem, wygenerowanymi danymi trasy, montowaniami Poda odbiorcy oraz `kubectl get pods,endpointslices -o yaml`. Porównaj obie rzeczywiste odpowiedzi HTTP.

  W zasobie niestandardowym odszukaj żądany routing i obserwowaną generację. W szablonie i bieżącym Podzie konsumenta sprawdź, czy montowany jest pojedynczy plik, i porównaj go z wygenerowaną ConfigMap.
hints.2.text: |-
  Poczekaj na zakończenie starych Podów, potem sprawdź `kubectl rollout status deployment/client` i oba zadeklarowane interfejsy HTTP. Oczekiwane są bieżąca gotowość, `north-116`, zachowane tożsamości i własność kontrolera.

  Porównaj zachowane UID i obrazy z zapisem początkowym. W StationBoard obserwowana generacja musi odpowiadać bieżącej, a UID StationBoard musi odpowiadać wpisowi właściciela-kontrolera w wygenerowanych obiektach. `board-route` i obie odpowiedzi HTTP powinny pokazać zapis `north-116\n` z oznaczeniem końca linii.

  ```sh
  jq '{identities,image}' reconciliation-identities.json
  kubectl get stationboard station -o json | jq '{uid:.metadata.uid, generation:.metadata.generation, route:.spec.route, status}'
  kubectl get configmap board-route -o json | jq '.data["index.html"]'
  kubectl get deployments,replicasets,pods,configmaps,services -o yaml
  kubectl rollout status deployment/client --timeout=10s
  for service in board client-view; do
    kubectl exec deployment/client -c worker -- wget -qO- -T 3 "http://$service:8080/" | jq -Rs .
  done
  ```
phrases.0: Zmieniłem żądany stan zasobu niestandardowego.
phrases.1: Sprawdziłem sterownik observed generation.
phrases.2: Sprawdziłem uzgodnioną odpowiedź na zgłoszenie.
questions.0.points.0: NIE; definiuje pamięć, schemat i kształt API.
questions.0.points.1: Kontroler musi implementować pętlę pożądanego stanu.
questions.0.prompt: Czy instalacja CRD wdraża uzgadnianie?
questions.1.points.0: Określa, który desired revision obsługuje sterownik.
questions.1.points.1: Ready starszej generacji może być nieaktualny.
questions.1.prompt: Dlaczego warto porównywać observedGeneration z generation?
stages.0.objectives.0.text: Wygenerowane zasoby zachowują właściciela-kontroler; tożsamości pierwotnego zasobu niestandardowego,
  danych trasy i odbiorcy oraz dostarczone obrazy pozostają zachowane.
stages.0.objectives.1.text: Istniejący StationBoard żąda `north-116` i jest gotowy dla bieżącej generacji z jedną
  gotową repliką board; wygenerowana strona w istniejącym ConfigMap trasy zawiera `north-116` zakończone znakiem
  nowej linii.
stages.0.objectives.2.text: Pierwotny odbiorca zakończył rollout i otrzymuje bieżący wynik producenta przez oba
  zadeklarowane interfejsy HTTP.
diagnostics.owner_deployment_board: Wskazany obiekt mógł powstać poza kontrolerem StationBoard lub wskazywać dawny UID właściciela. Porównaj referencję kontrolera z bieżącym StationBoard station w dostarczonej grupie API. [Przyczyna i kontrola](guides#guide=controllers-static&section=q116-station-controller-ownership)
diagnostics.owner_configmap_board_route: Wskazany obiekt mógł powstać poza kontrolerem StationBoard lub wskazywać dawny UID właściciela. Porównaj referencję kontrolera z bieżącym StationBoard station w dostarczonej grupie API. [Przyczyna i kontrola](guides#guide=controllers-static&section=q116-station-controller-ownership)
diagnostics.owner_service_board: Wskazany obiekt mógł powstać poza kontrolerem StationBoard lub wskazywać dawny UID właściciela. Porównaj referencję kontrolera z bieżącym StationBoard station w dostarczonej grupie API. [Przyczyna i kontrola](guides#guide=controllers-static&section=q116-station-controller-ownership)
diagnostics.label: Wygenerowany Deployment może nie mieć etykiety lub może być nieczytelny. Sprawdź na board etykietę devops-quests.controller=station-board. [Przyczyna i kontrola](guides#guide=controllers-static&section=q116-station-controller-label)
diagnostics.reconciliation_identity: Obiekt z zamrożonego zapisu uzgodnienia mógł zostać odtworzony, co trwale zmienia UID. Porównaj każdy aktywny UID z zapisanym przed poprawką. [Przyczyna i kontrola](guides#guide=controllers-static&section=q116-station-retained-object-identities)
diagnostics.reconciliation_image: Szablon producenta lub konsumenta albo bieżący kontener worker może używać innego obrazu. Porównaj nazwane kontenery z zamrożonym obrazem lub jego niezmiennym digestem. [Przyczyna i kontrola](guides#guide=controllers-static&section=q116-station-retained-workload-image)
diagnostics.route: Zasób źródłowy może nadal deklarować starą trasę mimo edycji obiektów pochodnych. Ustaw właściwą trasę na StationBoard station i poczekaj na uzgodnienie. [Przyczyna i kontrola](guides#guide=controllers-static&section=q116-station-desired-route)
diagnostics.generation: Kontroler może nadal wskazywać wcześniejszą generację zasobu. Po zmianie trasy porównaj observedGeneration z aktualną generation. [Przyczyna i kontrola](guides#guide=controllers-static&section=q116-station-current-generation)
diagnostics.station_ready: Kontroler mógł widzieć bieżącą generację, ale nadal nie zgłaszać ready. Sprawdź status StationBoard i zbieżność wygenerowanego obciążenia. [Przyczyna i kontrola](guides#guide=controllers-static&section=q116-station-controller-readiness)
diagnostics.ready: Wygenerowany Deployment board może nie mieć gotowej repliki. Sprawdź zdarzenia i poczekaj na dokładnie jedną gotową replikę. [Przyczyna i kontrola](guides#guide=controllers-static&section=q116-station-generated-worker-ready)
diagnostics.data: Kontroler mógł opublikować stare lub niepełne dane. Sprawdź index.html w board-route pod kątem north-116 z dokładnie jednym końcem linii. [Przyczyna i kontrola](guides#guide=controllers-static&section=q116-station-generated-route-bytes)
diagnostics.http: Wygenerowana ConfigMap i status mogą być poprawne, choć board zwraca starą treść lub nie odpowiada. Odpytaj źródłowy Service z client i porównaj z north-116. [Przyczyna i kontrola](guides#guide=controllers-static&section=q116-station-source-http-response)
diagnostics.reconciliation_delivery: Wdrożenie client może trwać lub jego bieżące pody mogą nie być gotowe. Sprawdź rollout, jedną żądaną i gotową replikę oraz gotowość bieżących podów. [Przyczyna i kontrola](guides#guide=controllers-static&section=q116-station-consumer-rollout)
diagnostics.reconciliation_service: Service konsumenta może mieć inny typ, selektor lub port. Sprawdź ClusterIP dla client-view, zgodność selektora z etykietami szablonu client i jeden pasujący port TCP 8080. [Przyczyna i kontrola](guides#guide=controllers-static&section=q116-station-consumer-publication-interface)
diagnostics.reconciliation_publication: Źródło board może być aktualne, choć oddzielny client nadal przechowuje starą odpowiedź lub nie publikuje jej. Odpytaj client-view i sprawdź dokładne north-116 z końcowym znakiem nowej linii. [Przyczyna i kontrola](guides#guide=controllers-static&section=q116-station-consumer-live-publication)
diagnostics.probe_0_0: Kontrola tożsamości może zatrzymać się przed wskazaniem warunku, gdy narzędzia lub zamrożone dane zawodzą. Sprawdź dostęp do zasobu, obiektów generowanych i zachowanych obciążeń. [Przyczyna i kontrola](guides#guide=controllers-static&section=q116-station-identity-observer-input)
diagnostics.probe_0_2: Kontrola dostawy może zatrzymać się przed rozróżnieniem źródła od publikacji, gdy proces lub dane zawodzą. Sprawdź narzędzia i dostęp do client oraz client-view. [Przyczyna i kontrola](guides#guide=controllers-static&section=q116-station-delivery-observer-input)
