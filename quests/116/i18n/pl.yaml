title: Niestandardowe uzgadnianie zasobów
brief: "Zarządzany endpoint board nie dostarcza wymaganej trasy. Przywróć uzgodniony, gotowy wynik pod kontrolą\
  \ kontrolera szkoleniowego.\n\nPracuj w `~/quest` na stacji roboczej. Dostarczone pliki: `station.json`, `client.json`.\n\
  \n**Requirements:**\n\n- Deployment `board`, ConfigMap `board-route` i Service `board` są kontrolowane przez bieżący\
  \ StationBoard `station`; Deployment zachowuje etykietę kontrolera `devops-quests.controller=station-board`.\n\
  \  - Własność kontrolera używa wersji API `training.devops-quests.local/v1`, rodzaju `StationBoard`, nazwy `station`\
  \ i jego bieżącego UID. `index.html` jest wpisem danych ConfigMap, a nie plikiem stacji roboczej.\n- StationBoard\
  \ `station` ma żądaną trasę `north-116`, jest gotowy dla bieżącej generacji z jedną gotową repliką `board`, a\
  \ ConfigMap `board-route` dostarcza `index.html` z `north-116` i końcowym znakiem nowej linii.\n- Z Deployment\
  \ `client` adres `http://board:8080` zwraca `north-116`.\n\n**Verify yourself before Check & finish:** Wykonaj\
  \ te polecenia obserwacji z `~/quest` na stacji roboczej.\n\n- Ustawienia, tożsamość i stan odpowiadają wymaganiom.\n\
  \n  ```sh\n  kubectl get stationboard station -o yaml\n  kubectl get deployment board -o yaml\n  kubectl get configmap\
  \ board-route -o yaml\n  kubectl get service board -o yaml\n  ```\n\n- `kubectl exec deployment/client -- wget\
  \ -qO- -T 3 http://board:8080` — Odbiorca otrzymuje `north-116`.\n\nKontrole obserwują bieżący stan, nie ręczne\
  \ zmiany generowanych zasobów; ten ograniczony kontroler szkoleniowy odpytywany przez backend nie jest uniwersalnym\
  \ frameworkiem operatorów."
debrief: W ćwiczeniu wykorzystano prawdziwy obiekt API, pętlę pożądanego stanu, wygenerowane obciążenie pracą i
  podzasób stanu.
stages.0.brief: Trasa zarządzana przez kontroler musi być uzgodniona i dostępna.
hints.0.text: CRD dodaje API; kontroler implementuje zachowanie. Dostarczona żądana trasa jest zamknięta. Zmień
  żądaną spec zamiast generowanych zasobów lub status.
hints.1.text: Zmień desired spec i sprawdź status.observedGeneration.
hints.2.text: Ustaw route north-116 i poczekaj na dostawę zarówno reconciliation, jak i projected ConfigMap.
phrases.0: Zmieniłem żądany stan zasobu niestandardowego.
phrases.1: Sprawdziłem sterownik observed generation.
phrases.2: Sprawdziłem uzgodnioną odpowiedź na zgłoszenie.
questions.0.points.0: NIE; definiuje pamięć, schemat i kształt API.
questions.0.points.1: Kontroler musi implementować pętlę pożądanego stanu.
questions.0.prompt: Czy instalacja CRD wdraża uzgadnianie?
questions.1.points.0: Określa, który desired revision obsługuje sterownik.
questions.1.points.1: Ready starszej generacji może być nieaktualny.
questions.1.prompt: Dlaczego warto porównywać observedGeneration z generation?
