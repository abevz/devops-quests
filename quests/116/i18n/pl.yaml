title: Niestandardowe uzgadnianie zasobów
brief: |-
  Zarządzany endpoint board nie dostarcza wymaganej trasy. Przywróć uzgodniony, gotowy wynik pod kontrolą kontrolera szkoleniowego.

  Pracuj na workstation w `~/quest` z dostarczonymi plikami:
  - `station.yaml`, `client.yaml`.

  **Requirements:**

  - Obciążenie board, jego dane trasy i Service pozostają własnością istniejącego StationBoard, z zachowaniem dostarczonej tożsamości kontrolera.
  - Istniejący StationBoard żąda `north-116` i jest gotowy dla bieżącej generacji z jedną gotową repliką board; wygenerowana strona w istniejącym ConfigMap trasy zawiera `north-116` zakończone znakiem nowej linii.
  - Z Deployment `client` adres `http://board:8080` zwraca `north-116`.

  Kontrole obserwują bieżący stan, nie ręczne zmiany generowanych zasobów; ten ograniczony kontroler szkoleniowy odpytywany przez backend nie jest uniwersalnym frameworkiem operatorów.
debrief: W ćwiczeniu wykorzystano prawdziwy obiekt API, pętlę pożądanego stanu, wygenerowane obciążenie
  pracą i podzasób stanu.
stages.0.brief: Wygenerowane obciążenie pozostaje własnością dostarczonego kontrolera.
hints.0.text: CRD dodaje API; kontroler implementuje zachowanie. Dostarczona żądana trasa jest zamknięta.
  Zmień żądaną spec zamiast generowanych zasobów lub status.
hints.1.text: |-
  Zmień desired spec i sprawdź status.observedGeneration.

  Sprawdź dostarczone dane i bieżące obserwacje:

  ```sh
  kubectl get stationboard station -o yaml
    kubectl get deployment board -o yaml
    kubectl get configmap board-route -o yaml
    kubectl get service board -o yaml
  ```
hints.2.text: |-
  Ustaw route north-116 i poczekaj na dostawę zarówno reconciliation, jak i projected ConfigMap.

  Sprawdź wynik z `~/quest` na workstation:

  - `kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080` — Odbiorca otrzymuje `north-116`.
phrases.0: Zmieniłem żądany stan zasobu niestandardowego.
phrases.1: Sprawdziłem sterownik observed generation.
phrases.2: Sprawdziłem uzgodnioną odpowiedź na zgłoszenie.
questions.0.points.0: NIE; definiuje pamięć, schemat i kształt API.
questions.0.points.1: Kontroler musi implementować pętlę pożądanego stanu.
questions.0.prompt: Czy instalacja CRD wdraża uzgadnianie?
questions.1.points.0: Określa, który desired revision obsługuje sterownik.
questions.1.points.1: Ready starszej generacji może być nieaktualny.
questions.1.prompt: Dlaczego warto porównywać observedGeneration z generation?
