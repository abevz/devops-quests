title: Niestandardowe uzgadnianie zasobów
brief: 'Niestandardowy zasób StationBoard steruje małym operatorem szkoleniowym. Operator uruchamia grę
  backend z normalną częstotliwością odpytywania, odczytuje tylko obiekt station tej zatoki i uzgadnia
  ograniczone ConfigMap, Deployment i Service. Jego obecny desired route to closed. Zmień spec.route na
  north-116; nie edytuj ręcznie wygenerowanych zasobów ani status. Sprawdź observedGeneration, ready status
  i prawdziwy HTTP. Ten kontroler jest celowo wąski, a nie operator ogólnego przeznaczenia framework.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `station.json`, `client.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: Rzeczywisty operator obserwuje nową generację, godzi jedną zdrową board
  i obsługuje north-116.'
debrief: W ćwiczeniu wykorzystano prawdziwy obiekt API, pętlę pożądanego stanu, wygenerowane obciążenie
  pracą i podzasób stanu.
