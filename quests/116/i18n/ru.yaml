title: Согласование custom resource
brief: 'Пользовательский ресурс StationBoard управляет небольшим учебным оператором. Оператор работает в backend игры, в обычном
  цикле опроса читает только station этой песочницы и согласует ограниченные ConfigMap, Deployment и Service. Сейчас желаемый
  маршрут — closed. Измените spec.route на north-116; не редактируйте созданные ресурсы и статус вручную. Проверьте observedGeneration,
  состояние ready и настоящий HTTP. Контроллер намеренно ограничен и не является универсальным framework операторов.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `station.json`, `client.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы и приватные сервисы.
  Менять можно только эту песочницу.


  Выданный `station.json` описывает пользовательский ресурс, а `client.json` — deployment/client. Проверки требуют `spec.route:
  north-116`, `status.observedGeneration`, равный текущему поколению, и `status.ready: true`. У Deployment `board`, ConfigMap
  `board-route` и Service `board` должна быть controller ownerReference с API `training.devops-quests.local/v1`, kind `StationBoard`,
  именем `station` и текущим UID station. Метка Deployment `devops-quests.controller` должна быть `station-board`, одна реплика
  готова; ключ ConfigMap `index.html` должен содержать ровно `north-116` и перевод строки, а `board:8080` — возвращать `north-116`.
  Это текущее состояние; оно не доказывает отсутствие ручных изменений созданных объектов.'
debrief: Задействованы настоящий объект API, цикл desired state, создаваемая нагрузка и subresource status.
