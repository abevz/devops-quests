title: Согласование custom resource
brief: |-
  Управляемый контроллером endpoint и его потребитель показывают разные маршруты. Восстановите reconciliation и доставку через предоставленные ресурсы.

  Работайте на рабочей станции в `~/quest` с `station.yaml` и `reconciliation-contract.json`.

  **Требования:**
  - Сохраните идентичности исходного StationBoard, сгенерированного ConfigMap маршрута, Deployment и Service потребителя, а также предоставленные неизменяемые образы. Сгенерированные ресурсы board сохраняют владельца-контроллер и его исходную метку.
  - Существующий пользовательский ресурс запрашивает `north-116`. Его статус подтверждает текущее поколение и готовность; у board одна готовая реплика, а сгенерированные данные маршрута содержат `north-116` с переводом строки.
  - Исходный потребитель завершает rollout с одной готовой репликой. Оба HTTP-интерфейса производителя и потребителя из контракта возвращают текущий маршрут из workload потребителя.

  Проверки наблюдают текущие владение, поколение, готовность и HTTP-доставку. Ограниченный учебный контроллер опрашивается backend и не является универсальной платформой операторов; история правок и непрерывная доступность не проверяются.
debrief: Контроллер согласовал свои ресурсы, но это само по себе не обновило привязку файла потребителя. Текущее
  поколение и фактическая доставка потребителю теперь согласованы.
stages.0.brief: Исходный потребитель завершил rollout и получает текущий результат производителя через оба объявленных
  HTTP-интерфейса.
hints.0.text: Контроллер может подтвердить желаемое состояние, пока downstream-процесс использует старое представление.
  Владение, reconciliation и фактическая доставка — разные наблюдения.
hints.1.text: |-
  Сопоставьте `station.yaml` и `reconciliation-contract.json` с текущими пользовательским ресурсом и статусом, сгенерированными данными маршрута, монтированиями в Pod потребителя и `kubectl get pods,endpointslices -o yaml`. Сравните оба фактических HTTP-ответа.

  Найдите желаемый маршрут и наблюдаемое поколение в пользовательском ресурсе. В шаблоне и действующем Pod потребителя проверьте, используется ли монтирование отдельного файла, и сравните этот файл с созданным ConfigMap.
hints.2.text: |-
  Дождитесь завершения старых Pod, затем проверьте `kubectl rollout status deployment/client` и оба объявленных HTTP-интерфейса. Ожидаются текущая готовность, `north-116`, сохранённые идентичности и владение контроллера.

  Сверьте сохранённые UID и образы с исходной записью. У StationBoard наблюдаемое поколение должно совпасть с текущим поколением, а UID StationBoard — с UID управляющего владельца в созданных объектах. `board-route` и оба HTTP-ответа должны показывать `north-116\n` как строку с экранированным переводом строки.

  ```sh
  jq '{identities,image}' reconciliation-identities.json
  kubectl get stationboard station -o json | jq '{uid:.metadata.uid, generation:.metadata.generation, route:.spec.route, status}'
  kubectl get configmap board-route -o json | jq '.data["index.html"]'
  kubectl get deployments,replicasets,pods,configmaps,services -o yaml
  kubectl rollout status deployment/client --timeout=10s
  for service in board client-view; do
    kubectl exec deployment/client -c worker -- wget -qO- -T 3 "http://$service:8080/" | jq -Rs .
  done
  ```
phrases.0: Я изменил desired state custom resource.
phrases.1: Я проверил observed generation контроллера.
phrases.2: Я проверил ответ согласованного приложения.
questions.0.points.0: 'Нет: она задаёт хранение, схему и форму API.'
questions.0.points.1: Цикл desired state должен реализовать контроллер.
questions.0.prompt: Реализует ли установка CRD reconciliation?
questions.1.points.0: Это показывает, какую desired revision обработал контроллер.
questions.1.points.1: Ready старого поколения может быть устаревшим.
questions.1.prompt: Зачем сравнивать observedGeneration и generation?
stages.0.objectives.0.text: Сгенерированные ресурсы сохраняют владельца-контроллер; сохранены идентичности исходного
  пользовательского ресурса, данных маршрута и потребителя, а также предоставленные образы.
stages.0.objectives.1.text: Существующий StationBoard запрашивает `north-116` и готов для текущего поколения с одной
  готовой репликой board; сгенерированная страница в существующем ConfigMap маршрута содержит `north-116` с завершающим
  переводом строки.
stages.0.objectives.2.text: Исходный потребитель завершил rollout и получает текущий результат производителя через
  оба объявленных HTTP-интерфейса.
diagnostics.owner_deployment_board: Указанный объект могли создать вне контроллера StationBoard, либо ссылка содержит прежний UID владельца. Сравните ownerReference контроллера с текущим StationBoard station в выданной группе API. [Причина и проверка](guides#guide=controllers-static&section=q116-station-controller-ownership)
diagnostics.owner_configmap_board_route: Указанный объект могли создать вне контроллера StationBoard, либо ссылка содержит прежний UID владельца. Сравните ownerReference контроллера с текущим StationBoard station в выданной группе API. [Причина и проверка](guides#guide=controllers-static&section=q116-station-controller-ownership)
diagnostics.owner_service_board: Указанный объект могли создать вне контроллера StationBoard, либо ссылка содержит прежний UID владельца. Сравните ownerReference контроллера с текущим StationBoard station в выданной группе API. [Причина и проверка](guides#guide=controllers-static&section=q116-station-controller-ownership)
diagnostics.label: У созданного Deployment могла отсутствовать метка контроллера, либо объект не читается. Проверьте у board метку devops-quests.controller=station-board. [Причина и проверка](guides#guide=controllers-static&section=q116-station-controller-label)
diagnostics.reconciliation_identity: Объект из зафиксированного отчёта о согласовании могли пересоздать, навсегда изменив UID. Сравните каждый текущий UID с исходным перед правкой существующих объектов. [Причина и проверка](guides#guide=controllers-static&section=q116-station-retained-object-identities)
diagnostics.reconciliation_image: Шаблон источника или потребителя либо текущий worker потребителя мог получить другой образ. Сравните образы именованных контейнеров с зафиксированным образом или его неизменяемым digest. [Причина и проверка](guides#guide=controllers-static&section=q116-station-retained-workload-image)
diagnostics.route: Исходный ресурс мог сохранять старый маршрут, пока менялись производные объекты. Задайте нужный маршрут у StationBoard station и дождитесь согласования. [Причина и проверка](guides#guide=controllers-static&section=q116-station-desired-route)
diagnostics.generation: Контроллер мог показывать прежнее поколение пользовательского ресурса. После правки маршрута сравните observedGeneration с текущей generation. [Причина и проверка](guides#guide=controllers-static&section=q116-station-current-generation)
diagnostics.station_ready: Контроллер мог увидеть текущее поколение, но ещё не сообщить ready. Проверьте статус StationBoard и дождитесь стабилизации производной нагрузки. [Причина и проверка](guides#guide=controllers-static&section=q116-station-controller-readiness)
diagnostics.ready: У созданного Deployment board могла ещё не появиться готовая реплика. Проверьте события Pod и дождитесь ровно одной готовой реплики. [Причина и проверка](guides#guide=controllers-static&section=q116-station-generated-worker-ready)
diagnostics.data: Контроллер мог опубликовать старое или неполное содержимое. Проверьте index.html в board-route на north-116 с ровно одним переводом строки в конце. [Причина и проверка](guides#guide=controllers-static&section=q116-station-generated-route-bytes)
diagnostics.http: Сгенерированный ConfigMap и статус могут быть верными, пока board отдаёт старые данные или недоступен. Запросите исходный Service из client и сравните с north-116. [Причина и проверка](guides#guide=controllers-static&section=q116-station-source-http-response)
diagnostics.reconciliation_delivery: Rollout client мог не завершиться, либо его текущие Pod ещё не готовы. Проверьте статус обновления, одну желаемую и готовую реплику и готовность текущих Pod. [Причина и проверка](guides#guide=controllers-static&section=q116-station-consumer-rollout)
diagnostics.reconciliation_service: У Service потребителя мог измениться тип, селектор или порт. Проверьте ClusterIP у client-view, соответствие селектора меткам шаблона client и один подходящий TCP-порт 8080. [Причина и проверка](guides#guide=controllers-static&section=q116-station-consumer-publication-interface)
diagnostics.reconciliation_publication: Источник board мог обновиться, а отдельный client всё ещё хранит старый ответ или не публикует его. Запросите client-view и проверьте точное тело north-116 с завершающим переводом строки. [Причина и проверка](guides#guide=controllers-static&section=q116-station-consumer-live-publication)
diagnostics.probe_0_0: Проверка идентификаторов может прерваться до указания условия при ошибке инструментов или замороженных входов. Проверьте доступ к ресурсу, производным объектам и сохранённым нагрузкам. [Причина и проверка](guides#guide=controllers-static&section=q116-station-identity-observer-input)
diagnostics.probe_0_2: Проверка доставки может прерваться до определения источника сбоя, если не запускается процесс или недоступны входы. Проверьте инструменты и доступ к client и client-view. [Причина и проверка](guides#guide=controllers-static&section=q116-station-delivery-observer-input)
