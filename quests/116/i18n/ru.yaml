title: Согласование custom resource
brief: 'Custom resource StationBoard управляет маленьким учебным оператором. Оператор
  работает в backend игры на обычном цикле опроса, читает только station этой песочницы
  и согласует ограниченные ConfigMap, Deployment и Service. Сейчас desired route равен
  closed. Измените spec.route на north-116; не редактируйте созданные ресурсы и status
  вручную. Проверьте observedGeneration, ready и реальный HTTP. Контроллер намеренно
  узкий, это не универсальный framework операторов.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `station.json`,
  `client.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно
  загруженные образы и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Настоящий оператор наблюдает новое поколение, согласует одно
  исправное табло и отдаёт north-116.'
debrief: Задействованы настоящий объект API, цикл desired state, создаваемая нагрузка
  и subresource status.
stages.0.brief: 'Результат проверки: Настоящий оператор наблюдает новое поколение,
  согласует одно исправное табло и отдаёт north-116.'
