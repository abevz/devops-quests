title: Согласование custom resource
brief: |-
  Управляемая конечная точка board не предоставляет требуемый маршрут. Восстановите согласованный готовый результат под управлением учебного контроллера.

  Работайте на workstation в `~/quest` с предоставленными файлами:
  - `station.yaml`, `client.yaml`.

  **Requirements:**

  - Нагрузка board, её данные маршрута и Service остаются во владении существующего StationBoard с сохранением предоставленной идентичности контроллера.
  - Существующий StationBoard запрашивает `north-116` и готов для текущего поколения с одной готовой репликой board; сгенерированная страница в существующем ConfigMap маршрута содержит `north-116` с завершающим переводом строки.
  - Из Deployment `client` адрес `http://board:8080` возвращает `north-116`.

  Проверки наблюдают текущее состояние, а не факт ручных правок генерируемых ресурсов; этот ограниченный учебный контроллер, опрашиваемый бэкендом, не является универсальным фреймворком операторов.
debrief: Задействованы настоящий объект API, цикл desired state, создаваемая нагрузка и subresource status.
stages.0.brief: Сгенерированная нагрузка остаётся во владении предоставленного контроллера.
hints.0.text: CRD добавляет API; поведение реализует контроллер. Предоставленный желаемый маршрут закрыт.
  Измените желаемую spec, а не генерируемые ресурсы или status.
hints.1.text: |-
  Меняйте desired spec и смотрите status.observedGeneration.

  Изучите предоставленные файлы и живые наблюдения:

  ```sh
  kubectl get stationboard station -o yaml
    kubectl get deployment board -o yaml
    kubectl get configmap board-route -o yaml
    kubectl get service board -o yaml
  ```
hints.2.text: |-
  Задайте route north-116 и дождитесь reconciliation и доставки projected ConfigMap.

  Проверьте результат из `~/quest` на workstation:

  - `kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080` — Потребитель получает `north-116`.
