title: Согласование custom resource
brief: "Управляемая конечная точка board не предоставляет требуемый маршрут. Восстановите согласованный готовый\
  \ результат под управлением учебного контроллера.\n\nРаботайте в `~/quest` на рабочей станции. Предоставлены файлы:\
  \ `station.yaml`, `client.yaml`.\n\n**Requirements:**\n\n- Deployment `board`, ConfigMap `board-route` и Service\
  \ `board` управляются текущим StationBoard `station`; Deployment сохраняет метку контроллера `devops-quests.controller=station-board`.\n\
  \  - Владение контроллером использует версию API `training.devops-quests.local/v1`, вид `StationBoard`, имя `station`\
  \ и его текущий UID. `index.html` — запись данных ConfigMap, а не файл рабочей станции.\n- StationBoard `station`\
  \ имеет желаемый маршрут `north-116`, готов для текущего поколения с одной готовой репликой `board`, а ConfigMap\
  \ `board-route` содержит `index.html` со строкой `north-116` и завершающим переводом строки.\n- Из Deployment\
  \ `client` адрес `http://board:8080` возвращает `north-116`.\n\n**Verify yourself before Check & finish:** Выполните\
  \ эти команды наблюдения из `~/quest` на рабочей станции.\n\n- Настройки, идентичность и состояние соответствуют\
  \ требованиям.\n\n  ```sh\n  kubectl get stationboard station -o yaml\n  kubectl get deployment board -o yaml\n\
  \  kubectl get configmap board-route -o yaml\n  kubectl get service board -o yaml\n  ```\n\n- `kubectl exec deployment/client\
  \ -- wget -qO- -T 3 http://board:8080` — Потребитель получает `north-116`.\n\nПроверки наблюдают текущее состояние,\
  \ а не факт ручных правок генерируемых ресурсов; этот ограниченный учебный контроллер, опрашиваемый бэкендом,\
  \ не является универсальным фреймворком операторов."
debrief: Задействованы настоящий объект API, цикл desired state, создаваемая нагрузка и subresource status.
stages.0.brief: Маршрут под управлением контроллера должен быть согласован и доступен.
hints.0.text: CRD добавляет API; поведение реализует контроллер. Предоставленный желаемый маршрут закрыт. Измените
  желаемую spec, а не генерируемые ресурсы или status.
hints.1.text: Меняйте desired spec и смотрите status.observedGeneration.
hints.2.text: Задайте route north-116 и дождитесь reconciliation и доставки projected ConfigMap.
phrases.0: Я изменил desired state custom resource.
phrases.1: Я проверил observed generation контроллера.
phrases.2: Я проверил ответ согласованного приложения.
