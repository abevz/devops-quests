diagnostics.owner_service_board: У Service board владельцем-контроллером должен быть station.
diagnostics.route: Маршрут station должен быть north-116.
diagnostics.generation: Station observedGeneration должен совпадать с текущим поколением.
diagnostics.station_ready: Station ready должен быть true.
diagnostics.label: Метка контроллера Deployment board должна быть station-board.
diagnostics.ready: Board должен иметь одну готовую реплику.
diagnostics.data: ConfigMap board-route index.html должен содержать north-116 и перевод строки.
diagnostics.http: board:8080 должен вернуть north-116.
stages.0.objectives.0.text: Сгенерированные ресурсы сохраняют владельца-контроллер; сохранены идентичности исходного
  пользовательского ресурса, данных маршрута и потребителя, а также предоставленные образы.
stages.0.objectives.1.text: Существующий StationBoard запрашивает `north-116` и готов для текущего поколения с одной
  готовой репликой board; сгенерированная страница в существующем ConfigMap маршрута содержит `north-116` с завершающим
  переводом строки.
stages.0.objectives.2.text: Исходный потребитель завершил rollout и получает текущий результат производителя через
  оба объявленных HTTP-интерфейса.
