title: Benutzerdefinierte resource-Abstimmung
brief: "Der verwaltete Board-Endpunkt liefert die erforderliche Route nicht. Stellen Sie ein abgeglichenes, bereites\
  \ Ergebnis unter dem Trainingscontroller her.\n\nArbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte\
  \ Dateien: `station.json`, `client.json`.\n\n**Requirements:**\n\n- Deployment `board`, ConfigMap `board-route`\
  \ und Service `board` werden vom aktuellen StationBoard `station` kontrolliert; das Deployment behält Controller-Label\
  \ `devops-quests.controller=station-board`.\n  - Controller-Eigentümerschaft nutzt API-Version `training.devops-quests.local/v1`,\
  \ Kind `StationBoard`, Name `station` und dessen aktuelle UID. `index.html` ist ein ConfigMap-Dateneintrag, keine\
  \ Workstation-Datei.\n- StationBoard `station` hat die gewünschte Route `north-116`, ist für die aktuelle Generation\
  \ mit einem bereiten `board`-Replikat bereit, und ConfigMap `board-route` liefert `index.html` mit `north-116`\
  \ und abschließendem Zeilenumbruch.\n- Von Deployment `client` liefert `http://board:8080` den Wert `north-116`.\n\
  \n**Verify yourself before Check & finish:** Führen Sie diese Beobachtungsbefehle aus `~/quest` auf der Workstation\
  \ aus.\n\n- Einstellungen, Identität und Status entsprechen den Anforderungen.\n\n  ```sh\n  kubectl get stationboard\
  \ station -o yaml\n  kubectl get deployment board -o yaml\n  kubectl get configmap board-route -o yaml\n  kubectl\
  \ get service board -o yaml\n  ```\n\n- `kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080` —\
  \ Der Verbraucher erhält `north-116`.\n\nDie Prüfungen beobachten den aktuellen Zustand, nicht manuelle Änderungen\
  \ generierter Ressourcen; dieser begrenzte, vom Backend abgefragte Trainingscontroller ist kein allgemeines Operator-Framework."
debrief: In der Übung wurden ein echtes API-Objekt, eine gewünschte Zustandsschleife, eine generierte Arbeitslast
  und status subresource verwendet.
stages.0.brief: Die controllerverwaltete Route muss abgeglichen und verfügbar sein.
hints.0.text: Ein CRD fügt einen API hinzu; Der Controller setzt das Verhalten um. Die bereitgestellte gewünschte
  Route ist geschlossen. Ändern Sie die gewünschte spec statt generierter Ressourcen oder status.
hints.1.text: Ändern Sie desired spec und inspect status.observedGeneration.
hints.2.text: Stellen Sie route north-116 ein und warten Sie auf die Lieferung von reconciliation und projected
  ConfigMap.
phrases.0: Ich habe den desired-Status auf dem custom resource geändert.
phrases.1: Ich habe den Controller observed generation überprüft.
phrases.2: Ich habe die abgeglichene Antragsantwort überprüft.
questions.0.points.0: NEIN; Es definiert Speicher, Schema und API Form.
questions.0.points.1: Ein Controller muss die gewünschte Zustandsschleife implementieren.
questions.0.prompt: Implementiert die Installation eines CRD reconciliation?
questions.1.points.0: Es identifiziert, welchen desired revision der Controller verarbeitet hat.
questions.1.points.1: Ready einer alten Generation ist möglicherweise veraltet.
questions.1.prompt: Warum observedGeneration mit generation vergleichen?
