title: Benutzerdefinierte resource-Abstimmung
brief: |-
  Der vom Controller verwaltete Endpunkt und sein Verbraucher liefern unterschiedliche Routen. Stelle Abgleich und Auslieferung über die bereitgestellten Ressourcen wieder her.

  Arbeite auf der Workstation in `~/quest` mit `station.yaml` und `reconciliation-contract.json`.

  **Anforderungen:**
  - Erhalte die Identitäten des ursprünglichen StationBoard, der erzeugten Routen-ConfigMap sowie von Deployment und Service des Verbrauchers und die bereitgestellten unveränderlichen Images. Erzeugte Board-Ressourcen behalten ihren Controller-Eigentümer und dessen ursprüngliches Label.
  - Die vorhandene Custom Resource fordert `north-116` an. Ihr Status bestätigt die aktuelle Generation und Bereitschaft; board hat eine bereite Replik und seine erzeugten Routendaten enthalten `north-116` mit abschließendem Zeilenumbruch.
  - Der ursprüngliche Verbraucher schließt den Rollout mit einer bereiten Replik ab. Beide im Vertrag deklarierten HTTP-Schnittstellen von Produzent und Verbraucher liefern aus dem Verbraucher-Workload die aktuelle Route.

  Die Prüfungen beobachten aktuelle Eigentümerschaft, Generation, Bereitschaft und HTTP-Auslieferung. Der begrenzte, vom Backend abgefragte Trainingscontroller ist kein allgemeines Operator-Framework; Änderungshistorie und unterbrechungsfreie Verfügbarkeit werden nicht geprüft.
debrief: Der Controller glich seine Ressourcen ab, aktualisierte dadurch aber nicht automatisch die Dateibindung
  des Verbrauchers. Aktuelle Generation und tatsächliche Auslieferung stimmen nun überein.
stages.0.brief: Der ursprüngliche Verbraucher ist ausgerollt und empfängt das aktuelle Produzentenergebnis über
  beide deklarierten HTTP-Schnittstellen.
hints.0.text: Ein Controller kann den Sollzustand bestätigen, während ein nachgelagerter Prozess noch eine ältere
  Darstellung verwendet. Eigentümerschaft, Abgleich und tatsächliche Auslieferung sind getrennte Beobachtungen.
hints.1.text: |-
  Vergleiche `station.yaml` und `reconciliation-contract.json` mit der aktiven Custom Resource und ihrem Status, erzeugten Routendaten, Volume-Mounts des Verbraucher-Pods und `kubectl get pods,endpointslices -o yaml`. Vergleiche die beiden tatsächlichen HTTP-Antworten.

  Suche in der benutzerdefinierten Ressource nach der gewünschten Route und der beobachteten Generation. Prüfe in Vorlage und aktuellem Pod des Verbrauchers, ob eine einzelne Datei eingebunden ist, und vergleiche sie mit der erzeugten ConfigMap.
hints.2.text: |-
  Warte auf das Ende alter Pods und prüfe `kubectl rollout status deployment/client` sowie beide deklarierten HTTP-Schnittstellen. Erwartet werden aktuelle Bereitschaft, `north-116`, erhaltene Identitäten und Controller-Eigentümerschaft.

  Vergleiche die beibehaltenen UIDs und Images mit dem Ausgangsdatensatz. Bei StationBoard muss die beobachtete Generation der aktuellen Generation entsprechen. Die StationBoard-UID muss mit der UID der Controller-Owner-Referenz in den erzeugten Objekten übereinstimmen. `board-route` und beide HTTP-Antworten sollen `north-116\n` als Zeichenkette mit maskiertem Zeilenumbruch anzeigen.

  ```sh
  jq '{identities,image}' reconciliation-identities.json
  kubectl get stationboard station -o json | jq '{uid:.metadata.uid, generation:.metadata.generation, route:.spec.route, status}'
  kubectl get configmap board-route -o json | jq '.data["index.html"]'
  kubectl get deployments,replicasets,pods,configmaps,services -o yaml
  kubectl rollout status deployment/client --timeout=10s
  for service in board client-view; do
    kubectl exec deployment/client -c worker -- wget -qO- -T 3 "http://$service:8080/" | jq -Rs .
  done
  ```
phrases.0: Ich habe den desired-Status auf dem custom resource geändert.
phrases.1: Ich habe den Controller observed generation überprüft.
phrases.2: Ich habe die abgeglichene Antragsantwort überprüft.
questions.0.points.0: NEIN; Es definiert Speicher, Schema und API Form.
questions.0.points.1: Ein Controller muss die gewünschte Zustandsschleife implementieren.
questions.0.prompt: Implementiert die Installation eines CRD reconciliation?
questions.1.points.0: Es identifiziert, welchen desired revision der Controller verarbeitet hat.
questions.1.points.1: Ready einer alten Generation ist möglicherweise veraltet.
questions.1.prompt: Warum observedGeneration mit generation vergleichen?
stages.0.objectives.0.text: Erzeugte Ressourcen behalten den Controller-Eigentümer; ursprüngliche Custom Resource,
  Routendaten, Verbraucheridentitäten und bereitgestellte Images bleiben erhalten.
stages.0.objectives.1.text: Das vorhandene StationBoard fordert `north-116` an und ist für seine aktuelle Generation
  mit einer bereiten board-Replik bereit; seine erzeugte Seite in der vorhandenen Routen-ConfigMap enthält `north-116`
  mit abschließendem Zeilenumbruch.
stages.0.objectives.2.text: Der ursprüngliche Verbraucher ist ausgerollt und empfängt das aktuelle Produzentenergebnis
  über beide deklarierten HTTP-Schnittstellen.
diagnostics.owner_deployment_board: Das gemeldete Objekt entstand möglicherweise außerhalb des StationBoard-Controllers oder verweist auf eine alte Owner-UID. Vergleichen Sie den Controller-Verweis mit dem aktuellen StationBoard station in der bereitgestellten API-Gruppe. [Ursache und Prüfung](guides#guide=controllers-static&section=q116-station-controller-ownership)
diagnostics.owner_configmap_board_route: Das gemeldete Objekt entstand möglicherweise außerhalb des StationBoard-Controllers oder verweist auf eine alte Owner-UID. Vergleichen Sie den Controller-Verweis mit dem aktuellen StationBoard station in der bereitgestellten API-Gruppe. [Ursache und Prüfung](guides#guide=controllers-static&section=q116-station-controller-ownership)
diagnostics.owner_service_board: Das gemeldete Objekt entstand möglicherweise außerhalb des StationBoard-Controllers oder verweist auf eine alte Owner-UID. Vergleichen Sie den Controller-Verweis mit dem aktuellen StationBoard station in der bereitgestellten API-Gruppe. [Ursache und Prüfung](guides#guide=controllers-static&section=q116-station-controller-ownership)
diagnostics.label: Dem erzeugten Deployment fehlt möglicherweise das Controller-Label oder es ist nicht lesbar. Prüfen Sie board auf devops-quests.controller=station-board. [Ursache und Prüfung](guides#guide=controllers-static&section=q116-station-controller-label)
diagnostics.reconciliation_identity: Ein Objekt aus dem festgehaltenen Abgleichsbeleg wurde möglicherweise neu erstellt und hat dauerhaft eine andere UID. Vergleichen Sie jede aktive UID mit der erfassten vor einer Korrektur bestehender Objekte. [Ursache und Prüfung](guides#guide=controllers-static&section=q116-station-retained-object-identities)
diagnostics.reconciliation_image: Eine Produzenten- oder Verbrauchervorlage oder ein aktueller Verbraucher-Worker nutzt möglicherweise ein anderes Image. Vergleichen Sie die benannten Container mit dem festgehaltenen Image oder Digest. [Ursache und Prüfung](guides#guide=controllers-static&section=q116-station-retained-workload-image)
diagnostics.route: Die Quellressource deklariert möglicherweise noch die alte Route, obwohl abgeleitete Objekte geändert wurden. Setzen Sie die gewünschte Route an StationBoard station und warten Sie auf den Abgleich. [Ursache und Prüfung](guides#guide=controllers-static&section=q116-station-desired-route)
diagnostics.generation: Der Controller meldet möglicherweise noch eine frühere Generation der benutzerdefinierten Ressource. Vergleichen Sie observedGeneration nach der Routenänderung mit der aktuellen generation. [Ursache und Prüfung](guides#guide=controllers-static&section=q116-station-current-generation)
diagnostics.station_ready: Der Controller hat möglicherweise die aktuelle Generation erfasst, meldet aber noch kein ready. Prüfen Sie den StationBoard-Status und die Konvergenz der abgeleiteten Arbeitslast. [Ursache und Prüfung](guides#guide=controllers-static&section=q116-station-controller-readiness)
diagnostics.ready: Dem erzeugten Deployment board fehlt möglicherweise noch die bereite Replik. Prüfen Sie Pod-Ereignisse und warten Sie auf genau eine bereite Replik. [Ursache und Prüfung](guides#guide=controllers-static&section=q116-station-generated-worker-ready)
diagnostics.data: Der Controller hat möglicherweise alte oder unvollständige Daten veröffentlicht. Prüfen Sie index.html in board-route auf north-116 mit genau einem abschließenden Zeilenumbruch. [Ursache und Prüfung](guides#guide=controllers-static&section=q116-station-generated-route-bytes)
diagnostics.http: Erzeugte ConfigMap und Status können stimmen, obwohl board alte Daten liefert oder nicht erreichbar ist. Rufen Sie den Quell-Service aus client auf und vergleichen Sie mit north-116. [Ursache und Prüfung](guides#guide=controllers-static&section=q116-station-source-http-response)
diagnostics.reconciliation_delivery: Der client-Rollout ist möglicherweise noch nicht abgeschlossen oder seine aktuellen Pods sind nicht bereit. Prüfen Sie Rollout, eine gewünschte und bereite Replik und Bereitschaft der aktuellen Pods. [Ursache und Prüfung](guides#guide=controllers-static&section=q116-station-consumer-rollout)
diagnostics.reconciliation_service: Der Verbraucher-Service hat möglicherweise einen falschen Typ, Selektor oder Port. Prüfen Sie ClusterIP bei client-view, passende Vorlagenlabels von client und einen passenden TCP-Port 8080. [Ursache und Prüfung](guides#guide=controllers-static&section=q116-station-consumer-publication-interface)
diagnostics.reconciliation_publication: Die Quelle board kann aktuell sein, während der separate client eine alte Antwort speichert oder sie nicht veröffentlicht. Fragen Sie client-view ab und prüfen Sie genau north-116 mit abschließendem Zeilenumbruch. [Ursache und Prüfung](guides#guide=controllers-static&section=q116-station-consumer-live-publication)
diagnostics.probe_0_0: Die Identitätsprüfung kann vor einer Meldung abbrechen, wenn Werkzeuge oder festgehaltene Eingaben fehlschlagen. Prüfen Sie den Zugriff auf Quellressource, abgeleitete und erhaltene Objekte. [Ursache und Prüfung](guides#guide=controllers-static&section=q116-station-identity-observer-input)
diagnostics.probe_0_2: Die Auslieferungsprüfung kann vor der Unterscheidung zwischen Quelle und Veröffentlichung abbrechen, wenn Prozess oder Eingaben fehlschlagen. Prüfen Sie Werkzeuge und Zugriff auf client und client-view. [Ursache und Prüfung](guides#guide=controllers-static&section=q116-station-delivery-observer-input)
