title: Benutzerdefinierte resource-Abstimmung
brief: 'Eine StationBoard Custom Resource steuert einen kleinen Trainingsoperator. Der Operator läuft im Backend des Spiels,
  liest im normalen Abfragezyklus nur das station-Objekt dieser Umgebung und gleicht eine begrenzte ConfigMap, ein Deployment
  und einen Service ab. Die aktuell gewünschte Route ist closed. Ändere spec.route auf north-116; bearbeite generierte Ressourcen
  und Status nicht von Hand. Prüfe observedGeneration, den Ready-Status und echtes HTTP. Dieser Controller ist absichtlich
  begrenzt und kein allgemeines Operator-Framework.


  Questdateien in `~/quest` (einige erscheinen in späteren Phasen): `station.json`, `client.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien, vorinstallierte Bilder
  und private Dienste. Ändern Sie nur diese Bucht.


  Das bereitgestellte `station.json` beschreibt die Custom Resource, `client.json` deployment/client. Die Prüfungen verlangen
  `spec.route: north-116`, `status.observedGeneration` gleich der aktuellen Generation und `status.ready: true`. Deployment
  `board`, ConfigMap `board-route` und Service `board` müssen jeweils eine Controller-ownerReference mit API `training.devops-quests.local/v1`,
  Kind `StationBoard`, Name `station` und aktueller Station-UID haben. Das Deployment-Label `devops-quests.controller` muss
  `station-board` sein und ein Replikat bereit; ConfigMap-Schlüssel `index.html` muss genau `north-116` gefolgt von einem
  Zeilenumbruch enthalten, und `board:8080` muss `north-116` liefern. Dies ist aktueller Zustand und beweist nicht, dass generierte
  Ressourcen nie von Hand geändert wurden.'
debrief: In der Übung wurden ein echtes API-Objekt, eine gewünschte Zustandsschleife, eine generierte Arbeitslast und status
  subresource verwendet.
stages.0.brief: Station-Status, Owner-Referenzen, generierte Objekte und Board-Antwort entsprechen der Beschreibung.
