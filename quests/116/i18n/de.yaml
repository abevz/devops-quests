title: Benutzerdefinierte resource-Abstimmung
brief: |-
  Der verwaltete Board-Endpunkt liefert die erforderliche Route nicht. Stellen Sie ein abgeglichenes, bereites Ergebnis unter dem Trainingscontroller her.

  Arbeiten Sie auf der Workstation in `~/quest` mit den bereitgestellten Dateien:
  - `station.yaml`, `client.yaml`.

  **Requirements:**

  - Der board-Workload, seine Routendaten und sein Service bleiben dem vorhandenen StationBoard zugeordnet; die bereitgestellte Controller-Identität bleibt erhalten.
  - Das vorhandene StationBoard fordert `north-116` an und ist für seine aktuelle Generation mit einer bereiten board-Replik bereit; seine erzeugte Seite in der vorhandenen Routen-ConfigMap enthält `north-116` mit abschließendem Zeilenumbruch.
  - Von Deployment `client` liefert `http://board:8080` den Wert `north-116`.

  Die Prüfungen beobachten den aktuellen Zustand, nicht manuelle Änderungen generierter Ressourcen; dieser begrenzte, vom Backend abgefragte Trainingscontroller ist kein allgemeines Operator-Framework.
debrief: In der Übung wurden ein echtes API-Objekt, eine gewünschte Zustandsschleife, eine generierte
  Arbeitslast und status subresource verwendet.
stages.0.brief: Der erzeugte Workload bleibt dem bereitgestellten Controller zugeordnet.
hints.0.text: Ein CRD fügt einen API hinzu; Der Controller setzt das Verhalten um. Die bereitgestellte
  gewünschte Route ist geschlossen. Ändern Sie die gewünschte spec statt generierter Ressourcen oder status.
hints.1.text: |-
  Ändern Sie desired spec und inspect status.observedGeneration.

  Prüfen Sie die bereitgestellten Eingaben und laufenden Beobachtungen:

  ```sh
  kubectl get stationboard station -o yaml
    kubectl get deployment board -o yaml
    kubectl get configmap board-route -o yaml
    kubectl get service board -o yaml
  ```
hints.2.text: |-
  Stellen Sie route north-116 ein und warten Sie auf die Lieferung von reconciliation und projected ConfigMap.

  Prüfen Sie das Ergebnis in `~/quest` auf der Workstation:

  - `kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080` — Der Verbraucher erhält `north-116`.
phrases.0: Ich habe den desired-Status auf dem custom resource geändert.
phrases.1: Ich habe den Controller observed generation überprüft.
phrases.2: Ich habe die abgeglichene Antragsantwort überprüft.
questions.0.points.0: NEIN; Es definiert Speicher, Schema und API Form.
questions.0.points.1: Ein Controller muss die gewünschte Zustandsschleife implementieren.
questions.0.prompt: Implementiert die Installation eines CRD reconciliation?
questions.1.points.0: Es identifiziert, welchen desired revision der Controller verarbeitet hat.
questions.1.points.1: Ready einer alten Generation ist möglicherweise veraltet.
questions.1.prompt: Warum observedGeneration mit generation vergleichen?
