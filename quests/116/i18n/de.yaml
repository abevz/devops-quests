title: Benutzerdefinierte resource-Abstimmung
brief: 'Ein maßgeschneiderter StationBoard resource treibt einen kleinen Schulungsantrieb an. Der Operator
  führt das Spiel backend mit seinem normalen Abfragerhythmus aus, liest nur das station-Objekt dieser
  Bucht und gleicht ein begrenztes ConfigMap, Deployment und Service ab. Sein aktueller desired route
  ist closed. spec.route in north-116 ändern; Bearbeiten Sie generierte Ressourcen nicht manuell oder
  status. Überprüfen Sie observedGeneration, ready status und echtes HTTP. Dieser Controller ist absichtlich
  schmal und kein Allzweck-Operator framework.


  Questdateien in `~/quest` (einige erscheinen in späteren Phasen): `station.json`, `client.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: Der tatsächliche Betreiber beobachtet die neue Generation, gleicht einen gesunden
  board ab und bedient north-116.'
debrief: In der Übung wurden ein echtes API-Objekt, eine gewünschte Zustandsschleife, eine generierte
  Arbeitslast und status subresource verwendet.
stages.0.brief: 'Erfolgskriterium: Der tatsächliche Betreiber beobachtet die neue Generation, gleicht
  einen gesunden board ab und bedient north-116.'
stages.0.objectives.0.text: Der eigentliche Betreiber beobachtet die neue Generation, gleicht einen gesunden
  board ab und bedient north-116.
hints.0.text: Ein CRD fügt einen API hinzu; Der Controller setzt das Verhalten um.
hints.1.text: Ändern Sie desired spec und inspect status.observedGeneration.
hints.2.text: Stellen Sie route north-116 ein und warten Sie auf die Lieferung von reconciliation und
  projected ConfigMap.
phrases.0: Ich habe den desired-Status auf dem custom resource geändert.
phrases.1: Ich habe den Controller observed generation überprüft.
phrases.2: Ich habe die abgeglichene Antragsantwort überprüft.
questions.0.points.0: NEIN; Es definiert Speicher, Schema und API Form.
questions.0.points.1: Ein Controller muss die gewünschte Zustandsschleife implementieren.
questions.0.prompt: Implementiert die Installation eines CRD reconciliation?
questions.1.points.0: Es identifiziert, welchen desired revision der Controller verarbeitet hat.
questions.1.points.1: Ready einer alten Generation ist möglicherweise veraltet.
questions.1.prompt: Warum observedGeneration mit generation vergleichen?
