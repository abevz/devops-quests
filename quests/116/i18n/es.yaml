title: Conciliación personalizada resource
brief: |-
  El endpoint gestionado por el controlador y su consumidor no coinciden en la ruta actual. Recupera la reconciliación y la entrega mediante los recursos proporcionados.

  Trabaja en la estación en `~/quest` con `station.yaml` y `reconciliation-contract.json`.

  **Requisitos:**
  - Conserva las identidades del StationBoard original, su ConfigMap de ruta generado y el Deployment y Service del consumidor, además de las imágenes inmutables proporcionadas. Los recursos board generados conservan su propietario controlador y su etiqueta original.
  - El recurso personalizado existente solicita `north-116`. Su estado confirma la generación actual y está listo; board tiene una réplica lista y sus datos de ruta generados contienen `north-116` seguido de un salto de línea.
  - El consumidor original completa el rollout con una réplica lista. Las dos interfaces HTTP del productor y consumidor declaradas en el contrato devuelven la ruta actual desde el workload consumidor.

  Las comprobaciones observan propiedad, generación, disponibilidad y entrega HTTP actuales. El controlador de entrenamiento limitado es consultado por el backend y no es un framework general de operadores; no se verifican el historial de cambios ni la disponibilidad continua.
debrief: El controlador reconcilió sus recursos, pero eso no actualizó por sí mismo el enlace de archivo del consumidor.
  La generación actual y la entrega real ahora coinciden.
stages.0.brief: El consumidor original completa el rollout y recibe el resultado actual del productor mediante ambas
  interfaces HTTP declaradas.
hints.0.text: Un controlador puede confirmar el estado deseado mientras un proceso consumidor sigue usando una representación
  anterior. Propiedad, reconciliación y entrega real son observaciones distintas.
hints.1.text: Compara `station.yaml` y `reconciliation-contract.json` con el recurso personalizado y su estado activos,
  los datos de ruta generados, los montajes del Pod consumidor y `kubectl get pods,endpointslices -o yaml`. Compara
  las dos respuestas HTTP reales.
hints.2.text: Recupera el estado deseado mediante el recurso personalizado y comprueba su generación observada y
  los datos generados. Actualiza la entrega según la vida del montaje; un enlace de archivo conservado necesita
  un nuevo montaje de Pod. Espera a que terminen los Pods anteriores y verifica `kubectl rollout status deployment/client`
  y ambas interfaces HTTP declaradas. Se esperan disponibilidad actual, `north-116`, identidades conservadas y propiedad
  del controlador.
phrases.0: Cambié el estado de desired en el custom resource.
phrases.1: Revisé el controlador observed generation.
phrases.2: Verifiqué la respuesta de la solicitud conciliada.
questions.0.points.0: No; Define el almacenamiento, el esquema y la forma API.
questions.0.points.1: Un controlador debe implementar el bucle de estado deseado.
questions.0.prompt: ¿La instalación de un CRD implementa reconciliation?
questions.1.points.0: Identifica qué desired revision manejó el controlador.
questions.1.points.1: El Ready de una generación anterior puede estar obsoleto.
questions.1.prompt: ¿Por qué comparar observedGeneration con generation?
stages.0.objectives.0.text: Los recursos generados conservan su propietario controlador; se mantienen las identidades
  del recurso personalizado, los datos de ruta y el consumidor originales, y las imágenes proporcionadas.
stages.0.objectives.1.text: El StationBoard existente solicita `north-116` y está listo para su generación actual
  con una réplica board lista; su página generada en el ConfigMap de ruta existente contiene `north-116` seguido
  de un salto de línea.
stages.0.objectives.2.text: El consumidor original completa el rollout y recibe el resultado actual del productor
  mediante ambas interfaces HTTP declaradas.
diagnostics.owner_deployment_board: El objeto indicado puede haberse creado fuera del controlador StationBoard o referenciar un UID anterior. Compare la referencia del controlador con el StationBoard station actual en el grupo API suministrado. [Causa y comprobación](guides#guide=controllers-static&section=q116-station-controller-ownership)
diagnostics.owner_configmap_board_route: El objeto indicado puede haberse creado fuera del controlador StationBoard o referenciar un UID anterior. Compare la referencia del controlador con el StationBoard station actual en el grupo API suministrado. [Causa y comprobación](guides#guide=controllers-static&section=q116-station-controller-ownership)
diagnostics.owner_service_board: El objeto indicado puede haberse creado fuera del controlador StationBoard o referenciar un UID anterior. Compare la referencia del controlador con el StationBoard station actual en el grupo API suministrado. [Causa y comprobación](guides#guide=controllers-static&section=q116-station-controller-ownership)
diagnostics.label: El Deployment generado puede carecer de etiqueta o no ser legible. Revise en board la etiqueta devops-quests.controller=station-board. [Causa y comprobación](guides#guide=controllers-static&section=q116-station-controller-label)
diagnostics.reconciliation_identity: Un objeto del registro fijado puede haberse recreado, cambiando su UID de forma irreversible. Compare los UID activos con los capturados antes de reparar los objetos existentes. [Causa y comprobación](guides#guide=controllers-static&section=q116-station-retained-object-identities)
diagnostics.reconciliation_image: Una plantilla de productor o consumidor, o un worker actual del consumidor, puede usar otra imagen. Compare los contenedores nombrados con la imagen fijada o su digest inmutable. [Causa y comprobación](guides#guide=controllers-static&section=q116-station-retained-workload-image)
diagnostics.route: El recurso fuente puede seguir declarando la ruta anterior mientras cambiaron los objetos derivados. Defina la ruta deseada en StationBoard station y espere la reconciliación. [Causa y comprobación](guides#guide=controllers-static&section=q116-station-desired-route)
diagnostics.generation: El controlador puede seguir indicando una generación anterior del recurso. Tras cambiar la ruta compare observedGeneration con la generation activa. [Causa y comprobación](guides#guide=controllers-static&section=q116-station-current-generation)
diagnostics.station_ready: El controlador puede haber observado la generación actual sin indicar ready. Revise el estado de StationBoard y espere la convergencia de la carga derivada. [Causa y comprobación](guides#guide=controllers-static&section=q116-station-controller-readiness)
diagnostics.ready: El Deployment board generado puede no tener su réplica lista aún. Revise los eventos y espere exactamente una réplica lista. [Causa y comprobación](guides#guide=controllers-static&section=q116-station-generated-worker-ready)
diagnostics.data: El controlador puede haber publicado contenido antiguo o incompleto. Revise index.html en board-route para north-116 seguido por un único salto de línea. [Causa y comprobación](guides#guide=controllers-static&section=q116-station-generated-route-bytes)
diagnostics.http: El ConfigMap y estado pueden ser correctos aunque board sirva datos antiguos o no responda. Consulte el Service fuente desde client y compare con north-116. [Causa y comprobación](guides#guide=controllers-static&section=q116-station-source-http-response)
diagnostics.reconciliation_delivery: El despliegue client puede estar pendiente, o sus Pods actuales pueden no estar listos. Revise el rollout, una réplica deseada y lista, y la disponibilidad de sus Pods actuales. [Causa y comprobación](guides#guide=controllers-static&section=q116-station-consumer-rollout)
diagnostics.reconciliation_service: El Service consumidor puede tener otro tipo, selector o puerto. Revise ClusterIP en client-view, que su selector coincida con la plantilla de client y un puerto TCP 8080 que coincida. [Causa y comprobación](guides#guide=controllers-static&section=q116-station-consumer-publication-interface)
diagnostics.reconciliation_publication: El origen board puede estar al día aunque el client separado conserve una respuesta anterior o no la publique. Consulte client-view y revise el cuerpo exacto north-116 con salto final. [Causa y comprobación](guides#guide=controllers-static&section=q116-station-consumer-live-publication)
diagnostics.probe_0_0: El observador de identidad puede detenerse antes de señalar una condición si fallan las herramientas o datos fijados. Revise el acceso a los recursos originales, generados y conservados. [Causa y comprobación](guides#guide=controllers-static&section=q116-station-identity-observer-input)
diagnostics.probe_0_2: El observador puede detenerse antes de distinguir origen y publicación si falla el proceso o la entrada. Revise las herramientas y el acceso a client y client-view. [Causa y comprobación](guides#guide=controllers-static&section=q116-station-delivery-observer-input)
