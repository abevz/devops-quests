stages.0.objectives.0.text: Los recursos generados conservan su propietario controlador; se mantienen las identidades
  del recurso personalizado, los datos de ruta y el consumidor originales, y las imágenes proporcionadas.
stages.0.objectives.1.text: El StationBoard existente solicita `north-116` y está listo para su generación actual
  con una réplica board lista; su página generada en el ConfigMap de ruta existente contiene `north-116` seguido
  de un salto de línea.
stages.0.objectives.2.text: El consumidor original completa el rollout y recibe el resultado actual del productor
  mediante ambas interfaces HTTP declaradas.
diagnostics.reconciliation_identity: Conserva los UID originales del recurso personalizado, ConfigMap de ruta, Deployment
  y Service del consumidor.
diagnostics.reconciliation_image: Conserva las imágenes inmutables proporcionadas del productor y consumidor.
diagnostics.reconciliation_delivery: El consumidor original debe completar el rollout con una réplica lista y Pods
  listos de su propiedad.
diagnostics.reconciliation_service: El Service conservado del consumidor debe seleccionar su workload y exponer
  la interfaz ClusterIP declarada.
diagnostics.reconciliation_publication: La interfaz real del consumidor debe publicar la ruta actual.
