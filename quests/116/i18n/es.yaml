diagnostics.owner_service_board: Service board debe tener station como propietario controlador.
diagnostics.route: La ruta station debe ser north-116.
diagnostics.generation: Station observedGeneration debe coincidir con la generación actual.
diagnostics.station_ready: Station ready debe ser true.
diagnostics.label: La etiqueta de controlador del Deployment board debe ser station-board.
diagnostics.ready: Board debe tener una réplica lista.
diagnostics.data: ConfigMap board-route index.html debe contener north-116 y un salto de línea.
