title: Conciliación personalizada resource
brief: "El endpoint board gestionado no ofrece la ruta requerida. Restaure un resultado reconciliado y listo bajo\
  \ el controlador de práctica.\n\nTrabaje en `~/quest` en la estación de trabajo. Archivos suministrados: `station.yaml`,\
  \ `client.yaml`.\n\n**Requirements:**\n\n- El Deployment `board`, ConfigMap `board-route` y Service `board` están\
  \ controlados por el StationBoard `station` actual; el Deployment conserva la etiqueta de controlador `devops-quests.controller=station-board`.\n\
  \  - La propiedad del controlador usa la versión API `training.devops-quests.local/v1`, tipo `StationBoard`, nombre\
  \ `station` y su UID actual. `index.html` es una entrada de datos de ConfigMap, no un archivo de la estación.\n\
  - StationBoard `station` tiene ruta deseada `north-116`, está listo para su generación actual con una réplica\
  \ `board` lista, y ConfigMap `board-route` ofrece `index.html` con `north-116` seguido de un salto de línea.\n\
  - Desde Deployment `client`, `http://board:8080` devuelve `north-116`.\n\n**Verify yourself before Check & finish:**\
  \ Ejecute estos comandos de observación desde `~/quest` en la estación de trabajo.\n\n- La configuración, identidad\
  \ y estado cumplen los requisitos.\n\n  ```sh\n  kubectl get stationboard station -o yaml\n  kubectl get deployment\
  \ board -o yaml\n  kubectl get configmap board-route -o yaml\n  kubectl get service board -o yaml\n  ```\n\n-\
  \ `kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080` — El consumidor recibe `north-116`.\n\n\
  Las comprobaciones observan el estado actual, no si se editaron recursos generados; este controlador de práctica\
  \ limitado y sondeado por el backend no es un framework de operadores general."
debrief: El ejercicio utilizó un objeto API real, un bucle de estado deseado, una carga de trabajo generada y status
  subresource.
stages.0.brief: La ruta gestionada por el controlador debe estar reconciliada y disponible.
hints.0.text: Un CRD agrega un API; el controlador implementa el comportamiento. La ruta deseada suministrada está
  cerrada. Cambie la spec deseada, no los recursos generados ni el status.
hints.1.text: Cambie desired spec y inspect status.observedGeneration.
hints.2.text: Configure route north-116 y espere la entrega de reconciliation y projected ConfigMap.
phrases.0: Cambié el estado de desired en el custom resource.
phrases.1: Revisé el controlador observed generation.
phrases.2: Verifiqué la respuesta de la solicitud conciliada.
questions.0.points.0: No; Define el almacenamiento, el esquema y la forma API.
questions.0.points.1: Un controlador debe implementar el bucle de estado deseado.
questions.0.prompt: ¿La instalación de un CRD implementa reconciliation?
questions.1.points.0: Identifica qué desired revision manejó el controlador.
questions.1.points.1: El Ready de una generación anterior puede estar obsoleto.
questions.1.prompt: ¿Por qué comparar observedGeneration con generation?
