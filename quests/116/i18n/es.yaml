title: Conciliación personalizada resource
brief: 'Un recurso personalizado StationBoard controla un pequeño operador de entrenamiento. El operador se ejecuta en el
  backend del juego, consulta con su cadencia habitual solo el objeto station de esta bahía y reconcilia un ConfigMap, Deployment
  y Service limitados. La ruta deseada actual es closed. Cambia spec.route a north-116; no edites a mano los recursos generados
  ni el estado. Comprueba observedGeneration, el estado ready y HTTP real. Este controlador es deliberadamente limitado, no
  un framework de operadores general.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `station.json`, `client.json`.


  La bahía no dispone de Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas y servicios
  privados. Cambie sólo esta bahía.


  El `station.json` proporcionado describe el recurso personalizado y `client.json` el deployment/client. Las comprobaciones
  requieren `spec.route: north-116`, `status.observedGeneration` igual a la generación actual y `status.ready: true`. Deployment
  `board`, ConfigMap `board-route` y Service `board` deben tener cada uno un ownerReference controlador con API `training.devops-quests.local/v1`,
  kind `StationBoard`, nombre `station` y el UID activo de station. La etiqueta del Deployment `devops-quests.controller`
  debe ser `station-board` y una réplica estar lista; la clave `index.html` del ConfigMap debe contener exactamente `north-116`
  seguido de un salto de línea, y `board:8080` devolver `north-116`. Es estado actual; no demuestra que los recursos generados
  nunca se editaran a mano.'
debrief: El ejercicio utilizó un objeto API real, un bucle de estado deseado, una carga de trabajo generada y status subresource.
stages.0.brief: El estado de station, ownerReferences, objetos generados y respuesta board coinciden con la descripción.
stages.0.objectives.0.text: El estado de station, ownerReferences, objetos generados y respuesta board coinciden con la descripción.
hints.0.text: Un CRD agrega un API; el controlador implementa el comportamiento.
hints.1.text: Cambie desired spec y inspect status.observedGeneration.
hints.2.text: Configure route north-116 y espere la entrega de reconciliation y projected ConfigMap.
phrases.0: Cambié el estado de desired en el custom resource.
phrases.1: Revisé el controlador observed generation.
phrases.2: Verifiqué la respuesta de la solicitud conciliada.
