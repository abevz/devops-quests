title: Conciliación personalizada resource
brief: |-
  El endpoint board gestionado no ofrece la ruta requerida. Restaure un resultado reconciliado y listo bajo el controlador de práctica.

  Trabaja en la workstation en `~/quest` con los archivos suministrados:
  - `station.yaml`, `client.yaml`.

  **Requirements:**

  - La carga board, sus datos de ruta y su Service siguen perteneciendo al StationBoard existente y conservan la identidad del controlador suministrada.
  - El StationBoard existente solicita `north-116` y está listo para su generación actual con una réplica board lista; su página generada en el ConfigMap de ruta existente contiene `north-116` seguido de un salto de línea.
  - Desde Deployment `client`, `http://board:8080` devuelve `north-116`.

  Las comprobaciones observan el estado actual, no si se editaron recursos generados; este controlador de práctica limitado y sondeado por el backend no es un framework de operadores general.
debrief: El ejercicio utilizó un objeto API real, un bucle de estado deseado, una carga de trabajo generada
  y status subresource.
stages.0.brief: La carga generada sigue siendo propiedad del controlador suministrado.
hints.0.text: Un CRD agrega un API; el controlador implementa el comportamiento. La ruta deseada suministrada
  está cerrada. Cambie la spec deseada, no los recursos generados ni el status.
hints.1.text: |-
  Cambie desired spec y inspect status.observedGeneration.

  Inspecciona los datos suministrados y las observaciones activas:

  ```sh
  kubectl get stationboard station -o yaml
    kubectl get deployment board -o yaml
    kubectl get configmap board-route -o yaml
    kubectl get service board -o yaml
  ```
hints.2.text: |-
  Configure route north-116 y espere la entrega de reconciliation y projected ConfigMap.

  Verifica el resultado desde `~/quest` en la workstation:

  - `kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080` — El consumidor recibe `north-116`.
phrases.0: Cambié el estado de desired en el custom resource.
phrases.1: Revisé el controlador observed generation.
phrases.2: Verifiqué la respuesta de la solicitud conciliada.
questions.0.points.0: No; Define el almacenamiento, el esquema y la forma API.
questions.0.points.1: Un controlador debe implementar el bucle de estado deseado.
questions.0.prompt: ¿La instalación de un CRD implementa reconciliation?
questions.1.points.0: Identifica qué desired revision manejó el controlador.
questions.1.points.1: El Ready de una generación anterior puede estar obsoleto.
questions.1.prompt: ¿Por qué comparar observedGeneration con generation?
