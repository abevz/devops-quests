title: Conciliación personalizada resource
brief: 'Un StationBoard personalizado resource conduce a un pequeño operador de capacitación. El operador
  ejecuta el juego backend con su cadencia de sondeo normal, lee solo el objeto station de esta bahía
  y concilia un ConfigMap, Deployment y un Service acotados. Su actual desired route es closed. Cambie
  spec.route a north-116; no edite manualmente los recursos generados o status. Verifique observedGeneration,
  ready status y HTTP real. Este controlador es intencionalmente estrecho, no un operador de uso general
  framework.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `station.json`, `client.json`.


  La bahía no dispone de Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes
  precargadas y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: el operador real observa la nueva generación, concilia un board en buen
  estado y sirve al north-116.'
debrief: El ejercicio utilizó un objeto API real, un bucle de estado deseado, una carga de trabajo generada
  y status subresource.
