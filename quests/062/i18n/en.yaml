title: NetworkPolicy
brief: |-
  The protected application is not reachable by its permitted requester. Restore narrow access while retaining guest isolation.

  Work on the workstation in `~/quest` with the supplied files:
  - `isolation-contract.json`.

  **Requirements:**

  - The existing NetworkPolicy retains its protected workload and permitted caller scope, allowing only inbound HTTP traffic for that service. Preserve the original policy and Deployment identities and provided images. The permitted caller’s desired Pod template and every current ready Pod must remain inside the retained policy’s caller scope, as specified by `isolation-contract.json`.
  - Exactly one NetworkPolicy exists in the bay.
  - HTTP from Deployment `dispatcher` to `http://board:8080` returns `north-62`.
  - HTTP from Deployment `visitor` to `http://board:8080` is blocked.

  Checks observe current desired state, Pod ownership and traffic, not label-edit history. Keep the original ingress-only boundary and change only this bay.
debrief: The checks compared the original narrow policy, retained workload identities, desired and current caller
  membership and real allowed/denied traffic.
stages.0.brief: Retain the policy’s inbound-only isolation boundary.
stages.0.objectives.0.text: The existing NetworkPolicy retains its protected workload and permitted caller scope,
  allowing only inbound HTTP traffic for that service. Preserve the original policy and Deployment identities and
  provided images. The permitted caller’s desired Pod template and every current ready Pod must remain inside the
  retained policy’s caller scope, as specified by `isolation-contract.json`.
stages.0.objectives.1.text: Exactly one NetworkPolicy exists in the bay.
stages.0.objectives.2.text: HTTP from Deployment `dispatcher` to `http://board:8080` returns `north-62`.
stages.0.objectives.3.text: HTTP from Deployment `visitor` to `http://board:8080` is blocked.
hints.0.text: A policy selects destination Pods and permits sources by a separate selector. A label on one current
  Pod and the labels in a Deployment template have different lifetimes; broadening the boundary hides the dependency
  instead of repairing it.
hints.1.text: |-
  Compare the policy’s complete scope, the desired caller template and current owned Pods. These objects already exist:

  ```sh
  cat isolation-contract.json
  kubectl get networkpolicy -o yaml
  kubectl get deployments -o yaml
  kubectl get pods --show-labels
  ```
hints.2.text: |-
  Verify the policy count and identities, desired and current caller membership, the permitted response and the denied guest request:

  ```sh
  kubectl get networkpolicy -o name
  kubectl get deployment dispatcher -o yaml
  kubectl get pods -l app=dispatcher --show-labels
  kubectl rollout status deployment/dispatcher --timeout=90s
  kubectl exec deployment/dispatcher -- wget -qO- -T 3 http://board:8080
  if kubectl exec deployment/visitor -- wget -qO- -T 3 http://board:8080; then
   printf '%s\n' 'unexpected guest access'
  else
   printf '%s\n' 'guest denied'
  fi
  ```
phrases.0: I checked source selectors, direction and ports separately.
phrases.1: I tested a denied client as well as the allowed one.
phrases.2: I avoided additive allow-all policies during recovery.
questions.0.points.0: Their allowed traffic is combined.
questions.0.points.1: Allow-all can undo intended isolation.
questions.0.points.2: Check ingress and egress independently.
questions.0.prompt: What happens when two policies select the same Pod?
questions.1.points.0: Availability does not prove the access boundary.
questions.1.points.1: Selectors may include extra Pods.
questions.1.points.2: The CNI must enforce policy on real traffic.
questions.1.prompt: Why test a rejected client after opening a service path?
diagnostics.probe_0_0: Narrow ingress or desired/current caller membership could not be verified.
diagnostics.isolation_identity: The original ingress policy or a supplied workload identity or application image
  changed.
diagnostics.isolation_template: The desired caller Pod template does not match the retained policy’s permitted-source
  selector.
diagnostics.isolation_current: Current owned caller Pods are missing, not ready, or outside the retained permitted-source
  scope.
