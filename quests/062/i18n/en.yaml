title: NetworkPolicy
brief: 'The board and Service are healthy, but the only ingress policy allows dispatcher Pods on TCP 9090
  instead of HTTP 8080. Repair the port while preserving the board selector, dispatcher-only source and
  ingress-only direction. Visitor must remain blocked. The owned kind CNI enforces NetworkPolicy: actual
  traffic is checked.


  Quest files in `~/quest` (some appear in later stages): `board.json`, `service.json`, `dispatcher.json`,
  `visitor.json`, `policy.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: Dispatcher reaches north-62 on TCP 8080; visitor is denied and the single
  policy retains narrow selectors.'
debrief: The service route was restored while an unrelated client remained isolated.
stages.0.brief: 'Dispatcher reaches north-62 on TCP 8080; visitor is denied and the single policy retains
