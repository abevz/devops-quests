stages.0.objectives.0.text: Dispatcher reaches north-62 on TCP 8080; visitor is denied and the single
  policy retains narrow selectors.
hints.0.text: A healthy Service does not bypass Pod ingress policy.
hints.1.text: Policies are additive; allow-all would break isolation.
hints.2.text: Change the allowed port to 8080 and test permitted and denied clients.
phrases.0: I checked source selectors, direction and ports separately.
phrases.1: I tested a denied client as well as the allowed one.
phrases.2: I avoided additive allow-all policies during recovery.
questions.0.points.0: Their allowed traffic is combined.
questions.0.points.1: Allow-all can undo intended isolation.
questions.0.points.2: Check ingress and egress independently.
questions.0.prompt: What happens when two policies select the same Pod?
questions.1.points.0: Availability does not prove the access boundary.
questions.1.points.1: Selectors may include extra Pods.
questions.1.points.2: The CNI must enforce policy on real traffic.
questions.1.prompt: Why test a rejected client after opening a service path?
