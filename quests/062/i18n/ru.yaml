title: NetworkPolicy
brief: 'Board и Service исправны, но единственная ingress policy разрешает Pod dispatcher TCP 9090 вместо
  HTTP 8080. Исправьте порт, сохранив selector board, источник только dispatcher и направление только
  Ingress. Visitor должен остаться заблокирован. CNI собственной kind-песочницы применяет NetworkPolicy:
  проверяется реальный трафик.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `board.json`, `service.json`, `dispatcher.json`,
  `visitor.json`, `policy.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Dispatcher получает north-62 по TCP 8080; visitor не проходит, единственная policy
  сохраняет узкие selectors.'
debrief: Маршрут сервиса восстановлен с сохранением изоляции постороннего клиента.
stages.0.brief: 'Dispatcher получает north-62 по TCP 8080; visitor не проходит, единственная policy сохраняет
  узкие selectors.


  Результат проверки: Dispatcher получает north-62 по TCP 8080; visitor не проходит, единственная policy
  сохраняет узкие selectors.'
stages.0.objectives.0.text: Dispatcher получает north-62 по TCP 8080; visitor не проходит, единственная
  policy сохраняет узкие selectors.
hints.0.text: Исправный Service не обходит ingress policy Pod.
hints.1.text: Policies складываются; allow-all нарушит изоляцию.
hints.2.text: Измените разрешённый порт на 8080 и проверьте разрешённого и запрещённого клиентов.
phrases.0: Я отдельно проверил selectors источника, направление и порты.
phrases.1: Я проверил запрещённого клиента наряду с разрешённым.
phrases.2: При восстановлении я не добавлял allow-all policies.
questions.0.points.0: Разрешённый ими трафик объединяется.
questions.0.points.1: Allow-all может нарушить задуманную изоляцию.
questions.0.points.2: Отдельно проверять ingress и egress.
questions.0.prompt: Что происходит, когда две policies выбирают один Pod?
questions.1.points.0: Доступность не доказывает границы доступа.
questions.1.points.1: Selectors могут включать лишние Pod.
questions.1.points.2: CNI должен применять policy к реальному трафику.
questions.1.prompt: Зачем проверять запрещённого клиента после открытия пути к сервису?
