title: NetworkPolicy
brief: |-
  HTTP-адрес должен быть доступен разрешённой нагрузке и изолирован от остальных источников запросов. Изоляция трафика обеспечивается сетью полигона.

  Работайте на workstation в `~/quest` с предоставленными файлами:
  - `board.yaml`, `service.yaml`, `dispatcher.yaml`, `visitor.yaml`, `policy.yaml`.

  **Требования:**

  - В песочнице остаётся ровно одна NetworkPolicy.
  - Существующая политика сохраняет защищаемую нагрузку и область разрешённых вызывающих сторон:
    - Разрешён только входящий HTTP-трафик к этому сервису.
    - Политика применяется только к ingress.
  - Из Deployment `dispatcher` адрес `http://board:8080` возвращает `north-62`; из Deployment `visitor` тот же endpoint заблокирован.

  Пробы трафика охватывают две предоставленные вызывающие стороны; они не проверяют всех возможных клиентов или исходящие пути.
debrief: Маршрут сервиса восстановлен с сохранением изоляции постороннего клиента.
stages.0.brief: Сохраните границу изоляции политики только для входящего трафика.
stages.0.objectives.0.text: Существующая NetworkPolicy сохраняет защищаемую нагрузку и область разрешённых
  вызывающих сторон, разрешая только входящий HTTP-трафик этого сервиса.
stages.0.objectives.1.text: В стенде существует ровно одна NetworkPolicy.
stages.0.objectives.2.text: HTTP-запрос из Deployment `dispatcher` к `http://board:8080` возвращает `north-62`.
stages.0.objectives.3.text: HTTP-запрос из Deployment `visitor` к `http://board:8080` заблокирован.
hints.0.text: Исправный Service не обходит ingress policy Pod.
hints.1.text: |-
  Policies складываются; allow-all нарушит изоляцию.

  Изучите предоставленные файлы и живые наблюдения:

  ```sh
  kubectl get networkpolicy -o yaml
  kubectl get pods --show-labels
  ```
hints.2.text: |-
  Предоставленная политика разрешает Pod dispatcher TCP 9090 вместо HTTP 8080. Измените разрешённый порт на 8080 и проверьте разрешённые и запрещённые клиенты.

  Проверьте результат из `~/quest` на workstation:

  Выполняйте эти команды наблюдения из `~/quest` на workstation.
  - `kubectl exec deployment/dispatcher -c worker -- wget -qO- -T 3 http://board:8080` — Разрешённый источник запросов получает `north-62`.
  - `kubectl exec deployment/visitor -c worker -- wget -qO- -T 2 http://board:8080` — Изолированный источник не может подключиться; команда должна завершиться ошибкой.
  - Существует ровно одна политика; её цель, разрешённые источники, направление и порт соответствуют требованиям.

    ```sh
    kubectl get networkpolicy
    kubectl get networkpolicy board-ingress -o yaml
    ```
phrases.0: Я отдельно проверил selectors источника, направление и порты.
phrases.1: Я проверил запрещённого клиента наряду с разрешённым.
phrases.2: При восстановлении я не добавлял allow-all policies.
questions.0.points.0: Разрешённый ими трафик объединяется.
questions.0.points.1: Allow-all может нарушить задуманную изоляцию.
questions.0.points.2: Отдельно проверять ingress и egress.
questions.0.prompt: Что происходит, когда две policies выбирают один Pod?
questions.1.points.0: Доступность не доказывает границы доступа.
questions.1.points.1: Selectors могут включать лишние Pod.
questions.1.points.2: CNI должен применять policy к реальному трафику.
questions.1.prompt: Зачем проверять запрещённого клиента после открытия пути к сервису?
diagnostics.probe_0_0: 'Текущие данные не позволили проверить эту цель: Существующая NetworkPolicy сохраняет защищаемую
  нагрузку и область разрешённых вызывающих сторон, разрешая только входящий HTTP-трафик этого сервиса.'
