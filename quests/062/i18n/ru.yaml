title: NetworkPolicy
brief: |-
  Защищённое табло недоступно разрешённому потребителю. Восстановите узкий доступ, сохранив изоляцию гостя.

  Работайте на рабочей станции в `~/quest` с предоставленными файлами:
  - `isolation-contract.json`.

  **Требования:**

  - Существующая NetworkPolicy сохраняет защищаемую нагрузку и область разрешённых вызывающих сторон, разрешая только входящий HTTP-трафик этого сервиса. Сохраните идентичность исходной политики и Deployment и предоставленные образы. Желаемый шаблон Pod разрешённого потребителя и каждый текущий готовый Pod должны соответствовать области отправителей сохранённой политики по `isolation-contract.json`.
  - В стенде существует ровно одна NetworkPolicy.
  - HTTP-запрос из Deployment `dispatcher` к `http://board:8080` возвращает `north-62`.
  - HTTP-запрос из Deployment `visitor` к `http://board:8080` заблокирован.

  Проверки наблюдают текущее желаемое состояние, принадлежность Pod и трафик, но не историю изменения меток. Сохраните исходную входящую границу и меняйте только этот bay.
debrief: Проверки сравнили исходную узкую политику, идентичность нагрузок, принадлежность желаемого и текущих потребителей
  и реальный разрешённый и запрещённый трафик.
stages.0.brief: Сохраните границу изоляции политики только для входящего трафика.
stages.0.objectives.0.text: Существующая NetworkPolicy сохраняет защищаемую нагрузку и область разрешённых вызывающих
  сторон, разрешая только входящий HTTP-трафик этого сервиса. Сохраните идентичность исходной политики и Deployment
  и предоставленные образы. Желаемый шаблон Pod разрешённого потребителя и каждый текущий готовый Pod должны соответствовать
  области отправителей сохранённой политики по `isolation-contract.json`.
stages.0.objectives.1.text: В стенде существует ровно одна NetworkPolicy.
stages.0.objectives.2.text: HTTP-запрос из Deployment `dispatcher` к `http://board:8080` возвращает `north-62`.
stages.0.objectives.3.text: HTTP-запрос из Deployment `visitor` к `http://board:8080` заблокирован.
hints.0.text: Политика выбирает целевые Pod и отдельно задаёт селектор разрешённых отправителей. Метка текущего
  Pod и метки шаблона Deployment имеют разные сроки жизни; расширение границы скрывает зависимость вместо её исправления.
hints.1.text: |-
  Сопоставьте полную область политики, желаемый шаблон потребителя и текущие принадлежащие ему Pod. Эти объекты уже существуют:

  ```sh
  cat isolation-contract.json
  kubectl get networkpolicy -o yaml
  kubectl get deployments -o yaml
  kubectl get pods --show-labels
  ```
hints.2.text: |-
  Проверьте число и идентичность политик, принадлежность желаемого и текущих потребителей, разрешённый ответ и отказ гостевому запросу:

  ```sh
  kubectl get networkpolicy -o name
  kubectl get deployment dispatcher -o yaml
  kubectl get pods -l app=dispatcher --show-labels
  kubectl rollout status deployment/dispatcher --timeout=90s
  kubectl exec deployment/dispatcher -- wget -qO- -T 3 http://board:8080
  if kubectl exec deployment/visitor -- wget -qO- -T 3 http://board:8080; then
   printf '%s\n' 'unexpected guest access'
  else
   printf '%s\n' 'guest denied'
  fi
  ```
phrases.0: Я отдельно проверил selectors источника, направление и порты.
phrases.1: Я проверил запрещённого клиента наряду с разрешённым.
phrases.2: При восстановлении я не добавлял allow-all policies.
questions.0.points.0: Разрешённый ими трафик объединяется.
questions.0.points.1: Allow-all может нарушить задуманную изоляцию.
questions.0.points.2: Отдельно проверять ingress и egress.
questions.0.prompt: Что происходит, когда две policies выбирают один Pod?
questions.1.points.0: Доступность не доказывает границы доступа.
questions.1.points.1: Selectors могут включать лишние Pod.
questions.1.points.2: CNI должен применять policy к реальному трафику.
questions.1.prompt: Зачем проверять запрещённого клиента после открытия пути к сервису?
diagnostics.probe_0_0: 'Сохранённая ingress-политика не задаёт только TCP-доступ dispatcher на 8080 либо наблюдение не удалось: причиной могут быть выданный порт 9090, более широкий selector или правило, неоднозначные именованные порты или недоступные данные API. [Причина и проверка](guides#guide=kubernetes-10&section=isolation-bounded-ingress-contract)'
diagnostics.isolation_identity: 'Изменился UID исходной политики или Deployment либо образ worker отличается от выданной ссылки или digest: пересоздание объектов или замена приложения нарушают сохраняемые идентичности. [Причина и проверка](guides#guide=kubernetes-10&section=isolation-original-policy-and-workloads)'
diagnostics.isolation_template: 'Шаблон Deployment dispatcher не выбран ingress-peer сохранённой политики: выданный role=retired или изменение метки только живого Pod оставляют будущие Pod вне разрешённой группы. [Причина и проверка](guides#guide=kubernetes-10&section=isolation-desired-caller-membership)'
diagnostics.isolation_current: 'Текущие принадлежащие dispatcher Pod отсутствуют, не готовы или вне разрешённого peer либо наблюдение не удалось: незавершённый rollout, старые метки Pod, отсутствующие защищённые объекты и данные или ошибки API и лимита времени мешают проверке. [Причина и проверка](guides#guide=kubernetes-10&section=isolation-current-caller-observation)'
diagnostics.isolation_policy_count: 'Namespace не сообщает ровно одну NetworkPolicy либо список не прочитан: создание второй политики вместо исправления сохранённой меняет суммарный набор разрешённых соединений. [Причина и проверка](guides#guide=kubernetes-10&section=isolation-single-effective-policy)'
diagnostics.isolation_allowed: 'Запрос dispatcher не вернул north-62 либо exec и HTTP завершились ошибкой: текущие метки ещё не соответствуют разрешённому peer, политика использует другой порт либо Service и нагрузка board недоступны. [Причина и проверка](guides#guide=kubernetes-10&section=isolation-permitted-service-response)'
diagnostics.isolation_denied: 'Запрос исключённого visitor завершился успешно: более широкие ingress-разрешения или метки, включающие visitor в разрешённую группу, допускают нежелательное соединение с board. [Причина и проверка](guides#guide=kubernetes-10&section=isolation-excluded-caller-access)'
