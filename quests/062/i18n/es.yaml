title: NetworkPolicy
brief: 'board y Service están en buen estado, pero el único ingress policy permite pods dispatcher en
  TCP 9090 en lugar de HTTP 8080. Repare el puerto conservando la fuente de solo board selector, dispatcher
  y la dirección de solo ingreso. Visitor debe permanecer bloqueado. El kind CNI de propiedad aplica NetworkPolicy:
  se verifica el tráfico real.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `board.json`, `service.json`,
  `dispatcher.json`, `visitor.json`, `policy.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: Dispatcher alcanza north-62 en TCP 8080; Se deniega visitor y el único
  policy conserva el estrecho selectors.'
debrief: El servicio route se restableció mientras que un client no relacionado permaneció aislado.
stages.0.brief: 'Criterios de éxito: Dispatcher alcanza north-62 en TCP 8080; Se deniega visitor y el
  único policy conserva el estrecho selectors.'
stages.0.objectives.0.text: Dispatcher llega a north-62 en TCP 8080; Se niega visitor y el único policy
  conserva el estrecho selectors.
hints.0.text: Un Service en buen estado no omite Pod ingress policy.
hints.1.text: Policies son aditivos; allow-all rompería el aislamiento.
hints.2.text: Cambie el puerto permitido a 8080 y pruebe los clientes permitidos y denegados.
phrases.0: Verifiqué la fuente selectors, la dirección y los puertos por separado.
phrases.1: Probé un client denegado y uno permitido.
phrases.2: Evité el aditivo allow-all policies durante la recuperación.
questions.0.points.0: Su tráfico permitido se combina.
questions.0.points.1: Allow-all puede deshacer el aislamiento previsto.
questions.0.points.2: Verifique ingress y egress de forma independiente.
questions.0.prompt: ¿Qué pasa cuando dos policies seleccionan el mismo Pod?
questions.1.points.0: La disponibilidad no prueba el límite de acceso.
questions.1.points.1: Selectors puede incluir Pods adicionales.
questions.1.points.2: El CNI debe aplicar policy en el tráfico real.
questions.1.prompt: ¿Por qué probar un client rechazado después de abrir una ruta de servicio?
