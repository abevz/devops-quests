title: NetworkPolicy
brief: |
  El endpoint HTTP debe estar disponible para la carga permitida y aislado de otros solicitantes. La red de la bahía aplica el aislamiento del tráfico.

  Trabaja en `~/quest` en la workstation. Archivos de entrada suministrados: `board.json`, `service.json`, `dispatcher.json`, `visitor.json`, `policy.json`.

  **Requisitos:**
  - La bahía tiene exactamente una NetworkPolicy:
    - `board-ingress`
  - La política protege Pods con esta etiqueta:
    - `app=board`
  - Se aplica solo al tráfico entrante y permite únicamente estas conexiones entrantes:
    - Pods: `role=dispatcher`
    - TCP: `8080`
  - Desde el Deployment `dispatcher`, HTTP a `http://board:8080` devuelve `north-62`; desde el Deployment `visitor`, el mismo endpoint está bloqueado.

  **Verifica antes de Check & finish:**
  Ejecuta estos comandos de observación desde `~/quest` en la workstation.
  - `kubectl exec deployment/dispatcher -c worker -- wget -qO- -T 3 http://board:8080` — El solicitante permitido recibe `north-62`.
  - `kubectl exec deployment/visitor -c worker -- wget -qO- -T 2 http://board:8080` — El solicitante aislado no puede conectarse; el comando debe fallar.
  - Existe exactamente una política y su destino, fuentes permitidas, dirección y puerto coinciden con Requisitos.

    ```sh
    kubectl get networkpolicy
    kubectl get networkpolicy board-ingress -o yaml
    ```
debrief: El servicio route se restableció mientras que un client no relacionado permaneció aislado.
stages.0.brief: |
  Mantén la respuesta HTTP requerida disponible solo para los solicitantes permitidos.
stages.0.objectives.0.text: NetworkPolicy `board-ingress` protege Pods con la etiqueta `app=board`, permite
  tráfico entrante solo desde Pods con la etiqueta `role=dispatcher` al puerto TCP `8080` y se aplica
  solo al tráfico entrante.
stages.0.objectives.1.text: Existe exactamente una NetworkPolicy en el entorno.
stages.0.objectives.2.text: HTTP desde Deployment `dispatcher` a `http://board:8080` devuelve `north-62`.
stages.0.objectives.3.text: HTTP desde el Deployment `visitor` a `http://board:8080` está bloqueado.
hints.0.text: Un Service en buen estado no omite Pod ingress policy.
hints.1.text: Policies son aditivos; allow-all rompería el aislamiento.
hints.2.text: |
  La política suministrada permite Pods dispatcher en TCP 9090 en lugar de HTTP 8080. Cambia el puerto permitido a 8080 y prueba clientes permitidos y bloqueados.
phrases.0: Verifiqué la fuente selectors, la dirección y los puertos por separado.
phrases.1: Probé un client denegado y uno permitido.
phrases.2: Evité el aditivo allow-all policies durante la recuperación.
questions.0.points.0: Su tráfico permitido se combina.
questions.0.points.1: Allow-all puede deshacer el aislamiento previsto.
questions.0.points.2: Verifique ingress y egress de forma independiente.
questions.0.prompt: ¿Qué pasa cuando dos policies seleccionan el mismo Pod?
questions.1.points.0: La disponibilidad no prueba el límite de acceso.
questions.1.points.1: Selectors puede incluir Pods adicionales.
questions.1.points.2: El CNI debe aplicar policy en el tráfico real.
questions.1.prompt: ¿Por qué probar un client rechazado después de abrir una ruta de servicio?
