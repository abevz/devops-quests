title: NetworkPolicy
brief: |-
  El tablero protegido no es accesible para el solicitante permitido. Recupera un acceso limitado conservando el aislamiento del invitado.

  Trabaja en la estación de trabajo, en `~/quest`, con los archivos suministrados:
  - `isolation-contract.json`.

  **Requisitos:**

  - La NetworkPolicy existente conserva su carga protegida y el ámbito de clientes permitidos, autorizando solo tráfico HTTP entrante para ese servicio. Conserva las identidades de la política y Deployments originales y las imágenes suministradas. La plantilla de Pod deseada del solicitante permitido y cada Pod actual listo deben pertenecer al ámbito de origen de la política conservada según `isolation-contract.json`.
  - Existe exactamente una NetworkPolicy en el entorno.
  - HTTP desde Deployment `dispatcher` a `http://board:8080` devuelve `north-62`.
  - HTTP desde el Deployment `visitor` a `http://board:8080` está bloqueado.

  Las comprobaciones observan estado deseado actual, pertenencia de Pods y tráfico, no el historial de etiquetas. Conserva el límite original solo de entrada y cambia únicamente este bay.
debrief: Las comprobaciones compararon la política limitada original, identidades conservadas, pertenencia deseada
  y actual del solicitante y tráfico real permitido y denegado.
stages.0.brief: Conserva el límite de aislamiento de la política solo para tráfico entrante.
stages.0.objectives.0.text: La NetworkPolicy existente conserva su carga protegida y el ámbito de clientes permitidos,
  autorizando solo tráfico HTTP entrante para ese servicio. Conserva las identidades de la política y Deployments
  originales y las imágenes suministradas. La plantilla de Pod deseada del solicitante permitido y cada Pod actual
  listo deben pertenecer al ámbito de origen de la política conservada según `isolation-contract.json`.
stages.0.objectives.1.text: Existe exactamente una NetworkPolicy en el entorno.
stages.0.objectives.2.text: HTTP desde Deployment `dispatcher` a `http://board:8080` devuelve `north-62`.
stages.0.objectives.3.text: HTTP desde el Deployment `visitor` a `http://board:8080` está bloqueado.
hints.0.text: Una política selecciona Pods destino y permite fuentes mediante otro selector. Las etiquetas de un
  Pod actual y de una plantilla de Deployment tienen vidas distintas; ampliar el límite oculta la dependencia en
  vez de repararla.
hints.1.text: |-
  Compara el ámbito completo de la política, la plantilla deseada del solicitante y sus Pods actuales. Estos objetos ya existen:

  ```sh
  cat isolation-contract.json
  kubectl get networkpolicy -o yaml
  kubectl get deployments -o yaml
  kubectl get pods --show-labels
  ```
hints.2.text: |-
  Verifica cantidad e identidades de políticas, pertenencia deseada y actual del solicitante, respuesta permitida y rechazo de la petición del invitado:

  ```sh
  kubectl get networkpolicy -o name
  kubectl get deployment dispatcher -o yaml
  kubectl get pods -l app=dispatcher --show-labels
  kubectl rollout status deployment/dispatcher --timeout=90s
  kubectl exec deployment/dispatcher -- wget -qO- -T 3 http://board:8080
  if kubectl exec deployment/visitor -- wget -qO- -T 3 http://board:8080; then
   printf '%s\n' 'unexpected guest access'
  else
   printf '%s\n' 'guest denied'
  fi
  ```
phrases.0: Verifiqué la fuente selectors, la dirección y los puertos por separado.
phrases.1: Probé un client denegado y uno permitido.
phrases.2: Evité el aditivo allow-all policies durante la recuperación.
questions.0.points.0: Su tráfico permitido se combina.
questions.0.points.1: Allow-all puede deshacer el aislamiento previsto.
questions.0.points.2: Verifique ingress y egress de forma independiente.
questions.0.prompt: ¿Qué pasa cuando dos policies seleccionan el mismo Pod?
questions.1.points.0: La disponibilidad no prueba el límite de acceso.
questions.1.points.1: Selectors puede incluir Pods adicionales.
questions.1.points.2: El CNI debe aplicar policy en el tráfico real.
questions.1.prompt: ¿Por qué probar un client rechazado después de abrir una ruta de servicio?
diagnostics.probe_0_0: No se pudo verificar el ámbito limitado de entrada o la pertenencia deseada y actual del
  solicitante.
diagnostics.isolation_identity: Cambió la política de entrada original, una identidad de carga suministrada o una
  imagen de aplicación.
diagnostics.isolation_template: La plantilla deseada del solicitante no coincide con el selector de fuentes permitidas
  de la política conservada.
diagnostics.isolation_current: Faltan Pods actuales del solicitante, no están listos o quedan fuera del ámbito de
  origen conservado.
