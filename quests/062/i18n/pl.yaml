title: NetworkPolicy
brief: |
  Punkt HTTP ma być dostępny dla dozwolonego obciążenia i odizolowany od innych źródeł żądań. Sieć środowiska wymusza izolację ruchu.

  Pracuj w `~/quest` na workstation. Dostarczone pliki wejściowe: `board.yaml`, `service.yaml`, `dispatcher.yaml`, `visitor.yaml`, `policy.yaml`.

  **Wymagania:**
  - Środowisko ma dokładnie jedną NetworkPolicy:
    - `board-ingress`
  - Polityka chroni Pody z tą etykietą:
    - `app=board`
  - Dotyczy wyłącznie ruchu przychodzącego i zezwala tylko na następujące połączenia przychodzące:
    - Pods: `role=dispatcher`
    - TCP: `8080`
  - Z Deployment `dispatcher` żądanie HTTP do `http://board:8080` zwraca `north-62`; z Deployment `visitor` ten sam punkt jest zablokowany.

  **Sprawdź samodzielnie przed Check & finish:**
  Wykonaj te polecenia obserwacyjne w `~/quest` na workstation.
  - `kubectl exec deployment/dispatcher -c worker -- wget -qO- -T 3 http://board:8080` — Dozwolone źródło żądań otrzymuje `north-62`.
  - `kubectl exec deployment/visitor -c worker -- wget -qO- -T 2 http://board:8080` — Odizolowane źródło nie może się połączyć; polecenie ma zakończyć się błędem.
  - Istnieje dokładnie jedna polityka, a jej cel, dozwolone źródła, kierunek i port odpowiadają wymaganiom.

    ```sh
    kubectl get networkpolicy
    kubectl get networkpolicy board-ingress -o yaml
    ```
debrief: Trasa usługi została przywrócona, podczas gdy niepowiązany client pozostał odizolowany.
stages.0.brief: |
  Zachowaj dostęp do wymaganej odpowiedzi HTTP wyłącznie dla dozwolonych źródeł żądań.
stages.0.objectives.0.text: NetworkPolicy `board-ingress` chroni Pody z etykietą `app=board`, dopuszcza
  ruch przychodzący tylko z Podów z etykietą `role=dispatcher` na port TCP `8080` i dotyczy tylko ruchu
  przychodzącego.
stages.0.objectives.1.text: W środowisku istnieje dokładnie jedna NetworkPolicy.
stages.0.objectives.2.text: HTTP z Deployment `dispatcher` do `http://board:8080` zwraca `north-62`.
stages.0.objectives.3.text: HTTP z Deploymentu `visitor` do `http://board:8080` jest blokowany.
hints.0.text: Sprawny Service nie omija polityki ruchu przychodzącego Pod.
hints.1.text: Policies są addytywne; allow-all przerwałoby izolację.
hints.2.text: |
  Dostarczona polityka zezwala Podom dispatcher na TCP 9090 zamiast HTTP 8080. Zmień dozwolony port na 8080 i sprawdź klientów dozwolonych oraz blokowanych.
phrases.0: Osobno sprawdzałem źródło selectors, kierunek i porty.
phrases.1: Przetestowałem client odrzuconego i dozwolonego.
phrases.2: Podczas odzyskiwania unikałem dodatku allow-all policies.
questions.0.points.0: Ich dozwolony ruch jest łączony.
questions.0.points.1: Allow-all może cofnąć zamierzoną izolację.
questions.0.points.2: Sprawdź niezależnie ingress i egress.
questions.0.prompt: Co się stanie, gdy dwa policies wybiorą ten sam Pod?
questions.1.points.0: Dostępność nie potwierdza granicy dostępu.
questions.1.points.1: Selectors może zawierać dodatkowe moduły.
questions.1.points.2: CNI musi wymuszać policy w rzeczywistym ruchu.
questions.1.prompt: Po co testować odrzuconego client po otwarciu ścieżki usługi?
