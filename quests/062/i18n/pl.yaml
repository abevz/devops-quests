title: NetworkPolicy
brief: |-
  Chroniona tablica jest niedostępna dla dozwolonego odbiorcy. Przywróć wąski dostęp, zachowując izolację gościa.

  Pracuj na stacji roboczej w `~/quest` z dostarczonymi plikami:
  - `isolation-contract.json`.

  **Wymagania:**

  - Istniejąca NetworkPolicy zachowuje chronione obciążenie i zakres dozwolonych klientów, dopuszczając tylko przychodzący ruch HTTP tej usługi. Zachowaj tożsamość pierwotnej polityki i Deploymentów oraz dostarczone obrazy. Żądany szablon Poda dozwolonego nadawcy i każdy bieżący gotowy Pod muszą należeć do zachowanego zakresu nadawców polityki według `isolation-contract.json`.
  - W środowisku istnieje dokładnie jedna NetworkPolicy.
  - HTTP z Deployment `dispatcher` do `http://board:8080` zwraca `north-62`.
  - HTTP z Deploymentu `visitor` do `http://board:8080` jest blokowany.

  Kontrole obserwują bieżący stan żądany, przynależność Podów i ruch, nie historię zmian etykiet. Zachowaj pierwotną granicę wyłącznie Ingress i zmieniaj tylko ten bay.
debrief: Kontrole porównały pierwotną wąską politykę, zachowane tożsamości obciążeń, żądaną i bieżącą przynależność
  nadawcy oraz rzeczywisty dozwolony i zabroniony ruch.
stages.0.brief: Zachowaj granicę izolacji polityki dotyczącą wyłącznie ruchu przychodzącego.
stages.0.objectives.0.text: Istniejąca NetworkPolicy zachowuje chronione obciążenie i zakres dozwolonych klientów,
  dopuszczając tylko przychodzący ruch HTTP tej usługi. Zachowaj tożsamość pierwotnej polityki i Deploymentów oraz
  dostarczone obrazy. Żądany szablon Poda dozwolonego nadawcy i każdy bieżący gotowy Pod muszą należeć do zachowanego
  zakresu nadawców polityki według `isolation-contract.json`.
stages.0.objectives.1.text: W środowisku istnieje dokładnie jedna NetworkPolicy.
stages.0.objectives.2.text: HTTP z Deployment `dispatcher` do `http://board:8080` zwraca `north-62`.
stages.0.objectives.3.text: HTTP z Deploymentu `visitor` do `http://board:8080` jest blokowany.
hints.0.text: Polityka wybiera docelowe Pody, a osobny selektor określa dozwolone źródła. Etykiety bieżącego Poda
  i szablonu Deploymentu mają różne czasy życia; poszerzenie granicy ukrywa zależność zamiast ją naprawić.
hints.1.text: |-
  Porównaj pełny zakres polityki, żądany szablon nadawcy i bieżące należące do niego Pody. Te obiekty już istnieją:

  ```sh
  cat isolation-contract.json
  kubectl get networkpolicy -o yaml
  kubectl get deployments -o yaml
  kubectl get pods --show-labels
  ```
hints.2.text: |-
  Sprawdź liczbę i tożsamość polityk, żądaną i bieżącą przynależność nadawcy, dozwoloną odpowiedź oraz odrzucenie żądania gościa:

  ```sh
  kubectl get networkpolicy -o name
  kubectl get deployment dispatcher -o yaml
  kubectl get pods -l app=dispatcher --show-labels
  kubectl rollout status deployment/dispatcher --timeout=90s
  kubectl exec deployment/dispatcher -- wget -qO- -T 3 http://board:8080
  if kubectl exec deployment/visitor -- wget -qO- -T 3 http://board:8080; then
   printf '%s\n' 'unexpected guest access'
  else
   printf '%s\n' 'guest denied'
  fi
  ```
phrases.0: Osobno sprawdzałem źródło selectors, kierunek i porty.
phrases.1: Przetestowałem client odrzuconego i dozwolonego.
phrases.2: Podczas odzyskiwania unikałem dodatku allow-all policies.
questions.0.points.0: Ich dozwolony ruch jest łączony.
questions.0.points.1: Allow-all może cofnąć zamierzoną izolację.
questions.0.points.2: Sprawdź niezależnie ingress i egress.
questions.0.prompt: Co się stanie, gdy dwa policies wybiorą ten sam Pod?
questions.1.points.0: Dostępność nie potwierdza granicy dostępu.
questions.1.points.1: Selectors może zawierać dodatkowe moduły.
questions.1.points.2: CNI musi wymuszać policy w rzeczywistym ruchu.
questions.1.prompt: Po co testować odrzuconego client po otwarciu ścieżki usługi?
diagnostics.probe_0_0: Zachowana polityka ingress nie wyraża wyłącznie dostępu dispatcher TCP na 8080 lub obserwacja zawiodła; dostarczony port 9090, szerszy selektor/reguła, niejednoznaczne nazwane porty lub niedostępne API mogą to wyjaśniać. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=isolation-bounded-ingress-contract)
diagnostics.isolation_identity: UID pierwotnej polityki lub Deployment zmienił się albo obraz worker nie odpowiada dostarczonej referencji/digest; odtworzenie obiektów lub wymiana aplikacji narusza zachowane tożsamości izolacji. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=isolation-original-policy-and-workloads)
diagnostics.isolation_template: Szablon Deployment dispatcher nie jest wybierany przez peer zachowanej polityki ingress; dostarczone role=retired lub zmiana etykiety tylko żywego Poda pozostawia przyszłe Pody poza dozwoloną grupą. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=isolation-desired-caller-membership)
diagnostics.isolation_current: Bieżących własnych Podów dispatcher brakuje, nie są gotowe lub nie należą do dozwolonego peer albo obserwacja zawiodła; trwający rollout, stare etykiety, brak chronionych obiektów/danych lub błędy API/czasu blokują kontrolę członkostwa. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=isolation-current-caller-observation)
diagnostics.isolation_policy_count: Namespace nie zgłasza dokładnie jednej NetworkPolicy lub nie odczytano listy; dodanie drugiej zamiast naprawy zachowanej może zmienić sumę dozwolonych połączeń. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=isolation-single-effective-policy)
diagnostics.isolation_allowed: Żądanie dispatcher nie zwróciło north-62 lub exec/HTTP zawiódł; bieżące etykiety mogą nie pasować do peer, polityka używać złego portu albo Service/aplikacja board być niedostępne. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=isolation-permitted-service-response)
diagnostics.isolation_denied: Żądanie wykluczonego visitor powiodło się; szersze uprawnienia ingress lub etykiety włączające visitor do dozwolonej grupy dopuszczają niepożądane połączenie z board. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=isolation-excluded-caller-access)
