title: NetworkPolicy
brief: 'board und Service sind fehlerfrei, aber der einzige ingress policy erlaubt dispatcher Pods auf
  TCP 9090 statt HTTP 8080. Reparieren Sie den Port unter Beibehaltung der reinen Quelle board selector,
  dispatcher und der reinen Eingangsrichtung. Visitor muss gesperrt bleiben. Der eigene kind CNI erzwingt
  NetworkPolicy: Der tatsächliche Datenverkehr wird überprüft.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `board.json`, `service.json`, `dispatcher.json`,
  `visitor.json`, `policy.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: Dispatcher erreicht north-62 auf TCP 8080; visitor wird abgelehnt und der einzelne
  policy behält den schmalen Wert selectors.'
debrief: Der Dienst route wurde wiederhergestellt, während ein nicht verwandter Dienst client isoliert
  blieb.
stages.0.brief: 'Erfolgskriterien: Dispatcher erreicht north-62 auf TCP 8080; visitor wird abgelehnt und
  der einzelne policy behält den schmalen selectors.'
stages.0.objectives.0.text: Dispatcher erreicht north-62 auf TCP 8080; visitor wird abgelehnt und der
  einzelne policy behält den schmalen selectors.
hints.0.text: Ein fehlerfreier Service umgeht Pod ingress policy nicht.
hints.1.text: Policies sind additiv; allow-all würde die Isolation durchbrechen.
hints.2.text: Ändern Sie den zulässigen Port auf 8080 und testen Sie zugelassene und verweigerte Clients.
phrases.0: Ich habe Quelle selectors, Richtung und Ports separat überprüft.
phrases.1: Ich habe einen verweigerten client sowie den erlaubten getestet.
phrases.2: Ich habe während der Wiederherstellung auf den Zusatzstoff allow-all policies verzichtet.
questions.0.points.0: Ihr erlaubter Verkehr wird zusammengefasst.
questions.0.points.1: Allow-all kann eine beabsichtigte Isolierung rückgängig machen.
questions.0.points.2: Überprüfen Sie ingress und egress unabhängig voneinander.
questions.0.prompt: Was passiert, wenn zwei policies dasselbe Pod auswählen?
questions.1.points.0: Die Verfügbarkeit beweist nicht die Zugriffsgrenze.
questions.1.points.1: Selectors kann zusätzliche Pods enthalten.
questions.1.points.2: Der CNI muss policy im realen Datenverkehr erzwingen.
questions.1.prompt: Warum einen abgelehnten client testen, nachdem ein Servicepfad geöffnet wurde?
