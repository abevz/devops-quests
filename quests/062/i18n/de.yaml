title: NetworkPolicy
brief: |
  Der HTTP-Endpunkt muss für den zugelassenen Workload erreichbar und für andere Aufrufer isoliert bleiben. Das Bay-Netzwerk erzwingt die Verkehrsisolierung.

  Arbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte Eingabedateien: `board.yaml`, `service.yaml`, `dispatcher.yaml`, `visitor.yaml`, `policy.yaml`.

  **Anforderungen:**
  - Die Bay hat genau eine NetworkPolicy:
    - `board-ingress`
  - Die Richtlinie schützt Pods mit diesem Label:
    - `app=board`
  - Sie gilt nur für eingehenden Verkehr und erlaubt ausschließlich diese eingehenden Verbindungen:
    - Pods: `role=dispatcher`
    - TCP: `8080`
  - Von Deployment `dispatcher` liefert HTTP an `http://board:8080` den Wert `north-62`; von Deployment `visitor` ist derselbe Endpunkt gesperrt.

  **Vor Check & finish selbst prüfen:**
  Führen Sie diese Beobachtungsbefehle in `~/quest` auf der Workstation aus.
  - `kubectl exec deployment/dispatcher -c worker -- wget -qO- -T 3 http://board:8080` — Der zugelassene Aufrufer erhält `north-62`.
  - `kubectl exec deployment/visitor -c worker -- wget -qO- -T 2 http://board:8080` — Der isolierte Aufrufer kann keine Verbindung herstellen; der Befehl muss scheitern.
  - Genau eine Richtlinie existiert; Ziel, zugelassene Quellen, Richtung und Port entsprechen den Anforderungen.

    ```sh
    kubectl get networkpolicy
    kubectl get networkpolicy board-ingress -o yaml
    ```
debrief: Der Dienst route wurde wiederhergestellt, während ein nicht verwandter Dienst client isoliert
  blieb.
stages.0.brief: |
  Halten Sie die geforderte HTTP-Antwort nur für zugelassene Aufrufer erreichbar.
stages.0.objectives.0.text: NetworkPolicy `board-ingress` schützt Pods mit dem Label `app=board`, erlaubt
  eingehenden Verkehr nur von Pods mit dem Label `role=dispatcher` auf TCP-Port `8080` und gilt nur für
  eingehenden Verkehr.
stages.0.objectives.1.text: In der Umgebung existiert genau eine NetworkPolicy.
stages.0.objectives.2.text: HTTP von Deployment `dispatcher` an `http://board:8080` liefert `north-62`.
stages.0.objectives.3.text: HTTP von Deployment `visitor` an `http://board:8080` ist blockiert.
hints.0.text: Ein fehlerfreier Service umgeht Pod ingress policy nicht.
hints.1.text: Policies sind additiv; allow-all würde die Isolation durchbrechen.
hints.2.text: |
  Die bereitgestellte Richtlinie erlaubt dispatcher-Pods auf TCP 9090 statt HTTP 8080. Ändern Sie den erlaubten Port auf 8080 und testen Sie zugelassene und abgewiesene Clients.
phrases.0: Ich habe Quelle selectors, Richtung und Ports separat überprüft.
phrases.1: Ich habe einen verweigerten client sowie den erlaubten getestet.
phrases.2: Ich habe während der Wiederherstellung auf den Zusatzstoff allow-all policies verzichtet.
questions.0.points.0: Ihr erlaubter Verkehr wird zusammengefasst.
questions.0.points.1: Allow-all kann eine beabsichtigte Isolierung rückgängig machen.
questions.0.points.2: Überprüfen Sie ingress und egress unabhängig voneinander.
questions.0.prompt: Was passiert, wenn zwei policies dasselbe Pod auswählen?
questions.1.points.0: Die Verfügbarkeit beweist nicht die Zugriffsgrenze.
questions.1.points.1: Selectors kann zusätzliche Pods enthalten.
questions.1.points.2: Der CNI muss policy im realen Datenverkehr erzwingen.
questions.1.prompt: Warum einen abgelehnten client testen, nachdem ein Servicepfad geöffnet wurde?
