title: NetworkPolicy
brief: |-
  Das geschützte Board ist für den erlaubten Anfragenden nicht erreichbar. Stelle engen Zugriff unter Erhalt der Gastisolation wieder her.

  Arbeite auf der Workstation in `~/quest` mit den bereitgestellten Dateien:
  - `isolation-contract.json`.

  **Anforderungen:**

  - Die vorhandene NetworkPolicy behält ihren geschützten Workload und den erlaubten Aufruferkreis bei und erlaubt nur eingehenden HTTP-Verkehr für diesen Dienst. Erhalte die Identitäten der ursprünglichen Policy und Deployments sowie bereitgestellte Images. Die gewünschte Pod-Vorlage des erlaubten Aufrufers und jeder aktuelle bereite Pod müssen zum erhaltenen Aufruferbereich der Policy gemäß `isolation-contract.json` gehören.
  - In der Umgebung existiert genau eine NetworkPolicy.
  - HTTP von Deployment `dispatcher` an `http://board:8080` liefert `north-62`.
  - HTTP von Deployment `visitor` an `http://board:8080` ist blockiert.

  Prüfungen beobachten aktuellen Sollzustand, Pod-Eigentümerschaft und Verkehr, nicht den Label-Änderungsverlauf. Erhalte die ursprüngliche reine Ingress-Grenze und ändere nur diese Bay.
debrief: Die Prüfungen verglichen ursprüngliche enge Policy, erhaltene Workload-Identitäten, gewünschte und aktuelle
  Aufruferzugehörigkeit sowie realen erlaubten und abgewiesenen Verkehr.
stages.0.brief: Erhalten Sie die reine Eingangs-Isolationsgrenze der Richtlinie.
stages.0.objectives.0.text: Die vorhandene NetworkPolicy behält ihren geschützten Workload und den erlaubten Aufruferkreis
  bei und erlaubt nur eingehenden HTTP-Verkehr für diesen Dienst. Erhalte die Identitäten der ursprünglichen Policy
  und Deployments sowie bereitgestellte Images. Die gewünschte Pod-Vorlage des erlaubten Aufrufers und jeder aktuelle
  bereite Pod müssen zum erhaltenen Aufruferbereich der Policy gemäß `isolation-contract.json` gehören.
stages.0.objectives.1.text: In der Umgebung existiert genau eine NetworkPolicy.
stages.0.objectives.2.text: HTTP von Deployment `dispatcher` an `http://board:8080` liefert `north-62`.
stages.0.objectives.3.text: HTTP von Deployment `visitor` an `http://board:8080` ist blockiert.
hints.0.text: Eine Policy wählt Ziel-Pods aus und erlaubt Quellen über einen getrennten Selektor. Labels eines aktuellen
  Pods und einer Deployment-Vorlage haben unterschiedliche Lebensdauern; eine breitere Grenze verdeckt die Abhängigkeit
  statt sie zu beheben.
hints.1.text: |-
  Vergleiche vollständigen Policy-Bereich, gewünschte Aufrufervorlage und aktuell zugehörige Pods. Diese Objekte bestehen bereits:

  ```sh
  cat isolation-contract.json
  kubectl get networkpolicy -o yaml
  kubectl get deployments -o yaml
  kubectl get pods --show-labels
  ```
hints.2.text: |-
  Prüfe Policy-Anzahl und Identitäten, gewünschte und aktuelle Aufruferzugehörigkeit, erlaubte Antwort und abgewiesene Gastanfrage:

  ```sh
  kubectl get networkpolicy -o name
  kubectl get deployment dispatcher -o yaml
  kubectl get pods -l app=dispatcher --show-labels
  kubectl rollout status deployment/dispatcher --timeout=90s
  kubectl exec deployment/dispatcher -- wget -qO- -T 3 http://board:8080
  if kubectl exec deployment/visitor -- wget -qO- -T 3 http://board:8080; then
   printf '%s\n' 'unexpected guest access'
  else
   printf '%s\n' 'guest denied'
  fi
  ```
phrases.0: Ich habe Quelle selectors, Richtung und Ports separat überprüft.
phrases.1: Ich habe einen verweigerten client sowie den erlaubten getestet.
phrases.2: Ich habe während der Wiederherstellung auf den Zusatzstoff allow-all policies verzichtet.
questions.0.points.0: Ihr erlaubter Verkehr wird zusammengefasst.
questions.0.points.1: Allow-all kann eine beabsichtigte Isolierung rückgängig machen.
questions.0.points.2: Überprüfen Sie ingress und egress unabhängig voneinander.
questions.0.prompt: Was passiert, wenn zwei policies dasselbe Pod auswählen?
questions.1.points.0: Die Verfügbarkeit beweist nicht die Zugriffsgrenze.
questions.1.points.1: Selectors kann zusätzliche Pods enthalten.
questions.1.points.2: Der CNI muss policy im realen Datenverkehr erzwingen.
questions.1.prompt: Warum einen abgelehnten client testen, nachdem ein Servicepfad geöffnet wurde?
diagnostics.probe_0_0: Enger Ingress-Bereich oder gewünschte/aktuelle Aufruferzugehörigkeit konnte nicht geprüft
  werden.
diagnostics.isolation_identity: Die ursprüngliche Ingress-Policy, eine bereitgestellte Workload-Identität oder ein
  Anwendungsimage wurde geändert.
diagnostics.isolation_template: Die gewünschte Aufrufer-Pod-Vorlage passt nicht zum erhaltenen Selektor erlaubter
  Quellen.
diagnostics.isolation_current: Aktuelle zugehörige Aufrufer-Pods fehlen, sind nicht bereit oder liegen außerhalb
  des erhaltenen Quellenbereichs.
