stages.0.objectives.3.text: Внутри Pod Deployment `board` адрес `http://127.0.0.1:8080` возвращает `north-43`.
diagnostics.application_source: 'Источник или назначение Application не соответствуют выданному релизу либо данные недоступны: начальный путь retired не указывает на manifests в main. [Причина и проверка](guides#guide=gitops-delivery&section=argo-source-contract)'
diagnostics.application_sync: 'Не подтверждены Synced и Healthy на коммите удалённого main: согласование могут блокировать путь источника, доступ к репозиторию, неготовые ресурсы или недоступная удалённая ссылка. Загрузка platform.env или запуск Git, kubectl либо jq также могли завершиться ошибкой до чтения состояния. [Причина и проверка](guides#guide=gitops-delivery&section=argo-observed-revision)'
diagnostics.board_rollout: 'Rollout board завершился ошибкой или превысил 3 секунды: Argo мог ещё не применить манифесты либо worker остаётся недоступен. [Причина и проверка](guides#guide=gitops-delivery&section=argo-consumer-health)'
diagnostics.board_http: 'Ответ worker отличается от north-43 либо exec завершился ошибкой: управляемая Git нагрузка может отсутствовать, быть неготовой или выдавать изменённое содержимое. [Причина и проверка](guides#guide=gitops-delivery&section=argo-consumer-health)'
