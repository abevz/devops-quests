title: Синхронизация Argo CD
brief: 'В Gitea исправный манифест board находится в manifests ветки main. Argo CD station указывает на
  retired и не может построить источник. Исправьте путь, сохранив выданные приватный репозиторий, project
  и namespace, затем выполните sync. Работающий board должен отвечать north-43 из Git-ревизии, указанной
  Argo.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `platform.env`, `repository/manifests/board.json`,
  `application.json`, `sync.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: station использует manifests/main, показывает удалённую ревизию Synced/Healthy,
  board отвечает north-43.'
debrief: Argo мог авторизоваться, но не мог построить отсутствующий каталог источника. Исправление пути
  восстановило сверку состояния.
stages.0.brief: 'station использует manifests/main, показывает удалённую ревизию Synced/Healthy, board
  отвечает north-43.


  Результат проверки: station использует manifests/main, показывает удалённую ревизию Synced/Healthy,
