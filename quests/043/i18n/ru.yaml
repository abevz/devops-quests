title: Синхронизация Argo CD
brief: 'Управляемый через Git потребитель `board` недоступен в требуемой ревизии.


  Работайте на рабочей станции в `~/quest` с `platform.env`, `repository/manifests/board.yaml`, `application.yaml`,
  `sync.json`.


  **Требования:**

  - Application `station` развёртывает поставленный Git-релиз в своём существующем проекте и namespace отсека
  в локальном кластере.

  - Application `station` сообщает `Synced` и `Healthy` для удалённого коммита `main`.

  - Deployment `board` завершает rollout в namespace песочницы.

  - Внутри Pod Deployment `board` адрес `http://127.0.0.1:8080` возвращает `north-43`.

  '
debrief: Argo мог авторизоваться, но не мог построить отсутствующий каталог источника. Исправление пути восстановило
  сверку состояния.
stages.0.brief: Требуемая ревизия Git должна быть доступна потребителям.
hints.0.text: Результат доставки из Git зависит и от желаемого содержимого, и от наблюдаемого состояния.
hints.1.text: 'Прочитайте conditions Application до изменения нагрузки.


  Доступ к репозиторию, ревизия и путь — разные точки отказа. Предоставленный Application указывает на retired,
  а манифесты Git находятся в manifests на main.


  Изучите поставленные входные данные и наблюдаемое состояние:


  ```sh

  cat application.yaml repository/manifests/board.yaml

  kubectl describe application station

  ```'
hints.2.text: 'Исправьте source.path, сохранив приватный репозиторий, проект и namespace, затем запросите sync.


  Проверьте наблюдаемый результат:


  - `kubectl get application station -o custom-columns=NAME:.metadata.name,PROJECT:.spec.project,REPO:.spec.source.repoURL,PATH:.spec.source.path,BRANCH:.spec.source.targetRevision,NAMESPACE:.spec.destination.namespace,SERVER:.spec.destination.server,SYNC:.status.sync.status,HEALTH:.status.health.status,REVISION:.status.sync.revision`
  — Показывает проект `station`, предоставленный репозиторий, `main` / `manifests`, namespace песочницы на
  `https://kubernetes.default.svc` и `Synced` / `Healthy`.

  - `git -C repository ls-remote origin refs/heads/main; kubectl get application station -o jsonpath=''{.status.sync.revision}{"\n"}''`
  — Оба наблюдения показывают один ID коммита.

  - `kubectl rollout status deployment/board --timeout=10s; kubectl exec --pod-running-timeout=5s deployment/board
  -- wget -qO- -T 3 http://127.0.0.1:8080` — Rollout завершается; HTTP возвращает `north-43`.'
phrases.0: Я отделил доступ к репозиторию от ошибок пути манифестов.
phrases.1: Я проверил наблюдаемую Git-ревизию вместе с синхронизацией и здоровьем.
phrases.2: Я проверил фактическое HTTP-поведение после сверки источника контроллером.
questions.0.points.0: Изучить conditions и требуемую ревизию.
questions.0.points.1: Проверить авторизацию репозитория и построение манифестов.
questions.0.points.2: Оценить здоровье приложения после синхронизации.
questions.0.prompt: Как отделить ошибку источника от неисправной выкатки в Argo CD?
questions.1.points.0: Контроллер может синхронизировать не ту ветку или ревизию.
questions.1.points.1: Сравнить наблюдаемую ревизию с требуемым удалённым ref.
questions.1.points.2: Отдельно проверить фактическое поведение приложения.
questions.1.prompt: Почему вместе с Synced нужно проверять Git-ревизию?
