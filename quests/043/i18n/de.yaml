title: Argo CD sync
brief: |
  Der über Git verwaltete Verbraucher `board` ist nicht in der erforderlichen Revision verfügbar.

  Arbeite auf der Workstation in `~/quest` mit `platform.env`, `repository/manifests/board.yaml`, `application.yaml`, `sync.json`.

  **Anforderungen:**
  - Application im Bay-Namespace:
    - Name: `station`.
    - Repository: `GIT_URL` aus der Workstation-Datei `~/quest/platform.env`.
    - Branch und Quellverzeichnis: `main`, `manifests`.
    - Projekt: `station`.
    - Ziel-Namespace: `DQ_NAMESPACE`.
    - Zielserver: `https://kubernetes.default.svc`.
  - Beobachtetes Application-Ergebnis:
    - Status: `Synced`, `Healthy`.
    - Die synchronisierte Revision entspricht Remote `main`.
  - Deployment im Bay-Namespace:
    - Name: `board`.
    - Rollout abgeschlossen.
  - HTTP in einem Pod von Deployment `board`:
    - Pfad: `http://127.0.0.1:8080`.
    - Antwort: `north-43`.

  **Selbstprüfung vor Check & finish:**
  - `kubectl get application station -o custom-columns=NAME:.metadata.name,PROJECT:.spec.project,REPO:.spec.source.repoURL,PATH:.spec.source.path,BRANCH:.spec.source.targetRevision,NAMESPACE:.spec.destination.namespace,SERVER:.spec.destination.server,SYNC:.status.sync.status,HEALTH:.status.health.status,REVISION:.status.sync.revision` — Zeigt Projekt `station`, das bereitgestellte Repository, `main` / `manifests`, den Bay-Namespace auf `https://kubernetes.default.svc` und `Synced` / `Healthy`.
  - `git -C repository ls-remote origin refs/heads/main; kubectl get application station -o jsonpath='{.status.sync.revision}{"\n"}'` — Beide Beobachtungen zeigen dieselbe Commit-ID.
  - `kubectl rollout status deployment/board --timeout=10s; kubectl exec --pod-running-timeout=5s deployment/board -- wget -qO- -T 3 http://127.0.0.1:8080` — Der Rollout wird abgeschlossen; HTTP liefert `north-43`.
debrief: Argo konnte sich authentifizieren, konnte aber ein fehlendes Quellverzeichnis nicht rendern. Die Quellenkorrektur
  stellte die Versöhnung wieder her.
stages.0.brief: Die erforderliche Git-Revision muss den Verbrauchern zur Verfügung stehen.
hints.0.text: Lesen Sie Application conditions, bevor Sie die Arbeitslast bearbeiten.
hints.1.text: Repository-Zugriff, Revision und Pfad sind unterschiedliche Fehlerstellen. Die bereitgestellte Application
  zeigt auf retired, während die Git-Manifeste unter manifests auf main liegen.
hints.2.text: Repariere source.path unter Erhalt von privatem Repository, Projekt und Namespace und fordere dann
  Sync an.
phrases.0: Ich habe den Repository-Zugriff von Manifest-Quellpfadfehlern getrennt.
phrases.1: Ich habe die beobachtete Git-Revision sowie die Synchronisierung und den Zustand überprüft.
phrases.2: Ich habe das tatsächliche Verhalten von HTTP überprüft, nachdem der Controller die Quelle abgeglichen
  hat.
questions.0.points.0: Überprüfen Sie conditions und die gewünschte Revision.
questions.0.points.1: Überprüfen Sie die Repository-Authentifizierung und das Manifest-Rendering.
questions.0.points.2: Bewerten Sie den Anwendungszustand nach der Synchronisierung.
questions.0.prompt: Wie können Sie einen Quellfehler von einem fehlerhaften Rollout in Argo CD unterscheiden?
questions.1.points.0: Der Controller kann einen unbeabsichtigten Zweig oder eine unbeabsichtigte Revision synchronisieren.
questions.1.points.1: Vergleichen Sie die beobachtete Revision mit der vorgesehenen Remote-Version ref.
questions.1.points.2: Überprüfen Sie das tatsächliche Anwendungsverhalten separat.
questions.1.prompt: Warum eine Git-Revision sowie Synced überprüfen?
stages.0.objectives.0.text: Application `station` verfolgt `main` / `manifests` im privaten Repository aus der Workstation-Datei
  `platform.env` (`GIT_URL`). Sein Projekt ist `station`; sein Ziel ist `DQ_NAMESPACE` auf `https://kubernetes.default.svc`.
stages.0.objectives.1.text: Application `station` meldet `Synced` und `Healthy` für den Remote-Commit von `main`.
stages.0.objectives.2.text: Deployment `board` schließt seinen Rollout im Bay-Namespace ab.
stages.0.objectives.3.text: In einem Pod von Deployment `board` liefert `http://127.0.0.1:8080` den Wert `north-43`.
