title: Argo CD sync
brief: 'Der über Git verwaltete Verbraucher `board` ist nicht in der erforderlichen Revision verfügbar.


  Arbeiten Sie auf der Workstation in `~/quest` mit `platform.env`, `repository/manifests/board.yaml`, `application.yaml`,
  `sync.json`.


  **Anforderungen:**

  - Application `station` stellt die mitgelieferte Git-Version in ihrem bestehenden Projekt und Bay-Namespace
  im lokalen Cluster bereit.

  - Application `station` meldet `Synced` und `Healthy` für den Remote-Commit von `main`.

  - Deployment `board` schließt seinen Rollout im Bay-Namespace ab.

  - In einem Pod von Deployment `board` liefert `http://127.0.0.1:8080` den Wert `north-43`.

  '
debrief: Argo konnte sich authentifizieren, konnte aber ein fehlendes Quellverzeichnis nicht rendern. Die Quellenkorrektur
  stellte die Versöhnung wieder her.
stages.0.brief: Die erforderliche Git-Revision muss den Verbrauchern zur Verfügung stehen.
hints.0.text: Ein Git-Auslieferungsergebnis hängt sowohl vom Sollinhalt als auch vom beobachteten Zustand ab.
hints.1.text: 'Lesen Sie Application conditions, bevor Sie die Arbeitslast bearbeiten.


  Repository-Zugriff, Revision und Pfad sind unterschiedliche Fehlerstellen. Die bereitgestellte Application
  zeigt auf retired, während die Git-Manifeste unter manifests auf main liegen.


  Prüfen Sie die mitgelieferten Eingaben und den beobachteten Zustand:


  ```sh

  cat application.yaml repository/manifests/board.yaml

  kubectl describe application station

  ```'
hints.2.text: 'Repariere source.path unter Erhalt von privatem Repository, Projekt und Namespace und fordere
  dann Sync an.


  Prüfen Sie das beobachtete Ergebnis:


  - `kubectl get application station -o custom-columns=NAME:.metadata.name,PROJECT:.spec.project,REPO:.spec.source.repoURL,PATH:.spec.source.path,BRANCH:.spec.source.targetRevision,NAMESPACE:.spec.destination.namespace,SERVER:.spec.destination.server,SYNC:.status.sync.status,HEALTH:.status.health.status,REVISION:.status.sync.revision`
  — Zeigt Projekt `station`, das bereitgestellte Repository, `main` / `manifests`, den Bay-Namespace auf `https://kubernetes.default.svc`
  und `Synced` / `Healthy`.

  - `git -C repository ls-remote origin refs/heads/main; kubectl get application station -o jsonpath=''{.status.sync.revision}{"\n"}''`
  — Beide Beobachtungen zeigen dieselbe Commit-ID.

  - `kubectl rollout status deployment/board --timeout=10s; kubectl exec --pod-running-timeout=5s deployment/board
  -- wget -qO- -T 3 http://127.0.0.1:8080` — Der Rollout wird abgeschlossen; HTTP liefert `north-43`.'
phrases.0: Ich habe den Repository-Zugriff von Manifest-Quellpfadfehlern getrennt.
phrases.1: Ich habe die beobachtete Git-Revision sowie die Synchronisierung und den Zustand überprüft.
phrases.2: Ich habe das tatsächliche Verhalten von HTTP überprüft, nachdem der Controller die Quelle abgeglichen
  hat.
questions.0.points.0: Überprüfen Sie conditions und die gewünschte Revision.
questions.0.points.1: Überprüfen Sie die Repository-Authentifizierung und das Manifest-Rendering.
questions.0.points.2: Bewerten Sie den Anwendungszustand nach der Synchronisierung.
questions.0.prompt: Wie können Sie einen Quellfehler von einem fehlerhaften Rollout in Argo CD unterscheiden?
questions.1.points.0: Der Controller kann einen unbeabsichtigten Zweig oder eine unbeabsichtigte Revision synchronisieren.
questions.1.points.1: Vergleichen Sie die beobachtete Revision mit der vorgesehenen Remote-Version ref.
questions.1.points.2: Überprüfen Sie das tatsächliche Anwendungsverhalten separat.
questions.1.prompt: Warum eine Git-Revision sowie Synced überprüfen?
