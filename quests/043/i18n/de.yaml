title: Argo CD sync
brief: 'Gitea enthält ein gültiges board-Manifest unter manifests auf main. Argo CD station zeigt auf
  retired, sodass die Quelle nicht gerendert werden kann. Reparieren Sie den Quellpfad und behalten Sie
  dabei das bereitgestellte private Repository project und namespace und dann sync bei. Ein Live-board
  muss north-43 aus der von Argo gemeldeten Git-Revision bedienen.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `platform.env`, `repository/manifests/board.json`,
  `application.json`, `sync.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: station zielt auf manifests/main ab, meldet die Remote-Revision Synced/Healthy
  und board bedient north-43.'
debrief: Argo konnte sich authentifizieren, konnte aber ein fehlendes Quellverzeichnis nicht rendern.
  Die Quellenkorrektur stellte die Versöhnung wieder her.
stages.0.brief: 'Erfolgskriterien: station zielt auf manifests/main ab, meldet die Remote-Revision Synced/Healthy
  und board bedient north-43.'
stages.0.objectives.0.text: station zielt auf manifests/main ab, meldet die Remote-Revision Synced/Healthy
  und board bedient north-43.
hints.0.text: Lesen Sie Application conditions, bevor Sie die Arbeitslast bearbeiten.
hints.1.text: Repository-Zugriff, Revision und Pfad sind verschiedene Fehlerquellen.
hints.2.text: Reparieren Sie source.path, fordern Sie sync an und überprüfen Sie sowohl die Revision als
  auch die HTTP-Antwort.
phrases.0: Ich habe den Repository-Zugriff von Manifest-Quellpfadfehlern getrennt.
phrases.1: Ich habe die beobachtete Git-Revision sowie die Synchronisierung und den Zustand überprüft.
phrases.2: Ich habe das tatsächliche Verhalten von HTTP überprüft, nachdem der Controller die Quelle abgeglichen
  hat.
questions.0.points.0: Überprüfen Sie conditions und die gewünschte Revision.
questions.0.points.1: Überprüfen Sie die Repository-Authentifizierung und das Manifest-Rendering.
questions.0.points.2: Bewerten Sie den Anwendungszustand nach der Synchronisierung.
questions.0.prompt: Wie können Sie einen Quellfehler von einem fehlerhaften Rollout in Argo CD unterscheiden?
questions.1.points.0: Der Controller kann einen unbeabsichtigten Zweig oder eine unbeabsichtigte Revision
  synchronisieren.
questions.1.points.1: Vergleichen Sie die beobachtete Revision mit der vorgesehenen Remote-Version ref.
questions.1.points.2: Überprüfen Sie das tatsächliche Anwendungsverhalten separat.
questions.1.prompt: Warum eine Git-Revision sowie Synced überprüfen?
