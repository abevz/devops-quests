title: Sincronización Argo CD
brief: 'Gitea contiene un manifiesto board válido en manifests en main. Argo CD station apunta a retired,
  por lo que no puede representar la fuente. Repare la ruta de origen conservando el repositorio privado
  proporcionado, project y namespace, luego sync. Un board activo debe servir north-43 desde la revisión
  de Git informada por Argo.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `platform.env`, `repository/manifests/board.json`,
  `application.json`, `sync.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: station apunta a manifests/main, informa la revisión remota Synced/Healthy
  y board sirve a north-43.'
debrief: Argo pudo autenticarse pero no pudo representar un directorio de origen faltante. La corrección
  de fuente restauró la conciliación.
stages.0.brief: 'Criterios de éxito: station apunta a manifests/main, informa la revisión remota Synced/Healthy
  y board sirve a north-43.'
stages.0.objectives.0.text: station apunta a manifests/main, informa la revisión remota Synced/Healthy
  y board sirve a north-43.
hints.0.text: Lea Application conditions antes de editar la carga de trabajo.
hints.1.text: El acceso al repositorio, la revisión y la ruta son diferentes puntos de falla.
hints.2.text: Reparar source.path, solicitar sync y verificar tanto la revisión como la respuesta de HTTP.
phrases.0: Separé el acceso al repositorio de los errores manifiestos de ruta de origen.
phrases.1: Verifiqué la revisión de Git observada, así como la sincronización y el estado.
phrases.2: Verifiqué el comportamiento real de HTTP después de que el controlador reconciliara la fuente.
questions.0.points.0: Inspeccione conditions y la revisión deseada.
questions.0.points.1: Verifique la autenticación del repositorio y la representación del manifiesto.
questions.0.points.2: Evalúe el estado de la aplicación después de la sincronización.
questions.0.prompt: ¿Cómo separaría un error de origen de una implementación incorrecta en Argo CD?
questions.1.points.0: El controlador puede sincronizar una rama o revisión no deseada.
questions.1.points.1: Compare la revisión observada con el control remoto previsto ref.
questions.1.points.2: Verifique el comportamiento real de la aplicación por separado.
questions.1.prompt: ¿Por qué verificar una revisión de Git y Synced?
