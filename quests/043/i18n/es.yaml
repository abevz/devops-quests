title: Sincronización Argo CD
brief: |
  El consumidor `board` administrado mediante Git no está disponible en la revisión requerida.

  Trabaja en la workstation en `~/quest` con `platform.env`, `repository/manifests/board.yaml`, `application.yaml`, `sync.json`.

  **Requisitos:**
  - Application en el namespace de la bahía:
    - Nombre: `station`.
    - Repositorio: `GIT_URL` de `~/quest/platform.env` en la workstation.
    - Rama y directorio fuente: `main`, `manifests`.
    - Proyecto: `station`.
    - Namespace destino: `DQ_NAMESPACE`.
    - Servidor destino: `https://kubernetes.default.svc`.
  - Resultado observado de la Application:
    - Estado: `Synced`, `Healthy`.
    - La revisión sincronizada coincide con el `main` remoto.
  - Deployment en el namespace de la bahía:
    - Nombre: `board`.
    - Rollout completo.
  - HTTP dentro de un Pod del Deployment `board`:
    - Ruta: `http://127.0.0.1:8080`.
    - Respuesta: `north-43`.

  **Verifica antes de Check & finish:**
  - `kubectl get application station -o custom-columns=NAME:.metadata.name,PROJECT:.spec.project,REPO:.spec.source.repoURL,PATH:.spec.source.path,BRANCH:.spec.source.targetRevision,NAMESPACE:.spec.destination.namespace,SERVER:.spec.destination.server,SYNC:.status.sync.status,HEALTH:.status.health.status,REVISION:.status.sync.revision` — Muestra el proyecto `station`, el repositorio suministrado, `main` / `manifests`, el namespace de la bahía en `https://kubernetes.default.svc` y `Synced` / `Healthy`.
  - `git -C repository ls-remote origin refs/heads/main; kubectl get application station -o jsonpath='{.status.sync.revision}{"\n"}'` — Ambas observaciones muestran el mismo ID de commit.
  - `kubectl rollout status deployment/board --timeout=10s; kubectl exec --pod-running-timeout=5s deployment/board -- wget -qO- -T 3 http://127.0.0.1:8080` — El rollout se completa; HTTP devuelve `north-43`.
debrief: Argo pudo autenticarse pero no pudo representar un directorio de origen faltante. La corrección de fuente
  restauró la conciliación.
stages.0.brief: La revisión Git requerida debe estar disponible para los consumidores.
hints.0.text: Lea Application conditions antes de editar la carga de trabajo.
hints.1.text: El acceso al repositorio, la revisión y la ruta son puntos de fallo distintos. La Application suministrada
  apunta a retired mientras los manifiestos Git están en manifests de main.
hints.2.text: Repara source.path conservando el repositorio privado, el proyecto y el namespace, y solicita sync.
phrases.0: Separé el acceso al repositorio de los errores manifiestos de ruta de origen.
phrases.1: Verifiqué la revisión de Git observada, así como la sincronización y el estado.
phrases.2: Verifiqué el comportamiento real de HTTP después de que el controlador reconciliara la fuente.
questions.0.points.0: Inspeccione conditions y la revisión deseada.
questions.0.points.1: Verifique la autenticación del repositorio y la representación del manifiesto.
questions.0.points.2: Evalúe el estado de la aplicación después de la sincronización.
questions.0.prompt: ¿Cómo separaría un error de origen de una implementación incorrecta en Argo CD?
questions.1.points.0: El controlador puede sincronizar una rama o revisión no deseada.
questions.1.points.1: Compare la revisión observada con el control remoto previsto ref.
questions.1.points.2: Verifique el comportamiento real de la aplicación por separado.
questions.1.prompt: ¿Por qué verificar una revisión de Git y Synced?
stages.0.objectives.0.text: La Application `station` sigue `main` / `manifests` en el repositorio privado indicado
  por `platform.env` en la workstation (`GIT_URL`). Su proyecto es `station`; su destino es `DQ_NAMESPACE` en `https://kubernetes.default.svc`.
stages.0.objectives.1.text: La Application `station` informa `Synced` y `Healthy` en el commit remoto de `main`.
stages.0.objectives.2.text: El Deployment `board` completa su rollout en el namespace de la bahía.
stages.0.objectives.3.text: Dentro de un Pod del Deployment `board`, `http://127.0.0.1:8080` devuelve `north-43`.
