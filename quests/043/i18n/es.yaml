title: Sincronización Argo CD
brief: 'El consumidor `board` administrado mediante Git no está disponible en la revisión requerida.


  Trabaja en la estación de trabajo en `~/quest` con `platform.env`, `repository/manifests/board.yaml`, `application.yaml`,
  `sync.json`.


  **Requisitos:**

  - La Application `station` despliega la versión Git suministrada en su proyecto existente y en el namespace
  de la bahía del clúster local.

  - La Application `station` informa `Synced` y `Healthy` en el commit remoto de `main`.

  - El Deployment `board` completa su rollout en el namespace de la bahía.

  - Dentro de un Pod del Deployment `board`, `http://127.0.0.1:8080` devuelve `north-43`.

  '
debrief: Argo pudo autenticarse pero no pudo representar un directorio de origen faltante. La corrección de
  fuente restauró la conciliación.
stages.0.brief: La revisión Git requerida debe estar disponible para los consumidores.
hints.0.text: La entrega desde Git depende tanto del contenido deseado como del estado observado.
hints.1.text: 'Lea Application conditions antes de editar la carga de trabajo.


  El acceso al repositorio, la revisión y la ruta son puntos de fallo distintos. La Application suministrada
  apunta a retired mientras los manifiestos Git están en manifests de main.


  Inspecciona las entradas suministradas y el estado observado:


  ```sh

  cat application.yaml repository/manifests/board.yaml

  kubectl describe application station

  ```'
hints.2.text: 'Repara source.path conservando el repositorio privado, el proyecto y el namespace, y solicita
  sync.


  Verifica el resultado observado:


  - `kubectl get application station -o custom-columns=NAME:.metadata.name,PROJECT:.spec.project,REPO:.spec.source.repoURL,PATH:.spec.source.path,BRANCH:.spec.source.targetRevision,NAMESPACE:.spec.destination.namespace,SERVER:.spec.destination.server,SYNC:.status.sync.status,HEALTH:.status.health.status,REVISION:.status.sync.revision`
  — Muestra el proyecto `station`, el repositorio suministrado, `main` / `manifests`, el namespace de la bahía
  en `https://kubernetes.default.svc` y `Synced` / `Healthy`.

  - `git -C repository ls-remote origin refs/heads/main; kubectl get application station -o jsonpath=''{.status.sync.revision}{"\n"}''`
  — Ambas observaciones muestran el mismo ID de commit.

  - `kubectl rollout status deployment/board --timeout=10s; kubectl exec --pod-running-timeout=5s deployment/board
  -- wget -qO- -T 3 http://127.0.0.1:8080` — El rollout se completa; HTTP devuelve `north-43`.'
phrases.0: Separé el acceso al repositorio de los errores manifiestos de ruta de origen.
phrases.1: Verifiqué la revisión de Git observada, así como la sincronización y el estado.
phrases.2: Verifiqué el comportamiento real de HTTP después de que el controlador reconciliara la fuente.
questions.0.points.0: Inspeccione conditions y la revisión deseada.
questions.0.points.1: Verifique la autenticación del repositorio y la representación del manifiesto.
questions.0.points.2: Evalúe el estado de la aplicación después de la sincronización.
questions.0.prompt: ¿Cómo separaría un error de origen de una implementación incorrecta en Argo CD?
questions.1.points.0: El controlador puede sincronizar una rama o revisión no deseada.
questions.1.points.1: Compare la revisión observada con el control remoto previsto ref.
questions.1.points.2: Verifique el comportamiento real de la aplicación por separado.
questions.1.prompt: ¿Por qué verificar una revisión de Git y Synced?
stages.0.objectives.0.text: La Application `station` despliega la versión Git suministrada en su proyecto existente
  y en el namespace de la bahía del clúster local.
stages.0.objectives.1.text: La Application `station` informa `Synced` y `Healthy` en el commit remoto de `main`.
stages.0.objectives.2.text: El Deployment `board` completa su rollout en el namespace de la bahía.
stages.0.objectives.3.text: Dentro de un Pod del Deployment `board`, `http://127.0.0.1:8080` devuelve `north-43`.
