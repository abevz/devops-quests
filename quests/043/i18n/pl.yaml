title: Synchronizacja Argo CD
brief: 'Gitea przechowuje prawidłowy manifest board pod manifests na main. Argo CD station wskazuje na
  retired, więc nie może wyrenderować źródła. Napraw ścieżkę źródłową, zachowując dostarczone prywatne
  repozytorium, project i namespace, a następnie sync. Aktywny board musi obsługiwać north-43 z wersji
  Git zgłoszonej przez Argo.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `platform.env`, `repository/manifests/board.json`,
  `application.json`, `sync.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: station jest ukierunkowany na manifests/main, zgłasza zdalną wersję Synced/Healthy,
  a board obsługuje north-43.'
debrief: Argo mógł uwierzytelnić, ale nie mógł wyrenderować brakującego katalogu źródłowego. Korekta źródła
  przywróciła uzgadnianie.
stages.0.brief: 'Kryteria sukcesu: station wskazuje na manifests/main, zgłasza zdalną rewizję jako Synced/Healthy,
  a board obsługuje north-43.'
stages.0.objectives.0.text: station wskazuje na manifests/main, zgłasza zdalną rewizję jako Synced/Healthy,
  a board obsługuje north-43.
hints.0.text: Odczytaj warunki obiektu Application przed zmianą obciążenia.
hints.1.text: Dostęp do repozytorium, wersja i ścieżka to różne punkty awarii.
hints.2.text: Napraw source.path, poproś o sync i sprawdź wersję i odpowiedź HTTP.
phrases.0: Oddzieliłem dostęp do repozytorium od manifestowanych błędów ścieżki źródłowej.
phrases.1: Sprawdziłem zaobserwowaną wersję Git, a także synchronizację i stan zdrowia.
phrases.2: Zweryfikowałem rzeczywiste zachowanie HTTP po tym, jak kontroler uzgodnił źródło.
questions.0.points.0: Sprawdź conditions i żądaną wersję.
questions.0.points.1: Sprawdź uwierzytelnianie repozytorium i renderowanie manifestu.
questions.0.points.2: Oceń kondycję aplikacji po synchronizacji.
questions.0.prompt: Jak oddzielić błąd źródłowy od nieprawidłowego wdrożenia w Argo CD?
questions.1.points.0: Kontroler może zsynchronizować niezamierzoną gałąź lub wersję.
questions.1.points.1: Porównaj zaobserwowaną rewizję z zamierzoną referencją w zdalnym repozytorium (remote
  ref).
questions.1.points.2: Sprawdź osobno rzeczywiste zachowanie aplikacji.
questions.1.prompt: Po co weryfikować wersję Git, a także Synced?
