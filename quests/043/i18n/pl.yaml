title: Synchronizacja Argo CD
brief: |
  Zarządzany przez Git odbiorca `board` jest niedostępny w wymaganej rewizji.

  Pracuj na workstation w `~/quest` z plikami `platform.env`, `repository/manifests/board.yaml`, `application.yaml`, `sync.json`.

  **Wymagania:**
  - Application w przestrzeni nazw zatoki:
    - Nazwa: `station`.
    - Repozytorium: `GIT_URL` z `~/quest/platform.env` na workstation.
    - Gałąź i katalog źródłowy: `main`, `manifests`.
    - Projekt: `station`.
    - Docelowa przestrzeń nazw: `DQ_NAMESPACE`.
    - Serwer docelowy: `https://kubernetes.default.svc`.
  - Obserwowany wynik Application:
    - Status: `Synced`, `Healthy`.
    - Zsynchronizowana rewizja odpowiada zdalnej `main`.
  - Deployment w przestrzeni nazw zatoki:
    - Nazwa: `board`.
    - Rollout zakończony.
  - HTTP wewnątrz Poda Deployment `board`:
    - Ścieżka: `http://127.0.0.1:8080`.
    - Odpowiedź: `north-43`.

  **Sprawdź przed Check & finish:**
  - `kubectl get application station -o custom-columns=NAME:.metadata.name,PROJECT:.spec.project,REPO:.spec.source.repoURL,PATH:.spec.source.path,BRANCH:.spec.source.targetRevision,NAMESPACE:.spec.destination.namespace,SERVER:.spec.destination.server,SYNC:.status.sync.status,HEALTH:.status.health.status,REVISION:.status.sync.revision` — Pokazuje projekt `station`, dostarczone repozytorium, `main` / `manifests`, przestrzeń nazw zatoki na `https://kubernetes.default.svc` oraz `Synced` / `Healthy`.
  - `git -C repository ls-remote origin refs/heads/main; kubectl get application station -o jsonpath='{.status.sync.revision}{"\n"}'` — Obie obserwacje pokazują ten sam ID commita.
  - `kubectl rollout status deployment/board --timeout=10s; kubectl exec --pod-running-timeout=5s deployment/board -- wget -qO- -T 3 http://127.0.0.1:8080` — Rollout się kończy; HTTP zwraca `north-43`.
debrief: Argo mógł uwierzytelnić, ale nie mógł wyrenderować brakującego katalogu źródłowego. Korekta źródła przywróciła
  uzgadnianie.
stages.0.brief: Wymagana rewizja Git musi być dostępna dla odbiorców.
hints.0.text: Odczytaj warunki obiektu Application przed zmianą obciążenia.
hints.1.text: Dostęp do repozytorium, rewizja i ścieżka to różne punkty awarii. Dostarczona Application wskazuje
  retired, a manifesty Git są w manifests na main.
hints.2.text: Napraw source.path, zachowując prywatne repozytorium, projekt i namespace, a następnie zażądaj sync.
phrases.0: Oddzieliłem dostęp do repozytorium od manifestowanych błędów ścieżki źródłowej.
phrases.1: Sprawdziłem zaobserwowaną wersję Git, a także synchronizację i stan zdrowia.
phrases.2: Zweryfikowałem rzeczywiste zachowanie HTTP po tym, jak kontroler uzgodnił źródło.
questions.0.points.0: Sprawdź conditions i żądaną wersję.
questions.0.points.1: Sprawdź uwierzytelnianie repozytorium i renderowanie manifestu.
questions.0.points.2: Oceń kondycję aplikacji po synchronizacji.
questions.0.prompt: Jak oddzielić błąd źródłowy od nieprawidłowego wdrożenia w Argo CD?
questions.1.points.0: Kontroler może zsynchronizować niezamierzoną gałąź lub wersję.
questions.1.points.1: Porównaj zaobserwowaną rewizję z zamierzoną referencją w zdalnym repozytorium (remote ref).
questions.1.points.2: Sprawdź osobno rzeczywiste zachowanie aplikacji.
questions.1.prompt: Po co weryfikować wersję Git, a także Synced?
stages.0.objectives.0.text: |-
  Application `station` śledzi `main` / `manifests` w prywatnym repozytorium wskazanym przez `platform.env` na workstation (`GIT_URL`).
  Jego projekt to `station`; celem jest `DQ_NAMESPACE` na `https://kubernetes.default.svc`.
stages.0.objectives.1.text: Application `station` zgłasza `Synced` i `Healthy` dla zdalny commit `main`.
stages.0.objectives.2.text: Deployment `board` kończy rollout w przestrzeni nazw zatoki.
stages.0.objectives.3.text: Wewnątrz Poda Deployment `board` adres `http://127.0.0.1:8080` zwraca `north-43`.
