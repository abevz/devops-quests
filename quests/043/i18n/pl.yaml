title: Synchronizacja Argo CD
brief: 'Zarządzany przez Git odbiorca `board` jest niedostępny w wymaganej rewizji.


  Pracuj na stacji roboczej w `~/quest` z `platform.env`, `repository/manifests/board.yaml`, `application.yaml`,
  `sync.json`.


  **Wymagania:**

  - Application `station` wdraża dostarczone wydanie Git w swoim istniejącym projekcie i namespace zatoki w
  lokalnym klastrze.

  - Application `station` zgłasza `Synced` i `Healthy` dla zdalny commit `main`.

  - Deployment `board` kończy rollout w przestrzeni nazw zatoki.

  - Wewnątrz Poda Deployment `board` adres `http://127.0.0.1:8080` zwraca `north-43`.

  '
debrief: Argo mógł uwierzytelnić, ale nie mógł wyrenderować brakującego katalogu źródłowego. Korekta źródła
  przywróciła uzgadnianie.
stages.0.brief: Wymagana rewizja Git musi być dostępna dla odbiorców.
hints.0.text: Wynik dostawy z Git zależy zarówno od zadanej treści, jak i obserwowanego stanu.
hints.1.text: 'Odczytaj warunki obiektu Application przed zmianą obciążenia.


  Dostęp do repozytorium, rewizja i ścieżka to różne punkty awarii. Dostarczona Application wskazuje retired,
  a manifesty Git są w manifests na main.


  Sprawdź dostarczone dane wejściowe i obserwowany stan:


  ```sh

  cat application.yaml repository/manifests/board.yaml

  kubectl describe application station

  ```'
hints.2.text: 'Napraw source.path, zachowując prywatne repozytorium, projekt i namespace, a następnie zażądaj
  sync.


  Sprawdź obserwowany wynik:


  - `kubectl get application station -o custom-columns=NAME:.metadata.name,PROJECT:.spec.project,REPO:.spec.source.repoURL,PATH:.spec.source.path,BRANCH:.spec.source.targetRevision,NAMESPACE:.spec.destination.namespace,SERVER:.spec.destination.server,SYNC:.status.sync.status,HEALTH:.status.health.status,REVISION:.status.sync.revision`
  — Pokazuje projekt `station`, dostarczone repozytorium, `main` / `manifests`, przestrzeń nazw zatoki na `https://kubernetes.default.svc`
  oraz `Synced` / `Healthy`.

  - `git -C repository ls-remote origin refs/heads/main; kubectl get application station -o jsonpath=''{.status.sync.revision}{"\n"}''`
  — Obie obserwacje pokazują ten sam ID commita.

  - `kubectl rollout status deployment/board --timeout=10s; kubectl exec --pod-running-timeout=5s deployment/board
  -- wget -qO- -T 3 http://127.0.0.1:8080` — Rollout się kończy; HTTP zwraca `north-43`.'
phrases.0: Oddzieliłem dostęp do repozytorium od manifestowanych błędów ścieżki źródłowej.
phrases.1: Sprawdziłem zaobserwowaną wersję Git, a także synchronizację i stan zdrowia.
phrases.2: Zweryfikowałem rzeczywiste zachowanie HTTP po tym, jak kontroler uzgodnił źródło.
questions.0.points.0: Sprawdź conditions i żądaną wersję.
questions.0.points.1: Sprawdź uwierzytelnianie repozytorium i renderowanie manifestu.
questions.0.points.2: Oceń kondycję aplikacji po synchronizacji.
questions.0.prompt: Jak oddzielić błąd źródłowy od nieprawidłowego wdrożenia w Argo CD?
questions.1.points.0: Kontroler może zsynchronizować niezamierzoną gałąź lub wersję.
questions.1.points.1: Porównaj zaobserwowaną rewizję z zamierzoną referencją w zdalnym repozytorium (remote
  ref).
questions.1.points.2: Sprawdź osobno rzeczywiste zachowanie aplikacji.
questions.1.prompt: Po co weryfikować wersję Git, a także Synced?
stages.0.objectives.0.text: Application `station` wdraża dostarczone wydanie Git w swoim istniejącym projekcie
  i namespace zatoki w lokalnym klastrze.
stages.0.objectives.1.text: Application `station` zgłasza `Synced` i `Healthy` dla zdalny commit `main`.
stages.0.objectives.2.text: Deployment `board` kończy rollout w przestrzeni nazw zatoki.
stages.0.objectives.3.text: Wewnątrz Poda Deployment `board` adres `http://127.0.0.1:8080` zwraca `north-43`.
