title: Argo CD sync
brief: 'Gitea holds a valid board manifest under manifests on main. Argo CD station
  points to retired, so it cannot render the source. Repair the source path while
  retaining the supplied private repository, project and namespace, then sync. A live
  board must serve north-43 from the Git revision reported by Argo.


  Quest files in `~/quest` (some appear in later stages): `platform.env`, `repository/manifests/board.json`,
  `application.json`, `sync.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images
  and private services. Change only this bay.


  Initial success criteria: station targets manifests/main, reports the remote revision
  Synced/Healthy, and board serves north-43.'
debrief: Argo could authenticate but could not render a missing source directory.
  Source correction restored reconciliation.
