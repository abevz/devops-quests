title: Argo CD sync
brief: 'The Git-managed `board` consumer is not available at the required revision.


  Work on the workstation in `~/quest` with `platform.env`, `repository/manifests/board.yaml`, `application.yaml`,
  `sync.json`.


  **Requirements:**

  - Application `station` deploys the supplied Git release into its existing project and bay namespace on the
  local cluster.

  - Application `station` reports `Synced` and `Healthy` at the remote `main` commit.

  - Deployment `board` completes its rollout in the bay namespace.

  - Inside a Pod of Deployment `board`, `http://127.0.0.1:8080` returns `north-43`.

  '
debrief: Argo could authenticate but could not render a missing source directory. Source correction restored
  reconciliation.
stages.0.brief: The required Git revision must be available to consumers.
hints.0.text: A Git delivery result depends on both desired content and observed health.
hints.1.text: 'Read Application conditions before editing the workload.


  Repository access, revision and path are different failure points. The supplied Application points to retired
  while Git manifests are under manifests on main.


  Inspect the supplied inputs and observed state:


  ```sh

  cat application.yaml repository/manifests/board.yaml

  kubectl describe application station

  ```'
hints.2.text: 'Repair source.path while retaining the private repository, project and namespace, then request
  sync.


  Verify the observed result:


  - `kubectl get application station -o custom-columns=NAME:.metadata.name,PROJECT:.spec.project,REPO:.spec.source.repoURL,PATH:.spec.source.path,BRANCH:.spec.source.targetRevision,NAMESPACE:.spec.destination.namespace,SERVER:.spec.destination.server,SYNC:.status.sync.status,HEALTH:.status.health.status,REVISION:.status.sync.revision`
  — Shows project `station`, the supplied repository, `main` / `manifests`, the bay namespace on `https://kubernetes.default.svc`,
  and `Synced` / `Healthy`.

  - `git -C repository ls-remote origin refs/heads/main; kubectl get application station -o jsonpath=''{.status.sync.revision}{"\n"}''`
  — Both observations show the same commit ID.

  - `kubectl rollout status deployment/board --timeout=10s; kubectl exec --pod-running-timeout=5s deployment/board
  -- wget -qO- -T 3 http://127.0.0.1:8080` — Rollout completes; HTTP returns `north-43`.'
phrases.0: I separated repository access from manifest source-path errors.
phrases.1: I checked the observed Git revision as well as synchronization and health.
phrases.2: I verified actual HTTP behavior after the controller reconciled the source.
questions.0.points.0: Inspect conditions and desired revision.
questions.0.points.1: Check repository authentication and manifest rendering.
questions.0.points.2: Assess application health after synchronization.
questions.0.prompt: How would you separate a source error from an unhealthy rollout in Argo CD?
questions.1.points.0: The controller can sync an unintended branch or revision.
questions.1.points.1: Compare observed revision with the intended remote ref.
questions.1.points.2: Verify real application behavior separately.
questions.1.prompt: Why verify a Git revision as well as Synced?
stages.0.objectives.0.text: Application `station` deploys the supplied Git release into its existing project
  and bay namespace on the local cluster.
stages.0.objectives.1.text: Application `station` reports `Synced` and `Healthy` at the remote `main` commit.
stages.0.objectives.2.text: Deployment `board` completes its rollout in the bay namespace.
stages.0.objectives.3.text: Inside a Pod of Deployment `board`, `http://127.0.0.1:8080` returns `north-43`.
