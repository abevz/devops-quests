title: Argo CD sync
brief: |
  The Git-managed `board` consumer is not available at the required revision.

  Work on the workstation in `~/quest` with `platform.env`, `repository/manifests/board.yaml`, `application.yaml`, `sync.json`.

  **Requirements:**
  - Application in the bay namespace:
    - Name: `station`.
    - Repository: `GIT_URL` from workstation `~/quest/platform.env`.
    - Branch and source directory: `main`, `manifests`.
    - Project: `station`.
    - Destination namespace: `DQ_NAMESPACE`.
    - Destination server: `https://kubernetes.default.svc`.
  - Observed Application result:
    - Status: `Synced`, `Healthy`.
    - The synchronized revision equals remote `main`.
  - Deployment in the bay namespace:
    - Name: `board`.
    - Rollout complete.
  - HTTP inside a Pod of Deployment `board`:
    - Path: `http://127.0.0.1:8080`.
    - Response: `north-43`.

  **Verify yourself before Check & finish:**
  - `kubectl get application station -o custom-columns=NAME:.metadata.name,PROJECT:.spec.project,REPO:.spec.source.repoURL,PATH:.spec.source.path,BRANCH:.spec.source.targetRevision,NAMESPACE:.spec.destination.namespace,SERVER:.spec.destination.server,SYNC:.status.sync.status,HEALTH:.status.health.status,REVISION:.status.sync.revision` — Shows project `station`, the supplied repository, `main` / `manifests`, the bay namespace on `https://kubernetes.default.svc`, and `Synced` / `Healthy`.
  - `git -C repository ls-remote origin refs/heads/main; kubectl get application station -o jsonpath='{.status.sync.revision}{"\n"}'` — Both observations show the same commit ID.
  - `kubectl rollout status deployment/board --timeout=10s; kubectl exec --pod-running-timeout=5s deployment/board -- wget -qO- -T 3 http://127.0.0.1:8080` — Rollout completes; HTTP returns `north-43`.
debrief: Argo could authenticate but could not render a missing source directory. Source correction restored reconciliation.
stages.0.brief: The required Git revision must be available to consumers.
hints.0.text: Read Application conditions before editing the workload.
hints.1.text: Repository access, revision and path are different failure points. The supplied Application points
  to retired while Git manifests are under manifests on main.
hints.2.text: Repair source.path while retaining the private repository, project and namespace, then request sync.
phrases.0: I separated repository access from manifest source-path errors.
phrases.1: I checked the observed Git revision as well as synchronization and health.
phrases.2: I verified actual HTTP behavior after the controller reconciled the source.
questions.0.points.0: Inspect conditions and desired revision.
questions.0.points.1: Check repository authentication and manifest rendering.
questions.0.points.2: Assess application health after synchronization.
questions.0.prompt: How would you separate a source error from an unhealthy rollout in Argo CD?
questions.1.points.0: The controller can sync an unintended branch or revision.
questions.1.points.1: Compare observed revision with the intended remote ref.
questions.1.points.2: Verify real application behavior separately.
questions.1.prompt: Why verify a Git revision as well as Synced?
stages.0.objectives.0.text: Application `station` tracks `main` / `manifests` in the private repository identified
  by workstation `platform.env` (`GIT_URL`). Its project is `station`; its destination is `DQ_NAMESPACE` on `https://kubernetes.default.svc`.
stages.0.objectives.1.text: Application `station` reports `Synced` and `Healthy` at the remote `main` commit.
stages.0.objectives.2.text: Deployment `board` completes its rollout in the bay namespace.
stages.0.objectives.3.text: Inside a Pod of Deployment `board`, `http://127.0.0.1:8080` returns `north-43`.
