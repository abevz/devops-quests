title: State i dostępność
brief: |-
  Relay działa na nieaktualnym wydaniu. Po uruchomieniu procesu z zatwierdzoną rewizją relay ma obsługiwać ruch.

  Pracuj na stacji roboczej w `~/quest`. Na etapie 1 sprawdź `main.tf` oraz `approved-release.txt`. Na etapie 2 użyj wygenerowanego `release.txt` i dostarczonego `deployment.yaml`.

  **Requirements:**

  - OpenTofu zapisuje zarządzany artefakt wydania w stanie.
  - Na stacji roboczej `release.txt` zawiera `release-30`, rewizję z `approved-release.txt`.
  - Plan OpenTofu kończy się z kodem `0` i bez zmian.
  - Deployment `relay` kończy rollout. W kontenerze worker `RELEASE` ma wartość `release-30`, a Service pod `http://relay:8080/` zwraca `signalrail`.
stages.0.brief: Lokalne wydanie musi być zarządzane w sposób spójny.
stages.1.brief: Działający konsument musi odzwierciedlać to samo wydanie.
hints.0.text: |-
  Zanim przejdziesz do konsumenta, porównaj zatwierdzone wydanie z wartością, którą zapisze OpenTofu.
hints.1.text: |-
  Etap 1: porównaj planowaną zawartość pliku z zatwierdzoną rewizją. Etap 2: sprawdź osobno Deployment, Service i wyznaczone backendy.

  ```sh
  cat approved-release.txt
  tofu plan -input=false -no-color
  ```

  ```sh
  kubectl get deployment relay -o yaml
  kubectl describe service relay
  kubectl get endpointslice -l kubernetes.io/service-name=relay -o yaml
  ```
hints.2.text: |-
  Etap 1: stan obejmuje zarządzany plik `release.txt`. Jego zawartość odpowiada `approved-release.txt`, a plan zwraca kod `0`. Etap 2: rollout dobiega końca, worker wypisuje `release-30`, a Service zwraca `signalrail`.

  ```sh
  tofu show -json | jq -r '.. | objects | select(.type? == "local_file" and .mode? == "managed") | .values.filename'
  cat release.txt
  tofu plan -input=false -detailed-exitcode -no-color
  ```

  ```sh
  kubectl rollout status deployment/relay --timeout=3s
  kubectl exec deployment/relay -c worker -- printenv RELEASE
  kubectl exec deployment/relay -c worker -- wget -qO- -T 3 http://relay:8080/
  ```
debrief: |-
  Plan i stan opisują zarządzaną zawartość. Rollout pokazuje dostępność procesu. Routing Service decyduje, czy klienci mogą dotrzeć do procesu.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
stages.0.objectives.0.text: OpenTofu rejestruje zarządzany artefakt wydania w state.
stages.0.objectives.1.text: |-
  Na stacji roboczej `release.txt` zawiera `release-30`, rewizję z `approved-release.txt`.
stages.0.objectives.2.text: Plan OpenTofu kończy się kodem `0` bez zmian.
stages.1.objectives.0.text: |-
  Deployment `relay` kończy rollout. W kontenerze worker `RELEASE` ma wartość `release-30`, a Service pod `http://relay:8080/` zwraca `signalrail`.
diagnostics.state: Zarządzany plik wydania może nie istnieć lub nie być zastosowany, albo stan może być nieczytelny. [Przyczyna i kontrola](guides#guide=terraform-3&section=relay-release-state)
diagnostics.probe_0_0: Sonda stanu mogła zakończyć się przed diagnostyką, gdy stacja robocza nie mogła wejść do ~/quest lub uruchomić Pythona. [Przyczyna i kontrola](guides#guide=terraform-3&section=relay-release-state)
diagnostics.release_content: main.tf może nadal deklarować starą wersję albo zatwierdzona konfiguracja nie została zastosowana do czytelnego release.txt. [Przyczyna i kontrola](guides#guide=terraform-3&section=relay-release-state)
diagnostics.release_plan: Mogły pozostać niezastosowane zmiany (kod 2) albo błąd konfiguracji, dostawcy lub stanu przerwał planowanie (kod 1). [Przyczyna i kontrola](guides#guide=terraform-3&section=relay-clean-plan)
diagnostics.consumer_release: Pod może nadal otrzymywać starą wartość RELEASE albo rollout lub exec zawiódł przed odczytaniem wartości procesu. [Przyczyna i kontrola](guides#guide=kubernetes-12&section=relay-approved-environment)
diagnostics.service_http: Service może nadal wskazywać web, gdy worker udostępnia http; brak gotowych endpointów lub błędy DNS i exec też blokują oczekiwaną odpowiedź. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=relay-service-port)
