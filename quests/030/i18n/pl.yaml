title: State i dostępność
brief: "Zarządzane wydanie i jego konsument Kubernetes nie są jeszcze w wymaganym stanie.\n\nPracuj w `~/quest`\
  \ na stacji roboczej. Dane wejściowe według etapu:\n- Etap 1: `main.tf`.\n- Etap 2: `deployment.yaml`.\n\n**Wymagania:**\n\
  \n- Etap 1:\n  - OpenTofu rejestruje zarządzany artefakt wydania w state.\n  - Na stacji roboczej `release.txt`\
  \ zawiera `release-30`.\n  - Plan OpenTofu kończy się kodem `0` bez zmian.\n- Etap 2:\n  - Deployment `relay`\
  \ kończy rollout, a jego działający proces jest skonfigurowany dla `release-30`.\n\nOdpowiedź HTTP konsumenta\
  \ i historia zmian są poza tą kontrolą; obserwowane są rollout i środowisko procesu."
stages.0.brief: Lokalne wydanie musi być zarządzane w sposób spójny.
stages.1.brief: Działający konsument musi odzwierciedlać to samo wydanie.
hints.0.text: Zacznij od znacznika zarządzanego wydania, a nie od pod.
hints.1.text: 'Użyj state i plan, aby przywrócić release.txt przed drugim etapem. Sprawdź `main.tf` pod kątem brakującego
  producenta `release.txt`.


  Porównaj definicję artefaktu z opisem odbiorcy.


  ```sh

  cat main.tf

  kubectl describe deployment relay

  ```'
hints.2.text: |-
  Następnie sprawdź środowisko reader RELEASE i jego exec readiness test.

  Sprawdź odpowiedni etap po naprawie.

  Etap 1: State zawiera `release.txt`, plik pokazuje `release-30`, a plan kończy się kodem `0` bez zmian.

  ```sh
  tofu show -json
  cat release.txt
  printf "\n"
  tofu plan -input=false -detailed-exitcode -no-color
  ```

  Etap 2: Rollout jest zakończony, a działający proces wypisuje `release-30`.

  ```sh
  kubectl rollout status deployment/relay --timeout=3s
  kubectl exec deployment/relay -c worker -- printenv RELEASE
  ```

debrief: Nie było znacznika wydania, a reader korzystał z wycofanej wersji. Najpierw przywróciłeś state, a następnie
  naprawiłeś działający reader.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
