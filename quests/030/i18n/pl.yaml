title: State i dostępność
brief: 'Dołączyłeś do operacji SignalRail. Napraw znacznik zwolnienia i przynieś z powrotem pod. Pracuj
  w ~/quest.. Wszystkie zmiany przechowuj w tej komorze szkoleniowej.


  Zacznij od main.tf:, definiuje brakujące wyjście release.txt.


  Pliki zadań w `~/quest` (niektóre zostały wprowadzone w późniejszych etapach): `main.tf`, `deployment.json`,
  `release.txt`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Wszystkie zmiany muszą pozostać w tej zatoce.


  Początkowe kryteria sukcesu: znacznik zarządzanej wersji jest poprawny.'
stages.0.brief: 'Przywróć znacznik zarządzanego wydania release-30.


  Kryteria sukcesu: znacznik zarządzanej wersji jest poprawny.'
stages.0.objectives.0.text: Znacznik zarządzanej wersji jest poprawny.
stages.1.brief: 'release dotarł do station. Pojawił się incydent reader: napraw środowisko RELEASE.


  Kryteria sukcesu: Aktywny reader obsługuje zamierzony release.'
stages.1.objectives.0.text: Aktywny reader obsługuje zamierzony release.
hints.0.text: Zacznij od znacznika zarządzanego wydania, a nie od pod.
hints.1.text: Użyj state i plan, aby przywrócić release.txt przed drugim etapem.
hints.2.text: Następnie sprawdź środowisko reader RELEASE i jego exec readiness test.
debrief: Nie było znacznika wydania, a reader korzystał z wycofanej wersji. Najpierw przywróciłeś state,
  a następnie naprawiłeś działający reader.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
