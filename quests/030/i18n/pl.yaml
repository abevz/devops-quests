title: State i dostępność
brief: "Zarządzane wydanie i jego konsument Kubernetes nie są jeszcze w wymaganym stanie.\n\nPracuj w `~/quest`\
  \ na stacji roboczej. Dane wejściowe według etapu:\n- Etap 1: `main.tf`.\n- Etap 2: `deployment.yaml`.\n\n**Wymagania:**\n\
  \n- Etap 1:\n  - State OpenTofu zawiera `local_file.release`.\n  - Na stacji roboczej `release.txt` zawiera `release-30`.\n\
  \  - Plan OpenTofu kończy się kodem `0` bez zmian.\n  - Zarządzany plik to `~/quest/release.txt` na stacji roboczej.\n\
  - Etap 2:\n  - Deployment `relay` kończy rollout, a jego działający proces ma `RELEASE=release-30`.\n\n**Sprawdź\
  \ przed Check & finish:**\n\n- Etap 1: State zawiera `local_file.release`, plik pokazuje `release-30`, a plan\
  \ kończy się kodem `0` bez zmian.\n\n  ```sh\n  tofu state list\n  cat release.txt\n  printf \"\\n\"\n  tofu plan\
  \ -input=false -detailed-exitcode -no-color\n  ```\n\n- Etap 2: Rollout jest zakończony, a działający proces wypisuje\
  \ `release-30`.\n\n  ```sh\n  kubectl rollout status deployment/relay --timeout=3s\n  kubectl exec deployment/relay\
  \ -- printenv RELEASE\n  ```\n\nOdpowiedź HTTP konsumenta i historia zmian są poza tą kontrolą; obserwowane są\
  \ rollout i środowisko procesu."
stages.0.brief: Lokalne wydanie musi być zarządzane w sposób spójny.
stages.1.brief: Działający konsument musi odzwierciedlać to samo wydanie.
hints.0.text: Zacznij od znacznika zarządzanego wydania, a nie od pod.
hints.1.text: Użyj state i plan, aby przywrócić release.txt przed drugim etapem. Sprawdź `main.tf` pod kątem brakującego
  producenta `release.txt`.
hints.2.text: Następnie sprawdź środowisko reader RELEASE i jego exec readiness test.
debrief: Nie było znacznika wydania, a reader korzystał z wycofanej wersji. Najpierw przywróciłeś state, a następnie
  naprawiłeś działający reader.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
stages.0.objectives.0.text: State OpenTofu zawiera `local_file.release`.
stages.0.objectives.1.text: Na stacji roboczej `release.txt` zawiera `release-30`.
stages.0.objectives.2.text: Plan OpenTofu kończy się kodem `0` bez zmian.
stages.1.objectives.0.text: Deployment `relay` kończy rollout, a jego działający proces ma `RELEASE=release-30`.
