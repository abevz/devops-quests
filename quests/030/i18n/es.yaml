title: Estado y disponibilidad
brief: 'Te uniste a las operaciones de SignalRail. Repare un marcador de liberación y recupere su pod.
  Trabajar en ~/quest. Mantenga todos los cambios dentro de esta bahía de entrenamiento.


  Comience con main.tf: define la salida release.txt que falta.


  Archivos de búsqueda en `~/quest` (algunos se introducen en etapas posteriores): `main.tf`, `deployment.json`,
  `release.txt`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente los archivos suministrados, las imágenes
  precargadas y los servicios privados. Todos los cambios deben permanecer dentro de esta bahía.


  Criterios de éxito iniciales: el marcador de liberación gestionada es correcto.'
stages.0.brief: 'Restaure el marcador de versión administrada release-30.


  Criterios de éxito: el marcador de versión gestionada es correcto.'
stages.0.objectives.0.text: El marcador de liberación gestionada es correcto.
stages.1.brief: 'El lanzamiento llegó al station. Apareció un incidente reader: repare su entorno RELEASE.


  Criterios de éxito: el reader en vivo sirve para la versión prevista.'
stages.1.objectives.0.text: El reader en vivo sirve para la versión prevista.
hints.0.text: Comience con el marcador de versión administrada, no con el pod.
hints.1.text: Utilice state y plan para restaurar release.txt antes de la segunda etapa.
hints.2.text: Luego inspect el entorno reader RELEASE y su exec readiness test.
debrief: El marcador de liberación estaba ausente y el reader usó una versión retired. Primero restauró
  el estado y luego reparó el reader activo.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el estado de workload y su preparación después del cambio.
