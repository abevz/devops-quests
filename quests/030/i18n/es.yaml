title: Estado y disponibilidad
brief: |-
  La versión del relay está obsoleta. El relay debe atender solicitudes cuando su proceso use la revisión aprobada.

  Trabaja en la estación de trabajo en `~/quest`. En la etapa 1, inspecciona `main.tf` y `approved-release.txt`. En la etapa 2, usa el archivo generado `release.txt` y el manifiesto suministrado `deployment.yaml`.

  **Requirements:**

  - OpenTofu registra el artefacto administrado de la versión en su estado.
  - En la estación de trabajo, `release.txt` contiene `release-30`, la revisión de `approved-release.txt`.
  - El plan de OpenTofu termina con código `0` y sin cambios.
  - El Deployment `relay` completa su despliegue. Dentro del worker, `RELEASE` vale `release-30` y el Service en `http://relay:8080/` devuelve `signalrail`.
stages.0.brief: La versión local debe estar gestionada de forma coherente.
stages.1.brief: El consumidor en ejecución debe reflejar la misma versión.
hints.0.text: |-
  Compara la versión aprobada con lo que OpenTofu va a escribir antes de revisar el consumidor.
hints.1.text: |-
  Etapa 1: compara el contenido propuesto con el registro aprobado. Etapa 2: inspecciona por separado el Deployment, el Service y los backends calculados.

  ```sh
  cat approved-release.txt
  tofu plan -input=false -no-color
  ```

  ```sh
  kubectl get deployment relay -o yaml
  kubectl describe service relay
  kubectl get endpointslice -l kubernetes.io/service-name=relay -o yaml
  ```
hints.2.text: |-
  Etapa 1: el estado incluye el archivo administrado `release.txt`. Su contenido coincide con `approved-release.txt` y el plan termina con código `0`. Etapa 2: el despliegue termina, el worker imprime `release-30` y el Service devuelve `signalrail`.

  ```sh
  tofu show -json | jq -r '.. | objects | select(.type? == "local_file" and .mode? == "managed") | .values.filename'
  cat release.txt
  tofu plan -input=false -detailed-exitcode -no-color
  ```

  ```sh
  kubectl rollout status deployment/relay --timeout=3s
  kubectl exec deployment/relay -c worker -- printenv RELEASE
  kubectl exec deployment/relay -c worker -- wget -qO- -T 3 http://relay:8080/
  ```
debrief: |-
  El plan y el estado describen el contenido administrado. El despliegue refleja la disponibilidad del proceso. El enrutamiento del Service determina si los clientes pueden llegar al proceso.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el estado de workload y su preparación después del cambio.
stages.0.objectives.0.text: OpenTofu registra el artefacto de versión gestionado en el state.
stages.0.objectives.1.text: |-
  En la estación de trabajo, `release.txt` contiene `release-30`, la revisión de `approved-release.txt`.
stages.0.objectives.2.text: El plan de OpenTofu termina con código `0` sin cambios.
stages.1.objectives.0.text: |-
  El Deployment `relay` completa su despliegue. Dentro del worker, `RELEASE` vale `release-30` y el Service en `http://relay:8080/` devuelve `signalrail`.
diagnostics.state: El archivo gestionado puede faltar o no haberse aplicado, o el estado puede ser ilegible. [Causa y comprobación](guides#guide=terraform-3&section=relay-release-state)
diagnostics.probe_0_0: La sonda de estado puede haberse detenido sin diagnóstico si la estación no pudo entrar en ~/quest o arrancar Python. [Causa y comprobación](guides#guide=terraform-3&section=relay-release-state)
diagnostics.release_content: main.tf puede seguir declarando la versión antigua, o la configuración aprobada no se ha aplicado a un release.txt legible. [Causa y comprobación](guides#guide=terraform-3&section=relay-release-state)
diagnostics.release_plan: Pueden quedar cambios sin aplicar (código 2), o un error de configuración, proveedor o estado puede impedir el plan (código 1). [Causa y comprobación](guides#guide=terraform-3&section=relay-clean-plan)
diagnostics.consumer_release: El Pod puede seguir recibiendo el RELEASE antiguo, o rollout o exec puede haber fallado antes de leer el valor actual. [Causa y comprobación](guides#guide=kubernetes-12&section=relay-approved-environment)
diagnostics.service_http: El Service puede seguir apuntando a web mientras worker expone http; la falta de endpoints disponibles o errores de DNS y exec también impiden la respuesta. [Causa y comprobación](guides#guide=kubernetes-10&section=relay-service-port)
