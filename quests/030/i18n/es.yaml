title: Estado y disponibilidad
brief: "La versión gestionada y su consumidor Kubernetes aún no están en el estado requerido.\n\nTrabaja en `~/quest`\
  \ en la estación de trabajo. Entradas por etapa:\n- Etapa 1: `main.tf`.\n- Etapa 2: `deployment.yaml`.\n\n**Requisitos:**\n\
  \n- Etapa 1:\n  - OpenTofu registra el artefacto de versión gestionado en el state.\n  - En la estación de trabajo,\
  \ `release.txt` contiene `release-30`.\n  - El plan de OpenTofu termina con código `0` sin cambios.\n- Etapa 2:\n\
  \  - El Deployment `relay` completa su rollout y su proceso en ejecución está configurado para `release-30`.\n\
  \nLa respuesta HTTP del consumidor y el historial de cambios quedan fuera de esta comprobación; se observan su\
  \ rollout y entorno del proceso."
stages.0.brief: La versión local debe estar gestionada de forma coherente.
stages.1.brief: El consumidor en ejecución debe reflejar la misma versión.
hints.0.text: Comience con el marcador de versión administrada, no con el pod.
hints.1.text: 'Utilice state y plan para restaurar release.txt antes de la segunda etapa. Inspecciona `main.tf`
  para encontrar el productor ausente de `release.txt`.


  Compara la definición del artefacto con la descripción del consumidor.


  ```sh

  cat main.tf

  kubectl describe deployment relay

  ```'
hints.2.text: |-
  Luego inspect el entorno reader RELEASE y su exec readiness test.

  Verifica la etapa correspondiente tras repararla.

  Etapa 1: El state incluye `release.txt`, el archivo muestra `release-30` y el plan termina con código `0` sin cambios.

  ```sh
  tofu show -json
  cat release.txt
  printf "\n"
  tofu plan -input=false -detailed-exitcode -no-color
  ```

  Etapa 2: El rollout está completo y el proceso en ejecución imprime `release-30`.

  ```sh
  kubectl rollout status deployment/relay --timeout=3s
  kubectl exec deployment/relay -c worker -- printenv RELEASE
  ```

debrief: El marcador de liberación estaba ausente y el reader usó una versión retired. Primero restauró el estado
  y luego reparó el reader activo.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el estado de workload y su preparación después del cambio.
stages.0.objectives.0.text: OpenTofu registra el artefacto de versión gestionado en el state.
stages.0.objectives.1.text: En la estación de trabajo, `release.txt` contiene `release-30`.
stages.0.objectives.2.text: El plan de OpenTofu termina con código `0` sin cambios.
stages.1.objectives.0.text: El Deployment `relay` completa su rollout y su proceso en ejecución está configurado
  para `release-30`.
diagnostics.state: El estado de OpenTofu debe registrar el artefacto administrado release.txt.
