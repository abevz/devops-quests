title: Zustand und Verfügbarkeit
brief: "Das verwaltete Release und sein Kubernetes-Verbraucher sind noch nicht im geforderten Zustand.\n\nArbeiten\
  \ Sie in `~/quest` auf der Workstation. Eingaben je Phase:\n- Phase 1: `main.tf`.\n- Phase 2: `deployment.yaml`.\n\
  \n**Anforderungen:**\n\n- Phase 1:\n  - Der OpenTofu-State enthält `local_file.release`.\n  - Auf der Workstation\
  \ enthält `release.txt` den Wert `release-30`.\n  - Der OpenTofu-Plan endet mit Code `0` ohne Änderungen.\n  -\
  \ Die verwaltete Datei ist `~/quest/release.txt` auf der Workstation.\n- Phase 2:\n  - Deployment `relay` schließt\
  \ seinen Rollout ab und sein laufender Prozess hat `RELEASE=release-30`.\n\n**Vor Check & finish selbst prüfen:**\n\
  \n- Phase 1: Der State enthält `local_file.release`, die Datei zeigt `release-30` und der Plan endet mit Code\
  \ `0` ohne Änderungen.\n\n  ```sh\n  tofu state list\n  cat release.txt\n  printf \"\\n\"\n  tofu plan -input=false\
  \ -detailed-exitcode -no-color\n  ```\n\n- Phase 2: Der Rollout ist abgeschlossen und der laufende Prozess gibt\
  \ `release-30` aus.\n\n  ```sh\n  kubectl rollout status deployment/relay --timeout=3s\n  kubectl exec deployment/relay\
  \ -- printenv RELEASE\n  ```\n\nHTTP-Antwort des Verbrauchers und Änderungshistorie liegen außerhalb dieser Prüfung;\
  \ beobachtet werden Rollout und Prozessumgebung."
stages.0.brief: Das lokale Release muss konsistent verwaltet werden.
stages.1.brief: Der laufende Verbraucher muss dasselbe Release widerspiegeln.
hints.0.text: Beginnen Sie mit dem verwalteten Release-Marker, nicht mit dem pod.
hints.1.text: Verwenden Sie den Status und plan, um release.txt vor der zweiten Stufe wiederherzustellen. Prüfen
  Sie `main.tf` auf den fehlenden Erzeuger von `release.txt`.
hints.2.text: Dann inspect die reader RELEASE-Umgebung und ihre exec readiness test.
debrief: Der Release-Marker fehlte und der reader verwendete eine retired-Version. Sie haben zuerst den Zustand
  wiederhergestellt und dann den Live-reader repariert.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe den workload-Status und seine Bereitschaft nach der Änderung überprüft.
stages.0.objectives.0.text: Der OpenTofu-State enthält `local_file.release`.
stages.0.objectives.1.text: Auf der Workstation enthält `release.txt` den Wert `release-30`.
stages.0.objectives.2.text: Der OpenTofu-Plan endet mit Code `0` ohne Änderungen.
stages.1.objectives.0.text: Deployment `relay` schließt seinen Rollout ab und sein laufender Prozess hat `RELEASE=release-30`.
