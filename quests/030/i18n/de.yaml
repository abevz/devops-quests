title: Zustand und Verfügbarkeit
brief: "Das verwaltete Release und sein Kubernetes-Verbraucher sind noch nicht im geforderten Zustand.\n\nArbeiten\
  \ Sie in `~/quest` auf der Workstation. Eingaben je Phase:\n- Phase 1: `main.tf`.\n- Phase 2: `deployment.yaml`.\n\
  \n**Anforderungen:**\n\n- Phase 1:\n  - OpenTofu erfasst das verwaltete Release-Artefakt im State.\n  - Auf der\
  \ Workstation enthält `release.txt` den Wert `release-30`.\n  - Der OpenTofu-Plan endet mit Code `0` ohne Änderungen.\n\
  - Phase 2:\n  - Deployment `relay` schließt seinen Rollout ab und sein laufender Prozess ist für `release-30`\
  \ konfiguriert.\n\nHTTP-Antwort des Verbrauchers und Änderungshistorie liegen außerhalb dieser Prüfung; beobachtet\
  \ werden Rollout und Prozessumgebung."
stages.0.brief: Das lokale Release muss konsistent verwaltet werden.
stages.1.brief: Der laufende Verbraucher muss dasselbe Release widerspiegeln.
hints.0.text: Beginnen Sie mit dem verwalteten Release-Marker, nicht mit dem pod.
hints.1.text: 'Verwenden Sie den Status und plan, um release.txt vor der zweiten Stufe wiederherzustellen. Prüfen
  Sie `main.tf` auf den fehlenden Erzeuger von `release.txt`.


  Vergleichen Sie die Artefaktdefinition mit der Verbraucherbeschreibung.


  ```sh

  cat main.tf

  kubectl describe deployment relay

  ```'
hints.2.text: |-
  Dann inspect die reader RELEASE-Umgebung und ihre exec readiness test.

  Prüfen Sie die jeweilige Phase nach der Reparatur.

  Phase 1: Der State enthält `release.txt`, die Datei zeigt `release-30` und der Plan endet mit Code `0` ohne Änderungen.

  ```sh
  tofu show -json
  cat release.txt
  printf "\n"
  tofu plan -input=false -detailed-exitcode -no-color
  ```

  Phase 2: Der Rollout ist abgeschlossen und der laufende Prozess gibt `release-30` aus.

  ```sh
  kubectl rollout status deployment/relay --timeout=3s
  kubectl exec deployment/relay -c worker -- printenv RELEASE
  ```

debrief: Der Release-Marker fehlte und der reader verwendete eine retired-Version. Sie haben zuerst den Zustand
  wiederhergestellt und dann den Live-reader repariert.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe den workload-Status und seine Bereitschaft nach der Änderung überprüft.
