title: Zustand und Verfügbarkeit
brief: 'Sie sind dem Betrieb SignalRail beigetreten. Reparieren Sie einen Release-Marker und bringen Sie
  seinen pod zurück. Arbeiten Sie in ~/quest.. Bewahren Sie alle Änderungen in diesem Trainingsbereich
  auf.


  Beginnen Sie mit main.tf: Es definiert die fehlende "release.txt"-Ausgabe.


  Questdateien in `~/quest` (einige werden in späteren Phasen eingeführt): `main.tf`, `deployment.json`,
  `release.txt`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur die bereitgestellten Dateien,
  vorinstallierten Bilder und privaten Dienste. Alle Änderungen müssen innerhalb dieser Bucht bleiben.


  Anfängliche Erfolgskriterien: Der verwaltete Release-Marker ist korrekt.'
stages.0.brief: 'Stellen Sie den verwalteten Release-Marker release-30 wieder her.


  Erfolgskriterium: Der verwaltete Release-Marker ist korrekt.'
stages.0.objectives.0.text: Der verwaltete Release-Marker ist korrekt.
stages.1.brief: 'Die Veröffentlichung erreichte den station. Es ist ein reader-Vorfall aufgetreten: Reparieren
  Sie die RELEASE-Umgebung.


  Erfolgskriterium: Der Live-reader dient der beabsichtigten Veröffentlichung.'
stages.1.objectives.0.text: Der Live-reader dient der beabsichtigten Veröffentlichung.
hints.0.text: Beginnen Sie mit dem verwalteten Release-Marker, nicht mit dem pod.
hints.1.text: Verwenden Sie den Status und plan, um release.txt vor der zweiten Stufe wiederherzustellen.
hints.2.text: Dann inspect die reader RELEASE-Umgebung und ihre exec readiness test.
debrief: Der Release-Marker fehlte und der reader verwendete eine retired-Version. Sie haben zuerst den
  Zustand wiederhergestellt und dann den Live-reader repariert.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe den workload-Status und seine Bereitschaft nach der Änderung überprüft.
