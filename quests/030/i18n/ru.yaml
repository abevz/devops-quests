title: State и доступность
brief: 'Вы в команде эксплуатации SignalRail. Исправьте маркер и восстановите pod. Работайте в ~/quest.
  Все изменения — только в этой песочнице.


  Начните с main.tf: он описывает отсутствующий выходной файл release.txt.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `main.tf`, `deployment.json`, `release.txt`.


  В песочнице нет интернета и внешнего DNS. Используйте только выданные файлы, предварительно загруженные
  образы и приватные сервисы. Все изменения — только в этой песочнице.


  Цели первого этапа: Управляемый маркер корректен.'
stages.0.brief: 'Восстановите управляемый маркер release-30.


  Результат проверки: Управляемый маркер корректен.'
stages.0.objectives.0.text: Управляемый маркер корректен.
stages.1.brief: 'Релиз доставлен. Новый инцидент reader: исправьте RELEASE.


  Результат проверки: Работающий reader обслуживает нужный release.'
stages.1.objectives.0.text: Работающий reader обслуживает нужный release.
hints.0.text: Начните с управляемого маркера релиза, а не с pod.
hints.1.text: Восстановите release.txt через state и plan до второго этапа.
hints.2.text: Затем проверьте RELEASE у reader и exec readiness test.
debrief: Маркер отсутствовал, reader использовал старую версию. Вы восстановили state, затем исправили
  работающий reader.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: После изменения я проверил состояние workload и его готовность.
