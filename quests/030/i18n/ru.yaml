title: State и доступность
brief: "Управляемый релиз и его потребитель Kubernetes ещё не находятся в требуемом состоянии.\n\nРаботайте в `~/quest`\
  \ на рабочей станции. Входные файлы по этапам:\n- Этап 1: `main.tf`.\n- Этап 2: `deployment.yaml`.\n\n**Требования:**\n\
  \n- Этап 1:\n  - State OpenTofu содержит `local_file.release`.\n  - На рабочей станции `release.txt` содержит\
  \ `release-30`.\n  - План OpenTofu завершается с кодом `0` без изменений.\n  - Управляемый файл — `~/quest/release.txt`\
  \ на рабочей станции.\n- Этап 2:\n  - Deployment `relay` завершает развёртывание, а его работающий процесс имеет\
  \ `RELEASE=release-30`.\n\n**Проверьте себя перед Check & finish:**\n\n- Этап 1: State включает `local_file.release`,\
  \ файл показывает `release-30`, план завершается с кодом `0` без изменений.\n\n  ```sh\n  tofu state list\n  cat\
  \ release.txt\n  printf \"\\n\"\n  tofu plan -input=false -detailed-exitcode -no-color\n  ```\n\n- Этап 2: Развёртывание\
  \ завершено, работающий процесс выводит `release-30`.\n\n  ```sh\n  kubectl rollout status deployment/relay --timeout=3s\n\
  \  kubectl exec deployment/relay -- printenv RELEASE\n  ```\n\nHTTP-ответ потребителя и история правок находятся\
  \ вне проверки; наблюдаемый результат потребителя — развёртывание и окружение процесса."
stages.0.brief: Локальный релиз должен находиться под согласованным управлением.
stages.1.brief: Работающий потребитель должен отражать тот же релиз.
hints.0.text: Начните с управляемого маркера релиза, а не с pod.
hints.1.text: Восстановите release.txt через state и plan до второго этапа. Найдите в `main.tf` отсутствующий источник
  создания `release.txt`.
hints.2.text: Затем проверьте RELEASE у reader и exec readiness test.
debrief: Маркер отсутствовал, reader использовал старую версию. Вы восстановили state, затем исправили работающий
  reader.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: После изменения я проверил состояние workload и его готовность.
stages.0.objectives.0.text: State OpenTofu содержит `local_file.release`.
stages.0.objectives.1.text: На рабочей станции `release.txt` содержит `release-30`.
stages.0.objectives.2.text: План OpenTofu завершается с кодом `0` без изменений.
stages.1.objectives.0.text: Deployment `relay` завершает развёртывание, а его работающий процесс имеет `RELEASE=release-30`.
