title: State и доступность
brief: "Управляемый релиз и его потребитель Kubernetes ещё не находятся в требуемом состоянии.\n\nРаботайте в `~/quest`\
  \ на рабочей станции. Входные файлы по этапам:\n- Этап 1: `main.tf`.\n- Этап 2: `deployment.yaml`.\n\n**Требования:**\n\
  \n- Этап 1:\n  - OpenTofu учитывает управляемый артефакт релиза в state.\n  - На рабочей станции `release.txt`\
  \ содержит `release-30`.\n  - План OpenTofu завершается с кодом `0` без изменений.\n- Этап 2:\n  - Deployment\
  \ `relay` завершает развёртывание, его работающий процесс настроен на `release-30`.\n\nHTTP-ответ потребителя\
  \ и история правок находятся вне проверки; наблюдаемый результат потребителя — развёртывание и окружение процесса."
stages.0.brief: Локальный релиз должен находиться под согласованным управлением.
stages.1.brief: Работающий потребитель должен отражать тот же релиз.
hints.0.text: Начните с управляемого маркера релиза, а не с pod.
hints.1.text: 'Восстановите release.txt через state и plan до второго этапа. Найдите в `main.tf` отсутствующий источник
  создания `release.txt`.


  Сравните описание управляемого артефакта с описанием потребителя.


  ```sh

  cat main.tf

  kubectl describe deployment relay

  ```'
hints.2.text: |-
  Затем проверьте RELEASE у reader и exec readiness test.

  Проверьте соответствующий этап после исправления.

  Этап 1: State включает `release.txt`, файл показывает `release-30`, план завершается с кодом `0` без изменений.

  ```sh
  tofu show -json
  cat release.txt
  printf "\n"
  tofu plan -input=false -detailed-exitcode -no-color
  ```

  Этап 2: Развёртывание завершено, работающий процесс выводит `release-30`.

  ```sh
  kubectl rollout status deployment/relay --timeout=3s
  kubectl exec deployment/relay -c worker -- printenv RELEASE
  ```

debrief: Маркер отсутствовал, reader использовал старую версию. Вы восстановили state, затем исправили работающий
  reader.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: После изменения я проверил состояние workload и его готовность.
stages.0.objectives.0.text: OpenTofu учитывает управляемый артефакт релиза в state.
stages.0.objectives.1.text: На рабочей станции `release.txt` содержит `release-30`.
stages.0.objectives.2.text: План OpenTofu завершается с кодом `0` без изменений.
stages.1.objectives.0.text: Deployment `relay` завершает развёртывание, его работающий процесс настроен на `release-30`.
diagnostics.state: OpenTofu state должен учитывать управляемый артефакт release.txt.
diagnostics.probe_0_0: 'Текущие данные не позволили проверить эту цель: OpenTofu учитывает управляемый артефакт
