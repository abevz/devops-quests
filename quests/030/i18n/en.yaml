title: State and availability
brief: "The managed release and its Kubernetes consumer are not in the required state.\n\nWork in `~/quest` on the\
  \ workstation. Inputs by stage:\n- Stage 1: `main.tf`.\n- Stage 2: `deployment.yaml`.\n\n**Requirements:**\n\n\
  - Stage 1:\n  - OpenTofu state contains `local_file.release`.\n  - On the workstation, `release.txt` contains\
  \ `release-30`.\n  - The OpenTofu plan exits `0` with no changes.\n  - The managed file is `~/quest/release.txt`\
  \ on the workstation.\n- Stage 2:\n  - Deployment `relay` completes its rollout and its running process has `RELEASE=release-30`.\n\
  \n**Verify yourself before Check & finish:**\n\n- Stage 1: The state includes `local_file.release`, the file shows\
  \ `release-30`, and the plan exits `0` without changes.\n\n  ```sh\n  tofu state list\n  cat release.txt\n  printf\
  \ \"\\n\"\n  tofu plan -input=false -detailed-exitcode -no-color\n  ```\n\n- Stage 2: The rollout is complete\
  \ and the running process prints `release-30`.\n\n  ```sh\n  kubectl rollout status deployment/relay --timeout=3s\n\
  \  kubectl exec deployment/relay -- printenv RELEASE\n  ```\n\nThe consumer HTTP response and edit history are\
  \ outside this check; the observed consumer result is its rollout and process environment."
stages.0.brief: The local release must be under consistent management.
stages.1.brief: The running consumer must reflect the same release.
hints.0.text: Start with the managed release marker, not the pod.
hints.1.text: Use state and plan to restore release.txt before the second stage. Inspect `main.tf` for the missing
  producer of `release.txt`.
hints.2.text: Then inspect the reader RELEASE environment and its exec readiness test.
debrief: The release marker was absent and the reader used a retired version. You restored state first, then repaired
  the live reader.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked the workload state and its readiness after the change.
stages.0.objectives.0.text: OpenTofu state contains `local_file.release`.
stages.0.objectives.1.text: On the workstation, `release.txt` contains `release-30`.
stages.0.objectives.2.text: The OpenTofu plan exits `0` with no changes.
stages.1.objectives.0.text: Deployment `relay` completes its rollout and its running process has `RELEASE=release-30`.
