title: State and availability
brief: 'You joined SignalRail operations. Repair a release marker and bring its pod back. Work in ~/quest.
  Keep all changes inside this training bay.


  Start with main.tf: it defines the missing release.txt output.


  Quest files in `~/quest` (some are introduced in later stages): `main.tf`, `deployment.json`, `release.txt`.


  The bay has no Internet or external DNS. Use only its supplied files, preloaded images and private services.
  All changes must stay inside this bay.


  Initial success criteria: The managed release marker is correct.'
stages.0.brief: 'Restore the managed release marker release-30.


  Success criteria: The managed release marker is correct.'
stages.0.objectives.0.text: The managed release marker is correct.
stages.1.brief: 'The release reached the station. A reader incident appeared: repair its RELEASE environment.


  Success criteria: The live reader serves the intended release.'
stages.1.objectives.0.text: The live reader serves the intended release.
hints.0.text: Start with the managed release marker, not the pod.
hints.1.text: Use state and plan to restore release.txt before the second stage.
hints.2.text: Then inspect the reader RELEASE environment and its exec readiness test.
debrief: The release marker was absent and the reader used a retired version. You restored state first,
  then repaired the live reader.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked the workload state and its readiness after the change.
