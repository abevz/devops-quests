title: State and availability
brief: "The managed release and its Kubernetes consumer are not in the required state.\n\nWork in `~/quest` on the\
  \ workstation. Inputs by stage:\n- Stage 1: `main.tf`.\n- Stage 2: `deployment.yaml`.\n\n**Requirements:**\n\n\
  - Stage 1:\n  - OpenTofu records the managed release artifact in state.\n  - On the workstation, `release.txt`\
  \ contains `release-30`.\n  - The OpenTofu plan exits `0` with no changes.\n- Stage 2:\n  - Deployment `relay`\
  \ completes its rollout and its running process is configured for `release-30`.\n\nThe consumer HTTP response\
  \ and edit history are outside this check; the observed consumer result is its rollout and process environment."
stages.0.brief: The local release must be under consistent management.
stages.1.brief: The running consumer must reflect the same release.
hints.0.text: Start with the managed release marker, not the pod.
hints.1.text: 'Use state and plan to restore release.txt before the second stage. Inspect `main.tf` for the missing
  producer of `release.txt`.


  Compare the managed artifact definition with the consumer description.


  ```sh

  cat main.tf

  kubectl describe deployment relay

  ```'
hints.2.text: |-
  Then inspect the reader RELEASE environment and its exec readiness test.

  Verify the relevant stage after repairing it.

  Stage 1: The state includes `release.txt`, the file shows `release-30`, and the plan exits `0` without changes.

  ```sh
  tofu show -json
  cat release.txt
  printf "\n"
  tofu plan -input=false -detailed-exitcode -no-color
  ```

  Stage 2: The rollout is complete and the running process prints `release-30`.

  ```sh
  kubectl rollout status deployment/relay --timeout=3s
  kubectl exec deployment/relay -c worker -- printenv RELEASE
  ```

debrief: The release marker was absent and the reader used a retired version. You restored state first, then repaired
  the live reader.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked the workload state and its readiness after the change.
stages.0.objectives.0.text: OpenTofu records the managed release artifact in state.
stages.0.objectives.1.text: On the workstation, `release.txt` contains `release-30`.
stages.0.objectives.2.text: The OpenTofu plan exits `0` with no changes.
stages.1.objectives.0.text: Deployment `relay` completes its rollout and its running process is configured for `release-30`.
diagnostics.state: OpenTofu state must track the managed release.txt artifact.
diagnostics.probe_0_0: 'The current inputs could not verify this objective: OpenTofu records the managed release
  artifact in state.'
