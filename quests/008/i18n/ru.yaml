title: Обработчики handlers
brief: |-
  Рабочее сообщение на хостах остаётся устаревшим.

  Работайте на workstation в `~/quest` с файлами `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Требования:**
  - HTTP на каждом управляемом хосте (`app1`, `app2`, `app3`):
    - Порт: `8080`.
    - Тело ответа: `north-ready`.

  **Самопроверка перед Check & finish:**
  - `ansible fleet -i inventory.ini --list-hosts` — перечисляет app1, app2 и app3.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'curl -fsS http://127.0.0.1:8080'` — возвращает north-ready от HTTP-потребителя на каждом управляемом хосте.
stages.0.brief: Работающие HTTP-потребители должны показывать нужное сообщение.
stages.0.objectives.0.text: HTTP на порту `8080` возвращает `north-ready` на каждом управляемом хосте (`app1`, `app2`,
  `app3`).
hints.0.text: Сравните файл с HTTP-ответом.
hints.1.text: Процесс сохранил сообщение при запуске; изменённому файлу нужен handler.
hints.2.text: Добавьте notify Reload banner к copy и dq-service reload в handler.
debrief: Файл изменился, процесс сохранил старое значение. Вы вызвали reload handler и проверили живые HTTP-ответы.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я проверил результат на каждом управляемом хосте.
diagnostics.http_1: 'Хост app1: HTTP-путь / на порту 8080 должен возвращать north-ready.'
diagnostics.http_2: 'Хост app2: HTTP-путь / на порту 8080 должен возвращать north-ready.'
diagnostics.http_3: 'Хост app3: HTTP-путь / на порту 8080 должен возвращать north-ready.'
