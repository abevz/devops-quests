title: Обработчики handlers
brief: 'Вы в команде эксплуатации SignalRail. Работающий процесс не перечитал сообщение. Работайте в ~/quest.
  Все изменения — только в этой песочнице.


  Входные файлы в `~/quest`: `inventory.ini`, `ansible.cfg`, `rollout.yml`.


  В песочнице нет интернета и внешнего DNS. Используйте только выданные файлы, предварительно загруженные
  образы и приватные сервисы. Все изменения — только в этой песочнице.


  Цели первого этапа: Живые HTTP-баннеры всех трёх узлов возвращают north-ready.'
stages.0.brief: 'Файл изменился, HTTP banner остался старым. Используйте handler, проверьте north-ready.


  Результат проверки: Живые HTTP-баннеры всех трёх узлов возвращают north-ready.'
stages.0.objectives.0.text: Живые HTTP-баннеры всех трёх узлов возвращают north-ready.
hints.0.text: Сравните файл с HTTP-ответом.
hints.1.text: Процесс сохранил сообщение при запуске; изменённому файлу нужен handler.
hints.2.text: Добавьте notify Reload banner к copy и dq-service reload в handler.
debrief: Файл изменился, процесс сохранил старое значение. Вы вызвали reload handler и проверили живые
  HTTP-ответы.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я проверил результат на каждом управляемом хосте.
