title: Handlers
brief: |-
  The live fleet message remains outdated.

  Work on the workstation in `~/quest` with `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Requirements:**
  - HTTP on every managed host (`app1`, `app2`, `app3`):
    - Port: `8080`.
    - Response body: `north-ready`.

  **Verify yourself before Check & finish:**
  - `ansible fleet -i inventory.ini --list-hosts` — lists app1, app2 and app3.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'curl -fsS http://127.0.0.1:8080'` — returns north-ready from the HTTP consumer on each managed host.
stages.0.brief: The live HTTP consumers must show the required message.
stages.0.objectives.0.text: HTTP on port `8080` returns `north-ready` on every managed host (`app1`, `app2`, `app3`).
hints.0.text: Compare the file with the HTTP response.
hints.1.text: The process cached its startup message; a changed file needs a handler.
hints.2.text: Notify Reload banner from the copy task and use dq-service reload in the handler.
debrief: The file changed but the process cached its old value. You notified a reload handler and verified the live
  HTTP responses.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I verified the result on every managed host.
diagnostics.http_1: 'Host app1: HTTP path / on port 8080 must return north-ready.'
diagnostics.http_2: 'Host app2: HTTP path / on port 8080 must return north-ready.'
diagnostics.http_3: 'Host app3: HTTP path / on port 8080 must return north-ready.'
