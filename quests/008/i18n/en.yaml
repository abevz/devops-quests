title: Handlers
brief: "The live fleet message remains outdated.\n\nWork on the workstation in `~/quest` with `inventory.ini`,\
  \ `ansible.cfg`, `rollout.yml`.\n\n**Requirements:**\n- The HTTP endpoint is available on every managed host\
  \ (`app1`, `app2`, `app3`):\n  - Port: `8080`.\n- Its response body is `north-ready` on every host.\n"
stages.0.brief: The live HTTP consumers must show the required message.
stages.0.objectives.0.text: HTTP on port `8080` returns `north-ready` on every managed host (`app1`, `app2`,
  `app3`).
hints.0.text: Delivered files and the response of a running process can differ.
hints.1.text: 'Compare the file with the HTTP response.


  Inspect the supplied inputs and execution scope:


  ```sh

  ansible fleet -i inventory.ini --list-hosts

  cat rollout.yml

  ansible fleet -i inventory.ini -m ansible.builtin.command -a ''cat /srv/site/message''

  ```'
hints.2.text: 'The process cached its startup message; a changed file needs a handler.


  Notify Reload banner from the copy task and use dq-service reload in the handler.


  Verify the observed result:


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''curl -fsS http://127.0.0.1:8080''` — returns
  north-ready from the HTTP consumer on each managed host.'
debrief: The file changed but the process cached its old value. You notified a reload handler and verified
  the live HTTP responses.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I verified the result on every managed host.
diagnostics.http_1: 'Host app1: HTTP path / on port 8080 must return north-ready.'
diagnostics.http_2: 'Host app2: HTTP path / on port 8080 must return north-ready.'
diagnostics.http_3: 'Host app3: HTTP path / on port 8080 must return north-ready.'
