title: Handlers
brief: 'You joined SignalRail operations. The live message did not change after a rollout. Work in ~/quest.
  Keep all changes inside this training bay.


  Inputs in `~/quest`: `inventory.ini`, `ansible.cfg`, `rollout.yml`.


  The bay has no Internet or external DNS. Use only its supplied files, preloaded images and private services.
  All changes must stay inside this bay.


  Initial success criteria: The live HTTP banners on all three hosts return north-ready.'
stages.0.brief: 'The file changed but the cached HTTP banner stayed old. Use a handler and verify all
  live banners show north-ready.


  Success criteria: The live HTTP banners on all three hosts return north-ready.'
stages.0.objectives.0.text: The live HTTP banners on all three hosts return north-ready.
hints.0.text: Compare the file with the HTTP response.
hints.1.text: The process cached its startup message; a changed file needs a handler.
hints.2.text: Notify Reload banner from the copy task and use dq-service reload in the handler.
debrief: The file changed but the process cached its old value. You notified a reload handler and verified
  the live HTTP responses.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I verified the result on every managed host.
