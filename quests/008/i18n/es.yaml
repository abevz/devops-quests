title: Manipuladores
brief: 'Te uniste a las operaciones de SignalRail. El mensaje en vivo no cambió después del lanzamiento.
  Trabajar en ~/quest. Mantenga todos los cambios dentro de esta bahía de entrenamiento.


  Entradas en `~/quest`: `inventory.ini`, `ansible.cfg`, `rollout.yml`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente los archivos suministrados, las imágenes
  precargadas y los servicios privados. Todos los cambios deben permanecer dentro de esta bahía.


  Criterios de éxito iniciales: Los banners en vivo HTTP en los tres hosts devuelven north-ready.'
stages.0.brief: 'El archivo cambió pero el HTTP banner almacenado en caché permaneció antiguo. Utilice
  un handler y verifique que todos los banners en vivo muestren north-ready.


  Criterios de éxito: los banners en vivo HTTP en los tres hosts devuelven north-ready.'
stages.0.objectives.0.text: Los banners en vivo HTTP en los tres hosts devuelven north-ready.
hints.0.text: Compare el archivo con la respuesta HTTP.
hints.1.text: El proceso almacenó en caché su mensaje de inicio; un archivo modificado necesita un handler.
hints.2.text: Notifique a Reload banner desde la tarea copy y use dq-service reload en el handler.
debrief: El archivo cambió pero el proceso almacenó en caché su valor anterior. Notificó a reload handler
  y verificó las respuestas en vivo de HTTP.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el resultado en cada host administrado.
