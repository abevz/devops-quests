title: Manipuladores
brief: |-
  El mensaje activo de la flota sigue obsoleto.

  Trabaja en la workstation en `~/quest` con `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Requisitos:**
  - Host `app1`:
    - El banner HTTP de app1:8080 devuelve north-ready.
  - Host `app2`:
    - El banner HTTP de app2:8080 devuelve north-ready.
  - Host `app3`:
    - El banner HTTP de app3:8080 devuelve north-ready.

  **Verifica antes de Check & finish:**
  - `ansible fleet -i inventory.ini --list-hosts` — enumera app1, app2 y app3.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'curl -fsS http://127.0.0.1:8080'` — devuelve north-ready del consumidor HTTP en cada host administrado.
stages.0.brief: Los consumidores HTTP activos deben mostrar el mensaje requerido.
stages.0.objectives.0.text: El banner HTTP de app1:8080 devuelve north-ready.
stages.0.objectives.1.text: El banner HTTP de app2:8080 devuelve north-ready.
stages.0.objectives.2.text: El banner HTTP de app3:8080 devuelve north-ready.
hints.0.text: Compare el archivo con la respuesta HTTP.
hints.1.text: El proceso almacenó en caché su mensaje de inicio; un archivo modificado necesita un handler.
hints.2.text: Notifique a Reload banner desde la tarea copy y use dq-service reload en el handler.
debrief: El archivo cambió pero el proceso almacenó en caché su valor anterior. Notificó a reload handler y verificó
  las respuestas en vivo de HTTP.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el resultado en cada host administrado.
