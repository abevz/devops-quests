title: Manipuladores
brief: "El mensaje activo de la flota sigue obsoleto.\n\nTrabaja en la workstation en `~/quest` con `inventory.ini`,\
  \ `ansible.cfg`, `rollout.yml`.\n\n**Requisitos:**\n- El endpoint HTTP está disponible en cada host gestionado\
  \ (`app1`, `app2`, `app3`):\n  - Puerto: `8080`.\n- Su cuerpo de respuesta es `north-ready` en cada host.\n"
stages.0.brief: Los consumidores HTTP activos deben mostrar el mensaje requerido.
stages.0.objectives.0.text: HTTP en el puerto `8080` devuelve `north-ready` en cada host administrado (`app1`,
  `app2`, `app3`).
hints.0.text: Los archivos entregados y la respuesta de un proceso en ejecución pueden diferir.
hints.1.text: 'Compare el archivo con la respuesta HTTP.


  Inspecciona las entradas suministradas y el ámbito de ejecución:


  ```sh

  ansible fleet -i inventory.ini --list-hosts

  cat rollout.yml

  ansible fleet -i inventory.ini -m ansible.builtin.command -a ''cat /srv/site/message''

  ```'
hints.2.text: 'El proceso almacenó en caché su mensaje de inicio; un archivo modificado necesita un handler.


  Notifique a Reload banner desde la tarea copy y use dq-service reload en el handler.


  Verifica el resultado observado:


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''curl -fsS http://127.0.0.1:8080''` — devuelve
  north-ready del consumidor HTTP en cada host administrado.'
debrief: El archivo cambió pero el proceso almacenó en caché su valor anterior. Notificó a reload handler y
  verificó las respuestas en vivo de HTTP.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el resultado en cada host administrado.
diagnostics.http_1: 'Host app1: la ruta HTTP / en el puerto 8080 debe devolver north-ready.'
diagnostics.http_2: 'Host app2: la ruta HTTP / en el puerto 8080 debe devolver north-ready.'
diagnostics.http_3: 'Host app3: la ruta HTTP / en el puerto 8080 debe devolver north-ready.'
