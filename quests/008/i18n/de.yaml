title: Handler
brief: "Die aktive Flottennachricht bleibt veraltet.\n\nArbeiten Sie auf der Workstation in `~/quest` mit `inventory.ini`,\
  \ `ansible.cfg`, `rollout.yml`.\n\n**Anforderungen:**\n- Der HTTP-Endpunkt ist auf jedem verwalteten Host\
  \ (`app1`, `app2`, `app3`) verfügbar:\n  - Port: `8080`.\n- Sein Antworttext ist auf jedem Host `north-ready`.\n"
stages.0.brief: Die aktiven HTTP-Verbraucher müssen die erforderliche Nachricht zeigen.
stages.0.objectives.0.text: HTTP auf Port `8080` liefert auf jedem verwalteten Host (`app1`, `app2`, `app3`)
  `north-ready`.
hints.0.text: Ausgelieferte Dateien und die Antwort eines laufenden Prozesses können sich unterscheiden.
hints.1.text: 'Vergleichen Sie die Datei mit der HTTP-Antwort.


  Prüfen Sie die mitgelieferten Eingaben und den Ausführungsumfang:


  ```sh

  ansible fleet -i inventory.ini --list-hosts

  cat rollout.yml

  ansible fleet -i inventory.ini -m ansible.builtin.command -a ''cat /srv/site/message''

  ```'
hints.2.text: 'Der Prozess hat seine Startnachricht zwischengespeichert. Eine geänderte Datei benötigt einen
  handler.


  Benachrichtigen Sie Reload banner von der Aufgabe copy und verwenden Sie dq-service reload in handler.


  Prüfen Sie das beobachtete Ergebnis:


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''curl -fsS http://127.0.0.1:8080''` — liefert
  north-ready vom HTTP-Verbraucher auf jedem verwalteten Host.'
debrief: Die Datei wurde geändert, aber der Prozess hat ihren alten Wert zwischengespeichert. Sie haben einen
  reload handler benachrichtigt und die Live-Antworten von HTTP überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe das Ergebnis auf jedem verwalteten Host überprüft.
diagnostics.http_1: 'Host app1: HTTP-Pfad / auf Port 8080 muss north-ready liefern.'
diagnostics.http_2: 'Host app2: HTTP-Pfad / auf Port 8080 muss north-ready liefern.'
diagnostics.http_3: 'Host app3: HTTP-Pfad / auf Port 8080 muss north-ready liefern.'
