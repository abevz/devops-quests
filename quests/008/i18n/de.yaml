title: Handler
brief: |-
  Die aktive Flottennachricht bleibt veraltet.

  Arbeiten Sie auf der Workstation in `~/quest` mit `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Anforderungen:**
  - HTTP auf jedem verwalteten Host (`app1`, `app2`, `app3`):
    - Port: `8080`.
    - Antwortinhalt: `north-ready`.

  **Selbstprüfung vor Check & finish:**
  - `ansible fleet -i inventory.ini --list-hosts` — listet app1, app2 und app3 auf.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'curl -fsS http://127.0.0.1:8080'` — liefert north-ready vom HTTP-Verbraucher auf jedem verwalteten Host.
stages.0.brief: Die aktiven HTTP-Verbraucher müssen die erforderliche Nachricht zeigen.
stages.0.objectives.0.text: HTTP auf Port `8080` liefert auf jedem verwalteten Host (`app1`, `app2`, `app3`) `north-ready`.
hints.0.text: Vergleichen Sie die Datei mit der HTTP-Antwort.
hints.1.text: Der Prozess hat seine Startnachricht zwischengespeichert. Eine geänderte Datei benötigt einen handler.
hints.2.text: Benachrichtigen Sie Reload banner von der Aufgabe copy und verwenden Sie dq-service reload in handler.
debrief: Die Datei wurde geändert, aber der Prozess hat ihren alten Wert zwischengespeichert. Sie haben einen reload
  handler benachrichtigt und die Live-Antworten von HTTP überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe das Ergebnis auf jedem verwalteten Host überprüft.
diagnostics.http_1: 'Host app1: HTTP-Pfad / auf Port 8080 muss north-ready liefern.'
diagnostics.http_2: 'Host app2: HTTP-Pfad / auf Port 8080 muss north-ready liefern.'
diagnostics.http_3: 'Host app3: HTTP-Pfad / auf Port 8080 muss north-ready liefern.'
