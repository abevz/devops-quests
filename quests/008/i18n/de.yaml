title: Handler
brief: 'Sie sind dem Betrieb SignalRail beigetreten. Die Live-Nachricht hat sich nach einem Rollout nicht
  geändert. Arbeiten Sie in ~/quest.. Bewahren Sie alle Änderungen in diesem Trainingsbereich auf.


  Eingänge in `~/quest`: `inventory.ini`, `ansible.cfg`, `rollout.yml`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur die bereitgestellten Dateien,
  vorinstallierten Bilder und privaten Dienste. Alle Änderungen müssen innerhalb dieser Bucht bleiben.


  Erste Erfolgskriterien: Die Live-HTTP-Banner auf allen drei Hosts geben north-ready zurück.'
stages.0.brief: 'Die Datei wurde geändert, aber die zwischengespeicherte Datei HTTP banner blieb alt.
  Verwenden Sie einen handler und überprüfen Sie, ob auf allen Live-Bannern north-ready angezeigt wird.


  Erfolgskriterium: Die Live-HTTP-Banner auf allen drei Hosts geben north-ready zurück.'
stages.0.objectives.0.text: Die Live-Banner HTTP auf allen drei Hosts geben north-ready zurück.
hints.0.text: Vergleichen Sie die Datei mit der HTTP-Antwort.
hints.1.text: Der Prozess hat seine Startnachricht zwischengespeichert. Eine geänderte Datei benötigt
  einen handler.
hints.2.text: Benachrichtigen Sie Reload banner von der Aufgabe copy und verwenden Sie dq-service reload
  in handler.
debrief: Die Datei wurde geändert, aber der Prozess hat ihren alten Wert zwischengespeichert. Sie haben
  einen reload handler benachrichtigt und die Live-Antworten von HTTP überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe das Ergebnis auf jedem verwalteten Host überprüft.
