title: Opiekunowie
brief: 'Dołączyłeś do operacji SignalRail. Wiadomość na żywo nie uległa zmianie po wdrożeniu. Pracuj w
  ~/quest. Wszystkie zmiany przechowuj w tej komorze szkoleniowej.


  Wejścia w `~/quest`: `inventory.ini`, `ansible.cfg`, `rollout.yml`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Wszystkie zmiany muszą pozostać w tej zatoce.


  Początkowe kryteria sukcesu: aktywne banery HTTP na wszystkich trzech hostach zwracają north-ready.'
stages.0.brief: 'Plik został zmieniony, ale buforowany plik HTTP banner pozostał stary. Użyj handler i
  sprawdź, czy wszystkie aktywne banery pokazują north-ready.


  Kryteria sukcesu: Aktywne banery HTTP na wszystkich trzech hostach zwracają north-ready.'
stages.0.objectives.0.text: Aktywne banery HTTP na wszystkich trzech hostach zwracają north-ready.
hints.0.text: Porównaj plik z odpowiedzią HTTP.
hints.1.text: Proces buforował swój komunikat startowy; zmieniony plik wymaga handler.
hints.2.text: Powiadom Przeładuj baner z zadania copy i użyj dq-service reload w handler.
debrief: Plik został zmieniony, ale proces buforował jego starą wartość. Powiadomiłeś reload handler i
  zweryfikowałeś odpowiedzi na żywo HTTP.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem wynik na każdym zarządzanym hoście.
