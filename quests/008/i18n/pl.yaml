title: Opiekunowie
brief: |-
  Aktywny komunikat na hostach pozostaje nieaktualny.

  Pracuj na workstation w `~/quest` z plikami `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Wymagania:**
  - HTTP na każdym zarządzanym hoście (`app1`, `app2`, `app3`):
    - Port: `8080`.
    - Treść odpowiedzi: `north-ready`.

  **Sprawdź przed Check & finish:**
  - `ansible fleet -i inventory.ini --list-hosts` — wymienia app1, app2 i app3.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'curl -fsS http://127.0.0.1:8080'` — zwraca north-ready od odbiorcy HTTP na każdym zarządzanym hoście.
stages.0.brief: Aktywni odbiorcy HTTP muszą pokazywać wymagany komunikat.
stages.0.objectives.0.text: HTTP na porcie `8080` zwraca `north-ready` na każdym zarządzanym hoście (`app1`, `app2`,
  `app3`).
hints.0.text: Porównaj plik z odpowiedzią HTTP.
hints.1.text: Proces buforował swój komunikat startowy; zmieniony plik wymaga handler.
hints.2.text: Powiadom Przeładuj baner z zadania copy i użyj dq-service reload w handler.
debrief: Plik został zmieniony, ale proces buforował jego starą wartość. Powiadomiłeś reload handler i zweryfikowałeś
  odpowiedzi na żywo HTTP.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem wynik na każdym zarządzanym hoście.
diagnostics.http_1: 'Host app1: ścieżka HTTP / na porcie 8080 musi zwracać north-ready.'
diagnostics.http_2: 'Host app2: ścieżka HTTP / na porcie 8080 musi zwracać north-ready.'
diagnostics.http_3: 'Host app3: ścieżka HTTP / na porcie 8080 musi zwracać north-ready.'
