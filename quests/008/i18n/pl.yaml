title: Opiekunowie
brief: "Aktywny komunikat na hostach pozostaje nieaktualny.\n\nPracuj na workstation w `~/quest` z plikami\
  \ `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n\n**Wymagania:**\n- Punkt HTTP jest dostępny na każdym\
  \ zarządzanym hoście (`app1`, `app2`, `app3`):\n  - Port: `8080`.\n- Treść odpowiedzi na każdym hoście to\
  \ `north-ready`.\n"
stages.0.brief: Aktywni odbiorcy HTTP muszą pokazywać wymagany komunikat.
stages.0.objectives.0.text: HTTP na porcie `8080` zwraca `north-ready` na każdym zarządzanym hoście (`app1`,
  `app2`, `app3`).
hints.0.text: Dostarczone pliki i odpowiedź działającego procesu mogą się różnić.
hints.1.text: 'Porównaj plik z odpowiedzią HTTP.


  Sprawdź dostarczone dane wejściowe i zakres wykonania:


  ```sh

  ansible fleet -i inventory.ini --list-hosts

  cat rollout.yml

  ansible fleet -i inventory.ini -m ansible.builtin.command -a ''cat /srv/site/message''

  ```'
hints.2.text: 'Proces buforował swój komunikat startowy; zmieniony plik wymaga handler.


  Powiadom Przeładuj baner z zadania copy i użyj dq-service reload w handler.


  Sprawdź obserwowany wynik:


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''curl -fsS http://127.0.0.1:8080''` — zwraca
  north-ready od odbiorcy HTTP na każdym zarządzanym hoście.'
debrief: Plik został zmieniony, ale proces buforował jego starą wartość. Powiadomiłeś reload handler i zweryfikowałeś
  odpowiedzi na żywo HTTP.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem wynik na każdym zarządzanym hoście.
diagnostics.http_1: 'Host app1: ścieżka HTTP / na porcie 8080 musi zwracać north-ready.'
diagnostics.http_2: 'Host app2: ścieżka HTTP / na porcie 8080 musi zwracać north-ready.'
diagnostics.http_3: 'Host app3: ścieżka HTTP / na porcie 8080 musi zwracać north-ready.'
