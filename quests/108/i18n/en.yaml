title: Kustomize overlays
brief: 'The base runs one board with retired configuration. The recovery Kustomize overlay generates ROUTE=north-108 but its
  replicas patch targets a nonexistent Deployment name. Correct only the overlay patch target to board, inspect kubectl kustomize
  overlays/recovery and apply that overlay. Keep the base reusable and the generator hash suffix enabled; the generated ConfigMap
  name must flow into the Pod environment reference. Recover two ready replicas on the original Deployment without hard-coding
  a separate route in the container.


  Quest files in `~/quest` (some appear in later stages): `base/board.json`, `base/kustomization.yaml`, `overlays/recovery/kustomization.yaml`,
  `original-deployment-uid`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services. Change only this
  bay.


  Use the supplied `base/board.json`, `base/kustomization.yaml`, `overlays/recovery/kustomization.yaml` and `original-deployment-uid`.
  Rendering the overlay must succeed; its first ConfigMap must have exactly `ROUTE: north-108` and a name beginning `route-`,
  and its Deployment must request two replicas. The live original Deployment UID must match `original-deployment-uid`, with
  two replicas and two ready. Its first container environment must be exactly one `ROUTE` entry referring to key `ROUTE` in
  the rendered ConfigMap; that live ConfigMap must contain exactly `ROUTE: north-108`. `board:8080` must return `north-108`.
  The name-prefix check alone does not prove a hash suffix, and current state does not prove the edit history or that the
  base stayed unchanged.'
debrief: The environment change was encoded in a reusable overlay, with generated configuration identity driving a real rollout.
stages.0.brief: The rendered overlay, original Deployment identity, live configuration and board response match the brief.
stages.0.objectives.0.text: The rendered overlay, original Deployment identity, live configuration and board response match
  the brief.
hints.0.text: A patch can miss its intended resource when the target name is wrong.
hints.1.text: Inspect rendered output before applying an overlay.
hints.2.text: Fix the target in the overlay; let the generator update the environment reference and rollout.
phrases.0: I inspected rendered Kustomize output before applying it.
phrases.1: I kept environment differences outside the reusable base.
phrases.2: I verified the generated configuration reference and live response.
questions.0.points.0: No; it renders resources before they are sent to the API.
questions.0.points.1: A separate reconciler is needed for continuous desired-state enforcement.
questions.0.prompt: Does Kustomize run as a server-side controller?
questions.1.points.0: The generated name changes, and Kustomize updates the Pod template reference.
questions.1.points.1: A changed Deployment Pod template creates a new revision.
questions.1.prompt: Why can a generated ConfigMap hash trigger a rollout?
