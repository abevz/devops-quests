title: Kustomize overlays
brief: 'The recovery environment is not reaching the required scale and route. Preserve the original Deployment
  with consistent rendered and live configuration.


  Work in `~/quest` on the workstation. Supplied files: `base/board.yaml`, `base/kustomization.yaml`, `overlays/recovery/kustomization.yaml`.


  **Requirements:**

  - The recovery overlay in `~/quest/overlays/recovery` on the workstation renders two application replicas
  and only the required route value, `north-108`, in the generated configuration.

  - The original Deployment `board` has exactly two replicas, both ready, and receives only the required route
  setting from the same generated configuration in the cluster.

  - From `deployment/board`, HTTP `http://board:8080` returns `north-108`.


  A name prefix does not prove a hash suffix, edit history or that the base stayed unchanged.

  '
debrief: The environment change was encoded in a reusable overlay, with generated configuration identity driving
  a real rollout.
stages.0.brief: The original Deployment must serve the required route with the rendered recovery configuration.
hints.0.text: A patch can miss its intended resource when the target name is wrong.
hints.1.text: 'Inspect rendered output before applying an overlay.


  Inspect the supplied definitions, current resources and events.


  ```sh

  cat overlays/recovery/kustomization.yaml

  kubectl kustomize overlays/recovery

  kubectl get deployment board -o yaml

  kubectl get configmaps -o yaml

  ```'
hints.2.text: 'Fix the target in the overlay; let the generator update the environment reference and rollout. The supplied patch targets a nonexistent Deployment; use board as its target and apply overlays/recovery. Keep the base reusable and generator hash suffix enabled.


  Verify the observed result:


  ```sh

  kubectl get deployment board

  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080

  ```


  Expect two ready replicas and HTTP response north-108 from the original Deployment using the generated recovery configuration.


  Supplied constraints and details: Overlay `overlays/recovery` in `~/quest` on the workstation renders successfully: Deployment replicas `2`, and a ConfigMap with prefix `route-` containing only `ROUTE` with value `north-108`. The original Deployment `board` keeps exactly `2` replicas, both ready; its application container declares only `ROUTE` from the rendered ConfigMap, whose live data is only `ROUTE` with value `north-108`.'
phrases.0: I inspected rendered Kustomize output before applying it.
phrases.1: I kept environment differences outside the reusable base.
phrases.2: I verified the generated configuration reference and live response.
questions.0.points.0: No; it renders resources before they are sent to the API.
questions.0.points.1: A separate reconciler is needed for continuous desired-state enforcement.
questions.0.prompt: Does Kustomize run as a server-side controller?
questions.1.points.0: The generated name changes, and Kustomize updates the Pod template reference.
questions.1.points.1: A changed Deployment Pod template creates a new revision.
questions.1.prompt: Why can a generated ConfigMap hash trigger a rollout?
stages.0.objectives.0.text: The recovery overlay in `~/quest/overlays/recovery` on the workstation renders
  two application replicas and only the required route value, `north-108`, in the generated configuration.
stages.0.objectives.1.text: The original Deployment `board` has exactly two replicas, both ready, and receives
  only the required route setting from the same generated configuration in the cluster.
stages.0.objectives.2.text: From `deployment/board`, HTTP `http://board:8080` returns `north-108`.
diagnostics.render: The recovery overlay may point at a missing base or have an invalid patch target. Render it locally and inspect the first Kustomize error before applying it. [Cause and check](guides#guide=release-overlays&section=q108-overlay-render)
diagnostics.cm_data: The rendered worker may still reference the base ConfigMap or the generated data may differ. Follow its ROUTE reference and check that the referenced map contains exactly ROUTE=north-108. [Cause and check](guides#guide=release-overlays&section=q108-rendered-route-map)
diagnostics.cm_name: The overlay may reference a static name or the generated name may not be propagated. Inspect which map the rendered worker references and check that its name starts with route-. [Cause and check](guides#guide=release-overlays&section=q108-rendered-generated-map-name)
diagnostics.rendered_replicas: The overlay patch may target an object other than Deployment board. Check that the render contains exactly one board Deployment and two desired replicas. [Cause and check](guides#guide=release-overlays&section=q108-rendered-replica-count)
diagnostics.uid: Replacing board instead of updating it may have permanently changed its UID. Compare the live UID with the frozen original before applying the overlay to the existing object. [Cause and check](guides#guide=release-overlays&section=q108-original-live-deployment)
diagnostics.live_replicas: The overlay can render correctly while the live board still has the old desired count. Apply the corrected overlay and confirm two replicas in its live specification. [Cause and check](guides#guide=release-overlays&section=q108-applied-replica-count)
diagnostics.ready: The desired replicas may have been applied but the Pods are still starting or blocked by unavailable inputs. Inspect the Pods and wait for exactly two ready board replicas. [Cause and check](guides#guide=release-overlays&section=q108-applied-ready-replicas)
diagnostics.env: The live worker may still inject a literal or reference the old generated map name. Inspect its single ROUTE entry and point it at key ROUTE in the currently rendered ConfigMap. [Cause and check](guides#guide=release-overlays&section=q108-live-worker-route-reference)
diagnostics.live_data: The current generated ConfigMap may be missing from the cluster or carry stale data. Compare the live map matching the current render with the exact ROUTE=north-108 payload. [Cause and check](guides#guide=release-overlays&section=q108-applied-route-map-data)
diagnostics.http: The API objects may be correct while the Service still reaches an old or unavailable Pod. Read the actual response from board after rollout and compare with north-108. [Cause and check](guides#guide=release-overlays&section=q108-service-rollout-response)
diagnostics.probe_0_0: The render observer may stop before identifying a field when its input path or local tools cannot be used. Check the overlay path and render from the workstation. [Cause and check](guides#guide=release-overlays&section=q108-overlay-render-observer-input)
diagnostics.probe_0_1: The live observer may stop before comparing the applied objects when it cannot render the overlay or access the workspace. Verify the render and both local and cluster access. [Cause and check](guides#guide=release-overlays&section=q108-applied-overlay-observer-input)
