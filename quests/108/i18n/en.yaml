title: Kustomize overlays
brief: "The recovery environment is not reaching the required scale and route. Preserve the original Deployment\
  \ with consistent rendered and live configuration.\n\nWork in `~/quest` on the workstation. Supplied files: `base/board.json`,\
  \ `base/kustomization.yaml`, `overlays/recovery/kustomization.yaml`, `original-deployment-uid`.\n\n**Requirements:**\n\
  - Deployment `board` retains its original UID from `/run/dq/facts/0/original-deployment-uid` on the workstation.\n\
  - The Kustomize overlay `overlays/recovery` in `~/quest` on the workstation renders successfully.\n- The rendered\
  \ ConfigMap contains only `ROUTE` with value `north-108`.\n- The rendered ConfigMap name starts with `route-`.\n\
  - Overlay `overlays/recovery`:\n  - rendered Deployment replicas `2`.\n- Deployment `board`:\n  - replicas `2`.\n\
  - Deployment `board`:\n  - ready replicas `2`.\n- The application container of Deployment `board` exposes only\
  \ `ROUTE`, sourced from key `ROUTE` in the rendered ConfigMap rather than an embedded value.\n- That live ConfigMap\
  \ contains only `ROUTE` with value `north-108`.\n- From `deployment/board`, HTTP `http://board:8080` returns `north-108`.\n\
  \n**Verify yourself before Check & finish:**\nRun these observation commands from `~/quest` on the workstation;\
  \ `kubectl exec` observes the named workload container.\n- `kubectl kustomize overlays/recovery` — The rendered\
  \ ConfigMap and Deployment match Requirements.\n- Settings, identity and status match Requirements.\n\n  ```sh\n\
  \  kubectl get deployment board -o yaml\n  name=$(kubectl get deployment board -o jsonpath='{.spec.template.spec.containers[0].env[0].valueFrom.configMapKeyRef.name}')\n\
  \  kubectl get configmap \"$name\" -o yaml\n  cat /run/dq/facts/0/original-deployment-uid\n  ```\n- `kubectl exec\
  \ deployment/board -- wget -qO- -T 3 http://board:8080` — The consumer receives `north-108`.\n\nA name prefix\
  \ does not prove a hash suffix, edit history or that the base stayed unchanged.\n"
debrief: The environment change was encoded in a reusable overlay, with generated configuration identity driving
  a real rollout.
stages.0.brief: 'The original Deployment must serve the required route with the rendered recovery configuration.

  '
hints.0.text: A patch can miss its intended resource when the target name is wrong.
hints.1.text: Inspect rendered output before applying an overlay.
hints.2.text: 'Fix the target in the overlay; let the generator update the environment reference and rollout. The
  supplied patch targets a nonexistent Deployment; use board as its target and apply overlays/recovery. Keep the
  base reusable and generator hash suffix enabled.

  '
phrases.0: I inspected rendered Kustomize output before applying it.
phrases.1: I kept environment differences outside the reusable base.
phrases.2: I verified the generated configuration reference and live response.
questions.0.points.0: No; it renders resources before they are sent to the API.
questions.0.points.1: A separate reconciler is needed for continuous desired-state enforcement.
questions.0.prompt: Does Kustomize run as a server-side controller?
questions.1.points.0: The generated name changes, and Kustomize updates the Pod template reference.
questions.1.points.1: A changed Deployment Pod template creates a new revision.
questions.1.prompt: Why can a generated ConfigMap hash trigger a rollout?
