title: Kustomize overlays
brief: 'The base runs one board with retired configuration. The recovery Kustomize overlay generates ROUTE=north-108
  but its replicas patch targets a nonexistent Deployment name. Correct only the overlay patch target
  to board, inspect kubectl kustomize overlays/recovery and apply that overlay. Keep the base reusable
  and the generator hash suffix enabled; the generated ConfigMap name must flow into the Pod environment
  reference. Recover two ready replicas on the original Deployment without hard-coding a separate route
  in the container.


  Quest files in `~/quest` (some appear in later stages): `base/board.json`, `base/kustomization.yaml`,
  `overlays/recovery/kustomization.yaml`, `original-deployment-uid`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: The overlay renders two replicas and a hashed route ConfigMap; the original
  live Deployment references that generated name and serves north-108.'
debrief: The environment change was encoded in a reusable overlay, with generated configuration identity
  driving a real rollout.
