title: Kustomize overlays
brief: 'The recovery environment is not reaching the required scale and route. Preserve the original Deployment
  with consistent rendered and live configuration.


  Work in `~/quest` on the workstation. Supplied files: `base/board.yaml`, `base/kustomization.yaml`, `overlays/recovery/kustomization.yaml`.


  **Requirements:**

  - The recovery overlay in `~/quest/overlays/recovery` on the workstation renders two application replicas
  and only the required route value, `north-108`, in the generated configuration.

  - The original Deployment `board` has exactly two replicas, both ready, and receives only the required route
  setting from the same generated configuration in the cluster.

  - From `deployment/board`, HTTP `http://board:8080` returns `north-108`.


  A name prefix does not prove a hash suffix, edit history or that the base stayed unchanged.

  '
debrief: The environment change was encoded in a reusable overlay, with generated configuration identity driving
  a real rollout.
stages.0.brief: The original Deployment must serve the required route with the rendered recovery configuration.
hints.0.text: A patch can miss its intended resource when the target name is wrong.
hints.1.text: 'Inspect rendered output before applying an overlay.


  Inspect the supplied definitions, current resources and events.


  ```sh

  cat overlays/recovery/kustomization.yaml

  kubectl kustomize overlays/recovery

  kubectl get deployment board -o yaml

  kubectl get configmaps -o yaml

  ```'
hints.2.text: 'Fix the target in the overlay; let the generator update the environment reference and rollout. The supplied patch targets a nonexistent Deployment; use board as its target and apply overlays/recovery. Keep the base reusable and generator hash suffix enabled.


  Verify the observed result:


  ```sh

  kubectl get deployment board

  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080

  ```


  Expect two ready replicas and HTTP response north-108 from the original Deployment using the generated recovery configuration.


  Supplied constraints and details: Overlay `overlays/recovery` in `~/quest` on the workstation renders successfully: Deployment replicas `2`, and a ConfigMap with prefix `route-` containing only `ROUTE` with value `north-108`. The original Deployment `board` keeps exactly `2` replicas, both ready; its application container declares only `ROUTE` from the rendered ConfigMap, whose live data is only `ROUTE` with value `north-108`.'
phrases.0: I inspected rendered Kustomize output before applying it.
phrases.1: I kept environment differences outside the reusable base.
phrases.2: I verified the generated configuration reference and live response.
questions.0.points.0: No; it renders resources before they are sent to the API.
questions.0.points.1: A separate reconciler is needed for continuous desired-state enforcement.
questions.0.prompt: Does Kustomize run as a server-side controller?
questions.1.points.0: The generated name changes, and Kustomize updates the Pod template reference.
questions.1.points.1: A changed Deployment Pod template creates a new revision.
questions.1.prompt: Why can a generated ConfigMap hash trigger a rollout?
