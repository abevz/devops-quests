title: Superposiciones Kustomize
brief: 'El entorno de recuperación no alcanza la escala y ruta requeridas. Conserva el Deployment original
  con configuración renderizada y activa coherente.


  Trabaja en `~/quest` en la workstation. Archivos suministrados: `base/board.yaml`, `base/kustomization.yaml`,
  `overlays/recovery/kustomization.yaml`.


  **Requisitos:**

  - El overlay de recuperación en `~/quest/overlays/recovery` de la estación de trabajo renderiza dos réplicas
  de aplicación y solo el valor de ruta requerido, `north-108`, en la configuración generada.

  - El Deployment `board` original tiene exactamente dos réplicas listas y recibe solo el ajuste de ruta requerido
  desde la misma configuración generada en el clúster.

  - Desde `deployment/board`, HTTP `http://board:8080` devuelve `north-108`.


  Un prefijo de nombre no demuestra un sufijo hash, el historial ni que la base siga intacta.

  '
debrief: El cambio de entorno se codificó en un overlay reutilizable, y la configuración generada identity
  impulsó una implementación real.
stages.0.brief: El Deployment original debe servir la ruta requerida con la configuración de recuperación renderizada.
hints.0.text: Un parche puede perder el recurso previsto cuando el nombre de destino es incorrecto.
hints.1.text: 'Inspeccione la salida renderizada antes de aplicar un overlay.


  Inspecciona las definiciones suministradas, los recursos actuales y los eventos.


  ```sh

  cat overlays/recovery/kustomization.yaml

  kubectl kustomize overlays/recovery

  kubectl get deployment board -o yaml

  kubectl get configmaps -o yaml

  ```'
hints.2.text: 'Corrige el destino del overlay; deja que el generador actualice la referencia de entorno y el rollout. El patch suministrado apunta a un Deployment inexistente; usa board como destino y aplica overlays/recovery. Mantén la base reutilizable y el sufijo hash del generador activado.


  Verifica el resultado observado:


  ```sh

  kubectl get deployment board

  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080

  ```


  Se esperan dos réplicas listas y la respuesta HTTP north-108 del Deployment original con la configuración de recuperación generada.


  Restricciones y detalles suministrados: El overlay `overlays/recovery` en `~/quest` en la workstation se renderiza correctamente: réplicas de Deployment `2` y un ConfigMap con prefijo `route-` que contiene solo `ROUTE` con valor `north-108`. El Deployment `board` original conserva exactamente `2` réplicas, ambas listas; su contenedor de aplicación declara solo `ROUTE` del ConfigMap renderizado, cuyos datos activos contienen solo `ROUTE` con valor `north-108`.'
phrases.0: Inspeccioné la salida renderizada de Kustomize antes de aplicarla.
phrases.1: Mantuve las diferencias ambientales fuera del base reutilizable.
phrases.2: Verifiqué la referencia de configuración generada y la respuesta en vivo.
questions.0.points.0: No; procesa recursos antes de que se envíen al API.
questions.0.points.1: Se necesita un reconciler separado para la aplicación continua del estado deseado.
questions.0.prompt: ¿Kustomize se ejecuta como controlador del lado del servidor?
questions.1.points.0: El nombre generado cambia y Kustomize actualiza la referencia de plantilla Pod.
questions.1.points.1: Una plantilla Deployment Pod modificada crea una nueva revisión.
questions.1.prompt: ¿Por qué un ConfigMap hash generado puede desencadenar un rollout?
