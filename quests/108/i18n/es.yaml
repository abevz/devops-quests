title: Superposiciones Kustomize
brief: 'La base ejecuta un board con configuración retirada. El overlay recovery de Kustomize genera ROUTE=north-108, pero
  su patch de réplicas apunta a un Deployment inexistente. Corrige solo el destino del patch del overlay a board, inspecciona
  kubectl kustomize overlays/recovery y aplica el overlay. Mantén la base reutilizable y el sufijo hash del generador activado;
  el nombre generado del ConfigMap debe llegar a la referencia de entorno del Pod. Recupera dos réplicas listas en el Deployment
  original sin fijar otra ruta en el contenedor.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `base/board.json`, `base/kustomization.yaml`,
  `overlays/recovery/kustomization.yaml`, `original-deployment-uid`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas y servicios
  privados. Cambie sólo esta bahía.


  Usa los archivos proporcionados `base/board.json`, `base/kustomization.yaml`, `overlays/recovery/kustomization.yaml` y `original-deployment-uid`.
  El renderizado del overlay debe tener éxito; su primer ConfigMap debe tener exactamente `ROUTE: north-108` y nombre que
  empiece por `route-`, y su Deployment debe pedir dos réplicas. El UID del Deployment original activo debe coincidir con
  `original-deployment-uid`, con dos réplicas y dos listas. El entorno del primer contenedor debe tener exactamente una entrada
  `ROUTE` que refiera a la clave `ROUTE` del ConfigMap renderizado; ese ConfigMap activo debe contener exactamente `ROUTE:
  north-108`. `board:8080` debe devolver `north-108`. Comprobar solo el prefijo no demuestra un sufijo hash, y el estado actual
  no demuestra el historial de edición ni que la base no cambiara.'
debrief: El cambio de entorno se codificó en un overlay reutilizable, y la configuración generada identity impulsó una implementación
  real.
stages.0.brief: El overlay renderizado, identidad original del Deployment, configuración activa y respuesta board coinciden
  con la descripción.
stages.0.objectives.0.text: El overlay renderizado, identidad original del Deployment, configuración activa y respuesta board
  coinciden con la descripción.
hints.0.text: Un parche puede perder el recurso previsto cuando el nombre de destino es incorrecto.
hints.1.text: Inspeccione la salida renderizada antes de aplicar un overlay.
hints.2.text: Fije el objetivo en el overlay; deje que el generador actualice el entorno reference y rollout.
phrases.0: Inspeccioné la salida renderizada de Kustomize antes de aplicarla.
phrases.1: Mantuve las diferencias ambientales fuera del base reutilizable.
phrases.2: Verifiqué la referencia de configuración generada y la respuesta en vivo.
questions.0.points.0: No; procesa recursos antes de que se envíen al API.
questions.0.points.1: Se necesita un reconciler separado para la aplicación continua del estado deseado.
questions.0.prompt: ¿Kustomize se ejecuta como controlador del lado del servidor?
questions.1.points.0: El nombre generado cambia y Kustomize actualiza la referencia de plantilla Pod.
questions.1.points.1: Una plantilla Deployment Pod modificada crea una nueva revisión.
questions.1.prompt: ¿Por qué un ConfigMap hash generado puede desencadenar un rollout?
