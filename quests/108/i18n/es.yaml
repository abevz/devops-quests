title: Superposiciones Kustomize
brief: "El entorno de recuperación no alcanza la escala y ruta requeridas. Conserva el Deployment original con configuración\
  \ renderizada y activa coherente.\n\nTrabaja en `~/quest` en la workstation. Archivos suministrados: `base/board.json`,\
  \ `base/kustomization.yaml`, `overlays/recovery/kustomization.yaml`, `original-deployment-uid`.\n\n**Requisitos:**\n\
  - El Deployment `board` conserva su UID original de `/run/dq/facts/0/original-deployment-uid` en la workstation.\n\
  - El overlay Kustomize `overlays/recovery` en `~/quest` en la workstation se renderiza correctamente.\n- El ConfigMap\
  \ renderizado contiene solo `ROUTE` con valor `north-108`.\n- El nombre del ConfigMap renderizado empieza por\
  \ `route-`.\n- Overlay `overlays/recovery`:\n  - réplicas del Deployment renderizado `2`.\n- Deployment `board`:\n\
  \  - réplicas `2`.\n- Deployment `board`:\n  - réplicas listas `2`.\n- El contenedor de aplicación del Deployment\
  \ `board` expone solo `ROUTE`, procedente de la clave `ROUTE` del ConfigMap renderizado y no de un valor incrustado.\n\
  - Ese ConfigMap activo contiene solo `ROUTE` con valor `north-108`.\n- Desde `deployment/board`, HTTP `http://board:8080`\
  \ devuelve `north-108`.\n\n**Verifica antes de Check & finish:**\nEjecuta estos comandos de observación desde\
  \ `~/quest` en la workstation; `kubectl exec` observa el contenedor de la carga indicada.\n- `kubectl kustomize\
  \ overlays/recovery` — El ConfigMap y Deployment renderizados coinciden con Requisitos.\n- Los ajustes, la identidad\
  \ y el estado coinciden con Requisitos.\n\n  ```sh\n  kubectl get deployment board -o yaml\n  name=$(kubectl get\
  \ deployment board -o jsonpath='{.spec.template.spec.containers[0].env[0].valueFrom.configMapKeyRef.name}')\n\
  \  kubectl get configmap \"$name\" -o yaml\n  cat /run/dq/facts/0/original-deployment-uid\n  ```\n- `kubectl exec\
  \ deployment/board -- wget -qO- -T 3 http://board:8080` — El consumidor recibe `north-108`.\n\nUn prefijo de nombre\
  \ no demuestra un sufijo hash, el historial ni que la base siga intacta.\n"
debrief: El cambio de entorno se codificó en un overlay reutilizable, y la configuración generada identity impulsó
  una implementación real.
stages.0.brief: 'El Deployment original debe servir la ruta requerida con la configuración de recuperación renderizada.

  '
hints.0.text: Un parche puede perder el recurso previsto cuando el nombre de destino es incorrecto.
hints.1.text: Inspeccione la salida renderizada antes de aplicar un overlay.
hints.2.text: 'Corrige el destino del overlay; deja que el generador actualice la referencia de entorno y el rollout.
  El patch suministrado apunta a un Deployment inexistente; usa board como destino y aplica overlays/recovery. Mantén
  la base reutilizable y el sufijo hash del generador activado.

  '
phrases.0: Inspeccioné la salida renderizada de Kustomize antes de aplicarla.
phrases.1: Mantuve las diferencias ambientales fuera del base reutilizable.
phrases.2: Verifiqué la referencia de configuración generada y la respuesta en vivo.
questions.0.points.0: No; procesa recursos antes de que se envíen al API.
questions.0.points.1: Se necesita un reconciler separado para la aplicación continua del estado deseado.
questions.0.prompt: ¿Kustomize se ejecuta como controlador del lado del servidor?
questions.1.points.0: El nombre generado cambia y Kustomize actualiza la referencia de plantilla Pod.
questions.1.points.1: Una plantilla Deployment Pod modificada crea una nueva revisión.
questions.1.prompt: ¿Por qué un ConfigMap hash generado puede desencadenar un rollout?
