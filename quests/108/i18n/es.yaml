title: Superposiciones Kustomize
brief: 'El base ejecuta un board con configuración retired. El recovery Kustomize overlay genera ROUTE=north-108
  pero su replicas patch apunta a un nombre Deployment inexistente. Corrija solo el objetivo overlay patch
  a board, inspect kubectl kustomize overlays/recovery y aplique eso overlay. Mantenga el base reutilizable
  y el generador hash suffix habilitado; el nombre ConfigMap generado debe fluir hacia la referencia del
  entorno Pod. Recupere dos replicas listos en el Deployment original sin codificar un route separado
  en el contenedor.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `base/board.json`, `base/kustomization.yaml`,
  `overlays/recovery/kustomization.yaml`, `original-deployment-uid`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: overlay representa dos replicas y un route ConfigMap con hash; las referencias
  originales en vivo Deployment que generaron el nombre y sirven a north-108.'
debrief: El cambio de entorno se codificó en un overlay reutilizable, y la configuración generada identity
  impulsó una implementación real.
