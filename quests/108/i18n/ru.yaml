title: Наложения Kustomize
brief: 'База запускает один board с устаревшей конфигурацией. Overlay recovery Kustomize создаёт ROUTE=north-108, но patch
  числа реплик указывает на несуществующий Deployment. Исправьте только цель patch в overlay на board, изучите kubectl kustomize
  overlays/recovery и примените overlay. Сохраните базу пригодной для повторного использования и включённый hash-суффикс генератора;
  имя созданной ConfigMap должно попасть в ссылку окружения Pod. Восстановите две готовые реплики исходного Deployment без
  жёстко заданного отдельного маршрута в контейнере.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `base/board.json`, `base/kustomization.yaml`, `overlays/recovery/kustomization.yaml`,
  `original-deployment-uid`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы и приватные сервисы.
  Менять можно только эту песочницу.


  Используйте выданные `base/board.json`, `base/kustomization.yaml`, `overlays/recovery/kustomization.yaml` и `original-deployment-uid`.
  Рендеринг overlay должен завершиться успешно; первая ConfigMap должна содержать ровно `ROUTE: north-108` и имя с началом
  `route-`, а Deployment — запрашивать две реплики. UID исходного работающего Deployment должен совпадать с `original-deployment-uid`,
  число реплик и готовых реплик — два. Окружение первого контейнера должно содержать ровно одну запись `ROUTE`, ссылающуюся
  на ключ `ROUTE` отрендеренной ConfigMap; действующая ConfigMap должна содержать ровно `ROUTE: north-108`. `board:8080` должен
  вернуть `north-108`. Проверка префикса сама по себе не доказывает суффикс hash, а текущее состояние — историю изменений
  или неизменность базы.'
debrief: Изменение окружения выражено переиспользуемым overlay; identity созданной конфигурации вызвала реальную выкатку.
stages.0.brief: Отрендеренный overlay, исходная идентичность Deployment, действующая конфигурация и ответ board соответствуют
  описанию.
stages.0.objectives.0.text: Отрендеренный overlay, исходная идентичность Deployment, действующая конфигурация и ответ board
  соответствуют описанию.
hints.0.text: Patch может не выбрать нужный ресурс из-за неверного target name.
hints.1.text: Изучайте результат render до применения overlay.
hints.2.text: Исправьте target в overlay; генератор обновит env reference и запустит rollout.
phrases.0: Я изучил результат Kustomize до применения.
phrases.1: Я сохранил различия окружений вне переиспользуемого base.
phrases.2: Я проверил ссылку на созданную конфигурацию и реальный ответ.
questions.0.points.0: 'Нет: он формирует ресурсы до отправки в API.'
questions.0.points.1: Для постоянного согласования desired state нужен отдельный reconciler.
questions.0.prompt: Работает ли Kustomize как серверный контроллер?
questions.1.points.0: Имя меняется, и Kustomize обновляет ссылку в шаблоне Pod.
questions.1.points.1: Изменённый шаблон Pod Deployment создаёт новую ревизию.
questions.1.prompt: Почему hash созданного ConfigMap может вызвать rollout?
