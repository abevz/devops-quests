title: Наложения Kustomize
brief: 'Base запускает одно табло с устаревшей конфигурацией. Overlay recovery Kustomize создаёт ROUTE=north-108,
  но patch replicas выбирает несуществующий Deployment. Исправьте только target patch в overlay на board,
  изучите kubectl kustomize overlays/recovery и примените overlay. Сохраните переиспользуемый base и hash
  suffix генератора; имя созданного ConfigMap должно перейти в ссылку env Pod. Восстановите две готовые
  реплики исходного Deployment без отдельной подстановки маршрута в контейнер.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `base/board.json`, `base/kustomization.yaml`,
  `overlays/recovery/kustomization.yaml`, `original-deployment-uid`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Overlay выводит две реплики и ConfigMap с hash; исходный Deployment ссылается на
  созданное имя и отдаёт north-108.'
debrief: Изменение окружения выражено переиспользуемым overlay; identity созданной конфигурации вызвала
  реальную выкатку.
stages.0.brief: 'Overlay выводит две реплики и ConfigMap с hash; исходный Deployment ссылается на созданное
  имя и отдаёт north-108.


  Результат проверки: Overlay выводит две реплики и ConfigMap с hash; исходный Deployment ссылается на
  созданное имя и отдаёт north-108.'
stages.0.objectives.0.text: Overlay выводит две реплики и ConfigMap с hash; исходный Deployment ссылается
  на созданное имя и отдаёт north-108.
hints.0.text: Patch может не выбрать нужный ресурс из-за неверного target name.
hints.1.text: Изучайте результат render до применения overlay.
hints.2.text: Исправьте target в overlay; генератор обновит env reference и запустит rollout.
phrases.0: Я изучил результат Kustomize до применения.
phrases.1: Я сохранил различия окружений вне переиспользуемого base.
phrases.2: Я проверил ссылку на созданную конфигурацию и реальный ответ.
questions.0.points.0: 'Нет: он формирует ресурсы до отправки в API.'
questions.0.points.1: Для постоянного согласования desired state нужен отдельный reconciler.
questions.0.prompt: Работает ли Kustomize как серверный контроллер?
questions.1.points.0: Имя меняется, и Kustomize обновляет ссылку в шаблоне Pod.
questions.1.points.1: Изменённый шаблон Pod Deployment создаёт новую ревизию.
questions.1.prompt: Почему hash созданного ConfigMap может вызвать rollout?
