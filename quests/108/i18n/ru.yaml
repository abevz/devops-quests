title: Наложения Kustomize
brief: 'Среда восстановления не достигает требуемого масштаба и маршрута. Сохраните исходный Deployment с согласованными
  отрендеренной и живой конфигурациями.


  Работайте в `~/quest` на workstation. Предоставленные файлы: `base/board.yaml`, `base/kustomization.yaml`,
  `overlays/recovery/kustomization.yaml`.


  **Требования:**

  - Recovery-overlay в `~/quest/overlays/recovery` на рабочей станции рендерит две реплики приложения и только
  требуемое значение маршрута `north-108` в сгенерированной конфигурации.

  - Исходный Deployment `board` имеет ровно две готовые реплики и получает только требуемую настройку маршрута
  из той же сгенерированной конфигурации в кластере.

  - Из `deployment/board` HTTP `http://board:8080` возвращает `north-108`.


  Префикс имени не доказывает суффикс хеша, историю изменений или неизменность base.

  '
debrief: Изменение окружения выражено переиспользуемым overlay; identity созданной конфигурации вызвала реальную
  выкатку.
stages.0.brief: Исходный Deployment должен обслуживать требуемый маршрут с отрендеренной конфигурацией восстановления.
hints.0.text: Patch может не выбрать нужный ресурс из-за неверного target name.
hints.1.text: 'Изучайте результат render до применения overlay.


  Изучите поставленные определения, текущие ресурсы и события.


  ```sh

  cat overlays/recovery/kustomization.yaml

  kubectl kustomize overlays/recovery

  kubectl get deployment board -o yaml

  kubectl get configmaps -o yaml

  ```'
hints.2.text: 'Исправьте цель в оверлее; дайте генератору обновить ссылку окружения и rollout. Исходный patch указывает несуществующий Deployment; используйте board как цель и примените overlays/recovery. Сохраните переиспользуемую base и включённый суффикс хеша генератора.


  Проверьте наблюдаемый результат:


  ```sh

  kubectl get deployment board

  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080

  ```


  Ожидаются две готовые реплики и HTTP-ответ north-108 от исходного Deployment со сгенерированной recovery-конфигурацией.


  Поставленные ограничения и подробности: Оверлей `overlays/recovery` в `~/quest` на workstation успешно рендерится: реплики Deployment `2` и ConfigMap с префиксом `route-`, содержащий только `ROUTE` со значением `north-108`. Исходный Deployment `board` сохраняет ровно `2` реплики, обе готовы; его контейнер приложения объявляет только `ROUTE` из отрендеренного ConfigMap, чьи живые данные содержат только `ROUTE` со значением `north-108`.'
phrases.0: Я изучил результат Kustomize до применения.
phrases.1: Я сохранил различия окружений вне переиспользуемого base.
phrases.2: Я проверил ссылку на созданную конфигурацию и реальный ответ.
questions.0.points.0: 'Нет: он формирует ресурсы до отправки в API.'
questions.0.points.1: Для постоянного согласования desired state нужен отдельный reconciler.
questions.0.prompt: Работает ли Kustomize как серверный контроллер?
questions.1.points.0: Имя меняется, и Kustomize обновляет ссылку в шаблоне Pod.
questions.1.points.1: Изменённый шаблон Pod Deployment создаёт новую ревизию.
questions.1.prompt: Почему hash созданного ConfigMap может вызвать rollout?
stages.0.objectives.0.text: Recovery-overlay в `~/quest/overlays/recovery` на рабочей станции рендерит две
  реплики приложения и только требуемое значение маршрута `north-108` в сгенерированной конфигурации.
stages.0.objectives.1.text: Исходный Deployment `board` имеет ровно две готовые реплики и получает только требуемую
  настройку маршрута из той же сгенерированной конфигурации в кластере.
stages.0.objectives.2.text: Из `deployment/board` HTTP `http://board:8080` возвращает `north-108`.
diagnostics.render: Recovery overlay мог ссылаться на отсутствующую базу или иметь неверную цель патча. Отрендерите его локально и разберите первую ошибку Kustomize перед применением. [Причина и проверка](guides#guide=release-overlays&section=q108-overlay-render)
diagnostics.cm_data: Отрендеренный worker мог ссылаться на ConfigMap из базы, либо данные отличаются. Проследите ссылку ROUTE и проверьте, что в указанной карте ровно ROUTE=north-108. [Причина и проверка](guides#guide=release-overlays&section=q108-rendered-route-map)
diagnostics.cm_name: Overlay мог сослаться на статичное имя, либо сгенерированное имя не попало в ссылку. Проверьте, какую карту использует отрендеренный worker и начинается ли её имя с route-. [Причина и проверка](guides#guide=release-overlays&section=q108-rendered-generated-map-name)
diagnostics.rendered_replicas: Патч overlay мог выбрать другой объект. Убедитесь, что в результате есть ровно один Deployment board с двумя желаемыми репликами. [Причина и проверка](guides#guide=release-overlays&section=q108-rendered-replica-count)
diagnostics.uid: Замена board вместо обновления могла навсегда изменить UID. Перед применением overlay к существующему объекту сравните текущий UID с исходным. [Причина и проверка](guides#guide=release-overlays&section=q108-original-live-deployment)
diagnostics.live_replicas: Overlay может рендериться верно, пока у board старое желаемое число реплик. Примените исправленный overlay и проверьте две реплики в спецификации. [Причина и проверка](guides#guide=release-overlays&section=q108-applied-replica-count)
diagnostics.ready: Желаемое число реплик уже могло примениться, но Pod ещё запускаются или ждут входных данных. Проверьте Pod и дождитесь ровно двух готовых реплик board. [Причина и проверка](guides#guide=release-overlays&section=q108-applied-ready-replicas)
diagnostics.env: В кластере worker мог сохранить литерал или ссылаться на старое имя карты. Проверьте единственную запись ROUTE и свяжите её с ключом ROUTE в текущем отрендеренном ConfigMap. [Причина и проверка](guides#guide=release-overlays&section=q108-live-worker-route-reference)
diagnostics.live_data: Текущий сгенерированный ConfigMap мог отсутствовать в кластере или содержать старые данные. Сверьте карту из текущего рендера с точным содержимым ROUTE=north-108. [Причина и проверка](guides#guide=release-overlays&section=q108-applied-route-map-data)
diagnostics.http: Объекты API могут быть верными, пока Service ведёт к старому или недоступному Pod. После rollout прочитайте фактический ответ board и сравните с north-108. [Причина и проверка](guides#guide=release-overlays&section=q108-service-rollout-response)
diagnostics.probe_0_0: Проверка рендера может остановиться до указания поля, если недоступен каталог или инструмент. Проверьте путь overlay и выполните рендер со станции. [Причина и проверка](guides#guide=release-overlays&section=q108-overlay-render-observer-input)
diagnostics.probe_0_1: Проверка применения может остановиться до сравнения объектов, если не удаётся отрендерить overlay или открыть рабочую папку. Проверьте рендер и доступ к станции и кластеру. [Причина и проверка](guides#guide=release-overlays&section=q108-applied-overlay-observer-input)
