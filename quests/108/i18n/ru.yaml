title: Наложения Kustomize
brief: 'Среда восстановления не достигает требуемого масштаба и маршрута. Сохраните исходный Deployment с согласованными
  отрендеренной и живой конфигурациями.


  Работайте в `~/quest` на workstation. Предоставленные файлы: `base/board.yaml`, `base/kustomization.yaml`,
  `overlays/recovery/kustomization.yaml`.


  **Требования:**

  - Recovery-overlay в `~/quest/overlays/recovery` на рабочей станции рендерит две реплики приложения и только
  требуемое значение маршрута `north-108` в сгенерированной конфигурации.

  - Исходный Deployment `board` имеет ровно две готовые реплики и получает только требуемую настройку маршрута
  из той же сгенерированной конфигурации в кластере.

  - Из `deployment/board` HTTP `http://board:8080` возвращает `north-108`.


  Префикс имени не доказывает суффикс хеша, историю изменений или неизменность base.

  '
debrief: Изменение окружения выражено переиспользуемым overlay; identity созданной конфигурации вызвала реальную
  выкатку.
stages.0.brief: Исходный Deployment должен обслуживать требуемый маршрут с отрендеренной конфигурацией восстановления.
hints.0.text: Patch может не выбрать нужный ресурс из-за неверного target name.
hints.1.text: 'Изучайте результат render до применения overlay.


  Изучите поставленные определения, текущие ресурсы и события.


  ```sh

  cat overlays/recovery/kustomization.yaml

  kubectl kustomize overlays/recovery

  kubectl get deployment board -o yaml

  kubectl get configmaps -o yaml

  ```'
hints.2.text: 'Исправьте цель в оверлее; дайте генератору обновить ссылку окружения и rollout. Исходный patch
  указывает несуществующий Deployment; используйте board как цель и примените overlays/recovery. Сохраните
  переиспользуемую base и включённый суффикс хеша генератора.


  Проверьте наблюдаемый результат:


  ```sh

  kubectl get deployment board

  kubectl exec deployment/board -- wget -qO- -T 3 http://board:8080

  ```


  Ожидаются две готовые реплики и HTTP-ответ north-108 от исходного Deployment со сгенерированной recovery-конфигурацией.


  Поставленные ограничения и подробности: Оверлей `overlays/recovery` в `~/quest` на workstation успешно рендерится:
  реплики Deployment `2` и ConfigMap с префиксом `route-`, содержащий только `ROUTE` со значением `north-108`.
  Исходный Deployment `board` сохраняет ровно `2` реплики, обе готовы; его контейнер приложения объявляет только
  `ROUTE` из отрендеренного ConfigMap, чьи живые данные содержат только `ROUTE` со значением `north-108`.'
phrases.0: Я изучил результат Kustomize до применения.
phrases.1: Я сохранил различия окружений вне переиспользуемого base.
phrases.2: Я проверил ссылку на созданную конфигурацию и реальный ответ.
questions.0.points.0: 'Нет: он формирует ресурсы до отправки в API.'
questions.0.points.1: Для постоянного согласования desired state нужен отдельный reconciler.
questions.0.prompt: Работает ли Kustomize как серверный контроллер?
questions.1.points.0: Имя меняется, и Kustomize обновляет ссылку в шаблоне Pod.
questions.1.points.1: Изменённый шаблон Pod Deployment создаёт новую ревизию.
questions.1.prompt: Почему hash созданного ConfigMap может вызвать rollout?
