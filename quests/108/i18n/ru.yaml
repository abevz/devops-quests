title: Наложения Kustomize
brief: "Среда восстановления не достигает требуемого масштаба и маршрута. Сохраните исходный Deployment с согласованными\
  \ отрендеренной и живой конфигурациями.\n\nРаботайте в `~/quest` на workstation. Предоставленные файлы: `base/board.json`,\
  \ `base/kustomization.yaml`, `overlays/recovery/kustomization.yaml`, `original-deployment-uid`.\n\n**Требования:**\n\
  - Оверлей `overlays/recovery` в `~/quest` на workstation успешно рендерится: реплики Deployment `2` и ConfigMap\
  \ с префиксом `route-`, содержащий только `ROUTE` со значением `north-108`.\n- Живое состояние восстановления:\n\
  \  - Исходный Deployment `board` сохраняет ровно `2` реплики, обе готовы.\n  - Его контейнер приложения объявляет\
  \ только `ROUTE` из отрендеренного ConfigMap, чьи живые данные содержат только `ROUTE` со значением `north-108`.\n\
  \  - Эталон исходного UID — `/run/dq/facts/0/original-deployment-uid` на workstation.\n- Из `deployment/board`\
  \ HTTP `http://board:8080` возвращает `north-108`.\n\n**Проверьте самостоятельно перед Check & finish:**\nВыполняйте\
  \ эти команды наблюдения из `~/quest` на workstation; `kubectl exec` наблюдает контейнер указанной нагрузки.\n\
  - `kubectl kustomize overlays/recovery` — Отрендеренные ConfigMap и Deployment соответствуют требованиям.\n- Настройки,\
  \ идентичность и статус соответствуют требованиям.\n\n  ```sh\n  kubectl get deployment board -o yaml\n  name=$(kubectl\
  \ get deployment board -o jsonpath='{.spec.template.spec.containers[0].env[0].valueFrom.configMapKeyRef.name}')\n\
  \  kubectl get configmap \"$name\" -o yaml\n  cat /run/dq/facts/0/original-deployment-uid\n  ```\n- `kubectl exec\
  \ deployment/board -- wget -qO- -T 3 http://board:8080` — Потребитель получает `north-108`.\n\nПрефикс имени не\
  \ доказывает суффикс хеша, историю изменений или неизменность base.\n"
debrief: Изменение окружения выражено переиспользуемым overlay; identity созданной конфигурации вызвала реальную
  выкатку.
stages.0.brief: 'Исходный Deployment должен обслуживать требуемый маршрут с отрендеренной конфигурацией восстановления.

  '
hints.0.text: Patch может не выбрать нужный ресурс из-за неверного target name.
hints.1.text: Изучайте результат render до применения overlay.
hints.2.text: 'Исправьте цель в оверлее; дайте генератору обновить ссылку окружения и rollout. Исходный patch указывает
  несуществующий Deployment; используйте board как цель и примените overlays/recovery. Сохраните переиспользуемую
  base и включённый суффикс хеша генератора.

  '
phrases.0: Я изучил результат Kustomize до применения.
phrases.1: Я сохранил различия окружений вне переиспользуемого base.
phrases.2: Я проверил ссылку на созданную конфигурацию и реальный ответ.
questions.0.points.0: 'Нет: он формирует ресурсы до отправки в API.'
questions.0.points.1: Для постоянного согласования desired state нужен отдельный reconciler.
questions.0.prompt: Работает ли Kustomize как серверный контроллер?
questions.1.points.0: Имя меняется, и Kustomize обновляет ссылку в шаблоне Pod.
questions.1.points.1: Изменённый шаблон Pod Deployment создаёт новую ревизию.
questions.1.prompt: Почему hash созданного ConfigMap может вызвать rollout?
