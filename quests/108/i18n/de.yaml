title: Kustomize-Overlays
brief: 'Die Basis betreibt ein board mit stillgelegter Konfiguration. Das Kustomize-Overlay recovery erzeugt ROUTE=north-108,
  aber sein Replikat-Patch zielt auf einen nicht vorhandenen Deployment-Namen. Korrigiere nur das Patch-Ziel des Overlays
  auf board, prüfe kubectl kustomize overlays/recovery und wende das Overlay an. Halte die Basis wiederverwendbar und den
  Hash-Suffix des Generators aktiviert; der erzeugte ConfigMap-Name muss in die Umgebungsreferenz des Pods gelangen. Stelle
  zwei bereite Replikate im ursprünglichen Deployment wieder her, ohne eine separate Route im Container fest zu codieren.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `base/board.json`, `base/kustomization.yaml`, `overlays/recovery/kustomization.yaml`,
  `original-deployment-uid`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien, vorinstallierte Bilder
  und private Dienste. Ändern Sie nur diese Bucht.


  Nutze die bereitgestellten `base/board.json`, `base/kustomization.yaml`, `overlays/recovery/kustomization.yaml` und `original-deployment-uid`.
  Das Rendern des Overlays muss gelingen; seine erste ConfigMap muss genau `ROUTE: north-108` und einen mit `route-` beginnenden
  Namen haben, sein Deployment muss zwei Replikate anfordern. Die UID des ursprünglichen laufenden Deployments muss `original-deployment-uid`
  entsprechen, mit zwei Replikaten und zwei bereiten. Die Umgebung des ersten Containers muss genau einen `ROUTE`-Eintrag
  enthalten, der auf Schlüssel `ROUTE` der gerenderten ConfigMap verweist; diese laufende ConfigMap muss genau `ROUTE: north-108`
  enthalten. `board:8080` muss `north-108` liefern. Die Präfixprüfung allein beweist keinen Hash-Suffix; aktueller Zustand
  beweist weder Änderungshistorie noch unveränderte Basis.'
debrief: Die Umgebungsänderung wurde in einem wiederverwendbaren overlay codiert, wobei die generierte Konfiguration identity
  einen echten Rollout auslöste.
stages.0.brief: Gerendertes Overlay, ursprüngliche Deployment-Identität, laufende Konfiguration und Board-Antwort entsprechen
  der Beschreibung.
stages.0.objectives.0.text: Gerendertes Overlay, ursprüngliche Deployment-Identität, laufende Konfiguration und Board-Antwort
  entsprechen der Beschreibung.
hints.0.text: Ein Patch kann seine vorgesehene Ressource verfehlen, wenn der Zielname falsch ist.
hints.1.text: Überprüfen Sie die gerenderte Ausgabe, bevor Sie einen overlay anwenden.
hints.2.text: Befestigen Sie das Ziel im overlay; Lassen Sie den Generator die Umgebung reference und rollout aktualisieren.
phrases.0: Ich habe die gerenderte Kustomize-Ausgabe überprüft, bevor ich sie angewendet habe.
phrases.1: Ich habe Umgebungsunterschiede außerhalb des wiederverwendbaren base gehalten.
phrases.2: Ich habe die generierte Konfigurationsreferenz und die Live-Antwort überprüft.
questions.0.points.0: NEIN; Es rendert Ressourcen, bevor sie an API gesendet werden.
questions.0.points.1: Für die kontinuierliche Durchsetzung des gewünschten Zustands ist ein separater reconciler erforderlich.
questions.0.prompt: Läuft Kustomize als serverseitiger Controller?
questions.1.points.0: Der generierte Name ändert sich und Kustomize aktualisiert die Vorlagenreferenz Pod.
questions.1.points.1: Eine geänderte Vorlage Deployment Pod erstellt eine neue Revision.
questions.1.prompt: Warum kann ein generierter ConfigMap hash einen rollout auslösen?
