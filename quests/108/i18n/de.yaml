title: Kustomize-Overlays
brief: 'Die Wiederherstellungsumgebung erreicht nicht die geforderte Skalierung und Route. Behalten Sie das
  ursprüngliche Deployment mit konsistenter gerenderter und aktueller Konfiguration bei.


  Arbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte Dateien: `base/board.yaml`, `base/kustomization.yaml`,
  `overlays/recovery/kustomization.yaml`.


  **Anforderungen:**

  - Das Recovery-Overlay unter `~/quest/overlays/recovery` auf der Workstation rendert zwei Anwendungsreplikate
  und nur den erforderlichen Routenwert `north-108` in der generierten Konfiguration.

  - Das ursprüngliche Deployment `board` hat genau zwei bereite Replikate und erhält nur die erforderliche
  Routeneinstellung aus derselben generierten Konfiguration im Cluster.

  - Von `deployment/board` liefert HTTP `http://board:8080` den Wert `north-108`.


  Ein Namenspräfix belegt weder Hash-Suffix noch Änderungshistorie oder unveränderte Basis.

  '
debrief: Die Umgebungsänderung wurde in einem wiederverwendbaren overlay codiert, wobei die generierte Konfiguration
  identity einen echten Rollout auslöste.
stages.0.brief: Das ursprüngliche Deployment muss die geforderte Route mit der gerenderten Wiederherstellungskonfiguration
  liefern.
hints.0.text: Ein Patch kann seine vorgesehene Ressource verfehlen, wenn der Zielname falsch ist.
hints.1.text: 'Überprüfen Sie die gerenderte Ausgabe, bevor Sie einen overlay anwenden.


  Prüfen Sie die mitgelieferten Definitionen, aktuellen Ressourcen und Ereignisse.


  ```sh

  cat overlays/recovery/kustomization.yaml

  kubectl kustomize overlays/recovery

  kubectl get deployment board -o yaml

  kubectl get configmaps -o yaml

  ```'
hints.2.text: 'Korrigieren Sie das Ziel im Overlay; lassen Sie den Generator Umgebungsreferenz und Rollout
  aktualisieren. Der bereitgestellte Patch zielt auf ein nicht vorhandenes Deployment; verwenden Sie board
  und wenden Sie overlays/recovery an. Halten Sie die Basis wiederverwendbar und den Generator-Hash-Suffix
  aktiviert.


  Prüfen Sie das beobachtete Ergebnis:


  ```sh

  kubectl get deployment board

  kubectl exec deployment/board -- wget -qO- -T 3 http://board:8080

  ```


  Erwartet werden zwei bereite Replikate und die HTTP-Antwort north-108 vom ursprünglichen Deployment mit der
  generierten Recovery-Konfiguration.


  Mitgelieferte Einschränkungen und Details: Overlay `overlays/recovery` in `~/quest` auf der Workstation wird
  erfolgreich gerendert: Deployment-Replikate `2` und eine ConfigMap mit Präfix `route-`, die nur `ROUTE` mit
  Wert `north-108` enthält. Das ursprüngliche Deployment `board` behält genau `2` Replikate, beide bereit;
  sein Anwendungscontainer deklariert nur `ROUTE` aus der gerenderten ConfigMap, deren aktuelle Daten nur `ROUTE`
  mit Wert `north-108` enthalten.'
phrases.0: Ich habe die gerenderte Kustomize-Ausgabe überprüft, bevor ich sie angewendet habe.
phrases.1: Ich habe Umgebungsunterschiede außerhalb des wiederverwendbaren base gehalten.
phrases.2: Ich habe die generierte Konfigurationsreferenz und die Live-Antwort überprüft.
questions.0.points.0: NEIN; Es rendert Ressourcen, bevor sie an API gesendet werden.
questions.0.points.1: Für die kontinuierliche Durchsetzung des gewünschten Zustands ist ein separater reconciler
  erforderlich.
questions.0.prompt: Läuft Kustomize als serverseitiger Controller?
questions.1.points.0: Der generierte Name ändert sich und Kustomize aktualisiert die Vorlagenreferenz Pod.
questions.1.points.1: Eine geänderte Vorlage Deployment Pod erstellt eine neue Revision.
questions.1.prompt: Warum kann ein generierter ConfigMap hash einen rollout auslösen?
