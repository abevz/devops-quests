title: Kustomize-Overlays
brief: 'Auf dem base läuft ein board mit der retired-Konfiguration. Der recovery Kustomize overlay generiert
  ROUTE=north-108, sein replicas patch zielt jedoch auf einen nicht vorhandenen Deployment-Namen ab. Korrigieren
  Sie nur das Ziel overlay patch auf board, inspect kubectl kustomize overlays/recovery und wenden Sie
  es an overlay. Halten Sie den base wiederverwendbar und den Generator hash suffix aktiviert; Der generierte
  ConfigMap-Name muss in die Umgebungsreferenz Pod einfließen. Stellen Sie zwei fertige replicas auf dem
  ursprünglichen Deployment wieder her, ohne einen separaten route im Container fest zu codieren.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `base/board.json`, `base/kustomization.yaml`,
  `overlays/recovery/kustomization.yaml`, `original-deployment-uid`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: Der overlay rendert zwei replicas und einen gehashten route ConfigMap; Die ursprünglichen
  Live-Deployment-Referenzen, die den Namen generiert haben und north-108 bedienen.'
debrief: Die Umgebungsänderung wurde in einem wiederverwendbaren overlay codiert, wobei die generierte
  Konfiguration identity einen echten Rollout auslöste.
stages.0.brief: 'Erfolgskriterien: Das Overlay rendert zwei Replikate und ein gehashtes route ConfigMap;
  die ursprünglichen Live-Deployment-Referenzen, die den Namen generiert haben und north-108 bedienen.'
stages.0.objectives.0.text: Das Overlay rendert zwei Replikate und ein gehashtes route ConfigMap; Die
  ursprünglichen Live-Deployment-Referenzen, die den Namen generiert haben und north-108 bedienen.
hints.0.text: Ein Patch kann seine vorgesehene Ressource verfehlen, wenn der Zielname falsch ist.
hints.1.text: Überprüfen Sie die gerenderte Ausgabe, bevor Sie einen overlay anwenden.
hints.2.text: Befestigen Sie das Ziel im overlay; Lassen Sie den Generator die Umgebung reference und
  rollout aktualisieren.
phrases.0: Ich habe die gerenderte Kustomize-Ausgabe überprüft, bevor ich sie angewendet habe.
phrases.1: Ich habe Umgebungsunterschiede außerhalb des wiederverwendbaren base gehalten.
phrases.2: Ich habe die generierte Konfigurationsreferenz und die Live-Antwort überprüft.
questions.0.points.0: NEIN; Es rendert Ressourcen, bevor sie an API gesendet werden.
questions.0.points.1: Für die kontinuierliche Durchsetzung des gewünschten Zustands ist ein separater
  reconciler erforderlich.
questions.0.prompt: Läuft Kustomize als serverseitiger Controller?
questions.1.points.0: Der generierte Name ändert sich und Kustomize aktualisiert die Vorlagenreferenz
  Pod.
questions.1.points.1: Eine geänderte Vorlage Deployment Pod erstellt eine neue Revision.
questions.1.prompt: Warum kann ein generierter ConfigMap hash einen rollout auslösen?
