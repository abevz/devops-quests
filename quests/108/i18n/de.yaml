title: Kustomize-Overlays
brief: 'Die Wiederherstellungsumgebung erreicht nicht die geforderte Skalierung und Route. Behalten Sie das
  ursprüngliche Deployment mit konsistenter gerenderter und aktueller Konfiguration bei.


  Arbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte Dateien: `base/board.yaml`, `base/kustomization.yaml`,
  `overlays/recovery/kustomization.yaml`.


  **Anforderungen:**

  - Das Recovery-Overlay unter `~/quest/overlays/recovery` auf der Workstation rendert zwei Anwendungsreplikate
  und nur den erforderlichen Routenwert `north-108` in der generierten Konfiguration.

  - Das ursprüngliche Deployment `board` hat genau zwei bereite Replikate und erhält nur die erforderliche
  Routeneinstellung aus derselben generierten Konfiguration im Cluster.

  - Von `deployment/board` liefert HTTP `http://board:8080` den Wert `north-108`.


  Ein Namenspräfix belegt weder Hash-Suffix noch Änderungshistorie oder unveränderte Basis.

  '
debrief: Die Umgebungsänderung wurde in einem wiederverwendbaren overlay codiert, wobei die generierte Konfiguration
  identity einen echten Rollout auslöste.
stages.0.brief: Das ursprüngliche Deployment muss die geforderte Route mit der gerenderten Wiederherstellungskonfiguration
  liefern.
hints.0.text: Ein Patch kann seine vorgesehene Ressource verfehlen, wenn der Zielname falsch ist.
hints.1.text: |-
  Überprüfen Sie die gerenderte Ausgabe, bevor Sie einen overlay anwenden.

  Prüfen Sie die mitgelieferten Definitionen, aktuellen Ressourcen und Ereignisse.

  Korrigieren Sie das Ziel im Overlay; lassen Sie den Generator Umgebungsreferenz und Rollout aktualisieren. Der bereitgestellte Patch zielt auf ein nicht vorhandenes Deployment; verwenden Sie board und wenden Sie overlays/recovery an. Halten Sie die Basis wiederverwendbar und den Generator-Hash-Suffix aktiviert.

  ```sh
  cat overlays/recovery/kustomization.yaml
  kubectl kustomize overlays/recovery
  kubectl get deployment board -o yaml
  kubectl get configmaps -o yaml
  ```
hints.2.text: |-
  Prüfen Sie das beobachtete Ergebnis:

  ```sh
  kubectl get deployment board
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080
  ```

  Erwartet werden zwei bereite Replikate und die HTTP-Antwort north-108 vom ursprünglichen Deployment mit der generierten Recovery-Konfiguration.

  Mitgelieferte Einschränkungen und Details: Overlay `overlays/recovery` in `~/quest` auf der Workstation wird erfolgreich gerendert: Deployment-Replikate `2` und eine ConfigMap mit Präfix `route-`, die nur `ROUTE` mit Wert `north-108` enthält. Das ursprüngliche Deployment `board` behält genau `2` Replikate, beide bereit; sein Anwendungscontainer deklariert nur `ROUTE` aus der gerenderten ConfigMap, deren aktuelle Daten nur `ROUTE` mit Wert `north-108` enthalten.
phrases.0: Ich habe die gerenderte Kustomize-Ausgabe überprüft, bevor ich sie angewendet habe.
phrases.1: Ich habe Umgebungsunterschiede außerhalb des wiederverwendbaren base gehalten.
phrases.2: Ich habe die generierte Konfigurationsreferenz und die Live-Antwort überprüft.
questions.0.points.0: NEIN; Es rendert Ressourcen, bevor sie an API gesendet werden.
questions.0.points.1: Für die kontinuierliche Durchsetzung des gewünschten Zustands ist ein separater reconciler
  erforderlich.
questions.0.prompt: Läuft Kustomize als serverseitiger Controller?
questions.1.points.0: Der generierte Name ändert sich und Kustomize aktualisiert die Vorlagenreferenz Pod.
questions.1.points.1: Eine geänderte Vorlage Deployment Pod erstellt eine neue Revision.
questions.1.prompt: Warum kann ein generierter ConfigMap hash einen rollout auslösen?
stages.0.objectives.0.text: Das Recovery-Overlay unter `~/quest/overlays/recovery` auf der Workstation rendert
  zwei Anwendungsreplikate und nur den erforderlichen Routenwert `north-108` in der generierten Konfiguration.
stages.0.objectives.1.text: Das ursprüngliche Deployment `board` hat genau zwei bereite Replikate und erhält
  nur die erforderliche Routeneinstellung aus derselben generierten Konfiguration im Cluster.
stages.0.objectives.2.text: Von `deployment/board` liefert HTTP `http://board:8080` den Wert `north-108`.
diagnostics.render: Das Recovery-Overlay verweist möglicherweise auf eine fehlende Basis oder ein ungültiges Patch-Ziel. Rendern Sie es lokal und prüfen Sie vor der Anwendung den ersten Kustomize-Fehler. [Ursache und Prüfung](guides#guide=release-overlays&section=q108-overlay-render)
diagnostics.cm_data: Der gerenderte Worker verweist möglicherweise auf die Basis-ConfigMap oder die Daten weichen ab. Folgen Sie ROUTE und prüfen Sie in der referenzierten ConfigMap genau ROUTE=north-108. [Ursache und Prüfung](guides#guide=release-overlays&section=q108-rendered-route-map)
diagnostics.cm_name: Das Overlay verweist möglicherweise auf einen statischen Namen oder übernimmt den generierten Namen nicht. Prüfen Sie, welche ConfigMap der gerenderte Worker referenziert und ob ihr Name mit route- beginnt. [Ursache und Prüfung](guides#guide=release-overlays&section=q108-rendered-generated-map-name)
diagnostics.rendered_replicas: Der Overlay-Patch verweist möglicherweise auf ein anderes Objekt als Deployment board. Prüfen Sie genau ein Deployment board mit zwei gewünschten Repliken im Ergebnis. [Ursache und Prüfung](guides#guide=release-overlays&section=q108-rendered-replica-count)
diagnostics.uid: Ein Ersatz von board statt einer Aktualisierung hat die UID möglicherweise dauerhaft geändert. Vergleichen Sie die aktive UID mit dem Original, bevor Sie das Overlay auf das bestehende Objekt anwenden. [Ursache und Prüfung](guides#guide=release-overlays&section=q108-original-live-deployment)
diagnostics.live_replicas: Das Overlay kann korrekt rendern, während board die alte gewünschte Anzahl behält. Wenden Sie das korrigierte Overlay an und bestätigen Sie zwei Repliken in der aktiven Spezifikation. [Ursache und Prüfung](guides#guide=release-overlays&section=q108-applied-replica-count)
diagnostics.ready: Die gewünschte Anzahl wurde möglicherweise angewendet, aber Pods starten noch oder warten auf Eingaben. Prüfen Sie die Pods und warten Sie auf genau zwei bereite board-Repliken. [Ursache und Prüfung](guides#guide=release-overlays&section=q108-applied-ready-replicas)
diagnostics.env: Der aktive Worker enthält möglicherweise ein Literal oder verweist auf den alten Namen. Prüfen Sie den einzigen ROUTE-Eintrag und verweisen Sie auf ROUTE in der aktuell gerenderten ConfigMap. [Ursache und Prüfung](guides#guide=release-overlays&section=q108-live-worker-route-reference)
diagnostics.live_data: Die aktuell generierte ConfigMap fehlt möglicherweise im Cluster oder enthält alte Daten. Vergleichen Sie die dem Render entsprechende aktive ConfigMap mit genau ROUTE=north-108. [Ursache und Prüfung](guides#guide=release-overlays&section=q108-applied-route-map-data)
diagnostics.http: Die API-Objekte können korrekt sein, obwohl der Service einen alten oder unerreichbaren Pod erreicht. Lesen Sie nach dem Rollout die tatsächliche Antwort von board und vergleichen Sie mit north-108. [Ursache und Prüfung](guides#guide=release-overlays&section=q108-service-rollout-response)
diagnostics.probe_0_0: Die Render-Prüfung kann vor der Feldmeldung abbrechen, wenn Pfad oder Werkzeuge fehlen. Prüfen Sie den Overlay-Pfad und rendern Sie auf der Workstation. [Ursache und Prüfung](guides#guide=release-overlays&section=q108-overlay-render-observer-input)
diagnostics.probe_0_1: Die Prüfung angewendeter Objekte kann vor dem Vergleich abbrechen, wenn Rendern oder Verzeichniszugriff fehlschlägt. Prüfen Sie den Render-Vorgang sowie lokalen und Clusterzugriff. [Ursache und Prüfung](guides#guide=release-overlays&section=q108-applied-overlay-observer-input)
