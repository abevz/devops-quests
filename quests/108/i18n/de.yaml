title: Kustomize-Overlays
brief: "Die Wiederherstellungsumgebung erreicht nicht die geforderte Skalierung und Route. Behalten Sie das ursprüngliche\
  \ Deployment mit konsistenter gerenderter und aktueller Konfiguration bei.\n\nArbeiten Sie in `~/quest` auf der\
  \ Workstation. Bereitgestellte Dateien: `base/board.json`, `base/kustomization.yaml`, `overlays/recovery/kustomization.yaml`,\
  \ `original-deployment-uid`.\n\n**Anforderungen:**\n- Overlay `overlays/recovery` in `~/quest` auf der Workstation\
  \ wird erfolgreich gerendert: Deployment-Replikate `2` und eine ConfigMap mit Präfix `route-`, die nur `ROUTE`\
  \ mit Wert `north-108` enthält.\n- Aktueller Wiederherstellungszustand:\n  - Das ursprüngliche Deployment `board`\
  \ behält genau `2` Replikate, beide bereit.\n  - Sein Anwendungscontainer deklariert nur `ROUTE` aus der gerenderten\
  \ ConfigMap, deren aktuelle Daten nur `ROUTE` mit Wert `north-108` enthalten.\n  - Die ursprüngliche UID-Referenz\
  \ liegt in `/run/dq/facts/0/original-deployment-uid` auf der Workstation.\n- Von `deployment/board` liefert HTTP\
  \ `http://board:8080` den Wert `north-108`.\n\n**Vor Check & finish selbst prüfen:**\nFühren Sie diese Beobachtungsbefehle\
  \ in `~/quest` auf der Workstation aus; `kubectl exec` beobachtet den Container des genannten Workloads.\n- `kubectl\
  \ kustomize overlays/recovery` — Gerenderte ConfigMap und Deployment entsprechen den Anforderungen.\n- Einstellungen,\
  \ Identität und Status entsprechen den Anforderungen.\n\n  ```sh\n  kubectl get deployment board -o yaml\n  name=$(kubectl\
  \ get deployment board -o jsonpath='{.spec.template.spec.containers[0].env[0].valueFrom.configMapKeyRef.name}')\n\
  \  kubectl get configmap \"$name\" -o yaml\n  cat /run/dq/facts/0/original-deployment-uid\n  ```\n- `kubectl exec\
  \ deployment/board -- wget -qO- -T 3 http://board:8080` — Der Verbraucher erhält `north-108`.\n\nEin Namenspräfix\
  \ belegt weder Hash-Suffix noch Änderungshistorie oder unveränderte Basis.\n"
debrief: Die Umgebungsänderung wurde in einem wiederverwendbaren overlay codiert, wobei die generierte Konfiguration
  identity einen echten Rollout auslöste.
stages.0.brief: 'Das ursprüngliche Deployment muss die geforderte Route mit der gerenderten Wiederherstellungskonfiguration
  liefern.

  '
hints.0.text: Ein Patch kann seine vorgesehene Ressource verfehlen, wenn der Zielname falsch ist.
hints.1.text: Überprüfen Sie die gerenderte Ausgabe, bevor Sie einen overlay anwenden.
hints.2.text: 'Korrigieren Sie das Ziel im Overlay; lassen Sie den Generator Umgebungsreferenz und Rollout aktualisieren.
  Der bereitgestellte Patch zielt auf ein nicht vorhandenes Deployment; verwenden Sie board und wenden Sie overlays/recovery
  an. Halten Sie die Basis wiederverwendbar und den Generator-Hash-Suffix aktiviert.

  '
phrases.0: Ich habe die gerenderte Kustomize-Ausgabe überprüft, bevor ich sie angewendet habe.
phrases.1: Ich habe Umgebungsunterschiede außerhalb des wiederverwendbaren base gehalten.
phrases.2: Ich habe die generierte Konfigurationsreferenz und die Live-Antwort überprüft.
questions.0.points.0: NEIN; Es rendert Ressourcen, bevor sie an API gesendet werden.
questions.0.points.1: Für die kontinuierliche Durchsetzung des gewünschten Zustands ist ein separater reconciler
  erforderlich.
questions.0.prompt: Läuft Kustomize als serverseitiger Controller?
questions.1.points.0: Der generierte Name ändert sich und Kustomize aktualisiert die Vorlagenreferenz Pod.
questions.1.points.1: Eine geänderte Vorlage Deployment Pod erstellt eine neue Revision.
questions.1.prompt: Warum kann ein generierter ConfigMap hash einen rollout auslösen?
