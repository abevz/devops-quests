title: Nakładki Kustomize
brief: 'Baza uruchamia jeden board z wycofaną konfiguracją. Overlay Kustomize o nazwie recovery generuje ROUTE=north-108,
  ale jego patch replik wskazuje nieistniejącą nazwę Deployment. Popraw tylko cel patcha overlay na board, sprawdź kubectl
  kustomize overlays/recovery i zastosuj overlay. Zachowaj bazę jako wielokrotnego użytku i włączony sufiks hash generatora;
  wygenerowana nazwa ConfigMap musi trafić do odwołania w środowisku Poda. Przywróć dwie gotowe repliki pierwotnego Deployment
  bez wpisywania osobnej trasy na sztywno w kontenerze.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `base/board.json`, `base/kustomization.yaml`, `overlays/recovery/kustomization.yaml`,
  `original-deployment-uid`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie załadowanych obrazów
  i usług prywatnych. Zmień tylko tę zatokę.


  Użyj dostarczonych `base/board.json`, `base/kustomization.yaml`, `overlays/recovery/kustomization.yaml` i `original-deployment-uid`.
  Renderowanie overlay musi się powieść; jego pierwsza ConfigMap musi mieć dokładnie `ROUTE: north-108` i nazwę zaczynającą
  się od `route-`, a Deployment musi żądać dwóch replik. UID pierwotnego działającego Deployment musi odpowiadać `original-deployment-uid`,
  z dwiema replikami i dwiema gotowymi. Środowisko pierwszego kontenera musi zawierać dokładnie jeden wpis `ROUTE` odwołujący
  się do klucza `ROUTE` wyrenderowanej ConfigMap; ta działająca ConfigMap musi zawierać dokładnie `ROUTE: north-108`. `board:8080`
  musi zwrócić `north-108`. Sama kontrola prefiksu nie dowodzi sufiksu hash, a obecny stan nie dowodzi historii zmian ani
  niezmienionej bazy.'
debrief: Zmiana środowiska została zakodowana w pliku overlay wielokrotnego użytku, a wygenerowana konfiguracja identity umożliwiła
  rzeczywiste wdrożenie.
stages.0.brief: Wyrenderowany overlay, tożsamość pierwotnego Deployment, działająca konfiguracja i odpowiedź board odpowiadają
  opisowi.
stages.0.objectives.0.text: Wyrenderowany overlay, tożsamość pierwotnego Deployment, działająca konfiguracja i odpowiedź board
  odpowiadają opisowi.
hints.0.text: Łatka może utracić zamierzony zasób, jeśli target name jest nieprawidłowy.
hints.1.text: Sprawdź renderowany wynik przed zastosowaniem overlay.
hints.2.text: Napraw target w overlay; pozwól generatorowi zaktualizować odwołanie do środowiska i rollout.
phrases.0: Przed zastosowaniem sprawdziłem wyrenderowane wyjście Kustomize.
phrases.1: Zachowałem różnice środowiskowe poza urządzeniem base wielokrotnego użytku.
phrases.2: Sprawdziłem wygenerowane odniesienie do konfiguracji i odpowiedź na żywo.
questions.0.points.0: NIE; renderuje zasoby przed ich wysłaniem do API.
questions.0.points.1: Do ciągłego wymuszania pożądanego stanu potrzebny jest osobny moduł reconciler.
questions.0.prompt: Czy Kustomize działa jako kontroler po stronie serwera?
questions.1.points.0: Wygenerowana nazwa ulega zmianie, a Kustomize aktualizuje odniesienie do szablonu Pod.
questions.1.points.1: Zmieniony szablon Deployment Pod tworzy nową wersję.
questions.1.prompt: Dlaczego wygenerowany ConfigMap hash może wywołać rollout?
