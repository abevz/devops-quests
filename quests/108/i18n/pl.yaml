title: Nakładki Kustomize
brief: 'base obsługuje jeden board z wycofaną konfiguracją. Odzyskiwanie Kustomize overlay generuje ROUTE=north-108,
  ale jego łatka repliki dotyczy nieistniejącej nazwy Deployment. Popraw tylko cel poprawki overlay na
  board, sprawdź kubectl kustomize overlays/recovery i zastosuj overlay. Zachowaj możliwość wielokrotnego
  użytku base i włączony generator hash suffix; wygenerowana nazwa ConfigMap musi zostać przeniesiona
  do odniesienia do środowiska Pod. Odzyskaj dwie gotowe repliki na oryginalnym Deployment bez konieczności
  kodowania osobnej trasy w kontenerze.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `base/board.json`, `base/kustomization.yaml`,
  `overlays/recovery/kustomization.yaml`, `original-deployment-uid`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: overlay renderuje dwie repliki i zaszyfrowaną trasę ConfigMap; oryginalne,
  aktywne odniesienia do Deployment, które wygenerowały nazwę i obsługują north-108.'
debrief: Zmiana środowiska została zakodowana w pliku overlay wielokrotnego użytku, a wygenerowana konfiguracja
  identity umożliwiła rzeczywiste wdrożenie.
stages.0.brief: 'Kryteria sukcesu: nakładka renderuje dwie repliki i zaszyfrowaną trasę ConfigMap; oryginalne,
  aktywne odniesienia do Deployment, które wygenerowały nazwę i obsługują north-108.'
stages.0.objectives.0.text: Nakładka renderuje dwie repliki i zaszyfrowaną trasę ConfigMap; oryginalne,
  aktywne odniesienia do Deployment, które wygenerowały nazwę i obsługują north-108.
hints.0.text: Łatka może utracić zamierzony zasób, jeśli target name jest nieprawidłowy.
hints.1.text: Sprawdź renderowany wynik przed zastosowaniem overlay.
hints.2.text: Napraw target w overlay; pozwól generatorowi zaktualizować odwołanie do środowiska i rollout.
phrases.0: Przed zastosowaniem sprawdziłem wyrenderowane wyjście Kustomize.
phrases.1: Zachowałem różnice środowiskowe poza urządzeniem base wielokrotnego użytku.
phrases.2: Sprawdziłem wygenerowane odniesienie do konfiguracji i odpowiedź na żywo.
questions.0.points.0: NIE; renderuje zasoby przed ich wysłaniem do API.
questions.0.points.1: Do ciągłego wymuszania pożądanego stanu potrzebny jest osobny moduł reconciler.
questions.0.prompt: Czy Kustomize działa jako kontroler po stronie serwera?
questions.1.points.0: Wygenerowana nazwa ulega zmianie, a Kustomize aktualizuje odniesienie do szablonu
  Pod.
questions.1.points.1: Zmieniony szablon Deployment Pod tworzy nową wersję.
questions.1.prompt: Dlaczego wygenerowany ConfigMap hash może wywołać rollout?
