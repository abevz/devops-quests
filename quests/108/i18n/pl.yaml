title: Nakładki Kustomize
brief: 'Środowisko przywracania nie osiąga wymaganej skali i trasy. Zachowaj oryginalny Deployment ze spójną
  wyrenderowaną i działającą konfiguracją.


  Pracuj w `~/quest` na workstation. Dostarczone pliki: `base/board.yaml`, `base/kustomization.yaml`, `overlays/recovery/kustomization.yaml`.


  **Wymagania:**

  - Overlay odzyskiwania w `~/quest/overlays/recovery` na stacji roboczej renderuje dwie repliki aplikacji
  i tylko wymaganą wartość trasy `north-108` w generowanej konfiguracji.

  - Oryginalny Deployment `board` ma dokładnie dwie gotowe repliki i otrzymuje tylko wymagane ustawienie trasy
  z tej samej wygenerowanej konfiguracji w klastrze.

  - Z `deployment/board` HTTP `http://board:8080` zwraca `north-108`.


  Prefiks nazwy nie dowodzi sufiksu hash, historii edycji ani niezmienności bazy.

  '
debrief: Zmiana środowiska została zakodowana w pliku overlay wielokrotnego użytku, a wygenerowana konfiguracja
  identity umożliwiła rzeczywiste wdrożenie.
stages.0.brief: Oryginalny Deployment ma obsługiwać wymaganą trasę z wyrenderowaną konfiguracją przywracania.
hints.0.text: Łatka może utracić zamierzony zasób, jeśli target name jest nieprawidłowy.
hints.1.text: 'Sprawdź renderowany wynik przed zastosowaniem overlay.


  Sprawdź dostarczone definicje, bieżące zasoby i zdarzenia.


  ```sh

  cat overlays/recovery/kustomization.yaml

  kubectl kustomize overlays/recovery

  kubectl get deployment board -o yaml

  kubectl get configmaps -o yaml

  ```'
hints.2.text: 'Popraw cel w overlay; pozwól generatorowi zaktualizować odwołanie środowiska i rollout. Dostarczony patch wskazuje nieistniejący Deployment; użyj board jako celu i zastosuj overlays/recovery. Zachowaj bazę wielokrotnego użytku i włączony sufiks hash generatora.


  Sprawdź obserwowany wynik:


  ```sh

  kubectl get deployment board

  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080

  ```


  Oczekuj dwóch gotowych replik i odpowiedzi HTTP north-108 z oryginalnego Deploymentu korzystającego z wygenerowanej konfiguracji odzyskiwania.


  Dostarczone ograniczenia i szczegóły: Overlay `overlays/recovery` w `~/quest` na workstation renderuje się poprawnie: repliki Deployment `2` i ConfigMap z prefiksem `route-` zawierający tylko `ROUTE` o wartości `north-108`. Oryginalny Deployment `board` zachowuje dokładnie `2` repliki, obie gotowe; jego kontener aplikacji deklaruje tylko `ROUTE` z wyrenderowanego ConfigMap, którego działające dane zawierają tylko `ROUTE` o wartości `north-108`.'
phrases.0: Przed zastosowaniem sprawdziłem wyrenderowane wyjście Kustomize.
phrases.1: Zachowałem różnice środowiskowe poza urządzeniem base wielokrotnego użytku.
phrases.2: Sprawdziłem wygenerowane odniesienie do konfiguracji i odpowiedź na żywo.
questions.0.points.0: NIE; renderuje zasoby przed ich wysłaniem do API.
questions.0.points.1: Do ciągłego wymuszania pożądanego stanu potrzebny jest osobny moduł reconciler.
questions.0.prompt: Czy Kustomize działa jako kontroler po stronie serwera?
questions.1.points.0: Wygenerowana nazwa ulega zmianie, a Kustomize aktualizuje odniesienie do szablonu Pod.
questions.1.points.1: Zmieniony szablon Deployment Pod tworzy nową wersję.
questions.1.prompt: Dlaczego wygenerowany ConfigMap hash może wywołać rollout?
stages.0.objectives.0.text: Overlay odzyskiwania w `~/quest/overlays/recovery` na stacji roboczej renderuje
  dwie repliki aplikacji i tylko wymaganą wartość trasy `north-108` w generowanej konfiguracji.
stages.0.objectives.1.text: Oryginalny Deployment `board` ma dokładnie dwie gotowe repliki i otrzymuje tylko
  wymagane ustawienie trasy z tej samej wygenerowanej konfiguracji w klastrze.
stages.0.objectives.2.text: Z `deployment/board` HTTP `http://board:8080` zwraca `north-108`.
diagnostics.render: Nakładka recovery może wskazywać brakującą bazę lub nieprawidłowy cel poprawki. Wyrenderuj ją lokalnie i sprawdź pierwszy błąd Kustomize przed zastosowaniem. [Przyczyna i kontrola](guides#guide=release-overlays&section=q108-overlay-render)
diagnostics.cm_data: Wyrenderowany kontener worker może odwoływać się do bazowej ConfigMap lub dane mogą się różnić. Prześledź referencję ROUTE i sprawdź, czy wskazana mapa zawiera dokładnie ROUTE=north-108. [Przyczyna i kontrola](guides#guide=release-overlays&section=q108-rendered-route-map)
diagnostics.cm_name: Nakładka może wskazywać statyczną nazwę lub nie przekazać wygenerowanej nazwy. Sprawdź, którą mapę wskazuje wyrenderowany kontener worker i czy nazwa zaczyna się od route-. [Przyczyna i kontrola](guides#guide=release-overlays&section=q108-rendered-generated-map-name)
diagnostics.rendered_replicas: Poprawka nakładki może wskazywać inny obiekt niż Deployment board. Sprawdź, czy wynik zawiera dokładnie jeden Deployment board z dwiema żądanymi replikami. [Przyczyna i kontrola](guides#guide=release-overlays&section=q108-rendered-replica-count)
diagnostics.uid: Zastąpienie board zamiast aktualizacji mogło trwale zmienić UID. Przed zastosowaniem nakładki do istniejącego obiektu porównaj aktualny UID z pierwotnym. [Przyczyna i kontrola](guides#guide=release-overlays&section=q108-original-live-deployment)
diagnostics.live_replicas: Nakładka może renderować się poprawnie, choć aktywny board ma starą żądaną liczbę. Zastosuj poprawioną nakładkę i potwierdź dwie repliki w specyfikacji. [Przyczyna i kontrola](guides#guide=release-overlays&section=q108-applied-replica-count)
diagnostics.ready: Żądane repliki mogły zostać zastosowane, ale pody jeszcze startują lub czekają na dane. Sprawdź pody i poczekaj na dokładnie dwie gotowe repliki board. [Przyczyna i kontrola](guides#guide=release-overlays&section=q108-applied-ready-replicas)
diagnostics.env: Aktywny kontener worker może mieć literał lub wskazywać starą nazwę mapy. Sprawdź pojedynczy wpis ROUTE i skieruj go do klucza ROUTE w bieżącej wyrenderowanej ConfigMap. [Przyczyna i kontrola](guides#guide=release-overlays&section=q108-live-worker-route-reference)
diagnostics.live_data: Bieżącej wygenerowanej ConfigMap może brakować w klastrze albo może zawierać stare dane. Porównaj ją z mapą z aktualnego renderu i dokładnym ROUTE=north-108. [Przyczyna i kontrola](guides#guide=release-overlays&section=q108-applied-route-map-data)
diagnostics.http: Obiekty API mogą być poprawne, choć Service trafia do starego lub niedostępnego poda. Odczytaj odpowiedź board po wdrożeniu i porównaj z north-108. [Przyczyna i kontrola](guides#guide=release-overlays&section=q108-service-rollout-response)
diagnostics.probe_0_0: Kontrola renderu może zakończyć się przed wskazaniem pola, jeśli brakuje ścieżki lub narzędzia. Sprawdź nakładkę i wyrenderuj ze stanowiska. [Przyczyna i kontrola](guides#guide=release-overlays&section=q108-overlay-render-observer-input)
diagnostics.probe_0_1: Kontrola zastosowania może skończyć się przed porównaniem obiektów, gdy nie renderuje nakładki lub nie może otworzyć katalogu. Sprawdź render oraz dostęp lokalny i do klastra. [Przyczyna i kontrola](guides#guide=release-overlays&section=q108-applied-overlay-observer-input)
