title: Nakładki Kustomize
brief: "Środowisko przywracania nie osiąga wymaganej skali i trasy. Zachowaj oryginalny Deployment ze spójną wyrenderowaną\
  \ i działającą konfiguracją.\n\nPracuj w `~/quest` na workstation. Dostarczone pliki: `base/board.json`, `base/kustomization.yaml`,\
  \ `overlays/recovery/kustomization.yaml`, `original-deployment-uid`.\n\n**Wymagania:**\n- Deployment `board` zachowuje\
  \ oryginalny UID z `/run/dq/facts/0/original-deployment-uid` na workstation.\n- Overlay Kustomize `overlays/recovery`\
  \ w `~/quest` na workstation renderuje się poprawnie.\n- Wyrenderowany ConfigMap zawiera tylko `ROUTE` o wartości\
  \ `north-108`.\n- Nazwa wyrenderowanego ConfigMap zaczyna się od `route-`.\n- Overlay `overlays/recovery`:\n \
  \ - repliki wyrenderowanego Deployment `2`.\n- Deployment `board`:\n  - repliki `2`.\n- Deployment `board`:\n\
  \  - gotowe repliki `2`.\n- Kontener aplikacji Deployment `board` udostępnia tylko `ROUTE`, pochodzące z klucza\
  \ `ROUTE` wyrenderowanego ConfigMap zamiast wbudowanej wartości.\n- Ten działający ConfigMap zawiera tylko `ROUTE`\
  \ o wartości `north-108`.\n- Z `deployment/board` HTTP `http://board:8080` zwraca `north-108`.\n\n**Sprawdź samodzielnie\
  \ przed Check & finish:**\nWykonuj te polecenia obserwacyjne w `~/quest` na workstation; `kubectl exec` obserwuje\
  \ kontener wskazanego obciążenia.\n- `kubectl kustomize overlays/recovery` — Wyrenderowane ConfigMap i Deployment\
  \ odpowiadają wymaganiom.\n- Ustawienia, tożsamość i status odpowiadają wymaganiom.\n\n  ```sh\n  kubectl get\
  \ deployment board -o yaml\n  name=$(kubectl get deployment board -o jsonpath='{.spec.template.spec.containers[0].env[0].valueFrom.configMapKeyRef.name}')\n\
  \  kubectl get configmap \"$name\" -o yaml\n  cat /run/dq/facts/0/original-deployment-uid\n  ```\n- `kubectl exec\
  \ deployment/board -- wget -qO- -T 3 http://board:8080` — Odbiorca otrzymuje `north-108`.\n\nPrefiks nazwy nie\
  \ dowodzi sufiksu hash, historii edycji ani niezmienności bazy.\n"
debrief: Zmiana środowiska została zakodowana w pliku overlay wielokrotnego użytku, a wygenerowana konfiguracja
  identity umożliwiła rzeczywiste wdrożenie.
stages.0.brief: 'Oryginalny Deployment ma obsługiwać wymaganą trasę z wyrenderowaną konfiguracją przywracania.

  '
hints.0.text: Łatka może utracić zamierzony zasób, jeśli target name jest nieprawidłowy.
hints.1.text: Sprawdź renderowany wynik przed zastosowaniem overlay.
hints.2.text: 'Popraw cel w overlay; pozwól generatorowi zaktualizować odwołanie środowiska i rollout. Dostarczony
  patch wskazuje nieistniejący Deployment; użyj board jako celu i zastosuj overlays/recovery. Zachowaj bazę wielokrotnego
  użytku i włączony sufiks hash generatora.

  '
phrases.0: Przed zastosowaniem sprawdziłem wyrenderowane wyjście Kustomize.
phrases.1: Zachowałem różnice środowiskowe poza urządzeniem base wielokrotnego użytku.
phrases.2: Sprawdziłem wygenerowane odniesienie do konfiguracji i odpowiedź na żywo.
questions.0.points.0: NIE; renderuje zasoby przed ich wysłaniem do API.
questions.0.points.1: Do ciągłego wymuszania pożądanego stanu potrzebny jest osobny moduł reconciler.
questions.0.prompt: Czy Kustomize działa jako kontroler po stronie serwera?
questions.1.points.0: Wygenerowana nazwa ulega zmianie, a Kustomize aktualizuje odniesienie do szablonu Pod.
questions.1.points.1: Zmieniony szablon Deployment Pod tworzy nową wersję.
questions.1.prompt: Dlaczego wygenerowany ConfigMap hash może wywołać rollout?
