stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    check: 'kubectl get pvc route-data -o json | jq -e --arg uid "$(cat original-pvc-uid)" ''.metadata.uid==$uid
      and .status.phase=="Bound"'' >/dev/null

      kubectl get deployment reader -o json | jq -e ''.spec.template.spec.volumes==[{"name":"data","persistentVolumeClaim":{"claimName":"route-data"}}]
      and .spec.template.spec.containers[0].volumeMounts==[{"name":"data","mountPath":"/data","readOnly":true}]''
      >/dev/null

      kubectl rollout status deployment/reader --timeout=3s >/dev/null

      test "$(kubectl exec deployment/reader -- cat /data/route.txt)" = north-45'
