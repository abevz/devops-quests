title: Almacenamiento
brief: |
  El consumidor de datos no está disponible. Los datos de ruta existentes deben conservarse.

  Trabaja en la workstation en `~/quest` con `reader.yaml`.

  **Requisitos:**
  - Deployment `reader` completa su rollout.
  - Dentro de su contenedor `worker`, `/data/route.txt` contiene `north-45`.
  - Los datos provienen del claim existente que ya los contiene, montado de solo lectura en `/data`. Es el único volumen y el único montaje, sin otros ajustes.
  - El claim existente se conserva: no se elimina ni se vuelve a crear.
debrief: La referencia del consumidor se reparó sin reemplazar el objeto de datos persistentes.
stages.0.brief: Restaura el consumidor sin tocar los datos almacenados.
stages.0.objectives.0.text: 'El claim de datos existente está Bound y conserva su identidad: no se volvió a crear.'
stages.0.objectives.1.text: Deployment `reader` monta solo el claim de datos existente, de solo lectura en `/data`.
stages.0.objectives.2.text: El Deployment `reader` completa su rollout.
stages.0.objectives.3.text: '`/data/route.txt` en el Deployment `reader` contiene `north-45`.'
hints.0.text: Un Pod puede quedarse en Pending cuando hace referencia a un almacenamiento que no existe, aunque el almacenamiento real esté sano.
hints.1.text: 'Compara lo que solicita el Deployment con lo que existe: `kubectl describe pod -l app=reader` (eventos), `kubectl get pvc` y los volúmenes de `reader.yaml`.'
hints.2.text: 'Apunta el volumen al claim existente, mantén el montaje de solo lectura y aplica `reader.yaml`. Para comprobarlo: `kubectl rollout status deployment/reader`; `kubectl exec deploy/reader -c worker -- cat /data/route.txt` imprime `north-45`; `kubectl exec deploy/reader -c worker -- touch /data/x` falla con «Read-only file system».'
phrases.0: Reutilicé el bound claim en lugar de recrear el objeto de datos.
phrases.1: Verifiqué el claim UID original y el contenido a través del reader reparado.
phrases.2: Distinguí la persistencia local de la recuperación después de perder un nodo.
questions.0.points.0: Inspeccione binding, los eventos y el nombre claim solicitado.
questions.0.points.1: Comprenda reclaim policy y dónde residen los datos.
questions.0.points.2: Proteja identity y verifique las copias de seguridad antes de una recuperación destructiva.
questions.0.prompt: ¿Qué verificas antes de eliminar un claim usado por un Pod averiado?
questions.1.points.0: La persistencia depende del storage backend real.
questions.1.points.1: El almacenamiento local puede estar vinculado al nodo fallido.
questions.1.points.2: Las copias de seguridad y la restauración probada siguen siendo necesarias.
questions.1.prompt: ¿Un PVC garantiza la recuperación después de perder un nodo?
