title: Almacenamiento
brief: |
  El consumidor de datos no está disponible. Los datos de ruta existentes deben conservarse.

  Trabaja en la workstation en `~/quest` con `reader.yaml`, `original-pvc-uid`.

  **Requisitos:**
  - PVC existente `route-data`:
    - Fase: `Bound`.
    - Su UID coincide con `~/quest/original-pvc-uid` en la workstation.
  - Almacenamiento de Deployment `reader`:
    - El único volumen es `data` y usa el PVC existente `route-data`.
    - El contenedor `worker` tiene exactamente un montaje: el volumen `data` en `/data`, de solo lectura, sin otros ajustes.
    - `/data/route.txt` dentro de ese contenedor contiene `north-45`.
  - Disponibilidad de la carga:
    - Deployment: `reader`.
    - Estado: Rollout completado.

  **Verifica antes de Check & finish:**
  - `kubectl get pvc route-data -o json` y `cat ~/quest/original-pvc-uid` — muestran fase `Bound` y el mismo UID. El archivo de referencia está en la workstation.
  - `kubectl get deployment reader -o json` y `kubectl rollout status deployment/reader --timeout=3s` — muestran exactamente el contrato de volumen/montaje requerido y un rollout completado.
  - `kubectl exec deployment/reader -- cat /data/route.txt` — imprime `north-45` desde el contenedor.
debrief: La referencia del consumidor se reparó sin reemplazar el objeto de datos persistentes.
stages.0.brief: |
  No elimines ni recrees el claim de datos.
stages.0.objectives.0.text: El PVC `route-data` está Bound y conserva su UID original.
stages.0.objectives.1.text: El Deployment `reader` monta solo el PVC `route-data` como volumen `data`,
  en modo de solo lectura en `/data`.
stages.0.objectives.2.text: El Deployment `reader` completa su rollout.
stages.0.objectives.3.text: '`/data/route.txt` en el Deployment `reader` contiene `north-45`.'
hints.0.text: |
  Una falla mount puede provenir de la referencia claim incluso cuando el almacenamiento está en buen estado. El archivo reader.yaml suministrado solicita el claim inexistente retired-data.
hints.1.text: Inspeccione los eventos PVC identity y Pod antes de eliminar el almacenamiento.
hints.2.text: Repare volumes[].persistentVolumeClaim.claimName y mantenga readOnly en el mount.
phrases.0: Reutilicé el bound claim en lugar de recrear el objeto de datos.
phrases.1: Verifiqué el claim UID original y el contenido a través del reader reparado.
phrases.2: Distinguí la persistencia local de la recuperación después de perder un nodo.
questions.0.points.0: Inspeccione binding, los eventos y el nombre claim solicitado.
questions.0.points.1: Comprenda reclaim policy y dónde residen los datos.
questions.0.points.2: Proteja identity y verifique las copias de seguridad antes de una recuperación destructiva.
questions.0.prompt: ¿Qué verificas antes de eliminar un claim usado por un Pod averiado?
questions.1.points.0: La persistencia depende del storage backend real.
questions.1.points.1: El almacenamiento local puede estar vinculado al nodo fallido.
questions.1.points.2: Las copias de seguridad y la restauración probada siguen siendo necesarias.
questions.1.prompt: ¿Un PVC garantiza la recuperación después de perder un nodo?
