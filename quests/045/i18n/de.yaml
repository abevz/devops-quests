title: Lagerung
brief: |
  Der Datennutzer ist nicht verfügbar. Die bestehenden Routendaten müssen erhalten bleiben.

  Arbeiten Sie auf der Workstation in `~/quest` mit `reader.yaml`.

  **Anforderungen:**
  - Deployment `reader` schließt seinen Rollout ab.
  - In seinem Container `worker` enthält `/data/route.txt` den Wert `north-45`.
  - Die Daten stammen aus dem bestehenden Claim, der sie bereits enthält, schreibgeschützt unter `/data` eingebunden. Es ist das einzige Volume und der einzige Mount, ohne weitere Einstellungen.
  - Der bestehende Claim bleibt erhalten: nicht gelöscht und nicht neu erstellt.
debrief: Die Consumer-Referenz wurde repariert, ohne das persistente Datenobjekt zu ersetzen.
stages.0.brief: Stellen Sie den Verbraucher wieder her, ohne die gespeicherten Daten anzutasten.
stages.0.objectives.0.text: 'Der bestehende Daten-Claim ist Bound und behält seine Identität: Er wurde nicht neu erstellt.'
stages.0.objectives.1.text: Deployment `reader` bindet nur den bestehenden Daten-Claim ein, schreibgeschützt unter `/data`.
stages.0.objectives.2.text: Deployment `reader` schließt seinen Rollout ab.
stages.0.objectives.3.text: '`/data/route.txt` im Deployment `reader` enthält `north-45`.'
hints.0.text: Ein Pod kann Pending bleiben, wenn er auf nicht vorhandenen Speicher verweist, auch wenn der eigentliche Speicher intakt ist.
hints.1.text: 'Vergleichen Sie, was das Deployment anfordert, mit dem, was existiert: `kubectl describe pod -l app=reader` (Events), `kubectl get pvc` und die Volumes in `reader.yaml`.'
hints.2.text: 'Richten Sie das Volume auf den bestehenden Claim, lassen Sie den Mount schreibgeschützt und wenden Sie `reader.yaml` an. Zur Kontrolle: `kubectl rollout status deployment/reader`; `kubectl exec deploy/reader -c worker -- cat /data/route.txt` gibt `north-45` aus; `kubectl exec deploy/reader -c worker -- touch /data/x` schlägt mit „Read-only file system“ fehl.'
phrases.0: Ich habe das bound claim wiederverwendet, anstatt das Datenobjekt neu zu erstellen.
phrases.1: Ich habe das Original claim UID und den Inhalt durch das reparierte reader überprüft.
phrases.2: Ich habe die lokale Persistenz von der Wiederherstellung nach dem Verlust eines Knotens unterschieden.
questions.0.points.0: Überprüfen Sie binding, Ereignisse und den angeforderten claim-Namen.
questions.0.points.1: Verstehen Sie reclaim policy und den Speicherort der Daten.
questions.0.points.2: Schützen Sie identity und überprüfen Sie Backups vor einer destruktiven Wiederherstellung.
questions.0.prompt: Was überprüfen Sie, bevor Sie einen claim löschen, der von einem defekten Pod verwendet
  wird?
questions.1.points.0: Die Persistenz hängt vom tatsächlichen storage backend ab.
questions.1.points.1: Der lokale Speicher ist möglicherweise an den ausgefallenen Knoten gebunden.
questions.1.points.2: Backups und getestete Wiederherstellungen bleiben weiterhin notwendig.
questions.1.prompt: Garantiert ein PVC die Wiederherstellung nach dem Verlust eines Knotens?
