title: Lagerung
brief: |
  Der Datennutzer ist nicht verfügbar. Die bestehenden Routendaten müssen erhalten bleiben.

  Arbeiten Sie auf der Workstation in `~/quest` mit `reader.json`, `original-pvc-uid`.

  **Anforderungen:**
  - Bestehender PVC `route-data`:
    - Phase: `Bound`.
    - Seine UID stimmt mit `~/quest/original-pvc-uid` auf der Workstation überein.
  - Speicher von Deployment `reader`:
    - Genau ein Volume mit diesem vollständigen Objekt und ohne zusätzliche Felder: `{"name":"data","persistentVolumeClaim":{"claimName":"route-data"}}`.
    - Genau ein Mount im ersten Container (`worker`) mit diesem vollständigen Objekt und ohne zusätzliche Felder: `{"name":"data","mountPath":"/data","readOnly":true}`. `/data` liegt in diesem Container.
    - `/data/route.txt` in diesem Container enthält `north-45`.
  - Verfügbarkeit des Workloads:
    - Deployment: `reader`.
    - Status: Rollout abgeschlossen.

  **Selbstprüfung vor Check & finish:**
  - `kubectl get pvc route-data -o json` und `cat ~/quest/original-pvc-uid` — zeigen Phase `Bound` und dieselbe UID. Die Referenzdatei liegt auf der Workstation.
  - `kubectl get deployment reader -o json` und `kubectl rollout status deployment/reader --timeout=3s` — zeigen genau den geforderten Volume-/Mount-Vertrag und einen abgeschlossenen Rollout.
  - `kubectl exec deployment/reader -- cat /data/route.txt` — gibt `north-45` aus dem Container aus.
debrief: Die Consumer-Referenz wurde repariert, ohne das persistente Datenobjekt zu ersetzen.
stages.0.brief: |
  Löschen oder erstellen Sie den Daten-Claim nicht neu.
stages.0.objectives.0.text: PVC `route-data` ist Bound und behält seine ursprüngliche UID.
stages.0.objectives.1.text: Deployment `reader` bindet nur PVC `route-data` als Volume `data` ein, schreibgeschützt
  unter `/data`.
stages.0.objectives.2.text: Deployment `reader` schließt seinen Rollout ab.
stages.0.objectives.3.text: '`/data/route.txt` im Deployment `reader` enthält `north-45`.'
hints.0.text: |
  Ein mount-Fehler kann von der claim-Referenz herrühren, selbst wenn der Speicher fehlerfrei ist. Die bereitgestellte reader.json fordert den nicht existierenden Claim retired-data an.
hints.1.text: Überprüfen Sie die Ereignisse PVC identity und Pod, bevor Sie den Speicher löschen.
hints.2.text: Reparieren Sie volumes[].persistentVolumeClaim.claimName und behalten Sie readOnly auf dem
  mount bei.
phrases.0: Ich habe das bound claim wiederverwendet, anstatt das Datenobjekt neu zu erstellen.
phrases.1: Ich habe das Original claim UID und den Inhalt durch das reparierte reader überprüft.
phrases.2: Ich habe die lokale Persistenz von der Wiederherstellung nach dem Verlust eines Knotens unterschieden.
questions.0.points.0: Überprüfen Sie binding, Ereignisse und den angeforderten claim-Namen.
questions.0.points.1: Verstehen Sie reclaim policy und den Speicherort der Daten.
questions.0.points.2: Schützen Sie identity und überprüfen Sie Backups vor einer destruktiven Wiederherstellung.
questions.0.prompt: Was überprüfen Sie, bevor Sie einen claim löschen, der von einem defekten Pod verwendet
  wird?
questions.1.points.0: Die Persistenz hängt vom tatsächlichen storage backend ab.
questions.1.points.1: Der lokale Speicher ist möglicherweise an den ausgefallenen Knoten gebunden.
questions.1.points.2: Backups und getestete Wiederherstellungen bleiben weiterhin notwendig.
questions.1.prompt: Garantiert ein PVC die Wiederherstellung nach dem Verlust eines Knotens?
