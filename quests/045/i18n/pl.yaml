title: Składowanie
brief: |
  Odbiorca danych jest niedostępny. Istniejące dane trasy muszą zostać zachowane.

  Pracuj na workstation w `~/quest` z plikiem `reader.yaml`.

  **Wymagania:**
  - Deployment `reader` kończy rollout.
  - W jego kontenerze `worker` plik `/data/route.txt` zawiera `north-45`.
  - Dane pochodzą z istniejącego claimu, który już je przechowuje, zamontowanego tylko do odczytu w `/data`. To jedyny wolumen i jedyne montowanie, bez innych ustawień.
  - Istniejący claim zostaje zachowany: nie jest usuwany ani tworzony od nowa.
debrief: Odniesienie konsumenta zostało naprawione bez wymiany trwałego obiektu danych.
stages.0.brief: Przywróć odbiorcę, nie naruszając zapisanych danych.
stages.0.objectives.0.text: 'Istniejący claim z danymi ma stan Bound i zachowuje swoją tożsamość: nie został utworzony od nowa.'
stages.0.objectives.1.text: Deployment `reader` montuje tylko istniejący claim z danymi, tylko do odczytu w `/data`.
stages.0.objectives.2.text: Deployment `reader` kończy rollout.
stages.0.objectives.3.text: '`/data/route.txt` w Deployment `reader` zawiera `north-45`.'
hints.0.text: Pod może pozostać w stanie Pending, gdy odwołuje się do nieistniejącej pamięci trwałej, nawet jeśli właściwa pamięć jest sprawna.
hints.1.text: 'Porównaj to, czego żąda Deployment, z tym, co istnieje: `kubectl describe pod -l app=reader` (zdarzenia), `kubectl get pvc` i wolumeny w `reader.yaml`.'
hints.2.text: 'Skieruj wolumen na istniejący claim, pozostaw montowanie tylko do odczytu i zastosuj `reader.yaml`. Aby sprawdzić: `kubectl rollout status deployment/reader`; `kubectl exec deploy/reader -- cat /data/route.txt` wypisuje `north-45`; `kubectl exec deploy/reader -- touch /data/x` kończy się błędem „Read-only file system”.'
phrases.0: Zamiast odtwarzać obiekt danych, ponownie użyłem bound claim.
phrases.1: Sprawdziłem oryginalne roszczenie UID i jego zawartość poprzez naprawiony reader.
phrases.2: Rozróżniłem trwałość lokalną od odzyskiwania po utracie węzła.
questions.0.points.0: Sprawdź binding, zdarzenia i żądaną nazwę claim.
questions.0.points.1: Zrozum reclaim policy i miejsce przechowywania danych.
questions.0.points.2: Chroń identity i weryfikuj kopie zapasowe przed destrukcyjnym odzyskiwaniem.
questions.0.prompt: Co sprawdzasz przed usunięciem claim używanego przez uszkodzony Pod?
questions.1.points.0: Trwałość zależy od rzeczywistego storage backend.
questions.1.points.1: Pamięć lokalna może być powiązana z uszkodzonym węzłem.
questions.1.points.2: Konieczne są nadal kopie zapasowe i przetestowane przywracanie.
questions.1.prompt: Czy PVC gwarantuje odzyskanie danych po utracie węzła?
