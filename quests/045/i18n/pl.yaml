title: Składowanie
brief: |
  Odbiorca danych jest niedostępny. Istniejące dane trasy muszą zostać zachowane.

  Pracuj na workstation w `~/quest` z plikami `reader.yaml`, `original-pvc-uid`.

  **Wymagania:**
  - Istniejący PVC `route-data`:
    - Faza: `Bound`.
    - Jego UID odpowiada `~/quest/original-pvc-uid` na workstation.
  - Pamięć trwała Deployment `reader`:
    - Dokładnie jeden wolumen z tym pełnym obiektem i bez dodatkowych pól: `{"name":"data","persistentVolumeClaim":{"claimName":"route-data"}}`.
    - Dokładnie jedno montowanie w pierwszym kontenerze (`worker`) z tym pełnym obiektem i bez dodatkowych pól: `{"name":"data","mountPath":"/data","readOnly":true}`. `/data` znajduje się wewnątrz tego kontenera.
    - `/data/route.txt` wewnątrz tego kontenera zawiera `north-45`.
  - Dostępność obciążenia:
    - Deployment: `reader`.
    - Stan: Rollout zakończony.

  **Sprawdź przed Check & finish:**
  - `kubectl get pvc route-data -o json` i `cat ~/quest/original-pvc-uid` — pokazują fazę `Bound` i ten sam UID. Plik referencyjny znajduje się na workstation.
  - `kubectl get deployment reader -o json` i `kubectl rollout status deployment/reader --timeout=3s` — pokazują dokładnie wymagany kontrakt wolumenu/montowania i zakończony rollout.
  - `kubectl exec deployment/reader -- cat /data/route.txt` — wypisuje `north-45` z kontenera.
debrief: Odniesienie konsumenta zostało naprawione bez wymiany trwałego obiektu danych.
stages.0.brief: |
  Nie usuwaj ani nie twórz ponownie claimu z danymi.
stages.0.objectives.0.text: PVC `route-data` jest Bound i zachowuje pierwotny UID.
stages.0.objectives.1.text: Deployment `reader` montuje tylko PVC `route-data` jako wolumen `data`, w
  trybie tylko do odczytu w `/data`.
stages.0.objectives.2.text: Deployment `reader` kończy rollout.
stages.0.objectives.3.text: '`/data/route.txt` w Deployment `reader` zawiera `north-45`.'
hints.0.text: |
  Awaria mount może wynikać z odniesienia claim nawet wtedy, gdy pamięć masowa jest w dobrym stanie. Dostarczony reader.yaml żąda nieistniejącego claimu retired-data.
hints.1.text: Przed usunięciem pamięci sprawdź tożsamość PVC i zdarzenia Pod.
hints.2.text: Napraw volumes[].persistentVolumeClaim.claimName i zachowaj readOnly na mount.
phrases.0: Zamiast odtwarzać obiekt danych, ponownie użyłem bound claim.
phrases.1: Sprawdziłem oryginalne roszczenie UID i jego zawartość poprzez naprawiony reader.
phrases.2: Rozróżniłem trwałość lokalną od odzyskiwania po utracie węzła.
questions.0.points.0: Sprawdź binding, zdarzenia i żądaną nazwę claim.
questions.0.points.1: Zrozum reclaim policy i miejsce przechowywania danych.
questions.0.points.2: Chroń identity i weryfikuj kopie zapasowe przed destrukcyjnym odzyskiwaniem.
questions.0.prompt: Co sprawdzasz przed usunięciem claim używanego przez uszkodzony Pod?
questions.1.points.0: Trwałość zależy od rzeczywistego storage backend.
questions.1.points.1: Pamięć lokalna może być powiązana z uszkodzonym węzłem.
questions.1.points.2: Konieczne są nadal kopie zapasowe i przetestowane przywracanie.
questions.1.prompt: Czy PVC gwarantuje odzyskanie danych po utracie węzła?
