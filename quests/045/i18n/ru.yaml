title: Хранилище
brief: |
  Потребитель данных недоступен. Существующие данные маршрута должны сохраниться.

  Работайте на workstation в `~/quest` с файлами `reader.json`, `original-pvc-uid`.

  **Требования:**
  - Существующий PVC `route-data`:
    - Фаза: `Bound`.
    - Его UID совпадает с `~/quest/original-pvc-uid` на workstation.
  - Хранилище Deployment `reader`:
    - Ровно один volume с таким полным объектом без дополнительных полей: `{"name":"data","persistentVolumeClaim":{"claimName":"route-data"}}`.
    - Ровно один mount в первом контейнере (`worker`) с таким полным объектом без дополнительных полей: `{"name":"data","mountPath":"/data","readOnly":true}`. `/data` находится внутри этого контейнера.
    - `/data/route.txt` внутри этого контейнера содержит `north-45`.
  - Доступность нагрузки:
    - Deployment: `reader`.
    - Состояние: Rollout завершён.

  **Самопроверка перед Check & finish:**
  - `kubectl get pvc route-data -o json` и `cat ~/quest/original-pvc-uid` — показывают фазу `Bound` и одинаковый UID. Эталонный файл находится на workstation.
  - `kubectl get deployment reader -o json` и `kubectl rollout status deployment/reader --timeout=3s` — показывают точный требуемый контракт volume/mount и завершённый rollout.
  - `kubectl exec deployment/reader -- cat /data/route.txt` — выводит `north-45` из контейнера.
debrief: Ссылка потребителя исправлена без замены объекта с постоянными данными.
stages.0.brief: |
  Не удаляйте и не создавайте заново claim с данными.
stages.0.objectives.0.text: PVC `route-data` находится в Bound и сохраняет исходный UID.
stages.0.objectives.1.text: Deployment `reader` монтирует только PVC `route-data` как volume `data`, только
  для чтения в `/data`.
stages.0.objectives.2.text: Deployment `reader` завершает rollout.
stages.0.objectives.3.text: '`/data/route.txt` в Deployment `reader` содержит `north-45`.'
hints.0.text: |
  Ошибка mount может быть в ссылке на claim при исправном хранилище. Выданный reader.json запрашивает несуществующий claim retired-data.
hints.1.text: Изучите identity PVC и события Pod до удаления хранилища.
hints.2.text: Исправьте volumes[].persistentVolumeClaim.claimName и сохраните readOnly
  в mount.
phrases.0: Я использовал существующий bound claim вместо пересоздания объекта данных.
phrases.1: Я проверил исходный UID claim и содержимое через исправленный reader.
phrases.2: Я отделил локальную сохранность данных от восстановления после потери узла.
questions.0.points.0: Изучить binding, события и имя запрошенного claim.
questions.0.points.1: Понять reclaim policy и расположение данных.
questions.0.points.2: Защитить identity и проверить резервные копии до разрушительного
  восстановления.
questions.0.prompt: Что нужно проверить до удаления claim неисправного Pod?
questions.1.points.0: Сохранность зависит от фактического storage backend.
questions.1.points.1: Локальное хранилище может зависеть от потерянного узла.
questions.1.points.2: Резервные копии и проверенное восстановление всё ещё нужны.
questions.1.prompt: Гарантирует ли PVC восстановление после потери узла?
