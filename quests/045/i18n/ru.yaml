title: Хранилище
brief: |
  Потребитель данных недоступен. Существующие данные маршрута должны сохраниться.

  Работайте на workstation в `~/quest` с файлом `reader.yaml`.

  **Требования:**
  - Deployment `reader` завершает rollout.
  - Внутри его контейнера `worker` файл `/data/route.txt` содержит `north-45`.
  - Данные берутся из существующего claim, в котором они уже хранятся, смонтированного только для чтения в `/data`. Это единственный volume и единственное монтирование, без других настроек.
  - Существующий claim сохраняется: не удаляется и не пересоздаётся.
debrief: Ссылка потребителя исправлена без замены объекта с постоянными данными.
stages.0.brief: Восстановите потребителя, не трогая сохранённые данные.
stages.0.objectives.0.text: 'Существующий claim с данными в состоянии Bound и сохраняет свою идентичность: он не пересоздавался.'
stages.0.objectives.1.text: Deployment `reader` монтирует только существующий claim с данными, только для чтения в `/data`.
stages.0.objectives.2.text: Deployment `reader` завершает rollout.
stages.0.objectives.3.text: '`/data/route.txt` в Deployment `reader` содержит `north-45`.'
hints.0.text: Pod может оставаться в Pending, если ссылается на несуществующее хранилище, даже когда настоящее хранилище исправно.
hints.1.text: 'Сравните, что запрашивает Deployment, с тем, что существует: `kubectl describe pod -l app=reader` (события), `kubectl get pvc` и тома в `reader.yaml`.'
hints.2.text: 'Направьте том на существующий claim, оставьте монтирование только для чтения и примените `reader.yaml`. Проверка: `kubectl rollout status deployment/reader`; `kubectl exec deploy/reader -- cat /data/route.txt` выводит `north-45`; `kubectl exec deploy/reader -- touch /data/x` завершается ошибкой «Read-only file system».'
phrases.0: Я использовал существующий bound claim вместо пересоздания объекта данных.
phrases.1: Я проверил исходный UID claim и содержимое через исправленный reader.
phrases.2: Я отделил локальную сохранность данных от восстановления после потери узла.
questions.0.points.0: Изучить binding, события и имя запрошенного claim.
questions.0.points.1: Понять reclaim policy и расположение данных.
questions.0.points.2: Защитить identity и проверить резервные копии до разрушительного
  восстановления.
questions.0.prompt: Что нужно проверить до удаления claim неисправного Pod?
questions.1.points.0: Сохранность зависит от фактического storage backend.
questions.1.points.1: Локальное хранилище может зависеть от потерянного узла.
questions.1.points.2: Резервные копии и проверенное восстановление всё ещё нужны.
questions.1.prompt: Гарантирует ли PVC восстановление после потери узла?
