title: Storage
brief: |
  The data consumer is unavailable. The existing route data must remain intact.

  Work on the workstation in `~/quest` with `reader.yaml`, `original-pvc-uid`.

  **Requirements:**
  - Existing PVC `route-data`:
    - Phase: `Bound`.
    - Its UID matches `~/quest/original-pvc-uid` on the workstation.
  - Storage of Deployment `reader`:
    - Exactly one volume with this complete object and no additional fields: `{"name":"data","persistentVolumeClaim":{"claimName":"route-data"}}`.
    - Exactly one mount in the first container (`worker`), with this complete object and no additional fields: `{"name":"data","mountPath":"/data","readOnly":true}`. `/data` is inside that container.
    - `/data/route.txt` inside that container contains `north-45`.
  - Workload availability:
    - Deployment: `reader`.
    - Status: Rollout completes.

  **Verify yourself before Check & finish:**
  - `kubectl get pvc route-data -o json` and `cat ~/quest/original-pvc-uid` — show phase `Bound` and the same UID. The reference file is on the workstation.
  - `kubectl get deployment reader -o json` and `kubectl rollout status deployment/reader --timeout=3s` — show exactly the required volume/mount contract and a completed rollout.
  - `kubectl exec deployment/reader -- cat /data/route.txt` — prints `north-45` from inside the container.
debrief: The consumer reference was repaired without replacing the persistent data
  object.
stages.0.brief: |
  Do not delete or recreate the data claim.
stages.0.objectives.0.text: PVC `route-data` is Bound and retains its original UID.
stages.0.objectives.1.text: Deployment `reader` mounts only PVC `route-data` as volume `data`, read-only
  at `/data`.
stages.0.objectives.2.text: Deployment `reader` completes its rollout.
stages.0.objectives.3.text: '`/data/route.txt` in Deployment `reader` contains `north-45`.'
hints.0.text: |
  A mount failure can come from the claim reference even when storage is healthy. The supplied reader.yaml requests the nonexistent retired-data claim.
hints.1.text: Inspect PVC identity and Pod events before deleting storage.
hints.2.text: Repair volumes[].persistentVolumeClaim.claimName and keep readOnly on
  the mount.
phrases.0: I reused the bound claim instead of recreating the data object.
phrases.1: I verified the original claim UID and the contents through the repaired
  reader.
phrases.2: I distinguished local persistence from recovery after losing a node.
questions.0.points.0: Inspect binding, events and the requested claim name.
questions.0.points.1: Understand reclaim policy and where the data lives.
questions.0.points.2: Protect identity and verify backups before destructive recovery.
questions.0.prompt: What do you check before deleting a claim used by a broken Pod?
questions.1.points.0: Persistence depends on the actual storage backend.
questions.1.points.1: Local storage may be tied to the failed node.
questions.1.points.2: Backups and tested restore remain necessary.
questions.1.prompt: Does a PVC guarantee recovery after losing a node?
