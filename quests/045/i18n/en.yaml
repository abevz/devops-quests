title: Storage
brief: 'The data already exists in PVC route-data: /data/route.txt contains north-45. The reader Deployment
  requests the nonexistent retired-data claim. Attach the existing claim read-only at /data, preserving
  its UID from original-pvc-uid and its contents. Do not delete or recreate the data claim.


  Quest files in `~/quest` (some appear in later stages): `claim.json`, `seed.json`, `reader.json`, `original-pvc-uid`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: The original Bound claim UID survives; reader mounts it read-only and reads
  north-45.'
debrief: The consumer reference was repaired without replacing the persistent data object.
stages.0.brief: 'The original Bound claim UID survives; reader mounts it read-only and reads north-45.


  Success criteria: The original Bound claim UID survives; reader mounts it read-only and reads north-45.'
stages.0.objectives.0.text: The original Bound claim UID survives; reader mounts it read-only and reads
  north-45.
hints.0.text: A mount failure can come from the claim reference even when storage is healthy.
hints.1.text: Inspect PVC identity and Pod events before deleting storage.
hints.2.text: Repair volumes[].persistentVolumeClaim.claimName and keep readOnly on the mount.
phrases.0: I reused the bound claim instead of recreating the data object.
phrases.1: I verified the original claim UID and the contents through the repaired reader.
phrases.2: I distinguished local persistence from recovery after losing a node.
questions.0.points.0: Inspect binding, events and the requested claim name.
questions.0.points.1: Understand reclaim policy and where the data lives.
questions.0.points.2: Protect identity and verify backups before destructive recovery.
questions.0.prompt: What do you check before deleting a claim used by a broken Pod?
questions.1.points.0: Persistence depends on the actual storage backend.
questions.1.points.1: Local storage may be tied to the failed node.
questions.1.points.2: Backups and tested restore remain necessary.
questions.1.prompt: Does a PVC guarantee recovery after losing a node?
