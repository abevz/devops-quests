title: Storage
brief: |
  The data consumer is unavailable. The existing route data must remain intact.

  Work on the workstation in `~/quest` with `reader.yaml`.

  **Requirements:**
  - Deployment `reader` completes its rollout.
  - Inside its container `worker`, `/data/route.txt` contains `north-45`.
  - The data comes from the existing claim that already holds it, mounted read-only at `/data`. It is the only volume and the only mount, with no other settings.
  - The existing claim is kept: not deleted or recreated.
debrief: The consumer reference was repaired without replacing the persistent data
  object.
stages.0.brief: Restore the consumer without touching the stored data.
stages.0.objectives.0.text: 'The existing data claim is Bound and keeps its identity: it was not recreated.'
stages.0.objectives.1.text: Deployment `reader` mounts only the existing data claim, read-only at `/data`.
stages.0.objectives.2.text: Deployment `reader` completes its rollout.
stages.0.objectives.3.text: '`/data/route.txt` in Deployment `reader` contains `north-45`.'
hints.0.text: A Pod can stay Pending when it references storage that does not exist, even if the real storage is healthy.
hints.1.text: 'Compare what the Deployment requests with what exists: `kubectl describe pod -l app=reader` (events), `kubectl get pvc`, and the volumes in `reader.yaml`.'
hints.2.text: 'Point the volume at the existing claim, keep the mount read-only and apply `reader.yaml`. To confirm: `kubectl rollout status deployment/reader`; `kubectl exec deploy/reader -- cat /data/route.txt` prints `north-45`; `kubectl exec deploy/reader -- touch /data/x` fails with "Read-only file system".'
phrases.0: I reused the bound claim instead of recreating the data object.
phrases.1: I verified the original claim UID and the contents through the repaired
  reader.
phrases.2: I distinguished local persistence from recovery after losing a node.
questions.0.points.0: Inspect binding, events and the requested claim name.
questions.0.points.1: Understand reclaim policy and where the data lives.
questions.0.points.2: Protect identity and verify backups before destructive recovery.
questions.0.prompt: What do you check before deleting a claim used by a broken Pod?
questions.1.points.0: Persistence depends on the actual storage backend.
questions.1.points.1: Local storage may be tied to the failed node.
questions.1.points.2: Backups and tested restore remain necessary.
questions.1.prompt: Does a PVC guarantee recovery after losing a node?
