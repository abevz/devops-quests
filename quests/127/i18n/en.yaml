diagnostics.probe_0_0: The Service path or retained query-consumer inputs/code could not be verified.
diagnostics.observer_identity: An original metrics object or query-consumer identity or provided application image
  changed or is unavailable.
diagnostics.observer_code: The supplied polling ConfigMap, program bytes or actual launch configuration changed.
diagnostics.observer_template: Desired query inputs still select a different metric family, job, route or operation.
diagnostics.observer_current: A current owned query-consumer Pod is missing, not ready, or still running different
  inputs.
diagnostics.observer_delivery: A current query snapshot is unavailable or does not contain the declared aggregate
  result.
diagnostics.observer_progress: The observation count did not advance, reset or could not establish current polling
  progress.
diagnostics.probe_0_1: Current aggregate publication and polling progress could not be verified.
