title: Prometheus scrape diagnosis
brief: |-
  Monitoring is not showing the expected board queue results. Restore real scrape health and the agreed gauge observations.

  Work on the workstation in `~/quest` with the supplied files:
  - `metrics.yaml`, `board.yaml`, `service.yaml`, `client.yaml`, `prometheus-target.json`.

  **Requirements:**

  - The existing board Service reaches only the supplied board workload through its declared HTTP interface and application listener.
  - Private Prometheus reports one `up` result of `1` for job `board`, and at least one active `board` target is `up` with no scrape error.
  - For job `board` and route `north`, `station_queue_depth` has exactly `2` series with sum `7`; both aggregate queries succeed with one result.

  The gauge is a synthetic training fixture; Prometheus and its two-second scrape are real. Checks observe current Service/query results, not edit history or who issued queries.
debrief: A real scrape and query proved recovery; readiness alone would not prove recorded application
  metrics.
stages.0.brief: Report real scrape and gauge observations, not inferred traffic history.
hints.0.text: Separate exporter response, Service forwarding and scrape health.
hints.1.text: |-
  An up value of zero means the scrape failed, not that the queue is empty. Queue depth is a current-value gauge, so `rate()` is not appropriate for it.

  Inspect the supplied inputs and live observations:

  ```sh
  kubectl get service board -o yaml
  cat prometheus-target.json
  ```
hints.2.text: |-
  Repair the Service backend port, wait for a scrape and query both count and sum. The board listener serves `8080`, but the supplied Service backend is `8099`; restore only its targetPort to `8080` and wait for a scrape.

  Verify the result from `~/quest` on the workstation:

  - The query succeeds with one result whose value is `1`.

    ```sh
    url=$(jq -r .url prometheus-target.json)
    kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/query?query=up%7Bjob%3D%22board%22%7D"
    ```

  - Both queries succeed with one result: sum `7`, count `2`.

    ```sh
    url=$(jq -r .url prometheus-target.json)
    for aggregate in sum count; do
      kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/query?query=$aggregate%28station_queue_depth%7Bjob%3D%22board%22%2Croute%3D%22north%22%7D%29"
    done
    ```

  An active board target is up with no scrape error:

  ```sh
  url=$(jq -r .url prometheus-target.json)
  kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/targets?state=active"
  ```
phrases.0: I traced the scrape failure through the Service.
phrases.1: I verified up and the recorded metric labels.
phrases.2: I used aggregation appropriate for a gauge.
questions.0.points.0: Whether the last scrape of a target succeeded.
questions.0.points.1: It does not prove the business operation succeeded.
questions.0.prompt: What does up measure?
questions.1.points.0: The gauge already represents the current queue size.
questions.1.points.1: Rate is intended for counter changes over time.
questions.1.prompt: Why not rate a queue-depth gauge?
diagnostics.port: The first board Service port must be 8080.
diagnostics.target_port: The first board Service targetPort must be 8080.
diagnostics.selector: 'The board Service selector must be exactly app: board.'
diagnostics.target_health: An active board target must be up with an empty lastError.
diagnostics.up_status: up query must succeed.
diagnostics.up_count: up query must return exactly one result.
diagnostics.up_value: up query value must be 1.
diagnostics.sum_status: sum query must succeed.
diagnostics.sum_count: sum query must return exactly one result.
diagnostics.sum_value: sum query value must be 7.
diagnostics.count_status: count query must succeed.
diagnostics.count_count: count query must return exactly one result.
diagnostics.count_value: count query value must be 2.
