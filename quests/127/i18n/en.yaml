title: Prometheus scrape diagnosis
brief: 'A private pinned Prometheus scrapes board:8080/metrics.txt every two seconds. The board Pod serves
  a small synthetic queue gauge on 8080, but its Service forwards to 8099, so the target is down. Restore
  only Service targetPort 8080. Use the frozen Prometheus endpoint from a client Pod to verify target
  health, up=1, two north series and their sum 7. The supplied metrics are an explicit training fixture;
  the server and scrape are real. A gauge is a current value, so rate() is not appropriate for this queue
  depth.


  Quest files in `~/quest` (some appear in later stages): `metrics.json`, `board.json`, `service.json`,
  `client.json`, `prometheus-target.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: The real target is up, two north gauge series are recorded and their real
  PromQL sum is seven.'
debrief: A real scrape and query proved recovery; readiness alone would not prove recorded application
  metrics.
