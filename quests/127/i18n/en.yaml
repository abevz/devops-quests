title: Prometheus scrape diagnosis
brief: 'A private pinned Prometheus scrapes board:8080/metrics.txt every two seconds. The board Pod serves a small synthetic
  queue gauge on 8080, but its Service forwards to 8099, so the target is down. Restore only Service targetPort 8080. Use
  the frozen Prometheus endpoint from a client Pod to verify target health, up=1, two north series and their sum 7. The supplied
  metrics are an explicit training fixture; the server and scrape are real. A gauge is a current value, so rate() is not appropriate
  for this queue depth.


  Quest files in `~/quest` (some appear in later stages): `metrics.json`, `board.json`, `service.json`, `client.json`, `prometheus-target.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services. Change only this
  bay.


  Read `metrics.json`, `board.json`, `service.json`, `client.json` and `prometheus-target.json`. The first Service port and
  targetPort must both be 8080 and the selector exactly `app: board`. Using the frozen Prometheus URL, the `up{job="board"}`
  query must succeed with one result equal to 1; `sum(station_queue_depth{job="board",route="north"})` and `count` of those
  series must each succeed with one result equal to 7 and 2 respectively. At least one active `board` target must be `up`
  with an empty `lastError`. The checks observe the current Service and query results, not the edit history or whether you
  personally issued the queries.'
debrief: A real scrape and query proved recovery; readiness alone would not prove recorded application metrics.
stages.0.brief: The Service, active target and three Prometheus query results match the brief.
stages.0.objectives.0.text: The Service, active target and three Prometheus query results match the brief.
hints.0.text: Separate exporter response, Service forwarding and scrape health.
hints.1.text: An up value of zero means the scrape failed, not that the queue is empty.
hints.2.text: Repair the Service backend port, wait for a scrape and query both count and sum.
phrases.0: I traced the scrape failure through the Service.
phrases.1: I verified up and the recorded metric labels.
phrases.2: I used aggregation appropriate for a gauge.
questions.0.points.0: Whether the last scrape of a target succeeded.
questions.0.points.1: It does not prove the business operation succeeded.
questions.0.prompt: What does up measure?
questions.1.points.0: The gauge already represents the current queue size.
questions.1.points.1: Rate is intended for counter changes over time.
questions.1.prompt: Why not rate a queue-depth gauge?
diagnostics.port: The first board Service port must be 8080.
diagnostics.target_port: The first board Service targetPort must be 8080.
diagnostics.selector: 'The board Service selector must be exactly app: board.'
diagnostics.target_health: An active board target must be up with an empty lastError.
diagnostics.up_status: up query must succeed.
diagnostics.up_count: up query must return exactly one result.
diagnostics.up_value: up query value must be 1.
diagnostics.sum_status: sum query must succeed.
diagnostics.sum_count: sum query must return exactly one result.
diagnostics.sum_value: sum query value must be 7.
diagnostics.count_status: count query must succeed.
diagnostics.count_count: count query must return exactly one result.
diagnostics.count_value: count query value must be 2.
