title: Prometheus scrape diagnosis
brief: |-
  The private metrics path is not delivering the required observations. Restore scrape health and current aggregate delivery to both existing query consumers.

  Work on the workstation in `~/quest` with the supplied files:
  - `prometheus-target.json`.
  - `observer-contract.json`.

  **Requirements:**

  - The existing board Service reaches only the supplied board workload through its declared HTTP interface and application listener. Preserve the original Service, ConfigMaps and Deployment identities and provided images. Both desired and current query-consumer inputs must select the same metric family, job and route as the required observations and use the provided polling program unchanged, as specified by `observer-contract.json`.
  - Private Prometheus reports one `up` result of `1` for job `board`, and at least one active `board` target is `up` with no scrape error. Each supplied query consumer has one current ready Pod, serves its declared aggregate result and continues successful observations according to `observer-contract.json`.
  - For job `board` and route `north`, `station_queue_depth` has exactly `2` series with sum `7`; both aggregate queries succeed with one result.

  Checks observe current series, configuration, snapshots and progress, not the entire request or edit history. The supplied polling code and private Prometheus endpoint remain part of the bounded exercise.
debrief: The checks compared the preserved metric path, actual scrape health and series, retained consumer identities/code,
  desired and running inputs, current aggregate responses and observation progress.
stages.0.brief: Report real scrape and gauge observations, not inferred traffic history.
hints.0.text: Scrape transport, stored series labels and the intent of a downstream query are separate dependencies.
  Restoring one does not rewrite the others, and changing desired environment inputs does not update an existing
  process.
hints.1.text: |-
  Trace the Service and raw metric data through private Prometheus to each existing query consumer’s desired inputs, current Pod and polling program:

  ```sh
  cat prometheus-target.json observer-contract.json
  kubectl get service board -o yaml
  kubectl get configmap board-metrics observer-program -o yaml
  kubectl get deployment,pods -o yaml
  url=$(jq -r .url prometheus-target.json)
  kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/targets"
  ```
hints.2.text: |-
  Verify scrape health and the required series aggregates, then each current consumer’s matching JSON result, unchanged program and advancing observation count:

  ```sh
  url=$(jq -r .url prometheus-target.json)
  kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/query?query=up%7Bjob%3D%22board%22%7D"
  kubectl get deployment,pods -o yaml
  kubectl get configmap observer-program -o jsonpath='{.data.poll\.sh}' | sha256sum
  for name in observer-count observer-total; do
   kubectl exec deployment/"$name" -- sha256sum /opt/observer/poll.sh
   kubectl exec deployment/"$name" -- wget -qO- -T 2 http://127.0.0.1:8080
   kubectl exec deployment/"$name" -- cat /tmp/observations
  done
  sleep 2
  for name in observer-count observer-total; do
   kubectl exec deployment/"$name" -- cat /tmp/observations
  done
  ```
phrases.0: I traced the scrape failure through the Service.
phrases.1: I verified up and the recorded metric labels.
phrases.2: I used aggregation appropriate for a gauge.
questions.0.points.0: Whether the last scrape of a target succeeded.
questions.0.points.1: It does not prove the business operation succeeded.
questions.0.prompt: What does up measure?
questions.1.points.0: The gauge already represents the current queue size.
questions.1.points.1: Rate is intended for counter changes over time.
questions.1.prompt: Why not rate a queue-depth gauge?
diagnostics.port: The board Service HTTP port must be 8080.
diagnostics.target_port: The board Service HTTP target must resolve to the application listener on port 8080.
diagnostics.selector: Service board must select the whole supplied board workload and no other workload.
diagnostics.target_health: An active board target must be up with an empty lastError.
diagnostics.up_status: up query must succeed.
diagnostics.up_count: up query must return exactly one result.
diagnostics.up_value: up query value must be 1.
diagnostics.sum_status: sum query must succeed.
diagnostics.sum_count: sum query must return exactly one result.
diagnostics.sum_value: sum query value must be 7.
diagnostics.count_status: count query must succeed.
diagnostics.count_count: count query must return exactly one result.
diagnostics.count_value: count query value must be 2.
stages.0.objectives.0.text: The existing board Service reaches only the supplied board workload through its declared
  HTTP interface and application listener. Preserve the original Service, ConfigMaps and Deployment identities and
  provided images. Both desired and current query-consumer inputs must select the same metric family, job and route
  as the required observations and use the provided polling program unchanged, as specified by `observer-contract.json`.
