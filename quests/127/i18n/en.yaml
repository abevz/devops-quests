diagnostics.port: The board Service may lack its named http port on TCP 8080. Check the published port tuple. [Cause and check](guides#guide=admission-metrics&section=q127-metrics-board-service-port)
diagnostics.target_port: The board targetPort may point to the wrong port or a name that fails to resolve to TCP 8080 on all current target Pods. Check the Service and container port declarations. [Cause and check](guides#guide=admission-metrics&section=q127-metrics-board-target-port)
diagnostics.selector: 'The Service selector may miss an intended board Pod or match another workload. Check app: board and compare the full selector with the live Pod labels. [Cause and check](guides#guide=admission-metrics&section=q127-metrics-board-selector)'
diagnostics.probe_0_0: The observer may have stopped before reporting a condition. Check access to the board Service and the current workloads. [Cause and check](guides#guide=admission-metrics&section=q127-metrics-board-observer-input)
diagnostics.observer_identity: A supplied Service or workload may be unreadable, replaced or running a different image. Compare the current objects and worker images with the recorded identities. [Cause and check](guides#guide=admission-metrics&section=q127-metrics-retained-observer-identity)
diagnostics.observer_code: The metrics or program ConfigMap may have been replaced, the observer program may differ, or the current worker may start another command. Check the supplied ConfigMaps, launch command and hash of the mounted program. [Cause and check](guides#guide=admission-metrics&section=q127-metrics-retained-observer-program)
diagnostics.observer_template: The Deployment template may resolve different query inputs for the observer. Compare PROMETHEUS_URL, METRIC, ROUTE, JOB and each observer's OPERATION with the supplied intent. [Cause and check](guides#guide=admission-metrics&section=q127-metrics-observer-environment-template)
diagnostics.observer_current: A current ready observer Pod may be unavailable, or the worker environment may differ from the intended inputs. Check the current owner chain and repeat the exercise's in-Pod observation. [Cause and check](guides#guide=admission-metrics&section=q127-metrics-observer-current-environment)
diagnostics.up_status: The marked Prometheus query may be unreachable or may have returned an error. Check the supplied endpoint from client and repeat the query named in the failure to confirm status success. [Cause and check](guides#guide=admission-metrics&section=q127-metrics-query-status)
diagnostics.sum_status: The marked Prometheus query may be unreachable or may have returned an error. Check the supplied endpoint from client and repeat the query named in the failure to confirm status success. [Cause and check](guides#guide=admission-metrics&section=q127-metrics-query-status)
diagnostics.count_status: The marked Prometheus query may be unreachable or may have returned an error. Check the supplied endpoint from client and repeat the query named in the failure to confirm status success. [Cause and check](guides#guide=admission-metrics&section=q127-metrics-query-status)
diagnostics.up_count: The marked query may return no entries or more than one. Check the job and route filters and confirm exactly one result for that query. [Cause and check](guides#guide=admission-metrics&section=q127-metrics-query-vector-cardinality)
diagnostics.sum_count: The marked query may return no entries or more than one. Check the job and route filters and confirm exactly one result for that query. [Cause and check](guides#guide=admission-metrics&section=q127-metrics-query-vector-cardinality)
diagnostics.count_count: The marked query may return no entries or more than one. Check the job and route filters and confirm exactly one result for that query. [Cause and check](guides#guide=admission-metrics&section=q127-metrics-query-vector-cardinality)
diagnostics.up_value: The marked query may have returned a different sample value. Compare up with 1, sum with 7 or count with 2 for the named query. [Cause and check](guides#guide=admission-metrics&section=q127-metrics-query-observed-value)
diagnostics.sum_value: The marked query may have returned a different sample value. Compare up with 1, sum with 7 or count with 2 for the named query. [Cause and check](guides#guide=admission-metrics&section=q127-metrics-query-observed-value)
diagnostics.count_value: The marked query may have returned a different sample value. Compare up with 1, sum with 7 or count with 2 for the named query. [Cause and check](guides#guide=admission-metrics&section=q127-metrics-query-observed-value)
diagnostics.target_health: Prometheus may lack an active board target with health up and empty lastError. Inspect the active target list and its scrape error. [Cause and check](guides#guide=admission-metrics&section=q127-metrics-active-board-target)
diagnostics.observer_delivery: An observer may have no current ready worker or may publish a stale or incorrect result. Check the loopback response in each observer, where count must show 2 and sum must show 7. [Cause and check](guides#guide=admission-metrics&section=q127-metrics-observer-result-delivery)
diagnostics.observer_progress: The observation counter may be stalled. Read /tmp/observations twice in the same current worker and confirm that it increases while polling continues. [Cause and check](guides#guide=admission-metrics&section=q127-metrics-observer-poll-progress)
diagnostics.probe_0_1: The delivery observer may have stopped before reporting a condition. Check that the Prometheus endpoint and the client and observer Pods are available. [Cause and check](guides#guide=admission-metrics&section=q127-metrics-observer-delivery-input)
