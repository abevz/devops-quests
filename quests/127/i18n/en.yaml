  its declared HTTP interface and application listener.
stages.0.objectives.1.text: Private Prometheus reports one `up` result of `1` for job `board`, and at
  least one active `board` target is `up` with no scrape error.
stages.0.objectives.2.text: For job `board` and route `north`, `station_queue_depth` has exactly `2` series
  with sum `7`; both aggregate queries succeed with one result.
