title: Diagnostyka pobierania metryk Prometheus
brief: |-
  Monitoring nie pokazuje oczekiwanych wyników kolejki board. Przywróć rzeczywiste działanie zbierania i uzgodnione obserwacje gauge.

  Pracuj na workstation w `~/quest` z dostarczonymi plikami:
  - `metrics.yaml`, `board.yaml`, `service.yaml`, `client.yaml`, `prometheus-target.json`.

  **Requirements:**

  - Istniejący Service board dociera tylko do dostarczonego obciążenia board przez zadeklarowany interfejs HTTP i listener aplikacji.
  - Prywatny Prometheus zgłasza jeden wynik `up` o wartości `1` dla zadania `board`, a co najmniej jeden aktywny cel `board` jest `up` bez błędu zbierania.
  - Dla zadania `board` i trasy `north` metryka `station_queue_depth` ma dokładnie `2` serie o sumie `7`; obydwa zapytania agregujące kończą się powodzeniem i dają jeden wynik.

  Gauge to syntetyczne dane szkoleniowe; Prometheus i zbieranie co dwie sekundy są rzeczywiste. Kontrole obserwują bieżące wyniki Service/zapytań, nie historię ani autora zapytań.
debrief: Prawdziwe scrape i query okazały się odzyskiem; Sam readiness nie udowodniłby zarejestrowanych
  parametrów aplikacji.
stages.0.brief: Potwierdź rzeczywiste obserwacje scrape i gauge, a nie wywnioskowaną historię ruchu.
hints.0.text: Oddzielna odpowiedź exporter, przekazywanie Service i kondycja scrape.
hints.1.text: |-
  Wartość up równa zero oznacza, że ​​scrape nie powiodło się, a nie, że kolejka jest pusta. Głębokość kolejki jest gauge bieżącej wartości, więc `rate()` nie jest odpowiednie.

  Sprawdź dostarczone dane i bieżące obserwacje:

  ```sh
  kubectl get service board -o yaml
  cat prometheus-target.json
  ```
hints.2.text: |-
  Napraw port zaplecza Service, poczekaj na scrape i zapytaj zarówno count, jak i sum. Nasłuch board działa na `8080`, ale dostarczony backend Service to `8099`; przywróć tylko targetPort do `8080` i poczekaj na zebranie.

  Sprawdź wynik z `~/quest` na workstation:

  - Zapytanie kończy się powodzeniem z jednym wynikiem o wartości `1`.

    ```sh
    url=$(jq -r .url prometheus-target.json)
    kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/query?query=up%7Bjob%3D%22board%22%7D"
    ```

  - Oba zapytania kończą się powodzeniem z jednym wynikiem: suma `7`, liczba `2`.

    ```sh
    url=$(jq -r .url prometheus-target.json)
    for aggregate in sum count; do
      kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/query?query=$aggregate%28station_queue_depth%7Bjob%3D%22board%22%2Croute%3D%22north%22%7D%29"
    done
    ```

  Aktywny cel board ma stan up bez błędu scrape:

  ```sh
  url=$(jq -r .url prometheus-target.json)
  kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/targets?state=active"
  ```
phrases.0: Prześledziłem awarię scrape poprzez Service.
phrases.1: Zweryfikowałem up i zarejestrowaną metrykę labels.
phrases.2: Zastosowałem agregację odpowiednią dla gauge.
questions.0.points.0: Czy ostatnie scrape celu powiodło się.
questions.0.points.1: Nie stanowi to dowodu na powodzenie operacji biznesowej.
questions.0.prompt: Co mierzy up?
questions.1.points.0: Wskaźnik już reprezentuje bieżący rozmiar kolejki.
questions.1.points.1: Rate jest przeznaczony do zmian counter w miarę upływu czasu.
questions.1.prompt: Dlaczego nie rate i gauge o głębokości kolejki?
