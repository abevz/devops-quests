title: Diagnostyka pobierania metryk Prometheus
brief: 'Prywatny Prometheus w przypiętej wersji pobiera metryki z board:8080/metrics.txt co dwie sekundy. Pod board udostępnia
  na porcie 8080 niewielką syntetyczną metrykę gauge głębokości kolejki, ale jego Service przekierowuje ruch na 8099, więc
  cel jest niedostępny. Przywróć wyłącznie Service targetPort 8080. Z client Pod użyj zapisanego endpointu Prometheus, aby
  sprawdzić stan celu, up=1, dwie serie north i ich sumę 7. Dostarczone metryki są jawnymi danymi szkoleniowymi; serwer i
  pobieranie metryk są rzeczywiste. gauge przedstawia bieżącą wartość, więc rate() nie nadaje się do tej głębokości kolejki.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `metrics.json`, `board.json`, `service.json`, `client.json`,
  `prometheus-target.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie załadowanych obrazów
  i usług prywatnych. Zmień tylko tę zatokę.


  Przeczytaj `metrics.json`, `board.json`, `service.json`, `client.json` i `prometheus-target.json`. Pierwszy port i targetPort
  Service muszą wynosić 8080, a selektor być dokładnie `app: board`. Z użyciem zapisanego URL Prometheusa zapytanie `up{job="board"}`
  musi się powieść z jednym wynikiem równym 1; `sum(station_queue_depth{job="board",route="north"})` i `count` tych serii
  muszą się powieść z jednym wynikiem równym odpowiednio 7 i 2. Co najmniej jeden aktywny target `board` musi być `up` z pustym
  `lastError`. Kontrole obserwują bieżący Service i wyniki zapytań, nie historię zmian ani to, czy osobiście wykonano zapytania.'
debrief: Prawdziwe scrape i query okazały się odzyskiem; Sam readiness nie udowodniłby zarejestrowanych parametrów aplikacji.
stages.0.brief: Service, aktywny target i trzy wyniki zapytań Prometheusa odpowiadają opisowi.
stages.0.objectives.0.text: Service, aktywny target i trzy wyniki zapytań Prometheusa odpowiadają opisowi.
hints.0.text: Oddzielna odpowiedź exporter, przekazywanie Service i kondycja scrape.
hints.1.text: Wartość up równa zero oznacza, że ​​scrape nie powiodło się, a nie, że kolejka jest pusta.
hints.2.text: Napraw port zaplecza Service, poczekaj na scrape i zapytaj zarówno count, jak i sum.
phrases.0: Prześledziłem awarię scrape poprzez Service.
phrases.1: Zweryfikowałem up i zarejestrowaną metrykę labels.
phrases.2: Zastosowałem agregację odpowiednią dla gauge.
questions.0.points.0: Czy ostatnie scrape celu powiodło się.
questions.0.points.1: Nie stanowi to dowodu na powodzenie operacji biznesowej.
questions.0.prompt: Co mierzy up?
questions.1.points.0: Wskaźnik już reprezentuje bieżący rozmiar kolejki.
questions.1.points.1: Rate jest przeznaczony do zmian counter w miarę upływu czasu.
questions.1.prompt: Dlaczego nie rate i gauge o głębokości kolejki?
