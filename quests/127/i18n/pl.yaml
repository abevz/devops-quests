diagnostics.probe_0_0: Nie udało się sprawdzić ścieżki Service albo zachowanych wejść i kodu odbiorców zapytań.
diagnostics.observer_identity: Pierwotny obiekt metryk, tożsamość odbiorcy zapytań lub dostarczony obraz zmieniły
  się albo są niedostępne.
diagnostics.observer_code: Zmieniono dostarczony ConfigMap programu odpytywania, jego bajty lub rzeczywistą konfigurację
  uruchomienia.
diagnostics.observer_template: Żądane wejścia zapytania nadal wybierają inną rodzinę metryk, job, trasę lub operację.
diagnostics.observer_current: Bieżący Pod odbiorcy zapytań nie istnieje, nie jest gotowy albo nadal działa z innymi
  wejściami.
diagnostics.observer_delivery: Bieżąca migawka zapytania jest niedostępna lub nie zawiera zadeklarowanego agregatu.
diagnostics.observer_progress: Licznik obserwacji nie wzrósł, został wyzerowany lub nie potwierdza bieżącego postępu
  odpytywania.
diagnostics.probe_0_1: Nie udało się sprawdzić bieżącej publikacji agregatów i postępu odpytywania.
