title: Diagnostyka pobierania metryk Prometheus
brief: |-
  Prywatna ścieżka metryk nie dostarcza wymaganych obserwacji. Przywróć poprawny scrape i bieżące agregaty obu istniejącym odbiorcom zapytań.

  Pracuj na stacji roboczej w `~/quest` z dostarczonymi plikami:
  - `prometheus-target.json`.
  - `observer-contract.json`.

  **Wymagania:**

  - Istniejący Service board dociera tylko do dostarczonego obciążenia board przez zadeklarowany interfejs HTTP i listener aplikacji. Zachowaj pierwotne tożsamości Service, ConfigMap i Deploymentów oraz dostarczone obrazy. Żądane i bieżące wejścia obu odbiorców zapytań mają wybierać tę samą rodzinę metryk, job i trasę co wymagane obserwacje oraz używać niezmienionego programu odpytywania według `observer-contract.json`.
  - Prywatny Prometheus zgłasza jeden wynik `up` o wartości `1` dla zadania `board`, a co najmniej jeden aktywny cel `board` jest `up` bez błędu zbierania. Każdy dostarczony odbiorca zapytań ma jeden bieżący gotowy Pod, publikuje zadeklarowany agregat i kontynuuje poprawne obserwacje zgodnie z `observer-contract.json`.
  - Dla zadania `board` i trasy `north` metryka `station_queue_depth` ma dokładnie `2` serie o sumie `7`; obydwa zapytania agregujące kończą się powodzeniem i dają jeden wynik.

  Kontrole obserwują bieżące szeregi, konfigurację, migawki i postęp, nie pełną historię żądań ani zmian. Dostarczony program odpytywania i prywatny endpoint Prometheus pozostają częścią ograniczonego ćwiczenia.
debrief: Kontrole porównały zachowaną ścieżkę metryk, rzeczywisty scrape i szeregi, tożsamości i kod odbiorców,
  żądane i działające wejścia, bieżące agregaty i postęp obserwacji.
stages.0.brief: Potwierdź rzeczywiste obserwacje scrape i gauge, a nie wywnioskowaną historię ruchu.
hints.0.text: Transport scrape, etykiety zapisanych szeregów i intencja dalszego zapytania to oddzielne zależności.
  Naprawa jednej nie przepisuje pozostałych, a zmiana żądanego środowiska nie aktualizuje istniejącego procesu.
hints.1.text: |-
  Prześledź Service i źródłowe dane metryk przez prywatny Prometheus do żądanych wejść, bieżącego Poda i programu każdego istniejącego odbiorcy zapytań:

  ```sh
  cat prometheus-target.json observer-contract.json
  kubectl get service board -o yaml
  kubectl get configmap board-metrics observer-program -o yaml
  kubectl get deployment,pods -o yaml
  url=$(jq -r .url prometheus-target.json)
  kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/targets"
  ```
hints.2.text: |-
  Sprawdź stan scrape i wymagane agregaty, potem zgodną bieżącą odpowiedź JSON, niezmieniony program i rosnący licznik obserwacji każdego odbiorcy:

  ```sh
  url=$(jq -r .url prometheus-target.json)
  kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/query?query=up%7Bjob%3D%22board%22%7D"
  kubectl get deployment,pods -o yaml
  kubectl get configmap observer-program -o jsonpath='{.data.poll\.sh}' | sha256sum
  for name in observer-count observer-total; do
   kubectl exec deployment/"$name" -- sha256sum /opt/observer/poll.sh
   kubectl exec deployment/"$name" -- wget -qO- -T 2 http://127.0.0.1:8080
   kubectl exec deployment/"$name" -- cat /tmp/observations
  done
  sleep 2
  for name in observer-count observer-total; do
   kubectl exec deployment/"$name" -- cat /tmp/observations
  done
  ```
phrases.0: Prześledziłem awarię scrape poprzez Service.
phrases.1: Zweryfikowałem up i zarejestrowaną metrykę labels.
phrases.2: Zastosowałem agregację odpowiednią dla gauge.
questions.0.points.0: Czy ostatnie scrape celu powiodło się.
questions.0.points.1: Nie stanowi to dowodu na powodzenie operacji biznesowej.
questions.0.prompt: Co mierzy up?
questions.1.points.0: Wskaźnik już reprezentuje bieżący rozmiar kolejki.
questions.1.points.1: Rate jest przeznaczony do zmian counter w miarę upływu czasu.
questions.1.prompt: Dlaczego nie rate i gauge o głębokości kolejki?
diagnostics.port: Port HTTP Service board musi wynosić 8080.
diagnostics.target_port: Cel HTTP Service board musi wskazywać port nasłuchujący aplikacji 8080.
diagnostics.selector: Service board musi wybierać całą dostarczoną aplikację board i żadną inną.
diagnostics.target_health: Aktywny target board musi być up z pustym lastError.
diagnostics.up_status: Zapytanie up musi się powieść.
diagnostics.up_count: Zapytanie up musi zwrócić dokładnie jeden wynik.
diagnostics.up_value: Wartość zapytania up musi wynosić 1.
diagnostics.sum_status: Zapytanie sum musi się powieść.
diagnostics.sum_count: Zapytanie sum musi zwrócić dokładnie jeden wynik.
diagnostics.sum_value: Wartość zapytania sum musi wynosić 7.
diagnostics.count_status: Zapytanie count musi się powieść.
diagnostics.count_count: Zapytanie count musi zwrócić dokładnie jeden wynik.
diagnostics.count_value: Wartość zapytania count musi wynosić 2.
