diagnostics.port: W Service board może brakować nazwanego portu http na TCP 8080. Sprawdź konfigurację wystawionego portu. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q127-metrics-board-service-port)
diagnostics.target_port: targetPort w board może wskazywać inny port lub nazwę, która nie odpowiada TCP 8080 we wszystkich bieżących Podach docelowych. Sprawdź deklaracje portów Service i kontenerów. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q127-metrics-board-target-port)
diagnostics.selector: 'Selektor Service może pomijać właściwy Pod board lub wybierać inne obciążenie. Sprawdź app: board i porównaj cały selektor z bieżącymi etykietami Podów. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q127-metrics-board-selector)'
diagnostics.probe_0_0: Kontrola mogła przerwać pracę przed zgłoszeniem warunku. Sprawdź dostęp do Service board i bieżących obciążeń. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q127-metrics-board-observer-input)
diagnostics.observer_identity: Dostarczony Service lub obciążenie mogło stać się niedostępne, zostać zastąpione albo używać innego obrazu. Porównaj bieżące obiekty i obrazy worker z zapisanymi tożsamościami. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q127-metrics-retained-observer-identity)
diagnostics.observer_code: ConfigMap metryk lub programu mógł zostać zastąpiony, program mógł się zmienić albo bieżący worker może uruchamiać inną komendę. Sprawdź dostarczone ConfigMapy, komendę startową i skrót zamontowanego programu. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q127-metrics-retained-observer-program)
diagnostics.observer_template: Szablon Deploymentu może wyznaczać inne parametry zapytania obserwatora. Porównaj PROMETHEUS_URL, METRIC, ROUTE, JOB i OPERATION każdego obserwatora z dostarczonym założeniem. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q127-metrics-observer-environment-template)
diagnostics.observer_current: Bieżący, gotowy Pod obserwatora może być niedostępny albo środowisko worker może różnić się od oczekiwanego. Sprawdź łańcuch właścicieli i ponów obserwację wewnątrz Poda. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q127-metrics-observer-current-environment)
diagnostics.up_status: Wskazane zapytanie Prometheus mogło nie dotrzeć do serwera lub zwrócić błąd. Sprawdź podany adres z client i ponów zapytanie z komunikatu, oczekując status success. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q127-metrics-query-status)
diagnostics.sum_status: Wskazane zapytanie Prometheus mogło nie dotrzeć do serwera lub zwrócić błąd. Sprawdź podany adres z client i ponów zapytanie z komunikatu, oczekując status success. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q127-metrics-query-status)
diagnostics.count_status: Wskazane zapytanie Prometheus mogło nie dotrzeć do serwera lub zwrócić błąd. Sprawdź podany adres z client i ponów zapytanie z komunikatu, oczekując status success. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q127-metrics-query-status)
diagnostics.up_count: Wskazane zapytanie może zwrócić zero lub więcej niż jeden wpis. Sprawdź filtry job i route i potwierdź dokładnie jeden wynik zapytania. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q127-metrics-query-vector-cardinality)
diagnostics.sum_count: Wskazane zapytanie może zwrócić zero lub więcej niż jeden wpis. Sprawdź filtry job i route i potwierdź dokładnie jeden wynik zapytania. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q127-metrics-query-vector-cardinality)
diagnostics.count_count: Wskazane zapytanie może zwrócić zero lub więcej niż jeden wpis. Sprawdź filtry job i route i potwierdź dokładnie jeden wynik zapytania. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q127-metrics-query-vector-cardinality)
diagnostics.up_value: Wskazane zapytanie mogło zwrócić inną próbkę. Dla podanego zapytania porównaj up z 1, sum z 7 lub count z 2. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q127-metrics-query-observed-value)
diagnostics.sum_value: Wskazane zapytanie mogło zwrócić inną próbkę. Dla podanego zapytania porównaj up z 1, sum z 7 lub count z 2. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q127-metrics-query-observed-value)
diagnostics.count_value: Wskazane zapytanie mogło zwrócić inną próbkę. Dla podanego zapytania porównaj up z 1, sum z 7 lub count z 2. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q127-metrics-query-observed-value)
diagnostics.target_health: Prometheus może nie mieć aktywnego celu board ze stanem up i pustym lastError. Sprawdź listę aktywnych celów i błąd pobierania metryk. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q127-metrics-active-board-target)
diagnostics.observer_delivery: Obserwator może nie mieć bieżącego, gotowego worker lub może publikować nieaktualny albo błędny wynik. Sprawdź odpowiedź loopback każdego obserwatora, gdzie count ma dać 2, a sum 7. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q127-metrics-observer-result-delivery)
diagnostics.observer_progress: Licznik obserwacji mógł się zatrzymać. Odczytaj /tmp/observations dwukrotnie w tym samym bieżącym worker i potwierdź wzrost podczas odpytywania. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q127-metrics-observer-poll-progress)
diagnostics.probe_0_1: Kontrola dostarczenia mogła się zatrzymać przed zgłoszeniem warunku. Sprawdź dostępność adresu Prometheus oraz Podów client i obserwatorów. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q127-metrics-observer-delivery-input)
