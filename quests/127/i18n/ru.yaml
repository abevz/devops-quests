title: Диагностика scrape Prometheus
brief: |-
  Мониторинг не показывает ожидаемые результаты очереди board. Восстановите реальный сбор метрик и согласованные наблюдения gauge.

  Работайте на workstation в `~/quest` с предоставленными файлами:
  - `metrics.yaml`, `board.yaml`, `service.yaml`, `client.yaml`, `prometheus-target.json`.

  **Requirements:**

  - Существующий Service board достигает только предоставленной нагрузки board через объявленный HTTP-интерфейс и listener приложения.
  - Частный Prometheus сообщает один результат `up` со значением `1` для задания `board`, и хотя бы одна активная цель `board` имеет `up` без ошибки сбора.
  - Для задания `board` и маршрута `north` метрика `station_queue_depth` имеет ровно `2` ряда с суммой `7`; оба агрегатных запроса успешны и дают один результат.

  Gauge — синтетические учебные данные; Prometheus и его сбор раз в две секунды реальны. Проверки наблюдают текущие результаты Service/запросов, а не историю правок или автора запросов.
debrief: Настоящие scrape и query подтвердили восстановление; одной readiness недостаточно для метрик
  приложения.
stages.0.brief: Подтвердите реальные наблюдения scrape и gauge, а не предполагаемую историю трафика.
hints.0.text: Разделите ответ exporter, перенаправление Service и здоровье scrape.
hints.1.text: |-
  up равный нулю означает сбой scrape, а не пустую очередь. Глубина очереди — gauge текущего значения, поэтому `rate()` для неё не подходит.

  Изучите предоставленные файлы и живые наблюдения:

  ```sh
  kubectl get service board -o yaml
  cat prometheus-target.json
  ```
hints.2.text: |-
  Исправьте backend port Service, дождитесь scrape и проверьте count и sum. Слушатель board обслуживает `8080`, а предоставленный backend Service — `8099`; восстановите только targetPort на `8080` и дождитесь сбора.

  Проверьте результат из `~/quest` на workstation:

  - Запрос успешен и даёт один результат со значением `1`.

    ```sh
    url=$(jq -r .url prometheus-target.json)
    kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/query?query=up%7Bjob%3D%22board%22%7D"
    ```

  - Оба запроса успешны и дают один результат: сумма `7`, количество `2`.

    ```sh
    url=$(jq -r .url prometheus-target.json)
    for aggregate in sum count; do
      kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/query?query=$aggregate%28station_queue_depth%7Bjob%3D%22board%22%2Croute%3D%22north%22%7D%29"
    done
    ```

  Активная цель board имеет статус up без ошибки scrape:

  ```sh
  url=$(jq -r .url prometheus-target.json)
  kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/targets?state=active"
  ```
phrases.0: Я проследил сбой scrape через Service.
phrases.1: Я проверил up и labels собранных метрик.
phrases.2: Я применил агрегацию, подходящую gauge.
questions.0.points.0: Успех последнего scrape цели.
questions.0.points.1: Это не доказывает успех бизнес-операции.
questions.0.prompt: Что измеряет up?
questions.1.points.0: Gauge уже представляет текущий размер очереди.
questions.1.points.1: Rate предназначен для изменений counter во времени.
questions.1.prompt: Почему не стоит применять rate к gauge глубины очереди?
diagnostics.port: HTTP-порт Service board должен быть 8080.
diagnostics.target_port: Целевой HTTP-порт Service board должен разрешаться в слушатель приложения на порту 8080.
diagnostics.selector: Service board должен выбирать всю исходную нагрузку board и никакую другую.
diagnostics.target_health: Активная цель board должна быть up с пустым lastError.
diagnostics.up_status: Запрос up должен завершиться успешно.
diagnostics.up_count: Запрос up должен вернуть ровно один результат.
diagnostics.up_value: Значение запроса up должно быть 1.
diagnostics.sum_status: Запрос sum должен завершиться успешно.
diagnostics.sum_count: Запрос sum должен вернуть ровно один результат.
diagnostics.sum_value: Значение запроса sum должно быть 7.
diagnostics.count_status: Запрос count должен завершиться успешно.
diagnostics.count_count: Запрос count должен вернуть ровно один результат.
diagnostics.count_value: Значение запроса count должно быть 2.
