  со слушателем приложения.
stages.0.objectives.1.text: Частный Prometheus сообщает один результат `up` со значением `1` для задания `board`,
  и хотя бы одна активная цель `board` имеет `up` без ошибки сбора.
stages.0.objectives.2.text: Для задания `board` и маршрута `north` метрика `station_queue_depth` имеет ровно `2`
