title: Диагностика scrape Prometheus
brief: 'Приватный закреплённый Prometheus опрашивает board:8080/metrics.txt каждые две секунды. Pod board отдаёт учебный gauge
  очереди на 8080, но Service направляет на 8099, и цель недоступна. Верните только targetPort Service 8080. Через клиентский
  Pod используйте сохранённый endpoint Prometheus: проверьте здоровье цели, up=1, два ряда north и сумму 7. Метрики явно учебные;
  сервер и scrape настоящие. Gauge — текущее значение, поэтому rate() для этой глубины очереди не подходит.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `metrics.json`, `board.json`, `service.json`, `client.json`,
  `prometheus-target.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы и приватные сервисы.
  Менять можно только эту песочницу.


  Прочитайте `metrics.json`, `board.json`, `service.json`, `client.json` и `prometheus-target.json`. Первый порт и targetPort
  Service должны быть 8080, селектор — ровно `app: board`. По сохранённому URL Prometheus запрос `up{job="board"}` должен
  успешно вернуть один результат 1; `sum(station_queue_depth{job="board",route="north"})` и `count` этих серий должны успешно
  вернуть по одному результату 7 и 2 соответственно. Хотя бы одна активная цель `board` должна быть `up` с пустым `lastError`.
  Проверки наблюдают текущий Service и результаты запросов, а не историю изменений или то, выполняли ли вы запросы лично.'
debrief: Настоящие scrape и query подтвердили восстановление; одной readiness недостаточно для метрик приложения.
