hints.0.text: Разделите ответ exporter, перенаправление Service и здоровье scrape.
hints.1.text: up равный нулю означает сбой scrape, а не пустую очередь.
hints.2.text: Исправьте backend port Service, дождитесь scrape и проверьте count и
  sum.
phrases.0: Я проследил сбой scrape через Service.
phrases.1: Я проверил up и labels собранных метрик.
phrases.2: Я применил агрегацию, подходящую gauge.
