  что и требуемые наблюдения, и использовать предоставленную программу опроса без изменений по `observer-contract.json`.
stages.0.objectives.1.text: Частный Prometheus сообщает один результат `up` со значением `1` для задания `board`,
  и хотя бы одна активная цель `board` имеет `up` без ошибки сбора. У каждого предоставленного потребителя запросов
  есть один готовый текущий Pod, он выдаёт объявленный агрегат и продолжает успешные наблюдения согласно `observer-contract.json`.
