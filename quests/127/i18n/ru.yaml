title: Диагностика scrape Prometheus
brief: |-
  Приватный путь метрик не доставляет требуемые наблюдения. Восстановите scrape и текущую выдачу агрегатов обоим существующим потребителям запросов.

  Работайте на рабочей станции в `~/quest` с предоставленными файлами:
  - `prometheus-target.json`.
  - `observer-contract.json`.

  **Требования:**

  - Существующий Service board достигает только предоставленной нагрузки board через объявленный HTTP-интерфейс и listener приложения. Сохраните идентичность исходных Service, ConfigMap и Deployment и предоставленные образы. Желаемые и текущие входы обоих потребителей запросов должны выбирать то же семейство метрик, job и маршрут, что и требуемые наблюдения, и использовать предоставленную программу опроса без изменений по `observer-contract.json`.
  - Частный Prometheus сообщает один результат `up` со значением `1` для задания `board`, и хотя бы одна активная цель `board` имеет `up` без ошибки сбора. У каждого предоставленного потребителя запросов есть один готовый текущий Pod, он выдаёт объявленный агрегат и продолжает успешные наблюдения согласно `observer-contract.json`.
  - Для задания `board` и маршрута `north` метрика `station_queue_depth` имеет ровно `2` ряда с суммой `7`; оба агрегатных запроса успешны и дают один результат.

  Проверки наблюдают текущие ряды, конфигурацию, снимки и прогресс, но не полную историю запросов или правок. Предоставленный код опроса и приватный endpoint Prometheus остаются частью ограниченного упражнения.
debrief: Проверки сравнили сохранённый путь метрик, реальное здоровье scrape и ряды, идентичность и код потребителей,
  желаемые и работающие входы, текущие ответы агрегатов и прогресс наблюдений.
stages.0.brief: Подтвердите реальные наблюдения scrape и gauge, а не предполагаемую историю трафика.
hints.0.text: Транспорт scrape, метки сохранённых рядов и смысл запроса потребителя — отдельные зависимости. Восстановление
  одной не переписывает остальные, а изменение желаемых переменных окружения не обновляет уже работающий процесс.
hints.1.text: |-
  Проследите Service и исходные данные метрик через приватный Prometheus к желаемым входам каждого существующего потребителя запросов, текущему Pod и программе опроса:

  ```sh
  cat prometheus-target.json observer-contract.json
  kubectl get service board -o yaml
  kubectl get configmap board-metrics observer-program -o yaml
  kubectl get deployment,pods -o yaml
  url=$(jq -r .url prometheus-target.json)
  kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/targets"
  ```
hints.2.text: |-
  Проверьте scrape и требуемые агрегаты рядов, затем соответствующий JSON-ответ каждого текущего потребителя, неизменность программы и растущий счётчик наблюдений:

  ```sh
  (
  set -euo pipefail
  url=$(jq -r .url prometheus-target.json)
  kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/query?query=up%7Bjob%3D%22board%22%7D"
  for aggregate in count sum; do
    expression=$(printf '%s(station_queue_depth{job="board",route="north"})' "$aggregate")
    query=$(jq -rn --arg query "$expression" '$query | @uri')
    kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/query?query=$query"
    printf '\n'
  done
  program=$(jq -er .programHash observer-identities.json)
  source_hash=$(kubectl get configmap observer-program -o jsonpath='{.data.poll\.sh}' | sha256sum)
  test "${source_hash%% *}" = "$program"
  for role in observer-count observer-total; do
    deploy=$(kubectl get deployment "$role" -o jsonpath='{.metadata.uid}')
    sets=$(kubectl get rs -o json | jq -c --arg uid "$deploy" '
      [.items[] | select(any(.metadata.ownerReferences[]?; .kind=="Deployment" and .controller==true and .uid==$uid)) | .metadata.uid]')
    pod=$(kubectl get pods -o json | jq -er --argjson owners "$sets" '
      [.items[] | select(.metadata.deletionTimestamp==null and .status.phase!="Failed" and .status.phase!="Succeeded" and
        any(.metadata.ownerReferences[]?; .kind=="ReplicaSet" and .controller==true and (.uid as $uid | $owners | index($uid)!=null)))]
      | select(length==1) | .[0]
      | select(.status.phase=="Running" and any(.status.conditions[]?; .type=="Ready" and .status=="True"))
      | .metadata.name')
    wanted=$(jq -er --arg role "$role" '.consumers[] | select(.deployment==$role) | .expected' observer-contract.json)
    observed_hash=$(kubectl exec "$pod" -c worker -- sha256sum /opt/observer/poll.sh)
    test "${observed_hash%% *}" = "$program"
    before=$(kubectl exec "$pod" -c worker -- cat /tmp/observations)
    kubectl exec "$pod" -c worker -- wget -qO- -T 2 http://127.0.0.1:8080 |
      jq -e --argjson wanted "$wanted" '.status=="success" and .data.resultType=="vector" and
        (.data.result | length)==1 and (.data.result[0].value[1] | tonumber)==$wanted'
    sleep 2
    after=$(kubectl exec "$pod" -c worker -- cat /tmp/observations)
    test "$before" -ge 0 && test "$after" -gt "$before" || exit 1
    printf '%s/%s: %s → %s\n' "$role" "$pod" "$before" "$after"
  done
  )
  ```

  Единственный результат up равен 1. Для north число рядов равно 2, а сумма равна 7. Соответствующие потребители сообщают эти значения, а их счётчики наблюдений растут.
phrases.0: Я проследил сбой scrape через Service.
phrases.1: Я проверил up и labels собранных метрик.
phrases.2: Я применил агрегацию, подходящую gauge.
questions.0.points.0: Успех последнего scrape цели.
questions.0.points.1: Это не доказывает успех бизнес-операции.
questions.0.prompt: Что измеряет up?
questions.1.points.0: Gauge уже представляет текущий размер очереди.
questions.1.points.1: Rate предназначен для изменений counter во времени.
questions.1.prompt: Почему не стоит применять rate к gauge глубины очереди?
