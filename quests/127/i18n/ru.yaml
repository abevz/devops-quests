  ряда с суммой `7`; оба агрегатных запроса успешны и дают один результат.
diagnostics.probe_0_0: Не удалось проверить путь Service либо сохранённые входы и код потребителей запросов.
diagnostics.observer_identity: Изменились или недоступны исходный объект метрик, идентичность потребителя запросов
  либо предоставленный образ.
diagnostics.observer_code: Изменились предоставленный ConfigMap программы опроса, её байты или конфигурация запуска.
diagnostics.observer_template: Желаемые входы запроса всё ещё выбирают другое семейство метрик, job, маршрут или
  операцию.
diagnostics.observer_current: Текущий Pod потребителя запросов отсутствует, не готов или продолжает работать с другими
  входами.
diagnostics.observer_delivery: Текущий снимок запроса недоступен или не содержит объявленного результата агрегирования.
diagnostics.observer_progress: Счётчик наблюдений не вырос, сбросился или не позволил подтвердить текущий прогресс
  опроса.
diagnostics.probe_0_1: Не удалось проверить текущую выдачу агрегатов и прогресс опроса.
