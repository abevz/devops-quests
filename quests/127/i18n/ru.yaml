diagnostics.port: В Service board может отсутствовать именованный порт http на TCP 8080. Проверьте параметры порта Service. [Причина и проверка](guides#guide=admission-metrics&section=q127-metrics-board-service-port)
diagnostics.target_port: targetPort в board может указывать на другой порт или на имя, которое не разрешается в TCP 8080 у всех текущих целевых Pod. Проверьте порты Service и контейнеров. [Причина и проверка](guides#guide=admission-metrics&section=q127-metrics-board-target-port)
diagnostics.selector: 'Селектор Service может пропускать нужный Pod board или выбирать другую нагрузку. Проверьте app: board и сравните полный селектор с текущими метками Pod. [Причина и проверка](guides#guide=admission-metrics&section=q127-metrics-board-selector)'
diagnostics.probe_0_0: Проверка могла остановиться до вывода конкретного условия. Убедитесь, что Service board и текущие нагрузки доступны для чтения. [Причина и проверка](guides#guide=admission-metrics&section=q127-metrics-board-observer-input)
diagnostics.observer_identity: Выданный Service или нагрузка могла стать недоступной для чтения, быть пересоздана или использовать другой образ. Сравните текущие объекты и образы worker с исходной записью. [Причина и проверка](guides#guide=admission-metrics&section=q127-metrics-retained-observer-identity)
diagnostics.observer_code: ConfigMap метрик или программы мог быть заменён, программа могла измениться либо текущий worker запускает другую команду. Проверьте выданные ConfigMap, команду запуска и хеш смонтированной программы. [Причина и проверка](guides#guide=admission-metrics&section=q127-metrics-retained-observer-program)
diagnostics.observer_template: Шаблон Deployment может задавать другие параметры запроса наблюдателя. Сверьте PROMETHEUS_URL, METRIC, ROUTE, JOB и OPERATION каждого наблюдателя с выданным контрактом. [Причина и проверка](guides#guide=admission-metrics&section=q127-metrics-observer-environment-template)
diagnostics.observer_current: Текущий готовый Pod наблюдателя может быть недоступен, или окружение worker отличается от ожидаемого. Проверьте цепочку владения и повторите проверку в живом Pod. [Причина и проверка](guides#guide=admission-metrics&section=q127-metrics-observer-current-environment)
diagnostics.up_status: Запрос Prometheus из сообщения мог не дойти до сервера или вернуть ошибку. Проверьте выданный адрес из client и повторите запрос из сообщения, чтобы увидеть status success. [Причина и проверка](guides#guide=admission-metrics&section=q127-metrics-query-status)
diagnostics.sum_status: Запрос Prometheus из сообщения мог не дойти до сервера или вернуть ошибку. Проверьте выданный адрес из client и повторите запрос из сообщения, чтобы увидеть status success. [Причина и проверка](guides#guide=admission-metrics&section=q127-metrics-query-status)
diagnostics.count_status: Запрос Prometheus из сообщения мог не дойти до сервера или вернуть ошибку. Проверьте выданный адрес из client и повторите запрос из сообщения, чтобы увидеть status success. [Причина и проверка](guides#guide=admission-metrics&section=q127-metrics-query-status)
diagnostics.up_count: Запрос из сообщения может вернуть ноль записей или больше одной. Проверьте фильтры job и route и убедитесь, что указанный запрос возвращает одну запись. [Причина и проверка](guides#guide=admission-metrics&section=q127-metrics-query-vector-cardinality)
diagnostics.sum_count: Запрос из сообщения может вернуть ноль записей или больше одной. Проверьте фильтры job и route и убедитесь, что указанный запрос возвращает одну запись. [Причина и проверка](guides#guide=admission-metrics&section=q127-metrics-query-vector-cardinality)
diagnostics.count_count: Запрос из сообщения может вернуть ноль записей или больше одной. Проверьте фильтры job и route и убедитесь, что указанный запрос возвращает одну запись. [Причина и проверка](guides#guide=admission-metrics&section=q127-metrics-query-vector-cardinality)
diagnostics.up_value: Запрос из сообщения мог вернуть другое значение. Сравните up с 1, sum с 7 или count с 2 в зависимости от указанного запроса. [Причина и проверка](guides#guide=admission-metrics&section=q127-metrics-query-observed-value)
diagnostics.sum_value: Запрос из сообщения мог вернуть другое значение. Сравните up с 1, sum с 7 или count с 2 в зависимости от указанного запроса. [Причина и проверка](guides#guide=admission-metrics&section=q127-metrics-query-observed-value)
diagnostics.count_value: Запрос из сообщения мог вернуть другое значение. Сравните up с 1, sum с 7 или count с 2 в зависимости от указанного запроса. [Причина и проверка](guides#guide=admission-metrics&section=q127-metrics-query-observed-value)
diagnostics.target_health: У Prometheus может не быть активной цели board со статусом up и пустым lastError. Проверьте список активных целей и ошибку сбора. [Причина и проверка](guides#guide=admission-metrics&section=q127-metrics-active-board-target)
diagnostics.observer_delivery: 'У наблюдателя может не быть текущего готового worker, или он публикует устаревший либо неверный результат. Проверьте локальный ответ каждого наблюдателя: count должен показать 2, sum — 7. [Причина и проверка](guides#guide=admission-metrics&section=q127-metrics-observer-result-delivery)'
diagnostics.observer_progress: Счётчик наблюдений мог остановиться. Прочитайте /tmp/observations дважды в одном текущем worker и убедитесь, что при опросе он растёт. [Причина и проверка](guides#guide=admission-metrics&section=q127-metrics-observer-poll-progress)
diagnostics.probe_0_1: Проверка доставки могла остановиться до вывода конкретного условия. Проверьте доступность адреса Prometheus и Pod клиента и наблюдателей. [Причина и проверка](guides#guide=admission-metrics&section=q127-metrics-observer-delivery-input)
