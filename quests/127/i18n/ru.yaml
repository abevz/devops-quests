title: Диагностика scrape Prometheus
brief: 'Приватный закреплённый Prometheus опрашивает board:8080/metrics.txt каждые
  две секунды. Pod board отдаёт учебный gauge очереди на 8080, но Service направляет
  на 8099, и цель недоступна. Верните только targetPort Service 8080. Через клиентский
  Pod используйте сохранённый endpoint Prometheus: проверьте здоровье цели, up=1,
  два ряда north и сумму 7. Метрики явно учебные; сервер и scrape настоящие. Gauge
  — текущее значение, поэтому rate() для этой глубины очереди не подходит.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `metrics.json`,
  `board.json`, `service.json`, `client.json`, `prometheus-target.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно
  загруженные образы и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Реальная цель доступна, собраны два gauge-ряда north, их настоящая
  сумма PromQL равна семи.'
debrief: Настоящие scrape и query подтвердили восстановление; одной readiness недостаточно
  для метрик приложения.
stages.0.brief: 'Результат проверки: Реальная цель доступна, собраны два gauge-ряда
  north, их настоящая сумма PromQL равна семи.'
stages.0.objectives.0.text: Реальная цель доступна, собраны два gauge-ряда north,
