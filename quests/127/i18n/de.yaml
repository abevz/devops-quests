title: Diagnose der Prometheus-Metrikerfassung
brief: |-
  Der private Metrikpfad liefert die erforderlichen Beobachtungen nicht. Stelle Scrape-Gesundheit und aktuelle Aggregate für beide vorhandenen Abfrageverbraucher wieder her.

  Arbeite auf der Workstation in `~/quest` mit den bereitgestellten Dateien:
  - `prometheus-target.json`.
  - `observer-contract.json`.

  **Anforderungen:**

  - Der vorhandene board-Service erreicht nur den bereitgestellten board-Workload über seine deklarierte HTTP-Schnittstelle und den Anwendungs-Listener. Erhalte ursprüngliche Identitäten von Service, ConfigMaps und Deployments sowie bereitgestellte Images. Gewünschte und laufende Eingaben beider Abfrageverbraucher müssen dieselbe Metrikfamilie, denselben Job und dieselbe Route wie die erforderlichen Beobachtungen auswählen und das bereitgestellte Polling-Programm unverändert nutzen, gemäß `observer-contract.json`.
  - Das private Prometheus meldet ein `up`-Ergebnis mit Wert `1` für Job `board`; mindestens ein aktives `board`-Ziel ist `up` ohne Scrape-Fehler. Jeder bereitgestellte Abfrageverbraucher hat einen aktuellen bereiten Pod, liefert sein deklariertes Aggregat und setzt erfolgreiche Beobachtungen gemäß `observer-contract.json` fort.
  - Für Job `board` und Route `north` hat `station_queue_depth` genau `2` Serien mit Summe `7`; beide Aggregatabfragen sind erfolgreich und liefern ein Ergebnis.

  Prüfungen beobachten aktuelle Reihen, Konfiguration, Snapshots und Fortschritt, nicht den vollständigen Anfrage- oder Änderungsverlauf. Bereitgestelltes Polling-Programm und privater Prometheus-Endpunkt bleiben Teil dieser begrenzten Übung.
debrief: Die Prüfungen verglichen erhaltenen Metrikpfad, reale Scrape-Gesundheit und Reihen, Verbraucheridentitäten
  und Code, gewünschte und laufende Eingaben, aktuelle Aggregate und Beobachtungsfortschritt.
stages.0.brief: Belegen Sie tatsächliche Scrape- und Gauge-Beobachtungen statt abgeleiteter Verkehrshistorie.
hints.0.text: Scrape-Transport, Labels gespeicherter Zeitreihen und die Absicht einer nachgelagerten Abfrage sind
  getrennte Abhängigkeiten. Eine Reparatur schreibt die anderen nicht um; geänderte gewünschte Umgebungswerte aktualisieren
  keinen bestehenden Prozess.
hints.1.text: |-
  Verfolge Service und rohe Metrikdaten über privates Prometheus zu gewünschten Eingaben, aktuellem Pod und Polling-Programm jedes vorhandenen Abfrageverbrauchers:

  ```sh
  cat prometheus-target.json observer-contract.json
  kubectl get service board -o yaml
  kubectl get configmap board-metrics observer-program -o yaml
  kubectl get deployment,pods -o yaml
  url=$(jq -r .url prometheus-target.json)
  kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/targets"
  ```
hints.2.text: |-
  Prüfe Scrape-Gesundheit und erforderliche Aggregate, danach passende aktuelle JSON-Antwort, unverändertes Programm und fortschreitenden Beobachtungszähler jedes Verbrauchers:

  ```sh
  url=$(jq -r .url prometheus-target.json)
  kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/query?query=up%7Bjob%3D%22board%22%7D"
  kubectl get deployment,pods -o yaml
  kubectl get configmap observer-program -o jsonpath='{.data.poll\.sh}' | sha256sum
  for name in observer-count observer-total; do
   kubectl exec deployment/"$name" -- sha256sum /opt/observer/poll.sh
   kubectl exec deployment/"$name" -- wget -qO- -T 2 http://127.0.0.1:8080
   kubectl exec deployment/"$name" -- cat /tmp/observations
  done
  sleep 2
  for name in observer-count observer-total; do
   kubectl exec deployment/"$name" -- cat /tmp/observations
  done
  ```
phrases.0: Ich habe den Fehler scrape über den Fehler Service verfolgt.
phrases.1: Ich habe up und die aufgezeichnete Metrik labels überprüft.
phrases.2: Ich habe die für einen gauge geeignete Aggregation verwendet.
