diagnostics.probe_0_0: Service-Pfad oder erhaltene Abfrageeingaben und Programm konnten nicht geprüft werden.
diagnostics.observer_identity: Ein ursprüngliches Metrikobjekt, eine Abfrageverbraucher-Identität oder ein bereitgestelltes
  Image wurde geändert oder ist nicht verfügbar.
diagnostics.observer_code: Bereitgestellte Polling-ConfigMap, Programmbytes oder tatsächliche Startkonfiguration
  wurden geändert.
diagnostics.observer_template: Gewünschte Abfrageeingaben wählen noch eine andere Metrikfamilie, einen anderen Job,
  eine andere Route oder Operation.
diagnostics.observer_current: Ein aktueller zugehöriger Abfrageverbraucher-Pod fehlt, ist nicht bereit oder läuft
  noch mit anderen Eingaben.
diagnostics.observer_delivery: Ein aktueller Abfragesnapshot ist nicht verfügbar oder enthält nicht das deklarierte
  Aggregat.
diagnostics.observer_progress: Der Beobachtungszähler stieg nicht, wurde zurückgesetzt oder belegt keinen aktuellen
  Polling-Fortschritt.
diagnostics.probe_0_1: Aktuelle Aggregatveröffentlichung und Polling-Fortschritt konnten nicht geprüft werden.
