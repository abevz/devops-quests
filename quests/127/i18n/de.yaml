title: Diagnose der Prometheus-Metrikerfassung
brief: 'Ein privater Prometheus mit festgelegter Version erfasst alle zwei Sekunden Metriken von board:8080/metrics.txt.
  Der Pod board stellt auf 8080 eine kleine synthetische Gauge-Metrik für die Warteschlangentiefe bereit.
  Sein Service leitet jedoch an 8099 weiter, sodass das Ziel nicht erreichbar ist. Stelle nur Service
  targetPort 8080 wieder her. Verwende den festgehaltenen Prometheus-Endpoint von einem Pod client aus,
  um Zielzustand, up=1, zwei north-Zeitreihen und ihre Summe 7 zu prüfen. Die gelieferten Metriken sind
  ausdrücklich Übungsdaten; Server und Metrikerfassung sind echt. Eine Gauge-Metrik zeigt den aktuellen
  Wert, daher ist rate() für diese Warteschlangentiefe ungeeignet.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `metrics.json`, `board.json`, `service.json`,
  `client.json`, `prometheus-target.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Anfängliche Erfolgskriterien: Das echte Ziel ist erreichbar, zwei north-Gauge-Zeitreihen werden erfasst
  und ihre tatsächliche PromQL-Summe beträgt sieben.'
debrief: Eine echte Erholung von scrape und query; readiness allein würde die aufgezeichneten Anwendungsmetriken
  nicht beweisen.
stages.0.brief: 'Erfolgskriterien: Das echte Ziel ist erreichbar, zwei north-Gauge-Zeitreihen werden erfasst
  und ihre tatsächliche PromQL-Summe beträgt sieben.'
stages.0.objectives.0.text: Das echte Ziel ist erreichbar, zwei north-Gauge-Zeitreihen werden erfasst
  und ihre tatsächliche PromQL-Summe beträgt sieben.
hints.0.text: Separate exporter-Antwort, Service-Weiterleitung und scrape-Zustand.
hints.1.text: Ein up-Wert von Null bedeutet, dass der scrape fehlgeschlagen ist, nicht, dass die Warteschlange
  leer ist.
hints.2.text: Reparieren Sie den Port Service backend, warten Sie auf einen scrape und fragen Sie sowohl
  count als auch sum ab.
phrases.0: Ich habe den Fehler scrape über den Fehler Service verfolgt.
phrases.1: Ich habe up und die aufgezeichnete Metrik labels überprüft.
phrases.2: Ich habe die für einen gauge geeignete Aggregation verwendet.
questions.0.points.0: Ob der letzte scrape eines Ziels erfolgreich war.
questions.0.points.1: Es beweist nicht, dass der Geschäftsbetrieb erfolgreich war.
questions.0.prompt: Was misst der up?
questions.1.points.0: Die Gauge-Metrik bildet bereits die aktuelle Warteschlangengröße ab.
questions.1.points.1: Rate ist für counter Änderungen im Laufe der Zeit gedacht.
questions.1.prompt: Warum nicht rate und Warteschlangentiefe gauge?
