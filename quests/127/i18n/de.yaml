diagnostics.port: Dem Service board fehlt möglicherweise der benannte http-Port auf TCP 8080. Prüfe die Konfiguration des veröffentlichten Ports. [Ursache und Prüfung](guides#guide=admission-metrics&section=q127-metrics-board-service-port)
diagnostics.target_port: targetPort von board verweist möglicherweise auf den falschen Port oder einen Namen, der nicht in allen aktuellen Ziel-Pods zu TCP 8080 aufgelöst wird. Prüfe die Portangaben im Service und in den Containern. [Ursache und Prüfung](guides#guide=admission-metrics&section=q127-metrics-board-target-port)
diagnostics.selector: 'Der Service-Selektor erfasst möglicherweise einen vorgesehenen board-Pod nicht oder trifft einen anderen Workload. Prüfe app: board und vergleiche den vollständigen Selektor mit den aktuellen Pod-Labels. [Ursache und Prüfung](guides#guide=admission-metrics&section=q127-metrics-board-selector)'
diagnostics.probe_0_0: Die Beobachtung wurde möglicherweise vor Meldung einer Bedingung abgebrochen. Prüfe den Zugriff auf den Service board und aktuelle Workloads. [Ursache und Prüfung](guides#guide=admission-metrics&section=q127-metrics-board-observer-input)
diagnostics.observer_identity: Ein bereitgestellter Service oder Workload ist möglicherweise nicht lesbar, wurde ersetzt oder verwendet ein anderes Image. Vergleiche aktuelle Objekte und worker-Images mit den erfassten Identitäten. [Ursache und Prüfung](guides#guide=admission-metrics&section=q127-metrics-retained-observer-identity)
diagnostics.observer_code: Die Metrik- oder Programm-ConfigMap wurde möglicherweise ersetzt, das Programm weicht ab oder der aktuelle worker startet einen anderen Befehl. Prüfe bereitgestellte ConfigMaps, Startbefehl und Hash des eingehängten Programms. [Ursache und Prüfung](guides#guide=admission-metrics&section=q127-metrics-retained-observer-program)
diagnostics.observer_template: Die Deployment-Vorlage löst möglicherweise andere Abfrageparameter auf. Vergleiche PROMETHEUS_URL, METRIC, ROUTE, JOB und OPERATION jedes Beobachters mit den bereitgestellten Vorgaben. [Ursache und Prüfung](guides#guide=admission-metrics&section=q127-metrics-observer-environment-template)
diagnostics.observer_current: Ein aktueller bereiter Beobachter-Pod ist möglicherweise nicht verfügbar oder die worker-Umgebung weicht von den erwarteten Vorgaben ab. Prüfe die Eigentümerkette und wiederhole die Beobachtung im Pod. [Ursache und Prüfung](guides#guide=admission-metrics&section=q127-metrics-observer-current-environment)
diagnostics.up_status: Die angegebene Prometheus-Abfrage war möglicherweise nicht erreichbar oder lieferte einen Fehler. Prüfe den Endpunkt aus client und wiederhole die in der Meldung genannte Abfrage auf status success. [Ursache und Prüfung](guides#guide=admission-metrics&section=q127-metrics-query-status)
diagnostics.sum_status: Die angegebene Prometheus-Abfrage war möglicherweise nicht erreichbar oder lieferte einen Fehler. Prüfe den Endpunkt aus client und wiederhole die in der Meldung genannte Abfrage auf status success. [Ursache und Prüfung](guides#guide=admission-metrics&section=q127-metrics-query-status)
diagnostics.count_status: Die angegebene Prometheus-Abfrage war möglicherweise nicht erreichbar oder lieferte einen Fehler. Prüfe den Endpunkt aus client und wiederhole die in der Meldung genannte Abfrage auf status success. [Ursache und Prüfung](guides#guide=admission-metrics&section=q127-metrics-query-status)
diagnostics.up_count: Die angegebene Abfrage liefert möglicherweise keinen oder mehr als einen Eintrag. Prüfe job- und route-Filter und bestätige genau ein Ergebnis für diese Abfrage. [Ursache und Prüfung](guides#guide=admission-metrics&section=q127-metrics-query-vector-cardinality)
diagnostics.sum_count: Die angegebene Abfrage liefert möglicherweise keinen oder mehr als einen Eintrag. Prüfe job- und route-Filter und bestätige genau ein Ergebnis für diese Abfrage. [Ursache und Prüfung](guides#guide=admission-metrics&section=q127-metrics-query-vector-cardinality)
diagnostics.count_count: Die angegebene Abfrage liefert möglicherweise keinen oder mehr als einen Eintrag. Prüfe job- und route-Filter und bestätige genau ein Ergebnis für diese Abfrage. [Ursache und Prüfung](guides#guide=admission-metrics&section=q127-metrics-query-vector-cardinality)
diagnostics.up_value: Die angegebene Abfrage lieferte möglicherweise einen anderen Messwert. Vergleiche je nach Meldung up mit 1, sum mit 7 oder count mit 2. [Ursache und Prüfung](guides#guide=admission-metrics&section=q127-metrics-query-observed-value)
diagnostics.sum_value: Die angegebene Abfrage lieferte möglicherweise einen anderen Messwert. Vergleiche je nach Meldung up mit 1, sum mit 7 oder count mit 2. [Ursache und Prüfung](guides#guide=admission-metrics&section=q127-metrics-query-observed-value)
diagnostics.count_value: Die angegebene Abfrage lieferte möglicherweise einen anderen Messwert. Vergleiche je nach Meldung up mit 1, sum mit 7 oder count mit 2. [Ursache und Prüfung](guides#guide=admission-metrics&section=q127-metrics-query-observed-value)
diagnostics.target_health: Prometheus hat möglicherweise kein aktives board-Ziel mit health up und leerem lastError. Prüfe die aktiven Ziele und den Scrape-Fehler. [Ursache und Prüfung](guides#guide=admission-metrics&section=q127-metrics-active-board-target)
diagnostics.observer_delivery: Ein Beobachter hat möglicherweise keinen aktuellen bereiten worker oder liefert ein veraltetes oder falsches Ergebnis. Prüfe lokal die Antwort jedes Beobachters, wobei count 2 und sum 7 ergeben muss. [Ursache und Prüfung](guides#guide=admission-metrics&section=q127-metrics-observer-result-delivery)
diagnostics.observer_progress: Der Beobachtungszähler steht möglicherweise still. Lies /tmp/observations zweimal im selben aktuellen worker und bestätige den Anstieg während der Abfragen. [Ursache und Prüfung](guides#guide=admission-metrics&section=q127-metrics-observer-poll-progress)
diagnostics.probe_0_1: Die Prüfung der Ergebnisauslieferung wurde möglicherweise vor Meldung einer Bedingung abgebrochen. Prüfe die Verfügbarkeit des Prometheus-Endpunkts sowie der Client- und Beobachter-Pods. [Ursache und Prüfung](guides#guide=admission-metrics&section=q127-metrics-observer-delivery-input)
