  HTTP declarada y el listener de la aplicación. Conserva las identidades originales de Service, ConfigMaps y Deployments
  y las imágenes suministradas. Las entradas deseadas y actuales de ambos consumidores deben seleccionar la misma
  familia de métricas, job y ruta que las observaciones requeridas y usar sin cambios el programa de sondeo suministrado
  según `observer-contract.json`.
stages.0.objectives.1.text: Prometheus privado informa un resultado `up` de `1` para el job `board`, y al menos
  un destino `board` activo está `up` sin error de scrape. Cada consumidor suministrado tiene un Pod actual listo,
  sirve su agregado declarado y continúa observaciones correctas según `observer-contract.json`.
