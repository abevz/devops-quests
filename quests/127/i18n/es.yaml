title: Diagnóstico de la recopilación de métricas de Prometheus
brief: |-
  La monitorización no muestra los resultados esperados de la cola board. Restaure la salud real del scrape y las observaciones acordadas del gauge.

  Trabaja en la workstation en `~/quest` con los archivos suministrados:
  - `metrics.yaml`, `board.yaml`, `service.yaml`, `client.yaml`, `prometheus-target.json`.

  **Requirements:**

  - El Service board existente alcanza solo la carga board suministrada mediante su interfaz HTTP declarada y el listener de la aplicación.
  - Prometheus privado informa un resultado `up` de `1` para el job `board`, y al menos un destino `board` activo está `up` sin error de scrape.
  - Para job `board` y ruta `north`, `station_queue_depth` tiene exactamente `2` series con suma `7`; ambas consultas agregadas tienen éxito con un resultado.

  El gauge es un fixture sintético de práctica; Prometheus y su scrape cada dos segundos son reales. Las comprobaciones observan resultados actuales del Service/consultas, no el historial ni quién consultó.
debrief: Un verdadero scrape y query demostraron recuperación; readiness por sí solo no demostraría las
  métricas de aplicación registradas.
stages.0.brief: Demuestra observaciones reales de scrape y gauge, no un historial de tráfico inferido.
hints.0.text: Separe la respuesta exporter, el reenvío Service y el estado scrape.
hints.1.text: |-
  Un valor de up de cero significa que el scrape falló, no que la cola esté vacía. La profundidad de cola es un gauge de valor actual, por lo que `rate()` no es apropiado.

  Inspecciona los datos suministrados y las observaciones activas:

  ```sh
  kubectl get service board -o yaml
  cat prometheus-target.json
  ```
hints.2.text: |-
  Reparar el puerto Service backend, esperar un scrape y consultar tanto el conteo como el sum. El listener board sirve en `8080`, pero el backend suministrado del Service es `8099`; restaure solo targetPort a `8080` y espere un scrape.

  Verifica el resultado desde `~/quest` en la workstation:

  - La consulta tiene éxito con un resultado cuyo valor es `1`.

    ```sh
    url=$(jq -r .url prometheus-target.json)
    kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/query?query=up%7Bjob%3D%22board%22%7D"
    ```

  - Ambas consultas tienen éxito con un resultado: suma `7`, cantidad `2`.

    ```sh
    url=$(jq -r .url prometheus-target.json)
    for aggregate in sum count; do
      kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/query?query=$aggregate%28station_queue_depth%7Bjob%3D%22board%22%2Croute%3D%22north%22%7D%29"
    done
    ```

  Un destino board activo está up sin error de scrape:

  ```sh
  url=$(jq -r .url prometheus-target.json)
  kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/targets?state=active"
  ```
phrases.0: Seguí la falla de scrape a través del Service.
phrases.1: Verifiqué up y la métrica registrada labels.
phrases.2: Utilicé la agregación adecuada para un gauge.
questions.0.points.0: Si el último scrape de un objetivo fue exitoso.
questions.0.points.1: No prueba que la operación comercial haya tenido éxito.
questions.0.prompt: ¿Qué mide up?
questions.1.points.0: La métrica gauge ya representa el tamaño actual de la cola.
questions.1.points.1: Rate está diseñado para cambios de counter a lo largo del tiempo.
questions.1.prompt: ¿Por qué no rate un gauge con profundidad de cola?
diagnostics.port: El puerto HTTP del Service board debe ser 8080.
diagnostics.target_port: El destino HTTP del Service board debe resolver al listener de la aplicación en el puerto 8080.
diagnostics.selector: El Service board debe seleccionar toda la carga suministrada board y ninguna otra.
diagnostics.target_health: Un target activo board debe estar up con lastError vacío.
diagnostics.up_status: La consulta up debe tener éxito.
diagnostics.up_count: La consulta up debe devolver exactamente un resultado.
diagnostics.up_value: El valor de la consulta up debe ser 1.
diagnostics.sum_status: La consulta sum debe tener éxito.
diagnostics.sum_count: La consulta sum debe devolver exactamente un resultado.
diagnostics.sum_value: El valor de la consulta sum debe ser 7.
diagnostics.count_status: La consulta count debe tener éxito.
diagnostics.count_count: La consulta count debe devolver exactamente un resultado.
diagnostics.count_value: El valor de la consulta count debe ser 2.
