title: Diagnóstico de la recopilación de métricas de Prometheus
brief: |-
  El camino privado de métricas no entrega las observaciones requeridas. Recupera la salud del scrape y los agregados actuales para ambos consumidores de consultas existentes.

  Trabaja en la estación de trabajo, en `~/quest`, con los archivos suministrados:
  - `prometheus-target.json`.
  - `observer-contract.json`.

  **Requisitos:**

  - El Service board existente alcanza solo la carga board suministrada mediante su interfaz HTTP declarada y el listener de la aplicación. Conserva las identidades originales de Service, ConfigMaps y Deployments y las imágenes suministradas. Las entradas deseadas y actuales de ambos consumidores deben seleccionar la misma familia de métricas, job y ruta que las observaciones requeridas y usar sin cambios el programa de sondeo suministrado según `observer-contract.json`.
  - Prometheus privado informa un resultado `up` de `1` para el job `board`, y al menos un destino `board` activo está `up` sin error de scrape. Cada consumidor suministrado tiene un Pod actual listo, sirve su agregado declarado y continúa observaciones correctas según `observer-contract.json`.
  - Para job `board` y ruta `north`, `station_queue_depth` tiene exactamente `2` series con suma `7`; ambas consultas agregadas tienen éxito con un resultado.

  Las comprobaciones observan series, configuración, instantáneas y progreso actuales, no el historial completo. El programa suministrado y endpoint privado de Prometheus forman parte del ejercicio acotado.
debrief: Las comprobaciones compararon camino conservado, salud real del scrape y series, identidades y código de
  consumidores, entradas deseadas y ejecutadas, agregados actuales y progreso de observación.
stages.0.brief: Demuestra observaciones reales de scrape y gauge, no un historial de tráfico inferido.
hints.0.text: El transporte de scrape, las etiquetas de series almacenadas y la intención de una consulta posterior
  son dependencias distintas. Reparar una no reescribe las demás, y cambiar el entorno deseado no actualiza un proceso
  existente.
hints.1.text: |-
  Sigue el Service y los datos de métricas originales por Prometheus privado hasta las entradas deseadas, el Pod actual y el programa de cada consumidor existente:

  ```sh
  cat prometheus-target.json observer-contract.json
  kubectl get service board -o yaml
  kubectl get configmap board-metrics observer-program -o yaml
  kubectl get deployment,pods -o yaml
  url=$(jq -r .url prometheus-target.json)
  kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/targets"
  ```
hints.2.text: |-
  Verifica la salud del scrape y los agregados requeridos; después la respuesta JSON actual correspondiente, el programa sin cambios y el contador de observaciones creciente de cada consumidor:

  ```sh
  url=$(jq -r .url prometheus-target.json)
  kubectl exec deployment/client -- wget -qO- -T 3 "$url/api/v1/query?query=up%7Bjob%3D%22board%22%7D"
  kubectl get deployment,pods -o yaml
  kubectl get configmap observer-program -o jsonpath='{.data.poll\.sh}' | sha256sum
  for name in observer-count observer-total; do
   kubectl exec deployment/"$name" -- sha256sum /opt/observer/poll.sh
   kubectl exec deployment/"$name" -- wget -qO- -T 2 http://127.0.0.1:8080
   kubectl exec deployment/"$name" -- cat /tmp/observations
  done
  sleep 2
  for name in observer-count observer-total; do
   kubectl exec deployment/"$name" -- cat /tmp/observations
  done
  ```
phrases.0: Seguí la falla de scrape a través del Service.
phrases.1: Verifiqué up y la métrica registrada labels.
phrases.2: Utilicé la agregación adecuada para un gauge.
questions.0.points.0: Si el último scrape de un objetivo fue exitoso.
questions.0.points.1: No prueba que la operación comercial haya tenido éxito.
questions.0.prompt: ¿Qué mide up?
questions.1.points.0: La métrica gauge ya representa el tamaño actual de la cola.
questions.1.points.1: Rate está diseñado para cambios de counter a lo largo del tiempo.
questions.1.prompt: ¿Por qué no rate un gauge con profundidad de cola?
