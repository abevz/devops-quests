diagnostics.probe_0_0: No se pudo verificar el camino del Service o entradas y código conservados de consultas.
diagnostics.observer_identity: Cambió o no está disponible un objeto de métricas original, una identidad de consumidor
  o una imagen suministrada.
diagnostics.observer_code: Cambió el ConfigMap del sondeo, los bytes del programa o su configuración real de inicio.
diagnostics.observer_template: Las entradas deseadas aún seleccionan otra familia de métricas, job, ruta u operación.
diagnostics.observer_current: Falta un Pod actual del consumidor, no está listo o aún ejecuta entradas diferentes.
diagnostics.observer_delivery: La instantánea actual de consulta no está disponible o no contiene el agregado declarado.
diagnostics.observer_progress: El contador de observaciones no avanzó, se reinició o no permite establecer progreso
  actual.
diagnostics.probe_0_1: No se pudo verificar la publicación actual de agregados y el progreso del sondeo.
