title: Diagnóstico de la recopilación de métricas de Prometheus
brief: 'Una instancia privada de Prometheus con versión fijada recopila métricas de board:8080/metrics.txt cada dos segundos.
  El Pod board expone en 8080 una pequeña métrica gauge sintética de profundidad de cola, pero su Service reenvía el tráfico
  a 8099, por lo que el destino está caído. Restaura únicamente Service targetPort 8080. Desde un Pod client, utiliza el endpoint
  de Prometheus registrado para verificar el estado del destino, up=1, las dos series north y su suma 7. Las métricas suministradas
  son datos explícitos de entrenamiento; el servidor y la recopilación son reales. Una métrica gauge es un valor actual, por
  lo que rate() no es apropiado para esta profundidad de cola.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `metrics.json`, `board.json`, `service.json`,
  `client.json`, `prometheus-target.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas y servicios
  privados. Cambie sólo esta bahía.


  Lee `metrics.json`, `board.json`, `service.json`, `client.json` y `prometheus-target.json`. El primer puerto y targetPort
  del Service deben ser 8080 y el selector exactamente `app: board`. Con la URL fijada de Prometheus, la consulta `up{job="board"}`
  debe tener éxito con un resultado igual a 1; `sum(station_queue_depth{job="board",route="north"})` y `count` de esas series
  deben tener éxito con un resultado igual a 7 y 2 respectivamente. Al menos un target activo `board` debe estar `up` con
  `lastError` vacío. Las comprobaciones observan el Service y los resultados actuales, no el historial de edición ni si ejecutaste
  personalmente las consultas.'
debrief: Un verdadero scrape y query demostraron recuperación; readiness por sí solo no demostraría las métricas de aplicación
  registradas.
stages.0.brief: El Service, target activo y tres resultados de consulta de Prometheus coinciden con la descripción.
stages.0.objectives.0.text: El Service, target activo y tres resultados de consulta de Prometheus coinciden con la descripción.
hints.0.text: Separe la respuesta exporter, el reenvío Service y el estado scrape.
hints.1.text: Un valor de up de cero significa que el scrape falló, no que la cola esté vacía.
hints.2.text: Reparar el puerto Service backend, esperar un scrape y consultar tanto el conteo como el sum.
phrases.0: Seguí la falla de scrape a través del Service.
phrases.1: Verifiqué up y la métrica registrada labels.
phrases.2: Utilicé la agregación adecuada para un gauge.
questions.0.points.0: Si el último scrape de un objetivo fue exitoso.
questions.0.points.1: No prueba que la operación comercial haya tenido éxito.
questions.0.prompt: ¿Qué mide up?
questions.1.points.0: La métrica gauge ya representa el tamaño actual de la cola.
questions.1.points.1: Rate está diseñado para cambios de counter a lo largo del tiempo.
questions.1.prompt: ¿Por qué no rate un gauge con profundidad de cola?
