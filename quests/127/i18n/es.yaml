diagnostics.port: El Service board puede carecer del puerto http con nombre en TCP 8080. Comprueba la configuración del puerto publicado. [Causa y comprobación](guides#guide=admission-metrics&section=q127-metrics-board-service-port)
diagnostics.target_port: targetPort de board puede apuntar a otro puerto o a un nombre que no resuelve a TCP 8080 en todos los Pods de destino actuales. Comprueba los puertos del Service y los contenedores. [Causa y comprobación](guides#guide=admission-metrics&section=q127-metrics-board-target-port)
diagnostics.selector: 'El selector del Service puede omitir un Pod de board o seleccionar otra carga. Comprueba app: board y compara el selector completo con las etiquetas actuales de los Pods. [Causa y comprobación](guides#guide=admission-metrics&section=q127-metrics-board-selector)'
diagnostics.probe_0_0: La observación puede haberse detenido antes de indicar una condición. Comprueba el acceso al Service board y a las cargas actuales. [Causa y comprobación](guides#guide=admission-metrics&section=q127-metrics-board-observer-input)
diagnostics.observer_identity: Un Service o carga proporcionados pueden ser ilegibles, haber sido sustituidos o usar otra imagen. Compara los objetos actuales y las imágenes de worker con el registro de identidades. [Causa y comprobación](guides#guide=admission-metrics&section=q127-metrics-retained-observer-identity)
diagnostics.observer_code: El ConfigMap de métricas o del programa puede haberse sustituido, el programa puede haber cambiado o el worker actual puede iniciar otro comando. Comprueba los ConfigMaps proporcionados, el comando de arranque y el hash del programa montado. [Causa y comprobación](guides#guide=admission-metrics&section=q127-metrics-retained-observer-program)
diagnostics.observer_template: La plantilla del Deployment puede resolver entradas distintas para la consulta. Compara PROMETHEUS_URL, METRIC, ROUTE, JOB y OPERATION de cada observador con el objetivo proporcionado. [Causa y comprobación](guides#guide=admission-metrics&section=q127-metrics-observer-environment-template)
diagnostics.observer_current: Puede faltar un Pod actual y listo del observador o el entorno de worker puede diferir de las entradas esperadas. Comprueba la cadena de propietarios y repite la observación dentro del Pod. [Causa y comprobación](guides#guide=admission-metrics&section=q127-metrics-observer-current-environment)
diagnostics.up_status: La consulta indicada de Prometheus puede ser inaccesible o haber devuelto un error. Comprueba el endpoint desde client y repite la consulta del mensaje hasta confirmar status success. [Causa y comprobación](guides#guide=admission-metrics&section=q127-metrics-query-status)
diagnostics.sum_status: La consulta indicada de Prometheus puede ser inaccesible o haber devuelto un error. Comprueba el endpoint desde client y repite la consulta del mensaje hasta confirmar status success. [Causa y comprobación](guides#guide=admission-metrics&section=q127-metrics-query-status)
diagnostics.count_status: La consulta indicada de Prometheus puede ser inaccesible o haber devuelto un error. Comprueba el endpoint desde client y repite la consulta del mensaje hasta confirmar status success. [Causa y comprobación](guides#guide=admission-metrics&section=q127-metrics-query-status)
diagnostics.up_count: La consulta indicada puede devolver cero entradas o más de una. Comprueba los filtros job y route y confirma que esa consulta devuelve un solo resultado. [Causa y comprobación](guides#guide=admission-metrics&section=q127-metrics-query-vector-cardinality)
diagnostics.sum_count: La consulta indicada puede devolver cero entradas o más de una. Comprueba los filtros job y route y confirma que esa consulta devuelve un solo resultado. [Causa y comprobación](guides#guide=admission-metrics&section=q127-metrics-query-vector-cardinality)
diagnostics.count_count: La consulta indicada puede devolver cero entradas o más de una. Comprueba los filtros job y route y confirma que esa consulta devuelve un solo resultado. [Causa y comprobación](guides#guide=admission-metrics&section=q127-metrics-query-vector-cardinality)
diagnostics.up_value: La consulta indicada puede haber devuelto una muestra distinta. Según la consulta del mensaje, compara up con 1, sum con 7 o count con 2. [Causa y comprobación](guides#guide=admission-metrics&section=q127-metrics-query-observed-value)
diagnostics.sum_value: La consulta indicada puede haber devuelto una muestra distinta. Según la consulta del mensaje, compara up con 1, sum con 7 o count con 2. [Causa y comprobación](guides#guide=admission-metrics&section=q127-metrics-query-observed-value)
diagnostics.count_value: La consulta indicada puede haber devuelto una muestra distinta. Según la consulta del mensaje, compara up con 1, sum con 7 o count con 2. [Causa y comprobación](guides#guide=admission-metrics&section=q127-metrics-query-observed-value)
diagnostics.target_health: Prometheus puede carecer de un destino activo board con estado up y lastError vacío. Revisa la lista de destinos activos y el error de recolección. [Causa y comprobación](guides#guide=admission-metrics&section=q127-metrics-active-board-target)
diagnostics.observer_delivery: Un observador puede carecer de un worker actual y listo o publicar un resultado desactualizado o erróneo. Comprueba la respuesta local de cada observador, donde count debe dar 2 y sum 7. [Causa y comprobación](guides#guide=admission-metrics&section=q127-metrics-observer-result-delivery)
diagnostics.observer_progress: El contador de observaciones puede haberse detenido. Lee /tmp/observations dos veces en el mismo worker actual y confirma que aumenta durante el sondeo. [Causa y comprobación](guides#guide=admission-metrics&section=q127-metrics-observer-poll-progress)
diagnostics.probe_0_1: La observación de entrega puede haberse detenido antes de indicar una condición. Comprueba que estén disponibles el endpoint de Prometheus y los Pods de client y observadores. [Causa y comprobación](guides#guide=admission-metrics&section=q127-metrics-observer-delivery-input)
