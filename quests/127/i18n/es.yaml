hints.0.text: Separe la respuesta exporter, el reenvío Service y el estado scrape.
hints.1.text: Un valor de up de cero significa que el scrape falló, no que la cola esté vacía.
hints.2.text: Reparar el puerto Service backend, esperar un scrape y consultar tanto el conteo como el
  sum.
phrases.0: Seguí la falla de scrape a través del Service.
phrases.1: Verifiqué up y la métrica registrada labels.
phrases.2: Utilicé la agregación adecuada para un gauge.
questions.0.points.0: Si el último scrape de un objetivo fue exitoso.
questions.0.points.1: No prueba que la operación comercial haya tenido éxito.
questions.0.prompt: ¿Qué mide up?
questions.1.points.0: La métrica gauge ya representa el tamaño actual de la cola.
questions.1.points.1: Rate está diseñado para cambios de counter a lo largo del tiempo.
questions.1.prompt: ¿Por qué no rate un gauge con profundidad de cola?
