title: Diagnóstico de la recopilación de métricas de Prometheus
brief: 'Una instancia privada de Prometheus con versión fijada recopila métricas de board:8080/metrics.txt
  cada dos segundos. El Pod board expone en 8080 una pequeña métrica gauge sintética de profundidad de
  cola, pero su Service reenvía el tráfico a 8099, por lo que el destino está caído. Restaura únicamente
  Service targetPort 8080. Desde un Pod client, utiliza el endpoint de Prometheus registrado para verificar
  el estado del destino, up=1, las dos series north y su suma 7. Las métricas suministradas son datos
  explícitos de entrenamiento; el servidor y la recopilación son reales. Una métrica gauge es un valor
  actual, por lo que rate() no es apropiado para esta profundidad de cola.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `metrics.json`, `board.json`,
  `service.json`, `client.json`, `prometheus-target.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios iniciales de éxito: El destino real está activo, se registran dos series gauge north y su
  suma real mediante PromQL es siete.'
debrief: Un verdadero scrape y query demostraron recuperación; readiness por sí solo no demostraría las
  métricas de aplicación registradas.
stages.0.brief: 'Criterios de éxito: El destino real está activo, se registran dos series gauge north
  y su suma real mediante PromQL es siete.'
stages.0.objectives.0.text: El destino real está activo, se registran dos series gauge north y su suma
