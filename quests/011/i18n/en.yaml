title: Container commands
brief: 'The station clock exits during startup. In clock.json, repair its command and arguments so it
  writes a UTC timestamp to /tmp/clock, writes its own Pod name to /tmp/identity through POD_NAME, and
  keeps running. Keep Deployment clock and container worker. The required identity source is metadata.name;
  node access is not needed.


  Quest files in `~/quest` (some appear in later stages): `clock.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: Clock is available, its timestamp has UTC format, and its recorded identity
  matches its Pod name.'
debrief: The failure was in startup instructions, not image availability. The repaired process writes
  observable artifacts and obtains its identity from the Downward API.
stages.0.brief: 'Inspect the container startup failure and the POD_NAME field reference. A timestamp must
  use YYYY-MM-DDTHH:MM:SSZ.


  Success criteria: Clock is available, its timestamp has UTC format, and its recorded identity matches
  its Pod name.'
stages.0.objectives.0.text: Clock is available, its timestamp has UTC format, and its recorded identity
  matches its Pod name.
hints.0.text: Read the termination reason and logs before editing the image.
hints.1.text: Container command replaces the image entrypoint; fieldRef chooses the source of POD_NAME.
hints.2.text: Use a shell only when you need a sequence, and leave a long-lived foreground process.
phrases.0: I compared command and args with the image startup contract.
phrases.1: I used container logs and termination state to locate the failure.
phrases.2: I exposed Pod identity through a Downward API field reference.
questions.0.points.0: Compare the Pod template with the image entrypoint and default arguments.
questions.0.points.1: Inspect the last termination state and logs; a restart alone preserves the faulty
  template.
questions.0.points.2: A process that finishes successfully may still be wrong for a long-running Deployment.
questions.0.prompt: The image is correct but the process exits immediately. How do command and args help
  you narrow the failure?
questions.1.points.0: The API supplies the identity of the actual Pod instance.
questions.1.points.1: Replacement Pods have new identities without requiring a rebuilt image.
questions.1.points.2: This exposes selected metadata, not administrator credentials.
questions.1.prompt: Why is a Pod name obtained through fieldRef safer than a name written into the image?
