title: Container commands
brief: |-
  The SignalRail clock does not stay available.

  Work on the workstation in `~/quest` with the supplied files:
  - `clock.yaml`.

  **Requirements:**

  - Workload availability:
    - Deployment: `clock`.
    - Status: Rollout completes.
  - Artifacts inside container `worker` of the current Pod `app=clock`:
    - `/tmp/identity` contains that Pod's own name.
    - `/tmp/clock` contains a UTC timestamp in `YYYY-MM-DDTHH:MM:SSZ` format.

  Timestamp format does not establish clock accuracy or continuous updates.
debrief: The failure was in startup instructions, not image availability. The repaired process writes
  observable artifacts and obtains its identity from the Downward API.
stages.0.brief: Both artifacts belong to the current clock Pod.
stages.0.objectives.0.text: Deployment `clock` completes its rollout.
stages.0.objectives.1.text: The clock Pod records its own name in `/tmp/identity`.
stages.0.objectives.2.text: The clock Pod writes a UTC timestamp in `YYYY-MM-DDTHH:MM:SSZ` format to `/tmp/clock`.
hints.0.text: Workload availability depends on the lifetime of its foreground process.
hints.1.text: |-
  Read the termination reason and logs before editing the image. Container command replaces the image entrypoint; fieldRef chooses the source of POD_NAME. The required source for POD_NAME is metadata.name.

  Inspect the supplied inputs and live observations:

  ```sh
  kubectl describe pod -l app=clock
  kubectl logs deployment/clock --previous
  ```
hints.2.text: "Use a shell only when you need a sequence, and leave a long-lived foreground process.\n\nVerify from `~/quest` on the workstation. After the rollout completes, print each current Running Pod name and read its worker files:\n\n```sh\nkubectl rollout status deployment/clock --timeout=3s\nfor pod in $(kubectl get pods -l app=clock -o json | jq -r '.items[] | select(.metadata.deletionTimestamp == null and .status.phase == \"Running\") | .metadata.name'); do\n  printf '%s\\n' \"$pod\"\n  kubectl exec \"$pod\" -c worker -- cat /tmp/identity\n  printf '\\n'\n  kubectl exec \"$pod\" -c worker -- cat /tmp/clock\n  printf '\\n'\ndone\n```\n\nExpect at least one current Pod. For every Pod, `/tmp/identity` matches the printed Pod name and `/tmp/clock` contains a UTC timestamp in `YYYY-MM-DDTHH:MM:SSZ` format. Terminating Pods are omitted."
phrases.0: I compared command and args with the image startup contract.
phrases.1: I used container logs and termination state to locate the failure.
phrases.2: I exposed Pod identity through a Downward API field reference.
questions.0.points.0: Compare the Pod template with the image entrypoint and default arguments.
questions.0.points.1: Inspect the last termination state and logs; a restart alone preserves the faulty
  template.
questions.0.points.2: A process that finishes successfully may still be wrong for a long-running Deployment.
questions.0.prompt: The image is correct but the process exits immediately. How do command and args help
  you narrow the failure?
questions.1.points.0: The API supplies the identity of the actual Pod instance.
questions.1.points.1: Replacement Pods have new identities without requiring a rebuilt image.
questions.1.points.2: This exposes selected metadata, not administrator credentials.
questions.1.prompt: Why is a Pod name obtained through fieldRef safer than a name written into the image?
diagnostics.probe_0_1: 'The current inputs could not verify this objective: The clock Pod records its own name in
  `/tmp/identity`.'
diagnostics.probe_0_2: 'The current inputs could not verify this objective: The clock Pod writes a UTC timestamp
  in `YYYY-MM-DDTHH:MM:SSZ` format to `/tmp/clock`.'
