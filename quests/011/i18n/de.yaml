title: Containerbefehle
brief: 'Der station clock wird während des Startvorgangs beendet. Reparieren Sie in clock.json den command
  und die Argumente, sodass ein UTC timestamp in /tmp/clock und ein eigener Pod-Name geschrieben werden
  /tmp/identity bis POD_NAME und läuft weiter. Behalten Sie Deployment clock und Container worker. Die
  erforderliche Identitätsquelle ist metadata.name; Knotenzugriff ist nicht erforderlich.


  Questdateien in `~/quest` (einige erscheinen in späteren Phasen): `clock.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: Clock ist verfügbar, sein timestamp hat das UTC-Format und seine aufgezeichnete
  Identität stimmt mit seinem Pod-Namen überein.'
debrief: Der Fehler lag in den Startanweisungen und nicht in der Bildverfügbarkeit. Der reparierte Prozess
  schreibt beobachtbare Artefakte und erhält seine Identität vom Downward API.
stages.0.brief: 'Überprüfen Sie den Container-Startfehler und den POD_NAME field reference. Ein Zeitstempel
  muss YYYY-MM-DDTHH:MM:SSZ. verwenden


  Erfolgskriterien: Clock ist verfügbar, sein Zeitstempel hat das UTC-Format und seine aufgezeichnete
  Identität stimmt mit seinem Pod-Namen überein.'
stages.0.objectives.0.text: Clock ist verfügbar, sein Zeitstempel hat das UTC-Format und seine aufgezeichnete
  Identität stimmt mit seinem Pod-Namen überein.
hints.0.text: Lesen Sie den Abbruchgrund und die Protokolle, bevor Sie das Bild bearbeiten.
hints.1.text: Container-Befehl ersetzt das Bild entrypoint; fieldRef wählt die Quelle von POD_NAME.
hints.2.text: Verwenden Sie einen shell nur, wenn Sie eine Sequenz benötigen, und hinterlassen Sie einen
  langlebigen Vordergrundprozess.
phrases.0: Ich habe command und args mit dem Image-Startup-Vertrag verglichen.
phrases.1: Ich habe Containerprotokolle und den Beendigungsstatus verwendet, um den Fehler zu lokalisieren.
phrases.2: Ich habe die Identität Pod über eine Feldreferenz Downward API offengelegt.
questions.0.points.0: Vergleichen Sie die Vorlage Pod mit dem Bild entrypoint und den Standardargumenten.
questions.0.points.1: Überprüfen Sie den letzten Beendigungsstatus und die Protokolle. Allein durch einen
  Neustart bleibt die fehlerhafte Vorlage erhalten.
questions.0.points.2: Ein Prozess, der erfolgreich abgeschlossen wird, kann für einen lang laufenden Deployment
  immer noch falsch sein.
questions.0.prompt: Das Bild ist korrekt, aber der Vorgang wird sofort beendet. Wie helfen Ihnen command
  und args, den Fehler einzugrenzen?
questions.1.points.0: Der API liefert die Identität der tatsächlichen Pod-Instanz.
questions.1.points.1: Ersatz-Pods verfügen über neue Identitäten, ohne dass ein neu erstelltes Image erforderlich
  ist.
questions.1.points.2: Dadurch werden ausgewählte Metadaten verfügbar gemacht, nicht der Administrator
  credentials.
questions.1.prompt: Warum ist ein über fieldRef erhaltener Pod-Name sicherer als ein in das Bild geschriebener
  Name?
