title: Containerbefehle
brief: |-
  Die SignalRail-Uhr bleibt nicht verfügbar.

  Arbeiten Sie auf der Workstation in `~/quest` mit den bereitgestellten Dateien:
  - `clock.yaml`.

  **Anforderungen:**

  - Verfügbarkeit des Workloads:
    - Deployment: `clock`.
    - Status: Rollout abgeschlossen.
  - Artefakte im Container `worker` des aktuellen Pods `app=clock`:
    - `/tmp/identity` enthält den eigenen Namen dieses Pods.
    - `/tmp/clock` enthält einen UTC-Zeitstempel im Format `YYYY-MM-DDTHH:MM:SSZ`.

  Das Zeitstempelformat belegt weder Uhrgenauigkeit noch fortlaufende Aktualisierung.
debrief: Der Fehler lag in den Startanweisungen und nicht in der Bildverfügbarkeit. Der reparierte Prozess
  schreibt beobachtbare Artefakte und erhält seine Identität vom Downward API.
stages.0.brief: Beide Artefakte gehören zum aktuellen clock-Pod.
stages.0.objectives.0.text: Deployment `clock` schließt seinen Rollout ab.
stages.0.objectives.1.text: Der clock-Pod schreibt seinen eigenen Namen nach `/tmp/identity`.
stages.0.objectives.2.text: Der clock-Pod schreibt einen UTC-Zeitstempel im Format `YYYY-MM-DDTHH:MM:SSZ`
  nach `/tmp/clock`.
hints.0.text: Die Verfügbarkeit des Workloads hängt von der Lebensdauer seines Vordergrundprozesses ab.
hints.1.text: |-
  Lesen Sie den Abbruchgrund und die Protokolle, bevor Sie das Bild bearbeiten. Container-Befehl ersetzt das Bild entrypoint; fieldRef wählt die Quelle von POD_NAME. Die erforderliche Quelle für POD_NAME ist metadata.name.

  Prüfen Sie die bereitgestellten Eingaben und laufenden Beobachtungen:

  ```sh
  kubectl describe pod -l app=clock
  kubectl logs deployment/clock --previous
  ```
hints.2.text: |-
  Verwenden Sie einen shell nur, wenn Sie eine Sequenz benötigen, und hinterlassen Sie einen langlebigen Vordergrundprozess.

  Prüfen Sie das Ergebnis in `~/quest` auf der Workstation:

  - `kubectl rollout status deployment/clock --timeout=3s` — endet mit Code `0` und meldet einen abgeschlossenen Rollout.
  - `kubectl get pods -l app=clock -o name` und `kubectl exec deployment/clock -- cat /tmp/identity` — zeigen denselben aktuellen Pod-Namen. Die Datei wird im Container gelesen.
  - `kubectl exec deployment/clock -- cat /tmp/clock` — gibt einen UTC-Zeitstempel im Format `YYYY-MM-DDTHH:MM:SSZ` aus dem Container aus.
phrases.0: Ich habe command und args mit dem Image-Startup-Vertrag verglichen.
phrases.1: Ich habe Containerprotokolle und den Beendigungsstatus verwendet, um den Fehler zu lokalisieren.
phrases.2: Ich habe die Identität Pod über eine Feldreferenz Downward API offengelegt.
questions.0.points.0: Vergleichen Sie die Vorlage Pod mit dem Bild entrypoint und den Standardargumenten.
questions.0.points.1: Überprüfen Sie den letzten Beendigungsstatus und die Protokolle. Allein durch einen
  Neustart bleibt die fehlerhafte Vorlage erhalten.
questions.0.points.2: Ein Prozess, der erfolgreich abgeschlossen wird, kann für einen lang laufenden Deployment
  immer noch falsch sein.
questions.0.prompt: Das Bild ist korrekt, aber der Vorgang wird sofort beendet. Wie helfen Ihnen command
  und args, den Fehler einzugrenzen?
questions.1.points.0: Der API liefert die Identität der tatsächlichen Pod-Instanz.
questions.1.points.1: Ersatz-Pods verfügen über neue Identitäten, ohne dass ein neu erstelltes Image erforderlich
  ist.
questions.1.points.2: Dadurch werden ausgewählte Metadaten verfügbar gemacht, nicht der Administrator
  credentials.
questions.1.prompt: Warum ist ein über fieldRef erhaltener Pod-Name sicherer als ein in das Bild geschriebener
  Name?
