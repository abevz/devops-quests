title: Команды контейнера
brief: |-
  Часы SignalRail не остаются доступными.

  Работайте на workstation в `~/quest` с предоставленными файлами:
  - `clock.yaml`.

  **Требования:**

  - Доступность нагрузки:
    - Deployment: `clock`.
    - Состояние: Rollout завершён.
  - Артефакты внутри контейнера `worker` текущего Pod `app=clock`:
    - `/tmp/identity` содержит имя именно этого Pod.
    - `/tmp/clock` содержит время UTC в формате `YYYY-MM-DDTHH:MM:SSZ`.

  Формат timestamp не доказывает точность часов или непрерывное обновление.
debrief: Причина была в инструкции запуска, а не доступности образа. Исправленный процесс пишет проверяемые
  файлы и получает имя через Downward API.
stages.0.brief: Оба артефакта относятся к текущему Pod clock.
stages.0.objectives.0.text: Deployment `clock` завершает rollout.
stages.0.objectives.1.text: Pod clock записывает собственное имя в `/tmp/identity`.
stages.0.objectives.2.text: Pod clock записывает в `/tmp/clock` метку времени UTC в формате `YYYY-MM-DDTHH:MM:SSZ`.
hints.0.text: Доступность нагрузки зависит от времени жизни её основного процесса.
hints.1.text: |-
  Перед правкой образа прочитайте причину завершения и логи. Command заменяет entrypoint образа; fieldRef выбирает источник POD_NAME. Требуемый источник POD_NAME — metadata.name.

  Изучите предоставленные файлы и живые наблюдения:

  ```sh
  kubectl describe pod -l app=clock
  kubectl logs deployment/clock --previous
  ```
hints.2.text: "Используйте shell для последовательности команд и оставьте длительно работающий foreground-процесс.\n\nПроверьте результат из `~/quest` на рабочей станции. После завершения rollout выведите имя каждого текущего Pod в фазе Running и прочитайте файлы его контейнера worker:\n\n```sh\nkubectl rollout status deployment/clock --timeout=3s\nfor pod in $(kubectl get pods -l app=clock -o json | jq -r '.items[] | select(.metadata.deletionTimestamp == null and .status.phase == \"Running\") | .metadata.name'); do\n  printf '%s\\n' \"$pod\"\n  kubectl exec \"$pod\" -c worker -- cat /tmp/identity\n  printf '\\n'\n  kubectl exec \"$pod\" -c worker -- cat /tmp/clock\n  printf '\\n'\ndone\n```\n\nОжидается хотя бы один текущий Pod. Для каждого Pod `/tmp/identity` совпадает с выведенным именем Pod, а `/tmp/clock` содержит отметку времени UTC в формате `YYYY-MM-DDTHH:MM:SSZ`. Завершающиеся Pod пропускаются."
phrases.0: Я сравнил command и args с контрактом запуска образа.
phrases.1: Я использовал логи и состояние завершения контейнера для поиска сбоя.
phrases.2: Я передал идентификатор Pod через fieldRef Downward API.
questions.0.points.0: Сопоставьте шаблон Pod с entrypoint и аргументами образа.
questions.0.points.1: 'Прочитайте последнее завершение и логи: перезапуск сохраняет ошибочный шаблон.'
questions.0.points.2: Успешно завершившийся процесс всё равно может не подходить длительно работающему
  Deployment.
questions.0.prompt: Образ правильный, но процесс сразу завершается. Как command и args помогают сузить
  причину?
questions.1.points.0: API передаёт имя фактического экземпляра Pod.
questions.1.points.1: Заменяющие Pod получают новые имена без пересборки образа.
questions.1.points.2: Механизм раскрывает выбранные метаданные, а не credentials администратора.
questions.1.prompt: Почему имя Pod через fieldRef надёжнее имени, записанного в образ?
diagnostics.probe_0_1: 'Текущие данные не позволили проверить эту цель: Pod clock записывает собственное имя в `/tmp/identity`.'
