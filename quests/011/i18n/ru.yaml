title: Команды контейнера
brief: 'Часы станции завершаются при запуске. В clock.json исправьте command и args: процесс должен записать
  UTC timestamp в /tmp/clock, своё имя Pod через POD_NAME в /tmp/identity и остаться работающим. Сохраните
  Deployment clock и контейнер worker. Источник имени — metadata.name; доступ к узлам не нужен.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `clock.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Clock доступен, время записано в формате UTC, а записанное имя совпадает с именем
  Pod.'
debrief: Причина была в инструкции запуска, а не доступности образа. Исправленный процесс пишет проверяемые
  файлы и получает имя через Downward API.
stages.0.brief: 'Изучите отказ запуска и field reference POD_NAME. Формат времени — YYYY-MM-DDTHH:MM:SSZ.


  Результат проверки: Clock доступен, время записано в формате UTC, а записанное имя совпадает с именем
  Pod.'
stages.0.objectives.0.text: Clock доступен, время записано в формате UTC, а записанное имя совпадает с
  именем Pod.
hints.0.text: Перед правкой образа прочитайте причину завершения и логи.
hints.1.text: Command заменяет entrypoint образа; fieldRef выбирает источник POD_NAME.
hints.2.text: Используйте shell для последовательности команд и оставьте длительно работающий foreground-процесс.
phrases.0: Я сравнил command и args с контрактом запуска образа.
phrases.1: Я использовал логи и состояние завершения контейнера для поиска сбоя.
phrases.2: Я передал идентификатор Pod через fieldRef Downward API.
questions.0.points.0: Сопоставьте шаблон Pod с entrypoint и аргументами образа.
questions.0.points.1: 'Прочитайте последнее завершение и логи: перезапуск сохраняет ошибочный шаблон.'
questions.0.points.2: Успешно завершившийся процесс всё равно может не подходить длительно работающему
  Deployment.
questions.0.prompt: Образ правильный, но процесс сразу завершается. Как command и args помогают сузить
  причину?
questions.1.points.0: API передаёт имя фактического экземпляра Pod.
questions.1.points.1: Заменяющие Pod получают новые имена без пересборки образа.
questions.1.points.2: Механизм раскрывает выбранные метаданные, а не credentials администратора.
questions.1.prompt: Почему имя Pod через fieldRef надёжнее имени, записанного в образ?
