title: Comandos de contenedor
brief: |
  El reloj de SignalRail no se mantiene disponible.

  Trabaja en la workstation en `~/quest` con `clock.json`.

  **Requisitos:**
  - Disponibilidad de la carga:
    - Deployment: `clock`.
    - Estado: Rollout completado.
  - Artefactos dentro del contenedor `worker` del Pod actual `app=clock`:
    - `/tmp/identity` contiene el nombre de ese mismo Pod.
    - `/tmp/clock` contiene una marca de tiempo UTC en formato `YYYY-MM-DDTHH:MM:SSZ`.

  **Verifica antes de Check & finish:**
  - `kubectl rollout status deployment/clock --timeout=3s` — termina con código `0` e informa de un rollout completado.
  - `kubectl get pods -l app=clock -o name` y `kubectl exec deployment/clock -- cat /tmp/identity` — muestran el mismo nombre del Pod actual. El archivo se lee dentro del contenedor.
  - `kubectl exec deployment/clock -- cat /tmp/clock` — imprime desde el contenedor una marca de tiempo UTC en formato `YYYY-MM-DDTHH:MM:SSZ`.
debrief: El error se produjo en las instrucciones de inicio, no en la disponibilidad de la imagen. El
  proceso reparado escribe artefactos observables y obtiene su identidad del Downward API.
stages.0.brief: |
  El reloj debe mostrar su identidad y la hora desde su contenedor en ejecución.
stages.0.objectives.0.text: El Deployment `clock` completa su rollout.
stages.0.objectives.1.text: El Pod clock escribe su propio nombre en `/tmp/identity`.
stages.0.objectives.2.text: El Pod clock escribe en `/tmp/clock` una marca de tiempo UTC con formato `YYYY-MM-DDTHH:MM:SSZ`.
hints.0.text: Lea el motivo de la terminación y los registros antes de editar la imagen.
hints.1.text: |
  El comando de contenedor reemplaza la imagen entrypoint; fieldRef elige la fuente de POD_NAME. La fuente requerida para POD_NAME es metadata.name.
hints.2.text: Utilice un shell solo cuando necesite una secuencia y deje un proceso en primer plano de
  larga duración.
phrases.0: Comparé command y args con el contrato de inicio de imagen.
phrases.1: Utilicé registros de contenedor y estado de terminación para localizar la falla.
phrases.2: Expuse la identidad Pod a través de una referencia de campo Downward API.
questions.0.points.0: Compare la plantilla Pod con la imagen entrypoint y los argumentos predeterminados.
questions.0.points.1: Inspeccionar el último estado de terminación y los registros; un reinicio por sí
  solo conserva la plantilla defectuosa.
questions.0.points.2: Un proceso que finaliza exitosamente aún puede ser incorrecto para un Deployment
  de larga duración.
questions.0.prompt: La imagen es correcta pero el proceso sale inmediatamente. ¿Cómo le ayudan command
  y args a reducir el error?
questions.1.points.0: El API proporciona la identidad de la instancia Pod real.
questions.1.points.1: Los Pods de reemplazo tienen nuevas identidades sin necesidad de reconstruir una
  imagen.
questions.1.points.2: Esto expone los metadatos seleccionados, no el administrador credentials.
questions.1.prompt: ¿Por qué un nombre Pod obtenido a través de fieldRef es más seguro que un nombre escrito
  en la imagen?
