title: Polecenia kontenera
brief: |-
  Zegar SignalRail nie pozostaje dostępny.

  Pracuj na workstation w `~/quest` z dostarczonymi plikami:
  - `clock.yaml`.

  **Wymagania:**

  - Dostępność obciążenia:
    - Deployment: `clock`.
    - Stan: Rollout zakończony.
  - Artefakty wewnątrz kontenera `worker` bieżącego Poda `app=clock`:
    - `/tmp/identity` zawiera nazwę tego właśnie Poda.
    - `/tmp/clock` zawiera znacznik czasu UTC w formacie `YYYY-MM-DDTHH:MM:SSZ`.

  Format znacznika czasu nie dowodzi dokładności zegara ani ciągłego odświeżania.
debrief: Błąd dotyczył instrukcji uruchamiania, a nie dostępności obrazu. Naprawiony proces zapisuje obserwowalne
  artefakty i uzyskuje swoją tożsamość z Downward API.
stages.0.brief: Oba artefakty należą do bieżącego Poda clock.
stages.0.objectives.0.text: Deployment `clock` kończy rollout.
stages.0.objectives.1.text: Pod clock zapisuje własną nazwę w `/tmp/identity`.
stages.0.objectives.2.text: Pod clock zapisuje w `/tmp/clock` znacznik czasu UTC w formacie `YYYY-MM-DDTHH:MM:SSZ`.
hints.0.text: Dostępność obciążenia zależy od czasu życia jego procesu pierwszoplanowego.
hints.1.text: |-
  Przed edycją obrazu przeczytaj przyczynę zakończenia i logi. Polecenie kontenera zastępuje obraz entrypoint; fieldRef wybiera źródło POD_NAME. Wymaganym źródłem POD_NAME jest metadata.name.

  Sprawdź dostarczone dane i bieżące obserwacje:

  ```sh
  kubectl describe pod -l app=clock
  kubectl logs deployment/clock --previous
  ```
hints.2.text: "Używaj shell tylko wtedy, gdy potrzebujesz sekwencji i pozostaw długotrwały proces na pierwszym planie.\n\nSprawdź wynik z `~/quest` na stacji roboczej. Po zakończeniu rollout wypisz nazwę każdego bieżącego Poda w fazie Running i odczytaj pliki jego kontenera worker:\n\n```sh\nkubectl rollout status deployment/clock --timeout=3s\nfor pod in $(kubectl get pods -l app=clock -o json | jq -r '.items[] | select(.metadata.deletionTimestamp == null and .status.phase == \"Running\") | .metadata.name'); do\n  printf '%s\\n' \"$pod\"\n  kubectl exec \"$pod\" -c worker -- cat /tmp/identity\n  printf '\\n'\n  kubectl exec \"$pod\" -c worker -- cat /tmp/clock\n  printf '\\n'\ndone\n```\n\nOczekiwany jest co najmniej jeden bieżący Pod. Dla każdego Poda `/tmp/identity` odpowiada wypisanej nazwie Poda, a `/tmp/clock` zawiera znacznik czasu UTC w formacie `YYYY-MM-DDTHH:MM:SSZ`. Pody w trakcie kończenia są pomijane."
phrases.0: Porównałem command i args z umową startową obrazu.
phrases.1: Aby zlokalizować awarię, użyłem dzienników kontenera i stanu zakończenia.
phrases.2: Ujawniłem tożsamość Pod poprzez odwołanie do pola API w dół.
questions.0.points.0: Porównaj szablon Pod z obrazem entrypoint i domyślnymi argumentami.
questions.0.points.1: Sprawdź ostatni stan zakończenia i dzienniki; samo ponowne uruchomienie zachowuje
  wadliwy szablon.
questions.0.points.2: Proces, który zakończy się pomyślnie, może nadal być błędny w przypadku długotrwałego
  Deployment.
questions.0.prompt: Obraz jest poprawny, ale proces kończy się natychmiast. W jaki sposób command i args
  pomagają zawęzić zakres awarii?
questions.1.points.0: API dostarcza tożsamość rzeczywistej instancji Pod.
questions.1.points.1: Zamienne kapsuły mają nową tożsamość bez konieczności przebudowy obrazu.
questions.1.points.2: Spowoduje to ujawnienie wybranych metadanych, a nie administratora credentials.
questions.1.prompt: Dlaczego nazwa Pod uzyskana za pomocą fieldRef jest bezpieczniejsza niż nazwa wpisana
  w obraz?
diagnostics.probe_0_1: 'Bieżące dane nie pozwalają potwierdzić tego celu: Pod clock zapisuje własną nazwę w `/tmp/identity`.'
diagnostics.probe_0_2: 'Bieżące dane nie pozwalają potwierdzić tego celu: Pod clock zapisuje w `/tmp/clock` znacznik
  czasu UTC w formacie `YYYY-MM-DDTHH:MM:SSZ`.'
