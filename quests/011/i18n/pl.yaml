title: Polecenia kontenera
brief: 'Zegar station wyłącza się podczas uruchamiania. W clock.json napraw jego command i argumenty,
  aby zapisał UTC timestamp do /tmp/clock, zapisał własną nazwę Pod do /tmp/identity do POD_NAME i działał
  dalej. Zachowaj Deployment clock i kontener worker. Wymagane źródło tożsamości to metadata.name; dostęp
  do węzła nie jest potrzebny.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `clock.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: Clock jest dostępny, jego sygnatura czasowa ma format UTC, a jego zarejestrowana
  tożsamość jest zgodna z nazwą Pod.'
debrief: Błąd dotyczył instrukcji uruchamiania, a nie dostępności obrazu. Naprawiony proces zapisuje obserwowalne
  artefakty i uzyskuje swoją tożsamość z Downward API.
stages.0.brief: 'Sprawdź błąd uruchamiania kontenera i odwołanie do pola POD_NAME. Sygnatura czasowa musi
  używać YYYY-MM-DDTHH:MM:SSZ.


  Kryteria sukcesu: Clock jest dostępny, jego sygnatura czasowa ma format UTC, a jego zarejestrowana tożsamość
  jest zgodna z nazwą Pod.'
stages.0.objectives.0.text: Clock jest dostępny, jego znacznik czasu ma format UTC, a jego zarejestrowana
  tożsamość jest zgodna z nazwą Pod.
hints.0.text: Przed edycją obrazu przeczytaj przyczynę zakończenia i logi.
hints.1.text: Polecenie kontenera zastępuje obraz entrypoint; fieldRef wybiera źródło POD_NAME.
hints.2.text: Używaj shell tylko wtedy, gdy potrzebujesz sekwencji i pozostaw długotrwały proces na pierwszym
  planie.
phrases.0: Porównałem command i args z umową startową obrazu.
phrases.1: Aby zlokalizować awarię, użyłem dzienników kontenera i stanu zakończenia.
phrases.2: Ujawniłem tożsamość Pod poprzez odwołanie do pola API w dół.
questions.0.points.0: Porównaj szablon Pod z obrazem entrypoint i domyślnymi argumentami.
questions.0.points.1: Sprawdź ostatni stan zakończenia i dzienniki; samo ponowne uruchomienie zachowuje
  wadliwy szablon.
questions.0.points.2: Proces, który zakończy się pomyślnie, może nadal być błędny w przypadku długotrwałego
  Deployment.
questions.0.prompt: Obraz jest poprawny, ale proces kończy się natychmiast. W jaki sposób command i args
  pomagają zawęzić zakres awarii?
questions.1.points.0: API dostarcza tożsamość rzeczywistej instancji Pod.
questions.1.points.1: Zamienne kapsuły mają nową tożsamość bez konieczności przebudowy obrazu.
questions.1.points.2: Spowoduje to ujawnienie wybranych metadanych, a nie administratora credentials.
questions.1.prompt: Dlaczego nazwa Pod uzyskana za pomocą fieldRef jest bezpieczniejsza niż nazwa wpisana
  w obraz?
