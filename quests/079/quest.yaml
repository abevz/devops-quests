- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    check: 'if ! test -s repair.log; then printf ''%s\n'' ''repair.log empty: ✗ [DQ:repair]''; exit 1; fi'
  - text: stages.0.objectives.1.text
    check: "dq_probe_output=$(mktemp)\ntrap 'rm -f \"$dq_probe_output\"' EXIT\nset +e\n(\nset -euo pipefail\ncd\
      \ ~/quest\ntimeout --kill-after=1s 8s bash -euo pipefail <<'DQ_LEGACY_FLEET'\ndq_probe_output=$(mktemp)\n\
      trap 'rm -f \"$dq_probe_output\"' EXIT\nset +e\n(\nset -euo pipefail\ndq_result_failed=0\nset +e\n(\nset -e\n\
      python3 -I - <<'DQ_RECAP'\nimport json\nimport re\nfrom pathlib import Path\n\n\n\n\n\n\n\n\nfrom dq_check\
      \ import ansible_recap as recap\n\n\nfrom dq_check import require_recaps as _dq_recaps\n\ndef require_recaps(path,\
      \ required, positive=(), prefix=\"recap\"):\n    return _dq_recaps(path, required, positive, prefix, dialect='by_host')\n\
      \nrequire_recaps('second.log', {'changed':0,'unreachable':0,'failed':0})\nDQ_RECAP\n)\n[ $? -eq 0 ] || dq_result_failed=1\n\
      set -e\ntest \"$dq_result_failed\" -eq 0\n) >\"$dq_probe_output\" 2>/dev/null\ndq_probe_status=$?\nset -e\n\
      cat \"$dq_probe_output\"\nif [ \"$dq_probe_status\" -ne 0 ] && ! grep -Eq '\\[DQ:[a-z0-9_]+\\]' \"$dq_probe_output\"\
      ; then\nprintf '%s\\n' 'Current inputs could not verify this objective: ✗ [DQ:probe_0_1]'\nfi\nrm -f \"$dq_probe_output\"\
      \ntrap - EXIT\ntest \"$dq_probe_status\" -eq 0\nDQ_LEGACY_FLEET\npython3 -I - <<'DQ_FLEET_CALLER'\nimport\
      \ subprocess\nimport sys\ntry:\n    exec(compile(\"import hashlib,json,os,stat,subprocess,tempfile,time\\\
      nfrom pathlib import Path\\nfrom dq_check import ansible_recap\\nstarted=time.monotonic();deadline=started+14\\\
      nwith tempfile.TemporaryDirectory(prefix='dq-fleet-check-') as folder:\\n root=Path(folder);names=['mixed-a'];wanted='south-probe'\\\
      n (root/'ansible.cfg').write_text('[defaults]\\\\ninterpreter_python=/usr/bin/python3\\\\n')\\n (root/'inventory.json').write_text(json.dumps({'all':{'children':{'fleet':{'hosts':{name:{'ansible_connection':'local','ansible_python_interpreter':'/usr/bin/python3'}\
      \ for name in names}}}}}))\\n def state(p):\\n  s=p.stat();return (s.st_ino,s.st_mtime_ns,stat.S_IMODE(s.st_mode),hashlib.sha256(p.read_bytes()).hexdigest())\\\
      n controls={};healthy={}\\n for name in names:\\n  place=root/name;place.mkdir();(place/'retained').write_text('preserve\
      \ caller data\\\\n');controls[place/'retained']=state(place/'retained')\\n  (place/'cache').write_text((wanted\
      \ if name=='healthy-c' else 'retired-probe')+'\\\\n')\\n  if name!='mixed-b':\\n   (place/'config').mkdir(mode=0o700\
      \ if name=='mixed-a' else 0o755)\\n   (place/'message').write_text(wanted+'\\\\n');(place/'message').chmod(0o644)\\\
      n   (place/'config/route').write_text('route=south\\\\n')\\n  else:(place/'message').write_text('retired-probe\\\
      \\n');(place/'message').chmod(0o600)\\n  if name=='healthy-c':healthy={p:state(p) for p in [place/'message',place/'config/route',place/'cache']}\\\
      n inputs={'delivery_root':str(root/'{{ inventory_hostname }}'),'expected_message':wanted,'expected_route':'route=south','service_observe':['/usr/bin/cat','{{\
      \ delivery_root }}/cache'],'service_reload':['/usr/bin/python3','/run/dq/facts/0/caller-cache.py','{{ delivery_root\
      \ }}/message','{{ delivery_root }}/cache'],'ansible_connection':'local','ansible_python_interpreter':'/usr/bin/python3','ansible_become':False}\\\
      n results=[];converged=None\\n for index in range(2):\\n  r=subprocess.run(['ansible-playbook','-i',str(root/'inventory.json'),str(Path('rollout.yml').resolve()),'-e',json.dumps(inputs)],env=dict(os.environ,ANSIBLE_CONFIG=str(root/'ansible.cfg')),capture_output=True,text=True,timeout=max(.01,deadline-time.monotonic()))\\\
      n  rows=ansible_recap(r.stdout)\\n  valid=r.returncode==0 and set(rows)==set(names) and all(row.get('failed')==0\
      \ and row.get('unreachable')==0 for row in rows.values())\\n  for name in names:\\n   place=root/name;valid=valid\
      \ and (place/'config').is_dir() and stat.S_IMODE((place/'config').stat().st_mode)==0o755\\n   for path,value\
      \ in [(place/'message',wanted),(place/'config/route','route=south'),(place/'cache',wanted)]:valid=valid and\
      \ path.is_file() and path.read_text().strip()==value\\n   for path in [place/'message',place/'config/route']:valid=valid\
      \ and path.is_file() and stat.S_IMODE(path.stat().st_mode)==0o644\\n  valid=valid and all(p.is_file() and\
      \ state(p)==before for p,before in controls.items()) and all(p.is_file() and state(p)==before for p,before\
      \ in healthy.items())\\n  valid=valid and (index==0 or all(row.get('changed')==0 for row in rows.values()))\\\
      n  observed_paths=[path for name in names for path in [root/name/'message',root/name/'config/route',root/name/'cache']]\\\
      n  if index==1:valid=valid and all(path.is_file() and state(path)==converged[path] for path in observed_paths)\\\
      n  elif valid:converged={path:state(path) for path in observed_paths}\\n  results.append({'apply':index,'exit':r.returncode,'recaps':rows,'passed':valid})\\\
      n  if not valid:print('Fleet caller result is incomplete: ✗ [DQ:fleet_effects]');break\\n raise SystemExit(not\
      \ valid)\\n\", 'fleet-caller-observation', 'exec'), {})\nexcept subprocess.TimeoutExpired:\n    print('Fleet\
      \ caller observation exceeded its budget: ✗ [DQ:fleet_budget]')\n    sys.exit(1)\nexcept (KeyError, TypeError,\
      \ ValueError, OSError, subprocess.SubprocessError, RuntimeError):\n    print('Fleet caller could not be observed:\
      \ ✗ [DQ:fleet_observation]')\n    sys.exit(1)\nDQ_FLEET_CALLER\n) >\"$dq_probe_output\" 2>/dev/null\ndq_probe_status=$?\n\
      set -e\ncat \"$dq_probe_output\"\nif [ \"$dq_probe_status\" -ne 0 ] && ! grep -Eq '\\[DQ:[a-z0-9_]+\\]' \"\
      $dq_probe_output\"; then\n printf '%s\\n' 'Current inputs could not verify this objective: ✗ [DQ:probe_0_1]'\n\
      fi\nrm -f \"$dq_probe_output\"\ntrap - EXIT\ntest \"$dq_probe_status\" -eq 0"
