title: Recuperación de flota
brief: "La flota parte de estados parciales distintos y necesita un resultado de servicio uniforme.\n\nTrabaja en\
  \ la workstation en `~/quest` con `inventory.ini`, `ansible.cfg`, `rollout.yml`. Archivos adicionales en la estación\
  \ de trabajo, en `~/quest`: `caller-contract.json`, `caller-cache.py`.\n\n**Requisitos:**\n- Evidencia en la workstation:\n\
  \  - Archivo no vacío: `~/quest/repair.log`.\n  - `~/quest/second.log`: los resúmenes de `app1`, `app2`, `app3`\
  \ muestran `changed=0`, `unreachable=0`, `failed=0`.\n- Directorio en cada host administrado (`app1`, `app2`,\
  \ `app3`):\n  - Ruta: `/srv/site/config`.\n  - Modo de acceso: `0755`.\n- Archivos en cada host administrado (`app1`,\
  \ `app2`, `app3`):\n  - `/srv/site/message`: `north-79`.\n  - `/srv/site/config/route`: `route=north`.\n  - Modo\
  \ de acceso: `0644`.\n- Servicio activo en cada host administrado (`app1`, `app2`, `app3`):\n  - HTTP: `8080`,\
  \ `/`.\n  - Respuesta: `north-79`.\n- El `rollout.yml` actual también cumple `caller-contract.json`: recupera\
  \ un estado mixto del invocador, conserva sus demás datos y no modifica las salidas en una segunda aplicación\
  \ con `changed=0`, `unreachable=0`, `failed=0`.\n\nLos registros se examinan como archivos; no demuestran cuándo\
  \ se ejecutaron las operaciones."
debrief: Construiste recuperación de archivos, ruta y servicio activo, conservaste condiciones correctas y demostraste
  convergencia en la flota y el invocador.
stages.0.brief: Cada host administrado debe alcanzar el estado de servicio requerido con un registro limpio de repetición.
stages.0.objectives.0.text: 'Evidencia no vacía en la workstation: `repair.log`.'
stages.0.objectives.1.text: El archivo `second.log` de la workstation informa `changed=0`, `unreachable=0`, `failed=0`
  para `app1`, `app2`, `app3`. El programa actual también recupera el estado declarado del invocador y converge
  en la segunda aplicación sin cambiar datos conservados ni salidas de la aplicación.
stages.0.objectives.2.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/config` tiene el modo
  `0755`.
stages.0.objectives.3.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` y `/srv/site/config/route`
  tienen el modo `0644`.
stages.0.objectives.4.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` contiene `north-79`.
stages.0.objectives.5.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/config/route` contiene
  `route=north`.
stages.0.objectives.6.text: HTTP en el puerto `8080` devuelve `north-79` en cada host administrado (`app1`, `app2`,
  `app3`).
hints.0.text: Los archivos y las cachés de servicios activos tienen estados separados. La recuperación debe alcanzar
  el resultado activo deseado conservando los datos correctos.
hints.1.text: Compara `rollout.yml`, `caller-contract.json` y `caller-cache.py`. En los hosts administrados, compara
  archivos, permisos, rutas y respuestas HTTP reales. Sigue qué tareas informarán cambios antes de ejecutar una
  notificación.
hints.2.text: 'Construye la entrega de directorios y archivos con las entradas proporcionadas, observa al consumidor
  real y actualiza el estado obsoleto. Ejecuta `ansible-playbook rollout.yml > repair.log` y repite con salida a
  `second.log`: cada host debe mostrar `changed=0`, `unreachable=0`, `failed=0` en la segunda ejecución. Verifica
  `/srv/site/message`, `/srv/site/config/route`, permisos y HTTP en `8080`. La prueba del invocador también compara
  las salidas reales antes y después de la segunda aplicación.'
phrases.0: Recuperé hosts con diferentes configuraciones parciales.
phrases.1: Verifiqué las recargas de servicios impulsadas por el controlador.
phrases.2: Demostré la idempotencia con una segunda ejecución y un estado administrado real.
diagnostics.repair: La reparación puede no capturarse o repair.log estar vacío; conserve salida. Este requisito comprueba archivo no vacío, no éxito de recap. [Causa y comprobación](guides#guide=ansible-4&section=fleet-retain-nonempty-repair-log)
diagnostics.probe_0_1: La comprobación recap previa de 8s puede detenerse sin marcador o fallar imports/inicio del caller; distinga estos fallos de diagnósticos effects, observation y budget nombrados. [Causa y comprobación](guides#guide=ansible-4&section=fleet-legacy-recap-timeout-and-caller-startup)
diagnostics.fleet_effects: El play vacío, entradas fijas o handler solo de copy dejan caché antiguo con archivo ya correcto; repare directorio caller y caché vivo, conserve datos ajenos y converja sin escrituras en segundo apply. [Causa y comprobación](guides#guide=ansible-4&section=fleet-parameterized-repair-and-cache-convergence)
diagnostics.fleet_budget: Ansible puede superar plazo restante de 14s del caller; revise comandos bloqueados y conexiones antes de repetir reparación. [Causa y comprobación](guides#guide=ansible-4&section=fleet-bounded-direct-caller-replay)
diagnostics.fleet_observation: La repetición caller puede no ejecutar Ansible o inspeccionar archivos/adaptador caché; revise rutas, permisos y errores de ejecución antes de tratarlo como resultado distinto. [Causa y comprobación](guides#guide=ansible-4&section=fleet-local-caller-observation-errors)
diagnostics.recap_1: app1 puede seguir cambiando o recargando en apply repetido o faltar su recap; second.log requiere changed=0, unreachable=0 y failed=0 para este host. [Causa y comprobación](guides#guide=ansible-4&section=fleet-host-1-converged-recap)
diagnostics.ssh_1: SSH a app1 o la prueba remota fallaron sin resultado de campo esperado; revise conexión y errores de shell remoto. Salida inesperada no vacía se conserva y también recibe fallback. [Causa y comprobación](guides#guide=ansible-4&section=fleet-host-1-ssh-or-opaque-remote-failure)
diagnostics.host_1_dir_mode: El directorio de app1 puede faltar o tener mode incorrecto; construya /srv/site/config con mode 755 sin depender de umask. [Causa y comprobación](guides#guide=ansible-4&section=fleet-host-1-configuration-directory-mode)
diagnostics.host_1_banner_mode: app1 /srv/site/message puede faltar o conservar permisos de otra tarea; declare mode 644 para archivo entregado y verifique resultado remoto. [Causa y comprobación](guides#guide=ansible-4&section=fleet-host-1-banner-file-mode)
diagnostics.host_1_route_mode: app1 /srv/site/config/route puede faltar o conservar permisos de otra tarea; declare mode 644 para archivo entregado y verifique resultado remoto. [Causa y comprobación](guides#guide=ansible-4&section=fleet-host-1-route-file-mode)
diagnostics.host_1_banner_content: app1 puede recibir mensaje fijo distinto o usar otro destino; entregue expected_message al archivo real /srv/site/message. [Causa y comprobación](guides#guide=ansible-4&section=fleet-host-1-declared-message-value)
diagnostics.host_1_route_content: app1 puede conservar ruta antigua o reescribirse con valor incorrecto; entregue expected_route mediante interfaz de archivo /srv/site/config/route. [Causa y comprobación](guides#guide=ansible-4&section=fleet-host-1-declared-route-value)
diagnostics.http_1: app1 puede servir caché antiguo con archivo correcto; observe HTTP vivo y recargue si difiere, incluso si copy no informa cambio. Errores de transporte también fallan la petición. [Causa y comprobación](guides#guide=ansible-4&section=fleet-host-1-live-cache-with-unchanged-file)
diagnostics.recap_2: app2 puede seguir cambiando o recargando en apply repetido o faltar su recap; second.log requiere changed=0, unreachable=0 y failed=0 para este host. [Causa y comprobación](guides#guide=ansible-4&section=fleet-host-2-converged-recap)
