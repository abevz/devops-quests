title: Recuperación de flota
brief: 'La flota está parcialmente configurada: app1 tiene el banner actual, app2 tiene un antiguo directorio
  y banner en modo privado, y app3 no tiene ningún directorio route. Corrija rollout.yml para que el directorio
  sea 0755, banner sea 0644 y todos los hosts obtengan route=north.. Conserve el reload handler en vivo.
  Ejecute una vez en repair.log, luego una segunda vez en second.log; el segundo recap debe informar changed=0
  en los tres hosts. Verifique los archivos reales y HTTP, no solo un recap exitoso.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `inventory.ini`, `ansible.cfg`,
  `rollout.yml`, `repair.log`, `second.log`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: los tres destinos tienen el directorio requerido, los modos de archivo
  y route; HTTP devuelve north-79 y la segunda ejecución no cambia nada.'
debrief: Una reparación declarativa hizo converger diferentes estados parciales y demostró la repetibilidad
  en una segunda ejecución.
stages.0.brief: 'Criterios de éxito: los tres destinos tienen el directorio requerido, los modos de archivo
