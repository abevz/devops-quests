title: Recuperación de flota
brief: 'En `~/quest`, lee `inventory.ini`, `ansible.cfg` y `rollout.yml`. Los tres hosts de la flota parten de estados diferentes. Un play idempotente no cambia nada al repetirse. El handler suministrado `Reload banner` usa el adaptador de la bahía `dq-service reload`.


  Usa un play para `fleet` y tres tareas incondicionales file/copy: directorio `/srv/site/config` con modo `0755`, banner `/srv/site/message` con modo `0644` y contenido `north-79` seguido de salto de línea, y ruta `/srv/site/config/route` con modo `0644` y contenido `route=north` seguido de salto de línea. Crea el directorio antes del archivo de ruta y notifica a `Reload banner` cuando cambie el banner. Se aceptan los alias `file`/`copy`, modos octales equivalentes, una lista notify de un elemento y otro orden seguro. Mantén solo los argumentos de módulo indicados y el comando de handler `dq-service reload`; omite en el play `pre_tasks`, `post_tasks`, `roles`, `check_mode`, `changed_when` y en las tareas `when`, `check_mode`, `changed_when`: esos límites hacen que las tareas evaluadas se ejecuten en todos los hosts sin ocultar cambios ni añadir operaciones no verificadas.


  Ejecuta el play en `repair.log` y otra vez en `second.log`. El primer registro debe estar no vacío; cada resumen de app1/app2/app3 en el segundo debe mostrar `changed=0`, `unreachable=0`, `failed=0` en ese orden. Cada host debe tener los contenidos y modos indicados, y HTTP en el puerto 8080 debe devolver `north-79`. Los registros se inspeccionan como archivos y no demuestran cuándo se ejecutaron. Trabaja solo en la bahía sin conexión.


  El play solo puede usar `name`, `hosts`, `gather_facts`, `handlers` y `tasks`; cada tarea puede usar `name`, un módulo file/copy y `notify` solo para el banner. Usa exactamente un handler con solo `name` y `command` (o `ansible.builtin.command`). Esto excluye acciones no verificadas.'
debrief: El playbook, los resúmenes registrados y el estado real de la flota coincidieron con las comprobaciones.
stages.0.brief: El playbook limitado, los resúmenes, los contenidos y modos de los tres hosts y las respuestas HTTP coinciden con el enunciado.
stages.0.objectives.0.text: El playbook limitado, los resúmenes, los contenidos y modos de los tres hosts y las respuestas HTTP coinciden con el enunciado.
hints.0.text: Una flota puede partir de diferentes estados parciales válidos e inválidos.
hints.1.text: Declare directorios antes que archivos y mantenga el reload vinculado a los cambios reales
  del banner.
hints.2.text: Repare los permisos, ejecute dos veces y verifique el segundo recap más todos los HTTP endpoints.
phrases.0: Recuperé hosts con diferentes configuraciones parciales.
phrases.1: Verifiqué las recargas de servicios impulsadas por el controlador.
phrases.2: Demostré la idempotencia con una segunda ejecución y un estado administrado real.
