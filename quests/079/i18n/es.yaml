title: Recuperación de flota
brief: |-
  La flota parte de estados parciales distintos y necesita un resultado de servicio uniforme.

  Trabaja en la workstation en `~/quest` con `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Requisitos:**
  - Reparación de flota configurada:
    - Alcance: `app1`, `app2`, `app3`.
    - Los informes normales de cambios siguen activos; el servicio se actualiza cuando cambia el banner.
  - Evidencia en la workstation:
    - Archivo no vacío: `~/quest/repair.log`.
  - Evidencia en la workstation:
    - Ruta: `~/quest/second.log`.
    - `app1`, `app2`, `app3`: `changed=0`, `unreachable=0`, `failed=0`.
  - Directorio en cada host administrado (`app1`, `app2`, `app3`):
    - Ruta: `/srv/site/config`.
    - Modo de acceso: `0755`.
  - Archivos en cada host administrado (`app1`, `app2`, `app3`):
    - `/srv/site/message`: `north-79`.
    - `/srv/site/config/route`: `route=north`.
    - Modo de acceso: `0644`.
  - Servicio activo en cada host administrado (`app1`, `app2`, `app3`):
    - HTTP: `8080`, `/`.
    - Respuesta: `north-79`.

  **Verifica antes de Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'cat /srv/site/message /srv/site/config/route; ls -ld /srv/site/config; ls -l /srv/site/message /srv/site/config/route'` — Cada host muestra `north-79`, `route=north`, permisos de directorio `drwxr-xr-x` y permisos de archivo `-rw-r--r--`.
  - `cat ~/quest/repair.log ~/quest/second.log` — El registro de reparación no está vacío; `second.log` informa `changed=0`, `unreachable=0`, `failed=0` para los tres hosts.
  - `for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done` — Muestra `north-79` de `app1`, `app2`, `app3`.

  Los registros se examinan como archivos; no demuestran cuándo se ejecutaron las operaciones.
debrief: El playbook, los resúmenes registrados y el estado real de la flota coincidieron con las comprobaciones.
stages.0.brief: Cada host administrado debe alcanzar el estado de servicio requerido con un registro limpio de repetición.
stages.0.objectives.0.text: La reparación de la flota está configurada para cada host administrado, con informes
  normales de cambios y actualización del servicio ligada a cambios del banner.
stages.0.objectives.1.text: 'Evidencia no vacía en la workstation: `repair.log`.'
stages.0.objectives.2.text: El archivo `second.log` de la workstation informa `changed=0`, `unreachable=0`, `failed=0`
  para `app1`, `app2`, `app3`.
stages.0.objectives.3.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/config` tiene el modo
  `0755`.
stages.0.objectives.4.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` y `/srv/site/config/route`
  tienen el modo `0644`.
stages.0.objectives.5.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` contiene `north-79`.
stages.0.objectives.6.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/config/route` contiene
  `route=north`.
stages.0.objectives.7.text: HTTP en el puerto `8080` devuelve `north-79` en cada host administrado (`app1`, `app2`,
  `app3`).
hints.0.text: Una flota puede partir de diferentes estados parciales válidos e inválidos.
hints.1.text: Declare directorios antes que archivos y mantenga el reload vinculado a los cambios reales del banner.
hints.2.text: 'Repare los permisos, ejecute dos veces y verifique el segundo recap más todos los HTTP endpoints.
  Límites de fuente conservados: un play `fleet` solo con `name`, `hosts`, `gather_facts`, `handlers`, `tasks`;
  tres tareas file/copy incondicionales solo con `name`, un módulo y `notify` únicamente en el banner. Los argumentos
  de directorio son exactamente `path`, `state`, `mode`; los de copy, exactamente `dest`, `content`, `mode`. Crea
  el directorio antes del archivo de ruta; el mensaje y la ruta incluyen un salto de línea. Solo el banner notifica
  a `Reload banner`. Conserva un handler solo con `name` y un módulo command que ejecute `dq-service reload`. Se
  aceptan alias file/copy, formas octales equivalentes y una lista notify de un elemento. Guarda ejecuciones reales
  con `ansible-playbook rollout.yml > repair.log` y `ansible-playbook rollout.yml > second.log`.'
phrases.0: Recuperé hosts con diferentes configuraciones parciales.
phrases.1: Verifiqué las recargas de servicios impulsadas por el controlador.
phrases.2: Demostré la idempotencia con una segunda ejecución y un estado administrado real.
diagnostics.hosts: El campo hosts del play en rollout.yml debe ser fleet.
diagnostics.play_keys: El play de rollout.yml solo puede usar name, hosts, gather_facts, handlers y tasks.
diagnostics.tasks: rollout.yml debe contener exactamente tres tareas.
diagnostics.controls: Una tarea no debe definir changed_when, check_mode ni when.
diagnostics.keys: Una tarea solo puede usar name, notify y un módulo file o copy.
diagnostics.module: Cada tarea debe tener exactamente un módulo file o copy con un mapa de argumentos.
diagnostics.duplicate: Las tareas de rollout.yml no deben repetir un destino.
diagnostics.notify_scope: Solo la tarea del banner puede definir notify.
diagnostics.dir_state: El state de la tarea file para /srv/site/config debe ser directory.
diagnostics.dir_args: La tarea file para /srv/site/config debe usar solo los argumentos path, state y mode.
diagnostics.notify: Notify de la tarea del banner debe indicar Reload banner.
diagnostics.order: La tarea /srv/site/config debe preceder a /srv/site/config/route.
diagnostics.handler: rollout.yml debe tener exactamente un handler llamado Reload banner.
diagnostics.command: El handler debe usar solo su nombre y un módulo command con dq-service reload.
diagnostics.invalid: rollout.yml debe contener un play legible con la estructura requerida.
diagnostics.repair: repair.log no debe estar vacío.
diagnostics.path_dir: rollout.yml debe incluir una tarea para /srv/site/config.
diagnostics.path_module_dir: La tarea /srv/site/config debe usar el módulo file.
diagnostics.path_mode_dir: El modo de la tarea /srv/site/config debe ser 0755.
diagnostics.path_banner: rollout.yml debe incluir una tarea para /srv/site/message.
diagnostics.path_module_banner: La tarea /srv/site/message debe usar el módulo copy.
diagnostics.path_mode_banner: El modo de la tarea /srv/site/message debe ser 0644.
diagnostics.path_content_banner: El contenido de la tarea /srv/site/message debe ser north-79 seguido de un salto
  de línea.
diagnostics.path_args_banner: La tarea copy para /srv/site/message debe usar solo dest, content y mode.
diagnostics.path_route: rollout.yml debe incluir una tarea para /srv/site/config/route.
diagnostics.path_module_route: La tarea /srv/site/config/route debe usar el módulo copy.
diagnostics.path_mode_route: El modo de la tarea /srv/site/config/route debe ser 0644.
diagnostics.path_content_route: El contenido de la tarea /srv/site/config/route debe ser route=north seguido de
  un salto de línea.
diagnostics.path_args_route: La tarea copy para /srv/site/config/route debe usar solo dest, content y mode.
