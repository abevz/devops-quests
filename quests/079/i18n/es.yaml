diagnostics.probe_0_1: No se pudo completar la observación. Revisa las entradas actuales, la disponibilidad de SSH
  y la interfaz del programa proporcionado.
diagnostics.fleet_effects: El programa actual no recupera el estado mixto del invocador ni converge conservando
  los demás datos.
diagnostics.fleet_budget: Se agotó el tiempo de observación. Revisa operaciones bloqueantes y disponibilidad de
  los servicios.
diagnostics.fleet_observation: No se pudo ejecutar el programa actual. Revisa rutas del invocador, ejecución local
  y errores del playbook.
