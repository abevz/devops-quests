title: Wiederherstellung der Flotte
brief: "Die Flotte startet mit unterschiedlichen Teilzuständen und benötigt ein einheitliches Dienstergebnis.\n\n\
  Arbeite auf der Workstation in `~/quest` mit `inventory.ini`, `ansible.cfg`, `rollout.yml`. Zusätzliche Dateien\
  \ auf der Workstation in `~/quest`: `caller-contract.json`, `caller-cache.py`.\n\n**Anforderungen:**\n- Nachweise\
  \ auf der Workstation:\n  - Nicht leere Datei: `~/quest/repair.log`.\n  - `~/quest/second.log`: Zusammenfassungen\
  \ für `app1`, `app2`, `app3` zeigen `changed=0`, `unreachable=0`, `failed=0`.\n- Verzeichnis auf jedem verwalteten\
  \ Host (`app1`, `app2`, `app3`):\n  - Pfad: `/srv/site/config`.\n  - Zugriffsmodus: `0755`.\n- Dateien auf jedem\
  \ verwalteten Host (`app1`, `app2`, `app3`):\n  - `/srv/site/message`: `north-79`.\n  - `/srv/site/config/route`:\
  \ `route=north`.\n  - Zugriffsmodus: `0644`.\n- Aktiver Dienst auf jedem verwalteten Host (`app1`, `app2`, `app3`):\n\
  \  - HTTP: `8080`, `/`.\n  - Antwort: `north-79`.\n- Das aktuelle `rollout.yml` erfüllt auch `caller-contract.json`:\
  \ gemischten Aufruferzustand wiederherstellen, andere Aufruferdaten bewahren und Anwendungsausgaben beim zweiten\
  \ Lauf mit `changed=0`, `unreachable=0`, `failed=0` unverändert lassen.\n\nProtokolle werden als Dateien geprüft;\
  \ sie beweisen nicht, wann die Läufe stattfanden."
debrief: Du hast Wiederherstellung für Dateien, Route und laufenden Dienst erstellt, gesunde Bedingungen bewahrt
  und Konvergenz für Flotte und Aufrufer belegt.
stages.0.brief: Jeder verwaltete Host muss den erforderlichen Dienstzustand mit einem fehlerfreien Wiederholungslaufprotokoll
  erreichen.
stages.0.objectives.0.text: 'Nicht leere Nachweise auf der Workstation: `repair.log`.'
stages.0.objectives.1.text: Die Workstation-Datei `second.log` meldet `changed=0`, `unreachable=0`, `failed=0` für
  `app1`, `app2`, `app3`. Das aktuelle Programm stellt auch den deklarierten Aufruferzustand her und konvergiert
  beim zweiten Lauf ohne Änderungen an erhaltenen Daten oder Anwendungsausgaben.
stages.0.objectives.2.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) hat `/srv/site/config` den Modus
  `0755`.
stages.0.objectives.3.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) haben `/srv/site/message` und `/srv/site/config/route`
  den Modus `0644`.
stages.0.objectives.4.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/message` den
  Inhalt `north-79`.
stages.0.objectives.5.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/config/route`
  den Inhalt `route=north`.
stages.0.objectives.6.text: HTTP auf Port `8080` liefert auf jedem verwalteten Host (`app1`, `app2`, `app3`) `north-79`.
hints.0.text: Dateien und Caches laufender Dienste besitzen getrennten Zustand. Die Wiederherstellung muss den gewünschten
  Live-Zustand erreichen und gesunde Daten bewahren.
hints.1.text: |-
  Vergleiche `rollout.yml`, `caller-contract.json` und `caller-cache.py`. Vergleiche auf den verwalteten Hosts Dateien, Modi, Routendaten und tatsächliche HTTP-Antworten. Verfolge, welche Aufgaben eine Änderung melden, bevor eine Benachrichtigung läuft.

  Suche die Aufgaben für Verzeichnis, Nachricht und Route. Vergleiche deren Änderungsergebnisse mit der Antwort des laufenden Verbrauchers. Berücksichtige einen Host mit korrekter Nachrichtendatei und veraltetem Cache.

  ```sh
  cat rollout.yml
  cat caller-contract.json
  cat caller-cache.py
  ```
hints.2.text: |-
  Führe `ansible-playbook rollout.yml > repair.log` aus und wiederhole mit Ausgabe nach `second.log`: Jeder Host muss beim zweiten Lauf `changed=0`, `unreachable=0`, `failed=0` melden. Prüfe `/srv/site/message`, `/srv/site/config/route`, Modi und HTTP an `8080`. Die Aufruferprüfung vergleicht auch tatsächliche Ausgaben vor und nach dem zweiten Lauf.

  Das Konfigurationsverzeichnis muss Modus `755` haben, beide Dateien Modus `644`. Erwarte auf jedem Host die Nachricht und HTTP-Antwort `north-79` sowie die Route `route=north`. Wiederhole die Beobachtungen nach dem Lauf ohne Änderungen.

  ```sh
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    printf "%s\n" "$host"
    ssh -n -o BatchMode=yes -p 2222 "root@$host" 'stat -c "%a %n" /srv/site/config /srv/site/message /srv/site/config/route; cat /srv/site/message /srv/site/config/route'
    curl -fsS --max-time 3 "http://$host:8080/"
    printf '\n'
  done
  ```
phrases.0: Ich habe Hosts mit unterschiedlichen Teilkonfigurationen wiederhergestellt.
phrases.1: Ich habe Handler-gesteuerte Dienst-Neuladungen überprüft.
phrases.2: Ich habe die Idempotenz mit einem zweiten Durchlauf und einem tatsächlich verwalteten Zustand bewiesen.
diagnostics.repair: Der Reparaturlauf wurde möglicherweise nicht aufgezeichnet oder repair.log ist leer; erhalten Sie seine Ausgabe. Diese Bedingung prüft eine nichtleere Datei statt den Erfolg ihres Recaps. [Ursache und Prüfung](guides#guide=ansible-4&section=fleet-retain-nonempty-repair-log)
diagnostics.probe_0_1: Die frühere Recap-Prüfung mit 8s Limit kann ohne Marker abbrechen oder das Caller-Programm scheitert bei Imports/Start; unterscheiden Sie dies von benannten effects, observation und budget Diagnosen. [Ursache und Prüfung](guides#guide=ansible-4&section=fleet-legacy-recap-timeout-and-caller-startup)
diagnostics.fleet_effects: Das leere gelieferte Play, feste Eingaben oder ein reiner Copy-Handler können bei korrekter Nachrichtendatei alten Cache hinterlassen; reparieren Sie Caller-Verzeichnis und Live-Cache, erhalten Sie fremde Daten und konvergieren Sie beim zweiten apply ohne Schreibvorgänge. [Ursache und Prüfung](guides#guide=ansible-4&section=fleet-parameterized-repair-and-cache-convergence)
diagnostics.fleet_budget: Ein Ansible-Lauf kann die verbleibende 14s Caller-Replay-Frist überschreiten; prüfen Sie blockierte Befehle und Verbindungsaufbau vor erneuter Reparatur. [Ursache und Prüfung](guides#guide=ansible-4&section=fleet-bounded-direct-caller-replay)
diagnostics.fleet_observation: Das Caller-Replay kann Ansible möglicherweise nicht ausführen oder Dateien/Cache-Adapter nicht prüfen; kontrollieren Sie Pfade, Rechte und Ausführungsfehler vor einer gewöhnlichen Ergebnisabweichung. [Ursache und Prüfung](guides#guide=ansible-4&section=fleet-local-caller-observation-errors)
diagnostics.recap_1: app1 ändert oder lädt beim wiederholten apply möglicherweise weiter oder sein Recap fehlt; second.log benötigt changed=0, unreachable=0 und failed=0 für diesen Host. [Ursache und Prüfung](guides#guide=ansible-4&section=fleet-host-1-converged-recap)
diagnostics.ssh_1: app1 SSH oder die entfernte Prüfung scheiterte ohne erwartetes Feldergebnis; prüfen Sie Verbindung und entfernte Shell-Fehler. Unerwartete nichtleere Ausgabe bleibt erhalten und ergibt ebenfalls diesen Fallback. [Ursache und Prüfung](guides#guide=ansible-4&section=fleet-host-1-ssh-or-opaque-remote-failure)
diagnostics.host_1_dir_mode: Das Konfigurationsverzeichnis von app1 fehlt möglicherweise oder hat falschen mode; erstellen Sie /srv/site/config mit mode 755 statt vom umask abhängig zu sein. [Ursache und Prüfung](guides#guide=ansible-4&section=fleet-host-1-configuration-directory-mode)
diagnostics.host_1_banner_mode: app1 /srv/site/message fehlt möglicherweise oder hat Rechte einer anderen Aufgabe; deklarieren Sie mode 644 für die zugestellte Datei und prüfen Sie das entfernte Ergebnis. [Ursache und Prüfung](guides#guide=ansible-4&section=fleet-host-1-banner-file-mode)
diagnostics.host_1_route_mode: app1 /srv/site/config/route fehlt möglicherweise oder hat Rechte einer anderen Aufgabe; deklarieren Sie mode 644 für die zugestellte Datei und prüfen Sie das entfernte Ergebnis. [Ursache und Prüfung](guides#guide=ansible-4&section=fleet-host-1-route-file-mode)
diagnostics.host_1_banner_content: app1 erhält möglicherweise eine andere feste Nachricht oder nutzt ein anderes Ziel; liefern Sie expected_message in die tatsächliche Datei /srv/site/message. [Ursache und Prüfung](guides#guide=ansible-4&section=fleet-host-1-declared-message-value)
diagnostics.host_1_route_content: app1 behält möglicherweise eine alte Route oder wurde mit falschem Wert überschrieben; liefern Sie expected_route über die Dateischnittstelle /srv/site/config/route. [Ursache und Prüfung](guides#guide=ansible-4&section=fleet-host-1-declared-route-value)
diagnostics.http_1: app1 kann trotz korrekter Nachrichtendatei alten Cache ausliefern; beobachten Sie Live-HTTP und laden Sie bei Abweichung neu, auch wenn copy keine Änderung meldet. Transportfehler können die Anfrage ebenfalls scheitern lassen. [Ursache und Prüfung](guides#guide=ansible-4&section=fleet-host-1-live-cache-with-unchanged-file)
