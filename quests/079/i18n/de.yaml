diagnostics.probe_0_1: Die Beobachtung konnte nicht abgeschlossen werden. Prüfe aktuelle Eingaben, SSH-Verfügbarkeit
  und die bereitgestellte Programmschnittstelle.
diagnostics.fleet_effects: Das aktuelle Programm stellt den gemischten Aufruferzustand und Konvergenz ohne Änderungen
  an erhaltenen Daten nicht sicher.
diagnostics.fleet_budget: Das Zeitbudget der Beobachtung ist abgelaufen. Prüfe blockierende Operationen und die
  Erreichbarkeit der Dienste.
diagnostics.fleet_observation: Das aktuelle Programm konnte nicht erneut ausgeführt werden. Prüfe Aufruferpfade,
  lokale Ausführung und Playbook-Fehler.
