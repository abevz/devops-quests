title: Wiederherstellung der Flotte
brief: 'Lies in `~/quest` die Dateien `inventory.ini`, `ansible.cfg` und `rollout.yml`. Die drei Flotten-Hosts beginnen in unterschiedlichen Zuständen. Ein idempotenter Play ändert bei Wiederholung nichts. Der bereitgestellte Handler `Reload banner` verwendet den umgebungsspezifischen Adapter `dq-service reload`.


  Verwende einen Play für `fleet` und drei unbedingte file/copy-Tasks: Verzeichnis `/srv/site/config` mit Modus `0755`, Banner `/srv/site/message` mit Modus `0644` und Inhalt `north-79` samt Zeilenumbruch sowie Route `/srv/site/config/route` mit Modus `0644` und Inhalt `route=north` samt Zeilenumbruch. Erstelle das Verzeichnis vor der Routendatei und benachrichtige `Reload banner` bei Banneränderung. Die Aliase `file`/`copy`, gleichwertige oktale Modusschreibweisen, eine einteilige notify-Liste und eine andere sichere Reihenfolge sind zulässig. Verwende nur die genannten Modulargumente und den Handler-Befehl `dq-service reload`; lasse im Play `pre_tasks`, `post_tasks`, `roles`, `check_mode`, `changed_when` und in Tasks `when`, `check_mode`, `changed_when` weg: Diese Grenzen sorgen dafür, dass die geprüften Tasks auf allen Hosts laufen, ohne Änderungen zu verbergen oder ungeprüfte Operationen hinzuzufügen.


  Schreibe einen Play-Lauf nach `repair.log` und einen zweiten nach `second.log`. Das erste Log muss nicht leer sein; jede Zusammenfassung für app1/app2/app3 im zweiten muss `changed=0`, `unreachable=0`, `failed=0` in dieser Reihenfolge zeigen. Jeder Host muss die genannten Dateiinhalte und Modi haben, HTTP auf Port 8080 muss `north-79` liefern. Die Logs werden als Dateien geprüft und beweisen nicht den Ausführungszeitpunkt. Arbeite nur in der Offline-Umgebung.


  Der Play darf nur `name`, `hosts`, `gather_facts`, `handlers` und `tasks` verwenden; jeder Task darf `name`, ein file/copy-Modul und `notify` nur für das Banner verwenden. Verwende genau einen Handler nur mit `name` und `command` (oder `ansible.builtin.command`). Das schließt ungeprüfte Aktionen aus.'
debrief: Playbook, aufgezeichnete Zusammenfassungen und aktueller Flottenzustand entsprachen den Prüfungen.
stages.0.brief: Das begrenzte Playbook, Log-Zusammenfassungen, Dateiinhalte und Modi der drei Hosts sowie HTTP-Antworten entsprechen der Aufgabe.
stages.0.objectives.0.text: Das begrenzte Playbook, Log-Zusammenfassungen, Dateiinhalte und Modi der drei Hosts sowie HTTP-Antworten entsprechen der Aufgabe.
hints.0.text: Eine Flotte kann aus verschiedenen gültigen und ungültigen Teilzuständen starten.
hints.1.text: Deklarieren Sie Verzeichnisse vor Dateien und halten Sie reload an die tatsächlichen banner-Änderungen
  gebunden.
hints.2.text: Reparieren Sie die Berechtigungen, führen Sie sie zweimal aus und überprüfen Sie den zweiten
  recap sowie alle HTTP endpoints.
phrases.0: Ich habe Hosts mit unterschiedlichen Teilkonfigurationen wiederhergestellt.
phrases.1: Ich habe Handler-gesteuerte Dienst-Neuladungen überprüft.
phrases.2: Ich habe die Idempotenz mit einem zweiten Durchlauf und einem tatsächlich verwalteten Zustand
  bewiesen.
