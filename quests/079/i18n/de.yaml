title: Wiederherstellung der Flotte
brief: 'Lies in `~/quest` die Dateien `inventory.ini`, `ansible.cfg` und `rollout.yml`. Die drei Flotten-Hosts beginnen in
  unterschiedlichen Zuständen. Ein idempotenter Play ändert bei Wiederholung nichts. Der bereitgestellte Handler `Reload banner`
  verwendet den umgebungsspezifischen Adapter `dq-service reload`.


  Verwende einen Play für `fleet` und drei unbedingte file/copy-Tasks: Verzeichnis `/srv/site/config` mit Modus `0755`, Banner
  `/srv/site/message` mit Modus `0644` und Inhalt `north-79` samt Zeilenumbruch sowie Route `/srv/site/config/route` mit Modus
  `0644` und Inhalt `route=north` samt Zeilenumbruch. Erstelle das Verzeichnis vor der Routendatei und benachrichtige `Reload
  banner` bei Banneränderung. Die Aliase `file`/`copy`, gleichwertige oktale Modusschreibweisen, eine einteilige notify-Liste
  und eine andere sichere Reihenfolge sind zulässig. Verwende nur die genannten Modulargumente und den Handler-Befehl `dq-service
  reload`; lasse im Play `pre_tasks`, `post_tasks`, `roles`, `check_mode`, `changed_when` und in Tasks `when`, `check_mode`,
  `changed_when` weg: Diese Grenzen sorgen dafür, dass die geprüften Tasks auf allen Hosts laufen, ohne Änderungen zu verbergen
  oder ungeprüfte Operationen hinzuzufügen.


  Schreibe einen Play-Lauf nach `repair.log` und einen zweiten nach `second.log`. Das erste Log muss nicht leer sein; jede
  Zusammenfassung für app1/app2/app3 im zweiten muss `changed=0`, `unreachable=0`, `failed=0` in dieser Reihenfolge zeigen.
  Jeder Host muss die genannten Dateiinhalte und Modi haben, HTTP auf Port 8080 muss `north-79` liefern. Die Logs werden als
  Dateien geprüft und beweisen nicht den Ausführungszeitpunkt. Arbeite nur in der Offline-Umgebung.


  Der Play darf nur `name`, `hosts`, `gather_facts`, `handlers` und `tasks` verwenden; jeder Task darf `name`, ein file/copy-Modul
  und `notify` nur für das Banner verwenden. Verwende genau einen Handler nur mit `name` und `command` (oder `ansible.builtin.command`).
  Das schließt ungeprüfte Aktionen aus.'
debrief: Playbook, aufgezeichnete Zusammenfassungen und aktueller Flottenzustand entsprachen den Prüfungen.
stages.0.brief: Das begrenzte Playbook, Log-Zusammenfassungen, Dateiinhalte und Modi der drei Hosts sowie HTTP-Antworten entsprechen
  der Aufgabe.
stages.0.objectives.0.text: Das begrenzte Playbook, Log-Zusammenfassungen, Dateiinhalte und Modi der drei Hosts sowie HTTP-Antworten
  entsprechen der Aufgabe.
hints.0.text: Eine Flotte kann aus verschiedenen gültigen und ungültigen Teilzuständen starten.
hints.1.text: Deklarieren Sie Verzeichnisse vor Dateien und halten Sie reload an die tatsächlichen banner-Änderungen gebunden.
hints.2.text: Reparieren Sie die Berechtigungen, führen Sie sie zweimal aus und überprüfen Sie den zweiten recap sowie alle
  HTTP endpoints.
phrases.0: Ich habe Hosts mit unterschiedlichen Teilkonfigurationen wiederhergestellt.
phrases.1: Ich habe Handler-gesteuerte Dienst-Neuladungen überprüft.
phrases.2: Ich habe die Idempotenz mit einem zweiten Durchlauf und einem tatsächlich verwalteten Zustand bewiesen.
diagnostics.hosts: Das Feld hosts des Plays in rollout.yml muss fleet sein.
diagnostics.play_keys: Das Play in rollout.yml darf nur name, hosts, gather_facts, handlers und tasks verwenden.
diagnostics.tasks: rollout.yml muss genau drei Aufgaben enthalten.
diagnostics.controls: Eine Aufgabe darf changed_when, check_mode oder when nicht setzen.
diagnostics.keys: Eine Aufgabe darf nur name, notify und ein file- oder copy-Modul verwenden.
diagnostics.module: Jede Aufgabe muss genau ein file- oder copy-Modul mit einer Argumentzuordnung haben.
diagnostics.duplicate: Die Aufgaben in rollout.yml dürfen kein Ziel wiederholen.
diagnostics.notify_scope: Nur die Banner-Aufgabe darf notify setzen.
diagnostics.dir_state: Der state der file-Aufgabe für /srv/site/config muss directory sein.
diagnostics.dir_args: Die file-Aufgabe für /srv/site/config darf nur die Argumente path, state und mode verwenden.
diagnostics.notify: Notify der Banner-Aufgabe muss Reload banner angeben.
diagnostics.order: Die Aufgabe /srv/site/config muss vor /srv/site/config/route stehen.
diagnostics.handler: rollout.yml muss genau einen Handler namens Reload banner haben.
diagnostics.command: Der Handler darf nur seinen Namen und ein command-Modul mit dq-service reload verwenden.
diagnostics.invalid: rollout.yml muss ein lesbares Play mit der erforderlichen Struktur enthalten.
diagnostics.repair: repair.log darf nicht leer sein.
diagnostics.path_dir: rollout.yml muss eine Aufgabe für /srv/site/config enthalten.
diagnostics.path_module_dir: Die Aufgabe /srv/site/config muss das Modul file verwenden.
diagnostics.path_mode_dir: Der Modus der Aufgabe /srv/site/config muss 0755 sein.
diagnostics.path_banner: rollout.yml muss eine Aufgabe für /srv/site/message enthalten.
diagnostics.path_module_banner: Die Aufgabe /srv/site/message muss das Modul copy verwenden.
diagnostics.path_mode_banner: Der Modus der Aufgabe /srv/site/message muss 0644 sein.
diagnostics.path_content_banner: Der Inhalt der Aufgabe /srv/site/message muss north-79 mit einem folgenden Zeilenumbruch
  sein.
diagnostics.path_args_banner: Die copy-Aufgabe für /srv/site/message darf nur dest, content und mode verwenden.
diagnostics.path_route: rollout.yml muss eine Aufgabe für /srv/site/config/route enthalten.
diagnostics.path_module_route: Die Aufgabe /srv/site/config/route muss das Modul copy verwenden.
diagnostics.path_mode_route: Der Modus der Aufgabe /srv/site/config/route muss 0644 sein.
diagnostics.path_content_route: Der Inhalt der Aufgabe /srv/site/config/route muss route=north mit einem folgenden Zeilenumbruch
  sein.
diagnostics.path_args_route: Die copy-Aufgabe für /srv/site/config/route darf nur dest, content und mode verwenden.
