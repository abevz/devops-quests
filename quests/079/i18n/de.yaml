title: Wiederherstellung der Flotte
brief: |-
  Die Flotte startet mit unterschiedlichen Teilzuständen und benötigt ein einheitliches Dienstergebnis.

  Arbeite auf der Workstation in `~/quest` mit `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Anforderungen:**
  - Nachweise auf der Workstation:
    - Nicht leere Datei: `~/quest/repair.log`.
    - `~/quest/second.log`: Zusammenfassungen für `app1`, `app2`, `app3` zeigen `changed=0`, `unreachable=0`, `failed=0`.
  - Verzeichnis auf jedem verwalteten Host (`app1`, `app2`, `app3`):
    - Pfad: `/srv/site/config`.
    - Zugriffsmodus: `0755`.
  - Dateien auf jedem verwalteten Host (`app1`, `app2`, `app3`):
    - `/srv/site/message`: `north-79`.
    - `/srv/site/config/route`: `route=north`.
    - Zugriffsmodus: `0644`.
  - Aktiver Dienst auf jedem verwalteten Host (`app1`, `app2`, `app3`):
    - HTTP: `8080`, `/`.
    - Antwort: `north-79`.

  Protokolle werden als Dateien geprüft; sie beweisen nicht, wann die Läufe stattfanden.
debrief: Playbook, aufgezeichnete Zusammenfassungen und aktueller Flottenzustand entsprachen den Prüfungen.
stages.0.brief: Jeder verwaltete Host muss den erforderlichen Dienstzustand mit einem fehlerfreien Wiederholungslaufprotokoll
  erreichen.
stages.0.objectives.0.text: 'Nicht leere Nachweise auf der Workstation: `repair.log`.'
stages.0.objectives.1.text: Die Workstation-Datei `second.log` meldet `changed=0`, `unreachable=0`, `failed=0`
  für `app1`, `app2`, `app3`.
stages.0.objectives.2.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) hat `/srv/site/config`
  den Modus `0755`.
stages.0.objectives.3.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) haben `/srv/site/message`
  und `/srv/site/config/route` den Modus `0644`.
stages.0.objectives.4.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/message`
  den Inhalt `north-79`.
stages.0.objectives.5.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/config/route`
  den Inhalt `route=north`.
stages.0.objectives.6.text: HTTP auf Port `8080` liefert auf jedem verwalteten Host (`app1`, `app2`, `app3`)
  `north-79`.
hints.0.text: Eine Flotte kann aus verschiedenen gültigen und ungültigen Teilzuständen starten.
hints.1.text: |-
  Deklarieren Sie Verzeichnisse vor Dateien und halten Sie reload an die tatsächlichen banner-Änderungen gebunden.

  Prüfen Sie Inventory und das bereitgestellte Playbook auf der Workstation:

  ```sh
  ansible-inventory -i inventory.ini --graph
  cat rollout.yml
  ```
hints.2.text: |-
  Reparieren Sie die Berechtigungen, führen Sie sie zweimal aus und überprüfen Sie den zweiten recap sowie alle HTTP endpoints. Beibehaltene Quellgrenzen: ein `fleet`-Play nur mit `name`, `hosts`, `gather_facts`, `handlers`, `tasks`; drei unbedingte file/copy-Aufgaben nur mit `name`, einem Modul und `notify` ausschließlich beim Banner. Verzeichnisargumente sind genau `path`, `state`, `mode`; copy-Argumente genau `dest`, `content`, `mode`. Erstelle das Verzeichnis vor der Routendatei; Nachrichten- und Routeninhalt enthalten einen Zeilenumbruch. Nur das Banner benachrichtigt `Reload banner`. Behalte einen Handler nur mit `name` und einem command-Modul für `dq-service reload`. File/copy-Aliasse, gleichwertige Oktalschreibweisen und eine einelementige notify-Liste sind zulässig. Speichere echte Läufe mit `ansible-playbook rollout.yml > repair.log` und `ansible-playbook rollout.yml > second.log`.

  Prüfen Sie das Ergebnis in `~/quest` auf der Workstation:

  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'cat /srv/site/message /srv/site/config/route; ls -ld /srv/site/config; ls -l /srv/site/message /srv/site/config/route'` — Jeder Host zeigt `north-79`, `route=north`, Verzeichnisrechte `drwxr-xr-x` und Dateirechte `-rw-r--r--`.
  - `cat ~/quest/repair.log ~/quest/second.log` — Das Reparaturprotokoll ist nicht leer; `second.log` meldet `changed=0`, `unreachable=0`, `failed=0` für alle drei Hosts.
  - `for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done` — Zeigt `north-79` von `app1`, `app2`, `app3`.
phrases.0: Ich habe Hosts mit unterschiedlichen Teilkonfigurationen wiederhergestellt.
phrases.1: Ich habe Handler-gesteuerte Dienst-Neuladungen überprüft.
phrases.2: Ich habe die Idempotenz mit einem zweiten Durchlauf und einem tatsächlich verwalteten Zustand
  bewiesen.
diagnostics.hosts: Das Feld hosts des Plays in rollout.yml muss fleet sein.
diagnostics.play_keys: Das Play in rollout.yml darf nur name, hosts, gather_facts, handlers und tasks
  verwenden.
diagnostics.tasks: rollout.yml muss genau drei Aufgaben enthalten.
diagnostics.controls: Eine Aufgabe darf changed_when, check_mode oder when nicht setzen.
diagnostics.keys: Eine Aufgabe darf nur name, notify und ein file- oder copy-Modul verwenden.
diagnostics.module: Jede Aufgabe muss genau ein file- oder copy-Modul mit einer Argumentzuordnung haben.
diagnostics.duplicate: Die Aufgaben in rollout.yml dürfen kein Ziel wiederholen.
diagnostics.notify_scope: Nur die Banner-Aufgabe darf notify setzen.
diagnostics.dir_state: Der state der file-Aufgabe für /srv/site/config muss directory sein.
diagnostics.dir_args: Die file-Aufgabe für /srv/site/config darf nur die Argumente path, state und mode
  verwenden.
diagnostics.notify: Notify der Banner-Aufgabe muss Reload banner angeben.
diagnostics.order: Die Aufgabe /srv/site/config muss vor /srv/site/config/route stehen.
diagnostics.handler: rollout.yml muss genau einen Handler namens Reload banner haben.
diagnostics.command: Der Handler darf nur seinen Namen und ein command-Modul mit dq-service reload verwenden.
diagnostics.invalid: rollout.yml muss ein lesbares Play mit der erforderlichen Struktur enthalten.
diagnostics.repair: repair.log darf nicht leer sein.
diagnostics.path_dir: rollout.yml muss eine Aufgabe für /srv/site/config enthalten.
diagnostics.path_module_dir: Die Aufgabe /srv/site/config muss das Modul file verwenden.
diagnostics.path_mode_dir: Der Modus der Aufgabe /srv/site/config muss 0755 sein.
diagnostics.path_banner: rollout.yml muss eine Aufgabe für /srv/site/message enthalten.
diagnostics.path_module_banner: Die Aufgabe /srv/site/message muss das Modul copy verwenden.
diagnostics.path_mode_banner: Der Modus der Aufgabe /srv/site/message muss 0644 sein.
diagnostics.path_content_banner: Der Inhalt der Aufgabe /srv/site/message muss north-79 mit einem folgenden
  Zeilenumbruch sein.
diagnostics.path_args_banner: Die copy-Aufgabe für /srv/site/message darf nur dest, content und mode verwenden.
diagnostics.path_route: rollout.yml muss eine Aufgabe für /srv/site/config/route enthalten.
diagnostics.path_module_route: Die Aufgabe /srv/site/config/route muss das Modul copy verwenden.
diagnostics.path_mode_route: Der Modus der Aufgabe /srv/site/config/route muss 0644 sein.
diagnostics.path_content_route: Der Inhalt der Aufgabe /srv/site/config/route muss route=north mit einem
  folgenden Zeilenumbruch sein.
diagnostics.path_args_route: Die copy-Aufgabe für /srv/site/config/route darf nur dest, content und mode
  verwenden.
diagnostics.recap_1: second.log muss für app1 changed=0, unreachable=0 und failed=0 in dieser Reihenfolge
  zeigen.
diagnostics.ssh_1: Der SSH-Versuch zu app1 schlug fehl, ohne eine Diagnose vom Host zu liefern.
diagnostics.http_1: app1 muss auf Port 8080 north-79 liefern.
diagnostics.host_1_dir_mode: Auf app1 muss der Modus von /srv/site/config 0755 entsprechen.
diagnostics.host_1_banner_mode: Auf app1 muss der Modus von /srv/site/message 0644 entsprechen.
diagnostics.host_1_banner_content: Auf app1 muss der Inhalt von /srv/site/message north-79 entsprechen.
