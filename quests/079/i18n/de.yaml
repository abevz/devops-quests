title: Wiederherstellung der Flotte
brief: 'Die Flotte ist teilweise konfiguriert: app1 hat das aktuelle banner, app2 hat ein altes banner
  und Verzeichnis im Privatmodus und app3 hat kein route-Verzeichnis. Korrigieren Sie rollout.yml, sodass
  das Verzeichnis 0755 ist, banner 0644 und alle Hosts route=north. erhalten. Behalten Sie das Live-Verzeichnis
  reload handler bei. Laufen Sie einmal in repair.log und dann ein zweites Mal in second.log. Der zweite
  recap muss changed=0 auf allen drei Hosts melden. Überprüfen Sie die tatsächlichen Dateien und HTTP,
  nicht nur einen erfolgreichen recap.


  Questdateien in `~/quest` (einige erscheinen in späteren Phasen): `inventory.ini`, `ansible.cfg`, `rollout.yml`,
  `repair.log`, `second.log`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: Alle drei Ziele verfügen über das erforderliche Verzeichnis, die erforderlichen
  Dateimodi und route; HTTP gibt north-79 zurück und der zweite Lauf ändert nichts.'
debrief: Eine deklarative Reparatur konvergierte verschiedene Teilzustände und bewies die Wiederholbarkeit
  in einem zweiten Durchlauf.
stages.0.brief: 'Erfolgskriterien: Alle drei Ziele verfügen über das erforderliche Verzeichnis, die erforderlichen
  Dateimodi und route; HTTP gibt north-79 zurück und der zweite Lauf ändert nichts.'
stages.0.objectives.0.text: Alle drei Ziele verfügen über das erforderliche Verzeichnis, die Dateimodi
  und route; HTTP gibt north-79 zurück und der zweite Lauf ändert nichts.
hints.0.text: Eine Flotte kann aus verschiedenen gültigen und ungültigen Teilzuständen starten.
hints.1.text: Deklarieren Sie Verzeichnisse vor Dateien und halten Sie reload an die tatsächlichen banner-Änderungen
  gebunden.
hints.2.text: Reparieren Sie die Berechtigungen, führen Sie sie zweimal aus und überprüfen Sie den zweiten
  recap sowie alle HTTP endpoints.
phrases.0: Ich habe Hosts mit unterschiedlichen Teilkonfigurationen wiederhergestellt.
phrases.1: Ich habe Handler-gesteuerte Dienst-Neuladungen überprüft.
phrases.2: Ich habe die Idempotenz mit einem zweiten Durchlauf und einem tatsächlich verwalteten Zustand
  bewiesen.
