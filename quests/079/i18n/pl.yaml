title: Odzyskiwanie floty
brief: "Flota zaczyna w różnych stanach częściowych i potrzebuje spójnego wyniku działania usługi.\n\nPracuj na\
  \ workstation w `~/quest` z plikami `inventory.ini`, `ansible.cfg`, `rollout.yml`. Dodatkowe pliki na stacji roboczej\
  \ w `~/quest`: `caller-contract.json`, `caller-cache.py`.\n\n**Wymagania:**\n- Dowody na workstation:\n  - Niepusty\
  \ plik: `~/quest/repair.log`.\n  - `~/quest/second.log`: podsumowania dla `app1`, `app2`, `app3` pokazują `changed=0`,\
  \ `unreachable=0`, `failed=0`.\n- Katalog na każdym zarządzanym hoście (`app1`, `app2`, `app3`):\n  - Ścieżka:\
  \ `/srv/site/config`.\n  - Tryb dostępu: `0755`.\n- Pliki na każdym zarządzanym hoście (`app1`, `app2`, `app3`):\n\
  \  - `/srv/site/message`: `north-79`.\n  - `/srv/site/config/route`: `route=north`.\n  - Tryb dostępu: `0644`.\n\
  - Aktywna usługa na każdym zarządzanym hoście (`app1`, `app2`, `app3`):\n  - HTTP: `8080`, `/`.\n  - Odpowiedź:\
  \ `north-79`.\n- Bieżący `rollout.yml` spełnia również `caller-contract.json`: odzyskuje mieszany stan wywołującego,\
  \ zachowuje pozostałe dane i nie zmienia wyników aplikacji przy drugim zastosowaniu z `changed=0`, `unreachable=0`,\
  \ `failed=0`.\n\nRejestry są sprawdzane jako pliki; nie dowodzą czasu wykonania operacji."
debrief: Zbudowano odzyskiwanie plików, trasy i działającej usługi, zachowano poprawne warunki oraz potwierdzono
  zbieżność floty i wywołującego.
stages.0.brief: Każdy zarządzany host musi osiągnąć wymagany stan usługi z poprawnym rejestrem powtórnego wykonania.
stages.0.objectives.0.text: 'Niepuste dowody na workstation: `repair.log`.'
stages.0.objectives.1.text: Plik `second.log` na workstation zgłasza `changed=0`, `unreachable=0`, `failed=0` dla
  `app1`, `app2`, `app3`. Bieżący program odzyskuje także zadany stan wywołującego i osiąga zbieżność przy drugim
  zastosowaniu bez zmiany zachowanych danych i wyników aplikacji.
stages.0.objectives.2.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) ścieżka `/srv/site/config` ma
  tryb `0755`.
stages.0.objectives.3.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) pliki `/srv/site/message` i `/srv/site/config/route`
  mają tryb `0644`.
stages.0.objectives.4.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/message` zawiera
  `north-79`.
stages.0.objectives.5.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/config/route`
  zawiera `route=north`.
stages.0.objectives.6.text: HTTP na porcie `8080` zwraca `north-79` na każdym zarządzanym hoście (`app1`, `app2`,
  `app3`).
hints.0.text: Pliki i pamięci podręczne działających usług mają oddzielny stan. Odzyskiwanie ma osiągnąć żądany
  wynik usługi, zachowując poprawne dane.
hints.1.text: Porównaj `rollout.yml`, `caller-contract.json` i `caller-cache.py`. Na zarządzanych hostach porównaj
  pliki, uprawnienia, dane trasy i rzeczywiste odpowiedzi HTTP. Prześledź, które zadania zgłoszą zmianę przed wykonaniem
  powiadomienia.
hints.2.text: 'Zbuduj dostarczanie katalogów i plików na podanych wejściach, obserwuj rzeczywistego konsumenta i
  odświeżaj nieaktualny stan. Uruchom `ansible-playbook rollout.yml > repair.log` i powtórz z zapisem do `second.log`:
  każdy host ma zgłosić `changed=0`, `unreachable=0`, `failed=0` w drugim przebiegu. Sprawdź `/srv/site/message`,
  `/srv/site/config/route`, uprawnienia i HTTP na `8080`. Test wywołującego porównuje też rzeczywiste wyniki przed
  drugim zastosowaniem i po nim.'
phrases.0: Odzyskałem hosty z różnymi konfiguracjami częściowymi.
phrases.1: Zweryfikowałem przeładowania usług sterowanych przez program obsługi.
phrases.2: Udowodniłem idempotencję przy drugim uruchomieniu i rzeczywistym stanie zarządzanym.
