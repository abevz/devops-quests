title: Odzyskiwanie floty
brief: 'Flota jest częściowo skonfigurowana: app1 ma aktualny banner, app2 ma stary tryb prywatny banner
  i directory, a app3 nie ma route directory. Popraw rollout.yml, więc directory to 0755, banner to 0644,
  a wszystkie hosty otrzymają route=north. Zachowaj moduł obsługi przeładowania na żywo. Wbiegnij raz
  do repair.log, potem drugi raz do second.log; drugi recap musi zgłosić changed=0 na wszystkich trzech
  hostach. Sprawdź aktualne pliki i HTTP, a nie tylko udany recap.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `inventory.ini`, `ansible.cfg`,
  `rollout.yml`, `repair.log`, `second.log`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: wszystkie trzy cele mają wymagane directory, tryby plików i route; HTTP
  zwraca north-79, a drugie uruchomienie nic nie zmienia.'
debrief: Naprawa deklaratywna zbiegła różne stany częściowe i wykazała powtarzalność w drugim przebiegu.
stages.0.brief: 'Kryteria sukcesu: wszystkie trzy cele mają wymagane directory, tryby plików i route;
  HTTP zwraca north-79, a drugie uruchomienie nic nie zmienia.'
stages.0.objectives.0.text: Wszystkie trzy cele mają wymagane directory, tryby plików i route; HTTP zwraca
  north-79, a drugie uruchomienie nic nie zmienia.
hints.0.text: Flota może zaczynać od różnych prawidłowych i nieprawidłowych stanów częściowych.
hints.1.text: Deklaruj katalogi przed plikami i powiąż reload z rzeczywistymi zmianami w banner.
hints.2.text: Napraw uprawnienia, uruchom dwukrotnie i sprawdź drugie recap oraz wszystkie HTTP endpoints.
phrases.0: Odzyskałem hosty z różnymi konfiguracjami częściowymi.
phrases.1: Zweryfikowałem przeładowania usług sterowanych przez program obsługi.
phrases.2: Udowodniłem idempotencję przy drugim uruchomieniu i rzeczywistym stanie zarządzanym.
