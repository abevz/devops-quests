title: Odzyskiwanie floty
brief: 'W `~/quest` przeczytaj `inventory.ini`, `ansible.cfg` i `rollout.yml`. Trzy hosty floty mają różne stany początkowe.
  Idempotentny play niczego nie zmienia przy ponownym uruchomieniu. Dostarczony handler `Reload banner` używa specyficznego
  dla zatoki adaptera `dq-service reload`.


  Użyj jednego play dla `fleet` i trzech bezwarunkowych zadań file/copy: katalog `/srv/site/config` z trybem `0755`, baner
  `/srv/site/message` z trybem `0644` i treścią `north-79` oraz znakiem nowej linii, a także trasa `/srv/site/config/route`
  z trybem `0644` i treścią `route=north` oraz znakiem nowej linii. Utwórz katalog przed plikiem trasy i powiadom `Reload
  banner` po zmianie banera. Akceptowane są aliasy `file`/`copy`, równoważne zapisy trybów ósemkowych, jednoelementowa lista
  notify i inna bezpieczna kolejność. Zachowaj tylko wymienione argumenty modułów i polecenie handlera `dq-service reload`;
  pomiń w play `pre_tasks`, `post_tasks`, `roles`, `check_mode`, `changed_when`, a w zadaniach `when`, `check_mode`, `changed_when`:
  te ograniczenia zapewniają wykonanie sprawdzanych zadań na każdym hoście bez ukrywania zmian i dodatkowych niesprawdzanych
  operacji.


  Uruchom play do `repair.log`, a potem do `second.log`. Pierwszy dziennik musi być niepusty; każde podsumowanie app1/app2/app3
  w drugim musi pokazywać kolejno `changed=0`, `unreachable=0`, `failed=0`. Każdy host musi mieć wskazane treści i tryby plików,
  a HTTP na porcie 8080 musi zwracać `north-79`. Dzienniki są sprawdzane jako pliki i nie dowodzą czasu uruchomień. Pracuj
  tylko w zatoce offline.


  Play może używać tylko `name`, `hosts`, `gather_facts`, `handlers` i `tasks`; każde zadanie może używać `name`, jednego
  modułu file/copy i `notify` tylko dla banera. Użyj dokładnie jednego handlera z samymi `name` i `command` (lub `ansible.builtin.command`).
  Wyklucza to niesprawdzane operacje.'
debrief: Playbook, zapisane podsumowania i rzeczywisty stan floty odpowiadały kontrolom.
stages.0.brief: Ograniczony playbook, podsumowania dzienników, treści i tryby plików trzech hostów oraz odpowiedzi HTTP odpowiadają
  opisowi.
stages.0.objectives.0.text: Ograniczony playbook, podsumowania dzienników, treści i tryby plików trzech hostów oraz odpowiedzi
  HTTP odpowiadają opisowi.
hints.0.text: Flota może zaczynać od różnych prawidłowych i nieprawidłowych stanów częściowych.
hints.1.text: Deklaruj katalogi przed plikami i powiąż reload z rzeczywistymi zmianami w banner.
hints.2.text: Napraw uprawnienia, uruchom dwukrotnie i sprawdź drugie recap oraz wszystkie HTTP endpoints.
phrases.0: Odzyskałem hosty z różnymi konfiguracjami częściowymi.
phrases.1: Zweryfikowałem przeładowania usług sterowanych przez program obsługi.
phrases.2: Udowodniłem idempotencję przy drugim uruchomieniu i rzeczywistym stanie zarządzanym.
diagnostics.hosts: Pole hosts w play pliku rollout.yml musi wynosić fleet.
diagnostics.play_keys: Play w rollout.yml może używać tylko name, hosts, gather_facts, handlers i tasks.
diagnostics.tasks: rollout.yml musi zawierać dokładnie trzy zadania.
diagnostics.controls: Zadanie nie może ustawiać changed_when, check_mode ani when.
diagnostics.keys: Zadanie może używać tylko name, notify i modułu file lub copy.
diagnostics.module: Każde zadanie musi mieć dokładnie jeden moduł file lub copy z mapą argumentów.
diagnostics.duplicate: Zadania rollout.yml nie mogą powtarzać ścieżki docelowej.
diagnostics.notify_scope: Tylko zadanie banera może ustawiać notify.
diagnostics.dir_state: Stan zadania file dla /srv/site/config musi wynosić directory.
diagnostics.dir_args: Zadanie file dla /srv/site/config musi używać tylko argumentów path, state i mode.
diagnostics.notify: Notify zadania banera musi wskazywać Reload banner.
diagnostics.order: Zadanie /srv/site/config musi poprzedzać /srv/site/config/route.
diagnostics.handler: rollout.yml musi mieć dokładnie jeden handler o nazwie Reload banner.
diagnostics.command: Handler musi używać tylko nazwy i jednego modułu command ustawionego na dq-service reload.
diagnostics.invalid: rollout.yml musi zawierać jeden czytelny play o wymaganej strukturze.
diagnostics.repair: repair.log musi być niepusty.
diagnostics.path_dir: rollout.yml musi zawierać zadanie dla /srv/site/config.
diagnostics.path_module_dir: Zadanie /srv/site/config musi używać modułu file.
diagnostics.path_mode_dir: Uprawnienia zadania /srv/site/config muszą wynosić 0755.
diagnostics.path_banner: rollout.yml musi zawierać zadanie dla /srv/site/message.
diagnostics.path_module_banner: Zadanie /srv/site/message musi używać modułu copy.
diagnostics.path_mode_banner: Uprawnienia zadania /srv/site/message muszą wynosić 0644.
