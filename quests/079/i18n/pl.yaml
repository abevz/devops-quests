title: Odzyskiwanie floty
brief: |-
  Flota zaczyna w różnych stanach częściowych i potrzebuje spójnego wyniku działania usługi.

  Pracuj na workstation w `~/quest` z plikami `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Wymagania:**
  - Dowody na workstation:
    - Niepusty plik: `~/quest/repair.log`.
    - `~/quest/second.log`: podsumowania dla `app1`, `app2`, `app3` pokazują `changed=0`, `unreachable=0`, `failed=0`.
  - Katalog na każdym zarządzanym hoście (`app1`, `app2`, `app3`):
    - Ścieżka: `/srv/site/config`.
    - Tryb dostępu: `0755`.
  - Pliki na każdym zarządzanym hoście (`app1`, `app2`, `app3`):
    - `/srv/site/message`: `north-79`.
    - `/srv/site/config/route`: `route=north`.
    - Tryb dostępu: `0644`.
  - Aktywna usługa na każdym zarządzanym hoście (`app1`, `app2`, `app3`):
    - HTTP: `8080`, `/`.
    - Odpowiedź: `north-79`.

  **Sprawdź przed Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'cat /srv/site/message /srv/site/config/route; ls -ld /srv/site/config; ls -l /srv/site/message /srv/site/config/route'` — Każdy host pokazuje `north-79`, `route=north`, uprawnienia katalogu `drwxr-xr-x` i plików `-rw-r--r--`.
  - `cat ~/quest/repair.log ~/quest/second.log` — Rejestr naprawy jest niepusty; `second.log` zgłasza `changed=0`, `unreachable=0`, `failed=0` dla wszystkich trzech hostów.
  - `for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done` — Pokazuje `north-79` z `app1`, `app2`, `app3`.

  Rejestry są sprawdzane jako pliki; nie dowodzą czasu wykonania operacji.
debrief: Playbook, zapisane podsumowania i rzeczywisty stan floty odpowiadały kontrolom.
stages.0.brief: Każdy zarządzany host musi osiągnąć wymagany stan usługi z poprawnym rejestrem powtórnego wykonania.
stages.0.objectives.0.text: 'Niepuste dowody na workstation: `repair.log`.'
stages.0.objectives.1.text: Plik `second.log` na workstation zgłasza `changed=0`, `unreachable=0`, `failed=0` dla
  `app1`, `app2`, `app3`.
stages.0.objectives.2.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) ścieżka `/srv/site/config` ma
  tryb `0755`.
stages.0.objectives.3.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) pliki `/srv/site/message` i `/srv/site/config/route`
  mają tryb `0644`.
stages.0.objectives.4.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/message` zawiera
  `north-79`.
stages.0.objectives.5.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/config/route`
  zawiera `route=north`.
stages.0.objectives.6.text: HTTP na porcie `8080` zwraca `north-79` na każdym zarządzanym hoście (`app1`, `app2`,
  `app3`).
hints.0.text: Flota może zaczynać od różnych prawidłowych i nieprawidłowych stanów częściowych.
hints.1.text: Deklaruj katalogi przed plikami i powiąż reload z rzeczywistymi zmianami w banner.
hints.2.text: 'Napraw uprawnienia, uruchom dwukrotnie i sprawdź drugie recap oraz wszystkie HTTP endpoints. Zachowane
  granice źródła: jeden play `fleet` tylko z `name`, `hosts`, `gather_facts`, `handlers`, `tasks`; trzy bezwarunkowe
  zadania file/copy tylko z `name`, jednym modułem i `notify` jedynie dla banera. Argumenty katalogu to dokładnie
  `path`, `state`, `mode`; argumenty copy to dokładnie `dest`, `content`, `mode`. Utwórz katalog przed plikiem trasy;
  treść komunikatu i trasy zawiera znak nowego wiersza. Tylko baner powiadamia `Reload banner`. Zachowaj jeden handler
  tylko z `name` i jednym modułem command wykonującym `dq-service reload`. Dopuszczalne są aliasy file/copy, równoważne
  zapisy ósemkowe i jednoelementowa lista notify. Zapisz rzeczywiste wykonania przez `ansible-playbook rollout.yml
  > repair.log` i `ansible-playbook rollout.yml > second.log`.'
phrases.0: Odzyskałem hosty z różnymi konfiguracjami częściowymi.
phrases.1: Zweryfikowałem przeładowania usług sterowanych przez program obsługi.
phrases.2: Udowodniłem idempotencję przy drugim uruchomieniu i rzeczywistym stanie zarządzanym.
diagnostics.hosts: Pole hosts w play pliku rollout.yml musi wynosić fleet.
diagnostics.play_keys: Play w rollout.yml może używać tylko name, hosts, gather_facts, handlers i tasks.
diagnostics.tasks: rollout.yml musi zawierać dokładnie trzy zadania.
diagnostics.controls: Zadanie nie może ustawiać changed_when, check_mode ani when.
diagnostics.keys: Zadanie może używać tylko name, notify i modułu file lub copy.
diagnostics.module: Każde zadanie musi mieć dokładnie jeden moduł file lub copy z mapą argumentów.
diagnostics.duplicate: Zadania rollout.yml nie mogą powtarzać ścieżki docelowej.
diagnostics.notify_scope: Tylko zadanie banera może ustawiać notify.
diagnostics.dir_state: Stan zadania file dla /srv/site/config musi wynosić directory.
diagnostics.dir_args: Zadanie file dla /srv/site/config musi używać tylko argumentów path, state i mode.
diagnostics.notify: Notify zadania banera musi wskazywać Reload banner.
diagnostics.order: Zadanie /srv/site/config musi poprzedzać /srv/site/config/route.
diagnostics.handler: rollout.yml musi mieć dokładnie jeden handler o nazwie Reload banner.
diagnostics.command: Handler musi używać tylko nazwy i jednego modułu command ustawionego na dq-service reload.
diagnostics.invalid: rollout.yml musi zawierać jeden czytelny play o wymaganej strukturze.
diagnostics.repair: repair.log musi być niepusty.
diagnostics.path_dir: rollout.yml musi zawierać zadanie dla /srv/site/config.
diagnostics.path_module_dir: Zadanie /srv/site/config musi używać modułu file.
