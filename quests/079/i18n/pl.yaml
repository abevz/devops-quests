title: Odzyskiwanie floty
brief: "Flota zaczyna w różnych stanach częściowych i potrzebuje spójnego wyniku działania usługi.\n\nPracuj na\
  \ workstation w `~/quest` z plikami `inventory.ini`, `ansible.cfg`, `rollout.yml`. Dodatkowe pliki na stacji roboczej\
  \ w `~/quest`: `caller-contract.json`, `caller-cache.py`.\n\n**Wymagania:**\n- Dowody na workstation:\n  - Niepusty\
  \ plik: `~/quest/repair.log`.\n  - `~/quest/second.log`: podsumowania dla `app1`, `app2`, `app3` pokazują `changed=0`,\
  \ `unreachable=0`, `failed=0`.\n- Katalog na każdym zarządzanym hoście (`app1`, `app2`, `app3`):\n  - Ścieżka:\
  \ `/srv/site/config`.\n  - Tryb dostępu: `0755`.\n- Pliki na każdym zarządzanym hoście (`app1`, `app2`, `app3`):\n\
  \  - `/srv/site/message`: `north-79`.\n  - `/srv/site/config/route`: `route=north`.\n  - Tryb dostępu: `0644`.\n\
  - Aktywna usługa na każdym zarządzanym hoście (`app1`, `app2`, `app3`):\n  - HTTP: `8080`, `/`.\n  - Odpowiedź:\
  \ `north-79`.\n- Bieżący `rollout.yml` spełnia również `caller-contract.json`: odzyskuje mieszany stan wywołującego,\
  \ zachowuje pozostałe dane i nie zmienia wyników aplikacji przy drugim zastosowaniu z `changed=0`, `unreachable=0`,\
  \ `failed=0`.\n\nRejestry są sprawdzane jako pliki; nie dowodzą czasu wykonania operacji."
debrief: Zbudowano odzyskiwanie plików, trasy i działającej usługi, zachowano poprawne warunki oraz potwierdzono
  zbieżność floty i wywołującego.
stages.0.brief: Każdy zarządzany host musi osiągnąć wymagany stan usługi z poprawnym rejestrem powtórnego wykonania.
stages.0.objectives.0.text: 'Niepuste dowody na workstation: `repair.log`.'
stages.0.objectives.1.text: Plik `second.log` na workstation zgłasza `changed=0`, `unreachable=0`, `failed=0` dla
  `app1`, `app2`, `app3`. Bieżący program odzyskuje także zadany stan wywołującego i osiąga zbieżność przy drugim
  zastosowaniu bez zmiany zachowanych danych i wyników aplikacji.
stages.0.objectives.2.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) ścieżka `/srv/site/config` ma
  tryb `0755`.
stages.0.objectives.3.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) pliki `/srv/site/message` i `/srv/site/config/route`
  mają tryb `0644`.
stages.0.objectives.4.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/message` zawiera
  `north-79`.
stages.0.objectives.5.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/config/route`
  zawiera `route=north`.
stages.0.objectives.6.text: HTTP na porcie `8080` zwraca `north-79` na każdym zarządzanym hoście (`app1`, `app2`,
  `app3`).
hints.0.text: Pliki i pamięci podręczne działających usług mają oddzielny stan. Odzyskiwanie ma osiągnąć żądany
  wynik usługi, zachowując poprawne dane.
hints.1.text: Porównaj `rollout.yml`, `caller-contract.json` i `caller-cache.py`. Na zarządzanych hostach porównaj
  pliki, uprawnienia, dane trasy i rzeczywiste odpowiedzi HTTP. Prześledź, które zadania zgłoszą zmianę przed wykonaniem
  powiadomienia.
hints.2.text: 'Zbuduj dostarczanie katalogów i plików na podanych wejściach, obserwuj rzeczywistego konsumenta i
  odświeżaj nieaktualny stan. Uruchom `ansible-playbook rollout.yml > repair.log` i powtórz z zapisem do `second.log`:
  każdy host ma zgłosić `changed=0`, `unreachable=0`, `failed=0` w drugim przebiegu. Sprawdź `/srv/site/message`,
  `/srv/site/config/route`, uprawnienia i HTTP na `8080`. Test wywołującego porównuje też rzeczywiste wyniki przed
  drugim zastosowaniem i po nim.'
phrases.0: Odzyskałem hosty z różnymi konfiguracjami częściowymi.
phrases.1: Zweryfikowałem przeładowania usług sterowanych przez program obsługi.
phrases.2: Udowodniłem idempotencję przy drugim uruchomieniu i rzeczywistym stanie zarządzanym.
diagnostics.repair: Wyjście naprawy mogło nie zostać zapisane lub repair.log jest pusty; zachowaj log. Ten warunek sprawdza niepusty plik, nie poprawność recap. [Przyczyna i kontrola](guides#guide=ansible-4&section=fleet-retain-nonempty-repair-log)
diagnostics.probe_0_1: Wcześniejsza kontrola recap z limitem 8s może skończyć się bez markera lub program caller zawodzi przy importach/starcie; odróżnij te błędy od nazwanych effects, observation i budget. [Przyczyna i kontrola](guides#guide=ansible-4&section=fleet-legacy-recap-timeout-and-caller-startup)
diagnostics.fleet_effects: Pusty dostarczony play, stałe wejścia lub handler tylko od copy mogą pozostawić stary cache przy poprawnym pliku; napraw katalog caller i żywy cache, zachowaj inne dane, a drugi apply wykonaj bez zapisów. [Przyczyna i kontrola](guides#guide=ansible-4&section=fleet-parameterized-repair-and-cache-convergence)
diagnostics.fleet_budget: Ansible może przekroczyć pozostały limit 14s powtórzenia caller; sprawdź zablokowane polecenia i połączenia przed kolejną naprawą. [Przyczyna i kontrola](guides#guide=ansible-4&section=fleet-bounded-direct-caller-replay)
diagnostics.fleet_observation: Powtórzenie caller może nie uruchomić Ansible lub nie odczytać plików/adaptera cache; sprawdź ścieżki, prawa i błędy wykonania przed zwykłym porównaniem wyniku. [Przyczyna i kontrola](guides#guide=ansible-4&section=fleet-local-caller-observation-errors)
diagnostics.recap_1: app1 może nadal zmieniać dane lub reload przy powtórnym apply albo brak jego recap; second.log wymaga changed=0, unreachable=0 i failed=0 dla tego hosta. [Przyczyna i kontrola](guides#guide=ansible-4&section=fleet-host-1-converged-recap)
diagnostics.ssh_1: SSH do app1 lub zdalna kontrola zawiodły bez oczekiwanego wyniku pola; sprawdź łączność i błędy zdalnej powłoki. Nieoczekiwane niepuste wyjście pozostaje i też daje fallback. [Przyczyna i kontrola](guides#guide=ansible-4&section=fleet-host-1-ssh-or-opaque-remote-failure)
diagnostics.host_1_dir_mode: Katalog konfiguracji app1 może nie istnieć lub mieć błędny mode; twórz /srv/site/config z mode 755 zamiast polegać na umask. [Przyczyna i kontrola](guides#guide=ansible-4&section=fleet-host-1-configuration-directory-mode)
diagnostics.host_1_banner_mode: app1 /srv/site/message może nie istnieć lub mieć prawa pozostawione przez inne zadanie; zadeklaruj mode 644 i sprawdź rzeczywisty wynik zdalny. [Przyczyna i kontrola](guides#guide=ansible-4&section=fleet-host-1-banner-file-mode)
diagnostics.host_1_route_mode: app1 /srv/site/config/route może nie istnieć lub mieć prawa pozostawione przez inne zadanie; zadeklaruj mode 644 i sprawdź rzeczywisty wynik zdalny. [Przyczyna i kontrola](guides#guide=ansible-4&section=fleet-host-1-route-file-mode)
diagnostics.host_1_banner_content: app1 może dostawać inną stałą wiadomość lub używać innego celu; dostarczaj expected_message do rzeczywistego /srv/site/message. [Przyczyna i kontrola](guides#guide=ansible-4&section=fleet-host-1-declared-message-value)
diagnostics.host_1_route_content: app1 może zachowywać starą trasę lub dostać błędną wartość; dostarczaj expected_route przez interfejs /srv/site/config/route. [Przyczyna i kontrola](guides#guide=ansible-4&section=fleet-host-1-declared-route-value)
diagnostics.http_1: app1 może podawać stary cache przy poprawnym pliku; obserwuj żywy HTTP i wykonaj reload przy różnicy, także gdy copy nie zmienia pliku. Błędy transportu też przerywają żądanie. [Przyczyna i kontrola](guides#guide=ansible-4&section=fleet-host-1-live-cache-with-unchanged-file)
diagnostics.recap_2: app2 może nadal zmieniać dane lub reload przy powtórnym apply albo brak jego recap; second.log wymaga changed=0, unreachable=0 i failed=0 dla tego hosta. [Przyczyna i kontrola](guides#guide=ansible-4&section=fleet-host-2-converged-recap)
