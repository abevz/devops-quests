title: Fleet recovery
brief: |-
  The fleet starts from different partial states and needs one consistent service result.

  Work on the workstation in `~/quest` with `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Requirements:**
  - Configured fleet repair:
    - Scope: `app1`, `app2`, `app3`.
    - Normal change reporting stays active; the service refreshes when the banner changes.
  - Evidence on the workstation:
    - Nonempty file: `~/quest/repair.log`.
  - Evidence on the workstation:
    - Path: `~/quest/second.log`.
    - `app1`, `app2`, `app3`: `changed=0`, `unreachable=0`, `failed=0`.
  - Directory on every managed host (`app1`, `app2`, `app3`):
    - Path: `/srv/site/config`.
    - Access mode: `0755`.
  - Files on every managed host (`app1`, `app2`, `app3`):
    - `/srv/site/message`: `north-79`.
    - `/srv/site/config/route`: `route=north`.
    - Access mode: `0644`.
  - Live service on every managed host (`app1`, `app2`, `app3`):
    - HTTP: `8080`, `/`.
    - Response: `north-79`.

  **Verify yourself before Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'cat /srv/site/message /srv/site/config/route; ls -ld /srv/site/config; ls -l /srv/site/message /srv/site/config/route'` — Each host shows `north-79`, `route=north`, directory permissions `drwxr-xr-x` and file permissions `-rw-r--r--`.
  - `cat ~/quest/repair.log ~/quest/second.log` — The repair record is nonempty; `second.log` reports `changed=0`, `unreachable=0`, `failed=0` for all three hosts.
  - `for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done` — Shows `north-79` from `app1`, `app2`, `app3`.

  Logs are inspected as files; they do not prove when the runs occurred.
debrief: The playbook, recorded recaps and live fleet conditions matched the checks.
stages.0.brief: Every managed host must converge to the required service state with a clean repeat-run record.
stages.0.objectives.0.text: Fleet repair is configured for every managed host, with normal change reporting and
  service refresh tied to banner changes.
stages.0.objectives.1.text: 'Nonempty evidence on the workstation: `repair.log`.'
stages.0.objectives.2.text: The workstation `second.log` reports `changed=0`, `unreachable=0`, `failed=0` for `app1`,
  `app2`, `app3`.
stages.0.objectives.3.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/config` has mode `0755`.
stages.0.objectives.4.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` and `/srv/site/config/route`
  have mode `0644`.
stages.0.objectives.5.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` contains `north-79`.
stages.0.objectives.6.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/config/route` contains `route=north`.
stages.0.objectives.7.text: HTTP on port `8080` returns `north-79` on every managed host (`app1`, `app2`, `app3`).
hints.0.text: A fleet can start from different valid and invalid partial states.
hints.1.text: Declare directories before files, and keep the reload tied to actual banner changes.
hints.2.text: 'Repair permissions, run twice and verify the second recap plus all HTTP endpoints. Retained source
  boundaries: one `fleet` play with only `name`, `hosts`, `gather_facts`, `handlers`, `tasks`; three unconditional
  file/copy tasks, with only `name`, one module and banner-only `notify`. Directory arguments are exactly `path`,
  `state`, `mode`; copy arguments are exactly `dest`, `content`, `mode`. Create the directory before the route;
  message and route content include a newline. Only the banner notifies `Reload banner`. Keep one handler with only
  `name` and one command module running `dq-service reload`. File/copy aliases, equivalent octal spellings and a
  one-item notify list are accepted. Save real runs with `ansible-playbook rollout.yml > repair.log` and `ansible-playbook
  rollout.yml > second.log`.'
phrases.0: I recovered hosts with different partial configurations.
phrases.1: I verified handler-driven service reloads.
phrases.2: I proved idempotence with a second run and actual managed state.
diagnostics.hosts: The hosts field of the rollout.yml play must equal fleet.
diagnostics.play_keys: The rollout.yml play may use only name, hosts, gather_facts, handlers and tasks.
diagnostics.tasks: rollout.yml must contain exactly three tasks.
diagnostics.controls: A task must not set changed_when, check_mode or when.
diagnostics.keys: A task may use only name, notify and a file or copy module.
diagnostics.module: Each task must have exactly one file or copy module with a mapping of arguments.
diagnostics.duplicate: The rollout.yml tasks must not repeat a destination.
diagnostics.notify_scope: Only the banner task may set notify.
diagnostics.dir_state: The /srv/site/config file task state must be directory.
diagnostics.dir_args: The /srv/site/config file task must use only path, state and mode arguments.
diagnostics.notify: The banner task notify must identify Reload banner.
diagnostics.order: The /srv/site/config task must precede /srv/site/config/route.
diagnostics.handler: rollout.yml must have exactly one handler named Reload banner.
diagnostics.command: The handler must use only its name and one command module set to dq-service reload.
diagnostics.invalid: rollout.yml must contain one readable play with the required structure.
diagnostics.repair: repair.log must be nonempty.
diagnostics.path_dir: rollout.yml must include a task for /srv/site/config.
diagnostics.path_module_dir: The /srv/site/config task must use the file module.
diagnostics.path_mode_dir: The /srv/site/config task mode must be 0755.
diagnostics.path_banner: rollout.yml must include a task for /srv/site/message.
diagnostics.path_module_banner: The /srv/site/message task must use the copy module.
diagnostics.path_mode_banner: The /srv/site/message task mode must be 0644.
diagnostics.path_content_banner: The /srv/site/message task content must be north-79 followed by one newline.
diagnostics.path_args_banner: The /srv/site/message copy task must use only dest, content and mode.
diagnostics.path_route: rollout.yml must include a task for /srv/site/config/route.
diagnostics.path_module_route: The /srv/site/config/route task must use the copy module.
diagnostics.path_mode_route: The /srv/site/config/route task mode must be 0644.
diagnostics.path_content_route: The /srv/site/config/route task content must be route=north followed by one newline.
diagnostics.path_args_route: The /srv/site/config/route copy task must use only dest, content and mode.
