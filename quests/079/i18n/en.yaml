title: Fleet recovery
brief: "The fleet starts from different partial states and needs one consistent service result.\n\nWork on the workstation\
  \ in `~/quest` with `inventory.ini`, `ansible.cfg`, `rollout.yml`. Additional files on the workstation in `~/quest`:\
  \ `caller-contract.json`, `caller-cache.py`.\n\n**Requirements:**\n- Evidence on the workstation:\n  - Nonempty\
  \ file: `~/quest/repair.log`.\n  - `~/quest/second.log`: recaps for `app1`, `app2`, `app3` show `changed=0`, `unreachable=0`,\
  \ `failed=0`.\n- Directory on every managed host (`app1`, `app2`, `app3`):\n  - Path: `/srv/site/config`.\n  -\
  \ Access mode: `0755`.\n- Files on every managed host (`app1`, `app2`, `app3`):\n  - `/srv/site/message`: `north-79`.\n\
  \  - `/srv/site/config/route`: `route=north`.\n  - Access mode: `0644`.\n- Live service on every managed host\
  \ (`app1`, `app2`, `app3`):\n  - HTTP: `8080`, `/`.\n  - Response: `north-79`.\n- The current `rollout.yml` also\
  \ fulfills `caller-contract.json`: recover a mixed caller state, preserve other caller data, and leave application\
  \ outputs unchanged on a second application with `changed=0`, `unreachable=0`, `failed=0`.\n\nLogs are inspected\
  \ as files; they do not prove when the runs occurred."
debrief: You constructed recovery across file, route and live-service state, preserved healthy conditions and proved
  convergence in the fleet and caller contexts.
stages.0.brief: Every managed host must converge to the required service state with a clean repeat-run record.
stages.0.objectives.0.text: 'Nonempty evidence on the workstation: `repair.log`.'
stages.0.objectives.1.text: The workstation `second.log` reports `changed=0`, `unreachable=0`, `failed=0` for `app1`,
  `app2`, `app3`. The current program also recovers the declared caller state and converges on a second application
  without changing retained data or application outputs.
stages.0.objectives.2.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/config` has mode `0755`.
stages.0.objectives.3.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` and `/srv/site/config/route`
  have mode `0644`.
stages.0.objectives.4.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` contains `north-79`.
stages.0.objectives.5.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/config/route` contains `route=north`.
stages.0.objectives.6.text: HTTP on port `8080` returns `north-79` on every managed host (`app1`, `app2`, `app3`).
hints.0.text: Existing files and running service caches have separate states. Recovery must reach the desired live
  result while preserving healthy data.
hints.1.text: Compare `rollout.yml` with `caller-contract.json` and `caller-cache.py`. On the managed hosts, compare
  the delivered files, their modes, route data and actual HTTP responses. Observe which tasks would report a change
  before a notification can run.
hints.2.text: 'Construct directory and file delivery using the supplied inputs, then observe the actual consumer
  and refresh stale state. Run `ansible-playbook rollout.yml > repair.log` and repeat into `second.log`: every host
  must report `changed=0`, `unreachable=0`, `failed=0` on the second run. Verify `/srv/site/message`, `/srv/site/config/route`,
  their modes and HTTP on `8080`. The caller check also compares actual outputs before and after its second application.'
phrases.0: I recovered hosts with different partial configurations.
phrases.1: I verified handler-driven service reloads.
phrases.2: I proved idempotence with a second run and actual managed state.
diagnostics.repair: The repair run may not have been captured or repair.log may be empty; retain its output. This condition checks a nonempty file rather than the success of its recap. [Cause and check](guides#guide=ansible-4&section=fleet-retain-nonempty-repair-log)
diagnostics.probe_0_1: The earlier 8s recap check can stop without a marker, or the caller program can fail during imports/startup; distinguish those failures from the named replay effects, observation and budget diagnostics. [Cause and check](guides#guide=ansible-4&section=fleet-legacy-recap-timeout-and-caller-startup)
diagnostics.fleet_effects: The empty supplied play, hardcoded inputs or a copy-only handler may leave a stale cache when the message file is already correct; repair the caller directory and live cache, preserve unrelated data, then converge without writes on the second apply. [Cause and check](guides#guide=ansible-4&section=fleet-parameterized-repair-and-cache-convergence)
diagnostics.fleet_budget: An Ansible run may exceed the remaining 14s caller-replay deadline; inspect blocked commands and connection setup before repeating the repair. [Cause and check](guides#guide=ansible-4&section=fleet-bounded-direct-caller-replay)
diagnostics.fleet_observation: The caller replay may be unable to run Ansible or inspect its files/cache adapter; check paths, permissions and execution errors before treating this as an ordinary mismatched result. [Cause and check](guides#guide=ansible-4&section=fleet-local-caller-observation-errors)
diagnostics.recap_1: app1 may still change or reload on the repeated apply, or its recap is missing; second.log needs changed=0, unreachable=0 and failed=0 for this host. [Cause and check](guides#guide=ansible-4&section=fleet-host-1-converged-recap)
diagnostics.ssh_1: app1 SSH or its remote probe failed without the expected field result; inspect connectivity and remote shell errors. Unexpected nonempty output is preserved and also gets this fallback. [Cause and check](guides#guide=ansible-4&section=fleet-host-1-ssh-or-opaque-remote-failure)
diagnostics.host_1_dir_mode: app1 configuration directory may be missing or retain an unintended mode; construct /srv/site/config with mode 755 rather than relying on the creation umask. [Cause and check](guides#guide=ansible-4&section=fleet-host-1-configuration-directory-mode)
diagnostics.host_1_banner_mode: app1 /srv/site/message may be missing or have permissions left by another task; declare mode 644 for the delivered file and verify the actual remote result. [Cause and check](guides#guide=ansible-4&section=fleet-host-1-banner-file-mode)
diagnostics.host_1_route_mode: app1 /srv/site/config/route may be missing or have permissions left by another task; declare mode 644 for the delivered file and verify the actual remote result. [Cause and check](guides#guide=ansible-4&section=fleet-host-1-route-file-mode)
diagnostics.host_1_banner_content: app1 may receive a different hardcoded message or use another destination; deliver expected_message to the actual /srv/site/message file. [Cause and check](guides#guide=ansible-4&section=fleet-host-1-declared-message-value)
diagnostics.host_1_route_content: app1 may retain an old route or have been rewritten with the wrong value; deliver expected_route through the supplied file interface at /srv/site/config/route. [Cause and check](guides#guide=ansible-4&section=fleet-host-1-declared-route-value)
diagnostics.http_1: app1 can serve an old cache even when its message file is already correct; observe live HTTP and reload when it differs, including when copy reports no change. Transport errors can also fail this request. [Cause and check](guides#guide=ansible-4&section=fleet-host-1-live-cache-with-unchanged-file)
