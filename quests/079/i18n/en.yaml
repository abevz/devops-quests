diagnostics.probe_0_1: The observation could not complete. Check current inputs, SSH availability and the supplied
  program interface.
diagnostics.fleet_effects: The current program did not recover the mixed caller state and converge without modifying
  retained data.
diagnostics.fleet_budget: The observation exceeded its budget. Check blocking operations and endpoint availability.
diagnostics.fleet_observation: The current program could not be replayed. Check caller paths, local execution and
  playbook errors.
