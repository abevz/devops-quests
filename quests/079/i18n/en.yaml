title: Fleet recovery
brief: 'The fleet is partially configured: app1 has the current banner, app2 has an
  old private-mode banner and directory, and app3 has no route directory. Correct
  rollout.yml so the directory is 0755, the banner is 0644 and all hosts get route=north.
  Preserve the live reload handler. Run once into repair.log, then a second time into
  second.log; the second recap must report changed=0 on all three hosts. Verify actual
  files and HTTP, not only a successful recap.


  Quest files in `~/quest` (some appear in later stages): `inventory.ini`, `ansible.cfg`,
  `rollout.yml`, `repair.log`, `second.log`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images
  and private services. Change only this bay.


  Initial success criteria: All three targets have the required directory, file modes
  and route; HTTP returns north-79 and the second run changes nothing.'
debrief: A declarative repair converged different partial states and proved repeatability
  on a second run.
stages.0.brief: 'Success criteria: All three targets have the required directory,
  file modes and route; HTTP returns north-79 and the second run changes nothing.'
stages.0.objectives.0.text: All three targets have the required directory, file modes
  and route; HTTP returns north-79 and the second run changes nothing.
hints.0.text: A fleet can start from different valid and invalid partial states.
hints.1.text: Declare directories before files, and keep the reload tied to actual
  banner changes.
hints.2.text: Repair permissions, run twice and verify the second recap plus all HTTP
  endpoints.
phrases.0: I recovered hosts with different partial configurations.
phrases.1: I verified handler-driven service reloads.
phrases.2: I proved idempotence with a second run and actual managed state.
