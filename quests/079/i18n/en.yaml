title: Fleet recovery
brief: "The fleet starts from different partial states and needs one consistent service result.\n\nWork on the workstation\
  \ in `~/quest` with `inventory.ini`, `ansible.cfg`, `rollout.yml`. Additional files on the workstation in `~/quest`:\
  \ `caller-contract.json`, `caller-cache.py`.\n\n**Requirements:**\n- Evidence on the workstation:\n  - Nonempty\
  \ file: `~/quest/repair.log`.\n  - `~/quest/second.log`: recaps for `app1`, `app2`, `app3` show `changed=0`, `unreachable=0`,\
  \ `failed=0`.\n- Directory on every managed host (`app1`, `app2`, `app3`):\n  - Path: `/srv/site/config`.\n  -\
  \ Access mode: `0755`.\n- Files on every managed host (`app1`, `app2`, `app3`):\n  - `/srv/site/message`: `north-79`.\n\
  \  - `/srv/site/config/route`: `route=north`.\n  - Access mode: `0644`.\n- Live service on every managed host\
  \ (`app1`, `app2`, `app3`):\n  - HTTP: `8080`, `/`.\n  - Response: `north-79`.\n- The current `rollout.yml` also\
  \ fulfills `caller-contract.json`: recover a mixed caller state, preserve other caller data, and leave application\
  \ outputs unchanged on a second application with `changed=0`, `unreachable=0`, `failed=0`.\n\nLogs are inspected\
  \ as files; they do not prove when the runs occurred."
debrief: You constructed recovery across file, route and live-service state, preserved healthy conditions and proved
  convergence in the fleet and caller contexts.
stages.0.brief: Every managed host must converge to the required service state with a clean repeat-run record.
stages.0.objectives.0.text: 'Nonempty evidence on the workstation: `repair.log`.'
stages.0.objectives.1.text: The workstation `second.log` reports `changed=0`, `unreachable=0`, `failed=0` for `app1`,
  `app2`, `app3`. The current program also recovers the declared caller state and converges on a second application
  without changing retained data or application outputs.
stages.0.objectives.2.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/config` has mode `0755`.
stages.0.objectives.3.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` and `/srv/site/config/route`
  have mode `0644`.
stages.0.objectives.4.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` contains `north-79`.
stages.0.objectives.5.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/config/route` contains `route=north`.
stages.0.objectives.6.text: HTTP on port `8080` returns `north-79` on every managed host (`app1`, `app2`, `app3`).
hints.0.text: Existing files and running service caches have separate states. Recovery must reach the desired live
  result while preserving healthy data.
hints.1.text: Compare `rollout.yml` with `caller-contract.json` and `caller-cache.py`. On the managed hosts, compare
  the delivered files, their modes, route data and actual HTTP responses. Observe which tasks would report a change
  before a notification can run.
hints.2.text: 'Construct directory and file delivery using the supplied inputs, then observe the actual consumer
  and refresh stale state. Run `ansible-playbook rollout.yml > repair.log` and repeat into `second.log`: every host
  must report `changed=0`, `unreachable=0`, `failed=0` on the second run. Verify `/srv/site/message`, `/srv/site/config/route`,
  their modes and HTTP on `8080`. The caller check also compares actual outputs before and after its second application.'
phrases.0: I recovered hosts with different partial configurations.
phrases.1: I verified handler-driven service reloads.
phrases.2: I proved idempotence with a second run and actual managed state.
