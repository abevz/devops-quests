title: Fleet recovery
brief: 'In `~/quest`, read `inventory.ini`, `ansible.cfg` and `rollout.yml`. The three fleet hosts start in different states.
  An idempotent play changes nothing on a repeat run. The supplied `Reload banner` handler uses the bay-specific `dq-service
  reload` adapter.


  Use one play targeting `fleet` and three unconditional file/copy tasks: directory `/srv/site/config` mode `0755`, banner
  `/srv/site/message` mode `0644` with `north-79` and a newline, and route `/srv/site/config/route` mode `0644` with `route=north`
  and a newline. Create the directory before its route file and notify `Reload banner` when the banner changes. The `file`/`copy`
  aliases, equivalent octal mode spellings, a one-item notify list and different safe ordering are accepted. Keep the listed
  module arguments only, the handler command `dq-service reload`, and omit play `pre_tasks`, `post_tasks`, `roles`, `check_mode`,
  `changed_when` and task `when`, `check_mode`, `changed_when`: these boundaries ensure the assessed tasks run on every host
  without hiding changes or adding unchecked operations.


  Run the play into `repair.log` and again into `second.log`. The first log must be nonempty; each app1/app2/app3 recap in
  the second must show `changed=0`, `unreachable=0`, `failed=0` in that order. Each host must have the stated file contents
  and modes, and HTTP port 8080 must return `north-79`. Logs are inspected as files and do not prove when the runs occurred.
  Work only in the offline bay.


  The play may use only `name`, `hosts`, `gather_facts`, `handlers` and `tasks`; each task may use `name`, one file/copy module
  and `notify` only for the banner. Use exactly one handler with only its `name` and `command` (or `ansible.builtin.command`).
  This excludes unchecked actions.'
debrief: The playbook, recorded recaps and live fleet conditions matched the checks.
stages.0.brief: The bounded playbook, log recaps, three hosts’ file contents and modes, and HTTP responses match the brief.
stages.0.objectives.0.text: The bounded playbook, log recaps, three hosts’ file contents and modes, and HTTP responses match
  the brief.
hints.0.text: A fleet can start from different valid and invalid partial states.
hints.1.text: Declare directories before files, and keep the reload tied to actual banner changes.
hints.2.text: Repair permissions, run twice and verify the second recap plus all HTTP endpoints.
phrases.0: I recovered hosts with different partial configurations.
phrases.1: I verified handler-driven service reloads.
phrases.2: I proved idempotence with a second run and actual managed state.
diagnostics.hosts: The hosts field of the rollout.yml play must equal fleet.
diagnostics.play_keys: The rollout.yml play may use only name, hosts, gather_facts, handlers and tasks.
diagnostics.tasks: rollout.yml must contain exactly three tasks.
diagnostics.controls: A task must not set changed_when, check_mode or when.
diagnostics.keys: A task may use only name, notify and a file or copy module.
diagnostics.module: Each task must have exactly one file or copy module with a mapping of arguments.
diagnostics.duplicate: The rollout.yml tasks must not repeat a destination.
diagnostics.notify_scope: Only the banner task may set notify.
diagnostics.dir_state: The /srv/site/config file task state must be directory.
diagnostics.dir_args: The /srv/site/config file task must use only path, state and mode arguments.
diagnostics.notify: The banner task notify must identify Reload banner.
diagnostics.order: The /srv/site/config task must precede /srv/site/config/route.
diagnostics.handler: rollout.yml must have exactly one handler named Reload banner.
diagnostics.command: The handler must use only its name and one command module set to dq-service reload.
diagnostics.invalid: rollout.yml must contain one readable play with the required structure.
diagnostics.repair: repair.log must be nonempty.
diagnostics.path_dir: rollout.yml must include a task for /srv/site/config.
diagnostics.path_module_dir: The /srv/site/config task must use the file module.
diagnostics.path_mode_dir: The /srv/site/config task mode must be 0755.
diagnostics.path_banner: rollout.yml must include a task for /srv/site/message.
diagnostics.path_module_banner: The /srv/site/message task must use the copy module.
diagnostics.path_mode_banner: The /srv/site/message task mode must be 0644.
diagnostics.path_content_banner: The /srv/site/message task content must be north-79 followed by one newline.
diagnostics.path_args_banner: The /srv/site/message copy task must use only dest, content and mode.
diagnostics.path_route: rollout.yml must include a task for /srv/site/config/route.
diagnostics.path_module_route: The /srv/site/config/route task must use the copy module.
diagnostics.path_mode_route: The /srv/site/config/route task mode must be 0644.
diagnostics.path_content_route: The /srv/site/config/route task content must be route=north followed by one newline.
diagnostics.path_args_route: The /srv/site/config/route copy task must use only dest, content and mode.
diagnostics.recap_1: second.log must show app1 changed=0, unreachable=0 and failed=0 in that order.
diagnostics.ssh_1: The SSH attempt to app1 failed without returning remote diagnostics.
diagnostics.http_1: app1 on port 8080 must return north-79.
diagnostics.host_1_dir_mode: app1 /srv/site/config mode must equal 0755.
diagnostics.host_1_banner_mode: app1 /srv/site/message mode must equal 0644.
diagnostics.host_1_banner_content: app1 /srv/site/message content must equal north-79.
diagnostics.host_1_route_mode: app1 /srv/site/config/route mode must equal 0644.
diagnostics.host_1_route_content: app1 /srv/site/config/route content must equal route=north.
diagnostics.recap_2: second.log must show app2 changed=0, unreachable=0 and failed=0 in that order.
diagnostics.ssh_2: The SSH attempt to app2 failed without returning remote diagnostics.
diagnostics.http_2: app2 on port 8080 must return north-79.
diagnostics.host_2_dir_mode: app2 /srv/site/config mode must equal 0755.
diagnostics.host_2_banner_mode: app2 /srv/site/message mode must equal 0644.
diagnostics.host_2_banner_content: app2 /srv/site/message content must equal north-79.
diagnostics.host_2_route_mode: app2 /srv/site/config/route mode must equal 0644.
diagnostics.host_2_route_content: app2 /srv/site/config/route content must equal route=north.
diagnostics.recap_3: second.log must show app3 changed=0, unreachable=0 and failed=0 in that order.
diagnostics.ssh_3: The SSH attempt to app3 failed without returning remote diagnostics.
diagnostics.http_3: app3 on port 8080 must return north-79.
