title: Fleet recovery
brief: |-
  The fleet starts from different partial states and needs one consistent service result.

  Work on the workstation in `~/quest` with `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Requirements:**
  - Evidence on the workstation:
    - Nonempty file: `~/quest/repair.log`.
    - `~/quest/second.log`: recaps for `app1`, `app2`, `app3` show `changed=0`, `unreachable=0`, `failed=0`.
  - Directory on every managed host (`app1`, `app2`, `app3`):
    - Path: `/srv/site/config`.
    - Access mode: `0755`.
  - Files on every managed host (`app1`, `app2`, `app3`):
    - `/srv/site/message`: `north-79`.
    - `/srv/site/config/route`: `route=north`.
    - Access mode: `0644`.
  - Live service on every managed host (`app1`, `app2`, `app3`):
    - HTTP: `8080`, `/`.
    - Response: `north-79`.

  Logs are inspected as files; they do not prove when the runs occurred.
debrief: The playbook, recorded recaps and live fleet conditions matched the checks.
stages.0.brief: Every managed host must converge to the required service state with a clean repeat-run
  record.
stages.0.objectives.0.text: 'Nonempty evidence on the workstation: `repair.log`.'
stages.0.objectives.1.text: The workstation `second.log` reports `changed=0`, `unreachable=0`, `failed=0`
  for `app1`, `app2`, `app3`.
stages.0.objectives.2.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/config` has mode
  `0755`.
stages.0.objectives.3.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` and `/srv/site/config/route`
  have mode `0644`.
stages.0.objectives.4.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` contains
  `north-79`.
stages.0.objectives.5.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/config/route` contains
  `route=north`.
stages.0.objectives.6.text: HTTP on port `8080` returns `north-79` on every managed host (`app1`, `app2`,
  `app3`).
hints.0.text: A fleet can start from different valid and invalid partial states.
hints.1.text: |-
  Declare directories before files, and keep the reload tied to actual banner changes.

  Inspect the inventory and the supplied playbook on the workstation:

  ```sh
  ansible-inventory -i inventory.ini --graph
  cat rollout.yml
  ```
hints.2.text: |-
  Verify the result from `~/quest` on the workstation:

  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'cat /srv/site/message /srv/site/config/route; ls -ld /srv/site/config; ls -l /srv/site/message /srv/site/config/route'` — Each host shows `north-79`, `route=north`, directory permissions `drwxr-xr-x` and file permissions `-rw-r--r--`.
  - `cat ~/quest/repair.log ~/quest/second.log` — The repair record is nonempty; `second.log` reports `changed=0`, `unreachable=0`, `failed=0` for all three hosts.
  - `for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done` — Shows `north-79` from `app1`, `app2`, `app3`.
phrases.0: I recovered hosts with different partial configurations.
phrases.1: I verified handler-driven service reloads.
phrases.2: I proved idempotence with a second run and actual managed state.
