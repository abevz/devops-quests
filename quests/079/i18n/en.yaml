title: Fleet recovery
brief: 'In `~/quest`, read `inventory.ini`, `ansible.cfg` and `rollout.yml`. The three fleet hosts start in different states. An idempotent play changes nothing on a repeat run. The supplied `Reload banner` handler uses the bay-specific `dq-service reload` adapter.


  Use one play targeting `fleet` and three unconditional file/copy tasks: directory `/srv/site/config` mode `0755`, banner `/srv/site/message` mode `0644` with `north-79` and a newline, and route `/srv/site/config/route` mode `0644` with `route=north` and a newline. Create the directory before its route file and notify `Reload banner` when the banner changes. The `file`/`copy` aliases, equivalent octal mode spellings, a one-item notify list and different safe ordering are accepted. Keep the listed module arguments only, the handler command `dq-service reload`, and omit play `pre_tasks`, `post_tasks`, `roles`, `check_mode`, `changed_when` and task `when`, `check_mode`, `changed_when`: these boundaries ensure the assessed tasks run on every host without hiding changes or adding unchecked operations.


  Run the play into `repair.log` and again into `second.log`. The first log must be nonempty; each app1/app2/app3 recap in the second must show `changed=0`, `unreachable=0`, `failed=0` in that order. Each host must have the stated file contents and modes, and HTTP port 8080 must return `north-79`. Logs are inspected as files and do not prove when the runs occurred. Work only in the offline bay.


  The play may use only `name`, `hosts`, `gather_facts`, `handlers` and `tasks`; each task may use `name`, one file/copy module and `notify` only for the banner. Use exactly one handler with only its `name` and `command` (or `ansible.builtin.command`). This excludes unchecked actions.'
debrief: The playbook, recorded recaps and live fleet conditions matched the checks.
stages.0.brief: The bounded playbook, log recaps, three hosts’ file contents and modes, and HTTP responses match the brief.
stages.0.objectives.0.text: The bounded playbook, log recaps, three hosts’ file contents and modes, and HTTP responses match the brief.
hints.0.text: A fleet can start from different valid and invalid partial states.
hints.1.text: Declare directories before files, and keep the reload tied to actual
  banner changes.
hints.2.text: Repair permissions, run twice and verify the second recap plus all HTTP
  endpoints.
phrases.0: I recovered hosts with different partial configurations.
phrases.1: I verified handler-driven service reloads.
phrases.2: I proved idempotence with a second run and actual managed state.
