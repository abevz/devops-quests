title: Восстановление fleet
brief: "Флот начинает с разных частичных состояний и должен обеспечить единый результат работы сервиса.\n\nРаботайте\
  \ на workstation в `~/quest` с файлами `inventory.ini`, `ansible.cfg`, `rollout.yml`. Дополнительные файлы на\
  \ рабочей станции в `~/quest`: `caller-contract.json`, `caller-cache.py`.\n\n**Требования:**\n- Свидетельства\
  \ на workstation:\n  - Непустой файл: `~/quest/repair.log`.\n  - `~/quest/second.log`: сводки для `app1`, `app2`,\
  \ `app3` показывают `changed=0`, `unreachable=0`, `failed=0`.\n- Каталог на каждом управляемом хосте (`app1`,\
  \ `app2`, `app3`):\n  - Путь: `/srv/site/config`.\n  - Режим доступа: `0755`.\n- Файлы на каждом управляемом хосте\
  \ (`app1`, `app2`, `app3`):\n  - `/srv/site/message`: `north-79`.\n  - `/srv/site/config/route`: `route=north`.\n\
  \  - Режим доступа: `0644`.\n- Живой сервис на каждом управляемом хосте (`app1`, `app2`, `app3`):\n  - HTTP: `8080`,\
  \ `/`.\n  - Ответ: `north-79`.\n- Текущий `rollout.yml` также выполняет `caller-contract.json`: восстанавливает\
  \ смешанное состояние вызывающей стороны, сохраняет остальные её данные и не меняет результаты приложения при\
  \ повторном применении с `changed=0`, `unreachable=0`, `failed=0`.\n\nЖурналы проверяются как файлы; они не доказывают,\
  \ когда происходили запуски."
debrief: Вы построили восстановление файлов, маршрута и работающего сервиса, сохранили исправные условия и подтвердили
  сходимость для парка и вызывающей стороны.
stages.0.brief: Каждый управляемый хост должен прийти к требуемому состоянию сервиса с чистой записью повторного
  запуска.
stages.0.objectives.0.text: 'Непустые свидетельства на workstation: `repair.log`.'
stages.0.objectives.1.text: Файл `second.log` на workstation сообщает `changed=0`, `unreachable=0`, `failed=0` для
  `app1`, `app2`, `app3`. Текущая программа также восстанавливает заданное состояние вызывающей стороны и сходится
  при повторном применении без изменения сохранённых данных и результатов приложения.
stages.0.objectives.2.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) путь `/srv/site/config` имеет режим
  `0755`.
stages.0.objectives.3.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файлы `/srv/site/message` и `/srv/site/config/route`
  имеют режим `0644`.
stages.0.objectives.4.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/message` содержит
  `north-79`.
stages.0.objectives.5.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/config/route` содержит
  `route=north`.
stages.0.objectives.6.text: HTTP на порту `8080` возвращает `north-79` на каждом управляемом хосте (`app1`, `app2`,
  `app3`).
hints.0.text: У файлов и кешей работающих сервисов отдельное состояние. Восстановление должно довести работающий
  сервис до нужного результата, сохранив исправные данные.
hints.1.text: |-
  Сопоставьте `rollout.yml`, `caller-contract.json` и `caller-cache.py`. На управляемых узлах сравните доставленные файлы, права, данные маршрута и реальные HTTP-ответы. Проследите, какие задачи сообщат об изменении до запуска уведомления.

  Найдите задачи для каталога, сообщения и маршрута. Сопоставьте их результаты изменений с ответом потребителя, включая хост, где файл сообщения уже правильный, а кэш устарел.

  ```sh
  cat rollout.yml
  cat caller-contract.json
  cat caller-cache.py
  ```
hints.2.text: |-
  Выполните `ansible-playbook rollout.yml > repair.log`, повторите с записью в `second.log`: на втором запуске каждый узел должен показать `changed=0`, `unreachable=0`, `failed=0`. Проверьте `/srv/site/message`, `/srv/site/config/route`, права и HTTP на `8080`. Проверка вызывающей стороны также сравнивает реальные результаты до и после повторного применения.

  У каталога конфигурации должен быть режим `755`, у обоих файлов — `644`. На каждом хосте ожидаются сообщение и HTTP-ответ `north-79` и маршрут `route=north`. Повторите наблюдения после прогона без изменений.

  ```sh
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    printf "%s\n" "$host"
    ssh -n -o BatchMode=yes -p 2222 "root@$host" 'stat -c "%a %n" /srv/site/config /srv/site/message /srv/site/config/route; cat /srv/site/message /srv/site/config/route'
    curl -fsS --max-time 3 "http://$host:8080/"
    printf '\n'
  done
  ```
phrases.0: Я восстановил цели с разной частичной конфигурацией.
phrases.1: Я проверил reload сервисов через handlers.
phrases.2: Я подтвердил идемпотентность вторым запуском и фактическим состоянием.
diagnostics.repair: Вывод исправления могли не сохранить либо repair.log пуст; сохраните журнал. Это условие проверяет непустой файл, а не успешный recap в нём. [Причина и проверка](guides#guide=ansible-4&section=fleet-retain-nonempty-repair-log)
diagnostics.probe_0_1: Ранняя recap-проверка с лимитом 8s может оборваться без маркера либо caller-программа не запускается на импортах; отличайте их от именованных диагностик effects, observation и budget. [Причина и проверка](guides#guide=ansible-4&section=fleet-legacy-recap-timeout-and-caller-startup)
diagnostics.fleet_effects: Выданный пустой play, жёсткие входы или handler только от copy оставляют старый кэш при уже правильном файле; исправьте каталог caller и живой кэш, сохраните посторонние данные и получите второй apply без записей. [Причина и проверка](guides#guide=ansible-4&section=fleet-parameterized-repair-and-cache-convergence)
diagnostics.fleet_budget: Ansible может превысить оставшийся лимит 14s повтора caller; проверьте зависшие команды и настройку подключения до повторного исправления. [Причина и проверка](guides#guide=ansible-4&section=fleet-bounded-direct-caller-replay)
diagnostics.fleet_observation: Повтор caller может не запустить Ansible или не прочитать файлы/адаптер кэша; проверьте пути, права и ошибки выполнения перед поиском обычного несоответствия результата. [Причина и проверка](guides#guide=ansible-4&section=fleet-local-caller-observation-errors)
diagnostics.recap_1: app1 может продолжать изменения или reload при повторном apply либо его recap отсутствует; second.log требует changed=0, unreachable=0 и failed=0 для этого хоста. [Причина и проверка](guides#guide=ansible-4&section=fleet-host-1-converged-recap)
diagnostics.ssh_1: SSH к app1 либо удалённая проверка завершились без ожидаемого результата поля; проверьте связность и ошибки удалённой оболочки. Неожиданный непустой вывод сохраняется и также даёт этот fallback. [Причина и проверка](guides#guide=ansible-4&section=fleet-host-1-ssh-or-opaque-remote-failure)
diagnostics.host_1_dir_mode: Каталог конфигурации app1 может отсутствовать или сохранять неверный mode; создавайте /srv/site/config с mode 755, не полагаясь на umask. [Причина и проверка](guides#guide=ansible-4&section=fleet-host-1-configuration-directory-mode)
diagnostics.host_1_banner_mode: app1 /srv/site/message может отсутствовать или иметь права другой задачи; задайте mode 644 доставляемому файлу и проверьте удалённый результат. [Причина и проверка](guides#guide=ansible-4&section=fleet-host-1-banner-file-mode)
diagnostics.host_1_route_mode: app1 /srv/site/config/route может отсутствовать или иметь права другой задачи; задайте mode 644 доставляемому файлу и проверьте удалённый результат. [Причина и проверка](guides#guide=ansible-4&section=fleet-host-1-route-file-mode)
diagnostics.host_1_banner_content: app1 может получать другой захардкоженный текст или использовать иной путь; доставляйте expected_message в фактический /srv/site/message. [Причина и проверка](guides#guide=ansible-4&section=fleet-host-1-declared-message-value)
diagnostics.host_1_route_content: app1 может сохранять старый маршрут либо получить неверное значение; доставляйте expected_route через выданный файловый интерфейс /srv/site/config/route. [Причина и проверка](guides#guide=ansible-4&section=fleet-host-1-declared-route-value)
diagnostics.http_1: app1 может выдавать старый кэш при уже правильном файле; наблюдайте живой HTTP и делайте reload при отличии, даже когда copy не меняет файл. Ошибки транспорта также нарушают запрос. [Причина и проверка](guides#guide=ansible-4&section=fleet-host-1-live-cache-with-unchanged-file)
diagnostics.recap_2: app2 может продолжать изменения или reload при повторном apply либо его recap отсутствует; second.log требует changed=0, unreachable=0 и failed=0 для этого хоста. [Причина и проверка](guides#guide=ansible-4&section=fleet-host-2-converged-recap)
