title: Восстановление fleet
brief: "Флот начинает с разных частичных состояний и должен обеспечить единый результат работы сервиса.\n\nРаботайте\
  \ на workstation в `~/quest` с файлами `inventory.ini`, `ansible.cfg`, `rollout.yml`. Дополнительные файлы на\
  \ рабочей станции в `~/quest`: `caller-contract.json`, `caller-cache.py`.\n\n**Требования:**\n- Свидетельства\
  \ на workstation:\n  - Непустой файл: `~/quest/repair.log`.\n  - `~/quest/second.log`: сводки для `app1`, `app2`,\
  \ `app3` показывают `changed=0`, `unreachable=0`, `failed=0`.\n- Каталог на каждом управляемом хосте (`app1`,\
  \ `app2`, `app3`):\n  - Путь: `/srv/site/config`.\n  - Режим доступа: `0755`.\n- Файлы на каждом управляемом хосте\
  \ (`app1`, `app2`, `app3`):\n  - `/srv/site/message`: `north-79`.\n  - `/srv/site/config/route`: `route=north`.\n\
  \  - Режим доступа: `0644`.\n- Живой сервис на каждом управляемом хосте (`app1`, `app2`, `app3`):\n  - HTTP: `8080`,\
  \ `/`.\n  - Ответ: `north-79`.\n- Текущий `rollout.yml` также выполняет `caller-contract.json`: восстанавливает\
  \ смешанное состояние вызывающей стороны, сохраняет остальные её данные и не меняет результаты приложения при\
  \ повторном применении с `changed=0`, `unreachable=0`, `failed=0`.\n\nЖурналы проверяются как файлы; они не доказывают,\
  \ когда происходили запуски."
debrief: Вы построили восстановление файлов, маршрута и работающего сервиса, сохранили исправные условия и подтвердили
  сходимость для парка и вызывающей стороны.
stages.0.brief: Каждый управляемый хост должен прийти к требуемому состоянию сервиса с чистой записью повторного
  запуска.
stages.0.objectives.0.text: 'Непустые свидетельства на workstation: `repair.log`.'
stages.0.objectives.1.text: Файл `second.log` на workstation сообщает `changed=0`, `unreachable=0`, `failed=0` для
  `app1`, `app2`, `app3`. Текущая программа также восстанавливает заданное состояние вызывающей стороны и сходится
  при повторном применении без изменения сохранённых данных и результатов приложения.
stages.0.objectives.2.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) путь `/srv/site/config` имеет режим
  `0755`.
stages.0.objectives.3.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файлы `/srv/site/message` и `/srv/site/config/route`
  имеют режим `0644`.
stages.0.objectives.4.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/message` содержит
  `north-79`.
stages.0.objectives.5.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/config/route` содержит
  `route=north`.
stages.0.objectives.6.text: HTTP на порту `8080` возвращает `north-79` на каждом управляемом хосте (`app1`, `app2`,
  `app3`).
hints.0.text: У файлов и кешей работающих сервисов отдельное состояние. Восстановление должно довести работающий
  сервис до нужного результата, сохранив исправные данные.
hints.1.text: Сопоставьте `rollout.yml`, `caller-contract.json` и `caller-cache.py`. На управляемых узлах сравните
  доставленные файлы, права, данные маршрута и реальные HTTP-ответы. Проследите, какие задачи сообщат об изменении
  до запуска уведомления.
hints.2.text: 'Постройте доставку каталогов и файлов на предоставленных входах, затем наблюдайте реальный потребитель
  и обновляйте устаревшее состояние. Выполните `ansible-playbook rollout.yml > repair.log`, повторите с записью
  в `second.log`: на втором запуске каждый узел должен показать `changed=0`, `unreachable=0`, `failed=0`. Проверьте
  `/srv/site/message`, `/srv/site/config/route`, права и HTTP на `8080`. Проверка вызывающей стороны также сравнивает
  реальные результаты до и после повторного применения.'
phrases.0: Я восстановил цели с разной частичной конфигурацией.
phrases.1: Я проверил reload сервисов через handlers.
phrases.2: Я подтвердил идемпотентность вторым запуском и фактическим состоянием.
