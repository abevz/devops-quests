title: Восстановление fleet
brief: 'В `~/quest` изучите `inventory.ini`, `ansible.cfg` и `rollout.yml`. Три узла флота начинают с разных состояний. Идемпотентный play при повторном запуске ничего не меняет. Выданный обработчик `Reload banner` использует адаптер песочницы `dq-service reload`.


  Используйте один play для `fleet` и три безусловные задачи file/copy: каталог `/srv/site/config` с режимом `0755`, баннер `/srv/site/message` с режимом `0644` и содержимым `north-79` с переводом строки, а также маршрут `/srv/site/config/route` с режимом `0644` и содержимым `route=north` с переводом строки. Создайте каталог до файла маршрута и уведомляйте `Reload banner` при изменении баннера. Допускаются алиасы `file`/`copy`, равнозначные восьмеричные записи режимов, список notify из одного элемента и другой безопасный порядок. Оставьте только перечисленные аргументы модулей и команду обработчика `dq-service reload`; исключите из play `pre_tasks`, `post_tasks`, `roles`, `check_mode`, `changed_when`, а из задач `when`, `check_mode`, `changed_when`: эти границы обеспечивают выполнение проверяемых задач на всех узлах без сокрытия изменений и непроверяемых дополнительных операций.


  Запустите play в `repair.log`, затем повторно в `second.log`. Первый журнал должен быть непустым; в каждой сводке app1/app2/app3 второго должны быть `changed=0`, `unreachable=0`, `failed=0` в этом порядке. На каждом узле должны быть указанные содержимое и режимы файлов, а HTTP на порту 8080 должен вернуть `north-79`. Проверка читает журналы как файлы и не доказывает время запусков. Работайте только в офлайн-песочнице.


  Play может использовать только `name`, `hosts`, `gather_facts`, `handlers` и `tasks`; каждая задача может использовать `name`, один модуль file/copy и `notify` только для баннера. Используйте ровно один обработчик только с `name` и `command` (или `ansible.builtin.command`). Это исключает непроверяемые действия.'
debrief: Playbook, записанные сводки и текущее состояние флота соответствовали проверкам.
stages.0.brief: Ограниченный playbook, сводки журналов, содержимое и режимы файлов трёх узлов и ответы HTTP соответствуют заданию.
stages.0.objectives.0.text: Ограниченный playbook, сводки журналов, содержимое и режимы файлов трёх узлов и ответы HTTP соответствуют заданию.
hints.0.text: Fleet может начинать с разных правильных и ошибочных частичных состояний.
hints.1.text: Описывайте каталоги до файлов, связывайте reload с реальным изменением
  banner.
hints.2.text: Исправьте права, выполните два запуска, проверьте второй recap и все
  HTTP endpoints.
phrases.0: Я восстановил цели с разной частичной конфигурацией.
phrases.1: Я проверил reload сервисов через handlers.
phrases.2: Я подтвердил идемпотентность вторым запуском и фактическим состоянием.
