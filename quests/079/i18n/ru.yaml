title: Восстановление fleet
brief: 'Fleet настроен частично: app1 имеет текущий banner, app2 — старый banner и directory с закрытыми
  правами, app3 — без каталога маршрута. Исправьте rollout.yml: directory 0755, banner 0644, route=north
  на всех целях. Сохраните handler reload процесса. Запишите первый запуск в repair.log, второй — в second.log;
  второй recap должен показать changed=0 на трёх целях. Проверьте файлы и HTTP, а не только успешный recap.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `inventory.ini`, `ansible.cfg`, `rollout.yml`,
  `repair.log`, `second.log`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Три цели имеют нужный directory, права и route; HTTP возвращает north-79, второй
  запуск ничего не меняет.'
debrief: Декларативное исправление согласовало разные частичные состояния и подтвердило повторяемость
  вторым запуском.
stages.0.brief: 'Три цели имеют нужный directory, права и route; HTTP возвращает north-79, второй запуск
  ничего не меняет.


  Результат проверки: Три цели имеют нужный directory, права и route; HTTP возвращает north-79, второй
  запуск ничего не меняет.'
stages.0.objectives.0.text: Три цели имеют нужный directory, права и route; HTTP возвращает north-79,
  второй запуск ничего не меняет.
hints.0.text: Fleet может начинать с разных правильных и ошибочных частичных состояний.
hints.1.text: Описывайте каталоги до файлов, связывайте reload с реальным изменением banner.
hints.2.text: Исправьте права, выполните два запуска, проверьте второй recap и все HTTP endpoints.
phrases.0: Я восстановил цели с разной частичной конфигурацией.
phrases.1: Я проверил reload сервисов через handlers.
phrases.2: Я подтвердил идемпотентность вторым запуском и фактическим состоянием.
