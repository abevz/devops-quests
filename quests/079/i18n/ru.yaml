title: Восстановление fleet
brief: |-
  Флот начинает с разных частичных состояний и должен обеспечить единый результат работы сервиса.

  Работайте на workstation в `~/quest` с файлами `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Требования:**
  - Свидетельства на workstation:
    - Непустой файл: `~/quest/repair.log`.
    - `~/quest/second.log`: сводки для `app1`, `app2`, `app3` показывают `changed=0`, `unreachable=0`, `failed=0`.
  - Каталог на каждом управляемом хосте (`app1`, `app2`, `app3`):
    - Путь: `/srv/site/config`.
    - Режим доступа: `0755`.
  - Файлы на каждом управляемом хосте (`app1`, `app2`, `app3`):
    - `/srv/site/message`: `north-79`.
    - `/srv/site/config/route`: `route=north`.
    - Режим доступа: `0644`.
  - Живой сервис на каждом управляемом хосте (`app1`, `app2`, `app3`):
    - HTTP: `8080`, `/`.
    - Ответ: `north-79`.

  Журналы проверяются как файлы; они не доказывают, когда происходили запуски.
debrief: Playbook, записанные сводки и текущее состояние флота соответствовали проверкам.
stages.0.brief: Каждый управляемый хост должен прийти к требуемому состоянию сервиса с чистой записью
  повторного запуска.
stages.0.objectives.0.text: 'Непустые свидетельства на workstation: `repair.log`.'
stages.0.objectives.1.text: Файл `second.log` на workstation сообщает `changed=0`, `unreachable=0`, `failed=0`
  для `app1`, `app2`, `app3`.
stages.0.objectives.2.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) путь `/srv/site/config`
  имеет режим `0755`.
stages.0.objectives.3.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файлы `/srv/site/message`
  и `/srv/site/config/route` имеют режим `0644`.
stages.0.objectives.4.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/message`
  содержит `north-79`.
stages.0.objectives.5.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/config/route`
  содержит `route=north`.
stages.0.objectives.6.text: HTTP на порту `8080` возвращает `north-79` на каждом управляемом хосте (`app1`,
  `app2`, `app3`).
hints.0.text: Fleet может начинать с разных правильных и ошибочных частичных состояний.
hints.1.text: |-
  Описывайте каталоги до файлов, связывайте reload с реальным изменением banner.

  Изучите inventory и предоставленный плейбук на workstation:

  ```sh
  ansible-inventory -i inventory.ini --graph
  cat rollout.yml
  ```
hints.2.text: |-
  Проверьте результат из `~/quest` на workstation:

  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'cat /srv/site/message /srv/site/config/route; ls -ld /srv/site/config; ls -l /srv/site/message /srv/site/config/route'` — Каждый хост показывает `north-79`, `route=north`, права каталога `drwxr-xr-x` и права файлов `-rw-r--r--`.
  - `cat ~/quest/repair.log ~/quest/second.log` — Журнал восстановления непуст; `second.log` сообщает `changed=0`, `unreachable=0`, `failed=0` для всех трёх хостов.
  - `for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done` — Показывает `north-79` от `app1`, `app2`, `app3`.
phrases.0: Я восстановил цели с разной частичной конфигурацией.
phrases.1: Я проверил reload сервисов через handlers.
phrases.2: Я подтвердил идемпотентность вторым запуском и фактическим состоянием.
