title: Восстановление fleet
brief: |-
  Флот начинает с разных частичных состояний и должен обеспечить единый результат работы сервиса.

  Работайте на workstation в `~/quest` с файлами `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Требования:**
  - Свидетельства на workstation:
    - Непустой файл: `~/quest/repair.log`.
    - `~/quest/second.log`: сводки для `app1`, `app2`, `app3` показывают `changed=0`, `unreachable=0`, `failed=0`.
  - Каталог на каждом управляемом хосте (`app1`, `app2`, `app3`):
    - Путь: `/srv/site/config`.
    - Режим доступа: `0755`.
  - Файлы на каждом управляемом хосте (`app1`, `app2`, `app3`):
    - `/srv/site/message`: `north-79`.
    - `/srv/site/config/route`: `route=north`.
    - Режим доступа: `0644`.
  - Живой сервис на каждом управляемом хосте (`app1`, `app2`, `app3`):
    - HTTP: `8080`, `/`.
    - Ответ: `north-79`.

  Журналы проверяются как файлы; они не доказывают, когда происходили запуски.
debrief: Playbook, записанные сводки и текущее состояние флота соответствовали проверкам.
stages.0.brief: Каждый управляемый хост должен прийти к требуемому состоянию сервиса с чистой записью
  повторного запуска.
stages.0.objectives.0.text: 'Непустые свидетельства на workstation: `repair.log`.'
stages.0.objectives.1.text: Файл `second.log` на workstation сообщает `changed=0`, `unreachable=0`, `failed=0`
  для `app1`, `app2`, `app3`.
stages.0.objectives.2.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) путь `/srv/site/config`
  имеет режим `0755`.
stages.0.objectives.3.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файлы `/srv/site/message`
  и `/srv/site/config/route` имеют режим `0644`.
stages.0.objectives.4.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/message`
  содержит `north-79`.
stages.0.objectives.5.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/config/route`
  содержит `route=north`.
stages.0.objectives.6.text: HTTP на порту `8080` возвращает `north-79` на каждом управляемом хосте (`app1`,
  `app2`, `app3`).
hints.0.text: Fleet может начинать с разных правильных и ошибочных частичных состояний.
hints.1.text: |-
  Описывайте каталоги до файлов, связывайте reload с реальным изменением banner.

  Изучите inventory и предоставленный плейбук на workstation:

  ```sh
  ansible-inventory -i inventory.ini --graph
  cat rollout.yml
  ```
hints.2.text: |-
  Исправьте права, выполните два запуска, проверьте второй recap и все HTTP endpoints. Сохранённые границы исходника: один play `fleet` только с `name`, `hosts`, `gather_facts`, `handlers`, `tasks`; три безусловные задачи file/copy только с `name`, одним модулем и `notify` лишь у баннера. Аргументы каталога — в точности `path`, `state`, `mode`; аргументы copy — в точности `dest`, `content`, `mode`. Создайте каталог до файла маршрута; содержимое сообщения и маршрута включает перевод строки. Только баннер уведомляет `Reload banner`. Сохраните один обработчик только с `name` и одним модулем command, выполняющим `dq-service reload`. Допустимы псевдонимы file/copy, равнозначные восьмеричные записи и список notify из одного элемента. Сохраните настоящие запуски через `ansible-playbook rollout.yml > repair.log` и `ansible-playbook rollout.yml > second.log`.

  Проверьте результат из `~/quest` на workstation:

  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'cat /srv/site/message /srv/site/config/route; ls -ld /srv/site/config; ls -l /srv/site/message /srv/site/config/route'` — Каждый хост показывает `north-79`, `route=north`, права каталога `drwxr-xr-x` и права файлов `-rw-r--r--`.
  - `cat ~/quest/repair.log ~/quest/second.log` — Журнал восстановления непуст; `second.log` сообщает `changed=0`, `unreachable=0`, `failed=0` для всех трёх хостов.
  - `for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done` — Показывает `north-79` от `app1`, `app2`, `app3`.
phrases.0: Я восстановил цели с разной частичной конфигурацией.
phrases.1: Я проверил reload сервисов через handlers.
phrases.2: Я подтвердил идемпотентность вторым запуском и фактическим состоянием.
diagnostics.hosts: Поле hosts в play файла rollout.yml должно быть fleet.
diagnostics.play_keys: Play в rollout.yml может использовать только name, hosts, gather_facts, handlers
  и tasks.
diagnostics.tasks: rollout.yml должен содержать ровно три задачи.
diagnostics.controls: Задача не должна задавать changed_when, check_mode или when.
diagnostics.keys: Задача может использовать только name, notify и модуль file или copy.
diagnostics.module: У каждой задачи должен быть ровно один модуль file или copy с отображением аргументов.
diagnostics.duplicate: Задачи rollout.yml не должны повторять путь назначения.
diagnostics.notify_scope: Только задача баннера может задавать notify.
diagnostics.dir_state: State задачи file для /srv/site/config должен быть directory.
diagnostics.dir_args: Задача file для /srv/site/config должна использовать только аргументы path, state
  и mode.
diagnostics.notify: Notify задачи баннера должен указывать Reload banner.
diagnostics.order: Задача /srv/site/config должна предшествовать /srv/site/config/route.
diagnostics.handler: В rollout.yml должен быть ровно один handler с именем Reload banner.
diagnostics.command: Handler должен использовать только имя и один модуль command со значением dq-service
  reload.
diagnostics.invalid: rollout.yml должен содержать один читаемый play с требуемой структурой.
diagnostics.repair: repair.log должен быть непустым.
diagnostics.path_dir: rollout.yml должен содержать задачу для /srv/site/config.
diagnostics.path_module_dir: Задача /srv/site/config должна использовать модуль file.
diagnostics.path_mode_dir: Права задачи /srv/site/config должны быть 0755.
diagnostics.path_banner: rollout.yml должен содержать задачу для /srv/site/message.
diagnostics.path_module_banner: Задача /srv/site/message должна использовать модуль copy.
diagnostics.path_mode_banner: Права задачи /srv/site/message должны быть 0644.
diagnostics.path_content_banner: Содержимым задачи /srv/site/message должно быть north-79 с одним символом
  новой строки после него.
diagnostics.path_args_banner: Задача copy для /srv/site/message должна использовать только dest, content
  и mode.
diagnostics.path_route: rollout.yml должен содержать задачу для /srv/site/config/route.
diagnostics.path_module_route: Задача /srv/site/config/route должна использовать модуль copy.
diagnostics.path_mode_route: Права задачи /srv/site/config/route должны быть 0644.
diagnostics.path_content_route: Содержимым задачи /srv/site/config/route должно быть route=north с одним
  символом новой строки после него.
diagnostics.path_args_route: Задача copy для /srv/site/config/route должна использовать только dest, content
  и mode.
