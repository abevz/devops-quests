hints.0.text: Recupere el registry endpoint antes de iniciar consumers que necesita pull.
hints.1.text: Escriba sólo la acción inicial documentada; el agente apunta a un contenedor de juego fijo.
hints.2.text: Primero verifique TLS y la autenticación, luego restaure una réplica de board y verifique
