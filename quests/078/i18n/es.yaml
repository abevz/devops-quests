title: Disponibilidad de registro
brief: 'El servicio privado de imágenes y su carga no están disponibles. Recupera el registry y después el consumo
  privado sin cambiar artefacto, controlador, programa ni identidad de credenciales.


  Trabaja en `~/quest`. Los registros de fuente identifican la autoridad y publicación originales; las copias congeladas
  en `/run/dq/facts/0/` siguen siendo autoritativas. Conserva identidades, programas, límites de acceso y confianza
  TLS. No imprimas credenciales; no sustituyas la fuente protegida.


  Entradas: `platform.env`, `registry-ca.crt`, `board.yaml`, `registry-target.json`, `registry-source.json` y `registry-consumer.json`.
  El control limitado está en `control/README.md`. Conserva la identidad del objeto de credenciales existente. La
  disponibilidad actual no demuestra recuperación tras pérdida de almacenamiento.


  **Requisitos:**


  - Etapa 1: El endpoint del registro suministrado acepta una lectura autenticada de `/v2/` mediante TLS verificado.

  - Etapa 2: La autoridad y CA originales siguen válidas; el Secret de extracción original contiene las credenciales
  privadas suministradas.

  - Etapa 2: El Deployment `board` y un contenedor listo en un Pod activo usan la imagen privada inmutable existente
  de la versión, con política de descarga `Always`.

  - Etapa 2: El Deployment original conserva la especificación, tiene `1` réplica y completa el despliegue con un
  pod activo propio, digest aprobado, `Always` y Secret original.

  - Etapa 2: Dentro de un Pod del Deployment `board`, `http://127.0.0.1:8080` devuelve `north-78`.'
debrief: Se conservaron identidades originales de fuentes y consumidores; la versión aprobada se verificó en cada
  límite afectado.
stages.0.brief: Recupera el acceso autenticado al registro privado existente.
stages.1.brief: El servicio privado de imágenes y su carga no están disponibles. Recupera el registry y después
  el consumo privado sin cambiar artefacto, controlador, programa ni identidad de credenciales.
hints.0.text: Disponibilidad, confianza TLS y autenticación de kubelet son límites distintos.
hints.1.text: 'Inspecciona recibo de control, contrato, Deployment y metadatos del Secret. Tras un intento de extracción,
  los eventos distinguen transporte y autorización.


  ```bash

  cat registry-agent-status.json registry-source.json

  kubectl describe deployment board

  kubectl get secret -o custom-columns=NAME:.metadata.name,TYPE:.type

  kubectl get events --sort-by=.lastTimestamp

  ```'
hints.2.text: "Primero verifique TLS y la autenticación, luego restaure una réplica de board y verifique su digest\
  \ y HTTP. Escribe exactamente `{\"action\":\"start\"}` en `registry-repair.json`. La siguiente consulta de objetivos\
  \ inicia solo el registro sin cambios de esta instalación; se rechazan otras acciones y campos adicionales. El\
  \ Secret de descarga suministrado es `registry-pull`. Escriba sólo la acción inicial documentada; el agente apunta\
  \ a un contenedor de juego fijo.\n\nVerifica desde `~/quest` en la workstation:\n\n- `source platform.env`\n-\
  \ `curl -fsS --cacert registry-ca.crt --config <(printf 'user = \"%s:%s\"\\n' \"$REGISTRY_USER\" \"$REGISTRY_PASSWORD\"\
  ) \"https://$(jq -r .endpoint /run/dq/facts/0/registry-target.json)/v2/\"`\n\nEtapa 1: Respuesta TLS autenticada:\
  \ `{}`.\n\n- `kubectl get deployment board -o json | jq '{replicas:.spec.replicas, ready:.status.readyReplicas,worker:(.spec.template.spec.containers[]|select(.name==\"\
  worker\")|{image,imagePullPolicy})}'`\n\nEtapa 2: `replicas: 1`, `ready: 1`. La imagen coincide con la versión\
  \ congelada y la política de descarga es `Always`.\n\n- `kubectl exec deployment/board -c worker -- wget -qO-\
  \ -T 3 http://127.0.0.1:8080`\n\nEtapa 2: `north-78`.\n\nLa lectura autenticada del workstation no actualiza el\
  \ Secret de kubelet. Construye una actualización del Secret existente con la identidad privada original, conserva\
  \ UID y después inicia el único worker aprobado. Conserva digest y Always; no evites autenticación ni sustituyas\
  \ controlador.\n\n```bash\nset -euo pipefail\ncd ~/quest\nsource platform.env\npython3 -I - <<'VERIFY_RELEASE'\n\
  \nimport base64,hashlib,json,os,ssl,urllib.request\nfrom pathlib import Path\nsource=json.loads(Path('/run/dq/facts/0/registry-source.json').read_text())\n\
  assert os.environ['REGISTRY']==source['endpoint']\nassert os.environ['REGISTRY_USER']==source['username']\nassert\
  \ hashlib.sha256(os.environ['REGISTRY_PASSWORD'].encode()).hexdigest()==source['password_sha256']\nassert hashlib.sha256(Path('registry-ca.crt').read_bytes()).hexdigest()==source['ca_sha256']\n\
  class NoRedirect(urllib.request.HTTPRedirectHandler):\n def redirect_request(self,*args,**kwargs):\n  return None\n\
  opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect(),\nurllib.request.HTTPSHandler(context=ssl.create_default_context(cafile='registry-ca.crt')))\n\
  headers={'Authorization':'Basic '+base64.b64encode((source['username']+':'+os.environ['REGISTRY_PASSWORD']).encode()).decode(),\n\
  'Accept':'application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json'}\n\
  def manifest(reference):\n request=urllib.request.Request('https://'+source['endpoint']+'/v2/parcel/manifests/'+reference,headers=headers)\n\
  \ with opener.open(request,timeout=2) as response:\n  body=response.read(2097153)\n  assert len(body)<=2097152\n\
  \  digest='sha256:'+hashlib.sha256(body).hexdigest()\n  assert response.headers.get('Docker-Content-Digest')==digest\n\
  \  return digest\n\nfrom dq_check import registry_credentials\nimport subprocess\ncontract=json.loads(Path('/run/dq/facts/0/registry-consumer.json').read_text())\n\
  target=json.loads(Path('/run/dq/facts/0/registry-target.json').read_text())\nassert manifest(target['image'].split('@',1)[1])==target['image'].split('@',1)[1]\n\
  secret=json.loads(subprocess.check_output(['kubectl','get','secret',contract['secret_name'],'-o','json'],timeout=2))\n\
  assert secret['metadata']['uid']==contract['secret_uid']\nassert registry_credentials(secret,source['endpoint'],source['username'],os.environ['REGISTRY_PASSWORD'])\n\
  \n\nimport json,subprocess\nfrom pathlib import Path\nfrom dq_check import current_pods,pod_worker,ready_image,workload_worker,pull_secret_names\n\
  def k(*args):\n return json.loads(subprocess.check_output(['kubectl',*args,'-o','json'],timeout=2))\ncontract=json.loads(Path('/run/dq/facts/0/registry-consumer.json').read_text())\n\
  old=contract['deployment']\ndeployment=k('get','deployment','board')\nassert deployment['metadata']['uid']==old['metadata']['uid']\n\
  assert deployment['spec']['selector']==old['spec']['selector']\nassert deployment['spec']['template']['spec']==old['spec']['template']['spec']\n\
  worker=workload_worker(deployment)\nactive=current_pods(deployment,k('get','replicasets'),k('get','pods'))\nassert\
  \ len(active)==1\nfor pod in active:\n assert ready_image(pod,worker['image'])\n assert pod_worker(pod).get('imagePullPolicy')=='Always'\n\
  \ assert pull_secret_names(pod)=={contract['secret_name']}\n assert pod_worker(pod).get('command')==worker.get('command')\n\
  \ assert pod_worker(pod).get('args')==worker.get('args')\n\nprint('OK')\nVERIFY_RELEASE\n```\n\nEsperado: OK.\
  \ No se muestran credenciales."
phrases.0: Restauré el servicio de imágenes antes de reiniciar su consumers.
phrases.1: Utilicé una recuperación de alcance limitado control sin acceso al host.
phrases.2: Verifiqué registry TLS, imagen identity y aplicación HTTP por separado.
stages.0.objectives.0.text: El endpoint del registro suministrado acepta una lectura autenticada de `/v2/` mediante
  TLS verificado.
stages.1.objectives.0.text: La autoridad y CA originales siguen válidas; el Secret de extracción original contiene
  las credenciales privadas suministradas.
stages.1.objectives.1.text: El Deployment `board` y un contenedor listo en un Pod activo usan la imagen privada
  inmutable existente de la versión, con política de descarga `Always`.
stages.1.objectives.2.text: El Deployment original conserva la especificación, tiene `1` réplica y completa el despliegue
  con un pod activo propio, digest aprobado, `Always` y Secret original.
stages.1.objectives.3.text: Dentro de un Pod del Deployment `board`, `http://127.0.0.1:8080` devuelve `north-78`.
guides.reference_1: Referencia de API y diagnóstico
guides.reference_2: Referencia de publicación y consumidores
diagnostics.registry_start: El registry original está detenido; presente solicitud action:start admitida y deje que sondeo la procese. Solicitud ausente/inválida, confianza TLS o autenticación fallidas mantienen HTTPS API original inaccesible. [Causa y comprobación](guides#guide=gitops-delivery&section=private-registry-original-start-interface)
diagnostics.probe_1_0: El pull Secret suministrado contiene password retirado; repare credentials sin recrear UID, conservando registry credentials y CA originales. Image no listo, fuente/trust cambiados, fallo de manifiesto u observación también dan fallback. [Causa y comprobación](guides#guide=gitops-delivery&section=private-registry-original-authority-and-pull-credential)
diagnostics.registry_pull_policy: Image declarado, política Always o referencia registry-pull pueden diferir, o ningún Pod listo informa digest esperado; conserve pull policy suministrada y verifique image vivo. [Causa y comprobación](guides#guide=gitops-delivery&section=private-registry-declared-always-pull-and-ready-digest)
diagnostics.probe_1_2: Deployment inicia con cero réplicas; escale controller original a una tras reparar Secret. UID/template cambiados, Pod propio no listo o adicional, referencia pull errónea o fallos rollout/API también fallan. [Causa y comprobación](guides#guide=gitops-delivery&section=private-registry-original-controller-and-one-ready-consumer)
diagnostics.registry_http: El consumidor original puede seguir inaccesible tras image pull o devolver otra ruta; revise rollout y HTTP worker real en vez de solo disponibilidad registry. [Causa y comprobación](guides#guide=gitops-delivery&section=private-registry-running-consumer-response)
