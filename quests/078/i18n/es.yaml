title: Disponibilidad de registro
brief: 'El proceso desechable registry realmente se detuvo después de que se sembró su imagen. Consumers
  se mantienen deliberadamente en cero réplicas. Primero envíe registry-repair.json que contenga exactamente
  {"action":"start"}. El agente de la bahía, en la siguiente encuesta objetiva, sólo puede iniciar este
  registry propiedad de la instalación sin cambios; Se rechazan campos adicionales y otras acciones. Este
  juego restringido control no proporciona host Docker socket ni servicio general control. Verifique el
  TLS /v2/ autenticado antes de la etapa dos. Luego restaure el board en una réplica usando su imagen
  privada ya fijada y pull Secret. No hay ningún VM ni servicio en vivo involucrado.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `platform.env`, `registry-ca.crt`,
  `registry-target.json`, `registry-repair.json`, `registry-agent-status.json`, `registry-pull.json`,
  `board.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito inicial: la solicitud de inicio de registro fija es válida y se puede acceder al
  punto final registry /v2/ autenticado real con TLS verificado.'
debrief: El registry real se restauró antes de que se recuperara la imagen privada consumer.
