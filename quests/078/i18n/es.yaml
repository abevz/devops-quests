stages.1.objectives.2.text: El Deployment `board` tiene el número de réplicas `1` y completa su rollout.
stages.1.objectives.3.text: Dentro de un Pod del Deployment `board`, `http://127.0.0.1:8080` devuelve
  `north-78`.
