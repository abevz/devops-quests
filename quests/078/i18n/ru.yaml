  через TLS с проверкой сертификата.
stages.1.objectives.0.text: Предоставленный endpoint реестра принимает аутентифицированное чтение `/v2/`
  через TLS с проверкой сертификата.
stages.1.objectives.1.text: Deployment `board` и готовый контейнер в активном Pod используют существующий
  неизменяемый приватный образ релиза с политикой загрузки `Always`.
stages.1.objectives.2.text: Deployment `board` имеет число реплик `1` и завершает rollout.
