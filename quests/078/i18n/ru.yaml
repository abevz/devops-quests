guides.reference_1: Справочник API и диагностики
guides.reference_2: Справочник проверки публикации и потребителей
diagnostics.registry_start: Исходный registry остановлен; подайте поддерживаемый запрос action:start и дождитесь обработки при опросе целей. Отсутствие/неверная форма запроса, ошибка TLS-trust или авторизации оставляют исходный HTTPS API недоступным. [Причина и проверка](guides#guide=gitops-delivery&section=private-registry-original-start-interface)
diagnostics.probe_1_0: Выданный pull Secret содержит старый пароль; исправьте credentials без пересоздания UID, сохраняя исходные registry credentials и CA. Неготовый image, другой источник/trust, ошибка проверки манифеста или наблюдения также дают fallback. [Причина и проверка](guides#guide=gitops-delivery&section=private-registry-original-authority-and-pull-credential)
diagnostics.registry_pull_policy: Объявленный image, политика Always или ссылка registry-pull могут отличаться либо готовый Pod не сообщает ожидаемый digest; сохраните выданную pull policy и проверьте живой результат image. [Причина и проверка](guides#guide=gitops-delivery&section=private-registry-declared-always-pull-and-ready-digest)
diagnostics.probe_1_2: Deployment начинает с нуля реплик; масштабируйте исходный controller до одной после исправления Secret. Изменённые UID/template, неготовый или лишний принадлежащий Pod, другая pull-ссылка и ошибки rollout/API также нарушают проверку. [Причина и проверка](guides#guide=gitops-delivery&section=private-registry-original-controller-and-one-ready-consumer)
diagnostics.registry_http: Исходный потребитель может оставаться недоступным после image pull либо выдавать другой маршрут; проверьте rollout и реальный HTTP-ответ worker, а не только готовность registry. [Причина и проверка](guides#guide=gitops-delivery&section=private-registry-running-consumer-response)
