diagnostics.probe_1_0: Исходные учётные данные и CA registry должны соответствовать контракту; исправьте существующий
  pull Secret исходными учётными данными.
diagnostics.probe_1_2: Сохраните исходный Deployment и программу pod; единственный активный принадлежащий ему pod
  должен использовать утверждённый приватный digest, Always и исходный pull Secret.
