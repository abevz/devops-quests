title: Доступность реестра
brief: 'Одноразовый процесс registry действительно остановлен после загрузки образа.
  Consumers намеренно оставлены с нулём реплик. Сначала запишите registry-repair.json
  ровно с {"action":"start"}. При следующем опросе целей агент песочницы может запустить
  только этот неизменённый registry данной установки; лишние поля и другие действия
  отклоняются. Узкий игровой control не даёт host Docker socket и общего управления
  сервисами. Перед вторым этапом подтвердите TLS /v2/ с аутентификацией. Затем верните
  board одну реплику с уже закреплённым приватным образом и pull Secret. VM и живые
  сервисы не затрагиваются.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `platform.env`,
  `registry-ca.crt`, `registry-target.json`, `registry-repair.json`, `registry-agent-status.json`,
  `registry-pull.json`, `board.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно
  загруженные образы и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Запрос запуска registry корректен, реальный /v2/ доступен с
  аутентификацией и проверенным TLS.'
debrief: Реальный registry восстановлен до запуска consumer приватного образа.
stages.0.brief: 'Результат проверки: Запрос запуска registry корректен, реальный /v2/
  доступен с аутентификацией и проверенным TLS.'
stages.0.objectives.0.text: Запрос запуска registry корректен, реальный /v2/ доступен
  с аутентификацией и проверенным TLS.
stages.1.brief: 'Результат проверки: Готовый board использует сохранённый private
  digest с Always и pull Secret, imageID совпадает, HTTP возвращает north-78.'
stages.1.objectives.0.text: Готовый board использует сохранённый private digest с
  Always и pull Secret, imageID совпадает, HTTP возвращает north-78.
hints.0.text: Восстановите endpoint registry до запуска consumers, которым нужен pull.
hints.1.text: Запишите только описанное действие start; агент работает с одним фиксированным
  игровым контейнером.
hints.2.text: Сначала проверьте TLS и аутентификацию, затем верните одну реплику board
  и проверьте digest и HTTP.
phrases.0: Я восстановил сервис образов до запуска consumers.
phrases.1: Я использовал узкий control восстановления без доступа к хосту.
phrases.2: Я отдельно проверил TLS registry, identity образа и HTTP приложения.
