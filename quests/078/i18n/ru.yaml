title: Доступность реестра
brief: |-
  Приватный реестр недоступен, board не обслуживает запросы. Восстановите доступ к реестру перед возвращением board в работу.

  Работайте на workstation в `~/quest` с файлами `platform.env`, `registry-ca.crt`, `registry-repair.json`, `registry-pull.yaml`, `board.yaml`.

  Если не указано иное, ресурсы Kubernetes находятся в namespace песочницы (`DQ_NAMESPACE`); пути в `~/quest` — на workstation.

  **Requirements:**

  - Этап 1:
    - Предоставленный endpoint реестра принимает аутентифицированное чтение `/v2/` через TLS с проверкой сертификата.

  - Этап 2:
    - Предоставленный endpoint реестра принимает аутентифицированное чтение `/v2/` через TLS с проверкой сертификата.
    - Deployment `board` и готовый контейнер в активном Pod используют существующий неизменяемый приватный образ релиза с политикой загрузки `Always`.
    - Deployment `board` имеет число реплик `1` и завершает rollout.
    - Внутри Pod Deployment `board` адрес `http://127.0.0.1:8080` возвращает `north-78`.

  Текущая доступность сервисов не доказывает восстановление после потери хранилища реестра.
debrief: Реальный registry восстановлен до запуска consumer приватного образа.
stages.0.brief: Восстановите аутентифицированный доступ к существующему приватному реестру.
stages.1.brief: Восстановите сервис board с требуемым приватным релизом.
hints.0.text: Восстановите endpoint registry до запуска consumers, которым нужен pull.
hints.1.text: |-
  Изучите состояние агента реестра и события нагрузки.

  ```bash
  cat registry-agent-status.json
  kubectl describe deployment board
  ```
hints.2.text: |-
  Сначала проверьте TLS и аутентификацию, затем верните одну реплику board и проверьте digest и HTTP. Запишите в `registry-repair.json` ровно `{"action":"start"}`. Следующий опрос целей запускает только неизменённый реестр этой установки; другие действия и лишние поля отклоняются. Предоставленный pull Secret — `registry-pull`. Запишите только описанное действие start; агент работает с одним фиксированным игровым контейнером.

  Проверьте из `~/quest` на workstation:

  - `source platform.env`
  - `curl -fsS --cacert registry-ca.crt --config <(printf 'user = "%s:%s"\n' "$REGISTRY_USER" "$REGISTRY_PASSWORD") "https://$(jq -r .endpoint /run/dq/facts/0/registry-target.json)/v2/"`

  Этап 1: Ответ через аутентифицированный TLS: `{}`.

  - `kubectl get deployment board -o json | jq '{replicas:.spec.replicas, ready:.status.readyReplicas,worker:(.spec.template.spec.containers[]|select(.name=="worker")|{image,imagePullPolicy})}'`

  Этап 2: `replicas: 1`, `ready: 1`. Образ совпадает с замороженным релизом, политика загрузки — `Always`.

  - `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://127.0.0.1:8080`

  Этап 2: `north-78`.
phrases.0: Я восстановил сервис образов до запуска consumers.
phrases.1: Я использовал узкий control восстановления без доступа к хосту.
phrases.2: Я отдельно проверил TLS registry, identity образа и HTTP приложения.
