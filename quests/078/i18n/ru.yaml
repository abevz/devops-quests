title: Доступность реестра
brief: 'Приватный сервис образов и его нагрузка недоступны. Восстановите исходный registry, затем приватное получение
  образа, сохранив утверждённый артефакт, контроллер, программу и объект учётных данных.


  Работайте в `~/quest`. Исходные записи описывают доверенный источник и защищённую публикацию; замороженные копии
  в `/run/dq/facts/0/` остаются авторитетными. Сохраните исходные идентичности, программы, границы доступа и доверие
  TLS. Не выводите учётные данные и не заменяйте защищённый источник.


  Входы: `platform.env`, `registry-ca.crt`, `board.yaml`, `registry-target.json`, `registry-source.json` и `registry-consumer.json`.
  Ограниченный интерфейс управления описан в `control/README.md`. Сохраните идентичность существующего объекта учётных
  данных. Текущая доступность не доказывает восстановление после потери хранилища.


  **Требования:**


  - Этап 1: Предоставленный endpoint реестра принимает аутентифицированное чтение `/v2/` через TLS с проверкой сертификата.

  - Этап 2: Исходные учётные данные и CA registry остаются действительными, а исходный pull Secret содержит выданные
  приватные учётные данные.

  - Этап 2: Deployment `board` и готовый контейнер в активном Pod используют существующий неизменяемый приватный
  образ релиза с политикой загрузки `Always`.

  - Этап 2: Исходный Deployment сохраняет спецификацию pod, число реплик `1` и завершает rollout с одним активным
  принадлежащим ему pod, утверждённым digest, `Always` и исходным pull Secret.

  - Этап 2: Внутри Pod Deployment `board` адрес `http://127.0.0.1:8080` возвращает `north-78`.'
debrief: Идентичности исходных источников и потребителей сохранены; утверждённый релиз проверен на каждой затронутой
  границе.
stages.0.brief: Восстановите аутентифицированный доступ к существующему приватному реестру.
stages.1.brief: Приватный сервис образов и его нагрузка недоступны. Восстановите исходный registry, затем приватное
  получение образа, сохранив утверждённый артефакт, контроллер, программу и объект учётных данных.
hints.0.text: Доступность сервиса, доверие TLS и аутентификация kubelet — отдельные границы.
hints.1.text: |-
  Сопоставьте квитанцию управления, контракт источника, Deployment и метаданные pull Secret. После попытки получения образа события pod различают транспортные ошибки и отказ доступа.

  Сверьте источник загрузки и ожидаемый дайджест с Deployment и действующим готовым Pod. По квитанции о сертификате и именам Secret различите доверие и аутентификацию.

  ```bash
  cat registry-agent-status.json
  jq '{endpoint,ca_sha256}' registry-source.json
  kubectl describe deployment board
  kubectl get secret -o custom-columns=NAME:.metadata.name,TYPE:.type
  kubectl get events --sort-by=.lastTimestamp
  ```
hints.2.text: |-
  Проверьте из `~/quest` на workstation:

  - `source platform.env`
  - `curl -fsS --cacert registry-ca.crt --config <(printf 'user = "%s:%s"\n' "$REGISTRY_USER" "$REGISTRY_PASSWORD") "https://$(jq -r .endpoint /run/dq/facts/0/registry-target.json)/v2/"`

  Этап 1: Ответ через аутентифицированный TLS: `{}`.

  - `kubectl get deployment board -o json | jq '{replicas:.spec.replicas, ready:.status.readyReplicas,worker:(.spec.template.spec.containers[]|select(.name=="worker")|{image,imagePullPolicy})}'`

  Этап 2: `replicas: 1`, `ready: 1`. Образ совпадает с замороженным релизом, политика загрузки — `Always`.

  - `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://127.0.0.1:8080`

  Этап 2: `north-78`.

  Аутентифицированный запрос workstation не обновляет Secret kubelet. Постройте обновление существующего pull Secret исходными приватными учётными данными, сохранив UID, затем запустите единственный утверждённый worker. Сохраните digest и Always; не обходите аутентификацию и не заменяйте контроллер.

  ```bash
  set -euo pipefail
  cd ~/quest
  source platform.env
  python3 -I - <<'VERIFY_RELEASE'

  import base64,hashlib,json,os,ssl,urllib.request
  from pathlib import Path
  source=json.loads(Path('/run/dq/facts/0/registry-source.json').read_text())
  assert os.environ['REGISTRY']==source['endpoint']
  assert os.environ['REGISTRY_USER']==source['username']
  assert hashlib.sha256(os.environ['REGISTRY_PASSWORD'].encode()).hexdigest()==source['password_sha256']
  assert hashlib.sha256(Path('registry-ca.crt').read_bytes()).hexdigest()==source['ca_sha256']
  class NoRedirect(urllib.request.HTTPRedirectHandler):
   def redirect_request(self,*args,**kwargs):
    return None
  opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect(),
  urllib.request.HTTPSHandler(context=ssl.create_default_context(cafile='registry-ca.crt')))
  headers={'Authorization':'Basic '+base64.b64encode((source['username']+':'+os.environ['REGISTRY_PASSWORD']).encode()).decode(),
  'Accept':'application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json'}
  def manifest(reference):
   request=urllib.request.Request('https://'+source['endpoint']+'/v2/parcel/manifests/'+reference,headers=headers)
   with opener.open(request,timeout=2) as response:
    body=response.read(2097153)
    assert len(body)<=2097152
    digest='sha256:'+hashlib.sha256(body).hexdigest()
    assert response.headers.get('Docker-Content-Digest')==digest
    return digest

  from dq_check import registry_credentials
  import subprocess
  contract=json.loads(Path('/run/dq/facts/0/registry-consumer.json').read_text())
  target=json.loads(Path('/run/dq/facts/0/registry-target.json').read_text())
  assert manifest(target['image'].split('@',1)[1])==target['image'].split('@',1)[1]
  secret=json.loads(subprocess.check_output(['kubectl','get','secret',contract['secret_name'],'-o','json'],timeout=2))
  assert secret['metadata']['uid']==contract['secret_uid']
  assert registry_credentials(secret,source['endpoint'],source['username'],os.environ['REGISTRY_PASSWORD'])


  import json,subprocess
  from pathlib import Path
  from dq_check import current_pods,pod_worker,ready_image,workload_worker,pull_secret_names
  def k(*args):
   return json.loads(subprocess.check_output(['kubectl',*args,'-o','json'],timeout=2))
  contract=json.loads(Path('/run/dq/facts/0/registry-consumer.json').read_text())
  old=contract['deployment']
  deployment=k('get','deployment','board')
  assert deployment['metadata']['uid']==old['metadata']['uid']
  assert deployment['spec']['selector']==old['spec']['selector']
  assert deployment['spec']['template']['spec']==old['spec']['template']['spec']
  worker=workload_worker(deployment)
  active=current_pods(deployment,k('get','replicasets'),k('get','pods'))
  assert len(active)==1
  for pod in active:
   assert ready_image(pod,worker['image'])
   assert pod_worker(pod).get('imagePullPolicy')=='Always'
   assert pull_secret_names(pod)=={contract['secret_name']}
   assert pod_worker(pod).get('command')==worker.get('command')
   assert pod_worker(pod).get('args')==worker.get('args')

  print('OK')
  VERIFY_RELEASE
  ```

  Ожидается OK. Учётные данные не выводятся.
phrases.0: Я восстановил сервис образов до запуска consumers.
phrases.1: Я использовал узкий control восстановления без доступа к хосту.
phrases.2: Я отдельно проверил TLS registry, identity образа и HTTP приложения.
