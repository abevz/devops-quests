stages.1.objectives.2.text: Das ursprüngliche Deployment bewahrt die Pod-Spezifikation, hat `1` Replikat und schließt
  den Rollout mit einem aktiven zugehörigen Pod, freigegebenem Digest, `Always` und ursprünglichem Pull-Secret ab.
