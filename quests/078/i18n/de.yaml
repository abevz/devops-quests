title: Verfügbarkeit der Registrierung
brief: 'Privater Image-Dienst und Workload sind nicht verfügbar. Stellen Sie die ursprüngliche Registry und danach
  den privaten Image-Abruf wieder her; bewahren Sie Artefakt, Controller, Programm und Zugangsdatenobjekt.


  Arbeiten Sie in `~/quest`. Quellenaufzeichnungen beschreiben ursprüngliche Autorität und geschützte Publikation;
  eingefrorene Kopien unter `/run/dq/facts/0/` bleiben maßgeblich. Identitäten, Programme, Zugriffsgrenzen und TLS-Vertrauen
  bewahren. Zugangsdaten nicht ausgeben; die geschützte Quelle nicht ersetzen.


  Eingaben: `platform.env`, `registry-ca.crt`, `board.yaml`, `registry-target.json`, `registry-source.json` und
  `registry-consumer.json`. Die begrenzte Dienststeuerung beschreibt `control/README.md`. Identität des bestehenden
  Zugangsdatenobjekts bewahren. Verfügbarkeit belegt keine Wiederherstellung nach Speicherverlust.


  **Anforderungen:**


  - Phase 1: Der bereitgestellte Registry-Endpunkt akzeptiert einen authentifizierten `/v2/`-Lesezugriff über geprüftes
  TLS.

  - Phase 2: Ursprüngliche Registry-Identität und CA bleiben gültig; der ursprüngliche Pull-Secret enthält die bereitgestellten
  privaten Zugangsdaten.

  - Phase 2: Deployment `board` und ein bereiter Container in einem aktiven Pod verwenden das vorhandene unveränderliche
  private Release-Image mit Pull-Policy `Always`.

  - Phase 2: Das ursprüngliche Deployment bewahrt die Pod-Spezifikation, hat `1` Replikat und schließt den Rollout
  mit einem aktiven zugehörigen Pod, freigegebenem Digest, `Always` und ursprünglichem Pull-Secret ab.

  - Phase 2: In einem Pod von Deployment `board` liefert `http://127.0.0.1:8080` den Wert `north-78`.'
debrief: Ursprüngliche Quellen- und Verbraucheridentitäten blieben erhalten; das freigegebene Release wurde an jeder
  betroffenen Grenze geprüft.
stages.0.brief: Stellen Sie den authentifizierten Zugriff auf die vorhandene private Registry wieder her.
stages.1.brief: Privater Image-Dienst und Workload sind nicht verfügbar. Stellen Sie die ursprüngliche Registry
  und danach den privaten Image-Abruf wieder her; bewahren Sie Artefakt, Controller, Programm und Zugangsdatenobjekt.
hints.0.text: Dienstverfügbarkeit, TLS-Vertrauen und Kubelet-Authentifizierung sind getrennte Grenzen.
hints.1.text: |-
  Steuerquittung, Quellenvertrag, Deployment und Pull-Secret-Metadaten prüfen. Nach einem Abrufversuch unterscheiden Pod-Ereignisse Transport- und Berechtigungsfehler.

  Vergleiche Pull-Quelle und erwarteten Digest mit dem Deployment und dem bereiten Pod. Prüfe Zertifikatsnachweis und Secret-Namen, um Vertrauen und Authentifizierung zu unterscheiden.

  ```bash
  cat registry-agent-status.json
  jq '{endpoint,ca_sha256}' registry-source.json
  kubectl describe deployment board
  kubectl get secret -o custom-columns=NAME:.metadata.name,TYPE:.type
  kubectl get events --sort-by=.lastTimestamp
  ```
hints.2.text: |-
  Prüfen Sie in `~/quest` auf der Workstation:

  - `source platform.env`
  - `curl -fsS --cacert registry-ca.crt --config <(printf 'user = "%s:%s"\n' "$REGISTRY_USER" "$REGISTRY_PASSWORD") "https://$(jq -r .endpoint /run/dq/facts/0/registry-target.json)/v2/"`

  Stufe 1: Authentifizierte TLS-Antwort: `{}`.

  - `kubectl get deployment board -o json | jq '{replicas:.spec.replicas, ready:.status.readyReplicas,worker:(.spec.template.spec.containers[]|select(.name=="worker")|{image,imagePullPolicy})}'`

  Stufe 2: `replicas: 1`, `ready: 1`. Das Image entspricht dem eingefrorenen Release und die Pull-Policy ist `Always`.

  - `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://127.0.0.1:8080`

  Stufe 2: `north-78`.

  Ein authentifizierter Workstation-Abruf aktualisiert keinen Kubelet-Secret. Bestehenden Pull-Secret mit ursprünglichen privaten Zugangsdaten aktualisieren, UID bewahren und den einzelnen freigegebenen Worker starten. Digest und Always bewahren; Authentifizierung nicht umgehen, Controller nicht ersetzen.

  ```bash
  set -euo pipefail
  cd ~/quest
  source platform.env
  python3 -I - <<'VERIFY_RELEASE'

  import base64,hashlib,json,os,ssl,urllib.request
  from pathlib import Path
  source=json.loads(Path('/run/dq/facts/0/registry-source.json').read_text())
  assert os.environ['REGISTRY']==source['endpoint']
  assert os.environ['REGISTRY_USER']==source['username']
  assert hashlib.sha256(os.environ['REGISTRY_PASSWORD'].encode()).hexdigest()==source['password_sha256']
  assert hashlib.sha256(Path('registry-ca.crt').read_bytes()).hexdigest()==source['ca_sha256']
  class NoRedirect(urllib.request.HTTPRedirectHandler):
   def redirect_request(self,*args,**kwargs):
    return None
  opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect(),
  urllib.request.HTTPSHandler(context=ssl.create_default_context(cafile='registry-ca.crt')))
  headers={'Authorization':'Basic '+base64.b64encode((source['username']+':'+os.environ['REGISTRY_PASSWORD']).encode()).decode(),
  'Accept':'application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json'}
  def manifest(reference):
   request=urllib.request.Request('https://'+source['endpoint']+'/v2/parcel/manifests/'+reference,headers=headers)
   with opener.open(request,timeout=2) as response:
    body=response.read(2097153)
    assert len(body)<=2097152
    digest='sha256:'+hashlib.sha256(body).hexdigest()
    assert response.headers.get('Docker-Content-Digest')==digest
    return digest

  from dq_check import registry_credentials
  import subprocess
  contract=json.loads(Path('/run/dq/facts/0/registry-consumer.json').read_text())
  target=json.loads(Path('/run/dq/facts/0/registry-target.json').read_text())
  assert manifest(target['image'].split('@',1)[1])==target['image'].split('@',1)[1]
  secret=json.loads(subprocess.check_output(['kubectl','get','secret',contract['secret_name'],'-o','json'],timeout=2))
  assert secret['metadata']['uid']==contract['secret_uid']
  assert registry_credentials(secret,source['endpoint'],source['username'],os.environ['REGISTRY_PASSWORD'])


  import json,subprocess
  from pathlib import Path
  from dq_check import current_pods,pod_worker,ready_image,workload_worker,pull_secret_names
  def k(*args):
   return json.loads(subprocess.check_output(['kubectl',*args,'-o','json'],timeout=2))
  contract=json.loads(Path('/run/dq/facts/0/registry-consumer.json').read_text())
  old=contract['deployment']
  deployment=k('get','deployment','board')
  assert deployment['metadata']['uid']==old['metadata']['uid']
  assert deployment['spec']['selector']==old['spec']['selector']
  assert deployment['spec']['template']['spec']==old['spec']['template']['spec']
  worker=workload_worker(deployment)
  active=current_pods(deployment,k('get','replicasets'),k('get','pods'))
  assert len(active)==1
  for pod in active:
   assert ready_image(pod,worker['image'])
   assert pod_worker(pod).get('imagePullPolicy')=='Always'
   assert pull_secret_names(pod)=={contract['secret_name']}
   assert pod_worker(pod).get('command')==worker.get('command')
   assert pod_worker(pod).get('args')==worker.get('args')

  print('OK')
  VERIFY_RELEASE
  ```

  Erwartet: OK. Keine Zugangsdaten werden ausgegeben.
phrases.0: Ich habe den Image-Dienst wiederhergestellt, bevor ich seinen consumers neu gestartet habe.
phrases.1: Ich habe eine Wiederherstellung mit engem Umfang control ohne Hostzugriff verwendet.
phrases.2: Ich habe registry TLS, Bild identity und Anwendung HTTP separat überprüft.
stages.0.objectives.0.text: Der bereitgestellte Registry-Endpunkt akzeptiert einen authentifizierten `/v2/`-Lesezugriff
  über geprüftes TLS.
stages.1.objectives.0.text: Ursprüngliche Registry-Identität und CA bleiben gültig; der ursprüngliche Pull-Secret
  enthält die bereitgestellten privaten Zugangsdaten.
stages.1.objectives.1.text: Deployment `board` und ein bereiter Container in einem aktiven Pod verwenden das vorhandene
