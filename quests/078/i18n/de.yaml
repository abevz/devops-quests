diagnostics.probe_1_0: Ursprüngliche Registry-Zugangsdaten und CA müssen dem Quellenvertrag entsprechen; bestehenden
  Pull-Secret mit ursprünglichen Zugangsdaten aktualisieren.
diagnostics.probe_1_2: Ursprüngliches Deployment und Pod-Programm bewahren; der einzige aktive zugehörige Pod muss
  den freigegebenen privaten Digest mit Always und ursprünglichem Pull-Secret verwenden.
