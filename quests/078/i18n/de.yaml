title: Verfügbarkeit der Registrierung
brief: 'Der Einweg-registry-Prozess wurde nach dem Seeding seines Images tatsächlich gestoppt. Consumers
  werden bewusst auf null Replikate gehalten. Senden Sie zunächst registry-repair.json, das genau {"action":"start"}
  enthält. Der Bay-Agent kann bei der nächsten Zielabfrage nur diesen unveränderten, zur Installation
  gehörenden registry starten; Zusätzliche Felder und andere Aktionen werden abgelehnt. Dieses schmale
  Spiel control bietet keinen Host Docker socket oder allgemeinen Service control. Überprüfen Sie vor
  Schritt zwei den authentifizierten TLS /v2/. Stellen Sie dann board in einem Replikat wieder her, indem
  Sie das bereits angeheftete private Image und pull Secret verwenden. Es ist kein VM oder Live-Service
  beteiligt.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `platform.env`, `registry-ca.crt`,
  `registry-target.json`, `registry-repair.json`, `registry-agent-status.json`, `registry-pull.json`,
  `board.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Anfängliche Erfolgskriterien: Die festgelegte Registrierungsstartanforderung ist gültig und der tatsächlich
  authentifizierte Endpunkt registry /v2/ ist mit verifiziertem TLS erreichbar.'
debrief: Das echte registry wurde wiederhergestellt, bevor das private Image consumer zurückgebracht wurde.
stages.0.brief: 'Erfolgskriterien: Die festgelegte Registrierungsstartanforderung ist gültig und der tatsächlich
  authentifizierte Endpunkt registry /v2/ ist mit verifiziertem TLS erreichbar.'
stages.0.objectives.0.text: Die festgelegte Registrierungsstartanforderung ist gültig und der tatsächlich
