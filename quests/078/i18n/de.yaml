stages.1.brief: 'Erfolgskriterien: Ein fertiger board verwendet den eingefrorenen private digest mit Always
  und den pull Secret, dessen imageID übereinstimmt und HTTP gibt north-78 zurück.'
stages.1.objectives.0.text: Ein fertiger board verwendet den eingefrorenen private digest mit Always und
  den pull Secret, dessen imageID übereinstimmt und HTTP gibt north-78 zurück.
hints.0.text: Stellen Sie den registry endpoint wieder her, bevor Sie consumers starten, der pull benötigt.
hints.1.text: Schreiben Sie nur die dokumentierte Startaktion; Der Agent zielt auf einen festen Spielcontainer.
hints.2.text: Überprüfen Sie zuerst TLS und die Authentifizierung, stellen Sie dann ein board-Replikat
  wieder her und überprüfen Sie dessen digest und HTTP.
phrases.0: Ich habe den Image-Dienst wiederhergestellt, bevor ich seinen consumers neu gestartet habe.
phrases.1: Ich habe eine Wiederherstellung mit engem Umfang control ohne Hostzugriff verwendet.
phrases.2: Ich habe registry TLS, Bild identity und Anwendung HTTP separat überprüft.
