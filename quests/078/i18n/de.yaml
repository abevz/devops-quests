guides.reference_1: API- und Diagnosereferenz
guides.reference_2: Referenz zur Publikations- und Verbraucherprüfung
diagnostics.registry_start: Die ursprüngliche Registry ist gestoppt; reichen Sie die unterstützte action:start Anfrage ein und lassen Sie die Zielabfrage sie verarbeiten. Fehlende/falsche Anfrage, TLS-Vertrauen oder Authentifizierungsfehler können die ursprüngliche HTTPS-API unerreichbar lassen. [Ursache und Prüfung](guides#guide=gitops-delivery&section=private-registry-original-start-interface)
diagnostics.probe_1_0: Das gelieferte Pull-Secret enthält ein altes password; korrigieren Sie credentials ohne UID-Neuanlage unter Erhalt ursprünglicher registry credentials und CA. Unbereites image, geänderte Quelle/trust, Manifest- oder Beobachtungsfehler ergeben ebenfalls diesen Fallback. [Ursache und Prüfung](guides#guide=gitops-delivery&section=private-registry-original-authority-and-pull-credential)
diagnostics.registry_pull_policy: Deklariertes image, Always Policy oder registry-pull Referenz können abweichen oder kein bereiter Pod meldet den erwarteten Digest; erhalten Sie die gelieferte Pull-Policy und prüfen Sie das tatsächliche Image-Ergebnis. [Ursache und Prüfung](guides#guide=gitops-delivery&section=private-registry-declared-always-pull-and-ready-digest)
diagnostics.probe_1_2: Deployment startet mit null Repliken; skalieren Sie den ursprünglichen Controller nach Secret-Reparatur auf eins. Geänderte UID/Template, unbereiter oder zusätzlicher eigener Pod, falsche Pull-Referenz oder Rollout-/API-Fehler verletzen ebenfalls die Prüfung. [Ursache und Prüfung](guides#guide=gitops-delivery&section=private-registry-original-controller-and-one-ready-consumer)
diagnostics.registry_http: Der ursprüngliche Verbraucher bleibt nach Image-Pull möglicherweise unerreichbar oder liefert eine andere Route; prüfen Sie Rollout und tatsächliche worker HTTP-Antwort statt allein Registry-Bereitschaft. [Ursache und Prüfung](guides#guide=gitops-delivery&section=private-registry-running-consumer-response)
