title: Verfügbarkeit der Registrierung
brief: |-
  Die private Registry ist nicht erreichbar und board bedient keine Anfragen. Stellen Sie zuerst den Registry-Zugriff und dann den Board-Dienst wieder her.

  Arbeiten Sie auf der Workstation in `~/quest` mit `platform.env`, `registry-ca.crt`, `registry-repair.json`, `registry-pull.yaml`, `board.yaml`.

  Sofern nicht anders angegeben, liegen Kubernetes-Ressourcen im Bay-Namespace (`DQ_NAMESPACE`); Pfade unter `~/quest` liegen auf der Workstation.

  **Requirements:**

  - Stufe 1:
    - Der bereitgestellte Registry-Endpunkt akzeptiert einen authentifizierten `/v2/`-Lesezugriff über geprüftes TLS.

  - Stufe 2:
    - Der bereitgestellte Registry-Endpunkt akzeptiert einen authentifizierten `/v2/`-Lesezugriff über geprüftes TLS.
    - Deployment `board` und ein bereiter Container in einem aktiven Pod verwenden das vorhandene unveränderliche private Release-Image mit Pull-Policy `Always`.
    - Deployment `board` hat Replikazahl `1` und schließt seinen Rollout ab.
    - In einem Pod von Deployment `board` liefert `http://127.0.0.1:8080` den Wert `north-78`.

  Die aktuelle Dienstverfügbarkeit beweist keine Wiederherstellung nach Verlust des Registry-Speichers.
debrief: Das echte registry wurde wiederhergestellt, bevor das private Image consumer zurückgebracht wurde.
stages.0.brief: Stellen Sie den authentifizierten Zugriff auf die vorhandene private Registry wieder her.
stages.1.brief: Stellen Sie den Board-Dienst mit seinem vorgesehenen privaten Release wieder her.
hints.0.text: Stellen Sie den registry endpoint wieder her, bevor Sie consumers starten, der pull benötigt.
hints.1.text: |-
  Prüfen Sie den Registry-Agentenstatus und die Workload-Ereignisse.

  ```bash
  cat registry-agent-status.json
  kubectl describe deployment board
  ```
hints.2.text: |-
  Überprüfen Sie zuerst TLS und die Authentifizierung, stellen Sie dann ein board-Replikat wieder her und überprüfen Sie dessen digest und HTTP. Schreiben Sie genau `{"action":"start"}` in `registry-repair.json`. Die nächste Zielabfrage startet nur die unveränderte Registry dieser Installation; andere Aktionen und zusätzliche Felder werden abgelehnt. Das bereitgestellte Pull-Secret heißt `registry-pull`. Schreiben Sie nur die dokumentierte Startaktion; Der Agent zielt auf einen festen Spielcontainer.

  Prüfen Sie in `~/quest` auf der Workstation:

  - `source platform.env`
  - `curl -fsS --cacert registry-ca.crt --config <(printf 'user = "%s:%s"\n' "$REGISTRY_USER" "$REGISTRY_PASSWORD") "https://$(jq -r .endpoint /run/dq/facts/0/registry-target.json)/v2/"`

  Stufe 1: Authentifizierte TLS-Antwort: `{}`.

  - `kubectl get deployment board -o json | jq '{replicas:.spec.replicas, ready:.status.readyReplicas,worker:(.spec.template.spec.containers[]|select(.name=="worker")|{image,imagePullPolicy})}'`

  Stufe 2: `replicas: 1`, `ready: 1`. Das Image entspricht dem eingefrorenen Release und die Pull-Policy ist `Always`.

  - `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://127.0.0.1:8080`

  Stufe 2: `north-78`.
phrases.0: Ich habe den Image-Dienst wiederhergestellt, bevor ich seinen consumers neu gestartet habe.
phrases.1: Ich habe eine Wiederherstellung mit engem Umfang control ohne Hostzugriff verwendet.
phrases.2: Ich habe registry TLS, Bild identity und Anwendung HTTP separat überprüft.
