title: Registry availability
brief: 'The private image service and its workload are unavailable. Recover the existing registry, then restore
  private image consumption without changing the approved artifact, controller, program or pull-credential identity.


  Work in `~/quest`. Supplied source records identify the original authority and protected publication; backend-frozen
  copies under `/run/dq/facts/0/` remain authoritative. Preserve the original identities, programs, access boundaries
  and TLS trust. Keep credentials private; do not print them or replace the protected source.


  Inputs: `platform.env`, `registry-ca.crt`, `board.yaml`, `registry-target.json`, `registry-source.json` and `registry-consumer.json`.
  The bounded service control is documented in `control/README.md`. The existing credential object must retain its
  identity. Current availability does not prove recovery after storage loss.


  **Requirements:**


  - Stage 1: The supplied registry endpoint accepts an authenticated `/v2/` read over verified TLS.

  - Stage 2: The original registry authority and CA remain valid, and the original pull Secret holds the supplied
  private registry credentials.

  - Stage 2: Deployment `board` and a ready container in an active Pod use the existing immutable private release
  image, with pull policy `Always`.

  - Stage 2: The original Deployment retains its pod specification, has replica count `1`, and completes rollout
  with one active owned pod using the approved digest, `Always` and original pull Secret.

  - Stage 2: Inside a Pod of Deployment `board`, `http://127.0.0.1:8080` returns `north-78`.'
debrief: The original source and consumer identities were preserved, and the approved release was verified at each
  affected boundary.
stages.0.brief: Recover authenticated access to the existing private registry.
stages.1.brief: The private image service and its workload are unavailable. Recover the existing registry, then
  restore private image consumption without changing the approved artifact, controller, program or pull-credential
  identity.
hints.0.text: Service availability, TLS trust and a kubelet’s authentication are separate boundaries.
hints.1.text: 'Inspect the existing control receipt, source contract, Deployment and pull Secret metadata. Once
  a pull is attempted, Pod events distinguish transport and authorization failures.


  ```bash

  cat registry-agent-status.json registry-source.json

  kubectl describe deployment board

  kubectl get secret -o custom-columns=NAME:.metadata.name,TYPE:.type

  kubectl get events --sort-by=.lastTimestamp

  ```'
hints.2.text: "Check TLS and authentication first, then restore one board replica and verify its digest and HTTP.\
  \ Write `registry-repair.json` as exactly `{\"action\":\"start\"}`. The next objective poll starts only the unchanged\
  \ installation-owned registry; other actions and extra fields are rejected. The supplied pull Secret is `registry-pull`.\
  \ Write only the documented start action; the agent targets one fixed game container.\n\nVerify from `~/quest`\
  \ on the workstation:\n\n- `source platform.env`\n- `curl -fsS --cacert registry-ca.crt --config <(printf 'user\
  \ = \"%s:%s\"\\n' \"$REGISTRY_USER\" \"$REGISTRY_PASSWORD\") \"https://$(jq -r .endpoint /run/dq/facts/0/registry-target.json)/v2/\"\
  `\n\nStage 1: An authenticated TLS response: `{}`.\n\n- `kubectl get deployment board -o json | jq '{replicas:.spec.replicas,\
  \ ready:.status.readyReplicas,worker:(.spec.template.spec.containers[]|select(.name==\"worker\")|{image,imagePullPolicy})}'`\n\
  \nStage 2: `replicas: 1`, `ready: 1`. The image matches the frozen release and pull policy is `Always`.\n\n- `kubectl\
  \ exec deployment/board -c worker -- wget -qO- -T 3 http://127.0.0.1:8080`\n\nStage 2: `north-78`.\n\nThe workstation’s\
  \ authenticated registry read does not update the kubelet’s Secret. Construct an update of the existing pull Secret\
  \ using the original private registry identity, preserve its UID, then start the single approved worker. Keep\
  \ the digest and Always policy; do not bypass registry authentication or replace the controller.\n\n```bash\n\
  set -euo pipefail\ncd ~/quest\nsource platform.env\npython3 -I - <<'VERIFY_RELEASE'\n\nimport base64,hashlib,json,os,ssl,urllib.request\n\
  from pathlib import Path\nsource=json.loads(Path('/run/dq/facts/0/registry-source.json').read_text())\nassert\
  \ os.environ['REGISTRY']==source['endpoint']\nassert os.environ['REGISTRY_USER']==source['username']\nassert hashlib.sha256(os.environ['REGISTRY_PASSWORD'].encode()).hexdigest()==source['password_sha256']\n\
  assert hashlib.sha256(Path('registry-ca.crt').read_bytes()).hexdigest()==source['ca_sha256']\nclass NoRedirect(urllib.request.HTTPRedirectHandler):\n\
  \ def redirect_request(self,*args,**kwargs):\n  return None\nopener=urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect(),\n\
  urllib.request.HTTPSHandler(context=ssl.create_default_context(cafile='registry-ca.crt')))\nheaders={'Authorization':'Basic\
  \ '+base64.b64encode((source['username']+':'+os.environ['REGISTRY_PASSWORD']).encode()).decode(),\n'Accept':'application/vnd.docker.distribution.manifest.v2+json,\
  \ application/vnd.oci.image.manifest.v1+json'}\ndef manifest(reference):\n request=urllib.request.Request('https://'+source['endpoint']+'/v2/parcel/manifests/'+reference,headers=headers)\n\
  \ with opener.open(request,timeout=2) as response:\n  body=response.read(2097153)\n  assert len(body)<=2097152\n\
  \  digest='sha256:'+hashlib.sha256(body).hexdigest()\n  assert response.headers.get('Docker-Content-Digest')==digest\n\
  \  return digest\n\nfrom dq_check import registry_credentials\nimport subprocess\ncontract=json.loads(Path('/run/dq/facts/0/registry-consumer.json').read_text())\n\
  target=json.loads(Path('/run/dq/facts/0/registry-target.json').read_text())\nassert manifest(target['image'].split('@',1)[1])==target['image'].split('@',1)[1]\n\
  secret=json.loads(subprocess.check_output(['kubectl','get','secret',contract['secret_name'],'-o','json'],timeout=2))\n\
  assert secret['metadata']['uid']==contract['secret_uid']\nassert registry_credentials(secret,source['endpoint'],source['username'],os.environ['REGISTRY_PASSWORD'])\n\
  \n\nimport json,subprocess\nfrom pathlib import Path\nfrom dq_check import current_pods,pod_worker,ready_image,workload_worker,pull_secret_names\n\
  def k(*args):\n return json.loads(subprocess.check_output(['kubectl',*args,'-o','json'],timeout=2))\ncontract=json.loads(Path('/run/dq/facts/0/registry-consumer.json').read_text())\n\
  old=contract['deployment']\ndeployment=k('get','deployment','board')\nassert deployment['metadata']['uid']==old['metadata']['uid']\n\
  assert deployment['spec']['selector']==old['spec']['selector']\nassert deployment['spec']['template']['spec']==old['spec']['template']['spec']\n\
  worker=workload_worker(deployment)\nactive=current_pods(deployment,k('get','replicasets'),k('get','pods'))\nassert\
  \ len(active)==1\nfor pod in active:\n assert ready_image(pod,worker['image'])\n assert pod_worker(pod).get('imagePullPolicy')=='Always'\n\
  \ assert pull_secret_names(pod)=={contract['secret_name']}\n assert pod_worker(pod).get('command')==worker.get('command')\n\
  \ assert pod_worker(pod).get('args')==worker.get('args')\n\nprint('OK')\nVERIFY_RELEASE\n```\n\nExpected: OK.\
  \ Credentials are not displayed."
phrases.0: I restored the image service before restarting its consumers.
phrases.1: I used a narrowly scoped recovery control without host access.
phrases.2: I verified registry TLS, image identity and application HTTP separately.
stages.0.objectives.0.text: The supplied registry endpoint accepts an authenticated `/v2/` read over verified TLS.
stages.1.objectives.0.text: The original registry authority and CA remain valid, and the original pull Secret holds
  the supplied private registry credentials.
stages.1.objectives.1.text: Deployment `board` and a ready container in an active Pod use the existing immutable
  private release image, with pull policy `Always`.
stages.1.objectives.2.text: The original Deployment retains its pod specification, has replica count `1`, and completes
  rollout with one active owned pod using the approved digest, `Always` and original pull Secret.
stages.1.objectives.3.text: Inside a Pod of Deployment `board`, `http://127.0.0.1:8080` returns `north-78`.
