title: Registry availability
brief: |-
  The private registry is unavailable and the board is not serving requests. Restore registry access before bringing the board back into service.

  Work on the workstation in `~/quest` with `platform.env`, `registry-ca.crt`, `registry-repair.json`, `registry-pull.yaml`, `board.yaml`.

  Unless stated otherwise, Kubernetes resources live in the bay namespace (`DQ_NAMESPACE`); `~/quest` paths are on the workstation.

  The control interface is documented in `~/quest/control/README.md`.

  **Requirements:**

  - Stage 1:
    - The supplied registry endpoint accepts an authenticated `/v2/` read over verified TLS.

  - Stage 2:
    - The supplied registry endpoint accepts an authenticated `/v2/` read over verified TLS.
    - Deployment `board` and a ready container in an active Pod use the existing immutable private release image, with pull policy `Always`.
    - Deployment `board` has replica count `1` and completes its rollout.
    - Inside a Pod of Deployment `board`, `http://127.0.0.1:8080` returns `north-78`.

  Current service availability does not prove recovery after loss of registry storage.
debrief: The real registry was restored before the private-image consumer was brought back.
stages.0.brief: Recover authenticated access to the existing private registry.
stages.1.brief: Restore the board service with its intended private release.
hints.0.text: Recover the registry endpoint before starting consumers that need to pull.
hints.1.text: |-
  Inspect the initially supplied agent receipt and the live service or workload state. The receipt describes agent activity, not continuous service health.

  ```bash
  cat registry-agent-status.json
  kubectl describe deployment board
  ```
hints.2.text: |-
  Check TLS and authentication first, then restore one board replica and verify its digest and HTTP. Write `registry-repair.json` as exactly `{"action":"start"}`. The next objective poll starts only the unchanged installation-owned registry; other actions and extra fields are rejected. The supplied pull Secret is `registry-pull`. Write only the documented start action; the agent targets one fixed game container.

  Verify from `~/quest` on the workstation:

  - `source platform.env`
  - `curl -fsS --cacert registry-ca.crt --config <(printf 'user = "%s:%s"\n' "$REGISTRY_USER" "$REGISTRY_PASSWORD") "https://$(jq -r .endpoint /run/dq/facts/0/registry-target.json)/v2/"`

  Stage 1: An authenticated TLS response: `{}`.

  - `kubectl get deployment board -o json | jq '{replicas:.spec.replicas, ready:.status.readyReplicas,worker:(.spec.template.spec.containers[]|select(.name=="worker")|{image,imagePullPolicy})}'`

  Stage 2: `replicas: 1`, `ready: 1`. The image matches the frozen release and pull policy is `Always`.

  - `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://127.0.0.1:8080`

  Stage 2: `north-78`.
phrases.0: I restored the image service before restarting its consumers.
phrases.1: I used a narrowly scoped recovery control without host access.
phrases.2: I verified registry TLS, image identity and application HTTP separately.
