guides.reference_2: Publication and consumer verification reference
diagnostics.registry_start: The original registry starts stopped; submit the supported action:start request and let objective polling process it. A missing request, wrong request shape, TLS trust or authentication failure can leave the original HTTPS API unavailable. [Cause and check](guides#guide=gitops-delivery&section=private-registry-original-start-interface)
diagnostics.probe_1_0: The supplied pull Secret contains a retired password; repair its credentials in place while preserving its UID, original registry credentials and CA. An unready image, changed source/trust, failed manifest verification or observation error also reaches this fallback. [Cause and check](guides#guide=gitops-delivery&section=private-registry-original-authority-and-pull-credential)
diagnostics.registry_pull_policy: The declared image, Always policy or registry-pull reference may differ, or no ready Pod reports the expected digest; retain the supplied pull policy and verify the live image result. [Cause and check](guides#guide=gitops-delivery&section=private-registry-declared-always-pull-and-ready-digest)
diagnostics.probe_1_2: The Deployment starts at zero replicas; scale the original controller to one after repairing its Secret. Changed UID/template, an unready or extra owned Pod, wrong pull reference or rollout/API errors also fail this check. [Cause and check](guides#guide=gitops-delivery&section=private-registry-original-controller-and-one-ready-consumer)
diagnostics.registry_http: The original consumer may still be unavailable after image pull or return another route; inspect rollout and the actual worker HTTP response, rather than relying on registry readiness alone. [Cause and check](guides#guide=gitops-delivery&section=private-registry-running-consumer-response)
