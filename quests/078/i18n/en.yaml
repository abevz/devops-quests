title: Registry availability
brief: 'The disposable registry process has really stopped after its image was seeded. Consumers are deliberately
  held at zero replicas. First submit registry-repair.json containing exactly {"action":"start"}. The
  bay agent, on the next objective poll, can start only this unchanged installation-owned registry; extra
  fields and other actions are rejected. This narrow game control provides no host Docker socket or general
  service control. Verify authenticated TLS /v2/ before stage two. Then restore the board to one replica
  using its already pinned private image and pull Secret. No VM or live service is involved.


  Quest files in `~/quest` (some appear in later stages): `platform.env`, `registry-ca.crt`, `registry-target.json`,
  `registry-repair.json`, `registry-agent-status.json`, `registry-pull.json`, `board.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: The fixed registry-start request is valid and the actual authenticated registry
  /v2/ endpoint is reachable with verified TLS.'
debrief: The real registry was restored before the private-image consumer was brought back.
