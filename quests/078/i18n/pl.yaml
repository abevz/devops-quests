title: Dostępność rejestru
brief: 'Proces jednorazowego registry naprawdę się zatrzymał po zaszczepieniu jego obrazu. Consumers celowo
  trzymane są w replikach zerowych. Najpierw prześlij registry-repair.json zawierający dokładnie {"action":"start"}.
  Agent zatoki, podczas następnej obiektywnej ankiety, może start tylko tę niezmienioną instalację registry;
  dodatkowe pola i inne akcje są odrzucane. Ta wąska gra control nie zapewnia host Docker socket ani ogólnej
  usługi control. Zweryfikuj uwierzytelnienie TLS /v2/ przed etapem drugim. Następnie przywróć board do
  jednej repliki, używając już przypiętego prywatnego obrazu i wyciągnij Secret. Nie dotyczy to żadnego
  VM ani usługi na żywo.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `platform.env`, `registry-ca.crt`,
  `registry-target.json`, `registry-repair.json`, `registry-agent-status.json`, `registry-pull.json`,
  `board.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: ustalone żądanie registry-start jest ważne, a rzeczywisty uwierzytelniony
  punkt końcowy registry /v2/ jest osiągalny za pomocą zweryfikowanego TLS.'
debrief: Prawdziwy registry został przywrócony przed przywróceniem prywatnego obrazu consumer.
stages.0.brief: 'Kryteria sukcesu: Ustalone żądanie uruchomienia registry jest ważne i rzeczywisty, uwierzytelniony
  punkt końcowy registry /v2/ jest osiągalny za pomocą zweryfikowanego TLS.'
stages.0.objectives.0.text: Ustalone żądanie uruchomienia registry jest ważne i rzeczywisty, uwierzytelniony
  punkt końcowy registry /v2/ jest osiągalny za pomocą zweryfikowanego TLS.
stages.1.brief: 'Kryteria sukcesu: Jeden gotowy board wykorzystuje zamrożone private digest z Always i
  pull Secret, jego dopasowania imageID i HTTP zwraca north-78.'
stages.1.objectives.0.text: Jeden gotowy board wykorzystuje zamrożone private digest z Always i pull Secret,
  jego dopasowania imageID i HTTP zwraca north-78.
hints.0.text: Odzyskaj punkt końcowy rejestru przed uruchomieniem consumers, który wymaga pull.
hints.1.text: Zapisz tylko udokumentowaną akcję start; agent celuje w jeden stały kontener z grą.
hints.2.text: Najpierw sprawdź TLS i uwierzytelnienie, następnie przywróć jedną replikę board i zweryfikuj
  jej digest i HTTP.
phrases.0: Przywróciłem usługę obrazów przed ponownym uruchomieniem consumers.
phrases.1: Użyłem odzyskiwania o wąskim zakresie control bez dostępu do hosta.
phrases.2: Sprawdzałem osobno rejestr TLS, obraz identity i aplikację HTTP.
