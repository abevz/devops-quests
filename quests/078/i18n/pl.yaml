title: Dostępność rejestru
brief: |-
  Prywatny rejestr jest niedostępny, a board nie obsługuje żądań. Przywróć dostęp do rejestru przed uruchomieniem usługi board.

  Pracuj na workstation w `~/quest` z plikami `platform.env`, `registry-ca.crt`, `registry-repair.json`, `registry-pull.yaml`, `board.yaml`.

  O ile nie wskazano inaczej, zasoby Kubernetes znajdują się w przestrzeni nazw zatoki (`DQ_NAMESPACE`); ścieżki w `~/quest` są na workstation.

  **Requirements:**

  - Etap 1:
    - Dostarczony endpoint rejestru przyjmuje uwierzytelniony odczyt `/v2/` przez zweryfikowany TLS.

  - Etap 2:
    - Dostarczony endpoint rejestru przyjmuje uwierzytelniony odczyt `/v2/` przez zweryfikowany TLS.
    - Deployment `board` i gotowy kontener w aktywnym Podzie używają istniejącego niezmiennego prywatnego obrazu wydania z polityką pobierania `Always`.
    - Deployment `board` ma liczbę replik `1` i kończy rollout.
    - Wewnątrz Poda Deployment `board` adres `http://127.0.0.1:8080` zwraca `north-78`.

  Bieżąca dostępność usług nie dowodzi odzyskiwania po utracie magazynu rejestru.
debrief: Prawdziwy registry został przywrócony przed przywróceniem prywatnego obrazu consumer.
stages.0.brief: Przywróć uwierzytelniony dostęp do istniejącego prywatnego rejestru.
stages.1.brief: Przywróć usługę board z wymaganym prywatnym wydaniem.
hints.0.text: Odzyskaj punkt końcowy rejestru przed uruchomieniem consumers, który wymaga pull.
hints.1.text: |-
  Sprawdź stan agenta rejestru i zdarzenia obciążenia.

  ```bash
  cat registry-agent-status.json
  kubectl describe deployment board
  ```
hints.2.text: |-
  Najpierw sprawdź TLS i uwierzytelnienie, następnie przywróć jedną replikę board i zweryfikuj jej digest i HTTP. Zapisz dokładnie `{"action":"start"}` w `registry-repair.json`. Następne sprawdzenie celów uruchamia wyłącznie niezmieniony rejestr tej instalacji; inne akcje i dodatkowe pola są odrzucane. Dostarczony Secret pobierania to `registry-pull`. Zapisz tylko udokumentowaną akcję start; agent celuje w jeden stały kontener z grą.

  Sprawdź z `~/quest` na workstation:

  - `source platform.env`
  - `curl -fsS --cacert registry-ca.crt --config <(printf 'user = "%s:%s"\n' "$REGISTRY_USER" "$REGISTRY_PASSWORD") "https://$(jq -r .endpoint /run/dq/facts/0/registry-target.json)/v2/"`

  Etap 1: Uwierzytelniona odpowiedź TLS: `{}`.

  - `kubectl get deployment board -o json | jq '{replicas:.spec.replicas, ready:.status.readyReplicas,image:.spec.template.spec.containers[0].image,pullPolicy:.spec.template.spec.containers[0].imagePullPolicy}'`

  Etap 2: `replicas: 1`, `ready: 1`. Obraz odpowiada zamrożonemu wydaniu, a polityka pobierania to `Always`.

  - `kubectl exec deployment/board -- wget -qO- -T 3 http://127.0.0.1:8080`

  Etap 2: `north-78`.
phrases.0: Przywróciłem usługę obrazów przed ponownym uruchomieniem consumers.
phrases.1: Użyłem odzyskiwania o wąskim zakresie control bez dostępu do hosta.
phrases.2: Sprawdzałem osobno rejestr TLS, obraz identity i aplikację HTTP.
stages.0.objectives.0.text: Dostarczony endpoint rejestru przyjmuje uwierzytelniony odczyt `/v2/` przez
  zweryfikowany TLS.
stages.1.objectives.0.text: Dostarczony endpoint rejestru przyjmuje uwierzytelniony odczyt `/v2/` przez
  zweryfikowany TLS.
stages.1.objectives.1.text: Deployment `board` i gotowy kontener w aktywnym Podzie używają istniejącego
  niezmiennego prywatnego obrazu wydania z polityką pobierania `Always`.
stages.1.objectives.2.text: Deployment `board` ma liczbę replik `1` i kończy rollout.
stages.1.objectives.3.text: Wewnątrz Poda Deployment `board` adres `http://127.0.0.1:8080` zwraca `north-78`.
