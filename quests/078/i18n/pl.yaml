title: Dostępność rejestru
brief: 'Prywatna usługa obrazów i obciążenie są niedostępne. Odzyskaj pierwotny registry, potem prywatne pobieranie,
  zachowując artefakt, kontroler, program i tożsamość obiektu uwierzytelniania.


  Pracuj w `~/quest`. Zapisy źródła określają pierwotną tożsamość i chronioną publikację; zamrożone kopie w `/run/dq/facts/0/`
  pozostają autorytatywne. Zachowaj tożsamości, programy, granice dostępu i zaufanie TLS. Nie wypisuj danych uwierzytelniających;
  nie zastępuj chronionego źródła.


  Wejścia: `platform.env`, `registry-ca.crt`, `board.yaml`, `registry-target.json`, `registry-source.json` i `registry-consumer.json`.
  Ograniczone sterowanie opisuje `control/README.md`. Zachowaj tożsamość istniejącego obiektu uwierzytelniania.
  Dostępność nie dowodzi odzyskania po utracie magazynu.


  **Wymagania:**


  - Etap 1: Dostarczony endpoint rejestru przyjmuje uwierzytelniony odczyt `/v2/` przez zweryfikowany TLS.

  - Etap 2: Pierwotne dane dostępu i CA pozostają ważne, a pierwotny pull Secret zawiera dostarczone prywatne dane
  uwierzytelniające.

  - Etap 2: Deployment `board` i gotowy kontener w aktywnym Podzie używają istniejącego niezmiennego prywatnego
  obrazu wydania z polityką pobierania `Always`.

  - Etap 2: Pierwotny Deployment zachowuje specyfikację poda, ma `1` replikę i kończy rollout z jednym aktywnym
  należącym do niego podem, zatwierdzonym skrótem, `Always` i pierwotnym pull Secret.

  - Etap 2: Wewnątrz Poda Deployment `board` adres `http://127.0.0.1:8080` zwraca `north-78`.'
debrief: Zachowano pierwotne tożsamości źródeł i konsumentów; zatwierdzone wydanie sprawdzono na każdej dotkniętej
  granicy.
stages.0.brief: Przywróć uwierzytelniony dostęp do istniejącego prywatnego rejestru.
stages.1.brief: Prywatna usługa obrazów i obciążenie są niedostępne. Odzyskaj pierwotny registry, potem prywatne
  pobieranie, zachowując artefakt, kontroler, program i tożsamość obiektu uwierzytelniania.
hints.0.text: Dostępność usługi, zaufanie TLS i uwierzytelnianie kubelet to odrębne granice.
hints.1.text: |-
  Sprawdź potwierdzenie sterowania, kontrakt źródła, Deployment i metadane pull Secret. Po próbie pobrania zdarzenia rozróżniają błędy transportu i autoryzacji.

  Porównaj źródło obrazu i oczekiwany digest z Deploymentem i obserwacją gotowego Poda. Sprawdź zapis certyfikatu i nazwy Secretów, aby rozróżnić zaufanie i uwierzytelnienie.

  ```bash
  cat registry-agent-status.json
  jq '{endpoint,ca_sha256}' registry-source.json
  kubectl describe deployment board
  kubectl get secret -o custom-columns=NAME:.metadata.name,TYPE:.type
  kubectl get events --sort-by=.lastTimestamp
  ```
hints.2.text: |-
  Sprawdź z `~/quest` na workstation:

  - `source platform.env`
  - `curl -fsS --cacert registry-ca.crt --config <(printf 'user = "%s:%s"\n' "$REGISTRY_USER" "$REGISTRY_PASSWORD") "https://$(jq -r .endpoint /run/dq/facts/0/registry-target.json)/v2/"`

  Etap 1: Uwierzytelniona odpowiedź TLS: `{}`.

  - `kubectl get deployment board -o json | jq '{replicas:.spec.replicas, ready:.status.readyReplicas,worker:(.spec.template.spec.containers[]|select(.name=="worker")|{image,imagePullPolicy})}'`

  Etap 2: `replicas: 1`, `ready: 1`. Obraz odpowiada zamrożonemu wydaniu, a polityka pobierania to `Always`.

  - `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://127.0.0.1:8080`

  Etap 2: `north-78`.

  Uwierzytelniony odczyt workstation nie aktualizuje Secret kubelet. Zbuduj aktualizację istniejącego pull Secret pierwotnymi danymi, zachowaj UID, a następnie uruchom jedyny zatwierdzony worker. Zachowaj skrót i Always; nie obchodź autoryzacji ani nie zastępuj kontrolera.

  ```bash
  set -euo pipefail
  cd ~/quest
  source platform.env
  python3 -I - <<'VERIFY_RELEASE'

  import base64,hashlib,json,os,ssl,urllib.request
  from pathlib import Path
  source=json.loads(Path('/run/dq/facts/0/registry-source.json').read_text())
  assert os.environ['REGISTRY']==source['endpoint']
  assert os.environ['REGISTRY_USER']==source['username']
  assert hashlib.sha256(os.environ['REGISTRY_PASSWORD'].encode()).hexdigest()==source['password_sha256']
  assert hashlib.sha256(Path('registry-ca.crt').read_bytes()).hexdigest()==source['ca_sha256']
  class NoRedirect(urllib.request.HTTPRedirectHandler):
   def redirect_request(self,*args,**kwargs):
    return None
  opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect(),
  urllib.request.HTTPSHandler(context=ssl.create_default_context(cafile='registry-ca.crt')))
  headers={'Authorization':'Basic '+base64.b64encode((source['username']+':'+os.environ['REGISTRY_PASSWORD']).encode()).decode(),
  'Accept':'application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json'}
  def manifest(reference):
   request=urllib.request.Request('https://'+source['endpoint']+'/v2/parcel/manifests/'+reference,headers=headers)
   with opener.open(request,timeout=2) as response:
    body=response.read(2097153)
    assert len(body)<=2097152
    digest='sha256:'+hashlib.sha256(body).hexdigest()
    assert response.headers.get('Docker-Content-Digest')==digest
    return digest

  from dq_check import registry_credentials
  import subprocess
  contract=json.loads(Path('/run/dq/facts/0/registry-consumer.json').read_text())
  target=json.loads(Path('/run/dq/facts/0/registry-target.json').read_text())
  assert manifest(target['image'].split('@',1)[1])==target['image'].split('@',1)[1]
  secret=json.loads(subprocess.check_output(['kubectl','get','secret',contract['secret_name'],'-o','json'],timeout=2))
  assert secret['metadata']['uid']==contract['secret_uid']
  assert registry_credentials(secret,source['endpoint'],source['username'],os.environ['REGISTRY_PASSWORD'])


  import json,subprocess
  from pathlib import Path
  from dq_check import current_pods,pod_worker,ready_image,workload_worker,pull_secret_names
  def k(*args):
   return json.loads(subprocess.check_output(['kubectl',*args,'-o','json'],timeout=2))
  contract=json.loads(Path('/run/dq/facts/0/registry-consumer.json').read_text())
  old=contract['deployment']
  deployment=k('get','deployment','board')
  assert deployment['metadata']['uid']==old['metadata']['uid']
  assert deployment['spec']['selector']==old['spec']['selector']
  assert deployment['spec']['template']['spec']==old['spec']['template']['spec']
  worker=workload_worker(deployment)
  active=current_pods(deployment,k('get','replicasets'),k('get','pods'))
  assert len(active)==1
  for pod in active:
   assert ready_image(pod,worker['image'])
   assert pod_worker(pod).get('imagePullPolicy')=='Always'
   assert pull_secret_names(pod)=={contract['secret_name']}
   assert pod_worker(pod).get('command')==worker.get('command')
   assert pod_worker(pod).get('args')==worker.get('args')

  print('OK')
  VERIFY_RELEASE
  ```

  Oczekiwane: OK. Dane uwierzytelniające nie są wypisywane.
phrases.0: Przywróciłem usługę obrazów przed ponownym uruchomieniem consumers.
phrases.1: Użyłem odzyskiwania o wąskim zakresie control bez dostępu do hosta.
phrases.2: Sprawdzałem osobno rejestr TLS, obraz identity i aplikację HTTP.
stages.0.objectives.0.text: Dostarczony endpoint rejestru przyjmuje uwierzytelniony odczyt `/v2/` przez zweryfikowany
  TLS.
stages.1.objectives.0.text: Pierwotne dane dostępu i CA pozostają ważne, a pierwotny pull Secret zawiera dostarczone
  prywatne dane uwierzytelniające.
stages.1.objectives.1.text: Deployment `board` i gotowy kontener w aktywnym Podzie używają istniejącego niezmiennego
  prywatnego obrazu wydania z polityką pobierania `Always`.
stages.1.objectives.2.text: Pierwotny Deployment zachowuje specyfikację poda, ma `1` replikę i kończy rollout z
  jednym aktywnym należącym do niego podem, zatwierdzonym skrótem, `Always` i pierwotnym pull Secret.
stages.1.objectives.3.text: Wewnątrz Poda Deployment `board` adres `http://127.0.0.1:8080` zwraca `north-78`.
guides.reference_1: Dokumentacja API i diagnostyki
guides.reference_2: Dokumentacja weryfikacji publikacji i konsumentów
diagnostics.registry_start: Pierwotny registry jest zatrzymany; złóż obsługiwane żądanie action:start i poczekaj na odpytywanie celów. Brak/błędna struktura żądania, TLS-trust lub autoryzacja mogą blokować pierwotny HTTPS API. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=private-registry-original-start-interface)
diagnostics.probe_1_0: Dostarczony pull Secret ma stary password; popraw credentials bez odtwarzania UID, zachowując pierwotne registry credentials i CA. Niegotowy image, zmienione źródło/trust, błąd manifestu lub obserwacji też daje fallback. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=private-registry-original-authority-and-pull-credential)
diagnostics.registry_pull_policy: Zadeklarowany image, polityka Always lub odwołanie registry-pull może się różnić albo gotowy Pod nie zgłasza oczekiwanego digest; zachowaj dostarczoną pull policy i sprawdź żywy wynik image. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=private-registry-declared-always-pull-and-ready-digest)
diagnostics.probe_1_2: Deployment zaczyna od zera replik; skaluj pierwotny controller do jednej po naprawie Secret. Zmienione UID/template, niegotowy lub dodatkowy własny Pod, błędne pull odwołanie albo rollout/API też naruszają kontrolę. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=private-registry-original-controller-and-one-ready-consumer)
diagnostics.registry_http: Pierwotny odbiorca może nadal być niedostępny po image pull lub zwracać inną trasę; sprawdź rollout i rzeczywisty HTTP worker zamiast samej gotowości registry. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=private-registry-running-consumer-response)
