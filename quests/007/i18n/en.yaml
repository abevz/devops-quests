title: ConfigMap environment
brief: 'You joined SignalRail operations. A dispatcher read the old route name. Work in ~/quest. Keep
  all changes inside this training bay.


  Inputs in `~/quest`: `dispatch.json`, `deployment.json`.


  The bay has no Internet or external DNS. Use only its supplied files, preloaded images and private services.
  All changes must stay inside this bay.


  Initial success criteria: The running dispatcher reads north.'
stages.0.brief: 'Set the live dispatcher route to north. A file edit alone is not enough.


  Success criteria: The running dispatcher reads north.'
stages.0.objectives.0.text: The running dispatcher reads north.
hints.0.text: Inspect the ConfigMap and the running pod environment.
hints.1.text: Existing environment values do not refresh when a ConfigMap changes.
hints.2.text: Set dispatch route=north, restart the deployment and verify printenv ROUTE.
debrief: The ConfigMap contained a retired route. You changed it and restarted the pod because environment
  values do not refresh in an existing process.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked the workload state and its readiness after the change.
