title: ConfigMap environment
brief: |-
  The routing process reports an outdated route.

  Work on the workstation in `~/quest` with the supplied files:
  - `dispatch.yaml`, `deployment.yaml`.

  **Requirements:**

  - Route of the running process in Deployment `relay`:
    - Environment variable: `ROUTE`.
    - Value: `north`.

  The observed process value does not prove which configuration or lifecycle change produced it.
stages.0.brief: The observed route belongs to the running process.
stages.0.objectives.0.text: Deployment `relay` exposes `ROUTE` with value `north`.
hints.0.text: |
  Existing environment values do not refresh when a ConfigMap changes. A file edit alone is not enough.
hints.1.text: |-
  Inspect the ConfigMap and the running pod environment.

  Inspect the supplied inputs and live observations:

  ```sh
  kubectl get configmap -o yaml
  kubectl describe deployment relay
  ```
hints.2.text: 'Set dispatch route=north, restart the deployment and verify printenv ROUTE.


  Verify the result from `~/quest` on the workstation:


  - `kubectl get pods -l app=relay` — shows the running routing Pod.

  - `kubectl exec deployment/relay -c worker -- sh -c ''printf "Active route: %s\n" "$ROUTE"''` — reports `north` from the active process''s `ROUTE`.'
debrief: The ConfigMap contained a retired route. You changed it and restarted the pod because environment
  values do not refresh in an existing process.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked the workload state and its readiness after the change.
