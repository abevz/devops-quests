title: ConfigMap-Umgebung
brief: |-
  Die Disposition meldet eine veraltete Route.

  Arbeiten Sie auf der Workstation in `~/quest` mit den bereitgestellten Dateien:
  - `dispatch.yaml`, `deployment.yaml`.

  **Anforderungen:**

  - Route des laufenden Prozesses in Deployment `relay`:
    - Umgebungsvariable: `ROUTE`.
    - Wert: `north`.

  Der beobachtete Prozesswert beweist nicht, welche Konfigurations- oder Lebenszyklusänderung ihn erzeugte.
stages.0.brief: Die beobachtete Route gehört zum laufenden Prozess.
stages.0.objectives.0.text: Deployment `relay` stellt `ROUTE` mit dem Wert `north` bereit.
hints.0.text: |-
  Ein Container übernimmt beim Start seine Umgebungsvariablen aus der ConfigMap.
hints.1.text: |-
  Prüfe den Schlüssel `route` in `dispatch`, das Deployment `relay` und `ROUTE` im laufenden Container `worker`. Setze `route` auf `north` und starte das Deployment neu, damit der neue Pod den Wert einliest.

  ```sh
  kubectl get configmap -o yaml
  kubectl describe deployment relay
  kubectl exec deployment/relay -c worker -- printenv ROUTE
  ```
hints.2.text: |-
  Prüfe nach dem Rollout, ob der laufende Prozess den Wert `north` in `ROUTE` hat.

  - `kubectl get pods -l app=relay` — zeigt den laufenden Pod der Disposition.
  - `kubectl exec deployment/relay -c worker -- sh -c 'printf "Active route: %s\n" "$ROUTE"'` — meldet `north` aus `ROUTE` des aktiven Prozesses.
debrief: Der ConfigMap enthielt einen retired route. Sie haben es geändert und pod neu gestartet, da Umgebungswerte
  in einem vorhandenen Prozess nicht aktualisiert werden.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe den workload-Status und seine Bereitschaft nach der Änderung überprüft.
diagnostics.condition_0: |-
  Worker liest den ConfigMap-Wert beim Start. Wenn die ConfigMap schon korrigiert ist, kann der laufende Pod noch den alten Wert verwenden. [Leitfaden](guides#guide=kubernetes-12&section=relay-route-env)
