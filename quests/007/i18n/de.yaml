title: ConfigMap-Umgebung
brief: |
  Die Disposition meldet eine veraltete Route.

  Arbeiten Sie auf der Workstation in `~/quest` mit `dispatch.yaml`, `deployment.yaml`.

  **Anforderungen:**
  - Route des laufenden Prozesses in Deployment `relay`:
    - Umgebungsvariable: `ROUTE`.
    - Wert: `north`.

  **Selbstprüfung vor Check & finish:**
  - `kubectl get pods -l app=relay` — zeigt den laufenden Pod der Disposition.
  - `kubectl exec deployment/relay -- sh -c 'printf "Active route: %s\n" "$ROUTE"'` — meldet `north` aus `ROUTE` des aktiven Prozesses.
stages.0.brief: |
  Die aktive Disposition muss das vorgesehene Ziel verwenden.
stages.0.objectives.0.text: Deployment `relay` stellt `ROUTE` mit dem Wert `north` bereit.
hints.0.text: Überprüfen Sie die Umgebung ConfigMap und die laufende pod-Umgebung.
hints.1.text: |
  Vorhandene Umgebungswerte werden nicht aktualisiert, wenn sich ein ConfigMap ändert. Eine Dateiänderung allein reicht nicht aus.
hints.2.text: Legen Sie dispatch route=north fest, starten Sie die Bereitstellung neu und überprüfen Sie
  die printenv-ROUTE.
debrief: Der ConfigMap enthielt einen retired route. Sie haben es geändert und pod neu gestartet, da Umgebungswerte
  in einem vorhandenen Prozess nicht aktualisiert werden.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe den workload-Status und seine Bereitschaft nach der Änderung überprüft.
