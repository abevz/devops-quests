title: ConfigMap-Umgebung
brief: 'Sie sind dem Betrieb SignalRail beigetreten. Ein dispatcher liest den alten route-Namen. Arbeiten
  Sie in ~/quest.. Bewahren Sie alle Änderungen in diesem Schulungsbereich auf.


  Eingänge in `~/quest`: `dispatch.json`, `deployment.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur die bereitgestellten Dateien,
  vorinstallierten Bilder und privaten Dienste. Alle Änderungen müssen innerhalb dieser Bucht bleiben.


  Erste Erfolgskriterien: Der laufende dispatcher lautet north.'
stages.0.brief: 'Stellen Sie den Live-dispatcher route auf north ein. Eine Dateibearbeitung allein reicht
  nicht aus.


  Erfolgskriterium: Der laufende dispatcher lautet north.'
stages.0.objectives.0.text: Der laufende dispatcher lautet north.
hints.0.text: Überprüfen Sie die Umgebung ConfigMap und die laufende pod-Umgebung.
hints.1.text: Vorhandene Umgebungswerte werden nicht aktualisiert, wenn sich ein ConfigMap ändert.
hints.2.text: Legen Sie dispatch route=north fest, starten Sie die Bereitstellung neu und überprüfen Sie
  die printenv-ROUTE.
debrief: Der ConfigMap enthielt einen retired route. Sie haben es geändert und pod neu gestartet, da Umgebungswerte
  in einem vorhandenen Prozess nicht aktualisiert werden.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe den workload-Status und seine Bereitschaft nach der Änderung überprüft.
