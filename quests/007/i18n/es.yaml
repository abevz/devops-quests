title: Entorno ConfigMap
brief: |-
  El despachador informa de una ruta obsoleta.

  Trabaja en la workstation en `~/quest` con los archivos suministrados:
  - `dispatch.yaml`, `deployment.yaml`.

  **Requisitos:**

  - Ruta del proceso en ejecución en Deployment `relay`:
    - Variable de entorno: `ROUTE`.
    - Valor: `north`.

  El valor observado del proceso no demuestra qué cambio de configuración o ciclo de vida lo produjo.
stages.0.brief: La ruta observada pertenece al proceso en ejecución.
stages.0.objectives.0.text: El Deployment `relay` expone `ROUTE` con el valor `north`.
hints.0.text: |-
  Un contenedor recibe del ConfigMap sus variables de entorno al arrancar.
hints.1.text: |-
  Revisa la clave `route` de `dispatch`, el Deployment `relay` y `ROUTE` en el contenedor `worker` en ejecución. Asigna `north` a `route` y reinicia el Deployment para que el nuevo Pod lea ese valor.

  ```sh
  kubectl get configmap -o yaml
  kubectl describe deployment relay
  kubectl exec deployment/relay -c worker -- printenv ROUTE
  ```
hints.2.text: |-
  Tras el despliegue, confirma que el proceso en ejecución tiene el valor `north` en `ROUTE`.

  - `kubectl get pods -l app=relay` — muestra el Pod del despachador en ejecución.
  - `kubectl exec deployment/relay -c worker -- sh -c 'printf "Active route: %s\n" "$ROUTE"'` — muestra `north` desde `ROUTE` del proceso activo.
debrief: El ConfigMap contenía un retired route. Lo cambió y reinició pod porque los valores del entorno
  no se actualizan en un proceso existente.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el estado de workload y su preparación después del cambio.
diagnostics.condition_0: |-
  Worker recibe el valor del ConfigMap al iniciar. Si el ConfigMap ya es correcto, el Pod en ejecución aún puede conservar el valor anterior. [Guía](guides#guide=kubernetes-12&section=relay-route-env)
