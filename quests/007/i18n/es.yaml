title: Entorno ConfigMap
brief: 'Te uniste a las operaciones de SignalRail. Un dispatcher lee el antiguo nombre route. Trabajar
  en ~/quest. Mantenga todos los cambios dentro de esta bahía de entrenamiento.


  Entradas en `~/quest`: `dispatch.json`, `deployment.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente los archivos suministrados, las imágenes
  precargadas y los servicios privados. Todos los cambios deben permanecer dentro de esta bahía.


  Criterios de éxito iniciales: El dispatcher en ejecución dice north.'
stages.0.brief: 'Configure el dispatcher route en vivo en north. La edición de un archivo por sí sola
  no es suficiente.


  Criterios de éxito: El dispatcher en ejecución dice north.'
stages.0.objectives.0.text: El dispatcher en ejecución dice north.
hints.0.text: Inspeccione el ConfigMap y el entorno pod en ejecución.
hints.1.text: Los valores del entorno existente no se actualizan cuando cambia un ConfigMap.
hints.2.text: Configure dispatch route=north, reinicie la implementación y verifique la RUTA printenv.
debrief: El ConfigMap contenía un retired route. Lo cambió y reinició pod porque los valores del entorno
  no se actualizan en un proceso existente.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el estado de workload y su preparación después del cambio.
