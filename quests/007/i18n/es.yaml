title: Entorno ConfigMap
brief: |
  El despachador informa de una ruta obsoleta.

  Trabaja en la workstation en `~/quest` con `dispatch.json`, `deployment.json`.

  **Requisitos:**
  - Ruta del proceso en ejecución en Deployment `relay`:
    - Variable de entorno: `ROUTE`.
    - Selecciona la ruta hacia el norte.

  **Verifica antes de Check & finish:**
  - `kubectl get pods -l app=relay` — muestra el Pod del despachador en ejecución.
  - `kubectl exec deployment/relay -- sh -c 'printf "Active route: %s\n" "$ROUTE"'` — muestra el destino hacia el norte desde `ROUTE` del proceso activo.
stages.0.brief: |
  El despachador activo debe usar el destino previsto.
stages.0.objectives.0.text: El Deployment `relay` expone `ROUTE` con el valor `north`.
hints.0.text: Inspeccione el ConfigMap y el entorno pod en ejecución.
hints.1.text: |
  Los valores del entorno existente no se actualizan cuando cambia un ConfigMap. Editar solo un archivo no es suficiente.
hints.2.text: Configure dispatch route=north, reinicie la implementación y verifique la RUTA printenv.
debrief: El ConfigMap contenía un retired route. Lo cambió y reinició pod porque los valores del entorno
  no se actualizan en un proceso existente.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el estado de workload y su preparación después del cambio.
