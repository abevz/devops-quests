title: Środowisko ConfigMap
brief: |-
  Dyspozytor zgłasza nieaktualną trasę.

  Pracuj na workstation w `~/quest` z dostarczonymi plikami:
  - `dispatch.yaml`, `deployment.yaml`.

  **Wymagania:**

  - Trasa działającego procesu w Deployment `relay`:
    - Zmienna środowiskowa: `ROUTE`.
    - Wartość: `north`.

  Zaobserwowana wartość procesu nie dowodzi, jaka zmiana konfiguracji lub cyklu życia ją spowodowała.
stages.0.brief: Obserwowana trasa należy do działającego procesu.
stages.0.objectives.0.text: Deployment `relay` udostępnia `ROUTE` o wartości `north`.
hints.0.text: |
  Istniejące wartości środowiska nie są odświeżane po zmianie ConfigMap. Sama edycja pliku nie wystarczy.
hints.1.text: |-
  Sprawdź ConfigMap i działające środowisko pod.

  Sprawdź dostarczone dane i bieżące obserwacje:

  ```sh
  kubectl get configmap -o yaml
  kubectl describe deployment relay
  ```
hints.2.text: |-
  Ustaw dispatch route=north, uruchom ponownie wdrożenie i sprawdź printenv ROUTE.

  Sprawdź wynik z `~/quest` na workstation:

  - `kubectl get pods -l app=relay` — pokazuje działający Pod dyspozytora.
  - `kubectl exec deployment/relay -- sh -c 'printf "Active route: %s\n" "$ROUTE"'` — pokazuje `north` z `ROUTE` aktywnego procesu.
debrief: ConfigMap zawierał wycofaną trasę. Zmieniłeś to i ponownie uruchomiłeś moduł, ponieważ wartości
  środowiska nie są odświeżane w istniejącym procesie.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
