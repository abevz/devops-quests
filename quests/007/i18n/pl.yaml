title: Środowisko ConfigMap
brief: 'Dołączyłeś do operacji SignalRail. dispatcher odczytał starą nazwę trasy. Pracuj w ~/quest.. Wszystkie
  zmiany przechowuj w tej komorze szkoleniowej.


  Wejścia w `~/quest`: `dispatch.json`, `deployment.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Wszystkie zmiany muszą pozostać w tej zatoce.


  Początkowe kryteria sukcesu: działający dispatcher czyta north.'
stages.0.brief: 'Ustaw aktualną trasę dispatcher na north. Sama edycja pliku nie wystarczy.


  Kryteria sukcesu: działający dispatcher brzmi north.'
stages.0.objectives.0.text: Działający dispatcher czyta north.
hints.0.text: Sprawdź ConfigMap i działające środowisko pod.
hints.1.text: Istniejące wartości środowiska nie są odświeżane po zmianie ConfigMap.
hints.2.text: Ustaw dispatch route=north, uruchom ponownie wdrożenie i sprawdź printenv ROUTE.
debrief: ConfigMap zawierał wycofaną trasę. Zmieniłeś to i ponownie uruchomiłeś moduł, ponieważ wartości
  środowiska nie są odświeżane w istniejącym procesie.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
