title: Środowisko ConfigMap
brief: |
  Dyspozytor zgłasza nieaktualną trasę.

  Pracuj na workstation w `~/quest` z plikami `dispatch.json`, `deployment.json`.

  **Wymagania:**
  - Trasa działającego procesu w Deployment `relay`:
    - Zmienna środowiskowa: `ROUTE`.
    - Wybiera trasę na północ.

  **Sprawdź przed Check & finish:**
  - `kubectl get pods -l app=relay` — pokazuje działający Pod dyspozytora.
  - `kubectl exec deployment/relay -- sh -c 'printf "Active route: %s\n" "$ROUTE"'` — pokazuje kierunek na północ z `ROUTE` aktywnego procesu.
stages.0.brief: |
  Aktywny dyspozytor musi używać właściwego kierunku.
stages.0.objectives.0.text: Deployment `relay` udostępnia `ROUTE` o wartości `north`.
hints.0.text: Sprawdź ConfigMap i działające środowisko pod.
hints.1.text: |
  Istniejące wartości środowiska nie są odświeżane po zmianie ConfigMap. Sama edycja pliku nie wystarczy.
hints.2.text: Ustaw dispatch route=north, uruchom ponownie wdrożenie i sprawdź printenv ROUTE.
debrief: ConfigMap zawierał wycofaną trasę. Zmieniłeś to i ponownie uruchomiłeś moduł, ponieważ wartości
  środowiska nie są odświeżane w istniejącym procesie.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
