title: Środowisko ConfigMap
brief: |-
  Dyspozytor zgłasza nieaktualną trasę.

  Pracuj na workstation w `~/quest` z dostarczonymi plikami:
  - `dispatch.yaml`, `deployment.yaml`.

  **Wymagania:**

  - Trasa działającego procesu w Deployment `relay`:
    - Zmienna środowiskowa: `ROUTE`.
    - Wartość: `north`.

  Zaobserwowana wartość procesu nie dowodzi, jaka zmiana konfiguracji lub cyklu życia ją spowodowała.
stages.0.brief: Obserwowana trasa należy do działającego procesu.
stages.0.objectives.0.text: Deployment `relay` udostępnia `ROUTE` o wartości `north`.
hints.0.text: |-
  Kontener pobiera zmienne środowiskowe z ConfigMap przy starcie.
hints.1.text: |-
  Sprawdź klucz `route` w `dispatch`, Deployment `relay` i `ROUTE` w działającym kontenerze `worker`. Ustaw `route` na `north` i uruchom ponownie Deployment, aby nowy Pod odczytał tę wartość.

  ```sh
  kubectl get configmap -o yaml
  kubectl describe deployment relay
  kubectl exec deployment/relay -c worker -- printenv ROUTE
  ```
hints.2.text: |-
  Po zakończeniu wdrożenia sprawdź, czy działający proces ma wartość `north` w `ROUTE`.

  - `kubectl get pods -l app=relay` — pokazuje działający Pod dyspozytora.
  - `kubectl exec deployment/relay -c worker -- sh -c 'printf "Active route: %s\n" "$ROUTE"'` — pokazuje `north` z `ROUTE` aktywnego procesu.
debrief: ConfigMap zawierał wycofaną trasę. Zmieniłeś to i ponownie uruchomiłeś moduł, ponieważ wartości
  środowiska nie są odświeżane w istniejącym procesie.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
diagnostics.condition_0: |-
  Worker odczytuje wartość ConfigMap przy starcie. Jeśli ConfigMap jest już poprawna, działający Pod może nadal mieć starą wartość. [Przewodnik](guides#guide=kubernetes-12&section=relay-route-env)
