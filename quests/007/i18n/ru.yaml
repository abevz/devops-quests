title: Окружение из ConfigMap
brief: 'Вы в команде эксплуатации SignalRail. Диспетчер получил старое имя маршрута. Работайте в ~/quest.
  Все изменения — только в этой песочнице.


  Входные файлы в `~/quest`: `dispatch.json`, `deployment.json`.


  В песочнице нет интернета и внешнего DNS. Используйте только выданные файлы, предварительно загруженные
  образы и приватные сервисы. Все изменения — только в этой песочнице.


  Цели первого этапа: Работающий dispatcher читает north.'
stages.0.brief: 'Установите north в работающем dispatcher. Одной правки файла недостаточно.


  Результат проверки: Работающий dispatcher читает north.'
stages.0.objectives.0.text: Работающий dispatcher читает north.
hints.0.text: Проверьте ConfigMap и окружение работающего pod.
hints.1.text: Окружение существующего процесса не обновляется при изменении ConfigMap.
hints.2.text: Укажите route=north в dispatch, перезапустите Deployment и проверьте printenv ROUTE.
debrief: 'ConfigMap содержал старый маршрут. Вы исправили его и перезапустили pod: окружение работающего
  процесса не обновляется автоматически.'
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: После изменения я проверил состояние workload и его готовность.
