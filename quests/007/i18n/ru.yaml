title: Окружение из ConfigMap
brief: |-
  Диспетчер сообщает об устаревшем маршруте.

  Работайте на workstation в `~/quest` с предоставленными файлами:
  - `dispatch.yaml`, `deployment.yaml`.

  **Требования:**

  - Маршрут работающего процесса в Deployment `relay`:
    - Переменная окружения: `ROUTE`.
    - Значение: `north`.

  Наблюдаемое значение процесса не доказывает, какое изменение конфигурации или жизненного цикла к нему привело.
stages.0.brief: Наблюдаемый маршрут относится к работающему процессу.
stages.0.objectives.0.text: В Deployment `relay` переменная `ROUTE` имеет значение `north`.
hints.0.text: |-
  Контейнер получает переменные окружения из ConfigMap при запуске.
hints.1.text: |-
  Проверьте ключ `route` в `dispatch`, Deployment `relay` и `ROUTE` у запущенного контейнера `worker`. Установите `route` в `north` и перезапустите Deployment, чтобы новый Pod получил это значение.

  ```sh
  kubectl get configmap -o yaml
  kubectl describe deployment relay
  kubectl exec deployment/relay -c worker -- printenv ROUTE
  ```
hints.2.text: |-
  После завершения обновления проверьте, что запущенный процесс получил значение `north` в `ROUTE`.

  - `kubectl get pods -l app=relay` — показывает работающий Pod диспетчера.
  - `kubectl exec deployment/relay -c worker -- sh -c 'printf "Active route: %s\n" "$ROUTE"'` — показывает `north` из `ROUTE` работающего процесса.
debrief: 'ConfigMap содержал старый маршрут. Вы исправили его и перезапустили pod: окружение работающего
  процесса не обновляется автоматически.'
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: После изменения я проверил состояние workload и его готовность.
diagnostics.condition_0: |-
  Worker получает значение из ConfigMap при запуске. Если ConfigMap уже исправлена, работающий Pod всё ещё может использовать старое значение. [Гайд](guides#guide=kubernetes-12&section=relay-route-env)
