title: Окружение из ConfigMap
brief: |
  Диспетчер сообщает об устаревшем маршруте.

  Работайте на workstation в `~/quest` с файлами `dispatch.yaml`, `deployment.yaml`.

  **Требования:**
  - Маршрут работающего процесса в Deployment `relay`:
    - Переменная окружения: `ROUTE`.
    - Значение: `north`.

  **Самопроверка перед Check & finish:**
  - `kubectl get pods -l app=relay` — показывает работающий Pod диспетчера.
  - `kubectl exec deployment/relay -- sh -c 'printf "Active route: %s\n" "$ROUTE"'` — показывает `north` из `ROUTE` работающего процесса.
stages.0.brief: |
  Работающий диспетчер должен использовать нужное направление.
stages.0.objectives.0.text: В Deployment `relay` переменная `ROUTE` имеет значение `north`.
hints.0.text: Проверьте ConfigMap и окружение работающего pod.
hints.1.text: |
  Окружение существующего процесса не обновляется при изменении ConfigMap. Одного изменения файла недостаточно.
hints.2.text: Укажите route=north в dispatch, перезапустите Deployment и проверьте printenv ROUTE.
debrief: 'ConfigMap содержал старый маршрут. Вы исправили его и перезапустили pod: окружение работающего
  процесса не обновляется автоматически.'
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: После изменения я проверил состояние workload и его готовность.
