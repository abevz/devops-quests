title: Wyjście NetworkPolicy i DNS
brief: 'client jest izolowany przez politykę egress default-deny. Zezwalaj DNS na moduły kube-system oznaczone
  k8s-app: kube-dns na UDP/TCP 53 i TCP 8080 tylko na app: board w tym namespace. Utrzymuj usługę closed
  w stanie nieosiągalnym. Użyj koniunkcji namespace+Pod selectors dla DNS, a nie zezwalaj na szeroki klaster.
  Przetestuj prawdziwe ścieżki DNS, dozwolone HTTP i zabronione ścieżki HTTP.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `board.json`, `closed.json`,
  `client.json`, `service.json`, `closed-service.json`, `egress.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: client DNS i board HTTP działają, podczas gdy ścieżka closed HTTP pozostaje
  odrzucona.'
debrief: Łączność została przywrócona z jawnymi przepływami zależności, a nie wyjątkiem allow-all.
stages.0.brief: 'Kryteria sukcesu: client DNS i board HTTP działają, podczas gdy zamknięta ścieżka HTTP
  pozostaje odrzucona.'
stages.0.objectives.0.text: client DNS i board HTTP działają, podczas gdy zamknięta ścieżka HTTP pozostaje
  odrzucona.
hints.0.text: Wybranie Pod z polityką ruchu wychodzącego zmienia jego domyślne zachowanie podczas ruchu
  wychodzącego.
hints.1.text: DNS potrzebuje UDP, a czasami TCP; umieść oba selektory w tym samym peer.
hints.2.text: Zezwól tylko na port DNS i board, a następnie przetestuj także zabronioną usługę.
phrases.0: Zachowałem DNS jako jawną zależność wyjścia.
phrases.1: Połączyłem przestrzeń nazw i selektory Pod w jednym peer.
phrases.2: Przetestowałem zarówno dozwolone, jak i zabronione ścieżki HTTP.
questions.0.points.0: namespaceSelector i podSelector w jednym peer są łączne.
questions.0.points.1: Oddzielne peers są alternatywą.
questions.0.prompt: Kiedy dwa selektory tworzą AND zamiast OR?
questions.1.points.0: NIE; DNS to osobna zależność sieciowa.
questions.1.points.1: Przetestuj oddzielnie rozpoznawanie nazw i ruch aplikacji.
questions.1.prompt: Czy działające żądanie IP dowodzi, że DNS jest dozwolone?
