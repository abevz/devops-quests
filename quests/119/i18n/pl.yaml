title: Wyjście NetworkPolicy i DNS
brief: |-
  Obciążenie wysyłające żądania nie osiąga wszystkich wymaganych celów. Przywróć wąsko ograniczony ruch wychodzący, zachowując izolację od zamkniętej usługi.

  Pracuj na workstation w `~/quest` z dostarczonymi plikami:
  - `board.yaml`, `closed.yaml`, `client.yaml`, `service.yaml`, `closed-service.yaml`, `egress.yaml`.

  **Requirements:**

  - Istniejąca polityka egress dotyczy tylko ruchu wychodzącego, izoluje tylko dostarczone obciążenie client i zezwala na ruch wychodzący tylko do DNS klastra oraz dostarczonej usługi HTTP board; żadna inna wybierająca polityka nie rozszerza dostępu.
  - Z Deployment `client` zapytanie A o `board.$DQ_NAMESPACE.svc.cluster.local.` kończy się powodzeniem.
  - Z Deployment `client` adres `http://board:8080` zwraca `north-119`.
  - IP Service `closed` na porcie `8080` zwraca `closed-119` do Deployment `board`, a takie samo żądanie z Deployment `client` kończy się niepowodzeniem.

  Samo nieudane żądanie nie dowodzi przyczyny; użyj dostępnego celu kontrolnego jako dowodu i zmieniaj tylko tę piaskownicę.
debrief: Ograniczone polityki egress oraz zaobserwowane DNS, odpowiedzi i nieudane żądanie client odpowiadały
  kontrolom.
stages.0.brief: Zachowaj izolację od osiągalnej zamkniętej usługi.
hints.0.text: Wybranie Pod z polityką ruchu wychodzącego zmienia jego domyślne zachowanie podczas ruchu
  wychodzącego. Wybrany Pod staje się izolowany dla ruchu wychodzącego. Każda kombinacja peer/port w regule
  jest dozwolona, a osobne reguły sumują uprawnienia.
hints.1.text: |-
  DNS potrzebuje UDP, a czasami TCP; umieść oba selektory w tym samym peer.

  Sprawdź dostarczone dane i bieżące obserwacje:

  ```sh
  kubectl get networkpolicies -o yaml
    kubectl get pods -l app=client --show-labels
  ```
hints.2.text: |-
  Zezwól tylko na port DNS i board, a następnie przetestuj także zabronioną usługę.

  Sprawdź wynik z `~/quest` na workstation:

  - Dozwolone żądania zwracają odpowiednio `north-119` i `closed-119`.

    ```sh
    kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080
    closed=$(kubectl get service closed -o jsonpath='{.spec.clusterIP}')
    kubectl exec deployment/board -- wget -qO- -T 3 "http://$closed:8080"
    ```

  - Żądanie izolowanego odbiorcy kończy się niezerowym kodem wyjścia.

    ```sh
    closed=$(kubectl get service closed -o jsonpath='{.spec.clusterIP}')
    kubectl exec deployment/client -- wget -qO- -T 2 "http://$closed:8080"
    ```

  Zapytanie A kończy się powodzeniem: `kubectl exec deployment/client -- nslookup -type=A "board.$DQ_NAMESPACE.svc.cluster.local."`.
phrases.0: Zachowałem DNS jako jawną zależność wyjścia.
phrases.1: Połączyłem przestrzeń nazw i selektory Pod w jednym peer.
phrases.2: Przetestowałem zarówno dozwolone, jak i zabronione ścieżki HTTP.
questions.0.points.0: namespaceSelector i podSelector w jednym peer są łączne.
questions.0.points.1: Oddzielne peers są alternatywą.
questions.0.prompt: Kiedy dwa selektory tworzą AND zamiast OR?
questions.1.points.0: NIE; DNS to osobna zależność sieciowa.
questions.1.points.1: Przetestuj oddzielnie rozpoznawanie nazw i ruch aplikacji.
questions.1.prompt: Czy działające żądanie IP dowodzi, że DNS jest dozwolone?
stages.0.objectives.0.text: Istniejąca polityka egress dotyczy tylko ruchu wychodzącego, izoluje tylko
  dostarczone obciążenie client i zezwala na ruch wychodzący tylko do DNS klastra oraz dostarczonej usługi
  HTTP board; żadna inna wybierająca polityka nie rozszerza dostępu.
stages.0.objectives.1.text: Z Deployment `client` zapytanie A o `board.$DQ_NAMESPACE.svc.cluster.local.`
  kończy się powodzeniem.
stages.0.objectives.2.text: Z Deployment `client` adres `http://board:8080` zwraca `north-119`.
stages.0.objectives.3.text: IP Service `closed` na porcie `8080` zwraca `closed-119` do Deployment `board`,
  a takie samo żądanie z Deployment `client` kończy się niepowodzeniem.
diagnostics.policies: Kontrola nie mogła pobrać listy NetworkPolicy. Sprawdź dostęp do bieżącej przestrzeni nazw i API przed oceną reguł. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q119-egress-policy-list)
diagnostics.pods: Lista podów client może być niedostępna lub pusta. Potwierdź obecność podów app=client przed oceną selektora. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q119-egress-client-label-input)
diagnostics.named: Polityka client-egress może nie istnieć lub być nieczytelna. Sprawdź nazwaną NetworkPolicy w przestrzeni client. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q119-client-egress-policy-object)
diagnostics.selector: PodSelector może wybierać inną aplikację lub zawężać zakres. Sprawdź równoważność z app=client. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q119-egress-only-client-selector)
diagnostics.types: Kontrola może widzieć brak Egress lub dodatkowy Ingress. Sprawdź, czy deklaracja zawiera wyłącznie Egress. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q119-egress-only-policy-type)
diagnostics.egress: Reguła egress może nie mieć celu lub portu, wskazywać obcy cel albo niejednoznaczny port nazwany. Sprawdź oba selektory DNS i lokalny cel board z pojedynczymi dozwolonymi portami. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q119-bounded-egress-peer-and-port)
diagnostics.unexpected: Pozornie poprawna reguła może pozwalać na dodatkowy protokół lub port. Porównaj każdą trójkę cel/protokół/port z wymaganym DNS i board. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q119-egress-unexpected-flow)
diagnostics.other_egress: Inna polityka egress wybierająca pod client może dodawać zakazany przepływ, bo zezwolenia się sumują. Sprawdź wskazaną politykę i jej przepływy względem dozwolonych. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q119-additive-egress-policy)
diagnostics.other_invalid: Nie udało się bezpiecznie zinterpretować selektora lub egress innej polityki. Sprawdź wskazany obiekt pod kątem nieobsługiwanych selektorów lub szerokich celów. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q119-unreadable-additive-policy)
diagnostics.invalid_input: W dokumentach może brakować polityk lub etykiet podów, albo JSON jest nieprawidłowy. Sprawdź czytelność obu odpowiedzi API przed analizą reguły. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q119-egress-observation-shape)
diagnostics.missing_dns_udp_53: Polityka może pomijać UDP 53 do podów DNS klastra. Sprawdź połączenie kube-system i kube-dns z właściwym portem UDP. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q119-client-egress-dns-udp)
diagnostics.missing_dns_tcp_53: UDP dla DNS może być dozwolone mimo braku TCP 53. Sprawdź zezwolenie TCP 53 dla tego samego celu DNS. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q119-client-egress-dns-tcp)
diagnostics.missing_board_tcp_8080: Zezwolenia DNS nie tworzą dostępu do aplikacji. Polityka może nie mieć TCP 8080 do lokalnych podów board. Sprawdź cel app=board i jego port. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q119-client-egress-board-http)
diagnostics.dns: Mimo deklaracji polityki DNS może być niedostępny z działającego client. Odpytaj pełną nazwę board z client i sprawdź powodzenie. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q119-live-board-name-resolution)
diagnostics.http: DNS może działać, choć client nie dociera do board na 8080 lub dostaje obcą treść. Odpytaj Service z client i porównaj z north-119. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q119-live-board-client-http)
diagnostics.closed_direct: Service closed może być niedostępny nawet z board. Potwierdź closed-119 w żądaniu kontrolnym przed powiązaniem błędu z client z egress. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q119-closed-service-control-request)
diagnostics.closed_denied: Szersze lub dodatkowe zezwolenie może umożliwiać client dostęp do closed. Sprawdź, czy żądanie bezpośrednie zawodzi, a kontrolne z board nadal dociera do closed. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q119-closed-service-client-denial)
diagnostics.probe_0_0: Kontrola polityki może przerwać działanie przed wskazaniem warunku, gdy proces lub wejścia zawodzą. Sprawdź Pythona i bieżące dane polityki i podów. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q119-egress-policy-observer-input)
