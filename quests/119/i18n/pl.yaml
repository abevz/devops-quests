title: Wyjście NetworkPolicy i DNS
brief: 'Pracuj w `~/quest`; przeczytaj `client.json`, `board.json`, `closed.json`, `service.json`, `closed-service.json` i `egress.json`. Klient jest początkowo izolowany przez `client-egress`. W Kubernetes każda reguła egress dopuszcza wszystkie połączenia jej odbiorców i portów; osobne reguły sumują dopuszczenia.


  Skonfiguruj `client-egress` z `podSelector` wybierającym dokładnie `app: client` i tylko `Egress`; użyj `matchLabels` albo równoważnego wyrażenia `In` z jedną wartością. Dopuść DNS UDP i TCP 53 do jednego odbiorcy łączącego etykietę przestrzeni nazw `kubernetes.io/metadata.name: kube-system` i etykietę poda `k8s-app: kube-dns`, a także TCP 8080 do poda z etykietą `app: board` w tej samej przestrzeni nazw. Użyj dokładnie tych selektorów etykiet do wskazania dostarczonych celów; kolejność reguł i portów można zmienić lub je podzielić. Inne polityki wybierające klienta nie mogą rozszerzać egress.


  Sprawdź DNS klienta dla `board.$DQ_NAMESPACE.svc.cluster.local.`, HTTP klienta `board:8080` zwracający `north-119` oraz nieudane żądanie klienta do IP usługi `closed` na porcie 8080. Kontrolne żądanie z board do tego IP musi zwrócić `closed-119`, co pokazuje dostępność celu z innego poda. Sama porażka żądania klienta nie dowodzi jej przyczyny. Pracuj tylko w zatoce offline.'
debrief: Ograniczone polityki egress oraz zaobserwowane DNS, odpowiedzi i nieudane żądanie client odpowiadały kontrolom.
stages.0.brief: Polityka dopuszcza tylko opisane przepływy DNS i board; DNS i HTTP klienta działają, żądanie do closed nie udaje się, a kontrola z board działa.
stages.0.objectives.0.text: Polityka dopuszcza tylko opisane przepływy DNS i board; DNS i HTTP klienta działają, żądanie do closed nie udaje się, a kontrola z board działa.
hints.0.text: Wybranie Pod z polityką ruchu wychodzącego zmienia jego domyślne zachowanie podczas ruchu
  wychodzącego.
hints.1.text: DNS potrzebuje UDP, a czasami TCP; umieść oba selektory w tym samym peer.
hints.2.text: Zezwól tylko na port DNS i board, a następnie przetestuj także zabronioną usługę.
phrases.0: Zachowałem DNS jako jawną zależność wyjścia.
phrases.1: Połączyłem przestrzeń nazw i selektory Pod w jednym peer.
phrases.2: Przetestowałem zarówno dozwolone, jak i zabronione ścieżki HTTP.
questions.0.points.0: namespaceSelector i podSelector w jednym peer są łączne.
questions.0.points.1: Oddzielne peers są alternatywą.
questions.0.prompt: Kiedy dwa selektory tworzą AND zamiast OR?
questions.1.points.0: NIE; DNS to osobna zależność sieciowa.
questions.1.points.1: Przetestuj oddzielnie rozpoznawanie nazw i ruch aplikacji.
questions.1.prompt: Czy działające żądanie IP dowodzi, że DNS jest dozwolone?
