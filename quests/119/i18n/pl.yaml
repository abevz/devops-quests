  HTTP board; żadna inna wybierająca polityka nie rozszerza dostępu.
stages.0.objectives.1.text: Z Deployment `client` zapytanie A o `board.$DQ_NAMESPACE.svc.cluster.local.`
  kończy się powodzeniem.
stages.0.objectives.2.text: Z Deployment `client` adres `http://board:8080` zwraca `north-119`.
stages.0.objectives.3.text: IP Service `closed` na porcie `8080` zwraca `closed-119` do Deployment `board`,
  a takie samo żądanie z Deployment `client` kończy się niepowodzeniem.
