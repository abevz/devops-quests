title: NetworkPolicy and DNS egress
brief: |-
  The requesting workload cannot reach all required destinations. Restore narrowly scoped egress while retaining isolation from the closed service.

  Work on the workstation in `~/quest` with the supplied files:
  - `board.yaml`, `closed.yaml`, `client.yaml`, `service.yaml`, `closed-service.yaml`, `egress.yaml`.

  **Requirements:**

  - The existing egress policy applies only to outbound traffic, isolates only the supplied client workload and permits outbound traffic only to cluster DNS and the supplied board HTTP service; no other selecting policy broadens access.
  - From Deployment `client`, the A lookup for `board.$DQ_NAMESPACE.svc.cluster.local.` succeeds.
  - From Deployment `client`, `http://board:8080` returns `north-119`.
  - The `closed` Service IP on port `8080` returns `closed-119` to Deployment `board`, while the same request from Deployment `client` fails.

  A failed request alone does not prove its cause; use the reachable control destination as evidence, and change only this bay.
debrief: The bounded egress policies and observed DNS, responses and failed client request matched the
  checks.
stages.0.brief: Preserve isolation from the reachable closed service.
hints.0.text: Selecting a Pod with an egress policy changes its default egress behavior. A selected Pod
  becomes isolated for egress. Every peer/port combination within one rule is allowed, and separate rules
  add their allowances.
hints.1.text: |-
  DNS needs UDP and sometimes TCP; put both selectors in the same peer.

  Inspect the supplied inputs and live observations:

  ```sh
  kubectl get networkpolicies -o yaml
    kubectl get pods -l app=client --show-labels
  ```
hints.2.text: |-
  Allow only DNS and the board port, then test the forbidden service too.

  Verify the result from `~/quest` on the workstation:

  - The allowed requests return `north-119` and `closed-119`, respectively.

    ```sh
    kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080
    closed=$(kubectl get service closed -o jsonpath='{.spec.clusterIP}')
    kubectl exec deployment/board -- wget -qO- -T 3 "http://$closed:8080"
    ```

  - The isolated consumer request fails with nonzero exit status.

    ```sh
    closed=$(kubectl get service closed -o jsonpath='{.spec.clusterIP}')
    kubectl exec deployment/client -- wget -qO- -T 2 "http://$closed:8080"
    ```

  The A lookup succeeds: `kubectl exec deployment/client -- nslookup -type=A "board.$DQ_NAMESPACE.svc.cluster.local."`.
phrases.0: I preserved DNS as an explicit egress dependency.
phrases.1: I combined namespace and Pod selectors in one peer.
phrases.2: I tested both allowed and denied HTTP paths.
questions.0.points.0: namespaceSelector and podSelector inside one peer are conjunctive.
questions.0.points.1: Separate peers are alternatives.
questions.0.prompt: When do two selectors form an AND rather than an OR?
questions.1.points.0: No; DNS is a separate network dependency.
questions.1.points.1: Test name resolution and application traffic separately.
questions.1.prompt: Does a working IP request prove DNS is allowed?
diagnostics.policies: Listing NetworkPolicies must succeed.
diagnostics.pods: Listing client Pods must succeed and return at least one Pod.
diagnostics.dns: DNS lookup of board from client must succeed.
diagnostics.http: The request from client to board:8080 must return north-119.
diagnostics.closed_direct: The request from board to closed:8080 must return closed-119.
diagnostics.closed_denied: The request from client to closed:8080 must fail.
diagnostics.named: There must be exactly one NetworkPolicy named client-egress.
diagnostics.selector: The client-egress podSelector must match exactly app:client.
diagnostics.types: The client-egress policyTypes must contain only Egress.
diagnostics.egress: client-egress peers and ports must use the bounded form described in the brief.
diagnostics.unexpected: client-egress must have no unexpected flow; the original diagnostic identifies
  its destination, protocol and port.
diagnostics.other_egress: Another NetworkPolicy selecting a client must not permit extra egress; its name
  is in the original diagnostic.
diagnostics.other_invalid: Another NetworkPolicy has an invalid selector or egress; its name is in the
  original diagnostic.
diagnostics.invalid_input: NetworkPolicies and client Pod labels must be readable in the expected format.
diagnostics.missing_dns_udp_53: client-egress must allow dns UDP 53.
diagnostics.missing_dns_tcp_53: client-egress must allow dns TCP 53.
diagnostics.missing_board_tcp_8080: client-egress must allow board TCP 8080.
stages.0.objectives.0.text: The existing egress policy applies only to outbound traffic, isolates only
  the supplied client workload and permits outbound traffic only to cluster DNS and the supplied board
  HTTP service; no other selecting policy broadens access.
stages.0.objectives.1.text: From Deployment `client`, the A lookup for `board.$DQ_NAMESPACE.svc.cluster.local.`
  succeeds.
stages.0.objectives.2.text: From Deployment `client`, `http://board:8080` returns `north-119`.
stages.0.objectives.3.text: The `closed` Service IP on port `8080` returns `closed-119` to Deployment
  `board`, while the same request from Deployment `client` fails.
