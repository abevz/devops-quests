title: NetworkPolicy and DNS egress
brief: |-
  The requesting workload cannot reach all required destinations. Restore narrowly scoped egress while retaining isolation from the closed service.

  Work on the workstation in `~/quest` with the supplied files:
  - `board.yaml`, `closed.yaml`, `client.yaml`, `service.yaml`, `closed-service.yaml`, `egress.yaml`.

  **Requirements:**

  - The existing egress policy applies only to outbound traffic, isolates only the supplied client workload and permits outbound traffic only to cluster DNS and the supplied board HTTP service; no other selecting policy broadens access.
  - From Deployment `client`, the A lookup for `board.$DQ_NAMESPACE.svc.cluster.local.` succeeds.
  - From Deployment `client`, `http://board:8080` returns `north-119`.
  - The `closed` Service IP on port `8080` returns `closed-119` to Deployment `board`, while the same request from Deployment `client` fails.

  A failed request alone does not prove its cause; use the reachable control destination as evidence, and change only this bay.
debrief: The bounded egress policies and observed DNS, responses and failed client request matched the
  checks.
stages.0.brief: Preserve isolation from the reachable closed service.
hints.0.text: Selecting a Pod with an egress policy changes its default egress behavior. A selected Pod
  becomes isolated for egress. Every peer/port combination within one rule is allowed, and separate rules
  add their allowances.
hints.1.text: |-
  Inspect the supplied policies and live observations. Compare the UDP and TCP DNS entries and the placement of the namespace and Pod selectors.

  Look at the selected `client` Pods and the peer selectors and ports for DNS and the intended Service. Inspect which separate egress rules could apply to those same Pods.

  ```sh
  kubectl get networkpolicies -o yaml
  kubectl get pods -l app=client --show-labels
  kubectl get services board closed
  ```
hints.2.text: |-
  Verify the result from `~/quest` on the workstation:

  - The allowed requests return `north-119` and `closed-119`, respectively.

    ```sh
    kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080
    closed=$(kubectl get service closed -o jsonpath='{.spec.clusterIP}')
    kubectl exec deployment/board -- wget -qO- -T 3 "http://$closed:8080"
    ```

  - The isolated consumer request fails with nonzero exit status.

    ```sh
    closed=$(kubectl get service closed -o jsonpath='{.spec.clusterIP}')
    kubectl exec deployment/client -- wget -qO- -T 2 "http://$closed:8080"
    ```

  The A lookup succeeds: `kubectl exec deployment/client -- nslookup -type=A "board.$DQ_NAMESPACE.svc.cluster.local."`.
phrases.0: I preserved DNS as an explicit egress dependency.
phrases.1: I combined namespace and Pod selectors in one peer.
phrases.2: I tested both allowed and denied HTTP paths.
questions.0.points.0: namespaceSelector and podSelector inside one peer are conjunctive.
questions.0.points.1: Separate peers are alternatives.
questions.0.prompt: When do two selectors form an AND rather than an OR?
questions.1.points.0: No; DNS is a separate network dependency.
questions.1.points.1: Test name resolution and application traffic separately.
questions.1.prompt: Does a working IP request prove DNS is allowed?
stages.0.objectives.0.text: The existing egress policy applies only to outbound traffic, isolates only
  the supplied client workload and permits outbound traffic only to cluster DNS and the supplied board
  HTTP service; no other selecting policy broadens access.
stages.0.objectives.1.text: From Deployment `client`, the A lookup for `board.$DQ_NAMESPACE.svc.cluster.local.`
  succeeds.
stages.0.objectives.2.text: From Deployment `client`, `http://board:8080` returns `north-119`.
stages.0.objectives.3.text: The `closed` Service IP on port `8080` returns `closed-119` to Deployment
  `board`, while the same request from Deployment `client` fails.
diagnostics.policies: The observer could not list NetworkPolicies. Check current namespace access and API availability before interpreting any policy results. [Cause and check](guides#guide=kubernetes-10&section=q119-egress-policy-list)
diagnostics.pods: The client Pod inventory may be unavailable or empty. Verify there are Pods with app=client before checking whether the policy selects them. [Cause and check](guides#guide=kubernetes-10&section=q119-egress-client-label-input)
diagnostics.named: The intended client-egress rule may be missing or unreadable. Inspect the named NetworkPolicy in the client namespace. [Cause and check](guides#guide=kubernetes-10&section=q119-client-egress-policy-object)
diagnostics.selector: The podSelector may match the wrong application or narrow the intended scope. Inspect whether it is equivalent to app=client. [Cause and check](guides#guide=kubernetes-10&section=q119-egress-only-client-selector)
diagnostics.types: The check may see a missing Egress type or an extra Ingress type. Verify that the policy declares only Egress. [Cause and check](guides#guide=kubernetes-10&section=q119-egress-only-policy-type)
diagnostics.egress: An egress rule may omit a destination or port, use an unrelated peer, or resolve a named port inconsistently. Check both DNS peer selectors and the local board peer with only individual allowed ports. [Cause and check](guides#guide=kubernetes-10&section=q119-bounded-egress-peer-and-port)
diagnostics.unexpected: A valid-looking rule may allow an additional protocol or port. Compare each destination/protocol/port tuple with the required DNS and board flows. [Cause and check](guides#guide=kubernetes-10&section=q119-egress-unexpected-flow)
diagnostics.other_egress: Another egress policy selecting a client Pod may add a forbidden flow because allowances are additive. Inspect the named policy and compare its allowed flows with the required set. [Cause and check](guides#guide=kubernetes-10&section=q119-additive-egress-policy)
diagnostics.other_invalid: The selector or egress rules of another policy could not be safely interpreted. Inspect the indicated object for unsupported selectors or broad destinations before judging effective access. [Cause and check](guides#guide=kubernetes-10&section=q119-unreadable-additive-policy)
diagnostics.invalid_input: The observed document may lack policy items or Pod labels, or the input may be invalid JSON. Check that both API observations are readable before diagnosing the rule. [Cause and check](guides#guide=kubernetes-10&section=q119-egress-observation-shape)
diagnostics.missing_dns_udp_53: The policy may omit UDP 53 to the supplied cluster DNS Pods. Check the peer combining kube-system and kube-dns with a matching UDP port. [Cause and check](guides#guide=kubernetes-10&section=q119-client-egress-dns-udp)
diagnostics.missing_dns_tcp_53: UDP DNS may be allowed while TCP 53 is missing. Check that the same supplied DNS peer also has a TCP 53 allowance. [Cause and check](guides#guide=kubernetes-10&section=q119-client-egress-dns-tcp)
diagnostics.missing_board_tcp_8080: DNS allowances do not provide the workload path. The policy may still lack TCP 8080 to the local board Pods. Inspect the app=board peer and its target port. [Cause and check](guides#guide=kubernetes-10&section=q119-client-egress-board-http)
diagnostics.dns: Declared policy may still leave DNS unavailable from the running client. Query the fully qualified board name from client and check whether lookup succeeds. [Cause and check](guides#guide=kubernetes-10&section=q119-live-board-name-resolution)
diagnostics.http: DNS may work while client cannot reach board on 8080 or receives unexpected content. Query the Service from client and compare with north-119. [Cause and check](guides#guide=kubernetes-10&section=q119-live-board-client-http)
diagnostics.closed_direct: The closed Service may be unavailable even from board. Check that the control request returns closed-119 before interpreting the client’s failed request as an egress effect. [Cause and check](guides#guide=kubernetes-10&section=q119-closed-service-control-request)
diagnostics.closed_denied: A broader or additive allowance may let client reach the closed Service. Check that this direct request fails while the board control still reaches closed. [Cause and check](guides#guide=kubernetes-10&section=q119-closed-service-client-denial)
diagnostics.probe_0_0: The policy observer can stop before assigning a condition if its local process or inputs fail. Check Python and the current policy and Pod observations. [Cause and check](guides#guide=kubernetes-10&section=q119-egress-policy-observer-input)
