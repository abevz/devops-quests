title: NetworkPolicy and DNS egress
brief: 'Work in `~/quest`; inspect `client.json`, `board.json`, `closed.json`, `service.json`, `closed-service.json` and `egress.json`.
  The requesting Pod starts isolated by `client-egress`. In Kubernetes, each egress rule allows every combination of its peers
  and ports; separate rules add their allowances.


  Configure `client-egress` with a `podSelector` selecting exactly `app: client` and only `Egress`; use `matchLabels` or an
  equivalent single-value `In` expression. Allow DNS UDP and TCP 53 to a single peer combining namespace label `kubernetes.io/metadata.name:
  kube-system` and Pod label `k8s-app: kube-dns`, and allow TCP 8080 to the same-namespace Pod label `app: board`. Use these
  exact label selectors to identify the supplied targets; rules and ports may be reordered or split. Other policies selecting
  that Pod must not add broader egress.


  Verify DNS from that Pod for `board.$DQ_NAMESPACE.svc.cluster.local.`, HTTP from that Pod `board:8080` returning `north-119`,
  and a failed request from that Pod to the `closed` Service IP on port 8080. A control request from board to that IP must
  return `closed-119`, showing the target is reachable from another Pod. A failed request from that Pod alone does not prove
  its cause. Work only inside the offline bay.'
debrief: The bounded egress policies and observed DNS, responses and failed client request matched the checks.
stages.0.brief: The policy permits only the specified DNS and board flows; DNS and HTTP from the selected Pod work, the closed
  request fails and the board control succeeds.
stages.0.objectives.0.text: The policy permits only the specified DNS and board flows; DNS and HTTP from the selected Pod
  work, the closed request fails and the board control succeeds.
hints.0.text: Selecting a Pod with an egress policy changes its default egress behavior.
hints.1.text: DNS needs UDP and sometimes TCP; put both selectors in the same peer.
hints.2.text: Allow only DNS and the board port, then test the forbidden service too.
phrases.0: I preserved DNS as an explicit egress dependency.
phrases.1: I combined namespace and Pod selectors in one peer.
phrases.2: I tested both allowed and denied HTTP paths.
questions.0.points.0: namespaceSelector and podSelector inside one peer are conjunctive.
questions.0.points.1: Separate peers are alternatives.
questions.0.prompt: When do two selectors form an AND rather than an OR?
questions.1.points.0: No; DNS is a separate network dependency.
questions.1.points.1: Test name resolution and application traffic separately.
questions.1.prompt: Does a working IP request prove DNS is allowed?
diagnostics.policies: Listing NetworkPolicies must succeed.
diagnostics.pods: Listing client Pods must succeed and return at least one Pod.
diagnostics.dns: DNS lookup of board from client must succeed.
diagnostics.http: The request from client to board:8080 must return north-119.
diagnostics.closed_direct: The request from board to closed:8080 must return closed-119.
diagnostics.closed_denied: The request from client to closed:8080 must fail.
diagnostics.named: There must be exactly one NetworkPolicy named client-egress.
diagnostics.selector: The client-egress podSelector must match exactly app:client.
diagnostics.types: The client-egress policyTypes must contain only Egress.
diagnostics.egress: client-egress peers and ports must use the bounded form described in the brief.
diagnostics.unexpected: client-egress must have no unexpected flow; the original diagnostic identifies its destination, protocol
  and port.
diagnostics.other_egress: Another NetworkPolicy selecting a client must not permit extra egress; its name is in the original
  diagnostic.
diagnostics.other_invalid: Another NetworkPolicy has an invalid selector or egress; its name is in the original diagnostic.
diagnostics.invalid_input: NetworkPolicies and client Pod labels must be readable in the expected format.
diagnostics.missing_dns_udp_53: client-egress must allow dns UDP 53.
diagnostics.missing_dns_tcp_53: client-egress must allow dns TCP 53.
diagnostics.missing_board_tcp_8080: client-egress must allow board TCP 8080.
