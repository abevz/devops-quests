title: NetworkPolicy and DNS egress
brief: 'The client is isolated by an egress default-deny policy. Permit DNS to kube-system
  Pods labelled k8s-app: kube-dns on UDP/TCP 53 and TCP 8080 only to app: board in
  this namespace. Keep the closed service unreachable. Use conjunctive namespace+Pod
  selectors for DNS, not a broad cluster allow. Test the real DNS, permitted HTTP
  and denied HTTP paths.


  Quest files in `~/quest` (some appear in later stages): `board.json`, `closed.json`,
  `client.json`, `service.json`, `closed-service.json`, `egress.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images
  and private services. Change only this bay.


  Initial success criteria: Client DNS and board HTTP work while the closed HTTP path
  remains denied.'
debrief: Connectivity was restored with explicit dependency flows, not an allow-all
  exception.
stages.0.brief: 'Success criteria: Client DNS and board HTTP work while the closed
  HTTP path remains denied.'
stages.0.objectives.0.text: Client DNS and board HTTP work while the closed HTTP path
  remains denied.
hints.0.text: Selecting a Pod with an egress policy changes its default egress behavior.
hints.1.text: DNS needs UDP and sometimes TCP; put both selectors in the same peer.
hints.2.text: Allow only DNS and the board port, then test the forbidden service too.
phrases.0: I preserved DNS as an explicit egress dependency.
phrases.1: I combined namespace and Pod selectors in one peer.
phrases.2: I tested both allowed and denied HTTP paths.
questions.0.points.0: namespaceSelector and podSelector inside one peer are conjunctive.
questions.0.points.1: Separate peers are alternatives.
questions.0.prompt: When do two selectors form an AND rather than an OR?
questions.1.points.0: No; DNS is a separate network dependency.
questions.1.points.1: Test name resolution and application traffic separately.
questions.1.prompt: Does a working IP request prove DNS is allowed?
