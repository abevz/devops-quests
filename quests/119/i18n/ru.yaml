title: NetworkPolicy и исходящий DNS
brief: 'Клиент изолирован egress default-deny. Разрешите DNS к Pod kube-system с меткой k8s-app: kube-dns
  по UDP/TCP 53 и TCP 8080 только к app: board в текущем namespace. Сервис closed должен остаться недоступным.
  Для DNS объедините namespace и Pod selectors в одном peer, не открывайте весь кластер. Проверьте настоящий
  DNS, разрешённый и запрещённый HTTP.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `board.json`, `closed.json`, `client.json`,
  `service.json`, `closed-service.json`, `egress.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: DNS клиента и HTTP board работают, а HTTP closed остаётся запрещённым.'
debrief: Связность восстановлена явными потоками зависимостей без исключения allow-all.
stages.0.brief: 'DNS клиента и HTTP board работают, а HTTP closed остаётся запрещённым.


  Результат проверки: DNS клиента и HTTP board работают, а HTTP closed остаётся запрещённым.'
stages.0.objectives.0.text: DNS клиента и HTTP board работают, а HTTP closed остаётся запрещённым.
hints.0.text: Выбор Pod egress policy меняет его поведение исходящего трафика по умолчанию.
hints.1.text: DNS нужен UDP, иногда TCP; оба selector поместите в один peer.
hints.2.text: Разрешите только DNS и порт board, затем проверьте запрещённый сервис.
phrases.0: Я сохранил DNS как явную egress-зависимость.
phrases.1: Я объединил selectors namespace и Pod в одном peer.
phrases.2: Я проверил разрешённый и запрещённый HTTP.
questions.0.points.0: namespaceSelector и podSelector внутри одного peer действуют совместно.
questions.0.points.1: Разные peers являются альтернативами.
questions.0.prompt: Когда два selector образуют AND вместо OR?
questions.1.points.0: 'Нет: DNS — отдельная сетевая зависимость.'
questions.1.points.1: Проверяйте разрешение имён и трафик приложения отдельно.
questions.1.prompt: Доказывает ли рабочий IP-запрос разрешение DNS?
