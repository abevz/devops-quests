title: NetworkPolicy и исходящий DNS
brief: 'Работайте в `~/quest`; изучите `client.json`, `board.json`, `closed.json`, `service.json`, `closed-service.json` и `egress.json`. Клиент изначально изолирован политикой `client-egress`. В Kubernetes каждое правило egress разрешает все сочетания его получателей и портов; отдельные правила складывают разрешения.


  Настройте `client-egress` с `podSelector`, выбирающим ровно `app: client`, и только `Egress`; используйте `matchLabels` или равнозначное выражение `In` с одним значением. Разрешите DNS UDP и TCP 53 одному получателю, объединяющему метку пространства имён `kubernetes.io/metadata.name: kube-system` и метку Pod `k8s-app: kube-dns`, а также TCP 8080 к Pod с меткой `app: board` в том же пространстве имён. Используйте именно эти селекторы меток для выданных целей; правила и порты можно переставлять или разделять. Другие политики, выбирающие клиента, не должны расширять egress.


  Проверьте DNS клиента для `board.$DQ_NAMESPACE.svc.cluster.local.`, HTTP клиента к `board:8080` с ответом `north-119` и неудачный запрос клиента к IP Service `closed` на порту 8080. Контрольный запрос от board к этому IP должен вернуть `closed-119`, показывая доступность цели из другого Pod. Сам по себе неудачный запрос клиента не доказывает его причину. Работайте только в офлайн-песочнице.'
debrief: Ограниченные политики egress и наблюдаемые DNS, ответы и неудачный запрос client соответствовали проверкам.
stages.0.brief: Политика разрешает только указанные потоки DNS и board; DNS и HTTP клиента работают, запрос к closed не проходит, а контроль от board успешен.
stages.0.objectives.0.text: Политика разрешает только указанные потоки DNS и board; DNS и HTTP клиента работают, запрос к closed не проходит, а контроль от board успешен.
hints.0.text: Выбор Pod egress policy меняет его поведение исходящего трафика по умолчанию.
hints.1.text: DNS нужен UDP, иногда TCP; оба selector поместите в один peer.
hints.2.text: Разрешите только DNS и порт board, затем проверьте запрещённый сервис.
phrases.0: Я сохранил DNS как явную egress-зависимость.
phrases.1: Я объединил selectors namespace и Pod в одном peer.
phrases.2: Я проверил разрешённый и запрещённый HTTP.
questions.0.points.0: namespaceSelector и podSelector внутри одного peer действуют
  совместно.
questions.0.points.1: Разные peers являются альтернативами.
questions.0.prompt: Когда два selector образуют AND вместо OR?
questions.1.points.0: 'Нет: DNS — отдельная сетевая зависимость.'
questions.1.points.1: Проверяйте разрешение имён и трафик приложения отдельно.
questions.1.prompt: Доказывает ли рабочий IP-запрос разрешение DNS?
