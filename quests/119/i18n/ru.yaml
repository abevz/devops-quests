title: NetworkPolicy и исходящий DNS
brief: |-
  Запрашивающая нагрузка не достигает всех нужных назначений. Восстановите узкий исходящий доступ с сохранением изоляции от закрытого сервиса.

  Работайте на workstation в `~/quest` с предоставленными файлами:
  - `board.yaml`, `closed.yaml`, `client.yaml`, `service.yaml`, `closed-service.yaml`, `egress.yaml`.

  **Requirements:**

  - Существующая политика применяется только к исходящему трафику, изолирует только предоставленную нагрузку client и разрешает исходящий трафик только к DNS кластера и предоставленному HTTP-сервису board; никакая другая выбирающая политика не расширяет доступ.
  - Из Deployment `client` A-запрос для `board.$DQ_NAMESPACE.svc.cluster.local.` успешен.
  - Из Deployment `client` адрес `http://board:8080` возвращает `north-119`.
  - IP Service `closed` на порту `8080` возвращает `closed-119` в Deployment `board`, а тот же запрос из Deployment `client` не проходит.

  Один неудачный запрос не доказывает причину; используйте доступное контрольное назначение как свидетельство и меняйте только эту песочницу.
debrief: Ограниченные политики egress и наблюдаемые DNS, ответы и неудачный запрос client соответствовали
  проверкам.
stages.0.brief: Сохраните изоляцию от доступного закрытого сервиса.
hints.0.text: Выбор Pod egress policy меняет его поведение исходящего трафика по умолчанию. Выбранный
  Pod становится изолированным для исходящего трафика. Разрешены все сочетания peer/port внутри правила,
  а отдельные правила складывают разрешения.
hints.1.text: |-
  Изучите выданные политики и наблюдаемые объекты. Сравните записи DNS для UDP и TCP и расположение селекторов namespace и Pod.

  Посмотрите, какие Pod `client` выбраны политикой, и проверьте селекторы получателей и порты для DNS и нужного Service. Найдите другие правила egress, которые могут относиться к тем же Pod.

  ```sh
  kubectl get networkpolicies -o yaml
  kubectl get pods -l app=client --show-labels
  kubectl get services board closed
  ```
hints.2.text: |-
  Проверьте результат из `~/quest` на workstation:

  - Разрешённые запросы возвращают соответственно `north-119` и `closed-119`.

    ```sh
    kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080
    closed=$(kubectl get service closed -o jsonpath='{.spec.clusterIP}')
    kubectl exec deployment/board -- wget -qO- -T 3 "http://$closed:8080"
    ```

  - Запрос изолированного потребителя завершается с ненулевым кодом.

    ```sh
    closed=$(kubectl get service closed -o jsonpath='{.spec.clusterIP}')
    kubectl exec deployment/client -- wget -qO- -T 2 "http://$closed:8080"
    ```

  A-запрос разрешается успешно: `kubectl exec deployment/client -- nslookup -type=A "board.$DQ_NAMESPACE.svc.cluster.local."`.
phrases.0: Я сохранил DNS как явную egress-зависимость.
phrases.1: Я объединил selectors namespace и Pod в одном peer.
phrases.2: Я проверил разрешённый и запрещённый HTTP.
questions.0.points.0: namespaceSelector и podSelector внутри одного peer действуют совместно.
questions.0.points.1: Разные peers являются альтернативами.
questions.0.prompt: Когда два selector образуют AND вместо OR?
questions.1.points.0: 'Нет: DNS — отдельная сетевая зависимость.'
questions.1.points.1: Проверяйте разрешение имён и трафик приложения отдельно.
questions.1.prompt: Доказывает ли рабочий IP-запрос разрешение DNS?
stages.0.objectives.0.text: Существующая политика применяется только к исходящему трафику, изолирует только
  предоставленную нагрузку client и разрешает исходящий трафик только к DNS кластера и предоставленному
  HTTP-сервису board; никакая другая выбирающая политика не расширяет доступ.
stages.0.objectives.1.text: Из Deployment `client` A-запрос для `board.$DQ_NAMESPACE.svc.cluster.local.`
  успешен.
stages.0.objectives.2.text: Из Deployment `client` адрес `http://board:8080` возвращает `north-119`.
stages.0.objectives.3.text: IP Service `closed` на порту `8080` возвращает `closed-119` в Deployment `board`,
  а тот же запрос из Deployment `client` не проходит.
diagnostics.policies: Проверка не смогла получить список NetworkPolicy. Проверьте доступ к текущему namespace и доступность API перед разбором правил. [Причина и проверка](guides#guide=kubernetes-10&section=q119-egress-policy-list)
diagnostics.pods: Список Pod client мог быть недоступен или пуст. Проверьте наличие Pod с app=client перед проверкой селектора политики. [Причина и проверка](guides#guide=kubernetes-10&section=q119-egress-client-label-input)
diagnostics.named: Политика client-egress могла отсутствовать или не читаться. Проверьте именованную NetworkPolicy в namespace client. [Причина и проверка](guides#guide=kubernetes-10&section=q119-client-egress-policy-object)
diagnostics.selector: PodSelector мог выбрать другую нагрузку или сузить нужную область. Проверьте, что он эквивалентен app=client. [Причина и проверка](guides#guide=kubernetes-10&section=q119-egress-only-client-selector)
diagnostics.types: Проверка могла обнаружить отсутствие Egress или лишний Ingress. Убедитесь, что в политике объявлен только Egress. [Причина и проверка](guides#guide=kubernetes-10&section=q119-egress-only-policy-type)
diagnostics.egress: У правила egress мог отсутствовать адресат или порт, могла быть чужая цель или неоднозначный именованный порт. Проверьте оба селектора DNS и локальную цель board с разрешёнными одиночными портами. [Причина и проверка](guides#guide=kubernetes-10&section=q119-bounded-egress-peer-and-port)
diagnostics.unexpected: Внешне корректное правило могло разрешить лишний протокол или порт. Сравните каждую тройку цели, протокола и порта с нужными потоками DNS и board. [Причина и проверка](guides#guide=kubernetes-10&section=q119-egress-unexpected-flow)
diagnostics.other_egress: Другая egress-политика для Pod client могла добавить запрещённый поток, поскольку разрешения объединяются. Проверьте указанную политику и сравните её потоки с допустимыми. [Причина и проверка](guides#guide=kubernetes-10&section=q119-additive-egress-policy)
diagnostics.other_invalid: Селектор или egress другой политики не удалось надёжно разобрать. Проверьте указанный объект на неподдерживаемые селекторы или слишком широкие цели перед оценкой доступа. [Причина и проверка](guides#guide=kubernetes-10&section=q119-unreadable-additive-policy)
diagnostics.invalid_input: В наблюдаемых документах могли отсутствовать политики или метки Pod, либо JSON некорректен. Убедитесь, что оба ответа API читаются, перед разбором правила. [Причина и проверка](guides#guide=kubernetes-10&section=q119-egress-observation-shape)
diagnostics.missing_dns_udp_53: Политика могла не разрешить UDP 53 к выданным Pod кластерного DNS. Проверьте общую цель kube-system и kube-dns с нужным портом UDP. [Причина и проверка](guides#guide=kubernetes-10&section=q119-client-egress-dns-udp)
diagnostics.missing_dns_tcp_53: UDP для DNS мог быть разрешён, пока TCP 53 отсутствует. Проверьте разрешение TCP 53 для той же DNS-цели. [Причина и проверка](guides#guide=kubernetes-10&section=q119-client-egress-dns-tcp)
diagnostics.missing_board_tcp_8080: Разрешения DNS не открывают путь к приложению. В политике может отсутствовать TCP 8080 к локальным Pod board. Проверьте цель app=board и её порт. [Причина и проверка](guides#guide=kubernetes-10&section=q119-client-egress-board-http)
diagnostics.dns: Даже при объявленной политике DNS может быть недоступен из работающего client. Запросите полное имя board из client и проверьте успешность запроса. [Причина и проверка](guides#guide=kubernetes-10&section=q119-live-board-name-resolution)
diagnostics.http: DNS может работать, пока client не достигает board на 8080 или получает другой ответ. Запросите Service из client и сравните с north-119. [Причина и проверка](guides#guide=kubernetes-10&section=q119-live-board-client-http)
diagnostics.closed_direct: Service closed мог быть недоступен даже из board. Проверьте closed-119 в контрольном запросе, прежде чем связывать ошибку запроса client с egress. [Причина и проверка](guides#guide=kubernetes-10&section=q119-closed-service-control-request)
diagnostics.closed_denied: Более широкое или дополнительное разрешение могло открыть closed для client. Проверьте, что прямой запрос не проходит, а контрольный из board всё ещё достигает closed. [Причина и проверка](guides#guide=kubernetes-10&section=q119-closed-service-client-denial)
diagnostics.probe_0_0: Проверка политики может остановиться до определения условия, если не запускается процесс или недоступны входы. Проверьте Python и текущие наблюдения политики и Pod. [Причина и проверка](guides#guide=kubernetes-10&section=q119-egress-policy-observer-input)
