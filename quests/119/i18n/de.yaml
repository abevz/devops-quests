title: NetworkPolicy und DNS Ausgang
brief: 'Der client wird durch eine egress default-deny-Richtlinie isoliert. Erlauben Sie DNS bis kube-system
  Pods mit der Bezeichnung k8s-app: kube-dns auf UDP/TCP 53 und TCP 8080 nur bis app: board in diesem
  namespace. Halten Sie den closed-Dienst unerreichbar. Verwenden Sie die Konjunktion namespace+Pod selectors
  für DNS, kein breiter Cluster zulässig. Testen Sie die echten DNS-, zugelassenen HTTP- und verweigerten
  HTTP-Pfade.


  Questdateien in `~/quest` (einige erscheinen in späteren Phasen): `board.json`, `closed.json`, `client.json`,
  `service.json`, `closed-service.json`, `egress.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: Client DNS und board HTTP funktionieren, während der closed HTTP-Pfad weiterhin
  verweigert wird.'
debrief: Die Konnektivität wurde mit expliziten Abhängigkeitsflüssen wiederhergestellt, keine allow-all-Ausnahme.
stages.0.brief: 'Erfolgskriterien: Client DNS und board HTTP funktionieren, während der Pfad closed HTTP
  verweigert bleibt.'
stages.0.objectives.0.text: Client DNS und board HTTP funktionieren, während der closed HTTP-Pfad weiterhin
  verweigert wird.
hints.0.text: Wenn Sie einen Pod mit einem egress policy auswählen, ändert sich dessen Standardverhalten
  egress.
hints.1.text: DNS benötigt UDP und manchmal TCP; Setzen Sie beide Selektoren in denselben peer.
hints.2.text: Erlauben Sie nur DNS und den board-Port und testen Sie dann auch den verbotenen Dienst.
phrases.0: Ich habe DNS als explizite Egress-Abhängigkeit beibehalten.
phrases.1: Ich habe namespace und Pod selectors in einem peer kombiniert.
phrases.2: Ich habe sowohl erlaubte als auch verweigerte HTTP-Pfade getestet.
questions.0.points.0: namespaceSelector und podSelector innerhalb eines peer sind konjunktiv.
questions.0.points.1: Separate peers sind Alternativen.
questions.0.prompt: Wann bilden zwei Selektoren ein UND statt eines ODER?
questions.1.points.0: NEIN; DNS ist eine separate Netzwerkabhängigkeit.
questions.1.points.1: Testen Sie die Namensauflösung und den Anwendungsverkehr separat.
questions.1.prompt: Beweist eine funktionierende IP-Anfrage, dass DNS zulässig ist?
