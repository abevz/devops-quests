title: NetworkPolicy und DNS Ausgang
brief: 'Arbeite in `~/quest`; lies `client.json`, `board.json`, `closed.json`, `service.json`, `closed-service.json` und `egress.json`. Der Client ist zunächst durch `client-egress` isoliert. In Kubernetes erlaubt jede Egress-Regel alle Kombinationen ihrer Ziele und Ports; getrennte Regeln addieren Berechtigungen.


  Konfiguriere `client-egress` mit einem `podSelector`, der genau `app: client` auswählt, und nur `Egress`; nutze `matchLabels` oder einen gleichwertigen `In`-Ausdruck mit einem Wert. Erlaube DNS UDP und TCP 53 zu einem gemeinsamen Ziel mit Namespace-Label `kubernetes.io/metadata.name: kube-system` und Pod-Label `k8s-app: kube-dns` sowie TCP 8080 zum Pod-Label `app: board` im selben Namespace. Verwende genau diese Label-Selektoren für die bereitgestellten Ziele; Regeln und Ports dürfen anders angeordnet oder aufgeteilt werden. Andere Policies, die den Client auswählen, dürfen kein breiteres Egress erlauben.


  Prüfe Client-DNS für `board.$DQ_NAMESPACE.svc.cluster.local.`, Client-HTTP zu `board:8080` mit Antwort `north-119` und eine fehlgeschlagene Client-Anfrage zur IP des Service `closed` auf Port 8080. Eine Kontrollanfrage von board an diese IP muss `closed-119` liefern und zeigt damit die Erreichbarkeit von einem anderen Pod. Eine fehlgeschlagene Client-Anfrage allein beweist ihre Ursache nicht. Arbeite nur in der Offline-Umgebung.'
debrief: Die begrenzten Egress-Policies sowie beobachtetes DNS, Antworten und fehlgeschlagene Client-Anfrage entsprachen den Prüfungen.
stages.0.brief: Die Policy erlaubt nur die angegebenen DNS- und board-Flüsse; Client-DNS und -HTTP funktionieren, die closed-Anfrage schlägt fehl und die board-Kontrolle gelingt.
stages.0.objectives.0.text: Die Policy erlaubt nur die angegebenen DNS- und board-Flüsse; Client-DNS und -HTTP funktionieren, die closed-Anfrage schlägt fehl und die board-Kontrolle gelingt.
hints.0.text: Wenn Sie einen Pod mit einem egress policy auswählen, ändert sich dessen Standardverhalten
  egress.
hints.1.text: DNS benötigt UDP und manchmal TCP; Setzen Sie beide Selektoren in denselben peer.
hints.2.text: Erlauben Sie nur DNS und den board-Port und testen Sie dann auch den verbotenen Dienst.
phrases.0: Ich habe DNS als explizite Egress-Abhängigkeit beibehalten.
phrases.1: Ich habe namespace und Pod selectors in einem peer kombiniert.
phrases.2: Ich habe sowohl erlaubte als auch verweigerte HTTP-Pfade getestet.
questions.0.points.0: namespaceSelector und podSelector innerhalb eines peer sind konjunktiv.
questions.0.points.1: Separate peers sind Alternativen.
questions.0.prompt: Wann bilden zwei Selektoren ein UND statt eines ODER?
questions.1.points.0: NEIN; DNS ist eine separate Netzwerkabhängigkeit.
questions.1.points.1: Testen Sie die Namensauflösung und den Anwendungsverkehr separat.
questions.1.prompt: Beweist eine funktionierende IP-Anfrage, dass DNS zulässig ist?
