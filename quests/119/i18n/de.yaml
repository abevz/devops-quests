diagnostics.policies: Die Prüfung konnte NetworkPolicies nicht auflisten. Prüfen Sie Namespace-Zugriff und API-Verfügbarkeit vor der Auswertung der Richtlinien. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q119-egress-policy-list)
diagnostics.pods: Das Inventar der client-Pods fehlt möglicherweise oder ist leer. Prüfen Sie Pods mit app=client vor der Auswertung des Selektors. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q119-egress-client-label-input)
diagnostics.named: Die Richtlinie client-egress fehlt möglicherweise oder ist nicht lesbar. Prüfen Sie die benannte NetworkPolicy im Namespace von client. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q119-client-egress-policy-object)
diagnostics.selector: Der podSelector wählt möglicherweise eine andere Anwendung oder schränkt die Auswahl ein. Prüfen Sie die Gleichwertigkeit zu app=client. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q119-egress-only-client-selector)
diagnostics.types: Die Prüfung sieht möglicherweise kein Egress oder ein zusätzliches Ingress. Prüfen Sie, dass die Richtlinie ausschließlich Egress deklariert. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q119-egress-only-policy-type)
diagnostics.egress: Einer Egress-Regel fehlt möglicherweise Ziel oder Port, sie nutzt einen fremden Peer oder einen uneindeutigen benannten Port. Prüfen Sie beide DNS-Selektoren und das lokale Ziel board mit einzelnen erlaubten Ports. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q119-bounded-egress-peer-and-port)
diagnostics.unexpected: Eine scheinbar gültige Regel erlaubt möglicherweise ein zusätzliches Protokoll oder einen Port. Vergleichen Sie jedes Ziel-/Protokoll-/Port-Tupel mit den geforderten DNS- und board-Flüssen. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q119-egress-unexpected-flow)
diagnostics.other_egress: Eine weitere Egress-Richtlinie für einen client-Pod erlaubt möglicherweise einen unerwünschten Fluss, weil Freigaben additiv sind. Vergleichen Sie die gemeldete Richtlinie mit den vorgesehenen Flüssen. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q119-additive-egress-policy)
diagnostics.other_invalid: Selektor oder Egress-Regeln einer anderen Richtlinie ließen sich nicht sicher auswerten. Prüfen Sie das gemeldete Objekt auf nicht unterstützte Selektoren oder zu breite Ziele. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q119-unreadable-additive-policy)
diagnostics.invalid_input: In den Dokumenten fehlen möglicherweise Richtlinien oder Pod-Labels, oder JSON ist ungültig. Prüfen Sie beide API-Antworten vor der Regelanalyse auf Lesbarkeit. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q119-egress-observation-shape)
diagnostics.missing_dns_udp_53: Die Richtlinie lässt möglicherweise UDP 53 zu den DNS-Pods des Clusters aus. Prüfen Sie den Peer aus kube-system und kube-dns mit passendem UDP-Port. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q119-client-egress-dns-udp)
diagnostics.missing_dns_tcp_53: UDP für DNS ist möglicherweise erlaubt, während TCP 53 fehlt. Prüfen Sie TCP 53 zum selben bereitgestellten DNS-Peer. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q119-client-egress-dns-tcp)
diagnostics.missing_board_tcp_8080: DNS-Freigaben öffnen den Anwendungspfad nicht. Möglicherweise fehlt TCP 8080 zu den lokalen board-Pods. Prüfen Sie den Peer app=board und seinen Port. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q119-client-egress-board-http)
diagnostics.dns: Die deklarierte Richtlinie kann DNS aus dem laufenden client weiterhin blockieren. Fragen Sie den vollständigen board-Namen aus client ab und prüfen Sie den Erfolg. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q119-live-board-name-resolution)
diagnostics.http: DNS kann funktionieren, obwohl client board auf 8080 nicht erreicht oder eine andere Antwort erhält. Rufen Sie den Service aus client auf und vergleichen Sie mit north-119. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q119-live-board-client-http)
diagnostics.closed_direct: Der Service closed ist möglicherweise auch aus board nicht erreichbar. Prüfen Sie closed-119 in der Kontrollanfrage, bevor Sie den Fehler aus client dem Egress zuschreiben. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q119-closed-service-control-request)
diagnostics.closed_denied: Eine breitere oder zusätzliche Freigabe ermöglicht client möglicherweise den Zugriff auf closed. Prüfen Sie, dass die direkte Anfrage scheitert und die Kontrolle aus board closed weiter erreicht. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q119-closed-service-client-denial)
diagnostics.probe_0_0: Die Richtlinienprüfung kann vor der Meldung einer Bedingung abbrechen, wenn Prozess oder Eingaben fehlschlagen. Prüfen Sie Python und aktuelle Richtlinien- und Pod-Beobachtungen. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q119-egress-policy-observer-input)
