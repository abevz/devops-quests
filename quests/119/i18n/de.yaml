title: NetworkPolicy und DNS Ausgang
brief: |-
  Der anfragende Workload erreicht nicht alle benötigten Ziele. Stellen Sie eng begrenzten Egress bei erhaltener Isolation vom geschlossenen Dienst her.

  Arbeiten Sie auf der Workstation in `~/quest` mit den bereitgestellten Dateien:
  - `board.yaml`, `closed.yaml`, `client.yaml`, `service.yaml`, `closed-service.yaml`, `egress.yaml`.

  **Requirements:**

  - Die vorhandene Egress-Policy gilt nur für ausgehenden Verkehr, isoliert nur den bereitgestellten Client-Workload und erlaubt ausgehenden Verkehr nur zu Cluster-DNS und dem bereitgestellten board-HTTP-Dienst; keine andere auswählende Policy erweitert den Zugriff.
  - Von Deployment `client` ist die A-Abfrage für `board.$DQ_NAMESPACE.svc.cluster.local.` erfolgreich.
  - Von Deployment `client` liefert `http://board:8080` den Wert `north-119`.
  - Die Service-IP von `closed` auf Port `8080` liefert Deployment `board` den Wert `closed-119`, während dieselbe Anfrage von Deployment `client` fehlschlägt.

  Eine fehlgeschlagene Anfrage allein beweist nicht ihre Ursache; verwenden Sie das erreichbare Kontrollziel als Beleg und ändern Sie nur diese Bay.
debrief: Die begrenzten Egress-Policies sowie beobachtetes DNS, Antworten und fehlgeschlagene Client-Anfrage
  entsprachen den Prüfungen.
stages.0.brief: Bewahren Sie die Isolation vom erreichbaren geschlossenen Dienst.
hints.0.text: Wenn Sie einen Pod mit einem egress policy auswählen, ändert sich dessen Standardverhalten
  egress. Ein ausgewählter Pod wird für Egress isoliert. Jede Peer-/Port-Kombination einer Regel ist erlaubt;
  getrennte Regeln addieren Freigaben.
hints.1.text: |-
  DNS benötigt UDP und manchmal TCP; Setzen Sie beide Selektoren in denselben peer.

  Prüfen Sie die bereitgestellten Eingaben und laufenden Beobachtungen:

  ```sh
  kubectl get networkpolicies -o yaml
    kubectl get pods -l app=client --show-labels
  ```
hints.2.text: |-
  Erlauben Sie nur DNS und den board-Port und testen Sie dann auch den verbotenen Dienst.

  Prüfen Sie das Ergebnis in `~/quest` auf der Workstation:

  - Die erlaubten Anfragen liefern entsprechend `north-119` und `closed-119`.

    ```sh
    kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080
    closed=$(kubectl get service closed -o jsonpath='{.spec.clusterIP}')
    kubectl exec deployment/board -- wget -qO- -T 3 "http://$closed:8080"
    ```

  - Die Anfrage des isolierten Verbrauchers endet mit einem Exitstatus ungleich null.

    ```sh
    closed=$(kubectl get service closed -o jsonpath='{.spec.clusterIP}')
    kubectl exec deployment/client -- wget -qO- -T 2 "http://$closed:8080"
    ```

  Die A-Abfrage ist erfolgreich: `kubectl exec deployment/client -- nslookup -type=A "board.$DQ_NAMESPACE.svc.cluster.local."`.
phrases.0: Ich habe DNS als explizite Egress-Abhängigkeit beibehalten.
phrases.1: Ich habe namespace und Pod selectors in einem peer kombiniert.
phrases.2: Ich habe sowohl erlaubte als auch verweigerte HTTP-Pfade getestet.
questions.0.points.0: namespaceSelector und podSelector innerhalb eines peer sind konjunktiv.
questions.0.points.1: Separate peers sind Alternativen.
questions.0.prompt: Wann bilden zwei Selektoren ein UND statt eines ODER?
questions.1.points.0: NEIN; DNS ist eine separate Netzwerkabhängigkeit.
questions.1.points.1: Testen Sie die Namensauflösung und den Anwendungsverkehr separat.
questions.1.prompt: Beweist eine funktionierende IP-Anfrage, dass DNS zulässig ist?
