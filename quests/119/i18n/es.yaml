  la carga client suministrada y permite tráfico saliente solo al DNS del clúster y al servicio HTTP board
  suministrado; ninguna otra política que la seleccione amplía el acceso.
stages.0.objectives.1.text: Desde el Deployment `client`, la consulta A de `board.$DQ_NAMESPACE.svc.cluster.local.`
  tiene éxito.
stages.0.objectives.2.text: Desde el Deployment `client`, `http://board:8080` devuelve `north-119`.
stages.0.objectives.3.text: La IP del Service `closed` en el puerto `8080` devuelve `closed-119` al Deployment
  `board`, mientras la misma solicitud desde el Deployment `client` falla.
