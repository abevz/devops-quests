title: Salida NetworkPolicy y DNS
brief: 'Trabaja en `~/quest`; examina `client.json`, `board.json`, `closed.json`, `service.json`, `closed-service.json` y `egress.json`. El cliente comienza aislado por `client-egress`. En Kubernetes, cada regla de salida permite todas las combinaciones de sus destinos y puertos; las reglas separadas suman permisos.


  Configura `client-egress` con un `podSelector` que seleccione exactamente `app: client` y solo `Egress`; usa `matchLabels` o una expresión equivalente `In` de un valor. Permite DNS UDP y TCP 53 a un único destino que combine la etiqueta de namespace `kubernetes.io/metadata.name: kube-system` con la etiqueta de Pod `k8s-app: kube-dns`, y TCP 8080 a la etiqueta de Pod `app: board` en el mismo namespace. Usa esos selectores exactos para identificar los destinos suministrados; puedes reordenar o dividir reglas y puertos. Otras políticas que seleccionen al cliente no deben ampliar la salida.


  Comprueba el DNS del cliente para `board.$DQ_NAMESPACE.svc.cluster.local.`, HTTP del cliente a `board:8080` con respuesta `north-119` y una petición fallida del cliente a la IP del Service `closed` en el puerto 8080. Una petición de control desde board a esa IP debe devolver `closed-119`, mostrando que el destino es accesible desde otro Pod. Una petición fallida del cliente por sí sola no demuestra la causa. Trabaja solo en la bahía sin conexión.'
debrief: Las políticas de salida limitadas y el DNS, las respuestas y la petición fallida de client observados coincidieron con las comprobaciones.
stages.0.brief: La política permite solo los flujos DNS y board indicados; funcionan el DNS y HTTP del cliente, falla la petición a closed y funciona el control desde board.
stages.0.objectives.0.text: La política permite solo los flujos DNS y board indicados; funcionan el DNS y HTTP del cliente, falla la petición a closed y funciona el control desde board.
hints.0.text: Al seleccionar un Pod con un egress policy se cambia su comportamiento predeterminado de
  egress.
hints.1.text: DNS necesita UDP y, a veces, TCP; Pon ambos selectores en el mismo peer.
hints.2.text: Permita solo DNS y el puerto board, luego pruebe también el servicio prohibido.
phrases.0: Conservé DNS como una dependencia de salida explícita.
phrases.1: Combiné namespace y Pod selectors en un peer.
phrases.2: Probé las rutas HTTP permitidas y denegadas.
questions.0.points.0: namespaceSelector y podSelector dentro de un peer son conjuntivos.
questions.0.points.1: peers separados son alternativas.
questions.0.prompt: ¿Cuándo dos selectores forman un Y en lugar de un O?
questions.1.points.0: No; DNS es una dependencia de red independiente.
questions.1.points.1: Pruebe la resolución de nombres y el tráfico de aplicaciones por separado.
questions.1.prompt: ¿Una solicitud IP que funcione demuestra que se permite DNS?
