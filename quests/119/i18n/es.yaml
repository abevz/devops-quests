title: Salida NetworkPolicy y DNS
brief: |-
  La carga solicitante no alcanza todos los destinos requeridos. Restaure el egreso limitado manteniendo el aislamiento del servicio cerrado.

  Trabaja en la workstation en `~/quest` con los archivos suministrados:
  - `board.yaml`, `closed.yaml`, `client.yaml`, `service.yaml`, `closed-service.yaml`, `egress.yaml`.

  **Requirements:**

  - La política egress existente se aplica solo al tráfico saliente, aísla solo la carga client suministrada y permite tráfico saliente solo al DNS del clúster y al servicio HTTP board suministrado; ninguna otra política que la seleccione amplía el acceso.
  - Desde el Deployment `client`, la consulta A de `board.$DQ_NAMESPACE.svc.cluster.local.` tiene éxito.
  - Desde el Deployment `client`, `http://board:8080` devuelve `north-119`.
  - La IP del Service `closed` en el puerto `8080` devuelve `closed-119` al Deployment `board`, mientras la misma solicitud desde el Deployment `client` falla.

  Una solicitud fallida por sí sola no prueba la causa; use el destino de control accesible como evidencia y cambie solo esta bahía.
debrief: Las políticas de salida limitadas y el DNS, las respuestas y la petición fallida de client observados
  coincidieron con las comprobaciones.
stages.0.brief: Conserva el aislamiento del servicio cerrado alcanzable.
hints.0.text: Al seleccionar un Pod con un egress policy se cambia su comportamiento predeterminado de
  egress. Un Pod seleccionado queda aislado para egreso. Cada combinación peer/puerto de una regla está
  permitida y las reglas separadas suman permisos.
hints.1.text: |-
  Inspecciona las políticas suministradas y los recursos observados. Compara las entradas DNS para UDP y TCP y dónde aparecen los selectores de namespace y Pod.

  Revisa los Pods `client` seleccionados y los selectores y puertos de destino para DNS y el Service previsto. Busca otras reglas de salida que puedan aplicarse a esos mismos Pods.

  ```sh
  kubectl get networkpolicies -o yaml
  kubectl get pods -l app=client --show-labels
  kubectl get services board closed
  ```
hints.2.text: |-
  Verifica el resultado desde `~/quest` en la workstation:

  - Las solicitudes permitidas devuelven `north-119` y `closed-119`, respectivamente.

    ```sh
    kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080
    closed=$(kubectl get service closed -o jsonpath='{.spec.clusterIP}')
    kubectl exec deployment/board -- wget -qO- -T 3 "http://$closed:8080"
    ```

  - La solicitud del consumidor aislado falla con código de salida distinto de cero.

    ```sh
    closed=$(kubectl get service closed -o jsonpath='{.spec.clusterIP}')
    kubectl exec deployment/client -- wget -qO- -T 2 "http://$closed:8080"
    ```

  La consulta A tiene éxito: `kubectl exec deployment/client -- nslookup -type=A "board.$DQ_NAMESPACE.svc.cluster.local."`.
phrases.0: Conservé DNS como una dependencia de salida explícita.
phrases.1: Combiné namespace y Pod selectors en un peer.
phrases.2: Probé las rutas HTTP permitidas y denegadas.
questions.0.points.0: namespaceSelector y podSelector dentro de un peer son conjuntivos.
questions.0.points.1: peers separados son alternativas.
questions.0.prompt: ¿Cuándo dos selectores forman un Y en lugar de un O?
questions.1.points.0: No; DNS es una dependencia de red independiente.
questions.1.points.1: Pruebe la resolución de nombres y el tráfico de aplicaciones por separado.
questions.1.prompt: ¿Una solicitud IP que funcione demuestra que se permite DNS?
stages.0.objectives.0.text: La política egress existente se aplica solo al tráfico saliente, aísla solo
  la carga client suministrada y permite tráfico saliente solo al DNS del clúster y al servicio HTTP board
  suministrado; ninguna otra política que la seleccione amplía el acceso.
stages.0.objectives.1.text: Desde el Deployment `client`, la consulta A de `board.$DQ_NAMESPACE.svc.cluster.local.`
  tiene éxito.
stages.0.objectives.2.text: Desde el Deployment `client`, `http://board:8080` devuelve `north-119`.
stages.0.objectives.3.text: La IP del Service `closed` en el puerto `8080` devuelve `closed-119` al Deployment
  `board`, mientras la misma solicitud desde el Deployment `client` falla.
diagnostics.policies: La comprobación no pudo listar las NetworkPolicy. Revise el acceso al namespace y al API antes de interpretar las políticas. [Causa y comprobación](guides#guide=kubernetes-10&section=q119-egress-policy-list)
diagnostics.pods: El inventario de Pods client puede faltar o estar vacío. Compruebe la presencia de Pods app=client antes de evaluar el selector. [Causa y comprobación](guides#guide=kubernetes-10&section=q119-egress-client-label-input)
diagnostics.named: La política client-egress puede faltar o no ser legible. Revise la NetworkPolicy por nombre en el namespace de client. [Causa y comprobación](guides#guide=kubernetes-10&section=q119-client-egress-policy-object)
diagnostics.selector: PodSelector puede elegir otra aplicación o estrechar el alcance. Compruebe que sea equivalente a app=client. [Causa y comprobación](guides#guide=kubernetes-10&section=q119-egress-only-client-selector)
diagnostics.types: La comprobación puede detectar ausencia de Egress o presencia adicional de Ingress. Compruebe que la política declare solo Egress. [Causa y comprobación](guides#guide=kubernetes-10&section=q119-egress-only-policy-type)
diagnostics.egress: Una regla egress puede omitir destino o puerto, usar otro par o resolver un puerto de forma inconsistente. Revise ambos selectores DNS y el destino local board con puertos individuales permitidos. [Causa y comprobación](guides#guide=kubernetes-10&section=q119-bounded-egress-peer-and-port)
diagnostics.unexpected: Una regla válida en apariencia puede permitir un protocolo o puerto adicional. Compare cada tupla de destino, protocolo y puerto con los flujos requeridos de DNS y board. [Causa y comprobación](guides#guide=kubernetes-10&section=q119-egress-unexpected-flow)
diagnostics.other_egress: Otra política egress que seleccione un Pod client puede agregar un flujo prohibido porque los permisos se acumulan. Revise la política indicada y compare sus flujos con el conjunto exigido. [Causa y comprobación](guides#guide=kubernetes-10&section=q119-additive-egress-policy)
diagnostics.other_invalid: No se pudo interpretar de forma segura el selector o egress de otra política. Revise el objeto indicado en busca de selectores incompatibles o destinos amplios antes de evaluar el acceso. [Causa y comprobación](guides#guide=kubernetes-10&section=q119-unreadable-additive-policy)
diagnostics.invalid_input: Los documentos pueden carecer de políticas o etiquetas de Pods, o el JSON ser inválido. Revise que ambas observaciones del API sean legibles antes de analizar la regla. [Causa y comprobación](guides#guide=kubernetes-10&section=q119-egress-observation-shape)
diagnostics.missing_dns_udp_53: La política puede omitir UDP 53 hacia los Pods DNS del clúster. Revise el par con kube-system y kube-dns y el puerto UDP correspondiente. [Causa y comprobación](guides#guide=kubernetes-10&section=q119-client-egress-dns-udp)
diagnostics.missing_dns_tcp_53: DNS por UDP puede estar permitido mientras falta TCP 53. Compruebe el permiso TCP 53 para el mismo par DNS. [Causa y comprobación](guides#guide=kubernetes-10&section=q119-client-egress-dns-tcp)
diagnostics.missing_board_tcp_8080: Los permisos DNS no habilitan el acceso a la carga. La política puede carecer de TCP 8080 hacia Pods board locales. Revise el par app=board y su puerto. [Causa y comprobación](guides#guide=kubernetes-10&section=q119-client-egress-board-http)
diagnostics.dns: La política declarada puede dejar DNS inaccesible desde client. Consulte el nombre completo de board desde client y compruebe que funcione. [Causa y comprobación](guides#guide=kubernetes-10&section=q119-live-board-name-resolution)
diagnostics.http: DNS puede funcionar aunque client no acceda a board en 8080 o reciba otra respuesta. Consulte el Service desde client y compare con north-119. [Causa y comprobación](guides#guide=kubernetes-10&section=q119-live-board-client-http)
diagnostics.closed_direct: El Service closed puede estar inaccesible incluso desde board. Compruebe closed-119 en la consulta de control antes de atribuir a egress el fallo de client. [Causa y comprobación](guides#guide=kubernetes-10&section=q119-closed-service-control-request)
diagnostics.closed_denied: Un permiso amplio o adicional puede permitir a client alcanzar closed. Compruebe que la petición directa falle y que el control desde board siga llegando a closed. [Causa y comprobación](guides#guide=kubernetes-10&section=q119-closed-service-client-denial)
diagnostics.probe_0_0: El observador puede detenerse antes de señalar una condición si falla el proceso o la entrada. Revise Python y las observaciones actuales de la política y los Pods. [Causa y comprobación](guides#guide=kubernetes-10&section=q119-egress-policy-observer-input)
