title: Salida NetworkPolicy y DNS
brief: 'El client está aislado mediante una política egress default-deny. Permita los pods de DNS a kube-system
  etiquetados como k8s-app: kube-dns en UDP/TCP 53 y TCP 8080 solo a app: board en este namespace. Mantenga
  el servicio closed inalcanzable. Utilice la conjuntiva namespace+Pod selectors para DNS, no se permite
  un clúster amplio. Pruebe las rutas DNS reales, permitidas HTTP y denegadas HTTP.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `board.json`, `closed.json`,
  `client.json`, `service.json`, `closed-service.json`, `egress.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: Client DNS y board HTTP funcionan mientras la ruta closed HTTP permanece
  denegada.'
debrief: La conectividad se restableció con flujos de dependencia explícitos, no con una excepción allow-all.
stages.0.brief: 'Criterios de éxito: Client DNS y board HTTP funcionan mientras la ruta closed HTTP permanece
  denegada.'
stages.0.objectives.0.text: Client DNS y board HTTP funcionan mientras la ruta closed HTTP permanece denegada.
hints.0.text: Al seleccionar un Pod con un egress policy se cambia su comportamiento predeterminado de
  egress.
hints.1.text: DNS necesita UDP y, a veces, TCP; Pon ambos selectores en el mismo peer.
hints.2.text: Permita solo DNS y el puerto board, luego pruebe también el servicio prohibido.
phrases.0: Conservé DNS como una dependencia de salida explícita.
phrases.1: Combiné namespace y Pod selectors en un peer.
phrases.2: Probé las rutas HTTP permitidas y denegadas.
questions.0.points.0: namespaceSelector y podSelector dentro de un peer son conjuntivos.
questions.0.points.1: peers separados son alternativas.
questions.0.prompt: ¿Cuándo dos selectores forman un Y en lugar de un O?
questions.1.points.0: No; DNS es una dependencia de red independiente.
questions.1.points.1: Pruebe la resolución de nombres y el tráfico de aplicaciones por separado.
questions.1.prompt: ¿Una solicitud IP que funcione demuestra que se permite DNS?
