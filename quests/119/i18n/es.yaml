title: Salida NetworkPolicy y DNS
brief: |-
  La carga solicitante no alcanza todos los destinos requeridos. Restaure el egreso limitado manteniendo el aislamiento del servicio cerrado.

  Trabaja en la workstation en `~/quest` con los archivos suministrados:
  - `board.yaml`, `closed.yaml`, `client.yaml`, `service.yaml`, `closed-service.yaml`, `egress.yaml`.

  **Requirements:**

  - La política egress existente se aplica solo al tráfico saliente, aísla solo la carga client suministrada y permite tráfico saliente solo al DNS del clúster y al servicio HTTP board suministrado; ninguna otra política que la seleccione amplía el acceso.
  - Desde el Deployment `client`, la consulta A de `board.$DQ_NAMESPACE.svc.cluster.local.` tiene éxito.
  - Desde el Deployment `client`, `http://board:8080` devuelve `north-119`.
  - La IP del Service `closed` en el puerto `8080` devuelve `closed-119` al Deployment `board`, mientras la misma solicitud desde el Deployment `client` falla.

  Una solicitud fallida por sí sola no prueba la causa; use el destino de control accesible como evidencia y cambie solo esta bahía.
debrief: Las políticas de salida limitadas y el DNS, las respuestas y la petición fallida de client observados
  coincidieron con las comprobaciones.
stages.0.brief: Conserva el aislamiento del servicio cerrado alcanzable.
hints.0.text: Al seleccionar un Pod con un egress policy se cambia su comportamiento predeterminado de
  egress. Un Pod seleccionado queda aislado para egreso. Cada combinación peer/puerto de una regla está
  permitida y las reglas separadas suman permisos.
hints.1.text: |-
  DNS necesita UDP y, a veces, TCP; Pon ambos selectores en el mismo peer.

  Inspecciona los datos suministrados y las observaciones activas:

  ```sh
  kubectl get networkpolicies -o yaml
    kubectl get pods -l app=client --show-labels
  ```
hints.2.text: |-
  Permita solo DNS y el puerto board, luego pruebe también el servicio prohibido.

  Verifica el resultado desde `~/quest` en la workstation:

  - Las solicitudes permitidas devuelven `north-119` y `closed-119`, respectivamente.

    ```sh
    kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080
    closed=$(kubectl get service closed -o jsonpath='{.spec.clusterIP}')
    kubectl exec deployment/board -- wget -qO- -T 3 "http://$closed:8080"
    ```

  - La solicitud del consumidor aislado falla con código de salida distinto de cero.

    ```sh
    closed=$(kubectl get service closed -o jsonpath='{.spec.clusterIP}')
    kubectl exec deployment/client -- wget -qO- -T 2 "http://$closed:8080"
    ```

  La consulta A tiene éxito: `kubectl exec deployment/client -- nslookup -type=A "board.$DQ_NAMESPACE.svc.cluster.local."`.
phrases.0: Conservé DNS como una dependencia de salida explícita.
phrases.1: Combiné namespace y Pod selectors en un peer.
phrases.2: Probé las rutas HTTP permitidas y denegadas.
questions.0.points.0: namespaceSelector y podSelector dentro de un peer son conjuntivos.
questions.0.points.1: peers separados son alternativas.
questions.0.prompt: ¿Cuándo dos selectores forman un Y en lugar de un O?
questions.1.points.0: No; DNS es una dependencia de red independiente.
questions.1.points.1: Pruebe la resolución de nombres y el tráfico de aplicaciones por separado.
questions.1.prompt: ¿Una solicitud IP que funcione demuestra que se permite DNS?
diagnostics.policies: La consulta de NetworkPolicies debe tener éxito.
diagnostics.pods: La consulta de Pods client debe tener éxito y devolver al menos un Pod.
diagnostics.dns: La consulta DNS de board desde client debe tener éxito.
diagnostics.http: La petición desde client a board:8080 debe devolver north-119.
diagnostics.closed_direct: La petición desde board a closed:8080 debe devolver closed-119.
diagnostics.closed_denied: La petición desde client a closed:8080 debe fallar.
diagnostics.named: Debe haber exactamente una NetworkPolicy llamada client-egress.
diagnostics.selector: El podSelector de client-egress debe coincidir exactamente con app:client.
diagnostics.types: policyTypes de client-egress debe contener solo Egress.
diagnostics.egress: Los peers y puertos de client-egress deben usar la forma acotada descrita en el enunciado.
diagnostics.unexpected: client-egress no debe tener tráfico inesperado; el diagnóstico original indica
  destino, protocolo y puerto.
diagnostics.other_egress: Otra NetworkPolicy que seleccione un cliente (client) no debe permitir salida
  adicional; su nombre aparece en el diagnóstico original.
diagnostics.other_invalid: Otra NetworkPolicy tiene selector o egress no válido; su nombre aparece en
  el diagnóstico original.
diagnostics.invalid_input: Las NetworkPolicies y las etiquetas de los Pods client deben poder leerse en
  el formato esperado.
diagnostics.missing_dns_udp_53: client-egress debe permitir dns UDP 53.
diagnostics.missing_dns_tcp_53: client-egress debe permitir dns TCP 53.
diagnostics.missing_board_tcp_8080: client-egress debe permitir board TCP 8080.
