diagnostics.live_binding_1: Extracting the whole archive overwrites consumer-binding.json with the snapshot PID 0 and old instance nonce, which cannot describe the original running process. Restore only message and preserve the current binding JSON exactly, including its recorded owner, group and mode. This live predicate compares decoded content and metadata, not inode, modification time or raw-byte formatting. [Cause and check](guides#guide=ansible-11&section=selective-restore-current-live-binding)
diagnostics.live_binding_2: Extracting the whole archive overwrites consumer-binding.json with the snapshot PID 0 and old instance nonce, which cannot describe the original running process. Restore only message and preserve the current binding JSON exactly, including its recorded owner, group and mode. This live predicate compares decoded content and metadata, not inode, modification time or raw-byte formatting. [Cause and check](guides#guide=ansible-11&section=selective-restore-current-live-binding)
diagnostics.live_binding_3: Extracting the whole archive overwrites consumer-binding.json with the snapshot PID 0 and old instance nonce, which cannot describe the original running process. Restore only message and preserve the current binding JSON exactly, including its recorded owner, group and mode. This live predicate compares decoded content and metadata, not inode, modification time or raw-byte formatting. [Cause and check](guides#guide=ansible-11&section=selective-restore-current-live-binding)
diagnostics.live_data_1: The archive tenant.json belongs to an old snapshot and can replace the live account/balance and private permissions if extracted wholesale. Retain every original tenant key/value and its UID, GID and mode; additional JSON keys are allowed. Keep the original readable data for the UID 1001 application rather than copying the archive tenant record. [Cause and check](guides#guide=ansible-11&section=selective-restore-current-tenant-data)
diagnostics.live_data_2: The archive tenant.json belongs to an old snapshot and can replace the live account/balance and private permissions if extracted wholesale. Retain every original tenant key/value and its UID, GID and mode; additional JSON keys are allowed. Keep the original readable data for the UID 1001 application rather than copying the archive tenant record. [Cause and check](guides#guide=ansible-11&section=selective-restore-current-tenant-data)
diagnostics.live_data_3: The archive tenant.json belongs to an old snapshot and can replace the live account/balance and private permissions if extracted wholesale. Retain every original tenant key/value and its UID, GID and mode; additional JSON keys are allowed. Keep the original readable data for the UID 1001 application rather than copying the archive tenant record. [Cause and check](guides#guide=ansible-11&section=selective-restore-current-tenant-data)
diagnostics.application_ready_1: The original application can return HTTP 503 when its current binding no longer matches its PID/instance or its private tenant/message inputs cannot be read. A decoded response with a wrong message, instance, account or balance also fails this marker. Restore only the approved message while preserving the original live binding/data; requests read current files directly, so do not restart or signal the process. [Cause and check](guides#guide=ansible-11&section=selective-restore-actual-live-application-response)
diagnostics.application_ready_2: The original application can return HTTP 503 when its current binding no longer matches its PID/instance or its private tenant/message inputs cannot be read. A decoded response with a wrong message, instance, account or balance also fails this marker. Restore only the approved message while preserving the original live binding/data; requests read current files directly, so do not restart or signal the process. [Cause and check](guides#guide=ansible-11&section=selective-restore-actual-live-application-response)
