title: Controlled restore
brief: |-
  The fleet needs its approved message configuration restored from the supplied archive.

  Work on the workstation in `~/quest` with `recovery.tar`, `artifact.sha256`, `rollout.yml`.

  **Requirements:**
  - Trusted archive on the workstation:
    - Path: `~/quest/recovery.tar`.
    - Frozen SHA-256 receipt: `/run/dq/facts/0/artifact.sha256`.
  - Configured restore:
    - Scope: `app1`, `app2`, `app3`.
    - Archive verification is required against the trusted receipt.
    - One managed host per batch; the restored service is refreshed.
    - Archive destination on the managed hosts: `/srv/site`.
    - Owner and group: `root` / `root`.
    - Access mode: `0644`.
  - File on every managed host (`app1`, `app2`, `app3`):
    - Path: `/srv/site/message`.
    - Content: `north-96`.
    - Access mode: `0644`.
    - Owner and group: `root` / `root`.
  - Live service on every managed host (`app1`, `app2`, `app3`):
    - HTTP: `8080`, `/`.
    - Response: `north-96`.

  **Verify yourself before Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'cat /srv/site/message; ls -l /srv/site/message'` — Every host shows `north-96`, permissions `-rw-r--r--`, owner `root` and group `root`.
  - `for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done` — Shows `north-96` from `app1`, `app2`, `app3`.
  - `sha256sum recovery.tar; cat /run/dq/facts/0/artifact.sha256` — The archive digest equals the frozen trusted digest.

  Consumer observations show the delivered state; Check also inspects the trusted archive and restore configuration.
debrief: Recovery retained artifact verification, controlled rollout and explicit file metadata.
stages.0.brief: The verified restore must leave the approved message content and metadata across the fleet.
stages.0.objectives.0.text: On the workstation, `recovery.tar` matches the trusted receipt `/run/dq/facts/0/artifact.sha256`.
stages.0.objectives.1.text: Restoration is configured to require the archive SHA-256 to match the trusted receipt
  on the workstation.
stages.0.objectives.2.text: Restoration is configured to deliver `recovery.tar` to `/srv/site` on the managed hosts,
  owned by `root` with mode `0644`, and refresh the service.
stages.0.objectives.3.text: The configured restore processes one managed host per batch.
stages.0.objectives.4.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` contains `north-96`.
stages.0.objectives.5.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` has mode `0644`.
stages.0.objectives.6.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` is owned by user
  `root` and group `root`.
stages.0.objectives.7.text: HTTP on port `8080` returns `north-96` on every managed host (`app1`, `app2`, `app3`).
hints.0.text: A readable archive is not automatically the approved recovery artifact.
hints.1.text: In `rollout.yml`, locate `expected_sha256`; the authoritative receipt is the backend-frozen `/run/dq/facts/0/artifact.sha256`.
hints.2.text: Correct the expected checksum, retain assertion and restore serially with explicit metadata. Inspect
  the archive member paths with `tar -tf recovery.tar` before restoration.
phrases.0: I verified the recovery artifact before distributing it.
phrases.1: I restored explicit ownership and permissions.
phrases.2: I checked each target and the live service after reload.
