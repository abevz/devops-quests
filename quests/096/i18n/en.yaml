diagnostics.restore_budget: SSH observations or the current playbook caller trial may exceed the shared 12-second budget, or the observer may exhaust its deadline before another command. Verify connectivity and the bounded restore/reload workflow before repeating. A socket timeout while reading application HTTP is an OSError observation failure instead of this subprocess budget marker. [Cause and check](guides#guide=ansible-11&section=selective-restore-bounded-restore-observation)
diagnostics.restore_observation: Before entering a host, the observer may fail to read or decode the frozen application contract, original process identities, live-data baseline or namespace input. Verify those supplied inputs and the workstation environment before changing the targets. Host-specific failures after the loop starts use the numbered observation marker instead. [Cause and check](guides#guide=ansible-11&section=selective-restore-frozen-restore-inputs)
diagnostics.restore_observation_1: An SSH/process/file read, malformed remote JSON, HTTP socket error or other caught observation failure may prevent a host comparison. This marker identifies the active host, not a proven failed data predicate; after the third host it can also cover caller-trial observation failures. Inspect connectivity and readable current files while preserving original identities. [Cause and check](guides#guide=ansible-11&section=selective-restore-host-restore-observation)
diagnostics.restore_observation_2: An SSH/process/file read, malformed remote JSON, HTTP socket error or other caught observation failure may prevent a host comparison. This marker identifies the active host, not a proven failed data predicate; after the third host it can also cover caller-trial observation failures. Inspect connectivity and readable current files while preserving original identities. [Cause and check](guides#guide=ansible-11&section=selective-restore-host-restore-observation)
diagnostics.restore_observation_3: An SSH/process/file read, malformed remote JSON, HTTP socket error or other caught observation failure may prevent a host comparison. This marker identifies the active host, not a proven failed data predicate; after the third host it can also cover caller-trial observation failures. Inspect connectivity and readable current files while preserving original identities. [Cause and check](guides#guide=ansible-11&section=selective-restore-host-restore-observation)
diagnostics.restore_effects: A playbook can repair the fleet yet fail when a caller supplies another destination, owner and reload command through PATH. Use restore_root, restore_owner and restore_group, restore only message with mode 0644 and notify dq-service reload. The caller trial requires exact north-96 newline bytes and refreshed cache while its unrelated binding, tenant and control files retain inode, modification time, permissions, ownership and bytes; hardcoded fleet paths or whole-archive extraction break these effects. [Cause and check](guides#guide=ansible-11&section=selective-restore-caller-owned-restore-effects)
diagnostics.probe_0_2: An unlabelled failure in the bounded legacy remote group, Python/helper startup or an uncaught document-shape exception can stop observation before a named result. Check readable supplied inputs and actual SSH observations; ordinary content/mode/owner failures and caught process/data/HTTP observations already have their own markers. This fallback appears only if none was emitted earlier. [Cause and check](guides#guide=ansible-11&section=selective-restore-unlabelled-restore-observer-failure)
diagnostics.http_1: The legacy HTTP service on port 8080 can still serve its retired cached message even after the target file is corrected. Notify its existing dq-service reload handler after the verified extraction and recheck north-96 on each host; HTTP/network errors also fail this value comparison. This cache is separate from the original application on port 8081, which reads current files on every request. [Cause and check](guides#guide=ansible-11&section=selective-restore-existing-http-cache-reload)
