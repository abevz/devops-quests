title: Controlled restore
brief: "The fleet needs its approved message configuration restored from the supplied archive.\n\nWork on the workstation\
  \ in `~/quest` with `recovery.tar`, `rollout.yml`. Additional files on the workstation in `~/quest`: `application-contract.json`,\
  \ `provided-application.py`, `original-application-identities.json`, `original-live-data.json`.\n\n**Requirements:**\n\
  - Trusted archive on the workstation:\n  - Path: `~/quest/recovery.tar`.\n  - Its SHA-256 digest matches the backend-frozen\
  \ trusted receipt.\n  - A restore with a mismatching checksum is refused.\n- File on every managed host (`app1`,\
  \ `app2`, `app3`):\n  - Path: `/srv/site/message`.\n  - Content: `north-96`.\n  - Access mode: `0644`.\n  - Owner\
  \ and group: `root` / `root`.\n- Live service on every managed host (`app1`, `app2`, `app3`):\n  - HTTP: `8080`,\
  \ `/`.\n  - Response: `north-96`.\n- On every managed host (`app1`, `app2`, `app3`), the supplied HTTP application\
  \ on `8081`, `/`, shows `north-96` with its original live binding and existing tenant values. Retain the original\
  \ ownership, group and mode recorded in `original-live-data.json`. The current certified `rollout.yml` also restores\
  \ for the caller-provided destination and file principals in `application-contract.json`, refreshes the supplied\
  \ service and retains other caller data.\n- Preserve the application processes, principals, groups, capabilities,\
  \ command lines and installed program bytes recorded in `original-application-identities.json`.\n\nThe check inspects\
  \ current results and retained source constraints; it does not replay every failure or prove past restore order."
debrief: You constructed a verified, scoped restore that preserves active process identity and existing data, and
  also works for a caller-owned destination and principals.
stages.0.brief: The verified restore must leave the approved message content and metadata across the fleet.
stages.0.objectives.0.text: On the workstation, `recovery.tar` matches the backend-frozen trusted receipt.
stages.0.objectives.1.text: A restore with a mismatching archive checksum is refused.
stages.0.objectives.2.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` contains `north-96`,
  has mode `0644`, and belongs to user `root` and group `root`. The supplied applications also retain their live
  bindings, tenant values and access metadata; the current certified program fulfills the caller restore contract
  and refreshes its service.
stages.0.objectives.3.text: HTTP on port `8080` returns `north-96` on every managed host (`app1`, `app2`, `app3`).
hints.0.text: A trusted snapshot and a running instance have different lifetimes. Plan the extraction scope against
  the current instance binding and data already in use.
hints.1.text: Compare `tar -tf recovery.tar`, `application-contract.json`, `provided-application.py` and the original
  live receipts. Inspect the managed hosts’ current application inputs and HTTP response before extracting. Follow
  which archive members would overwrite state belonging to the live instance.
hints.2.text: Construct the certified checksum guard before extraction and select the configuration members with
  unarchive include/exclude filters. Notify the supported `dq-service reload` handler after extraction. Honor the
  declared restore destination, owner and group for the caller context. Run `ansible-playbook rollout.yml`; confirm
  `sha256sum recovery.tar` matches the frozen receipt, the original file ownership and mode still hold, and HTTP
  on `8080` and `8081` shows `north-96`. The provided application must keep its original instance and tenant values;
  the caller replay must also refresh its service.
phrases.0: I verified the recovery artifact before distributing it.
phrases.1: I restored explicit ownership and permissions.
phrases.2: I checked each target and the live service after reload.
diagnostics.artifact: The supplied recovery.tar may be missing or changed after extraction or repacking. Preserve its raw bytes and compare SHA-256 with the frozen artifact.sha256 receipt; a rewritten working checksum does not authorize a different archive. The final archive includes stale binding and tenant records, so a trusted archive is not permission to overwrite every live file. [Cause and check](guides#guide=ansible-11&section=selective-restore-trusted-original-archive)
diagnostics.probe_0_1: 'The playbook can be valid Ansible yet fail the bounded checksum workflow: a controller SHA-256 stat must feed a full trusted-checksum equality that rejects mismatches before extraction. A skipped, conditional or rescued guard, stale register, wrong archive source, opaque role/module/variable binding, side-effecting lookup or uncertified reload handler can invalidate that proof. YAML, missing input or observer startup errors also use this fallback; inspect the linked workflow rather than treating syntax success as certification. [Cause and check](guides#guide=ansible-11&section=selective-restore-checksum-before-certified-extraction)'
diagnostics.content_1: The target may still contain its retired message, or the SSH/read observation may fail. Restore the verified archive message so /srv/site/message reads north-96, while excluding the archived old binding and tenant files. Do not replace current application data merely because it shares the archive directory. [Cause and check](guides#guide=ansible-11&section=selective-restore-select-message-content)
diagnostics.content_2: The target may still contain its retired message, or the SSH/read observation may fail. Restore the verified archive message so /srv/site/message reads north-96, while excluding the archived old binding and tenant files. Do not replace current application data merely because it shares the archive directory. [Cause and check](guides#guide=ansible-11&section=selective-restore-select-message-content)
diagnostics.content_3: The target may still contain its retired message, or the SSH/read observation may fail. Restore the verified archive message so /srv/site/message reads north-96, while excluding the archived old binding and tenant files. Do not replace current application data merely because it shares the archive directory. [Cause and check](guides#guide=ansible-11&section=selective-restore-select-message-content)
diagnostics.mode_1: The restored message may have inherited the wrong permissions or be unreadable through SSH. Keep /srv/site/message at mode 0644 so the original nonroot application can read it. This file mode is separate from the private tenant data, whose original mode must remain intact. [Cause and check](guides#guide=ansible-11&section=selective-restore-restored-message-mode)
diagnostics.mode_2: The restored message may have inherited the wrong permissions or be unreadable through SSH. Keep /srv/site/message at mode 0644 so the original nonroot application can read it. This file mode is separate from the private tenant data, whose original mode must remain intact. [Cause and check](guides#guide=ansible-11&section=selective-restore-restored-message-mode)
diagnostics.mode_3: The restored message may have inherited the wrong permissions or be unreadable through SSH. Keep /srv/site/message at mode 0644 so the original nonroot application can read it. This file mode is separate from the private tenant data, whose original mode must remain intact. [Cause and check](guides#guide=ansible-11&section=selective-restore-restored-message-mode)
diagnostics.owner_1: The fleet message must retain the required root owner and group, represented by 0:0; a failed SSH/stat observation also fails this comparison. Use the declared owner/group inputs when restoring, because the separate caller-capability check overrides them to a different local identity. Do not transfer the private tenant file to root with the message. [Cause and check](guides#guide=ansible-11&section=selective-restore-restored-message-owner)
diagnostics.owner_2: The fleet message must retain the required root owner and group, represented by 0:0; a failed SSH/stat observation also fails this comparison. Use the declared owner/group inputs when restoring, because the separate caller-capability check overrides them to a different local identity. Do not transfer the private tenant file to root with the message. [Cause and check](guides#guide=ansible-11&section=selective-restore-restored-message-owner)
diagnostics.owner_3: The fleet message must retain the required root owner and group, represented by 0:0; a failed SSH/stat observation also fails this comparison. Use the declared owner/group inputs when restoring, because the separate caller-capability check overrides them to a different local identity. Do not transfer the private tenant file to root with the message. [Cause and check](guides#guide=ansible-11&section=selective-restore-restored-message-owner)
diagnostics.application_identity_1: Restarting the consumer, changing its program or privileges, or replacing its PID receipt breaks the frozen process identity. Retain the original PID/start time, command, UID/GID/groups, all recorded capability sets and program bytes. This application reads current files on every HTTP request and has no SIGHUP handler; a signal or replacement process is not needed to adopt the restored message. [Cause and check](guides#guide=ansible-11&section=selective-restore-original-application-process)
