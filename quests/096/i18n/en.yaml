title: Controlled restore
brief: 'The fleet needs its previous board configuration restored from recovery.tar. The archive is a
  supplied game fixture containing only message; its trusted SHA-256 is frozen under /run/dq/facts/0/artifact.sha256.
  rollout.yml deliberately expects the wrong checksum. Inspect the archive paths, correct expected_sha256
  from the trusted receipt, then use the serial Ansible restore with checksum assertion, explicit root
  ownership/0644 permissions and the reload handler. Do not disable verification or restore unrelated
  paths.


  Quest files in `~/quest` (some appear in later stages): `recovery.tar`, `artifact.sha256`, `rollout.yml`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: The verified archive restores all three targets with correct ownership, permissions
  and live HTTP; serial execution and checksum assertions remain configured.'
debrief: Recovery retained artifact verification, controlled rollout and explicit file metadata.
stages.0.brief: 'The verified archive restores all three targets with correct ownership, permissions and
