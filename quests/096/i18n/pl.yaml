title: Kontrolowane przywracanie
brief: 'Flota wymaga przywrócenia poprzedniej konfiguracji board z recovery.tar. Archiwum to dostarczony
  element gry zawierający tylko message; jego zaufany SHA-256 jest zamrożony pod /run/dq/facts/0/artifact.sha256.
  rollout.yml celowo oczekuje niewłaściwego checksum. Sprawdź ścieżki archiwum, popraw expected_sha256
  z zaufanego potwierdzenia, a następnie użyj przywracania serial Ansible z asercją checksum, jawnymi
  uprawnieniami własności root/0644 i ponownym załadowaniem handler. Nie wyłączaj weryfikacji ani nie
  przywracaj niepowiązanych ścieżek.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `recovery.tar`, `artifact.sha256`,
  `rollout.yml`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: zweryfikowane archiwum przywraca wszystkie trzy cele z właściwymi właścicielami,
  uprawnieniami i aktywnym HTTP; Wykonanie serial i asercje checksum pozostają skonfigurowane.'
debrief: Odzyskiwanie zachowało weryfikację artifact, kontrolowane wdrożenie i jawny plik metadata.
stages.0.brief: 'Kryteria sukcesu: zweryfikowane archiwum przywraca wszystkie trzy cele z właściwymi właścicielami,
  uprawnieniami i aktywnym HTTP; Wykonanie serial i potwierdzenia sumy kontrolnej pozostają skonfigurowane.'
stages.0.objectives.0.text: Zweryfikowane archiwum przywraca wszystkie trzy cele z właściwymi właścicielami,
  uprawnieniami i aktywnym HTTP; Wykonanie serial i potwierdzenia sumy kontrolnej pozostają skonfigurowane.
hints.0.text: Czytelne archiwum nie jest automatycznie zatwierdzonym odzyskiwaniem artifact.
hints.1.text: Porównaj swój checksum z zamrożonym paragonem i wyświetl ścieżki członków.
hints.2.text: Popraw oczekiwany checksum, zachowaj assertion i przywróć szeregowo z jawnym metadata.
phrases.0: Przed dystrybucją zweryfikowałem odzyskiwanie artifact.
phrases.1: Przywróciłem wyraźną własność i uprawnienia.
phrases.2: Sprawdziłem każdy cel i usługę na żywo po reload.
