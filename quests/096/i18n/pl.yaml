title: Kontrolowane przywracanie
brief: "Flota potrzebuje przywrócenia zatwierdzonej konfiguracji tablicy z dostarczonego archiwum.\n\nPracuj na\
  \ workstation w `~/quest` z plikami `recovery.tar`, `rollout.yml`. Dodatkowe pliki na stacji roboczej w `~/quest`:\
  \ `application-contract.json`, `provided-application.py`, `original-application-identities.json`, `original-live-data.json`.\n\
  \n**Wymagania:**\n- Zaufane archiwum na workstation:\n  - Ścieżka: `~/quest/recovery.tar`.\n  - Jego skrót SHA-256\
  \ jest zgodny z zaufanym potwierdzeniem utrwalonym przez backend.\n  - Przywracanie z niezgodną sumą kontrolną\
  \ jest odrzucane.\n- Plik na każdym zarządzanym hoście (`app1`, `app2`, `app3`):\n  - Ścieżka: `/srv/site/message`.\n\
  \  - Treść: `north-96`.\n  - Tryb dostępu: `0644`.\n  - Właściciel i grupa: `root` / `root`.\n- Aktywna usługa\
  \ na każdym zarządzanym hoście (`app1`, `app2`, `app3`):\n  - HTTP: `8080`, `/`.\n  - Odpowiedź: `north-96`.\n\
  - Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) dostarczona aplikacja HTTP na `8081`, `/`, pokazuje `north-96`\
  \ z oryginalnym aktywnym powiązaniem i istniejącymi wartościami dzierżawcy. Zachowaj właściciela, grupę i uprawnienia\
  \ z `original-live-data.json`. Bieżący certyfikowany `rollout.yml` odtwarza również dla katalogu i kont plikowych\
  \ wywołującego z `application-contract.json`, odświeża dostarczoną usługę i zachowuje pozostałe dane.\n- Zachowaj\
  \ procesy aplikacji, konta, grupy, capabilities, wiersze poleceń i bajty zainstalowanego programu z `original-application-identities.json`.\n\
  \nSprawdzenie bada bieżące wyniki i zachowane ograniczenia źródła; nie odtwarza każdego błędu ani nie dowodzi\
  \ kolejności wcześniejszych operacji przywracania."
debrief: Zbudowano zweryfikowane odtwarzanie o ograniczonym zakresie, zachowujące tożsamość procesów i dane oraz
  obsługujące katalog i konta wywołującego.
stages.0.brief: Zweryfikowane przywracanie musi pozostawić zatwierdzoną treść i metadane tablicy w całej flocie.
stages.0.objectives.0.text: Na workstation archiwum `recovery.tar` jest zgodne z zaufanym potwierdzeniem utrwalonym
  przez backend.
stages.0.objectives.1.text: Przywracanie z niezgodną sumą kontrolną archiwum jest odrzucane.
stages.0.objectives.2.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/message` zawiera
  `north-96`, ma tryb `0644` i należy do użytkownika `root` oraz grupy `root`. Dostarczone aplikacje zachowują także
  aktywne powiązania, dane dzierżawcy i metadane dostępu; bieżący certyfikowany program spełnia kontrakt odtwarzania
  wywołującego i odświeża jego usługę.
stages.0.objectives.3.text: HTTP na porcie `8080` zwraca `north-96` na każdym zarządzanym hoście (`app1`, `app2`,
  `app3`).
hints.0.text: Zaufany zrzut i działająca instancja mają różne cykle życia. Planuj zakres wypakowania względem bieżącego
  powiązania instancji i już używanych danych.
hints.1.text: |-
  Porównaj `tar -tf recovery.tar`, `application-contract.json`, `provided-application.py` i oryginalne zapisy stanu. Przed wypakowaniem sprawdź bieżące wejścia aplikacji i odpowiedzi HTTP na zarządzanych hostach. Prześledź, które elementy archiwum nadpiszą stan działającej instancji.

  Odszukaj sumę kontrolną i pliki konfiguracji w spisie archiwum. Porównaj ich ścieżki z plikami tożsamości działającej instancji, a potem sprawdź ścieżkę odtwarzania, właściciela i grupę wywołującego.
hints.2.text: |-
  Uruchom `ansible-playbook rollout.yml`; potwierdź zgodność `sha256sum recovery.tar` z zamrożonym potwierdzeniem, oryginalnych właścicieli i uprawnień oraz `north-96` przez HTTP na `8080` i `8081`. Aplikacja ma zachować instancję i wartości dzierżawcy; przebieg wywołującego również musi odświeżyć jego usługę.

  ```sh
  (
    set -euo pipefail
    printf '%s  recovery.tar\n' "$(cat artifact.sha256)" | sha256sum -c -
    for number in 1 2 3; do
      inventory_name="app$number"
      host="$inventory_name-${DQ_NAMESPACE#dq-}"
      test "$(curl -fsS --max-time 3 "http://$host:8080/")" = north-96
      curl -fsS --max-time 3 "http://$host:8081/" |
        jq -e --arg host "$inventory_name" --slurpfile live original-live-data.json '
          $live[0][$host] as $before | .message == "north-96" and
          .instance == $before["consumer-binding.json"].json.instance and
          .account == $before["tenant.json"].json.account and
          .balance == $before["tenant.json"].json.balance' >/dev/null
      test "$(ssh -n -o BatchMode=yes -o ConnectTimeout=3 -p 2222 "root@$host" "stat -c '%u:%g %a' /srv/site/message")" = "0:0 644"
      expected=$(jq -er --arg host "$inventory_name" '
        .[$host] | [.["consumer-binding.json"], .["tenant.json"]][] | [.uid, .gid, .mode] | @tsv
      ' original-live-data.json | while read -r uid gid mode; do
        printf '%s %s %o\n' "$uid" "$gid" "$mode"
      done)
      observed=$(ssh -n -o BatchMode=yes -o ConnectTimeout=3 -p 2222 "root@$host"       "stat -c '%u %g %a' /srv/site/consumer-binding.json /srv/site/tenant.json")
      test "$observed" = "$expected"
      printf '%s: HTTP, restored message and protected-file metadata match\n' "$inventory_name"
    done
  )
  ```
phrases.0: Przed dystrybucją zweryfikowałem odzyskiwanie artifact.
phrases.1: Przywróciłem wyraźną własność i uprawnienia.
phrases.2: Sprawdziłem każdy cel i usługę na żywo po reload.
diagnostics.artifact: Dostarczony recovery.tar może zniknąć lub zmienić się po rozpakowaniu albo przepakowaniu. Zachowaj bajty i porównaj SHA-256 z zamrożonym artifact.sha256; roboczy checksum nie zatwierdza innego archiwum. Końcowe archiwum zawiera stare binding i tenant, więc zaufanie nie oznacza zgody na nadpisanie wszystkich plików. [Przyczyna i kontrola](guides#guide=ansible-11&section=selective-restore-trusted-original-archive)
diagnostics.probe_0_1: 'Playbook może być poprawnym Ansible, lecz nie przejść ograniczonego workflow: controller stat SHA-256 ma zasilać pełne porównanie z zaufaną sumą odrzucające różnice przed rozpakowaniem. Pominięty, warunkowy lub przechwycony guard, stary register, inne archiwum, nieprzejrzyste role/module/vars, lookup z efektami lub niepotwierdzony reload handler unieważnia dowód. Błędy YAML, wejść i startu observer też dają fallback; poprawny składniowo program nie oznacza certyfikacji. [Przyczyna i kontrola](guides#guide=ansible-11&section=selective-restore-checksum-before-certified-extraction)'
diagnostics.content_1: Cel może nadal zawierać starą wiadomość albo odczyt SSH może zawodzić. Odtwórz zweryfikowany message w /srv/site/message z north-96, wykluczając stare binding i tenant. Nie zastępuj bieżących danych aplikacji tylko dlatego, że są w tym samym katalogu archiwum. [Przyczyna i kontrola](guides#guide=ansible-11&section=selective-restore-select-message-content)
diagnostics.content_2: Cel może nadal zawierać starą wiadomość albo odczyt SSH może zawodzić. Odtwórz zweryfikowany message w /srv/site/message z north-96, wykluczając stare binding i tenant. Nie zastępuj bieżących danych aplikacji tylko dlatego, że są w tym samym katalogu archiwum. [Przyczyna i kontrola](guides#guide=ansible-11&section=selective-restore-select-message-content)
