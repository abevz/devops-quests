diagnostics.mode_1: Odtworzony message mógł odziedziczyć złe uprawnienia albo być nieczytelny przez SSH. Zachowaj /srv/site/message z trybem 0644, aby pierwotna aplikacja nonroot mogła go czytać. Prywatne dane tenant mają osobno zachować pierwotny tryb. [Przyczyna i kontrola](guides#guide=ansible-11&section=selective-restore-restored-message-mode)
diagnostics.mode_2: Odtworzony message mógł odziedziczyć złe uprawnienia albo być nieczytelny przez SSH. Zachowaj /srv/site/message z trybem 0644, aby pierwotna aplikacja nonroot mogła go czytać. Prywatne dane tenant mają osobno zachować pierwotny tryb. [Przyczyna i kontrola](guides#guide=ansible-11&section=selective-restore-restored-message-mode)
diagnostics.mode_3: Odtworzony message mógł odziedziczyć złe uprawnienia albo być nieczytelny przez SSH. Zachowaj /srv/site/message z trybem 0644, aby pierwotna aplikacja nonroot mogła go czytać. Prywatne dane tenant mają osobno zachować pierwotny tryb. [Przyczyna i kontrola](guides#guide=ansible-11&section=selective-restore-restored-message-mode)
diagnostics.owner_1: Fleet message wymaga właściciela i grupy root, czyli 0:0; błąd SSH/stat też narusza porównanie. Przy odtwarzaniu używaj zadeklarowanych owner/group, bo osobny test caller podmienia je na inną lokalną tożsamość. Nie przenoś prywatnego tenant do root razem z message. [Przyczyna i kontrola](guides#guide=ansible-11&section=selective-restore-restored-message-owner)
diagnostics.owner_2: Fleet message wymaga właściciela i grupy root, czyli 0:0; błąd SSH/stat też narusza porównanie. Przy odtwarzaniu używaj zadeklarowanych owner/group, bo osobny test caller podmienia je na inną lokalną tożsamość. Nie przenoś prywatnego tenant do root razem z message. [Przyczyna i kontrola](guides#guide=ansible-11&section=selective-restore-restored-message-owner)
diagnostics.owner_3: Fleet message wymaga właściciela i grupy root, czyli 0:0; błąd SSH/stat też narusza porównanie. Przy odtwarzaniu używaj zadeklarowanych owner/group, bo osobny test caller podmienia je na inną lokalną tożsamość. Nie przenoś prywatnego tenant do root razem z message. [Przyczyna i kontrola](guides#guide=ansible-11&section=selective-restore-restored-message-owner)
diagnostics.application_identity_1: Restart consumer, zmiana programu, uprawnień lub zapisu PID narusza zamrożoną tożsamość. Zachowaj PID/start time, komendę, UID/GID/groups, wszystkie capability sets i bajty programu. Aplikacja czyta bieżące pliki przy każdym HTTP i nie ma SIGHUP handler; sygnał ani nowy proces nie są potrzebne do przyjęcia message. [Przyczyna i kontrola](guides#guide=ansible-11&section=selective-restore-original-application-process)
diagnostics.application_identity_2: Restart consumer, zmiana programu, uprawnień lub zapisu PID narusza zamrożoną tożsamość. Zachowaj PID/start time, komendę, UID/GID/groups, wszystkie capability sets i bajty programu. Aplikacja czyta bieżące pliki przy każdym HTTP i nie ma SIGHUP handler; sygnał ani nowy proces nie są potrzebne do przyjęcia message. [Przyczyna i kontrola](guides#guide=ansible-11&section=selective-restore-original-application-process)
