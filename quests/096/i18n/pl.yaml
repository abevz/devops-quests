diagnostics.live_binding_1: Rozpakowanie całego archiwum nadpisuje consumer-binding.json przez PID 0 i stary instance nonce, które nie opisują pierwotnego procesu. Odtwarzaj tylko message i zachowaj dokładny bieżący binding JSON wraz z owner, group i mode. Żywy predykat porównuje zdekodowaną treść i metadane, nie inode, mtime ani format bajtów. [Przyczyna i kontrola](guides#guide=ansible-11&section=selective-restore-current-live-binding)
diagnostics.live_binding_2: Rozpakowanie całego archiwum nadpisuje consumer-binding.json przez PID 0 i stary instance nonce, które nie opisują pierwotnego procesu. Odtwarzaj tylko message i zachowaj dokładny bieżący binding JSON wraz z owner, group i mode. Żywy predykat porównuje zdekodowaną treść i metadane, nie inode, mtime ani format bajtów. [Przyczyna i kontrola](guides#guide=ansible-11&section=selective-restore-current-live-binding)
diagnostics.live_binding_3: Rozpakowanie całego archiwum nadpisuje consumer-binding.json przez PID 0 i stary instance nonce, które nie opisują pierwotnego procesu. Odtwarzaj tylko message i zachowaj dokładny bieżący binding JSON wraz z owner, group i mode. Żywy predykat porównuje zdekodowaną treść i metadane, nie inode, mtime ani format bajtów. [Przyczyna i kontrola](guides#guide=ansible-11&section=selective-restore-current-live-binding)
diagnostics.live_data_1: Archiwalny tenant.json pochodzi ze starego zrzutu i pełne rozpakowanie zastępuje bieżące account/balance oraz prywatne prawa. Zachowaj wszystkie pierwotne klucze/wartości tenant, UID, GID i mode; dodatkowe klucze JSON są dozwolone. Zachowaj dane czytelne dla aplikacji UID 1001 zamiast kopiować archiwalny rekord. [Przyczyna i kontrola](guides#guide=ansible-11&section=selective-restore-current-tenant-data)
diagnostics.live_data_2: Archiwalny tenant.json pochodzi ze starego zrzutu i pełne rozpakowanie zastępuje bieżące account/balance oraz prywatne prawa. Zachowaj wszystkie pierwotne klucze/wartości tenant, UID, GID i mode; dodatkowe klucze JSON są dozwolone. Zachowaj dane czytelne dla aplikacji UID 1001 zamiast kopiować archiwalny rekord. [Przyczyna i kontrola](guides#guide=ansible-11&section=selective-restore-current-tenant-data)
diagnostics.live_data_3: Archiwalny tenant.json pochodzi ze starego zrzutu i pełne rozpakowanie zastępuje bieżące account/balance oraz prywatne prawa. Zachowaj wszystkie pierwotne klucze/wartości tenant, UID, GID i mode; dodatkowe klucze JSON są dozwolone. Zachowaj dane czytelne dla aplikacji UID 1001 zamiast kopiować archiwalny rekord. [Przyczyna i kontrola](guides#guide=ansible-11&section=selective-restore-current-tenant-data)
diagnostics.application_ready_1: Pierwotna aplikacja może zwrócić HTTP 503, gdy binding nie zgadza się z PID/instance lub nie może czytać prywatnych tenant/message. Odkodowana odpowiedź z błędnym message, instance, account lub balance też daje marker. Przywróć tylko zatwierdzony message, zachowując żywe binding/data; żądania czytają pliki bezpośrednio, więc nie restartuj ani nie sygnalizuj procesu. [Przyczyna i kontrola](guides#guide=ansible-11&section=selective-restore-actual-live-application-response)
diagnostics.application_ready_2: Pierwotna aplikacja może zwrócić HTTP 503, gdy binding nie zgadza się z PID/instance lub nie może czytać prywatnych tenant/message. Odkodowana odpowiedź z błędnym message, instance, account lub balance też daje marker. Przywróć tylko zatwierdzony message, zachowując żywe binding/data; żądania czytają pliki bezpośrednio, więc nie restartuj ani nie sygnalizuj procesu. [Przyczyna i kontrola](guides#guide=ansible-11&section=selective-restore-actual-live-application-response)
diagnostics.application_ready_3: Pierwotna aplikacja może zwrócić HTTP 503, gdy binding nie zgadza się z PID/instance lub nie może czytać prywatnych tenant/message. Odkodowana odpowiedź z błędnym message, instance, account lub balance też daje marker. Przywróć tylko zatwierdzony message, zachowując żywe binding/data; żądania czytają pliki bezpośrednio, więc nie restartuj ani nie sygnalizuj procesu. [Przyczyna i kontrola](guides#guide=ansible-11&section=selective-restore-actual-live-application-response)
diagnostics.restore_budget: Obserwacje SSH lub próba caller bieżącego playbook mogą przekroczyć wspólny budżet 12 sekund albo obserwator wyczerpie czas przed poleceniem. Sprawdź łączność i ograniczony restore/reload workflow przed powtórką. Socket timeout przy HTTP aplikacji jest błędem obserwacji OSError zamiast tego subprocess budget. [Przyczyna i kontrola](guides#guide=ansible-11&section=selective-restore-bounded-restore-observation)
diagnostics.restore_observation: Przed wejściem do hosta obserwator może nie odczytać lub zdekodować zamrożonego kontraktu, tożsamości procesów, live-data baseline lub namespace. Sprawdź te dane i środowisko workstation przed zmianą celów. Po rozpoczęciu pętli błędy obserwacji mają numerowany marker hosta. [Przyczyna i kontrola](guides#guide=ansible-11&section=selective-restore-frozen-restore-inputs)
diagnostics.restore_observation_1: SSH, odczyt procesu/pliku, błędny zdalny JSON, błąd socket HTTP lub inna przechwycona awaria może uniemożliwić porównanie hosta. Marker wskazuje aktywny host, nie dowiedziony błąd danych; po trzecim hoście może też obejmować obserwację caller. Sprawdź łączność i odczyt plików, zachowując tożsamości. [Przyczyna i kontrola](guides#guide=ansible-11&section=selective-restore-host-restore-observation)
diagnostics.restore_observation_2: SSH, odczyt procesu/pliku, błędny zdalny JSON, błąd socket HTTP lub inna przechwycona awaria może uniemożliwić porównanie hosta. Marker wskazuje aktywny host, nie dowiedziony błąd danych; po trzecim hoście może też obejmować obserwację caller. Sprawdź łączność i odczyt plików, zachowując tożsamości. [Przyczyna i kontrola](guides#guide=ansible-11&section=selective-restore-host-restore-observation)
diagnostics.restore_observation_3: SSH, odczyt procesu/pliku, błędny zdalny JSON, błąd socket HTTP lub inna przechwycona awaria może uniemożliwić porównanie hosta. Marker wskazuje aktywny host, nie dowiedziony błąd danych; po trzecim hoście może też obejmować obserwację caller. Sprawdź łączność i odczyt plików, zachowując tożsamości. [Przyczyna i kontrola](guides#guide=ansible-11&section=selective-restore-host-restore-observation)
diagnostics.restore_effects: Playbook może naprawić fleet, lecz zawieść przy innym destination, owner i reload przez PATH caller. Używaj restore_root, restore_owner i restore_group, odtwarzaj tylko message z 0644 i notify dq-service reload. Próba wymaga dokładnych bajtów north-96 z newline i odświeżonego cache, a obce binding, tenant i control mają zachować inode, mtime, prawa, właściciela i bajty; sztywne ścieżki fleet lub pełne archiwum łamią efekty. [Przyczyna i kontrola](guides#guide=ansible-11&section=selective-restore-caller-owned-restore-effects)
diagnostics.probe_0_2: Nienazwana awaria ograniczonej legacy remote grupy, startu Python/helper lub nieobsłużonej struktury dokumentu może przerwać obserwację przed nazwanym wynikiem. Sprawdź dane i rzeczywisty SSH; zwykłe content/mode/owner oraz przechwycone obserwacje process/data/HTTP mają własne markery. Fallback pojawia się tylko bez wcześniejszego markera. [Przyczyna i kontrola](guides#guide=ansible-11&section=selective-restore-unlabelled-restore-observer-failure)
diagnostics.http_1: Legacy HTTP na 8080 może zwracać starą wiadomość z cache po naprawie pliku. Po zweryfikowanej ekstrakcji powiadom istniejący handler dq-service reload i sprawdź north-96 na każdym hoście; błędy HTTP/sieci też naruszają porównanie. To inny cache niż aplikacja 8081 czytająca pliki przy każdym żądaniu. [Przyczyna i kontrola](guides#guide=ansible-11&section=selective-restore-existing-http-cache-reload)
diagnostics.http_2: Legacy HTTP na 8080 może zwracać starą wiadomość z cache po naprawie pliku. Po zweryfikowanej ekstrakcji powiadom istniejący handler dq-service reload i sprawdź north-96 na każdym hoście; błędy HTTP/sieci też naruszają porównanie. To inny cache niż aplikacja 8081 czytająca pliki przy każdym żądaniu. [Przyczyna i kontrola](guides#guide=ansible-11&section=selective-restore-existing-http-cache-reload)
diagnostics.http_3: Legacy HTTP na 8080 może zwracać starą wiadomość z cache po naprawie pliku. Po zweryfikowanej ekstrakcji powiadom istniejący handler dq-service reload i sprawdź north-96 na każdym hoście; błędy HTTP/sieci też naruszają porównanie. To inny cache niż aplikacja 8081 czytająca pliki przy każdym żądaniu. [Przyczyna i kontrola](guides#guide=ansible-11&section=selective-restore-existing-http-cache-reload)
