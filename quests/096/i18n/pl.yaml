title: Kontrolowane przywracanie
brief: |-
  Flota potrzebuje przywrócenia zatwierdzonej konfiguracji tablicy z dostarczonego archiwum.

  Pracuj na workstation w `~/quest` z plikami `recovery.tar`, `artifact.sha256`, `rollout.yml`.

  **Wymagania:**
  - Zaufane archiwum na workstation:
    - Ścieżka: `~/quest/recovery.tar`.
    - Zamrożone potwierdzenie SHA-256: `/run/dq/facts/0/artifact.sha256`.
  - Skonfigurowane przywracanie:
    - Zakres: `app1`, `app2`, `app3`.
    - Wymagana jest weryfikacja archiwum względem zaufanego potwierdzenia.
    - Jeden zarządzany host w partii; przywrócona usługa jest odświeżana.
    - Cel archiwum na zarządzanych hostach: `/srv/site`.
    - Właściciel i grupa: `root` / `root`.
    - Tryb dostępu: `0644`.
  - Plik na każdym zarządzanym hoście (`app1`, `app2`, `app3`):
    - Ścieżka: `/srv/site/message`.
    - Treść: `north-96`.
    - Tryb dostępu: `0644`.
    - Właściciel i grupa: `root` / `root`.
  - Aktywna usługa na każdym zarządzanym hoście (`app1`, `app2`, `app3`):
    - HTTP: `8080`, `/`.
    - Odpowiedź: `north-96`.

  **Sprawdź przed Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'cat /srv/site/message; ls -l /srv/site/message'` — Każdy host pokazuje `north-96`, uprawnienia `-rw-r--r--`, właściciela `root` i grupę `root`.
  - `for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done` — Pokazuje `north-96` z `app1`, `app2`, `app3`.
  - `sha256sum recovery.tar; cat /run/dq/facts/0/artifact.sha256` — Suma archiwum jest zgodna z zamrożoną zaufaną sumą.

  Obserwacje odbiorcy pokazują dostarczony stan; Check sprawdza też zaufane archiwum i konfigurację przywracania.
debrief: Odzyskiwanie zachowało weryfikację artifact, kontrolowane wdrożenie i jawny plik metadata.
stages.0.brief: Zweryfikowane przywracanie musi pozostawić zatwierdzoną treść i metadane tablicy w całej flocie.
stages.0.objectives.0.text: Na workstation archiwum `recovery.tar` jest zgodne z zaufanym potwierdzeniem `/run/dq/facts/0/artifact.sha256`.
stages.0.objectives.1.text: Przywracanie wymaga zgodności SHA-256 archiwum z zaufanym potwierdzeniem na workstation.
stages.0.objectives.2.text: Przywracanie dostarcza `recovery.tar` do `/srv/site` na zarządzanych hostach, z właścicielem
  `root`, trybem `0644` i odświeżeniem usługi.
stages.0.objectives.3.text: Skonfigurowane przywracanie obejmuje jeden zarządzany host w partii.
stages.0.objectives.4.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/message` zawiera
  `north-96`.
stages.0.objectives.5.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) ścieżka `/srv/site/message` ma
  tryb `0644`.
stages.0.objectives.6.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/message` należy
  do użytkownika `root` i grupy `root`.
stages.0.objectives.7.text: HTTP na porcie `8080` zwraca `north-96` na każdym zarządzanym hoście (`app1`, `app2`,
  `app3`).
hints.0.text: Czytelne archiwum nie jest automatycznie zatwierdzonym odzyskiwaniem artifact.
hints.1.text: Znajdź `expected_sha256` w `rollout.yml`; źródłem prawdy jest zamrożony przez backend plik `/run/dq/facts/0/artifact.sha256`.
hints.2.text: Popraw oczekiwany checksum, zachowaj assertion i przywróć szeregowo z jawnym metadata. Przed przywracaniem
  sprawdź ścieżki w archiwum przez `tar -tf recovery.tar`.
phrases.0: Przed dystrybucją zweryfikowałem odzyskiwanie artifact.
phrases.1: Przywróciłem wyraźną własność i uprawnienia.
phrases.2: Sprawdziłem każdy cel i usługę na żywo po reload.
