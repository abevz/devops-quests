title: Kontrolowane przywracanie
brief: |-
  Flota potrzebuje przywrócenia zatwierdzonej konfiguracji tablicy z dostarczonego archiwum.

  Pracuj na workstation w `~/quest` z plikami `recovery.tar`, `rollout.yml`.

  **Wymagania:**
  - Zaufane archiwum na workstation:
    - Ścieżka: `~/quest/recovery.tar`.
    - Jego skrót SHA-256 jest zgodny z zaufanym potwierdzeniem utrwalonym przez backend.
    - Przywracanie z niezgodną sumą kontrolną jest odrzucane.
  - Plik na każdym zarządzanym hoście (`app1`, `app2`, `app3`):
    - Ścieżka: `/srv/site/message`.
    - Treść: `north-96`.
    - Tryb dostępu: `0644`.
    - Właściciel i grupa: `root` / `root`.
  - Aktywna usługa na każdym zarządzanym hoście (`app1`, `app2`, `app3`):
    - HTTP: `8080`, `/`.
    - Odpowiedź: `north-96`.

  Sprawdzenie bada bieżące wyniki i zachowane ograniczenia źródła; nie odtwarza każdego błędu ani nie dowodzi kolejności wcześniejszych operacji przywracania.
debrief: Odzyskiwanie zachowało weryfikację artifact, kontrolowane wdrożenie i jawny plik metadata.
stages.0.brief: Zweryfikowane przywracanie musi pozostawić zatwierdzoną treść i metadane tablicy w całej
  flocie.
stages.0.objectives.0.text: Na workstation archiwum `recovery.tar` jest zgodne z zaufanym potwierdzeniem
  utrwalonym przez backend.
stages.0.objectives.1.text: Przywracanie z niezgodną sumą kontrolną archiwum jest odrzucane.
stages.0.objectives.2.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/message`
  zawiera `north-96`, ma tryb `0644` i należy do użytkownika `root` oraz grupy `root`.
stages.0.objectives.3.text: HTTP na porcie `8080` zwraca `north-96` na każdym zarządzanym hoście (`app1`,
  `app2`, `app3`).
hints.0.text: Czytelne archiwum nie jest automatycznie zatwierdzonym odzyskiwaniem artifact.
hints.1.text: |-
  Znajdź `expected_sha256` w `rollout.yml`; źródłem prawdy jest zamrożony przez backend plik `/run/dq/facts/0/artifact.sha256`.

  Sprawdź inventory i dostarczony playbook na workstation:

  ```sh
  cat rollout.yml
  ls -l recovery.tar artifact.sha256
  ```
hints.2.text: |-
  Sprawdź wynik z `~/quest` na workstation:

  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'cat /srv/site/message; ls -l /srv/site/message'` — Każdy host pokazuje `north-96`, uprawnienia `-rw-r--r--`, właściciela `root` i grupę `root`.
  - `for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done` — Pokazuje `north-96` z `app1`, `app2`, `app3`.
  - `sha256sum recovery.tar; cat /run/dq/facts/0/artifact.sha256` — Suma archiwum jest zgodna z zamrożoną zaufaną sumą.
phrases.0: Przed dystrybucją zweryfikowałem odzyskiwanie artifact.
phrases.1: Przywróciłem wyraźną własność i uprawnienia.
phrases.2: Sprawdziłem każdy cel i usługę na żywo po reload.
