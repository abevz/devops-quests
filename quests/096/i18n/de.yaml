title: Kontrollierte Wiederherstellung
brief: "Die genehmigte Anzeigekonfiguration der Flotte muss aus dem bereitgestellten Archiv wiederhergestellt werden.\n\
  \nArbeite auf der Workstation in `~/quest` mit `recovery.tar`, `rollout.yml`. Zusätzliche Dateien auf der Workstation\
  \ in `~/quest`: `application-contract.json`, `provided-application.py`, `original-application-identities.json`,\
  \ `original-live-data.json`.\n\n**Anforderungen:**\n- Vertrauenswürdiges Archiv auf der Workstation:\n  - Pfad:\
  \ `~/quest/recovery.tar`.\n  - Sein SHA-256-Digest stimmt mit dem vom Backend festgehaltenen vertrauenswürdigen\
  \ Beleg überein.\n  - Eine Wiederherstellung mit nicht übereinstimmender Prüfsumme wird abgelehnt.\n- Datei auf\
  \ jedem verwalteten Host (`app1`, `app2`, `app3`):\n  - Pfad: `/srv/site/message`.\n  - Inhalt: `north-96`.\n\
  \  - Zugriffsmodus: `0644`.\n  - Eigentümer und Gruppe: `root` / `root`.\n- Aktiver Dienst auf jedem verwalteten\
  \ Host (`app1`, `app2`, `app3`):\n  - HTTP: `8080`, `/`.\n  - Antwort: `north-96`.\n- Auf jedem verwalteten Host\
  \ (`app1`, `app2`, `app3`) zeigt die bereitgestellte HTTP-Anwendung an `8081`, `/`, `north-96` mit ihrer ursprünglichen\
  \ Live-Bindung und bestehenden Mandantenwerten. Bewahre Eigentum, Gruppe und Modus aus `original-live-data.json`.\
  \ Das aktuelle zertifizierte `rollout.yml` stellt auch für Ziel und Dateibenutzer des Aufrufers aus `application-contract.json`\
  \ wieder her, aktualisiert den bereitgestellten Dienst und bewahrt andere Aufruferdaten.\n- Bewahre die Anwendungsprozesse,\
  \ Benutzer, Gruppen, Capabilities, Befehlszeilen und installierten Programmbytes aus `original-application-identities.json`.\n\
  \nDie Prüfung untersucht aktuelle Ergebnisse und beibehaltene Quellvorgaben; sie spielt nicht jeden Fehler nach\
  \ und beweist keine vergangene Wiederherstellungsreihenfolge."
debrief: Du hast eine geprüfte Wiederherstellung mit begrenztem Schreibumfang erstellt, aktive Prozessidentität
  und bestehende Daten bewahrt und Aufruferziele sowie Dateibenutzer unterstützt.
stages.0.brief: Die überprüfte Wiederherstellung muss in der gesamten Flotte den genehmigten Anzeigeinhalt und dessen
  Metadaten hinterlassen.
stages.0.objectives.0.text: Auf der Workstation stimmt `recovery.tar` mit dem vom Backend festgehaltenen vertrauenswürdigen
  Beleg überein.
stages.0.objectives.1.text: Eine Wiederherstellung mit nicht übereinstimmender Archivprüfsumme wird abgelehnt.
stages.0.objectives.2.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/message` den
  Inhalt `north-96`, hat Modus `0644` und gehört Benutzer `root` und Gruppe `root`. Die bereitgestellten Anwendungen
  bewahren auch Live-Bindungen, Mandantenwerte und Zugriffsmetadaten; das aktuelle zertifizierte Programm erfüllt
  den Aufrufervertrag und aktualisiert dessen Dienst.
stages.0.objectives.3.text: HTTP auf Port `8080` liefert auf jedem verwalteten Host (`app1`, `app2`, `app3`) `north-96`.
hints.0.text: Ein vertrauenswürdiger Snapshot und eine laufende Instanz haben unterschiedliche Lebenszyklen. Plane
  den Extraktionsumfang anhand der aktuellen Instanzbindung und bereits verwendeten Daten.
hints.1.text: |-
  Vergleiche `tar -tf recovery.tar`, `application-contract.json`, `provided-application.py` und die ursprünglichen Live-Belege. Prüfe vor der Extraktion aktuelle Anwendungseingaben und HTTP-Antworten auf den verwalteten Hosts. Verfolge, welche Archiveinträge den Zustand der laufenden Instanz überschreiben würden.

  Suche in der Archivübersicht nach Prüfsumme und Konfigurationseinträgen. Vergleiche ihre Pfade mit den Identitätsdateien der laufenden Instanz und prüfe Wiederherstellungspfad, Eigentümer und Gruppe des Aufrufers.
hints.2.text: |-
  Führe `ansible-playbook rollout.yml` aus; bestätige `sha256sum recovery.tar` gegen den eingefrorenen Beleg, ursprüngliche Eigentümer und Modi sowie `north-96` über HTTP an `8080` und `8081`. Die Anwendung muss ursprüngliche Instanz- und Mandantenwerte behalten; auch der Aufruferlauf muss seinen Dienst aktualisieren.

  ```sh
  (
    set -euo pipefail
    printf '%s  recovery.tar\n' "$(cat artifact.sha256)" | sha256sum -c -
    for number in 1 2 3; do
      inventory_name="app$number"
      host="$inventory_name-${DQ_NAMESPACE#dq-}"
      test "$(curl -fsS --max-time 3 "http://$host:8080/")" = north-96
      curl -fsS --max-time 3 "http://$host:8081/" |
        jq -e --arg host "$inventory_name" --slurpfile live original-live-data.json '
          $live[0][$host] as $before | .message == "north-96" and
          .instance == $before["consumer-binding.json"].json.instance and
          .account == $before["tenant.json"].json.account and
          .balance == $before["tenant.json"].json.balance' >/dev/null
      test "$(ssh -n -o BatchMode=yes -o ConnectTimeout=3 -p 2222 "root@$host" "stat -c '%u:%g %a' /srv/site/message")" = "0:0 644"
      expected=$(jq -er --arg host "$inventory_name" '
        .[$host] | [.["consumer-binding.json"], .["tenant.json"]][] | [.uid, .gid, .mode] | @tsv
      ' original-live-data.json | while read -r uid gid mode; do
        printf '%s %s %o\n' "$uid" "$gid" "$mode"
      done)
      observed=$(ssh -n -o BatchMode=yes -o ConnectTimeout=3 -p 2222 "root@$host"       "stat -c '%u %g %a' /srv/site/consumer-binding.json /srv/site/tenant.json")
      test "$observed" = "$expected"
      printf '%s: HTTP, restored message and protected-file metadata match\n' "$inventory_name"
    done
  )
  ```
phrases.0: Ich habe die Wiederherstellung artifact überprüft, bevor ich sie verteilt habe.
phrases.1: Ich habe den expliziten Besitz und die Berechtigungen wiederhergestellt.
phrases.2: Ich habe jedes Ziel und den Live-Dienst nach reload überprüft.
diagnostics.artifact: recovery.tar fehlt möglicherweise oder wurde nach Entpacken beziehungsweise Neupacken geändert. Erhalten Sie rohe Bytes und vergleichen Sie SHA-256 mit eingefrorenem artifact.sha256; eine geänderte Arbeitsprüfsumme erlaubt kein anderes Archiv. Das endgültige Archiv enthält alte Binding- und Tenant-Daten; Vertrauen erlaubt daher kein Überschreiben aller Live-Dateien. [Ursache und Prüfung](guides#guide=ansible-11&section=selective-restore-trusted-original-archive)
diagnostics.probe_0_1: 'Ein gültiges Ansible-Playbook kann am begrenzten Workflow scheitern: Controller-stat mit SHA-256 muss einen vollständigen vertrauenswürdigen Gleichheitsvergleich speisen, der Abweichungen vor Extraktion abweist. Übersprungene, bedingte oder abgefangene Guards, alte Register, andere Archive, undurchsichtige Rollen/Module/Variablen, Lookups mit Effekten oder unbestätigte Reload-Handler entwerten den Nachweis. YAML-, Eingabe- und Observer-Startfehler nutzen denselben Fallback; Syntaxerfolg zertifiziert keinen Workflow. [Ursache und Prüfung](guides#guide=ansible-11&section=selective-restore-checksum-before-certified-extraction)'
diagnostics.content_1: Das Ziel enthält möglicherweise noch die alte Nachricht oder SSH-/Lesebeobachtung scheitert. Stellen Sie nur die geprüfte message unter /srv/site/message mit north-96 her und schließen Sie alte archivierte Binding- und Tenant-Dateien aus. Ersetzen Sie aktuelle Anwendungsdaten nicht wegen desselben Archivverzeichnisses. [Ursache und Prüfung](guides#guide=ansible-11&section=selective-restore-select-message-content)
