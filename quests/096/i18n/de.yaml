title: Kontrollierte Wiederherstellung
brief: 'Für die Flotte muss die vorherige board-Konfiguration von recovery.tar wiederhergestellt werden.
  Das Archiv ist ein bereitgestelltes Spielzubehör, das nur message enthält; sein vertrauenswürdiger SHA-256
  ist unter /run/dq/facts/0/artifact.sha256. eingefroren. rollout.yml erwartet absichtlich den falschen
  checksum. Überprüfen Sie die Archivpfade, korrigieren Sie expected_sha256 anhand der vertrauenswürdigen
  Quittung und verwenden Sie dann die Wiederherstellung serial Ansible mit checksum assertion, explizit
  root ownership/0644-Berechtigungen und das Neuladen handler. Deaktivieren Sie die Überprüfung nicht
  und stellen Sie nicht verwandte Pfade nicht wieder her.


  Questdateien in `~/quest` (einige erscheinen in späteren Phasen): `recovery.tar`, `artifact.sha256`,
  `rollout.yml`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: Das verifizierte Archiv stellt alle drei Ziele mit korrektem Besitz, Berechtigungen
  und Live-HTTP wieder her; Die Ausführung serial und checksum assertions bleiben konfiguriert.'
debrief: Bei der Wiederherstellung blieb die artifact-Überprüfung, der kontrollierte Rollout und die expliziten
  Dateimetadaten erhalten.
stages.0.brief: 'Erfolgskriterien: Das verifizierte Archiv stellt alle drei Ziele mit korrektem Besitz,
  Berechtigungen und Live-Zugriff wieder her HTTP; Die Ausführung serial und checksum assertions bleiben
  konfiguriert.'
stages.0.objectives.0.text: Das verifizierte Archiv stellt alle drei Ziele mit korrektem Besitz, korrekten
  Berechtigungen und Live-Zugriff wieder her HTTP; serial-Ausführung und checksum assertions bleiben konfiguriert.
hints.0.text: Ein lesbares Archiv ist nicht automatisch die genehmigte Wiederherstellung artifact.
hints.1.text: Vergleichen Sie seinen checksum mit den eingefrorenen Empfangs- und Listenmitgliedspfaden.
hints.2.text: Korrigieren Sie das erwartete checksum, behalten Sie assertion bei und stellen Sie es seriell
  mit expliziten Metadaten wieder her.
phrases.0: Ich habe die Wiederherstellung artifact überprüft, bevor ich sie verteilt habe.
phrases.1: Ich habe den expliziten Besitz und die Berechtigungen wiederhergestellt.
phrases.2: Ich habe jedes Ziel und den Live-Dienst nach reload überprüft.
