title: Kontrollierte Wiederherstellung
brief: |-
  Die genehmigte Anzeigekonfiguration der Flotte muss aus dem bereitgestellten Archiv wiederhergestellt werden.

  Arbeite auf der Workstation in `~/quest` mit `recovery.tar`, `artifact.sha256`, `rollout.yml`.

  **Anforderungen:**
  - Vertrauenswürdiges Archiv auf der Workstation:
    - Pfad: `~/quest/recovery.tar`.
    - Eingefrorener SHA-256-Beleg: `/run/dq/facts/0/artifact.sha256`.
    - Eine Wiederherstellung mit nicht übereinstimmender Prüfsumme wird abgelehnt.
  - Datei auf jedem verwalteten Host (`app1`, `app2`, `app3`):
    - Pfad: `/srv/site/message`.
    - Inhalt: `north-96`.
    - Zugriffsmodus: `0644`.
    - Eigentümer und Gruppe: `root` / `root`.
  - Aktiver Dienst auf jedem verwalteten Host (`app1`, `app2`, `app3`):
    - HTTP: `8080`, `/`.
    - Antwort: `north-96`.

  **Selbstprüfung vor Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'cat /srv/site/message; ls -l /srv/site/message'` — Jeder Host zeigt `north-96`, Rechte `-rw-r--r--`, Eigentümer `root` und Gruppe `root`.
  - `for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done` — Zeigt `north-96` von `app1`, `app2`, `app3`.
  - `sha256sum recovery.tar; cat /run/dq/facts/0/artifact.sha256` — Die Archivprüfsumme entspricht der eingefrorenen vertrauenswürdigen Prüfsumme.

  Die Prüfung untersucht aktuelle Ergebnisse und beibehaltene Quellvorgaben; sie spielt nicht jeden Fehler nach und beweist keine vergangene Wiederherstellungsreihenfolge.
debrief: Bei der Wiederherstellung blieb die artifact-Überprüfung, der kontrollierte Rollout und die expliziten
  Dateimetadaten erhalten.
stages.0.brief: Die überprüfte Wiederherstellung muss in der gesamten Flotte den genehmigten Anzeigeinhalt und dessen
  Metadaten hinterlassen.
stages.0.objectives.0.text: Auf der Workstation stimmt `recovery.tar` mit dem vertrauenswürdigen Beleg `/run/dq/facts/0/artifact.sha256`
  überein.
stages.0.objectives.1.text: Eine Wiederherstellung mit nicht übereinstimmender Archivprüfsumme wird abgelehnt.
stages.0.objectives.2.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/message` den
  Inhalt `north-96`, hat Modus `0644` und gehört Benutzer `root` und Gruppe `root`.
stages.0.objectives.3.text: HTTP auf Port `8080` liefert auf jedem verwalteten Host (`app1`, `app2`, `app3`) `north-96`.
hints.0.text: Ein lesbares Archiv ist nicht automatisch die genehmigte Wiederherstellung artifact.
hints.1.text: Suche `expected_sha256` in `rollout.yml`; der maßgebliche Beleg ist die vom Backend eingefrorene Datei
  `/run/dq/facts/0/artifact.sha256`.
hints.2.text: Korrigieren Sie das erwartete checksum, behalten Sie assertion bei und stellen Sie es seriell mit
  expliziten Metadaten wieder her. Prüfe vor der Wiederherstellung die Archivpfade mit `tar -tf recovery.tar`.
phrases.0: Ich habe die Wiederherstellung artifact überprüft, bevor ich sie verteilt habe.
phrases.1: Ich habe den expliziten Besitz und die Berechtigungen wiederhergestellt.
phrases.2: Ich habe jedes Ziel und den Live-Dienst nach reload überprüft.
