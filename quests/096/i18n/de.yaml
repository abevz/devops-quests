title: Kontrollierte Wiederherstellung
brief: "Die genehmigte Anzeigekonfiguration der Flotte muss aus dem bereitgestellten Archiv wiederhergestellt werden.\n\
  \nArbeite auf der Workstation in `~/quest` mit `recovery.tar`, `rollout.yml`. Zusätzliche Dateien auf der Workstation\
  \ in `~/quest`: `application-contract.json`, `provided-application.py`, `original-application-identities.json`,\
  \ `original-live-data.json`.\n\n**Anforderungen:**\n- Vertrauenswürdiges Archiv auf der Workstation:\n  - Pfad:\
  \ `~/quest/recovery.tar`.\n  - Sein SHA-256-Digest stimmt mit dem vom Backend festgehaltenen vertrauenswürdigen\
  \ Beleg überein.\n  - Eine Wiederherstellung mit nicht übereinstimmender Prüfsumme wird abgelehnt.\n- Datei auf\
  \ jedem verwalteten Host (`app1`, `app2`, `app3`):\n  - Pfad: `/srv/site/message`.\n  - Inhalt: `north-96`.\n\
  \  - Zugriffsmodus: `0644`.\n  - Eigentümer und Gruppe: `root` / `root`.\n- Aktiver Dienst auf jedem verwalteten\
  \ Host (`app1`, `app2`, `app3`):\n  - HTTP: `8080`, `/`.\n  - Antwort: `north-96`.\n- Auf jedem verwalteten Host\
  \ (`app1`, `app2`, `app3`) zeigt die bereitgestellte HTTP-Anwendung an `8081`, `/`, `north-96` mit ihrer ursprünglichen\
  \ Live-Bindung und bestehenden Mandantenwerten. Bewahre Eigentum, Gruppe und Modus aus `original-live-data.json`.\
  \ Das aktuelle zertifizierte `rollout.yml` stellt auch für Ziel und Dateibenutzer des Aufrufers aus `application-contract.json`\
  \ wieder her, aktualisiert den bereitgestellten Dienst und bewahrt andere Aufruferdaten.\n- Bewahre die Anwendungsprozesse,\
  \ Benutzer, Gruppen, Capabilities, Befehlszeilen und installierten Programmbytes aus `original-application-identities.json`.\n\
  \nDie Prüfung untersucht aktuelle Ergebnisse und beibehaltene Quellvorgaben; sie spielt nicht jeden Fehler nach\
  \ und beweist keine vergangene Wiederherstellungsreihenfolge."
debrief: Du hast eine geprüfte Wiederherstellung mit begrenztem Schreibumfang erstellt, aktive Prozessidentität
  und bestehende Daten bewahrt und Aufruferziele sowie Dateibenutzer unterstützt.
stages.0.brief: Die überprüfte Wiederherstellung muss in der gesamten Flotte den genehmigten Anzeigeinhalt und dessen
  Metadaten hinterlassen.
stages.0.objectives.0.text: Auf der Workstation stimmt `recovery.tar` mit dem vom Backend festgehaltenen vertrauenswürdigen
  Beleg überein.
stages.0.objectives.1.text: Eine Wiederherstellung mit nicht übereinstimmender Archivprüfsumme wird abgelehnt.
stages.0.objectives.2.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/message` den
  Inhalt `north-96`, hat Modus `0644` und gehört Benutzer `root` und Gruppe `root`. Die bereitgestellten Anwendungen
  bewahren auch Live-Bindungen, Mandantenwerte und Zugriffsmetadaten; das aktuelle zertifizierte Programm erfüllt
  den Aufrufervertrag und aktualisiert dessen Dienst.
stages.0.objectives.3.text: HTTP auf Port `8080` liefert auf jedem verwalteten Host (`app1`, `app2`, `app3`) `north-96`.
hints.0.text: Ein vertrauenswürdiger Snapshot und eine laufende Instanz haben unterschiedliche Lebenszyklen. Plane
  den Extraktionsumfang anhand der aktuellen Instanzbindung und bereits verwendeten Daten.
hints.1.text: Vergleiche `tar -tf recovery.tar`, `application-contract.json`, `provided-application.py` und die
  ursprünglichen Live-Belege. Prüfe vor der Extraktion aktuelle Anwendungseingaben und HTTP-Antworten auf den verwalteten
  Hosts. Verfolge, welche Archiveinträge den Zustand der laufenden Instanz überschreiben würden.
hints.2.text: Erstelle die zertifizierte Prüfsummenprüfung vor der Extraktion und wähle Konfigurationseinträge mit
  include/exclude von unarchive. Benachrichtige nach der Extraktion den unterstützten Handler `dq-service reload`.
  Beachte Ziel, Eigentümer und Gruppe aus dem Aufrufervertrag. Führe `ansible-playbook rollout.yml` aus; bestätige
  `sha256sum recovery.tar` gegen den eingefrorenen Beleg, ursprüngliche Eigentümer und Modi sowie `north-96` über
  HTTP an `8080` und `8081`. Die Anwendung muss ursprüngliche Instanz- und Mandantenwerte behalten; auch der Aufruferlauf
  muss seinen Dienst aktualisieren.
phrases.0: Ich habe die Wiederherstellung artifact überprüft, bevor ich sie verteilt habe.
phrases.1: Ich habe den expliziten Besitz und die Berechtigungen wiederhergestellt.
phrases.2: Ich habe jedes Ziel und den Live-Dienst nach reload überprüft.
