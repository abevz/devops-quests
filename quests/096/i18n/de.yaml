diagnostics.restore_budget: SSH-Beobachtungen oder Caller-Probe des aktuellen Playbooks können das gemeinsame 12-Sekunden-Budget überschreiten oder den Observer vor einem weiteren Befehl aufbrauchen. Prüfen Sie Verbindung und begrenzten Restore-/Reload-Ablauf vor Wiederholung. Ein Socket-Timeout beim Anwendungs-HTTP gehört zur OSError-Beobachtung statt zu diesem Subprozessbudget. [Ursache und Prüfung](guides#guide=ansible-11&section=selective-restore-bounded-restore-observation)
diagnostics.restore_observation: Vor Eintritt in einen Host kann der Observer eingefrorenen Vertrag, Prozessidentitäten, Baseline von live-data oder Namespace-Eingabe nicht lesen beziehungsweise dekodieren. Prüfen Sie diese Eingaben und die Workstation-Umgebung vor Zieländerungen. Nach Schleifenbeginn verwenden Beobachtungsfehler den nummerierten Hostmarker. [Ursache und Prüfung](guides#guide=ansible-11&section=selective-restore-frozen-restore-inputs)
diagnostics.restore_observation_1: SSH-, Prozess- oder Dateilesen, fehlerhaftes Remote-JSON, HTTP-Socketfehler oder andere abgefangene Beobachtungsfehler können den Hostvergleich verhindern. Der Marker nennt den aktiven Host, keinen bewiesenen Datenfehler; nach Host drei kann er auch Caller-Beobachtungsfehler abdecken. Prüfen Sie Verbindung und lesbare Dateien bei erhaltener Identität. [Ursache und Prüfung](guides#guide=ansible-11&section=selective-restore-host-restore-observation)
diagnostics.restore_observation_2: SSH-, Prozess- oder Dateilesen, fehlerhaftes Remote-JSON, HTTP-Socketfehler oder andere abgefangene Beobachtungsfehler können den Hostvergleich verhindern. Der Marker nennt den aktiven Host, keinen bewiesenen Datenfehler; nach Host drei kann er auch Caller-Beobachtungsfehler abdecken. Prüfen Sie Verbindung und lesbare Dateien bei erhaltener Identität. [Ursache und Prüfung](guides#guide=ansible-11&section=selective-restore-host-restore-observation)
diagnostics.restore_observation_3: SSH-, Prozess- oder Dateilesen, fehlerhaftes Remote-JSON, HTTP-Socketfehler oder andere abgefangene Beobachtungsfehler können den Hostvergleich verhindern. Der Marker nennt den aktiven Host, keinen bewiesenen Datenfehler; nach Host drei kann er auch Caller-Beobachtungsfehler abdecken. Prüfen Sie Verbindung und lesbare Dateien bei erhaltener Identität. [Ursache und Prüfung](guides#guide=ansible-11&section=selective-restore-host-restore-observation)
diagnostics.restore_effects: Ein Playbook kann die Fleet reparieren, aber bei anderem Ziel, Eigentümer und Caller-Reload über PATH scheitern. Verwenden Sie restore_root, restore_owner und restore_group, stellen Sie nur message mit 0644 her und benachrichtigen Sie dq-service reload. Die Probe verlangt exakte Bytes north-96 mit Newline und aktualisierten Cache, während fremde Binding-, Tenant- und Kontrolldateien Inode, Änderungszeit, Rechte, Eigentümer und Bytes behalten; feste Fleet-Pfade oder vollständige Extraktion verletzen diese Effekte. [Ursache und Prüfung](guides#guide=ansible-11&section=selective-restore-caller-owned-restore-effects)
diagnostics.probe_0_2: Unbenannte Fehler der begrenzten Legacy-Remotegruppe, Python-/Helper-Start oder unbehandelte Dokumentformen können die Beobachtung vor einem benannten Ergebnis beenden. Prüfen Sie Eingaben und tatsächliches SSH; gewöhnliche content/mode/owner-Fehler und abgefangene process/data/HTTP-Beobachtungen haben eigene Marker. Dieser Fallback erscheint nur ohne früheren Marker. [Ursache und Prüfung](guides#guide=ansible-11&section=selective-restore-unlabelled-restore-observer-failure)
diagnostics.http_1: Der Legacy-HTTP-Dienst auf 8080 kann trotz korrigierter Datei die alte Nachricht aus dem Cache liefern. Benachrichtigen Sie nach geprüfter Extraktion seinen vorhandenen Handler dq-service reload und prüfen Sie north-96 je Host; HTTP-/Netzwerkfehler scheitern ebenfalls am Wertvergleich. Dieser Cache ist von der Anwendung auf 8081 getrennt, die Dateien bei jeder Anfrage liest. [Ursache und Prüfung](guides#guide=ansible-11&section=selective-restore-existing-http-cache-reload)
