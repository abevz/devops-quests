title: Restauración controlada
brief: "La flota necesita recuperar la configuración aprobada del panel desde el archivo suministrado.\n\nTrabaja\
  \ en la workstation en `~/quest` con `recovery.tar`, `rollout.yml`. Archivos adicionales en la estación de trabajo,\
  \ en `~/quest`: `application-contract.json`, `provided-application.py`, `original-application-identities.json`,\
  \ `original-live-data.json`.\n\n**Requisitos:**\n- Archivo de confianza en la workstation:\n  - Ruta: `~/quest/recovery.tar`.\n\
  \  - Su resumen SHA-256 coincide con el comprobante de confianza fijado por el backend.\n  - Se rechaza una restauración\
  \ con una suma que no coincide.\n- Archivo en cada host administrado (`app1`, `app2`, `app3`):\n  - Ruta: `/srv/site/message`.\n\
  \  - Contenido: `north-96`.\n  - Modo de acceso: `0644`.\n  - Propietario y grupo: `root` / `root`.\n- Servicio\
  \ activo en cada host administrado (`app1`, `app2`, `app3`):\n  - HTTP: `8080`, `/`.\n  - Respuesta: `north-96`.\n\
  - En cada host administrado (`app1`, `app2`, `app3`), la aplicación HTTP proporcionada en `8081`, `/`, muestra\
  \ `north-96` con su vinculación activa original y los valores existentes del inquilino. Conserva propietario,\
  \ grupo y permisos de `original-live-data.json`. El `rollout.yml` certificado actual también restaura para el\
  \ destino y los usuarios de archivo del invocador de `application-contract.json`, actualiza el servicio proporcionado\
  \ y conserva los demás datos.\n- Conserva los procesos, usuarios, grupos, capacidades, líneas de órdenes y bytes\
  \ instalados originales de `original-application-identities.json`.\n\nLa comprobación examina los resultados actuales\
  \ y las restricciones de fuente conservadas; no reproduce cada fallo ni demuestra el orden de restauraciones pasadas."
debrief: Construiste una restauración verificada de alcance limitado que conserva procesos y datos activos y funciona
  para el destino y los usuarios del invocador.
stages.0.brief: La restauración verificada debe dejar el contenido y los metadatos aprobados del panel en toda la
  flota.
stages.0.objectives.0.text: En la workstation, `recovery.tar` coincide con el comprobante de confianza fijado por
  el backend.
stages.0.objectives.1.text: Se rechaza una restauración con una suma de archivo que no coincide.
stages.0.objectives.2.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` contiene `north-96`,
  tiene el modo `0644` y pertenece al usuario `root` y al grupo `root`. Las aplicaciones proporcionadas también
  conservan sus vinculaciones activas, valores del inquilino y metadatos de acceso; el programa certificado actual
  cumple el contrato de restauración del invocador y actualiza su servicio.
stages.0.objectives.3.text: HTTP en el puerto `8080` devuelve `north-96` en cada host administrado (`app1`, `app2`,
  `app3`).
hints.0.text: Una instantánea fiable y una instancia activa tienen ciclos de vida distintos. Planifica el alcance
  de extracción respecto a la vinculación actual y los datos que ya están en uso.
hints.1.text: Compara `tar -tf recovery.tar`, `application-contract.json`, `provided-application.py` y los registros
  activos originales. Antes de extraer, revisa entradas actuales y respuestas HTTP en los hosts administrados. Sigue
  qué miembros del archivo sobrescribirían estado de la instancia activa.
hints.2.text: Construye la comprobación certificada de suma antes de extraer y selecciona miembros de configuración
  con include/exclude de unarchive. Tras extraer, notifica al handler admitido `dq-service reload`. Respeta destino,
  propietario y grupo del contrato del invocador. Ejecuta `ansible-playbook rollout.yml`; confirma `sha256sum recovery.tar`
  con el recibo congelado, propietarios y permisos originales, y `north-96` por HTTP en `8080` y `8081`. La aplicación
  debe conservar su instancia y valores originales; la ejecución del invocador también debe actualizar su servicio.
phrases.0: Verifiqué la recuperación artifact antes de distribuirla.
phrases.1: Restablecí la propiedad y los permisos explícitos.
phrases.2: Revisé cada objetivo y el servicio en vivo después de reload.
diagnostics.artifact: recovery.tar suministrado puede faltar o cambiar tras extracción o reempaquetado. Conserve bytes y compare SHA-256 con artifact.sha256 congelado; checksum de trabajo cambiado no autoriza otro archivo. El archivo final incluye binding y tenant antiguos; confiar en archivo no permite sobrescribir cada dato vivo. [Causa y comprobación](guides#guide=ansible-11&section=selective-restore-trusted-original-archive)
diagnostics.probe_0_1: 'Un playbook puede ser Ansible válido pero fallar workflow limitado: controller stat SHA-256 debe alimentar igualdad completa con suma confiable que rechaza diferencias antes de extraer. Guard omitido, condicional o rescatado, register viejo, otra fuente de archivo, role/module/vars opacos, lookup con efectos o reload handler no certificado invalidan prueba. Errores YAML, entradas o arranque observer también dan fallback; éxito sintáctico no certifica workflow. [Causa y comprobación](guides#guide=ansible-11&section=selective-restore-checksum-before-certified-extraction)'
diagnostics.content_1: El destino puede conservar mensaje antiguo o fallar SSH/lectura. Restaure message verificado en /srv/site/message con north-96 excluyendo binding y tenant archivados antiguos. No sustituya datos actuales solo por compartir directorio en el archivo. [Causa y comprobación](guides#guide=ansible-11&section=selective-restore-select-message-content)
diagnostics.content_2: El destino puede conservar mensaje antiguo o fallar SSH/lectura. Restaure message verificado en /srv/site/message con north-96 excluyendo binding y tenant archivados antiguos. No sustituya datos actuales solo por compartir directorio en el archivo. [Causa y comprobación](guides#guide=ansible-11&section=selective-restore-select-message-content)
diagnostics.content_3: El destino puede conservar mensaje antiguo o fallar SSH/lectura. Restaure message verificado en /srv/site/message con north-96 excluyendo binding y tenant archivados antiguos. No sustituya datos actuales solo por compartir directorio en el archivo. [Causa y comprobación](guides#guide=ansible-11&section=selective-restore-select-message-content)
diagnostics.mode_1: message restaurado puede heredar permisos incorrectos o no observarse por SSH. Mantenga /srv/site/message en modo 0644 para lectura por aplicación nonroot original. No es el modo de datos tenant privados; sus permisos originales se preservan aparte. [Causa y comprobación](guides#guide=ansible-11&section=selective-restore-restored-message-mode)
diagnostics.mode_2: message restaurado puede heredar permisos incorrectos o no observarse por SSH. Mantenga /srv/site/message en modo 0644 para lectura por aplicación nonroot original. No es el modo de datos tenant privados; sus permisos originales se preservan aparte. [Causa y comprobación](guides#guide=ansible-11&section=selective-restore-restored-message-mode)
diagnostics.mode_3: message restaurado puede heredar permisos incorrectos o no observarse por SSH. Mantenga /srv/site/message en modo 0644 para lectura por aplicación nonroot original. No es el modo de datos tenant privados; sus permisos originales se preservan aparte. [Causa y comprobación](guides#guide=ansible-11&section=selective-restore-restored-message-mode)
diagnostics.owner_1: message de fleet debe tener owner y group root, representados por 0:0; fallo SSH/stat también rompe comparación. Use entradas owner/group declaradas, pues la prueba caller las sustituye por otra identidad local. No transfiera archivo tenant privado a root junto con message. [Causa y comprobación](guides#guide=ansible-11&section=selective-restore-restored-message-owner)
diagnostics.owner_2: message de fleet debe tener owner y group root, representados por 0:0; fallo SSH/stat también rompe comparación. Use entradas owner/group declaradas, pues la prueba caller las sustituye por otra identidad local. No transfiera archivo tenant privado a root junto con message. [Causa y comprobación](guides#guide=ansible-11&section=selective-restore-restored-message-owner)
diagnostics.owner_3: message de fleet debe tener owner y group root, representados por 0:0; fallo SSH/stat también rompe comparación. Use entradas owner/group declaradas, pues la prueba caller las sustituye por otra identidad local. No transfiera archivo tenant privado a root junto con message. [Causa y comprobación](guides#guide=ansible-11&section=selective-restore-restored-message-owner)
diagnostics.application_identity_1: Reiniciar consumer, cambiar programa/privilegios o recibo PID rompe identidad congelada. Conserve PID/start time, comando, UID/GID/groups, capability sets y bytes de programa. La aplicación lee archivos actuales en cada HTTP y no tiene SIGHUP handler; no necesita señal ni proceso nuevo para adoptar message. [Causa y comprobación](guides#guide=ansible-11&section=selective-restore-original-application-process)
diagnostics.application_identity_2: Reiniciar consumer, cambiar programa/privilegios o recibo PID rompe identidad congelada. Conserve PID/start time, comando, UID/GID/groups, capability sets y bytes de programa. La aplicación lee archivos actuales en cada HTTP y no tiene SIGHUP handler; no necesita señal ni proceso nuevo para adoptar message. [Causa y comprobación](guides#guide=ansible-11&section=selective-restore-original-application-process)
