diagnostics.restore_budget: SSH o la prueba caller del playbook actual pueden superar presupuesto común de 12 segundos o agotar plazo antes de otro comando. Verifique conectividad y workflow restore/reload limitado antes de repetir. Socket timeout al leer HTTP de aplicación es fallo de observación OSError, no este subprocess budget. [Causa y comprobación](guides#guide=ansible-11&section=selective-restore-bounded-restore-observation)
diagnostics.restore_observation: Antes de entrar en host puede fallar lectura/decodificación del contrato congelado, identidades originales, baseline live-data o namespace. Revise entradas y entorno workstation antes de cambiar destinos. Tras entrar en bucle, los fallos usan marcador de observación numerado. [Causa y comprobación](guides#guide=ansible-11&section=selective-restore-frozen-restore-inputs)
diagnostics.restore_observation_1: SSH, lectura de proceso/archivo, JSON remoto inválido, error socket HTTP u otro fallo capturado puede impedir comparación. El marcador identifica host activo, no predicado de datos probado; después del tercer host también puede cubrir observación caller. Inspeccione conectividad y archivos legibles conservando identidades. [Causa y comprobación](guides#guide=ansible-11&section=selective-restore-host-restore-observation)
diagnostics.restore_observation_2: SSH, lectura de proceso/archivo, JSON remoto inválido, error socket HTTP u otro fallo capturado puede impedir comparación. El marcador identifica host activo, no predicado de datos probado; después del tercer host también puede cubrir observación caller. Inspeccione conectividad y archivos legibles conservando identidades. [Causa y comprobación](guides#guide=ansible-11&section=selective-restore-host-restore-observation)
diagnostics.restore_observation_3: SSH, lectura de proceso/archivo, JSON remoto inválido, error socket HTTP u otro fallo capturado puede impedir comparación. El marcador identifica host activo, no predicado de datos probado; después del tercer host también puede cubrir observación caller. Inspeccione conectividad y archivos legibles conservando identidades. [Causa y comprobación](guides#guide=ansible-11&section=selective-restore-host-restore-observation)
diagnostics.restore_effects: El playbook puede reparar fleet pero fallar con otro destination, owner y comando reload de caller por PATH. Use restore_root, restore_owner y restore_group, restaure solo message con 0644 y notify dq-service reload. La prueba exige bytes exactos north-96 con newline y cache actualizado, preservando inode, mtime, permisos, propiedad y bytes de binding, tenant y control ajenos; rutas fleet fijas o extracción completa rompen efectos. [Causa y comprobación](guides#guide=ansible-11&section=selective-restore-caller-owned-restore-effects)
diagnostics.probe_0_2: Fallo sin nombre del grupo legacy remote limitado, arranque Python/helper o excepción de estructura no capturada puede detener observación antes de resultado nombrado. Revise entradas y SSH real; fallos content/mode/owner y observaciones process/data/HTTP capturadas ya tienen marcadores. Fallback aparece solo sin marcador anterior. [Causa y comprobación](guides#guide=ansible-11&section=selective-restore-unlabelled-restore-observer-failure)
diagnostics.http_1: El servicio legacy HTTP 8080 puede devolver mensaje cacheado viejo aun con archivo corregido. Tras extraer verificado notifique handler existente dq-service reload y compruebe north-96 en cada host; errores HTTP/red también fallan comparación. Ese cache es distinto de aplicación 8081 que lee archivos actuales en cada petición. [Causa y comprobación](guides#guide=ansible-11&section=selective-restore-existing-http-cache-reload)
