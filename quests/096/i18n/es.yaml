title: Restauración controlada
brief: "La flota necesita recuperar la configuración aprobada del panel desde el archivo suministrado.\n\nTrabaja\
  \ en la workstation en `~/quest` con `recovery.tar`, `rollout.yml`. Archivos adicionales en la estación de trabajo,\
  \ en `~/quest`: `application-contract.json`, `provided-application.py`, `original-application-identities.json`,\
  \ `original-live-data.json`.\n\n**Requisitos:**\n- Archivo de confianza en la workstation:\n  - Ruta: `~/quest/recovery.tar`.\n\
  \  - Su resumen SHA-256 coincide con el comprobante de confianza fijado por el backend.\n  - Se rechaza una restauración\
  \ con una suma que no coincide.\n- Archivo en cada host administrado (`app1`, `app2`, `app3`):\n  - Ruta: `/srv/site/message`.\n\
  \  - Contenido: `north-96`.\n  - Modo de acceso: `0644`.\n  - Propietario y grupo: `root` / `root`.\n- Servicio\
  \ activo en cada host administrado (`app1`, `app2`, `app3`):\n  - HTTP: `8080`, `/`.\n  - Respuesta: `north-96`.\n\
  - En cada host administrado (`app1`, `app2`, `app3`), la aplicación HTTP proporcionada en `8081`, `/`, muestra\
  \ `north-96` con su vinculación activa original y los valores existentes del inquilino. Conserva propietario,\
  \ grupo y permisos de `original-live-data.json`. El `rollout.yml` certificado actual también restaura para el\
  \ destino y los usuarios de archivo del invocador de `application-contract.json`, actualiza el servicio proporcionado\
  \ y conserva los demás datos.\n- Conserva los procesos, usuarios, grupos, capacidades, líneas de órdenes y bytes\
  \ instalados originales de `original-application-identities.json`.\n\nLa comprobación examina los resultados actuales\
  \ y las restricciones de fuente conservadas; no reproduce cada fallo ni demuestra el orden de restauraciones pasadas."
debrief: Construiste una restauración verificada de alcance limitado que conserva procesos y datos activos y funciona
  para el destino y los usuarios del invocador.
stages.0.brief: La restauración verificada debe dejar el contenido y los metadatos aprobados del panel en toda la
  flota.
stages.0.objectives.0.text: En la workstation, `recovery.tar` coincide con el comprobante de confianza fijado por
  el backend.
stages.0.objectives.1.text: Se rechaza una restauración con una suma de archivo que no coincide.
stages.0.objectives.2.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` contiene `north-96`,
  tiene el modo `0644` y pertenece al usuario `root` y al grupo `root`. Las aplicaciones proporcionadas también
  conservan sus vinculaciones activas, valores del inquilino y metadatos de acceso; el programa certificado actual
  cumple el contrato de restauración del invocador y actualiza su servicio.
stages.0.objectives.3.text: HTTP en el puerto `8080` devuelve `north-96` en cada host administrado (`app1`, `app2`,
  `app3`).
hints.0.text: Una instantánea fiable y una instancia activa tienen ciclos de vida distintos. Planifica el alcance
  de extracción respecto a la vinculación actual y los datos que ya están en uso.
hints.1.text: Compara `tar -tf recovery.tar`, `application-contract.json`, `provided-application.py` y los registros
  activos originales. Antes de extraer, revisa entradas actuales y respuestas HTTP en los hosts administrados. Sigue
  qué miembros del archivo sobrescribirían estado de la instancia activa.
hints.2.text: Construye la comprobación certificada de suma antes de extraer y selecciona miembros de configuración
  con include/exclude de unarchive. Tras extraer, notifica al handler admitido `dq-service reload`. Respeta destino,
  propietario y grupo del contrato del invocador. Ejecuta `ansible-playbook rollout.yml`; confirma `sha256sum recovery.tar`
  con el recibo congelado, propietarios y permisos originales, y `north-96` por HTTP en `8080` y `8081`. La aplicación
  debe conservar su instancia y valores originales; la ejecución del invocador también debe actualizar su servicio.
phrases.0: Verifiqué la recuperación artifact antes de distribuirla.
phrases.1: Restablecí la propiedad y los permisos explícitos.
phrases.2: Revisé cada objetivo y el servicio en vivo después de reload.
