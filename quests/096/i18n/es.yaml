title: Restauración controlada
brief: |-
  La flota necesita recuperar la configuración aprobada del panel desde el archivo suministrado.

  Trabaja en la workstation en `~/quest` con `recovery.tar`, `artifact.sha256`, `rollout.yml`.

  **Requisitos:**
  - Archivo de confianza en la workstation:
    - Ruta: `~/quest/recovery.tar`.
    - Comprobante SHA-256 congelado: `/run/dq/facts/0/artifact.sha256`.
  - Restauración configurada:
    - Alcance: `app1`, `app2`, `app3`.
    - Es obligatoria la verificación del archivo con el comprobante de confianza.
    - Un host administrado por lote; el servicio restaurado se actualiza.
    - Destino del archivo en los hosts administrados: `/srv/site`.
    - Propietario y grupo: `root` / `root`.
    - Modo de acceso: `0644`.
  - Archivo en cada host administrado (`app1`, `app2`, `app3`):
    - Ruta: `/srv/site/message`.
    - Contenido: `north-96`.
    - Modo de acceso: `0644`.
    - Propietario y grupo: `root` / `root`.
  - Servicio activo en cada host administrado (`app1`, `app2`, `app3`):
    - HTTP: `8080`, `/`.
    - Respuesta: `north-96`.

  **Verifica antes de Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'cat /srv/site/message; ls -l /srv/site/message'` — Cada host muestra `north-96`, permisos `-rw-r--r--`, propietario `root` y grupo `root`.
  - `for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done` — Muestra `north-96` de `app1`, `app2`, `app3`.
  - `sha256sum recovery.tar; cat /run/dq/facts/0/artifact.sha256` — El resumen del archivo coincide con el resumen de confianza congelado.

  Las observaciones del consumidor muestran el estado entregado; Check también examina el archivo de confianza y la configuración de restauración.
debrief: La recuperación retuvo la verificación artifact, la implementación controlada y el archivo explícito metadata.
stages.0.brief: La restauración verificada debe dejar el contenido y los metadatos aprobados del panel en toda la
  flota.
stages.0.objectives.0.text: En la workstation, `recovery.tar` coincide con el comprobante de confianza `/run/dq/facts/0/artifact.sha256`.
stages.0.objectives.1.text: La restauración exige que el SHA-256 del archivo coincida con el comprobante de confianza
  de la workstation.
stages.0.objectives.2.text: La restauración entrega `recovery.tar` en `/srv/site` de los hosts administrados, con
  propietario `root`, modo `0644` y actualización del servicio.
stages.0.objectives.3.text: La restauración configurada procesa un host administrado por lote.
stages.0.objectives.4.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` contiene `north-96`.
stages.0.objectives.5.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` tiene el modo
  `0644`.
stages.0.objectives.6.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` pertenece al
  usuario `root` y al grupo `root`.
stages.0.objectives.7.text: HTTP en el puerto `8080` devuelve `north-96` en cada host administrado (`app1`, `app2`,
  `app3`).
hints.0.text: Un archivo legible no es automáticamente la recuperación aprobada artifact.
hints.1.text: Localiza `expected_sha256` en `rollout.yml`; el comprobante autoritativo es `/run/dq/facts/0/artifact.sha256`,
  congelado por el backend.
hints.2.text: Corrija el checksum esperado, conserve assertion y restaure en serie con metadatos explícitos. Inspeccione
  las rutas internas con `tar -tf recovery.tar` antes de restaurar.
phrases.0: Verifiqué la recuperación artifact antes de distribuirla.
phrases.1: Restablecí la propiedad y los permisos explícitos.
phrases.2: Revisé cada objetivo y el servicio en vivo después de reload.
