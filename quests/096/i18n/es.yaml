diagnostics.live_binding_1: Extraer todo sobrescribe consumer-binding.json con PID 0 y nonce antiguo, que no describen proceso original. Restaure solo message y preserve binding JSON actual exacto con owner, group y mode registrados. El predicado vivo compara contenido decodificado y metadatos, no inode, mtime ni formato de bytes. [Causa y comprobación](guides#guide=ansible-11&section=selective-restore-current-live-binding)
