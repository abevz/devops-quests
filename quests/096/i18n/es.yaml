title: Restauración controlada
brief: 'La flota necesita restaurar su configuración anterior board desde recovery.tar. El archivo es
  un dispositivo de juego suministrado que contiene únicamente message; su SHA-256 de confianza está congelado
  en /run/dq/facts/0/artifact.sha256. rollout.yml espera deliberadamente el checksum incorrecto. Inspeccione
  las rutas de archivo, corrija expected_sha256 del recibo confiable, luego use la restauración serial
  Ansible con checksum assertion, root explícito Permisos ownership/0644 y recarga handler. No deshabilite
  la verificación ni restaure rutas no relacionadas.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `recovery.tar`, `artifact.sha256`,
  `rollout.yml`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: el archivo verificado restaura los tres objetivos con la propiedad y los
  permisos correctos y HTTP en vivo; La ejecución de serial y checksum assertions permanecen configuradas.'
debrief: La recuperación retuvo la verificación artifact, la implementación controlada y el archivo explícito
  metadata.
stages.0.brief: 'Criterios de éxito: el archivo verificado restaura los tres objetivos con la propiedad
  y los permisos correctos y HTTP en vivo; La ejecución de serial y checksum assertions permanecen configuradas.'
stages.0.objectives.0.text: El archivo verificado restaura los tres objetivos con la propiedad y los permisos
  correctos y HTTP en vivo; La ejecución de serial y checksum assertions permanecen configuradas.
hints.0.text: Un archivo legible no es automáticamente la recuperación aprobada artifact.
hints.1.text: Compare su checksum con el recibo congelado y enumere las rutas de los miembros.
hints.2.text: Corrija el checksum esperado, conserve assertion y restaure en serie con metadata explícito.
phrases.0: Verifiqué la recuperación artifact antes de distribuirla.
phrases.1: Restablecí la propiedad y los permisos explícitos.
phrases.2: Revisé cada objetivo y el servicio en vivo después de reload.
