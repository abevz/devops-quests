title: Restauración controlada
brief: |-
  La flota necesita recuperar la configuración aprobada del panel desde el archivo suministrado.

  Trabaja en la workstation en `~/quest` con `recovery.tar`, `rollout.yml`.

  **Requisitos:**
  - Archivo de confianza en la workstation:
    - Ruta: `~/quest/recovery.tar`.
    - Su resumen SHA-256 coincide con el comprobante de confianza fijado por el backend.
    - Se rechaza una restauración con una suma que no coincide.
  - Archivo en cada host administrado (`app1`, `app2`, `app3`):
    - Ruta: `/srv/site/message`.
    - Contenido: `north-96`.
    - Modo de acceso: `0644`.
    - Propietario y grupo: `root` / `root`.
  - Servicio activo en cada host administrado (`app1`, `app2`, `app3`):
    - HTTP: `8080`, `/`.
    - Respuesta: `north-96`.

  La comprobación examina los resultados actuales y las restricciones de fuente conservadas; no reproduce cada fallo ni demuestra el orden de restauraciones pasadas.
debrief: La recuperación retuvo la verificación artifact, la implementación controlada y el archivo explícito
  metadata.
stages.0.brief: La restauración verificada debe dejar el contenido y los metadatos aprobados del panel
  en toda la flota.
stages.0.objectives.0.text: En la workstation, `recovery.tar` coincide con el comprobante de confianza
  fijado por el backend.
stages.0.objectives.1.text: Se rechaza una restauración con una suma de archivo que no coincide.
stages.0.objectives.2.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` contiene
  `north-96`, tiene el modo `0644` y pertenece al usuario `root` y al grupo `root`.
stages.0.objectives.3.text: HTTP en el puerto `8080` devuelve `north-96` en cada host administrado (`app1`,
  `app2`, `app3`).
hints.0.text: Un archivo legible no es automáticamente la recuperación aprobada artifact.
hints.1.text: |-
  Localiza `expected_sha256` en `rollout.yml`; el comprobante autoritativo es `/run/dq/facts/0/artifact.sha256`, congelado por el backend.

  Inspecciona el inventario y el playbook suministrado en la workstation:

  ```sh
  cat rollout.yml
  ls -l recovery.tar artifact.sha256
  ```
hints.2.text: |-
  Verifica el resultado desde `~/quest` en la workstation:

  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'cat /srv/site/message; ls -l /srv/site/message'` — Cada host muestra `north-96`, permisos `-rw-r--r--`, propietario `root` y grupo `root`.
  - `for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done` — Muestra `north-96` de `app1`, `app2`, `app3`.
  - `sha256sum recovery.tar; cat /run/dq/facts/0/artifact.sha256` — El resumen del archivo coincide con el resumen de confianza congelado.
phrases.0: Verifiqué la recuperación artifact antes de distribuirla.
phrases.1: Restablecí la propiedad y los permisos explícitos.
phrases.2: Revisé cada objetivo y el servicio en vivo después de reload.
