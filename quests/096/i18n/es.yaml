diagnostics.live_data_1: tenant.json archivado pertenece a copia vieja; extraer todo cambia account/balance actuales y permisos privados. Conserve cada clave/valor tenant original con UID, GID y mode; claves JSON adicionales se permiten. Mantenga datos legibles por aplicación UID 1001 sin copiar registro tenant antiguo. [Causa y comprobación](guides#guide=ansible-11&section=selective-restore-current-tenant-data)
diagnostics.live_data_2: tenant.json archivado pertenece a copia vieja; extraer todo cambia account/balance actuales y permisos privados. Conserve cada clave/valor tenant original con UID, GID y mode; claves JSON adicionales se permiten. Mantenga datos legibles por aplicación UID 1001 sin copiar registro tenant antiguo. [Causa y comprobación](guides#guide=ansible-11&section=selective-restore-current-tenant-data)
