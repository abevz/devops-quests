diagnostics.application_ready_1: La aplicación original puede devolver HTTP 503 si binding no coincide con PID/instance o no lee tenant/message privados. Respuesta decodificada con message, instance, account o balance incorrectos también falla. Restaure solo message aprobado conservando binding/data vivos; solicitudes leen archivos directamente, no reinicie ni envíe señales. [Causa y comprobación](guides#guide=ansible-11&section=selective-restore-actual-live-application-response)
diagnostics.application_ready_2: La aplicación original puede devolver HTTP 503 si binding no coincide con PID/instance o no lee tenant/message privados. Respuesta decodificada con message, instance, account o balance incorrectos también falla. Restaure solo message aprobado conservando binding/data vivos; solicitudes leen archivos directamente, no reinicie ni envíe señales. [Causa y comprobación](guides#guide=ansible-11&section=selective-restore-actual-live-application-response)
