title: Управляемое восстановление
brief: 'Флоту нужно восстановить прежнюю конфигурацию табло из recovery.tar. Выданный
  игровой архив содержит только message; доверенный SHA-256 сохранён в /run/dq/facts/0/artifact.sha256.
  В rollout.yml намеренно указан неверный checksum. Изучите пути архива, исправьте
  expected_sha256 по доверенной квитанции, затем выполните последовательное восстановление
  Ansible с assertion checksum, явными владельцем root, правами 0644 и handler перезагрузки.
  Не отключайте проверку и не восстанавливайте посторонние пути.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `recovery.tar`,
  `artifact.sha256`, `rollout.yml`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно
  загруженные образы и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Проверенный архив восстановил три цели с верными владельцем,
  правами и HTTP; serial и assertions checksum сохранены.'
debrief: Восстановление сохранило проверку artifact, управляемую выкатку и явные metadata
  файлов.
stages.0.brief: 'Результат проверки: Проверенный архив восстановил три цели с верными
  владельцем, правами и HTTP; serial и assertions checksum сохранены.'
stages.0.objectives.0.text: Проверенный архив восстановил три цели с верными владельцем,
  правами и HTTP; serial и assertions checksum сохранены.
hints.0.text: Читаемый архив не обязательно является разрешённым artifact для восстановления.
hints.1.text: Сравните checksum с сохранённой квитанцией и изучите пути внутри.
hints.2.text: Исправьте ожидаемый checksum, сохраните assertion и восстанавливайте
  последовательно с явными metadata.
phrases.0: Я проверил artifact восстановления до распространения.
phrases.1: Я восстановил явные владельца и права.
phrases.2: Я проверил каждую цель и работающий сервис после reload.
