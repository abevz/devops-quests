title: Управляемое восстановление
brief: "Флоту нужно восстановить утверждённую конфигурацию табло из предоставленного архива.\n\nРаботайте на workstation\
  \ в `~/quest` с файлами `recovery.tar`, `rollout.yml`. Дополнительные файлы на рабочей станции в `~/quest`: `application-contract.json`,\
  \ `provided-application.py`, `original-application-identities.json`, `original-live-data.json`.\n\n**Требования:**\n\
  - Доверенный архив на workstation:\n  - Путь: `~/quest/recovery.tar`.\n  - Его хеш SHA-256 соответствует доверенной\
  \ квитанции, зафиксированной backend.\n  - Восстановление с несовпадающей контрольной суммой отклоняется.\n- Файл\
  \ на каждом управляемом хосте (`app1`, `app2`, `app3`):\n  - Путь: `/srv/site/message`.\n  - Содержимое: `north-96`.\n\
  \  - Режим доступа: `0644`.\n  - Владелец и группа: `root` / `root`.\n- Живой сервис на каждом управляемом хосте\
  \ (`app1`, `app2`, `app3`):\n  - HTTP: `8080`, `/`.\n  - Ответ: `north-96`.\n- На каждом управляемом узле (`app1`,\
  \ `app2`, `app3`) предоставленное HTTP-приложение на `8081`, `/`, показывает `north-96` с исходной привязкой работающего\
  \ экземпляра и существующими значениями данных арендатора. Сохраните владельца, группу и права из `original-live-data.json`.\
  \ Текущий сертифицируемый `rollout.yml` также восстанавливает в каталог и для файловых учётных записей вызывающей\
  \ стороны по `application-contract.json`, обновляет предоставленный сервис и сохраняет остальные данные.\n- Сохраните\
  \ процессы приложений, их учётные записи, группы, capabilities, командные строки и байты установленной программы\
  \ из `original-application-identities.json`.\n\nПроверка изучает текущие результаты и сохранённые ограничения\
  \ исходника; она не воспроизводит все сбои и не доказывает прошлый порядок восстановления."
debrief: Вы построили проверенное восстановление с ограниченной областью записи, сохранили идентичность работающих
  процессов и существующие данные и поддержали каталог и учётные записи вызывающей стороны.
stages.0.brief: Проверенное восстановление должно оставить утверждённые содержимое и метаданные табло во всём флоте.
stages.0.objectives.0.text: На workstation архив `recovery.tar` соответствует доверенной квитанции, зафиксированной
  backend.
stages.0.objectives.1.text: Восстановление с несовпадающей контрольной суммой архива отклоняется.
stages.0.objectives.2.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/message` содержит
  `north-96`, имеет режим `0644` и принадлежит пользователю `root` и группе `root`. Предоставленные приложения также
  сохраняют привязки работающих экземпляров, данные арендатора и метаданные доступа; текущая сертифицируемая программа
  выполняет контракт восстановления вызывающей стороны и обновляет её сервис.
stages.0.objectives.3.text: HTTP на порту `8080` возвращает `north-96` на каждом управляемом хосте (`app1`, `app2`,
  `app3`).
hints.0.text: У доверенного снимка и работающего экземпляра разный жизненный цикл. Сопоставьте область извлечения
  с текущей привязкой экземпляра и уже используемыми данными.
hints.1.text: |-
  Сравните `tar -tf recovery.tar`, `application-contract.json`, `provided-application.py` и исходные записи работающего экземпляра. Перед извлечением изучите текущие входы приложений и HTTP-ответ на управляемых узлах. Проследите, какие члены архива перезапишут состояние работающего экземпляра.

  Найдите контрольную сумму и конфигурационные элементы в описи архива. Сопоставьте их пути с файлами идентичности живого экземпляра, затем проверьте путь восстановления, владельца и группу из контракта вызова.
hints.2.text: |-
  Выполните `ansible-playbook rollout.yml`; подтвердите совпадение `sha256sum recovery.tar` с замороженной квитанцией, сохранение исходных владельцев и прав и `north-96` по HTTP на `8080` и `8081`. Приложение должно сохранить исходный экземпляр и данные арендатора; повторный запуск для вызывающей стороны также должен обновить её сервис.

  ```sh
  (
    set -euo pipefail
    printf '%s  recovery.tar\n' "$(cat artifact.sha256)" | sha256sum -c -
    for number in 1 2 3; do
      inventory_name="app$number"
      host="$inventory_name-${DQ_NAMESPACE#dq-}"
      test "$(curl -fsS --max-time 3 "http://$host:8080/")" = north-96
      curl -fsS --max-time 3 "http://$host:8081/" |
        jq -e --arg host "$inventory_name" --slurpfile live original-live-data.json '
          $live[0][$host] as $before | .message == "north-96" and
          .instance == $before["consumer-binding.json"].json.instance and
          .account == $before["tenant.json"].json.account and
          .balance == $before["tenant.json"].json.balance' >/dev/null
      test "$(ssh -n -o BatchMode=yes -o ConnectTimeout=3 -p 2222 "root@$host" "stat -c '%u:%g %a' /srv/site/message")" = "0:0 644"
      expected=$(jq -er --arg host "$inventory_name" '
        .[$host] | [.["consumer-binding.json"], .["tenant.json"]][] | [.uid, .gid, .mode] | @tsv
      ' original-live-data.json | while read -r uid gid mode; do
        printf '%s %s %o\n' "$uid" "$gid" "$mode"
      done)
      observed=$(ssh -n -o BatchMode=yes -o ConnectTimeout=3 -p 2222 "root@$host"       "stat -c '%u %g %a' /srv/site/consumer-binding.json /srv/site/tenant.json")
      test "$observed" = "$expected"
      printf '%s: HTTP, restored message and protected-file metadata match\n' "$inventory_name"
    done
  )
  ```
phrases.0: Я проверил artifact восстановления до распространения.
phrases.1: Я восстановил явные владельца и права.
phrases.2: Я проверил каждую цель и работающий сервис после reload.
diagnostics.artifact: Выданный recovery.tar мог исчезнуть или измениться после распаковки либо перепаковки. Сохраните байты и сравните SHA-256 с зафиксированным artifact.sha256; правка рабочего checksum не разрешает другой архив. Финальный архив содержит старые binding и tenant-записи, поэтому доверенный архив не разрешает перезаписывать все живые файлы. [Причина и проверка](guides#guide=ansible-11&section=selective-restore-trusted-original-archive)
diagnostics.probe_0_1: 'Playbook может быть корректным Ansible, но не проходить ограниченную проверку: controller stat SHA-256 должен питать полное равенство доверенной сумме, отвергающее несовпадения до распаковки. Пропускаемый, условный или перехваченный guard, старый register, другой архив, непрозрачные role/module/vars, lookup с эффектами либо неподтверждённый reload handler ломают доказательство. Ошибки YAML, входов и запуска observer тоже дают fallback; успех синтаксиса не означает подтверждение workflow. [Причина и проверка](guides#guide=ansible-11&section=selective-restore-checksum-before-certified-extraction)'
diagnostics.content_1: На цели могло остаться старое сообщение либо упасть SSH или чтение. Восстановите проверенный message в /srv/site/message со значением north-96, исключив архивные старые binding и tenant-файлы. Не заменяйте текущие данные приложения только из-за общего каталога архива. [Причина и проверка](guides#guide=ansible-11&section=selective-restore-select-message-content)
diagnostics.content_2: На цели могло остаться старое сообщение либо упасть SSH или чтение. Восстановите проверенный message в /srv/site/message со значением north-96, исключив архивные старые binding и tenant-файлы. Не заменяйте текущие данные приложения только из-за общего каталога архива. [Причина и проверка](guides#guide=ansible-11&section=selective-restore-select-message-content)
diagnostics.content_3: На цели могло остаться старое сообщение либо упасть SSH или чтение. Восстановите проверенный message в /srv/site/message со значением north-96, исключив архивные старые binding и tenant-файлы. Не заменяйте текущие данные приложения только из-за общего каталога архива. [Причина и проверка](guides#guide=ansible-11&section=selective-restore-select-message-content)
diagnostics.mode_1: 'Восстановленное сообщение могло унаследовать неверные права либо не читаться по SSH. Сохраните /srv/site/message с режимом 0644 для чтения исходным nonroot-приложением. Это не режим приватных tenant-данных: их исходные права сохраняются отдельно. [Причина и проверка](guides#guide=ansible-11&section=selective-restore-restored-message-mode)'
diagnostics.mode_2: 'Восстановленное сообщение могло унаследовать неверные права либо не читаться по SSH. Сохраните /srv/site/message с режимом 0644 для чтения исходным nonroot-приложением. Это не режим приватных tenant-данных: их исходные права сохраняются отдельно. [Причина и проверка](guides#guide=ansible-11&section=selective-restore-restored-message-mode)'
diagnostics.mode_3: 'Восстановленное сообщение могло унаследовать неверные права либо не читаться по SSH. Сохраните /srv/site/message с режимом 0644 для чтения исходным nonroot-приложением. Это не режим приватных tenant-данных: их исходные права сохраняются отдельно. [Причина и проверка](guides#guide=ansible-11&section=selective-restore-restored-message-mode)'
diagnostics.owner_1: Для message на хостах требуются root owner и group, то есть 0:0; ошибка SSH/stat тоже нарушает сравнение. При восстановлении используйте объявленные owner/group, потому что отдельная caller-проверка подменяет их другой локальной идентичностью. Не передавайте приватный tenant-файл root вместе с message. [Причина и проверка](guides#guide=ansible-11&section=selective-restore-restored-message-owner)
diagnostics.owner_2: Для message на хостах требуются root owner и group, то есть 0:0; ошибка SSH/stat тоже нарушает сравнение. При восстановлении используйте объявленные owner/group, потому что отдельная caller-проверка подменяет их другой локальной идентичностью. Не передавайте приватный tenant-файл root вместе с message. [Причина и проверка](guides#guide=ansible-11&section=selective-restore-restored-message-owner)
diagnostics.owner_3: Для message на хостах требуются root owner и group, то есть 0:0; ошибка SSH/stat тоже нарушает сравнение. При восстановлении используйте объявленные owner/group, потому что отдельная caller-проверка подменяет их другой локальной идентичностью. Не передавайте приватный tenant-файл root вместе с message. [Причина и проверка](guides#guide=ansible-11&section=selective-restore-restored-message-owner)
diagnostics.application_identity_1: Перезапуск consumer, правка программы или привилегий либо замена PID-квитанции нарушает зафиксированную идентичность. Сохраните PID/start time, команду, UID/GID/groups, все capability sets и байты программы. Приложение читает текущие файлы при каждом HTTP и не имеет SIGHUP handler; сигнал или новый процесс для принятия message не нужны. [Причина и проверка](guides#guide=ansible-11&section=selective-restore-original-application-process)
diagnostics.application_identity_2: Перезапуск consumer, правка программы или привилегий либо замена PID-квитанции нарушает зафиксированную идентичность. Сохраните PID/start time, команду, UID/GID/groups, все capability sets и байты программы. Приложение читает текущие файлы при каждом HTTP и не имеет SIGHUP handler; сигнал или новый процесс для принятия message не нужны. [Причина и проверка](guides#guide=ansible-11&section=selective-restore-original-application-process)
diagnostics.application_identity_3: Перезапуск consumer, правка программы или привилегий либо замена PID-квитанции нарушает зафиксированную идентичность. Сохраните PID/start time, команду, UID/GID/groups, все capability sets и байты программы. Приложение читает текущие файлы при каждом HTTP и не имеет SIGHUP handler; сигнал или новый процесс для принятия message не нужны. [Причина и проверка](guides#guide=ansible-11&section=selective-restore-original-application-process)
diagnostics.live_binding_1: Распаковка всего архива перезаписывает consumer-binding.json значениями PID 0 и старого instance nonce, не описывающими исходный процесс. Восстанавливайте только message и точно сохраните текущий binding JSON вместе с owner, group и mode. Этот live-предикат сравнивает декодированное содержимое и metadata, а не inode, mtime либо формат исходных байтов. [Причина и проверка](guides#guide=ansible-11&section=selective-restore-current-live-binding)
diagnostics.live_binding_2: Распаковка всего архива перезаписывает consumer-binding.json значениями PID 0 и старого instance nonce, не описывающими исходный процесс. Восстанавливайте только message и точно сохраните текущий binding JSON вместе с owner, group и mode. Этот live-предикат сравнивает декодированное содержимое и metadata, а не inode, mtime либо формат исходных байтов. [Причина и проверка](guides#guide=ansible-11&section=selective-restore-current-live-binding)
diagnostics.live_binding_3: Распаковка всего архива перезаписывает consumer-binding.json значениями PID 0 и старого instance nonce, не описывающими исходный процесс. Восстанавливайте только message и точно сохраните текущий binding JSON вместе с owner, group и mode. Этот live-предикат сравнивает декодированное содержимое и metadata, а не inode, mtime либо формат исходных байтов. [Причина и проверка](guides#guide=ansible-11&section=selective-restore-current-live-binding)
diagnostics.live_data_1: Архивный tenant.json относится к старому снимку и при полной распаковке заменяет текущие account/balance и приватные права. Сохраните все исходные ключи/значения tenant, UID, GID и mode; дополнительные JSON-ключи разрешены. Сохраните читаемые данные приложения UID 1001, не копируя архивную tenant-запись. [Причина и проверка](guides#guide=ansible-11&section=selective-restore-current-tenant-data)
diagnostics.live_data_2: Архивный tenant.json относится к старому снимку и при полной распаковке заменяет текущие account/balance и приватные права. Сохраните все исходные ключи/значения tenant, UID, GID и mode; дополнительные JSON-ключи разрешены. Сохраните читаемые данные приложения UID 1001, не копируя архивную tenant-запись. [Причина и проверка](guides#guide=ansible-11&section=selective-restore-current-tenant-data)
diagnostics.live_data_3: Архивный tenant.json относится к старому снимку и при полной распаковке заменяет текущие account/balance и приватные права. Сохраните все исходные ключи/значения tenant, UID, GID и mode; дополнительные JSON-ключи разрешены. Сохраните читаемые данные приложения UID 1001, не копируя архивную tenant-запись. [Причина и проверка](guides#guide=ansible-11&section=selective-restore-current-tenant-data)
diagnostics.application_ready_1: Исходное приложение может вернуть HTTP 503, если текущий binding не совпадает с PID/instance либо приватные tenant/message не читаются. Декодированный ответ с неверными message, instance, account или balance тоже даёт маркер. Восстановите только одобренный message, сохранив текущие binding/data; запросы читают файлы напрямую, перезапускать или сигналить процессу не надо. [Причина и проверка](guides#guide=ansible-11&section=selective-restore-actual-live-application-response)
diagnostics.application_ready_2: Исходное приложение может вернуть HTTP 503, если текущий binding не совпадает с PID/instance либо приватные tenant/message не читаются. Декодированный ответ с неверными message, instance, account или balance тоже даёт маркер. Восстановите только одобренный message, сохранив текущие binding/data; запросы читают файлы напрямую, перезапускать или сигналить процессу не надо. [Причина и проверка](guides#guide=ansible-11&section=selective-restore-actual-live-application-response)
diagnostics.application_ready_3: Исходное приложение может вернуть HTTP 503, если текущий binding не совпадает с PID/instance либо приватные tenant/message не читаются. Декодированный ответ с неверными message, instance, account или balance тоже даёт маркер. Восстановите только одобренный message, сохранив текущие binding/data; запросы читают файлы напрямую, перезапускать или сигналить процессу не надо. [Причина и проверка](guides#guide=ansible-11&section=selective-restore-actual-live-application-response)
diagnostics.restore_budget: Наблюдения SSH или caller-прогон текущего playbook могут превысить общий бюджет 12 секунд либо observer исчерпает время перед командой. Проверьте связность и ограниченный restore/reload workflow перед повторением. Socket timeout при чтении HTTP приложения относится к OSError-наблюдению, а не этому subprocess budget. [Причина и проверка](guides#guide=ansible-11&section=selective-restore-bounded-restore-observation)
diagnostics.restore_observation: До входа в цикл по хостам observer может не прочитать или не разобрать зафиксированные application contract, идентичности процессов, live-data baseline или namespace. Проверьте эти входы и окружение workstation до правки целей. После начала цикла ошибки наблюдения относятся к номерному маркеру хоста. [Причина и проверка](guides#guide=ansible-11&section=selective-restore-frozen-restore-inputs)
diagnostics.restore_observation_1: SSH, чтение процесса или файла, неверный remote JSON, socket-ошибка HTTP либо другой пойманный сбой наблюдения могут помешать сравнению хоста. Маркер указывает активный хост, а не доказанный сбой предиката данных; после третьего хоста он может относиться и к caller-прогону. Проверьте связность и читаемость файлов, сохраняя идентичности. [Причина и проверка](guides#guide=ansible-11&section=selective-restore-host-restore-observation)
diagnostics.restore_observation_2: SSH, чтение процесса или файла, неверный remote JSON, socket-ошибка HTTP либо другой пойманный сбой наблюдения могут помешать сравнению хоста. Маркер указывает активный хост, а не доказанный сбой предиката данных; после третьего хоста он может относиться и к caller-прогону. Проверьте связность и читаемость файлов, сохраняя идентичности. [Причина и проверка](guides#guide=ansible-11&section=selective-restore-host-restore-observation)
diagnostics.restore_observation_3: SSH, чтение процесса или файла, неверный remote JSON, socket-ошибка HTTP либо другой пойманный сбой наблюдения могут помешать сравнению хоста. Маркер указывает активный хост, а не доказанный сбой предиката данных; после третьего хоста он может относиться и к caller-прогону. Проверьте связность и читаемость файлов, сохраняя идентичности. [Причина и проверка](guides#guide=ansible-11&section=selective-restore-host-restore-observation)
diagnostics.restore_effects: Playbook может чинить хосты, но не работать с другим destination, owner и reload-командой caller через PATH. Используйте restore_root, restore_owner и restore_group, восстанавливайте только message с 0644 и notify dq-service reload. Caller-прогон требует точных байтов north-96 с newline и обновлённого кеша, сохраняя inode, mtime, права, владельца и байты чужих binding, tenant и control-файлов; жёсткие fleet-пути или полная распаковка нарушают эффекты. [Причина и проверка](guides#guide=ansible-11&section=selective-restore-caller-owned-restore-effects)
diagnostics.probe_0_2: Безымянный сбой ограниченной legacy remote-группы, запуска Python/helper или необработанной формы документа может прервать наблюдение до именованного результата. Проверьте входы и реальный SSH; обычные content/mode/owner и пойманные process/data/HTTP-наблюдения уже именованы. Fallback появляется только без ранее выданного маркера. [Причина и проверка](guides#guide=ansible-11&section=selective-restore-unlabelled-restore-observer-failure)
diagnostics.http_1: Legacy HTTP-сервис на 8080 может отдавать старое кешированное сообщение после исправления файла. После проверенной распаковки вызовите существующий handler dq-service reload и проверьте north-96 на каждом хосте; ошибки HTTP/сети тоже нарушают сравнение. Этот кеш отличается от приложения 8081, читающего текущие файлы на каждом запросе. [Причина и проверка](guides#guide=ansible-11&section=selective-restore-existing-http-cache-reload)
