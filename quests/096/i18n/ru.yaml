title: Управляемое восстановление
brief: |-
  Флоту нужно восстановить утверждённую конфигурацию табло из предоставленного архива.

  Работайте на workstation в `~/quest` с файлами `recovery.tar`, `artifact.sha256`, `rollout.yml`.

  **Требования:**
  - Доверенный архив на workstation:
    - Путь: `~/quest/recovery.tar`.
    - Зафиксированная квитанция SHA-256: `/run/dq/facts/0/artifact.sha256`.
    - Восстановление с несовпадающей контрольной суммой отклоняется.
  - Файл на каждом управляемом хосте (`app1`, `app2`, `app3`):
    - Путь: `/srv/site/message`.
    - Содержимое: `north-96`.
    - Режим доступа: `0644`.
    - Владелец и группа: `root` / `root`.
  - Живой сервис на каждом управляемом хосте (`app1`, `app2`, `app3`):
    - HTTP: `8080`, `/`.
    - Ответ: `north-96`.

  **Самопроверка перед Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'cat /srv/site/message; ls -l /srv/site/message'` — Каждый хост показывает `north-96`, права `-rw-r--r--`, владельца `root` и группу `root`.
  - `for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done` — Показывает `north-96` от `app1`, `app2`, `app3`.
  - `sha256sum recovery.tar; cat /run/dq/facts/0/artifact.sha256` — Хеш архива совпадает с зафиксированным доверенным хешем.

  Проверка изучает текущие результаты и сохранённые ограничения исходника; она не воспроизводит все сбои и не доказывает прошлый порядок восстановления.
debrief: Восстановление сохранило проверку artifact, управляемую выкатку и явные metadata файлов.
stages.0.brief: Проверенное восстановление должно оставить утверждённые содержимое и метаданные табло во всём флоте.
stages.0.objectives.0.text: На workstation архив `recovery.tar` соответствует доверенной квитанции `/run/dq/facts/0/artifact.sha256`.
stages.0.objectives.1.text: Восстановление с несовпадающей контрольной суммой архива отклоняется.
stages.0.objectives.2.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/message` содержит
  `north-96`, имеет режим `0644` и принадлежит пользователю `root` и группе `root`.
stages.0.objectives.3.text: HTTP на порту `8080` возвращает `north-96` на каждом управляемом хосте (`app1`, `app2`,
  `app3`).
hints.0.text: Читаемый архив не обязательно является разрешённым artifact для восстановления.
hints.1.text: В `rollout.yml` найдите `expected_sha256`; авторитетная квитанция — зафиксированный backend файл `/run/dq/facts/0/artifact.sha256`.
hints.2.text: Исправьте ожидаемый checksum, сохраните assertion и восстанавливайте последовательно с явными metadata.
  Перед восстановлением просмотрите пути внутри архива через `tar -tf recovery.tar`.
phrases.0: Я проверил artifact восстановления до распространения.
phrases.1: Я восстановил явные владельца и права.
phrases.2: Я проверил каждую цель и работающий сервис после reload.
