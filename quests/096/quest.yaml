      \ 'test \"$(cat /srv/site/message)\" = north-96'\n)\ndq_condition_rc=$?\nif [ \"$dq_condition_rc\" -ne 0 ];\
      \ then\nprintf '%s\\n' 'Host app1 /srv/site/message: content = north-96 : ✗ [DQ:content_1]'\ndq_group_failed=1\n\
      fi\n(\nset -e\nssh -n -o BatchMode=yes -p 2222 root@app2-\"${DQ_NAMESPACE#dq-}\" 'test \"$(cat /srv/site/message)\"\
