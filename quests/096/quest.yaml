      nPath(\\'+repr(str(cache))+\\').write_bytes(Path(\\'+repr(str(message))+\\').read_bytes())\\\\n\\');callback.chmod(0o555);assert\
      \ os.access(callback,os.X_OK), \\'Caller callback must use the existing executable workspace\\'\\n (root/\\\
      'ansible.cfg\\').write_text(\\'[defaults]\\\\ninterpreter_python=/usr/bin/python3\\\\n\\')\\n (root/\\'inventory.json\\\
      ').write_text(json.dumps({\\'all\\':{\\'children\\':{\\'fleet\\':{\\'hosts\\':{\\'caller\\':{\\'ansible_connection\\\
