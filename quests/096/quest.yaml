      n' 'Host app1 /srv/site/message: owner = 0:0 : ✗ [DQ:owner_1]'\ndq_group_failed=1\nfi\n(\nset -e\nssh -n -o\
      \ BatchMode=yes -p 2222 root@app2-\"${DQ_NAMESPACE#dq-}\" 'test \"$(stat -c %u:%g /srv/site/message)\" = 0:0'\n\
      )\ndq_condition_rc=$?\nif [ \"$dq_condition_rc\" -ne 0 ]; then\nprintf '%s\\n' 'Host app2 /srv/site/message:\
