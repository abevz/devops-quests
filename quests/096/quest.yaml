      n\"\nfile_observer = \"import hashlib,json,stat\\nfrom pathlib import Path\\nresult={}\\nfor name in ['consumer-binding.json','tenant.json']:\\\
      n p=Path('/srv/site')/name;s=p.stat();result[name]={'inode':s.st_ino,'mtime':s.st_mtime_ns,'mode':stat.S_IMODE(s.st_mode),'uid':s.st_uid,'gid':s.st_gid,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'json':json.loads(p.read_text())}\\\
      nprint(json.dumps(result))\\n\"\ncaller_program = 'import json,os,stat,subprocess,tempfile,time\\nfrom pathlib\
      \ import Path\\nstart=time.monotonic()\\nwith tempfile.TemporaryDirectory(prefix=\\'.dq-restore-construction-\\\
