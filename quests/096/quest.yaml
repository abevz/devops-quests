      import os\nimport shlex\nimport stat\nimport subprocess\nimport sys\nimport time\nimport urllib.error\nimport\
      \ urllib.request\nfrom pathlib import Path\n\nobserver = \"import hashlib\\nimport json\\nimport sys\\nfrom\
      \ pathlib import Path\\n\\nresult = {}\\nfor item in json.loads(sys.argv[1]):\\n    pid = Path(item['pidFile']).read_text().strip()\\\
