  - text: stages.0.objectives.0.text
    keep: true
    check: 'dq_group_failed=0

      set +e

      (

      set -e

      test "$(sha256sum recovery.tar | cut -d'' '' -f1)" = "$(cat /run/dq/facts/0/artifact.sha256)"

      )

      dq_condition_rc=$?

      if [ "$dq_condition_rc" -ne 0 ]; then

      printf ''%s\n'' ''Workstation ~/quest/recovery.tar matches the trusted frozen receipt : ✗ [DQ:artifact]''

      dq_group_failed=1

      fi

      set -e

      test "$dq_group_failed" -eq 0'
  - text: stages.0.objectives.1.text
    check: "dq_probe_output=$(mktemp)\ntrap 'rm -f \"$dq_probe_output\"' EXIT\nset +e\n(\nset -euo pipefail\npython3\
      \ -I - <<'VERIFY'\nimport shlex\nimport yaml\n\nMODULES = {'copy', 'file', 'stat', 'command', 'assert', 'unarchive',\
      \ 'template', 'debug', 'fail', 'set_fact', 'meta'}\nKEYWORDS = {'name', 'args', 'action', 'local_action',\
      \ 'notify', 'listen', 'register', 'tags', 'vars', 'delegate_to', 'delegate_facts', 'run_once', 'no_log', 'become',\
      \ 'become_user', 'environment', 'when', 'changed_when', 'failed_when', 'check_mode', 'ignore_errors', 'ignore_unreachable',\
      \ 'until', 'retries', 'delay', 'loop', 'with_items', 'loop_control', 'throttle', 'timeout', 'connection',\
      \ 'collections', 'any_errors_fatal', 'diff'}\n\ndef names(value):\n    if value is None: return []\n    if\
      \ isinstance(value, str): return [part.strip() for part in value.split(',') if part.strip()]\n    assert isinstance(value,\
      \ list) and all(isinstance(part, str) for part in value)\n    return value\n\ndef fleet(play):\n    hosts\
      \ = play.get('hosts')\n    return hosts in ('fleet', ['fleet']) or (isinstance(hosts, list) and set(hosts)\
      \ == {'app1', 'app2', 'app3'})\n\ndef builtin_module(value, collections=None):\n    assert isinstance(value,str)\n\
      \    if value in MODULES:\n        assert not collections or collections=='ansible.builtin' or (isinstance(collections,list)\
      \ and all(item=='ansible.builtin' for item in collections)), 'A short alias must resolve to a builtin module'\n\
      \        return value\n    assert value.startswith('ansible.builtin.') and value.removeprefix('ansible.builtin.')\
      \ in MODULES, 'Unknown collection modules cannot certify builtin effects'\n    return value.removeprefix('ansible.builtin.')\n\
      \ndef action(task):\n    assert isinstance(task, dict)\n    direct = [key for key in task if key.rsplit('.',\
      \ 1)[-1] in MODULES]\n    explicit = [key for key in ('action', 'local_action') if key in task]\n    assert\
      \ len(direct) + len(explicit) == 1, 'Exactly one module action per task'\n    assert all(key in KEYWORDS or\
      \ key in direct for key in task), 'Unknown task action'\n    if direct:\n        key = direct[0]; module =\
      \ builtin_module(key,task.get('collections')); args = task[key]\n    else:\n        declaration = task[explicit[0]]\n\
      \        if isinstance(declaration, dict):\n            args = dict(declaration); module = builtin_module(args.pop('module'),task.get('collections'))\n\
      \        else:\n            parts = shlex.split(declaration); module = builtin_module(parts.pop(0),task.get('collections'))\n\
      \            args = ' '.join(parts) if module == 'command' else dict(part.split('=', 1) for part in parts)\n\
      \    assert module in MODULES\n    if args is None: args = {}\n    if isinstance(args, str):\n        args\
      \ = {'_raw_params': args} if module in ('command', 'meta') else dict(part.split('=', 1) for part in shlex.split(args))\n\
      \    assert isinstance(args, dict)\n    args = {**args, **task.get('args', {})}\n    return module, args\n\
      \ndef tasks(items, inherited=None):\n    inherited = inherited or {}\n    for task in items or []:\n     \
      \   assert isinstance(task, dict)\n        merged = {**inherited, **task}\n        merged['tags'] = names(inherited.get('tags'))\
      \ + names(task.get('tags'))\n        merged['vars'] = {**inherited.get('vars', {}), **task.get('vars', {})}\n\
      \        if 'block' in task:\n            context = {key: merged[key] for key in KEYWORDS if key in merged\
      \ and key not in ('name', 'action', 'local_action', 'args')}\n            yield from tasks(task['block'],\
      \ context)\n            yield from tasks(task.get('rescue', []), context)\n            yield from tasks(task.get('always',\
      \ []), context)\n        else:\n            yield merged\n\ndef plays():\n    data = yaml.safe_load(open('rollout.yml'))\n\
      \    assert isinstance(data, list) and data and all(isinstance(play, dict) and fleet(play) for play in data)\n\
      \    assert all(not play.get('roles') for play in data), 'Role effects are outside the certified task workflow'\n\
      \    return data\n\ndef flat(play):\n    context = {key: play[key] for key in ('no_log', 'check_mode', 'tags',\
      \ 'vars', 'delegate_to', 'run_once', 'when', 'collections') if key in play}\n    return list(tasks(play.get('pre_tasks',\
      \ []) + play.get('tasks', []) + play.get('post_tasks', []), context))\n\ndef unconditional(task):\n    assert\
      \ not any(task.get(key) not in (None, [], True, 'true', 'True') for key in ('when',))\n    assert not any(key\
      \ in task for key in ('loop', 'with_items', 'until', 'ignore_errors', 'ignore_unreachable', 'failed_when'))\n\
      \nfrom pathlib import Path\nimport ast\nimport re\nexpected=Path('/run/dq/facts/0/artifact.sha256').read_text().strip()\n\
      assert len(expected)==64 and all(char in '0123456789abcdef' for char in expected)\n\ndef equality(expression,actual,variables,registered):\n\
      \ tree=ast.parse(expression,mode='eval').body\n assert isinstance(tree,ast.Compare) and len(tree.ops)==1 and\
      \ isinstance(tree.ops[0],ast.Eq) and len(tree.comparators)==1\n def operand(node):\n  if isinstance(node,ast.Name):return\
      \ variables.get(node.id)\n  if isinstance(node,ast.Constant):return node.value\n  if isinstance(node,ast.Attribute)\
      \ and node.attr=='checksum' and isinstance(node.value,ast.Attribute) and node.value.attr=='stat' and isinstance(node.value.value,ast.Name)\
      \ and node.value.value.id==registered:return actual\n  if isinstance(node,ast.Subscript) and isinstance(node.slice,ast.Constant)\
      \ and node.slice.value=='checksum' and isinstance(node.value,ast.Subscript) and isinstance(node.value.slice,ast.Constant)\
      \ and node.value.slice.value=='stat' and isinstance(node.value.value,ast.Name) and node.value.value.id==registered:return\
      \ actual\n  raise AssertionError('Compare the complete observed checksum with the trusted SHA256')\n return\
      \ operand(tree.left)==operand(tree.comparators[0])\n\ndef boolean(value):\n    if isinstance(value, bool):\n\
      \        return value\n    if isinstance(value, str):\n        if value.lower() in ('true', 'yes', 'on', '1'):\
      \ return True\n        if value.lower() in ('false', 'no', 'off', '0'): return False\n    if type(value) is\
      \ int and value in (0, 1): return bool(value)\n    return None\n\n\n\ndef command(args):\n    if 'argv' in\
      \ args:\n        assert isinstance(args['argv'], list) and all(isinstance(part, str) for part in args['argv'])\n\
      \        return args['argv']\n    return shlex.split(args.get('_raw_params', args.get('cmd', '')))\n\n\n\n\
      def reload_handler(play, task, expected='dq-service'):\n    notified = names(task.get('notify'))\n    assert\
      \ notified, 'The changed file must notify a reload'\n    handlers = list(tasks(play.get('handlers', []), {'collections':play.get('collections')}))\n\
      \    selected = [handler for handler in handlers if set(notified) & ({handler.get('name')} | set(names(handler.get('listen'))))]\n\
      \    assert selected and all(any(name in ({h.get('name')} | set(names(h.get('listen')))) for h in selected)\
      \ for name in notified)\n    for handler in selected:\n        unconditional(handler)\n        module, args\
      \ = action(handler)\n        assert module == 'command' and command(args) == [expected, 'reload']\n      \
      \  assert set(args) <= {'argv', 'cmd', '_raw_params', 'expand_argument_vars', 'strip_empty_ends'}\n\n\ndef\
      \ failure_context(items, inherited=False):\n for task in items or []:\n  assert not task.get('module_defaults'),\
      \ 'Opaque block defaults cannot change the certified archive source'\n  caught=inherited or ('ignore_errors'\
      \ in task and boolean(task['ignore_errors']) is not False)\n  if 'block' in task:\n   # An always/rescue branch\
      \ can run after the assertion fails. We certify only\n   # guards whose failure unconditionally stops before\
      \ every extraction.\n   caught=caught or bool(task.get('rescue')) or bool(task.get('always'))\n   for key\
      \ in ('block','rescue','always'):\n    yield from failure_context(task.get(key,[]),caught)\n  else:yield caught\n\
      \nverified=False\nsealed=False\nfor play in plays():\n assert not play.get('vars_files') and not play.get('vars_prompt')\
      \ and not play.get('module_defaults'), 'External bindings are outside the certified checksum workflow'\n for\
      \ handler in tasks(play.get('handlers',[])):\n  assert not names(handler.get('notify')), 'Handler notification\
      \ chains are outside the certified workflow'\n  labels=names(handler.get('name'))+names(handler.get('listen'))\n\
      \  assert not any(mark in label for label in labels for mark in ('{{','{%','{#')), 'Handler identities must\
      \ be statically resolvable'\n ordered=flat(play);hashes=[]\n contexts=list(failure_context(play.get('pre_tasks',[])+play.get('tasks',[])+play.get('post_tasks',[]),\
      \ 'ignore_errors' in play and boolean(play['ignore_errors']) is not False))\n assert len(contexts)==len(ordered)\n\
      \ for position,task in enumerate(ordered):\n  module,args=action(task)\n  # Registers refer to the latest\
      \ task result, never an earlier stat.\n  if 'register' in task:\n   hashes=[item for item in hashes if item[1]!=task['register']]\n\
      \  if names(task.get('notify')):\n   assert module=='unarchive' and verified, 'Only verified extraction may\
      \ notify a certified service reload'\n   reload_handler(play,task)\n  assert not re.search(r'\\b(?:lookup|query|q)\\\
      s*\\(',yaml.safe_dump(task)), 'Side-effecting lookups cannot certify archive integrity'\n  if not verified:\
      \ assert module in ('stat','assert','debug','fail','command','unarchive'), 'Only read-only prechecks may precede\
      \ checksum verification'\n  if not verified and module in ('copy','template','file'):\n   destination=args.get('dest',args.get('path',''))\n\
      \   assert isinstance(destination,str) and '{{' not in destination and destination.rstrip('/')!='/srv/site/message',\
      \ 'Do not change the restoration target before verification'\n  if not verified and module=='command':\n \
      \  assert command(args) and command(args)[0] in ('cat','sha256sum','stat','/bin/cat','/usr/bin/cat'), 'Only\
      \ read-only prechecks may precede verification'\n  if sealed:\n   assert module in ('stat','assert','debug','fail','unarchive'),\
      \ 'Do not mutate the archive or checksum bindings after collecting its checksum'\n   assert not re.search(r'\\\
      b(?:lookup|query|q)\\s*\\(',yaml.safe_dump(task)), 'Side-effecting template lookups cannot certify archive\
      \ integrity'\n  if module=='unarchive':\n   assert verified, 'Reject archive extraction before trusted-checksum\
      \ verification in every play'\n   # The builtin action searches files/ before the playbook directory for bare\
      \ src.\n   # Accept a shadow only when its bytes are the same trusted archive.\n   if args.get('src')=='recovery.tar'\
      \ and Path('files/recovery.tar').exists():\n    import hashlib\n    assert hashlib.sha256(Path('files/recovery.tar').read_bytes()).hexdigest()==expected,\
      \ 'The archive selected by the action must match the trusted receipt'\n  if module=='stat' and args.get('checksum_algorithm')=='sha256':\n\
      \   path=args.get('path')\n   if path in ('recovery.tar','{{ playbook_dir }}/recovery.tar',str(Path.cwd()\
      \ / 'recovery.tar')):\n    if contexts[position]:continue\n    tags=names(task.get('tags'))\n    assert not\
      \ any(mark in tag for tag in tags for mark in ('{{','{%','{#'))\n    if 'never' in tags and 'always' not in\
      \ tags:continue\n    sealed=True\n    unconditional(task)\n    assert 'local_action' in task or task.get('delegate_to')\
      \ in ('localhost','127.0.0.1','::1')\n    assert isinstance(task.get('register'),str)\n    hashes.append((position,task['register']))\n\
      \  if module=='assert':\n   if contexts[position]:continue\n   tags=names(task.get('tags'))\n   assert not\
      \ any(mark in tag for tag in tags for mark in ('{{','{%','{#'))\n   if 'never' in tags and 'always' not in\
      \ tags:continue\n   unconditional(task)\n   expressions=args.get('that',[]);expressions=[expressions] if isinstance(expressions,str)\
      \ else expressions\n   assert isinstance(expressions,list) and expressions\n   for hash_position,registered\
      \ in hashes:\n    variables=task.get('vars',{})\n    if not any(value==expected for value in variables.values()):continue\n\
      \    mismatches=['0'*64,'f'*64,expected[:-1]+('0' if expected[-1]!='0' else '1'),expected+'0',expected[:32]]\n\
      \    try:\n     good=all(equality(expression,expected,variables,registered) for expression in expressions)\n\
      \     rejects=all(not all(equality(expression,bad,variables,registered) for expression in expressions) for\
      \ bad in mismatches if bad!=expected)\n    except (AssertionError,SyntaxError,TypeError):continue\n    if\
      \ good and rejects:\n     # An archive extraction before verification invalidates the ordering guarantee.\n\
      \     assert not any(action(prior)[0]=='unarchive' for prior in ordered[:position])\n     verified=True\n\
      assert verified, 'Hash the trusted archive and reject every whole-checksum mismatch before restoring'\nVERIFY\n\
      ) >\"$dq_probe_output\" 2>/dev/null\ndq_probe_status=$?\nset -e\ncat \"$dq_probe_output\"\nif [ \"$dq_probe_status\"\
      \ -ne 0 ] && ! grep -Eq '\\[DQ:[a-z0-9_]+\\]' \"$dq_probe_output\"; then\nprintf '%s\\n' 'Current inputs could\
      \ not verify this objective: ✗ [DQ:probe_0_1]'\nfi\nrm -f \"$dq_probe_output\"\ntrap - EXIT\ntest \"$dq_probe_status\"\
      \ -eq 0"
  - text: stages.0.objectives.2.text
    check: "dq_probe_output=$(mktemp)\ntrap 'rm -f \"$dq_probe_output\"' EXIT\nset +e\n(\nset -euo pipefail\ncd\
      \ ~/quest\ntimeout --kill-after=1s 8s bash -euo pipefail <<'DQ_LEGACY_RESTORE'\ndq_result_failed=0\nset +e\n\
