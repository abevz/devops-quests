diagnostics.healthy_service: |-
  Не удалось подтвердить идентичность исходно здорового процесса. Массовая перезагрузка может заменить процесс, который уже работал на нужном релизе. [Документация](https://docs.ansible.com/projects/ansible/latest/playbook_guide/playbooks_handlers.html#notifying-handlers)
diagnostics.relay_release: |-
  Rollout не завершён или процесс получил другое значение. Сопоставьте шаблон Pod и работающий контейнер. [Документация](https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#updating-a-deployment)
diagnostics.release_source: |-
  Публикация может отсутствовать, устареть, быть заменена или не использоваться. Сопоставьте ConfigMap и источник релиза со снимком fleet. [Документация](https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/#define-a-container-environment-variable-with-data-from-a-single-configmap)
