title: Инцидент fleet
brief: |-
  Парк хостов и его потребитель Kubernetes ещё не согласованы по требуемому релизу.

  Работайте на рабочей станции в `~/quest`. На первом этапе используйте `inventory.ini`, `ansible.cfg`, `rollout.yml` и `service-interface.json`. На втором используйте `deployment.yaml`, `release-config.yaml` и `fleet-release.txt`.

  **Requirements:**

  - На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/message` содержит `release-60` с правами `0644`. Сохраните процесс, который уже обслуживает нужный релиз.
  - С рабочей станции каждый из хостов `app1`, `app2` и `app3` возвращает `release-60` по HTTP на порту `8080`.
  - Deployment `relay` завершает rollout. Контейнер worker получает `release-60` в `RELEASE` из выданного ключа существующей ConfigMap. Сохраните идентичность ConfigMap и опубликуйте в ней ревизию, записанную в `fleet-release.txt`.

  Проверка опирается на текущие файлы, HTTP-ответы и зафиксированные идентичности. Команды для достижения результата выберите сами.
stages.0.brief: Парк хостов должен выдавать один согласованный релиз.
stages.1.brief: Работающий потребитель должен отражать тот же релиз.
hints.0.text: |-
  Восстанавливайте файл и процесс по отдельности. Зафиксируйте здоровый процесс перед решением о перезагрузке сервиса.
hints.1.text: |-
  На первом этапе сравните файл, права и HTTP-ответы по каждому хосту. На втором сопоставьте записанную ревизию, текущую ConfigMap и источник переменной окружения Deployment.

  ```sh
  cat rollout.yml service-interface.json
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    ssh -n -o BatchMode=yes -p 2222 "root@$host" 'cat /srv/site/message; stat -c %a /srv/site/message; cat /run/quest-service.pid'
    curl -fsS --max-time 3 "http://$host:8080/"
  done
  ```

  ```sh
  cat release-config.yaml fleet-release.txt
  kubectl get deployment relay -o yaml
  kubectl get configmap -o yaml
  ```
hints.2.text: |-
  На первом этапе все файлы содержат `release-60` с правами `644`, HTTP-ответы совпадают, а исходно здоровый процесс сохранён. На втором rollout завершён и worker получает `release-60` из исходной ConfigMap.

  ```sh
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    ssh -n -o BatchMode=yes -p 2222 "root@$host" 'cat /srv/site/message; stat -c %a /srv/site/message; cat /run/quest-service.pid'
    curl -fsS --max-time 3 "http://$host:8080/"
  done
  ```

  ```sh
  kubectl get configmap relay-release -o yaml
  kubectl get deployment relay -o yaml
  kubectl rollout status deployment/relay --timeout=3s
  kubectl exec deployment/relay -c worker -- printenv RELEASE
  ```
debrief: |-
  Handler копирования реагирует на изменение файла. При уже правильном файле процесс может остаться на старых данных. Ответы fleet фиксируют ревизию для отдельной публикации и потребителя Kubernetes.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: После изменения я проверил состояние workload и его готовность.
