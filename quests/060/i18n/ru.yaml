title: Инцидент fleet
brief: "Парк хостов и его потребитель Kubernetes ещё не согласованы по требуемому релизу.\n\nРаботайте в `~/quest`\
  \ на рабочей станции. Входные файлы по этапам:\n- Этап 1: `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n- Этап\
  \ 2: `deployment.yaml`.\n\n**Требования:**\n\n- Этап 1:\n  - На каждом управляемом хосте (`app1`, `app2`, `app3`)\
  \ `/srv/site/message` содержит `release-60` и имеет режим `0644`.\n  - С рабочей станции каждый из хостов `app1`,\
  \ `app2` и `app3` возвращает `release-60` по HTTP на порту `8080`.\n- Этап 2:\n  - Deployment `relay` завершает\
  \ развёртывание, его работающий процесс настроен на `release-60`.\n\nHTTP проверяется на управляемых хостах; потребитель\
  \ Kubernetes проверяется по развёртыванию и окружению процесса. Эти наблюдения не доказывают использованные команды."
stages.0.brief: Парк хостов должен выдавать один согласованный релиз.
stages.1.brief: Работающий потребитель должен отражать тот же релиз.
hints.0.text: Восстановите работающий fleet до изменения reader.
hints.1.text: 'Файл и cache сервиса должны совпадать с нужным релизом.


  Сравните описание доставки с работающим потребителем.


  ```sh

  cat rollout.yml

  kubectl describe deployment relay

  ```'
hints.2.text: |-
  Используйте reload handler, затем исправьте RELEASE у Kubernetes reader и проверьте readiness.

  Проверьте соответствующий этап после исправления.

  Этап 1: Каждый управляемый хост показывает `release-60`, режим файла `644` и HTTP `release-60` на порту `8080`.

  ```sh
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    printf "%s: " "$host"
    ssh -n -o BatchMode=yes -p 2222 "root@$host" 'cat /srv/site/message; stat -c %a /srv/site/message'
    curl -fsS --max-time 3 "http://$host:8080"
    printf "\n"
  done
  ```

  Этап 2: Развёртывание завершено, работающий процесс выводит `release-60`.

  ```sh
  kubectl rollout status deployment/relay --timeout=3s
  kubectl exec deployment/relay -c worker -- printenv RELEASE
  ```

debrief: Fleet обслуживал старый релиз, reader не проходил readiness. Вы восстановили banner до исправления Kubernetes
  reader.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: После изменения я проверил состояние workload и его готовность.
