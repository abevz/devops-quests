diagnostics.http_1: |-
  HTTP на app1:8080 должен возвращать release-60. Файл может быть правильным, а процесс всё ещё отдавать старые данные. Сопоставьте HTTP-ответ и сообщение на диске. [Документация](https://docs.ansible.com/projects/ansible/latest/playbook_guide/playbooks_handlers.html#notifying-handlers)
