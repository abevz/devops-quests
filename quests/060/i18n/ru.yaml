title: Инцидент fleet
brief: 'Вы в команде эксплуатации SignalRail. Восстановите fleet и Kubernetes reader. Работайте в ~/quest.
  Все изменения — только в этой песочнице.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `inventory.ini`, `ansible.cfg`, `rollout.yml`,
  `deployment.json`.


  В песочнице нет интернета и внешнего DNS. Используйте только выданные файлы, предварительно загруженные
  образы и приватные сервисы. Все изменения — только в этой песочнице.


  Цели первого этапа: Три live banner показывают release-60.'
stages.0.brief: 'Пришёл новый инцидент: доставьте release-60 на fleet и обновите banner.


  Результат проверки: Три live banner показывают release-60.'
stages.0.objectives.0.text: Три live banner показывают release-60.
stages.1.brief: 'Релиз доставлен. Новый инцидент reader: исправьте RELEASE.


  Результат проверки: Работающий reader обслуживает нужный release.'
stages.1.objectives.0.text: Работающий reader обслуживает нужный release.
hints.0.text: Восстановите работающий fleet до изменения reader.
hints.1.text: Файл и cache сервиса должны совпадать с нужным релизом.
hints.2.text: Используйте reload handler, затем исправьте RELEASE у Kubernetes reader и проверьте readiness.
debrief: Fleet обслуживал старый релиз, reader не проходил readiness. Вы восстановили banner до исправления
  Kubernetes reader.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: После изменения я проверил состояние workload и его готовность.
