diagnostics.healthy_service: 'Уже исправный процесс app3 не совпадает с исходными PID и временем запуска либо его идентичность не прочитана: причиной могут быть лишняя перезагрузка всех хостов, рестарт исправного сервиса или сбой SSH и чтения защищённой записи. [Причина и проверка](guides#guide=ansible-10&section=fleet-retain-healthy-process)'
diagnostics.relay_release: 'Rollout relay не завершён или RELEASE процесса не равен release-60: выданное literal-окружение retired, недоступные ConfigMap и ключ, старые Pod или ошибка exec мешают принять выпуск хостов. [Причина и проверка](guides#guide=kubernetes-12&section=fleet-relay-running-release)'
diagnostics.release_source: 'Выпуск relay не связан с исходной публикацией хостов: причиной могут быть замена ConfigMap, сохранённая ревизия retired, literal или неверная ссылка на ключ, дубли RELEASE либо недоступные защищённые данные и API. [Причина и проверка](guides#guide=kubernetes-12&section=fleet-original-release-publication)'
diagnostics.file_1: 'app1 не предоставляет release-60 с правами 644 в /srv/site/message либо SSH завершился ошибкой: выданная задача с retired, недоставленное содержимое или изменённые права оставляют файл неверным. [Причина и проверка](guides#guide=ansible-10&section=fleet-release-file-and-mode)'
diagnostics.http_1: 'app1 не отдаёт release-60 по HTTP либо запрос завершился ошибкой: процесс кэширует содержимое при запуске, поэтому правильный неизменённый файл без обновления процесса оставляет старый ответ. [Причина и проверка](guides#guide=ansible-10&section=fleet-refresh-only-stale-services)'
diagnostics.file_2: 'app2 не предоставляет release-60 с правами 644 в /srv/site/message либо SSH завершился ошибкой: выданная задача с retired, недоставленное содержимое или изменённые права оставляют файл неверным. [Причина и проверка](guides#guide=ansible-10&section=fleet-release-file-and-mode)'
