title: Incydent flotowy
brief: "Flota i jej konsument Kubernetes nie są jeszcze zgodne co do wymaganego wydania.\n\nPracuj w `~/quest` na\
  \ stacji roboczej. Dane wejściowe według etapu:\n- Etap 1: `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n- Etap\
  \ 2: `deployment.yaml`.\n\n**Wymagania:**\n\n- Etap 1:\n  - Na każdym zarządzanym hoście (`app1`, `app2`, `app3`)\
  \ `/srv/site/message` zawiera `release-60` i ma tryb `0644`.\n  - Ze stacji roboczej każdy z hostów `app1`, `app2`\
  \ i `app3` zwraca `release-60` przez HTTP na porcie `8080`.\n- Etap 2:\n  - Deployment `relay` kończy rollout,\
  \ a jego działający proces jest skonfigurowany dla `release-60`.\n\nHTTP jest sprawdzane na zarządzanych hostach;\
  \ konsument Kubernetes jest sprawdzany przez rollout i środowisko procesu. Te obserwacje nie dowodzą użytych poleceń."
stages.0.brief: Flota musi udostępniać jedno spójne wydanie.
stages.1.brief: Działający konsument musi odzwierciedlać to samo wydanie.
hints.0.text: Odzyskaj aktualną wersję fleet przed zmianą reader.
hints.1.text: 'Plik i odpowiedź usługi buforowanej muszą zgadzać się na wydanie.


  Porównaj definicję dostarczania z działającym odbiorcą.


  ```sh

  cat rollout.yml

  kubectl describe deployment relay

  ```'
hints.2.text: |-
  Użyj reload handler, następnie popraw wartość Kubernetes reader RELEASE i zweryfikuj readiness.

  Sprawdź odpowiedni etap po naprawie.

  Etap 1: Każdy zarządzany host pokazuje `release-60`, tryb pliku `644` oraz HTTP `release-60` na porcie `8080`.

  ```sh
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    printf "%s: " "$host"
    ssh -n -o BatchMode=yes -p 2222 "root@$host" 'cat /srv/site/message; stat -c %a /srv/site/message'
    curl -fsS --max-time 3 "http://$host:8080"
    printf "\n"
  done
  ```

  Etap 2: Rollout jest zakończony, a działający proces wypisuje `release-60`.

  ```sh
  kubectl rollout status deployment/relay --timeout=3s
  kubectl exec deployment/relay -c worker -- printenv RELEASE
  ```

debrief: Flota obsługiwała starą wersję, a jej reader zawiodło, readiness. Odzyskałeś aktywne banery przed naprawą
  Kubernetes reader.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
