title: Incydent flotowy
brief: 'Dołączyłeś do operacji SignalRail. Przywróć stan fleet przed odzyskaniem jego Kubernetes reader.
  Pracuj w ~/quest. Wszystkie zmiany przechowuj w tej komorze szkoleniowej.


  Pliki zadań w `~/quest` (niektóre zostały wprowadzone w późniejszych etapach): `inventory.ini`, `ansible.cfg`,
  `rollout.yml`, `deployment.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Wszystkie zmiany muszą pozostać w tej zatoce.


  Początkowe kryteria sukcesu: wszystkie trzy aktywne banery fleet przedstawiają release-60.'
stages.0.brief: 'Uruchomiono alarm na station. Dostarcz release-60 do całego fleet i przeładuj jego live
  banner.


  Kryteria sukcesu: wszystkie trzy aktywne banery fleet przedstawiają release-60.'
stages.0.objectives.0.text: Wszystkie trzy banery floty na żywo przedstawiają release-60.
stages.1.brief: 'release dotarł do station. Pojawił się incydent reader: napraw środowisko RELEASE.


  Kryteria sukcesu: Aktywny reader obsługuje zamierzony release.'
stages.1.objectives.0.text: Aktywny reader obsługuje zamierzony release.
hints.0.text: Odzyskaj aktualną wersję fleet przed zmianą reader.
hints.1.text: Plik i odpowiedź usługi buforowanej muszą zgadzać się na wydanie.
hints.2.text: Użyj reload handler, następnie popraw wartość Kubernetes reader RELEASE i zweryfikuj readiness.
debrief: Flota obsługiwała starą wersję, a jej reader zawiodło, readiness. Odzyskałeś aktywne banery przed
  naprawą Kubernetes reader.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
