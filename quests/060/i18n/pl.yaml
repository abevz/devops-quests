title: Incydent flotowy
brief: |-
  Flota i jej konsument Kubernetes nie są jeszcze zgodne co do wymaganego wydania.

  Pracuj na stacji roboczej w `~/quest`. Na etapie 1 użyj `inventory.ini`, `ansible.cfg`, `rollout.yml` i `service-interface.json`. Na etapie 2 użyj `deployment.yaml`, `release-config.yaml` i `fleet-release.txt`.

  **Requirements:**

  - Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/message` zawiera `release-60` z trybem `0644`. Zachowaj proces już udostępniający właściwe wydanie.
  - Ze stacji roboczej każdy z hostów `app1`, `app2` i `app3` zwraca `release-60` przez HTTP na porcie `8080`.
  - Deployment `relay` kończy rollout. Kontener worker używa `release-60` w `RELEASE` z dostarczonego klucza wydania istniejącej ConfigMap. Zachowaj jej tożsamość i opublikuj rewizję zaobserwowaną w `fleet-release.txt`.

  Weryfikacja opiera się na aktualnych plikach, odpowiedziach HTTP i zapisanych tożsamościach. Wybierz polecenia, które prowadzą do wymaganego wyniku.
stages.0.brief: Flota musi udostępniać jedno spójne wydanie.
stages.1.brief: Działający konsument musi odzwierciedlać to samo wydanie.
hints.0.text: |-
  Odzyskaj stan pliku i procesu niezależnie. Zapisz stan zdrowej usługi przed decyzją o przeładowaniu.
hints.1.text: |-
  Na etapie 1 porównaj plik, tryb i odpowiedź HTTP każdego hosta. Na etapie 2 porównaj zapisaną rewizję, aktualną ConfigMap i źródło środowiska Deployment.

  ```sh
  cat rollout.yml service-interface.json
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    ssh -n -o BatchMode=yes -p 2222 "root@$host" 'cat /srv/site/message; stat -c %a /srv/site/message; cat /run/quest-service.pid'
    curl -fsS --max-time 3 "http://$host:8080/"
  done
  ```

  ```sh
  cat release-config.yaml fleet-release.txt
  kubectl get deployment relay -o yaml
  kubectl get configmap -o yaml
  ```
hints.2.text: |-
  Etap 1: pliki zawierają `release-60` w trybie `644`, a wszystkie odpowiedzi HTTP są zgodne. Początkowo zdrowy proces zachowuje tożsamość. Etap 2: rollout kończy się, a worker odczytuje `release-60` z pierwotnej ConfigMap.

  ```sh
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    ssh -n -o BatchMode=yes -p 2222 "root@$host" 'cat /srv/site/message; stat -c %a /srv/site/message; cat /run/quest-service.pid'
    curl -fsS --max-time 3 "http://$host:8080/"
  done
  ```

  ```sh
  kubectl get configmap relay-release -o yaml
  kubectl get deployment relay -o yaml
  kubectl rollout status deployment/relay --timeout=3s
  kubectl exec deployment/relay -c worker -- printenv RELEASE
  ```
debrief: |-
  Handler kopiowania reaguje na zmianę pliku. Poprawny plik może towarzyszyć starszym danym działającego procesu. Odpowiedź floty daje rewizję dla osobnej publikacji i konsumenta Kubernetes.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
