diagnostics.healthy_service: Zdrowy proces app3 nie odpowiada pierwotnemu PID i czasowi startu albo nie odczytano tożsamości; zbędne przeładowanie wszystkich hostów, restart zdrowej usługi lub błąd SSH/chronionego zapisu mogą to wyjaśniać. [Przyczyna i kontrola](guides#guide=ansible-10&section=fleet-retain-healthy-process)
diagnostics.relay_release: Rollout relay nie zakończył się lub RELEASE procesu nie jest release-60; dostarczona wartość retired, niedostępna ConfigMap/klucz, stare Pody lub błąd exec blokują przyjęcie wydania hostów. [Przyczyna i kontrola](guides#guide=kubernetes-12&section=fleet-relay-running-release)
diagnostics.release_source: Wydanie relay nie jest powiązane z pierwotną publikacją hostów; wymiana ConfigMap, pozostawienie retired, wartość literalna lub zła referencja klucza, duplikaty RELEASE albo brak danych chronionych/API mogą to wyjaśniać. [Przyczyna i kontrola](guides#guide=kubernetes-12&section=fleet-original-release-publication)
diagnostics.file_1: app1 nie udostępnia release-60 z trybem 644 w /srv/site/message lub SSH zawiódł; dostarczone zadanie z retired, niedostarczona treść lub zmienione prawa pozostawiają zły plik. [Przyczyna i kontrola](guides#guide=ansible-10&section=fleet-release-file-and-mode)
diagnostics.http_1: app1 nie serwuje release-60 przez HTTP lub żądanie zawiodło; proces buforuje treść przy starcie, więc poprawny niezmieniony plik bez odświeżenia może pozostawić starą odpowiedź. [Przyczyna i kontrola](guides#guide=ansible-10&section=fleet-refresh-only-stale-services)
