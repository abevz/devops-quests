stages.1.objectives.0.text: |-
  Deployment `relay` kończy rollout. Kontener worker używa `release-60` w `RELEASE` z dostarczonego klucza wydania istniejącej ConfigMap. Zachowaj jej tożsamość i opublikuj rewizję zaobserwowaną w `fleet-release.txt`.
diagnostics.healthy_service: |-
  Nie udało się potwierdzić pierwotnej tożsamości zdrowego procesu. Przeładowanie całej floty może wymienić aktualny proces. [Dokumentacja](https://docs.ansible.com/projects/ansible/latest/playbook_guide/playbooks_handlers.html#notifying-handlers)
diagnostics.relay_release: |-
  Rollout lub bieżąca wartość relay nie są jeszcze zgodne. Porównaj szablon Poda z aktualnym kontenerem worker. [Dokumentacja](https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#updating-a-deployment)
diagnostics.release_source: |-
  Publikacja może być nieobecna, stara, zastąpiona lub pominięta. Porównaj ConfigMap i źródło wydania dla kontenera worker w relay z zapisem floty. [Dokumentacja](https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/#define-a-container-environment-variable-with-data-from-a-single-configmap)
