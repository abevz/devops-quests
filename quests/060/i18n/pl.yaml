diagnostics.http_1: |-
  HTTP na app1:8080 musi zwracać release-60. Plik może być prawidłowy, gdy proces zwraca starsze dane. Porównaj odpowiedź HTTP z plikiem. [Dokumentacja](https://docs.ansible.com/projects/ansible/latest/playbook_guide/playbooks_handlers.html#notifying-handlers)
