title: Fleet incident
brief: "The fleet and its Kubernetes consumer do not yet agree on the intended release.\n\nWork in `~/quest` on\
  \ the workstation. Inputs by stage:\n- Stage 1: `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n- Stage 2: `deployment.yaml`.\n\
  \n**Requirements:**\n\n- Stage 1:\n  - On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` contains\
  \ `release-60` with mode `0644`.\n  - From the workstation, `app1`, `app2` and `app3` each return `release-60`\
  \ over HTTP on port `8080`.\n- Stage 2:\n  - Deployment `relay` completes its rollout and its running process\
  \ has `RELEASE=release-60`.\n\n**Verify yourself before Check & finish:**\n\n- Stage 1: Each managed host shows\
  \ `release-60`, file mode `644`, and HTTP `release-60` on port `8080`.\n\n  ```sh\n  for n in 1 2 3; do\n    host=\"\
  app${n}-${DQ_NAMESPACE#dq-}\"\n    printf \"%s: \" \"$host\"\n    ssh -n -o BatchMode=yes -p 2222 \"root@$host\"\
  \ 'cat /srv/site/message; stat -c %a /srv/site/message'\n    curl -fsS --max-time 3 \"http://$host:8080\"\n  \
  \  printf \"\\n\"\n  done\n  ```\n\n- Stage 2: The rollout is complete and the running process prints `release-60`.\n\
  \n  ```sh\n  kubectl rollout status deployment/relay --timeout=3s\n  kubectl exec deployment/relay -- printenv\
  \ RELEASE\n  ```\n\nHTTP is checked on the managed hosts; the Kubernetes consumer is checked through rollout and\
  \ process environment. These observations do not prove the commands used."
stages.0.brief: The fleet must expose one consistent release.
stages.1.brief: The running consumer must reflect the same release.
hints.0.text: Recover the live fleet before changing the reader.
hints.1.text: The file and cached service response must agree on the release.
hints.2.text: Use a reload handler, then fix the Kubernetes reader RELEASE value and verify readiness.
debrief: The fleet served an old release and its reader failed readiness. You recovered the live banners before
  repairing the Kubernetes reader.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked the workload state and its readiness after the change.
