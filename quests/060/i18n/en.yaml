title: Fleet incident
brief: |-
  The fleet and its Kubernetes consumer do not yet agree on the intended release.

  Work on the workstation in `~/quest`. Stage 1 uses `inventory.ini`, `ansible.cfg`, `rollout.yml` and `service-interface.json`. Stage 2 uses `deployment.yaml`, `release-config.yaml` and `fleet-release.txt`.

  **Requirements:**

  - On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` contains `release-60` with mode `0644`. Retain the process already serving the intended release.
  - From the workstation, `app1`, `app2` and `app3` each return `release-60` over HTTP on port `8080`.
  - Deployment `relay` completes its rollout. Its worker uses `release-60` in `RELEASE` from the existing ConfigMap’s supplied release key. Keep that ConfigMap’s identity and publish the revision observed in `fleet-release.txt`.

  Verification uses current files, HTTP replies and captured identities. Choose the commands that produce the required result.
stages.0.brief: The fleet must expose one consistent release.
stages.1.brief: The running consumer must reflect the same release.
hints.0.text: |-
  Recover disk and process state independently. Record the healthy service before deciding what needs to reload.
hints.1.text: |-
  In stage 1 compare the file, its mode and the HTTP response on each host. In stage 2 compare the recorded fleet revision, the current ConfigMap and the Deployment’s source for its running environment.

  ```sh
  cat rollout.yml service-interface.json
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    ssh -n -o BatchMode=yes -p 2222 "root@$host" 'cat /srv/site/message; stat -c %a /srv/site/message; cat /run/quest-service.pid'
    curl -fsS --max-time 3 "http://$host:8080/"
  done
  ```

  ```sh
  cat release-config.yaml fleet-release.txt
  kubectl get deployment relay -o yaml
  kubectl get configmap -o yaml
  ```
hints.2.text: |-
  Stage 1: all three files show `release-60` and mode `644`, and all HTTP responses match. The originally healthy process retains its identity. Stage 2: the rollout completes and the worker reads `release-60` from the original ConfigMap.

  ```sh
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    ssh -n -o BatchMode=yes -p 2222 "root@$host" 'cat /srv/site/message; stat -c %a /srv/site/message; cat /run/quest-service.pid'
    curl -fsS --max-time 3 "http://$host:8080/"
  done
  ```

  ```sh
  kubectl get configmap relay-release -o yaml
  kubectl get deployment relay -o yaml
  kubectl rollout status deployment/relay --timeout=3s
  kubectl exec deployment/relay -c worker -- printenv RELEASE
  ```
debrief: |-
  A copy handler responds to a changed file. An already-correct file may leave a stale running process. The fleet response becomes the handover evidence for a separate published configuration and its Kubernetes consumer.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked the workload state and its readiness after the change.
stages.0.objectives.0.text: |-
  On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` contains `release-60` with mode `0644`. Retain the process already serving the intended release.
stages.0.objectives.1.text: From the workstation, `app1`, `app2` and `app3` each return `release-60` over HTTP on
