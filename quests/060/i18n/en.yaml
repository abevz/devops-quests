diagnostics.healthy_service: |-
  The original process identity of the initially healthy service could not be verified. A broad reload can replace a process that is already up to date. [Reference](https://docs.ansible.com/projects/ansible/latest/playbook_guide/playbooks_handlers.html#notifying-handlers)
diagnostics.relay_release: |-
  The relay rollout or running value is incomplete. Compare the Pod template with the current worker. [Reference](https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#updating-a-deployment)
diagnostics.release_source: |-
  The relay publication is missing, stale, replaced or bypassed. Compare the existing ConfigMap and the worker’s release source with the fleet record. [Reference](https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/#define-a-container-environment-variable-with-data-from-a-single-configmap)
