diagnostics.healthy_service: The already healthy app3 process no longer matches its original PID and start time, or its identity could not be read; reloading every host unnecessarily, restarting the healthy service or failed SSH/fact observation can explain it. [Cause and check](guides#guide=ansible-10&section=fleet-retain-healthy-process)
diagnostics.relay_release: The relay rollout did not finish or its process RELEASE is not release-60; the supplied literal retired environment, an unavailable ConfigMap/key, stale Pods or a failed exec can prevent adopting the fleet release. [Cause and check](guides#guide=kubernetes-12&section=fleet-relay-running-release)
diagnostics.release_source: The relay release is not bound to the original fleet publication; replacing its ConfigMap, retaining retired revision data, using a literal/wrong key reference, duplicate RELEASE entries or missing protected/API data can explain it. [Cause and check](guides#guide=kubernetes-12&section=fleet-original-release-publication)
diagnostics.file_1: app1 does not provide release-60 with mode 644 in /srv/site/message, or SSH failed; the supplied retired copy task, undelivered content or changed permissions can leave the file incorrect. [Cause and check](guides#guide=ansible-10&section=fleet-release-file-and-mode)
diagnostics.http_1: app1 does not serve release-60 over HTTP or the request failed; the process caches content at startup, so a correct unchanged file without a refresh can leave the old response active. [Cause and check](guides#guide=ansible-10&section=fleet-refresh-only-stale-services)
diagnostics.file_2: app2 does not provide release-60 with mode 644 in /srv/site/message, or SSH failed; the supplied retired copy task, undelivered content or changed permissions can leave the file incorrect. [Cause and check](guides#guide=ansible-10&section=fleet-release-file-and-mode)
diagnostics.http_2: app2 does not serve release-60 over HTTP or the request failed; the process caches content at startup, so a correct unchanged file without a refresh can leave the old response active. [Cause and check](guides#guide=ansible-10&section=fleet-refresh-only-stale-services)
diagnostics.file_3: app3 does not provide release-60 with mode 644 in /srv/site/message, or SSH failed; the supplied retired copy task, undelivered content or changed permissions can leave the file incorrect. [Cause and check](guides#guide=ansible-10&section=fleet-release-file-and-mode)
diagnostics.http_3: app3 does not serve release-60 over HTTP or the request failed; the process caches content at startup, so a correct unchanged file without a refresh can leave the old response active. [Cause and check](guides#guide=ansible-10&section=fleet-refresh-only-stale-services)
