title: Fleet incident
brief: 'You joined SignalRail operations. Restore fleet state before recovering its Kubernetes reader.
  Work in ~/quest. Keep all changes inside this training bay.


  Quest files in `~/quest` (some are introduced in later stages): `inventory.ini`, `ansible.cfg`, `rollout.yml`,
  `deployment.json`.


  The bay has no Internet or external DNS. Use only its supplied files, preloaded images and private services.
  All changes must stay inside this bay.


  Initial success criteria: All three live fleet banners show release-60.'
stages.0.brief: 'The station alert fired. Deliver release-60 to the whole fleet and reload its live banner.


  Success criteria: All three live fleet banners show release-60.'
stages.0.objectives.0.text: All three live fleet banners show release-60.
stages.1.brief: 'The release reached the station. A reader incident appeared: repair its RELEASE environment.


  Success criteria: The live reader serves the intended release.'
stages.1.objectives.0.text: The live reader serves the intended release.
hints.0.text: Recover the live fleet before changing the reader.
hints.1.text: The file and cached service response must agree on the release.
hints.2.text: Use a reload handler, then fix the Kubernetes reader RELEASE value and verify readiness.
debrief: The fleet served an old release and its reader failed readiness. You recovered the live banners
  before repairing the Kubernetes reader.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked the workload state and its readiness after the change.
