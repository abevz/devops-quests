diagnostics.healthy_service: Der bereits gesunde Prozess auf app3 entspricht nicht mehr ursprünglicher PID und Startzeit oder seine Identität war nicht lesbar; unnötiges Neuladen aller Hosts, ein Neustart des gesunden Dienstes oder SSH-/Beobachtungsfehler können die Ursache sein. [Ursache und Prüfung](guides#guide=ansible-10&section=fleet-retain-healthy-process)
diagnostics.relay_release: Der Rollout von relay wurde nicht abgeschlossen oder RELEASE des Prozesses ist nicht release-60; der gelieferte Wert retired, fehlende ConfigMap beziehungsweise Schlüssel, alte Pods oder ein exec-Fehler verhindern die Übernahme des Host-Releases. [Ursache und Prüfung](guides#guide=kubernetes-12&section=fleet-relay-running-release)
diagnostics.release_source: Das Release von relay ist nicht an die ursprüngliche Host-Publikation gebunden; ersetzte ConfigMap, verbliebene Revision retired, ein Literal oder falscher Schlüsselverweis, doppelte RELEASE-Einträge oder fehlende geschützte/API-Daten können die Ursache sein. [Ursache und Prüfung](guides#guide=kubernetes-12&section=fleet-original-release-publication)
diagnostics.file_1: app1 liefert nicht release-60 mit Modus 644 in /srv/site/message oder SSH schlug fehl; die gelieferte Kopieraufgabe mit retired, noch nicht bereitgestellter Inhalt oder geänderte Rechte können die Datei falsch belassen. [Ursache und Prüfung](guides#guide=ansible-10&section=fleet-release-file-and-mode)
diagnostics.http_1: app1 liefert nicht release-60 über HTTP oder die Anfrage schlug fehl; der Prozess speichert den Inhalt beim Start, daher kann eine korrekte unveränderte Datei ohne Aktualisierung die alte Antwort aktiv lassen. [Ursache und Prüfung](guides#guide=ansible-10&section=fleet-refresh-only-stale-services)
