title: Flottenvorfall
brief: "Die Host-Gruppe und ihr Kubernetes-Verbraucher stimmen beim geforderten Release noch nicht überein.\n\n\
  Arbeiten Sie in `~/quest` auf der Workstation. Eingaben je Phase:\n- Phase 1: `inventory.ini`, `ansible.cfg`,\
  \ `rollout.yml`.\n- Phase 2: `deployment.yaml`.\n\n**Anforderungen:**\n\n- Phase 1:\n  - Auf jedem verwalteten\
  \ Host (`app1`, `app2`, `app3`) enthält `/srv/site/message` den Wert `release-60` und hat Modus `0644`.\n  - Von\
  \ der Workstation liefern `app1`, `app2` und `app3` jeweils `release-60` über HTTP auf Port `8080`.\n- Phase 2:\n\
  \  - Deployment `relay` schließt seinen Rollout ab und sein laufender Prozess ist für `release-60` konfiguriert.\n\
  \nHTTP wird auf den verwalteten Hosts geprüft; der Kubernetes-Verbraucher wird über Rollout und Prozessumgebung\
  \ geprüft. Diese Beobachtungen belegen die verwendeten Befehle nicht."
stages.0.brief: Die Host-Gruppe muss ein einheitliches Release ausgeben.
stages.1.brief: Der laufende Verbraucher muss dasselbe Release widerspiegeln.
hints.0.text: Stellen Sie den aktiven fleet wieder her, bevor Sie den reader ändern.
hints.1.text: 'Die Datei und die zwischengespeicherte Dienstantwort müssen bei der Freigabe übereinstimmen.


  Vergleichen Sie die Auslieferungsdefinition mit dem laufenden Verbraucher.


  ```sh

  cat rollout.yml

  kubectl describe deployment relay

  ```'
hints.2.text: |-
  Verwenden Sie einen reload handler, korrigieren Sie dann den Kubernetes reader RELEASE-Wert und überprüfen Sie readiness.

  Prüfen Sie die jeweilige Phase nach der Reparatur.

  Phase 1: Jeder verwaltete Host zeigt `release-60`, Dateimodus `644` und HTTP `release-60` auf Port `8080`.

  ```sh
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    printf "%s: " "$host"
    ssh -n -o BatchMode=yes -p 2222 "root@$host" 'cat /srv/site/message; stat -c %a /srv/site/message'
    curl -fsS --max-time 3 "http://$host:8080"
    printf "\n"
  done
  ```

  Phase 2: Der Rollout ist abgeschlossen und der laufende Prozess gibt `release-60` aus.

  ```sh
  kubectl rollout status deployment/relay --timeout=3s
  kubectl exec deployment/relay -c worker -- printenv RELEASE
  ```

debrief: Die Flotte bediente eine alte Version und ihr reader scheiterte an readiness. Sie haben die Live-Banner
  vor der Reparatur des Kubernetes reader wiederhergestellt.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe den workload-Status und seine Bereitschaft nach der Änderung überprüft.
