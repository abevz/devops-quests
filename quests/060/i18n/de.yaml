title: Flottenvorfall
brief: |-
  Die Host-Gruppe und ihr Kubernetes-Verbraucher stimmen beim geforderten Release noch nicht überein.

  Arbeiten Sie auf der Workstation in `~/quest`. Phase 1 verwendet `inventory.ini`, `ansible.cfg`, `rollout.yml` und `service-interface.json`. Phase 2 verwendet `deployment.yaml`, `release-config.yaml` und `fleet-release.txt`.

  **Requirements:**

  - Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/message` den Wert `release-60` im Modus `0644`. Erhalten Sie den Prozess, der das gewünschte Release bereits ausliefert.
  - Von der Workstation liefern `app1`, `app2` und `app3` jeweils `release-60` über HTTP auf Port `8080`.
  - Deployment `relay` schließt den Rollout ab. Der Container worker verwendet `release-60` in `RELEASE` aus dem bereitgestellten Release-Schlüssel der vorhandenen ConfigMap. Erhalten Sie die Identität der ConfigMap und veröffentlichen Sie die in `fleet-release.txt` beobachtete Revision.

  Die Prüfung beruht auf aktuellen Dateien, HTTP-Antworten und aufgezeichneten Identitäten. Wählen Sie die Befehle, mit denen Sie das geforderte Ergebnis erreichen.
stages.0.brief: Die Host-Gruppe muss ein einheitliches Release ausgeben.
stages.1.brief: Der laufende Verbraucher muss dasselbe Release widerspiegeln.
hints.0.text: |-
  Stellen Sie Dateizustand und Prozesszustand getrennt wieder her. Erfassen Sie den gesunden Dienst, bevor Sie über einen Reload entscheiden.
hints.1.text: |-
  Vergleichen Sie in Phase 1 Datei, Modus und HTTP-Antwort pro Host. Vergleichen Sie in Phase 2 die aufgezeichnete Revision der Fleet, die ConfigMap und die Quelle der laufenden Deployment-Umgebung.

  ```sh
  cat rollout.yml service-interface.json
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    ssh -n -o BatchMode=yes -p 2222 "root@$host" 'cat /srv/site/message; stat -c %a /srv/site/message; cat /run/quest-service.pid'
    curl -fsS --max-time 3 "http://$host:8080/"
  done
  ```

  ```sh
  cat release-config.yaml fleet-release.txt
  kubectl get deployment relay -o yaml
  kubectl get configmap -o yaml
  ```
hints.2.text: |-
  Phase 1: Alle drei Dateien zeigen `release-60` und Modus `644`, und alle HTTP-Antworten stimmen überein. Der ursprünglich gesunde Prozess behält seine Identität. Phase 2: Der Rollout endet, und worker liest `release-60` aus der ursprünglichen ConfigMap.

  ```sh
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    ssh -n -o BatchMode=yes -p 2222 "root@$host" 'cat /srv/site/message; stat -c %a /srv/site/message; cat /run/quest-service.pid'
    curl -fsS --max-time 3 "http://$host:8080/"
  done
  ```

  ```sh
  kubectl get configmap relay-release -o yaml
  kubectl get deployment relay -o yaml
  kubectl rollout status deployment/relay --timeout=3s
  kubectl exec deployment/relay -c worker -- printenv RELEASE
  ```
debrief: |-
  Ein Copy-Handler reagiert auf eine Dateiänderung. Eine bereits korrekte Datei kann einen veralteten laufenden Prozess hinterlassen. Die Fleet-Antwort dokumentiert die Übergabe an die veröffentlichte Konfiguration und ihren Kubernetes-Verbraucher.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe den workload-Status und seine Bereitschaft nach der Änderung überprüft.
