title: Flottenvorfall
brief: 'Sie sind dem Betrieb SignalRail beigetreten. Stellen Sie den fleet-Status wieder her, bevor Sie
  den Kubernetes reader wiederherstellen. Arbeiten Sie in ~/quest.. Bewahren Sie alle Änderungen in diesem
  Schulungsbereich auf.


  Questdateien in `~/quest` (einige werden in späteren Phasen eingeführt): `inventory.ini`, `ansible.cfg`,
  `rollout.yml`, `deployment.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur die bereitgestellten Dateien,
  vorinstallierten Bilder und privaten Dienste. Alle Änderungen müssen innerhalb dieser Bucht bleiben.


  Erste Erfolgskriterien: Alle drei Live-fleet-Banner zeigen release-60.'
stages.0.brief: 'Die Warnung station wurde ausgelöst. Liefern Sie release-60 an das gesamte fleet und
  laden Sie dessen Live-banner neu.


  Erfolgskriterium: Alle drei Live-fleet-Banner zeigen release-60.'
stages.0.objectives.0.text: Alle drei Live-Flottenbanner zeigen release-60.
stages.1.brief: 'Die Veröffentlichung erreichte den station. Es ist ein reader-Vorfall aufgetreten: Reparieren
  Sie die RELEASE-Umgebung.


  Erfolgskriterium: Der Live-reader dient der beabsichtigten Veröffentlichung.'
stages.1.objectives.0.text: Der Live-reader dient der beabsichtigten Veröffentlichung.
hints.0.text: Stellen Sie den aktiven fleet wieder her, bevor Sie den reader ändern.
hints.1.text: Die Datei und die zwischengespeicherte Dienstantwort müssen bei der Freigabe übereinstimmen.
hints.2.text: Verwenden Sie einen reload handler, korrigieren Sie dann den Kubernetes reader RELEASE-Wert
  und überprüfen Sie readiness.
debrief: Die Flotte bediente eine alte Version und ihr reader scheiterte an readiness. Sie haben die Live-Banner
  vor der Reparatur des Kubernetes reader wiederhergestellt.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe den workload-Status und seine Bereitschaft nach der Änderung überprüft.
