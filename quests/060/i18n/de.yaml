diagnostics.healthy_service: |-
  Die ursprüngliche Prozessidentität des gesunden Dienstes ließ sich nicht bestätigen. Ein umfassender Reload kann einen bereits aktuellen Prozess ersetzen. [Dokumentation](https://docs.ansible.com/projects/ansible/latest/playbook_guide/playbooks_handlers.html#notifying-handlers)
diagnostics.relay_release: |-
  Rollout oder Wert von relay ist noch nicht vollständig. Vergleichen Sie Pod-Vorlage und laufenden Container worker. [Dokumentation](https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#updating-a-deployment)
diagnostics.release_source: |-
  Die Veröffentlichung kann fehlen, veraltet, ersetzt oder umgangen sein. Vergleichen Sie die ConfigMap und die Release-Quelle von worker in relay mit dem Fleet-Nachweis. [Dokumentation](https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/#define-a-container-environment-variable-with-data-from-a-single-configmap)
