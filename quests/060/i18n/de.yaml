diagnostics.http_1: |-
  HTTP auf app1:8080 muss release-60 liefern. Die Datei kann richtig sein, während der Prozess ältere Daten ausliefert. Vergleichen Sie HTTP-Antwort und Datei. [Dokumentation](https://docs.ansible.com/projects/ansible/latest/playbook_guide/playbooks_handlers.html#notifying-handlers)
