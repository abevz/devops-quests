title: Incidente de flota
brief: 'Te uniste a las operaciones de SignalRail. Restaure el estado de fleet antes de recuperar su Kubernetes
  reader. Trabajar en ~/quest. Mantenga todos los cambios dentro de esta bahía de entrenamiento.


  Archivos de búsqueda en `~/quest` (algunos se introducen en etapas posteriores): `inventory.ini`, `ansible.cfg`,
  `rollout.yml`, `deployment.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente los archivos suministrados, las imágenes
  precargadas y los servicios privados. Todos los cambios deben permanecer dentro de esta bahía.


  Criterios de éxito iniciales: los tres banners en vivo fleet muestran release-60.'
stages.0.brief: 'Se disparó la alerta station. Entregue release-60 a todo el fleet y recargue su banner
  en vivo.


  Criterios de éxito: los tres banners en vivo fleet muestran release-60.'
stages.0.objectives.0.text: Los tres carteles de flotas en vivo muestran release-60.
stages.1.brief: 'El lanzamiento llegó al station. Apareció un incidente reader: repare su entorno RELEASE.


  Criterios de éxito: el reader en vivo sirve para la versión prevista.'
stages.1.objectives.0.text: El reader en vivo sirve para la versión prevista.
hints.0.text: Recupere el fleet activo antes de cambiar el reader.
hints.1.text: El archivo y la respuesta del servicio almacenado en caché deben coincidir en la publicación.
hints.2.text: Utilice un reload handler, luego corrija el valor de RELEASE Kubernetes reader y verifique
  readiness.
debrief: La flota cumplió con una versión anterior y su reader falló en readiness. Recuperaste los banners
  en vivo antes de reparar el Kubernetes reader.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el estado de workload y su preparación después del cambio.
