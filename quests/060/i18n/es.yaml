title: Incidente de flota
brief: "La flota y su consumidor Kubernetes aún no coinciden en la versión requerida.\n\nTrabaja en `~/quest` en\
  \ la estación de trabajo. Entradas por etapa:\n- Etapa 1: `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n- Etapa\
  \ 2: `deployment.yaml`.\n\n**Requisitos:**\n\n- Etapa 1:\n  - En cada host gestionado (`app1`, `app2`, `app3`),\
  \ `/srv/site/message` contiene `release-60` con modo `0644`.\n  - Desde la estación de trabajo, `app1`, `app2`\
  \ y `app3` devuelven cada uno `release-60` por HTTP en el puerto `8080`.\n- Etapa 2:\n  - El Deployment `relay`\
  \ completa su rollout y su proceso en ejecución está configurado para `release-60`.\n\nHTTP se comprueba en los\
  \ hosts gestionados; el consumidor Kubernetes se comprueba mediante rollout y entorno del proceso. Estas observaciones\
  \ no prueban los comandos usados."
stages.0.brief: La flota debe exponer una versión coherente.
stages.1.brief: El consumidor en ejecución debe reflejar la misma versión.
hints.0.text: Recupere el fleet activo antes de cambiar el reader.
hints.1.text: 'El archivo y la respuesta del servicio almacenado en caché deben coincidir en la publicación.


  Compara la definición de entrega con el consumidor en ejecución.


  ```sh

  cat rollout.yml

  kubectl describe deployment relay

  ```'
hints.2.text: "Utilice un reload handler, luego corrija el valor de RELEASE Kubernetes reader y verifique readiness.\n\
  \nVerifica la etapa correspondiente tras repararla.\n\nEtapa 1: Cada host gestionado muestra `release-60`, modo\
  \ de archivo `644` y HTTP `release-60` en el puerto `8080`.\n\n```sh\nfor n in 1 2 3; do\n  host=\"app${n}-${DQ_NAMESPACE#dq-}\"\
  \n  printf \"%s: \" \"$host\"\n  ssh -n -o BatchMode=yes -p 2222 \"root@$host\" 'cat /srv/site/message; stat -c\
  \ %a /srv/site/message'\n  curl -fsS --max-time 3 \"http://$host:8080\"\n  printf \"\\n\"\ndone\n```\n\nEtapa\
  \ 2: El rollout está completo y el proceso en ejecución imprime `release-60`.\n\n```sh\nkubectl rollout status\
  \ deployment/relay --timeout=3s\nkubectl exec deployment/relay -- printenv RELEASE\n```"
debrief: La flota cumplió con una versión anterior y su reader falló en readiness. Recuperaste los banners en vivo
  antes de reparar el Kubernetes reader.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el estado de workload y su preparación después del cambio.
diagnostics.file_1: En app1, /srv/site/message debe contener release-60 con modo 0644.
diagnostics.file_2: En app2, /srv/site/message debe contener release-60 con modo 0644.
diagnostics.file_3: En app3, /srv/site/message debe contener release-60 con modo 0644.
