id: 60
title: title
track: Boss
difficulty: complex
brief: brief
stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    check: 'set -euo pipefail

      cd ~/quest

      failed=0

      if ! ssh -n -o BatchMode=yes -p 2222 root@app1-"${DQ_NAMESPACE#dq-}" ''test "$(cat /srv/site/message)" = release-60
      && test "$(stat -c %a /srv/site/message)" = 644''; then printf ''%s\n'' ''app1 file release-60: ✗ [DQ:file_1]''
      >&2; failed=1; fi

      if ! ssh -n -o BatchMode=yes -p 2222 root@app2-"${DQ_NAMESPACE#dq-}" ''test "$(cat /srv/site/message)" = release-60
      && test "$(stat -c %a /srv/site/message)" = 644''; then printf ''%s\n'' ''app2 file release-60: ✗ [DQ:file_2]''
      >&2; failed=1; fi

      if ! ssh -n -o BatchMode=yes -p 2222 root@app3-"${DQ_NAMESPACE#dq-}" ''test "$(cat /srv/site/message)" = release-60
      && test "$(stat -c %a /srv/site/message)" = 644''; then printf ''%s\n'' ''app3 file release-60: ✗ [DQ:file_3]''
      >&2; failed=1; fi

      exit "$failed"

      '
  - text: stages.0.objectives.1.text
    check: 'set -euo pipefail

      cd ~/quest

      failed=0

      if ! test "$(curl -fsS --max-time 3 http://app1-${DQ_NAMESPACE#dq-}:8080)" = release-60; then printf ''%s\n''
      ''app1 http release-60: ✗ [DQ:http_1]'' >&2; failed=1; fi

      if ! test "$(curl -fsS --max-time 3 http://app2-${DQ_NAMESPACE#dq-}:8080)" = release-60; then printf ''%s\n''
      ''app2 http release-60: ✗ [DQ:http_2]'' >&2; failed=1; fi

      if ! test "$(curl -fsS --max-time 3 http://app3-${DQ_NAMESPACE#dq-}:8080)" = release-60; then printf ''%s\n''
      ''app3 http release-60: ✗ [DQ:http_3]'' >&2; failed=1; fi

      exit "$failed"

      '
- brief: stages.1.brief
  objectives:
  - text: stages.1.objectives.0.text
    check: 'kubectl rollout status deployment/relay --timeout=3s >/dev/null

      test "$(kubectl exec deployment/relay -- printenv RELEASE)" = release-60'
