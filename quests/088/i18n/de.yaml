title: Speicher und Start
brief: |
  Der HTTP-Workload bleibt innerhalb seines Speicherbudgets nicht bereit. Stellen Sie einen stabilen Rollout mit dem geforderten Speicherlimit her.

  Arbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte Eingabedateien: `deployment.yaml`.

  **Anforderungen:**
  - Deployment `relay` schließt seinen Rollout ab.
  - In Deployment `relay` hat Container `worker` dieses Speicherlimit:
    - `96Mi`

  **Vor Check & finish selbst prüfen:**
  Führen Sie diese Beobachtungsbefehle in `~/quest` auf der Workstation aus.
  - `kubectl get deployment relay -o yaml` — Das Speicherlimit des Anwendungscontainers beträgt `96Mi`.
  - `kubectl rollout status deployment/relay --timeout=3s` — Der Workload-Rollout ist abgeschlossen.
stages.0.brief: |
  Der Workload muss innerhalb seines geforderten Speicherlimits bereit bleiben.
stages.0.objectives.0.text: Der relay-Container hat ein Speicherlimit von `96Mi`.
stages.0.objectives.1.text: Deployment `relay` schließt seinen Rollout ab.
hints.0.text: |
  Prüfen Sie den fehlgeschlagenen neuen Befehl, den letzten Beendigungszustand und den Readiness-Fehler getrennt.
hints.1.text: Der alte Befehl vergrößert den Speicher unbegrenzt; Eine größere Grenze allein ist keine
  Reparatur.
hints.2.text: Führen Sie den normalen HTTP worker aus, stellen Sie 96Mi ein und zeigen Sie readiness auf
  / auf 8080.
debrief: Der worker konnte nicht gestartet werden und sein probe verwendete den falschen Port. Sie haben
  den Start repariert, 96Mi zugewiesen und einen fehlerfreien HTTP rollout überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe den workload-Status und seine Bereitschaft nach der Änderung überprüft.
