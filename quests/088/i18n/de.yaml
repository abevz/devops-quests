title: Speicher und Start
brief: |-
  Die vorgegebenen Anwendungen erreichen innerhalb ihres Speicherbudgets keinen nutzbaren Startzustand. Stelle die ursprünglichen Workloads wieder her und liefere den aktuellen Datensatz über ihre Startphasen.

  Arbeite auf der Workstation in `~/quest` mit `startup-contract.json`; untersuche Quelle und Workloads im Kubernetes-Namespace.

  **Anforderungen:**
  - Erhalte Daten und Identität der ursprünglichen Quell-ConfigMap, Workload- und Service-Identitäten sowie die vorgegebenen unveränderlichen Anwendungsimages.
  - Der Produzenten-Worker behält sein vorgeschriebenes Speicherlimit; jeder Anwendungs-Pod und jede Startphase bleiben im vertraglich festgelegten Budget.
  - Jeder vorgegebene Workload schließt den Rollout ab. Erhalte den bestehenden Warmup-Init-Container und seinen erfolgreichen Abschluss vor dem nachfolgenden Worker.
  - Jede Rolle hält einen tatsächlich zugewiesenen speicherbasierten Datensatz mit aktueller Größe und Prüfsumme. Ihr selektorbasierter ClusterIP-Service veröffentlicht passende Metadaten über die erklärte Schnittstelle.

  Prüfungen beobachten aktuelle Budgets, Eigentümer, abgeschlossene Initialisierung, zugewiesene Daten und HTTP-Datensätze. Caches dürfen aus der erhaltenen Quelle neu aufgebaut werden; Befehlsverlauf, Neustartfreiheit und unterbrechungsfreie Verfügbarkeit werden nicht geprüft.
stages.0.brief: Alle Rollen schließen den Start ab und veröffentlichen den aktuellen zugewiesenen RAM-Datensatz;
  der bestehende Initialisierer endet erfolgreich.
stages.0.objectives.0.text: Ursprüngliche Ressourcen, Quelldaten und Images bleiben erhalten; Produzentenlimit und
  alle Startphasen bleiben im vorgegebenen Speicherbudget.
stages.0.objectives.1.text: Alle Rollen schließen den Start ab und veröffentlichen den aktuellen zugewiesenen RAM-Datensatz;
  der bestehende Initialisierer endet erfolgreich.
hints.0.text: Speicherzuweisung, Prozessstart, Init-Abschluss und Readiness sind verschiedene Grenzen. Ein Container-Neustart
  und die Lebensdauer eines speicherbasierten Pod-Volumes müssen nicht übereinstimmen.
hints.1.text: Vergleiche `startup-contract.json`, Workload- und Quelldefinitionen, Pod-Limits, `kubectl describe
  pod <pod>` und `kubectl logs <pod> -c <container> --previous`. Prüfe Beendigungsdetails von Init- und Hauptcontainern
  sowie aktuelle Datensatzeingaben.
hints.2.text: Baue einen begrenzten Start gegen den aktuellen Datensatz auf und wähle ausreichende Phasenbudgets
  innerhalb der Obergrenze. Prüfe Rollout, erfolgreichen Init-Abschluss, `stat -f -c %T /cache`, Dateigröße, zugewiesene
  Blöcke, Prüfsumme und jede HTTP-Metadatenschnittstelle. Erwartet werden ursprüngliche Quell- und Ressourcenidentitäten,
  tatsächlich zugewiesene tmpfs-Daten laut Vertrag und aktuelle Veröffentlichungsmetadaten.
debrief: 'Verschiedene Speicherfehler benötigten verschiedene Korrekturen: unbegrenzte Arbeit, Init-Kapazität und
  eine nicht passende residente Eingabe. Der aktuelle Datensatz erreicht nun alle Startphasen innerhalb des Budgets
  bei erhaltenen Ressourcen.'
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe den workload-Status und seine Bereitschaft nach der Änderung überprüft.
