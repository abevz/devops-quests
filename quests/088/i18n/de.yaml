title: Speicher und Start
brief: |-
  Die vorgegebenen Anwendungen erreichen innerhalb ihres Speicherbudgets keinen nutzbaren Startzustand. Stelle die ursprünglichen Workloads wieder her und liefere den aktuellen Datensatz über ihre Startphasen.

  Arbeite auf der Workstation in `~/quest` mit `startup-contract.json`; untersuche Quelle und Workloads im Kubernetes-Namespace.

  **Anforderungen:**
  - Erhalte Daten und Identität der ursprünglichen Quell-ConfigMap, Workload- und Service-Identitäten sowie die vorgegebenen unveränderlichen Anwendungsimages.
  - Der Produzenten-Worker behält sein vorgeschriebenes Speicherlimit; jeder Anwendungs-Pod und jede Startphase bleiben im vertraglich festgelegten Budget.
  - Jeder vorgegebene Workload schließt den Rollout ab. Erhalte den bestehenden Warmup-Init-Container und seinen erfolgreichen Abschluss vor dem nachfolgenden Worker.
  - Jede Rolle hält einen tatsächlich zugewiesenen speicherbasierten Datensatz mit aktueller Größe und Prüfsumme. Ihr selektorbasierter ClusterIP-Service veröffentlicht passende Metadaten über die erklärte Schnittstelle.

  Prüfungen beobachten aktuelle Budgets, Eigentümer, abgeschlossene Initialisierung, zugewiesene Daten und HTTP-Datensätze. Caches dürfen aus der erhaltenen Quelle neu aufgebaut werden; Befehlsverlauf, Neustartfreiheit und unterbrechungsfreie Verfügbarkeit werden nicht geprüft.
stages.0.brief: Alle Rollen schließen den Start ab und veröffentlichen den aktuellen zugewiesenen RAM-Datensatz;
  der bestehende Initialisierer endet erfolgreich.
stages.0.objectives.0.text: Ursprüngliche Ressourcen, Quelldaten und Images bleiben erhalten; Produzentenlimit und
  alle Startphasen bleiben im vorgegebenen Speicherbudget.
stages.0.objectives.1.text: Alle Rollen schließen den Start ab und veröffentlichen den aktuellen zugewiesenen RAM-Datensatz;
  der bestehende Initialisierer endet erfolgreich.
hints.0.text: Speicherzuweisung, Prozessstart, Init-Abschluss und Readiness sind verschiedene Grenzen. Ein Container-Neustart
  und die Lebensdauer eines speicherbasierten Pod-Volumes müssen nicht übereinstimmen.
hints.1.text: |-
  Vergleiche `startup-contract.json`, Workload- und Quelldefinitionen, Pod-Limits, `kubectl describe pod <pod>` und `kubectl logs <pod> -c <container> --previous`. Prüfe Beendigungsdetails von Init- und Hauptcontainern sowie aktuelle Datensatzeingaben.

  Prüfe den Datensatz und das Speicherlimit jeder Startphase. Vergleiche den Beendigungsgrund mit den Workload-Ereignissen und der vorgegebenen Obergrenze.
hints.2.text: |-
  Prüfe Rollout, erfolgreichen Init-Abschluss, `stat -f -c %T /cache`, Dateigröße, zugewiesene Blöcke, Prüfsumme und jede HTTP-Metadatenschnittstelle. Erwartet werden ursprüngliche Quell- und Ressourcenidentitäten, tatsächlich zugewiesene tmpfs-Daten laut Vertrag und aktuelle Veröffentlichungsmetadaten.

  Bei jedem bereiten Pod des Deployments muss das Dateisystem `tmpfs` sein. Dateigröße und SHA-256 müssen dem Nachweis entsprechen. Die Zahl zugewiesener Blöcke mal `512` muss die Dateigröße abdecken. Der Initialisierer in `stager` muss mit `0` enden. Vergleiche alle HTTP-Datensätze mit der bereitgestellten Publikation.

  ```sh
  (
  set -euo pipefail
  expected_size=$(jq -er .publication.bytes startup-identities.json)
  expected_hash=$(jq -er .publication.sha256 startup-identities.json)
  jq '{identities,image,publication}' startup-identities.json
  kubectl get deployments,replicasets,pods,services -o yaml
  for name in relay stager reader; do
    kubectl rollout status "deployment/$name" --timeout=10s
    pods=$(kubectl get deployments,replicasets,pods -o json | jq -r --arg name "$name" '
      def owned($kind; $uids): any(.metadata.ownerReferences[]?;
        .controller == true and .kind == $kind and (.uid as $uid | $uids | index($uid) != null));
      .items as $items | ($items[] | select(.kind == "Deployment" and .metadata.name == $name)) as $dep
      | [$items[] | select(.kind == "ReplicaSet" and owned("Deployment"; [$dep.metadata.uid])) | .metadata.uid] as $rs
      | $items[] | select(.kind == "Pod" and owned("ReplicaSet"; $rs) and .metadata.deletionTimestamp == null
        and any(.status.conditions[]?; .type == "Ready" and .status == "True")) | .metadata.name')
    if [ -z "$pods" ]; then
      printf '%s: no ready owned Pod\n' "$name" >&2
      exit 1
    fi
    while IFS= read -r pod; do
      if [ "$name" = stager ]; then
        kubectl get pod "$pod" -o json |
          jq -e 'any(.status.initContainerStatuses[]?; .name=="warmer" and .state.terminated.exitCode==0)' >/dev/null
      fi
      test "$(kubectl exec "$pod" -c worker -- stat -f -c %T /cache)" = tmpfs
      file_stats=$(kubectl exec "$pod" -c worker -- stat -c '%s %b' /cache/payload)
      read -r size blocks <<< "$file_stats"
      test "$size" -eq "$expected_size"
      test "$((blocks * 512))" -ge "$size"
      payload=$(kubectl exec "$pod" -c worker -- sha256sum /cache/payload)
      test "${payload%% *}" = "$expected_hash"
      kubectl exec "$pod" -c worker -- wget -qO- -T 3 "http://$name:8080/record.json" |
        jq -e --slurpfile expected startup-identities.json '
          $expected[0].publication as $wanted |
          .cache_id==$wanted.cache_id and .bytes==$wanted.bytes and .sha256==$wanted.sha256' >/dev/null
      printf '%s/%s: allocated payload and publication match\n' "$name" "$pod"
    done <<< "$pods"
  done
  )
  ```
debrief: 'Verschiedene Speicherfehler benötigten verschiedene Korrekturen: unbegrenzte Arbeit, Init-Kapazität und
  eine nicht passende residente Eingabe. Der aktuelle Datensatz erreicht nun alle Startphasen innerhalb des Budgets
  bei erhaltenen Ressourcen.'
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe den workload-Status und seine Bereitschaft nach der Änderung überprüft.
diagnostics.probe_0_0: Die Quelle hat möglicherweise noch das gelieferte 16Mi Limit statt des geforderten 96Mi Äquivalents; diese frühe Quantity-Prüfung endet vor benannten Budgetergebnissen. Helper-Start, eingefrorene Eingaben und unerwartete JSON-Fehler können ebenfalls diesen Fallback ergeben. [Ursache und Prüfung](guides#guide=kubernetes-9&section=startup-ram-producer-limit-and-early-inputs)
diagnostics.startup_identity: Deployment, Service oder Quell-ConfigMap wurden möglicherweise bei der Startreparatur neu erstellt; erhalten Sie alle sieben eingefrorenen Ressourcen-UIDs. Ein gescheiterter Ressourcenabruf nutzt denselben Marker, neue Pod-Identitäten sind erlaubt. [Ursache und Prüfung](guides#guide=kubernetes-9&section=startup-ram-original-resources)
diagnostics.startup_budget: Ein Template oder ausgewählter bereiter Pod überschreitet möglicherweise die 96Mi Grenze oder lässt ein erforderliches Speicherlimit aus. Berücksichtigen Sie Spitzen gewöhnlicher Initializer und dauerhaft laufende restartable Initializer; ein begrenztes Pod-Speicherlimit ist ebenfalls erlaubt. Limits über dem Vertrag zu erhöhen behebt diese Bedingung nicht. [Ursache und Prüfung](guides#guide=kubernetes-9&section=startup-ram-phase-memory-envelope)
diagnostics.startup_image: Der benannte Anwendungscontainer wurde möglicherweise bei der Programm- oder Limitreparatur auf ein anderes Image umgestellt; erhalten Sie das gelieferte unveränderliche Image. Die exakte Referenz oder eine mit demselben eingefrorenen Digest wird akzeptiert. [Ursache und Prüfung](guides#guide=kubernetes-9&section=startup-ram-immutable-worker-image)
diagnostics.startup_initializer: Der erforderliche warmer fehlt möglicherweise, ist doppelt vorhanden, nutzt ein anderes Image oder wurde restartable, oder sein beobachtetes Ende war nicht erfolgreich; erhalten Sie einen gewöhnlichen Initializer mit geliefertem Image und Exitcode 0 vor dem Anwendungsstart. [Ursache und Prüfung](guides#guide=kubernetes-9&section=startup-ram-ordinary-warmup-contract)
diagnostics.startup_source: Quellwerte wurden möglicherweise zum leichteren Start verkleinert oder ersetzt; erhalten Sie die gelieferten CACHE_MIB und CACHE_ID Einträge bei der Verbraucherreparatur. Zusätzliche ConfigMap-Data-Schlüssel sind erlaubt, Quell-API-Fehler nutzen denselben Marker. [Ursache und Prüfung](guides#guide=kubernetes-9&section=startup-ram-current-source-data)
diagnostics.startup_service: Ein Service hat möglicherweise den falschen Typ, einen nicht zum Anwendungstemplate passenden Selector oder einen fehlenden beziehungsweise doppelten TCP-Port; erhalten Sie Typ ClusterIP, einen nichtleeren passenden Selector und einen Port 8080. Ressourcenabruf-Fehler nutzen denselben Marker. [Ursache und Prüfung](guides#guide=kubernetes-9&section=startup-ram-declared-service-interface)
diagnostics.startup_payload: Die gelieferte Quelle vergrößert Speicher endlos und prüft den falschen Port; ihr Rollout kann vor dem Datenobserver je Rolle scheitern. Erstellen Sie den aktuellen RAM-Payload und die deklarierte HTTP-Schnittstelle innerhalb des erforderlichen Limits; spätere Pod- oder ReplicaSet-Beobachtungsfehler nutzen denselben Marker. [Ursache und Prüfung](guides#guide=kubernetes-9&section=startup-ram-producer-startup-gate)
diagnostics.probe_0_1: Eingefrorene Fakten, helpers, numerische Dateimetadaten oder JSON sind möglicherweise vor einem benannten Ergebnis unlesbar oder fehlerhaft; prüfen Sie diese Eingaben separat. Gewöhnliche Rollout-, Payload- und Publication-Befehlsfehler behalten eigene Marker; der Fallback allein belegt keinen Image- oder Speicherfehler. [Ursache und Prüfung](guides#guide=kubernetes-9&section=startup-ram-data-observer-fallback)
diagnostics.startup_payload_relay: 'relay: Der Quelle fehlt möglicherweise trotz Rollout ein nutzbarer RAM-Mount oder vollständig zugewiesener aktueller Payload; prüfen Sie tmpfs, Dateigröße, zugewiesene Blöcke und Prüfsumme in ihren aktuellen bereiten zugehörigen Pods. [Ursache und Prüfung](guides#guide=kubernetes-9&section=startup-ram-relay-allocated-payload)'
diagnostics.startup_publication_relay: 'relay: Der Service veröffentlicht möglicherweise alte Cache-Metadaten oder die Anfrage scheitert; vergleichen Sie aktuelle Cache-ID, Bytezahl und Prüfsumme mit der eingefrorenen Veröffentlichung. Zusätzliche JSON-Felder sind erlaubt, eine gesunde HTTP-Antwort allein belegt keinen zugewiesenen Datensatz. [Ursache und Prüfung](guides#guide=kubernetes-9&section=startup-ram-relay-current-metadata)'
diagnostics.startup_payload_stager: 'stager: Der gelieferte Initializer hat nur 32Mi für den 80Mi Datensatz; korrigieren Sie die Zuweisung innerhalb der 96Mi Grenze und erhalten Sie die gewöhnliche Warmup-Phase. Ein gescheiterter Rollen-Rollout meldet diesen Marker vor Init-Statusprüfungen; ein bereiter Pod braucht weiterhin den vollständig zugewiesenen Payload. [Ursache und Prüfung](guides#guide=kubernetes-9&section=startup-ram-stager-allocated-payload)'
diagnostics.startup_publication_stager: 'stager: Der Service veröffentlicht möglicherweise alte Cache-Metadaten oder die Anfrage scheitert; vergleichen Sie aktuelle Cache-ID, Bytezahl und Prüfsumme mit der eingefrorenen Veröffentlichung. Zusätzliche JSON-Felder sind erlaubt, eine gesunde HTTP-Antwort allein belegt keinen zugewiesenen Datensatz. [Ursache und Prüfung](guides#guide=kubernetes-9&section=startup-ram-stager-current-metadata)'
diagnostics.startup_payload_reader: 'reader: Die gelieferte Eingabe verlangt 112Mi unter der 96Mi Grenze statt des aktuellen 80Mi Datensatzes; nutzen Sie die erhaltenen Quellwerte und prüfen Sie Rollout und tatsächlich zugewiesene RAM-Datei, statt den Payload zu verkleinern oder nur dünn zu deklarieren. [Ursache und Prüfung](guides#guide=kubernetes-9&section=startup-ram-reader-allocated-payload)'
diagnostics.startup_publication_reader: 'reader: Der Service veröffentlicht möglicherweise alte Cache-Metadaten oder die Anfrage scheitert; vergleichen Sie aktuelle Cache-ID, Bytezahl und Prüfsumme mit der eingefrorenen Veröffentlichung. Zusätzliche JSON-Felder sind erlaubt, eine gesunde HTTP-Antwort allein belegt keinen zugewiesenen Datensatz. [Ursache und Prüfung](guides#guide=kubernetes-9&section=startup-ram-reader-current-metadata)'
