title: Speicher und Start
brief: 'Sie sind dem Betrieb SignalRail beigetreten. Reparieren Sie ein worker-Speicherlimit und sein
  readiness-Gate. Arbeiten Sie in ~/quest.. Bewahren Sie alle Änderungen in diesem Trainingsbereich auf.


  Eingaben in `~/quest`: `deployment.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur die bereitgestellten Dateien,
  vorinstallierten Bilder und privaten Dienste. Alle Änderungen müssen innerhalb dieser Bucht bleiben.


  Erste Erfolgskriterien: Relay läuft mit einem 96Mi-Limit und besteht readiness.'
stages.0.brief: 'Der neue Befehl worker ist fehlgeschlagen. Legen Sie ein 96Mi-Limit fest und reparieren
  Sie dessen HTTP readiness.


  Erfolgskriterien: Relay läuft mit einem 96Mi-Limit und besteht readiness.'
stages.0.objectives.0.text: Relay läuft mit einem 96Mi-Limit und besteht readiness.
hints.0.text: Überprüfen Sie den letzten Abschlussstatus und den readiness-Fehler separat.
hints.1.text: Der alte Befehl vergrößert den Speicher unbegrenzt; Eine größere Grenze allein ist keine
  Reparatur.
hints.2.text: Führen Sie den normalen HTTP worker aus, stellen Sie 96Mi ein und zeigen Sie readiness auf
  / auf 8080.
debrief: Der worker konnte nicht gestartet werden und sein probe verwendete den falschen Port. Sie haben
  den Start repariert, 96Mi zugewiesen und einen fehlerfreien HTTP rollout überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe den workload-Status und seine Bereitschaft nach der Änderung überprüft.
