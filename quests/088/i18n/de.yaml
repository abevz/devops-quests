title: Speicher und Start
brief: 'Der HTTP-Workload bleibt innerhalb seines Speicherbudgets nicht bereit. Stellen Sie einen stabilen
  Rollout mit dem geforderten Speicherlimit her.


  Arbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte Eingabedateien: `deployment.yaml`.


  **Anforderungen:**

  - Der relay-Container hat ein Speicherlimit von `96Mi`.

  - Deployment `relay` schließt seinen Rollout ab.

  '
stages.0.brief: Der Workload muss innerhalb seines geforderten Speicherlimits bereit bleiben.
stages.0.objectives.0.text: Der relay-Container hat ein Speicherlimit von `96Mi`.
stages.0.objectives.1.text: Deployment `relay` schließt seinen Rollout ab.
hints.0.text: Ressourcenbudget und erfolgreicher Anwendungsstart müssen beide erfüllt sein.
hints.1.text: 'Prüfen Sie den fehlgeschlagenen neuen Befehl, den letzten Beendigungszustand und den Readiness-Fehler
  getrennt.


  Der alte Befehl vergrößert den Speicher unbegrenzt; Eine größere Grenze allein ist keine Reparatur.


  Prüfen Sie die mitgelieferten Definitionen, aktuellen Ressourcen und Ereignisse.


  ```sh

  cat deployment.yaml

  kubectl describe deployment relay

  kubectl get pods -l app=relay -o yaml

  ```'
hints.2.text: 'Führen Sie den normalen HTTP worker aus, stellen Sie 96Mi ein und zeigen Sie readiness auf / auf 8080.


  Prüfen Sie das beobachtete Ergebnis:


  ```sh

  kubectl rollout status deployment/relay --timeout=3s

  kubectl get deployment relay -o jsonpath=''{.spec.template.spec.containers[?(@.name=="worker")].resources.limits.memory}''

  ```


  Erwartet werden ein abgeschlossener Rollout und das Speicherlimit 96Mi.


  Die angezeigte Menge muss `96Mi` entsprechen; die Schreibweise darf abweichen.'
debrief: Der worker konnte nicht gestartet werden und sein probe verwendete den falschen Port. Sie haben den
  Start repariert, 96Mi zugewiesen und einen fehlerfreien HTTP rollout überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe den workload-Status und seine Bereitschaft nach der Änderung überprüft.
diagnostics.probe_0_0: 'Mit den aktuellen Eingaben konnte dieses Ziel nicht geprüft werden: Der relay-Container
  hat ein Speicherlimit von `96Mi`.'
