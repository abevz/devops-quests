title: Memory and startup
brief: 'The HTTP workload is not staying ready within its memory budget. Restore a stable rollout with the
  required memory limit.


  Work in `~/quest` on the workstation. Supplied inputs: `deployment.yaml`.


  **Requirements:**

  - The relay container has a memory limit of `96Mi`.

  - Deployment `relay` completes its rollout.

  '
stages.0.brief: The workload must remain ready within its required memory limit.
stages.0.objectives.0.text: The relay container has a memory limit of `96Mi`.
stages.0.objectives.1.text: Deployment `relay` completes its rollout.
hints.0.text: A resource budget and successful application startup must both be satisfied.
hints.1.text: 'Inspect the failed new command, last termination state and readiness failure separately.


  The old command grows memory without a bound; a larger limit alone is not a repair.


  Inspect the supplied definitions, current resources and events.


  ```sh

  cat deployment.yaml

  kubectl describe deployment relay

  kubectl get pods -l app=relay -o yaml

  ```'
hints.2.text: 'Run the normal HTTP worker, set 96Mi and point readiness to / on 8080.


  Verify the observed result:


  ```sh

  kubectl rollout status deployment/relay --timeout=3s

  kubectl get deployment relay -o jsonpath=''{.spec.template.spec.containers[?(@.name=="worker")].resources.limits.memory}''

  ```


  Expect a completed rollout and the memory limit 96Mi.


  The displayed quantity must represent `96Mi`; its spelling may differ.'
debrief: The worker could not start and its probe used the wrong port. You repaired startup, assigned 96Mi
  and verified a healthy HTTP rollout.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked the workload state and its readiness after the change.
