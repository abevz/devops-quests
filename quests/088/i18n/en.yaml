title: Memory and startup
brief: |
  The HTTP workload is not staying ready within its memory budget. Restore a stable rollout with the required memory limit.

  Work in `~/quest` on the workstation. Supplied inputs: `deployment.yaml`.

  **Requirements:**
  - Deployment `relay` completes its rollout.
  - Inside Deployment `relay`, container `worker` has this memory limit:
    - `96Mi`

  **Verify yourself before Check & finish:**
  Run these observation commands from `~/quest` on the workstation.
  - `kubectl get deployment relay -o yaml` — The application container memory limit is `96Mi`.
  - `kubectl rollout status deployment/relay --timeout=3s` — The workload rollout is complete.
stages.0.brief: |
  The workload must remain ready within its required memory limit.
stages.0.objectives.0.text: The relay container has a memory limit of `96Mi`.
stages.0.objectives.1.text: Deployment `relay` completes its rollout.
hints.0.text: |
  Inspect the failed new command, last termination state and readiness failure separately.
hints.1.text: The old command grows memory without a bound; a larger limit alone is not a repair.
hints.2.text: Run the normal HTTP worker, set 96Mi and point readiness to / on 8080.
debrief: The worker could not start and its probe used the wrong port. You repaired startup, assigned
  96Mi and verified a healthy HTTP rollout.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked the workload state and its readiness after the change.
