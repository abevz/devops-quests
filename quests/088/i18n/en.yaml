title: Memory and startup
brief: 'You joined SignalRail operations. Repair a worker memory limit and its readiness gate. Work in
  ~/quest. Keep all changes inside this training bay.


  Inputs in `~/quest`: `deployment.json`.


  The bay has no Internet or external DNS. Use only its supplied files, preloaded images and private services.
  All changes must stay inside this bay.


  Initial success criteria: Relay runs with a 96Mi limit and passes readiness.'
stages.0.brief: 'The new worker command failed. Set a 96Mi limit and repair its HTTP readiness.


  Success criteria: Relay runs with a 96Mi limit and passes readiness.'
stages.0.objectives.0.text: Relay runs with a 96Mi limit and passes readiness.
hints.0.text: Inspect last termination state and the readiness failure separately.
hints.1.text: The old command grows memory without a bound; a larger limit alone is not a repair.
hints.2.text: Run the normal HTTP worker, set 96Mi and point readiness to / on 8080.
debrief: The worker could not start and its probe used the wrong port. You repaired startup, assigned
  96Mi and verified a healthy HTTP rollout.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked the workload state and its readiness after the change.
