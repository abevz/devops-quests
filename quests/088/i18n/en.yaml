title: Memory and startup
brief: |-
  The supplied applications are not completing usable startup within their memory envelope. Recover the original workloads and deliver the current dataset across their startup phases.

  Work on the workstation in `~/quest` with `startup-contract.json`; inspect the supplied source and workloads in the Kubernetes namespace.

  **Requirements:**
  - Keep the original source ConfigMap data and identity, original workload and Service identities, and supplied immutable application images.
  - The producer worker retains its required memory limit; every application Pod and startup phase stays within the envelope declared in the contract.
  - Every supplied workload completes rollout. Keep the existing warmup initializer and its successful completion before the downstream worker.
  - Each role holds an actually allocated memory-backed payload with the current dataset size and checksum. Its selector-based ClusterIP Service publishes the matching metadata record through the declared interface.

  Checks observe current budgets, ownership, completed initialization, allocated payloads and HTTP records. Caches may be rebuilt from the preserved source; command history, zero restarts and uninterrupted availability are not verified.
stages.0.brief: All roles complete startup and publish the current allocated RAM dataset; the existing initializer
  completes successfully.
stages.0.objectives.0.text: Original resources, source data and images are retained; the producer limit and all
  startup phases stay within the supplied memory envelope.
stages.0.objectives.1.text: All roles complete startup and publish the current allocated RAM dataset; the existing
  initializer completes successfully.
hints.0.text: Memory allocation, process startup, initializer completion and readiness are different boundaries.
  A container restart and the lifetime of a memory-backed Pod volume need not coincide.
hints.1.text: Compare `startup-contract.json`, workload and source definitions, Pod resource limits, `kubectl describe
  pod <pod>` and `kubectl logs <pod> -c <container> --previous`. Inspect both init and main termination details
  and the current dataset inputs.
hints.2.text: Construct bounded startup against the current dataset and assign sufficient phase budgets within the
  supplied ceiling. Verify rollout, successful init termination, `stat -f -c %T /cache`, payload size, allocated
  blocks, checksum and every declared HTTP metadata interface. Expect the original source and resource identities,
  an allocated tmpfs payload matching the contract, and current publication metadata.
debrief: 'Distinct memory failures needed distinct corrections: unbounded work, initializer capacity and a resident
  input that could not fit. The current dataset now reaches all startup phases within budget, with the original
  resources retained.'
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked the workload state and its readiness after the change.
diagnostics.probe_0_0: The producer may still have its supplied 16Mi limit instead of the required 96Mi equivalent; that early quantity check stops before named budget results. Helper startup, frozen-input and unexpected JSON errors can also reach this fallback. [Cause and check](guides#guide=kubernetes-9&section=startup-ram-producer-limit-and-early-inputs)
diagnostics.startup_identity: A Deployment, Service or source ConfigMap may have been recreated while repairing startup; keep all seven frozen resource UIDs. A failed resource read also uses this marker, while replacement Pod identities are allowed. [Cause and check](guides#guide=kubernetes-9&section=startup-ram-original-resources)
diagnostics.startup_budget: A template or selected ready Pod may exceed the 96Mi envelope or omit a required memory limit. Account for ordinary initializer peaks and resident restartable initializers; an optional bounded Pod memory limit is also accepted. Increasing limits beyond the contract does not repair this condition. [Cause and check](guides#guide=kubernetes-9&section=startup-ram-phase-memory-envelope)
diagnostics.startup_image: The named application container may have been switched to another image while repairing its program or limits; retain the supplied immutable image. The exact reference or a reference carrying the same frozen digest is accepted. [Cause and check](guides#guide=kubernetes-9&section=startup-ram-immutable-worker-image)
diagnostics.startup_initializer: The required warmer may be missing, duplicated, use another image or become restartable, or its observed termination may not be successful; retain one ordinary initializer with the supplied image and exit code 0 before the application starts. [Cause and check](guides#guide=kubernetes-9&section=startup-ram-ordinary-warmup-contract)
diagnostics.startup_source: Source values may have been reduced or replaced to make startup easier; retain the supplied CACHE_MIB and CACHE_ID entries while repairing consumers. Additional ConfigMap data keys are allowed, and source API failures share this marker. [Cause and check](guides#guide=kubernetes-9&section=startup-ram-current-source-data)
diagnostics.startup_service: A Service may have the wrong type, a selector that does not match its application template, or a missing or duplicate declared TCP port; retain ClusterIP type, a nonempty matching selector and one port 8080. Resource read errors also use this marker. [Cause and check](guides#guide=kubernetes-9&section=startup-ram-declared-service-interface)
diagnostics.startup_payload: The supplied producer grows memory indefinitely and probes the wrong port; its rollout can fail before the per-role dataset observer starts. Build the current RAM payload and serve the declared HTTP interface within the required limit; later Pod or ReplicaSet observation errors also use this marker. [Cause and check](guides#guide=kubernetes-9&section=startup-ram-producer-startup-gate)
diagnostics.probe_0_1: Frozen facts, helpers, numeric file metadata or returned JSON may be unreadable or malformed before a named result; inspect these inputs separately. Normal rollout, payload-command and publication-command failures retain their named markers; this fallback does not imply an image or memory fault by itself. [Cause and check](guides#guide=kubernetes-9&section=startup-ram-data-observer-fallback)
diagnostics.startup_payload_relay: 'relay: The producer may lack a usable RAM mount or fully allocated current payload despite rollout; inspect tmpfs, file size, allocated blocks and checksum in its current ready owned Pods. [Cause and check](guides#guide=kubernetes-9&section=startup-ram-relay-allocated-payload)'
diagnostics.startup_publication_relay: 'relay: The Service may publish stale cache metadata or fail the request; compare its current cache ID, byte count and checksum with the frozen publication. Additional JSON fields are allowed, but a healthy HTTP response alone does not prove the allocated dataset. [Cause and check](guides#guide=kubernetes-9&section=startup-ram-relay-current-metadata)'
diagnostics.startup_payload_stager: 'stager: The supplied initializer has only 32Mi for the 80Mi dataset; repair its allocation within the 96Mi envelope and retain the ordinary warmup phase. A failed role rollout reports this marker before initializer-status checks; a ready Pod must still have the complete allocated payload. [Cause and check](guides#guide=kubernetes-9&section=startup-ram-stager-allocated-payload)'
diagnostics.startup_publication_stager: 'stager: The Service may publish stale cache metadata or fail the request; compare its current cache ID, byte count and checksum with the frozen publication. Additional JSON fields are allowed, but a healthy HTTP response alone does not prove the allocated dataset. [Cause and check](guides#guide=kubernetes-9&section=startup-ram-stager-current-metadata)'
diagnostics.startup_payload_reader: 'reader: The supplied input requests 112Mi under the 96Mi envelope instead of the current 80Mi dataset; use the preserved source values, then verify rollout and the actually allocated RAM file rather than shrinking or sparsely declaring the payload. [Cause and check](guides#guide=kubernetes-9&section=startup-ram-reader-allocated-payload)'
diagnostics.startup_publication_reader: 'reader: The Service may publish stale cache metadata or fail the request; compare its current cache ID, byte count and checksum with the frozen publication. Additional JSON fields are allowed, but a healthy HTTP response alone does not prove the allocated dataset. [Cause and check](guides#guide=kubernetes-9&section=startup-ram-reader-current-metadata)'
