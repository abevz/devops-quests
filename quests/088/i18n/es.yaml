title: Memoria y arranque
brief: 'Te uniste a las operaciones de SignalRail. Reparar un límite de memoria worker y su puerta readiness.
  Trabajar en ~/quest. Mantenga todos los cambios dentro de esta bahía de entrenamiento.


  Entradas en `~/quest`: `deployment.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente los archivos suministrados, las imágenes
  precargadas y los servicios privados. Todos los cambios deben permanecer dentro de esta bahía.


  Criterios de éxito iniciales: Relay se ejecuta con un límite de 96Mi y supera readiness.'
stages.0.brief: 'El nuevo comando worker falló. Establezca un límite 96Mi y repare su HTTP readiness.


  Criterios de éxito: Relay se ejecuta con un límite de 96Mi y supera readiness.'
stages.0.objectives.0.text: Relay se ejecuta con un límite 96Mi y supera readiness.
hints.0.text: Inspeccione el último estado de terminación y la falla del readiness por separado.
hints.1.text: El antiguo mandato hace crecer la memoria sin límite; un límite mayor por sí solo no es
  una reparación.
hints.2.text: Ejecute el HTTP worker normal, configure 96Mi y apunte readiness a/en 8080.
debrief: El worker no pudo iniciarse y su probe utilizó el puerto incorrecto. Reparó el inicio, asignó
  96Mi y verificó un HTTP rollout en buen estado.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el estado de workload y su preparación después del cambio.
