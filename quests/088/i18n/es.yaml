title: Memoria y arranque
brief: 'La carga HTTP no se mantiene lista dentro de su presupuesto de memoria. Recupera un rollout estable
  con el límite de memoria requerido.


  Trabaja en `~/quest` en la workstation. Archivos de entrada suministrados: `deployment.yaml`.


  **Requisitos:**

  - El contenedor relay tiene un límite de memoria de `96Mi`.

  - El Deployment `relay` completa su rollout.

  '
stages.0.brief: La carga debe mantenerse lista dentro del límite de memoria requerido.
stages.0.objectives.0.text: El contenedor relay tiene un límite de memoria de `96Mi`.
stages.0.objectives.1.text: El Deployment `relay` completa su rollout.
hints.0.text: Deben cumplirse tanto el presupuesto de recursos como el arranque correcto de la aplicación.
hints.1.text: 'Inspecciona por separado el comando nuevo fallido, el último estado de terminación y el fallo
  de readiness.


  El antiguo mandato hace crecer la memoria sin límite; un límite mayor por sí solo no es una reparación.


  Inspecciona las definiciones suministradas, los recursos actuales y los eventos.


  ```sh

  cat deployment.yaml

  kubectl describe deployment relay

  kubectl get pods -l app=relay -o yaml

  ```'
hints.2.text: 'Ejecute el HTTP worker normal, configure 96Mi y apunte readiness a/en 8080.


  Verifica el resultado observado:


  ```sh

  kubectl rollout status deployment/relay --timeout=3s

  kubectl get deployment relay -o jsonpath=''{.spec.template.spec.containers[?(@.name=="worker")].resources.limits.memory}''

  ```


  Se esperan un rollout completo y el límite de memoria 96Mi.


  La cantidad mostrada debe equivaler a `96Mi`; su representación puede variar.'
debrief: El worker no pudo iniciarse y su probe utilizó el puerto incorrecto. Reparó el inicio, asignó 96Mi
  y verificó un HTTP rollout en buen estado.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el estado de workload y su preparación después del cambio.
