title: Memoria y arranque
brief: |
  La carga HTTP no se mantiene lista dentro de su presupuesto de memoria. Recupera un rollout estable con el límite de memoria requerido.

  Trabaja en `~/quest` en la workstation. Archivos de entrada suministrados: `deployment.yaml`.

  **Requisitos:**
  - El Deployment `relay` completa su rollout.
  - Dentro del Deployment `relay`, el contenedor `worker` tiene este límite de memoria:
    - `96Mi`

  **Verifica antes de Check & finish:**
  Ejecuta estos comandos de observación desde `~/quest` en la workstation.
  - `kubectl get deployment relay -o yaml` — El límite de memoria del contenedor de la aplicación es `96Mi`.
  - `kubectl rollout status deployment/relay --timeout=3s` — El rollout de la carga está completo.
stages.0.brief: |
  La carga debe mantenerse lista dentro del límite de memoria requerido.
stages.0.objectives.0.text: El contenedor relay tiene un límite de memoria de `96Mi`.
stages.0.objectives.1.text: El Deployment `relay` completa su rollout.
hints.0.text: |
  Inspecciona por separado el comando nuevo fallido, el último estado de terminación y el fallo de readiness.
hints.1.text: El antiguo mandato hace crecer la memoria sin límite; un límite mayor por sí solo no es
  una reparación.
hints.2.text: Ejecute el HTTP worker normal, configure 96Mi y apunte readiness a/en 8080.
debrief: El worker no pudo iniciarse y su probe utilizó el puerto incorrecto. Reparó el inicio, asignó
  96Mi y verificó un HTTP rollout en buen estado.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el estado de workload y su preparación después del cambio.
