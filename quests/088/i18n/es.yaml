diagnostics.startup_image: Conserva las imágenes inmutables suministradas en workers e inicializador originales.
diagnostics.startup_budget: Cada Pod y fase de arranque actual debe permanecer dentro del presupuesto finito declarado.
diagnostics.startup_source: Conserva cada dato actual suministrado de la fuente de arranque.
diagnostics.startup_initializer: Conserva el inicializador de calentamiento ordinario existente y su finalización
