title: Memoria y arranque
brief: |-
  Las aplicaciones suministradas no completan un arranque útil dentro de su presupuesto de memoria. Recupera los workloads originales y entrega el conjunto actual de datos a través de sus fases de arranque.

  Trabaja en la estación en `~/quest` con `startup-contract.json`; inspecciona la fuente y los workloads del namespace Kubernetes.

  **Requisitos:**
  - Conserva los datos e identidad del ConfigMap fuente, las identidades de workloads y Services y las imágenes de aplicación inmutables suministradas.
  - El worker productor conserva su límite requerido; cada Pod de aplicación y fase de arranque permanece dentro del presupuesto declarado.
  - Cada workload completa el rollout. Conserva el inicializador de calentamiento existente y su finalización correcta antes del worker posterior.
  - Cada rol conserva datos respaldados por memoria y realmente asignados, con el tamaño y checksum actuales. Su Service ClusterIP con selector publica los metadatos correspondientes mediante la interfaz declarada.

  Las comprobaciones observan presupuestos actuales, propietarios, inicialización finalizada, datos asignados y registros HTTP. Las cachés pueden reconstruirse desde la fuente conservada; no se verifican historial de comandos, ausencia de reinicios ni disponibilidad ininterrumpida.
stages.0.brief: Todos los roles completan el arranque y publican el conjunto RAM actual asignado; el inicializador
  existente finaliza correctamente.
stages.0.objectives.0.text: Se conservan recursos, datos e imágenes originales; el límite productor y todas las
  fases de arranque permanecen dentro del presupuesto.
stages.0.objectives.1.text: Todos los roles completan el arranque y publican el conjunto RAM actual asignado; el
  inicializador existente finaliza correctamente.
hints.0.text: La asignación de memoria, el arranque del proceso, la finalización de init y readiness son límites
  distintos. Un reinicio de contenedor y la vida de un volumen Pod en memoria pueden ser diferentes.
hints.1.text: |-
  Compara `startup-contract.json`, definiciones de workloads y fuente, límites Pod, `kubectl describe pod <pod>` y `kubectl logs <pod> -c <container> --previous`. Inspecciona detalles de terminación tanto de init como de contenedores principales y las entradas actuales.

  Revisa el conjunto de datos que lee cada fase de inicio y el límite de memoria que le corresponde. Contrasta el motivo de terminación con los eventos del workload y el límite suministrado.
hints.2.text: |-
  Verifica rollout, finalización correcta de init, `stat -f -c %T /cache`, tamaño, bloques asignados, checksum y todas las interfaces HTTP de metadatos. Espera identidades originales, datos tmpfs realmente asignados según el contrato y metadatos actuales.

  En cada Pod listo del Deployment, el sistema de archivos debe ser `tmpfs`, el tamaño y SHA-256 del archivo deben coincidir con el comprobante y los bloques asignados multiplicados por `512` deben cubrir su tamaño. El inicializador `stager` debe salir con código `0`. Contrasta todos los registros HTTP con la publicación suministrada.

  ```sh
  (
  set -euo pipefail
  expected_size=$(jq -er .publication.bytes startup-identities.json)
  expected_hash=$(jq -er .publication.sha256 startup-identities.json)
  jq '{identities,image,publication}' startup-identities.json
  kubectl get deployments,replicasets,pods,services -o yaml
  for name in relay stager reader; do
    kubectl rollout status "deployment/$name" --timeout=10s
    pods=$(kubectl get deployments,replicasets,pods -o json | jq -r --arg name "$name" '
      def owned($kind; $uids): any(.metadata.ownerReferences[]?;
        .controller == true and .kind == $kind and (.uid as $uid | $uids | index($uid) != null));
      .items as $items | ($items[] | select(.kind == "Deployment" and .metadata.name == $name)) as $dep
      | [$items[] | select(.kind == "ReplicaSet" and owned("Deployment"; [$dep.metadata.uid])) | .metadata.uid] as $rs
      | $items[] | select(.kind == "Pod" and owned("ReplicaSet"; $rs) and .metadata.deletionTimestamp == null
        and any(.status.conditions[]?; .type == "Ready" and .status == "True")) | .metadata.name')
    if [ -z "$pods" ]; then
      printf '%s: no ready owned Pod\n' "$name" >&2
      exit 1
    fi
    while IFS= read -r pod; do
      if [ "$name" = stager ]; then
        kubectl get pod "$pod" -o json |
          jq -e 'any(.status.initContainerStatuses[]?; .name=="warmer" and .state.terminated.exitCode==0)' >/dev/null
      fi
      test "$(kubectl exec "$pod" -c worker -- stat -f -c %T /cache)" = tmpfs
      file_stats=$(kubectl exec "$pod" -c worker -- stat -c '%s %b' /cache/payload)
      read -r size blocks <<< "$file_stats"
      test "$size" -eq "$expected_size"
      test "$((blocks * 512))" -ge "$size"
      payload=$(kubectl exec "$pod" -c worker -- sha256sum /cache/payload)
      test "${payload%% *}" = "$expected_hash"
      kubectl exec "$pod" -c worker -- wget -qO- -T 3 "http://$name:8080/record.json" |
        jq -e --slurpfile expected startup-identities.json '
          $expected[0].publication as $wanted |
          .cache_id==$wanted.cache_id and .bytes==$wanted.bytes and .sha256==$wanted.sha256' >/dev/null
      printf '%s/%s: allocated payload and publication match\n' "$name" "$pod"
    done <<< "$pods"
  done
  )
  ```
debrief: 'Diferentes fallos de memoria necesitaron distintas correcciones: trabajo sin límite, capacidad de init
  y una entrada residente que no cabía. Los datos actuales llegan ahora a todas las fases dentro del presupuesto
  con los recursos originales conservados.'
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el estado de workload y su preparación después del cambio.
diagnostics.probe_0_0: El productor puede conservar límite 16Mi suministrado en vez del equivalente 96Mi requerido; control inicial quantity se detiene antes de resultados budget nombrados. Inicio de helpers, entradas congeladas y JSON inesperado también pueden dar fallback. [Causa y comprobación](guides#guide=kubernetes-9&section=startup-ram-producer-limit-and-early-inputs)
diagnostics.startup_identity: Deployment, Service o ConfigMap fuente pueden recrearse al reparar inicio; conserve siete UIDs congelados. Fallo de lectura de recurso también usa marcador, pero se permite reemplazar identidades Pod. [Causa y comprobación](guides#guide=kubernetes-9&section=startup-ram-original-resources)
diagnostics.startup_budget: Template o Pod listo seleccionado puede superar envolvente 96Mi u omitir memory limit necesario. Cuente picos de initializer ordinarios y restartable initializer residentes; también se acepta límite de memoria Pod acotado. Elevar límites sobre contract no repara condición. [Causa y comprobación](guides#guide=kubernetes-9&section=startup-ram-phase-memory-envelope)
diagnostics.startup_image: El contenedor nombrado puede cambiar a otro image al reparar programa o límites; conserve image inmutable suministrado. Se acepta referencia exacta u otra con mismo digest congelado. [Causa y comprobación](guides#guide=kubernetes-9&section=startup-ram-immutable-worker-image)
diagnostics.startup_initializer: warmer requerido puede faltar, duplicarse, usar otro image o hacerse restartable, o no terminar correctamente; conserve un initializer ordinario con image suministrado y código 0 antes de iniciar aplicación. [Causa y comprobación](guides#guide=kubernetes-9&section=startup-ram-ordinary-warmup-contract)
diagnostics.startup_source: Valores fuente pueden reducirse o reemplazarse para facilitar inicio; conserve CACHE_MIB y CACHE_ID suministrados al reparar consumidores. Se permiten claves data adicionales y errores API fuente comparten marcador. [Causa y comprobación](guides#guide=kubernetes-9&section=startup-ram-current-source-data)
diagnostics.startup_service: Service puede tener type erróneo, selector que no coincide con template o puerto TCP ausente/duplicado; conserve type ClusterIP, selector coincidente no vacío y un puerto 8080. Errores de lectura también usan marcador. [Causa y comprobación](guides#guide=kubernetes-9&section=startup-ram-declared-service-interface)
diagnostics.startup_payload: Productor suministrado crece memoria indefinidamente y sondea puerto incorrecto; rollout puede fallar antes de observar datos por rol. Construya RAM payload actual e interfaz HTTP dentro del límite requerido; errores posteriores de observación Pod o ReplicaSet también dan marcador. [Causa y comprobación](guides#guide=kubernetes-9&section=startup-ram-producer-startup-gate)
diagnostics.probe_0_1: Hechos congelados, helpers, metadata numéricos de archivo o JSON pueden ser ilegibles o mal formados antes de resultado nombrado; inspeccione entradas aparte. Fallos ordinarios rollout, comandos payload y publication conservan marcadores; fallback por sí solo no prueba fallo de image o memoria. [Causa y comprobación](guides#guide=kubernetes-9&section=startup-ram-data-observer-fallback)
diagnostics.startup_payload_relay: 'relay: El productor puede carecer de RAM mount usable o payload actual completamente asignado pese a rollout; inspeccione tmpfs, tamaño, bloques asignados y checksum en Pod listos actuales propios. [Causa y comprobación](guides#guide=kubernetes-9&section=startup-ram-relay-allocated-payload)'
diagnostics.startup_publication_relay: 'relay: Service puede publicar metadata antiguos o fallar solicitud; compare cache ID actual, bytes y checksum con publicación congelada. Se permiten campos JSON adicionales, pero respuesta HTTP saludable no prueba dataset asignado. [Causa y comprobación](guides#guide=kubernetes-9&section=startup-ram-relay-current-metadata)'
diagnostics.startup_payload_stager: 'stager: Initializer suministrado solo tiene 32Mi para dataset 80Mi; repare asignación dentro de envolvente 96Mi conservando fase warmup ordinaria. Rollout fallido del rol da marcador antes de init status; Pod listo aún debe contener payload completo asignado. [Causa y comprobación](guides#guide=kubernetes-9&section=startup-ram-stager-allocated-payload)'
diagnostics.startup_publication_stager: 'stager: Service puede publicar metadata antiguos o fallar solicitud; compare cache ID actual, bytes y checksum con publicación congelada. Se permiten campos JSON adicionales, pero respuesta HTTP saludable no prueba dataset asignado. [Causa y comprobación](guides#guide=kubernetes-9&section=startup-ram-stager-current-metadata)'
diagnostics.startup_payload_reader: 'reader: La entrada suministrada pide 112Mi bajo envolvente 96Mi en vez de dataset actual 80Mi; use valores fuente conservados y verifique rollout y archivo RAM realmente asignado, sin reducir payload ni declararlo sparse. [Causa y comprobación](guides#guide=kubernetes-9&section=startup-ram-reader-allocated-payload)'
diagnostics.startup_publication_reader: 'reader: Service puede publicar metadata antiguos o fallar solicitud; compare cache ID actual, bytes y checksum con publicación congelada. Se permiten campos JSON adicionales, pero respuesta HTTP saludable no prueba dataset asignado. [Causa y comprobación](guides#guide=kubernetes-9&section=startup-ram-reader-current-metadata)'
