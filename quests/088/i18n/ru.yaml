title: Память и запуск
brief: 'Вы в команде эксплуатации SignalRail. Исправьте лимит памяти и readiness. Работайте в ~/quest.
  Все изменения — только в этой песочнице.


  Входные файлы в `~/quest`: `deployment.json`.


  В песочнице нет интернета и внешнего DNS. Используйте только выданные файлы, предварительно загруженные
  образы и приватные сервисы. Все изменения — только в этой песочнице.'
stages.0.brief: Новая команда не запускается. Установите 96Mi и исправьте HTTP readiness.
stages.0.objectives.0.text: Контейнер relay имеет лимит памяти `96Mi`.
stages.0.objectives.1.text: Deployment `relay` завершает rollout.
hints.0.text: Отдельно проверьте последнее завершение контейнера и ошибку readiness.
hints.1.text: Старая команда бесконтрольно расходует память; одного увеличения лимита недостаточно.
hints.2.text: Запустите обычный HTTP worker, задайте 96Mi и направьте readiness на / через 8080.
debrief: Worker не запускался, probe использовала неверный порт. Вы исправили запуск, выделили 96Mi и
  проверили исправный HTTP rollout.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: После изменения я проверил состояние workload и его готовность.
