title: Память и запуск
brief: |
  HTTP-нагрузка не сохраняет готовность в пределах бюджета памяти. Восстановите стабильный rollout с требуемым лимитом памяти.

  Работайте в `~/quest` на workstation. Предоставленные входные файлы: `deployment.yaml`.

  **Требования:**
  - Deployment `relay` завершает rollout.
  - В Deployment `relay` контейнер `worker` имеет лимит памяти:
    - `96Mi`

  **Проверьте самостоятельно перед Check & finish:**
  Выполняйте эти команды наблюдения из `~/quest` на workstation.
  - `kubectl get deployment relay -o yaml` — Лимит памяти контейнера приложения — `96Mi`.
  - `kubectl rollout status deployment/relay --timeout=3s` — Rollout нагрузки завершён.
stages.0.brief: |
  Нагрузка должна сохранять готовность в пределах требуемого лимита памяти.
stages.0.objectives.0.text: Контейнер relay имеет лимит памяти `96Mi`.
stages.0.objectives.1.text: Deployment `relay` завершает rollout.
hints.0.text: |
  Проверьте сбой новой команды, последнее состояние завершения и ошибку readiness по отдельности.
hints.1.text: Старая команда бесконтрольно расходует память; одного увеличения лимита недостаточно.
hints.2.text: Запустите обычный HTTP worker, задайте 96Mi и направьте readiness на / через 8080.
debrief: Worker не запускался, probe использовала неверный порт. Вы исправили запуск, выделили 96Mi и
  проверили исправный HTTP rollout.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: После изменения я проверил состояние workload и его готовность.
