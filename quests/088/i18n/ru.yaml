title: Память и запуск
brief: 'HTTP-нагрузка не сохраняет готовность в пределах бюджета памяти. Восстановите стабильный rollout с
  требуемым лимитом памяти.


  Работайте в `~/quest` на workstation. Предоставленные входные файлы: `deployment.yaml`.


  **Требования:**

  - Контейнер relay имеет лимит памяти `96Mi`.

  - Deployment `relay` завершает rollout.

  '
stages.0.brief: Нагрузка должна сохранять готовность в пределах требуемого лимита памяти.
stages.0.objectives.0.text: Контейнер relay имеет лимит памяти `96Mi`.
stages.0.objectives.1.text: Deployment `relay` завершает rollout.
hints.0.text: Нужно соблюсти бюджет ресурсов и обеспечить успешный запуск приложения.
hints.1.text: 'Проверьте сбой новой команды, последнее состояние завершения и ошибку readiness по отдельности.


  Старая команда бесконтрольно расходует память; одного увеличения лимита недостаточно.


  Изучите поставленные определения, текущие ресурсы и события.


  ```sh

  cat deployment.yaml

  kubectl describe deployment relay

  kubectl get pods -l app=relay -o yaml

  ```'
hints.2.text: 'Запустите обычный HTTP worker, задайте 96Mi и направьте readiness на / через 8080.


  Проверьте наблюдаемый результат:


  ```sh

  kubectl rollout status deployment/relay --timeout=3s

  kubectl get deployment relay -o jsonpath=''{.spec.template.spec.containers[?(@.name=="worker")].resources.limits.memory}''

  ```


  Ожидаются завершённый rollout и лимит памяти 96Mi.


  Выведенная величина должна соответствовать `96Mi`; её запись может отличаться.'
debrief: Worker не запускался, probe использовала неверный порт. Вы исправили запуск, выделили 96Mi и проверили
  исправный HTTP rollout.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: После изменения я проверил состояние workload и его готовность.
diagnostics.probe_0_0: 'Текущие данные не позволили проверить эту цель: Контейнер relay имеет лимит памяти `96Mi`.'
