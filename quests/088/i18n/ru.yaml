title: Память и запуск
brief: |-
  Заданные приложения не завершают полезный запуск в пределах бюджета памяти. Восстановите исходные workload и доставьте текущий набор данных через их фазы запуска.

  Работайте на рабочей станции в `~/quest` с `startup-contract.json`; изучите заданный источник и workload в пространстве имён Kubernetes.

  **Требования:**
  - Сохраните данные и идентичность исходного ConfigMap, идентичности workload и Service и заданные неизменяемые образы приложений.
  - Worker производителя сохраняет требуемый лимит памяти; каждый Pod приложения и фаза запуска остаются в пределах бюджета из контракта.
  - Каждый заданный workload завершает rollout. Сохраните существующий прогревающий init-контейнер и его успешное завершение перед основным worker.
  - Каждая роль хранит реально выделенный набор данных в памяти с текущими размером и контрольной суммой. Её ClusterIP Service с селектором публикует соответствующие метаданные через заданный интерфейс.

  Проверки наблюдают текущие бюджеты, владельцев, завершённую инициализацию, выделенные данные и HTTP-записи. Кеши можно перестроить из сохранённого источника; история команд, отсутствие рестартов и непрерывная доступность не проверяются.
stages.0.brief: Все роли завершают запуск и публикуют текущие выделенные данные в RAM; существующий init-контейнер
  завершается успешно.
stages.0.objectives.0.text: Исходные ресурсы, данные и образы сохранены; лимит производителя и все фазы запуска
  остаются в заданном бюджете памяти.
stages.0.objectives.1.text: Все роли завершают запуск и публикуют текущие выделенные данные в RAM; существующий
  init-контейнер завершается успешно.
hints.0.text: Выделение памяти, запуск процесса, завершение init-контейнера и readiness — разные границы. Рестарт
  контейнера и срок жизни тома Pod в памяти могут не совпадать.
hints.1.text: Сопоставьте `startup-contract.json`, определения workload и источника, лимиты Pod, `kubectl describe
  pod <pod>` и `kubectl logs <pod> -c <container> --previous`. Изучите завершение init- и основных контейнеров и
  текущие входные данные.
hints.2.text: Постройте ограниченный запуск для текущего набора данных и задайте достаточные бюджеты фаз, не превышая
  общий потолок. Проверьте rollout, успешное завершение init, `stat -f -c %T /cache`, размер, выделенные блоки,
  контрольную сумму и все HTTP-интерфейсы метаданных. Ожидаются исходные идентичности источника и ресурсов, реально
  выделенные данные tmpfs по контракту и актуальные метаданные публикации.
debrief: 'Разные отказы памяти потребовали разных исправлений: бесконтрольная работа, ёмкость init-фазы и входной
  объём, не помещавшийся в бюджет. Текущие данные теперь проходят все фазы запуска с сохранением исходных ресурсов.'
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: После изменения я проверил состояние workload и его готовность.
diagnostics.probe_0_0: У источника мог остаться выданный лимит 16Mi вместо эквивалента требуемых 96Mi; ранняя проверка quantity останавливается до именованных результатов budget. Ошибки загрузки helpers, зафиксированных входов и неожиданного JSON также дают fallback. [Причина и проверка](guides#guide=kubernetes-9&section=startup-ram-producer-limit-and-early-inputs)
diagnostics.startup_identity: Deployment, Service или исходный ConfigMap могли быть пересозданы при исправлении запуска; сохраните все семь зафиксированных UID ресурсов. Ошибка чтения ресурса также даёт этот маркер, а смена идентичностей Pod допустима. [Причина и проверка](guides#guide=kubernetes-9&section=startup-ram-original-resources)
diagnostics.startup_budget: Template или выбранный готовый Pod могут выходить за предел 96Mi либо не иметь нужного memory limit. Учитывайте пики обычных initializer и постоянно работающие restartable initializer; допустим также ограниченный Pod memory limit. Увеличение лимитов сверх contract не исправляет условие. [Причина и проверка](guides#guide=kubernetes-9&section=startup-ram-phase-memory-envelope)
diagnostics.startup_image: Именованный контейнер приложения мог получить другой image при исправлении программы или лимитов; сохраните выданный неизменяемый image. Допустимы точная ссылка или ссылка с тем же зафиксированным digest. [Причина и проверка](guides#guide=kubernetes-9&section=startup-ram-immutable-worker-image)
diagnostics.startup_initializer: Обязательный warmer может отсутствовать, дублироваться, использовать другой image или стать restartable, либо завершиться неуспешно; сохраните один обычный initializer с выданным image и кодом завершения 0 перед запуском приложения. [Причина и проверка](guides#guide=kubernetes-9&section=startup-ram-ordinary-warmup-contract)
diagnostics.startup_source: Значения источника могли быть уменьшены или заменены ради облегчения запуска; сохраните выданные CACHE_MIB и CACHE_ID при исправлении потребителей. Дополнительные data-ключи ConfigMap допустимы, ошибки API источника дают тот же маркер. [Причина и проверка](guides#guide=kubernetes-9&section=startup-ram-current-source-data)
diagnostics.startup_service: Service может иметь неверный type, selector вне template приложения или отсутствующий/повторный TCP-порт; сохраните type ClusterIP, непустой совпадающий selector и один порт 8080. Ошибки чтения ресурса дают тот же маркер. [Причина и проверка](guides#guide=kubernetes-9&section=startup-ram-declared-service-interface)
diagnostics.startup_payload: Выданный источник бесконечно увеличивает память и проверяет неверный порт; rollout может упасть до наблюдения данных по ролям. Создайте текущий RAM payload и HTTP-интерфейс в требуемом лимите; поздние ошибки наблюдения Pod или ReplicaSet дают тот же маркер. [Причина и проверка](guides#guide=kubernetes-9&section=startup-ram-producer-startup-gate)
diagnostics.probe_0_1: Зафиксированные факты, helpers, числовые metadata файла или JSON могут не читаться либо иметь неверную структуру до именованного результата; изучите эти входы отдельно. Обычные сбои rollout, payload-команд и publication-команд сохраняют свои маркеры; fallback сам по себе не доказывает ошибку image или памяти. [Причина и проверка](guides#guide=kubernetes-9&section=startup-ram-data-observer-fallback)
diagnostics.startup_payload_relay: 'relay: У источника может отсутствовать рабочий RAM mount или полностью выделенный текущий payload при завершённом rollout; проверьте tmpfs, размер, выделенные блоки и checksum в текущих готовых принадлежащих Pod. [Причина и проверка](guides#guide=kubernetes-9&section=startup-ram-relay-allocated-payload)'
diagnostics.startup_publication_relay: 'relay: Service может отдавать старые metadata кэша либо не отвечать; сравните текущие cache ID, размер и checksum с зафиксированной публикацией. Дополнительные JSON-поля допустимы, но здоровый HTTP-ответ не доказывает выделенный dataset. [Причина и проверка](guides#guide=kubernetes-9&section=startup-ram-relay-current-metadata)'
diagnostics.startup_payload_stager: 'stager: Выданный initializer имеет лишь 32Mi для данных 80Mi; исправьте выделение в пределах 96Mi, сохранив обычную warmup-фазу. Сбой rollout роли даёт этот маркер до проверки init status; готовый Pod всё равно содержит полный выделенный payload. [Причина и проверка](guides#guide=kubernetes-9&section=startup-ram-stager-allocated-payload)'
diagnostics.startup_publication_stager: 'stager: Service может отдавать старые metadata кэша либо не отвечать; сравните текущие cache ID, размер и checksum с зафиксированной публикацией. Дополнительные JSON-поля допустимы, но здоровый HTTP-ответ не доказывает выделенный dataset. [Причина и проверка](guides#guide=kubernetes-9&section=startup-ram-stager-current-metadata)'
diagnostics.startup_payload_reader: 'reader: Выданный вход запрашивает 112Mi при пределе 96Mi вместо текущих данных 80Mi; используйте сохранённые значения источника и проверьте rollout и реально выделенный RAM-файл, не уменьшая payload и не создавая sparse-файл. [Причина и проверка](guides#guide=kubernetes-9&section=startup-ram-reader-allocated-payload)'
diagnostics.startup_publication_reader: 'reader: Service может отдавать старые metadata кэша либо не отвечать; сравните текущие cache ID, размер и checksum с зафиксированной публикацией. Дополнительные JSON-поля допустимы, но здоровый HTTP-ответ не доказывает выделенный dataset. [Причина и проверка](guides#guide=kubernetes-9&section=startup-ram-reader-current-metadata)'
