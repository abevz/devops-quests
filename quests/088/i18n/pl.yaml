title: Pamięć i uruchamianie
brief: 'Dołączyłeś do operacji SignalRail. Napraw limit pamięci worker i jego bramę readiness. Pracuj
  w ~/quest.. Wszystkie zmiany przechowuj w tej komorze szkoleniowej.


  Wejścia w `~/quest`: `deployment.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Wszystkie zmiany muszą pozostać w tej zatoce.


  Początkowe kryteria sukcesu: Relay działa z limitem 96Mi i przechodzi pomyślnie readiness.'
stages.0.brief: 'Nowe polecenie worker nie powiodło się. Ustaw limit 96Mi i napraw HTTP readiness.


  Kryteria sukcesu: Relay działa z limitem 96Mi i przewyższa readiness.'
stages.0.objectives.0.text: Relay działa z limitem 96Mi i przewyższa readiness.
hints.0.text: Sprawdź osobno ostatni stan zakończenia i awarię readiness.
hints.1.text: Stare polecenie zwiększa pamięć bez ograniczeń; Sam większy limit nie jest naprawą.
hints.2.text: Uruchom normalny HTTP worker, ustaw 96Mi i wskaż readiness na /on 8080.
debrief: worker nie mógł uruchomić się, a jego probe użył niewłaściwego portu. Naprawiłeś uruchomienie,
  przypisałeś 96Mi i zweryfikowałeś zdrowy HTTP rollout.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
