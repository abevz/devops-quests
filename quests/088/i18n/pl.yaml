title: Pamięć i uruchamianie
brief: |-
  Dostarczone aplikacje nie kończą użytecznego startu w budżecie pamięci. Odzyskaj pierwotne workloady i przekaż aktualny zestaw danych przez ich fazy startu.

  Pracuj na stacji w `~/quest` z `startup-contract.json`; sprawdź dostarczone źródło i workloady w namespace Kubernetes.

  **Wymagania:**
  - Zachowaj dane i tożsamość źródłowego ConfigMap, tożsamości workloadów i Service oraz dostarczone niezmienne obrazy aplikacji.
  - Worker producenta zachowuje wymagany limit; każdy Pod aplikacji i faza startu pozostają w budżecie określonym w kontrakcie.
  - Każdy workload kończy rollout. Zachowaj istniejący inicjalizator rozgrzewania i jego poprawne zakończenie przed głównym kontenerem worker.
  - Każda rola przechowuje rzeczywiście zaalokowane dane w pamięci o aktualnym rozmiarze i sumie kontrolnej. Jej Service ClusterIP z selektorem publikuje odpowiednie metadane przez zadeklarowany interfejs.

  Testy obserwują aktualne budżety, właścicieli, zakończoną inicjalizację, zaalokowane dane i rekordy HTTP. Cache można odbudować z zachowanego źródła; historia poleceń, brak restartów i nieprzerwana dostępność nie są weryfikowane.
stages.0.brief: Wszystkie role kończą start i publikują aktualne zaalokowane dane RAM; istniejący inicjalizator
  kończy się poprawnie.
stages.0.objectives.0.text: Pierwotne zasoby, dane i obrazy są zachowane; limit producenta i wszystkie fazy startu
  pozostają w dostarczonym budżecie pamięci.
stages.0.objectives.1.text: Wszystkie role kończą start i publikują aktualne zaalokowane dane RAM; istniejący inicjalizator
  kończy się poprawnie.
hints.0.text: Alokacja pamięci, start procesu, zakończenie init i readiness to różne granice. Restart kontenera
  i czas życia wolumenu Pod w pamięci mogą się różnić.
hints.1.text: |-
  Porównaj `startup-contract.json`, definicje workloadów i źródła, limity Podów, `kubectl describe pod <pod>` i `kubectl logs <pod> -c <container> --previous`. Sprawdź zakończenia kontenerów init i głównych oraz bieżące wejścia danych.

  Sprawdź zestaw danych czytany przez każdą fazę startu oraz jej limit pamięci. Porównaj powód zakończenia ze zdarzeniami workloadu i dostarczonym limitem.
hints.2.text: |-
  Sprawdź rollout, poprawne zakończenie init, `stat -f -c %T /cache`, rozmiar, przydzielone bloki, sumę kontrolną i wszystkie interfejsy HTTP metadanych. Oczekuj pierwotnych tożsamości, rzeczywiście zaalokowanych danych tmpfs zgodnych z kontraktem i aktualnych metadanych.

  Dla każdego gotowego Poda tego Deploymentu system plików musi być `tmpfs`, rozmiar i SHA-256 pliku muszą odpowiadać potwierdzeniu, a liczba przydzielonych bloków razy `512` musi pokrywać rozmiar pliku. Inicjalizator `stager` musi zakończyć się kodem `0`. Porównaj wszystkie rekordy HTTP z dostarczoną publikacją.

  ```sh
  (
  set -euo pipefail
  expected_size=$(jq -er .publication.bytes startup-identities.json)
  expected_hash=$(jq -er .publication.sha256 startup-identities.json)
  jq '{identities,image,publication}' startup-identities.json
  kubectl get deployments,replicasets,pods,services -o yaml
  for name in relay stager reader; do
    kubectl rollout status "deployment/$name" --timeout=10s
    pods=$(kubectl get deployments,replicasets,pods -o json | jq -r --arg name "$name" '
      def owned($kind; $uids): any(.metadata.ownerReferences[]?;
        .controller == true and .kind == $kind and (.uid as $uid | $uids | index($uid) != null));
      .items as $items | ($items[] | select(.kind == "Deployment" and .metadata.name == $name)) as $dep
      | [$items[] | select(.kind == "ReplicaSet" and owned("Deployment"; [$dep.metadata.uid])) | .metadata.uid] as $rs
      | $items[] | select(.kind == "Pod" and owned("ReplicaSet"; $rs) and .metadata.deletionTimestamp == null
        and any(.status.conditions[]?; .type == "Ready" and .status == "True")) | .metadata.name')
    if [ -z "$pods" ]; then
      printf '%s: no ready owned Pod\n' "$name" >&2
      exit 1
    fi
    while IFS= read -r pod; do
      if [ "$name" = stager ]; then
        kubectl get pod "$pod" -o json |
          jq -e 'any(.status.initContainerStatuses[]?; .name=="warmer" and .state.terminated.exitCode==0)' >/dev/null
      fi
      test "$(kubectl exec "$pod" -c worker -- stat -f -c %T /cache)" = tmpfs
      file_stats=$(kubectl exec "$pod" -c worker -- stat -c '%s %b' /cache/payload)
      read -r size blocks <<< "$file_stats"
      test "$size" -eq "$expected_size"
      test "$((blocks * 512))" -ge "$size"
      payload=$(kubectl exec "$pod" -c worker -- sha256sum /cache/payload)
      test "${payload%% *}" = "$expected_hash"
      kubectl exec "$pod" -c worker -- wget -qO- -T 3 "http://$name:8080/record.json" |
        jq -e --slurpfile expected startup-identities.json '
          $expected[0].publication as $wanted |
          .cache_id==$wanted.cache_id and .bytes==$wanted.bytes and .sha256==$wanted.sha256' >/dev/null
      printf '%s/%s: allocated payload and publication match\n' "$name" "$pod"
    done <<< "$pods"
  done
  )
  ```
debrief: 'Różne awarie pamięci wymagały różnych poprawek: nieograniczona praca, pojemność fazy init i wejście rezydentne
  niemieszczące się w budżecie. Aktualne dane przechodzą teraz przez wszystkie fazy przy zachowaniu pierwotnych
  zasobów.'
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
diagnostics.probe_0_0: Źródło może nadal mieć dostarczony limit 16Mi zamiast wymaganego odpowiednika 96Mi; wczesna kontrola quantity zatrzymuje się przed nazwanymi wynikami budget. Błędy startu helpers, zamrożonych danych i nieoczekiwanego JSON też dają fallback. [Przyczyna i kontrola](guides#guide=kubernetes-9&section=startup-ram-producer-limit-and-early-inputs)
diagnostics.startup_identity: Deployment, Service lub źródłowy ConfigMap mogły zostać odtworzone przy naprawie startu; zachowaj siedem zamrożonych UID zasobów. Błąd odczytu zasobu też daje marker, zmiana tożsamości Pod jest dozwolona. [Przyczyna i kontrola](guides#guide=kubernetes-9&section=startup-ram-original-resources)
diagnostics.startup_budget: Template lub wybrany gotowy Pod może przekroczyć limit 96Mi lub pomijać wymagany memory limit. Uwzględnij szczyty zwykłych initializer i stale działające restartable initializer; dopuszczalny jest też ograniczony Pod memory limit. Podnoszenie limitów ponad contract nie naprawia warunku. [Przyczyna i kontrola](guides#guide=kubernetes-9&section=startup-ram-phase-memory-envelope)
diagnostics.startup_image: Nazwany kontener aplikacji mógł otrzymać inny image przy naprawie programu lub limitów; zachowaj dostarczony niezmienny image. Dopuszczalna jest dokładna referencja lub referencja z tym samym zamrożonym digest. [Przyczyna i kontrola](guides#guide=kubernetes-9&section=startup-ram-immutable-worker-image)
diagnostics.startup_initializer: Wymagany warmer może brakować, być podwójny, używać innego image lub stać się restartable, albo zakończenie nie jest udane; zachowaj jeden zwykły initializer z dostarczonym image i kodem wyjścia 0 przed startem aplikacji. [Przyczyna i kontrola](guides#guide=kubernetes-9&section=startup-ram-ordinary-warmup-contract)
diagnostics.startup_source: Wartości źródła mogły zostać zmniejszone lub zastąpione dla łatwiejszego startu; zachowaj dostarczone CACHE_MIB i CACHE_ID podczas naprawy odbiorców. Dodatkowe klucze data ConfigMap są dozwolone, błędy API źródła dzielą marker. [Przyczyna i kontrola](guides#guide=kubernetes-9&section=startup-ram-current-source-data)
diagnostics.startup_service: Service może mieć błędny type, selector niepasujący do template aplikacji lub brakujący/podwójny port TCP; zachowaj type ClusterIP, niepusty pasujący selector i jeden port 8080. Błędy odczytu zasobu też dają marker. [Przyczyna i kontrola](guides#guide=kubernetes-9&section=startup-ram-declared-service-interface)
diagnostics.startup_payload: Dostarczone źródło bez końca zwiększa pamięć i sprawdza błędny port; rollout może zawieść przed obserwacją danych ról. Zbuduj bieżący RAM payload i interfejs HTTP w wymaganym limicie; późniejsze błędy obserwacji Pod lub ReplicaSet też dają marker. [Przyczyna i kontrola](guides#guide=kubernetes-9&section=startup-ram-producer-startup-gate)
diagnostics.probe_0_1: Zamrożone fakty, helpers, liczbowe metadata pliku lub JSON mogą być nieczytelne albo wadliwe przed nazwanym wynikiem; sprawdź te wejścia osobno. Zwykłe błędy rollout, poleceń payload i publication zachowują swoje markery; sam fallback nie dowodzi błędu image ani pamięci. [Przyczyna i kontrola](guides#guide=kubernetes-9&section=startup-ram-data-observer-fallback)
diagnostics.startup_payload_relay: 'relay: Źródło może nie mieć działającego RAM mount lub w pełni zaalokowanego bieżącego payload mimo rollout; sprawdź tmpfs, rozmiar, zaalokowane bloki i checksum w bieżących gotowych należących Pod. [Przyczyna i kontrola](guides#guide=kubernetes-9&section=startup-ram-relay-allocated-payload)'
diagnostics.startup_publication_relay: 'relay: Service może publikować stare metadata cache albo żądanie zawodzi; porównaj bieżące cache ID, rozmiar i checksum z zamrożoną publikacją. Dodatkowe pola JSON są dozwolone, sama zdrowa odpowiedź HTTP nie dowodzi zaalokowanego dataset. [Przyczyna i kontrola](guides#guide=kubernetes-9&section=startup-ram-relay-current-metadata)'
diagnostics.startup_payload_stager: 'stager: Dostarczony initializer ma tylko 32Mi na dane 80Mi; napraw alokację w granicach 96Mi, zachowując zwykłą fazę warmup. Błąd rollout roli daje ten marker przed kontrolą init status; gotowy Pod nadal ma zawierać pełny zaalokowany payload. [Przyczyna i kontrola](guides#guide=kubernetes-9&section=startup-ram-stager-allocated-payload)'
diagnostics.startup_publication_stager: 'stager: Service może publikować stare metadata cache albo żądanie zawodzi; porównaj bieżące cache ID, rozmiar i checksum z zamrożoną publikacją. Dodatkowe pola JSON są dozwolone, sama zdrowa odpowiedź HTTP nie dowodzi zaalokowanego dataset. [Przyczyna i kontrola](guides#guide=kubernetes-9&section=startup-ram-stager-current-metadata)'
diagnostics.startup_payload_reader: 'reader: Dostarczone wejście żąda 112Mi przy granicy 96Mi zamiast bieżących danych 80Mi; użyj zachowanych wartości źródła i sprawdź rollout oraz faktycznie zaalokowany plik RAM, bez zmniejszania payload ani pliku sparse. [Przyczyna i kontrola](guides#guide=kubernetes-9&section=startup-ram-reader-allocated-payload)'
diagnostics.startup_publication_reader: 'reader: Service może publikować stare metadata cache albo żądanie zawodzi; porównaj bieżące cache ID, rozmiar i checksum z zamrożoną publikacją. Dodatkowe pola JSON są dozwolone, sama zdrowa odpowiedź HTTP nie dowodzi zaalokowanego dataset. [Przyczyna i kontrola](guides#guide=kubernetes-9&section=startup-ram-reader-current-metadata)'
