title: Pamięć i uruchamianie
brief: |-
  Dostarczone aplikacje nie kończą użytecznego startu w budżecie pamięci. Odzyskaj pierwotne workloady i przekaż aktualny zestaw danych przez ich fazy startu.

  Pracuj na stacji w `~/quest` z `startup-contract.json`; sprawdź dostarczone źródło i workloady w namespace Kubernetes.

  **Wymagania:**
  - Zachowaj dane i tożsamość źródłowego ConfigMap, tożsamości workloadów i Service oraz dostarczone niezmienne obrazy aplikacji.
  - Worker producenta zachowuje wymagany limit; każdy Pod aplikacji i faza startu pozostają w budżecie określonym w kontrakcie.
  - Każdy workload kończy rollout. Zachowaj istniejący inicjalizator rozgrzewania i jego poprawne zakończenie przed głównym kontenerem worker.
  - Każda rola przechowuje rzeczywiście zaalokowane dane w pamięci o aktualnym rozmiarze i sumie kontrolnej. Jej Service ClusterIP z selektorem publikuje odpowiednie metadane przez zadeklarowany interfejs.

  Testy obserwują aktualne budżety, właścicieli, zakończoną inicjalizację, zaalokowane dane i rekordy HTTP. Cache można odbudować z zachowanego źródła; historia poleceń, brak restartów i nieprzerwana dostępność nie są weryfikowane.
stages.0.brief: Wszystkie role kończą start i publikują aktualne zaalokowane dane RAM; istniejący inicjalizator
  kończy się poprawnie.
stages.0.objectives.0.text: Pierwotne zasoby, dane i obrazy są zachowane; limit producenta i wszystkie fazy startu
  pozostają w dostarczonym budżecie pamięci.
stages.0.objectives.1.text: Wszystkie role kończą start i publikują aktualne zaalokowane dane RAM; istniejący inicjalizator
  kończy się poprawnie.
hints.0.text: Alokacja pamięci, start procesu, zakończenie init i readiness to różne granice. Restart kontenera
  i czas życia wolumenu Pod w pamięci mogą się różnić.
hints.1.text: Porównaj `startup-contract.json`, definicje workloadów i źródła, limity Podów, `kubectl describe pod
  <pod>` i `kubectl logs <pod> -c <container> --previous`. Sprawdź zakończenia kontenerów init i głównych oraz bieżące
  wejścia danych.
hints.2.text: Zbuduj ograniczony start dla aktualnych danych i przypisz wystarczające budżety faz bez przekraczania
  maksimum. Sprawdź rollout, poprawne zakończenie init, `stat -f -c %T /cache`, rozmiar, przydzielone bloki, sumę
  kontrolną i wszystkie interfejsy HTTP metadanych. Oczekuj pierwotnych tożsamości, rzeczywiście zaalokowanych danych
  tmpfs zgodnych z kontraktem i aktualnych metadanych.
debrief: 'Różne awarie pamięci wymagały różnych poprawek: nieograniczona praca, pojemność fazy init i wejście rezydentne
  niemieszczące się w budżecie. Aktualne dane przechodzą teraz przez wszystkie fazy przy zachowaniu pierwotnych
  zasobów.'
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
