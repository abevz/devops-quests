title: Pamięć i uruchamianie
brief: 'Obciążenie HTTP nie utrzymuje gotowości w swoim budżecie pamięci. Przywróć stabilny rollout z wymaganym
  limitem pamięci.


  Pracuj w `~/quest` na workstation. Dostarczone pliki wejściowe: `deployment.yaml`.


  **Wymagania:**

  - Kontener relay ma limit pamięci `96Mi`.

  - Deployment `relay` kończy rollout.

  '
stages.0.brief: Obciążenie ma zachować gotowość w wymaganym limicie pamięci.
stages.0.objectives.0.text: Kontener relay ma limit pamięci `96Mi`.
stages.0.objectives.1.text: Deployment `relay` kończy rollout.
hints.0.text: Trzeba spełnić zarówno budżet zasobów, jak i warunki poprawnego startu aplikacji.
hints.1.text: 'Sprawdź osobno awarię nowego polecenia, ostatni stan zakończenia i błąd readiness.


  Stare polecenie zwiększa pamięć bez ograniczeń; Sam większy limit nie jest naprawą.


  Sprawdź dostarczone definicje, bieżące zasoby i zdarzenia.


  ```sh

  cat deployment.yaml

  kubectl describe deployment relay

  kubectl get pods -l app=relay -o yaml

  ```'
hints.2.text: 'Uruchom normalny HTTP worker, ustaw 96Mi i wskaż readiness na /on 8080.


  Sprawdź obserwowany wynik:


  ```sh

  kubectl rollout status deployment/relay --timeout=3s

  kubectl get deployment relay -o jsonpath=''{.spec.template.spec.containers[?(@.name=="worker")].resources.limits.memory}''

  ```


  Oczekuj ukończonego rolloutu i limitu pamięci 96Mi.


  Wyświetlona ilość musi odpowiadać `96Mi`; jej zapis może być inny.'
debrief: worker nie mógł uruchomić się, a jego probe użył niewłaściwego portu. Naprawiłeś uruchomienie, przypisałeś
  96Mi i zweryfikowałeś zdrowy HTTP rollout.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
diagnostics.probe_0_0: 'Bieżące dane nie pozwalają potwierdzić tego celu: Kontener relay ma limit pamięci `96Mi`.'
