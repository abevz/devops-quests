title: Pamięć i uruchamianie
brief: |
  Obciążenie HTTP nie utrzymuje gotowości w swoim budżecie pamięci. Przywróć stabilny rollout z wymaganym limitem pamięci.

  Pracuj w `~/quest` na workstation. Dostarczone pliki wejściowe: `deployment.yaml`.

  **Wymagania:**
  - Deployment `relay` kończy rollout.
  - W Deployment `relay` kontener `worker` ma następujący limit pamięci:
    - `96Mi`

  **Sprawdź samodzielnie przed Check & finish:**
  Wykonaj te polecenia obserwacyjne w `~/quest` na workstation.
  - `kubectl get deployment relay -o yaml` — Limit pamięci kontenera aplikacji wynosi `96Mi`.
  - `kubectl rollout status deployment/relay --timeout=3s` — Rollout obciążenia jest zakończony.
stages.0.brief: |
  Obciążenie ma zachować gotowość w wymaganym limicie pamięci.
stages.0.objectives.0.text: Kontener relay ma limit pamięci `96Mi`.
stages.0.objectives.1.text: Deployment `relay` kończy rollout.
hints.0.text: |
  Sprawdź osobno awarię nowego polecenia, ostatni stan zakończenia i błąd readiness.
hints.1.text: Stare polecenie zwiększa pamięć bez ograniczeń; Sam większy limit nie jest naprawą.
hints.2.text: Uruchom normalny HTTP worker, ustaw 96Mi i wskaż readiness na /on 8080.
debrief: worker nie mógł uruchomić się, a jego probe użył niewłaściwego portu. Naprawiłeś uruchomienie,
  przypisałeś 96Mi i zweryfikowałeś zdrowy HTTP rollout.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
