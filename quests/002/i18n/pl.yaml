title: Grupy zasobów
brief: "Jeden z hostów nie otrzymał komunikatu trasy.\n\nPracuj na workstation w `~/quest` z plikami `inventory.ini`,\
  \ `ansible.cfg`, `rollout.yml`.\n\n**Wymagania:**\n- Plik na każdym zarządzanym hoście (`app1`, `app2`, `app3`):\n\
  \  - Ścieżka: `/srv/site/message`.\n  - Treść: `north-ready`.\n- Tryb dostępu: `0644`.\n"
stages.0.brief: Każdy zarządzany host musi otrzymać wymagany komunikat.
stages.0.objectives.0.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/message`
  zawiera `north-ready`.
stages.0.objectives.1.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/message`
  ma tryb `0644`.
hints.0.text: Przynależność w inventory i grupa docelowa playa muszą opisywać tę samą flotę.
hints.1.text: |-
  Porównaj wzorzec hostów w `rollout.yml` z grupami w `inventory.ini`. Ustaw grupę `fleet` jako cel play i uruchom `ansible-playbook rollout.yml`.

  ```sh
  ansible-inventory -i inventory.ini --graph
  cat rollout.yml
  ansible fleet -i inventory.ini --list-hosts
  ```
hints.2.text: |-
  Sprawdź komunikat i uprawnienia na wszystkich trzech zarządzanych hostach.

  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/message'` — pokazuje north-ready z każdego zarządzanego hosta.

  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/site/message'` — pokazuje uprawnienia `-rw-r--r--` wszystkich trzech zdalnych plików.
debrief: Play Ansible wybrał grupę nieobecną w inventory. Dopasowano grupę i sprawdzono trzy zarządzane pliki.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem wynik na każdym zarządzanym hoście.
diagnostics.content_1: |-
  Zadanie kopiowania mogło pominąć app1, jeśli wybrana w play grupa inventory nie obejmuje tego hosta. [Przewodnik](guides#guide=ansible-2&section=fleet-delivery-targets)
