title: Grupy zasobów
brief: 'Dołączyłeś do operacji SignalRail. Nowy host relay nie otrzymał pliku powitalnego. Pracuj w ~/quest.
  Wszystkie zmiany przechowuj w tej komorze szkoleniowej.


  Zacznij od rollout.yml.


  Wejścia w `~/quest`: `inventory.ini`, `ansible.cfg`, `rollout.yml`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Wszystkie zmiany muszą pozostać w tej zatoce.


  Początkowe kryteria sukcesu: wszystkie trzy zarządzane hosty mają /srv/site/message zawierający north-ready,
  tryb 0644.'
stages.0.brief: 'Gra dotyczy grupy relays, ale inwentarz definiuje fleet. Dostarcz north-ready do wszystkich
  trzech hostów.


  Kryteria sukcesu: Wszystkie trzy zarządzane hosty mają /srv/site/message zawierający north-ready, tryb
  0644.'
stages.0.objectives.0.text: Wszystkie trzy zarządzane hosty mają /srv/site/message zawierający north-ready,
  tryb 0644.
hints.0.text: Wyświetl listę grup zapasów za pomocą ansible-inventory --graph.
hints.1.text: Porównaj hosts w rollout.yml z grupą fleet.
hints.2.text: Wybierz fleet, uruchom playbook, a następnie sprawdź wszystkie trzy zdalne pliki.
debrief: Spektakl wyłonił grupę nieobecną w inwentarzu. Dopasowałeś grupę i sprawdziłeś wszystkie trzy
  zarządzane pliki.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem wynik na każdym zarządzanym hoście.
