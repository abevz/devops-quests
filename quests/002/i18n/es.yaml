title: Grupos de inventario
brief: 'Te uniste a las operaciones de SignalRail. Un nuevo host relay perdió el archivo de bienvenida. Trabajar en ~/quest.
  Mantenga todos los cambios dentro de esta bahía de entrenamiento.


  Comience con rollout.yml.


  Entradas en `~/quest`: `inventory.ini`, `ansible.cfg`, `rollout.yml`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente los archivos suministrados, las imágenes precargadas y los
  servicios privados. Todos los cambios deben permanecer dentro de esta bahía.


  Criterios de éxito iniciales: los tres hosts administrados tienen /srv/site/message que contiene north-ready, modo 0644.'
stages.0.brief: 'El play de Ansible selecciona el grupo relays, pero el inventario define fleet. Entregue north-ready a los
  tres hosts.


  Criterios de éxito: los tres hosts administrados tienen /srv/site/message que contiene north-ready, modo 0644.


  El inventory agrupa los tres hosts SSH; `rollout.yml` contiene el destino de copia, contenido y modo. Tras corregir el grupo
  destino, ejecuta `ansible-playbook rollout.yml`. Inspecciona el contenido remoto con `ansible fleet -m command -a "cat /srv/site/message"`
  y el modo con `ansible fleet -m command -a "stat -c %a /srv/site/message"`.'
stages.0.objectives.0.text: Los tres hosts administrados tienen /srv/site/message que contiene north-ready, modo 0644.
hints.0.text: Enumere los grupos de inventario con ansible-inventory --graph.
hints.1.text: Compare hosts en rollout.yml con el grupo fleet.
hints.2.text: Apunte a fleet, ejecute playbook y luego inspect los tres archivos remotos.
debrief: El play de Ansible seleccionó un grupo ausente del inventory. Ajustaste el grupo y comprobaste los tres archivos
  gestionados.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el resultado en cada host administrado.
diagnostics.content_1: En el host app1 /srv/site/message debe ser igual a north-ready.
diagnostics.content_2: En el host app2 /srv/site/message debe ser igual a north-ready.
diagnostics.content_3: En el host app3 /srv/site/message debe ser igual a north-ready.
diagnostics.mode_1: En el host app1 el modo de /srv/site/message debe ser 644.
diagnostics.mode_2: En el host app2 el modo de /srv/site/message debe ser 644.
diagnostics.mode_3: En el host app3 el modo de /srv/site/message debe ser 644.
