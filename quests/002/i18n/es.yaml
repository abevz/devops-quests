title: Grupos de inventario
brief: 'Te uniste a las operaciones de SignalRail. Un nuevo host relay perdió el archivo de bienvenida.
  Trabajar en ~/quest. Mantenga todos los cambios dentro de esta bahía de entrenamiento.


  Comience con rollout.yml.


  Entradas en `~/quest`: `inventory.ini`, `ansible.cfg`, `rollout.yml`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente los archivos suministrados, las imágenes
  precargadas y los servicios privados. Todos los cambios deben permanecer dentro de esta bahía.


  Criterios de éxito iniciales: los tres hosts administrados tienen /srv/site/message que contiene north-ready,
  modo 0644.'
stages.0.brief: 'La obra está dirigida al grupo relays, pero el inventario define fleet. Entregue north-ready
  a los tres hosts.


  Criterios de éxito: los tres hosts administrados tienen /srv/site/message que contiene north-ready,
  modo 0644.'
stages.0.objectives.0.text: Los tres hosts administrados tienen /srv/site/message que contiene north-ready,
  modo 0644.
hints.0.text: Enumere los grupos de inventario con ansible-inventory --graph.
hints.1.text: Compare hosts en rollout.yml con el grupo fleet.
hints.2.text: Apunte a fleet, ejecute playbook y luego inspect los tres archivos remotos.
debrief: La obra seleccionó a un grupo que estaba ausente del inventario. Coincidió con el grupo y verificó
  los tres archivos administrados.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el resultado en cada host administrado.
