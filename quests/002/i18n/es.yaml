title: Grupos de inventario
brief: "Un miembro de la flota no ha recibido el mensaje de ruta.\n\nTrabaja en la workstation en `~/quest`\
  \ con `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n\n**Requisitos:**\n- Archivo en cada host administrado\
  \ (`app1`, `app2`, `app3`):\n  - Ruta: `/srv/site/message`.\n  - Contenido: `north-ready`.\n- Modo de acceso:\
  \ `0644`.\n"
stages.0.brief: Cada host administrado debe recibir el mensaje requerido.
stages.0.objectives.0.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` contiene
  `north-ready`.
stages.0.objectives.1.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` tiene el
  modo `0644`.
hints.0.text: La pertenencia al inventario y el grupo objetivo de un play deben describir la misma flota.
hints.1.text: |-
  Compara el patrón de hosts de `rollout.yml` con los grupos de `inventory.ini`. Selecciona `fleet` como destino del play y ejecuta `ansible-playbook rollout.yml`.

  ```sh
  ansible-inventory -i inventory.ini --graph
  cat rollout.yml
  ansible fleet -i inventory.ini --list-hosts
  ```
hints.2.text: |-
  Comprueba el mensaje y sus permisos en los tres hosts gestionados.

  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/message'` — muestra north-ready de cada host administrado.

  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/site/message'` — muestra permisos `-rw-r--r--` en los tres archivos remotos.
debrief: El play de Ansible seleccionó un grupo ausente del inventory. Ajustaste el grupo y comprobaste los
  tres archivos gestionados.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el resultado en cada host administrado.
diagnostics.content_1: |-
  La copia pudo omitir app1 si el play seleccionó un grupo del inventario que no incluía ese host. [Guía](guides#guide=ansible-2&section=fleet-delivery-targets)
diagnostics.content_2: |-
  La copia pudo omitir app2 si el play seleccionó un grupo del inventario que no incluía ese host. [Guía](guides#guide=ansible-2&section=fleet-delivery-targets)
diagnostics.content_3: |-
  La copia pudo omitir app3 si el play seleccionó un grupo del inventario que no incluía ese host. [Guía](guides#guide=ansible-2&section=fleet-delivery-targets)
diagnostics.mode_1: |-
  El archivo en app1 pudo conservar su modo anterior si la tarea de copia omitió ese host o usó otro modo. [Guía](guides#guide=ansible-2&section=fleet-delivery-targets)
diagnostics.mode_2: |-
  El archivo en app2 pudo conservar su modo anterior si la tarea de copia omitió ese host o usó otro modo. [Guía](guides#guide=ansible-2&section=fleet-delivery-targets)
diagnostics.mode_3: |-
  El archivo en app3 pudo conservar su modo anterior si la tarea de copia omitió ese host o usó otro modo. [Guía](guides#guide=ansible-2&section=fleet-delivery-targets)
