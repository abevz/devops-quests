title: Grupos de inventario
brief: |-
  Un miembro de la flota no ha recibido el mensaje de ruta.

  Trabaja en la workstation en `~/quest` con `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Requisitos:**
  - Archivo en cada host administrado (`app1`, `app2`, `app3`):
    - Ruta: `/srv/site/message`.
    - Contenido: `north-ready`.
    - Modo de acceso: `0644`.

  **Verifica antes de Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/message'` — muestra north-ready de cada host administrado.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/site/message'` — muestra permisos `-rw-r--r--` en los tres archivos remotos.
stages.0.brief: Cada host administrado debe recibir el mensaje requerido.
stages.0.objectives.0.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` contiene `north-ready`.
stages.0.objectives.1.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` tiene el modo
  `0644`.
hints.0.text: Enumere los grupos de inventario con ansible-inventory --graph.
hints.1.text: Compare hosts en rollout.yml con el grupo fleet. El play suministrado apunta a relays, pero el inventario
  define fleet.
hints.2.text: Apunte a fleet, ejecute playbook y luego inspect los tres archivos remotos. Ejecuta ansible-playbook
  rollout.yml; las consultas remotas cat y stat -c %a permiten inspeccionar /srv/site/message.
debrief: El play de Ansible seleccionó un grupo ausente del inventory. Ajustaste el grupo y comprobaste los tres
  archivos gestionados.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el resultado en cada host administrado.
diagnostics.content_1: En el host app1 /srv/site/message debe ser igual a north-ready.
diagnostics.content_2: En el host app2 /srv/site/message debe ser igual a north-ready.
diagnostics.content_3: En el host app3 /srv/site/message debe ser igual a north-ready.
diagnostics.mode_1: En el host app1 el modo de /srv/site/message debe ser 644.
diagnostics.mode_2: En el host app2 el modo de /srv/site/message debe ser 644.
diagnostics.mode_3: En el host app3 el modo de /srv/site/message debe ser 644.
