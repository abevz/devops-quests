title: Группы инвентаря
brief: "Один из узлов не получил сообщение маршрута.\n\nРаботайте на workstation в `~/quest` с файлами `inventory.ini`,\
  \ `ansible.cfg`, `rollout.yml`.\n\n**Требования:**\n- Файл на каждом управляемом хосте (`app1`, `app2`, `app3`):\n\
  \  - Путь: `/srv/site/message`.\n  - Содержимое: `north-ready`.\n- Режим доступа: `0644`.\n"
stages.0.brief: Каждый управляемый хост должен получить нужное сообщение.
stages.0.objectives.0.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/message` содержит
  `north-ready`.
stages.0.objectives.1.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/message` имеет
  режим `0644`.
hints.0.text: Состав inventory и целевая группа play должны описывать один и тот же парк.
hints.1.text: 'Сравните hosts в rollout.yml с группой fleet. Выданный play нацелен на relays, а inventory определяет
  fleet.


  Изучите поставленные входные данные и область выполнения:


  ```sh

  ansible-inventory -i inventory.ini --graph

  cat rollout.yml

  ```'
hints.2.text: 'Укажите fleet, запустите playbook и проверьте три удалённых файла. Запустите ansible-playbook
  rollout.yml; удалённые cat и stat -c %a позволяют проверить /srv/site/message.


  Проверьте наблюдаемый результат:


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''runuser -u nobody -- cat /srv/site/message''`
  — показывает north-ready с каждого управляемого хоста.


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''ls -l /srv/site/message''` — показывает
  права `-rw-r--r--` у всех трёх удалённых файлов.'
debrief: Play Ansible выбрал группу, отсутствующую в inventory. Вы исправили группу и проверили три управляемых
  файла.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я проверил результат на каждом управляемом хосте.
diagnostics.content_1: На хосте app1 /srv/site/message должен совпадать с north-ready.
diagnostics.content_2: На хосте app2 /srv/site/message должен совпадать с north-ready.
diagnostics.content_3: На хосте app3 /srv/site/message должен совпадать с north-ready.
diagnostics.mode_1: На хосте app1 права /srv/site/message должны быть 644.
diagnostics.mode_2: На хосте app2 права /srv/site/message должны быть 644.
diagnostics.mode_3: На хосте app3 права /srv/site/message должны быть 644.
