title: Группы инвентаря
brief: 'Вы в команде эксплуатации SignalRail. Новый узел не получил приветственный файл. Работайте в ~/quest. Все изменения
  — только в этой песочнице.


  Начните с rollout.yml.


  Входные файлы в `~/quest`: `inventory.ini`, `ansible.cfg`, `rollout.yml`.


  В песочнице нет интернета и внешнего DNS. Используйте только выданные файлы, предварительно загруженные образы и приватные
  сервисы. Все изменения — только в этой песочнице.


  Цели первого этапа: На всех трёх узлах /srv/site/message содержит north-ready и имеет режим 0644.'
stages.0.brief: 'Play Ansible использует relays, инвентарь — fleet. Доставьте north-ready на три хоста.


  Результат проверки: На всех трёх узлах /srv/site/message содержит north-ready и имеет режим 0644.


  Inventory объединяет три SSH-узла; `rollout.yml` содержит путь копирования, содержимое и режим. Исправив целевую группу,
  выполните `ansible-playbook rollout.yml`. Проверьте удалённое содержимое через `ansible fleet -m command -a "cat /srv/site/message"`,
  а режим через `ansible fleet -m command -a "stat -c %a /srv/site/message"`.'
stages.0.objectives.0.text: На всех трёх узлах /srv/site/message содержит north-ready и имеет режим 0644.
hints.0.text: Посмотрите группы через ansible-inventory --graph.
hints.1.text: Сравните hosts в rollout.yml с группой fleet.
hints.2.text: Укажите fleet, запустите playbook и проверьте три удалённых файла.
debrief: Play Ansible выбрал группу, отсутствующую в inventory. Вы исправили группу и проверили три управляемых файла.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я проверил результат на каждом управляемом хосте.
