stages.0.objectives.3.text: На app2 файл /srv/site/message имеет режим 0644.
stages.0.objectives.4.text: На app3 файл /srv/site/message содержит north-ready.
stages.0.objectives.5.text: На app3 файл /srv/site/message имеет режим 0644.
hints.0.text: Посмотрите группы через ansible-inventory --graph.
hints.1.text: Сравните hosts в rollout.yml с группой fleet. Выданный play нацелен на relays, а inventory определяет
  fleet.
hints.2.text: Укажите fleet, запустите playbook и проверьте три удалённых файла. Запустите ansible-playbook rollout.yml;
  удалённые cat и stat -c %a позволяют проверить /srv/site/message.
debrief: Play Ansible выбрал группу, отсутствующую в inventory. Вы исправили группу и проверили три управляемых
  файла.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я проверил результат на каждом управляемом хосте.
