title: Inventargruppen
brief: 'Sie sind dem Betrieb SignalRail beigetreten. Ein neuer relay-Host hat die Willkommensdatei verpasst.
  Arbeiten Sie in ~/quest.. Bewahren Sie alle Änderungen in diesem Schulungsbereich auf.


  Beginnen Sie mit rollout.yml.


  Eingaben in `~/quest`: `inventory.ini`, `ansible.cfg`, `rollout.yml`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur die bereitgestellten Dateien,
  vorinstallierten Bilder und privaten Dienste. Alle Änderungen müssen innerhalb dieser Bucht bleiben.


  Anfängliche Erfolgskriterien: Alle drei verwalteten Hosts verfügen über /srv/site/message mit north-ready,
  Modus 0644.'
stages.0.brief: 'Das Spiel zielt auf die Gruppe relays ab, aber das Inventar definiert fleet. Liefern
  Sie north-ready an alle drei Hosts.


  Erfolgskriterien: Alle drei verwalteten Hosts haben /srv/site/message mit north-ready, Modus 0644.'
stages.0.objectives.0.text: Alle drei verwalteten Hosts haben /srv/site/message mit north-ready, Modus
  0644.
hints.0.text: Listen Sie Inventargruppen mit ansible-inventory --graph auf.
hints.1.text: Vergleichen Sie hosts in rollout.yml mit der fleet-Gruppe.
hints.2.text: Ziel fleet, Führen Sie playbook und dann alle drei Remote-Dateien inspect aus.
debrief: Das Stück wählte eine Gruppe aus, die im Inventar fehlte. Sie haben die Gruppe zugeordnet und
  alle drei verwalteten Dateien überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe das Ergebnis auf jedem verwalteten Host überprüft.
