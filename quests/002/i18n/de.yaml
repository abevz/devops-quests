title: Inventargruppen
brief: "Ein Flottenmitglied hat die Routennachricht nicht erhalten.\n\nArbeiten Sie auf der Workstation in\
  \ `~/quest` mit `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n\n**Anforderungen:**\n- Datei auf jedem verwalteten\
  \ Host (`app1`, `app2`, `app3`):\n  - Pfad: `/srv/site/message`.\n  - Inhalt: `north-ready`.\n- Zugriffsmodus:\
  \ `0644`.\n"
stages.0.brief: Jeder verwaltete Host muss die erforderliche Nachricht erhalten.
stages.0.objectives.0.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/message`
  den Inhalt `north-ready`.
stages.0.objectives.1.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) hat `/srv/site/message` den
  Modus `0644`.
hints.0.text: Inventarzugehörigkeit und Zielgruppe eines Plays müssen dieselbe Flotte beschreiben.
hints.1.text: 'Vergleichen Sie die Hosts in rollout.yml mit der Gruppe fleet. Das bereitgestellte Play zielt
  auf relays, während das Inventar fleet definiert.


  Prüfen Sie die mitgelieferten Eingaben und den Ausführungsumfang:


  ```sh

  ansible-inventory -i inventory.ini --graph

  cat rollout.yml

  ```'
hints.2.text: 'Wählen Sie fleet als Ziel, führen Sie das Playbook aus und prüfen Sie anschließend die drei
  Remote-Dateien. Führen Sie ansible-playbook rollout.yml aus; entfernte cat- und stat -c %a-Abfragen prüfen
  /srv/site/message.


  Prüfen Sie das beobachtete Ergebnis:


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''runuser -u nobody -- cat /srv/site/message''`
  — zeigt north-ready von jedem verwalteten Host.


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''ls -l /srv/site/message''` — zeigt Berechtigungen
  `-rw-r--r--` für alle drei entfernten Dateien.'
debrief: Der Ansible-Play wählte eine Gruppe, die im Inventory fehlte. Du hast die Gruppe angepasst und alle
  drei verwalteten Dateien geprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe das Ergebnis auf jedem verwalteten Host überprüft.
