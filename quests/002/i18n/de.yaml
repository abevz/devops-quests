title: Inventargruppen
brief: 'Sie sind dem Betrieb SignalRail beigetreten. Ein neuer relay-Host hat die Willkommensdatei verpasst. Arbeiten Sie
  in ~/quest.. Bewahren Sie alle Änderungen in diesem Schulungsbereich auf.


  Beginnen Sie mit rollout.yml.


  Eingaben in `~/quest`: `inventory.ini`, `ansible.cfg`, `rollout.yml`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur die bereitgestellten Dateien, vorinstallierten
  Bilder und privaten Dienste. Alle Änderungen müssen innerhalb dieser Bucht bleiben.


  Anfängliche Erfolgskriterien: Alle drei verwalteten Hosts verfügen über /srv/site/message mit north-ready, Modus 0644.'
stages.0.brief: 'Der Ansible-Play zielt auf die Gruppe relays ab, aber das Inventar definiert fleet. Liefern Sie north-ready
  an alle drei Hosts.


  Erfolgskriterien: Alle drei verwalteten Hosts haben /srv/site/message mit north-ready, Modus 0644.


  Das Inventory gruppiert die drei SSH-Hosts; `rollout.yml` enthält Kopierziel, Inhalt und Modus. Führe nach der Korrektur
  der Zielgruppe `ansible-playbook rollout.yml` aus. Prüfe den entfernten Inhalt mit `ansible fleet -m command -a "cat /srv/site/message"`
  und den Modus mit `ansible fleet -m command -a "stat -c %a /srv/site/message"`.'
stages.0.objectives.0.text: Alle drei verwalteten Hosts haben /srv/site/message mit north-ready, Modus 0644.
hints.0.text: Listen Sie Inventargruppen mit ansible-inventory --graph auf.
hints.1.text: Vergleichen Sie hosts in rollout.yml mit der fleet-Gruppe.
hints.2.text: Ziel fleet, Führen Sie playbook und dann alle drei Remote-Dateien inspect aus.
debrief: Der Ansible-Play wählte eine Gruppe, die im Inventory fehlte. Du hast die Gruppe angepasst und alle drei verwalteten
  Dateien geprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe das Ergebnis auf jedem verwalteten Host überprüft.
diagnostics.content_1: Auf Host app1 muss /srv/site/message north-ready entsprechen.
diagnostics.content_2: Auf Host app2 muss /srv/site/message north-ready entsprechen.
diagnostics.content_3: Auf Host app3 muss /srv/site/message north-ready entsprechen.
diagnostics.mode_1: Auf Host app1 muss der Modus von /srv/site/message 644 sein.
diagnostics.mode_2: Auf Host app2 muss der Modus von /srv/site/message 644 sein.
