title: Inventory groups
brief: |-
  A fleet member has not received the route message.

  Work on the workstation in `~/quest` with `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Requirements:**
  - File on every managed host (`app1`, `app2`, `app3`):
    - Path: `/srv/site/message`.
    - Content: `north-ready`.
    - Access mode: `0644`.

  **Verify yourself before Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/message'` — shows north-ready from each managed host.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/site/message'` — shows permissions `-rw-r--r--` on all three remote files.
stages.0.brief: Every managed host must receive the required message.
stages.0.objectives.0.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` contains `north-ready`.
stages.0.objectives.1.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` has mode `0644`.
hints.0.text: List inventory groups with ansible-inventory --graph.
hints.1.text: Compare hosts in rollout.yml with the fleet group. The supplied play targets relays while the inventory
  defines fleet.
hints.2.text: Target fleet, run the playbook, then inspect all three remote files. Run ansible-playbook rollout.yml;
  remote cat and stat -c %a queries can inspect /srv/site/message.
debrief: The Ansible play selected a group absent from the inventory. You matched the group and checked all three
  managed files.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I verified the result on every managed host.
diagnostics.content_1: Host app1 /srv/site/message must equal north-ready.
