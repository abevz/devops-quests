title: Inventory groups
brief: 'You joined SignalRail operations. A new relay host missed the welcome file. Work in ~/quest. Keep all changes inside
  this training bay.


  Start with rollout.yml.


  Inputs in `~/quest`: `inventory.ini`, `ansible.cfg`, `rollout.yml`.


  The bay has no Internet or external DNS. Use only its supplied files, preloaded images and private services. All changes
  must stay inside this bay.


  Initial success criteria: All three managed hosts have /srv/site/message containing north-ready, mode 0644.'
stages.0.brief: 'The Ansible play targets group relays, but the inventory defines fleet. Deliver north-ready to all three
  hosts.


  Success criteria: All three managed hosts have /srv/site/message containing north-ready, mode 0644.


  An inventory groups the three SSH hosts; `rollout.yml` contains the copy destination, content and mode. After correcting
  the target group, run `ansible-playbook rollout.yml`. Inspect the remote content with `ansible fleet -m command -a "cat
  /srv/site/message"` and the mode with `ansible fleet -m command -a "stat -c %a /srv/site/message"`.'
stages.0.objectives.0.text: All three managed hosts have /srv/site/message containing north-ready, mode 0644.
hints.0.text: List inventory groups with ansible-inventory --graph.
hints.1.text: Compare hosts in rollout.yml with the fleet group.
hints.2.text: Target fleet, run the playbook, then inspect all three remote files.
debrief: The Ansible play selected a group absent from the inventory. You matched the group and checked all three managed
  files.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I verified the result on every managed host.
