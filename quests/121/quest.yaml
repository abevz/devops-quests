id: 121
title: title
track: Kubernetes
difficulty: expert
brief: brief
stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    check: |-
      dq_probe_output=$(mktemp)
      trap 'rm -f "$dq_probe_output"' EXIT
      set +e
      (
      set -euo pipefail
      set -euo pipefail
      cd ~/quest
      failed=0
      name=dq-webhook-${DQ_NAMESPACE#dq-}
      webhook=$(kubectl get validatingwebhookconfiguration "$name" -o json 2>/dev/null || true)
      namespace=$(kubectl get namespace "$DQ_NAMESPACE" -o json 2>/dev/null || true)
      installation=$(jq -r '.metadata.labels["devops-quests.installation"] // ""' <<<"$namespace" 2>/dev/null || true)
      if ! jq -e '.webhooks | length==1' <<<"$webhook" >/dev/null 2>&1; then
        printf '%s\n' 'webhook configuration webhooks length = 1: ✗ [DQ:count]'
        failed=1
      fi
      if ! jq -e '.webhooks[0].name=="route.training.devops-quests.local"' <<<"$webhook" >/dev/null 2>&1; then
        printf '%s\n' 'webhook name = route.training.devops-quests.local: ✗ [DQ:name]'
        failed=1
      fi
      if ! jq -e '.webhooks[0].failurePolicy=="Fail"' <<<"$webhook" >/dev/null 2>&1; then
        printf '%s\n' 'webhook failurePolicy = Fail: ✗ [DQ:failure_policy]'
        failed=1
      fi
      if ! jq -e '.webhooks[0].timeoutSeconds==2' <<<"$webhook" >/dev/null 2>&1; then
        printf '%s\n' 'webhook timeoutSeconds = 2: ✗ [DQ:timeout]'
        failed=1
      fi
      if ! jq -e --arg url "https://$name:8443/validate" '.webhooks[0].clientConfig.url==$url' <<<"$webhook" >/dev/null 2>&1; then
        printf '%s\n' 'webhook clientConfig.url = https://dq-webhook-<bay>:8443/validate: ✗ [DQ:url]'
        failed=1
      fi
      if ! python3 -I - /dev/fd/3 3<<<"$webhook" <<'DQ_CA'
      import sys

      from dq_check import read_argument as _dq_read_argument

      sys.argv = [_dq_read_argument(value) for value in sys.argv]

      import base64
      import re
      import json
      import sys
      from pathlib import Path
      try:
          def certificate(value):
              match=re.fullmatch(rb'\s*-----BEGIN CERTIFICATE-----\s*([A-Za-z0-9+/=\s]+)-----END CERTIFICATE-----\s*',value)
              if not match:raise ValueError('single PEM certificate')
              return base64.b64decode(re.sub(rb'\s+',b'',match[1]),validate=True)
          actual=certificate(base64.b64decode(json.loads(sys.argv[1])["webhooks"][0]["clientConfig"]["caBundle"],validate=True))
          expected=certificate(Path('admission-ca.pem').read_bytes())
          if not expected or actual != expected:
              raise ValueError("CA mismatch")
      except (KeyError, IndexError, TypeError, ValueError, OSError):
          sys.exit(1)
      DQ_CA
      then
        printf '%s\n' 'webhook caBundle = admission-ca.pem: ✗ [DQ:ca]'
        failed=1
      fi
      if ! test -n "$installation" || ! python3 -I - /dev/fd/3 /dev/fd/4 /dev/fd/5 3<<<"$webhook" 4<<<"$installation" 5<<<"${DQ_NAMESPACE#dq-}" <<'DQ_NAMESPACE_SCOPE'
      import sys

      from dq_check import read_argument as _dq_read_argument

      sys.argv = [_dq_read_argument(value) for value in sys.argv]

      import json,sys
      from dq_check import selector_equivalent as simple_selector

      try:
          scope=json.loads(sys.argv[1])['webhooks'][0]['namespaceSelector']
          ok=simple_selector(scope,{'devops-quests.installation':sys.argv[2],'devops-quests.run':sys.argv[3]})
      except (ValueError,KeyError,IndexError,TypeError,AttributeError):ok=False
      sys.exit(not ok)
      DQ_NAMESPACE_SCOPE
      then
        printf '%s\n' 'webhook namespaceSelector = bay installation and run labels: ✗ [DQ:namespace]'
        failed=1
      fi
      exit "$failed"
      ) >"$dq_probe_output" 2>/dev/null
      dq_probe_status=$?
      set -e
      cat "$dq_probe_output"
      if [ "$dq_probe_status" -ne 0 ] && ! grep -Eq '\[DQ:[a-z0-9_]+\]' "$dq_probe_output"; then
      printf '%s\n' 'Current inputs could not verify this objective: ✗ [DQ:probe_0_0]'
      fi
      rm -f "$dq_probe_output"
      trap - EXIT
      test "$dq_probe_status" -eq 0
  - text: stages.0.objectives.1.text
    check: "set -euo pipefail\ncd ~/quest\nfailed=0\nroute=$(kubectl get configmap route -o json 2>/dev/null ||\
      \ true)\nif ! jq -e '.data.route==\"north-121\"' <<<\"$route\" >/dev/null 2>&1; then\n  printf '%s\\n' 'configmap/route\
      \ data.route = north-121: ✗ [DQ:route]'\n  failed=1\nfi\ntmpdir=$(mktemp -d)\ntrap 'rm -f \"$tmpdir/valid.json\"\
      \ \"$tmpdir/invalid.json\" \"$tmpdir/denial.log\"; rmdir \"$tmpdir\"' EXIT\nif ! jq 'del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields)'\
      \ <<<\"$route\" > \"$tmpdir/valid.json\" 2>/dev/null || ! kubectl apply --dry-run=server -f \"$tmpdir/valid.json\"\
      \ >/dev/null 2>&1; then\n  printf '%s\\n' 'configmap/route north-121 server dry-run: ✗ [DQ:valid]'\n  failed=1\n\
      fi\nexit \"$failed\"\n"
  - text: stages.0.objectives.2.text
    check: "set -euo pipefail\ncd ~/quest\nfailed=0\nroute=$(kubectl get configmap route -o json 2>/dev/null ||\
      \ true)\ntmpdir=$(mktemp -d)\ntrap 'rm -f \"$tmpdir/valid.json\" \"$tmpdir/invalid.json\" \"$tmpdir/denial.log\"\
      ; rmdir \"$tmpdir\"' EXIT\nif ! jq '.data.route=\"closed\" | del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields)'\
      \ <<<\"$route\" > \"$tmpdir/invalid.json\" 2>/dev/null; then\n  printf '%s\\n' 'configmap/route closed dry-run\
      \ input: ✗ [DQ:invalid_input]'\n  failed=1\nelif kubectl apply --dry-run=server -f \"$tmpdir/invalid.json\"\
      \ > \"$tmpdir/denial.log\" 2>&1; then\n  printf '%s\\n' 'configmap/route closed server dry-run rejects: ✗\
      \ [DQ:denial]'\n  failed=1\nelif ! grep -F 'Station route must be north-121' \"$tmpdir/denial.log\" >/dev/null;\
      \ then\n  printf '%s\\n' 'closed denial = Station route must be north-121: ✗ [DQ:denial_text]'\n  failed=1\n\
      fi\nexit \"$failed\"\n"
  - text: stages.0.objectives.3.text
    check: "set -euo pipefail\ncd ~/quest\nfailed=0\nif ! kubectl get deployment board -o json 2>/dev/null | jq\
      \ -e '.status.readyReplicas==1' >/dev/null 2>&1; then\n  printf '%s\\n' 'deployment/board readyReplicas =\
      \ 1: ✗ [DQ:ready]'\n  failed=1\nfi\nif ! test \"$(kubectl exec --pod-running-timeout=2s deployment/client\
      \ -- wget -qO- -T 3 http://board:8080 2>/dev/null)\" = north-121; then\n  printf '%s\\n' 'deployment/client\
      \ → board:8080 = north-121: ✗ [DQ:http]'\n  failed=1\nfi\nexit \"$failed\"\n"
