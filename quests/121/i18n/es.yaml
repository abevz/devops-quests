title: Admisión webhook recuperación
brief: 'Las actualizaciones de ruta no llegan a la carga. Restaure el contrato privado de admisión y los resultados
  permitidos y rechazados esperados.


  Trabaja en la workstation en `~/quest` con los archivos suministrados:

  - `board.yaml`, `service.yaml`, `client.yaml`, `route.yaml`, `webhook-repair.json`, `admission-ca.pem`, `admission-target.json`.


  La interfaz de control de la estación está documentada en `~/quest/control/README.md`.


  **Requirements:**


  - El callback de admisión del bay conserva la identidad suministrada, CA privada, límite de namespace y contrato
  de timeout con fallo cerrado, y alcanza su endpoint privado previsto.

  - La configuración de ruta existente contiene `north-121` y su simulación de admisión en el servidor tiene éxito.

  - La simulación de admisión en el servidor de la ruta cerrada se rechaza con el error de validación de ruta del
  webhook privado.

  - El Deployment `board` tiene una réplica lista y `http://board:8080` devuelve `north-121` al Deployment `client`.
  Ambos consumidores descritos en `adoption-contract.json` usan el registro y la clave validados por la política
  en la configuración deseada y en los Pods actuales listos, leen y sirven la ruta admitida y conservan programas
  de inicio, identidades de cargas e imágenes. El registro provisional no cambia; la entrada de archivo sigue siendo
  de solo lectura.


  Las comprobaciones observan la configuración actual del callback y las decisiones de admisión, no todo el historial
  de recuperación.


  Los roles de consumidores, las rutas de entrada y las restricciones de conservación se describen en `adoption-contract.json`.'
debrief: El callback protegido, ambos resultados de admission y la adopción actual de los consumidores superaron
  las comprobaciones. Las instantáneas y respuestas describen el funcionamiento actual, no toda la historia de recuperación.
stages.0.brief: La configuración de admisión sigue siendo de solo lectura; la recuperación queda dentro del adaptador
  suministrado.
hints.0.text: Un fallo de transporte con fail-closed y un rechazo de la política son resultados distintos. Admission
  controla una escritura de API; no actualiza un entorno capturado al iniciar ni un archivo enlazado mediante subPath.
  Sigue la publicación y las generaciones de ambos consumidores como límites separados.
hints.1.text: 'Compara callback, decisiones de admission, fuentes de entrada de los consumidores y Pods actuales.
  El contrato describe vidas de las entradas y controles conservados; un recibo solo describe la solicitud de control.


  ```sh

  cd ~/quest

  cat adoption-contract.json webhook-agent-status.json admission-target.json

  name="dq-webhook-${DQ_NAMESPACE#dq-}"

  kubectl get validatingwebhookconfiguration "$name" -o yaml

  kubectl get deployment,replicaset,pods,configmap -o yaml

  ```'
hints.2.text: |-
  Verifica los dry-runs de servidor aceptados y rechazados, la respuesta de la aplicación y ambos consumidores. Las referencias deseadas y las entradas de Pods en ejecución deben corresponder al registro validado por la política; un HTTP correcto por sí solo no prueba la adopción.

  ```sh
  cd ~/quest
  kubectl get configmap route -o json |
    jq 'del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields)' |
    kubectl apply --dry-run=server -f -
  kubectl get configmap route -o json |
    jq '.data.route="closed" | del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields)' |
    kubectl apply --dry-run=server -f -
  kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080
  kubectl exec deployment/route-env -- printenv ROUTE
  kubectl exec deployment/route-file -- cat /config/route
  for name in route-env route-file; do
    kubectl exec "deployment/$name" -- wget -qO- -T 3 http://127.0.0.1:8080
  done
  kubectl get deployment,replicaset,pods -o yaml
  ```

  ```sh
  kubectl get deployment board -o jsonpath='{.status.readyReplicas}{"\n"}'
  ```

  El servidor acepta el dry-run con `north-121`. Rechaza el dry-run con `closed` y devuelve `Station route must be north-121`. Board tiene una réplica lista y la petición HTTP desde Deployment client devuelve north-121. Los dos puntos de acceso de los consumidores devuelven north-121 y las entradas de sus Pods en ejecución coinciden con el registro validado.
phrases.0: Distinguí la falla de transporte webhook de la denegación de policy.
phrases.1: Conservé la validación fail-closed y el alcance namespace.
phrases.2: Probé solicitudes API admitidas y denegadas.
questions.0.points.0: FailurePolicy Fail rechaza la solicitud cuando no se puede ejecutar la validación.
questions.0.points.1: Distinga los errores de transporte de las decisiones explícitas de policy.
questions.0.prompt: ¿Por qué puede fallar un objeto válido mientras un webhook no está disponible?
questions.1.points.0: Restrinja las reglas de recursos y la selección de namespace.
questions.1.points.1: Utilice tiempos de espera acotados, TLS y un servicio recuperable de forma independiente.
questions.1.prompt: ¿Cómo se limita el radio de explosión de un admission webhook?
stages.0.objectives.0.text: El callback de admisión del bay conserva la identidad suministrada, CA privada, límite
  de namespace y contrato de timeout con fallo cerrado, y alcanza su endpoint privado previsto.
stages.0.objectives.1.text: La configuración de ruta existente contiene `north-121` y su simulación de admisión
  en el servidor tiene éxito.
stages.0.objectives.2.text: La simulación de admisión en el servidor de la ruta cerrada se rechaza con el error
  de validación de ruta del webhook privado.
stages.0.objectives.3.text: El Deployment `board` tiene una réplica lista y `http://board:8080` devuelve `north-121`
  al Deployment `client`. Ambos consumidores descritos en `adoption-contract.json` usan el registro y la clave validados
  por la política en la configuración deseada y en los Pods actuales listos, leen y sirven la ruta admitida y conservan
  programas de inicio, identidades de cargas e imágenes. El registro provisional no cambia; la entrada de archivo
  sigue siendo de solo lectura.
diagnostics.count: La configuración puede faltar o contener webhooks adicionales. Revise que tenga exactamente una entrada. [Causa y comprobación](guides#guide=admission-metrics&section=q121-admission-single-webhook)
diagnostics.name: La entrada del webhook puede haberse renombrado o reemplazado. Revise route.training.devops-quests.local en la configuración activa. [Causa y comprobación](guides#guide=admission-metrics&section=q121-admission-webhook-identity)
diagnostics.failure_policy: Una solución temporal pudo cambiar failurePolicy a Ignore. Conserve Fail para que un webhook inaccesible no omita la validación. [Causa y comprobación](guides#guide=admission-metrics&section=q121-admission-failure-mode)
diagnostics.timeout: El timeout del webhook puede haber cambiado al diagnosticar conexión. Compruebe que timeoutSeconds siga en 2. [Causa y comprobación](guides#guide=admission-metrics&section=q121-admission-timeout-seconds)
diagnostics.url: El validador puede seguir apuntando a la ruta retirada u otra dirección. Revise la URL HTTPS del webhook en 8443 con /validate. [Causa y comprobación](guides#guide=admission-metrics&section=q121-admission-validation-endpoint)
diagnostics.ca: El paquete CA puede faltar, estar mal formado o contener otro certificado. Compare el único certificado decodificado con admission-ca.pem. [Causa y comprobación](guides#guide=admission-metrics&section=q121-admission-certificate-authority)
diagnostics.namespace: El selector puede omitir la etiqueta de ejecución o instalación, o incluir otro namespace. Compárelo con las dos etiquetas suministradas y conserve ese alcance exacto. [Causa y comprobación](guides#guide=admission-metrics&section=q121-admission-sandbox-namespace-selector)
diagnostics.route: El ConfigMap route activo puede conservar un valor anterior o no ser legible. Confirme north-121 en la clave route del objeto real. [Causa y comprobación](guides#guide=admission-metrics&section=q121-admission-current-route-record)
diagnostics.valid: Un objeto correcto puede fallar el dry-run de servidor por un webhook o CA inaccesible. Compare el resultado del dry-run con el registro route activo. [Causa y comprobación](guides#guide=admission-metrics&section=q121-admission-accepted-dry-run)
diagnostics.invalid_input: El objeto route puede faltar o tener JSON inválido, lo que impide preparar el dry-run con closed. Revise la entrada antes de interpretar la denegación. [Causa y comprobación](guides#guide=admission-metrics&section=q121-admission-denied-dry-run-input)
diagnostics.denial: El valor modificado puede pasar si el alcance o la ruta del webhook son incorrectos. Ejecute el dry-run de servidor con closed y confirme el rechazo. [Causa y comprobación](guides#guide=admission-metrics&section=q121-admission-reject-closed-route)
diagnostics.denial_text: Un fallo genérico de TLS o transporte puede rechazar el dry-run antes de validar. Compruebe que el error contenga Station route must be north-121. [Causa y comprobación](guides#guide=admission-metrics&section=q121-admission-exact-validation-denial)
diagnostics.ready: La ruta recuperada puede ser válida mientras el worker de board aún inicia o no está listo. Revise el despliegue y espere una réplica lista. [Causa y comprobación](guides#guide=admission-metrics&section=q121-admission-board-ready-count)
diagnostics.http: Un dry-run exitoso puede coexistir con una respuesta anterior o inaccesible de board. Consulte board desde client y compare el cuerpo real con north-121. [Causa y comprobación](guides#guide=admission-metrics&section=q121-admission-board-live-response)
diagnostics.probe_0_0: La comprobación puede detenerse antes de indicar una condición si no dispone de herramientas o archivos. Revise herramientas, CA suministrada y acceso al namespace. [Causa y comprobación](guides#guide=admission-metrics&section=q121-admission-config-observer-input)
diagnostics.adoption_identity: Una carga suministrada puede haberse recreado o usar otra imagen en su plantilla o Pods. Compare los UID e imágenes actuales con el registro fijado. [Causa y comprobación](guides#guide=admission-metrics&section=q121-admission-retained-consumer-identities)
diagnostics.adoption_staging: Copiar el registro aceptado a staged-route puede cambiar sus datos originales o UID. Compare toda la copia previa con el registro fijado y conecte los consumidores al route real. [Causa y comprobación](guides#guide=admission-metrics&section=q121-admission-preserved-staged-record)
diagnostics.adoption_record: La configuración de los consumidores puede faltar o estar obsoleta. Confirme north-121 en la clave route del registro route admitido real. [Causa y comprobación](guides#guide=admission-metrics&section=q121-admission-source-route-record)
diagnostics.adoption_current: Tras el despliegue, un consumidor puede carecer de exactamente un Pod actual propio y listo. Revise ambos despliegues y sus Pods actuales. [Causa y comprobación](guides#guide=admission-metrics&section=q121-admission-current-consumer-pods)
diagnostics.adoption_program: Cambiar el comando o sus argumentos puede ocultar la entrada incorrecta. Compare el programa deseado y el activo con el suministrado y corrija la referencia de origen. [Causa y comprobación](guides#guide=admission-metrics&section=q121-admission-preserved-startup-program)
diagnostics.adoption_source: Un consumidor puede seguir apuntando a staged-route o usar un valor literal o una proyección ambigua. Revise route/route en plantilla y Pod actual, mediante ROUTE único o montaje de solo lectura. [Causa y comprobación](guides#guide=admission-metrics&section=q121-admission-adopted-config-reference)
diagnostics.adoption_input: La configuración puede ser correcta aunque un consumidor activo vea la variable o archivo anterior. Lea ROUTE y /config/route y compare con north-121. [Causa y comprobación](guides#guide=admission-metrics&section=q121-admission-live-consumer-input)
diagnostics.adoption_output: Un consumidor puede leer la entrada correcta y seguir sirviendo una salida inicial obsoleta. Consulte loopback en cada consumidor actual y compare con north-121. [Causa y comprobación](guides#guide=admission-metrics&section=q121-admission-live-consumer-publication)
diagnostics.adoption_observation: El observador puede no leer una carga, entrada o salida del Pod en su tiempo límite. Revise la API y repita las observaciones por separado antes de evaluar la adopción. [Causa y comprobación](guides#guide=admission-metrics&section=q121-admission-current-observation-failure)
diagnostics.probe_0_3: El observador de adopción puede detenerse antes de señalar una condición si falla el proceso o los datos fijados. Revise las herramientas, el contrato y el acceso a ambos consumidores. [Causa y comprobación](guides#guide=admission-metrics&section=q121-admission-adoption-observer-input)
