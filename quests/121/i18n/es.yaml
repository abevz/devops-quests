title: Admisión webhook recuperación
brief: 'Un validating webhook privado tiene una ruta URL obsoleta, por lo que la admisión fail-closed
  impide que se cree el route ConfigMap. Inspeccione el único ValidatingWebhookConfiguration de solo lectura
  llamado dq-webhook-<bay id>. Solicite la reparación de la ruta acotada escribiendo {"action":"restore-path"}
  a webhook-repair.json; la encuesta normal del juego puede restaurar solo el punto final del servidor
  original /validate. Luego repare route.json a data.route north-121 y aplíquelo. Mantenga la verificación
  failurePolicy Fail, CA y el alcance exacto de namespace. Demuestre que la aplicación funciona y se deniega
  un server-side dry-run con route closed. No puede deshabilitar ni redirigir este policy.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `board.json`, `service.json`,
  `client.json`, `route.json`, `webhook-repair.json`, `admission-ca.pem`, `admission-target.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: El webhook con alcance original cumple su ruta válida, admite north-121,
  rechaza closed y el board real responde north-121.'
debrief: La recuperación restauró la disponibilidad de webhook preservando al mismo tiempo sus límites
  de validación y aislamiento.
stages.0.brief: 'Criterios de éxito: el webhook con alcance original cumple su ruta válida, admite north-121,
  rechaza closed y el board real responde north-121.'
stages.0.objectives.0.text: El webhook con alcance original cumple su ruta válida, admite north-121, rechaza
  closed y el board real responde north-121.
hints.0.text: Fail-closed distingue un webhook inalcanzable de un objeto rechazado.
hints.1.text: La configuración es de sólo lectura; la solicitud de reparación no puede cambiar el alcance
  de namespace, CA o el servidor.
hints.2.text: Solicite restore-path, repare data.route y luego pruebe ambos resultados de admisión.
phrases.0: Distinguí la falla de transporte webhook de la denegación de policy.
phrases.1: Conservé la validación fail-closed y el alcance namespace.
phrases.2: Probé solicitudes API admitidas y denegadas.
questions.0.points.0: FailurePolicy Fail rechaza la solicitud cuando no se puede ejecutar la validación.
questions.0.points.1: Distinga los errores de transporte de las decisiones explícitas de policy.
questions.0.prompt: ¿Por qué puede fallar un objeto válido mientras un webhook no está disponible?
questions.1.points.0: Restrinja las reglas de recursos y la selección de namespace.
questions.1.points.1: Utilice tiempos de espera acotados, TLS y un servicio recuperable de forma independiente.
questions.1.prompt: ¿Cómo se limita el radio de explosión de un admission webhook?
