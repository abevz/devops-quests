title: Admisión webhook recuperación
brief: |-
  Las actualizaciones de ruta no llegan a la carga. Restaure el contrato privado de admisión y los resultados permitidos y rechazados esperados.

  Trabaja en la workstation en `~/quest` con los archivos suministrados:
  - `board.yaml`, `service.yaml`, `client.yaml`, `route.yaml`, `webhook-repair.json`, `admission-ca.pem`, `admission-target.json`.

  **Requirements:**

  - El callback de admisión del bay conserva la identidad suministrada, CA privada, límite de namespace y contrato de timeout con fallo cerrado, y alcanza su endpoint privado previsto.
  - La configuración de ruta existente contiene `north-121` y su simulación de admisión en el servidor tiene éxito.
  - La simulación de admisión en el servidor de la ruta cerrada se rechaza con el error de validación de ruta del webhook privado.
  - El Deployment `board` tiene una réplica lista y `http://board:8080` devuelve `north-121` al Deployment `client`.

  Las comprobaciones observan la configuración actual del callback y las decisiones de admisión, no todo el historial de recuperación.
debrief: La configuración actual del webhook, la ruta, la respuesta y las pruebas dry-run válida e inválida
  coincidieron con las comprobaciones.
stages.0.brief: La configuración de admisión sigue siendo de solo lectura; la recuperación queda dentro
  del adaptador suministrado.
hints.0.text: Fail-closed distingue un webhook inalcanzable de un objeto rechazado. La URL suministrada
  del callback apunta a una ruta retirada, por lo que admisión fail-closed bloquea el ConfigMap antes
  de llegar a la carga.
hints.1.text: |-
  La configuración es de sólo lectura; la solicitud de reparación no puede cambiar el alcance de namespace, CA o el servidor.

  Inspecciona los datos suministrados y las observaciones activas:

  ```sh
  name="dq-webhook-${DQ_NAMESPACE#dq-}"
    kubectl get validatingwebhookconfiguration "$name" -o yaml
    kubectl get namespace "$DQ_NAMESPACE" -o yaml
    kubectl get deployment board -o yaml
    cat admission-target.json admission-ca.pem
  ```
hints.2.text: |-
  Solicite restore-path, repare data.route y luego pruebe ambos resultados de admisión. Escriba `{"action":"restore-path"}` en `webhook-repair.json` y espere al agente limitado; solo restaura la ruta del servidor suministrada.

  Verifica el resultado desde `~/quest` en la workstation:

  - La ruta actual se admite sin guardar cambios; el consumidor recibe `north-121`.

    ```sh
    kubectl get configmap route -o json |
      jq 'del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields)' |
      kubectl apply --dry-run=server -f -
    kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080
    ```

  - La simulación falla con `Station route must be north-121` y no cambia ningún objeto guardado (dry-run).

    ```sh
    kubectl get configmap route -o json |
      jq '.data.route="closed" | del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields)' |
      kubectl apply --dry-run=server -f -
    ```
phrases.0: Distinguí la falla de transporte webhook de la denegación de policy.
phrases.1: Conservé la validación fail-closed y el alcance namespace.
phrases.2: Probé solicitudes API admitidas y denegadas.
questions.0.points.0: FailurePolicy Fail rechaza la solicitud cuando no se puede ejecutar la validación.
questions.0.points.1: Distinga los errores de transporte de las decisiones explícitas de policy.
questions.0.prompt: ¿Por qué puede fallar un objeto válido mientras un webhook no está disponible?
questions.1.points.0: Restrinja las reglas de recursos y la selección de namespace.
questions.1.points.1: Utilice tiempos de espera acotados, TLS y un servicio recuperable de forma independiente.
questions.1.prompt: ¿Cómo se limita el radio de explosión de un admission webhook?
diagnostics.count: webhook configuration webhooks length debe ser igual a 1.
diagnostics.name: webhook name debe ser igual a route.training.devops-quests.local.
diagnostics.failure_policy: webhook failurePolicy debe ser igual a Fail.
diagnostics.timeout: webhook timeoutSeconds debe ser igual a 2.
diagnostics.url: webhook clientConfig.url debe ser `https://dq-webhook-<bay>:8443/validate` para esta
  bahía.
diagnostics.ca: webhook caBundle debe contener el mismo certificado único que admission-ca.pem, independientemente del formato PEM.
diagnostics.namespace: La etiqueta de instalación de la bahía no debe estar vacía y webhook namespaceSelector
  debe coincidir exactamente con sus etiquetas de instalación y ejecución.
diagnostics.route: configmap/route data.route debe ser igual a north-121.
diagnostics.ready: deployment/board readyReplicas debe ser igual a 1.
diagnostics.http: La petición a board:8080 debe devolver north-121.
diagnostics.valid: La preparación de route y su dry-run del servidor deben tener éxito.
diagnostics.invalid_input: La preparación de la entrada dry-run para route closed debe tener éxito.
diagnostics.denial: El dry-run del servidor debe rechazar route closed.
diagnostics.denial_text: El rechazo debe contener Station route must be north-121.
stages.0.objectives.0.text: El callback de admisión del bay conserva la identidad suministrada, CA privada,
  límite de namespace y contrato de timeout con fallo cerrado, y alcanza su endpoint privado previsto.
stages.0.objectives.1.text: La configuración de ruta existente contiene `north-121` y su simulación de
  admisión en el servidor tiene éxito.
stages.0.objectives.2.text: La simulación de admisión en el servidor de la ruta cerrada se rechaza con
  el error de validación de ruta del webhook privado.
stages.0.objectives.3.text: El Deployment `board` tiene una réplica lista y `http://board:8080` devuelve
  `north-121` al Deployment `client`.
