title: Admisión webhook recuperación
brief: "Las actualizaciones de ruta no llegan a la carga. Restaure el contrato privado de admisión y los resultados\
  \ permitidos y rechazados esperados.\n\nTrabaje en `~/quest` en la estación de trabajo. Archivos suministrados:\
  \ `route.json`, `webhook-repair.json`, `admission-ca.pem`, `admission-target.json`, `board.json`, `service.json`,\
  \ `client.json`.\n\n**Requirements:**\n\n- El webhook de validación limitado a la bahía confía en su CA privada\
  \ y tiene un callback `route.training.devops-quests.local`, política de fallo `Fail` y timeout de `2` segundos.\n\
  \  - El endpoint del callback coincide con `admission-target.json` y su CA con `admission-ca.pem`, ambos en `~/quest`\
  \ de la estación. Su ámbito de namespace coincide con las etiquetas actuales `devops-quests.installation` y `devops-quests.run`;\
  \ la configuración `dq-webhook-${DQ_NAMESPACE#dq-}` es de solo lectura para el jugador.\n- El ConfigMap `route`\
  \ contiene la ruta `north-121` y su simulación de admisión en el servidor tiene éxito (dry-run).\n- Una simulación\
  \ en el servidor con ruta `closed` se rechaza con `Station route must be north-121` (dry-run).\n- El Deployment\
  \ `board` tiene una réplica lista y `http://board:8080` devuelve `north-121` al Deployment `client`.\n\n**Verify\
  \ yourself before Check & finish:** Ejecute estos comandos de observación desde `~/quest` en la estación de trabajo.\n\
  \n- La configuración, identidades y estado cumplen los requisitos.\n\n  ```sh\n  name=\"dq-webhook-${DQ_NAMESPACE#dq-}\"\
  \n  kubectl get validatingwebhookconfiguration \"$name\" -o yaml\n  kubectl get namespace \"$DQ_NAMESPACE\" -o\
  \ yaml\n  kubectl get deployment board -o yaml\n  cat admission-target.json admission-ca.pem\n  ```\n\n- La ruta\
  \ actual se admite sin guardar cambios; el consumidor recibe `north-121`.\n\n  ```sh\n  kubectl get configmap\
  \ route -o json |\n    jq 'del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields)'\
  \ |\n    kubectl apply --dry-run=server -f -\n  kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080\n\
  \  ```\n\n- La simulación falla con `Station route must be north-121` y no cambia ningún objeto guardado (dry-run).\n\
  \n  ```sh\n  kubectl get configmap route -o json |\n    jq '.data.route=\"closed\" | del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields)'\
  \ |\n    kubectl apply --dry-run=server -f -\n  ```\n\nLas comprobaciones observan la configuración actual del\
  \ callback y las decisiones de admisión, no todo el historial de recuperación."
debrief: La configuración actual del webhook, la ruta, la respuesta y las pruebas dry-run válida e inválida coincidieron
  con las comprobaciones.
stages.0.brief: El callback limitado de admisión debe exigir la ruta requerida y permitir que la carga la sirva.
hints.0.text: Fail-closed distingue un webhook inalcanzable de un objeto rechazado. La URL suministrada del callback
  apunta a una ruta retirada, por lo que admisión fail-closed bloquea el ConfigMap antes de llegar a la carga.
hints.1.text: La configuración es de sólo lectura; la solicitud de reparación no puede cambiar el alcance de namespace,
  CA o el servidor.
hints.2.text: Solicite restore-path, repare data.route y luego pruebe ambos resultados de admisión. Escriba `{"action":"restore-path"}`
  en `webhook-repair.json` y espere al agente limitado; solo restaura la ruta del servidor suministrada.
phrases.0: Distinguí la falla de transporte webhook de la denegación de policy.
phrases.1: Conservé la validación fail-closed y el alcance namespace.
phrases.2: Probé solicitudes API admitidas y denegadas.
questions.0.points.0: FailurePolicy Fail rechaza la solicitud cuando no se puede ejecutar la validación.
questions.0.points.1: Distinga los errores de transporte de las decisiones explícitas de policy.
questions.0.prompt: ¿Por qué puede fallar un objeto válido mientras un webhook no está disponible?
questions.1.points.0: Restrinja las reglas de recursos y la selección de namespace.
questions.1.points.1: Utilice tiempos de espera acotados, TLS y un servicio recuperable de forma independiente.
questions.1.prompt: ¿Cómo se limita el radio de explosión de un admission webhook?
diagnostics.count: webhook configuration webhooks length debe ser igual a 1.
diagnostics.name: webhook name debe ser igual a route.training.devops-quests.local.
diagnostics.failure_policy: webhook failurePolicy debe ser igual a Fail.
diagnostics.timeout: webhook timeoutSeconds debe ser igual a 2.
diagnostics.url: webhook clientConfig.url debe ser `https://dq-webhook-<bay>:8443/validate` para esta bahía.
diagnostics.ca: webhook caBundle debe ser base64 válido y coincidir con admission-ca.pem no vacío tras quitar espacios
  alrededor.
diagnostics.namespace: La etiqueta de instalación de la bahía no debe estar vacía y webhook namespaceSelector debe
  coincidir exactamente con sus etiquetas de instalación y ejecución.
diagnostics.route: configmap/route data.route debe ser igual a north-121.
diagnostics.ready: deployment/board readyReplicas debe ser igual a 1.
diagnostics.http: La petición a board:8080 debe devolver north-121.
diagnostics.valid: La preparación de route y su dry-run del servidor deben tener éxito.
diagnostics.invalid_input: La preparación de la entrada dry-run para route closed debe tener éxito.
diagnostics.denial: El dry-run del servidor debe rechazar route closed.
diagnostics.denial_text: El rechazo debe contener Station route must be north-121.
stages.0.objectives.0.text: El webhook de validación limitado a la bahía confía en su CA privada y tiene un callback
  `route.training.devops-quests.local`, política de fallo `Fail` y timeout de `2` segundos.
stages.0.objectives.1.text: El ConfigMap `route` contiene la ruta `north-121` y su simulación de admisión en el
  servidor tiene éxito (dry-run).
stages.0.objectives.2.text: Una simulación en el servidor con ruta `closed` se rechaza con `Station route must be
  north-121` (dry-run).
stages.0.objectives.3.text: El Deployment `board` tiene una réplica lista y `http://board:8080` devuelve `north-121`
  al Deployment `client`.
