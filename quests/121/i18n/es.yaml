title: Admisión webhook recuperación
brief: 'Trabaja en `~/quest`; lee `route.json`, `webhook-repair.json`, `admission-ca.pem`, `admission-target.json`, `board.json`,
  `service.json` y `client.json`. Un webhook de validación privado tiene una URL antigua, por lo que la admisión fail-closed
  impide el ConfigMap de ruta. Un webhook es una llamada de API que puede admitir o denegar una solicitud. Su configuración
  es de solo lectura para el jugador.


  Escribe `{"action":"restore-path"}` en `webhook-repair.json` y espera al agente limitado de la bahía; solo puede restaurar
  la ruta del servidor suministrado. La configuración `dq-webhook-<bay id>` debe contener un webhook llamado `route.training.devops-quests.local`,
  `failurePolicy: Fail`, `timeoutSeconds: 2` y URL `https://dq-webhook-<bay id>:8443/validate`. Su paquete CA debe coincidir
  con `admission-ca.pem` y su selector de namespace con las etiquetas de la bahía `devops-quests.installation` y `devops-quests.run`.
  Estos campos exactos conservan la única llamada limitada original que el agente puede reparar.


  Aplica `data.route: north-121`. Comprueba una réplica board lista, HTTP del cliente a `board:8080` con respuesta `north-121`
  y pruebas dry-run del servidor: la ruta válida debe tener éxito, mientras `closed` debe fallar con `Station route must be
  north-121`. Las comprobaciones observan la configuración y decisiones actuales; no demuestran toda la historia de recuperación.
  Trabaja solo en la bahía sin conexión.'
debrief: La configuración actual del webhook, la ruta, la respuesta y las pruebas dry-run válida e inválida coincidieron con
  las comprobaciones.
stages.0.brief: La configuración limitada del webhook, la ruta, board listo, la respuesta del cliente y ambas pruebas dry-run
  coinciden con el enunciado.
stages.0.objectives.0.text: La configuración limitada del webhook, la ruta, board listo, la respuesta del cliente y ambas
  pruebas dry-run coinciden con el enunciado.
hints.0.text: Fail-closed distingue un webhook inalcanzable de un objeto rechazado.
hints.1.text: La configuración es de sólo lectura; la solicitud de reparación no puede cambiar el alcance de namespace, CA
  o el servidor.
hints.2.text: Solicite restore-path, repare data.route y luego pruebe ambos resultados de admisión.
phrases.0: Distinguí la falla de transporte webhook de la denegación de policy.
phrases.1: Conservé la validación fail-closed y el alcance namespace.
phrases.2: Probé solicitudes API admitidas y denegadas.
questions.0.points.0: FailurePolicy Fail rechaza la solicitud cuando no se puede ejecutar la validación.
questions.0.points.1: Distinga los errores de transporte de las decisiones explícitas de policy.
questions.0.prompt: ¿Por qué puede fallar un objeto válido mientras un webhook no está disponible?
questions.1.points.0: Restrinja las reglas de recursos y la selección de namespace.
questions.1.points.1: Utilice tiempos de espera acotados, TLS y un servicio recuperable de forma independiente.
questions.1.prompt: ¿Cómo se limita el radio de explosión de un admission webhook?
diagnostics.count: webhook configuration webhooks length debe ser igual a 1.
diagnostics.name: webhook name debe ser igual a route.training.devops-quests.local.
diagnostics.failure_policy: webhook failurePolicy debe ser igual a Fail.
diagnostics.timeout: webhook timeoutSeconds debe ser igual a 2.
diagnostics.url: webhook clientConfig.url debe ser `https://dq-webhook-<bay>:8443/validate` para esta bahía.
diagnostics.ca: webhook caBundle debe ser base64 válido y coincidir con admission-ca.pem no vacío tras quitar espacios alrededor.
diagnostics.namespace: La etiqueta de instalación de la bahía no debe estar vacía y webhook namespaceSelector debe coincidir
  exactamente con sus etiquetas de instalación y ejecución.
diagnostics.route: configmap/route data.route debe ser igual a north-121.
diagnostics.ready: deployment/board readyReplicas debe ser igual a 1.
diagnostics.http: La petición a board:8080 debe devolver north-121.
diagnostics.valid: La preparación de route y su dry-run del servidor deben tener éxito.
diagnostics.invalid_input: La preparación de la entrada dry-run para route closed debe tener éxito.
diagnostics.denial: El dry-run del servidor debe rechazar route closed.
diagnostics.denial_text: El rechazo debe contener Station route must be north-121.
