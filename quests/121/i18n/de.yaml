title: Zulassung webhook Wiederherstellung
brief: 'Arbeite in `~/quest`; lies `route.json`, `webhook-repair.json`, `admission-ca.pem`, `admission-target.json`, `board.json`, `service.json` und `client.json`. Ein privater Validierungs-Webhook hat eine veraltete URL, daher verhindert Fail-closed-Admission die Route-ConfigMap. Ein Webhook ist ein API-Rückruf, der eine Anfrage zulassen oder ablehnen kann. Seine Konfiguration ist für den Spieler nur lesbar.


  Schreibe `{"action":"restore-path"}` nach `webhook-repair.json` und warte auf den begrenzten Agenten; er kann nur den Pfad des bereitgestellten Servers wiederherstellen. Die Konfiguration `dq-webhook-<bay id>` muss einen Webhook namens `route.training.devops-quests.local`, `failurePolicy: Fail`, `timeoutSeconds: 2` und die URL `https://dq-webhook-<bay id>:8443/validate` enthalten. Sein CA-Bundle muss `admission-ca.pem` entsprechen, sein Namespace-Selektor den Umgebungslabels `devops-quests.installation` und `devops-quests.run`. Diese genauen Felder bewahren den einen ursprünglichen begrenzten Rückruf, den der Agent reparieren kann.


  Wende `data.route: north-121` an. Prüfe eine bereite board-Replik, Client-HTTP zu `board:8080` mit Antwort `north-121` und serverseitige Dry-runs: Die gültige Route muss gelingen, `closed` muss mit `Station route must be north-121` abgelehnt werden. Die Prüfungen beobachten aktuelle Konfiguration und Entscheidungen; sie beweisen nicht die gesamte Wiederherstellungsgeschichte. Arbeite nur in der Offline-Umgebung.'
debrief: Aktuelle Webhook-Konfiguration, Route, Antwort sowie gültiger und ungültiger Dry-run entsprachen den Prüfungen.
stages.0.brief: Begrenzte Webhook-Konfiguration, Route, bereites board, Client-Antwort und beide Admission-Dry-runs entsprechen der Aufgabe.
stages.0.objectives.0.text: Begrenzte Webhook-Konfiguration, Route, bereites board, Client-Antwort und beide Admission-Dry-runs entsprechen der Aufgabe.
hints.0.text: Fail-closed unterscheidet ein nicht erreichbares webhook von einem abgelehnten Objekt.
hints.1.text: Die Konfiguration ist schreibgeschützt; Die Reparaturanforderung kann den namespace-Bereich,
  den CA oder den Server nicht ändern.
hints.2.text: Fordern Sie restore-path an, reparieren Sie data.route und testen Sie dann beide Zulassungsergebnisse.
phrases.0: Ich habe den Transportfehler webhook von der Ablehnung policy unterschieden.
phrases.1: Ich habe die fail-closed-Validierung und den namespace-Bereich beibehalten.
phrases.2: Ich habe sowohl zugelassene als auch abgelehnte API-Anfragen getestet.
questions.0.points.0: FailurePolicy Fail lehnt die Anfrage ab, wenn die Validierung nicht ausgeführt werden
  kann.
questions.0.points.1: Unterscheiden Sie Transportfehler von expliziten policy-Entscheidungen.
questions.0.prompt: Warum kann ein gültiges Objekt fehlschlagen, während ein webhook nicht verfügbar ist?
questions.1.points.0: Ressourcenregeln und namespace-Auswahl einschränken.
questions.1.points.1: Verwenden Sie begrenzte Zeitüberschreitungen, TLS und einen unabhängig wiederherstellbaren
  Dienst.
questions.1.prompt: Wie begrenzt man den Strahlradius eines admission webhook?
