stages.0.objectives.3.text: Deployment `board` hat ein bereites Replikat, und `http://board:8080` liefert Deployment
  `client` den Wert `north-121`. Beide in `adoption-contract.json` beschriebenen Verbraucher nutzen den durch die
  Richtlinie geprüften Datensatz und Schlüssel in der gewünschten Konfiguration und aktuellen bereiten Pods, lesen
  und liefern die zugelassene Route und bewahren Startprogramme, Workload-Identitäten und Images. Der zwischengespeicherte
  Datensatz bleibt unverändert; der Dateieingang bleibt schreibgeschützt.
diagnostics.count: Die Übungskonfiguration fehlt möglicherweise oder enthält zusätzliche Webhooks. Prüfen Sie, ob sie genau einen Eintrag enthält. [Ursache und Prüfung](guides#guide=admission-metrics&section=q121-admission-single-webhook)
diagnostics.name: Der Webhook-Eintrag wurde möglicherweise umbenannt oder ersetzt. Prüfen Sie die aktive Konfiguration auf route.training.devops-quests.local. [Ursache und Prüfung](guides#guide=admission-metrics&section=q121-admission-webhook-identity)
diagnostics.failure_policy: Ein Workaround hat failurePolicy möglicherweise auf Ignore gesetzt. Behalten Sie Fail bei, damit ein unerreichbarer Webhook die Validierung nicht stillschweigend überspringt. [Ursache und Prüfung](guides#guide=admission-metrics&section=q121-admission-failure-mode)
diagnostics.timeout: Der Webhook-Timeout wurde möglicherweise beim Prüfen der Erreichbarkeit geändert. Prüfen Sie, ob timeoutSeconds weiterhin 2 beträgt. [Ursache und Prüfung](guides#guide=admission-metrics&section=q121-admission-timeout-seconds)
diagnostics.url: Der Validator verweist möglicherweise noch auf den stillgelegten Pfad oder eine andere Adresse. Prüfen Sie die HTTPS-URL des Übungs-Webhooks auf Port 8443 mit /validate. [Ursache und Prüfung](guides#guide=admission-metrics&section=q121-admission-validation-endpoint)
diagnostics.ca: Das CA-Bundle fehlt möglicherweise, ist fehlerhaft oder enthält ein anderes Zertifikat. Vergleichen Sie das einzelne dekodierte Zertifikat mit admission-ca.pem. [Ursache und Prüfung](guides#guide=admission-metrics&section=q121-admission-certificate-authority)
diagnostics.namespace: Der Selektor lässt möglicherweise das Lauf- oder Installationslabel aus oder erfasst einen anderen Namespace. Vergleichen Sie ihn mit den zwei gelieferten Labels und behalten Sie den genauen Bereich bei. [Ursache und Prüfung](guides#guide=admission-metrics&section=q121-admission-sandbox-namespace-selector)
diagnostics.route: Die aktive ConfigMap route enthält möglicherweise eine alte Route oder ist nicht lesbar. Prüfen Sie im tatsächlichen Objekt den Schlüssel route auf north-121. [Ursache und Prüfung](guides#guide=admission-metrics&section=q121-admission-current-route-record)
diagnostics.valid: Auch ein korrektes Objekt kann beim serverseitigen dry-run an einem unerreichbaren Webhook oder CA-Problem scheitern. Vergleichen Sie den dry-run mit dem aktiven route-Eintrag. [Ursache und Prüfung](guides#guide=admission-metrics&section=q121-admission-accepted-dry-run)
diagnostics.invalid_input: Das route-Objekt fehlt möglicherweise oder enthält ungültiges JSON, sodass die Eingabe mit closed für den dry-run nicht entsteht. Prüfen Sie die Eingabe vor der Auswertung der Ablehnung. [Ursache und Prüfung](guides#guide=admission-metrics&section=q121-admission-denied-dry-run-input)
diagnostics.denial: Der geänderte Wert kann bei falschem Webhook-Bereich oder Pfad akzeptiert werden. Führen Sie den serverseitigen dry-run mit closed aus und prüfen Sie die Ablehnung. [Ursache und Prüfung](guides#guide=admission-metrics&section=q121-admission-reject-closed-route)
diagnostics.denial_text: Ein allgemeiner TLS- oder Transportfehler kann den dry-run vor der Validierung abbrechen. Prüfen Sie die Fehlermeldung auf Station route must be north-121. [Ursache und Prüfung](guides#guide=admission-metrics&section=q121-admission-exact-validation-denial)
diagnostics.ready: Die wiederhergestellte Route kann zulässig sein, während der board-Worker noch startet oder nicht bereit ist. Prüfen Sie den Rollout und warten Sie auf eine bereite Replik. [Ursache und Prüfung](guides#guide=admission-metrics&section=q121-admission-board-ready-count)
diagnostics.http: Ein erfolgreicher dry-run kann mit alter Ausgabe von board oder fehlender Erreichbarkeit einhergehen. Fragen Sie board aus client ab und vergleichen Sie die Antwort mit north-121. [Ursache und Prüfung](guides#guide=admission-metrics&section=q121-admission-board-live-response)
diagnostics.probe_0_0: Die Webhook-Prüfung kann vor der Meldung einer Bedingung abbrechen, wenn Werkzeuge oder Eingaben fehlen. Prüfen Sie lokale Werkzeuge, gelieferte CA und Namespace-Zugriff. [Ursache und Prüfung](guides#guide=admission-metrics&section=q121-admission-config-observer-input)
diagnostics.adoption_identity: Eine gelieferte Arbeitslast wurde möglicherweise neu erstellt oder nutzt ein anderes Image in Vorlage oder Pods. Vergleichen Sie aktuelle UIDs und Images mit dem festgehaltenen Übernahmebeleg. [Ursache und Prüfung](guides#guide=admission-metrics&section=q121-admission-retained-consumer-identities)
diagnostics.adoption_staging: Eine Angleichung von staged-route an den zugelassenen Eintrag hat möglicherweise Daten oder UID geändert. Vergleichen Sie den vollständigen Staging-Eintrag mit dem Beleg und stellen Sie die Verbraucher auf route um. [Ursache und Prüfung](guides#guide=admission-metrics&section=q121-admission-preserved-staged-record)
diagnostics.adoption_record: Die Verbraucher-Konfiguration fehlt möglicherweise oder ist alt. Prüfen Sie im tatsächlich zugelassenen route-Eintrag den Schlüssel route auf north-121. [Ursache und Prüfung](guides#guide=admission-metrics&section=q121-admission-source-route-record)
diagnostics.adoption_current: Nach dem Rollout fehlt einem Verbraucher möglicherweise genau ein aktueller zugehöriger bereiter Pod. Prüfen Sie beide Deployments und ihre aktuellen Pods. [Ursache und Prüfung](guides#guide=admission-metrics&section=q121-admission-current-consumer-pods)
diagnostics.adoption_program: Ein geänderter Startbefehl oder andere Argumente können eine falsche Eingabe verdecken. Vergleichen Sie gewünschtes und aktives Programm mit dem gelieferten und korrigieren Sie die Quellreferenz. [Ursache und Prüfung](guides#guide=admission-metrics&section=q121-admission-preserved-startup-program)
diagnostics.adoption_source: Ein Verbraucher verweist möglicherweise noch auf staged-route oder nutzt ein Literal oder eine mehrdeutige Datei-Projektion. Prüfen Sie route/route in Vorlage und aktuellem Pod über den eindeutigen ROUTE-Verweis oder einen schreibgeschützten Datei-Mount. [Ursache und Prüfung](guides#guide=admission-metrics&section=q121-admission-adopted-config-reference)
diagnostics.adoption_input: Die Konfiguration kann stimmen, obwohl ein laufender Verbraucher eine alte Variable oder Datei sieht. Lesen Sie ROUTE und /config/route und vergleichen Sie mit north-121. [Ursache und Prüfung](guides#guide=admission-metrics&section=q121-admission-live-consumer-input)
diagnostics.adoption_output: Ein Verbraucher kann die richtige Eingabe lesen und dennoch alte Startdaten liefern. Fragen Sie Loopback in jedem aktuellen Verbraucher ab und vergleichen Sie mit north-121. [Ursache und Prüfung](guides#guide=admission-metrics&section=q121-admission-live-consumer-publication)
diagnostics.adoption_observation: Die Prüfung kann Arbeitslast, Pod-Eingabe oder Antwort möglicherweise nicht im Zeitbudget lesen. Prüfen Sie die API und wiederholen Sie Beobachtungen separat vor der Bewertung der Übernahme. [Ursache und Prüfung](guides#guide=admission-metrics&section=q121-admission-current-observation-failure)
diagnostics.probe_0_3: Die Übernahmeprüfung kann vor der Meldung einer Bedingung abbrechen, wenn Prozess oder festgehaltene Eingaben fehlschlagen. Prüfen Sie Werkzeuge, Vertrag und Zugriff auf beide Verbraucher. [Ursache und Prüfung](guides#guide=admission-metrics&section=q121-admission-adoption-observer-input)
