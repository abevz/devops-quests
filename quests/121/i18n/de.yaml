title: Zulassung webhook Wiederherstellung
brief: 'Ein privater validating webhook hat einen veralteten URL-Pfad, sodass die fail-closed-Zulassung
  verhindert, dass der route ConfigMap erstellt wird. Überprüfen Sie den einen schreibgeschützten ValidatingWebhookConfiguration
  mit dem Namen dq-webhook-<bay id>. Fordern Sie die Reparatur des begrenzten Pfads an, indem Sie {"action":"restore-path"}
  an webhook-repair.json schreiben. Die normale Spielabfrage kann nur den ursprünglichen Endpunkt des
  Servers /validate wiederherstellen. Dann reparieren Sie route.json bis data.route north-121 und wenden
  Sie es an. Behalten Sie die Verifizierung failurePolicy Fail, CA und den genauen namespace-Bereich bei.
  Beweisen Sie, dass die Anwendung funktioniert, und ein server-side dry-run mit route closed wird abgelehnt.
  Sie können dieses policy nicht deaktivieren oder umleiten.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `board.json`, `service.json`, `client.json`,
  `route.json`, `webhook-repair.json`, `admission-ca.pem`, `admission-target.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: Der ursprüngliche webhook dient seinem gültigen Pfad, gibt north-121 zu, lehnt
  closed ab und der echte board antwortet north-121.'
debrief: Die Wiederherstellung stellte die Verfügbarkeit von webhook unter Beibehaltung der Validierungs-
  und Isolationsgrenzen wieder her.
stages.0.brief: 'Erfolgskriterien: Der ursprünglich gültige webhook dient seinem gültigen Pfad, gibt north-121
  zu, weist closed zurück und der echte board antwortet mit north-121.'
stages.0.objectives.0.text: Der ursprüngliche webhook dient seinem gültigen Pfad, gibt north-121 zu, lehnt
  closed ab und der echte board antwortet mit north-121.
hints.0.text: Fail-closed unterscheidet ein nicht erreichbares webhook von einem abgelehnten Objekt.
hints.1.text: Die Konfiguration ist schreibgeschützt; Die Reparaturanforderung kann den namespace-Bereich,
  den CA oder den Server nicht ändern.
hints.2.text: Fordern Sie restore-path an, reparieren Sie data.route und testen Sie dann beide Zulassungsergebnisse.
phrases.0: Ich habe den Transportfehler webhook von der Ablehnung policy unterschieden.
phrases.1: Ich habe die fail-closed-Validierung und den namespace-Bereich beibehalten.
phrases.2: Ich habe sowohl zugelassene als auch abgelehnte API-Anfragen getestet.
questions.0.points.0: FailurePolicy Fail lehnt die Anfrage ab, wenn die Validierung nicht ausgeführt werden
  kann.
questions.0.points.1: Unterscheiden Sie Transportfehler von expliziten policy-Entscheidungen.
questions.0.prompt: Warum kann ein gültiges Objekt fehlschlagen, während ein webhook nicht verfügbar ist?
questions.1.points.0: Ressourcenregeln und namespace-Auswahl einschränken.
questions.1.points.1: Verwenden Sie begrenzte Zeitüberschreitungen, TLS und einen unabhängig wiederherstellbaren
  Dienst.
questions.1.prompt: Wie begrenzt man den Strahlradius eines admission webhook?
