title: Zulassung webhook Wiederherstellung
brief: "Routenaktualisierungen erreichen den Workload nicht. Stellen Sie den privaten Admission-Vertrag und die\
  \ erwarteten erlaubten und abgelehnten Ergebnisse her.\n\nArbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte\
  \ Dateien: `route.json`, `webhook-repair.json`, `admission-ca.pem`, `admission-target.json`, `board.json`, `service.json`,\
  \ `client.json`.\n\n**Requirements:**\n\n- Der bay-begrenzte Validierungs-Webhook vertraut seiner privaten CA\
  \ und hat einen Callback `route.training.devops-quests.local`, Fehlerrichtlinie `Fail` und Timeout `2` Sekunden.\n\
  \  - Der Callback-Endpunkt entspricht `admission-target.json`, seine CA `admission-ca.pem`, beide in `~/quest`\
  \ auf der Workstation. Der Namespace-Bereich entspricht den aktuellen Bay-Labels `devops-quests.installation`\
  \ und `devops-quests.run`; Konfiguration `dq-webhook-${DQ_NAMESPACE#dq-}` ist für Spieler schreibgeschützt.\n\
  - ConfigMap `route` enthält Route `north-121`, und ihr serverseitiger Admission-Probelauf ist erfolgreich (dry-run).\n\
  - Ein serverseitiger Probelauf mit Route `closed` wird mit `Station route must be north-121` abgelehnt (dry-run).\n\
  - Deployment `board` hat ein bereites Replikat, und `http://board:8080` liefert Deployment `client` den Wert `north-121`.\n\
  \n**Verify yourself before Check & finish:** Führen Sie diese Beobachtungsbefehle aus `~/quest` auf der Workstation\
  \ aus.\n\n- Einstellungen, Identitäten und Status entsprechen den Anforderungen.\n\n  ```sh\n  name=\"dq-webhook-${DQ_NAMESPACE#dq-}\"\
  \n  kubectl get validatingwebhookconfiguration \"$name\" -o yaml\n  kubectl get namespace \"$DQ_NAMESPACE\" -o\
  \ yaml\n  kubectl get deployment board -o yaml\n  cat admission-target.json admission-ca.pem\n  ```\n\n- Die aktuelle\
  \ Route wird ohne dauerhafte Änderung zugelassen; der Verbraucher erhält `north-121`.\n\n  ```sh\n  kubectl get\
  \ configmap route -o json |\n    jq 'del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields)'\
  \ |\n    kubectl apply --dry-run=server -f -\n  kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080\n\
  \  ```\n\n- Der Probelauf scheitert mit `Station route must be north-121` und ändert kein gespeichertes Objekt\
  \ (dry-run).\n\n  ```sh\n  kubectl get configmap route -o json |\n    jq '.data.route=\"closed\" | del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields)'\
  \ |\n    kubectl apply --dry-run=server -f -\n  ```\n\nDie Prüfungen beobachten aktuelle Callback-Konfiguration\
  \ und Admission-Entscheidungen, nicht den vollständigen Wiederherstellungsverlauf."
debrief: Aktuelle Webhook-Konfiguration, Route, Antwort sowie gültiger und ungültiger Dry-run entsprachen den Prüfungen.
stages.0.brief: Der begrenzte Admission-Callback muss die erforderliche Route durchsetzen und ihre Bereitstellung
  erlauben.
hints.0.text: Fail-closed unterscheidet ein nicht erreichbares webhook von einem abgelehnten Objekt. Die bereitgestellte
  Callback-URL verweist auf einen stillgelegten Pfad; Fail-Closed-Admission blockiert die Routen-ConfigMap vor dem
  Workload.
hints.1.text: Die Konfiguration ist schreibgeschützt; Die Reparaturanforderung kann den namespace-Bereich, den CA
  oder den Server nicht ändern.
hints.2.text: Fordern Sie restore-path an, reparieren Sie data.route und testen Sie dann beide Zulassungsergebnisse.
  Schreiben Sie `{"action":"restore-path"}` in `webhook-repair.json` und warten Sie auf den begrenzten Agenten;
  er kann nur den vorgegebenen Serverpfad wiederherstellen.
phrases.0: Ich habe den Transportfehler webhook von der Ablehnung policy unterschieden.
phrases.1: Ich habe die fail-closed-Validierung und den namespace-Bereich beibehalten.
phrases.2: Ich habe sowohl zugelassene als auch abgelehnte API-Anfragen getestet.
questions.0.points.0: FailurePolicy Fail lehnt die Anfrage ab, wenn die Validierung nicht ausgeführt werden kann.
questions.0.points.1: Unterscheiden Sie Transportfehler von expliziten policy-Entscheidungen.
questions.0.prompt: Warum kann ein gültiges Objekt fehlschlagen, während ein webhook nicht verfügbar ist?
questions.1.points.0: Ressourcenregeln und namespace-Auswahl einschränken.
questions.1.points.1: Verwenden Sie begrenzte Zeitüberschreitungen, TLS und einen unabhängig wiederherstellbaren
  Dienst.
questions.1.prompt: Wie begrenzt man den Strahlradius eines admission webhook?
diagnostics.count: webhook configuration webhooks length muss 1 entsprechen.
diagnostics.name: webhook name muss route.training.devops-quests.local entsprechen.
diagnostics.failure_policy: webhook failurePolicy muss Fail entsprechen.
diagnostics.timeout: webhook timeoutSeconds muss 2 entsprechen.
diagnostics.url: webhook clientConfig.url muss `https://dq-webhook-<bay>:8443/validate` für diese Umgebung entsprechen.
diagnostics.ca: webhook caBundle muss gültiges base64 sein und nach Entfernen von umgebendem Leerraum dem nichtleeren
  admission-ca.pem entsprechen.
diagnostics.namespace: Das Installationslabel der Umgebung darf nicht leer sein, und webhook namespaceSelector muss
  genau ihren Installations- und Run-Labels entsprechen.
diagnostics.route: configmap/route data.route muss north-121 entsprechen.
diagnostics.ready: deployment/board readyReplicas muss 1 entsprechen.
diagnostics.http: Die Anfrage an board:8080 muss north-121 liefern.
diagnostics.valid: Das Vorbereiten von route und sein server dry-run müssen erfolgreich sein.
diagnostics.invalid_input: Das Vorbereiten der dry-run Eingabe für route closed muss erfolgreich sein.
diagnostics.denial: Der server dry-run muss route closed ablehnen.
diagnostics.denial_text: Die Ablehnung muss Station route must be north-121 enthalten.
stages.0.objectives.0.text: Der bay-begrenzte Validierungs-Webhook vertraut seiner privaten CA und hat einen Callback
  `route.training.devops-quests.local`, Fehlerrichtlinie `Fail` und Timeout `2` Sekunden.
stages.0.objectives.1.text: ConfigMap `route` enthält Route `north-121`, und ihr serverseitiger Admission-Probelauf
  ist erfolgreich (dry-run).
stages.0.objectives.2.text: Ein serverseitiger Probelauf mit Route `closed` wird mit `Station route must be north-121`
  abgelehnt (dry-run).
stages.0.objectives.3.text: Deployment `board` hat ein bereites Replikat, und `http://board:8080` liefert Deployment
  `client` den Wert `north-121`.
