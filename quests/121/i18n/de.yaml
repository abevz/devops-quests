title: Zulassung webhook Wiederherstellung
brief: 'Routenaktualisierungen erreichen den Workload nicht. Stellen Sie den privaten Admission-Vertrag und die
  erwarteten erlaubten und abgelehnten Ergebnisse her.


  Arbeiten Sie auf der Workstation in `~/quest` mit den bereitgestellten Dateien:

  - `board.yaml`, `service.yaml`, `client.yaml`, `route.yaml`, `webhook-repair.json`, `admission-ca.pem`, `admission-target.json`.


  Die Steuerschnittstelle der Station ist in `~/quest/control/README.md` dokumentiert.


  **Requirements:**


  - Der bay-begrenzte Admission-Callback behält die bereitgestellte Identität, private CA, Namespace-Grenze und
  den Fail-closed-Zeitvertrag bei und erreicht seinen vorgesehenen privaten Endpunkt.

  - Die vorhandene Routenkonfiguration enthält `north-121`; ihr serverseitiger Admission-Probelauf ist erfolgreich.

  - Ein serverseitiger Admission-Probelauf der geschlossenen Route wird mit dem Routen-Validierungsfehler des privaten
  Webhooks abgelehnt.

  - Deployment `board` hat ein bereites Replikat, und `http://board:8080` liefert Deployment `client` den Wert `north-121`.
  Beide in `adoption-contract.json` beschriebenen Verbraucher nutzen den durch die Richtlinie geprüften Datensatz
  und Schlüssel in der gewünschten Konfiguration und aktuellen bereiten Pods, lesen und liefern die zugelassene
  Route und bewahren Startprogramme, Workload-Identitäten und Images. Der zwischengespeicherte Datensatz bleibt
  unverändert; der Dateieingang bleibt schreibgeschützt.


  Die Prüfungen beobachten aktuelle Callback-Konfiguration und Admission-Entscheidungen, nicht den vollständigen
  Wiederherstellungsverlauf.


  Verbraucherrollen, Eingabepfade und Erhaltungsbedingungen sind in `adoption-contract.json` beschrieben.'
debrief: Der geschützte Callback, beide Admission-Ergebnisse und die aktuelle Datenübernahme der Verbraucher bestanden
  die Prüfungen. Konfigurationsaufnahmen und Antworten beschreiben den aktuellen Betrieb, nicht die gesamte Wiederherstellungsgeschichte.
stages.0.brief: Die Admission-Konfiguration bleibt schreibgeschützt; die Wiederherstellung bleibt im bereitgestellten
  Adapter.
hints.0.text: Ein Transportfehler bei Fail-closed und eine Ablehnung durch die Richtlinie sind verschiedene Ergebnisse.
  Admission steuert einen API-Schreibvorgang, aktualisiert aber weder eine beim Start erfasste Umgebung noch eine
  über subPath gebundene Datei. Verfolge Veröffentlichung und beide Verbrauchergenerationen als getrennte Grenzen.
hints.1.text: 'Vergleiche Callback, Admission-Entscheidungen, Eingabequellen der Verbraucher und aktuelle Pods.
  Der Vertrag beschreibt Lebenszeiten und bewahrte Kontrollobjekte; eine Quittung gilt nur für die Steuerungsanfrage.


  ```sh

  cd ~/quest

  cat adoption-contract.json webhook-agent-status.json admission-target.json

  name="dq-webhook-${DQ_NAMESPACE#dq-}"

  kubectl get validatingwebhookconfiguration "$name" -o yaml

  kubectl get deployment,replicaset,pods,configmap -o yaml

  ```'
hints.2.text: "Prüfe erfolgreiche und abgelehnte serverseitige Dry-runs, die Anwendungsantwort und beide Verbraucher.\
  \ Gewünschte Quellreferenzen und Eingaben laufender Pods müssen dem durch die Richtlinie geprüften Datensatz entsprechen;\
  \ erfolgreiches HTTP allein belegt keine Übernahme.\n\n```sh\ncd ~/quest\nkubectl get configmap route -o json\
  \ |\n  jq 'del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields)' |\n\
  \  kubectl apply --dry-run=server -f -\nkubectl get configmap route -o json |\n  jq '.data.route=\"closed\" |\
  \ del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields)' |\n  kubectl\
  \ apply --dry-run=server -f -\nkubectl exec deployment/client -- wget -qO- -T 3 http://board:8080\nkubectl exec\
  \ deployment/route-env -- printenv ROUTE\nkubectl exec deployment/route-file -- cat /config/route\nfor name in\
  \ route-env route-file; do\n  kubectl exec \"deployment/$name\" -- wget -qO- -T 3 http://127.0.0.1:8080\ndone\n\
  kubectl get deployment,replicaset,pods -o yaml\n```"
phrases.0: Ich habe den Transportfehler webhook von der Ablehnung policy unterschieden.
phrases.1: Ich habe die fail-closed-Validierung und den namespace-Bereich beibehalten.
phrases.2: Ich habe sowohl zugelassene als auch abgelehnte API-Anfragen getestet.
questions.0.points.0: FailurePolicy Fail lehnt die Anfrage ab, wenn die Validierung nicht ausgeführt werden kann.
questions.0.points.1: Unterscheiden Sie Transportfehler von expliziten policy-Entscheidungen.
questions.0.prompt: Warum kann ein gültiges Objekt fehlschlagen, während ein webhook nicht verfügbar ist?
questions.1.points.0: Ressourcenregeln und namespace-Auswahl einschränken.
questions.1.points.1: Verwenden Sie begrenzte Zeitüberschreitungen, TLS und einen unabhängig wiederherstellbaren
  Dienst.
questions.1.prompt: Wie begrenzt man den Strahlradius eines admission webhook?
diagnostics.count: webhook configuration webhooks length muss 1 entsprechen.
diagnostics.name: webhook name muss route.training.devops-quests.local entsprechen.
diagnostics.failure_policy: webhook failurePolicy muss Fail entsprechen.
diagnostics.timeout: webhook timeoutSeconds muss 2 entsprechen.
diagnostics.url: webhook clientConfig.url muss `https://dq-webhook-<bay>:8443/validate` für diese Umgebung entsprechen.
diagnostics.ca: webhook caBundle muss unabhängig von der PEM-Formatierung dasselbe einzelne Zertifikat wie admission-ca.pem
  enthalten.
diagnostics.namespace: Das Installationslabel der Umgebung darf nicht leer sein, und webhook namespaceSelector muss
  genau ihren Installations- und Run-Labels entsprechen.
diagnostics.route: configmap/route data.route muss north-121 entsprechen.
diagnostics.ready: deployment/board readyReplicas muss 1 entsprechen.
diagnostics.http: Die Anfrage an board:8080 muss north-121 liefern.
diagnostics.valid: Das Vorbereiten von route und sein server dry-run müssen erfolgreich sein.
diagnostics.invalid_input: Das Vorbereiten der dry-run Eingabe für route closed muss erfolgreich sein.
diagnostics.denial: Der server dry-run muss route closed ablehnen.
diagnostics.denial_text: Die Ablehnung muss Station route must be north-121 enthalten.
