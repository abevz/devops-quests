diagnostics.probe_0_0: 'Mit den aktuellen Eingaben konnte dieses Ziel nicht geprüft werden: Der bay-begrenzte Admission-Callback
  behält die bereitgestellte Identität, private CA, Namespace-Grenze und den Fail-closed-Zeitvertrag bei und erreicht
  seinen vorgesehenen privaten Endpunkt.'
diagnostics.adoption_identity: Eine ursprüngliche Workload-Identität oder ein bereitgestelltes Image weicht ab.
  Ein ersetztes Deployment oder geändertes Image in Vorlage/aktuellem Pod bewahrt die bestehende Topologie nicht.
diagnostics.adoption_staging: Identität oder Daten des Zwischendatensatzes wurden geändert. Er ist eine bewahrte
  Kontrolle; das Bearbeiten einer Kopie übernimmt nicht die geprüfte Quelle.
diagnostics.adoption_record: Der geschützte Datensatz enthält die zugelassene Route nicht. Die Wiederherstellung
  des Callbacks veröffentlicht allein keine zulässigen Daten.
diagnostics.adoption_current: Ein Verbraucher besitzt nicht genau einen aktuellen bereiten zugehörigen Pod. Ein
  laufender Rollout oder fremder Pod belegt keine aktuelle Übernahme.
diagnostics.adoption_program: Startbefehl oder Argumente eines Verbrauchers wurden geändert. Bewahre das bereitgestellte
  Programm, damit Eingaben und Antworten seinem beschriebenen Verhalten entsprechen.
diagnostics.adoption_source: Eine gewünschte oder aktuelle Eingabe verweist nicht auf den geprüften Datensatz und
  Schlüssel. Ein kopierter Wert oder ungeprüfter Schlüssel belegt keine Übernahme.
diagnostics.adoption_input: Ein laufender Verbraucher liest weiterhin eine andere Route. Umgebung und subPath können
  ihren Startzustand nach einer Quelländerung behalten.
diagnostics.adoption_output: Eine Verbraucherantwort weicht von der zugelassenen Route ab. Die Startaufnahme kann
  trotz korrektem API-Objekt noch ältere Daten enthalten.
diagnostics.adoption_observation: Die aktuelle Übernahme konnte innerhalb des begrenzten Prüfzeitraums nicht beobachtet
  werden. Warte auf verfügbare Workloads und vergleiche Live-Objekte und Eingaben.
diagnostics.probe_0_3: Die aktuelle Übernahme konnte innerhalb des begrenzten Prüfzeitraums nicht beobachtet werden.
  Warte auf verfügbare Workloads und vergleiche Live-Objekte und Eingaben.
