title: Zulassung webhook Wiederherstellung
brief: |-
  Routenaktualisierungen erreichen den Workload nicht. Stellen Sie den privaten Admission-Vertrag und die erwarteten erlaubten und abgelehnten Ergebnisse her.

  Arbeiten Sie auf der Workstation in `~/quest` mit den bereitgestellten Dateien:
  - `board.yaml`, `service.yaml`, `client.yaml`, `route.yaml`, `webhook-repair.json`, `admission-ca.pem`, `admission-target.json`.

  **Requirements:**

  - Der bay-begrenzte Admission-Callback behält die bereitgestellte Identität, private CA, Namespace-Grenze und den Fail-closed-Zeitvertrag bei und erreicht seinen vorgesehenen privaten Endpunkt.
  - Die vorhandene Routenkonfiguration enthält `north-121`; ihr serverseitiger Admission-Probelauf ist erfolgreich.
  - Ein serverseitiger Admission-Probelauf der geschlossenen Route wird mit dem Routen-Validierungsfehler des privaten Webhooks abgelehnt.
  - Deployment `board` hat ein bereites Replikat, und `http://board:8080` liefert Deployment `client` den Wert `north-121`.

  Die Prüfungen beobachten aktuelle Callback-Konfiguration und Admission-Entscheidungen, nicht den vollständigen Wiederherstellungsverlauf.
debrief: Aktuelle Webhook-Konfiguration, Route, Antwort sowie gültiger und ungültiger Dry-run entsprachen
  den Prüfungen.
stages.0.brief: Die Admission-Konfiguration bleibt schreibgeschützt; die Wiederherstellung bleibt im bereitgestellten
  Adapter.
hints.0.text: Fail-closed unterscheidet ein nicht erreichbares webhook von einem abgelehnten Objekt. Die
  bereitgestellte Callback-URL verweist auf einen stillgelegten Pfad; Fail-Closed-Admission blockiert
  die Routen-ConfigMap vor dem Workload.
hints.1.text: |-
  Die Konfiguration ist schreibgeschützt; Die Reparaturanforderung kann den namespace-Bereich, den CA oder den Server nicht ändern.

  Prüfen Sie die bereitgestellten Eingaben und laufenden Beobachtungen:

  ```sh
  name="dq-webhook-${DQ_NAMESPACE#dq-}"
    kubectl get validatingwebhookconfiguration "$name" -o yaml
    kubectl get namespace "$DQ_NAMESPACE" -o yaml
    kubectl get deployment board -o yaml
    cat admission-target.json admission-ca.pem
  ```
hints.2.text: |-
  Fordern Sie restore-path an, reparieren Sie data.route und testen Sie dann beide Zulassungsergebnisse. Schreiben Sie `{"action":"restore-path"}` in `webhook-repair.json` und warten Sie auf den begrenzten Agenten; er kann nur den vorgegebenen Serverpfad wiederherstellen.

  Prüfen Sie das Ergebnis in `~/quest` auf der Workstation:

  - Die aktuelle Route wird ohne dauerhafte Änderung zugelassen; der Verbraucher erhält `north-121`.

    ```sh
    kubectl get configmap route -o json |
      jq 'del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields)' |
      kubectl apply --dry-run=server -f -
    kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080
    ```

  - Der Probelauf scheitert mit `Station route must be north-121` und ändert kein gespeichertes Objekt (dry-run).

    ```sh
    kubectl get configmap route -o json |
      jq '.data.route="closed" | del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields)' |
      kubectl apply --dry-run=server -f -
    ```
phrases.0: Ich habe den Transportfehler webhook von der Ablehnung policy unterschieden.
phrases.1: Ich habe die fail-closed-Validierung und den namespace-Bereich beibehalten.
phrases.2: Ich habe sowohl zugelassene als auch abgelehnte API-Anfragen getestet.
questions.0.points.0: FailurePolicy Fail lehnt die Anfrage ab, wenn die Validierung nicht ausgeführt werden
  kann.
questions.0.points.1: Unterscheiden Sie Transportfehler von expliziten policy-Entscheidungen.
questions.0.prompt: Warum kann ein gültiges Objekt fehlschlagen, während ein webhook nicht verfügbar ist?
questions.1.points.0: Ressourcenregeln und namespace-Auswahl einschränken.
questions.1.points.1: Verwenden Sie begrenzte Zeitüberschreitungen, TLS und einen unabhängig wiederherstellbaren
  Dienst.
questions.1.prompt: Wie begrenzt man den Strahlradius eines admission webhook?
diagnostics.count: webhook configuration webhooks length muss 1 entsprechen.
diagnostics.name: webhook name muss route.training.devops-quests.local entsprechen.
diagnostics.failure_policy: webhook failurePolicy muss Fail entsprechen.
diagnostics.timeout: webhook timeoutSeconds muss 2 entsprechen.
diagnostics.url: webhook clientConfig.url muss `https://dq-webhook-<bay>:8443/validate` für diese Umgebung
  entsprechen.
diagnostics.ca: webhook caBundle muss unabhängig von der PEM-Formatierung dasselbe einzelne Zertifikat wie admission-ca.pem enthalten.
diagnostics.namespace: Das Installationslabel der Umgebung darf nicht leer sein, und webhook namespaceSelector
  muss genau ihren Installations- und Run-Labels entsprechen.
diagnostics.route: configmap/route data.route muss north-121 entsprechen.
diagnostics.ready: deployment/board readyReplicas muss 1 entsprechen.
diagnostics.http: Die Anfrage an board:8080 muss north-121 liefern.
diagnostics.valid: Das Vorbereiten von route und sein server dry-run müssen erfolgreich sein.
diagnostics.invalid_input: Das Vorbereiten der dry-run Eingabe für route closed muss erfolgreich sein.
diagnostics.denial: Der server dry-run muss route closed ablehnen.
diagnostics.denial_text: Die Ablehnung muss Station route must be north-121 enthalten.
