diagnostics.probe_0_0: 'The current inputs could not verify this objective: The bay-scoped admission callback retains
  the supplied identity, private CA, namespace boundary and fail-closed timeout contract, and reaches its intended
  private endpoint.'
diagnostics.adoption_identity: An original workload identity or supplied image differs. Recreating a Deployment
  or changing its template/current Pod image does not preserve the existing topology.
diagnostics.adoption_staging: The staged record identity or data changed. It is a retained control; editing a copy
  does not adopt the policy-validated source.
diagnostics.adoption_record: The policy-protected record does not contain the admitted route. Callback restoration
  alone does not publish admissible data.
diagnostics.adoption_current: A consumer lacks exactly one current ready owned Pod. A pending rollout or unrelated
  Pod cannot establish current adoption.
diagnostics.adoption_program: A consumer startup command or arguments changed. Preserve the provided program so
  input and response observations refer to its declared behavior.
diagnostics.adoption_source: A desired or current consumer input does not reference the policy-validated record
  and key. A copied literal or an unvalidated key does not establish adoption.
diagnostics.adoption_input: A running consumer still reads a different route. Environment and subPath inputs can
  retain their startup state after the source changes.
diagnostics.adoption_output: A consumer response differs from the admitted route. Its startup snapshot may still
  contain older data even when the API object is correct.
diagnostics.adoption_observation: Current adoption could not be observed within the bounded check. Wait for the
  workload to become available and compare the live objects and inputs.
diagnostics.probe_0_3: Current adoption could not be observed within the bounded check. Wait for the workload to
  become available and compare the live objects and inputs.
