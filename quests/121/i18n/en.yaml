title: Admission webhook recovery
brief: 'Work in `~/quest`; read `route.json`, `webhook-repair.json`, `admission-ca.pem`, `admission-target.json`, `board.json`, `service.json` and `client.json`. A private validating webhook has a retired URL, so fail-closed admission prevents the route ConfigMap. A webhook is an API callback that can admit or deny a request. Its configuration is read-only to the player.


  Write `{"action":"restore-path"}` to `webhook-repair.json` and wait for the bounded bay agent; it can restore only the supplied server path. The configuration `dq-webhook-<bay id>` must contain one webhook named `route.training.devops-quests.local`, `failurePolicy: Fail`, `timeoutSeconds: 2`, and URL `https://dq-webhook-<bay id>:8443/validate`. Its CA bundle must match `admission-ca.pem`, and its namespace selector must match the bay''s `devops-quests.installation` and `devops-quests.run` labels. These exact fields preserve the one original scoped callback that the repair agent can operate.


  Apply `data.route: north-121`. Verify one ready board replica, HTTP from the requesting Pod `board:8080` returning `north-121`, and server-side dry-runs: the valid route must succeed, while `closed` must fail with `Station route must be north-121`. The checks observe the current configuration and decisions; they do not prove the entire recovery history. Work only in the offline bay.'
debrief: The current webhook configuration, route, response and valid and invalid dry-runs matched the checks.
stages.0.brief: The bounded webhook configuration, route, ready board, HTTP response and both admission dry-runs match the brief.
stages.0.objectives.0.text: The bounded webhook configuration, route, ready board, HTTP response and both admission dry-runs match the brief.
hints.0.text: Fail-closed distinguishes an unreachable webhook from a rejected object.
hints.1.text: The configuration is read-only; the repair request cannot change namespace
  scope, CA or server.
hints.2.text: Request restore-path, repair data.route, then test both admission outcomes.
phrases.0: I distinguished webhook transport failure from policy denial.
phrases.1: I preserved fail-closed validation and namespace scope.
phrases.2: I tested both admitted and denied API requests.
questions.0.points.0: FailurePolicy Fail rejects the request when validation cannot
  run.
questions.0.points.1: Distinguish transport errors from explicit policy decisions.
questions.0.prompt: Why can a valid object fail while a webhook is unavailable?
questions.1.points.0: Restrict resource rules and namespace selection.
questions.1.points.1: Use bounded timeouts, TLS and an independently recoverable service.
questions.1.prompt: How do you limit the blast radius of an admission webhook?
