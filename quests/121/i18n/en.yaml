title: Admission webhook recovery
brief: 'Route updates are not reaching the workload. Restore the private admission contract and the expected allowed
  and rejected results.


  Work on the workstation in `~/quest` with the supplied files:

  - `board.yaml`, `service.yaml`, `client.yaml`, `route.yaml`, `webhook-repair.json`, `admission-ca.pem`, `admission-target.json`.


  The control interface is documented in `~/quest/control/README.md`.


  **Requirements:**


  - The bay-scoped admission callback retains the supplied identity, private CA, namespace boundary and fail-closed
  timeout contract, and reaches its intended private endpoint.

  - The existing route configuration contains `north-121`, and its server-side admission dry-run succeeds.

  - A server-side admission dry-run of the closed route is rejected with the private webhook’s route validation
  error.

  - Deployment `board` has one ready replica, and `http://board:8080` returns `north-121` to Deployment `client`.
  Both consumers described in `adoption-contract.json` use the policy-validated record and key in desired configuration
  and current ready Pods, read and serve the admitted route, and retain their supplied startup programs, workload
  identities and images. The staged record remains unchanged; the file input stays read-only.


  Checks observe current callback configuration and admission decisions, not the complete recovery history.


  Consumer roles, input paths and preservation constraints are described in `adoption-contract.json`.'
debrief: The protected callback, both admission outcomes and current consumer adoption matched the checks. Configuration
  snapshots and responses describe current operation, not the complete recovery history.
stages.0.brief: The admission configuration stays read-only; recovery stays within the supplied adapter.
hints.0.text: Fail-closed transport failure and a policy rejection are different outcomes. Admission governs an
  API write; it does not update an environment captured at startup or a file bound through subPath. Follow publication
  and both consumer generations as separate boundaries.
hints.1.text: 'Compare the callback, admission decisions, consumer input sources and current Pods. The supplied
  contract describes input lifetimes and preserved controls; a receipt describes only the control request.


  ```sh

  cd ~/quest

  cat adoption-contract.json webhook-agent-status.json admission-target.json

  name="dq-webhook-${DQ_NAMESPACE#dq-}"

  kubectl get validatingwebhookconfiguration "$name" -o yaml

  kubectl get deployment,replicaset,pods,configmap -o yaml

  ```'
hints.2.text: |-
  Verify successful and rejected server dry-runs, the application response and both consumers. Desired source references and running Pod inputs must agree with the policy-validated record; healthy HTTP alone does not establish adoption.

  ```sh
  cd ~/quest
  kubectl get configmap route -o json |
    jq 'del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields)' |
    kubectl apply --dry-run=server -f -
  kubectl get configmap route -o json |
    jq '.data.route="closed" | del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields)' |
    kubectl apply --dry-run=server -f -
  kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080
  kubectl exec deployment/route-env -- printenv ROUTE
  kubectl exec deployment/route-file -- cat /config/route
  for name in route-env route-file; do
    kubectl exec "deployment/$name" -- wget -qO- -T 3 http://127.0.0.1:8080
  done
  kubectl get deployment,replicaset,pods -o yaml
  ```

  ```sh
  kubectl get deployment board -o jsonpath='{.status.readyReplicas}{"\n"}'
  ```

  The server accepts the dry-run with `north-121`. It rejects the dry-run with `closed` and returns `Station route must be north-121`. Board has one ready replica, and the HTTP request from Deployment client returns north-121. Both consumer endpoints return north-121, and their running Pod inputs match the validated record.
phrases.0: I distinguished webhook transport failure from policy denial.
phrases.1: I preserved fail-closed validation and namespace scope.
phrases.2: I tested both admitted and denied API requests.
questions.0.points.0: FailurePolicy Fail rejects the request when validation cannot run.
questions.0.points.1: Distinguish transport errors from explicit policy decisions.
questions.0.prompt: Why can a valid object fail while a webhook is unavailable?
questions.1.points.0: Restrict resource rules and namespace selection.
questions.1.points.1: Use bounded timeouts, TLS and an independently recoverable service.
questions.1.prompt: How do you limit the blast radius of an admission webhook?
stages.0.objectives.0.text: The bay-scoped admission callback retains the supplied identity, private CA, namespace
  boundary and fail-closed timeout contract, and reaches its intended private endpoint.
stages.0.objectives.1.text: The existing route configuration contains `north-121`, and its server-side admission
  dry-run succeeds.
stages.0.objectives.2.text: A server-side admission dry-run of the closed route is rejected with the private webhook’s
  route validation error.
stages.0.objectives.3.text: Deployment `board` has one ready replica, and `http://board:8080` returns `north-121`
  to Deployment `client`. Both consumers described in `adoption-contract.json` use the policy-validated record and
  key in desired configuration and current ready Pods, read and serve the admitted route, and retain their supplied
  startup programs, workload identities and images. The staged record remains unchanged; the file input stays read-only.
diagnostics.count: The bay configuration may be missing or list extra webhooks. Inspect the supplied configuration for exactly one entry. [Cause and check](guides#guide=admission-metrics&section=q121-admission-single-webhook)
diagnostics.name: The webhook entry may have been renamed or replaced. Check for route.training.devops-quests.local in the live bay configuration. [Cause and check](guides#guide=admission-metrics&section=q121-admission-webhook-identity)
diagnostics.failure_policy: A workaround may have changed failurePolicy to Ignore. Preserve Fail so an unavailable validating webhook does not silently bypass validation. [Cause and check](guides#guide=admission-metrics&section=q121-admission-failure-mode)
diagnostics.timeout: The webhook timeout may have been changed while debugging reachability. Check that timeoutSeconds still equals 2. [Cause and check](guides#guide=admission-metrics&section=q121-admission-timeout-seconds)
diagnostics.url: The route validator may still point at the retired path or a different address. Check the bay’s HTTPS webhook URL on port 8443 with path /validate. [Cause and check](guides#guide=admission-metrics&section=q121-admission-validation-endpoint)
diagnostics.ca: The CA bundle may be missing, malformed or contain a different certificate. Compare the one decoded certificate with admission-ca.pem. [Cause and check](guides#guide=admission-metrics&section=q121-admission-certificate-authority)
diagnostics.namespace: The selector may omit the run or installation label or include another namespace. Compare the webhook selector with the two supplied namespace labels and retain that exact scope. [Cause and check](guides#guide=admission-metrics&section=q121-admission-sandbox-namespace-selector)
diagnostics.route: The live route ConfigMap may still contain a stale value or be unreadable. Confirm the admitted route key is north-121 in the actual object. [Cause and check](guides#guide=admission-metrics&section=q121-admission-current-route-record)
diagnostics.valid: A correct object may still fail server dry-run because the validating webhook endpoint or CA is unavailable. Compare the actual server dry-run result with the live route record. [Cause and check](guides#guide=admission-metrics&section=q121-admission-accepted-dry-run)
diagnostics.invalid_input: The existing route object may be missing or invalid JSON, preventing the closed dry-run input from being created. Check the input before interpreting a server denial. [Cause and check](guides#guide=admission-metrics&section=q121-admission-denied-dry-run-input)
diagnostics.denial: The altered value may pass server validation when the webhook scope or path is wrong. Run the closed server dry-run and verify it is rejected. [Cause and check](guides#guide=admission-metrics&section=q121-admission-reject-closed-route)
diagnostics.denial_text: A generic failure such as a TLS or transport error may reject the dry-run before validation. Check that the error contains Station route must be north-121. [Cause and check](guides#guide=admission-metrics&section=q121-admission-exact-validation-denial)
diagnostics.ready: The restored route may be admissible while the board worker is still starting or unready. Inspect the rollout and wait for one ready replica. [Cause and check](guides#guide=admission-metrics&section=q121-admission-board-ready-count)
diagnostics.http: A successful dry-run may coexist with stale or unreachable live board output. Query board from client and compare the actual body with north-121. [Cause and check](guides#guide=admission-metrics&section=q121-admission-board-live-response)
diagnostics.probe_0_0: The webhook configuration observer can stop before naming a failed condition if its tools or input files cannot start. Check the local tooling, supplied CA and namespace access. [Cause and check](guides#guide=admission-metrics&section=q121-admission-config-observer-input)
diagnostics.adoption_identity: A supplied workload may have been recreated or may use a different image on its template or Pods. Compare current UIDs and images with the frozen adoption receipt. [Cause and check](guides#guide=admission-metrics&section=q121-admission-retained-consumer-identities)
diagnostics.adoption_staging: Updating staged-route to imitate the admitted record may change its original data or UID. Compare the entire staging record with the frozen one and adopt the real route record at the consumers. [Cause and check](guides#guide=admission-metrics&section=q121-admission-preserved-staged-record)
diagnostics.adoption_record: The configuration consumed by the workloads may still be stale or absent. Confirm that the actual admitted route record contains north-121 in the route key. [Cause and check](guides#guide=admission-metrics&section=q121-admission-source-route-record)
diagnostics.adoption_current: A rollout may leave a consumer without exactly one current owned ready Pod. Check the two Deployment rollouts and their current Pods. [Cause and check](guides#guide=admission-metrics&section=q121-admission-current-consumer-pods)
diagnostics.adoption_program: Changing a consumer’s startup command or arguments may mask the wrong input. Compare both the desired and current program with the supplied one and update the source reference. [Cause and check](guides#guide=admission-metrics&section=q121-admission-preserved-startup-program)
diagnostics.adoption_source: A consumer may still reference staged-route or use a literal environment value or an ambiguous file projection. Inspect both template and current Pod for the admitted route/route key, using the unique ROUTE reference or a read-only file mount as applicable. [Cause and check](guides#guide=admission-metrics&section=q121-admission-adopted-config-reference)
diagnostics.adoption_input: The configuration may be correct while a running consumer still sees its old environment or file. Read the live ROUTE and /config/route inputs and compare with north-121. [Cause and check](guides#guide=admission-metrics&section=q121-admission-live-consumer-input)
diagnostics.adoption_output: A consumer may read the right input yet still serve stale startup output. Request the loopback endpoint from each current consumer and compare with north-121. [Cause and check](guides#guide=admission-metrics&section=q121-admission-live-consumer-publication)
diagnostics.adoption_observation: The observer may be unable to read a workload, Pod input or output within its budget. Check the API and repeat the local observations separately before judging adoption. [Cause and check](guides#guide=admission-metrics&section=q121-admission-current-observation-failure)
diagnostics.probe_0_3: The adoption observer may stop before identifying a condition when its local process or frozen inputs fail. Check the workstation tooling, supplied contract and access to both consumers. [Cause and check](guides#guide=admission-metrics&section=q121-admission-adoption-observer-input)
