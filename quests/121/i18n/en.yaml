title: Admission webhook recovery
brief: 'A private validating webhook has an obsolete URL path, so fail-closed admission prevents the route
  ConfigMap from being created. Inspect the one read-only ValidatingWebhookConfiguration named dq-webhook-<bay
  id>. Request the bounded path repair by writing {"action":"restore-path"} to webhook-repair.json; the
  normal game poll can restore only the original server /validate endpoint. Then repair route.json to
  data.route north-121 and apply it. Keep failurePolicy Fail, CA verification and the exact namespace
  scope. Prove the application works and a server-side dry-run with route closed is denied. You cannot
  disable or redirect this policy.


  Quest files in `~/quest` (some appear in later stages): `board.json`, `service.json`, `client.json`,
  `route.json`, `webhook-repair.json`, `admission-ca.pem`, `admission-target.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: The original scoped webhook serves its valid path, admits north-121, rejects
  closed and the real board responds north-121.'
debrief: Recovery restored webhook availability while preserving its validation and isolation boundaries.
stages.0.brief: 'The original scoped webhook serves its valid path, admits north-121, rejects closed and
  the real board responds north-121.


  Success criteria: The original scoped webhook serves its valid path, admits north-121, rejects closed
  and the real board responds north-121.'
stages.0.objectives.0.text: The original scoped webhook serves its valid path, admits north-121, rejects
  closed and the real board responds north-121.
hints.0.text: Fail-closed distinguishes an unreachable webhook from a rejected object.
hints.1.text: The configuration is read-only; the repair request cannot change namespace scope, CA or
  server.
hints.2.text: Request restore-path, repair data.route, then test both admission outcomes.
phrases.0: I distinguished webhook transport failure from policy denial.
phrases.1: I preserved fail-closed validation and namespace scope.
phrases.2: I tested both admitted and denied API requests.
questions.0.points.0: FailurePolicy Fail rejects the request when validation cannot run.
questions.0.points.1: Distinguish transport errors from explicit policy decisions.
questions.0.prompt: Why can a valid object fail while a webhook is unavailable?
questions.1.points.0: Restrict resource rules and namespace selection.
questions.1.points.1: Use bounded timeouts, TLS and an independently recoverable service.
questions.1.prompt: How do you limit the blast radius of an admission webhook?
