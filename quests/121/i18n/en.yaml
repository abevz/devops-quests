title: Admission webhook recovery
brief: |-
  Route updates are not reaching the workload. Restore the private admission contract and the expected allowed and rejected results.

  Work on the workstation in `~/quest` with the supplied files:
  - `board.yaml`, `service.yaml`, `client.yaml`, `route.yaml`, `webhook-repair.json`, `admission-ca.pem`, `admission-target.json`.

  The control interface is documented in `~/quest/control/README.md`.

  **Requirements:**

  - The bay-scoped admission callback retains the supplied identity, private CA, namespace boundary and fail-closed timeout contract, and reaches its intended private endpoint.
  - The existing route configuration contains `north-121`, and its server-side admission dry-run succeeds.
  - A server-side admission dry-run of the closed route is rejected with the private webhook’s route validation error.
  - Deployment `board` has one ready replica, and `http://board:8080` returns `north-121` to Deployment `client`.

  Checks observe current callback configuration and admission decisions, not the complete recovery history.
debrief: The current webhook configuration, route, response and valid and invalid dry-runs matched the
  checks.
stages.0.brief: The admission configuration stays read-only; recovery stays within the supplied adapter.
hints.0.text: Fail-closed distinguishes an unreachable webhook from a rejected object. The supplied callback
  URL refers to a retired path, so fail-closed admission blocks the route ConfigMap before it reaches
  the workload.
hints.1.text: |-
  The configuration is read-only; the repair request cannot change namespace scope, CA or server.

  Inspect the supplied inputs and live observations:

  ```sh
  name="dq-webhook-${DQ_NAMESPACE#dq-}"
    kubectl get validatingwebhookconfiguration "$name" -o yaml
    kubectl get namespace "$DQ_NAMESPACE" -o yaml
    kubectl get deployment board -o yaml
    cat admission-target.json admission-ca.pem webhook-agent-status.json
  ```
hints.2.text: |-
  Request restore-path, repair data.route, then test both admission outcomes. Write `{"action":"restore-path"}` to `webhook-repair.json` and wait for the bounded agent; it can restore only the supplied server path.

  Verify the result from `~/quest` on the workstation:

  - The current route is admitted without persisting a change; the consumer receives `north-121`.

    ```sh
    kubectl get configmap route -o json |
      jq 'del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields)' |
      kubectl apply --dry-run=server -f -
    kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080
    ```

  - The dry-run fails with `Station route must be north-121` and changes no stored object.

    ```sh
    kubectl get configmap route -o json |
      jq '.data.route="closed" | del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields)' |
      kubectl apply --dry-run=server -f -
    ```
phrases.0: I distinguished webhook transport failure from policy denial.
phrases.1: I preserved fail-closed validation and namespace scope.
phrases.2: I tested both admitted and denied API requests.
questions.0.points.0: FailurePolicy Fail rejects the request when validation cannot run.
questions.0.points.1: Distinguish transport errors from explicit policy decisions.
questions.0.prompt: Why can a valid object fail while a webhook is unavailable?
questions.1.points.0: Restrict resource rules and namespace selection.
questions.1.points.1: Use bounded timeouts, TLS and an independently recoverable service.
questions.1.prompt: How do you limit the blast radius of an admission webhook?
diagnostics.count: webhook configuration webhooks length must equal 1.
diagnostics.name: webhook name must equal route.training.devops-quests.local.
diagnostics.failure_policy: webhook failurePolicy must equal Fail.
diagnostics.timeout: webhook timeoutSeconds must equal 2.
diagnostics.url: webhook clientConfig.url must equal `https://dq-webhook-<bay>:8443/validate` for this
  bay.
diagnostics.ca: webhook caBundle must contain the same single certificate as admission-ca.pem, regardless of PEM formatting.
diagnostics.namespace: The bay installation label must be nonempty, and webhook namespaceSelector must
  exactly match its installation and run labels.
diagnostics.route: configmap/route data.route must equal north-121.
diagnostics.ready: deployment/board readyReplicas must equal 1.
diagnostics.http: The request to board:8080 must return north-121.
diagnostics.valid: Preparing the route input and its server dry-run must succeed.
diagnostics.invalid_input: Preparing the closed route dry-run input must succeed.
diagnostics.denial: The server dry-run must reject route closed.
diagnostics.denial_text: The denial must contain Station route must be north-121.
