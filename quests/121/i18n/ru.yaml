title: Восстановление admission webhook
brief: 'Работайте в `~/quest`; изучите `route.json`, `webhook-repair.json`, `admission-ca.pem`, `admission-target.json`, `board.json`, `service.json` и `client.json`. Приватный проверяющий webhook имеет устаревший URL, поэтому fail-closed admission блокирует ConfigMap маршрута. Webhook — это вызов API, который может разрешить или отклонить запрос. Его конфигурация доступна игроку только для чтения.


  Запишите `{"action":"restore-path"}` в `webhook-repair.json` и дождитесь ограниченного агента песочницы; он может восстановить только путь выданного сервера. Конфигурация `dq-webhook-<bay id>` должна содержать один webhook с именем `route.training.devops-quests.local`, `failurePolicy: Fail`, `timeoutSeconds: 2` и URL `https://dq-webhook-<bay id>:8443/validate`. Его пакет CA должен совпадать с `admission-ca.pem`, а селектор пространства имён — с метками песочницы `devops-quests.installation` и `devops-quests.run`. Эти точные поля сохраняют единственный исходный ограниченный вызов, который может восстановить агент.


  Примените `data.route: north-121`. Проверьте одну готовую реплику board, ответ `north-121` на HTTP клиента к `board:8080` и серверные проверки dry-run: допустимый маршрут должен пройти, а `closed` должен быть отклонён с `Station route must be north-121`. Проверки наблюдают текущую конфигурацию и решения, но не доказывают всю историю восстановления. Работайте только в офлайн-песочнице.'
debrief: Текущая конфигурация webhook, маршрут, ответ и допустимая и недопустимая проверки dry-run соответствовали проверкам.
stages.0.brief: Ограниченная конфигурация webhook, маршрут, готовый board, ответ клиента и обе проверки admission dry-run соответствуют заданию.
stages.0.objectives.0.text: Ограниченная конфигурация webhook, маршрут, готовый board, ответ клиента и обе проверки admission dry-run соответствуют заданию.
hints.0.text: Fail-closed различает недоступный webhook и отклонённый объект.
hints.1.text: Конфигурация только для чтения; запрос ремонта не меняет namespace,
  CA и сервер.
hints.2.text: Запросите restore-path, исправьте data.route и проверьте оба исхода
  допуска.
phrases.0: Я отличил сбой связи с webhook от отказа policy.
phrases.1: Я сохранил валидацию fail-closed и область namespace.
phrases.2: Я проверил допущенные и отклонённые API-запросы.
questions.0.points.0: FailurePolicy Fail отклоняет запрос, если валидация не выполняется.
questions.0.points.1: Различайте сбои связи и явные решения policy.
questions.0.prompt: Почему допустимый объект может не пройти при недоступном webhook?
questions.1.points.0: Ограничьте правила ресурсов и выбор namespace.
questions.1.points.1: Используйте ограниченные таймауты, TLS и отдельно восстанавливаемый
  сервис.
questions.1.prompt: Как ограничить область воздействия admission webhook?
