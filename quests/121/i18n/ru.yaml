title: Восстановление admission webhook
brief: 'Обновления маршрута не доходят до нагрузки. Восстановите частный контракт admission и ожидаемые разрешённые
  и отклонённые результаты.


  Работайте на workstation в `~/quest` с предоставленными файлами:

  - `board.yaml`, `service.yaml`, `client.yaml`, `route.yaml`, `webhook-repair.json`, `admission-ca.pem`, `admission-target.json`.


  Интерфейс управления станцией описан в `~/quest/control/README.md`.


  **Requirements:**


  - Callback admission в пределах bay сохраняет предоставленные идентичность, частный CA, границу namespace и контракт
  тайм-аута с закрытым отказом и достигает своего целевого частного endpoint.

  - Существующая конфигурация маршрута содержит `north-121`, и её пробный admission на сервере проходит успешно.

  - Пробный admission закрытого маршрута на сервере отклоняется с ошибкой проверки маршрута от частного webhook.

  - Deployment `board` имеет одну готовую реплику, а `http://board:8080` возвращает `north-121` в Deployment `client`.
  Оба потребителя из `adoption-contract.json` используют проверяемую политикой запись и ключ в желаемой конфигурации
  и текущих готовых Pod, читают и возвращают допущенный маршрут, сохраняя исходные программы запуска, идентичности
  нагрузок и образы. Промежуточная запись неизменна; файловый вход доступен только для чтения.


  Проверки наблюдают текущую конфигурацию callback и решения admission, а не полную историю восстановления.


  Роли потребителей, пути входных данных и ограничения сохранения описаны в `adoption-contract.json`.'
debrief: Защищённый callback, оба исхода admission и текущее принятие данных потребителями прошли проверки. Снимки
  конфигурации и ответы отражают текущее состояние, а не полную историю восстановления.
stages.0.brief: Конфигурация admission остаётся только для чтения; восстановление ограничено предоставленным адаптером.
hints.0.text: Транспортный отказ при fail-closed и отклонение политикой — разные результаты. Admission управляет
  записью через API, но не обновляет окружение, захваченное при запуске, или файл, привязанный через subPath. Проследите
  публикацию и поколения обоих потребителей как отдельные границы.
hints.1.text: 'Сравните callback, решения admission, источники входов потребителей и текущие Pod. Контракт описывает
  время жизни входов и сохраняемые контрольные объекты; квитанция относится только к запросу управления.


  ```sh

  cd ~/quest

  cat adoption-contract.json webhook-agent-status.json admission-target.json

  name="dq-webhook-${DQ_NAMESPACE#dq-}"

  kubectl get validatingwebhookconfiguration "$name" -o yaml

  kubectl get deployment,replicaset,pods,configmap -o yaml

  ```'
hints.2.text: "Проверьте успешный и отклонённый серверные dry-run, ответ приложения и обоих потребителей. Желаемые\
  \ ссылки на источник и входы работающих Pod должны соответствовать записи, проверяемой политикой; одного исправного\
  \ HTTP недостаточно.\n\n```sh\ncd ~/quest\nkubectl get configmap route -o json |\n  jq 'del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields)'\
  \ |\n  kubectl apply --dry-run=server -f -\nkubectl get configmap route -o json |\n  jq '.data.route=\"closed\"\
  \ | del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields)' |\n  kubectl\
  \ apply --dry-run=server -f -\nkubectl exec deployment/client -- wget -qO- -T 3 http://board:8080\nkubectl exec\
  \ deployment/route-env -- printenv ROUTE\nkubectl exec deployment/route-file -- cat /config/route\nfor name in\
  \ route-env route-file; do\n  kubectl exec \"deployment/$name\" -- wget -qO- -T 3 http://127.0.0.1:8080\ndone\n\
  kubectl get deployment,replicaset,pods -o yaml\n```"
phrases.0: Я отличил сбой связи с webhook от отказа policy.
phrases.1: Я сохранил валидацию fail-closed и область namespace.
phrases.2: Я проверил допущенные и отклонённые API-запросы.
questions.0.points.0: FailurePolicy Fail отклоняет запрос, если валидация не выполняется.
questions.0.points.1: Различайте сбои связи и явные решения policy.
questions.0.prompt: Почему допустимый объект может не пройти при недоступном webhook?
questions.1.points.0: Ограничьте правила ресурсов и выбор namespace.
questions.1.points.1: Используйте ограниченные таймауты, TLS и отдельно восстанавливаемый сервис.
questions.1.prompt: Как ограничить область воздействия admission webhook?
stages.0.objectives.0.text: Callback admission в пределах bay сохраняет предоставленные идентичность, частный CA,
  границу namespace и контракт тайм-аута с закрытым отказом и достигает своего целевого частного endpoint.
stages.0.objectives.1.text: Существующая конфигурация маршрута содержит `north-121`, и её пробный admission на сервере
  проходит успешно.
stages.0.objectives.2.text: Пробный admission закрытого маршрута на сервере отклоняется с ошибкой проверки маршрута
  от частного webhook.
stages.0.objectives.3.text: Deployment `board` имеет одну готовую реплику, а `http://board:8080` возвращает `north-121`
  в Deployment `client`. Оба потребителя из `adoption-contract.json` используют проверяемую политикой запись и ключ
  в желаемой конфигурации и текущих готовых Pod, читают и возвращают допущенный маршрут, сохраняя исходные программы
  запуска, идентичности нагрузок и образы. Промежуточная запись неизменна; файловый вход доступен только для чтения.
diagnostics.count: Конфигурация стенда могла отсутствовать или содержать лишние webhook. Проверьте, что в ней ровно одна запись. [Причина и проверка](guides#guide=admission-metrics&section=q121-admission-single-webhook)
diagnostics.name: Запись webhook могли переименовать или заменить. Проверьте route.training.devops-quests.local в действующей конфигурации стенда. [Причина и проверка](guides#guide=admission-metrics&section=q121-admission-webhook-identity)
diagnostics.failure_policy: Обходное решение могло изменить failurePolicy на Ignore. Сохраните Fail, чтобы недоступный webhook не пропускал проверку молча. [Причина и проверка](guides#guide=admission-metrics&section=q121-admission-failure-mode)
diagnostics.timeout: При диагностике доступности могли изменить тайм-аут webhook. Проверьте, что timeoutSeconds по-прежнему равен 2. [Причина и проверка](guides#guide=admission-metrics&section=q121-admission-timeout-seconds)
diagnostics.url: Валидатор мог ссылаться на выведенный из работы путь или другой адрес. Проверьте HTTPS URL webhook стенда на порту 8443 и путь /validate. [Причина и проверка](guides#guide=admission-metrics&section=q121-admission-validation-endpoint)
diagnostics.ca: CA bundle мог отсутствовать, иметь неверный формат или содержать другой сертификат. Сравните единственный декодированный сертификат с admission-ca.pem. [Причина и проверка](guides#guide=admission-metrics&section=q121-admission-certificate-authority)
diagnostics.namespace: Селектор мог пропустить метку запуска или установки либо охватить другой namespace. Сравните его с двумя выданными метками и сохраните это точное ограничение. [Причина и проверка](guides#guide=admission-metrics&section=q121-admission-sandbox-namespace-selector)
diagnostics.route: В живом ConfigMap route могло остаться старое значение, либо он не читается. Проверьте north-121 в ключе route фактического объекта. [Причина и проверка](guides#guide=admission-metrics&section=q121-admission-current-route-record)
diagnostics.valid: Даже верный объект мог не пройти серверный dry-run из-за недоступного webhook или CA. Сравните результат серверного dry-run с фактической записью route. [Причина и проверка](guides#guide=admission-metrics&section=q121-admission-accepted-dry-run)
diagnostics.invalid_input: Объект route мог отсутствовать либо содержать некорректный JSON, из-за чего не формируется вход dry-run со значением closed. Проверьте вход перед оценкой отказа. [Причина и проверка](guides#guide=admission-metrics&section=q121-admission-denied-dry-run-input)
diagnostics.denial: Изменённое значение могло пройти проверку из-за неверной области или пути webhook. Выполните серверный dry-run с closed и убедитесь в отказе. [Причина и проверка](guides#guide=admission-metrics&section=q121-admission-reject-closed-route)
diagnostics.denial_text: Общая ошибка TLS или транспорта могла отклонить dry-run до проверки значения. Убедитесь, что ошибка содержит Station route must be north-121. [Причина и проверка](guides#guide=admission-metrics&section=q121-admission-exact-validation-denial)
diagnostics.ready: Восстановленный маршрут мог проходить проверку, пока worker board ещё запускается или не готов. Проверьте rollout и дождитесь одной готовой реплики. [Причина и проверка](guides#guide=admission-metrics&section=q121-admission-board-ready-count)
diagnostics.http: Успешный dry-run возможен при старом ответе board или недоступном сервисе. Запросите board из client и сравните фактическое тело с north-121. [Причина и проверка](guides#guide=admission-metrics&section=q121-admission-board-live-response)
diagnostics.probe_0_0: Проверка webhook может остановиться до указания условия, если недоступны инструменты или входные файлы. Проверьте инструменты, выданный CA и доступ к namespace. [Причина и проверка](guides#guide=admission-metrics&section=q121-admission-config-observer-input)
diagnostics.adoption_identity: Выданную нагрузку могли пересоздать либо заменить образ в шаблоне или Pod. Сверьте текущие UID и образы с зафиксированной записью принятия. [Причина и проверка](guides#guide=admission-metrics&section=q121-admission-retained-consumer-identities)
diagnostics.adoption_staging: Правка staged-route под принятый объект могла изменить исходные данные либо UID. Сравните всю запись staging с исходной и подключите потребителей к фактическому ConfigMap route. [Причина и проверка](guides#guide=admission-metrics&section=q121-admission-preserved-staged-record)
diagnostics.adoption_record: Конфигурация потребителей могла устареть или отсутствовать. Убедитесь, что фактический принятый ConfigMap route содержит north-121 в ключе route. [Причина и проверка](guides#guide=admission-metrics&section=q121-admission-source-route-record)
diagnostics.adoption_current: После rollout у потребителя может не быть ровно одного текущего готового Pod своего Deployment. Проверьте rollout обоих Deployment и их текущие Pod. [Причина и проверка](guides#guide=admission-metrics&section=q121-admission-current-consumer-pods)
diagnostics.adoption_program: Правка команды или аргументов запуска могла скрыть неверный вход. Сравните желаемую и фактическую программу с выданной и исправьте ссылку на источник. [Причина и проверка](guides#guide=admission-metrics&section=q121-admission-preserved-startup-program)
diagnostics.adoption_source: Потребитель мог ещё ссылаться на staged-route, использовать литерал или неоднозначную проекцию файла. Проверьте route/route в шаблоне и текущем Pod. Нужна уникальная ссылка ROUTE или монтирование файла только для чтения. [Причина и проверка](guides#guide=admission-metrics&section=q121-admission-adopted-config-reference)
diagnostics.adoption_input: Конфигурация может быть верной, пока работающий потребитель видит старое окружение или файл. Прочитайте фактические ROUTE и /config/route и сравните с north-121. [Причина и проверка](guides#guide=admission-metrics&section=q121-admission-live-consumer-input)
diagnostics.adoption_output: Потребитель мог читать верный вход, но отдавать старое содержимое со старта. Запросите loopback у каждого текущего потребителя и сравните с north-121. [Причина и проверка](guides#guide=admission-metrics&section=q121-admission-live-consumer-publication)
diagnostics.adoption_observation: Наблюдение могло не прочитать нагрузку, вход Pod или ответ за отведённое время. Проверьте API и повторите локальные наблюдения отдельно перед оценкой принятия. [Причина и проверка](guides#guide=admission-metrics&section=q121-admission-current-observation-failure)
diagnostics.probe_0_3: Проверка принятия может остановиться до указания условия при ошибке процесса или исходных данных. Проверьте инструменты станции, выданный контракт и доступ к обоим потребителям. [Причина и проверка](guides#guide=admission-metrics&section=q121-admission-adoption-observer-input)
