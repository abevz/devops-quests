title: Восстановление admission webhook
brief: 'У приватного validating webhook устарел URL path, поэтому допуск fail-closed не создаёт ConfigMap
  route. Изучите доступный только для чтения ValidatingWebhookConfiguration dq-webhook-<id песочницы>.
  Запросите ограниченное исправление пути, записав {"action":"restore-path"} в webhook-repair.json; обычный
  опрос игры может вернуть только /validate исходного сервера. Затем исправьте route.json на data.route
  north-121 и примените. Сохраните failurePolicy Fail, проверку CA и точную область namespace. Проверьте
  приложение и отказ server-side dry-run с route closed. Отключить или перенаправить policy нельзя.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `board.json`, `service.json`, `client.json`,
  `route.json`, `webhook-repair.json`, `admission-ca.pem`, `admission-target.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Исходный webhook с прежней областью работает по верному пути, допускает north-121,
  отклоняет closed; табло действительно отвечает north-121.'
debrief: Восстановлена доступность webhook с сохранением валидации и границ изоляции.
stages.0.brief: 'Исходный webhook с прежней областью работает по верному пути, допускает north-121, отклоняет
  closed; табло действительно отвечает north-121.


  Результат проверки: Исходный webhook с прежней областью работает по верному пути, допускает north-121,
  отклоняет closed; табло действительно отвечает north-121.'
stages.0.objectives.0.text: Исходный webhook с прежней областью работает по верному пути, допускает north-121,
  отклоняет closed; табло действительно отвечает north-121.
hints.0.text: Fail-closed различает недоступный webhook и отклонённый объект.
hints.1.text: Конфигурация только для чтения; запрос ремонта не меняет namespace, CA и сервер.
hints.2.text: Запросите restore-path, исправьте data.route и проверьте оба исхода допуска.
phrases.0: Я отличил сбой связи с webhook от отказа policy.
phrases.1: Я сохранил валидацию fail-closed и область namespace.
phrases.2: Я проверил допущенные и отклонённые API-запросы.
questions.0.points.0: FailurePolicy Fail отклоняет запрос, если валидация не выполняется.
questions.0.points.1: Различайте сбои связи и явные решения policy.
questions.0.prompt: Почему допустимый объект может не пройти при недоступном webhook?
questions.1.points.0: Ограничьте правила ресурсов и выбор namespace.
questions.1.points.1: Используйте ограниченные таймауты, TLS и отдельно восстанавливаемый сервис.
questions.1.prompt: Как ограничить область воздействия admission webhook?
