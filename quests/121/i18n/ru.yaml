title: Восстановление admission webhook
brief: "Обновления маршрута не доходят до нагрузки. Восстановите частный контракт admission и ожидаемые разрешённые\
  \ и отклонённые результаты.\n\nРаботайте в `~/quest` на рабочей станции. Предоставлены файлы: `route.json`, `webhook-repair.json`,\
  \ `admission-ca.pem`, `admission-target.json`, `board.json`, `service.json`, `client.json`.\n\n**Requirements:**\n\
  \n- Ограниченный песочницей валидирующий webhook доверяет своему частному CA и имеет один callback `route.training.devops-quests.local`,\
  \ политику отказа `Fail` и таймаут `2` секунды.\n  - Конечная точка callback соответствует `admission-target.json`,\
  \ а CA — `admission-ca.pem`, оба файла в `~/quest` на рабочей станции. Область пространств имён соответствует\
  \ текущим меткам песочницы `devops-quests.installation` и `devops-quests.run`; конфигурация `dq-webhook-${DQ_NAMESPACE#dq-}`\
  \ доступна игроку только для чтения.\n- ConfigMap `route` содержит маршрут `north-121`, а его серверная пробная\
  \ проверка admission успешна (dry-run).\n- Серверная пробная проверка с маршрутом `closed` отклоняется с `Station\
  \ route must be north-121` (dry-run).\n- Deployment `board` имеет одну готовую реплику, а `http://board:8080`\
  \ возвращает `north-121` в Deployment `client`.\n\n**Verify yourself before Check & finish:** Выполните эти команды\
  \ наблюдения из `~/quest` на рабочей станции.\n\n- Настройки, идентичности и состояние соответствуют требованиям.\n\
  \n  ```sh\n  name=\"dq-webhook-${DQ_NAMESPACE#dq-}\"\n  kubectl get validatingwebhookconfiguration \"$name\" -o\
  \ yaml\n  kubectl get namespace \"$DQ_NAMESPACE\" -o yaml\n  kubectl get deployment board -o yaml\n  cat admission-target.json\
  \ admission-ca.pem\n  ```\n\n- Текущий маршрут допускается без сохранения изменения; потребитель получает `north-121`.\n\
  \n  ```sh\n  kubectl get configmap route -o json |\n    jq 'del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields)'\
  \ |\n    kubectl apply --dry-run=server -f -\n  kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080\n\
  \  ```\n\n- Пробный запрос отклоняется с `Station route must be north-121` и не меняет сохранённый объект (dry-run).\n\
  \n  ```sh\n  kubectl get configmap route -o json |\n    jq '.data.route=\"closed\" | del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields)'\
  \ |\n    kubectl apply --dry-run=server -f -\n  ```\n\nПроверки наблюдают текущую конфигурацию callback и решения\
  \ admission, а не полную историю восстановления."
debrief: Текущая конфигурация webhook, маршрут, ответ и допустимая и недопустимая проверки dry-run соответствовали
  проверкам.
stages.0.brief: Ограниченный callback admission должен обеспечивать требуемый маршрут и позволять нагрузке его обслуживать.
hints.0.text: Fail-closed различает недоступный webhook и отклонённый объект. Предоставленный URL callback указывает
  на выведенный путь, поэтому fail-closed admission блокирует ConfigMap маршрута до поступления в нагрузку.
hints.1.text: Конфигурация только для чтения; запрос ремонта не меняет namespace, CA и сервер.
hints.2.text: Запросите restore-path, исправьте data.route и проверьте оба исхода допуска. Запишите `{"action":"restore-path"}`
  в `webhook-repair.json` и дождитесь ограниченного агента; он восстанавливает только предоставленный путь сервера.
phrases.0: Я отличил сбой связи с webhook от отказа policy.
phrases.1: Я сохранил валидацию fail-closed и область namespace.
phrases.2: Я проверил допущенные и отклонённые API-запросы.
questions.0.points.0: FailurePolicy Fail отклоняет запрос, если валидация не выполняется.
questions.0.points.1: Различайте сбои связи и явные решения policy.
questions.0.prompt: Почему допустимый объект может не пройти при недоступном webhook?
questions.1.points.0: Ограничьте правила ресурсов и выбор namespace.
questions.1.points.1: Используйте ограниченные таймауты, TLS и отдельно восстанавливаемый сервис.
questions.1.prompt: Как ограничить область воздействия admission webhook?
diagnostics.count: webhook configuration webhooks length должен совпадать с 1.
diagnostics.name: webhook name должен совпадать с route.training.devops-quests.local.
diagnostics.failure_policy: webhook failurePolicy должен совпадать с Fail.
diagnostics.timeout: webhook timeoutSeconds должен совпадать с 2.
diagnostics.url: webhook clientConfig.url должен совпадать с `https://dq-webhook-<bay>:8443/validate` для этой песочницы.
diagnostics.ca: webhook caBundle должен быть корректным base64 и совпадать с непустым admission-ca.pem после удаления
  пробелов по краям.
diagnostics.namespace: Метка установки песочницы должна быть непустой, а webhook namespaceSelector должен точно
  совпадать с её метками установки и запуска.
diagnostics.route: configmap/route data.route должен совпадать с north-121.
diagnostics.ready: deployment/board readyReplicas должен совпадать с 1.
diagnostics.http: Запрос к board:8080 должен вернуть north-121.
diagnostics.valid: Подготовка route и его серверный dry-run должны завершиться успешно.
diagnostics.invalid_input: Подготовка данных dry-run для route closed должна завершиться успешно.
diagnostics.denial: Серверный dry-run должен отклонить route closed.
diagnostics.denial_text: Отказ должен содержать Station route must be north-121.
stages.0.objectives.0.text: Ограниченный песочницей валидирующий webhook доверяет своему частному CA и имеет один
  callback `route.training.devops-quests.local`, политику отказа `Fail` и таймаут `2` секунды.
stages.0.objectives.1.text: ConfigMap `route` содержит маршрут `north-121`, а его серверная пробная проверка admission
  успешна (dry-run).
stages.0.objectives.2.text: Серверная пробная проверка с маршрутом `closed` отклоняется с `Station route must be
  north-121` (dry-run).
stages.0.objectives.3.text: Deployment `board` имеет одну готовую реплику, а `http://board:8080` возвращает `north-121`
  в Deployment `client`.
