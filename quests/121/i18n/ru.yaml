title: Восстановление admission webhook
brief: |-
  Обновления маршрута не доходят до нагрузки. Восстановите частный контракт admission и ожидаемые разрешённые и отклонённые результаты.

  Работайте на workstation в `~/quest` с предоставленными файлами:
  - `board.yaml`, `service.yaml`, `client.yaml`, `route.yaml`, `webhook-repair.json`, `admission-ca.pem`, `admission-target.json`.

  **Requirements:**

  - Callback admission в пределах bay сохраняет предоставленные идентичность, частный CA, границу namespace и контракт тайм-аута с закрытым отказом и достигает своего целевого частного endpoint.
  - Существующая конфигурация маршрута содержит `north-121`, и её пробный admission на сервере проходит успешно.
  - Пробный admission закрытого маршрута на сервере отклоняется с ошибкой проверки маршрута от частного webhook.
  - Deployment `board` имеет одну готовую реплику, а `http://board:8080` возвращает `north-121` в Deployment `client`.

  Проверки наблюдают текущую конфигурацию callback и решения admission, а не полную историю восстановления.
debrief: Текущая конфигурация webhook, маршрут, ответ и допустимая и недопустимая проверки dry-run соответствовали
  проверкам.
stages.0.brief: Конфигурация admission остаётся только для чтения; восстановление ограничено предоставленным
  адаптером.
hints.0.text: Fail-closed различает недоступный webhook и отклонённый объект. Предоставленный URL callback
  указывает на выведенный путь, поэтому fail-closed admission блокирует ConfigMap маршрута до поступления
  в нагрузку.
hints.1.text: |-
  Конфигурация только для чтения; запрос ремонта не меняет namespace, CA и сервер.

  Изучите предоставленные файлы и живые наблюдения:

  ```sh
  name="dq-webhook-${DQ_NAMESPACE#dq-}"
    kubectl get validatingwebhookconfiguration "$name" -o yaml
    kubectl get namespace "$DQ_NAMESPACE" -o yaml
    kubectl get deployment board -o yaml
    cat admission-target.json admission-ca.pem
  ```
hints.2.text: |-
  Запросите restore-path, исправьте data.route и проверьте оба исхода допуска. Запишите `{"action":"restore-path"}` в `webhook-repair.json` и дождитесь ограниченного агента; он восстанавливает только предоставленный путь сервера.

  Проверьте результат из `~/quest` на workstation:

  - Текущий маршрут допускается без сохранения изменения; потребитель получает `north-121`.

    ```sh
    kubectl get configmap route -o json |
      jq 'del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields)' |
      kubectl apply --dry-run=server -f -
    kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080
    ```

  - Пробный запрос отклоняется с `Station route must be north-121` и не меняет сохранённый объект (dry-run).

    ```sh
    kubectl get configmap route -o json |
      jq '.data.route="closed" | del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields)' |
      kubectl apply --dry-run=server -f -
    ```
phrases.0: Я отличил сбой связи с webhook от отказа policy.
phrases.1: Я сохранил валидацию fail-closed и область namespace.
phrases.2: Я проверил допущенные и отклонённые API-запросы.
questions.0.points.0: FailurePolicy Fail отклоняет запрос, если валидация не выполняется.
questions.0.points.1: Различайте сбои связи и явные решения policy.
questions.0.prompt: Почему допустимый объект может не пройти при недоступном webhook?
questions.1.points.0: Ограничьте правила ресурсов и выбор namespace.
questions.1.points.1: Используйте ограниченные таймауты, TLS и отдельно восстанавливаемый сервис.
questions.1.prompt: Как ограничить область воздействия admission webhook?
diagnostics.count: webhook configuration webhooks length должен совпадать с 1.
diagnostics.name: webhook name должен совпадать с route.training.devops-quests.local.
diagnostics.failure_policy: webhook failurePolicy должен совпадать с Fail.
diagnostics.timeout: webhook timeoutSeconds должен совпадать с 2.
diagnostics.url: webhook clientConfig.url должен совпадать с `https://dq-webhook-<bay>:8443/validate`
  для этой песочницы.
diagnostics.ca: webhook caBundle должен содержать тот же единственный сертификат, что и admission-ca.pem, независимо от оформления PEM.
diagnostics.namespace: Метка установки песочницы должна быть непустой, а webhook namespaceSelector должен
  точно совпадать с её метками установки и запуска.
diagnostics.route: configmap/route data.route должен совпадать с north-121.
diagnostics.ready: deployment/board readyReplicas должен совпадать с 1.
diagnostics.http: Запрос к board:8080 должен вернуть north-121.
diagnostics.valid: Подготовка route и его серверный dry-run должны завершиться успешно.
diagnostics.invalid_input: Подготовка данных dry-run для route closed должна завершиться успешно.
diagnostics.denial: Серверный dry-run должен отклонить route closed.
diagnostics.denial_text: Отказ должен содержать Station route must be north-121.
stages.0.objectives.0.text: Callback admission в пределах bay сохраняет предоставленные идентичность,
  частный CA, границу namespace и контракт тайм-аута с закрытым отказом и достигает своего целевого частного
  endpoint.
stages.0.objectives.1.text: Существующая конфигурация маршрута содержит `north-121`, и её пробный admission
  на сервере проходит успешно.
stages.0.objectives.2.text: Пробный admission закрытого маршрута на сервере отклоняется с ошибкой проверки
  маршрута от частного webhook.
stages.0.objectives.3.text: Deployment `board` имеет одну готовую реплику, а `http://board:8080` возвращает
  `north-121` в Deployment `client`.
