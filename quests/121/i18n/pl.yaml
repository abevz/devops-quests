diagnostics.probe_0_0: 'Bieżące dane nie pozwalają potwierdzić tego celu: Callback admission ograniczony do bay
  zachowuje dostarczoną tożsamość, prywatne CA, granicę namespace i kontrakt limitu czasu z blokowaniem przy awarii
  oraz dociera do zamierzonego prywatnego endpointu.'
diagnostics.adoption_identity: Pierwotna tożsamość obciążenia lub dostarczony obraz różni się. Odtworzenie Deploymentu
  lub zmiana obrazu szablonu/bieżącego Poda nie zachowuje istniejącej topologii.
diagnostics.adoption_staging: Zmieniono tożsamość lub dane rekordu przejściowego. To zachowywana kontrola; edycja
  kopii nie oznacza przyjęcia sprawdzanego źródła.
diagnostics.adoption_record: Chroniony rekord nie zawiera dopuszczonej trasy. Przywrócenie callback samo nie publikuje
  dopuszczalnych danych.
diagnostics.adoption_current: Odbiorca nie ma dokładnie jednego bieżącego gotowego należącego do niego Poda. Trwający
  rollout lub obcy Pod nie potwierdza bieżącego przyjęcia danych.
diagnostics.adoption_program: Zmieniono polecenie lub argumenty startowe odbiorcy. Zachowaj dostarczony program,
  aby wejścia i odpowiedzi odpowiadały opisanemu zachowaniu.
diagnostics.adoption_source: Żądane lub bieżące wejście nie wskazuje sprawdzanego rekordu i klucza. Skopiowana wartość
  lub niesprawdzany klucz nie potwierdza przyjęcia danych.
diagnostics.adoption_input: Działający odbiorca nadal odczytuje inną trasę. Środowisko i subPath mogą zachować stan
  startowy po zmianie źródła.
diagnostics.adoption_output: Odpowiedź odbiorcy różni się od dopuszczonej trasy. Migawka startowa może nadal zawierać
  stare dane mimo poprawnego obiektu API.
diagnostics.adoption_observation: Nie udało się zaobserwować bieżącego przyjęcia danych w ograniczonym czasie. Poczekaj
  na dostępność obciążeń i porównaj żywe obiekty oraz wejścia.
diagnostics.probe_0_3: Nie udało się zaobserwować bieżącego przyjęcia danych w ograniczonym czasie. Poczekaj na
  dostępność obciążeń i porównaj żywe obiekty oraz wejścia.
