title: Odzyskiwanie webhooka dostępu
brief: 'Pracuj w `~/quest`; przeczytaj `route.json`, `webhook-repair.json`, `admission-ca.pem`, `admission-target.json`, `board.json`, `service.json` i `client.json`. Prywatny webhook walidujący ma stary URL, więc przy fail-closed blokuje ConfigMap trasy. Webhook to wywołanie API, które może dopuścić lub odrzucić żądanie. Gracz ma dostęp tylko do odczytu jego konfiguracji.


  Zapisz `{"action":"restore-path"}` do `webhook-repair.json` i poczekaj na ograniczonego agenta zatoki; może on przywrócić tylko ścieżkę dostarczonego serwera. Konfiguracja `dq-webhook-<bay id>` musi zawierać jeden webhook `route.training.devops-quests.local`, `failurePolicy: Fail`, `timeoutSeconds: 2` i URL `https://dq-webhook-<bay id>:8443/validate`. Jego pakiet CA musi odpowiadać `admission-ca.pem`, a selektor przestrzeni nazw etykietom zatoki `devops-quests.installation` i `devops-quests.run`. Te dokładne pola zachowują jeden pierwotny ograniczony callback obsługiwany przez agenta.


  Zastosuj `data.route: north-121`. Sprawdź jedną gotową replikę board, odpowiedź `north-121` na HTTP klienta do `board:8080` oraz próby serwerowe dry-run: poprawna trasa ma się powieść, a `closed` ma zostać odrzucone z `Station route must be north-121`. Kontrole obserwują bieżącą konfigurację i decyzje; nie dowodzą całej historii odzyskiwania. Pracuj tylko w zatoce offline.'
debrief: Bieżąca konfiguracja webhooka, trasa, odpowiedź oraz poprawna i błędna próby dry-run odpowiadały kontrolom.
stages.0.brief: Ograniczona konfiguracja webhooka, trasa, gotowy board, odpowiedź klienta i obie próby dry-run odpowiadają opisowi.
stages.0.objectives.0.text: Ograniczona konfiguracja webhooka, trasa, gotowy board, odpowiedź klienta i obie próby dry-run odpowiadają opisowi.
hints.0.text: Fail-closed odróżnia nieosiągalny webhook od obiektu odrzuconego.
hints.1.text: Konfiguracja jest tylko do odczytu; żądanie naprawy nie może zmienić zakresu namespace,
  CA ani serwera.
hints.2.text: Poproś o restore-path, napraw data.route, a następnie przetestuj oba wyniki przyjęcia.
phrases.0: Rozróżniłem błąd transportu webhook od odmowy policy.
phrases.1: Zachowałem walidację fail-closed i zakres namespace.
phrases.2: Przetestowałem zarówno przyjęte, jak i odrzucone żądania API.
questions.0.points.0: FailurePolicy Fail odrzuca żądanie, gdy nie można uruchomić sprawdzania poprawności.
questions.0.points.1: Odróżnij błędy transportowe od jawnych decyzji policy.
questions.0.prompt: Dlaczego prawidłowy obiekt może nie działać, gdy webhook jest niedostępny?
questions.1.points.0: Ogranicz reguły zasobów i wybór namespace.
questions.1.points.1: Używaj ograniczonych limitów czasu, TLS i niezależnie odtwarzalnej usługi.
questions.1.prompt: Jak ograniczyć promień wybuchu admission webhook?
