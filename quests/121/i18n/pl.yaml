diagnostics.count: Konfiguracja stanowiska może nie istnieć lub zawierać dodatkowe webhooki. Sprawdź, czy ma dokładnie jeden wpis. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q121-admission-single-webhook)
diagnostics.name: Wpis webhooka mógł zostać przemianowany lub zastąpiony. Sprawdź route.training.devops-quests.local w aktywnej konfiguracji. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q121-admission-webhook-identity)
diagnostics.failure_policy: Obejście mogło zmienić failurePolicy na Ignore. Zachowaj Fail, aby niedostępny webhook nie pomijał walidacji po cichu. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q121-admission-failure-mode)
diagnostics.timeout: Podczas diagnozy dostępności można było zmienić timeout webhooka. Sprawdź, czy timeoutSeconds nadal wynosi 2. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q121-admission-timeout-seconds)
diagnostics.url: Walidator może nadal wskazywać wycofaną ścieżkę lub inny adres. Sprawdź HTTPS URL webhooka stanowiska na porcie 8443 z /validate. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q121-admission-validation-endpoint)
diagnostics.ca: Pakiet CA może nie istnieć, mieć zły format lub zawierać inny certyfikat. Porównaj jedyny zdekodowany certyfikat z admission-ca.pem. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q121-admission-certificate-authority)
diagnostics.namespace: Selektor może pomijać etykietę uruchomienia lub instalacji albo obejmować inną przestrzeń. Porównaj go z dwiema etykietami i zachowaj dokładny zakres. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q121-admission-sandbox-namespace-selector)
diagnostics.route: Aktywna ConfigMap route może mieć starą wartość lub być nieczytelna. Potwierdź north-121 w kluczu route rzeczywistego obiektu. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q121-admission-current-route-record)
diagnostics.valid: Nawet poprawny obiekt może nie przejść serwerowego dry-run z powodu niedostępnego webhooka lub CA. Porównaj wynik serwerowego dry-run z bieżącym route. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q121-admission-accepted-dry-run)
diagnostics.invalid_input: Obiekt route może nie istnieć lub mieć błędny JSON, co blokuje przygotowanie dry-run z closed. Sprawdź wejście przed oceną odpowiedzi serwera. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q121-admission-denied-dry-run-input)
diagnostics.denial: Zmieniona wartość może przejść walidację przez zły zakres lub ścieżkę webhooka. Wykonaj serwerowy dry-run z closed i potwierdź odmowę. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q121-admission-reject-closed-route)
diagnostics.denial_text: Ogólny błąd TLS lub transportu może przerwać dry-run przed walidacją. Sprawdź, czy komunikat zawiera Station route must be north-121. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q121-admission-exact-validation-denial)
diagnostics.ready: Naprawiona trasa może przechodzić walidację, chociaż kontener worker board nadal startuje lub nie jest gotowy. Sprawdź rollout i poczekaj na jedną gotową replikę. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q121-admission-board-ready-count)
diagnostics.http: Udany dry-run może towarzyszyć starej lub niedostępnej odpowiedzi board. Odpytaj board z client i porównaj treść z north-121. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q121-admission-board-live-response)
diagnostics.probe_0_0: Kontrola webhooka może zatrzymać się przed wskazaniem warunku, gdy narzędzia lub dane są niedostępne. Sprawdź narzędzia, CA i dostęp do przestrzeni. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q121-admission-config-observer-input)
diagnostics.adoption_identity: Dostarczone obciążenie mogło zostać odtworzone lub używać innego obrazu w szablonie lub podach. Porównaj bieżące UID i obrazy z zamrożonym zapisem. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q121-admission-retained-consumer-identities)
diagnostics.adoption_staging: Edycja staged-route na wzór przyjętego obiektu mogła zmienić pierwotne dane lub UID. Porównaj pełny zapis staging z pierwotnym i podłącz konsumentów do route. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q121-admission-preserved-staged-record)
diagnostics.adoption_record: Konfiguracja konsumentów może być stara lub nie istnieć. Potwierdź north-121 w kluczu route faktycznie przyjętego ConfigMap route. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q121-admission-source-route-record)
diagnostics.adoption_current: Po wdrożeniu konsument może nie mieć dokładnie jednego bieżącego gotowego poda. Sprawdź oba wdrożenia i ich aktualne pody. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q121-admission-current-consumer-pods)
diagnostics.adoption_program: Zmiana polecenia lub argumentów startu mogła zamaskować niewłaściwe dane. Porównaj żądany i aktywny program z dostarczonym i popraw źródło. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q121-admission-preserved-startup-program)
diagnostics.adoption_source: Konsument może nadal odwoływać się do staged-route albo używać literału lub niejednoznacznej projekcji pliku. Sprawdź route/route w szablonie i podzie przez unikalny ROUTE lub plik tylko do odczytu. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q121-admission-adopted-config-reference)
diagnostics.adoption_input: Konfiguracja może być poprawna, choć konsument nadal widzi starą zmienną lub plik. Odczytaj aktywne ROUTE i /config/route i porównaj z north-121. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q121-admission-live-consumer-input)
diagnostics.adoption_output: Konsument może czytać poprawne dane, ale zwracać stare wyjście startowe. Odpytaj loopback u każdego konsumenta i porównaj z north-121. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q121-admission-live-consumer-publication)
diagnostics.adoption_observation: Kontrola może nie odczytać obciążenia, wejścia poda lub odpowiedzi w limicie czasu. Sprawdź API i powtórz obserwacje osobno przed oceną przyjęcia. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q121-admission-current-observation-failure)
diagnostics.probe_0_3: Kontrola przyjęcia może zatrzymać się przed wskazaniem warunku przez błąd procesu lub danych. Sprawdź narzędzia, dostarczony kontrakt i dostęp do obu konsumentów. [Przyczyna i kontrola](guides#guide=admission-metrics&section=q121-admission-adoption-observer-input)
