title: Odzyskiwanie webhooka dostępu
brief: 'Prywatny validating webhook ma przestarzały URL path, więc zezwolenie fail-closed uniemożliwia
  utworzenie trasy ConfigMap. Sprawdź jedną konfigurację ValidatingWebhookConfiguration tylko do odczytu
  o nazwie dq-webhook-<bay id>. Poproś o naprawę ścieżki ograniczonej, pisząc {"action":"restore-path"}
  do webhook-repair.json; zwykła ankieta gry może przywrócić tylko oryginalny punkt końcowy serwera /validate.
  Następnie napraw route.json do data.route north-121 i zastosuj. Zachowaj weryfikację failurePolicy Fail,
  CA i dokładny zakres namespace. Udowodnij, że aplikacja działa, a server-side dry-run z route closed
  zostało odrzucone. Nie można wyłączyć ani przekierować tego policy.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `board.json`, `service.json`,
  `client.json`, `route.json`, `webhook-repair.json`, `admission-ca.pem`, `admission-target.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: Oryginalny webhook o ograniczonym zakresie obsługuje prawidłową ścieżkę,
  dopuszcza north-121, odrzuca closed, a rzeczywisty board odpowiada north-121.'
debrief: Odzyskiwanie przywróciło dostępność webhook, zachowując jednocześnie granice walidacji i izolacji.
stages.0.brief: 'Kryteria sukcesu: Oryginalny webhook o ograniczonym zakresie obsługuje prawidłową ścieżkę,
  dopuszcza north-121, odrzuca closed, a rzeczywisty board odpowiada north-121.'
stages.0.objectives.0.text: Oryginalny webhook o ograniczonym zakresie obsługuje prawidłową ścieżkę, dopuszcza
  north-121, odrzuca closed, a rzeczywisty board odpowiada north-121.
hints.0.text: Fail-closed odróżnia nieosiągalny webhook od obiektu odrzuconego.
hints.1.text: Konfiguracja jest tylko do odczytu; żądanie naprawy nie może zmienić zakresu namespace,
  CA ani serwera.
hints.2.text: Poproś o restore-path, napraw data.route, a następnie przetestuj oba wyniki przyjęcia.
phrases.0: Rozróżniłem błąd transportu webhook od odmowy policy.
phrases.1: Zachowałem walidację fail-closed i zakres namespace.
phrases.2: Przetestowałem zarówno przyjęte, jak i odrzucone żądania API.
questions.0.points.0: FailurePolicy Fail odrzuca żądanie, gdy nie można uruchomić sprawdzania poprawności.
questions.0.points.1: Odróżnij błędy transportowe od jawnych decyzji policy.
questions.0.prompt: Dlaczego prawidłowy obiekt może nie działać, gdy webhook jest niedostępny?
questions.1.points.0: Ogranicz reguły zasobów i wybór namespace.
questions.1.points.1: Używaj ograniczonych limitów czasu, TLS i niezależnie odtwarzalnej usługi.
questions.1.prompt: Jak ograniczyć promień wybuchu admission webhook?
