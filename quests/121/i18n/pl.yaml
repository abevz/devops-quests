title: Odzyskiwanie webhooka dostępu
brief: 'Aktualizacje trasy nie docierają do obciążenia. Przywróć prywatny kontrakt admission i oczekiwane wyniki
  dopuszczonych oraz odrzuconych żądań.


  Pracuj na workstation w `~/quest` z dostarczonymi plikami:

  - `board.yaml`, `service.yaml`, `client.yaml`, `route.yaml`, `webhook-repair.json`, `admission-ca.pem`, `admission-target.json`.


  Interfejs sterowania stacją opisano w `~/quest/control/README.md`.


  **Requirements:**


  - Callback admission ograniczony do bay zachowuje dostarczoną tożsamość, prywatne CA, granicę namespace i kontrakt
  limitu czasu z blokowaniem przy awarii oraz dociera do zamierzonego prywatnego endpointu.

  - Istniejąca konfiguracja trasy zawiera `north-121`, a jej próbne admission po stronie serwera kończy się powodzeniem.

  - Próbne admission zamkniętej trasy po stronie serwera zostaje odrzucone z błędem walidacji trasy z prywatnego
  webhooka.

  - Deployment `board` ma jedną gotową replikę, a `http://board:8080` zwraca `north-121` do Deployment `client`.
  Obaj odbiorcy opisani w `adoption-contract.json` korzystają z rekordu i klucza sprawdzanych przez politykę w żądanej
  konfiguracji i bieżących gotowych Podach, odczytują i udostępniają dopuszczoną trasę oraz zachowują programy startowe,
  tożsamości obciążeń i obrazy. Rekord przejściowy pozostaje niezmieniony; wejście plikowe jest tylko do odczytu.


  Kontrole obserwują bieżącą konfigurację callbacku i decyzje admission, nie pełną historię odzyskiwania.


  Role odbiorców, ścieżki wejść i wymagania zachowania opisano w `adoption-contract.json`.'
debrief: Chroniony callback, oba wyniki admission i bieżące przyjęcie danych przez odbiorców przeszły kontrole.
  Migawki konfiguracji i odpowiedzi opisują bieżącą pracę, a nie pełną historię odtwarzania.
stages.0.brief: Konfiguracja admission pozostaje tylko do odczytu; odzyskiwanie mieści się w dostarczonym adapterze.
hints.0.text: Błąd transportu przy fail-closed i odrzucenie przez politykę to różne wyniki. Admission kontroluje
  zapis API, ale nie aktualizuje środowiska przechwyconego przy starcie ani pliku powiązanego przez subPath. Śledź
  publikację i generacje obu odbiorców jako oddzielne granice.
hints.1.text: 'Porównaj callback, decyzje admission, źródła wejść odbiorców i bieżące Pody. Kontrakt opisuje czas
  życia wejść i zachowywane obiekty kontrolne; potwierdzenie dotyczy tylko żądania sterowania.


  ```sh

  cd ~/quest

  cat adoption-contract.json webhook-agent-status.json admission-target.json

  name="dq-webhook-${DQ_NAMESPACE#dq-}"

  kubectl get validatingwebhookconfiguration "$name" -o yaml

  kubectl get deployment,replicaset,pods,configmap -o yaml

  ```'
hints.2.text: "Sprawdź zaakceptowane i odrzucone serwerowe dry-runs, odpowiedź aplikacji i obu odbiorców. Żądane\
  \ referencje źródeł i wejścia działających Podów muszą odpowiadać rekordowi sprawdzanemu przez politykę; poprawny\
  \ HTTP sam nie dowodzi przyjęcia danych.\n\n```sh\ncd ~/quest\nkubectl get configmap route -o json |\n  jq 'del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields)'\
  \ |\n  kubectl apply --dry-run=server -f -\nkubectl get configmap route -o json |\n  jq '.data.route=\"closed\"\
  \ | del(.metadata.resourceVersion,.metadata.uid,.metadata.creationTimestamp,.metadata.managedFields)' |\n  kubectl\
  \ apply --dry-run=server -f -\nkubectl exec deployment/client -- wget -qO- -T 3 http://board:8080\nkubectl exec\
  \ deployment/route-env -- printenv ROUTE\nkubectl exec deployment/route-file -- cat /config/route\nfor name in\
  \ route-env route-file; do\n  kubectl exec \"deployment/$name\" -- wget -qO- -T 3 http://127.0.0.1:8080\ndone\n\
  kubectl get deployment,replicaset,pods -o yaml\n```"
phrases.0: Rozróżniłem błąd transportu webhook od odmowy policy.
phrases.1: Zachowałem walidację fail-closed i zakres namespace.
phrases.2: Przetestowałem zarówno przyjęte, jak i odrzucone żądania API.
questions.0.points.0: FailurePolicy Fail odrzuca żądanie, gdy nie można uruchomić sprawdzania poprawności.
questions.0.points.1: Odróżnij błędy transportowe od jawnych decyzji policy.
questions.0.prompt: Dlaczego prawidłowy obiekt może nie działać, gdy webhook jest niedostępny?
questions.1.points.0: Ogranicz reguły zasobów i wybór namespace.
questions.1.points.1: Używaj ograniczonych limitów czasu, TLS i niezależnie odtwarzalnej usługi.
questions.1.prompt: Jak ograniczyć promień wybuchu admission webhook?
diagnostics.count: webhook configuration webhooks length musi być równe 1.
diagnostics.name: webhook name musi być równe route.training.devops-quests.local.
diagnostics.failure_policy: webhook failurePolicy musi być równe Fail.
diagnostics.timeout: webhook timeoutSeconds musi być równe 2.
diagnostics.url: webhook clientConfig.url musi być równy `https://dq-webhook-<bay>:8443/validate` dla tej zatoki.
diagnostics.ca: webhook caBundle musi zawierać ten sam pojedynczy certyfikat co admission-ca.pem, niezależnie od
  formatowania PEM.
diagnostics.namespace: Etykieta instalacji zatoki musi być niepusta, a webhook namespaceSelector musi dokładnie
  odpowiadać jej etykietom instalacji i uruchomienia.
diagnostics.route: configmap/route data.route musi być równe north-121.
diagnostics.ready: deployment/board readyReplicas musi być równe 1.
diagnostics.http: Żądanie do board:8080 musi zwrócić north-121.
diagnostics.valid: Przygotowanie danych route i jego serwerowy dry-run muszą się powieść.
diagnostics.invalid_input: Przygotowanie danych dry-run dla route closed musi się powieść.
diagnostics.denial: Serwerowy dry-run musi odrzucić route closed.
diagnostics.denial_text: Odmowa musi zawierać Station route must be north-121.
