title: Identidad de imagen
brief: 'Deployment `relay` no puede iniciar su contenedor `worker` porque la imagen seleccionada no existe.
  Inspeccione `deployment.json` y el artefacto CI `release-manifest.json` en `~/quest` para encontrar
  la versión fijada y ya cargada. Reparar el workload; mantenga el nombre Deployment `relay` y el nombre
  del contenedor `worker`. No extraiga datos de registros externos ni solicite acceso al nodo.


  Entradas en `~/quest`: `deployment.json`, `release-manifest.json`.


  La bahía no dispone de Internet ni DNS externo. Utilice únicamente los archivos suministrados, las imágenes
  precargadas y los servicios privados. Todos los cambios deben permanecer dentro de esta bahía.


  Criterios de éxito iniciales: Deployment relay está disponible.'
stages.0.brief: 'La versión fallida se debe reemplazar con la versión identificada por el artefacto CI
  suministrado. Mantener imagePullPolicy Never: la imagen está precargada.


  Criterios de éxito: Deployment relay está disponible.'
stages.0.objectives.0.text: Deployment relay está disponible.
hints.0.text: Inspeccione los eventos pod con kubectl describe pod.
hints.1.text: Lea el CI release-manifest.json y compare su imagen de referencia con el Deployment.
hints.2.text: Configure la imagen de implementación worker en esa referencia fijada y luego espere rollout.
debrief: El nombre de la imagen no existía. Seleccionó la versión fijada y verificó una implementación
  disponible.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el estado de workload y su preparación después del cambio.
questions.0.prompt: Una versión funciona en su computadora portátil, pero no en esta bahía fuera de línea.
  ¿Qué evidencia separaría una mala referencia de imagen de un error de acceso a registry?
questions.0.points.0: Lea los eventos Pod y distinga una referencia faltante de DNS, TLS o errores de
  autorización.
questions.0.points.1: Compare la imagen de carga de trabajo con el artefacto de versión CI suministrado,
  incluido su digest.
questions.0.points.2: Verifique el pull policy y el límite de la imagen precargada de la bahía antes de
  intentar un pull.
questions.1.prompt: ¿Por qué un nuevo rollout podría repetir este incidente incluso después de que se
  reinicia el contenedor?
questions.1.points.0: Un reinicio conserva la imagen y el comando declarados a menos que cambie la plantilla
  Pod.
questions.1.points.1: Repare la plantilla deseada, luego siga el nuevo rollout y el estado de preparación.
questions.1.points.2: Mantenga estables las identidades Deployment/container para que se repare la carga
  de trabajo prevista.
