title: Bildidentität
brief: 'Deployment `relay` kann seinen `worker`-Container nicht starten, da das ausgewählte Bild nicht
  vorhanden ist. Untersuchen Sie `deployment.json` und das CI-Artefakt `release-manifest.json` in `~/quest`,
  um die angeheftete, bereits geladene Version zu finden. Reparieren Sie den workload; Behalten Sie den
  Deployment-Namen `relay` und den Containernamen `worker` bei. Ziehen Sie nicht aus externen Registern
  und fordern Sie keinen Knotenzugriff an.


  Eingaben in `~/quest`: `deployment.json`, `release-manifest.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur die bereitgestellten Dateien,
  vorinstallierten Bilder und privaten Dienste. Alle Änderungen müssen innerhalb dieser Bucht bleiben.


  Erste Erfolgskriterien: Deployment relay ist verfügbar.'
stages.0.brief: 'Die fehlgeschlagene Version muss durch die Version ersetzt werden, die durch das bereitgestellte
  CI-Artefakt identifiziert wird. Behalten Sie imagePullPolicy Never bei: Das Bild ist vorinstalliert.


  Erfolgskriterium: Deployment relay ist verfügbar.'
stages.0.objectives.0.text: Deployment relay ist verfügbar.
hints.0.text: Überprüfen Sie die pod-Ereignisse mit kubectl describe pod.
hints.1.text: Lesen Sie den CI release-manifest.json und vergleichen Sie seine Bildreferenz mit dem Deployment.
hints.2.text: Legen Sie das Bereitstellungs-Image worker auf diese angeheftete Referenz fest und warten
  Sie dann auf rollout.
debrief: Der Bildname existierte nicht. Sie haben die angeheftete Version ausgewählt und eine verfügbare
  Bereitstellung überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe den workload-Status und seine Bereitschaft nach der Änderung überprüft.
questions.0.prompt: Eine Veröffentlichung funktioniert auf Ihrem Laptop, jedoch nicht in diesem Offline-Schacht.
  Welche Beweise würden eine fehlerhafte Bildreferenz von einem registry-Zugriffsfehler unterscheiden?
questions.0.points.0: Lesen Sie die Pod-Ereignisse und unterscheiden Sie eine fehlende Referenz von DNS,
  TLS oder Autorisierungsfehlern.
questions.0.points.1: Vergleichen Sie das Workload-Image mit dem bereitgestellten Release-Artefakt CI,
  einschließlich dessen digest.
questions.0.points.2: Überprüfen Sie den pull policy und die vorinstallierte Image-Grenze des Schachts,
  bevor Sie einen pull versuchen.
questions.1.prompt: Warum wiederholt ein neuer rollout diesen Vorfall möglicherweise auch nach dem Neustart
  des Containers?
questions.1.points.0: Bei einem Neustart bleiben das deklarierte Image und der Befehl erhalten, es sei
  denn, die Pod-Vorlage ändert sich.
questions.1.points.1: Reparieren Sie die gewünschte Vorlage und folgen Sie dann dem neuen rollout und
  dem Bereitschaftsstatus.
questions.1.points.2: Halten Sie die Deployment/container-Identitäten stabil, damit die beabsichtigte
  Arbeitslast repariert wird.
