title: Bildidentität
brief: |-
  Die SignalRail-Version ist nicht verfügbar.

  Arbeiten Sie auf der Workstation in `~/quest` mit den bereitgestellten Dateien:
  - `deployment.yaml`, `release-manifest.json`.

  **Anforderungen:**

  - Verfügbarkeit des Workloads:
    - Deployment: `relay`.
    - Status: Rollout abgeschlossen.

  Das Rollout-Ergebnis beschreibt den Zustand zum Prüfzeitpunkt, beweist aber weder die Reparaturmethode noch künftige Verfügbarkeit.
stages.0.brief: Beschränken Sie die Wiederherstellung auf den bereitgestellten Workload.
stages.0.objectives.0.text: Deployment `relay` schließt seinen Rollout ab.
hints.0.text: Eine Release-Referenz hilft nur, wenn ein Container dieses Image tatsächlich ausführen kann.
hints.1.text: |-
  Überprüfen Sie die pod-Ereignisse mit kubectl describe pod. Lesen Sie den CI release-manifest.json und vergleichen Sie seine Bildreferenz mit dem Deployment. Das ausgewählte Image existiert nicht.

  Prüfen Sie die bereitgestellten Eingaben und laufenden Beobachtungen:

  ```sh
  kubectl describe pod -l app=relay
  cat release-manifest.json
  ```
hints.2.text: |-
  Legen Sie das Bereitstellungs-Image worker auf diese angeheftete Referenz fest und warten Sie dann auf rollout. Behalten Sie Deployment relay und Container worker mit imagePullPolicy Never für das vorgeladene Image bei.

  Prüfen Sie das Ergebnis in `~/quest` auf der Workstation:

  - `kubectl get deployment relay` — zeigt aktualisierte und verfügbare Replikazahlen entsprechend der Sollzahl.
  - `kubectl rollout status deployment/relay --timeout=3s` — endet mit Code `0` und meldet einen abgeschlossenen Rollout.
debrief: Der Bildname existierte nicht. Sie haben die angeheftete Version ausgewählt und eine verfügbare
  Bereitstellung überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe den workload-Status und seine Bereitschaft nach der Änderung überprüft.
questions.0.prompt: Eine Veröffentlichung funktioniert auf Ihrem Laptop, jedoch nicht in diesem Offline-Schacht.
  Welche Beweise würden eine fehlerhafte Bildreferenz von einem registry-Zugriffsfehler unterscheiden?
questions.0.points.0: Lesen Sie die Pod-Ereignisse und unterscheiden Sie eine fehlende Referenz von DNS,
  TLS oder Autorisierungsfehlern.
questions.0.points.1: Vergleichen Sie das Workload-Image mit dem bereitgestellten Release-Artefakt CI,
  einschließlich dessen digest.
questions.0.points.2: Überprüfen Sie den pull policy und die vorinstallierte Image-Grenze des Schachts,
  bevor Sie einen pull versuchen.
questions.1.prompt: Warum wiederholt ein neuer rollout diesen Vorfall möglicherweise auch nach dem Neustart
  des Containers?
questions.1.points.0: Bei einem Neustart bleiben das deklarierte Image und der Befehl erhalten, es sei
  denn, die Pod-Vorlage ändert sich.
questions.1.points.1: Reparieren Sie die gewünschte Vorlage und folgen Sie dann dem neuen rollout und
  dem Bereitschaftsstatus.
questions.1.points.2: Halten Sie die Deployment/container-Identitäten stabil, damit die beabsichtigte
  Arbeitslast repariert wird.
