title: Идентичность образа
brief: |-
  Релиз SignalRail недоступен.

  Работайте на workstation в `~/quest` с предоставленными файлами:
  - `deployment.yaml`, `release-manifest.json`.

  **Требования:**

  - Доступность нагрузки:
    - Deployment: `relay`.
    - Состояние: Rollout завершён.

  Результат rollout описывает состояние в момент проверки, но не доказывает способ исправления или будущую доступность.
stages.0.brief: Ограничьте восстановление предоставленной нагрузкой.
stages.0.objectives.0.text: Deployment `relay` завершает rollout.
hints.0.text: Ссылка на релиз полезна только тогда, когда контейнер действительно может запустить этот
  образ.
hints.1.text: |-
  Посмотрите события pod через kubectl describe pod. Прочитайте артефакт CI release-manifest.json и сравните его ссылку на образ с Deployment. Выбранного образа не существует.

  Изучите предоставленные файлы и живые наблюдения:

  ```sh
  kubectl describe pod -l app=relay
  cat release-manifest.json
  ```
hints.2.text: |-
  Укажите закреплённый образ worker в Deployment и дождитесь rollout. Сохраните Deployment relay и контейнер worker с imagePullPolicy Never для предварительно загруженного образа.

  Проверьте результат из `~/quest` на workstation:

  - `kubectl get deployment relay` — показывает, что число обновлённых и доступных реплик соответствует желаемому.
  - `kubectl rollout status deployment/relay --timeout=3s` — завершается с кодом `0` и сообщает о завершённом rollout.
debrief: Имя образа не существовало. Вы выбрали закреплённый релиз и проверили доступность Deployment.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: После изменения я проверил состояние workload и его готовность.
questions.0.prompt: Релиз работает на ноутбуке, но не в этой изолированной песочнице. Какие свидетельства
  отделяют ошибочную ссылку на образ от отказа доступа к registry?
questions.0.points.0: Прочитайте события Pod и отличите отсутствующую ссылку от ошибок DNS, TLS и авторизации.
questions.0.points.1: Сравните образ нагрузки с выданным артефактом CI, включая digest.
questions.0.points.2: Перед попыткой pull проверьте pull policy и границу предварительно загруженных образов.
questions.1.prompt: Почему новый rollout может повторить инцидент, даже если контейнер перезапустился?
questions.1.points.0: Перезапуск сохраняет объявленный образ и команду, пока не изменён шаблон Pod.
questions.1.points.1: Исправьте желаемый шаблон, затем проверьте новый rollout и готовность.
questions.1.points.2: Сохраните имена Deployment и контейнера, чтобы исправить именно нужную нагрузку.
