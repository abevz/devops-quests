title: Идентичность образа
brief: 'Deployment `relay` не может запустить контейнер `worker`: выбранного образа нет. Изучите `deployment.json`
  и артефакт CI `release-manifest.json` в `~/quest`, чтобы найти закреплённый, уже загруженный релиз.
  Исправьте workload; сохраните имя Deployment `relay` и имя контейнера `worker`. Не загружайте образы
  из внешних registry и не запрашивайте доступ к узлам.


  Входные файлы в `~/quest`: `deployment.json`, `release-manifest.json`.


  В песочнице нет интернета и внешнего DNS. Используйте только выданные файлы, предварительно загруженные
  образы и приватные сервисы. Все изменения — только в этой песочнице.


  Цели первого этапа: Deployment relay доступен.'
stages.0.brief: 'Неработающий релиз нужно заменить релизом из выданного артефакта CI. Сохраните imagePullPolicy
  Never: образ уже загружен.


  Результат проверки: Deployment relay доступен.'
stages.0.objectives.0.text: Deployment relay доступен.
hints.0.text: Посмотрите события pod через kubectl describe pod.
hints.1.text: Прочитайте артефакт CI release-manifest.json и сравните его ссылку на образ с Deployment.
hints.2.text: Укажите закреплённый образ worker в Deployment и дождитесь rollout.
debrief: Имя образа не существовало. Вы выбрали закреплённый релиз и проверили доступность Deployment.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: После изменения я проверил состояние workload и его готовность.
questions.0.prompt: Релиз работает на ноутбуке, но не в этой изолированной песочнице. Какие свидетельства
  отделяют ошибочную ссылку на образ от отказа доступа к registry?
questions.0.points.0: Прочитайте события Pod и отличите отсутствующую ссылку от ошибок DNS, TLS и авторизации.
questions.0.points.1: Сравните образ нагрузки с выданным артефактом CI, включая digest.
questions.0.points.2: Перед попыткой pull проверьте pull policy и границу предварительно загруженных образов.
questions.1.prompt: Почему новый rollout может повторить инцидент, даже если контейнер перезапустился?
questions.1.points.0: Перезапуск сохраняет объявленный образ и команду, пока не изменён шаблон Pod.
questions.1.points.1: Исправьте желаемый шаблон, затем проверьте новый rollout и готовность.
questions.1.points.2: Сохраните имена Deployment и контейнера, чтобы исправить именно нужную нагрузку.
