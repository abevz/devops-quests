title: Tożsamość obrazu
brief: |-
  Wersja SignalRail jest niedostępna.

  Pracuj na workstation w `~/quest` z dostarczonymi plikami:
  - `deployment.yaml`, `release-manifest.json`.

  **Wymagania:**

  - Dostępność obciążenia:
    - Deployment: `relay`.
    - Stan: Rollout zakończony.

  Wynik rollout opisuje stan w chwili sprawdzenia; nie dowodzi metody naprawy ani przyszłej dostępności.
stages.0.brief: Ogranicz odzyskiwanie do dostarczonego obciążenia.
stages.0.objectives.0.text: Deployment `relay` kończy rollout.
hints.0.text: |-
  Pod może się uruchomić, gdy wskazany obraz jest dostępny.
hints.1.text: |-
  Porównaj obraz kontenera `worker` w Deployment `relay` z polem `image` w `release-manifest.json`. Sprawdź zdarzenia Poda i zachowaj `imagePullPolicy: Never` dla wstępnie załadowanego obrazu.

  ```sh
  kubectl describe pod -l app=relay
  cat release-manifest.json
  kubectl get deployment relay -o jsonpath='{.spec.template.spec.containers[?(@.name=="worker")].image}{"\n"}'
  ```
hints.2.text: |-
  Po ustawieniu przypiętego odwołania do obrazu sprawdź dostępne repliki i zakończenie wdrożenia `relay`.

  - `kubectl get deployment relay` — pokazuje liczbę zaktualizowanych i dostępnych replik zgodną z liczbą żądaną.
  - `kubectl rollout status deployment/relay --timeout=3s` — kończy się kodem `0` i zgłasza zakończony rollout.
debrief: Nazwa obrazu nie istniała. Wybrałeś przypiętą wersję i zweryfikowałeś dostępne wdrożenie.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
questions.0.prompt: Wersja działa na Twoim laptopie, ale nie w tej zatoce offline. Jakie dowody odróżnią
  złe odniesienie do obrazu od niepowodzenia dostępu do registry?
questions.0.points.0: Odczytaj zdarzenia Pod i odróżnij brakującą referencję od DNS, TLS lub błędów autoryzacji.
questions.0.points.1: Porównaj obraz obciążenia z dostarczonym artefaktem wersji CI, w tym z jego digest.
questions.0.points.2: Przed próbą pull sprawdź pull policy i granicę wstępnie załadowanego obrazu wnęki.
questions.1.prompt: Dlaczego nowy rollout może powtórzyć ten incydent nawet po ponownym uruchomieniu kontenera?
questions.1.points.0: Ponowne uruchomienie zachowuje zadeklarowany obraz i polecenie, chyba że szablon
  Pod ulegnie zmianie.
questions.1.points.1: Napraw żądany szablon, a następnie postępuj zgodnie z nowym rollout i stanem gotowości.
questions.1.points.2: Utrzymuj stabilną tożsamość Deployment/kontenera, aby naprawić zamierzone obciążenie.
diagnostics.condition_0: |-
  Rollout relay może utknąć, gdy worker nie może uruchomić wskazanego obrazu. Porównaj zdarzenia Poda z obrazem w manifeście wydania. [Przewodnik](guides#guide=kubernetes-20&section=relay-release-image)
