title: Tożsamość obrazu
brief: 'Deployment `relay` nie może uruchomić kontenera `worker`, ponieważ wybrany obraz nie istnieje.
  Sprawdź `deployment.json` i artefakt CI `release-manifest.json` w `~/quest`, aby znaleźć przypiętą,
  już załadowaną wersję. Napraw workload; zachowaj nazwę Deployment `relay` i nazwę kontenera `worker`.
  Nie pobieraj danych z rejestrów zewnętrznych ani nie żądaj dostępu do węzła.


  Wejścia w `~/quest`: `deployment.json`, `release-manifest.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Wszystkie zmiany muszą pozostać w tej zatoce.


  Wstępne kryteria sukcesu: Deployment relay jest dostępny.'
stages.0.brief: 'Nieprawidłową wersję należy zastąpić wersją identyfikowaną przez dostarczony artefakt
  CI. Zachowaj imagePullPolicy Never:, obraz jest wstępnie załadowany.


  Kryteria sukcesu: Deployment relay jest dostępny.'
stages.0.objectives.0.text: Dostępny jest Deployment relay.
hints.0.text: Sprawdź zdarzenia pod za pomocą kubectl describe pod.
hints.1.text: Przeczytaj CI release-manifest.json i porównaj jego odniesienie do obrazu z Deployment.
hints.2.text: Ustaw obraz wdrożenia worker na przypięte odniesienie, a następnie poczekaj na rollout.
debrief: Nazwa obrazu nie istniała. Wybrałeś przypiętą wersję i zweryfikowałeś dostępne wdrożenie.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
questions.0.prompt: Wersja działa na Twoim laptopie, ale nie w tej zatoce offline. Jakie dowody odróżnią
  złe odniesienie do obrazu od niepowodzenia dostępu do registry?
questions.0.points.0: Odczytaj zdarzenia Pod i odróżnij brakującą referencję od DNS, TLS lub błędów autoryzacji.
questions.0.points.1: Porównaj obraz obciążenia z dostarczonym artefaktem wersji CI, w tym z jego digest.
questions.0.points.2: Przed próbą pull sprawdź pull policy i granicę wstępnie załadowanego obrazu wnęki.
questions.1.prompt: Dlaczego nowy rollout może powtórzyć ten incydent nawet po ponownym uruchomieniu kontenera?
questions.1.points.0: Ponowne uruchomienie zachowuje zadeklarowany obraz i polecenie, chyba że szablon
  Pod ulegnie zmianie.
questions.1.points.1: Napraw żądany szablon, a następnie postępuj zgodnie z nowym rollout i stanem gotowości.
questions.1.points.2: Utrzymuj stabilną tożsamość Deployment/kontenera, aby naprawić zamierzone obciążenie.
