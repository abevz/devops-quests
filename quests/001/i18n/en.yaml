title: Image identity
brief: |-
  SignalRail's release is unavailable.

  Work on the workstation in `~/quest` with the supplied files:
  - `deployment.yaml`, `release-manifest.json`.

  **Requirements:**

  - Workload availability:
    - Deployment: `relay`.
    - Status: Rollout completes.

  The rollout result describes the state at the time of the check; it does not prove the repair method or future availability.
stages.0.brief: Keep recovery scoped to the supplied workload.
stages.0.objectives.0.text: Deployment `relay` completes its rollout.
hints.0.text: A release reference is useful only when a container can actually run that image.
hints.1.text: |-
  Inspect the pod events with kubectl describe pod. Read the CI release-manifest.json and compare its image reference with the Deployment. The selected image does not exist.

  Inspect the supplied inputs and live observations:

  ```sh
  kubectl describe pod -l app=relay
  cat release-manifest.json
  ```
hints.2.text: |-
  Set the deployment worker image to that pinned reference, then wait for rollout. Keep Deployment relay and container worker, with imagePullPolicy Never for the preloaded image.

  Verify the result from `~/quest` on the workstation:

  - `kubectl get deployment relay` — shows the updated and available replica counts matching the desired count.
  - `kubectl rollout status deployment/relay --timeout=3s` — exits `0` and reports a completed rollout.
debrief: The image name did not exist. You selected the pinned release and verified an available deployment.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked the workload state and its readiness after the change.
questions.0.prompt: A release works on your laptop but not in this offline bay. Which evidence would separate
  a bad image reference from registry access failure?
questions.0.points.0: Read the Pod events and distinguish a missing reference from DNS, TLS or authorization
  errors.
questions.0.points.1: Compare the workload image with the supplied CI release artifact, including its
  digest.
questions.0.points.2: Check the pull policy and the bay's preloaded-image boundary before attempting a
  pull.
questions.1.prompt: Why might a new rollout repeat this incident even after the container restarts?
questions.1.points.0: A restart retains the declared image and command unless the Pod template changes.
questions.1.points.1: Repair the desired template, then follow the new rollout and readiness state.
questions.1.points.2: Keep the Deployment/container identities stable so the intended workload is repaired.
