title: Image identity
brief: 'Deployment `relay` cannot start its `worker` container because the selected image does not exist.
  Inspect `deployment.json` and the CI artifact `release-manifest.json` in `~/quest` to find the pinned,
  already-loaded release. Repair the workload; keep the Deployment name `relay` and container name `worker`.
  Do not pull from external registries or request node access.


  Inputs in `~/quest`: `deployment.json`, `release-manifest.json`.


  The bay has no Internet or external DNS. Use only its supplied files, preloaded images and private services.
  All changes must stay inside this bay.


  Initial success criteria: Deployment relay is available.'
stages.0.brief: 'The failed release must be replaced with the release identified by the supplied CI artifact.
  Keep imagePullPolicy Never: the image is preloaded.


  Success criteria: Deployment relay is available.'
stages.0.objectives.0.text: Deployment relay is available.
hints.0.text: Inspect the pod events with kubectl describe pod.
hints.1.text: Read the CI release-manifest.json and compare its image reference with the Deployment.
hints.2.text: Set the deployment worker image to that pinned reference, then wait for rollout.
debrief: The image name did not exist. You selected the pinned release and verified an available deployment.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked the workload state and its readiness after the change.
questions.0.prompt: A release works on your laptop but not in this offline bay. Which evidence would separate
  a bad image reference from registry access failure?
questions.0.points.0: Read the Pod events and distinguish a missing reference from DNS, TLS or authorization
  errors.
questions.0.points.1: Compare the workload image with the supplied CI release artifact, including its
  digest.
questions.0.points.2: Check the pull policy and the bay's preloaded-image boundary before attempting a
  pull.
questions.1.prompt: Why might a new rollout repeat this incident even after the container restarts?
questions.1.points.0: A restart retains the declared image and command unless the Pod template changes.
questions.1.points.1: Repair the desired template, then follow the new rollout and readiness state.
questions.1.points.2: Keep the Deployment/container identities stable so the intended workload is repaired.
