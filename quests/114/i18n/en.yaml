title: Service account token boundaries
brief: |-
  The workload cannot access its API data. Restore its short-lived identity and narrow access without exposing credentials.

  Work on the workstation in `~/quest`. The supplied connection inputs are `api-ca.pem` and `api-endpoint`. The live workload and access objects are available through Kubernetes.

  **Requirements:**

  - Inside Deployment `reader`, the mounted API credential is a private projected token at `/credential/token`, valid for the API and requested for `600` seconds; automatic credential mounting remains disabled.
  - The supplied Role grants only named-read access to the existing route configuration.
  - Using its mounted credential and CA verification, the reader receives HTTP `200` and route `north-114` from the existing route configuration.
  - The same reader credential receives HTTP `403` for ConfigMap lists, Secret lists and the separate protected configuration.

  Checks observe the declared projection, live Role and these exact API requests, not every possible permission or editing history.
debrief: Recipient validation establishes where a credential can authenticate. A namespaced binding connects a workload
  identity to a minimal Role; testing both allowed and denied requests exposes excessive access.
stages.0.brief: Recover the workload identity and effective access while keeping credentials private.
hints.0.text: An API request crosses authentication and authorization. A valid recipient does not grant permission;
  a minimal Role grants nothing until it is attached to the acting identity.
hints.1.text: |-
  Inspect the workload identity and its live access relationships. Compare only recipient metadata with the workstation context that already authenticates to this API; never print either bearer token.

  ```sh
  kubectl get deployment reader -o yaml
  kubectl get role,rolebinding
  decode_audience='import base64,json,sys; token=sys.stdin.read().strip(); print(json.dumps(json.loads(base64.urlsafe_b64decode(token.split(".")[1]+"==="))["aud"]))'
  kubectl config view --raw --minify -o json |
    python3 -I -c 'import json,sys; print(json.load(sys.stdin)["users"][0]["user"]["token"])' |
    python3 -I -c "$decode_audience"
  kubectl exec deployment/reader -c worker -- cat /credential/token |
    python3 -I -c "$decode_audience"
  unset decode_audience
  ```
hints.2.text: |-
  Verify the allowed read and every denied request with the workload credential and the supplied CA. The route must return north-114 with HTTP 200; the other requests must return HTTP 403.

  `kubectl get role,rolebinding`

  ```sh
  api=$(cat api-endpoint)
  token=$(kubectl exec deployment/reader -c worker -- cat /credential/token)
  printf 'header = "Authorization: Bearer %s"\n' "$token" |
    curl --config - --cacert api-ca.pem -sS "$api/api/v1/namespaces/$DQ_NAMESPACE/configmaps/route" |
    jq -r '.data.route // empty'
  for path in configmaps/route configmaps secrets configmaps/offlimits; do
    printf '%s ' "$path"
    printf 'header = "Authorization: Bearer %s"\n' "$token" |
      curl --config - --cacert api-ca.pem -sS -o /dev/null -w 'HTTP %{http_code}\n' \
      "$api/api/v1/namespaces/$DQ_NAMESPACE/$path"
  done
  unset token
  ```
phrases.0: I checked the token audience without exposing credentials.
phrases.1: I used CA-verified HTTPS for the real API request.
phrases.2: I tested permitted and denied operations.
questions.0.points.0: No; authentication identifies the principal, RBAC authorizes actions.
questions.0.points.1: Audience validation and permissions are separate checks.
questions.0.prompt: Does a valid token grant every operation?
questions.1.points.0: They support expiry, audience and Pod binding.
questions.1.points.1: Kubelet rotates the projected token; applications must reload it.
questions.1.prompt: Why prefer projected tokens to legacy token Secrets?
stages.0.objectives.0.text: Inside Deployment `reader`, the mounted API credential is a private projected token
  at `/credential/token`, valid for the API and requested for `600` seconds; automatic credential mounting remains
  disabled.
stages.0.objectives.1.text: The supplied Role grants only named-read access to the existing route configuration.
stages.0.objectives.2.text: Using its mounted credential and CA verification, the reader receives HTTP `200` and
