title: Service account token boundaries
brief: "The reader cannot access its required API data. Restore narrowly scoped access without exposing its credential.\n\
  \nWork in `~/quest` on the workstation. Supplied files: `reader-sa.json`, `role.json`, `binding.json`, `route.json`,\
  \ `reader.json`, `api-ca.pem`, `api-endpoint`.\n\n**Requirements:**\n\n- Deployment `reader` disables automatic\
  \ token mounting and projects an API-audience token at `/credential/token` inside its container, requesting a\
  \ lifetime of `600` seconds.\n  - The token file belongs inside the reader container; its projected relative path\
  \ is `token`. Keep the credential private.\n- Role `reader` allows only `get` on the core-API ConfigMap `route`.\n\
  - Using the mounted reader token and CA verification, GET of ConfigMap `route` returns HTTP `200` with route `north-114`.\n\
  - The same reader credential receives HTTP `403` for listing ConfigMaps, listing Secrets and getting ConfigMap\
  \ `offlimits`.\n\n**Verify yourself before Check & finish:** Run these observation commands from `~/quest` on\
  \ the workstation.\n\n- Settings, identity and status match Requirements.\n\n  ```sh\n  kubectl get deployment\
  \ reader -o yaml\n  kubectl get role reader -o yaml\n  ```\n\n- The named route returns `north-114` and HTTP `200`;\
  \ the other three requests return HTTP `403`. Do not print or save the token.\n\n  ```sh\n  api=$(cat api-endpoint)\n\
  \  token=$(kubectl exec deployment/reader -- cat /credential/token)\n  for path in configmaps/route configmaps\
  \ secrets configmaps/offlimits; do\n    printf 'header = \"Authorization: Bearer %s\"\\n' \"$token\" |\n     \
  \ curl --config - --cacert api-ca.pem -sS -w '\\nHTTP %{http_code}\\n' \\\n      \"$api/api/v1/namespaces/$DQ_NAMESPACE/$path\"\
  \n  done\n  unset token\n  ```\n\nChecks cover these requests and the live Role, not every possible permission\
  \ or command history."
debrief: Short-lived projected credentials and least-privilege authorization solve different parts of API access.
stages.0.brief: The reader must read the named route while broader requests remain forbidden.
hints.0.text: Authentication checks audience before RBAC authorization.
hints.1.text: The projected volume requests a token for one intended recipient.
hints.2.text: Repair only the audience, wait for replacement, and use the supplied CA for HTTPS. The supplied audience
  refers to a retired service. The API audience is `https://kubernetes.default.svc.cluster.local`.
phrases.0: I checked the token audience without exposing credentials.
phrases.1: I used CA-verified HTTPS for the real API request.
phrases.2: I tested permitted and denied operations.
questions.0.points.0: No; authentication identifies the principal, RBAC authorizes actions.
questions.0.points.1: Audience validation and permissions are separate checks.
questions.0.prompt: Does a valid token grant every operation?
questions.1.points.0: They support expiry, audience and Pod binding.
questions.1.points.1: Kubelet rotates the projected token; applications must reload it.
questions.1.prompt: Why prefer projected tokens to legacy token Secrets?
diagnostics.automount: reader automountServiceAccountToken must equal false.
diagnostics.projection: reader projected token must equal path token, audience https://kubernetes.default.svc.cluster.local,
  expirationSeconds 600.
diagnostics.role: role/reader rules must equal get configmaps resourceNames [route].
diagnostics.allowed: reader GET configmaps/route must equal HTTP 200.
diagnostics.value: configmaps/route data.route must equal north-114.
diagnostics.denied_configmaps: reader GET configmaps must return HTTP 403.
diagnostics.denied_secrets: reader GET secrets must return HTTP 403.
diagnostics.denied_configmaps_offlimits: reader GET configmaps/offlimits must return HTTP 403.
stages.0.objectives.0.text: Deployment `reader` disables automatic token mounting and projects an API-audience token
  at `/credential/token` inside its container, requesting a lifetime of `600` seconds.
stages.0.objectives.1.text: Role `reader` allows only `get` on the core-API ConfigMap `route`.
stages.0.objectives.2.text: Using the mounted reader token and CA verification, GET of ConfigMap `route` returns
  HTTP `200` with route `north-114`.
stages.0.objectives.3.text: The same reader credential receives HTTP `403` for listing ConfigMaps, listing Secrets
  and getting ConfigMap `offlimits`.
