title: Service account token boundaries
brief: |-
  The reader cannot access its required API data. Restore narrowly scoped access without exposing its credential.

  Work on the workstation in `~/quest` with the supplied files:
  - `reader-sa.yaml`, `role.yaml`, `binding.yaml`, `route.yaml`, `reader.yaml`, `api-ca.pem`, `api-endpoint`.

  **Requirements:**

  - Inside Deployment `reader`, the mounted API credential is a private projected token at `/credential/token`, valid for the API and requested for `600` seconds; automatic credential mounting remains disabled.
  - The supplied Role grants only named-read access to the existing route configuration.
  - Using its mounted credential and CA verification, the reader receives HTTP `200` and route `north-114` from the existing route configuration.
  - The same reader credential receives HTTP `403` for ConfigMap lists, Secret lists and the separate protected configuration.

  Checks cover these requests and the live Role, not every possible permission or command history.
debrief: Short-lived projected credentials and least-privilege authorization solve different parts of
  API access.
stages.0.brief: Keep the reader credential private and verify the API CA.
hints.0.text: Authentication checks audience before RBAC authorization.
hints.1.text: |-
  The projected volume requests a token for one intended recipient.

  Inspect the supplied inputs and live observations:

  ```sh
  kubectl get deployment reader -o yaml
    kubectl get role reader -o yaml
  ```
hints.2.text: "Repair only the audience, wait for replacement, and use the supplied CA for HTTPS. The supplied audience refers to a retired service. The API audience is `https://kubernetes.default.svc.cluster.local`.\n\nVerify the result from `~/quest` on the workstation:\n\n- The named route returns `north-114` and HTTP `200`; the other three requests return HTTP `403`. Do not print or save the token.\n\n  ```sh\n  api=$(cat api-endpoint)\n  token=$(kubectl exec deployment/reader -c worker -- cat /credential/token)\n  for path in configmaps/route configmaps secrets configmaps/offlimits; do\n    printf 'header = \"Authorization: Bearer %s\"\\n' \"$token\" |\n      curl --config - --cacert api-ca.pem -sS -w '\\nHTTP %{http_code}\\n' \\\n      \"$api/api/v1/namespaces/$DQ_NAMESPACE/$path\"\n  done\n  unset token\n  ```"
phrases.0: I checked the token audience without exposing credentials.
phrases.1: I used CA-verified HTTPS for the real API request.
phrases.2: I tested permitted and denied operations.
questions.0.points.0: No; authentication identifies the principal, RBAC authorizes actions.
questions.0.points.1: Audience validation and permissions are separate checks.
questions.0.prompt: Does a valid token grant every operation?
questions.1.points.0: They support expiry, audience and Pod binding.
questions.1.points.1: Kubelet rotates the projected token; applications must reload it.
questions.1.prompt: Why prefer projected tokens to legacy token Secrets?
diagnostics.automount: Automatic credential mounting must be disabled for reader Pods.
diagnostics.projection: reader projected token must equal path token, audience https://kubernetes.default.svc.cluster.local,
  expirationSeconds 600.
diagnostics.role: role/reader rules must equal get configmaps resourceNames [route].
diagnostics.allowed: reader GET configmaps/route must equal HTTP 200.
diagnostics.value: configmaps/route data.route must equal north-114.
diagnostics.denied_configmaps: reader GET configmaps must return HTTP 403.
diagnostics.denied_secrets: reader GET secrets must return HTTP 403.
diagnostics.denied_configmaps_offlimits: reader GET configmaps/offlimits must return HTTP 403.
