title: Service account token boundaries
brief: 'A reader uses a projected, Pod-bound token with a ten-minute requested lifetime. Its audience
  points at a retired service, so the Kubernetes API rejects it. Set audience https://kubernetes.default.svc.cluster.local,
  keeping automatic mounting disabled and the named-route read-only Role. Use the mounted token for a
  real CA-verified API request; never print or save the token. Prove route get succeeds while list ConfigMaps
  and Secrets is denied.


  Quest files in `~/quest` (some appear in later stages): `reader-sa.json`, `role.json`, `binding.json`,
  `route.json`, `reader.json`, `api-ca.pem`, `api-endpoint`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: The projected token has the API audience and 600-second request; actual named
  get succeeds and broad lists return 403.'
debrief: Short-lived projected credentials and least-privilege authorization solve different parts of
  API access.
