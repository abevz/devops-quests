title: Service account token boundaries
brief: 'A reader uses a projected, Pod-bound token with a ten-minute requested lifetime. Its audience points at a retired
  service, so the Kubernetes API rejects it. Set audience https://kubernetes.default.svc.cluster.local, keeping automatic
  mounting disabled and the named-route read-only Role. Use the mounted token for a real CA-verified API request; never print
  or save the token. Prove route get succeeds while list ConfigMaps and Secrets is denied.


  Quest files in `~/quest` (some appear in later stages): `reader-sa.json`, `role.json`, `binding.json`, `route.json`, `reader.json`,
  `api-ca.pem`, `api-endpoint`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services. Change only this
  bay.


  Initial success criteria: The projected token has the API audience and 600-second request; actual named get succeeds and
  broad lists return 403.


  The first projected token source must be exactly `path: token`, `expirationSeconds: 600` and `audience: https://kubernetes.default.svc.cluster.local`,
  with automatic mounting disabled. Role `reader` must contain exactly one core-API rule: `get` on `configmaps`, `resourceNames:
  [route]`. The CA-verified reader request for `configmaps/route` must return 200 and `.data.route: north-114`; requests for
  the ConfigMap list, Secret list and named ConfigMap `offlimits` must each return 403. These checks cover the specified requests
  and live Role, not every possible permission or your command history.'
debrief: Short-lived projected credentials and least-privilege authorization solve different parts of API access.
stages.0.brief: The projected token, exact reader Role and CA-verified allowed and denied requests match the brief.
stages.0.objectives.0.text: The projected token, exact reader Role and CA-verified allowed and denied requests match the brief.
hints.0.text: Authentication checks audience before RBAC authorization.
hints.1.text: The projected volume requests a token for one intended recipient.
hints.2.text: Repair only the audience, wait for replacement, and use the supplied CA for HTTPS.
phrases.0: I checked the token audience without exposing credentials.
phrases.1: I used CA-verified HTTPS for the real API request.
phrases.2: I tested permitted and denied operations.
questions.0.points.0: No; authentication identifies the principal, RBAC authorizes actions.
questions.0.points.1: Audience validation and permissions are separate checks.
questions.0.prompt: Does a valid token grant every operation?
questions.1.points.0: They support expiry, audience and Pod binding.
questions.1.points.1: Kubelet rotates the projected token; applications must reload it.
questions.1.prompt: Why prefer projected tokens to legacy token Secrets?
diagnostics.automount: reader automountServiceAccountToken must equal false.
diagnostics.projection: reader projected token must equal path token, audience https://kubernetes.default.svc.cluster.local,
  expirationSeconds 600.
diagnostics.role: role/reader rules must equal get configmaps resourceNames [route].
diagnostics.allowed: reader GET configmaps/route must equal HTTP 200.
diagnostics.value: configmaps/route data.route must equal north-114.
diagnostics.denied_configmaps: reader GET configmaps must return HTTP 403.
diagnostics.denied_secrets: reader GET secrets must return HTTP 403.
diagnostics.denied_configmaps_offlimits: reader GET configmaps/offlimits must return HTTP 403.
