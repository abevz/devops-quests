diagnostics.automount: The Pod or its ServiceAccount may still enable automatic credential mounting. Check the Pod override and, when it is unset, the associated ServiceAccount flag. [Cause and check](guides#guide=workload-access&section=q114-reader-disable-default-token)
diagnostics.projection: The worker may mount the wrong projection, use a subpath or request a token for the wrong audience or duration. Follow its /credential mount to a single token source at path token for https://kubernetes.default.svc.cluster.local with 600 seconds. [Cause and check](guides#guide=workload-access&section=q114-reader-explicit-token-projection)
diagnostics.role: The reader Role may still grant broad permissions or be missing. Inspect every rule and keep only get on the named ConfigMap route in the core API group. [Cause and check](guides#guide=workload-access&section=q114-reader-exact-role)
diagnostics.allowed: The projected credential may be missing, invalid for the API audience, or lack authorization for route. Use the actual mounted token privately and check that GET configmaps/route returns HTTP 200. [Cause and check](guides#guide=workload-access&section=q114-reader-named-api-authorization)
diagnostics.value: A successful request may return stale route data, or an earlier failure may leave no valid JSON. Check the authenticated response’s data.route for north-114 without printing the token. [Cause and check](guides#guide=workload-access&section=q114-reader-route-response-data)
diagnostics.denied_configmaps: A broad ConfigMap permission may allow collection requests. Check that the projected credential yields HTTP 403 for GET configmaps, separately from the named route request. [Cause and check](guides#guide=workload-access&section=q114-reader-configmap-list-denial)
diagnostics.denied_secrets: A Role or binding may grant access to the Secrets collection. Check that the authenticated GET secrets request returns HTTP 403. Failed authentication or a timeout does not establish authorization denial. [Cause and check](guides#guide=workload-access&section=q114-reader-secret-list-denial)
diagnostics.denied_configmaps_offlimits: A permission may allow reads of other named ConfigMaps. Check for HTTP 403 on configmaps/offlimits while keeping the route object readable. [Cause and check](guides#guide=workload-access&section=q114-reader-unrelated-configmap-denial)
diagnostics.probe_0_0: The credential configuration observer may stop before naming a failed field if it cannot start or read its supplied inputs. Check the reader Deployment, ServiceAccount and local tools. [Cause and check](guides#guide=workload-access&section=q114-reader-projection-observer-input)
