title: Granice tokenów konta Service
brief: |-
  Czytelnik nie uzyskuje swoich danych z API. Przywróć jego krótkotrwałą tożsamość i wąski dostęp bez ujawniania poświadczeń.

  Pracuj na workstation w `~/quest`. Dane połączenia to `api-ca.pem` i `api-endpoint`. Bieżące obciążenie i obiekty dostępu są dostępne przez Kubernetes.

  **Wymagania:**

  - W Deployment `reader` zamontowanym poświadczeniem API jest prywatny token projekcyjny w `/credential/token`, ważny dla API i żądany na `600` sekund; automatyczne montowanie pozostaje wyłączone.
  - Dostarczony Role przyznaje tylko odczyt istniejącej konfiguracji trasy po nazwie.
  - Używając zamontowanego poświadczenia i weryfikacji CA, reader otrzymuje HTTP `200` i trasę `north-114` z istniejącej konfiguracji.
  - To samo poświadczenie reader otrzymuje HTTP `403` dla list ConfigMap, list Secret i oddzielnej chronionej konfiguracji.

  Testy obserwują zadeklarowaną projekcję, bieżący Role i te konkretne żądania API, a nie wszystkie możliwe uprawnienia ani historię zmian.
debrief: Walidacja odbiorcy określa, gdzie poświadczenie może się uwierzytelnić. Powiązanie w namespace łączy tożsamość
  obciążenia z minimalnym Role; dozwolone i zabronione żądania ujawniają nadmierny dostęp.
stages.0.brief: Przywróć tożsamość obciążenia i rzeczywisty dostęp, zachowując poufność poświadczeń.
hints.0.text: Żądanie API przechodzi uwierzytelnianie i autoryzację. Poprawny odbiorca nie nadaje praw; minimalny
  Role niczego nie zezwala bez powiązania z działającą tożsamością.
hints.1.text: |-
  Sprawdź tożsamość obciążenia i bieżące powiązania dostępu. Porównuj tylko metadane odbiorcy z klientem workstation, który już uwierzytelnia się w tym API; nie wyświetlaj żadnego tokena bearer.

  ```sh
  kubectl get deployment reader -o yaml
  kubectl get role,rolebinding
  decode_audience='import base64,json,sys; token=sys.stdin.read().strip(); print(json.dumps(json.loads(base64.urlsafe_b64decode(token.split(".")[1]+"==="))["aud"]))'
  kubectl config view --raw --minify -o json |
    python3 -I -c 'import json,sys; print(json.load(sys.stdin)["users"][0]["user"]["token"])' |
    python3 -I -c "$decode_audience"
  kubectl exec deployment/reader -c worker -- cat /credential/token |
    python3 -I -c "$decode_audience"
  unset decode_audience
  ```
hints.2.text: |-
  Sprawdź dozwolony odczyt i każde zabronione żądanie poświadczeniem obciążenia oraz podanym CA. Trasa ma zwrócić north-114 i HTTP 200, pozostałe żądania HTTP 403.

  `kubectl get role,rolebinding`

  ```sh
  api=$(cat api-endpoint)
  token=$(kubectl exec deployment/reader -c worker -- cat /credential/token)
  printf 'header = "Authorization: Bearer %s"\n' "$token" |
    curl --config - --cacert api-ca.pem -sS "$api/api/v1/namespaces/$DQ_NAMESPACE/configmaps/route" |
    jq -r '.data.route // empty'
  for path in configmaps/route configmaps secrets configmaps/offlimits; do
    printf '%s ' "$path"
    printf 'header = "Authorization: Bearer %s"\n' "$token" |
      curl --config - --cacert api-ca.pem -sS -o /dev/null -w 'HTTP %{http_code}\n' \
      "$api/api/v1/namespaces/$DQ_NAMESPACE/$path"
  done
  unset token
  ```
phrases.0: Sprawdziłem token audience bez ujawniania credentials.
phrases.1: Użyłem CA zweryfikowanego HTTPS do prawdziwego żądania API.
phrases.2: Przetestowałem dozwolone i zabronione operacje.
questions.0.points.0: NIE; uwierzytelnienie identyfikuje principal, RBAC autoryzuje działania.
questions.0.points.1: Walidacja i uprawnienia Audience to oddzielne kontrole.
questions.0.prompt: Czy ważny token umożliwia każdą operację?
questions.1.points.0: Obsługują wygaśnięcie, powiązanie audience i Pod.
questions.1.points.1: Kubelet obraca wyświetlany token; aplikacje muszą go załadować ponownie.
questions.1.prompt: Dlaczego wolisz projected tokens od starszego token Secrets?
stages.0.objectives.0.text: W Deployment `reader` zamontowanym poświadczeniem API jest prywatny token projekcyjny
  w `/credential/token`, ważny dla API i żądany na `600` sekund; automatyczne montowanie pozostaje wyłączone.
stages.0.objectives.1.text: Dostarczony Role przyznaje tylko odczyt istniejącej konfiguracji trasy po nazwie.
stages.0.objectives.2.text: Używając zamontowanego poświadczenia i weryfikacji CA, reader otrzymuje HTTP `200` i
  trasę `north-114` z istniejącej konfiguracji.
stages.0.objectives.3.text: To samo poświadczenie reader otrzymuje HTTP `403` dla list ConfigMap, list Secret i
  oddzielnej chronionej konfiguracji.
diagnostics.automount: Pod lub jego ServiceAccount może nadal włączać automatyczne montowanie danych. Sprawdź flagę poda, a gdy jest pominięta, powiązany ServiceAccount. [Przyczyna i kontrola](guides#guide=workload-access&section=q114-reader-disable-default-token)
diagnostics.projection: Kontener worker może montować inną projekcję, używać podścieżki lub żądać tokenu z innym odbiorcą albo okresem. Prześledź /credential do jednego źródła tokenu o path token dla https://kubernetes.default.svc.cluster.local i 600 sekund. [Przyczyna i kontrola](guides#guide=workload-access&section=q114-reader-explicit-token-projection)
diagnostics.role: Role reader może nadal dawać szerokie uprawnienia lub nie istnieć. Sprawdź każdą regułę i zostaw tylko get na nazwany ConfigMap route w podstawowej grupie API. [Przyczyna i kontrola](guides#guide=workload-access&section=q114-reader-exact-role)
diagnostics.allowed: Projektowany token może nie istnieć, mieć niewłaściwego odbiorcę lub nie mieć zgody na route. Użyj rzeczywistego tokenu bez wypisywania i potwierdź HTTP 200 dla GET configmaps/route. [Przyczyna i kontrola](guides#guide=workload-access&section=q114-reader-named-api-authorization)
diagnostics.value: Udane żądanie może zwracać starą trasę, a wcześniejszy błąd pozostawić brak poprawnego JSON. Sprawdź data.route pod kątem north-114 bez wypisywania tokenu. [Przyczyna i kontrola](guides#guide=workload-access&section=q114-reader-route-response-data)
diagnostics.denied_configmaps: Szerokie uprawnienie ConfigMap może pozwalać na listowanie. Sprawdź HTTP 403 dla GET configmaps z projektowanym tokenem, osobno od żądania nazwanego route. [Przyczyna i kontrola](guides#guide=workload-access&section=q114-reader-configmap-list-denial)
diagnostics.denied_secrets: Role lub powiązanie może pozwalać na listę Secretów. Sprawdź HTTP 403 dla uwierzytelnionego GET secrets. Błąd uwierzytelnienia lub timeout nie potwierdza odmowy autoryzacji. [Przyczyna i kontrola](guides#guide=workload-access&section=q114-reader-secret-list-denial)
diagnostics.denied_configmaps_offlimits: Reguła może pozwalać czytać inne nazwane ConfigMapy. Sprawdź HTTP 403 dla configmaps/offlimits, zachowując odczyt route. [Przyczyna i kontrola](guides#guide=workload-access&section=q114-reader-unrelated-configmap-denial)
diagnostics.probe_0_0: Kontrola konfiguracji tokenu może zatrzymać się przed wskazaniem pola przez problem z procesem lub wejściami. Sprawdź Deployment reader, ServiceAccount i narzędzia. [Przyczyna i kontrola](guides#guide=workload-access&section=q114-reader-projection-observer-input)
