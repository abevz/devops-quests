title: Granice tokenów konta Service
brief: "Reader nie może odczytać wymaganych danych API. Przywróć wąsko ograniczony dostęp bez ujawniania poświadczeń.\n\
  \nPracuj w `~/quest` na stacji roboczej. Dostarczone pliki: `reader-sa.json`, `role.json`, `binding.json`, `route.json`,\
  \ `reader.json`, `api-ca.pem`, `api-endpoint`.\n\n**Requirements:**\n\n- Deployment `reader` wyłącza automatyczne\
  \ montowanie tokena i projektuje token dla odbiorcy API w `/credential/token` wewnątrz kontenera z żądanym czasem\
  \ życia `600` sekund.\n  - Plik tokena należy do kontenera reader; jego względna ścieżka projekcji to `token`.\
  \ Zachowaj poufność poświadczeń.\n- Role `reader` pozwala tylko na `get` ConfigMap `route` z głównego API.\n-\
  \ Z zamontowanym tokenem reader i weryfikacją CA żądanie GET ConfigMap `route` zwraca HTTP `200` z trasą `north-114`.\n\
  - Te same dane uwierzytelniające reader otrzymują HTTP `403` przy listowaniu ConfigMap i Secret oraz odczycie\
  \ ConfigMap `offlimits`.\n\n**Verify yourself before Check & finish:** Wykonaj te polecenia obserwacji z `~/quest`\
  \ na stacji roboczej.\n\n- Ustawienia, tożsamość i stan odpowiadają wymaganiom.\n\n  ```sh\n  kubectl get deployment\
  \ reader -o yaml\n  kubectl get role reader -o yaml\n  ```\n\n- Wskazana trasa zwraca `north-114` i HTTP `200`;\
  \ pozostałe trzy żądania zwracają HTTP `403`. Nie wyświetlaj ani nie zapisuj tokena.\n\n  ```sh\n  api=$(cat api-endpoint)\n\
  \  token=$(kubectl exec deployment/reader -- cat /credential/token)\n  for path in configmaps/route configmaps\
  \ secrets configmaps/offlimits; do\n    printf 'header = \"Authorization: Bearer %s\"\\n' \"$token\" |\n     \
  \ curl --config - --cacert api-ca.pem -sS -w '\\nHTTP %{http_code}\\n' \\\n      \"$api/api/v1/namespaces/$DQ_NAMESPACE/$path\"\
  \n  done\n  unset token\n  ```\n\nKontrole obejmują te żądania i bieżącą Role, nie wszystkie możliwe uprawnienia\
  \ ani historię poleceń."
debrief: Krótkotrwała autoryzacja projected credentials i najniższe uprawnienia rozwiązują różne części dostępu
  API.
stages.0.brief: Reader musi odczytywać wskazaną trasę, a szersze żądania mają pozostać zabronione.
hints.0.text: Uwierzytelnianie sprawdza audience przed autoryzacją RBAC.
hints.1.text: Projektowany wolumen żąda tokenu dla jednego określonego odbiorcy.
hints.2.text: Naprawiaj tylko audience, poczekaj na wymianę i użyj dostarczonego CA dla HTTPS. Dostarczony odbiorca
  wskazuje wycofaną usługę. Odbiorca API to `https://kubernetes.default.svc.cluster.local`.
phrases.0: Sprawdziłem token audience bez ujawniania credentials.
phrases.1: Użyłem CA zweryfikowanego HTTPS do prawdziwego żądania API.
phrases.2: Przetestowałem dozwolone i zabronione operacje.
questions.0.points.0: NIE; uwierzytelnienie identyfikuje principal, RBAC autoryzuje działania.
questions.0.points.1: Walidacja i uprawnienia Audience to oddzielne kontrole.
questions.0.prompt: Czy ważny token umożliwia każdą operację?
questions.1.points.0: Obsługują wygaśnięcie, powiązanie audience i Pod.
questions.1.points.1: Kubelet obraca wyświetlany token; aplikacje muszą go załadować ponownie.
questions.1.prompt: Dlaczego wolisz projected tokens od starszego token Secrets?
diagnostics.automount: reader automountServiceAccountToken musi być równe false.
diagnostics.projection: reader projected token musi być równe path token, audience https://kubernetes.default.svc.cluster.local,
  expirationSeconds 600.
diagnostics.role: role/reader rules musi być równe get configmaps resourceNames [route].
diagnostics.allowed: reader GET configmaps/route musi być równe HTTP 200.
diagnostics.value: configmaps/route data.route musi być równe north-114.
diagnostics.denied_configmaps: reader GET configmaps musi zwrócić HTTP 403.
diagnostics.denied_secrets: reader GET secrets musi zwrócić HTTP 403.
diagnostics.denied_configmaps_offlimits: reader GET configmaps/offlimits musi zwrócić HTTP 403.
stages.0.objectives.0.text: Deployment `reader` wyłącza automatyczne montowanie tokena i projektuje token dla odbiorcy
  API w `/credential/token` wewnątrz kontenera z żądanym czasem życia `600` sekund.
