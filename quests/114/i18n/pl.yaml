title: Granice tokenów konta Service
brief: 'Reader używa projektowanego tokenu powiązanego z Podem o żądanym czasie życia dziesięciu minut. Jego odbiorca (`audience`)
  wskazuje na wycofaną usługę, więc API Kubernetes go odrzuca. Ustaw odbiorcę na `https://kubernetes.default.svc.cluster.local`,
  pozostaw automatyczne montowanie wyłączone i zachowaj Role pozwalającą tylko na odczyt nazwanego route. Użyj zamontowanego
  tokenu do rzeczywistego żądania API z weryfikacją CA; nigdy nie wypisuj ani nie zapisuj tokenu. Sprawdź, że `get` route
  się udaje, a `list` ConfigMap i Secret jest zabroniony.


  Dostarczone pliki w `~/quest`: `reader-sa.json`, `role.json`, `binding.json`, `route.json`, `reader.json`, `api-ca.pem`,
  `api-endpoint`.


  Zatoka nie ma internetu ani zewnętrznego DNS. Korzystaj tylko z dostarczonych plików, załadowanych obrazów i prywatnych
  usług. Zmieniaj tylko tę zatokę.


  Początkowe kryteria: projektowany token ma odbiorcę API i żądany czas życia 600 sekund; odczyt nazwanego obiektu się udaje,
  a szerokie listy zwracają 403.


  Pierwsze źródło projektowanego tokenu musi mieć dokładnie `path: token`, `expirationSeconds: 600` i `audience: https://kubernetes.default.svc.cluster.local`,
  przy wyłączonym automatycznym montowaniu. Role `reader` musi zawierać dokładnie jedną regułę core API: `get` na `configmaps`,
  `resourceNames: [route]`. Zweryfikowane przez CA żądanie reader do `configmaps/route` musi zwrócić 200 i `.data.route: north-114`;
  żądania list ConfigMap i Secret oraz nazwanej ConfigMap `offlimits` muszą każde zwrócić 403. Kontrole obejmują wskazane
  żądania i bieżącą Role, a nie wszystkie możliwe uprawnienia ani historię poleceń.'
debrief: Krótkotrwała autoryzacja projected credentials i najniższe uprawnienia rozwiązują różne części dostępu API.
stages.0.brief: Projektowany token, dokładna Role reader oraz dozwolone i odrzucone żądania z weryfikacją CA odpowiadają opisowi.
stages.0.objectives.0.text: Projektowany token, dokładna Role reader oraz dozwolone i odrzucone żądania z weryfikacją CA odpowiadają
  opisowi.
hints.0.text: Uwierzytelnianie sprawdza audience przed autoryzacją RBAC.
hints.1.text: Projektowany wolumen żąda tokenu dla jednego określonego odbiorcy.
hints.2.text: Naprawiaj tylko audience, poczekaj na wymianę i użyj dostarczonego CA dla HTTPS.
phrases.0: Sprawdziłem token audience bez ujawniania credentials.
phrases.1: Użyłem CA zweryfikowanego HTTPS do prawdziwego żądania API.
phrases.2: Przetestowałem dozwolone i zabronione operacje.
questions.0.points.0: NIE; uwierzytelnienie identyfikuje principal, RBAC autoryzuje działania.
questions.0.points.1: Walidacja i uprawnienia Audience to oddzielne kontrole.
questions.0.prompt: Czy ważny token umożliwia każdą operację?
questions.1.points.0: Obsługują wygaśnięcie, powiązanie audience i Pod.
questions.1.points.1: Kubelet obraca wyświetlany token; aplikacje muszą go załadować ponownie.
questions.1.prompt: Dlaczego wolisz projected tokens od starszego token Secrets?
diagnostics.automount: reader automountServiceAccountToken musi być równe false.
diagnostics.projection: reader projected token musi być równe path token, audience https://kubernetes.default.svc.cluster.local,
  expirationSeconds 600.
diagnostics.role: role/reader rules musi być równe get configmaps resourceNames [route].
diagnostics.allowed: reader GET configmaps/route musi być równe HTTP 200.
diagnostics.value: configmaps/route data.route musi być równe north-114.
diagnostics.denied_configmaps: reader GET configmaps musi zwrócić HTTP 403.
diagnostics.denied_secrets: reader GET secrets musi zwrócić HTTP 403.
diagnostics.denied_configmaps_offlimits: reader GET configmaps/offlimits musi zwrócić HTTP 403.
