title: Granice tokenów konta Service
brief: |-
  Reader nie może odczytać wymaganych danych API. Przywróć wąsko ograniczony dostęp bez ujawniania poświadczeń.

  Pracuj na workstation w `~/quest` z dostarczonymi plikami:
  - `reader-sa.yaml`, `role.yaml`, `binding.yaml`, `route.yaml`, `reader.yaml`, `api-ca.pem`, `api-endpoint`.

  **Requirements:**

  - W Deployment `reader` zamontowanym poświadczeniem API jest prywatny token projekcyjny w `/credential/token`, ważny dla API i żądany na `600` sekund; automatyczne montowanie pozostaje wyłączone.
  - Dostarczony Role przyznaje tylko odczyt istniejącej konfiguracji trasy po nazwie.
  - Używając zamontowanego poświadczenia i weryfikacji CA, reader otrzymuje HTTP `200` i trasę `north-114` z istniejącej konfiguracji.
  - To samo poświadczenie reader otrzymuje HTTP `403` dla list ConfigMap, list Secret i oddzielnej chronionej konfiguracji.

  Kontrole obejmują te żądania i bieżącą Role, nie wszystkie możliwe uprawnienia ani historię poleceń.
debrief: Krótkotrwała autoryzacja projected credentials i najniższe uprawnienia rozwiązują różne części
  dostępu API.
stages.0.brief: Zachowaj poufność poświadczenia reader i weryfikuj CA API.
hints.0.text: Uwierzytelnianie sprawdza audience przed autoryzacją RBAC.
hints.1.text: |-
  Projektowany wolumen żąda tokenu dla jednego określonego odbiorcy.

  Sprawdź dostarczone dane i bieżące obserwacje:

  ```sh
  kubectl get deployment reader -o yaml
    kubectl get role reader -o yaml
  ```
hints.2.text: "Naprawiaj tylko audience, poczekaj na wymianę i użyj dostarczonego CA dla HTTPS. Dostarczony odbiorca wskazuje wycofaną usługę. Odbiorca API to `https://kubernetes.default.svc.cluster.local`.\n\nSprawdź wynik z `~/quest` na workstation:\n\n- Wskazana trasa zwraca `north-114` i HTTP `200`; pozostałe trzy żądania zwracają HTTP `403`. Nie wyświetlaj ani nie zapisuj tokena.\n\n  ```sh\n  api=$(cat api-endpoint)\n  token=$(kubectl exec deployment/reader -c worker -- cat /credential/token)\n  for path in configmaps/route configmaps secrets configmaps/offlimits; do\n    printf 'header = \"Authorization: Bearer %s\"\\n' \"$token\" |\n      curl --config - --cacert api-ca.pem -sS -w '\\nHTTP %{http_code}\\n' \\\n      \"$api/api/v1/namespaces/$DQ_NAMESPACE/$path\"\n  done\n  unset token\n  ```"
phrases.0: Sprawdziłem token audience bez ujawniania credentials.
phrases.1: Użyłem CA zweryfikowanego HTTPS do prawdziwego żądania API.
phrases.2: Przetestowałem dozwolone i zabronione operacje.
questions.0.points.0: NIE; uwierzytelnienie identyfikuje principal, RBAC autoryzuje działania.
questions.0.points.1: Walidacja i uprawnienia Audience to oddzielne kontrole.
questions.0.prompt: Czy ważny token umożliwia każdą operację?
questions.1.points.0: Obsługują wygaśnięcie, powiązanie audience i Pod.
questions.1.points.1: Kubelet obraca wyświetlany token; aplikacje muszą go załadować ponownie.
questions.1.prompt: Dlaczego wolisz projected tokens od starszego token Secrets?
diagnostics.automount: Automatyczne montowanie poświadczeń musi być wyłączone dla Podów reader.
diagnostics.projection: reader projected token musi być równe path token, audience https://kubernetes.default.svc.cluster.local,
  expirationSeconds 600.
diagnostics.role: role/reader rules musi być równe get configmaps resourceNames [route].
diagnostics.allowed: reader GET configmaps/route musi być równe HTTP 200.
diagnostics.value: configmaps/route data.route musi być równe north-114.
diagnostics.denied_configmaps: reader GET configmaps musi zwrócić HTTP 403.
diagnostics.denied_secrets: reader GET secrets musi zwrócić HTTP 403.
diagnostics.denied_configmaps_offlimits: reader GET configmaps/offlimits musi zwrócić HTTP 403.
