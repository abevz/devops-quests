title: Granice tokenów konta Service
brief: 'reader używa przewidywanego tokena powiązanego z Pod z żądanym dziesięciominutowym okresem życia.
  Odbiorcy wskazują na wycofaną usługę, więc Kubernetes API ją odrzuca. Ustaw audience https://kubernetes.default.svc.cluster.local,
  zachowując wyłączone automatyczne montowanie i nazwany route tylko do odczytu Role. Użyj zamontowanego
  tokena do prawdziwego żądania CA zweryfikowanego przez API; nigdy nie drukuj ani nie zapisuj tokena.
  Udowodnij, że route get powiodło się, podczas gdy list ConfigMaps i Secrets zostały odrzucone.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `reader-sa.json`, `role.json`,
  `binding.json`, `route.json`, `reader.json`, `api-ca.pem`, `api-endpoint`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: projected token ma publiczność API i żądanie trwające 600 sekund; rzeczywista
  nazwa get powiedzie się, a szerokie listy zwrócą 403.'
debrief: Krótkotrwała autoryzacja projected credentials i najniższe uprawnienia rozwiązują różne części
  dostępu API.
stages.0.brief: 'Kryteria sukcesu: wyświetlany token ma odbiorców API i żądanie trwające 600 sekund; rzeczywista
  nazwa get powiedzie się, a szerokie listy zwrócą 403.'
stages.0.objectives.0.text: Wyświetlany token ma odbiorców API i 600-sekundowe żądanie; rzeczywista nazwa
  get powiedzie się, a szerokie listy zwrócą 403.
hints.0.text: Uwierzytelnianie sprawdza audience przed autoryzacją RBAC.
hints.1.text: Przewidywana liczba żąda tokenu dla jednego zamierzonego odbiorcy.
hints.2.text: Naprawiaj tylko audience, poczekaj na wymianę i użyj dostarczonego CA dla HTTPS.
phrases.0: Sprawdziłem token audience bez ujawniania credentials.
phrases.1: Użyłem CA zweryfikowanego HTTPS do prawdziwego żądania API.
phrases.2: Przetestowałem dozwolone i zabronione operacje.
questions.0.points.0: NIE; uwierzytelnienie identyfikuje principal, RBAC autoryzuje działania.
questions.0.points.1: Walidacja i uprawnienia Audience to oddzielne kontrole.
questions.0.prompt: Czy ważny token umożliwia każdą operację?
questions.1.points.0: Obsługują wygaśnięcie, powiązanie audience i Pod.
questions.1.points.1: Kubelet obraca wyświetlany token; aplikacje muszą go załadować ponownie.
questions.1.prompt: Dlaczego wolisz projected tokens od starszego token Secrets?
