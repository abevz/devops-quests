title: Границы токенов service account
brief: 'Читатель использует projected token, связанный с Pod, с запрошенным сроком
  десять минут. Audience указывает на старый сервис, и Kubernetes API отклоняет токен.
  Задайте audience https://kubernetes.default.svc.cluster.local, сохраните отключённый
  automount и Role только для чтения именованного route. Выполните настоящий API-запрос
  с проверкой CA и смонтированным токеном; токен не печатайте и не сохраняйте. Get
  route должен работать, list ConfigMaps и Secrets — отклоняться.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `reader-sa.json`,
  `role.json`, `binding.json`, `route.json`, `reader.json`, `api-ca.pem`, `api-endpoint`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно
  загруженные образы и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Projected token имеет audience API и запрос 600 секунд; get
  именованного объекта работает, широкие list возвращают 403.'
debrief: Краткоживущие projected credentials и минимальная авторизация решают разные
  части доступа к API.
stages.0.brief: 'Результат проверки: Projected token имеет audience API и запрос 600
  секунд; get именованного объекта работает, широкие list возвращают 403.'
stages.0.objectives.0.text: Projected token имеет audience API и запрос 600 секунд;
  get именованного объекта работает, широкие list возвращают 403.
hints.0.text: Аутентификация проверяет audience до авторизации RBAC.
hints.1.text: Projected volume запрашивает токен для определённого получателя.
hints.2.text: Исправьте только audience, дождитесь замены и используйте выданный CA
  для HTTPS.
phrases.0: Я проверил audience без раскрытия credentials.
phrases.1: Я использовал HTTPS с проверкой CA для реального API-запроса.
phrases.2: Я проверил разрешённые и запрещённые операции.
questions.0.points.0: 'Нет: аутентификация определяет principal, RBAC разрешает действия.'
questions.0.points.1: Audience и разрешения проверяются отдельно.
questions.0.prompt: Даёт ли действительный токен любые операции?
questions.1.points.0: Они поддерживают срок действия, audience и привязку к Pod.
questions.1.points.1: Kubelet ротирует токен; приложение должно перечитывать его.
questions.1.prompt: Почему projected tokens предпочтительнее старых token Secrets?
