title: Границы токенов service account
brief: 'Reader использует проецируемый токен, привязанный к Pod, с запрошенным сроком жизни десять минут. Его получатель (audience)
  указывает на выведенный из эксплуатации сервис, поэтому Kubernetes API отклоняет токен. Установите получателя https://kubernetes.default.svc.cluster.local,
  оставьте автоматическое монтирование отключённым и сохраните Role только для чтения именованного route. Используйте смонтированный
  токен для настоящего запроса к API с проверкой CA; никогда не выводите и не сохраняйте токен. Проверьте, что get route успешен,
  а list ConfigMap и Secret запрещён.


  Выданные файлы в `~/quest`: `reader-sa.json`, `role.json`, `binding.json`, `route.json`, `reader.json`, `api-ca.pem`, `api-endpoint`.


  В песочнице нет интернета и внешнего DNS. Используйте только выданные файлы, загруженные образы и приватные сервисы. Меняйте
  только эту песочницу.


  Начальные критерии: проецируемый токен имеет получателя API и запрошенный срок 600 секунд; чтение именованного объекта успешно,
  широкие списки возвращают 403.


  Первый источник проецируемого токена должен содержать ровно `path: token`, `expirationSeconds: 600` и `audience: https://kubernetes.default.svc.cluster.local`,
  автоматическое монтирование отключено. Role `reader` должна содержать ровно одно правило core API: `get` для `configmaps`,
  `resourceNames: [route]`. Проверенный по CA запрос reader к `configmaps/route` должен вернуть 200 и `.data.route: north-114`;
  запросы списков ConfigMap и Secret и именованной ConfigMap `offlimits` должны каждый вернуть 403. Проверки охватывают указанные
  запросы и текущую Role, но не все возможные права или историю команд.'
debrief: Краткоживущие projected credentials и минимальная авторизация решают разные части доступа к API.
stages.0.brief: Проецируемый токен, точная Role reader и разрешённые и отклонённые запросы с проверкой CA соответствуют описанию.
stages.0.objectives.0.text: Проецируемый токен, точная Role reader и разрешённые и отклонённые запросы с проверкой CA соответствуют
  описанию.
hints.0.text: Аутентификация проверяет audience до авторизации RBAC.
hints.1.text: Projected volume запрашивает токен для определённого получателя.
hints.2.text: Исправьте только audience, дождитесь замены и используйте выданный CA для HTTPS.
phrases.0: Я проверил audience без раскрытия credentials.
phrases.1: Я использовал HTTPS с проверкой CA для реального API-запроса.
phrases.2: Я проверил разрешённые и запрещённые операции.
questions.0.points.0: 'Нет: аутентификация определяет principal, RBAC разрешает действия.'
questions.0.points.1: Audience и разрешения проверяются отдельно.
questions.0.prompt: Даёт ли действительный токен любые операции?
questions.1.points.0: Они поддерживают срок действия, audience и привязку к Pod.
questions.1.points.1: Kubelet ротирует токен; приложение должно перечитывать его.
questions.1.prompt: Почему projected tokens предпочтительнее старых token Secrets?
diagnostics.automount: reader automountServiceAccountToken должен совпадать с false.
diagnostics.projection: reader projected token должен совпадать с path token, audience https://kubernetes.default.svc.cluster.local,
  expirationSeconds 600.
diagnostics.role: role/reader rules должен совпадать с get configmaps resourceNames [route].
diagnostics.allowed: reader GET configmaps/route должен совпадать с HTTP 200.
diagnostics.value: configmaps/route data.route должен совпадать с north-114.
diagnostics.denied_configmaps: reader GET configmaps должен вернуть HTTP 403.
diagnostics.denied_secrets: reader GET secrets должен вернуть HTTP 403.
diagnostics.denied_configmaps_offlimits: reader GET configmaps/offlimits должен вернуть HTTP 403.
