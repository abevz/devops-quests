title: Границы токенов service account
brief: |-
  Reader не может получить нужные данные API. Восстановите строго ограниченный доступ без раскрытия учётных данных.

  Работайте на workstation в `~/quest` с предоставленными файлами:
  - `reader-sa.yaml`, `role.yaml`, `binding.yaml`, `route.yaml`, `reader.yaml`, `api-ca.pem`, `api-endpoint`.

  **Requirements:**

  - В Deployment `reader` смонтированная учётная информация API — закрытый проецируемый токен в `/credential/token`, действительный для API и запрошенный на `600` секунд; автоматическое монтирование остаётся отключённым.
  - Предоставленный Role разрешает только чтение по имени существующей конфигурации маршрута.
  - Со смонтированной учётной информацией и проверкой CA reader получает HTTP `200` и маршрут `north-114` из существующей конфигурации маршрута.
  - Те же учётные данные reader получают HTTP `403` для списков ConfigMap, списков Secret и отдельной защищённой конфигурации.

  Проверки охватывают эти запросы и текущую Role, а не все возможные права или историю команд.
debrief: Краткоживущие projected credentials и минимальная авторизация решают разные части доступа к API.
stages.0.brief: Сохраняйте учётные данные reader в тайне и проверяйте CA API.
hints.0.text: Аутентификация проверяет audience до авторизации RBAC.
hints.1.text: |-
  Projected volume запрашивает токен для определённого получателя.

  Изучите предоставленные файлы и живые наблюдения:

  ```sh
  kubectl get deployment reader -o yaml
    kubectl get role reader -o yaml
  ```
hints.2.text: "Исправьте только audience, дождитесь замены и используйте выданный CA для HTTPS. Предоставленная аудитория указывает на выведенный сервис. Аудитория API — `https://kubernetes.default.svc.cluster.local`.\n\nПроверьте результат из `~/quest` на workstation:\n\n- Указанный маршрут возвращает `north-114` и HTTP `200`; остальные три запроса возвращают HTTP `403`. Не выводите и не сохраняйте токен.\n\n  ```sh\n  api=$(cat api-endpoint)\n  token=$(kubectl exec deployment/reader -c worker -- cat /credential/token)\n  for path in configmaps/route configmaps secrets configmaps/offlimits; do\n    printf 'header = \"Authorization: Bearer %s\"\\n' \"$token\" |\n      curl --config - --cacert api-ca.pem -sS -w '\\nHTTP %{http_code}\\n' \\\n      \"$api/api/v1/namespaces/$DQ_NAMESPACE/$path\"\n  done\n  unset token\n  ```"
phrases.0: Я проверил audience без раскрытия credentials.
phrases.1: Я использовал HTTPS с проверкой CA для реального API-запроса.
phrases.2: Я проверил разрешённые и запрещённые операции.
questions.0.points.0: 'Нет: аутентификация определяет principal, RBAC разрешает действия.'
questions.0.points.1: Audience и разрешения проверяются отдельно.
questions.0.prompt: Даёт ли действительный токен любые операции?
questions.1.points.0: Они поддерживают срок действия, audience и привязку к Pod.
questions.1.points.1: Kubelet ротирует токен; приложение должно перечитывать его.
questions.1.prompt: Почему projected tokens предпочтительнее старых token Secrets?
diagnostics.automount: Автоматическое монтирование учётных данных должно быть отключено для Pod reader.
diagnostics.projection: reader projected token должен совпадать с path token, audience https://kubernetes.default.svc.cluster.local,
  expirationSeconds 600.
diagnostics.role: role/reader rules должен совпадать с get configmaps resourceNames [route].
diagnostics.allowed: reader GET configmaps/route должен совпадать с HTTP 200.
diagnostics.value: configmaps/route data.route должен совпадать с north-114.
diagnostics.denied_configmaps: reader GET configmaps должен вернуть HTTP 403.
diagnostics.denied_secrets: reader GET secrets должен вернуть HTTP 403.
diagnostics.denied_configmaps_offlimits: reader GET configmaps/offlimits должен вернуть HTTP 403.
