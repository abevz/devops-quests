title: Границы токенов service account
brief: "Reader не может получить нужные данные API. Восстановите строго ограниченный доступ без раскрытия учётных\
  \ данных.\n\nРаботайте в `~/quest` на рабочей станции. Предоставлены файлы: `reader-sa.yaml`, `role.yaml`, `binding.yaml`,\
  \ `route.yaml`, `reader.yaml`, `api-ca.pem`, `api-endpoint`.\n\n**Requirements:**\n\n- Deployment `reader` отключает\
  \ автоматическое монтирование токена и проецирует токен для аудитории API в `/credential/token` внутри контейнера\
  \ с запрошенным сроком `600` секунд.\n  - Файл токена находится внутри контейнера reader; относительный путь проекции\
  \ — `token`. Храните учётные данные в тайне.\n- Role `reader` разрешает только `get` для ConfigMap `route` основного\
  \ API.\n- С монтированным токеном reader и проверкой CA запрос GET ConfigMap `route` возвращает HTTP `200` с маршрутом\
  \ `north-114`.\n- Те же учётные данные reader получают HTTP `403` при получении списков ConfigMap и Secret и чтении\
  \ ConfigMap `offlimits`.\n\n**Verify yourself before Check & finish:** Выполните эти команды наблюдения из `~/quest`\
  \ на рабочей станции.\n\n- Настройки, идентичность и состояние соответствуют требованиям.\n\n  ```sh\n  kubectl\
  \ get deployment reader -o yaml\n  kubectl get role reader -o yaml\n  ```\n\n- Указанный маршрут возвращает `north-114`\
  \ и HTTP `200`; остальные три запроса возвращают HTTP `403`. Не выводите и не сохраняйте токен.\n\n  ```sh\n \
  \ api=$(cat api-endpoint)\n  token=$(kubectl exec deployment/reader -- cat /credential/token)\n  for path in configmaps/route\
  \ configmaps secrets configmaps/offlimits; do\n    printf 'header = \"Authorization: Bearer %s\"\\n' \"$token\"\
  \ |\n      curl --config - --cacert api-ca.pem -sS -w '\\nHTTP %{http_code}\\n' \\\n      \"$api/api/v1/namespaces/$DQ_NAMESPACE/$path\"\
  \n  done\n  unset token\n  ```\n\nПроверки охватывают эти запросы и текущую Role, а не все возможные права или\
  \ историю команд."
debrief: Краткоживущие projected credentials и минимальная авторизация решают разные части доступа к API.
stages.0.brief: Reader должен читать указанный маршрут, а более широкие запросы должны оставаться запрещёнными.
hints.0.text: Аутентификация проверяет audience до авторизации RBAC.
hints.1.text: Projected volume запрашивает токен для определённого получателя.
hints.2.text: Исправьте только audience, дождитесь замены и используйте выданный CA для HTTPS. Предоставленная аудитория
  указывает на выведенный сервис. Аудитория API — `https://kubernetes.default.svc.cluster.local`.
phrases.0: Я проверил audience без раскрытия credentials.
phrases.1: Я использовал HTTPS с проверкой CA для реального API-запроса.
phrases.2: Я проверил разрешённые и запрещённые операции.
questions.0.points.0: 'Нет: аутентификация определяет principal, RBAC разрешает действия.'
questions.0.points.1: Audience и разрешения проверяются отдельно.
questions.0.prompt: Даёт ли действительный токен любые операции?
questions.1.points.0: Они поддерживают срок действия, audience и привязку к Pod.
questions.1.points.1: Kubelet ротирует токен; приложение должно перечитывать его.
questions.1.prompt: Почему projected tokens предпочтительнее старых token Secrets?
diagnostics.automount: reader automountServiceAccountToken должен совпадать с false.
diagnostics.projection: reader projected token должен совпадать с path token, audience https://kubernetes.default.svc.cluster.local,
  expirationSeconds 600.
diagnostics.role: role/reader rules должен совпадать с get configmaps resourceNames [route].
diagnostics.allowed: reader GET configmaps/route должен совпадать с HTTP 200.
diagnostics.value: configmaps/route data.route должен совпадать с north-114.
diagnostics.denied_configmaps: reader GET configmaps должен вернуть HTTP 403.
diagnostics.denied_secrets: reader GET secrets должен вернуть HTTP 403.
diagnostics.denied_configmaps_offlimits: reader GET configmaps/offlimits должен вернуть HTTP 403.
