title: Límites del token Service account
brief: |-
  El lector no puede obtener sus datos de la API. Recupera su identidad de corta duración y acceso limitado sin exponer credenciales.

  Trabaja en la workstation en `~/quest`. Las entradas de conexión son `api-ca.pem` y `api-endpoint`. La carga y los objetos de acceso actuales están disponibles mediante Kubernetes.

  **Requisitos:**

  - En el Deployment `reader`, la credencial API montada es un token proyectado privado en `/credential/token`, válido para la API y solicitado por `600` segundos; el montaje automático sigue desactivado.
  - El Role suministrado concede solo lectura por nombre de la configuración de ruta existente.
  - Con su credencial montada y verificación de CA, el reader recibe HTTP `200` y ruta `north-114` de la configuración existente.
  - La misma credencial del reader recibe HTTP `403` para listas de ConfigMap, listas de Secret y la configuración protegida separada.

  Las comprobaciones observan la proyección declarada, el Role actual y estas peticiones API concretas, no todos los permisos posibles ni el historial de cambios.
debrief: La validación del destinatario establece dónde puede autenticarse una credencial. Un vínculo en el namespace
  conecta la identidad de la carga con un Role mínimo; las peticiones permitidas y denegadas revelan acceso excesivo.
stages.0.brief: Recupera la identidad de la carga y el acceso efectivo manteniendo las credenciales privadas.
hints.0.text: Una petición API atraviesa autenticación y autorización. Un destinatario válido no concede permisos;
  un Role mínimo no autoriza nada sin vincularlo a la identidad que actúa.
hints.1.text: |-
  Inspecciona la identidad de la carga y sus relaciones de acceso actuales. Compara solo metadatos del destinatario con el cliente de la workstation que ya se autentica en esta API; no imprimas ningún token bearer.

  ```sh
  kubectl get deployment reader -o yaml
  kubectl get role,rolebinding
  decode_audience='import base64,json,sys; token=sys.stdin.read().strip(); print(json.dumps(json.loads(base64.urlsafe_b64decode(token.split(".")[1]+"==="))["aud"]))'
  kubectl config view --raw --minify -o json |
    python3 -I -c 'import json,sys; print(json.load(sys.stdin)["users"][0]["user"]["token"])' |
    python3 -I -c "$decode_audience"
  kubectl exec deployment/reader -c worker -- cat /credential/token |
    python3 -I -c "$decode_audience"
  unset decode_audience
  ```
hints.2.text: |-
  Verifica la lectura permitida y cada petición denegada con la credencial de la carga y la CA suministrada. La ruta debe devolver north-114 y HTTP 200; las demás peticiones, HTTP 403.

  `kubectl get role,rolebinding`

  ```sh
  api=$(cat api-endpoint)
  token=$(kubectl exec deployment/reader -c worker -- cat /credential/token)
  printf 'header = "Authorization: Bearer %s"\n' "$token" |
    curl --config - --cacert api-ca.pem -sS "$api/api/v1/namespaces/$DQ_NAMESPACE/configmaps/route" |
    jq -r '.data.route // empty'
  for path in configmaps/route configmaps secrets configmaps/offlimits; do
    printf '%s ' "$path"
    printf 'header = "Authorization: Bearer %s"\n' "$token" |
      curl --config - --cacert api-ca.pem -sS -o /dev/null -w 'HTTP %{http_code}\n' \
      "$api/api/v1/namespaces/$DQ_NAMESPACE/$path"
  done
  unset token
  ```
phrases.0: Revisé el token audience sin exponer credentials.
phrases.1: Utilicé HTTPS verificado por CA para la solicitud API real.
phrases.2: Probé operaciones permitidas y denegadas.
questions.0.points.0: No; la autenticación identifica el principal, RBAC autoriza acciones.
questions.0.points.1: La validación y los permisos de Audience son comprobaciones independientes.
questions.0.prompt: ¿Un token válido garantiza todas las operaciones?
questions.1.points.0: Admiten vencimiento, vinculación audience y Pod.
questions.1.points.1: Kubelet rota el token proyectado; las aplicaciones deben recargarlo.
questions.1.prompt: ¿Por qué preferir projected tokens al token Secrets heredado?
stages.0.objectives.0.text: En el Deployment `reader`, la credencial API montada es un token proyectado privado
  en `/credential/token`, válido para la API y solicitado por `600` segundos; el montaje automático sigue desactivado.
stages.0.objectives.1.text: El Role suministrado concede solo lectura por nombre de la configuración de ruta existente.
stages.0.objectives.2.text: Con su credencial montada y verificación de CA, el reader recibe HTTP `200` y ruta `north-114`
  de la configuración existente.
stages.0.objectives.3.text: La misma credencial del reader recibe HTTP `403` para listas de ConfigMap, listas de
  Secret y la configuración protegida separada.
diagnostics.automount: El Pod o su ServiceAccount puede seguir habilitando el montaje automático. Revise el valor del Pod y, si falta, el del ServiceAccount asociado. [Causa y comprobación](guides#guide=workload-access&section=q114-reader-disable-default-token)
diagnostics.projection: El worker puede montar otra proyección, usar una subruta o pedir un token de audiencia o duración incorrectas. Siga /credential hasta una sola fuente con path token para https://kubernetes.default.svc.cluster.local y 600 segundos. [Causa y comprobación](guides#guide=workload-access&section=q114-reader-explicit-token-projection)
diagnostics.role: El Role reader puede seguir otorgando permisos amplios o faltar. Revise cada regla y deje solo get sobre el ConfigMap route en el grupo API principal. [Causa y comprobación](guides#guide=workload-access&section=q114-reader-exact-role)
diagnostics.allowed: El token proyectado puede faltar, tener audiencia incorrecta o carecer de permiso para route. Use el token montado de forma privada y verifique HTTP 200 en GET configmaps/route. [Causa y comprobación](guides#guide=workload-access&section=q114-reader-named-api-authorization)
diagnostics.value: Una petición exitosa puede devolver una ruta anterior o un fallo previo dejar sin JSON válido. Lea data.route y compruebe north-114 sin mostrar el token. [Causa y comprobación](guides#guide=workload-access&section=q114-reader-route-response-data)
diagnostics.denied_configmaps: Un permiso ConfigMap amplio puede permitir listar la colección. Compruebe HTTP 403 en GET configmaps con el token proyectado, aparte de la consulta de route. [Causa y comprobación](guides#guide=workload-access&section=q114-reader-configmap-list-denial)
diagnostics.denied_secrets: Un Role o vínculo puede permitir listar Secrets. Compruebe HTTP 403 en GET secrets autenticado. Un fallo de autenticación o timeout no confirma la denegación. [Causa y comprobación](guides#guide=workload-access&section=q114-reader-secret-list-denial)
diagnostics.denied_configmaps_offlimits: Una regla puede permitir la lectura de otros ConfigMaps por nombre. Compruebe HTTP 403 para configmaps/offlimits y conserve el acceso a route. [Causa y comprobación](guides#guide=workload-access&section=q114-reader-unrelated-configmap-denial)
diagnostics.probe_0_0: El observador puede detenerse antes de señalar un campo si no inicia o no lee sus entradas. Revise Deployment reader, ServiceAccount y herramientas locales. [Causa y comprobación](guides#guide=workload-access&section=q114-reader-projection-observer-input)
