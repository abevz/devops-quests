title: Límites del token Service account
brief: |-
  El reader no puede acceder a los datos requeridos de la API. Restaure el acceso limitado sin exponer su credencial.

  Trabaja en la workstation en `~/quest` con los archivos suministrados:
  - `reader-sa.yaml`, `role.yaml`, `binding.yaml`, `route.yaml`, `reader.yaml`, `api-ca.pem`, `api-endpoint`.

  **Requirements:**

  - En el Deployment `reader`, la credencial API montada es un token proyectado privado en `/credential/token`, válido para la API y solicitado por `600` segundos; el montaje automático sigue desactivado.
  - El Role suministrado concede solo lectura por nombre de la configuración de ruta existente.
  - Con su credencial montada y verificación de CA, el reader recibe HTTP `200` y ruta `north-114` de la configuración existente.
  - La misma credencial del reader recibe HTTP `403` para listas de ConfigMap, listas de Secret y la configuración protegida separada.

  Las comprobaciones cubren estas solicitudes y el Role actual, no todos los permisos posibles ni el historial de comandos.
debrief: projected credentials de corta duración y la autorización de privilegios mínimos resuelven diferentes
  partes del acceso a API.
stages.0.brief: Mantén privada la credencial reader y verifica la CA de la API.
hints.0.text: La autenticación comprueba audience antes de la autorización RBAC.
hints.1.text: |-
  El volume proyectado solicita un token para un destinatario previsto.

  Inspecciona los datos suministrados y las observaciones activas:

  ```sh
  kubectl get deployment reader -o yaml
    kubectl get role reader -o yaml
  ```
hints.2.text: "Repare solo el audience, espere el reemplazo y use el CA suministrado para HTTPS. La audiencia suministrada apunta a un servicio retirado. La audiencia de la API es `https://kubernetes.default.svc.cluster.local`.\n\nVerifica el resultado desde `~/quest` en la workstation:\n\n- La ruta indicada devuelve `north-114` y HTTP `200`; las otras tres solicitudes devuelven HTTP `403`. No imprima ni guarde el token.\n\n  ```sh\n  api=$(cat api-endpoint)\n  token=$(kubectl exec deployment/reader -c worker -- cat /credential/token)\n  for path in configmaps/route configmaps secrets configmaps/offlimits; do\n    printf 'header = \"Authorization: Bearer %s\"\\n' \"$token\" |\n      curl --config - --cacert api-ca.pem -sS -w '\\nHTTP %{http_code}\\n' \\\n      \"$api/api/v1/namespaces/$DQ_NAMESPACE/$path\"\n  done\n  unset token\n  ```"
phrases.0: Revisé el token audience sin exponer credentials.
phrases.1: Utilicé HTTPS verificado por CA para la solicitud API real.
phrases.2: Probé operaciones permitidas y denegadas.
questions.0.points.0: No; la autenticación identifica el principal, RBAC autoriza acciones.
questions.0.points.1: La validación y los permisos de Audience son comprobaciones independientes.
questions.0.prompt: ¿Un token válido garantiza todas las operaciones?
questions.1.points.0: Admiten vencimiento, vinculación audience y Pod.
questions.1.points.1: Kubelet rota el token proyectado; las aplicaciones deben recargarlo.
questions.1.prompt: ¿Por qué preferir projected tokens al token Secrets heredado?
diagnostics.automount: El montaje automático de credenciales debe estar desactivado para los Pods de reader.
diagnostics.projection: reader projected token debe ser igual a path token, audience https://kubernetes.default.svc.cluster.local,
  expirationSeconds 600.
diagnostics.role: role/reader rules debe ser igual a get configmaps resourceNames [route].
diagnostics.allowed: reader GET configmaps/route debe ser igual a HTTP 200.
diagnostics.value: configmaps/route data.route debe ser igual a north-114.
diagnostics.denied_configmaps: reader GET configmaps debe devolver HTTP 403.
diagnostics.denied_secrets: reader GET secrets debe devolver HTTP 403.
diagnostics.denied_configmaps_offlimits: reader GET configmaps/offlimits debe devolver HTTP 403.
