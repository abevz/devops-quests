title: Límites del token Service account
brief: 'Un reader utiliza un projected, token vinculado a Pod con una vida útil solicitada de diez minutos.
  Su audience apunta a un servicio retired, por lo que el Kubernetes API lo rechaza. Configure audience
  https://kubernetes.default.svc.cluster.local, manteniendo el montaje automático deshabilitado y la ruta
  nombrada de solo lectura Role. Utilice el token montado para una solicitud API real verificada por CA;
  nunca imprima ni guarde el token. Demuestre que route tiene éxito mientras que se deniega list ConfigMaps
  y Secrets.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `reader-sa.json`, `role.json`,
  `binding.json`, `route.json`, `reader.json`, `api-ca.pem`, `api-endpoint`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: El projected token tiene el API audience y una solicitud de 600 segundos;
  La obtención de nombres reales tiene éxito y las listas amplias devuelven 403.'
debrief: projected credentials de corta duración y la autorización de privilegios mínimos resuelven diferentes
  partes del acceso a API.
stages.0.brief: 'Criterios de éxito: El token proyectado tiene el API audience y una solicitud de 600
  segundos; La obtención de nombres reales tiene éxito y las listas amplias devuelven 403.'
stages.0.objectives.0.text: El token proyectado tiene el API audience y una solicitud de 600 segundos;
  La obtención de nombres reales tiene éxito y las listas amplias devuelven 403.
hints.0.text: La autenticación comprueba audience antes de la autorización RBAC.
hints.1.text: El volume proyectado solicita un token para un destinatario previsto.
hints.2.text: Repare solo el audience, espere el reemplazo y use el CA suministrado para HTTPS.
phrases.0: Revisé el token audience sin exponer credentials.
phrases.1: Utilicé HTTPS verificado por CA para la solicitud API real.
phrases.2: Probé operaciones permitidas y denegadas.
questions.0.points.0: No; la autenticación identifica el principal, RBAC autoriza acciones.
questions.0.points.1: La validación y los permisos de Audience son comprobaciones independientes.
questions.0.prompt: ¿Un token válido garantiza todas las operaciones?
questions.1.points.0: Admiten vencimiento, vinculación audience y Pod.
questions.1.points.1: Kubelet rota el token proyectado; las aplicaciones deben recargarlo.
questions.1.prompt: ¿Por qué preferir projected tokens al token Secrets heredado?
