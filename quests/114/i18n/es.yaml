title: Límites del token Service account
brief: 'Reader utiliza un token proyectado vinculado al Pod con una duración solicitada de diez minutos. Su destinatario (audience)
  apunta a un servicio retirado, por lo que la API de Kubernetes lo rechaza. Establece el destinatario en https://kubernetes.default.svc.cluster.local,
  mantén desactivado el montaje automático y conserva la Role de solo lectura para el route nombrado. Usa el token montado
  para una petición real a la API verificada con CA; nunca imprimas ni guardes el token. Comprueba que get de route funciona
  mientras se deniega list de ConfigMaps y Secrets.


  Archivos proporcionados en `~/quest`: `reader-sa.json`, `role.json`, `binding.json`, `route.json`, `reader.json`, `api-ca.pem`,
  `api-endpoint`.


  La bahía no tiene internet ni DNS externo. Usa solo los archivos proporcionados, imágenes precargadas y servicios privados.
  Cambia solo esta bahía.


  Criterios iniciales: el token proyectado tiene el destinatario de la API y una duración solicitada de 600 segundos; el get
  del objeto nombrado funciona y las listas amplias devuelven 403.


  La primera fuente del token proyectado debe ser exactamente `path: token`, `expirationSeconds: 600` y `audience: https://kubernetes.default.svc.cluster.local`,
  con montaje automático desactivado. La Role `reader` debe contener exactamente una regla de la API core: `get` sobre `configmaps`,
  `resourceNames: [route]`. La petición reader a `configmaps/route` verificada con CA debe devolver 200 y `.data.route: north-114`;
  las peticiones de listas de ConfigMaps y Secrets y del ConfigMap nombrado `offlimits` deben devolver cada una 403. Las comprobaciones
  cubren esas peticiones y la Role activa, no todos los permisos posibles ni el historial de comandos.'
debrief: projected credentials de corta duración y la autorización de privilegios mínimos resuelven diferentes partes del
  acceso a API.
stages.0.brief: El token proyectado, la Role reader exacta y las peticiones permitidas y denegadas verificadas con CA coinciden
  con la descripción.
stages.0.objectives.0.text: El token proyectado, la Role reader exacta y las peticiones permitidas y denegadas verificadas
  con CA coinciden con la descripción.
hints.0.text: La autenticación comprueba audience antes de la autorización RBAC.
hints.1.text: El volume proyectado solicita un token para un destinatario previsto.
hints.2.text: Repare solo el audience, espere el reemplazo y use el CA suministrado para HTTPS.
phrases.0: Revisé el token audience sin exponer credentials.
phrases.1: Utilicé HTTPS verificado por CA para la solicitud API real.
phrases.2: Probé operaciones permitidas y denegadas.
questions.0.points.0: No; la autenticación identifica el principal, RBAC autoriza acciones.
questions.0.points.1: La validación y los permisos de Audience son comprobaciones independientes.
questions.0.prompt: ¿Un token válido garantiza todas las operaciones?
questions.1.points.0: Admiten vencimiento, vinculación audience y Pod.
questions.1.points.1: Kubelet rota el token proyectado; las aplicaciones deben recargarlo.
questions.1.prompt: ¿Por qué preferir projected tokens al token Secrets heredado?
diagnostics.automount: reader automountServiceAccountToken debe ser igual a false.
diagnostics.projection: reader projected token debe ser igual a path token, audience https://kubernetes.default.svc.cluster.local,
  expirationSeconds 600.
diagnostics.role: role/reader rules debe ser igual a get configmaps resourceNames [route].
diagnostics.allowed: reader GET configmaps/route debe ser igual a HTTP 200.
diagnostics.value: configmaps/route data.route debe ser igual a north-114.
diagnostics.denied_configmaps: reader GET configmaps debe devolver HTTP 403.
diagnostics.denied_secrets: reader GET secrets debe devolver HTTP 403.
diagnostics.denied_configmaps_offlimits: reader GET configmaps/offlimits debe devolver HTTP 403.
