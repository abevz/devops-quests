title: Límites del token Service account
brief: "El reader no puede acceder a los datos requeridos de la API. Restaure el acceso limitado sin exponer su\
  \ credencial.\n\nTrabaje en `~/quest` en la estación de trabajo. Archivos suministrados: `reader-sa.json`, `role.json`,\
  \ `binding.json`, `route.json`, `reader.json`, `api-ca.pem`, `api-endpoint`.\n\n**Requirements:**\n\n- El Deployment\
  \ `reader` desactiva el montaje automático y proyecta un token para la audiencia de la API en `/credential/token`\
  \ dentro del contenedor, con duración solicitada de `600` segundos.\n  - El archivo del token pertenece al contenedor\
  \ reader; su ruta relativa proyectada es `token`. Mantenga la credencial privada.\n- El Role `reader` permite\
  \ solo `get` del ConfigMap `route` de la API principal.\n- Con el token montado de reader y verificación de CA,\
  \ GET del ConfigMap `route` devuelve HTTP `200` con ruta `north-114`.\n- La misma credencial de reader recibe\
  \ HTTP `403` al listar ConfigMaps y Secrets y obtener ConfigMap `offlimits`.\n\n**Verify yourself before Check\
  \ & finish:** Ejecute estos comandos de observación desde `~/quest` en la estación de trabajo.\n\n- La configuración,\
  \ identidad y estado cumplen los requisitos.\n\n  ```sh\n  kubectl get deployment reader -o yaml\n  kubectl get\
  \ role reader -o yaml\n  ```\n\n- La ruta indicada devuelve `north-114` y HTTP `200`; las otras tres solicitudes\
  \ devuelven HTTP `403`. No imprima ni guarde el token.\n\n  ```sh\n  api=$(cat api-endpoint)\n  token=$(kubectl\
  \ exec deployment/reader -- cat /credential/token)\n  for path in configmaps/route configmaps secrets configmaps/offlimits;\
  \ do\n    printf 'header = \"Authorization: Bearer %s\"\\n' \"$token\" |\n      curl --config - --cacert api-ca.pem\
  \ -sS -w '\\nHTTP %{http_code}\\n' \\\n      \"$api/api/v1/namespaces/$DQ_NAMESPACE/$path\"\n  done\n  unset token\n\
  \  ```\n\nLas comprobaciones cubren estas solicitudes y el Role actual, no todos los permisos posibles ni el historial\
  \ de comandos."
debrief: projected credentials de corta duración y la autorización de privilegios mínimos resuelven diferentes partes
  del acceso a API.
stages.0.brief: El reader debe leer la ruta indicada mientras las solicitudes más amplias siguen prohibidas.
hints.0.text: La autenticación comprueba audience antes de la autorización RBAC.
hints.1.text: El volume proyectado solicita un token para un destinatario previsto.
hints.2.text: Repare solo el audience, espere el reemplazo y use el CA suministrado para HTTPS. La audiencia suministrada
  apunta a un servicio retirado. La audiencia de la API es `https://kubernetes.default.svc.cluster.local`.
phrases.0: Revisé el token audience sin exponer credentials.
phrases.1: Utilicé HTTPS verificado por CA para la solicitud API real.
phrases.2: Probé operaciones permitidas y denegadas.
questions.0.points.0: No; la autenticación identifica el principal, RBAC autoriza acciones.
questions.0.points.1: La validación y los permisos de Audience son comprobaciones independientes.
questions.0.prompt: ¿Un token válido garantiza todas las operaciones?
questions.1.points.0: Admiten vencimiento, vinculación audience y Pod.
questions.1.points.1: Kubelet rota el token proyectado; las aplicaciones deben recargarlo.
questions.1.prompt: ¿Por qué preferir projected tokens al token Secrets heredado?
diagnostics.automount: reader automountServiceAccountToken debe ser igual a false.
diagnostics.projection: reader projected token debe ser igual a path token, audience https://kubernetes.default.svc.cluster.local,
  expirationSeconds 600.
diagnostics.role: role/reader rules debe ser igual a get configmaps resourceNames [route].
diagnostics.allowed: reader GET configmaps/route debe ser igual a HTTP 200.
diagnostics.value: configmaps/route data.route debe ser igual a north-114.
diagnostics.denied_configmaps: reader GET configmaps debe devolver HTTP 403.
diagnostics.denied_secrets: reader GET secrets debe devolver HTTP 403.
diagnostics.denied_configmaps_offlimits: reader GET configmaps/offlimits debe devolver HTTP 403.
stages.0.objectives.0.text: El Deployment `reader` desactiva el montaje automático y proyecta un token para la audiencia
  de la API en `/credential/token` dentro del contenedor, con duración solicitada de `600` segundos.
stages.0.objectives.1.text: El Role `reader` permite solo `get` del ConfigMap `route` de la API principal.
stages.0.objectives.2.text: Con el token montado de reader y verificación de CA, GET del ConfigMap `route` devuelve
  HTTP `200` con ruta `north-114`.
stages.0.objectives.3.text: La misma credencial de reader recibe HTTP `403` al listar ConfigMaps y Secrets y obtener
  ConfigMap `offlimits`.
