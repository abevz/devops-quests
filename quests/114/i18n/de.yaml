title: Service account Tokengrenzen
brief: 'Reader verwendet ein projiziertes, an den Pod gebundenes Token mit einer angeforderten Lebensdauer von zehn Minuten.
  Sein Empfänger (`audience`) verweist auf einen stillgelegten Dienst, daher lehnt die Kubernetes-API es ab. Setze den Empfänger
  auf `https://kubernetes.default.svc.cluster.local`, lasse das automatische Mounten deaktiviert und behalte die Role für
  den Lesezugriff auf das benannte route-Objekt. Nutze das gemountete Token für eine echte CA-verifizierte API-Anfrage; gib
  es niemals aus und speichere es nicht. Prüfe, dass `get` auf route gelingt, während `list` von ConfigMaps und Secrets verweigert
  wird.


  Bereitgestellte Dateien in `~/quest`: `reader-sa.json`, `role.json`, `binding.json`, `route.json`, `reader.json`, `api-ca.pem`,
  `api-endpoint`.


  Die Umgebung hat kein Internet oder externes DNS. Nutze nur bereitgestellte Dateien, vorgeladene Images und private Dienste.
  Ändere nur diese Umgebung.


  Erste Erfolgskriterien: Das projizierte Token hat den API-Empfänger und eine angeforderte Lebensdauer von 600 Sekunden;
  der benannte Abruf gelingt und breite Listen liefern 403.


  Die erste projizierte Tokenquelle muss genau `path: token`, `expirationSeconds: 600` und `audience: https://kubernetes.default.svc.cluster.local`
  enthalten; automatisches Mounten bleibt aus. Role `reader` muss genau eine Core-API-Regel enthalten: `get` auf `configmaps`,
  `resourceNames: [route]`. Die CA-verifizierte Reader-Anfrage an `configmaps/route` muss 200 und `.data.route: north-114`
  liefern; Anfragen für ConfigMap-Liste, Secret-Liste und die benannte ConfigMap `offlimits` müssen jeweils 403 liefern. Die
  Prüfungen decken diese Anfragen und die aktuelle Role ab, nicht alle möglichen Berechtigungen oder den Befehlsverlauf.'
debrief: Das kurzlebige projected credentials und die Least-Privilege-Autorisierung lösen verschiedene Teile des API-Zugriffs.
stages.0.brief: Projiziertes Token, genaue Reader-Role sowie erlaubte und abgelehnte CA-verifizierte Anfragen entsprechen
  der Beschreibung.
stages.0.objectives.0.text: Projiziertes Token, genaue Reader-Role sowie erlaubte und abgelehnte CA-verifizierte Anfragen
  entsprechen der Beschreibung.
hints.0.text: Die Authentifizierung prüft audience vor der RBAC-Autorisierung.
hints.1.text: Das projizierte Volume fordert ein Token für einen bestimmten Empfänger an.
hints.2.text: Reparieren Sie nur audience, warten Sie auf den Austausch und verwenden Sie das mitgelieferte CA für HTTPS.
phrases.0: Ich habe das Token audience überprüft, ohne credentials offenzulegen.
phrases.1: Für die echte API-Anfrage habe ich CA-verifiziertes HTTPS verwendet.
phrases.2: Ich habe erlaubte und verweigerte Operationen getestet.
questions.0.points.0: NEIN; Die Authentifizierung identifiziert den principal, RBAC autorisiert Aktionen.
questions.0.points.1: Audience Validierung und Berechtigungen sind separate Prüfungen.
questions.0.prompt: Gewährt ein gültiges Token jede Operation?
questions.1.points.0: Sie unterstützen Ablauf, audience- und Pod-Bindung.
questions.1.points.1: Kubelet dreht den projizierten Token; Anwendungen müssen es neu laden.
questions.1.prompt: Warum sollte man projected tokens dem älteren token Secrets vorziehen?
diagnostics.automount: reader automountServiceAccountToken muss false entsprechen.
diagnostics.projection: reader projected token muss path token, audience https://kubernetes.default.svc.cluster.local, expirationSeconds
  600 entsprechen.
diagnostics.role: role/reader rules muss get configmaps resourceNames [route] entsprechen.
diagnostics.allowed: reader GET configmaps/route muss HTTP 200 entsprechen.
diagnostics.value: configmaps/route data.route muss north-114 entsprechen.
diagnostics.denied_configmaps: reader GET configmaps muss HTTP 403 liefern.
diagnostics.denied_secrets: reader GET secrets muss HTTP 403 liefern.
diagnostics.denied_configmaps_offlimits: reader GET configmaps/offlimits muss HTTP 403 liefern.
