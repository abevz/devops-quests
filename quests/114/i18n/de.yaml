title: Service account Tokengrenzen
brief: |-
  Der Leser erhält seine API-Daten nicht. Stelle seine kurzlebige Identität und eng begrenzten Zugriff wieder her, ohne Zugangsdaten offenzulegen.

  Arbeite auf der Workstation in `~/quest`. Die Verbindungsdaten sind `api-ca.pem` und `api-endpoint`. Live-Workload und Zugriffsobjekte sind über Kubernetes verfügbar.

  **Anforderungen:**

  - In Deployment `reader` ist der eingebundene API-Zugang ein privater projizierter Token unter `/credential/token`, gültig für die API und für `600` Sekunden angefordert; automatisches Einbinden bleibt deaktiviert.
  - Die bereitgestellte Role erlaubt nur benannten Lesezugriff auf die vorhandene Routenkonfiguration.
  - Mit eingebundenem Zugang und CA-Prüfung erhält der Reader HTTP `200` und Route `north-114` aus der vorhandenen Routenkonfiguration.
  - Derselbe Reader-Zugang erhält HTTP `403` für ConfigMap-Listen, Secret-Listen und die separate geschützte Konfiguration.

  Prüfungen beobachten die deklarierte Projektion, die aktuelle Role und genau diese API-Anfragen, nicht alle möglichen Berechtigungen oder den Änderungsverlauf.
debrief: Die Empfängerprüfung bestimmt, wo sich ein Credential authentifizieren kann. Eine namespaced Bindung verbindet
  die Workload-Identität mit einer minimalen Role; erlaubte und verweigerte Anfragen zeigen übermäßigen Zugriff.
stages.0.brief: Stelle Workload-Identität und wirksamen Zugriff wieder her; halte Zugangsdaten geheim.
hints.0.text: Eine API-Anfrage durchläuft Authentifizierung und Autorisierung. Ein gültiger Empfänger erteilt keine
  Rechte; eine minimale Role erlaubt ohne Bindung an die handelnde Identität nichts.
hints.1.text: |-
  Untersuche Workload-Identität und aktuelle Zugriffsbeziehungen. Vergleiche nur Empfänger-Metadaten mit dem Workstation-Client, der sich bereits an dieser API authentifiziert; gib keines der Bearer-Token aus.

  ```sh
  kubectl get deployment reader -o yaml
  kubectl get role,rolebinding
  decode_audience='import base64,json,sys; token=sys.stdin.read().strip(); print(json.dumps(json.loads(base64.urlsafe_b64decode(token.split(".")[1]+"==="))["aud"]))'
  kubectl config view --raw --minify -o json |
    python3 -I -c 'import json,sys; print(json.load(sys.stdin)["users"][0]["user"]["token"])' |
    python3 -I -c "$decode_audience"
  kubectl exec deployment/reader -c worker -- cat /credential/token |
    python3 -I -c "$decode_audience"
  unset decode_audience
  ```
hints.2.text: |-
  Prüfe erlaubtes Lesen und jede verweigerte Anfrage mit Workload-Zugangsdaten und vorgegebener CA. Die Route muss north-114 und HTTP 200 liefern, die anderen Anfragen HTTP 403.

  `kubectl get role,rolebinding`

  ```sh
  api=$(cat api-endpoint)
  token=$(kubectl exec deployment/reader -c worker -- cat /credential/token)
  printf 'header = "Authorization: Bearer %s"\n' "$token" |
    curl --config - --cacert api-ca.pem -sS "$api/api/v1/namespaces/$DQ_NAMESPACE/configmaps/route" |
    jq -r '.data.route // empty'
  for path in configmaps/route configmaps secrets configmaps/offlimits; do
    printf '%s ' "$path"
    printf 'header = "Authorization: Bearer %s"\n' "$token" |
      curl --config - --cacert api-ca.pem -sS -o /dev/null -w 'HTTP %{http_code}\n' \
      "$api/api/v1/namespaces/$DQ_NAMESPACE/$path"
  done
  unset token
  ```
phrases.0: Ich habe das Token audience überprüft, ohne credentials offenzulegen.
phrases.1: Für die echte API-Anfrage habe ich CA-verifiziertes HTTPS verwendet.
phrases.2: Ich habe erlaubte und verweigerte Operationen getestet.
questions.0.points.0: NEIN; Die Authentifizierung identifiziert den principal, RBAC autorisiert Aktionen.
questions.0.points.1: Audience Validierung und Berechtigungen sind separate Prüfungen.
questions.0.prompt: Gewährt ein gültiges Token jede Operation?
questions.1.points.0: Sie unterstützen Ablauf, audience- und Pod-Bindung.
questions.1.points.1: Kubelet dreht den projizierten Token; Anwendungen müssen es neu laden.
questions.1.prompt: Warum sollte man projected tokens dem älteren token Secrets vorziehen?
