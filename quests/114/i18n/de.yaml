title: Service account Tokengrenzen
brief: 'Ein reader verwendet einen projected, Pod-gebundenen token mit einer angeforderten Lebensdauer
  von zehn Minuten. Sein audience verweist auf einen retired-Dienst, sodass der Kubernetes API ihn ablehnt.
  Legen Sie audience https://kubernetes.default.svc.cluster.local, fest und lassen Sie die automatische
  Bereitstellung deaktiviert und die benannte Route schreibgeschützt Role. Verwenden Sie den gemounteten
  token für eine echte CA-verifizierte API-Anfrage; Drucken oder speichern Sie niemals den token. Beweisen
  Sie, dass der Empfang von route erfolgreich ist, während list ConfigMaps und Secrets abgelehnt werden.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `reader-sa.json`, `role.json`, `binding.json`,
  `route.json`, `reader.json`, `api-ca.pem`, `api-endpoint`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: Der projected token verfügt über den API audience und eine 600-Sekunden-Anfrage;
  Der tatsächlich benannte Abruf ist erfolgreich und breite Listen geben 403 zurück.'
debrief: Das kurzlebige projected credentials und die Least-Privilege-Autorisierung lösen verschiedene
  Teile des API-Zugriffs.
stages.0.brief: 'Erfolgskriterien: Der geplante token hat den API audience und eine 600-Sekunden-Anfrage;
  Der tatsächlich benannte Abruf ist erfolgreich und breite Listen geben 403 zurück.'
stages.0.objectives.0.text: Der geplante token hat den API audience und eine 600-Sekunden-Anfrage; Der
  tatsächlich benannte Abruf ist erfolgreich und breite Listen geben 403 zurück.
hints.0.text: Die Authentifizierung prüft audience vor der RBAC-Autorisierung.
hints.1.text: Der geplante volume fordert ein Token für einen vorgesehenen Empfänger an.
hints.2.text: Reparieren Sie nur audience, warten Sie auf den Austausch und verwenden Sie das mitgelieferte
  CA für HTTPS.
phrases.0: Ich habe das Token audience überprüft, ohne credentials offenzulegen.
phrases.1: Für die echte API-Anfrage habe ich CA-verifiziertes HTTPS verwendet.
phrases.2: Ich habe erlaubte und verweigerte Operationen getestet.
questions.0.points.0: NEIN; Die Authentifizierung identifiziert den principal, RBAC autorisiert Aktionen.
questions.0.points.1: Audience Validierung und Berechtigungen sind separate Prüfungen.
questions.0.prompt: Gewährt ein gültiges Token jede Operation?
questions.1.points.0: Sie unterstützen Ablauf, audience- und Pod-Bindung.
questions.1.points.1: Kubelet dreht den projizierten Token; Anwendungen müssen es neu laden.
questions.1.prompt: Warum sollte man projected tokens dem älteren token Secrets vorziehen?
