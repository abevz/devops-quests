title: Service account Tokengrenzen
brief: |-
  Der Reader kann seine benötigten API-Daten nicht lesen. Stellen Sie eng begrenzten Zugriff her, ohne die Zugangsdaten offenzulegen.

  Arbeiten Sie auf der Workstation in `~/quest` mit den bereitgestellten Dateien:
  - `reader-sa.yaml`, `role.yaml`, `binding.yaml`, `route.yaml`, `reader.yaml`, `api-ca.pem`, `api-endpoint`.

  **Requirements:**

  - In Deployment `reader` ist der eingebundene API-Zugang ein privater projizierter Token unter `/credential/token`, gültig für die API und für `600` Sekunden angefordert; automatisches Einbinden bleibt deaktiviert.
  - Die bereitgestellte Role erlaubt nur benannten Lesezugriff auf die vorhandene Routenkonfiguration.
  - Mit eingebundenem Zugang und CA-Prüfung erhält der Reader HTTP `200` und Route `north-114` aus der vorhandenen Routenkonfiguration.
  - Derselbe Reader-Zugang erhält HTTP `403` für ConfigMap-Listen, Secret-Listen und die separate geschützte Konfiguration.

  Die Prüfungen betreffen diese Anfragen und die aktuelle Role, nicht alle möglichen Berechtigungen oder den Befehlsverlauf.
debrief: Das kurzlebige projected credentials und die Least-Privilege-Autorisierung lösen verschiedene
  Teile des API-Zugriffs.
stages.0.brief: Halten Sie den Reader-Zugang privat und prüfen Sie die API-CA.
hints.0.text: Die Authentifizierung prüft audience vor der RBAC-Autorisierung.
hints.1.text: |-
  Das projizierte Volume fordert ein Token für einen bestimmten Empfänger an.

  Prüfen Sie die bereitgestellten Eingaben und laufenden Beobachtungen:

  ```sh
  kubectl get deployment reader -o yaml
    kubectl get role reader -o yaml
  ```
hints.2.text: "Reparieren Sie nur audience, warten Sie auf den Austausch und verwenden Sie das mitgelieferte CA für HTTPS. Die bereitgestellte Audience verweist auf einen stillgelegten Dienst. Die API-Audience ist `https://kubernetes.default.svc.cluster.local`.\n\nPrüfen Sie das Ergebnis in `~/quest` auf der Workstation:\n\n- Die benannte Route liefert `north-114` und HTTP `200`; die anderen drei Anfragen liefern HTTP `403`. Token nicht ausgeben oder speichern.\n\n  ```sh\n  api=$(cat api-endpoint)\n  token=$(kubectl exec deployment/reader -c worker -- cat /credential/token)\n  for path in configmaps/route configmaps secrets configmaps/offlimits; do\n    printf 'header = \"Authorization: Bearer %s\"\\n' \"$token\" |\n      curl --config - --cacert api-ca.pem -sS -w '\\nHTTP %{http_code}\\n' \\\n      \"$api/api/v1/namespaces/$DQ_NAMESPACE/$path\"\n  done\n  unset token\n  ```"
phrases.0: Ich habe das Token audience überprüft, ohne credentials offenzulegen.
phrases.1: Für die echte API-Anfrage habe ich CA-verifiziertes HTTPS verwendet.
phrases.2: Ich habe erlaubte und verweigerte Operationen getestet.
questions.0.points.0: NEIN; Die Authentifizierung identifiziert den principal, RBAC autorisiert Aktionen.
questions.0.points.1: Audience Validierung und Berechtigungen sind separate Prüfungen.
questions.0.prompt: Gewährt ein gültiges Token jede Operation?
questions.1.points.0: Sie unterstützen Ablauf, audience- und Pod-Bindung.
questions.1.points.1: Kubelet dreht den projizierten Token; Anwendungen müssen es neu laden.
questions.1.prompt: Warum sollte man projected tokens dem älteren token Secrets vorziehen?
diagnostics.automount: Das automatische Einbinden von Anmeldedaten muss für reader-Pods deaktiviert sein.
diagnostics.projection: reader projected token muss path token, audience https://kubernetes.default.svc.cluster.local,
  expirationSeconds 600 entsprechen.
diagnostics.role: role/reader rules muss get configmaps resourceNames [route] entsprechen.
diagnostics.allowed: reader GET configmaps/route muss HTTP 200 entsprechen.
diagnostics.value: configmaps/route data.route muss north-114 entsprechen.
diagnostics.denied_configmaps: reader GET configmaps muss HTTP 403 liefern.
diagnostics.denied_secrets: reader GET secrets muss HTTP 403 liefern.
diagnostics.denied_configmaps_offlimits: reader GET configmaps/offlimits muss HTTP 403 liefern.
