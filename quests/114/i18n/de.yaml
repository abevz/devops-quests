diagnostics.automount: Der Pod oder sein ServiceAccount aktiviert möglicherweise weiterhin die automatische Credential-Einbindung. Prüfen Sie das Pod-Flag und bei fehlendem Override den zugehörigen ServiceAccount. [Ursache und Prüfung](guides#guide=workload-access&section=q114-reader-disable-default-token)
diagnostics.projection: Der Worker bindet möglicherweise eine andere Projektion oder einen Unterpfad ein oder fordert ein Token mit anderer Audience oder Laufzeit. Verfolgen Sie /credential bis zur einzigen Token-Quelle mit path token für https://kubernetes.default.svc.cluster.local und 600 Sekunden. [Ursache und Prüfung](guides#guide=workload-access&section=q114-reader-explicit-token-projection)
diagnostics.role: Die Role reader vergibt möglicherweise noch breite Rechte oder fehlt. Prüfen Sie jede Regel und lassen Sie nur get für die ConfigMap route in der Core-API-Gruppe zu. [Ursache und Prüfung](guides#guide=workload-access&section=q114-reader-exact-role)
diagnostics.allowed: Das projizierte Token fehlt möglicherweise, hat eine andere Audience oder keine Berechtigung für route. Verwenden Sie das eingebundene Token vertraulich und prüfen Sie HTTP 200 für GET configmaps/route. [Ursache und Prüfung](guides#guide=workload-access&section=q114-reader-named-api-authorization)
diagnostics.value: Eine erfolgreiche Anfrage liefert möglicherweise alte Routendaten, oder ein vorheriger Fehler hinterlässt kein gültiges JSON. Prüfen Sie data.route auf north-114 ohne Ausgabe des Tokens. [Ursache und Prüfung](guides#guide=workload-access&section=q114-reader-route-response-data)
diagnostics.denied_configmaps: Eine breite ConfigMap-Berechtigung ermöglicht möglicherweise Listenabfragen. Prüfen Sie HTTP 403 für GET configmaps mit dem projizierten Token getrennt vom Abruf von route. [Ursache und Prüfung](guides#guide=workload-access&section=q114-reader-configmap-list-denial)
diagnostics.denied_secrets: Eine Role oder Bindung kann das Auflisten von Secrets erlauben. Prüfen Sie HTTP 403 beim authentifizierten GET secrets. Authentifizierungsfehler oder Timeout belegen keine verweigerte Autorisierung. [Ursache und Prüfung](guides#guide=workload-access&section=q114-reader-secret-list-denial)
diagnostics.denied_configmaps_offlimits: Eine Berechtigung erlaubt möglicherweise andere benannte ConfigMaps. Prüfen Sie HTTP 403 für configmaps/offlimits und erhalten Sie den Lesezugriff auf route. [Ursache und Prüfung](guides#guide=workload-access&section=q114-reader-unrelated-configmap-denial)
diagnostics.probe_0_0: Die Prüfung der Token-Konfiguration kann vor der Feldmeldung abbrechen, wenn Prozess oder Eingaben fehlschlagen. Prüfen Sie Deployment reader, ServiceAccount und lokale Werkzeuge. [Ursache und Prüfung](guides#guide=workload-access&section=q114-reader-projection-observer-input)
