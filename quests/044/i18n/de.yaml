title: Vault-Richtlinie
brief: 'Arbeite in `~/quest` mit `platform.env`, `reader.hcl` und `apply-policy.sh`. Die reader-Policy des Spiel-Vaults zeigt auf einen alten KV-v2-Pfad. Das manager-Token kann `rail-reader` ändern; das reader-Token dient zum Lesen und Prüfen der Berechtigungen. Gib niemals Tokens oder Secret-Antworten aus. Die verlinkte Vault-Anleitung erklärt Policy und Lese-API.


  Gewähre in `rail-reader` nur `read` für `secret/data/dispatch`; beschränke diese Policy auf diesen Pfad und diese Berechtigung ohne weitere Freigaben, weil einige getestete Ablehnungen nicht beweisen, dass alle anderen Pfade abgelehnt werden. Gleichwertige Leerzeichen, Kommentare und ein abschließendes Komma sind zulässig. Wende die Policy an und prüfe, dass reader `north-secret` liest und `sys/capabilities-self` für `secret/data/dispatch` `[read]` sowie für `secret/data/wrong`, `secret/data/other` und `sys/mounts` `[deny]` meldet. Reader behält außerdem Vaults Standard-Policy zur Selbstinspektion. Arbeite nur in der Offline-Umgebung.'
debrief: Die wirksamen reader-Berechtigungen wurden über API überprüft, einschließlich verweigerter Pfade,
  und nicht nur anhand des Richtlinientextes.
stages.0.brief: Der Policy-Text gewährt nur das Lesen von dispatch, der reader-Wert stimmt und alle vier Berechtigungsergebnisse entsprechen der Aufgabe.
stages.0.objectives.0.text: Der Policy-Text gewährt nur das Lesen von dispatch, der reader-Wert stimmt und alle vier Berechtigungsergebnisse entsprechen der Aufgabe.
hints.0.text: KV-v2 API-Pfade umfassen data zwischen mount und Schlüssel.
hints.1.text: Verwenden Sie den Manager nur zum Aktualisieren der Richtlinie reader und testen Sie dann
  reader identity.
hints.2.text: Ein Platzhalter würde den positiven Lesevorgang bestehen lassen, aber die negativen Berechtigungsprüfungen
  nicht bestehen.
phrases.0: Ich habe den reader identity getestet, anstatt mich auf den manager-Zugriff zu verlassen.
phrases.1: Ich habe Lesezugriff auf einen KV-v2-Datenpfad ohne wildcard gewährt.
phrases.2: Ich habe die verweigerten secret- und Administrationspfade sowie die erlaubten Lesezugriffe
  überprüft.
