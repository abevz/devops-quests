title: Vault-Richtlinie
brief: 'Die bereitgestellte Vault-Identität kann die erforderliche Dispatch-Konfiguration nicht abrufen.


  Arbeiten Sie auf der Workstation in `~/quest` mit `platform.env`, `reader.hcl`, `apply-policy.sh`, `sync-secret.sh`.


  **Anforderungen:**

  - Die mitgelieferte Leser-Policy gewährt ausschließlich Lesezugriff auf die benötigte Dispatch-Konfiguration,
  ohne weitere Berechtigungen.

  - Die mitgelieferte Vault-Leseridentität kann die vorhandene Dispatch-Konfiguration lesen.

  - Der mitgelieferte Leser kann die benötigten Dispatch-Daten lesen; der Zugriff auf andere Daten und die
  Mount-Verwaltung wird verweigert.


  Einige Proben verweigerter Pfade allein beweisen nicht, dass jeder andere Pfad verweigert wird.

  '
debrief: Die wirksamen reader-Berechtigungen wurden über API überprüft, einschließlich verweigerter Pfade,
  und nicht nur anhand des Richtlinientextes.
stages.0.brief: Die bereitgestellte Vault-Identität muss den Dispatch-Zugriffsvertrag erfüllen.
hints.0.text: Eine Leseridentität sollte nur die für ihren Verbraucher benötigten Zugriffe haben.
hints.1.text: 'KV-v2 API-Pfade umfassen data zwischen mount und Schlüssel.

  Die Policy rail-reader zeigt derzeit auf einen veralteten Pfad von KV-v2.


  Prüfen Sie die mitgelieferten Eingaben und den beobachteten Zustand:


  ```sh

  cat reader.hcl apply-policy.sh sync-secret.sh

  ```'
hints.2.text: 'Verwende den Manager nur zum Aktualisieren von rail-reader. Die bereitgestellte Zugriffsidentität
  behält außerdem die Vault-Policy default zur Selbstinspektion.


  Ein Platzhalter würde den positiven Lesevorgang bestehen lassen, aber die negativen Berechtigungsprüfungen
  nicht bestehen.


  Prüfen Sie das beobachtete Ergebnis:


  - `source platform.env; curl -fsS -H @<(printf ''X-Vault-Token: %s\n'' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch"
  | jq -e ''.data.data.value=="north-secret"''` — Gibt `true` aus, ohne die geheime Antwort auszugeben.

  - `source platform.env; curl -fsS -X POST -H @<(printf ''X-Vault-Token: %s\n'' "$VAULT_READER_TOKEN") -H
  ''Content-Type: application/json'' --data ''{"paths":["secret/data/dispatch","secret/data/wrong","secret/data/other","sys/mounts"]}''
  "$VAULT_ADDR/v1/sys/capabilities-self" | jq ''.data // .''` — Dispatch hat nur `read`; die drei anderen Pfade
  haben nur `deny`.'
phrases.0: Ich habe den reader identity getestet, anstatt mich auf den manager-Zugriff zu verlassen.
phrases.1: Ich habe Lesezugriff auf einen KV-v2-Datenpfad ohne wildcard gewährt.
phrases.2: Ich habe die verweigerten secret- und Administrationspfade sowie die erlaubten Lesezugriffe überprüft.
stages.0.objectives.0.text: Die mitgelieferte Leser-Policy gewährt ausschließlich Lesezugriff auf die benötigte
  Dispatch-Konfiguration, ohne weitere Berechtigungen.
stages.0.objectives.1.text: Die mitgelieferte Vault-Leseridentität kann die vorhandene Dispatch-Konfiguration
  lesen.
stages.0.objectives.2.text: Der mitgelieferte Leser kann die benötigten Dispatch-Daten lesen; der Zugriff auf
  andere Daten und die Mount-Verwaltung wird verweigert.
diagnostics.policy_read: Der Manager konnte rail-reader nicht lesen; dem Token fehlt möglicherweise der Richtlinienzugriff, Vault ist nicht erreichbar oder die API-Antwort enthält keine lesbare Richtlinie. [Ursache und Prüfung](guides#guide=vault-recovery&section=vault-policy-observation)
diagnostics.policy_scope: Die gespeicherte Richtlinie ist unlesbar oder nicht auf read für secret/data/dispatch beschränkt; der falsche Anfangspfad, zusätzliche Rechte, Platzhalter oder eine nicht unterstützte Struktur sind möglicherweise noch vorhanden. [Ursache und Prüfung](guides#guide=vault-recovery&section=vault-policy-scope)
diagnostics.probe_0_0: Die Richtlinienprüfung endete vor den Detailbeobachtungen; platform.env, Token-/Adressvariablen, temporäre Headerdateien oder Prüfwerkzeuge sind möglicherweise nicht verfügbar. [Ursache und Prüfung](guides#guide=vault-recovery&section=vault-inputs)
diagnostics.vault_inputs: 'VAULT_READER_TOKEN: Die Lese- oder Capability-Prüfung konnte Eingaben oder Bereinigung nicht abschließen; platform.env, Vault-Variablen, temporäre Header oder die Anfragedatei sind möglicherweise nicht verfügbar. [Ursache und Prüfung](guides#guide=vault-recovery&section=vault-inputs)'
diagnostics.reader: 'VAULT_READER_TOKEN: Der Leser erhielt nicht north-secret; die Richtlinie verweist möglicherweise noch auf secret/data/wrong, das Token ist ungültig oder die KV-v2-Antwort ist nicht verfügbar beziehungsweise geändert. [Ursache und Prüfung](guides#guide=vault-recovery&section=vault-reader-value)'
diagnostics.cap_secret_data_dispatch: 'VAULT_READER_TOKEN: Die Leser-Capability für dispatch ist nicht genau read oder nicht beobachtbar; ein falscher Richtlinienpfad, zusätzliche Token-Richtlinien oder eine fehlgeschlagene Anfrage an capabilities-self können die Ursache sein. [Ursache und Prüfung](guides#guide=vault-recovery&section=vault-effective-access)'
diagnostics.cap_secret_data_wrong: 'VAULT_READER_TOKEN: Der Leser meldete nicht ausschließlich deny für secret/data/wrong oder die Antwort ist unlesbar; der anfängliche falsche Pfad, breite oder zusätzliche Token-Richtlinien oder ein API-Fehler können die Ursache sein. [Ursache und Prüfung](guides#guide=vault-recovery&section=vault-effective-access)'
diagnostics.cap_secret_data_other: 'VAULT_READER_TOKEN: Der Leser meldete nicht ausschließlich deny für secret/data/other oder die Antwort ist unlesbar; der anfängliche falsche Pfad, breite oder zusätzliche Token-Richtlinien oder ein API-Fehler können die Ursache sein. [Ursache und Prüfung](guides#guide=vault-recovery&section=vault-effective-access)'
diagnostics.cap_sys_mounts: 'VAULT_READER_TOKEN: Der Leser meldete nicht ausschließlich deny für sys/mounts oder die Antwort ist unlesbar; der anfängliche falsche Pfad, breite oder zusätzliche Token-Richtlinien oder ein API-Fehler können die Ursache sein. [Ursache und Prüfung](guides#guide=vault-recovery&section=vault-effective-access)'
