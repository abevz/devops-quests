title: Vault-Richtlinie
brief: |
  Die bereitgestellte Vault-Identität kann die erforderliche Dispatch-Konfiguration nicht abrufen.

  Arbeite auf der Workstation in `~/quest` mit `platform.env`, `reader.hcl`, `apply-policy.sh`.

  **Anforderungen:**
  - Trainings-Vault unter `VAULT_ADDR` aus der Workstation-Datei `platform.env`:
    - Policy: `rail-reader`.
    - `secret/data/dispatch`: `read`.
    - Keine weiteren Berechtigungen in dieser Policy.
  - Trainings-Vault unter `VAULT_ADDR` aus der Workstation-Datei `platform.env`:
    - Die Identität des bereitgestellten `VAULT_READER_TOKEN` liest `north-secret` unter KV-v2 `secret/data/dispatch`.
  - Capabilities der bereitgestellten Identität:
    - `secret/data/dispatch`: `read`.
    - `secret/data/wrong`, `secret/data/other`, `sys/mounts`: `deny`.

  **Selbstprüfung vor Check & finish:**
  - `source platform.env; curl -fsS -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch" | jq -e '.data.data.value=="north-secret"'` — Gibt `true` aus, ohne die geheime Antwort auszugeben.
  - `source platform.env; curl -fsS -X POST -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_READER_TOKEN") -H 'Content-Type: application/json' --data '{"paths":["secret/data/dispatch","secret/data/wrong","secret/data/other","sys/mounts"]}' "$VAULT_ADDR/v1/sys/capabilities-self" | jq '.data // .'` — Dispatch hat nur `read`; die drei anderen Pfade haben nur `deny`.

  Einige Proben verweigerter Pfade allein beweisen nicht, dass jeder andere Pfad verweigert wird.
debrief: Die wirksamen reader-Berechtigungen wurden über API überprüft, einschließlich verweigerter Pfade, und nicht
  nur anhand des Richtlinientextes.
stages.0.brief: Die bereitgestellte Vault-Identität muss den Dispatch-Zugriffsvertrag erfüllen.
hints.0.text: |-
  KV-v2 API-Pfade umfassen data zwischen mount und Schlüssel.
  Die Policy rail-reader zeigt derzeit auf einen veralteten Pfad von KV-v2.
hints.1.text: Verwende den Manager nur zum Aktualisieren von rail-reader. Die bereitgestellte Zugriffsidentität
  behält außerdem die Vault-Policy default zur Selbstinspektion.
hints.2.text: Ein Platzhalter würde den positiven Lesevorgang bestehen lassen, aber die negativen Berechtigungsprüfungen
  nicht bestehen.
phrases.0: Ich habe den reader identity getestet, anstatt mich auf den manager-Zugriff zu verlassen.
phrases.1: Ich habe Lesezugriff auf einen KV-v2-Datenpfad ohne wildcard gewährt.
phrases.2: Ich habe die verweigerten secret- und Administrationspfade sowie die erlaubten Lesezugriffe überprüft.
diagnostics.policy_read: Der Manager muss die Policy rail-reader lesen können.
diagnostics.policy_scope: Die Policy rail-reader darf nur die read-Berechtigung für secret/data/dispatch enthalten.
diagnostics.reader: Das Reader-Token muss north-secret aus secret/data/dispatch lesen.
diagnostics.cap_secret_data_dispatch: capabilities-self für secret/data/dispatch muss [read] entsprechen.
diagnostics.cap_secret_data_wrong: capabilities-self für secret/data/wrong muss [deny] entsprechen.
diagnostics.cap_secret_data_other: capabilities-self für secret/data/other muss [deny] entsprechen.
diagnostics.cap_sys_mounts: capabilities-self für sys/mounts muss [deny] entsprechen.
stages.0.objectives.0.text: Die Vault-Policy `rail-reader` gewährt nur `read` auf `secret/data/dispatch`, ohne weitere
  Berechtigungen.
stages.0.objectives.1.text: Die Identität des bereitgestellten `VAULT_READER_TOKEN` liest den Wert `north-secret`
  aus Vault `secret/data/dispatch`.
stages.0.objectives.2.text: Die bereitgestellte Vault-Identität hat `read` auf `secret/data/dispatch` und `deny`
  auf `secret/data/wrong`, `secret/data/other` und `sys/mounts`.
