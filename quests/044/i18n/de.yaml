title: Vault-Richtlinie
brief: 'Der Vault reader policy benennt einen retired KV-v2-Pfad. Lassen Sie diesen reader genau auf secret/data/dispatch
  lesen, ohne Zugriff auf andere KV-Pfade oder Mount-Verwaltung. Bearbeiten Sie reader.hcl und führen
  Sie das mitgelieferte apply-policy.sh mit dem Spiel manager token aus; Der reader token muss danach
  erfolgreich sein. Die Token-Selbstprüfung bleibt Teil der Standardeinstellung policy.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `platform.env`, `reader.hcl`, `apply-policy.sh`,
  `policy.json`, `capability-paths.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: Der reader ruft dispatch ab; capabilities erlaubt dort nur das Lesen und verweigert
  die anderen getesteten secret/admin-Pfade.'
debrief: Die wirksamen reader-Berechtigungen wurden über API überprüft, einschließlich verweigerter Pfade,
  und nicht nur anhand des Richtlinientextes.
stages.0.brief: 'Erfolgskriterium: Der reader ruft dispatch ab; capabilities erlaubt dort nur das Lesen
  und verweigert die anderen getesteten secret/admin-Pfade.'
stages.0.objectives.0.text: Der reader ruft dispatch ab; capabilities erlaubt dort nur das Lesen und verweigert
  die anderen getesteten secret/admin-Pfade.
hints.0.text: KV-v2 API-Pfade umfassen data zwischen mount und Schlüssel.
hints.1.text: Verwenden Sie den Manager nur zum Aktualisieren der Richtlinie reader und testen Sie dann
  reader identity.
hints.2.text: Ein Platzhalter würde den positiven Lesevorgang bestehen lassen, aber die negativen Berechtigungsprüfungen
  nicht bestehen.
phrases.0: Ich habe den reader identity getestet, anstatt mich auf den manager-Zugriff zu verlassen.
phrases.1: Ich habe Lesezugriff auf einen KV-v2-Datenpfad ohne wildcard gewährt.
phrases.2: Ich habe die verweigerten secret- und Administrationspfade sowie die erlaubten Lesezugriffe
  überprüft.
