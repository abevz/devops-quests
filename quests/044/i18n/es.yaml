title: Política Vault
brief: 'La identidad Vault suministrada no puede obtener la configuración dispatch requerida.


  Trabaja en la estación de trabajo en `~/quest` con `platform.env`, `reader.hcl`, `apply-policy.sh`, `sync-secret.sh`.


  **Requisitos:**

  - La política de lectura suministrada permite únicamente leer la configuración de despacho requerida, sin
  otros permisos.

  - La identidad de lectura de Vault suministrada puede leer la configuración de despacho existente.

  - La identidad de lectura puede leer los datos de despacho requeridos, pero se deniega el acceso a otros
  datos y a la administración de montajes.


  Unas pocas pruebas de rutas denegadas no demuestran por sí solas que se denieguen todas las demás rutas.

  '
debrief: Los permisos efectivos de reader se verificaron a través de API, incluidas las rutas denegadas, en
  lugar de hacerlo únicamente a partir del texto de la política.
stages.0.brief: La identidad Vault suministrada debe cumplir el contrato de acceso dispatch.
hints.0.text: Una identidad de lectura debe tener solo el acceso que necesita su consumidor.
hints.1.text: 'Las rutas KV-v2 API incluyen data entre mount y la clave.

  La política rail-reader apunta actualmente a una ruta KV-v2 retirada.


  Inspecciona las entradas suministradas y el estado observado:


  ```sh

  cat reader.hcl apply-policy.sh sync-secret.sh

  ```'
hints.2.text: 'Usa el manager solo para actualizar rail-reader. La identidad de acceso suministrada también
  conserva la política Vault default para autoinspección.


  Un comodín pasaría la lectura positiva pero no pasaría las comprobaciones de permisos negativos.


  Verifica el resultado observado:


  - `source platform.env; curl -fsS -H @<(printf ''X-Vault-Token: %s\n'' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch"
  | jq -e ''.data.data.value=="north-secret"''` — Imprime `true` sin mostrar la respuesta secreta.

  - `source platform.env; curl -fsS -X POST -H @<(printf ''X-Vault-Token: %s\n'' "$VAULT_READER_TOKEN") -H
  ''Content-Type: application/json'' --data ''{"paths":["secret/data/dispatch","secret/data/wrong","secret/data/other","sys/mounts"]}''
  "$VAULT_ADDR/v1/sys/capabilities-self" | jq ''.data // .''` — Dispatch tiene solo `read`; las otras tres
  rutas tienen solo `deny`.'
phrases.0: Probé el reader identity en lugar de depender del acceso manager.
phrases.1: Otorgué lectura en una ruta de datos KV-v2 sin un wildcard.
phrases.2: Verifiqué secret y las rutas de administración denegadas, así como la lectura permitida.
diagnostics.policy_read: El manager debe poder leer la política rail-reader.
diagnostics.policy_scope: La política rail-reader debe contener solo la capacidad read en secret/data/dispatch.
diagnostics.reader: El token lector (reader) debe leer north-secret de secret/data/dispatch.
diagnostics.cap_secret_data_dispatch: capabilities-self para secret/data/dispatch debe ser [read].
diagnostics.cap_secret_data_wrong: capabilities-self para secret/data/wrong debe ser [deny].
diagnostics.cap_secret_data_other: capabilities-self para secret/data/other debe ser [deny].
diagnostics.cap_sys_mounts: capabilities-self para sys/mounts debe ser [deny].
