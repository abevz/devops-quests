title: Política Vault
brief: 'El Vault reader policy nombra una ruta retired KV-v2. Permita que este reader se lea exactamente
  en secret/data/dispatch, sin acceso a otras rutas de KV ni a la administración de montaje. Edite reader.hcl
  y ejecute el apply-policy.sh suministrado usando el juego manager token; el reader token debe tener
  éxito después. La autoinspección de tokens sigue siendo parte de su policy predeterminado.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `platform.env`, `reader.hcl`,
  `apply-policy.sh`, `policy.json`, `capability-paths.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: El reader recupera dispatch; capabilities solo permite leer allí y niega
  las otras rutas secret/admin probadas.'
debrief: Los permisos efectivos de reader se verificaron a través de API, incluidas las rutas denegadas,
  en lugar de hacerlo únicamente a partir del texto de la política.
stages.0.brief: 'Criterios de éxito: el reader recupera dispatch; capabilities solo permite leer allí
  y niega las otras rutas secret/admin probadas.'
stages.0.objectives.0.text: El reader recupera dispatch; capabilities solo permite leer allí y niega las
  otras rutas secret/admin probadas.
hints.0.text: Las rutas KV-v2 API incluyen data entre mount y la clave.
hints.1.text: Utilice el administrador solo para actualizar la política reader, luego pruebe reader identity.
hints.2.text: Un comodín pasaría la lectura positiva pero no pasaría las comprobaciones de permisos negativos.
phrases.0: Probé el reader identity en lugar de depender del acceso manager.
phrases.1: Otorgué lectura en una ruta de datos KV-v2 sin un wildcard.
phrases.2: Verifiqué secret y las rutas de administración denegadas, así como la lectura permitida.
