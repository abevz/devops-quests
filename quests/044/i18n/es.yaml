title: Política Vault
brief: 'Trabaja en `~/quest` con `platform.env`, `reader.hcl` y `apply-policy.sh`. La política reader del Vault del juego
  apunta a una ruta KV-v2 antigua. El token manager puede actualizar `rail-reader`; el token reader se usa para leer y comprobar
  capacidades. Nunca imprimas tokens ni respuestas secretas. La guía enlazada de Vault explica la política y la API de lectura.


  Concede solo `read` en `secret/data/dispatch` en `rail-reader`; mantén en esa política solo esa ruta y capacidad, sin otros
  permisos, porque probar unas pocas denegaciones no demuestra que todas las rutas estén denegadas. Se aceptan espacios, comentarios
  y una coma final equivalentes. Aplica la política y comprueba que reader obtiene `north-secret` y que `sys/capabilities-self`
  informa `[read]` para `secret/data/dispatch` y `[deny]` para `secret/data/wrong`, `secret/data/other` y `sys/mounts`. Reader
  también conserva la política predeterminada de autoinspección de Vault. Trabaja solo en la bahía sin conexión.'
debrief: Los permisos efectivos de reader se verificaron a través de API, incluidas las rutas denegadas, en lugar de hacerlo
  únicamente a partir del texto de la política.
stages.0.brief: El texto de la política solo concede la lectura de dispatch, el valor de reader coincide y los cuatro resultados
  de capacidad coinciden con el enunciado.
stages.0.objectives.0.text: El texto de la política solo concede la lectura de dispatch, el valor de reader coincide y los
  cuatro resultados de capacidad coinciden con el enunciado.
hints.0.text: Las rutas KV-v2 API incluyen data entre mount y la clave.
hints.1.text: Utilice el administrador solo para actualizar la política reader, luego pruebe reader identity.
hints.2.text: Un comodín pasaría la lectura positiva pero no pasaría las comprobaciones de permisos negativos.
phrases.0: Probé el reader identity en lugar de depender del acceso manager.
phrases.1: Otorgué lectura en una ruta de datos KV-v2 sin un wildcard.
phrases.2: Verifiqué secret y las rutas de administración denegadas, así como la lectura permitida.
diagnostics.policy_read: El manager debe poder leer la política rail-reader.
diagnostics.policy_scope: La política rail-reader debe contener solo la capacidad read en secret/data/dispatch.
diagnostics.reader: El token lector (reader) debe leer north-secret de secret/data/dispatch.
diagnostics.cap_secret_data_dispatch: capabilities-self para secret/data/dispatch debe ser [read].
diagnostics.cap_secret_data_wrong: capabilities-self para secret/data/wrong debe ser [deny].
diagnostics.cap_secret_data_other: capabilities-self para secret/data/other debe ser [deny].
diagnostics.cap_sys_mounts: capabilities-self para sys/mounts debe ser [deny].
