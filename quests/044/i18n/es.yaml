title: Política Vault
brief: 'La identidad Vault suministrada no puede obtener la configuración dispatch requerida.


  Trabaja en la estación de trabajo en `~/quest` con `platform.env`, `reader.hcl`, `apply-policy.sh`, `sync-secret.sh`.


  **Requisitos:**

  - La política de lectura suministrada permite únicamente leer la configuración de despacho requerida, sin
  otros permisos.

  - La identidad de lectura de Vault suministrada puede leer la configuración de despacho existente.

  - La identidad de lectura puede leer los datos de despacho requeridos, pero se deniega el acceso a otros
  datos y a la administración de montajes.


  Unas pocas pruebas de rutas denegadas no demuestran por sí solas que se denieguen todas las demás rutas.

  '
debrief: Los permisos efectivos de reader se verificaron a través de API, incluidas las rutas denegadas, en
  lugar de hacerlo únicamente a partir del texto de la política.
stages.0.brief: La identidad Vault suministrada debe cumplir el contrato de acceso dispatch.
hints.0.text: |-
  Una identidad de lectura debe tener solo el acceso que necesita su consumidor.

  ```hcl
  path "secret/data/example" {
    capabilities = ["read"]
  }
  ```
hints.1.text: |-
  Las rutas KV-v2 API incluyen data entre mount y la clave.
  La política rail-reader apunta actualmente a una ruta KV-v2 retirada.

  Inspecciona las entradas suministradas y el estado observado:

  Usa el manager solo para actualizar rail-reader. La identidad de acceso suministrada también conserva la política Vault default para autoinspección.

  ```sh
  cat reader.hcl apply-policy.sh sync-secret.sh
  ```
hints.2.text: |-
  Un comodín pasaría la lectura positiva pero no pasaría las comprobaciones de permisos negativos.

  Verifica el resultado observado:

  - `source platform.env; curl -fsS -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch" | jq -e '.data.data.value=="north-secret"'` — Imprime `true` sin mostrar la respuesta secreta.
  - `source platform.env; curl -fsS -X POST -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_READER_TOKEN") -H 'Content-Type: application/json' --data '{"paths":["secret/data/dispatch","secret/data/wrong","secret/data/other","sys/mounts"]}' "$VAULT_ADDR/v1/sys/capabilities-self" | jq '.data // .'` — Dispatch tiene solo `read`; las otras tres rutas tienen solo `deny`.
phrases.0: Probé el reader identity en lugar de depender del acceso manager.
phrases.1: Otorgué lectura en una ruta de datos KV-v2 sin un wildcard.
phrases.2: Verifiqué secret y las rutas de administración denegadas, así como la lectura permitida.
stages.0.objectives.0.text: La política de lectura suministrada permite únicamente leer la configuración de
  despacho requerida, sin otros permisos.
stages.0.objectives.1.text: La identidad de lectura de Vault suministrada puede leer la configuración de despacho
  existente.
stages.0.objectives.2.text: La identidad de lectura puede leer los datos de despacho requeridos, pero se deniega
  el acceso a otros datos y a la administración de montajes.
diagnostics.policy_read: El gestor no pudo leer rail-reader; su token puede carecer de acceso a la política, Vault puede no estar disponible o la respuesta API no contiene una política legible. [Causa y comprobación](guides#guide=vault-recovery&section=vault-policy-observation)
diagnostics.policy_scope: La política guardada es ilegible o no se limita a read en secret/data/dispatch; pueden persistir la ruta inicial incorrecta, permisos adicionales, comodines o una estructura no admitida. [Causa y comprobación](guides#guide=vault-recovery&section=vault-policy-scope)
diagnostics.probe_0_0: La prueba de política se detuvo antes del diagnóstico detallado; platform.env, variables de token y dirección, archivos temporales de cabeceras o herramientas pueden no estar disponibles. [Causa y comprobación](guides#guide=vault-recovery&section=vault-inputs)
diagnostics.vault_inputs: 'VAULT_READER_TOKEN: La prueba de lectura o capabilities no pudo preparar entradas o limpiarlas; platform.env, variables Vault, cabeceras temporales o el archivo de solicitud pueden no estar disponibles. [Causa y comprobación](guides#guide=vault-recovery&section=vault-inputs)'
diagnostics.reader: 'VAULT_READER_TOKEN: El lector no obtuvo north-secret; la política puede seguir apuntando a secret/data/wrong, el token puede ser inválido o la respuesta KV-v2 falta o cambió. [Causa y comprobación](guides#guide=vault-recovery&section=vault-reader-value)'
diagnostics.cap_secret_data_dispatch: 'VAULT_READER_TOKEN: La capacidad del lector en dispatch no es exactamente read o no se pudo observar; puede deberse a la ruta incorrecta, políticas extra del token o un fallo de capabilities-self. [Causa y comprobación](guides#guide=vault-recovery&section=vault-effective-access)'
diagnostics.cap_secret_data_wrong: 'VAULT_READER_TOKEN: El lector no informó solo deny en secret/data/wrong o la respuesta es ilegible; puede deberse al permiso inicial de la ruta equivocada, políticas amplias o extra del token o un fallo API. [Causa y comprobación](guides#guide=vault-recovery&section=vault-effective-access)'
diagnostics.cap_secret_data_other: 'VAULT_READER_TOKEN: El lector no informó solo deny en secret/data/other o la respuesta es ilegible; puede deberse al permiso inicial de la ruta equivocada, políticas amplias o extra del token o un fallo API. [Causa y comprobación](guides#guide=vault-recovery&section=vault-effective-access)'
diagnostics.cap_sys_mounts: 'VAULT_READER_TOKEN: El lector no informó solo deny en sys/mounts o la respuesta es ilegible; puede deberse al permiso inicial de la ruta equivocada, políticas amplias o extra del token o un fallo API. [Causa y comprobación](guides#guide=vault-recovery&section=vault-effective-access)'
