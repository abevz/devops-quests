hints.0.text: KV-v2 API paths include data between the mount and key.
hints.1.text: Use the manager only to update the reader policy, then test the reader identity.
hints.2.text: A wildcard would pass the positive read but fail the negative permission checks.
phrases.0: I tested the reader identity rather than relying on manager access.
phrases.1: I granted read on one KV-v2 data path without a wildcard.
phrases.2: I checked denied secret and administration paths as well as the allowed read.
