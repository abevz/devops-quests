title: Vault policy
brief: 'The Vault reader policy names a retired KV-v2 path. Allow this reader exactly read on secret/data/dispatch,
  with no access to other KV paths or mount administration. Edit reader.hcl and run the supplied apply-policy.sh
  using the game manager token; the reader token must succeed afterward. Token self-inspection remains
  part of its default policy.


  Quest files in `~/quest` (some appear in later stages): `platform.env`, `reader.hcl`, `apply-policy.sh`,
  `policy.json`, `capability-paths.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: The reader fetches dispatch; capabilities allow only read there and deny the
  other tested secret/admin paths.'
debrief: The effective reader permissions were checked through the API, including denied paths, rather
  than from policy text alone.
