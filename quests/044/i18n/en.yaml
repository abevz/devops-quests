title: Vault policy
brief: 'The supplied Vault identity cannot obtain the required dispatch configuration.


  Work on the workstation in `~/quest` with `platform.env`, `reader.hcl`, `apply-policy.sh`, `sync-secret.sh`.


  **Requirements:**

  - The supplied access policy grants only read access to the required dispatch configuration, with no other
  grants.

  - The supplied Vault access identity can read the existing dispatch configuration.

  - The supplied identity can read the required dispatch data, but access to other data and mount administration
  is denied.


  A few denied-path probes alone do not prove that every other path is denied.

  '
debrief: The effective reader permissions were checked through the API, including denied paths, rather than
  from policy text alone.
stages.0.brief: The supplied Vault identity must meet the dispatch access contract.
hints.0.text: |-
  An access identity should have only the access needed by its consumer.

  ```hcl
  path "secret/data/example" {
    capabilities = ["read"]
  }
  ```
hints.1.text: |-
  KV-v2 API paths include data between the mount and key.
  The rail-reader policy currently points to a retired KV-v2 path.

  Inspect the supplied inputs and observed state:

  Use the manager only to update rail-reader. The supplied access identity also retains the default Vault policy for self-inspection.

  ```sh
  cat reader.hcl apply-policy.sh sync-secret.sh
  ```
hints.2.text: |-
  A wildcard would pass the positive read but fail the negative permission checks.

  Verify the observed result:

  - `source platform.env; curl -fsS -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch" | jq -e '.data.data.value=="north-secret"'` — Prints `true` without printing the secret response.
  - `source platform.env; curl -fsS -X POST -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_READER_TOKEN") -H 'Content-Type: application/json' --data '{"paths":["secret/data/dispatch","secret/data/wrong","secret/data/other","sys/mounts"]}' "$VAULT_ADDR/v1/sys/capabilities-self" | jq '.data // .'` — Dispatch has only `read`; the three other paths have only `deny`.
phrases.0: I tested the reader identity rather than relying on manager access.
phrases.1: I granted read on one KV-v2 data path without a wildcard.
phrases.2: I checked denied secret and administration paths as well as the allowed read.
stages.0.objectives.0.text: The supplied access policy grants only read access to the required dispatch configuration,
  with no other grants.
stages.0.objectives.1.text: The supplied Vault access identity can read the existing dispatch configuration.
stages.0.objectives.2.text: The supplied identity can read the required dispatch data, but access to other
  data and mount administration is denied.
diagnostics.policy_read: The manager could not read rail-reader; its token may lack policy access, Vault may be unreachable, or the API response may not contain a readable policy. [Cause and check](guides#guide=vault-recovery&section=vault-policy-observation)
diagnostics.policy_scope: The stored policy is unreadable or not limited to read on secret/data/dispatch; the initial wrong path, extra grants, wildcards or unsupported policy structure may remain. [Cause and check](guides#guide=vault-recovery&section=vault-policy-scope)
diagnostics.probe_0_0: The policy probe stopped before detailed observations; platform.env, required token/address variables, temporary header files or probe tools may be unavailable. [Cause and check](guides#guide=vault-recovery&section=vault-inputs)
diagnostics.vault_inputs: 'VAULT_READER_TOKEN: The read or capability probe could not prepare its inputs or cleanup; platform.env, required Vault variables, temporary headers or the capability request file may be unavailable. [Cause and check](guides#guide=vault-recovery&section=vault-inputs)'
diagnostics.reader: 'VAULT_READER_TOKEN: The supplied identity did not obtain north-secret; its policy may still target secret/data/wrong, its token may be invalid, or the KV-v2 response may be unavailable or changed. [Cause and check](guides#guide=vault-recovery&section=vault-reader-value)'
diagnostics.cap_secret_data_dispatch: 'VAULT_READER_TOKEN: The supplied identity capability on dispatch is not exactly read or could not be observed; the wrong policy path, extra token policies or a failed capabilities-self request may explain it. [Cause and check](guides#guide=vault-recovery&section=vault-effective-access)'
diagnostics.cap_secret_data_wrong: 'VAULT_READER_TOKEN: The supplied identity did not report only deny on secret/data/wrong, or the capability response is unreadable; the initial wrong-path grant, broad or extra token policies, or a failed API request may explain it. [Cause and check](guides#guide=vault-recovery&section=vault-effective-access)'
diagnostics.cap_secret_data_other: 'VAULT_READER_TOKEN: The supplied identity did not report only deny on secret/data/other, or the capability response is unreadable; the initial wrong-path grant, broad or extra token policies, or a failed API request may explain it. [Cause and check](guides#guide=vault-recovery&section=vault-effective-access)'
diagnostics.cap_sys_mounts: 'VAULT_READER_TOKEN: The supplied identity did not report only deny on sys/mounts, or the capability response is unreadable; the initial wrong-path grant, broad or extra token policies, or a failed API request may explain it. [Cause and check](guides#guide=vault-recovery&section=vault-effective-access)'
