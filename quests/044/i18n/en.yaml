title: Vault policy
brief: 'Work in `~/quest` with `platform.env`, `reader.hcl` and `apply-policy.sh`. The game Vault reader policy points to
  a retired KV-v2 path. The manager token can update `rail-reader`; the reader token is used for the read and capability checks.
  Never print tokens or secret responses. The linked Vault guide explains the policy and read API.


  Grant only `read` on `secret/data/dispatch` in `rail-reader`; keep its policy to that path and capability, with no other
  grants, because testing a few denied paths cannot prove all paths are denied. Equivalent whitespace, comments and a trailing
  comma are accepted. Apply the policy, then verify the reader retrieves `north-secret` and `sys/capabilities-self` reports
  `[read]` for `secret/data/dispatch` and `[deny]` for `secret/data/wrong`, `secret/data/other` and `sys/mounts`. The reader
  also retains Vault''s default self-inspection policy. Work only in the offline bay.'
debrief: The effective reader permissions were checked through the API, including denied paths, rather than from policy text
  alone.
stages.0.brief: The policy text has only the dispatch read grant, the reader value matches, and all four capability results
  match the brief.
stages.0.objectives.0.text: The policy text has only the dispatch read grant, the reader value matches, and all four capability
  results match the brief.
hints.0.text: KV-v2 API paths include data between the mount and key.
hints.1.text: Use the manager only to update the reader policy, then test the reader identity.
hints.2.text: A wildcard would pass the positive read but fail the negative permission checks.
phrases.0: I tested the reader identity rather than relying on manager access.
phrases.1: I granted read on one KV-v2 data path without a wildcard.
phrases.2: I checked denied secret and administration paths as well as the allowed read.
diagnostics.policy_read: The manager must be able to read the rail-reader policy.
diagnostics.policy_scope: The rail-reader policy must contain only read capability on secret/data/dispatch.
diagnostics.reader: The reader token must read north-secret from secret/data/dispatch.
diagnostics.cap_secret_data_dispatch: capabilities-self for secret/data/dispatch must equal [read].
diagnostics.cap_secret_data_wrong: capabilities-self for secret/data/wrong must equal [deny].
diagnostics.cap_secret_data_other: capabilities-self for secret/data/other must equal [deny].
diagnostics.cap_sys_mounts: capabilities-self for sys/mounts must equal [deny].
