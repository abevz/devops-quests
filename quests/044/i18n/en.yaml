title: Vault policy
brief: 'The supplied Vault identity cannot obtain the required dispatch configuration.


  Work on the workstation in `~/quest` with `platform.env`, `reader.hcl`, `apply-policy.sh`, `sync-secret.sh`.


  **Requirements:**

  - The supplied access policy grants only read access to the required dispatch configuration, with no other
  grants.

  - The supplied Vault access identity can read the existing dispatch configuration.

  - The supplied identity can read the required dispatch data, but access to other data and mount administration
  is denied.


  A few denied-path probes alone do not prove that every other path is denied.

  '
debrief: The effective reader permissions were checked through the API, including denied paths, rather than
  from policy text alone.
stages.0.brief: The supplied Vault identity must meet the dispatch access contract.
hints.0.text: An access identity should have only the access needed by its consumer.
hints.1.text: 'KV-v2 API paths include data between the mount and key.

  The rail-reader policy currently points to a retired KV-v2 path.


  Inspect the supplied inputs and observed state:


  ```sh

  cat reader.hcl apply-policy.sh sync-secret.sh

  ```'
hints.2.text: 'Use the manager only to update rail-reader. The supplied access identity also retains the default
  Vault policy for self-inspection.


  A wildcard would pass the positive read but fail the negative permission checks.


  Verify the observed result:


  - `source platform.env; curl -fsS -H @<(printf ''X-Vault-Token: %s\n'' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch"
  | jq -e ''.data.data.value=="north-secret"''` — Prints `true` without printing the secret response.

  - `source platform.env; curl -fsS -X POST -H @<(printf ''X-Vault-Token: %s\n'' "$VAULT_READER_TOKEN") -H
  ''Content-Type: application/json'' --data ''{"paths":["secret/data/dispatch","secret/data/wrong","secret/data/other","sys/mounts"]}''
  "$VAULT_ADDR/v1/sys/capabilities-self" | jq ''.data // .''` — Dispatch has only `read`; the three other paths
  have only `deny`.'
phrases.0: I tested the reader identity rather than relying on manager access.
phrases.1: I granted read on one KV-v2 data path without a wildcard.
phrases.2: I checked denied secret and administration paths as well as the allowed read.
diagnostics.policy_read: The manager must be able to read the rail-reader policy.
diagnostics.policy_scope: The rail-reader policy must contain only read capability on secret/data/dispatch.
diagnostics.reader: The reader token must read north-secret from secret/data/dispatch.
diagnostics.cap_secret_data_dispatch: capabilities-self for secret/data/dispatch must equal [read].
diagnostics.cap_secret_data_wrong: capabilities-self for secret/data/wrong must equal [deny].
diagnostics.cap_secret_data_other: capabilities-self for secret/data/other must equal [deny].
diagnostics.cap_sys_mounts: capabilities-self for sys/mounts must equal [deny].
stages.0.objectives.0.text: The supplied access policy grants only read access to the required dispatch configuration,
  with no other grants.
stages.0.objectives.1.text: The supplied Vault access identity can read the existing dispatch configuration.
stages.0.objectives.2.text: The supplied identity can read the required dispatch data, but access to other
  data and mount administration is denied.
