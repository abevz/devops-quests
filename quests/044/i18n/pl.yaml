title: Polityka Vault
brief: 'Dostarczona tożsamość Vault nie może pobrać wymaganej konfiguracji dispatch.


  Pracuj na stacji roboczej w `~/quest` z `platform.env`, `reader.hcl`, `apply-policy.sh`, `sync-secret.sh`.


  **Wymagania:**

  - Dostarczona polityka czytelnika zezwala wyłącznie na odczyt wymaganej konfiguracji dyspozytorskiej, bez
  innych uprawnień.

  - Dostarczona tożsamość czytelnika Vault może odczytać istniejącą konfigurację dyspozytorską.

  - Dostarczony czytelnik może odczytywać wymagane dane dyspozytorskie, ale dostęp do innych danych i zarządzania
  montowaniami jest zabroniony.


  Kilka prób odmowy dostępu do ścieżek samo w sobie nie dowodzi odmowy dla wszystkich pozostałych ścieżek.

  '
debrief: Efektywne uprawnienia reader zostały sprawdzone w API, łącznie z zabronionymi ścieżkami, a nie na
  podstawie samego tekstu zasad.
stages.0.brief: Dostarczona tożsamość Vault musi spełniać kontrakt dostępu dispatch.
hints.0.text: |-
  Tożsamość czytelnika powinna mieć tylko dostęp potrzebny jej odbiorcy.

  ```hcl
  path "secret/data/example" {
    capabilities = ["read"]
  }
  ```
hints.1.text: |-
  Ścieżki KV-v2 API obejmują data pomiędzy mount i kluczem.
  Polityka rail-reader wskazuje obecnie przestarzałą ścieżkę KV-v2.

  Sprawdź dostarczone dane wejściowe i obserwowany stan:

  Używaj manager tylko do aktualizacji rail-reader. Dostarczona tożsamość dostępu zachowuje też politykę Vault default do samoinspekcji.

  ```sh
  cat reader.hcl apply-policy.sh sync-secret.sh
  ```
hints.2.text: |-
  Symbol wieloznaczny przeszedłby pozytywny odczyt, ale nie przeszedłby kontroli negatywnych uprawnień.

  Sprawdź obserwowany wynik:

  - `source platform.env; curl -fsS -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch" | jq -e '.data.data.value=="north-secret"'` — Wypisuje `true` bez wyświetlania odpowiedzi z sekretem.
  - `source platform.env; curl -fsS -X POST -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_READER_TOKEN") -H 'Content-Type: application/json' --data '{"paths":["secret/data/dispatch","secret/data/wrong","secret/data/other","sys/mounts"]}' "$VAULT_ADDR/v1/sys/capabilities-self" | jq '.data // .'` — Dispatch ma tylko `read`; trzy pozostałe ścieżki mają tylko `deny`.
phrases.0: Przetestowałem tożsamość reader, zamiast polegać na dostępie manager.
phrases.1: Przyznałem read na jednej ścieżce danych KV-v2 bez wildcard.
phrases.2: Sprawdziłem odrzucone secret i ścieżki administracyjne, a także dozwolony odczyt.
stages.0.objectives.0.text: Dostarczona polityka czytelnika zezwala wyłącznie na odczyt wymaganej konfiguracji
  dyspozytorskiej, bez innych uprawnień.
stages.0.objectives.1.text: Dostarczona tożsamość czytelnika Vault może odczytać istniejącą konfigurację dyspozytorską.
stages.0.objectives.2.text: Dostarczony czytelnik może odczytywać wymagane dane dyspozytorskie, ale dostęp
  do innych danych i zarządzania montowaniami jest zabroniony.
diagnostics.policy_read: Menedżer nie odczytał rail-reader; token może nie mieć dostępu do polityki, Vault może być niedostępny lub odpowiedź API nie zawiera czytelnej polityki. [Przyczyna i kontrola](guides#guide=vault-recovery&section=vault-policy-observation)
diagnostics.policy_scope: Zapisana polityka jest nieczytelna lub nie ogranicza się do read na secret/data/dispatch; mógł pozostać początkowy błędny adres, dodatkowe uprawnienia, wildcardy lub nieobsługiwana struktura. [Przyczyna i kontrola](guides#guide=vault-recovery&section=vault-policy-scope)
diagnostics.probe_0_0: Kontrola polityki zatrzymała się przed szczegółowymi obserwacjami; platform.env, zmienne tokenów i adresu, tymczasowe pliki nagłówków lub narzędzia mogą być niedostępne. [Przyczyna i kontrola](guides#guide=vault-recovery&section=vault-inputs)
diagnostics.vault_inputs: 'VAULT_READER_TOKEN: Kontrola odczytu lub capabilities nie przygotowała danych albo nie posprzątała plików; platform.env, zmienne Vault, tymczasowe nagłówki lub plik żądania mogą być niedostępne. [Przyczyna i kontrola](guides#guide=vault-recovery&section=vault-inputs)'
diagnostics.reader: 'VAULT_READER_TOKEN: Czytelnik nie otrzymał north-secret; polityka może nadal wskazywać secret/data/wrong, token może być nieprawidłowy albo odpowiedź KV-v2 niedostępna lub zmieniona. [Przyczyna i kontrola](guides#guide=vault-recovery&section=vault-reader-value)'
diagnostics.cap_secret_data_dispatch: 'VAULT_READER_TOKEN: Capability czytelnika dla dispatch nie jest dokładnie read lub nie da się jej odczytać; przyczyną może być błędny adres polityki, dodatkowe polityki tokena lub błąd capabilities-self. [Przyczyna i kontrola](guides#guide=vault-recovery&section=vault-effective-access)'
diagnostics.cap_secret_data_wrong: 'VAULT_READER_TOKEN: Czytelnik nie zgłosił wyłącznie deny dla secret/data/wrong lub odpowiedź jest nieczytelna; przyczyną może być początkowe uprawnienie złej ścieżki, szerokie lub dodatkowe polityki tokena albo błąd API. [Przyczyna i kontrola](guides#guide=vault-recovery&section=vault-effective-access)'
diagnostics.cap_secret_data_other: 'VAULT_READER_TOKEN: Czytelnik nie zgłosił wyłącznie deny dla secret/data/other lub odpowiedź jest nieczytelna; przyczyną może być początkowe uprawnienie złej ścieżki, szerokie lub dodatkowe polityki tokena albo błąd API. [Przyczyna i kontrola](guides#guide=vault-recovery&section=vault-effective-access)'
diagnostics.cap_sys_mounts: 'VAULT_READER_TOKEN: Czytelnik nie zgłosił wyłącznie deny dla sys/mounts lub odpowiedź jest nieczytelna; przyczyną może być początkowe uprawnienie złej ścieżki, szerokie lub dodatkowe polityki tokena albo błąd API. [Przyczyna i kontrola](guides#guide=vault-recovery&section=vault-effective-access)'
