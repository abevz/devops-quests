title: Polityka Vault
brief: |
  Dostarczona tożsamość Vault nie może pobrać wymaganej konfiguracji dispatch.

  Pracuj na workstation w `~/quest` z plikami `platform.env`, `reader.hcl`, `apply-policy.sh`.

  **Wymagania:**
  - Ćwiczebny Vault pod `VAULT_ADDR` z `platform.env` na workstation:
    - Polityka: `rail-reader`.
    - `secret/data/dispatch`: `read`.
    - Brak innych uprawnień w tej polityce.
  - Ćwiczebny Vault pod `VAULT_ADDR` z `platform.env` na workstation:
    - Tożsamość dostarczonego `VAULT_READER_TOKEN` odczytuje `north-secret` pod KV-v2 `secret/data/dispatch`.
  - Capabilities dostarczonej tożsamości:
    - `secret/data/dispatch`: `read`.
    - `secret/data/wrong`, `secret/data/other`, `sys/mounts`: `deny`.

  **Sprawdź przed Check & finish:**
  - `source platform.env; curl -fsS -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch" | jq -e '.data.data.value=="north-secret"'` — Wypisuje `true` bez wyświetlania odpowiedzi z sekretem.
  - `source platform.env; curl -fsS -X POST -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_READER_TOKEN") -H 'Content-Type: application/json' --data '{"paths":["secret/data/dispatch","secret/data/wrong","secret/data/other","sys/mounts"]}' "$VAULT_ADDR/v1/sys/capabilities-self" | jq '.data // .'` — Dispatch ma tylko `read`; trzy pozostałe ścieżki mają tylko `deny`.

  Kilka prób odmowy dostępu do ścieżek samo w sobie nie dowodzi odmowy dla wszystkich pozostałych ścieżek.
debrief: Efektywne uprawnienia reader zostały sprawdzone w API, łącznie z zabronionymi ścieżkami, a nie na podstawie
  samego tekstu zasad.
stages.0.brief: Dostarczona tożsamość Vault musi spełniać kontrakt dostępu dispatch.
hints.0.text: |-
  Ścieżki KV-v2 API obejmują data pomiędzy mount i kluczem.
  Polityka rail-reader wskazuje obecnie przestarzałą ścieżkę KV-v2.
hints.1.text: Używaj manager tylko do aktualizacji rail-reader. Dostarczona tożsamość dostępu zachowuje też politykę
  Vault default do samoinspekcji.
hints.2.text: Symbol wieloznaczny przeszedłby pozytywny odczyt, ale nie przeszedłby kontroli negatywnych uprawnień.
phrases.0: Przetestowałem tożsamość reader, zamiast polegać na dostępie manager.
phrases.1: Przyznałem read na jednej ścieżce danych KV-v2 bez wildcard.
phrases.2: Sprawdziłem odrzucone secret i ścieżki administracyjne, a także dozwolony odczyt.
diagnostics.policy_read: Manager musi móc odczytać politykę rail-reader.
diagnostics.policy_scope: Polityka rail-reader musi zawierać tylko uprawnienie read do secret/data/dispatch.
diagnostics.reader: Token czytelnika (reader) musi odczytać north-secret z secret/data/dispatch.
diagnostics.cap_secret_data_dispatch: capabilities-self dla secret/data/dispatch musi wynosić [read].
diagnostics.cap_secret_data_wrong: capabilities-self dla secret/data/wrong musi wynosić [deny].
diagnostics.cap_secret_data_other: capabilities-self dla secret/data/other musi wynosić [deny].
diagnostics.cap_sys_mounts: capabilities-self dla sys/mounts musi wynosić [deny].
stages.0.objectives.0.text: Polityka Vault `rail-reader` przyznaje tylko `read` do `secret/data/dispatch`, bez innych
  uprawnień.
stages.0.objectives.1.text: Tożsamość dostarczonego `VAULT_READER_TOKEN` odczytuje wartość `north-secret` z Vault
  `secret/data/dispatch`.
stages.0.objectives.2.text: Dostarczona tożsamość Vault ma `read` do `secret/data/dispatch` oraz `deny` do `secret/data/wrong`,
  `secret/data/other` i `sys/mounts`.
