title: Polityka Vault
brief: 'Pracuj w `~/quest` z `platform.env`, `reader.hcl` i `apply-policy.sh`. Polityka reader w Vault gry wskazuje starą
  ścieżkę KV-v2. Token manager może zmienić `rail-reader`; token reader służy do odczytu i sprawdzenia uprawnień. Nigdy nie
  wypisuj tokenów ani odpowiedzi z sekretem. Połączony przewodnik Vault wyjaśnia politykę i API odczytu.


  Nadaj w `rail-reader` tylko `read` dla `secret/data/dispatch`; pozostaw w tej polityce tylko tę ścieżkę i uprawnienie, bez
  innych grantów, ponieważ sprawdzenie kilku odmów nie dowodzi odmowy dla wszystkich ścieżek. Akceptowane są równoważne odstępy,
  komentarze i końcowy przecinek. Zastosuj politykę i sprawdź, czy reader odczytuje `north-secret`, a `sys/capabilities-self`
  podaje `[read]` dla `secret/data/dispatch` oraz `[deny]` dla `secret/data/wrong`, `secret/data/other` i `sys/mounts`. Reader
  zachowuje także domyślną politykę samoinspekcji Vault. Pracuj tylko w zatoce offline.'
debrief: Efektywne uprawnienia reader zostały sprawdzone w API, łącznie z zabronionymi ścieżkami, a nie na podstawie samego
  tekstu zasad.
stages.0.brief: Tekst polityki zawiera tylko odczyt dispatch, wartość reader jest poprawna, a cztery wyniki uprawnień odpowiadają
  opisowi.
stages.0.objectives.0.text: Tekst polityki zawiera tylko odczyt dispatch, wartość reader jest poprawna, a cztery wyniki uprawnień
  odpowiadają opisowi.
hints.0.text: Ścieżki KV-v2 API obejmują data pomiędzy mount i kluczem.
hints.1.text: Użyj menedżera tylko do aktualizacji polityki reader, a następnie przetestuj tożsamość reader.
hints.2.text: Symbol wieloznaczny przeszedłby pozytywny odczyt, ale nie przeszedłby kontroli negatywnych uprawnień.
phrases.0: Przetestowałem tożsamość reader, zamiast polegać na dostępie manager.
phrases.1: Przyznałem read na jednej ścieżce danych KV-v2 bez wildcard.
phrases.2: Sprawdziłem odrzucone secret i ścieżki administracyjne, a także dozwolony odczyt.
diagnostics.policy_read: Manager musi móc odczytać politykę rail-reader.
diagnostics.policy_scope: Polityka rail-reader musi zawierać tylko uprawnienie read do secret/data/dispatch.
diagnostics.reader: Token czytelnika (reader) musi odczytać north-secret z secret/data/dispatch.
diagnostics.cap_secret_data_dispatch: capabilities-self dla secret/data/dispatch musi wynosić [read].
diagnostics.cap_secret_data_wrong: capabilities-self dla secret/data/wrong musi wynosić [deny].
diagnostics.cap_secret_data_other: capabilities-self dla secret/data/other musi wynosić [deny].
diagnostics.cap_sys_mounts: capabilities-self dla sys/mounts musi wynosić [deny].
