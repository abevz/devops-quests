title: Polityka Vault
brief: 'Dostarczona tożsamość Vault nie może pobrać wymaganej konfiguracji dispatch.


  Pracuj na stacji roboczej w `~/quest` z `platform.env`, `reader.hcl`, `apply-policy.sh`, `sync-secret.sh`.


  **Wymagania:**

  - Dostarczona polityka czytelnika zezwala wyłącznie na odczyt wymaganej konfiguracji dyspozytorskiej, bez
  innych uprawnień.

  - Dostarczona tożsamość czytelnika Vault może odczytać istniejącą konfigurację dyspozytorską.

  - Dostarczony czytelnik może odczytywać wymagane dane dyspozytorskie, ale dostęp do innych danych i zarządzania
  montowaniami jest zabroniony.


  Kilka prób odmowy dostępu do ścieżek samo w sobie nie dowodzi odmowy dla wszystkich pozostałych ścieżek.

  '
debrief: Efektywne uprawnienia reader zostały sprawdzone w API, łącznie z zabronionymi ścieżkami, a nie na
  podstawie samego tekstu zasad.
stages.0.brief: Dostarczona tożsamość Vault musi spełniać kontrakt dostępu dispatch.
hints.0.text: Tożsamość czytelnika powinna mieć tylko dostęp potrzebny jej odbiorcy.
hints.1.text: 'Ścieżki KV-v2 API obejmują data pomiędzy mount i kluczem.

  Polityka rail-reader wskazuje obecnie przestarzałą ścieżkę KV-v2.


  Sprawdź dostarczone dane wejściowe i obserwowany stan:


  ```sh

  cat reader.hcl apply-policy.sh sync-secret.sh

  ```'
hints.2.text: 'Używaj manager tylko do aktualizacji rail-reader. Dostarczona tożsamość dostępu zachowuje też
  politykę Vault default do samoinspekcji.


  Symbol wieloznaczny przeszedłby pozytywny odczyt, ale nie przeszedłby kontroli negatywnych uprawnień.


  Sprawdź obserwowany wynik:


  - `source platform.env; curl -fsS -H @<(printf ''X-Vault-Token: %s\n'' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch"
  | jq -e ''.data.data.value=="north-secret"''` — Wypisuje `true` bez wyświetlania odpowiedzi z sekretem.

  - `source platform.env; curl -fsS -X POST -H @<(printf ''X-Vault-Token: %s\n'' "$VAULT_READER_TOKEN") -H
  ''Content-Type: application/json'' --data ''{"paths":["secret/data/dispatch","secret/data/wrong","secret/data/other","sys/mounts"]}''
  "$VAULT_ADDR/v1/sys/capabilities-self" | jq ''.data // .''` — Dispatch ma tylko `read`; trzy pozostałe ścieżki
  mają tylko `deny`.'
phrases.0: Przetestowałem tożsamość reader, zamiast polegać na dostępie manager.
phrases.1: Przyznałem read na jednej ścieżce danych KV-v2 bez wildcard.
phrases.2: Sprawdziłem odrzucone secret i ścieżki administracyjne, a także dozwolony odczyt.
diagnostics.policy_read: Manager musi móc odczytać politykę rail-reader.
diagnostics.policy_scope: Polityka rail-reader musi zawierać tylko uprawnienie read do secret/data/dispatch.
diagnostics.reader: Token czytelnika (reader) musi odczytać north-secret z secret/data/dispatch.
diagnostics.cap_secret_data_dispatch: capabilities-self dla secret/data/dispatch musi wynosić [read].
diagnostics.cap_secret_data_wrong: capabilities-self dla secret/data/wrong musi wynosić [deny].
diagnostics.cap_secret_data_other: capabilities-self dla secret/data/other musi wynosić [deny].
diagnostics.cap_sys_mounts: capabilities-self dla sys/mounts musi wynosić [deny].
stages.0.objectives.0.text: Dostarczona polityka czytelnika zezwala wyłącznie na odczyt wymaganej konfiguracji
  dyspozytorskiej, bez innych uprawnień.
stages.0.objectives.1.text: Dostarczona tożsamość czytelnika Vault może odczytać istniejącą konfigurację dyspozytorską.
stages.0.objectives.2.text: Dostarczony czytelnik może odczytywać wymagane dane dyspozytorskie, ale dostęp
  do innych danych i zarządzania montowaniami jest zabroniony.
diagnostics.probe_0_0: 'Bieżące dane nie pozwalają potwierdzić tego celu: Dostarczona polityka czytelnika zezwala
  wyłącznie na odczyt wymaganej konfiguracji dyspozytorskiej, bez innych uprawnień.'
