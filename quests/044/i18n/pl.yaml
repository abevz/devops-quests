title: Polityka Vault
brief: 'Polityka Vault reader nazywa wycofaną ścieżkę KV-v2. Zezwól na to reader dokładnie read na tajne/dane/wysyłkę,
  bez dostępu do innych ścieżek KV lub administracji montowaniem. Edytuj reader.hcl i uruchom dostarczony
  apply-policy.sh za pomocą gry manager token; reader token musi się później udać. Samokontrola tokena
  pozostaje częścią default policy.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `platform.env`, `reader.hcl`,
  `apply-policy.sh`, `policy.json`, `capability-paths.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: reader pobiera dispatch; capabilities zezwala tam tylko na read i blokuje
  inne testowane ścieżki secret/admin.'
debrief: Efektywne uprawnienia reader zostały sprawdzone w API, łącznie z zabronionymi ścieżkami, a nie
  na podstawie samego tekstu zasad.
stages.0.brief: 'Kryteria sukcesu: reader pobiera dispatch; capabilities zezwala tam tylko na read i blokuje
  inne testowane ścieżki secret/admin.'
stages.0.objectives.0.text: reader pobiera dispatch; capabilities zezwala tam tylko na read i blokuje
  inne testowane ścieżki secret/admin.
hints.0.text: Ścieżki KV-v2 API obejmują data pomiędzy mount i kluczem.
hints.1.text: Użyj menedżera tylko do aktualizacji polityki reader, a następnie przetestuj tożsamość reader.
hints.2.text: Symbol wieloznaczny przeszedłby pozytywny odczyt, ale nie przeszedłby kontroli negatywnych
  uprawnień.
phrases.0: Przetestowałem tożsamość reader, zamiast polegać na dostępie manager.
phrases.1: Przyznałem read na jednej ścieżce danych KV-v2 bez wildcard.
phrases.2: Sprawdziłem odrzucone secret i ścieżki administracyjne, a także dozwolony odczyt.
