title: Политика Vault
brief: 'Предоставленная идентичность Vault не может получить требуемую конфигурацию dispatch.


  Работайте на рабочей станции в `~/quest` с `platform.env`, `reader.hcl`, `apply-policy.sh`, `sync-secret.sh`.


  **Требования:**

  - Поставленная политика читателя разрешает только чтение требуемой конфигурации диспетчеризации, без других
  разрешений.

  - Поставленная учётная запись читателя Vault может прочитать существующую конфигурацию диспетчеризации.

  - Поставленный читатель может читать требуемые данные диспетчеризации, но доступ к другим данным и управлению
  монтированиями запрещён.


  Несколько проверок отказа для отдельных путей сами по себе не доказывают запрет всех остальных путей.

  '
debrief: Фактические права reader проверены через API, включая запрещённые пути, а не только по тексту политики.
stages.0.brief: Предоставленная идентичность Vault должна соответствовать контракту доступа dispatch.
hints.0.text: Учётная запись читателя должна иметь только доступ, необходимый потребителю.
hints.1.text: 'API-пути KV-v2 содержат data между mount и ключом.

  Политика rail-reader сейчас указывает на устаревший путь KV-v2.


  Изучите поставленные входные данные и наблюдаемое состояние:


  ```sh

  cat reader.hcl apply-policy.sh sync-secret.sh

  ```'
hints.2.text: 'Используйте manager только для обновления rail-reader. Предоставленная идентичность доступа
  также сохраняет политику Vault default для самоинспекции.


  Wildcard разрешил бы чтение, но провалил бы отрицательные проверки прав.


  Проверьте наблюдаемый результат:


  - `source platform.env; curl -fsS -H @<(printf ''X-Vault-Token: %s\n'' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch"
  | jq -e ''.data.data.value=="north-secret"''` — Печатает `true`, не выводя ответ с секретом.

  - `source platform.env; curl -fsS -X POST -H @<(printf ''X-Vault-Token: %s\n'' "$VAULT_READER_TOKEN") -H
  ''Content-Type: application/json'' --data ''{"paths":["secret/data/dispatch","secret/data/wrong","secret/data/other","sys/mounts"]}''
  "$VAULT_ADDR/v1/sys/capabilities-self" | jq ''.data // .''` — Для dispatch — только `read`; для трёх остальных
  путей — только `deny`.'
phrases.0: Я проверил identity reader вместо опоры на доступ manager.
phrases.1: Я разрешил read одного пути данных KV-v2 без wildcard.
phrases.2: Я проверил запрещённые пути secret и управления вместе с разрешённым чтением.
stages.0.objectives.0.text: Поставленная политика читателя разрешает только чтение требуемой конфигурации диспетчеризации,
  без других разрешений.
stages.0.objectives.1.text: Поставленная учётная запись читателя Vault может прочитать существующую конфигурацию
  диспетчеризации.
stages.0.objectives.2.text: Поставленный читатель может читать требуемые данные диспетчеризации, но доступ
  к другим данным и управлению монтированиями запрещён.
diagnostics.policy_read: 'Менеджер не смог прочитать rail-reader: у токена может не быть доступа к политике, Vault может быть недоступен либо ответ API не содержит читаемой политики. [Причина и проверка](guides#guide=vault-recovery&section=vault-policy-observation)'
diagnostics.policy_scope: 'Сохранённая политика недоступна либо не ограничена read на secret/data/dispatch: могли остаться начальный неверный путь, лишние разрешения, шаблоны путей или неподдерживаемая структура. [Причина и проверка](guides#guide=vault-recovery&section=vault-policy-scope)'
diagnostics.probe_0_0: 'Проверка политики остановилась до подробных наблюдений: platform.env, переменные токенов и адреса, временные файлы заголовков или инструменты проверки могут быть недоступны. [Причина и проверка](guides#guide=vault-recovery&section=vault-inputs)'
diagnostics.vault_inputs: 'VAULT_READER_TOKEN: Проверка чтения или capabilities не смогла подготовить данные либо очистить временные файлы: platform.env, переменные Vault, заголовки или файл запроса могут быть недоступны. [Причина и проверка](guides#guide=vault-recovery&section=vault-inputs)'
diagnostics.reader: 'VAULT_READER_TOKEN: Читатель не получил north-secret: политика могла остаться на secret/data/wrong, токен может быть некорректен либо ответ KV-v2 недоступен или изменён. [Причина и проверка](guides#guide=vault-recovery&section=vault-reader-value)'
diagnostics.cap_secret_data_dispatch: 'VAULT_READER_TOKEN: Capability читателя на dispatch не равна ровно read либо не прочитана: причиной могут быть неверный путь политики, дополнительные политики токена или сбой capabilities-self. [Причина и проверка](guides#guide=vault-recovery&section=vault-effective-access)'
diagnostics.cap_secret_data_wrong: 'VAULT_READER_TOKEN: Для secret/data/wrong читатель не сообщил только deny либо ответ недоступен: причиной могут быть начальное разрешение неверного пути, широкие или дополнительные политики токена либо сбой API. [Причина и проверка](guides#guide=vault-recovery&section=vault-effective-access)'
diagnostics.cap_secret_data_other: 'VAULT_READER_TOKEN: Для secret/data/other читатель не сообщил только deny либо ответ недоступен: причиной могут быть начальное разрешение неверного пути, широкие или дополнительные политики токена либо сбой API. [Причина и проверка](guides#guide=vault-recovery&section=vault-effective-access)'
diagnostics.cap_sys_mounts: 'VAULT_READER_TOKEN: Для sys/mounts читатель не сообщил только deny либо ответ недоступен: причиной могут быть начальное разрешение неверного пути, широкие или дополнительные политики токена либо сбой API. [Причина и проверка](guides#guide=vault-recovery&section=vault-effective-access)'
