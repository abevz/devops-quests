title: Политика Vault
brief: 'Политика reader в Vault указывает устаревший путь KV-v2. Разрешите reader
  ровно read secret/data/dispatch без доступа к другим KV-путям и управлению mounts.
  Измените reader.hcl и запустите выданный apply-policy.sh с игровым manager token;
  затем запрос reader должен пройти. Самопроверка token остаётся частью default policy.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `platform.env`,
  `reader.hcl`, `apply-policy.sh`, `policy.json`, `capability-paths.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно
  загруженные образы и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Reader получает dispatch; capabilities разрешают там только
  read и запрещают проверяемые другие secret/admin пути.'
debrief: Фактические права reader проверены через API, включая запрещённые пути, а
  не только по тексту политики.
stages.0.brief: 'Результат проверки: Reader получает dispatch; capabilities разрешают
  там только read и запрещают проверяемые другие secret/admin пути.'
stages.0.objectives.0.text: Reader получает dispatch; capabilities разрешают там только
  read и запрещают проверяемые другие secret/admin пути.
hints.0.text: API-пути KV-v2 содержат data между mount и ключом.
hints.1.text: Manager нужен для обновления политики reader; затем проверяйте identity
  reader.
hints.2.text: Wildcard разрешил бы чтение, но провалил бы отрицательные проверки прав.
phrases.0: Я проверил identity reader вместо опоры на доступ manager.
phrases.1: Я разрешил read одного пути данных KV-v2 без wildcard.
phrases.2: Я проверил запрещённые пути secret и управления вместе с разрешённым чтением.
