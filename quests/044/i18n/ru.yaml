title: Политика Vault
brief: |
  Предоставленная идентичность Vault не может получить требуемую конфигурацию dispatch.

  Работайте на workstation в `~/quest` с файлами `platform.env`, `reader.hcl`, `apply-policy.sh`.

  **Требования:**
  - Учебный Vault по адресу `VAULT_ADDR` из `platform.env` на workstation:
    - Политика: `rail-reader`.
    - `secret/data/dispatch`: `read`.
    - Других разрешений в этой политике нет.
  - Учебный Vault по адресу `VAULT_ADDR` из `platform.env` на workstation:
    - Идентичность предоставленного `VAULT_READER_TOKEN` читает `north-secret` по KV-v2 пути `secret/data/dispatch`.
  - Capabilities предоставленной идентичности:
    - `secret/data/dispatch`: `read`.
    - `secret/data/wrong`, `secret/data/other`, `sys/mounts`: `deny`.

  **Самопроверка перед Check & finish:**
  - `source platform.env; curl -fsS -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch" | jq -e '.data.data.value=="north-secret"'` — Печатает `true`, не выводя ответ с секретом.
  - `source platform.env; curl -fsS -X POST -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_READER_TOKEN") -H 'Content-Type: application/json' --data '{"paths":["secret/data/dispatch","secret/data/wrong","secret/data/other","sys/mounts"]}' "$VAULT_ADDR/v1/sys/capabilities-self" | jq '.data // .'` — Для dispatch — только `read`; для трёх остальных путей — только `deny`.

  Несколько проверок отказа для отдельных путей сами по себе не доказывают запрет всех остальных путей.
debrief: Фактические права reader проверены через API, включая запрещённые пути, а не только по тексту политики.
stages.0.brief: Предоставленная идентичность Vault должна соответствовать контракту доступа dispatch.
hints.0.text: |-
  API-пути KV-v2 содержат data между mount и ключом.
  Политика rail-reader сейчас указывает на устаревший путь KV-v2.
hints.1.text: Используйте manager только для обновления rail-reader. Предоставленная идентичность доступа также
  сохраняет политику Vault default для самоинспекции.
hints.2.text: Wildcard разрешил бы чтение, но провалил бы отрицательные проверки прав.
phrases.0: Я проверил identity reader вместо опоры на доступ manager.
phrases.1: Я разрешил read одного пути данных KV-v2 без wildcard.
phrases.2: Я проверил запрещённые пути secret и управления вместе с разрешённым чтением.
diagnostics.policy_read: Manager должен иметь возможность прочитать политику rail-reader.
diagnostics.policy_scope: Политика rail-reader должна содержать только возможность read для secret/data/dispatch.
diagnostics.reader: Токен читателя должен прочитать north-secret из secret/data/dispatch.
diagnostics.cap_secret_data_dispatch: capabilities-self для secret/data/dispatch должен совпадать с [read].
diagnostics.cap_secret_data_wrong: capabilities-self для secret/data/wrong должен совпадать с [deny].
diagnostics.cap_secret_data_other: capabilities-self для secret/data/other должен совпадать с [deny].
diagnostics.cap_sys_mounts: capabilities-self для sys/mounts должен совпадать с [deny].
stages.0.objectives.0.text: Политика Vault `rail-reader` предоставляет только `read` для `secret/data/dispatch`,
  без других разрешений.
stages.0.objectives.1.text: Идентичность предоставленного `VAULT_READER_TOKEN` читает значение `north-secret` из
  Vault `secret/data/dispatch`.
stages.0.objectives.2.text: Предоставленная идентичность Vault имеет `read` для `secret/data/dispatch` и `deny`
  для `secret/data/wrong`, `secret/data/other` и `sys/mounts`.
