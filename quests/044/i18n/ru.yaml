title: Политика Vault
brief: 'Предоставленная идентичность Vault не может получить требуемую конфигурацию dispatch.


  Работайте на рабочей станции в `~/quest` с `platform.env`, `reader.hcl`, `apply-policy.sh`, `sync-secret.sh`.


  **Требования:**

  - Поставленная политика читателя разрешает только чтение требуемой конфигурации диспетчеризации, без других
  разрешений.

  - Поставленная учётная запись читателя Vault может прочитать существующую конфигурацию диспетчеризации.

  - Поставленный читатель может читать требуемые данные диспетчеризации, но доступ к другим данным и управлению
  монтированиями запрещён.


  Несколько проверок отказа для отдельных путей сами по себе не доказывают запрет всех остальных путей.

  '
debrief: Фактические права reader проверены через API, включая запрещённые пути, а не только по тексту политики.
stages.0.brief: Предоставленная идентичность Vault должна соответствовать контракту доступа dispatch.
hints.0.text: Учётная запись читателя должна иметь только доступ, необходимый потребителю.
hints.1.text: 'API-пути KV-v2 содержат data между mount и ключом.

  Политика rail-reader сейчас указывает на устаревший путь KV-v2.


  Изучите поставленные входные данные и наблюдаемое состояние:


  ```sh

  cat reader.hcl apply-policy.sh sync-secret.sh

  ```'
hints.2.text: 'Используйте manager только для обновления rail-reader. Предоставленная идентичность доступа
  также сохраняет политику Vault default для самоинспекции.


  Wildcard разрешил бы чтение, но провалил бы отрицательные проверки прав.


  Проверьте наблюдаемый результат:


  - `source platform.env; curl -fsS -H @<(printf ''X-Vault-Token: %s\n'' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch"
  | jq -e ''.data.data.value=="north-secret"''` — Печатает `true`, не выводя ответ с секретом.

  - `source platform.env; curl -fsS -X POST -H @<(printf ''X-Vault-Token: %s\n'' "$VAULT_READER_TOKEN") -H
  ''Content-Type: application/json'' --data ''{"paths":["secret/data/dispatch","secret/data/wrong","secret/data/other","sys/mounts"]}''
  "$VAULT_ADDR/v1/sys/capabilities-self" | jq ''.data // .''` — Для dispatch — только `read`; для трёх остальных
  путей — только `deny`.'
phrases.0: Я проверил identity reader вместо опоры на доступ manager.
phrases.1: Я разрешил read одного пути данных KV-v2 без wildcard.
phrases.2: Я проверил запрещённые пути secret и управления вместе с разрешённым чтением.
diagnostics.policy_read: Manager должен иметь возможность прочитать политику rail-reader.
diagnostics.policy_scope: Политика rail-reader должна содержать только возможность read для secret/data/dispatch.
diagnostics.reader: Токен читателя должен прочитать north-secret из secret/data/dispatch.
diagnostics.cap_secret_data_dispatch: capabilities-self для secret/data/dispatch должен совпадать с [read].
diagnostics.cap_secret_data_wrong: capabilities-self для secret/data/wrong должен совпадать с [deny].
diagnostics.cap_secret_data_other: capabilities-self для secret/data/other должен совпадать с [deny].
diagnostics.cap_sys_mounts: capabilities-self для sys/mounts должен совпадать с [deny].
stages.0.objectives.0.text: Поставленная политика читателя разрешает только чтение требуемой конфигурации диспетчеризации,
  без других разрешений.
stages.0.objectives.1.text: Поставленная учётная запись читателя Vault может прочитать существующую конфигурацию
  диспетчеризации.
stages.0.objectives.2.text: Поставленный читатель может читать требуемые данные диспетчеризации, но доступ
  к другим данным и управлению монтированиями запрещён.
