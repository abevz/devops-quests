title: Политика Vault
brief: 'Работайте в `~/quest` с `platform.env`, `reader.hcl` и `apply-policy.sh`. Политика reader игрового Vault указывает
  устаревший путь KV-v2. Токен manager может изменить `rail-reader`; токен reader используется для чтения и проверки полномочий.
  Не выводите токены или ответы с секретами. Руководство Vault объясняет политику и API чтения.


  Предоставьте в `rail-reader` только `read` на `secret/data/dispatch`; оставьте в этой политике только этот путь и право
  без других разрешений, поскольку проверка нескольких отказов не доказывает отказ по всем путям. Допускаются равнозначные
  пробелы, комментарии и конечная запятая. Примените политику и проверьте, что reader получает `north-secret`, а `sys/capabilities-self`
  сообщает `[read]` для `secret/data/dispatch` и `[deny]` для `secret/data/wrong`, `secret/data/other` и `sys/mounts`. Reader
  также сохраняет стандартную политику Vault для самопроверки. Работайте только в офлайн-песочнице.'
debrief: Фактические права reader проверены через API, включая запрещённые пути, а не только по тексту политики.
stages.0.brief: Текст политики разрешает только чтение dispatch, значение reader совпадает, а все четыре результата проверки
  полномочий соответствуют заданию.
stages.0.objectives.0.text: Текст политики разрешает только чтение dispatch, значение reader совпадает, а все четыре результата
  проверки полномочий соответствуют заданию.
hints.0.text: API-пути KV-v2 содержат data между mount и ключом.
hints.1.text: Manager нужен для обновления политики reader; затем проверяйте identity reader.
hints.2.text: Wildcard разрешил бы чтение, но провалил бы отрицательные проверки прав.
phrases.0: Я проверил identity reader вместо опоры на доступ manager.
phrases.1: Я разрешил read одного пути данных KV-v2 без wildcard.
phrases.2: Я проверил запрещённые пути secret и управления вместе с разрешённым чтением.
diagnostics.policy_read: Manager должен иметь возможность прочитать политику rail-reader.
diagnostics.policy_scope: Политика rail-reader должна содержать только возможность read для secret/data/dispatch.
diagnostics.reader: Токен читателя должен прочитать north-secret из secret/data/dispatch.
diagnostics.cap_secret_data_dispatch: capabilities-self для secret/data/dispatch должен совпадать с [read].
diagnostics.cap_secret_data_wrong: capabilities-self для secret/data/wrong должен совпадать с [deny].
diagnostics.cap_secret_data_other: capabilities-self для secret/data/other должен совпадать с [deny].
diagnostics.cap_sys_mounts: capabilities-self для sys/mounts должен совпадать с [deny].
