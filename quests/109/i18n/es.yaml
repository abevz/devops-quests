title: Security context y Pod Security
brief: 'La bahía aplica el estándar restricted Pod Security. El Deployment pide un privileged container,
  por lo que su ReplicaSet no puede admitir un Pod. Inspeccione los eventos ReplicaSet, luego reemplace
  container securityContext con privileged: false, allowPrivilegeEscalation: false, capabilities.drop:
  [ALL] y readOnlyRootFilesystem: verdadero. Conserve los non-root UID 1000, RuntimeDefault seccomp y
  emptyDir montados solo en /tmp.. La aplicación necesita almacenamiento temporal pero no un host. access.
  No cambie namespace policy ni agregue privilegios.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `board.json`, `service.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: restricted Pod se ejecuta como UID 1000, su root filesystem rechaza escrituras,
  /tmp permanece grabable y HTTP devuelve north-109 sin cambios en la política del espacio de nombres.'
debrief: 'Admission policy y las comprobaciones de tiempo de ejecución coinciden: la aplicación se ejecuta
  con las restricciones requeridas y un writable scratch area estrecho.'
stages.0.brief: 'Criterios de éxito: el Pod restringido se ejecuta como UID 1000, su root filesystem rechaza
  escrituras, /tmp permanece grabable y HTTP regresa. north-109 sin cambios en la política del espacio
  de nombres.'
stages.0.objectives.0.text: El Pod restringido se ejecuta como UID 1000, su root filesystem rechaza escrituras,
  /tmp permanece grabable y HTTP regresa. north-109 sin cambios en la política del espacio de nombres.
hints.0.text: Se produce un rechazo de admission antes de que un contenedor pueda fallar o generar registros
  de aplicaciones.
hints.1.text: Non-root identity, los controles de privilegios y los sistemas de archivos read-only resuelven
  diferentes problemas.
hints.2.text: Elimine los privilegios, conserve el root filesystem read-only y otorgue a la aplicación
  solo su /tmp emptyDir.
phrases.0: Diagnostiqué una falla de admission antes de iniciar la depuración de la aplicación.
phrases.1: Mantuve la carga de trabajo non-root y eliminé privilegios innecesarios.
phrases.2: Verifiqué el almacenamiento read-only root y las escrituras temporales de alcance.
questions.0.points.0: No; RBAC controla las acciones de API, mientras que admission valida las propiedades
  de carga de trabajo solicitadas.
questions.0.points.1: Una persona que llama a la que se le permite crear un Deployment aún puede solicitar
  una plantilla Pod rechazada.
questions.0.prompt: ¿Son intercambiables RBAC y Pod Security Admission?
questions.1.points.0: Protege el sistema de archivos de imágenes del contenedor, no todos los volúmenes
  montados.
questions.1.points.1: Proporcione solo el writable volumes explícito que la aplicación necesita.
questions.1.prompt: ¿readOnlyRootFilesystem prohíbe todas las escrituras?
