title: Security context y Pod Security
brief: 'El endpoint board no está disponible. Restaure la carga aislada sin debilitar la política de seguridad
  de la bahía.


  Trabaje en `~/quest` en la estación de trabajo. Archivos suministrados: `board.yaml`, `service.yaml`.


  **Requisitos:**

  - El namespace mantiene Pod Security en modo `restricted`.

  - El Deployment `board` tiene exactamente un contenedor `worker` y una réplica lista.

  - El Pod no tiene red de host, acceso a procesos o IPC del host ni volúmenes del sistema de archivos del
  host. Todos los contenedores normales e init se ejecutan sin privilegios elevados, no pueden obtener privilegios,
  no conservan ni añaden capabilities Linux y tienen el sistema raíz de solo lectura. El Pod se ejecuta sin
  root con el filtro de llamadas al sistema predeterminado; los contenedores no pueden sustituirlo por otro
  filtro. Solo el almacenamiento temporal suministrado dentro del Pod en `/tmp` es escribible; los demás montajes
  son de solo lectura.

  - Desde Deployment `board`, `http://board:8080` devuelve `north-109`.


  Las comprobaciones observan la configuración actual, no el historial de cambios del namespace.

  '
debrief: La seguridad del workload, el montaje activo, el UID, el espacio temporal y la respuesta del servicio
  coincidieron con las comprobaciones.
stages.0.brief: La carga board aislada debe estar lista y funcionar.
hints.0.text: La admisión y la salud en ejecución son etapas distintas de la recuperación de una carga.
hints.1.text: |-
  Se produce un rechazo de admission antes de que un contenedor pueda fallar o generar registros de aplicaciones. El contenedor board privilegiado suministrado es rechazado por restricted Pod Security; examine los eventos de ReplicaSet.

  Non-root identity, los controles de privilegios y los sistemas de archivos read-only resuelven diferentes problemas.

  Inspecciona las definiciones suministradas, los recursos actuales y los eventos.

  Elimine los privilegios, conserve el root filesystem read-only y otorgue a la aplicación solo su /tmp emptyDir.

  ```sh
  cat board.yaml
  kubectl describe replicasets
  kubectl get deployment board -o yaml
  kubectl get namespace "$DQ_NAMESPACE" -o yaml
  ```
hints.2.text: |-
  Verifica el resultado observado:

  ```sh
  kubectl get deployment board
  kubectl exec deployment/board -c worker -- sh -c 'id -u; cat /proc/mounts; test -w /tmp'
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080
  ```

  Se esperan una réplica lista, UID en ejecución 1000, un montaje raíz de solo lectura, /tmp escribible y la respuesta HTTP north-109.

  Restricciones y detalles suministrados: El Pod `board` no tiene acceso al host, se ejecuta sin root con UID `1000` y seccomp `RuntimeDefault`; todos los contenedores impiden la escalada, eliminan `ALL` capabilities, no añaden ninguna y tienen sistemas raíz de solo lectura; solo el volumen `scratch`, emptyDir en `/tmp`, permite escritura y funciona.

  Las restricciones cubren todos los contenedores normales e init: sin red/PID/IPC de host ni hostPath, sin escalada ni capabilities añadidas, eliminar ALL; seccomp del contenedor ausente o RuntimeDefault, otros montajes de solo lectura; se aceptan campos seguros y capabilities eliminadas adicionales.
phrases.0: Diagnostiqué una falla de admission antes de iniciar la depuración de la aplicación.
phrases.1: Mantuve la carga de trabajo non-root y eliminé privilegios innecesarios.
phrases.2: Verifiqué el almacenamiento read-only root y las escrituras temporales de alcance.
questions.0.points.0: No; RBAC controla las acciones de API, mientras que admission valida las propiedades
  de carga de trabajo solicitadas.
questions.0.points.1: Una persona que llama a la que se le permite crear un Deployment aún puede solicitar
  una plantilla Pod rechazada.
questions.0.prompt: ¿Son intercambiables RBAC y Pod Security Admission?
questions.1.points.0: Protege el sistema de archivos de imágenes del contenedor, no todos los volúmenes montados.
questions.1.points.1: Proporcione solo el writable volumes explícito que la aplicación necesita.
questions.1.prompt: ¿readOnlyRootFilesystem prohíbe todas las escrituras?
stages.0.objectives.0.text: El namespace mantiene Pod Security en modo `restricted`.
stages.0.objectives.1.text: El Deployment `board` tiene exactamente un contenedor `worker` y una réplica lista.
stages.0.objectives.2.text: El Pod no tiene red de host, acceso a procesos o IPC del host ni volúmenes del
  sistema de archivos del host. Todos los contenedores normales e init se ejecutan sin privilegios elevados,
  no pueden obtener privilegios, no conservan ni añaden capabilities Linux y tienen el sistema raíz de solo
  lectura. El Pod se ejecuta sin root con el filtro de llamadas al sistema predeterminado; los contenedores
  no pueden sustituirlo por otro filtro. Solo el almacenamiento temporal suministrado dentro del Pod en `/tmp`
  es escribible; los demás montajes son de solo lectura.
stages.0.objectives.3.text: Desde Deployment `board`, `http://board:8080` devuelve `north-109`.
diagnostics.probe_0_2: El observador puede detenerse antes de señalar un control si falla Python o la entrada. Revise el acceso al Deployment y las herramientas. [Causa y comprobación](guides#guide=workload-access&section=q109-security-observer-input)
diagnostics.host_hostnetwork: La reparación puede haber activado la red del host. Revise hostNetwork y mantenga el espacio de red del Pod board. [Causa y comprobación](guides#guide=workload-access&section=q109-board-network-namespace)
diagnostics.host_hostpid: La plantilla puede compartir los procesos del host. Revise hostPID y manténgalo desactivado. [Causa y comprobación](guides#guide=workload-access&section=q109-board-process-namespace)
diagnostics.host_hostipc: La plantilla puede compartir IPC con el host. Revise hostIPC y mantenga aislado el IPC del Pod. [Causa y comprobación](guides#guide=workload-access&section=q109-board-ipc-namespace)
diagnostics.hostpath: Al cambiar la plantilla se pudo añadir un volumen hostPath. Revise las fuentes y elimine la dependencia de hostPath. [Causa y comprobación](guides#guide=workload-access&section=q109-board-volume-sources)
diagnostics.nonroot: Un contenedor puede carecer de runAsNonRoot efectivo, sobrescribirlo o indicar UID 0. Revise el Pod y todos los contenedores, incluidos init. Mantenga positivos los UID explícitos. [Causa y comprobación](guides#guide=workload-access&section=q109-board-user-policy)
diagnostics.seccomp: El filtro de llamadas puede haberse quitado o sobrescrito. Compruebe RuntimeDefault efectivo en contenedores normales e init, incluida la herencia del Pod. [Causa y comprobación](guides#guide=workload-access&section=q109-board-syscall-filter)
diagnostics.security_privileged: 'Un contenedor normal o init puede estar en modo privilegiado. Revise securityContext de cada uno y quite privileged: true. [Causa y comprobación](guides#guide=workload-access&section=q109-board-privileged-mode)'
diagnostics.security_allowprivilegeescalation: 'Un contenedor puede permitir escalada si el indicador falta o está activo. Defina allowPrivilegeEscalation: false en cada contenedor normal e init. [Causa y comprobación](guides#guide=workload-access&section=q109-board-privilege-escalation)'
diagnostics.security_drop: Un contenedor puede haber dejado de eliminar las capacidades por defecto. Compruebe ALL en drop de cada contenedor normal e init. [Causa y comprobación](guides#guide=workload-access&section=q109-board-drop-capabilities)
diagnostics.security_add: La plantilla puede volver a añadir capacidades tras eliminarlas. Revise que add esté vacío en cada contenedor normal e init. [Causa y comprobación](guides#guide=workload-access&section=q109-board-no-added-capabilities)
diagnostics.namespace: El namespace puede carecer de la etiqueta restricted o fallar al leerlo. Revise la etiqueta del entorno y conserve la aplicación de restricted al corregir la carga. [Causa y comprobación](guides#guide=workload-access&section=q109-restricted-namespace)
diagnostics.replicas: El Deployment puede haberse escalado durante la reparación o faltar. Compruebe que board siga solicitando una réplica. [Causa y comprobación](guides#guide=workload-access&section=q109-board-replica-contract)
diagnostics.ready: La plantilla puede existir aunque admission o el despliegue impidan tener una réplica lista. Revise los eventos y confirme una réplica lista en el estado de board. [Causa y comprobación](guides#guide=workload-access&section=q109-board-ready-replica)
diagnostics.containers: La carga puede tener el worker renombrado, un contenedor adicional o ninguno. Mantenga un solo contenedor normal denominado worker. [Causa y comprobación](guides#guide=workload-access&section=q109-board-worker-identity)
diagnostics.uid: Un runAsUser explícito puede ser cero o inválido. Revise que los UID explícitos del Pod y los contenedores, incluidos init, sean enteros positivos. [Causa y comprobación](guides#guide=workload-access&section=q109-board-explicit-user-ids)
diagnostics.security_readonlyrootfilesystem: Un contenedor puede seguir permitiendo escribir en el sistema de archivos de la imagen. Defina readOnlyRootFilesystem en true en todos los contenedores normales e init y use el volumen separado para archivos temporales. [Causa y comprobación](guides#guide=workload-access&section=q109-board-declared-readonly-root)
diagnostics.security_seccomp: Un ajuste seccomp del contenedor puede sustituir RuntimeDefault. Revise todos los contenedores normales e init y conserve el perfil heredado o su equivalente explícito. [Causa y comprobación](guides#guide=workload-access&section=q109-board-container-seccomp-override)
diagnostics.volume: El montaje /tmp puede faltar o apuntar a un volumen distinto de emptyDir. Siga el montaje con nombre desde worker hasta el origen temporal declarado. [Causa y comprobación](guides#guide=workload-access&section=q109-board-temporary-volume-type)
diagnostics.mount: El contenedor worker puede montar /tmp en solo lectura o tener entradas incompatibles. Compruebe que existe un único montaje escribible respaldado por emptyDir temporal. [Causa y comprobación](guides#guide=workload-access&section=q109-board-writable-temporary-mount)
diagnostics.mounts: Un montaje distinto de /tmp puede permitir escritura. Revise los montajes normales e init, incluidas las fuentes proyectadas de solo lectura. [Causa y comprobación](guides#guide=workload-access&section=q109-board-other-mounts-readonly)
diagnostics.root: El Deployment puede declarar la raíz de solo lectura mientras el worker activo sigue con un montaje anterior. Revise las opciones de / en /proc/mounts y confirme ro tras el despliegue. [Causa y comprobación](guides#guide=workload-access&section=q109-board-live-readonly-root)
diagnostics.live_uid: El worker seleccionado puede seguir como root o fallar exec. Lea el UID real del proceso y confirme que es positivo. [Causa y comprobación](guides#guide=workload-access&section=q109-board-live-worker-uid)
diagnostics.tmp: El volumen temporal puede ser de solo lectura o bloquear al worker por permisos. Pruebe una escritura y lectura reales en /tmp desde el worker activo. [Causa y comprobación](guides#guide=workload-access&section=q109-board-live-tmp-reads-writes)
diagnostics.http: La seguridad puede estar correcta mientras worker no puede escribir el contenido o el Service carece de endpoint listo. Consulte board tras el despliegue y compare con north-109. [Causa y comprobación](guides#guide=workload-access&section=q109-board-live-security-http)
