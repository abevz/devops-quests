title: Security context y Pod Security
brief: 'Trabaja en `~/quest`; lee `board.json` y `service.json`. El namespace privado aplica Pod Security restringido y el contenedor privilegiado `board` no puede arrancar. Inspecciona los eventos del ReplicaSet y repara el Deployment existente. Un contexto de seguridad configura la identidad, los privilegios y el sistema de archivos solicitados; `emptyDir` proporciona espacio temporal.


  Conserva un contenedor `worker` y una réplica. En el Pod establece `runAsNonRoot: true`, `runAsUser: 1000` y `seccompProfile.type: RuntimeDefault`; no uses red, PID o IPC del host ni hostPath. Para cada contenedor e init container, desactiva privilegios y escalada, establece el sistema raíz de solo lectura, elimina las capacidades `ALL` y no añadas ninguna; seccomp del contenedor puede estar ausente o ser `RuntimeDefault`. Se aceptan capacidades adicionales eliminadas y campos seguros equivalentes. Conserva un emptyDir `scratch` montado con escritura en `/tmp`; cualquier otro montaje debe ser de solo lectura.


  Comprueba una réplica lista, el indicador `ro` del montaje raíz activo, que `id -u` devuelve 1000, que se puede escribir y leer en `/tmp` y que `board:8080` devuelve `north-109`. Mantén la etiqueta del namespace `pod-security.kubernetes.io/enforce` en `restricted`. Las comprobaciones observan la configuración actual, pero no demuestran el historial de cambios del namespace. Usa solo la bahía sin conexión.'
debrief: La seguridad del workload, el montaje activo, el UID, el espacio temporal y la respuesta del servicio coincidieron con las comprobaciones.
stages.0.brief: La seguridad y los montajes del Deployment, el comportamiento de la raíz y /tmp, el UID, la réplica lista y la respuesta de board coinciden con el enunciado.
stages.0.objectives.0.text: La seguridad y los montajes del Deployment, el comportamiento de la raíz y /tmp, el UID, la réplica lista y la respuesta de board coinciden con el enunciado.
hints.0.text: Se produce un rechazo de admission antes de que un contenedor pueda fallar o generar registros
  de aplicaciones.
hints.1.text: Non-root identity, los controles de privilegios y los sistemas de archivos read-only resuelven
  diferentes problemas.
hints.2.text: Elimine los privilegios, conserve el root filesystem read-only y otorgue a la aplicación
  solo su /tmp emptyDir.
phrases.0: Diagnostiqué una falla de admission antes de iniciar la depuración de la aplicación.
phrases.1: Mantuve la carga de trabajo non-root y eliminé privilegios innecesarios.
phrases.2: Verifiqué el almacenamiento read-only root y las escrituras temporales de alcance.
questions.0.points.0: No; RBAC controla las acciones de API, mientras que admission valida las propiedades
  de carga de trabajo solicitadas.
questions.0.points.1: Una persona que llama a la que se le permite crear un Deployment aún puede solicitar
  una plantilla Pod rechazada.
questions.0.prompt: ¿Son intercambiables RBAC y Pod Security Admission?
questions.1.points.0: Protege el sistema de archivos de imágenes del contenedor, no todos los volúmenes
  montados.
questions.1.points.1: Proporcione solo el writable volumes explícito que la aplicación necesita.
questions.1.prompt: ¿readOnlyRootFilesystem prohíbe todas las escrituras?
