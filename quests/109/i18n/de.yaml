title: Security context und Pod Security
brief: 'Arbeite in `~/quest`; lies `board.json` und `service.json`. Der private Namespace erzwingt eingeschränkte Pod Security, und der privilegierte Container `board` startet nicht. Untersuche die ReplicaSet-Ereignisse und repariere das vorhandene Deployment. Ein Sicherheitskontext legt angeforderte Identität, Privilegien und Dateisystemeinstellungen fest; `emptyDir` bietet temporären Speicher.


  Behalte einen Container `worker` und eine Replik. Setze auf Pod-Ebene `runAsNonRoot: true`, `runAsUser: 1000` und `seccompProfile.type: RuntimeDefault`; verwende kein Host-Netzwerk, Host-PID, Host-IPC oder hostPath. Deaktiviere für jeden Container und Init-Container Privilegien und Eskalation, setze das Root-Dateisystem auf nur lesbar, gib Capabilities `ALL` ab und füge keine hinzu; Container-seccomp darf fehlen oder `RuntimeDefault` sein. Zusätzliche abgegebene Capabilities und gleichwertige sichere Felder sind zulässig. Behalte ein beschreibbar unter `/tmp` gemountetes `scratch` emptyDir; weitere Mounts müssen nur lesbar sein.


  Prüfe eine bereite Replik, das Flag `ro` des laufenden Root-Mounts, den Wert 1000 von `id -u`, Schreiben und Lesen unter `/tmp` sowie `north-109` von `board:8080`. Belasse das Namespace-Label `pod-security.kubernetes.io/enforce` auf `restricted`. Die Prüfungen beobachten aktuelle Einstellungen, beweisen aber nicht die Historie der Namespace-Änderungen. Nutze nur die Offline-Umgebung.'
debrief: Workload-Sicherheit, laufender Mount, UID, temporärer Speicher und Service-Antwort entsprachen den Prüfungen.
stages.0.brief: Deployment-Sicherheit und Mounts, Root- und /tmp-Verhalten, UID, bereite Replik und board-Antwort entsprechen der Aufgabe.
stages.0.objectives.0.text: Deployment-Sicherheit und Mounts, Root- und /tmp-Verhalten, UID, bereite Replik und board-Antwort entsprechen der Aufgabe.
hints.0.text: Eine admission-Ablehnung erfolgt, bevor ein Container abstürzen oder Anwendungsprotokolle
  erstellen kann.
hints.1.text: Non-root identity, Berechtigungskontrollen und read-only-Dateisysteme lösen verschiedene
  Probleme.
hints.2.text: Geben Sie die Berechtigungen auf, behalten Sie die root filesystem read-only und geben Sie
  der App nur ihre /tmp emptyDir.
phrases.0: Ich habe vor dem Debuggen des Anwendungsstarts einen admission-Fehler diagnostiziert.
phrases.1: Ich habe den Workload non-root beibehalten und unnötige Berechtigungen entfernt.
phrases.2: Ich habe den read-only root-Speicher und begrenzte Scratch-Schreibvorgänge überprüft.
questions.0.points.0: NEIN; RBAC steuert API-Aktionen, während admission angeforderte Workload-Eigenschaften
  validiert.
questions.0.points.1: Ein Anrufer, der berechtigt ist, eine Deployment-Vorlage zu erstellen, kann dennoch
  eine abgelehnte Pod-Vorlage anfordern.
questions.0.prompt: Sind RBAC und Pod Security Admission austauschbar?
questions.1.points.0: Es schützt das Container-Image-Dateisystem, nicht jedes gemountete Volume.
questions.1.points.1: Geben Sie nur das explizite writable volumes an, das die Anwendung benötigt.
questions.1.prompt: Verbietet readOnlyRootFilesystem alle Schreibvorgänge?
