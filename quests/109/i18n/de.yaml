title: Security context und Pod Security
brief: 'Der Schacht erzwingt den Standard restricted Pod Security. Der Deployment verlangt nach einem
  privileged container, daher kann sein ReplicaSet keinen Pod zulassen. Überprüfen Sie die ReplicaSet-Ereignisse
  und ersetzen Sie dann die container securityContext durch privileged: false, allowPrivilegeEscalation:
  false, capabilities.drop: [ALLE] und readOnlyRootFilesystem: wahr. Behalten Sie die mitgelieferten Komponenten
  non-root UID 1000, RuntimeDefault seccomp und emptyDir bei, die nur bei /tmp. montiert sind. Die App
  benötigt Arbeitsspeicher, aber keinen Host access. Ändern Sie namespace policy nicht und fügen Sie keine
  Berechtigungen hinzu.


  Questdateien in `~/quest` (einige erscheinen in späteren Phasen): `board.json`, `service.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: Der restricted Pod läuft als UID 1000, sein root filesystem lehnt Schreibvorgänge
  ab, /tmp bleibt beschreibbar und HTTP gibt north-109 ohne Änderungen der Namespace-Richtlinien zurück.'
debrief: 'Admission policy und Laufzeitprüfungen stimmen überein: Die App läuft mit den erforderlichen
  Einschränkungen und einem engen writable scratch area.'
stages.0.brief: 'Erfolgskriterien: Der eingeschränkte Pod läuft als UID 1000, sein root filesystem lehnt
  Schreibvorgänge ab, /tmp bleibt beschreibbar und HTTP kehrt zurück north-109 ohne Änderungen der Namespace-Richtlinien.'
stages.0.objectives.0.text: Der eingeschränkte Pod läuft als UID 1000, sein root filesystem lehnt Schreibvorgänge
  ab, /tmp bleibt beschreibbar und HTTP kehrt zurück north-109 ohne Änderungen der Namespace-Richtlinien.
hints.0.text: Eine admission-Ablehnung erfolgt, bevor ein Container abstürzen oder Anwendungsprotokolle
  erstellen kann.
hints.1.text: Non-root identity, Berechtigungskontrollen und read-only-Dateisysteme lösen verschiedene
  Probleme.
hints.2.text: Geben Sie die Berechtigungen auf, behalten Sie die root filesystem read-only und geben Sie
  der App nur ihre /tmp emptyDir.
phrases.0: Ich habe vor dem Debuggen des Anwendungsstarts einen admission-Fehler diagnostiziert.
phrases.1: Ich habe den Workload non-root beibehalten und unnötige Berechtigungen entfernt.
phrases.2: Ich habe den read-only root-Speicher und begrenzte Scratch-Schreibvorgänge überprüft.
questions.0.points.0: NEIN; RBAC steuert API-Aktionen, während admission angeforderte Workload-Eigenschaften
  validiert.
questions.0.points.1: Ein Anrufer, der berechtigt ist, eine Deployment-Vorlage zu erstellen, kann dennoch
  eine abgelehnte Pod-Vorlage anfordern.
questions.0.prompt: Sind RBAC und Pod Security Admission austauschbar?
questions.1.points.0: Es schützt das Container-Image-Dateisystem, nicht jedes gemountete Volume.
questions.1.points.1: Geben Sie nur das explizite writable volumes an, das die Anwendung benötigt.
questions.1.prompt: Verbietet readOnlyRootFilesystem alle Schreibvorgänge?
