title: Security context und Pod Security
brief: 'Der Board-Endpunkt ist nicht verfügbar. Stellen Sie den isolierten Workload wieder her, ohne die Sicherheitsrichtlinie
  der Bay zu lockern.


  Arbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte Dateien: `board.yaml`, `service.yaml`.


  **Anforderungen:**

  - Der Bay-Namespace behält Pod-Security-Erzwingung `restricted`.

  - Deployment `board` hat genau einen Container `worker` und ein bereites Replikat.

  - Der Pod hat kein Host-Netzwerk, keinen Zugriff auf Host-Prozesse oder Host-IPC und keine Host-Dateisystem-Volumes.
  Alle regulären und Init-Container laufen ohne erhöhte Rechte, können keine Rechte erlangen, behalten oder
  ergänzen keine Linux-Capabilities und haben ein schreibgeschütztes Root-Dateisystem. Der Pod läuft ohne Root
  mit dem Standard-Systemaufruffilter; Container dürfen ihn nicht durch einen anderen Filter ersetzen. Nur
  der mitgelieferte temporäre Speicher im Pod unter `/tmp` ist beschreibbar; andere Mounts sind schreibgeschützt.

  - Von Deployment `board` liefert `http://board:8080` den Wert `north-109`.


  Die Prüfungen beobachten aktuelle Einstellungen, nicht den Verlauf von Namespace-Änderungen.

  '
debrief: Workload-Sicherheit, laufender Mount, UID, temporärer Speicher und Service-Antwort entsprachen den
  Prüfungen.
stages.0.brief: Der isolierte Board-Workload muss bereit und nutzbar sein.
hints.0.text: Zulassung und Laufzeitgesundheit sind getrennte Phasen der Workload-Wiederherstellung.
hints.1.text: 'Eine admission-Ablehnung erfolgt, bevor ein Container abstürzen oder Anwendungsprotokolle erstellen
  kann. Der bereitgestellte privilegierte Board-Container wird von restricted Pod Security abgelehnt; prüfen
  Sie ReplicaSet-Ereignisse.


  Non-root identity, Berechtigungskontrollen und read-only-Dateisysteme lösen verschiedene Probleme.


  Prüfen Sie die mitgelieferten Definitionen, aktuellen Ressourcen und Ereignisse.


  ```sh

  cat board.yaml

  kubectl describe replicasets

  kubectl get deployment board -o yaml

  kubectl get namespace "$DQ_NAMESPACE" -o yaml

  ```'
hints.2.text: 'Geben Sie die Berechtigungen auf, behalten Sie die root filesystem read-only und geben Sie der App nur ihre /tmp emptyDir.


  Prüfen Sie das beobachtete Ergebnis:


  ```sh

  kubectl get deployment board

  kubectl exec deployment/board -c worker -- sh -c ''id -u; cat /proc/mounts; test -w /tmp''

  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080

  ```


  Erwartet werden ein bereites Replikat, Laufzeit-UID 1000, ein schreibgeschützter Root-Mount, beschreibbares /tmp und die HTTP-Antwort north-109.


  Mitgelieferte Einschränkungen und Details: Der Pod `board` hat keinen Host-Zugriff, läuft ohne root mit UID `1000` und seccomp `RuntimeDefault`; alle Container verbieten Privilegienerhöhung, verwerfen `ALL` Capabilities, fügen keine hinzu und haben schreibgeschützte Root-Dateisysteme; nur Volume `scratch`, ein emptyDir unter `/tmp`, ist beschreibbar und nutzbar.


  Die Einschränkungen gelten für alle regulären und Init-Container: kein Host-Netz/PID/IPC oder hostPath, keine Rechteausweitung oder hinzugefügten Capabilities, ALL verwerfen; Container-seccomp fehlt oder ist RuntimeDefault, andere Mounts sind schreibgeschützt; zusätzliche sichere Felder und verworfene Capabilities sind zulässig.'
phrases.0: Ich habe vor dem Debuggen des Anwendungsstarts einen admission-Fehler diagnostiziert.
phrases.1: Ich habe den Workload non-root beibehalten und unnötige Berechtigungen entfernt.
phrases.2: Ich habe den read-only root-Speicher und begrenzte Scratch-Schreibvorgänge überprüft.
questions.0.points.0: NEIN; RBAC steuert API-Aktionen, während admission angeforderte Workload-Eigenschaften
  validiert.
questions.0.points.1: Ein Anrufer, der berechtigt ist, eine Deployment-Vorlage zu erstellen, kann dennoch eine
  abgelehnte Pod-Vorlage anfordern.
questions.0.prompt: Sind RBAC und Pod Security Admission austauschbar?
questions.1.points.0: Es schützt das Container-Image-Dateisystem, nicht jedes gemountete Volume.
questions.1.points.1: Geben Sie nur das explizite writable volumes an, das die Anwendung benötigt.
questions.1.prompt: Verbietet readOnlyRootFilesystem alle Schreibvorgänge?
diagnostics.namespace: namespace pod-security.kubernetes.io/enforce muss restricted entsprechen.
diagnostics.replicas: deployment/board replicas muss 1 entsprechen.
diagnostics.ready: deployment/board readyReplicas muss 1 entsprechen.
diagnostics.containers: deployment/board containers muss [worker] entsprechen.
diagnostics.hostpath: Das Deployment darf keine hostPath-Volumes verwenden.
diagnostics.nonroot: deployment/board runAsNonRoot muss true entsprechen.
diagnostics.uid: Explizite runAsUser-Werte in deployment/board müssen positiv sein.
diagnostics.seccomp: deployment/board seccompProfile.type muss RuntimeDefault entsprechen.
diagnostics.volume: deployment/board volume scratch muss emptyDir entsprechen.
diagnostics.mount: Der Worker muss scratch beschreibbar unter /tmp mounten.
diagnostics.mounts: Alle Container-Mounts außer scratch unter /tmp müssen schreibgeschützt sein.
diagnostics.root: deployment/board / mount muss ro entsprechen.
diagnostics.live_uid: 'deployment/board: id -u muss eine positive UID melden.'
diagnostics.tmp: Schreiben und Lesen einer Datei in /tmp muss gelingen.
diagnostics.http: board:8080 muss north-109 entsprechen.
diagnostics.host_hostnetwork: deployment/board hostNetwork darf nicht aktiviert sein.
diagnostics.host_hostpid: deployment/board hostPID darf nicht aktiviert sein.
diagnostics.host_hostipc: deployment/board hostIPC darf nicht aktiviert sein.
diagnostics.security_privileged: Kein Container darf privilegiert sein.
diagnostics.security_allowprivilegeescalation: container securityContext allowPrivilegeEscalation muss false
  entsprechen.
diagnostics.security_readonlyrootfilesystem: container securityContext readOnlyRootFilesystem muss true entsprechen.
diagnostics.security_drop: Jeder Container muss die Capability ALL entfernen.
diagnostics.security_add: container securityContext add muss [] entsprechen.
diagnostics.security_seccomp: Container seccompProfile.type muss RuntimeDefault sein oder fehlen.
