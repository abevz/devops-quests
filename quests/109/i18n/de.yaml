title: Security context und Pod Security
brief: 'Der Board-Endpunkt ist nicht verfügbar. Stellen Sie den isolierten Workload wieder her, ohne die Sicherheitsrichtlinie
  der Bay zu lockern.


  Arbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte Dateien: `board.yaml`, `service.yaml`.


  **Anforderungen:**

  - Der Bay-Namespace behält Pod-Security-Erzwingung `restricted`.

  - Deployment `board` hat genau einen Container `worker` und ein bereites Replikat.

  - Der Pod hat kein Host-Netzwerk, keinen Zugriff auf Host-Prozesse oder Host-IPC und keine Host-Dateisystem-Volumes.
  Alle regulären und Init-Container laufen ohne erhöhte Rechte, können keine Rechte erlangen, behalten oder
  ergänzen keine Linux-Capabilities und haben ein schreibgeschütztes Root-Dateisystem. Der Pod läuft ohne Root
  mit dem Standard-Systemaufruffilter; Container dürfen ihn nicht durch einen anderen Filter ersetzen. Nur
  der mitgelieferte temporäre Speicher im Pod unter `/tmp` ist beschreibbar; andere Mounts sind schreibgeschützt.

  - Von Deployment `board` liefert `http://board:8080` den Wert `north-109`.


  Die Prüfungen beobachten aktuelle Einstellungen, nicht den Verlauf von Namespace-Änderungen.

  '
debrief: Workload-Sicherheit, laufender Mount, UID, temporärer Speicher und Service-Antwort entsprachen den
  Prüfungen.
stages.0.brief: Der isolierte Board-Workload muss bereit und nutzbar sein.
hints.0.text: Zulassung und Laufzeitgesundheit sind getrennte Phasen der Workload-Wiederherstellung.
hints.1.text: 'Eine admission-Ablehnung erfolgt, bevor ein Container abstürzen oder Anwendungsprotokolle erstellen
  kann. Der bereitgestellte privilegierte Board-Container wird von restricted Pod Security abgelehnt; prüfen
  Sie ReplicaSet-Ereignisse.


  Non-root identity, Berechtigungskontrollen und read-only-Dateisysteme lösen verschiedene Probleme.


  Prüfen Sie die mitgelieferten Definitionen, aktuellen Ressourcen und Ereignisse.


  ```sh

  cat board.yaml

  kubectl describe replicasets

  kubectl get deployment board -o yaml

  kubectl get namespace "$DQ_NAMESPACE" -o yaml

  ```'
hints.2.text: 'Geben Sie die Berechtigungen auf, behalten Sie die root filesystem read-only und geben Sie der App nur ihre /tmp emptyDir.


  Prüfen Sie das beobachtete Ergebnis:


  ```sh

  kubectl get deployment board

  kubectl exec deployment/board -c worker -- sh -c ''id -u; cat /proc/mounts; test -w /tmp''

  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080

  ```


  Erwartet werden ein bereites Replikat, Laufzeit-UID 1000, ein schreibgeschützter Root-Mount, beschreibbares /tmp und die HTTP-Antwort north-109.


  Mitgelieferte Einschränkungen und Details: Der Pod `board` hat keinen Host-Zugriff, läuft ohne root mit UID `1000` und seccomp `RuntimeDefault`; alle Container verbieten Privilegienerhöhung, verwerfen `ALL` Capabilities, fügen keine hinzu und haben schreibgeschützte Root-Dateisysteme; nur Volume `scratch`, ein emptyDir unter `/tmp`, ist beschreibbar und nutzbar.


  Die Einschränkungen gelten für alle regulären und Init-Container: kein Host-Netz/PID/IPC oder hostPath, keine Rechteausweitung oder hinzugefügten Capabilities, ALL verwerfen; Container-seccomp fehlt oder ist RuntimeDefault, andere Mounts sind schreibgeschützt; zusätzliche sichere Felder und verworfene Capabilities sind zulässig.'
phrases.0: Ich habe vor dem Debuggen des Anwendungsstarts einen admission-Fehler diagnostiziert.
phrases.1: Ich habe den Workload non-root beibehalten und unnötige Berechtigungen entfernt.
phrases.2: Ich habe den read-only root-Speicher und begrenzte Scratch-Schreibvorgänge überprüft.
questions.0.points.0: NEIN; RBAC steuert API-Aktionen, während admission angeforderte Workload-Eigenschaften
  validiert.
questions.0.points.1: Ein Anrufer, der berechtigt ist, eine Deployment-Vorlage zu erstellen, kann dennoch eine
  abgelehnte Pod-Vorlage anfordern.
questions.0.prompt: Sind RBAC und Pod Security Admission austauschbar?
questions.1.points.0: Es schützt das Container-Image-Dateisystem, nicht jedes gemountete Volume.
questions.1.points.1: Geben Sie nur das explizite writable volumes an, das die Anwendung benötigt.
questions.1.prompt: Verbietet readOnlyRootFilesystem alle Schreibvorgänge?
stages.0.objectives.0.text: Der Bay-Namespace behält Pod-Security-Erzwingung `restricted`.
stages.0.objectives.1.text: Deployment `board` hat genau einen Container `worker` und ein bereites Replikat.
stages.0.objectives.2.text: Der Pod hat kein Host-Netzwerk, keinen Zugriff auf Host-Prozesse oder Host-IPC
  und keine Host-Dateisystem-Volumes. Alle regulären und Init-Container laufen ohne erhöhte Rechte, können
  keine Rechte erlangen, behalten oder ergänzen keine Linux-Capabilities und haben ein schreibgeschütztes Root-Dateisystem.
  Der Pod läuft ohne Root mit dem Standard-Systemaufruffilter; Container dürfen ihn nicht durch einen anderen
  Filter ersetzen. Nur der mitgelieferte temporäre Speicher im Pod unter `/tmp` ist beschreibbar; andere Mounts
  sind schreibgeschützt.
stages.0.objectives.3.text: Von Deployment `board` liefert `http://board:8080` den Wert `north-109`.
diagnostics.probe_0_2: Die Sicherheitsprüfung kann vor der Meldung einer Vorgabe abbrechen, wenn Python oder Eingaben fehlschlagen. Prüfen Sie Zugriff auf das Deployment und lokale Werkzeuge. [Ursache und Prüfung](guides#guide=workload-access&section=q109-security-observer-input)
diagnostics.host_hostnetwork: Beim Ändern der Arbeitslast wurde möglicherweise das Hostnetz aktiviert. Prüfen Sie hostNetwork und behalten Sie den Netzwerk-Namespace des Pods board. [Ursache und Prüfung](guides#guide=workload-access&section=q109-board-network-namespace)
diagnostics.host_hostpid: Die Pod-Vorlage verwendet möglicherweise den Prozess-Namespace des Hosts. Prüfen Sie hostPID und lassen Sie es deaktiviert. [Ursache und Prüfung](guides#guide=workload-access&section=q109-board-process-namespace)
diagnostics.host_hostipc: Die Pod-Vorlage teilt möglicherweise Host-IPC. Prüfen Sie hostIPC und behalten Sie den isolierten IPC-Namespace des Pods. [Ursache und Prüfung](guides#guide=workload-access&section=q109-board-ipc-namespace)
diagnostics.hostpath: Beim Ändern der Vorlage wurde möglicherweise ein hostPath-Volume hinzugefügt. Prüfen Sie die Volume-Quellen und entfernen Sie hostPath-Abhängigkeiten. [Ursache und Prüfung](guides#guide=workload-access&section=q109-board-volume-sources)
diagnostics.nonroot: Einem Container fehlt möglicherweise wirksames runAsNonRoot, oder er überschreibt es beziehungsweise setzt UID 0. Prüfen Sie Pod- und Containereinstellungen einschließlich Init-Containern. Explizite UIDs müssen positiv sein. [Ursache und Prüfung](guides#guide=workload-access&section=q109-board-user-policy)
diagnostics.seccomp: Der Standardfilter wurde möglicherweise entfernt oder überschrieben. Prüfen Sie wirksames RuntimeDefault für reguläre und Init-Container einschließlich der geerbten Pod-Einstellungen. [Ursache und Prüfung](guides#guide=workload-access&section=q109-board-syscall-filter)
diagnostics.security_privileged: 'Ein regulärer oder Init-Container läuft möglicherweise privilegiert. Prüfen Sie jeden securityContext und entfernen Sie privileged: true. [Ursache und Prüfung](guides#guide=workload-access&section=q109-board-privileged-mode)'
diagnostics.security_allowprivilegeescalation: Ein Container erlaubt möglicherweise Rechteausweitung, wenn das Flag fehlt oder aktiv ist. Setzen Sie allowPrivilegeEscalation für jeden regulären und Init-Container ausdrücklich auf false. [Ursache und Prüfung](guides#guide=workload-access&section=q109-board-privilege-escalation)
diagnostics.security_drop: Ein Container entfernt möglicherweise nicht mehr die Standard-Capabilities. Prüfen Sie ALL in der drop-Liste jedes regulären und Init-Containers. [Ursache und Prüfung](guides#guide=workload-access&section=q109-board-drop-capabilities)
diagnostics.security_add: Die Vorlage fügt möglicherweise zuvor entfernte Capabilities wieder hinzu. Prüfen Sie eine leere add-Liste für jeden regulären und Init-Container. [Ursache und Prüfung](guides#guide=workload-access&section=q109-board-no-added-capabilities)
diagnostics.namespace: Im Namespace fehlt möglicherweise das restricted-Label oder der Abruf schlägt fehl. Prüfen Sie das Label des Übungs-Namespace und behalten Sie restricted bei der Korrektur bei. [Ursache und Prüfung](guides#guide=workload-access&section=q109-restricted-namespace)
diagnostics.replicas: Das Deployment wurde möglicherweise skaliert oder fehlt. Prüfen Sie, ob board weiterhin eine Replik anfordert. [Ursache und Prüfung](guides#guide=workload-access&section=q109-board-replica-contract)
diagnostics.ready: Die Pod-Vorlage kann vorhanden sein, während Admission oder Rollout eine bereite Replik verhindern. Prüfen Sie Ereignisse und bestätigen Sie eine bereite Replik im Status von board. [Ursache und Prüfung](guides#guide=workload-access&section=q109-board-ready-replica)
diagnostics.containers: Der Worker wurde möglicherweise umbenannt, ein weiterer regulärer Container wurde ergänzt oder keiner ist vorhanden. Behalten Sie genau einen regulären Container namens worker. [Ursache und Prüfung](guides#guide=workload-access&section=q109-board-worker-identity)
diagnostics.uid: Ein explizites runAsUser ist möglicherweise 0 oder ungültig. Prüfen Sie alle expliziten Pod- und Container-UIDs einschließlich Init-Containern auf positive Ganzzahlen. [Ursache und Prüfung](guides#guide=workload-access&section=q109-board-explicit-user-ids)
diagnostics.security_readonlyrootfilesystem: Ein Container erlaubt möglicherweise weiterhin Schreibzugriffe auf sein Image-Dateisystem. Setzen Sie readOnlyRootFilesystem für alle regulären und Init-Container auf true und nutzen Sie für temporäre Daten das separate Volume. [Ursache und Prüfung](guides#guide=workload-access&section=q109-board-declared-readonly-root)
diagnostics.security_seccomp: Eine Seccomp-Überschreibung am Container kann RuntimeDefault ersetzen. Prüfen Sie reguläre und Init-Container und behalten Sie den geerbten oder expliziten Standard bei. [Ursache und Prüfung](guides#guide=workload-access&section=q109-board-container-seccomp-override)
diagnostics.volume: Der Mount /tmp fehlt möglicherweise oder verweist auf ein anderes Volume als emptyDir. Verfolgen Sie den benannten Mount vom Worker zur deklarierten temporären Volume-Quelle. [Ursache und Prüfung](guides#guide=workload-access&section=q109-board-temporary-volume-type)
diagnostics.mount: Der Worker bindet /tmp möglicherweise schreibgeschützt ein oder hat widersprüchliche Einträge. Prüfen Sie einen einzelnen beschreibbaren Mount aus dem temporären emptyDir. [Ursache und Prüfung](guides#guide=workload-access&section=q109-board-writable-temporary-mount)
diagnostics.mounts: Ein anderer Mount als das bereitgestellte /tmp erlaubt möglicherweise Schreibzugriffe. Prüfen Sie reguläre und Init-Container einschließlich von sich aus schreibgeschützter Projektionsquellen. [Ursache und Prüfung](guides#guide=workload-access&section=q109-board-other-mounts-readonly)
diagnostics.root: Das Deployment kann ein schreibgeschütztes Root-Dateisystem deklarieren, während der laufende Worker noch einen älteren Mount nutzt. Prüfen Sie die Optionen für / in /proc/mounts und bestätigen Sie ro nach dem Rollout. [Ursache und Prüfung](guides#guide=workload-access&section=q109-board-live-readonly-root)
diagnostics.live_uid: Der ausgewählte Worker läuft möglicherweise noch als root oder exec schlägt fehl. Lesen Sie die tatsächliche Prozess-UID und bestätigen Sie einen positiven Wert. [Ursache und Prüfung](guides#guide=workload-access&section=q109-board-live-worker-uid)
diagnostics.tmp: Der temporäre Mount ist möglicherweise schreibgeschützt oder Berechtigungen blockieren den Worker. Prüfen Sie einen echten Schreib- und Lesezugriff in /tmp aus dem laufenden Worker. [Ursache und Prüfung](guides#guide=workload-access&section=q109-board-live-tmp-reads-writes)
diagnostics.http: Die Sicherheitsvorgaben können stimmen, obwohl der Worker seinen Inhalt nicht schreiben kann oder dem Service ein bereiter Endpoint fehlt. Rufen Sie board nach dem Rollout auf und vergleichen Sie mit north-109. [Ursache und Prüfung](guides#guide=workload-access&section=q109-board-live-security-http)
