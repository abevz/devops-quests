title: Security context and Pod Security
brief: 'The bay enforces the restricted Pod Security standard. The Deployment asks for a privileged container,
  so its ReplicaSet cannot admit a Pod. Inspect the ReplicaSet events, then replace the container securityContext
  with privileged: false, allowPrivilegeEscalation: false, capabilities.drop: [ALL] and readOnlyRootFilesystem:
  true. Retain the supplied non-root UID 1000, RuntimeDefault seccomp and emptyDir mounted only at /tmp.
  The app needs scratch storage but no host access. Do not change namespace policy or add privileges.


  Quest files in `~/quest` (some appear in later stages): `board.json`, `service.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: The restricted Pod runs as UID 1000, its root filesystem rejects writes, /tmp
  remains writable and HTTP returns north-109 without namespace-policy changes.'
debrief: 'Admission policy and runtime checks agree: the app runs with the required restrictions and a
  narrow writable scratch area.'
