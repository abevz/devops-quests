title: Security context and Pod Security
brief: 'The board endpoint is unavailable. Restore the isolated workload without weakening the bay security
  policy.


  Work in `~/quest` on the workstation. Supplied files: `board.yaml`, `service.yaml`.


  **Requirements:**

  - The bay namespace keeps Pod Security enforcement `restricted`.

  - Deployment `board` has exactly one `worker` container and one ready replica.

  - The Pod has no host networking, host process or IPC access, or host filesystem volumes. Every regular and
  init container runs without elevated privileges, cannot gain privileges, has no retained or added Linux capabilities,
  and has a read-only root filesystem. The Pod runs as non-root with the default syscall filter; containers
  cannot override it with another filter. Only the supplied temporary storage inside the Pod at `/tmp` is writable;
  other mounts are read-only.

  - From Deployment `board`, `http://board:8080` returns `north-109`.


  Checks observe current settings, not the history of namespace changes.

  '
debrief: The workload security settings, live mount, UID, scratch behavior and service response matched the
  checks.
stages.0.brief: The isolated board workload must be ready and usable.
hints.0.text: Admission and runtime health are separate stages of workload recovery.
hints.1.text: 'An admission rejection happens before a container can crash or produce application logs. The
  supplied privileged board container is rejected by restricted Pod Security; inspect ReplicaSet events.


  Non-root identity, privilege controls and read-only filesystems solve different problems.


  Inspect the supplied definitions, current resources and events.


  ```sh

  cat board.yaml

  kubectl describe replicasets

  kubectl get deployment board -o yaml

  kubectl get namespace "$DQ_NAMESPACE" -o yaml

  ```'
hints.2.text: 'Drop privileges, keep the root filesystem read-only and give the app only its /tmp emptyDir.


  Verify the observed result:


  ```sh

  kubectl get deployment board

  kubectl exec deployment/board -c worker -- sh -c ''id -u; cat /proc/mounts; test -w /tmp''

  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080

  ```


  Expect one ready replica, live UID 1000, a read-only root mount, writable /tmp and HTTP response north-109.


  Supplied constraints and details: The `board` Pod has no host access, runs as non-root UID `1000` with seccomp `RuntimeDefault`, and all containers forbid privilege escalation, drop `ALL` capabilities, add none and have read-only root filesystems; only volume `scratch`, an emptyDir at `/tmp`, is writable and usable.


  These restrictions cover all regular and init containers: no host network/PID/IPC or hostPath, no privilege escalation or added capabilities, drop ALL; container seccomp is absent or RuntimeDefault, other mounts are read-only, and additional safe fields and dropped capabilities are accepted.'
phrases.0: I diagnosed an admission failure before debugging application startup.
phrases.1: I kept the workload non-root and removed unnecessary privileges.
phrases.2: I verified read-only root storage and scoped scratch writes.
questions.0.points.0: No; RBAC controls API actions, while admission validates requested workload properties.
questions.0.points.1: A caller allowed to create a Deployment can still request a rejected Pod template.
questions.0.prompt: Are RBAC and Pod Security Admission interchangeable?
questions.1.points.0: It protects the container image filesystem, not every mounted volume.
questions.1.points.1: Provide only the explicit writable volumes the application needs.
questions.1.prompt: Does readOnlyRootFilesystem prohibit all writes?
stages.0.objectives.0.text: The bay namespace keeps Pod Security enforcement `restricted`.
stages.0.objectives.1.text: Deployment `board` has exactly one `worker` container and one ready replica.
stages.0.objectives.2.text: The Pod has no host networking, host process or IPC access, or host filesystem
  volumes. Every regular and init container runs without elevated privileges, cannot gain privileges, has no
  retained or added Linux capabilities, and has a read-only root filesystem. The Pod runs as non-root with
  the default syscall filter; containers cannot override it with another filter. Only the supplied temporary
  storage inside the Pod at `/tmp` is writable; other mounts are read-only.
stages.0.objectives.3.text: From Deployment `board`, `http://board:8080` returns `north-109`.
diagnostics.probe_0_2: The security observer can stop before reporting a control if its Python process or workspace input fails. Confirm that the live Deployment is readable and the local tools can start. [Cause and check](guides#guide=workload-access&section=q109-security-observer-input)
diagnostics.host_hostnetwork: A workload repair may have enabled host networking. Inspect hostNetwork and keep board in its Pod network namespace. [Cause and check](guides#guide=workload-access&section=q109-board-network-namespace)
diagnostics.host_hostpid: The Pod template may have been changed to share the host process namespace. Inspect hostPID and keep it disabled. [Cause and check](guides#guide=workload-access&section=q109-board-process-namespace)
diagnostics.host_hostipc: The Pod template may have been changed to share host IPC. Inspect hostIPC and keep the Pod IPC namespace isolated. [Cause and check](guides#guide=workload-access&section=q109-board-ipc-namespace)
diagnostics.hostpath: A hostPath volume may have been added while changing the template. Inspect the declared sources and remove any hostPath dependency. [Cause and check](guides#guide=workload-access&section=q109-board-volume-sources)
diagnostics.nonroot: A container may lack effective runAsNonRoot, override it, or specify UID 0. Inspect both Pod and container settings, including init containers, and keep all explicit user IDs positive. [Cause and check](guides#guide=workload-access&section=q109-board-user-policy)
diagnostics.seccomp: The default syscall filter may have been removed or overridden. Check the effective RuntimeDefault profile on regular and init containers, including inherited Pod settings. [Cause and check](guides#guide=workload-access&section=q109-board-syscall-filter)
diagnostics.security_privileged: A regular or init container may have gained privileged mode. Inspect each container’s securityContext and remove the privileged override. [Cause and check](guides#guide=workload-access&section=q109-board-privileged-mode)
diagnostics.security_allowprivilegeescalation: A container may allow privilege escalation because its flag is absent or enabled. Set allowPrivilegeEscalation explicitly to false on each regular and init container. [Cause and check](guides#guide=workload-access&section=q109-board-privilege-escalation)
diagnostics.security_drop: A container may no longer drop the default capability set. Check that the drop list contains ALL on each regular and init container. [Cause and check](guides#guide=workload-access&section=q109-board-drop-capabilities)
diagnostics.security_add: The template may add capabilities back after dropping them. Check the add list of every regular and init container and keep it empty. [Cause and check](guides#guide=workload-access&section=q109-board-no-added-capabilities)
diagnostics.namespace: The namespace may lack the restricted enforcement label or the namespace read may fail. Check the current bay label and retain restricted enforcement while fixing the workload. [Cause and check](guides#guide=workload-access&section=q109-restricted-namespace)
diagnostics.replicas: The Deployment may have been scaled during repair or may be missing. Check that board still requests one replica. [Cause and check](guides#guide=workload-access&section=q109-board-replica-contract)
diagnostics.ready: The pod template can exist while admission or rollout prevents a ready replica. Check the events and confirm one ready replica in the live board status. [Cause and check](guides#guide=workload-access&section=q109-board-ready-replica)
diagnostics.containers: The workload may contain a renamed worker, an extra regular container or no regular container. Keep exactly one regular container named worker. [Cause and check](guides#guide=workload-access&section=q109-board-worker-identity)
diagnostics.uid: An explicit runAsUser may be zero or otherwise invalid. Check all explicit Pod and container user IDs and keep them positive integers, including on init containers. [Cause and check](guides#guide=workload-access&section=q109-board-explicit-user-ids)
diagnostics.security_readonlyrootfilesystem: One container may still allow writes to its image filesystem. Set readOnlyRootFilesystem to true for each regular and init container, and keep temporary writes on the separate volume. [Cause and check](guides#guide=workload-access&section=q109-board-declared-readonly-root)
diagnostics.security_seccomp: A container-level seccomp override may replace the supplied RuntimeDefault filter. Check overrides on every regular and init container and retain the inherited default or its explicit equivalent. [Cause and check](guides#guide=workload-access&section=q109-board-container-seccomp-override)
diagnostics.volume: The /tmp mount may be missing or refer to a volume other than emptyDir. Follow the named mount from worker to the declared temporary volume source. [Cause and check](guides#guide=workload-access&section=q109-board-temporary-volume-type)
diagnostics.mount: The named worker may mount /tmp read-only or have conflicting entries. Check that it has a single writable mount backed by the temporary emptyDir. [Cause and check](guides#guide=workload-access&section=q109-board-writable-temporary-mount)
diagnostics.mounts: A mount other than the supplied /tmp scratch mount may permit writes. Inspect all regular and init container mounts, including inherently read-only projected sources. [Cause and check](guides#guide=workload-access&section=q109-board-other-mounts-readonly)
diagnostics.root: The Deployment may declare a read-only root while the selected running worker still has an older filesystem mount. Inspect the options for / in /proc/mounts and verify ro after rollout. [Cause and check](guides#guide=workload-access&section=q109-board-live-readonly-root)
diagnostics.live_uid: The selected worker may still run as root or the exec may fail. Read the actual process user ID and confirm it is a positive number. [Cause and check](guides#guide=workload-access&section=q109-board-live-worker-uid)
diagnostics.tmp: The temporary mount may be read-only or have permissions that block the worker. Verify an actual write and read in /tmp from the running worker. [Cause and check](guides#guide=workload-access&section=q109-board-live-tmp-reads-writes)
diagnostics.http: Security settings may now be correct while worker cannot write its served content or the Service lacks a ready endpoint. Query board after rollout and compare with north-109. [Cause and check](guides#guide=workload-access&section=q109-board-live-security-http)
