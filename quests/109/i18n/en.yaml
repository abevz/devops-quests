title: Security context and Pod Security
brief: "The board endpoint is unavailable. Restore the isolated workload without weakening the bay security policy.\n\
  \nWork in `~/quest` on the workstation. Supplied files: `board.json`, `service.json`.\n\n**Requirements:**\n\n\
  - The bay namespace keeps Pod Security enforcement `restricted`.\n- Deployment `board` has exactly one `worker`\
  \ container and one ready replica.\n- The `board` Pod has no host access, runs as non-root UID `1000` with seccomp\
  \ `RuntimeDefault`, and all containers forbid privilege escalation, drop `ALL` capabilities, add none and have\
  \ read-only root filesystems; only volume `scratch`, an emptyDir at `/tmp`, is writable and usable.\n  - No host\
  \ networking, host PID/IPC or hostPath; all regular and init containers are non-privileged, cannot escalate, and\
  \ use absent or `RuntimeDefault` container seccomp. Other mounts are read-only; extra dropped capabilities and\
  \ equivalent safe security fields are accepted.\n- From Deployment `board`, `http://board:8080` returns `north-109`.\n\
  \n**Verify yourself before Check & finish:** Run these observation commands from `~/quest` on the workstation.\n\
  \n- Settings, identity and status match Requirements.\n\n  ```sh\n  kubectl get namespace \"$DQ_NAMESPACE\" -o\
  \ yaml\n  kubectl get deployment board -o yaml\n  ```\n\n- `kubectl exec deployment/board -- sh -c 'id -u; cat\
  \ /proc/mounts; test -w /tmp'` — The live UID is `1000`, the root mount is read-only, and `/tmp` is writable inside\
  \ `worker`.\n\n- `kubectl exec deployment/board -- wget -qO- -T 3 http://board:8080` — The board consumer receives\
  \ `north-109`.\n\nChecks observe current settings, not the history of namespace changes."
debrief: The workload security settings, live mount, UID, scratch behavior and service response matched the checks.
stages.0.brief: The isolated board workload must be ready and usable.
hints.0.text: An admission rejection happens before a container can crash or produce application logs. The supplied
  privileged board container is rejected by restricted Pod Security; inspect ReplicaSet events.
hints.1.text: Non-root identity, privilege controls and read-only filesystems solve different problems.
hints.2.text: Drop privileges, keep the root filesystem read-only and give the app only its /tmp emptyDir.
phrases.0: I diagnosed an admission failure before debugging application startup.
phrases.1: I kept the workload non-root and removed unnecessary privileges.
phrases.2: I verified read-only root storage and scoped scratch writes.
questions.0.points.0: No; RBAC controls API actions, while admission validates requested workload properties.
questions.0.points.1: A caller allowed to create a Deployment can still request a rejected Pod template.
questions.0.prompt: Are RBAC and Pod Security Admission interchangeable?
questions.1.points.0: It protects the container image filesystem, not every mounted volume.
questions.1.points.1: Provide only the explicit writable volumes the application needs.
questions.1.prompt: Does readOnlyRootFilesystem prohibit all writes?
diagnostics.namespace: namespace pod-security.kubernetes.io/enforce must equal restricted.
diagnostics.replicas: deployment/board replicas must equal 1.
diagnostics.ready: deployment/board readyReplicas must equal 1.
diagnostics.containers: deployment/board containers must equal [worker].
diagnostics.hostpath: The Deployment must not use hostPath volumes.
diagnostics.nonroot: deployment/board runAsNonRoot must equal true.
diagnostics.uid: deployment/board runAsUser must equal 1000.
diagnostics.seccomp: deployment/board seccompProfile.type must equal RuntimeDefault.
diagnostics.volume: deployment/board volume scratch must equal emptyDir.
diagnostics.mount: The worker must mount scratch at /tmp writable.
diagnostics.mounts: All container mounts other than scratch at /tmp must be read-only.
diagnostics.root: deployment/board / mount must equal ro.
diagnostics.live_uid: deployment/board id -u must equal 1000.
diagnostics.tmp: Writing and reading a file in /tmp must succeed.
diagnostics.http: board:8080 must equal north-109.
diagnostics.host_hostnetwork: deployment/board hostNetwork must not be enabled.
diagnostics.host_hostpid: deployment/board hostPID must not be enabled.
diagnostics.host_hostipc: deployment/board hostIPC must not be enabled.
diagnostics.security_privileged: No container may be privileged.
diagnostics.security_allowprivilegeescalation: container securityContext allowPrivilegeEscalation must equal false.
diagnostics.security_readonlyrootfilesystem: container securityContext readOnlyRootFilesystem must equal true.
diagnostics.security_drop: Every container must drop capability ALL.
diagnostics.security_add: container securityContext add must equal [].
diagnostics.security_seccomp: Container seccompProfile.type must be RuntimeDefault or absent.
stages.0.objectives.0.text: The bay namespace keeps Pod Security enforcement `restricted`.
stages.0.objectives.1.text: Deployment `board` has exactly one `worker` container and one ready replica.
stages.0.objectives.2.text: The `board` Pod has no host access, runs as non-root UID `1000` with seccomp `RuntimeDefault`,
  and all containers forbid privilege escalation, drop `ALL` capabilities, add none and have read-only root filesystems;
  only volume `scratch`, an emptyDir at `/tmp`, is writable and usable.
stages.0.objectives.3.text: From Deployment `board`, `http://board:8080` returns `north-109`.
