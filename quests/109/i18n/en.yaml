title: Security context and Pod Security
brief: 'The board endpoint is unavailable. Restore the isolated workload without weakening the bay security
  policy.


  Work in `~/quest` on the workstation. Supplied files: `board.yaml`, `service.yaml`.


  **Requirements:**

  - The bay namespace keeps Pod Security enforcement `restricted`.

  - Deployment `board` has exactly one `worker` container and one ready replica.

  - The Pod has no host networking, host process or IPC access, or host filesystem volumes. Every regular and
  init container runs without elevated privileges, cannot gain privileges, has no retained or added Linux capabilities,
  and has a read-only root filesystem. The Pod runs as non-root with the default syscall filter; containers
  cannot override it with another filter. Only the supplied temporary storage inside the Pod at `/tmp` is writable;
  other mounts are read-only.

  - From Deployment `board`, `http://board:8080` returns `north-109`.


  Checks observe current settings, not the history of namespace changes.

  '
debrief: The workload security settings, live mount, UID, scratch behavior and service response matched the
  checks.
stages.0.brief: The isolated board workload must be ready and usable.
hints.0.text: Admission and runtime health are separate stages of workload recovery.
hints.1.text: 'An admission rejection happens before a container can crash or produce application logs. The
  supplied privileged board container is rejected by restricted Pod Security; inspect ReplicaSet events.


  Non-root identity, privilege controls and read-only filesystems solve different problems.


  Inspect the supplied definitions, current resources and events.


  ```sh

  cat board.yaml

  kubectl describe replicasets

  kubectl get deployment board -o yaml

  kubectl get namespace "$DQ_NAMESPACE" -o yaml

  ```'
hints.2.text: 'Drop privileges, keep the root filesystem read-only and give the app only its /tmp emptyDir.


  Verify the observed result:


  ```sh

  kubectl get deployment board

  kubectl exec deployment/board -c worker -- sh -c ''id -u; cat /proc/mounts; test -w /tmp''

  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080

  ```


  Expect one ready replica, live UID 1000, a read-only root mount, writable /tmp and HTTP response north-109.


  Supplied constraints and details: The `board` Pod has no host access, runs as non-root UID `1000` with seccomp `RuntimeDefault`, and all containers forbid privilege escalation, drop `ALL` capabilities, add none and have read-only root filesystems; only volume `scratch`, an emptyDir at `/tmp`, is writable and usable.


  These restrictions cover all regular and init containers: no host network/PID/IPC or hostPath, no privilege escalation or added capabilities, drop ALL; container seccomp is absent or RuntimeDefault, other mounts are read-only, and additional safe fields and dropped capabilities are accepted.'
phrases.0: I diagnosed an admission failure before debugging application startup.
phrases.1: I kept the workload non-root and removed unnecessary privileges.
phrases.2: I verified read-only root storage and scoped scratch writes.
questions.0.points.0: No; RBAC controls API actions, while admission validates requested workload properties.
questions.0.points.1: A caller allowed to create a Deployment can still request a rejected Pod template.
questions.0.prompt: Are RBAC and Pod Security Admission interchangeable?
questions.1.points.0: It protects the container image filesystem, not every mounted volume.
questions.1.points.1: Provide only the explicit writable volumes the application needs.
questions.1.prompt: Does readOnlyRootFilesystem prohibit all writes?
diagnostics.namespace: namespace pod-security.kubernetes.io/enforce must equal restricted.
diagnostics.replicas: deployment/board replicas must equal 1.
diagnostics.ready: deployment/board readyReplicas must equal 1.
diagnostics.containers: deployment/board containers must equal [worker].
diagnostics.hostpath: The Deployment must not use hostPath volumes.
diagnostics.nonroot: deployment/board runAsNonRoot must equal true.
diagnostics.uid: deployment/board explicit runAsUser values must be positive.
diagnostics.seccomp: deployment/board seccompProfile.type must equal RuntimeDefault.
diagnostics.volume: deployment/board volume scratch must equal emptyDir.
diagnostics.mount: The worker must mount scratch at /tmp writable.
diagnostics.mounts: All container mounts other than scratch at /tmp must be read-only.
diagnostics.root: deployment/board / mount must equal ro.
diagnostics.live_uid: deployment/board id -u must report a positive UID.
diagnostics.tmp: Writing and reading a file in /tmp must succeed.
diagnostics.http: board:8080 must equal north-109.
diagnostics.host_hostnetwork: deployment/board hostNetwork must not be enabled.
diagnostics.host_hostpid: deployment/board hostPID must not be enabled.
diagnostics.host_hostipc: deployment/board hostIPC must not be enabled.
diagnostics.security_privileged: No container may be privileged.
diagnostics.security_allowprivilegeescalation: container securityContext allowPrivilegeEscalation must equal
  false.
diagnostics.security_readonlyrootfilesystem: container securityContext readOnlyRootFilesystem must equal true.
diagnostics.security_drop: Every container must drop capability ALL.
diagnostics.security_add: container securityContext add must equal [].
diagnostics.security_seccomp: Container seccompProfile.type must be RuntimeDefault or absent.
stages.0.objectives.0.text: The bay namespace keeps Pod Security enforcement `restricted`.
stages.0.objectives.1.text: Deployment `board` has exactly one `worker` container and one ready replica.
stages.0.objectives.2.text: The Pod has no host networking, host process or IPC access, or host filesystem
  volumes. Every regular and init container runs without elevated privileges, cannot gain privileges, has no
  retained or added Linux capabilities, and has a read-only root filesystem. The Pod runs as non-root with
  the default syscall filter; containers cannot override it with another filter. Only the supplied temporary
  storage inside the Pod at `/tmp` is writable; other mounts are read-only.
stages.0.objectives.3.text: From Deployment `board`, `http://board:8080` returns `north-109`.
