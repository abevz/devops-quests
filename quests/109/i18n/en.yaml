title: Security context and Pod Security
brief: 'Work in `~/quest`; read `board.json` and `service.json`. The private namespace enforces restricted Pod Security, and the privileged `board` container cannot start. Inspect the ReplicaSet events and repair the existing Deployment. A security context configures the requested process identity, privilege and filesystem settings; `emptyDir` provides scratch space.


  Keep one `worker` container and one replica. At Pod level set `runAsNonRoot: true`, `runAsUser: 1000` and `seccompProfile.type: RuntimeDefault`; do not use host networking, host PID, host IPC or hostPath. For every container and init container, disable privilege and escalation, set a read-only root filesystem, drop `ALL` capabilities and add none; container seccomp may be absent or `RuntimeDefault`. Extra dropped capabilities or equivalent safe security fields are accepted. Keep a `scratch` emptyDir mounted writable at `/tmp`; any other mounts must be read-only.


  Verify one ready replica, the live root mount has the `ro` flag, `id -u` returns 1000, writing and reading under `/tmp` works, and `board:8080` returns `north-109`. Keep the namespace label `pod-security.kubernetes.io/enforce` set to `restricted`. The checks observe current settings but do not prove the history of namespace changes. Use only the offline bay.'
debrief: The workload security settings, live mount, UID, scratch behavior and service response matched the checks.
stages.0.brief: The Deployment security settings and mounts, live root and /tmp behavior, UID, ready replica and board response match the brief.
stages.0.objectives.0.text: The Deployment security settings and mounts, live root and /tmp behavior, UID, ready replica and board response match the brief.
hints.0.text: An admission rejection happens before a container can crash or produce
  application logs.
hints.1.text: Non-root identity, privilege controls and read-only filesystems solve
  different problems.
hints.2.text: Drop privileges, keep the root filesystem read-only and give the app
  only its /tmp emptyDir.
phrases.0: I diagnosed an admission failure before debugging application startup.
phrases.1: I kept the workload non-root and removed unnecessary privileges.
phrases.2: I verified read-only root storage and scoped scratch writes.
questions.0.points.0: No; RBAC controls API actions, while admission validates requested
  workload properties.
questions.0.points.1: A caller allowed to create a Deployment can still request a
  rejected Pod template.
questions.0.prompt: Are RBAC and Pod Security Admission interchangeable?
questions.1.points.0: It protects the container image filesystem, not every mounted
  volume.
questions.1.points.1: Provide only the explicit writable volumes the application needs.
questions.1.prompt: Does readOnlyRootFilesystem prohibit all writes?
