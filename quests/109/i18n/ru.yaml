title: Security context и Pod Security
brief: 'Конечная точка board недоступна. Восстановите изолированную нагрузку без ослабления политики безопасности
  песочницы.


  Работайте в `~/quest` на рабочей станции. Предоставлены файлы: `board.yaml`, `service.yaml`.


  **Требования:**

  - Пространство имён песочницы сохраняет контроль Pod Security `restricted`.

  - Deployment `board` имеет ровно один контейнер `worker` и одну готовую реплику.

  - У Pod нет сети хоста, доступа к процессам и IPC хоста или томов файловой системы хоста. Все обычные и init-контейнеры
  работают без повышенных привилегий, не могут их получить, не сохраняют и не добавляют Linux capabilities
  и имеют корневую файловую систему только для чтения. Pod работает не от root с фильтром системных вызовов
  по умолчанию; контейнеры не могут заменить его другим фильтром. Запись разрешена только в поставленное временное
  хранилище внутри Pod по пути `/tmp`; остальные mounts доступны только для чтения.

  - Из Deployment `board` адрес `http://board:8080` возвращает `north-109`.


  Проверки наблюдают текущие настройки, а не историю изменений пространства имён.

  '
debrief: Настройки безопасности workload, работающее монтирование, UID, временное пространство и ответ сервиса
  соответствовали проверкам.
stages.0.brief: Изолированная нагрузка board должна быть готова и работоспособна.
hints.0.text: Допуск нагрузки и её работоспособность — разные этапы восстановления.
hints.1.text: |-
  Отказ admission происходит до запуска контейнера и появления логов приложения. Предоставленный привилегированный контейнер board отклонён restricted Pod Security; изучите события ReplicaSet.

  Non-root identity, запрет привилегий и read-only filesystem решают разные задачи.

  Изучите поставленные определения, текущие ресурсы и события.

  Уберите привилегии, сохраните root filesystem read-only и выдайте приложению только emptyDir в /tmp.

  ```sh
  cat board.yaml
  kubectl describe replicasets
  kubectl get deployment board -o yaml
  kubectl get namespace "$DQ_NAMESPACE" -o yaml
  ```
hints.2.text: |-
  Проверьте наблюдаемый результат:

  ```sh
  kubectl get deployment board
  kubectl exec deployment/board -c worker -- sh -c 'id -u; cat /proc/mounts; test -w /tmp'
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080
  ```

  Ожидаются одна готовая реплика, runtime UID 1000, корневой mount только для чтения, доступный для записи /tmp и HTTP-ответ north-109.

  Поставленные ограничения и подробности: Pod `board` не имеет доступа к хосту, работает без root с UID `1000` и seccomp `RuntimeDefault`; все контейнеры запрещают повышение привилегий, сбрасывают `ALL` capabilities, не добавляют новых и имеют корневую ФС только для чтения; запись работает только в томе `scratch`, emptyDir в `/tmp`.

  Ограничения охватывают все обычные и init-контейнеры: без host network/PID/IPC и hostPath, без повышения привилегий и добавленных capabilities, сброс ALL; seccomp контейнера отсутствует или RuntimeDefault, остальные mounts только для чтения; дополнительные безопасные поля и сбрасываемые capabilities допускаются.
phrases.0: Я определил отказ admission до отладки запуска приложения.
phrases.1: Я сохранил non-root и убрал ненужные привилегии.
phrases.2: Я проверил read-only root и ограниченную запись во временный каталог.
questions.0.points.0: 'Нет: RBAC управляет действиями API, admission проверяет свойства запрашиваемой нагрузки.'
questions.0.points.1: Право создать Deployment не гарантирует допустимость его шаблона Pod.
questions.0.prompt: Заменяют ли RBAC и Pod Security Admission друг друга?
questions.1.points.0: Он защищает файловую систему образа, но не все подключённые volumes.
questions.1.points.1: Выдавайте только явно необходимые writable volumes.
questions.1.prompt: Запрещает ли readOnlyRootFilesystem любую запись?
stages.0.objectives.0.text: Пространство имён песочницы сохраняет контроль Pod Security `restricted`.
stages.0.objectives.1.text: Deployment `board` имеет ровно один контейнер `worker` и одну готовую реплику.
stages.0.objectives.2.text: У Pod нет сети хоста, доступа к процессам и IPC хоста или томов файловой системы
  хоста. Все обычные и init-контейнеры работают без повышенных привилегий, не могут их получить, не сохраняют
  и не добавляют Linux capabilities и имеют корневую файловую систему только для чтения. Pod работает не от
  root с фильтром системных вызовов по умолчанию; контейнеры не могут заменить его другим фильтром. Запись
  разрешена только в поставленное временное хранилище внутри Pod по пути `/tmp`; остальные mounts доступны
  только для чтения.
stages.0.objectives.3.text: Из Deployment `board` адрес `http://board:8080` возвращает `north-109`.
diagnostics.probe_0_2: Проверка ограничений может завершиться до указания условия при ошибке Python или входных данных. Проверьте доступ к Deployment и запуск инструментов. [Причина и проверка](guides#guide=workload-access&section=q109-security-observer-input)
diagnostics.host_hostnetwork: При правке шаблона могла включиться сеть хоста. Проверьте hostNetwork и сохраните отдельное сетевое пространство Pod. [Причина и проверка](guides#guide=workload-access&section=q109-board-network-namespace)
diagnostics.host_hostpid: Шаблон Pod мог начать использовать пространство процессов хоста. Проверьте hostPID и оставьте его выключенным. [Причина и проверка](guides#guide=workload-access&section=q109-board-process-namespace)
diagnostics.host_hostipc: Шаблон Pod мог начать использовать IPC хоста. Проверьте hostIPC и сохраните отдельное пространство IPC. [Причина и проверка](guides#guide=workload-access&section=q109-board-ipc-namespace)
diagnostics.hostpath: При правке шаблона могли добавить том hostPath. Проверьте источники томов и уберите зависимость от hostPath. [Причина и проверка](guides#guide=workload-access&section=q109-board-volume-sources)
diagnostics.nonroot: У контейнера могло исчезнуть действующее runAsNonRoot, появиться переопределение или UID 0. Проверьте настройки Pod, обычных и init-контейнеров. Явно заданные UID должны быть положительными. [Причина и проверка](guides#guide=workload-access&section=q109-board-user-policy)
diagnostics.seccomp: Фильтр системных вызовов мог исчезнуть или быть переопределён. Проверьте, что обычные и init-контейнеры используют RuntimeDefault с учётом настроек Pod. [Причина и проверка](guides#guide=workload-access&section=q109-board-syscall-filter)
diagnostics.security_privileged: 'Обычному или init-контейнеру могли включить привилегированный режим. Проверьте securityContext каждого контейнера и уберите privileged: true. [Причина и проверка](guides#guide=workload-access&section=q109-board-privileged-mode)'
diagnostics.security_allowprivilegeescalation: 'Контейнер может допускать повышение привилегий, если флаг отсутствует или включён. Задайте allowPrivilegeEscalation: false каждому обычному и init-контейнеру. [Причина и проверка](guides#guide=workload-access&section=q109-board-privilege-escalation)'
diagnostics.security_drop: Контейнер мог перестать сбрасывать стандартный набор capabilities. Проверьте ALL в списке drop каждого обычного и init-контейнера. [Причина и проверка](guides#guide=workload-access&section=q109-board-drop-capabilities)
diagnostics.security_add: Шаблон мог снова добавить capabilities после сброса. Проверьте, что список add каждого обычного и init-контейнера пуст. [Причина и проверка](guides#guide=workload-access&section=q109-board-no-added-capabilities)
diagnostics.namespace: У пространства имён могла отсутствовать метка restricted, либо чтение не сработало. Проверьте метку стенда и сохраните режим restricted при правке нагрузки. [Причина и проверка](guides#guide=workload-access&section=q109-restricted-namespace)
diagnostics.replicas: Deployment могли масштабировать во время ремонта, либо он отсутствует. Проверьте, что board по-прежнему запрашивает одну реплику. [Причина и проверка](guides#guide=workload-access&section=q109-board-replica-contract)
diagnostics.ready: Шаблон Pod может существовать, пока admission или rollout мешают готовности. Проверьте события и подтвердите одну готовую реплику в статусе board. [Причина и проверка](guides#guide=workload-access&section=q109-board-ready-replica)
diagnostics.containers: В нагрузке мог измениться worker, появиться лишний обычный контейнер или исчезнуть основная секция. Оставьте ровно один обычный контейнер worker. [Причина и проверка](guides#guide=workload-access&section=q109-board-worker-identity)
diagnostics.uid: Явный runAsUser мог стать нулевым или некорректным. Проверьте целые положительные UID в настройках Pod, обычных и init-контейнеров. [Причина и проверка](guides#guide=workload-access&section=q109-board-explicit-user-ids)
diagnostics.security_readonlyrootfilesystem: 'Один из контейнеров мог по-прежнему разрешать запись в корень образа. Задайте readOnlyRootFilesystem: true обычным и init-контейнерам, а временные записи оставьте на отдельном томе. [Причина и проверка](guides#guide=workload-access&section=q109-board-declared-readonly-root)'
diagnostics.security_seccomp: Переопределение seccomp у контейнера могло заменить RuntimeDefault. Проверьте обычные и init-контейнеры и сохраните наследуемый RuntimeDefault или явно укажите его. [Причина и проверка](guides#guide=workload-access&section=q109-board-container-seccomp-override)
diagnostics.volume: Монтирование /tmp могло исчезнуть или указывать на том другого типа. Проследите имя тома от worker до объявленного источника emptyDir. [Причина и проверка](guides#guide=workload-access&section=q109-board-temporary-volume-type)
diagnostics.mount: У worker /tmp мог быть смонтирован только для чтения либо указан несколько раз. Проверьте единственное доступное на запись монтирование из временного emptyDir. [Причина и проверка](guides#guide=workload-access&section=q109-board-writable-temporary-mount)
diagnostics.mounts: Дополнительное монтирование могло разрешить запись помимо выданного /tmp. Проверьте монтирования обычных и init-контейнеров, включая источники, доступные только на чтение. [Причина и проверка](guides#guide=workload-access&section=q109-board-other-mounts-readonly)
diagnostics.root: В Deployment корень мог быть доступен только для чтения, пока запущенный worker использует старое монтирование. Проверьте параметры / в /proc/mounts и убедитесь, что после rollout есть ro. [Причина и проверка](guides#guide=workload-access&section=q109-board-live-readonly-root)
diagnostics.live_uid: Выбранный worker мог работать от root, либо exec завершился ошибкой. Прочитайте UID процесса и убедитесь, что он больше нуля. [Причина и проверка](guides#guide=workload-access&section=q109-board-live-worker-uid)
diagnostics.tmp: Временный том мог быть доступен только на чтение или его права мешают worker. Проверьте запись и чтение в /tmp из работающего worker. [Причина и проверка](guides#guide=workload-access&section=q109-board-live-tmp-reads-writes)
diagnostics.http: Настройки безопасности могут быть верными, пока worker не может записать содержимое или у Service нет готового endpoint. Запросите board после rollout и сравните с north-109. [Причина и проверка](guides#guide=workload-access&section=q109-board-live-security-http)
