title: Security context и Pod Security
brief: 'Песочница применяет стандарт Pod Security restricted. Deployment просит privileged container,
  поэтому ReplicaSet не может создать Pod. Изучите события ReplicaSet, затем задайте container securityContext:
  privileged: false, allowPrivilegeEscalation: false, capabilities.drop: [ALL], readOnlyRootFilesystem:
  true. Сохраните non-root UID 1000, seccomp RuntimeDefault и emptyDir только в /tmp. Приложению нужно
  временное хранилище, но не host access. Не меняйте policy namespace и не добавляйте привилегии.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `board.json`, `service.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Restricted Pod работает как UID 1000, root filesystem запрещает запись, /tmp остаётся
  доступным, HTTP отдаёт north-109 без изменения policy namespace.'
debrief: 'Admission policy и runtime-проверки согласованы: приложение работает с ограничениями и узкой
  writable scratch area.'
