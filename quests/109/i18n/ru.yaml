title: Security context и Pod Security
brief: 'Работайте в `~/quest`; изучите `board.json` и `service.json`. Приватное пространство имён применяет ограниченный стандарт
  Pod Security, и привилегированный контейнер `board` не может запуститься. Изучите события ReplicaSet и исправьте существующий
  Deployment. Контекст безопасности задаёт запрошенные идентичность процесса, привилегии и параметры файловой системы; `emptyDir`
  предоставляет временное пространство.


  Сохраните один контейнер `worker` и одну реплику. На уровне Pod задайте `runAsNonRoot: true`, `runAsUser: 1000` и `seccompProfile.type:
  RuntimeDefault`; не используйте сеть хоста, host PID, host IPC или hostPath. Для каждого контейнера и init container отключите
  привилегии и повышение привилегий, сделайте корневую файловую систему доступной только для чтения, удалите возможности `ALL`
  и не добавляйте их; seccomp контейнера может отсутствовать или быть `RuntimeDefault`. Дополнительное удаление возможностей
  и равнозначные безопасные поля допускаются. Сохраните `scratch` emptyDir, смонтированный с записью в `/tmp`; остальные монтирования
  должны быть только для чтения.


  Проверьте одну готовую реплику, флаг `ro` работающего корневого монтирования, результат 1000 команды `id -u`, запись и чтение
  в `/tmp`, а также ответ `north-109` от `board:8080`. Сохраните метку пространства имён `pod-security.kubernetes.io/enforce`
  со значением `restricted`. Проверки наблюдают текущие настройки, но не доказывают историю изменений пространства имён. Используйте
  только офлайн-песочницу.'
debrief: Настройки безопасности workload, работающее монтирование, UID, временное пространство и ответ сервиса соответствовали
  проверкам.
stages.0.brief: Настройки безопасности и монтирования Deployment, поведение корня и /tmp, UID, готовая реплика и ответ board
  соответствуют заданию.
stages.0.objectives.0.text: Настройки безопасности и монтирования Deployment, поведение корня и /tmp, UID, готовая реплика
  и ответ board соответствуют заданию.
hints.0.text: Отказ admission происходит до запуска контейнера и появления логов приложения.
hints.1.text: Non-root identity, запрет привилегий и read-only filesystem решают разные задачи.
hints.2.text: Уберите привилегии, сохраните root filesystem read-only и выдайте приложению только emptyDir в /tmp.
phrases.0: Я определил отказ admission до отладки запуска приложения.
phrases.1: Я сохранил non-root и убрал ненужные привилегии.
phrases.2: Я проверил read-only root и ограниченную запись во временный каталог.
questions.0.points.0: 'Нет: RBAC управляет действиями API, admission проверяет свойства запрашиваемой нагрузки.'
questions.0.points.1: Право создать Deployment не гарантирует допустимость его шаблона Pod.
questions.0.prompt: Заменяют ли RBAC и Pod Security Admission друг друга?
questions.1.points.0: Он защищает файловую систему образа, но не все подключённые volumes.
questions.1.points.1: Выдавайте только явно необходимые writable volumes.
questions.1.prompt: Запрещает ли readOnlyRootFilesystem любую запись?
diagnostics.namespace: namespace pod-security.kubernetes.io/enforce должен совпадать с restricted.
diagnostics.replicas: deployment/board replicas должен совпадать с 1.
diagnostics.ready: deployment/board readyReplicas должен совпадать с 1.
diagnostics.containers: deployment/board containers должен совпадать с [worker].
diagnostics.hostpath: Deployment не должен использовать тома hostPath.
diagnostics.nonroot: deployment/board runAsNonRoot должен совпадать с true.
diagnostics.uid: deployment/board runAsUser должен совпадать с 1000.
diagnostics.seccomp: deployment/board seccompProfile.type должен совпадать с RuntimeDefault.
diagnostics.volume: deployment/board volume scratch должен совпадать с emptyDir.
diagnostics.mount: Worker должен монтировать scratch в /tmp с возможностью записи.
diagnostics.mounts: Все монтирования контейнеров, кроме scratch в /tmp, должны быть только для чтения.
diagnostics.root: deployment/board / mount должен совпадать с ro.
diagnostics.live_uid: deployment/board id -u должен совпадать с 1000.
diagnostics.tmp: Запись и чтение файла в /tmp должны завершиться успешно.
diagnostics.http: board:8080 должен совпадать с north-109.
diagnostics.host_hostnetwork: deployment/board hostNetwork не должен быть включён.
diagnostics.host_hostpid: deployment/board hostPID не должен быть включён.
diagnostics.host_hostipc: deployment/board hostIPC не должен быть включён.
diagnostics.security_privileged: Ни один контейнер не должен быть привилегированным.
diagnostics.security_allowprivilegeescalation: container securityContext allowPrivilegeEscalation должен совпадать с false.
diagnostics.security_readonlyrootfilesystem: container securityContext readOnlyRootFilesystem должен совпадать с true.
diagnostics.security_drop: Каждый контейнер должен удалить capability ALL.
diagnostics.security_add: container securityContext add должен совпадать с [].
diagnostics.security_seccomp: Container seccompProfile.type должен быть RuntimeDefault или отсутствовать.
