title: Security context и Pod Security
brief: 'Конечная точка board недоступна. Восстановите изолированную нагрузку без ослабления политики безопасности
  песочницы.


  Работайте в `~/quest` на рабочей станции. Предоставлены файлы: `board.yaml`, `service.yaml`.


  **Требования:**

  - Пространство имён песочницы сохраняет контроль Pod Security `restricted`.

  - Deployment `board` имеет ровно один контейнер `worker` и одну готовую реплику.

  - У Pod нет сети хоста, доступа к процессам и IPC хоста или томов файловой системы хоста. Все обычные и init-контейнеры
  работают без повышенных привилегий, не могут их получить, не сохраняют и не добавляют Linux capabilities
  и имеют корневую файловую систему только для чтения. Pod работает не от root с фильтром системных вызовов
  по умолчанию; контейнеры не могут заменить его другим фильтром. Запись разрешена только в поставленное временное
  хранилище внутри Pod по пути `/tmp`; остальные mounts доступны только для чтения.

  - Из Deployment `board` адрес `http://board:8080` возвращает `north-109`.


  Проверки наблюдают текущие настройки, а не историю изменений пространства имён.

  '
debrief: Настройки безопасности workload, работающее монтирование, UID, временное пространство и ответ сервиса
  соответствовали проверкам.
stages.0.brief: Изолированная нагрузка board должна быть готова и работоспособна.
hints.0.text: Допуск нагрузки и её работоспособность — разные этапы восстановления.
hints.1.text: 'Отказ admission происходит до запуска контейнера и появления логов приложения. Предоставленный
  привилегированный контейнер board отклонён restricted Pod Security; изучите события ReplicaSet.


  Non-root identity, запрет привилегий и read-only filesystem решают разные задачи.


  Изучите поставленные определения, текущие ресурсы и события.


  ```sh

  cat board.yaml

  kubectl describe replicasets

  kubectl get deployment board -o yaml

  kubectl get namespace "$DQ_NAMESPACE" -o yaml

  ```'
hints.2.text: 'Уберите привилегии, сохраните root filesystem read-only и выдайте приложению только emptyDir в /tmp.


  Проверьте наблюдаемый результат:


  ```sh

  kubectl get deployment board

  kubectl exec deployment/board -c worker -- sh -c ''id -u; cat /proc/mounts; test -w /tmp''

  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080

  ```


  Ожидаются одна готовая реплика, runtime UID 1000, корневой mount только для чтения, доступный для записи /tmp и HTTP-ответ north-109.


  Поставленные ограничения и подробности: Pod `board` не имеет доступа к хосту, работает без root с UID `1000` и seccomp `RuntimeDefault`; все контейнеры запрещают повышение привилегий, сбрасывают `ALL` capabilities, не добавляют новых и имеют корневую ФС только для чтения; запись работает только в томе `scratch`, emptyDir в `/tmp`.


  Ограничения охватывают все обычные и init-контейнеры: без host network/PID/IPC и hostPath, без повышения привилегий и добавленных capabilities, сброс ALL; seccomp контейнера отсутствует или RuntimeDefault, остальные mounts только для чтения; дополнительные безопасные поля и сбрасываемые capabilities допускаются.'
phrases.0: Я определил отказ admission до отладки запуска приложения.
phrases.1: Я сохранил non-root и убрал ненужные привилегии.
phrases.2: Я проверил read-only root и ограниченную запись во временный каталог.
questions.0.points.0: 'Нет: RBAC управляет действиями API, admission проверяет свойства запрашиваемой нагрузки.'
questions.0.points.1: Право создать Deployment не гарантирует допустимость его шаблона Pod.
questions.0.prompt: Заменяют ли RBAC и Pod Security Admission друг друга?
questions.1.points.0: Он защищает файловую систему образа, но не все подключённые volumes.
questions.1.points.1: Выдавайте только явно необходимые writable volumes.
questions.1.prompt: Запрещает ли readOnlyRootFilesystem любую запись?
diagnostics.namespace: namespace pod-security.kubernetes.io/enforce должен совпадать с restricted.
diagnostics.replicas: deployment/board replicas должен совпадать с 1.
diagnostics.ready: deployment/board readyReplicas должен совпадать с 1.
diagnostics.containers: deployment/board containers должен совпадать с [worker].
diagnostics.hostpath: Deployment не должен использовать тома hostPath.
diagnostics.nonroot: deployment/board runAsNonRoot должен совпадать с true.
diagnostics.uid: 'deployment/board: явно заданные значения runAsUser должны быть положительными.'
diagnostics.seccomp: deployment/board seccompProfile.type должен совпадать с RuntimeDefault.
diagnostics.volume: deployment/board volume scratch должен совпадать с emptyDir.
diagnostics.mount: Worker должен монтировать scratch в /tmp с возможностью записи.
diagnostics.mounts: Все монтирования контейнеров, кроме scratch в /tmp, должны быть только для чтения.
diagnostics.root: deployment/board / mount должен совпадать с ro.
diagnostics.live_uid: 'deployment/board: id -u должен возвращать положительный UID.'
diagnostics.tmp: Запись и чтение файла в /tmp должны завершиться успешно.
diagnostics.http: board:8080 должен совпадать с north-109.
diagnostics.host_hostnetwork: deployment/board hostNetwork не должен быть включён.
diagnostics.host_hostpid: deployment/board hostPID не должен быть включён.
diagnostics.host_hostipc: deployment/board hostIPC не должен быть включён.
diagnostics.security_privileged: Ни один контейнер не должен быть привилегированным.
diagnostics.security_allowprivilegeescalation: container securityContext allowPrivilegeEscalation должен совпадать
  с false.
diagnostics.security_readonlyrootfilesystem: container securityContext readOnlyRootFilesystem должен совпадать
  с true.
diagnostics.security_drop: Каждый контейнер должен удалить capability ALL.
diagnostics.security_add: container securityContext add должен совпадать с [].
diagnostics.security_seccomp: Container seccompProfile.type должен быть RuntimeDefault или отсутствовать.
