  wszystkie kontenery zabraniają eskalacji, odrzucają `ALL` capabilities, nie dodają żadnych i mają systemy główne
  tylko do odczytu; zapisywalny i sprawny jest tylko wolumen `scratch`, emptyDir w `/tmp`.
stages.0.objectives.3.text: Z Deployment `board` adres `http://board:8080` zwraca `north-109`.
