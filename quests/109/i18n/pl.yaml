title: Security context i Pod Security
brief: 'Wnęka wymusza ograniczony standard bezpieczeństwa Pod. Deployment prosi o privileged container,
  więc jego ReplicaSet nie może przyjąć Pod. Sprawdź zdarzenia ReplicaSet, a następnie zamień kontener
  securityContext na privileged: false, allowPrivilegeEscalation: false, capabilities.drop: [ALL] i readOnlyRootFilesystem:
  true. Zachowaj dostarczony non-root UID 1000, RuntimeDefault seccomp i emptyDir zamontowane tylko na
  /tmp.. Aplikacja wymaga tymczasowej pamięci, ale nie host access. Nie zmieniaj zasad dotyczących przestrzeni
  nazw ani nie dodawaj uprawnień.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `board.json`, `service.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: ograniczony Pod działa jako UID 1000, jego root filesystem odrzuca zapisy,
  /tmp pozostaje zapisywalny, a HTTP zwraca north-109 bez zmian w polityce przestrzeni nazw.'
debrief: 'Admission policy i kontrole w czasie wykonywania zgadzają się: aplikacja działa z wymaganymi
  ograniczeniami i wąskim writable scratch area.'
stages.0.brief: 'Kryteria sukcesu: ograniczony Pod działa jako UID 1000, jego root filesystem odrzuca
  zapisy, /tmp pozostaje zapisywalny, a HTTP zwraca north-109 bez zmian w polityce przestrzeni nazw.'
stages.0.objectives.0.text: Ograniczony Pod działa jako UID 1000, jego root filesystem odrzuca zapisy,
  /tmp pozostaje zapisywalny, a HTTP zwraca north-109 bez zmian w polityce przestrzeni nazw.
hints.0.text: Odrzucenie admission ma miejsce, zanim kontener może ulec awarii lub wygenerować dzienniki
  aplikacji.
hints.1.text: Non-root identity, kontrola uprawnień i systemy plików tylko do odczytu rozwiązują różne
  problemy.
hints.2.text: Porzuć uprawnienia, zachowaj root filesystem read-only i nadaj aplikacji tylko /tmp emptyDir.
phrases.0: Zdiagnozowałem awarię admission przed debugowaniem uruchamiania aplikacji.
phrases.1: Zachowałem obciążenie non-root i usunąłem niepotrzebne uprawnienia.
phrases.2: Zweryfikowałem pamięć read-only root i ograniczone zapisy.
questions.0.points.0: NIE; RBAC steruje działaniami API, podczas gdy admission sprawdza żądane właściwości
  obciążenia.
questions.0.points.1: Osoba wywołująca, której zezwolono na utworzenie Deployment, może w dalszym ciągu
  zażądać odrzuconego szablonu Pod.
questions.0.prompt: Czy RBAC i Pod Security Admission są wymienne?
questions.1.points.0: Chroni system plików obrazu kontenera, a nie każdy zamontowany wolumin.
questions.1.points.1: Podaj tylko jawny writable volumes, którego potrzebuje aplikacja.
questions.1.prompt: Czy readOnlyRootFilesystem zabrania wszelkich zapisów?
