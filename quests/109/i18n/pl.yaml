title: Security context i Pod Security
brief: 'Pracuj w `~/quest`; przeczytaj `board.json` i `service.json`. Prywatna przestrzeń nazw stosuje ograniczony standard bezpieczeństwa Pod, a uprzywilejowany kontener `board` nie może wystartować. Zbadaj zdarzenia ReplicaSet i popraw istniejący Deployment. Kontekst bezpieczeństwa określa żądaną tożsamość procesu, uprawnienia i ustawienia systemu plików; `emptyDir` zapewnia miejsce robocze.


  Zachowaj jeden kontener `worker` i jedną replikę. Na poziomie poda ustaw `runAsNonRoot: true`, `runAsUser: 1000` i `seccompProfile.type: RuntimeDefault`; nie używaj sieci hosta, host PID, host IPC ani hostPath. Dla każdego kontenera i init container wyłącz uprzywilejowanie i eskalację, ustaw główny system plików tylko do odczytu, usuń możliwości `ALL` i nie dodawaj żadnych; seccomp kontenera może być pominięty lub `RuntimeDefault`. Dodatkowo usunięte możliwości i równoważne bezpieczne pola są akceptowane. Zachowaj `scratch` emptyDir zamontowany z zapisem w `/tmp`; inne montowania muszą być tylko do odczytu.


  Sprawdź jedną gotową replikę, flagę `ro` aktywnego montowania głównego, wynik 1000 polecenia `id -u`, działający zapis i odczyt w `/tmp` oraz odpowiedź `north-109` z `board:8080`. Zachowaj etykietę przestrzeni nazw `pod-security.kubernetes.io/enforce` ustawioną na `restricted`. Kontrole obserwują bieżące ustawienia, ale nie dowodzą historii zmian przestrzeni nazw. Korzystaj tylko z zatoki offline.'
debrief: Ustawienia bezpieczeństwa workloadu, aktywne montowanie, UID, działanie przestrzeni roboczej i odpowiedź usługi odpowiadały kontrolom.
stages.0.brief: Ustawienia bezpieczeństwa i montowania Deployment, działanie głównego systemu i /tmp, UID, gotowa replika i odpowiedź board odpowiadają opisowi.
stages.0.objectives.0.text: Ustawienia bezpieczeństwa i montowania Deployment, działanie głównego systemu i /tmp, UID, gotowa replika i odpowiedź board odpowiadają opisowi.
hints.0.text: Odrzucenie admission ma miejsce, zanim kontener może ulec awarii lub wygenerować dzienniki
  aplikacji.
hints.1.text: Non-root identity, kontrola uprawnień i systemy plików tylko do odczytu rozwiązują różne
  problemy.
hints.2.text: Porzuć uprawnienia, zachowaj root filesystem read-only i nadaj aplikacji tylko /tmp emptyDir.
phrases.0: Zdiagnozowałem awarię admission przed debugowaniem uruchamiania aplikacji.
phrases.1: Zachowałem obciążenie non-root i usunąłem niepotrzebne uprawnienia.
phrases.2: Zweryfikowałem pamięć read-only root i ograniczone zapisy.
questions.0.points.0: NIE; RBAC steruje działaniami API, podczas gdy admission sprawdza żądane właściwości
  obciążenia.
questions.0.points.1: Osoba wywołująca, której zezwolono na utworzenie Deployment, może w dalszym ciągu
  zażądać odrzuconego szablonu Pod.
questions.0.prompt: Czy RBAC i Pod Security Admission są wymienne?
questions.1.points.0: Chroni system plików obrazu kontenera, a nie każdy zamontowany wolumin.
questions.1.points.1: Podaj tylko jawny writable volumes, którego potrzebuje aplikacja.
questions.1.prompt: Czy readOnlyRootFilesystem zabrania wszelkich zapisów?
