title: Security context i Pod Security
brief: "Endpoint board jest niedostępny. Przywróć izolowane obciążenie bez osłabiania zasad bezpieczeństwa piaskownicy.\n\
  \nPracuj w `~/quest` na stacji roboczej. Dostarczone pliki: `board.yaml`, `service.yaml`.\n\n**Requirements:**\n\
  \n- Namespace piaskownicy zachowuje egzekwowanie Pod Security `restricted`.\n- Deployment `board` ma dokładnie\
  \ jeden kontener `worker` i jedną gotową replikę.\n- Pod `board` nie ma dostępu do hosta, działa bez root z UID\
  \ `1000` i seccomp `RuntimeDefault`; wszystkie kontenery zabraniają eskalacji, odrzucają `ALL` capabilities, nie\
  \ dodają żadnych i mają systemy główne tylko do odczytu; zapisywalny i sprawny jest tylko wolumen `scratch`, emptyDir\
  \ w `/tmp`.\n  - Bez sieci hosta, PID/IPC hosta i hostPath; wszystkie kontenery zwykłe i init są nieuprzywilejowane,\
  \ bez eskalacji, z seccomp kontenera nieobecnym lub `RuntimeDefault`. Pozostałe montowania są tylko do odczytu;\
  \ dodatkowo odrzucone capabilities i równoważne bezpieczne pola są dozwolone.\n- Z Deployment `board` adres `http://board:8080`\
  \ zwraca `north-109`.\n\n**Verify yourself before Check & finish:** Wykonaj te polecenia obserwacji z `~/quest`\
  \ na stacji roboczej.\n\n- Ustawienia, tożsamość i stan odpowiadają wymaganiom.\n\n  ```sh\n  kubectl get namespace\
  \ \"$DQ_NAMESPACE\" -o yaml\n  kubectl get deployment board -o yaml\n  ```\n\n- `kubectl exec deployment/board\
  \ -- sh -c 'id -u; cat /proc/mounts; test -w /tmp'` — Bieżący UID to `1000`, główny system jest tylko do odczytu,\
  \ a `/tmp` jest zapisywalny w `worker`.\n\n- `kubectl exec deployment/board -- wget -qO- -T 3 http://board:8080`\
  \ — Odbiorca board otrzymuje `north-109`.\n\nKontrole obserwują bieżące ustawienia, nie historię zmian namespace."
debrief: Ustawienia bezpieczeństwa workloadu, aktywne montowanie, UID, działanie przestrzeni roboczej i odpowiedź
  usługi odpowiadały kontrolom.
stages.0.brief: Izolowane obciążenie board musi być gotowe i sprawne.
hints.0.text: Odrzucenie admission ma miejsce, zanim kontener może ulec awarii lub wygenerować dzienniki aplikacji.
  Dostarczony uprzywilejowany kontener board jest odrzucany przez restricted Pod Security; sprawdź zdarzenia ReplicaSet.
hints.1.text: Non-root identity, kontrola uprawnień i systemy plików tylko do odczytu rozwiązują różne problemy.
hints.2.text: Porzuć uprawnienia, zachowaj root filesystem read-only i nadaj aplikacji tylko /tmp emptyDir.
phrases.0: Zdiagnozowałem awarię admission przed debugowaniem uruchamiania aplikacji.
phrases.1: Zachowałem obciążenie non-root i usunąłem niepotrzebne uprawnienia.
phrases.2: Zweryfikowałem pamięć read-only root i ograniczone zapisy.
questions.0.points.0: NIE; RBAC steruje działaniami API, podczas gdy admission sprawdza żądane właściwości obciążenia.
questions.0.points.1: Osoba wywołująca, której zezwolono na utworzenie Deployment, może w dalszym ciągu zażądać
  odrzuconego szablonu Pod.
questions.0.prompt: Czy RBAC i Pod Security Admission są wymienne?
questions.1.points.0: Chroni system plików obrazu kontenera, a nie każdy zamontowany wolumin.
questions.1.points.1: Podaj tylko jawny writable volumes, którego potrzebuje aplikacja.
questions.1.prompt: Czy readOnlyRootFilesystem zabrania wszelkich zapisów?
diagnostics.namespace: namespace pod-security.kubernetes.io/enforce musi być równe restricted.
diagnostics.replicas: deployment/board replicas musi być równe 1.
diagnostics.ready: deployment/board readyReplicas musi być równe 1.
diagnostics.containers: deployment/board containers musi być równe [worker].
diagnostics.hostpath: Deployment nie może używać wolumenów hostPath.
diagnostics.nonroot: deployment/board runAsNonRoot musi być równe true.
diagnostics.uid: deployment/board runAsUser musi być równe 1000.
diagnostics.seccomp: deployment/board seccompProfile.type musi być równe RuntimeDefault.
diagnostics.volume: deployment/board volume scratch musi być równe emptyDir.
diagnostics.mount: Worker musi montować scratch w /tmp z prawem zapisu.
diagnostics.mounts: Wszystkie montowania kontenerów poza scratch w /tmp muszą być tylko do odczytu.
diagnostics.root: deployment/board / mount musi być równe ro.
diagnostics.live_uid: deployment/board id -u musi być równe 1000.
diagnostics.tmp: Zapis i odczyt pliku w /tmp musi się powieść.
diagnostics.http: board:8080 musi być równe north-109.
diagnostics.host_hostnetwork: deployment/board hostNetwork nie może być włączone.
diagnostics.host_hostpid: deployment/board hostPID nie może być włączone.
diagnostics.host_hostipc: deployment/board hostIPC nie może być włączone.
diagnostics.security_privileged: Żaden kontener nie może być uprzywilejowany.
diagnostics.security_allowprivilegeescalation: container securityContext allowPrivilegeEscalation musi być równe
  false.
diagnostics.security_readonlyrootfilesystem: container securityContext readOnlyRootFilesystem musi być równe true.
diagnostics.security_drop: Każdy kontener musi odebrać capability ALL.
diagnostics.security_add: container securityContext add musi być równe [].
diagnostics.security_seccomp: Container seccompProfile.type musi mieć wartość RuntimeDefault lub być nieobecny.
