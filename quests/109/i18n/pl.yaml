title: Security context i Pod Security
brief: 'Endpoint board jest niedostępny. Przywróć izolowane obciążenie bez osłabiania zasad bezpieczeństwa
  piaskownicy.


  Pracuj w `~/quest` na stacji roboczej. Dostarczone pliki: `board.yaml`, `service.yaml`.


  **Wymagania:**

  - Namespace piaskownicy zachowuje egzekwowanie Pod Security `restricted`.

  - Deployment `board` ma dokładnie jeden kontener `worker` i jedną gotową replikę.

  - Pod nie ma sieci hosta, dostępu do procesów lub IPC hosta ani woluminów systemu plików hosta. Wszystkie
  kontenery zwykłe i init działają bez podwyższonych uprawnień, nie mogą uzyskać dodatkowych uprawnień, nie
  zachowują ani nie dodają capabilities Linuksa i mają główny system plików tylko do odczytu. Pod działa bez
  roota z domyślnym filtrem wywołań systemowych; kontenery nie mogą zastąpić go innym filtrem. Zapisywalny
  jest tylko dostarczony magazyn tymczasowy wewnątrz Poda w `/tmp`; pozostałe montowania są tylko do odczytu.

  - Z Deployment `board` adres `http://board:8080` zwraca `north-109`.


  Kontrole obserwują bieżące ustawienia, nie historię zmian namespace.

  '
debrief: Ustawienia bezpieczeństwa workloadu, aktywne montowanie, UID, działanie przestrzeni roboczej i odpowiedź
  usługi odpowiadały kontrolom.
stages.0.brief: Izolowane obciążenie board musi być gotowe i sprawne.
hints.0.text: Dopuszczenie i zdrowie podczas działania to odrębne etapy odzyskiwania obciążenia.
hints.1.text: 'Odrzucenie admission ma miejsce, zanim kontener może ulec awarii lub wygenerować dzienniki aplikacji.
  Dostarczony uprzywilejowany kontener board jest odrzucany przez restricted Pod Security; sprawdź zdarzenia
  ReplicaSet.


  Non-root identity, kontrola uprawnień i systemy plików tylko do odczytu rozwiązują różne problemy.


  Sprawdź dostarczone definicje, bieżące zasoby i zdarzenia.


  ```sh

  cat board.yaml

  kubectl describe replicasets

  kubectl get deployment board -o yaml

  kubectl get namespace "$DQ_NAMESPACE" -o yaml

  ```'
hints.2.text: 'Porzuć uprawnienia, zachowaj root filesystem read-only i nadaj aplikacji tylko /tmp emptyDir.


  Sprawdź obserwowany wynik:


  ```sh

  kubectl get deployment board

  kubectl exec deployment/board -c worker -- sh -c ''id -u; cat /proc/mounts; test -w /tmp''

  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080

  ```


  Oczekuj jednej gotowej repliki, UID 1000 podczas działania, głównego montowania tylko do odczytu, zapisywalnego /tmp i odpowiedzi HTTP north-109.


  Dostarczone ograniczenia i szczegóły: Pod `board` nie ma dostępu do hosta, działa bez root z UID `1000` i seccomp `RuntimeDefault`; wszystkie kontenery zabraniają eskalacji, odrzucają `ALL` capabilities, nie dodają żadnych i mają systemy główne tylko do odczytu; zapisywalny i sprawny jest tylko wolumen `scratch`, emptyDir w `/tmp`.


  Ograniczenia obejmują wszystkie kontenery zwykłe i init: bez sieci/PID/IPC hosta ani hostPath, bez eskalacji i dodanych capabilities, odrzucenie ALL; seccomp kontenera nieobecny lub RuntimeDefault, pozostałe montowania tylko do odczytu; dodatkowe bezpieczne pola i odrzucone capabilities są dopuszczalne.'
phrases.0: Zdiagnozowałem awarię admission przed debugowaniem uruchamiania aplikacji.
phrases.1: Zachowałem obciążenie non-root i usunąłem niepotrzebne uprawnienia.
phrases.2: Zweryfikowałem pamięć read-only root i ograniczone zapisy.
questions.0.points.0: NIE; RBAC steruje działaniami API, podczas gdy admission sprawdza żądane właściwości
  obciążenia.
questions.0.points.1: Osoba wywołująca, której zezwolono na utworzenie Deployment, może w dalszym ciągu zażądać
  odrzuconego szablonu Pod.
questions.0.prompt: Czy RBAC i Pod Security Admission są wymienne?
questions.1.points.0: Chroni system plików obrazu kontenera, a nie każdy zamontowany wolumin.
questions.1.points.1: Podaj tylko jawny writable volumes, którego potrzebuje aplikacja.
questions.1.prompt: Czy readOnlyRootFilesystem zabrania wszelkich zapisów?
stages.0.objectives.0.text: Namespace piaskownicy zachowuje egzekwowanie Pod Security `restricted`.
stages.0.objectives.1.text: Deployment `board` ma dokładnie jeden kontener `worker` i jedną gotową replikę.
stages.0.objectives.2.text: Pod nie ma sieci hosta, dostępu do procesów lub IPC hosta ani woluminów systemu
  plików hosta. Wszystkie kontenery zwykłe i init działają bez podwyższonych uprawnień, nie mogą uzyskać dodatkowych
  uprawnień, nie zachowują ani nie dodają capabilities Linuksa i mają główny system plików tylko do odczytu.
  Pod działa bez roota z domyślnym filtrem wywołań systemowych; kontenery nie mogą zastąpić go innym filtrem.
  Zapisywalny jest tylko dostarczony magazyn tymczasowy wewnątrz Poda w `/tmp`; pozostałe montowania są tylko
  do odczytu.
stages.0.objectives.3.text: Z Deployment `board` adres `http://board:8080` zwraca `north-109`.
diagnostics.probe_0_2: Kontrola zabezpieczeń może skończyć się przed wskazaniem warunku przez błąd Pythona lub wejścia. Sprawdź dostęp do Deploymentu i dostępność narzędzi. [Przyczyna i kontrola](guides#guide=workload-access&section=q109-security-observer-input)
diagnostics.host_hostnetwork: Zmiana szablonu mogła włączyć sieć hosta. Sprawdź hostNetwork i zachowaj oddzielną przestrzeń sieciową poda board. [Przyczyna i kontrola](guides#guide=workload-access&section=q109-board-network-namespace)
diagnostics.host_hostpid: Szablon poda mógł zacząć współdzielić przestrzeń procesów hosta. Sprawdź hostPID i pozostaw wyłączone. [Przyczyna i kontrola](guides#guide=workload-access&section=q109-board-process-namespace)
diagnostics.host_hostipc: Szablon poda mógł zacząć współdzielić IPC hosta. Sprawdź hostIPC i zachowaj izolację IPC poda. [Przyczyna i kontrola](guides#guide=workload-access&section=q109-board-ipc-namespace)
diagnostics.hostpath: Podczas zmiany szablonu mógł zostać dodany wolumen hostPath. Sprawdź źródła wolumenów i usuń zależność od hostPath. [Przyczyna i kontrola](guides#guide=workload-access&section=q109-board-volume-sources)
diagnostics.nonroot: Kontener może nie mieć skutecznego runAsNonRoot, nadpisywać je albo wskazywać UID 0. Sprawdź ustawienia poda i wszystkich kontenerów, w tym init. Jawne UID mają być dodatnie. [Przyczyna i kontrola](guides#guide=workload-access&section=q109-board-user-policy)
diagnostics.seccomp: Domyślny filtr wywołań może być usunięty albo nadpisany. Sprawdź skuteczny RuntimeDefault w zwykłych i init-kontenerach oraz ustawienia odziedziczone z poda. [Przyczyna i kontrola](guides#guide=workload-access&section=q109-board-syscall-filter)
diagnostics.security_privileged: 'Zwykły lub init-kontener mógł dostać tryb uprzywilejowany. Sprawdź securityContext każdego i usuń privileged: true. [Przyczyna i kontrola](guides#guide=workload-access&section=q109-board-privileged-mode)'
diagnostics.security_allowprivilegeescalation: 'Kontener może dopuszczać eskalację, jeśli flaga jest pominięta lub włączona. Ustaw allowPrivilegeEscalation: false dla każdego zwykłego i init-kontenera. [Przyczyna i kontrola](guides#guide=workload-access&section=q109-board-privilege-escalation)'
diagnostics.security_drop: Kontener mógł przestać usuwać domyślne capabilities. Sprawdź ALL na liście drop każdego zwykłego i init-kontenera. [Przyczyna i kontrola](guides#guide=workload-access&section=q109-board-drop-capabilities)
diagnostics.security_add: Szablon mógł dodać capabilities ponownie po ich usunięciu. Sprawdź pustą listę add w każdym zwykłym i init-kontenerze. [Przyczyna i kontrola](guides#guide=workload-access&section=q109-board-no-added-capabilities)
diagnostics.namespace: Przestrzeń nazw może nie mieć etykiety restricted albo odczyt nie działa. Sprawdź etykietę stanowiska i zachowaj wymuszanie restricted przy poprawce. [Przyczyna i kontrola](guides#guide=workload-access&section=q109-restricted-namespace)
diagnostics.replicas: Deployment mógł zostać przeskalowany lub nie istnieć. Sprawdź, czy board nadal żąda jednej repliki. [Przyczyna i kontrola](guides#guide=workload-access&section=q109-board-replica-contract)
diagnostics.ready: Szablon poda może istnieć, choć admission lub wdrożenie blokuje gotowość. Sprawdź zdarzenia i potwierdź jedną gotową replikę w stanie board. [Przyczyna i kontrola](guides#guide=workload-access&section=q109-board-ready-replica)
diagnostics.containers: Obciążenie może mieć przemianowany kontener worker, dodatkowy zwykły kontener albo żadnego. Zachowaj dokładnie jeden zwykły kontener worker. [Przyczyna i kontrola](guides#guide=workload-access&section=q109-board-worker-identity)
diagnostics.uid: Jawne runAsUser może być zerem lub nieprawidłowe. Sprawdź jawne UID poda i kontenerów, w tym init, i zachowaj dodatnie liczby całkowite. [Przyczyna i kontrola](guides#guide=workload-access&section=q109-board-explicit-user-ids)
diagnostics.security_readonlyrootfilesystem: Jeden z kontenerów może nadal zezwalać na zapis w systemie plików obrazu. Ustaw readOnlyRootFilesystem na true we wszystkich zwykłych i init-kontenerach, a zapisy tymczasowe pozostaw na wolumenie. [Przyczyna i kontrola](guides#guide=workload-access&section=q109-board-declared-readonly-root)
diagnostics.security_seccomp: Nadpisanie seccomp kontenera może zastąpić dostarczony filtr RuntimeDefault. Sprawdź zwykłe i init-kontenery i zachowaj dziedziczony lub jawny RuntimeDefault. [Przyczyna i kontrola](guides#guide=workload-access&section=q109-board-container-seccomp-override)
diagnostics.volume: Montowanie /tmp może zniknąć lub wskazywać wolumen inny niż emptyDir. Prześledź nazwę montowania od kontenera worker do zadeklarowanego źródła. [Przyczyna i kontrola](guides#guide=workload-access&section=q109-board-temporary-volume-type)
diagnostics.mount: Kontener worker może montować /tmp tylko do odczytu lub mieć sprzeczne wpisy. Sprawdź pojedyncze zapisywalne montowanie z tymczasowego emptyDir. [Przyczyna i kontrola](guides#guide=workload-access&section=q109-board-writable-temporary-mount)
diagnostics.mounts: Montowanie inne niż dostarczony /tmp może zezwalać na zapis. Sprawdź zwykłe i init-kontenery, w tym źródła projekcji dostępne tylko do odczytu. [Przyczyna i kontrola](guides#guide=workload-access&section=q109-board-other-mounts-readonly)
diagnostics.root: Deployment może deklarować korzeń tylko do odczytu, choć kontener worker nadal ma stare montowanie. Sprawdź opcje / w /proc/mounts i potwierdź ro po wdrożeniu. [Przyczyna i kontrola](guides#guide=workload-access&section=q109-board-live-readonly-root)
diagnostics.live_uid: Wybrany kontener worker może nadal działać jako root albo exec może zawodzić. Odczytaj rzeczywisty UID procesu i potwierdź, że jest dodatni. [Przyczyna i kontrola](guides#guide=workload-access&section=q109-board-live-worker-uid)
diagnostics.tmp: Wolumen może być tylko do odczytu albo mieć uprawnienia blokujące kontener worker. Sprawdź rzeczywisty zapis i odczyt w /tmp z działającego kontenera worker. [Przyczyna i kontrola](guides#guide=workload-access&section=q109-board-live-tmp-reads-writes)
diagnostics.http: Ustawienia mogą już być prawidłowe, choć kontener worker nie może zapisać treści albo Service nie ma gotowego endpointu. Odpytaj board po wdrożeniu i porównaj z north-109. [Przyczyna i kontrola](guides#guide=workload-access&section=q109-board-live-security-http)
