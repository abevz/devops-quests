title: Восстановление через rescue
brief: 'Вы в команде эксплуатации SignalRail. Восстановите старый баннер после сбоя проверки. Работайте
  в ~/quest. Все изменения — только в этой песочнице.


  Входные файлы в `~/quest`: `inventory.ini`, `ansible.cfg`, `rollout.yml`.


  В песочнице нет интернета и внешнего DNS. Используйте только выданные файлы, предварительно загруженные
  образы и приватные сервисы. Все изменения — только в этой песочнице.


  Цели первого этапа: На всех трёх узлах message содержит stable-ready, режим 0644; все живые HTTP-баннеры
  возвращают stable-ready.'
stages.0.brief: 'Validation намеренно падает. В rescue восстановите stable-ready и обновите banner.


  Результат проверки: На всех трёх узлах message содержит stable-ready, режим 0644; все живые HTTP-баннеры
  возвращают stable-ready.'
stages.0.objectives.0.text: На всех трёх узлах message содержит stable-ready, режим 0644; все живые HTTP-баннеры
  возвращают stable-ready.
hints.0.text: Проверка candidate намеренно падает.
hints.1.text: Rescue должен восстановить стабильный файл, а не только вывести ошибку.
hints.2.text: В rescue скопируйте stable-ready и вызовите reload handler; проверьте все живые HTTP-ответы.
debrief: Validation намеренно падала после candidate rollout. Вы восстановили stable-ready через rescue
  и обновили живой сервис.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я проверил результат на каждом управляемом хосте.
