title: Восстановление через rescue
brief: |-
  После неудачного развёртывания кандидата флоту нужен стабильный баннер.

  Работайте на workstation в `~/quest` с файлами `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Требования:**
  - Файл на каждом управляемом хосте (`app1`, `app2`, `app3`):
    - Путь: `/srv/site/message`.
    - Содержимое: `stable-ready`.
    - Режим доступа: `0644`.
  - Живой сервис на каждом управляемом хосте (`app1`, `app2`, `app3`):
    - HTTP: `8080`, `/`.
    - Ответ: `stable-ready`.

  **Самопроверка перед Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/message'` — Показывает `stable-ready` от `app1`, `app2`, `app3`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/site/message'` — Показывает `-rw-r--r--` на каждом хосте.
  - `for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done` — Показывает `stable-ready` от `app1`, `app2`, `app3`.
stages.0.brief: Каждый управляемый хост должен предоставлять стабильный файл и живой ответ.
stages.0.objectives.0.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/message` содержит
  `stable-ready`.
stages.0.objectives.1.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) путь `/srv/site/message` имеет
  режим `0644`.
stages.0.objectives.2.text: HTTP на порту `8080` возвращает `stable-ready` на каждом управляемом хосте (`app1`,
  `app2`, `app3`).
hints.0.text: Проверка candidate намеренно падает.
hints.1.text: Rescue должен восстановить стабильный файл, а не только вывести ошибку.
hints.2.text: В rescue скопируйте stable-ready и вызовите reload handler; проверьте все живые HTTP-ответы.
debrief: Validation намеренно падала после candidate rollout. Вы восстановили stable-ready через rescue и обновили
  живой сервис.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я проверил результат на каждом управляемом хосте.
