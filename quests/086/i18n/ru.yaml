title: Восстановление через rescue
brief: "После неудачного развёртывания кандидата флоту нужен стабильный баннер.\n\nРаботайте на workstation в `~/quest`\
  \ с файлами `inventory.ini`, `ansible.cfg`, `rollout.yml`. Дополнительные файлы на рабочей станции в `~/quest`:\
  \ `previous.txt`, `candidate.txt`, `application-contract.json`, `provided-application.py`, `original-application-identities.json`.\n\
  \n**Требования:**\n- Файл на каждом управляемом хосте (`app1`, `app2`, `app3`):\n  - Путь: `/srv/site/message`.\n\
  \  - Содержимое: `stable-ready`.\n  - Режим доступа: `0644`.\n- Живой сервис на каждом управляемом хосте (`app1`,\
  \ `app2`, `app3`):\n  - HTTP: `8080`, `/`.\n  - Ответ: `stable-ready`.\n- На рабочей станции `previous.txt` соответствует\
  \ доверенной квитанции публикации из `application-contract.json`. На каждом управляемом узле (`app1`, `app2`,\
  \ `app3`) предоставленное приложение по HTTP `8081`, `/`, отдаёт утверждённую публикацию. Зависимые приложения\
  \ получают её от существующего источника.\n- Сохраните процессы приложений, их учётные записи, группы, capabilities,\
  \ командные строки и байты установленной программы из `original-application-identities.json`.\n\nПроверка наблюдает\
  \ текущие результаты; она не устанавливает полную историю выполнения."
stages.0.brief: Каждый управляемый хост должен предоставлять стабильный файл и живой ответ.
stages.0.objectives.0.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/message` содержит
  `stable-ready`.
stages.0.objectives.1.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) путь `/srv/site/message` имеет
  режим `0644`.
stages.0.objectives.2.text: HTTP на порту `8080` возвращает `stable-ready` на каждом управляемом хосте (`app1`,
  `app2`, `app3`). Предоставленные приложения также отдают утверждённую публикацию от существующего источника, сохраняя
  исходные идентичности.
hints.0.text: Восстановление источника публикации и принятие данных потребителями — отдельные наблюдаемые шаги.
  Исправный источник может соседствовать с устаревшими кешами потребителей.
hints.1.text: |-
  Сопоставьте `previous.txt`, `candidate.txt`, `application-contract.json` и `provided-application.py`. На управляемых узлах изучите `/var/log/propagation-consumer.log`, входные файлы приложений, HTTP-ответы и учётные записи процессов. Проследите зависимость публикации по топологии.

  Найдите в playbook вход восстановления и его валидацию. Проверьте идентичность процессов и роль каждого хоста как источника или потребителя, затем сравните текущий релиз и метаданные.
hints.2.text: |-
  Выполните `ansible-playbook rollout.yml`; сравните HTTP на `8080` и JSON на `8081` всех трёх узлов. Ожидаются утверждённые выпуск, поколение и SHA-256 из контракта, правильные источники и неизменные записи процессов.

  ```sh
  for number in 1 2 3; do
    host="app${number}-${DQ_NAMESPACE#dq-}"
    printf '%s\n' "$host"
    curl -fsS --max-time 3 "http://$host:8080/"
    curl -fsS --max-time 3 "http://$host:8081/"
    printf '\n'
  done
  python3 -I - <<'VERIFY_PUBLICATION'
  import hashlib
  import http.client
  import json
  import os
  import shlex
  import socket
  import subprocess
  from pathlib import Path
  from urllib.parse import urlsplit

  contract = json.loads(Path("application-contract.json").read_text())
  wanted = contract["publication"]
  assert hashlib.sha256(Path(contract["controllerArtifact"]).read_bytes()).hexdigest() == wanted["sha256"]
  headers = {}
  if contract["authentication"]:
      import yaml
      token = yaml.safe_load(Path("credentials.yml").read_text())["reader_token"]
      assert isinstance(token, str) and token and all(33 <= ord(char) < 127 for char in token)
      headers = {"Authorization": "Bearer " + token}

  suffix = os.environ["DQ_NAMESPACE"].removeprefix("dq-")
  source = contract["sourceHost"] + "-" + suffix
  port = contract["port"]
  def addresses(host):
      return {item[4][0] for item in socket.getaddrinfo(host, port, type=socket.SOCK_STREAM)}

  identity_probe = '''
  import hashlib,json,sys
  from pathlib import Path
  process=json.loads(sys.argv[1])
  pid=Path(process["pidFile"]).read_text().strip()
  root=Path("/proc")/pid
  status=dict(line.split(":",1) for line in (root/"status").read_text().splitlines() if ":" in line)
  print(json.dumps({
      "pid":pid,"starttime":(root/"stat").read_text().rsplit(") ",1)[1].split()[19],
      "uid":status["Uid"].split(),"gid":status["Gid"].split(),"groups":status["Groups"].split(),
      "caps":{key:status[key].strip() for key in ("CapInh","CapPrm","CapEff","CapBnd","CapAmb")},
      "code":hashlib.sha256(Path(process["programPath"]).read_bytes()).hexdigest(),
      "command_sha256":hashlib.sha256((root/"cmdline").read_bytes()).hexdigest(),
  }))
  '''
  original = json.loads(Path("original-application-identities.json").read_text())
  process = contract["process"]
  remote = "/usr/bin/python3 -I -c " + shlex.quote(identity_probe) + " " + shlex.quote(json.dumps(process))
  for host, role in contract["roles"].items():
      address = host + "-" + suffix
      identity = json.loads(subprocess.check_output(
          ["ssh", "-n", "-o", "BatchMode=yes", "-o", "ConnectTimeout=3", "-p", "2222", "root@" + address, remote],
          timeout=5))
      baseline = original[host][process["name"]]
      fields = ("pid", "starttime", "uid", "gid", "groups", "caps", "code")
      assert all(identity[key] == baseline[key] for key in fields)
      command_bytes = chr(0).join(baseline["command"]).encode()
      assert identity["command_sha256"] == hashlib.sha256(command_bytes).hexdigest()
      connection = http.client.HTTPConnection(address, port, timeout=3)
      try:
          connection.request("GET", "/", headers=headers)
          response = connection.getresponse()
          assert response.status == 200
          observed = json.loads(response.read(65536))
      finally:
          connection.close()
      assert observed["ready"] is True and observed["role"] == role
      data = observed["data"]
      assert all(data.get(key) == value for key, value in wanted.items())
      if host == contract["sourceHost"]:
          assert data["origin"] == "local"
      else:
          origin = urlsplit(data["origin"])
          assert origin.scheme == "http" and origin.port == port and origin.hostname
          assert addresses(origin.hostname) & addresses(source)
      print(host + ": publication matches")
  VERIFY_PUBLICATION
  ```
debrief: Вы восстановили реальный источник публикации и передали утверждённый результат существующим потребителям,
  сохранив их идентичности.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я проверил результат на каждом управляемом хосте.
diagnostics.controller_artifact: Резервная копия на контроллере могла быть изменена или заменена отклонённым candidate; previous.txt совпадает с хэшем одобренной публикации, включая перевод строки. Проверьте квитанцию до использования копии как источника восстановления. [Причина и проверка](guides#guide=ansible-9&section=recovery-publication-trusted-backup-bytes)
diagnostics.application_budget: DNS, чтение идентичности через SSH или HTTP-наблюдения могут исчерпать общий десятисекундный бюджет Python; изучите существующие приложения и соединения. Этот маркер относится к application observer, а ранний таймаут legacy HTTP даёт внешний fallback. [Причина и проверка](guides#guide=ansible-9&section=recovery-publication-bounded-application-observation)
diagnostics.application_observation: Артефакт контроллера или зафиксированный contract могут не читаться, либо адрес источника не разрешаться до наблюдения хостов; изучите выданную квитанцию и DNS-контекст. Перехваченные ошибки входов, разбора и команд этой фазы дают один маркер. [Причина и проверка](guides#guide=ansible-9&section=recovery-publication-global-input-observation)
diagnostics.probe_0_2: 'Ранняя legacy HTTP-группа может оборваться до именованного результата, либо запуск Python или неожиданная структура metadata прерывают application observer. Сначала исправьте legacy-ответ: его сбой пропускает проверки приложений; обычные именованные ошибки хостов сохраняют свою диагностику. [Причина и проверка](guides#guide=ansible-9&section=recovery-publication-legacy-or-observer-fallback)'
diagnostics.content_1: 'app1: Файл может сохранять unconfigured или candidate, либо SSH не смог его прочитать; доставьте доверенное stable-ready в /srv/site/message. Shell-сравнение удаляет завершающие переводы строк. [Причина и проверка](guides#guide=ansible-9&section=recovery-publication-app1-content)'
diagnostics.mode_1: 'app1: Копирование данных восстановления могло оставить ограничивающие или случайные права, либо SSH не выполняет stat; явно задайте /srv/site/message mode 0644 в play. [Причина и проверка](guides#guide=ansible-9&section=recovery-publication-app1-mode)'
diagnostics.http_1: 'app1: Legacy-процесс может хранить старое сообщение при правильном файле, либо HTTP недоступен; обновите dq-service, чтобы порт 8080 вернул stable-ready. [Причина и проверка](guides#guide=ansible-9&section=recovery-publication-app1-http)'
diagnostics.application_identity_1: 'app1: Перезапуск или замена выданного приложения могут изменить PID, время старта, principal, группы, capabilities, команду или байты установленной программы; сохраните исходную идентичность и обновляйте входы через SIGHUP. [Причина и проверка](guides#guide=ansible-9&section=recovery-publication-app1-identity)'
diagnostics.application_ready_1: 'app1: Приложение может сохранять отклонённый источник или стартовый кэш, либо role/publication расходятся с квитанцией; исправьте источник и upstream, затем подайте сигнал тому же процессу и проверьте HTTP 8081. [Причина и проверка](guides#guide=ansible-9&section=recovery-publication-app1-ready)'
diagnostics.application_origin_1: 'app1: Ответ источника может поступать от другой реализации: выданный publisher задаёт origin=local при чтении реального файла. Сохраните исходный процесс/программу и сравните живую квитанцию, не подменяя поле origin. [Причина и проверка](guides#guide=ansible-9&section=recovery-publication-app1-origin)'
diagnostics.application_observation_1: 'app1: SSH может не вернуть читаемую квитанцию процесса, HTTP быть недоступным, либо перехваченный разбор JSON/входов завершиться ошибкой при наблюдении хоста; изучите его процесс, конфигурацию и endpoint. Исчерпание deadline и subprocess.TimeoutExpired дают отдельный budget-маркер; HTTP socket timeout — перехваченная ошибка I/O-наблюдения. [Причина и проверка](guides#guide=ansible-9&section=recovery-publication-app1-observation)'
diagnostics.content_2: 'app2: Файл может сохранять unconfigured или candidate, либо SSH не смог его прочитать; доставьте доверенное stable-ready в /srv/site/message. Shell-сравнение удаляет завершающие переводы строк. [Причина и проверка](guides#guide=ansible-9&section=recovery-publication-app2-content)'
