title: Block rescue
brief: 'You joined SignalRail operations. Recover the previous banner after a failed validation. Work
  in ~/quest. Keep all changes inside this training bay.


  Inputs in `~/quest`: `inventory.ini`, `ansible.cfg`, `rollout.yml`.


  The bay has no Internet or external DNS. Use only its supplied files, preloaded images and private services.
  All changes must stay inside this bay.


  Initial success criteria: All three message files contain stable-ready, mode 0644, and all live HTTP
  banners return stable-ready.'
stages.0.brief: 'The validation deliberately fails. Use rescue to deliver stable-ready and reload the
  cached banner on every host.


  Success criteria: All three message files contain stable-ready, mode 0644, and all live HTTP banners
  return stable-ready.'
stages.0.objectives.0.text: All three message files contain stable-ready, mode 0644, and all live HTTP
  banners return stable-ready.
hints.0.text: The candidate validation deliberately fails.
hints.1.text: A rescue block must restore the stable file, not only log the error.
hints.2.text: Copy stable-ready in rescue and notify the reload handler; verify all live HTTP responses.
debrief: Validation deliberately failed after a candidate rollout. You used rescue to restore stable-ready
  and reload the live service.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I verified the result on every managed host.
