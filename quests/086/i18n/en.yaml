title: Block rescue
brief: "The fleet needs the stable banner after an unsuccessful candidate deployment.\n\nWork on the workstation\
  \ in `~/quest` with `inventory.ini`, `ansible.cfg`, `rollout.yml`. Additional files on the workstation in `~/quest`:\
  \ `previous.txt`, `candidate.txt`, `application-contract.json`, `provided-application.py`, `original-application-identities.json`.\n\
  \n**Requirements:**\n- File on every managed host (`app1`, `app2`, `app3`):\n  - Path: `/srv/site/message`.\n\
  \  - Content: `stable-ready`.\n  - Access mode: `0644`.\n- Live service on every managed host (`app1`, `app2`,\
  \ `app3`):\n  - HTTP: `8080`, `/`.\n  - Response: `stable-ready`.\n- On the workstation, `previous.txt` matches\
  \ the trusted publication receipt in `application-contract.json`. On every managed host (`app1`, `app2`, `app3`),\
  \ the supplied application on HTTP `8081`, `/`, serves that approved publication. Its dependent applications consume\
  \ the existing publication source.\n- Preserve the application processes, principals, groups, capabilities, command\
  \ lines and installed program bytes recorded in `original-application-identities.json`.\n\nThe check observes\
  \ current results; it does not establish the full execution history."
stages.0.brief: Every managed host must provide the stable file and live response.
stages.0.objectives.0.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` contains `stable-ready`.
stages.0.objectives.1.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` has mode `0644`.
stages.0.objectives.2.text: HTTP on port `8080` returns `stable-ready` on every managed host (`app1`, `app2`, `app3`).
  The supplied applications also serve the approved publication from the existing source, with their original identities
  retained.
hints.0.text: Recovery at a publication source and adoption by its consumers are separate observable steps. A working
  source can coexist with stale downstream caches.
hints.1.text: Compare `previous.txt`, `candidate.txt`, `application-contract.json` and `provided-application.py`.
  Inspect the managed hosts’ `/var/log/propagation-consumer.log`, application input files, HTTP responses and process
  principals. Follow the publication dependency through the topology.
hints.2.text: Establish trust in the recovery input, validate an attempted publication against the actual service,
  and propagate the recovered source after it is ready. Use the supplied SIGHUP interface under the application’s
  principal to retain its process identity. Run `ansible-playbook rollout.yml`; compare HTTP on `8080` and the JSON
  on `8081` for all three hosts. Expect the approved release, generation and SHA-256 from the contract, correct
  source origins and unchanged process receipts.
debrief: You recovered an actual publication source and deliberately propagated the approved result to existing
  consumers while preserving their identities.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I verified the result on every managed host.
diagnostics.controller_artifact: The controller backup may have been edited or replaced by the rejected candidate; previous.txt must match the approved publication hash, including its newline. Verify that receipt before using the backup as the recovery source. [Cause and check](guides#guide=ansible-9&section=recovery-publication-trusted-backup-bytes)
diagnostics.application_budget: DNS, SSH identity reads or application HTTP observations may exhaust the shared ten-second Python observation budget; inspect the existing applications and connections. This marker belongs to the application observer, while an earlier legacy HTTP timeout uses its outer fallback. [Cause and check](guides#guide=ansible-9&section=recovery-publication-bounded-application-observation)
diagnostics.application_observation: The controller artifact or frozen contract may be unreadable, or the source address may not resolve before host observations begin; inspect the supplied receipt and DNS context. Caught input, parsing and command errors at this phase share this marker. [Cause and check](guides#guide=ansible-9&section=recovery-publication-global-input-observation)
diagnostics.probe_0_2: 'The earlier legacy HTTP group may stop before a named result, or Python startup or an unexpected metadata shape may abort the application observer. Correct the legacy response first: its failure skips the application checks; ordinary named host errors keep their own diagnostics. [Cause and check](guides#guide=ansible-9&section=recovery-publication-legacy-or-observer-fallback)'
diagnostics.content_1: 'app1: The file may still contain unconfigured or candidate data, or SSH could not read it; deliver the trusted stable-ready content to /srv/site/message. This shell comparison removes trailing line feeds. [Cause and check](guides#guide=ansible-9&section=recovery-publication-app1-content)'
diagnostics.mode_1: 'app1: Copying recovery data may leave restrictive or unintended permissions, or SSH cannot stat the file; explicitly set /srv/site/message mode to 0644 in the play. [Cause and check](guides#guide=ansible-9&section=recovery-publication-app1-mode)'
diagnostics.http_1: 'app1: The legacy process may still cache its old message despite a correct file, or HTTP may be unavailable; refresh dq-service so port 8080 returns stable-ready. [Cause and check](guides#guide=ansible-9&section=recovery-publication-app1-http)'
diagnostics.application_identity_1: 'app1: Restarting or replacing the supplied application may change its PID, start time, principal, groups, capabilities, command or installed program bytes; preserve its original identity and refresh inputs with SIGHUP instead. [Cause and check](guides#guide=ansible-9&section=recovery-publication-app1-identity)'
diagnostics.application_ready_1: 'app1: The application may retain a rejected source or startup cache, or its current role and publication fields may disagree with the receipt; repair the source and upstream inputs, then signal the same process and verify HTTP 8081. [Cause and check](guides#guide=ansible-9&section=recovery-publication-app1-ready)'
diagnostics.application_origin_1: 'app1: The source response may come from a different implementation: the supplied publisher sets origin to local when reading its actual source file. Preserve its original process/program and compare the live receipt rather than forging an origin field. [Cause and check](guides#guide=ansible-9&section=recovery-publication-app1-origin)'
diagnostics.application_observation_1: 'app1: SSH may not return a readable process receipt, HTTP may be unreachable or caught JSON/input parsing may fail during this host observation; inspect its existing process, configuration and endpoint. Python observation timeouts use the separate budget marker. [Cause and check](guides#guide=ansible-9&section=recovery-publication-app1-observation)'
diagnostics.content_2: 'app2: The file may still contain unconfigured or candidate data, or SSH could not read it; deliver the trusted stable-ready content to /srv/site/message. This shell comparison removes trailing line feeds. [Cause and check](guides#guide=ansible-9&section=recovery-publication-app2-content)'
diagnostics.mode_2: 'app2: Copying recovery data may leave restrictive or unintended permissions, or SSH cannot stat the file; explicitly set /srv/site/message mode to 0644 in the play. [Cause and check](guides#guide=ansible-9&section=recovery-publication-app2-mode)'
diagnostics.http_2: 'app2: The legacy process may still cache its old message despite a correct file, or HTTP may be unavailable; refresh dq-service so port 8080 returns stable-ready. [Cause and check](guides#guide=ansible-9&section=recovery-publication-app2-http)'
diagnostics.application_identity_2: 'app2: Restarting or replacing the supplied application may change its PID, start time, principal, groups, capabilities, command or installed program bytes; preserve its original identity and refresh inputs with SIGHUP instead. [Cause and check](guides#guide=ansible-9&section=recovery-publication-app2-identity)'
diagnostics.application_ready_2: 'app2: The application may retain a rejected source or startup cache, or its current role and publication fields may disagree with the receipt; repair the source and upstream inputs, then signal the same process and verify HTTP 8081. [Cause and check](guides#guide=ansible-9&section=recovery-publication-app2-ready)'
diagnostics.application_origin_2: 'app2: The dependent application may consume another host or the legacy endpoint; its reported origin must resolve to the existing app1 source and use HTTP port 8081. A source DNS alias or its IP can satisfy this observation. [Cause and check](guides#guide=ansible-9&section=recovery-publication-app2-origin)'
diagnostics.application_observation_2: 'app2: SSH may not return a readable process receipt, HTTP may be unreachable or caught JSON/input parsing may fail during this host observation; inspect its existing process, configuration and endpoint. Python observation timeouts use the separate budget marker. [Cause and check](guides#guide=ansible-9&section=recovery-publication-app2-observation)'
