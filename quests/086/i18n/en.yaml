title: Block rescue
brief: |-
  The fleet needs the stable banner after an unsuccessful candidate deployment.

  Work on the workstation in `~/quest` with `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Requirements:**
  - File on every managed host (`app1`, `app2`, `app3`):
    - Path: `/srv/site/message`.
    - Content: `stable-ready`.
    - Access mode: `0644`.
  - Live service on every managed host (`app1`, `app2`, `app3`):
    - HTTP: `8080`, `/`.
    - Response: `stable-ready`.

  **Verify yourself before Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/message'` — Shows `stable-ready` from `app1`, `app2`, `app3`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/site/message'` — Shows `-rw-r--r--` on each host.
  - `for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done` — Shows `stable-ready` from `app1`, `app2`, `app3`.
stages.0.brief: Every managed host must provide the stable file and live response.
stages.0.objectives.0.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` contains `stable-ready`.
stages.0.objectives.1.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` has mode `0644`.
stages.0.objectives.2.text: HTTP on port `8080` returns `stable-ready` on every managed host (`app1`, `app2`, `app3`).
hints.0.text: The candidate validation deliberately fails.
hints.1.text: A rescue block must restore the stable file, not only log the error.
hints.2.text: Copy stable-ready in rescue and notify the reload handler; verify all live HTTP responses.
debrief: Validation deliberately failed after a candidate rollout. You used rescue to restore stable-ready and reload
  the live service.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I verified the result on every managed host.
