diagnostics.application_origin_2: 'app2: Die abhängige Anwendung nutzt möglicherweise einen anderen Host oder den Legacy-Endpunkt; ihr gemeldeter Origin muss zur bestehenden app1 Quelle auflösen und HTTP-Port 8081 nutzen. Ein Quell-DNS-Alias oder ihre IP kann diese Beobachtung erfüllen. [Ursache und Prüfung](guides#guide=ansible-9&section=recovery-publication-app2-origin)'
