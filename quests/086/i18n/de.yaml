title: Blockieren Sie rescue
brief: 'Sie sind dem Betrieb SignalRail beigetreten. Stellen Sie das vorherige Banner nach einer fehlgeschlagenen
  Validierung wieder her. Arbeiten Sie in ~/quest.. Bewahren Sie alle Änderungen in diesem Trainingsbereich
  auf.


  Eingänge in `~/quest`: `inventory.ini`, `ansible.cfg`, `rollout.yml`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur die bereitgestellten Dateien,
  vorinstallierten Bilder und privaten Dienste. Alle Änderungen müssen innerhalb dieser Bucht bleiben.


  Anfängliche Erfolgskriterien: Alle drei message-Dateien enthalten stable-ready, Modus 0644, und alle
  Live-HTTP-Banner geben stable-ready zurück.'
stages.0.brief: 'Die Validierung scheitert bewusst. Verwenden Sie rescue, um stable-ready bereitzustellen
  und den zwischengespeicherten banner auf jedem Host neu zu laden.


  Erfolgskriterien: Alle drei message-Dateien enthalten stable-ready, Modus 0644, und alle Live-HTTP-Banner
  geben stable-ready zurück.'
stages.0.objectives.0.text: Alle drei message-Dateien enthalten stable-ready, Modus 0644, und alle Live-HTTP-Banner
  geben stable-ready zurück.
hints.0.text: Die candidate-Validierung schlägt absichtlich fehl.
hints.1.text: Ein Rettungsblock muss die stabile Datei wiederherstellen und nicht nur den Fehler protokollieren.
hints.2.text: Kopieren Sie stable-ready in rescue und benachrichtigen Sie reload handler; Überprüfen Sie
  alle Live-Antworten von HTTP.
debrief: Validation ist nach einem candidate rollout absichtlich fehlgeschlagen. Sie haben rescue verwendet,
  um stable-ready wiederherzustellen und den Live-Dienst neu zu laden.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe das Ergebnis auf jedem verwalteten Host überprüft.
