title: Blockieren Sie rescue
brief: |-
  Nach einer fehlgeschlagenen Kandidatenbereitstellung benötigt die Flotte das stabile Banner.

  Arbeite auf der Workstation in `~/quest` mit `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Anforderungen:**
  - Datei auf jedem verwalteten Host (`app1`, `app2`, `app3`):
    - Pfad: `/srv/site/message`.
    - Inhalt: `stable-ready`.
    - Zugriffsmodus: `0644`.
  - Aktiver Dienst auf jedem verwalteten Host (`app1`, `app2`, `app3`):
    - HTTP: `8080`, `/`.
    - Antwort: `stable-ready`.

  **Selbstprüfung vor Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/message'` — Zeigt `stable-ready` von `app1`, `app2`, `app3`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/site/message'` — Zeigt `-rw-r--r--` auf jedem Host.
  - `for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done` — Zeigt `stable-ready` von `app1`, `app2`, `app3`.
stages.0.brief: Jeder verwaltete Host muss die stabile Datei und die aktive Antwort bereitstellen.
stages.0.objectives.0.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/message` den
  Inhalt `stable-ready`.
stages.0.objectives.1.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) hat `/srv/site/message` den Modus
  `0644`.
stages.0.objectives.2.text: HTTP auf Port `8080` liefert auf jedem verwalteten Host (`app1`, `app2`, `app3`) `stable-ready`.
hints.0.text: Die candidate-Validierung schlägt absichtlich fehl.
hints.1.text: Ein Rettungsblock muss die stabile Datei wiederherstellen und nicht nur den Fehler protokollieren.
hints.2.text: Kopieren Sie stable-ready in rescue und benachrichtigen Sie reload handler; Überprüfen Sie alle Live-Antworten
  von HTTP.
debrief: Validation ist nach einem candidate rollout absichtlich fehlgeschlagen. Sie haben rescue verwendet, um
  stable-ready wiederherzustellen und den Live-Dienst neu zu laden.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe das Ergebnis auf jedem verwalteten Host überprüft.
