title: Blockieren Sie rescue
brief: "Nach einer fehlgeschlagenen Kandidatenbereitstellung benötigt die Flotte das stabile Banner.\n\nArbeite\
  \ auf der Workstation in `~/quest` mit `inventory.ini`, `ansible.cfg`, `rollout.yml`. Zusätzliche Dateien auf\
  \ der Workstation in `~/quest`: `previous.txt`, `candidate.txt`, `application-contract.json`, `provided-application.py`,\
  \ `original-application-identities.json`.\n\n**Anforderungen:**\n- Datei auf jedem verwalteten Host (`app1`, `app2`,\
  \ `app3`):\n  - Pfad: `/srv/site/message`.\n  - Inhalt: `stable-ready`.\n  - Zugriffsmodus: `0644`.\n- Aktiver\
  \ Dienst auf jedem verwalteten Host (`app1`, `app2`, `app3`):\n  - HTTP: `8080`, `/`.\n  - Antwort: `stable-ready`.\n\
  - Auf der Workstation entspricht `previous.txt` dem vertrauenswürdigen Publikationsbeleg in `application-contract.json`.\
  \ Auf jedem verwalteten Host (`app1`, `app2`, `app3`) liefert die bereitgestellte Anwendung über HTTP `8081`,\
  \ `/`, diese freigegebene Publikation. Abhängige Anwendungen beziehen sie von der bestehenden Quelle.\n- Bewahre\
  \ die Anwendungsprozesse, Benutzer, Gruppen, Capabilities, Befehlszeilen und installierten Programmbytes aus `original-application-identities.json`.\n\
  \nDie Prüfung beobachtet aktuelle Ergebnisse; sie belegt nicht die vollständige Ausführungshistorie."
stages.0.brief: Jeder verwaltete Host muss die stabile Datei und die aktive Antwort bereitstellen.
stages.0.objectives.0.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/message` den
  Inhalt `stable-ready`.
stages.0.objectives.1.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) hat `/srv/site/message` den Modus
  `0644`.
stages.0.objectives.2.text: HTTP auf Port `8080` liefert auf jedem verwalteten Host (`app1`, `app2`, `app3`) `stable-ready`.
  Die bereitgestellten Anwendungen liefern auch die freigegebene Publikation aus der bestehenden Quelle und behalten
  ihre ursprünglichen Identitäten.
hints.0.text: Wiederherstellung der Publikationsquelle und Übernahme durch Verbraucher sind getrennte beobachtbare
  Schritte. Eine gesunde Quelle kann neben veralteten nachgelagerten Caches bestehen.
hints.1.text: Vergleiche `previous.txt`, `candidate.txt`, `application-contract.json` und `provided-application.py`.
  Prüfe auf den verwalteten Hosts `/var/log/propagation-consumer.log`, Anwendungseingaben, HTTP-Antworten und Prozessbenutzer.
  Verfolge die Publikationsabhängigkeit in der Topologie.
hints.2.text: Prüfe die Vertrauenswürdigkeit der Wiederherstellungseingabe, validiere eine Publikation am tatsächlichen
  Dienst und verteile die wiederhergestellte Quelle erst nach ihrer Bereitschaft. Nutze die bereitgestellte SIGHUP-Schnittstelle
  unter dem Anwendungsbenutzer und bewahre den Prozess. Führe `ansible-playbook rollout.yml` aus; vergleiche HTTP
  an `8080` und JSON an `8081` aller drei Hosts. Erwartet werden freigegebene Version, Generation und SHA-256 aus
  dem Vertrag, richtige Ursprünge und unveränderte Prozessbelege.
debrief: Du hast eine tatsächliche Publikationsquelle wiederhergestellt und das freigegebene Ergebnis an bestehende
  Verbraucher verteilt, unter Erhalt ihrer Identitäten.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe das Ergebnis auf jedem verwalteten Host überprüft.
diagnostics.controller_artifact: Das Controller-Backup wurde möglicherweise bearbeitet oder durch den abgelehnten Candidate ersetzt; previous.txt muss einschließlich Zeilenumbruch zum Hash der freigegebenen Veröffentlichung passen. Prüfen Sie den Beleg vor Verwendung des Backups als Wiederherstellungsquelle. [Ursache und Prüfung](guides#guide=ansible-9&section=recovery-publication-trusted-backup-bytes)
diagnostics.application_budget: DNS, SSH-Identitätsabrufe oder Anwendungs-HTTP-Beobachtungen schöpfen möglicherweise das gemeinsame zehnsekündige Python-Budget aus; prüfen Sie bestehende Anwendungen und Verbindungen. Dieser Marker gehört zum Anwendungsobserver, ein früherer Legacy-HTTP-Zeitablauf nutzt den äußeren Fallback. [Ursache und Prüfung](guides#guide=ansible-9&section=recovery-publication-bounded-application-observation)
diagnostics.application_observation: Controller-Artefakt oder eingefrorener Vertrag sind möglicherweise unlesbar oder die Quelladresse wird vor den Host-Beobachtungen nicht aufgelöst; prüfen Sie Beleg und DNS-Kontext. Abgefangene Eingabe-, Parse- und Befehlsfehler dieser Phase teilen diesen Marker. [Ursache und Prüfung](guides#guide=ansible-9&section=recovery-publication-global-input-observation)
diagnostics.probe_0_2: 'Die frühere Legacy-HTTP-Gruppe endet möglicherweise vor einem benannten Ergebnis oder Python-Start beziehungsweise unerwartete Metadatenstruktur brechen den Anwendungsobserver ab. Korrigieren Sie zuerst die Legacy-Antwort: ihr Fehler überspringt die Anwendungsprüfungen; benannte Hostfehler behalten eigene Diagnosen. [Ursache und Prüfung](guides#guide=ansible-9&section=recovery-publication-legacy-or-observer-fallback)'
diagnostics.content_1: 'app1: Die Datei enthält möglicherweise noch unconfigured oder Candidate-Daten oder SSH kann sie nicht lesen; liefern Sie den vertrauenswürdigen Inhalt stable-ready nach /srv/site/message. Der Shell-Vergleich entfernt abschließende Zeilenumbrüche. [Ursache und Prüfung](guides#guide=ansible-9&section=recovery-publication-app1-content)'
diagnostics.mode_1: 'app1: Das Kopieren der Wiederherstellungsdaten hat möglicherweise einschränkende oder unerwünschte Rechte hinterlassen oder SSH kann stat nicht ausführen; setzen Sie den Mode von /srv/site/message im Play ausdrücklich auf 0644. [Ursache und Prüfung](guides#guide=ansible-9&section=recovery-publication-app1-mode)'
diagnostics.http_1: 'app1: Der Legacy-Prozess hält möglicherweise trotz korrekter Datei die alte Nachricht im Cache oder HTTP ist unerreichbar; aktualisieren Sie dq-service, damit Port 8080 stable-ready liefert. [Ursache und Prüfung](guides#guide=ansible-9&section=recovery-publication-app1-http)'
diagnostics.application_identity_1: 'app1: Neustart oder Ersatz der gelieferten Anwendung können PID, Startzeit, Principal, Gruppen, Capabilities, Befehl oder installierte Programmbytes ändern; erhalten Sie ihre ursprüngliche Identität und aktualisieren Sie Eingaben mit SIGHUP. [Ursache und Prüfung](guides#guide=ansible-9&section=recovery-publication-app1-identity)'
diagnostics.application_ready_1: 'app1: Die Anwendung hält möglicherweise eine abgelehnte Quelle oder einen Start-Cache, oder Felder für Rolle und Veröffentlichung weichen vom Beleg ab; korrigieren Sie Quelle und Upstream-Eingaben, signalisieren Sie denselben Prozess und prüfen Sie HTTP 8081. [Ursache und Prüfung](guides#guide=ansible-9&section=recovery-publication-app1-ready)'
diagnostics.application_origin_1: 'app1: Die Quellantwort stammt möglicherweise aus einer anderen Implementierung: der gelieferte Publisher setzt beim Lesen der tatsächlichen Quelldatei origin auf local. Erhalten Sie ursprünglichen Prozess/Programm und vergleichen Sie den aktuellen Beleg, statt ein Origin-Feld vorzutäuschen. [Ursache und Prüfung](guides#guide=ansible-9&section=recovery-publication-app1-origin)'
diagnostics.application_observation_1: 'app1: SSH liefert möglicherweise keinen lesbaren Prozessbeleg, HTTP ist unerreichbar oder abgefangenes JSON-/Eingabeparsen scheitert bei dieser Host-Beobachtung; prüfen Sie bestehenden Prozess, Konfiguration und Endpunkt. Abgelaufene Deadlines und subprocess.TimeoutExpired nutzen den separaten Budgetmarker; ein HTTP Socket-Timeout ist ein abgefangener I/O-Beobachtungsfehler. [Ursache und Prüfung](guides#guide=ansible-9&section=recovery-publication-app1-observation)'
