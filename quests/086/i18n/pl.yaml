title: Blok rescue
brief: "Po nieudanym wdrożeniu kandydata flota potrzebuje stabilnego banera.\n\nPracuj na workstation w `~/quest`\
  \ z plikami `inventory.ini`, `ansible.cfg`, `rollout.yml`. Dodatkowe pliki na stacji roboczej w `~/quest`: `previous.txt`,\
  \ `candidate.txt`, `application-contract.json`, `provided-application.py`, `original-application-identities.json`.\n\
  \n**Wymagania:**\n- Plik na każdym zarządzanym hoście (`app1`, `app2`, `app3`):\n  - Ścieżka: `/srv/site/message`.\n\
  \  - Treść: `stable-ready`.\n  - Tryb dostępu: `0644`.\n- Aktywna usługa na każdym zarządzanym hoście (`app1`,\
  \ `app2`, `app3`):\n  - HTTP: `8080`, `/`.\n  - Odpowiedź: `stable-ready`.\n- Na stacji roboczej `previous.txt`\
  \ odpowiada zaufanemu potwierdzeniu publikacji w `application-contract.json`. Na każdym zarządzanym hoście (`app1`,\
  \ `app2`, `app3`) dostarczona aplikacja udostępnia tę zatwierdzoną publikację przez HTTP `8081`, `/`. Zależne\
  \ aplikacje pobierają ją z istniejącego źródła.\n- Zachowaj procesy aplikacji, konta, grupy, capabilities, wiersze\
  \ poleceń i bajty zainstalowanego programu z `original-application-identities.json`.\n\nSprawdzenie obserwuje\
  \ bieżące wyniki; nie ustala pełnej historii wykonania."
stages.0.brief: Każdy zarządzany host musi udostępniać stabilny plik i aktywną odpowiedź.
stages.0.objectives.0.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/message` zawiera
  `stable-ready`.
stages.0.objectives.1.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) ścieżka `/srv/site/message` ma
  tryb `0644`.
stages.0.objectives.2.text: HTTP na porcie `8080` zwraca `stable-ready` na każdym zarządzanym hoście (`app1`, `app2`,
  `app3`). Dostarczone aplikacje udostępniają także zatwierdzoną publikację z istniejącego źródła, zachowując oryginalne
  tożsamości.
hints.0.text: Odzyskanie źródła publikacji i przyjęcie danych przez konsumentów to oddzielne obserwowalne kroki.
  Poprawne źródło może współistnieć z nieaktualnymi pamięciami zależnych aplikacji.
hints.1.text: |-
  Porównaj `previous.txt`, `candidate.txt`, `application-contract.json` i `provided-application.py`. Na zarządzanych hostach sprawdź `/var/log/propagation-consumer.log`, wejścia aplikacji, odpowiedzi HTTP i konta procesów. Prześledź zależność publikacji w topologii.

  Odszukaj wejście odzyskiwania i jego walidację w playbooku. Sprawdź tożsamości procesów i rolę źródła lub odbiorcy na każdym hoście, a następnie porównaj bieżące wydanie i metadane.
hints.2.text: |-
  Uruchom `ansible-playbook rollout.yml`; porównaj HTTP na `8080` i JSON na `8081` trzech hostów. Oczekuj zatwierdzonej wersji, generacji i SHA-256 z kontraktu, poprawnych źródeł i niezmiennych zapisów procesów.

  ```sh
  for number in 1 2 3; do
    host="app${number}-${DQ_NAMESPACE#dq-}"
    printf '%s\n' "$host"
    curl -fsS --max-time 3 "http://$host:8080/"
    curl -fsS --max-time 3 "http://$host:8081/"
    printf '\n'
  done
  python3 -I - <<'VERIFY_PUBLICATION'
  import hashlib
  import http.client
  import json
  import os
  import shlex
  import socket
  import subprocess
  from pathlib import Path
  from urllib.parse import urlsplit

  contract = json.loads(Path("application-contract.json").read_text())
  wanted = contract["publication"]
  assert hashlib.sha256(Path(contract["controllerArtifact"]).read_bytes()).hexdigest() == wanted["sha256"]
  headers = {}
  if contract["authentication"]:
      import yaml
      token = yaml.safe_load(Path("credentials.yml").read_text())["reader_token"]
      assert isinstance(token, str) and token and all(33 <= ord(char) < 127 for char in token)
      headers = {"Authorization": "Bearer " + token}

  suffix = os.environ["DQ_NAMESPACE"].removeprefix("dq-")
  source = contract["sourceHost"] + "-" + suffix
  port = contract["port"]
  def addresses(host):
      return {item[4][0] for item in socket.getaddrinfo(host, port, type=socket.SOCK_STREAM)}

  identity_probe = '''
  import hashlib,json,sys
  from pathlib import Path
  process=json.loads(sys.argv[1])
  pid=Path(process["pidFile"]).read_text().strip()
  root=Path("/proc")/pid
  status=dict(line.split(":",1) for line in (root/"status").read_text().splitlines() if ":" in line)
  print(json.dumps({
      "pid":pid,"starttime":(root/"stat").read_text().rsplit(") ",1)[1].split()[19],
      "uid":status["Uid"].split(),"gid":status["Gid"].split(),"groups":status["Groups"].split(),
      "caps":{key:status[key].strip() for key in ("CapInh","CapPrm","CapEff","CapBnd","CapAmb")},
      "code":hashlib.sha256(Path(process["programPath"]).read_bytes()).hexdigest(),
      "command_sha256":hashlib.sha256((root/"cmdline").read_bytes()).hexdigest(),
  }))
  '''
  original = json.loads(Path("original-application-identities.json").read_text())
  process = contract["process"]
  remote = "/usr/bin/python3 -I -c " + shlex.quote(identity_probe) + " " + shlex.quote(json.dumps(process))
  for host, role in contract["roles"].items():
      address = host + "-" + suffix
      identity = json.loads(subprocess.check_output(
          ["ssh", "-n", "-o", "BatchMode=yes", "-o", "ConnectTimeout=3", "-p", "2222", "root@" + address, remote],
          timeout=5))
      baseline = original[host][process["name"]]
      fields = ("pid", "starttime", "uid", "gid", "groups", "caps", "code")
      assert all(identity[key] == baseline[key] for key in fields)
      command_bytes = chr(0).join(baseline["command"]).encode()
      assert identity["command_sha256"] == hashlib.sha256(command_bytes).hexdigest()
      connection = http.client.HTTPConnection(address, port, timeout=3)
      try:
          connection.request("GET", "/", headers=headers)
          response = connection.getresponse()
          assert response.status == 200
          observed = json.loads(response.read(65536))
      finally:
          connection.close()
      assert observed["ready"] is True and observed["role"] == role
      data = observed["data"]
      assert all(data.get(key) == value for key, value in wanted.items())
      if host == contract["sourceHost"]:
          assert data["origin"] == "local"
      else:
          origin = urlsplit(data["origin"])
          assert origin.scheme == "http" and origin.port == port and origin.hostname
          assert addresses(origin.hostname) & addresses(source)
      print(host + ": publication matches")
  VERIFY_PUBLICATION
  ```
debrief: Odzyskano rzeczywiste źródło publikacji i świadomie przekazano zatwierdzony wynik istniejącym konsumentom,
  zachowując ich tożsamości.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem wynik na każdym zarządzanym hoście.
diagnostics.controller_artifact: Kopia na kontrolerze mogła zostać zmieniona lub zastąpiona odrzuconym candidate; previous.txt ma odpowiadać hash zatwierdzonej publikacji, wraz z nową linią. Sprawdź potwierdzenie przed użyciem kopii jako źródła naprawy. [Przyczyna i kontrola](guides#guide=ansible-9&section=recovery-publication-trusted-backup-bytes)
diagnostics.application_budget: DNS, odczyty tożsamości SSH lub obserwacje HTTP mogą wyczerpać wspólny dziesięciosekundowy budżet Python; sprawdź istniejące aplikacje i połączenia. Marker należy do obserwatora aplikacji, wcześniejszy limit legacy HTTP daje zewnętrzny fallback. [Przyczyna i kontrola](guides#guide=ansible-9&section=recovery-publication-bounded-application-observation)
diagnostics.application_observation: Artefakt kontrolera lub zamrożony contract może być nieczytelny albo adres źródła nie rozwiązuje się przed obserwacją hostów; sprawdź potwierdzenie i kontekst DNS. Obsłużone błędy wejść, parsowania i poleceń tej fazy dzielą marker. [Przyczyna i kontrola](guides#guide=ansible-9&section=recovery-publication-global-input-observation)
diagnostics.probe_0_2: 'Wcześniejsza grupa legacy HTTP może zakończyć się przed nazwanym wynikiem albo start Python lub nieoczekiwana struktura metadata przerywa obserwator aplikacji. Najpierw popraw odpowiedź legacy: jej błąd pomija kontrole aplikacji; nazwane błędy hostów zachowują diagnostykę. [Przyczyna i kontrola](guides#guide=ansible-9&section=recovery-publication-legacy-or-observer-fallback)'
diagnostics.content_1: 'app1: Plik może nadal zawierać unconfigured lub candidate albo SSH nie odczytuje go; dostarcz zaufane stable-ready do /srv/site/message. Porównanie shell usuwa końcowe znaki nowej linii. [Przyczyna i kontrola](guides#guide=ansible-9&section=recovery-publication-app1-content)'
diagnostics.mode_1: 'app1: Kopiowanie danych naprawy mogło pozostawić ograniczające lub przypadkowe prawa albo SSH nie wykonuje stat; jawnie ustaw mode 0644 dla /srv/site/message w play. [Przyczyna i kontrola](guides#guide=ansible-9&section=recovery-publication-app1-mode)'
diagnostics.http_1: 'app1: Proces legacy może zachować starą wiadomość mimo poprawnego pliku albo HTTP jest niedostępne; odśwież dq-service, aby port 8080 zwracał stable-ready. [Przyczyna i kontrola](guides#guide=ansible-9&section=recovery-publication-app1-http)'
diagnostics.application_identity_1: 'app1: Restart lub zastąpienie aplikacji może zmienić PID, czas startu, principal, grupy, capabilities, komendę lub bajty programu; zachowaj pierwotną tożsamość i odświeżaj wejścia przez SIGHUP. [Przyczyna i kontrola](guides#guide=ansible-9&section=recovery-publication-app1-identity)'
diagnostics.application_ready_1: 'app1: Aplikacja może zachować odrzucone źródło lub cache startowy albo role/publication różnią się od potwierdzenia; napraw źródło i upstream, potem wyślij sygnał do tego samego procesu i sprawdź HTTP 8081. [Przyczyna i kontrola](guides#guide=ansible-9&section=recovery-publication-app1-ready)'
diagnostics.application_origin_1: 'app1: Odpowiedź źródła może pochodzić z innej implementacji: dostarczony publisher ustawia origin=local przy odczycie rzeczywistego pliku. Zachowaj pierwotny proces/program i porównaj żywe potwierdzenie zamiast fałszować origin. [Przyczyna i kontrola](guides#guide=ansible-9&section=recovery-publication-app1-origin)'
diagnostics.application_observation_1: 'app1: SSH może nie zwrócić czytelnego potwierdzenia procesu, HTTP być nieosiągalne lub obsłużone parsowanie JSON/wejść zawieść podczas obserwacji hosta; sprawdź proces, konfigurację i endpoint. Wyczerpanie deadline i subprocess.TimeoutExpired dają osobny marker budżetu; HTTP socket timeout jest obsłużonym błędem obserwacji I/O. [Przyczyna i kontrola](guides#guide=ansible-9&section=recovery-publication-app1-observation)'
