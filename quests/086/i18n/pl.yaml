title: Blok rescue
brief: 'Dołączyłeś do operacji SignalRail. Odzyskaj poprzedni baner po nieudanej weryfikacji. Pracuj w
  ~/quest. Wszystkie zmiany przechowuj w tej komorze szkoleniowej.


  Wejścia w `~/quest`: `inventory.ini`, `ansible.cfg`, `rollout.yml`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Wszystkie zmiany muszą pozostać w tej zatoce.


  Początkowe kryteria sukcesu: wszystkie trzy pliki message zawierają stable-ready, tryb 0644, a wszystkie
  aktywne banery HTTP zwracają stable-ready.'
stages.0.brief: 'Weryfikacja celowo kończy się niepowodzeniem. Użyj rescue, aby dostarczyć stable-ready
  i ponownie załaduj buforowane banner na każdym hoście.


  Kryteria sukcesu: wszystkie trzy pliki message zawierają stable-ready, tryb 0644, a wszystkie aktywne
  banery HTTP zwracają stable-ready.'
stages.0.objectives.0.text: Wszystkie trzy pliki message zawierają stable-ready, tryb 0644, a wszystkie
  aktywne banery HTTP zwracają stable-ready.
hints.0.text: Walidacja candidate celowo kończy się niepowodzeniem.
hints.1.text: Blok ratunkowy musi przywrócić stabilny plik, a nie tylko zarejestrować błąd.
hints.2.text: Skopiuj stable-ready do rescue i powiadom reload handler; sprawdź wszystkie aktualne odpowiedzi
  HTTP.
debrief: Validation celowo zawiódł po candidate rollout. Użyłeś rescue do przywrócenia stable-ready i
  ponownego załadowania aktywnej usługi.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem wynik na każdym zarządzanym hoście.
