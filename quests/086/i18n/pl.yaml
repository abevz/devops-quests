title: Blok rescue
brief: "Po nieudanym wdrożeniu kandydata flota potrzebuje stabilnego banera.\n\nPracuj na workstation w `~/quest`\
  \ z plikami `inventory.ini`, `ansible.cfg`, `rollout.yml`. Dodatkowe pliki na stacji roboczej w `~/quest`: `previous.txt`,\
  \ `candidate.txt`, `application-contract.json`, `provided-application.py`, `original-application-identities.json`.\n\
  \n**Wymagania:**\n- Plik na każdym zarządzanym hoście (`app1`, `app2`, `app3`):\n  - Ścieżka: `/srv/site/message`.\n\
  \  - Treść: `stable-ready`.\n  - Tryb dostępu: `0644`.\n- Aktywna usługa na każdym zarządzanym hoście (`app1`,\
  \ `app2`, `app3`):\n  - HTTP: `8080`, `/`.\n  - Odpowiedź: `stable-ready`.\n- Na stacji roboczej `previous.txt`\
  \ odpowiada zaufanemu potwierdzeniu publikacji w `application-contract.json`. Na każdym zarządzanym hoście (`app1`,\
  \ `app2`, `app3`) dostarczona aplikacja udostępnia tę zatwierdzoną publikację przez HTTP `8081`, `/`. Zależne\
  \ aplikacje pobierają ją z istniejącego źródła.\n- Zachowaj procesy aplikacji, konta, grupy, capabilities, wiersze\
  \ poleceń i bajty zainstalowanego programu z `original-application-identities.json`.\n\nSprawdzenie obserwuje\
  \ bieżące wyniki; nie ustala pełnej historii wykonania."
stages.0.brief: Każdy zarządzany host musi udostępniać stabilny plik i aktywną odpowiedź.
stages.0.objectives.0.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/message` zawiera
  `stable-ready`.
stages.0.objectives.1.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) ścieżka `/srv/site/message` ma
  tryb `0644`.
stages.0.objectives.2.text: HTTP na porcie `8080` zwraca `stable-ready` na każdym zarządzanym hoście (`app1`, `app2`,
  `app3`). Dostarczone aplikacje udostępniają także zatwierdzoną publikację z istniejącego źródła, zachowując oryginalne
  tożsamości.
hints.0.text: Odzyskanie źródła publikacji i przyjęcie danych przez konsumentów to oddzielne obserwowalne kroki.
  Poprawne źródło może współistnieć z nieaktualnymi pamięciami zależnych aplikacji.
hints.1.text: Porównaj `previous.txt`, `candidate.txt`, `application-contract.json` i `provided-application.py`.
  Na zarządzanych hostach sprawdź `/var/log/propagation-consumer.log`, wejścia aplikacji, odpowiedzi HTTP i konta
  procesów. Prześledź zależność publikacji w topologii.
hints.2.text: Zweryfikuj zaufanie do wejścia odzyskiwania, sprawdzaj próbę publikacji rzeczywistą usługą i propaguj
  odzyskane źródło po osiągnięciu gotowości. Korzystaj z dostarczonego interfejsu SIGHUP jako użytkownik aplikacji,
  zachowując proces. Uruchom `ansible-playbook rollout.yml`; porównaj HTTP na `8080` i JSON na `8081` trzech hostów.
  Oczekuj zatwierdzonej wersji, generacji i SHA-256 z kontraktu, poprawnych źródeł i niezmiennych zapisów procesów.
debrief: Odzyskano rzeczywiste źródło publikacji i świadomie przekazano zatwierdzony wynik istniejącym konsumentom,
  zachowując ich tożsamości.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem wynik na każdym zarządzanym hoście.
