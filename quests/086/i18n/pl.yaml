title: Blok rescue
brief: |-
  Po nieudanym wdrożeniu kandydata flota potrzebuje stabilnego banera.

  Pracuj na workstation w `~/quest` z plikami `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Wymagania:**
  - Plik na każdym zarządzanym hoście (`app1`, `app2`, `app3`):
    - Ścieżka: `/srv/site/message`.
    - Treść: `stable-ready`.
    - Tryb dostępu: `0644`.
  - Aktywna usługa na każdym zarządzanym hoście (`app1`, `app2`, `app3`):
    - HTTP: `8080`, `/`.
    - Odpowiedź: `stable-ready`.

  **Sprawdź przed Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/message'` — Pokazuje `stable-ready` z `app1`, `app2`, `app3`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/site/message'` — Pokazuje `-rw-r--r--` na każdym hoście.
  - `for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done` — Pokazuje `stable-ready` z `app1`, `app2`, `app3`.
stages.0.brief: Każdy zarządzany host musi udostępniać stabilny plik i aktywną odpowiedź.
stages.0.objectives.0.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/message` zawiera
  `stable-ready`.
stages.0.objectives.1.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) ścieżka `/srv/site/message` ma
  tryb `0644`.
stages.0.objectives.2.text: HTTP na porcie `8080` zwraca `stable-ready` na każdym zarządzanym hoście (`app1`, `app2`,
  `app3`).
hints.0.text: Walidacja candidate celowo kończy się niepowodzeniem.
hints.1.text: Blok ratunkowy musi przywrócić stabilny plik, a nie tylko zarejestrować błąd.
hints.2.text: Skopiuj stable-ready do rescue i powiadom reload handler; sprawdź wszystkie aktualne odpowiedzi HTTP.
debrief: Validation celowo zawiódł po candidate rollout. Użyłeś rescue do przywrócenia stable-ready i ponownego
  załadowania aktywnej usługi.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem wynik na każdym zarządzanym hoście.
