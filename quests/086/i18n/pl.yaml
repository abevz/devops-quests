diagnostics.application_origin_2: 'app2: Aplikacja zależna może czytać inny host lub endpoint legacy; jej origin ma rozwiązywać się do istniejącego źródła app1 i używać portu HTTP 8081. Alias DNS źródła lub jego IP są dopuszczalne. [Przyczyna i kontrola](guides#guide=ansible-9&section=recovery-publication-app2-origin)'
