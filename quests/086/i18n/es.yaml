title: Bloque rescue
brief: 'Te uniste a las operaciones de SignalRail. Recuperar el banner anterior tras una validación fallida.
  Trabajar en ~/quest. Mantenga todos los cambios dentro de esta bahía de entrenamiento.


  Entradas en `~/quest`: `inventory.ini`, `ansible.cfg`, `rollout.yml`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente los archivos suministrados, las imágenes
  precargadas y los servicios privados. Todos los cambios deben permanecer dentro de esta bahía.


  Criterios de éxito iniciales: los tres archivos message contienen stable-ready, modo 0644, y todos los
  banners activos HTTP devuelven stable-ready.'
stages.0.brief: 'La validación falla deliberadamente. Utilice rescue para entregar stable-ready y recargar
  el banner almacenado en caché en cada host.


  Criterios de éxito: los tres archivos message contienen stable-ready, modo 0644, y todos los banners
  activos HTTP devuelven stable-ready.'
stages.0.objectives.0.text: Los tres archivos message contienen stable-ready, modo 0644, y todos los banners
  HTTP activos devuelven stable-ready.
hints.0.text: La validación candidate falla deliberadamente.
hints.1.text: Un bloque de rescate debe restaurar el archivo estable, no solo registrar el error.
hints.2.text: Copie stable-ready en rescue y notifique al reload handler; verifique todas las respuestas
  HTTP en vivo.
debrief: Validation falló deliberadamente después de un candidate rollout. Usó rescue para restaurar stable-ready
  y recargar el servicio en vivo.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el resultado en cada host administrado.
