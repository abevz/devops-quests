title: Bloque rescue
brief: |-
  La flota necesita el banner estable tras un despliegue candidato fallido.

  Trabaja en la workstation en `~/quest` con `inventory.ini`, `ansible.cfg`, `rollout.yml`.

  **Requisitos:**
  - Archivo en cada host administrado (`app1`, `app2`, `app3`):
    - Ruta: `/srv/site/message`.
    - Contenido: `stable-ready`.
    - Modo de acceso: `0644`.
  - Servicio activo en cada host administrado (`app1`, `app2`, `app3`):
    - HTTP: `8080`, `/`.
    - Respuesta: `stable-ready`.

  **Verifica antes de Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/message'` — Muestra `stable-ready` de `app1`, `app2`, `app3`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/site/message'` — Muestra `-rw-r--r--` en cada host.
  - `for h in app1 app2 app3; do curl -fsS --max-time 3 "http://$h-${DQ_NAMESPACE#dq-}:8080"; printf "\n"; done` — Muestra `stable-ready` de `app1`, `app2`, `app3`.
stages.0.brief: Cada host administrado debe ofrecer el archivo estable y la respuesta activa.
stages.0.objectives.0.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` contiene `stable-ready`.
stages.0.objectives.1.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` tiene el modo
  `0644`.
stages.0.objectives.2.text: HTTP en el puerto `8080` devuelve `stable-ready` en cada host administrado (`app1`,
  `app2`, `app3`).
hints.0.text: La validación candidate falla deliberadamente.
hints.1.text: Un bloque de rescate debe restaurar el archivo estable, no solo registrar el error.
hints.2.text: Copie stable-ready en rescue y notifique al reload handler; verifique todas las respuestas HTTP en
  vivo.
debrief: Validation falló deliberadamente después de un candidate rollout. Usó rescue para restaurar stable-ready
  y recargar el servicio en vivo.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el resultado en cada host administrado.
