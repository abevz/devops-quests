diagnostics.application_origin_2: 'app2: La aplicación dependiente puede consumir otro host o endpoint legacy; su origin debe resolver a fuente app1 existente y usar puerto HTTP 8081. Se acepta alias DNS fuente o su IP. [Causa y comprobación](guides#guide=ansible-9&section=recovery-publication-app2-origin)'
