title: Bloque rescue
brief: "La flota necesita el banner estable tras un despliegue candidato fallido.\n\nTrabaja en la workstation en\
  \ `~/quest` con `inventory.ini`, `ansible.cfg`, `rollout.yml`. Archivos adicionales en la estación de trabajo,\
  \ en `~/quest`: `previous.txt`, `candidate.txt`, `application-contract.json`, `provided-application.py`, `original-application-identities.json`.\n\
  \n**Requisitos:**\n- Archivo en cada host administrado (`app1`, `app2`, `app3`):\n  - Ruta: `/srv/site/message`.\n\
  \  - Contenido: `stable-ready`.\n  - Modo de acceso: `0644`.\n- Servicio activo en cada host administrado (`app1`,\
  \ `app2`, `app3`):\n  - HTTP: `8080`, `/`.\n  - Respuesta: `stable-ready`.\n- En la estación de trabajo, `previous.txt`\
  \ coincide con el recibo fiable de publicación de `application-contract.json`. En cada host administrado (`app1`,\
  \ `app2`, `app3`), la aplicación proporcionada sirve esa publicación aprobada mediante HTTP `8081`, `/`. Las aplicaciones\
  \ dependientes la consumen desde la fuente existente.\n- Conserva los procesos, usuarios, grupos, capacidades,\
  \ líneas de órdenes y bytes instalados originales de `original-application-identities.json`.\n\nLa comprobación\
  \ observa los resultados actuales; no establece todo el historial de ejecución."
stages.0.brief: Cada host administrado debe ofrecer el archivo estable y la respuesta activa.
stages.0.objectives.0.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` contiene `stable-ready`.
stages.0.objectives.1.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` tiene el modo
  `0644`.
stages.0.objectives.2.text: HTTP en el puerto `8080` devuelve `stable-ready` en cada host administrado (`app1`,
  `app2`, `app3`). Las aplicaciones proporcionadas también sirven la publicación aprobada desde la fuente existente
  conservando sus identidades originales.
hints.0.text: La recuperación de la fuente y la adopción por los consumidores son pasos observables separados. Una
  fuente correcta puede coexistir con cachés dependientes obsoletas.
hints.1.text: |-
  Compara `previous.txt`, `candidate.txt`, `application-contract.json` y `provided-application.py`. En los hosts administrados, revisa `/var/log/propagation-consumer.log`, entradas de las aplicaciones, respuestas HTTP y usuarios de los procesos. Sigue la dependencia de publicación en la topología.

  Localiza la entrada de recuperación y su validación en el playbook. Revisa las identidades de proceso y el papel de origen o dependiente de cada host antes de comparar la versión y los metadatos.
hints.2.text: |-
  Ejecuta `ansible-playbook rollout.yml`; compara HTTP en `8080` y JSON en `8081` de los tres hosts. Espera versión, generación y SHA-256 aprobados del contrato, orígenes correctos y registros de procesos sin cambios.

  ```sh
  for number in 1 2 3; do
    host="app${number}-${DQ_NAMESPACE#dq-}"
    printf '%s\n' "$host"
    curl -fsS --max-time 3 "http://$host:8080/"
    curl -fsS --max-time 3 "http://$host:8081/"
    printf '\n'
  done
  python3 -I - <<'VERIFY_PUBLICATION'
  import hashlib
  import http.client
  import json
  import os
  import shlex
  import socket
  import subprocess
  from pathlib import Path
  from urllib.parse import urlsplit

  contract = json.loads(Path("application-contract.json").read_text())
  wanted = contract["publication"]
  assert hashlib.sha256(Path(contract["controllerArtifact"]).read_bytes()).hexdigest() == wanted["sha256"]
  headers = {}
  if contract["authentication"]:
      import yaml
      token = yaml.safe_load(Path("credentials.yml").read_text())["reader_token"]
      assert isinstance(token, str) and token and all(33 <= ord(char) < 127 for char in token)
      headers = {"Authorization": "Bearer " + token}

  suffix = os.environ["DQ_NAMESPACE"].removeprefix("dq-")
  source = contract["sourceHost"] + "-" + suffix
  port = contract["port"]
  def addresses(host):
      return {item[4][0] for item in socket.getaddrinfo(host, port, type=socket.SOCK_STREAM)}

  identity_probe = '''
  import hashlib,json,sys
  from pathlib import Path
  process=json.loads(sys.argv[1])
  pid=Path(process["pidFile"]).read_text().strip()
  root=Path("/proc")/pid
  status=dict(line.split(":",1) for line in (root/"status").read_text().splitlines() if ":" in line)
  print(json.dumps({
      "pid":pid,"starttime":(root/"stat").read_text().rsplit(") ",1)[1].split()[19],
      "uid":status["Uid"].split(),"gid":status["Gid"].split(),"groups":status["Groups"].split(),
      "caps":{key:status[key].strip() for key in ("CapInh","CapPrm","CapEff","CapBnd","CapAmb")},
      "code":hashlib.sha256(Path(process["programPath"]).read_bytes()).hexdigest(),
      "command_sha256":hashlib.sha256((root/"cmdline").read_bytes()).hexdigest(),
  }))
  '''
  original = json.loads(Path("original-application-identities.json").read_text())
  process = contract["process"]
  remote = "/usr/bin/python3 -I -c " + shlex.quote(identity_probe) + " " + shlex.quote(json.dumps(process))
  for host, role in contract["roles"].items():
      address = host + "-" + suffix
      identity = json.loads(subprocess.check_output(
          ["ssh", "-n", "-o", "BatchMode=yes", "-o", "ConnectTimeout=3", "-p", "2222", "root@" + address, remote],
          timeout=5))
      baseline = original[host][process["name"]]
      fields = ("pid", "starttime", "uid", "gid", "groups", "caps", "code")
      assert all(identity[key] == baseline[key] for key in fields)
      command_bytes = chr(0).join(baseline["command"]).encode()
      assert identity["command_sha256"] == hashlib.sha256(command_bytes).hexdigest()
      connection = http.client.HTTPConnection(address, port, timeout=3)
      try:
          connection.request("GET", "/", headers=headers)
          response = connection.getresponse()
          assert response.status == 200
          observed = json.loads(response.read(65536))
      finally:
          connection.close()
      assert observed["ready"] is True and observed["role"] == role
      data = observed["data"]
      assert all(data.get(key) == value for key, value in wanted.items())
      if host == contract["sourceHost"]:
          assert data["origin"] == "local"
      else:
          origin = urlsplit(data["origin"])
          assert origin.scheme == "http" and origin.port == port and origin.hostname
          assert addresses(origin.hostname) & addresses(source)
      print(host + ": publication matches")
  VERIFY_PUBLICATION
  ```
debrief: Recuperaste una fuente real y propagaste deliberadamente la publicación aprobada a consumidores existentes
  conservando sus identidades.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el resultado en cada host administrado.
diagnostics.controller_artifact: La copia del controlador puede editarse o reemplazarse por candidate rechazado; previous.txt debe coincidir con hash aprobado, incluido salto final. Verifique recibo antes de usar copia como fuente de recuperación. [Causa y comprobación](guides#guide=ansible-9&section=recovery-publication-trusted-backup-bytes)
diagnostics.application_budget: DNS, lecturas de identidad SSH u observaciones HTTP pueden agotar presupuesto Python compartido de diez segundos; inspeccione aplicaciones y conexiones existentes. Este marcador corresponde al observador de aplicaciones; timeout previo de HTTP legacy usa fallback exterior. [Causa y comprobación](guides#guide=ansible-9&section=recovery-publication-bounded-application-observation)
diagnostics.application_observation: Artefacto controlador o contract congelado pueden ser ilegibles o no resolverse dirección fuente antes de observar hosts; inspeccione recibo y contexto DNS. Errores capturados de entradas, análisis y comandos en esta fase comparten marcador. [Causa y comprobación](guides#guide=ansible-9&section=recovery-publication-global-input-observation)
diagnostics.probe_0_2: 'Grupo HTTP legacy previo puede detenerse antes de resultado nombrado, o inicio Python o estructura metadata inesperada abortar observador. Corrija primero respuesta legacy: su fallo omite controles de aplicaciones; errores nombrados por host conservan diagnósticos. [Causa y comprobación](guides#guide=ansible-9&section=recovery-publication-legacy-or-observer-fallback)'
diagnostics.content_1: 'app1: El archivo puede conservar unconfigured o candidate, o fallar lectura SSH; entregue stable-ready confiable en /srv/site/message. Comparación shell elimina saltos finales. [Causa y comprobación](guides#guide=ansible-9&section=recovery-publication-app1-content)'
diagnostics.mode_1: 'app1: Copiar datos de recuperación puede dejar permisos restrictivos o imprevistos, o fallar stat SSH; fije explícitamente mode 0644 de /srv/site/message en play. [Causa y comprobación](guides#guide=ansible-9&section=recovery-publication-app1-mode)'
diagnostics.http_1: 'app1: El proceso legacy puede almacenar mensaje antiguo con archivo correcto, o HTTP estar indisponible; actualice dq-service para devolver stable-ready en puerto 8080. [Causa y comprobación](guides#guide=ansible-9&section=recovery-publication-app1-http)'
diagnostics.application_identity_1: 'app1: Reiniciar o reemplazar aplicación puede cambiar PID, inicio, principal, grupos, capabilities, comando o bytes del programa; conserve identidad original y actualice entradas con SIGHUP. [Causa y comprobación](guides#guide=ansible-9&section=recovery-publication-app1-identity)'
diagnostics.application_ready_1: 'app1: La aplicación puede conservar fuente rechazada o caché inicial, o diferir role/publication del recibo; repare fuente y upstream, señale mismo proceso y verifique HTTP 8081. [Causa y comprobación](guides#guide=ansible-9&section=recovery-publication-app1-ready)'
diagnostics.application_origin_1: 'app1: La respuesta fuente puede venir de otra implementación: publisher suministrado fija origin=local al leer archivo real. Conserve proceso/programa original y compare recibo vivo sin falsificar origin. [Causa y comprobación](guides#guide=ansible-9&section=recovery-publication-app1-origin)'
diagnostics.application_observation_1: 'app1: SSH puede no devolver recibo legible, HTTP ser inalcanzable o fallar análisis capturado JSON/entradas durante observación del host; inspeccione proceso, configuración y endpoint. Deadline agotado y subprocess.TimeoutExpired usan marcador budget separado; HTTP socket timeout es error I/O capturado de observación. [Causa y comprobación](guides#guide=ansible-9&section=recovery-publication-app1-observation)'
diagnostics.content_2: 'app2: El archivo puede conservar unconfigured o candidate, o fallar lectura SSH; entregue stable-ready confiable en /srv/site/message. Comparación shell elimina saltos finales. [Causa y comprobación](guides#guide=ansible-9&section=recovery-publication-app2-content)'
diagnostics.mode_2: 'app2: Copiar datos de recuperación puede dejar permisos restrictivos o imprevistos, o fallar stat SSH; fije explícitamente mode 0644 de /srv/site/message en play. [Causa y comprobación](guides#guide=ansible-9&section=recovery-publication-app2-mode)'
diagnostics.http_2: 'app2: El proceso legacy puede almacenar mensaje antiguo con archivo correcto, o HTTP estar indisponible; actualice dq-service para devolver stable-ready en puerto 8080. [Causa y comprobación](guides#guide=ansible-9&section=recovery-publication-app2-http)'
