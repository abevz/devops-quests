title: Auditoría Vault
brief: 'El juego reader recibió una denegación de permiso real Vault. La auditoría de archivos está habilitada
  con log_raw=false; backend exporta solo metadatos de denegación incluidos en la lista permitida a audit-events.json
  y los congela en /run/dq/facts/0/. Raw audit records, los campos de autenticación y los valores secretos
  permanecen fuera de workstation. Identifique la solicitud denegada en incident.json con exactamente
  request_id, ruta, operation y reason. Luego repare reader.hcl para dispatch de solo lectura y actualice
  ese juego policy. No copie tokens ni valores secretos en su registro de incidentes.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `platform.env`, `audit-events.json`,
  `incident.json`, `reader.hcl`, `reader-policy.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: el incidente coincide exactamente con los metadatos de denegación reales
  congelados; el reader puede leer dispatch y se le niega la administración no relacionada de secrets
  y audit.'
debrief: Se diagnosticó una solicitud denegada a través de audit metadata real mientras que los secretos
  permanecían fuera del artefacto del incidente.
