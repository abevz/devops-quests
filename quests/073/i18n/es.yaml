title: Auditoría Vault
brief: 'Recupera el acceso de la aplicación a su publicación KV sin ampliar los permisos reader. Correlaciona la
  denegación inicial y la de la aplicación en `consumer-incident.json`, bajo `baseline` y `application`, cada una
  con solo los cuatro campos exportados. El `incident.json` original conserva la primera solicitud.


  Trabaja en `~/quest`. El directorio del consumidor contiene configuración, PID y registro. `consumer/README.md`
  describe la interfaz; `consumer-contract.json` registra los procesos originales, la fuente aprobada, el resumen
  de publicación y la versión. Conserva programas, identidades y privilegios originales. Cada consumidor debe servir
  la publicación aprobada desde la fuente original con la identidad privada reader suministrada. Una consulta manual
  a la fuente no basta. Las credenciales deben ser archivos regulares del usuario workstation con modo `0600`. No
  imprimas secretos ni credenciales.


  **Requisitos:**


  - Ambas denegaciones se correlacionan solo mediante metadatos exportados; incident sigue identificando la solicitud
  inicial.

  - La identidad reader suministrada puede leer los datos dispatch existentes e informa `deny` para las pruebas
  de `secret/data/other` y `sys/audit`.

  - La aplicación original adopta y sirve la publicación aprobada con la identidad privada reader suministrada.'
debrief: Se conservaron las identidades de fuente y consumidores; las aplicaciones adoptaron la publicación aprobada.
stages.0.brief: Recupera el acceso de la aplicación a su publicación KV sin ampliar los permisos reader. Correlaciona
  la denegación inicial y la de la aplicación en `consumer-incident.json`, bajo `baseline` y `application`, cada
  una con solo los cuatro campos exportados. El `incident.json` original conserva la primera solicitud.
hints.0.text: Disponibilidad del servidor, autorización y publicación adoptada por el consumidor son observaciones
  distintas.
hints.1.text: 'Compara respuesta real, perfiles de fuente, registros y contrato original. Sigue primero el límite
  que falla.


  ```bash

  cat consumer/source.json consumer/application.log consumer-contract.json

  curl -fsS --max-time 2 http://127.0.0.1:18081/status

  ```


  ```bash

  cat consumer/initial-observation.json

  jq ''map({request_id,path,operation,reason})'' consumer-audit.json

  cat reader.hcl

  ```'
hints.2.text: 'Registre solo los cuatro campos exportados y repare la ruta de lectura KV v2 sin ampliar el acceso.
  Tras editar `reader.hcl`, actualiza la política activa de práctica con la identidad manager. La auditoría de archivo
  usa `log_raw=false`; solo se exportan metadatos de denegación permitidos a `audit-events.json` y a los hechos
  congelados. Los registros de auditoría sin procesar, campos de autenticación y valores secretos quedan fuera de
  la workstation. Correlacione request_id, ruta y operation sin copiar datos de autenticación.


  Verifica desde `~/quest` en la workstation:


  - `jq -e ''keys == ["operation","path","reason","request_id"]'' incident.json >/dev/null`


  Código `0`; el incidente contiene exactamente los cuatro campos requeridos.


  - `source platform.env`

  - `curl -fsS -H @<(printf ''X-Vault-Token: %s\n'' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch"
  | jq -e ''.data.data.value == "north-secret"'' >/dev/null`


  Código `0`; no se muestran credenciales ni valores secretos.


  - `source platform.env`

  - `curl -fsS -H @<(printf ''X-Vault-Token: %s\n'' "$VAULT_READER_TOKEN") -H ''Content-Type: application/json''
  --request POST --data ''{"paths":["secret/data/dispatch","secret/data/other","sys/audit"]}'' "$VAULT_ADDR/v1/sys/capabilities-self"
  | jq ''{dispatch:."secret/data/dispatch",other:."secret/data/other",audit:."sys/audit"}''`


  `dispatch: ["read"]`; `other` y `audit`: `["deny"]`.


  Ajusta el perfil a la fuente API aprobada y credenciales reader. Conserva el archivo privado y envía SIGHUP a
  la PID existente; manager es otra identidad. Verifica la publicación HTTP. Esperado: OK.


  ```bash

  set -euo pipefail

  cd ~/quest

  curl -fsS --max-time 2 http://127.0.0.1:18081/ > observed-publication.json

  python3 -I - <<''VERIFY_PUBLICATION''

  import json

  from pathlib import Path

  contract=json.loads(Path(''consumer-contract.json'').read_text())

  observed=json.loads(Path(''observed-publication.json'').read_text())

  assert observed[''ready''] is True

  assert observed[''source'']==contract[''vault_url'']

  assert observed[''path'']==contract[''path'']

  assert observed[''value_sha256'']==contract[''value_sha256'']

  assert observed[''version'']==contract[''version'']

  print(''OK'')

  VERIFY_PUBLICATION

  ```


  Ambas denegaciones se correlacionan solo mediante metadatos exportados; incident sigue identificando la solicitud
  inicial.


  ```bash

  jq -e --slurpfile events consumer-audit.json ''keys==["application","baseline"] and .baseline==($events[0][]|select(.path=="secret/data/dispatch"))
  and .application==($events[0][]|select(.path=="secret/dispatch"))'' consumer-incident.json

  ```

  Esperado: true.'
phrases.0: Correlacioné un request denegado por su auditoría request ID.
phrases.1: Mantuve los datos de autenticación y los valores secretos fuera del informe de incidente.
phrases.2: Verifiqué las verificaciones de autorización negativa y de lectura corregidas.
