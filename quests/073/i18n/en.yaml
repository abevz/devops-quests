title: Vault audit
brief: 'The game reader received a real Vault permission denial. File auditing is enabled with log_raw=false;
  the backend exports only allowlisted denial metadata into audit-events.json and freezes it under /run/dq/facts/0/.
  Raw audit records, authentication fields and secret values stay outside the workstation. Identify the
  denied request in incident.json with exactly request_id, path, operation and reason. Then repair reader.hcl
  for dispatch read only and update that game policy. Do not copy tokens or secret values into your incident
  record.


  Quest files in `~/quest` (some appear in later stages): `platform.env`, `audit-events.json`, `incident.json`,
  `reader.hcl`, `reader-policy.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: The incident matches the frozen real denial metadata exactly; the reader can
  read dispatch and is denied unrelated secrets and audit administration.'
debrief: A denied request was diagnosed through real audit metadata while secrets remained outside the
  incident artifact.
