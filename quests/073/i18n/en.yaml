title: Vault audit
brief: 'Recover the application’s access to its intended KV publication without broadening the reader’s authorization.
  Record both the baseline denial and the application denial in `consumer-incident.json`, under `baseline` and `application`;
  each contains only the four exported audit fields. Keep the original four-field `incident.json` for the baseline
  request.


  Work in `~/quest`. The supplied consumer directory contains its configuration, process receipt and application
  log. `consumer/README.md` describes the application interface; `consumer-contract.json` records the original processes,
  approved source identity, publication digest and version. Preserve the original application programs, process
  identities and privileges. Each consumer must serve the approved publication through its existing HTTP endpoint
  using the original source and private supplied reader identity; a successful manual source request is insufficient.
  Keep credential files regular, owned by the workstation user, with mode `0600`. Do not print credentials or secret
  values.


  **Requirements:**


  - Both denied requests are correlated using exported metadata only; the original incident still identifies the
  baseline request.

  - The supplied reader identity can read the existing dispatch data and reports `deny` for probes of `secret/data/other`
  and `sys/audit`.

  - The original application adopts and serves the approved source publication with the private supplied reader
  identity.'
debrief: The original source and consumer identities were preserved, and the running applications adopted the approved
  publication.
stages.0.brief: Recover the application’s access to its intended KV publication without broadening the reader’s
  authorization. Record both the baseline denial and the application denial in `consumer-incident.json`, under `baseline`
  and `application`; each contains only the four exported audit fields. Keep the original four-field `incident.json`
  for the baseline request.
hints.0.text: Server availability, authorization and a consumer’s adopted publication are different observations.
hints.1.text: 'Compare the live service response, source profiles, application logs and original contract. Trace
  the first failing boundary before changing another component.


  ```bash

  cat consumer/source.json consumer/application.log consumer-contract.json

  curl -fsS --max-time 2 http://127.0.0.1:18081/status

  ```


  ```bash

  cat consumer/initial-observation.json

  jq ''map({request_id,path,operation,reason})'' consumer-audit.json

  cat reader.hcl

  ```'
hints.2.text: 'Record only the four exported fields and repair the KV v2 read path without widening access. After
  editing `reader.hcl`, update the live game policy with the manager identity. File auditing uses `log_raw=false`;
  only allowlisted denial metadata is exported to `audit-events.json` and frozen facts. Raw audit records, authentication
  fields and secret values stay outside the workstation. Correlate request_id, path and operation without copying
  authentication data.


  Verify from `~/quest` on the workstation:


  - `jq -e ''keys == ["operation","path","reason","request_id"]'' incident.json >/dev/null`


  Exit `0`; the incident has exactly the four required fields.


  - `source platform.env`

  - `curl -fsS -H @<(printf ''X-Vault-Token: %s\n'' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch"
  | jq -e ''.data.data.value == "north-secret"'' >/dev/null`


  Exit `0`; no credential or secret value is printed.


  - `source platform.env`

  - `curl -fsS -H @<(printf ''X-Vault-Token: %s\n'' "$VAULT_READER_TOKEN") -H ''Content-Type: application/json''
  --request POST --data ''{"paths":["secret/data/dispatch","secret/data/other","sys/audit"]}'' "$VAULT_ADDR/v1/sys/capabilities-self"
  | jq ''{dispatch:."secret/data/dispatch",other:."secret/data/other",audit:."sys/audit"}''`


  `dispatch: ["read"]`; `other` and `audit`: `["deny"]`.


  Match the profile to the approved API source and supplied reader credential. Keep the credential private and send
  SIGHUP to the existing application PID; the manager is a different identity. Recheck the HTTP publication, not
  only the source. Expected: OK.


  ```bash

  set -euo pipefail

  cd ~/quest

  curl -fsS --max-time 2 http://127.0.0.1:18081/ > observed-publication.json

  python3 -I - <<''VERIFY_PUBLICATION''

  import json

  from pathlib import Path

  contract=json.loads(Path(''consumer-contract.json'').read_text())

  observed=json.loads(Path(''observed-publication.json'').read_text())

  assert observed[''ready''] is True

  assert observed[''source'']==contract[''vault_url'']

  assert observed[''path'']==contract[''path'']

  assert observed[''value_sha256'']==contract[''value_sha256'']

  assert observed[''version'']==contract[''version'']

  print(''OK'')

  VERIFY_PUBLICATION

  ```


  Both denied requests are correlated using exported metadata only; the original incident still identifies the baseline
  request.


  ```bash

  jq -e --slurpfile events consumer-audit.json ''keys==["application","baseline"] and .baseline==($events[0][]|select(.path=="secret/data/dispatch"))
  and .application==($events[0][]|select(.path=="secret/dispatch"))'' consumer-incident.json

  ```

  Expected: true.'
phrases.0: I correlated a denied request by its audit request ID.
phrases.1: I kept authentication data and secret values out of the incident report.
phrases.2: I verified the corrected read and negative authorization checks.
stages.0.objectives.0.text: Both denied requests are correlated using exported metadata only; the original incident
  still identifies the baseline request.
stages.0.objectives.1.text: The supplied reader identity can read the existing dispatch data and reports `deny`
  for probes of `secret/data/other` and `sys/audit`.
stages.0.objectives.2.text: The original application adopts and serves the approved source publication with the
  private supplied reader identity.
guides.reference_1: Inspect the relevant Vault API
guides.reference_2: Publication and consumer verification reference
diagnostics.probe_0_0: The baseline incident or the two consumer incidents may omit fields, include extra data or match the wrong denied request; correlate exact four-field records from the frozen exports, including both KV paths. [Cause and check](guides#guide=vault-recovery&section=audit-correlate-two-denied-paths)
diagnostics.vault_capabilities: The supplied reader policy targets the wrong path or grants extra rights; require read on secret/data/dispatch and deny on secret/data/other and sys/audit. Update the live named policy after editing the file. [Cause and check](guides#guide=vault-recovery&section=audit-narrow-kv-v2-reader-policy)
diagnostics.probe_0_2: The original application starts with the wrong KV path and caches its failure; fix the reader policy and source profile, then send SIGHUP to the same PID. Also retain the private reader file, process identity and approved HTTP metadata; a manual Vault read alone is insufficient. [Cause and check](guides#guide=vault-recovery&section=audit-original-consumer-path-and-cached-publication)
