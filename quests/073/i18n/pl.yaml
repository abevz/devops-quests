title: Audyt Vault
brief: 'Gra reader otrzymała prawdziwą odmowę pozwolenia na Vault. Kontrola plików jest włączona w log_raw=false;
  backend eksportuje tylko metadane odmów z listy dozwolonych do audit-events.json i zamraża je w /run/dq/facts/0/.
  Raw audit records, pola uwierzytelniania i tajne wartości pozostają poza workstation. Zidentyfikuj odrzucone
  żądanie w incident.json za pomocą dokładnie request_id, path, operation i reason. Następnie napraw reader.hcl
  dla dispatch tylko do odczytu i zaktualizuj tę grę policy. Nie kopiuj tokens ani tajnych wartości do
  swojego rekordu zdarzenia.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `platform.env`, `audit-events.json`,
  `incident.json`, `reader.hcl`, `reader-policy.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: incydent dokładnie odpowiada zamrożonym rzeczywistym metadanym odmowy;
  reader może read dispatch i odmówiono mu niepowiązanego administrowania secrets i audit.'
debrief: Odrzucone żądanie zostało zdiagnozowane za pomocą prawdziwego audit metadata, podczas gdy tajemnice
  pozostały poza artefaktem incydentu.
stages.0.brief: 'Kryteria sukcesu: incydent dokładnie odpowiada zamrożonym rzeczywistym metadanym odmowy;
  reader może odczytać dispatch i odmówiono mu niepowiązanego administrowania secrets i audit.'
stages.0.objectives.0.text: Incydent dokładnie odpowiada zamrożonym metadanym prawdziwej odmowy; reader
  może odczytać dispatch i odmówiono mu niepowiązanego administrowania secrets i audit.
hints.0.text: Operational logs i żądanie audit records odpowiadają na różne pytania.
hints.1.text: Skoreluj request_id, path i operation bez kopiowania danych uwierzytelniających.
hints.2.text: Zapisz tylko cztery wyeksportowane pola i napraw ścieżkę odczytu KV v2 bez poszerzania dostępu.
phrases.0: Skorelowałem odrzucone żądanie poprzez audyt request ID.
phrases.1: Nie umieściłem danych uwierzytelniających ani tajnych wartości w raporcie o incydencie.
phrases.2: Zweryfikowałem poprawione read i negatywne kontrole autoryzacyjne.
