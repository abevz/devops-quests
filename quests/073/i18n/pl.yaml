stages.0.objectives.2.text: Pierwotna aplikacja przyjmuje i udostępnia zatwierdzoną publikację z dostarczoną prywatną
  tożsamością reader.
guides.reference_1: Sprawdź odpowiednie API Vault
guides.reference_2: Dokumentacja weryfikacji publikacji i konsumentów
diagnostics.probe_0_0: Pierwotny incident lub dwa consumer-incident mogą pomijać pola, dodawać dane lub odpowiadać innej odmowie; skoreluj dokładne czteropolowe rekordy zamrożonego eksportu dla obu ścieżek KV. [Przyczyna i kontrola](guides#guide=vault-recovery&section=audit-correlate-two-denied-paths)
diagnostics.vault_capabilities: Dostarczona polityka reader wskazuje błędną ścieżkę lub dodatkowe prawa; wymagane read na secret/data/dispatch oraz deny na secret/data/other i sys/audit. Po edycji pliku zaktualizuj żywą nazwaną politykę. [Przyczyna i kontrola](guides#guide=vault-recovery&section=audit-narrow-kv-v2-reader-policy)
diagnostics.probe_0_2: Pierwotna aplikacja startuje z błędną ścieżką KV i zapisuje awarię w cache; popraw politykę reader oraz profil source, potem wyślij SIGHUP do tego samego PID. Zachowaj prywatny plik reader, tożsamość procesu i zatwierdzone metadane HTTP; ręczny odczyt Vault nie wystarcza. [Przyczyna i kontrola](guides#guide=vault-recovery&section=audit-original-consumer-path-and-cached-publication)
