diagnostics.probe_0_0: consumer-incident.json muss beide echten abgelehnten Lesezugriffe ausschließlich mit den
  vier exportierten Feldern zuordnen.
diagnostics.probe_0_2: Die ursprüngliche Anwendung muss die freigegebene API-Quelle mit privater Reader-Identität
  übernehmen. Profil, Prozessbeleg und HTTP-Publikation vergleichen.
