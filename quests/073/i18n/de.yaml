title: Vault-Prüfung
brief: 'Das Spiel reader erhielt eine echte Vault-Berechtigungsverweigerung. Die Dateiüberwachung ist
  mit log_raw=false aktiviert. Der backend exportiert nur zugelassene Ablehnungsmetadaten in audit-events.json
  und friert sie unter /run/dq/facts/0/. Raw audit records ein. Authentifizierungsfelder und geheime Werte
  bleiben außerhalb des workstation. Identifizieren Sie die abgelehnte Anfrage in incident.json mit genau
  request_id, Pfad, operation und reason. Dann reparieren Sie reader.hcl für dispatch schreibgeschützt
  und aktualisieren Sie das Spiel policy. Kopieren Sie weder tokens noch geheime Werte in Ihren Vorfalldatensatz.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `platform.env`, `audit-events.json`,
  `incident.json`, `reader.hcl`, `reader-policy.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: Der Vorfall stimmt genau mit den eingefrorenen Metadaten der tatsächlichen Ablehnung
  überein; Der reader kann dispatch lesen und erhält keine unabhängige Verwaltung von secrets und audit.'
debrief: Eine abgelehnte Anfrage wurde anhand echter audit-Metadaten diagnostiziert, während Geheimnisse
  außerhalb des Vorfallsartefakts blieben.
stages.0.brief: 'Erfolgskriterien: Der Vorfall stimmt genau mit den eingefrorenen Metadaten der tatsächlichen
  Ablehnung überein; Der reader kann dispatch lesen und erhält keine unabhängige Verwaltung von secrets
  und audit.'
stages.0.objectives.0.text: Der Vorfall stimmt genau mit den eingefrorenen Metadaten der echten Ablehnung
  überein; Der reader kann dispatch lesen und erhält keine unabhängige Verwaltung von secrets und audit.
hints.0.text: Operational logs und Anfrage audit records beantworten verschiedene Fragen.
hints.1.text: Korrelieren Sie request_id, Pfad und operation, ohne Authentifizierungsdaten zu kopieren.
hints.2.text: Zeichnen Sie nur die vier exportierten Felder auf und reparieren Sie den Lesepfad KV v2,
  ohne den Zugriff zu erweitern.
phrases.0: Ich habe eine abgelehnte Anfrage mit ihrer Prüfanforderung ID korreliert.
phrases.1: Ich habe Authentifizierungsdaten und geheime Werte aus dem Vorfallbericht herausgehalten.
phrases.2: Ich habe die korrigierten Lese- und negativen Autorisierungsprüfungen überprüft.
