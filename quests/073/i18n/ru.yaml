title: Аудит Vault
brief: |-
  Потребитель Vault получает отказ в доступе. Восстановите нужный доступ и оставьте запись инцидента, определяющую отклонённый запрос.

  Работайте на workstation в `~/quest` с файлами `platform.env`, `audit-events.json`, `incident.json`, `reader.hcl`.

  **Requirements:**

  - Файл `~/quest/incident.json` на workstation определяет отклонённый запрос по предоставленным метаданным аудита и содержит ровно `request_id`, `path`, `operation` и `reason`.
  - Предоставленная идентичность reader читает существующие данные dispatch и сообщает `deny` для проб `secret/data/other` и `sys/audit`.
  - Предоставленная идентичность reader получает из Vault существующее значение dispatch `north-secret`.

  Отрицательные пробы охватывают два названных пути; они не доказывают запрет для всех путей Vault.
debrief: Отказ запроса разобран по реальным audit metadata без переноса секретов в описание инцидента.
stages.0.brief: Запись инцидента не содержит данных аутентификации или секретных значений.
hints.0.text: Operational logs и audit records запросов отвечают на разные вопросы.
hints.1.text: |-
  Изучите экспортированные метаданные аудита и предоставленную политику, не выводя учётные данные.

  ```bash
  jq 'map({request_id,path,operation,reason})' audit-events.json
  cat reader.hcl
  ```
hints.2.text: |-
  Запишите только четыре выданных поля и исправьте путь read KV v2 без расширения доступа. После изменения `reader.hcl` обновите живую учебную политику с идентичностью manager. Файловый аудит использует `log_raw=false`; в `audit-events.json` и замороженные факты экспортируются только разрешённые метаданные отказов. Сырые записи аудита, поля аутентификации и секретные значения остаются вне workstation. Сопоставьте request_id, path и operation без копирования данных аутентификации.

  Проверьте из `~/quest` на workstation:

  - `jq -e 'keys == ["operation","path","reason","request_id"]' incident.json >/dev/null`

  Код `0`; запись содержит ровно четыре требуемых поля.

  - `source platform.env`
  - `curl -fsS -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch" | jq -e '.data.data.value == "north-secret"' >/dev/null`

  Код `0`; учётные данные и секретные значения не выводятся.

  - `source platform.env`
  - `curl -fsS -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_READER_TOKEN") -H 'Content-Type: application/json' --request POST --data '{"paths":["secret/data/dispatch","secret/data/other","sys/audit"]}' "$VAULT_ADDR/v1/sys/capabilities-self" | jq '{dispatch:."secret/data/dispatch",other:."secret/data/other",audit:."sys/audit"}'`

  `dispatch: ["read"]`; `other` и `audit`: `["deny"]`.
phrases.0: Я сопоставил отказ по request ID аудита.
phrases.1: Я не переносил данные аутентификации и секреты в отчёт об инциденте.
phrases.2: Я проверил исправленный read и запрещённые операции.
stages.0.objectives.0.text: Файл `~/quest/incident.json` на workstation определяет отклонённый запрос
  по предоставленным метаданным аудита и содержит ровно `request_id`, `path`, `operation` и `reason`.
stages.0.objectives.1.text: Предоставленная идентичность reader читает существующие данные dispatch и
  сообщает `deny` для проб `secret/data/other` и `sys/audit`.
stages.0.objectives.2.text: Предоставленная идентичность reader получает из Vault существующее значение
  dispatch `north-secret`.
