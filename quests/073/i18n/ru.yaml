title: Аудит Vault
brief: 'Восстановите доступ приложения к его KV-публикации без расширения полномочий reader. В `consumer-incident.json`
  сопоставьте исходный отказ и отказ приложения: ключи `baseline` и `application`, каждый содержит только четыре
  экспортированных поля аудита. Исходный `incident.json` из четырёх полей по-прежнему описывает первоначальный запрос.


  Работайте в `~/quest`. В каталоге потребителя находятся конфигурация, запись PID и журнал приложения. Интерфейс
  описан в `consumer/README.md`; `consumer-contract.json` содержит исходные процессы, утверждённый источник, хеш
  публикации и версию. Сохраните программы, идентичность и привилегии исходных процессов. Каждый потребитель должен
  отдавать утверждённую публикацию через свой HTTP-интерфейс, используя исходный источник и выданную приватную reader-идентичность.
  Успешного ручного запроса к источнику недостаточно. Файлы учётных данных должны быть обычными, принадлежать пользователю
  workstation и иметь режим `0600`. Не выводите секреты и учётные данные.


  **Требования:**


  - Оба отказа сопоставлены только по экспортированным метаданным; исходный incident по-прежнему описывает первоначальный
  запрос.

  - Предоставленная идентичность reader читает существующие данные dispatch и сообщает `deny` для проб `secret/data/other`
  и `sys/audit`.

  - Исходное приложение принимает и отдаёт утверждённую публикацию источника с выданной приватной reader-идентичностью.'
debrief: Идентичность источника и потребителей сохранена; работающие приложения приняли утверждённую публикацию.
stages.0.brief: 'Восстановите доступ приложения к его KV-публикации без расширения полномочий reader. В `consumer-incident.json`
  сопоставьте исходный отказ и отказ приложения: ключи `baseline` и `application`, каждый содержит только четыре
  экспортированных поля аудита. Исходный `incident.json` из четырёх полей по-прежнему описывает первоначальный запрос.'
hints.0.text: Доступность сервера, авторизация и принятая потребителем публикация — разные наблюдения.
hints.1.text: 'Сопоставьте живой ответ сервиса, профили источников, журналы приложений и исходный контракт. Проследите
  первую неисправную границу, прежде чем менять следующий компонент.


  ```bash

  cat consumer/source.json consumer/application.log consumer-contract.json

  curl -fsS --max-time 2 http://127.0.0.1:18081/status

  ```


  ```bash

  cat consumer/initial-observation.json

  jq ''map({request_id,path,operation,reason})'' consumer-audit.json

  cat reader.hcl

  ```'
hints.2.text: 'Запишите только четыре выданных поля и исправьте путь read KV v2 без расширения доступа. После изменения
  `reader.hcl` обновите живую учебную политику с идентичностью manager. Файловый аудит использует `log_raw=false`;
  в `audit-events.json` и замороженные факты экспортируются только разрешённые метаданные отказов. Сырые записи
  аудита, поля аутентификации и секретные значения остаются вне workstation. Сопоставьте request_id, path и operation
  без копирования данных аутентификации.


  Проверьте из `~/quest` на workstation:


  - `jq -e ''keys == ["operation","path","reason","request_id"]'' incident.json >/dev/null`


  Код `0`; запись содержит ровно четыре требуемых поля.


  - `source platform.env`

  - `curl -fsS -H @<(printf ''X-Vault-Token: %s\n'' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch"
  | jq -e ''.data.data.value == "north-secret"'' >/dev/null`


  Код `0`; учётные данные и секретные значения не выводятся.


  - `source platform.env`

  - `curl -fsS -H @<(printf ''X-Vault-Token: %s\n'' "$VAULT_READER_TOKEN") -H ''Content-Type: application/json''
  --request POST --data ''{"paths":["secret/data/dispatch","secret/data/other","sys/audit"]}'' "$VAULT_ADDR/v1/sys/capabilities-self"
  | jq ''{dispatch:."secret/data/dispatch",other:."secret/data/other",audit:."sys/audit"}''`


  `dispatch: ["read"]`; `other` и `audit`: `["deny"]`.


  Приведите профиль к утверждённому API-источнику и выданным учётным данным reader. Сохраните приватность файла
  и отправьте SIGHUP существующему PID; manager — другая идентичность. Проверьте HTTP-публикацию, а не только источник.
  Ожидается OK.


  ```bash

  set -euo pipefail

  cd ~/quest

  curl -fsS --max-time 2 http://127.0.0.1:18081/ > observed-publication.json

  python3 -I - <<''VERIFY_PUBLICATION''

  import json

  from pathlib import Path

  contract=json.loads(Path(''consumer-contract.json'').read_text())

  observed=json.loads(Path(''observed-publication.json'').read_text())

  assert observed[''ready''] is True

  assert observed[''source'']==contract[''vault_url'']

  assert observed[''path'']==contract[''path'']

  assert observed[''value_sha256'']==contract[''value_sha256'']

  assert observed[''version'']==contract[''version'']

  print(''OK'')

  VERIFY_PUBLICATION

  ```


  Оба отказа сопоставлены только по экспортированным метаданным; исходный incident по-прежнему описывает первоначальный
  запрос.


  ```bash

  jq -e --slurpfile events consumer-audit.json ''keys==["application","baseline"] and .baseline==($events[0][]|select(.path=="secret/data/dispatch"))
  and .application==($events[0][]|select(.path=="secret/dispatch"))'' consumer-incident.json

  ```

  Ожидается true.'
phrases.0: Я сопоставил отказ по request ID аудита.
phrases.1: Я не переносил данные аутентификации и секреты в отчёт об инциденте.
phrases.2: Я проверил исправленный read и запрещённые операции.
stages.0.objectives.0.text: Оба отказа сопоставлены только по экспортированным метаданным; исходный incident по-прежнему
  описывает первоначальный запрос.
stages.0.objectives.1.text: Предоставленная идентичность reader читает существующие данные dispatch и сообщает `deny`
  для проб `secret/data/other` и `sys/audit`.
stages.0.objectives.2.text: Исходное приложение принимает и отдаёт утверждённую публикацию источника с выданной
  приватной reader-идентичностью.
guides.reference_1: Справочник наблюдаемого API Vault
guides.reference_2: Справочник проверки публикации и потребителей
diagnostics.probe_0_0: Исходный incident либо два consumer-incident могут терять поля, добавлять лишнее или соответствовать другому отказу; сопоставьте точные четырёхполевые записи из зафиксированного экспорта для обоих путей KV. [Причина и проверка](guides#guide=vault-recovery&section=audit-correlate-two-denied-paths)
diagnostics.vault_capabilities: Выданная политика reader указывает неверный путь или даёт лишние права; нужны read на secret/data/dispatch и deny на secret/data/other и sys/audit. После редактирования файла обновите живую именованную политику. [Причина и проверка](guides#guide=vault-recovery&section=audit-narrow-kv-v2-reader-policy)
diagnostics.probe_0_2: Исходное приложение запускается с неверным путём KV и кэширует ошибку; исправьте политику reader и source-профиль, затем отправьте SIGHUP тому же PID. Сохраните приватный файл reader, идентичность процесса и одобренные HTTP-метаданные; ручного чтения Vault недостаточно. [Причина и проверка](guides#guide=vault-recovery&section=audit-original-consumer-path-and-cached-publication)
