title: Аудит Vault
brief: 'Игровой reader получил реальный отказ Vault. File audit включён с log_raw=false; backend выдаёт
  только разрешённые поля отказа в audit-events.json и сохраняет их в /run/dq/facts/0/. Исходные audit
  records, поля аутентификации и значения секретов остаются вне workstation. Укажите отказ в incident.json
  ровно с полями request_id, path, operation и reason. Затем исправьте reader.hcl только для read dispatch
  и обновите игровую policy. Не копируйте tokens и значения секретов в описание инцидента.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `platform.env`, `audit-events.json`,
  `incident.json`, `reader.hcl`, `reader-policy.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Инцидент точно совпадает с сохранёнными данными реального отказа; reader читает
  dispatch, но не другие secrets и настройки audit.'
debrief: Отказ запроса разобран по реальным audit metadata без переноса секретов в описание инцидента.
