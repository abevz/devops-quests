hints.0.text: Operational logs и audit records запросов отвечают на разные вопросы.
hints.1.text: Сопоставьте request_id, path и operation без копирования данных аутентификации.
hints.2.text: Запишите только четыре выданных поля и исправьте путь read KV v2 без расширения доступа.
phrases.0: Я сопоставил отказ по request ID аудита.
phrases.1: Я не переносил данные аутентификации и секреты в отчёт об инциденте.
phrases.2: Я проверил исправленный read и запрещённые операции.
