id: 73
title: title
track: Platform
difficulty: complex
brief: brief
stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    check: 'dq_probe_output=$(mktemp)

      trap ''rm -f "$dq_probe_output"'' EXIT

      set +e

      (

      set -euo pipefail

      dq_failed=0

      set +e

      (

      set -euo pipefail

      timeout --kill-after=1s 8s bash -euo pipefail <<''DQ_LEGACY''

      source platform.env

      jq -e --slurpfile events /run/dq/facts/0/audit-events.json ''keys==["operation","path","reason","request_id"]
      and .==$events[0][0]'' incident.json >/dev/null

      DQ_LEGACY

      )

      [ $? -eq 0 ] || dq_failed=1

      (

      set -euo pipefail

      timeout --kill-after=1s 14s bash -euo pipefail <<''DQ_CURRENT''

      dq_probe_output=$(mktemp)

      trap ''rm -f "$dq_probe_output"'' EXIT

      set +e

      (

      set -euo pipefail

      python3 -I - <<''DQ_VAULT_APPLICATION''


      import json

      from pathlib import Path

      events=json.loads(Path(''/run/dq/facts/0/consumer-audit.json'').read_text())

      report=json.loads(Path(''consumer-incident.json'').read_text())

      assert set(report)=={''baseline'',''application''}

      expected={e[''path'']:e for e in events}

      assert len(events)==len(expected)==2

      assert report[''baseline'']==expected[''secret/data/dispatch'']

      assert report[''application'']==expected[''secret/dispatch'']

      assert all(set(e)=={''request_id'',''path'',''operation'',''reason''} for e in report.values())


      DQ_VAULT_APPLICATION


      ) >"$dq_probe_output" 2>/dev/null

      dq_probe_status=$?

      set -e

      cat "$dq_probe_output"

      if [ "$dq_probe_status" -ne 0 ] && ! grep -Eq ''\[DQ:[a-z0-9_]+\]'' "$dq_probe_output"; then

      printf ''%s\n'' ''Current inputs could not verify this objective: ✗ [DQ:probe_0_0]''

      fi

      rm -f "$dq_probe_output"

      trap - EXIT

      test "$dq_probe_status" -eq 0


      DQ_CURRENT

      )

      [ $? -eq 0 ] || dq_failed=1

      set -e

      test "$dq_failed" -eq 0

      ) >"$dq_probe_output" 2>/dev/null

      dq_probe_status=$?

      set -e

      cat "$dq_probe_output"

      if [ "$dq_probe_status" -ne 0 ] && ! grep -Eq ''\[DQ:[a-z0-9_]+\]'' "$dq_probe_output"; then

      printf ''%s\n'' ''Current inputs could not verify this objective: ✗ [DQ:probe_0_0]''

      fi

      rm -f "$dq_probe_output"

      trap - EXIT

      test "$dq_probe_status" -eq 0

      '
  - text: stages.0.objectives.1.text
    check: |-
      set +e
      (
      set -e
      source platform.env
      curl -fsS -H "X-Vault-Token: $VAULT_READER_TOKEN" -H 'Content-Type: application/json' --request POST --data '{"paths":["secret/data/dispatch","secret/data/other","sys/audit"]}' "$VAULT_ADDR/v1/sys/capabilities-self" | jq -e '."secret/data/dispatch"==["read"] and ."secret/data/other"==["deny"] and ."sys/audit"==["deny"]' >/dev/null
      )
      code=$?
      set -e
      if [ "$code" -ne 0 ]; then
        printf '%s\n' 'The narrow Vault path capabilities could not be verified: ✗ [DQ:vault_capabilities]' >&2
        exit "$code"
      fi
  - text: stages.0.objectives.2.text
    check: "dq_probe_output=$(mktemp)\ntrap 'rm -f \"$dq_probe_output\"' EXIT\nset +e\n(\nset -euo pipefail\ndq_failed=0\n\
      set +e\n(\nset -euo pipefail\ntimeout --kill-after=1s 8s bash -euo pipefail <<'DQ_LEGACY'\nsource platform.env\n\
      test \"$(curl -fsS -H \"X-Vault-Token: $VAULT_READER_TOKEN\" \"$VAULT_ADDR/v1/secret/data/dispatch\" | jq\
      \ -er .data.data.value)\" = north-secret\nDQ_LEGACY\n)\n[ $? -eq 0 ] || dq_failed=1\n(\nset -euo pipefail\n\
      timeout --kill-after=1s 14s bash -euo pipefail <<'DQ_CURRENT'\ndq_probe_output=$(mktemp)\ntrap 'rm -f \"$dq_probe_output\"\
      ' EXIT\nset +e\n(\nset -euo pipefail\npython3 -I - <<'DQ_VAULT_APPLICATION'\n\nimport hashlib,json,stat,urllib.request\n\
      from pathlib import Path\nfacts=json.loads(Path('/run/dq/facts/0/consumer-contract.json').read_text())\nopener=urllib.request.build_opener(urllib.request.ProxyHandler({}))\n\
      def read(path,limit=8192):\n p=Path(path); s=p.lstat()\n assert stat.S_ISREG(s.st_mode) and s.st_size<=limit\n\
      \ return p.read_bytes()\ndef process(role):\n old=facts[role]\n assert read(role+'/application.pid').decode().strip()==str(old['pid'])\n\
      \ proc=Path('/proc')/str(old['pid'])\n fields=(proc/'stat').read_text().rsplit(') ',1)[1].split()\n assert\
      \ fields[0] not in ('Z','X') and fields[19]==old['start']\n assert (proc/'cmdline').read_bytes().hex()==old['command']\n\
      \ status=dict(line.split(':',1) for line in (proc/'status').read_text().splitlines() if ':' in line)\n assert\
      \ all(status[k].strip()==v for k,v in old['status'].items())\n assert hashlib.sha256(read('provided-vault-consumer.py',65536)).hexdigest()==facts['program_sha256']\n\
      def response(port):\n with opener.open('http://127.0.0.1:'+str(port)+'/',timeout=2) as r:\n  data=json.load(r)\n\
      \ assert data.get('ready') is True\n assert data.get('value_sha256')==facts['value_sha256']\n assert type(data.get('version'))\
      \ is int and data['version']==facts['version']\n return data\nprocess('consumer')\nconfig=json.loads(read('consumer/source.json',4096))\n\
      assert set(config)=={'url','path','token_file'}\nassert config['url']==facts['vault_url'] and config['path']==facts['path']\n\
      credential=Path(config['token_file'])\nassert stat.S_IMODE(credential.lstat().st_mode)==0o600\nassert credential.lstat().st_uid==1000\n\
      assert hashlib.sha256(read(credential,4096).strip()).hexdigest()==facts['reader_sha256']\ndata=response(18081)\n\
      assert data.get('kind')=='vault' and data.get('source')==facts['vault_url'] and data.get('path')==facts['path']\n\
      \nDQ_VAULT_APPLICATION\n\n) >\"$dq_probe_output\" 2>/dev/null\ndq_probe_status=$?\nset -e\ncat \"$dq_probe_output\"\
      \nif [ \"$dq_probe_status\" -ne 0 ] && ! grep -Eq '\\[DQ:[a-z0-9_]+\\]' \"$dq_probe_output\"; then\nprintf\
      \ '%s\\n' 'Current inputs could not verify this objective: ✗ [DQ:probe_0_2]'\nfi\nrm -f \"$dq_probe_output\"\
      \ntrap - EXIT\ntest \"$dq_probe_status\" -eq 0\n\nDQ_CURRENT\n)\n[ $? -eq 0 ] || dq_failed=1\nset -e\ntest\
      \ \"$dq_failed\" -eq 0\n) >\"$dq_probe_output\" 2>/dev/null\ndq_probe_status=$?\nset -e\ncat \"$dq_probe_output\"\
      \nif [ \"$dq_probe_status\" -ne 0 ] && ! grep -Eq '\\[DQ:[a-z0-9_]+\\]' \"$dq_probe_output\"; then\nprintf\
      \ '%s\\n' 'Current inputs could not verify this objective: ✗ [DQ:probe_0_2]'\nfi\nrm -f \"$dq_probe_output\"\
      \ntrap - EXIT\ntest \"$dq_probe_status\" -eq 0\n"
