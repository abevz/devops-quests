title: Dryft Argo CD
brief: 'Działająca trasa nie spełnia wymaganego kontraktu dostarczenia.


  Pracuj na stacji roboczej w `~/quest` z `repository/manifests/relay.yaml`, `application.yaml`, `platform.env`.


  **Wymagania:**

  - Application `station` zgłasza `Synced` i `Healthy`.

  - Działający proces `relay` używa trasy zadeklarowanej w dostarczonej konfiguracji Git.

  - Deployment `relay` kończy rollout w przestrzeni nazw zatoki.


  Końcowe sprawdzenie odbiorcy odczytuje środowisko procesu, a nie serwowaną treść.

  '
stages.0.brief: Działająca trasa musi spełniać kontrakt dostarczenia zarządzanego przez Git.
hints.0.text: Stan pożądany w Git i działający stan środowiska mogą się różnić.
hints.1.text: 'Prywatne źródło Git nadal deklaruje ROUTE=north; ręczna edycja na żywo spowodowała dryf.


  Sprawdź dostarczone dane wejściowe i obserwowany stan:


  ```sh

  cat repository/manifests/relay.yaml

  kubectl get deployment relay -o yaml

  ```'
hints.2.text: 'Zażądaj operation.sync dla Application station.


  Sprawdź obserwowany wynik:


  - `kubectl get application station -o custom-columns=NAME:.metadata.name,SYNC:.status.sync.status,HEALTH:.status.health.status`
  — Application `station` zgłasza `Synced` / `Healthy`.

  - `kubectl rollout status deployment/relay --timeout=10s; kubectl exec deployment/relay -- printenv ROUTE`
  — Rollout się kończy, a proces podaje `north`.'
debrief: Trasa na żywo pochodzi z prywatnego Git. Zażądałeś prawdziwej synchronizacji Argo CD i zweryfikowałeś
  Synced, Healthy i rzeczywiste środowisko pod.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem zarówno status platformy, jak i faktycznego konsumenta.
stages.0.objectives.0.text: Application `station` zgłasza `Synced` i `Healthy`.
stages.0.objectives.1.text: Działający proces `relay` używa trasy zadeklarowanej w dostarczonej konfiguracji
  Git.
stages.0.objectives.2.text: Deployment `relay` kończy rollout w przestrzeni nazw zatoki.
