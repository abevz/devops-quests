title: Dryft Argo CD
brief: 'Działająca trasa nie spełnia wymaganego kontraktu dostarczenia.


  Pracuj na stacji roboczej w `~/quest` z `repository/manifests/relay.yaml`, `application.yaml`, `platform.env`.


  **Wymagania:**

  - Application `station` zgłasza `Synced` i `Healthy`.

  - Działający proces `relay` używa trasy zadeklarowanej w dostarczonej konfiguracji Git.

  - Deployment `relay` kończy rollout w przestrzeni nazw zatoki.


  Końcowe sprawdzenie odbiorcy odczytuje środowisko procesu, a nie serwowaną treść.


  Dodatkowe pliki: `handover-contract.json`, `original-handover.json`, `release-commit`.


  Zachowaj pierwotną niezmienną konfigurację, jej dane i istniejący Pod odbiorcy wraz z obrazem, poleceniem i projektowanym
  źródłem. Zachowaj tożsamości Application i Deployment. Bieżąca trasa musi korzystać z odrębnej niezmiennej konfiguracji
  opublikowanej przez Git. Application ma uzgadniać zarządzany Deployment bez wykluczania jego różnic. Opublikuj
  potomka zapisanej rewizji początkowej i uzgodnij rzeczywistą zdalną rewizję.


  Zapis początkowy w `/run/dq/facts/0/` jest wiążący; pliki w `~/quest` są kopiami roboczymi. Sprawdzany jest stan
  bieżący.'
stages.0.brief: Działająca trasa musi spełniać kontrakt dostarczenia zarządzanego przez Git.
hints.0.text: Niezmienne źródło i działający odbiorca mogą mieć różne okresy życia. Nowa wartość docelowa nie musi
  należeć do pierwotnego obiektu.
hints.1.text: Porównaj `handover-contract.json`, manifesty Git, obserwowaną operację Application i reguły wykluczania
  różnic. Sprawdź niezmienną konfigurację i Pod, który nadal ją projektuje; porównaj zadeklarowaną i działającą
  trasę Deployment.
hints.2.text: 'Opublikuj nową niezmienną konfigurację trasy, powiąż z nią zarządzany Deployment i zachowaj poprzednie
  źródło dla istniejącego odbiorcy. Usuń wykluczenia obejmujące Deployment, wykonaj commit i push, a następnie zażądaj
  sync. Sprawdź zdalną rewizję, `Synced` / `Healthy`, działającą trasę, pierwotne UID, odpowiedź odbiorcy i zachowane
  dane.


  `kubectl get application station; kubectl exec deployment/relay -c worker -- printenv ROUTE; kubectl exec retained-reader
  -- wget -qO- -T 3 http://127.0.0.1:8080` — Oczekiwane: Synced/Healthy, wymagana trasa i zachowana odpowiedź odbiorcy
  zgodna z zapisem.'
debrief: Przywrócono uzgadnianie Git przez wersjonowaną niezmienną konfigurację, zachowując pierwotnego odbiorcę
  i jego dane.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem zarówno status platformy, jak i faktycznego konsumenta.
stages.0.objectives.0.text: 'Application `station` zgłasza `Synced` i `Healthy`. Opublikowane przekazanie spełnia
  `handover-contract.json`: zachowuje pierwotne tożsamości i odbiorcę, trasa korzysta z nowej niezmiennej konfiguracji,
  a uzgadnianie Git obejmuje zarządzany Deployment.'
stages.0.objectives.1.text: Działający proces `relay` używa trasy zadeklarowanej w dostarczonej konfiguracji Git.
stages.0.objectives.2.text: Deployment `relay` kończy rollout w przestrzeni nazw zatoki.
diagnostics.handover_identity: Zmienił się UID pierwotnego Application, Deployment, ConfigMap lub Poda; usunięcie i odtworzenie może zachować nazwę, ale zastępuje tożsamość zapisaną przez setup. [Przyczyna i kontrola](guides#guide=cicd-gitops-8&section=handover-original-identities)
diagnostics.handover_retained: Zachowany ConfigMap nie jest już immutable z pierwotnymi danymi; zastąpienie lub zmiana dla przełączenia trasy może naruszyć wejście nadal używane przez pierwotny Pod. [Przyczyna i kontrola](guides#guide=cicd-gitops-8&section=handover-retained-configuration)
diagnostics.handover_reader: Pola pierwotnego Poda lub bajty HTTP różnią się od zapisu; zmiana obrazu, polecenia, montowań, security context albo podawanie innych danych może naruszyć zachowanego odbiorcę. [Przyczyna i kontrola](guides#guide=cicd-gitops-8&section=handover-original-consumer)
diagnostics.handover_binding: Aktywna trasa nadal używa zachowanej mapy lub błędnej referencji albo nowa mapa nie jest immutable z wymaganą wartością; zamiast zmiany immutable w miejscu potrzebna jest osobna wersja konfiguracji. [Przyczyna i kontrola](guides#guide=cicd-gitops-8&section=handover-versioned-binding)
diagnostics.handover_scope: Pasująca reguła ignoreDifferences dla Deployment nadal wyklucza pola z uzgadniania; dostarczone pomijanie środowiska może ukrywać drift zamiast przyjąć opublikowaną referencję trasy. [Przyczyna i kontrola](guides#guide=cicd-gitops-8&section=handover-managed-comparison)
diagnostics.handover_source: Przekazanie może istnieć tylko na żywo lub lokalnie; niewysłana lub niezsynchronizowana rewizja, zmienione źródło/cel Application albo różne referencje i dane Git/live blokują przyjęcie publikacji. [Przyczyna i kontrola](guides#guide=cicd-gitops-8&section=handover-published-source)
diagnostics.handover_budget: Upłynął limit polecenia lub całej kontroli; powolne obserwacje Git, Kubernetes API lub HTTP Poda mogą uniemożliwić ukończenie wszystkich porównań. [Przyczyna i kontrola](guides#guide=cicd-gitops-8&section=handover-observation-budget)
diagnostics.handover_observation: Nie dało się spójnie obserwować przekazania; przyczyną mogą być brakujące obiekty lub chronione dane, błędne wpisy ROUTE lub manifesty albo błędy Git fetch, ancestry i API. [Przyczyna i kontrola](guides#guide=cicd-gitops-8&section=handover-input-observation)
diagnostics.probe_0_0: Application nie jest Synced i Healthy lub obserwator nie wystartował; Git może nadal żądać zmiany zachowanej immutable mapy w miejscu, a platform.env, Python lub dane kontroli mogą być niedostępne. [Przyczyna i kontrola](guides#guide=cicd-gitops-8&section=handover-sync-health)
diagnostics.handover_route: Deployment relay nie zgłasza ROUTE=north lub exec zawiódł; może nadal używać zachowanej mapy albo starego środowiska Poda zamiast nowej immutable konfiguracji. [Przyczyna i kontrola](guides#guide=cicd-gitops-8&section=handover-live-route)
diagnostics.handover_rollout: Deployment relay nie zakończył rollout w 3 sekundy; nowy ConfigMap lub klucz jest niedostępny, nowe Pody jeszcze nie ruszyły albo obserwacja API zawiodła. [Przyczyna i kontrola](guides#guide=cicd-gitops-8&section=handover-workload-readiness)
