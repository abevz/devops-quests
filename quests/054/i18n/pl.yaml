title: Dryft Argo CD
brief: 'Dołączyłeś do operacji SignalRail. Przywróć dryfującą aplikację z prywatnego repozytorium Gitea.
  Pracuj w ~/quest.. Wszystkie zmiany przechowuj w tej komorze szkoleniowej.


  Wejścia w `~/quest`: `repository/manifests/relay.json`, `application.json`, `platform.env`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Wszystkie zmiany muszą pozostać w tej zatoce.


  Początkowe kryteria sukcesu: Argo CD zgłasza Synced/Healthy, a bieżąca trasa to north.'
stages.0.brief: 'Pożądanym stanem jest prywatne repozytorium Gitea. Żywy ROUTE dryfował. Sprawdź Application
  station, sync do Argo CD i poczekaj na Synced/Healthy.


  Kryteria sukcesu: Argo CD raportuje Synced/Healthy, a bieżąca trasa to north.'
stages.0.objectives.0.text: Argo CD raportuje Synced/Healthy, a bieżąca trasa to north.
hints.0.text: Porównaj status Application station z aktualnym stanem Deployment.
hints.1.text: Prywatne źródło Git nadal deklaruje ROUTE=north; ręczna edycja na żywo spowodowała dryf.
hints.2.text: Zażądaj operation.sync na Application station i zweryfikuj Synced, Healthy i rzeczywistą
  wartość pod.
debrief: Trasa na żywo pochodzi z prywatnego Git. Zażądałeś prawdziwej synchronizacji Argo CD i zweryfikowałeś
  Synced, Healthy i rzeczywiste środowisko pod.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem zarówno status platformy, jak i faktycznego konsumenta.
