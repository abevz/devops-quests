title: Deriva Argo CD
brief: 'La ruta activa no cumple el contrato de entrega requerido.


  Trabaja en la estación de trabajo en `~/quest` con `repository/manifests/relay.yaml`, `application.yaml`, `platform.env`.


  **Requisitos:**

  - La Application `station` informa `Synced` y `Healthy`.

  - El proceso `relay` en ejecución usa la ruta declarada en la configuración Git suministrada.

  - El Deployment `relay` completa su rollout en el namespace de la bahía.


  La comprobación final del consumidor lee el entorno del proceso, no el contenido servido.


  Archivos adicionales: `handover-contract.json`, `original-handover.json`, `release-commit`.


  Conserva la configuración inmutable original, sus datos y el Pod consumidor existente, incluida su imagen, comando
  y entrada proyectada. Conserva las identidades de Application y Deployment. La ruta actual debe usar una configuración
  inmutable distinta publicada mediante Git. La Application debe reconciliar el Deployment gestionado sin excluir
  sus diferencias. Publica un descendiente de la revisión inicial registrada y reconcilia la revisión remota real.


  El registro inicial en `/run/dq/facts/0/` es la referencia; los archivos de `~/quest` son copias de trabajo. Se
  comprueba el estado actual.'
stages.0.brief: La ruta en ejecución debe cumplir el contrato de entrega administrado mediante Git.
hints.0.text: Una entrada inmutable y un consumidor en ejecución pueden tener vidas distintas. Un nuevo valor deseado
  no tiene por qué pertenecer al objeto original.
hints.1.text: Compara `handover-contract.json`, los manifiestos Git, la operación observada de la Application y
  sus exclusiones de diferencias. Inspecciona la configuración inmutable y el Pod que aún la proyecta; compara la
  ruta declarada y la ruta en ejecución del Deployment.
hints.2.text: 'Publica una nueva configuración inmutable de ruta, vincula el Deployment gestionado y conserva la
  entrada anterior para su consumidor existente. Elimina las exclusiones que afectan al Deployment, realiza commit
  y push y solicita sync. Verifica la revisión remota, `Synced` / `Healthy`, la ruta en ejecución, los UID originales,
  la respuesta del consumidor y los datos conservados.


  `kubectl get application station; kubectl exec deployment/relay -c worker -- printenv ROUTE; kubectl exec retained-reader
  -- wget -qO- -T 3 http://127.0.0.1:8080` — Se esperan Synced/Healthy, la ruta requerida y la respuesta conservada
  del consumidor indicada en el registro.'
debrief: Recuperaste la reconciliación Git mediante una entrega inmutable versionada y conservaste el consumidor
  y la configuración originales.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué tanto el estado de la plataforma como el consumidor real.
stages.0.objectives.0.text: 'La Application `station` informa `Synced` y `Healthy`. La entrega publicada cumple
  `handover-contract.json`: conserva las identidades originales y el consumidor existente, usa una nueva configuración
  inmutable para la ruta y reconcilia el Deployment gestionado desde Git.'
stages.0.objectives.1.text: El proceso `relay` en ejecución usa la ruta declarada en la configuración Git suministrada.
stages.0.objectives.2.text: El Deployment `relay` completa su rollout en el namespace de la bahía.
diagnostics.handover_identity: Cambió un UID original de Application, Deployment, ConfigMap o Pod; borrar y recrear puede conservar el nombre pero sustituye la identidad guardada por el setup. [Causa y comprobación](guides#guide=cicd-gitops-8&section=handover-original-identities)
diagnostics.handover_retained: El ConfigMap conservado ya no es immutable con sus datos originales; sustituirlo o cambiarlo para activar la ruta puede romper la entrada que usa el Pod original. [Causa y comprobación](guides#guide=cicd-gitops-8&section=handover-retained-configuration)
diagnostics.handover_reader: Los campos del Pod original o bytes HTTP difieren del registro; cambiar imagen, comando, montajes o contexto de seguridad, o servir otros datos, puede romper el consumidor conservado. [Causa y comprobación](guides#guide=cicd-gitops-8&section=handover-original-consumer)
diagnostics.handover_binding: La ruta activa sigue usando el mapa conservado o una referencia inválida, o el nuevo mapa no es immutable con el valor requerido; la actualización in situ debe sustituirse por otra versión de configuración. [Causa y comprobación](guides#guide=cicd-gitops-8&section=handover-versioned-binding)
diagnostics.handover_scope: Una regla ignoreDifferences del Deployment objetivo sigue excluyendo campos; la exclusión suministrada del entorno puede ocultar drift en vez de adoptar la referencia publicada. [Causa y comprobación](guides#guide=cicd-gitops-8&section=handover-managed-comparison)
diagnostics.handover_source: La transferencia puede existir solo en vivo o localmente; una revisión sin enviar o sincronizar, origen/destino Application cambiado o diferencias Git/live de referencias y datos impiden adoptar la publicación. [Causa y comprobación](guides#guide=cicd-gitops-8&section=handover-published-source)
diagnostics.handover_budget: Expiró el plazo de un comando o de toda la prueba; observaciones lentas de Git, Kubernetes API o HTTP del Pod pueden impedir completar las comparaciones. [Causa y comprobación](guides#guide=cicd-gitops-8&section=handover-observation-budget)
diagnostics.handover_observation: No se pudo observar coherentemente la transferencia; objetos o evidencia protegida ausentes, entradas ROUTE o manifiestos inválidos o fallos Git fetch, ancestry y API pueden explicarlo. [Causa y comprobación](guides#guide=cicd-gitops-8&section=handover-input-observation)
diagnostics.probe_0_0: Application no está Synced y Healthy o el observador no pudo iniciarse; Git puede seguir pidiendo cambiar el mapa immutable conservado in situ, o platform.env, Python y entradas no están disponibles. [Causa y comprobación](guides#guide=cicd-gitops-8&section=handover-sync-health)
diagnostics.handover_route: Deployment relay no informa ROUTE=north o falló exec; puede seguir usando el mapa conservado o un entorno Pod antiguo en vez de la nueva configuración immutable. [Causa y comprobación](guides#guide=cicd-gitops-8&section=handover-live-route)
diagnostics.handover_rollout: Deployment relay no completó el despliegue en 3 segundos; el nuevo ConfigMap o clave puede faltar, los Pods nuevos no arrancaron o falló la observación API. [Causa y comprobación](guides#guide=cicd-gitops-8&section=handover-workload-readiness)
