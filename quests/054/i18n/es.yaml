title: Deriva Argo CD
brief: 'La ruta activa no cumple el contrato de entrega requerido.


  Trabaja en la estación de trabajo en `~/quest` con `repository/manifests/relay.yaml`, `application.yaml`,
  `platform.env`.


  **Requisitos:**

  - La Application `station` informa `Synced` y `Healthy`.

  - El proceso `relay` en ejecución usa la ruta declarada en la configuración Git suministrada.

  - El Deployment `relay` completa su rollout en el namespace de la bahía.


  La comprobación final del consumidor lee el entorno del proceso, no el contenido servido.

  '
stages.0.brief: La ruta en ejecución debe cumplir el contrato de entrega administrado mediante Git.
hints.0.text: El estado deseado de Git y el estado activo de ejecución pueden divergir.
hints.1.text: 'La fuente privada Git todavía declara ROUTE=north; una edición manual en vivo provocó una deriva.


  Inspecciona las entradas suministradas y el estado observado:


  ```sh

  cat repository/manifests/relay.yaml

  kubectl get deployment relay -o yaml

  ```'
hints.2.text: 'Solicita operation.sync en la Application station.


  Verifica el resultado observado:


  - `kubectl get application station -o custom-columns=NAME:.metadata.name,SYNC:.status.sync.status,HEALTH:.status.health.status`
  — La Application `station` informa `Synced` / `Healthy`.

  - `kubectl rollout status deployment/relay --timeout=10s; kubectl exec deployment/relay -- printenv ROUTE`
  — El rollout se completa y el proceso informa `north`.'
debrief: El route en vivo proviene del privado Git. Solicitó un Argo CD sync real y verificó Synced, Healthy
  y el entorno pod real.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué tanto el estado de la plataforma como el consumidor real.
stages.0.objectives.0.text: La Application `station` informa `Synced` y `Healthy`.
stages.0.objectives.1.text: El proceso `relay` en ejecución usa la ruta declarada en la configuración Git suministrada.
stages.0.objectives.2.text: El Deployment `relay` completa su rollout en el namespace de la bahía.
