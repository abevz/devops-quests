title: Deriva Argo CD
brief: 'Te uniste a las operaciones de SignalRail. Restaure una aplicación desviada desde un repositorio
  privado Gitea. Trabajar en ~/quest. Mantenga todos los cambios dentro de esta bahía de entrenamiento.


  Entradas en `~/quest`: `repository/manifests/relay.json`, `application.json`, `platform.env`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente los archivos suministrados, las imágenes
  precargadas y los servicios privados. Todos los cambios deben permanecer dentro de esta bahía.


  Criterios de éxito iniciales: Argo CD informa Synced/Healthy y el route en vivo es north.'
stages.0.brief: 'Un repositorio privado Gitea es el estado deseado. La RUTA en vivo se desvió. Inspeccione
  Application station, sync a través de Argo CD y espere Synced/Healthy.


  Criterios de éxito: Argo CD informa Synced/Healthy y el route en vivo es north.'
stages.0.objectives.0.text: Argo CD informa Synced/Healthy y el route en vivo es north.
hints.0.text: Compare el estado de Application station con su Deployment en vivo.
hints.1.text: La fuente privada Git todavía declara ROUTE=north; una edición manual en vivo provocó una
  deriva.
hints.2.text: Solicite operation.sync en Application station y verifique Synced, Healthy y el valor real
  de pod.
debrief: El route en vivo proviene del privado Git. Solicitó un Argo CD sync real y verificó Synced, Healthy
  y el entorno pod real.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué tanto el estado de la plataforma como el consumidor real.
