title: Argo CD drift
brief: 'The live route does not meet the required delivery contract.


  Work on the workstation in `~/quest` with `repository/manifests/relay.yaml`, `application.yaml`, `platform.env`.


  **Requirements:**

  - Application `station` reports `Synced` and `Healthy`.

  - The running `relay` process uses the route declared in the supplied Git configuration.

  - Deployment `relay` completes its rollout in the bay namespace.


  The final consumer check reads process environment, not served content.


  Additional files: `handover-contract.json`, `original-handover.json`, `release-commit`.


  Preserve the original immutable configuration, its data and the existing consumer Pod, including its image, command
  and projected input. Preserve the Application and Deployment identities. The current route must use a distinct
  immutable configuration published by Git. The Application must reconcile the managed Deployment without excluding
  its differences. Publish a descendant of the recorded baseline and reconcile the actual remote revision.


  The setup receipt under `/run/dq/facts/0/` is authoritative; files in `~/quest` are working copies. Checks observe
  current state.'
stages.0.brief: The running route must meet the Git-managed delivery contract.
hints.0.text: Immutable input and a running consumer can have different lifetimes. A new desired value need not
  belong in the original object.
hints.1.text: Compare `handover-contract.json`, the Git manifests and the Application's observed operation and difference
  rules. Inspect the immutable configuration and the Pod that still projects it; compare the managed Deployment's
  declared and running route.
hints.2.text: 'Publish a new immutable route configuration, bind the managed Deployment to it and keep the previous
  input for its existing consumer. Remove exclusions that cover the managed Deployment, commit and push, then request
  sync. Verify the remote revision, `Synced` / `Healthy`, the running route and the original UIDs, consumer response
  and retained data.


  `kubectl get application station; kubectl exec deployment/relay -c worker -- printenv ROUTE; kubectl exec retained-reader
  -- wget -qO- -T 3 http://127.0.0.1:8080` — Expect Synced/Healthy, the required route and the retained consumer
  response from the receipt.'
debrief: You recovered Git reconciliation through a versioned immutable handover while retaining the original consumer
  and configuration.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked both the platform status and the actual consumer.
stages.0.objectives.0.text: 'Application `station` reports `Synced` and `Healthy`. The published handover satisfies
  `handover-contract.json`: original identities and the existing consumer are retained, the route uses a new immutable
  configuration, and Git reconciliation covers the managed Deployment.'
stages.0.objectives.1.text: The running `relay` process uses the route declared in the supplied Git configuration.
stages.0.objectives.2.text: Deployment `relay` completes its rollout in the bay namespace.
diagnostics.handover_identity: An original object was replaced. Compare Application, Deployment, configuration and
  consumer Pod UIDs with the receipt.
diagnostics.handover_retained: The original immutable configuration or its data changed. Preserve the input still
  mounted by the existing consumer.
diagnostics.handover_reader: The existing consumer differs from its receipt or response. Compare its image, command,
  projection and actual HTTP.
diagnostics.handover_binding: The route does not use a distinct immutable configuration. Compare its live binding,
  data and published Git manifests.
diagnostics.handover_scope: Difference exclusions still cover the managed Deployment. Inspect the Application reconciliation
  boundary.
diagnostics.handover_source: Published intent and adoption disagree. Compare repository, ancestry, observed revision,
  route binding and generated resources.
diagnostics.handover_budget: Observation exceeded its budget. Inspect blocking Git/API requests and connectivity.
diagnostics.handover_observation: Current state could not be observed. Inspect required receipts, resource availability
  and input formats.
diagnostics.probe_0_0: Current state could not be observed. Inspect required receipts, resource availability and
  input formats.
