title: Argo CD drift
brief: 'The live route does not meet the required delivery contract.


  Work on the workstation in `~/quest` with `repository/manifests/relay.yaml`, `application.yaml`, `platform.env`.


  **Requirements:**

  - Application `station` reports `Synced` and `Healthy`.

  - The running `relay` process uses the route declared in the supplied Git configuration.

  - Deployment `relay` completes its rollout in the bay namespace.


  The final consumer check reads process environment, not served content.


  Additional files: `handover-contract.json`, `original-handover.json`, `release-commit`.


  Preserve the original immutable configuration, its data and the existing consumer Pod, including its image, command
  and projected input. Preserve the Application and Deployment identities. The current route must use a distinct
  immutable configuration published by Git. The Application must reconcile the managed Deployment without excluding
  its differences. Publish a descendant of the recorded baseline and reconcile the actual remote revision.


  The setup receipt under `/run/dq/facts/0/` is authoritative; files in `~/quest` are working copies. Checks observe
  current state.'
stages.0.brief: The running route must meet the Git-managed delivery contract.
hints.0.text: Immutable input and a running consumer can have different lifetimes. A new desired value need not
  belong in the original object.
hints.1.text: |-
  Compare `handover-contract.json`, the Git manifests and the Application's observed operation and difference rules. Inspect the immutable configuration and the Pod that still projects it; compare the managed Deployment's declared and running route.

  Look at the previous route ConfigMap and the reference used by its retained consumer. In Git, find the managed Deployment’s reference and the Application’s difference rules.
hints.2.text: |-
  Verify the remote revision, `Synced` / `Healthy`, the running route and the original UIDs, consumer response and retained data.

  `kubectl get application station; kubectl exec deployment/relay -c worker -- printenv ROUTE; kubectl exec retained-reader -- wget -qO- -T 3 http://127.0.0.1:8080` — Expect Synced/Healthy, the required route and the retained consumer response from the receipt.

  Compare the Git main hash with the Application’s observed revision and verify baseline ancestry. Compare the original identities and old ConfigMap data with the current resources, then check the new route and the original response from `retained-reader`.

  ```bash
  remote=$(git -C repository ls-remote origin refs/heads/main | cut -f1)
  printf "%s\n" "$remote"
  git -C repository merge-base --is-ancestor "$(jq -er .baselineCommit handover-contract.json)" "$remote"
  jq .original handover-contract.json
  kubectl get application/station deployment/relay configmap/relay-route pod/retained-reader -o yaml
  kubectl exec deployment/relay -c worker -- printenv ROUTE
  kubectl exec retained-reader -- wget -qO- -T 3 http://127.0.0.1:8080
  ```
debrief: You recovered Git reconciliation through a versioned immutable handover while retaining the original consumer
  and configuration.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked both the platform status and the actual consumer.
stages.0.objectives.0.text: 'Application `station` reports `Synced` and `Healthy`. The published handover satisfies
  `handover-contract.json`: original identities and the existing consumer are retained, the route uses a new immutable
  configuration, and Git reconciliation covers the managed Deployment.'
stages.0.objectives.1.text: The running `relay` process uses the route declared in the supplied Git configuration.
stages.0.objectives.2.text: Deployment `relay` completes its rollout in the bay namespace.
diagnostics.handover_identity: An original Application, Deployment, ConfigMap or Pod UID changed; deleting and recreating an object can retain its name while replacing the identity preserved by setup. [Cause and check](guides#guide=cicd-gitops-8&section=handover-original-identities)
diagnostics.handover_retained: The retained ConfigMap is no longer immutable with its original data; replacing or changing it to switch the active route can break the input still used by the original consumer Pod. [Cause and check](guides#guide=cicd-gitops-8&section=handover-retained-configuration)
diagnostics.handover_reader: The original Pod fields or HTTP bytes differ from the retained receipt; changing its image, command, mounts or security context, or serving altered configuration data, can break the preserved consumer. [Cause and check](guides#guide=cicd-gitops-8&section=handover-original-consumer)
diagnostics.handover_binding: The active route still uses the retained map or an invalid reference, or the new map is not immutable with the required value; an immutable in-place update must be replaced by a distinct configuration version. [Cause and check](guides#guide=cicd-gitops-8&section=handover-versioned-binding)
diagnostics.handover_scope: A matching Deployment ignoreDifferences rule still excludes fields from reconciliation; the supplied environment exclusion can hide live drift instead of adopting the published route binding. [Cause and check](guides#guide=cicd-gitops-8&section=handover-managed-comparison)
diagnostics.handover_source: The handover may exist only live or locally; an unpushed or unsynchronized Git revision, changed Application source/destination, or Git/live binding and data differences can prevent adoption of the published configuration. [Cause and check](guides#guide=cicd-gitops-8&section=handover-published-source)
diagnostics.handover_budget: A command or the overall handover deadline expired; slow Git, Kubernetes API or Pod HTTP observations may prevent completing all comparisons within the bounded probe. [Cause and check](guides#guide=cicd-gitops-8&section=handover-observation-budget)
diagnostics.handover_observation: The handover could not be observed consistently; missing objects or protected evidence, malformed ROUTE entries or manifests, or failed Git fetch/ancestry and API operations may explain it. [Cause and check](guides#guide=cicd-gitops-8&section=handover-input-observation)
diagnostics.probe_0_0: Application is not Synced and Healthy, or the observer could not start; Git may still request an in-place change to the retained immutable map, while platform.env, Python or required probe inputs may also be unavailable. [Cause and check](guides#guide=cicd-gitops-8&section=handover-sync-health)
diagnostics.handover_route: Deployment relay does not report ROUTE=north or exec failed; it may still use the retained map or an old Pod environment instead of the new immutable configuration. [Cause and check](guides#guide=cicd-gitops-8&section=handover-live-route)
diagnostics.handover_rollout: Deployment relay did not complete rollout within 3 seconds; the new ConfigMap or key may be unavailable, replacement Pods may not have started, or the API observation failed. [Cause and check](guides#guide=cicd-gitops-8&section=handover-workload-readiness)
