title: Argo CD drift
brief: 'You joined SignalRail operations. Restore a drifted application from a private Gitea repository.
  Work in ~/quest. Keep all changes inside this training bay.


  Inputs in `~/quest`: `repository/manifests/relay.json`, `application.json`, `platform.env`.


  The bay has no Internet or external DNS. Use only its supplied files, preloaded images and private services.
  All changes must stay inside this bay.


  Initial success criteria: Argo CD reports Synced/Healthy and the live route is north.'
stages.0.brief: 'A private Gitea repository is the desired state. The live ROUTE drifted. Inspect Application
  station, sync it through Argo CD and wait for Synced/Healthy.


  Success criteria: Argo CD reports Synced/Healthy and the live route is north.'
stages.0.objectives.0.text: Argo CD reports Synced/Healthy and the live route is north.
hints.0.text: Compare Application station status with its live Deployment.
hints.1.text: The private Git source still declares ROUTE=north; a manual live edit caused drift.
hints.2.text: Request operation.sync on Application station and verify Synced, Healthy and the real pod
  value.
debrief: The live route drifted from private Git. You requested a real Argo CD sync and verified Synced,
  Healthy and the actual pod environment.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked both the platform status and the actual consumer.
