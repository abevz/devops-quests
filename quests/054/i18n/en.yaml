title: Argo CD drift
brief: 'The live route does not meet the required delivery contract.


  Work on the workstation in `~/quest` with `repository/manifests/relay.yaml`, `application.yaml`, `platform.env`.


  **Requirements:**

  - Application `station` reports `Synced` and `Healthy`.

  - The running `relay` process uses the route declared in the supplied Git configuration.

  - Deployment `relay` completes its rollout in the bay namespace.


  The final consumer check reads process environment, not served content.

  '
stages.0.brief: The running route must meet the Git-managed delivery contract.
hints.0.text: Git desired state and live runtime state can diverge.
hints.1.text: 'The private Git source still declares ROUTE=north; a manual live edit caused drift.


  Inspect the supplied inputs and observed state:


  ```sh

  cat repository/manifests/relay.yaml

  kubectl get deployment relay -o yaml

  ```'
hints.2.text: |-
  Request operation.sync on Application station.

  Verify the observed result:

  - `kubectl get application station -o custom-columns=NAME:.metadata.name,SYNC:.status.sync.status,HEALTH:.status.health.status` — Application `station` reports `Synced` / `Healthy`.
  - `kubectl rollout status deployment/relay --timeout=10s; kubectl exec deployment/relay -c worker -- printenv ROUTE` — Rollout completes and the process reports `north`.

debrief: The live route drifted from private Git. You requested a real Argo CD sync and verified Synced, Healthy
  and the actual pod environment.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked both the platform status and the actual consumer.
stages.0.objectives.0.text: Application `station` reports `Synced` and `Healthy`.
stages.0.objectives.1.text: The running `relay` process uses the route declared in the supplied Git configuration.
stages.0.objectives.2.text: Deployment `relay` completes its rollout in the bay namespace.
