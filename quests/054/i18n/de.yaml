title: Argo CD Drift
brief: 'Die laufende Route erfüllt den erforderlichen Auslieferungsvertrag nicht.


  Arbeiten Sie auf der Workstation in `~/quest` mit `repository/manifests/relay.yaml`, `application.yaml`,
  `platform.env`.


  **Anforderungen:**

  - Application `station` meldet `Synced` und `Healthy`.

  - Der laufende Prozess `relay` verwendet die in der mitgelieferten Git-Konfiguration deklarierte Route.

  - Deployment `relay` schließt seinen Rollout im Bay-Namespace ab.


  Die abschließende Verbraucherprüfung liest die Prozessumgebung, nicht ausgelieferte Inhalte.

  '
stages.0.brief: Die laufende Route muss den über Git verwalteten Auslieferungsvertrag erfüllen.
hints.0.text: Gewünschter Zustand in Git und laufender Runtime-Zustand können auseinanderlaufen.
hints.1.text: 'Die private Git-Quelle deklariert weiterhin ROUTE=north; Ein manueller Live-Schnitt verursachte
  Drift.


  Prüfen Sie die mitgelieferten Eingaben und den beobachteten Zustand:


  ```sh

  cat repository/manifests/relay.yaml

  kubectl get deployment relay -o yaml

  ```'
hints.2.text: |-
  Fordere operation.sync für Application station an.

  Prüfen Sie das beobachtete Ergebnis:

  - `kubectl get application station -o custom-columns=NAME:.metadata.name,SYNC:.status.sync.status,HEALTH:.status.health.status` — Application `station` meldet `Synced` / `Healthy`.
  - `kubectl rollout status deployment/relay --timeout=10s; kubectl exec deployment/relay -c worker -- printenv ROUTE` — Der Rollout wird abgeschlossen und der Prozess meldet `north`.

debrief: Der Live-route driftete vom privaten Git ab. Sie haben eine echte Argo CD sync angefordert und Synced,
  Healthy und die tatsächliche pod-Umgebung überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe sowohl den Plattformstatus als auch den tatsächlichen Verbraucher überprüft.
stages.0.objectives.0.text: Application `station` meldet `Synced` und `Healthy`.
stages.0.objectives.1.text: Der laufende Prozess `relay` verwendet die in der mitgelieferten Git-Konfiguration
  deklarierte Route.
stages.0.objectives.2.text: Deployment `relay` schließt seinen Rollout im Bay-Namespace ab.
