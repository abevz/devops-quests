title: Argo CD Drift
brief: 'Die laufende Route erfüllt den erforderlichen Auslieferungsvertrag nicht.


  Arbeiten Sie auf der Workstation in `~/quest` mit `repository/manifests/relay.yaml`, `application.yaml`, `platform.env`.


  **Anforderungen:**

  - Application `station` meldet `Synced` und `Healthy`.

  - Der laufende Prozess `relay` verwendet die in der mitgelieferten Git-Konfiguration deklarierte Route.

  - Deployment `relay` schließt seinen Rollout im Bay-Namespace ab.


  Die abschließende Verbraucherprüfung liest die Prozessumgebung, nicht ausgelieferte Inhalte.


  Zusätzliche Dateien: `handover-contract.json`, `original-handover.json`, `release-commit`.


  Bewahre die ursprüngliche unveränderliche Konfiguration, ihre Daten und den bestehenden Verbraucher-Pod einschließlich
  Image, Befehl und projizierter Eingabe. Bewahre die Identitäten von Application und Deployment. Die aktuelle Route
  muss eine separate, über Git veröffentlichte unveränderliche Konfiguration verwenden. Die Application muss das
  verwaltete Deployment ohne Ausnahmen für dessen Unterschiede abgleichen. Veröffentliche einen Nachfahren der aufgezeichneten
  Ausgangsrevision und gleiche die tatsächliche entfernte Revision ab.


  Der Ausgangsbeleg unter `/run/dq/facts/0/` ist maßgeblich; Dateien in `~/quest` sind Arbeitskopien. Geprüft wird
  der aktuelle Zustand.'
stages.0.brief: Die laufende Route muss den über Git verwalteten Auslieferungsvertrag erfüllen.
hints.0.text: Unveränderliche Eingaben und laufende Verbraucher können unterschiedliche Lebenszeiten haben. Ein
  neuer Sollwert muss nicht in das ursprüngliche Objekt gehören.
hints.1.text: |-
  Vergleiche `handover-contract.json`, die Git-Manifeste sowie die beobachtete Application-Operation und ihre Ausnahmen. Untersuche die unveränderliche Konfiguration und den Pod, der sie weiterhin projiziert; vergleiche deklarierte und laufende Route des Deployments.

  Prüfe die bisherige Route-ConfigMap und den Verweis des beibehaltenen Verbrauchers. Suche in Git nach dem Verweis im verwalteten Deployment und den Vergleichsregeln der Application.
hints.2.text: |-
  Prüfe die entfernte Revision, `Synced` / `Healthy`, die laufende Route, ursprüngliche UIDs, Verbraucherantwort und erhaltene Daten.

  `kubectl get application station; kubectl exec deployment/relay -c worker -- printenv ROUTE; kubectl exec retained-reader -- wget -qO- -T 3 http://127.0.0.1:8080` — Erwartet werden Synced/Healthy, die geforderte Route und die erhaltene Verbraucherantwort aus dem Beleg.

  Vergleiche den Git-main-Hash mit der beobachteten Application-Revision und prüfe die Abstammung vom Basiscommit. Vergleiche die ursprünglichen UIDs und alten ConfigMap-Daten mit den aktuellen Objekten. Prüfe anschließend die neue Route und die ursprüngliche Antwort von `retained-reader`.

  ```bash
  remote=$(git -C repository ls-remote origin refs/heads/main | cut -f1)
  printf "%s\n" "$remote"
  git -C repository merge-base --is-ancestor "$(jq -er .baselineCommit handover-contract.json)" "$remote"
  jq .original handover-contract.json
  kubectl get application/station deployment/relay configmap/relay-route pod/retained-reader -o yaml
  kubectl exec deployment/relay -c worker -- printenv ROUTE
  kubectl exec retained-reader -- wget -qO- -T 3 http://127.0.0.1:8080
  ```
debrief: Du hast den Git-Abgleich durch eine versionierte unveränderliche Übergabe wiederhergestellt und den ursprünglichen
  Verbraucher samt Konfiguration erhalten.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe sowohl den Plattformstatus als auch den tatsächlichen Verbraucher überprüft.
stages.0.objectives.0.text: 'Application `station` meldet `Synced` und `Healthy`. Die veröffentlichte Übergabe erfüllt
  `handover-contract.json`: ursprüngliche Identitäten und Verbraucher bleiben erhalten, die Route nutzt eine neue
  unveränderliche Konfiguration und der Git-Abgleich erfasst das verwaltete Deployment.'
stages.0.objectives.1.text: Der laufende Prozess `relay` verwendet die in der mitgelieferten Git-Konfiguration deklarierte
  Route.
stages.0.objectives.2.text: Deployment `relay` schließt seinen Rollout im Bay-Namespace ab.
diagnostics.handover_identity: Die ursprüngliche UID von Application, Deployment, ConfigMap oder Pod hat sich geändert; Löschen und Neuerstellen kann den Namen bewahren, ersetzt aber die im Setup festgehaltene Identität. [Ursache und Prüfung](guides#guide=cicd-gitops-8&section=handover-original-identities)
diagnostics.handover_retained: Die erhaltene ConfigMap ist nicht mehr immutable mit ursprünglichen Daten; Ersetzen oder Ändern zum Routenwechsel kann die vom ursprünglichen Pod weiter genutzte Eingabe verletzen. [Ursache und Prüfung](guides#guide=cicd-gitops-8&section=handover-retained-configuration)
diagnostics.handover_reader: Felder des ursprünglichen Pods oder HTTP-Bytes weichen vom Beleg ab; geändertes Image, Befehl, Mounts oder Sicherheitskontext sowie andere ausgelieferte Daten können den erhaltenen Verbraucher verletzen. [Ursache und Prüfung](guides#guide=cicd-gitops-8&section=handover-original-consumer)
diagnostics.handover_binding: Die aktive Route nutzt noch die erhaltene Map oder eine ungültige Referenz, oder die neue Map ist nicht immutable mit benötigtem Wert; statt einer In-place-Änderung ist eine separate Konfigurationsversion erforderlich. [Ursache und Prüfung](guides#guide=cicd-gitops-8&section=handover-versioned-binding)
diagnostics.handover_scope: Eine passende Deployment-Regel in ignoreDifferences schließt noch Felder vom Abgleich aus; die gelieferte Umgebungsausnahme kann Live-Drift verbergen, statt die veröffentlichte Routenbindung zu übernehmen. [Ursache und Prüfung](guides#guide=cicd-gitops-8&section=handover-managed-comparison)
diagnostics.handover_source: Die Übergabe besteht möglicherweise nur live oder lokal; eine nicht gepushte oder synchronisierte Revision, geänderte Application-Quelle beziehungsweise Ziel oder unterschiedliche Git-/Live-Referenzen und Daten verhindern die Übernahme. [Ursache und Prüfung](guides#guide=cicd-gitops-8&section=handover-published-source)
diagnostics.handover_budget: Das Zeitlimit eines Befehls oder der gesamten Übergabeprüfung ist abgelaufen; langsame Git-, Kubernetes-API- oder Pod-HTTP-Beobachtungen können vollständige Vergleiche verhindern. [Ursache und Prüfung](guides#guide=cicd-gitops-8&section=handover-observation-budget)
diagnostics.handover_observation: Die Übergabe konnte nicht konsistent beobachtet werden; fehlende Objekte oder geschützte Belege, fehlerhafte ROUTE-Einträge beziehungsweise Manifeste oder fehlgeschlagene Git-Fetch-/Abstammungs- und API-Vorgänge können die Ursache sein. [Ursache und Prüfung](guides#guide=cicd-gitops-8&section=handover-input-observation)
diagnostics.probe_0_0: Application ist nicht Synced und Healthy oder die Beobachtung konnte nicht starten; Git fordert möglicherweise noch eine In-place-Änderung der erhaltenen immutable Map an, oder platform.env, Python beziehungsweise Prüfeingaben sind nicht verfügbar. [Ursache und Prüfung](guides#guide=cicd-gitops-8&section=handover-sync-health)
diagnostics.handover_route: Deployment relay meldet nicht ROUTE=north oder exec schlug fehl; möglicherweise nutzt es noch die erhaltene Map oder eine alte Pod-Umgebung statt der neuen immutable Konfiguration. [Ursache und Prüfung](guides#guide=cicd-gitops-8&section=handover-live-route)
diagnostics.handover_rollout: Deployment relay hat den Rollout nicht innerhalb von 3 Sekunden abgeschlossen; neue ConfigMap oder Schlüssel fehlen möglicherweise, neue Pods sind noch nicht gestartet oder die API-Beobachtung schlug fehl. [Ursache und Prüfung](guides#guide=cicd-gitops-8&section=handover-workload-readiness)
