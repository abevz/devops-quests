title: Argo CD Drift
brief: 'Sie sind dem Betrieb SignalRail beigetreten. Stellen Sie eine verschobene Anwendung aus einem
  privaten Gitea-Repository wieder her. Arbeiten Sie in ~/quest.. Bewahren Sie alle Änderungen in diesem
  Trainingsbereich auf.


  Eingänge in `~/quest`: `repository/manifests/relay.json`, `application.json`, `platform.env`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur die bereitgestellten Dateien,
  vorinstallierten Bilder und privaten Dienste. Alle Änderungen müssen innerhalb dieser Bucht bleiben.


  Erste Erfolgskriterien: Argo CD meldet Synced/Healthy und der Live-route ist north.'
stages.0.brief: 'Ein privates Gitea-Repository ist der gewünschte Zustand. Die Live-ROUTE driftete. Überprüfen
  Sie Application station, sync bis Argo CD und warten Sie auf Synced/Healthy.


  Erfolgskriterien: Argo CD meldet Synced/Healthy und der Live-route ist north.'
stages.0.objectives.0.text: Argo CD meldet Synced/Healthy und der Live-route ist north.
hints.0.text: Vergleichen Sie den Status Application station mit seinem Live-Status Deployment.
hints.1.text: Die private Git-Quelle deklariert weiterhin ROUTE=north; Ein manueller Live-Schnitt verursachte
  Drift.
hints.2.text: Fordern Sie operation.sync auf Application station an und überprüfen Sie Synced, Healthy
  und den tatsächlichen pod-Wert.
debrief: Der Live-route driftete vom privaten Git ab. Sie haben eine echte Argo CD sync angefordert und
  Synced, Healthy und die tatsächliche pod-Umgebung überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe sowohl den Plattformstatus als auch den tatsächlichen Verbraucher überprüft.
