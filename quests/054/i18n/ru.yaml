title: Дрейф Argo CD
brief: 'Живой маршрут не соответствует требуемому контракту доставки.


  Работайте на рабочей станции в `~/quest` с `repository/manifests/relay.yaml`, `application.yaml`, `platform.env`.


  **Требования:**

  - Application `station` сообщает `Synced` и `Healthy`.

  - Работающий процесс `relay` использует маршрут, объявленный в поставленной Git-конфигурации.

  - Deployment `relay` завершает rollout в namespace песочницы.


  Финальная проверка потребителя читает окружение процесса, а не выдаваемое содержимое.


  Дополнительные файлы: `handover-contract.json`, `original-handover.json`, `release-commit`.


  Сохраните исходную неизменяемую конфигурацию, её данные и существующий Pod потребителя, включая образ, команду
  и проецируемый источник. Сохраните идентичности Application и Deployment. Текущий маршрут должен использовать
  отдельную неизменяемую конфигурацию, опубликованную через Git. Application должен согласовывать управляемый Deployment
  без исключения его различий. Опубликуйте потомка зафиксированной исходной ревизии и согласуйте фактическую удалённую
  ревизию.


  Исходная запись в `/run/dq/facts/0/` является эталоном; файлы в `~/quest` — рабочие копии. Проверяется текущее
  состояние.'
stages.0.brief: Работающий маршрут должен соответствовать контракту доставки через Git.
hints.0.text: Неизменяемый источник и работающий потребитель могут иметь разные сроки жизни. Новому значению не
  обязательно принадлежать исходному объекту.
hints.1.text: |-
  Сопоставьте `handover-contract.json`, манифесты Git, наблюдаемую операцию Application и правила исключения различий. Изучите неизменяемую конфигурацию и Pod, который продолжает её проецировать; сравните объявленный и фактический маршрут Deployment.

  Изучите прежний ConfigMap маршрута и ссылку у сохранённого потребителя. В Git найдите ссылку управляемого Deployment и правила сравнения Application.
hints.2.text: |-
  Проверьте удалённую ревизию, `Synced` / `Healthy`, работающий маршрут, исходные UID, ответ потребителя и сохранённые данные.

  `kubectl get application station; kubectl exec deployment/relay -c worker -- printenv ROUTE; kubectl exec retained-reader -- wget -qO- -T 3 http://127.0.0.1:8080` — Ожидаются Synced/Healthy, требуемый маршрут и сохранённый ответ потребителя из исходной записи.

  Сверьте хэш Git main с наблюдаемой ревизией Application и проверьте происхождение от базового коммита. Сравните исходные UID и данные прежнего ConfigMap с текущими объектами, затем проверьте новый маршрут и исходный ответ от `retained-reader`.

  ```bash
  remote=$(git -C repository ls-remote origin refs/heads/main | cut -f1)
  printf "%s\n" "$remote"
  git -C repository merge-base --is-ancestor "$(jq -er .baselineCommit handover-contract.json)" "$remote"
  jq .original handover-contract.json
  kubectl get application/station deployment/relay configmap/relay-route pod/retained-reader -o yaml
  kubectl exec deployment/relay -c worker -- printenv ROUTE
  kubectl exec retained-reader -- wget -qO- -T 3 http://127.0.0.1:8080
  ```
debrief: Вы восстановили согласование Git через версионируемую неизменяемую конфигурацию, сохранив исходного потребителя
  и его данные.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я проверил статус платформы и фактического потребителя.
stages.0.objectives.0.text: 'Application `station` сообщает `Synced` и `Healthy`. Опубликованная передача конфигурации
  соответствует `handover-contract.json`: исходные идентичности и потребитель сохранены, маршрут использует новую
  неизменяемую конфигурацию, а согласование Git охватывает управляемый Deployment.'
stages.0.objectives.1.text: Работающий процесс `relay` использует маршрут, объявленный в поставленной Git-конфигурации.
stages.0.objectives.2.text: Deployment `relay` завершает rollout в namespace песочницы.
diagnostics.handover_identity: 'Изменился UID исходного Application, Deployment, ConfigMap или Pod: удаление и пересоздание сохраняют имя, но заменяют идентичность, зафиксированную setup. [Причина и проверка](guides#guide=cicd-gitops-8&section=handover-original-identities)'
diagnostics.handover_retained: 'Сохранённый ConfigMap больше не immutable с исходными данными: его замена или изменение ради переключения маршрута нарушает вход, который продолжает использовать исходный Pod. [Причина и проверка](guides#guide=cicd-gitops-8&section=handover-retained-configuration)'
diagnostics.handover_reader: 'Поля исходного Pod или байты HTTP отличаются от свидетельства: изменение образа, команды, монтирований, security context или выдача других данных нарушает сохранённого потребителя. [Причина и проверка](guides#guide=cicd-gitops-8&section=handover-original-consumer)'
diagnostics.handover_binding: 'Активный маршрут ещё использует сохранённую карту или неверную ссылку либо новая карта не immutable с нужным значением: вместо изменения immutable-объекта на месте нужна отдельная версия конфигурации. [Причина и проверка](guides#guide=cicd-gitops-8&section=handover-versioned-binding)'
diagnostics.handover_scope: 'Правило ignoreDifferences для нужного Deployment ещё исключает поля из согласования: выданное исключение окружения может скрывать live drift вместо применения опубликованной ссылки маршрута. [Причина и проверка](guides#guide=cicd-gitops-8&section=handover-managed-comparison)'
diagnostics.handover_source: 'Передача может существовать только live или локально: неопубликованный или несинхронизированный коммит, изменённые источник и назначение Application либо расхождение ссылок и данных Git/live мешают применению опубликованной конфигурации. [Причина и проверка](guides#guide=cicd-gitops-8&section=handover-published-source)'
diagnostics.handover_budget: 'Истёк лимит отдельной команды или всей проверки: медленные запросы Git, Kubernetes API или HTTP в Pod могут помешать завершить все сравнения вовремя. [Причина и проверка](guides#guide=cicd-gitops-8&section=handover-observation-budget)'
diagnostics.handover_observation: 'Не удалось согласованно наблюдать передачу: причиной могут быть отсутствующие объекты или защищённые данные, некорректные записи ROUTE или манифесты, ошибки Git fetch, ancestry и API. [Причина и проверка](guides#guide=cicd-gitops-8&section=handover-input-observation)'
diagnostics.probe_0_0: 'Application не имеет Synced и Healthy либо наблюдение не началось: Git мог сохранить изменение immutable-карты на месте; platform.env, Python или нужные входные данные также могут быть недоступны. [Причина и проверка](guides#guide=cicd-gitops-8&section=handover-sync-health)'
diagnostics.handover_route: 'Deployment relay не сообщает ROUTE=north либо exec завершился ошибкой: мог сохраниться старый ConfigMap или окружение Pod вместо новой immutable-конфигурации. [Причина и проверка](guides#guide=cicd-gitops-8&section=handover-live-route)'
diagnostics.handover_rollout: 'Deployment relay не завершил rollout за 3 секунды: новый ConfigMap или ключ недоступен, новые Pod ещё не запустились либо наблюдение API завершилось ошибкой. [Причина и проверка](guides#guide=cicd-gitops-8&section=handover-workload-readiness)'
