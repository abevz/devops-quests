title: Дрейф Argo CD
brief: 'Вы в команде эксплуатации SignalRail. Восстановите приложение из приватного Gitea. Работайте в
  ~/quest. Все изменения — только в этой песочнице.


  Входные файлы в `~/quest`: `repository/manifests/relay.json`, `application.json`, `platform.env`.


  В песочнице нет интернета и внешнего DNS. Используйте только выданные файлы, предварительно загруженные
  образы и приватные сервисы. Все изменения — только в этой песочнице.


  Цели первого этапа: Argo CD сообщает Synced/Healthy, фактический маршрут north.'
stages.0.brief: 'Приватный Gitea хранит желаемое состояние. ROUTE изменён вручную. Исследуйте Application
  station, выполните sync через Argo CD и дождитесь Synced/Healthy.


  Результат проверки: Argo CD сообщает Synced/Healthy, фактический маршрут north.'
stages.0.objectives.0.text: Argo CD сообщает Synced/Healthy, фактический маршрут north.
hints.0.text: Сравните статус Application station и работающий Deployment.
hints.1.text: В приватном Git объявлено ROUTE=north; ручная правка создала дрейф.
hints.2.text: Запросите operation.sync у Application station и проверьте Synced, Healthy и значение в
  pod.
debrief: Маршрут разошёлся с приватным Git. Вы выполнили реальный sync Argo CD и проверили Synced, Healthy
  и окружение pod.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я проверил статус платформы и фактического потребителя.
