title: Дрейф Argo CD
brief: 'Живой маршрут не соответствует требуемому контракту доставки.


  Работайте на рабочей станции в `~/quest` с `repository/manifests/relay.yaml`, `application.yaml`, `platform.env`.


  **Требования:**

  - Application `station` сообщает `Synced` и `Healthy`.

  - Работающий процесс `relay` использует маршрут, объявленный в поставленной Git-конфигурации.

  - Deployment `relay` завершает rollout в namespace песочницы.


  Финальная проверка потребителя читает окружение процесса, а не выдаваемое содержимое.

  '
stages.0.brief: Работающий маршрут должен соответствовать контракту доставки через Git.
hints.0.text: Желаемое состояние в Git и живое состояние среды могут расходиться.
hints.1.text: 'В приватном Git объявлено ROUTE=north; ручная правка создала дрейф.


  Изучите поставленные входные данные и наблюдаемое состояние:


  ```sh

  cat repository/manifests/relay.yaml

  kubectl get deployment relay -o yaml

  ```'
hints.2.text: 'Запросите operation.sync для Application station.


  Проверьте наблюдаемый результат:


  - `kubectl get application station -o custom-columns=NAME:.metadata.name,SYNC:.status.sync.status,HEALTH:.status.health.status`
  — Application `station` сообщает `Synced` / `Healthy`.

  - `kubectl rollout status deployment/relay --timeout=10s; kubectl exec deployment/relay -- printenv ROUTE`
  — Rollout завершается, процесс сообщает `north`.'
debrief: Маршрут разошёлся с приватным Git. Вы выполнили реальный sync Argo CD и проверили Synced, Healthy
  и окружение pod.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я проверил статус платформы и фактического потребителя.
stages.0.objectives.0.text: Application `station` сообщает `Synced` и `Healthy`.
stages.0.objectives.1.text: Работающий процесс `relay` использует маршрут, объявленный в поставленной Git-конфигурации.
stages.0.objectives.2.text: Deployment `relay` завершает rollout в namespace песочницы.
