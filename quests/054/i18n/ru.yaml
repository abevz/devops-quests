title: Дрейф Argo CD
brief: 'Живой маршрут не соответствует требуемому контракту доставки.


  Работайте на рабочей станции в `~/quest` с `repository/manifests/relay.yaml`, `application.yaml`, `platform.env`.


  **Требования:**

  - Application `station` сообщает `Synced` и `Healthy`.

  - Работающий процесс `relay` использует маршрут, объявленный в поставленной Git-конфигурации.

  - Deployment `relay` завершает rollout в namespace песочницы.


  Финальная проверка потребителя читает окружение процесса, а не выдаваемое содержимое.


  Дополнительные файлы: `handover-contract.json`, `original-handover.json`, `release-commit`.


  Сохраните исходную неизменяемую конфигурацию, её данные и существующий Pod потребителя, включая образ, команду
  и проецируемый источник. Сохраните идентичности Application и Deployment. Текущий маршрут должен использовать
  отдельную неизменяемую конфигурацию, опубликованную через Git. Application должен согласовывать управляемый Deployment
  без исключения его различий. Опубликуйте потомка зафиксированной исходной ревизии и согласуйте фактическую удалённую
  ревизию.


  Исходная запись в `/run/dq/facts/0/` является эталоном; файлы в `~/quest` — рабочие копии. Проверяется текущее
  состояние.'
stages.0.brief: Работающий маршрут должен соответствовать контракту доставки через Git.
hints.0.text: Неизменяемый источник и работающий потребитель могут иметь разные сроки жизни. Новому значению не
  обязательно принадлежать исходному объекту.
hints.1.text: Сопоставьте `handover-contract.json`, манифесты Git, наблюдаемую операцию Application и правила исключения
  различий. Изучите неизменяемую конфигурацию и Pod, который продолжает её проецировать; сравните объявленный и
  фактический маршрут Deployment.
hints.2.text: 'Опубликуйте новую неизменяемую конфигурацию маршрута, привяжите к ней управляемый Deployment и сохраните
  прежний источник для существующего потребителя. Уберите исключения, охватывающие Deployment, сделайте commit и
  push, затем запросите sync. Проверьте удалённую ревизию, `Synced` / `Healthy`, работающий маршрут, исходные UID,
  ответ потребителя и сохранённые данные.


  `kubectl get application station; kubectl exec deployment/relay -c worker -- printenv ROUTE; kubectl exec retained-reader
  -- wget -qO- -T 3 http://127.0.0.1:8080` — Ожидаются Synced/Healthy, требуемый маршрут и сохранённый ответ потребителя
  из исходной записи.'
debrief: Вы восстановили согласование Git через версионируемую неизменяемую конфигурацию, сохранив исходного потребителя
  и его данные.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я проверил статус платформы и фактического потребителя.
stages.0.objectives.0.text: 'Application `station` сообщает `Synced` и `Healthy`. Опубликованная передача конфигурации
  соответствует `handover-contract.json`: исходные идентичности и потребитель сохранены, маршрут использует новую
  неизменяемую конфигурацию, а согласование Git охватывает управляемый Deployment.'
stages.0.objectives.1.text: Работающий процесс `relay` использует маршрут, объявленный в поставленной Git-конфигурации.
stages.0.objectives.2.text: Deployment `relay` завершает rollout в namespace песочницы.
diagnostics.handover_identity: Исходный объект заменён. Сравните UID Application, Deployment, конфигурации и Pod
  потребителя с исходной записью.
diagnostics.handover_retained: Исходная неизменяемая конфигурация или её данные изменились. Сохраните источник,
  который продолжает использовать существующий потребитель.
diagnostics.handover_reader: Существующий потребитель не соответствует исходной записи или ожидаемому ответу. Сравните
  образ, команду, проекцию и реальный HTTP.
diagnostics.handover_binding: Маршрут не использует отдельную неизменяемую конфигурацию. Сравните действующую привязку,
  данные и опубликованные манифесты Git.
diagnostics.handover_scope: Исключения различий по-прежнему охватывают управляемый Deployment. Изучите границу согласования
  Application.
diagnostics.handover_source: Опубликованное состояние и его применение расходятся. Сравните репозиторий, историю,
  наблюдаемую ревизию, привязку маршрута и создаваемые ресурсы.
diagnostics.handover_budget: Наблюдение превысило лимит времени. Проверьте блокирующие запросы Git/API и доступность.
diagnostics.handover_observation: Не удалось наблюдать текущее состояние. Проверьте исходные записи, доступность
  ресурсов и форматы входных данных.
diagnostics.probe_0_0: Не удалось наблюдать текущее состояние. Проверьте исходные записи, доступность ресурсов и
  форматы входных данных.
