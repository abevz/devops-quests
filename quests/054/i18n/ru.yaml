title: Дрейф Argo CD
brief: |
  Живой маршрут не соответствует требуемому контракту доставки.

  Работайте на workstation в `~/quest` с файлами `repository/manifests/relay.yaml`, `application.yaml`, `platform.env`.

  **Требования:**
  - Application в namespace песочницы:
    - Имя: `station`.
    - Статус: `Synced`, `Healthy`.
  - Deployment в namespace песочницы:
    - Имя: `relay`.
    - Rollout завершён.
  - Процесс внутри Pod Deployment `relay`:
    - Переменная окружения: `ROUTE`.
    - Значение: `north`.

  **Самопроверка перед Check & finish:**
  - `kubectl get application station -o custom-columns=NAME:.metadata.name,SYNC:.status.sync.status,HEALTH:.status.health.status` — Application `station` сообщает `Synced` / `Healthy`.
  - `kubectl rollout status deployment/relay --timeout=10s; kubectl exec deployment/relay -- printenv ROUTE` — Rollout завершается, процесс сообщает `north`.

  Финальная проверка потребителя читает окружение процесса, а не выдаваемое содержимое.
stages.0.brief: Работающий маршрут должен соответствовать контракту доставки через Git.
hints.0.text: Желаемое состояние в Git и живое состояние среды могут расходиться.
hints.1.text: В приватном Git объявлено ROUTE=north; ручная правка создала дрейф.
hints.2.text: Запросите operation.sync для Application station.
debrief: Маршрут разошёлся с приватным Git. Вы выполнили реальный sync Argo CD и проверили Synced, Healthy и окружение
  pod.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я проверил статус платформы и фактического потребителя.
stages.0.objectives.0.text: Application `station` сообщает `Synced` и `Healthy`.
stages.0.objectives.1.text: Работающий контейнер `relay` имеет `ROUTE` со значением `north`.
stages.0.objectives.2.text: Deployment `relay` завершает rollout в namespace песочницы.
