title: Service VIP и путь kube-proxy
brief: 'Pod отвечает по IP, но у Service board нет выбранного endpoint. Сравните Pod IP, Service VIP и
  EndpointSlice, прочитайте выданное backend наблюдение kube-proxy. Запишите fault selector в diagnosis.json
  и исправьте selector Service на app: board. Не меняйте kube-proxy, правила узла и общий DNS. Это диагностика
  исправного прокси с отсутствующими backends, а не ремонт прокси.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `board.json`, `client.json`, `service.json`,
  `diagnosis.json`, `proxy-observation.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Диагноз указывает ошибку selector; проверены реальный endpoint, ответ Pod IP и Service
  VIP.'
debrief: Абстракция Service сама не запускает слушающий процесс. Реализация прокси и выбор endpoints —
  разные уровни.
stages.0.brief: 'Диагноз указывает ошибку selector; проверены реальный endpoint, ответ Pod IP и Service
