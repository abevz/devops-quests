title: Service VIP и путь kube-proxy
brief: |-
  Путь через Service табло недоступен. Определите проблему по предоставленным наблюдениям и восстановите оба пути потребителя, сохранив идентичность управляемых объектов.

  Работайте на рабочей станции в `~/quest` с предоставленными файлами:
  - `diagnosis.json`.
  - `proxy-observation.json`.
  - `vip-contract.json`.

  **Требования:**

  - `diagnosis.json` на рабочей станции содержит неисправность, установленную по предоставленным данным.
  - Существующий Service board достигает только предоставленной нагрузки board и имеет готовый endpoint EndpointSlice. Сохраните исходные UID и VIP Service, исходные Deployment и предоставленные образы. Желаемая адресация Service и каждая действующая готовая цель EndpointSlice должны вести на объявленный интерфейс приложения; каждая цель принадлежит текущему готовому Pod предоставленной нагрузки по `vip-contract.json`.
  - Из Deployment `client` и IP Pod `board`, и VIP Service на порту `8080` возвращают `north-118`.
  - Предоставленное наблюдение прокси сообщает о готовности в режиме `iptables`, `nftables` или `ipvs`.

  Запись диагноза — ограниченная классификация, а не полный разбор инцидента. Текущие проверки не доказывают историю изменений. Не меняйте kube-proxy, правила узла и глобальный DNS.
debrief: Проверки сравнили ограниченную классификацию проблемы, идентичность Service/VIP и нагрузок, текущие принадлежащие
  им endpoint, соответствие интерфейсов и оба реальных пути потребителя.
stages.0.brief: Ограничьте восстановление путём Service в этом bay.
hints.0.text: Селектор Service, готовый endpoint и работающий интерфейс приложения описывают разные слои. Готовность
  endpoint не проверяет listener и не устанавливает принадлежность. Сопоставьте весь путь, прежде чем обвинять proxy.
hints.1.text: |-
  Сопоставьте предоставленное наблюдение proxy с выбором Service, текущими портами и идентичностью целей EndpointSlice и путём приложения:

  ```sh
  cat diagnosis.json proxy-observation.json vip-contract.json
  kubectl get service board -o yaml
  kubectl get endpointslices -l kubernetes.io/service-name=board -o yaml
  kubectl get deployment,replicaset,pods -o yaml
  ```
hints.2.text: |-
  Проверьте сохранённые VIP и идентичность нагрузок, реальную принадлежность endpoint и соответствие интерфейсов, затем ответы по прямому Pod IP и Service VIP:

  ```sh
  kubectl get service board -o yaml
  kubectl get endpointslices -l kubernetes.io/service-name=board -o yaml
  kubectl get deployment,replicaset,pods -o yaml
  ip=$(kubectl get pods -l app=board -o jsonpath='{.items[0].status.podIP}')
  vip=$(kubectl get service board -o jsonpath='{.spec.clusterIP}')
  for address in "$ip" "$vip"; do
   kubectl exec deployment/client -- wget -qO- -T 3 "http://$address:8080"
  done
  ```
phrases.0: Я сравнил трафик к Pod IP и Service VIP.
phrases.1: Я изучил готовые endpoints до обвинения прокси.
phrases.2: Я сохранил правила маршрутизации узла.
questions.0.points.0: Это виртуальный адрес Service, реализованный dataplane.
questions.0.points.1: Реальные listeners работают в выбранных backend Pods.
questions.0.prompt: Означает ли ClusterIP, что процесс слушает этот адрес?
questions.1.points.0: 'Нет: режим зависит от платформы, версии и конфигурации.'
questions.1.points.1: Читайте фактическую конфигурацию, а не предполагайте.
questions.1.prompt: Всегда ли kube-proxy использует iptables?
stages.0.objectives.0.text: '`diagnosis.json` на рабочей станции содержит неисправность, установленную по предоставленным
  данным.'
stages.0.objectives.1.text: Существующий Service board достигает только предоставленной нагрузки board и имеет готовый
  endpoint EndpointSlice. Сохраните исходные UID и VIP Service, исходные Deployment и предоставленные образы. Желаемая
  адресация Service и каждая действующая готовая цель EndpointSlice должны вести на объявленный интерфейс приложения;
  каждая цель принадлежит текущему готовому Pod предоставленной нагрузки по `vip-contract.json`.
stages.0.objectives.2.text: Из Deployment `client` и IP Pod `board`, и VIP Service на порту `8080` возвращают `north-118`.
stages.0.objectives.3.text: Предоставленное наблюдение прокси сообщает о готовности в режиме `iptables`, `nftables`
  или `ipvs`.
diagnostics.diagnosis: Запись диагноза могла отсутствовать или указывать на прокси вместо несоответствия селектора. Сравните селектор Service с метками Pod и запишите ошибку селектора в diagnosis.json. [Причина и проверка](guides#guide=kubernetes-10&section=q118-vip-selector-diagnosis)
diagnostics.selector: Service мог всё ещё выбирать старые метки или захватывать посторонний Pod. Сравните app=board и дополнительные метки с текущими Pod board. [Причина и проверка](guides#guide=kubernetes-10&section=q118-vip-matching-board-selector)
diagnostics.endpoint: После исправления селектора в EndpointSlice может ещё не быть готового адреса. Проверьте условие ready и дождитесь готового endpoint. [Причина и проверка](guides#guide=kubernetes-10&section=q118-vip-ready-endpoint-observation)
diagnostics.pod: У выбранного Pod board мог отсутствовать адрес, либо HTTP-листенер недоступен. Запросите IP Pod напрямую из client и сравните с north-118 перед проверкой VIP. [Причина и проверка](guides#guide=kubernetes-10&section=q118-vip-direct-pod-request)
diagnostics.vip: Pod может отвечать напрямую, пока у VIP board нет подходящего backend или отображение портов неверно. Запросите текущий ClusterIP из client и сравните с north-118. [Причина и проверка](guides#guide=kubernetes-10&section=q118-vip-service-live-request)
diagnostics.proxy_ready: Зафиксированная запись прокси могла отсутствовать или не показывать ready. Проверьте выданное наблюдение отдельно от текущей доступности Service. [Причина и проверка](guides#guide=kubernetes-10&section=q118-captured-proxy-readiness)
diagnostics.proxy_mode: Зафиксированный режим прокси мог отсутствовать или отличаться от ожидаемых. Проверьте iptables, nftables или ipvs в выданной записи. [Причина и проверка](guides#guide=kubernetes-10&section=q118-captured-proxy-mode)
diagnostics.probe_0_1: Проверка селектора и VIP может остановиться до указания условия, если не запускается процесс или недоступны входы. Проверьте инструменты и доступ к Service, Pod и EndpointSlice. [Причина и проверка](guides#guide=kubernetes-10&section=q118-vip-observer-input)
diagnostics.vip_identity: Замена необратимо меняет UID сервиса, а также может изменить VIP либо идентификатор или образ нагрузки. Сверьте текущие Deployment board и client, образы Pod и Service с зафиксированными записями. [Причина и проверка](guides#guide=kubernetes-10&section=q118-preserved-vip-delivery-objects)
diagnostics.vip_interface: Порт Service может быть указан, но числовая или именованная цель не ведёт к порту приложения. Сравните отображение, именованные порты текущих Pod и соответствующий TCP-порт EndpointSlice. [Причина и проверка](guides#guide=kubernetes-10&section=q118-vip-endpoint-port-mapping)
diagnostics.vip_owner: Активный endpoint может попасть в срез с меткой board, которым управляет другой Service. Сравните UID контроллера-владельца с исходным UID Service. [Причина и проверка](guides#guide=kubernetes-10&section=q118-vip-original-service-endpoint-owner)
diagnostics.vip_target: В EndpointSlice могла остаться устаревшая цель, адрес другого Pod либо ни одной активной цели. Сравните targetRef и адрес каждой активной цели с готовым текущим Pod Deployment board. [Причина и проверка](guides#guide=kubernetes-10&section=q118-vip-current-ready-target)
