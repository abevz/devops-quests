hints.0.text: Рабочий прямой запрос к Pod отделяет здоровье приложения от выбора Service.
hints.1.text: Service без готовых endpoints не направит запрос к нужному backend.
hints.2.text: Прочитайте неизменяемое наблюдение прокси, запишите selector и исправьте локальный Service.
phrases.0: Я сравнил трафик к Pod IP и Service VIP.
phrases.1: Я изучил готовые endpoints до обвинения прокси.
phrases.2: Я сохранил правила маршрутизации узла.
questions.0.points.0: Это виртуальный адрес Service, реализованный dataplane.
questions.0.points.1: Реальные listeners работают в выбранных backend Pods.
questions.0.prompt: Означает ли ClusterIP, что процесс слушает этот адрес?
questions.1.points.0: 'Нет: режим зависит от платформы, версии и конфигурации.'
questions.1.points.1: Читайте фактическую конфигурацию, а не предполагайте.
