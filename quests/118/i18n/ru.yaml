title: Service VIP и путь kube-proxy
brief: |-
  Путь через Service board недоступен. Определите неисправность по предоставленным данным и восстановите оба пути потребителя.

  Работайте на workstation в `~/quest` с предоставленными файлами:
  - `board.yaml`, `client.yaml`, `service.yaml`, `diagnosis.json`, `proxy-observation.json`.

  **Requirements:**

  - `diagnosis.json` на рабочей станции содержит неисправность, установленную по предоставленным данным.
  - Существующий Service board достигает только предоставленной нагрузки board и имеет готовый endpoint EndpointSlice.
  - Из Deployment `client` и IP Pod `board`, и VIP Service на порту `8080` возвращают `north-118`.
  - Предоставленное наблюдение прокси сообщает о готовности в режиме `iptables`, `nftables` или `ipvs`.

  Готовая конечная точка не устанавливает идентичность её цели; текущие результаты не доказывают историю изменений узла или DNS. Не изменяйте kube-proxy, правила узла и глобальный DNS.
debrief: Абстракция Service сама не запускает слушающий процесс. Реализация прокси и выбор endpoints —
  разные уровни.
stages.0.brief: Ограничьте восстановление путём Service в этом bay.
hints.0.text: Рабочий прямой запрос к Pod отделяет здоровье приложения от выбора Service.
hints.1.text: |-
  Service без готовых endpoints не направит запрос к нужному backend.

  Изучите предоставленные файлы и живые наблюдения:

  ```sh
  cat diagnosis.json proxy-observation.json
    kubectl get service board -o yaml
    kubectl get endpointslices -l kubernetes.io/service-name=board -o yaml
  ```
hints.2.text: |-
  Прочитайте неизменяемое наблюдение прокси, запишите selector и исправьте локальный Service.

  Проверьте результат из `~/quest` на workstation:

  - Оба пути потребителя возвращают `north-118`.

    ```sh
    ip=$(kubectl get pods -l app=board -o jsonpath='{.items[0].status.podIP}')
    vip=$(kubectl get service board -o jsonpath='{.spec.clusterIP}')
    for address in "$ip" "$vip"; do
      kubectl exec deployment/client -- wget -qO- -T 3 "http://$address:8080"
    done
    ```
phrases.0: Я сравнил трафик к Pod IP и Service VIP.
phrases.1: Я изучил готовые endpoints до обвинения прокси.
phrases.2: Я сохранил правила маршрутизации узла.
questions.0.points.0: Это виртуальный адрес Service, реализованный dataplane.
questions.0.points.1: Реальные listeners работают в выбранных backend Pods.
questions.0.prompt: Означает ли ClusterIP, что процесс слушает этот адрес?
questions.1.points.0: 'Нет: режим зависит от платформы, версии и конфигурации.'
questions.1.points.1: Читайте фактическую конфигурацию, а не предполагайте.
questions.1.prompt: Всегда ли kube-proxy использует iptables?
diagnostics.diagnosis: diagnosis.json должен указывать на несовпадение селектора Service.
diagnostics.selector: Service board должен выбирать всю исходную нагрузку board и никакую другую.
diagnostics.endpoint: У EndpointSlice board должен быть готовый endpoint.
diagnostics.pod: Запрос к IP Pod board на порту 8080 должен вернуть north-118.
diagnostics.vip: Запрос к VIP Service board на порту 8080 должен вернуть north-118.
diagnostics.proxy_ready: proxy observation ready должен совпадать с true.
diagnostics.proxy_mode: Наблюдаемый режим proxy должен быть iptables, nftables или ipvs.
