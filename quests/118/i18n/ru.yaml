title: Service VIP и путь kube-proxy
brief: 'Работайте в `~/quest` с `board.json`, `client.json`, `service.json`, `diagnosis.json` и `proxy-observation.json`.
  Виртуальный IP Service (VIP) направляет трафик через готовые EndpointSlice к выбранным Pod; kube-proxy настраивает путь
  данных узла. Песочница предоставляет `proxy-observation.json` как доступное только для чтения наблюдение backend: оно должно
  содержать `ready: true` и режим `iptables`, `nftables` или `ipvs`. Запишите `fault: selector` в `diagnosis.json` и установите
  селектор Service `board` ровно в `app: board`. Дождитесь согласования EndpointSlice. Проверьте готовый endpoint и HTTP-ответ
  `north-118` по IP Pod board и по VIP Service на порту 8080. Проверка endpoint не устанавливает идентичность цели, а текущие
  результаты не доказывают историю изменений узла или DNS. Не меняйте kube-proxy, правила узла и глобальный DNS. Работайте
  только в офлайн-песочнице.'
debrief: Абстракция Service сама не запускает слушающий процесс. Реализация прокси и выбор endpoints — разные уровни.
stages.0.brief: Диагноз, селектор, готовый endpoint, ответы IP Pod и VIP Service и наблюдение proxy соответствуют описанию.
stages.0.objectives.0.text: Диагноз, селектор, готовый endpoint, ответы IP Pod и VIP Service и наблюдение proxy соответствуют
  описанию.
hints.0.text: Рабочий прямой запрос к Pod отделяет здоровье приложения от выбора Service.
hints.1.text: Service без готовых endpoints не направит запрос к нужному backend.
hints.2.text: Прочитайте неизменяемое наблюдение прокси, запишите selector и исправьте локальный Service.
phrases.0: Я сравнил трафик к Pod IP и Service VIP.
phrases.1: Я изучил готовые endpoints до обвинения прокси.
phrases.2: Я сохранил правила маршрутизации узла.
questions.0.points.0: Это виртуальный адрес Service, реализованный dataplane.
questions.0.points.1: Реальные listeners работают в выбранных backend Pods.
questions.0.prompt: Означает ли ClusterIP, что процесс слушает этот адрес?
questions.1.points.0: 'Нет: режим зависит от платформы, версии и конфигурации.'
questions.1.points.1: Читайте фактическую конфигурацию, а не предполагайте.
questions.1.prompt: Всегда ли kube-proxy использует iptables?
