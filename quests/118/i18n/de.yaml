  wird.
questions.0.points.1: Tatsächlicher listeners-Lauf im ausgewählten backend Pods.
questions.0.prompt: Bedeutet ein ClusterIP, dass ein Prozess diese Adresse überwacht?
questions.1.points.0: NEIN; Der Modus hängt von Plattform, Version und Konfiguration ab.
questions.1.points.1: Lesen Sie die tatsächliche Konfiguration, anstatt davon auszugehen.
questions.1.prompt: Muss kube-proxy immer iptables verwenden?
diagnostics.diagnosis: diagnosis.json fault muss selector entsprechen.
diagnostics.selector: service/board selector muss app:board entsprechen.
diagnostics.endpoint: Ein Board-EndpointSlice muss einen bereiten Endpunkt haben.
diagnostics.pod: Die Anfrage an die IP des Board-Pods auf Port 8080 muss north-118 liefern.
diagnostics.vip: Die Anfrage an die VIP des Board-Service auf Port 8080 muss north-118 liefern.
diagnostics.proxy_ready: proxy observation ready muss true entsprechen.
diagnostics.proxy_mode: Der beobachtete Proxy-Modus muss iptables, nftables oder ipvs sein.
