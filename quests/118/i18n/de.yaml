diagnostics.probe_0_1: Aktueller Service und Endpoint-Zuordnung konnten nicht geprüft werden.
diagnostics.vip_identity: Ursprüngliche Service-UID/VIP, bereitgestellte Workload-Identität oder Anwendungsimage
  wurde geändert.
diagnostics.vip_interface: Gewünschtes Service-Ziel oder wirksamer Endpoint-Port passt nicht zur deklarierten Anwendungsschnittstelle.
diagnostics.vip_owner: Ein wirksamer EndpointSlice gehört nicht zum ursprünglichen Service.
diagnostics.vip_target: Ein wirksamer Endpoint bezeichnet keinen aktuellen bereiten zugehörigen Anwendungs-Pod mit
  dessen tatsächlicher Adresse.
