title: Service VIP und kube-proxy Datenpfad
brief: |-
  Der Board-Service-Pfad ist nicht verfügbar. Ermitteln Sie den Fehler anhand der bereitgestellten Belege und stellen Sie beide Verbraucherpfade her.

  Arbeiten Sie auf der Workstation in `~/quest` mit den bereitgestellten Dateien:
  - `board.yaml`, `client.yaml`, `service.yaml`, `diagnosis.json`, `proxy-observation.json`.

  **Requirements:**

  - `diagnosis.json` auf der Workstation hält den anhand der bereitgestellten Belege ermittelten Fehler fest.
  - Der vorhandene board-Service erreicht nur den bereitgestellten board-Workload und hat einen bereiten EndpointSlice-Endpunkt.
  - Von Deployment `client` liefern sowohl eine `board`-Pod-IP als auch die Service-VIP auf Port `8080` den Wert `north-118`.
  - Die bereitgestellte Proxy-Beobachtung meldet Bereitschaft im Modus `iptables`, `nftables` oder `ipvs`.

  Ein bereiter Endpunkt belegt nicht seine Zielidentität; aktuelle Ergebnisse beweisen keinen Node- oder DNS-Änderungsverlauf. kube-proxy, Node-Regeln und globales DNS nicht verändern.
debrief: Die Service-Abstraktion startet selbst keinen Abhörprozess. Proxy-Implementierung und Endpunktauswahl
  sind verschiedene Ebenen.
stages.0.brief: Beschränken Sie die Wiederherstellung auf den Service-Pfad dieses Bays.
hints.0.text: Eine funktionierende direkte Pod-Anfrage trennt den Anwendungszustand von der Service-Auswahl.
hints.1.text: |-
  Ein Service ohne bereites endpoints kann nicht route zu seinem vorgesehenen backend werden.

  Prüfen Sie die bereitgestellten Eingaben und laufenden Beobachtungen:

  ```sh
  cat diagnosis.json proxy-observation.json
    kubectl get service board -o yaml
    kubectl get endpointslices -l kubernetes.io/service-name=board -o yaml
  ```
hints.2.text: |-
  Lesen Sie die unveränderliche Proxy-Beobachtung, zeichnen Sie selector auf und reparieren Sie dann den lokalen Service.

  Prüfen Sie das Ergebnis in `~/quest` auf der Workstation:

  - Beide Verbraucherpfade liefern `north-118`.

    ```sh
    ip=$(kubectl get pods -l app=board -o jsonpath='{.items[0].status.podIP}')
    vip=$(kubectl get service board -o jsonpath='{.spec.clusterIP}')
    for address in "$ip" "$vip"; do
      kubectl exec deployment/client -- wget -qO- -T 3 "http://$address:8080"
    done
    ```
phrases.0: Ich habe Pod-IP- und Service-VIP-Verkehr verglichen.
phrases.1: Ich habe den fertigen endpoints inspiziert, bevor ich dem Proxy die Schuld gegeben habe.
phrases.2: Ich habe die Node-Routing-Regeln unverändert beibehalten.
