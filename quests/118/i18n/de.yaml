title: Service VIP und kube-proxy Datenpfad
brief: |-
  Der Board-Service-Pfad ist nicht verfügbar. Bestimme den Fehler anhand der bereitgestellten Beobachtungen und stelle beide Verbraucherpfade unter Erhalt der verwalteten Identitäten wieder her.

  Arbeite auf der Workstation in `~/quest` mit den bereitgestellten Dateien:
  - `diagnosis.json`.
  - `proxy-observation.json`.
  - `vip-contract.json`.

  **Anforderungen:**

  - `diagnosis.json` auf der Workstation hält den anhand der bereitgestellten Belege ermittelten Fehler fest.
  - Der vorhandene board-Service erreicht nur den bereitgestellten board-Workload und hat einen bereiten EndpointSlice-Endpunkt. Erhalte ursprüngliche UID und VIP des Service, ursprüngliche Deployments und bereitgestellte Images. Die gewünschte Service-Zuordnung und jedes effektiv bereite EndpointSlice-Ziel müssen zur deklarierten Anwendungsschnittstelle passen; jedes Ziel gehört zu einem aktuellen bereiten Pod des bereitgestellten Workloads, gemäß `vip-contract.json`.
  - Von Deployment `client` liefern sowohl eine `board`-Pod-IP als auch die Service-VIP auf Port `8080` den Wert `north-118`.
  - Die bereitgestellte Proxy-Beobachtung meldet Bereitschaft im Modus `iptables`, `nftables` oder `ipvs`.

  Der Diagnoseeintrag ist eine begrenzte Klassifizierung, keine vollständige Incident-Analyse. Aktuelle Prüfungen beweisen keinen Änderungsverlauf. Verändere kube-proxy, Knotenregeln und globales DNS nicht.
debrief: Die Prüfungen verglichen begrenzte Diagnose, erhaltene Service-/VIP- und Workload-Identitäten, aktuelle
  zugehörige Endpoints, Schnittstellenzuordnung und beide realen Verbraucherpfade.
stages.0.brief: Beschränken Sie die Wiederherstellung auf den Service-Pfad dieses Bays.
hints.0.text: Service-Selektor, bereiter Endpoint und funktionierende Anwendungsschnittstelle beschreiben verschiedene
  Schichten. Endpoint-Bereitschaft prüft weder Listener noch Eigentümerschaft. Vergleiche den gesamten Pfad vor
  der Schuldzuweisung an den Proxy.
hints.1.text: |-
  Vergleiche die bereitgestellte Proxy-Beobachtung mit Service-Auswahl, aktuellen EndpointSlice-Ports und Zielidentitäten sowie dem Anwendungspfad:

  ```sh
  cat diagnosis.json proxy-observation.json vip-contract.json
  kubectl get service board -o yaml
  kubectl get endpointslices -l kubernetes.io/service-name=board -o yaml
  kubectl get deployment,replicaset,pods -o yaml
  ```
hints.2.text: |-
  Prüfe erhaltene VIP und Workload-Identitäten, tatsächliche Endpoint-Eigentümerschaft und Schnittstellenzuordnung, danach direkte Pod- und Service-VIP-Antworten:

  ```sh
  kubectl get service board -o yaml
  kubectl get endpointslices -l kubernetes.io/service-name=board -o yaml
  kubectl get deployment,replicaset,pods -o yaml
  ip=$(kubectl get pods -l app=board -o jsonpath='{.items[0].status.podIP}')
  vip=$(kubectl get service board -o jsonpath='{.spec.clusterIP}')
  for address in "$ip" "$vip"; do
   kubectl exec deployment/client -- wget -qO- -T 3 "http://$address:8080"
  done
  ```
phrases.0: Ich habe Pod-IP- und Service-VIP-Verkehr verglichen.
phrases.1: Ich habe den fertigen endpoints inspiziert, bevor ich dem Proxy die Schuld gegeben habe.
phrases.2: Ich habe die Node-Routing-Regeln unverändert beibehalten.
questions.0.points.0: Es handelt sich um eine virtuelle Service-Adresse, die vom dataplane implementiert wird.
questions.0.points.1: Tatsächlicher listeners-Lauf im ausgewählten backend Pods.
questions.0.prompt: Bedeutet ein ClusterIP, dass ein Prozess diese Adresse überwacht?
questions.1.points.0: NEIN; Der Modus hängt von Plattform, Version und Konfiguration ab.
questions.1.points.1: Lesen Sie die tatsächliche Konfiguration, anstatt davon auszugehen.
questions.1.prompt: Muss kube-proxy immer iptables verwenden?
stages.0.objectives.0.text: '`diagnosis.json` auf der Workstation hält den anhand der bereitgestellten Belege ermittelten
