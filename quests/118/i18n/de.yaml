diagnostics.diagnosis: Die Diagnose fehlt möglicherweise oder nennt den Proxy statt der Selektorabweichung. Vergleichen Sie den Service-Selektor mit Pod-Labels und erfassen Sie den Selektorfehler in diagnosis.json. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q118-vip-selector-diagnosis)
diagnostics.selector: Der Service wählt möglicherweise noch alte Labels oder einen fremden Pod. Vergleichen Sie app=board und zusätzliche Labels mit den aktuellen board-Pods. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q118-vip-matching-board-selector)
diagnostics.endpoint: Nach Korrektur des Selektors haben die EndpointSlices möglicherweise noch keine bereite Adresse. Prüfen Sie ready und warten Sie auf einen bereiten Endpoint. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q118-vip-ready-endpoint-observation)
diagnostics.pod: Dem ausgewählten board-Pod fehlt möglicherweise eine Adresse oder sein HTTP-Listener ist nicht erreichbar. Fragen Sie die Pod-IP direkt aus client ab und vergleichen Sie vor dem VIP-Test mit north-118. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q118-vip-direct-pod-request)
diagnostics.vip: Der Pod kann direkt antworten, obwohl dem board-VIP ein nutzbares Backend fehlt oder die Portzuordnung falsch ist. Fragen Sie die aktive ClusterIP aus client ab und vergleichen Sie mit north-118. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q118-vip-service-live-request)
diagnostics.proxy_ready: Die festgehaltene Proxy-Beobachtung fehlt möglicherweise oder meldet kein ready. Prüfen Sie sie getrennt von der aktuellen Service-Erreichbarkeit. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q118-captured-proxy-readiness)
diagnostics.proxy_mode: Der erfasste Proxy-Modus fehlt möglicherweise oder liegt außerhalb der erwarteten Menge. Prüfen Sie iptables, nftables oder ipvs im gelieferten Beleg. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q118-captured-proxy-mode)
diagnostics.probe_0_1: Die Selektor- und VIP-Prüfung kann vor einer Meldung abbrechen, wenn Prozess oder Eingaben fehlschlagen. Prüfen Sie Tools und Zugriff auf Service, Pods und EndpointSlices. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q118-vip-observer-input)
diagnostics.vip_identity: Ein Ersatz ändert die Service-UID dauerhaft und kann auch den VIP oder die Identität bzw. das Image einer gelieferten Arbeitslast verändern. Vergleichen Sie Deployments board und client, aktuelle Pod-Images und Service mit den festgehaltenen Belegen. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q118-preserved-vip-delivery-objects)
diagnostics.vip_interface: Der Service-Port kann existieren, obwohl sein numerisches oder benanntes Ziel nicht zum Anwendungsport führt. Vergleichen Sie Zuordnung, benannte Ports aktueller Pods und den passenden TCP-Port in EndpointSlices. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q118-vip-endpoint-port-mapping)
diagnostics.vip_owner: Ein aktiver Endpoint kann in einer board-Slice liegen, die ein anderer Service steuert. Vergleichen Sie die Controller-UID mit der ursprünglichen festgehaltenen Service-UID. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q118-vip-original-service-endpoint-owner)
diagnostics.vip_target: Die EndpointSlice enthält möglicherweise ein altes Ziel, eine fremde Adresse oder kein aktives Ziel. Vergleichen Sie jede aktive targetRef und Adresse mit einem aktuellen bereiten Pod des Deployments board. [Ursache und Prüfung](guides#guide=kubernetes-10&section=q118-vip-current-ready-target)
