title: Service VIP und kube-proxy Datenpfad
brief: 'Ein Pod antwortet auf seinen IP, aber der board Service hat keinen ausgewählten endpoint. Untersuchen
  Sie das Verhalten von Pod-IP, Service-VIP und EndpointSlice sowie die vom Backend bereitgestellte schreibgeschützte
  "kube-proxy"-Beobachtung. Zeichnen Sie fault selector in diagnosis.json auf und reparieren Sie Service
  selector zu app: board. Ändern Sie nicht kube-proxy, Knotenregeln oder globales DNS. Hierbei handelt
  es sich um die Diagnose eines fehlerfreien Proxys mit fehlendem backends, nicht um eine Proxy-Reparaturübung.


  Questdateien in `~/quest` (einige erscheinen in späteren Phasen): `board.json`, `client.json`, `service.json`,
  `diagnosis.json`, `proxy-observation.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: Die Diagnose nennt selector fault; ein echter endpoint, Pod-IP-Antwort und Service-VIP-Antwort
  werden verifiziert.'
debrief: Die Service-Abstraktion startet selbst keinen Abhörprozess. Proxy-Implementierung und Endpunktauswahl
  sind verschiedene Ebenen.
stages.0.brief: 'Erfolgskriterien: Die Diagnose benennt den Fehler selector; ein echter endpoint, Pod-IP-Antwort
  und Service-VIP-Antwort werden verifiziert.'
stages.0.objectives.0.text: Die Diagnose nennt den Fehler selector; ein echter endpoint, Pod-IP-Antwort
  und Service-VIP-Antwort werden verifiziert.
hints.0.text: Eine funktionierende direkte Pod-Anfrage trennt den Anwendungszustand von der Service-Auswahl.
hints.1.text: Ein Service ohne bereites endpoints kann nicht route zu seinem vorgesehenen backend werden.
hints.2.text: Lesen Sie die unveränderliche Proxy-Beobachtung, zeichnen Sie selector auf und reparieren
  Sie dann den lokalen Service.
phrases.0: Ich habe Pod-IP- und Service-VIP-Verkehr verglichen.
phrases.1: Ich habe den fertigen endpoints inspiziert, bevor ich dem Proxy die Schuld gegeben habe.
phrases.2: Ich habe die Node-Routing-Regeln unverändert beibehalten.
questions.0.points.0: Es handelt sich um eine virtuelle Service-Adresse, die vom dataplane implementiert
  wird.
questions.0.points.1: Tatsächlicher listeners-Lauf im ausgewählten backend Pods.
questions.0.prompt: Bedeutet ein ClusterIP, dass ein Prozess diese Adresse überwacht?
questions.1.points.0: NEIN; Der Modus hängt von Plattform, Version und Konfiguration ab.
questions.1.points.1: Lesen Sie die tatsächliche Konfiguration, anstatt davon auszugehen.
questions.1.prompt: Muss kube-proxy immer iptables verwenden?
