title: Service VIP und kube-proxy Datenpfad
brief: 'Arbeite in `~/quest` mit `board.json`, `client.json`, `service.json`, `diagnosis.json` und `proxy-observation.json`.
  Eine virtuelle Service-IP (VIP) leitet über bereite EndpointSlices zu ausgewählten Pods; kube-proxy programmiert den Datenpfad
  des Knotens. Die Umgebung stellt `proxy-observation.json` als schreibgeschützte Backend-Beobachtung bereit: Sie muss `ready:
  true` und Modus `iptables`, `nftables` oder `ipvs` melden. Trage `fault: selector` in `diagnosis.json` ein und setze den
  Selektor von Service `board` genau auf `app: board`. Warte auf den EndpointSlice-Abgleich. Prüfe einen bereiten Endpoint
  und HTTP `north-118` an einer Board-Pod-IP und der Service-VIP auf Port 8080. Die Endpoint-Prüfung stellt die Zielidentität
  nicht fest; aktuelle Ergebnisse beweisen keine Historie von Knoten- oder DNS-Änderungen. Ändere weder kube-proxy noch Knotenregeln
  oder globales DNS. Arbeite nur in der Offline-Umgebung.'
debrief: Die Service-Abstraktion startet selbst keinen Abhörprozess. Proxy-Implementierung und Endpunktauswahl sind verschiedene
  Ebenen.
stages.0.brief: Diagnose, Selektor, bereiter Endpoint, Antworten über Pod-IP und Service-VIP sowie Proxy-Beobachtung entsprechen
  der Beschreibung.
stages.0.objectives.0.text: Diagnose, Selektor, bereiter Endpoint, Antworten über Pod-IP und Service-VIP sowie Proxy-Beobachtung
  entsprechen der Beschreibung.
hints.0.text: Eine funktionierende direkte Pod-Anfrage trennt den Anwendungszustand von der Service-Auswahl.
hints.1.text: Ein Service ohne bereites endpoints kann nicht route zu seinem vorgesehenen backend werden.
hints.2.text: Lesen Sie die unveränderliche Proxy-Beobachtung, zeichnen Sie selector auf und reparieren Sie dann den lokalen
  Service.
phrases.0: Ich habe Pod-IP- und Service-VIP-Verkehr verglichen.
phrases.1: Ich habe den fertigen endpoints inspiziert, bevor ich dem Proxy die Schuld gegeben habe.
phrases.2: Ich habe die Node-Routing-Regeln unverändert beibehalten.
questions.0.points.0: Es handelt sich um eine virtuelle Service-Adresse, die vom dataplane implementiert wird.
questions.0.points.1: Tatsächlicher listeners-Lauf im ausgewählten backend Pods.
questions.0.prompt: Bedeutet ein ClusterIP, dass ein Prozess diese Adresse überwacht?
questions.1.points.0: NEIN; Der Modus hängt von Plattform, Version und Konfiguration ab.
questions.1.points.1: Lesen Sie die tatsächliche Konfiguration, anstatt davon auszugehen.
questions.1.prompt: Muss kube-proxy immer iptables verwenden?
diagnostics.diagnosis: diagnosis.json fault muss selector entsprechen.
diagnostics.selector: service/board selector muss app:board entsprechen.
diagnostics.endpoint: Ein Board-EndpointSlice muss einen bereiten Endpunkt haben.
diagnostics.pod: Die Anfrage an die IP des Board-Pods auf Port 8080 muss north-118 liefern.
diagnostics.vip: Die Anfrage an die VIP des Board-Service auf Port 8080 muss north-118 liefern.
diagnostics.proxy_ready: proxy observation ready muss true entsprechen.
diagnostics.proxy_mode: Der beobachtete Proxy-Modus muss iptables, nftables oder ipvs sein.
