title: Ścieżka danych Service VIP i kube-proxy
brief: 'Pod odpowiada na swoim IP, ale board Service nie ma wybranego endpoint. Sprawdź zachowanie Pod-IP,
  Service-VIP i EndpointSlice oraz dostarczoną przez backend obserwację kube-proxy w trybie tylko do odczytu.
  Zapisz fault selector w diagnosis.json i napraw Service selector do app: board. Nie zmieniaj kube-proxy,
  reguł węzła ani globalnego DNS. Jest to diagnoza zdrowego serwera proxy z brakującym backends, a nie
  naprawa serwera proxy.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `board.json`, `client.json`,
  `service.json`, `diagnosis.json`, `proxy-observation.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: Diagnoza określa usterkę selector; zweryfikowano prawdziwą odpowiedź endpoint,
  Pod-IP i Service-VIP.'
debrief: Abstrakcja Service sama w sobie nie rozpoczyna procesu słuchania. Implementacja serwera proxy
  i wybór punktu końcowego to różne warstwy.
stages.0.brief: 'Kryteria sukcesu: Diagnoza określa usterkę selector; weryfikowana jest rzeczywista odpowiedź
  endpoint, Pod-IP i Service-VIP.'
stages.0.objectives.0.text: Diagnoza określa usterkę selector; weryfikowana jest rzeczywista odpowiedź
  endpoint, Pod-IP i Service-VIP.
hints.0.text: Działające bezpośrednie żądanie Pod oddziela stan aplikacji od wyboru Service.
hints.1.text: Service bez gotowego endpoints nie może kierować do zamierzonego backend.
hints.2.text: Przeczytaj obserwację niezmiennego proxy, zapisz selector, a następnie napraw lokalny Service.
phrases.0: Porównałem ruch Pod-IP i Service-VIP.
phrases.1: Sprawdziłem gotowy endpoints, zanim zrzuciłem winę na serwer proxy.
phrases.2: Reguły routingu węzłów pozostawiłem niezmienione.
questions.0.points.0: Jest to wirtualny adres Service zaimplementowany przez dataplane.
questions.0.points.1: Rzeczywisty przebieg listeners w wybranym backend Pods.
questions.0.prompt: Czy ClusterIP oznacza, że ​​proces nasłuchuje pod tym adresem?
questions.1.points.0: NIE; tryb zależy od platformy, wersji i konfiguracji.
questions.1.points.1: Przeczytaj rzeczywistą konfigurację zamiast zakładać.
questions.1.prompt: Czy kube-proxy musi zawsze używać iptables?
