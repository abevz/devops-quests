title: Ścieżka danych Service VIP i kube-proxy
brief: 'Pracuj w `~/quest` z `board.json`, `client.json`, `service.json`, `diagnosis.json` i `proxy-observation.json`. Wirtualny
  IP Service (VIP) kieruje ruch przez gotowe EndpointSlice do wybranych Podów; kube-proxy programuje ścieżkę ruchu węzła.
  Zatoka dostarcza `proxy-observation.json` jako obserwację backendu tylko do odczytu: musi zawierać `ready: true` i tryb
  `iptables`, `nftables` lub `ipvs`. Zapisz `fault: selector` w `diagnosis.json` i ustaw selektor Service `board` dokładnie
  na `app: board`. Poczekaj na uzgodnienie EndpointSlice. Sprawdź gotowy endpoint i odpowiedź HTTP `north-118` pod IP Poda
  board oraz VIP Service na porcie 8080. Kontrola endpointu nie ustala tożsamości celu, a bieżące wyniki nie dowodzą historii
  zmian węzła lub DNS. Nie zmieniaj kube-proxy, reguł węzła ani globalnego DNS. Pracuj tylko w zatoce offline.'
debrief: Abstrakcja Service sama w sobie nie rozpoczyna procesu słuchania. Implementacja serwera proxy i wybór punktu końcowego
  to różne warstwy.
stages.0.brief: Diagnoza, selektor, gotowy endpoint, odpowiedzi IP Poda i VIP Service oraz obserwacja proxy odpowiadają opisowi.
stages.0.objectives.0.text: Diagnoza, selektor, gotowy endpoint, odpowiedzi IP Poda i VIP Service oraz obserwacja proxy odpowiadają
  opisowi.
hints.0.text: Działające bezpośrednie żądanie Pod oddziela stan aplikacji od wyboru Service.
hints.1.text: Service bez gotowego endpoints nie może kierować do zamierzonego backend.
hints.2.text: Przeczytaj obserwację niezmiennego proxy, zapisz selector, a następnie napraw lokalny Service.
phrases.0: Porównałem ruch Pod-IP i Service-VIP.
phrases.1: Sprawdziłem gotowy endpoints, zanim zrzuciłem winę na serwer proxy.
phrases.2: Reguły routingu węzłów pozostawiłem niezmienione.
questions.0.points.0: Jest to wirtualny adres Service zaimplementowany przez dataplane.
questions.0.points.1: Rzeczywisty przebieg listeners w wybranym backend Pods.
questions.0.prompt: Czy ClusterIP oznacza, że ​​proces nasłuchuje pod tym adresem?
questions.1.points.0: NIE; tryb zależy od platformy, wersji i konfiguracji.
questions.1.points.1: Przeczytaj rzeczywistą konfigurację zamiast zakładać.
questions.1.prompt: Czy kube-proxy musi zawsze używać iptables?
diagnostics.diagnosis: diagnosis.json fault musi być równe selector.
diagnostics.selector: service/board selector musi być równe app:board.
diagnostics.endpoint: EndpointSlice board musi mieć gotowy endpoint.
diagnostics.pod: Żądanie do IP Poda board na porcie 8080 musi zwrócić north-118.
diagnostics.vip: Żądanie do VIP Service board na porcie 8080 musi zwrócić north-118.
diagnostics.proxy_ready: proxy observation ready musi być równe true.
diagnostics.proxy_mode: Tryb obserwacji proxy musi być iptables, nftables lub ipvs.
