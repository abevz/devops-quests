title: Ścieżka danych Service VIP i kube-proxy
brief: |-
  Ścieżka Service tablicy jest niedostępna. Rozpoznaj problem na podstawie dostarczonych obserwacji i przywróć obie ścieżki odbiorcy, zachowując zarządzane tożsamości.

  Pracuj na stacji roboczej w `~/quest` z dostarczonymi plikami:
  - `diagnosis.json`.
  - `proxy-observation.json`.
  - `vip-contract.json`.

  **Wymagania:**

  - `diagnosis.json` na stacji roboczej zapisuje usterkę rozpoznaną na podstawie dostarczonych dowodów.
  - Istniejący Service board dociera tylko do dostarczonego obciążenia board i ma gotowy endpoint EndpointSlice. Zachowaj pierwotne UID i VIP Service, pierwotne Deploymenty oraz dostarczone obrazy. Żądane mapowanie Service i każdy faktycznie gotowy cel EndpointSlice mają odpowiadać zadeklarowanemu interfejsowi aplikacji; każdy cel należy do bieżącego gotowego Poda dostarczonego obciążenia według `vip-contract.json`.
  - Z Deployment `client` zarówno IP Poda `board`, jak i VIP Service na porcie `8080` zwracają `north-118`.
  - Dostarczona obserwacja proxy zgłasza gotowość w trybie `iptables`, `nftables` lub `ipvs`.

  Zapis diagnozy jest ograniczoną klasyfikacją, nie pełną analizą incydentu. Bieżące kontrole nie dowodzą historii zmian. Nie zmieniaj kube-proxy, reguł węzła ani globalnego DNS.
debrief: Kontrole porównały ograniczoną diagnozę, tożsamości Service/VIP i obciążeń, bieżące należące do nich endpointy,
  mapowanie interfejsów oraz obie rzeczywiste ścieżki odbiorcy.
stages.0.brief: Ogranicz odzyskiwanie do ścieżki Service w tym bay.
hints.0.text: Selektor Service, gotowy endpoint i działający interfejs aplikacji opisują różne warstwy. Gotowość
  endpointu nie sprawdza listenera ani przynależności. Porównaj całą ścieżkę, zanim obwinisz proxy.
hints.1.text: |-
  Porównaj dostarczoną obserwację proxy z wyborem Service, bieżącymi portami i tożsamościami celów EndpointSlice oraz ścieżką aplikacji:

  ```sh
  cat diagnosis.json proxy-observation.json vip-contract.json
  kubectl get service board -o yaml
  kubectl get endpointslices -l kubernetes.io/service-name=board -o yaml
  kubectl get deployment,replicaset,pods -o yaml
  ```
hints.2.text: |-
  Sprawdź zachowane VIP i tożsamości obciążeń, faktyczną przynależność endpointów i mapowanie interfejsów, potem odpowiedzi po bezpośrednim Pod IP i Service VIP:

  ```sh
  kubectl get service board -o yaml
  kubectl get endpointslices -l kubernetes.io/service-name=board -o yaml
  kubectl get deployment,replicaset,pods -o yaml
  ip=$(kubectl get pods -l app=board -o jsonpath='{.items[0].status.podIP}')
  vip=$(kubectl get service board -o jsonpath='{.spec.clusterIP}')
  for address in "$ip" "$vip"; do
   kubectl exec deployment/client -- wget -qO- -T 3 "http://$address:8080"
  done
  ```

  Oba żądania HTTP zwracają north-118.
phrases.0: Porównałem ruch Pod-IP i Service-VIP.
phrases.1: Sprawdziłem gotowy endpoints, zanim zrzuciłem winę na serwer proxy.
phrases.2: Reguły routingu węzłów pozostawiłem niezmienione.
questions.0.points.0: Jest to wirtualny adres Service zaimplementowany przez dataplane.
questions.0.points.1: Rzeczywisty przebieg listeners w wybranym backend Pods.
questions.0.prompt: Czy ClusterIP oznacza, że ​​proces nasłuchuje pod tym adresem?
questions.1.points.0: NIE; tryb zależy od platformy, wersji i konfiguracji.
questions.1.points.1: Przeczytaj rzeczywistą konfigurację zamiast zakładać.
questions.1.prompt: Czy kube-proxy musi zawsze używać iptables?
stages.0.objectives.0.text: '`diagnosis.json` na stacji roboczej zapisuje usterkę rozpoznaną na podstawie dostarczonych
  dowodów.'
stages.0.objectives.1.text: Istniejący Service board dociera tylko do dostarczonego obciążenia board i ma gotowy
  endpoint EndpointSlice. Zachowaj pierwotne UID i VIP Service, pierwotne Deploymenty oraz dostarczone obrazy. Żądane
  mapowanie Service i każdy faktycznie gotowy cel EndpointSlice mają odpowiadać zadeklarowanemu interfejsowi aplikacji;
  każdy cel należy do bieżącego gotowego Poda dostarczonego obciążenia według `vip-contract.json`.
stages.0.objectives.2.text: Z Deployment `client` zarówno IP Poda `board`, jak i VIP Service na porcie `8080` zwracają
  `north-118`.
stages.0.objectives.3.text: Dostarczona obserwacja proxy zgłasza gotowość w trybie `iptables`, `nftables` lub `ipvs`.
diagnostics.diagnosis: Diagnoza może nie istnieć lub wskazywać proxy zamiast niespójnego selektora. Porównaj selektor Service z etykietami podów i zapisz usterkę selektora w diagnosis.json. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q118-vip-selector-diagnosis)
diagnostics.selector: Service może nadal wybierać stare etykiety lub obcy pod. Porównaj app=board i dodatkowe etykiety z bieżącymi podami board. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q118-vip-matching-board-selector)
diagnostics.endpoint: Po poprawce selektora EndpointSlice może jeszcze nie zawierać gotowego adresu. Sprawdź ready i poczekaj na gotowy endpoint. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q118-vip-ready-endpoint-observation)
diagnostics.pod: Wybrany pod board może nie mieć adresu lub jego listener HTTP nie odpowiadać. Odpytaj IP poda bezpośrednio z client i porównaj z north-118 przed testem VIP. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q118-vip-direct-pod-request)
diagnostics.vip: Pod może odpowiadać bezpośrednio, choć VIP board nie ma backendu lub ma złe mapowanie portu. Odpytaj bieżący ClusterIP z client i porównaj z north-118. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q118-vip-service-live-request)
diagnostics.proxy_ready: Zamrożona obserwacja proxy może nie istnieć lub nie pokazywać ready. Sprawdź ją osobno od bieżącej dostępności Service. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q118-captured-proxy-readiness)
diagnostics.proxy_mode: Zapisany tryb proxy może nie istnieć lub nie należeć do zbioru. Sprawdź iptables, nftables lub ipvs w dostarczonej obserwacji. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q118-captured-proxy-mode)
diagnostics.probe_0_1: Kontrola selektora i VIP może zatrzymać się bez wskazania warunku, gdy proces lub dane zawodzą. Sprawdź narzędzia i dostęp do Service, podów i EndpointSlice. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q118-vip-observer-input)
diagnostics.vip_identity: Zastąpienie trwale zmienia UID Service i może również zmienić jego VIP albo tożsamość lub obraz obciążenia. Porównaj Deploymenty board i client, obrazy bieżących podów i Service z zamrożonym zapisem. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q118-preserved-vip-delivery-objects)
diagnostics.vip_interface: Port Service może istnieć, ale cel liczbowy lub nazwany nie prowadzi do portu aplikacji. Porównaj mapowanie, nazwane porty bieżących podów i odpowiedni port TCP EndpointSlice. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q118-vip-endpoint-port-mapping)
diagnostics.vip_owner: Aktywny endpoint może być w EndpointSlice oznaczonym board, lecz zarządzanym przez inny Service. Porównaj UID kontrolera z pierwotnym UID Service. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q118-vip-original-service-endpoint-owner)
diagnostics.vip_target: EndpointSlice może zachowywać stary cel, niepasujący adres albo żadnego aktywnego celu. Porównaj targetRef i adresy z bieżącym gotowym podem Deploymentu board. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=q118-vip-current-ready-target)
