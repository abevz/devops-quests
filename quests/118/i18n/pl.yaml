title: Ścieżka danych Service VIP i kube-proxy
brief: "Ścieżka przez Service board jest niedostępna. Rozpoznaj usterkę na podstawie dostarczonych dowodów i przywróć\
  \ obie ścieżki odbiorcy.\n\nPracuj w `~/quest` na stacji roboczej. Dostarczone pliki: `board.yaml`, `client.yaml`,\
  \ `service.yaml`, `diagnosis.json`, `proxy-observation.json`.\n\n**Requirements:**\n\n- `diagnosis.json` na stacji\
  \ roboczej zapisuje usterkę rozpoznaną na podstawie dostarczonych dowodów.\n- Service `board` dociera do gotowych\
  \ Podów z etykietą `app=board` i ma gotowy endpoint EndpointSlice.\n- Z Deployment `client` zarówno IP Poda `board`,\
  \ jak i VIP Service na porcie `8080` zwracają `north-118`.\n- Dostarczona obserwacja proxy zgłasza gotowość w\
  \ trybie `iptables`, `nftables` lub `ipvs`.\n\n**Verify yourself before Check & finish:** Wykonaj te polecenia\
  \ obserwacji z `~/quest` na stacji roboczej.\n\n- Ustawienia, tożsamość i stan odpowiadają wymaganiom.\n\n  ```sh\n\
  \  cat diagnosis.json proxy-observation.json\n  kubectl get service board -o yaml\n  kubectl get endpointslices\
  \ -l kubernetes.io/service-name=board -o yaml\n  ```\n\n- Obie ścieżki odbiorcy zwracają `north-118`.\n\n  ```sh\n\
  \  ip=$(kubectl get pods -l app=board -o jsonpath='{.items[0].status.podIP}')\n  vip=$(kubectl get service board\
  \ -o jsonpath='{.spec.clusterIP}')\n  for address in \"$ip\" \"$vip\"; do\n    kubectl exec deployment/client\
  \ -- wget -qO- -T 3 \"http://$address:8080\"\n  done\n  ```\n\nGotowy endpoint nie ustala tożsamości celu; bieżące\
  \ wyniki nie dowodzą historii zmian węzła lub DNS. Nie zmieniaj kube-proxy, reguł węzła ani globalnego DNS."
debrief: Abstrakcja Service sama w sobie nie rozpoczyna procesu słuchania. Implementacja serwera proxy i wybór punktu
  końcowego to różne warstwy.
stages.0.brief: Zapisana diagnoza i przywrócony Service muszą odpowiadać dowodom.
hints.0.text: Działające bezpośrednie żądanie Pod oddziela stan aplikacji od wyboru Service.
hints.1.text: Service bez gotowego endpoints nie może kierować do zamierzonego backend.
hints.2.text: Przeczytaj obserwację niezmiennego proxy, zapisz selector, a następnie napraw lokalny Service.
phrases.0: Porównałem ruch Pod-IP i Service-VIP.
phrases.1: Sprawdziłem gotowy endpoints, zanim zrzuciłem winę na serwer proxy.
phrases.2: Reguły routingu węzłów pozostawiłem niezmienione.
questions.0.points.0: Jest to wirtualny adres Service zaimplementowany przez dataplane.
questions.0.points.1: Rzeczywisty przebieg listeners w wybranym backend Pods.
questions.0.prompt: Czy ClusterIP oznacza, że ​​proces nasłuchuje pod tym adresem?
questions.1.points.0: NIE; tryb zależy od platformy, wersji i konfiguracji.
questions.1.points.1: Przeczytaj rzeczywistą konfigurację zamiast zakładać.
questions.1.prompt: Czy kube-proxy musi zawsze używać iptables?
