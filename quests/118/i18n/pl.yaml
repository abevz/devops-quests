diagnostics.probe_0_1: Nie udało się sprawdzić bieżącego Service i mapowania endpointów.
diagnostics.vip_identity: Zmieniono pierwotne UID/VIP Service, tożsamość dostarczonego obciążenia lub obraz aplikacji.
diagnostics.vip_interface: Żądany cel Service lub efektywny port endpointu nie odpowiada zadeklarowanemu interfejsowi
  aplikacji.
diagnostics.vip_owner: Efektywny EndpointSlice nie należy do pierwotnego Service.
diagnostics.vip_target: Efektywny endpoint nie wskazuje bieżącego gotowego Poda dostarczonej aplikacji i jego rzeczywistego
  adresu.
