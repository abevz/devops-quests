title: Ścieżka danych Service VIP i kube-proxy
brief: |-
  Ścieżka przez Service board jest niedostępna. Rozpoznaj usterkę na podstawie dostarczonych dowodów i przywróć obie ścieżki odbiorcy.

  Pracuj na workstation w `~/quest` z dostarczonymi plikami:
  - `board.yaml`, `client.yaml`, `service.yaml`, `diagnosis.json`, `proxy-observation.json`.

  **Requirements:**

  - `diagnosis.json` na stacji roboczej zapisuje usterkę rozpoznaną na podstawie dostarczonych dowodów.
  - Istniejący Service board dociera tylko do dostarczonego obciążenia board i ma gotowy endpoint EndpointSlice.
  - Z Deployment `client` zarówno IP Poda `board`, jak i VIP Service na porcie `8080` zwracają `north-118`.
  - Dostarczona obserwacja proxy zgłasza gotowość w trybie `iptables`, `nftables` lub `ipvs`.

  Gotowy endpoint nie ustala tożsamości celu; bieżące wyniki nie dowodzą historii zmian węzła lub DNS. Nie zmieniaj kube-proxy, reguł węzła ani globalnego DNS.
debrief: Abstrakcja Service sama w sobie nie rozpoczyna procesu słuchania. Implementacja serwera proxy
  i wybór punktu końcowego to różne warstwy.
stages.0.brief: Ogranicz odzyskiwanie do ścieżki Service w tym bay.
hints.0.text: Działające bezpośrednie żądanie Pod oddziela stan aplikacji od wyboru Service.
hints.1.text: |-
  Service bez gotowego endpoints nie może kierować do zamierzonego backend.

  Sprawdź dostarczone dane i bieżące obserwacje:

  ```sh
  cat diagnosis.json proxy-observation.json
    kubectl get service board -o yaml
    kubectl get endpointslices -l kubernetes.io/service-name=board -o yaml
  ```
hints.2.text: |-
  Przeczytaj obserwację niezmiennego proxy, zapisz selector, a następnie napraw lokalny Service.

  Sprawdź wynik z `~/quest` na workstation:

  - Obie ścieżki odbiorcy zwracają `north-118`.

    ```sh
    ip=$(kubectl get pods -l app=board -o jsonpath='{.items[0].status.podIP}')
    vip=$(kubectl get service board -o jsonpath='{.spec.clusterIP}')
    for address in "$ip" "$vip"; do
      kubectl exec deployment/client -- wget -qO- -T 3 "http://$address:8080"
    done
    ```
phrases.0: Porównałem ruch Pod-IP i Service-VIP.
phrases.1: Sprawdziłem gotowy endpoints, zanim zrzuciłem winę na serwer proxy.
phrases.2: Reguły routingu węzłów pozostawiłem niezmienione.
questions.0.points.0: Jest to wirtualny adres Service zaimplementowany przez dataplane.
questions.0.points.1: Rzeczywisty przebieg listeners w wybranym backend Pods.
questions.0.prompt: Czy ClusterIP oznacza, że ​​proces nasłuchuje pod tym adresem?
questions.1.points.0: NIE; tryb zależy od platformy, wersji i konfiguracji.
questions.1.points.1: Przeczytaj rzeczywistą konfigurację zamiast zakładać.
questions.1.prompt: Czy kube-proxy musi zawsze używać iptables?
diagnostics.diagnosis: diagnosis.json fault musi być równe selector.
diagnostics.selector: service/board selector musi być równe app:board.
diagnostics.endpoint: EndpointSlice board musi mieć gotowy endpoint.
diagnostics.pod: Żądanie do IP Poda board na porcie 8080 musi zwrócić north-118.
diagnostics.vip: Żądanie do VIP Service board na porcie 8080 musi zwrócić north-118.
diagnostics.proxy_ready: proxy observation ready musi być równe true.
diagnostics.proxy_mode: Tryb obserwacji proxy musi być iptables, nftables lub ipvs.
