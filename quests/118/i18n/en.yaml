title: Service VIP and kube-proxy datapath
brief: 'Work in `~/quest` with `board.json`, `client.json`, `service.json`, `diagnosis.json` and `proxy-observation.json`.
  A Service virtual IP (VIP) routes through ready EndpointSlices to selected Pods; kube-proxy programs the node datapath.
  The bay supplies `proxy-observation.json` as a read-only backend observation: it must report `ready: true` and mode `iptables`,
  `nftables` or `ipvs`. Record `fault: selector` in `diagnosis.json` and set Service `board` selector exactly to `app: board`.
  Wait for EndpointSlice reconciliation. Verify a ready endpoint, HTTP `north-118` at a board Pod IP and at the Service VIP
  on port 8080. The endpoint check does not establish its target identity, and current results do not prove the history of
  node or DNS changes. Do not modify kube-proxy, node rules or global DNS. Work only in the offline bay.'
debrief: The Service abstraction does not itself start a listening process. Proxy implementation and endpoint selection are
  different layers.
stages.0.brief: The diagnosis, selector, ready endpoint, Pod-IP and Service-VIP responses, and proxy observation match the
  brief.
stages.0.objectives.0.text: The diagnosis, selector, ready endpoint, Pod-IP and Service-VIP responses, and proxy observation
  match the brief.
hints.0.text: A working direct Pod request separates application health from Service selection.
hints.1.text: A Service without ready endpoints cannot route to its intended backend.
hints.2.text: Read the immutable proxy observation, record selector, then repair the local Service.
phrases.0: I compared Pod-IP and Service-VIP traffic.
phrases.1: I inspected ready endpoints before blaming the proxy.
phrases.2: I kept node routing rules unchanged.
questions.0.points.0: It is a virtual Service address implemented by the dataplane.
questions.0.points.1: Actual listeners run in the selected backend Pods.
questions.0.prompt: Does a ClusterIP mean a process listens on that address?
questions.1.points.0: No; mode depends on platform, version and configuration.
questions.1.points.1: Read the actual configuration instead of assuming.
questions.1.prompt: Must kube-proxy always use iptables?
