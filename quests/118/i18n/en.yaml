title: Service VIP and kube-proxy datapath
brief: "The board Service path is unavailable. Identify the fault from the supplied evidence and restore both consumer\
  \ paths.\n\nWork in `~/quest` on the workstation. Supplied files: `board.json`, `client.json`, `service.json`,\
  \ `diagnosis.json`, `proxy-observation.json`.\n\n**Requirements:**\n\n- `diagnosis.json` on the workstation records\
  \ the fault identified from the supplied evidence.\n- Service `board` reaches the ready Pods labelled `app=board`\
  \ and has a ready EndpointSlice endpoint.\n- From Deployment `client`, both a `board` Pod IP and the Service VIP\
  \ on port `8080` return `north-118`.\n- The supplied proxy observation reports readiness in mode `iptables`, `nftables`\
  \ or `ipvs`.\n\n**Verify yourself before Check & finish:** Run these observation commands from `~/quest` on the\
  \ workstation.\n\n- Settings, identity and status match Requirements.\n\n  ```sh\n  cat diagnosis.json proxy-observation.json\n\
  \  kubectl get service board -o yaml\n  kubectl get endpointslices -l kubernetes.io/service-name=board -o yaml\n\
  \  ```\n\n- Both consumer paths return `north-118`.\n\n  ```sh\n  ip=$(kubectl get pods -l app=board -o jsonpath='{.items[0].status.podIP}')\n\
  \  vip=$(kubectl get service board -o jsonpath='{.spec.clusterIP}')\n  for address in \"$ip\" \"$vip\"; do\n \
  \   kubectl exec deployment/client -- wget -qO- -T 3 \"http://$address:8080\"\n  done\n  ```\n\nA ready endpoint\
  \ does not establish its target identity; current results do not prove node or DNS edit history. Do not modify\
  \ kube-proxy, node rules or global DNS."
debrief: The Service abstraction does not itself start a listening process. Proxy implementation and endpoint selection
  are different layers.
stages.0.brief: The recorded diagnosis and the restored Service must agree with the evidence.
hints.0.text: A working direct Pod request separates application health from Service selection.
hints.1.text: A Service without ready endpoints cannot route to its intended backend.
hints.2.text: Read the immutable proxy observation, record selector, then repair the local Service.
phrases.0: I compared Pod-IP and Service-VIP traffic.
phrases.1: I inspected ready endpoints before blaming the proxy.
phrases.2: I kept node routing rules unchanged.
questions.0.points.0: It is a virtual Service address implemented by the dataplane.
questions.0.points.1: Actual listeners run in the selected backend Pods.
questions.0.prompt: Does a ClusterIP mean a process listens on that address?
questions.1.points.0: No; mode depends on platform, version and configuration.
questions.1.points.1: Read the actual configuration instead of assuming.
questions.1.prompt: Must kube-proxy always use iptables?
diagnostics.diagnosis: diagnosis.json fault must equal selector.
diagnostics.selector: service/board selector must equal app:board.
diagnostics.endpoint: A board EndpointSlice must have a ready endpoint.
diagnostics.pod: The request to the board Pod IP on port 8080 must return north-118.
diagnostics.vip: The request to the board Service VIP on port 8080 must return north-118.
diagnostics.proxy_ready: proxy observation ready must equal true.
diagnostics.proxy_mode: The proxy observation mode must be iptables, nftables or ipvs.
stages.0.objectives.0.text: '`diagnosis.json` on the workstation records the fault identified from the supplied
  evidence.'
stages.0.objectives.1.text: Service `board` reaches the ready Pods labelled `app=board` and has a ready EndpointSlice
  endpoint.
stages.0.objectives.2.text: From Deployment `client`, both a `board` Pod IP and the Service VIP on port `8080` return
  `north-118`.
stages.0.objectives.3.text: The supplied proxy observation reports readiness in mode `iptables`, `nftables` or `ipvs`.
