title: Service VIP and kube-proxy datapath
brief: 'A Pod answers on its IP, but the board Service has no selected endpoint. Inspect
  Pod-IP, Service-VIP and EndpointSlice behavior, and the backend-supplied read-only
  kube-proxy observation. Record fault selector in diagnosis.json and repair the Service
  selector to app: board. Do not change kube-proxy, node rules or global DNS. This
  is a diagnosis of a healthy proxy with missing backends, not a proxy-repair exercise.


  Quest files in `~/quest` (some appear in later stages): `board.json`, `client.json`,
  `service.json`, `diagnosis.json`, `proxy-observation.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images
  and private services. Change only this bay.


  Initial success criteria: The diagnosis names the selector fault; a real endpoint,
  Pod-IP response and Service-VIP response are verified.'
debrief: The Service abstraction does not itself start a listening process. Proxy
  implementation and endpoint selection are different layers.
stages.0.brief: 'Success criteria: The diagnosis names the selector fault; a real
  endpoint, Pod-IP response and Service-VIP response are verified.'
stages.0.objectives.0.text: The diagnosis names the selector fault; a real endpoint,
  Pod-IP response and Service-VIP response are verified.
hints.0.text: A working direct Pod request separates application health from Service
  selection.
hints.1.text: A Service without ready endpoints cannot route to its intended backend.
hints.2.text: Read the immutable proxy observation, record selector, then repair the
  local Service.
phrases.0: I compared Pod-IP and Service-VIP traffic.
phrases.1: I inspected ready endpoints before blaming the proxy.
phrases.2: I kept node routing rules unchanged.
questions.0.points.0: It is a virtual Service address implemented by the dataplane.
questions.0.points.1: Actual listeners run in the selected backend Pods.
questions.0.prompt: Does a ClusterIP mean a process listens on that address?
questions.1.points.0: No; mode depends on platform, version and configuration.
questions.1.points.1: Read the actual configuration instead of assuming.
questions.1.prompt: Must kube-proxy always use iptables?
