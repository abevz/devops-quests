title: Service VIP and kube-proxy datapath
brief: |-
  The application Service path is unavailable. Identify the fault from the supplied evidence and restore both consumer paths while retaining the managed identities.

  Work on the workstation in `~/quest` with the supplied files:
  - `diagnosis.json`.
  - `proxy-observation.json`.
  - `vip-contract.json`.

  **Requirements:**

  - `diagnosis.json` on the workstation records the fault identified from the supplied evidence.
  - The existing board Service reaches only the supplied board workload and has a ready EndpointSlice endpoint. Retain the Service’s original UID and VIP, the original Deployments and provided images. The desired Service mapping and every effective ready EndpointSlice target must map to the declared application interface; each target belongs to a current ready Pod of the supplied workload, as specified by `vip-contract.json`.
  - From Deployment `client`, both a `board` Pod IP and the Service VIP on port `8080` return `north-118`.
  - The supplied proxy observation reports readiness in mode `iptables`, `nftables` or `ipvs`.

  The diagnosis record is a bounded classification, not a complete incident analysis. Current checks do not prove edit history. Keep kube-proxy, node rules and global DNS unchanged.
debrief: The checks compared the bounded diagnosis, retained Service/VIP and workloads, current owned endpoints,
  interface mapping and both actual consumer paths.
stages.0.brief: Keep recovery within this bay’s Service path.
hints.0.text: A Service selector, a ready endpoint and a working application interface describe different layers.
  Endpoint readiness does not test a listener or establish ownership. Compare the complete path before blaming the
  proxy.
hints.1.text: |-
  Compare the supplied proxy observation with Service selection, current EndpointSlice ports and target identities, and the application path:

  ```sh
  cat diagnosis.json proxy-observation.json vip-contract.json
  kubectl get service board -o yaml
  kubectl get endpointslices -l kubernetes.io/service-name=board -o yaml
  kubectl get deployment,replicaset,pods -o yaml
  ```
hints.2.text: |-
  Verify the retained VIP and workload identities, actual endpoint ownership and interface mapping, then both direct Pod and Service-VIP responses:

  ```sh
  kubectl get service board -o yaml
  kubectl get endpointslices -l kubernetes.io/service-name=board -o yaml
  kubectl get deployment,replicaset,pods -o yaml
  ip=$(kubectl get pods -l app=board -o jsonpath='{.items[0].status.podIP}')
  vip=$(kubectl get service board -o jsonpath='{.spec.clusterIP}')
  for address in "$ip" "$vip"; do
   kubectl exec deployment/client -- wget -qO- -T 3 "http://$address:8080"
  done
  ```

  Both HTTP requests return north-118.
phrases.0: I compared Pod-IP and Service-VIP traffic.
phrases.1: I inspected ready endpoints before blaming the proxy.
phrases.2: I kept node routing rules unchanged.
questions.0.points.0: It is a virtual Service address implemented by the dataplane.
questions.0.points.1: Actual listeners run in the selected backend Pods.
questions.0.prompt: Does a ClusterIP mean a process listens on that address?
questions.1.points.0: No; mode depends on platform, version and configuration.
questions.1.points.1: Read the actual configuration instead of assuming.
questions.1.prompt: Must kube-proxy always use iptables?
stages.0.objectives.0.text: '`diagnosis.json` on the workstation records the fault identified from the supplied
  evidence.'
stages.0.objectives.1.text: The existing board Service reaches only the supplied board workload and has a ready
  EndpointSlice endpoint. Retain the Service’s original UID and VIP, the original Deployments and provided images.
  The desired Service mapping and every effective ready EndpointSlice target must map to the declared application
  interface; each target belongs to a current ready Pod of the supplied workload, as specified by `vip-contract.json`.
stages.0.objectives.2.text: From Deployment `client`, both a `board` Pod IP and the Service VIP on port `8080` return
  `north-118`.
stages.0.objectives.3.text: The supplied proxy observation reports readiness in mode `iptables`, `nftables` or `ipvs`.
diagnostics.diagnosis: The written diagnosis may be missing or name the proxy instead of the selector mismatch. Compare the Service selector with Pod labels and record the selector fault in diagnosis.json. [Cause and check](guides#guide=kubernetes-10&section=q118-vip-selector-diagnosis)
diagnostics.selector: The Service may still select retired labels or include an unrelated Pod. Compare app=board and any additional selector labels with the current board Pods. [Cause and check](guides#guide=kubernetes-10&section=q118-vip-matching-board-selector)
diagnostics.endpoint: After a selector correction the EndpointSlices may still have no ready address. Inspect the ready condition and wait for a ready endpoint. [Cause and check](guides#guide=kubernetes-10&section=q118-vip-ready-endpoint-observation)
diagnostics.pod: The selected board Pod may lack an address or its own HTTP listener may be unavailable. Query the Pod IP directly from client and compare with north-118 before testing the VIP. [Cause and check](guides#guide=kubernetes-10&section=q118-vip-direct-pod-request)
diagnostics.vip: The Pod can answer directly while the board VIP has no usable backend or the wrong port mapping. Query the current ClusterIP from client and compare the response with north-118. [Cause and check](guides#guide=kubernetes-10&section=q118-vip-service-live-request)
diagnostics.proxy_ready: The frozen proxy observation may be absent or not show ready. Inspect the supplied observation separately from current Service reachability. [Cause and check](guides#guide=kubernetes-10&section=q118-captured-proxy-readiness)
diagnostics.proxy_mode: The captured proxy mode may be missing or outside the expected set. Check whether the supplied observation says iptables, nftables or ipvs. [Cause and check](guides#guide=kubernetes-10&section=q118-captured-proxy-mode)
diagnostics.probe_0_1: The selector and VIP observer may stop before identifying a condition if its local process or its inputs fail. Check the tools and access to the Service, Pods and EndpointSlices. [Cause and check](guides#guide=kubernetes-10&section=q118-vip-observer-input)
diagnostics.vip_identity: A replacement permanently changes the Service UID and may also change its VIP or a supplied workload identity or image. Compare the live board and client Deployments, current Pod images and Service with the frozen records. [Cause and check](guides#guide=kubernetes-10&section=q118-preserved-vip-delivery-objects)
diagnostics.vip_interface: The Service port can be present while its numeric or named target does not resolve to the supplied application port. Compare the live mapping, named ports on current Pods, and the matching TCP EndpointSlice port. [Cause and check](guides#guide=kubernetes-10&section=q118-vip-endpoint-port-mapping)
diagnostics.vip_owner: An active endpoint can appear in a slice labelled for board but controlled by a different Service. Compare its controller owner UID with the frozen original Service UID. [Cause and check](guides#guide=kubernetes-10&section=q118-vip-original-service-endpoint-owner)
diagnostics.vip_target: The EndpointSlice may retain a stale target, an address that does not belong to that Pod, or no active target. Compare each active targetRef and address with a current ready Pod owned by the board Deployment. [Cause and check](guides#guide=kubernetes-10&section=q118-vip-current-ready-target)
