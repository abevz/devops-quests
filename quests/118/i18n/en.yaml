title: Service VIP and kube-proxy datapath
brief: |-
  The board Service path is unavailable. Identify the fault from the supplied evidence and restore both consumer paths.

  Work on the workstation in `~/quest` with the supplied files:
  - `board.yaml`, `client.yaml`, `service.yaml`, `diagnosis.json`, `proxy-observation.json`.

  **Requirements:**

  - `diagnosis.json` on the workstation records the fault identified from the supplied evidence.
  - The existing board Service reaches only the supplied board workload and has a ready EndpointSlice endpoint.
  - From Deployment `client`, both a `board` Pod IP and the Service VIP on port `8080` return `north-118`.
  - The supplied proxy observation reports readiness in mode `iptables`, `nftables` or `ipvs`.

  A ready endpoint does not establish its target identity; current results do not prove node or DNS edit history. Do not modify kube-proxy, node rules or global DNS.
debrief: The Service abstraction does not itself start a listening process. Proxy implementation and endpoint
  selection are different layers.
stages.0.brief: Keep recovery within this bay’s Service path.
hints.0.text: A working direct Pod request separates application health from Service selection.
hints.1.text: |-
  A Service without ready endpoints cannot route to its intended backend.

  Inspect the supplied inputs and live observations:

  ```sh
  cat diagnosis.json proxy-observation.json
    kubectl get service board -o yaml
    kubectl get endpointslices -l kubernetes.io/service-name=board -o yaml
  ```
hints.2.text: |-
  Read the immutable proxy observation, record selector, then repair the local Service.

  Verify the result from `~/quest` on the workstation:

  - Both consumer paths return `north-118`.

    ```sh
    ip=$(kubectl get pods -l app=board -o jsonpath='{.items[0].status.podIP}')
    vip=$(kubectl get service board -o jsonpath='{.spec.clusterIP}')
    for address in "$ip" "$vip"; do
      kubectl exec deployment/client -- wget -qO- -T 3 "http://$address:8080"
    done
    ```
phrases.0: I compared Pod-IP and Service-VIP traffic.
phrases.1: I inspected ready endpoints before blaming the proxy.
phrases.2: I kept node routing rules unchanged.
questions.0.points.0: It is a virtual Service address implemented by the dataplane.
questions.0.points.1: Actual listeners run in the selected backend Pods.
questions.0.prompt: Does a ClusterIP mean a process listens on that address?
questions.1.points.0: No; mode depends on platform, version and configuration.
questions.1.points.1: Read the actual configuration instead of assuming.
questions.1.prompt: Must kube-proxy always use iptables?
diagnostics.diagnosis: diagnosis.json must identify a Service selector mismatch.
diagnostics.selector: Service board must select the whole supplied board workload and no other workload.
diagnostics.endpoint: A board EndpointSlice must have a ready endpoint.
diagnostics.pod: The request to the board Pod IP on port 8080 must return north-118.
diagnostics.vip: The request to the board Service VIP on port 8080 must return north-118.
diagnostics.proxy_ready: proxy observation ready must equal true.
diagnostics.proxy_mode: The proxy observation mode must be iptables, nftables or ipvs.
stages.0.objectives.0.text: '`diagnosis.json` on the workstation records the fault identified from the
  supplied evidence.'
stages.0.objectives.1.text: The existing board Service reaches only the supplied board workload and has
  a ready EndpointSlice endpoint.
stages.0.objectives.2.text: From Deployment `client`, both a `board` Pod IP and the Service VIP on port
  `8080` return `north-118`.
stages.0.objectives.3.text: The supplied proxy observation reports readiness in mode `iptables`, `nftables`
  or `ipvs`.
