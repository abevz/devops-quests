stages.0.objectives.3.text: La observación suministrada del proxy indica disponibilidad en modo `iptables`, `nftables`
  o `ipvs`.
diagnostics.diagnosis: El diagnóstico puede faltar o señalar al proxy en vez de la discrepancia del selector. Compare el selector del Service con las etiquetas y registre el fallo en diagnosis.json. [Causa y comprobación](guides#guide=kubernetes-10&section=q118-vip-selector-diagnosis)
diagnostics.selector: El Service puede seguir con etiquetas antiguas o incluir un Pod ajeno. Compare app=board y etiquetas adicionales con los Pods board actuales. [Causa y comprobación](guides#guide=kubernetes-10&section=q118-vip-matching-board-selector)
diagnostics.endpoint: Tras corregir el selector, las EndpointSlices pueden seguir sin dirección lista. Revise ready y espere un endpoint listo. [Causa y comprobación](guides#guide=kubernetes-10&section=q118-vip-ready-endpoint-observation)
diagnostics.pod: El Pod board elegido puede carecer de dirección, o su listener HTTP puede estar inaccesible. Consulte la IP directa desde client y compare con north-118 antes de probar el VIP. [Causa y comprobación](guides#guide=kubernetes-10&section=q118-vip-direct-pod-request)
diagnostics.vip: El Pod puede responder directamente aunque el VIP de board carezca de backend o mapee mal el puerto. Consulte el ClusterIP activo desde client y compare con north-118. [Causa y comprobación](guides#guide=kubernetes-10&section=q118-vip-service-live-request)
diagnostics.proxy_ready: La observación fijada del proxy puede faltar o no indicar ready. Revísela por separado de la accesibilidad actual del Service. [Causa y comprobación](guides#guide=kubernetes-10&section=q118-captured-proxy-readiness)
diagnostics.proxy_mode: El modo capturado puede faltar o estar fuera del conjunto esperado. Compruebe si indica iptables, nftables o ipvs. [Causa y comprobación](guides#guide=kubernetes-10&section=q118-captured-proxy-mode)
diagnostics.probe_0_1: El observador del selector y VIP puede detenerse antes de señalar una condición si falla el proceso o la entrada. Revise herramientas y acceso al Service, Pods y EndpointSlices. [Causa y comprobación](guides#guide=kubernetes-10&section=q118-vip-observer-input)
diagnostics.vip_identity: Un reemplazo cambia de forma irreversible el UID del Service y puede alterar su VIP o la identidad o imagen de una carga suministrada. Compare los Deployment board y client, imágenes de Pods actuales y Service con los registros fijados. [Causa y comprobación](guides#guide=kubernetes-10&section=q118-preserved-vip-delivery-objects)
diagnostics.vip_interface: El puerto del Service puede existir aunque su destino numérico o nombrado no resuelva al puerto de la aplicación. Compare el mapeo, los puertos nombrados y el TCP de EndpointSlice correspondiente. [Causa y comprobación](guides#guide=kubernetes-10&section=q118-vip-endpoint-port-mapping)
diagnostics.vip_owner: Puede haber un endpoint activo en una slice etiquetada board pero controlada por otro Service. Compare el UID del controlador con el UID original fijado del Service. [Causa y comprobación](guides#guide=kubernetes-10&section=q118-vip-original-service-endpoint-owner)
diagnostics.vip_target: La EndpointSlice puede conservar un destino antiguo, una dirección ajena al Pod o ningún destino activo. Compare cada targetRef y dirección con un Pod actual listo bajo control del Deployment board. [Causa y comprobación](guides#guide=kubernetes-10&section=q118-vip-current-ready-target)
