hints.1.text: Un Service sin endpoints listo no puede route a su backend previsto.
hints.2.text: Lea la observación del proxy inmutable, registre selector y luego repare el Service local.
phrases.0: Comparé el tráfico Pod-IP y Service-VIP.
phrases.1: Inspeccioné el endpoints listo antes de culpar al proxy.
phrases.2: Mantuve las reglas de enrutamiento de nodos sin cambios.
questions.0.points.0: Es una dirección virtual Service implementada por dataplane.
questions.0.points.1: Ejecución real de listeners en el backend Pods seleccionado.
questions.0.prompt: ¿Significa ClusterIP que un proceso escucha en esa dirección?
questions.1.points.0: No; El modo depende de la plataforma, la versión y la configuración.
questions.1.points.1: Lea la configuración real en lugar de asumirla.
