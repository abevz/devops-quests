title: Ruta de datos Service VIP y kube-proxy
brief: |-
  La ruta por el Service board no está disponible. Identifique el fallo con las pruebas suministradas y restaure ambas rutas del consumidor.

  Trabaja en la workstation en `~/quest` con los archivos suministrados:
  - `board.yaml`, `client.yaml`, `service.yaml`, `diagnosis.json`, `proxy-observation.json`.

  **Requirements:**

  - `diagnosis.json` en la estación de trabajo registra el fallo identificado a partir de las pruebas suministradas.
  - El Service board existente alcanza solo la carga board suministrada y tiene un endpoint EndpointSlice listo.
  - Desde el Deployment `client`, tanto una IP de Pod `board` como la VIP del Service en el puerto `8080` devuelven `north-118`.
  - La observación suministrada del proxy indica disponibilidad en modo `iptables`, `nftables` o `ipvs`.

  Un endpoint listo no establece la identidad de su destino; los resultados actuales no prueban el historial del nodo o DNS. No modifique kube-proxy, reglas del nodo ni DNS global.
debrief: La abstracción Service no inicia por sí misma un proceso de escucha. La implementación de proxy
  y la selección de puntos finales son capas diferentes.
stages.0.brief: Limita la recuperación a la ruta del Service de este bay.
hints.0.text: Una solicitud Pod directa que funcione separa el estado de la aplicación de la selección
  de Service.
hints.1.text: |-
  Un Service sin endpoints listo no puede route a su backend previsto.

  Inspecciona los datos suministrados y las observaciones activas:

  ```sh
  cat diagnosis.json proxy-observation.json
    kubectl get service board -o yaml
    kubectl get endpointslices -l kubernetes.io/service-name=board -o yaml
  ```
hints.2.text: |-
  Lea la observación del proxy inmutable, registre selector y luego repare el Service local.

  Verifica el resultado desde `~/quest` en la workstation:

  - Ambas rutas del consumidor devuelven `north-118`.

    ```sh
    ip=$(kubectl get pods -l app=board -o jsonpath='{.items[0].status.podIP}')
    vip=$(kubectl get service board -o jsonpath='{.spec.clusterIP}')
    for address in "$ip" "$vip"; do
      kubectl exec deployment/client -- wget -qO- -T 3 "http://$address:8080"
    done
    ```
phrases.0: Comparé el tráfico Pod-IP y Service-VIP.
phrases.1: Inspeccioné el endpoints listo antes de culpar al proxy.
phrases.2: Mantuve las reglas de enrutamiento de nodos sin cambios.
questions.0.points.0: Es una dirección virtual Service implementada por dataplane.
questions.0.points.1: Ejecución real de listeners en el backend Pods seleccionado.
questions.0.prompt: ¿Significa ClusterIP que un proceso escucha en esa dirección?
questions.1.points.0: No; El modo depende de la plataforma, la versión y la configuración.
questions.1.points.1: Lea la configuración real en lugar de asumirla.
questions.1.prompt: ¿kube-proxy debe usar siempre iptables?
diagnostics.diagnosis: diagnosis.json debe identificar un desajuste del selector del Service.
diagnostics.selector: El Service board debe seleccionar toda la carga suministrada board y ninguna otra.
diagnostics.endpoint: Un EndpointSlice board debe tener un endpoint listo.
diagnostics.pod: La petición a la IP del Pod board en el puerto 8080 debe devolver north-118.
diagnostics.vip: La petición a la VIP del Service board en el puerto 8080 debe devolver north-118.
diagnostics.proxy_ready: proxy observation ready debe ser igual a true.
diagnostics.proxy_mode: El modo observado del proxy debe ser iptables, nftables o ipvs.
stages.0.objectives.0.text: '`diagnosis.json` en la estación de trabajo registra el fallo identificado
  a partir de las pruebas suministradas.'
stages.0.objectives.1.text: El Service board existente alcanza solo la carga board suministrada y tiene
  un endpoint EndpointSlice listo.
stages.0.objectives.2.text: Desde el Deployment `client`, tanto una IP de Pod `board` como la VIP del
  Service en el puerto `8080` devuelven `north-118`.
stages.0.objectives.3.text: La observación suministrada del proxy indica disponibilidad en modo `iptables`,
  `nftables` o `ipvs`.
diagnostics.probe_0_1: 'Los datos actuales no permiten verificar este objetivo: El Service board existente alcanza
  solo la carga board suministrada y tiene un endpoint EndpointSlice listo.'
