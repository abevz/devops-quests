title: Ruta de datos Service VIP y kube-proxy
brief: 'Trabaja en `~/quest` con `board.json`, `client.json`, `service.json`, `diagnosis.json` y `proxy-observation.json`.
  La IP virtual de un Service (VIP) dirige tráfico mediante EndpointSlices listos a los Pods seleccionados; kube-proxy programa
  la ruta de datos del nodo. La bahía proporciona `proxy-observation.json` como observación de backend de solo lectura: debe
  indicar `ready: true` y modo `iptables`, `nftables` o `ipvs`. Registra `fault: selector` en `diagnosis.json` y establece
  el selector del Service `board` exactamente en `app: board`. Espera la reconciliación de EndpointSlice. Verifica un endpoint
  listo y la respuesta HTTP `north-118` en la IP del Pod board y en la VIP del Service por el puerto 8080. La comprobación
  del endpoint no establece la identidad del destino y los resultados actuales no prueban el historial de cambios del nodo
  o DNS. No cambies kube-proxy, reglas del nodo ni DNS global. Trabaja solo en la bahía sin conexión.'
debrief: La abstracción Service no inicia por sí misma un proceso de escucha. La implementación de proxy y la selección de
  puntos finales son capas diferentes.
stages.0.brief: El diagnóstico, selector, endpoint listo, respuestas de IP del Pod y VIP del Service y observación del proxy
  coinciden con la descripción.
stages.0.objectives.0.text: El diagnóstico, selector, endpoint listo, respuestas de IP del Pod y VIP del Service y observación
  del proxy coinciden con la descripción.
hints.0.text: Una solicitud Pod directa que funcione separa el estado de la aplicación de la selección de Service.
hints.1.text: Un Service sin endpoints listo no puede route a su backend previsto.
hints.2.text: Lea la observación del proxy inmutable, registre selector y luego repare el Service local.
phrases.0: Comparé el tráfico Pod-IP y Service-VIP.
phrases.1: Inspeccioné el endpoints listo antes de culpar al proxy.
phrases.2: Mantuve las reglas de enrutamiento de nodos sin cambios.
questions.0.points.0: Es una dirección virtual Service implementada por dataplane.
questions.0.points.1: Ejecución real de listeners en el backend Pods seleccionado.
questions.0.prompt: ¿Significa ClusterIP que un proceso escucha en esa dirección?
questions.1.points.0: No; El modo depende de la plataforma, la versión y la configuración.
questions.1.points.1: Lea la configuración real en lugar de asumirla.
questions.1.prompt: ¿kube-proxy debe usar siempre iptables?
