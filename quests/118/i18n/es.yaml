title: Ruta de datos Service VIP y kube-proxy
brief: |-
  La ruta del Service del tablero no está disponible. Identifica el fallo mediante las observaciones suministradas y recupera ambos caminos conservando las identidades gestionadas.

  Trabaja en la estación de trabajo, en `~/quest`, con los archivos suministrados:
  - `diagnosis.json`.
  - `proxy-observation.json`.
  - `vip-contract.json`.

  **Requisitos:**

  - `diagnosis.json` en la estación de trabajo registra el fallo identificado a partir de las pruebas suministradas.
  - El Service board existente alcanza solo la carga board suministrada y tiene un endpoint EndpointSlice listo. Conserva UID y VIP originales del Service, Deployments originales e imágenes suministradas. El destino deseado del Service y cada destino listo efectivo de EndpointSlice deben corresponder a la interfaz declarada; cada destino pertenece a un Pod actual listo de la carga suministrada según `vip-contract.json`.
  - Desde el Deployment `client`, tanto una IP de Pod `board` como la VIP del Service en el puerto `8080` devuelven `north-118`.
  - La observación suministrada del proxy indica disponibilidad en modo `iptables`, `nftables` o `ipvs`.

  El registro de diagnóstico es una clasificación acotada, no un análisis completo del incidente. Las comprobaciones actuales no prueban el historial. No cambies kube-proxy, reglas del nodo ni DNS global.
debrief: Las comprobaciones compararon diagnóstico acotado, identidades de Service/VIP y cargas, endpoints actuales
  pertenecientes, correspondencia de interfaces y ambos caminos reales.
stages.0.brief: Limita la recuperación a la ruta del Service de este bay.
hints.0.text: Selector de Service, endpoint listo e interfaz de aplicación funcional describen capas distintas.
  La disponibilidad del endpoint no prueba un listener ni su pertenencia. Compara todo el camino antes de culpar
  al proxy.
hints.1.text: |-
  Compara la observación de proxy suministrada con la selección del Service, puertos e identidades actuales de EndpointSlice y el camino de la aplicación:

  ```sh
  cat diagnosis.json proxy-observation.json vip-contract.json
  kubectl get service board -o yaml
  kubectl get endpointslices -l kubernetes.io/service-name=board -o yaml
  kubectl get deployment,replicaset,pods -o yaml
  ```
hints.2.text: |-
  Verifica VIP e identidades conservados, pertenencia real de endpoints y correspondencia de interfaces; después las respuestas por Pod directo y Service VIP:

  ```sh
  kubectl get service board -o yaml
  kubectl get endpointslices -l kubernetes.io/service-name=board -o yaml
  kubectl get deployment,replicaset,pods -o yaml
  ip=$(kubectl get pods -l app=board -o jsonpath='{.items[0].status.podIP}')
  vip=$(kubectl get service board -o jsonpath='{.spec.clusterIP}')
  for address in "$ip" "$vip"; do
   kubectl exec deployment/client -- wget -qO- -T 3 "http://$address:8080"
  done
  ```
phrases.0: Comparé el tráfico Pod-IP y Service-VIP.
phrases.1: Inspeccioné el endpoints listo antes de culpar al proxy.
phrases.2: Mantuve las reglas de enrutamiento de nodos sin cambios.
questions.0.points.0: Es una dirección virtual Service implementada por dataplane.
questions.0.points.1: Ejecución real de listeners en el backend Pods seleccionado.
questions.0.prompt: ¿Significa ClusterIP que un proceso escucha en esa dirección?
questions.1.points.0: No; El modo depende de la plataforma, la versión y la configuración.
questions.1.points.1: Lea la configuración real en lugar de asumirla.
questions.1.prompt: ¿kube-proxy debe usar siempre iptables?
stages.0.objectives.0.text: '`diagnosis.json` en la estación de trabajo registra el fallo identificado a partir
  de las pruebas suministradas.'
stages.0.objectives.1.text: El Service board existente alcanza solo la carga board suministrada y tiene un endpoint
  EndpointSlice listo. Conserva UID y VIP originales del Service, Deployments originales e imágenes suministradas.
  El destino deseado del Service y cada destino listo efectivo de EndpointSlice deben corresponder a la interfaz
  declarada; cada destino pertenece a un Pod actual listo de la carga suministrada según `vip-contract.json`.
stages.0.objectives.2.text: Desde el Deployment `client`, tanto una IP de Pod `board` como la VIP del Service en
