title: Ruta de datos Service VIP y kube-proxy
brief: 'Un Pod responde en su IP, pero el board Service no tiene ningún endpoint seleccionado. Inspeccione
  el comportamiento de Pod-IP, Service-VIP y EndpointSlice, y la observación de solo lectura kube-proxy
  proporcionada por el backend. Registre fault selector en diagnosis.json y repare el Service selector
  a app: board. No cambie kube-proxy, reglas de nodo o DNS global. Este es un diagnóstico de un proxy
  sano al que le falta backends, no un ejercicio de reparación de proxy.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `board.json`, `client.json`,
  `service.json`, `diagnosis.json`, `proxy-observation.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: El diagnóstico nombra selector fault; Se verifica un endpoint real, una
  respuesta Pod-IP y una respuesta Service-VIP.'
debrief: La abstracción Service no inicia por sí misma un proceso de escucha. La implementación de proxy
  y la selección de puntos finales son capas diferentes.
stages.0.brief: 'Criterios de éxito: El diagnóstico nombra la falla selector; Se verifica un endpoint
