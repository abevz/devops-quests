id: 118
title: title
track: Kubernetes
difficulty: complex
brief: brief
stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    check: 'set -euo pipefail

      cd ~/quest

      failed=0

      check() { local label=$1 expression=$2 document=$3; if ! jq -e "$expression" <<<"$document" >/dev/null 2>&1;
      then printf ''%s\n'' "$label: ✗"; failed=1; fi; }

      if ! jq -e ''.fault=="selector"'' diagnosis.json >/dev/null 2>&1; then printf ''%s\n'' ''diagnosis.json fault
      = selector: ✗ [DQ:diagnosis]''; failed=1; fi

      exit "$failed"

      '
  - text: stages.0.objectives.1.text
    check: 'set -euo pipefail

      cd ~/quest

      failed=0

      check() { local label=$1 expression=$2 document=$3; if ! jq -e "$expression" <<<"$document" >/dev/null 2>&1;
      then printf ''%s\n'' "$label: ✗"; failed=1; fi; }

      service=$(kubectl get service board -o json 2>/dev/null || true)

      endpoints=$(kubectl get endpointslices -l kubernetes.io/service-name=board -o json 2>/dev/null || true)

      check ''service/board selector = app:board [DQ:selector]'' ''.spec.selector=={app:"board"}'' "$service"

      check ''service/board EndpointSlice has a ready endpoint [DQ:endpoint]'' ''any(.items[].endpoints[]?;.conditions.ready==true)''
      "$endpoints"

      exit "$failed"

      '
  - text: stages.0.objectives.2.text
    check: 'set -euo pipefail

      cd ~/quest

      failed=0

      check() { local label=$1 expression=$2 document=$3; if ! jq -e "$expression" <<<"$document" >/dev/null 2>&1;
      then printf ''%s\n'' "$label: ✗"; failed=1; fi; }

      service=$(kubectl get service board -o json 2>/dev/null || true)

      endpoints=$(kubectl get endpointslices -l kubernetes.io/service-name=board -o json 2>/dev/null || true)

      ip=$(kubectl get pod -l app=board -o jsonpath=''{.items[0].status.podIP}'' 2>/dev/null || true)

      vip=$(jq -r ''.spec.clusterIP // ""'' <<<"$service" 2>/dev/null || true)

      if ! test -n "$ip" || ! test "$(timeout 4s kubectl exec --pod-running-timeout=2s deployment/client -- wget
      -qO- -T 3 "http://$ip:8080" 2>/dev/null)" = north-118; then printf ''%s\n'' ''board Pod IP:8080 = north-118:
      ✗ [DQ:pod]''; failed=1; fi

      if ! test -n "$vip" || ! test "$(timeout 4s kubectl exec --pod-running-timeout=2s deployment/client -- wget
      -qO- -T 3 "http://$vip:8080" 2>/dev/null)" = north-118; then printf ''%s\n'' ''board Service VIP:8080 = north-118:
      ✗ [DQ:vip]''; failed=1; fi

      exit "$failed"

      '
  - text: stages.0.objectives.3.text
    check: 'set -euo pipefail

      cd ~/quest

      failed=0

      check() { local label=$1 expression=$2 document=$3; if ! jq -e "$expression" <<<"$document" >/dev/null 2>&1;
      then printf ''%s\n'' "$label: ✗"; failed=1; fi; }

      service=$(kubectl get service board -o json 2>/dev/null || true)

      endpoints=$(kubectl get endpointslices -l kubernetes.io/service-name=board -o json 2>/dev/null || true)

      ip=$(kubectl get pod -l app=board -o jsonpath=''{.items[0].status.podIP}'' 2>/dev/null || true)

      vip=$(jq -r ''.spec.clusterIP // ""'' <<<"$service" 2>/dev/null || true)

      proxy=$(cat /run/dq/facts/0/proxy-observation.json 2>/dev/null || true)

      check ''proxy observation ready = true [DQ:proxy_ready]'' ''.ready==true'' "$proxy"

      check ''proxy observation mode = iptables, nftables or ipvs [DQ:proxy_mode]'' ''.mode=="iptables" or .mode=="nftables"
      or .mode=="ipvs"'' "$proxy"

      exit "$failed"

      '
