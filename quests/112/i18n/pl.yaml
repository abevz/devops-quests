title: Poziomy autoskaler Pod
brief: |-
  Obciążenie board nie osiąga wymaganej wydajności. Przywróć obserwowalne autoskalowanie w uzgodnionym budżecie zasobów.

  Pracuj na workstation w `~/quest` z dostarczonymi plikami:
  - `board.yaml`, `service.yaml`, `hpa.yaml`, `client.yaml`.

  **Requirements:**

  - Zachowaj uzgodniony budżet zasobów:
    - Worker `board` żąda `100m` CPU i zachowuje limit CPU `200m`.
    - HPA `board` dopuszcza `1`–`2` repliki z docelowym wykorzystaniem `50` procent.
  - HPA `board` ma `ScalingActive=True`, zgłasza bieżącą i żądaną liczbę replik `2` przy wykorzystaniu ponad `50` procent, obie są gotowe; metryki Podów pokazują CPU w millicore.
  - Z Deployment `client` adres `http://board:8080` zwraca `north-112`.

  Zbieranie metryk i uzgadnianie mogą potrwać trzy minuty; kontrole nie dowodzą, że pierwszy cel lub bieżąca metryka to CPU ani co spowodowało skalowanie. Złagodzenia TLS dotyczą tylko tego jednorazowego adaptera kind.
debrief: Działający metrics API i ważny requests stanowią oddzielne wymagania wstępne dla automatycznego
  skalowania CPU utilization.
stages.0.brief: Pojemność pozostaje w dostarczonych budżetach autoskalowania i zasobów.
hints.0.text: Utilization dzieli obserwowane CPU przez zasób request.
hints.1.text: |-
  Zero request nie definiuje użytecznego mianownika utilization.

  Sprawdź dostarczone dane i bieżące obserwacje:

  ```sh
  kubectl get deployment board -o yaml
    kubectl get hpa board -o yaml
  ```
hints.2.text: |-
  Napraw request, a następnie sprawdź currentMetrics i ScalingActive w oczekiwaniu na zwiększenie skali.

  Sprawdź wynik z `~/quest` na workstation:

  - `kubectl top pods -l app=board --no-headers` — Bieżące metryki CPU zawierają wartości w millicore.

  - `kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080` — Odbiorca otrzymuje `north-112`.
phrases.0: Sprawdziłem potok metryk przed zmianą HPA.
phrases.1: Dostarczyłem sensowny CPU request.
phrases.2: Zweryfikowałem zaobserwowane metryki i ograniczone skalowanie.
questions.0.points.0: Użycie jako procent CPU request.
questions.0.points.1: Brakujący lub zerowy requests uniemożliwia wykonanie tego obliczenia.
questions.0.prompt: Co oznacza CPU utilization dla HPA?
questions.1.points.0: Zbieranie metryk i kontroler reconciliation mają oddzielne interwały.
questions.1.points.1: Readiness i brakujące metryki również wpływają na decyzje.
questions.1.prompt: Dlaczego skalowanie może zająć więcej niż jedną ankietę?
