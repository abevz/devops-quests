title: Poziomy autoskaler Pod
brief: 'Prywatny metrics-server działa, ale ograniczony CPU worker ma zero CPU request, więc jego HPA
  nie może obliczyć utilization. Ustaw worker request na 100m, zachowaj zasięg 200m limit i HPA 1–2 z
  celem 50% CPU. Obserwuj rzeczywiste wskaźniki i skalowanie kontrolera; ręczne ustawienie replicas jest
  niewystarczające. Próbkowanie i reconciliation może zająć do trzech minut. Relaksacje TLS należą wyłącznie
  do tego jednorazowego adaptera kind, a nie do receptury produkcyjnej.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `board.json`, `service.json`,
  `hpa.json`, `client.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: Prawdziwe metryki CPU napędzają dwa gotowe replicas z request 100m, limit
  200m i pierwotnie ograniczony cel HPA.'
debrief: Działający metrics API i ważny requests stanowią oddzielne wymagania wstępne dla automatycznego
  skalowania CPU utilization.
stages.0.brief: 'Kryteria sukcesu: Prawdziwe wskaźniki CPU napędzają dwie gotowe repliki z request 100m,
  limit 200m i oryginalnym ograniczonym celem HPA.'
stages.0.objectives.0.text: Prawdziwe metryki CPU napędzają dwie gotowe repliki z request 100m, limit
  200m i oryginalnym ograniczonym celem HPA.
hints.0.text: Utilization dzieli obserwowane CPU przez zasób request.
hints.1.text: Zero request nie definiuje użytecznego mianownika utilization.
hints.2.text: Napraw request, a następnie sprawdź currentMetrics i ScalingActive w oczekiwaniu na zwiększenie
  skali.
phrases.0: Sprawdziłem potok metryk przed zmianą HPA.
phrases.1: Dostarczyłem sensowny CPU request.
phrases.2: Zweryfikowałem zaobserwowane metryki i ograniczone skalowanie.
questions.0.points.0: Użycie jako procent CPU request.
questions.0.points.1: Brakujący lub zerowy requests uniemożliwia wykonanie tego obliczenia.
questions.0.prompt: Co oznacza CPU utilization dla HPA?
questions.1.points.0: Zbieranie metryk i kontroler reconciliation mają oddzielne interwały.
questions.1.points.1: Readiness i brakujące metryki również wpływają na decyzje.
questions.1.prompt: Dlaczego skalowanie może zająć więcej niż jedną ankietę?
