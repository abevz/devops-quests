diagnostics.probe_0_0: Bieżące dane nie potwierdzają tego warunku; sprawdź stan obiektów i kontrakt.
diagnostics.load_identity: Zmieniono pierwotne obciążenie, tożsamość sterującą lub obraz; zachowaj podane komponenty.
diagnostics.load_implementation: Zachowaj podane obrazy i bajty handlera w ConfigMap oraz bieżących plikach aplikacji.
diagnostics.load_target: Pierwotny HPA musi wskazywać właściwy Deployment; poprawny cel wykorzystania nie wybiera
  obciążenia.
diagnostics.load_workers: Dwa bieżące gotowe Pody aplikacji muszą należeć do zachowanego Deployment serwera i używać
  jego obrazu.
diagnostics.load_progress: Liczba rzeczywistych ukończeń musi rosnąć podczas obserwacji; gotowe lub bezczynne repliki
  nie dowodzą zapotrzebowania.
