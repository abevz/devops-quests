title: Poziomy autoskaler Pod
brief: 'Prywatny metrics-server działa, ale worker o ograniczonym CPU ma żądanie CPU równe zeru, więc jego HPA nie może obliczyć
  wykorzystania. Ustaw żądanie worker na 100m, zachowaj limit 200m i zakres HPA 1–2 z celem 50% CPU. Obserwuj rzeczywiste
  metryki i zwiększenie replik przez kontroler; samo ręczne ustawienie liczby replik nie wystarcza. Próbkowanie i uzgadnianie
  może potrwać do trzech minut. Poluzowanie TLS dotyczy tylko tego jednorazowego adaptera kind, nie jest przepisem produkcyjnym.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `board.json`, `service.json`, `hpa.json`, `client.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie załadowanych obrazów
  i usług prywatnych. Zmień tylko tę zatokę.


  Kontrole wymagają dla pierwszego kontenera board żądania CPU `100m`, limitu `200m`, dwóch gotowych replik, minimum HPA 1
  i maksimum 2, pierwszej wartości docelowej wykorzystania 50, bieżącej i żądanej liczby replik 2, bieżącego wykorzystania
  zasobu powyżej 50 oraz ScalingActive=True. `kubectl top pods -l app=board` musi pokazać wartość CPU w milicore, a deployment/client
  otrzymać `north-112` z `board:8080`. Kontrole nie sprawdzają, czy pierwsza metryka docelowa lub bieżąca metryka dotyczy
  CPU, a stan bieżący nie dowodzi przyczyny skalowania.'
debrief: Działający metrics API i ważny requests stanowią oddzielne wymagania wstępne dla automatycznego skalowania CPU utilization.
stages.0.brief: Budżet CPU, gotowe repliki, ustawienia i stan HPA, wynik top oraz odpowiedź board odpowiadają opisowi.
stages.0.objectives.0.text: Budżet CPU, gotowe repliki, ustawienia i stan HPA, wynik top oraz odpowiedź board odpowiadają
  opisowi.
hints.0.text: Utilization dzieli obserwowane CPU przez zasób request.
hints.1.text: Zero request nie definiuje użytecznego mianownika utilization.
hints.2.text: Napraw request, a następnie sprawdź currentMetrics i ScalingActive w oczekiwaniu na zwiększenie skali.
phrases.0: Sprawdziłem potok metryk przed zmianą HPA.
phrases.1: Dostarczyłem sensowny CPU request.
phrases.2: Zweryfikowałem zaobserwowane metryki i ograniczone skalowanie.
questions.0.points.0: Użycie jako procent CPU request.
questions.0.points.1: Brakujący lub zerowy requests uniemożliwia wykonanie tego obliczenia.
questions.0.prompt: Co oznacza CPU utilization dla HPA?
questions.1.points.0: Zbieranie metryk i kontroler reconciliation mają oddzielne interwały.
questions.1.points.1: Readiness i brakujące metryki również wpływają na decyzje.
questions.1.prompt: Dlaczego skalowanie może zająć więcej niż jedną ankietę?
diagnostics.request: Żądanie CPU pierwszego kontenera board musi wynosić 100m.
diagnostics.limit: Limit CPU pierwszego kontenera board musi wynosić 200m.
diagnostics.ready: Board musi mieć dwie gotowe repliki.
diagnostics.minimum: HPA minReplicas musi wynosić 1.
diagnostics.maximum: HPA maxReplicas musi wynosić 2.
diagnostics.target: Pierwsza docelowa wartość wykorzystania HPA musi wynosić 50.
diagnostics.current: HPA currentReplicas musi wynosić 2.
diagnostics.desired: HPA desiredReplicas musi wynosić 2.
diagnostics.metric: Bieżąca metryka zasobu HPA musi mieć wykorzystanie powyżej 50.
diagnostics.active: HPA ScalingActive musi mieć wartość True.
diagnostics.top: kubectl top pods musi pokazywać CPU w milicore.
diagnostics.http: board:8080 musi zwrócić north-112.
