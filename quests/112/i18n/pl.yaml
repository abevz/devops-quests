title: Poziomy autoskaler Pod
brief: |-
  Usługa nie osiąga wymaganej autoskalowanej pojemności. Przywróć model zasobów i rzeczywiste zapotrzebowanie na przetwarzanie żądań.

  Pracuj na workstation w `~/quest` z podanymi danymi połączenia/wyniku: `autoscaling-contract.json`. Definicje obciążeń są dostępne w bieżących obiektach klastra.

  **Wymagania:**

  - Worker `board` żąda `100m` CPU i zachowuje limit CPU `200m`. Zachowaj tożsamości pierwotnych obciążeń i ConfigMap przetwarzania oraz podane obrazy.
  - HPA `board` dopuszcza `1`–`2` repliki z docelowym wykorzystaniem `50` procent.
  - HPA `board` ma `ScalingActive=True`, zgłasza bieżącą i żądaną liczbę replik `2` przy wykorzystaniu ponad `50` procent, obie są gotowe; metryki Podów pokazują CPU w millicore. Istniejący HPA wskazuje podany serwer, a niezmieniony handler zapisuje nowe ukończenia podczas obserwacji.
  - Z Deployment `client` adres `http://board:8080` zwraca `north-112`.

  Próbkowanie może trwać trzy minuty. Testy obserwują bieżącą politykę, gotowe Pody i postęp, nie historię zmian, ciągłą dostępność ani produkcyjne SLO.
debrief: Cel skalowania, mianownik metryki i rzeczywista praca to osobne ogniwa. Ograniczone przetwarzanie pokazuje
  prawdziwe zapotrzebowanie zamiast stałej bezużytecznej pętli CPU.
stages.0.brief: Pojemność pozostaje w dostarczonych budżetach autoskalowania i zasobów.
hints.0.text: Skalowanie wymaga właściwego celu, użytecznych metryk wykorzystania i napływającej pracy. Sam budżet
  CPU nie tworzy zapotrzebowania.
hints.1.text: |-
  Sprawdź referencje i warunki HPA, model zasobów kontenera serwera, bieżące metryki i podany interfejs przetwarzania.

  ```sh
  cat autoscaling-contract.json
  kubectl get hpa,deployments,service -o yaml
  kubectl describe hpa board
  kubectl get configmap work-handler -o yaml
  kubectl top pods -l app=board
  ```
hints.2.text: |-
  Sprawdź, czy `ScalingActive` ma wartość `True`, bieżąca i żądana liczba replik to dwa, a wykorzystanie CPU przekracza wartość docelową `50` procent. Oba Pody tego Deploymentu muszą być gotowe i zgłaszać metryki CPU w jednostkach millicore. Porównaj dwa pomiary liczników ukończonych żądań na tych samych Podach: żaden licznik nie powinien maleć, a ich suma powinna wzrosnąć. Żądanie z Deploymentu `client` do głównej ścieżki powinno nadal zwracać `north-112`.

  ```sh
  kubectl get hpa board -o yaml
  kubectl get deployment board
  kubectl top pods -l app=board
  pods=$(kubectl get deployments,replicasets,pods -o json | jq -r '
    def owned($kind; $uids): any(.metadata.ownerReferences[]?;
      .controller == true and .kind == $kind and (.uid as $uid | $uids | index($uid) != null));
    .items as $items | ($items[] | select(.kind == "Deployment" and .metadata.name == "board")) as $board
    | [$items[] | select(.kind == "ReplicaSet" and owned("Deployment"; [$board.metadata.uid])) | .metadata.uid] as $rs
    | $items[] | select(.kind == "Pod" and owned("ReplicaSet"; $rs) and .metadata.deletionTimestamp == null
      and .status.phase != "Failed" and .status.phase != "Succeeded") | .metadata.name')
  sample() {
    while IFS= read -r pod; do
      printf '%s ' "$pod"
      kubectl exec "$pod" -c worker -- sh -c 'if test -f /tmp/work-completions; then wc -l < /tmp/work-completions; else echo 0; fi'
    done <<< "$pods"
  }
  test -n "$pods" && sample && sleep 1 && sample
  kubectl exec deployment/client -c worker -- wget -qO- -T 3 http://board:8080
  ```
phrases.0: Sprawdziłem potok metryk przed zmianą HPA.
phrases.1: Dostarczyłem sensowny CPU request.
phrases.2: Zweryfikowałem zaobserwowane metryki i ograniczone skalowanie.
questions.0.points.0: Użycie jako procent CPU request.
questions.0.points.1: Brakujący lub zerowy requests uniemożliwia wykonanie tego obliczenia.
questions.0.prompt: Co oznacza CPU utilization dla HPA?
questions.1.points.0: Zbieranie metryk i kontroler reconciliation mają oddzielne interwały.
questions.1.points.1: Readiness i brakujące metryki również wpływają na decyzje.
questions.1.prompt: Dlaczego skalowanie może zająć więcej niż jedną ankietę?
stages.0.objectives.0.text: Worker `board` żąda `100m` CPU i zachowuje limit CPU `200m`. Zachowaj tożsamości pierwotnych
  obciążeń i ConfigMap przetwarzania oraz podane obrazy.
stages.0.objectives.1.text: HPA `board` dopuszcza `1`–`2` repliki z docelowym wykorzystaniem `50` procent.
stages.0.objectives.2.text: HPA `board` ma `ScalingActive=True`, zgłasza bieżącą i żądaną liczbę replik `2` przy
  wykorzystaniu ponad `50` procent, obie są gotowe; metryki Podów pokazują CPU w millicore. Istniejący HPA wskazuje
  podany serwer, a niezmieniony handler zapisuje nowe ukończenia podczas obserwacji.
stages.0.objectives.3.text: Z Deployment `client` adres `http://board:8080` zwraca `north-112`.
diagnostics.request: Żądanie CPU kontenera worker może nie istnieć lub różnić się od 100m, zmieniając podstawę obliczeń. Sprawdź efektywną wartość CPU kontenera worker. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q112-board-cpu-request)
diagnostics.limit: Kontener worker może mieć pusty lub inny limit CPU. Sprawdź jego efektywny limit i porównaj z 200m. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q112-board-cpu-limit)
diagnostics.minimum: HPA mógł stracić dolną granicę skalowania. Sprawdź minReplicas i zachowaj jedną replikę. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q112-hpa-minimum-replicas)
diagnostics.maximum: HPA może nie osiągać dwóch replik lub przekraczać limit. Sprawdź maxReplicas i zachowaj wartość dwa. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q112-hpa-maximum-replicas)
diagnostics.target: Pasujące metryki CPU mogą nie istnieć, używać innego typu lub dawać inny próg. Sprawdź, czy każdy pasujący cel ma typ Utilization i wartość dodatnią. Najmniejsza z tych wartości musi wynosić dokładnie 50 procent. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q112-hpa-cpu-target)
diagnostics.ready: HPA może żądać większej pojemności, choć pod board nie jest gotowy. Sprawdź zdarzenia i poczekaj na dwie gotowe repliki w stanie Deploymentu. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q112-board-ready-replica-count)
diagnostics.current: Kontroler może nie widzieć dwóch replik lub wskazywać inne obciążenie. Porównaj zgłaszaną liczbę z powiązanym Deploymentem. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q112-hpa-current-replica-count)
diagnostics.desired: Kontroler może nadal zalecać jedną replikę z powodu niskiego obciążenia CPU lub braku metryki. Sprawdź żądaną liczbę po utrzymaniu obciążenia przez dostarczony client. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q112-hpa-desired-replica-count)
diagnostics.metric: Wykorzystanie CPU może brakować albo nie przekraczać 50 procent. Sprawdź bieżącą metrykę CPU zasobu lub kontenera worker podczas ciągłej pracy przez dostarczony handler. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q112-hpa-observed-cpu-utilization)
diagnostics.active: Autoscaler może nie mieć metryk lub nie rozpoznawać celu. Sprawdź powód i komunikat ScalingActive oraz poczekaj na True. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q112-hpa-scaling-active)
diagnostics.top: API metryk może jeszcze nie zwracać milicore dla bieżących podów board. Sprawdź aktualne metryki przed oceną skalowania. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q112-board-metrics-availability)
diagnostics.http: Skalowanie może być poprawne, ale Service zwraca starą odpowiedź lub nie ma dostępnego endpointu. Odpytaj board z client i porównaj treść z north-112. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q112-board-live-workload-response)
diagnostics.load_identity: Dostarczony Deployment board lub client mógł zostać odtworzony pod pierwotną nazwą. Porównaj oba aktualne UID z zamrożonymi i popraw istniejące obiekty. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q112-preserved-load-deployments)
diagnostics.load_implementation: Dostarczony obraz lub ConfigMap handlera mogły się zmienić albo bieżący kontener worker wykonuje inne bajty. Porównaj obrazy, UID ConfigMap, skrót danych i plik handlera. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q112-preserved-load-handler)
diagnostics.load_target: HPA mógł zostać odtworzony albo skaluje zły obiekt. Porównaj UID z pierwotnym i sprawdź, czy scaleTargetRef wskazuje apps/v1 Deployment board. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q112-hpa-preserved-scale-target)
diagnostics.load_workers: Zachowany Deployment board może nie mieć dwóch aktualnych podów z gotowym kontenerem worker na dostarczonym obrazie. Po skalowaniu sprawdź tożsamość, żądaną liczbę replik i kontener worker każdego poda. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q112-current-serving-workers)
diagnostics.load_progress: Dostarczony handler może nie kończyć żądań mimo prawidłowych replik. Sprawdź licznik każdego bieżącego kontenera worker w kolejnych obserwacjach. Liczniki mają nie maleć i dawać dodatni łączny przyrost. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q112-handler-completion-progress)
diagnostics.probe_0_0: Kontrola danych może zatrzymać się przed wskazaniem błędu zasobu lub zachowanej implementacji. Sprawdź narzędzia i dostęp do dostarczonych Deploymentów i danych handlera. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q112-autoscaling-input-observer)
diagnostics.probe_0_2: Kontrola skalowania może zatrzymać się bez wskazania warunku, gdy proces lub zamrożone dane zawodzą. Sprawdź narzędzia i dostęp do HPA oraz bieżącego obciążenia. [Przyczyna i kontrola](guides#guide=autoscaling-gateway&section=q112-autoscaling-demand-observer)
