title: Горизонтальное масштабирование Pod
brief: 'Приватный metrics-server работает, но запрос CPU ограниченного worker равен нулю, поэтому HPA не может вычислить использование.
  Установите запрос worker 100m, сохраните лимит 200m и диапазон HPA 1–2 с целью CPU 50%. Наблюдайте реальные метрики и увеличение
  числа реплик контроллером; одного ручного изменения числа реплик недостаточно. Сбор метрик и согласование могут занять до
  трёх минут. Ослабление TLS относится только к этому одноразовому адаптеру kind и не является производственной инструкцией.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `board.json`, `service.json`, `hpa.json`, `client.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы и приватные сервисы.
  Менять можно только эту песочницу.


  Проверки требуют для первого контейнера board запрос CPU `100m`, лимит `200m`, две готовые реплики, минимум HPA 1 и максимум
  2, первое целевое использование 50, текущее и желаемое число реплик 2, текущее использование ресурса выше 50 и ScalingActive=True.
  `kubectl top pods -l app=board` должен показать CPU в millicore, а deployment/client — получить `north-112` от `board:8080`.
  Проверки не устанавливают принадлежность ни первой целевой, ни текущей метрики к CPU, а текущее состояние не доказывает
  причину масштабирования.'
debrief: Рабочий metrics API и корректные requests — отдельные предпосылки автомасштабирования по CPU utilization.
stages.0.brief: Бюджет CPU, готовые реплики, настройки и статус HPA, вывод top и ответ board соответствуют описанию.
stages.0.objectives.0.text: Бюджет CPU, готовые реплики, настройки и статус HPA, вывод top и ответ board соответствуют описанию.
hints.0.text: Utilization делит наблюдаемый CPU на request.
hints.1.text: Нулевой request не задаёт пригодный знаменатель utilization.
hints.2.text: Исправьте request, затем смотрите currentMetrics и ScalingActive при ожидании масштабирования.
phrases.0: Я проверил цепочку метрик до изменения HPA.
phrases.1: Я задал осмысленный CPU request.
phrases.2: Я проверил реальные метрики и ограниченное масштабирование.
questions.0.points.0: Потребление как процент CPU request.
questions.0.points.1: Отсутствующие или нулевые requests мешают вычислению.
questions.0.prompt: Что означает CPU utilization для HPA?
questions.1.points.0: У сбора метрик и reconciliation разные интервалы.
questions.1.points.1: Readiness и недостающие метрики тоже влияют на решение.
questions.1.prompt: Почему масштабирование может занять несколько опросов?
diagnostics.request: Запрос CPU первого контейнера board должен быть 100m.
diagnostics.limit: Лимит CPU первого контейнера board должен быть 200m.
diagnostics.ready: Board должен иметь две готовые реплики.
diagnostics.minimum: HPA minReplicas должен быть 1.
diagnostics.maximum: HPA maxReplicas должен быть 2.
diagnostics.target: Первое целевое использование HPA должно быть 50.
diagnostics.current: HPA currentReplicas должен быть 2.
diagnostics.desired: HPA desiredReplicas должен быть 2.
diagnostics.metric: Текущая метрика ресурса HPA должна иметь использование выше 50.
diagnostics.active: HPA ScalingActive должен быть True.
diagnostics.top: kubectl top pods должен показывать CPU в millicore.
diagnostics.http: board:8080 должен вернуть north-112.
