title: Горизонтальное масштабирование Pod
brief: |-
  Нагрузка board не достигает требуемой мощности. Восстановите наблюдаемое автомасштабирование в согласованном бюджете ресурсов.

  Работайте на workstation в `~/quest` с предоставленными файлами:
  - `board.yaml`, `service.yaml`, `hpa.yaml`, `client.yaml`.

  **Requirements:**

  - Сохраните согласованный бюджет ресурсов:
    - Worker `board` запрашивает `100m` CPU и сохраняет лимит CPU `200m`.
    - HPA `board` допускает `1`–`2` реплики с целевой утилизацией `50` процентов.
  - HPA `board` имеет `ScalingActive=True`, сообщает текущее и желаемое число реплик `2` с утилизацией выше `50` процентов, обе реплики готовы; живые метрики Pod показывают CPU в милликор.
  - Из Deployment `client` адрес `http://board:8080` возвращает `north-112`.

  Сбор метрик и согласование могут занять три минуты; проверки не доказывают, что первая цель или текущая метрика — CPU, и какое действие вызвало масштабирование. Ослабления TLS относятся только к этому одноразовому адаптеру kind.
debrief: Рабочий metrics API и корректные requests — отдельные предпосылки автомасштабирования по CPU
  utilization.
stages.0.brief: Мощность остаётся в пределах предоставленных бюджетов автоскейлинга и ресурсов.
hints.0.text: Utilization делит наблюдаемый CPU на request.
hints.1.text: |-
  Нулевой request не задаёт пригодный знаменатель utilization.

  Изучите предоставленные файлы и живые наблюдения:

  ```sh
  kubectl get deployment board -o yaml
    kubectl get hpa board -o yaml
  ```
hints.2.text: |-
  Исправьте request, затем смотрите currentMetrics и ScalingActive при ожидании масштабирования.

  Проверьте результат из `~/quest` на workstation:

  - `kubectl top pods -l app=board --no-headers` — Живые метрики CPU содержат значения в милликор.

  - `kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080` — Потребитель получает `north-112`.
phrases.0: Я проверил цепочку метрик до изменения HPA.
phrases.1: Я задал осмысленный CPU request.
phrases.2: Я проверил реальные метрики и ограниченное масштабирование.
questions.0.points.0: Потребление как процент CPU request.
questions.0.points.1: Отсутствующие или нулевые requests мешают вычислению.
questions.0.prompt: Что означает CPU utilization для HPA?
questions.1.points.0: У сбора метрик и reconciliation разные интервалы.
questions.1.points.1: Readiness и недостающие метрики тоже влияют на решение.
questions.1.prompt: Почему масштабирование может занять несколько опросов?
diagnostics.request: Запрос CPU первого контейнера board должен быть 100m.
diagnostics.limit: Лимит CPU первого контейнера board должен быть 200m.
diagnostics.ready: Board должен иметь две готовые реплики.
diagnostics.minimum: HPA minReplicas должен быть 1.
diagnostics.maximum: HPA maxReplicas должен быть 2.
diagnostics.target: Первое целевое использование HPA должно быть 50.
diagnostics.current: HPA currentReplicas должен быть 2.
diagnostics.desired: HPA desiredReplicas должен быть 2.
diagnostics.metric: Текущая метрика ресурса HPA должна иметь использование выше 50.
diagnostics.active: HPA ScalingActive должен быть True.
diagnostics.top: kubectl top pods должен показывать CPU в millicore.
diagnostics.http: board:8080 должен вернуть north-112.
