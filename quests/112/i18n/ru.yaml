title: Горизонтальное масштабирование Pod
brief: 'Приватный metrics-server работает, но CPU request ограниченного worker равен нулю, поэтому HPA
  не вычисляет utilization. Задайте request 100m, сохраните limit 200m и диапазон HPA 1–2 с целью CPU
  50%. Проверьте реальные метрики и увеличение числа реплик контроллером; ручного replicas недостаточно.
  Сбор и reconciliation занимают до трёх минут. Ослабление TLS допустимо только в этом адаптере одноразового
  kind, не как production-рецепт.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `board.json`, `service.json`, `hpa.json`,
  `client.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Реальные CPU-метрики дают две готовые реплики с request 100m, limit 200m и исходной
  ограниченной целью HPA.'
debrief: Рабочий metrics API и корректные requests — отдельные предпосылки автомасштабирования по CPU
  utilization.
stages.0.brief: 'Реальные CPU-метрики дают две готовые реплики с request 100m, limit 200m и исходной ограниченной
  целью HPA.


  Результат проверки: Реальные CPU-метрики дают две готовые реплики с request 100m, limit 200m и исходной
  ограниченной целью HPA.'
stages.0.objectives.0.text: Реальные CPU-метрики дают две готовые реплики с request 100m, limit 200m и
