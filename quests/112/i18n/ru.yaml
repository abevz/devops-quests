title: Горизонтальное масштабирование Pod
brief: |-
  Сервис не достигает требуемой autoscaled capacity. Восстановите ресурсную модель и фактическую нагрузку обработки запросов.

  Работайте на workstation в `~/quest` с заданными входами подключения/результата: `autoscaling-contract.json`. Определения нагрузок доступны в текущих объектах кластера.

  **Требования:**

  - Worker `board` запрашивает `100m` CPU и сохраняет лимит CPU `200m`. Сохраните идентичности исходных нагрузок и ConfigMap обработчика, а также заданные образы.
  - HPA `board` допускает `1`–`2` реплики с целевой утилизацией `50` процентов.
  - HPA `board` имеет `ScalingActive=True`, сообщает текущее и желаемое число реплик `2` с утилизацией выше `50` процентов, обе реплики готовы; живые метрики Pod показывают CPU в милликор. Существующий HPA нацелен на заданный сервер; неизменённый обработчик фиксирует новые завершения во время наблюдения.
  - Из Deployment `client` адрес `http://board:8080` возвращает `north-112`.

  Sampling может занять три минуты. Проверки наблюдают текущую политику, готовые Pod и прогресс обработки, а не историю правок, непрерывную доступность или production performance SLO.
debrief: Scale target, знаменатель метрики и реальные входящие запросы — отдельные звенья. Ограниченная обработка
  запросов показывает demand вместо постоянного бесполезного CPU-цикла.
stages.0.brief: Мощность остаётся в пределах предоставленных бюджетов автоскейлинга и ресурсов.
hints.0.text: Для масштабирования нужны правильная цель, пригодные метрики utilization и входящая работа. Один CPU-бюджет
  не создаёт demand.
hints.1.text: |-
  Изучите target references и условия HPA, ресурсную модель обслуживающего контейнера, текущие метрики и заданный интерфейс обработки.

  ```sh
  cat autoscaling-contract.json
  kubectl get hpa,deployments,service -o yaml
  kubectl describe hpa board
  kubectl get configmap work-handler -o yaml
  kubectl top pods -l app=board
  ```
hints.2.text: |-
  Проверьте, что `ScalingActive` равен `True`, текущее и желаемое число реплик равно двум, а утилизация CPU превышает целевые `50` процентов. Оба Pod этого Deployment должны быть готовы и показывать метрики CPU в милликоррах. Для тех же Pod сравните два замера счётчиков завершённых запросов: каждый счётчик должен остаться прежним или вырасти, а их сумма должна увеличиться. Запрос из Deployment `client` к корневому пути по-прежнему должен вернуть `north-112`.

  ```sh
  kubectl get hpa board -o yaml
  kubectl get deployment board
  kubectl top pods -l app=board
  pods=$(kubectl get deployments,replicasets,pods -o json | jq -r '
    def owned($kind; $uids): any(.metadata.ownerReferences[]?;
      .controller == true and .kind == $kind and (.uid as $uid | $uids | index($uid) != null));
    .items as $items | ($items[] | select(.kind == "Deployment" and .metadata.name == "board")) as $board
    | [$items[] | select(.kind == "ReplicaSet" and owned("Deployment"; [$board.metadata.uid])) | .metadata.uid] as $rs
    | $items[] | select(.kind == "Pod" and owned("ReplicaSet"; $rs) and .metadata.deletionTimestamp == null
      and .status.phase != "Failed" and .status.phase != "Succeeded") | .metadata.name')
  sample() {
    while IFS= read -r pod; do
      printf '%s ' "$pod"
      kubectl exec "$pod" -c worker -- sh -c 'if test -f /tmp/work-completions; then wc -l < /tmp/work-completions; else echo 0; fi'
    done <<< "$pods"
  }
  test -n "$pods" && sample && sleep 1 && sample
  kubectl exec deployment/client -c worker -- wget -qO- -T 3 http://board:8080
  ```
phrases.0: Я проверил цепочку метрик до изменения HPA.
phrases.1: Я задал осмысленный CPU request.
phrases.2: Я проверил реальные метрики и ограниченное масштабирование.
questions.0.points.0: Потребление как процент CPU request.
questions.0.points.1: Отсутствующие или нулевые requests мешают вычислению.
questions.0.prompt: Что означает CPU utilization для HPA?
questions.1.points.0: У сбора метрик и reconciliation разные интервалы.
questions.1.points.1: Readiness и недостающие метрики тоже влияют на решение.
questions.1.prompt: Почему масштабирование может занять несколько опросов?
stages.0.objectives.0.text: Worker `board` запрашивает `100m` CPU и сохраняет лимит CPU `200m`. Сохраните идентичности
  исходных нагрузок и ConfigMap обработчика, а также заданные образы.
stages.0.objectives.1.text: HPA `board` допускает `1`–`2` реплики с целевой утилизацией `50` процентов.
stages.0.objectives.2.text: HPA `board` имеет `ScalingActive=True`, сообщает текущее и желаемое число реплик `2`
  с утилизацией выше `50` процентов, обе реплики готовы; живые метрики Pod показывают CPU в милликор. Существующий
  HPA нацелен на заданный сервер; неизменённый обработчик фиксирует новые завершения во время наблюдения.
stages.0.objectives.3.text: Из Deployment `client` адрес `http://board:8080` возвращает `north-112`.
diagnostics.request: Запрос CPU у worker мог отсутствовать или отличаться от 100m, меняя базу расчёта утилизации. Проверьте фактическое значение CPU у worker. [Причина и проверка](guides#guide=autoscaling-gateway&section=q112-board-cpu-request)
diagnostics.limit: У worker мог отсутствовать лимит CPU либо быть другое значение. Проверьте действующий лимит и сравните с 200m. [Причина и проверка](guides#guide=autoscaling-gateway&section=q112-board-cpu-limit)
diagnostics.minimum: HPA мог потерять нижнюю границу масштабирования. Проверьте minReplicas и сохраните одну реплику. [Причина и проверка](guides#guide=autoscaling-gateway&section=q112-hpa-minimum-replicas)
diagnostics.maximum: HPA может не масштабироваться до двух реплик либо превышать допустимый максимум. Проверьте maxReplicas и сохраните значение два. [Причина и проверка](guides#guide=autoscaling-gateway&section=q112-hpa-maximum-replicas)
diagnostics.target: Подходящие CPU-метрики могли отсутствовать, использовать другой тип цели или давать другой эффективный порог. Проверьте, что у каждой подходящей цели тип Utilization и положительное значение. Наименьшее из этих значений должно быть ровно 50 процентов. [Причина и проверка](guides#guide=autoscaling-gateway&section=q112-hpa-cpu-target)
diagnostics.ready: HPA мог запросить больше мощности, пока один Pod board ещё не готов. Проверьте события Pod и дождитесь двух готовых реплик в статусе Deployment. [Причина и проверка](guides#guide=autoscaling-gateway&section=q112-board-ready-replica-count)
diagnostics.current: Контроллер мог ещё не увидеть две реплики либо следить за другой нагрузкой. Сравните currentReplicas со связанным Deployment. [Причина и проверка](guides#guide=autoscaling-gateway&section=q112-hpa-current-replica-count)
diagnostics.desired: Контроллер может по-прежнему рекомендовать одну реплику из-за низкой нагрузки CPU или отсутствия метрики. Проверьте желаемое число после устойчивой нагрузки через предоставленный client. [Причина и проверка](guides#guide=autoscaling-gateway&section=q112-hpa-desired-replica-count)
diagnostics.metric: Утилизация CPU могла отсутствовать или не превышать 50 процентов. Проверьте текущую метрику CPU ресурса или контейнера worker при устойчивой нагрузке через выданный обработчик. [Причина и проверка](guides#guide=autoscaling-gateway&section=q112-hpa-observed-cpu-utilization)
diagnostics.active: Автоскейлер мог не получить метрики или не найти цель масштабирования. Проверьте reason и message у ScalingActive и дождитесь True. [Причина и проверка](guides#guide=autoscaling-gateway&section=q112-hpa-scaling-active)
diagnostics.top: API метрик мог ещё не отдавать CPU в millicores для текущих Pod board. Проверьте живые метрики перед оценкой масштабирования. [Причина и проверка](guides#guide=autoscaling-gateway&section=q112-board-metrics-availability)
diagnostics.http: Масштабирование может быть верным, пока Service отдаёт старый ответ или не имеет доступного endpoint. Запросите board из client и сравните тело с north-112. [Причина и проверка](guides#guide=autoscaling-gateway&section=q112-board-live-workload-response)
diagnostics.load_identity: Выданные Deployment board или client могли пересоздать под прежним именем. Сравните оба UID с зафиксированными и правьте существующие объекты. [Причина и проверка](guides#guide=autoscaling-gateway&section=q112-preserved-load-deployments)
diagnostics.load_implementation: Мог измениться выданный образ или ConfigMap обработчика, либо текущий worker использует другие байты. Сверьте исходные образы, UID ConfigMap, хэш содержимого и файл обработчика в контейнере. [Причина и проверка](guides#guide=autoscaling-gateway&section=q112-preserved-load-handler)
diagnostics.load_target: HPA могли пересоздать, либо он масштабирует другой объект. Сравните UID с исходным и проверьте, что scaleTargetRef указывает на apps/v1 Deployment board. [Причина и проверка](guides#guide=autoscaling-gateway&section=q112-hpa-preserved-scale-target)
diagnostics.load_workers: У сохранённого Deployment board могло не быть двух текущих Pod с готовыми работающими worker на выданном образе. После масштабирования проверьте идентификатор, желаемые реплики и текущий worker в каждом Pod. [Причина и проверка](guides#guide=autoscaling-gateway&section=q112-current-serving-workers)
diagnostics.load_progress: Выданный обработчик мог перестать завершать запросы при правильном числе реплик. Проверьте счётчик каждого текущего worker между наблюдениями. Счётчики не должны уменьшаться, а общий прирост должен быть положительным. [Причина и проверка](guides#guide=autoscaling-gateway&section=q112-handler-completion-progress)
diagnostics.probe_0_0: Проверка входов может остановиться до определения ошибки ресурса или сохранённой реализации. Проверьте инструменты и доступ к выданным Deployment и входам обработчика. [Причина и проверка](guides#guide=autoscaling-gateway&section=q112-autoscaling-input-observer)
diagnostics.probe_0_2: Проверка масштабирования может остановиться без конкретного условия при ошибке процесса или исходных данных. Проверьте инструменты и доступ к HPA и текущей нагрузке. [Причина и проверка](guides#guide=autoscaling-gateway&section=q112-autoscaling-demand-observer)
