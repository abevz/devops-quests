  исходных нагрузок и ConfigMap обработчика, а также заданные образы.
stages.0.objectives.1.text: HPA `board` допускает `1`–`2` реплики с целевой утилизацией `50` процентов.
stages.0.objectives.2.text: HPA `board` имеет `ScalingActive=True`, сообщает текущее и желаемое число реплик `2`
  с утилизацией выше `50` процентов, обе реплики готовы; живые метрики Pod показывают CPU в милликор. Существующий
  HPA нацелен на заданный сервер; неизменённый обработчик фиксирует новые завершения во время наблюдения.
stages.0.objectives.3.text: Из Deployment `client` адрес `http://board:8080` возвращает `north-112`.
diagnostics.probe_0_0: Текущие входы не подтверждают это условие; изучите состояние живых объектов и заданный контракт.
diagnostics.load_identity: Изменена исходная нагрузка, управляющая идентичность или заданный образ; сохраните предоставленные
  компоненты.
diagnostics.load_implementation: Сохраните заданные образы и байты обработчика в ConfigMap и текущих файлах приложения.
diagnostics.load_target: Исходный HPA должен ссылаться на заданный Deployment; правильный utilization target сам
  по себе не выбирает нагрузку.
diagnostics.load_workers: Два текущих готовых Pod приложения должны принадлежать сохранённому Deployment сервера
  и использовать заданный образ.
diagnostics.load_progress: Число реальных завершений запросов должно расти во время наблюдения; готовый сервер или
  простаивающие реплики не доказывают demand.
diagnostics.probe_0_2: Текущие входы не подтверждают это условие; изучите состояние живых объектов и заданный контракт.
