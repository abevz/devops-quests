title: Horizontaler Pod Autoscaler
brief: 'Der private metrics-server läuft, aber ein CPU-begrenzter Worker hat einen CPU-Request von null, sodass sein HPA die
  Auslastung nicht berechnen kann. Setze den Worker-Request auf 100m und behalte das Limit 200m sowie den HPA-Bereich 1–2
  mit 50% CPU-Ziel bei. Beobachte echte Metriken und die Skalierung durch den Controller; Replikate nur manuell einzustellen
  reicht nicht. Metrik-Abtastung und Abgleich können bis zu drei Minuten dauern. TLS-Lockerungen gehören nur zu diesem vergänglichen
  kind-Adapter, nicht zu einer Produktionsanleitung.


  Questdateien in `~/quest` (einige erscheinen in späteren Phasen): `board.json`, `service.json`, `hpa.json`, `client.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien, vorinstallierte Bilder
  und private Dienste. Ändern Sie nur diese Bucht.


  Die Prüfungen verlangen beim ersten Board-Container CPU-Request `100m`, Limit `200m`, zwei bereite Replikate, HPA-Minimum
  1 und Maximum 2, ersten Utilization-Zielwert 50, aktuelle und gewünschte Replikate 2, eine aktuelle Ressourcen-Auslastung
  über 50 und ScalingActive=True. `kubectl top pods -l app=board` muss einen CPU-Wert in Millicores zeigen und deployment/client
  von `board:8080` `north-112` erhalten. Die Prüfungen kontrollieren weder beim ersten Ziel noch bei der aktuellen Metrik,
  ob sie CPU betreffen; der aktuelle Zustand beweist nicht die Ursache der Skalierung.'
debrief: Ein funktionierender metrics API und ein gültiger requests sind separate Voraussetzungen für die automatische Skalierung
  von CPU utilization.
stages.0.brief: CPU-Budget, bereite Replikate, HPA-Einstellungen und -Status, Top-Ausgabe und Board-Antwort entsprechen der
  Beschreibung.
stages.0.objectives.0.text: CPU-Budget, bereite Replikate, HPA-Einstellungen und -Status, Top-Ausgabe und Board-Antwort entsprechen
  der Beschreibung.
hints.0.text: Utilization dividiert beobachtetes CPU durch die Ressourcenanforderung.
hints.1.text: Eine Nullanforderung definiert keinen nützlichen utilization-Nenner.
hints.2.text: Reparieren Sie die Anforderung, dann inspect currentMetrics und ScalingActive, während Sie auf die Skalierung
  warten.
phrases.0: Ich habe die Metrik-Pipeline überprüft, bevor ich HPA geändert habe.
phrases.1: Ich habe eine aussagekräftige CPU-Anfrage gestellt.
phrases.2: Ich habe die beobachteten Metriken und die begrenzte Skalierung überprüft.
questions.0.points.0: Nutzung als Prozentsatz der CPU-Anfrage.
questions.0.points.1: Fehlende oder Null requests verhindern diese Berechnung.
questions.0.prompt: Was bedeutet CPU utilization für HPA?
questions.1.points.0: Die Metrikerfassung und der Controller reconciliation verfügen über separate Intervalle.
questions.1.points.1: Readiness und fehlende Metriken wirken sich auch auf Entscheidungen aus.
questions.1.prompt: Warum kann die Skalierung mehr als eine Umfrage erfordern?
diagnostics.request: Der CPU-Request des ersten Board-Containers muss 100m sein.
diagnostics.limit: Das CPU-Limit des ersten Board-Containers muss 200m sein.
diagnostics.ready: Board muss zwei bereite Replikate haben.
diagnostics.minimum: HPA minReplicas muss 1 sein.
diagnostics.maximum: HPA maxReplicas muss 2 sein.
diagnostics.target: Der erste HPA-Utilization-Zielwert muss 50 sein.
diagnostics.current: HPA currentReplicas muss 2 sein.
diagnostics.desired: HPA desiredReplicas muss 2 sein.
diagnostics.metric: Eine aktuelle HPA-Ressourcenmetrik muss eine Auslastung über 50 haben.
diagnostics.active: HPA ScalingActive muss True sein.
diagnostics.top: kubectl top pods muss einen CPU-Wert in Millicores zeigen.
diagnostics.http: board:8080 muss north-112 liefern.
