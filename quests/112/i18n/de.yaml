title: Horizontaler Pod Autoscaler
brief: 'Der private metrics-server wird ausgeführt, aber ein begrenzter CPU worker hat eine CPU-Anfrage
  von Null, sodass sein HPA utilization nicht berechnen kann. Setzen Sie die Anfrage worker auf 100m,
  behalten Sie den 200m limit und den HPA-Bereich 1–2 mit einem 50 %-Ziel CPU bei. Beobachten Sie reale
  Kennzahlen und Controller-Skalierung; Die manuelle Einstellung von replicas reicht nicht aus. Die Probenahme
  und reconciliation kann bis zu drei Minuten dauern. TLS-Entspannungen gehören nur zu diesem Einweg-kind-Adapter,
  nicht zu einem Produktionsrezept.


  Questdateien in `~/quest` (einige erscheinen in späteren Phasen): `board.json`, `service.json`, `hpa.json`,
  `client.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: Echte CPU-Metriken steuern zwei fertige replicas mit der Anforderung 100m, limit
  200m und das ursprünglich begrenzte HPA-Ziel an.'
debrief: Ein funktionierender metrics API und ein gültiger requests sind separate Voraussetzungen für
  die automatische Skalierung von CPU utilization.
stages.0.brief: 'Erfolgskriterien: Echte CPU-Metriken führen zu zwei fertigen Replikaten mit der Anforderung
  100m, limit 200m und dem ursprünglich begrenzten HPA-Ziel.'
stages.0.objectives.0.text: Echte CPU-Metriken steuern zwei fertige Replikate mit der Anforderung 100m,
  limit 200m und dem ursprünglich begrenzten HPA-Ziel.
hints.0.text: Utilization dividiert beobachtetes CPU durch die Ressourcenanforderung.
hints.1.text: Eine Nullanforderung definiert keinen nützlichen utilization-Nenner.
hints.2.text: Reparieren Sie die Anforderung, dann inspect currentMetrics und ScalingActive, während Sie
  auf die Skalierung warten.
phrases.0: Ich habe die Metrik-Pipeline überprüft, bevor ich HPA geändert habe.
phrases.1: Ich habe eine aussagekräftige CPU-Anfrage gestellt.
phrases.2: Ich habe die beobachteten Metriken und die begrenzte Skalierung überprüft.
questions.0.points.0: Nutzung als Prozentsatz der CPU-Anfrage.
questions.0.points.1: Fehlende oder Null requests verhindern diese Berechnung.
questions.0.prompt: Was bedeutet CPU utilization für HPA?
questions.1.points.0: Die Metrikerfassung und der Controller reconciliation verfügen über separate Intervalle.
questions.1.points.1: Readiness und fehlende Metriken wirken sich auch auf Entscheidungen aus.
questions.1.prompt: Warum kann die Skalierung mehr als eine Umfrage erfordern?
