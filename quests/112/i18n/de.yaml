title: Horizontaler Pod Autoscaler
brief: |-
  Der Dienst erreicht seine erforderliche automatisch skalierte Kapazität nicht. Stelle Ressourcenmodell und tatsächliche Anfragenlast wieder her.

  Arbeite auf der Workstation in `~/quest` mit den vorgegebenen Verbindungs-/Ergebniseingaben: `autoscaling-contract.json`. Die Workload-Definitionen stehen in aktuellen Clusterobjekten.

  **Anforderungen:**

  - Der Worker `board` fordert `100m` CPU an und behält sein CPU-Limit `200m`. Erhalte Identitäten der ursprünglichen Workloads und der Verarbeitungs-ConfigMap sowie ihre vorgegebenen Images.
  - HPA `board` erlaubt `1`–`2` Replikate mit einer Zielauslastung von `50` Prozent.
  - HPA `board` ist `ScalingActive=True`, meldet aktuell und gewünscht `2` Replikate bei Auslastung über `50` Prozent, beide sind bereit; Live-Pod-Metriken zeigen CPU in Millicores. Der vorhandene HPA zielt auf den vorgegebenen Server; der unveränderte Handler zeichnet während der Beobachtung neue Abschlüsse auf.
  - Von Deployment `client` liefert `http://board:8080` den Wert `north-112`.

  Messung kann drei Minuten dauern. Prüfungen beobachten aktuelle Richtlinie, bereite Pods und Verarbeitungsfortschritt, keinen Änderungsverlauf, unterbrechungsfreien Betrieb oder Produktions-SLO.
debrief: Skalierungsziel, Metriknenner und tatsächliche Anfragen sind getrennte Glieder. Begrenzte Anfragenverarbeitung
  zeigt wirkliche Nachfrage statt einer permanenten nutzlosen CPU-Schleife.
stages.0.brief: Die Kapazität bleibt innerhalb der bereitgestellten Autoscaling- und Ressourcenbudgets.
hints.0.text: Skalierung benötigt vorgesehenes Ziel, brauchbare Auslastungsmetriken und eingehende Arbeit. Ein CPU-Budget
  erzeugt allein keine Nachfrage.
hints.1.text: |-
  Prüfe Zielreferenzen und HPA-Bedingungen, Ressourcenmodell des bedienenden Containers, aktuelle Metriken und die vorgegebene Verarbeitungsschnittstelle.

  ```sh
  cat autoscaling-contract.json
  kubectl get hpa,deployments,service -o yaml
  kubectl describe hpa board
  kubectl get configmap work-handler -o yaml
  kubectl top pods -l app=board
  ```
hints.2.text: |-
  Prüfe aktuelle und gewünschte Anzahl zwei, CPU-Auslastung über dem Ziel, zwei bereite Server-Pods und fortschreitende Abschlusszähler. Die Root-Antwort bleibt gleich.

  ```sh
  kubectl get hpa board
  kubectl get pods -l app=board
  kubectl top pods -l app=board
  kubectl exec deployment/board -c worker -- wc -l /tmp/work-completions
  ```
phrases.0: Ich habe die Metrik-Pipeline überprüft, bevor ich HPA geändert habe.
phrases.1: Ich habe eine aussagekräftige CPU-Anfrage gestellt.
phrases.2: Ich habe die beobachteten Metriken und die begrenzte Skalierung überprüft.
questions.0.points.0: Nutzung als Prozentsatz der CPU-Anfrage.
questions.0.points.1: Fehlende oder Null requests verhindern diese Berechnung.
questions.0.prompt: Was bedeutet CPU utilization für HPA?
questions.1.points.0: Die Metrikerfassung und der Controller reconciliation verfügen über separate Intervalle.
questions.1.points.1: Readiness und fehlende Metriken wirken sich auch auf Entscheidungen aus.
questions.1.prompt: Warum kann die Skalierung mehr als eine Umfrage erfordern?
stages.0.objectives.0.text: Der Worker `board` fordert `100m` CPU an und behält sein CPU-Limit `200m`. Erhalte Identitäten
  der ursprünglichen Workloads und der Verarbeitungs-ConfigMap sowie ihre vorgegebenen Images.
stages.0.objectives.1.text: HPA `board` erlaubt `1`–`2` Replikate mit einer Zielauslastung von `50` Prozent.
stages.0.objectives.2.text: HPA `board` ist `ScalingActive=True`, meldet aktuell und gewünscht `2` Replikate bei
  Auslastung über `50` Prozent, beide sind bereit; Live-Pod-Metriken zeigen CPU in Millicores. Der vorhandene HPA
  zielt auf den vorgegebenen Server; der unveränderte Handler zeichnet während der Beobachtung neue Abschlüsse auf.
stages.0.objectives.3.text: Von Deployment `client` liefert `http://board:8080` den Wert `north-112`.
diagnostics.request: Der CPU-Request des Worker-Containers fehlt möglicherweise oder weicht von 100m ab und verändert die Bezugsgröße der Auslastung. Prüfen Sie die wirksame CPU-Menge beim Worker. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q112-board-cpu-request)
diagnostics.limit: Beim Worker fehlt möglicherweise das CPU-Limit oder es hat einen anderen Wert. Prüfen Sie das wirksame Limit und vergleichen Sie mit 200m. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q112-board-cpu-limit)
diagnostics.minimum: Die Untergrenze des HPA fehlt möglicherweise. Prüfen Sie minReplicas und belassen Sie den Wert bei eins. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q112-hpa-minimum-replicas)
diagnostics.maximum: Der HPA erreicht möglicherweise keine zwei Repliken oder überschreitet die Obergrenze. Prüfen Sie maxReplicas und belassen Sie den Wert bei zwei. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q112-hpa-maximum-replicas)
diagnostics.target: Passende CPU-Metriken fehlen möglicherweise, verwenden einen anderen Zieltyp oder ergeben eine andere Schwelle. Prüfen Sie, ob jedes passende Ziel den Typ Utilization und einen positiven Wert verwendet. Der kleinste dieser Werte muss genau 50 Prozent betragen. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q112-hpa-cpu-target)
diagnostics.ready: Der HPA fordert möglicherweise mehr Kapazität an, während ein board-Pod noch nicht bereit ist. Prüfen Sie Ereignisse und warten Sie auf zwei bereite Repliken im Deployment-Status. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q112-board-ready-replica-count)
diagnostics.current: Der Controller sieht möglicherweise noch keine zwei Repliken oder verweist auf eine andere Arbeitslast. Vergleichen Sie die gemeldete Anzahl mit dem verbundenen Deployment. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q112-hpa-current-replica-count)
diagnostics.desired: Der Controller empfiehlt möglicherweise wegen geringer CPU-Nachfrage oder einer fehlenden Metrik noch eine Replik. Prüfen Sie die gewünschte Anzahl bei anhaltender Last über client. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q112-hpa-desired-replica-count)
diagnostics.metric: Die CPU-Auslastung fehlt möglicherweise oder liegt bei höchstens 50 Prozent. Prüfen Sie die aktuelle CPU-Metrik der Ressource oder des Worker-Containers bei anhaltender Last über den bereitgestellten Handler. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q112-hpa-observed-cpu-utilization)
diagnostics.active: Der Autoscaler hat möglicherweise keine nutzbaren Metriken oder findet das Ziel nicht. Prüfen Sie Grund und Meldung bei ScalingActive und bestätigen Sie True. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q112-hpa-scaling-active)
diagnostics.top: Die Metrik-API liefert möglicherweise noch keine Millicore-Daten für aktuelle board-Pods. Prüfen Sie die Metriken vor der Bewertung der Skalierung. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q112-board-metrics-availability)
diagnostics.http: Die Skalierung kann stimmen, während der Service eine alte Antwort liefert oder kein Endpoint erreichbar ist. Rufen Sie board aus client auf und vergleichen Sie mit north-112. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q112-board-live-workload-response)
diagnostics.load_identity: Das bereitgestellte Deployment board oder client wurde möglicherweise unter gleichem Namen neu erstellt. Vergleichen Sie beide UIDs mit den festgehaltenen Identitäten und korrigieren Sie die bestehenden Objekte. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q112-preserved-load-deployments)
diagnostics.load_implementation: Das gelieferte Image oder die Handler-ConfigMap wurde möglicherweise verändert, oder ein aktueller Worker nutzt andere Handler-Bytes. Vergleichen Sie Images, ConfigMap-UID, Inhaltshash und die laufende Handler-Datei. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q112-preserved-load-handler)
diagnostics.load_target: Der HPA wurde möglicherweise neu erstellt oder skaliert das falsche Objekt. Vergleichen Sie die UID mit dem Original und prüfen Sie scaleTargetRef auf apps/v1 Deployment board. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q112-hpa-preserved-scale-target)
diagnostics.load_workers: Beim erhaltenen Deployment board fehlen möglicherweise zwei aktuelle zugehörige Pods mit bereitem laufendem Worker auf dem gelieferten Image. Prüfen Sie Identität, gewünschte Repliken und den Worker jedes Pods nach der Skalierung. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q112-current-serving-workers)
diagnostics.load_progress: Der gelieferte Handler schließt möglicherweise trotz korrekter Replikazahlen keine Anfragen ab. Prüfen Sie die Abschlusszähler jedes aktuellen Worker-Containers über mehrere Beobachtungen. Die Zähler dürfen nicht fallen und der Gesamtfortschritt muss positiv sein. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q112-handler-completion-progress)
diagnostics.probe_0_0: Die Eingabeprüfung kann vor der Meldung einer Ressourcen- oder Implementierungsabweichung abbrechen. Prüfen Sie Werkzeuge und Zugriff auf die gelieferten Deployments und Handler-Eingaben. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q112-autoscaling-input-observer)
diagnostics.probe_0_2: Die Skalierungsprüfung kann vor der Meldung einer Bedingung abbrechen, wenn Prozess oder festgehaltene Eingaben fehlschlagen. Prüfen Sie Werkzeuge und Zugriff auf HPA und aktuelle Arbeitslast. [Ursache und Prüfung](guides#guide=autoscaling-gateway&section=q112-autoscaling-demand-observer)
