title: Horizontaler Pod Autoscaler
brief: |-
  Der Board-Workload erreicht die erforderliche Kapazität nicht. Stellen Sie beobachtbare automatische Skalierung im vereinbarten Ressourcenbudget her.

  Arbeiten Sie auf der Workstation in `~/quest` mit den bereitgestellten Dateien:
  - `board.yaml`, `service.yaml`, `hpa.yaml`, `client.yaml`.

  **Requirements:**

  - Halten Sie das vereinbarte Ressourcenbudget ein:
    - Der Worker `board` fordert `100m` CPU an und behält sein CPU-Limit `200m`.
    - HPA `board` erlaubt `1`–`2` Replikate mit einer Zielauslastung von `50` Prozent.
  - HPA `board` ist `ScalingActive=True`, meldet aktuell und gewünscht `2` Replikate bei Auslastung über `50` Prozent, beide sind bereit; Live-Pod-Metriken zeigen CPU in Millicores.
  - Von Deployment `client` liefert `http://board:8080` den Wert `north-112`.

  Messung und Abgleich können drei Minuten dauern; die Prüfungen beweisen weder CPU als erstes Ziel oder aktuelle Metrik noch die Ursache der Skalierung. TLS-Lockerungen gelten nur für diesen kurzlebigen kind-Adapter.
debrief: Ein funktionierender metrics API und ein gültiger requests sind separate Voraussetzungen für
  die automatische Skalierung von CPU utilization.
stages.0.brief: Die Kapazität bleibt innerhalb der bereitgestellten Autoscaling- und Ressourcenbudgets.
hints.0.text: Utilization dividiert beobachtetes CPU durch die Ressourcenanforderung.
hints.1.text: |-
  Eine Nullanforderung definiert keinen nützlichen utilization-Nenner.

  Prüfen Sie die bereitgestellten Eingaben und laufenden Beobachtungen:

  ```sh
  kubectl get deployment board -o yaml
    kubectl get hpa board -o yaml
  ```
hints.2.text: |-
  Reparieren Sie die Anforderung, dann inspect currentMetrics und ScalingActive, während Sie auf die Skalierung warten.

  Prüfen Sie das Ergebnis in `~/quest` auf der Workstation:

  - `kubectl top pods -l app=board --no-headers` — Live-CPU-Metriken enthalten Millicore-Werte.

  - `kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080` — Der Verbraucher erhält `north-112`.
phrases.0: Ich habe die Metrik-Pipeline überprüft, bevor ich HPA geändert habe.
phrases.1: Ich habe eine aussagekräftige CPU-Anfrage gestellt.
phrases.2: Ich habe die beobachteten Metriken und die begrenzte Skalierung überprüft.
questions.0.points.0: Nutzung als Prozentsatz der CPU-Anfrage.
questions.0.points.1: Fehlende oder Null requests verhindern diese Berechnung.
questions.0.prompt: Was bedeutet CPU utilization für HPA?
questions.1.points.0: Die Metrikerfassung und der Controller reconciliation verfügen über separate Intervalle.
questions.1.points.1: Readiness und fehlende Metriken wirken sich auch auf Entscheidungen aus.
questions.1.prompt: Warum kann die Skalierung mehr als eine Umfrage erfordern?
