title: Horizontaler Pod Autoscaler
brief: "Der Board-Workload erreicht die erforderliche Kapazität nicht. Stellen Sie beobachtbare automatische Skalierung\
  \ im vereinbarten Ressourcenbudget her.\n\nArbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte Dateien:\
  \ `board.json`, `service.json`, `hpa.json`, `client.json`.\n\n**Requirements:**\n\n- Der Worker `board` fordert\
  \ `100m` CPU an und behält sein CPU-Limit `200m`.\n- HPA `board` erlaubt `1`–`2` Replikate mit einer Zielauslastung\
  \ von `50` Prozent.\n- HPA `board` ist `ScalingActive=True`, meldet aktuell und gewünscht `2` Replikate bei Auslastung\
  \ über `50` Prozent, beide sind bereit; Live-Pod-Metriken zeigen CPU in Millicores.\n- Von Deployment `client`\
  \ liefert `http://board:8080` den Wert `north-112`.\n\n**Verify yourself before Check & finish:** Führen Sie diese\
  \ Beobachtungsbefehle aus `~/quest` auf der Workstation aus.\n\n- Einstellungen, Identität und Status entsprechen\
  \ den Anforderungen.\n\n  ```sh\n  kubectl get deployment board -o yaml\n  kubectl get hpa board -o yaml\n  ```\n\
  \n- `kubectl top pods -l app=board --no-headers` — Live-CPU-Metriken enthalten Millicore-Werte.\n\n- `kubectl\
  \ exec deployment/client -- wget -qO- -T 3 http://board:8080` — Der Verbraucher erhält `north-112`.\n\nMessung\
  \ und Abgleich können drei Minuten dauern; die Prüfungen beweisen weder CPU als erstes Ziel oder aktuelle Metrik\
  \ noch die Ursache der Skalierung. TLS-Lockerungen gelten nur für diesen kurzlebigen kind-Adapter."
debrief: Ein funktionierender metrics API und ein gültiger requests sind separate Voraussetzungen für die automatische
  Skalierung von CPU utilization.
stages.0.brief: Der aktive Autoscaler muss zwei bereite Board-Replikate bereitstellen.
hints.0.text: Utilization dividiert beobachtetes CPU durch die Ressourcenanforderung.
hints.1.text: Eine Nullanforderung definiert keinen nützlichen utilization-Nenner.
hints.2.text: Reparieren Sie die Anforderung, dann inspect currentMetrics und ScalingActive, während Sie auf die
  Skalierung warten.
phrases.0: Ich habe die Metrik-Pipeline überprüft, bevor ich HPA geändert habe.
phrases.1: Ich habe eine aussagekräftige CPU-Anfrage gestellt.
phrases.2: Ich habe die beobachteten Metriken und die begrenzte Skalierung überprüft.
questions.0.points.0: Nutzung als Prozentsatz der CPU-Anfrage.
questions.0.points.1: Fehlende oder Null requests verhindern diese Berechnung.
questions.0.prompt: Was bedeutet CPU utilization für HPA?
questions.1.points.0: Die Metrikerfassung und der Controller reconciliation verfügen über separate Intervalle.
questions.1.points.1: Readiness und fehlende Metriken wirken sich auch auf Entscheidungen aus.
questions.1.prompt: Warum kann die Skalierung mehr als eine Umfrage erfordern?
diagnostics.request: Der CPU-Request des ersten Board-Containers muss 100m sein.
diagnostics.limit: Das CPU-Limit des ersten Board-Containers muss 200m sein.
diagnostics.ready: Board muss zwei bereite Replikate haben.
diagnostics.minimum: HPA minReplicas muss 1 sein.
diagnostics.maximum: HPA maxReplicas muss 2 sein.
diagnostics.target: Der erste HPA-Utilization-Zielwert muss 50 sein.
diagnostics.current: HPA currentReplicas muss 2 sein.
diagnostics.desired: HPA desiredReplicas muss 2 sein.
diagnostics.metric: Eine aktuelle HPA-Ressourcenmetrik muss eine Auslastung über 50 haben.
diagnostics.active: HPA ScalingActive muss True sein.
diagnostics.top: kubectl top pods muss einen CPU-Wert in Millicores zeigen.
diagnostics.http: board:8080 muss north-112 liefern.
