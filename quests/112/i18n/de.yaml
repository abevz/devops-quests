diagnostics.probe_0_0: Aktuelle Eingaben konnten diese Bedingung nicht bestätigen; prüfe Objektstatus und Vertrag.
diagnostics.load_identity: Ein ursprünglicher Workload, eine Kontrollidentität oder ein vorgegebenes Image wurde
  geändert; erhalte die Komponenten.
diagnostics.load_implementation: Erhalte vorgegebene Images und Handler-Bytes in ConfigMap und aktuellen Anwendungsdateien.
diagnostics.load_target: Der ursprüngliche HPA muss auf das vorgesehene Deployment zielen; ein gültiges Auslastungsziel
  wählt keinen Workload.
diagnostics.load_workers: Zwei aktuelle bereite Anwendungs-Pods müssen dem erhaltenen Server-Deployment gehören
  und sein Image nutzen.
diagnostics.load_progress: Tatsächliche Anfrageabschlüsse müssen während der Beobachtung zunehmen; bereite oder
  untätige Repliken belegen keine Nachfrage.
