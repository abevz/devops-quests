title: Horizontal Pod Autoscaler
brief: 'The private metrics-server is running, but a bounded CPU worker has a zero CPU request, so its
  HPA cannot calculate utilization. Set the worker request to 100m, retain its 200m limit and the HPA
  range 1–2 with a 50% CPU target. Observe real metrics and controller scale-up; manually setting replicas
  is insufficient. Sampling and reconciliation can take up to three minutes. TLS relaxations belong only
  to this disposable kind adapter, not a production recipe.


  Quest files in `~/quest` (some appear in later stages): `board.json`, `service.json`, `hpa.json`, `client.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: Real CPU metrics drive two ready replicas with request 100m, limit 200m and
  the original bounded HPA target.'
debrief: A functioning metrics API and valid requests are separate prerequisites for CPU utilization autoscaling.
stages.0.brief: 'Real CPU metrics drive two ready replicas with request 100m, limit 200m and the original
