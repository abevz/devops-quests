title: Horizontal Pod Autoscaler
brief: |-
  The service is not reaching the required autoscaled capacity. Restore its resource model and actual request-processing demand.

  Work on the workstation in `~/quest` with the supplied connection/result inputs: `autoscaling-contract.json`. Existing cluster objects provide the workload definitions.

  **Requirements:**

  - The `board` worker requests `100m` CPU and retains its `200m` CPU limit. Retain the original workloads and processing ConfigMap identities and their supplied images.
  - HPA `board` permits `1`–`2` replicas with a target utilization of `50` percent.
  - HPA `board` is `ScalingActive=True`, reports current and desired counts of `2` with utilization above `50` percent, and both replicas are ready; live Pod metrics show CPU in millicores. The existing HPA targets the supplied server, and the unchanged supplied request handler records new completions during observation.
  - From Deployment `client`, `http://board:8080` returns `north-112`.

  Sampling may take three minutes. Checks observe current policy, ready Pods and processing progress, not editing history, uninterrupted service or a production performance SLO.
debrief: The scale target, metric denominator and real incoming work are separate links. A bounded request-processing
  workload exposes actual demand instead of a permanent idle CPU burner.
stages.0.brief: Capacity stays within the supplied autoscaling and resource budgets.
hints.0.text: Scaling requires the intended target, usable utilization metrics and incoming work. A CPU budget alone
  does not create demand.
hints.1.text: |-
  Inspect target references and HPA conditions, the resource model of the serving container, current metrics and the supplied processing interface.

  ```sh
  cat autoscaling-contract.json
  kubectl get hpa,deployments,service -o yaml
  kubectl describe hpa board
  kubectl get configmap work-handler -o yaml
  kubectl top pods -l app=board
  ```
hints.2.text: |-
  Verify current and desired counts of two, CPU utilization above the target, two ready serving Pods and advancing completion counters. The root response remains unchanged.

  ```sh
  kubectl get hpa board
  kubectl get pods -l app=board
  kubectl top pods -l app=board
  kubectl exec deployment/board -c worker -- wc -l /tmp/work-completions
  ```
phrases.0: I checked the metrics pipeline before changing the HPA.
phrases.1: I supplied a meaningful CPU request.
phrases.2: I verified observed metrics and bounded scale-up.
questions.0.points.0: Usage as a percentage of CPU request.
questions.0.points.1: Missing or zero requests prevent this calculation.
questions.0.prompt: What does CPU utilization mean to the HPA?
questions.1.points.0: Metrics collection and controller reconciliation have separate intervals.
questions.1.points.1: Readiness and missing metrics also affect decisions.
questions.1.prompt: Why can scaling take more than one poll?
stages.0.objectives.0.text: The `board` worker requests `100m` CPU and retains its `200m` CPU limit. Retain the
  original workloads and processing ConfigMap identities and their supplied images.
stages.0.objectives.1.text: HPA `board` permits `1`–`2` replicas with a target utilization of `50` percent.
stages.0.objectives.2.text: HPA `board` is `ScalingActive=True`, reports current and desired counts of `2` with
  utilization above `50` percent, and both replicas are ready; live Pod metrics show CPU in millicores. The existing
  HPA targets the supplied server, and the unchanged supplied request handler records new completions during observation.
stages.0.objectives.3.text: From Deployment `client`, `http://board:8080` returns `north-112`.
diagnostics.request: The worker CPU request may be missing or differ from 100m, changing the denominator for utilization. Inspect the effective CPU quantity on the named worker. [Cause and check](guides#guide=autoscaling-gateway&section=q112-board-cpu-request)
diagnostics.limit: The worker may have an absent or different CPU limit. Inspect its effective limit and compare it with 200m. [Cause and check](guides#guide=autoscaling-gateway&section=q112-board-cpu-limit)
diagnostics.minimum: The HPA may have lost its lower scaling bound. Check the actual minReplicas and keep it at one. [Cause and check](guides#guide=autoscaling-gateway&section=q112-hpa-minimum-replicas)
diagnostics.maximum: The HPA may be unable to scale to two replicas or may exceed the intended ceiling. Check maxReplicas and keep it at two. [Cause and check](guides#guide=autoscaling-gateway&section=q112-hpa-maximum-replicas)
diagnostics.target: The matching CPU metrics may be missing, use a different target type or set a lower or higher effective utilization. Check that every applicable CPU target uses positive Utilization and the smallest is 50 percent. [Cause and check](guides#guide=autoscaling-gateway&section=q112-hpa-cpu-target)
diagnostics.ready: The HPA may request more capacity while a board Pod is still unready. Inspect Pod events and wait for the Deployment status to show two ready replicas. [Cause and check](guides#guide=autoscaling-gateway&section=q112-board-ready-replica-count)
diagnostics.current: The controller may not yet observe two replicas or may target the wrong workload. Compare its reported current count with the linked Deployment. [Cause and check](guides#guide=autoscaling-gateway&section=q112-hpa-current-replica-count)
diagnostics.desired: The controller may still recommend one replica because real CPU demand is low or its metric is unavailable. Check the HPA’s desired count after sustaining load through the supplied client. [Cause and check](guides#guide=autoscaling-gateway&section=q112-hpa-desired-replica-count)
diagnostics.metric: CPU utilization may be absent or at most 50 percent. Inspect the current resource CPU metric or matching worker container metric after sending sustained work through the supplied handler. [Cause and check](guides#guide=autoscaling-gateway&section=q112-hpa-observed-cpu-utilization)
diagnostics.active: The autoscaler may lack usable metrics or be unable to resolve the target. Inspect the reason and message on ScalingActive and confirm it becomes True. [Cause and check](guides#guide=autoscaling-gateway&section=q112-hpa-scaling-active)
diagnostics.top: The metrics API may not yet return millicore observations for the current board Pods. Check the live metrics before interpreting the scaling response. [Cause and check](guides#guide=autoscaling-gateway&section=q112-board-metrics-availability)
diagnostics.http: Scaling status can be correct while the Service returns a stale response or has no reachable endpoint. Request board from client and compare the body with north-112. [Cause and check](guides#guide=autoscaling-gateway&section=q112-board-live-workload-response)
diagnostics.load_identity: The supplied board or client Deployment may have been recreated under its original name. Compare both live UIDs with the frozen identities and repair those objects in place. [Cause and check](guides#guide=autoscaling-gateway&section=q112-preserved-load-deployments)
diagnostics.load_implementation: The supplied workload image or the handler ConfigMap may have changed, or a current worker may run different handler bytes. Compare the original images, ConfigMap UID and content hash with the mounted handler. [Cause and check](guides#guide=autoscaling-gateway&section=q112-preserved-load-handler)
diagnostics.load_target: The HPA may have been recreated or may scale the wrong object. Compare its UID with the original and check that scaleTargetRef points to apps/v1 Deployment board. [Cause and check](guides#guide=autoscaling-gateway&section=q112-hpa-preserved-scale-target)
diagnostics.load_workers: The retained board Deployment may lack two current owned Pods with ready running workers using its supplied image. Check deployment identity, desired replicas and the current workers after scaling. [Cause and check](guides#guide=autoscaling-gateway&section=q112-current-serving-workers)
diagnostics.load_progress: The supplied handler may no longer finish requests even if replica counts look correct. Check each current worker’s completion counter across observations and look for nondecreasing counts with real aggregate progress. [Cause and check](guides#guide=autoscaling-gateway&section=q112-handler-completion-progress)
diagnostics.probe_0_0: The input observer may stop before it can classify a resource or preserved implementation failure. Check the workstation tools and access to the supplied Deployments and handler inputs. [Cause and check](guides#guide=autoscaling-gateway&section=q112-autoscaling-input-observer)
diagnostics.probe_0_2: The scaling observer may stop before naming a condition if the local process or frozen inputs fail. Check tooling and access to the HPA and current workload before retrying. [Cause and check](guides#guide=autoscaling-gateway&section=q112-autoscaling-demand-observer)
