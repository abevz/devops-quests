title: Horizontal Pod Autoscaler
brief: "The board workload is not reaching the required capacity. Restore observable autoscaling within the agreed\
  \ resource budget.\n\nWork in `~/quest` on the workstation. Supplied files: `board.json`, `service.json`, `hpa.json`,\
  \ `client.json`.\n\n**Requirements:**\n\n- The `board` worker requests `100m` CPU and retains its `200m` CPU limit.\n\
  - HPA `board` permits `1`–`2` replicas with a target utilization of `50` percent.\n- HPA `board` is `ScalingActive=True`,\
  \ reports current and desired counts of `2` with utilization above `50` percent, and both replicas are ready;\
  \ live Pod metrics show CPU in millicores.\n- From Deployment `client`, `http://board:8080` returns `north-112`.\n\
  \n**Verify yourself before Check & finish:** Run these observation commands from `~/quest` on the workstation.\n\
  \n- Settings, identity and status match Requirements.\n\n  ```sh\n  kubectl get deployment board -o yaml\n  kubectl\
  \ get hpa board -o yaml\n  ```\n\n- `kubectl top pods -l app=board --no-headers` — Live CPU metrics contain millicore\
  \ values.\n\n- `kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080` — The consumer receives `north-112`.\n\
  \nSampling and reconciliation may take three minutes; checks do not prove the first target or current metric is\
  \ CPU, nor which action caused scaling. TLS relaxations apply only to this disposable kind adapter."
debrief: A functioning metrics API and valid requests are separate prerequisites for CPU utilization autoscaling.
stages.0.brief: The active autoscaler must provide two ready board replicas.
hints.0.text: Utilization divides observed CPU by the resource request.
hints.1.text: A zero request does not define a useful utilization denominator.
hints.2.text: Repair the request, then inspect currentMetrics and ScalingActive while waiting for scale-up.
phrases.0: I checked the metrics pipeline before changing the HPA.
phrases.1: I supplied a meaningful CPU request.
phrases.2: I verified observed metrics and bounded scale-up.
questions.0.points.0: Usage as a percentage of CPU request.
questions.0.points.1: Missing or zero requests prevent this calculation.
questions.0.prompt: What does CPU utilization mean to the HPA?
questions.1.points.0: Metrics collection and controller reconciliation have separate intervals.
questions.1.points.1: Readiness and missing metrics also affect decisions.
questions.1.prompt: Why can scaling take more than one poll?
diagnostics.request: First board CPU request must equal 100m.
diagnostics.limit: First board CPU limit must equal 200m.
diagnostics.ready: Board must have two ready replicas.
diagnostics.minimum: HPA minReplicas must equal 1.
diagnostics.maximum: HPA maxReplicas must equal 2.
diagnostics.target: HPA first target utilization must equal 50.
diagnostics.current: HPA currentReplicas must equal 2.
diagnostics.desired: HPA desiredReplicas must equal 2.
diagnostics.metric: A current HPA resource metric must have utilization above 50.
diagnostics.active: HPA ScalingActive must be True.
diagnostics.top: kubectl top pods must show a CPU value in millicores.
diagnostics.http: board:8080 must return north-112.
stages.0.objectives.0.text: The `board` worker requests `100m` CPU and retains its `200m` CPU limit.
stages.0.objectives.1.text: HPA `board` permits `1`–`2` replicas with a target utilization of `50` percent.
stages.0.objectives.2.text: HPA `board` is `ScalingActive=True`, reports current and desired counts of `2` with
  utilization above `50` percent, and both replicas are ready; live Pod metrics show CPU in millicores.
stages.0.objectives.3.text: From Deployment `client`, `http://board:8080` returns `north-112`.
