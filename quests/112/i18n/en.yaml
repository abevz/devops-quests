title: Horizontal Pod Autoscaler
brief: 'The private metrics-server is running, but a bounded CPU worker has a zero CPU request, so its HPA cannot calculate
  utilization. Set the worker request to 100m, retain its 200m limit and the HPA range 1–2 with a 50% CPU target. Observe
  real metrics and controller scale-up; manually setting replicas is insufficient. Sampling and reconciliation can take up
  to three minutes. TLS relaxations belong only to this disposable kind adapter, not a production recipe.


  Quest files in `~/quest` (some appear in later stages): `board.json`, `service.json`, `hpa.json`, `client.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services. Change only this
  bay.


  The checks require the first board container CPU request `100m`, limit `200m`, two ready replicas, HPA minimum 1 and maximum
  2, first target utilization 50, current and desired replicas 2, a current resource utilization above 50 and ScalingActive=True.
  `kubectl top pods -l app=board` must display a CPU millicore value, and deployment/client must receive `north-112` from
  `board:8080`. The checks do not verify that either the first target or the current metric is CPU, and current state does
  not prove which action caused scaling.'
debrief: A functioning metrics API and valid requests are separate prerequisites for CPU utilization autoscaling.
stages.0.brief: The CPU budget, ready replicas, HPA settings and observed status, top output and board response match the
  brief.
stages.0.objectives.0.text: The CPU budget, ready replicas, HPA settings and observed status, top output and board response
  match the brief.
hints.0.text: Utilization divides observed CPU by the resource request.
hints.1.text: A zero request does not define a useful utilization denominator.
hints.2.text: Repair the request, then inspect currentMetrics and ScalingActive while waiting for scale-up.
phrases.0: I checked the metrics pipeline before changing the HPA.
phrases.1: I supplied a meaningful CPU request.
phrases.2: I verified observed metrics and bounded scale-up.
questions.0.points.0: Usage as a percentage of CPU request.
questions.0.points.1: Missing or zero requests prevent this calculation.
questions.0.prompt: What does CPU utilization mean to the HPA?
questions.1.points.0: Metrics collection and controller reconciliation have separate intervals.
questions.1.points.1: Readiness and missing metrics also affect decisions.
questions.1.prompt: Why can scaling take more than one poll?
diagnostics.request: First board CPU request must equal 100m.
diagnostics.limit: First board CPU limit must equal 200m.
diagnostics.ready: Board must have two ready replicas.
diagnostics.minimum: HPA minReplicas must equal 1.
diagnostics.maximum: HPA maxReplicas must equal 2.
diagnostics.target: HPA first target utilization must equal 50.
diagnostics.current: HPA currentReplicas must equal 2.
diagnostics.desired: HPA desiredReplicas must equal 2.
diagnostics.metric: A current HPA resource metric must have utilization above 50.
diagnostics.active: HPA ScalingActive must be True.
diagnostics.top: kubectl top pods must show a CPU value in millicores.
diagnostics.http: board:8080 must return north-112.
