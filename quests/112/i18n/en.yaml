stages.0.objectives.0.text: Real CPU metrics drive two ready replicas with request 100m, limit 200m and
  the original bounded HPA target.
hints.0.text: Utilization divides observed CPU by the resource request.
hints.1.text: A zero request does not define a useful utilization denominator.
hints.2.text: Repair the request, then inspect currentMetrics and ScalingActive while waiting for scale-up.
phrases.0: I checked the metrics pipeline before changing the HPA.
phrases.1: I supplied a meaningful CPU request.
phrases.2: I verified observed metrics and bounded scale-up.
questions.0.points.0: Usage as a percentage of CPU request.
questions.0.points.1: Missing or zero requests prevent this calculation.
questions.0.prompt: What does CPU utilization mean to the HPA?
questions.1.points.0: Metrics collection and controller reconciliation have separate intervals.
questions.1.points.1: Readiness and missing metrics also affect decisions.
questions.1.prompt: Why can scaling take more than one poll?
