title: Horizontal Pod Autoscaler
brief: |-
  The service is not reaching the required autoscaled capacity. Restore its resource model and actual request-processing demand.

  Work on the workstation in `~/quest` with the supplied connection/result inputs: `autoscaling-contract.json`. Existing cluster objects provide the workload definitions.

  **Requirements:**

  - The `board` worker requests `100m` CPU and retains its `200m` CPU limit. Retain the original workloads and processing ConfigMap identities and their supplied images.
  - HPA `board` permits `1`–`2` replicas with a target utilization of `50` percent.
  - HPA `board` is `ScalingActive=True`, reports current and desired counts of `2` with utilization above `50` percent, and both replicas are ready; live Pod metrics show CPU in millicores. The existing HPA targets the supplied server, and the unchanged supplied request handler records new completions during observation.
  - From Deployment `client`, `http://board:8080` returns `north-112`.

  Sampling may take three minutes. Checks observe current policy, ready Pods and processing progress, not editing history, uninterrupted service or a production performance SLO.
debrief: The scale target, metric denominator and real incoming work are separate links. A bounded request-processing
  workload exposes actual demand instead of a permanent idle CPU burner.
stages.0.brief: Capacity stays within the supplied autoscaling and resource budgets.
hints.0.text: Scaling requires the intended target, usable utilization metrics and incoming work. A CPU budget alone
  does not create demand.
hints.1.text: |-
  Inspect target references and HPA conditions, the resource model of the serving container, current metrics and the supplied processing interface.

  ```sh
  cat autoscaling-contract.json
  kubectl get hpa,deployments,service -o yaml
  kubectl describe hpa board
  kubectl get configmap work-handler -o yaml
  kubectl top pods -l app=board
  ```
hints.2.text: |-
  Verify current and desired counts of two, CPU utilization above the target, two ready serving Pods and advancing completion counters. The root response remains unchanged.

  ```sh
  kubectl get hpa board
  kubectl get pods -l app=board
  kubectl top pods -l app=board
  kubectl exec deployment/board -c worker -- wc -l /tmp/work-completions
  ```
phrases.0: I checked the metrics pipeline before changing the HPA.
phrases.1: I supplied a meaningful CPU request.
phrases.2: I verified observed metrics and bounded scale-up.
questions.0.points.0: Usage as a percentage of CPU request.
questions.0.points.1: Missing or zero requests prevent this calculation.
questions.0.prompt: What does CPU utilization mean to the HPA?
questions.1.points.0: Metrics collection and controller reconciliation have separate intervals.
questions.1.points.1: Readiness and missing metrics also affect decisions.
questions.1.prompt: Why can scaling take more than one poll?
diagnostics.request: The board worker CPU request must equal 100m.
diagnostics.limit: The board worker CPU limit must equal 200m.
diagnostics.ready: Board must have two ready replicas.
diagnostics.minimum: HPA minReplicas must equal 1.
diagnostics.maximum: HPA maxReplicas must equal 2.
diagnostics.target: HPA CPU target utilization must be 50%.
diagnostics.current: HPA currentReplicas must equal 2.
diagnostics.desired: HPA desiredReplicas must equal 2.
diagnostics.metric: HPA must report CPU utilization above 50%.
diagnostics.active: HPA ScalingActive must be True.
diagnostics.top: kubectl top pods must show a CPU value in millicores.
diagnostics.http: board:8080 must return north-112.
