diagnostics.probe_0_0: Las entradas actuales no verifican esta condición; inspecciona estado de objetos y contrato.
diagnostics.load_identity: Cambió una carga original, identidad de control o imagen; conserva los componentes suministrados.
diagnostics.load_implementation: Conserva imágenes y bytes del handler suministrados en ConfigMap y archivos actuales.
diagnostics.load_target: El HPA original debe apuntar al Deployment previsto; un objetivo de utilización válido
  no selecciona la carga.
diagnostics.load_workers: Dos Pods actuales y listos deben pertenecer al Deployment servidor conservado y usar su
  imagen.
diagnostics.load_progress: Las finalizaciones reales deben avanzar durante la observación; réplicas listas o inactivas
  no establecen demanda.
diagnostics.probe_0_2: Las entradas actuales no verifican esta condición; inspecciona estado de objetos y contrato.
