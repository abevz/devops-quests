title: Escalador automático horizontal Pod
brief: "La carga board no alcanza la capacidad requerida. Restaure el autoescalado observable dentro del presupuesto\
  \ de recursos acordado.\n\nTrabaje en `~/quest` en la estación de trabajo. Archivos suministrados: `board.yaml`,\
  \ `service.yaml`, `hpa.yaml`, `client.yaml`.\n\n**Requirements:**\n\n- El worker `board` solicita `100m` de CPU\
  \ y conserva su límite de CPU `200m`.\n- El HPA `board` permite `1`–`2` réplicas con una utilización objetivo\
  \ del `50` por ciento.\n- El HPA `board` tiene `ScalingActive=True`, indica `2` réplicas actuales y deseadas con\
  \ utilización superior al `50` por ciento, ambas listas; las métricas reales muestran CPU en millicores.\n- Desde\
  \ Deployment `client`, `http://board:8080` devuelve `north-112`.\n\n**Verify yourself before Check & finish:**\
  \ Ejecute estos comandos de observación desde `~/quest` en la estación de trabajo.\n\n- La configuración, identidad\
  \ y estado cumplen los requisitos.\n\n  ```sh\n  kubectl get deployment board -o yaml\n  kubectl get hpa board\
  \ -o yaml\n  ```\n\n- `kubectl top pods -l app=board --no-headers` — Las métricas reales de CPU contienen valores\
  \ en millicores.\n\n- `kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080` — El consumidor recibe\
  \ `north-112`.\n\nEl muestreo y la reconciliación pueden tardar tres minutos; las comprobaciones no prueban que\
  \ el primer objetivo o la métrica actual sean CPU ni qué causó el escalado. Las relajaciones TLS solo aplican\
  \ a este adaptador kind desechable."
debrief: Un metrics API en funcionamiento y un requests válido son requisitos previos independientes para el escalado
  automático de CPU utilization.
stages.0.brief: El autoescalador activo debe proporcionar dos réplicas board listas.
hints.0.text: Utilization divide el observado CPU por el recurso request.
hints.1.text: Un request cero no define un denominador utilization útil.
hints.2.text: Repare el request, luego el inspect currentMetrics y el ScalingActive mientras espera la ampliación.
phrases.0: Revisé la canalización de métricas antes de cambiar el HPA.
phrases.1: Proporcioné un CPU request significativo.
phrases.2: Verifiqué métricas observadas y escalamiento acotado.
questions.0.points.0: Uso como porcentaje de CPU request.
questions.0.points.1: El requests faltante o cero impide este cálculo.
questions.0.prompt: ¿Qué significa CPU utilization para el HPA?
questions.1.points.0: La recopilación de métricas y el controlador reconciliation tienen intervalos separados.
questions.1.points.1: Readiness y las métricas faltantes también afectan las decisiones.
questions.1.prompt: ¿Por qué el escalado puede requerir más de una encuesta?
diagnostics.request: La solicitud CPU del primer contenedor board debe ser 100m.
diagnostics.limit: El límite CPU del primer contenedor board debe ser 200m.
diagnostics.ready: Board debe tener dos réplicas listas.
diagnostics.minimum: HPA minReplicas debe ser 1.
diagnostics.maximum: HPA maxReplicas debe ser 2.
diagnostics.target: El primer objetivo de utilización del HPA debe ser 50.
diagnostics.current: HPA currentReplicas debe ser 2.
diagnostics.desired: HPA desiredReplicas debe ser 2.
diagnostics.metric: Una métrica actual de recurso HPA debe tener utilización superior a 50.
diagnostics.active: HPA ScalingActive debe ser True.
diagnostics.top: kubectl top pods debe mostrar CPU en milicores.
diagnostics.http: board:8080 debe devolver north-112.
stages.0.objectives.0.text: El worker `board` solicita `100m` de CPU y conserva su límite de CPU `200m`.
stages.0.objectives.1.text: El HPA `board` permite `1`–`2` réplicas con una utilización objetivo del `50` por ciento.
stages.0.objectives.2.text: El HPA `board` tiene `ScalingActive=True`, indica `2` réplicas actuales y deseadas con
  utilización superior al `50` por ciento, ambas listas; las métricas reales muestran CPU en millicores.
stages.0.objectives.3.text: Desde Deployment `client`, `http://board:8080` devuelve `north-112`.
