title: Escalador automático horizontal Pod
brief: |-
  El servicio no alcanza la capacidad autoescalada requerida. Recupera su modelo de recursos y demanda real de procesamiento.

  Trabaja en la workstation en `~/quest` con las entradas de conexión/resultado: `autoscaling-contract.json`. Las definiciones de cargas están en los objetos actuales del clúster.

  **Requisitos:**

  - El worker `board` solicita `100m` de CPU y conserva su límite de CPU `200m`. Conserva identidades de cargas originales y ConfigMap del procesamiento, así como imágenes suministradas.
  - El HPA `board` permite `1`–`2` réplicas con una utilización objetivo del `50` por ciento.
  - El HPA `board` tiene `ScalingActive=True`, indica `2` réplicas actuales y deseadas con utilización superior al `50` por ciento, ambas listas; las métricas reales muestran CPU en millicores. El HPA existente apunta al servidor suministrado y el handler sin modificar registra nuevas finalizaciones durante la observación.
  - Desde Deployment `client`, `http://board:8080` devuelve `north-112`.

  El muestreo puede tardar tres minutos. Se observan política, Pods listos y progreso actuales, no historial, disponibilidad ininterrumpida ni un SLO de producción.
debrief: Destino de escala, denominador de la métrica y trabajo real son eslabones distintos. El procesamiento acotado
  muestra demanda real en lugar de un bucle CPU permanente sin trabajo útil.
stages.0.brief: La capacidad permanece dentro de los presupuestos de autoescalado y recursos suministrados.
hints.0.text: Escalar requiere destino previsto, métricas de utilización válidas y trabajo entrante. El presupuesto
  CPU por sí solo no crea demanda.
hints.1.text: |-
  Inspecciona referencias y condiciones HPA, modelo de recursos del contenedor servidor, métricas actuales e interfaz suministrada.

  ```sh
  cat autoscaling-contract.json
  kubectl get hpa,deployments,service -o yaml
  kubectl describe hpa board
  kubectl get configmap work-handler -o yaml
  kubectl top pods -l app=board
  ```
hints.2.text: |-
  Comprueba que `ScalingActive` sea `True`, que haya dos réplicas actuales y deseadas y que la utilización de CPU supere el objetivo del `50` por ciento. Los dos Pods del Deployment deben estar listos y mostrar métricas de CPU en milinúcleos. Compara dos observaciones de los contadores de solicitudes completadas de los mismos Pods: cada contador debe mantenerse o aumentar y la suma debe crecer. La petición desde el Deployment `client` a la ruta raíz debe seguir devolviendo `north-112`.

  ```sh
  kubectl get hpa board -o yaml
  kubectl get deployment board
  kubectl top pods -l app=board
  pods=$(kubectl get deployments,replicasets,pods -o json | jq -r '
    def owned($kind; $uids): any(.metadata.ownerReferences[]?;
      .controller == true and .kind == $kind and (.uid as $uid | $uids | index($uid) != null));
    .items as $items | ($items[] | select(.kind == "Deployment" and .metadata.name == "board")) as $board
    | [$items[] | select(.kind == "ReplicaSet" and owned("Deployment"; [$board.metadata.uid])) | .metadata.uid] as $rs
    | $items[] | select(.kind == "Pod" and owned("ReplicaSet"; $rs) and .metadata.deletionTimestamp == null
      and .status.phase != "Failed" and .status.phase != "Succeeded") | .metadata.name')
  sample() {
    while IFS= read -r pod; do
      printf '%s ' "$pod"
      kubectl exec "$pod" -c worker -- sh -c 'if test -f /tmp/work-completions; then wc -l < /tmp/work-completions; else echo 0; fi'
    done <<< "$pods"
  }
  test -n "$pods" && sample && sleep 1 && sample
  kubectl exec deployment/client -c worker -- wget -qO- -T 3 http://board:8080
  ```
phrases.0: Revisé la canalización de métricas antes de cambiar el HPA.
phrases.1: Proporcioné un CPU request significativo.
phrases.2: Verifiqué métricas observadas y escalamiento acotado.
questions.0.points.0: Uso como porcentaje de CPU request.
questions.0.points.1: El requests faltante o cero impide este cálculo.
questions.0.prompt: ¿Qué significa CPU utilization para el HPA?
questions.1.points.0: La recopilación de métricas y el controlador reconciliation tienen intervalos separados.
questions.1.points.1: Readiness y las métricas faltantes también afectan las decisiones.
questions.1.prompt: ¿Por qué el escalado puede requerir más de una encuesta?
stages.0.objectives.0.text: El worker `board` solicita `100m` de CPU y conserva su límite de CPU `200m`. Conserva
  identidades de cargas originales y ConfigMap del procesamiento, así como imágenes suministradas.
stages.0.objectives.1.text: El HPA `board` permite `1`–`2` réplicas con una utilización objetivo del `50` por ciento.
stages.0.objectives.2.text: El HPA `board` tiene `ScalingActive=True`, indica `2` réplicas actuales y deseadas con
  utilización superior al `50` por ciento, ambas listas; las métricas reales muestran CPU en millicores. El HPA
  existente apunta al servidor suministrado y el handler sin modificar registra nuevas finalizaciones durante la
  observación.
stages.0.objectives.3.text: Desde Deployment `client`, `http://board:8080` devuelve `north-112`.
diagnostics.request: La solicitud CPU del worker puede faltar o diferir de 100m y cambiar el denominador de utilización. Revise la cantidad efectiva de CPU del contenedor worker. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q112-board-cpu-request)
diagnostics.limit: El worker puede tener un límite CPU ausente o distinto. Revise el límite efectivo y compárelo con 200m. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q112-board-cpu-limit)
diagnostics.minimum: El HPA puede haber perdido su límite inferior. Revise minReplicas y manténgalo en uno. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q112-hpa-minimum-replicas)
diagnostics.maximum: El HPA puede no escalar a dos réplicas o superar el límite previsto. Revise maxReplicas y manténgalo en dos. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q112-hpa-maximum-replicas)
diagnostics.target: Las métricas CPU aplicables pueden faltar, usar otro tipo u otro umbral. Compruebe que cada objetivo aplicable use el tipo Utilization con un valor positivo. El menor de esos valores debe ser exactamente del 50 por ciento. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q112-hpa-cpu-target)
diagnostics.ready: El HPA puede pedir más capacidad mientras un Pod board aún no está listo. Revise eventos y espere dos réplicas listas en el estado del Deployment. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q112-board-ready-replica-count)
diagnostics.current: El controlador puede no ver dos réplicas aún o apuntar a otra carga. Compare la cantidad actual con el Deployment vinculado. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q112-hpa-current-replica-count)
diagnostics.desired: El controlador puede seguir recomendando una réplica por demanda baja de CPU o falta de métrica. Revise la cantidad deseada después de mantener la carga mediante client. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q112-hpa-desired-replica-count)
diagnostics.metric: La utilización CPU puede faltar o no superar 50 por ciento. Revise la métrica CPU de recurso o del contenedor worker tras mantener carga en el manejador suministrado. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q112-hpa-observed-cpu-utilization)
diagnostics.active: El escalador puede carecer de métricas utilizables o no encontrar el objetivo. Revise el motivo y mensaje de ScalingActive y confirme True. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q112-hpa-scaling-active)
diagnostics.top: La API de métricas puede no devolver millicores para los Pods board actuales. Revise las métricas activas antes de interpretar el escalado. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q112-board-metrics-availability)
diagnostics.http: El escalado puede estar correcto mientras Service devuelve una respuesta anterior o carece de endpoint. Consulte board desde client y compare el cuerpo con north-112. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q112-board-live-workload-response)
diagnostics.load_identity: El Deployment board o client puede haberse recreado con el nombre original. Compare los UID activos con los fijados y repare los objetos existentes. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q112-preserved-load-deployments)
diagnostics.load_implementation: La imagen o el ConfigMap del manejador pueden haber cambiado, o un worker actual ejecutar otros bytes. Compare las imágenes originales, UID del ConfigMap, hash de contenido y archivo del manejador. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q112-preserved-load-handler)
diagnostics.load_target: El HPA puede haberse recreado o escalar el objeto equivocado. Compare su UID con el original y compruebe que scaleTargetRef apunte a apps/v1 Deployment board. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q112-hpa-preserved-scale-target)
diagnostics.load_workers: El Deployment board conservado puede carecer de dos Pods actuales con el worker listo y en ejecución en la imagen suministrada. Revise identidad, réplicas deseadas y el worker de cada Pod tras escalar. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q112-current-serving-workers)
diagnostics.load_progress: El manejador puede dejar de completar peticiones pese a cantidades correctas. Revise el contador de cada worker actual entre observaciones. Los contadores no deben disminuir y el avance agregado debe ser positivo. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q112-handler-completion-progress)
diagnostics.probe_0_0: El observador puede detenerse antes de clasificar el fallo de recurso o implementación. Revise las herramientas y el acceso a los Deployments y al manejador suministrados. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q112-autoscaling-input-observer)
diagnostics.probe_0_2: El observador puede detenerse antes de señalar una condición si falla el proceso o los datos fijados. Revise las herramientas y el acceso al HPA y a la carga actual. [Causa y comprobación](guides#guide=autoscaling-gateway&section=q112-autoscaling-demand-observer)
