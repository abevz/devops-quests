title: Escalador automático horizontal Pod
brief: |-
  La carga board no alcanza la capacidad requerida. Restaure el autoescalado observable dentro del presupuesto de recursos acordado.

  Trabaja en la workstation en `~/quest` con los archivos suministrados:
  - `board.yaml`, `service.yaml`, `hpa.yaml`, `client.yaml`.

  **Requirements:**

  - Conserva el presupuesto de recursos acordado:
    - El worker `board` solicita `100m` de CPU y conserva su límite de CPU `200m`.
    - El HPA `board` permite `1`–`2` réplicas con una utilización objetivo del `50` por ciento.
  - El HPA `board` tiene `ScalingActive=True`, indica `2` réplicas actuales y deseadas con utilización superior al `50` por ciento, ambas listas; las métricas reales muestran CPU en millicores.
  - Desde Deployment `client`, `http://board:8080` devuelve `north-112`.

  El muestreo y la reconciliación pueden tardar tres minutos; las comprobaciones no prueban que el primer objetivo o la métrica actual sean CPU ni qué causó el escalado. Las relajaciones TLS solo aplican a este adaptador kind desechable.
debrief: Un metrics API en funcionamiento y un requests válido son requisitos previos independientes para
  el escalado automático de CPU utilization.
stages.0.brief: La capacidad permanece dentro de los presupuestos de autoescalado y recursos suministrados.
hints.0.text: Utilization divide el observado CPU por el recurso request.
hints.1.text: |-
  Un request cero no define un denominador utilization útil.

  Inspecciona los datos suministrados y las observaciones activas:

  ```sh
  kubectl get deployment board -o yaml
    kubectl get hpa board -o yaml
  ```
hints.2.text: |-
  Repare el request, luego el inspect currentMetrics y el ScalingActive mientras espera la ampliación.

  Verifica el resultado desde `~/quest` en la workstation:

  - `kubectl top pods -l app=board --no-headers` — Las métricas reales de CPU contienen valores en millicores.

  - `kubectl exec deployment/client -- wget -qO- -T 3 http://board:8080` — El consumidor recibe `north-112`.
phrases.0: Revisé la canalización de métricas antes de cambiar el HPA.
phrases.1: Proporcioné un CPU request significativo.
phrases.2: Verifiqué métricas observadas y escalamiento acotado.
questions.0.points.0: Uso como porcentaje de CPU request.
questions.0.points.1: El requests faltante o cero impide este cálculo.
questions.0.prompt: ¿Qué significa CPU utilization para el HPA?
questions.1.points.0: La recopilación de métricas y el controlador reconciliation tienen intervalos separados.
questions.1.points.1: Readiness y las métricas faltantes también afectan las decisiones.
questions.1.prompt: ¿Por qué el escalado puede requerir más de una encuesta?
