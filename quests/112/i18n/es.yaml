title: Escalador automático horizontal Pod
brief: 'El metrics-server privado funciona, pero el worker con CPU limitada tiene una solicitud CPU igual a cero, por lo que
  su HPA no puede calcular la utilización. Establece la solicitud del worker en 100m, conserva el límite de 200m y el rango
  HPA 1–2 con objetivo CPU del 50%. Observa métricas reales y el aumento de réplicas por el controlador; establecerlas manualmente
  no basta. El muestreo y la reconciliación pueden tardar hasta tres minutos. Las relajaciones TLS pertenecen solo a este
  adaptador kind desechable, no son una receta de producción.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `board.json`, `service.json`, `hpa.json`, `client.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas y servicios
  privados. Cambie sólo esta bahía.


  Las comprobaciones requieren en el primer contenedor board solicitud CPU `100m`, límite `200m`, dos réplicas listas, mínimo
  HPA 1 y máximo 2, primer objetivo de utilización 50, réplicas actuales y deseadas 2, una utilización actual de recurso superior
  a 50 y ScalingActive=True. `kubectl top pods -l app=board` debe mostrar CPU en milicores y deployment/client recibir `north-112`
  de `board:8080`. Las comprobaciones no verifican que el primer objetivo ni la métrica actual sean de CPU y el estado actual
  no demuestra qué acción causó el escalado.'
debrief: Un metrics API en funcionamiento y un requests válido son requisitos previos independientes para el escalado automático
  de CPU utilization.
stages.0.brief: El presupuesto CPU, las réplicas listas, ajustes y estado del HPA, salida top y respuesta board coinciden
  con la descripción.
stages.0.objectives.0.text: El presupuesto CPU, las réplicas listas, ajustes y estado del HPA, salida top y respuesta board
  coinciden con la descripción.
hints.0.text: Utilization divide el observado CPU por el recurso request.
hints.1.text: Un request cero no define un denominador utilization útil.
hints.2.text: Repare el request, luego el inspect currentMetrics y el ScalingActive mientras espera la ampliación.
phrases.0: Revisé la canalización de métricas antes de cambiar el HPA.
phrases.1: Proporcioné un CPU request significativo.
phrases.2: Verifiqué métricas observadas y escalamiento acotado.
questions.0.points.0: Uso como porcentaje de CPU request.
questions.0.points.1: El requests faltante o cero impide este cálculo.
questions.0.prompt: ¿Qué significa CPU utilization para el HPA?
questions.1.points.0: La recopilación de métricas y el controlador reconciliation tienen intervalos separados.
questions.1.points.1: Readiness y las métricas faltantes también afectan las decisiones.
questions.1.prompt: ¿Por qué el escalado puede requerir más de una encuesta?
diagnostics.request: La solicitud CPU del primer contenedor board debe ser 100m.
diagnostics.limit: El límite CPU del primer contenedor board debe ser 200m.
diagnostics.ready: Board debe tener dos réplicas listas.
diagnostics.minimum: HPA minReplicas debe ser 1.
diagnostics.maximum: HPA maxReplicas debe ser 2.
diagnostics.target: El primer objetivo de utilización del HPA debe ser 50.
diagnostics.current: HPA currentReplicas debe ser 2.
diagnostics.desired: HPA desiredReplicas debe ser 2.
diagnostics.metric: Una métrica actual de recurso HPA debe tener utilización superior a 50.
diagnostics.active: HPA ScalingActive debe ser True.
diagnostics.top: kubectl top pods debe mostrar CPU en milicores.
diagnostics.http: board:8080 debe devolver north-112.
