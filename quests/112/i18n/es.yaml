title: Escalador automático horizontal Pod
brief: 'El metrics-server privado se está ejecutando, pero un CPU worker limitado tiene un CPU request
  cero, por lo que su HPA no puede calcular utilization. Establezca el worker request en 100m, conserve
  su 200m limit y el rango HPA 1–2 con un 50% CPU objetivo. Observe métricas reales y ampliación del controlador;
  configurar manualmente replicas es insuficiente. El muestreo y reconciliation pueden tardar hasta tres
  minutos. Las relajaciones TLS pertenecen únicamente a este adaptador desechable kind, no a una receta
  de producción.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `board.json`, `service.json`,
  `hpa.json`, `client.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: Las métricas reales de CPU impulsan dos replicas listos con request 100m,
  limit 200m y el original limitado HPA. objetivo.'
debrief: Un metrics API en funcionamiento y un requests válido son requisitos previos independientes para
  el escalado automático de CPU utilization.
stages.0.brief: 'Criterios de éxito: Las métricas reales de CPU impulsan dos réplicas listas con request
  100m, limit 200m y el objetivo original limitado HPA.'
stages.0.objectives.0.text: Las métricas reales CPU impulsan dos réplicas listas con request 100m, limit
  200m y el objetivo original limitado HPA.
hints.0.text: Utilization divide el observado CPU por el recurso request.
hints.1.text: Un request cero no define un denominador utilization útil.
hints.2.text: Repare el request, luego el inspect currentMetrics y el ScalingActive mientras espera la
  ampliación.
phrases.0: Revisé la canalización de métricas antes de cambiar el HPA.
phrases.1: Proporcioné un CPU request significativo.
phrases.2: Verifiqué métricas observadas y escalamiento acotado.
questions.0.points.0: Uso como porcentaje de CPU request.
questions.0.points.1: El requests faltante o cero impide este cálculo.
questions.0.prompt: ¿Qué significa CPU utilization para el HPA?
questions.1.points.0: La recopilación de métricas y el controlador reconciliation tienen intervalos separados.
questions.1.points.1: Readiness y las métricas faltantes también afectan las decisiones.
questions.1.prompt: ¿Por qué el escalado puede requerir más de una encuesta?
