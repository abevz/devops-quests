title: Размещение DaemonSet
brief: 'Маршрут нагрузки уровня узла недоступен. Восстановите ответ на существующем узле, сохранив изоляцию
  нагрузки.


  Работайте в `~/quest` на workstation. Предоставленные файлы: `relay.yaml`, `service.yaml`.


  **Требования:**

  - Существующая нагрузка уровня узла может работать на узле отсека без изменения узла.

  - Нагрузка уровня узла не имеет доступа к хосту и повышенных привилегий, работает не от root и сохраняет
  поставленную изоляцию системных вызовов.

  - Текущий контроллер уровня узла владеет ровно одним готовым и доступным Pod на узле отсека; Pod не завершается.

  - Внутри нагрузки `relay` и `http://127.0.0.1:8080`, и `http://relay:8080` возвращают `north-103`.


  Проверка наблюдает текущие результаты, а не прошлые изменения меток узлов или других Deployment.

  '
debrief: Селектор, настройки безопасности, счётчики, принадлежащий Pod и ответ соответствовали проверкам.
stages.0.brief: Изолированная локальная нагрузка узла должна быть готова и обслуживать требуемый маршрут.
hints.0.text: Desired zero может означать отсутствие подходящих узлов, а не сбой контейнера.
hints.1.text: 'DaemonSet размещает один Pod на подходящий узел вместо заданного replicas.


  Изучите поставленные определения, текущие ресурсы и события.


  ```sh

  cat relay.yaml

  kubectl describe daemonset relay

  kubectl get nodes --show-labels

  kubectl get pods -l app=relay -o yaml

  ```'
hints.2.text: 'Замените только устаревший selector и изучите реального controller owner. Единственный селектор
  — kubernetes.io/os=linux. Сохраните метки узлов и не создавайте заменяющий Deployment.


  Проверьте наблюдаемый результат:


  ```sh

  kubectl get daemonset relay

  kubectl exec daemonset/relay -- wget -qO- -T 3 http://127.0.0.1:8080

  kubectl exec daemonset/relay -- wget -qO- -T 3 http://relay:8080

  ```


  Ожидаются значения desired, ready и available по одному и north-103 по обоим HTTP-адресам.


  Поставленные ограничения и подробности: DaemonSet `relay` предназначен только для узлов с ОС `linux`. Pod
  `relay` не использует сеть/PID/IPC хоста и hostPath, имеет политику Pod без root и seccomp `RuntimeDefault`;
  все обычные и init-контейнеры непривилегированны, запрещают повышение привилегий, сбрасывают `ALL` capabilities
  и не добавляют новых. DaemonSet `relay` размещает ровно `1` управляемый Pod на `DQ_NODE_NAME`; он готов,
  доступен и не завершается.'
phrases.0: Я отделил выбор узла от здоровья контейнера.
phrases.1: Я проверил владельца DaemonSet и счётчики размещения.
phrases.2: Я избежал ненужных host privileges.
questions.0.points.0: Требуемое число зависит от подходящих узлов.
questions.0.points.1: На размещение влияют selectors, affinity и tolerations.
questions.0.prompt: Почему DaemonSet не использует число реплик?
questions.1.points.0: 'Нет: привилегии определяет задача, а не вид контроллера.'
questions.1.points.1: Выдавайте host access только при конкретной необходимости.
questions.1.prompt: Нужны ли каждому DaemonSet привилегии?
stages.0.objectives.0.text: Существующая нагрузка уровня узла может работать на узле отсека без изменения узла.
stages.0.objectives.1.text: Нагрузка уровня узла не имеет доступа к хосту и повышенных привилегий, работает
  не от root и сохраняет поставленную изоляцию системных вызовов.
stages.0.objectives.2.text: Текущий контроллер уровня узла владеет ровно одним готовым и доступным Pod на узле
  отсека; Pod не завершается.
stages.0.objectives.3.text: Внутри нагрузки `relay` и `http://127.0.0.1:8080`, и `http://relay:8080` возвращают
  `north-103`.
diagnostics.node_selector: Селектор мог не подходить ни к одной ноде, или контроллер может ещё показывать старое поколение. Проверьте метки и дождитесь для текущего поколения одного желаемого и обновлённого Pod без лишних размещений. [Причина и проверка](guides#guide=kubernetes-workloads&section=q103-relay-bay-placement)
diagnostics.probe_0_0: Проверка размещения может завершиться до сравнения статуса при ошибке Python или входных данных. Проверьте Python и доступ к relay. [Причина и проверка](guides#guide=kubernetes-workloads&section=q103-placement-observer-input)
diagnostics.probe_0_1: Проверка ограничений может завершиться до указания условия при ошибке Python или входных данных. Проверьте доступ к DaemonSet и запуск инструментов. [Причина и проверка](guides#guide=kubernetes-workloads&section=q103-security-observer-input)
diagnostics.host_hostnetwork: При исправлении размещения могла включиться сеть хоста. Проверьте hostNetwork и сохраните отдельное сетевое пространство Pod. [Причина и проверка](guides#guide=kubernetes-workloads&section=q103-relay-network-namespace)
diagnostics.host_hostpid: Шаблон Pod мог начать использовать пространство процессов хоста. Проверьте hostPID и оставьте его выключенным. [Причина и проверка](guides#guide=kubernetes-workloads&section=q103-relay-process-namespace)
diagnostics.host_hostipc: Шаблон Pod мог начать использовать IPC хоста. Проверьте hostIPC и сохраните отдельное пространство IPC. [Причина и проверка](guides#guide=kubernetes-workloads&section=q103-relay-ipc-namespace)
diagnostics.hostpath: При правке шаблона могли добавить том hostPath. Проверьте источники томов и уберите зависимость от hostPath. [Причина и проверка](guides#guide=kubernetes-workloads&section=q103-relay-volume-sources)
diagnostics.nonroot: У контейнера могло исчезнуть действующее runAsNonRoot, появиться переопределение или UID 0. Проверьте настройки Pod, обычных и init-контейнеров. Явно заданные UID должны быть положительными. [Причина и проверка](guides#guide=kubernetes-workloads&section=q103-relay-user-policy)
diagnostics.seccomp: Фильтр системных вызовов мог исчезнуть или быть переопределён. Проверьте, что обычные и init-контейнеры используют RuntimeDefault с учётом настроек Pod. [Причина и проверка](guides#guide=kubernetes-workloads&section=q103-relay-syscall-filter)
diagnostics.security_privileged: 'Обычному или init-контейнеру могли включить привилегированный режим. Проверьте securityContext каждого контейнера и уберите privileged: true. [Причина и проверка](guides#guide=kubernetes-workloads&section=q103-relay-privileged-mode)'
diagnostics.security_allowprivilegeescalation: 'Контейнер может допускать повышение привилегий, если флаг отсутствует или включён. Задайте allowPrivilegeEscalation: false каждому обычному и init-контейнеру. [Причина и проверка](guides#guide=kubernetes-workloads&section=q103-relay-privilege-escalation)'
diagnostics.security_drop: Контейнер мог перестать сбрасывать стандартный набор capabilities. Проверьте ALL в списке drop каждого обычного и init-контейнера. [Причина и проверка](guides#guide=kubernetes-workloads&section=q103-relay-drop-capabilities)
diagnostics.security_add: Шаблон мог снова добавить capabilities после сброса. Проверьте, что список add каждого обычного и init-контейнера пуст. [Причина и проверка](guides#guide=kubernetes-workloads&section=q103-relay-no-added-capabilities)
diagnostics.status_desirednumberscheduled: Селектор мог исключить ноду стенда или выбрать другой набор нод. Проверьте размещение, чтобы контроллер показывал ровно один желаемый Pod. [Причина и проверка](guides#guide=kubernetes-workloads&section=q103-relay-desired-count)
diagnostics.status_numberready: DaemonSet мог разместить Pod, пока его worker ещё не готов. Проверьте события Pod и дождитесь ровно одного готового Pod в статусе DaemonSet. [Причина и проверка](guides#guide=kubernetes-workloads&section=q103-relay-ready-count)
diagnostics.status_numberavailable: Недавно готовый Pod мог ещё не считаться доступным, либо его готовность нестабильна. После rollout проверьте, что доступный Pod ровно один. [Причина и проверка](guides#guide=kubernetes-workloads&section=q103-relay-available-count)
diagnostics.owned: Подходящая метка может быть у отдельного или удаляемого Pod. Проверьте UID контроллера relay, нужную ноду и готовность у одного активного Pod этого DaemonSet. [Причина и проверка](guides#guide=kubernetes-workloads&section=q103-relay-pod-ownership)
diagnostics.local_http: Pod мог не слушать ожидаемый порт или отдавать не тот файл. Проверьте loopback-ответ из relay и сравните с north-103. [Причина и проверка](guides#guide=kubernetes-workloads&section=q103-relay-loopback-response)
diagnostics.service_http: Service мог не выбрать готовый Pod relay, либо не работает обнаружение или маршрутизация. Проверьте ответ по имени Service отдельно от loopback и сравните с north-103. [Причина и проверка](guides#guide=kubernetes-workloads&section=q103-relay-service-response)
