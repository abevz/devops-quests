title: Размещение DaemonSet
brief: 'Релей узла — DaemonSet с устаревшим selector station-zone, поэтому он не выбирает
  ни одного узла. В приватном кластере один Linux-узел. Используйте kubernetes.io/os:
  linux без изменения labels узла и без подмены Deployment. Нужна непривилегированная
  namespaced-нагрузка: relay не требует hostPath, host networking или host PID namespace.
  Проверьте desired/ready DaemonSet, владельца Pod и реальный ответ сервиса.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `relay.json`, `service.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно
  загруженные образы и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: DaemonSet разместил один исправный управляемый Pod на Linux-узле
  и отдаёт north-103 без host privileges.'
debrief: Выбор подходящих узлов исправлен без прав администрирования узла и доступа
  к хосту.
stages.0.brief: 'Результат проверки: DaemonSet разместил один исправный управляемый
  Pod на Linux-узле и отдаёт north-103 без host privileges.'
stages.0.objectives.0.text: DaemonSet разместил один исправный управляемый Pod на
  Linux-узле и отдаёт north-103 без host privileges.
hints.0.text: Desired zero может означать отсутствие подходящих узлов, а не сбой контейнера.
hints.1.text: DaemonSet размещает один Pod на подходящий узел вместо заданного replicas.
hints.2.text: Замените только устаревший selector и изучите реального controller owner.
phrases.0: Я отделил выбор узла от здоровья контейнера.
phrases.1: Я проверил владельца DaemonSet и счётчики размещения.
phrases.2: Я избежал ненужных host privileges.
questions.0.points.0: Требуемое число зависит от подходящих узлов.
questions.0.points.1: На размещение влияют selectors, affinity и tolerations.
questions.0.prompt: Почему DaemonSet не использует число реплик?
questions.1.points.0: 'Нет: привилегии определяет задача, а не вид контроллера.'
questions.1.points.1: Выдавайте host access только при конкретной необходимости.
questions.1.prompt: Нужны ли каждому DaemonSet привилегии?
