title: Размещение DaemonSet
brief: "Локальный для узла адрес маршрута недоступен. Восстановите нагрузку на подходящем Linux-узле с сохранением\
  \ изоляции.\n\nРаботайте в `~/quest` на workstation. Предоставленные файлы: `relay.json`, `service.json`.\n\n\
  **Требования:**\n- DaemonSet `relay` выбирает ОС `linux` через селектор меток узлов, без других меток в этом селекторе.\n\
  - DaemonSet `relay`:\n  - host networking отключён.\n- DaemonSet `relay`:\n  - пространство PID хоста отключено.\n\
  - DaemonSet `relay`:\n  - пространство IPC хоста отключено.\n- DaemonSet `relay`:\n  - нет томов hostPath.\n-\
  \ DaemonSet `relay` имеет политику уровня Pod, требующую выполнения без root.\n- DaemonSet `relay`:\n  - нет привилегированных\
  \ контейнеров.\n- DaemonSet `relay`:\n  - повышение привилегий запрещено всем контейнерам.\n- DaemonSet `relay`:\n\
  \  - все обычные и init-контейнеры сбрасывают capability ALL.\n- DaemonSet `relay`:\n  - нет добавленных capabilities\
  \ ни в обычных, ни в init-контейнерах.\n- DaemonSet `relay`:\n  - профиль seccomp Pod `RuntimeDefault`.\n- DaemonSet\
  \ `relay`:\n  - желаемые Pod `1`.\n- DaemonSet `relay`:\n  - готовые Pod `1`.\n- DaemonSet `relay`:\n  - доступные\
  \ Pod `1`.\n- На узле `DQ_NODE_NAME` DaemonSet `relay` управляет не завершающимся Pod с готовым контейнером.\n\
  - Из `daemonset/relay` HTTP `http://127.0.0.1:8080` возвращает `north-103`.\n- Из `daemonset/relay` HTTP `http://relay:8080`\
  \ возвращает `north-103`.\n\n**Проверьте самостоятельно перед Check & finish:**\nВыполняйте эти команды наблюдения\
  \ из `~/quest` на workstation; `kubectl exec` наблюдает контейнер указанной нагрузки.\n- Настройки, идентичность\
  \ и статус соответствуют требованиям.\n\n  ```sh\n  kubectl get daemonset relay -o yaml\n  kubectl get pods -l\
  \ app=relay -o json\n  ```\n- `kubectl exec daemonset/relay -- wget -qO- -T 3 http://127.0.0.1:8080` — Потребитель\
  \ нагрузки получает `north-103`.\n- `kubectl exec daemonset/relay -- wget -qO- -T 3 http://relay:8080` — Потребитель\
  \ нагрузки получает `north-103`.\n\nПроверка наблюдает текущие результаты, а не прошлые изменения меток узлов\
  \ или других Deployment.\n"
debrief: Селектор, настройки безопасности, счётчики, принадлежащий Pod и ответ соответствовали проверкам.
stages.0.brief: 'Изолированная локальная нагрузка узла должна быть готова и обслуживать требуемый маршрут.

  '
hints.0.text: Desired zero может означать отсутствие подходящих узлов, а не сбой контейнера.
hints.1.text: DaemonSet размещает один Pod на подходящий узел вместо заданного replicas.
hints.2.text: 'Замените только устаревший selector и изучите реального controller owner. Единственный селектор —
  kubernetes.io/os=linux. Сохраните метки узлов и не создавайте заменяющий Deployment.

  '
phrases.0: Я отделил выбор узла от здоровья контейнера.
phrases.1: Я проверил владельца DaemonSet и счётчики размещения.
phrases.2: Я избежал ненужных host privileges.
questions.0.points.0: Требуемое число зависит от подходящих узлов.
questions.0.points.1: На размещение влияют selectors, affinity и tolerations.
questions.0.prompt: Почему DaemonSet не использует число реплик?
questions.1.points.0: 'Нет: привилегии определяет задача, а не вид контроллера.'
questions.1.points.1: Выдавайте host access только при конкретной необходимости.
questions.1.prompt: Нужны ли каждому DaemonSet привилегии?
diagnostics.hostpath: DaemonSet relay не должен использовать тома hostPath.
diagnostics.nonroot: daemonset/relay runAsNonRoot должен совпадать с true.
diagnostics.seccomp: daemonset/relay seccompProfile.type должен совпадать с RuntimeDefault.
diagnostics.node_selector: daemonset/relay nodeSelector должен совпадать с {kubernetes.io/os:linux}.
diagnostics.owned: На узле песочницы DaemonSet relay должен контролировать Pod, не отмеченный для удаления, хотя
  бы с одним готовым контейнером.
diagnostics.local_http: daemonset/relay Pod 127.0.0.1:8080 должен совпадать с north-103.
diagnostics.service_http: relay:8080 должен совпадать с north-103.
diagnostics.host_hostnetwork: daemonset/relay hostNetwork не должен быть включён.
diagnostics.host_hostpid: daemonset/relay hostPID не должен быть включён.
diagnostics.host_hostipc: daemonset/relay hostIPC не должен быть включён.
diagnostics.security_privileged: Ни один контейнер не должен быть привилегированным.
diagnostics.security_allowprivilegeescalation: container securityContext allowPrivilegeEscalation должен совпадать
  с false.
diagnostics.security_drop: Каждый контейнер должен удалить capability ALL.
diagnostics.security_add: Ни у одного обычного или init-контейнера не должно быть добавленных capabilities.
diagnostics.status_desirednumberscheduled: daemonset/relay desiredNumberScheduled должен совпадать с 1.
diagnostics.status_numberready: daemonset/relay numberReady должен совпадать с 1.
diagnostics.status_numberavailable: daemonset/relay numberAvailable должен совпадать с 1.
