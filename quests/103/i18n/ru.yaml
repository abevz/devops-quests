title: Размещение DaemonSet
brief: 'Работайте в `~/quest` с `relay.json` и `service.json`. DaemonSet `relay` имеет устаревший селектор и не выбирает ни одного узла. DaemonSet размещает Pod на каждом подходящем узле; в приватном кластере один узел Linux. Замените селектор точно на `kubernetes.io/os: linux`: дополнительные селекторы ограничили бы выбор сильнее, чем предусмотренные узлы Linux. Не меняйте метки узлов и не создавайте заменяющий Deployment.


  Оставьте Pod в пространстве имён: без сети хоста, host PID, host IPC и hostPath. Контекст безопасности Pod должен задавать `runAsNonRoot: true` и `seccompProfile.type: RuntimeDefault`; каждый контейнер и init container должен быть непривилегированным, задавать `allowPrivilegeEscalation: false`, удалять возможности `ALL` и не добавлять их. Дополнительное удаление возможностей безопасно. Дождитесь значения 1 для desired, ready и available. Проверьте, что готовый незавершающийся Pod, принадлежащий DaemonSet `relay`, работает на `DQ_NODE_NAME`, а его локальный `127.0.0.1:8080` и `relay:8080` возвращают `north-103`. Проверки наблюдают результаты, но не доказывают, менялись ли ранее метки узлов или другие Deployment. Работайте только в офлайн-песочнице.'
debrief: Селектор, настройки безопасности, счётчики, принадлежащий Pod и ответ соответствовали проверкам.
stages.0.brief: Селектор DaemonSet, настройки безопасности, три счётчика, принадлежащий готовый Pod и ответ сервиса соответствуют заданию.
stages.0.objectives.0.text: Селектор DaemonSet, настройки безопасности, три счётчика, принадлежащий готовый Pod и ответ сервиса соответствуют заданию.
hints.0.text: Desired zero может означать отсутствие подходящих узлов, а не сбой контейнера.
hints.1.text: DaemonSet размещает один Pod на подходящий узел вместо заданного replicas.
hints.2.text: Замените только устаревший selector и изучите реального controller owner.
phrases.0: Я отделил выбор узла от здоровья контейнера.
phrases.1: Я проверил владельца DaemonSet и счётчики размещения.
phrases.2: Я избежал ненужных host privileges.
questions.0.points.0: Требуемое число зависит от подходящих узлов.
questions.0.points.1: На размещение влияют selectors, affinity и tolerations.
questions.0.prompt: Почему DaemonSet не использует число реплик?
questions.1.points.0: 'Нет: привилегии определяет задача, а не вид контроллера.'
questions.1.points.1: Выдавайте host access только при конкретной необходимости.
questions.1.prompt: Нужны ли каждому DaemonSet привилегии?
