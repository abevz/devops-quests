title: Colocación de DaemonSet
brief: 'El nodo relay es un DaemonSet con un station-zone selector obsoleto, por lo que no apunta a ningún
  nodo. El clúster privado tiene un nodo Linux. Seleccione kubernetes.io/os: linux sin editar el nodo
  labels o crear un Deployment de reemplazo. Mantenga una carga de trabajo con espacio de nombres y sin
  privilegios: este relay no necesita hostPath, host networking ni host PID namespace. Verifique los conteos
  de DaemonSet desired/ready, el propietario del controlador Pod y su respuesta de servicio real.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `relay.json`, `service.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: DaemonSet programa un Pod de propiedad saludable en el nodo de Linux y
  sirve north-103 sin el host privileges.'
debrief: La elegibilidad del nodo se reparó sin otorgar administración de nodo ni acceso al host.
stages.0.brief: 'Criterios de éxito: DaemonSet programa un Pod de propiedad saludable en el nodo de Linux
  y sirve north-103 sin el host privileges.'
stages.0.objectives.0.text: DaemonSet programa un Pod de propiedad saludable en el nodo de Linux y sirve
  north-103 sin el host privileges.
hints.0.text: Desired zero puede significar que no hay ningún nodo elegible, ni una falla del contenedor.
hints.1.text: Un DaemonSet coloca un Pod por nodo elegible en lugar de tomar un valor replicas.
hints.2.text: Reemplace solo los obsoletos selector y inspect por el verdadero controller owner.
phrases.0: Separé la elegibilidad del nodo del estado del contenedor.
phrases.1: Verifiqué los recuentos de propiedad y programación de DaemonSet.
phrases.2: Evité el host innecesario privileges.
questions.0.points.0: Su recuento deseado sigue los nodos elegibles.
questions.0.points.1: Los selectores affinity y tolerations afectan la ubicación.
questions.0.prompt: ¿Por qué un DaemonSet no utiliza un recuento de réplicas?
questions.1.points.0: No; El privilegio depende de la tarea real, no del controlador kind.
questions.1.points.1: Otorgue host access solo cuando una función específica lo necesite.
questions.1.prompt: ¿Debe ser privilegiado todo DaemonSet?
