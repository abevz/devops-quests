title: Colocación de DaemonSet
brief: 'El endpoint de ruta local al nodo no está disponible. Restaura su respuesta en el nodo existente conservando
  el aislamiento de la carga.


  Trabaja en `~/quest` en la workstation. Archivos suministrados: `relay.yaml`, `service.yaml`.


  **Requisitos:**

  - La carga local al nodo existente puede ejecutarse en el nodo de la bahía sin modificar el nodo.

  - La carga local al nodo no tiene acceso al host ni privilegios elevados, se ejecuta sin root y conserva
  el aislamiento de llamadas al sistema suministrado.

  - El controlador local al nodo actual posee exactamente un Pod listo y disponible en el nodo de la bahía;
  ese Pod no está terminando.

  - Dentro de la carga `relay`, tanto `http://127.0.0.1:8080` como `http://relay:8080` devuelven `north-103`.


  Se observan resultados actuales, no cambios anteriores en etiquetas de nodos u otros Deployments.

  '
debrief: El selector, la seguridad, los contadores, el Pod propio y la respuesta coincidieron con las comprobaciones.
stages.0.brief: La carga aislada local del nodo debe estar lista y servir la ruta requerida.
hints.0.text: Desired zero puede significar que no hay ningún nodo elegible, ni una falla del contenedor.
hints.1.text: 'Un DaemonSet coloca un Pod por nodo elegible en lugar de tomar un valor replicas.


  Inspecciona las definiciones suministradas, los recursos actuales y los eventos.


  ```sh

  cat relay.yaml

  kubectl describe daemonset relay

  kubectl get nodes --show-labels

  kubectl get pods -l app=relay -o yaml

  ```'
hints.2.text: 'Reemplace solo los obsoletos selector y inspect por el verdadero controller owner. El único
  selector es kubernetes.io/os=linux. Conserva las etiquetas de nodos y no crees un Deployment sustituto.


  Verifica el resultado observado:


  ```sh

  kubectl get daemonset relay

  kubectl exec daemonset/relay -- wget -qO- -T 3 http://127.0.0.1:8080

  kubectl exec daemonset/relay -- wget -qO- -T 3 http://relay:8080

  ```


  Se esperan valores de uno para desired, ready y available, y north-103 en ambas direcciones HTTP.


  Restricciones y detalles suministrados: El DaemonSet `relay` se dirige solo a nodos con SO `linux`. El Pod
  `relay` no usa red/PID/IPC del host ni hostPath, tiene política de Pod sin root y seccomp `RuntimeDefault`;
  todos los contenedores normales e init no son privilegiados, impiden la escalada, eliminan `ALL` capabilities
  y no añaden ninguna. El DaemonSet `relay` programa exactamente `1` Pod controlado en `DQ_NODE_NAME`; está
  listo, disponible y no está terminando.'
phrases.0: Separé la elegibilidad del nodo del estado del contenedor.
phrases.1: Verifiqué los recuentos de propiedad y programación de DaemonSet.
phrases.2: Evité el host innecesario privileges.
questions.0.points.0: Su recuento deseado sigue los nodos elegibles.
questions.0.points.1: Los selectores affinity y tolerations afectan la ubicación.
questions.0.prompt: ¿Por qué un DaemonSet no utiliza un recuento de réplicas?
questions.1.points.0: No; El privilegio depende de la tarea real, no del controlador kind.
questions.1.points.1: Otorgue host access solo cuando una función específica lo necesite.
questions.1.prompt: ¿Debe ser privilegiado todo DaemonSet?
diagnostics.hostpath: DaemonSet relay no debe usar volúmenes hostPath.
diagnostics.nonroot: daemonset/relay runAsNonRoot debe ser igual a true.
diagnostics.seccomp: daemonset/relay seccompProfile.type debe ser igual a RuntimeDefault.
diagnostics.node_selector: daemonset/relay debe poder ejecutarse en el nodo de la bahía con su generación actual.
diagnostics.owned: En el nodo de la bahía, DaemonSet relay debe controlar un Pod no marcado para eliminación
  con al menos un contenedor listo.
diagnostics.local_http: daemonset/relay Pod 127.0.0.1:8080 debe ser igual a north-103.
diagnostics.service_http: relay:8080 debe ser igual a north-103.
diagnostics.host_hostnetwork: daemonset/relay hostNetwork no debe estar activado.
diagnostics.host_hostpid: daemonset/relay hostPID no debe estar activado.
diagnostics.host_hostipc: daemonset/relay hostIPC no debe estar activado.
diagnostics.security_privileged: Ningún contenedor puede ser privilegiado.
diagnostics.security_allowprivilegeescalation: container securityContext allowPrivilegeEscalation debe ser
  igual a false.
diagnostics.security_drop: Cada contenedor debe retirar la capability ALL.
diagnostics.security_add: Ningún contenedor normal ni init debe tener capabilities añadidas.
diagnostics.status_desirednumberscheduled: daemonset/relay desiredNumberScheduled debe ser igual a 1.
diagnostics.status_numberready: daemonset/relay numberReady debe ser igual a 1.
diagnostics.status_numberavailable: daemonset/relay numberAvailable debe ser igual a 1.
