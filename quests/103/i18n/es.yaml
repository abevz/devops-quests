  el nodo.
stages.0.objectives.1.text: La carga local al nodo no tiene acceso al host ni privilegios elevados, se ejecuta
  sin root y conserva el aislamiento de llamadas al sistema suministrado.
stages.0.objectives.2.text: El controlador local al nodo actual posee exactamente un Pod listo y disponible
  en el nodo de la bahía; ese Pod no está terminando.
stages.0.objectives.3.text: Dentro de la carga `relay`, tanto `http://127.0.0.1:8080` como `http://relay:8080`
  devuelven `north-103`.
