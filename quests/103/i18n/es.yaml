title: Colocación de DaemonSet
brief: 'Trabaja en `~/quest` con `relay.json` y `service.json`. El DaemonSet `relay` tiene un selector antiguo y no selecciona ningún nodo. Un DaemonSet programa un Pod por cada nodo apto; este clúster privado tiene un nodo Linux. Sustituye el selector por exactamente `kubernetes.io/os: linux`: otros selectores restringirían la elegibilidad más allá de los nodos Linux previstos. No cambies etiquetas de nodos ni crees un Deployment de reemplazo.


  Mantén el Pod en su namespace: sin red, PID o IPC del host ni hostPath. El contexto de seguridad del Pod debe establecer `runAsNonRoot: true` y `seccompProfile.type: RuntimeDefault`; cada contenedor e init container debe ser no privilegiado, establecer `allowPrivilegeEscalation: false`, eliminar las capacidades `ALL` y no añadir ninguna. Eliminar capacidades adicionales es inocuo. Espera a que desired, ready y available valgan 1. Comprueba que un Pod listo, no terminado y propiedad del DaemonSet `relay` se ejecuta en `DQ_NODE_NAME`, y que tanto su `127.0.0.1:8080` local como `relay:8080` devuelven `north-103`. Las comprobaciones observan esos resultados, no si se cambiaron alguna vez etiquetas de nodos u otros Deployments. Trabaja solo en la bahía sin conexión.'
debrief: El selector, la seguridad, los contadores, el Pod propio y la respuesta coincidieron con las comprobaciones.
stages.0.brief: El selector del DaemonSet, la seguridad, los tres contadores, el Pod propio listo y la respuesta del servicio coinciden con el enunciado.
stages.0.objectives.0.text: El selector del DaemonSet, la seguridad, los tres contadores, el Pod propio listo y la respuesta del servicio coinciden con el enunciado.
hints.0.text: Desired zero puede significar que no hay ningún nodo elegible, ni una falla del contenedor.
hints.1.text: Un DaemonSet coloca un Pod por nodo elegible en lugar de tomar un valor replicas.
hints.2.text: Reemplace solo los obsoletos selector y inspect por el verdadero controller owner.
phrases.0: Separé la elegibilidad del nodo del estado del contenedor.
phrases.1: Verifiqué los recuentos de propiedad y programación de DaemonSet.
phrases.2: Evité el host innecesario privileges.
questions.0.points.0: Su recuento deseado sigue los nodos elegibles.
questions.0.points.1: Los selectores affinity y tolerations afectan la ubicación.
questions.0.prompt: ¿Por qué un DaemonSet no utiliza un recuento de réplicas?
questions.1.points.0: No; El privilegio depende de la tarea real, no del controlador kind.
questions.1.points.1: Otorgue host access solo cuando una función específica lo necesite.
questions.1.prompt: ¿Debe ser privilegiado todo DaemonSet?
