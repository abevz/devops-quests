title: Colocación de DaemonSet
brief: "El endpoint de ruta local del nodo no está disponible. Recupera la carga en el nodo Linux elegible manteniendo\
  \ su aislamiento.\n\nTrabaja en `~/quest` en la workstation. Archivos suministrados: `relay.json`, `service.json`.\n\
  \n**Requisitos:**\n- El DaemonSet `relay` selecciona SO `linux` mediante su selector de etiquetas de nodos, sin\
  \ otras etiquetas en ese selector.\n- DaemonSet `relay`:\n  - red del host desactivada.\n- DaemonSet `relay`:\n\
  \  - espacio PID del host desactivado.\n- DaemonSet `relay`:\n  - espacio IPC del host desactivado.\n- DaemonSet\
  \ `relay`:\n  - sin volúmenes hostPath.\n- El DaemonSet `relay` tiene una política a nivel de Pod que exige ejecución\
  \ sin root.\n- DaemonSet `relay`:\n  - sin contenedores privilegiados.\n- DaemonSet `relay`:\n  - escalada de\
  \ privilegios desactivada en todos los contenedores.\n- DaemonSet `relay`:\n  - todos los contenedores normales\
  \ e init eliminan la capability ALL.\n- DaemonSet `relay`:\n  - sin capabilities añadidas en contenedores normales\
  \ ni init.\n- DaemonSet `relay`:\n  - perfil seccomp de Pod `RuntimeDefault`.\n- DaemonSet `relay`:\n  - Pods\
  \ deseados `1`.\n- DaemonSet `relay`:\n  - Pods listos `1`.\n- DaemonSet `relay`:\n  - Pods disponibles `1`.\n\
  - En el nodo `DQ_NODE_NAME`, el DaemonSet `relay` controla un Pod sin terminar con un contenedor listo.\n- Desde\
  \ `daemonset/relay`, HTTP `http://127.0.0.1:8080` devuelve `north-103`.\n- Desde `daemonset/relay`, HTTP `http://relay:8080`\
  \ devuelve `north-103`.\n\n**Verifica antes de Check & finish:**\nEjecuta estos comandos de observación desde\
  \ `~/quest` en la workstation; `kubectl exec` observa el contenedor de la carga indicada.\n- Los ajustes, la identidad\
  \ y el estado coinciden con Requisitos.\n\n  ```sh\n  kubectl get daemonset relay -o yaml\n  kubectl get pods\
  \ -l app=relay -o json\n  ```\n- `kubectl exec daemonset/relay -- wget -qO- -T 3 http://127.0.0.1:8080` — El consumidor\
  \ de la carga recibe `north-103`.\n- `kubectl exec daemonset/relay -- wget -qO- -T 3 http://relay:8080` — El consumidor\
  \ de la carga recibe `north-103`.\n\nSe observan resultados actuales, no cambios anteriores en etiquetas de nodos\
  \ u otros Deployments.\n"
debrief: El selector, la seguridad, los contadores, el Pod propio y la respuesta coincidieron con las comprobaciones.
stages.0.brief: 'La carga aislada local del nodo debe estar lista y servir la ruta requerida.

  '
hints.0.text: Desired zero puede significar que no hay ningún nodo elegible, ni una falla del contenedor.
hints.1.text: Un DaemonSet coloca un Pod por nodo elegible en lugar de tomar un valor replicas.
hints.2.text: 'Reemplace solo los obsoletos selector y inspect por el verdadero controller owner. El único selector
  es kubernetes.io/os=linux. Conserva las etiquetas de nodos y no crees un Deployment sustituto.

  '
phrases.0: Separé la elegibilidad del nodo del estado del contenedor.
phrases.1: Verifiqué los recuentos de propiedad y programación de DaemonSet.
phrases.2: Evité el host innecesario privileges.
questions.0.points.0: Su recuento deseado sigue los nodos elegibles.
questions.0.points.1: Los selectores affinity y tolerations afectan la ubicación.
questions.0.prompt: ¿Por qué un DaemonSet no utiliza un recuento de réplicas?
questions.1.points.0: No; El privilegio depende de la tarea real, no del controlador kind.
questions.1.points.1: Otorgue host access solo cuando una función específica lo necesite.
questions.1.prompt: ¿Debe ser privilegiado todo DaemonSet?
diagnostics.hostpath: DaemonSet relay no debe usar volúmenes hostPath.
diagnostics.nonroot: daemonset/relay runAsNonRoot debe ser igual a true.
diagnostics.seccomp: daemonset/relay seccompProfile.type debe ser igual a RuntimeDefault.
diagnostics.node_selector: daemonset/relay nodeSelector debe ser igual a {kubernetes.io/os:linux}.
diagnostics.owned: En el nodo de la bahía, DaemonSet relay debe controlar un Pod no marcado para eliminación con
  al menos un contenedor listo.
diagnostics.local_http: daemonset/relay Pod 127.0.0.1:8080 debe ser igual a north-103.
diagnostics.service_http: relay:8080 debe ser igual a north-103.
diagnostics.host_hostnetwork: daemonset/relay hostNetwork no debe estar activado.
diagnostics.host_hostpid: daemonset/relay hostPID no debe estar activado.
diagnostics.host_hostipc: daemonset/relay hostIPC no debe estar activado.
diagnostics.security_privileged: Ningún contenedor puede ser privilegiado.
diagnostics.security_allowprivilegeescalation: container securityContext allowPrivilegeEscalation debe ser igual
  a false.
diagnostics.security_drop: Cada contenedor debe retirar la capability ALL.
diagnostics.security_add: Ningún contenedor normal ni init debe tener capabilities añadidas.
diagnostics.status_desirednumberscheduled: daemonset/relay desiredNumberScheduled debe ser igual a 1.
diagnostics.status_numberready: daemonset/relay numberReady debe ser igual a 1.
diagnostics.status_numberavailable: daemonset/relay numberAvailable debe ser igual a 1.
