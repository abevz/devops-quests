title: Colocación de DaemonSet
brief: 'El endpoint de ruta local al nodo no está disponible. Restaura su respuesta en el nodo existente conservando
  el aislamiento de la carga.


  Trabaja en `~/quest` en la workstation. Archivos suministrados: `relay.yaml`, `service.yaml`.


  **Requisitos:**

  - La carga local al nodo existente puede ejecutarse en el nodo de la bahía sin modificar el nodo.

  - La carga local al nodo no tiene acceso al host ni privilegios elevados, se ejecuta sin root y conserva
  el aislamiento de llamadas al sistema suministrado.

  - El controlador local al nodo actual posee exactamente un Pod listo y disponible en el nodo de la bahía;
  ese Pod no está terminando.

  - Dentro de la carga `relay`, tanto `http://127.0.0.1:8080` como `http://relay:8080` devuelven `north-103`.


  Se observan resultados actuales, no cambios anteriores en etiquetas de nodos u otros Deployments.

  '
debrief: El selector, la seguridad, los contadores, el Pod propio y la respuesta coincidieron con las comprobaciones.
stages.0.brief: La carga aislada local del nodo debe estar lista y servir la ruta requerida.
hints.0.text: Desired zero puede significar que no hay ningún nodo elegible, ni una falla del contenedor.
hints.1.text: 'Un DaemonSet coloca un Pod por nodo elegible en lugar de tomar un valor replicas.


  Inspecciona las definiciones suministradas, los recursos actuales y los eventos.


  ```sh

  cat relay.yaml

  kubectl describe daemonset relay

  kubectl get nodes --show-labels

  kubectl get pods -l app=relay -o yaml

  ```'
hints.2.text: 'Reemplace solo los obsoletos selector y inspect por el verdadero controller owner. El único
  selector es kubernetes.io/os=linux. Conserva las etiquetas de nodos y no crees un Deployment sustituto.


  Verifica el resultado observado:


  ```sh

  kubectl get daemonset relay

  kubectl exec daemonset/relay -- wget -qO- -T 3 http://127.0.0.1:8080

  kubectl exec daemonset/relay -- wget -qO- -T 3 http://relay:8080

  ```


  Se esperan valores de uno para desired, ready y available, y north-103 en ambas direcciones HTTP.


  Restricciones y detalles suministrados: El DaemonSet `relay` se dirige solo a nodos con SO `linux`. El Pod
  `relay` no usa red/PID/IPC del host ni hostPath, tiene política de Pod sin root y seccomp `RuntimeDefault`;
  todos los contenedores normales e init no son privilegiados, impiden la escalada, eliminan `ALL` capabilities
  y no añaden ninguna. El DaemonSet `relay` programa exactamente `1` Pod controlado en `DQ_NODE_NAME`; está
  listo, disponible y no está terminando.'
phrases.0: Separé la elegibilidad del nodo del estado del contenedor.
phrases.1: Verifiqué los recuentos de propiedad y programación de DaemonSet.
phrases.2: Evité el host innecesario privileges.
questions.0.points.0: Su recuento deseado sigue los nodos elegibles.
questions.0.points.1: Los selectores affinity y tolerations afectan la ubicación.
questions.0.prompt: ¿Por qué un DaemonSet no utiliza un recuento de réplicas?
questions.1.points.0: No; El privilegio depende de la tarea real, no del controlador kind.
questions.1.points.1: Otorgue host access solo cuando una función específica lo necesite.
questions.1.prompt: ¿Debe ser privilegiado todo DaemonSet?
stages.0.objectives.0.text: La carga local al nodo existente puede ejecutarse en el nodo de la bahía sin modificar
  el nodo.
stages.0.objectives.1.text: La carga local al nodo no tiene acceso al host ni privilegios elevados, se ejecuta
  sin root y conserva el aislamiento de llamadas al sistema suministrado.
stages.0.objectives.2.text: El controlador local al nodo actual posee exactamente un Pod listo y disponible
  en el nodo de la bahía; ese Pod no está terminando.
stages.0.objectives.3.text: Dentro de la carga `relay`, tanto `http://127.0.0.1:8080` como `http://relay:8080`
  devuelven `north-103`.
diagnostics.node_selector: El selector puede no coincidir con ningún nodo, o el controlador puede seguir mostrando una generación anterior. Revise las etiquetas y espere un Pod deseado y actualizado sin Pods mal ubicados. [Causa y comprobación](guides#guide=kubernetes-workloads&section=q103-relay-bay-placement)
diagnostics.probe_0_0: El observador puede detenerse antes de comparar el estado si falla el proceso o su entrada. Revise Python y el acceso a relay. [Causa y comprobación](guides#guide=kubernetes-workloads&section=q103-placement-observer-input)
diagnostics.probe_0_1: El observador puede detenerse antes de señalar un control si falla Python o la entrada. Revise el acceso al DaemonSet y las herramientas. [Causa y comprobación](guides#guide=kubernetes-workloads&section=q103-security-observer-input)
diagnostics.host_hostnetwork: La reparación puede haber activado la red del host. Revise hostNetwork y mantenga el espacio de red del Pod relay. [Causa y comprobación](guides#guide=kubernetes-workloads&section=q103-relay-network-namespace)
diagnostics.host_hostpid: La plantilla puede compartir los procesos del host. Revise hostPID y manténgalo desactivado. [Causa y comprobación](guides#guide=kubernetes-workloads&section=q103-relay-process-namespace)
diagnostics.host_hostipc: La plantilla puede compartir IPC con el host. Revise hostIPC y mantenga aislado el IPC del Pod. [Causa y comprobación](guides#guide=kubernetes-workloads&section=q103-relay-ipc-namespace)
diagnostics.hostpath: Al cambiar la plantilla se pudo añadir un volumen hostPath. Revise las fuentes y elimine la dependencia de hostPath. [Causa y comprobación](guides#guide=kubernetes-workloads&section=q103-relay-volume-sources)
diagnostics.nonroot: Un contenedor puede carecer de runAsNonRoot efectivo, sobrescribirlo o indicar UID 0. Revise el Pod y todos los contenedores, incluidos init. Mantenga positivos los UID explícitos. [Causa y comprobación](guides#guide=kubernetes-workloads&section=q103-relay-user-policy)
diagnostics.seccomp: El filtro de llamadas puede haberse quitado o sobrescrito. Compruebe RuntimeDefault efectivo en contenedores normales e init, incluida la herencia del Pod. [Causa y comprobación](guides#guide=kubernetes-workloads&section=q103-relay-syscall-filter)
diagnostics.security_privileged: 'Un contenedor normal o init puede estar en modo privilegiado. Revise securityContext de cada uno y quite privileged: true. [Causa y comprobación](guides#guide=kubernetes-workloads&section=q103-relay-privileged-mode)'
diagnostics.security_allowprivilegeescalation: 'Un contenedor puede permitir escalada si el indicador falta o está activo. Defina allowPrivilegeEscalation: false en cada contenedor normal e init. [Causa y comprobación](guides#guide=kubernetes-workloads&section=q103-relay-privilege-escalation)'
diagnostics.security_drop: Un contenedor puede haber dejado de eliminar las capacidades por defecto. Compruebe ALL en drop de cada contenedor normal e init. [Causa y comprobación](guides#guide=kubernetes-workloads&section=q103-relay-drop-capabilities)
diagnostics.security_add: La plantilla puede volver a añadir capacidades tras eliminarlas. Revise que add esté vacío en cada contenedor normal e init. [Causa y comprobación](guides#guide=kubernetes-workloads&section=q103-relay-no-added-capabilities)
diagnostics.status_desirednumberscheduled: El selector puede excluir el nodo del entorno o seleccionar otro conjunto. Revise la elegibilidad para que el controlador indique exactamente un Pod deseado. [Causa y comprobación](guides#guide=kubernetes-workloads&section=q103-relay-desired-count)
diagnostics.status_numberready: El DaemonSet puede estar programado antes de que su worker esté listo. Revise los eventos y espere exactamente un Pod listo en su estado. [Causa y comprobación](guides#guide=kubernetes-workloads&section=q103-relay-ready-count)
diagnostics.status_numberavailable: Un Pod recién listo puede no contar aún como disponible o tener disponibilidad inestable. Tras el despliegue, compruebe exactamente un Pod disponible. [Causa y comprobación](guides#guide=kubernetes-workloads&section=q103-relay-available-count)
diagnostics.owned: Una etiqueta coincidente puede pertenecer a un Pod independiente o en terminación. Compruebe UID del controlador relay, nodo y disponibilidad en un Pod activo bajo su control. [Causa y comprobación](guides#guide=kubernetes-workloads&section=q103-relay-pod-ownership)
diagnostics.local_http: El Pod puede no escuchar en el puerto esperado o servir otro archivo. Revise la respuesta loopback dentro de relay y compárela con north-103. [Causa y comprobación](guides#guide=kubernetes-workloads&section=q103-relay-loopback-response)
diagnostics.service_http: El Service puede no seleccionar el Pod relay listo o fallar la resolución o el encaminamiento. Revise la respuesta por nombre aparte de loopback y compárela con north-103. [Causa y comprobación](guides#guide=kubernetes-workloads&section=q103-relay-service-response)
