title: DaemonSet placement
brief: 'The node-local route endpoint is unavailable. Restore its response on the existing node while retaining
  workload isolation.


  Work in `~/quest` on the workstation. Supplied files: `relay.yaml`, `service.yaml`.


  **Requirements:**

  - The existing node-local workload is eligible to run on the bay node without changing the node.

  - The node-local workload has no host access or elevated privileges, runs as non-root, and keeps the supplied
  syscall isolation.

  - The current node-local controller owns exactly one ready, available Pod on the bay node; that Pod is not
  terminating.

  - Inside the `relay` workload, both `http://127.0.0.1:8080` and `http://relay:8080` return `north-103`.


  Checks observe current results, not whether node labels or other Deployments were changed earlier.

  '
debrief: The selector, security settings, counts, owned Pod and response matched the checks.
stages.0.brief: The isolated node-local workload must be ready and serve the required route.
hints.0.text: Desired zero can mean no eligible node, not a container crash.
hints.1.text: |-
  A DaemonSet places one Pod per eligible node rather than taking a replicas value.

  Inspect the supplied definitions, current resources and events.

  Replace only the obsolete selector and inspect the real controller owner. The only selector is kubernetes.io/os=linux. Keep node labels unchanged and do not create a replacement Deployment.

  ```sh
  cat relay.yaml
  kubectl describe daemonset relay
  kubectl get nodes --show-labels
  kubectl get pods -l app=relay -o yaml
  ```
hints.2.text: |-
  Verify the observed result:

  ```sh
  kubectl get daemonset relay
  kubectl exec daemonset/relay -- wget -qO- -T 3 http://127.0.0.1:8080
  kubectl exec daemonset/relay -- wget -qO- -T 3 http://relay:8080
  ```

  Expect desired, ready and available counts of one, and north-103 at both HTTP addresses.

  Supplied constraints and details: DaemonSet `relay` targets only nodes running OS `linux`. The `relay` Pod has no host network/PID/IPC or hostPath, a non-root Pod policy and seccomp `RuntimeDefault`; all regular and init containers are non-privileged, forbid privilege escalation, drop `ALL` capabilities and add none. DaemonSet `relay` schedules exactly `1` controlled Pod on `DQ_NODE_NAME`; it is ready, available and not terminating.
phrases.0: I separated node eligibility from container health.
phrases.1: I verified DaemonSet ownership and scheduling counts.
phrases.2: I avoided unnecessary host privileges.
questions.0.points.0: Its desired count follows eligible nodes.
questions.0.points.1: Selectors, affinity and tolerations affect placement.
questions.0.prompt: Why does a DaemonSet not use a replica count?
questions.1.points.0: No; privilege depends on the actual task, not controller kind.
questions.1.points.1: Grant host access only when a specific function needs it.
questions.1.prompt: Must every DaemonSet be privileged?
stages.0.objectives.0.text: The existing node-local workload is eligible to run on the bay node without changing
  the node.
stages.0.objectives.1.text: The node-local workload has no host access or elevated privileges, runs as non-root,
  and keeps the supplied syscall isolation.
stages.0.objectives.2.text: The current node-local controller owns exactly one ready, available Pod on the
  bay node; that Pod is not terminating.
stages.0.objectives.3.text: Inside the `relay` workload, both `http://127.0.0.1:8080` and `http://relay:8080`
  return `north-103`.
diagnostics.node_selector: The selector may match no bay node, or the controller may still report an older generation. Check node labels and wait for the current generation to report one desired and updated Pod and no misscheduled Pods. [Cause and check](guides#guide=kubernetes-workloads&section=q103-relay-bay-placement)
diagnostics.probe_0_0: The placement observer can stop before comparing controller status when its process or input fails. Check the local Python tools and access to relay. [Cause and check](guides#guide=kubernetes-workloads&section=q103-placement-observer-input)
diagnostics.probe_0_1: The security observer can stop before reporting a control if its Python process or workspace input fails. Confirm that the live DaemonSet is readable and the local tools can start. [Cause and check](guides#guide=kubernetes-workloads&section=q103-security-observer-input)
diagnostics.host_hostnetwork: A scheduling repair may have enabled host networking. Inspect hostNetwork and keep relay in its Pod network namespace. [Cause and check](guides#guide=kubernetes-workloads&section=q103-relay-network-namespace)
diagnostics.host_hostpid: The Pod template may have been changed to share the host process namespace. Inspect hostPID and keep it disabled. [Cause and check](guides#guide=kubernetes-workloads&section=q103-relay-process-namespace)
diagnostics.host_hostipc: The Pod template may have been changed to share host IPC. Inspect hostIPC and keep the Pod IPC namespace isolated. [Cause and check](guides#guide=kubernetes-workloads&section=q103-relay-ipc-namespace)
diagnostics.hostpath: A hostPath volume may have been added while changing the template. Inspect the declared sources and remove any hostPath dependency. [Cause and check](guides#guide=kubernetes-workloads&section=q103-relay-volume-sources)
diagnostics.nonroot: A container may lack effective runAsNonRoot, override it, or specify UID 0. Inspect both Pod and container settings, including init containers, and keep all explicit user IDs positive. [Cause and check](guides#guide=kubernetes-workloads&section=q103-relay-user-policy)
diagnostics.seccomp: The default syscall filter may have been removed or overridden. Check the effective RuntimeDefault profile on regular and init containers, including inherited Pod settings. [Cause and check](guides#guide=kubernetes-workloads&section=q103-relay-syscall-filter)
diagnostics.security_privileged: A regular or init container may have gained privileged mode. Inspect each container’s securityContext and remove the privileged override. [Cause and check](guides#guide=kubernetes-workloads&section=q103-relay-privileged-mode)
diagnostics.security_allowprivilegeescalation: A container may allow privilege escalation because its flag is absent or enabled. Set allowPrivilegeEscalation explicitly to false on each regular and init container. [Cause and check](guides#guide=kubernetes-workloads&section=q103-relay-privilege-escalation)
diagnostics.security_drop: A container may no longer drop the default capability set. Check that the drop list contains ALL on each regular and init container. [Cause and check](guides#guide=kubernetes-workloads&section=q103-relay-drop-capabilities)
diagnostics.security_add: The template may add capabilities back after dropping them. Check the add list of every regular and init container and keep it empty. [Cause and check](guides#guide=kubernetes-workloads&section=q103-relay-no-added-capabilities)
diagnostics.status_desirednumberscheduled: The selector may exclude the bay node or select a different set of nodes. Check eligibility so the live controller reports exactly one desired placement. [Cause and check](guides#guide=kubernetes-workloads&section=q103-relay-desired-count)
diagnostics.status_numberready: The DaemonSet may be scheduled before its worker becomes ready. Check current Pod events and wait for exactly one ready Pod in the DaemonSet status. [Cause and check](guides#guide=kubernetes-workloads&section=q103-relay-ready-count)
diagnostics.status_numberavailable: A newly ready Pod may not yet count as available, or its readiness may be unstable. Check the reported available count after rollout and confirm exactly one. [Cause and check](guides#guide=kubernetes-workloads&section=q103-relay-available-count)
diagnostics.owned: A matching label can belong to a standalone or terminating Pod. Check the current relay controller UID, node placement and readiness together on one nonterminating owned Pod. [Cause and check](guides#guide=kubernetes-workloads&section=q103-relay-pod-ownership)
diagnostics.local_http: The running Pod may not listen on its expected port or serve the expected file. Check the loopback response inside relay and compare with north-103. [Cause and check](guides#guide=kubernetes-workloads&section=q103-relay-loopback-response)
diagnostics.service_http: The Service may not select the ready relay Pod, or discovery and service routing may fail. Check the named Service response separately from loopback and compare with north-103. [Cause and check](guides#guide=kubernetes-workloads&section=q103-relay-service-response)
