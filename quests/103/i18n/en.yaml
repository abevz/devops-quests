title: DaemonSet placement
brief: 'The node-local route endpoint is unavailable. Restore its response on the existing node while retaining
  workload isolation.


  Work in `~/quest` on the workstation. Supplied files: `relay.yaml`, `service.yaml`.


  **Requirements:**

  - The existing node-local workload is eligible to run on the bay node without changing the node.

  - The node-local workload has no host access or elevated privileges, runs as non-root, and keeps the supplied
  syscall isolation.

  - The current node-local controller owns exactly one ready, available Pod on the bay node; that Pod is not
  terminating.

  - Inside the `relay` workload, both `http://127.0.0.1:8080` and `http://relay:8080` return `north-103`.


  Checks observe current results, not whether node labels or other Deployments were changed earlier.

  '
debrief: The selector, security settings, counts, owned Pod and response matched the checks.
stages.0.brief: The isolated node-local workload must be ready and serve the required route.
hints.0.text: Desired zero can mean no eligible node, not a container crash.
hints.1.text: 'A DaemonSet places one Pod per eligible node rather than taking a replicas value.


  Inspect the supplied definitions, current resources and events.


  ```sh

  cat relay.yaml

  kubectl describe daemonset relay

  kubectl get nodes --show-labels

  kubectl get pods -l app=relay -o yaml

  ```'
hints.2.text: 'Replace only the obsolete selector and inspect the real controller owner. The only selector
  is kubernetes.io/os=linux. Keep node labels unchanged and do not create a replacement Deployment.


  Verify the observed result:


  ```sh

  kubectl get daemonset relay

  kubectl exec daemonset/relay -- wget -qO- -T 3 http://127.0.0.1:8080

  kubectl exec daemonset/relay -- wget -qO- -T 3 http://relay:8080

  ```


  Expect desired, ready and available counts of one, and north-103 at both HTTP addresses.


  Supplied constraints and details: DaemonSet `relay` targets only nodes running OS `linux`. The `relay` Pod
  has no host network/PID/IPC or hostPath, a non-root Pod policy and seccomp `RuntimeDefault`; all regular
  and init containers are non-privileged, forbid privilege escalation, drop `ALL` capabilities and add none.
  DaemonSet `relay` schedules exactly `1` controlled Pod on `DQ_NODE_NAME`; it is ready, available and not
  terminating.'
phrases.0: I separated node eligibility from container health.
phrases.1: I verified DaemonSet ownership and scheduling counts.
phrases.2: I avoided unnecessary host privileges.
questions.0.points.0: Its desired count follows eligible nodes.
questions.0.points.1: Selectors, affinity and tolerations affect placement.
questions.0.prompt: Why does a DaemonSet not use a replica count?
questions.1.points.0: No; privilege depends on the actual task, not controller kind.
questions.1.points.1: Grant host access only when a specific function needs it.
questions.1.prompt: Must every DaemonSet be privileged?
diagnostics.hostpath: DaemonSet relay must not use hostPath volumes.
diagnostics.nonroot: daemonset/relay runAsNonRoot must equal true.
diagnostics.seccomp: daemonset/relay seccompProfile.type must equal RuntimeDefault.
diagnostics.node_selector: daemonset/relay nodeSelector must equal {kubernetes.io/os:linux}.
diagnostics.owned: On the bay node, DaemonSet relay must control a Pod not marked for deletion that has at
  least one ready container.
diagnostics.local_http: daemonset/relay Pod 127.0.0.1:8080 must equal north-103.
diagnostics.service_http: relay:8080 must equal north-103.
diagnostics.host_hostnetwork: daemonset/relay hostNetwork must not be enabled.
diagnostics.host_hostpid: daemonset/relay hostPID must not be enabled.
diagnostics.host_hostipc: daemonset/relay hostIPC must not be enabled.
diagnostics.security_privileged: No container may be privileged.
diagnostics.security_allowprivilegeescalation: container securityContext allowPrivilegeEscalation must equal
  false.
diagnostics.security_drop: Every container must drop capability ALL.
diagnostics.security_add: Every regular and init container must have no added capabilities.
diagnostics.status_desirednumberscheduled: daemonset/relay desiredNumberScheduled must equal 1.
diagnostics.status_numberready: daemonset/relay numberReady must equal 1.
diagnostics.status_numberavailable: daemonset/relay numberAvailable must equal 1.
stages.0.objectives.0.text: The existing node-local workload is eligible to run on the bay node without changing
  the node.
stages.0.objectives.1.text: The node-local workload has no host access or elevated privileges, runs as non-root,
  and keeps the supplied syscall isolation.
stages.0.objectives.2.text: The current node-local controller owns exactly one ready, available Pod on the
  bay node; that Pod is not terminating.
stages.0.objectives.3.text: Inside the `relay` workload, both `http://127.0.0.1:8080` and `http://relay:8080`
  return `north-103`.
