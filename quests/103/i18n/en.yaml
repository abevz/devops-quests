title: DaemonSet placement
brief: 'Work in `~/quest` with `relay.json` and `service.json`. The `relay` DaemonSet has an obsolete selector, so it targets
  no node. A DaemonSet schedules a Pod on each eligible node; this private cluster has one Linux node. Replace the selector
  with exactly `kubernetes.io/os: linux`: extra selectors would restrict eligibility beyond the intended Linux nodes. Do not
  edit node labels or create a replacement Deployment.


  Keep the Pod namespaced: no host networking, host PID, host IPC or hostPath. Its Pod security context must set `runAsNonRoot:
  true` and `seccompProfile.type: RuntimeDefault`; every container and init container must be non-privileged, set `allowPrivilegeEscalation:
  false`, drop `ALL` capabilities and add none. Extra dropped capabilities are harmless. Wait for desired, ready and available
  counts of 1. Verify a nonterminating ready Pod owned by the `relay` DaemonSet runs on `DQ_NODE_NAME`, and that both its
  local `127.0.0.1:8080` and `relay:8080` return `north-103`. The checks observe these results, not whether node labels or
  other Deployments were ever changed. Work only in the offline bay.'
debrief: The selector, security settings, counts, owned Pod and response matched the checks.
stages.0.brief: The DaemonSet selector, security settings, three counts, owned ready Pod and service response match the brief.
stages.0.objectives.0.text: The DaemonSet selector, security settings, three counts, owned ready Pod and service response
  match the brief.
hints.0.text: Desired zero can mean no eligible node, not a container crash.
hints.1.text: A DaemonSet places one Pod per eligible node rather than taking a replicas value.
hints.2.text: Replace only the obsolete selector and inspect the real controller owner.
phrases.0: I separated node eligibility from container health.
phrases.1: I verified DaemonSet ownership and scheduling counts.
phrases.2: I avoided unnecessary host privileges.
questions.0.points.0: Its desired count follows eligible nodes.
questions.0.points.1: Selectors, affinity and tolerations affect placement.
questions.0.prompt: Why does a DaemonSet not use a replica count?
questions.1.points.0: No; privilege depends on the actual task, not controller kind.
questions.1.points.1: Grant host access only when a specific function needs it.
questions.1.prompt: Must every DaemonSet be privileged?
diagnostics.hostpath: DaemonSet relay must not use hostPath volumes.
diagnostics.nonroot: daemonset/relay runAsNonRoot must equal true.
diagnostics.seccomp: daemonset/relay seccompProfile.type must equal RuntimeDefault.
diagnostics.node_selector: daemonset/relay nodeSelector must equal {kubernetes.io/os:linux}.
diagnostics.owned: On the bay node, DaemonSet relay must control a Pod not marked for deletion that has at least one ready
  container.
diagnostics.local_http: daemonset/relay Pod 127.0.0.1:8080 must equal north-103.
diagnostics.service_http: relay:8080 must equal north-103.
diagnostics.host_hostnetwork: daemonset/relay hostNetwork must not be enabled.
diagnostics.host_hostpid: daemonset/relay hostPID must not be enabled.
diagnostics.host_hostipc: daemonset/relay hostIPC must not be enabled.
diagnostics.security_privileged: No container may be privileged.
diagnostics.security_allowprivilegeescalation: container securityContext allowPrivilegeEscalation must equal false.
diagnostics.security_drop: Every container must drop capability ALL.
diagnostics.security_add: Every regular and init container must have no added capabilities.
diagnostics.status_desirednumberscheduled: daemonset/relay desiredNumberScheduled must equal 1.
diagnostics.status_numberready: daemonset/relay numberReady must equal 1.
diagnostics.status_numberavailable: daemonset/relay numberAvailable must equal 1.
