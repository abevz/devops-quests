title: DaemonSet placement
brief: 'The node relay is a DaemonSet with an obsolete station-zone selector, so it targets no node. The
  private cluster has one Linux node. Select kubernetes.io/os: linux without editing node labels or creating
  a replacement Deployment. Keep a non-privileged, namespaced workload: this relay needs no hostPath,
  host networking or host PID namespace. Verify the DaemonSet desired/ready counts, the Pod controller
  owner and its real service response.


  Quest files in `~/quest` (some appear in later stages): `relay.json`, `service.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: The DaemonSet schedules one healthy owned Pod on the Linux node and serves
  north-103 without host privileges.'
debrief: Node eligibility was repaired without granting node administration or host access.
stages.0.brief: 'The DaemonSet schedules one healthy owned Pod on the Linux node and serves north-103
  without host privileges.


  Success criteria: The DaemonSet schedules one healthy owned Pod on the Linux node and serves north-103
  without host privileges.'
stages.0.objectives.0.text: The DaemonSet schedules one healthy owned Pod on the Linux node and serves
  north-103 without host privileges.
hints.0.text: Desired zero can mean no eligible node, not a container crash.
hints.1.text: A DaemonSet places one Pod per eligible node rather than taking a replicas value.
hints.2.text: Replace only the obsolete selector and inspect the real controller owner.
phrases.0: I separated node eligibility from container health.
phrases.1: I verified DaemonSet ownership and scheduling counts.
phrases.2: I avoided unnecessary host privileges.
questions.0.points.0: Its desired count follows eligible nodes.
questions.0.points.1: Selectors, affinity and tolerations affect placement.
questions.0.prompt: Why does a DaemonSet not use a replica count?
questions.1.points.0: No; privilege depends on the actual task, not controller kind.
questions.1.points.1: Grant host access only when a specific function needs it.
questions.1.prompt: Must every DaemonSet be privileged?
