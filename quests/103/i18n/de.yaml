title: DaemonSet Platzierung
brief: "Der knotenlokale Routenendpunkt ist nicht verfügbar. Stellen Sie den Workload auf dem geeigneten Linux-Knoten\
  \ unter Wahrung seiner Isolation her.\n\nArbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte Dateien:\
  \ `relay.json`, `service.json`.\n\n**Anforderungen:**\n- DaemonSet `relay` zielt über seinen Knotenlabel-Selektor\
  \ auf OS `linux`, ohne weitere Labels in diesem Selektor.\n- DaemonSet `relay`:\n  - Host-Netzwerk deaktiviert.\n\
  - DaemonSet `relay`:\n  - Host-PID-Namensraum deaktiviert.\n- DaemonSet `relay`:\n  - Host-IPC-Namensraum deaktiviert.\n\
  - DaemonSet `relay`:\n  - keine hostPath-Volumes.\n- DaemonSet `relay` hat eine Richtlinie auf Pod-Ebene, die\
  \ Ausführung ohne root verlangt.\n- DaemonSet `relay`:\n  - keine privilegierten Container.\n- DaemonSet `relay`:\n\
  \  - Privilegienerhöhung für alle Container deaktiviert.\n- DaemonSet `relay`:\n  - alle regulären und Init-Container\
  \ verwerfen Capability ALL.\n- DaemonSet `relay`:\n  - keine zusätzlichen Capabilities in regulären oder Init-Containern.\n\
  - DaemonSet `relay`:\n  - Pod-seccomp-Profil `RuntimeDefault`.\n- DaemonSet `relay`:\n  - gewünschte Pods `1`.\n\
  - DaemonSet `relay`:\n  - bereite Pods `1`.\n- DaemonSet `relay`:\n  - verfügbare Pods `1`.\n- Auf Knoten `DQ_NODE_NAME`\
  \ kontrolliert DaemonSet `relay` einen nicht terminierenden Pod mit bereitem Container.\n- Von `daemonset/relay`\
  \ liefert HTTP `http://127.0.0.1:8080` den Wert `north-103`.\n- Von `daemonset/relay` liefert HTTP `http://relay:8080`\
  \ den Wert `north-103`.\n\n**Vor Check & finish selbst prüfen:**\nFühren Sie diese Beobachtungsbefehle in `~/quest`\
  \ auf der Workstation aus; `kubectl exec` beobachtet den Container des genannten Workloads.\n- Einstellungen,\
  \ Identität und Status entsprechen den Anforderungen.\n\n  ```sh\n  kubectl get daemonset relay -o yaml\n  kubectl\
  \ get pods -l app=relay -o json\n  ```\n- `kubectl exec daemonset/relay -- wget -qO- -T 3 http://127.0.0.1:8080`\
  \ — Der Workload-Verbraucher erhält `north-103`.\n- `kubectl exec daemonset/relay -- wget -qO- -T 3 http://relay:8080`\
  \ — Der Workload-Verbraucher erhält `north-103`.\n\nGeprüft werden aktuelle Ergebnisse, keine früheren Änderungen\
  \ an Knotenlabels oder anderen Deployments.\n"
debrief: Selektor, Sicherheitseinstellungen, Zähler, zugehöriger Pod und Antwort entsprachen den Prüfungen.
stages.0.brief: 'Der isolierte knotenlokale Workload muss bereit sein und die geforderte Route liefern.

  '
hints.0.text: Desired zero kann bedeuten, dass kein geeigneter Knoten vorhanden ist, kein Container-Absturz.
hints.1.text: Ein DaemonSet platziert einen Pod pro berechtigtem Knoten, anstatt einen replicas-Wert anzunehmen.
hints.2.text: 'Ersetzen Sie nur die veralteten selector und inspect durch die echten controller owner. Der einzige
  Selektor ist kubernetes.io/os=linux. Behalten Sie Knotenlabels bei und erstellen Sie kein Ersatz-Deployment.

  '
phrases.0: Ich habe die Knotenberechtigung von der Containergesundheit getrennt.
phrases.1: Ich habe die Besitz- und Planungszahlen von DaemonSet überprüft.
phrases.2: Ich habe den unnötigen Host privileges vermieden.
questions.0.points.0: Die gewünschte Anzahl folgt den berechtigten Knoten.
questions.0.points.1: Die Selektoren affinity und tolerations beeinflussen die Platzierung.
questions.0.prompt: Warum verwendet ein DaemonSet keine Replikatanzahl?
questions.1.points.0: NEIN; Die Berechtigung hängt von der tatsächlichen Aufgabe ab, nicht vom Controller kind.
questions.1.points.1: Gewähren Sie Host access nur, wenn eine bestimmte Funktion dies benötigt.
questions.1.prompt: Muss jeder DaemonSet privilegiert sein?
diagnostics.hostpath: DaemonSet relay darf keine hostPath-Volumes verwenden.
diagnostics.nonroot: daemonset/relay runAsNonRoot muss true entsprechen.
diagnostics.seccomp: daemonset/relay seccompProfile.type muss RuntimeDefault entsprechen.
diagnostics.node_selector: daemonset/relay nodeSelector muss {kubernetes.io/os:linux} entsprechen.
diagnostics.owned: Auf dem Node der Umgebung muss DaemonSet relay einen nicht zur Löschung markierten Pod mit mindestens
  einem bereiten Container kontrollieren.
diagnostics.local_http: daemonset/relay Pod 127.0.0.1:8080 muss north-103 entsprechen.
diagnostics.service_http: relay:8080 muss north-103 entsprechen.
diagnostics.host_hostnetwork: daemonset/relay hostNetwork darf nicht aktiviert sein.
diagnostics.host_hostpid: daemonset/relay hostPID darf nicht aktiviert sein.
diagnostics.host_hostipc: daemonset/relay hostIPC darf nicht aktiviert sein.
diagnostics.security_privileged: Kein Container darf privilegiert sein.
diagnostics.security_allowprivilegeescalation: container securityContext allowPrivilegeEscalation muss false entsprechen.
diagnostics.security_drop: Jeder Container muss die Capability ALL entfernen.
diagnostics.security_add: Weder reguläre Container noch Init-Container dürfen hinzugefügte Capabilities haben.
diagnostics.status_desirednumberscheduled: daemonset/relay desiredNumberScheduled muss 1 entsprechen.
diagnostics.status_numberready: daemonset/relay numberReady muss 1 entsprechen.
diagnostics.status_numberavailable: daemonset/relay numberAvailable muss 1 entsprechen.
