title: DaemonSet Platzierung
brief: 'Der knotenlokale Routenendpunkt ist nicht verfügbar. Stellen Sie seine Antwort auf dem bestehenden
  Knoten wieder her und erhalten Sie die Workload-Isolation.


  Arbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte Dateien: `relay.yaml`, `service.yaml`.


  **Anforderungen:**

  - Die bestehende knotenlokale Workload kann auf dem Bay-Knoten laufen, ohne den Knoten zu ändern.

  - Die knotenlokale Workload hat weder Hostzugriff noch erhöhte Rechte, läuft ohne Root und behält die mitgelieferte
  Systemaufruf-Isolation.

  - Der aktuelle knotenlokale Controller besitzt genau einen bereiten, verfügbaren Pod auf dem Bay-Knoten;
  dieser wird nicht beendet.

  - Im Workload `relay` liefern sowohl `http://127.0.0.1:8080` als auch `http://relay:8080` den Wert `north-103`.


  Geprüft werden aktuelle Ergebnisse, keine früheren Änderungen an Knotenlabels oder anderen Deployments.

  '
debrief: Selektor, Sicherheitseinstellungen, Zähler, zugehöriger Pod und Antwort entsprachen den Prüfungen.
stages.0.brief: Der isolierte knotenlokale Workload muss bereit sein und die geforderte Route liefern.
hints.0.text: Desired zero kann bedeuten, dass kein geeigneter Knoten vorhanden ist, kein Container-Absturz.
hints.1.text: |-
  Ein DaemonSet platziert einen Pod pro berechtigtem Knoten, anstatt einen replicas-Wert anzunehmen.

  Prüfen Sie die mitgelieferten Definitionen, aktuellen Ressourcen und Ereignisse.

  Ersetzen Sie nur die veralteten selector und inspect durch die echten controller owner. Der einzige Selektor ist kubernetes.io/os=linux. Behalten Sie Knotenlabels bei und erstellen Sie kein Ersatz-Deployment.

  ```sh
  cat relay.yaml
  kubectl describe daemonset relay
  kubectl get nodes --show-labels
  kubectl get pods -l app=relay -o yaml
  ```
hints.2.text: |-
  Prüfen Sie das beobachtete Ergebnis:

  ```sh
  kubectl get daemonset relay
  kubectl exec daemonset/relay -- wget -qO- -T 3 http://127.0.0.1:8080
  kubectl exec daemonset/relay -- wget -qO- -T 3 http://relay:8080
  ```

  Erwartet werden je eins für desired, ready und available sowie north-103 an beiden HTTP-Adressen.

  Mitgelieferte Einschränkungen und Details: DaemonSet `relay` zielt nur auf Knoten mit OS `linux`. Der Pod `relay` nutzt weder Host-Netzwerk/PID/IPC noch hostPath, hat eine Pod-Richtlinie ohne root und seccomp `RuntimeDefault`; alle regulären und Init-Container sind nicht privilegiert, verbieten Privilegienerhöhung, verwerfen `ALL` Capabilities und fügen keine hinzu. DaemonSet `relay` plant genau `1` kontrollierten Pod auf `DQ_NODE_NAME`; er ist bereit, verfügbar und wird nicht beendet.
phrases.0: Ich habe die Knotenberechtigung von der Containergesundheit getrennt.
phrases.1: Ich habe die Besitz- und Planungszahlen von DaemonSet überprüft.
phrases.2: Ich habe den unnötigen Host privileges vermieden.
questions.0.points.0: Die gewünschte Anzahl folgt den berechtigten Knoten.
questions.0.points.1: Die Selektoren affinity und tolerations beeinflussen die Platzierung.
questions.0.prompt: Warum verwendet ein DaemonSet keine Replikatanzahl?
questions.1.points.0: NEIN; Die Berechtigung hängt von der tatsächlichen Aufgabe ab, nicht vom Controller kind.
questions.1.points.1: Gewähren Sie Host access nur, wenn eine bestimmte Funktion dies benötigt.
questions.1.prompt: Muss jeder DaemonSet privilegiert sein?
stages.0.objectives.0.text: Die bestehende knotenlokale Workload kann auf dem Bay-Knoten laufen, ohne den Knoten
  zu ändern.
stages.0.objectives.1.text: Die knotenlokale Workload hat weder Hostzugriff noch erhöhte Rechte, läuft ohne
  Root und behält die mitgelieferte Systemaufruf-Isolation.
stages.0.objectives.2.text: Der aktuelle knotenlokale Controller besitzt genau einen bereiten, verfügbaren
  Pod auf dem Bay-Knoten; dieser wird nicht beendet.
stages.0.objectives.3.text: Im Workload `relay` liefern sowohl `http://127.0.0.1:8080` als auch `http://relay:8080`
  den Wert `north-103`.
diagnostics.node_selector: Der Selektor passt möglicherweise auf keinen Knoten oder der Controller könnte noch eine ältere Generation melden. Prüfen Sie Knotenlabels und warten Sie auf einen gewünschten und aktualisierten Pod ohne Fehlplatzierungen. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q103-relay-bay-placement)
diagnostics.probe_0_0: Die Platzierungsprüfung kann vor dem Statusvergleich abbrechen, wenn Prozess oder Eingabe fehlschlagen. Prüfen Sie Python und den Zugriff auf relay. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q103-placement-observer-input)
diagnostics.probe_0_1: Die Sicherheitsprüfung kann vor der Meldung einer Vorgabe abbrechen, wenn Python oder Eingaben fehlschlagen. Prüfen Sie Zugriff auf das DaemonSet und lokale Werkzeuge. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q103-security-observer-input)
diagnostics.host_hostnetwork: Die Platzierungsreparatur hat möglicherweise das Hostnetz aktiviert. Prüfen Sie hostNetwork und behalten Sie den Netzwerk-Namespace des Pods relay. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q103-relay-network-namespace)
diagnostics.host_hostpid: Die Pod-Vorlage verwendet möglicherweise den Prozess-Namespace des Hosts. Prüfen Sie hostPID und lassen Sie es deaktiviert. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q103-relay-process-namespace)
diagnostics.host_hostipc: Die Pod-Vorlage teilt möglicherweise Host-IPC. Prüfen Sie hostIPC und behalten Sie den isolierten IPC-Namespace des Pods. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q103-relay-ipc-namespace)
diagnostics.hostpath: Beim Ändern der Vorlage wurde möglicherweise ein hostPath-Volume hinzugefügt. Prüfen Sie die Volume-Quellen und entfernen Sie hostPath-Abhängigkeiten. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q103-relay-volume-sources)
diagnostics.nonroot: Einem Container fehlt möglicherweise wirksames runAsNonRoot, oder er überschreibt es beziehungsweise setzt UID 0. Prüfen Sie Pod- und Containereinstellungen einschließlich Init-Containern. Explizite UIDs müssen positiv sein. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q103-relay-user-policy)
diagnostics.seccomp: Der Standardfilter wurde möglicherweise entfernt oder überschrieben. Prüfen Sie wirksames RuntimeDefault für reguläre und Init-Container einschließlich der geerbten Pod-Einstellungen. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q103-relay-syscall-filter)
diagnostics.security_privileged: 'Ein regulärer oder Init-Container läuft möglicherweise privilegiert. Prüfen Sie jeden securityContext und entfernen Sie privileged: true. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q103-relay-privileged-mode)'
diagnostics.security_allowprivilegeescalation: Ein Container erlaubt möglicherweise Rechteausweitung, wenn das Flag fehlt oder aktiv ist. Setzen Sie allowPrivilegeEscalation für jeden regulären und Init-Container ausdrücklich auf false. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q103-relay-privilege-escalation)
diagnostics.security_drop: Ein Container entfernt möglicherweise nicht mehr die Standard-Capabilities. Prüfen Sie ALL in der drop-Liste jedes regulären und Init-Containers. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q103-relay-drop-capabilities)
diagnostics.security_add: Die Vorlage fügt möglicherweise zuvor entfernte Capabilities wieder hinzu. Prüfen Sie eine leere add-Liste für jeden regulären und Init-Container. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q103-relay-no-added-capabilities)
diagnostics.status_desirednumberscheduled: Der Selektor schließt möglicherweise den Übungsknoten aus oder wählt andere Knoten. Prüfen Sie die Eignung, sodass der Controller genau einen gewünschten Pod meldet. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q103-relay-desired-count)
diagnostics.status_numberready: Das DaemonSet kann vor der Bereitschaft des Worker-Containers eingeplant sein. Prüfen Sie Pod-Ereignisse und warten Sie auf genau einen bereiten Pod im DaemonSet-Status. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q103-relay-ready-count)
diagnostics.status_numberavailable: Ein gerade bereiter Pod zählt möglicherweise noch nicht als verfügbar oder seine Bereitschaft schwankt. Bestätigen Sie nach dem Rollout genau einen verfügbaren Pod. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q103-relay-available-count)
diagnostics.owned: Ein passendes Label kann zu einem eigenständigen oder terminierenden Pod gehören. Prüfen Sie aktuelle relay-Controller-UID, Knoten und Bereitschaft gemeinsam an einem nicht terminierenden zugehörigen Pod. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q103-relay-pod-ownership)
diagnostics.local_http: Der Pod lauscht möglicherweise nicht auf dem erwarteten Port oder liefert eine andere Datei. Prüfen Sie die Loopback-Antwort in relay und vergleichen Sie sie mit north-103. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q103-relay-loopback-response)
diagnostics.service_http: Der Service wählt möglicherweise keinen bereiten relay-Pod aus, oder Namensauflösung beziehungsweise Weiterleitung scheitert. Prüfen Sie die Antwort über den Service-Namen getrennt von Loopback und vergleichen Sie sie mit north-103. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q103-relay-service-response)
