title: DaemonSet Platzierung
brief: 'Der Knoten relay ist ein DaemonSet mit einem veralteten station-zone selector und zielt daher
  auf keinen Knoten ab. Der private Cluster verfügt über einen Linux-Knoten. Wählen Sie kubernetes.io/os:
  linux aus, ohne den Knoten labels zu bearbeiten oder einen Ersatz Deployment zu erstellen. Behalten
  Sie eine nicht privilegierte Workload mit Namensraum bei: Dieser relay benötigt keinen hostPath, Host
  networking oder Host PID namespace. Überprüfen Sie die Anzahl der DaemonSet desired/ready, den Besitzer
  des Pod-Controllers und seine tatsächliche Servicereaktion.


  Questdateien in `~/quest` (einige erscheinen in späteren Phasen): `relay.json`, `service.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: Der DaemonSet plant einen fehlerfreien Pod auf dem Linux-Knoten und bedient
  north-103 ohne Host privileges.'
debrief: Die Knotenberechtigung wurde repariert, ohne dass Knotenverwaltung oder Hostzugriff gewährt wurden.
stages.0.brief: 'Erfolgskriterien: DaemonSet plant einen fehlerfreien Pod auf dem Linux-Knoten und bedient
  north-103 ohne Host privileges.'
stages.0.objectives.0.text: Der DaemonSet plant einen fehlerfreien Pod auf dem Linux-Knoten und bedient
  north-103 ohne Host privileges.
hints.0.text: Desired zero kann bedeuten, dass kein geeigneter Knoten vorhanden ist, kein Container-Absturz.
hints.1.text: Ein DaemonSet platziert einen Pod pro berechtigtem Knoten, anstatt einen replicas-Wert anzunehmen.
hints.2.text: Ersetzen Sie nur die veralteten selector und inspect durch die echten controller owner.
phrases.0: Ich habe die Knotenberechtigung von der Containergesundheit getrennt.
phrases.1: Ich habe die Besitz- und Planungszahlen von DaemonSet überprüft.
phrases.2: Ich habe den unnötigen Host privileges vermieden.
questions.0.points.0: Die gewünschte Anzahl folgt den berechtigten Knoten.
questions.0.points.1: Die Selektoren affinity und tolerations beeinflussen die Platzierung.
questions.0.prompt: Warum verwendet ein DaemonSet keine Replikatanzahl?
questions.1.points.0: NEIN; Die Berechtigung hängt von der tatsächlichen Aufgabe ab, nicht vom Controller
  kind.
questions.1.points.1: Gewähren Sie Host access nur, wenn eine bestimmte Funktion dies benötigt.
questions.1.prompt: Muss jeder DaemonSet privilegiert sein?
