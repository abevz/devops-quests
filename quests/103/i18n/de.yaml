title: DaemonSet Platzierung
brief: 'Arbeite in `~/quest` mit `relay.json` und `service.json`. Das DaemonSet `relay` hat einen veralteten Selektor und wählt keinen Knoten aus. Ein DaemonSet plant auf jedem geeigneten Knoten einen Pod; dieser private Cluster hat einen Linux-Knoten. Ersetze den Selektor durch genau `kubernetes.io/os: linux`: Zusätzliche Selektoren würden die Eignung über die vorgesehenen Linux-Knoten hinaus einschränken. Ändere keine Knotenlabels und erstelle kein Ersatz-Deployment.


  Halte den Pod im Namespace: kein Host-Netzwerk, Host-PID, Host-IPC oder hostPath. Der Pod-Sicherheitskontext muss `runAsNonRoot: true` und `seccompProfile.type: RuntimeDefault` setzen; jeder Container und Init-Container muss unprivilegiert sein, `allowPrivilegeEscalation: false` setzen, die Capabilities `ALL` abgeben und keine hinzufügen. Zusätzliche abgegebene Capabilities sind unbedenklich. Warte auf je 1 für desired, ready und available. Prüfe, dass ein nicht terminierender bereiter Pod im Besitz des DaemonSets `relay` auf `DQ_NODE_NAME` läuft und sowohl sein lokales `127.0.0.1:8080` als auch `relay:8080` `north-103` liefern. Die Prüfungen beobachten diese Ergebnisse, nicht ob Knotenlabels oder andere Deployments jemals geändert wurden. Arbeite nur in der Offline-Umgebung.'
debrief: Selektor, Sicherheitseinstellungen, Zähler, zugehöriger Pod und Antwort entsprachen den Prüfungen.
stages.0.brief: DaemonSet-Selektor, Sicherheitseinstellungen, drei Zähler, zugehöriger bereiter Pod und Service-Antwort entsprechen der Aufgabe.
stages.0.objectives.0.text: DaemonSet-Selektor, Sicherheitseinstellungen, drei Zähler, zugehöriger bereiter Pod und Service-Antwort entsprechen der Aufgabe.
hints.0.text: Desired zero kann bedeuten, dass kein geeigneter Knoten vorhanden ist, kein Container-Absturz.
hints.1.text: Ein DaemonSet platziert einen Pod pro berechtigtem Knoten, anstatt einen replicas-Wert anzunehmen.
hints.2.text: Ersetzen Sie nur die veralteten selector und inspect durch die echten controller owner.
phrases.0: Ich habe die Knotenberechtigung von der Containergesundheit getrennt.
phrases.1: Ich habe die Besitz- und Planungszahlen von DaemonSet überprüft.
phrases.2: Ich habe den unnötigen Host privileges vermieden.
questions.0.points.0: Die gewünschte Anzahl folgt den berechtigten Knoten.
questions.0.points.1: Die Selektoren affinity und tolerations beeinflussen die Platzierung.
questions.0.prompt: Warum verwendet ein DaemonSet keine Replikatanzahl?
questions.1.points.0: NEIN; Die Berechtigung hängt von der tatsächlichen Aufgabe ab, nicht vom Controller
  kind.
questions.1.points.1: Gewähren Sie Host access nur, wenn eine bestimmte Funktion dies benötigt.
questions.1.prompt: Muss jeder DaemonSet privilegiert sein?
