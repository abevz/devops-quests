title: Umieszczenie DaemonSet
brief: "Lokalny punkt trasy węzła jest niedostępny. Przywróć obciążenie na odpowiednim węźle Linux, zachowując izolację.\n\
  \nPracuj w `~/quest` na workstation. Dostarczone pliki: `relay.json`, `service.json`.\n\n**Wymagania:**\n- DaemonSet\
  \ `relay` wybiera system `linux` przez selektor etykiet węzłów, bez innych etykiet w tym selektorze.\n- DaemonSet\
  \ `relay`:\n  - sieć hosta wyłączona.\n- DaemonSet `relay`:\n  - przestrzeń PID hosta wyłączona.\n- DaemonSet\
  \ `relay`:\n  - przestrzeń IPC hosta wyłączona.\n- DaemonSet `relay`:\n  - brak woluminów hostPath.\n- DaemonSet\
  \ `relay` ma zasadę na poziomie Poda wymagającą wykonania bez root.\n- DaemonSet `relay`:\n  - brak uprzywilejowanych\
  \ kontenerów.\n- DaemonSet `relay`:\n  - eskalacja uprawnień wyłączona dla wszystkich kontenerów.\n- DaemonSet\
  \ `relay`:\n  - wszystkie kontenery zwykłe i init odrzucają capability ALL.\n- DaemonSet `relay`:\n  - brak dodanych\
  \ capabilities w kontenerach zwykłych i init.\n- DaemonSet `relay`:\n  - profil seccomp Poda `RuntimeDefault`.\n\
  - DaemonSet `relay`:\n  - żądane Pody `1`.\n- DaemonSet `relay`:\n  - gotowe Pody `1`.\n- DaemonSet `relay`:\n\
  \  - dostępne Pody `1`.\n- Na węźle `DQ_NODE_NAME` DaemonSet `relay` kontroluje niekończony Pod z gotowym kontenerem.\n\
  - Z `daemonset/relay` HTTP `http://127.0.0.1:8080` zwraca `north-103`.\n- Z `daemonset/relay` HTTP `http://relay:8080`\
  \ zwraca `north-103`.\n\n**Sprawdź samodzielnie przed Check & finish:**\nWykonuj te polecenia obserwacyjne w `~/quest`\
  \ na workstation; `kubectl exec` obserwuje kontener wskazanego obciążenia.\n- Ustawienia, tożsamość i status odpowiadają\
  \ wymaganiom.\n\n  ```sh\n  kubectl get daemonset relay -o yaml\n  kubectl get pods -l app=relay -o json\n  ```\n\
  - `kubectl exec daemonset/relay -- wget -qO- -T 3 http://127.0.0.1:8080` — Odbiorca obciążenia otrzymuje `north-103`.\n\
  - `kubectl exec daemonset/relay -- wget -qO- -T 3 http://relay:8080` — Odbiorca obciążenia otrzymuje `north-103`.\n\
  \nSprawdzane są bieżące wyniki, nie wcześniejsze zmiany etykiet węzłów lub innych Deployment.\n"
debrief: Selektor, ustawienia bezpieczeństwa, liczniki, należący Pod i odpowiedź odpowiadały kontrolom.
stages.0.brief: 'Izolowane obciążenie lokalne węzła ma być gotowe i obsługiwać wymaganą trasę.

  '
hints.0.text: Desired zero może oznaczać brak kwalifikującego się węzła, a nie awarię kontenera.
hints.1.text: DaemonSet umieszcza jeden Pod na każdy kwalifikujący się węzeł, zamiast przyjmować wartość replicas.
hints.2.text: 'Wymień tylko przestarzały selector i sprawdź prawdziwy controller owner. Jedyny selektor to kubernetes.io/os=linux.
  Zachowaj etykiety węzłów i nie twórz zastępczego Deployment.

  '
phrases.0: Oddzieliłem uprawnienia węzła od stanu kontenera.
phrases.1: Sprawdziłem stan posiadania i harmonogramu DaemonSet.
phrases.2: Uniknąłem niepotrzebnego host privileges.
questions.0.points.0: Żądana liczba jest zgodna z kwalifikującymi się węzłami.
questions.0.points.1: Selektory, affinity i tolerations wpływają na położenie.
questions.0.prompt: Dlaczego DaemonSet nie używa licznika replik?
questions.1.points.0: NIE; uprawnienia zależą od rzeczywistego zadania, a nie rodzaju kontrolera.
questions.1.points.1: Przyznaj host access tylko wtedy, gdy wymaga tego konkretna funkcja.
questions.1.prompt: Czy każdy DaemonSet musi być uprzywilejowany?
diagnostics.hostpath: DaemonSet relay nie może używać wolumenów hostPath.
diagnostics.nonroot: daemonset/relay runAsNonRoot musi być równe true.
diagnostics.seccomp: daemonset/relay seccompProfile.type musi być równe RuntimeDefault.
diagnostics.node_selector: daemonset/relay nodeSelector musi być równe {kubernetes.io/os:linux}.
diagnostics.owned: Na węźle zatoki DaemonSet relay musi kontrolować Pod nieoznaczony do usunięcia, z co najmniej
  jednym gotowym kontenerem.
diagnostics.local_http: daemonset/relay Pod 127.0.0.1:8080 musi być równe north-103.
diagnostics.service_http: relay:8080 musi być równe north-103.
diagnostics.host_hostnetwork: daemonset/relay hostNetwork nie może być włączone.
diagnostics.host_hostpid: daemonset/relay hostPID nie może być włączone.
diagnostics.host_hostipc: daemonset/relay hostIPC nie może być włączone.
diagnostics.security_privileged: Żaden kontener nie może być uprzywilejowany.
diagnostics.security_allowprivilegeescalation: container securityContext allowPrivilegeEscalation musi być równe
  false.
diagnostics.security_drop: Każdy kontener musi odebrać capability ALL.
diagnostics.security_add: Żaden zwykły kontener ani kontener init nie może mieć dodanych capabilities.
diagnostics.status_desirednumberscheduled: daemonset/relay desiredNumberScheduled musi być równe 1.
diagnostics.status_numberready: daemonset/relay numberReady musi być równe 1.
diagnostics.status_numberavailable: daemonset/relay numberAvailable musi być równe 1.
