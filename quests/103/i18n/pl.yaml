title: Umieszczenie DaemonSet
brief: 'Lokalny dla węzła punkt trasy jest niedostępny. Przywróć odpowiedź na istniejącym węźle, zachowując
  izolację obciążenia.


  Pracuj w `~/quest` na workstation. Dostarczone pliki: `relay.yaml`, `service.yaml`.


  **Wymagania:**

  - Istniejące obciążenie lokalne dla węzła może działać na węźle zatoki bez zmiany węzła.

  - Obciążenie lokalne dla węzła nie ma dostępu do hosta ani podwyższonych uprawnień, działa bez roota i zachowuje
  dostarczoną izolację wywołań systemowych.

  - Bieżący kontroler lokalny dla węzła jest właścicielem dokładnie jednego gotowego i dostępnego Poda na węźle
  zatoki; Pod nie jest usuwany.

  - Wewnątrz obciążenia `relay` zarówno `http://127.0.0.1:8080`, jak i `http://relay:8080` zwracają `north-103`.


  Sprawdzane są bieżące wyniki, nie wcześniejsze zmiany etykiet węzłów lub innych Deployment.

  '
debrief: Selektor, ustawienia bezpieczeństwa, liczniki, należący Pod i odpowiedź odpowiadały kontrolom.
stages.0.brief: Izolowane obciążenie lokalne węzła ma być gotowe i obsługiwać wymaganą trasę.
hints.0.text: Desired zero może oznaczać brak kwalifikującego się węzła, a nie awarię kontenera.
hints.1.text: 'DaemonSet umieszcza jeden Pod na każdy kwalifikujący się węzeł, zamiast przyjmować wartość replicas.


  Sprawdź dostarczone definicje, bieżące zasoby i zdarzenia.


  ```sh

  cat relay.yaml

  kubectl describe daemonset relay

  kubectl get nodes --show-labels

  kubectl get pods -l app=relay -o yaml

  ```'
hints.2.text: 'Wymień tylko przestarzały selector i sprawdź prawdziwy controller owner. Jedyny selektor to
  kubernetes.io/os=linux. Zachowaj etykiety węzłów i nie twórz zastępczego Deployment.


  Sprawdź obserwowany wynik:


  ```sh

  kubectl get daemonset relay

  kubectl exec daemonset/relay -- wget -qO- -T 3 http://127.0.0.1:8080

  kubectl exec daemonset/relay -- wget -qO- -T 3 http://relay:8080

  ```


  Oczekuj po jednym dla desired, ready i available oraz north-103 pod oboma adresami HTTP.


  Dostarczone ograniczenia i szczegóły: DaemonSet `relay` obejmuje tylko węzły z systemem `linux`. Pod `relay`
  nie używa sieci/PID/IPC hosta ani hostPath, ma zasadę Poda bez root i seccomp `RuntimeDefault`; wszystkie
  kontenery zwykłe i init są nieuprzywilejowane, zabraniają eskalacji, odrzucają `ALL` capabilities i nie dodają
  żadnych. DaemonSet `relay` planuje dokładnie `1` kontrolowany Pod na `DQ_NODE_NAME`; jest gotowy, dostępny
  i nie jest kończony.'
phrases.0: Oddzieliłem uprawnienia węzła od stanu kontenera.
phrases.1: Sprawdziłem stan posiadania i harmonogramu DaemonSet.
phrases.2: Uniknąłem niepotrzebnego host privileges.
questions.0.points.0: Żądana liczba jest zgodna z kwalifikującymi się węzłami.
questions.0.points.1: Selektory, affinity i tolerations wpływają na położenie.
questions.0.prompt: Dlaczego DaemonSet nie używa licznika replik?
questions.1.points.0: NIE; uprawnienia zależą od rzeczywistego zadania, a nie rodzaju kontrolera.
questions.1.points.1: Przyznaj host access tylko wtedy, gdy wymaga tego konkretna funkcja.
questions.1.prompt: Czy każdy DaemonSet musi być uprzywilejowany?
stages.0.objectives.0.text: Istniejące obciążenie lokalne dla węzła może działać na węźle zatoki bez zmiany
  węzła.
stages.0.objectives.1.text: Obciążenie lokalne dla węzła nie ma dostępu do hosta ani podwyższonych uprawnień,
  działa bez roota i zachowuje dostarczoną izolację wywołań systemowych.
stages.0.objectives.2.text: Bieżący kontroler lokalny dla węzła jest właścicielem dokładnie jednego gotowego
  i dostępnego Poda na węźle zatoki; Pod nie jest usuwany.
stages.0.objectives.3.text: Wewnątrz obciążenia `relay` zarówno `http://127.0.0.1:8080`, jak i `http://relay:8080`
  zwracają `north-103`.
diagnostics.node_selector: Selektor może nie pasować do węzła albo kontroler może nadal pokazywać starszą generację. Sprawdź etykiety i poczekaj na jeden żądany i zaktualizowany pod bez podów umieszczonych na złych węzłach. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q103-relay-bay-placement)
diagnostics.probe_0_0: Kontrola rozmieszczenia może przerwać działanie przed porównaniem stanu przez błąd procesu lub wejścia. Sprawdź Pythona i dostęp do relay. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q103-placement-observer-input)
diagnostics.probe_0_1: Kontrola zabezpieczeń może skończyć się przed wskazaniem warunku przez błąd Pythona lub wejścia. Sprawdź dostęp do DaemonSetu i dostępność narzędzi. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q103-security-observer-input)
diagnostics.host_hostnetwork: Naprawa rozmieszczenia mogła włączyć sieć hosta. Sprawdź hostNetwork i zachowaj oddzielną przestrzeń sieciową poda relay. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q103-relay-network-namespace)
diagnostics.host_hostpid: Szablon poda mógł zacząć współdzielić przestrzeń procesów hosta. Sprawdź hostPID i pozostaw wyłączone. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q103-relay-process-namespace)
diagnostics.host_hostipc: Szablon poda mógł zacząć współdzielić IPC hosta. Sprawdź hostIPC i zachowaj izolację IPC poda. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q103-relay-ipc-namespace)
diagnostics.hostpath: Podczas zmiany szablonu mógł zostać dodany wolumen hostPath. Sprawdź źródła wolumenów i usuń zależność od hostPath. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q103-relay-volume-sources)
diagnostics.nonroot: Kontener może nie mieć skutecznego runAsNonRoot, nadpisywać je albo wskazywać UID 0. Sprawdź ustawienia poda i wszystkich kontenerów, w tym init. Jawne UID mają być dodatnie. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q103-relay-user-policy)
diagnostics.seccomp: Domyślny filtr wywołań może być usunięty albo nadpisany. Sprawdź skuteczny RuntimeDefault w zwykłych i init-kontenerach oraz ustawienia odziedziczone z poda. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q103-relay-syscall-filter)
diagnostics.security_privileged: 'Zwykły lub init-kontener mógł dostać tryb uprzywilejowany. Sprawdź securityContext każdego i usuń privileged: true. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q103-relay-privileged-mode)'
diagnostics.security_allowprivilegeescalation: 'Kontener może dopuszczać eskalację, jeśli flaga jest pominięta lub włączona. Ustaw allowPrivilegeEscalation: false dla każdego zwykłego i init-kontenera. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q103-relay-privilege-escalation)'
diagnostics.security_drop: Kontener mógł przestać usuwać domyślne capabilities. Sprawdź ALL na liście drop każdego zwykłego i init-kontenera. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q103-relay-drop-capabilities)
diagnostics.security_add: Szablon mógł dodać capabilities ponownie po ich usunięciu. Sprawdź pustą listę add w każdym zwykłym i init-kontenerze. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q103-relay-no-added-capabilities)
diagnostics.status_desirednumberscheduled: Selektor mógł wykluczyć węzeł stanowiska albo wybrać inne węzły. Sprawdź kwalifikację, żeby kontroler wskazywał dokładnie jeden żądany pod. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q103-relay-desired-count)
diagnostics.status_numberready: DaemonSet mógł przydzielić pod, zanim worker był gotowy. Sprawdź zdarzenia i poczekaj na dokładnie jeden gotowy pod w stanie DaemonSetu. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q103-relay-ready-count)
diagnostics.status_numberavailable: Niedawno gotowy pod może jeszcze nie liczyć się jako dostępny lub gotowość jest niestabilna. Po wdrożeniu sprawdź, czy jest dokładnie jeden dostępny pod. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q103-relay-available-count)
diagnostics.owned: Pasująca etykieta może należeć do samodzielnego lub terminowanego poda. Sprawdź aktualny UID kontrolera relay, węzeł i gotowość tego samego nieterminowanego poda. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q103-relay-pod-ownership)
diagnostics.local_http: Działający pod może nie nasłuchiwać na oczekiwanym porcie lub serwować inny plik. Sprawdź odpowiedź loopback wewnątrz relay i porównaj z north-103. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q103-relay-loopback-response)
diagnostics.service_http: Service może nie wybierać gotowego poda relay albo nie działa wykrywanie lub routing. Sprawdź odpowiedź po nazwie Service osobno od loopback i porównaj z north-103. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q103-relay-service-response)
