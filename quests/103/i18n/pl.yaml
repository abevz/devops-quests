title: Umieszczenie DaemonSet
brief: 'Pracuj w `~/quest` z `relay.json` i `service.json`. DaemonSet `relay` ma stary selektor i nie wybiera żadnego węzła. DaemonSet uruchamia Pod na każdym kwalifikującym się węźle; ten prywatny klaster ma jeden węzeł Linux. Zastąp selektor dokładnie `kubernetes.io/os: linux`: dodatkowe selektory ograniczyłyby kwalifikację poza zamierzone węzły Linux. Nie zmieniaj etykiet węzłów ani nie twórz zastępczego Deployment.


  Zachowaj Pod w przestrzeni nazw: bez sieci hosta, host PID, host IPC i hostPath. Kontekst bezpieczeństwa poda musi mieć `runAsNonRoot: true` i `seccompProfile.type: RuntimeDefault`; każdy kontener i init container musi być nieuprzywilejowany, mieć `allowPrivilegeEscalation: false`, usuwać możliwości `ALL` i nie dodawać żadnych. Dodatkowo usunięte możliwości są nieszkodliwe. Poczekaj na wartości 1 dla desired, ready i available. Sprawdź, czy niekończący się gotowy Pod należący do DaemonSet `relay` działa na `DQ_NODE_NAME`, a zarówno jego lokalny `127.0.0.1:8080`, jak i `relay:8080` zwracają `north-103`. Kontrole obserwują wyniki, nie dowodzą, czy kiedykolwiek zmieniono etykiety węzłów lub inne Deployment. Pracuj tylko w zatoce offline.'
debrief: Selektor, ustawienia bezpieczeństwa, liczniki, należący Pod i odpowiedź odpowiadały kontrolom.
stages.0.brief: Selektor DaemonSet, ustawienia bezpieczeństwa, trzy liczniki, należący gotowy Pod i odpowiedź usługi odpowiadają opisowi.
stages.0.objectives.0.text: Selektor DaemonSet, ustawienia bezpieczeństwa, trzy liczniki, należący gotowy Pod i odpowiedź usługi odpowiadają opisowi.
hints.0.text: Desired zero może oznaczać brak kwalifikującego się węzła, a nie awarię kontenera.
hints.1.text: DaemonSet umieszcza jeden Pod na każdy kwalifikujący się węzeł, zamiast przyjmować wartość
  replicas.
hints.2.text: Wymień tylko przestarzały selector i sprawdź prawdziwy controller owner.
phrases.0: Oddzieliłem uprawnienia węzła od stanu kontenera.
phrases.1: Sprawdziłem stan posiadania i harmonogramu DaemonSet.
phrases.2: Uniknąłem niepotrzebnego host privileges.
questions.0.points.0: Żądana liczba jest zgodna z kwalifikującymi się węzłami.
questions.0.points.1: Selektory, affinity i tolerations wpływają na położenie.
questions.0.prompt: Dlaczego DaemonSet nie używa licznika replik?
questions.1.points.0: NIE; uprawnienia zależą od rzeczywistego zadania, a nie rodzaju kontrolera.
questions.1.points.1: Przyznaj host access tylko wtedy, gdy wymaga tego konkretna funkcja.
questions.1.prompt: Czy każdy DaemonSet musi być uprzywilejowany?
