title: Umieszczenie DaemonSet
brief: 'Węzeł relay to węzeł DaemonSet z przestarzałym selektorem station-zone, więc nie jest on ukierunkowany
  na żaden węzeł. Klaster prywatny ma jeden węzeł Linux. Wybierz kubernetes.io/os: linux bez edytowania
  węzła labels lub tworzenia zastępczego Deployment. Zachowaj nieuprzywilejowane obciążenie z przestrzenią
  nazw: ten relay nie potrzebuje hostPath, host networking ani host PID namespace. Sprawdź liczbę żądanych/gotowych
  DaemonSet, właściciela kontrolera Pod i jego rzeczywistą odpowiedź serwisową.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `relay.json`, `service.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: DaemonSet planuje jeden zdrowy posiadany Pod w węźle Linux i obsługuje
  north-103 bez host privileges.'
debrief: Naprawiono kwalifikowalność węzła bez przyznania administracji węzłem lub dostępu do hosta.
stages.0.brief: 'Kryteria sukcesu: DaemonSet planuje jeden zdrowy posiadany Pod w węźle Linux i obsługuje
  north-103 bez host privileges.'
stages.0.objectives.0.text: DaemonSet planuje jeden zdrowy posiadany Pod w węźle Linux i obsługuje north-103
  bez host privileges.
hints.0.text: Desired zero może oznaczać brak kwalifikującego się węzła, a nie awarię kontenera.
hints.1.text: DaemonSet umieszcza jeden Pod na każdy kwalifikujący się węzeł, zamiast przyjmować wartość
  replicas.
hints.2.text: Wymień tylko przestarzały selector i sprawdź prawdziwy controller owner.
phrases.0: Oddzieliłem uprawnienia węzła od stanu kontenera.
phrases.1: Sprawdziłem stan posiadania i harmonogramu DaemonSet.
phrases.2: Uniknąłem niepotrzebnego host privileges.
questions.0.points.0: Żądana liczba jest zgodna z kwalifikującymi się węzłami.
questions.0.points.1: Selektory, affinity i tolerations wpływają na położenie.
questions.0.prompt: Dlaczego DaemonSet nie używa licznika replik?
questions.1.points.0: NIE; uprawnienia zależą od rzeczywistego zadania, a nie rodzaju kontrolera.
questions.1.points.1: Przyznaj host access tylko wtedy, gdy wymaga tego konkretna funkcja.
questions.1.prompt: Czy każdy DaemonSet musi być uprzywilejowany?
