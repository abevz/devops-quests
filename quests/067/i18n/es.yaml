title: Actualizaciones de Helm
brief: |-
  El release instalado no está sano y el paquete de trabajo no cumple el contrato de values suministrado. Recupera el mismo release conservando recursos originales e imagen fijada.

  Trabaja en `~/quest` de la estación con `chart/Chart.yaml`, `chart/values.yaml`, `chart/values.schema.json`, `chart/templates/board.yaml` y `helm-contract.json`.

  **Requisitos:**
  - Los values del release Helm `board`, su manifiesto publicado y el chart de trabajo coinciden con el contrato de aplicación suministrado.
  - El release Helm `board` tiene al menos 3 revisiones y la última está en estado `deployed`.
  - Conserva los UID originales de Deployment, ConfigMap y Service y la imagen inmutable suministrada.
  - El release instalado y el chart de trabajo implementan el contrato de values: readiness, proyección de datos, mensaje de ruta, identidad del release y enrutamiento coinciden. Todos los perfiles declarados se renderizan de forma determinista.
  - El Deployment `board` completa el rollout; HTTP dentro del contenedor en `http://127.0.0.1:8080` devuelve `north-67`.
  - El Service público conservado devuelve la misma respuesta y el registro de metadatos declarado con la identidad original del release.

  Los hechos protegidos de setup registran identidades originales. Las comprobaciones comparan values actuales, renders, manifests, objetos reales y HTTP; no prueban disponibilidad continua ni todos los perfiles de entrada posibles.
debrief: El release conservado adopta un contrato funcional del chart. Proyección de origen y ruta pública coinciden
  con los values; los renders alternativos comprueban la propagación reparada.
stages.0.brief: Conserva la carga original mientras se recuperan el release de Helm y el endpoint HTTP.
stages.0.objectives.0.text: El release conservado adopta el contrato de values y el chart de trabajo renderiza correctamente
  cada perfil declarado.
stages.0.objectives.1.text: El release de Helm `board` tiene al menos 3 revisiones y el último estado es `deployed`.
stages.0.objectives.2.text: Se conservan el Deployment, ConfigMap de origen, Service público e imagen fijada originales.
stages.0.objectives.3.text: El workload real, manifest del release y datos públicos coinciden con el contrato HTTP
  operativo.
stages.0.objectives.4.text: El Deployment `board` completa su rollout.
stages.0.objectives.5.text: HTTP desde Deployment `board` a `http://127.0.0.1:8080` devuelve `north-67`.
hints.0.text: Overrides almacenados, defaults del chart, intención renderizada y recursos reales son vistas distintas.
  El estado deployed describe una operación, no demuestra un consumer sano.
hints.1.text: |-
  Compara `helm get values board`, `helm get values board --all`, `helm get manifest board`, `helm history board`, paquete/schema de trabajo y eventos de Pods. Usa el contrato para identificar relaciones entre recursos y entradas que deben sobrevivir al upgrade.

  Busca en helm-contract.json los perfiles de renderizado y la relación requerida entre los valores de entrada, el origen proyectado y el Service. En el chart, sigue esos valores desde values.yaml y values.schema.json hasta las plantillas de recursos.
hints.2.text: |-
  Verifica `helm get values board -o json`, `helm history board`, `helm template board chart`, rollout y ambas rutas HTTP. Espera readiness registrada `8080`, respuesta `north-67`, identidades originales de objetos/imagen y metadatos con el mensaje activo e ID conservado del release.
phrases.0: Comparé el historial de Helm, el values efectivo y rendericé el manifests.
phrases.1: Corregí el contrato de liberación en lugar de ocultar el drift activo.
phrases.2: Verifiqué readiness independientemente del estado de revisión de Helm.
questions.0.points.0: Informa el estado de la operación de liberación.
questions.0.points.1: Readiness y el tráfico real requieren sus propias comprobaciones.
questions.0.points.2: Utilice esperar y inspect events cuando un upgrade se detiene.
questions.0.prompt: ¿Helm deployed demuestra que la aplicación está en buen estado?
questions.1.points.0: El siguiente upgrade vuelve a renderizar values.
questions.1.points.1: Un patch activo puede dejar la intención de publicación incorrecta.
questions.1.points.2: Compare los recursos renderizados y el comportamiento observado.
questions.1.prompt: ¿Por qué reparar el values en lugar de parchear únicamente el Deployment?
diagnostics.probe_0_0: El readinessPort guardado no es 8080 o la prueba terminó sin marcador; override 9090 retenido, plantillas ConfigMap ausente, YAML/JSON inválido o entradas Helm no disponibles pueden explicarlo. [Causa y comprobación](guides#guide=helm-8&section=upgrade-stored-values-and-chart-inputs)
diagnostics.helm_values_contract: Los values efectivos o un perfil no cumplieron el contrato o falló Helm; readiness/mensaje fijos, release ID/imagen cambiados, namespace incorrecto o plantillas no deterministas impiden render reutilizable. [Causa y comprobación](guides#guide=helm-8&section=upgrade-reusable-deterministic-values)
diagnostics.helm_image: Una imagen worker viva o renderizada difiere de referencia/digest; cambiar image en values o plantilla en vez de reparar chart puede sustituir la aplicación protegida. [Causa y comprobación](guides#guide=helm-8&section=upgrade-original-immutable-image)
diagnostics.helm_projection: worker no monta un volumen referido al ConfigMap de versión; volumen ausente, nombre de montaje distinto u otro origen desconecta el bundle chart de la aplicación. [Causa y comprobación](guides#guide=helm-8&section=upgrade-projected-source-configmap)
diagnostics.helm_bundle: El bundle no coincide con mensaje configurado e ID original o falló consultar manifiesto/API; north-67 fijo, datos ConfigMap antiguos o release.json sustituido rompe perfil predeterminado o canary. [Causa y comprobación](guides#guide=helm-8&section=upgrade-parameterized-source-bundle)
diagnostics.helm_service: Tipo Service, selector o puerto TCP declarado no coinciden con contrato; plantilla Service ausente/obsoleta, etiquetas cambiadas o puerto público incorrecto impiden seleccionar versión prevista. [Causa y comprobación](guides#guide=helm-8&section=upgrade-public-service-selection)
diagnostics.helm_identity: Un objeto original cambió UID; uninstall, eliminar y recrear Deployment, ConfigMap o Service conserva nombres y sustituye identidades registradas por setup. [Causa y comprobación](guides#guide=helm-8&section=upgrade-original-release-object-uids)
diagnostics.probe_0_2: No se conservó UID original Deployment o no terminó probar identidades/imagen; recrear board, perder registros UID protegidos, objetos ausentes o fallos API/JSON pueden explicarlo. [Causa y comprobación](guides#guide=helm-8&section=upgrade-deployment-identity-observation)
diagnostics.probe_0_3: Las definiciones readiness viva y publicada no verificaron contrato HTTP o la observación terminó sin marcador; probe 9090 obsoleta, handler/host/scheme inválidos, objetos ausentes o bundle malformado pueden explicarlo. [Causa y comprobación](guides#guide=helm-8&section=upgrade-live-and-released-readiness)
diagnostics.helm_publication: Los metadatos públicos no coinciden con ID original y ruta actual o falló petición/JSON; datos proyectados obsoletos, routing Service incorrecto o worker no disponible impiden adopción. [Causa y comprobación](guides#guide=helm-8&section=upgrade-public-release-metadata)
diagnostics.helm_history: El historial Helm no muestra al menos tres revisiones con última deployed o falló consulta; parchear solo objetos vivos, upgrade incompleto o última revisión fallida no satisface historial. [Causa y comprobación](guides#guide=helm-8&section=upgrade-deployed-third-revision)
diagnostics.helm_rollout: Deployment board no completó rollout en 3 segundos; overrides readiness retenidos, ConfigMap ausente, Pods no disponibles o fallo API impiden un rollout sano. [Causa y comprobación](guides#guide=helm-8&section=upgrade-workload-rollout-readiness)
diagnostics.helm_http: worker no devolvió north-67 en localhost:8080 o falló exec/HTTP; Pods sin preparar, bundle proyectado ausente o contenido obsoleto deja respuesta incorrecta incluso con revisión deployed. [Causa y comprobación](guides#guide=helm-8&section=upgrade-local-worker-response)
