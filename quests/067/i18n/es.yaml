title: Actualizaciones de Helm
brief: 'El release de Helm instalado no proporciona una carga HTTP lista. Conserva la identidad original del
  Deployment y la imagen fijada suministrada.


  Trabaja en la estación de trabajo en `~/quest` con `chart/Chart.yaml`, `chart/values.yaml`, `chart/templates/board.yaml`.


  **Requisitos:**

  - La corrección se aplica mediante los valores del release de Helm `board`, no editando el Deployment.

  - El release de Helm `board` tiene al menos 3 revisiones y el último estado es `deployed`.

  - Se conserva el Deployment `board` original.

  - La carga `board` activa y los manifiestos renderizados del release coinciden en el endpoint HTTP operativo.

  - El Deployment `board` completa su rollout.

  - HTTP desde Deployment `board` a `http://127.0.0.1:8080` devuelve `north-67`.


  Las pruebas iniciales en `/run/dq/facts/0/` en la workstation son autoritativas y de solo lectura; los archivos
  equivalentes en `~/quest` son copias de trabajo.

  '
debrief: La intención de lanzamiento y la preparación en vivo ahora coinciden sin reemplazar el Deployment
  administrado.
stages.0.brief: Conserva la carga original mientras se recuperan el release de Helm y el endpoint HTTP.
