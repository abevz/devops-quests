hints.0.text: Una revisión de Helm marcada como deployed puede contener una aplicación no saludable.
hints.1.text: 'Compara las entradas del release, la carga renderizada y el estado activo:


  ```sh

  helm get values board

  helm template board chart

  kubectl get deployment board -o yaml

  ```'
hints.2.text: "El upgrade cambió readinessPort de 8080 a 9090, pero la aplicación sigue escuchando en 8080. Inspecciona el historial del release, sus valores efectivos y el chart renderizado. Actualiza el mismo release de Helm con readinessPort=8080 y espera a que la aplicación esté lista; no sustituyas el release ni te limites a parchear la sonda activa.\n\nVerifica el resultado observado:\n\n- `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://127.0.0.1:8080` — Dentro del contenedor de la aplicación, la respuesta es `north-67`.\n\n- `helm history board` — Al menos `3` revisiones; el estado más reciente es `deployed`.\n\n- El despliegue termina y el UID del Deployment activo coincide con la referencia original protegida.\n\n  ```sh\n  kubectl rollout status deployment/board --timeout=3s\n  kubectl get deployment board -o custom-columns=NAME:.metadata.name,UID:.metadata.uid\n  cat /run/dq/facts/0/original-deployment-uid\n  ```\n\n- Las tres comprobaciones imprimen `true`: los valores indican `8080` y la sonda de disponibilidad del contenedor `worker` apunta al puerto de la aplicación `8080` tanto en el Deployment activo como en el manifiesto renderizado por Helm. Una sonda HTTP o TCP puede usar el número o un nombre de puerto que resuelva a él.\n\n  ```sh\n  helm get values board -o json | jq -e '(.readinessPort|tonumber)==8080'\n  kubectl get deployment board -o json | jq -e '(.spec.template.spec.containers[] | select(.name==\"worker\")) as $c | ($c.readinessProbe.httpGet.port // $c.readinessProbe.tcpSocket.port) as $p | (if ($p|type)==\"number\" then $p else first($c.ports[]? | select(.name==$p) | .containerPort) end)==8080'\n  helm get manifest board | python3 -I -c 'import json,sys,yaml; docs=[d for d in yaml.safe_load_all(sys.stdin) if isinstance(d,dict) and d.get(\"kind\")==\"Deployment\" and d.get(\"metadata\",{}).get(\"name\")==\"board\"]; assert len(docs)==1; json.dump(docs[0],sys.stdout)' | jq -e '(.spec.template.spec.containers[] | select(.name==\"worker\")) as $c | ($c.readinessProbe.httpGet.port // $c.readinessProbe.tcpSocket.port) as $p | (if ($p|type)==\"number\" then $p else first($c.ports[]? | select(.name==$p) | .containerPort) end)==8080'\n  ```\n"
phrases.0: Comparé el historial de Helm, el values efectivo y rendericé el manifests.
phrases.1: Corregí el contrato de liberación en lugar de ocultar el drift activo.
phrases.2: Verifiqué readiness independientemente del estado de revisión de Helm.
questions.0.points.0: Informa el estado de la operación de liberación.
questions.0.points.1: Readiness y el tráfico real requieren sus propias comprobaciones.
questions.0.points.2: Utilice esperar y inspect events cuando un upgrade se detiene.
questions.0.prompt: ¿Helm deployed demuestra que la aplicación está en buen estado?
questions.1.points.0: El siguiente upgrade vuelve a renderizar values.
questions.1.points.1: Un patch activo puede dejar la intención de publicación incorrecta.
questions.1.points.2: Compare los recursos renderizados y el comportamiento observado.
questions.1.prompt: ¿Por qué reparar el values en lugar de parchear únicamente el Deployment?
