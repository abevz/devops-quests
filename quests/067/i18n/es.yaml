title: Actualizaciones de Helm
brief: |
  La versión Helm instalada no proporciona una carga HTTP lista. Conserva la identidad original del Deployment y la imagen fijada suministrada.

  Trabaja en `~/quest` en la workstation. Archivos de entrada suministrados: `chart/Chart.yaml`, `chart/values.yaml`, `chart/templates/board.yaml`, `original-deployment-uid`.

  **Requisitos:**
  - El Deployment `board` completa su rollout.
  - La corrección se aplica mediante los valores de la versión Helm `board`, no editando el Deployment.
  - La versión Helm `board` tiene al menos tres revisiones; el último estado es `deployed`.
  - Se conserva el Deployment `board` original. Su UID coincide con la referencia protegida en la workstation:
    - `/run/dq/facts/0/original-deployment-uid`
  - Dentro del Deployment `board`, el contenedor `worker` tiene una sonda HTTP de readiness en el puerto `8080`.
  - Dentro del contenedor `worker` del Deployment `board`, HTTP a `http://127.0.0.1:8080` devuelve `north-67`.

  **Verifica antes de Check & finish:**
  Ejecuta estos comandos de observación desde `~/quest` en la workstation.
  - `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://127.0.0.1:8080` — Dentro del contenedor de la aplicación, la respuesta HTTP es `north-67`.
  - Hay al menos tres revisiones, la última está `deployed` y los valores de la versión describen la carga sana.

    ```sh
    helm history board
    helm get values board
    ```
  - El rollout está completo, la sonda HTTP de readiness usa el puerto `8080` y el UID del Deployment coincide con la referencia protegida.

    ```sh
    kubectl rollout status deployment/board --timeout=3s
    kubectl get deployment board -o yaml
    cat /run/dq/facts/0/original-deployment-uid
    ```

  Las pruebas iniciales en `/run/dq/facts/0/` en la workstation son autoritativas y de solo lectura; los archivos equivalentes en `~/quest` son copias de trabajo.
debrief: La intención de lanzamiento y la preparación en vivo ahora coinciden sin reemplazar el Deployment
  administrado.
stages.0.brief: |
  Conserva la carga original mientras se recuperan la versión Helm y el endpoint HTTP.
stages.0.objectives.0.text: La corrección se aplica mediante los valores del release Helm `board`, no
  editando el Deployment.
stages.0.objectives.1.text: El release Helm `board` tiene al menos 3 revisiones y el último estado es
  `deployed`.
stages.0.objectives.2.text: Se conserva el Deployment `board` original.
stages.0.objectives.3.text: El contenedor board usa el puerto `8080` para su sonda HTTP de readiness.
stages.0.objectives.4.text: El Deployment `board` completa su rollout.
stages.0.objectives.5.text: HTTP desde Deployment `board` a `http://127.0.0.1:8080` devuelve `north-67`.
hints.0.text: Una revisión deployed Helm aún puede contener un workload en mal estado.
hints.1.text: Compare helm y obtenga values y helm template con el readiness probe en vivo.
hints.2.text: |
  La actualización cambió readinessPort de 8080 a 9090 mientras la aplicación sigue escuchando en 8080. Revisa el historial, los valores efectivos y el chart renderizado. Actualiza la misma versión con readinessPort=8080 y espera readiness; no sustituyas la versión ni te limites a editar la sonda activa.
phrases.0: Comparé el historial de Helm, el values efectivo y rendericé el manifests.
phrases.1: Corregí el contrato de liberación en lugar de ocultar el drift activo.
phrases.2: Verifiqué readiness independientemente del estado de revisión de Helm.
questions.0.points.0: Informa el estado de la operación de liberación.
questions.0.points.1: Readiness y el tráfico real requieren sus propias comprobaciones.
questions.0.points.2: Utilice esperar y inspect events cuando un upgrade se detiene.
questions.0.prompt: ¿Helm deployed demuestra que la aplicación está en buen estado?
questions.1.points.0: El siguiente upgrade vuelve a renderizar values.
questions.1.points.1: Un patch activo puede dejar la intención de publicación incorrecta.
questions.1.points.2: Compare los recursos renderizados y el comportamiento observado.
questions.1.prompt: ¿Por qué reparar el values en lugar de parchear únicamente el Deployment?
