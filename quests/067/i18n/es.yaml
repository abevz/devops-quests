title: Actualizaciones de Helm
brief: 'Un Helm upgrade cambió readinessPort de 8080 a 9090, mientras que el board real todavía escucha
  en 8080. Inspeccione el historial de versiones, efectivo values y renderizado. chart. Corrija la liberación
  a través de helm upgrade con readinessPort=8080, conservando el Deployment identity y la imagen fijada.
  No reemplace la versión o simplemente patch el probe activo: Helm values debe describir el estado saludable.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `chart/Chart.yaml`, `chart/values.yaml`,
  `chart/templates/board.yaml`, `original-deployment-uid`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: la tercera o posterior revisión Helm registra el puerto 8080, el Deployment
  original está listo y HTTP devuelve north-67.


  La evidencia de configuración autorizada es de solo lectura en `/run/dq/facts/0/`; Los archivos coincidentes
  en `~/quest` son copias de trabajo.'
debrief: La intención de lanzamiento y la preparación en vivo ahora coinciden sin reemplazar el Deployment
  administrado.
stages.0.brief: 'Criterios de éxito: la tercera o posterior revisión Helm registra el puerto 8080, el
  Deployment original está listo y HTTP devuelve north-67.'
stages.0.objectives.0.text: La tercera revisión Helm o posterior registra el puerto 8080, el Deployment
  original está listo y HTTP devuelve north-67.
hints.0.text: Una revisión deployed Helm aún puede contener un workload en mal estado.
hints.1.text: Compare helm y obtenga values y helm template con el readiness probe en vivo.
hints.2.text: Actualice la misma versión con el readinessPort corregido y espere a que esté listo.
phrases.0: Comparé el historial de Helm, el values efectivo y rendericé el manifests.
phrases.1: Corregí el contrato de liberación en lugar de ocultar el drift activo.
phrases.2: Verifiqué readiness independientemente del estado de revisión de Helm.
questions.0.points.0: Informa el estado de la operación de liberación.
questions.0.points.1: Readiness y el tráfico real requieren sus propias comprobaciones.
questions.0.points.2: Utilice esperar y inspect events cuando un upgrade se detiene.
questions.0.prompt: ¿Helm deployed demuestra que la aplicación está en buen estado?
questions.1.points.0: El siguiente upgrade vuelve a renderizar values.
questions.1.points.1: Un patch activo puede dejar la intención de publicación incorrecta.
questions.1.points.2: Compare los recursos renderizados y el comportamiento observado.
questions.1.prompt: ¿Por qué reparar el values en lugar de parchear únicamente el Deployment?
