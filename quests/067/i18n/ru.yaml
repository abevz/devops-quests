hints.0.text: Ревизия Helm со статусом deployed может содержать неисправный workload.
hints.1.text: 'Сравните входные данные релиза, отрендеренный workload и текущее состояние:


  ```sh

  helm get values board

  helm template board chart

  kubectl get deployment board -o yaml

  ```'
hints.2.text: "Обновление изменило readinessPort с 8080 на 9090, а приложение продолжает слушать 8080. Проверьте\
  \ историю релиза, итоговые values и отрендеренный chart. Обновите тот же релиз с readinessPort=8080 и дождитесь\
  \ готовности; не заменяйте релиз и не ограничивайтесь правкой живого probe.\n\nПроверьте наблюдаемый результат:\n\
  \n- `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://127.0.0.1:8080` — Внутри контейнера\
  \ приложения ответ — `north-67`.\n\n- `helm history board` — Не менее `3` ревизий; последний статус — `deployed`.\n\
  \n- Rollout завершается, а UID работающего Deployment совпадает с защищённым исходным эталоном.\n\n  ```sh\n\
  \  kubectl rollout status deployment/board --timeout=3s\n  kubectl get deployment board -o custom-columns=NAME:.metadata.name,UID:.metadata.uid\n\
  \  cat /run/dq/facts/0/original-deployment-uid\n  ```\n\n- Проверка values выводит `true`, а live HTTP-порт\
  \ равен `8080`.\n\n  ```sh\n  helm get values board -o json | jq -e '.readinessPort==8080'\n  kubectl get\
  \ deployment board -o custom-columns=NAME:.metadata.name,HTTP-PORT:.spec.template.spec.containers[0].readinessProbe.httpGet.port\n\
  \  ```"
phrases.0: Я сравнил историю Helm, действующие values и отрендеренные manifests.
phrases.1: Я исправил контракт релиза вместо сокрытия live drift.
phrases.2: Я проверил readiness отдельно от статуса ревизии Helm.
questions.0.points.0: Это статус операции релиза.
questions.0.points.1: Readiness и трафик требуют отдельных проверок.
questions.0.points.2: Использовать wait и изучать events при зависшем upgrade.
questions.0.prompt: Доказывает ли Helm deployed исправность приложения?
questions.1.points.0: Следующий upgrade снова отрендерит values.
questions.1.points.1: Live patch может оставить неверный контракт релиза.
questions.1.points.2: Сравнить отрендеренные ресурсы и наблюдаемое поведение.
questions.1.prompt: Почему нужно исправить values, а не только Deployment?
