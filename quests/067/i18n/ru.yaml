title: Обновления Helm
brief: 'Helm upgrade изменил readinessPort с 8080 на 9090, но board слушает 8080. Изучите историю релиза,
  действующие values и отрендеренный chart. Исправьте релиз через helm upgrade с readinessPort=8080, сохранив
  identity Deployment и закреплённый image. Не пересоздавайте релиз и не ограничивайтесь live patch probe:
  values Helm должны описывать исправное состояние.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `chart/Chart.yaml`, `chart/values.yaml`,
  `chart/templates/board.yaml`, `original-deployment-uid`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Третья или следующая ревизия Helm хранит порт 8080, прежний Deployment готов, HTTP
  возвращает north-67.


  Исходные метки проверки доступны только для чтения в `/run/dq/facts/0/`; одноимённые файлы в `~/quest`
  — рабочие копии.'
debrief: Состояние релиза и готовность workload согласованы без замены Deployment.
stages.0.brief: 'Третья или следующая ревизия Helm хранит порт 8080, прежний Deployment готов, HTTP возвращает
  north-67.


  Результат проверки: Третья или следующая ревизия Helm хранит порт 8080, прежний Deployment готов, HTTP
  возвращает north-67.'
stages.0.objectives.0.text: Третья или следующая ревизия Helm хранит порт 8080, прежний Deployment готов,
  HTTP возвращает north-67.
hints.0.text: Ревизия Helm со статусом deployed может содержать неисправный workload.
hints.1.text: Сравните helm get values и helm template с действующей readiness probe.
hints.2.text: Обновите тот же релиз с исправленным readinessPort и дождитесь готовности.
phrases.0: Я сравнил историю Helm, действующие values и отрендеренные manifests.
phrases.1: Я исправил контракт релиза вместо сокрытия live drift.
phrases.2: Я проверил readiness отдельно от статуса ревизии Helm.
questions.0.points.0: Это статус операции релиза.
questions.0.points.1: Readiness и трафик требуют отдельных проверок.
questions.0.points.2: Использовать wait и изучать events при зависшем upgrade.
questions.0.prompt: Доказывает ли Helm deployed исправность приложения?
questions.1.points.0: Следующий upgrade снова отрендерит values.
questions.1.points.1: Live patch может оставить неверный контракт релиза.
questions.1.points.2: Сравнить отрендеренные ресурсы и наблюдаемое поведение.
questions.1.prompt: Почему нужно исправить values, а не только Deployment?
