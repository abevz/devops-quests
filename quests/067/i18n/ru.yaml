title: Обновления Helm
brief: |-
  Установленный release нездоров, а рабочий пакет не соответствует предоставленному контракту values. Восстановите тот же release, сохранив исходные ресурсы и закреплённый образ.

  Работайте в `~/quest` на рабочей станции с `chart/Chart.yaml`, `chart/values.yaml`, `chart/values.schema.json`, `chart/templates/board.yaml` и `helm-contract.json`.

  **Требования:**
  - Values Helm release `board`, manifest релиза и рабочий chart согласованы с заданным контрактом приложения.
  - У Helm release `board` не менее 3 revisions, последняя имеет статус `deployed`.
  - Сохраните исходные UID Deployment, ConfigMap и Service и предоставленный неизменяемый образ приложения.
  - Установленный release и рабочий chart реализуют объявленный контракт values: readiness, проекция набора данных, сообщение маршрута, идентичность release и маршрутизация Service согласованы. Все объявленные профили render работают детерминированно.
  - Deployment `board` завершает rollout; HTTP внутри контейнера приложения по `http://127.0.0.1:8080` возвращает `north-67`.
  - Сохранённый публичный Service возвращает тот же ответ и объявленную запись метаданных с исходной идентичностью release.

  Защищённые setup facts фиксируют исходные идентичности. Проверки сравнивают текущие values, render chart, manifests release, live-объекты и HTTP; непрерывную доступность и все возможные входные профили они не доказывают.
debrief: Сохранённый release принимает работающий контракт chart. Проекция источника и публичная маршрутизация согласованы
  с текущими values, а альтернативные render проверяют передачу исправленных параметров.
stages.0.brief: Сохраните исходную нагрузку при восстановлении релиза Helm и HTTP-адреса.
stages.0.objectives.0.text: Сохранённый release принимает контракт values, а рабочий chart корректно рендерит каждый
  объявленный профиль.
stages.0.objectives.1.text: Helm release `board` имеет не менее 3 ревизий, последняя — в статусе `deployed`.
stages.0.objectives.2.text: Сохранены исходные Deployment, ConfigMap источника, публичный Service и закреплённый
  образ.
stages.0.objectives.3.text: Live workload, manifest release и публичный набор данных согласованы с рабочим HTTP-контрактом.
stages.0.objectives.4.text: Deployment `board` завершает rollout.
stages.0.objectives.5.text: HTTP-запрос из Deployment `board` к `http://127.0.0.1:8080` возвращает `north-67`.
hints.0.text: Сохранённые overrides, defaults chart, результат render и live-ресурсы — разные представления. Статус
  deployed описывает операцию, а не доказывает здоровье consumer.
hints.1.text: |-
  Сопоставьте `helm get values board`, `helm get values board --all`, `helm get manifest board`, `helm history board`, рабочий пакет/schema и события Pod. По контракту определите связи ресурсов и входов, которые должны пережить upgrade.

  В helm-contract.json найдите профили рендеринга и требуемую связь между входными значениями, проецируемым источником и Service. В чарте проследите передачу этих значений от values.yaml и values.schema.json до шаблонов ресурсов.
hints.2.text: |-
  Проверьте `helm get values board -o json`, `helm history board`, `helm template board chart`, rollout и оба HTTP-пути. Ожидаются сохранённая readiness `8080`, ответ `north-67`, исходные идентичности объектов и образа и метаданные с активным сообщением и сохранённым ID release.
phrases.0: Я сравнил историю Helm, действующие values и отрендеренные manifests.
phrases.1: Я исправил контракт релиза вместо сокрытия live drift.
phrases.2: Я проверил readiness отдельно от статуса ревизии Helm.
questions.0.points.0: Это статус операции релиза.
questions.0.points.1: Readiness и трафик требуют отдельных проверок.
questions.0.points.2: Использовать wait и изучать events при зависшем upgrade.
questions.0.prompt: Доказывает ли Helm deployed исправность приложения?
questions.1.points.0: Следующий upgrade снова отрендерит values.
questions.1.points.1: Live patch может оставить неверный контракт релиза.
questions.1.points.2: Сравнить отрендеренные ресурсы и наблюдаемое поведение.
questions.1.prompt: Почему нужно исправить values, а не только Deployment?
diagnostics.probe_0_0: 'Сохранённый readinessPort не равен 8080 либо проверка остановилась без именованного маркера: причиной могут быть выданное сохранённое переопределение 9090, отсутствующие шаблоны ConfigMap и Service, некорректный YAML и JSON или недоступные данные Helm. [Причина и проверка](guides#guide=helm-8&section=upgrade-stored-values-and-chart-inputs)'
diagnostics.helm_values_contract: 'Итоговые values или профиль рендера не выполнили контракт либо команда Helm завершилась ошибкой: жёстко заданные readiness и сообщение, другой release ID или образ, namespace или недетерминированные шаблоны мешают повторному использованию. [Причина и проверка](guides#guide=helm-8&section=upgrade-reusable-deterministic-values)'
diagnostics.helm_image: 'Проверяемый образ worker в live или рендере отличается от выданной ссылки или digest: смена image в values или шаблоне вместо исправления chart заменяет защищённое приложение. [Причина и проверка](guides#guide=helm-8&section=upgrade-original-immutable-image)'
diagnostics.helm_projection: 'worker не монтирует том со ссылкой на ConfigMap выпуска: отсутствующий том, разные имена volume и mount либо другой источник отделяют bundle chart от нагрузки. [Причина и проверка](guides#guide=helm-8&section=upgrade-projected-source-configmap)'
diagnostics.helm_bundle: 'Исходный bundle не совпадает с заданным сообщением и исходным release ID либо запрос не удался: захардкоженный north-67, старые данные ConfigMap или подменённый release.json нарушают профиль по умолчанию или canary. [Причина и проверка](guides#guide=helm-8&section=upgrade-parameterized-source-bundle)'
diagnostics.helm_service: 'Тип Service, selector или объявленный TCP-порт не соответствуют контракту: отсутствующий или старый шаблон Service, другие метки или публичный порт мешают выбрать нужный выпуск. [Причина и проверка](guides#guide=helm-8&section=upgrade-public-service-selection)'
diagnostics.helm_identity: 'Исходный объект выпуска сменил UID: uninstall, удаление и пересоздание Deployment, ConfigMap или Service сохраняют имена, но заменяют идентичности из записи setup. [Причина и проверка](guides#guide=helm-8&section=upgrade-original-release-object-uids)'
diagnostics.probe_0_2: 'Исходный UID Deployment не сохранён либо проверка идентичностей и образа не завершена: пересоздание board, потеря защищённых записей UID, отсутствующие объекты или ошибки API и JSON могут быть причиной. [Причина и проверка](guides#guide=helm-8&section=upgrade-deployment-identity-observation)'
diagnostics.probe_0_3: 'Живая и выпущенная readiness-конфигурации не подтвердили HTTP-контракт либо наблюдение bundle остановилось без маркера: старый порт 9090, неверные handler, host и scheme, отсутствующие объекты или некорректные данные могут быть причиной. [Причина и проверка](guides#guide=helm-8&section=upgrade-live-and-released-readiness)'
diagnostics.helm_publication: 'Публичные метаданные не совпали с исходным release ID и текущим маршрутом либо запрос и чтение JSON не удались: старые проецируемые данные, неверная маршрутизация Service или недоступный worker мешают принятию публикации. [Причина и проверка](guides#guide=helm-8&section=upgrade-public-release-metadata)'
diagnostics.helm_history: 'История Helm не показывает минимум три ревизии с последней deployed либо запрос не удался: изменение только живых объектов, незавершённый upgrade или сбой последней ревизии не выполняют условие истории. [Причина и проверка](guides#guide=helm-8&section=upgrade-deployed-third-revision)'
diagnostics.helm_rollout: 'Deployment board не завершил rollout за 3 секунды: сохранённые readiness-переопределения, отсутствующий ConfigMap, недоступные Pod или ошибки наблюдения мешают готовности. [Причина и проверка](guides#guide=helm-8&section=upgrade-workload-rollout-readiness)'
diagnostics.helm_http: 'worker не вернул north-67 на localhost:8080 либо exec и HTTP завершились ошибкой: неготовые Pod, отсутствующие данные bundle или старое содержимое оставляют неверный ответ даже после ревизии Helm deployed. [Причина и проверка](guides#guide=helm-8&section=upgrade-local-worker-response)'
