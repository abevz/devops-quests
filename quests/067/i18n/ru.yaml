title: Обновления Helm
brief: |
  Установленный релиз Helm не обеспечивает готовую HTTP-нагрузку. Сохраните исходную идентичность Deployment и предоставленный закреплённый образ.

  Работайте в `~/quest` на workstation. Предоставленные входные файлы: `chart/Chart.yaml`, `chart/values.yaml`, `chart/templates/board.yaml`, `original-deployment-uid`.

  **Требования:**
  - Deployment `board` завершает rollout.
  - Исправление внесено через values релиза Helm `board`, а не редактированием Deployment.
  - Релиз Helm `board` имеет не менее трёх ревизий; последний статус — `deployed`.
  - Исходный Deployment `board` сохранён. Его UID совпадает с защищённым эталоном на workstation:
    - `/run/dq/facts/0/original-deployment-uid`
  - В Deployment `board` контейнер `worker` имеет HTTP readiness probe на порту `8080`.
  - Внутри контейнера `worker` Deployment `board` HTTP-запрос к `http://127.0.0.1:8080` возвращает `north-67`.

  **Проверьте самостоятельно перед Check & finish:**
  Выполняйте эти команды наблюдения из `~/quest` на workstation.
  - `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://127.0.0.1:8080` — Внутри контейнера приложения HTTP-ответ — `north-67`.
  - Есть минимум три ревизии, последняя — `deployed`, а values релиза описывают здоровую нагрузку.

    ```sh
    helm history board
    helm get values board
    ```
  - Rollout завершён, HTTP readiness probe использует порт `8080`, а UID Deployment совпадает с защищённым эталоном.

    ```sh
    kubectl rollout status deployment/board --timeout=3s
    kubectl get deployment board -o yaml
    cat /run/dq/facts/0/original-deployment-uid
    ```

  Эталоны подготовки в `/run/dq/facts/0/` на workstation авторитетны и доступны только для чтения; соответствующие файлы в `~/quest` — рабочие копии.
debrief: Состояние релиза и готовность workload согласованы без замены Deployment.
stages.0.brief: |
  Сохраните исходную нагрузку при восстановлении релиза Helm и HTTP-адреса.
stages.0.objectives.0.text: Исправление применено через значения Helm-релиза `board`, а не путём редактирования
  Deployment.
stages.0.objectives.1.text: Helm release `board` имеет не менее 3 ревизий, последняя — в статусе `deployed`.
stages.0.objectives.2.text: Исходный Deployment `board` сохранён.
stages.0.objectives.3.text: Контейнер board использует порт `8080` для HTTP-пробы readiness.
stages.0.objectives.4.text: Deployment `board` завершает rollout.
stages.0.objectives.5.text: HTTP-запрос из Deployment `board` к `http://127.0.0.1:8080` возвращает `north-67`.
hints.0.text: Ревизия Helm со статусом deployed может содержать неисправный workload.
hints.1.text: Сравните helm get values и helm template с действующей readiness probe.
hints.2.text: |
  Обновление изменило readinessPort с 8080 на 9090, а приложение продолжает слушать 8080. Проверьте историю релиза, итоговые values и отрендеренный chart. Обновите тот же релиз с readinessPort=8080 и дождитесь готовности; не заменяйте релиз и не ограничивайтесь правкой живого probe.
phrases.0: Я сравнил историю Helm, действующие values и отрендеренные manifests.
phrases.1: Я исправил контракт релиза вместо сокрытия live drift.
phrases.2: Я проверил readiness отдельно от статуса ревизии Helm.
questions.0.points.0: Это статус операции релиза.
questions.0.points.1: Readiness и трафик требуют отдельных проверок.
questions.0.points.2: Использовать wait и изучать events при зависшем upgrade.
questions.0.prompt: Доказывает ли Helm deployed исправность приложения?
questions.1.points.0: Следующий upgrade снова отрендерит values.
questions.1.points.1: Live patch может оставить неверный контракт релиза.
questions.1.points.2: Сравнить отрендеренные ресурсы и наблюдаемое поведение.
questions.1.prompt: Почему нужно исправить values, а не только Deployment?
