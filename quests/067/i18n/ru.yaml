title: Обновления Helm
brief: 'Установленный релиз Helm не обеспечивает готовую HTTP-нагрузку. Сохраните исходную идентичность Deployment
  и предоставленный закреплённый образ.


  Работайте на рабочей станции в `~/quest` с `chart/Chart.yaml`, `chart/values.yaml`, `chart/templates/board.yaml`.


  **Требования:**

  - Исправление применено через значения Helm-релиза `board`, а не путём редактирования Deployment.

  - Helm release `board` имеет не менее 3 ревизий, последняя — в статусе `deployed`.

  - Исходный Deployment `board` сохранён.

  - Работающий workload `board` и отрендеренный релиз согласованы с работающим HTTP-эндпоинтом.

  - Deployment `board` завершает rollout.

  - HTTP-запрос из Deployment `board` к `http://127.0.0.1:8080` возвращает `north-67`.


  Эталоны подготовки в `/run/dq/facts/0/` на workstation авторитетны и доступны только для чтения; соответствующие
  файлы в `~/quest` — рабочие копии.

  '
debrief: Состояние релиза и готовность workload согласованы без замены Deployment.
stages.0.brief: Сохраните исходную нагрузку при восстановлении релиза Helm и HTTP-адреса.
