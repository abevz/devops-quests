title: Helm upgrades
brief: |-
  The installed release is unhealthy and the working package does not meet its supplied values contract. Recover the same release while retaining its original resources and pinned image.

  Work on the workstation in `~/quest` with `chart/Chart.yaml`, `chart/values.yaml`, `chart/values.schema.json`, `chart/templates/board.yaml` and `helm-contract.json`.

  **Requirements:**
  - Helm release `board` values, its released manifest and the working chart agree on the supplied application contract.
  - Helm release `board` has at least 3 revisions and its latest status is `deployed`.
  - Retain the original Deployment, ConfigMap and Service identities and the supplied immutable application image.
  - The installed release and working chart implement the declared values contract: readiness, projected source bundle, route message, release identity and Service routing agree. All declared input profiles render deterministically with their specified parameter values.
  - Deployment `board` completes its rollout; HTTP inside its application container at `http://127.0.0.1:8080` returns `north-67`.
  - The retained public Service serves the same response and its declared metadata record with the original release identity.

  Protected setup facts record original identities. Checks compare current values, chart renders, release manifests, live objects and HTTP; they do not prove continuous availability or every possible input profile.
debrief: The retained release now adopts a functioning chart contract. Source projection and public routing agree
  with current values, and alternative renders exercise the repaired parameter propagation.
stages.0.brief: Keep the original workload while the Helm release and HTTP endpoint recover.
stages.0.objectives.0.text: The retained release adopts the values contract and the working chart renders each declared
  input profile correctly.
stages.0.objectives.1.text: Helm release `board` has at least 3 revisions and its latest status is `deployed`.
stages.0.objectives.2.text: The original Deployment, source ConfigMap, public Service and pinned image are kept.
stages.0.objectives.3.text: The live workload, released manifest and public bundle agree on the working HTTP contract.
stages.0.objectives.4.text: Deployment `board` completes its rollout.
stages.0.objectives.5.text: HTTP from Deployment `board` to `http://127.0.0.1:8080` returns `north-67`.
hints.0.text: Stored overrides, chart defaults, rendered intent and live resources are distinct views. A deployed
  revision is an operation result rather than proof of a healthy consumer.
hints.1.text: Compare `helm get values board`, `helm get values board --all`, `helm get manifest board`, `helm history
  board`, the working package/schema and Pod events. Use the supplied contract to identify which resource and input
  relationships must survive the upgrade.
hints.2.text: Reconstruct the required chart resources and their input propagation, inspect the declared render
  profiles, then upgrade the same release with the intended values layer. Verify `helm get values board -o json`,
  `helm history board`, `helm template board chart`, rollout and both HTTP paths. Expect recorded readiness `8080`,
  the supplied response `north-67`, original object/image identities and a metadata record matching the active message
  and retained release ID.
phrases.0: I compared Helm history, effective values and rendered manifests.
phrases.1: I corrected the release contract rather than hiding live drift.
phrases.2: I verified readiness independently of the Helm revision status.
questions.0.points.0: It reports release operation status.
questions.0.points.1: Readiness and actual traffic require their own checks.
questions.0.points.2: Use wait and inspect events when an upgrade stalls.
questions.0.prompt: Does Helm deployed prove the application is healthy?
questions.1.points.0: The next upgrade renders values again.
questions.1.points.1: A live patch can leave release intent incorrect.
questions.1.points.2: Compare the rendered resources and observed behavior.
questions.1.prompt: Why repair values instead of only patching the Deployment?
diagnostics.probe_0_3: The live workload, released manifest and public bundle agree on the working HTTP contract.
diagnostics.probe_0_0: The retained release adopts the values contract and the working chart renders each declared
  input profile correctly.
diagnostics.probe_0_2: The original Deployment, source ConfigMap, public Service and pinned image are kept.
diagnostics.helm_values_contract: The current release values and working chart must implement every declared render
  profile deterministically.
diagnostics.helm_image: Keep the supplied immutable application image in live and rendered workloads.
diagnostics.helm_projection: The workload must project the release source ConfigMap.
diagnostics.helm_bundle: The rendered and live source bundle must match the configured message and original release
  identity.
diagnostics.helm_service: The retained public Service must select the intended workload and expose the declared
  HTTP interface.
diagnostics.helm_publication: The actual public metadata response must match the original release identity and current
  message.
diagnostics.helm_identity: Keep the original release Deployment, source ConfigMap and public Service UIDs.
