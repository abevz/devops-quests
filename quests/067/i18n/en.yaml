title: Helm upgrades
brief: 'A Helm upgrade changed readinessPort from 8080 to 9090 while the actual board
  still listens on 8080. Inspect the release history, effective values and rendered
  chart. Correct the release through helm upgrade with readinessPort=8080, preserving
  the Deployment identity and pinned image. Do not replace the release or merely patch
  the live probe: Helm values must describe the healthy state.


  Quest files in `~/quest` (some appear in later stages): `chart/Chart.yaml`, `chart/values.yaml`,
  `chart/templates/board.yaml`, `original-deployment-uid`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images
  and private services. Change only this bay.


  Initial success criteria: The third or later Helm revision records port 8080, the
  original Deployment becomes ready and HTTP returns north-67.


  The authoritative setup evidence is read-only under `/run/dq/facts/0/`; matching
  files in `~/quest` are working copies.'
debrief: Release intent and live readiness now agree without replacing the managed
  Deployment.
stages.0.brief: 'Success criteria: The third or later Helm revision records port 8080,
  the original Deployment becomes ready and HTTP returns north-67.'
stages.0.objectives.0.text: The third or later Helm revision records port 8080, the
  original Deployment becomes ready and HTTP returns north-67.
hints.0.text: A deployed Helm revision can still contain an unhealthy workload.
hints.1.text: Compare helm get values and helm template with the live readiness probe.
hints.2.text: Upgrade the same release with the corrected readinessPort and wait for
  readiness.
phrases.0: I compared Helm history, effective values and rendered manifests.
phrases.1: I corrected the release contract rather than hiding live drift.
phrases.2: I verified readiness independently of the Helm revision status.
questions.0.points.0: It reports release operation status.
questions.0.points.1: Readiness and actual traffic require their own checks.
questions.0.points.2: Use wait and inspect events when an upgrade stalls.
questions.0.prompt: Does Helm deployed prove the application is healthy?
questions.1.points.0: The next upgrade renders values again.
questions.1.points.1: A live patch can leave release intent incorrect.
questions.1.points.2: Compare the rendered resources and observed behavior.
questions.1.prompt: Why repair values instead of only patching the Deployment?
