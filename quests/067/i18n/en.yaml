title: Helm upgrades
brief: |-
  The installed release is unhealthy and the working package does not meet its supplied values contract. Recover the same release while retaining its original resources and pinned image.

  Work on the workstation in `~/quest` with `chart/Chart.yaml`, `chart/values.yaml`, `chart/values.schema.json`, `chart/templates/board.yaml` and `helm-contract.json`.

  **Requirements:**
  - Helm release `board` values, its released manifest and the working chart agree on the supplied application contract.
  - Helm release `board` has at least 3 revisions and its latest status is `deployed`.
  - Retain the original Deployment, ConfigMap and Service identities and the supplied immutable application image.
  - The installed release and working chart implement the declared values contract: readiness, projected source bundle, route message, release identity and Service routing agree. All declared input profiles render deterministically with their specified parameter values.
  - Deployment `board` completes its rollout; HTTP inside its application container at `http://127.0.0.1:8080` returns `north-67`.
  - The retained public Service serves the same response and its declared metadata record with the original release identity.

  Protected setup facts record original identities. Checks compare current values, chart renders, release manifests, live objects and HTTP; they do not prove continuous availability or every possible input profile.
debrief: The retained release now adopts a functioning chart contract. Source projection and public routing agree
  with current values, and alternative renders exercise the repaired parameter propagation.
stages.0.brief: Keep the original workload while the Helm release and HTTP endpoint recover.
stages.0.objectives.0.text: The retained release adopts the values contract and the working chart renders each declared
  input profile correctly.
stages.0.objectives.1.text: Helm release `board` has at least 3 revisions and its latest status is `deployed`.
stages.0.objectives.2.text: The original Deployment, source ConfigMap, public Service and pinned image are kept.
stages.0.objectives.3.text: The live workload, released manifest and public bundle agree on the working HTTP contract.
stages.0.objectives.4.text: Deployment `board` completes its rollout.
stages.0.objectives.5.text: HTTP from Deployment `board` to `http://127.0.0.1:8080` returns `north-67`.
hints.0.text: Stored overrides, chart defaults, rendered intent and live resources are distinct views. A deployed
  revision is an operation result rather than proof of a healthy consumer.
hints.1.text: |-
  Compare `helm get values board`, `helm get values board --all`, `helm get manifest board`, `helm history board`, the working package/schema and Pod events. Use the supplied contract to identify which resource and input relationships must survive the upgrade.

  In helm-contract.json, look for the render profiles and the required relationship between input values, the projected source, and the Service. In the chart, trace those inputs from values.yaml and values.schema.json to the resource templates.
hints.2.text: |-
  Verify `helm get values board -o json`, `helm history board`, `helm template board chart`, rollout and both HTTP paths. Expect recorded readiness `8080`, the supplied response `north-67`, original object/image identities and a metadata record matching the active message and retained release ID.
phrases.0: I compared Helm history, effective values and rendered manifests.
phrases.1: I corrected the release contract rather than hiding live drift.
phrases.2: I verified readiness independently of the Helm revision status.
questions.0.points.0: It reports release operation status.
questions.0.points.1: Readiness and actual traffic require their own checks.
questions.0.points.2: Use wait and inspect events when an upgrade stalls.
questions.0.prompt: Does Helm deployed prove the application is healthy?
questions.1.points.0: The next upgrade renders values again.
questions.1.points.1: A live patch can leave release intent incorrect.
questions.1.points.2: Compare the rendered resources and observed behavior.
questions.1.prompt: Why repair values instead of only patching the Deployment?
diagnostics.probe_0_0: The stored readinessPort is not 8080 or the chart/input probe stopped without a named marker; the supplied reused override 9090, missing ConfigMap/Service templates, invalid YAML/JSON or unavailable protected/Helm inputs can explain it. [Cause and check](guides#guide=helm-8&section=upgrade-stored-values-and-chart-inputs)
diagnostics.helm_values_contract: The effective release values or a declared render profile did not meet the contract, or its Helm command failed; hardcoded readiness/message values, a changed release ID/image, wrong namespace or nondeterministic templates can prevent reusable rendering. [Cause and check](guides#guide=helm-8&section=upgrade-reusable-deterministic-values)
diagnostics.helm_image: A checked live or rendered worker image differs from the supplied reference or digest; changing an image value or template instead of repairing the chart can replace the protected application. [Cause and check](guides#guide=helm-8&section=upgrade-original-immutable-image)
diagnostics.helm_projection: The worker does not mount a volume that references the release ConfigMap; an omitted volume, mount-name mismatch or a different source can disconnect the chart bundle from the workload. [Cause and check](guides#guide=helm-8&section=upgrade-projected-source-configmap)
diagnostics.helm_bundle: The source bundle does not match the configured message and original release ID, or its manifest/API query failed; hardcoded north-67, stale ConfigMap data or a substituted release.json can break the default or canary profile. [Cause and check](guides#guide=helm-8&section=upgrade-parameterized-source-bundle)
diagnostics.helm_service: The public Service type, selector or declared TCP port does not match the workload contract; missing or stale Service templates, changed labels or a wrong public port can prevent selecting the intended release. [Cause and check](guides#guide=helm-8&section=upgrade-public-service-selection)
diagnostics.helm_identity: An original release object changed UID; uninstalling, deleting and recreating the Deployment, ConfigMap or Service can keep names while replacing the identities recorded by setup. [Cause and check](guides#guide=helm-8&section=upgrade-original-release-object-uids)
diagnostics.probe_0_2: The original Deployment UID was not retained or the identity/image probe could not finish; recreating board, losing protected UID records, missing live objects or failed API/JSON observations can explain it. [Cause and check](guides#guide=helm-8&section=upgrade-deployment-identity-observation)
diagnostics.probe_0_3: The live and released readiness definitions did not verify the HTTP contract, or bundle observation stopped without a named marker; a stale 9090 probe, invalid handler/host/scheme, missing release objects or malformed bundle inputs can explain it. [Cause and check](guides#guide=helm-8&section=upgrade-live-and-released-readiness)
diagnostics.helm_publication: The actual public release metadata did not match the original release ID and current route, or its request/JSON read failed; stale projected data, wrong Service routing or an unavailable worker can prevent consumer adoption. [Cause and check](guides#guide=helm-8&section=upgrade-public-release-metadata)
diagnostics.helm_history: Helm history does not show at least three revisions with the latest deployed, or the history query failed; only patching live objects, an incomplete upgrade or a failed latest revision can leave release history unsatisfied. [Cause and check](guides#guide=helm-8&section=upgrade-deployed-third-revision)
diagnostics.helm_rollout: Deployment board did not finish rollout within 3 seconds; retained readiness overrides, missing source ConfigMap, unavailable Pods or failed API observation may still prevent a healthy rollout. [Cause and check](guides#guide=helm-8&section=upgrade-workload-rollout-readiness)
diagnostics.helm_http: The worker did not return north-67 at localhost:8080 or exec/HTTP failed; unready Pods, missing projected bundle data or stale served content can leave the application response wrong even after a deployed Helm revision. [Cause and check](guides#guide=helm-8&section=upgrade-local-worker-response)
