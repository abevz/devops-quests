title: Helm upgrades
brief: |
  The installed Helm release is not providing a ready HTTP workload. Keep the original Deployment identity and the supplied pinned image.

  Work in `~/quest` on the workstation. Supplied inputs: `chart/Chart.yaml`, `chart/values.yaml`, `chart/templates/board.yaml`, `original-deployment-uid`.

  **Requirements:**
  - Deployment `board` completes its rollout.
  - The fix is applied through Helm release `board` values, not by editing the Deployment.
  - Helm release `board` has at least three revisions; the latest status is `deployed`.
  - The original Deployment `board` is kept. Its UID matches the protected reference on the workstation:
    - `/run/dq/facts/0/original-deployment-uid`
  - Inside Deployment `board`, container `worker` has an HTTP readiness probe on port `8080`.
  - Inside container `worker` of Deployment `board`, HTTP to `http://127.0.0.1:8080` returns `north-67`.

  **Verify yourself before Check & finish:**
  Run these observation commands from `~/quest` on the workstation.
  - `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://127.0.0.1:8080` — Inside the application container, the HTTP response is `north-67`.
  - There are at least three revisions, the latest is `deployed`, and release values describe the healthy workload.

    ```sh
    helm history board
    helm get values board
    ```
  - The rollout is complete, the HTTP readiness probe uses port `8080`, and the Deployment UID matches the protected reference.

    ```sh
    kubectl rollout status deployment/board --timeout=3s
    kubectl get deployment board -o yaml
    cat /run/dq/facts/0/original-deployment-uid
    ```

  Setup evidence under `/run/dq/facts/0/` on the workstation is authoritative and read-only; matching files in `~/quest` are working copies.
debrief: Release intent and live readiness now agree without replacing the managed
  Deployment.
stages.0.brief: |
  Keep the original workload while the Helm release and HTTP endpoint recover.
stages.0.objectives.0.text: The fix is applied through Helm release `board` values, not by editing the
  Deployment.
stages.0.objectives.1.text: Helm release `board` has at least 3 revisions and its latest status is `deployed`.
stages.0.objectives.2.text: The original Deployment `board` is kept.
stages.0.objectives.3.text: The board container uses port `8080` for its HTTP readiness probe.
stages.0.objectives.4.text: Deployment `board` completes its rollout.
stages.0.objectives.5.text: HTTP from Deployment `board` to `http://127.0.0.1:8080` returns `north-67`.
hints.0.text: A deployed Helm revision can still contain an unhealthy workload.
hints.1.text: Compare helm get values and helm template with the live readiness probe.
hints.2.text: |
  The upgrade changed readinessPort from 8080 to 9090 while the application still listens on 8080. Inspect release history, effective values and the rendered chart. Upgrade the same release with readinessPort=8080 and wait for readiness; do not replace the release or merely patch the live probe.
phrases.0: I compared Helm history, effective values and rendered manifests.
phrases.1: I corrected the release contract rather than hiding live drift.
phrases.2: I verified readiness independently of the Helm revision status.
questions.0.points.0: It reports release operation status.
questions.0.points.1: Readiness and actual traffic require their own checks.
questions.0.points.2: Use wait and inspect events when an upgrade stalls.
questions.0.prompt: Does Helm deployed prove the application is healthy?
questions.1.points.0: The next upgrade renders values again.
questions.1.points.1: A live patch can leave release intent incorrect.
questions.1.points.2: Compare the rendered resources and observed behavior.
questions.1.prompt: Why repair values instead of only patching the Deployment?
