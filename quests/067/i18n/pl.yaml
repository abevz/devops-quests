title: Aktualizacje Helm
brief: |-
  Zainstalowany release jest niezdrowy, a pakiet roboczy nie spełnia dostarczonego kontraktu values. Przywróć ten sam release, zachowując pierwotne zasoby i przypięty obraz.

  Pracuj w `~/quest` na stacji roboczej z `chart/Chart.yaml`, `chart/values.yaml`, `chart/values.schema.json`, `chart/templates/board.yaml` i `helm-contract.json`.

  **Wymagania:**
  - Values release Helm `board`, jego opublikowany manifest i chart roboczy są zgodne z dostarczonym kontraktem aplikacji.
  - Release Helm `board` ma co najmniej 3 rewizje, a ostatni status to `deployed`.
  - Zachowaj pierwotne UID Deploymentu, ConfigMap i Service oraz dostarczony niezmienny obraz aplikacji.
  - Zainstalowany release i chart roboczy realizują kontrakt values: readiness, projekcja źródła, komunikat trasy, tożsamość release i routing Service są zgodne. Wszystkie zadeklarowane profile renderują się deterministycznie.
  - Deployment `board` kończy rollout; HTTP wewnątrz kontenera pod `http://127.0.0.1:8080` zwraca `north-67`.
  - Zachowany publiczny Service zwraca tę samą odpowiedź oraz zadeklarowany rekord metadanych z pierwotną tożsamością release.

  Chronione fakty setup zapisują pierwotne tożsamości. Testy porównują bieżące values, rendery chartu, manifesty, żywe obiekty i HTTP; nie dowodzą ciągłej dostępności ani obsługi wszystkich możliwych profili wejścia.
debrief: Zachowany release przyjmuje działający kontrakt chartu. Projekcja źródła i publiczny routing odpowiadają
  values; alternatywne rendery sprawdzają naprawioną propagację parametrów.
stages.0.brief: Zachowaj oryginalne obciążenie podczas przywracania wydania Helm i punktu HTTP.
stages.0.objectives.0.text: Zachowany release przyjmuje kontrakt values, a chart roboczy poprawnie renderuje każdy
  zadeklarowany profil.
stages.0.objectives.1.text: Release Helm `board` ma co najmniej 3 rewizje, a ostatnia ma status `deployed`.
stages.0.objectives.2.text: Pierwotny Deployment, źródłowy ConfigMap, publiczny Service i przypięty obraz pozostają
  zachowane.
stages.0.objectives.3.text: Żywy workload, manifest release i publiczne dane spełniają zgodny działający kontrakt
  HTTP.
stages.0.objectives.4.text: Deployment `board` kończy rollout.
stages.0.objectives.5.text: HTTP z Deployment `board` do `http://127.0.0.1:8080` zwraca `north-67`.
hints.0.text: Zapisane overrides, defaults chartu, wyrenderowana intencja i żywe zasoby to odrębne widoki. Status
  deployed opisuje operację, a nie dowodzi zdrowego consumera.
hints.1.text: |-
  Porównaj `helm get values board`, `helm get values board --all`, `helm get manifest board`, `helm history board`, pakiet/schema robocze i zdarzenia Podów. Z kontraktu odczytaj relacje zasobów i wejść, które muszą przetrwać upgrade.

  W helm-contract.json odszukaj profile renderowania i wymaganą zależność między wartościami wejściowymi, rzutowanym źródłem i Service. W charcie prześledź te wartości od values.yaml i values.schema.json do szablonów zasobów.
hints.2.text: |-
  Sprawdź `helm get values board -o json`, `helm history board`, `helm template board chart`, rollout i obie ścieżki HTTP. Oczekuj zapisanej readiness `8080`, odpowiedzi `north-67`, pierwotnych tożsamości obiektów/obrazu oraz metadanych z aktywnym komunikatem i zachowanym ID release.
phrases.0: Porównałem historię Helm, efektywną values i wyrenderowany manifests.
phrases.1: Zamiast ukrywać live drift, poprawiłem umowę wydawniczą.
phrases.2: Zweryfikowałem readiness niezależnie od statusu wersji Helm.
questions.0.points.0: Raportuje stan operacji wydania.
questions.0.points.1: Readiness i rzeczywisty ruch wymagają własnych kontroli.
questions.0.points.2: Użyj wait i sprawdź events, gdy upgrade się zatrzyma.
questions.0.prompt: Czy Helm deployed dowodzi, że aplikacja jest sprawna?
questions.1.points.0: Następny upgrade ponownie renderuje values.
questions.1.points.1: Aktualizacja na żywo może spowodować, że zamiar wydania będzie nieprawidłowy.
questions.1.points.2: Porównaj wyrenderowane zasoby i zaobserwowane zachowanie.
questions.1.prompt: Po co naprawiać values zamiast tylko łatać Deployment?
diagnostics.probe_0_0: Zapisany readinessPort nie jest 8080 lub kontrola zakończyła się bez markera; dostarczone zachowane nadpisanie 9090, brak szablonów ConfigMap/Service, błędny YAML/JSON lub niedostępne dane Helm mogą to wyjaśniać. [Przyczyna i kontrola](guides#guide=helm-8&section=upgrade-stored-values-and-chart-inputs)
diagnostics.helm_values_contract: Efektywne values lub profil renderowania nie spełniły kontraktu albo polecenie Helm zawiodło; stałe readiness/komunikatu, zmieniony release ID/obraz, zły namespace lub niedeterministyczne szablony blokują wielokrotne użycie. [Przyczyna i kontrola](guides#guide=helm-8&section=upgrade-reusable-deterministic-values)
diagnostics.helm_image: Sprawdzany obraz worker na żywo lub w renderze różni się od dostarczonej referencji/digest; zmiana image w values lub szablonie zamiast naprawy chart zastępuje chronioną aplikację. [Przyczyna i kontrola](guides#guide=helm-8&section=upgrade-original-immutable-image)
diagnostics.helm_projection: worker nie montuje wolumenu odwołującego się do ConfigMap wydania; brak wolumenu, niezgodna nazwa montowania lub inne źródło odłącza pakiet chart od aplikacji. [Przyczyna i kontrola](guides#guide=helm-8&section=upgrade-projected-source-configmap)
diagnostics.helm_bundle: Pakiet źródła nie odpowiada komunikatowi i pierwotnemu release ID lub odczyt manifestu/API zawiódł; stałe north-67, stare dane ConfigMap lub podstawiony release.json psują profil domyślny albo canary. [Przyczyna i kontrola](guides#guide=helm-8&section=upgrade-parameterized-source-bundle)
diagnostics.helm_service: Typ Service, selektor lub zadeklarowany port TCP nie odpowiadają kontraktowi; brak/stary szablon Service, zmienione etykiety lub zły port publiczny blokują wybór wydania. [Przyczyna i kontrola](guides#guide=helm-8&section=upgrade-public-service-selection)
diagnostics.helm_identity: Pierwotny obiekt wydania zmienił UID; uninstall, usunięcie i odtworzenie Deployment, ConfigMap lub Service zachowują nazwy, ale zastępują tożsamości setup. [Przyczyna i kontrola](guides#guide=helm-8&section=upgrade-original-release-object-uids)
diagnostics.probe_0_2: Nie zachowano pierwotnego UID Deployment lub kontrola tożsamości/obrazu nie zakończyła się; odtworzenie board, brak chronionych UID, obiektów lub błędy API/JSON mogą to wyjaśniać. [Przyczyna i kontrola](guides#guide=helm-8&section=upgrade-deployment-identity-observation)
diagnostics.probe_0_3: Gotowość na żywo i w wydanym manifeście nie potwierdziła kontraktu HTTP lub obserwacja pakietu zatrzymała się bez markera; stare 9090, błędny handler/host/scheme, brak obiektów lub błędne dane mogą to wyjaśniać. [Przyczyna i kontrola](guides#guide=helm-8&section=upgrade-live-and-released-readiness)
diagnostics.helm_publication: Publiczne metadane nie odpowiadają pierwotnemu release ID i trasie lub odczyt żądania/JSON zawiódł; stare dane projekcji, zły routing Service lub niedostępny worker blokują przyjęcie publikacji. [Przyczyna i kontrola](guides#guide=helm-8&section=upgrade-public-release-metadata)
diagnostics.helm_history: Historia Helm nie pokazuje co najmniej trzech rewizji z ostatnią deployed lub odczyt zawiódł; poprawa tylko żywych obiektów, nieukończony upgrade lub nieudana ostatnia rewizja nie spełnia historii. [Przyczyna i kontrola](guides#guide=helm-8&section=upgrade-deployed-third-revision)
diagnostics.helm_rollout: Deployment board nie ukończył rollout w 3 sekundy; zachowane nadpisania readiness, brak ConfigMap, niedostępne Pody lub błąd API nadal blokują gotowość. [Przyczyna i kontrola](guides#guide=helm-8&section=upgrade-workload-rollout-readiness)
diagnostics.helm_http: worker nie zwrócił north-67 pod localhost:8080 lub exec/HTTP zawiódł; niegotowe Pody, brak danych projekcji lub stara treść daje złą odpowiedź mimo rewizji Helm deployed. [Przyczyna i kontrola](guides#guide=helm-8&section=upgrade-local-worker-response)
