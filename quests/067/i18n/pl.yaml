hints.0.text: Wersja deployed Helm może nadal zawierać niezdrową wersję workload.
hints.1.text: 'Porównaj dane wejściowe wydania, wyrenderowany workload i stan działającego zasobu:


  ```sh

  helm get values board

  helm template board chart

  kubectl get deployment board -o yaml

  ```'
hints.2.text: "Aktualizacja zmieniła readinessPort z 8080 na 9090, a aplikacja nadal nasłuchuje na 8080. Sprawdź historię wydania, efektywne wartości i wyrenderowany chart. Zaktualizuj to samo wydanie z readinessPort=8080 i poczekaj na gotowość; nie zastępuj wydania ani nie ograniczaj się do edycji działającej sondy.\n\nSprawdź obserwowany wynik:\n\n- `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://127.0.0.1:8080` — W kontenerze aplikacji odpowiedź to `north-67`.\n\n- `helm history board` — Co najmniej `3` rewizje; najnowszy status to `deployed`.\n\n- Rollout kończy się, a UID działającego Deployment odpowiada chronionej pierwotnej wartości odniesienia.\n\n  ```sh\n  kubectl rollout status deployment/board --timeout=3s\n  kubectl get deployment board -o custom-columns=NAME:.metadata.name,UID:.metadata.uid\n  cat /run/dq/facts/0/original-deployment-uid\n  ```\n\n- Trzy sprawdzenia wypisują `true`: wartości wskazują `8080`, a sonda gotowości kontenera `worker` używa portu aplikacji `8080` zarówno w działającym Deployment, jak i w manifeście wyrenderowanym przez Helm. Sonda HTTP lub TCP może używać liczby albo nazwy portu wskazującej tę liczbę.\n\n  ```sh\n  helm get values board -o json | jq -e '(.readinessPort|tonumber)==8080'\n  kubectl get deployment board -o json | jq -e '(.spec.template.spec.containers[] | select(.name==\"worker\")) as $c | ($c.readinessProbe.httpGet.port // $c.readinessProbe.tcpSocket.port) as $p | (if ($p|type)==\"number\" then $p else first($c.ports[]? | select(.name==$p) | .containerPort) end)==8080'\n  helm get manifest board | python3 -I -c 'import json,sys,yaml; docs=[d for d in yaml.safe_load_all(sys.stdin) if isinstance(d,dict) and d.get(\"kind\")==\"Deployment\" and d.get(\"metadata\",{}).get(\"name\")==\"board\"]; assert len(docs)==1; json.dump(docs[0],sys.stdout)' | jq -e '(.spec.template.spec.containers[] | select(.name==\"worker\")) as $c | ($c.readinessProbe.httpGet.port // $c.readinessProbe.tcpSocket.port) as $p | (if ($p|type)==\"number\" then $p else first($c.ports[]? | select(.name==$p) | .containerPort) end)==8080'\n  ```\n"
phrases.0: Porównałem historię Helm, efektywną values i wyrenderowany manifests.
phrases.1: Zamiast ukrywać live drift, poprawiłem umowę wydawniczą.
phrases.2: Zweryfikowałem readiness niezależnie od statusu wersji Helm.
questions.0.points.0: Raportuje stan operacji wydania.
questions.0.points.1: Readiness i rzeczywisty ruch wymagają własnych kontroli.
questions.0.points.2: Użyj wait i sprawdź events, gdy upgrade się zatrzyma.
questions.0.prompt: Czy Helm deployed dowodzi, że aplikacja jest sprawna?
questions.1.points.0: Następny upgrade ponownie renderuje values.
questions.1.points.1: Aktualizacja na żywo może spowodować, że zamiar wydania będzie nieprawidłowy.
questions.1.points.2: Porównaj wyrenderowane zasoby i zaobserwowane zachowanie.
questions.1.prompt: Po co naprawiać values zamiast tylko łatać Deployment?
diagnostics.probe_0_3: 'Bieżące dane nie pozwalają potwierdzić tego celu: Działający workload `board` i wyrenderowane
  wydanie są zgodne co do działającego punktu końcowego HTTP.'
