title: Aktualizacje Helm
brief: 'Zainstalowane wydanie Helm nie zapewnia gotowego obciążenia HTTP. Zachowaj oryginalną tożsamość Deployment
  i dostarczony przypięty obraz.


  Pracuj na stacji roboczej w `~/quest` z `chart/Chart.yaml`, `chart/values.yaml`, `chart/templates/board.yaml`.


  **Wymagania:**

  - Poprawka jest wprowadzona przez wartości release’u Helm `board`, a nie przez edytowanie Deploymentu.

  - Release Helm `board` ma co najmniej 3 rewizje, a ostatnia ma status `deployed`.

  - Oryginalny Deployment `board` zostaje zachowany.

  - Działający workload `board` i wyrenderowane wydanie są zgodne co do działającego punktu końcowego HTTP.

  - Deployment `board` kończy rollout.

  - HTTP z Deployment `board` do `http://127.0.0.1:8080` zwraca `north-67`.


  Dowody początkowe w `/run/dq/facts/0/` na workstation są wiążące i tylko do odczytu; odpowiadające im pliki
  w `~/quest` są kopiami roboczymi.

  '
debrief: Zamiar wydania i gotowość do działania są teraz zgodne bez konieczności wymiany zarządzanego Deployment.
stages.0.brief: Zachowaj oryginalne obciążenie podczas przywracania wydania Helm i punktu HTTP.
stages.0.objectives.0.text: Poprawka jest wprowadzona przez wartości release’u Helm `board`, a nie przez edytowanie
  Deploymentu.
stages.0.objectives.1.text: Release Helm `board` ma co najmniej 3 rewizje, a ostatnia ma status `deployed`.
stages.0.objectives.2.text: Oryginalny Deployment `board` zostaje zachowany.
