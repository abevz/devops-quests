title: Aktualizacje Helm
brief: |
  Zainstalowane wydanie Helm nie zapewnia gotowego obciążenia HTTP. Zachowaj oryginalną tożsamość Deployment i dostarczony przypięty obraz.

  Pracuj w `~/quest` na workstation. Dostarczone pliki wejściowe: `chart/Chart.yaml`, `chart/values.yaml`, `chart/templates/board.yaml`, `original-deployment-uid`.

  **Wymagania:**
  - Deployment `board` kończy rollout.
  - Poprawka jest wprowadzona przez wartości wydania Helm `board`, a nie przez edycję Deployment.
  - Wydanie Helm `board` ma co najmniej trzy rewizje; najnowszy status to `deployed`.
  - Oryginalny Deployment `board` zostaje zachowany. Jego UID odpowiada chronionemu wzorcowi na workstation:
    - `/run/dq/facts/0/original-deployment-uid`
  - W Deployment `board` kontener `worker` ma sondę HTTP readiness na porcie `8080`.
  - Wewnątrz kontenera `worker` Deployment `board` żądanie HTTP do `http://127.0.0.1:8080` zwraca `north-67`.

  **Sprawdź samodzielnie przed Check & finish:**
  Wykonaj te polecenia obserwacyjne w `~/quest` na workstation.
  - `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://127.0.0.1:8080` — Wewnątrz kontenera aplikacji odpowiedź HTTP to `north-67`.
  - Istnieją co najmniej trzy rewizje, najnowsza ma status `deployed`, a wartości wydania opisują zdrowe obciążenie.

    ```sh
    helm history board
    helm get values board
    ```
  - Rollout jest zakończony, sonda HTTP readiness używa portu `8080`, a UID Deployment odpowiada chronionemu wzorcowi.

    ```sh
    kubectl rollout status deployment/board --timeout=3s
    kubectl get deployment board -o yaml
    cat /run/dq/facts/0/original-deployment-uid
    ```

  Dowody początkowe w `/run/dq/facts/0/` na workstation są wiążące i tylko do odczytu; odpowiadające im pliki w `~/quest` są kopiami roboczymi.
debrief: Zamiar wydania i gotowość do działania są teraz zgodne bez konieczności wymiany zarządzanego
  Deployment.
stages.0.brief: |
  Zachowaj oryginalne obciążenie podczas przywracania wydania Helm i punktu HTTP.
stages.0.objectives.0.text: Poprawka jest wprowadzona przez wartości release’u Helm `board`, a nie przez
  edytowanie Deploymentu.
stages.0.objectives.1.text: Release Helm `board` ma co najmniej 3 rewizje, a ostatnia ma status `deployed`.
stages.0.objectives.2.text: Oryginalny Deployment `board` zostaje zachowany.
stages.0.objectives.3.text: Kontener board używa portu `8080` dla swojej sondy HTTP readiness.
stages.0.objectives.4.text: Deployment `board` kończy rollout.
stages.0.objectives.5.text: HTTP z Deployment `board` do `http://127.0.0.1:8080` zwraca `north-67`.
hints.0.text: Wersja deployed Helm może nadal zawierać niezdrową wersję workload.
hints.1.text: Porównaj helm get values i helm template z aktywnym readiness probe.
hints.2.text: |
  Aktualizacja zmieniła readinessPort z 8080 na 9090, a aplikacja nadal nasłuchuje na 8080. Sprawdź historię wydania, efektywne wartości i wyrenderowany chart. Zaktualizuj to samo wydanie z readinessPort=8080 i poczekaj na gotowość; nie zastępuj wydania ani nie ograniczaj się do edycji działającej sondy.
phrases.0: Porównałem historię Helm, efektywną values i wyrenderowany manifests.
phrases.1: Zamiast ukrywać live drift, poprawiłem umowę wydawniczą.
phrases.2: Zweryfikowałem readiness niezależnie od statusu wersji Helm.
questions.0.points.0: Raportuje stan operacji wydania.
questions.0.points.1: Readiness i rzeczywisty ruch wymagają własnych kontroli.
questions.0.points.2: Użyj wait i sprawdź events, gdy upgrade się zatrzyma.
questions.0.prompt: Czy Helm deployed dowodzi, że aplikacja jest sprawna?
questions.1.points.0: Następny upgrade ponownie renderuje values.
questions.1.points.1: Aktualizacja na żywo może spowodować, że zamiar wydania będzie nieprawidłowy.
questions.1.points.2: Porównaj wyrenderowane zasoby i zaobserwowane zachowanie.
questions.1.prompt: Po co naprawiać values zamiast tylko łatać Deployment?
