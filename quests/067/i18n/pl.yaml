title: Aktualizacje Helm
brief: 'Helm upgrade zmienił readinessPort z 8080 na 9090, podczas gdy rzeczywisty board nadal nasłuchuje
  na 8080. Sprawdź historię wydań, obowiązującą values i renderowaną chart. Popraw wydanie poprzez helm
  upgrade z readinessPort=8080, zachowując tożsamość Deployment i przypięte image. Nie zastępuj wydania
  ani nie ograniczaj naprawy do ręcznej zmiany działającej sondy: Helm values muszą opisywać prawidłowy
  stan.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `chart/Chart.yaml`, `chart/values.yaml`,
  `chart/templates/board.yaml`, `original-deployment-uid`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: Trzecia lub późniejsza wersja Helm rejestruje port 8080, oryginalny Deployment
  staje się gotowy, a HTTP zwraca north-67.


  Wiarygodne dowody konfiguracji są przeznaczone tylko do odczytu w ramach `/run/dq/facts/0/`; pasujące
  pliki w `~/quest` są kopiami roboczymi.'
debrief: Zamiar wydania i gotowość do działania są teraz zgodne bez konieczności wymiany zarządzanego
  Deployment.
stages.0.brief: 'Kryteria sukcesu: Trzecia lub późniejsza wersja Helm rejestruje port 8080, oryginalny
  Deployment staje się gotowy, a HTTP zwraca north-67.'
stages.0.objectives.0.text: Trzecia lub późniejsza wersja Helm rejestruje port 8080, oryginalny Deployment
  staje się gotowy, a HTTP zwraca north-67.
hints.0.text: Wersja deployed Helm może nadal zawierać niezdrową wersję workload.
hints.1.text: Porównaj helm get values i helm template z aktywnym readiness probe.
hints.2.text: Zaktualizuj tę samą wersję z poprawionym readinessPort i poczekaj na gotowość.
phrases.0: Porównałem historię Helm, efektywną values i wyrenderowany manifests.
phrases.1: Zamiast ukrywać live drift, poprawiłem umowę wydawniczą.
phrases.2: Zweryfikowałem readiness niezależnie od statusu wersji Helm.
questions.0.points.0: Raportuje stan operacji wydania.
questions.0.points.1: Readiness i rzeczywisty ruch wymagają własnych kontroli.
questions.0.points.2: Użyj wait i sprawdź events, gdy upgrade się zatrzyma.
questions.0.prompt: Czy Helm deployed dowodzi, że aplikacja jest sprawna?
questions.1.points.0: Następny upgrade ponownie renderuje values.
questions.1.points.1: Aktualizacja na żywo może spowodować, że zamiar wydania będzie nieprawidłowy.
questions.1.points.2: Porównaj wyrenderowane zasoby i zaobserwowane zachowanie.
questions.1.prompt: Po co naprawiać values zamiast tylko łatać Deployment?
