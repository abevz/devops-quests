title: Helm-Upgrades
brief: 'Ein Helm upgrade hat readinessPort von 8080 auf 9090 geändert, während der eigentliche board immer
  noch auf 8080 lauscht. Überprüfen Sie den Veröffentlichungsverlauf, gültiges values und gerendert chart.
  Korrigieren Sie die Veröffentlichung über helm upgrade mit readinessPort=8080, wobei Deployment identity
  und das angeheftete Bild erhalten bleiben. Ersetzen Sie nicht die Version oder einfach nur patch. Der
  Live-Zustand probe: Helm values muss den fehlerfreien Zustand beschreiben.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `chart/Chart.yaml`, `chart/values.yaml`,
  `chart/templates/board.yaml`, `original-deployment-uid`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Anfängliche Erfolgskriterien: Die dritte oder spätere Helm-Revision zeichnet Port 8080 auf, das ursprüngliche
  Deployment wird bereit und HTTP gibt north-67 zurück.


  Der maßgebliche Setup-Beweis ist unter `/run/dq/facts/0/` schreibgeschützt; übereinstimmende Dateien
  in `~/quest` sind Arbeitskopien.'
debrief: Release-Absicht und Live-Bereitschaft stimmen nun überein, ohne den verwalteten Deployment zu
  ersetzen.
stages.0.brief: 'Erfolgskriterien: Die dritte oder spätere Helm-Revision zeichnet Port 8080 auf, das ursprüngliche
  Deployment wird bereit und HTTP gibt north-67 zurück.'
stages.0.objectives.0.text: Die dritte oder spätere Helm-Revision zeichnet Port 8080 auf, der ursprüngliche
  Deployment wird bereit und HTTP gibt north-67 zurück.
hints.0.text: Eine deployed Helm-Revision kann immer noch einen fehlerhaften workload enthalten.
hints.1.text: Vergleichen Sie helm mit values und helm template mit dem Live-readiness probe.
hints.2.text: Aktualisieren Sie dieselbe Version mit dem korrigierten readinessPort und warten Sie auf
  die Bereitschaft.
phrases.0: Ich habe den Helm-Verlauf, den effektiven values und den gerenderten manifests verglichen.
phrases.1: Ich habe den Veröffentlichungsvertrag korrigiert, anstatt ihn live auszublenden drift.
phrases.2: Ich habe readiness unabhängig vom Revisionsstatus Helm überprüft.
questions.0.points.0: Es meldet den Status des Freigabevorgangs.
questions.0.points.1: Readiness und der tatsächliche Datenverkehr erfordern eigene Prüfungen.
questions.0.points.2: Verwenden Sie „wait“ und „inspect events“, wenn ein upgrade stehen bleibt.
questions.0.prompt: Beweist Helm deployed, dass die Anwendung fehlerfrei ist?
questions.1.points.0: Der nächste upgrade rendert erneut values.
questions.1.points.1: Ein Live-patch kann dazu führen, dass die Freigabeabsicht falsch ist.
questions.1.points.2: Vergleichen Sie die gerenderten Ressourcen und das beobachtete Verhalten.
questions.1.prompt: Warum values reparieren, anstatt nur Deployment zu patchen?
