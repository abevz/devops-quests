title: Helm-Upgrades
brief: 'Das installierte Helm-Release stellt keinen bereiten HTTP-Workload bereit. Behalten Sie die ursprüngliche
  Deployment-Identität und das vorgegebene festgelegte Image bei.


  Arbeiten Sie auf der Workstation in `~/quest` mit `chart/Chart.yaml`, `chart/values.yaml`, `chart/templates/board.yaml`.


  **Anforderungen:**

  - Die Korrektur erfolgt über die Werte des Helm-Releases `board`, nicht durch Bearbeiten des Deployments.

  - Helm-Release `board` hat mindestens 3 Revisionen und zuletzt Status `deployed`.

  - Das ursprüngliche Deployment `board` bleibt erhalten.

  - Der laufende Workload `board` und die gerenderte Version stimmen hinsichtlich des funktionierenden HTTP-Endpunkts
  überein.

  - Deployment `board` schließt seinen Rollout ab.

  - HTTP von Deployment `board` an `http://127.0.0.1:8080` liefert `north-67`.


  Die Ausgangsnachweise unter `/run/dq/facts/0/` auf der Workstation sind maßgeblich und schreibgeschützt;
  entsprechende Dateien in `~/quest` sind Arbeitskopien.

  '
debrief: Release-Absicht und Live-Bereitschaft stimmen nun überein, ohne den verwalteten Deployment zu ersetzen.
stages.0.brief: Behalten Sie den ursprünglichen Workload bei, während Helm-Release und HTTP-Endpunkt wiederhergestellt
  werden.
stages.0.objectives.0.text: Die Korrektur erfolgt über die Werte des Helm-Releases `board`, nicht durch Bearbeiten
  des Deployments.
stages.0.objectives.1.text: Helm-Release `board` hat mindestens 3 Revisionen und zuletzt Status `deployed`.
stages.0.objectives.2.text: Das ursprüngliche Deployment `board` bleibt erhalten.
stages.0.objectives.3.text: Der laufende Workload `board` und die gerenderte Version stimmen hinsichtlich des
  funktionierenden HTTP-Endpunkts überein.
stages.0.objectives.4.text: Deployment `board` schließt seinen Rollout ab.
stages.0.objectives.5.text: HTTP von Deployment `board` an `http://127.0.0.1:8080` liefert `north-67`.
hints.0.text: Eine deployed Helm-Revision kann immer noch einen fehlerhaften workload enthalten.
hints.1.text: 'Vergleichen Sie die Release-Eingaben, den gerenderten Workload und den aktuellen Zustand:


  ```sh

  helm get values board

  helm template board chart

  kubectl get deployment board -o yaml

  ```'
hints.2.text: "Das Upgrade änderte readinessPort von 8080 auf 9090, während die Anwendung weiterhin auf 8080\
  \ lauscht. Prüfen Sie Release-Verlauf, effektive Werte und gerendertes Chart. Aktualisieren Sie dasselbe\
  \ Release mit readinessPort=8080 und warten Sie auf Bereitschaft; ersetzen Sie weder das Release noch ändern\
  \ Sie nur die laufende Probe.\n\nPrüfen Sie das beobachtete Ergebnis:\n\n- `kubectl exec deployment/board\
  \ -c worker -- wget -qO- -T 3 http://127.0.0.1:8080` — Im Anwendungscontainer lautet die Antwort `north-67`.\n\
  \n- `helm history board` — Mindestens `3` Revisionen; der neueste Status ist `deployed`.\n\n- Der Rollout\
  \ wird abgeschlossen und die UID des laufenden Deployments entspricht der geschützten ursprünglichen Referenz.\n\
  \n  ```sh\n  kubectl rollout status deployment/board --timeout=3s\n  kubectl get deployment board -o custom-columns=NAME:.metadata.name,UID:.metadata.uid\n\
  \  cat /run/dq/facts/0/original-deployment-uid\n  ```\n\n- Die Werteprüfung gibt `true` aus, und der HTTP-Port\
  \ des laufenden Workloads ist `8080`.\n\n  ```sh\n  helm get values board -o json | jq -e '.readinessPort==8080'\n\
  \  kubectl get deployment board -o custom-columns=NAME:.metadata.name,HTTP-PORT:.spec.template.spec.containers[0].readinessProbe.httpGet.port\n\
  \  ```"
phrases.0: Ich habe den Helm-Verlauf, den effektiven values und den gerenderten manifests verglichen.
phrases.1: Ich habe den Veröffentlichungsvertrag korrigiert, anstatt ihn live auszublenden drift.
phrases.2: Ich habe readiness unabhängig vom Revisionsstatus Helm überprüft.
questions.0.points.0: Es meldet den Status des Freigabevorgangs.
questions.0.points.1: Readiness und der tatsächliche Datenverkehr erfordern eigene Prüfungen.
questions.0.points.2: Verwenden Sie „wait“ und „inspect events“, wenn ein upgrade stehen bleibt.
questions.0.prompt: Beweist Helm deployed, dass die Anwendung fehlerfrei ist?
questions.1.points.0: Der nächste upgrade rendert erneut values.
questions.1.points.1: Ein Live-patch kann dazu führen, dass die Freigabeabsicht falsch ist.
questions.1.points.2: Vergleichen Sie die gerenderten Ressourcen und das beobachtete Verhalten.
questions.1.prompt: Warum values reparieren, anstatt nur Deployment zu patchen?
