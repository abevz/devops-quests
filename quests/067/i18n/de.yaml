title: Helm-Upgrades
brief: |-
  Der installierte Release ist ungesund; das Arbeitspaket erfüllt seinen bereitgestellten Values-Vertrag nicht. Stelle denselben Release mit ursprünglichen Ressourcen und gepinntem Image wieder her.

  Arbeite auf der Workstation in `~/quest` mit `chart/Chart.yaml`, `chart/values.yaml`, `chart/values.schema.json`, `chart/templates/board.yaml` und `helm-contract.json`.

  **Anforderungen:**
  - Values des Helm-Releases `board`, sein veröffentlichtes Manifest und der Arbeitschart entsprechen demselben vorgegebenen Anwendungsvertrag.
  - Helm-Release `board` hat mindestens 3 Revisionen; der letzte Status ist `deployed`.
  - Erhalte ursprüngliche Deployment-, ConfigMap- und Service-UIDs sowie das bereitgestellte unveränderliche Anwendungsimage.
  - Installierter Release und Arbeitschart erfüllen den Values-Vertrag: Readiness, projizierter Quelldatensatz, Routennachricht, Release-Identität und Service-Routing stimmen überein. Alle deklarierten Renderprofile funktionieren deterministisch.
  - Deployment `board` schließt den Rollout ab; HTTP im Anwendungscontainer an `http://127.0.0.1:8080` liefert `north-67`.
  - Der erhaltene öffentliche Service liefert dieselbe Antwort und den deklarierten Metadatensatz mit ursprünglicher Release-Identität.

  Geschützte Setup-Fakten erfassen ursprüngliche Identitäten. Prüfungen vergleichen aktuelle Values, Chart-Renderings, Release-Manifeste, Live-Objekte und HTTP; sie beweisen weder durchgehende Verfügbarkeit noch jedes mögliche Eingabeprofil.
debrief: Der erhaltene Release übernimmt einen funktionierenden Chart-Vertrag. Quellprojektion und öffentliches
  Routing stimmen mit den Values überein; alternative Renderings prüfen die reparierte Parameterweitergabe.
stages.0.brief: Behalten Sie den ursprünglichen Workload bei, während Helm-Release und HTTP-Endpunkt wiederhergestellt
  werden.
stages.0.objectives.0.text: Der erhaltene Release übernimmt den Values-Vertrag, und der Arbeitschart rendert jedes
  deklarierte Eingabeprofil korrekt.
stages.0.objectives.1.text: Helm-Release `board` hat mindestens 3 Revisionen und zuletzt Status `deployed`.
stages.0.objectives.2.text: Ursprüngliches Deployment, Quell-ConfigMap, öffentlicher Service und gepinntes Image
  bleiben erhalten.
stages.0.objectives.3.text: Live-Workload, Release-Manifest und öffentliches Datenpaket erfüllen denselben funktionierenden
  HTTP-Vertrag.
stages.0.objectives.4.text: Deployment `board` schließt seinen Rollout ab.
stages.0.objectives.5.text: HTTP von Deployment `board` an `http://127.0.0.1:8080` liefert `north-67`.
hints.0.text: Gespeicherte Overrides, Chart-Defaults, gerenderte Absicht und Live-Ressourcen sind unterschiedliche
  Ansichten. Ein deployed-Status beschreibt eine Operation, beweist aber keinen gesunden Consumer.
hints.1.text: Vergleiche `helm get values board`, `helm get values board --all`, `helm get manifest board`, `helm
  history board`, Arbeitspaket/Schema und Pod-Ereignisse. Ermittle mit dem Vertrag, welche Ressourcen- und Eingabebeziehungen
  das Upgrade überstehen müssen.
hints.2.text: Rekonstruiere notwendige Chart-Ressourcen und Eingabeweitergabe, untersuche die Renderprofile und
  aktualisiere denselben Release mit der beabsichtigten Values-Schicht. Prüfe `helm get values board -o json`, `helm
  history board`, `helm template board chart`, Rollout und beide HTTP-Pfade. Erwartet werden aufgezeichnete Readiness
  `8080`, Antwort `north-67`, ursprüngliche Objekt-/Image-Identitäten sowie Metadaten mit aktiver Nachricht und
  erhaltener Release-ID.
phrases.0: Ich habe den Helm-Verlauf, den effektiven values und den gerenderten manifests verglichen.
phrases.1: Ich habe den Veröffentlichungsvertrag korrigiert, anstatt ihn live auszublenden drift.
phrases.2: Ich habe readiness unabhängig vom Revisionsstatus Helm überprüft.
questions.0.points.0: Es meldet den Status des Freigabevorgangs.
questions.0.points.1: Readiness und der tatsächliche Datenverkehr erfordern eigene Prüfungen.
questions.0.points.2: Verwenden Sie „wait“ und „inspect events“, wenn ein upgrade stehen bleibt.
questions.0.prompt: Beweist Helm deployed, dass die Anwendung fehlerfrei ist?
questions.1.points.0: Der nächste upgrade rendert erneut values.
questions.1.points.1: Ein Live-patch kann dazu führen, dass die Freigabeabsicht falsch ist.
questions.1.points.2: Vergleichen Sie die gerenderten Ressourcen und das beobachtete Verhalten.
questions.1.prompt: Warum values reparieren, anstatt nur Deployment zu patchen?
diagnostics.probe_0_3: Live-Workload, Release-Manifest und öffentliches Datenpaket erfüllen denselben funktionierenden
  HTTP-Vertrag.
diagnostics.probe_0_0: Der erhaltene Release übernimmt den Values-Vertrag, und der Arbeitschart rendert jedes deklarierte
  Eingabeprofil korrekt.
diagnostics.probe_0_2: Ursprüngliches Deployment, Quell-ConfigMap, öffentlicher Service und gepinntes Image bleiben
  erhalten.
diagnostics.helm_values_contract: Aktuelle Release-Values und Arbeitschart müssen jedes deklarierte Renderprofil
  deterministisch umsetzen.
diagnostics.helm_image: Erhalte das bereitgestellte unveränderliche Image in Live- und gerenderten Workloads.
diagnostics.helm_projection: Der Workload muss die Quell-ConfigMap des Releases projizieren.
diagnostics.helm_bundle: Gerendertes und Live-Datenpaket müssen konfigurierter Nachricht und ursprünglicher Release-Identität
  entsprechen.
diagnostics.helm_service: Der erhaltene öffentliche Service muss den richtigen Workload auswählen und die deklarierte
  HTTP-Schnittstelle anbieten.
diagnostics.helm_publication: Tatsächliche öffentliche Metadaten müssen ursprünglicher Release-Identität und aktueller
  Nachricht entsprechen.
diagnostics.helm_identity: Erhalte ursprüngliche UIDs von Deployment, Quell-ConfigMap und öffentlichem Service des
  Releases.
