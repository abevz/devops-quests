title: Helm-Upgrades
brief: |
  Das installierte Helm-Release stellt keinen bereiten HTTP-Workload bereit. Behalten Sie die ursprüngliche Deployment-Identität und das vorgegebene festgelegte Image bei.

  Arbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte Eingabedateien: `chart/Chart.yaml`, `chart/values.yaml`, `chart/templates/board.yaml`, `original-deployment-uid`.

  **Anforderungen:**
  - Deployment `board` schließt seinen Rollout ab.
  - Die Korrektur erfolgt über die Werte des Helm-Releases `board`, nicht durch Bearbeiten des Deployments.
  - Das Helm-Release `board` hat mindestens drei Revisionen; der neueste Status ist `deployed`.
  - Das ursprüngliche Deployment `board` bleibt erhalten. Seine UID entspricht der geschützten Referenz auf der Workstation:
    - `/run/dq/facts/0/original-deployment-uid`
  - In Deployment `board` hat Container `worker` eine HTTP-Readiness-Probe auf Port `8080`.
  - Im Container `worker` von Deployment `board` liefert HTTP an `http://127.0.0.1:8080` den Wert `north-67`.

  **Vor Check & finish selbst prüfen:**
  Führen Sie diese Beobachtungsbefehle in `~/quest` auf der Workstation aus.
  - `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://127.0.0.1:8080` — Im Anwendungscontainer lautet die HTTP-Antwort `north-67`.
  - Es gibt mindestens drei Revisionen, die neueste ist `deployed`, und die Release-Werte beschreiben den gesunden Workload.

    ```sh
    helm history board
    helm get values board
    ```
  - Der Rollout ist abgeschlossen, die HTTP-Readiness-Probe nutzt Port `8080` und die Deployment-UID entspricht der geschützten Referenz.

    ```sh
    kubectl rollout status deployment/board --timeout=3s
    kubectl get deployment board -o yaml
    cat /run/dq/facts/0/original-deployment-uid
    ```

  Die Ausgangsnachweise unter `/run/dq/facts/0/` auf der Workstation sind maßgeblich und schreibgeschützt; entsprechende Dateien in `~/quest` sind Arbeitskopien.
debrief: Release-Absicht und Live-Bereitschaft stimmen nun überein, ohne den verwalteten Deployment zu
  ersetzen.
stages.0.brief: |
  Behalten Sie den ursprünglichen Workload bei, während Helm-Release und HTTP-Endpunkt wiederhergestellt werden.
stages.0.objectives.0.text: Die Korrektur erfolgt über die Werte des Helm-Releases `board`, nicht durch
  Bearbeiten des Deployments.
stages.0.objectives.1.text: Helm-Release `board` hat mindestens 3 Revisionen und zuletzt Status `deployed`.
stages.0.objectives.2.text: Das ursprüngliche Deployment `board` bleibt erhalten.
stages.0.objectives.3.text: Der board-Container verwendet Port `8080` für seine HTTP-Readiness-Probe.
stages.0.objectives.4.text: Deployment `board` schließt seinen Rollout ab.
stages.0.objectives.5.text: HTTP von Deployment `board` an `http://127.0.0.1:8080` liefert `north-67`.
hints.0.text: Eine deployed Helm-Revision kann immer noch einen fehlerhaften workload enthalten.
hints.1.text: Vergleichen Sie helm mit values und helm template mit dem Live-readiness probe.
hints.2.text: |
  Das Upgrade änderte readinessPort von 8080 auf 9090, während die Anwendung weiterhin auf 8080 lauscht. Prüfen Sie Release-Verlauf, effektive Werte und gerendertes Chart. Aktualisieren Sie dasselbe Release mit readinessPort=8080 und warten Sie auf Bereitschaft; ersetzen Sie weder das Release noch ändern Sie nur die laufende Probe.
phrases.0: Ich habe den Helm-Verlauf, den effektiven values und den gerenderten manifests verglichen.
phrases.1: Ich habe den Veröffentlichungsvertrag korrigiert, anstatt ihn live auszublenden drift.
phrases.2: Ich habe readiness unabhängig vom Revisionsstatus Helm überprüft.
questions.0.points.0: Es meldet den Status des Freigabevorgangs.
questions.0.points.1: Readiness und der tatsächliche Datenverkehr erfordern eigene Prüfungen.
questions.0.points.2: Verwenden Sie „wait“ und „inspect events“, wenn ein upgrade stehen bleibt.
questions.0.prompt: Beweist Helm deployed, dass die Anwendung fehlerfrei ist?
questions.1.points.0: Der nächste upgrade rendert erneut values.
questions.1.points.1: Ein Live-patch kann dazu führen, dass die Freigabeabsicht falsch ist.
questions.1.points.2: Vergleichen Sie die gerenderten Ressourcen und das beobachtete Verhalten.
questions.1.prompt: Warum values reparieren, anstatt nur Deployment zu patchen?
