title: Helm-Upgrades
brief: |-
  Der installierte Release ist ungesund; das Arbeitspaket erfüllt seinen bereitgestellten Values-Vertrag nicht. Stelle denselben Release mit ursprünglichen Ressourcen und gepinntem Image wieder her.

  Arbeite auf der Workstation in `~/quest` mit `chart/Chart.yaml`, `chart/values.yaml`, `chart/values.schema.json`, `chart/templates/board.yaml` und `helm-contract.json`.

  **Anforderungen:**
  - Values des Helm-Releases `board`, sein veröffentlichtes Manifest und der Arbeitschart entsprechen demselben vorgegebenen Anwendungsvertrag.
  - Helm-Release `board` hat mindestens 3 Revisionen; der letzte Status ist `deployed`.
  - Erhalte ursprüngliche Deployment-, ConfigMap- und Service-UIDs sowie das bereitgestellte unveränderliche Anwendungsimage.
  - Installierter Release und Arbeitschart erfüllen den Values-Vertrag: Readiness, projizierter Quelldatensatz, Routennachricht, Release-Identität und Service-Routing stimmen überein. Alle deklarierten Renderprofile funktionieren deterministisch.
  - Deployment `board` schließt den Rollout ab; HTTP im Anwendungscontainer an `http://127.0.0.1:8080` liefert `north-67`.
  - Der erhaltene öffentliche Service liefert dieselbe Antwort und den deklarierten Metadatensatz mit ursprünglicher Release-Identität.

  Geschützte Setup-Fakten erfassen ursprüngliche Identitäten. Prüfungen vergleichen aktuelle Values, Chart-Renderings, Release-Manifeste, Live-Objekte und HTTP; sie beweisen weder durchgehende Verfügbarkeit noch jedes mögliche Eingabeprofil.
debrief: Der erhaltene Release übernimmt einen funktionierenden Chart-Vertrag. Quellprojektion und öffentliches
  Routing stimmen mit den Values überein; alternative Renderings prüfen die reparierte Parameterweitergabe.
stages.0.brief: Behalten Sie den ursprünglichen Workload bei, während Helm-Release und HTTP-Endpunkt wiederhergestellt
  werden.
stages.0.objectives.0.text: Der erhaltene Release übernimmt den Values-Vertrag, und der Arbeitschart rendert jedes
  deklarierte Eingabeprofil korrekt.
stages.0.objectives.1.text: Helm-Release `board` hat mindestens 3 Revisionen und zuletzt Status `deployed`.
stages.0.objectives.2.text: Ursprüngliches Deployment, Quell-ConfigMap, öffentlicher Service und gepinntes Image
  bleiben erhalten.
stages.0.objectives.3.text: Live-Workload, Release-Manifest und öffentliches Datenpaket erfüllen denselben funktionierenden
  HTTP-Vertrag.
stages.0.objectives.4.text: Deployment `board` schließt seinen Rollout ab.
stages.0.objectives.5.text: HTTP von Deployment `board` an `http://127.0.0.1:8080` liefert `north-67`.
hints.0.text: Gespeicherte Overrides, Chart-Defaults, gerenderte Absicht und Live-Ressourcen sind unterschiedliche
  Ansichten. Ein deployed-Status beschreibt eine Operation, beweist aber keinen gesunden Consumer.
hints.1.text: |-
  Vergleiche `helm get values board`, `helm get values board --all`, `helm get manifest board`, `helm history board`, Arbeitspaket/Schema und Pod-Ereignisse. Ermittle mit dem Vertrag, welche Ressourcen- und Eingabebeziehungen das Upgrade überstehen müssen.

  Suche in helm-contract.json nach den Renderprofilen und der geforderten Beziehung zwischen Eingabewerten, der eingebundenen Quelle und dem Service. Verfolge die Werte im Chart von values.yaml und values.schema.json bis zu den Ressourcenvorlagen.
hints.2.text: |-
  Prüfe `helm get values board -o json`, `helm history board`, `helm template board chart`, Rollout und beide HTTP-Pfade. Erwartet werden aufgezeichnete Readiness `8080`, Antwort `north-67`, ursprüngliche Objekt-/Image-Identitäten sowie Metadaten mit aktiver Nachricht und erhaltener Release-ID.
phrases.0: Ich habe den Helm-Verlauf, den effektiven values und den gerenderten manifests verglichen.
phrases.1: Ich habe den Veröffentlichungsvertrag korrigiert, anstatt ihn live auszublenden drift.
phrases.2: Ich habe readiness unabhängig vom Revisionsstatus Helm überprüft.
questions.0.points.0: Es meldet den Status des Freigabevorgangs.
questions.0.points.1: Readiness und der tatsächliche Datenverkehr erfordern eigene Prüfungen.
questions.0.points.2: Verwenden Sie „wait“ und „inspect events“, wenn ein upgrade stehen bleibt.
questions.0.prompt: Beweist Helm deployed, dass die Anwendung fehlerfrei ist?
questions.1.points.0: Der nächste upgrade rendert erneut values.
questions.1.points.1: Ein Live-patch kann dazu führen, dass die Freigabeabsicht falsch ist.
questions.1.points.2: Vergleichen Sie die gerenderten Ressourcen und das beobachtete Verhalten.
questions.1.prompt: Warum values reparieren, anstatt nur Deployment zu patchen?
diagnostics.probe_0_0: Der gespeicherte readinessPort ist nicht 8080 oder die Prüfung endete ohne benannten Marker; der gelieferte übernommene Override 9090, fehlende ConfigMap-/Service-Vorlagen, ungültiges YAML/JSON oder nicht verfügbare Helm-Eingaben können die Ursache sein. [Ursache und Prüfung](guides#guide=helm-8&section=upgrade-stored-values-and-chart-inputs)
diagnostics.helm_values_contract: Die effektiven Release-Werte oder ein Renderprofil erfüllten den Vertrag nicht oder der Helm-Befehl schlug fehl; feste Readiness-/Nachrichtenwerte, geänderte Release-ID/Image, falscher Namespace oder nicht deterministische Vorlagen verhindern wiederverwendbares Rendern. [Ursache und Prüfung](guides#guide=helm-8&section=upgrade-reusable-deterministic-values)
diagnostics.helm_image: Ein geprüftes Live- oder gerendertes worker Image weicht von gelieferter Referenz oder Digest ab; ein geänderter Image-Wert oder eine andere Vorlage statt Chart-Korrektur kann die geschützte Anwendung ersetzen. [Ursache und Prüfung](guides#guide=helm-8&section=upgrade-original-immutable-image)
diagnostics.helm_projection: Der worker bindet kein Volume mit Verweis auf die Release-ConfigMap ein; fehlendes Volume, abweichender Mount-Name oder eine andere Quelle kann das Chart-Bundle von der Workload trennen. [Ursache und Prüfung](guides#guide=helm-8&section=upgrade-projected-source-configmap)
diagnostics.helm_bundle: Das Quell-Bundle entspricht nicht konfigurierter Nachricht und ursprünglicher Release-ID oder die Manifest-/API-Abfrage schlug fehl; festes north-67, alte ConfigMap-Daten oder ersetzte release.json kann Standard- oder canary Profil verletzen. [Ursache und Prüfung](guides#guide=helm-8&section=upgrade-parameterized-source-bundle)
diagnostics.helm_service: Service-Typ, Selektor oder deklarierter TCP-Port entsprechen nicht dem Workload-Vertrag; fehlende/veraltete Service-Vorlage, geänderte Labels oder falscher öffentlicher Port verhindert die Auswahl des beabsichtigten Releases. [Ursache und Prüfung](guides#guide=helm-8&section=upgrade-public-service-selection)
diagnostics.helm_identity: Ein ursprüngliches Release-Objekt änderte seine UID; uninstall, Löschen und Neuerstellen von Deployment, ConfigMap oder Service kann Namen erhalten und die beim Setup erfassten Identitäten ersetzen. [Ursache und Prüfung](guides#guide=helm-8&section=upgrade-original-release-object-uids)
diagnostics.probe_0_2: Die ursprüngliche Deployment-UID wurde nicht erhalten oder die Identitäts-/Image-Prüfung endete vorzeitig; neu erstelltes board, fehlende geschützte UID-Belege, Live-Objekte oder API-/JSON-Fehler können die Ursache sein. [Ursache und Prüfung](guides#guide=helm-8&section=upgrade-deployment-identity-observation)
diagnostics.probe_0_3: Live- und veröffentlichte Readiness bestätigten den HTTP-Vertrag nicht oder die Bundle-Beobachtung endete ohne benannten Marker; eine alte 9090 Probe, ungültiger Handler/Host/Scheme, fehlende Release-Objekte oder fehlerhafte Bundle-Eingaben können die Ursache sein. [Ursache und Prüfung](guides#guide=helm-8&section=upgrade-live-and-released-readiness)
diagnostics.helm_publication: Die öffentlichen Release-Metadaten entsprechen nicht ursprünglicher Release-ID und aktueller Route oder Anfrage/JSON-Lesen schlug fehl; alte projizierte Daten, falsches Service-Routing oder unerreichbarer worker verhindern die Übernahme. [Ursache und Prüfung](guides#guide=helm-8&section=upgrade-public-release-metadata)
diagnostics.helm_history: Die Helm-Historie zeigt nicht mindestens drei Revisionen mit letzter deployed oder die Abfrage schlug fehl; ausschließlich korrigierte Live-Objekte, ein unvollständiges Upgrade oder eine fehlgeschlagene letzte Revision können die Historienbedingung offenlassen. [Ursache und Prüfung](guides#guide=helm-8&section=upgrade-deployed-third-revision)
diagnostics.helm_rollout: Das Deployment board schloss den Rollout nicht innerhalb von 3 Sekunden ab; übernommene Readiness-Overrides, fehlende Quell-ConfigMap, unerreichbare Pods oder API-Beobachtungsfehler können Bereitschaft verhindern. [Ursache und Prüfung](guides#guide=helm-8&section=upgrade-workload-rollout-readiness)
diagnostics.helm_http: Der worker lieferte nicht north-67 unter localhost:8080 oder exec/HTTP schlug fehl; nicht bereite Pods, fehlende projizierte Bundle-Daten oder alte Inhalte können die Antwort auch nach einer deployed Helm-Revision falsch belassen. [Ursache und Prüfung](guides#guide=helm-8&section=upgrade-local-worker-response)
