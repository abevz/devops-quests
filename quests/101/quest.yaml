stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    check: "set -euo pipefail\ncd ~/quest\nfailed=0\nboard=$(kubectl get deployment board -o json 2>/dev/null || true)\npods=$(kubectl get pods -l app=board -o json 2>/dev/null || true)\ncheck() { local label=$1 expression=$2 document=$3; if ! jq -e \"$expression\" <<<\"$document\" >/dev/null 2>&1; then printf '%s\\n' \"$label: ✗\"; failed=1; fi; }\ncheck 'watcher startup command = test -s /shared/heartbeat' '.spec.template.spec.initContainers[1].startupProbe.exec.command==[\"test\",\"-s\",\"/shared/heartbeat\"]' \"$board\"\ncheck 'watcher startup periodSeconds = 1' '.spec.template.spec.initContainers[1].startupProbe.periodSeconds==1' \"$board\"\ncheck 'watcher startup failureThreshold = 10' '.spec.template.spec.initContainers[1].startupProbe.failureThreshold==10' \"$board\"\ncheck 'prepare command = sh -c cp /input/route /shared/route' '.spec.template.spec.initContainers[0].command==[\"sh\",\"-c\",\"cp /input/route /shared/route\"]' \"$board\"\ncheck 'watcher restartPolicy = Always' '.spec.template.spec.initContainers[1].restartPolicy==\"Always\"' \"$board\"\ncheck 'board volumes = supplied input and shared volumes' '.spec.template.spec.volumes==[{name:\"input\",configMap:{name:\"route\",defaultMode:420}},{name:\"shared\",emptyDir:{}}]' \"$board\"\ncheck 'a nonterminating board Pod has successful prepare' 'any(.items[]?;.metadata.deletionTimestamp==null and any(.status.initContainerStatuses[]?;.name==\"prepare\" and .state.terminated.exitCode==0))' \"$pods\"\ncheck 'a nonterminating board Pod has started running watcher' 'any(.items[]?;.metadata.deletionTimestamp==null and any(.status.initContainerStatuses[]?;.name==\"watcher\" and .started==true and .state.running!=null))' \"$pods\"\ncheck 'a nonterminating board Pod has a ready regular container' 'any(.items[]?;.metadata.deletionTimestamp==null and any(.status.containerStatuses[]?;.ready==true))' \"$pods\"\ncheck 'one nonterminating board Pod has all three conditions' 'any(.items[]?;.metadata.deletionTimestamp==null and any(.status.initContainerStatuses[]?;.name==\"prepare\" and .state.terminated.exitCode==0) and any(.status.initContainerStatuses[]?;.name==\"watcher\" and .started==true and .state.running!=null) and any(.status.containerStatuses[]?;.ready==true))' \"$pods\"\nif ! test \"$(timeout 4s kubectl exec --pod-running-timeout=2s deployment/board -- wget -qO- -T 3 http://board:8080/route 2>/dev/null)\" = north-101; then printf '%s\\n' 'board:8080/route = north-101: ✗'; failed=1; fi\nif ! timeout 4s kubectl exec --pod-running-timeout=2s deployment/board -c watcher -- test -s /shared/heartbeat >/dev/null 2>&1; then printf '%s\\n' 'watcher /shared/heartbeat is nonempty: ✗'; failed=1; fi\nexit \"$failed\"\n"
