id: 101
title: title
track: Kubernetes
difficulty: medium
brief: brief
stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    check: |-
      dq_probe_output=$(mktemp)
      trap 'rm -f "$dq_probe_output"' EXIT
      set +e
      (
      set -euo pipefail
      pods=$(kubectl get pods -l app=board -o json 2>/dev/null || true)
      route=$(kubectl get configmap route -o json 2>/dev/null || true)
      python3 -I - /dev/fd/3 /dev/fd/4 3<<<"$pods" 4<<<"$route" <<'DQ_PREPARED'
      import sys

      def _dq_read_argument(value):
          if not value.startswith('/dev/fd/'):
              return value
          with open(value, encoding='utf-8', newline='') as source:
              return source.read().removesuffix('\n')

      sys.argv = [_dq_read_argument(value) for value in sys.argv]

      import json,subprocess,sys
      try:
          pods=json.loads(sys.argv[1])['items'];route=json.loads(sys.argv[2])['data']['route'].encode()
          candidates=[p for p in pods if not p['metadata'].get('deletionTimestamp') and any(c.get('name')=='prepare' and c.get('state',{}).get('terminated',{}).get('exitCode')==0 for c in p.get('status',{}).get('initContainerStatuses',[]))]
          ok=False
          for pod in candidates:
              result=subprocess.run(['kubectl','exec',pod['metadata']['name'],'-c','worker','--','cat','/shared/route'],capture_output=True,timeout=4)
              if result.returncode==0 and result.stdout==route:ok=True;break
      except (ValueError,KeyError,TypeError,AttributeError,OSError,subprocess.TimeoutExpired):ok=False
      if not ok:print('prepare makes the supplied route available at /shared/route: ✗ [DQ:prepare]')
      sys.exit(not ok)
      DQ_PREPARED
      ) >"$dq_probe_output" 2>/dev/null
      dq_probe_status=$?
      set -e
      cat "$dq_probe_output"
      if [ "$dq_probe_status" -ne 0 ] && ! grep -Eq '\[DQ:[a-z0-9_]+\]' "$dq_probe_output"; then
      printf '%s\n' 'Current inputs could not verify this objective: ✗ [DQ:probe_0_0]'
      fi
      rm -f "$dq_probe_output"
      trap - EXIT
      test "$dq_probe_status" -eq 0
  - text: stages.0.objectives.1.text
    keep: true
    check: |-
      dq_probe_output=$(mktemp)
      trap 'rm -f "$dq_probe_output"' EXIT
      set +e
      (
      set -euo pipefail
      board=$(kubectl get deployment board -o json 2>/dev/null || true)
      python3 -I - /dev/fd/3 3<<<"$board" <<'DQ_HEARTBEAT'
      import sys

      def _dq_read_argument(value):
          if not value.startswith('/dev/fd/'):
              return value
          with open(value, encoding='utf-8', newline='') as source:
              return source.read().removesuffix('\n')

      sys.argv = [_dq_read_argument(value) for value in sys.argv]

      import json,shlex,sys
      try:
          containers=json.loads(sys.argv[1])['spec']['template']['spec']['initContainers']
          matches=[c for c in containers if c.get('name')=='watcher']
          watcher=matches[0] if len(matches)==1 else {}
      except (ValueError,KeyError,TypeError,AttributeError):watcher={}
      probe=watcher.get('startupProbe',{})
      command=probe.get('exec',{}).get('command',[])
      try:
          if len(command)==3 and command[0] in ('sh','/bin/sh') and command[1]=='-c':command=shlex.split(command[2].strip().removesuffix(';'))
          if command and command[0]=='exec':command=command[1:]
          if command and command[0] in ('busybox','/bin/busybox'):command=command[1:]
          heartbeat=command in (['test','-s','/shared/heartbeat'],['/bin/test','-s','/shared/heartbeat'],['[','-s','/shared/heartbeat',']'])
      except (ValueError,TypeError,AttributeError):heartbeat=False
      checks=[('startup_command',heartbeat),('period',probe.get('periodSeconds')==1),('threshold',probe.get('failureThreshold')==10),('restart',watcher.get('restartPolicy')=='Always')]
      failed=False
      for marker,ok in checks:
          if not ok:failed=True;print('watcher '+marker+': ✗ [DQ:'+marker+']')
      sys.exit(failed)
      DQ_HEARTBEAT
      ) >"$dq_probe_output" 2>/dev/null
      dq_probe_status=$?
      set -e
      cat "$dq_probe_output"
      if [ "$dq_probe_status" -ne 0 ] && ! grep -Eq '\[DQ:[a-z0-9_]+\]' "$dq_probe_output"; then
      printf '%s\n' 'Current inputs could not verify this objective: ✗ [DQ:probe_0_1]'
      fi
      rm -f "$dq_probe_output"
      trap - EXIT
      test "$dq_probe_status" -eq 0
  - text: stages.0.objectives.2.text
    keep: true
    check: |-
      set -euo pipefail
      cd ~/quest
      failed=0
      board=$(kubectl get deployment board -o json 2>/dev/null || true)
      check() { local label=$1 expression=$2 document=$3; if ! jq -e "$expression" <<<"$document" >/dev/null 2>&1; then printf '%s\n' "$label: ✗"; failed=1; fi; }
      check 'board volumes = supplied input and shared volumes [DQ:volumes]' '.spec.template.spec.volumes as $volumes | ($volumes|length)==2 and ($volumes[0]|keys)==["configMap","name"] and $volumes[0].name=="input" and $volumes[0].configMap.name=="route" and ($volumes[0].configMap.defaultMode//420)==420 and ($volumes[0].configMap.optional==null or $volumes[0].configMap.optional==false) and ($volumes[0].configMap.items==null) and ($volumes[0].configMap|keys-["name","defaultMode","optional","items"]|length)==0 and ($volumes[1]|keys)==["emptyDir","name"] and $volumes[1].name=="shared" and ($volumes[1].emptyDir|keys-["medium"]|length)==0 and ($volumes[1].emptyDir.medium//"")==""' "$board"
      exit "$failed"
  - text: stages.0.objectives.3.text
    check: |-
      set -euo pipefail
      cd ~/quest
      failed=0
      pods=$(kubectl get pods -l app=board -o json 2>/dev/null || true)
      check() { local label=$1 expression=$2 document=$3; if ! jq -e "$expression" <<<"$document" >/dev/null 2>&1; then printf '%s\n' "$label: ✗"; failed=1; fi; }
      check 'a nonterminating board Pod has successful prepare [DQ:prepare_status]' 'any(.items[]?;.metadata.deletionTimestamp==null and any(.status.initContainerStatuses[]?;.name=="prepare" and .state.terminated.exitCode==0))' "$pods"
      check 'a nonterminating board Pod has started running watcher [DQ:watcher_status]' 'any(.items[]?;.metadata.deletionTimestamp==null and any(.status.initContainerStatuses[]?;.name=="watcher" and .started==true and .state.running!=null))' "$pods"
      check 'a nonterminating board Pod has a ready regular container [DQ:ready]' 'any(.items[]?;.metadata.deletionTimestamp==null and any(.status.containerStatuses[]?;.name=="worker" and .ready==true))' "$pods"
      check 'one nonterminating board Pod has all three conditions [DQ:same]' 'any(.items[]?;.metadata.deletionTimestamp==null and any(.status.initContainerStatuses[]?;.name=="prepare" and .state.terminated.exitCode==0) and any(.status.initContainerStatuses[]?;.name=="watcher" and .started==true and .state.running!=null) and any(.status.containerStatuses[]?;.name=="worker" and .ready==true))' "$pods"
      exit "$failed"
  - text: stages.0.objectives.4.text
    check: 'set -euo pipefail

      cd ~/quest

      failed=0

      if ! timeout 4s kubectl exec --pod-running-timeout=2s deployment/board -c watcher -- test -s /shared/heartbeat
      >/dev/null 2>&1; then printf ''%s\n'' ''watcher /shared/heartbeat is nonempty: ✗ [DQ:heartbeat]''; failed=1;
      fi

      exit "$failed"

      '
  - text: stages.0.objectives.5.text
    check: |-
      set -euo pipefail
      cd ~/quest
      failed=0
      if ! test "$(timeout 4s kubectl exec --pod-running-timeout=2s deployment/board -c worker -- wget -qO- -T 3 http://board:8080/route 2>/dev/null)" = north-101; then printf '%s\n' 'board:8080/route = north-101: ✗ [DQ:http]'; failed=1; fi
      exit "$failed"
