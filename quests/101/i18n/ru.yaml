title: Init-контейнеры и native sidecars
brief: "Запуск приложения не завершается. Предоставленные инициализация, нативный sidecar и приложение должны работать\
  \ совместно.\n\nРаботайте в `~/quest` на workstation. Предоставленные файлы: `route.yaml`, `board.yaml`, `service.yaml`.\n\
  \n**Требования:**\n- Init-контейнер `prepare` делает маршрут из предоставленного ConfigMap доступным в `/shared/route`\
  \ внутри Pod.\n- Нативный sidecar `watcher` использует политику перезапуска `Always` и проверку запуска с непустым\
  \ `/shared/heartbeat` внутри контейнера, каждые `1` секунду с порогом неудач `10`.\n- Deployment `board` сохраняет\
  \ только исходные тома в указанном порядке: `input` из ConfigMap `route`, режим `0644`, затем общий том emptyDir\
  \ `shared`.\n- Один Pod с меткой `app=board`, не завершающийся, имеет `prepare`, завершённый с кодом `0`, запущенный\
  \ и работающий `watcher` и готовый обычный контейнер.\n- Внутри контейнера `watcher`, выбранного из Deployment\
  \ `board`, `/shared/heartbeat` существует и непуст.\n- Из `deployment/board` HTTP `http://board:8080/route` возвращает\
  \ `north-101`.\n\n**Проверьте самостоятельно перед Check & finish:**\nВыполняйте эти команды наблюдения из `~/quest`\
  \ на workstation; `kubectl exec` наблюдает контейнер указанной нагрузки.\n- Настройки, идентичность и статус соответствуют\
  \ требованиям.\n\n  ```sh\n  kubectl get deployment board -o yaml\n  kubectl get pods -l app=board -o json\n \
  \ ```\n- `kubectl exec deployment/board -c watcher -- wc -c /shared/heartbeat` — Файл heartbeat внутри `watcher`\
  \ имеет положительное число байтов.\n- `kubectl exec deployment/board -- wget -qO- -T 3 http://board:8080/route`\
  \ — Потребитель получает `north-101`.\n\nПроверка наблюдает текущие настройки, а не историю изменения одного поля;\
  \ не доказано, что Pod heartbeat, выбранный из Deployment, совпадает с Pod проверки статуса.\n"
debrief: Проверки наблюдали настройки init, состояния Pod, heartbeat и HTTP-ответ.
stages.0.brief: 'Инициализация и нативный sidecar должны обеспечивать готовность приложения и требуемый маршрут.

  '
hints.0.text: 'Сбой обычного init блокирует следующую инициализацию и запуск приложения. Его исходный путь указывает
  несуществующий входной файл.

  '
hints.1.text: Native sidecars — перезапускаемые init containers; обычные init должны завершиться.
hints.2.text: 'Исправьте исходный путь, не перенося watcher в список обычных контейнеров. Команда prepare — sh -c
  с cp /input/route /shared/route. Команда запуска watcher — test -s /shared/heartbeat, с periodSeconds 1 и failureThreshold
  10. Сохраните prepare первым, а watcher вторым в списке init-контейнеров.

  '
phrases.0: Я диагностировал запуск по статусу init container.
phrases.1: Я разделил разовую подготовку и native sidecar.
phrases.2: Я проверил HTTP-ответ board.
questions.0.points.0: Обычный init должен завершиться; native sidecar — init container с restartPolicy Always.
questions.0.points.1: Startup probe sidecar может задерживать следующий шаг, а сам sidecar продолжает работать.
questions.0.prompt: Чем обычный init отличается от native sidecar?
questions.1.points.0: 'Нет: он привязан к жизни данного Pod.'
questions.1.points.1: Он может пережить перезапуск контейнера в том же Pod.
questions.1.prompt: Переживёт ли этот emptyDir замену Pod?
diagnostics.startup_command: watcher startupProbe.exec.command должен совпадать с test -s /shared/heartbeat.
diagnostics.period: watcher startupProbe.periodSeconds должен совпадать с 1.
diagnostics.threshold: watcher startupProbe.failureThreshold должен совпадать с 10.
diagnostics.prepare: prepare command должен совпадать с sh -c cp /input/route /shared/route.
diagnostics.restart: watcher restartPolicy должен совпадать с Always.
diagnostics.volumes: Тома board должны точно совпадать с выданными томами input и shared.
diagnostics.prepare_status: У Pod board, не находящегося в процессе удаления, контейнер prepare должен успешно завершиться.
diagnostics.watcher_status: У Pod board, не находящегося в процессе удаления, watcher должен быть запущен и работать.
diagnostics.ready: У Pod board, не находящегося в процессе удаления, должен быть готовый обычный контейнер.
diagnostics.same: Один Pod board, не находящийся в процессе удаления, должен выполнять все три условия контейнеров.
diagnostics.http: board:8080/route должен совпадать с north-101.
diagnostics.heartbeat: Файл watcher /shared/heartbeat должен существовать и быть непустым.
stages.0.objectives.0.text: Init-контейнер `prepare` делает маршрут из предоставленного ConfigMap доступным в `/shared/route`
  внутри Pod.
stages.0.objectives.1.text: Нативный sidecar `watcher` использует политику перезапуска `Always` и проверку запуска
  с непустым `/shared/heartbeat` внутри контейнера, каждые `1` секунду с порогом неудач `10`.
stages.0.objectives.2.text: 'Deployment `board` сохраняет только исходные тома в указанном порядке: `input` из ConfigMap
  `route`, режим `0644`, затем общий том emptyDir `shared`.'
stages.0.objectives.3.text: Один Pod с меткой `app=board`, не завершающийся, имеет `prepare`, завершённый с кодом
  `0`, запущенный и работающий `watcher` и готовый обычный контейнер.
stages.0.objectives.4.text: Внутри контейнера `watcher`, выбранного из Deployment `board`, `/shared/heartbeat` существует
  и непуст.
stages.0.objectives.5.text: Из `deployment/board` HTTP `http://board:8080/route` возвращает `north-101`.
