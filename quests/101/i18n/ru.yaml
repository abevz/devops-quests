stages.0.objectives.2.text: Deployment `board` сохраняет только поставленные входное и общее хранилища, их
  исходный порядок и настройки доступа.
stages.0.objectives.3.text: 'Текущий Pod приложения не завершается: инициализация успешно окончена, native
  sidecar запущен и работает, контейнер приложения готов.'
stages.0.objectives.4.text: Внутри контейнера `watcher`, выбранного из Deployment `board`, `/shared/heartbeat`
  существует и непуст.
stages.0.objectives.5.text: Из `deployment/board` HTTP `http://board:8080/route` возвращает `north-101`.
