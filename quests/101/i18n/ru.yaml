title: Init-контейнеры и native sidecars
brief: 'Работайте в `~/quest` с `route.json`, `board.json` и `service.json`. Обычный init-контейнер читает несуществующий
  вход и блокирует запуск. Исправьте `prepare` и сохраните нативный sidecar. Используйте только офлайн-песочницу.


  Изучите `board.json`: в нём указаны точные команды init по порядку, startup probe watcher и порядок томов; сохраните входной
  том ConfigMap, общий emptyDir, стандартный режим `0644` (`defaultMode: 420` в JSON) и отсутствие дополнительных томов. В
  одном Pod, не отмеченном на удаление, с меткой `app=board` `prepare` должен завершиться с 0, `watcher` должен быть запущен
  и работать, а обычный контейнер должен быть готов. Файл watcher `/shared/heartbeat` должен быть непустым, а `board:8080/route`
  должен возвращать `north-101`. Дождитесь rollout и изучите состояние Pod; проверки наблюдают текущие настройки, но не доказывают,
  что изменено только одно поле.


  Установите команду первого init-контейнера ровно в `["sh", "-c", "cp /input/route /shared/route"]`. Команда startup probe
  второго init-контейнера должна быть `["test", "-s", "/shared/heartbeat"]` с `periodSeconds: 1` и `failureThreshold: 10`.


  Проверка heartbeat использует Pod, выбранный `kubectl exec deployment/board`; она не устанавливает, что это тот же Pod,
  который прошёл проверку состояния.'
debrief: Проверки наблюдали настройки init, состояния Pod, heartbeat и HTTP-ответ.
stages.0.brief: Настройки init, состояния Pod, heartbeat watcher и HTTP-ответ board соответствуют описанию.
stages.0.objectives.0.text: Настройки init, состояния Pod, heartbeat watcher и HTTP-ответ board соответствуют описанию.
hints.0.text: Ошибка обычного init блокирует дальнейшую подготовку и запуск приложения.
hints.1.text: Native sidecars — перезапускаемые init containers; обычные init должны завершиться.
hints.2.text: Исправьте путь источника, не перенося watcher в список обычных containers.
phrases.0: Я диагностировал запуск по статусу init container.
phrases.1: Я разделил разовую подготовку и native sidecar.
phrases.2: Я проверил HTTP-ответ board.
questions.0.points.0: Обычный init должен завершиться; native sidecar — init container с restartPolicy Always.
questions.0.points.1: Startup probe sidecar может задерживать следующий шаг, а сам sidecar продолжает работать.
questions.0.prompt: Чем обычный init отличается от native sidecar?
questions.1.points.0: 'Нет: он привязан к жизни данного Pod.'
questions.1.points.1: Он может пережить перезапуск контейнера в том же Pod.
questions.1.prompt: Переживёт ли этот emptyDir замену Pod?
diagnostics.startup_command: watcher startupProbe.exec.command должен совпадать с test -s /shared/heartbeat.
diagnostics.period: watcher startupProbe.periodSeconds должен совпадать с 1.
diagnostics.threshold: watcher startupProbe.failureThreshold должен совпадать с 10.
diagnostics.prepare: prepare command должен совпадать с sh -c cp /input/route /shared/route.
diagnostics.restart: watcher restartPolicy должен совпадать с Always.
diagnostics.volumes: Тома board должны точно совпадать с выданными томами input и shared.
diagnostics.prepare_status: У Pod board, не находящегося в процессе удаления, контейнер prepare должен успешно завершиться.
diagnostics.watcher_status: У Pod board, не находящегося в процессе удаления, watcher должен быть запущен и работать.
diagnostics.ready: У Pod board, не находящегося в процессе удаления, должен быть готовый обычный контейнер.
diagnostics.same: Один Pod board, не находящийся в процессе удаления, должен выполнять все три условия контейнеров.
diagnostics.http: board:8080/route должен совпадать с north-101.
diagnostics.heartbeat: Файл watcher /shared/heartbeat должен существовать и быть непустым.
