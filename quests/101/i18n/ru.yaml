title: Init-контейнеры и native sidecars
brief: 'Запуск приложения не завершается. Предоставленные инициализация, нативный sidecar и приложение должны
  работать совместно.


  Работайте в `~/quest` на workstation. Предоставленные файлы: `route.yaml`, `board.yaml`, `service.yaml`.


  **Требования:**

  - Инициализация делает поставленный маршрут доступным приложению внутри Pod по пути `/shared/route`.

  - Существующий native sidecar остаётся перезапускаемым и успешно запускается с поставленной стартовой проверкой
  heartbeat.

  - Deployment `board` сохраняет только поставленные входное и общее хранилища, их исходный порядок и настройки
  доступа.

  - Текущий Pod приложения не завершается: инициализация успешно окончена, native sidecar запущен и работает,
  контейнер приложения готов.

  - Внутри контейнера `watcher`, выбранного из Deployment `board`, `/shared/heartbeat` существует и непуст.

  - Из `deployment/board` HTTP `http://board:8080/route` возвращает `north-101`.


  Проверка наблюдает текущие настройки, а не историю изменения одного поля; не доказано, что Pod heartbeat,
  выбранный из Deployment, совпадает с Pod проверки статуса.

  '
debrief: Проверки наблюдали настройки init, состояния Pod, heartbeat и HTTP-ответ.
stages.0.brief: Инициализация и нативный sidecar должны обеспечивать готовность приложения и требуемый маршрут.
hints.0.text: Готовность приложения зависит от успешной инициализации и вспомогательных контейнеров.
hints.1.text: 'Сбой обычного init блокирует следующую инициализацию и запуск приложения. Его исходный путь
  указывает несуществующий входной файл.


  Native sidecars — перезапускаемые init containers; обычные init должны завершиться.


  Изучите поставленные определения, текущие ресурсы и события.


  ```sh

  cat board.yaml

  kubectl get deployment board -o yaml

  kubectl get pods -l app=board -o yaml

  kubectl describe pods -l app=board

  ```'
hints.2.text: 'Исправьте исходный путь, не перенося watcher в список обычных контейнеров. Команда prepare — sh -c с cp /input/route /shared/route. Команда запуска watcher — test -s /shared/heartbeat, с periodSeconds 1 и failureThreshold 10. Сохраните prepare первым, а watcher вторым в списке init-контейнеров.


  Проверьте наблюдаемый результат:


  ```sh

  kubectl get pods -l app=board

  kubectl exec deployment/board -c watcher -- wc -c /shared/heartbeat

  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080/route

  ```


  Ожидаются успешная инициализация, запущенный и работающий native sidecar, готовый контейнер приложения, положительный размер heartbeat и HTTP-ответ north-101.


  Поставленные ограничения и подробности: Init-контейнер `prepare` делает маршрут из предоставленного ConfigMap доступным в `/shared/route` внутри Pod. Нативный sidecar `watcher` использует политику перезапуска `Always` и проверку запуска с непустым `/shared/heartbeat` внутри контейнера, каждые `1` секунду с порогом неудач `10`. Deployment `board` сохраняет только исходные тома в указанном порядке: `input` из ConfigMap `route`, режим `0644`, затем общий том emptyDir `shared`. Один Pod с меткой `app=board`, не завершающийся, имеет `prepare`, завершённый с кодом `0`, запущенный и работающий `watcher` и готовый обычный контейнер.'
phrases.0: Я диагностировал запуск по статусу init container.
phrases.1: Я разделил разовую подготовку и native sidecar.
phrases.2: Я проверил HTTP-ответ board.
questions.0.points.0: Обычный init должен завершиться; native sidecar — init container с restartPolicy Always.
questions.0.points.1: Startup probe sidecar может задерживать следующий шаг, а сам sidecar продолжает работать.
questions.0.prompt: Чем обычный init отличается от native sidecar?
questions.1.points.0: 'Нет: он привязан к жизни данного Pod.'
questions.1.points.1: Он может пережить перезапуск контейнера в том же Pod.
questions.1.prompt: Переживёт ли этот emptyDir замену Pod?
diagnostics.startup_command: Проверка запуска watcher должна проверять, что /shared/heartbeat не пуст.
diagnostics.period: watcher startupProbe.periodSeconds должен совпадать с 1.
diagnostics.threshold: watcher startupProbe.failureThreshold должен совпадать с 10.
diagnostics.prepare: Инициализация должна сделать исходный маршрут доступным в worker по пути /shared/route.
diagnostics.restart: watcher restartPolicy должен совпадать с Always.
diagnostics.volumes: Тома board должны точно совпадать с выданными томами input и shared.
diagnostics.prepare_status: У Pod board, не находящегося в процессе удаления, контейнер prepare должен успешно
  завершиться.
diagnostics.watcher_status: У Pod board, не находящегося в процессе удаления, watcher должен быть запущен и
  работать.
diagnostics.ready: У Pod board, не находящегося в процессе удаления, должен быть готовый обычный контейнер.
diagnostics.same: Один Pod board, не находящийся в процессе удаления, должен выполнять все три условия контейнеров.
diagnostics.http: board:8080/route должен совпадать с north-101.
diagnostics.heartbeat: Файл watcher /shared/heartbeat должен существовать и быть непустым.
