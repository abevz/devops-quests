title: Init-контейнеры и native sidecars
brief: 'Запуск приложения не завершается. Предоставленные инициализация, нативный sidecar и приложение должны
  работать совместно.


  Работайте в `~/quest` на workstation. Предоставленные файлы: `route.yaml`, `board.yaml`, `service.yaml`.


  **Требования:**

  - Инициализация делает поставленный маршрут доступным приложению внутри Pod по пути `/shared/route`.

  - Существующий native sidecar остаётся перезапускаемым и успешно запускается с поставленной стартовой проверкой
  heartbeat.

  - Deployment `board` сохраняет только поставленные входное и общее хранилища, их исходный порядок и настройки
  доступа.

  - Текущий Pod приложения не завершается: инициализация успешно окончена, native sidecar запущен и работает,
  контейнер приложения готов.

  - Внутри контейнера `watcher`, выбранного из Deployment `board`, `/shared/heartbeat` существует и непуст.

  - Из `deployment/board` HTTP `http://board:8080/route` возвращает `north-101`.


  Проверка наблюдает текущие настройки, а не историю изменения одного поля; не доказано, что Pod heartbeat,
  выбранный из Deployment, совпадает с Pod проверки статуса.

  '
debrief: Проверки наблюдали настройки init, состояния Pod, heartbeat и HTTP-ответ.
stages.0.brief: Инициализация и нативный sidecar должны обеспечивать готовность приложения и требуемый маршрут.
hints.0.text: Готовность приложения зависит от успешной инициализации и вспомогательных контейнеров.
hints.1.text: 'Сбой обычного init блокирует следующую инициализацию и запуск приложения. Его исходный путь
  указывает несуществующий входной файл.


  Native sidecars — перезапускаемые init containers; обычные init должны завершиться.


  Изучите поставленные определения, текущие ресурсы и события.


  ```sh

  cat board.yaml

  kubectl get deployment board -o yaml

  kubectl get pods -l app=board -o yaml

  kubectl describe pods -l app=board

  ```'
hints.2.text: 'Исправьте исходный путь, не перенося watcher в список обычных контейнеров. Команда prepare — sh -c с cp /input/route /shared/route. Команда запуска watcher — test -s /shared/heartbeat, с periodSeconds 1 и failureThreshold 10. Сохраните prepare первым, а watcher вторым в списке init-контейнеров.


  Проверьте наблюдаемый результат:


  ```sh

  kubectl get pods -l app=board

  kubectl exec deployment/board -c watcher -- wc -c /shared/heartbeat

  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080/route

  ```


  Ожидаются успешная инициализация, запущенный и работающий native sidecar, готовый контейнер приложения, положительный размер heartbeat и HTTP-ответ north-101.


  Поставленные ограничения и подробности: Init-контейнер `prepare` делает маршрут из предоставленного ConfigMap доступным в `/shared/route` внутри Pod. Нативный sidecar `watcher` использует политику перезапуска `Always` и проверку запуска с непустым `/shared/heartbeat` внутри контейнера, каждые `1` секунду с порогом неудач `10`. Deployment `board` сохраняет только исходные тома в указанном порядке: `input` из ConfigMap `route`, режим `0644`, затем общий том emptyDir `shared`. Один Pod с меткой `app=board`, не завершающийся, имеет `prepare`, завершённый с кодом `0`, запущенный и работающий `watcher` и готовый обычный контейнер.'
phrases.0: Я диагностировал запуск по статусу init container.
phrases.1: Я разделил разовую подготовку и native sidecar.
phrases.2: Я проверил HTTP-ответ board.
questions.0.points.0: Обычный init должен завершиться; native sidecar — init container с restartPolicy Always.
questions.0.points.1: Startup probe sidecar может задерживать следующий шаг, а сам sidecar продолжает работать.
questions.0.prompt: Чем обычный init отличается от native sidecar?
questions.1.points.0: 'Нет: он привязан к жизни данного Pod.'
questions.1.points.1: Он может пережить перезапуск контейнера в том же Pod.
questions.1.prompt: Переживёт ли этот emptyDir замену Pod?
stages.0.objectives.0.text: Инициализация делает поставленный маршрут доступным приложению внутри Pod по пути
  `/shared/route`.
stages.0.objectives.1.text: Существующий native sidecar остаётся перезапускаемым и успешно запускается с поставленной
  стартовой проверкой heartbeat.
stages.0.objectives.2.text: Deployment `board` сохраняет только поставленные входное и общее хранилища, их
  исходный порядок и настройки доступа.
stages.0.objectives.3.text: 'Текущий Pod приложения не завершается: инициализация успешно окончена, native
  sidecar запущен и работает, контейнер приложения готов.'
stages.0.objectives.4.text: Внутри контейнера `watcher`, выбранного из Deployment `board`, `/shared/heartbeat`
  существует и непуст.
stages.0.objectives.5.text: Из `deployment/board` HTTP `http://board:8080/route` возвращает `north-101`.
diagnostics.prepare: Контейнер prepare мог читать неверный путь или не записать файл в общий том. Проверьте код завершения и сравните байты, которые worker читает из /shared/route, со значением в ConfigMap route. [Причина и проверка](guides#guide=kubernetes-workloads&section=q101-prepare-copy)
diagnostics.startup_command: Команда запуска watcher могла проверять другой файл или только его наличие. Проверьте, что она требует непустой /shared/heartbeat. [Причина и проверка](guides#guide=kubernetes-workloads&section=q101-watcher-startup-command)
diagnostics.period: Пропущенный или изменённый период меняет частоту стартовой проверки. Проверьте periodSeconds у watcher и задайте 1 секунду. [Причина и проверка](guides#guide=kubernetes-workloads&section=q101-watcher-startup-period)
diagnostics.threshold: Стартовая проверка могла сдаваться слишком рано или допускать лишние отказы. Проверьте, что failureThreshold равен 10. [Причина и проверка](guides#guide=kubernetes-workloads&section=q101-watcher-startup-threshold)
diagnostics.restart: Watcher мог стать обычным init-контейнером или потерять политику перезапуска. Оставьте единственный watcher в initContainers с restartPolicy Always. [Причина и проверка](guides#guide=kubernetes-workloads&section=q101-restartable-init-watcher)
diagnostics.volumes: Изменённая проекция, порядок или тип хранилища могли нарушить условия сохранения томов. Проверьте input из ConfigMap route и shared emptyDir с настройками по умолчанию в исходном порядке. [Причина и проверка](guides#guide=kubernetes-workloads&section=q101-input-and-shared-volumes)
diagnostics.prepare_status: В активном Pod board init-контейнер prepare мог завершиться с ошибкой или ещё выполняться. Найдите состояние завершения prepare с кодом 0. [Причина и проверка](guides#guide=kubernetes-workloads&section=q101-prepare-exit-status)
diagnostics.watcher_status: Watcher мог уже работать, но не пройти стартовую проверку, или перезапускаться. Найдите активный Pod board, где watcher одновременно started и running. [Причина и проверка](guides#guide=kubernetes-workloads&section=q101-watcher-running-status)
diagnostics.ready: Основной worker мог ждать init-контейнеров или не проходить readiness. Проверьте флаг ready у worker в активном Pod board. [Причина и проверка](guides#guide=kubernetes-workloads&section=q101-worker-readiness)
diagnostics.same: При замене три подходящих статуса могли оказаться в разных Pod. Проверьте в одном активном Pod успешный prepare, запущенный работающий watcher и готовый worker. [Причина и проверка](guides#guide=kubernetes-workloads&section=q101-pod-status-agreement)
diagnostics.heartbeat: Watcher мог перестать писать или потерять общий том. Проверьте, что работающий watcher видит непустой /shared/heartbeat. [Причина и проверка](guides#guide=kubernetes-workloads&section=q101-live-heartbeat-file)
diagnostics.http: У Service может не быть готового endpoint, либо worker может отдавать старый файл. Запросите /route из worker через порт 8080 и сравните с north-101. [Причина и проверка](guides#guide=kubernetes-workloads&section=q101-live-route-http)
diagnostics.probe_0_0: Наблюдение prepare может остановиться до проверки файла, если не запускается Python или недоступны входы. Проверьте инструменты и доступ к board и route. [Причина и проверка](guides#guide=kubernetes-workloads&section=q101-prepare-observer-input)
diagnostics.probe_0_1: Наблюдение watcher может завершиться до сообщения о конкретном поле из-за ошибки Python или разбора входных данных. Проверьте инструменты и живой Deployment. [Причина и проверка](guides#guide=kubernetes-workloads&section=q101-watcher-observer-input)
