title: Init-контейнеры и native sidecars
brief: 'Основное табло ждёт маршрут в emptyDir. Обычный init container копирует несуществующий файл, поэтому
  native sidecar и табло не запускаются. Исправьте только prepare: /input/route → /shared/route. Сохраните
  watcher как native sidecar в initContainers с restartPolicy: Always и startup probe; основной контейнер
  читает общий каталог. Проверьте завершение подготовки, работающий sidecar, heartbeat и HTTP /route.
  Файловая система хоста не используется.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `route.json`, `board.json`, `service.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Обычный init успешно завершён, native sidecar работает, основное табло отдаёт north-101
  из общего хранилища.'
debrief: Подготовка и постоянная поддержка имеют разные жизненные циклы и используют общий emptyDir.
stages.0.brief: 'Обычный init успешно завершён, native sidecar работает, основное табло отдаёт north-101
  из общего хранилища.


  Результат проверки: Обычный init успешно завершён, native sidecar работает, основное табло отдаёт north-101
  из общего хранилища.'
stages.0.objectives.0.text: Обычный init успешно завершён, native sidecar работает, основное табло отдаёт
  north-101 из общего хранилища.
hints.0.text: Ошибка обычного init блокирует дальнейшую подготовку и запуск приложения.
hints.1.text: Native sidecars — перезапускаемые init containers; обычные init должны завершиться.
hints.2.text: Исправьте путь источника, не перенося watcher в список обычных containers.
phrases.0: Я диагностировал запуск по статусу init container.
phrases.1: Я разделил разовую подготовку и native sidecar.
phrases.2: Я проверил общий путь данных реальным запросом.
questions.0.points.0: Обычный init должен завершиться; native sidecar — init container с restartPolicy
  Always.
questions.0.points.1: Startup probe sidecar может задерживать следующий шаг, а сам sidecar продолжает
  работать.
questions.0.prompt: Чем обычный init отличается от native sidecar?
questions.1.points.0: 'Нет: он привязан к жизни данного Pod.'
questions.1.points.1: Он может пережить перезапуск контейнера в том же Pod.
questions.1.prompt: Переживёт ли этот emptyDir замену Pod?
