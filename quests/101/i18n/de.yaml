diagnostics.prepare: Der Init-Container prepare liest möglicherweise einen falschen Pfad oder schreibt nicht ins gemeinsame Volume. Prüfen Sie seinen Exit-Code und vergleichen Sie die Bytes in /shared/route aus Sicht des Worker-Containers mit der ConfigMap route. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q101-prepare-copy)
diagnostics.startup_command: Der Startbefehl des Watchers prüft möglicherweise eine andere Datei oder nur deren Existenz. Prüfen Sie, ob er eine nicht leere Datei /shared/heartbeat erwartet. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q101-watcher-startup-command)
diagnostics.period: Ein fehlender oder geänderter Zeitraum ändert die Prüffrequenz. Prüfen Sie periodSeconds beim Watcher und setzen Sie 1 Sekunde. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q101-watcher-startup-period)
diagnostics.threshold: Die Startprüfung gibt möglicherweise zu früh auf oder toleriert zu viele Fehler. Prüfen Sie, ob failureThreshold auf 10 steht. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q101-watcher-startup-threshold)
diagnostics.restart: Der Watcher wurde möglicherweise als normaler Init-Container definiert oder verlor seine Neustartregel. Belassen Sie genau einen Watcher in initContainers mit restartPolicy Always. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q101-restartable-init-watcher)
diagnostics.volumes: Eine geänderte Projektion, Reihenfolge oder Speicherart kann den Volume-Vertrag verletzen. Prüfen Sie input aus ConfigMap route und das Standard-emptyDir shared in ursprünglicher Reihenfolge. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q101-input-and-shared-volumes)
diagnostics.prepare_status: In einem nicht terminierenden board-Pod läuft prepare möglicherweise noch oder ist fehlgeschlagen. Suchen Sie den beendeten prepare-Status mit Exit-Code 0. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q101-prepare-exit-status)
diagnostics.watcher_status: Der Watcher läuft möglicherweise ohne erfolgreiche Startprüfung oder startet neu. Suchen Sie einen nicht terminierenden board-Pod mit einem Watcher, der zugleich started und running meldet. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q101-watcher-running-status)
diagnostics.ready: Der reguläre Worker wartet möglicherweise auf Init-Container oder scheitert bei der Bereitschaftsprüfung. Prüfen Sie ready am Worker in einem nicht terminierenden board-Pod. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q101-worker-readiness)
diagnostics.same: Beim Austausch können die passenden Zustände zu verschiedenen Pods gehören. Prüfen Sie erfolgreichen prepare, gestarteten laufenden Watcher und bereiten Worker gemeinsam in einem nicht terminierenden Pod. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q101-pod-status-agreement)
diagnostics.heartbeat: Der Watcher schreibt möglicherweise nicht mehr oder hat keinen gemeinsamen Mount. Prüfen Sie im laufenden Watcher die nicht leere Datei /shared/heartbeat. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q101-live-heartbeat-file)
diagnostics.http: Der Service hat möglicherweise keinen bereiten Endpoint oder der Worker könnte eine alte Datei liefern. Rufen Sie /route aus dem Worker über Port 8080 ab und vergleichen Sie mit north-101. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q101-live-route-http)
diagnostics.probe_0_0: Die prepare-Prüfung kann vor dem Dateivergleich abbrechen, wenn Python oder seine Eingaben fehlen. Prüfen Sie Werkzeuge und Zugriff auf board und route. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q101-prepare-observer-input)
diagnostics.probe_0_1: Die Watcher-Prüfung kann vor der Feldmeldung abbrechen, wenn Python oder die Eingabeauswertung scheitert. Prüfen Sie Werkzeuge und aktives Deployment. [Ursache und Prüfung](guides#guide=kubernetes-workloads&section=q101-watcher-observer-input)
