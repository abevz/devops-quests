title: Init-Container und native sidecars
brief: 'Der main board wartet auf einen route, vorbereitet in einem emptyDir. Sein gewöhnliches init container
  kopiert eine nicht vorhandene Eingabedatei, sodass weder native sidecar noch board gestartet werden
  können. Korrigieren Sie nur prepare, um /input/route nach /shared/route. zu kopieren. Behalten Sie watcher
  als native sidecar unter initContainers bei restartPolicy: Always und sein startup probe; Der main container
  liest das freigegebene Verzeichnis. Überprüfen Sie die erfolgreiche Initialisierung, ein laufendes sidecar,
  heartbeat und HTTP /route.. Es ist kein Host-Dateisystem beteiligt.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `route.json`, `board.json`, `service.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: Der normale init wird erfolgreich beendet, der native sidecar läuft weiter und
  der main board bedient north-101 aus dem gemeinsamen Speicher.'
debrief: Initialisierung und fortlaufender Support haben jetzt getrennte Lebenszyklen und teilen sich
  nur einen emptyDir.
stages.0.brief: 'Erfolgskriterien: Der normale init wird erfolgreich beendet, der native sidecar läuft
  weiter und der main board bedient north-101 aus dem gemeinsamen Speicher.'
stages.0.objectives.0.text: Der normale init wird erfolgreich beendet, der native sidecar läuft weiter
  und der main board bedient north-101 aus dem gemeinsamen Speicher.
hints.0.text: Ein fehlerhafter normaler init blockiert die spätere Initialisierung und den Anwendungsstart.
hints.1.text: Native sidecars sind neustartbar init containers; gewöhnliches init containers muss fertig
  sein.
hints.2.text: Korrigieren Sie den Quellpfad, ohne watcher in die normale containers-Liste zu verschieben.
phrases.0: Ich habe den Start anhand des Status init container diagnostiziert.
phrases.1: Ich habe die einmalige Vorbereitung von einem native sidecar getrennt.
phrases.2: Ich habe den gemeinsamen Datenpfad durch eine echte Anfrage überprüft.
questions.0.points.0: Gewöhnlicher init muss abgeschlossen sein; ein native sidecar ist ein init container
  mit restartPolicy Always.
questions.0.points.1: Ein sidecar-Startup probe kann den nächsten Init-Schritt steuern, während sidecar
  weiter ausgeführt wird.
questions.0.prompt: Wie unterscheidet sich ein gewöhnlicher init von einem native sidecar?
questions.1.points.0: NEIN; Es gehört zu dieser Pod-Lebensdauer.
questions.1.points.1: Es kann einen Container-Neustart innerhalb desselben Pod überstehen.
questions.1.prompt: Überlebt dieser emptyDir den Pod-Ersatz?
