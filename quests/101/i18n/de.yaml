title: Init-Container und native sidecars
brief: 'Arbeite in `~/quest` mit `route.json`, `board.json` und `service.json`. Der gewöhnliche Init-Container liest eine
  nicht vorhandene Eingabe und verhindert den Start. Repariere `prepare` und behalte das native Sidecar. Nutze nur die Offline-Umgebung.


  Lies `board.json` für die genauen Init-Befehle in Reihenfolge, die Startup-Probe von watcher und die geordneten Volumes;
  behalte das Eingabe-ConfigMap-Volume, das gemeinsame emptyDir, den Standardmodus `0644` (`defaultMode: 420` in JSON) und
  keine zusätzlichen Volumes. In einem nicht terminierenden Pod mit Label `app=board` muss `prepare` mit 0 enden, `watcher`
  gestartet und laufend sein und ein regulärer Container bereit sein. Die Watcher-Datei `/shared/heartbeat` muss nicht leer
  sein und `board:8080/route` `north-101` liefern. Warte auf den Rollout und prüfe den Pod-Status; die Prüfungen beobachten
  aktuelle Einstellungen, nicht ob nur ein Feld geändert wurde.


  Setze den Befehl des ersten Init-Containers genau auf `["sh", "-c", "cp /input/route /shared/route"]`. Der Startup-Probe-Befehl
  des zweiten Init-Containers muss `["test", "-s", "/shared/heartbeat"]` mit `periodSeconds: 1` und `failureThreshold: 10`
  sein.


  Die Heartbeat-Prüfung nutzt einen von `kubectl exec deployment/board` ausgewählten Pod; sie stellt nicht fest, ob es derselbe
  Pod wie bei der Statusprüfung ist.'
debrief: Die Prüfungen beobachteten Init-Einstellungen, Pod-Zustände, Heartbeat und HTTP-Antwort.
stages.0.brief: Init-Einstellungen, Pod-Zustände, Watcher-Heartbeat und Board-HTTP-Antwort entsprechen der Beschreibung.
stages.0.objectives.0.text: Init-Einstellungen, Pod-Zustände, Watcher-Heartbeat und Board-HTTP-Antwort entsprechen der Beschreibung.
hints.0.text: Ein fehlerhafter normaler init blockiert die spätere Initialisierung und den Anwendungsstart.
hints.1.text: Native sidecars sind neustartbar init containers; gewöhnliches init containers muss fertig sein.
hints.2.text: Korrigieren Sie den Quellpfad, ohne watcher in die normale containers-Liste zu verschieben.
phrases.0: Ich habe den Start anhand des Status init container diagnostiziert.
phrases.1: Ich habe die einmalige Vorbereitung von einem native sidecar getrennt.
phrases.2: Ich habe die HTTP-Antwort des Boards geprüft.
questions.0.points.0: Gewöhnlicher init muss abgeschlossen sein; ein native sidecar ist ein init container mit restartPolicy
  Always.
questions.0.points.1: Ein sidecar-Startup probe kann den nächsten Init-Schritt steuern, während sidecar weiter ausgeführt
  wird.
questions.0.prompt: Wie unterscheidet sich ein gewöhnlicher init von einem native sidecar?
questions.1.points.0: NEIN; Es gehört zu dieser Pod-Lebensdauer.
questions.1.points.1: Es kann einen Container-Neustart innerhalb desselben Pod überstehen.
questions.1.prompt: Überlebt dieser emptyDir den Pod-Ersatz?
