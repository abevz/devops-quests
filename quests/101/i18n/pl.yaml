title: Kontenery inicjujące i native sidecars
brief: "Uruchomienie aplikacji nie kończy się. Dostarczona inicjalizacja, natywny sidecar i aplikacja mają działać\
  \ razem.\n\nPracuj w `~/quest` na workstation. Dostarczone pliki: `route.yaml`, `board.yaml`, `service.yaml`.\n\
  \n**Wymagania:**\n- Init container `prepare` udostępnia trasę z dostarczonego ConfigMap pod `/shared/route` wewnątrz\
  \ Poda.\n- Natywny sidecar `watcher` używa zasady restartu `Always` i kontroli startu wymagającej niepustego `/shared/heartbeat`\
  \ w kontenerze, co `1` sekundę z progiem `10`.\n- Deployment `board` zachowuje wyłącznie dostarczone woluminy\
  \ w kolejności: `input` z ConfigMap `route`, tryb `0644`, następnie współdzielony wolumin emptyDir `shared`.\n\
  - Jeden Pod z etykietą `app=board`, który nie jest kończony, ma `prepare` zakończony kodem `0`, uruchomiony i\
  \ działający `watcher` oraz gotowy zwykły kontener.\n- W kontenerze `watcher` wybranym z Deployment `board` plik\
  \ `/shared/heartbeat` istnieje i nie jest pusty.\n- Z `deployment/board` HTTP `http://board:8080/route` zwraca\
  \ `north-101`.\n\n**Sprawdź samodzielnie przed Check & finish:**\nWykonuj te polecenia obserwacyjne w `~/quest`\
  \ na workstation; `kubectl exec` obserwuje kontener wskazanego obciążenia.\n- Ustawienia, tożsamość i status odpowiadają\
  \ wymaganiom.\n\n  ```sh\n  kubectl get deployment board -o yaml\n  kubectl get pods -l app=board -o json\n  ```\n\
  - `kubectl exec deployment/board -c watcher -- wc -c /shared/heartbeat` — Plik heartbeat wewnątrz `watcher` ma\
  \ dodatnią liczbę bajtów.\n- `kubectl exec deployment/board -- wget -qO- -T 3 http://board:8080/route` — Odbiorca\
  \ otrzymuje `north-101`.\n\nSprawdzane są bieżące ustawienia, nie historia zmiany jednego pola; nie dowodzi to,\
  \ że Pod heartbeat wybrany z Deployment jest tym samym Podem co w kontroli statusu.\n"
debrief: Kontrole sprawdziły ustawienia init, stany Poda, heartbeat i odpowiedź HTTP.
stages.0.brief: 'Inicjalizacja i natywny sidecar mają zapewniać gotową aplikację i wymaganą trasę.

  '
hints.0.text: 'Awaria zwykłego init blokuje dalszą inicjalizację i start aplikacji. Jego dostarczona ścieżka źródłowa
  wskazuje nieistniejące wejście.

  '
hints.1.text: Native sidecars można zrestartować init containers; zwykły init containers musi się zakończyć.
hints.2.text: 'Popraw ścieżkę źródłową bez przenoszenia watcher do listy zwykłych kontenerów. Polecenie prepare
  to sh -c z cp /input/route /shared/route. Kontrola startu watcher to test -s /shared/heartbeat, z periodSeconds
  1 i failureThreshold 10. Zachowaj prepare jako pierwszy, a watcher jako drugi na liście init containers.

  '
phrases.0: Zdiagnozowałem uruchomienie poprzez status init container.
phrases.1: Oddzieliłem jednorazowe przygotowanie od native sidecar.
phrases.2: Sprawdziłem odpowiedź HTTP board.
questions.0.points.0: Zwykły init musi zostać ukończony; native sidecar to init container z restartPolicy Always.
questions.0.points.1: Sonda startowa sidecar może bramkować następny krok inicjowania, podczas gdy sidecar działa.
questions.0.prompt: Czym zwykły init różni się od native sidecar?
questions.1.points.0: NIE; należy do tego okresu istnienia Pod.
questions.1.points.1: Może przetrwać ponowne uruchomienie kontenera w tym samym Pod.
questions.1.prompt: Czy ten emptyDir przetrwa wymianę Pod?
diagnostics.startup_command: watcher startupProbe.exec.command musi być równe test -s /shared/heartbeat.
diagnostics.period: watcher startupProbe.periodSeconds musi być równe 1.
diagnostics.threshold: watcher startupProbe.failureThreshold musi być równe 10.
diagnostics.prepare: prepare command musi być równe sh -c cp /input/route /shared/route.
diagnostics.restart: watcher restartPolicy musi być równe Always.
diagnostics.volumes: Wolumeny board muszą dokładnie odpowiadać dostarczonym wolumenom input i shared.
diagnostics.prepare_status: Pod board nieoznaczony do usunięcia musi mieć pomyślnie zakończony kontener prepare.
diagnostics.watcher_status: Pod board nieoznaczony do usunięcia musi mieć uruchomiony i działający watcher.
diagnostics.ready: Pod board nieoznaczony do usunięcia musi mieć gotowy zwykły kontener.
diagnostics.same: Jeden Pod board nieoznaczony do usunięcia musi spełniać wszystkie trzy warunki kontenerów.
diagnostics.http: board:8080/route musi być równe north-101.
diagnostics.heartbeat: Plik watcher /shared/heartbeat musi istnieć i nie być pusty.
