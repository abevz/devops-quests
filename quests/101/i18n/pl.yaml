title: Kontenery inicjujące i native sidecars
brief: 'Pracuj w `~/quest` z `route.json`, `board.json` i `service.json`. Zwykły kontener init odczytuje nieistniejące wejście
  i blokuje start. Napraw `prepare` i zachowaj natywny sidecar. Używaj tylko zatoki offline.


  Przeczytaj `board.json`, aby poznać dokładną kolejność i polecenia init, startup probe watcher oraz kolejność wolumenów;
  zachowaj wolumen wejściowej ConfigMap, wspólny emptyDir, domyślny tryb `0644` (`defaultMode: 420` w JSON) i brak dodatkowych
  wolumenów. W jednym Podzie nieoznaczonym do usunięcia z etykietą `app=board` `prepare` musi zakończyć się kodem 0, `watcher`
  musi być uruchomiony i działać, a zwykły kontener musi być gotowy. Plik watcher `/shared/heartbeat` musi być niepusty, a
  `board:8080/route` musi zwrócić `north-101`. Poczekaj na rollout i sprawdź stan Poda; kontrole obserwują bieżące ustawienia,
  nie to, czy zmieniono tylko jedno pole.


  Ustaw polecenie pierwszego kontenera init dokładnie na `["sh", "-c", "cp /input/route /shared/route"]`. Polecenie startup
  probe drugiego kontenera init musi być `["test", "-s", "/shared/heartbeat"]` z `periodSeconds: 1` i `failureThreshold: 10`.


  Kontrola heartbeat używa Poda wybranego przez `kubectl exec deployment/board`; nie ustala, czy jest to ten sam Pod co w
  kontroli stanu.'
debrief: Kontrole sprawdziły ustawienia init, stany Poda, heartbeat i odpowiedź HTTP.
stages.0.brief: Ustawienia init, stany Poda, heartbeat watcher i odpowiedź HTTP board odpowiadają opisowi.
stages.0.objectives.0.text: Ustawienia init, stany Poda, heartbeat watcher i odpowiedź HTTP board odpowiadają opisowi.
hints.0.text: Awaria zwykłego init blokuje późniejszą inicjalizację i uruchomienie aplikacji.
hints.1.text: Native sidecars można zrestartować init containers; zwykły init containers musi się zakończyć.
hints.2.text: Popraw ścieżkę źródłową bez przenoszenia watcher na zwykłą listę containers.
phrases.0: Zdiagnozowałem uruchomienie poprzez status init container.
phrases.1: Oddzieliłem jednorazowe przygotowanie od native sidecar.
phrases.2: Sprawdziłem odpowiedź HTTP board.
questions.0.points.0: Zwykły init musi zostać ukończony; native sidecar to init container z restartPolicy Always.
questions.0.points.1: Sonda startowa sidecar może bramkować następny krok inicjowania, podczas gdy sidecar działa.
questions.0.prompt: Czym zwykły init różni się od native sidecar?
questions.1.points.0: NIE; należy do tego okresu istnienia Pod.
questions.1.points.1: Może przetrwać ponowne uruchomienie kontenera w tym samym Pod.
questions.1.prompt: Czy ten emptyDir przetrwa wymianę Pod?
diagnostics.startup_command: watcher startupProbe.exec.command musi być równe test -s /shared/heartbeat.
diagnostics.period: watcher startupProbe.periodSeconds musi być równe 1.
diagnostics.threshold: watcher startupProbe.failureThreshold musi być równe 10.
diagnostics.prepare: prepare command musi być równe sh -c cp /input/route /shared/route.
diagnostics.restart: watcher restartPolicy musi być równe Always.
diagnostics.volumes: Wolumeny board muszą dokładnie odpowiadać dostarczonym wolumenom input i shared.
diagnostics.prepare_status: Pod board nieoznaczony do usunięcia musi mieć pomyślnie zakończony kontener prepare.
diagnostics.watcher_status: Pod board nieoznaczony do usunięcia musi mieć uruchomiony i działający watcher.
diagnostics.ready: Pod board nieoznaczony do usunięcia musi mieć gotowy zwykły kontener.
diagnostics.same: Jeden Pod board nieoznaczony do usunięcia musi spełniać wszystkie trzy warunki kontenerów.
diagnostics.http: board:8080/route musi być równe north-101.
diagnostics.heartbeat: Plik watcher /shared/heartbeat musi istnieć i nie być pusty.
