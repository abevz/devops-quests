title: Kontenery inicjujące i native sidecars
brief: 'Uruchomienie aplikacji nie kończy się. Dostarczona inicjalizacja, natywny sidecar i aplikacja mają
  działać razem.


  Pracuj w `~/quest` na workstation. Dostarczone pliki: `route.yaml`, `board.yaml`, `service.yaml`.


  **Wymagania:**

  - Inicjalizacja udostępnia aplikacji dostarczoną trasę wewnątrz Poda w `/shared/route`.

  - Istniejący natywny sidecar pozostaje restartowalny i uruchamia się poprawnie z dostarczoną kontrolą startową
  heartbeat.

  - Deployment `board` zachowuje tylko dostarczony magazyn wejściowy i współdzielony, z ich oryginalną kolejnością
  i ustawieniami dostępu.

  - Bieżący Pod aplikacji nie jest usuwany: inicjalizacja zakończyła się pomyślnie, natywny sidecar jest uruchomiony
  i działa, a kontener aplikacji jest gotowy.

  - W kontenerze `watcher` wybranym z Deployment `board` plik `/shared/heartbeat` istnieje i nie jest pusty.

  - Z `deployment/board` HTTP `http://board:8080/route` zwraca `north-101`.


  Sprawdzane są bieżące ustawienia, nie historia zmiany jednego pola; nie dowodzi to, że Pod heartbeat wybrany
  z Deployment jest tym samym Podem co w kontroli statusu.

  '
debrief: Kontrole sprawdziły ustawienia init, stany Poda, heartbeat i odpowiedź HTTP.
stages.0.brief: Inicjalizacja i natywny sidecar mają zapewniać gotową aplikację i wymaganą trasę.
hints.0.text: Gotowość aplikacji zależy od poprawnej inicjalizacji i kontenerów pomocniczych.
hints.1.text: 'Awaria zwykłego init blokuje dalszą inicjalizację i start aplikacji. Jego dostarczona ścieżka
  źródłowa wskazuje nieistniejące wejście.


  Native sidecars można zrestartować init containers; zwykły init containers musi się zakończyć.


  Sprawdź dostarczone definicje, bieżące zasoby i zdarzenia.


  ```sh

  cat board.yaml

  kubectl get deployment board -o yaml

  kubectl get pods -l app=board -o yaml

  kubectl describe pods -l app=board

  ```'
hints.2.text: 'Popraw ścieżkę źródłową bez przenoszenia watcher do listy zwykłych kontenerów. Polecenie prepare to sh -c z cp /input/route /shared/route. Kontrola startu watcher to test -s /shared/heartbeat, z periodSeconds 1 i failureThreshold 10. Zachowaj prepare jako pierwszy, a watcher jako drugi na liście init containers.


  Sprawdź obserwowany wynik:


  ```sh

  kubectl get pods -l app=board

  kubectl exec deployment/board -c watcher -- wc -c /shared/heartbeat

  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080/route

  ```


  Oczekuj poprawnej inicjalizacji, uruchomionego i działającego natywnego sidecara, gotowego kontenera aplikacji, dodatniej liczby bajtów heartbeat i odpowiedzi HTTP north-101.


  Dostarczone ograniczenia i szczegóły: Init container `prepare` udostępnia trasę z dostarczonego ConfigMap pod `/shared/route` wewnątrz Poda. Natywny sidecar `watcher` używa zasady restartu `Always` i kontroli startu wymagającej niepustego `/shared/heartbeat` w kontenerze, co `1` sekundę z progiem `10`. Deployment `board` zachowuje wyłącznie dostarczone woluminy w kolejności: `input` z ConfigMap `route`, tryb `0644`, następnie współdzielony wolumin emptyDir `shared`. Jeden Pod z etykietą `app=board`, który nie jest kończony, ma `prepare` zakończony kodem `0`, uruchomiony i działający `watcher` oraz gotowy zwykły kontener.'
phrases.0: Zdiagnozowałem uruchomienie poprzez status init container.
phrases.1: Oddzieliłem jednorazowe przygotowanie od native sidecar.
phrases.2: Sprawdziłem odpowiedź HTTP board.
questions.0.points.0: Zwykły init musi zostać ukończony; native sidecar to init container z restartPolicy Always.
questions.0.points.1: Sonda startowa sidecar może bramkować następny krok inicjowania, podczas gdy sidecar
  działa.
questions.0.prompt: Czym zwykły init różni się od native sidecar?
questions.1.points.0: NIE; należy do tego okresu istnienia Pod.
questions.1.points.1: Może przetrwać ponowne uruchomienie kontenera w tym samym Pod.
questions.1.prompt: Czy ten emptyDir przetrwa wymianę Pod?
stages.0.objectives.0.text: Inicjalizacja udostępnia aplikacji dostarczoną trasę wewnątrz Poda w `/shared/route`.
stages.0.objectives.1.text: Istniejący natywny sidecar pozostaje restartowalny i uruchamia się poprawnie z
  dostarczoną kontrolą startową heartbeat.
stages.0.objectives.2.text: Deployment `board` zachowuje tylko dostarczony magazyn wejściowy i współdzielony,
  z ich oryginalną kolejnością i ustawieniami dostępu.
stages.0.objectives.3.text: 'Bieżący Pod aplikacji nie jest usuwany: inicjalizacja zakończyła się pomyślnie,
  natywny sidecar jest uruchomiony i działa, a kontener aplikacji jest gotowy.'
stages.0.objectives.4.text: W kontenerze `watcher` wybranym z Deployment `board` plik `/shared/heartbeat` istnieje
  i nie jest pusty.
stages.0.objectives.5.text: Z `deployment/board` HTTP `http://board:8080/route` zwraca `north-101`.
diagnostics.prepare: Kontener prepare może czytać złą ścieżkę lub nie zapisać pliku we wspólnym wolumenie. Sprawdź kod zakończenia i porównaj bajty widoczne dla kontenera worker w /shared/route z ConfigMap route. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q101-prepare-copy)
diagnostics.startup_command: Polecenie startowe watchera może sprawdzać inny plik albo tylko jego istnienie. Upewnij się, że sprawdza niepusty /shared/heartbeat. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q101-watcher-startup-command)
diagnostics.period: Brak okresu sondy lub jego zmiana wpływa na częstotliwość sprawdzania. Sprawdź periodSeconds watchera i ustaw 1 sekundę. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q101-watcher-startup-period)
diagnostics.threshold: Sonda startowa może kończyć zbyt wcześnie lub tolerować zbyt wiele błędów. Sprawdź, czy failureThreshold wynosi 10. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q101-watcher-startup-threshold)
diagnostics.restart: Watcher mógł zostać zwykłym kontenerem init lub stracić politykę restartu. Zachowaj jednego watchera w initContainers z restartPolicy Always. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q101-restartable-init-watcher)
diagnostics.volumes: Zmieniona projekcja, kolejność lub typ pamięci może naruszyć kontrakt wolumenów. Sprawdź input z ConfigMap route i domyślny shared emptyDir w pierwotnej kolejności. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q101-input-and-shared-volumes)
diagnostics.prepare_status: W nieterminowanym podzie board kontener prepare może nadal działać lub kończyć błędem. Poszukaj zakończonego prepare z kodem 0. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q101-prepare-exit-status)
diagnostics.watcher_status: Watcher może działać bez zaliczenia sondy startowej lub restartować się. Znajdź nieterminowany pod board z watcherem jednocześnie started i running. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q101-watcher-running-status)
diagnostics.ready: Główny kontener worker może czekać na kontenery init albo nie przechodzić gotowości. Sprawdź ready kontenera worker w nieterminowanym podzie board. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q101-worker-readiness)
diagnostics.same: Podczas wymiany trzy pasujące statusy mogą należeć do różnych podów. Sprawdź w jednym nieterminowanym podzie udany prepare, uruchomiony watcher i gotowy worker. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q101-pod-status-agreement)
diagnostics.heartbeat: Watcher może przestać zapisywać lub nie mieć wspólnego montowania. Sprawdź niepusty /shared/heartbeat w działającym watcherze. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q101-live-heartbeat-file)
diagnostics.http: Service może nie mieć gotowego endpointu albo kontener worker może zwracać starszy plik. Pobierz /route z kontenera worker przez port 8080 i porównaj z north-101. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q101-live-route-http)
diagnostics.probe_0_0: Obserwator prepare może nie dotrzeć do kontroli pliku, jeśli Python lub jego dane są niedostępne. Sprawdź narzędzia i dostęp do board i route. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q101-prepare-observer-input)
diagnostics.probe_0_1: Kontrola watchera może zakończyć się przed wskazaniem pola przez błąd Pythona lub odczytu danych. Sprawdź narzędzia i działający Deployment. [Przyczyna i kontrola](guides#guide=kubernetes-workloads&section=q101-watcher-observer-input)
