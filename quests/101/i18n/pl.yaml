  ConfigMap `route`, tryb `0644`, następnie współdzielony wolumin emptyDir `shared`.'
stages.0.objectives.3.text: Jeden Pod z etykietą `app=board`, który nie jest kończony, ma `prepare` zakończony kodem
  `0`, uruchomiony i działający `watcher` oraz gotowy zwykły kontener.
stages.0.objectives.4.text: W kontenerze `watcher` wybranym z Deployment `board` plik `/shared/heartbeat` istnieje
