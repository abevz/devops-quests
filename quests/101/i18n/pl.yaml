title: Kontenery inicjujące i native sidecars
brief: 'board czeka na route przygotowane w emptyDir. Jego zwykły init container kopiuje nieistniejący
  plik wejściowy, więc ani native sidecar, ani board nie mogą się uruchomić. Napraw tylko przygotowanie
  do kopiowania /input/route do /shared/route. Zachowaj watcher jako native sidecar pod initContainers
  z restartPolicy: Always i jego startup probe; główny kontener odczytuje katalog współdzielony. Sprawdź
  pomyślną inicjalizację, działające sidecar, heartbeat i HTTP /route.. Żaden system plików hosta nie
  jest zaangażowany.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `route.json`, `board.json`,
  `service.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: zwykły init kończy się pomyślnie, native sidecar pozostaje uruchomiony,
  a board obsługuje north-101 ze współdzielonej pamięci.'
debrief: Inicjalizacja i ciągłe wsparcie mają teraz oddzielne cykle życia, a współdzielony jest tylko
  emptyDir.
stages.0.brief: 'Kryteria sukcesu: Zwykły init kończy się pomyślnie, native sidecar pozostaje uruchomiony,
  a board obsługuje north-101 ze współdzielonej pamięci.'
stages.0.objectives.0.text: Zwykły init kończy się pomyślnie, native sidecar pozostaje uruchomiony, a
  board obsługuje north-101 ze współdzielonej pamięci.
hints.0.text: Awaria zwykłego init blokuje późniejszą inicjalizację i uruchomienie aplikacji.
hints.1.text: Native sidecars można zrestartować init containers; zwykły init containers musi się zakończyć.
hints.2.text: Popraw ścieżkę źródłową bez przenoszenia watcher na zwykłą listę containers.
phrases.0: Zdiagnozowałem uruchomienie poprzez status init container.
phrases.1: Oddzieliłem jednorazowe przygotowanie od native sidecar.
phrases.2: Zweryfikowałem udostępnioną ścieżkę danych poprzez prawdziwe żądanie.
questions.0.points.0: Zwykły init musi zostać ukończony; native sidecar to init container z restartPolicy
  Always.
questions.0.points.1: Sonda startowa sidecar może bramkować następny krok inicjowania, podczas gdy sidecar
  działa.
questions.0.prompt: Czym zwykły init różni się od native sidecar?
questions.1.points.0: NIE; należy do tego okresu istnienia Pod.
questions.1.points.1: Może przetrwać ponowne uruchomienie kontenera w tym samym Pod.
questions.1.prompt: Czy ten emptyDir przetrwa wymianę Pod?
