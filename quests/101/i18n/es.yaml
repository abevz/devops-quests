title: Contenedores de inicio y native sidecars
brief: 'El inicio de la aplicación no termina. La inicialización suministrada, el sidecar nativo y la aplicación
  deben funcionar juntos.


  Trabaja en `~/quest` en la workstation. Archivos suministrados: `route.yaml`, `board.yaml`, `service.yaml`.


  **Requisitos:**

  - La inicialización pone la ruta suministrada a disposición de la aplicación dentro del Pod en `/shared/route`.

  - El sidecar nativo existente sigue siendo reiniciable y arranca correctamente con su comprobación de inicio
  de heartbeat suministrada.

  - El Deployment `board` conserva solo el almacenamiento de entrada y compartido suministrado, con su orden
  y ajustes de acceso originales.

  - Un Pod actual de la aplicación no está terminando: la inicialización terminó correctamente, su sidecar
  nativo está iniciado y en ejecución, y su contenedor de aplicación está listo.

  - Dentro del contenedor `watcher` seleccionado del Deployment `board`, `/shared/heartbeat` existe y no está
  vacío.

  - Desde `deployment/board`, HTTP `http://board:8080/route` devuelve `north-101`.


  Se observan ajustes actuales, no un historial de un único campo; no se demuestra que el Pod de heartbeat
  elegido del Deployment sea el mismo que el de estado.

  '
debrief: Las comprobaciones observaron configuración init, estados del Pod, heartbeat y respuesta HTTP.
stages.0.brief: La inicialización y el sidecar nativo deben permitir una aplicación lista y la ruta requerida.
hints.0.text: La disponibilidad de la aplicación depende de la inicialización correcta y de los contenedores
  auxiliares.
hints.1.text: 'Un init normal fallido bloquea la inicialización posterior y el inicio de la aplicación. Su
  ruta de origen suministrada apunta a una entrada inexistente.


  Native sidecars son reiniciables init containers; El init containers ordinario debe terminar.


  Inspecciona las definiciones suministradas, los recursos actuales y los eventos.


  ```sh

  cat board.yaml

  kubectl get deployment board -o yaml

  kubectl get pods -l app=board -o yaml

  kubectl describe pods -l app=board

  ```'
hints.2.text: 'Corrige la ruta de origen sin mover watcher a la lista de contenedores normales. El comando prepare es sh -c con cp /input/route /shared/route. La comprobación de inicio de watcher es test -s /shared/heartbeat, con periodSeconds 1 y failureThreshold 10. Mantén prepare primero y watcher segundo en la lista de init containers.


  Verifica el resultado observado:


  ```sh

  kubectl get pods -l app=board

  kubectl exec deployment/board -c watcher -- wc -c /shared/heartbeat

  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080/route

  ```


  Se esperan inicialización correcta, un sidecar nativo iniciado y en ejecución, un contenedor de aplicación listo, un número positivo de bytes de heartbeat y la respuesta HTTP north-101.


  Restricciones y detalles suministrados: El init container `prepare` deja la ruta del ConfigMap suministrado disponible en `/shared/route` dentro del Pod. El sidecar nativo `watcher` usa política de reinicio `Always` y una comprobación de inicio que exige `/shared/heartbeat` no vacío dentro del contenedor, cada `1` segundo con umbral `10`. El Deployment `board` conserva solo los volúmenes suministrados y ordenados: `input` de ConfigMap `route`, modo `0644`, seguido del volumen emptyDir compartido `shared`. Un mismo Pod con etiqueta `app=board`, sin terminar, tiene `prepare` completado con código `0`, `watcher` iniciado y en ejecución y un contenedor normal listo.'
phrases.0: Diagnostiqué el inicio a través del estado init container.
phrases.1: Separé la preparación única de un native sidecar.
phrases.2: Verifiqué la respuesta HTTP de board.
questions.0.points.0: Debe completarse el init ordinario; un native sidecar es un init container con restartPolicy
  Always.
questions.0.points.1: Un inicio sidecar probe puede pasar al siguiente paso de inicio mientras el sidecar sigue
  ejecutándose.
questions.0.prompt: ¿En qué se diferencia un init normal de un native sidecar?
questions.1.points.0: No; pertenece a esta vida útil Pod.
questions.1.points.1: Puede sobrevivir a un reinicio de contenedor dentro del mismo Pod.
questions.1.prompt: ¿Este emptyDir sobrevive al reemplazo del Pod?
diagnostics.startup_command: La comprobación de inicio de watcher debe verificar que /shared/heartbeat no esté vacío.
diagnostics.period: watcher startupProbe.periodSeconds debe ser igual a 1.
diagnostics.threshold: watcher startupProbe.failureThreshold debe ser igual a 10.
diagnostics.prepare: La inicialización debe dejar la ruta suministrada disponible en worker en /shared/route.
diagnostics.restart: watcher restartPolicy debe ser igual a Always.
diagnostics.volumes: Los volúmenes board deben coincidir exactamente con los volúmenes input y shared proporcionados.
diagnostics.prepare_status: Un Pod board no marcado para eliminación debe tener el contenedor prepare finalizado
  correctamente.
diagnostics.watcher_status: Un Pod board no marcado para eliminación debe tener watcher iniciado y en ejecución.
diagnostics.ready: Un Pod board no marcado para eliminación debe tener un contenedor normal listo.
diagnostics.same: Un mismo Pod board no marcado para eliminación debe cumplir las tres condiciones de contenedores.
diagnostics.http: board:8080/route debe ser igual a north-101.
diagnostics.heartbeat: El archivo watcher /shared/heartbeat debe existir y no estar vacío.
stages.0.objectives.0.text: La inicialización pone la ruta suministrada a disposición de la aplicación dentro
  del Pod en `/shared/route`.
stages.0.objectives.1.text: El sidecar nativo existente sigue siendo reiniciable y arranca correctamente con
  su comprobación de inicio de heartbeat suministrada.
stages.0.objectives.2.text: El Deployment `board` conserva solo el almacenamiento de entrada y compartido suministrado,
  con su orden y ajustes de acceso originales.
stages.0.objectives.3.text: 'Un Pod actual de la aplicación no está terminando: la inicialización terminó correctamente,
  su sidecar nativo está iniciado y en ejecución, y su contenedor de aplicación está listo.'
stages.0.objectives.4.text: Dentro del contenedor `watcher` seleccionado del Deployment `board`, `/shared/heartbeat`
  existe y no está vacío.
stages.0.objectives.5.text: Desde `deployment/board`, HTTP `http://board:8080/route` devuelve `north-101`.
