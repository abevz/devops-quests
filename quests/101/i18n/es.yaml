title: Contenedores de inicio y native sidecars
brief: 'Trabaja en `~/quest` con `route.json`, `board.json` y `service.json`. El contenedor init ordinario lee una entrada
  inexistente e impide el inicio. Repara `prepare` y conserva el sidecar nativo. Usa solo la bahía sin conexión.


  Lee `board.json` para conocer los comandos init en orden, la startup probe de watcher y los volúmenes ordenados; conserva
  el volumen de ConfigMap de entrada, el emptyDir compartido, el modo predeterminado `0644` (`defaultMode: 420` en JSON) y
  ningún volumen adicional. En un Pod no terminante con etiqueta `app=board`, `prepare` debe terminar con 0, `watcher` debe
  estar iniciado y ejecutándose, y un contenedor normal debe estar listo. El archivo `/shared/heartbeat` de watcher debe ser
  no vacío y `board:8080/route` debe devolver `north-101`. Espera el rollout e inspecciona el estado del Pod; las comprobaciones
  observan la configuración actual, no si solo se cambió un campo.


  Establece el comando del primer contenedor init exactamente en `["sh", "-c", "cp /input/route /shared/route"]`. El comando
  de la startup probe del segundo contenedor init debe ser `["test", "-s", "/shared/heartbeat"]` con `periodSeconds: 1` y
  `failureThreshold: 10`.


  La comprobación del heartbeat usa un Pod seleccionado por `kubectl exec deployment/board`; no establece que sea el mismo
  Pod de la comprobación de estado.'
debrief: Las comprobaciones observaron configuración init, estados del Pod, heartbeat y respuesta HTTP.
stages.0.brief: La configuración init, los estados del Pod, el heartbeat de watcher y la respuesta HTTP de board coinciden
  con la descripción.
stages.0.objectives.0.text: La configuración init, los estados del Pod, el heartbeat de watcher y la respuesta HTTP de board
  coinciden con la descripción.
hints.0.text: Un init normal y defectuoso bloquea la inicialización y el inicio de la aplicación posteriores.
hints.1.text: Native sidecars son reiniciables init containers; El init containers ordinario debe terminar.
hints.2.text: Corrija la ruta de origen sin mover watcher a la lista normal containers.
phrases.0: Diagnostiqué el inicio a través del estado init container.
phrases.1: Separé la preparación única de un native sidecar.
phrases.2: Verifiqué la respuesta HTTP de board.
questions.0.points.0: Debe completarse el init ordinario; un native sidecar es un init container con restartPolicy Always.
questions.0.points.1: Un inicio sidecar probe puede pasar al siguiente paso de inicio mientras el sidecar sigue ejecutándose.
questions.0.prompt: ¿En qué se diferencia un init normal de un native sidecar?
questions.1.points.0: No; pertenece a esta vida útil Pod.
questions.1.points.1: Puede sobrevivir a un reinicio de contenedor dentro del mismo Pod.
questions.1.prompt: ¿Este emptyDir sobrevive al reemplazo del Pod?
