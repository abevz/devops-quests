title: Contenedores de inicio y native sidecars
brief: 'El main board espera un route preparado en un emptyDir. Su init container normal copia un archivo
  de entrada inexistente, por lo que ni el native sidecar ni el board pueden iniciarse. Corrija solo prepare
  para copiar /input/route a /shared/route.. Mantenga watcher como native sidecar en initContainers con
  restartPolicy: Always y su startup probe; el main container lee el directorio compartido. Verifique
  la inicialización exitosa, un sidecar, heartbeat y HTTP /route. en ejecución. No hay ningún sistema
  de archivos host involucrado.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `route.json`, `board.json`,
  `service.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: el init normal sale correctamente, el native sidecar permanece ejecutándose
  y el main board sirve a north-101 desde el almacenamiento compartido.'
debrief: La inicialización y el soporte continuo ahora tienen ciclos de vida separados y comparten solo
  un emptyDir.
stages.0.brief: 'Criterios de éxito: el init normal sale correctamente, el native sidecar permanece ejecutándose
  y el main board sirve a north-101 desde el almacenamiento compartido.'
stages.0.objectives.0.text: El init normal sale correctamente, el native sidecar permanece ejecutándose
  y el main board sirve a north-101 desde el almacenamiento compartido.
hints.0.text: Un init normal y defectuoso bloquea la inicialización y el inicio de la aplicación posteriores.
hints.1.text: Native sidecars son reiniciables init containers; El init containers ordinario debe terminar.
hints.2.text: Corrija la ruta de origen sin mover watcher a la lista normal containers.
phrases.0: Diagnostiqué el inicio a través del estado init container.
phrases.1: Separé la preparación única de un native sidecar.
phrases.2: Verifiqué la ruta de datos compartidos mediante una solicitud real.
questions.0.points.0: Debe completarse el init ordinario; un native sidecar es un init container con restartPolicy
  Always.
questions.0.points.1: Un inicio sidecar probe puede pasar al siguiente paso de inicio mientras el sidecar
  sigue ejecutándose.
questions.0.prompt: ¿En qué se diferencia un init normal de un native sidecar?
questions.1.points.0: No; pertenece a esta vida útil Pod.
questions.1.points.1: Puede sobrevivir a un reinicio de contenedor dentro del mismo Pod.
questions.1.prompt: ¿Este emptyDir sobrevive al reemplazo del Pod?
