title: Init containers and native sidecars
brief: 'The main board waits for a route prepared in an emptyDir. Its ordinary init container copies a
  nonexistent input file, so neither the native sidecar nor the board can start. Fix only prepare to copy
  /input/route to /shared/route. Keep watcher as a native sidecar under initContainers with restartPolicy:
  Always and its startup probe; the main container reads the shared directory. Verify successful initialization,
  a running sidecar, heartbeat and HTTP /route. No host filesystem is involved.


  Quest files in `~/quest` (some appear in later stages): `route.json`, `board.json`, `service.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: The ordinary init exits successfully, the native sidecar stays running and
  the main board serves north-101 from shared storage.'
debrief: Initialization and ongoing support now have separate lifecycles while sharing only an emptyDir.
