title: Init containers and native sidecars
brief: 'Work in `~/quest` with `route.json`, `board.json` and `service.json`. The ordinary init container reads a nonexistent
  input, preventing startup. Repair `prepare` and retain the native sidecar. Use only the offline bay.


  Read `board.json` for the exact ordered init commands, watcher startup probe and ordered volumes; preserve its input ConfigMap
  volume, shared emptyDir, default mode `0644` (`defaultMode: 420` in JSON) and no extra volumes. In one Pod not marked for
  deletion labelled `app=board`, `prepare` must exit 0, `watcher` must be started and running, and a regular container must
  be ready. The watcher file `/shared/heartbeat` must be nonempty, and `board:8080/route` must return `north-101`. Wait for
  rollout and inspect Pod status; the checks observe current settings, not whether only one field was changed.


  Set the first init container command to exactly `["sh", "-c", "cp /input/route /shared/route"]`. The second init container
  startup probe command must be `["test", "-s", "/shared/heartbeat"]` with `periodSeconds: 1` and `failureThreshold: 10`.


  The heartbeat check uses a Pod selected by `kubectl exec deployment/board`; it does not establish that this is the same
  Pod as the status check.'
debrief: The checks observed the init settings, Pod states, heartbeat and HTTP response.
stages.0.brief: The specified init settings, Pod states, watcher heartbeat and board HTTP response match the brief.
stages.0.objectives.0.text: The specified init settings, Pod states, watcher heartbeat and board HTTP response match the brief.
hints.0.text: A failing ordinary init blocks later initialization and application startup.
hints.1.text: Native sidecars are restartable init containers; ordinary init containers must finish.
hints.2.text: Correct the source path without moving watcher into the ordinary containers list.
phrases.0: I diagnosed startup through init container status.
phrases.1: I separated one-time preparation from a native sidecar.
phrases.2: I verified the board HTTP response.
questions.0.points.0: Ordinary init must complete; a native sidecar is an init container with restartPolicy Always.
questions.0.points.1: A sidecar startup probe can gate the next init step while the sidecar keeps running.
questions.0.prompt: How does an ordinary init differ from a native sidecar?
questions.1.points.0: No; it belongs to this Pod lifetime.
questions.1.points.1: It can survive a container restart within the same Pod.
questions.1.prompt: Does this emptyDir survive Pod replacement?
diagnostics.startup_command: watcher startupProbe.exec.command must equal test -s /shared/heartbeat.
diagnostics.period: watcher startupProbe.periodSeconds must equal 1.
diagnostics.threshold: watcher startupProbe.failureThreshold must equal 10.
diagnostics.prepare: prepare command must equal sh -c cp /input/route /shared/route.
diagnostics.restart: watcher restartPolicy must equal Always.
diagnostics.volumes: Board volumes must exactly match the supplied input and shared volumes.
diagnostics.prepare_status: A board Pod not marked for deletion must have a successful prepare container.
diagnostics.watcher_status: A board Pod not marked for deletion must have a started, running watcher.
diagnostics.ready: A board Pod not marked for deletion must have a ready regular container.
diagnostics.same: One board Pod not marked for deletion must satisfy all three container conditions.
diagnostics.http: board:8080/route must equal north-101.
diagnostics.heartbeat: Watcher /shared/heartbeat must exist and be nonempty.
