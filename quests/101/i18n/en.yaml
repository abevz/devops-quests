title: Init containers and native sidecars
brief: 'Application startup does not finish. The supplied initialization, native sidecar and application must
  operate together.


  Work in `~/quest` on the workstation. Supplied files: `route.yaml`, `board.yaml`, `service.yaml`.


  **Requirements:**

  - Initialization makes the supplied route available to the application inside the Pod at `/shared/route`.

  - The existing native sidecar stays restartable and starts successfully with its supplied heartbeat startup
  check.

  - Deployment `board` keeps only the supplied input and shared storage, with their original order and access
  settings.

  - A current application Pod is not terminating: initialization completed successfully, its native sidecar
  is started and running, and its application container is ready.

  - Inside container `watcher` selected from Deployment `board`, `/shared/heartbeat` exists and is nonempty.

  - From `deployment/board`, HTTP `http://board:8080/route` returns `north-101`.


  Checks observe current settings, not a single-field edit history; the heartbeat Pod selected from the Deployment
  is not proven to be the same Pod as the status check.

  '
debrief: The checks observed the init settings, Pod states, heartbeat and HTTP response.
stages.0.brief: Initialization and the native sidecar must support a ready application and the required route.
hints.0.text: Application readiness depends on successful initialization and supporting containers.
hints.1.text: |-
  A failing ordinary init blocks later initialization and application startup. Its supplied source path names a nonexistent input.

  Native sidecars are restartable init containers; ordinary init containers must finish.

  Inspect the supplied definitions, current resources and events.

  Correct the source path without moving watcher into the ordinary containers list. The prepare command is sh -c with cp /input/route /shared/route. The watcher startup command is test -s /shared/heartbeat, with periodSeconds 1 and failureThreshold 10. Keep prepare first and watcher second in the init container list.

  ```sh
  cat board.yaml
  kubectl get deployment board -o yaml
  kubectl get pods -l app=board -o yaml
  kubectl describe pods -l app=board
  ```
hints.2.text: |-
  Verify the observed result:

  ```sh
  kubectl get pods -l app=board
  kubectl exec deployment/board -c watcher -- wc -c /shared/heartbeat
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080/route
  ```

  Expect successful initialization, a running and started native sidecar, a ready application container, a positive heartbeat byte count and HTTP response north-101.

  Supplied constraints and details: Init container `prepare` makes the route from the supplied ConfigMap available at `/shared/route` inside the Pod. Native sidecar `watcher` uses restart policy `Always` and a startup check requiring a nonempty `/shared/heartbeat` inside its container, every `1` second with failure threshold `10`. Deployment `board` keeps only the supplied ordered volumes: `input` from ConfigMap `route`, mode `0644`, then shared emptyDir volume `shared`. One Pod labelled `app=board`, not terminating, has `prepare` completed with exit code `0`, `watcher` started and running, and a ready regular container.
phrases.0: I diagnosed startup through init container status.
phrases.1: I separated one-time preparation from a native sidecar.
phrases.2: I verified the board HTTP response.
questions.0.points.0: Ordinary init must complete; a native sidecar is an init container with restartPolicy
  Always.
questions.0.points.1: A sidecar startup probe can gate the next init step while the sidecar keeps running.
questions.0.prompt: How does an ordinary init differ from a native sidecar?
questions.1.points.0: No; it belongs to this Pod lifetime.
questions.1.points.1: It can survive a container restart within the same Pod.
questions.1.prompt: Does this emptyDir survive Pod replacement?
stages.0.objectives.0.text: Initialization makes the supplied route available to the application inside the
  Pod at `/shared/route`.
stages.0.objectives.1.text: The existing native sidecar stays restartable and starts successfully with its
  supplied heartbeat startup check.
stages.0.objectives.2.text: Deployment `board` keeps only the supplied input and shared storage, with their
  original order and access settings.
stages.0.objectives.3.text: 'A current application Pod is not terminating: initialization completed successfully,
  its native sidecar is started and running, and its application container is ready.'
stages.0.objectives.4.text: Inside container `watcher` selected from Deployment `board`, `/shared/heartbeat`
  exists and is nonempty.
stages.0.objectives.5.text: From `deployment/board`, HTTP `http://board:8080/route` returns `north-101`.
diagnostics.prepare: The prepare init container may read the wrong projected path or fail to write into the shared volume. Check its exit status and compare the bytes seen by worker at /shared/route with the route ConfigMap. [Cause and check](guides#guide=kubernetes-workloads&section=q101-prepare-copy)
diagnostics.startup_command: The watcher startup command may check for a different file or only check existence. Inspect whether it tests that /shared/heartbeat is nonempty. [Cause and check](guides#guide=kubernetes-workloads&section=q101-watcher-startup-command)
diagnostics.period: A missing or changed probe period alters the startup cadence. Check periodSeconds on the named watcher and use 1 second. [Cause and check](guides#guide=kubernetes-workloads&section=q101-watcher-startup-period)
diagnostics.threshold: The startup probe may give up too early or tolerate more failures than intended. Check its failureThreshold for 10 attempts. [Cause and check](guides#guide=kubernetes-workloads&section=q101-watcher-startup-threshold)
diagnostics.restart: The watcher may have been declared as an ordinary init container or lost its restart policy. Keep the uniquely named watcher in initContainers with restartPolicy Always. [Cause and check](guides#guide=kubernetes-workloads&section=q101-restartable-init-watcher)
diagnostics.volumes: A changed projection, reordered volumes or replacement storage can break the preserved volume contract. Inspect the ordered input volume from ConfigMap route and the default shared emptyDir. [Cause and check](guides#guide=kubernetes-workloads&section=q101-input-and-shared-volumes)
diagnostics.prepare_status: A nonterminating board Pod may still have a failing or pending prepare init container. Look for the named prepare status terminated with exit code 0. [Cause and check](guides#guide=kubernetes-workloads&section=q101-prepare-exit-status)
diagnostics.watcher_status: The restartable watcher may be running without passing its startup probe, or may be restarting. Find a nonterminating board Pod whose watcher is both started and running. [Cause and check](guides#guide=kubernetes-workloads&section=q101-watcher-running-status)
diagnostics.ready: The regular worker may still be blocked by init containers or fail its readiness check. Inspect the worker’s ready flag in a nonterminating board Pod. [Cause and check](guides#guide=kubernetes-workloads&section=q101-worker-readiness)
diagnostics.same: During replacement, the three matching statuses may belong to different Pods. Inspect each nonterminating Pod individually for successful prepare, a started running watcher and ready worker together. [Cause and check](guides#guide=kubernetes-workloads&section=q101-pod-status-agreement)
diagnostics.heartbeat: The watcher process may have stopped writing or may not mount the shared path. Check that the running watcher can read a nonempty /shared/heartbeat. [Cause and check](guides#guide=kubernetes-workloads&section=q101-live-heartbeat-file)
diagnostics.http: The Service may lack a ready endpoint or the worker may serve an old shared file. Check the /route response from worker through port 8080 and compare with north-101. [Cause and check](guides#guide=kubernetes-workloads&section=q101-live-route-http)
diagnostics.probe_0_0: The prepare observer can stop before it classifies a missing file when the workstation Python process or its inputs cannot start. Check the tools and access to board and route. [Cause and check](guides#guide=kubernetes-workloads&section=q101-prepare-observer-input)
diagnostics.probe_0_1: The watcher observer can fail before reporting any field when its Python process or input parsing fails. Check the workstation tools and the live Deployment. [Cause and check](guides#guide=kubernetes-workloads&section=q101-watcher-observer-input)
