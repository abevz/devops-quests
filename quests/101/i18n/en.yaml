hints.0.text: A failing ordinary init blocks later initialization and application startup.
hints.1.text: Native sidecars are restartable init containers; ordinary init containers must finish.
hints.2.text: Correct the source path without moving watcher into the ordinary containers list.
phrases.0: I diagnosed startup through init container status.
phrases.1: I separated one-time preparation from a native sidecar.
phrases.2: I verified the shared data path through a real request.
questions.0.points.0: Ordinary init must complete; a native sidecar is an init container with restartPolicy
  Always.
questions.0.points.1: A sidecar startup probe can gate the next init step while the sidecar keeps running.
questions.0.prompt: How does an ordinary init differ from a native sidecar?
questions.1.points.0: No; it belongs to this Pod lifetime.
questions.1.points.1: It can survive a container restart within the same Pod.
questions.1.prompt: Does this emptyDir survive Pod replacement?
