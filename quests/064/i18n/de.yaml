title: Modul-Fanout
brief: |-
  Die regionale Auslieferung erfüllt den gemeinsamen Caller-Vertrag nicht mehr. Stelle beide Stationsausgaben unter Erhalt ihrer aufgezeichneten Identitäten her.

  Arbeite in `~/quest` auf der Workstation mit `main.tf`, `modules/station/main.tf`, `modules/station/modules/notice/main.tf` und `region-cases.json`.

  **Anforderungen:**

  - `fanout-plan.json` beschreibt den regionalen Standardvertrag für beide ursprünglichen Dateiadressen und den gemeinsamen Caller-Eingang.
  - `fanout-plan.json` enthält genau zwei Dateiersetzungen und keine weiteren Änderungen verwalteter Objekte.
  - Beide ursprünglichen Dateiadressen und die zwei dauerhaften Stationsidentitäten bleiben im State.
  - `depot.txt` entspricht dem regionalen Standardvertrag.
  - `junction.txt` entspricht dem regionalen Standardvertrag.
  - Output `routes` ordnet genau die beiden Vertragsstationen ihren verwalteten Dateien zu.
  - OpenTofu meldet keine ausstehenden Infrastrukturänderungen.
  - Beide vorgegebenen Caller-Werte erreichen beide verwalteten Dateien durch die verschachtelte Modulgrenze; eine kopierte Standardkonstante erfüllt den Vertrag nicht.
  - Verwaltet werden nur die beiden ursprünglichen Routendateien und ihre zwei ursprünglichen Identitätsbegleiter. Die Begleiter bleiben im gespeicherten Plan und in Plänen für andere Eingaben unverändert.
  - Erhalte die vorgegebenen Adressdaten unverändert. Planartefakt, `depot.txt` und `junction.txt` liegen in `~/quest` auf der Workstation.

  Die Prüfungen untersuchen aktuellen State, erhaltene Artefakte und nicht angewandte Pläne; sie beweisen weder den exakt angewandten Plan noch den vollständigen Befehlsverlauf.
debrief: 'Der Root-Fan-out allein genügte nicht: Auch die verschachtelte Schnittstelle musste konstruiert
  werden. Gespeicherte Ersetzungen und alternative Caller-Pläne belegen die Weitergabe bei erhaltenen
  Identitäten und Adressen.'
stages.0.brief: Stelle den verschachtelten Fan-out-Vertrag unter Erhalt beider Stationsidentitäten her.
stages.0.objectives.0.text: '`fanout-plan.json` beschreibt den regionalen Standardvertrag für beide ursprünglichen
  Dateiadressen und den gemeinsamen Caller-Eingang.'
stages.0.objectives.1.text: '`fanout-plan.json` enthält genau zwei Dateiersetzungen und keine weiteren
  Änderungen verwalteter Objekte.'
stages.0.objectives.2.text: Beide ursprünglichen Dateiadressen und die zwei dauerhaften Stationsidentitäten
  bleiben im State.
stages.0.objectives.3.text: '`depot.txt` entspricht dem regionalen Standardvertrag.'
stages.0.objectives.4.text: '`junction.txt` entspricht dem regionalen Standardvertrag.'
stages.0.objectives.5.text: Output `routes` ordnet genau die beiden Vertragsstationen ihren verwalteten
  Dateien zu.
stages.0.objectives.6.text: OpenTofu meldet keine ausstehenden Infrastrukturänderungen.
hints.0.text: Ein Instanzschlüssel (`each.key`) trägt Identität, ein gemeinsamer Eingang Daten. Ein verschachteltes
  Modul fügt eine weitere Schnittstelle hinzu, die denselben Caller-Wert weitergeben muss.
hints.1.text: |-
  Vergleiche Root-Aufruf, unvollständigen Wrapper, verschachtelte Implementierung und aufgezeichneten State. Validierungsfehler und ursprüngliche Adressen zeigen die zu konstruierende Grenze.

  ```sh
  tofu validate -no-color
  tofu state list
  cat main.tf modules/station/main.tf modules/station/modules/notice/main.tf
  ```
hints.2.text: |-
  Rekonstruiere Wrapper-Eingang und Kindaufruf und leite den Caller-Wert durch beide Ebenen. Speichere den Standardplan vor Apply: beide Dateien werden ersetzt, beide Identitätsbegleiter bleiben unverändert. Prüfe jeden vorgegebenen Regionswert mit einem nicht angewandten Plan; der abschließende Standardplan bleibt leer, ohne den Testwert anzuwenden.

  ```sh
  tofu state list
  tofu output -json routes
  cat fanout-plan.json
  tofu plan -input=false -detailed-exitcode -no-color
  ```
phrases.0: Ich habe die for_each-Schlüssel beibehalten und gleichzeitig die gemeinsam genutzten inputs
  korrigiert.
phrases.1: Ich habe jede Modulausgabe anhand ihrer Datei überprüft.
phrases.2: Ich habe stabile Adressen von ersetzten provider-Ressourcen unterschieden.
diagnostics.probe_0_0: Der gespeicherte Plan verbindet nicht beide ursprünglichen Dateien über local.region mit north oder die Belege sind unlesbar; fehlende/veraltete fanout-plan.json, eine fest eingetragene Region oder eine fehlerhafte Modulschnittstelle können die Ursache sein. [Ursache und Prüfung](guides#guide=terraform-7.1&section=fanout-saved-default-contract)
diagnostics.fanout_contract: Ein gelieferter regionaler Aufruf konnte keinen Plan erzeugen, erreichte nicht beide ursprünglichen Stationsdateien oder änderte einen Identitätsbegleiter; fehlende Wrapper-Eingabe/Kindaufruf, Standardliteral, geänderter Begleiter oder unlesbare geschützte/Plan-Daten können die Ursache sein. [Ursache und Prüfung](guides#guide=terraform-7.1&section=fanout-alternate-caller-plans)
diagnostics.probe_0_1: Der gespeicherte Plan ersetzt nicht genau beide ursprünglichen Routendateien mit ausschließlich no-op/read andernorts oder ist unlesbar; ein neuer Plan nach apply, geänderte Instanzschlüssel oder weitere Änderungen können ihn ungültig machen. [Ursache und Prüfung](guides#guide=terraform-7.1&section=fanout-retained-replacement-plan)
diagnostics.probe_0_2: Der aktuelle State enthält nicht beide erfassten Dateiadressen oder deren Belege sind unlesbar; geänderte for_each Schlüssel, entfernte verschachtelte Ressourcen, eine bearbeitete Adressliste oder fehlgeschlagene State-Beobachtung können die benötigten Instanzen verlieren. [Ursache und Prüfung](guides#guide=terraform-7.1&section=fanout-current-file-addresses)
diagnostics.fanout_identity: Der Adressbeleg oder die genaue Menge verwalteter Objekte weicht von den geschützten Originalen ab, ein Identitätsbegleiter änderte ID/Typ oder Belege waren nicht lesbar; neu erstellte Begleiter oder zusätzliche verwaltete Objekte können die Kontinuität verletzen. [Ursache und Prüfung](guides#guide=terraform-7.1&section=fanout-preserved-companion-set)
diagnostics.probe_0_5: Die Ausgabe routes löst nicht genau depot und junction zu ihren vorhandenen Dateien auf oder die Beobachtung schlug fehl; andere/fehlende Schlüssel, falsche exportierte Pfade oder fehlende Dateien können die Ursache sein. [Ursache und Prüfung](guides#guide=terraform-7.1&section=fanout-output-file-targets)
diagnostics.fanout_plan: Der aktuelle Standardplan endete nicht mit 0; korrigierte Moduleingaben müssen möglicherweise noch angewendet werden, Stationsdateien/Ausgaben weichen ab oder unvollständige Schnittstellen beziehungsweise Providerstart verhindern einen gültigen Plan. [Ursache und Prüfung](guides#guide=terraform-7.1&section=fanout-default-no-change-plan)
diagnostics.fanout_depot: depot.txt liefert nicht north:depot oder ist unlesbar; die gelieferte Region retired, unvollständige Weiterleitung oder ein noch nicht angewendeter korrigierter Plan kann die Datei veraltet belassen. [Ursache und Prüfung](guides#guide=terraform-7.1&section=fanout-depot-file)
diagnostics.fanout_junction: junction.txt liefert nicht north:junction oder ist unlesbar; die gelieferte Region retired, unvollständige Weiterleitung oder ein noch nicht angewendeter korrigierter Plan kann die Datei veraltet belassen. [Ursache und Prüfung](guides#guide=terraform-7.1&section=fanout-junction-file)
