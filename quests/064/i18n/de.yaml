phrases.0: Ich habe die for_each-Schlüssel beibehalten und gleichzeitig die gemeinsam genutzten inputs
  korrigiert.
phrases.1: Ich habe jede Modulausgabe anhand ihrer Datei überprüft.
phrases.2: Ich habe stabile Adressen von ersetzten provider-Ressourcen unterschieden.
