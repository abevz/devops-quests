title: Modul-Fanout
brief: |-
  Die regionale Route ist für beide Modulinstanzen veraltet. Ihre vorhandenen Adressen und Ausgabepfade müssen erhalten bleiben.

  Arbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte Eingabedateien: `main.tf`, `modules/station/main.tf`.

  **Anforderungen:**
  - In `~/quest` auf der Workstation dokumentiert `fanout-plan.json`:
    - Die Konfiguration dokumentiert den geforderten regionalen Vertrag für beide bereitgestellten Modulinstanzen.
    - Genau `2` Ressourcen-Ersetzungen.
  - Beide ursprünglichen Modulinstanz-Adressen bleiben im OpenTofu-State erhalten.
  - Dateien in `~/quest` auf der Workstation:
    - `depot.txt`: `north:depot`
    - `junction.txt`: `north:junction`
  - Die Ausgabe `routes` enthält ausschließlich diese Zuordnungen von Stationen zu Dateien:
    - `depot`: `./depot.txt`
    - `junction`: `./junction.txt`
  - OpenTofu meldet keine ausstehenden Infrastrukturänderungen.

  Stabile State-Adressen beweisen nicht, dass die zugrunde liegenden Dateien unverändert sind.
debrief: Gemeinsame Konfiguration und station identity verfügen jetzt über separate Modulverträge.
stages.0.brief: Behalten Sie beide Stationsadressen bei und veröffentlichen Sie die geforderten Routen
  samt gespeichertem Änderungsplan.
stages.0.objectives.0.text: Die Workstation-Datei `fanout-plan.json` dokumentiert den geforderten regionalen
  Vertrag für beide bereitgestellten Modulinstanzen.
stages.0.objectives.1.text: '`fanout-plan.json` dokumentiert genau zwei Ressourcenersetzungen.'
stages.0.objectives.2.text: Beide ursprünglichen Modulinstanz-Adressen bleiben im OpenTofu-State erhalten.
stages.0.objectives.3.text: '`depot.txt` enthält `north:depot`.'
stages.0.objectives.4.text: '`junction.txt` enthält `north:junction`.'
stages.0.objectives.5.text: Output `routes` ordnet `depot` dem Pfad `depot.txt` und `junction` dem Pfad
  `junction.txt` zu, ohne weitere Einträge.
stages.0.objectives.6.text: OpenTofu meldet keine ausstehenden Infrastrukturänderungen.
hints.0.text: Unterscheiden Sie gemeinsame Eingaben von der durch each.key bestimmten Identität.
hints.1.text: |-
  Eine Kartenausgabe sollte station-Schlüssel beibehalten. Die Inhaltsänderung ersetzt Dateiressourcen; stabile State-Adressen bedeuten nicht, dass die Dateien selbst unverändert bleiben.

  Prüfen Sie die bereitgestellte Konfiguration und aktuelle Beobachtungen auf der Workstation:

  ```sh
  cat main.tf modules/station/main.tf
  tofu state list
  ```
hints.2.text: |-
  Jede Instanz erhält derzeit retired statt der gemeinsamen Eingabe local.region. Übergeben Sie local.region, speichern Sie fanout-plan.json vor dem Anwenden, prüfen Sie die Ersetzungen und wenden Sie den gespeicherten Plan an.

  Prüfen Sie das Ergebnis in `~/quest` auf der Workstation:

  Führen Sie diese Beobachtungsbefehle in `~/quest` auf der Workstation aus.
  - `cat fanout-plan.json` — Erwartet: Der gespeicherte Plan zeigt die korrigierte gemeinsame Stationseingabe und genau zwei Ersetzungen.
  - Erwartet: Der State entspricht der ursprünglichen Adressliste; Dateiinhalte und beide Ausgabepfade entsprechen den Anforderungen.

    ```sh
    tofu state list
    cat original-addresses depot.txt junction.txt
    tofu output -json routes
    ```
  - `tofu plan -input=false -detailed-exitcode -no-color` — Erwartet: keine Änderungen, Exit-Code `0`.
phrases.0: Ich habe die for_each-Schlüssel beibehalten und gleichzeitig die gemeinsam genutzten inputs
  korrigiert.
phrases.1: Ich habe jede Modulausgabe anhand ihrer Datei überprüft.
phrases.2: Ich habe stabile Adressen von ersetzten provider-Ressourcen unterschieden.
