hints.0.text: Ein Instanzschlüssel (`each.key`) trägt Identität, ein gemeinsamer Eingang Daten. Ein verschachteltes
  Modul fügt eine weitere Schnittstelle hinzu, die denselben Caller-Wert weitergeben muss.
hints.1.text: |-
  Vergleiche Root-Aufruf, unvollständigen Wrapper, verschachtelte Implementierung und aufgezeichneten State. Validierungsfehler und ursprüngliche Adressen zeigen die zu konstruierende Grenze.

  ```sh
  tofu validate -no-color
  tofu state list
  cat main.tf modules/station/main.tf modules/station/modules/notice/main.tf
  ```
hints.2.text: |-
  Rekonstruiere Wrapper-Eingang und Kindaufruf und leite den Caller-Wert durch beide Ebenen. Speichere den Standardplan vor Apply: beide Dateien werden ersetzt, beide Identitätsbegleiter bleiben unverändert. Prüfe jeden vorgegebenen Regionswert mit einem nicht angewandten Plan; der abschließende Standardplan bleibt leer, ohne den Testwert anzuwenden.

  ```sh
  tofu state list
  tofu output -json routes
  cat fanout-plan.json
  tofu plan -input=false -detailed-exitcode -no-color
  ```
phrases.0: Ich habe die for_each-Schlüssel beibehalten und gleichzeitig die gemeinsam genutzten inputs
  korrigiert.
phrases.1: Ich habe jede Modulausgabe anhand ihrer Datei überprüft.
phrases.2: Ich habe stabile Adressen von ersetzten provider-Ressourcen unterschieden.
