title: Modul-Fanout
brief: 'Der lokale station module verteilt sich über zwei stabile Schlüssel, aber jede Instanz empfängt
  retired anstelle der gemeinsam genutzten "local.region"-Eingabe. Korrigieren Sie diese Eingabe, ohne
  Schlüssel, Dateipfade oder outputs zu ändern. Speichern Sie fanout-plan.json, bevor Sie sich bewerben.
  Inhaltsänderungen ersetzen bewusst local_file-Ressourcen, während die Adressen stabil bleiben. Verwenden
  Sie den offline provider.


  Questdateien in `~/quest` (einige erscheinen in späteren Phasen): `main.tf`, `modules/station/main.tf`,
  `original-addresses`, `fanout-plan.json`, `depot.txt`, `junction.txt`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Anfängliche Erfolgskriterien: Beide verschlüsselten module-Instanzen empfangen north, exportieren unterschiedliche
  reale Pfade und behalten Adressen; Das letzte plan ist leer.'
debrief: Gemeinsame Konfiguration und station identity verfügen jetzt über separate Modulverträge.
