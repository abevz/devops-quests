title: Distribución del módulo
brief: |-
  La entrega regional ya no cumple el contrato caller compartido. Recupera las salidas de ambas estaciones conservando sus identidades registradas.

  Trabaja en `~/quest` en la estación con `main.tf`, `modules/station/main.tf`, `modules/station/modules/notice/main.tf` y `region-cases.json`.

  **Requisitos:**

  - `fanout-plan.json` registra el contrato regional predeterminado para ambas direcciones originales de archivos y la entrada caller compartida.
  - `fanout-plan.json` registra exactamente dos sustituciones de archivos sin otros cambios administrados.
  - Ambas direcciones originales de archivos y las dos identidades permanentes de estaciones permanecen en state.
  - `depot.txt` cumple el contrato regional predeterminado.
  - `junction.txt` cumple el contrato regional predeterminado.
  - El output `routes` relaciona exactamente las dos estaciones del contrato con sus archivos administrados.
  - OpenTofu no indica cambios de infraestructura pendientes.
  - Los dos valores caller suministrados atraviesan la frontera anidada hasta ambos archivos administrados; copiar la constante predeterminada no cumple el contrato.
  - Los únicos objetos administrados son los dos archivos de rutas originales y sus dos acompañantes de identidad originales. Los acompañantes no cambian en el plan guardado ni en los planes de entradas alternativas.
  - Conserva intacta la evidencia de direcciones. El plan, `depot.txt` y `junction.txt` están en `~/quest` en la estación.

  Las comprobaciones inspeccionan state actual, artefactos conservados y planes sin aplicar; no demuestran qué plan exacto se aplicó ni todo el historial de comandos.
debrief: 'El fan-out raíz no bastaba: también había que construir la interfaz anidada. Las sustituciones
  guardadas y los planes alternativos demuestran propagación con identidades y direcciones originales
  conservadas.'
