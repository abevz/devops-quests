title: Distribución del módulo
brief: 'El station module local se distribuye en dos claves estables, pero cada instancia recibe retired
  en lugar de la entrada compartida local.region. Corrija esa entrada sin cambiar claves, rutas de archivos
  o outputs. Guarde fanout-plan.json antes de presentar la solicitud. Los cambios de contenido reemplazan
  deliberadamente los recursos local_file mientras las direcciones permanecen estables. Utilice el offline
  provider.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `main.tf`, `modules/station/main.tf`,
  `original-addresses`, `fanout-plan.json`, `depot.txt`, `junction.txt`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.'
debrief: La configuración compartida y station identity ahora tienen contratos de módulo separados.
stages.0.brief: Cambie sólo esta bahía.
stages.0.objectives.0.text: '`fanout-plan.json` registra la entrada compartida corregida para ambas instancias
  del módulo station.'
stages.0.objectives.1.text: '`fanout-plan.json` registra exactamente dos sustituciones de recursos.'
stages.0.objectives.2.text: El state conserva las direcciones originales `module.station["depot"].local_file.route`
  / `module.station["junction"].local_file.route`.
stages.0.objectives.3.text: '`depot.txt` contiene `north:depot`.'
stages.0.objectives.4.text: '`junction.txt` contiene `north:junction`.'
stages.0.objectives.5.text: El output `routes` asocia `depot` con `depot.txt` y `junction` con `junction.txt`,
  sin entradas adicionales.
stages.0.objectives.6.text: '`tofu plan` termina con código 0 sin cambios.'
hints.0.text: Separe el inputs compartido del each.key identity.
hints.1.text: La salida de un mapa debe conservar las claves station.
hints.2.text: Pase los reemplazos de local.region, inspect y aplique el plan guardado.
phrases.0: Conservé las claves for_each mientras corregía el inputs compartido.
phrases.1: Verifiqué la salida de cada módulo con su archivo.
phrases.2: Distinguí direcciones estables de recursos provider reemplazados.
