title: Distribución del módulo
brief: |-
  La ruta regional está desactualizada en ambas instancias de módulo. Sus direcciones existentes y rutas de salida deben mantenerse.

  Trabaja en `~/quest` en la workstation. Archivos de entrada suministrados: `main.tf`, `modules/station/main.tf`.

  **Requisitos:**
  - En `~/quest` en la workstation, `fanout-plan.json` documenta:
    - La configuración registra el contrato regional solicitado para ambas instancias de módulo suministradas.
    - Exactamente `2` sustituciones de recursos.
  - Las dos direcciones originales de las instancias de módulo permanecen en el estado de OpenTofu.
  - Archivos en `~/quest` en la workstation:
    - `depot.txt`: `north:depot`
    - `junction.txt`: `north:junction`
  - La salida `routes` contiene solo estas correspondencias de estaciones a archivos:
    - `depot`: `./depot.txt`
    - `junction`: `./junction.txt`
  - OpenTofu informa de que no hay cambios de infraestructura pendientes.

  Las direcciones estables del estado no demuestran que los archivos subyacentes no hayan cambiado.
debrief: La configuración compartida y station identity ahora tienen contratos de módulo separados.
stages.0.brief: Conserva ambas direcciones de estación y publica las rutas requeridas con un plan del
  cambio guardado.
stages.0.objectives.0.text: El archivo `fanout-plan.json` de la workstation registra el contrato regional
  solicitado para ambas instancias de módulo suministradas.
stages.0.objectives.1.text: '`fanout-plan.json` registra exactamente dos sustituciones de recursos.'
stages.0.objectives.2.text: Las dos direcciones originales de las instancias de módulo permanecen en el
  estado de OpenTofu.
stages.0.objectives.3.text: '`depot.txt` contiene `north:depot`.'
stages.0.objectives.4.text: '`junction.txt` contiene `north:junction`.'
stages.0.objectives.5.text: El output `routes` asocia `depot` con `depot.txt` y `junction` con `junction.txt`,
  sin entradas adicionales.
stages.0.objectives.6.text: OpenTofu informa de que no hay cambios de infraestructura pendientes.
hints.0.text: Separa las entradas compartidas de la identidad determinada por each.key.
hints.1.text: |-
  La salida de un mapa debe conservar las claves station. El cambio de contenido sustituye recursos de archivo; las direcciones estables en el estado no implican que los archivos subyacentes no cambien.

  Inspecciona la configuración suministrada y las observaciones actuales en la workstation:

  ```sh
  cat main.tf modules/station/main.tf
  tofu state list
  ```
hints.2.text: |-
  Cada instancia recibe actualmente retired en lugar de la entrada compartida local.region. Pasa local.region, guarda fanout-plan.json antes de aplicar, revisa las sustituciones y aplica el plan guardado.

  Verifica el resultado desde `~/quest` en la workstation:

  Ejecuta estos comandos de observación desde `~/quest` en la workstation.
  - `cat fanout-plan.json` — Se espera que el plan guardado muestre la entrada compartida corregida de las estaciones y exactamente dos sustituciones.
  - Se espera que el estado coincida con la lista original de direcciones; los contenidos y las dos rutas de salida coinciden con Requisitos.

    ```sh
    tofu state list
    cat original-addresses depot.txt junction.txt
    tofu output -json routes
    ```
  - `tofu plan -input=false -detailed-exitcode -no-color` — Se esperan ausencia de cambios y código de salida `0`.
phrases.0: Conservé las claves for_each mientras corregía el inputs compartido.
phrases.1: Verifiqué la salida de cada módulo con su archivo.
phrases.2: Distinguí direcciones estables de recursos provider reemplazados.
