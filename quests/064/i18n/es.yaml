title: Distribución del módulo
brief: |
  Ambas instancias de estación deben publicar la ruta regional actual. Conserva sus identidades y rutas de salida, junto con un plan revisable del cambio.

  Trabaja en `~/quest` en la workstation. Archivos de entrada suministrados: `main.tf`, `modules/station/main.tf`, `original-addresses`.

  **Requisitos:**
  - En `~/quest` en la workstation, `fanout-plan.json` documenta:
    - El plan guardado refleja la entrada compartida corregida de ambas instancias del módulo de estación y exactamente dos sustituciones de recursos.
  - El estado conserva las direcciones originales de `~/quest/original-addresses` en la workstation:
    - `module.station["depot"].local_file.route`
    - `module.station["junction"].local_file.route`
  - Archivos en `~/quest` en la workstation:
    - `depot.txt`: `north:depot`
    - `junction.txt`: `north:junction`
  - La salida `routes` contiene solo estas correspondencias de estaciones a archivos:
    - `depot`: `./depot.txt`
    - `junction`: `./junction.txt`
  - `tofu plan` termina con código `0` sin cambios.

  **Verifica antes de Check & finish:**
  Ejecuta estos comandos de observación desde `~/quest` en la workstation.
  - `cat fanout-plan.json` — Se espera que el plan guardado muestre la entrada compartida corregida de las estaciones y exactamente dos sustituciones.
  - Se espera que el estado coincida con la lista original de direcciones; los contenidos y las dos rutas de salida coinciden con Requisitos.

    ```sh
    tofu state list
    cat original-addresses depot.txt junction.txt
    tofu output -json routes
    ```
  - `tofu plan -input=false -detailed-exitcode -no-color` — Se esperan ausencia de cambios y código de salida `0`.

  El cambio de contenido sustituye recursos de archivo; las direcciones estables en el estado no implican que los archivos subyacentes no cambien.
debrief: La configuración compartida y station identity ahora tienen contratos de módulo separados.
stages.0.brief: |
  Conserva ambas direcciones de estación y publica las rutas requeridas con un plan del cambio guardado.
