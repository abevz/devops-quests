title: Distribución del módulo
brief: |-
  La entrega regional ya no cumple el contrato caller compartido. Recupera las salidas de ambas estaciones conservando sus identidades registradas.

  Trabaja en `~/quest` en la estación con `main.tf`, `modules/station/main.tf`, `modules/station/modules/notice/main.tf` y `region-cases.json`.

  **Requisitos:**

  - `fanout-plan.json` registra el contrato regional predeterminado para ambas direcciones originales de archivos y la entrada caller compartida.
  - `fanout-plan.json` registra exactamente dos sustituciones de archivos sin otros cambios administrados.
  - Ambas direcciones originales de archivos y las dos identidades permanentes de estaciones permanecen en state.
  - `depot.txt` cumple el contrato regional predeterminado.
  - `junction.txt` cumple el contrato regional predeterminado.
  - El output `routes` relaciona exactamente las dos estaciones del contrato con sus archivos administrados.
  - OpenTofu no indica cambios de infraestructura pendientes.
  - Los dos valores caller suministrados atraviesan la frontera anidada hasta ambos archivos administrados; copiar la constante predeterminada no cumple el contrato.
  - Los únicos objetos administrados son los dos archivos de rutas originales y sus dos acompañantes de identidad originales. Los acompañantes no cambian en el plan guardado ni en los planes de entradas alternativas.
  - Conserva intacta la evidencia de direcciones. El plan, `depot.txt` y `junction.txt` están en `~/quest` en la estación.

  Las comprobaciones inspeccionan state actual, artefactos conservados y planes sin aplicar; no demuestran qué plan exacto se aplicó ni todo el historial de comandos.
debrief: 'El fan-out raíz no bastaba: también había que construir la interfaz anidada. Las sustituciones
  guardadas y los planes alternativos demuestran propagación con identidades y direcciones originales
  conservadas.'
stages.0.brief: Recupera el contrato fan-out anidado conservando ambas identidades de estaciones.
stages.0.objectives.0.text: '`fanout-plan.json` registra el contrato regional predeterminado para ambas
  direcciones originales de archivos y la entrada caller compartida.'
stages.0.objectives.1.text: '`fanout-plan.json` registra exactamente dos sustituciones de archivos sin
  otros cambios administrados.'
stages.0.objectives.2.text: Ambas direcciones originales de archivos y las dos identidades permanentes
  de estaciones permanecen en state.
stages.0.objectives.3.text: '`depot.txt` cumple el contrato regional predeterminado.'
stages.0.objectives.4.text: '`junction.txt` cumple el contrato regional predeterminado.'
stages.0.objectives.5.text: El output `routes` relaciona exactamente las dos estaciones del contrato con
  sus archivos administrados.
stages.0.objectives.6.text: OpenTofu no indica cambios de infraestructura pendientes.
hints.0.text: Una clave de instancia (`each.key`) representa identidad, mientras una entrada compartida
  representa datos. Un módulo anidado añade otra interfaz que debe transmitir el mismo valor caller.
hints.1.text: |-
  Compara la llamada raíz, el wrapper incompleto, la implementación anidada y el state registrado. Los errores de validación y las direcciones originales identifican la frontera que falta construir.

  Sigue la entrada de región desde la llamada raíz, a través del módulo envoltorio, hasta el módulo anidado. Compara cada dirección original con la acción planificada para el archivo de ruta y su recurso de identidad.

  ```sh
  tofu validate -no-color
  tofu state list
  cat main.tf modules/station/main.tf modules/station/modules/notice/main.tf
  cat region-cases.json
  ```
hints.2.text: |-
  Guarda el plan predeterminado antes de aplicarlo: ambos archivos se sustituyen y ambos acompañantes permanecen iguales. Prueba cada región mediante un plan sin aplicar; termina con el plan predeterminado vacío sin aplicar el valor de prueba.

  ```sh
  tofu state list
  tofu output -json routes
  cat fanout-plan.json
  tofu plan -input=false -detailed-exitcode -no-color
  ```
phrases.0: Conservé las claves for_each mientras corregía el inputs compartido.
phrases.1: Verifiqué la salida de cada módulo con su archivo.
phrases.2: Distinguí direcciones estables de recursos provider reemplazados.
diagnostics.probe_0_0: El plan guardado no enlaza ambos archivos originales a north por local.region o no pudo leerse; fanout-plan.json ausente/obsoleto, región fija o interfaz de módulo rota pueden explicarlo. [Causa y comprobación](guides#guide=terraform-7.1&section=fanout-saved-default-contract)
diagnostics.fanout_contract: Una llamada regional suministrada no pudo planificarse, no llegó a ambos archivos originales o cambió una identidad vinculada; entrada/llamada hija ausente, literal predeterminado, objeto alterado o datos protegidos/plan ilegibles pueden explicarlo. [Causa y comprobación](guides#guide=terraform-7.1&section=fanout-alternate-caller-plans)
diagnostics.probe_0_1: El plan guardado no reemplaza exactamente ambos archivos originales con solo no-op/read para los demás, o es ilegible; otro plan tras apply, claves de instancia cambiadas o cambios extra lo invalidan. [Causa y comprobación](guides#guide=terraform-7.1&section=fanout-retained-replacement-plan)
diagnostics.probe_0_2: El estado actual no contiene ambas direcciones registradas o su evidencia es ilegible; claves for_each cambiadas, recursos anidados eliminados, lista editada o fallo de observación puede perder instancias requeridas. [Causa y comprobación](guides#guide=terraform-7.1&section=fanout-current-file-addresses)
diagnostics.fanout_identity: El recibo de direcciones o conjunto gestionado exacto difiere de originales protegidos, una identidad cambió ID/tipo o no se leyó evidencia; recrear objetos vinculados o conservar recursos extra rompe continuidad. [Causa y comprobación](guides#guide=terraform-7.1&section=fanout-preserved-companion-set)
diagnostics.probe_0_5: La salida routes no resuelve exactamente depot y junction a sus archivos existentes o falló observar; claves distintas/ausentes, rutas exportadas incorrectas o archivos ausentes pueden explicarlo. [Causa y comprobación](guides#guide=terraform-7.1&section=fanout-output-file-targets)
diagnostics.fanout_plan: El plan predeterminado actual no terminó con 0; entradas reparadas pueden necesitar apply, archivos/salidas presentar drift o interfaces incompletas/inicio del proveedor impedir un plan válido. [Causa y comprobación](guides#guide=terraform-7.1&section=fanout-default-no-change-plan)
diagnostics.fanout_depot: depot.txt no proporciona north:depot o no puede leerse; región retired suministrada, propagación incompleta o plan corregido sin aplicar deja el archivo obsoleto. [Causa y comprobación](guides#guide=terraform-7.1&section=fanout-depot-file)
diagnostics.fanout_junction: junction.txt no proporciona north:junction o no puede leerse; región retired suministrada, propagación incompleta o plan corregido sin aplicar deja el archivo obsoleto. [Causa y comprobación](guides#guide=terraform-7.1&section=fanout-junction-file)
