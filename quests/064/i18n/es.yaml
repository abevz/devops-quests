hints.0.text: Una clave de instancia (`each.key`) representa identidad, mientras una entrada compartida
  representa datos. Un módulo anidado añade otra interfaz que debe transmitir el mismo valor caller.
hints.1.text: |-
  Compara la llamada raíz, el wrapper incompleto, la implementación anidada y el state registrado. Los errores de validación y las direcciones originales identifican la frontera que falta construir.

  ```sh
  tofu validate -no-color
  tofu state list
  cat main.tf modules/station/main.tf modules/station/modules/notice/main.tf
  ```
hints.2.text: |-
  Reconstruye la entrada del wrapper y la llamada hija, y transmite la entrada caller por ambos niveles. Guarda el plan predeterminado antes de aplicarlo: ambos archivos se sustituyen y ambos acompañantes permanecen iguales. Prueba cada región mediante un plan sin aplicar; termina con el plan predeterminado vacío sin aplicar el valor de prueba.

  ```sh
  tofu state list
  tofu output -json routes
  cat fanout-plan.json
  tofu plan -input=false -detailed-exitcode -no-color
  ```
phrases.0: Conservé las claves for_each mientras corregía el inputs compartido.
phrases.1: Verifiqué la salida de cada módulo con su archivo.
phrases.2: Distinguí direcciones estables de recursos provider reemplazados.
