title: Несколько экземпляров модуля
brief: |
  Оба экземпляра станции должны публиковать актуальный региональный маршрут. Сохраните их идентичности и выходные пути вместе с планом изменения для проверки.

  Работайте в `~/quest` на workstation. Предоставленные входные файлы: `main.tf`, `modules/station/main.tf`, `original-addresses`.

  **Требования:**
  - В `~/quest` на workstation файл `fanout-plan.json` содержит:
    - Сохранённый план отражает исправленные общие входные данные обоих экземпляров модуля станции и ровно две замены ресурсов.
  - State сохраняет исходные адреса из `~/quest/original-addresses` на workstation:
    - `module.station["depot"].local_file.route`
    - `module.station["junction"].local_file.route`
  - Файлы в `~/quest` на workstation:
    - `depot.txt`: `north:depot`
    - `junction.txt`: `north:junction`
  - Выходное значение `routes` содержит только следующие соответствия станций файлам:
    - `depot`: `./depot.txt`
    - `junction`: `./junction.txt`
  - `tofu plan` завершается с кодом `0` без изменений.

  **Проверьте самостоятельно перед Check & finish:**
  Выполняйте эти команды наблюдения из `~/quest` на workstation.
  - `cat fanout-plan.json` — Ожидается, что сохранённый план показывает исправленные общие входные данные станций и ровно две замены.
  - Ожидается совпадение state с исходным списком адресов; содержимое файлов и два выходных пути соответствуют требованиям.

    ```sh
    tofu state list
    cat original-addresses depot.txt junction.txt
    tofu output -json routes
    ```
  - `tofu plan -input=false -detailed-exitcode -no-color` — Ожидаются отсутствие изменений и код завершения `0`.

  Изменение содержимого заменяет файловые ресурсы; стабильные адреса в state не означают неизменности самих файлов.
debrief: Общая конфигурация и identity станции разделены контрактом модуля.
stages.0.brief: |
  Сохраните оба адреса станций и опубликуйте требуемые маршруты вместе с сохранённым планом изменения.
stages.0.objectives.0.text: '`fanout-plan.json` содержит исправленное общее входное значение для обоих
  экземпляров модуля station.'
stages.0.objectives.1.text: '`fanout-plan.json` содержит ровно две замены ресурсов.'
stages.0.objectives.2.text: State сохраняет исходные адреса `module.station["depot"].local_file.route`
  / `module.station["junction"].local_file.route`.
stages.0.objectives.3.text: '`depot.txt` содержит `north:depot`.'
stages.0.objectives.4.text: '`junction.txt` содержит `north:junction`.'
stages.0.objectives.5.text: Output `routes` сопоставляет `depot` с `depot.txt`, а `junction` с `junction.txt`,
  без дополнительных записей.
stages.0.objectives.6.text: '`tofu plan` завершается с кодом 0 без изменений.'
hints.0.text: Разделите общие inputs и identity each.key.
hints.1.text: Map output должен сохранять ключи станций.
hints.2.text: |
  Каждый экземпляр сейчас получает retired вместо общего входного значения local.region. Передайте local.region, сохраните fanout-plan.json перед применением, проверьте замены и примените сохранённый план.
phrases.0: Я сохранил ключи for_each, исправляя общие inputs.
phrases.1: Я сверил output каждого модуля с его файлом.
phrases.2: Я различал постоянные адреса и заменяемые ресурсы provider.
