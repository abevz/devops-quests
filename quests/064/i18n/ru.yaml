title: Несколько экземпляров модуля
brief: |-
  Региональный маршрут устарел для обоих экземпляров модуля. Их существующие адреса и пути выходных файлов должны остаться прежними.

  Работайте в `~/quest` на workstation. Предоставленные входные файлы: `main.tf`, `modules/station/main.tf`.

  **Требования:**
  - В `~/quest` на workstation файл `fanout-plan.json` содержит:
    - Оба предоставленных экземпляра модуля получают регион из существующего общего входного значения.
    - Конфигурация отражает требуемый региональный контракт для обоих предоставленных экземпляров модуля.
    - Ровно `2` замены ресурсов.
  - Оба исходных адреса экземпляров модуля сохраняются в state OpenTofu.
  - Файлы в `~/quest` на workstation:
    - `depot.txt`: `north:depot`
    - `junction.txt`: `north:junction`
  - Выходное значение `routes` содержит только следующие соответствия станций файлам:
    - `depot`: `./depot.txt`
    - `junction`: `./junction.txt`
  - OpenTofu сообщает об отсутствии ожидающих изменений инфраструктуры.

  Стабильные адреса state не доказывают неизменность самих файлов.
debrief: Общая конфигурация и identity станции разделены контрактом модуля.
stages.0.brief: Сохраните оба адреса станций и опубликуйте требуемые маршруты вместе с сохранённым планом
  изменения.
stages.0.objectives.0.text: |-
  `fanout-plan.json` фиксирует требуемый региональный контракт обоих предоставленных экземпляров модуля; их регион получается из существующего общего входного значения.
stages.0.objectives.1.text: '`fanout-plan.json` содержит ровно две замены ресурсов.'
stages.0.objectives.2.text: Оба исходных адреса экземпляров модуля сохраняются в state OpenTofu.
stages.0.objectives.3.text: '`depot.txt` содержит `north:depot`.'
stages.0.objectives.4.text: '`junction.txt` содержит `north:junction`.'
stages.0.objectives.5.text: Output `routes` сопоставляет `depot` с `depot.txt`, а `junction` с `junction.txt`,
  без дополнительных записей.
stages.0.objectives.6.text: OpenTofu сообщает об отсутствии ожидающих изменений инфраструктуры.
hints.0.text: Отделите общие входные данные от идентичности, задаваемой each.key.
hints.1.text: |-
  Map output должен сохранять ключи станций. Изменение содержимого заменяет файловые ресурсы; стабильные адреса в state не означают неизменности самих файлов.

  Изучите предоставленную конфигурацию и текущие наблюдения на workstation:

  ```sh
  cat main.tf modules/station/main.tf
  tofu state list
  ```
hints.2.text: |-
  Каждый экземпляр сейчас получает retired вместо общего входного значения local.region. Передайте local.region, сохраните fanout-plan.json перед применением, проверьте замены и примените сохранённый план.

  Проверьте результат из `~/quest` на workstation:

  Выполняйте эти команды наблюдения из `~/quest` на workstation.
  - `cat fanout-plan.json` — Ожидается, что сохранённый план показывает исправленные общие входные данные станций и ровно две замены.
  - Ожидается совпадение state с исходным списком адресов; содержимое файлов и два выходных пути соответствуют требованиям.

    ```sh
    tofu state list
    cat original-addresses depot.txt junction.txt
    tofu output -json routes
    ```
  - `tofu plan -input=false -detailed-exitcode -no-color` — Ожидаются отсутствие изменений и код завершения `0`.
phrases.0: Я сохранил ключи for_each, исправляя общие inputs.
phrases.1: Я сверил output каждого модуля с его файлом.
phrases.2: Я различал постоянные адреса и заменяемые ресурсы provider.
