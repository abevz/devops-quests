title: Несколько экземпляров модуля
brief: 'Локальный station module создаётся для двух постоянных ключей, но каждый экземпляр получает retired
  вместо общего local.region. Исправьте input, сохранив ключи, пути файлов и outputs. Сохраните fanout-plan.json
  до apply. Смена содержимого намеренно заменяет local_file, но адреса остаются постоянными. Используйте
  offline provider.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `main.tf`, `modules/station/main.tf`,
  `original-addresses`, `fanout-plan.json`, `depot.txt`, `junction.txt`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Оба экземпляра с постоянными ключами получают north, выдают разные реальные пути
  и сохраняют адреса; итоговый plan пуст.'
debrief: Общая конфигурация и identity станции разделены контрактом модуля.
stages.0.brief: 'Оба экземпляра с постоянными ключами получают north, выдают разные реальные пути и сохраняют
  адреса; итоговый plan пуст.


  Результат проверки: Оба экземпляра с постоянными ключами получают north, выдают разные реальные пути
  и сохраняют адреса; итоговый plan пуст.'
stages.0.objectives.0.text: Оба экземпляра с постоянными ключами получают north, выдают разные реальные
