hints.0.text: Ключ экземпляра (`each.key`) задаёт идентичность, а общий вход передаёт данные. Вложенный
  модуль добавляет ещё один интерфейс, через который должно пройти то же значение caller.
hints.1.text: |-
  Сопоставьте корневой вызов, незавершённую обёртку, вложенную реализацию и записанный state. Ошибки validate и исходные адреса показывают границу, которую нужно построить.

  ```sh
  tofu validate -no-color
  tofu state list
  cat main.tf modules/station/main.tf modules/station/modules/notice/main.tf
  ```
hints.2.text: |-
  Восстановите вход обёртки и дочерний вызов, затем передайте вход caller через оба уровня. До apply сохраните план по умолчанию: оба файла заменяются, оба спутника идентичности не меняются. Проверьте каждый заданный регион планом без применения; завершите пустым планом по умолчанию, не применяя пробный вход.

  ```sh
  tofu state list
  tofu output -json routes
  cat fanout-plan.json
  tofu plan -input=false -detailed-exitcode -no-color
  ```
phrases.0: Я сохранил ключи for_each, исправляя общие inputs.
phrases.1: Я сверил output каждого модуля с его файлом.
phrases.2: Я различал постоянные адреса и заменяемые ресурсы provider.
diagnostics.probe_0_0: 'Сохранённый план не связывает оба исходных файла с north через local.region либо данные не читаются: причиной могут быть отсутствующий или старый fanout-plan.json, захардкоженный регион или нарушенный интерфейс модуля. [Причина и проверка](guides#guide=terraform-7.1&section=fanout-saved-default-contract)'
diagnostics.fanout_contract: 'Выданный региональный вызов не строит план, не достигает обоих исходных файлов станций или меняет связанную идентичность: отсутствующий вход или дочерний вызов, literal по умолчанию, изменённый связанный объект или нечитаемые данные могут быть причиной. [Причина и проверка](guides#guide=terraform-7.1&section=fanout-alternate-caller-plans)'
diagnostics.probe_0_1: 'Сохранённый план не заменяет ровно оба исходных файла с только no-op/read для остальных либо не читается: новый план после apply, другие ключи экземпляров или посторонние изменения нарушают условие. [Причина и проверка](guides#guide=terraform-7.1&section=fanout-retained-replacement-plan)'
diagnostics.probe_0_2: 'Текущее состояние не содержит оба записанных адреса файлов либо данные не прочитаны: другие ключи for_each, удалённые вложенные ресурсы, изменённый список адресов или сбой наблюдения state теряют нужные экземпляры. [Причина и проверка](guides#guide=terraform-7.1&section=fanout-current-file-addresses)'
diagnostics.fanout_identity: 'Запись адресов или точный набор управляемых объектов отличается от замороженного исходного, связанная идентичность сменила ID или тип либо данные не прочитаны: пересоздание или лишние объекты нарушают непрерывность. [Причина и проверка](guides#guide=terraform-7.1&section=fanout-preserved-companion-set)'
diagnostics.probe_0_5: 'Выход routes не разрешает ровно depot и junction в существующие файлы либо наблюдение выхода и путей не удалось: причиной могут быть другие или отсутствующие ключи, неверные экспортируемые пути либо отсутствующие файлы. [Причина и проверка](guides#guide=terraform-7.1&section=fanout-output-file-targets)'
diagnostics.fanout_plan: 'Текущий план по умолчанию не вернул 0: исправленные входы ещё требуют apply, файлы и выходы разошлись либо неполный интерфейс и сбой провайдера мешают плану. [Причина и проверка](guides#guide=terraform-7.1&section=fanout-default-no-change-plan)'
diagnostics.fanout_depot: 'depot.txt не предоставляет north:depot либо не читается: выданный регион retired, неполная передача значения или неприменённый исправленный план оставляют устаревший файл. [Причина и проверка](guides#guide=terraform-7.1&section=fanout-depot-file)'
diagnostics.fanout_junction: 'junction.txt не предоставляет north:junction либо не читается: выданный регион retired, неполная передача значения или неприменённый исправленный план оставляют устаревший файл. [Причина и проверка](guides#guide=terraform-7.1&section=fanout-junction-file)'
