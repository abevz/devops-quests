title: Несколько экземпляров модуля
brief: |-
  Региональная доставка больше не соответствует общему контракту caller. Восстановите выходы обеих станций, сохранив записанные идентификаторы.

  Работайте в `~/quest` на рабочей станции с `main.tf`, `modules/station/main.tf`, `modules/station/modules/notice/main.tf` и `region-cases.json`.

  **Требования:**

  - `fanout-plan.json` отражает региональный контракт по умолчанию для обоих исходных адресов файлов и общего входа caller.
  - `fanout-plan.json` содержит ровно две замены файлов без других изменений управляемых объектов.
  - Оба исходных адреса файлов и два постоянных идентификатора станций сохранены в state.
  - `depot.txt` соответствует региональному контракту по умолчанию.
  - `junction.txt` соответствует региональному контракту по умолчанию.
  - Output `routes` сопоставляет ровно две станции контракта с их управляемыми файлами.
  - OpenTofu не сообщает об ожидающих изменениях инфраструктуры.
  - Оба заданных значения caller проходят через вложенную границу модулей к обоим управляемым файлам; копии значения по умолчанию недостаточно.
  - Единственные управляемые объекты — два исходных маршрутных файла и два исходных спутника идентичности. Спутники не меняются ни в сохранённом плане, ни в планах для другого входа.
  - Сохраните исходные данные адресов без изменений. Артефакт плана, `depot.txt` и `junction.txt` находятся в `~/quest` на рабочей станции.

  Проверки анализируют текущее состояние, сохранённые артефакты и планы без применения; они не доказывают, какой именно план применялся, или полную историю команд.
debrief: 'Одного корневого fan-out было недостаточно: требовалось построить и вложенный интерфейс. План
  замен и планы для других входов подтверждают передачу данных при сохранённых идентификаторах и исходных
  адресах.'
