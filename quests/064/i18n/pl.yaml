title: Wyjście modułu
brief: 'Lokalny station module rozdziela się na dwa stabilne klucze, ale każda instancja otrzymuje retired
  zamiast współdzielonego local.region input. Popraw input bez zmiany kluczy, ścieżek plików lub outputs.
  Zapisz fanout-plan.json przed zastosowaniem. Zmiany zawartości celowo zastępują zasoby local_file, podczas
  gdy adresy pozostają stabilne. Użyj offline provider.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `main.tf`, `modules/station/main.tf`,
  `original-addresses`, `fanout-plan.json`, `depot.txt`, `junction.txt`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.'
debrief: Współdzielona konfiguracja i station identity mają teraz osobne umowy na moduły.
stages.0.brief: Zmień tylko tę zatokę.
stages.0.objectives.0.text: '`fanout-plan.json` zapisuje poprawioną wspólną wartość wejściową dla obu
  instancji modułu station.'
stages.0.objectives.1.text: '`fanout-plan.json` zapisuje dokładnie dwie wymiany zasobów.'
stages.0.objectives.2.text: State zachowuje oryginalne adresy `module.station["depot"].local_file.route`
  / `module.station["junction"].local_file.route`.
stages.0.objectives.3.text: '`depot.txt` zawiera `north:depot`.'
stages.0.objectives.4.text: '`junction.txt` zawiera `north:junction`.'
stages.0.objectives.5.text: Output `routes` przypisuje `depot` do `depot.txt`, a `junction` do `junction.txt`,
  bez dodatkowych wpisów.
stages.0.objectives.6.text: '`tofu plan` kończy się kodem 0 bez zmian.'
hints.0.text: Oddziel współdzielone dane wejściowe od tożsamości each.key.
hints.1.text: Wynik mapy powinien zachować klucze station.
hints.2.text: Przekaż local.region, sprawdź zamienniki i zastosuj zapisane plan.
phrases.0: Zachowałem klucze for_each podczas poprawiania udostępnionego inputs.
phrases.1: Sprawdziłem każdy moduł output w jego pliku.
phrases.2: Odróżniłem adresy stabilne od zastąpionych zasobów provider.
