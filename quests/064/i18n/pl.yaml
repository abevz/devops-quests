title: Wyjście modułu
brief: |-
  Dostarczanie regionalne nie spełnia już wspólnego kontraktu caller. Odtwórz wyjścia obu stacji, zachowując zapisane tożsamości.

  Pracuj w `~/quest` na stacji roboczej z `main.tf`, `modules/station/main.tf`, `modules/station/modules/notice/main.tf` i `region-cases.json`.

  **Wymagania:**

  - `fanout-plan.json` zapisuje domyślny kontrakt regionalny dla obu pierwotnych adresów plików i wspólnego wejścia caller.
  - `fanout-plan.json` zapisuje dokładnie dwa zastąpienia plików bez innych zmian obiektów zarządzanych.
  - Oba pierwotne adresy plików i dwie trwałe tożsamości stacji pozostają w state.
  - `depot.txt` spełnia domyślny kontrakt regionalny.
  - `junction.txt` spełnia domyślny kontrakt regionalny.
  - Output `routes` przypisuje dokładnie dwie stacje kontraktu do zarządzanych plików.
  - OpenTofu nie zgłasza oczekujących zmian infrastruktury.
  - Obie dostarczone wartości caller przechodzą przez zagnieżdżoną granicę do obu zarządzanych plików; kopia domyślnej stałej nie spełnia kontraktu.
  - Jedyne obiekty zarządzane to dwa pierwotne pliki tras i ich dwa pierwotne obiekty tożsamości. Obiekty tożsamości nie zmieniają się w zapisanym planie ani w planach dla alternatywnych wejść.
  - Zachowaj dostarczone dane adresów bez zmian. Plan, `depot.txt` i `junction.txt` znajdują się w `~/quest` na stacji roboczej.

  Kontrole badają bieżący state, zachowane artefakty i plany bez zastosowania; nie dowodzą zastosowania konkretnego planu ani pełnej historii poleceń.
debrief: 'Sam główny fan-out nie wystarczał: należało zbudować także zagnieżdżony interfejs. Zapisane
  zastąpienia i plany dla innych wejść dowodzą propagacji przy zachowanych tożsamościach i adresach.'
stages.0.brief: Odtwórz zagnieżdżony kontrakt fan-out, zachowując tożsamości obu stacji.
stages.0.objectives.0.text: '`fanout-plan.json` zapisuje domyślny kontrakt regionalny dla obu pierwotnych
  adresów plików i wspólnego wejścia caller.'
stages.0.objectives.1.text: '`fanout-plan.json` zapisuje dokładnie dwa zastąpienia plików bez innych zmian
  obiektów zarządzanych.'
stages.0.objectives.2.text: Oba pierwotne adresy plików i dwie trwałe tożsamości stacji pozostają w state.
stages.0.objectives.3.text: '`depot.txt` spełnia domyślny kontrakt regionalny.'
stages.0.objectives.4.text: '`junction.txt` spełnia domyślny kontrakt regionalny.'
stages.0.objectives.5.text: Output `routes` przypisuje dokładnie dwie stacje kontraktu do zarządzanych
  plików.
stages.0.objectives.6.text: OpenTofu nie zgłasza oczekujących zmian infrastruktury.
hints.0.text: Klucz instancji (`each.key`) niesie tożsamość, a wspólne wejście dane. Zagnieżdżony moduł
  dodaje interfejs, który musi przekazać tę samą wartość caller.
hints.1.text: |-
  Porównaj wywołanie główne, niekompletny wrapper, zagnieżdżoną implementację i zapisany state. Błędy validate i pierwotne adresy wskazują granicę do zbudowania.

  ```sh
  tofu validate -no-color
  tofu state list
  cat main.tf modules/station/main.tf modules/station/modules/notice/main.tf
  ```
hints.2.text: |-
  Odtwórz wejście wrappera i wywołanie potomne, przekazując caller przez oba poziomy. Przed apply zapisz plan domyślny: oba pliki zostają zastąpione, a obiekty tożsamości nie zmieniają się. Sprawdź każdy region planem bez zastosowania; zakończ pustym planem domyślnym bez stosowania wartości próbnej.

  ```sh
  tofu state list
  tofu output -json routes
  cat fanout-plan.json
  tofu plan -input=false -detailed-exitcode -no-color
  ```
phrases.0: Zachowałem klucze for_each podczas poprawiania udostępnionego inputs.
phrases.1: Sprawdziłem każdy moduł output w jego pliku.
phrases.2: Odróżniłem adresy stabilne od zastąpionych zasobów provider.
diagnostics.probe_0_0: Zapisany plan nie łączy obu pierwotnych plików z north przez local.region lub dane są nieczytelne; brak/stary fanout-plan.json, stały region lub błędny interfejs modułu mogą to wyjaśniać. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=fanout-saved-default-contract)
diagnostics.fanout_contract: Dostarczone wywołanie regionalne nie tworzy planu, nie dociera do obu pierwotnych plików lub zmienia obiekt tożsamości; brak wejścia/wywołania podrzędnego, stała domyślna, zmieniony obiekt lub nieczytelne dane mogą to wyjaśniać. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=fanout-alternate-caller-plans)
diagnostics.probe_0_1: Zapisany plan nie wymienia dokładnie obu pierwotnych plików i wyłącznie no-op/read dla reszty lub jest nieczytelny; nowy plan po apply, inne klucze instancji lub dodatkowe zmiany naruszają warunek. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=fanout-retained-replacement-plan)
diagnostics.probe_0_2: Bieżący stan nie zawiera obu zapisanych adresów lub dane są nieczytelne; zmienione klucze for_each, usunięte zasoby podrzędne, zmieniona lista adresów lub błąd obserwacji stanu gubią wymagane instancje. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=fanout-current-file-addresses)
diagnostics.fanout_identity: Zapis adresów lub dokładny zestaw zarządzanych obiektów różni się od chronionych oryginałów, obiekt tożsamości zmienił ID/typ albo dane są nieczytelne; odtworzone lub dodatkowe obiekty naruszają ciągłość. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=fanout-preserved-companion-set)
diagnostics.probe_0_5: Wyjście routes nie rozwiązuje dokładnie depot i junction do istniejących plików lub obserwacja zawiodła; inne/brakujące klucze, błędne eksportowane ścieżki lub brak plików mogą to wyjaśniać. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=fanout-output-file-targets)
diagnostics.fanout_plan: Bieżący plan domyślny nie zwrócił 0; naprawione wejścia wymagają apply, pliki/wyjścia się różnią albo niepełny interfejs lub start providera blokuje plan. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=fanout-default-no-change-plan)
diagnostics.fanout_depot: depot.txt nie udostępnia north:depot lub jest nieczytelny; dostarczony region retired, niepełne przekazywanie lub niezastosowany poprawiony plan pozostawia stary plik. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=fanout-depot-file)
diagnostics.fanout_junction: junction.txt nie udostępnia north:junction lub jest nieczytelny; dostarczony region retired, niepełne przekazywanie lub niezastosowany poprawiony plan pozostawia stary plik. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=fanout-junction-file)
