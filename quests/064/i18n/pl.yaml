title: Wyjście modułu
brief: |-
  Trasa regionalna jest nieaktualna w obu instancjach modułu. Ich istniejące adresy i ścieżki wyjściowe muszą pozostać bez zmian.

  Pracuj w `~/quest` na workstation. Dostarczone pliki wejściowe: `main.tf`, `modules/station/main.tf`.

  **Wymagania:**
  - W `~/quest` na workstation plik `fanout-plan.json` zawiera:
    - Obie dostarczone instancje modułu pobierają region z istniejącej wspólnej wartości wejściowej.
    - Konfiguracja zapisuje wymagany kontrakt regionalny dla obu dostarczonych instancji modułu.
    - Dokładnie `2` wymiany zasobów.
  - Oba pierwotne adresy instancji modułu pozostają w stanie OpenTofu.
  - Pliki w `~/quest` na workstation:
    - `depot.txt`: `north:depot`
    - `junction.txt`: `north:junction`
  - Wynik `routes` zawiera wyłącznie następujące przypisania stacji do plików:
    - `depot`: `./depot.txt`
    - `junction`: `./junction.txt`
  - OpenTofu nie zgłasza oczekujących zmian infrastruktury.

  Stałe adresy w stanie nie dowodzą, że same pliki nie uległy zmianie.
debrief: Współdzielona konfiguracja i station identity mają teraz osobne umowy na moduły.
stages.0.brief: Zachowaj oba adresy stacji i opublikuj wymagane trasy wraz z zapisanym planem zmiany.
stages.0.objectives.0.text: |-
  `fanout-plan.json` zapisuje wymagany kontrakt regionalny obu dostarczonych instancji modułu; ich region pochodzi z istniejącej wspólnej wartości wejściowej.
stages.0.objectives.1.text: '`fanout-plan.json` zapisuje dokładnie dwie wymiany zasobów.'
stages.0.objectives.2.text: Oba pierwotne adresy instancji modułu pozostają w stanie OpenTofu.
stages.0.objectives.3.text: '`depot.txt` zawiera `north:depot`.'
stages.0.objectives.4.text: '`junction.txt` zawiera `north:junction`.'
stages.0.objectives.5.text: Output `routes` przypisuje `depot` do `depot.txt`, a `junction` do `junction.txt`,
  bez dodatkowych wpisów.
stages.0.objectives.6.text: OpenTofu nie zgłasza oczekujących zmian infrastruktury.
hints.0.text: Oddziel współdzielone dane wejściowe od tożsamości each.key.
hints.1.text: |-
  Wynik mapy powinien zachować klucze station. Zmiana zawartości powoduje zamianę zasobów plików; stałe adresy w stanie nie oznaczają niezmienności samych plików.

  Sprawdź dostarczoną konfigurację i bieżące obserwacje na workstation:

  ```sh
  cat main.tf modules/station/main.tf
  tofu state list
  ```
hints.2.text: |-
  Każda instancja otrzymuje obecnie retired zamiast wspólnego wejścia local.region. Przekaż local.region, zapisz fanout-plan.json przed zastosowaniem, sprawdź zamiany i zastosuj zapisany plan.

  Sprawdź wynik z `~/quest` na workstation:

  Wykonaj te polecenia obserwacyjne w `~/quest` na workstation.
  - `cat fanout-plan.json` — Oczekiwane: zapisany plan pokazuje poprawione wspólne dane wejściowe stacji i dokładnie dwie zamiany.
  - Oczekiwane: stan odpowiada oryginalnej liście adresów; zawartości plików i obie ścieżki wynikowe są zgodne z wymaganiami.

    ```sh
    tofu state list
    cat original-addresses depot.txt junction.txt
    tofu output -json routes
    ```
  - `tofu plan -input=false -detailed-exitcode -no-color` — Oczekiwane: brak zmian i kod zakończenia `0`.
phrases.0: Zachowałem klucze for_each podczas poprawiania udostępnionego inputs.
phrases.1: Sprawdziłem każdy moduł output w jego pliku.
phrases.2: Odróżniłem adresy stabilne od zastąpionych zasobów provider.
