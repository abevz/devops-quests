title: Wyjście modułu
brief: 'Lokalny station module rozdziela się na dwa stabilne klucze, ale każda instancja otrzymuje retired
  zamiast współdzielonego local.region input. Popraw input bez zmiany kluczy, ścieżek plików lub outputs.
  Zapisz fanout-plan.json przed zastosowaniem. Zmiany zawartości celowo zastępują zasoby local_file, podczas
  gdy adresy pozostają stabilne. Użyj offline provider.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `main.tf`, `modules/station/main.tf`,
  `original-addresses`, `fanout-plan.json`, `depot.txt`, `junction.txt`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: Obie instancje modułów z kluczem otrzymują north, eksportują różne rzeczywiste
  ścieżki i zachowują adresy; ostatni plan jest pusty.'
debrief: Współdzielona konfiguracja i station identity mają teraz osobne umowy na moduły.
