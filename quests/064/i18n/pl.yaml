hints.0.text: Oddziel współdzielone dane wejściowe od tożsamości each.key.
hints.1.text: Wynik mapy powinien zachować klucze station.
hints.2.text: Przekaż local.region, sprawdź zamienniki i zastosuj zapisane plan.
phrases.0: Zachowałem klucze for_each podczas poprawiania udostępnionego inputs.
phrases.1: Sprawdziłem każdy moduł output w jego pliku.
phrases.2: Odróżniłem adresy stabilne od zastąpionych zasobów provider.
