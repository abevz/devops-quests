title: Module fan-out
brief: 'The local station module fans out over two stable keys, but each instance
  receives retired instead of the shared local.region input. Correct that input without
  changing keys, file paths or outputs. Save fanout-plan.json before applying. Content
  changes deliberately replace local_file resources while addresses remain stable.
  Use the offline provider.


  Quest files in `~/quest` (some appear in later stages): `main.tf`, `modules/station/main.tf`,
  `original-addresses`, `fanout-plan.json`, `depot.txt`, `junction.txt`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images
  and private services. Change only this bay.


  Initial success criteria: Both keyed module instances receive north, export distinct
  real paths and retain addresses; the final plan is empty.'
debrief: Shared configuration and station identity now have separate module contracts.
