title: Module fan-out
brief: 'The local station module fans out over two stable keys, but each instance receives retired instead
  of the shared local.region input. Correct that input without changing keys, file paths or outputs. Save
  fanout-plan.json before applying. Content changes deliberately replace local_file resources while addresses
  remain stable. Use the offline provider.


  Quest files in `~/quest` (some appear in later stages): `main.tf`, `modules/station/main.tf`, `original-addresses`,
  `fanout-plan.json`, `depot.txt`, `junction.txt`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.'
debrief: Shared configuration and station identity now have separate module contracts.
stages.0.brief: Change only this bay.
stages.0.objectives.0.text: '`fanout-plan.json` records the corrected shared input for both station module
  instances.'
stages.0.objectives.1.text: '`fanout-plan.json` records exactly two resource replacements.'
stages.0.objectives.2.text: The state keeps the original addresses `module.station["depot"].local_file.route`
  / `module.station["junction"].local_file.route`.
stages.0.objectives.3.text: '`depot.txt` contains `north:depot`.'
stages.0.objectives.4.text: '`junction.txt` contains `north:junction`.'
stages.0.objectives.5.text: Output `routes` maps `depot` to `depot.txt` and `junction` to `junction.txt`,
  with no extra entries.
stages.0.objectives.6.text: '`tofu plan` exits 0 with no changes.'
hints.0.text: Separate shared inputs from each.key identity.
hints.1.text: A map output should retain station keys.
hints.2.text: Pass local.region, inspect replacements and apply the saved plan.
phrases.0: I preserved for_each keys while correcting shared inputs.
phrases.1: I checked every module output against its file.
phrases.2: I distinguished stable addresses from replaced provider resources.
