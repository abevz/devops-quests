title: Module fan-out
brief: |
  Both module instances must publish the current regional route. Preserve their identities and output paths while retaining a reviewable plan of the change.

  Work in `~/quest` on the workstation. Supplied inputs: `main.tf`, `modules/station/main.tf`, `original-addresses`.

  **Requirements:**
  - In `~/quest` on the workstation, `fanout-plan.json` records:
    - The saved plan records the corrected shared input for both module instances and exactly two resource replacements.
  - State retains the original addresses recorded in `~/quest/original-addresses` on the workstation:
    - `module.station["depot"].local_file.route`
    - `module.station["junction"].local_file.route`
  - Files in `~/quest` on the workstation:
    - `depot.txt`: `north:depot`
    - `junction.txt`: `north:junction`
  - Output `routes` contains only these key-to-file mappings:
    - `depot`: `./depot.txt`
    - `junction`: `./junction.txt`
  - `tofu plan` exits with code `0` and reports no changes.

  **Verify yourself before Check & finish:**
  Run these observation commands from `~/quest` on the workstation.
  - `cat fanout-plan.json` — Expected: the saved plan shows the corrected shared input and exactly two replacements.
  - Expected: state matches the original address list; file contents and the two output paths match Requirements.

    ```sh
    tofu state list
    cat original-addresses depot.txt junction.txt
    tofu output -json routes
    ```
  - `tofu plan -input=false -detailed-exitcode -no-color` — Expected: no changes, exit code `0`.

  The content change replaces file resources; stable state addresses do not mean the underlying files are unchanged.
debrief: Shared configuration and station identity now have separate module contracts.
