title: Module fan-out
brief: |-
  The regional route is outdated for both module instances. Their existing addresses and output paths must remain stable.

  Work in `~/quest` on the workstation. Supplied inputs: `main.tf`, `modules/station/main.tf`.

  **Requirements:**
  - In `~/quest` on the workstation, `fanout-plan.json` records:
    - Configuration records the requested regional contract for both supplied module instances.
    - Exactly `2` resource replacements.
  - Both original module-instance addresses remain in OpenTofu state.
  - Files in `~/quest` on the workstation:
    - `depot.txt`: `north:depot`
    - `junction.txt`: `north:junction`
  - Output `routes` contains only these key-to-file mappings:
    - `depot`: `./depot.txt`
    - `junction`: `./junction.txt`
  - OpenTofu reports no pending infrastructure changes.

  Stable state addresses do not prove that the underlying files are unchanged.
debrief: Shared configuration and station identity now have separate module contracts.
stages.0.brief: Preserve both module addresses and publish the required routes with a saved change plan.
stages.0.objectives.0.text: Workstation `fanout-plan.json` records the requested regional contract for
  both supplied module instances.
stages.0.objectives.1.text: '`fanout-plan.json` records exactly two resource replacements.'
stages.0.objectives.2.text: Both original module-instance addresses remain in OpenTofu state.
stages.0.objectives.3.text: '`depot.txt` contains `north:depot`.'
stages.0.objectives.4.text: '`junction.txt` contains `north:junction`.'
stages.0.objectives.5.text: Output `routes` maps `depot` to `depot.txt` and `junction` to `junction.txt`,
  with no extra entries.
stages.0.objectives.6.text: OpenTofu reports no pending infrastructure changes.
hints.0.text: Separate shared inputs from each.key identity.
hints.1.text: |-
  A map output should retain station keys. The content change replaces file resources; stable state addresses do not mean the underlying files are unchanged.

  Inspect the supplied configuration and live observations on the workstation:

  ```sh
  cat main.tf modules/station/main.tf
  tofu state list
  ```
hints.2.text: |-
  Each instance currently receives retired instead of the shared local.region input. Pass local.region, save fanout-plan.json before applying, inspect replacements and apply the saved plan.

  Verify the result from `~/quest` on the workstation:

  Run these observation commands from `~/quest` on the workstation.
  - `cat fanout-plan.json` — Expected: the saved plan shows the corrected shared input and exactly two replacements.
  - Expected: state matches the original address list; file contents and the two output paths match Requirements.

    ```sh
    tofu state list
    cat original-addresses depot.txt junction.txt
    tofu output -json routes
    ```
  - `tofu plan -input=false -detailed-exitcode -no-color` — Expected: no changes, exit code `0`.
phrases.0: I preserved for_each keys while correcting shared inputs.
phrases.1: I checked every module output against its file.
phrases.2: I distinguished stable addresses from replaced provider resources.
