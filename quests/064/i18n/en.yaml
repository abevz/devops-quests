title: Module fan-out
brief: |-
  Regional delivery no longer satisfies the shared caller contract. Restore both stations’ outputs while preserving their recorded identities.

  Work in `~/quest` on the workstation with `main.tf`, `modules/station/main.tf`, `modules/station/modules/notice/main.tf` and `region-cases.json`.

  **Requirements:**

  - `fanout-plan.json` records the default regional contract for both original file addresses and their shared caller input.
  - `fanout-plan.json` records exactly two file replacements and no other managed changes.
  - Both original file addresses and the two permanent instance identities remain in state.
  - `depot.txt` matches the default regional contract.
  - `junction.txt` matches the default regional contract.
  - Output `routes` resolves exactly the two contract stations to their managed files.
  - OpenTofu reports no pending infrastructure changes.
  - Both supplied caller values propagate through the nested module boundary to both managed files; copying a default literal does not satisfy the caller contract.
  - The only managed objects are the two original route files and their two original identity companions. The companions are unchanged in both the saved plan and alternate-input plans.
  - Keep the provided address evidence unchanged. The plan artifact, `depot.txt` and `junction.txt` are in `~/quest` on the workstation.

  Checks inspect current state, retained artifacts and read-only plans; they do not prove which exact plan was applied or the complete command history.
debrief: 'The root fan-out alone was insufficient: the nested module interface also had to be constructed.
  Saved replacements and alternate caller plans establish propagation while separate identities and original
  addresses remain intact.'
stages.0.brief: Restore the nested fan-out contract while retaining both instance identities.
stages.0.objectives.0.text: '`fanout-plan.json` records the default regional contract for both original
  file addresses and their shared caller input.'
stages.0.objectives.1.text: '`fanout-plan.json` records exactly two file replacements and no other managed
  changes.'
stages.0.objectives.2.text: Both original file addresses and the two permanent instance identities remain
  in state.
stages.0.objectives.3.text: '`depot.txt` matches the default regional contract.'
stages.0.objectives.4.text: '`junction.txt` matches the default regional contract.'
stages.0.objectives.5.text: Output `routes` resolves exactly the two contract stations to their managed
  files.
stages.0.objectives.6.text: OpenTofu reports no pending infrastructure changes.
hints.0.text: An instance key (`each.key`) carries identity while a shared input carries data. A nested
  module adds another interface that must forward the same caller value.
hints.1.text: |-
  Compare the root call, incomplete wrapper, nested implementation and recorded state. Validation errors and the original addresses identify which boundary must be reconstructed.

  ```sh
  tofu validate -no-color
  tofu state list
  cat main.tf modules/station/main.tf modules/station/modules/notice/main.tf
  ```
hints.2.text: |-
  Reconstruct the wrapper input and child call, then forward the caller input through both levels. Save the default plan before applying: both files are replaced, both identity companions stay unchanged. Verify every supplied region in a read-only plan; return to an empty default plan without applying the probe.

  ```sh
  tofu state list
  tofu output -json routes
  cat fanout-plan.json
  tofu plan -input=false -detailed-exitcode -no-color
  ```
phrases.0: I preserved for_each keys while correcting shared inputs.
phrases.1: I checked every module output against its file.
phrases.2: I distinguished stable addresses from replaced provider resources.
diagnostics.probe_0_0: The saved default plan does not link both original files to north through local.region, or its evidence is unreadable; missing/stale fanout-plan.json, a hardcoded region or a broken module interface can explain it. [Cause and check](guides#guide=terraform-7.1&section=fanout-saved-default-contract)
diagnostics.fanout_contract: A supplied regional caller could not plan, did not reach both original route files or changed an identity companion; a missing wrapper input/child call, default literal, altered companion or unreadable protected/plan data can explain it. [Cause and check](guides#guide=terraform-7.1&section=fanout-alternate-caller-plans)
diagnostics.probe_0_1: The saved plan does not replace exactly both original route files with only no-op/read actions elsewhere, or is unreadable; saving a new plan after apply, changing instance keys or introducing other changes can invalidate it. [Cause and check](guides#guide=terraform-7.1&section=fanout-retained-replacement-plan)
diagnostics.probe_0_2: Current state does not contain both recorded file addresses or their evidence is unreadable; changed for_each keys, removed nested resources, an edited address list or failed state observation can lose the required instances. [Cause and check](guides#guide=terraform-7.1&section=fanout-current-file-addresses)
diagnostics.fanout_identity: The address receipt or exact managed object set differs from the frozen originals, an identity companion changed ID/type, or protected/state data could not be read; recreated companions or unrelated managed objects can break continuity. [Cause and check](guides#guide=terraform-7.1&section=fanout-preserved-companion-set)
diagnostics.probe_0_5: The routes output does not resolve exactly depot and junction to their existing files, or output/path observation failed; renamed/missing output keys, wrong exported paths or absent files can explain it. [Cause and check](guides#guide=terraform-7.1&section=fanout-output-file-targets)
diagnostics.fanout_plan: The current default plan did not exit 0; repaired module inputs may still need applying, route files or outputs may drift, or incomplete interfaces/provider startup can prevent a valid plan. [Cause and check](guides#guide=terraform-7.1&section=fanout-default-no-change-plan)
diagnostics.fanout_depot: depot.txt does not provide north:depot or cannot be read; the supplied retired region, incomplete forwarding or an unapplied corrected plan can leave the file stale. [Cause and check](guides#guide=terraform-7.1&section=fanout-depot-file)
diagnostics.fanout_junction: junction.txt does not provide north:junction or cannot be read; the supplied retired region, incomplete forwarding or an unapplied corrected plan can leave the file stale. [Cause and check](guides#guide=terraform-7.1&section=fanout-junction-file)
