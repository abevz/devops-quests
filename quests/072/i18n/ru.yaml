title: Повторы Job
brief: 'Работайте в `~/quest`, изучите `job.json` и `original-job-uid`. Существующий Job `importer` запускает команду проверки данных, которая завершается ошибкой. Контроллер Job создаёт Pod и записывает неудачные попытки; `backoffLimit` ограничивает повторы, а `activeDeadlineSeconds` — прошедшее время. Измените существующий Job вместо замены и сохраните выданную команду. Руководство помогает исследовать неудачные Pod.


  Установите `backoffLimit` в 1 и `activeDeadlineSeconds` в 30; сохраните `parallelism` 1 и `restartPolicy` `Never`. Дождитесь условия Job `Failed=True`. Проверьте, что UID Job совпадает с `/run/dq/facts/0/original-job-uid`, число ошибок не меньше 1, а неудачный Pod этого Job содержит завершённый контейнер `worker` с кодом выхода 1. Контроллер может записывать разные причины и числа ошибок. Проверки наблюдают текущую идентичность, настройки и свидетельства ошибки, но не доказывают, что команду никогда не меняли. Работайте только в офлайн-песочнице.'
debrief: Ошибочная нагрузка предсказуемо останавливается с сохранением данных для
  диагностики.
stages.0.brief: Исходный UID Job, ограничения, параллелизм, политика перезапуска, условие ошибки и код выхода принадлежащего Pod соответствуют заданию.
stages.0.objectives.0.text: Исходный UID Job, ограничения, параллелизм, политика перезапуска, условие ошибки и код выхода принадлежащего Pod соответствуют заданию.
hints.0.text: Неограниченные повторы не исправляют постоянную ошибку данных.
hints.1.text: BackoffLimit и activeDeadlineSeconds ограничивают разные величины.
hints.2.text: Исправьте ограничения существующего Job и изучите Failed conditions
  и exit codes завершённых контейнеров.
phrases.0: Я различал число повторов и deadline выполнения.
phrases.1: Я сохранил ошибочный Job для диагностики.
phrases.2: Я проверил конечный condition и фактический exit code контейнера.
questions.0.points.0: Различать временные ошибки и неверные данные.
questions.0.points.1: Ограничить число повторов и общее время.
questions.0.points.2: Сохранить данные об отказе для диагностики.
questions.0.prompt: Когда ошибочный Job должен прекратить повторы?
questions.1.points.0: Он ограничивает повторы, а не длительность.
questions.1.points.1: ActiveDeadlineSeconds ограничивает окно выполнения Job.
questions.1.points.2: Изучить conditions контроллера и завершённые контейнеры.
questions.1.prompt: Считает ли backoffLimit прошедшие секунды?
