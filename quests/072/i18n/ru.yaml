title: Повторы Job
brief: |-
  Валидатор завершается ошибкой; регулярную проверку нужно восстановить, сохранив существующее свидетельство сбоя.

  Работайте на workstation в `~/quest` с `batch-contract.json`. Исходный Job доступен через Kubernetes; полного манифеста регулярной нагрузки нет.

  **Требования:**

  - Сохраните идентичность исходного Job проверки, заданную команду, одну попытку за раз и отсутствие перезапусков контейнера.
  - Для исходного Job и регулярных запусков ограничьте повторы значением `1`, время выполнения — `30` секундами. Каждый запуск использует заданные образ и команду нагрузки и выполняет одну проверку.
  - Регулярный валидатор из контракта включён и работает по объявленному ежеминутному расписанию. При новом сроке сохраняйте активный запуск, не перекрывая и не отменяя его.
  - Исходный Job и хотя бы один текущий запланированный дочерний Job достигают `Failed=True` с минимум `1` неудачной попыткой и принадлежащим им Pod в состоянии `Failed`, где `worker` завершился с кодом `1`.

  Проверки наблюдают текущие идентичность, политику и свидетельства сбоя, а не каждый прошлый запуск или историю изменений. Появление дочернего запуска может занять больше минуты.
debrief: Изменение текущего Job не задаёт регулярную политику. Создание будущего контроллера и проверка реального
  неудачного дочернего запуска устанавливают обе границы без замены исходного свидетельства.
stages.0.brief: Ограничьте текущий сбой и создайте ограниченную регулярную проверку.
hints.0.text: Существующий Job и шаблон будущих Job — разные границы политики. Сохранение текущего сбоя само по
  себе не обеспечивает безопасных регулярных запусков.
hints.1.text: |-
  Изучите существующий Job, его неудачные Pod и контракт. Создавая будущие запуски, используйте наблюдаемую нагрузку; регулярный контроллер изначально не предоставлен.

  ```sh
  cat batch-contract.json
  kubectl get job importer -o yaml
  kubectl describe job importer
  kubectl get pods -l job-name=importer
  kubectl logs -l job-name=importer --all-containers=true --prefix=true
  ```
hints.2.text: |-
  Проверьте регулярную политику, сохранённый исходный Job и ограниченный неудачный дочерний запуск. Сопоставьте владельца дочернего Job с CronJob, затем его неудачный worker Pod — с этим Job; код завершения worker должен быть 1.

  - `kubectl get cronjob validation-cycle -o yaml`
  - `kubectl get job importer -o yaml`
  - `kubectl get jobs -o yaml`
  - `kubectl get pods -o yaml`
phrases.0: Я различал число повторов и deadline выполнения.
phrases.1: Я сохранил ошибочный Job для диагностики.
phrases.2: Я проверил конечный condition и фактический exit code контейнера.
questions.0.points.0: Различать временные ошибки и неверные данные.
questions.0.points.1: Ограничить число повторов и общее время.
questions.0.points.2: Сохранить данные об отказе для диагностики.
questions.0.prompt: Когда ошибочный Job должен прекратить повторы?
questions.1.points.0: Он ограничивает повторы, а не длительность.
questions.1.points.1: ActiveDeadlineSeconds ограничивает окно выполнения Job.
questions.1.points.2: Изучить conditions контроллера и завершённые контейнеры.
questions.1.prompt: Считает ли backoffLimit прошедшие секунды?
stages.0.objectives.0.text: Исходный Job проверки сохраняет идентичность и поставленную команду, выполняет по одной
  попытке и не перезапускает упавший контейнер.
stages.0.objectives.1.text: Для исходного Job и регулярных запусков ограничьте повторы значением `1`, время выполнения
  — `30` секундами. Каждый запуск использует заданные образ и команду нагрузки и выполняет одну проверку. Регулярный
  валидатор из контракта включён и работает по объявленному ежеминутному расписанию. При новом сроке сохраняйте
  активный запуск, не перекрывая и не отменяя его.
stages.0.objectives.2.text: Исходный Job и хотя бы один текущий запланированный дочерний Job достигают `Failed=True`
  с минимум `1` неудачной попыткой и принадлежащим им Pod в состоянии `Failed`, где `worker` завершился с кодом
  `1`.
diagnostics.uid: Пересоздание importer меняет зафиксированный UID; исправляйте существующий Job и проверьте API, если исходный объект не читается. [Причина и проверка](guides#guide=kubernetes-20&section=batch-preserve-original-job)
diagnostics.worker_command: Замена выданной падающей команды успешной скрывает отказ валидации; сохраните исходную команду worker из живого Job и зафиксированных facts. [Причина и проверка](guides#guide=kubernetes-20&section=batch-retain-failing-worker-command)
diagnostics.restart: Restart policy, отличная от Never, повторяет запуск внутри Pod вместо ожидаемого завершённого отказа; сохраните выданную политику. [Причина и проверка](guides#guide=kubernetes-20&section=batch-never-restart-policy)
diagnostics.field_parallelism: При изменении лимитов могли увеличить parallelism; оставьте у importer единицу и проверьте API, если поле не наблюдается. [Причина и проверка](guides#guide=kubernetes-20&section=batch-single-parallel-execution)
diagnostics.field_backofflimit: Выданный Job допускает 100 повторов; уменьшите backoffLimit до единицы у существующего Job, ограничив отказ валидации. [Причина и проверка](guides#guide=kubernetes-20&section=batch-bound-current-job-retries)
diagnostics.field_activedeadlineseconds: Выданный activeDeadlineSeconds равен 300; задайте существующему Job требуемые 30 секунд вместо удаления выполнения. [Причина и проверка](guides#guide=kubernetes-20&section=batch-bound-current-job-deadline)
diagnostics.batch_current: Текущий Job может отсутствовать либо запрос API, разбор JSON или таймаут мешают чтению; проверьте importer до сравнения исходной нагрузки. [Причина и проверка](guides#guide=kubernetes-20&section=batch-current-job-api-observation)
diagnostics.batch_original: Текущий Job могли заменить либо изменить исходный image, команду worker или Never; сравните с зафиксированными batch-identities. [Причина и проверка](guides#guide=kubernetes-20&section=batch-original-image-command-and-identity)
diagnostics.batch_recurrence: Повторяющийся CronJob может отсутствовать, быть suspended, иметь другое расписание или допускать наложение; сравните с batch-contract.json. Ошибки API/таймаута чтения также дают этот маркер. [Причина и проверка](guides#guide=kubernetes-20&section=batch-active-cron-schedule-and-concurrency)
diagnostics.batch_template: Шаблон CronJob может сохранять широкие retry/deadline либо менять нагрузку; перенесите четыре точных ограничения и исходные image, команду и Never. [Причина и проверка](guides#guide=kubernetes-20&section=batch-bounded-recurring-job-template)
diagnostics.failed_count: Падающая команда могла ещё не выполниться либо отказ скрыли; сохраните исходный Job и проверьте счётчик failed и events. [Причина и проверка](guides#guide=kubernetes-20&section=batch-observe-current-failed-attempt)
diagnostics.failed_condition: Job может продолжать повторы со старыми лимитами либо ещё не завершиться отказом; проверьте ограничения и дождитесь Failed=True. [Причина и проверка](guides#guide=kubernetes-20&section=batch-terminal-current-job-failure)
diagnostics.failed_pod: Одна метка не доказывает принадлежность упавшего Pod исходному Job; проверьте controller owner UID, фазу Failed и exit code один у worker. [Причина и проверка](guides#guide=kubernetes-20&section=batch-original-job-owned-failed-pod)
diagnostics.batch_child: Верный шаблон не доказывает выполнение; дождитесь реального ограниченного дочернего Job от CronJob, завершившегося отказом. Ошибки API/таймаутов чтения Jobs также дают этот маркер. [Причина и проверка](guides#guide=kubernetes-20&section=batch-observed-cron-owned-failed-job)
diagnostics.batch_failed_pod: У повторяющегося выполнения может не быть Failed Pod с исходной нагрузкой и exit code один; проследите CronJob→Job→Pod по controller UID. Ошибки API/таймаутов чтения Pods также дают этот маркер. [Причина и проверка](guides#guide=kubernetes-20&section=batch-child-owner-chain-and-real-exit)
diagnostics.probe_0_1: Ранняя shell-проверка с лимитом 8s может завершиться по таймауту без маркера, например при зависшем kubectl; ошибки запуска helper или зафиксированных facts также дают fallback. Ошибки API/таймауты внутри Python-наблюдателя дают маркер запрошенного объекта. [Причина и проверка](guides#guide=kubernetes-20&section=batch-policy-startup-fallback)
diagnostics.probe_0_2: Ранняя shell-проверка с лимитом 8s может завершиться по таймауту без маркера, например при зависшем kubectl; ошибки запуска helper или зафиксированных facts также дают fallback. Ошибки API/таймауты внутри Python-наблюдателя дают маркер запрошенного объекта. [Причина и проверка](guides#guide=kubernetes-20&section=batch-evidence-startup-fallback)
