title: Повторы Job
brief: "Пакетная нагрузка продолжает завершаться ошибкой валидации. Ограничьте обработку неудач, сохранив её идентичность\
  \ и доказательства отказа.\n\nРаботайте в `~/quest` на workstation. Предоставленные файлы: `job.json`, `original-job-uid`.\n\
  \n**Требования:**\n- Job `importer` сохраняет исходный UID из `/run/dq/facts/0/original-job-uid` на workstation.\n\
  - Job `importer`:\n  - предел повторов `1`.\n- Job `importer`:\n  - срок в секундах `30`.\n- Job `importer`:\n\
  \  - параллелизм `1`.\n- Контейнер `worker` Job `importer` сохраняет исходную команду валидации из `~/quest/job.json`\
  \ на workstation.\n- Job `importer`:\n  - политика перезапуска Pod `Never`.\n- Job `importer` фиксирует минимум\
  \ одну неудачную попытку.\n- Job `importer`:\n  - условие Failed `True`.\n- Pod `Failed`, управляемый исходным\
  \ Job `importer`, содержит контейнер `worker`, завершившийся с кодом `1`.\n\n**Проверьте самостоятельно перед\
  \ Check & finish:**\nВыполняйте эти команды наблюдения из `~/quest` на workstation; `kubectl exec` наблюдает контейнер\
  \ указанной нагрузки.\n- Настройки, идентичность и статус соответствуют требованиям.\n\n  ```sh\n  kubectl get\
  \ job importer -o yaml\n  cat /run/dq/facts/0/original-job-uid\n  ```\n- `kubectl get pods -l job-name=importer\
  \ -o json` — Неудачный Pod исходного Job показывает контейнер `worker`, завершившийся с кодом `1`.\n\nКонтроллер\
  \ может фиксировать разные причины и числа; проверка наблюдает текущие идентичность, настройки и доказательства\
  \ отказа, а не неизменность команды в прошлом.\n"
debrief: Ошибочная нагрузка предсказуемо останавливается с сохранением данных для диагностики.
stages.0.brief: 'Исходная пакетная нагрузка должна предсказуемо останавливаться с наблюдаемыми доказательствами
  отказа.

  '
hints.0.text: Неограниченные повторы не исправляют постоянную ошибку данных.
hints.1.text: BackoffLimit и activeDeadlineSeconds ограничивают разные величины.
hints.2.text: Исправьте ограничения существующего Job и изучите Failed conditions и exit codes завершённых контейнеров.
phrases.0: Я различал число повторов и deadline выполнения.
phrases.1: Я сохранил ошибочный Job для диагностики.
phrases.2: Я проверил конечный condition и фактический exit code контейнера.
questions.0.points.0: Различать временные ошибки и неверные данные.
questions.0.points.1: Ограничить число повторов и общее время.
questions.0.points.2: Сохранить данные об отказе для диагностики.
questions.0.prompt: Когда ошибочный Job должен прекратить повторы?
questions.1.points.0: Он ограничивает повторы, а не длительность.
questions.1.points.1: ActiveDeadlineSeconds ограничивает окно выполнения Job.
questions.1.points.2: Изучить conditions контроллера и завершённые контейнеры.
questions.1.prompt: Считает ли backoffLimit прошедшие секунды?
diagnostics.uid: original-job-uid должен быть непустым и совпадать с UID job/importer.
diagnostics.worker_command: job/importer должен содержать worker с командой `["sh", "-c", "echo invalid-route >&2;
  exit 1"]`.
diagnostics.restart: job/importer restartPolicy должен совпадать с Never.
diagnostics.failed_count: job/importer status.failed должен быть не меньше 1.
diagnostics.failed_condition: job/importer Failed должен совпадать с True.
diagnostics.failed_pod: У Pod в состоянии Failed, контролируемого job/importer с исходным UID, должен быть контейнер
  worker, завершённый с кодом 1.
diagnostics.field_backofflimit: job/importer backoffLimit должен совпадать с 1.
diagnostics.field_activedeadlineseconds: job/importer activeDeadlineSeconds должен совпадать с 30.
diagnostics.field_parallelism: job/importer parallelism должен совпадать с 1.
stages.0.objectives.0.text: Job `importer` сохраняет исходный UID из `/run/dq/facts/0/original-job-uid` на workstation.
stages.0.objectives.1.text: 'Job `importer`: предел повторов `1`.'
stages.0.objectives.2.text: 'Job `importer`: срок в секундах `30`.'
stages.0.objectives.3.text: 'Job `importer`: параллелизм `1`.'
stages.0.objectives.4.text: Контейнер `worker` Job `importer` сохраняет исходную команду валидации из `~/quest/job.json`
  на workstation.
stages.0.objectives.5.text: 'Job `importer`: политика перезапуска Pod `Never`.'
stages.0.objectives.6.text: Job `importer` фиксирует минимум одну неудачную попытку.
stages.0.objectives.7.text: 'Job `importer`: условие Failed `True`.'
stages.0.objectives.8.text: Pod `Failed`, управляемый исходным Job `importer`, содержит контейнер `worker`, завершившийся
  с кодом `1`.
