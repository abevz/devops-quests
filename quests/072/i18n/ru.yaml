title: Повторы Job
brief: 'Importer завершается с ошибкой данных, но Job разрешает 100 повторов и пять минут работы. Ограничьте
  существующий Job значениями backoffLimit: 1 и activeDeadlineSeconds: 30, затем дождитесь конечного Failed.
  Не пересоздавайте его и не меняйте ошибочную команду: цель — ограниченный отказ, а не успешный импорт.
  Исходный UID Job сохранён в /run/dq/facts/0/.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `job.json`, `original-job-uid`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Тот же ошибочный Job имеет один повтор и deadline 30 секунд, достигает Failed и
  сохраняет реальные exit-code evidence.'
debrief: Ошибочная нагрузка предсказуемо останавливается с сохранением данных для диагностики.
stages.0.brief: 'Тот же ошибочный Job имеет один повтор и deadline 30 секунд, достигает Failed и сохраняет
  реальные exit-code evidence.


  Результат проверки: Тот же ошибочный Job имеет один повтор и deadline 30 секунд, достигает Failed и
  сохраняет реальные exit-code evidence.'
stages.0.objectives.0.text: Тот же ошибочный Job имеет один повтор и deadline 30 секунд, достигает Failed
  и сохраняет реальные exit-code evidence.
hints.0.text: Неограниченные повторы не исправляют постоянную ошибку данных.
hints.1.text: BackoffLimit и activeDeadlineSeconds ограничивают разные величины.
hints.2.text: Исправьте ограничения существующего Job и изучите Failed conditions и exit codes завершённых
  контейнеров.
phrases.0: Я различал число повторов и deadline выполнения.
phrases.1: Я сохранил ошибочный Job для диагностики.
phrases.2: Я проверил конечный condition и фактический exit code контейнера.
questions.0.points.0: Различать временные ошибки и неверные данные.
questions.0.points.1: Ограничить число повторов и общее время.
questions.0.points.2: Сохранить данные об отказе для диагностики.
questions.0.prompt: Когда ошибочный Job должен прекратить повторы?
questions.1.points.0: Он ограничивает повторы, а не длительность.
questions.1.points.1: ActiveDeadlineSeconds ограничивает окно выполнения Job.
questions.1.points.2: Изучить conditions контроллера и завершённые контейнеры.
questions.1.prompt: Считает ли backoffLimit прошедшие секунды?
