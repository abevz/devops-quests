title: Zasady ponawiania prób Job
brief: |-
  Walidator kończy się błędem; trzeba przywrócić regularną walidację bez utraty istniejących dowodów awarii.

  Pracuj na workstation w `~/quest` z `batch-contract.json`. Oryginalny Job jest dostępny przez Kubernetes; nie dostarczono kompletnego manifestu regularnego wykonania.

  **Wymagania:**

  - Zachowaj tożsamość i podane polecenie oryginalnego Job walidacji, jedną próbę naraz oraz brak restartów kontenera.
  - Ogranicz oryginalny Job i regularne wykonania do limitu ponowień `1` i czasu `30` sekund. Każde wykonanie używa podanego obrazu i polecenia dla jednej walidacji.
  - Regularny walidator określony w kontrakcie jest włączony zgodnie z zadeklarowanym harmonogramem co minutę. Zachowaj aktywne wykonanie zamiast nakładać je lub anulować po kolejnym terminie.
  - Oryginalny Job i co najmniej jeden bieżący zaplanowany podrzędny Job osiągają `Failed=True` z co najmniej `1` nieudaną próbą i własnym Podem `Failed`, którego `worker` kończy się kodem `1`.

  Testy obserwują bieżącą tożsamość, politykę i dowody awarii, a nie każde wcześniejsze wykonanie ani historię zmian. Zaplanowane wykonanie podrzędne może pojawić się po ponad minucie.
debrief: Zmiana bieżącego Job nie dostarcza polityki regularnego wykonania. Budowa przyszłego kontrolera i kontrola
  rzeczywistego nieudanego Job podrzędnego ustalają obie granice bez zastępowania oryginalnych dowodów.
stages.0.brief: Ogranicz bieżącą awarię i zbuduj ograniczoną regularną walidację.
hints.0.text: Istniejący Job i szablon przyszłych Job są odrębnymi granicami polityki. Zachowanie bieżącej awarii
  samo nie ustanawia bezpiecznych regularnych wykonań.
hints.1.text: |-
  Sprawdź istniejący Job, jego Pody zakończone błędem i dostarczony kontrakt. Odszukaj obraz, polecenie i politykę restartu w szablonie Job oraz osobne limity cyklicznych uruchomień w batch-contract.json.

  ```sh
  cat batch-contract.json
  kubectl get job importer -o yaml
  kubectl describe job importer
  kubectl get pods -l job-name=importer
  kubectl logs -l job-name=importer --all-containers=true --prefix=true
  ```
hints.2.text: |-
  Sprawdź regularną politykę, zachowany oryginalny Job i ograniczony nieudany Job podrzędny. Powiąż własność z CronJob, a jego nieudany worker Pod z tym Job; worker musi kończyć się kodem 1.

  - `kubectl get cronjob validation-cycle -o yaml`
  - `kubectl get job importer -o yaml`
  - `kubectl get jobs -o yaml`
  - `kubectl get pods -o yaml`
phrases.0: Rozróżniłem liczbę ponownych prób od wykonania deadline.
phrases.1: Zachowałem uszkodzony Job do diagnozy.
phrases.2: Sprawdziłem terminal condition i faktyczny kontener exit code.
questions.0.points.0: Odróżnij przejściowe awarie od nieprawidłowych danych wejściowych.
questions.0.points.1: Ograniczone ponowne próby i całkowity czas wykonania.
questions.0.points.2: Zachowaj dowody awarii do celów diagnozy.
questions.0.prompt: Kiedy nieudany Job powinien przestać ponawiać próby?
questions.1.points.0: Ogranicza liczbę ponownych prób, a nie czas trwania zegara ściennego.
questions.1.points.1: activeDeadlineSeconds ogranicza okno wykonania Job.
questions.1.points.2: Sprawdź sterownik conditions i zakończone kontenery.
questions.1.prompt: Czy backoffLimit liczy sekundy, które upłynęły?
stages.0.objectives.0.text: Oryginalny Job walidacji zachowuje tożsamość i dostarczone polecenie, wykonuje po jednej
  próbie i nie uruchamia ponownie uszkodzonego kontenera.
stages.0.objectives.1.text: Ogranicz oryginalny Job i regularne wykonania do limitu ponowień `1` i czasu `30` sekund.
  Każde wykonanie używa podanego obrazu i polecenia dla jednej walidacji. Regularny walidator określony w kontrakcie
  jest włączony zgodnie z zadeklarowanym harmonogramem co minutę. Zachowaj aktywne wykonanie zamiast nakładać je
  lub anulować po kolejnym terminie.
stages.0.objectives.2.text: Oryginalny Job i co najmniej jeden bieżący zaplanowany podrzędny Job osiągają `Failed=True`
  z co najmniej `1` nieudaną próbą i własnym Podem `Failed`, którego `worker` kończy się kodem `1`.
diagnostics.uid: Odtworzenie importer zmienia zamrożony UID; popraw istniejący Job i sprawdź API, jeśli pierwotnego obiektu nie można odczytać. [Przyczyna i kontrola](guides#guide=kubernetes-20&section=batch-preserve-original-job)
diagnostics.worker_command: Zastąpienie dostarczonego błędnego polecenia sukcesem ukrywa błąd walidacji; zachowaj pierwotne polecenie worker z żywego Job i zamrożonych facts. [Przyczyna i kontrola](guides#guide=kubernetes-20&section=batch-retain-failing-worker-command)
diagnostics.restart: Restart policy inna niż Never może ponawiać proces w Pod zamiast pozostawić oczekiwaną awarię wykonania; zachowaj dostarczoną politykę. [Przyczyna i kontrola](guides#guide=kubernetes-20&section=batch-never-restart-policy)
diagnostics.field_parallelism: Przy zmianie limitów mógł wzrosnąć parallelism; zachowaj jeden dla importer i sprawdź API, jeśli pola nie można odczytać. [Przyczyna i kontrola](guides#guide=kubernetes-20&section=batch-single-parallel-execution)
diagnostics.field_backofflimit: Dostarczony Job dopuszcza 100 powtórzeń; zmniejsz backoffLimit do jednego w istniejącym Job, ograniczając błędną walidację. [Przyczyna i kontrola](guides#guide=kubernetes-20&section=batch-bound-current-job-retries)
diagnostics.field_activedeadlineseconds: Dostarczone activeDeadlineSeconds wynosi 300; ustaw wymagane 30 sekund dla istniejącego Job zamiast usuwać wykonanie. [Przyczyna i kontrola](guides#guide=kubernetes-20&section=batch-bound-current-job-deadline)
diagnostics.batch_current: Bieżący Job może nie istnieć albo żądanie API, JSON lub limit czasu blokuje odczyt; sprawdź importer przed porównaniem pierwotnej aplikacji. [Przyczyna i kontrola](guides#guide=kubernetes-20&section=batch-current-job-api-observation)
diagnostics.batch_original: Bieżący Job mógł zostać zastąpiony lub zmieniono image, polecenie worker albo Never; porównaj z zamrożonym batch-identities. [Przyczyna i kontrola](guides#guide=kubernetes-20&section=batch-original-image-command-and-identity)
diagnostics.batch_recurrence: Cykliczny CronJob może nie istnieć, być suspended, mieć inny harmonogram lub dopuszczać nakładanie; porównaj z batch-contract.json. Błędy API/limitu czasu też dają ten marker. [Przyczyna i kontrola](guides#guide=kubernetes-20&section=batch-active-cron-schedule-and-concurrency)
diagnostics.batch_template: Szablon CronJob może zachowywać szerokie retry/deadline lub zmieniać aplikację; przenieś cztery dokładne limity oraz pierwotne image, polecenie i Never. [Przyczyna i kontrola](guides#guide=kubernetes-20&section=batch-bounded-recurring-job-template)
diagnostics.failed_count: Błędne polecenie mogło jeszcze nie wykonać się lub ukryto awarię; zachowaj pierwotny Job i sprawdź licznik failed oraz events. [Przyczyna i kontrola](guides#guide=kubernetes-20&section=batch-observe-current-failed-attempt)
diagnostics.failed_condition: Job może nadal ponawiać według starych limitów lub nie osiągnął końcowej awarii; sprawdź ograniczenia i poczekaj na Failed=True. [Przyczyna i kontrola](guides#guide=kubernetes-20&section=batch-terminal-current-job-failure)
diagnostics.failed_pod: Sama etykieta nie dowodzi przynależności błędnego Pod do pierwotnego Job; sprawdź controller owner UID, fazę Failed i exit code jeden dla worker. [Przyczyna i kontrola](guides#guide=kubernetes-20&section=batch-original-job-owned-failed-pod)
diagnostics.batch_child: Poprawny szablon nie dowodzi wykonania; poczekaj na rzeczywisty ograniczony Job należący do CronJob, zakończony awarią. Błędy API/limitów czasu przy Jobs też dają ten marker. [Przyczyna i kontrola](guides#guide=kubernetes-20&section=batch-observed-cron-owned-failed-job)
diagnostics.batch_failed_pod: Cykliczne wykonanie może nie mieć Failed Pod z pierwotną aplikacją i exit code jeden; prześledź CronJob→Job→Pod po controller UID. Błędy API/limitów czasu przy Pods też dają ten marker. [Przyczyna i kontrola](guides#guide=kubernetes-20&section=batch-child-owner-chain-and-real-exit)
diagnostics.probe_0_1: Wcześniejsza kontrola shell z limitem 8s może przekroczyć czas bez markera, np. przy zablokowanym kubectl; błędy startu helper lub zamrożonych facts też dają fallback. Błędy API/limity czasu wewnątrz obserwatora Python dają marker żądanego obiektu. [Przyczyna i kontrola](guides#guide=kubernetes-20&section=batch-policy-startup-fallback)
diagnostics.probe_0_2: Wcześniejsza kontrola shell z limitem 8s może przekroczyć czas bez markera, np. przy zablokowanym kubectl; błędy startu helper lub zamrożonych facts też dają fallback. Błędy API/limity czasu wewnątrz obserwatora Python dają marker żądanego obiektu. [Przyczyna i kontrola](guides#guide=kubernetes-20&section=batch-evidence-startup-fallback)
