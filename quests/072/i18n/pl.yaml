title: Zasady ponawiania prób Job
brief: "Obciążenie wsadowe nadal kończy się błędem walidacji. Ogranicz obsługę niepowodzeń, zachowując tożsamość\
  \ i dowody awarii.\n\nPracuj w `~/quest` na workstation. Dostarczone pliki: `job.json`, `original-job-uid`.\n\n\
  **Wymagania:**\n- Oryginalny Job `importer` zachowuje dostarczone polecenie walidacji `worker`, równoległość `1`\
  \ i zasadę restartu Podów `Never`.\n  - Wzorce oryginalnej tożsamości i polecenia na workstation: `/run/dq/facts/0/original-job-uid`\
  \ i `~/quest/job.json`.\n- Job `importer` ogranicza ponowienia do `1`, a czas wykonania do `30` sekund.\n- Job\
  \ `importer` osiąga `Failed=True` z co najmniej `1` nieudaną próbą i kontrolowanym Podem `Failed`, którego `worker`\
  \ kończy się kodem `1`.\n\n**Sprawdź samodzielnie przed Check & finish:**\nWykonuj te polecenia obserwacyjne w\
  \ `~/quest` na workstation; `kubectl exec` obserwuje kontener wskazanego obciążenia.\n- Ustawienia, tożsamość\
  \ i status odpowiadają wymaganiom.\n\n  ```sh\n  kubectl get job importer -o yaml\n  cat /run/dq/facts/0/original-job-uid\n\
  \  ```\n- `kubectl get pods -l job-name=importer -o json` — Nieudany Pod oryginalnego Joba pokazuje kontener `worker`\
  \ zakończony kodem `1`.\n\nKontroler może zapisywać różne powody lub liczby; sprawdzane są bieżąca tożsamość,\
  \ ustawienia i dowody awarii, a nie niezmienność polecenia w historii.\n"
debrief: Nieskuteczne obciążenie pracą zatrzymuje się w przewidywalny sposób, zachowując jednocześnie dowody na
  potrzeby diagnozy.
stages.0.brief: 'Oryginalne obciążenie wsadowe ma kończyć się przewidywalnie z obserwowalnymi dowodami awarii.

  '
hints.0.text: Trwałego błędu danych nie da się naprawić nieograniczoną liczbą ponownych prób.
hints.1.text: backoffLimit i activeDeadlineSeconds ograniczają różne wymiary.
hints.2.text: Popraw istniejące limity Job i sprawdź Failed conditions oraz zakończone exit codes.
phrases.0: Rozróżniłem liczbę ponownych prób od wykonania deadline.
phrases.1: Zachowałem uszkodzony Job do diagnozy.
phrases.2: Sprawdziłem terminal condition i faktyczny kontener exit code.
questions.0.points.0: Odróżnij przejściowe awarie od nieprawidłowych danych wejściowych.
questions.0.points.1: Ograniczone ponowne próby i całkowity czas wykonania.
questions.0.points.2: Zachowaj dowody awarii do celów diagnozy.
questions.0.prompt: Kiedy nieudany Job powinien przestać ponawiać próby?
questions.1.points.0: Ogranicza liczbę ponownych prób, a nie czas trwania zegara ściennego.
questions.1.points.1: activeDeadlineSeconds ogranicza okno wykonania Job.
questions.1.points.2: Sprawdź sterownik conditions i zakończone kontenery.
questions.1.prompt: Czy backoffLimit liczy sekundy, które upłynęły?
diagnostics.uid: original-job-uid musi być niepusty i odpowiadać UID job/importer.
diagnostics.worker_command: job/importer musi zawierać worker z poleceniem `["sh", "-c", "echo invalid-route >&2;
  exit 1"]`.
diagnostics.restart: job/importer restartPolicy musi być równe Never.
diagnostics.failed_count: job/importer status.failed musi wynosić co najmniej 1.
diagnostics.failed_condition: job/importer Failed musi być równe True.
diagnostics.failed_pod: Pod w stanie Failed kontrolowany przez job/importer z pierwotnym UID musi mieć kontener
  worker zakończony kodem 1.
diagnostics.field_backofflimit: job/importer backoffLimit musi być równe 1.
diagnostics.field_activedeadlineseconds: job/importer activeDeadlineSeconds musi być równe 30.
diagnostics.field_parallelism: job/importer parallelism musi być równe 1.
stages.0.objectives.0.text: Oryginalny Job `importer` zachowuje dostarczone polecenie walidacji `worker`, równoległość
  `1` i zasadę restartu Podów `Never`.
stages.0.objectives.1.text: Job `importer` ogranicza ponowienia do `1`, a czas wykonania do `30` sekund.
stages.0.objectives.2.text: Job `importer` osiąga `Failed=True` z co najmniej `1` nieudaną próbą i kontrolowanym
  Podem `Failed`, którego `worker` kończy się kodem `1`.
