title: Zasady ponawiania prób Job
brief: 'Pracuj w `~/quest` i przeczytaj `job.json` oraz `original-job-uid`. Istniejący Job `importer` uruchamia polecenie walidacji danych kończące się błędem. Kontroler Job tworzy Pody i zapisuje nieudane próby; `backoffLimit` ogranicza ponowienia, a `activeDeadlineSeconds` czas wykonania. Popraw istniejący Job zamiast go zastępować i zachowaj dostarczone polecenie. Połączony przewodnik pomaga badać błędne Pody.


  Ustaw `backoffLimit` na 1 i `activeDeadlineSeconds` na 30; zachowaj `parallelism` 1 oraz `restartPolicy` `Never`. Poczekaj na warunek Job `Failed=True`. Sprawdź, czy UID Job odpowiada `/run/dq/facts/0/original-job-uid`, liczba niepowodzeń wynosi co najmniej 1, a nieudany Pod należący do tego Job ma zakończony kontener `worker` z kodem wyjścia 1. Kontroler może zapisać różne przyczyny i liczby niepowodzeń. Kontrole obserwują bieżącą tożsamość, ustawienia i dowody błędu; nie dowodzą, że polecenia nigdy nie zmieniono. Pracuj tylko w zatoce offline.'
debrief: Nieskuteczne obciążenie pracą zatrzymuje się w przewidywalny sposób, zachowując jednocześnie
  dowody na potrzeby diagnozy.
stages.0.brief: Pierwotny UID Job, limity, równoległość, polityka restartu, warunek błędu i kod wyjścia należącego poda odpowiadają opisowi.
stages.0.objectives.0.text: Pierwotny UID Job, limity, równoległość, polityka restartu, warunek błędu i kod wyjścia należącego poda odpowiadają opisowi.
hints.0.text: Trwałego błędu danych nie da się naprawić nieograniczoną liczbą ponownych prób.
hints.1.text: backoffLimit i activeDeadlineSeconds ograniczają różne wymiary.
hints.2.text: Popraw istniejące limity Job i sprawdź Failed conditions oraz zakończone exit codes.
phrases.0: Rozróżniłem liczbę ponownych prób od wykonania deadline.
phrases.1: Zachowałem uszkodzony Job do diagnozy.
phrases.2: Sprawdziłem terminal condition i faktyczny kontener exit code.
questions.0.points.0: Odróżnij przejściowe awarie od nieprawidłowych danych wejściowych.
questions.0.points.1: Ograniczone ponowne próby i całkowity czas wykonania.
questions.0.points.2: Zachowaj dowody awarii do celów diagnozy.
questions.0.prompt: Kiedy nieudany Job powinien przestać ponawiać próby?
questions.1.points.0: Ogranicza liczbę ponownych prób, a nie czas trwania zegara ściennego.
questions.1.points.1: activeDeadlineSeconds ogranicza okno wykonania Job.
questions.1.points.2: Sprawdź sterownik conditions i zakończone kontenery.
questions.1.prompt: Czy backoffLimit liczy sekundy, które upłynęły?
