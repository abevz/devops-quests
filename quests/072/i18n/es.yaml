title: Política de reintento Job
brief: 'El importador sale con un error de validación de datos, pero su Job permite 100 reintentos y cinco
  minutos de ejecución. Vincule este Job existente a backoffLimit: 1 y activeDeadlineSeconds: 30, luego
  observe la condición del terminal Failed. No lo elimine ni lo vuelva a crear (delete/recreate), ni cambie
  el comando que falla: este incidente muestra una falla limitada, no una importación exitosa. El Job
  UID original está congelado bajo /run/dq/facts/0/.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `job.json`, `original-job-uid`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: el mismo Job fallido tiene un límite de un reintento y un deadline de
  30 segundos, alcanza el Failed y conserva el exit-code evidence real.'
debrief: La carga de trabajo fallida se detiene de manera predecible mientras se conserva la evidencia
  para el diagnóstico.
stages.0.brief: 'Criterios de éxito: el mismo Job fallido tiene un límite de un reintento y un deadline
  de 30 segundos, alcanza el Failed y conserva el exit-code evidence real.'
stages.0.objectives.0.text: El mismo Job fallido tiene un límite de un reintento y un deadline de 30 segundos,
  alcanza el Failed y conserva el exit-code evidence real.
hints.0.text: Un error de datos permanente no se repara con reintentos ilimitados.
hints.1.text: backoffLimit y activeDeadlineSeconds restringen diferentes dimensiones.
hints.2.text: Parchee los límites existentes de Job y inspect Failed conditions más el exit codes terminado.
phrases.0: Distinguí el recuento de reintentos de la ejecución deadline.
phrases.1: Conservé el Job fallido para el diagnóstico.
phrases.2: Verifiqué la terminal condition y el contenedor real exit code.
questions.0.points.0: Distinga fallas transitorias de entradas no válidas.
questions.0.points.1: Reintentos vinculados y tiempo total de ejecución.
questions.0.points.2: Preservar la evidencia de falla para el diagnóstico.
questions.0.prompt: ¿Cuándo debería dejar de reintentar un Job fallido?
questions.1.points.0: Limita los reintentos en lugar de la duración del reloj de pared.
questions.1.points.1: activeDeadlineSeconds limita la ventana de ejecución Job.
questions.1.points.2: Inspeccione el controlador conditions y los contenedores terminados.
questions.1.prompt: ¿backoffLimit cuenta los segundos transcurridos?
