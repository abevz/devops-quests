title: Política de reintento Job
brief: |-
  El validador falla y debe recuperarse la validación regular sin perder la evidencia de fallo existente.

  Trabaja en la workstation en `~/quest` con `batch-contract.json`. El Job original está disponible mediante Kubernetes; no se suministra un manifiesto completo para ejecución regular.

  **Requisitos:**

  - Conserva identidad y comando suministrado del Job de validación original, un intento cada vez y ningún reinicio del contenedor.
  - Limita el Job original y las ejecuciones regulares al límite de reintentos `1` y duración `30` segundos. Cada ejecución utiliza imagen y comando suministrados para una validación.
  - El validador regular definido en el contrato está habilitado con su horario cada minuto. Conserva una ejecución activa en lugar de solaparla o cancelarla cuando llegue otro horario.
  - El Job original y al menos un Job hijo programado actual alcanzan `Failed=True` con al menos `1` intento fallido y un Pod `Failed` propio cuyo `worker` termina con código `1`.

  Las comprobaciones observan identidad, política y evidencia de fallo actuales, no cada ejecución anterior ni el historial de cambios. Un hijo programado puede tardar más de un minuto en aparecer.
debrief: Cambiar un Job actual no proporciona política de ejecución regular. Construir el controlador futuro e inspeccionar
  un hijo fallido real establece ambos límites sin sustituir la evidencia original.
stages.0.brief: Limita el fallo actual y construye validación regular acotada.
hints.0.text: Un Job existente y la plantilla de futuros Jobs son límites de política distintos. Conservar el fallo
  actual no establece por sí solo una ejecución regular segura.
hints.1.text: |-
  Inspecciona el Job existente, sus Pods fallidos y el contrato suministrado. Busca la imagen, el comando y la política de reinicio en la plantilla del Job, y los límites de ejecución periódica en batch-contract.json.

  ```sh
  cat batch-contract.json
  kubectl get job importer -o yaml
  kubectl describe job importer
  kubectl get pods -l job-name=importer
  kubectl logs -l job-name=importer --all-containers=true --prefix=true
  ```
hints.2.text: |-
  Verifica política regular, Job original conservado y un hijo fallido acotado. Relaciona la propiedad del hijo con el CronJob y su worker Pod fallido con ese hijo; worker debe terminar con código 1.

  - `kubectl get cronjob validation-cycle -o yaml`
  - `kubectl get job importer -o yaml`
  - `kubectl get jobs -o yaml`
  - `kubectl get pods -o yaml`
phrases.0: Distinguí el recuento de reintentos de la ejecución deadline.
phrases.1: Conservé el Job fallido para el diagnóstico.
phrases.2: Verifiqué la terminal condition y el contenedor real exit code.
questions.0.points.0: Distinga fallas transitorias de entradas no válidas.
questions.0.points.1: Reintentos vinculados y tiempo total de ejecución.
questions.0.points.2: Preservar la evidencia de falla para el diagnóstico.
questions.0.prompt: ¿Cuándo debería dejar de reintentar un Job fallido?
questions.1.points.0: Limita los reintentos en lugar de la duración del reloj de pared.
questions.1.points.1: activeDeadlineSeconds limita la ventana de ejecución Job.
questions.1.points.2: Inspeccione el controlador conditions y los contenedores terminados.
questions.1.prompt: ¿backoffLimit cuenta los segundos transcurridos?
stages.0.objectives.0.text: El Job de validación original conserva su identidad y el comando suministrado, ejecuta
  un intento a la vez y no reinicia un contenedor fallido.
stages.0.objectives.1.text: Limita el Job original y las ejecuciones regulares al límite de reintentos `1` y duración
  `30` segundos. Cada ejecución utiliza imagen y comando suministrados para una validación. El validador regular
  definido en el contrato está habilitado con su horario cada minuto. Conserva una ejecución activa en lugar de
  solaparla o cancelarla cuando llegue otro horario.
stages.0.objectives.2.text: El Job original y al menos un Job hijo programado actual alcanzan `Failed=True` con
  al menos `1` intento fallido y un Pod `Failed` propio cuyo `worker` termina con código `1`.
diagnostics.uid: Recrear importer cambia UID fijado; repare Job existente y revise API si no puede leerse el objeto original. [Causa y comprobación](guides#guide=kubernetes-20&section=batch-preserve-original-job)
diagnostics.worker_command: Sustituir comando fallido por éxito oculta fallo de validación; conserve comando worker original del Job vivo y facts fijados. [Causa y comprobación](guides#guide=kubernetes-20&section=batch-retain-failing-worker-command)
diagnostics.restart: Una restart policy distinta de Never puede reintentar dentro del Pod en vez de dejar ejecución fallida; conserve política suministrada. [Causa y comprobación](guides#guide=kubernetes-20&section=batch-never-restart-policy)
diagnostics.field_parallelism: Parallelism puede aumentar al editar límites; mantenga uno en importer y revise API si no se observa el campo. [Causa y comprobación](guides#guide=kubernetes-20&section=batch-single-parallel-execution)
diagnostics.field_backofflimit: Job suministrado permite 100 reintentos; reduzca backoffLimit a uno en Job existente para limitar validación fallida. [Causa y comprobación](guides#guide=kubernetes-20&section=batch-bound-current-job-retries)
diagnostics.field_activedeadlineseconds: El activeDeadlineSeconds suministrado es 300; ajuste Job existente a 30 segundos requeridos en vez de borrar ejecución. [Causa y comprobación](guides#guide=kubernetes-20&section=batch-bound-current-job-deadline)
diagnostics.batch_current: Job actual puede faltar o fallar petición API, JSON o tiempo; revise importer antes de comparar carga original. [Causa y comprobación](guides#guide=kubernetes-20&section=batch-current-job-api-observation)
diagnostics.batch_original: Job actual puede reemplazarse o cambiar image, comando worker o Never; compare con batch-identities fijados. [Causa y comprobación](guides#guide=kubernetes-20&section=batch-original-image-command-and-identity)
diagnostics.batch_recurrence: CronJob recurrente puede faltar, estar suspended, usar otro horario o permitir solapamiento; compare con batch-contract.json. Errores API/tiempo al leerlo también usan este marcador. [Causa y comprobación](guides#guide=kubernetes-20&section=batch-active-cron-schedule-and-concurrency)
diagnostics.batch_template: La plantilla CronJob puede conservar retry/deadline amplios o cambiar carga; propague cuatro límites exactos e image, comando y Never originales. [Causa y comprobación](guides#guide=kubernetes-20&section=batch-bounded-recurring-job-template)
diagnostics.failed_count: El comando fallido puede no ejecutarse aún o su fallo ocultarse; conserve Job original y revise contador failed y events. [Causa y comprobación](guides#guide=kubernetes-20&section=batch-observe-current-failed-attempt)
diagnostics.failed_condition: Job puede seguir reintentando con límites antiguos o no alcanzar fallo final; revise límites y espere Failed=True. [Causa y comprobación](guides#guide=kubernetes-20&section=batch-terminal-current-job-failure)
diagnostics.failed_pod: Una etiqueta sola no prueba pertenencia del Pod fallido al Job original; revise controller owner UID, fase Failed y exit code uno de worker. [Causa y comprobación](guides#guide=kubernetes-20&section=batch-original-job-owned-failed-pod)
diagnostics.batch_child: Una plantilla válida no prueba ejecución; espere Job hijo real, limitado y fallido, propiedad de CronJob. Errores API/tiempo al leer Jobs también usan este marcador. [Causa y comprobación](guides#guide=kubernetes-20&section=batch-observed-cron-owned-failed-job)
diagnostics.batch_failed_pod: La ejecución recurrente puede carecer de Failed Pod con carga original y exit code uno; siga CronJob→Job→Pod por controller UID. Errores API/tiempo al leer Pods también usan este marcador. [Causa y comprobación](guides#guide=kubernetes-20&section=batch-child-owner-chain-and-real-exit)
diagnostics.probe_0_1: La comprobación shell anterior de 8s puede agotar tiempo sin marcador, por ejemplo con kubectl bloqueado; errores de inicio del helper o facts fijados también dan fallback. API/tiempos dentro del observador Python usan marcador del objeto solicitado. [Causa y comprobación](guides#guide=kubernetes-20&section=batch-policy-startup-fallback)
diagnostics.probe_0_2: La comprobación shell anterior de 8s puede agotar tiempo sin marcador, por ejemplo con kubectl bloqueado; errores de inicio del helper o facts fijados también dan fallback. API/tiempos dentro del observador Python usan marcador del objeto solicitado. [Causa y comprobación](guides#guide=kubernetes-20&section=batch-evidence-startup-fallback)
