title: Política de reintento Job
brief: "La carga por lotes sigue fallando en la validación. Limita la gestión de fallos conservando su identidad\
  \ y las pruebas del fallo.\n\nTrabaja en `~/quest` en la workstation. Archivos suministrados: `job.json`, `original-job-uid`.\n\
  \n**Requisitos:**\n- El Job `importer` conserva su UID original de `/run/dq/facts/0/original-job-uid` en la workstation.\n\
  - Job `importer`:\n  - límite de reintentos `1`.\n- Job `importer`:\n  - plazo en segundos `30`.\n- Job `importer`:\n\
  \  - paralelismo `1`.\n- El contenedor `worker` del Job `importer` conserva el comando de validación suministrado\
  \ en `~/quest/job.json` en la workstation.\n- Job `importer`:\n  - política de reinicio de Pods `Never`.\n- El\
  \ Job `importer` registra al menos un intento fallido.\n- Job `importer`:\n  - condición Failed `True`.\n- Un\
  \ Pod `Failed` controlado por el Job `importer` original tiene el contenedor `worker` terminado con código `1`.\n\
  \n**Verifica antes de Check & finish:**\nEjecuta estos comandos de observación desde `~/quest` en la workstation;\
  \ `kubectl exec` observa el contenedor de la carga indicada.\n- Los ajustes, la identidad y el estado coinciden\
  \ con Requisitos.\n\n  ```sh\n  kubectl get job importer -o yaml\n  cat /run/dq/facts/0/original-job-uid\n  ```\n\
  - `kubectl get pods -l job-name=importer -o json` — Un Pod fallido del Job original muestra el contenedor `worker`\
  \ terminado con código `1`.\n\nEl controlador puede registrar motivos o cantidades distintos; las comprobaciones\
  \ observan identidad, ajustes y fallos actuales, no que el comando nunca cambiara.\n"
debrief: La carga de trabajo fallida se detiene de manera predecible mientras se conserva la evidencia para el diagnóstico.
stages.0.brief: 'La carga por lotes original debe detenerse de forma predecible con pruebas observables del fallo.

  '
hints.0.text: Un error de datos permanente no se repara con reintentos ilimitados.
hints.1.text: backoffLimit y activeDeadlineSeconds restringen diferentes dimensiones.
hints.2.text: Parchee los límites existentes de Job y inspect Failed conditions más el exit codes terminado.
phrases.0: Distinguí el recuento de reintentos de la ejecución deadline.
phrases.1: Conservé el Job fallido para el diagnóstico.
phrases.2: Verifiqué la terminal condition y el contenedor real exit code.
questions.0.points.0: Distinga fallas transitorias de entradas no válidas.
questions.0.points.1: Reintentos vinculados y tiempo total de ejecución.
questions.0.points.2: Preservar la evidencia de falla para el diagnóstico.
questions.0.prompt: ¿Cuándo debería dejar de reintentar un Job fallido?
questions.1.points.0: Limita los reintentos en lugar de la duración del reloj de pared.
questions.1.points.1: activeDeadlineSeconds limita la ventana de ejecución Job.
questions.1.points.2: Inspeccione el controlador conditions y los contenedores terminados.
questions.1.prompt: ¿backoffLimit cuenta los segundos transcurridos?
diagnostics.uid: original-job-uid no debe estar vacío y debe coincidir con el UID de job/importer.
diagnostics.worker_command: job/importer debe contener worker con el comando `["sh", "-c", "echo invalid-route >&2;
  exit 1"]`.
diagnostics.restart: job/importer restartPolicy debe ser igual a Never.
diagnostics.failed_count: job/importer status.failed debe ser al menos 1.
diagnostics.failed_condition: job/importer Failed debe ser igual a True.
diagnostics.failed_pod: Un Pod Failed controlado por job/importer con el UID original debe tener un contenedor worker
  terminado con código 1.
diagnostics.field_backofflimit: job/importer backoffLimit debe ser igual a 1.
diagnostics.field_activedeadlineseconds: job/importer activeDeadlineSeconds debe ser igual a 30.
diagnostics.field_parallelism: job/importer parallelism debe ser igual a 1.
