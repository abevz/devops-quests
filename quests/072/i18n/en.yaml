title: Job retry policy
brief: 'The importer exits with a data-validation error, but its Job permits 100 retries and five minutes
  of execution. Bound this existing Job to backoffLimit: 1 and activeDeadlineSeconds: 30, then observe
  a terminal Failed condition. Do not delete/recreate it or change the failing command: this incident
  teaches a bounded failure, not a successful import. The original Job UID is frozen under /run/dq/facts/0/.


  Quest files in `~/quest` (some appear in later stages): `job.json`, `original-job-uid`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: The same failing Job has a one-retry limit and 30-second deadline, reaches
  Failed and retains real exit-code evidence.'
debrief: The failing workload stops predictably while retaining evidence for diagnosis.
