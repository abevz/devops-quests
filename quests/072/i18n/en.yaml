title: Job retry policy
brief: |-
  The validator is failing, and regular validation must be restored without losing its existing failure evidence.

  Work on the workstation in `~/quest` with `batch-contract.json`. The original validation Job is available through Kubernetes; no complete recurring workload manifest is supplied.

  **Requirements:**

  - Keep the original validation Job identity, supplied command, one attempt at a time and no container restart.
  - Bound both the original Job and recurring executions to retry limit `1` and execution time `30` seconds. Every execution uses the supplied workload image and command and represents one validation.
  - The recurring validator specified in the contract is enabled on its declared every-minute schedule. Preserve an active execution rather than overlap or cancel it when another schedule arrives.
  - Both the original Job and at least one current scheduled child reach `Failed=True` with at least `1` failed attempt and an owned `Failed` Pod whose `worker` exits with code `1`.

  Checks observe current identity, policy and failure evidence, not every previous execution or editing history. A scheduled child may take more than a minute to appear.
debrief: Changing a current Job does not supply a recurring execution policy. Construction of the future controller
  and inspection of an actual failed child establish both boundaries without replacing the original evidence.
stages.0.brief: Contain the current failure and construct bounded recurring validation.
hints.0.text: An existing Job and the template for future Jobs are separate policy boundaries. Retaining the current
  failure does not itself establish safe recurring execution.
hints.1.text: |-
  Inspect the existing Job, its failed Pods and the contract. Use the observed workload when constructing future execution; no recurring controller is supplied initially.

  ```sh
  cat batch-contract.json
  kubectl get job importer -o yaml
  kubectl describe job importer
  kubectl get pods -l job-name=importer
  kubectl logs -l job-name=importer --all-containers=true --prefix=true
  ```
hints.2.text: |-
  Verify the declared recurring policy, the retained original Job and a bounded failed child. Match child ownership to the CronJob, then match its failed worker Pod to that child; the worker must exit with code 1.

  - `kubectl get cronjob validation-cycle -o yaml`
  - `kubectl get job importer -o yaml`
  - `kubectl get jobs -o yaml`
  - `kubectl get pods -o yaml`
phrases.0: I distinguished retry count from execution deadline.
phrases.1: I preserved the failed Job for diagnosis.
phrases.2: I verified the terminal condition and actual container exit code.
questions.0.points.0: Distinguish transient failures from invalid input.
questions.0.points.1: Bound retry attempts and total execution time.
questions.0.points.2: Preserve failure evidence for diagnosis.
questions.0.prompt: When should a failed Job stop retrying?
questions.1.points.0: It bounds retries rather than wall-clock duration.
questions.1.points.1: activeDeadlineSeconds bounds the Job execution window.
questions.1.points.2: Inspect controller conditions and terminated containers.
questions.1.prompt: Does backoffLimit count elapsed seconds?
diagnostics.uid: original-job-uid must be nonempty and match job/importer UID.
diagnostics.worker_command: job/importer must contain a worker with command `["sh", "-c", "echo invalid-route >&2;
  exit 1"]`.
diagnostics.restart: job/importer restartPolicy must equal Never.
diagnostics.failed_count: job/importer status.failed must be at least 1.
diagnostics.failed_condition: job/importer Failed must equal True.
diagnostics.failed_pod: A Failed Pod controlled by job/importer with the original UID must have a worker container
  terminated with exit code 1.
diagnostics.field_backofflimit: job/importer backoffLimit must equal 1.
diagnostics.field_activedeadlineseconds: job/importer activeDeadlineSeconds must equal 30.
diagnostics.field_parallelism: job/importer parallelism must equal 1.
stages.0.objectives.0.text: The original validation Job keeps its identity and supplied command, runs one attempt
  at a time and never restarts a failed container.
stages.0.objectives.1.text: Bound both the original Job and recurring executions to retry limit `1` and execution
  time `30` seconds. Every execution uses the supplied workload image and command and represents one validation.
  The recurring validator specified in the contract is enabled on its declared every-minute schedule. Preserve an
  active execution rather than overlap or cancel it when another schedule arrives.
stages.0.objectives.2.text: Both the original Job and at least one current scheduled child reach `Failed=True` with
  at least `1` failed attempt and an owned `Failed` Pod whose `worker` exits with code `1`.
diagnostics.batch_current: The original Job could not be observed.
diagnostics.batch_original: The original Job must retain its identity and supplied workload.
diagnostics.batch_recurrence: The declared recurring validator must be enabled every minute and preserve an active
  execution without overlap.
diagnostics.batch_template: The recurring template must retain the supplied workload and all declared execution
  bounds.
diagnostics.batch_child: No current bounded failed Job owned by the recurring validator was observed.
diagnostics.batch_failed_pod: No Failed worker Pod with exit code 1 owned by that bounded scheduled Job was observed.
diagnostics.probe_0_1: Current observations could not verify the original and recurring execution policy.
diagnostics.probe_0_2: Current observations could not verify the original and scheduled failure evidence.
