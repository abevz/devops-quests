title: Job retry policy
brief: 'Work in `~/quest` and read `job.json` and `original-job-uid`. The existing `importer` Job runs a failing data-validation command. A Job controller creates Pods and records failed attempts; `backoffLimit` bounds retries while `activeDeadlineSeconds` bounds elapsed time. Patch the existing Job instead of replacing it, retaining its supplied command. The linked guide helps inspect failing Pods.


  Set `backoffLimit` to 1 and `activeDeadlineSeconds` to 30; keep `parallelism` 1 and `restartPolicy` `Never`. Wait for a `Failed=True` Job condition. Verify the Job UID matches `/run/dq/facts/0/original-job-uid`, its failed count is at least 1, and a failed Pod owned by that Job has a terminated `worker` container with exit code 1. The controller may record different failure reasons or counts as it runs. These checks observe current identity, settings and failure evidence; they do not prove the command was never changed. Work only in the offline bay.'
debrief: The failing workload stops predictably while retaining evidence for diagnosis.
stages.0.brief: The original Job UID, limits, parallelism, restart policy, failed condition and owned Pod exit evidence match the brief.
stages.0.objectives.0.text: The original Job UID, limits, parallelism, restart policy, failed condition and owned Pod exit evidence match the brief.
hints.0.text: A permanent data error is not repaired by unlimited retries.
hints.1.text: backoffLimit and activeDeadlineSeconds constrain different dimensions.
hints.2.text: Patch the existing Job limits and inspect Failed conditions plus terminated
  exit codes.
phrases.0: I distinguished retry count from execution deadline.
phrases.1: I preserved the failed Job for diagnosis.
phrases.2: I verified the terminal condition and actual container exit code.
questions.0.points.0: Distinguish transient failures from invalid input.
questions.0.points.1: Bound retry attempts and total execution time.
questions.0.points.2: Preserve failure evidence for diagnosis.
questions.0.prompt: When should a failed Job stop retrying?
questions.1.points.0: It bounds retries rather than wall-clock duration.
questions.1.points.1: activeDeadlineSeconds bounds the Job execution window.
questions.1.points.2: Inspect controller conditions and terminated containers.
questions.1.prompt: Does backoffLimit count elapsed seconds?
