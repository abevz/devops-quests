title: Job retry policy
brief: 'The batch workload keeps failing validation. Bound its failure handling while preserving its identity
  and failure evidence.


  Work in `~/quest` on the workstation. Supplied files: `job.yaml`.


  **Requirements:**

  - The original validation Job keeps its identity and supplied command, runs one attempt at a time and never
  restarts a failed container.

  - Job `importer` bounds retries at `1` and execution time at `30` seconds.

  - Job `importer` reaches `Failed=True` with at least `1` failed attempt and a controlled `Failed` Pod whose
  `worker` exits with code `1`.


  The controller may record different reasons or counts; checks observe current identity, settings and failure
  evidence, not whether the command was never changed.

  '
debrief: The failing workload stops predictably while retaining evidence for diagnosis.
stages.0.brief: The original batch workload must stop predictably with observable failure evidence.
hints.0.text: A permanent data error is not repaired by unlimited retries.
hints.1.text: 'backoffLimit and activeDeadlineSeconds constrain different dimensions.


  Inspect the supplied definitions, current resources and events.


  ```sh

  cat job.yaml

  kubectl describe job importer

  kubectl get pods -l job-name=importer -o yaml

  ```'
hints.2.text: 'Patch the existing Job limits and inspect Failed conditions plus terminated exit codes.


  Verify the observed result:


  ```sh

  kubectl get job importer

  kubectl get pods -l job-name=importer

  ```


  The Job is Failed, and a controlled Pod failed with worker exit code 1; inspect its termination details through
  hint 2.


  Supplied constraints and details: The original Job `importer` keeps its supplied `worker` validation command,
  parallelism `1` and Pod restart policy `Never`.'
phrases.0: I distinguished retry count from execution deadline.
phrases.1: I preserved the failed Job for diagnosis.
phrases.2: I verified the terminal condition and actual container exit code.
questions.0.points.0: Distinguish transient failures from invalid input.
questions.0.points.1: Bound retry attempts and total execution time.
questions.0.points.2: Preserve failure evidence for diagnosis.
questions.0.prompt: When should a failed Job stop retrying?
questions.1.points.0: It bounds retries rather than wall-clock duration.
questions.1.points.1: activeDeadlineSeconds bounds the Job execution window.
questions.1.points.2: Inspect controller conditions and terminated containers.
questions.1.prompt: Does backoffLimit count elapsed seconds?
diagnostics.uid: original-job-uid must be nonempty and match job/importer UID.
diagnostics.worker_command: job/importer must contain a worker with command `["sh", "-c", "echo invalid-route
  >&2; exit 1"]`.
diagnostics.restart: job/importer restartPolicy must equal Never.
diagnostics.failed_count: job/importer status.failed must be at least 1.
diagnostics.failed_condition: job/importer Failed must equal True.
diagnostics.failed_pod: A Failed Pod controlled by job/importer with the original UID must have a worker container
  terminated with exit code 1.
diagnostics.field_backofflimit: job/importer backoffLimit must equal 1.
diagnostics.field_activedeadlineseconds: job/importer activeDeadlineSeconds must equal 30.
diagnostics.field_parallelism: job/importer parallelism must equal 1.
stages.0.objectives.0.text: The original validation Job keeps its identity and supplied command, runs one attempt
  at a time and never restarts a failed container.
stages.0.objectives.1.text: Job `importer` bounds retries at `1` and execution time at `30` seconds.
stages.0.objectives.2.text: Job `importer` reaches `Failed=True` with at least `1` failed attempt and a controlled
  `Failed` Pod whose `worker` exits with code `1`.
