title: Job retry policy
brief: |-
  The validator is failing, and regular validation must be restored without losing its existing failure evidence.

  Work on the workstation in `~/quest` with `batch-contract.json`. The original validation Job is available through Kubernetes; no complete recurring workload manifest is supplied.

  **Requirements:**

  - Keep the original validation Job identity, supplied command, one attempt at a time and no container restart.
  - Bound both the original Job and recurring executions to retry limit `1` and execution time `30` seconds. Every execution uses the supplied workload image and command and represents one validation.
  - The recurring validator specified in the contract is enabled on its declared every-minute schedule. Preserve an active execution rather than overlap or cancel it when another schedule arrives.
  - Both the original Job and at least one current scheduled child reach `Failed=True` with at least `1` failed attempt and an owned `Failed` Pod whose `worker` exits with code `1`.

  Checks observe current identity, policy and failure evidence, not every previous execution or editing history. A scheduled child may take more than a minute to appear.
debrief: Changing a current Job does not supply a recurring execution policy. Construction of the future controller
  and inspection of an actual failed child establish both boundaries without replacing the original evidence.
stages.0.brief: Contain the current failure and construct bounded recurring validation.
hints.0.text: An existing Job and the template for future Jobs are separate policy boundaries. Retaining the current
  failure does not itself establish safe recurring execution.
hints.1.text: |-
  Inspect the existing Job, its failed Pods and the supplied contract. Look for the image, command and restart policy in the Job template and the separate recurring execution limits in batch-contract.json.

  ```sh
  cat batch-contract.json
  kubectl get job importer -o yaml
  kubectl describe job importer
  kubectl get pods -l job-name=importer
  kubectl logs -l job-name=importer --all-containers=true --prefix=true
  ```
hints.2.text: |-
  Verify the declared recurring policy, the retained original Job and a bounded failed child. Match child ownership to the CronJob, then match its failed worker Pod to that child; the worker must exit with code 1.

  - `kubectl get cronjob validation-cycle -o yaml`
  - `kubectl get job importer -o yaml`
  - `kubectl get jobs -o yaml`
  - `kubectl get pods -o yaml`
phrases.0: I distinguished retry count from execution deadline.
phrases.1: I preserved the failed Job for diagnosis.
phrases.2: I verified the terminal condition and actual container exit code.
questions.0.points.0: Distinguish transient failures from invalid input.
questions.0.points.1: Bound retry attempts and total execution time.
questions.0.points.2: Preserve failure evidence for diagnosis.
questions.0.prompt: When should a failed Job stop retrying?
questions.1.points.0: It bounds retries rather than wall-clock duration.
questions.1.points.1: activeDeadlineSeconds bounds the Job execution window.
questions.1.points.2: Inspect controller conditions and terminated containers.
questions.1.prompt: Does backoffLimit count elapsed seconds?
stages.0.objectives.0.text: The original validation Job keeps its identity and supplied command, runs one attempt
  at a time and never restarts a failed container.
stages.0.objectives.1.text: Bound both the original Job and recurring executions to retry limit `1` and execution
  time `30` seconds. Every execution uses the supplied workload image and command and represents one validation.
  The recurring validator specified in the contract is enabled on its declared every-minute schedule. Preserve an
  active execution rather than overlap or cancel it when another schedule arrives.
stages.0.objectives.2.text: Both the original Job and at least one current scheduled child reach `Failed=True` with
  at least `1` failed attempt and an owned `Failed` Pod whose `worker` exits with code `1`.
diagnostics.uid: Recreating importer changes its frozen UID; repair the existing Job, and inspect API access if the original object cannot be read. [Cause and check](guides#guide=kubernetes-20&section=batch-preserve-original-job)
diagnostics.worker_command: Replacing the supplied failing command with success hides the validation failure; retain the original worker command from the live Job and frozen facts. [Cause and check](guides#guide=kubernetes-20&section=batch-retain-failing-worker-command)
diagnostics.restart: A Pod restart policy other than Never can retry inside a Pod instead of leaving the expected failed execution; retain the supplied policy. [Cause and check](guides#guide=kubernetes-20&section=batch-never-restart-policy)
diagnostics.field_parallelism: Parallelism may have been increased while editing retry limits; keep importer parallelism at one and check API output if the field cannot be observed. [Cause and check](guides#guide=kubernetes-20&section=batch-single-parallel-execution)
diagnostics.field_backofflimit: The supplied Job retries up to 100 times; reduce backoffLimit to one on the existing Job so the failed validation becomes bounded. [Cause and check](guides#guide=kubernetes-20&section=batch-bound-current-job-retries)
diagnostics.field_activedeadlineseconds: The supplied activeDeadlineSeconds is 300; set the existing Job deadline to the required 30 seconds rather than deleting its execution. [Cause and check](guides#guide=kubernetes-20&section=batch-bound-current-job-deadline)
diagnostics.batch_current: The current Job may be missing or its API request, JSON parsing or timeout may fail; inspect importer availability before the original-workload comparison. [Cause and check](guides#guide=kubernetes-20&section=batch-current-job-api-observation)
diagnostics.batch_original: The current Job may have been replaced or its original image, worker command or Never policy changed; compare it with the frozen batch identities. [Cause and check](guides#guide=kubernetes-20&section=batch-original-image-command-and-identity)
diagnostics.batch_recurrence: The recurring CronJob may be absent, suspended, use another schedule or allow overlap; compare its live policy with batch-contract.json. API/timeout errors reading it use this marker too. [Cause and check](guides#guide=kubernetes-20&section=batch-active-cron-schedule-and-concurrency)
diagnostics.batch_template: The CronJob template may retain the original broad retry/deadline values or change the workload; propagate all four exact execution bounds and the original image, command and Never policy. [Cause and check](guides#guide=kubernetes-20&section=batch-bounded-recurring-job-template)
diagnostics.failed_count: The failing command may not have run yet or its failure was hidden; retain the original Job and inspect its failed attempt count and events. [Cause and check](guides#guide=kubernetes-20&section=batch-observe-current-failed-attempt)
diagnostics.failed_condition: The Job may still be retrying under old limits or has not reached terminal failure; verify its bounded policy and wait for Failed=True. [Cause and check](guides#guide=kubernetes-20&section=batch-terminal-current-job-failure)
diagnostics.failed_pod: A label alone does not prove the failed Pod belongs to the original Job; inspect controller owner UID, Failed phase and worker termination with exit code one. [Cause and check](guides#guide=kubernetes-20&section=batch-original-job-owned-failed-pod)
diagnostics.batch_child: A valid template alone leaves no execution evidence; wait for an actual CronJob-owned bounded child Job that has failed. API/timeouts reading Jobs also use this marker. [Cause and check](guides#guide=kubernetes-20&section=batch-observed-cron-owned-failed-job)
diagnostics.batch_failed_pod: The recurring execution may lack a failed Pod with the original workload and exit code one; trace CronJob to child Job to Pod by controller UIDs. API/timeouts reading Pods also use this marker. [Cause and check](guides#guide=kubernetes-20&section=batch-child-owner-chain-and-real-exit)
diagnostics.probe_0_1: The earlier 8s legacy check can time out before emitting a marker, for example on a stalled kubectl request; helper startup or frozen-fact errors also leave this fallback. API/timeouts inside the Python observer use the requested object marker. [Cause and check](guides#guide=kubernetes-20&section=batch-policy-startup-fallback)
diagnostics.probe_0_2: The earlier 8s legacy check can time out before emitting a marker, for example on a stalled kubectl request; helper startup or frozen-fact errors also leave this fallback. API/timeouts inside the Python observer use the requested object marker. [Cause and check](guides#guide=kubernetes-20&section=batch-evidence-startup-fallback)
