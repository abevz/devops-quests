title: Job Wiederholungsrichtlinie
brief: 'Arbeite in `~/quest` und lies `job.json` und `original-job-uid`. Der vorhandene Job `importer` führt einen fehlschlagenden Datenprüfbefehl aus. Der Job-Controller erstellt Pods und zählt Fehlversuche; `backoffLimit` begrenzt Wiederholungen, `activeDeadlineSeconds` die verstrichene Zeit. Patche den vorhandenen Job statt ihn zu ersetzen und behalte den bereitgestellten Befehl. Die verlinkte Anleitung hilft beim Untersuchen fehlgeschlagener Pods.


  Setze `backoffLimit` auf 1 und `activeDeadlineSeconds` auf 30; behalte `parallelism` 1 und `restartPolicy` `Never`. Warte auf eine Job-Bedingung `Failed=True`. Prüfe, dass die Job-UID `/run/dq/facts/0/original-job-uid` entspricht, der Fehlerzähler mindestens 1 ist und ein fehlgeschlagener Pod dieses Jobs einen beendeten Container `worker` mit Exitcode 1 hat. Der Controller kann unterschiedliche Fehlergründe und -zahlen erfassen. Die Prüfungen beobachten aktuelle Identität, Einstellungen und Fehlerbelege; sie beweisen nicht, dass der Befehl nie geändert wurde. Arbeite nur in der Offline-Umgebung.'
debrief: Die fehlgeschlagene Arbeitsbelastung stoppt vorhersehbar, während Beweise für die Diagnose erhalten
  bleiben.
stages.0.brief: Ursprüngliche Job-UID, Grenzen, Parallelität, Neustartregel, Fehlerbedingung und Exit-Beleg eines zugehörigen Pods entsprechen der Aufgabe.
stages.0.objectives.0.text: Ursprüngliche Job-UID, Grenzen, Parallelität, Neustartregel, Fehlerbedingung und Exit-Beleg eines zugehörigen Pods entsprechen der Aufgabe.
hints.0.text: Ein dauerhafter Datenfehler kann nicht durch unbegrenzte Wiederholungsversuche behoben werden.
hints.1.text: Für backoffLimit und activeDeadlineSeconds gelten unterschiedliche Abmessungen.
hints.2.text: Patchen Sie die vorhandenen Grenzwerte Job und inspect Failed conditions sowie das terminierte
  exit codes.
phrases.0: Ich habe die Anzahl der Wiederholungsversuche von der Ausführung deadline unterschieden.
phrases.1: Ich habe den ausgefallenen Job zur Diagnose aufbewahrt.
phrases.2: Ich habe das Terminal condition und den tatsächlichen Container exit code überprüft.
questions.0.points.0: Unterscheiden Sie vorübergehende Fehler von ungültigen Eingaben.
questions.0.points.1: Begrenzte Wiederholungsversuche und Gesamtausführungszeit.
questions.0.points.2: Bewahren Sie Fehlernachweise für die Diagnose auf.
questions.0.prompt: Wann sollte ein fehlgeschlagener Job mit dem erneuten Versuch aufhören?
questions.1.points.0: Es begrenzt die Wiederholungsversuche und nicht die Dauer der Wanduhr.
questions.1.points.1: activeDeadlineSeconds begrenzt das Ausführungsfenster Job.
questions.1.points.2: Überprüfen Sie den Controller conditions und die abgeschlossenen Container.
questions.1.prompt: Zählt backoffLimit die verstrichenen Sekunden?
