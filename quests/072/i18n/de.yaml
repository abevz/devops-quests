title: Job Wiederholungsrichtlinie
brief: "Der Batch-Workload scheitert wiederholt an der Validierung. Begrenzen Sie die Fehlerbehandlung und bewahren\
  \ Sie Identität und Fehlernachweise.\n\nArbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte Dateien:\
  \ `job.yaml`, `original-job-uid`.\n\n**Anforderungen:**\n- Der ursprüngliche Job `importer` behält den bereitgestellten\
  \ Validierungsbefehl von `worker`, Parallelität `1` und Pod-Neustartrichtlinie `Never`.\n  - Referenzen für ursprüngliche\
  \ Identität und Befehl auf der Workstation: `/run/dq/facts/0/original-job-uid` und `~/quest/job.yaml`.\n- Job\
  \ `importer` begrenzt Wiederholungen auf `1` und die Ausführungszeit auf `30` Sekunden.\n- Job `importer` erreicht\
  \ `Failed=True` mit mindestens `1` fehlgeschlagenem Versuch und einem kontrollierten Pod `Failed`, dessen `worker`\
  \ mit Code `1` endet.\n\n**Vor Check & finish selbst prüfen:**\nFühren Sie diese Beobachtungsbefehle in `~/quest`\
  \ auf der Workstation aus; `kubectl exec` beobachtet den Container des genannten Workloads.\n- Einstellungen,\
  \ Identität und Status entsprechen den Anforderungen.\n\n  ```sh\n  kubectl get job importer -o yaml\n  cat /run/dq/facts/0/original-job-uid\n\
  \  ```\n- `kubectl get pods -l job-name=importer -o json` — Ein fehlgeschlagener Pod des ursprünglichen Jobs zeigt\
  \ Container `worker` beendet mit Code `1`.\n\nDer Controller kann verschiedene Gründe oder Zähler erfassen; geprüft\
  \ werden aktuelle Identität, Einstellungen und Fehlernachweise, nicht die unveränderte Befehlshistorie.\n"
debrief: Die fehlgeschlagene Arbeitsbelastung stoppt vorhersehbar, während Beweise für die Diagnose erhalten bleiben.
stages.0.brief: 'Der ursprüngliche Batch-Workload muss vorhersehbar mit beobachtbaren Fehlernachweisen enden.

  '
hints.0.text: Ein dauerhafter Datenfehler kann nicht durch unbegrenzte Wiederholungsversuche behoben werden.
hints.1.text: Für backoffLimit und activeDeadlineSeconds gelten unterschiedliche Abmessungen.
hints.2.text: Patchen Sie die vorhandenen Grenzwerte Job und inspect Failed conditions sowie das terminierte exit
  codes.
phrases.0: Ich habe die Anzahl der Wiederholungsversuche von der Ausführung deadline unterschieden.
phrases.1: Ich habe den ausgefallenen Job zur Diagnose aufbewahrt.
phrases.2: Ich habe das Terminal condition und den tatsächlichen Container exit code überprüft.
questions.0.points.0: Unterscheiden Sie vorübergehende Fehler von ungültigen Eingaben.
questions.0.points.1: Begrenzte Wiederholungsversuche und Gesamtausführungszeit.
questions.0.points.2: Bewahren Sie Fehlernachweise für die Diagnose auf.
questions.0.prompt: Wann sollte ein fehlgeschlagener Job mit dem erneuten Versuch aufhören?
questions.1.points.0: Es begrenzt die Wiederholungsversuche und nicht die Dauer der Wanduhr.
questions.1.points.1: activeDeadlineSeconds begrenzt das Ausführungsfenster Job.
questions.1.points.2: Überprüfen Sie den Controller conditions und die abgeschlossenen Container.
questions.1.prompt: Zählt backoffLimit die verstrichenen Sekunden?
diagnostics.uid: Die original-job-uid darf nicht leer sein und muss der UID von job/importer entsprechen.
diagnostics.worker_command: job/importer muss worker mit dem Befehl `["sh", "-c", "echo invalid-route >&2; exit
  1"]` enthalten.
diagnostics.restart: job/importer restartPolicy muss Never entsprechen.
diagnostics.failed_count: job/importer status.failed muss mindestens 1 sein.
diagnostics.failed_condition: job/importer Failed muss True entsprechen.
diagnostics.failed_pod: Ein Failed-Pod, der von job/importer mit der ursprünglichen UID kontrolliert wird, muss
  einen mit Code 1 beendeten worker-Container haben.
diagnostics.field_backofflimit: job/importer backoffLimit muss 1 entsprechen.
diagnostics.field_activedeadlineseconds: job/importer activeDeadlineSeconds muss 30 entsprechen.
diagnostics.field_parallelism: job/importer parallelism muss 1 entsprechen.
stages.0.objectives.0.text: Der ursprüngliche Job `importer` behält den bereitgestellten Validierungsbefehl von
  `worker`, Parallelität `1` und Pod-Neustartrichtlinie `Never`.
stages.0.objectives.1.text: Job `importer` begrenzt Wiederholungen auf `1` und die Ausführungszeit auf `30` Sekunden.
stages.0.objectives.2.text: Job `importer` erreicht `Failed=True` mit mindestens `1` fehlgeschlagenem Versuch und
  einem kontrollierten Pod `Failed`, dessen `worker` mit Code `1` endet.
