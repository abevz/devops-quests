title: Job Wiederholungsrichtlinie
brief: |-
  Der Validator schlägt fehl; regelmäßige Validierung muss wiederhergestellt werden, ohne vorhandene Fehlerbelege zu verlieren.

  Arbeite auf der Workstation in `~/quest` mit `batch-contract.json`. Der ursprüngliche Job ist über Kubernetes verfügbar; ein vollständiges Manifest für regelmäßige Ausführung wird nicht geliefert.

  **Anforderungen:**

  - Erhalte Identität und vorgegebenen Befehl des ursprünglichen Validierungs-Jobs, einen Versuch gleichzeitig und keine Container-Neustarts.
  - Begrenze ursprünglichen Job und regelmäßige Ausführungen auf Wiederholungslimit `1` und Laufzeit `30` Sekunden. Jede Ausführung nutzt vorgegebenes Workload-Image und Befehl für eine Validierung.
  - Der im Vertrag bestimmte regelmäßige Validator ist mit dem angegebenen minütlichen Zeitplan aktiviert. Erhalte eine aktive Ausführung, statt sie bei einem weiteren Termin zu überlappen oder abzubrechen.
  - Ursprünglicher Job und mindestens ein aktueller geplanter Kind-Job erreichen `Failed=True` mit mindestens `1` fehlgeschlagenem Versuch und einem eigenen `Failed` Pod, dessen `worker` mit Code `1` endet.

  Prüfungen beobachten aktuelle Identität, Richtlinie und Fehlerbelege, nicht jede frühere Ausführung oder den Änderungsverlauf. Ein geplantes Kind kann erst nach mehr als einer Minute erscheinen.
debrief: Die Änderung eines aktuellen Jobs liefert keine regelmäßige Ausführungsrichtlinie. Der zukünftige Controller
  und ein tatsächlich fehlgeschlagenes Kind belegen beide Grenzen, ohne ursprüngliche Belege zu ersetzen.
stages.0.brief: Begrenze den aktuellen Fehler und konstruiere begrenzte regelmäßige Validierung.
hints.0.text: Ein bestehender Job und die Vorlage zukünftiger Jobs sind getrennte Richtliniengrenzen. Das Erhalten
  des aktuellen Fehlers schafft noch keine sichere regelmäßige Ausführung.
hints.1.text: |-
  Untersuche den vorhandenen Job, seine fehlgeschlagenen Pods und den bereitgestellten Vertrag. Suche in der Job-Vorlage nach Image, Befehl und Neustartrichtlinie sowie in batch-contract.json nach den eigenen Grenzen für wiederkehrende Ausführungen.

  ```sh
  cat batch-contract.json
  kubectl get job importer -o yaml
  kubectl describe job importer
  kubectl get pods -l job-name=importer
  kubectl logs -l job-name=importer --all-containers=true --prefix=true
  ```
hints.2.text: |-
  Prüfe regelmäßige Richtlinie, erhaltenen ursprünglichen Job und ein begrenztes fehlgeschlagenes Kind. Ordne die Kind-Eigentümerschaft dem CronJob zu und dessen fehlgeschlagenen worker Pod dem Kind; worker muss mit Code 1 enden.

  - `kubectl get cronjob validation-cycle -o yaml`
  - `kubectl get job importer -o yaml`
  - `kubectl get jobs -o yaml`
  - `kubectl get pods -o yaml`
phrases.0: Ich habe die Anzahl der Wiederholungsversuche von der Ausführung deadline unterschieden.
phrases.1: Ich habe den ausgefallenen Job zur Diagnose aufbewahrt.
phrases.2: Ich habe das Terminal condition und den tatsächlichen Container exit code überprüft.
questions.0.points.0: Unterscheiden Sie vorübergehende Fehler von ungültigen Eingaben.
questions.0.points.1: Begrenzte Wiederholungsversuche und Gesamtausführungszeit.
questions.0.points.2: Bewahren Sie Fehlernachweise für die Diagnose auf.
questions.0.prompt: Wann sollte ein fehlgeschlagener Job mit dem erneuten Versuch aufhören?
questions.1.points.0: Es begrenzt die Wiederholungsversuche und nicht die Dauer der Wanduhr.
questions.1.points.1: activeDeadlineSeconds begrenzt das Ausführungsfenster Job.
questions.1.points.2: Überprüfen Sie den Controller conditions und die abgeschlossenen Container.
questions.1.prompt: Zählt backoffLimit die verstrichenen Sekunden?
stages.0.objectives.0.text: Der ursprüngliche Validierungs-Job behält seine Identität und den mitgelieferten Befehl,
  führt jeweils einen Versuch aus und startet fehlgeschlagene Container nicht neu.
stages.0.objectives.1.text: Begrenze ursprünglichen Job und regelmäßige Ausführungen auf Wiederholungslimit `1`
  und Laufzeit `30` Sekunden. Jede Ausführung nutzt vorgegebenes Workload-Image und Befehl für eine Validierung.
  Der im Vertrag bestimmte regelmäßige Validator ist mit dem angegebenen minütlichen Zeitplan aktiviert. Erhalte
  eine aktive Ausführung, statt sie bei einem weiteren Termin zu überlappen oder abzubrechen.
stages.0.objectives.2.text: Ursprünglicher Job und mindestens ein aktueller geplanter Kind-Job erreichen `Failed=True`
  mit mindestens `1` fehlgeschlagenem Versuch und einem eigenen `Failed` Pod, dessen `worker` mit Code `1` endet.
diagnostics.uid: Neuanlegen von importer ändert die eingefrorene UID; korrigieren Sie den vorhandenen Job und prüfen Sie API-Zugriff bei unlesbarem Original. [Ursache und Prüfung](guides#guide=kubernetes-20&section=batch-preserve-original-job)
diagnostics.worker_command: Ersetzen des gelieferten fehlschlagenden Befehls durch Erfolg verbirgt den Validierungsfehler; erhalten Sie den ursprünglichen worker Befehl aus Live-Job und eingefrorenen Facts. [Ursache und Prüfung](guides#guide=kubernetes-20&section=batch-retain-failing-worker-command)
diagnostics.restart: Eine Restart-Policy außer Never kann innerhalb des Pods wiederholen, statt die erwartete fehlgeschlagene Ausführung zu hinterlassen; erhalten Sie die gelieferte Policy. [Ursache und Prüfung](guides#guide=kubernetes-20&section=batch-never-restart-policy)
diagnostics.field_parallelism: Parallelism wurde beim Ändern der Grenzen möglicherweise erhöht; erhalten Sie eins für importer und prüfen Sie API-Ausgabe bei fehlender Feldbeobachtung. [Ursache und Prüfung](guides#guide=kubernetes-20&section=batch-single-parallel-execution)
diagnostics.field_backofflimit: Der gelieferte Job erlaubt 100 Wiederholungen; reduzieren Sie backoffLimit beim bestehenden Job auf eins, um die fehlschlagende Validierung zu begrenzen. [Ursache und Prüfung](guides#guide=kubernetes-20&section=batch-bound-current-job-retries)
diagnostics.field_activedeadlineseconds: Geliefertes activeDeadlineSeconds ist 300; setzen Sie die Frist des vorhandenen Jobs auf erforderliche 30 Sekunden, statt die Ausführung zu löschen. [Ursache und Prüfung](guides#guide=kubernetes-20&section=batch-bound-current-job-deadline)
diagnostics.batch_current: Der aktuelle Job fehlt möglicherweise oder API-Anfrage, JSON-Verarbeitung oder Zeitlimit scheitern; prüfen Sie importer vor dem Vergleich der ursprünglichen Workload. [Ursache und Prüfung](guides#guide=kubernetes-20&section=batch-current-job-api-observation)
diagnostics.batch_original: Der aktuelle Job wurde möglicherweise ersetzt oder ursprüngliches image, worker Befehl oder Never geändert; vergleichen Sie mit eingefrorenen batch-identities. [Ursache und Prüfung](guides#guide=kubernetes-20&section=batch-original-image-command-and-identity)
diagnostics.batch_recurrence: Der wiederkehrende CronJob fehlt möglicherweise, ist suspended, nutzt anderen Zeitplan oder erlaubt Überlappung; vergleichen Sie mit batch-contract.json. API-/Zeitfehler beim Lesen ergeben ebenfalls diesen Marker. [Ursache und Prüfung](guides#guide=kubernetes-20&section=batch-active-cron-schedule-and-concurrency)
diagnostics.batch_template: Das CronJob-Template behält möglicherweise breite retry/deadline Werte oder ändert die Workload; übernehmen Sie alle vier exakten Grenzen sowie ursprüngliches image, Befehl und Never. [Ursache und Prüfung](guides#guide=kubernetes-20&section=batch-bounded-recurring-job-template)
diagnostics.failed_count: Der fehlschlagende Befehl lief möglicherweise noch nicht oder sein Fehler wurde verborgen; erhalten Sie den ursprünglichen Job und prüfen Sie failed Zähler und Events. [Ursache und Prüfung](guides#guide=kubernetes-20&section=batch-observe-current-failed-attempt)
diagnostics.failed_condition: Der Job wiederholt möglicherweise noch mit alten Grenzen oder ist noch nicht endgültig fehlgeschlagen; prüfen Sie die Grenzen und warten Sie auf Failed=True. [Ursache und Prüfung](guides#guide=kubernetes-20&section=batch-terminal-current-job-failure)
diagnostics.failed_pod: Ein Label allein beweist keine Zugehörigkeit des fehlgeschlagenen Pods zum ursprünglichen Job; prüfen Sie Controller-Owner-UID, Failed Phase und worker Beendigung mit Exitcode eins. [Ursache und Prüfung](guides#guide=kubernetes-20&section=batch-original-job-owned-failed-pod)
diagnostics.batch_child: Ein gültiges Template allein belegt keine Ausführung; warten Sie auf einen tatsächlichen begrenzten, fehlgeschlagenen Kind-Job des CronJobs. API-/Zeitfehler beim Lesen von Jobs ergeben ebenfalls diesen Marker. [Ursache und Prüfung](guides#guide=kubernetes-20&section=batch-observed-cron-owned-failed-job)
diagnostics.batch_failed_pod: Der wiederkehrenden Ausführung fehlt möglicherweise ein Failed Pod mit ursprünglicher Workload und Exitcode eins; verfolgen Sie CronJob→Job→Pod über Controller-UIDs. API-/Zeitfehler beim Lesen von Pods ergeben ebenfalls diesen Marker. [Ursache und Prüfung](guides#guide=kubernetes-20&section=batch-child-owner-chain-and-real-exit)
diagnostics.probe_0_1: Die frühere Shell-Prüfung mit 8s Limit kann etwa bei blockiertem kubectl ohne Marker auslaufen; Helper-Start oder eingefrorene Facts können ebenfalls diesen Fallback verursachen. API-/Zeitfehler innerhalb des Python-Observers ergeben den Marker des angefragten Objekts. [Ursache und Prüfung](guides#guide=kubernetes-20&section=batch-policy-startup-fallback)
diagnostics.probe_0_2: Die frühere Shell-Prüfung mit 8s Limit kann etwa bei blockiertem kubectl ohne Marker auslaufen; Helper-Start oder eingefrorene Facts können ebenfalls diesen Fallback verursachen. API-/Zeitfehler innerhalb des Python-Observers ergeben den Marker des angefragten Objekts. [Ursache und Prüfung](guides#guide=kubernetes-20&section=batch-evidence-startup-fallback)
