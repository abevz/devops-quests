stages.0.objectives.1.text: Niezależny kontrolny Secret zachowuje pierwotną tożsamość i dane.
diagnostics.probe_0_1: 'Bieżące dane nie pozwalają potwierdzić tego celu: Niezależny kontrolny Secret zachowuje
  pierwotną tożsamość i dane.'
diagnostics.retirement_identity: Zmieniono tożsamość Deploymentu odbiorcy, żądaną liczbę replik lub dostarczony
  obraz.
diagnostics.retirement_state: Odbiorca nie ma jednego bieżącego gotowego Poda albo nie można sprawdzić jego przynależności.
diagnostics.retirement_source: Następca może zachowywać powiązanie z wycofywanym rodzicem, mieć inne dane niż pierwotny
  rekord albo nie występować w źródle bieżącego Poda.
diagnostics.retirement_delivery: Bajty konfiguracji zamontowane u bieżącego odbiorcy nie odpowiadają zachowanemu
  odciskowi rekordu.
diagnostics.retirement_fingerprint: Endpoint bieżącego odbiorcy nie zwraca zachowanego odcisku konfiguracji.
diagnostics.probe_0_0: Odbiorca nie ma jednego bieżącego gotowego Poda albo nie można sprawdzić jego przynależności.
