title: Finalizers i bezpieczne czyszczenie
brief: 'Pracuj tylko w zatoce offline, w `~/quest`, używając dostarczonego `cleanup-contract.json`. Finalizer opóźnia usunięcie
  do zakończenia sprzątania przez kontroler. Sprawdź ConfigMap `station` i Secret `station-record`, a następnie zakończ sprzątanie
  i usuwanie bez zmiany Secretu `control`. `station` i `station-record` muszą nie istnieć, a zapytania API muszą się powieść.
  Kontrola porównuje UID `control` z `control_uid` oraz SHA-256 uporządkowanego JSON pola `data` z `control_hash` w kontrakcie.
  Obserwuje stan końcowy i nie dowodzi kolejności działań. Nie usuwaj finalizerów z innych zasobów.


  Usuwana ConfigMap ma finalizer `training.devops-quests.local/cleanup`; jej syntetyczny Secret nie ma ownerReference dla
  garbage collection. Porównaj jego UID i etykietę `training.devops-quests.local/parent-uid` z zapisanymi UID rodzica i dziecka.
  Usuń tylko ten Secret z warunkiem UID, a następnie tylko ten finalizer, testując UID i finalizer.


  Oblicz hash z bajtów UTF-8 wyniku Python `json.dumps(data, sort_keys=True)` z domyślnymi separatorami i kodowaniem znaków.


  Kontrola nie porównuje typu Secretu control ani pozostałych metadanych.'
debrief: Kontrole sprawdziły brak obu zasobów oraz UID i hash danych Secretu control.
stages.0.brief: station i station-record nie istnieją; UID i hash danych Secretu control odpowiadają kontraktowi.
stages.0.objectives.0.text: station i station-record nie istnieją; UID i hash danych Secretu control odpowiadają kontraktowi.
hints.0.text: deletionTimestamp nie oznacza, że ​​zobowiązania finalizer zostały zakończone.
hints.1.text: Dopasuj zarówno powiązany Secret UID, jak i jego etykietę parent-UID.
hints.2.text: Wyczyść powiązany rekord przed wydaniem tylko znanego finalizer; chronić obiekt kontrolny.
phrases.0: Sprawdziłem brak obiektu nadrzędnego i rekordu.
phrases.1: Sprawdziłem UID Secretu control.
phrases.2: Porównałem hash danych Secretu control.
questions.0.points.0: Finalizator może opóźnić fizyczne usunięcie do czasu zakończenia czyszczenia.
questions.0.points.1: Sprawdź deletionTimestamp i odpowiedzialny sterownik.
questions.0.prompt: Dlaczego obiekt może pozostać po pomyślnym wykonaniu DELETE?
questions.1.points.0: Może porzucić sprzątanie i pozostawić zasoby zewnętrzne osierocone.
questions.1.points.1: Zapoznaj się z każdym obowiązkiem i ogranicz identity przed usunięciem.
questions.1.prompt: Dlaczego usunięcie każdego finalizatora jest ryzykowne?
diagnostics.config_query: kubectl get configmap/station musi się powieść.
diagnostics.config_absent: configmap/station musi być nieobecne.
diagnostics.secret_query: kubectl get secret/station-record musi się powieść.
diagnostics.secret_absent: secret/station-record musi być nieobecne.
diagnostics.control_uid: secret/control UID musi być równe cleanup-contract.json control_uid.
diagnostics.control_hash: secret/control data SHA-256 musi być równe cleanup-contract.json control_hash.
