title: Finalizers i bezpieczne czyszczenie
brief: 'ConfigMap station jest usuwany i ma znany finalizer training.devops-quests.local/cleanup. Powiązany
  syntetyczny Secret station-record celowo nie ma ownerReference dla mechanizmu garbage collection: brakujący
  kontroler musi jawnie go usunąć. Użyj zapisanych identyfikatorów UIDs i etykiety parent-UID, aby zweryfikować
  powiązanie. Usuń wyłącznie ten Secret z warunkiem wstępnym UID, a następnie usuń wyłącznie znany finalizer,
  sprawdzając UID i finalizer. Pozostaw niepowiązany kontrolny Secret bez zmian. Cel sprawdza wynikowe
  tożsamości i usunięcie zasobów, a nie kryptograficzny audyt kolejności poleceń.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `cleanup-contract.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: brak elementu nadrzędnego i powiązanego z nim rekordu; niepowiązany element
  sterujący Secret zachowuje oryginalne UID i dane.'
debrief: Odzyskiwanie zakończyło obowiązek czyszczenia i zachowało niepowiązany obiekt, zamiast ślepo
  wyczyścić wszystkie finalizers.
stages.0.brief: 'Kryteria sukcesu: Brak elementu nadrzędnego i powiązanego z nim rekordu; niepowiązany
  element sterujący Secret zachowuje oryginalne UID i dane.'
stages.0.objectives.0.text: Brak elementu nadrzędnego i powiązanego z nim rekordu; niepowiązany element
  sterujący Secret zachowuje oryginalne UID i dane.
hints.0.text: deletionTimestamp nie oznacza, że ​​zobowiązania finalizer zostały zakończone.
hints.1.text: Dopasuj zarówno powiązany Secret UID, jak i jego etykietę parent-UID.
hints.2.text: Wyczyść powiązany rekord przed wydaniem tylko znanego finalizer; chronić obiekt kontrolny.
phrases.0: Sprawdziłem zaległe zobowiązanie finalizer.
phrases.1: Użyłem UID preconditions dla powiązanego rekordu.
phrases.2: Zachowałem niepowiązany obiekt kontrolny.
questions.0.points.0: Finalizator może opóźnić fizyczne usunięcie do czasu zakończenia czyszczenia.
questions.0.points.1: Sprawdź deletionTimestamp i odpowiedzialny sterownik.
questions.0.prompt: Dlaczego obiekt może pozostać po pomyślnym wykonaniu DELETE?
questions.1.points.0: Może porzucić sprzątanie i pozostawić zasoby zewnętrzne osierocone.
questions.1.points.1: Zapoznaj się z każdym obowiązkiem i ogranicz identity przed usunięciem.
questions.1.prompt: Dlaczego usunięcie każdego finalizatora jest ryzykowne?
