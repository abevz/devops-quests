title: Finalizers i bezpieczne czyszczenie
brief: |-
  Sprzątanie station nie zostało ukończone. Osiągnij wymagany stan nieobecności, zachowując niezależny Secret control.

  Pracuj na workstation w `~/quest` z dostarczonymi plikami:
  - `cleanup-contract.json`.

  **Requirements:**

  - Usuwana konfiguracja i jej powiązany rekord nie istnieją, co potwierdzają pomyślne zapytania API.
  - Niezależny kontrolny Secret zachowuje pierwotną tożsamość i dane.

  Kontrole obserwują stan końcowy, nie kolejność działań; nie porównują typu Secret control ani innych metadanych.
debrief: Kontrole sprawdziły brak obu zasobów oraz UID i hash danych Secretu control.
stages.0.brief: Niezależny kontrolny Secret jest zachowany w stanie końcowym.
hints.0.text: deletionTimestamp nie oznacza, że ​​zobowiązania finalizer zostały zakończone.
hints.1.text: |-
  Dopasuj zarówno powiązany Secret UID, jak i jego etykietę parent-UID.

  Sprawdź dostarczone dane i bieżące obserwacje:

  ```sh
  kubectl get configmap,secret -o yaml
  cat cleanup-contract.json
  ```
hints.2.text: "Wyczyść powiązany rekord przed wydaniem tylko znanego finalizer; chronić obiekt kontrolny.\
  \ Kończony ConfigMap używa finalizera `training.devops-quests.local/cleanup`; powiązany Secret nie ma\
  \ ownerReference do odśmiecania. Porównaj jego UID i etykietę `training.devops-quests.local/parent-uid`\
  \ z zamrożonym kontraktem, usuń tylko ten Secret z warunkiem UID i zdejmij tylko ten finalizer z testami\
  \ UID/finalizera. Nie usuwaj obcych finalizerów.\n\nSprawdź wynik z `~/quest` na workstation:\n\n- Oba\
  \ zapytania kończą się powodzeniem i nie wypisują nazwy zasobu.\n\n  ```sh\n  kubectl get configmap\
  \ station --ignore-not-found -o name\n  kubectl get secret station-record --ignore-not-found -o name\n\
  \  ```\n\n- Ustawienia, tożsamości i stan odpowiadają wymaganiom.\n\n  ```sh\n  cat cleanup-contract.json\n\
  \  kubectl get secret control -o json |\n    python3 -c 'import hashlib,json,sys; x=json.load(sys.stdin);\
  \ print(x[\"metadata\"][\"uid\"]); print(hashlib.sha256(json.dumps(x[\"data\"],sort_keys=True).encode()).hexdigest())'\
  \ \n  ```"
phrases.0: Sprawdziłem brak obiektu nadrzędnego i rekordu.
phrases.1: Sprawdziłem UID Secretu control.
phrases.2: Porównałem hash danych Secretu control.
questions.0.points.0: Finalizator może opóźnić fizyczne usunięcie do czasu zakończenia czyszczenia.
questions.0.points.1: Sprawdź deletionTimestamp i odpowiedzialny sterownik.
questions.0.prompt: Dlaczego obiekt może pozostać po pomyślnym wykonaniu DELETE?
questions.1.points.0: Może porzucić sprzątanie i pozostawić zasoby zewnętrzne osierocone.
questions.1.points.1: Zapoznaj się z każdym obowiązkiem i ogranicz identity przed usunięciem.
questions.1.prompt: Dlaczego usunięcie każdego finalizatora jest ryzykowne?
