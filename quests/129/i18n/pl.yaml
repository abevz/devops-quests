title: Finalizers i bezpieczne czyszczenie
brief: |-
  Sprzątanie stacji nie zostało zakończone. Wycofaj konfigurację, zachowując obu istniejących odbiorców i niezależny kontrolny Secret.

  Pracuj na stacji roboczej w `~/quest` z dostarczonymi plikami:
  - `cleanup-contract.json`.
  - `retirement-contract.json`.

  **Wymagania:**

  - Usuwana konfiguracja i jej powiązany rekord nie istnieją, co potwierdzają pomyślne zapytania API. Każdy istniejący Deployment odbiorcy zachowuje tożsamość i dostarczony obraz oraz ma jeden bieżący gotowy Pod. Jego wolumen następcy Secret jest tylko do odczytu i dostarcza `/config/value` z danymi wycofywanego rekordu, a `http://127.0.0.1:8080` wewnątrz Poda zwraca odpowiadający odcisk. Następca jest niezależny od wycofywanego rodzica według `retirement-contract.json`.
  - Niezależny kontrolny Secret zachowuje pierwotną tożsamość i dane.

  Kontrole obserwują bieżący stan i tożsamości, nie kolejność sprzątania ani pełną historię poleceń. Typ kontrolnego Secret i niezwiązane metadane nie są porównywane.
debrief: Kontrole porównały brak wycofanych obiektów, tożsamość i dane kontrolne, niezależność następcy, bieżące
  źródła odbiorców, zamontowane bajty i odpowiedzi z odciskiem.
stages.0.brief: Zakończ wycofanie, zachowując zależnych odbiorców i niezależną konfigurację kontrolną.
hints.0.text: Usunięcie obiektu konfiguracji nie migruje odbiorców. Działający proces może zachować stare bajty,
  mimo że następny Pod nie zdoła się uruchomić. Śledź tożsamość obiektów i bieżące zależności dostarczania.
hints.1.text: |-
  Sprawdź powiązanie z rodzicem, szablony odbiorców, bieżące Pody i lokalne kontrakty. Wyświetlaj metadane oraz odwołania do źródeł bez ujawniania danych Secret:

  ```sh
  cat cleanup-contract.json retirement-contract.json
  kubectl get configmap,secret -o json | jq '.items[] | {kind,name:.metadata.name,uid:.metadata.uid,parentUID:.metadata.labels["training.devops-quests.local/parent-uid"],owners:.metadata.ownerReferences,deleting:.metadata.deletionTimestamp}'
  kubectl get deployments -o json | jq '.items[] | {name:.metadata.name,uid:.metadata.uid,volumes:.spec.template.spec.volumes,mounts:[.spec.template.spec.containers[] | {name,volumeMounts}],conditions:.status.conditions}'
  kubectl get pods -o wide
  ```
hints.2.text: |-
  Potwierdź brak obu wycofanych obiektów, zachowanie UID i skrótu danych kontrolnego Secret oraz dostarczanie konfiguracji i odcisku obu bieżącym odbiorcom:

  Zapisany obowiązek ma finalizer `training.devops-quests.local/cleanup`; porównaj jego powiązanie z obiektem, nie niezwiązany finalizer.

  ```sh
  kubectl get configmap station --ignore-not-found -o name
  kubectl get secret station-record --ignore-not-found -o name
  kubectl get secret control -o json | python3 -c 'import hashlib,json,sys; x=json.load(sys.stdin); print(x["metadata"]["uid"]); print(hashlib.sha256(json.dumps(x["data"],sort_keys=True).encode()).hexdigest())'
  kubectl get deployments,pods -o wide
  kubectl exec deployment/dispatch -c worker -- sha256sum /config/value
  kubectl exec deployment/reporter -c worker -- sha256sum /config/value
  kubectl exec deployment/dispatch -c worker -- wget -qO- -T 2 http://127.0.0.1:8080
  kubectl exec deployment/reporter -c worker -- wget -qO- -T 2 http://127.0.0.1:8080
  ```
phrases.0: Sprawdziłem brak obiektu nadrzędnego i rekordu.
phrases.1: Sprawdziłem UID Secretu control.
phrases.2: Porównałem hash danych Secretu control.
questions.0.points.0: Finalizator może opóźnić fizyczne usunięcie do czasu zakończenia czyszczenia.
questions.0.points.1: Sprawdź deletionTimestamp i odpowiedzialny sterownik.
questions.0.prompt: Dlaczego obiekt może pozostać po pomyślnym wykonaniu DELETE?
questions.1.points.0: Może porzucić sprzątanie i pozostawić zasoby zewnętrzne osierocone.
questions.1.points.1: Zapoznaj się z każdym obowiązkiem i ogranicz identity przed usunięciem.
questions.1.prompt: Dlaczego usunięcie każdego finalizatora jest ryzykowne?
stages.0.objectives.0.text: Usuwana konfiguracja i jej powiązany rekord nie istnieją, co potwierdzają pomyślne zapytania
  API. Każdy istniejący Deployment odbiorcy zachowuje tożsamość i dostarczony obraz oraz ma jeden bieżący gotowy
  Pod. Jego wolumen następcy Secret jest tylko do odczytu i dostarcza `/config/value` z danymi wycofywanego rekordu,
  a `http://127.0.0.1:8080` wewnątrz Poda zwraca odpowiadający odcisk. Następca jest niezależny od wycofywanego
  rodzica według `retirement-contract.json`.
stages.0.objectives.1.text: Niezależny kontrolny Secret zachowuje pierwotną tożsamość i dane.
diagnostics.config_query: Zapytanie API o ConfigMap station mogło się nie powieść. Ponów odczyt w przestrzeni nazw ćwiczenia i sprawdź błąd kubectl. [Przyczyna i kontrola](guides#guide=storage-lifecycle&section=q129-retired-config-query)
diagnostics.config_absent: ConfigMap station może nadal istnieć, także podczas trwającego usuwania. Sprawdź jego stan w przestrzeni nazw ćwiczenia. [Przyczyna i kontrola](guides#guide=storage-lifecycle&section=q129-retired-config-absence)
diagnostics.secret_query: Zapytanie API o Secret station-record mogło się nie powieść. Ponów odczyt samej nazwy i sprawdź błąd kubectl. [Przyczyna i kontrola](guides#guide=storage-lifecycle&section=q129-retired-record-query)
diagnostics.secret_absent: Secret station-record może nadal istnieć. Po przełączeniu konsumentów na następcę sprawdź, czy wycofanie się zakończyło. [Przyczyna i kontrola](guides#guide=storage-lifecycle&section=q129-retired-record-absence)
diagnostics.retirement_identity: Deployment konsumenta mógł zostać zastąpiony, mieć liczbę replik inną niż jeden lub używać innego obrazu worker. Porównaj dispatch i reporter z zapisanymi tożsamościami. [Przyczyna i kontrola](guides#guide=storage-lifecycle&section=q129-retirement-retained-workloads)
diagnostics.retirement_state: Kontrola może nie znaleźć dokładnie jednego bieżącego, gotowego Poda z oczekiwanym obrazem dla każdego konsumenta. Sprawdź Deployment, aktywny ReplicaSet i należący do niego Pod. [Przyczyna i kontrola](guides#guide=storage-lifecycle&section=q129-retirement-current-consumer-pod)
diagnostics.retirement_source: Montowanie następcy tylko do odczytu może się różnić między szablonem i bieżącym Podem albo Secret może mieć niewłaściwe dane, UID lub powiązanie z wycofanym rodzicem. Porównaj /config/value, metadane następcy i zapisany skrót. [Przyczyna i kontrola](guides#guide=storage-lifecycle&section=q129-retirement-independent-successor)
diagnostics.retirement_delivery: Bajty zamontowane pod /config/value mogą się różnić od pierwotnego rekordu. Porównaj skrót w każdym bieżącym worker z pierwotnym odciskiem. [Przyczyna i kontrola](guides#guide=storage-lifecycle&section=q129-retirement-mounted-record-bytes)
diagnostics.retirement_fingerprint: Aplikacja może nadal zwracać wcześniejszy lub błędny odcisk. Wyślij żądanie przez loopback do każdego bieżącego worker i porównaj odpowiedź z zapisanym odciskiem. [Przyczyna i kontrola](guides#guide=storage-lifecycle&section=q129-retirement-served-record-fingerprint)
diagnostics.probe_0_0: Kontrola wycofania mogła się zatrzymać przed zgłoszeniem warunku. Sprawdź dostarczone dane i możliwość odczytu bieżących zasobów konsumentów. [Przyczyna i kontrola](guides#guide=storage-lifecycle&section=q129-retirement-consumer-observer)
diagnostics.control_uid: Secret control może nie istnieć lub mieć inny UID. Porównaj bieżący UID z control_uid z kontraktu czyszczenia. [Przyczyna i kontrola](guides#guide=storage-lifecycle&section=q129-retirement-control-secret-identity)
diagnostics.control_hash: Dane Secret control mogły się zmienić. Porównaj skrót mapy data w JSON z posortowanymi kluczami z control_hash, zachowując poufność wartości. [Przyczyna i kontrola](guides#guide=storage-lifecycle&section=q129-retirement-control-secret-data-hash)
diagnostics.probe_0_1: Kontrola Secret mogła się zatrzymać przed zgłoszeniem warunku. Sprawdź dostarczony kontrakt czyszczenia i dostęp do Secret control. [Przyczyna i kontrola](guides#guide=storage-lifecycle&section=q129-retirement-control-secret-observer)
