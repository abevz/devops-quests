title: Finalizers und sichere Reinigung
brief: |-
  Die Station-Bereinigung ist nicht abgeschlossen. Erreichen Sie den geforderten Abwesenheitszustand und bewahren Sie das unabhängige Control-Secret.

  Arbeiten Sie auf der Workstation in `~/quest` mit den bereitgestellten Dateien:
  - `cleanup-contract.json`.

  **Requirements:**

  - Die zur Löschung vorgemerkte Konfiguration und ihr zugehöriger Datensatz fehlen, bestätigt durch erfolgreiche API-Abfragen.
  - Das unabhängige Kontroll-Secret behält seine ursprüngliche Identität und seine Daten.

  Die Prüfungen beobachten den Endzustand, nicht die Aktionsreihenfolge; Typ oder andere Metadaten des Control-Secrets werden nicht verglichen.
debrief: Die Prüfungen beobachteten beide fehlenden Ressourcen und verglichen UID und Daten-Hash des Secret
  control.
stages.0.brief: Das unabhängige Kontroll-Secret bleibt im Endzustand erhalten.
hints.0.text: Ein deletionTimestamp bedeutet nicht, dass die finalizer-Verpflichtungen erfüllt sind.
hints.1.text: |-
  Entspricht sowohl dem zugehörigen Secret UID als auch seinem parent-UID-Label.

  Prüfen Sie die bereitgestellten Eingaben und laufenden Beobachtungen:

  ```sh
  kubectl get configmap,secret -o yaml
  cat cleanup-contract.json
  ```
hints.2.text: "Bereinigen Sie den zugehörigen Datensatz, bevor Sie nur den bekannten finalizer freigeben.\
  \ Schützen Sie das Kontrollobjekt. Die terminierende ConfigMap nutzt Finalizer `training.devops-quests.local/cleanup`;\
  \ ihr zugehöriges Secret hat keine Garbage-Collection-ownerReference. Gleichen Sie UID und Label `training.devops-quests.local/parent-uid`\
  \ mit dem eingefrorenen Vertrag ab, löschen Sie nur dieses Secret mit UID-Vorbedingung und entfernen\
  \ Sie nur diesen Finalizer mit UID-/Finalizer-Tests. Keine fremden Finalizer entfernen.\n\nPrüfen Sie\
  \ das Ergebnis in `~/quest` auf der Workstation:\n\n- Beide Abfragen sind erfolgreich und geben keinen\
  \ Ressourcennamen aus.\n\n  ```sh\n  kubectl get configmap station --ignore-not-found -o name\n  kubectl\
  \ get secret station-record --ignore-not-found -o name\n  ```\n\n- Einstellungen, Identitäten und Status\
  \ entsprechen den Anforderungen.\n\n  ```sh\n  cat cleanup-contract.json\n  kubectl get secret control\
  \ -o json |\n    python3 -c 'import hashlib,json,sys; x=json.load(sys.stdin); print(x[\"metadata\"][\"\
  uid\"]); print(hashlib.sha256(json.dumps(x[\"data\"],sort_keys=True).encode()).hexdigest())' \n  ```"
phrases.0: Ich prüfte, dass Elternobjekt und Datensatz fehlen.
phrases.1: Ich prüfte die UID des Secret control.
phrases.2: Ich verglich den Daten-Hash des Secret control.
questions.0.points.0: Ein Finalizer kann die physische Entfernung verzögern, bis die Bereinigung abgeschlossen
  ist.
questions.0.points.1: Überprüfen Sie deletionTimestamp und den verantwortlichen Controller.
questions.0.prompt: Warum kann ein Objekt bestehen bleiben, nachdem DELETE erfolgreich war?
questions.1.points.0: Es kann dazu führen, dass die Bereinigung abgebrochen wird und externe Ressourcen
  verwaist bleiben.
questions.1.points.1: Verstehen Sie jede Verpflichtung und beschränken Sie identity vor dem Entfernen.
questions.1.prompt: Warum ist das Entfernen jedes Finalizers riskant?
diagnostics.config_query: kubectl get configmap/station muss erfolgreich sein.
diagnostics.config_absent: configmap/station muss fehlen.
diagnostics.secret_query: kubectl get secret/station-record muss erfolgreich sein.
diagnostics.secret_absent: secret/station-record muss fehlen.
diagnostics.control_uid: secret/control UID muss cleanup-contract.json control_uid entsprechen.
diagnostics.control_hash: secret/control data SHA-256 muss cleanup-contract.json control_hash entsprechen.
