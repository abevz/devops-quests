title: Finalizers und sichere Reinigung
brief: |-
  Die Stationsbereinigung ist noch nicht abgeschlossen. Nimm die Konfiguration außer Betrieb und erhalte beide vorhandenen Verbraucher sowie das unabhängige Kontroll-Secret.

  Arbeite auf der Workstation in `~/quest` mit den bereitgestellten Dateien:
  - `cleanup-contract.json`.
  - `retirement-contract.json`.

  **Anforderungen:**

  - Die zur Löschung vorgemerkte Konfiguration und ihr zugehöriger Datensatz fehlen, bestätigt durch erfolgreiche API-Abfragen. Jedes vorhandene Verbraucher-Deployment behält Identität und bereitgestelltes Image und hat einen aktuellen bereiten Pod. Sein schreibgeschütztes Nachfolger-Secret-Volume liefert `/config/value` mit den Daten des ausgemusterten Datensatzes; `http://127.0.0.1:8080` im Pod liefert den passenden Fingerabdruck. Der Nachfolger ist gemäß `retirement-contract.json` vom ausgemusterten Elternobjekt unabhängig.
  - Das unabhängige Kontroll-Secret behält seine ursprüngliche Identität und seine Daten.

  Prüfungen beobachten aktuellen Zustand und Identitäten, nicht Bereinigungsreihenfolge oder vollständigen Befehlsverlauf. Typ und fremde Metadaten des Kontroll-Secrets werden nicht verglichen.
debrief: Die Prüfungen verglichen Abwesenheit, Kontrollidentität und Daten, Unabhängigkeit des Nachfolgers, aktuelle
  Verbraucherquellen, gemountete Bytes und Fingerabdruckantworten.
stages.0.brief: Schließe die Ausmusterung unter Erhalt abhängiger Verbraucher und unabhängiger Kontrollkonfiguration
  ab.
hints.0.text: Das Löschen einer Konfiguration migriert ihre Verbraucher nicht. Ein laufender Prozess kann alte Bytes
  behalten, obwohl der nächste Pod nicht mehr initialisieren kann. Verfolge Objektidentität und aktuelle Lieferabhängigkeiten.
hints.1.text: |-
  Prüfe Elternzuordnung, Verbrauchervorlagen, aktuelle Pods und lokale Verträge. Gib Metadaten und Quellverweise aus, ohne Secret-Daten offenzulegen:

  ```sh
  cat cleanup-contract.json retirement-contract.json
  kubectl get configmap,secret -o json | jq '.items[] | {kind,name:.metadata.name,uid:.metadata.uid,parentUID:.metadata.labels["training.devops-quests.local/parent-uid"],owners:.metadata.ownerReferences,deleting:.metadata.deletionTimestamp}'
  kubectl get deployments -o json | jq '.items[] | {name:.metadata.name,uid:.metadata.uid,volumes:.spec.template.spec.volumes,mounts:[.spec.template.spec.containers[] | {name,volumeMounts}],conditions:.status.conditions}'
  kubectl get pods -o wide
  ```
hints.2.text: |-
  Bestätige die Abwesenheit beider ausgemusterter Objekte, erhaltene Kontroll-UID und Datenhash sowie Konfiguration und Fingerabdruck beider aktuellen Verbraucher:

  Die dokumentierte Pflicht trägt den Finalizer `training.devops-quests.local/cleanup`; prüfe seine Objektzuordnung statt eines fremden Finalizers.

  ```sh
  kubectl get configmap station --ignore-not-found -o name
  kubectl get secret station-record --ignore-not-found -o name
  kubectl get secret control -o json | python3 -c 'import hashlib,json,sys; x=json.load(sys.stdin); print(x["metadata"]["uid"]); print(hashlib.sha256(json.dumps(x["data"],sort_keys=True).encode()).hexdigest())'
  kubectl get deployments,pods -o wide
  kubectl exec deployment/dispatch -c worker -- sha256sum /config/value
  kubectl exec deployment/reporter -c worker -- sha256sum /config/value
  kubectl exec deployment/dispatch -c worker -- wget -qO- -T 2 http://127.0.0.1:8080
  kubectl exec deployment/reporter -c worker -- wget -qO- -T 2 http://127.0.0.1:8080
  ```
phrases.0: Ich prüfte, dass Elternobjekt und Datensatz fehlen.
phrases.1: Ich prüfte die UID des Secret control.
phrases.2: Ich verglich den Daten-Hash des Secret control.
questions.0.points.0: Ein Finalizer kann die physische Entfernung verzögern, bis die Bereinigung abgeschlossen ist.
questions.0.points.1: Überprüfen Sie deletionTimestamp und den verantwortlichen Controller.
questions.0.prompt: Warum kann ein Objekt bestehen bleiben, nachdem DELETE erfolgreich war?
questions.1.points.0: Es kann dazu führen, dass die Bereinigung abgebrochen wird und externe Ressourcen verwaist
  bleiben.
questions.1.points.1: Verstehen Sie jede Verpflichtung und beschränken Sie identity vor dem Entfernen.
questions.1.prompt: Warum ist das Entfernen jedes Finalizers riskant?
stages.0.objectives.0.text: Die zur Löschung vorgemerkte Konfiguration und ihr zugehöriger Datensatz fehlen, bestätigt
  durch erfolgreiche API-Abfragen. Jedes vorhandene Verbraucher-Deployment behält Identität und bereitgestelltes
  Image und hat einen aktuellen bereiten Pod. Sein schreibgeschütztes Nachfolger-Secret-Volume liefert `/config/value`
  mit den Daten des ausgemusterten Datensatzes; `http://127.0.0.1:8080` im Pod liefert den passenden Fingerabdruck.
  Der Nachfolger ist gemäß `retirement-contract.json` vom ausgemusterten Elternobjekt unabhängig.
stages.0.objectives.1.text: Das unabhängige Kontroll-Secret behält seine ursprüngliche Identität und seine Daten.
diagnostics.config_query: Die API-Abfrage nach ConfigMap station ist möglicherweise fehlgeschlagen. Wiederhole den Lesezugriff im Übungs-Namespace und prüfe den kubectl-Fehler. [Ursache und Prüfung](guides#guide=storage-lifecycle&section=q129-retired-config-query)
diagnostics.config_absent: ConfigMap station ist möglicherweise noch vorhanden, auch während einer laufenden Löschung. Prüfe den aktuellen Zustand im Übungs-Namespace. [Ursache und Prüfung](guides#guide=storage-lifecycle&section=q129-retired-config-absence)
diagnostics.secret_query: Die API-Abfrage nach Secret station-record ist möglicherweise fehlgeschlagen. Frage nur den Namen erneut ab und prüfe den kubectl-Fehler. [Ursache und Prüfung](guides#guide=storage-lifecycle&section=q129-retired-record-query)
diagnostics.secret_absent: Secret station-record ist möglicherweise noch vorhanden. Prüfe nach dem Wechsel der Verbraucher zum Nachfolger, ob die Stilllegung abgeschlossen ist. [Ursache und Prüfung](guides#guide=storage-lifecycle&section=q129-retired-record-absence)
diagnostics.retirement_identity: Ein Verbraucher-Deployment wurde möglicherweise ersetzt, auf eine andere Replikatzahl als eins skaliert oder auf ein anderes worker-Image umgestellt. Vergleiche dispatch und reporter mit den erfassten Identitäten. [Ursache und Prüfung](guides#guide=storage-lifecycle&section=q129-retirement-retained-workloads)
diagnostics.retirement_state: Die Prüfung findet möglicherweise je Verbraucher nicht genau einen aktuellen bereiten Pod mit dem erwarteten Image. Prüfe Deployment, aktives ReplicaSet und zugehörigen Pod. [Ursache und Prüfung](guides#guide=storage-lifecycle&section=q129-retirement-current-consumer-pod)
diagnostics.retirement_source: Der schreibgeschützte Nachfolger-Mount weicht möglicherweise zwischen Vorlage und aktuellem Pod ab oder Daten, UID oder Beziehung zum stillgelegten Elternobjekt stimmen nicht. Vergleiche /config/value, die Metadaten des Nachfolgers und den erfassten Hash. [Ursache und Prüfung](guides#guide=storage-lifecycle&section=q129-retirement-independent-successor)
diagnostics.retirement_delivery: Die unter /config/value eingehängten Bytes weichen möglicherweise vom ursprünglichen Eintrag ab. Vergleiche den Hash in jedem aktuellen worker mit dem ursprünglichen Fingerabdruck. [Ursache und Prüfung](guides#guide=storage-lifecycle&section=q129-retirement-mounted-record-bytes)
diagnostics.retirement_fingerprint: Die Anwendung liefert möglicherweise noch einen früheren oder falschen Fingerabdruck. Frage jeden aktuellen worker über Loopback ab und vergleiche den Inhalt mit dem erfassten Fingerabdruck. [Ursache und Prüfung](guides#guide=storage-lifecycle&section=q129-retirement-served-record-fingerprint)
diagnostics.probe_0_0: Die Stilllegungsprüfung wurde möglicherweise vor Meldung einer Bedingung abgebrochen. Prüfe bereitgestellte Daten und ob die aktuellen Verbraucherressourcen lesbar sind. [Ursache und Prüfung](guides#guide=storage-lifecycle&section=q129-retirement-consumer-observer)
diagnostics.control_uid: Secret control fehlt möglicherweise oder hat eine andere UID. Vergleiche die aktuelle UID mit control_uid aus dem Bereinigungsvertrag. [Ursache und Prüfung](guides#guide=storage-lifecycle&section=q129-retirement-control-secret-identity)
diagnostics.control_hash: Die Daten von Secret control haben sich möglicherweise geändert. Vergleiche den Hash der JSON-data-Map mit sortierten Schlüsseln mit control_hash und halte die Werte geheim. [Ursache und Prüfung](guides#guide=storage-lifecycle&section=q129-retirement-control-secret-data-hash)
diagnostics.probe_0_1: Die Prüfung von Secret control wurde möglicherweise vor Meldung einer Bedingung abgebrochen. Prüfe den bereitgestellten Bereinigungsvertrag und den Zugriff auf Secret control. [Ursache und Prüfung](guides#guide=storage-lifecycle&section=q129-retirement-control-secret-observer)
