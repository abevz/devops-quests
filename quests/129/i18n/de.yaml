diagnostics.retirement_identity: Deployment-Identität, gewünschte Anzahl oder bereitgestelltes Verbraucher-Image
  wurde geändert.
diagnostics.retirement_state: Dem Verbraucher fehlt sein einzelner aktueller bereiter Pod, oder dessen Eigentümerschaft
  ist nicht beobachtbar.
diagnostics.retirement_source: Ein Nachfolger kann die ausgemusterte Elternzuordnung behalten, abweichende Datensatzdaten
  liefern oder in der Quelle des aktuellen Pods fehlen.
diagnostics.retirement_delivery: Die im aktuellen Verbraucher gemounteten Konfigurationsbytes entsprechen nicht
  dem erhaltenen Datensatz-Fingerabdruck.
diagnostics.retirement_fingerprint: Der aktuelle Verbraucher-Endpunkt liefert nicht den erhaltenen Konfigurations-Fingerabdruck.
