title: Finalizers und sichere Reinigung
brief: 'Arbeite nur in der Offline-Umgebung in `~/quest` mit dem bereitgestellten `cleanup-contract.json`. Ein Finalizer verzögert
  das Löschen, bis sein Controller aufgeräumt hat. Untersuche die ConfigMap `station` und das Secret `station-record` und
  schließe Aufräumen und Löschen ab, ohne das Secret `control` zu ändern. `station` und `station-record` müssen fehlen und
  API-Abfragen erfolgreich sein. Die Prüfung vergleicht die UID von `control` mit `control_uid` und den SHA-256 des sortierten
  JSON von `data` mit `control_hash` im Vertrag. Sie beobachtet den Endzustand und beweist nicht die Reihenfolge. Entferne
  keine Finalizer fremder Ressourcen.


  Die zu löschende ConfigMap hat den Finalizer `training.devops-quests.local/cleanup`; ihr synthetisches Secret hat keine
  ownerReference für die Garbage Collection. Vergleiche seine UID und das Label `training.devops-quests.local/parent-uid`
  mit den gespeicherten UIDs von Eltern- und Kindobjekt. Lösche nur dieses Secret mit UID-Vorbedingung und entferne dann nur
  diesen Finalizer mit UID- und Finalizer-Tests.


  Berechne den Hash aus den UTF-8-Bytes von Python `json.dumps(data, sort_keys=True)` mit den voreingestellten Trennzeichen
  und Escapes.


  Die Prüfung vergleicht weder den Typ des Secret control noch andere Metadaten.'
debrief: Die Prüfungen beobachteten beide fehlenden Ressourcen und verglichen UID und Daten-Hash des Secret control.
stages.0.brief: station und station-record fehlen; UID und Daten-Hash des Secret control entsprechen dem Vertrag.
stages.0.objectives.0.text: station und station-record fehlen; UID und Daten-Hash des Secret control entsprechen dem Vertrag.
hints.0.text: Ein deletionTimestamp bedeutet nicht, dass die finalizer-Verpflichtungen erfüllt sind.
hints.1.text: Entspricht sowohl dem zugehörigen Secret UID als auch seinem parent-UID-Label.
hints.2.text: Bereinigen Sie den zugehörigen Datensatz, bevor Sie nur den bekannten finalizer freigeben. Schützen Sie das
  Kontrollobjekt.
phrases.0: Ich prüfte, dass Elternobjekt und Datensatz fehlen.
phrases.1: Ich prüfte die UID des Secret control.
phrases.2: Ich verglich den Daten-Hash des Secret control.
questions.0.points.0: Ein Finalizer kann die physische Entfernung verzögern, bis die Bereinigung abgeschlossen ist.
questions.0.points.1: Überprüfen Sie deletionTimestamp und den verantwortlichen Controller.
questions.0.prompt: Warum kann ein Objekt bestehen bleiben, nachdem DELETE erfolgreich war?
questions.1.points.0: Es kann dazu führen, dass die Bereinigung abgebrochen wird und externe Ressourcen verwaist bleiben.
questions.1.points.1: Verstehen Sie jede Verpflichtung und beschränken Sie identity vor dem Entfernen.
questions.1.prompt: Warum ist das Entfernen jedes Finalizers riskant?
