title: Finalizers und sichere Reinigung
brief: 'Ein ConfigMap station endet mit dem bekannten training.devops-quests.local/cleanup finalizer.
  Der zugehörige synthetische Secret station-record verfügt absichtlich über keine Garbage Collection
  ownerReference: Der fehlende Controller muss ihn explizit bereinigen. Verwenden Sie die eingefrorenen
  Etiketten UIDs und parent-UID, um die Zuordnung zu überprüfen. Löschen Sie nur das Secret mit einem
  UID precondition und entfernen Sie dann nur das bekannte finalizer mit UID- und finalizer-Tests. Lassen
  Sie den nicht verwandten control Secret unverändert. Das Ziel ist die Überprüfung des resultierenden
  identities und die Bereinigung, keine kryptografische Prüfung der Befehlsreihenfolge.


  Questdateien in `~/quest` (einige erscheinen in späteren Phasen): `cleanup-contract.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Anfängliche Erfolgskriterien: Der übergeordnete Datensatz und der zugehörige Datensatz fehlen. Der nicht
  verwandte control Secret behält seinen ursprünglichen UID und seine Daten.'
debrief: Die Wiederherstellung erfüllte die Bereinigungspflicht und bewahrte ein unabhängiges Objekt,
  anstatt blind alles finalizers zu löschen.
stages.0.brief: 'Erfolgskriterien: Der übergeordnete Datensatz und der zugehörige Datensatz fehlen; Der
  nicht verwandte control Secret behält seinen ursprünglichen UID und seine Daten.'
stages.0.objectives.0.text: Der übergeordnete Datensatz und der zugehörige Datensatz fehlen. Der nicht
  verwandte control Secret behält seinen ursprünglichen UID und seine Daten.
hints.0.text: Ein deletionTimestamp bedeutet nicht, dass die finalizer-Verpflichtungen erfüllt sind.
hints.1.text: Entspricht sowohl dem zugehörigen Secret UID als auch seinem parent-UID-Label.
hints.2.text: Bereinigen Sie den zugehörigen Datensatz, bevor Sie nur den bekannten finalizer freigeben.
  Schützen Sie das Kontrollobjekt.
phrases.0: Ich habe die ausstehende finalizer-Verpflichtung überprüft.
phrases.1: Für den zugehörigen Datensatz habe ich UID preconditions verwendet.
phrases.2: Ich habe das nicht verwandte Kontrollobjekt beibehalten.
questions.0.points.0: Ein Finalizer kann die physische Entfernung verzögern, bis die Bereinigung abgeschlossen
  ist.
questions.0.points.1: Überprüfen Sie deletionTimestamp und den verantwortlichen Controller.
questions.0.prompt: Warum kann ein Objekt bestehen bleiben, nachdem DELETE erfolgreich war?
questions.1.points.0: Es kann dazu führen, dass die Bereinigung abgebrochen wird und externe Ressourcen
  verwaist bleiben.
questions.1.points.1: Verstehen Sie jede Verpflichtung und beschränken Sie identity vor dem Entfernen.
questions.1.prompt: Warum ist das Entfernen jedes Finalizers riskant?
