title: Finalizers and safe cleanup
brief: |-
  Cleanup has not completed. Retire the configuration while keeping both existing consumers usable and the unrelated control Secret intact.

  Work on the workstation in `~/quest` with the supplied files:
  - `cleanup-contract.json`.
  - `retirement-contract.json`.

  **Requirements:**

  - The terminating configuration and its associated record are absent, confirmed by successful API queries. Each existing consumer Deployment retains its identity and provided image, with one current ready Pod. Its read-only successor Secret volume supplies `/config/value` with the retiring record data, and `http://127.0.0.1:8080` inside that Pod returns the matching fingerprint. The successor is independent of the retired parent, as specified by `retirement-contract.json`.
  - The unrelated control Secret retains its original identity and data.

  Checks observe current state and identities, not cleanup order or the complete command history. The control Secret type and unrelated metadata are not compared.
debrief: The checks compared retired-object absence, control identity and data, successor independence, current
  consumer sources, mounted bytes and fingerprint responses.
stages.0.brief: Complete retirement while preserving dependent consumers and the unrelated control configuration.
hints.0.text: Deleting a configuration object does not migrate its consumers. A still-running process may retain
  old bytes while its next Pod can no longer initialize. Follow both object identity and current delivery dependencies.
hints.1.text: |-
  Inspect the parent association, consumer templates, current Pods and the local contracts. Print object metadata and source references without exposing Secret data:

  ```sh
  cat cleanup-contract.json retirement-contract.json
  kubectl get configmap,secret -o json | jq '.items[] | {kind,name:.metadata.name,uid:.metadata.uid,parentUID:.metadata.labels["training.devops-quests.local/parent-uid"],owners:.metadata.ownerReferences,deleting:.metadata.deletionTimestamp}'
  kubectl get deployments -o json | jq '.items[] | {name:.metadata.name,uid:.metadata.uid,volumes:.spec.template.spec.volumes,mounts:[.spec.template.spec.containers[] | {name,volumeMounts}],conditions:.status.conditions}'
  kubectl get pods -o wide
  ```
hints.2.text: |-
  Confirm both retired objects are absent, the control UID and data hash are retained, and both current consumers deliver the preserved configuration and fingerprint:

  The recorded obligation uses finalizer `training.devops-quests.local/cleanup`; compare its object association, not an unrelated finalizer.

  ```sh
  kubectl get configmap station --ignore-not-found -o name
  kubectl get secret station-record --ignore-not-found -o name
  kubectl get secret control -o json | python3 -c 'import hashlib,json,sys; x=json.load(sys.stdin); print(x["metadata"]["uid"]); print(hashlib.sha256(json.dumps(x["data"],sort_keys=True).encode()).hexdigest())'
  kubectl get deployments,pods -o wide
  kubectl exec deployment/dispatch -c worker -- sha256sum /config/value
  kubectl exec deployment/reporter -c worker -- sha256sum /config/value
  kubectl exec deployment/dispatch -c worker -- wget -qO- -T 2 http://127.0.0.1:8080
  kubectl exec deployment/reporter -c worker -- wget -qO- -T 2 http://127.0.0.1:8080
  ```
phrases.0: I observed the parent and record absent.
phrases.1: I checked the control Secret UID.
phrases.2: I compared the control Secret data hash.
questions.0.points.0: A finalizer can delay physical removal until cleanup completes.
questions.0.points.1: Inspect deletionTimestamp and the responsible controller.
questions.0.prompt: Why can an object remain after DELETE succeeds?
questions.1.points.0: It can abandon cleanup and leave external resources orphaned.
questions.1.points.1: Understand each obligation and constrain identity before removal.
questions.1.prompt: Why is removing every finalizer risky?
stages.0.objectives.0.text: The terminating configuration and its associated record are absent, confirmed by successful
  API queries. Each existing consumer Deployment retains its identity and provided image, with one current ready
  Pod. Its read-only successor Secret volume supplies `/config/value` with the retiring record data, and `http://127.0.0.1:8080`
  inside that Pod returns the matching fingerprint. The successor is independent of the retired parent, as specified
  by `retirement-contract.json`.
stages.0.objectives.1.text: The unrelated control Secret retains its original identity and data.
diagnostics.config_query: The API query for ConfigMap station may have failed. Retry the read in the exercise namespace and inspect the kubectl error. [Cause and check](guides#guide=storage-lifecycle&section=q129-retired-config-query)
diagnostics.config_absent: ConfigMap station may still exist, including while deletion is pending. Check its current lifecycle state in the exercise namespace. [Cause and check](guides#guide=storage-lifecycle&section=q129-retired-config-absence)
diagnostics.secret_query: The API query for Secret station-record may have failed. Retry the name-only read and inspect the kubectl error. [Cause and check](guides#guide=storage-lifecycle&section=q129-retired-record-query)
diagnostics.secret_absent: Secret station-record may still exist. Check whether retirement is complete after the consumers have switched to the successor. [Cause and check](guides#guide=storage-lifecycle&section=q129-retired-record-absence)
diagnostics.retirement_identity: A consumer Deployment may have been replaced, scaled away from one replica or switched to another worker image. Compare dispatch and reporter with the saved identities. [Cause and check](guides#guide=storage-lifecycle&section=q129-retirement-retained-workloads)
diagnostics.retirement_state: An observer may not find exactly one current ready Pod with the expected image for each consumer. Inspect the Deployment, active ReplicaSet and owned Pod. [Cause and check](guides#guide=storage-lifecycle&section=q129-retirement-current-consumer-pod)
diagnostics.retirement_source: The read-only successor mount may disagree between the template and current Pod, or the Secret may have the wrong payload, UID or retired-parent relationship. Compare /config/value, successor metadata and the saved digest. [Cause and check](guides#guide=storage-lifecycle&section=q129-retirement-independent-successor)
diagnostics.retirement_delivery: The bytes mounted at /config/value may differ from the retiring record. Compare the digest inside each current worker with the original fingerprint. [Cause and check](guides#guide=storage-lifecycle&section=q129-retirement-mounted-record-bytes)
diagnostics.retirement_fingerprint: The application may still serve an earlier or incorrect fingerprint. Query each current worker on loopback and compare the body with the saved fingerprint. [Cause and check](guides#guide=storage-lifecycle&section=q129-retirement-served-record-fingerprint)
diagnostics.probe_0_0: The retirement observer may have stopped before reporting a condition. Verify the provided facts and that current consumer resources are readable. [Cause and check](guides#guide=storage-lifecycle&section=q129-retirement-consumer-observer)
diagnostics.control_uid: Secret control may be missing or have a different UID. Compare the live UID with control_uid from the cleanup contract. [Cause and check](guides#guide=storage-lifecycle&section=q129-retirement-control-secret-identity)
diagnostics.control_hash: The control Secret data may have changed. Compare the hash of its sorted JSON data map with control_hash while keeping the values private. [Cause and check](guides#guide=storage-lifecycle&section=q129-retirement-control-secret-data-hash)
diagnostics.probe_0_1: The control observer may have stopped before reporting a condition. Check the supplied cleanup contract and access to Secret control. [Cause and check](guides#guide=storage-lifecycle&section=q129-retirement-control-secret-observer)
