title: Finalizers and safe cleanup
brief: "The station cleanup has not completed. Reach the required absent state while preserving the unrelated control\
  \ Secret.\n\nWork in `~/quest` on the workstation. Supplied files: `cleanup-contract.json`.\n\n**Requirements:**\n\
  \n- ConfigMap `station` and Secret `station-record` are both absent, confirmed by successful API queries.\n- Secret\
  \ `control` keeps the original UID and data recorded in `cleanup-contract.json`.\n\n**Verify yourself before Check\
  \ & finish:** Run these observation commands from `~/quest` on the workstation.\n\n- Both queries succeed and\
  \ print no resource name.\n\n  ```sh\n  kubectl get configmap station --ignore-not-found -o name\n  kubectl get\
  \ secret station-record --ignore-not-found -o name\n  ```\n\n- Settings, identities and status match Requirements.\n\
  \n  ```sh\n  cat cleanup-contract.json\n  kubectl get secret control -o json |\n    python3 -c 'import hashlib,json,sys;\
  \ x=json.load(sys.stdin); print(x[\"metadata\"][\"uid\"]); print(hashlib.sha256(json.dumps(x[\"data\"],sort_keys=True).encode()).hexdigest())'\
  \ \n  ```\n\nChecks observe final state, not action order; they do not compare the control Secret type or other\
  \ metadata."
debrief: The checks observed the two absences and compared the control Secret UID and data hash.
stages.0.brief: Cleanup must finish without changing the control identity or data.
hints.0.text: A deletionTimestamp does not mean finalizer obligations have completed.
hints.1.text: Match both the associated Secret UID and its parent-UID label.
hints.2.text: Clean the associated record before releasing only the known finalizer; protect the control object.
  The terminating ConfigMap uses finalizer `training.devops-quests.local/cleanup`; its associated Secret has no
  garbage-collection ownerReference. Match its UID and `training.devops-quests.local/parent-uid` label to the frozen
  contract, delete only that Secret using a UID precondition, and remove only that finalizer with UID/finalizer
  tests. Do not remove unrelated finalizers.
phrases.0: I observed the parent and record absent.
phrases.1: I checked the control Secret UID.
phrases.2: I compared the control Secret data hash.
questions.0.points.0: A finalizer can delay physical removal until cleanup completes.
questions.0.points.1: Inspect deletionTimestamp and the responsible controller.
questions.0.prompt: Why can an object remain after DELETE succeeds?
questions.1.points.0: It can abandon cleanup and leave external resources orphaned.
questions.1.points.1: Understand each obligation and constrain identity before removal.
questions.1.prompt: Why is removing every finalizer risky?
diagnostics.config_query: kubectl get configmap/station must succeed.
diagnostics.config_absent: configmap/station must be absent.
diagnostics.secret_query: kubectl get secret/station-record must succeed.
diagnostics.secret_absent: secret/station-record must be absent.
diagnostics.control_uid: secret/control UID must equal cleanup-contract.json control_uid.
diagnostics.control_hash: secret/control data SHA-256 must equal cleanup-contract.json control_hash.
stages.0.objectives.0.text: ConfigMap `station` and Secret `station-record` are both absent, confirmed by successful
  API queries.
stages.0.objectives.1.text: Secret `control` keeps the original UID and data recorded in `cleanup-contract.json`.
