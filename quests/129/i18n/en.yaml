title: Finalizers and safe cleanup
brief: 'Work only in the offline bay, in `~/quest`, using the supplied `cleanup-contract.json`. A finalizer delays deletion
  until its controller finishes cleanup. Inspect the `station` ConfigMap and its `station-record` Secret, then complete cleanup
  and deletion without changing the `control` Secret. Both `station` and `station-record` must be absent and API queries must
  succeed. The check compares the UID of `control` with `control_uid` and the SHA-256 of its sorted JSON `data` with `control_hash`
  in the contract. It observes the final state; it cannot prove the order of your actions. Do not remove finalizers from unrelated
  resources.


  The terminating ConfigMap has finalizer `training.devops-quests.local/cleanup`; its synthetic Secret has no garbage-collection
  ownerReference. Match its UID and `training.devops-quests.local/parent-uid` label to the frozen parent and child UIDs. Delete
  only that Secret with a UID precondition, then remove only that finalizer using UID and finalizer tests.


  Compute the hash from UTF-8 bytes of Python `json.dumps(data, sort_keys=True)` with its default separators and escaping.


  The check does not compare the control Secret type or other metadata.'
debrief: The checks observed the two absences and compared the control Secret UID and data hash.
stages.0.brief: station and station-record are absent; the control Secret UID and data hash match the contract.
stages.0.objectives.0.text: station and station-record are absent; the control Secret UID and data hash match the contract.
hints.0.text: A deletionTimestamp does not mean finalizer obligations have completed.
hints.1.text: Match both the associated Secret UID and its parent-UID label.
hints.2.text: Clean the associated record before releasing only the known finalizer; protect the control object.
phrases.0: I observed the parent and record absent.
phrases.1: I checked the control Secret UID.
phrases.2: I compared the control Secret data hash.
questions.0.points.0: A finalizer can delay physical removal until cleanup completes.
questions.0.points.1: Inspect deletionTimestamp and the responsible controller.
questions.0.prompt: Why can an object remain after DELETE succeeds?
questions.1.points.0: It can abandon cleanup and leave external resources orphaned.
questions.1.points.1: Understand each obligation and constrain identity before removal.
questions.1.prompt: Why is removing every finalizer risky?
diagnostics.config_query: kubectl get configmap/station must succeed.
diagnostics.config_absent: configmap/station must be absent.
diagnostics.secret_query: kubectl get secret/station-record must succeed.
diagnostics.secret_absent: secret/station-record must be absent.
diagnostics.control_uid: secret/control UID must equal cleanup-contract.json control_uid.
diagnostics.control_hash: secret/control data SHA-256 must equal cleanup-contract.json control_hash.
