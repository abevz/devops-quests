title: Finalizers and safe cleanup
brief: 'A ConfigMap station is terminating with the known training.devops-quests.local/cleanup finalizer.
  Its associated synthetic Secret station-record intentionally has no garbage-collection ownerReference:
  the missing controller must clean it explicitly. Use the frozen UIDs and parent-UID label to verify
  the association, delete only that Secret with a UID precondition, then remove only the known finalizer
  with UID and finalizer tests. Leave the unrelated control Secret unchanged. The goal checks resulting
  identities and cleanup, not a cryptographic audit of command order.


  Quest files in `~/quest` (some appear in later stages): `cleanup-contract.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: The parent and its associated record are absent; the unrelated control Secret
  retains its original UID and data.'
debrief: The recovery completed the cleanup obligation and preserved an unrelated object instead of blindly
  clearing all finalizers.
stages.0.brief: 'The parent and its associated record are absent; the unrelated control Secret retains
  its original UID and data.


  Success criteria: The parent and its associated record are absent; the unrelated control Secret retains
  its original UID and data.'
stages.0.objectives.0.text: The parent and its associated record are absent; the unrelated control Secret
  retains its original UID and data.
hints.0.text: A deletionTimestamp does not mean finalizer obligations have completed.
hints.1.text: Match both the associated Secret UID and its parent-UID label.
hints.2.text: Clean the associated record before releasing only the known finalizer; protect the control
  object.
phrases.0: I inspected the outstanding finalizer obligation.
phrases.1: I used UID preconditions for the associated record.
phrases.2: I preserved the unrelated control object.
questions.0.points.0: A finalizer can delay physical removal until cleanup completes.
questions.0.points.1: Inspect deletionTimestamp and the responsible controller.
questions.0.prompt: Why can an object remain after DELETE succeeds?
questions.1.points.0: It can abandon cleanup and leave external resources orphaned.
questions.1.points.1: Understand each obligation and constrain identity before removal.
questions.1.prompt: Why is removing every finalizer risky?
