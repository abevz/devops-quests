title: Finalizers и безопасная очистка
brief: |-
  Очистка станции ещё не завершена. Выведите конфигурацию из эксплуатации, сохранив работоспособность обоих существующих потребителей и посторонний контрольный Secret.

  Работайте на рабочей станции в `~/quest` с предоставленными файлами:
  - `cleanup-contract.json`.
  - `retirement-contract.json`.

  **Требования:**

  - Завершающая удаление конфигурация и связанная с ней запись отсутствуют, что подтверждается успешными запросами API. Каждый существующий Deployment потребителя сохраняет идентичность и предоставленный образ и имеет один готовый текущий Pod. Его том с Secret-преемником доступен только для чтения и предоставляет `/config/value` с данными выводимой записи; `http://127.0.0.1:8080` внутри Pod возвращает соответствующий отпечаток. Преемник независим от выводимого родителя по `retirement-contract.json`.
  - Посторонний контрольный Secret сохраняет исходную идентичность и данные.

  Проверки наблюдают текущее состояние и идентичность, но не порядок очистки или полную историю команд. Тип контрольного Secret и посторонние метаданные не сравниваются.
debrief: Проверки сравнили отсутствие выведенных объектов, идентичность и данные контрольного Secret, независимость
  преемника, текущие источники потребителей, смонтированные байты и ответы с отпечатком.
stages.0.brief: Завершите вывод из эксплуатации, сохранив зависимых потребителей и постороннюю контрольную конфигурацию.
hints.0.text: Удаление конфигурационного объекта не переносит его потребителей. Работающий процесс может сохранять
  старые байты, хотя следующий Pod уже не сможет запуститься. Проследите и идентичность объектов, и текущие зависимости
  доставки.
hints.1.text: |-
  Изучите связь с родителем, шаблоны потребителей, текущие Pod и локальные контракты. Выводите метаданные объектов и ссылки на источники без раскрытия данных Secret:

  Записанное обязательство обозначено finalizer `training.devops-quests.local/cleanup`; сверяйте его связь с объектом, а не посторонний finalizer.

  ```sh
  cat cleanup-contract.json retirement-contract.json
  kubectl get configmap,secret -o json | jq '.items[] | {kind,name:.metadata.name,uid:.metadata.uid,parentUID:.metadata.labels["training.devops-quests.local/parent-uid"],owners:.metadata.ownerReferences,deleting:.metadata.deletionTimestamp}'
  kubectl get deployments -o json | jq '.items[] | {name:.metadata.name,uid:.metadata.uid,volumes:.spec.template.spec.volumes,mounts:[.spec.template.spec.containers[] | {name,volumeMounts}],conditions:.status.conditions}'
  kubectl get pods -o wide
  ```
hints.2.text: |-
  Подтвердите отсутствие обоих выведенных объектов, сохранение UID и хеша данных контрольного Secret, а также доставку конфигурации и отпечатка обоим текущим потребителям:

  ```sh
  jq '{control_uid,control_hash}' cleanup-contract.json
  jq '{retiredRecordUID,retiredParentUID,dataHash,fingerprint,consumers}' retirement-identities.json
  kubectl get deployment dispatch reporter -o json | jq '.items[] | {name:.metadata.name,uid:.metadata.uid,volumes:.spec.template.spec.volumes,ready:.status.readyReplicas}'
  kubectl get rs,pod -o json | jq '.items[] | select(.metadata.deletionTimestamp==null) | {kind,name:.metadata.name,uid:.metadata.uid,owners:.metadata.ownerReferences,volumes:.spec.volumes}'
  kubectl get configmap station --ignore-not-found -o name
  kubectl get secret station-record --ignore-not-found -o name
  kubectl get secret control -o json | python3 -c 'import hashlib,json,sys; x=json.load(sys.stdin); print(x["metadata"]["uid"]); print(hashlib.sha256(json.dumps(x["data"],sort_keys=True).encode()).hexdigest())'
  kubectl get deployments,pods -o wide
  kubectl exec deployment/dispatch -c worker -- sha256sum /config/value
  kubectl exec deployment/reporter -c worker -- sha256sum /config/value
  kubectl exec deployment/dispatch -c worker -- wget -qO- -T 2 http://127.0.0.1:8080
  kubectl exec deployment/reporter -c worker -- wget -qO- -T 2 http://127.0.0.1:8080
  ```

  ```sh
  (
    set -euo pipefail
    read -r -p 'Successor Secret from the current mount: ' successor
    test -n "$successor"
    kubectl get secret "$successor" -o json | python3 -I -c '
  import hashlib,json,sys
  from pathlib import Path
  facts=json.loads(Path("retirement-identities.json").read_text())
  record=json.load(sys.stdin)
  meta=record["metadata"]
  parent=facts["retiredParentUID"]
  label=facts["contract"]["parentLabel"]
  assert meta["uid"] != facts["retiredRecordUID"] and not meta.get("deletionTimestamp")
  assert meta.get("labels",{}).get(label) != parent
  assert all(owner.get("uid") != parent for owner in meta.get("ownerReferences",[]))
  assert hashlib.sha256(json.dumps(record["data"],sort_keys=True).encode()).hexdigest() == facts["dataHash"]
  print("Successor identity and data hash match")
  '
  )
  ```

  Каждый запрос выведенного объекта завершается успешно и без вывода. UID и хеш control совпадают с контрактом. Оба ответа совпадают с отпечатком смонтированного файла. Повторите итоговую проверку метаданных и хеша для Secret, на который ссылается текущий том только для чтения каждого worker.
phrases.0: Я проверил отсутствие родительского объекта и записи.
phrases.1: Я проверил UID Secret control.
phrases.2: Я сравнил хеш данных Secret control.
questions.0.points.0: Finalizer может задержать удаление до завершения очистки.
questions.0.points.1: Изучите deletionTimestamp и ответственный контроллер.
questions.0.prompt: Почему объект может остаться после успешного DELETE?
questions.1.points.0: Это может отменить очистку и оставить внешние ресурсы без владельца.
questions.1.points.1: Поймите каждое обязательство и ограничьте identity перед снятием.
questions.1.prompt: Почему рискованно снимать все finalizers?
stages.0.objectives.0.text: Завершающая удаление конфигурация и связанная с ней запись отсутствуют, что подтверждается
  успешными запросами API. Каждый существующий Deployment потребителя сохраняет идентичность и предоставленный образ
  и имеет один готовый текущий Pod. Его том с Secret-преемником доступен только для чтения и предоставляет `/config/value`
  с данными выводимой записи; `http://127.0.0.1:8080` внутри Pod возвращает соответствующий отпечаток. Преемник
  независим от выводимого родителя по `retirement-contract.json`.
stages.0.objectives.1.text: Посторонний контрольный Secret сохраняет исходную идентичность и данные.
diagnostics.config_query: Запрос к API о ConfigMap station мог завершиться ошибкой. Повторите чтение в пространстве имён упражнения и проверьте ошибку kubectl. [Причина и проверка](guides#guide=storage-lifecycle&section=q129-retired-config-query)
diagnostics.config_absent: ConfigMap station может всё ещё существовать, в том числе пока удаление не завершено. Проверьте его состояние в пространстве имён упражнения. [Причина и проверка](guides#guide=storage-lifecycle&section=q129-retired-config-absence)
diagnostics.secret_query: Запрос к API о Secret station-record мог завершиться ошибкой. Повторите чтение только имени и проверьте ошибку kubectl. [Причина и проверка](guides#guide=storage-lifecycle&section=q129-retired-record-query)
diagnostics.secret_absent: Secret station-record может всё ещё существовать. После перехода потребителей на новый Secret проверьте, завершилось ли удаление старого. [Причина и проверка](guides#guide=storage-lifecycle&section=q129-retired-record-absence)
diagnostics.retirement_identity: Deployment потребителя мог быть пересоздан, иметь число реплик, отличное от одной, или использовать другой образ worker. Сравните dispatch и reporter с исходной записью. [Причина и проверка](guides#guide=storage-lifecycle&section=q129-retirement-retained-workloads)
diagnostics.retirement_state: У каждого потребителя проверка ищет ровно один текущий готовый Pod с ожидаемым образом. Проверьте Deployment, активный ReplicaSet и принадлежащий ему Pod. [Причина и проверка](guides#guide=storage-lifecycle&section=q129-retirement-current-consumer-pod)
diagnostics.retirement_source: Монтирование нового Secret только для чтения может различаться между шаблоном и текущим Pod. Данные, UID или связь Secret со старым родителем тоже могут быть неверными. Сверьте источник /config/value, метаданные нового Secret и сохранённый хеш. [Причина и проверка](guides#guide=storage-lifecycle&section=q129-retirement-independent-successor)
diagnostics.retirement_delivery: Байты, смонтированные по пути /config/value, могут отличаться от исходной записи. Сравните хеш внутри каждого текущего worker с исходным отпечатком. [Причина и проверка](guides#guide=storage-lifecycle&section=q129-retirement-mounted-record-bytes)
diagnostics.retirement_fingerprint: Приложение может отдавать старый или неверный отпечаток. Запросите локальный ответ каждого текущего worker и сравните с сохранённым отпечатком. [Причина и проверка](guides#guide=storage-lifecycle&section=q129-retirement-served-record-fingerprint)
diagnostics.probe_0_0: Проверка вывода из эксплуатации могла остановиться до вывода конкретного условия. Убедитесь, что исходные данные и текущие ресурсы потребителей доступны для чтения. [Причина и проверка](guides#guide=storage-lifecycle&section=q129-retirement-consumer-observer)
diagnostics.control_uid: Secret control может отсутствовать или иметь другой UID. Сравните текущий UID с control_uid из контракта очистки. [Причина и проверка](guides#guide=storage-lifecycle&section=q129-retirement-control-secret-identity)
diagnostics.control_hash: Данные Secret control могли измениться. Сравните хеш карты data из JSON с отсортированными ключами с control_hash, сохраняя значения в тайне. [Причина и проверка](guides#guide=storage-lifecycle&section=q129-retirement-control-secret-data-hash)
diagnostics.probe_0_1: Проверка контрольного Secret могла остановиться до вывода конкретного условия. Проверьте выданный контракт очистки и доступ к Secret control. [Причина и проверка](guides#guide=storage-lifecycle&section=q129-retirement-control-secret-observer)
