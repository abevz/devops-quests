title: Finalizers и безопасная очистка
brief: |-
  Очистка station не завершилась. Добейтесь требуемого отсутствия ресурсов, сохранив посторонний Secret control.

  Работайте на workstation в `~/quest` с предоставленными файлами:
  - `cleanup-contract.json`.

  **Requirements:**

  - Завершающая удаление конфигурация и связанная с ней запись отсутствуют, что подтверждается успешными запросами API.
  - Посторонний контрольный Secret сохраняет исходную идентичность и данные.

  Проверки наблюдают конечное состояние, а не порядок действий; тип Secret control и прочие метаданные не сравниваются.
debrief: Проверки установили отсутствие обоих ресурсов и сравнили UID и хеш данных Secret control.
stages.0.brief: В конечном состоянии посторонний контрольный Secret сохранён.
hints.0.text: DeletionTimestamp не означает выполнения обязательств finalizer.
hints.1.text: |-
  Сопоставьте и UID связанного Secret, и его метку parent-UID.

  Изучите предоставленные файлы и живые наблюдения:

  ```sh
  kubectl get configmap,secret -o yaml
  cat cleanup-contract.json
  ```
hints.2.text: "Уберите связанную запись до снятия только известного finalizer; сохраните контрольный объект.\
  \ Завершающийся ConfigMap использует финализатор `training.devops-quests.local/cleanup`; связанный Secret\
  \ не имеет ownerReference для сборки мусора. Сопоставьте его UID и метку `training.devops-quests.local/parent-uid`\
  \ с замороженным контрактом, удалите только этот Secret с предусловием UID и снимите только этот финализатор\
  \ с проверками UID/финализатора. Не снимайте посторонние финализаторы.\n\nПроверьте результат из `~/quest`\
  \ на workstation:\n\n- Оба запроса успешны и не печатают имени ресурса.\n\n  ```sh\n  kubectl get configmap\
  \ station --ignore-not-found -o name\n  kubectl get secret station-record --ignore-not-found -o name\n\
  \  ```\n\n- Настройки, идентичности и состояние соответствуют требованиям.\n\n  ```sh\n  cat cleanup-contract.json\n\
  \  kubectl get secret control -o json |\n    python3 -c 'import hashlib,json,sys; x=json.load(sys.stdin);\
  \ print(x[\"metadata\"][\"uid\"]); print(hashlib.sha256(json.dumps(x[\"data\"],sort_keys=True).encode()).hexdigest())'\
  \ \n  ```"
phrases.0: Я проверил отсутствие родительского объекта и записи.
phrases.1: Я проверил UID Secret control.
phrases.2: Я сравнил хеш данных Secret control.
questions.0.points.0: Finalizer может задержать удаление до завершения очистки.
questions.0.points.1: Изучите deletionTimestamp и ответственный контроллер.
questions.0.prompt: Почему объект может остаться после успешного DELETE?
questions.1.points.0: Это может отменить очистку и оставить внешние ресурсы без владельца.
questions.1.points.1: Поймите каждое обязательство и ограничьте identity перед снятием.
questions.1.prompt: Почему рискованно снимать все finalizers?
diagnostics.config_query: kubectl get configmap/station должен выполняться успешно.
diagnostics.config_absent: configmap/station должен отсутствовать.
diagnostics.secret_query: kubectl get secret/station-record должен выполняться успешно.
diagnostics.secret_absent: secret/station-record должен отсутствовать.
diagnostics.control_uid: secret/control UID должен совпадать с cleanup-contract.json control_uid.
diagnostics.control_hash: secret/control data SHA-256 должен совпадать с cleanup-contract.json control_hash.
