title: Finalizers и безопасная очистка
brief: 'Работайте только в офлайн-песочнице, в `~/quest`, используя предоставленный `cleanup-contract.json`. Finalizer задерживает
  удаление, пока контроллер не завершит очистку. Изучите ConfigMap `station` и Secret `station-record`, затем завершите очистку
  и удаление, не меняя Secret `control`. `station` и `station-record` должны отсутствовать, а запросы API должны быть успешными.
  Проверка сравнивает UID `control` с `control_uid` и SHA-256 отсортированного JSON поля `data` с `control_hash` из контракта.
  Она наблюдает конечное состояние и не доказывает порядок действий. Не удаляйте finalizer у посторонних ресурсов.


  Удаляемая ConfigMap имеет finalizer `training.devops-quests.local/cleanup`; у её синтетического Secret нет ownerReference
  для сборки мусора. Сравните его UID и метку `training.devops-quests.local/parent-uid` с сохранёнными UID родителя и дочернего
  объекта. Удалите только этот Secret с UID-предусловием, затем только этот finalizer с проверками UID и finalizer.


  Вычислите хеш по байтам UTF-8 результата Python `json.dumps(data, sort_keys=True)` со стандартными разделителями и экранированием.


  Проверка не сравнивает тип Secret control или другие метаданные.'
debrief: Проверки установили отсутствие обоих ресурсов и сравнили UID и хеш данных Secret control.
stages.0.brief: station и station-record отсутствуют; UID и хеш данных Secret control совпадают с контрактом.
stages.0.objectives.0.text: station и station-record отсутствуют; UID и хеш данных Secret control совпадают с контрактом.
hints.0.text: DeletionTimestamp не означает выполнения обязательств finalizer.
hints.1.text: Сопоставьте и UID связанного Secret, и его метку parent-UID.
hints.2.text: Уберите связанную запись до снятия только известного finalizer; сохраните контрольный объект.
phrases.0: Я проверил отсутствие родительского объекта и записи.
phrases.1: Я проверил UID Secret control.
phrases.2: Я сравнил хеш данных Secret control.
questions.0.points.0: Finalizer может задержать удаление до завершения очистки.
questions.0.points.1: Изучите deletionTimestamp и ответственный контроллер.
questions.0.prompt: Почему объект может остаться после успешного DELETE?
questions.1.points.0: Это может отменить очистку и оставить внешние ресурсы без владельца.
questions.1.points.1: Поймите каждое обязательство и ограничьте identity перед снятием.
questions.1.prompt: Почему рискованно снимать все finalizers?
diagnostics.config_query: kubectl get configmap/station должен выполняться успешно.
diagnostics.config_absent: configmap/station должен отсутствовать.
diagnostics.secret_query: kubectl get secret/station-record должен выполняться успешно.
diagnostics.secret_absent: secret/station-record должен отсутствовать.
diagnostics.control_uid: secret/control UID должен совпадать с cleanup-contract.json control_uid.
diagnostics.control_hash: secret/control data SHA-256 должен совпадать с cleanup-contract.json control_hash.
