diagnostics.config_absent: configmap/station должен отсутствовать.
diagnostics.secret_query: kubectl get secret/station-record должен выполняться успешно.
diagnostics.secret_absent: secret/station-record должен отсутствовать.
diagnostics.control_uid: secret/control UID должен совпадать с cleanup-contract.json control_uid.
diagnostics.control_hash: secret/control data SHA-256 должен совпадать с cleanup-contract.json control_hash.
