title: Finalizers и безопасная очистка
brief: 'ConfigMap station удаляется с известным finalizer training.devops-quests.local/cleanup. У связанного
  учебного Secret station-record намеренно нет ownerReference для garbage collection: отсутствующий контроллер
  должен убрать его явно. По сохранённым UID и метке parent-UID проверьте связь, удалите только этот Secret
  с UID precondition, затем уберите только известный finalizer с проверками UID и списка finalizers. Посторонний
  Secret control оставьте неизменным. Цель проверяет identities и итог очистки, а не криптографический
  аудит порядка команд.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `cleanup-contract.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Родитель и связанная запись отсутствуют; посторонний Secret control сохранил исходные
  UID и данные.'
debrief: Восстановление выполнило обязательство очистки и сохранило посторонний объект вместо слепого
  снятия всех finalizers.
