title: Finalizers y limpieza segura
brief: |-
  La limpieza de la estación no ha terminado. Retira la configuración conservando ambos consumidores existentes y el Secret de control ajeno.

  Trabaja en la estación de trabajo, en `~/quest`, con los archivos suministrados:
  - `cleanup-contract.json`.
  - `retirement-contract.json`.

  **Requisitos:**

  - La configuración en eliminación y su registro asociado están ausentes, confirmado mediante consultas API correctas. Cada Deployment consumidor existente conserva su identidad e imagen suministrada y tiene un Pod actual listo. Su volumen de Secret sucesor de solo lectura aporta `/config/value` con los datos del registro retirado, y `http://127.0.0.1:8080` dentro del Pod devuelve la huella correspondiente. El sucesor es independiente del padre retirado según `retirement-contract.json`.
  - El Secret de control ajeno conserva su identidad y datos originales.

  Las comprobaciones observan estado e identidades actuales, no el orden de limpieza ni el historial completo. No comparan el tipo del Secret de control ni otros metadatos ajenos.
debrief: Las comprobaciones compararon ausencia, identidad y datos de control, independencia del sucesor, fuentes
  actuales de los consumidores, bytes montados y respuestas de huella.
stages.0.brief: Completa la retirada conservando consumidores dependientes y configuración de control ajena.
hints.0.text: Eliminar un objeto de configuración no migra sus consumidores. Un proceso en marcha puede conservar
  bytes antiguos aunque el próximo Pod ya no pueda inicializarse. Sigue tanto la identidad del objeto como sus dependencias
  actuales de entrega.
hints.1.text: |-
  Inspecciona la asociación con el padre, plantillas, Pods actuales y contratos locales. Muestra metadatos y referencias de origen sin revelar datos de Secret:

  La obligación registrada usa el finalizer `training.devops-quests.local/cleanup`; compara su asociación con el objeto, no otro finalizer ajeno.

  ```sh
  cat cleanup-contract.json retirement-contract.json
  kubectl get configmap,secret -o json | jq '.items[] | {kind,name:.metadata.name,uid:.metadata.uid,parentUID:.metadata.labels["training.devops-quests.local/parent-uid"],owners:.metadata.ownerReferences,deleting:.metadata.deletionTimestamp}'
  kubectl get deployments -o json | jq '.items[] | {name:.metadata.name,uid:.metadata.uid,volumes:.spec.template.spec.volumes,mounts:[.spec.template.spec.containers[] | {name,volumeMounts}],conditions:.status.conditions}'
  kubectl get pods -o wide
  ```
hints.2.text: |-
  Confirma la ausencia de ambos objetos retirados, la conservación del UID y hash del Secret de control, y la entrega de configuración y huella a ambos consumidores actuales:

  ```sh
  jq '{control_uid,control_hash}' cleanup-contract.json
  jq '{retiredRecordUID,retiredParentUID,dataHash,fingerprint,consumers}' retirement-identities.json
  kubectl get deployment dispatch reporter -o json | jq '.items[] | {name:.metadata.name,uid:.metadata.uid,volumes:.spec.template.spec.volumes,ready:.status.readyReplicas}'
  kubectl get rs,pod -o json | jq '.items[] | select(.metadata.deletionTimestamp==null) | {kind,name:.metadata.name,uid:.metadata.uid,owners:.metadata.ownerReferences,volumes:.spec.volumes}'
  kubectl get configmap station --ignore-not-found -o name
  kubectl get secret station-record --ignore-not-found -o name
  kubectl get secret control -o json | python3 -c 'import hashlib,json,sys; x=json.load(sys.stdin); print(x["metadata"]["uid"]); print(hashlib.sha256(json.dumps(x["data"],sort_keys=True).encode()).hexdigest())'
  kubectl get deployments,pods -o wide
  kubectl exec deployment/dispatch -c worker -- sha256sum /config/value
  kubectl exec deployment/reporter -c worker -- sha256sum /config/value
  kubectl exec deployment/dispatch -c worker -- wget -qO- -T 2 http://127.0.0.1:8080
  kubectl exec deployment/reporter -c worker -- wget -qO- -T 2 http://127.0.0.1:8080
  ```

  ```sh
  (
    set -euo pipefail
    read -r -p 'Successor Secret from the current mount: ' successor
    test -n "$successor"
    kubectl get secret "$successor" -o json | python3 -I -c '
  import hashlib,json,sys
  from pathlib import Path
  facts=json.loads(Path("retirement-identities.json").read_text())
  record=json.load(sys.stdin)
  meta=record["metadata"]
  parent=facts["retiredParentUID"]
  label=facts["contract"]["parentLabel"]
  assert meta["uid"] != facts["retiredRecordUID"] and not meta.get("deletionTimestamp")
  assert meta.get("labels",{}).get(label) != parent
  assert all(owner.get("uid") != parent for owner in meta.get("ownerReferences",[]))
  assert hashlib.sha256(json.dumps(record["data"],sort_keys=True).encode()).hexdigest() == facts["dataHash"]
  print("Successor identity and data hash match")
  '
  )
  ```

  Cada consulta a un objeto retirado tiene éxito con salida vacía. El UID y el hash de control coinciden con el contrato. Ambas respuestas coinciden con la huella del archivo montado. Repite la comprobación final de metadatos y hash para el Secret que referencia el montaje actual de solo lectura de cada worker.
phrases.0: Observé la ausencia del objeto principal y el registro.
phrases.1: Comprobé el UID del Secret control.
phrases.2: Comparé el hash de datos del Secret control.
questions.0.points.0: Un finalizador puede retrasar la eliminación física hasta que se complete la limpieza.
questions.0.points.1: Inspeccione deletionTimestamp y el controlador responsable.
questions.0.prompt: ¿Por qué puede permanecer un objeto después de que DELETE tenga éxito?
questions.1.points.0: Puede abandonar la limpieza y dejar huérfanos los recursos externos.
questions.1.points.1: Comprenda cada obligación y limite identity antes de la eliminación.
questions.1.prompt: ¿Por qué es arriesgado eliminar todos los finalizadores?
stages.0.objectives.0.text: La configuración en eliminación y su registro asociado están ausentes, confirmado mediante
  consultas API correctas. Cada Deployment consumidor existente conserva su identidad e imagen suministrada y tiene
  un Pod actual listo. Su volumen de Secret sucesor de solo lectura aporta `/config/value` con los datos del registro
  retirado, y `http://127.0.0.1:8080` dentro del Pod devuelve la huella correspondiente. El sucesor es independiente
  del padre retirado según `retirement-contract.json`.
stages.0.objectives.1.text: El Secret de control ajeno conserva su identidad y datos originales.
diagnostics.config_query: La consulta a la API sobre ConfigMap station puede haber fallado. Repite la lectura en el espacio de nombres del ejercicio y revisa el error de kubectl. [Causa y comprobación](guides#guide=storage-lifecycle&section=q129-retired-config-query)
diagnostics.config_absent: ConfigMap station puede seguir existiendo mientras se completa la eliminación. Comprueba su estado en el espacio de nombres del ejercicio. [Causa y comprobación](guides#guide=storage-lifecycle&section=q129-retired-config-absence)
diagnostics.secret_query: La consulta a la API sobre Secret station-record puede haber fallado. Repite la lectura solo del nombre y revisa el error de kubectl. [Causa y comprobación](guides#guide=storage-lifecycle&section=q129-retired-record-query)
diagnostics.secret_absent: Secret station-record puede seguir existiendo. Después de que los consumidores cambien al sucesor, comprueba si la retirada se completó. [Causa y comprobación](guides#guide=storage-lifecycle&section=q129-retired-record-absence)
diagnostics.retirement_identity: Un Deployment consumidor puede haberse sustituido, tener una cantidad distinta de una réplica o usar otra imagen de worker. Compara dispatch y reporter con las identidades guardadas. [Causa y comprobación](guides#guide=storage-lifecycle&section=q129-retirement-retained-workloads)
diagnostics.retirement_state: La observación puede no encontrar un único Pod actual y listo con la imagen esperada para cada consumidor. Revisa el Deployment, el ReplicaSet activo y su Pod. [Causa y comprobación](guides#guide=storage-lifecycle&section=q129-retirement-current-consumer-pod)
diagnostics.retirement_source: El montaje del sucesor en solo lectura puede diferir entre la plantilla y el Pod actual, o el Secret puede tener otros datos, UID o vínculo con el padre retirado. Compara /config/value, los metadatos del sucesor y el hash guardado. [Causa y comprobación](guides#guide=storage-lifecycle&section=q129-retirement-independent-successor)
diagnostics.retirement_delivery: Los bytes montados en /config/value pueden diferir del registro retirado. Compara el hash dentro de cada worker actual con la huella original. [Causa y comprobación](guides#guide=storage-lifecycle&section=q129-retirement-mounted-record-bytes)
diagnostics.retirement_fingerprint: La aplicación puede seguir sirviendo una huella antigua o incorrecta. Consulta cada worker actual por loopback y compara el cuerpo con la huella guardada. [Causa y comprobación](guides#guide=storage-lifecycle&section=q129-retirement-served-record-fingerprint)
diagnostics.probe_0_0: La observación de retirada puede haberse detenido antes de indicar una condición. Verifica los datos proporcionados y que los recursos actuales de los consumidores se puedan leer. [Causa y comprobación](guides#guide=storage-lifecycle&section=q129-retirement-consumer-observer)
diagnostics.control_uid: Secret control puede faltar o tener otro UID. Compara el UID actual con control_uid del contrato de limpieza. [Causa y comprobación](guides#guide=storage-lifecycle&section=q129-retirement-control-secret-identity)
diagnostics.control_hash: Los datos de Secret control pueden haber cambiado. Compara el hash del mapa data de JSON con claves ordenadas con control_hash y mantén los valores privados. [Causa y comprobación](guides#guide=storage-lifecycle&section=q129-retirement-control-secret-data-hash)
diagnostics.probe_0_1: La comprobación del Secret de control puede haberse detenido antes de indicar una condición. Comprueba el contrato de limpieza proporcionado y el acceso a Secret control. [Causa y comprobación](guides#guide=storage-lifecycle&section=q129-retirement-control-secret-observer)
