title: Finalizers y limpieza segura
brief: "La limpieza de station no se ha completado. Alcance la ausencia requerida conservando el Secret control\
  \ ajeno.\n\nTrabaje en `~/quest` en la estación de trabajo. Archivos suministrados: `cleanup-contract.json`.\n\
  \n**Requirements:**\n\n- El ConfigMap `station` y el Secret `station-record` están ausentes, confirmado por consultas\
  \ API exitosas.\n- El Secret `control` conserva el UID original y los datos registrados en `cleanup-contract.json`.\n\
  \n**Verify yourself before Check & finish:** Ejecute estos comandos de observación desde `~/quest` en la estación\
  \ de trabajo.\n\n- Ambas consultas tienen éxito y no imprimen ningún nombre de recurso.\n\n  ```sh\n  kubectl\
  \ get configmap station --ignore-not-found -o name\n  kubectl get secret station-record --ignore-not-found -o\
  \ name\n  ```\n\n- La configuración, identidades y estado cumplen los requisitos.\n\n  ```sh\n  cat cleanup-contract.json\n\
  \  kubectl get secret control -o json |\n    python3 -c 'import hashlib,json,sys; x=json.load(sys.stdin); print(x[\"\
  metadata\"][\"uid\"]); print(hashlib.sha256(json.dumps(x[\"data\"],sort_keys=True).encode()).hexdigest())' \n\
  \  ```\n\nLas comprobaciones observan el estado final, no el orden; no comparan el tipo del Secret control ni\
  \ otros metadatos."
debrief: Las comprobaciones observaron ambas ausencias y compararon el UID y hash de datos del Secret control.
stages.0.brief: La limpieza debe terminar sin cambiar la identidad ni los datos de control.
hints.0.text: Un deletionTimestamp no significa que se hayan completado las obligaciones de finalizer.
hints.1.text: Haga coincidir tanto el Secret UID asociado como su etiqueta parent-UID.
hints.2.text: Limpie el registro asociado antes de liberar solo el finalizer conocido; proteger el objeto de control.
  El ConfigMap en terminación usa el finalizer `training.devops-quests.local/cleanup`; su Secret asociado no tiene
  ownerReference de recolección. Compare su UID y etiqueta `training.devops-quests.local/parent-uid` con el contrato
  congelado, elimine solo ese Secret con precondición UID y retire solo ese finalizer con pruebas UID/finalizer.
  No retire finalizers ajenos.
phrases.0: Observé la ausencia del objeto principal y el registro.
phrases.1: Comprobé el UID del Secret control.
phrases.2: Comparé el hash de datos del Secret control.
questions.0.points.0: Un finalizador puede retrasar la eliminación física hasta que se complete la limpieza.
questions.0.points.1: Inspeccione deletionTimestamp y el controlador responsable.
questions.0.prompt: ¿Por qué puede permanecer un objeto después de que DELETE tenga éxito?
questions.1.points.0: Puede abandonar la limpieza y dejar huérfanos los recursos externos.
questions.1.points.1: Comprenda cada obligación y limite identity antes de la eliminación.
questions.1.prompt: ¿Por qué es arriesgado eliminar todos los finalizadores?
