title: Finalizers y limpieza segura
brief: 'Un ConfigMap station termina con el conocido training.devops-quests.local/cleanup finalizer. Su
  Secret station-record sintético asociado no tiene recolección de basura ownerReference intencionalmente:
  el controlador que falta debe limpiarlo explícitamente. Utilice la etiqueta congelada UIDs y parent-UID
  para verificar la asociación, elimine solo ese Secret con un UID precondition, luego elimine solo el
  finalizer conocido con Pruebas UID y finalizer. Deje el control Secret no relacionado sin cambios. El
  objetivo comprueba el identities resultante y la limpieza, no una auditoría criptográfica del orden
  de los comandos.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `cleanup-contract.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: el padre y su registro asociado están ausentes; el control Secret no relacionado
  conserva su UID y sus datos originales.'
debrief: La recuperación completó la obligación de limpieza y conservó un objeto no relacionado en lugar
  de borrar ciegamente todo finalizers.
stages.0.brief: 'Criterios de éxito: el padre y su registro asociado están ausentes; el control Secret
  no relacionado conserva su UID y sus datos originales.'
stages.0.objectives.0.text: El padre y su registro asociado están ausentes; el control Secret no relacionado
  conserva su UID y sus datos originales.
hints.0.text: Un deletionTimestamp no significa que se hayan completado las obligaciones de finalizer.
hints.1.text: Haga coincidir tanto el Secret UID asociado como su etiqueta parent-UID.
hints.2.text: Limpie el registro asociado antes de liberar solo el finalizer conocido; proteger el objeto
  de control.
phrases.0: Inspeccioné la obligación pendiente finalizer.
phrases.1: Utilicé UID preconditions para el registro asociado.
phrases.2: Conservé el objeto de control no relacionado.
questions.0.points.0: Un finalizador puede retrasar la eliminación física hasta que se complete la limpieza.
questions.0.points.1: Inspeccione deletionTimestamp y el controlador responsable.
questions.0.prompt: ¿Por qué puede permanecer un objeto después de que DELETE tenga éxito?
questions.1.points.0: Puede abandonar la limpieza y dejar huérfanos los recursos externos.
questions.1.points.1: Comprenda cada obligación y limite identity antes de la eliminación.
questions.1.prompt: ¿Por qué es arriesgado eliminar todos los finalizadores?
