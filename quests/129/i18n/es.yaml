title: Finalizers y limpieza segura
brief: 'Trabaja solo en la bahía sin conexión, en `~/quest`, con el `cleanup-contract.json` proporcionado. Un finalizer retrasa
  el borrado hasta que su controlador termina la limpieza. Inspecciona el ConfigMap `station` y el Secret `station-record`;
  completa la limpieza y el borrado sin cambiar el Secret `control`. `station` y `station-record` deben estar ausentes y las
  consultas a la API deben tener éxito. La comprobación compara el UID de `control` con `control_uid` y el SHA-256 del JSON
  ordenado de `data` con `control_hash` del contrato. Observa el estado final y no demuestra el orden de las acciones. No
  retires finalizers de recursos ajenos.


  El ConfigMap en eliminación tiene el finalizer `training.devops-quests.local/cleanup`; su Secret sintético no tiene ownerReference
  para garbage collection. Compara su UID y etiqueta `training.devops-quests.local/parent-uid` con los UID fijados del padre
  y del hijo. Elimina solo ese Secret con precondición UID y luego solo ese finalizer con pruebas de UID y finalizer.


  Calcula el hash de los bytes UTF-8 de Python `json.dumps(data, sort_keys=True)` con sus separadores y escape predeterminados.


  La comprobación no compara el tipo del Secret control ni otros metadatos.'
debrief: Las comprobaciones observaron ambas ausencias y compararon el UID y hash de datos del Secret control.
stages.0.brief: station y station-record están ausentes; el UID y hash de datos del Secret control coinciden con el contrato.
stages.0.objectives.0.text: station y station-record están ausentes; el UID y hash de datos del Secret control coinciden con
  el contrato.
hints.0.text: Un deletionTimestamp no significa que se hayan completado las obligaciones de finalizer.
hints.1.text: Haga coincidir tanto el Secret UID asociado como su etiqueta parent-UID.
hints.2.text: Limpie el registro asociado antes de liberar solo el finalizer conocido; proteger el objeto de control.
phrases.0: Observé la ausencia del objeto principal y el registro.
phrases.1: Comprobé el UID del Secret control.
phrases.2: Comparé el hash de datos del Secret control.
questions.0.points.0: Un finalizador puede retrasar la eliminación física hasta que se complete la limpieza.
questions.0.points.1: Inspeccione deletionTimestamp y el controlador responsable.
questions.0.prompt: ¿Por qué puede permanecer un objeto después de que DELETE tenga éxito?
questions.1.points.0: Puede abandonar la limpieza y dejar huérfanos los recursos externos.
questions.1.points.1: Comprenda cada obligación y limite identity antes de la eliminación.
questions.1.prompt: ¿Por qué es arriesgado eliminar todos los finalizadores?
diagnostics.config_query: kubectl get configmap/station debe tener éxito.
diagnostics.config_absent: configmap/station debe estar ausente.
diagnostics.secret_query: kubectl get secret/station-record debe tener éxito.
diagnostics.secret_absent: secret/station-record debe estar ausente.
diagnostics.control_uid: secret/control UID debe ser igual a cleanup-contract.json control_uid.
diagnostics.control_hash: secret/control data SHA-256 debe ser igual a cleanup-contract.json control_hash.
