title: Finalizers y limpieza segura
brief: |-
  La limpieza de la estación no ha terminado. Retira la configuración conservando ambos consumidores existentes y el Secret de control ajeno.

  Trabaja en la estación de trabajo, en `~/quest`, con los archivos suministrados:
  - `cleanup-contract.json`.
  - `retirement-contract.json`.

  **Requisitos:**

  - La configuración en eliminación y su registro asociado están ausentes, confirmado mediante consultas API correctas. Cada Deployment consumidor existente conserva su identidad e imagen suministrada y tiene un Pod actual listo. Su volumen de Secret sucesor de solo lectura aporta `/config/value` con los datos del registro retirado, y `http://127.0.0.1:8080` dentro del Pod devuelve la huella correspondiente. El sucesor es independiente del padre retirado según `retirement-contract.json`.
  - El Secret de control ajeno conserva su identidad y datos originales.

  Las comprobaciones observan estado e identidades actuales, no el orden de limpieza ni el historial completo. No comparan el tipo del Secret de control ni otros metadatos ajenos.
debrief: Las comprobaciones compararon ausencia, identidad y datos de control, independencia del sucesor, fuentes
  actuales de los consumidores, bytes montados y respuestas de huella.
stages.0.brief: Completa la retirada conservando consumidores dependientes y configuración de control ajena.
hints.0.text: Eliminar un objeto de configuración no migra sus consumidores. Un proceso en marcha puede conservar
  bytes antiguos aunque el próximo Pod ya no pueda inicializarse. Sigue tanto la identidad del objeto como sus dependencias
  actuales de entrega.
hints.1.text: |-
  Inspecciona la asociación con el padre, plantillas, Pods actuales y contratos locales. Muestra metadatos y referencias de origen sin revelar datos de Secret:

  ```sh
  cat cleanup-contract.json retirement-contract.json
  kubectl get configmap,secret -o json | jq '.items[] | {kind,name:.metadata.name,uid:.metadata.uid,parentUID:.metadata.labels["training.devops-quests.local/parent-uid"],owners:.metadata.ownerReferences,deleting:.metadata.deletionTimestamp}'
  kubectl get deployments -o json | jq '.items[] | {name:.metadata.name,uid:.metadata.uid,volumes:.spec.template.spec.volumes,mounts:[.spec.template.spec.containers[] | {name,volumeMounts}],conditions:.status.conditions}'
  kubectl get pods -o wide
  ```
hints.2.text: |-
  Confirma la ausencia de ambos objetos retirados, la conservación del UID y hash del Secret de control, y la entrega de configuración y huella a ambos consumidores actuales:

  La obligación registrada usa el finalizer `training.devops-quests.local/cleanup`; compara su asociación con el objeto, no otro finalizer ajeno.

  ```sh
  kubectl get configmap station --ignore-not-found -o name
  kubectl get secret station-record --ignore-not-found -o name
  kubectl get secret control -o json | python3 -c 'import hashlib,json,sys; x=json.load(sys.stdin); print(x["metadata"]["uid"]); print(hashlib.sha256(json.dumps(x["data"],sort_keys=True).encode()).hexdigest())'
  kubectl get deployments,pods -o wide
  kubectl exec deployment/dispatch -c worker -- sha256sum /config/value
  kubectl exec deployment/reporter -c worker -- sha256sum /config/value
  kubectl exec deployment/dispatch -c worker -- wget -qO- -T 2 http://127.0.0.1:8080
  kubectl exec deployment/reporter -c worker -- wget -qO- -T 2 http://127.0.0.1:8080
  ```
phrases.0: Observé la ausencia del objeto principal y el registro.
phrases.1: Comprobé el UID del Secret control.
phrases.2: Comparé el hash de datos del Secret control.
questions.0.points.0: Un finalizador puede retrasar la eliminación física hasta que se complete la limpieza.
questions.0.points.1: Inspeccione deletionTimestamp y el controlador responsable.
questions.0.prompt: ¿Por qué puede permanecer un objeto después de que DELETE tenga éxito?
questions.1.points.0: Puede abandonar la limpieza y dejar huérfanos los recursos externos.
questions.1.points.1: Comprenda cada obligación y limite identity antes de la eliminación.
questions.1.prompt: ¿Por qué es arriesgado eliminar todos los finalizadores?
diagnostics.config_query: kubectl get configmap/station debe tener éxito.
diagnostics.config_absent: configmap/station debe estar ausente.
diagnostics.secret_query: kubectl get secret/station-record debe tener éxito.
diagnostics.secret_absent: secret/station-record debe estar ausente.
diagnostics.control_uid: secret/control UID debe ser igual a cleanup-contract.json control_uid.
diagnostics.control_hash: secret/control data SHA-256 debe ser igual a cleanup-contract.json control_hash.
stages.0.objectives.0.text: La configuración en eliminación y su registro asociado están ausentes, confirmado mediante
  consultas API correctas. Cada Deployment consumidor existente conserva su identidad e imagen suministrada y tiene
  un Pod actual listo. Su volumen de Secret sucesor de solo lectura aporta `/config/value` con los datos del registro
  retirado, y `http://127.0.0.1:8080` dentro del Pod devuelve la huella correspondiente. El sucesor es independiente
  del padre retirado según `retirement-contract.json`.
stages.0.objectives.1.text: El Secret de control ajeno conserva su identidad y datos originales.
diagnostics.probe_0_1: 'Los datos actuales no permiten verificar este objetivo: El Secret de control ajeno conserva
  su identidad y datos originales.'
diagnostics.retirement_identity: Cambió la identidad del Deployment consumidor, su cantidad deseada o la imagen
  suministrada.
diagnostics.retirement_state: El consumidor no tiene su único Pod actual listo, o no se puede observar su pertenencia.
diagnostics.retirement_source: Un sucesor puede conservar la asociación con el padre retirado, contener datos distintos
  del registro original o faltar en la fuente del Pod actual.
diagnostics.retirement_delivery: Los bytes de configuración montados en un consumidor actual no coinciden con la
  huella conservada del registro.
diagnostics.retirement_fingerprint: El endpoint del consumidor actual no devuelve la huella conservada de la configuración.
diagnostics.probe_0_0: El consumidor no tiene su único Pod actual listo, o no se puede observar su pertenencia.
