title: Variable precedence
brief: 'The fleet is not publishing the intended host configuration. Recover effective inputs and the delivered
  profiles while retaining the healthy message permissions.


  Work on the workstation in `~/quest` with the supplied files:

  - `inventory.ini`.

  - `ansible.cfg`.

  - `group_vars/`.

  - `host_vars/`.

  - `rollout.yml`.

  - `profile-intent.json`.


  **Requirements:**


  - On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` contains `north-ready`. Effective inventory
  inputs and the published profile on every managed host also match `profile-intent.json`, including the individual
  exceptions; observe resolved values rather than requiring one variable-file layout.

  - On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` has mode `0644`.'
stages.0.brief: Every managed host must provide the requested route message.
stages.0.objectives.0.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` contains `north-ready`.
  Effective inventory inputs and the published profile on every managed host also match `profile-intent.json`, including
  the individual exceptions; observe resolved values rather than requiring one variable-file layout.
stages.0.objectives.1.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` has mode `0644`.
hints.0.text: A higher priority variable can replace a whole mapping rather than one field. A host exception must
  keep its intended scope, while each host still needs a complete effective profile. Stored content alone does not
  establish which inputs currently win.
hints.1.text: 'Compare group membership, inherited values, the host exception and the resolved mapping. Inventory
  output shows source data; task evaluation also resolves expressions before publication.


  ```sh

  cd ~/quest

  cat profile-intent.json ansible.cfg

  ansible-inventory --graph --vars

  ansible fleet -m ansible.builtin.debug -a var=service_profile

  cat rollout.yml

  ```'
hints.2.text: 'Inspect evaluated inputs and the published JSON on all stations, then repeat delivery. Both must
  match the intent, exceptions must remain local to their stations, and the existing message permissions must stay
  healthy.


  ```sh

  cd ~/quest

  ansible fleet -m ansible.builtin.debug -a var=service_profile

  ansible fleet -m ansible.builtin.command -a ''cat /srv/site/profile.json''

  ansible-playbook rollout.yml

  ansible-playbook rollout.yml --check --diff

  ansible fleet -m ansible.builtin.stat -a path=/srv/site/message

  ```'
debrief: Current evaluated inputs and published profiles matched each host intent, with the original healthy message
  permissions retained. This does not prove which edits or earlier runs produced the result.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I verified the result on every managed host.
diagnostics.profile_inventory: Effective inventory evaluation failed; malformed inventory or variable files, undefined route_version/service_profile values, or Ansible evaluation errors can prevent producing the per-host inputs. [Cause and check](guides#guide=ansible-5&section=profile-inventory-evaluation)
diagnostics.profile_scope: A resolved route or profile differs from the intent; fleet variables can override all, a higher-priority partial dictionary can replace inherited keys, or a host exception may have been overwritten. [Cause and check](guides#guide=ansible-5&section=profile-dictionary-precedence)
diagnostics.profile_delivery: The published host profile is stale, different or unreadable; correcting inventory without rerunning delivery, publishing values that miss a host exception, or a failed SSH read can explain it. [Cause and check](guides#guide=ansible-5&section=profile-published-state)
diagnostics.profile_observation: Profile observations could not be completed; a missing protected intent or per-host result, invalid JSON, unavailable tool, failed process or exhausted observation budget may explain it. [Cause and check](guides#guide=ansible-5&section=profile-observation-inputs)
diagnostics.probe_0_0: The combined content/profile probe stopped without a detailed marker; the workstation directory, Python or its probe module may be unavailable, or the bounded legacy SSH group was interrupted before naming a host failure. [Cause and check](guides#guide=ansible-5&section=profile-probe-startup)
diagnostics.content_1: app1 did not deliver north-ready; a higher-priority fleet route_version may still override the intended value from all, delivery may not have run, or SSH/namespace observation failed. [Cause and check](guides#guide=ansible-5&section=profile-route-precedence)
diagnostics.mode_1: app1 did not report mode 644 on /srv/site/message; a task or manual change may have altered the healthy permissions, or SSH/stat could not observe them. [Cause and check](guides#guide=ansible-5&section=profile-message-permissions)
diagnostics.content_2: app2 did not deliver north-ready; a higher-priority fleet route_version may still override the intended value from all, delivery may not have run, or SSH/namespace observation failed. [Cause and check](guides#guide=ansible-5&section=profile-route-precedence)
diagnostics.mode_2: app2 did not report mode 644 on /srv/site/message; a task or manual change may have altered the healthy permissions, or SSH/stat could not observe them. [Cause and check](guides#guide=ansible-5&section=profile-message-permissions)
diagnostics.content_3: app3 did not deliver north-ready; a higher-priority fleet route_version may still override the intended value from all, delivery may not have run, or SSH/namespace observation failed. [Cause and check](guides#guide=ansible-5&section=profile-route-precedence)
diagnostics.mode_3: app3 did not report mode 644 on /srv/site/message; a task or manual change may have altered the healthy permissions, or SSH/stat could not observe them. [Cause and check](guides#guide=ansible-5&section=profile-message-permissions)
