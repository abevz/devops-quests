diagnostics.profile_inventory: Effective inventory inputs could not be evaluated for the intended hosts. Check host
  membership and missing or unresolved variables before publication.
diagnostics.profile_scope: A resolved host input differs from the intended route or profile. A higher priority mapping
  can replace defaults, or an exception can have the wrong scope.
diagnostics.profile_delivery: A published host profile differs from the intent. Correct inventory values alone do
  not update the delivered JSON.
diagnostics.profile_observation: Current profile inputs or output could not be read within the check budget. Check
  availability and valid JSON on every host.
diagnostics.probe_0_0: Current profile inputs or output could not be read within the check budget. Check availability
  and valid JSON on every host.
