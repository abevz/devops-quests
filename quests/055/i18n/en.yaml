title: Variable precedence
brief: 'The fleet is not publishing the intended host configuration. Recover effective inputs and the delivered
  profiles while retaining the healthy message permissions.


  Work on the workstation in `~/quest` with the supplied files:

  - `inventory.ini`.

  - `ansible.cfg`.

  - `group_vars/`.

  - `host_vars/`.

  - `rollout.yml`.

  - `profile-intent.json`.


  **Requirements:**


  - On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` contains `north-ready`. Effective inventory
  inputs and the published profile on every managed host also match `profile-intent.json`, including the individual
  exceptions; observe resolved values rather than requiring one variable-file layout.

  - On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` has mode `0644`.'
stages.0.brief: Every managed host must provide the requested route message.
stages.0.objectives.0.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` contains `north-ready`.
  Effective inventory inputs and the published profile on every managed host also match `profile-intent.json`, including
  the individual exceptions; observe resolved values rather than requiring one variable-file layout.
stages.0.objectives.1.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` has mode `0644`.
hints.0.text: A higher priority variable can replace a whole mapping rather than one field. A host exception must
  keep its intended scope, while each host still needs a complete effective profile. Stored content alone does not
  establish which inputs currently win.
hints.1.text: 'Compare group membership, inherited values, the host exception and the resolved mapping. Inventory
  output shows source data; task evaluation also resolves expressions before publication.


  ```sh

  cd ~/quest

  cat profile-intent.json ansible.cfg

  ansible-inventory --graph --vars

  ansible fleet -m ansible.builtin.debug -a var=service_profile

  cat rollout.yml

  ```'
hints.2.text: 'Inspect evaluated inputs and the published JSON on all stations, then repeat delivery. Both must
  match the intent, exceptions must remain local to their stations, and the existing message permissions must stay
  healthy.


  ```sh

  cd ~/quest

  ansible fleet -m ansible.builtin.debug -a var=service_profile

  ansible fleet -m ansible.builtin.command -a ''cat /srv/site/profile.json''

  ansible-playbook rollout.yml

  ansible-playbook rollout.yml --check --diff

  ansible fleet -m ansible.builtin.stat -a path=/srv/site/message

  ```'
debrief: Current evaluated inputs and published profiles matched each host intent, with the original healthy message
  permissions retained. This does not prove which edits or earlier runs produced the result.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I verified the result on every managed host.
