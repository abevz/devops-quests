title: Variable precedence
brief: |-
  The fleet is not displaying the requested route version.

  Work on the workstation in `~/quest` with the supplied files:
  - `inventory.ini`, `ansible.cfg`, `group_vars/all.yml`, `group_vars/fleet.yml`, `rollout.yml`.

  **Requirements:**
  - File on every managed host (`app1`, `app2`, `app3`):
    - Path: `/srv/site/message`.
    - Content: `north-ready`.
    - Access mode: `0644`.

  The check observes current results; it does not establish the full execution history.
stages.0.brief: Every managed host must provide the requested route message.
stages.0.objectives.0.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` contains
  `north-ready`.
stages.0.objectives.1.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/message` has mode
  `0644`.
hints.0.text: Inventory variables can have different effective values depending on their source and precedence.
hints.1.text: |-
  Inspect effective host variables with ansible-inventory --host app1. A fleet group variable overrides the all group value.

  Inspect the inventory and the supplied playbook on the workstation:

  ```sh
  ansible-inventory -i inventory.ini --host app1
  cat group_vars/all.yml group_vars/fleet.yml
  ```
hints.2.text: |-
  Correct route_version in the winning group source and rerun the playbook.

  Verify the result from `~/quest` on the workstation:

  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/message'` — Shows `north-ready` from `app1`, `app2`, `app3`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/site/message'` — Shows `-rw-r--r--` on each host.
debrief: The fleet group override won over all.yml. You corrected the effective value and checked the
  files on the managed hosts.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I verified the result on every managed host.
