title: Variable precedence
brief: 'You joined SignalRail operations. A group override hid the intended route version. Work in ~/quest.
  Keep all changes inside this training bay.


  Inputs in `~/quest`: `inventory.ini`, `ansible.cfg`, `group_vars/all.yml`, `group_vars/fleet.yml`, `rollout.yml`.


  The bay has no Internet or external DNS. Use only its supplied files, preloaded images and private services.
  All changes must stay inside this bay.


  Initial success criteria: Without extra vars, all three message files contain north-ready, mode 0644.'
stages.0.brief: 'The fleet override won over all.yml. Make the running file contain north-ready without
  adding extra vars.


  Success criteria: Without extra vars, all three message files contain north-ready, mode 0644.'
stages.0.objectives.0.text: Without extra vars, all three message files contain north-ready, mode 0644.
hints.0.text: Inspect effective host variables with ansible-inventory --host app1.
hints.1.text: A fleet group variable overrides the all group value.
hints.2.text: Correct route_version in the winning group source and rerun the playbook.
debrief: The fleet group override won over all.yml. You corrected the effective value and checked the
  files on the managed hosts.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I verified the result on every managed host.
