title: Приоритет переменных
brief: 'Вы в команде эксплуатации SignalRail. Групповая переменная скрыла нужную версию. Работайте в ~/quest.
  Все изменения — только в этой песочнице.


  Входные файлы в `~/quest`: `inventory.ini`, `ansible.cfg`, `group_vars/all.yml`, `group_vars/fleet.yml`,
  `rollout.yml`.


  В песочнице нет интернета и внешнего DNS. Используйте только выданные файлы, предварительно загруженные
  образы и приватные сервисы. Все изменения — только в этой песочнице.


  Цели первого этапа: Без extra vars файлы message всех трёх узлов содержат north-ready и имеют режим
  0644.'
stages.0.brief: 'Переменная fleet перекрыла all.yml. Получите north-ready без extra vars.


  Результат проверки: Без extra vars файлы message всех трёх узлов содержат north-ready и имеют режим
  0644.'
stages.0.objectives.0.text: Без extra vars файлы message всех трёх узлов содержат north-ready и имеют
  режим 0644.
hints.0.text: Посмотрите итоговые переменные через ansible-inventory --host app1.
hints.1.text: Переменная группы fleet перекрывает значение all.
hints.2.text: Исправьте route_version в источнике с большим приоритетом и повторите playbook.
debrief: Переменная группы fleet перекрыла all.yml. Вы исправили итоговое значение и проверили файлы управляемых
  хостов.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я проверил результат на каждом управляемом хосте.
