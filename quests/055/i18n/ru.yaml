title: Приоритет переменных
brief: 'Флот не публикует требуемую конфигурацию станций. Восстановите действующие входные данные и доставленные
  профили, сохраняя исправные права файла сообщения.


  Работайте на workstation в `~/quest` с предоставленными файлами:

  - `inventory.ini`.

  - `ansible.cfg`.

  - `group_vars/`.

  - `host_vars/`.

  - `rollout.yml`.

  - `profile-intent.json`.


  **Требования:**


  - На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/message` содержит `north-ready`. Действующие
  входы inventory и опубликованный профиль на каждом управляемом хосте также соответствуют `profile-intent.json`,
  включая исключения для отдельных станций; проверяются вычисленные значения, а не единственная структура файлов
  переменных.

  - На каждом управляемом хосте (`app1`, `app2`, `app3`) путь `/srv/site/message` имеет режим `0644`.'
stages.0.brief: Каждый управляемый хост должен предоставлять требуемое сообщение маршрута.
stages.0.objectives.0.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/message` содержит
  `north-ready`. Действующие входы inventory и опубликованный профиль на каждом управляемом хосте также соответствуют
  `profile-intent.json`, включая исключения для отдельных станций; проверяются вычисленные значения, а не единственная
  структура файлов переменных.
stages.0.objectives.1.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) путь `/srv/site/message` имеет
  режим `0644`.
hints.0.text: Переменная с более высоким приоритетом может заменить весь словарь, а не одно поле. Исключение хоста
  должно сохранять свою область действия, но каждой станции нужен полный действующий профиль. Сохранённое содержимое
  само по себе не показывает, какие входы сейчас побеждают.
hints.1.text: 'Сравните членство в группах, наследуемые значения, исключение хоста и вычисленный словарь. Вывод
  inventory показывает исходные данные; вычисление задачи также разрешает выражения перед публикацией.


  ```sh

  cd ~/quest

  cat profile-intent.json ansible.cfg

  ansible-inventory --graph --vars

  ansible fleet -m ansible.builtin.debug -a var=service_profile

  cat rollout.yml

  ```'
hints.2.text: 'Проверьте вычисленные входы и опубликованный JSON на всех станциях, затем повторите доставку. Оба
  результата должны соответствовать намерению, исключения должны оставаться локальными, а исходные права сообщения
  — исправными.


  ```sh

  cd ~/quest

  ansible fleet -m ansible.builtin.debug -a var=service_profile

  ansible fleet -m ansible.builtin.command -a ''cat /srv/site/profile.json''

  ansible-playbook rollout.yml

  ansible-playbook rollout.yml --check --diff

  ansible fleet -m ansible.builtin.stat -a path=/srv/site/message

  ```'
debrief: Текущие вычисленные входы и опубликованные профили совпали с намерением для каждой станции; исходные исправные
  права сообщения сохранены. Проверка не доказывает, какие правки или прошлые запуски привели к результату.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я проверил результат на каждом управляемом хосте.
diagnostics.profile_inventory: 'Вычисление inventory завершилось ошибкой: некорректные файлы inventory и переменных, неопределённые route_version/service_profile или ошибки Ansible мешают получить входные данные хостов. [Причина и проверка](guides#guide=ansible-5&section=profile-inventory-evaluation)'
diagnostics.profile_scope: 'Вычисленный маршрут или профиль отличается от intent: переменные fleet перекрывают all, частичный словарь с большим приоритетом заменяет унаследованные ключи либо исключение хоста было перезаписано. [Причина и проверка](guides#guide=ansible-5&section=profile-dictionary-precedence)'
diagnostics.profile_delivery: 'Опубликованный профиль устарел, отличается или недоступен: исправление inventory без повторной доставки, потеря исключения хоста при публикации или сбой чтения SSH могут объяснить это. [Причина и проверка](guides#guide=ansible-5&section=profile-published-state)'
diagnostics.profile_observation: 'Наблюдение профилей не завершено: причиной могут быть отсутствующий защищённый intent или результат хоста, некорректный JSON, недоступный инструмент, сбой процесса или исчерпанный лимит времени. [Причина и проверка](guides#guide=ansible-5&section=profile-observation-inputs)'
diagnostics.probe_0_0: 'Общая проверка содержимого и профилей остановилась без подробного маркера: рабочий каталог, Python или модуль проверки недоступны либо ограниченная группа SSH прервана до сообщения об ошибке хоста. [Причина и проверка](guides#guide=ansible-5&section=profile-probe-startup)'
diagnostics.content_1: 'app1 не доставил north-ready: route_version из fleet ещё может перекрывать нужное значение all, доставка не выполнялась либо наблюдение SSH/namespace завершилось ошибкой. [Причина и проверка](guides#guide=ansible-5&section=profile-route-precedence)'
diagnostics.mode_1: 'app1 не подтвердил режим 644 у /srv/site/message: задача или ручная правка могли изменить правильные права либо SSH/stat не смогли их прочитать. [Причина и проверка](guides#guide=ansible-5&section=profile-message-permissions)'
