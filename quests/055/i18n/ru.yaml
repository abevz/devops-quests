title: Приоритет переменных
brief: |-
  Флот не показывает требуемую версию маршрута.

  Работайте на workstation в `~/quest` с файлами `inventory.ini`, `ansible.cfg`, `group_vars/all.yml`, `group_vars/fleet.yml`, `rollout.yml`.

  **Требования:**
  - Файл на каждом управляемом хосте (`app1`, `app2`, `app3`):
    - Путь: `/srv/site/message`.
    - Содержимое: `north-ready`.
    - Режим доступа: `0644`.

  **Самопроверка перед Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/message'` — Показывает `north-ready` от `app1`, `app2`, `app3`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/site/message'` — Показывает `-rw-r--r--` на каждом хосте.
stages.0.brief: Каждый управляемый хост должен предоставлять требуемое сообщение маршрута.
stages.0.objectives.0.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/message` содержит
  `north-ready`.
stages.0.objectives.1.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) путь `/srv/site/message` имеет
  режим `0644`.
hints.0.text: Посмотрите итоговые переменные через ansible-inventory --host app1.
hints.1.text: Переменная группы fleet перекрывает значение all.
hints.2.text: Исправьте route_version в источнике с большим приоритетом и повторите playbook.
debrief: Переменная группы fleet перекрыла all.yml. Вы исправили итоговое значение и проверили файлы управляемых
  хостов.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я проверил результат на каждом управляемом хосте.
