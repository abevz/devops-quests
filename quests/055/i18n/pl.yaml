title: Zmienne pierwszeństwo
brief: 'Dołączyłeś do operacji SignalRail. Zastąpienie grupy ukryło zamierzoną wersję trasy. Pracuj w
  ~/quest. Wszystkie zmiany przechowuj w tej komorze szkoleniowej.


  Wejścia w `~/quest`: `inventory.ini`, `ansible.cfg`, `group_vars/all.yml`, `group_vars/fleet.yml`, `rollout.yml`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Wszystkie zmiany muszą pozostać w tej zatoce.


  Początkowe kryteria sukcesu: bez extra vars wszystkie trzy pliki message zawierają north-ready, tryb
  0644.'
stages.0.brief: 'Zastąpienie fleet zwyciężyło nad all.yml. Spraw, aby działający plik zawierał north-ready
  bez dodawania extra vars.


  Kryteria sukcesu: Bez extra vars wszystkie trzy pliki message zawierają north-ready, tryb 0644.'
stages.0.objectives.0.text: Bez extra vars wszystkie trzy pliki message zawierają north-ready, tryb 0644.
hints.0.text: Sprawdź efektywne zmienne hosta za pomocą ansible-inventory --host app1.
hints.1.text: Zmienna grupowa fleet zastępuje wartość grupową all.
hints.2.text: Popraw route_version w zwycięskim źródle grupy i uruchom ponownie playbook.
debrief: Zastąpienie grupy fleet zwyciężyło nad all.yml. Poprawiłeś wartość efektywną i sprawdziłeś pliki
  na zarządzanych hostach.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem wynik na każdym zarządzanym hoście.
