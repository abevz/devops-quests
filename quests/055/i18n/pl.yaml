title: Zmienne pierwszeństwo
brief: |-
  Flota nie wyświetla wymaganej wersji trasy.

  Pracuj na workstation w `~/quest` z dostarczonymi plikami:
  - `inventory.ini`, `ansible.cfg`, `group_vars/all.yml`, `group_vars/fleet.yml`, `rollout.yml`.

  **Wymagania:**
  - Plik na każdym zarządzanym hoście (`app1`, `app2`, `app3`):
    - Ścieżka: `/srv/site/message`.
    - Treść: `north-ready`.
    - Tryb dostępu: `0644`.

  Sprawdzenie obserwuje bieżące wyniki; nie ustala pełnej historii wykonania.
stages.0.brief: Każdy zarządzany host musi udostępniać wymagany komunikat trasy.
stages.0.objectives.0.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/message`
  zawiera `north-ready`.
stages.0.objectives.1.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) ścieżka `/srv/site/message`
  ma tryb `0644`.
hints.0.text: Efektywne wartości zmiennych inventory zależą od źródła i pierwszeństwa.
hints.1.text: |-
  Sprawdź efektywne zmienne hosta za pomocą ansible-inventory --host app1. Zmienna grupowa fleet zastępuje wartość grupową all.

  Sprawdź inventory i dostarczony playbook na workstation:

  ```sh
  ansible-inventory -i inventory.ini --host app1
  cat group_vars/all.yml group_vars/fleet.yml
  ```
hints.2.text: |-
  Popraw route_version w zwycięskim źródle grupy i uruchom ponownie playbook.

  Sprawdź wynik z `~/quest` na workstation:

  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/message'` — Pokazuje `north-ready` z `app1`, `app2`, `app3`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/site/message'` — Pokazuje `-rw-r--r--` na każdym hoście.
debrief: Zastąpienie grupy fleet zwyciężyło nad all.yml. Poprawiłeś wartość efektywną i sprawdziłeś pliki
  na zarządzanych hostach.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem wynik na każdym zarządzanym hoście.
