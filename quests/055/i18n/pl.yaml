title: Zmienne pierwszeństwo
brief: 'Flota nie publikuje zamierzonej konfiguracji stacji. Przywróć efektywne wejścia i dostarczone profile, zachowując
  poprawne uprawnienia pliku wiadomości.


  Pracuj na workstation w `~/quest` z dostarczonymi plikami:

  - `inventory.ini`.

  - `ansible.cfg`.

  - `group_vars/`.

  - `host_vars/`.

  - `rollout.yml`.

  - `profile-intent.json`.


  **Wymagania:**


  - Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/message` zawiera `north-ready`. Efektywne
  wejścia inventory i opublikowany profil każdego zarządzanego hosta odpowiadają również `profile-intent.json`,
  wraz z wyjątkami poszczególnych stacji; sprawdzane są obliczone wartości, a nie jeden układ plików zmiennych.

  - Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) ścieżka `/srv/site/message` ma tryb `0644`.'
stages.0.brief: Każdy zarządzany host musi udostępniać wymagany komunikat trasy.
stages.0.objectives.0.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/message` zawiera
  `north-ready`. Efektywne wejścia inventory i opublikowany profil każdego zarządzanego hosta odpowiadają również
  `profile-intent.json`, wraz z wyjątkami poszczególnych stacji; sprawdzane są obliczone wartości, a nie jeden układ
  plików zmiennych.
stages.0.objectives.1.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) ścieżka `/srv/site/message` ma
  tryb `0644`.
hints.0.text: Zmienna o wyższym priorytecie może zastąpić całą mapę zamiast jednego pola. Wyjątek hosta musi zachować
  swój zakres, a każda stacja nadal potrzebuje kompletnego efektywnego profilu. Sama zapisana treść nie wskazuje,
  które wejścia obecnie wygrywają.
hints.1.text: 'Porównaj członkostwo w grupach, dziedziczone wartości, wyjątek hosta i obliczoną mapę. Inventory
  pokazuje dane źródłowe; obliczanie zadań rozwiązuje także wyrażenia przed publikacją.


  ```sh

  cd ~/quest

  cat profile-intent.json ansible.cfg

  ansible-inventory --graph --vars

  ansible fleet -m ansible.builtin.debug -a var=service_profile

  cat rollout.yml

  ```'
hints.2.text: 'Sprawdź obliczone wejścia i opublikowany JSON na wszystkich stacjach, a potem powtórz dostarczanie.
  Oba wyniki muszą odpowiadać intencji, wyjątki pozostać lokalne, a pierwotne uprawnienia wiadomości — poprawne.


  ```sh

  cd ~/quest

  ansible fleet -m ansible.builtin.debug -a var=service_profile

  ansible fleet -m ansible.builtin.command -a ''cat /srv/site/profile.json''

  ansible-playbook rollout.yml

  ansible-playbook rollout.yml --check --diff

  ansible fleet -m ansible.builtin.stat -a path=/srv/site/message

  ```'
debrief: Bieżące obliczone wejścia i opublikowane profile odpowiadały intencji każdej stacji; zachowano poprawne
  uprawnienia wiadomości. Nie dowodzi to, które zmiany lub wcześniejsze uruchomienia dały wynik.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem wynik na każdym zarządzanym hoście.
diagnostics.profile_inventory: Obliczenie inventory zawiodło; błędne pliki inventory lub zmiennych, niezdefiniowane route_version/service_profile albo błędy Ansible mogą blokować dane hostów. [Przyczyna i kontrola](guides#guide=ansible-5&section=profile-inventory-evaluation)
diagnostics.profile_scope: Rozwiązana trasa lub profil różni się od intent; zmienne fleet mogą nadpisać all, częściowy słownik o wyższym priorytecie zastąpić klucze nadrzędne albo wyjątek hosta został nadpisany. [Przyczyna i kontrola](guides#guide=ansible-5&section=profile-dictionary-precedence)
diagnostics.profile_delivery: Opublikowany profil hosta jest stary, inny lub nieczytelny; poprawa inventory bez ponownej dostawy, utrata wyjątku hosta przy publikacji lub błąd odczytu SSH może to wyjaśnić. [Przyczyna i kontrola](guides#guide=ansible-5&section=profile-published-state)
diagnostics.profile_observation: Obserwacje profili nie zostały ukończone; przyczyną może być brak chronionego intent lub wyniku hosta, błędny JSON, niedostępne narzędzie, błąd procesu albo wyczerpany limit czasu. [Przyczyna i kontrola](guides#guide=ansible-5&section=profile-observation-inputs)
diagnostics.probe_0_0: Połączona kontrola treści i profili zatrzymała się bez szczegółowego markera; katalog roboczy, Python lub moduł kontroli może być niedostępny albo ograniczona grupa SSH została przerwana przed nazwaniem błędu hosta. [Przyczyna i kontrola](guides#guide=ansible-5&section=profile-probe-startup)
diagnostics.content_1: app1 nie dostarczył north-ready; route_version z fleet może nadal nadpisywać wartość all, dostawa nie została uruchomiona albo obserwacja SSH/namespace zawiodła. [Przyczyna i kontrola](guides#guide=ansible-5&section=profile-route-precedence)
diagnostics.mode_1: app1 nie zgłosił trybu 644 dla /srv/site/message; zadanie lub ręczna zmiana mogły naruszyć poprawne prawa albo SSH/stat ich nie odczytał. [Przyczyna i kontrola](guides#guide=ansible-5&section=profile-message-permissions)
