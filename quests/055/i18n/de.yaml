title: Variabler Vorrang
brief: 'Die Flotte veröffentlicht nicht die beabsichtigte Stationskonfiguration. Stelle wirksame Eingaben und ausgelieferte
  Profile wieder her und bewahre die gesunden Nachrichtenberechtigungen.


  Arbeite auf der Workstation in `~/quest` mit den bereitgestellten Dateien:

  - `inventory.ini`.

  - `ansible.cfg`.

  - `group_vars/`.

  - `host_vars/`.

  - `rollout.yml`.

  - `profile-intent.json`.


  **Anforderungen:**


  - Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/message` den Inhalt `north-ready`. Wirksame
  Inventory-Eingaben und das veröffentlichte Profil jedes verwalteten Hosts entsprechen außerdem `profile-intent.json`,
  einschließlich stationsspezifischer Ausnahmen; geprüft werden aufgelöste Werte statt einer bestimmten Variablendatei-Struktur.

  - Auf jedem verwalteten Host (`app1`, `app2`, `app3`) hat `/srv/site/message` den Modus `0644`.'
stages.0.brief: Jeder verwaltete Host muss die angeforderte Routennachricht bereitstellen.
stages.0.objectives.0.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/message` den
  Inhalt `north-ready`. Wirksame Inventory-Eingaben und das veröffentlichte Profil jedes verwalteten Hosts entsprechen
  außerdem `profile-intent.json`, einschließlich stationsspezifischer Ausnahmen; geprüft werden aufgelöste Werte
  statt einer bestimmten Variablendatei-Struktur.
stages.0.objectives.1.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) hat `/srv/site/message` den Modus
  `0644`.
hints.0.text: Eine Variable höherer Priorität kann eine ganze Zuordnung statt eines Feldes ersetzen. Eine Hostausnahme
  muss ihren Geltungsbereich behalten, während jede Station ein vollständiges wirksames Profil benötigt. Gespeicherter
  Inhalt allein belegt keine aktuell gewinnenden Eingaben.
hints.1.text: 'Vergleiche Gruppenmitgliedschaft, geerbte Werte, Hostausnahme und aufgelöste Zuordnung. Inventory-Ausgabe
  zeigt Quelldaten; die Task-Auswertung löst vor der Veröffentlichung auch Ausdrücke auf.


  ```sh

  cd ~/quest

  cat profile-intent.json ansible.cfg

  ansible-inventory --graph --vars

  ansible fleet -m ansible.builtin.debug -a var=service_profile

  cat rollout.yml

  ```'
hints.2.text: 'Prüfe ausgewertete Eingaben und veröffentlichtes JSON auf allen Stationen und wiederhole die Auslieferung.
  Beide müssen der Absicht entsprechen, Ausnahmen müssen lokal bleiben und die ursprünglichen Nachrichtenberechtigungen
  gesund bleiben.


  ```sh

  cd ~/quest

  ansible fleet -m ansible.builtin.debug -a var=service_profile

  ansible fleet -m ansible.builtin.command -a ''cat /srv/site/profile.json''

  ansible-playbook rollout.yml

  ansible-playbook rollout.yml --check --diff

  ansible fleet -m ansible.builtin.stat -a path=/srv/site/message

  ```'
debrief: Aktuell ausgewertete Eingaben und veröffentlichte Profile entsprachen jeder Stationsabsicht; die gesunden
  Nachrichtenberechtigungen blieben erhalten. Dies belegt nicht, welche Änderungen oder früheren Läufe das Ergebnis
  erzeugten.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe das Ergebnis auf jedem verwalteten Host überprüft.
diagnostics.profile_inventory: Die Inventory-Auswertung schlug fehl; fehlerhafte Inventory-/Variablendateien, undefinierte route_version/service_profile oder Ansible-Auswertungsfehler verhindern Eingaben je Host. [Ursache und Prüfung](guides#guide=ansible-5&section=profile-inventory-evaluation)
diagnostics.profile_scope: Eine aufgelöste Route oder ein Profil weicht vom Intent ab; fleet-Variablen können all überlagern, ein höher priorisiertes Teil-Dictionary geerbte Schlüssel ersetzen oder eine Host-Ausnahme wurde überschrieben. [Ursache und Prüfung](guides#guide=ansible-5&section=profile-dictionary-precedence)
diagnostics.profile_delivery: Das veröffentlichte Host-Profil ist veraltet, abweichend oder unlesbar; korrigiertes Inventory ohne erneute Zustellung, fehlende Host-Ausnahme bei der Publikation oder ein SSH-Lesefehler können die Ursache sein. [Ursache und Prüfung](guides#guide=ansible-5&section=profile-published-state)
diagnostics.profile_observation: Profilbeobachtungen konnten nicht abgeschlossen werden; fehlender geschützter Intent oder Host-Ergebnis, ungültiges JSON, fehlendes Werkzeug, fehlgeschlagener Prozess oder erschöpftes Zeitbudget können die Ursache sein. [Ursache und Prüfung](guides#guide=ansible-5&section=profile-observation-inputs)
diagnostics.probe_0_0: Die kombinierte Inhalts-/Profilprüfung endete ohne Detailmarker; Arbeitsverzeichnis, Python oder Prüfmodul sind möglicherweise nicht verfügbar oder die begrenzte SSH-Gruppe wurde vor der Hostdiagnose unterbrochen. [Ursache und Prüfung](guides#guide=ansible-5&section=profile-probe-startup)
diagnostics.content_1: app1 lieferte nicht north-ready; route_version aus fleet überlagert möglicherweise noch den Wert aus all, die Zustellung lief nicht oder SSH-/Namespace-Beobachtung schlug fehl. [Ursache und Prüfung](guides#guide=ansible-5&section=profile-route-precedence)
diagnostics.mode_1: app1 meldete für /srv/site/message nicht Modus 644; eine Aufgabe oder manuelle Änderung hat möglicherweise korrekte Rechte verändert oder SSH/stat konnte sie nicht beobachten. [Ursache und Prüfung](guides#guide=ansible-5&section=profile-message-permissions)
