title: Variabler Vorrang
brief: 'Sie sind dem Betrieb SignalRail beigetreten. Durch eine Gruppenüberschreibung wurde die beabsichtigte
  route-Version ausgeblendet. Arbeiten Sie in ~/quest.. Bewahren Sie alle Änderungen in diesem Trainingsbereich
  auf.


  Eingänge in `~/quest`: `inventory.ini`, `ansible.cfg`, `group_vars/all.yml`, `group_vars/fleet.yml`,
  `rollout.yml`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur die bereitgestellten Dateien,
  vorinstallierten Bilder und privaten Dienste. Alle Änderungen müssen innerhalb dieser Bucht bleiben.


  Erste Erfolgskriterien: Ohne extra vars enthalten alle drei message-Dateien north-ready, Modus 0644.'
stages.0.brief: 'Der Override fleet setzte sich gegen all.yml durch. Sorgen Sie dafür, dass die laufende
  Datei north-ready enthält, ohne extra vars hinzuzufügen.


  Erfolgskriterium: Ohne extra vars enthalten alle drei message-Dateien north-ready, Modus 0644.'
stages.0.objectives.0.text: Ohne extra vars enthalten alle drei message-Dateien north-ready, Modus 0644.
hints.0.text: Überprüfen Sie effektive Hostvariablen mit ansible-inventory --host app1.
hints.1.text: Eine fleet-Gruppenvariable überschreibt den Gesamtgruppenwert.
hints.2.text: Korrigieren Sie route_version in der Gewinnergruppenquelle und führen Sie playbook erneut
  aus.
debrief: Der Gruppen-Override fleet setzte sich gegen all.yml durch. Sie haben den effektiven Wert korrigiert
  und die Dateien auf den verwalteten Hosts überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe das Ergebnis auf jedem verwalteten Host überprüft.
