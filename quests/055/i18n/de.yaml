title: Variabler Vorrang
brief: |-
  Die Flotte zeigt nicht die angeforderte Routenversion.

  Arbeiten Sie auf der Workstation in `~/quest` mit den bereitgestellten Dateien:
  - `inventory.ini`, `ansible.cfg`, `group_vars/all.yml`, `group_vars/fleet.yml`, `rollout.yml`.

  **Anforderungen:**
  - Datei auf jedem verwalteten Host (`app1`, `app2`, `app3`):
    - Pfad: `/srv/site/message`.
    - Inhalt: `north-ready`.
    - Zugriffsmodus: `0644`.

  Die Prüfung beobachtet aktuelle Ergebnisse; sie belegt nicht die vollständige Ausführungshistorie.
stages.0.brief: Jeder verwaltete Host muss die angeforderte Routennachricht bereitstellen.
stages.0.objectives.0.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/message`
  den Inhalt `north-ready`.
stages.0.objectives.1.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) hat `/srv/site/message`
  den Modus `0644`.
hints.0.text: Die wirksamen Werte von Inventory-Variablen hängen von Quelle und Vorrang ab.
hints.1.text: |-
  Überprüfen Sie effektive Hostvariablen mit ansible-inventory --host app1. Eine fleet-Gruppenvariable überschreibt den Gesamtgruppenwert.

  Prüfen Sie Inventory und das bereitgestellte Playbook auf der Workstation:

  ```sh
  ansible-inventory -i inventory.ini --host app1
  cat group_vars/all.yml group_vars/fleet.yml
  ```
hints.2.text: |-
  Korrigieren Sie route_version in der Gewinnergruppenquelle und führen Sie playbook erneut aus.

  Prüfen Sie das Ergebnis in `~/quest` auf der Workstation:

  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/message'` — Zeigt `north-ready` von `app1`, `app2`, `app3`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/site/message'` — Zeigt `-rw-r--r--` auf jedem Host.
debrief: Der Gruppen-Override fleet setzte sich gegen all.yml durch. Sie haben den effektiven Wert korrigiert
  und die Dateien auf den verwalteten Hosts überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe das Ergebnis auf jedem verwalteten Host überprüft.
