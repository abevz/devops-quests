diagnostics.profile_inventory: Wirksame Inventory-Eingaben konnten für die vorgesehenen Hosts nicht ausgewertet
  werden. Prüfe Mitgliedschaft sowie fehlende oder unaufgelöste Variablen vor der Veröffentlichung.
diagnostics.profile_scope: Eine aufgelöste Stationseingabe weicht von Route oder Profil ab. Eine Zuordnung höherer
  Priorität kann Defaults ersetzen; eine Ausnahme kann den falschen Geltungsbereich haben.
diagnostics.profile_delivery: Ein veröffentlichtes Stationsprofil weicht von der Absicht ab. Korrekte Inventory-Werte
  allein aktualisieren ausgeliefertes JSON nicht.
diagnostics.profile_observation: Aktuelle Profileingaben oder Ausgaben konnten innerhalb des Prüfzeitraums nicht
  gelesen werden. Prüfe Verfügbarkeit und gültiges JSON auf jeder Station.
diagnostics.probe_0_0: Aktuelle Profileingaben oder Ausgaben konnten innerhalb des Prüfzeitraums nicht gelesen werden.
  Prüfe Verfügbarkeit und gültiges JSON auf jeder Station.
