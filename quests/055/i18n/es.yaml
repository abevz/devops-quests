title: Prioridad variable
brief: 'Te uniste a las operaciones de SignalRail. Una anulación de grupo ocultó la versión route prevista.
  Trabajar en ~/quest. Mantenga todos los cambios dentro de esta bahía de entrenamiento.


  Entradas en `~/quest`: `inventory.ini`, `ansible.cfg`, `group_vars/all.yml`, `group_vars/fleet.yml`,
  `rollout.yml`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente los archivos suministrados, las imágenes
  precargadas y los servicios privados. Todos los cambios deben permanecer dentro de esta bahía.


  Criterios de éxito iniciales: sin extra vars, los tres archivos message contienen north-ready, modo
  0644.'
stages.0.brief: 'La anulación fleet venció a all.yml. Haga que el archivo en ejecución contenga north-ready
  sin agregar extra vars.


  Criterios de éxito: sin extra vars, los tres archivos message contienen north-ready, modo 0644.'
stages.0.objectives.0.text: Sin extra vars, los tres archivos message contienen north-ready, modo 0644.
hints.0.text: Inspeccione variables del lenguaje principal efectivas con ansible-inventory --host app1.
hints.1.text: Una variable de grupo fleet anula el valor de todo el grupo.
hints.2.text: Corrija route_version en la fuente del grupo ganador y vuelva a ejecutar playbook.
debrief: La anulación del grupo fleet venció a all.yml. Corregió el valor efectivo y verificó los archivos
  en los hosts administrados.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el resultado en cada host administrado.
