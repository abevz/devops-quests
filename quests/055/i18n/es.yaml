diagnostics.mode_2: app2 no informó modo 644 en /srv/site/message; una tarea o cambio manual puede haber alterado los permisos correctos o SSH/stat no pudo observarlos. [Causa y comprobación](guides#guide=ansible-5&section=profile-message-permissions)
