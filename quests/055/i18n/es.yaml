title: Prioridad variable
brief: 'La flota no publica la configuración prevista de las estaciones. Recupera las entradas efectivas y los perfiles
  entregados conservando los permisos correctos del mensaje.


  Trabaja en la workstation en `~/quest` con los archivos suministrados:

  - `inventory.ini`.

  - `ansible.cfg`.

  - `group_vars/`.

  - `host_vars/`.

  - `rollout.yml`.

  - `profile-intent.json`.


  **Requisitos:**


  - En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` contiene `north-ready`. Las entradas
  efectivas del inventario y el perfil publicado en cada host también coinciden con `profile-intent.json`, incluidas
  las excepciones por estación; se observan valores resueltos, no una única estructura de archivos de variables.

  - En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` tiene el modo `0644`.'
stages.0.brief: Cada host administrado debe ofrecer el mensaje de ruta solicitado.
stages.0.objectives.0.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` contiene `north-ready`.
  Las entradas efectivas del inventario y el perfil publicado en cada host también coinciden con `profile-intent.json`,
  incluidas las excepciones por estación; se observan valores resueltos, no una única estructura de archivos de
  variables.
stages.0.objectives.1.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` tiene el modo
  `0644`.
hints.0.text: Una variable de mayor prioridad puede reemplazar un mapa entero en vez de un campo. Una excepción
  de host debe conservar su ámbito, mientras cada estación necesita un perfil efectivo completo. El contenido almacenado
  no demuestra por sí solo qué entradas prevalecen ahora.
hints.1.text: 'Compara pertenencia a grupos, valores heredados, excepción de host y mapa resuelto. El inventario
  muestra datos de origen; la evaluación de tareas también resuelve expresiones antes de publicar.


  ```sh

  cd ~/quest

  cat profile-intent.json ansible.cfg

  ansible-inventory --graph --vars

  ansible fleet -m ansible.builtin.debug -a var=service_profile

  cat rollout.yml

  ```'
hints.2.text: 'Inspecciona las entradas evaluadas y el JSON publicado en todas las estaciones y repite la entrega.
  Ambos deben seguir la intención, las excepciones deben mantenerse locales y los permisos originales del mensaje
  deben seguir correctos.


  ```sh

  cd ~/quest

  ansible fleet -m ansible.builtin.debug -a var=service_profile

  ansible fleet -m ansible.builtin.command -a ''cat /srv/site/profile.json''

  ansible-playbook rollout.yml

  ansible-playbook rollout.yml --check --diff

  ansible fleet -m ansible.builtin.stat -a path=/srv/site/message

  ```'
debrief: Las entradas evaluadas y los perfiles publicados coincidieron con la intención de cada estación y conservaron
  los permisos correctos del mensaje. No se demuestra qué ediciones o ejecuciones anteriores produjeron el resultado.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el resultado en cada host administrado.
diagnostics.content_1: 'app1, `/srv/site/message`: contenido `north-ready`.'
diagnostics.content_2: 'app2, `/srv/site/message`: contenido `north-ready`.'
diagnostics.content_3: 'app3, `/srv/site/message`: contenido `north-ready`.'
diagnostics.mode_1: 'app1, `/srv/site/message`: modo de acceso `644`.'
diagnostics.mode_2: 'app2, `/srv/site/message`: modo de acceso `644`.'
diagnostics.mode_3: 'app3, `/srv/site/message`: modo de acceso `644`.'
diagnostics.profile_inventory: No se pudieron evaluar las entradas efectivas para los hosts previstos. Revisa la
  pertenencia y las variables ausentes o sin resolver antes de publicar.
diagnostics.profile_scope: Una entrada resuelta difiere de la ruta o del perfil previsto. Un mapa de mayor prioridad
  puede reemplazar defaults, o una excepción puede tener un ámbito incorrecto.
diagnostics.profile_delivery: Un perfil publicado difiere de la intención. Corregir los valores del inventario no
  actualiza por sí solo el JSON entregado.
diagnostics.profile_observation: No se pudieron leer las entradas o salidas actuales dentro del tiempo limitado.
  Comprueba disponibilidad y JSON válido en cada estación.
diagnostics.probe_0_0: No se pudieron leer las entradas o salidas actuales dentro del tiempo limitado. Comprueba
  disponibilidad y JSON válido en cada estación.
