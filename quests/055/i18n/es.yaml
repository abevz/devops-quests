title: Prioridad variable
brief: |-
  La flota no muestra la versión de ruta solicitada.

  Trabaja en la workstation en `~/quest` con `inventory.ini`, `ansible.cfg`, `group_vars/all.yml`, `group_vars/fleet.yml`, `rollout.yml`.

  **Requisitos:**
  - Archivo en cada host administrado (`app1`, `app2`, `app3`):
    - Ruta: `/srv/site/message`.
    - Contenido: `north-ready`.
    - Modo de acceso: `0644`.

  **Verifica antes de Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'runuser -u nobody -- cat /srv/site/message'` — Muestra `north-ready` de `app1`, `app2`, `app3`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -l /srv/site/message'` — Muestra `-rw-r--r--` en cada host.
stages.0.brief: Cada host administrado debe ofrecer el mensaje de ruta solicitado.
stages.0.objectives.0.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` contiene `north-ready`.
stages.0.objectives.1.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/message` tiene el modo
  `0644`.
hints.0.text: Inspeccione variables del lenguaje principal efectivas con ansible-inventory --host app1.
hints.1.text: Una variable de grupo fleet anula el valor de todo el grupo.
hints.2.text: Corrija route_version en la fuente del grupo ganador y vuelva a ejecutar playbook.
debrief: La anulación del grupo fleet venció a all.yml. Corregió el valor efectivo y verificó los archivos en los
  hosts administrados.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el resultado en cada host administrado.
