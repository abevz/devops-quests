  - DQ_NAMESPACE
  - DQ_APP_IMAGE
  - KUBECONFIG
  - TF_CLI_CONFIG_FILE
  files:
  - inventory.ini
  - ansible.cfg
  - rollout.yml
  - board.yaml
  - service.yaml
  services: []
book:
