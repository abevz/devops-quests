title: Kontrolowana konserwacja
brief: "Przekazanie konserwacyjne jest niekompletne na zarządzanych hostach i w aplikacji.\n\nPracuj w `~/quest`\
  \ na stacji roboczej. Dane wejściowe według etapu:\n- Etap 1: `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n\
  - Etap 2: `board.yaml`, `service.yaml`.\n\n**Wymagania:**\n\n- Etap 1:\n  - Każdy play w `rollout.yml` jest skonfigurowany\
  \ do obsługi jednego zarządzanego hosta naraz.\n  - Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) `/srv/site/maintenance.txt`\
  \ zawiera `north-40`.\n  - Sprawdzany playbook to `~/quest/rollout.yml` na stacji roboczej.\n- Etap 2:\n  - Deployment\
  \ `board` kończy rollout z `2` replikami i `2` dostępnymi replikami; jego RollingUpdate dopuszcza `0` niedostępnych\
  \ i `1` dodatkową replikę.\n  - Service `board` wybiera `app=board` i kieruje port `8080` na port docelowy `8080`.\n\
  \  - Każdy niekończący się Pod w fazie `Running` z etykietą `app=board` otrzymuje `north-40` z `http://board:8080`.\n\
  \n**Sprawdź przed Check & finish:**\n\n- Etap 1: Podgląd przetwarza jeden host na partię, a każdy z `app1`, `app2`,\
  \ `app3` pokazuje `north-40`.\n\n  ```sh\n  ansible-playbook rollout.yml --check\n  for n in 1 2 3; do\n    host=\"\
  app${n}-${DQ_NAMESPACE#dq-}\"\n    printf \"%s: \" \"$host\"\n    ssh -n -o BatchMode=yes -p 2222 \"root@$host\"\
  \ 'cat /srv/site/maintenance.txt'\n  done\n  ```\n\n- Etap 2: Deployment i Service spełniają wymagania; żądania\
  \ konsumentów wypisują `north-40`.\n\n  ```sh\n  kubectl get deployment board -o yaml\n  kubectl get service board\
  \ -o yaml\n  for pod in $(kubectl get pods -l app=board -o json | jq -r '.items[]|select(.metadata.deletionTimestamp==null\
  \ and .status.phase==\"Running\")|.metadata.name'); do\n    kubectl exec \"$pod\" -- wget -qO- http://board:8080\n\
  \    printf \"\\n\"\n  done\n  ```\n\nKontrola sprawdza zadeklarowaną politykę partii, bieżące zasoby i odpowiedzi;\
  \ nie dowodzi kolejności wykonania, zachowania tożsamości Service ani konfiguracji readiness-probe."
debrief: Szeregowe aktualizacje celów i stopniowa wymiana bramkowana readiness zapewniły odrębne mechanizmy dostępności.
stages.0.brief: Zadeklarowane partie konserwacyjne muszą zawierać po jednym hoście.
stages.1.brief: Dostępność aplikacji i routing usługi muszą być zgodne.
hints.0.text: Oddziel umowę flotową od aplikacji rollout.
hints.1.text: 'Strategie serial i Deployment kontrolują różne systemy. Użyj `serial: 1` w każdym play konserwacyjnym.'
hints.2.text: Zachowaj readiness i selectors podczas zmiany odpowiedzi.
phrases.0: Ograniczyłem partie konserwacyjne do partii seryjnej.
phrases.1: Sprawdziłem umowę serwisową na każdym celu.
phrases.2: W trakcie rolloutu zweryfikowałem gotowe repliki oraz zachowany Service.
questions.0.points.0: Readiness musi odzwierciedlać rzeczywistą zdolność serwowania.
questions.0.points.1: Musi istnieć zdolność udarowa.
questions.0.points.2: Stara i nowa wersja muszą być kompatybilne podczas nakładania się.
questions.0.prompt: Jakie założenia pozostają w przypadku maxUnavailable=0?
questions.1.points.0: Ogranicza działania kontrolera, a nie każde zdarzenie sieciowe.
questions.1.points.1: Mierz osobno ruch i zakończenie.
questions.1.points.2: Podaj rzeczywiste okno obserwacji i granice sondy.
questions.1.prompt: Czy bezpieczna polisa rollout gwarantuje zero utraconych żądań?
