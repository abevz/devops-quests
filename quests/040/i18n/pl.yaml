title: Kontrolowana konserwacja
brief: |-
  Przekazanie konserwacyjne jest niekompletne na zarządzanych hostach i w aplikacji.

  Pracuj na stacji roboczej w `~/quest`. Na etapie 1 użyj `inventory.ini`, `ansible.cfg`, `rollout.yml` i `maintenance-interface.json`. Na etapie 2 użyj `board.yaml` i `service.yaml`.

  **Requirements:**

  - Konserwacja ma limit bezpieczeństwa jednego hosta naraz.
  - Na `app1`, `app2` i `app3` plik `/srv/site/maintenance.txt` zawiera `north-40`. Usługa HTTP każdego hosta na porcie `8080` zwraca `north-40`.
  - Deployment `board` kończy rollout z `2` dostępnymi replikami.
  - Service `board` udostępnia aplikację na porcie `8080`.
  - Każdy działający Pod aplikacji otrzymuje `north-40` z `http://board:8080`. Sonda HTTP readiness kontenera worker sprawdza `/ready` na porcie `8080`, a każdy worker zwraca tam `ready`.
debrief: |-
  Rozmiar partii ogranicza konserwację floty. Sonda readiness steruje ruchem do Podów podczas rolloutu. Pliki, odpowiedzi i stan kontrolera dają różne obserwacje.
stages.0.brief: Zadeklarowane partie konserwacyjne muszą zawierać po jednym hoście.
stages.1.brief: Dostępność aplikacji i routing usługi muszą być zgodne.
hints.0.text: |-
  Rozróżnij plik konserwacji i odpowiedź uruchomionego procesu. Podczas rolloutu sonda readiness steruje dopuszczaniem Podów do ruchu.
hints.1.text: |-
  Na etapie 1 porównaj konfigurację konserwacji, interfejs usługi i faktyczne odpowiedzi. Na etapie 2 porównaj sondę w szablonie Poda z Service board.

  ```sh
  cat rollout.yml maintenance-interface.json
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    ssh -n -o BatchMode=yes -p 2222 "root@$host" 'cat /srv/site/maintenance.txt'
    curl -fsS --max-time 2 "http://$host:8080/"
  done
  ```

  ```sh
  kubectl get deployment board -o yaml
  kubectl describe service board
  ```
hints.2.text: |-
  Na etapie 1 plik i odpowiedź HTTP pokazują `north-40` na wszystkich trzech hostach. Na etapie 2 sprawdź dwie dostępne repliki, odpowiedź przez Service i bezpośrednią odpowiedź readiness każdego kontenera worker.

  ```sh
  ansible-playbook rollout.yml --check
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    ssh -n -o BatchMode=yes -p 2222 "root@$host" 'cat /srv/site/maintenance.txt'
    curl -fsS --max-time 2 "http://$host:8080/"
  done
  ```

  ```sh
  kubectl get deployment board
  kubectl rollout status deployment/board --timeout=3s
  for pod in $(kubectl get pods -l app=board -o json | jq -r '.items[] | select(.metadata.deletionTimestamp==null and .status.phase=="Running") | .metadata.name'); do
    kubectl exec "$pod" -c worker -- wget -qO- -T 3 http://board:8080
    printf '\n'
    kubectl exec "$pod" -c worker -- wget -qO- -T 3 http://127.0.0.1:8080/ready
    printf '\n'
  done
  ```
phrases.0: Ograniczyłem partie konserwacyjne do partii seryjnej.
phrases.1: Sprawdziłem umowę serwisową na każdym celu.
phrases.2: W trakcie rolloutu zweryfikowałem gotowe repliki oraz zachowany Service.
questions.0.points.0: Readiness musi odzwierciedlać rzeczywistą zdolność serwowania.
questions.0.points.1: Musi istnieć zdolność udarowa.
questions.0.points.2: Stara i nowa wersja muszą być kompatybilne podczas nakładania się.
questions.0.prompt: Jakie założenia pozostają w przypadku maxUnavailable=0?
questions.1.points.0: Ogranicza działania kontrolera, a nie każde zdarzenie sieciowe.
questions.1.points.1: Mierz osobno ruch i zakończenie.
questions.1.points.2: Podaj rzeczywiste okno obserwacji i granice sondy.
questions.1.prompt: Czy bezpieczna polisa rollout gwarantuje zero utraconych żądań?
stages.0.objectives.0.text: Konserwacja ma limit bezpieczeństwa jednego hosta naraz.
stages.0.objectives.1.text: |-
  Na `app1`, `app2` i `app3` plik `/srv/site/maintenance.txt` zawiera `north-40`. Usługa HTTP każdego hosta na porcie `8080` zwraca `north-40`.
stages.1.objectives.0.text: Deployment `board` kończy rollout z `2` dostępnymi replikami.
stages.1.objectives.1.text: Service `board` udostępnia aplikację na porcie `8080`.
stages.1.objectives.2.text: |-
  Każdy działający Pod aplikacji otrzymuje `north-40` z `http://board:8080`. Sonda HTTP readiness kontenera worker sprawdza `/ready` na porcie `8080`, a każdy worker zwraca tam `ready`.
diagnostics.serial: Play może już nie wybierać jednego hosta na partię albo nieczytelny YAML, PyYAML lub obserwacje inventory blokują kontrolę polityki partii. [Przyczyna i kontrola](guides#guide=ansible-11&section=maintenance-single-host-batches)
diagnostics.probe_0_0: Stacja robocza może nie wejść do katalogu roboczego lub nie uruchomić Pythona przed wynikiem obserwatora polityki serial. [Przyczyna i kontrola](guides#guide=ansible-11&section=maintenance-single-host-batches)
diagnostics.maintenance_1: Play mógł nie dostarczyć north-40 na app1 albo błędy SSH i odczytu blokują obserwację maintenance.txt. [Przyczyna i kontrola](guides#guide=ansible-11&section=maintenance-contract-files)
diagnostics.maintenance_2: Play mógł nie dostarczyć north-40 na app2 albo błędy SSH i odczytu blokują obserwację maintenance.txt. [Przyczyna i kontrola](guides#guide=ansible-11&section=maintenance-contract-files)
diagnostics.maintenance_3: Play mógł nie dostarczyć north-40 na app3 albo błędy SSH i odczytu blokują obserwację maintenance.txt. [Przyczyna i kontrola](guides#guide=ansible-11&section=maintenance-contract-files)
diagnostics.fleet_http: Sam zapis maintenance.txt może pozostawić wiadomość usługi nieopublikowaną lub nieprzeładowaną; błędy DNS, transportu lub HTTP też blokują odpowiedź fleet. [Przyczyna i kontrola](guides#guide=ansible-11&section=maintenance-loaded-message)
diagnostics.available: Skalowanie lub nieukończony rollout może pozostawić żądaną albo dostępną liczbę replik różną od dwóch. [Przyczyna i kontrola](guides#guide=kubernetes-4&section=maintenance-board-availability)
diagnostics.probe_1_0: Rollout może być nieukończony lub jego polecenie niedostępne; błędy katalogu roboczego albo startu Pythona też blokują późniejszą kontrolę dostępności i budżetu. [Przyczyna i kontrola](guides#guide=kubernetes-4&section=maintenance-board-availability)
diagnostics.strategy: Strategia rollout lub efektywny budżet surge/unavailable mógł się zmienić; nieczytelne lub błędne dane Deployment też dają ten marker. [Przyczyna i kontrola](guides#guide=kubernetes-4&section=maintenance-rolling-budget)
diagnostics.service: Selektor Service lub port docelowy może już nie pasować do szablonu board; błędy API, JSON lub rozwiązywania portu też blokują kontrolę. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=maintenance-board-service)
diagnostics.probe_1_1: Dostęp do katalogu roboczego lub start Pythona/modułu mógł zawieść przed diagnostyką Service. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=maintenance-board-service)
diagnostics.http: Brak działającego własnego Poda, stara treść lub uszkodzona ścieżka Service może blokować north-40; błędy API, exec i HTTP dają ten sam marker. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=maintenance-board-http)
diagnostics.probe_1_2: Dostęp do katalogu roboczego lub start Pythona/modułu mógł przerwać obserwator HTTP przed nazwanym warunkiem. [Przyczyna i kontrola](guides#guide=kubernetes-10&section=maintenance-board-http)
diagnostics.readiness_probe: Sonda worker może nadal wskazywać / lub złą akcję/port HTTP; nadpisanie host albo HTTPS też narusza kontrakt gotowości. [Przyczyna i kontrola](guides#guide=kubernetes-4&section=maintenance-readiness-contract)
diagnostics.readiness_endpoint: Działający worker może nie publikować ready pod /ready mimo poprawionego szablonu; błędy exec lub lokalnego HTTP też powodują niepowodzenie obserwacji. [Przyczyna i kontrola](guides#guide=kubernetes-4&section=maintenance-ready-response)
