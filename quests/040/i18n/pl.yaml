title: Kontrolowana konserwacja
brief: 'Wykonaj przekazanie dwóch systemów. Najpierw dostarczaj north-40 do /srv/site/maintenance.txt
  po jednym hoście floty na raz. Następnie zaktualizuj board.json, aby obsługiwał north-40 z dwiema replikami,
  readiness i RollingUpdate maxUnavailable=0/maxSurge=1. Zachowaj Service board i jego selector.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `inventory.ini`, `ansible.cfg`,
  `rollout.yml`, `board.json`, `service.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: Wszystkie docelowe umowy serwisowe zawierają north-40.'
debrief: Szeregowe aktualizacje celów i stopniowa wymiana bramkowana readiness zapewniły odrębne mechanizmy
  dostępności.
stages.0.brief: 'Wszystkie docelowe umowy serwisowe zawierają north-40; każda konserwacja play wykorzystuje
  serial: 1.'
stages.0.objectives.0.text: 'Wszystkie docelowe umowy serwisowe zawierają north-40; każda konserwacja
  play wykorzystuje serial: 1.'
stages.1.brief: 'Kryteria sukcesu: Dwie repliki available board służą north-40 w ramach zachowanej strategii
