title: Mantenimiento controlado
brief: |-
  Una entrega de mantenimiento está incompleta en los hosts gestionados y la aplicación.

  Trabaja en la estación de trabajo en `~/quest`. En la etapa 1 usa `inventory.ini`, `ansible.cfg`, `rollout.yml` y `maintenance-interface.json`. En la etapa 2 usa `board.yaml` y `service.yaml`.

  **Requirements:**

  - El mantenimiento tiene un límite de seguridad de un host a la vez.
  - En `app1`, `app2` y `app3`, `/srv/site/maintenance.txt` contiene `north-40`. El servicio HTTP de cada host devuelve `north-40` en el puerto `8080`.
  - El Deployment `board` completa su rollout con `2` réplicas disponibles.
  - El Service `board` expone la aplicación en el puerto `8080`.
  - Cada Pod activo de la aplicación recibe `north-40` de `http://board:8080`. La sonda HTTP de readiness del worker comprueba `/ready` en el puerto `8080`, y cada worker devuelve `ready` en esa ruta.
debrief: |-
  El límite de lote controla el mantenimiento de la flota. La sonda de readiness controla el tráfico de Pods durante el despliegue. Los archivos, respuestas y estado del controlador aportan observaciones distintas.
stages.0.brief: Los lotes de mantenimiento declarados deben contener un host.
stages.1.brief: La disponibilidad de la aplicación y el enrutamiento del servicio deben coincidir.
hints.0.text: |-
  Distingue el archivo de mantenimiento de la respuesta del proceso en ejecución. Durante un despliegue progresivo, la sonda de readiness controla qué Pods reciben tráfico.
hints.1.text: |-
  En la etapa 1, compara la definición de mantenimiento, la interfaz del servicio y las respuestas reales. En la etapa 2, compara la sonda de la plantilla del Pod con el Service board.

  ```sh
  cat rollout.yml maintenance-interface.json
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    ssh -n -o BatchMode=yes -p 2222 "root@$host" 'cat /srv/site/maintenance.txt'
    curl -fsS --max-time 2 "http://$host:8080/"
  done
  ```

  ```sh
  kubectl get deployment board -o yaml
  kubectl describe service board
  ```
hints.2.text: |-
  En la etapa 1, el archivo y la respuesta HTTP muestran `north-40` en los tres hosts. En la etapa 2, comprueba las dos réplicas disponibles, la respuesta por el Service y la respuesta directa de readiness de cada worker.

  ```sh
  ansible-playbook rollout.yml --check
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    ssh -n -o BatchMode=yes -p 2222 "root@$host" 'cat /srv/site/maintenance.txt'
    curl -fsS --max-time 2 "http://$host:8080/"
  done
  ```

  ```sh
  kubectl get deployment board
  kubectl rollout status deployment/board --timeout=3s
  pods=$(kubectl get deployments,replicasets,pods -o json | jq -r '
    def owned($kind; $uids): any(.metadata.ownerReferences[]?;
      .controller == true and .kind == $kind and (.uid as $uid | $uids | index($uid) != null));
    .items as $items | ($items[] | select(.kind == "Deployment" and .metadata.name == "board")) as $board
    | [$items[] | select(.kind == "ReplicaSet" and owned("Deployment"; [$board.metadata.uid])) | .metadata.uid] as $rs
    | $items[] | select(.kind == "Pod" and owned("ReplicaSet"; $rs)
      and .metadata.deletionTimestamp == null and .status.phase == "Running") | .metadata.name')
  test -n "$pods" && while IFS= read -r pod; do
    kubectl exec "$pod" -c worker -- wget -qO- -T 3 http://board:8080
    printf '\n'
    kubectl exec "$pod" -c worker -- wget -qO- -T 3 http://127.0.0.1:8080/ready
    printf '\n'
  done <<< "$pods"
  ```
phrases.0: Limité lotes de mantenimiento con uno serial.
phrases.1: Verifiqué el contrato de mantenimiento en cada objetivo.
phrases.2: Verifiqué las réplicas listas y el Service retenido durante la implementación.
questions.0.points.0: Readiness debe reflejar la capacidad real de servicio.
questions.0.points.1: Debe existir capacidad de respuesta.
questions.0.points.2: Las versiones antiguas y nuevas deben ser compatibles durante la superposición.
questions.0.prompt: ¿Qué suposiciones quedan con maxUnavailable=0?
questions.1.points.0: Restringe las acciones del controlador, no todos los eventos de la red.
questions.1.points.1: Mida el tráfico y la terminación por separado.
questions.1.points.2: Indique la ventana de observación real y los límites de la sonda.
questions.1.prompt: ¿Una política segura rollout demuestra que no se pierden solicitudes?
stages.0.objectives.0.text: El mantenimiento tiene un límite de seguridad de un host a la vez.
stages.0.objectives.1.text: |-
  En `app1`, `app2` y `app3`, `/srv/site/maintenance.txt` contiene `north-40`. El servicio HTTP de cada host devuelve `north-40` en el puerto `8080`.
stages.1.objectives.0.text: El Deployment `board` completa su rollout con `2` réplicas disponibles.
stages.1.objectives.1.text: El Service `board` expone la aplicación en el puerto `8080`.
stages.1.objectives.2.text: |-
  Cada Pod activo de la aplicación recibe `north-40` de `http://board:8080`. La sonda HTTP de readiness del worker comprueba `/ready` en el puerto `8080`, y cada worker devuelve `ready` en esa ruta.
diagnostics.serial: Un play puede no seleccionar un host por lote, o YAML ilegible, PyYAML u observaciones del inventario pueden impedir comprobar su política. [Causa y comprobación](guides#guide=ansible-11&section=maintenance-single-host-batches)
diagnostics.probe_0_0: La estación puede no entrar en el directorio de trabajo o arrancar Python antes de obtener el resultado de la política serial. [Causa y comprobación](guides#guide=ansible-11&section=maintenance-single-host-batches)
diagnostics.maintenance_1: El play puede no haber entregado north-40 a app1, o fallos SSH y de lectura impiden observar maintenance.txt. [Causa y comprobación](guides#guide=ansible-11&section=maintenance-contract-files)
diagnostics.maintenance_2: El play puede no haber entregado north-40 a app2, o fallos SSH y de lectura impiden observar maintenance.txt. [Causa y comprobación](guides#guide=ansible-11&section=maintenance-contract-files)
diagnostics.maintenance_3: El play puede no haber entregado north-40 a app3, o fallos SSH y de lectura impiden observar maintenance.txt. [Causa y comprobación](guides#guide=ansible-11&section=maintenance-contract-files)
diagnostics.fleet_http: Escribir solo maintenance.txt puede dejar el mensaje sin publicar o recargar; fallos DNS, de transporte o HTTP también bloquean la respuesta esperada. [Causa y comprobación](guides#guide=ansible-11&section=maintenance-loaded-message)
diagnostics.available: Escalar o un rollout incompleto puede dejar el número deseado o disponible de réplicas distinto de dos. [Causa y comprobación](guides#guide=kubernetes-4&section=maintenance-board-availability)
diagnostics.probe_1_0: El rollout puede estar incompleto o su comando no disponible; fallos del directorio o arranque de Python también impiden la observación posterior de disponibilidad y presupuesto. [Causa y comprobación](guides#guide=kubernetes-4&section=maintenance-board-availability)
diagnostics.strategy: La estrategia o presupuesto efectivo surge/unavailable puede haber cambiado; datos del Deployment ilegibles o inválidos también dan este marcador. [Causa y comprobación](guides#guide=kubernetes-4&section=maintenance-rolling-budget)
diagnostics.service: El selector o puerto destino del Service puede no coincidir con la plantilla board; fallos API, JSON o de resolución de puerto también impiden verificarlo. [Causa y comprobación](guides#guide=kubernetes-10&section=maintenance-board-service)
diagnostics.probe_1_1: El acceso al directorio o el arranque de Python/módulo puede haber fallado antes del diagnóstico del Service. [Causa y comprobación](guides#guide=kubernetes-10&section=maintenance-board-service)
diagnostics.http: No tener un Pod propio Running, servir datos antiguos o una ruta Service rota puede impedir north-40; fallos API, exec y HTTP dan el mismo marcador. [Causa y comprobación](guides#guide=kubernetes-10&section=maintenance-board-http)
diagnostics.probe_1_2: El acceso al directorio o arranque de Python/módulo puede detener el observador HTTP antes de informar una condición nombrada. [Causa y comprobación](guides#guide=kubernetes-10&section=maintenance-board-http)
diagnostics.readiness_probe: La sonda worker puede seguir apuntando a / o usar acción/puerto HTTP incorrectos; sobrescribir host o HTTPS también incumple el contrato. [Causa y comprobación](guides#guide=kubernetes-4&section=maintenance-readiness-contract)
diagnostics.readiness_endpoint: El worker en ejecución puede no publicar ready en /ready aunque la plantilla esté corregida; fallos exec o HTTP local también impiden observarlo. [Causa y comprobación](guides#guide=kubernetes-4&section=maintenance-ready-response)
