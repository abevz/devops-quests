title: Mantenimiento controlado
brief: 'Realice una transferencia de dos sistemas. Primero entregue north-40 a /srv/site/maintenance.txt
  un host de flota a la vez. Luego actualice board.json para servir north-40 con dos réplicas, readiness
  y RollingUpdate maxUnavailable=0/maxSurge=1. Conserve Service board y su selector.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `inventory.ini`, `ansible.cfg`,
  `rollout.yml`, `board.json`, `service.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos suministrados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: todos los contratos de mantenimiento objetivo contienen north-40.'
debrief: Las actualizaciones de objetivos en serie y el reemplazo continuo basado en la preparación proporcionaron
  distintos mecanismos de disponibilidad.
