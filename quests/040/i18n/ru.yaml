title: Управляемое обслуживание
brief: 'Выполните обслуживание двух систем. Сначала доставьте north-40 в /srv/site/maintenance.txt последовательно
  по одной цели. Затем измените board.json на north-40 с двумя репликами, readiness и RollingUpdate maxUnavailable=0/maxSurge=1.
  Сохраните Service board и его selector.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `inventory.ini`, `ansible.cfg`, `rollout.yml`,
  `board.json`, `service.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Контракты обслуживания всех целей содержат north-40.'
debrief: Последовательные обновления целей и rolling-замена с readiness обеспечили разные механизмы доступности.
