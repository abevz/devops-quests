stages.1.objectives.2.text: |-
  Каждый работающий Pod приложения получает `north-40` с `http://board:8080`. HTTP-проверка готовности контейнера worker обращается к `/ready` на порту `8080`, и каждый worker возвращает там `ready`.
diagnostics.serial: |-
  Обслуживание должно ограничивать размер пакета одним хостом. В партии playbook может оказаться несколько хостов. Сопоставьте шаблон хостов и размер партии. [Документация](https://docs.ansible.com/projects/ansible/latest/playbook_guide/playbooks_strategies.html#setting-the-batch-size-with-serial)
diagnostics.strategy: |-
  Rolling update должен сохранять эффективный surge один и нулевую недоступность. Стратегия Deployment и состояние rollout проверяются отдельно. Сопоставьте стратегию и доступные реплики. [Документация](https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy)
diagnostics.available: |-
  Deployment board должен иметь две доступные реплики. Стратегия Deployment и состояние rollout проверяются отдельно. Сопоставьте стратегию и доступные реплики. [Документация](https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#complete-deployment)
diagnostics.service: |-
  Service board должен выбирать приложение и направлять TCP 8080 на его порт. Selector или порты могут указывать на другой backend. Сопоставьте Service и шаблон Pod. [Документация](https://kubernetes.io/docs/concepts/services-networking/service/#defining-a-service)
diagnostics.http: |-
  Каждый работающий Pod приложения должен получать north-40 от board:8080. Pod может ещё отдавать предыдущий релиз. Проверьте прямой ответ и статус rollout. [Документация](https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#updating-a-deployment)
diagnostics.probe_0_0: |-
  Проверка не вернула диагностический результат. Проверьте нужный ресурс или файл отдельно. [Документация](https://docs.ansible.com/projects/ansible/latest/playbook_guide/playbooks_strategies.html#setting-the-batch-size-with-serial)
diagnostics.probe_1_0: |-
  Проверка не вернула диагностический результат. Проверьте нужный ресурс или файл отдельно. [Документация](https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#complete-deployment)
diagnostics.probe_1_1: |-
  Проверка не вернула диагностический результат. Проверьте нужный ресурс или файл отдельно. [Документация](https://kubernetes.io/docs/concepts/services-networking/service/#port-definitions)
diagnostics.probe_1_2: |-
  Проверка не вернула диагностический результат. Проверьте нужный ресурс или файл отдельно. [Документация](https://kubernetes.io/docs/concepts/workloads/pods/probes/#readiness-probe)
diagnostics.fleet_http: |-
  Процесс мог остаться на данных, загруженных при старте. Сопоставьте записанное сообщение и HTTP-ответ перед переходом к следующему хосту. [Документация](https://docs.ansible.com/projects/ansible/latest/playbook_guide/playbooks_handlers.html#notifying-handlers)
diagnostics.readiness_probe: |-
  Шаблон Pod может проверять другой путь или порт. Сопоставьте проверку готовности и отдельный endpoint. [Документация](https://kubernetes.io/docs/concepts/workloads/pods/probes/#readiness-probe)
diagnostics.readiness_endpoint: |-
  Процесс может ещё не обслуживать endpoint готовности. Запросите его внутри этого Pod. [Документация](https://kubernetes.io/docs/concepts/workloads/pods/probes/#readiness-probe)
