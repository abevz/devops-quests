title: Управляемое обслуживание
brief: "Передача на обслуживание не завершена на управляемых хостах и в приложении.\n\nРаботайте в `~/quest` на\
  \ рабочей станции. Входные файлы по этапам:\n- Этап 1: `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n- Этап\
  \ 2: `board.yaml`, `service.yaml`.\n\n**Требования:**\n\n- Этап 1:\n  - Для обслуживания действует ограничение:\
  \ не более одного хоста одновременно.\n  - На каждом управляемом хосте (`app1`, `app2`, `app3`) `/srv/site/maintenance.txt`\
  \ содержит `north-40`.\n- Этап 2:\n  - Deployment `board` завершает развёртывание с `2` доступными репликами.\n\
  \  - Service `board` предоставляет приложение на порту `8080`.\n  - Каждый работающий Pod приложения получает\
  \ `north-40` от `http://board:8080`.\n\nПроверка изучает объявленную политику партий, текущие ресурсы и ответы;\
  \ она не доказывает порядок выполнения, сохранение идентичности Service или настройку readiness-probe. Ограничение\
  \ одного хоста проверяется по объявлению; порядок выполнения и непрерывная доступность не отслеживаются."
debrief: Последовательные обновления целей и rolling-замена с readiness обеспечили разные механизмы доступности.
stages.0.brief: Объявленные партии обслуживания должны включать по одному хосту.
stages.1.brief: Доступность приложения и маршрутизация сервиса должны быть согласованы.
hints.0.text: Разделите контракт парка и rollout приложения.
hints.1.text: 'serial и strategy Deployment управляют разными системами. Используйте `serial: 1` для каждого play
  обслуживания.


  Изучите описание обслуживания, события приложения и описание Service.


  ```sh

  cat rollout.yml

  kubectl describe deployment board

  kubectl describe service board

  ```


  Этап 2: Изучите определения этих ресурсов для данного этапа.


  ```sh

  kubectl get deployment board -o yaml

  kubectl get service board -o yaml

  ```'
hints.2.text: |-
  Сохраните readiness и selectors при смене ответа.

  Проверьте соответствующий этап после исправления.

  Этап 1: Предварительный прогон обрабатывает по одному хосту в партии, а каждый из `app1`, `app2`, `app3` показывает `north-40`.

  ```sh
  ansible-playbook rollout.yml --check
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    printf "%s: " "$host"
    ssh -n -o BatchMode=yes -p 2222 "root@$host" 'cat /srv/site/maintenance.txt'
  done
  ```

  Этап 2: Развёртывание завершается с `2` доступными репликами; запросы потребителей выводят `north-40`.

  ```sh
  kubectl get deployment board
  kubectl rollout status deployment/board --timeout=3s
  for pod in $(kubectl get pods -l app=board -o json | jq -r '.items[]|select(.metadata.deletionTimestamp==null and .status.phase=="Running")|.metadata.name'); do
    kubectl exec "$pod" -c worker -- wget -qO- http://board:8080
    printf "\n"
  done
  ```

  Ожидаемые наблюдения для этапа целиком:
  - Этап 2: Deployment и Service соответствуют требованиям; запросы потребителей выводят `north-40`.

