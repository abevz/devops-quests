title: Управляемое обслуживание
brief: |-
  Передача на обслуживание не завершена на управляемых хостах и в приложении.

  Работайте на рабочей станции в `~/quest`. На первом этапе используйте `inventory.ini`, `ansible.cfg`, `rollout.yml` и `maintenance-interface.json`. На втором этапе используйте `board.yaml` и `service.yaml`.

  **Requirements:**

  - Для обслуживания действует ограничение: не более одного хоста одновременно.
  - На `app1`, `app2` и `app3` файл `/srv/site/maintenance.txt` содержит `north-40`. HTTP-сервис каждого хоста на порту `8080` возвращает `north-40`.
  - Deployment `board` завершает развёртывание с `2` доступными репликами.
  - Service `board` предоставляет приложение на порту `8080`.
  - Каждый работающий Pod приложения получает `north-40` с `http://board:8080`. HTTP-проверка готовности контейнера worker обращается к `/ready` на порту `8080`, и каждый worker возвращает там `ready`.
debrief: |-
  Размер партии ограничивает обслуживание хостов. Проверка готовности управляет допуском Pod к трафику при rollout. Файлы, ответы процессов и статус контроллера показывают разные результаты.
stages.0.brief: Объявленные партии обслуживания должны включать по одному хосту.
stages.1.brief: Доступность приложения и маршрутизация сервиса должны быть согласованы.
hints.0.text: |-
  Проверяйте файл обслуживания и ответ работающего процесса отдельно. Во время rollout проверка готовности определяет, какие Pod принимают трафик.
hints.1.text: |-
  На первом этапе сопоставьте playbook, интерфейс сервиса и реальные ответы. На втором сравните проверку готовности в шаблоне Pod с Service board.

  ```sh
  cat rollout.yml maintenance-interface.json
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    ssh -n -o BatchMode=yes -p 2222 "root@$host" 'cat /srv/site/maintenance.txt'
    curl -fsS --max-time 2 "http://$host:8080/"
  done
  ```

  ```sh
  kubectl get deployment board -o yaml
  kubectl describe service board
  ```
hints.2.text: |-
  На первом этапе файл обслуживания и HTTP-ответ показывают `north-40` на всех трёх хостах. На втором проверьте две доступные реплики, ответ через Service и прямой ответ готовности каждого контейнера worker.

  ```sh
  ansible-playbook rollout.yml --check
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    ssh -n -o BatchMode=yes -p 2222 "root@$host" 'cat /srv/site/maintenance.txt'
    curl -fsS --max-time 2 "http://$host:8080/"
  done
  ```

  ```sh
  kubectl get deployment board
  kubectl rollout status deployment/board --timeout=3s
  pods=$(kubectl get deployments,replicasets,pods -o json | jq -r '
    def owned($kind; $uids): any(.metadata.ownerReferences[]?;
      .controller == true and .kind == $kind and (.uid as $uid | $uids | index($uid) != null));
    .items as $items | ($items[] | select(.kind == "Deployment" and .metadata.name == "board")) as $board
    | [$items[] | select(.kind == "ReplicaSet" and owned("Deployment"; [$board.metadata.uid])) | .metadata.uid] as $rs
    | $items[] | select(.kind == "Pod" and owned("ReplicaSet"; $rs)
      and .metadata.deletionTimestamp == null and .status.phase == "Running") | .metadata.name')
  test -n "$pods" && while IFS= read -r pod; do
    kubectl exec "$pod" -c worker -- wget -qO- -T 3 http://board:8080
    printf '\n'
    kubectl exec "$pod" -c worker -- wget -qO- -T 3 http://127.0.0.1:8080/ready
    printf '\n'
  done <<< "$pods"
  ```
phrases.0: 'Я ограничил пачки обслуживания с помощью serial: 1.'
phrases.1: Я проверил контракт обслуживания на каждом целевом узле.
phrases.2: Я проверил готовые реплики и сохранённый Service при выкатке.
questions.0.points.0: Readiness должна отражать способность обслуживать запросы.
questions.0.points.1: Нужны ресурсы под surge.
questions.0.points.2: Старая и новая версии должны быть совместимы при одновременной работе.
questions.0.prompt: Какие предпосылки остаются при maxUnavailable=0?
questions.1.points.0: Она ограничивает действия контроллера, а не каждое сетевое событие.
questions.1.points.1: Отдельно измеряйте трафик и завершение процессов.
questions.1.points.2: Укажите окно наблюдения и границы проверок.
questions.1.prompt: Доказывает ли безопасная политика rollout отсутствие потерянных запросов?
stages.0.objectives.0.text: 'Для обслуживания действует ограничение: не более одного хоста одновременно.'
stages.0.objectives.1.text: |-
  На `app1`, `app2` и `app3` файл `/srv/site/maintenance.txt` содержит `north-40`. HTTP-сервис каждого хоста на порту `8080` возвращает `north-40`.
stages.1.objectives.0.text: Deployment `board` завершает развёртывание с `2` доступными репликами.
stages.1.objectives.1.text: Service `board` предоставляет приложение на порту `8080`.
stages.1.objectives.2.text: |-
  Каждый работающий Pod приложения получает `north-40` с `http://board:8080`. HTTP-проверка готовности контейнера worker обращается к `/ready` на порту `8080`, и каждый worker возвращает там `ready`.
diagnostics.serial: Play мог перестать выбирать один хост на партию, либо нечитаемый YAML, PyYAML или наблюдения inventory мешают проверить политику партий. [Причина и проверка](guides#guide=ansible-11&section=maintenance-single-host-batches)
diagnostics.probe_0_0: Рабочая станция могла не перейти в рабочий каталог или не запустить Python до результата наблюдателя политики serial. [Причина и проверка](guides#guide=ansible-11&section=maintenance-single-host-batches)
diagnostics.maintenance_1: Play мог не доставить north-40 на app1, либо ошибки SSH и чтения файла мешают наблюдать maintenance.txt. [Причина и проверка](guides#guide=ansible-11&section=maintenance-contract-files)
diagnostics.maintenance_2: Play мог не доставить north-40 на app2, либо ошибки SSH и чтения файла мешают наблюдать maintenance.txt. [Причина и проверка](guides#guide=ansible-11&section=maintenance-contract-files)
diagnostics.maintenance_3: Play мог не доставить north-40 на app3, либо ошибки SSH и чтения файла мешают наблюдать maintenance.txt. [Причина и проверка](guides#guide=ansible-11&section=maintenance-contract-files)
diagnostics.fleet_http: Запись только maintenance.txt может оставить сообщение сервиса неопубликованным или неперечитанным; ошибки DNS, транспорта или HTTP также мешают ответу fleet. [Причина и проверка](guides#guide=ansible-11&section=maintenance-loaded-message)
diagnostics.available: Масштабирование или незавершённый rollout могут оставить желаемое или доступное число реплик отличным от двух. [Причина и проверка](guides#guide=kubernetes-4&section=maintenance-board-availability)
diagnostics.probe_1_0: Rollout мог не завершиться или его команда недоступна; ошибки рабочего каталога или запуска Python также мешают последующей проверке доступности и бюджета. [Причина и проверка](guides#guide=kubernetes-4&section=maintenance-board-availability)
diagnostics.strategy: Стратегия rollout или эффективный бюджет surge/unavailable могли измениться; нечитаемые или неверные данные Deployment также дают этот маркер. [Причина и проверка](guides#guide=kubernetes-4&section=maintenance-rolling-budget)
diagnostics.service: Селектор Service или целевой порт могут больше не совпадать с шаблоном board; ошибки API, JSON или разрешения порта также мешают проверке. [Причина и проверка](guides#guide=kubernetes-10&section=maintenance-board-service)
diagnostics.probe_1_1: Доступ к рабочему каталогу или запуск Python/модуля мог завершиться ошибкой до диагностики Service. [Причина и проверка](guides#guide=kubernetes-10&section=maintenance-board-service)
diagnostics.http: Отсутствие работающих Pod этого контроллера, старый ответ или неверный путь Service могут мешать north-40; ошибки API, exec и HTTP дают тот же маркер. [Причина и проверка](guides#guide=kubernetes-10&section=maintenance-board-http)
diagnostics.probe_1_2: Доступ к рабочему каталогу или запуск Python/модуля мог прервать наблюдатель HTTP до именованной диагностики. [Причина и проверка](guides#guide=kubernetes-10&section=maintenance-board-http)
diagnostics.readiness_probe: Проверка worker может всё ещё обращаться к / или использовать неверное действие/порт HTTP; переопределение host или HTTPS также нарушает контракт готовности. [Причина и проверка](guides#guide=kubernetes-4&section=maintenance-readiness-contract)
diagnostics.readiness_endpoint: Работающий worker может не отдавать ready на /ready даже при исправленном шаблоне; ошибки exec или локального HTTP также дают отказ наблюдения. [Причина и проверка](guides#guide=kubernetes-4&section=maintenance-ready-response)
