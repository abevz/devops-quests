title: Kontrollierte Wartung
brief: 'Führen Sie eine Zwei-System-Übergabe durch. Liefern Sie zunächst north-40 an /srv/site/maintenance.txt,
  jeweils einen Flottenhost. Aktualisieren Sie dann board.json, um north-40 mit zwei Replikaten zu bedienen,
  readiness und RollingUpdate maxUnavailable=0/maxSurge=1.. Behalten Sie Service board und seine bei selector.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `inventory.ini`, `ansible.cfg`, `rollout.yml`,
  `board.json`, `service.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: Alle Zielwartungsverträge enthalten north-40.'
debrief: Serielle Zielaktualisierungen und ein betriebsbereiter rollierender Austausch stellten unterschiedliche
  Verfügbarkeitsmechanismen bereit.
stages.0.brief: 'Alle Zielwartungsverträge enthalten north-40; Bei jeder Wartung verwendet play serial:
  1.'
stages.0.objectives.0.text: 'Alle Zielwartungsverträge enthalten north-40; Bei jeder Wartung verwendet
  play serial: 1.'
stages.1.brief: 'Erfolgskriterien: Zwei available board-Replikate bedienen north-40 über die beibehaltene
