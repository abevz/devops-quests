title: Kontrollierte Wartung
brief: "Eine Wartungsübergabe ist auf den verwalteten Hosts und in der Anwendung noch unvollständig.\n\nArbeiten\
  \ Sie in `~/quest` auf der Workstation. Eingaben je Phase:\n- Phase 1: `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n\
  - Phase 2: `board.yaml`, `service.yaml`.\n\n**Anforderungen:**\n\n- Phase 1:\n  - Für die Wartung gilt eine Sicherheitsgrenze\
  \ von jeweils einem Host.\n  - Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/maintenance.txt`\
  \ den Wert `north-40`.\n- Phase 2:\n  - Deployment `board` schließt seinen Rollout mit `2` verfügbaren Replikaten\
  \ ab.\n  - Service `board` stellt die Anwendung auf Port `8080` bereit.\n  - Jeder laufende Anwendungs-Pod erhält\
  \ `north-40` von `http://board:8080`.\n\nDie Prüfung untersucht deklarierte Batch-Policy, aktuelle Ressourcen\
  \ und Antworten; Ausführungsreihenfolge, Beibehaltung der Service-Identität und Readiness-Probe-Konfiguration\
  \ werden nicht bewiesen. Die Ein-Host-Sicherheitsgrenze wird anhand ihrer Deklaration geprüft; Ausführungsreihenfolge\
  \ und ununterbrochene Verfügbarkeit werden nicht verfolgt."
debrief: Serielle Zielaktualisierungen und ein betriebsbereiter rollierender Austausch stellten unterschiedliche
  Verfügbarkeitsmechanismen bereit.
stages.0.brief: Deklarierte Wartungsbatches müssen jeweils einen Host enthalten.
stages.1.brief: Anwendungsverfügbarkeit und Service-Routing müssen zusammenpassen.
hints.0.text: Trennen Sie den Flottenvertrag von der Anwendung rollout.
hints.1.text: 'serial und Deployment strategy steuern unterschiedliche Systeme. Verwenden Sie `serial: 1` für jeden
  Wartungs-Play.


  Prüfen Sie Wartungsdefinition, Anwendungsereignisse und Service-Beschreibung.


  ```sh

  cat rollout.yml

  kubectl describe deployment board

  kubectl describe service board

  ```


  Phase 2: Prüfen Sie diese Ressourcendefinitionen für diese Phase.


  ```sh

  kubectl get deployment board -o yaml

  kubectl get service board -o yaml

  ```'
hints.2.text: |-
  Behalten Sie readiness und selectors beim Ändern der Reaktion bei.

  Prüfen Sie die jeweilige Phase nach der Reparatur.

  Phase 1: Die Vorschau bearbeitet einen Host je Batch und jeder von `app1`, `app2`, `app3` zeigt `north-40`.

  ```sh
  ansible-playbook rollout.yml --check
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    printf "%s: " "$host"
    ssh -n -o BatchMode=yes -p 2222 "root@$host" 'cat /srv/site/maintenance.txt'
  done
  ```

  Phase 2: Der Rollout wird mit `2` verfügbaren Replikaten abgeschlossen; Verbraucherabfragen geben `north-40` aus.

  ```sh
  kubectl get deployment board
  kubectl rollout status deployment/board --timeout=3s
  for pod in $(kubectl get pods -l app=board -o json | jq -r '.items[]|select(.metadata.deletionTimestamp==null and .status.phase=="Running")|.metadata.name'); do
    kubectl exec "$pod" -c worker -- wget -qO- http://board:8080
    printf "\n"
  done
  ```

  Erwartete Beobachtungen für die gesamte Phase:
  - Phase 2: Deployment und Service erfüllen die Anforderungen; Verbraucherabfragen geben `north-40` aus.

phrases.0: Ich habe die Wartungschargen mit serial eins begrenzt.
phrases.1: Ich habe den Wartungsvertrag für jedes Ziel überprüft.
phrases.2: Ich habe während des Rollouts fertige Replikate und das beibehaltene Service überprüft.
questions.0.points.0: Readiness muss die tatsächliche Servierfähigkeit widerspiegeln.
questions.0.points.1: Überspannungskapazität muss vorhanden sein.
questions.0.points.2: Bei Überschneidungen müssen alte und neue Versionen kompatibel sein.
questions.0.prompt: Welche Annahmen bleiben bei maxUnavailable=0 bestehen?
questions.1.points.0: Es schränkt die Aktionen des Controllers ein, nicht jedes Netzwerkereignis.
questions.1.points.1: Messen Sie Verkehr und Terminierung separat.
questions.1.points.2: Geben Sie das tatsächliche Beobachtungsfenster und die Sondengrenzen an.
questions.1.prompt: Beweist eine sichere rollout-Richtlinie, dass keine Anfragen verloren gehen?
