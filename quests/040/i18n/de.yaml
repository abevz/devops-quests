diagnostics.serial: Ein Play wählt möglicherweise nicht mehr einen Host pro Batch; auch unlesbares YAML, PyYAML oder Inventory-Beobachtungen verhindern die Batch-Prüfung. [Ursache und Prüfung](guides#guide=ansible-11&section=maintenance-single-host-batches)
diagnostics.probe_0_0: Die Workstation kann möglicherweise nicht ins Arbeitsverzeichnis wechseln oder Python starten, bevor die Serial-Richtlinie beobachtet wird. [Ursache und Prüfung](guides#guide=ansible-11&section=maintenance-single-host-batches)
diagnostics.maintenance_1: Das Play hat north-40 möglicherweise nicht auf app1 geliefert; auch SSH- und Dateilesefehler verhindern die Beobachtung von maintenance.txt. [Ursache und Prüfung](guides#guide=ansible-11&section=maintenance-contract-files)
diagnostics.maintenance_2: Das Play hat north-40 möglicherweise nicht auf app2 geliefert; auch SSH- und Dateilesefehler verhindern die Beobachtung von maintenance.txt. [Ursache und Prüfung](guides#guide=ansible-11&section=maintenance-contract-files)
diagnostics.maintenance_3: Das Play hat north-40 möglicherweise nicht auf app3 geliefert; auch SSH- und Dateilesefehler verhindern die Beobachtung von maintenance.txt. [Ursache und Prüfung](guides#guide=ansible-11&section=maintenance-contract-files)
diagnostics.fleet_http: Alleiniges Schreiben von maintenance.txt kann die Dienstnachricht unveröffentlicht oder ungeladen lassen; auch DNS-, Transport- oder HTTP-Fehler verhindern die erwartete Fleet-Antwort. [Ursache und Prüfung](guides#guide=ansible-11&section=maintenance-loaded-message)
diagnostics.available: Skalieren oder ein unvollständiger Rollout kann eine gewünschte oder verfügbare Replikazahl ungleich zwei hinterlassen. [Ursache und Prüfung](guides#guide=kubernetes-4&section=maintenance-board-availability)
diagnostics.probe_1_0: Der Rollout kann unvollständig oder sein Befehl nicht verfügbar sein; auch Arbeitsverzeichnis- oder Python-Startfehler verhindern die spätere Verfügbarkeits-/Budgetprüfung. [Ursache und Prüfung](guides#guide=kubernetes-4&section=maintenance-board-availability)
diagnostics.strategy: Rollout-Strategie oder effektives Surge-/Unavailable-Budget kann geändert sein; auch unlesbare oder fehlerhafte Deployment-Daten liefern diesen Marker. [Ursache und Prüfung](guides#guide=kubernetes-4&section=maintenance-rolling-budget)
diagnostics.service: Service-Selektor oder Zielport passt möglicherweise nicht mehr zur board-Vorlage; auch API-, JSON- oder Portauflösungsfehler verhindern die Prüfung. [Ursache und Prüfung](guides#guide=kubernetes-10&section=maintenance-board-service)
diagnostics.probe_1_1: Arbeitsverzeichniszugriff oder Python-/Modulstart kann vor einer Service-Diagnose gescheitert sein. [Ursache und Prüfung](guides#guide=kubernetes-10&section=maintenance-board-service)
diagnostics.http: Fehlende eigene laufende Pods, veralteter Inhalt oder ein fehlerhafter Service-Pfad kann north-40 verhindern; auch API-, exec- und HTTP-Beobachtungsfehler liefern denselben Marker. [Ursache und Prüfung](guides#guide=kubernetes-10&section=maintenance-board-http)
diagnostics.probe_1_2: Arbeitsverzeichniszugriff oder Python-/Modulstart kann den HTTP-Beobachter vor einer benannten Bedingung stoppen. [Ursache und Prüfung](guides#guide=kubernetes-10&section=maintenance-board-http)
diagnostics.readiness_probe: Die worker-Probe kann noch / oder eine falsche HTTP-Aktion beziehungsweise einen falschen Port verwenden; Host- oder HTTPS-Overrides verletzen ebenfalls den Bereitschaftsvertrag. [Ursache und Prüfung](guides#guide=kubernetes-4&section=maintenance-readiness-contract)
diagnostics.readiness_endpoint: Der laufende worker liefert möglicherweise trotz korrigierter Vorlage kein ready unter /ready; auch exec- oder lokale HTTP-Fehler lassen die Beobachtung scheitern. [Ursache und Prüfung](guides#guide=kubernetes-4&section=maintenance-ready-response)
