title: Kontrollierte Wartung
brief: "Eine Wartungsübergabe ist auf den verwalteten Hosts und in der Anwendung noch unvollständig.\n\nArbeiten\
  \ Sie in `~/quest` auf der Workstation. Eingaben je Phase:\n- Phase 1: `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n\
  - Phase 2: `board.yaml`, `service.yaml`.\n\n**Anforderungen:**\n\n- Phase 1:\n  - Jeder Play in `rollout.yml`\
  \ ist dafür konfiguriert, jeweils einen verwalteten Host zu bearbeiten.\n  - Auf jedem verwalteten Host (`app1`,\
  \ `app2`, `app3`) enthält `/srv/site/maintenance.txt` den Wert `north-40`.\n  - Das geprüfte Playbook ist `~/quest/rollout.yml`\
  \ auf der Workstation.\n- Phase 2:\n  - Deployment `board` schließt seinen Rollout mit `2` Replikaten und `2`\
  \ verfügbaren Replikaten ab; sein RollingUpdate erlaubt `0` nicht verfügbare und `1` zusätzliche Replik.\n  -\
  \ Service `board` wählt `app=board` und leitet Port `8080` an Zielport `8080` weiter.\n  - Jeder nicht terminierende\
  \ Pod in Phase `Running` mit Label `app=board` erhält `north-40` von `http://board:8080`.\n\n**Vor Check & finish\
  \ selbst prüfen:**\n\n- Phase 1: Die Vorschau bearbeitet einen Host je Batch und jeder von `app1`, `app2`, `app3`\
  \ zeigt `north-40`.\n\n  ```sh\n  ansible-playbook rollout.yml --check\n  for n in 1 2 3; do\n    host=\"app${n}-${DQ_NAMESPACE#dq-}\"\
  \n    printf \"%s: \" \"$host\"\n    ssh -n -o BatchMode=yes -p 2222 \"root@$host\" 'cat /srv/site/maintenance.txt'\n\
  \  done\n  ```\n\n- Phase 2: Deployment und Service erfüllen die Anforderungen; Verbraucherabfragen geben `north-40`\
  \ aus.\n\n  ```sh\n  kubectl get deployment board -o yaml\n  kubectl get service board -o yaml\n  for pod in $(kubectl\
  \ get pods -l app=board -o json | jq -r '.items[]|select(.metadata.deletionTimestamp==null and .status.phase==\"\
  Running\")|.metadata.name'); do\n    kubectl exec \"$pod\" -- wget -qO- http://board:8080\n    printf \"\\n\"\n\
  \  done\n  ```\n\nDie Prüfung untersucht deklarierte Batch-Policy, aktuelle Ressourcen und Antworten; Ausführungsreihenfolge,\
  \ Beibehaltung der Service-Identität und Readiness-Probe-Konfiguration werden nicht bewiesen."
debrief: Serielle Zielaktualisierungen und ein betriebsbereiter rollierender Austausch stellten unterschiedliche
  Verfügbarkeitsmechanismen bereit.
stages.0.brief: Deklarierte Wartungsbatches müssen jeweils einen Host enthalten.
stages.1.brief: Anwendungsverfügbarkeit und Service-Routing müssen zusammenpassen.
hints.0.text: Trennen Sie den Flottenvertrag von der Anwendung rollout.
hints.1.text: 'serial und Deployment strategy steuern unterschiedliche Systeme. Verwenden Sie `serial: 1` für jeden
  Wartungs-Play.'
hints.2.text: Behalten Sie readiness und selectors beim Ändern der Reaktion bei.
phrases.0: Ich habe die Wartungschargen mit serial eins begrenzt.
phrases.1: Ich habe den Wartungsvertrag für jedes Ziel überprüft.
phrases.2: Ich habe während des Rollouts fertige Replikate und das beibehaltene Service überprüft.
questions.0.points.0: Readiness muss die tatsächliche Servierfähigkeit widerspiegeln.
questions.0.points.1: Überspannungskapazität muss vorhanden sein.
questions.0.points.2: Bei Überschneidungen müssen alte und neue Versionen kompatibel sein.
questions.0.prompt: Welche Annahmen bleiben bei maxUnavailable=0 bestehen?
questions.1.points.0: Es schränkt die Aktionen des Controllers ein, nicht jedes Netzwerkereignis.
questions.1.points.1: Messen Sie Verkehr und Terminierung separat.
questions.1.points.2: Geben Sie das tatsächliche Beobachtungsfenster und die Sondengrenzen an.
questions.1.prompt: Beweist eine sichere rollout-Richtlinie, dass keine Anfragen verloren gehen?
diagnostics.maintenance_1: Auf app1 muss /srv/site/maintenance.txt north-40 enthalten.
diagnostics.maintenance_2: Auf app2 muss /srv/site/maintenance.txt north-40 enthalten.
