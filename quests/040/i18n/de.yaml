diagnostics.serial: |-
  Die Wartung muss die Batchgröße auf einen Host begrenzen. Das Play kann mehrere Hosts pro Batch umfassen. Vergleichen Sie Hostmuster und Batchgrenze. [Dokumentation](https://docs.ansible.com/projects/ansible/latest/playbook_guide/playbooks_strategies.html#setting-the-batch-size-with-serial)
diagnostics.strategy: |-
  Das Rolling Update muss effektiv surge eins und keine Nichtverfügbarkeit beibehalten. Deployment-Strategie und laufender Rollout sind getrennt. Vergleichen Sie Strategie und verfügbare Repliken. [Dokumentation](https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy)
diagnostics.available: |-
  Deployment board muss zwei verfügbare Replikas haben. Deployment-Strategie und laufender Rollout sind getrennt. Vergleichen Sie Strategie und verfügbare Repliken. [Dokumentation](https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#complete-deployment)
diagnostics.service: |-
  Service board muss die Anwendung auswählen und TCP 8080 an ihren Port weiterleiten. Selector oder Portzuordnung kann auf ein anderes Backend zeigen. Vergleichen Sie Service und Pod-Vorlage. [Dokumentation](https://kubernetes.io/docs/concepts/services-networking/service/#defining-a-service)
diagnostics.http: |-
  Jeder laufende Anwendungs-Pod muss north-40 von board:8080 erhalten. Ein Pod kann noch das vorherige Release ausliefern. Prüfen Sie direkte Antworten und Rollout-Status. [Dokumentation](https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#updating-a-deployment)
diagnostics.probe_0_0: |-
  Die Prüfung lieferte keine verwertbare Diagnose. Prüfen Sie Ressource oder Datei separat. [Dokumentation](https://docs.ansible.com/projects/ansible/latest/playbook_guide/playbooks_strategies.html#setting-the-batch-size-with-serial)
diagnostics.probe_1_0: |-
  Die Prüfung lieferte keine verwertbare Diagnose. Prüfen Sie Ressource oder Datei separat. [Dokumentation](https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#complete-deployment)
diagnostics.probe_1_1: |-
  Die Prüfung lieferte keine verwertbare Diagnose. Prüfen Sie Ressource oder Datei separat. [Dokumentation](https://kubernetes.io/docs/concepts/services-networking/service/#port-definitions)
diagnostics.probe_1_2: |-
  Die Prüfung lieferte keine verwertbare Diagnose. Prüfen Sie Ressource oder Datei separat. [Dokumentation](https://kubernetes.io/docs/concepts/workloads/pods/probes/#readiness-probe)
diagnostics.fleet_http: |-
  Der Prozess kann noch beim Start geladene Daten verwenden. Vergleichen Sie gespeicherte Meldung und HTTP-Antwort vor dem nächsten Host. [Dokumentation](https://docs.ansible.com/projects/ansible/latest/playbook_guide/playbooks_handlers.html#notifying-handlers)
diagnostics.readiness_probe: |-
  Die Pod-Vorlage kann einen anderen Pfad oder Listener prüfen. Vergleichen Sie Readiness-Probe und eigenen Endpunkt. [Dokumentation](https://kubernetes.io/docs/concepts/workloads/pods/probes/#readiness-probe)
diagnostics.readiness_endpoint: |-
  Der Prozess stellt den Readiness-Endpunkt möglicherweise noch nicht bereit. Rufen Sie ihn im betroffenen Pod ab. [Dokumentation](https://kubernetes.io/docs/concepts/workloads/pods/probes/#readiness-probe)
