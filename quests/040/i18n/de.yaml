title: Kontrollierte Wartung
brief: |-
  Eine Wartungsübergabe ist auf den verwalteten Hosts und in der Anwendung noch unvollständig.

  Arbeiten Sie auf der Workstation in `~/quest`. Phase 1 verwendet `inventory.ini`, `ansible.cfg`, `rollout.yml` und `maintenance-interface.json`. Phase 2 verwendet `board.yaml` und `service.yaml`.

  **Requirements:**

  - Für die Wartung gilt eine Sicherheitsgrenze von jeweils einem Host.
  - Auf `app1`, `app2` und `app3` enthält `/srv/site/maintenance.txt` den Wert `north-40`. Der HTTP-Dienst jedes Hosts liefert auf Port `8080` ebenfalls `north-40`.
  - Deployment `board` schließt seinen Rollout mit `2` verfügbaren Replikaten ab.
  - Service `board` stellt die Anwendung auf Port `8080` bereit.
  - Jeder laufende Anwendungs-Pod erhält `north-40` von `http://board:8080`. Die HTTP-Readiness-Probe des Containers worker prüft `/ready` auf Port `8080`. Dort liefert jeder worker `ready`.
debrief: |-
  Die Batchgröße begrenzt die Wartung der Fleet. Die Readiness-Probe steuert den Pod-Verkehr beim Rollout. Dateien, Prozessantworten und Controller-Status liefern unterschiedliche Beobachtungen.
stages.0.brief: Deklarierte Wartungsbatches müssen jeweils einen Host enthalten.
stages.1.brief: Anwendungsverfügbarkeit und Service-Routing müssen zusammenpassen.
hints.0.text: |-
  Betrachten Sie Wartungsdatei und Antwort des laufenden Prozesses getrennt. Beim Rollout lässt die Readiness-Prüfung Pods für den Verkehr zu.
hints.1.text: |-
  Vergleichen Sie in Phase 1 die Wartungsdefinition, die Dienstschnittstelle und die tatsächlichen Antworten. Vergleichen Sie in Phase 2 die Probe in der Pod-Vorlage mit dem Service board.

  ```sh
  cat rollout.yml maintenance-interface.json
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    ssh -n -o BatchMode=yes -p 2222 "root@$host" 'cat /srv/site/maintenance.txt'
    curl -fsS --max-time 2 "http://$host:8080/"
  done
  ```

  ```sh
  kubectl get deployment board -o yaml
  kubectl describe service board
  ```
hints.2.text: |-
  In Phase 1 zeigen Wartungsdatei und HTTP-Antwort auf allen drei Hosts `north-40`. Prüfen Sie in Phase 2 zwei verfügbare Repliken, die Release-Antwort durch den Service und die direkte Readiness-Antwort jedes worker.

  ```sh
  ansible-playbook rollout.yml --check
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    ssh -n -o BatchMode=yes -p 2222 "root@$host" 'cat /srv/site/maintenance.txt'
    curl -fsS --max-time 2 "http://$host:8080/"
  done
  ```

  ```sh
  kubectl get deployment board
  kubectl rollout status deployment/board --timeout=3s
  for pod in $(kubectl get pods -l app=board -o json | jq -r '.items[] | select(.metadata.deletionTimestamp==null and .status.phase=="Running") | .metadata.name'); do
    kubectl exec "$pod" -c worker -- wget -qO- -T 3 http://board:8080
    printf '\n'
    kubectl exec "$pod" -c worker -- wget -qO- -T 3 http://127.0.0.1:8080/ready
    printf '\n'
  done
  ```
phrases.0: Ich habe die Wartungschargen mit serial eins begrenzt.
phrases.1: Ich habe den Wartungsvertrag für jedes Ziel überprüft.
phrases.2: Ich habe während des Rollouts fertige Replikate und das beibehaltene Service überprüft.
questions.0.points.0: Readiness muss die tatsächliche Servierfähigkeit widerspiegeln.
questions.0.points.1: Überspannungskapazität muss vorhanden sein.
questions.0.points.2: Bei Überschneidungen müssen alte und neue Versionen kompatibel sein.
questions.0.prompt: Welche Annahmen bleiben bei maxUnavailable=0 bestehen?
questions.1.points.0: Es schränkt die Aktionen des Controllers ein, nicht jedes Netzwerkereignis.
questions.1.points.1: Messen Sie Verkehr und Terminierung separat.
questions.1.points.2: Geben Sie das tatsächliche Beobachtungsfenster und die Sondengrenzen an.
questions.1.prompt: Beweist eine sichere rollout-Richtlinie, dass keine Anfragen verloren gehen?
diagnostics.maintenance_1: |-
  Auf app1 muss /srv/site/maintenance.txt north-40 enthalten. Das Play hat den Vertrag möglicherweise nicht ausgeliefert. Vergleichen Sie Datei und Ergebnis der Aufgabe. [Dokumentation](https://docs.ansible.com/projects/ansible/latest/collections/ansible/builtin/copy_module.html)
diagnostics.maintenance_2: |-
  Auf app2 muss /srv/site/maintenance.txt north-40 enthalten. Das Play hat den Vertrag möglicherweise nicht ausgeliefert. Vergleichen Sie Datei und Ergebnis der Aufgabe. [Dokumentation](https://docs.ansible.com/projects/ansible/latest/collections/ansible/builtin/copy_module.html)
diagnostics.maintenance_3: |-
  Auf app3 muss /srv/site/maintenance.txt north-40 enthalten. Das Play hat den Vertrag möglicherweise nicht ausgeliefert. Vergleichen Sie Datei und Ergebnis der Aufgabe. [Dokumentation](https://docs.ansible.com/projects/ansible/latest/collections/ansible/builtin/copy_module.html)
