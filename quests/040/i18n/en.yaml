title: Controlled maintenance
brief: |-
  A maintenance handover is incomplete across the managed hosts and the application.

  Work on the workstation in `~/quest`. Stage 1 uses `inventory.ini`, `ansible.cfg`, `rollout.yml` and `maintenance-interface.json`. Stage 2 uses `board.yaml` and `service.yaml`.

  **Requirements:**

  - Maintenance has a one-host-at-a-time safety limit.
  - On `app1`, `app2` and `app3`, `/srv/site/maintenance.txt` contains `north-40` and each host’s HTTP service on port `8080` returns `north-40`.
  - Deployment `board` completes its rollout with `2` replicas available.
  - Service `board` exposes the application on port `8080`.
  - Every running application Pod receives `north-40` from `http://board:8080`. The worker’s HTTP readiness probe checks `/ready` on port `8080`, and each worker returns `ready` there.
debrief: |-
  The batch limit constrains maintenance on the fleet. The readiness probe gates Pod traffic during rollout. Files, process responses and controller state provide different observations at completion.
stages.0.brief: Declared maintenance batches must contain one host.
stages.1.brief: Application availability and service routing must agree.
hints.0.text: |-
  Separate the maintenance file from the response of the running process. A rolling update admits Pods to traffic based on its readiness check.
hints.1.text: |-
  Compare the maintenance definition, the service interface and the actual responses in stage 1. In stage 2, compare the Pod template’s probe and the board Service.

  ```sh
  cat rollout.yml maintenance-interface.json
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    ssh -n -o BatchMode=yes -p 2222 "root@$host" 'cat /srv/site/maintenance.txt'
    curl -fsS --max-time 2 "http://$host:8080/"
  done
  ```

  ```sh
  kubectl get deployment board -o yaml
  kubectl describe service board
  ```
hints.2.text: |-
  In stage 1, the maintenance file and the HTTP response both show `north-40` on all three hosts. In stage 2, verify two available replicas, the release response through the Service and each worker’s direct readiness response.

  ```sh
  ansible-playbook rollout.yml --check
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    ssh -n -o BatchMode=yes -p 2222 "root@$host" 'cat /srv/site/maintenance.txt'
    curl -fsS --max-time 2 "http://$host:8080/"
  done
  ```

  ```sh
  kubectl get deployment board
  kubectl rollout status deployment/board --timeout=3s
  for pod in $(kubectl get pods -l app=board -o json | jq -r '.items[] | select(.metadata.deletionTimestamp==null and .status.phase=="Running") | .metadata.name'); do
    kubectl exec "$pod" -c worker -- wget -qO- -T 3 http://board:8080
    printf '\n'
    kubectl exec "$pod" -c worker -- wget -qO- -T 3 http://127.0.0.1:8080/ready
    printf '\n'
  done
  ```
phrases.0: I limited maintenance batches with serial one.
phrases.1: I verified the maintenance contract on every target.
phrases.2: I verified ready replicas and the retained Service during the rollout.
questions.0.points.0: Readiness must reflect actual serving ability.
questions.0.points.1: Surge capacity must exist.
questions.0.points.2: Old and new versions must be compatible during overlap.
questions.0.prompt: What assumptions remain with maxUnavailable=0?
questions.1.points.0: It constrains controller actions, not every network event.
questions.1.points.1: Measure traffic and termination separately.
questions.1.points.2: State the actual observation window and probe limits.
questions.1.prompt: Does a safe rollout policy prove zero lost requests?
