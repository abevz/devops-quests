title: Controlled maintenance
brief: "A maintenance handover is incomplete across the managed hosts and the application.\n\nWork in `~/quest`\
  \ on the workstation. Inputs by stage:\n- Stage 1: `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n- Stage 2:\
  \ `board.yaml`, `service.yaml`.\n\n**Requirements:**\n\n- Stage 1:\n  - Every play in `rollout.yml` is configured\
  \ to handle one managed host at a time.\n  - On every managed host (`app1`, `app2`, `app3`), `/srv/site/maintenance.txt`\
  \ contains `north-40`.\n  - The inspected playbook is `~/quest/rollout.yml` on the workstation.\n- Stage 2:\n\
  \  - Deployment `board` completes its rollout with `2` replicas and `2` available replicas; its RollingUpdate\
  \ permits `0` unavailable and `1` surge replica.\n  - Service `board` selects `app=board` and routes port `8080`\
  \ to target port `8080`.\n  - Every nonterminating `Running` Pod labelled `app=board` receives `north-40` from\
  \ `http://board:8080`.\n\n**Verify yourself before Check & finish:**\n\n- Stage 1: The preview processes one host\
  \ per batch, and each of `app1`, `app2`, `app3` shows `north-40`.\n\n  ```sh\n  ansible-playbook rollout.yml --check\n\
  \  for n in 1 2 3; do\n    host=\"app${n}-${DQ_NAMESPACE#dq-}\"\n    printf \"%s: \" \"$host\"\n    ssh -n -o\
  \ BatchMode=yes -p 2222 \"root@$host\" 'cat /srv/site/maintenance.txt'\n  done\n  ```\n\n- Stage 2: The Deployment\
  \ and Service match Requirements; consumer requests print `north-40`.\n\n  ```sh\n  kubectl get deployment board\
  \ -o yaml\n  kubectl get service board -o yaml\n  for pod in $(kubectl get pods -l app=board -o json | jq -r '.items[]|select(.metadata.deletionTimestamp==null\
  \ and .status.phase==\"Running\")|.metadata.name'); do\n    kubectl exec \"$pod\" -- wget -qO- http://board:8080\n\
  \    printf \"\\n\"\n  done\n  ```\n\nThe check inspects declared batch policy and current resources and responses;\
  \ it does not prove execution order, Service identity retention or readiness-probe configuration."
debrief: Serial target updates and readiness-gated rolling replacement provided distinct availability mechanisms.
stages.0.brief: Declared maintenance batches must contain one host.
stages.1.brief: Application availability and service routing must agree.
hints.0.text: Separate the fleet contract from the application rollout.
hints.1.text: 'serial and Deployment strategy control different systems. Use `serial: 1` for every maintenance play.'
hints.2.text: Preserve readiness and selectors while changing the response.
phrases.0: I limited maintenance batches with serial one.
phrases.1: I verified the maintenance contract on every target.
phrases.2: I verified ready replicas and the retained Service during the rollout.
questions.0.points.0: Readiness must reflect actual serving ability.
questions.0.points.1: Surge capacity must exist.
questions.0.points.2: Old and new versions must be compatible during overlap.
questions.0.prompt: What assumptions remain with maxUnavailable=0?
questions.1.points.0: It constrains controller actions, not every network event.
questions.1.points.1: Measure traffic and termination separately.
questions.1.points.2: State the actual observation window and probe limits.
questions.1.prompt: Does a safe rollout policy prove zero lost requests?
