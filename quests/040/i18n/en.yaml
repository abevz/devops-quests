title: Controlled maintenance
brief: "A maintenance handover is incomplete across the managed hosts and the application.\n\nWork in `~/quest`\
  \ on the workstation. Inputs by stage:\n- Stage 1: `inventory.ini`, `ansible.cfg`, `rollout.yml`.\n- Stage 2:\
  \ `board.yaml`, `service.yaml`.\n\n**Requirements:**\n\n- Stage 1:\n  - Maintenance has a one-host-at-a-time safety\
  \ limit.\n  - On every managed host (`app1`, `app2`, `app3`), `/srv/site/maintenance.txt` contains `north-40`.\n\
  - Stage 2:\n  - Deployment `board` completes its rollout with `2` replicas available.\n  - Service `board` exposes\
  \ the application on port `8080`.\n  - Every running application Pod receives `north-40` from `http://board:8080`.\n\
  \nThe check inspects declared batch policy and current resources and responses; it does not prove execution order,\
  \ Service identity retention or readiness-probe configuration. The one-host safety limit is checked from its declaration;\
  \ execution order and uninterrupted availability are not traced."
debrief: Serial target updates and readiness-gated rolling replacement provided distinct availability mechanisms.
stages.0.brief: Declared maintenance batches must contain one host.
stages.1.brief: Application availability and service routing must agree.
hints.0.text: Separate the fleet contract from the application rollout.
hints.1.text: 'serial and Deployment strategy control different systems. Use `serial: 1` for every maintenance play.


  Inspect the maintenance definition, application events and Service description.


  ```sh

  cat rollout.yml

  kubectl describe deployment board

  kubectl describe service board

  ```


  Stage 2: Inspect these resource definitions for this stage.


  ```sh

  kubectl get deployment board -o yaml

  kubectl get service board -o yaml

  ```'
hints.2.text: "Preserve readiness and selectors while changing the response.\n\nVerify the relevant stage after\
  \ repairing it.\n\nStage 1: The preview processes one host per batch, and each of `app1`, `app2`, `app3` shows\
  \ `north-40`.\n\n```sh\nansible-playbook rollout.yml --check\nfor n in 1 2 3; do\n  host=\"app${n}-${DQ_NAMESPACE#dq-}\"\
  \n  printf \"%s: \" \"$host\"\n  ssh -n -o BatchMode=yes -p 2222 \"root@$host\" 'cat /srv/site/maintenance.txt'\n\
  done\n```\n\nStage 2: The rollout completes with `2` replicas available; consumer requests print `north-40`.\n\
  \n```sh\nkubectl get deployment board\nkubectl rollout status deployment/board --timeout=3s\nfor pod in $(kubectl\
  \ get pods -l app=board -o json | jq -r '.items[]|select(.metadata.deletionTimestamp==null and .status.phase==\"\
  Running\")|.metadata.name'); do\n  kubectl exec \"$pod\" -- wget -qO- http://board:8080\n  printf \"\\n\"\ndone\n\
  ```\n\nExpected observations for the complete stage:\n- Stage 2: The Deployment and Service match Requirements;\
  \ consumer requests print `north-40`."
phrases.0: I limited maintenance batches with serial one.
phrases.1: I verified the maintenance contract on every target.
phrases.2: I verified ready replicas and the retained Service during the rollout.
questions.0.points.0: Readiness must reflect actual serving ability.
questions.0.points.1: Surge capacity must exist.
questions.0.points.2: Old and new versions must be compatible during overlap.
questions.0.prompt: What assumptions remain with maxUnavailable=0?
questions.1.points.0: It constrains controller actions, not every network event.
questions.1.points.1: Measure traffic and termination separately.
questions.1.points.2: State the actual observation window and probe limits.
questions.1.prompt: Does a safe rollout policy prove zero lost requests?
