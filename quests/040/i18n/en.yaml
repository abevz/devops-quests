title: Controlled maintenance
brief: 'Perform a two-system handover. First deliver north-40 to /srv/site/maintenance.txt
  one fleet host at a time. Then update board.json to serve north-40 with two replicas,
  readiness and RollingUpdate maxUnavailable=0/maxSurge=1. Retain Service board and
  its selector.


  Quest files in `~/quest` (some appear in later stages): `inventory.ini`, `ansible.cfg`,
  `rollout.yml`, `board.json`, `service.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images
  and private services. Change only this bay.


  Initial success criteria: All target maintenance contracts contain north-40.'
debrief: Serial target updates and readiness-gated rolling replacement provided distinct
  availability mechanisms.
stages.0.brief: 'All target maintenance contracts contain north-40; every maintenance
  play uses serial: 1.'
stages.0.objectives.0.text: 'All target maintenance contracts contain north-40; every
