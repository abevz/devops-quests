title: Controlled maintenance
brief: |-
  A maintenance handover is incomplete across the managed hosts and the application.

  Work on the workstation in `~/quest`. Stage 1 uses `inventory.ini`, `ansible.cfg`, `rollout.yml` and `maintenance-interface.json`. Stage 2 uses `board.yaml` and `service.yaml`.

  **Requirements:**

  - Maintenance has a one-host-at-a-time safety limit.
  - On `app1`, `app2` and `app3`, `/srv/site/maintenance.txt` contains `north-40` and each host’s HTTP service on port `8080` returns `north-40`.
  - Deployment `board` completes its rollout with `2` replicas available.
  - Service `board` exposes the application on port `8080`.
  - Every running application Pod receives `north-40` from `http://board:8080`. The worker’s HTTP readiness probe checks `/ready` on port `8080`, and each worker returns `ready` there.
debrief: |-
  The batch limit constrains maintenance on the fleet. The readiness probe gates Pod traffic during rollout. Files, process responses and controller state provide different observations at completion.
stages.0.brief: Declared maintenance batches must contain one host.
stages.1.brief: Application availability and service routing must agree.
hints.0.text: |-
  Separate the maintenance file from the response of the running process. A rolling update admits Pods to traffic based on its readiness check.
hints.1.text: |-
  Compare the maintenance definition, the service interface and the actual responses in stage 1. In stage 2, compare the Pod template’s probe and the board Service.

  ```sh
  cat rollout.yml maintenance-interface.json
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    ssh -n -o BatchMode=yes -p 2222 "root@$host" 'cat /srv/site/maintenance.txt'
    curl -fsS --max-time 2 "http://$host:8080/"
  done
  ```

  ```sh
  kubectl get deployment board -o yaml
  kubectl describe service board
  ```
hints.2.text: |-
  In stage 1, the maintenance file and the HTTP response both show `north-40` on all three hosts. In stage 2, verify two available replicas, the release response through the Service and each worker’s direct readiness response.

  ```sh
  ansible-playbook rollout.yml --check
  for n in 1 2 3; do
    host="app${n}-${DQ_NAMESPACE#dq-}"
    ssh -n -o BatchMode=yes -p 2222 "root@$host" 'cat /srv/site/maintenance.txt'
    curl -fsS --max-time 2 "http://$host:8080/"
  done
  ```

  ```sh
  kubectl get deployment board
  kubectl rollout status deployment/board --timeout=3s
  for pod in $(kubectl get pods -l app=board -o json | jq -r '.items[] | select(.metadata.deletionTimestamp==null and .status.phase=="Running") | .metadata.name'); do
    kubectl exec "$pod" -c worker -- wget -qO- -T 3 http://board:8080
    printf '\n'
    kubectl exec "$pod" -c worker -- wget -qO- -T 3 http://127.0.0.1:8080/ready
    printf '\n'
  done
  ```
phrases.0: I limited maintenance batches with serial one.
phrases.1: I verified the maintenance contract on every target.
phrases.2: I verified ready replicas and the retained Service during the rollout.
questions.0.points.0: Readiness must reflect actual serving ability.
questions.0.points.1: Surge capacity must exist.
questions.0.points.2: Old and new versions must be compatible during overlap.
questions.0.prompt: What assumptions remain with maxUnavailable=0?
questions.1.points.0: It constrains controller actions, not every network event.
questions.1.points.1: Measure traffic and termination separately.
questions.1.points.2: State the actual observation window and probe limits.
questions.1.prompt: Does a safe rollout policy prove zero lost requests?
stages.0.objectives.0.text: Maintenance has a one-host-at-a-time safety limit.
stages.0.objectives.1.text: |-
  On `app1`, `app2` and `app3`, `/srv/site/maintenance.txt` contains `north-40` and each host’s HTTP service on port `8080` returns `north-40`.
stages.1.objectives.0.text: Deployment `board` completes its rollout with `2` replicas available.
stages.1.objectives.1.text: Service `board` exposes the application on port `8080`.
stages.1.objectives.2.text: |-
  Every running application Pod receives `north-40` from `http://board:8080`. The worker’s HTTP readiness probe checks `/ready` on port `8080`, and each worker returns `ready` there.
diagnostics.serial: A play may no longer select one host per batch, or unreadable YAML, PyYAML or inventory observations may prevent checking its batch policy. [Cause and check](guides#guide=ansible-11&section=maintenance-single-host-batches)
diagnostics.probe_0_0: The workstation may be unable to enter the workspace or start Python before the serial-policy observer reports a result. [Cause and check](guides#guide=ansible-11&section=maintenance-single-host-batches)
diagnostics.maintenance_1: The play may not have delivered north-40 to app1, or SSH and file-read errors may prevent observing maintenance.txt. [Cause and check](guides#guide=ansible-11&section=maintenance-contract-files)
diagnostics.maintenance_2: The play may not have delivered north-40 to app2, or SSH and file-read errors may prevent observing maintenance.txt. [Cause and check](guides#guide=ansible-11&section=maintenance-contract-files)
diagnostics.maintenance_3: The play may not have delivered north-40 to app3, or SSH and file-read errors may prevent observing maintenance.txt. [Cause and check](guides#guide=ansible-11&section=maintenance-contract-files)
diagnostics.fleet_http: Writing maintenance.txt alone may leave the service message unpublished or unreloaded; DNS, transport or HTTP errors can also block the expected fleet response. [Cause and check](guides#guide=ansible-11&section=maintenance-loaded-message)
diagnostics.available: Scaling or an incomplete rollout may leave the desired or available replica count different from two. [Cause and check](guides#guide=kubernetes-4&section=maintenance-board-availability)
diagnostics.probe_1_0: The rollout may be incomplete or its command unavailable; workspace or Python startup failures can also prevent the later availability/budget observation. [Cause and check](guides#guide=kubernetes-4&section=maintenance-board-availability)
diagnostics.strategy: The rollout strategy or effective surge/unavailable budget may have changed; unreadable or malformed Deployment data also reports this marker. [Cause and check](guides#guide=kubernetes-4&section=maintenance-rolling-budget)
diagnostics.service: The Service selector or target port may no longer match the board template; API, JSON or port-resolution failures can also prevent verification. [Cause and check](guides#guide=kubernetes-10&section=maintenance-board-service)
diagnostics.probe_1_1: Workspace access or Python/helper startup may have failed before a Service diagnostic could be produced. [Cause and check](guides#guide=kubernetes-10&section=maintenance-board-service)
diagnostics.http: No owned running Pod, a stale served body or a broken Service path may prevent north-40; API, exec and HTTP observation errors can produce the same marker. [Cause and check](guides#guide=kubernetes-10&section=maintenance-board-http)
diagnostics.probe_1_2: Workspace access or Python/helper startup may have stopped the HTTP observer before it could report a named condition. [Cause and check](guides#guide=kubernetes-10&section=maintenance-board-http)
diagnostics.readiness_probe: The worker probe may still target / or use the wrong HTTP action/port; host or HTTPS overrides also violate the readiness contract. [Cause and check](guides#guide=kubernetes-4&section=maintenance-readiness-contract)
diagnostics.readiness_endpoint: The running worker may not publish the ready body at /ready even with a corrected template; exec or local HTTP errors also fail the observation. [Cause and check](guides#guide=kubernetes-4&section=maintenance-ready-response)
