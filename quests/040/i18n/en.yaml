diagnostics.serial: |-
  Maintenance must have a one-host-at-a-time batch limit. The play may cover more than one host per batch. Compare the host pattern and batch limit. [Reference](https://docs.ansible.com/projects/ansible/latest/playbook_guide/playbooks_strategies.html#setting-the-batch-size-with-serial)
diagnostics.strategy: |-
  The rolling update must preserve an effective surge of one and zero unavailability. Deployment strategy and the current rollout are separate. Compare the strategy and available replicas. [Reference](https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy)
diagnostics.available: |-
  Deployment board must have two available replicas. Deployment strategy and the current rollout are separate. Compare the strategy and available replicas. [Reference](https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#complete-deployment)
diagnostics.service: |-
  Service board must select the application and expose TCP 8080 at its application port. The selector or port mapping may point to another backend. Compare the Service and the Pod template. [Reference](https://kubernetes.io/docs/concepts/services-networking/service/#defining-a-service)
diagnostics.http: |-
  Every running application Pod must receive north-40 from board:8080. A Pod may still serve the previous release. Check the direct responses and rollout status. [Reference](https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#updating-a-deployment)
diagnostics.probe_0_0: |-
  The probe returned no usable diagnostic. Check the referenced resource or file separately. [Reference](https://docs.ansible.com/projects/ansible/latest/playbook_guide/playbooks_strategies.html#setting-the-batch-size-with-serial)
diagnostics.probe_1_0: |-
  The probe returned no usable diagnostic. Check the referenced resource or file separately. [Reference](https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#complete-deployment)
diagnostics.probe_1_1: |-
  The probe returned no usable diagnostic. Check the referenced resource or file separately. [Reference](https://kubernetes.io/docs/concepts/services-networking/service/#port-definitions)
diagnostics.probe_1_2: |-
  The probe returned no usable diagnostic. Check the referenced resource or file separately. [Reference](https://kubernetes.io/docs/concepts/workloads/pods/probes/#readiness-probe)
diagnostics.fleet_http: |-
  The process may still use data loaded at startup. Compare the saved message and the HTTP response before moving to the next host. [Reference](https://docs.ansible.com/projects/ansible/latest/playbook_guide/playbooks_handlers.html#notifying-handlers)
diagnostics.readiness_probe: |-
  The Pod template may check a different path or listener. Compare the readiness probe and the dedicated endpoint. [Reference](https://kubernetes.io/docs/concepts/workloads/pods/probes/#readiness-probe)
diagnostics.readiness_endpoint: |-
  The listening process may not serve the readiness endpoint yet. Request it on the affected Pod. [Reference](https://kubernetes.io/docs/concepts/workloads/pods/probes/#readiness-probe)
