title: Selektory Service
brief: 'Dołączyłeś do operacji SignalRail. Służba przylotów nie miała endpoints. Pracuj w ~/quest.. Wszystkie
  zmiany przechowuj w tej komorze szkoleniowej.


  Wejścia w `~/quest`: `deployment.json`, `service.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Wszystkie zmiany muszą pozostać w tej zatoce.


  Początkowe kryteria sukcesu: Arrivals wybiera gotowy endpoint.'
stages.0.brief: 'Strąki są zdrowe. Przywróć trasę serwisową arrivals.


  Kryteria sukcesu: Arrivals wybiera gotowy endpoint.'
stages.0.objectives.0.text: Arrivals wybiera gotowy endpoint.
hints.0.text: Zdrowe kapsułki nie gwarantują działania Service.
hints.1.text: Porównaj selektor Service z etykietą pod app.
hints.2.text: Zrób arrivals wybierz app=relay i zweryfikuj gotowy EndpointSlice endpoint.
debrief: Service wybrał niewłaściwą etykietę app. Naprawiłeś jego selektor i zweryfikowałeś gotowy EndpointSlice
  endpoint.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
