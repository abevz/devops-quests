title: Selektory Service
brief: |
  Trasa przyjazdów SignalRail nie ma gotowych punktów docelowych.

  Pracuj w `~/quest` z plikami `deployment.yaml` i `service.yaml`.

  **Wymagania:**
  - Co najmniej jeden endpoint w EndpointSlice jest gotowy:
    - Powiązanie z usługą: `kubernetes.io/service-name=arrivals`.
    - Warunek endpointu: `conditions.ready` ma wartość `true`.

  **Sprawdź przed Check & finish:**
  - `kubectl get endpointslices -l kubernetes.io/service-name=arrivals` — pokazuje co najmniej jeden EndpointSlice powiązany z `arrivals`.
  - `kubectl get endpointslices -l kubernetes.io/service-name=arrivals -o json` — pokazuje `conditions.ready: true` dla co najmniej jednego endpointu.
stages.0.brief: |
  Trasa przyjazdów musi mieć gotowy punkt docelowy.
stages.0.objectives.0.text: Arrivals wybiera gotowy endpoint.
hints.0.text: |
  Pody są sprawne. Sprawne pody nie gwarantują działania Service.
hints.1.text: Porównaj selektor Service z etykietą pod app.
hints.2.text: Zrób arrivals wybierz app=relay i zweryfikuj gotowy EndpointSlice endpoint.
debrief: Service wybrał niewłaściwą etykietę app. Naprawiłeś jego selektor i zweryfikowałeś gotowy EndpointSlice
  endpoint.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
