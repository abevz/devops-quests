title: Selektory Service
brief: |-
  Trasa przyjazdów SignalRail nie ma gotowych punktów docelowych.

  Pracuj na workstation w `~/quest` z dostarczonymi plikami:
  - `deployment.yaml`, `service.yaml`.

  **Wymagania:**

  - Service `arrivals` ma co najmniej jeden gotowy endpoint w EndpointSlice.

  Gotowy endpoint w EndpointSlice nie dowodzi poprawnego dostarczania HTTP.
stages.0.brief: Gotowe cele muszą należeć do Service `arrivals`.
stages.0.objectives.0.text: Arrivals wybiera gotowy endpoint.
hints.0.text: |-
  Service wybiera Pody za pomocą etykiet.
hints.1.text: |-
  Porównaj selektor `arrivals` z etykietą `app` na Podach `relay`.

  ```sh
  kubectl get pods --show-labels
  kubectl get service arrivals -o yaml
  kubectl get service arrivals -o jsonpath='{.spec.selector.app}{"\n"}'
  ```
hints.2.text: |-
  Po ustawieniu `app=relay` sprawdź, czy EndpointSlice dla `arrivals` zawiera gotowy punkt końcowy.

  - `kubectl get endpointslices -l kubernetes.io/service-name=arrivals` — pokazuje co najmniej jeden EndpointSlice powiązany z `arrivals`.
  - `kubectl get endpointslices -l kubernetes.io/service-name=arrivals -o json` — pokazuje `conditions.ready: true` dla co najmniej jednego endpointu.
debrief: Service wybrał niewłaściwą etykietę app. Naprawiłeś jego selektor i zweryfikowałeś gotowy EndpointSlice
  endpoint.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem stan workload i jego gotowość po zmianie.
diagnostics.condition_0: |-
  Service może nie mieć gotowych punktów końcowych, jeśli selektor nie pasuje do żadnego Poda lub pasujące Pody są niegotowe. [Przewodnik](guides#guide=kubernetes-10&section=arrivals-ready-endpoint)
