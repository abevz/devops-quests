title: Service selectors
brief: |-
  SignalRail's arrivals route has no ready destinations.

  Work on the workstation in `~/quest` with the supplied files:
  - `deployment.yaml`, `service.yaml`.

  **Requirements:**

  - Service `arrivals` has at least one ready EndpointSlice endpoint.

  A ready EndpointSlice endpoint does not prove successful HTTP delivery.
stages.0.brief: Ready destinations must belong to Service `arrivals`.
stages.0.objectives.0.text: Arrivals selects a ready endpoint.
hints.0.text: |-
  A Service selects its Pods by label.
hints.1.text: |-
  Compare the selector of `arrivals` with the `app` label on the `relay` Pods.

  ```sh
  kubectl get pods --show-labels
  kubectl get service arrivals -o yaml
  kubectl get service arrivals -o jsonpath='{.spec.selector.app}{"\n"}'
  ```
hints.2.text: |-
  After setting `app=relay`, verify a ready endpoint in an EndpointSlice for `arrivals`.

  - `kubectl get endpointslices -l kubernetes.io/service-name=arrivals` — shows at least one EndpointSlice associated with `arrivals`.
  - `kubectl get endpointslices -l kubernetes.io/service-name=arrivals -o json` — shows `conditions.ready: true` for at least one endpoint.
debrief: The Service selected the wrong app label. You repaired its selector and verified a ready EndpointSlice
  endpoint.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked the workload state and its readiness after the change.
diagnostics.condition_0: |-
  A Service can lack ready endpoints when its selector matches no Pods or the matching Pods are unready. [Guide](guides#guide=kubernetes-10&section=arrivals-ready-endpoint)
