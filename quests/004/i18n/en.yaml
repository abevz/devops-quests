title: Service selectors
brief: |
  SignalRail's arrivals route has no ready destinations.

  Work in `~/quest` with `deployment.json` and `service.json`.

  **Requirements:**
  - At least one EndpointSlice endpoint is ready:
    - Service association: `kubernetes.io/service-name=arrivals`.
    - Endpoint condition: `conditions.ready` is `true`.

  **Verify yourself before Check & finish:**
  - `kubectl get endpointslices -l kubernetes.io/service-name=arrivals` — shows at least one EndpointSlice associated with `arrivals`.
  - `kubectl get endpointslices -l kubernetes.io/service-name=arrivals -o json` — shows `conditions.ready: true` for at least one endpoint.
stages.0.brief: |
  The arrivals route must have a ready destination.
stages.0.objectives.0.text: Arrivals selects a ready endpoint.
hints.0.text: |
  Pods are healthy. Healthy pods do not guarantee a working Service.
hints.1.text: Compare the Service selector with the pod app label.
hints.2.text: Make arrivals select app=relay and verify a ready EndpointSlice endpoint.
debrief: The Service selected the wrong app label. You repaired its selector and verified a ready EndpointSlice
  endpoint.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked the workload state and its readiness after the change.
