title: Service selectors
brief: 'You joined SignalRail operations. The arrivals service had no endpoints. Work in ~/quest. Keep
  all changes inside this training bay.


  Inputs in `~/quest`: `deployment.json`, `service.json`.


  The bay has no Internet or external DNS. Use only its supplied files, preloaded images and private services.
  All changes must stay inside this bay.


  Initial success criteria: Arrivals selects a ready endpoint.'
stages.0.brief: 'Pods are healthy. Restore the arrivals service route.


  Success criteria: Arrivals selects a ready endpoint.'
stages.0.objectives.0.text: Arrivals selects a ready endpoint.
hints.0.text: Healthy pods do not guarantee a working Service.
hints.1.text: Compare the Service selector with the pod app label.
hints.2.text: Make arrivals select app=relay and verify a ready EndpointSlice endpoint.
debrief: The Service selected the wrong app label. You repaired its selector and verified a ready EndpointSlice
  endpoint.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I checked the workload state and its readiness after the change.
