title: Selectores Service
brief: |-
  La ruta de llegadas de SignalRail no tiene destinos listos.

  Trabaja en la workstation en `~/quest` con los archivos suministrados:
  - `deployment.yaml`, `service.yaml`.

  **Requisitos:**

  - El Service `arrivals` tiene al menos un endpoint listo en EndpointSlice.

  Un endpoint listo en EndpointSlice no demuestra una entrega HTTP correcta.
stages.0.brief: Los destinos listos deben pertenecer al Service `arrivals`.
stages.0.objectives.0.text: Arrivals selecciona un endpoint listo.
hints.0.text: |
  Los pods están sanos. Los pods sanos no garantizan que un Service funcione.
hints.1.text: |-
  Compare la etiqueta Service selector con la etiqueta pod app.

  Inspecciona los datos suministrados y las observaciones activas:

  ```sh
  kubectl get pods --show-labels
  kubectl get service arrivals -o yaml
  ```
hints.2.text: |-
  Haga que arrivals seleccione app=relay y verifique un EndpointSlice endpoint listo.

  Verifica el resultado desde `~/quest` en la workstation:

  - `kubectl get endpointslices -l kubernetes.io/service-name=arrivals` — muestra al menos un EndpointSlice asociado con `arrivals`.
  - `kubectl get endpointslices -l kubernetes.io/service-name=arrivals -o json` — muestra `conditions.ready: true` para al menos un endpoint.
debrief: El Service seleccionó la etiqueta app incorrecta. Reparaste su selector y verificaste un EndpointSlice
  endpoint listo.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el estado de workload y su preparación después del cambio.
