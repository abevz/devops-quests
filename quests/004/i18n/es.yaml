title: Selectores Service
brief: 'Te uniste a las operaciones de SignalRail. El servicio de llegadas no contaba con endpoints. Trabajar
  en ~/quest. Mantenga todos los cambios dentro de esta bahía de entrenamiento.


  Entradas en `~/quest`: `deployment.json`, `service.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente los archivos suministrados, las imágenes
  precargadas y los servicios privados. Todos los cambios deben permanecer dentro de esta bahía.


  Criterios de éxito iniciales: Arrivals selecciona un endpoint listo.'
stages.0.brief: 'Las vainas están sanas. Restaure el servicio arrivals route.


  Criterios de éxito: Arrivals selecciona un endpoint listo.'
stages.0.objectives.0.text: Arrivals selecciona un endpoint listo.
hints.0.text: Los pods Healthy no garantizan un Service que funcione.
hints.1.text: Compare la etiqueta Service selector con la etiqueta pod app.
hints.2.text: Haga que arrivals seleccione app=relay y verifique un EndpointSlice endpoint listo.
debrief: El Service seleccionó la etiqueta app incorrecta. Reparaste su selector y verificaste un EndpointSlice
  endpoint listo.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el estado de workload y su preparación después del cambio.
