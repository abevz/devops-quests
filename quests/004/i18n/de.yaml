title: Service Selektoren
brief: |-
  Die Ankunftsroute von SignalRail hat keine bereiten Ziele.

  Arbeiten Sie auf der Workstation in `~/quest` mit den bereitgestellten Dateien:
  - `deployment.yaml`, `service.yaml`.

  **Anforderungen:**

  - Service `arrivals` hat mindestens einen bereiten EndpointSlice-Endpunkt.

  Ein bereiter EndpointSlice-Endpunkt beweist keine erfolgreiche HTTP-Zustellung.
stages.0.brief: Bereite Ziele müssen zu Service `arrivals` gehören.
stages.0.objectives.0.text: Arrivals wählt einen fertigen endpoint aus.
hints.0.text: |-
  Ein Service wählt seine Pods anhand von Labels aus.
hints.1.text: |-
  Vergleiche den Selektor von `arrivals` mit dem Label `app` der Pods von `relay`.

  ```sh
  kubectl get pods --show-labels
  kubectl get service arrivals -o yaml
  kubectl get service arrivals -o jsonpath='{.spec.selector.app}{"\n"}'
  ```
hints.2.text: |-
  Prüfe nach dem Setzen von `app=relay`, ob ein EndpointSlice für `arrivals` einen bereiten Endpunkt enthält.

  - `kubectl get endpointslices -l kubernetes.io/service-name=arrivals` — zeigt mindestens einen EndpointSlice für `arrivals`.
  - `kubectl get endpointslices -l kubernetes.io/service-name=arrivals -o json` — zeigt `conditions.ready: true` für mindestens einen Endpunkt.
debrief: Der Service hat das falsche app-Label ausgewählt. Sie haben den Selektor repariert und festgestellt,
  dass er bereit ist EndpointSlice endpoint.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe den workload-Status und seine Bereitschaft nach der Änderung überprüft.
diagnostics.condition_0: |-
  Ein Service hat möglicherweise keine bereiten Endpunkte, wenn sein Selektor keine Pods erfasst oder die ausgewählten Pods noch nicht bereit sind. [Leitfaden](guides#guide=kubernetes-10&section=arrivals-ready-endpoint)
