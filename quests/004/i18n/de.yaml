title: Service Selektoren
brief: |
  Die Ankunftsroute von SignalRail hat keine bereiten Ziele.

  Arbeiten Sie in `~/quest` mit `deployment.json` und `service.json`.

  **Anforderungen:**
  - Mindestens ein EndpointSlice-Endpunkt ist bereit:
    - Dienstzuordnung: `kubernetes.io/service-name=arrivals`.
    - Endpunktbedingung: `conditions.ready` ist `true`.

  **Selbstprüfung vor Check & finish:**
  - `kubectl get endpointslices -l kubernetes.io/service-name=arrivals` — zeigt mindestens einen EndpointSlice für `arrivals`.
  - `kubectl get endpointslices -l kubernetes.io/service-name=arrivals -o json` — zeigt `conditions.ready: true` für mindestens einen Endpunkt.
stages.0.brief: |
  Die Ankunftsroute muss ein bereites Ziel haben.
stages.0.objectives.0.text: Arrivals wählt einen fertigen endpoint aus.
hints.0.text: |
  Die Pods sind gesund. Gesunde Pods garantieren keinen funktionierenden Service.
hints.1.text: Vergleichen Sie das Service selector mit dem pod app-Label.
hints.2.text: Wählen Sie für arrivals app=relay aus und überprüfen Sie, ob EndpointSlice endpoint bereit
  ist.
debrief: Der Service hat das falsche app-Label ausgewählt. Sie haben den Selektor repariert und festgestellt,
  dass er bereit ist EndpointSlice endpoint.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe den workload-Status und seine Bereitschaft nach der Änderung überprüft.
