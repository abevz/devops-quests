title: Service Selektoren
brief: 'Sie sind dem Betrieb SignalRail beigetreten. Der Ankunftsdienst hatte kein endpoints. Arbeiten
  Sie in ~/quest.. Bewahren Sie alle Änderungen in diesem Trainingsbereich auf.


  Eingänge in `~/quest`: `deployment.json`, `service.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur die bereitgestellten Dateien,
  vorinstallierten Bilder und privaten Dienste. Alle Änderungen müssen innerhalb dieser Bucht bleiben.


  Erste Erfolgskriterien: Arrivals wählt einen fertigen endpoint aus.'
stages.0.brief: 'Schoten sind gesund. Stellen Sie den arrivals-Dienst route wieder her.


  Erfolgskriterium: Arrivals wählt einen fertigen endpoint aus.'
stages.0.objectives.0.text: Arrivals wählt einen fertigen endpoint aus.
hints.0.text: Healthy-Pods garantieren nicht, dass Service funktioniert.
hints.1.text: Vergleichen Sie das Service selector mit dem pod app-Label.
hints.2.text: Wählen Sie für arrivals app=relay aus und überprüfen Sie, ob EndpointSlice endpoint bereit
  ist.
debrief: Der Service hat das falsche app-Label ausgewählt. Sie haben den Selektor repariert und festgestellt,
  dass er bereit ist EndpointSlice endpoint.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe den workload-Status und seine Bereitschaft nach der Änderung überprüft.
