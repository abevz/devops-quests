title: Селекторы Service
brief: |-
  У маршрута прибытия SignalRail нет готовых адресатов.

  Работайте на workstation в `~/quest` с предоставленными файлами:
  - `deployment.yaml`, `service.yaml`.

  **Требования:**

  - Service `arrivals` имеет хотя бы один готовый endpoint в EndpointSlice.

  Готовый endpoint в EndpointSlice не доказывает успешную доставку HTTP.
stages.0.brief: Готовые назначения должны относиться к Service `arrivals`.
stages.0.objectives.0.text: Arrivals выбирает готовый endpoint.
hints.0.text: |
  Pod исправны. Исправные pod не гарантируют работающий Service.
hints.1.text: |-
  Сравните selector Service с меткой app у pod.

  Изучите предоставленные файлы и живые наблюдения:

  ```sh
  kubectl get pods --show-labels
  kubectl get service arrivals -o yaml
  ```
hints.2.text: |-
  Настройте arrivals на app=relay и проверьте готовый endpoint в EndpointSlice.

  Проверьте результат из `~/quest` на workstation:

  - `kubectl get endpointslices -l kubernetes.io/service-name=arrivals` — показывает хотя бы один EndpointSlice, связанный с `arrivals`.
  - `kubectl get endpointslices -l kubernetes.io/service-name=arrivals -o json` — показывает `conditions.ready: true` хотя бы для одного endpoint.
debrief: Service выбирал неверную метку app. Вы исправили селектор и проверили готовый endpoint в EndpointSlice.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: После изменения я проверил состояние workload и его готовность.
