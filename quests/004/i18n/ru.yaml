title: Селекторы Service
brief: 'Вы в команде эксплуатации SignalRail. Сервис прибытия остался без endpoints. Работайте в ~/quest.
  Все изменения — только в этой песочнице.


  Входные файлы в `~/quest`: `deployment.json`, `service.json`.


  В песочнице нет интернета и внешнего DNS. Используйте только выданные файлы, предварительно загруженные
  образы и приватные сервисы. Все изменения — только в этой песочнице.


  Цели первого этапа: Arrivals выбирает готовый endpoint.'
stages.0.brief: 'Pod исправен. Восстановите маршрут arrivals.


  Результат проверки: Arrivals выбирает готовый endpoint.'
stages.0.objectives.0.text: Arrivals выбирает готовый endpoint.
hints.0.text: Исправные pod не гарантируют работающий Service.
hints.1.text: Сравните selector Service с меткой app у pod.
hints.2.text: Настройте arrivals на app=relay и проверьте готовый endpoint в EndpointSlice.
debrief: Service выбирал неверную метку app. Вы исправили селектор и проверили готовый endpoint в EndpointSlice.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: После изменения я проверил состояние workload и его готовность.
