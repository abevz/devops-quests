title: Secret-Schlüssel
brief: |
  Der Dienst zum Lesen der Route ist nicht verfügbar.

  Arbeiten Sie auf der Workstation in `~/quest` mit `station.yaml`, `reader.yaml`.

  **Anforderungen:**
  - Verfügbarkeit des Workloads:
    - Deployment: `reader`.
    - Status: Rollout abgeschlossen.
  - Ausgabe im Container `worker` des Pods `app=reader`:
    - Datei: `/tmp/route`.
    - Inhalt: `north`.
  - Erster Umgebungseintrag des ersten Containers in Deployment `reader`:
    - Umgebungsvariable: `ROUTE`.
    - `secretKeyRef`: `{name: station, key: route}`.
    - Der Wert wird referenziert und nicht im Workload hinterlegt.

  **Selbstprüfung vor Check & finish:**
  - `kubectl rollout status deployment/reader --timeout=3s` — endet mit Code `0` und meldet einen abgeschlossenen Rollout.
  - `kubectl get deployment reader -o json` — zeigt `ROUTE` als ersten Umgebungseintrag des ersten Containers mit `secretKeyRef: {name: station, key: route}` ohne eingebetteten Wert.
  - `kubectl exec deployment/reader -- cat /tmp/route` — gibt `north` aus dem Container aus.
debrief: Der Secret existierte; Sein Hauptvertrag unterschied sich von der Referenz Pod.
stages.0.brief: |
  Der Nutzer muss seine Route über die geforderte Secret-Referenz erhalten.
stages.0.objectives.0.text: Deployment `reader` schließt seinen Rollout ab.
stages.0.objectives.1.text: Der reader-Pod schreibt `north` nach `/tmp/route`.
stages.0.objectives.2.text: Deployment `reader` bezieht `ROUTE` aus dem Schlüssel `route` des Secrets
  `station`, ohne den Wert einzubetten.
hints.0.text: Überprüfen Sie die Pod-Ereignisse auf einen fehlenden Schlüssel.
hints.1.text: |
  Secret Name und Datenschlüssel sind unabhängig. Der Schlüssel wurde umbenannt: station.yaml enthält route, aber reader.yaml fordert noch route_name an. Behalten Sie reader/worker bei und ändern Sie das Secret nicht.
hints.2.text: Ändern Sie secretKeyRef.key und warten Sie auf das neue ReplicaSet.
phrases.0: Ich habe den Schlüssel Secret mit der Containerreferenz abgeglichen.
phrases.1: Ich habe den gemounteten Wert innerhalb der laufenden Arbeitslast überprüft.
phrases.2: Ich habe die Umgebungsreferenz überprüft, ohne Anmeldeinformationen auszudrucken.
questions.0.points.0: Überprüfen Sie waiting reason und Ereignisse.
questions.0.points.1: Überprüfen Sie Name und Schlüssel, ohne Werte auszudrucken.
questions.0.points.2: Umgebungswerte werden beim Start von Pod verbraucht.
questions.0.prompt: Wie unterscheidet man einen fehlenden Secret von einem nicht übereinstimmenden Schlüssel?
questions.1.points.0: Vermeiden Sie Werte in Workload-Vorlagen.
questions.1.points.1: Base64 ist keine Verschlüsselung.
questions.1.points.2: Verwenden Sie das begrenzte RBAC und die Verschlüsselung im Ruhezustand.
questions.1.prompt: Was schützt eine Secret-Referenz und was ist sonst noch erforderlich?
