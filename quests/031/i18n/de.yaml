title: Secret-Schlüssel
brief: 'Reader kann nicht gestartet werden, nachdem ein Secret-Schlüssel umbenannt wurde. station.json
  enthält den Nur-Spiel-Wert unter route; reader.json fordert weiterhin route_name. an. Reparieren Sie
  die Referenz, ohne den Wert einzubetten oder Secret zu ändern. Behalten Sie reader/worker.


  Questdateien in `~/quest` (einige erscheinen in späteren Phasen): `station.json`, `reader.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: Reader ist verfügbar, /tmp/route enthält north und die Umgebung verweist auf
  station/route.'
debrief: Der Secret existierte; Sein Hauptvertrag unterschied sich von der Referenz Pod.
stages.0.brief: 'Erfolgskriterien: Reader ist verfügbar, /tmp/route enthält north und die Umgebung verweist
  auf station/route.'
stages.0.objectives.0.text: Reader ist verfügbar, /tmp/route enthält north und die Umgebungsreferenzen
  station/route.
hints.0.text: Überprüfen Sie die Pod-Ereignisse auf einen fehlenden Schlüssel.
hints.1.text: Secret Name und Datenschlüssel sind unabhängig.
hints.2.text: Ändern Sie secretKeyRef.key und warten Sie auf das neue ReplicaSet.
phrases.0: Ich habe den Schlüssel Secret mit der Containerreferenz abgeglichen.
phrases.1: Ich habe den gemounteten Wert innerhalb der laufenden Arbeitslast überprüft.
phrases.2: Ich habe die Umgebungsreferenz überprüft, ohne Anmeldeinformationen auszudrucken.
questions.0.points.0: Überprüfen Sie waiting reason und Ereignisse.
questions.0.points.1: Überprüfen Sie Name und Schlüssel, ohne Werte auszudrucken.
questions.0.points.2: Umgebungswerte werden beim Start von Pod verbraucht.
questions.0.prompt: Wie unterscheidet man einen fehlenden Secret von einem nicht übereinstimmenden Schlüssel?
questions.1.points.0: Vermeiden Sie Werte in Workload-Vorlagen.
questions.1.points.1: Base64 ist keine Verschlüsselung.
questions.1.points.2: Verwenden Sie das begrenzte RBAC und die Verschlüsselung im Ruhezustand.
questions.1.prompt: Was schützt eine Secret-Referenz und was ist sonst noch erforderlich?
