title: Ключи Secret
brief: 'Reader не запускается после переименования ключа Secret. В station.json игровое
  значение находится под route, но reader.json запрашивает route_name. Исправьте ссылку
  без встраивания значения и изменения Secret. Сохраните reader/worker.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `station.json`,
  `reader.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно
  загруженные образы и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Reader доступен, /tmp/route содержит north, окружение ссылается
  на station/route.'
debrief: Secret существовал; контракт ключа расходился со ссылкой Pod.
stages.0.brief: 'Результат проверки: Reader доступен, /tmp/route содержит north, окружение
  ссылается на station/route.'
stages.0.objectives.0.text: Reader доступен, /tmp/route содержит north, окружение
  ссылается на station/route.
hints.0.text: Посмотрите события Pod о недостающем ключе.
hints.1.text: Имя Secret и ключ данных независимы.
hints.2.text: Исправьте secretKeyRef.key и дождитесь нового ReplicaSet.
phrases.0: Я согласовал ключ Secret со ссылкой контейнера.
phrases.1: Я проверил смонтированное значение в работающей нагрузке.
phrases.2: Я проверил ссылку окружения, не печатая учётные данные.
questions.0.points.0: Изучите waiting reason и события.
questions.0.points.1: Проверьте имя и ключ без вывода значений.
questions.0.points.2: Окружение получает значения при запуске Pod.
questions.0.prompt: Как отличить отсутствующий Secret от несовпадения ключа?
questions.1.points.0: Уберите значения из шаблонов нагрузки.
questions.1.points.1: Base64 не является шифрованием.
questions.1.points.2: Ограничьте RBAC и шифруйте хранение.
questions.1.prompt: Что защищает ссылка на Secret и какая ещё защита нужна?
