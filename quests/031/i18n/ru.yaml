title: Ключи Secret
brief: |
  Сервис чтения маршрута недоступен.

  Работайте на workstation в `~/quest` с файлами `station.yaml`, `reader.yaml`.

  **Требования:**
  - Доступность нагрузки:
    - Deployment: `reader`.
    - Состояние: Rollout завершён.
  - Результат внутри контейнера `worker` Pod `app=reader`:
    - Файл: `/tmp/route`.
    - Содержимое: `north`.
  - Первая переменная окружения первого контейнера Deployment `reader`:
    - Переменная окружения: `ROUTE`.
    - `secretKeyRef`: `{name: station, key: route}`.
    - Значение задаётся ссылкой, а не встраивается в нагрузку.

  **Самопроверка перед Check & finish:**
  - `kubectl rollout status deployment/reader --timeout=3s` — завершается с кодом `0` и сообщает о завершённом rollout.
  - `kubectl get deployment reader -o json` — показывает `ROUTE` первой переменной окружения первого контейнера, с `secretKeyRef: {name: station, key: route}` без встроенного значения.
  - `kubectl exec deployment/reader -- cat /tmp/route` — выводит `north` из контейнера.
debrief: Secret существовал; контракт ключа расходился со ссылкой Pod.
stages.0.brief: |
  Потребитель должен получать маршрут через требуемую ссылку на Secret.
stages.0.objectives.0.text: Deployment `reader` завершает rollout.
stages.0.objectives.1.text: Pod reader записывает `north` в `/tmp/route`.
stages.0.objectives.2.text: Deployment `reader` получает `ROUTE` из ключа `route` Secret `station`, без
  встраивания значения.
hints.0.text: Посмотрите события Pod о недостающем ключе.
hints.1.text: |
  Имя Secret и ключ данных независимы. Ключ переименован: station.yaml содержит route, но reader.yaml всё ещё запрашивает route_name. Сохраните reader/worker и не меняйте Secret.
hints.2.text: Исправьте secretKeyRef.key и дождитесь нового ReplicaSet.
phrases.0: Я согласовал ключ Secret со ссылкой контейнера.
phrases.1: Я проверил смонтированное значение в работающей нагрузке.
phrases.2: Я проверил ссылку окружения, не печатая учётные данные.
questions.0.points.0: Изучите waiting reason и события.
questions.0.points.1: Проверьте имя и ключ без вывода значений.
questions.0.points.2: Окружение получает значения при запуске Pod.
questions.0.prompt: Как отличить отсутствующий Secret от несовпадения ключа?
questions.1.points.0: Уберите значения из шаблонов нагрузки.
questions.1.points.1: Base64 не является шифрованием.
questions.1.points.2: Ограничьте RBAC и шифруйте хранение.
questions.1.prompt: Что защищает ссылка на Secret и какая ещё защита нужна?
