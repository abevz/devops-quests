title: Klucze Secret
brief: |
  Usługa odczytu trasy jest niedostępna.

  Pracuj na workstation w `~/quest` z plikami `station.yaml`, `reader.yaml`.

  **Wymagania:**
  - Dostępność obciążenia:
    - Deployment: `reader`.
    - Stan: Rollout zakończony.
  - Wynik wewnątrz kontenera `worker` Poda `app=reader`:
    - Plik: `/tmp/route`.
    - Treść: `north`.
  - Pierwszy wpis środowiska pierwszego kontenera Deployment `reader`:
    - Zmienna środowiskowa: `ROUTE`.
    - `secretKeyRef`: `{name: station, key: route}`.
    - Wartość jest pobierana przez referencję, a nie wpisana w obciążeniu.

  **Sprawdź przed Check & finish:**
  - `kubectl rollout status deployment/reader --timeout=3s` — kończy się kodem `0` i zgłasza zakończony rollout.
  - `kubectl get deployment reader -o json` — pokazuje `ROUTE` jako pierwszy wpis środowiska pierwszego kontenera z `secretKeyRef: {name: station, key: route}` bez wpisanej bezpośrednio wartości.
  - `kubectl exec deployment/reader -- cat /tmp/route` — wypisuje `north` z kontenera.
debrief: Istniał Secret; jego kluczowa umowa różniła się od referencji Pod.
stages.0.brief: |
  Odbiorca musi otrzymywać trasę przez wymaganą referencję Secret.
stages.0.objectives.0.text: Deployment `reader` kończy rollout.
stages.0.objectives.1.text: Pod reader zapisuje `north` w `/tmp/route`.
stages.0.objectives.2.text: Deployment `reader` pobiera `ROUTE` z klucza `route` Secretu `station`, bez
  wpisywania wartości na stałe.
hints.0.text: Sprawdź zdarzenia Pod pod kątem brakującego klucza.
hints.1.text: |
  Nazwa Secret i klucz danych są niezależne. Nazwa klucza została zmieniona: station.yaml zawiera route, ale reader.yaml nadal żąda route_name. Zachowaj reader/worker i nie zmieniaj Secret.
hints.2.text: Zmień secretKeyRef.key i poczekaj na nowy ReplicaSet.
phrases.0: Dopasowałem klucz Secret do odniesienia do kontenera.
phrases.1: Sprawdziłem zamontowaną wartość w bieżącym obciążeniu.
phrases.2: Sprawdziłem odwołanie do środowiska bez drukowania poświadczeń.
questions.0.points.0: Sprawdź waiting reason i zdarzenia.
questions.0.points.1: Sprawdź nazwę i klucz bez drukowania wartości.
questions.0.points.2: Wartości środowiska są zużywane podczas uruchamiania Pod.
questions.0.prompt: Jak odróżnić brak Secret od niedopasowania klucza?
questions.1.points.0: Unikaj wartości w szablonach obciążeń.
questions.1.points.1: Base64 nie szyfruje.
questions.1.points.2: Użyj ograniczonego RBAC i szyfrowania w stanie spoczynku.
questions.1.prompt: Co chroni referencja Secret i co jeszcze jest wymagane?
