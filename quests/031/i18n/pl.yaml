title: Klucze Secret
brief: 'Nie można uruchomić Reader po zmianie nazwy klucza Secret. station.json zawiera wartość tylko
  dla gry pod route; reader.json nadal żąda route_name. Napraw odniesienie bez osadzania wartości lub
  zmiany Secret. Zachowaj reader/worker.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `station.json`, `reader.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: Reader jest dostępny, /tmp/route zawiera north, a środowisko ma odniesienia
  do station/route.'
debrief: Istniał Secret; jego kluczowa umowa różniła się od referencji Pod.
stages.0.brief: 'Kryteria sukcesu: Reader jest dostępny, /tmp/route zawiera north, a odniesienia do środowiska
  station/route.'
stages.0.objectives.0.text: Reader jest dostępny, /tmp/route zawiera north, a środowisko ma odniesienia
  do station/route.
hints.0.text: Sprawdź zdarzenia Pod pod kątem brakującego klucza.
hints.1.text: Nazwa Secret i klucz danych są niezależne.
hints.2.text: Zmień secretKeyRef.key i poczekaj na nowy ReplicaSet.
phrases.0: Dopasowałem klucz Secret do odniesienia do kontenera.
phrases.1: Sprawdziłem zamontowaną wartość w bieżącym obciążeniu.
phrases.2: Sprawdziłem odwołanie do środowiska bez drukowania poświadczeń.
questions.0.points.0: Sprawdź waiting reason i zdarzenia.
questions.0.points.1: Sprawdź nazwę i klucz bez drukowania wartości.
questions.0.points.2: Wartości środowiska są zużywane podczas uruchamiania Pod.
questions.0.prompt: Jak odróżnić brak Secret od niedopasowania klucza?
questions.1.points.0: Unikaj wartości w szablonach obciążeń.
questions.1.points.1: Base64 nie szyfruje.
questions.1.points.2: Użyj ograniczonego RBAC i szyfrowania w stanie spoczynku.
questions.1.prompt: Co chroni referencja Secret i co jeszcze jest wymagane?
