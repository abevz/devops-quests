title: Teclas Secret
brief: 'Reader no puede iniciarse después de cambiar el nombre de una clave Secret. station.json contiene
  el valor de solo juego en route; reader.json aún solicita route_name. Reparar la referencia sin incrustar
  el valor ni cambiar el Secret. Mantener reader/worker.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `station.json`, `reader.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.'
debrief: El Secret existía; su contrato clave difería de la referencia Pod.
stages.0.brief: Cambie sólo esta bahía.
stages.0.objectives.0.text: El Deployment `reader` completa su rollout.
stages.0.objectives.1.text: El Pod reader escribe `north` en `/tmp/route`.
stages.0.objectives.2.text: El Deployment `reader` obtiene `ROUTE` de la clave `route` del Secret `station`,
  sin incrustar el valor.
hints.0.text: Inspeccione los eventos Pod en busca de una clave faltante.
hints.1.text: El nombre Secret y la clave de datos son independientes.
hints.2.text: Cambie secretKeyRef.key y espere el nuevo ReplicaSet.
phrases.0: Alineé la clave Secret con la referencia del contenedor.
phrases.1: Verifiqué el valor montado dentro de la carga de trabajo en ejecución.
phrases.2: Verifiqué la referencia del entorno sin imprimir las credenciales.
questions.0.points.0: Inspeccione waiting reason y eventos.
questions.0.points.1: Consultar nombre y clave sin imprimir valores.
questions.0.points.2: Los valores del entorno se consumen en el inicio de Pod.
questions.0.prompt: ¿Cómo se distingue un Secret ausente de una clave que no coincide?
questions.1.points.0: Evite valores en las plantillas de carga de trabajo.
questions.1.points.1: Base64 no es cifrado.
questions.1.points.2: Utilice RBAC limitado y cifrado en reposo.
questions.1.prompt: ¿Qué protege una referencia Secret y qué más se requiere?
