title: Secret keys
brief: |
  The route consumer is unavailable.

  Work on the workstation in `~/quest` with `station.yaml`, `reader.yaml`.

  **Requirements:**
  - Workload availability:
    - Deployment: `reader`.
    - Status: Rollout completes.
  - Output inside container `worker` of Pod `app=reader`:
    - File: `/tmp/route`.
    - Content: `north`.
  - First environment entry of the first container in Deployment `reader`:
    - Environment variable: `ROUTE`.
    - `secretKeyRef`: `{name: station, key: route}`.
    - The value is referenced, not embedded in the workload.

  **Verify yourself before Check & finish:**
  - `kubectl rollout status deployment/reader --timeout=3s` — exits `0` and reports a completed rollout.
  - `kubectl get deployment reader -o json` — shows `ROUTE` as the first environment entry of the first container, with `secretKeyRef: {name: station, key: route}` and no embedded value.
  - `kubectl exec deployment/reader -- cat /tmp/route` — prints `north` from inside the container.
debrief: The Secret existed; its key contract differed from the Pod reference.
stages.0.brief: |
  The consumer must obtain its route through the required Secret reference.
stages.0.objectives.0.text: Deployment `reader` completes its rollout.
stages.0.objectives.1.text: The reader Pod writes `north` to `/tmp/route`.
stages.0.objectives.2.text: Deployment `reader` gets `ROUTE` from Secret `station`, key `route`, without
  embedding the value.
hints.0.text: Inspect the Pod events for a missing key.
hints.1.text: |
  Secret name and data key are independent. The key was renamed: station.yaml provides route, but reader.yaml still requests route_name. Keep reader/worker and do not change the Secret.
hints.2.text: Change secretKeyRef.key and wait for the new ReplicaSet.
phrases.0: I aligned the Secret key with the container reference.
phrases.1: I checked the mounted value inside the running workload.
phrases.2: I verified the environment reference without printing credentials.
questions.0.points.0: Inspect waiting reason and events.
questions.0.points.1: Check name and key without printing values.
questions.0.points.2: Environment values are consumed at Pod startup.
questions.0.prompt: How do you distinguish an absent Secret from a key mismatch?
questions.1.points.0: Avoid values in workload templates.
questions.1.points.1: Base64 is not encryption.
questions.1.points.2: Use bounded RBAC and encryption at rest.
questions.1.prompt: What does a Secret reference protect, and what else is required?
