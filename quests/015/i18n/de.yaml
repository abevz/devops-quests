title: Schleifen
brief: "Der Flotte fehlen die erforderlichen Routenverzeichnisse.\n\nArbeiten Sie auf der Workstation in `~/quest`\
  \ mit `inventory.ini`, `ansible.cfg`, `routes.yml`, `rollout.yml`.\n\n**Anforderungen:**\n- Jeder verwaltete\
  \ Host (`app1`, `app2`, `app3`) hat diese Verzeichnisse:\n  - `/srv/routes/north`, `/srv/routes/south`, `/srv/routes/east`.\n\
  - Jedes dieser Verzeichnisse hat den Zugriffsmodus `0750`.\n"
debrief: Die Schleife wählte bereits die gewünschten Daten aus. Durch die Korrektur des Dateisystemstatus wurden
  durch den wiederholten Vorgang konsistent Verzeichnisse in der Flotte erstellt.
stages.0.brief: Jeder verwaltete Host muss jedes erforderliche Routenverzeichnis bereitstellen.
stages.0.objectives.0.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) sind `/srv/routes/north`, `/srv/routes/south`
  und `/srv/routes/east` Verzeichnisse mit Modus `0750`.
hints.0.text: Ein Verzeichnis und eine reguläre Datei haben unterschiedliche Aufgaben im Dateisystem.
hints.1.text: 'Überprüfen Sie den Dateimodulstatus und den Typ jedes angeforderten Pfads.


  Das Schleifenelement ist ein route-Name, kein Hostname.


  Prüfen Sie die mitgelieferten Eingaben und den Ausführungsumfang:


  ```sh

  cat routes.yml rollout.yml

  ```'
hints.2.text: 'Trennen Sie die Datenliste von der wiederholten Aufgabe.


  Prüfen Sie das beobachtete Ergebnis:


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''ls -ld /srv/routes/north /srv/routes/south
  /srv/routes/east''` — zeigt drei Verzeichnisse pro verwaltetem Host mit Berechtigungen `drwxr-x---`.


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''find /srv/routes -maxdepth 1 -mindepth
  1 -type d''` — enthält /srv/routes/north, /srv/routes/south und /srv/routes/east auf jedem Host.'
phrases.0: Ich habe die route-Liste als Daten dargestellt.
phrases.1: Ich habe eine Schleife verwendet, um jedes erforderliche Verzeichnis auf jedem Host zu erstellen.
phrases.2: Ich habe das vollständige Host-by-Route-Ergebnis überprüft.
