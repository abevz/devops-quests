title: Schleifen
brief: |-
  Der Flotte fehlen die erforderlichen Routenverzeichnisse.

  Arbeiten Sie auf der Workstation in `~/quest` mit `inventory.ini`, `ansible.cfg`, `routes.yml`, `rollout.yml`.

  **Anforderungen:**
  - Ein Lauf von `rollout.yml` für `fleet` stellt für jede aktuell in `routes.yml` aufgeführte Route ein Verzeichnis auf jedem verwalteten Host (`app1`, `app2`, `app3`) bereit.
  - Die anfänglichen Routen sind `north`, `south` und `east`, entsprechend `/srv/routes/north`, `/srv/routes/south` und `/srv/routes/east`.
  - Jedes Routenverzeichnis hat Modus `0750`.
  - Wenn `routes.yml` eine weitere Route erhält, erstellt ein erneuter Lauf desselben Playbooks deren Verzeichnis mit Modus `0750` auf jedem Host, ohne `rollout.yml` zu bearbeiten.
debrief: |-
  Die Task iteriert über die Routendaten. Dasselbe Playbook verarbeitet eine erweiterte Liste in routes.yml und erstellt die entsprechenden Verzeichnisse auf jedem Host.
stages.0.brief: Jeder verwaltete Host muss jedes erforderliche Routenverzeichnis bereitstellen.
stages.0.objectives.0.text: |-
  Auf jedem verwalteten Host (`app1`, `app2`, `app3`) hat jede aktuell in der Workstation-Datei `routes.yml` aufgeführte Route ein Verzeichnis unter `/srv/routes` mit Modus `0750`.
hints.0.text: |-
  Iteration wendet eine Task auf jedes Element einer Datenliste an. Ein Routenelement ist vom durch das Play ausgewählten Host getrennt.
hints.1.text: |-
  Vergleichen Sie die Liste in `routes.yml` mit der Task in `rollout.yml`. Prüfen Sie, wie `/srv/routes/{{ item }}` für jede Route einen Wert erhält.

  ```sh
  cat routes.yml rollout.yml
  ```
hints.2.text: |-
  Verwenden Sie `loop: '{{ routes }}'` an der Verzeichnis-Task; `item` ist der aktuelle Routenname. Behalten Sie `state: directory` und `mode: '0750'` bei.

  ```sh
  ansible-playbook rollout.yml
  ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -ld /srv/routes/north /srv/routes/south /srv/routes/east'
  ```

  Jeder Host zeigt drei Verzeichnisse mit Rechten `drwxr-x---`. Fügen Sie zur Prüfung der Anpassung `west` zu `routes.yml` hinzu und starten Sie dasselbe Playbook erneut; `/srv/routes/west` muss ebenfalls auf jedem Host ein Verzeichnis mit Modus `0750` sein.

  ```sh
  ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -ld /srv/routes/west'
  ```
phrases.0: Ich habe die route-Liste als Daten dargestellt.
phrases.1: Ich habe eine Schleife verwendet, um jedes erforderliche Verzeichnis auf jedem Host zu erstellen.
phrases.2: Ich habe das vollständige Host-by-Route-Ergebnis überprüft.
