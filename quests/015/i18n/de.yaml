diagnostics.probe_0_0: |-
  Ein fehlender Python-Interpreter oder ein fehlendes YAML-Modul kann die Prüfung vor der Ausgabe einer Route oder eines Hosts abbrechen. [Leitfaden](guides#guide=ansible-4&section=route-directory-loop)
