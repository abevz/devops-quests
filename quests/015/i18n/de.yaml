title: Schleifen
brief: 'Drei station-Ziele benötigen ein Verzeichnis für jedes route, das in routes.yml aufgeführt ist.
  rollout.yml durchläuft diese Liste, fordert jedoch das falsche Dateisystemobjekt an. Stellen Sie die
  Verzeichnisse north, south und east unter /srv/routes auf jedem Ziel mit Modus 0750 wieder her.


  Questdateien in `~/quest` (einige erscheinen in späteren Phasen): `inventory.ini`, `ansible.cfg`, `routes.yml`,
  `rollout.yml`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: Jedes Ziel verfügt über die drei route-Verzeichnisse mit dem Modus 0750.'
debrief: Die Schleife wählte bereits die gewünschten Daten aus. Durch die Korrektur des Dateisystemstatus
  wurden durch den wiederholten Vorgang konsistent Verzeichnisse in der Flotte erstellt.
stages.0.brief: 'Als Daten verwenden Sie die mitgelieferte route-Liste; Jedes Ziel benötigt jedes route-Verzeichnis.


  Erfolgskriterium: Jedes Ziel verfügt über die drei route-Verzeichnisse mit Modus 0750.'
stages.0.objectives.0.text: Jedes Ziel verfügt über die drei route-Verzeichnisse mit dem Modus 0750.
hints.0.text: Überprüfen Sie den Dateimodulstatus und den Typ jedes angeforderten Pfads.
hints.1.text: Das Schleifenelement ist ein route-Name, kein Hostname.
hints.2.text: Trennen Sie die Datenliste von der wiederholten Aufgabe.
phrases.0: Ich habe die route-Liste als Daten dargestellt.
phrases.1: Ich habe eine Schleife verwendet, um jedes erforderliche Verzeichnis auf jedem Host zu erstellen.
phrases.2: Ich habe das vollständige Host-by-Route-Ergebnis überprüft.
