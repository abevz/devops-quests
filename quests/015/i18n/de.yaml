title: Schleifen
brief: |-
  Der Flotte fehlen die erforderlichen Routenverzeichnisse.

  Arbeiten Sie auf der Workstation in `~/quest` mit `inventory.ini`, `ansible.cfg`, `routes.yml`, `rollout.yml`.

  **Anforderungen:**
  - Host `app1`:
    - Auf app1 ist /srv/routes/north ein Verzeichnis mit Modus 0750.
    - Auf app1 ist /srv/routes/south ein Verzeichnis mit Modus 0750.
    - Auf app1 ist /srv/routes/east ein Verzeichnis mit Modus 0750.
  - Host `app2`:
    - Auf app2 ist /srv/routes/north ein Verzeichnis mit Modus 0750.
    - Auf app2 ist /srv/routes/south ein Verzeichnis mit Modus 0750.
    - Auf app2 ist /srv/routes/east ein Verzeichnis mit Modus 0750.
  - Host `app3`:
    - Auf app3 ist /srv/routes/north ein Verzeichnis mit Modus 0750.
    - Auf app3 ist /srv/routes/south ein Verzeichnis mit Modus 0750.
    - Auf app3 ist /srv/routes/east ein Verzeichnis mit Modus 0750.

  **Selbstprüfung vor Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -ld /srv/routes/north /srv/routes/south /srv/routes/east'` — zeigt drei Verzeichnisse pro verwaltetem Host mit Berechtigungen `drwxr-x---`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'find /srv/routes -maxdepth 1 -mindepth 1 -type d'` — enthält /srv/routes/north, /srv/routes/south und /srv/routes/east auf jedem Host.
debrief: Die Schleife wählte bereits die gewünschten Daten aus. Durch die Korrektur des Dateisystemstatus wurden
  durch den wiederholten Vorgang konsistent Verzeichnisse in der Flotte erstellt.
