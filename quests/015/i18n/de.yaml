diagnostics.routes: |-
  Bei unlesbarem routes.yml, einer leeren Liste, doppelten Einträgen oder einem ungültigen Routennamen kann die Prüfung keine Verzeichnispfade bilden. [Leitfaden](guides#guide=ansible-4&section=route-directory-loop)
diagnostics.routes_1: |-
  Das Play kann eine Route übersprungen oder auf app1 einen anderen Modus gesetzt haben. Prüfen Sie bei ausbleibenden Ergebnissen die Erreichbarkeit vom Arbeitsplatz. [Leitfaden](guides#guide=ansible-4&section=route-directory-loop)
