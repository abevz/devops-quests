title: Bucles
brief: |-
  La flota carece de los directorios de rutas requeridos.

  Trabaje en la workstation, en `~/quest`, con `inventory.ini`, `ansible.cfg`, `routes.yml`, `rollout.yml`.

  **Requisitos:**
  - Ejecutar `rollout.yml` para `fleet` debe proporcionar un directorio por cada ruta actual de `routes.yml` en cada host administrado (`app1`, `app2`, `app3`).
  - Las rutas iniciales son `north`, `south` y `east`, correspondientes a `/srv/routes/north`, `/srv/routes/south` y `/srv/routes/east`.
  - Cada directorio de ruta tiene modo `0750`.
  - Si se añade otra ruta a `routes.yml`, ejecutar de nuevo el mismo playbook crea su directorio con modo `0750` en cada host, sin editar `rollout.yml`.
debrief: |-
  La tarea itera sobre los datos de rutas. El mismo playbook procesa una lista routes.yml ampliada y crea los directorios correspondientes en cada host.
stages.0.brief: Cada host administrado debe tener cada directorio de ruta requerido.
stages.0.objectives.0.text: |-
  En cada host administrado (`app1`, `app2`, `app3`), cada ruta actual del archivo `routes.yml` de la workstation tiene un directorio bajo `/srv/routes` con modo `0750`.
hints.0.text: |-
  La iteración aplica una tarea a cada elemento de una lista de datos. Un elemento de ruta es distinto del host seleccionado por el play.
hints.1.text: |-
  Compare la lista de `routes.yml` con la tarea de `rollout.yml`. Inspeccione cómo `/srv/routes/{{ item }}` recibe un valor para cada ruta.

  ```sh
  cat routes.yml rollout.yml
  ```
hints.2.text: |-
  Use `loop: '{{ routes }}'` en la tarea de directorios; `item` es el nombre de la ruta actual. Conserve `state: directory` y `mode: '0750'`.

  ```sh
  ansible-playbook rollout.yml
  ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -ld /srv/routes/north /srv/routes/south /srv/routes/east'
  ```

  Cada host muestra tres directorios con permisos `drwxr-x---`. Para comprobar la adaptación, añada `west` a `routes.yml` y ejecute de nuevo el mismo playbook; `/srv/routes/west` también debe ser un directorio con modo `0750` en cada host.

  ```sh
  ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -ld /srv/routes/west'
  ```
phrases.0: Representé la lista route como datos.
phrases.1: Utilicé un bucle para crear todos los directorios necesarios en cada host.
phrases.2: Verifiqué el resultado completo de host por ruta.
