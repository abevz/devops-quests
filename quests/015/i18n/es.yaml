title: Bucles
brief: 'Tres objetivos station necesitan un directorio para cada route enumerado en routes.yml. rollout.yml
  recorre esa lista pero solicita el objeto del sistema de archivos incorrecto. Restaure los directorios
  north, south y east en /srv/routes en cada destino, con el modo 0750.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `inventory.ini`, `ansible.cfg`,
  `routes.yml`, `rollout.yml`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: cada objetivo tiene los tres directorios route con modo 0750.'
debrief: El bucle ya estaba seleccionando los datos deseados. La corrección del estado del sistema de
  archivos hizo que la operación repetida creara directorios de manera consistente en la flota.
stages.0.brief: 'Utilice la lista route suministrada como datos; cada objetivo necesita cada directorio
  route.


  Criterios de éxito: cada objetivo tiene los tres directorios route con modo 0750.'
stages.0.objectives.0.text: Cada objetivo tiene los tres directorios route con modo 0750.
hints.0.text: Inspeccione el estado del módulo de archivo y el tipo de cada ruta solicitada.
hints.1.text: El elemento del bucle es un nombre route, no un nombre de host.
hints.2.text: Separe la lista de datos de la tarea repetida.
phrases.0: Representé la lista route como datos.
phrases.1: Utilicé un bucle para crear todos los directorios necesarios en cada host.
phrases.2: Verifiqué el resultado completo de host por ruta.
