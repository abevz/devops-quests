title: Bucles
brief: |-
  La flota carece de los directorios de ruta requeridos.

  Trabaja en la workstation en `~/quest` con `inventory.ini`, `ansible.cfg`, `routes.yml`, `rollout.yml`.

  **Requisitos:**
  - Directorios en cada host administrado (`app1`, `app2`, `app3`):
    - Rutas requeridas: `/srv/routes/north`, `/srv/routes/south`, `/srv/routes/east`.
    - Modo de acceso: `0750`.

  **Verifica antes de Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -ld /srv/routes/north /srv/routes/south /srv/routes/east'` — muestra tres directorios por host administrado con permisos `drwxr-x---`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'find /srv/routes -maxdepth 1 -mindepth 1 -type d'` — incluye /srv/routes/north, /srv/routes/south y /srv/routes/east en cada host.
debrief: El bucle ya estaba seleccionando los datos deseados. La corrección del estado del sistema de archivos hizo
  que la operación repetida creara directorios de manera consistente en la flota.
stages.0.brief: Cada host administrado debe tener cada directorio de ruta requerido.
stages.0.objectives.0.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/routes/north`, `/srv/routes/south`
  y `/srv/routes/east` son directorios con modo `0750`.
hints.0.text: Inspeccione el estado del módulo de archivo y el tipo de cada ruta solicitada.
hints.1.text: El elemento del bucle es un nombre route, no un nombre de host.
hints.2.text: Separe la lista de datos de la tarea repetida.
phrases.0: Representé la lista route como datos.
phrases.1: Utilicé un bucle para crear todos los directorios necesarios en cada host.
phrases.2: Verifiqué el resultado completo de host por ruta.
