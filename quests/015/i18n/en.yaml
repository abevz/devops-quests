title: Loops
brief: |-
  The fleet lacks the required route directories.

  Work on the workstation in `~/quest` with `inventory.ini`, `ansible.cfg`, `routes.yml`, `rollout.yml`.

  **Requirements:**
  - Run `rollout.yml` against `fleet` to provide a directory for every route currently listed in `routes.yml` on each managed host (`app1`, `app2`, `app3`).
  - The initial routes are `north`, `south` and `east`, corresponding to `/srv/routes/north`, `/srv/routes/south` and `/srv/routes/east`.
  - Every route directory has mode `0750`.
  - If `routes.yml` gains another route, rerunning the same playbook creates its directory with mode `0750` on every host, without editing `rollout.yml`.
debrief: |-
  The task iterates over the route data. The same playbook handles an extended routes.yml list and creates the corresponding directories on every host.
stages.0.brief: Every managed host must provide every required route directory.
stages.0.objectives.0.text: |-
  On every managed host (`app1`, `app2`, `app3`), every route currently listed in workstation `routes.yml` has a directory under `/srv/routes` with mode `0750`.
hints.0.text: |-
  Iteration applies one task to every element of a data list. A route item is separate from the host selected by the play.
hints.1.text: |-
  Compare the list in `routes.yml` with the task in `rollout.yml`. Inspect how `/srv/routes/{{ item }}` receives a value for each route.

  ```sh
  cat routes.yml rollout.yml
  ```
hints.2.text: |-
  Use `loop: '{{ routes }}'` on the directory task; `item` is the current route name. Keep `state: directory` and `mode: '0750'`.

  ```sh
  ansible-playbook rollout.yml
  ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -ld /srv/routes/north /srv/routes/south /srv/routes/east'
  ```

  Each host shows three directories with permissions `drwxr-x---`. To verify adaptation, add `west` to `routes.yml` and rerun the same playbook; `/srv/routes/west` must also be a directory with mode `0750` on every host.

  ```sh
  ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -ld /srv/routes/west'
  ```
phrases.0: I represented the route list as data.
phrases.1: I used one loop to create every required directory on each host.
phrases.2: I checked the full host-by-route result.
