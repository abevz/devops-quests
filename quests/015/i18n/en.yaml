title: Loops
brief: |-
  The fleet lacks the required route directories.

  Work on the workstation in `~/quest` with `inventory.ini`, `ansible.cfg`, `routes.yml`, `rollout.yml`.

  **Requirements:**
  - Directories on every managed host (`app1`, `app2`, `app3`):
    - Required paths: `/srv/routes/north`, `/srv/routes/south`, `/srv/routes/east`.
    - Access mode: `0750`.

  **Verify yourself before Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -ld /srv/routes/north /srv/routes/south /srv/routes/east'` — shows three directories per managed host with permissions `drwxr-x---`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'find /srv/routes -maxdepth 1 -mindepth 1 -type d'` — includes /srv/routes/north, /srv/routes/south and /srv/routes/east on every host.
debrief: The loop was already selecting the intended data. Correcting the filesystem state made the repeated operation
  create directories consistently on the fleet.
stages.0.brief: Every managed host must provide every required route directory.
stages.0.objectives.0.text: On every managed host (`app1`, `app2`, `app3`), `/srv/routes/north`, `/srv/routes/south`
  and `/srv/routes/east` are directories with mode `0750`.
hints.0.text: Inspect the file module state and the type of each requested path.
hints.1.text: The loop item is a route name, not a host name.
hints.2.text: Separate the data list from the repeated task.
phrases.0: I represented the route list as data.
phrases.1: I used one loop to create every required directory on each host.
phrases.2: I checked the full host-by-route result.
