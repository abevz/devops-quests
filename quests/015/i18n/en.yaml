title: Loops
brief: |-
  The fleet lacks the required route directories.

  Work on the workstation in `~/quest` with `inventory.ini`, `ansible.cfg`, `routes.yml`, `rollout.yml`.

  **Requirements:**
  - Host `app1`:
    - On app1, /srv/routes/north is a directory with mode 0750.
    - On app1, /srv/routes/south is a directory with mode 0750.
    - On app1, /srv/routes/east is a directory with mode 0750.
  - Host `app2`:
    - On app2, /srv/routes/north is a directory with mode 0750.
    - On app2, /srv/routes/south is a directory with mode 0750.
    - On app2, /srv/routes/east is a directory with mode 0750.
  - Host `app3`:
    - On app3, /srv/routes/north is a directory with mode 0750.
    - On app3, /srv/routes/south is a directory with mode 0750.
    - On app3, /srv/routes/east is a directory with mode 0750.

  **Verify yourself before Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -ld /srv/routes/north /srv/routes/south /srv/routes/east'` — shows three directories per managed host with permissions `drwxr-x---`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'find /srv/routes -maxdepth 1 -mindepth 1 -type d'` — includes /srv/routes/north, /srv/routes/south and /srv/routes/east on every host.
debrief: The loop was already selecting the intended data. Correcting the filesystem state made the repeated operation
  create directories consistently on the fleet.
