title: Loops
brief: 'Three station targets need a directory for each route listed in routes.yml. rollout.yml loops
  over that list but requests the wrong filesystem object. Restore directories north, south and east under
  /srv/routes on every target, with mode 0750.


  Quest files in `~/quest` (some appear in later stages): `inventory.ini`, `ansible.cfg`, `routes.yml`,
  `rollout.yml`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: Every target has the three route directories with mode 0750.'
debrief: The loop was already selecting the intended data. Correcting the filesystem state made the repeated
  operation create directories consistently on the fleet.
stages.0.brief: 'Use the supplied route list as data; every target needs every route directory.


  Success criteria: Every target has the three route directories with mode 0750.'
stages.0.objectives.0.text: Every target has the three route directories with mode 0750.
hints.0.text: Inspect the file module state and the type of each requested path.
hints.1.text: The loop item is a route name, not a host name.
hints.2.text: Separate the data list from the repeated task.
phrases.0: I represented the route list as data.
phrases.1: I used one loop to create every required directory on each host.
phrases.2: I checked the full host-by-route result.
