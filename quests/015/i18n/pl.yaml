title: Pętle
brief: "Na hostach brakuje wymaganych katalogów tras.\n\nPracuj na workstation w `~/quest` z plikami `inventory.ini`,\
  \ `ansible.cfg`, `routes.yml`, `rollout.yml`.\n\n**Wymagania:**\n- Na każdym zarządzanym hoście (`app1`,\
  \ `app2`, `app3`) istnieją katalogi:\n  - `/srv/routes/north`, `/srv/routes/south`, `/srv/routes/east`.\n\
  - Każdy z tych katalogów ma tryb dostępu `0750`.\n"
debrief: Pętla wybierała już zamierzone dane. Poprawianie systemu plików state spowodowało, że powtarzana operacja
  tworzyła katalogi w sposób spójny we flocie.
stages.0.brief: Każdy zarządzany host musi mieć każdy wymagany katalog trasy.
stages.0.objectives.0.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) ścieżki `/srv/routes/north`,
  `/srv/routes/south` i `/srv/routes/east` są katalogami z trybem `0750`.
hints.0.text: Katalog i zwykły plik pełnią różne role w systemie plików.
hints.1.text: 'Sprawdź moduł file state i typ każdej żądanej ścieżki.


  Element pętli to nazwa trasy, a nie nazwa hosta.


  Sprawdź dostarczone dane wejściowe i zakres wykonania:


  ```sh

  cat routes.yml rollout.yml

  ```'
hints.2.text: 'Oddziel listę danych od powtarzanego zadania.


  Sprawdź obserwowany wynik:


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''ls -ld /srv/routes/north /srv/routes/south
  /srv/routes/east''` — pokazuje trzy katalogi na każdym zarządzanym hoście z uprawnieniami `drwxr-x---`.


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''find /srv/routes -maxdepth 1 -mindepth
  1 -type d''` — zawiera /srv/routes/north, /srv/routes/south i /srv/routes/east na każdym hoście.'
phrases.0: Przedstawiłem listę tras jako dane.
phrases.1: Użyłem jednej pętli do utworzenia każdego wymaganego katalogu na każdym hoście.
phrases.2: Sprawdziłem pełny wynik hosta według trasy.
