title: Pętle
brief: |-
  Na hostach brakuje wymaganych katalogów tras.

  Pracuj na workstation w `~/quest` z plikami `inventory.ini`, `ansible.cfg`, `routes.yml`, `rollout.yml`.

  **Wymagania:**
  - Host `app1`:
    - Na app1 ścieżka /srv/routes/north jest katalogiem z trybem 0750.
    - Na app1 ścieżka /srv/routes/south jest katalogiem z trybem 0750.
    - Na app1 ścieżka /srv/routes/east jest katalogiem z trybem 0750.
  - Host `app2`:
    - Na app2 ścieżka /srv/routes/north jest katalogiem z trybem 0750.
    - Na app2 ścieżka /srv/routes/south jest katalogiem z trybem 0750.
    - Na app2 ścieżka /srv/routes/east jest katalogiem z trybem 0750.
  - Host `app3`:
    - Na app3 ścieżka /srv/routes/north jest katalogiem z trybem 0750.
    - Na app3 ścieżka /srv/routes/south jest katalogiem z trybem 0750.
    - Na app3 ścieżka /srv/routes/east jest katalogiem z trybem 0750.

  **Sprawdź przed Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -ld /srv/routes/north /srv/routes/south /srv/routes/east'` — pokazuje trzy katalogi na każdym zarządzanym hoście z uprawnieniami `drwxr-x---`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'find /srv/routes -maxdepth 1 -mindepth 1 -type d'` — zawiera /srv/routes/north, /srv/routes/south i /srv/routes/east na każdym hoście.
debrief: Pętla wybierała już zamierzone dane. Poprawianie systemu plików state spowodowało, że powtarzana operacja
  tworzyła katalogi w sposób spójny we flocie.
