title: Pętle
brief: |-
  We flocie brakuje wymaganych katalogów tras.

  Pracuj na workstation w `~/quest` z plikami `inventory.ini`, `ansible.cfg`, `routes.yml`, `rollout.yml`.

  **Wymagania:**
  - Uruchomienie `rollout.yml` dla `fleet` ma zapewnić katalog dla każdej aktualnej trasy z `routes.yml` na każdym zarządzanym hoście (`app1`, `app2`, `app3`).
  - Początkowe trasy to `north`, `south` i `east`, odpowiadające `/srv/routes/north`, `/srv/routes/south` i `/srv/routes/east`.
  - Każdy katalog trasy ma tryb `0750`.
  - Po dodaniu trasy do `routes.yml` ponowne uruchomienie tego samego playbooka tworzy jej katalog z trybem `0750` na każdym hoście, bez edytowania `rollout.yml`.
debrief: |-
  Zadanie iteruje po danych tras. Ten sam playbook obsługuje rozszerzoną listę routes.yml i tworzy odpowiednie katalogi na każdym hoście.
stages.0.brief: Każdy zarządzany host musi mieć każdy wymagany katalog trasy.
stages.0.objectives.0.text: |-
  Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) każda aktualna trasa z pliku `routes.yml` na workstation ma katalog pod `/srv/routes` z trybem `0750`.
hints.0.text: |-
  Iteracja stosuje jedno zadanie do każdego elementu listy danych. Element trasy jest czymś innym niż host wybrany przez play.
hints.1.text: |-
  Porównaj listę w `routes.yml` z zadaniem w `rollout.yml`. Sprawdź, jak `/srv/routes/{{ item }}` otrzymuje wartość dla każdej trasy.

  ```sh
  cat routes.yml rollout.yml
  ```
hints.2.text: |-
  Dodaj `loop: '{{ routes }}'` do zadania katalogów; `item` jest nazwą bieżącej trasy. Zachowaj `state: directory` i `mode: '0750'`.

  ```sh
  ansible-playbook rollout.yml
  ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -ld /srv/routes/north /srv/routes/south /srv/routes/east'
  ```

  Każdy host pokazuje trzy katalogi z uprawnieniami `drwxr-x---`. Aby sprawdzić dostosowanie, dodaj `west` do `routes.yml` i ponownie uruchom ten sam playbook; `/srv/routes/west` również musi być katalogiem z trybem `0750` na każdym hoście.

  ```sh
  ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -ld /srv/routes/west'
  ```
phrases.0: Przedstawiłem listę tras jako dane.
phrases.1: Użyłem jednej pętli do utworzenia każdego wymaganego katalogu na każdym hoście.
phrases.2: Sprawdziłem pełny wynik hosta według trasy.
