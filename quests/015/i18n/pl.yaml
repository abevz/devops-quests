title: Pętle
brief: 'Trzy station docelowe potrzebują katalogu dla każdej trasy wymienionej w pętli routes.yml. rollout.yml
  nad tą listą, ale żądają nieprawidłowego obiektu systemu plików. Przywróć katalogi north, south i east
  pod /srv/routes na każdym celu, używając mode 0750.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `inventory.ini`, `ansible.cfg`,
  `routes.yml`, `rollout.yml`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: każdy cel ma trzy katalogi tras z mode 0750.'
debrief: Pętla wybierała już zamierzone dane. Poprawianie systemu plików state spowodowało, że powtarzana
  operacja tworzyła katalogi w sposób spójny we flocie.
stages.0.brief: 'Użyj dostarczonej listy tras jako danych; każdy cel potrzebuje każdego katalogu tras.


  Kryteria sukcesu: Każdy cel ma trzy katalogi tras z mode 0750.'
stages.0.objectives.0.text: Każdy cel ma trzy katalogi tras o numerze mode 0750.
hints.0.text: Sprawdź moduł file state i typ każdej żądanej ścieżki.
hints.1.text: Element pętli to nazwa trasy, a nie nazwa hosta.
hints.2.text: Oddziel listę danych od powtarzanego zadania.
phrases.0: Przedstawiłem listę tras jako dane.
phrases.1: Użyłem jednej pętli do utworzenia każdego wymaganego katalogu na każdym hoście.
phrases.2: Sprawdziłem pełny wynik hosta według trasy.
