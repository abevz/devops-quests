diagnostics.routes: |-
  Sprawdzenie nie ustali ścieżek, gdy routes.yml jest nieczytelny, lista jest pusta lub zawiera duplikat albo niedozwoloną nazwę. [Przewodnik](guides#guide=ansible-4&section=route-directory-loop)
diagnostics.routes_1: |-
  Play mógł pominąć trasę lub ustawić inny tryb na app1. Przy braku wyników sprawdź dostęp do hosta ze stacji roboczej. [Przewodnik](guides#guide=ansible-4&section=route-directory-loop)
