title: Циклы
brief: 'Трём целям нужны каталоги маршрутов из routes.yml. rollout.yml обходит список, но запрашивает
  неверный тип объекта. Восстановите каталоги north, south и east в /srv/routes на всех целях с mode 0750.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `inventory.ini`, `ansible.cfg`, `routes.yml`,
  `rollout.yml`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: На каждой цели есть три каталога маршрутов с mode 0750.'
debrief: Цикл уже выбирал нужные данные. Исправление state обеспечило одинаковое создание каталогов на
  всём парке.
stages.0.brief: 'Используйте выданный список как данные: каждой цели нужны все каталоги.


  Результат проверки: На каждой цели есть три каталога маршрутов с mode 0750.'
stages.0.objectives.0.text: На каждой цели есть три каталога маршрутов с mode 0750.
hints.0.text: Проверьте state модуля file и тип каждого пути.
hints.1.text: Item в цикле — имя маршрута, а не хоста.
hints.2.text: Отделите список данных от повторяемой задачи.
phrases.0: Я представил список маршрутов как данные.
phrases.1: Я одним циклом создал все нужные каталоги на каждом узле.
phrases.2: Я проверил результат для каждой пары узел — маршрут.
