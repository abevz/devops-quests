title: Циклы
brief: "На хостах отсутствуют нужные каталоги маршрутов.\n\nРаботайте на workstation в `~/quest` с файлами\
  \ `inventory.ini`, `ansible.cfg`, `routes.yml`, `rollout.yml`.\n\n**Требования:**\n- На каждом управляемом\
  \ хосте (`app1`, `app2`, `app3`) существуют каталоги:\n  - `/srv/routes/north`, `/srv/routes/south`, `/srv/routes/east`.\n\
  - Каждый из этих каталогов имеет права доступа `0750`.\n"
debrief: Цикл уже выбирал нужные данные. Исправление state обеспечило одинаковое создание каталогов на всём
  парке.
stages.0.brief: Каждый управляемый хост должен иметь каждый нужный каталог маршрута.
stages.0.objectives.0.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) пути `/srv/routes/north`,
  `/srv/routes/south` и `/srv/routes/east` являются каталогами с режимом `0750`.
hints.0.text: Каталог и обычный файл выполняют разные роли в файловой системе.
hints.1.text: 'Проверьте state модуля file и тип каждого пути.


  Item в цикле — имя маршрута, а не хоста.


  Изучите поставленные входные данные и область выполнения:


  ```sh

  cat routes.yml rollout.yml

  ```'
hints.2.text: 'Отделите список данных от повторяемой задачи.


  Проверьте наблюдаемый результат:


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''ls -ld /srv/routes/north /srv/routes/south
  /srv/routes/east''` — показывает три каталога на каждом управляемом хосте с правами `drwxr-x---`.


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''find /srv/routes -maxdepth 1 -mindepth
  1 -type d''` — включает /srv/routes/north, /srv/routes/south и /srv/routes/east на каждом хосте.'
phrases.0: Я представил список маршрутов как данные.
phrases.1: Я одним циклом создал все нужные каталоги на каждом узле.
phrases.2: Я проверил результат для каждой пары узел — маршрут.
