title: Циклы
brief: |-
  На хостах отсутствуют нужные каталоги маршрутов.

  Работайте на workstation в `~/quest` с файлами `inventory.ini`, `ansible.cfg`, `routes.yml`, `rollout.yml`.

  **Требования:**
  - Хост `app1`:
    - На app1 путь /srv/routes/north является каталогом с режимом 0750.
    - На app1 путь /srv/routes/south является каталогом с режимом 0750.
    - На app1 путь /srv/routes/east является каталогом с режимом 0750.
  - Хост `app2`:
    - На app2 путь /srv/routes/north является каталогом с режимом 0750.
    - На app2 путь /srv/routes/south является каталогом с режимом 0750.
    - На app2 путь /srv/routes/east является каталогом с режимом 0750.
  - Хост `app3`:
    - На app3 путь /srv/routes/north является каталогом с режимом 0750.
    - На app3 путь /srv/routes/south является каталогом с режимом 0750.
    - На app3 путь /srv/routes/east является каталогом с режимом 0750.

  **Самопроверка перед Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -ld /srv/routes/north /srv/routes/south /srv/routes/east'` — показывает три каталога на каждом управляемом хосте с правами `drwxr-x---`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'find /srv/routes -maxdepth 1 -mindepth 1 -type d'` — включает /srv/routes/north, /srv/routes/south и /srv/routes/east на каждом хосте.
debrief: Цикл уже выбирал нужные данные. Исправление state обеспечило одинаковое создание каталогов на всём парке.
