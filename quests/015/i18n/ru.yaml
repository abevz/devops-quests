diagnostics.routes: |-
  Проверка не может собрать пути каталогов, если routes.yml не читается, список пуст, содержит дубликаты или неверное имя. [Гайд](guides#guide=ansible-4&section=route-directory-loop)
diagnostics.routes_1: |-
  На app1 play мог пропустить маршрут или задать другой режим. Если хост не вернул результатов, проверьте доступ к нему с рабочей станции. [Гайд](guides#guide=ansible-4&section=route-directory-loop)
