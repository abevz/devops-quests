title: Циклы
brief: |-
  На узлах отсутствуют требуемые каталоги маршрутов.

  Работайте на workstation в `~/quest` с файлами `inventory.ini`, `ansible.cfg`, `routes.yml`, `rollout.yml`.

  **Требования:**
  - Запуск `rollout.yml` для `fleet` должен создавать каталог для каждого текущего маршрута из `routes.yml` на каждом управляемом узле (`app1`, `app2`, `app3`).
  - Начальные маршруты — `north`, `south` и `east`; им соответствуют `/srv/routes/north`, `/srv/routes/south` и `/srv/routes/east`.
  - Права каждого каталога маршрута — `0750`.
  - При добавлении маршрута в `routes.yml` повторный запуск того же playbook создаёт его каталог с правами `0750` на каждом узле без редактирования `rollout.yml`.
debrief: |-
  Задача перебирает данные маршрутов. Тот же playbook обрабатывает расширенный список routes.yml и создаёт соответствующие каталоги на каждом узле.
stages.0.brief: Каждый управляемый хост должен иметь каждый нужный каталог маршрута.
stages.0.objectives.0.text: |-
  На каждом управляемом узле (`app1`, `app2`, `app3`) для каждого текущего маршрута из `routes.yml` на workstation существует каталог в `/srv/routes` с правами `0750`.
hints.0.text: |-
  Итерация применяет одну задачу к каждому элементу списка данных. Элемент маршрута не связан с выбором узла в play.
hints.1.text: |-
  Сопоставьте список в `routes.yml` с задачей в `rollout.yml`. Изучите, как `/srv/routes/{{ item }}` получает значение для каждого маршрута.

  ```sh
  cat routes.yml rollout.yml
  ```
hints.2.text: |-
  Добавьте `loop: '{{ routes }}'` к задаче создания каталогов; `item` — имя текущего маршрута. Сохраните `state: directory` и `mode: '0750'`.

  ```sh
  ansible-playbook rollout.yml
  ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -ld /srv/routes/north /srv/routes/south /srv/routes/east'
  ```

  На каждом узле видны три каталога с правами `drwxr-x---`. Для проверки адаптации добавьте `west` в `routes.yml` и снова выполните тот же playbook: `/srv/routes/west` тоже должен стать каталогом с правами `0750` на каждом узле.

  ```sh
  ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -ld /srv/routes/west'
  ```
phrases.0: Я представил список маршрутов как данные.
phrases.1: Я одним циклом создал все нужные каталоги на каждом узле.
phrases.2: Я проверил результат для каждой пары узел — маршрут.
