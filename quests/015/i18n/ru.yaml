title: Циклы
brief: |-
  На хостах отсутствуют нужные каталоги маршрутов.

  Работайте на workstation в `~/quest` с файлами `inventory.ini`, `ansible.cfg`, `routes.yml`, `rollout.yml`.

  **Требования:**
  - Каталоги на каждом управляемом хосте (`app1`, `app2`, `app3`):
    - Требуемые пути: `/srv/routes/north`, `/srv/routes/south`, `/srv/routes/east`.
    - Режим доступа: `0750`.

  **Самопроверка перед Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'ls -ld /srv/routes/north /srv/routes/south /srv/routes/east'` — показывает три каталога на каждом управляемом хосте с правами `drwxr-x---`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'find /srv/routes -maxdepth 1 -mindepth 1 -type d'` — включает /srv/routes/north, /srv/routes/south и /srv/routes/east на каждом хосте.
debrief: Цикл уже выбирал нужные данные. Исправление state обеспечило одинаковое создание каталогов на всём парке.
stages.0.brief: Каждый управляемый хост должен иметь каждый нужный каталог маршрута.
stages.0.objectives.0.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) пути `/srv/routes/north`, `/srv/routes/south`
  и `/srv/routes/east` являются каталогами с режимом `0750`.
hints.0.text: Проверьте state модуля file и тип каждого пути.
hints.1.text: Item в цикле — имя маршрута, а не хоста.
hints.2.text: Отделите список данных от повторяемой задачи.
phrases.0: Я представил список маршрутов как данные.
phrases.1: Я одним циклом создал все нужные каталоги на каждом узле.
phrases.2: Я проверил результат для каждой пары узел — маршрут.
