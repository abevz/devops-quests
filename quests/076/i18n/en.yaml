hints.0.text: An output backed by a resource can carry a real dependency.
hints.1.text: Draw the required direction before editing references.
hints.2.text: Feed north from local.hub and keep south fed from north.route.
phrases.0: I traced the cycle through resource-backed module outputs.
phrases.1: I fixed dependency direction instead of hiding it with constants.
phrases.2: I verified both generated artifacts and the final plan.
