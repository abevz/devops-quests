title: Dependency cycle
brief: 'Two local modules depend on each other: north consumes south.route and south
  consumes north.route. The intended direction is dispatch → north → south. Break
  only the north back-reference by using local.hub; keep south connected to north
  and keep the resource-backed route outputs. Validate, inspect a plan and apply with
  the offline local provider. Do not replace outputs with hard-coded success strings.


  Quest files in `~/quest` (some appear in later stages): `main.tf`, `modules/station/main.tf`,
  `north.txt`, `south.txt`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images
  and private services. Change only this bay.


  Initial success criteria: The graph is acyclic, two real files encode dispatch:north
  and dispatch:north:south, outputs match and the final plan is empty.


  The original module is checksum-protected in `/run/dq/facts/0/original-module.sha256`;
  preserve its resource-backed outputs.'
debrief: One backward dependency was removed while the intended dataflow remained
  explicit.
stages.0.brief: 'Success criteria: The graph is acyclic, two real files encode dispatch:north
