title: Dependency cycle
brief: |
  The module configuration cannot produce the required dispatch routes. Keep the supplied module and its resource-backed outputs.

  Work in `~/quest` on the workstation. Supplied inputs: `main.tf`, `modules/station/main.tf`.

  **Requirements:**
  - `tofu validate` succeeds.
  - The supplied module and its resource-backed route outputs are preserved.
  - OpenTofu state contains exactly:
    - `module.north.local_file.route`
    - `module.south.local_file.route`
  - Files in `~/quest` on the workstation:
    - `north.txt`: `dispatch:north`
    - `south.txt`: `dispatch:north:south`
  - Output `routes` contains only these key-to-route mappings:
    - `north`: `dispatch:north`
    - `south`: `dispatch:north:south`
  - `tofu plan` exits with code `0` and reports no changes.

  **Verify yourself before Check & finish:**
  Run these observation commands from `~/quest` on the workstation.
  - Expected: validation succeeds, exactly the two required addresses exist, and the supplied module checksum is OK.

    ```sh
    tofu validate -no-color
    tofu state list
    sha256sum -c /run/dq/facts/0/original-module.sha256
    ```
  - Expected: both files contain the required routes, and the output maps exactly the two required keys to those routes.

    ```sh
    cat north.txt south.txt
    tofu output -json routes
    ```
  - `tofu plan -input=false -detailed-exitcode -no-color` — Expected: no changes, exit code `0`.

  The check verifies the original module checksum from `/run/dq/facts/0/original-module.sha256` on the workstation, not just the returned strings.
debrief: One backward dependency was removed while the intended dataflow remained
  explicit.
stages.0.brief: |
  Both stations must publish the required routes while preserving the supplied module.
stages.0.objectives.0.text: '`tofu validate` succeeds.'
stages.0.objectives.1.text: The station module preserves its resource-backed route outputs.
stages.0.objectives.2.text: The state tracks exactly `module.north.local_file.route` and `module.south.local_file.route`.
stages.0.objectives.3.text: '`north.txt` contains `dispatch:north`.'
stages.0.objectives.4.text: '`south.txt` contains `dispatch:north:south`.'
stages.0.objectives.5.text: Output `routes` maps `north` to `dispatch:north` and `south` to `dispatch:north:south`,
  with no extra entries.
stages.0.objectives.6.text: '`tofu plan` exits 0 with no changes.'
hints.0.text: An output backed by a resource can carry a real dependency.
hints.1.text: Draw the required direction before editing references.
hints.2.text: |
  north consumes south.route and south consumes north.route, creating a cycle. Feed north from local.hub; keep south connected to north.route. The intended direction is dispatch → north → south.
phrases.0: I traced the cycle through resource-backed module outputs.
phrases.1: I fixed dependency direction instead of hiding it with constants.
phrases.2: I verified both generated artifacts and the final plan.
