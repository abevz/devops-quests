stages.0.objectives.6.text: OpenTofu reports no pending infrastructure changes.
hints.0.text: An output backed by a resource can carry a real dependency.
hints.1.text: |-
  Draw the required direction before editing references. The check verifies the original module checksum from `/run/dq/facts/0/original-module.sha256` on the workstation, not just the returned strings.

  Inspect the supplied configuration and live observations on the workstation:

  ```sh
  tofu validate
  cat main.tf modules/station/main.tf
  ```
hints.2.text: |-
  north consumes south.route and south consumes north.route, creating a cycle. Feed north from local.hub; keep south connected to north.route. The intended direction is dispatch → north → south.

  Verify the result from `~/quest` on the workstation:

  Run these observation commands from `~/quest` on the workstation.
  - Expected: validation succeeds, exactly the two required addresses exist, and the supplied module checksum is OK.

    ```sh
    tofu validate -no-color
    tofu state list
    sha256sum -c /run/dq/facts/0/original-module.sha256
    ```
  - Expected: both files contain the required routes, and the output maps exactly the two required keys to those routes.

    ```sh
    cat north.txt south.txt
    tofu output -json routes
    ```
  - `tofu plan -input=false -detailed-exitcode -no-color` — Expected: no changes, exit code `0`.
phrases.0: I traced the cycle through resource-backed module outputs.
phrases.1: I fixed dependency direction instead of hiding it with constants.
phrases.2: I verified both generated artifacts and the final plan.
