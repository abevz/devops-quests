stages.0.objectives.3.text: '`north.txt` contains `dispatch:north`.'
stages.0.objectives.4.text: '`south.txt` contains `dispatch:north:south`.'
stages.0.objectives.5.text: Output `routes` maps `north` to `dispatch:north` and `south` to `dispatch:north:south`,
