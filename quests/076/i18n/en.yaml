title: Dependency cycle
brief: |-
  The module configuration cannot produce the required dispatch routes. Keep the supplied module and its resource-backed outputs.

  Work in `~/quest` on the workstation. Supplied inputs: `main.tf`, `modules/station/main.tf`.

  **Requirements:**
  - The supplied OpenTofu configuration is valid.
  - The supplied module remains unchanged, with outputs backed by its managed route files.
  - OpenTofu state contains exactly:
    - OpenTofu tracks exactly the configured route file in each of the two supplied module instances.
  - Files in `~/quest` on the workstation:
    - `north.txt`: `dispatch:north`
    - `south.txt`: `dispatch:north:south`
  - Output `routes` contains only these key-to-route mappings:
    - `north`: `dispatch:north`
    - `south`: `dispatch:north:south`
  - OpenTofu reports no pending infrastructure changes.

  The check requires the supplied module to remain unchanged, not merely the same returned strings.
debrief: One backward dependency was removed while the intended dataflow remained explicit.
stages.0.brief: Both stations must publish the required routes while preserving the supplied module.
