hints.0.text: A resource-backed output carries both a value and a dependency. Completing a graph requires
  its missing consumers as well as removing a backward edge.
hints.1.text: |-
  Compare validation errors, current root declarations, delivery outputs and the supplied route cases. Trace the required direction of each consumed output before editing references.

  ```sh
  tofu validate -no-color
  cat main.tf delivery.tf
  cat route-cases.json
  ```
hints.2.text: |-
  Construct the missing module calls and connect the joined consumer to both branches while breaking the backward dependency at its input. Keep the module implementation unchanged. Verify four module instances, real graph paths, both output maps and every caller case without applying the probe; the default plan must finish empty.

  ```sh
  tofu graph
  tofu output -json routes
  tofu output -json delivery_routes
  tofu plan -input=false -detailed-exitcode -no-color
  ```
phrases.0: I traced the cycle through resource-backed module outputs.
phrases.1: I fixed dependency direction instead of hiding it with constants.
phrases.2: I verified both generated artifacts and the final plan.
