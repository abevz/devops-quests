title: Dependency cycle
brief: |-
  The module configuration cannot produce the complete joined delivery. Recover an acyclic route graph while retaining the supplied resource-backed routing module.

  Work in `~/quest` on the workstation with `main.tf`, `delivery.tf`, `modules/station/main.tf` and `route-cases.json`.

  **Requirements:**

  - The supplied OpenTofu configuration is valid.
  - The supplied routing module remains unchanged, with resource-backed outputs.
  - State tracks exactly the four contract route files in four distinct module instances.
  - `north.txt` matches the default route contract.
  - `south.txt`, `east.txt` and `archive.txt` match the default route contract.
  - Outputs `routes` and `delivery_routes` match the contract, with real upstream dependencies and correct propagation for every supplied caller value.
  - OpenTofu reports no pending infrastructure changes.
  - All route consumers and the joined delivery described by the supplied contract are present. Downstream builders depend on the upstream resource-backed outputs they consume; current strings alone are insufficient.
  - The workstation files `~/quest/north.txt`, `~/quest/south.txt`, `~/quest/east.txt` and `~/quest/archive.txt` follow the default case. `routes` retains the original two-route map with no extra entries; `delivery_routes` contains exactly the independent and joined delivery results.
  - Both supplied hub cases must produce their required managed file contents in read-only plans. Preserve the supplied module bytes and do not add unrelated managed objects.

  Checks inspect current state, retained artifacts and read-only plans; they do not prove which exact plan was applied or the complete command history.
debrief: The repair constructed the independent and joined consumers as well as removing the cycle. Actual
  graph reachability and alternate caller plans distinguish a connected resource-backed flow from strings
  that only happen to match the default.
stages.0.brief: Recover the complete acyclic route graph and its joined delivery.
stages.0.objectives.0.text: The supplied OpenTofu configuration is valid.
stages.0.objectives.1.text: The supplied routing module remains unchanged, with resource-backed outputs.
stages.0.objectives.2.text: State tracks exactly the four contract route files in four distinct module
  instances.
stages.0.objectives.3.text: '`north.txt` matches the default route contract.'
stages.0.objectives.4.text: '`south.txt`, `east.txt` and `archive.txt` match the default route contract.'
stages.0.objectives.5.text: Outputs `routes` and `delivery_routes` match the contract, with real upstream
  dependencies and correct propagation for every supplied caller value.
stages.0.objectives.6.text: OpenTofu reports no pending infrastructure changes.
hints.0.text: A resource-backed output carries both a value and a dependency. Completing a graph requires
  its missing consumers as well as removing a backward edge.
hints.1.text: |-
  Compare validation errors, current root declarations, delivery outputs and the supplied route cases. Trace the required direction of each consumed output before editing references.

  Find each reference to a resource-backed output in the root calls. Use the route cases to compare the expected incoming edges for the joined route with the existing backward edge.

  ```sh
  tofu validate -no-color
  cat main.tf delivery.tf
  cat route-cases.json
  ```
hints.2.text: |-
  Verify four module instances, real graph paths, both output maps and every caller case without applying the probe; the default plan must finish empty.

  ```sh
  tofu graph
  tofu output -json routes
  tofu output -json delivery_routes
  tofu plan -input=false -detailed-exitcode -no-color
  ```

  Compare the managed files and both output maps for each case with `route-cases.json`. The temporary plans are for inspection and remain unapplied.

  ```sh
  (
    set -euo pipefail
    probe=$(mktemp -d)
    trap 'rm -rf -- "$probe"' EXIT
    variable=$(jq -er .variable route-cases.json)
    jq -er '.cases[].input' route-cases.json | while IFS= read -r value; do
      tofu plan -input=false -refresh=false -no-color -var="$variable=$value" -out="$probe/case.plan"
      tofu show -json "$probe/case.plan" | jq --arg value "$value" '
        .planned_values | {input:$value,
          files:[.root_module | recurse(.child_modules[]?) | .resources[]?
            | select(.mode=="managed" and .type=="local_file") | {address,path:.values.filename,content:.values.content}],
          routes:.outputs.routes.value, delivery_routes:.outputs.delivery_routes.value}'
    done
  )
  ```
phrases.0: I traced the cycle through resource-backed module outputs.
phrases.1: I fixed dependency direction instead of hiding it with constants.
phrases.2: I verified both generated artifacts and the final plan.
diagnostics.dag_validate: The supplied root makes north and south depend on each other and refers to missing east/archive modules; repair the root calls before validating again. [Cause and check](guides#guide=terraform-7.1&section=dag-root-cycle-and-missing-calls)
diagnostics.dag_module_source: Editing the supplied child module changes its frozen checksum; repair composition in the root while retaining modules/station/main.tf unchanged. [Cause and check](guides#guide=terraform-7.1&section=dag-preserve-supplied-child-module)
diagnostics.probe_0_2: Configuration or outputs alone leave no applied module resources; the current state needs four distinct module instances managing the four route files. Failed tofu show, invalid JSON or unresolved file targets also reach this fallback. [Cause and check](guides#guide=terraform-7.1&section=dag-four-distinct-managed-module-targets)
diagnostics.dag_north: The first route may not have been applied or may use the wrong upstream; north.txt must reflect the default hub followed by north. [Cause and check](guides#guide=terraform-7.1&section=dag-applied-north-route)
diagnostics.dag_south: The dependent route may bypass north or remain unapplied; south.txt must carry the north result followed by south. [Cause and check](guides#guide=terraform-7.1&section=dag-applied-dependent-south-route)
diagnostics.dag_delivery: The missing east/archive calls leave the branch or joined delivery absent; build the branch and join both upstream route results in the applied archive file. [Cause and check](guides#guide=terraform-7.1&section=dag-independent-branch-and-joined-file)
diagnostics.probe_0_5: The current routes output may be missing or differ from the two expected routes before the graph observer starts; imports or other unmarked startup errors can also leave this fallback. [Cause and check](guides#guide=terraform-7.1&section=dag-legacy-output-and-helper-fallback)
diagnostics.dag_dependencies: Hardcoded route text can omit real graph dependencies; the joined archive must depend on both upstream branches and south on north. Missing state targets, graph/contract errors or graph timeout also use this marker. [Cause and check](guides#guide=terraform-7.1&section=dag-real-positive-resource-dependencies)
diagnostics.dag_contract: Hardcoded default values or output-only wiring may pass the default route but fail the second caller profile; forward hub through real module files and both output maps for every supplied case. [Cause and check](guides#guide=terraform-7.1&section=dag-forward-both-caller-profiles)
diagnostics.dag_plan: Unapplied modules, route-file drift or a planning error can leave a nonzero detailed plan; apply the corrected composition and inspect remaining changes. [Cause and check](guides#guide=terraform-7.1&section=dag-final-converged-plan)
