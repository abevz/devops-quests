title: Цикл зависимостей
brief: |
  Конфигурация станций не обеспечивает требуемые диспетчерские маршруты. Сохраните предоставленный модуль станции и его выходные значения, связанные с ресурсами.

  Работайте в `~/quest` на workstation. Предоставленные входные файлы: `main.tf`, `modules/station/main.tf`.

  **Требования:**
  - `tofu validate` завершается успешно.
  - Предоставленный модуль станции и его выходные значения маршрутов, связанные с ресурсами, сохранены.
  - State OpenTofu содержит ровно:
    - `module.north.local_file.route`
    - `module.south.local_file.route`
  - Файлы в `~/quest` на workstation:
    - `north.txt`: `dispatch:north`
    - `south.txt`: `dispatch:north:south`
  - Выходное значение `routes` содержит только следующие соответствия станций маршрутам:
    - `north`: `dispatch:north`
    - `south`: `dispatch:north:south`
  - `tofu plan` завершается с кодом `0` без изменений.

  **Проверьте самостоятельно перед Check & finish:**
  Выполняйте эти команды наблюдения из `~/quest` на workstation.
  - Ожидается успешная валидация, ровно два требуемых адреса и успешная проверка контрольной суммы предоставленного модуля.

    ```sh
    tofu validate -no-color
    tofu state list
    sha256sum -c /run/dq/facts/0/original-module.sha256
    ```
  - Ожидается, что оба файла содержат требуемые маршруты, а выходное значение сопоставляет ровно два требуемых ключа этим маршрутам.

    ```sh
    cat north.txt south.txt
    tofu output -json routes
    ```
  - `tofu plan -input=false -detailed-exitcode -no-color` — Ожидаются отсутствие изменений и код завершения `0`.

  Проверка сверяет исходную контрольную сумму модуля из `/run/dq/facts/0/original-module.sha256` на workstation, а не только возвращаемые строки.
debrief: Одна обратная зависимость убрана с сохранением явного потока данных.
stages.0.brief: |
  Обе станции должны публиковать требуемые маршруты с сохранением предоставленного модуля.
stages.0.objectives.0.text: '`tofu validate` завершается успешно.'
stages.0.objectives.1.text: Модуль station сохраняет outputs маршрутов, основанные на ресурсах.
stages.0.objectives.2.text: State содержит ровно `module.north.local_file.route` и `module.south.local_file.route`.
stages.0.objectives.3.text: '`north.txt` содержит `dispatch:north`.'
stages.0.objectives.4.text: '`south.txt` содержит `dispatch:north:south`.'
stages.0.objectives.5.text: Output `routes` сопоставляет `north` с `dispatch:north`, а `south` с `dispatch:north:south`,
  без дополнительных записей.
stages.0.objectives.6.text: '`tofu plan` завершается с кодом 0 без изменений.'
hints.0.text: Output, связанный с ресурсом, может создавать реальную зависимость.
hints.1.text: До изменения ссылок нарисуйте требуемое направление.
hints.2.text: |
  north использует south.route, а south — north.route, создавая цикл. Передайте в north значение local.hub; сохраните связь south с north.route. Требуемое направление: dispatch → north → south.
phrases.0: Я проследил цикл через outputs модулей, связанные с ресурсами.
phrases.1: Я исправил направление зависимости вместо сокрытия константами.
phrases.2: Я проверил созданные artifacts и итоговый plan.
