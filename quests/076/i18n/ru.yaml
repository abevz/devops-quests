title: Цикл зависимостей
brief: |-
  Конфигурация модулей не может сформировать полную объединённую доставку. Восстановите ациклический граф маршрутов, сохранив предоставленный модуль станции с выходами от управляемых ресурсов.

  Работайте в `~/quest` на рабочей станции с `main.tf`, `delivery.tf`, `modules/station/main.tf` и `route-cases.json`.

  **Требования:**

  - Предоставленная конфигурация OpenTofu корректна.
  - Предоставленный модуль станции не изменён, его выходы связаны с управляемыми ресурсами.
  - State отслеживает ровно четыре маршрутных файла контракта в четырёх разных экземплярах модулей.
  - `north.txt` соответствует маршрутному контракту по умолчанию.
  - `south.txt`, `east.txt` и `archive.txt` соответствуют маршрутному контракту по умолчанию.
  - Outputs `routes` и `delivery_routes` соответствуют контракту с реальными зависимостями от upstream и корректной передачей каждого заданного входа caller.
  - OpenTofu не сообщает об ожидающих изменениях инфраструктуры.
  - Все потребители маршрутов и объединённая доставка из предоставленного контракта присутствуют. Нижележащие построители зависят от потребляемых выходов управляемых upstream-ресурсов; совпадения текущих строк недостаточно.
  - Файлы рабочей станции `~/quest/north.txt`, `~/quest/south.txt`, `~/quest/east.txt` и `~/quest/archive.txt` соответствуют случаю по умолчанию. `routes` сохраняет исходную карту двух маршрутов без дополнительных записей; `delivery_routes` содержит ровно независимый и объединённый результаты.
  - Оба заданных случая hub дают требуемое содержимое управляемых файлов в планах без применения. Сохраните байты предоставленного модуля и не добавляйте посторонние управляемые объекты.

  Проверки анализируют текущее состояние, сохранённые артефакты и планы без применения; они не доказывают, какой именно план применялся, или полную историю команд.
debrief: Исправление построило независимого и объединённого потребителей и устранило цикл. Реальная достижимость
  в графе и планы для других входов отличают связанный поток ресурсов от строк, случайно совпавших по
  умолчанию.
stages.0.brief: Восстановите полный ациклический граф маршрутов и объединённую доставку.
stages.0.objectives.0.text: Предоставленная конфигурация OpenTofu корректна.
stages.0.objectives.1.text: Предоставленный модуль станции не изменён, его выходы связаны с управляемыми
  ресурсами.
stages.0.objectives.2.text: State отслеживает ровно четыре маршрутных файла контракта в четырёх разных
  экземплярах модулей.
stages.0.objectives.3.text: '`north.txt` соответствует маршрутному контракту по умолчанию.'
stages.0.objectives.4.text: '`south.txt`, `east.txt` и `archive.txt` соответствуют маршрутному контракту
  по умолчанию.'
stages.0.objectives.5.text: Outputs `routes` и `delivery_routes` соответствуют контракту с реальными зависимостями
  от upstream и корректной передачей каждого заданного входа caller.
stages.0.objectives.6.text: OpenTofu не сообщает об ожидающих изменениях инфраструктуры.
hints.0.text: Выход управляемого ресурса передаёт и значение, и зависимость. Для полного графа нужны недостающие
  потребители и устранение обратного ребра.
hints.1.text: |-
  Сопоставьте ошибки validate, текущие корневые объявления, выходы доставки и заданные маршрутные случаи. До изменения ссылок определите нужное направление каждого потребляемого выхода.

  ```sh
  tofu validate -no-color
  cat main.tf delivery.tf
  cat route-cases.json
  ```
hints.2.text: |-
  Постройте недостающие вызовы модулей и свяжите объединяющего потребителя с обеими ветвями, разорвав обратную зависимость у её входа. Не меняйте реализацию модуля. Проверьте четыре экземпляра, реальные пути графа, обе карты выходов и все случаи caller без применения пробного плана; итоговый план по умолчанию должен быть пустым.

  ```sh
  tofu graph
  tofu output -json routes
  tofu output -json delivery_routes
  tofu plan -input=false -detailed-exitcode -no-color
  ```
phrases.0: Я проследил цикл через outputs модулей, связанные с ресурсами.
phrases.1: Я исправил направление зависимости вместо сокрытия константами.
phrases.2: Я проверил созданные artifacts и итоговый plan.
diagnostics.dag_validate: Выданный root создаёт цикл между north и south и ссылается на отсутствующие east/archive; исправьте корневые вызовы перед повторной validate. [Причина и проверка](guides#guide=terraform-7.1&section=dag-root-cycle-and-missing-calls)
diagnostics.dag_module_source: Редактирование выданного дочернего модуля меняет зафиксированный checksum; исправляйте композицию в root, сохраняя modules/station/main.tf. [Причина и проверка](guides#guide=terraform-7.1&section=dag-preserve-supplied-child-module)
diagnostics.probe_0_2: Конфигурация и outputs не создают применённые ресурсы; state требует четыре разных экземпляра модулей для четырёх файлов маршрутов. Ошибка tofu show, неверный JSON или неразрешённые пути также дают fallback. [Причина и проверка](guides#guide=terraform-7.1&section=dag-four-distinct-managed-module-targets)
diagnostics.dag_north: Первый маршрут могли не применить либо выбрать неверный upstream; north.txt должен отражать исходный hub с последующим north. [Причина и проверка](guides#guide=terraform-7.1&section=dag-applied-north-route)
diagnostics.dag_south: Зависимый маршрут может обходить north или оставаться неприменённым; south.txt должен содержать результат north с последующим south. [Причина и проверка](guides#guide=terraform-7.1&section=dag-applied-dependent-south-route)
diagnostics.dag_delivery: Отсутствующие вызовы east/archive оставляют ветвь или объединённую доставку без файлов; создайте ветвь и объедините оба исходных результата в применённом archive. [Причина и проверка](guides#guide=terraform-7.1&section=dag-independent-branch-and-joined-file)
diagnostics.probe_0_5: Текущий routes output может отсутствовать или отличаться от двух ожидаемых маршрутов до запуска наблюдения графа; импорты и другие немаркированные ошибки запуска также дают fallback. [Причина и проверка](guides#guide=terraform-7.1&section=dag-legacy-output-and-helper-fallback)
diagnostics.dag_dependencies: Захардкоженный текст маршрутов может обходить реальные зависимости; archive должен зависеть от обеих ветвей, а south от north. Отсутствующие цели state, ошибки графа/контракта или таймаут graph также дают этот маркер. [Причина и проверка](guides#guide=terraform-7.1&section=dag-real-positive-resource-dependencies)
diagnostics.dag_contract: Захардкоженные defaults либо связи только outputs проходят основной маршрут, но не второй профиль; передайте hub через реальные файлы модулей и обе output-map для каждого выданного варианта. [Причина и проверка](guides#guide=terraform-7.1&section=dag-forward-both-caller-profiles)
diagnostics.dag_plan: Неприменённые модули, drift файлов или ошибка plan оставляют ненулевой detailed plan; примените исправленную композицию и изучите оставшиеся изменения. [Причина и проверка](guides#guide=terraform-7.1&section=dag-final-converged-plan)
