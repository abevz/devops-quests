title: Цикл зависимостей
brief: |-
  Конфигурация модулей не может сформировать полную объединённую доставку. Восстановите ациклический граф маршрутов, сохранив предоставленный модуль станции с выходами от управляемых ресурсов.

  Работайте в `~/quest` на рабочей станции с `main.tf`, `delivery.tf`, `modules/station/main.tf` и `route-cases.json`.

  **Требования:**

  - Предоставленная конфигурация OpenTofu корректна.
  - Предоставленный модуль станции не изменён, его выходы связаны с управляемыми ресурсами.
  - State отслеживает ровно четыре маршрутных файла контракта в четырёх разных экземплярах модулей.
  - `north.txt` соответствует маршрутному контракту по умолчанию.
  - `south.txt`, `east.txt` и `archive.txt` соответствуют маршрутному контракту по умолчанию.
  - Outputs `routes` и `delivery_routes` соответствуют контракту с реальными зависимостями от upstream и корректной передачей каждого заданного входа caller.
  - OpenTofu не сообщает об ожидающих изменениях инфраструктуры.
  - Все потребители маршрутов и объединённая доставка из предоставленного контракта присутствуют. Нижележащие построители зависят от потребляемых выходов управляемых upstream-ресурсов; совпадения текущих строк недостаточно.
  - Файлы рабочей станции `~/quest/north.txt`, `~/quest/south.txt`, `~/quest/east.txt` и `~/quest/archive.txt` соответствуют случаю по умолчанию. `routes` сохраняет исходную карту двух маршрутов без дополнительных записей; `delivery_routes` содержит ровно независимый и объединённый результаты.
  - Оба заданных случая hub дают требуемое содержимое управляемых файлов в планах без применения. Сохраните байты предоставленного модуля и не добавляйте посторонние управляемые объекты.

  Проверки анализируют текущее состояние, сохранённые артефакты и планы без применения; они не доказывают, какой именно план применялся, или полную историю команд.
debrief: Исправление построило независимого и объединённого потребителей и устранило цикл. Реальная достижимость
  в графе и планы для других входов отличают связанный поток ресурсов от строк, случайно совпавших по
  умолчанию.
stages.0.brief: Восстановите полный ациклический граф маршрутов и объединённую доставку.
