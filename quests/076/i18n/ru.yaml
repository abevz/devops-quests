title: Цикл зависимостей
brief: 'Два локальных модуля зависят друг от друга: north использует south.route,
  south — north.route. Требуемое направление — dispatch → north → south. Уберите только
  обратную ссылку north, передав local.hub; сохраните зависимость south от north и
  outputs route, связанные с ресурсами. Выполните validate, изучите plan и примените
  через offline local provider. Не подменяйте outputs готовыми строками.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `main.tf`, `modules/station/main.tf`,
  `north.txt`, `south.txt`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно
  загруженные образы и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Граф не содержит циклов, два реальных файла содержат dispatch:north
  и dispatch:north:south, outputs совпадают, итоговый plan пуст.


  Checksum исходного модуля сохранён в `/run/dq/facts/0/original-module.sha256`; сохраните
  outputs, связанные с ресурсами.'
debrief: Одна обратная зависимость убрана с сохранением явного потока данных.
stages.0.brief: 'Результат проверки: Граф не содержит циклов, два реальных файла содержат
  dispatch:north и dispatch:north:south, outputs совпадают, итоговый plan пуст.'
stages.0.objectives.0.text: Граф не содержит циклов, два реальных файла содержат dispatch:north
  и dispatch:north:south, outputs совпадают, итоговый plan пуст.
hints.0.text: Output, связанный с ресурсом, может создавать реальную зависимость.
hints.1.text: До изменения ссылок нарисуйте требуемое направление.
hints.2.text: Передайте north значение local.hub, сохранив для south источник north.route.
phrases.0: Я проследил цикл через outputs модулей, связанные с ресурсами.
phrases.1: Я исправил направление зависимости вместо сокрытия константами.
phrases.2: Я проверил созданные artifacts и итоговый plan.
