title: Abhängigkeitszyklus
brief: 'Zwei local-Module sind voneinander abhängig: north verbraucht south.route und south verbraucht
  north.route. Die vorgesehene Richtung ist dispatch → north → south. Brechen Sie nur die Rückreferenz
  north mithilfe von local.hub auf. Halten Sie south mit north verbunden und behalten Sie das ressourcengestützte
  route outputs bei. Validieren Sie inspect und plan und wenden Sie es mit offline local provider an.
  Ersetzen Sie outputs nicht durch hartcodierte Erfolgszeichenfolgen.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `main.tf`, `modules/station/main.tf`,
  `north.txt`, `south.txt`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Das Originalmodul ist in `/run/dq/facts/0/original-module.sha256` prüfsummengeschützt; Bewahren Sie
  seine ressourcengestützten outputs.'
debrief: Eine Rückwärtsabhängigkeit wurde entfernt, während der beabsichtigte Datenfluss explizit blieb.
stages.0.brief: Ändern Sie nur diese Bucht.
stages.0.objectives.0.text: '`tofu validate` ist erfolgreich.'
stages.0.objectives.1.text: Das station-Modul behält seine ressourcenbasierten Routen-Outputs.
stages.0.objectives.2.text: Der State enthält genau `module.north.local_file.route` und `module.south.local_file.route`.
stages.0.objectives.3.text: '`north.txt` enthält `dispatch:north`.'
stages.0.objectives.4.text: '`south.txt` enthält `dispatch:north:south`.'
stages.0.objectives.5.text: Output `routes` ordnet `north` dem Wert `dispatch:north` und `south` dem Wert
  `dispatch:north:south` zu, ohne weitere Einträge.
stages.0.objectives.6.text: '`tofu plan` endet mit Exit-Code 0 ohne Änderungen.'
hints.0.text: Eine durch eine Ressource unterstützte Ausgabe kann eine echte Abhängigkeit beinhalten.
hints.1.text: Zeichnen Sie die erforderliche Richtung ein, bevor Sie Referenzen bearbeiten.
hints.2.text: Feed north von local.hub und south weiterhin von north.route gespeist.
phrases.0: Ich habe den Zyklus durch das ressourcengestützte Modul outputs verfolgt.
phrases.1: Ich habe die Abhängigkeitsrichtung festgelegt, anstatt sie mit Konstanten zu verbergen.
phrases.2: Ich habe sowohl das generierte artifacts als auch das endgültige plan überprüft.
