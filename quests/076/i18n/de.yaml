title: Abhängigkeitszyklus
brief: |-
  Die Modulkonfiguration kann die vollständige zusammengeführte Auslieferung nicht erzeugen. Stelle einen azyklischen Routengraphen her und erhalte das vorgegebene Stationsmodul mit ressourcengestützten Ausgaben.

  Arbeite in `~/quest` auf der Workstation mit `main.tf`, `delivery.tf`, `modules/station/main.tf` und `route-cases.json`.

  **Anforderungen:**

  - Die vorgegebene OpenTofu-Konfiguration ist gültig.
  - Das vorgegebene Stationsmodul bleibt unverändert und hat ressourcengestützte Ausgaben.
  - State verfolgt genau die vier Vertrags-Routendateien in vier verschiedenen Modulinstanzen.
  - `north.txt` entspricht dem Standard-Routenvertrag.
  - `south.txt`, `east.txt` und `archive.txt` entsprechen dem Standard-Routenvertrag.
  - Outputs `routes` und `delivery_routes` entsprechen dem Vertrag mit echten Upstream-Abhängigkeiten und korrekter Weitergabe jedes Caller-Werts.
  - OpenTofu meldet keine ausstehenden Infrastrukturänderungen.
  - Alle Routenverbraucher und die zusammengeführte Auslieferung gemäß Vertrag sind vorhanden. Nachgelagerte Erzeuger hängen von den verwendeten ressourcengestützten Upstream-Ausgaben ab; passende aktuelle Zeichenfolgen allein reichen nicht.
  - Die Workstation-Dateien `~/quest/north.txt`, `~/quest/south.txt`, `~/quest/east.txt` und `~/quest/archive.txt` entsprechen dem Standardfall. `routes` behält die ursprüngliche Zwei-Routen-Zuordnung ohne zusätzliche Einträge; `delivery_routes` enthält genau das unabhängige und das zusammengeführte Ergebnis.
  - Beide vorgegebenen Hub-Fälle erzeugen die geforderten verwalteten Dateiinhalte in nicht angewandten Plänen. Erhalte die Modulbytes und füge keine fremden verwalteten Objekte hinzu.

  Die Prüfungen untersuchen aktuellen State, erhaltene Artefakte und nicht angewandte Pläne; sie beweisen weder den exakt angewandten Plan noch den vollständigen Befehlsverlauf.
debrief: Die Korrektur konstruierte unabhängigen und zusammenführenden Verbraucher und entfernte den Zyklus.
  Echte Graph-Erreichbarkeit und alternative Caller-Pläne unterscheiden verbundenen Ressourcenfluss von
  zufällig passenden Standardzeichenfolgen.
stages.0.brief: Stelle den vollständigen azyklischen Routengraphen und seine zusammengeführte Auslieferung
  her.
stages.0.objectives.0.text: Die vorgegebene OpenTofu-Konfiguration ist gültig.
stages.0.objectives.1.text: Das vorgegebene Stationsmodul bleibt unverändert und hat ressourcengestützte
  Ausgaben.
stages.0.objectives.2.text: State verfolgt genau die vier Vertrags-Routendateien in vier verschiedenen
  Modulinstanzen.
stages.0.objectives.3.text: '`north.txt` entspricht dem Standard-Routenvertrag.'
stages.0.objectives.4.text: '`south.txt`, `east.txt` und `archive.txt` entsprechen dem Standard-Routenvertrag.'
stages.0.objectives.5.text: Outputs `routes` und `delivery_routes` entsprechen dem Vertrag mit echten
  Upstream-Abhängigkeiten und korrekter Weitergabe jedes Caller-Werts.
stages.0.objectives.6.text: OpenTofu meldet keine ausstehenden Infrastrukturänderungen.
hints.0.text: Eine ressourcengestützte Ausgabe trägt Wert und Abhängigkeit. Ein vollständiger Graph braucht
  fehlende Verbraucher ebenso wie das Entfernen einer Rückkante.
hints.1.text: |-
  Vergleiche Validierungsfehler, aktuelle Root-Deklarationen, Auslieferungsausgaben und Routenfälle. Verfolge die benötigte Richtung jeder verwendeten Ausgabe vor dem Ändern von Referenzen.

  ```sh
  tofu validate -no-color
  cat main.tf delivery.tf
  cat route-cases.json
  ```
hints.2.text: |-
  Konstruiere fehlende Modulaufrufe und verbinde den zusammenführenden Verbraucher mit beiden Zweigen; löse die Rückabhängigkeit am Eingang. Erhalte die Modulimplementierung. Prüfe vier Instanzen, echte Graphpfade, beide Ausgabemaps und alle Caller-Fälle ohne den Testplan anzuwenden; der Standardplan muss abschließend leer sein.

  ```sh
  tofu graph
  tofu output -json routes
  tofu output -json delivery_routes
  tofu plan -input=false -detailed-exitcode -no-color
  ```
phrases.0: Ich habe den Zyklus durch das ressourcengestützte Modul outputs verfolgt.
phrases.1: Ich habe die Abhängigkeitsrichtung festgelegt, anstatt sie mit Konstanten zu verbergen.
phrases.2: Ich habe sowohl das generierte artifacts als auch das endgültige plan überprüft.
diagnostics.dag_validate: Das gelieferte Root-Modul erzeugt einen Zyklus zwischen north und south und verweist auf fehlende east/archive Module; korrigieren Sie Root-Aufrufe vor erneuter Validierung. [Ursache und Prüfung](guides#guide=terraform-7.1&section=dag-root-cycle-and-missing-calls)
diagnostics.dag_module_source: Ändern des gelieferten Kindmoduls verändert die eingefrorene Prüfsumme; korrigieren Sie die Komposition im Root und erhalten Sie modules/station/main.tf unverändert. [Ursache und Prüfung](guides#guide=terraform-7.1&section=dag-preserve-supplied-child-module)
diagnostics.probe_0_2: Konfiguration und Outputs allein erzeugen keine angewandten Modulressourcen; der State benötigt vier verschiedene Modulinstanzen für vier Routendateien. Fehlgeschlagenes tofu show, ungültiges JSON oder unauflösbare Dateiziele ergeben ebenfalls diesen Fallback. [Ursache und Prüfung](guides#guide=terraform-7.1&section=dag-four-distinct-managed-module-targets)
diagnostics.dag_north: Die erste Route wurde möglicherweise nicht angewandt oder nutzt falschen upstream; north.txt muss den voreingestellten hub mit anschließendem north wiedergeben. [Ursache und Prüfung](guides#guide=terraform-7.1&section=dag-applied-north-route)
diagnostics.dag_south: Die abhängige Route umgeht möglicherweise north oder wurde nicht angewandt; south.txt muss das north Ergebnis mit anschließendem south enthalten. [Ursache und Prüfung](guides#guide=terraform-7.1&section=dag-applied-dependent-south-route)
diagnostics.dag_delivery: Fehlende east/archive Aufrufe lassen Zweig oder gemeinsame Zustellung ohne Dateien; bauen Sie den Zweig und verbinden Sie beide vorgelagerten Ergebnisse in der angewandten archive Datei. [Ursache und Prüfung](guides#guide=terraform-7.1&section=dag-independent-branch-and-joined-file)
diagnostics.probe_0_5: Der aktuelle routes Output fehlt möglicherweise oder weicht vor Start der Graph-Beobachtung von den beiden erwarteten Routen ab; Imports oder andere unmarkierte Startfehler ergeben ebenfalls diesen Fallback. [Ursache und Prüfung](guides#guide=terraform-7.1&section=dag-legacy-output-and-helper-fallback)
diagnostics.dag_dependencies: Festgeschriebener Routentext kann tatsächliche Abhängigkeiten umgehen; archive muss von beiden Zweigen und south von north abhängen. Fehlende State-Ziele, Graph-/Vertragsfehler oder Graph-Zeitlimit ergeben ebenfalls diesen Marker. [Ursache und Prüfung](guides#guide=terraform-7.1&section=dag-real-positive-resource-dependencies)
diagnostics.dag_contract: Feste Defaults oder reine Output-Verknüpfung können die Standardroute erfüllen, aber am zweiten Aufruferprofil scheitern; führen Sie hub für jeden gelieferten Fall durch echte Moduldateien und beide Output-Maps. [Ursache und Prüfung](guides#guide=terraform-7.1&section=dag-forward-both-caller-profiles)
diagnostics.dag_plan: Nicht angewandte Module, Datei-Drift oder Planfehler lassen einen detaillierten Plan ungleich null enden; wenden Sie die korrigierte Komposition an und prüfen Sie verbleibende Änderungen. [Ursache und Prüfung](guides#guide=terraform-7.1&section=dag-final-converged-plan)
