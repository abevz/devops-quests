title: Abhängigkeitszyklus
brief: |-
  Die Modulkonfiguration kann die vollständige zusammengeführte Auslieferung nicht erzeugen. Stelle einen azyklischen Routengraphen her und erhalte das vorgegebene Stationsmodul mit ressourcengestützten Ausgaben.

  Arbeite in `~/quest` auf der Workstation mit `main.tf`, `delivery.tf`, `modules/station/main.tf` und `route-cases.json`.

  **Anforderungen:**

  - Die vorgegebene OpenTofu-Konfiguration ist gültig.
  - Das vorgegebene Stationsmodul bleibt unverändert und hat ressourcengestützte Ausgaben.
  - State verfolgt genau die vier Vertrags-Routendateien in vier verschiedenen Modulinstanzen.
  - `north.txt` entspricht dem Standard-Routenvertrag.
  - `south.txt`, `east.txt` und `archive.txt` entsprechen dem Standard-Routenvertrag.
  - Outputs `routes` und `delivery_routes` entsprechen dem Vertrag mit echten Upstream-Abhängigkeiten und korrekter Weitergabe jedes Caller-Werts.
  - OpenTofu meldet keine ausstehenden Infrastrukturänderungen.
  - Alle Routenverbraucher und die zusammengeführte Auslieferung gemäß Vertrag sind vorhanden. Nachgelagerte Erzeuger hängen von den verwendeten ressourcengestützten Upstream-Ausgaben ab; passende aktuelle Zeichenfolgen allein reichen nicht.
  - Die Workstation-Dateien `~/quest/north.txt`, `~/quest/south.txt`, `~/quest/east.txt` und `~/quest/archive.txt` entsprechen dem Standardfall. `routes` behält die ursprüngliche Zwei-Routen-Zuordnung ohne zusätzliche Einträge; `delivery_routes` enthält genau das unabhängige und das zusammengeführte Ergebnis.
  - Beide vorgegebenen Hub-Fälle erzeugen die geforderten verwalteten Dateiinhalte in nicht angewandten Plänen. Erhalte die Modulbytes und füge keine fremden verwalteten Objekte hinzu.

  Die Prüfungen untersuchen aktuellen State, erhaltene Artefakte und nicht angewandte Pläne; sie beweisen weder den exakt angewandten Plan noch den vollständigen Befehlsverlauf.
debrief: Die Korrektur konstruierte unabhängigen und zusammenführenden Verbraucher und entfernte den Zyklus.
  Echte Graph-Erreichbarkeit und alternative Caller-Pläne unterscheiden verbundenen Ressourcenfluss von
  zufällig passenden Standardzeichenfolgen.
