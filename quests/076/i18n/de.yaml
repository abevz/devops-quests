hints.0.text: Eine ressourcengestützte Ausgabe trägt Wert und Abhängigkeit. Ein vollständiger Graph braucht
  fehlende Verbraucher ebenso wie das Entfernen einer Rückkante.
hints.1.text: |-
  Vergleiche Validierungsfehler, aktuelle Root-Deklarationen, Auslieferungsausgaben und Routenfälle. Verfolge die benötigte Richtung jeder verwendeten Ausgabe vor dem Ändern von Referenzen.

  ```sh
  tofu validate -no-color
  cat main.tf delivery.tf
  cat route-cases.json
  ```
hints.2.text: |-
  Konstruiere fehlende Modulaufrufe und verbinde den zusammenführenden Verbraucher mit beiden Zweigen; löse die Rückabhängigkeit am Eingang. Erhalte die Modulimplementierung. Prüfe vier Instanzen, echte Graphpfade, beide Ausgabemaps und alle Caller-Fälle ohne den Testplan anzuwenden; der Standardplan muss abschließend leer sein.

  ```sh
  tofu graph
  tofu output -json routes
  tofu output -json delivery_routes
  tofu plan -input=false -detailed-exitcode -no-color
  ```
phrases.0: Ich habe den Zyklus durch das ressourcengestützte Modul outputs verfolgt.
phrases.1: Ich habe die Abhängigkeitsrichtung festgelegt, anstatt sie mit Konstanten zu verbergen.
phrases.2: Ich habe sowohl das generierte artifacts als auch das endgültige plan überprüft.
