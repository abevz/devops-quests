title: Abhängigkeitszyklus
brief: |-
  Die Stationskonfiguration erzeugt die geforderten Dispatch-Routen nicht. Behalten Sie das bereitgestellte Stationsmodul und seine ressourcenbasierten Ausgaben bei.

  Arbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte Eingabedateien: `main.tf`, `modules/station/main.tf`.

  **Anforderungen:**
  - Die bereitgestellte OpenTofu-Konfiguration ist gültig.
  - Das bereitgestellte Modul bleibt unverändert; seine Ausgaben basieren auf den verwalteten Routendateien.
  - Der OpenTofu-State enthält genau:
    - OpenTofu verwaltet genau die konfigurierte Routendatei in jeder der zwei bereitgestellten Modulinstanzen.
  - Dateien in `~/quest` auf der Workstation:
    - `north.txt`: `dispatch:north`
    - `south.txt`: `dispatch:north:south`
  - Die Ausgabe `routes` enthält ausschließlich diese Zuordnungen von Stationen zu Routen:
    - `north`: `dispatch:north`
    - `south`: `dispatch:north:south`
  - OpenTofu meldet keine ausstehenden Infrastrukturänderungen.

  Die Prüfung verlangt ein unverändertes bereitgestelltes Modul, nicht nur dieselben zurückgegebenen Zeichenketten.
debrief: Eine Rückwärtsabhängigkeit wurde entfernt, während der beabsichtigte Datenfluss explizit blieb.
stages.0.brief: Beide Stationen müssen die geforderten Routen veröffentlichen und das bereitgestellte
  Modul beibehalten.
stages.0.objectives.0.text: Die bereitgestellte OpenTofu-Konfiguration ist gültig.
stages.0.objectives.1.text: Das bereitgestellte Modul bleibt unverändert; seine Ausgaben basieren auf
  den verwalteten Routendateien.
stages.0.objectives.2.text: OpenTofu verwaltet genau die konfigurierte Routendatei in jeder der zwei bereitgestellten
  Modulinstanzen.
stages.0.objectives.3.text: '`north.txt` enthält `dispatch:north`.'
stages.0.objectives.4.text: '`south.txt` enthält `dispatch:north:south`.'
stages.0.objectives.5.text: Output `routes` ordnet `north` dem Wert `dispatch:north` und `south` dem Wert
  `dispatch:north:south` zu, ohne weitere Einträge.
stages.0.objectives.6.text: OpenTofu meldet keine ausstehenden Infrastrukturänderungen.
hints.0.text: Eine durch eine Ressource unterstützte Ausgabe kann eine echte Abhängigkeit beinhalten.
hints.1.text: |-
  Zeichnen Sie die erforderliche Richtung ein, bevor Sie Referenzen bearbeiten. Die Prüfung vergleicht die ursprüngliche Modulprüfsumme aus `/run/dq/facts/0/original-module.sha256` auf der Workstation, nicht nur die zurückgegebenen Zeichenfolgen.

  Prüfen Sie die bereitgestellte Konfiguration und aktuelle Beobachtungen auf der Workstation:

  ```sh
  tofu validate
  cat main.tf modules/station/main.tf
  ```
hints.2.text: |-
  north verwendet south.route und south verwendet north.route; dadurch entsteht ein Zyklus. Versorgen Sie north aus local.hub und lassen Sie south mit north.route verbunden. Die vorgesehene Richtung ist dispatch → north → south.

  Prüfen Sie das Ergebnis in `~/quest` auf der Workstation:

  Führen Sie diese Beobachtungsbefehle in `~/quest` auf der Workstation aus.
  - Erwartet: erfolgreiche Validierung, genau die zwei geforderten Adressen und eine erfolgreiche Prüfsummenprüfung des bereitgestellten Moduls.

    ```sh
    tofu validate -no-color
    tofu state list
    sha256sum -c /run/dq/facts/0/original-module.sha256
    ```
  - Erwartet: Beide Dateien enthalten die geforderten Routen; die Ausgabe ordnet genau die beiden geforderten Schlüssel diesen Routen zu.

    ```sh
    cat north.txt south.txt
    tofu output -json routes
    ```
  - `tofu plan -input=false -detailed-exitcode -no-color` — Erwartet: keine Änderungen, Exit-Code `0`.
phrases.0: Ich habe den Zyklus durch das ressourcengestützte Modul outputs verfolgt.
phrases.1: Ich habe die Abhängigkeitsrichtung festgelegt, anstatt sie mit Konstanten zu verbergen.
phrases.2: Ich habe sowohl das generierte artifacts als auch das endgültige plan überprüft.
diagnostics.probe_0_2: 'Mit den aktuellen Eingaben konnte dieses Ziel nicht geprüft werden: OpenTofu verwaltet genau
  die konfigurierte Routendatei in jeder der zwei bereitgestellten Modulinstanzen.'
