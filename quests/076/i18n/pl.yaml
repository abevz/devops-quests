title: Cykl zależności
brief: |-
  Konfiguracja modułów nie może wytworzyć pełnego połączonego dostarczenia. Odtwórz acykliczny graf tras, zachowując dostarczony moduł stacji z wyjściami opartymi na zasobach.

  Pracuj w `~/quest` na stacji roboczej z `main.tf`, `delivery.tf`, `modules/station/main.tf` i `route-cases.json`.

  **Wymagania:**

  - Dostarczona konfiguracja OpenTofu jest poprawna.
  - Dostarczony moduł stacji pozostaje niezmieniony, z wyjściami opartymi na zasobach.
  - State śledzi dokładnie cztery pliki kontraktu w czterech różnych instancjach modułów.
  - `north.txt` spełnia domyślny kontrakt tras.
  - `south.txt`, `east.txt` i `archive.txt` spełniają domyślny kontrakt tras.
  - Outputy `routes` i `delivery_routes` spełniają kontrakt z rzeczywistymi zależnościami upstream i poprawną propagacją każdego wejścia caller.
  - OpenTofu nie zgłasza oczekujących zmian infrastruktury.
  - Obecni są wszyscy odbiorcy tras i połączone dostarczenie określone kontraktem. Dalsze generatory zależą od używanych wyjść zasobów upstream; zgodność samych bieżących ciągów nie wystarczy.
  - Pliki stacji roboczej `~/quest/north.txt`, `~/quest/south.txt`, `~/quest/east.txt` i `~/quest/archive.txt` odpowiadają przypadkowi domyślnemu. `routes` zachowuje pierwotną mapę dwóch tras bez dodatkowych wpisów; `delivery_routes` zawiera dokładnie wynik niezależny i połączony.
  - Oba dostarczone przypadki hub dają wymagane zawartości zarządzanych plików w planach bez zastosowania. Zachowaj bajty dostarczonego modułu i nie dodawaj obcych zarządzanych obiektów.

  Kontrole badają bieżący state, zachowane artefakty i plany bez zastosowania; nie dowodzą zastosowania konkretnego planu ani pełnej historii poleceń.
debrief: Naprawa zbudowała niezależnego i zbierającego odbiorcę oraz usunęła cykl. Rzeczywista osiągalność
  grafu i plany dla innych wejść odróżniają powiązany przepływ zasobów od ciągów pasujących tylko do wartości
  domyślnej.
stages.0.brief: Odtwórz pełny acykliczny graf tras i jego połączone dostarczenie.
stages.0.objectives.0.text: Dostarczona konfiguracja OpenTofu jest poprawna.
stages.0.objectives.1.text: Dostarczony moduł stacji pozostaje niezmieniony, z wyjściami opartymi na zasobach.
stages.0.objectives.2.text: State śledzi dokładnie cztery pliki kontraktu w czterech różnych instancjach
  modułów.
stages.0.objectives.3.text: '`north.txt` spełnia domyślny kontrakt tras.'
stages.0.objectives.4.text: '`south.txt`, `east.txt` i `archive.txt` spełniają domyślny kontrakt tras.'
stages.0.objectives.5.text: Outputy `routes` i `delivery_routes` spełniają kontrakt z rzeczywistymi zależnościami
  upstream i poprawną propagacją każdego wejścia caller.
stages.0.objectives.6.text: OpenTofu nie zgłasza oczekujących zmian infrastruktury.
hints.0.text: Wyjście oparte na zasobie niesie wartość i zależność. Kompletny graf wymaga brakujących
  odbiorców oraz usunięcia krawędzi wstecznej.
hints.1.text: |-
  Porównaj błędy walidacji, bieżące deklaracje główne, wyjścia dostarczania i przypadki tras. Prześledź wymagany kierunek używanych wyjść przed edytowaniem odwołań.

  ```sh
  tofu validate -no-color
  cat main.tf delivery.tf
  cat route-cases.json
  ```
hints.2.text: |-
  Zbuduj brakujące wywołania modułów i połącz odbiorcę zbierającego z obiema gałęziami, usuwając zależność wsteczną na wejściu. Nie zmieniaj implementacji modułu. Sprawdź cztery instancje, prawdziwe ścieżki grafu, obie mapy i wszystkie przypadki caller bez stosowania próby; końcowy plan domyślny ma być pusty.

  ```sh
  tofu graph
  tofu output -json routes
  tofu output -json delivery_routes
  tofu plan -input=false -detailed-exitcode -no-color
  ```
phrases.0: Prześledziłem cykl poprzez moduł outputs oparty na zasobach.
phrases.1: Naprawiłem kierunek zależności zamiast ukrywać go za pomocą stałych.
phrases.2: Sprawdziłem zarówno wygenerowany artifacts, jak i końcowy plan.
diagnostics.dag_validate: Dostarczony root tworzy cykl north i south oraz wskazuje brakujące east/archive; popraw wywołania główne przed ponownym validate. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=dag-root-cycle-and-missing-calls)
diagnostics.dag_module_source: Edycja dostarczonego modułu potomnego zmienia zamrożony checksum; popraw kompozycję w root, zachowując modules/station/main.tf bez zmian. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=dag-preserve-supplied-child-module)
diagnostics.probe_0_2: Sama konfiguracja i outputs nie tworzą zastosowanych zasobów; state wymaga czterech różnych instancji modułów dla czterech plików tras. Błąd tofu show, błędny JSON lub nierozwiązane cele plików też dają fallback. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=dag-four-distinct-managed-module-targets)
diagnostics.dag_north: Pierwsza trasa mogła nie zostać zastosowana lub ma błędny upstream; north.txt ma odzwierciedlać domyślny hub i north. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=dag-applied-north-route)
diagnostics.dag_south: Zależna trasa może omijać north lub nie być zastosowana; south.txt ma zawierać wynik north i south. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=dag-applied-dependent-south-route)
diagnostics.dag_delivery: Brakujące wywołania east/archive pozostawiają gałąź lub połączoną dostawę bez plików; utwórz gałąź i połącz oba wyniki w zastosowanym archive. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=dag-independent-branch-and-joined-file)
diagnostics.probe_0_5: Bieżący routes output może nie istnieć lub różnić się od dwóch oczekiwanych tras przed obserwacją grafu; importy i inne błędy startu bez markera też dają fallback. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=dag-legacy-output-and-helper-fallback)
diagnostics.dag_dependencies: Stały tekst tras może pomijać rzeczywiste zależności; archive musi zależeć od obu gałęzi, a south od north. Brak celów state, błędy grafu/kontraktu lub limit graph też dają ten marker. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=dag-real-positive-resource-dependencies)
diagnostics.dag_contract: Stałe defaults lub powiązanie wyłącznie outputs może przejść trasę domyślną, lecz zawieść drugi profil; przekaż hub przez rzeczywiste pliki modułów i obie output-map dla każdego przypadku. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=dag-forward-both-caller-profiles)
diagnostics.dag_plan: Niezastosowane moduły, drift plików lub błąd plan daje niezerowy detailed plan; zastosuj poprawioną kompozycję i sprawdź pozostałe zmiany. [Przyczyna i kontrola](guides#guide=terraform-7.1&section=dag-final-converged-plan)
