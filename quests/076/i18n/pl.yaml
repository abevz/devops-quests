stages.0.objectives.4.text: '`south.txt`, `east.txt` i `archive.txt` spełniają domyślny kontrakt tras.'
stages.0.objectives.5.text: Outputy `routes` i `delivery_routes` spełniają kontrakt z rzeczywistymi zależnościami
