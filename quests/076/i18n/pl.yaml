title: Cykl zależności
brief: 'Dwa moduły lokalne są od siebie zależne: north zużywa south.route i south zużywa north.route.
  Zamierzony kierunek to dispatch → north → south. Przerwij tylko odwołanie wsteczne north, używając local.hub;
  utrzymuj połączenie south z north i zachowaj trasę outputs z zabezpieczeniem zasobów. Zatwierdź, sprawdź
  plan i złóż wniosek z offline local provider. Nie zastępuj outputs zakodowanymi na stałe ciągami znaków
  sukcesu.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `main.tf`, `modules/station/main.tf`,
  `north.txt`, `south.txt`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: Wykres jest acykliczny, dwa rzeczywiste pliki kodują dispatch:north i dispatch:north:south,
  outputs pasują, a końcowy plan jest pusty.


  Oryginalny moduł jest chroniony sumą kontrolną w `/run/dq/facts/0/original-module.sha256`; zachowaj
  swój outputs oparty na zasobach.'
debrief: Usunięto jedną zależność wsteczną, a zamierzony przepływ danych pozostał wyraźny.
stages.0.brief: 'Kryteria sukcesu: Wykres jest acykliczny, dwa rzeczywiste pliki kodują dispatch:north
  i dispatch:north:south, outputs pasują, a końcowy plan jest pusty.'
stages.0.objectives.0.text: Wykres jest acykliczny, dwa rzeczywiste pliki kodują dispatch:north i dispatch:north:south,
  outputs pasują, a końcowy plan jest pusty.
hints.0.text: Dane wyjściowe wspierane przez zasób mogą zawierać rzeczywistą zależność.
hints.1.text: Narysuj wymagany kierunek przed edycją odniesień.
hints.2.text: Zasil north z local.hub i zachowaj south zasilany z north.route.
phrases.0: Prześledziłem cykl poprzez moduł outputs oparty na zasobach.
phrases.1: Naprawiłem kierunek zależności zamiast ukrywać go za pomocą stałych.
phrases.2: Sprawdziłem zarówno wygenerowany artifacts, jak i końcowy plan.
