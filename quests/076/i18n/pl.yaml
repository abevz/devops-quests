title: Cykl zależności
brief: |-
  Konfiguracja modułów nie może wytworzyć pełnego połączonego dostarczenia. Odtwórz acykliczny graf tras, zachowując dostarczony moduł stacji z wyjściami opartymi na zasobach.

  Pracuj w `~/quest` na stacji roboczej z `main.tf`, `delivery.tf`, `modules/station/main.tf` i `route-cases.json`.

  **Wymagania:**

  - Dostarczona konfiguracja OpenTofu jest poprawna.
  - Dostarczony moduł stacji pozostaje niezmieniony, z wyjściami opartymi na zasobach.
  - State śledzi dokładnie cztery pliki kontraktu w czterech różnych instancjach modułów.
  - `north.txt` spełnia domyślny kontrakt tras.
  - `south.txt`, `east.txt` i `archive.txt` spełniają domyślny kontrakt tras.
  - Outputy `routes` i `delivery_routes` spełniają kontrakt z rzeczywistymi zależnościami upstream i poprawną propagacją każdego wejścia caller.
  - OpenTofu nie zgłasza oczekujących zmian infrastruktury.
  - Obecni są wszyscy odbiorcy tras i połączone dostarczenie określone kontraktem. Dalsze generatory zależą od używanych wyjść zasobów upstream; zgodność samych bieżących ciągów nie wystarczy.
  - Pliki stacji roboczej `~/quest/north.txt`, `~/quest/south.txt`, `~/quest/east.txt` i `~/quest/archive.txt` odpowiadają przypadkowi domyślnemu. `routes` zachowuje pierwotną mapę dwóch tras bez dodatkowych wpisów; `delivery_routes` zawiera dokładnie wynik niezależny i połączony.
  - Oba dostarczone przypadki hub dają wymagane zawartości zarządzanych plików w planach bez zastosowania. Zachowaj bajty dostarczonego modułu i nie dodawaj obcych zarządzanych obiektów.

  Kontrole badają bieżący state, zachowane artefakty i plany bez zastosowania; nie dowodzą zastosowania konkretnego planu ani pełnej historii poleceń.
debrief: Naprawa zbudowała niezależnego i zbierającego odbiorcę oraz usunęła cykl. Rzeczywista osiągalność
  grafu i plany dla innych wejść odróżniają powiązany przepływ zasobów od ciągów pasujących tylko do wartości
  domyślnej.
stages.0.brief: Odtwórz pełny acykliczny graf tras i jego połączone dostarczenie.
stages.0.objectives.0.text: Dostarczona konfiguracja OpenTofu jest poprawna.
stages.0.objectives.1.text: Dostarczony moduł stacji pozostaje niezmieniony, z wyjściami opartymi na zasobach.
stages.0.objectives.2.text: State śledzi dokładnie cztery pliki kontraktu w czterech różnych instancjach
