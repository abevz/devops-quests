title: Cykl zależności
brief: |
  Konfiguracja stacji nie tworzy wymaganych tras dyspozytorskich. Zachowaj dostarczony moduł stacji i jego wyniki oparte na zasobach.

  Pracuj w `~/quest` na workstation. Dostarczone pliki wejściowe: `main.tf`, `modules/station/main.tf`.

  **Wymagania:**
  - `tofu validate` kończy się powodzeniem.
  - Dostarczony moduł stacji i jego wyniki tras oparte na zasobach zostają zachowane.
  - Stan OpenTofu zawiera dokładnie:
    - `module.north.local_file.route`
    - `module.south.local_file.route`
  - Pliki w `~/quest` na workstation:
    - `north.txt`: `dispatch:north`
    - `south.txt`: `dispatch:north:south`
  - Wynik `routes` zawiera wyłącznie następujące przypisania stacji do tras:
    - `north`: `dispatch:north`
    - `south`: `dispatch:north:south`
  - `tofu plan` kończy się kodem `0` i nie wykazuje zmian.

  **Sprawdź samodzielnie przed Check & finish:**
  Wykonaj te polecenia obserwacyjne w `~/quest` na workstation.
  - Oczekiwane: poprawna walidacja, dokładnie dwa wymagane adresy i zgodna suma kontrolna dostarczonego modułu.

    ```sh
    tofu validate -no-color
    tofu state list
    sha256sum -c /run/dq/facts/0/original-module.sha256
    ```
  - Oczekiwane: oba pliki zawierają wymagane trasy, a wynik przypisuje dokładnie dwa wymagane klucze do tych tras.

    ```sh
    cat north.txt south.txt
    tofu output -json routes
    ```
  - `tofu plan -input=false -detailed-exitcode -no-color` — Oczekiwane: brak zmian i kod zakończenia `0`.

  Sprawdzenie weryfikuje oryginalną sumę kontrolną modułu z `/run/dq/facts/0/original-module.sha256` na workstation, a nie tylko zwracane teksty.
debrief: Usunięto jedną zależność wsteczną, a zamierzony przepływ danych pozostał wyraźny.
stages.0.brief: |
  Obie stacje mają publikować wymagane trasy z zachowaniem dostarczonego modułu.
stages.0.objectives.0.text: '`tofu validate` kończy się pomyślnie.'
stages.0.objectives.1.text: Moduł station zachowuje outputs tras oparte na zasobach.
stages.0.objectives.2.text: State zawiera dokładnie `module.north.local_file.route` i `module.south.local_file.route`.
stages.0.objectives.3.text: '`north.txt` zawiera `dispatch:north`.'
stages.0.objectives.4.text: '`south.txt` zawiera `dispatch:north:south`.'
stages.0.objectives.5.text: Output `routes` przypisuje `north` do `dispatch:north`, a `south` do `dispatch:north:south`,
  bez dodatkowych wpisów.
stages.0.objectives.6.text: '`tofu plan` kończy się kodem 0 bez zmian.'
hints.0.text: Dane wyjściowe wspierane przez zasób mogą zawierać rzeczywistą zależność.
hints.1.text: Narysuj wymagany kierunek przed edycją odniesień.
hints.2.text: |
  north korzysta z south.route, a south z north.route, tworząc cykl. Zasil north z local.hub i zachowaj połączenie south z north.route. Wymagany kierunek to dispatch → north → south.
phrases.0: Prześledziłem cykl poprzez moduł outputs oparty na zasobach.
phrases.1: Naprawiłem kierunek zależności zamiast ukrywać go za pomocą stałych.
phrases.2: Sprawdziłem zarówno wygenerowany artifacts, jak i końcowy plan.
