title: Ciclo de dependencia
brief: 'Dos módulos local dependen uno del otro: north consume south.route y south consume north.route.
  La dirección prevista es dispatch → north → south. Rompa solo la referencia anterior north utilizando
  local.hub; mantenga south conectado a north y mantenga el route outputs respaldado por recursos. Validar,
  inspect a plan y aplicar con el offline local provider. No reemplace outputs con cadenas de éxito codificadas.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `main.tf`, `modules/station/main.tf`,
  `north.txt`, `south.txt`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: el gráfico es acíclico, dos archivos reales codifican dispatch:north y
  dispatch:north:south, outputs coinciden y el último plan está vacío.


  El módulo original está protegido mediante suma de comprobación en `/run/dq/facts/0/original-module.sha256`;
  preservar su outputs respaldado por recursos.'
debrief: Se eliminó una dependencia hacia atrás mientras que el flujo de datos previsto permaneció explícito.
stages.0.brief: 'Criterios de éxito: el gráfico es acíclico, dos archivos reales codifican dispatch:north
  y dispatch:north:south, outputs coinciden y el último plan está vacío.'
stages.0.objectives.0.text: El gráfico es acíclico, dos archivos reales codifican dispatch:north y dispatch:north:south,
  outputs coinciden y el último plan está vacío.
hints.0.text: Un resultado respaldado por un recurso puede conllevar una dependencia real.
hints.1.text: Dibuja la dirección requerida antes de editar las referencias.
hints.2.text: Alimente north desde local.hub y mantenga south alimentado desde north.route.
phrases.0: Seguí el ciclo a través del módulo respaldado por recursos outputs.
phrases.1: Arreglé la dirección de dependencia en lugar de ocultarla con constantes.
phrases.2: Verifiqué tanto el artifacts generado como el plan final.
