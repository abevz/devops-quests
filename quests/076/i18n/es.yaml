title: Ciclo de dependencia
brief: |
  La configuración de estaciones no produce las rutas de despacho requeridas. Conserva el módulo de estación suministrado y sus salidas basadas en recursos.

  Trabaja en `~/quest` en la workstation. Archivos de entrada suministrados: `main.tf`, `modules/station/main.tf`.

  **Requisitos:**
  - `tofu validate` finaliza correctamente.
  - Se conservan el módulo de estación suministrado y sus salidas de rutas basadas en recursos.
  - El estado de OpenTofu contiene exactamente:
    - `module.north.local_file.route`
    - `module.south.local_file.route`
  - Archivos en `~/quest` en la workstation:
    - `north.txt`: `dispatch:north`
    - `south.txt`: `dispatch:north:south`
  - La salida `routes` contiene solo estas correspondencias de estaciones a rutas:
    - `north`: `dispatch:north`
    - `south`: `dispatch:north:south`
  - `tofu plan` termina con código `0` sin cambios.

  **Verifica antes de Check & finish:**
  Ejecuta estos comandos de observación desde `~/quest` en la workstation.
  - Se espera validación correcta, exactamente las dos direcciones requeridas y una comprobación correcta de la suma del módulo suministrado.

    ```sh
    tofu validate -no-color
    tofu state list
    sha256sum -c /run/dq/facts/0/original-module.sha256
    ```
  - Se espera que ambos archivos contengan las rutas requeridas y que la salida asigne exactamente las dos claves requeridas a esas rutas.

    ```sh
    cat north.txt south.txt
    tofu output -json routes
    ```
  - `tofu plan -input=false -detailed-exitcode -no-color` — Se esperan ausencia de cambios y código de salida `0`.

  La comprobación verifica la suma original del módulo de `/run/dq/facts/0/original-module.sha256` en la workstation, no solo las cadenas devueltas.
debrief: Se eliminó una dependencia hacia atrás mientras que el flujo de datos previsto permaneció explícito.
stages.0.brief: |
  Ambas estaciones deben publicar las rutas requeridas conservando el módulo suministrado.
stages.0.objectives.0.text: '`tofu validate` termina correctamente.'
stages.0.objectives.1.text: El módulo station conserva sus outputs de rutas respaldados por recursos.
stages.0.objectives.2.text: El state contiene exactamente `module.north.local_file.route` y `module.south.local_file.route`.
stages.0.objectives.3.text: '`north.txt` contiene `dispatch:north`.'
stages.0.objectives.4.text: '`south.txt` contiene `dispatch:north:south`.'
stages.0.objectives.5.text: El output `routes` asocia `north` con `dispatch:north` y `south` con `dispatch:north:south`,
  sin entradas adicionales.
stages.0.objectives.6.text: '`tofu plan` termina con código 0 sin cambios.'
hints.0.text: Un resultado respaldado por un recurso puede conllevar una dependencia real.
hints.1.text: Dibuja la dirección requerida antes de editar las referencias.
hints.2.text: |
  north consume south.route y south consume north.route, creando un ciclo. Alimenta north desde local.hub y mantén south conectado a north.route. La dirección prevista es dispatch → north → south.
phrases.0: Seguí el ciclo a través del módulo respaldado por recursos outputs.
phrases.1: Arreglé la dirección de dependencia en lugar de ocultarla con constantes.
phrases.2: Verifiqué tanto el artifacts generado como el plan final.
