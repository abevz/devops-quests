title: Ciclo de dependencia
brief: |-
  La configuración de módulos no puede producir la entrega combinada completa. Recupera un grafo de rutas acíclico conservando el módulo de estación con salidas respaldadas por recursos.

  Trabaja en `~/quest` en la estación con `main.tf`, `delivery.tf`, `modules/station/main.tf` y `route-cases.json`.

  **Requisitos:**

  - La configuración OpenTofu suministrada es válida.
  - El módulo de estación suministrado permanece intacto y sus outputs están respaldados por recursos.
  - State registra exactamente los cuatro archivos del contrato en cuatro instancias de módulos distintas.
  - `north.txt` cumple el contrato de rutas predeterminado.
  - `south.txt`, `east.txt` y `archive.txt` cumplen el contrato de rutas predeterminado.
  - Los outputs `routes` y `delivery_routes` cumplen el contrato, con dependencias upstream reales y propagación correcta de cada valor caller.
  - OpenTofu no indica cambios de infraestructura pendientes.
  - Están presentes todos los consumidores de rutas y la entrega combinada del contrato. Los productores downstream dependen de los outputs upstream respaldados por recursos que consumen; coincidir en las cadenas actuales no basta.
  - Los archivos `~/quest/north.txt`, `~/quest/south.txt`, `~/quest/east.txt` y `~/quest/archive.txt` en la estación cumplen el caso predeterminado. `routes` conserva el mapa original de dos rutas sin entradas extra; `delivery_routes` contiene exactamente los resultados independiente y combinado.
  - Ambos casos hub suministrados producen sus contenidos administrados en planes sin aplicar. Conserva los bytes del módulo y no añadas objetos administrados ajenos.

  Las comprobaciones inspeccionan state actual, artefactos conservados y planes sin aplicar; no demuestran qué plan exacto se aplicó ni todo el historial de comandos.
debrief: La reparación construyó los consumidores independiente y combinado además de quitar el ciclo.
  La alcanzabilidad real y los planes alternativos distinguen el flujo conectado de cadenas que solo coinciden
  en el caso predeterminado.
stages.0.brief: Recupera el grafo acíclico completo y su entrega combinada.
stages.0.objectives.0.text: La configuración OpenTofu suministrada es válida.
stages.0.objectives.1.text: El módulo de estación suministrado permanece intacto y sus outputs están respaldados
  por recursos.
stages.0.objectives.2.text: State registra exactamente los cuatro archivos del contrato en cuatro instancias
  de módulos distintas.
stages.0.objectives.3.text: '`north.txt` cumple el contrato de rutas predeterminado.'
stages.0.objectives.4.text: '`south.txt`, `east.txt` y `archive.txt` cumplen el contrato de rutas predeterminado.'
stages.0.objectives.5.text: Los outputs `routes` y `delivery_routes` cumplen el contrato, con dependencias
  upstream reales y propagación correcta de cada valor caller.
stages.0.objectives.6.text: OpenTofu no indica cambios de infraestructura pendientes.
hints.0.text: Un output respaldado por un recurso transmite valor y dependencia. Completar un grafo exige
  sus consumidores ausentes además de quitar una arista inversa.
hints.1.text: |-
  Compara errores de validación, declaraciones raíz, salidas de entrega y casos de rutas. Traza la dirección requerida de cada output consumido antes de editar referencias.

  Localiza en las llamadas raíz las referencias a salidas respaldadas por recursos. Usa los casos de ruta para comparar las dependencias entrantes esperadas de la ruta combinada con la dependencia inversa existente.

  ```sh
  tofu validate -no-color
  cat main.tf delivery.tf
  cat route-cases.json
  ```
hints.2.text: |-
  Verifica cuatro instancias, caminos reales, ambos mapas y cada caso caller sin aplicar la prueba; el plan predeterminado final debe estar vacío.

  ```sh
  tofu graph
  tofu output -json routes
  tofu output -json delivery_routes
  tofu plan -input=false -detailed-exitcode -no-color
  ```

  En cada caso, compara los archivos gestionados y ambos mapas de salida con `route-cases.json`. Los planes temporales se usan para inspección y quedan sin aplicar.

  ```sh
  (
    set -euo pipefail
    probe=$(mktemp -d)
    trap 'rm -rf -- "$probe"' EXIT
    variable=$(jq -er .variable route-cases.json)
    jq -er '.cases[].input' route-cases.json | while IFS= read -r value; do
      tofu plan -input=false -refresh=false -no-color -var="$variable=$value" -out="$probe/case.plan"
      tofu show -json "$probe/case.plan" | jq --arg value "$value" '
        .planned_values | {input:$value,
          files:[.root_module | recurse(.child_modules[]?) | .resources[]?
            | select(.mode=="managed" and .type=="local_file") | {address,path:.values.filename,content:.values.content}],
          routes:.outputs.routes.value, delivery_routes:.outputs.delivery_routes.value}'
    done
  )
  ```
phrases.0: Seguí el ciclo a través del módulo respaldado por recursos outputs.
phrases.1: Arreglé la dirección de dependencia en lugar de ocultarla con constantes.
phrases.2: Verifiqué tanto el artifacts generado como el plan final.
diagnostics.dag_validate: El root suministrado crea ciclo entre north y south y referencia east/archive ausentes; corrija llamadas raíz antes de validar otra vez. [Causa y comprobación](guides#guide=terraform-7.1&section=dag-root-cycle-and-missing-calls)
diagnostics.dag_module_source: Editar módulo hijo cambia checksum fijado; corrija composición en root conservando modules/station/main.tf intacto. [Causa y comprobación](guides#guide=terraform-7.1&section=dag-preserve-supplied-child-module)
diagnostics.probe_0_2: Configuración y outputs solos no crean recursos aplicados; state requiere cuatro instancias de módulos distintas para cuatro archivos. Fallo tofu show, JSON inválido o rutas sin resolver también dan fallback. [Causa y comprobación](guides#guide=terraform-7.1&section=dag-four-distinct-managed-module-targets)
diagnostics.dag_north: La primera ruta puede no aplicarse o usar upstream incorrecto; north.txt debe reflejar hub por defecto seguido de north. [Causa y comprobación](guides#guide=terraform-7.1&section=dag-applied-north-route)
diagnostics.dag_south: La ruta dependiente puede omitir north o quedar sin aplicar; south.txt debe llevar resultado north seguido de south. [Causa y comprobación](guides#guide=terraform-7.1&section=dag-applied-dependent-south-route)
diagnostics.dag_delivery: Llamadas east/archive ausentes dejan rama o entrega unida sin archivos; construya rama y una ambos resultados upstream en archive aplicado. [Causa y comprobación](guides#guide=terraform-7.1&section=dag-independent-branch-and-joined-file)
diagnostics.probe_0_5: El routes output actual puede faltar o diferir de dos rutas esperadas antes del observer del grafo; imports u otros errores de inicio sin marcador también dan fallback. [Causa y comprobación](guides#guide=terraform-7.1&section=dag-legacy-output-and-helper-fallback)
diagnostics.dag_dependencies: Texto de rutas fijo puede omitir dependencias reales; archive debe depender de ambas ramas y south de north. Objetivos state ausentes, errores de grafo/contrato o tiempo graph también usan este marcador. [Causa y comprobación](guides#guide=terraform-7.1&section=dag-real-positive-resource-dependencies)
diagnostics.dag_contract: Defaults fijos o conexiones solo de outputs pasan ruta inicial pero fallan segundo perfil; propague hub por archivos de módulos reales y ambos output-map en cada caso suministrado. [Causa y comprobación](guides#guide=terraform-7.1&section=dag-forward-both-caller-profiles)
diagnostics.dag_plan: Módulos sin aplicar, drift de archivos o error plan dejan detailed plan no cero; aplique composición corregida y revise cambios restantes. [Causa y comprobación](guides#guide=terraform-7.1&section=dag-final-converged-plan)
