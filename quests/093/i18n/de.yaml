title: Vault-Wiederherstellung
brief: 'Arbeite in `~/quest` mit `platform.env`, `vault-agent-status.json`, `unseal-shares.json` und `original-cluster-id`. Der private Spiel-Vault-Prozess ist gestoppt, aber initialisierter Speicher ist vorhanden. Schreibe genau `{"action":"start"}` nach `vault-repair.json`; der begrenzte Agent der Umgebung startet ihren vorhandenen Vault. Warte, bis der Initialisierungsendpunkt erreichbar ist. Gib niemals Anteile oder Tokens aus, rufe sys/init nicht zur erneuten Initialisierung auf und ersetze den Speicher nicht. Die verlinkte Vault-Anleitung erklärt Agent, Unseal-Anfragen und KV-v2-Lesezugriffe.


  Sende nach dem Start die zwei verschiedenen bereitgestellten Anteile an `/v1/sys/unseal` und halte `unseal-shares.json` auf Modus `0600`. Prüfe, dass `/v1/sys/seal-status` `initialized=true`, `sealed=false`, `t=2` und `n=3` meldet und seine Cluster-ID `/run/dq/facts/0/original-cluster-id` entspricht. Das reader-Token muss `north-secret` als `.data.data.value` aus `secret/data/dispatch` lesen; das manager-Token muss für denselben Pfad HTTP 403 erhalten. Die Prüfungen beobachten aktuellen Status, Identität und Zugriff; sie beweisen weder die genaue Startanfrage noch die gesamte Speichergeschichte. Nutze nur diese Offline-Spielumgebung.'
debrief: Initialisierung, Siegelstatus, gespeicherte Cluster-ID, Zugriffsergebnisse und Modus der Anteildatei entsprachen den Prüfungen.
stages.0.brief: Der Initialisierungsendpunkt ist erreichbar und meldet initialized=true.
stages.0.objectives.0.text: Der Initialisierungsendpunkt ist erreichbar und meldet initialized=true.
stages.1.brief: Siegelstatus und Cluster-ID, reader-Wert, manager-Ablehnung und Modus der Anteildatei stimmen mit der Aufgabe überein.
stages.1.objectives.0.text: Siegelstatus und Cluster-ID, reader-Wert, manager-Ablehnung und Modus der Anteildatei stimmen mit der Aufgabe überein.
hints.0.text: Gestoppt, versiegelt und nicht initialisiert sind unterschiedliche Zustände.
hints.1.text: Starte den vorhandenen Prozess, bevor du die beiden Anteile verwendest.
hints.2.text: Prüfe nach dem Entsiegeln die ursprüngliche Cluster-ID und die vorhandenen Daten für reader.
phrases.0: Ich habe die Prozessverfügbarkeit vom Siegelstatus unterschieden.
phrases.1: Ich habe den initialisierten und entsiegelten Status geprüft, ohne Anteile auszugeben.
phrases.2: Ich habe die Cluster-ID verglichen und den Zugriff von reader und manager geprüft.
