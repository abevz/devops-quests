title: Vault-Wiederherstellung
brief: |-
  Der vorhandene private Vault ist nicht erreichbar. Stellen Sie seine ursprüngliche Identität und den Zugriff auf gespeicherte Daten wieder her.

  Arbeiten Sie auf der Workstation in `~/quest` mit `platform.env`, `vault-repair.json`, `vault-agent-status.json`, `unseal-shares.json`.

  **Requirements:**

  - Stufe 1:
    - Der Initialisierungsendpunkt des Trainings-Vault ist erreichbar und meldet initialized `true`.

  - Stufe 2:
    - Der vorhandene Vault ist initialisiert und entsiegelt und behält seine ursprüngliche Cluster-Identität und Entsiegelungskonfiguration.
    - Die bereitgestellte Reader-Identität ruft den vorhandenen Dispatch-Wert `north-secret` aus Vault ab.
    - Die bereitgestellte Manager-Identität erhält HTTP `403` beim Abruf der vorhandenen Dispatch-Daten.
    - Die Workstation-Datei `~/quest/unseal-shares.json` hat Modus `0600`.

  Die Prüfungen beobachten aktuellen Status, Identität und Zugriff; sie beweisen weder die genaue Startanfrage noch die vollständige Speicherhistorie.
debrief: Initialisierung, Siegelstatus, gespeicherte Cluster-ID, Zugriffsergebnisse und Modus der Anteildatei
  entsprachen den Prüfungen.
stages.0.brief: Stellen Sie den Initialisierungsendpunkt des vorhandenen Vault wieder her.
stages.1.brief: Stellen Sie den ursprünglichen entsiegelten Vault mit der geforderten Zugriffsgrenze wieder
  her.
hints.0.text: Gestoppt, versiegelt und nicht initialisiert sind unterschiedliche Zustände.
hints.1.text: |-
  Prüfen Sie Prozessstatus und Versiegelungszustand ohne Ausgabe von Anteilen oder Tokens.

  ```bash
  cat vault-agent-status.json
  source platform.env
  curl -fsS "$VAULT_ADDR/v1/sys/seal-status"
  ```
hints.2.text: |-
  Prüfe nach dem Entsiegeln die ursprüngliche Cluster-ID und die vorhandenen Daten für reader. Schreiben Sie genau `{"action":"start"}` in `vault-repair.json`; der begrenzte Agent startet den vorhandenen Vault bei der nächsten Abfrage. Senden Sie die zwei unterschiedlichen bereitgestellten Anteile an `/v1/sys/unseal`; initialisieren Sie nicht erneut und ersetzen Sie den Speicher nicht. Starte den vorhandenen Prozess, bevor du die beiden Anteile verwendest.

  Prüfen Sie in `~/quest` auf der Workstation:

  - `source platform.env`
  - `curl -fsS "$VAULT_ADDR/v1/sys/init" | jq -e '.initialized == true'`

  Stufe 1: `true`.

  - `source platform.env`
  - `curl -fsS "$VAULT_ADDR/v1/sys/seal-status" | jq '{initialized,sealed,t,n,cluster_id}'`

  Stufe 2: `initialized: true`, `sealed: false`, `t: 2`, `n: 3`; `cluster_id` entspricht dem eingefrorenen Original.

  - `source platform.env`
  - `curl -fsS -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch" | jq -e '.data.data.value == "north-secret"' >/dev/null`
  - `curl -sS -o /dev/null -w '%{http_code}\n' -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_MANAGER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch"`
  - `stat -c %a unseal-shares.json`

  Stufe 2: Exit `0`; keine Zugangsdaten oder geheimen Werte werden ausgegeben. Manager meldet `403`; die Anteilsdatei meldet `600`.
phrases.0: Ich habe die Prozessverfügbarkeit vom Siegelstatus unterschieden.
phrases.1: Ich habe den initialisierten und entsiegelten Status geprüft, ohne Anteile auszugeben.
phrases.2: Ich habe die Cluster-ID verglichen und den Zugriff von reader und manager geprüft.
diagnostics.init: Vault sys/init initialized muss true sein.
diagnostics.initialized: Vault sys/seal-status initialized muss true sein.
diagnostics.sealed: Vault sys/seal-status sealed muss false sein.
diagnostics.cluster: Die nichtleere original-cluster-id muss Vault cluster_id entsprechen.
diagnostics.threshold: Vault sys/seal-status t muss 2 sein.
diagnostics.shares: Vault sys/seal-status n muss 3 sein.
diagnostics.reader: Das Reader-Token muss north-secret aus secret/data/dispatch lesen.
diagnostics.manager: Die Anfrage mit dem Manager-Token an secret/data/dispatch muss HTTP 403 liefern.
diagnostics.mode: Der Modus von unseal-shares.json muss 0600 sein.
stages.0.objectives.0.text: Der Initialisierungsendpunkt des Trainings-Vault ist erreichbar und meldet
  initialized `true`.
stages.1.objectives.0.text: Der vorhandene Vault ist initialisiert und entsiegelt und behält seine ursprüngliche
  Cluster-Identität und Entsiegelungskonfiguration.
stages.1.objectives.1.text: Die bereitgestellte Reader-Identität ruft den vorhandenen Dispatch-Wert `north-secret`
  aus Vault ab.
stages.1.objectives.2.text: Die bereitgestellte Manager-Identität erhält HTTP `403` beim Abruf der vorhandenen
  Dispatch-Daten.
stages.1.objectives.3.text: Die Workstation-Datei `~/quest/unseal-shares.json` hat Modus `0600`.
