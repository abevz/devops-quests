title: Vault-Wiederherstellung
brief: 'Stellen Sie den nicht erreichbaren ursprünglichen Vault und die Publikation durch beide bestehenden Anwendungen
  wieder her. Bewahren Sie Clusteridentität, Quorum und private Anteile. Der Manager darf die Quelle weiterhin nicht
  lesen. Die zweite Anwendung muss die freigegebene Publikation von der ursprünglichen ersten beziehen; erhalten
  Sie beide Prozesse. Die Dienststeuerung beschreibt `control/README.md`.


  Arbeiten Sie in `~/quest`. Das Verbraucherverzeichnis enthält Konfiguration, PID und Anwendungsprotokoll. `consumer/README.md`
  beschreibt die Schnittstelle; `consumer-contract.json` dokumentiert ursprüngliche Prozesse, freigegebene Quelle,
  Publikationshash und Version. Bewahren Sie Programm, Prozessidentität und Rechte. Jeder Verbraucher muss die freigegebene
  Publikation über seinen vorhandenen HTTP-Endpunkt mit der ursprünglichen Quelle und privaten Reader-Identität
  liefern. Ein manueller Quellenabruf reicht nicht. Zugangsdaten müssen reguläre Dateien des Workstation-Benutzers
  mit Modus `0600` bleiben. Keine Geheimnisse oder Zugangsdaten ausgeben.


  **Anforderungen:**


  - Phase 1: Der Initialisierungsendpunkt des Trainings-Vault ist erreichbar und meldet initialized `true`.

  - Phase 2: Der vorhandene Vault ist initialisiert und entsiegelt und behält seine ursprüngliche Cluster-Identität
  und Entsiegelungskonfiguration.

  - Phase 2: Beide ursprünglichen Anwendungen liefern die freigegebene Publikation entlang der dokumentierten Quellenkette.

  - Phase 2: Die bereitgestellte Manager-Identität erhält HTTP `403` beim Abruf der vorhandenen Dispatch-Daten.

  - Phase 2: Die Workstation-Datei `~/quest/unseal-shares.json` hat Modus `0600`.'
debrief: Quellen- und Verbraucheridentitäten blieben erhalten; laufende Anwendungen übernahmen die freigegebene
  Publikation.
stages.0.brief: Stellen Sie den Initialisierungsendpunkt des vorhandenen Vault wieder her.
stages.1.brief: Stellen Sie den nicht erreichbaren ursprünglichen Vault und die Publikation durch beide bestehenden
  Anwendungen wieder her. Bewahren Sie Clusteridentität, Quorum und private Anteile. Der Manager darf die Quelle
  weiterhin nicht lesen. Die zweite Anwendung muss die freigegebene Publikation von der ursprünglichen ersten beziehen;
  erhalten Sie beide Prozesse. Die Dienststeuerung beschreibt `control/README.md`.
hints.0.text: Serververfügbarkeit, Berechtigung und übernommene Verbraucherpublikation sind getrennte Beobachtungen.
hints.1.text: 'Vergleichen Sie Live-Antwort, Quellenprofile, Anwendungsprotokolle und ursprünglichen Vertrag. Verfolgen
  Sie zuerst die fehlerhafte Grenze.


  ```bash

  cat consumer/source.json consumer/application.log consumer-contract.json

  curl -fsS --max-time 2 http://127.0.0.1:18081/status

  ```


  ```bash

  cat downstream/source.json downstream/application.log

  curl -fsS --max-time 2 http://127.0.0.1:18082/status

  ```'
hints.2.text: 'Prüfe nach dem Entsiegeln die ursprüngliche Cluster-ID und die vorhandenen Daten für reader. Schreiben
  Sie genau `{"action":"start"}` in `vault-repair.json`; der begrenzte Agent startet den vorhandenen Vault bei der
  nächsten Abfrage. Senden Sie die zwei unterschiedlichen bereitgestellten Anteile an `/v1/sys/unseal`; initialisieren
  Sie nicht erneut und ersetzen Sie den Speicher nicht. Starte den vorhandenen Prozess, bevor du die beiden Anteile
  verwendest.


  Prüfen Sie in `~/quest` auf der Workstation:


  - `source platform.env`

  - `curl -fsS "$VAULT_ADDR/v1/sys/init" | jq -e ''.initialized == true''`


  Stufe 1: `true`.


  - `source platform.env`

  - `curl -fsS "$VAULT_ADDR/v1/sys/seal-status" | jq ''{initialized,sealed,t,n,cluster_id}''`


  Stufe 2: `initialized: true`, `sealed: false`, `t: 2`, `n: 3`; `cluster_id` entspricht dem eingefrorenen Original.


  - `source platform.env`

  - `curl -fsS -H @<(printf ''X-Vault-Token: %s\n'' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch"
  | jq -e ''.data.data.value == "north-secret"'' >/dev/null`

  - `curl -sS -o /dev/null -w ''%{http_code}\n'' -H @<(printf ''X-Vault-Token: %s\n'' "$VAULT_MANAGER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch"`

  - `stat -c %a unseal-shares.json`


  Stufe 2: Exit `0`; keine Zugangsdaten oder geheimen Werte werden ausgegeben. Manager meldet `403`; die Anteilsdatei
  meldet `600`.


  Profil auf freigegebene API-Quelle und Reader-Zugangsdaten einstellen. Private Datei bewahren und SIGHUP an die
  bestehende PID senden; Manager ist eine andere Identität. HTTP-Publikation prüfen. Erwartet: OK.


  ```bash

  set -euo pipefail

  cd ~/quest

  curl -fsS --max-time 2 http://127.0.0.1:18081/ > observed-publication.json

  python3 -I - <<''VERIFY_PUBLICATION''

  import json

  from pathlib import Path

  contract=json.loads(Path(''consumer-contract.json'').read_text())

  observed=json.loads(Path(''observed-publication.json'').read_text())

  assert observed[''ready''] is True

  assert observed[''source'']==contract[''vault_url'']

  assert observed[''path'']==contract[''path'']

  assert observed[''value_sha256'']==contract[''value_sha256'']

  assert observed[''version'']==contract[''version'']

  print(''OK'')

  VERIFY_PUBLICATION

  ```


  Beide ursprünglichen Anwendungen liefern die freigegebene Publikation entlang der dokumentierten Quellenkette.


  ```bash

  set -euo pipefail

  curl -fsS --max-time 2 http://127.0.0.1:18081/ > primary.json

  curl -fsS --max-time 2 http://127.0.0.1:18082/ > secondary.json

  jq -e --slurpfile first primary.json '' .ready==true and .source=="http://127.0.0.1:18081" and .version==$first[0].version
  and .value_sha256==$first[0].value_sha256'' secondary.json

  ```

  Erwartet: true. Quelle der zweiten Anwendung korrigieren und nach Bereitschaft der ersten SIGHUP an ihre ursprüngliche
  PID senden.'
phrases.0: Ich habe die Prozessverfügbarkeit vom Siegelstatus unterschieden.
phrases.1: Ich habe den initialisierten und entsiegelten Status geprüft, ohne Anteile auszugeben.
phrases.2: Ich habe die Cluster-ID verglichen und den Zugriff von reader und manager geprüft.
