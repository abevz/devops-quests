guides.reference_2: Referenz zur Publikations- und Verbraucherprüfung
diagnostics.init: Setup stoppt den bereits initialisierten Original-Vault; ein unerreichbarer Endpunkt verlangt keine neue Initialisierung. Senden Sie die begrenzte Startanfrage aus control/README.md und prüfen Sie erneut. Anfragefehler, ungültige Antwort oder initialized false erzeugen diesen Marker; die Agentenquittung allein beweist keine Dienstgesundheit. [Ursache und Prüfung](guides#guide=vault-recovery&section=original-vault-start-existing-service)
diagnostics.initialized: "Der Original-Vault ist bereits initialisiert. Ein gestoppter Dienst, fehlgeschlagener Aufruf von seal-status oder unlesbares JSON verletzt ebenfalls initialized; stellen Sie Erreichbarkeit her und prüfen Sie den Status vor Datenänderungen. Neuinitialisierung oder Speicherersatz kann benötigte Identitäten zerstören. [Ursache und Prüfung](guides#guide=vault-recovery&section=original-vault-observe-original-initialization)"
diagnostics.sealed: Das Starten des Prozesses lässt den bestehenden Speicher versiegelt. Übermitteln Sie die zwei unterschiedlichen gelieferten Anteile über die API, ohne sie auszugeben; einer genügt nicht. Eine fehlerhafte Statusabfrage oder Antwort verletzt ebenfalls sealed false. [Ursache und Prüfung](guides#guide=vault-recovery&section=original-vault-unseal-original-cluster)
diagnostics.cluster: Ein Ersatz-Vault oder neu initialisierter Speicher kann erreichbar und entsiegelt sein, aber eine andere Cluster-ID haben. Stellen Sie Originaldienst und Speicher wieder her; vergleichen Sie cluster_id mit dem eingefrorenen original-cluster-id. Fehlende Eingabe oder Statusfehler scheitern ebenfalls. [Ursache und Prüfung](guides#guide=vault-recovery&section=original-vault-retain-cluster-identity)
diagnostics.threshold: Die ursprüngliche Initialisierung verwendet Schwelle t gleich 2 und insgesamt n gleich 3 Anteile. Neuinitialisierung oder ein anderer Endpunkt kann andere Werte liefern; stellen Sie die Originalquelle her und prüfen Sie die Antwort. Anfrage- oder JSON-Fehler scheitern ebenfalls; Anteilwerte müssen nicht ausgegeben werden. [Ursache und Prüfung](guides#guide=vault-recovery&section=original-vault-retain-recovery-quorum)
diagnostics.shares: Die ursprüngliche Initialisierung verwendet Schwelle t gleich 2 und insgesamt n gleich 3 Anteile. Neuinitialisierung oder ein anderer Endpunkt kann andere Werte liefern; stellen Sie die Originalquelle her und prüfen Sie die Antwort. Anfrage- oder JSON-Fehler scheitern ebenfalls; Anteilwerte müssen nicht ausgegeben werden. [Ursache und Prüfung](guides#guide=vault-recovery&section=original-vault-retain-recovery-quorum)
diagnostics.reader: "Die Quellenabfrage scheitert bei gestopptem oder versiegeltem Vault, falscher Reader-Identität oder falschem Pfad beziehungsweise einem Wert ungleich north-secret. Prüfen Sie den gelieferten Reader über einen privaten Header-Kanal; Quellenzugriff beweist noch keine Cache-Aktualisierung der Anwendungen. [Ursache und Prüfung](guides#guide=vault-recovery&section=original-vault-reader-source-boundary)"
diagnostics.manager: Reader statt Manager zu verwenden oder dem Manager Quellenzugriff zu gewähren verletzt die geforderte Ablehnung. Verwenden Sie die getrennte gelieferte Manager-Identität und erwarten Sie HTTP 403 am dispatch-Pfad; Netzwerkfehler, versiegelte Quelle und andere Codes scheitern ebenfalls. [Ursache und Prüfung](guides#guide=vault-recovery&section=original-vault-manager-remains-denied)
diagnostics.mode: unseal-shares.json fehlt möglicherweise oder erhielt bei der Wiederherstellung andere Rechte. Stellen Sie 0600 her, ohne Inhalte auszugeben. Diese Bedingung vergleicht nur den Modus, nicht die JSON-Struktur, und verlangt kein anderes Entsiegelungsquorum. [Ursache und Prüfung](guides#guide=vault-recovery&section=original-vault-private-share-file-mode)
diagnostics.probe_1_1: Vault-Zugriff aktualisiert keine Anwendung automatisch. Die erste verwendet anfangs den abgewiesenen manager token; korrigieren Sie exaktes Profil und private reguläre Reader-Datei mit UID 1000 und Modus 0600, dann SIGHUP an den Originalprozess. Korrigieren Sie die veraltete Downstream-URL und aktualisieren Sie dessen Originalprozess nach Bereitschaft der ersten. Prüfen Sie Status, Logs und eingefrorene digest/version; Prozess-, Programm- oder Rechteänderungen, ungültige Eingaben und unbenannte Beobachtungs- oder Timeoutfehler nutzen denselben Fallback. [Ursache und Prüfung](guides#guide=vault-recovery&section=original-vault-cached-consumer-chain)
diagnostics.probe_0_0: Die Bedingung scheiterte vor benannten Vault-Beobachtungen, etwa wegen fehlender, unlesbarer oder fehlerhaft ladbarer platform.env. Stellen Sie gelieferte Umgebung und Workspace her; gewöhnliche HTTP-, Status- oder Wertfehler sind bereits benannt. Der Fallback erscheint nur ohne vorhandenen Marker, die private Header-Bereinigung bleibt im ursprünglichen Kindprozess. [Ursache und Prüfung](guides#guide=vault-recovery&section=original-vault-early-platform-input)
