title: Vault-Wiederherstellung
brief: 'Der private Vault-Prozess der Übung ist gestoppt, sein initialisierter Dateispeicher ist aber
  noch vorhanden. Fordere seinen Start an, indem du exakt {"action":"start"} in vault-repair.json schreibst.
  Der eingeschränkte Übungsagent kann nur den vorhandenen Vault-Container dieses Übungsbereichs starten;
  er kann den Speicher weder initialisieren noch ersetzen. Prüfe nach Erreichen des Dienstes den Zustand
  initialized/sealed und verwende die beiden bereitgestellten Übungs-Schlüsselanteile. Stelle die ursprüngliche
  cluster ID, das reader-Token und die KV-Daten wieder her. Rufe sys/init niemals erneut auf und ersetze
  den bestehenden Vault nicht durch einen neuen.


  Questdateien in `~/quest` (einige erscheinen in späteren Phasen): `platform.env`, `vault-repair.json`,
  `vault-agent-status.json`, `unseal-shares.json`, `original-cluster-id`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: Der bestehende Spielprozess Vault wird gestartet; Die Wiederherstellung erfolgt
  mit dem ursprünglichen Speicher.'
debrief: Der Prozess und seal wurden wiederhergestellt, ohne dass der initialisierte Speicher neu erstellt
  wurde.
stages.0.brief: 'Erfolgskriterium: Der Prozess des vorhandenen Spiels Vault wird gestartet. Die Wiederherstellung
  erfolgt mit dem ursprünglichen Speicher.'
stages.0.objectives.0.text: Der vorhandene Spielprozess Vault wird gestartet; Die Wiederherstellung erfolgt
  mit dem ursprünglichen Speicher.
stages.1.brief: 'Erfolgskriterien: Der ursprünglich initialisierte Vault wird entsiegelt und der alte
  reader ruft seinen vorhandenen KV-Wert ab; Der manager kann es immer noch nicht lesen.'
stages.1.objectives.0.text: Der ursprünglich initialisierte Vault wird entsiegelt und der alte reader
  ruft seinen vorhandenen KV-Wert ab; Der manager kann es immer noch nicht lesen.
hints.0.text: Gestoppt, sealed und nicht initialisiert sind unterschiedliche Zustände.
hints.1.text: Starte den vorhandenen Prozess, bevor du die beiden Unseal-Schlüsselanteile verwendest.
hints.2.text: Überprüfen Sie die ursprünglichen cluster ID und vorhandenen reader-Daten nach unseal.
phrases.0: Ich habe die Prozessverfügbarkeit vom seal-Status unterschieden.
phrases.1: Ich habe den initialisierten Speicher wiederhergestellt, ohne Vault neu zu initialisieren.
phrases.2: Ich habe den ursprünglichen Cluster identity und den vorhandenen credentials überprüft.
