title: Odzyskiwanie Vault
brief: 'Odzyskaj niedostępny pierwotny Vault i publikację przez obie istniejące aplikacje. Zachowaj tożsamość klastra,
  kworum i prywatne udziały. Manager nadal nie może czytać źródła. Druga aplikacja ma udostępniać zatwierdzoną publikację
  pierwotnej pierwszej aplikacji; zachowaj oba procesy. Interfejs sterowania opisuje `control/README.md`.


  Pracuj w `~/quest`. Katalog konsumenta zawiera konfigurację, PID i dziennik aplikacji. `consumer/README.md` opisuje
  interfejs; `consumer-contract.json` zapisuje pierwotne procesy, zatwierdzone źródło, skrót publikacji i wersję.
  Zachowaj programy, tożsamości i uprawnienia procesów. Każdy konsument ma udostępniać zatwierdzoną publikację przez
  istniejący HTTP, z pierwotnego źródła i dostarczoną prywatną tożsamością reader. Ręczny odczyt źródła nie wystarcza.
  Dane uwierzytelniające muszą być zwykłymi plikami użytkownika workstation z trybem `0600`. Nie wypisuj sekretów
  ani danych uwierzytelniających.


  **Wymagania:**


  - Etap 1: Endpoint inicjalizacji ćwiczebnego Vault jest osiągalny i zgłasza initialized `true`.

  - Etap 2: Istniejący Vault jest zainicjalizowany i unsealed, zachowując pierwotną tożsamość klastra i konfigurację
  unseal.

  - Etap 2: Obie pierwotne aplikacje udostępniają zatwierdzoną publikację przez udokumentowany łańcuch źródeł.

  - Etap 2: Dostarczona tożsamość manager otrzymuje HTTP `403`, żądając istniejących danych dispatch.

  - Etap 2: Plik `~/quest/unseal-shares.json` na workstation ma tryb `0600`.'
debrief: Zachowano tożsamości źródła i konsumentów; aplikacje przyjęły zatwierdzoną publikację.
stages.0.brief: Przywróć endpoint inicjalizacji istniejącego Vault.
stages.1.brief: Odzyskaj niedostępny pierwotny Vault i publikację przez obie istniejące aplikacje. Zachowaj tożsamość
  klastra, kworum i prywatne udziały. Manager nadal nie może czytać źródła. Druga aplikacja ma udostępniać zatwierdzoną
  publikację pierwotnej pierwszej aplikacji; zachowaj oba procesy. Interfejs sterowania opisuje `control/README.md`.
hints.0.text: Dostępność serwera, autoryzacja i publikacja przyjęta przez konsumenta są odrębnymi obserwacjami.
hints.1.text: |-
  Porównaj odpowiedź usługi, profile źródeł, dzienniki aplikacji i pierwotny kontrakt. Najpierw prześledź pierwszą uszkodzoną granicę.

  Odszukaj dotychczasową tożsamość klastra i stan procesu w kontrakcie źródła oraz obserwacji agenta naprawy. Sprawdź dostępność procesu i jego stan inicjalizacji lub zapieczętowania.

  ```bash
  cat consumer/source.json consumer/application.log consumer-contract.json
  curl -fsS --max-time 2 http://127.0.0.1:18081/status
  ```

  ```bash
  cat downstream/source.json downstream/application.log
  curl -fsS --max-time 2 http://127.0.0.1:18082/status
  ```
hints.2.text: |-
  Sprawdź z `~/quest` na workstation:

  - `source platform.env`
  - `curl -fsS "$VAULT_ADDR/v1/sys/init" | jq -e '.initialized == true'`

  Etap 1: `true`.

  - `source platform.env`
  - `curl -fsS "$VAULT_ADDR/v1/sys/seal-status" | jq '{initialized,sealed,t,n,cluster_id}'`

  Etap 2: `initialized: true`, `sealed: false`, `t: 2`, `n: 3`; `cluster_id` odpowiada zamrożonemu oryginałowi.

  - `source platform.env`
  - `curl -fsS -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch" | jq -e '.data.data.value == "north-secret"' >/dev/null`
  - `curl -sS -o /dev/null -w '%{http_code}\n' -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_MANAGER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch"`
  - `stat -c %a unseal-shares.json`

  Etap 2: Kod `0`; dane uwierzytelniające i tajne wartości nie są wyświetlane. Manager zgłasza `403`; plik udziałów zgłasza `600`.

  Etap 2. Przed sprawdzeniem bieżących odpowiedzi HTTP porównaj profile aplikacji i pierwotne dane obu procesów. Sprawdzenie publikacji reader powinno zwrócić OK.

  ```bash
  set -euo pipefail
  cd ~/quest
  curl -fsS --max-time 2 http://127.0.0.1:18081/ > observed-publication.json
  python3 -I - <<'VERIFY_PUBLICATION'
  import json
  from pathlib import Path
  contract=json.loads(Path('consumer-contract.json').read_text())
  observed=json.loads(Path('observed-publication.json').read_text())
  assert observed['ready'] is True
  assert observed['source']==contract['vault_url']
  assert observed['path']==contract['path']
  assert observed['value_sha256']==contract['value_sha256']
  assert observed['version']==contract['version']
  print('OK')
  VERIFY_PUBLICATION
  ```

  Obie pierwotne aplikacje udostępniają zatwierdzoną publikację przez udokumentowany łańcuch źródeł.

  ```bash
  set -euo pipefail
  curl -fsS --max-time 2 http://127.0.0.1:18081/ > primary.json
  curl -fsS --max-time 2 http://127.0.0.1:18082/ > secondary.json
  jq -e --slurpfile first primary.json ' .ready==true and .source=="http://127.0.0.1:18081" and .version==$first[0].version and .value_sha256==$first[0].value_sha256' secondary.json
  ```
  Oczekiwane: true.

  ```sh
  (
    set -euo pipefail
    cd ~/quest
    python3 -I - <<'VERIFY_ORIGINAL_CONSUMERS'
  import hashlib
  import json
  import stat
  from pathlib import Path

  facts = json.loads(Path("/run/dq/facts/0/consumer-contract.json").read_text())

  def read_regular(name, limit=8192):
      path = Path(name)
      info = path.lstat()
      assert stat.S_ISREG(info.st_mode) and info.st_size <= limit
      return path.read_bytes()

  for role in ("consumer", "downstream"):
      original = facts[role]
      assert read_regular(role + "/application.pid").decode().strip() == str(original["pid"])
      process = Path("/proc") / str(original["pid"])
      fields = (process / "stat").read_text().rsplit(") ", 1)[1].split()
      assert fields[0] not in ("Z", "X") and fields[19] == original["start"]
      assert (process / "cmdline").read_bytes().hex() == original["command"]
      observed = dict(line.split(":", 1) for line in (process / "status").read_text().splitlines() if ":" in line)
      assert all(observed[key].strip() == value for key, value in original["status"].items())

  assert hashlib.sha256(read_regular("provided-vault-consumer.py", 65536)).hexdigest() == facts["program_sha256"]
  reader = json.loads(read_regular("consumer/source.json", 4096))
  assert set(reader) == {"url", "path", "token_file"}
  assert reader["url"] == facts["vault_url"] and reader["path"] == facts["path"]
  credential = Path(reader["token_file"]).lstat()
  assert credential.st_uid == 1000 and stat.S_IMODE(credential.st_mode) == 0o600
  assert hashlib.sha256(read_regular(reader["token_file"], 4096).strip()).hexdigest() == facts["reader_sha256"]
  assert json.loads(read_regular("downstream/source.json", 4096)) == {"upstream": "http://127.0.0.1:18081"}
  print("Original process identities, program and private profiles match")
  VERIFY_ORIGINAL_CONSUMERS
  )
  ```
phrases.0: Rozróżniłem dostępność procesu od stanu pieczęci.
phrases.1: Sprawdziłem stan inicjalizacji i odpieczętowania bez wypisywania udziałów.
phrases.2: Porównałem ID klastra i sprawdziłem dostęp reader oraz manager.
stages.0.objectives.0.text: Endpoint inicjalizacji ćwiczebnego Vault jest osiągalny i zgłasza initialized `true`.
stages.1.objectives.0.text: Istniejący Vault jest zainicjalizowany i unsealed, zachowując pierwotną tożsamość klastra
  i konfigurację unseal.
stages.1.objectives.1.text: Obie pierwotne aplikacje udostępniają zatwierdzoną publikację przez udokumentowany łańcuch
  źródeł.
stages.1.objectives.2.text: Dostarczona tożsamość manager otrzymuje HTTP `403`, żądając istniejących danych dispatch.
stages.1.objectives.3.text: Plik `~/quest/unseal-shares.json` na workstation ma tryb `0600`.
guides.reference_1: Sprawdź odpowiednie API Vault
guides.reference_2: Dokumentacja weryfikacji publikacji i konsumentów
diagnostics.init: Setup zatrzymuje już zainicjalizowany pierwotny Vault; niedostępny endpoint nie oznacza potrzeby inicjalizacji danych. Złóż ograniczone żądanie startu z control/README.md i sprawdź ponownie. Błąd żądania, zła odpowiedź lub initialized false daje marker; sam kwit agenta nie dowodzi zdrowia usługi. [Przyczyna i kontrola](guides#guide=vault-recovery&section=original-vault-start-existing-service)
diagnostics.initialized: Pierwotny Vault jest już zainicjalizowany. Zatrzymana usługa, błąd seal-status lub nieczytelny JSON też narusza initialized; przywróć dostępność i sprawdź stan przed zmianą danych. Ponowna inicjalizacja lub wymiana storage może zniszczyć potrzebne tożsamości. [Przyczyna i kontrola](guides#guide=vault-recovery&section=original-vault-observe-original-initialization)
diagnostics.sealed: Uruchomienie procesu pozostawia istniejący storage zapieczętowany. Prześlij dwie różne dostarczone części przez API odpieczętowania bez ich wypisywania; jedna nie wystarczy. Błąd odczytu stanu lub zła odpowiedź też narusza porównanie sealed false. [Przyczyna i kontrola](guides#guide=vault-recovery&section=original-vault-unseal-original-cluster)
diagnostics.cluster: Inny Vault lub nowo zainicjalizowany storage może być dostępny i odpieczętowany, lecz mieć inny ID klastra. Przywróć pierwotną usługę i storage; porównaj cluster_id z zamrożonym original-cluster-id. Brak danych lub błąd obserwacji też narusza porównanie. [Przyczyna i kontrola](guides#guide=vault-recovery&section=original-vault-retain-cluster-identity)
diagnostics.threshold: Pierwotna inicjalizacja ma próg t równy 2 i liczbę części n równą 3. Ponowna inicjalizacja lub inny endpoint może dać inne ustawienia; przywróć pierwotne źródło i zbadaj odpowiedź. Błąd żądania lub JSON też nie przejdzie; markery nie wymagają wypisywania części. [Przyczyna i kontrola](guides#guide=vault-recovery&section=original-vault-retain-recovery-quorum)
diagnostics.shares: Pierwotna inicjalizacja ma próg t równy 2 i liczbę części n równą 3. Ponowna inicjalizacja lub inny endpoint może dać inne ustawienia; przywróć pierwotne źródło i zbadaj odpowiedź. Błąd żądania lub JSON też nie przejdzie; markery nie wymagają wypisywania części. [Przyczyna i kontrola](guides#guide=vault-recovery&section=original-vault-retain-recovery-quorum)
diagnostics.reader: Żądanie źródła może zawieść przy zatrzymanym lub zapieczętowanym Vault, złym reader/ścieżce albo wartości innej niż north-secret. Sprawdź dostarczone reader przez prywatny kanał nagłówka; sukces źródła nie dowodzi aktualizacji pamięci aplikacji. [Przyczyna i kontrola](guides#guide=vault-recovery&section=original-vault-reader-source-boundary)
diagnostics.manager: Użycie reader zamiast manager albo nadanie manager dostępu do źródła narusza wymagany zakaz. Zachowaj osobną dostarczoną tożsamość manager i oczekuj HTTP 403 na ścieżce dispatch; awaria sieci, odpowiedź zapieczętowanego źródła lub inny kod też nie przejdą. [Przyczyna i kontrola](guides#guide=vault-recovery&section=original-vault-manager-remains-denied)
diagnostics.mode: unseal-shares.json może zniknąć lub mieć zmienione uprawnienia po odzyskiwaniu. Przywróć tryb 0600 bez wyświetlania zawartości. Warunek porównuje tylko tryb, nie strukturę JSON i nie wymaga zmiany pierwotnego kworum. [Przyczyna i kontrola](guides#guide=vault-recovery&section=original-vault-private-share-file-mode)
diagnostics.probe_1_1: Dostęp do Vault sam nie odświeża aplikacji. Pierwsza używa początkowo zablokowanego manager token; popraw dokładny profil i prywatny zwykły plik reader należący do UID 1000 z trybem 0600, następnie wyślij SIGHUP do pierwotnego procesu. Popraw stary URL downstream i wyślij SIGHUP po gotowości pierwszej. Porównaj statusy, logi i zamrożone digest/version; zmiany procesu, programu, uprawnień, błędne dane i nienazwane błędy obserwacji lub timeout też dają fallback. [Przyczyna i kontrola](guides#guide=vault-recovery&section=original-vault-cached-consumer-chain)
diagnostics.probe_0_0: Warunek zawiódł przed nazwanym odczytem Vault, np. przez brak, nieczytelność lub błąd ładowania platform.env. Przywróć dostarczone środowisko i workspace; zwykłe błędy HTTP, stanu lub wartości są już nazwane. Fallback pojawia się tylko bez istniejącego markera, a sprzątanie prywatnych nagłówków zostaje w pierwotnym procesie potomnym. [Przyczyna i kontrola](guides#guide=vault-recovery&section=original-vault-early-platform-input)
diagnostics.probe_1_0: Warunek zawiódł przed nazwanym odczytem Vault, np. przez brak, nieczytelność lub błąd ładowania platform.env. Przywróć dostarczone środowisko i workspace; zwykłe błędy HTTP, stanu lub wartości są już nazwane. Fallback pojawia się tylko bez istniejącego markera, a sprzątanie prywatnych nagłówków zostaje w pierwotnym procesie potomnym. [Przyczyna i kontrola](guides#guide=vault-recovery&section=original-vault-early-platform-input)
