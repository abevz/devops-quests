title: Odzyskiwanie Vault
brief: 'Odzyskaj niedostępny pierwotny Vault i publikację przez obie istniejące aplikacje. Zachowaj tożsamość klastra,
  kworum i prywatne udziały. Manager nadal nie może czytać źródła. Druga aplikacja ma udostępniać zatwierdzoną publikację
  pierwotnej pierwszej aplikacji; zachowaj oba procesy. Interfejs sterowania opisuje `control/README.md`.


  Pracuj w `~/quest`. Katalog konsumenta zawiera konfigurację, PID i dziennik aplikacji. `consumer/README.md` opisuje
  interfejs; `consumer-contract.json` zapisuje pierwotne procesy, zatwierdzone źródło, skrót publikacji i wersję.
  Zachowaj programy, tożsamości i uprawnienia procesów. Każdy konsument ma udostępniać zatwierdzoną publikację przez
  istniejący HTTP, z pierwotnego źródła i dostarczoną prywatną tożsamością reader. Ręczny odczyt źródła nie wystarcza.
  Dane uwierzytelniające muszą być zwykłymi plikami użytkownika workstation z trybem `0600`. Nie wypisuj sekretów
  ani danych uwierzytelniających.


  **Wymagania:**


  - Etap 1: Endpoint inicjalizacji ćwiczebnego Vault jest osiągalny i zgłasza initialized `true`.

  - Etap 2: Istniejący Vault jest zainicjalizowany i unsealed, zachowując pierwotną tożsamość klastra i konfigurację
  unseal.

  - Etap 2: Obie pierwotne aplikacje udostępniają zatwierdzoną publikację przez udokumentowany łańcuch źródeł.

  - Etap 2: Dostarczona tożsamość manager otrzymuje HTTP `403`, żądając istniejących danych dispatch.

  - Etap 2: Plik `~/quest/unseal-shares.json` na workstation ma tryb `0600`.'
debrief: Zachowano tożsamości źródła i konsumentów; aplikacje przyjęły zatwierdzoną publikację.
stages.0.brief: Przywróć endpoint inicjalizacji istniejącego Vault.
stages.1.brief: Odzyskaj niedostępny pierwotny Vault i publikację przez obie istniejące aplikacje. Zachowaj tożsamość
  klastra, kworum i prywatne udziały. Manager nadal nie może czytać źródła. Druga aplikacja ma udostępniać zatwierdzoną
  publikację pierwotnej pierwszej aplikacji; zachowaj oba procesy. Interfejs sterowania opisuje `control/README.md`.
hints.0.text: Dostępność serwera, autoryzacja i publikacja przyjęta przez konsumenta są odrębnymi obserwacjami.
hints.1.text: 'Porównaj odpowiedź usługi, profile źródeł, dzienniki aplikacji i pierwotny kontrakt. Najpierw prześledź
  pierwszą uszkodzoną granicę.


  ```bash

  cat consumer/source.json consumer/application.log consumer-contract.json

  curl -fsS --max-time 2 http://127.0.0.1:18081/status

  ```


  ```bash

  cat downstream/source.json downstream/application.log

  curl -fsS --max-time 2 http://127.0.0.1:18082/status

  ```'
hints.2.text: 'Po odpieczętowaniu sprawdź pierwotny ID klastra i istniejące dane dostępne dla reader. Zapisz dokładnie
  `{"action":"start"}` w `vault-repair.json`; ograniczony agent uruchamia istniejący Vault przy następnym sprawdzeniu.
  Prześlij dwa różne dostarczone udziały do `/v1/sys/unseal`; nie inicjalizuj ponownie ani nie zastępuj magazynu.
  Uruchom istniejący proces przed użyciem dwóch udziałów.


  Sprawdź z `~/quest` na workstation:


  - `source platform.env`

  - `curl -fsS "$VAULT_ADDR/v1/sys/init" | jq -e ''.initialized == true''`


  Etap 1: `true`.


  - `source platform.env`

  - `curl -fsS "$VAULT_ADDR/v1/sys/seal-status" | jq ''{initialized,sealed,t,n,cluster_id}''`


  Etap 2: `initialized: true`, `sealed: false`, `t: 2`, `n: 3`; `cluster_id` odpowiada zamrożonemu oryginałowi.


  - `source platform.env`

  - `curl -fsS -H @<(printf ''X-Vault-Token: %s\n'' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch"
  | jq -e ''.data.data.value == "north-secret"'' >/dev/null`

  - `curl -sS -o /dev/null -w ''%{http_code}\n'' -H @<(printf ''X-Vault-Token: %s\n'' "$VAULT_MANAGER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch"`

  - `stat -c %a unseal-shares.json`


  Etap 2: Kod `0`; dane uwierzytelniające i tajne wartości nie są wyświetlane. Manager zgłasza `403`; plik udziałów
  zgłasza `600`.


  Dopasuj profil do zatwierdzonego API i danych reader. Zachowaj prywatność pliku i wyślij SIGHUP do istniejącego
  PID; manager to inna tożsamość. Sprawdź publikację HTTP. Oczekiwane: OK.


  ```bash

  set -euo pipefail

  cd ~/quest

  curl -fsS --max-time 2 http://127.0.0.1:18081/ > observed-publication.json

  python3 -I - <<''VERIFY_PUBLICATION''

  import json

  from pathlib import Path

  contract=json.loads(Path(''consumer-contract.json'').read_text())

  observed=json.loads(Path(''observed-publication.json'').read_text())

  assert observed[''ready''] is True

  assert observed[''source'']==contract[''vault_url'']

  assert observed[''path'']==contract[''path'']

  assert observed[''value_sha256'']==contract[''value_sha256'']

  assert observed[''version'']==contract[''version'']

  print(''OK'')

  VERIFY_PUBLICATION

  ```


  Obie pierwotne aplikacje udostępniają zatwierdzoną publikację przez udokumentowany łańcuch źródeł.


  ```bash

  set -euo pipefail

  curl -fsS --max-time 2 http://127.0.0.1:18081/ > primary.json

  curl -fsS --max-time 2 http://127.0.0.1:18082/ > secondary.json

  jq -e --slurpfile first primary.json '' .ready==true and .source=="http://127.0.0.1:18081" and .version==$first[0].version
  and .value_sha256==$first[0].value_sha256'' secondary.json

  ```

  Oczekiwane: true. Popraw źródło drugiej aplikacji i wyślij SIGHUP do jej pierwotnego PID po gotowości pierwszej.'
phrases.0: Rozróżniłem dostępność procesu od stanu pieczęci.
phrases.1: Sprawdziłem stan inicjalizacji i odpieczętowania bez wypisywania udziałów.
phrases.2: Porównałem ID klastra i sprawdziłem dostęp reader oraz manager.
diagnostics.init: Vault sys/init initialized musi wynosić true.
diagnostics.initialized: Vault sys/seal-status initialized musi wynosić true.
diagnostics.sealed: Vault sys/seal-status sealed musi wynosić false.
diagnostics.cluster: Niepuste original-cluster-id musi odpowiadać Vault cluster_id.
diagnostics.threshold: Vault sys/seal-status t musi wynosić 2.
diagnostics.shares: Vault sys/seal-status n musi wynosić 3.
diagnostics.reader: Token czytelnika (reader) musi odczytać north-secret z secret/data/dispatch.
diagnostics.manager: Żądanie tokenu manager do secret/data/dispatch musi zwrócić HTTP 403.
diagnostics.mode: Uprawnienia unseal-shares.json muszą wynosić 0600.
stages.0.objectives.0.text: Endpoint inicjalizacji ćwiczebnego Vault jest osiągalny i zgłasza initialized `true`.
stages.1.objectives.0.text: Istniejący Vault jest zainicjalizowany i unsealed, zachowując pierwotną tożsamość klastra
  i konfigurację unseal.
stages.1.objectives.1.text: Obie pierwotne aplikacje udostępniają zatwierdzoną publikację przez udokumentowany łańcuch
  źródeł.
stages.1.objectives.2.text: Dostarczona tożsamość manager otrzymuje HTTP `403`, żądając istniejących danych dispatch.
stages.1.objectives.3.text: Plik `~/quest/unseal-shares.json` na workstation ma tryb `0600`.
diagnostics.probe_1_1: Obie pierwotne aplikacje muszą przyjąć zatwierdzoną publikację z prywatnymi danymi reader
  przez pierwotny łańcuch źródeł. Porównaj oba profile, dzienniki i odpowiedzi HTTP.
