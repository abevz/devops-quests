title: Odzyskiwanie Vault
brief: 'Proces gry prywatnej Vault został zatrzymany, ale zainicjowana pamięć plików nadal istnieje. Poproś
  o jego start, wpisując dokładnie {"action":"start"} do vault-repair.json. Ograniczony agent gry może
  start tylko istniejący kontener Vault w tej wnęce; nie może zainicjować ani zastąpić pamięci. Po osiągnięciu
  stanu sprawdź stan initialized/sealed i użyj dwóch dostarczonych udziałów przeznaczonych wyłącznie do
  gier. Odzyskaj oryginalne dane cluster ID, reader token i KV. Nigdy ponownie nie wywołuj sys/init ani
  nie zastępuj istniejącego Vault nową instancją.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `platform.env`, `vault-repair.json`,
  `vault-agent-status.json`, `unseal-shares.json`, `original-cluster-id`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: Rozpoczęto proces istniejącej gry Vault; odzyskiwanie odbywa się w oryginalnej
  pamięci masowej.'
debrief: Proces i seal zostały odzyskane bez odtwarzania zainicjowanej pamięci.
stages.0.brief: 'Kryteria sukcesu: Rozpoczęto istniejący proces gry Vault; odzyskiwanie odbywa się w oryginalnej
  pamięci masowej.'
stages.0.objectives.0.text: Rozpoczyna się proces istniejącej gry Vault; odzyskiwanie odbywa się w oryginalnej
  pamięci masowej.
stages.1.brief: 'Kryteria sukcesu: Oryginalny zainicjalizowany Vault zostaje rozpieczętowany, a stary
  reader odzyskuje istniejącą wartość KV; manager nadal nie może go odczytać.'
stages.1.objectives.0.text: Oryginalnie zainicjalizowany Vault zostaje rozpieczętowany, a stary reader
  odzyskuje istniejącą wartość KV; manager nadal nie może go odczytać.
hints.0.text: Zatrzymany, sealed i niezainicjowany to różne stany.
hints.1.text: Rozpocznij istniejący proces przed użyciem dwóch udziałów.
hints.2.text: Sprawdź oryginalne cluster ID i istniejące dane reader po unseal.
phrases.0: Rozróżniłem dostępność procesu od stanu seal.
phrases.1: Odzyskałem zainicjowany sklep bez ponownej inicjalizacji Vault.
phrases.2: Sprawdziłem oryginalny klaster identity i istniejący credentials.
