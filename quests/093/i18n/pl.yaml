title: Odzyskiwanie Vault
brief: 'Pracuj w `~/quest` z `platform.env`, `vault-agent-status.json`, `unseal-shares.json` i `original-cluster-id`. Prywatny
  proces Vault gry jest zatrzymany, ale dostarczono zainicjowany magazyn. Zapisz dokładnie `{"action":"start"}` do `vault-repair.json`;
  ograniczony agent zatoki uruchamia jej istniejący Vault. Poczekaj, aż punkt inicjalizacji będzie dostępny. Nigdy nie wypisuj
  udziałów ani tokenów, nie wywołuj sys/init w celu ponownej inicjalizacji i nie zastępuj magazynu. Połączony przewodnik Vault
  wyjaśnia agenta, żądania unseal i odczyty KV-v2.


  Po uruchomieniu prześlij dwa różne dostarczone udziały do `/v1/sys/unseal` i zachowaj tryb `0600` pliku `unseal-shares.json`.
  Sprawdź, czy `/v1/sys/seal-status` podaje `initialized=true`, `sealed=false`, `t=2` i `n=3`, a ID klastra odpowiada `/run/dq/facts/0/original-cluster-id`.
  Token reader musi odczytać `north-secret` jako `.data.data.value` z `secret/data/dispatch`; token manager musi otrzymać
  HTTP 403 dla tej samej ścieżki. Kontrole obserwują bieżący stan, tożsamość i dostęp; nie dowodzą dokładnego żądania startu
  ani całej historii magazynu. Korzystaj tylko z tej zatoki gry offline.'
debrief: Inicjalizacja, stan pieczęci, zapisany ID klastra, wyniki dostępu i tryb pliku udziałów odpowiadały kontrolom.
stages.0.brief: Punkt inicjalizacji jest dostępny i podaje initialized=true.
stages.0.objectives.0.text: Punkt inicjalizacji jest dostępny i podaje initialized=true.
stages.1.brief: Stan pieczęci i ID klastra, wartość reader, odmowa manager oraz tryb pliku udziałów odpowiadają opisowi.
stages.1.objectives.0.text: Stan pieczęci i ID klastra, wartość reader, odmowa manager oraz tryb pliku udziałów odpowiadają
  opisowi.
hints.0.text: Zatrzymany, zapieczętowany i niezainicjowany to różne stany.
hints.1.text: Uruchom istniejący proces przed użyciem dwóch udziałów.
hints.2.text: Po odpieczętowaniu sprawdź pierwotny ID klastra i istniejące dane dostępne dla reader.
phrases.0: Rozróżniłem dostępność procesu od stanu pieczęci.
phrases.1: Sprawdziłem stan inicjalizacji i odpieczętowania bez wypisywania udziałów.
phrases.2: Porównałem ID klastra i sprawdziłem dostęp reader oraz manager.
diagnostics.init: Vault sys/init initialized musi wynosić true.
diagnostics.initialized: Vault sys/seal-status initialized musi wynosić true.
diagnostics.sealed: Vault sys/seal-status sealed musi wynosić false.
diagnostics.cluster: Niepuste original-cluster-id musi odpowiadać Vault cluster_id.
diagnostics.threshold: Vault sys/seal-status t musi wynosić 2.
diagnostics.shares: Vault sys/seal-status n musi wynosić 3.
diagnostics.reader: Token czytelnika (reader) musi odczytać north-secret z secret/data/dispatch.
diagnostics.manager: Żądanie tokenu manager do secret/data/dispatch musi zwrócić HTTP 403.
diagnostics.mode: Uprawnienia unseal-shares.json muszą wynosić 0600.
