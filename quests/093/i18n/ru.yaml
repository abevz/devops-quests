title: Восстановление Vault
brief: 'Работайте в `~/quest` с `platform.env`, `vault-agent-status.json`, `unseal-shares.json` и `original-cluster-id`. Приватный процесс игрового Vault остановлен, но инициализированное хранилище предоставлено. Запишите ровно `{"action":"start"}` в `vault-repair.json`; ограниченный агент песочницы запускает её существующий Vault. Дождитесь доступности точки инициализации. Не выводите доли или токены, не вызывайте sys/init для повторной инициализации и не заменяйте хранилище. Руководство Vault объясняет агента, запросы unseal и чтение KV-v2.


  После запуска передайте две разные выданные доли в `/v1/sys/unseal` и сохраните режим `0600` файла `unseal-shares.json`. Проверьте, что `/v1/sys/seal-status` сообщает `initialized=true`, `sealed=false`, `t=2` и `n=3`, а ID кластера совпадает с `/run/dq/facts/0/original-cluster-id`. Токен reader должен получить `north-secret` в `.data.data.value` из `secret/data/dispatch`; токен manager должен получить HTTP 403 по тому же пути. Проверки наблюдают текущее состояние, идентичность и доступ, но не доказывают точный запрос запуска или всю историю хранилища. Используйте только эту игровую офлайн-песочницу.'
debrief: Инициализация, состояние печати, записанный ID кластера, результаты доступа и режим файла долей соответствовали проверкам.
stages.0.brief: Точка инициализации доступна и сообщает initialized=true.
stages.0.objectives.0.text: Точка инициализации доступна и сообщает initialized=true.
stages.1.brief: Состояние печати и ID кластера, значение reader, отказ manager и режим файла долей соответствуют заданию.
stages.1.objectives.0.text: Состояние печати и ID кластера, значение reader, отказ manager и режим файла долей соответствуют заданию.
hints.0.text: Остановленное, запечатанное и неинициализированное состояния различаются.
hints.1.text: До использования двух долей запустите существующий процесс.
hints.2.text: После распечатывания проверьте исходный ID кластера и существующие данные, доступные reader.
phrases.0: Я различил доступность процесса и состояние печати.
phrases.1: Я проверил инициализированное и распечатанное состояние, не выводя доли.
phrases.2: Я сравнил ID кластера и проверил доступ reader и manager.
