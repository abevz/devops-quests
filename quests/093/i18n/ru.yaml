hints.0.text: Остановлен, sealed и не инициализирован — разные состояния.
hints.1.text: До использования двух долей запустите существующий процесс.
hints.2.text: После unseal проверьте исходный cluster ID и чтение старых данных.
phrases.0: Я различил доступность процесса и состояние seal.
phrases.1: Я восстановил инициализированное хранилище без повторной инициализации Vault.
phrases.2: Я проверил прежнюю identity кластера и существующие credentials.
