title: Восстановление Vault
brief: 'Процесс приватного игрового Vault остановлен, но его инициализированное файловое хранилище сохранено.
  Для запуска запишите ровно {"action":"start"} в vault-repair.json. Ограниченный игровой агент запускает
  только существующий контейнер Vault этой песочницы; он не умеет инициализировать или заменять хранилище.
  После запуска изучите initialized/sealed и используйте две выданные игровые доли. Восстановите прежний
  cluster ID, reader token и KV-данные. Не вызывайте sys/init повторно и не подменяйте Vault новым.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `platform.env`, `vault-repair.json`,
  `vault-agent-status.json`, `unseal-shares.json`, `original-cluster-id`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Существующий игровой процесс Vault запущен; восстановление продолжится с прежним
  хранилищем.'
debrief: Процесс и seal восстановлены без пересоздания инициализированного хранилища.
stages.0.brief: 'Существующий игровой процесс Vault запущен; восстановление продолжится с прежним хранилищем.


  Результат проверки: Существующий игровой процесс Vault запущен; восстановление продолжится с прежним
  хранилищем.'
stages.0.objectives.0.text: Существующий игровой процесс Vault запущен; восстановление продолжится с прежним
  хранилищем.
stages.1.brief: 'Прежний инициализированный Vault распечатан, старый reader читает существующее KV-значение;
  manager по-прежнему не может его читать.


  Результат проверки: Прежний инициализированный Vault распечатан, старый reader читает существующее KV-значение;
  manager по-прежнему не может его читать.'
stages.1.objectives.0.text: Прежний инициализированный Vault распечатан, старый reader читает существующее
