title: Восстановление Vault
brief: 'Восстановите недоступный исходный Vault и публикацию через оба существующих приложения. Сохраните идентичность
  кластера, кворум и приватные доли. Manager не должен читать источник. Второе приложение должно отдавать утверждённую
  публикацию первого; сохраните оба процесса. Интерфейс управления сервисом описан в `control/README.md`.


  Работайте в `~/quest`. В каталоге потребителя находятся конфигурация, запись PID и журнал приложения. Интерфейс
  описан в `consumer/README.md`; `consumer-contract.json` содержит исходные процессы, утверждённый источник, хеш
  публикации и версию. Сохраните программы, идентичность и привилегии исходных процессов. Каждый потребитель должен
  отдавать утверждённую публикацию через свой HTTP-интерфейс, используя исходный источник и выданную приватную reader-идентичность.
  Успешного ручного запроса к источнику недостаточно. Файлы учётных данных должны быть обычными, принадлежать пользователю
  workstation и иметь режим `0600`. Не выводите секреты и учётные данные.


  **Требования:**


  - Этап 1: Endpoint инициализации учебного Vault доступен и сообщает initialized `true`.

  - Этап 2: Существующий Vault инициализирован и unsealed, сохраняя исходную идентичность кластера и конфигурацию
  unseal.

  - Этап 2: Оба исходных приложения отдают утверждённую публикацию по документированной цепочке источников.

  - Этап 2: Предоставленная идентичность manager получает HTTP `403` при запросе существующих данных dispatch.

  - Этап 2: Файл `~/quest/unseal-shares.json` на workstation имеет режим `0600`.'
debrief: Идентичность источника и потребителей сохранена; работающие приложения приняли утверждённую публикацию.
stages.0.brief: Восстановите endpoint инициализации существующего Vault.
stages.1.brief: Восстановите недоступный исходный Vault и публикацию через оба существующих приложения. Сохраните
  идентичность кластера, кворум и приватные доли. Manager не должен читать источник. Второе приложение должно отдавать
  утверждённую публикацию первого; сохраните оба процесса. Интерфейс управления сервисом описан в `control/README.md`.
hints.0.text: Доступность сервера, авторизация и принятая потребителем публикация — разные наблюдения.
hints.1.text: |-
  Сопоставьте живой ответ сервиса, профили источников, журналы приложений и исходный контракт. Проследите первую неисправную границу, прежде чем менять следующий компонент.

  Найдите исходный идентификатор кластера и состояние процесса в контракте источника и наблюдении агента восстановления. Проверьте доступность текущего процесса и его статус инициализации или запечатывания.

  ```bash
  cat consumer/source.json consumer/application.log consumer-contract.json
  curl -fsS --max-time 2 http://127.0.0.1:18081/status
  ```

  ```bash
  cat downstream/source.json downstream/application.log
  curl -fsS --max-time 2 http://127.0.0.1:18082/status
  ```
hints.2.text: |-
  Проверьте из `~/quest` на workstation:

  - `source platform.env`
  - `curl -fsS "$VAULT_ADDR/v1/sys/init" | jq -e '.initialized == true'`

  Этап 1: `true`.

  - `source platform.env`
  - `curl -fsS "$VAULT_ADDR/v1/sys/seal-status" | jq '{initialized,sealed,t,n,cluster_id}'`

  Этап 2: `initialized: true`, `sealed: false`, `t: 2`, `n: 3`; `cluster_id` совпадает с исходным замороженным значением.

  - `source platform.env`
  - `curl -fsS -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch" | jq -e '.data.data.value == "north-secret"' >/dev/null`
  - `curl -sS -o /dev/null -w '%{http_code}\n' -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_MANAGER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch"`
  - `stat -c %a unseal-shares.json`

  Этап 2: Код `0`; учётные данные и секретные значения не выводятся. Manager сообщает `403`; файл долей сообщает `600`.

  Этап 2. Сверьте профили приложений и исходные записи обоих процессов перед проверкой живых HTTP-ответов. Проверка публикации reader должна вернуть OK.

  ```bash
  set -euo pipefail
  cd ~/quest
  curl -fsS --max-time 2 http://127.0.0.1:18081/ > observed-publication.json
  python3 -I - <<'VERIFY_PUBLICATION'
  import json
  from pathlib import Path
  contract=json.loads(Path('consumer-contract.json').read_text())
  observed=json.loads(Path('observed-publication.json').read_text())
  assert observed['ready'] is True
  assert observed['source']==contract['vault_url']
  assert observed['path']==contract['path']
  assert observed['value_sha256']==contract['value_sha256']
  assert observed['version']==contract['version']
  print('OK')
  VERIFY_PUBLICATION
  ```

  Оба исходных приложения отдают утверждённую публикацию по документированной цепочке источников.

  ```bash
  set -euo pipefail
  curl -fsS --max-time 2 http://127.0.0.1:18081/ > primary.json
  curl -fsS --max-time 2 http://127.0.0.1:18082/ > secondary.json
  jq -e --slurpfile first primary.json ' .ready==true and .source=="http://127.0.0.1:18081" and .version==$first[0].version and .value_sha256==$first[0].value_sha256' secondary.json
  ```
  Ожидается true.

  ```sh
  (
    set -euo pipefail
    cd ~/quest
    python3 -I - <<'VERIFY_ORIGINAL_CONSUMERS'
  import hashlib
  import json
  import stat
  from pathlib import Path

  facts = json.loads(Path("/run/dq/facts/0/consumer-contract.json").read_text())

  def read_regular(name, limit=8192):
      path = Path(name)
      info = path.lstat()
      assert stat.S_ISREG(info.st_mode) and info.st_size <= limit
      return path.read_bytes()

  for role in ("consumer", "downstream"):
      original = facts[role]
      assert read_regular(role + "/application.pid").decode().strip() == str(original["pid"])
      process = Path("/proc") / str(original["pid"])
      fields = (process / "stat").read_text().rsplit(") ", 1)[1].split()
      assert fields[0] not in ("Z", "X") and fields[19] == original["start"]
      assert (process / "cmdline").read_bytes().hex() == original["command"]
      observed = dict(line.split(":", 1) for line in (process / "status").read_text().splitlines() if ":" in line)
      assert all(observed[key].strip() == value for key, value in original["status"].items())

  assert hashlib.sha256(read_regular("provided-vault-consumer.py", 65536)).hexdigest() == facts["program_sha256"]
  reader = json.loads(read_regular("consumer/source.json", 4096))
  assert set(reader) == {"url", "path", "token_file"}
  assert reader["url"] == facts["vault_url"] and reader["path"] == facts["path"]
  credential = Path(reader["token_file"]).lstat()
  assert credential.st_uid == 1000 and stat.S_IMODE(credential.st_mode) == 0o600
  assert hashlib.sha256(read_regular(reader["token_file"], 4096).strip()).hexdigest() == facts["reader_sha256"]
  assert json.loads(read_regular("downstream/source.json", 4096)) == {"upstream": "http://127.0.0.1:18081"}
  print("Original process identities, program and private profiles match")
  VERIFY_ORIGINAL_CONSUMERS
  )
  ```
phrases.0: Я различил доступность процесса и состояние печати.
phrases.1: Я проверил инициализированное и распечатанное состояние, не выводя доли.
phrases.2: Я сравнил ID кластера и проверил доступ reader и manager.
stages.0.objectives.0.text: Endpoint инициализации учебного Vault доступен и сообщает initialized `true`.
stages.1.objectives.0.text: Существующий Vault инициализирован и unsealed, сохраняя исходную идентичность кластера
  и конфигурацию unseal.
stages.1.objectives.1.text: Оба исходных приложения отдают утверждённую публикацию по документированной цепочке
  источников.
stages.1.objectives.2.text: Предоставленная идентичность manager получает HTTP `403` при запросе существующих данных
  dispatch.
stages.1.objectives.3.text: Файл `~/quest/unseal-shares.json` на workstation имеет режим `0600`.
guides.reference_1: Справочник наблюдаемого API Vault
guides.reference_2: Справочник проверки публикации и потребителей
diagnostics.init: Setup останавливает уже инициализированный исходный Vault; недоступный endpoint не означает, что данные надо инициализировать. Подайте ограниченный запрос запуска из control/README.md и повторите проверку. Ошибка запроса, неверный ответ или initialized false дают этот маркер; квитанция агента сама не доказывает здоровье сервиса. [Причина и проверка](guides#guide=vault-recovery&section=original-vault-start-existing-service)
diagnostics.initialized: Исходный Vault уже инициализирован. Остановленный сервис, ошибка seal-status или нечитаемый JSON тоже нарушают initialized; восстановите доступность и изучите статус до изменения данных. Повторная инициализация или замена storage может уничтожить нужные далее идентичности. [Причина и проверка](guides#guide=vault-recovery&section=original-vault-observe-original-initialization)
diagnostics.sealed: Запуск остановленного процесса оставляет существующий storage запечатанным. Подайте две различные выданные доли через API распечатывания, не печатая их; одной доли недостаточно. Ошибка запроса статуса или неверный ответ тоже нарушают сравнение sealed false. [Причина и проверка](guides#guide=vault-recovery&section=original-vault-unseal-original-cluster)
diagnostics.cluster: Другой Vault или заново инициализированный storage может быть доступен и распечатан, но иметь иной ID кластера. Восстановите исходный сервис и storage; сравните cluster_id с зафиксированным original-cluster-id. Отсутствие frozen input или ошибка статуса тоже нарушают сравнение. [Причина и проверка](guides#guide=vault-recovery&section=original-vault-retain-cluster-identity)
diagnostics.threshold: Исходная инициализация задаёт порог t равный 2 и число долей n равное 3. Повторная инициализация или другой endpoint может дать иные параметры; восстановите исходный источник и изучите ответ. Ошибка запроса или JSON тоже нарушает сравнения; эти маркеры не требуют печатать доли. [Причина и проверка](guides#guide=vault-recovery&section=original-vault-retain-recovery-quorum)
diagnostics.shares: Исходная инициализация задаёт порог t равный 2 и число долей n равное 3. Повторная инициализация или другой endpoint может дать иные параметры; восстановите исходный источник и изучите ответ. Ошибка запроса или JSON тоже нарушает сравнения; эти маркеры не требуют печатать доли. [Причина и проверка](guides#guide=vault-recovery&section=original-vault-retain-recovery-quorum)
diagnostics.reader: Старый запрос к источнику может не пройти при остановленном или запечатанном Vault, неверном reader или пути либо значении не north-secret. Проверьте выданный reader через приватный канал заголовка; успех источника ещё не доказывает обновление кеша приложений. [Причина и проверка](guides#guide=vault-recovery&section=original-vault-reader-source-boundary)
diagnostics.manager: Запрос с reader вместо manager или выдача manager доступа к источнику нарушает требуемый запрет. Используйте отдельный выданный manager и ожидайте HTTP 403 на пути dispatch; ошибка сети, ответ запечатанного источника или другой HTTP-код тоже не проходят. [Причина и проверка](guides#guide=vault-recovery&section=original-vault-manager-remains-denied)
diagnostics.mode: unseal-shares.json может отсутствовать или получить другие права при восстановлении. Верните режим 0600, не выводя содержимое. Это условие сравнивает только режим, не структуру JSON и не требует менять исходный кворум распечатывания. [Причина и проверка](guides#guide=vault-recovery&section=original-vault-private-share-file-mode)
diagnostics.probe_1_1: Доступ к Vault сам не обновляет приложения. Первое изначально использует запрещённый manager token; исправьте точный профиль источника и приватный обычный файл reader с UID 1000 и режимом 0600, затем подайте SIGHUP исходному процессу. Исправьте устаревший URL downstream и подайте SIGHUP его исходному процессу после готовности первого. Сравните статус, логи и зафиксированные digest/version; изменения процессов, программы, прав, неверные входы и сбои наблюдения или timeout без имени дают тот же fallback. [Причина и проверка](guides#guide=vault-recovery&section=original-vault-cached-consumer-chain)
diagnostics.probe_0_0: Условие упало до именованного наблюдения Vault, например из-за отсутствующего, нечитаемого или некорректного platform.env. Верните выданное окружение и текущий workspace; обычные ошибки HTTP, статуса или значения уже именованы. Обёртка выдаёт fallback только без существующего маркера и оставляет очистку приватных заголовков в исходном дочернем процессе. [Причина и проверка](guides#guide=vault-recovery&section=original-vault-early-platform-input)
diagnostics.probe_1_0: Условие упало до именованного наблюдения Vault, например из-за отсутствующего, нечитаемого или некорректного platform.env. Верните выданное окружение и текущий workspace; обычные ошибки HTTP, статуса или значения уже именованы. Обёртка выдаёт fallback только без существующего маркера и оставляет очистку приватных заголовков в исходном дочернем процессе. [Причина и проверка](guides#guide=vault-recovery&section=original-vault-early-platform-input)
diagnostics.probe_1_2: Условие упало до именованного наблюдения Vault, например из-за отсутствующего, нечитаемого или некорректного platform.env. Верните выданное окружение и текущий workspace; обычные ошибки HTTP, статуса или значения уже именованы. Обёртка выдаёт fallback только без существующего маркера и оставляет очистку приватных заголовков в исходном дочернем процессе. [Причина и проверка](guides#guide=vault-recovery&section=original-vault-early-platform-input)
