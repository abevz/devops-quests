title: Recuperación de Vault
brief: 'El proceso privado de Vault del ejercicio está detenido, pero su almacenamiento en archivos ya
  inicializado sigue existiendo. Solicita su inicio escribiendo exactamente {"action":"start"} en vault-repair.json.
  El agente del ejercicio, con alcance limitado, solo puede iniciar el contenedor Vault existente de este
  entorno; no puede inicializar ni sustituir el almacenamiento. Cuando sea accesible, comprueba los estados
  initialized/sealed y utiliza los dos fragmentos de clave de desbloqueo suministrados para el ejercicio.
  Recupera el cluster ID original, el token reader y los datos KV. Nunca vuelvas a llamar a sys/init ni
  sustituyas el Vault existente por uno nuevo.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `platform.env`, `vault-repair.json`,
  `vault-agent-status.json`, `unseal-shares.json`, `original-cluster-id`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: se inicia el proceso del juego existente Vault; la recuperación continúa
  con el almacenamiento original.'
debrief: El proceso y seal se recuperaron sin volver a crear el almacenamiento inicializado.
stages.0.brief: 'Criterios de éxito: se inicia el proceso del juego existente Vault; la recuperación continúa
