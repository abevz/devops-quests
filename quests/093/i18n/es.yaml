title: Recuperación de Vault
brief: 'Trabaja en `~/quest` con `platform.env`, `vault-agent-status.json`, `unseal-shares.json` y `original-cluster-id`.
  El proceso privado de Vault del juego está detenido, pero se proporciona almacenamiento inicializado. Escribe exactamente
  `{"action":"start"}` en `vault-repair.json`; el agente limitado de la bahía inicia su Vault existente. Espera a que el endpoint
  de inicialización sea accesible. Nunca imprimas fragmentos o tokens, llames a sys/init para reinicializar ni reemplaces
  el almacenamiento. La guía enlazada de Vault explica el agente, las peticiones unseal y las lecturas KV-v2.


  Tras el inicio, envía los dos fragmentos distintos suministrados a `/v1/sys/unseal` y mantén `unseal-shares.json` con modo
  `0600`. Comprueba que `/v1/sys/seal-status` informa `initialized=true`, `sealed=false`, `t=2` y `n=3`, y que su ID de clúster
  coincide con `/run/dq/facts/0/original-cluster-id`. El token reader debe obtener `north-secret` como `.data.data.value`
  de `secret/data/dispatch`; el token manager debe recibir HTTP 403 en la misma ruta. Las comprobaciones observan el estado,
  la identidad y el acceso actuales; no demuestran la petición de inicio exacta ni toda la historia del almacenamiento. Usa
  solo esta bahía del juego sin conexión.'
debrief: La inicialización, el estado del sello, el ID de clúster registrado, los resultados de acceso y el modo del archivo
  coincidieron con las comprobaciones.
stages.0.brief: El endpoint de inicialización es accesible e informa initialized=true.
stages.0.objectives.0.text: El endpoint de inicialización es accesible e informa initialized=true.
stages.1.brief: El estado del sello y el ID de clúster, el valor de reader, la denegación de manager y el modo del archivo
  de fragmentos coinciden con el enunciado.
stages.1.objectives.0.text: El estado del sello y el ID de clúster, el valor de reader, la denegación de manager y el modo
  del archivo de fragmentos coinciden con el enunciado.
hints.0.text: Detenido, sellado y no inicializado son estados diferentes.
hints.1.text: Inicia el proceso existente antes de utilizar los dos fragmentos.
hints.2.text: Tras desellar, comprueba el ID original del clúster y los datos existentes accesibles para reader.
phrases.0: Distinguí la disponibilidad del proceso del estado del sello.
phrases.1: Comprobé el estado inicializado y desellado sin imprimir fragmentos.
phrases.2: Comparé el ID de clúster y comprobé el acceso de reader y manager.
diagnostics.init: Vault sys/init initialized debe ser true.
diagnostics.initialized: Vault sys/seal-status initialized debe ser true.
diagnostics.sealed: Vault sys/seal-status sealed debe ser false.
diagnostics.cluster: original-cluster-id no vacío debe coincidir con Vault cluster_id.
diagnostics.threshold: Vault sys/seal-status t debe ser 2.
diagnostics.shares: Vault sys/seal-status n debe ser 3.
diagnostics.reader: El token lector (reader) debe leer north-secret de secret/data/dispatch.
diagnostics.manager: La petición con el token manager a secret/data/dispatch debe devolver HTTP 403.
diagnostics.mode: El modo de unseal-shares.json debe ser 0600.
