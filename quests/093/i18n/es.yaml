title: Recuperación de Vault
brief: |-
  El Vault privado existente no está disponible. Recupera su identidad original y el acceso a los datos almacenados.

  Trabaja en la workstation en `~/quest` con `platform.env`, `vault-repair.json`, `vault-agent-status.json`, `unseal-shares.json`.

  **Requirements:**

  - Etapa 1:
    - El endpoint de inicialización del Vault de práctica está disponible e informa initialized `true`.

  - Etapa 2:
    - El Vault existente está inicializado y unsealed, conservando la identidad original del clúster y su configuración unseal.
    - La identidad reader suministrada obtiene de Vault el valor dispatch existente `north-secret`.
    - La identidad manager suministrada recibe HTTP `403` al solicitar los datos dispatch existentes.
    - El archivo `~/quest/unseal-shares.json` en la workstation tiene modo `0600`.

  Las comprobaciones observan estado, identidad y acceso actuales; no demuestran la solicitud exacta de inicio ni el historial completo del almacenamiento.
debrief: La inicialización, el estado del sello, el ID de clúster registrado, los resultados de acceso
  y el modo del archivo coincidieron con las comprobaciones.
stages.0.brief: Recupera el endpoint de inicialización del Vault existente.
stages.1.brief: Recupera el Vault original unsealed con el límite de acceso requerido.
hints.0.text: Detenido, sellado y no inicializado son estados diferentes.
hints.1.text: |-
  Inspecciona el estado del proceso existente y del sellado sin mostrar partes ni tokens.

  ```bash
  cat vault-agent-status.json
  source platform.env
  curl -fsS "$VAULT_ADDR/v1/sys/seal-status"
  ```
hints.2.text: |-
  Tras desellar, comprueba el ID original del clúster y los datos existentes accesibles para reader. Escribe exactamente `{"action":"start"}` en `vault-repair.json`; el agente limitado inicia el Vault existente en la siguiente consulta. Envía las dos partes distintas suministradas a `/v1/sys/unseal`; no inicialices de nuevo ni sustituyas el almacenamiento. Inicia el proceso existente antes de utilizar los dos fragmentos.

  Verifica desde `~/quest` en la workstation:

  - `source platform.env`
  - `curl -fsS "$VAULT_ADDR/v1/sys/init" | jq -e '.initialized == true'`

  Etapa 1: `true`.

  - `source platform.env`
  - `curl -fsS "$VAULT_ADDR/v1/sys/seal-status" | jq '{initialized,sealed,t,n,cluster_id}'`

  Etapa 2: `initialized: true`, `sealed: false`, `t: 2`, `n: 3`; `cluster_id` coincide con el original congelado.

  - `source platform.env`
  - `curl -fsS -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch" | jq -e '.data.data.value == "north-secret"' >/dev/null`
  - `curl -sS -o /dev/null -w '%{http_code}\n' -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_MANAGER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch"`
  - `stat -c %a unseal-shares.json`

  Etapa 2: Código `0`; no se muestran credenciales ni valores secretos. Manager informa `403`; el archivo de partes informa `600`.
phrases.0: Distinguí la disponibilidad del proceso del estado del sello.
phrases.1: Comprobé el estado inicializado y desellado sin imprimir fragmentos.
phrases.2: Comparé el ID de clúster y comprobé el acceso de reader y manager.
diagnostics.init: Vault sys/init initialized debe ser true.
diagnostics.initialized: Vault sys/seal-status initialized debe ser true.
diagnostics.sealed: Vault sys/seal-status sealed debe ser false.
diagnostics.cluster: original-cluster-id no vacío debe coincidir con Vault cluster_id.
diagnostics.threshold: Vault sys/seal-status t debe ser 2.
diagnostics.shares: Vault sys/seal-status n debe ser 3.
diagnostics.reader: El token lector (reader) debe leer north-secret de secret/data/dispatch.
diagnostics.manager: La petición con el token manager a secret/data/dispatch debe devolver HTTP 403.
diagnostics.mode: El modo de unseal-shares.json debe ser 0600.
stages.0.objectives.0.text: El endpoint de inicialización del Vault de práctica está disponible e informa
  initialized `true`.
stages.1.objectives.0.text: El Vault existente está inicializado y unsealed, conservando la identidad
  original del clúster y su configuración unseal.
stages.1.objectives.1.text: La identidad reader suministrada obtiene de Vault el valor dispatch existente
  `north-secret`.
stages.1.objectives.2.text: La identidad manager suministrada recibe HTTP `403` al solicitar los datos
  dispatch existentes.
stages.1.objectives.3.text: El archivo `~/quest/unseal-shares.json` en la workstation tiene modo `0600`.
