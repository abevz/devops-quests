title: Recuperación de Vault
brief: 'Recupera el Vault original no disponible y la publicación por ambas aplicaciones existentes. Conserva identidad
  del clúster, cuórum y participaciones privadas. El manager debe seguir sin poder leer la fuente. La segunda aplicación
  debe servir la publicación aprobada de la primera original; conserva ambos procesos. La interfaz de control está
  en `control/README.md`.


  Trabaja en `~/quest`. El directorio del consumidor contiene configuración, PID y registro. `consumer/README.md`
  describe la interfaz; `consumer-contract.json` registra los procesos originales, la fuente aprobada, el resumen
  de publicación y la versión. Conserva programas, identidades y privilegios originales. Cada consumidor debe servir
  la publicación aprobada desde la fuente original con la identidad privada reader suministrada. Una consulta manual
  a la fuente no basta. Las credenciales deben ser archivos regulares del usuario workstation con modo `0600`. No
  imprimas secretos ni credenciales.


  **Requisitos:**


  - Etapa 1: El endpoint de inicialización del Vault de práctica está disponible e informa initialized `true`.

  - Etapa 2: El Vault existente está inicializado y unsealed, conservando la identidad original del clúster y su
  configuración unseal.

  - Etapa 2: Ambas aplicaciones originales sirven la publicación aprobada mediante la cadena de fuentes documentada.

  - Etapa 2: La identidad manager suministrada recibe HTTP `403` al solicitar los datos dispatch existentes.

  - Etapa 2: El archivo `~/quest/unseal-shares.json` en la workstation tiene modo `0600`.'
debrief: Se conservaron las identidades de fuente y consumidores; las aplicaciones adoptaron la publicación aprobada.
stages.0.brief: Recupera el endpoint de inicialización del Vault existente.
stages.1.brief: Recupera el Vault original no disponible y la publicación por ambas aplicaciones existentes. Conserva
  identidad del clúster, cuórum y participaciones privadas. El manager debe seguir sin poder leer la fuente. La
  segunda aplicación debe servir la publicación aprobada de la primera original; conserva ambos procesos. La interfaz
  de control está en `control/README.md`.
hints.0.text: Disponibilidad del servidor, autorización y publicación adoptada por el consumidor son observaciones
  distintas.
hints.1.text: |-
  Compara respuesta real, perfiles de fuente, registros y contrato original. Sigue primero el límite que falla.

  Localiza la identidad del clúster existente y el estado del proceso en el contrato de origen y la observación del agente de recuperación. Comprueba si el proceso es accesible y qué estado de inicialización o sellado informa.

  ```bash
  cat consumer/source.json consumer/application.log consumer-contract.json
  curl -fsS --max-time 2 http://127.0.0.1:18081/status
  ```

  ```bash
  cat downstream/source.json downstream/application.log
  curl -fsS --max-time 2 http://127.0.0.1:18082/status
  ```
hints.2.text: |-
  Verifica desde `~/quest` en la workstation:

  - `source platform.env`
  - `curl -fsS "$VAULT_ADDR/v1/sys/init" | jq -e '.initialized == true'`

  Etapa 1: `true`.

  - `source platform.env`
  - `curl -fsS "$VAULT_ADDR/v1/sys/seal-status" | jq '{initialized,sealed,t,n,cluster_id}'`

  Etapa 2: `initialized: true`, `sealed: false`, `t: 2`, `n: 3`; `cluster_id` coincide con el original congelado.

  - `source platform.env`
  - `curl -fsS -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch" | jq -e '.data.data.value == "north-secret"' >/dev/null`
  - `curl -sS -o /dev/null -w '%{http_code}\n' -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_MANAGER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch"`
  - `stat -c %a unseal-shares.json`

  Etapa 2: Código `0`; no se muestran credenciales ni valores secretos. Manager informa `403`; el archivo de partes informa `600`.

  Etapa 2. Coteja los perfiles de las aplicaciones y los registros originales de los dos procesos antes de comprobar las respuestas HTTP activas. La comprobación de la publicación reader debe devolver OK.

  ```bash
  set -euo pipefail
  cd ~/quest
  curl -fsS --max-time 2 http://127.0.0.1:18081/ > observed-publication.json
  python3 -I - <<'VERIFY_PUBLICATION'
  import json
  from pathlib import Path
  contract=json.loads(Path('consumer-contract.json').read_text())
  observed=json.loads(Path('observed-publication.json').read_text())
  assert observed['ready'] is True
  assert observed['source']==contract['vault_url']
  assert observed['path']==contract['path']
  assert observed['value_sha256']==contract['value_sha256']
  assert observed['version']==contract['version']
  print('OK')
  VERIFY_PUBLICATION
  ```

  Ambas aplicaciones originales sirven la publicación aprobada mediante la cadena de fuentes documentada.

  ```bash
  set -euo pipefail
  curl -fsS --max-time 2 http://127.0.0.1:18081/ > primary.json
  curl -fsS --max-time 2 http://127.0.0.1:18082/ > secondary.json
  jq -e --slurpfile first primary.json ' .ready==true and .source=="http://127.0.0.1:18081" and .version==$first[0].version and .value_sha256==$first[0].value_sha256' secondary.json
  ```
  Esperado: true.

  ```sh
  (
    set -euo pipefail
    cd ~/quest
    python3 -I - <<'VERIFY_ORIGINAL_CONSUMERS'
  import hashlib
  import json
  import stat
  from pathlib import Path

  facts = json.loads(Path("/run/dq/facts/0/consumer-contract.json").read_text())

  def read_regular(name, limit=8192):
      path = Path(name)
      info = path.lstat()
      assert stat.S_ISREG(info.st_mode) and info.st_size <= limit
      return path.read_bytes()

  for role in ("consumer", "downstream"):
      original = facts[role]
      assert read_regular(role + "/application.pid").decode().strip() == str(original["pid"])
      process = Path("/proc") / str(original["pid"])
      fields = (process / "stat").read_text().rsplit(") ", 1)[1].split()
      assert fields[0] not in ("Z", "X") and fields[19] == original["start"]
      assert (process / "cmdline").read_bytes().hex() == original["command"]
      observed = dict(line.split(":", 1) for line in (process / "status").read_text().splitlines() if ":" in line)
      assert all(observed[key].strip() == value for key, value in original["status"].items())

  assert hashlib.sha256(read_regular("provided-vault-consumer.py", 65536)).hexdigest() == facts["program_sha256"]
  reader = json.loads(read_regular("consumer/source.json", 4096))
  assert set(reader) == {"url", "path", "token_file"}
  assert reader["url"] == facts["vault_url"] and reader["path"] == facts["path"]
  credential = Path(reader["token_file"]).lstat()
  assert credential.st_uid == 1000 and stat.S_IMODE(credential.st_mode) == 0o600
  assert hashlib.sha256(read_regular(reader["token_file"], 4096).strip()).hexdigest() == facts["reader_sha256"]
  assert json.loads(read_regular("downstream/source.json", 4096)) == {"upstream": "http://127.0.0.1:18081"}
  print("Original process identities, program and private profiles match")
  VERIFY_ORIGINAL_CONSUMERS
  )
  ```
phrases.0: Distinguí la disponibilidad del proceso del estado del sello.
phrases.1: Comprobé el estado inicializado y desellado sin imprimir fragmentos.
phrases.2: Comparé el ID de clúster y comprobé el acceso de reader y manager.
stages.0.objectives.0.text: El endpoint de inicialización del Vault de práctica está disponible e informa initialized
  `true`.
stages.1.objectives.0.text: El Vault existente está inicializado y unsealed, conservando la identidad original del
  clúster y su configuración unseal.
stages.1.objectives.1.text: Ambas aplicaciones originales sirven la publicación aprobada mediante la cadena de fuentes
  documentada.
stages.1.objectives.2.text: La identidad manager suministrada recibe HTTP `403` al solicitar los datos dispatch
  existentes.
stages.1.objectives.3.text: El archivo `~/quest/unseal-shares.json` en la workstation tiene modo `0600`.
guides.reference_1: Consultar la API Vault pertinente
guides.reference_2: Referencia de publicación y consumidores
diagnostics.init: Setup detiene el Vault original ya inicializado; un endpoint inaccesible no exige reinicializar datos. Envíe la solicitud de arranque limitada de control/README.md y vuelva a comprobar. Fallo HTTP, respuesta inválida o initialized false producen este marcador; el recibo del agente no prueba salud. [Causa y comprobación](guides#guide=vault-recovery&section=original-vault-start-existing-service)
diagnostics.initialized: El Vault original ya está inicializado. Servicio detenido, error de seal-status o JSON ilegible también hacen fallar initialized; restaure disponibilidad e inspeccione estado antes de modificar datos. Reinicializar o sustituir storage puede destruir identidades necesarias. [Causa y comprobación](guides#guide=vault-recovery&section=original-vault-observe-original-initialization)
diagnostics.sealed: Arrancar el proceso deja sellado el almacenamiento existente. Envíe las dos partes distintas suministradas por la API sin imprimirlas; una sola no basta. Un fallo de estado o respuesta inválida también incumple sealed false. [Causa y comprobación](guides#guide=vault-recovery&section=original-vault-unseal-original-cluster)
diagnostics.cluster: Otro Vault o almacenamiento reinicializado puede estar disponible y desellado pero tener otro ID. Restaure servicio y storage originales; compare cluster_id con original-cluster-id congelado. Entrada ausente o fallo de estado también incumplen comparación. [Causa y comprobación](guides#guide=vault-recovery&section=original-vault-retain-cluster-identity)
diagnostics.threshold: La inicialización original usa umbral t igual a 2 y total n igual a 3. Reinicializar storage u observar otro endpoint puede dar otros valores; restaure fuente original e inspeccione respuesta. Errores HTTP o JSON también fallan; estos marcadores no exigen imprimir partes. [Causa y comprobación](guides#guide=vault-recovery&section=original-vault-retain-recovery-quorum)
diagnostics.shares: La inicialización original usa umbral t igual a 2 y total n igual a 3. Reinicializar storage u observar otro endpoint puede dar otros valores; restaure fuente original e inspeccione respuesta. Errores HTTP o JSON también fallan; estos marcadores no exigen imprimir partes. [Causa y comprobación](guides#guide=vault-recovery&section=original-vault-retain-recovery-quorum)
diagnostics.reader: La solicitud fuente falla con Vault detenido o sellado, credencial reader/ruta incorrecta o valor distinto de north-secret. Verifique reader suministrado por el canal privado de cabecera; éxito de fuente no prueba adopción por aplicaciones con caché. [Causa y comprobación](guides#guide=vault-recovery&section=original-vault-reader-source-boundary)
diagnostics.manager: Usar reader en lugar de manager o conceder al manager acceso rompe la denegación requerida. Conserve la credencial manager distinta y espere HTTP 403 en dispatch; fallo de red, respuesta sellada u otro código también fallan. [Causa y comprobación](guides#guide=vault-recovery&section=original-vault-manager-remains-denied)
diagnostics.mode: unseal-shares.json puede faltar o cambiar permisos durante recuperación. Restaure modo 0600 sin mostrar contenido. Esta condición solo compara modo, no estructura JSON ni exige cambiar el cuórum original. [Causa y comprobación](guides#guide=vault-recovery&section=original-vault-private-share-file-mode)
diagnostics.probe_1_1: Acceder a Vault no actualiza las aplicaciones. La primera usa inicialmente manager token denegado; restaure perfil exacto y archivo reader privado regular de UID 1000 con modo 0600, y envíe SIGHUP al proceso original. Corrija URL retirado downstream y actualice su proceso original tras estar lista la primera. Compare estados, registros y digest/version congelados; cambios de proceso, programa o privilegios, entradas inválidas y fallos sin nombre también dan este fallback. [Causa y comprobación](guides#guide=vault-recovery&section=original-vault-cached-consumer-chain)
diagnostics.probe_0_0: La condición falló antes de observar Vault con nombre, por ejemplo por platform.env ausente, ilegible o inválido al cargarlo. Restaure entorno y workspace suministrados; errores HTTP, estado o valor ya tienen marcador. El fallback aparece solo sin resultado nombrado y conserva limpieza de cabeceras privadas en el proceso hijo original. [Causa y comprobación](guides#guide=vault-recovery&section=original-vault-early-platform-input)
