title: Vault recovery
brief: |-
  The existing private Vault is unavailable. Recover its original identity and access to the stored data.

  Work on the workstation in `~/quest` with `platform.env`, `vault-repair.json`, `vault-agent-status.json`, `unseal-shares.json`.

  **Requirements:**

  - Stage 1:
    - The game Vault initialization endpoint is reachable and reports initialized `true`.

  - Stage 2:
    - The existing Vault is initialized and unsealed, retaining its original cluster identity and unseal configuration.
    - The supplied reader identity can retrieve the existing dispatch value `north-secret` from Vault.
    - The supplied manager identity receives HTTP `403` when requesting the existing dispatch data.
    - Workstation `~/quest/unseal-shares.json` has mode `0600`.

  The checks observe current status, identity and access; they do not prove the exact start request or the full storage history.
debrief: The initialization, seal status, recorded cluster ID, access results and share-file mode matched
  the checks.
stages.0.brief: Recover the initialization endpoint of the existing Vault.
stages.1.brief: Recover the original unsealed Vault with the required access boundary.
hints.0.text: Stopped, sealed and uninitialized are different states.
hints.1.text: |-
  Inspect the existing process status and seal state without displaying shares or tokens.

  ```bash
  cat vault-agent-status.json
  source platform.env
  curl -fsS "$VAULT_ADDR/v1/sys/seal-status"
  ```
hints.2.text: |-
  Verify the original cluster ID and existing reader data after unseal. Write exactly `{"action":"start"}` to `vault-repair.json`; the bounded agent starts the existing Vault on the next poll. Submit the two distinct supplied shares to `/v1/sys/unseal`; do not initialize again or replace storage. Start the existing process before using the two shares.

  Verify from `~/quest` on the workstation:

  - `source platform.env`
  - `curl -fsS "$VAULT_ADDR/v1/sys/init" | jq -e '.initialized == true'`

  Stage 1: `true`.

  - `source platform.env`
  - `curl -fsS "$VAULT_ADDR/v1/sys/seal-status" | jq '{initialized,sealed,t,n,cluster_id}'`

  Stage 2: `initialized: true`, `sealed: false`, `t: 2`, `n: 3`; `cluster_id` equals the frozen original.

  - `source platform.env`
  - `curl -fsS -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch" | jq -e '.data.data.value == "north-secret"' >/dev/null`
  - `curl -sS -o /dev/null -w '%{http_code}\n' -H @<(printf 'X-Vault-Token: %s\n' "$VAULT_MANAGER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch"`
  - `stat -c %a unseal-shares.json`

  Stage 2: Exit `0`; no credential or secret value is printed. The manager reports `403`; the share file reports `600`.
phrases.0: I distinguished process availability from seal state.
phrases.1: I checked the initialized and unsealed status without printing shares.
phrases.2: I compared the cluster ID and checked reader and manager access.
diagnostics.init: Vault sys/init initialized must be true.
diagnostics.initialized: Vault sys/seal-status initialized must be true.
diagnostics.sealed: Vault sys/seal-status sealed must be false.
diagnostics.cluster: The nonempty original-cluster-id must match Vault cluster_id.
diagnostics.threshold: Vault sys/seal-status t must be 2.
diagnostics.shares: Vault sys/seal-status n must be 3.
diagnostics.reader: The reader token must read north-secret from secret/data/dispatch.
diagnostics.manager: The manager token request to secret/data/dispatch must return HTTP 403.
diagnostics.mode: unseal-shares.json mode must be 0600.
stages.0.objectives.0.text: The game Vault initialization endpoint is reachable and reports initialized
  `true`.
stages.1.objectives.0.text: The existing Vault is initialized and unsealed, retaining its original cluster
  identity and unseal configuration.
stages.1.objectives.1.text: The supplied reader identity can retrieve the existing dispatch value `north-secret`
  from Vault.
stages.1.objectives.2.text: The supplied manager identity receives HTTP `403` when requesting the existing
  dispatch data.
stages.1.objectives.3.text: Workstation `~/quest/unseal-shares.json` has mode `0600`.
