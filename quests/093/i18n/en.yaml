title: Vault recovery
brief: 'The private game Vault process is stopped, but its initialized file storage still exists. Request
  its start by writing exactly {"action":"start"} to vault-repair.json. The bounded game agent can start
  only this bay''s existing Vault container; it cannot initialize or replace storage. Once reachable,
  inspect initialized/sealed state and use the two provided game-only shares. Recover the original cluster
  ID, reader token and KV data. Never call sys/init again or substitute a new Vault.


  Quest files in `~/quest` (some appear in later stages): `platform.env`, `vault-repair.json`, `vault-agent-status.json`,
  `unseal-shares.json`, `original-cluster-id`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: The existing game Vault process is started; recovery proceeds with the original
  storage.'
debrief: The process and seal were recovered without recreating initialized storage.
