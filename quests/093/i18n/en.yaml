title: Vault recovery
brief: 'Recover the unavailable original Vault and restore publication through both existing applications. Preserve
  its cluster identity, recovery quorum and private shares. The manager must remain unable to read the source. The
  second application must serve the approved publication from the original first application; restore both consumers
  without replacing their processes. The service control interface is documented in `control/README.md`.


  Work in `~/quest`. The supplied consumer directory contains its configuration, process receipt and application
  log. `consumer/README.md` describes the application interface; `consumer-contract.json` records the original processes,
  approved source identity, publication digest and version. Preserve the original application programs, process
  identities and privileges. Each consumer must serve the approved publication through its existing HTTP endpoint
  using the original source and private supplied reader identity; a successful manual source request is insufficient.
  Keep credential files regular, owned by the workstation user, with mode `0600`. Do not print credentials or secret
  values.


  **Requirements:**


  - Stage 1: The game Vault initialization endpoint is reachable and reports initialized `true`.

  - Stage 2: The existing Vault is initialized and unsealed, retaining its original cluster identity and unseal
  configuration.

  - Stage 2: Both original applications serve the approved publication through the documented source chain.

  - Stage 2: The supplied manager identity receives HTTP `403` when requesting the existing dispatch data.

  - Stage 2: Workstation `~/quest/unseal-shares.json` has mode `0600`.'
debrief: The original source and consumer identities were preserved, and the running applications adopted the approved
  publication.
stages.0.brief: Recover the initialization endpoint of the existing Vault.
stages.1.brief: Recover the unavailable original Vault and restore publication through both existing applications.
  Preserve its cluster identity, recovery quorum and private shares. The manager must remain unable to read the
  source. The second application must serve the approved publication from the original first application; restore
  both consumers without replacing their processes. The service control interface is documented in `control/README.md`.
hints.0.text: Server availability, authorization and a consumer’s adopted publication are different observations.
hints.1.text: 'Compare the live service response, source profiles, application logs and original contract. Trace
  the first failing boundary before changing another component.


  ```bash

  cat consumer/source.json consumer/application.log consumer-contract.json

  curl -fsS --max-time 2 http://127.0.0.1:18081/status

  ```


  ```bash

  cat downstream/source.json downstream/application.log

  curl -fsS --max-time 2 http://127.0.0.1:18082/status

  ```'
hints.2.text: 'Verify the original cluster ID and existing reader data after unseal. Write exactly `{"action":"start"}`
  to `vault-repair.json`; the bounded agent starts the existing Vault on the next poll. Submit the two distinct
  supplied shares to `/v1/sys/unseal`; do not initialize again or replace storage. Start the existing process before
  using the two shares.


  Verify from `~/quest` on the workstation:


  - `source platform.env`

  - `curl -fsS "$VAULT_ADDR/v1/sys/init" | jq -e ''.initialized == true''`


  Stage 1: `true`.


  - `source platform.env`

  - `curl -fsS "$VAULT_ADDR/v1/sys/seal-status" | jq ''{initialized,sealed,t,n,cluster_id}''`


  Stage 2: `initialized: true`, `sealed: false`, `t: 2`, `n: 3`; `cluster_id` equals the frozen original.


  - `source platform.env`

  - `curl -fsS -H @<(printf ''X-Vault-Token: %s\n'' "$VAULT_READER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch"
  | jq -e ''.data.data.value == "north-secret"'' >/dev/null`

  - `curl -sS -o /dev/null -w ''%{http_code}\n'' -H @<(printf ''X-Vault-Token: %s\n'' "$VAULT_MANAGER_TOKEN") "$VAULT_ADDR/v1/secret/data/dispatch"`

  - `stat -c %a unseal-shares.json`


  Stage 2: Exit `0`; no credential or secret value is printed. The manager reports `403`; the share file reports
  `600`.


  Match the profile to the approved API source and supplied reader credential. Keep the credential private and send
  SIGHUP to the existing application PID; the manager is a different identity. Recheck the HTTP publication, not
  only the source. Expected: OK.


  ```bash

  set -euo pipefail

  cd ~/quest

  curl -fsS --max-time 2 http://127.0.0.1:18081/ > observed-publication.json

  python3 -I - <<''VERIFY_PUBLICATION''

  import json

  from pathlib import Path

  contract=json.loads(Path(''consumer-contract.json'').read_text())

  observed=json.loads(Path(''observed-publication.json'').read_text())

  assert observed[''ready''] is True

  assert observed[''source'']==contract[''vault_url'']

  assert observed[''path'']==contract[''path'']

  assert observed[''value_sha256'']==contract[''value_sha256'']

  assert observed[''version'']==contract[''version'']

  print(''OK'')

  VERIFY_PUBLICATION

  ```


  Both original applications serve the approved publication through the documented source chain.


  ```bash

  set -euo pipefail

  curl -fsS --max-time 2 http://127.0.0.1:18081/ > primary.json

  curl -fsS --max-time 2 http://127.0.0.1:18082/ > secondary.json

  jq -e --slurpfile first primary.json '' .ready==true and .source=="http://127.0.0.1:18081" and .version==$first[0].version
  and .value_sha256==$first[0].value_sha256'' secondary.json

  ```

  Expected: true. Correct the downstream source and send SIGHUP to its original PID after the primary publication
  is ready.'
phrases.0: I distinguished process availability from seal state.
phrases.1: I checked the initialized and unsealed status without printing shares.
phrases.2: I compared the cluster ID and checked reader and manager access.
diagnostics.init: Vault sys/init initialized must be true.
diagnostics.initialized: Vault sys/seal-status initialized must be true.
diagnostics.sealed: Vault sys/seal-status sealed must be false.
diagnostics.cluster: The nonempty original-cluster-id must match Vault cluster_id.
diagnostics.threshold: Vault sys/seal-status t must be 2.
diagnostics.shares: Vault sys/seal-status n must be 3.
diagnostics.reader: The reader token must read north-secret from secret/data/dispatch.
diagnostics.manager: The manager token request to secret/data/dispatch must return HTTP 403.
diagnostics.mode: unseal-shares.json mode must be 0600.
stages.0.objectives.0.text: The game Vault initialization endpoint is reachable and reports initialized `true`.
stages.1.objectives.0.text: The existing Vault is initialized and unsealed, retaining its original cluster identity
  and unseal configuration.
stages.1.objectives.1.text: Both original applications serve the approved publication through the documented source
  chain.
stages.1.objectives.2.text: The supplied manager identity receives HTTP `403` when requesting the existing dispatch
  data.
stages.1.objectives.3.text: Workstation `~/quest/unseal-shares.json` has mode `0600`.
diagnostics.probe_1_1: Both original applications must adopt the approved publication with private reader credentials
  and the original source chain. Compare both profiles, logs and HTTP responses.
guides.reference_1: Inspect the relevant Vault API
