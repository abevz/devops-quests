hints.0.text: Stopped, sealed and uninitialized are different states.
hints.1.text: Start the existing process before using the two shares.
hints.2.text: Verify the original cluster ID and existing reader data after unseal.
phrases.0: I distinguished process availability from seal state.
phrases.1: I recovered the initialized store without reinitializing Vault.
phrases.2: I verified the original cluster identity and existing credentials.
