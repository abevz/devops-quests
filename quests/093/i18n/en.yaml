title: Vault recovery
brief: 'Work in `~/quest` with `platform.env`, `vault-agent-status.json`, `unseal-shares.json` and `original-cluster-id`.
  The private game Vault process is stopped, but initialized storage is supplied. Write exactly `{"action":"start"}` to `vault-repair.json`;
  the bounded bay agent starts its existing Vault. Wait for the initialization endpoint to be reachable. Never print shares
  or tokens, call sys/init to initialize again, or replace storage. The linked Vault guide explains the agent, unseal requests
  and KV-v2 reads.


  After it starts, submit the two distinct supplied shares to `/v1/sys/unseal` and keep `unseal-shares.json` at mode `0600`.
  Verify `/v1/sys/seal-status` reports `initialized=true`, `sealed=false`, `t=2` and `n=3`, and its cluster ID matches `/run/dq/facts/0/original-cluster-id`.
  The reader token must retrieve `north-secret` as `.data.data.value` from `secret/data/dispatch`; the manager token must
  get HTTP 403 on the same path. The checks observe current status, identity and access; they do not prove the exact start
  request or the full storage history. Use only this offline game bay.'
debrief: The initialization, seal status, recorded cluster ID, access results and share-file mode matched the checks.
stages.0.brief: The initialization endpoint is reachable and reports initialized=true.
stages.0.objectives.0.text: The initialization endpoint is reachable and reports initialized=true.
stages.1.brief: Seal status and cluster ID, reader value, manager denial and share-file mode match the brief.
stages.1.objectives.0.text: Seal status and cluster ID, reader value, manager denial and share-file mode match the brief.
hints.0.text: Stopped, sealed and uninitialized are different states.
hints.1.text: Start the existing process before using the two shares.
hints.2.text: Verify the original cluster ID and existing reader data after unseal.
phrases.0: I distinguished process availability from seal state.
phrases.1: I checked the initialized and unsealed status without printing shares.
phrases.2: I compared the cluster ID and checked reader and manager access.
diagnostics.init: Vault sys/init initialized must be true.
diagnostics.initialized: Vault sys/seal-status initialized must be true.
diagnostics.sealed: Vault sys/seal-status sealed must be false.
diagnostics.cluster: The nonempty original-cluster-id must match Vault cluster_id.
diagnostics.threshold: Vault sys/seal-status t must be 2.
diagnostics.shares: Vault sys/seal-status n must be 3.
diagnostics.reader: The reader token must read north-secret from secret/data/dispatch.
diagnostics.manager: The manager token request to secret/data/dispatch must return HTTP 403.
diagnostics.mode: unseal-shares.json mode must be 0600.
