id: 93
title: title
track: Platform
difficulty: expert
brief: brief
stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    check: 'source platform.env

      curl -fsS "$VAULT_ADDR/v1/sys/init" | jq -e ".initialized==true" >/dev/null'
- brief: stages.1.brief
  objectives:
  - text: stages.1.objectives.0.text
    check: 'source platform.env

      curl -fsS "$VAULT_ADDR/v1/sys/seal-status" | jq -e --arg id "$(cat /run/dq/facts/0/original-cluster-id)"
      ''.initialized==true and .sealed==false and .cluster_id==$id and .t==2 and .n==3'' >/dev/null

      test "$(curl -fsS -H "X-Vault-Token: $VAULT_READER_TOKEN" "$VAULT_ADDR/v1/secret/data/dispatch"
      | jq -er .data.data.value)" = north-secret

      test "$(curl -sS -o /dev/null -w ''%{http_code}'' -H "X-Vault-Token: $VAULT_MANAGER_TOKEN" "$VAULT_ADDR/v1/secret/data/dispatch")"
      = 403

      test "$(stat -c %a unseal-shares.json)" = 600'
hints:
- text: hints.0.text
  guide: kubernetes-20
- text: hints.1.text
  guide: kubernetes-20
- text: hints.2.text
  guide: kubernetes-20
debrief: debrief
phrases:
- phrases.0
- phrases.1
- phrases.2
questions: []
facts:
  environment:
  - DQ_NAMESPACE
  - DQ_APP_IMAGE
  - KUBECONFIG
  - TF_CLI_CONFIG_FILE
  files:
  - platform.env
  - vault-repair.json
  - vault-agent-status.json
  - unseal-shares.json
  - original-cluster-id
  services: []
immutable:
  0:
  - original-cluster-id
