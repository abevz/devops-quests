title: Protección del ciclo de vida
brief: 'El aviso publicado no cumple el contrato de resultado requerido.


  Trabaja en la workstation en `~/quest` con `main.tf`.


  **Requisitos:**

  - El aviso publicado está registrado por la configuración suministrada.

  - Un plan detallado no muestra cambios de infraestructura pendientes y termina con código `0`.

  - La protección del recurso rechaza planificar la eliminación del aviso administrado.

  - En la workstation, `~/quest/notice.txt` contiene `north-ready`.


  La comprobación observa los resultados actuales; no demuestra una historia de protección.

  '
stages.0.brief: El aviso debe estar disponible y protegido contra la eliminación planificada.
hints.0.text: La convergencia normal y la protección contra eliminación son propiedades distintas.
hints.1.text: 'Inspecciona las entradas suministradas y el estado gestionado actual:


  ```sh

  cat main.tf

  tofu show -no-color

  tofu plan -input=false -no-color

  ```'
hints.2.text: 'Corrige los cambios manuales en el contenido del archivo y añade una protección del ciclo de vida.


  Usa prevent_destroy y aplica el contenido correcto del aviso.


  Verifica el resultado observado:


  - `cat notice.txt; tofu show -no-color` — Muestra `north-ready` y el recurso registrado `local_file.notice`.


  - `tofu plan -input=false -detailed-exitcode -no-color` — Termina con `0` y no informa cambios de infraestructura
  pendientes.


  - `tofu plan -destroy -input=false -no-color` — Termina con código distinto de cero porque la protección
  del recurso rechaza la eliminación.'
debrief: El plan normal no tiene cambios y el plan de destrucción falló con `prevent_destroy` en su registro.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Comparé el recurso en vivo ID con el estado OpenTofu.
diagnostics.condition_0: tofu state list debe contener local_file.notice.
diagnostics.condition_1: El plan de OpenTofu con detailed-exitcode debe terminar con código 0.
diagnostics.condition_2: El plan de destrucción de OpenTofu debe terminar con código distinto de cero.
diagnostics.condition_3: destroy-plan.log debe contener prevent_destroy.
diagnostics.condition_4: notice.txt debe ser igual a north-ready.
stages.0.objectives.0.text: El aviso publicado está registrado por la configuración suministrada.
stages.0.objectives.1.text: OpenTofu no informa cambios de infraestructura pendientes.
stages.0.objectives.2.text: La protección del recurso rechaza planificar la eliminación del aviso administrado.
stages.0.objectives.3.text: En la workstation, `~/quest/notice.txt` contiene `north-ready`.
