title: Protección del ciclo de vida
brief: 'Trabaja en `~/quest` y examina `main.tf`, que declara `local_file.notice` y el contenido previsto del archivo. El `notice.txt` existente ha cambiado fuera de la configuración. La guía enlazada introduce reglas de ciclo de vida. `prevent_destroy` bloquea un plan de destrucción mientras la regla existe. Usa solo la bahía sin conexión.


  Corrige la desviación del archivo y protege el recurso. Comprueba que `tofu state list` contiene `local_file.notice`, que `notice.txt` contiene `north-ready` y que `tofu plan -input=false -detailed-exitcode -no-color` termina con código 0 (sin cambios). Un plan de destrucción debe fallar y su `destroy-plan.log` debe contener `prevent_destroy`. La comprobación observa estos resultados; no demuestra el historial de protección.'
stages.0.brief: Existe la dirección de estado, `notice.txt` contiene `north-ready`, el plan normal termina con código 0 y el plan de destrucción falla con `prevent_destroy`.
stages.0.objectives.0.text: Existe la dirección de estado, `notice.txt` contiene `north-ready`, el plan normal termina con código 0 y el plan de destrucción falla con `prevent_destroy`.
hints.0.text: Compare un plan normal con un destroy plan.
hints.1.text: Repare la desviación de la lima manual y agregue un lifecycle guard.
hints.2.text: Utilice prevent_destroy, aplique el contenido correcto y verifique que la planificación
  de destroy rechace la eliminación.
debrief: El plan normal no tiene cambios y el plan de destrucción falló con `prevent_destroy` en su registro.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Comparé el recurso en vivo ID con el estado OpenTofu.
