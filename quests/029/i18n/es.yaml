title: Protección del ciclo de vida
brief: 'El aviso publicado no cumple el contrato de resultado requerido.


  Trabaja en la workstation en `~/quest` con `main.tf`.


  **Requisitos:**

  - El aviso publicado está registrado por la configuración suministrada.

  - Un plan detallado no muestra cambios de infraestructura pendientes y termina con código `0`.

  - La protección del recurso rechaza planificar la eliminación del aviso administrado.

  - En la workstation, `~/quest/notice.txt` contiene `north-ready`.


  La comprobación observa los resultados actuales; no demuestra una historia de protección.

  '
stages.0.brief: El aviso debe estar disponible y protegido contra la eliminación planificada.
hints.0.text: La convergencia normal y la protección contra eliminación son propiedades distintas.
hints.1.text: 'Inspecciona las entradas suministradas y el estado gestionado actual:


  ```sh

  cat main.tf

  tofu show -no-color

  tofu plan -input=false -no-color

  ```'
hints.2.text: |-
  Corrige los cambios manuales en el contenido del archivo y añade una protección del ciclo de vida.

  Usa prevent_destroy y aplica el contenido correcto del aviso.

  Verifica el resultado observado:

  - `cat notice.txt; tofu show -no-color` — Muestra `north-ready` y el recurso registrado `notice.txt`.

  - `tofu plan -input=false -detailed-exitcode -no-color` — Termina con `0` y no informa cambios de infraestructura pendientes.

  - `tofu plan -destroy -input=false -no-color` — Termina con código distinto de cero porque la protección del recurso rechaza la eliminación.

  El archivo gestionado notice.txt contiene north-ready.
debrief: El plan normal no tiene cambios y el plan de destrucción falló con `prevent_destroy` en su registro.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Comparé el recurso en vivo ID con el estado OpenTofu.
diagnostics.condition_0: |-
  El archivo puede existir sin un recurso en el estado que gestione notice.txt. Revisa su ruta y si se aplicó la configuración. [Guía](guides#guide=terraform-6&section=protecting-the-managed-notice)
diagnostics.condition_1: |-
  El plan puede mostrar cambios si notice.txt difiere de su declaración o si falta aplicar la configuración corregida. [Guía](guides#guide=terraform-6&section=protecting-the-managed-notice)
diagnostics.condition_2: |-
  El plan de eliminación puede tener éxito si el aviso carece de protección. Si falta la dirección en el estado, la prueba puede no ejecutar el plan dirigido. [Guía](guides#guide=terraform-6&section=protecting-the-managed-notice)
diagnostics.condition_3: |-
  El plan de eliminación puede fallar por otro recurso o un error de configuración. El rechazo debe identificar prevent_destroy en el recurso que gestiona notice.txt. [Guía](guides#guide=terraform-6&section=protecting-the-managed-notice)
diagnostics.condition_4: |-
  El aviso puede conservar contenido anterior tras una edición manual o si falta aplicar la declaración corregida. [Guía](guides#guide=terraform-6&section=protecting-the-managed-notice)
stages.0.objectives.0.text: El aviso publicado está registrado por la configuración suministrada.
stages.0.objectives.1.text: OpenTofu no informa cambios de infraestructura pendientes.
stages.0.objectives.2.text: La protección del recurso rechaza planificar la eliminación del aviso administrado.
stages.0.objectives.3.text: En la workstation, `~/quest/notice.txt` contiene `north-ready`.
diagnostics.probe_0_0: |-
  Si la prueba termina antes de informar de un resultado, comprueba el inicio de Python y el acceso a los datos necesarios. [Guía](guides#guide=terraform-6&section=protecting-the-managed-notice)
diagnostics.probe_0_2: |-
  Si la prueba termina antes de informar de un resultado, comprueba el inicio de Python y el acceso a los datos necesarios. [Guía](guides#guide=terraform-6&section=protecting-the-managed-notice)
