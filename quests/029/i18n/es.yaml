title: Protección del ciclo de vida
brief: 'Te uniste a las operaciones de SignalRail. Proteja el libro mayor route de la destrucción accidental.
  Trabajar en ~/quest. Mantenga todos los cambios dentro de esta bahía de entrenamiento.


  Entradas en `~/quest`: `main.tf`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente los archivos suministrados, las imágenes
  precargadas y los servicios privados. Todos los cambios deben permanecer dentro de esta bahía.


  Criterios de éxito iniciales: la planificación de destrucción está bloqueada por prevent_destroy.'
stages.0.brief: 'Conserve el ledger administrado y haga que un destroy plan rechace su eliminación.


  Criterios de éxito: la planificación de destrucción está bloqueada por prevent_destroy.'
stages.0.objectives.0.text: La planificación de destrucción está bloqueada por prevent_destroy.
hints.0.text: Compare un plan normal con un destroy plan.
hints.1.text: Repare la desviación de la lima manual y agregue un lifecycle guard.
hints.2.text: Utilice prevent_destroy, aplique el contenido correcto y verifique que la planificación
  de destroy rechace la eliminación.
debrief: El ledger no tenía protección contra destrucción. Agregó prevent_destroy y verificó que un destroy
  plan rechazó la eliminación mientras que el plan normal permaneció vacío.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Comparé el recurso en vivo ID con el estado OpenTofu.
