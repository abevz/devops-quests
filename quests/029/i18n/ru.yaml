title: Защита lifecycle
brief: 'Вы в команде эксплуатации SignalRail. Защитите реестр от случайного удаления. Работайте в ~/quest.
  Все изменения — только в этой песочнице.


  Входные файлы в `~/quest`: `main.tf`.


  В песочнице нет интернета и внешнего DNS. Используйте только выданные файлы, предварительно загруженные
  образы и приватные сервисы. Все изменения — только в этой песочнице.


  Цели первого этапа: План удаления блокируется prevent_destroy.'
stages.0.brief: 'Сохраните ledger и запретите удаление в destroy plan.


  Результат проверки: План удаления блокируется prevent_destroy.'
stages.0.objectives.0.text: План удаления блокируется prevent_destroy.
hints.0.text: Сравните обычный plan с destroy plan.
hints.1.text: Исправьте ручной дрейф файла и добавьте lifecycle guard.
hints.2.text: Используйте prevent_destroy, примените правильное содержимое и проверьте отказ destroy plan
  в удалении.
debrief: 'У ledger не было защиты удаления. Вы добавили prevent_destroy: destroy plan отказал в удалении,
  обычный plan остался пустым.'
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я сравнил ID живого ресурса с state OpenTofu.
