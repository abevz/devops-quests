title: Защита lifecycle
brief: |
  Опубликованное уведомление не соответствует требуемому результату.

  Работайте на workstation в `~/quest` с файлами `main.tf`.

  **Требования:**
  - Состояние OpenTofu:
    - Требуемые адреса: `local_file.notice`.
  - Файлы на workstation:
    - `~/quest/notice.txt`: `north-ready`.
  - Согласованность инфраструктуры:
    - Нет ожидающих изменений инфраструктуры; код завершения подробного плана `0`.
  - Защита от удаления:
    - План, который удалил бы управляемое уведомление, отклоняется защитой ресурса.

  **Самопроверка перед Check & finish:**
  - `cat notice.txt; tofu show -no-color` — Показывает `north-ready` и отслеживаемый ресурс `local_file.notice`.
  - `tofu plan -input=false -detailed-exitcode -no-color` — Завершается с кодом `0` и не сообщает об ожидающих изменениях инфраструктуры.
  - `tofu plan -destroy -input=false -no-color` — Завершается с ненулевым кодом, поскольку защита ресурса отклоняет удаление.

  Проверка наблюдает текущие результаты; она не доказывает историю защиты.
stages.0.brief: Уведомление должно быть доступно и защищено от планируемого удаления.
hints.0.text: Обычная сходимость и защита от удаления — разные свойства.
hints.1.text: Исправьте ручной дрейф файла и добавьте lifecycle guard.
hints.2.text: Используйте prevent_destroy и примените правильное содержимое уведомления.
debrief: Обычный план не содержит изменений, а план уничтожения завершился ошибкой с `prevent_destroy` в журнале.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я сравнил ID живого ресурса с state OpenTofu.
diagnostics.condition_0: tofu state list должен содержать local_file.notice.
diagnostics.condition_1: План OpenTofu с detailed-exitcode должен завершиться с кодом 0.
diagnostics.condition_2: План удаления OpenTofu должен завершиться ненулевым кодом.
diagnostics.condition_3: destroy-plan.log должен содержать prevent_destroy.
diagnostics.condition_4: notice.txt должен совпадать с north-ready.
stages.0.objectives.0.text: Состояние OpenTofu содержит `local_file.notice`.
stages.0.objectives.1.text: OpenTofu не сообщает об ожидающих изменениях инфраструктуры.
stages.0.objectives.2.text: Планирование удаления управляемого уведомления отклоняется защитой ресурса.
stages.0.objectives.3.text: На workstation `notice.txt` содержит `north-ready`.
