title: Защита lifecycle
brief: 'Опубликованное уведомление не соответствует требуемому результату.


  Работайте на workstation в `~/quest` с файлами `main.tf`.


  **Требования:**

  - Опубликованное уведомление отслеживается поставленной конфигурацией.

  - Подробный план не содержит ожидающих изменений инфраструктуры и завершается с кодом `0`.

  - Планирование удаления управляемого уведомления отклоняется защитой ресурса.

  - На workstation `~/quest/notice.txt` содержит `north-ready`.


  Проверка наблюдает текущие результаты; она не доказывает историю защиты.

  '
stages.0.brief: Уведомление должно быть доступно и защищено от планируемого удаления.
hints.0.text: Обычная сходимость и защита от удаления — разные свойства.
hints.1.text: 'Изучите поставленные входные данные и текущее управляемое состояние:


  ```sh

  cat main.tf

  tofu show -no-color

  tofu plan -input=false -no-color

  ```'
hints.2.text: |-
  Исправьте ручной дрейф файла и добавьте lifecycle guard.

  Используйте prevent_destroy и примените правильное содержимое уведомления.

  Проверьте наблюдаемый результат:

  - `cat notice.txt; tofu show -no-color` — Показывает `north-ready` и отслеживаемый ресурс `notice.txt`.

  - `tofu plan -input=false -detailed-exitcode -no-color` — Завершается с кодом `0` и не сообщает об ожидающих изменениях инфраструктуры.

  - `tofu plan -destroy -input=false -no-color` — Завершается с ненулевым кодом, поскольку защита ресурса отклоняет удаление.

  Управляемый файл notice.txt содержит north-ready.
debrief: Обычный план не содержит изменений, а план уничтожения завершился ошибкой с `prevent_destroy` в журнале.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я сравнил ID живого ресурса с state OpenTofu.
diagnostics.condition_0: |-
  Состояние OpenTofu должно учитывать управляемый файл-источник notice.txt.

diagnostics.condition_1: План OpenTofu с detailed-exitcode должен завершиться с кодом 0.
diagnostics.condition_2: План удаления OpenTofu должен завершиться ненулевым кодом.
diagnostics.condition_3: destroy-plan.log должен содержать prevent_destroy.
diagnostics.condition_4: notice.txt должен совпадать с north-ready.
stages.0.objectives.0.text: Опубликованное уведомление отслеживается поставленной конфигурацией.
stages.0.objectives.1.text: OpenTofu не сообщает об ожидающих изменениях инфраструктуры.
stages.0.objectives.2.text: Планирование удаления управляемого уведомления отклоняется защитой ресурса.
stages.0.objectives.3.text: На workstation `~/quest/notice.txt` содержит `north-ready`.
diagnostics.probe_0_0: 'Текущие данные не позволили проверить эту цель: Опубликованное уведомление отслеживается
  поставленной конфигурацией.'
diagnostics.probe_0_2: 'Текущие данные не позволили проверить эту цель: Планирование удаления управляемого уведомления
  отклоняется защитой ресурса.'
