title: Защита lifecycle
brief: 'Работайте в `~/quest` и изучите `main.tf`, где объявлены `local_file.notice` и требуемое содержимое файла. Существующий
  `notice.txt` изменён вне конфигурации. Руководство знакомит с правилами жизненного цикла. `prevent_destroy` блокирует план
  уничтожения, пока правило существует. Используйте только офлайн-песочницу.


  Исправьте расхождение файла и защитите ресурс. Проверьте, что `tofu state list` содержит `local_file.notice`, `notice.txt`
  содержит `north-ready`, а `tofu plan -input=false -detailed-exitcode -no-color` завершается с кодом 0 (изменений нет). План
  уничтожения должен завершиться ошибкой, а его `destroy-plan.log` должен содержать `prevent_destroy`. Проверка наблюдает
  эти результаты, но не доказывает историю защиты.'
stages.0.brief: Адрес состояния существует, `notice.txt` содержит `north-ready`, обычный план завершается с кодом 0, а план
  уничтожения — с ошибкой и `prevent_destroy`.
stages.0.objectives.0.text: Адрес состояния существует, `notice.txt` содержит `north-ready`, обычный план завершается с кодом
  0, а план уничтожения — с ошибкой и `prevent_destroy`.
hints.0.text: Сравните обычный plan с destroy plan.
hints.1.text: Исправьте ручной дрейф файла и добавьте lifecycle guard.
hints.2.text: Используйте prevent_destroy, примените правильное содержимое и проверьте отказ destroy plan в удалении.
debrief: Обычный план не содержит изменений, а план уничтожения завершился ошибкой с `prevent_destroy` в журнале.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я сравнил ID живого ресурса с state OpenTofu.
diagnostics.condition_0: tofu state list должен содержать local_file.notice.
diagnostics.condition_1: План OpenTofu с detailed-exitcode должен завершиться с кодом 0.
diagnostics.condition_2: План удаления OpenTofu должен завершиться ненулевым кодом.
diagnostics.condition_3: destroy-plan.log должен содержать prevent_destroy.
diagnostics.condition_4: notice.txt должен совпадать с north-ready.
