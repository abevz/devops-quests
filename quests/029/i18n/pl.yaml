title: Ochrona cyklu życia
brief: 'Pracuj w `~/quest` i przeczytaj `main.tf`, który deklaruje `local_file.notice` i docelową zawartość pliku. Istniejący `notice.txt` został zmieniony poza konfiguracją. Połączony przewodnik przedstawia reguły cyklu życia. `prevent_destroy` blokuje plan usunięcia, gdy reguła istnieje. Korzystaj tylko z zatoki offline.


  Napraw rozbieżność pliku i zabezpiecz zasób. Sprawdź, czy `tofu state list` zawiera `local_file.notice`, `notice.txt` zawiera `north-ready`, a `tofu plan -input=false -detailed-exitcode -no-color` kończy się kodem 0 (brak zmian). Plan usunięcia musi się nie powieść, a jego `destroy-plan.log` musi zawierać `prevent_destroy`. Kontrola obserwuje te wyniki, a nie dowodzi historii zabezpieczenia.'
stages.0.brief: Istnieje adres stanu, `notice.txt` zawiera `north-ready`, zwykły plan kończy się kodem 0, a plan usunięcia kończy się błędem z `prevent_destroy`.
stages.0.objectives.0.text: Istnieje adres stanu, `notice.txt` zawiera `north-ready`, zwykły plan kończy się kodem 0, a plan usunięcia kończy się błędem z `prevent_destroy`.
hints.0.text: Porównaj normalny plan z destroy plan.
hints.1.text: Napraw ręczne przesunięcie pliku i dodaj plik lifecycle guard.
hints.2.text: Użyj prevent_destroy, zastosuj poprawną treść i sprawdź, czy planowanie zniszczenia odmawia
  usunięcia.
debrief: Zwykły plan nie zawiera zmian, a plan usunięcia zakończył się błędem z `prevent_destroy` w dzienniku.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Porównałem aktywny zasób ID ze stanem OpenTofu.
