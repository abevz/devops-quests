title: Ochrona cyklu życia
brief: |
  Opublikowane powiadomienie nie spełnia wymaganego kontraktu wyniku.

  Pracuj na workstation w `~/quest` z plikami `main.tf`.

  **Wymagania:**
  - Stan OpenTofu:
    - Wymagane adresy: `local_file.notice`.
  - Pliki na workstation:
    - `~/quest/notice.txt`: `north-ready`.
  - Zbieżność infrastruktury:
    - Brak oczekujących zmian infrastruktury; kod zakończenia szczegółowego planu `0`.
  - Ochrona przed usunięciem:
    - Ochrona zasobu odrzuca plan usunięcia zarządzanego powiadomienia.

  **Sprawdź przed Check & finish:**
  - `cat notice.txt; tofu show -no-color` — Pokazuje `north-ready` i śledzony zasób `local_file.notice`.
  - `tofu plan -input=false -detailed-exitcode -no-color` — Kończy się kodem `0` i nie zgłasza oczekujących zmian infrastruktury.
  - `tofu plan -destroy -input=false -no-color` — Kończy się kodem różnym od zera, ponieważ ochrona zasobu odrzuca usunięcie.

  Sprawdzenie obserwuje bieżące wyniki; nie dowodzi historii ochrony.
stages.0.brief: Powiadomienie musi być dostępne i chronione przed planowanym usunięciem.
hints.0.text: Zwykła zbieżność i ochrona przed usunięciem to odrębne właściwości.
hints.1.text: Napraw ręczne przesunięcie pliku i dodaj plik lifecycle guard.
hints.2.text: Użyj prevent_destroy i zastosuj właściwą treść powiadomienia.
debrief: Zwykły plan nie zawiera zmian, a plan usunięcia zakończył się błędem z `prevent_destroy` w dzienniku.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Porównałem aktywny zasób ID ze stanem OpenTofu.
diagnostics.condition_0: tofu state list musi zawierać local_file.notice.
diagnostics.condition_1: Plan OpenTofu z detailed-exitcode musi zakończyć się kodem 0.
diagnostics.condition_2: Plan usunięcia OpenTofu musi zakończyć się kodem różnym od zera.
diagnostics.condition_3: destroy-plan.log musi zawierać prevent_destroy.
diagnostics.condition_4: notice.txt musi być równe north-ready.
stages.0.objectives.0.text: Stan OpenTofu zawiera `local_file.notice`.
stages.0.objectives.1.text: OpenTofu nie zgłasza oczekujących zmian infrastruktury.
stages.0.objectives.2.text: Ochrona zasobu odrzuca planowanie usunięcia zarządzanego powiadomienia.
stages.0.objectives.3.text: Na workstation `notice.txt` zawiera `north-ready`.
