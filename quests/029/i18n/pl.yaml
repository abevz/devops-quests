title: Ochrona cyklu życia
brief: 'Opublikowane powiadomienie nie spełnia wymaganego kontraktu wyniku.


  Pracuj na workstation w `~/quest` z plikami `main.tf`.


  **Wymagania:**

  - Opublikowany komunikat jest śledzony przez dostarczoną konfigurację.

  - Szczegółowy plan nie zawiera oczekujących zmian infrastruktury i kończy się kodem `0`.

  - Ochrona zasobu odrzuca planowanie usunięcia zarządzanego powiadomienia.

  - Na workstation `~/quest/notice.txt` zawiera `north-ready`.


  Sprawdzenie obserwuje bieżące wyniki; nie dowodzi historii ochrony.

  '
stages.0.brief: Powiadomienie musi być dostępne i chronione przed planowanym usunięciem.
hints.0.text: Zwykła zbieżność i ochrona przed usunięciem to odrębne właściwości.
hints.1.text: 'Sprawdź dostarczone dane wejściowe i bieżący zarządzany stan:


  ```sh

  cat main.tf

  tofu show -no-color

  tofu plan -input=false -no-color

  ```'
hints.2.text: |-
  Napraw ręczne zmiany treści pliku i dodaj ochronę cyklu życia.

  Użyj prevent_destroy i zastosuj właściwą treść powiadomienia.

  Sprawdź obserwowany wynik:

  - `cat notice.txt; tofu show -no-color` — Pokazuje `north-ready` i śledzony zasób `notice.txt`.

  - `tofu plan -input=false -detailed-exitcode -no-color` — Kończy się kodem `0` i nie zgłasza oczekujących zmian infrastruktury.

  - `tofu plan -destroy -input=false -no-color` — Kończy się kodem różnym od zera, ponieważ ochrona zasobu odrzuca usunięcie.

  Zarządzany plik notice.txt zawiera north-ready.
debrief: Zwykły plan nie zawiera zmian, a plan usunięcia zakończył się błędem z `prevent_destroy` w dzienniku.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Porównałem aktywny zasób ID ze stanem OpenTofu.
diagnostics.condition_0: |-
  Plik może istnieć bez zasobu w stanie zarządzającego notice.txt. Sprawdź ścieżkę zasobu i zastosowanie konfiguracji. [Przewodnik](guides#guide=terraform-6&section=protecting-the-managed-notice)
diagnostics.condition_1: |-
  Szczegółowy plan może wykazać zmiany, jeśli notice.txt odbiega od deklaracji lub poprawiona konfiguracja nie została zastosowana. [Przewodnik](guides#guide=terraform-6&section=protecting-the-managed-notice)
diagnostics.condition_2: |-
  Plan usunięcia może się powieść, gdy plik nie ma ochrony cyklu życia. Brak adresu w stanie może też uniemożliwić uruchomienie planu celowanego. [Przewodnik](guides#guide=terraform-6&section=protecting-the-managed-notice)
diagnostics.condition_3: |-
  Plan usunięcia może zawieść z powodu innego zasobu lub błędu konfiguracji. Odmowa musi wskazać prevent_destroy zasobu zarządzającego notice.txt. [Przewodnik](guides#guide=terraform-6&section=protecting-the-managed-notice)
diagnostics.condition_4: |-
  W pliku może pozostać stara treść po ręcznej edycji lub gdy nie zastosowano poprawionej deklaracji. [Przewodnik](guides#guide=terraform-6&section=protecting-the-managed-notice)
stages.0.objectives.0.text: Opublikowany komunikat jest śledzony przez dostarczoną konfigurację.
stages.0.objectives.1.text: OpenTofu nie zgłasza oczekujących zmian infrastruktury.
stages.0.objectives.2.text: Ochrona zasobu odrzuca planowanie usunięcia zarządzanego powiadomienia.
stages.0.objectives.3.text: Na workstation `~/quest/notice.txt` zawiera `north-ready`.
diagnostics.probe_0_0: |-
  Jeśli sonda kończy się przed wynikiem, sprawdź uruchamianie Pythona i dostęp do wymaganych danych. [Przewodnik](guides#guide=terraform-6&section=protecting-the-managed-notice)
diagnostics.probe_0_2: |-
  Jeśli sonda kończy się przed wynikiem, sprawdź uruchamianie Pythona i dostęp do wymaganych danych. [Przewodnik](guides#guide=terraform-6&section=protecting-the-managed-notice)
