title: Ochrona cyklu życia
brief: 'Dołączyłeś do operacji SignalRail. Chroń księgę tras przed przypadkowym zniszczeniem. Pracuj w
  ~/quest. Wszystkie zmiany przechowuj w tej komorze szkoleniowej.


  Wejścia w `~/quest`: `main.tf`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Wszystkie zmiany muszą pozostać w tej zatoce.


  Początkowe kryteria sukcesu: Planowanie zniszczenia jest blokowane przez prevent_destroy.'
stages.0.brief: 'Zachowaj zarządzany ledger i spraw, aby destroy plan odmówił jego usunięcia.


  Kryteria sukcesu: Planowanie zniszczenia zostało zablokowane przez prevent_destroy.'
stages.0.objectives.0.text: Planowanie zniszczenia jest blokowane przez prevent_destroy.
hints.0.text: Porównaj normalny plan z destroy plan.
hints.1.text: Napraw ręczne przesunięcie pliku i dodaj plik lifecycle guard.
hints.2.text: Użyj prevent_destroy, zastosuj poprawną treść i sprawdź, czy planowanie zniszczenia odmawia
  usunięcia.
debrief: ledger nie miał osłony przed zniszczeniem. Dodałeś Prevent_destroy i zweryfikowałeś, że zniszczenie
  plan odmówiło usunięcia, podczas gdy normalny plan pozostał pusty.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Porównałem aktywny zasób ID ze stanem OpenTofu.
