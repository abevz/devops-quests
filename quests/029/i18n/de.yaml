title: Lebenszyklusschutz
brief: 'Die veröffentlichte Nachricht erfüllt den erforderlichen Ergebnisvertrag nicht.


  Arbeite auf der Workstation in `~/quest` mit `main.tf`.


  **Anforderungen:**

  - Die veröffentlichte Meldung wird durch die mitgelieferte Konfiguration nachverfolgt.

  - Ein detaillierter Plan meldet keine ausstehenden Infrastrukturänderungen und endet mit Code `0`.

  - Die Planung der Entfernung der verwalteten Nachricht wird durch den Ressourcenschutz abgelehnt.

  - Auf der Workstation: `~/quest/notice.txt` enthält `north-ready`.


  Die Prüfung beobachtet aktuelle Ergebnisse; sie beweist keine historische Schutzwirkung.

  '
stages.0.brief: Die Nachricht muss verfügbar und vor geplanter Entfernung geschützt sein.
hints.0.text: Normale Konvergenz und Schutz vor Entfernung sind getrennte Eigenschaften.
hints.1.text: 'Prüfen Sie die mitgelieferten Eingaben und den aktuellen verwalteten Zustand:


  ```sh

  cat main.tf

  tofu show -no-color

  tofu plan -input=false -no-color

  ```'
hints.2.text: |-
  Reparieren Sie den manuellen Dateidrift und fügen Sie einen lifecycle guard hinzu.

  Verwende prevent_destroy und wende den richtigen Nachrichteninhalt an.

  Prüfen Sie das beobachtete Ergebnis:

  - `cat notice.txt; tofu show -no-color` — Zeigt `north-ready` und die verwaltete Ressource `notice.txt`.

  - `tofu plan -input=false -detailed-exitcode -no-color` — Endet mit `0` und meldet keine ausstehenden Infrastrukturänderungen.

  - `tofu plan -destroy -input=false -no-color` — Endet mit einem Fehlercode, weil der Ressourcenschutz die Entfernung verweigert.

  Die verwaltete Datei notice.txt enthält north-ready.
debrief: Der normale Plan enthält keine Änderungen, und der Zerstörungsplan schlug mit `prevent_destroy` in
  seinem Protokoll fehl.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe die Live-Ressource ID mit dem Status OpenTofu verglichen.
diagnostics.condition_0: |-
  Der OpenTofu-State muss die verwaltete Quelldatei notice.txt erfassen.

diagnostics.condition_1: Der OpenTofu-Plan mit detailed-exitcode muss mit Code 0 enden.
diagnostics.condition_2: Der OpenTofu-Destroy-Plan muss mit einem Code ungleich null enden.
diagnostics.condition_3: destroy-plan.log muss prevent_destroy enthalten.
diagnostics.condition_4: notice.txt muss north-ready entsprechen.
