title: Lebenszyklusschutz
brief: |
  Die veröffentlichte Nachricht erfüllt den erforderlichen Ergebnisvertrag nicht.

  Arbeite auf der Workstation in `~/quest` mit `main.tf`.

  **Anforderungen:**
  - OpenTofu-State:
    - Erforderliche Adressen: `local_file.notice`.
  - Dateien auf der Workstation:
    - `~/quest/notice.txt`: `north-ready`.
  - Infrastrukturkonvergenz:
    - Keine ausstehenden Infrastrukturänderungen; Exit-Code des detaillierten Plans `0`.
  - Entfernungsschutz:
    - Ein Plan zur Entfernung der verwalteten Nachricht wird durch den Ressourcenschutz abgelehnt.

  **Selbstprüfung vor Check & finish:**
  - `cat notice.txt; tofu show -no-color` — Zeigt `north-ready` und die verwaltete Ressource `local_file.notice`.
  - `tofu plan -input=false -detailed-exitcode -no-color` — Endet mit `0` und meldet keine ausstehenden Infrastrukturänderungen.
  - `tofu plan -destroy -input=false -no-color` — Endet mit einem Fehlercode, weil der Ressourcenschutz die Entfernung verweigert.

  Die Prüfung beobachtet aktuelle Ergebnisse; sie beweist keine historische Schutzwirkung.
stages.0.brief: Die Nachricht muss verfügbar und vor geplanter Entfernung geschützt sein.
hints.0.text: Normale Konvergenz und Schutz vor Entfernung sind getrennte Eigenschaften.
hints.1.text: Reparieren Sie den manuellen Dateidrift und fügen Sie einen lifecycle guard hinzu.
hints.2.text: Verwende prevent_destroy und wende den richtigen Nachrichteninhalt an.
debrief: Der normale Plan enthält keine Änderungen, und der Zerstörungsplan schlug mit `prevent_destroy` in seinem
  Protokoll fehl.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe die Live-Ressource ID mit dem Status OpenTofu verglichen.
diagnostics.condition_0: tofu state list muss local_file.notice enthalten.
diagnostics.condition_1: Der OpenTofu-Plan mit detailed-exitcode muss mit Code 0 enden.
diagnostics.condition_2: Der OpenTofu-Destroy-Plan muss mit einem Code ungleich null enden.
diagnostics.condition_3: destroy-plan.log muss prevent_destroy enthalten.
diagnostics.condition_4: notice.txt muss north-ready entsprechen.
stages.0.objectives.0.text: Der OpenTofu-State enthält `local_file.notice`.
stages.0.objectives.1.text: OpenTofu meldet keine ausstehenden Infrastrukturänderungen.
stages.0.objectives.2.text: Die Planung der Entfernung der verwalteten Nachricht wird durch den Ressourcenschutz
  abgelehnt.
stages.0.objectives.3.text: 'Auf der Workstation: `notice.txt` enthält `north-ready`.'
