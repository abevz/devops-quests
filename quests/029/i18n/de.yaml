title: Lebenszyklusschutz
brief: 'Arbeite in `~/quest` und untersuche `main.tf`, das `local_file.notice` und den vorgesehenen Dateiinhalt deklariert. Die vorhandene `notice.txt` weicht davon ab. Die verlinkte Anleitung erläutert Lifecycle-Regeln. `prevent_destroy` blockiert einen Zerstörungsplan, solange die Regel vorhanden ist. Nutze nur die Offline-Umgebung.


  Behebe die Abweichung und schütze die Ressource. Prüfe, dass `tofu state list` `local_file.notice` enthält, `notice.txt` `north-ready` enthält und `tofu plan -input=false -detailed-exitcode -no-color` mit Code 0 endet (keine Änderungen). Ein Zerstörungsplan muss fehlschlagen und sein `destroy-plan.log` muss `prevent_destroy` enthalten. Die Prüfung beobachtet diese Ergebnisse und belegt keine frühere Schutzgeschichte.'
stages.0.brief: Die Zustandsadresse ist vorhanden, `notice.txt` enthält `north-ready`, der normale Plan endet mit Code 0 und der Zerstörungsplan schlägt mit `prevent_destroy` fehl.
stages.0.objectives.0.text: Die Zustandsadresse ist vorhanden, `notice.txt` enthält `north-ready`, der normale Plan endet mit Code 0 und der Zerstörungsplan schlägt mit `prevent_destroy` fehl.
hints.0.text: Vergleichen Sie einen normalen plan mit einem destroy plan.
hints.1.text: Reparieren Sie den manuellen Dateidrift und fügen Sie einen lifecycle guard hinzu.
hints.2.text: Verwenden Sie prevent_destroy, wenden Sie den richtigen Inhalt an und überprüfen Sie, ob
  destroy die Entfernung der Ablehnungen plant.
debrief: Der normale Plan enthält keine Änderungen, und der Zerstörungsplan schlug mit `prevent_destroy` in seinem Protokoll fehl.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe die Live-Ressource ID mit dem Status OpenTofu verglichen.
