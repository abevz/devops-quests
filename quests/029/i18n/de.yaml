title: Lebenszyklusschutz
brief: 'Die veröffentlichte Nachricht erfüllt den erforderlichen Ergebnisvertrag nicht.


  Arbeite auf der Workstation in `~/quest` mit `main.tf`.


  **Anforderungen:**

  - Die veröffentlichte Meldung wird durch die mitgelieferte Konfiguration nachverfolgt.

  - Ein detaillierter Plan meldet keine ausstehenden Infrastrukturänderungen und endet mit Code `0`.

  - Die Planung der Entfernung der verwalteten Nachricht wird durch den Ressourcenschutz abgelehnt.

  - Auf der Workstation: `~/quest/notice.txt` enthält `north-ready`.


  Die Prüfung beobachtet aktuelle Ergebnisse; sie beweist keine historische Schutzwirkung.

  '
stages.0.brief: Die Nachricht muss verfügbar und vor geplanter Entfernung geschützt sein.
hints.0.text: Normale Konvergenz und Schutz vor Entfernung sind getrennte Eigenschaften.
hints.1.text: 'Prüfen Sie die mitgelieferten Eingaben und den aktuellen verwalteten Zustand:


  ```sh

  cat main.tf

  tofu show -no-color

  tofu plan -input=false -no-color

  ```'
hints.2.text: |-
  Reparieren Sie den manuellen Dateidrift und fügen Sie einen lifecycle guard hinzu.

  Verwende prevent_destroy und wende den richtigen Nachrichteninhalt an.

  Prüfen Sie das beobachtete Ergebnis:

  - `cat notice.txt; tofu show -no-color` — Zeigt `north-ready` und die verwaltete Ressource `notice.txt`.

  - `tofu plan -input=false -detailed-exitcode -no-color` — Endet mit `0` und meldet keine ausstehenden Infrastrukturänderungen.

  - `tofu plan -destroy -input=false -no-color` — Endet mit einem Fehlercode, weil der Ressourcenschutz die Entfernung verweigert.

  Die verwaltete Datei notice.txt enthält north-ready.
debrief: Der normale Plan enthält keine Änderungen, und der Zerstörungsplan schlug mit `prevent_destroy` in
  seinem Protokoll fehl.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe die Live-Ressource ID mit dem Status OpenTofu verglichen.
diagnostics.condition_0: |-
  Die Datei kann ohne State-Ressource existieren, die notice.txt verwaltet. Prüfen Sie Pfad und angewendete Konfiguration. [Leitfaden](guides#guide=terraform-6&section=protecting-the-managed-notice)
diagnostics.condition_1: |-
  Der detaillierte Plan kann Änderungen melden, wenn notice.txt von der Deklaration abweicht oder die korrigierte Konfiguration noch nicht angewendet wurde. [Leitfaden](guides#guide=terraform-6&section=protecting-the-managed-notice)
diagnostics.condition_2: |-
  Der Löschplan kann ohne Lebenszyklusschutz für den Hinweis erfolgreich sein. Eine fehlende State-Adresse kann außerdem den gezielten Plan verhindern. [Leitfaden](guides#guide=terraform-6&section=protecting-the-managed-notice)
diagnostics.condition_3: |-
  Der Löschplan kann an einer anderen Ressource oder einem Konfigurationsfehler scheitern. Die Ablehnung muss prevent_destroy für die Ressource nennen, die notice.txt verwaltet. [Leitfaden](guides#guide=terraform-6&section=protecting-the-managed-notice)
diagnostics.condition_4: |-
  Der Hinweis kann nach einer manuellen Änderung oder ohne Apply der korrigierten Deklaration alten Inhalt behalten. [Leitfaden](guides#guide=terraform-6&section=protecting-the-managed-notice)
stages.0.objectives.0.text: Die veröffentlichte Meldung wird durch die mitgelieferte Konfiguration nachverfolgt.
stages.0.objectives.1.text: OpenTofu meldet keine ausstehenden Infrastrukturänderungen.
stages.0.objectives.2.text: Die Planung der Entfernung der verwalteten Nachricht wird durch den Ressourcenschutz
  abgelehnt.
stages.0.objectives.3.text: 'Auf der Workstation: `~/quest/notice.txt` enthält `north-ready`.'
diagnostics.probe_0_0: |-
  Falls die Prüfung vor einem Ergebnis abbricht, prüfen Sie den Python-Start und den Zugriff auf die benötigten Daten. [Leitfaden](guides#guide=terraform-6&section=protecting-the-managed-notice)
diagnostics.probe_0_2: |-
