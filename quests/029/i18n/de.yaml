title: Lebenszyklusschutz
brief: 'Sie sind dem Betrieb SignalRail beigetreten. Schützen Sie das Hauptbuch route vor versehentlicher
  Zerstörung. Arbeiten Sie in ~/quest.. Bewahren Sie alle Änderungen in diesem Trainingsbereich auf.


  Eingaben in `~/quest`: `main.tf`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur die bereitgestellten Dateien,
  vorinstallierten Bilder und privaten Dienste. Alle Änderungen müssen innerhalb dieser Bucht bleiben.


  Erste Erfolgskriterien: Die Zerstörungsplanung ist durch prevent_destroy. blockiert'
stages.0.brief: 'Behalten Sie den verwalteten ledger und lassen Sie einen destroy plan dessen Entfernung
  verweigern.


  Erfolgskriterium: Zerstörungsplanung wird durch prevent_destroy. blockiert'
stages.0.objectives.0.text: Die Zerstörungsplanung wird durch prevent_destroy. blockiert
hints.0.text: Vergleichen Sie einen normalen plan mit einem destroy plan.
hints.1.text: Reparieren Sie den manuellen Dateidrift und fügen Sie einen lifecycle guard hinzu.
hints.2.text: Verwenden Sie prevent_destroy, wenden Sie den richtigen Inhalt an und überprüfen Sie, ob
  destroy die Entfernung der Ablehnungen plant.
debrief: Der ledger hatte keinen Zerstörungsschutz. Sie haben prevent_destroy hinzugefügt und bestätigt,
  dass ein destroy plan das Entfernen abgelehnt hat, während der normale plan leer blieb.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe die Live-Ressource ID mit dem Status OpenTofu verglichen.
