title: Lifecycle protection
brief: 'Work in `~/quest` and inspect `main.tf`, which declares `local_file.notice` and its intended file content. The existing
  `notice.txt` has drifted. The linked lifecycle guide introduces lifecycle rules. `prevent_destroy` blocks a destroy plan
  while the rule is present. Use only the offline bay.


  Repair the file drift and protect the resource. Verify that `tofu state list` contains `local_file.notice`, `notice.txt`
  contains `north-ready`, and `tofu plan -input=false -detailed-exitcode -no-color` exits 0 (no changes). A destroy plan must
  fail and its `destroy-plan.log` must contain `prevent_destroy`. The check observes these results rather than proving a history
  of protection.'
stages.0.brief: The state address exists, `notice.txt` contains `north-ready`, the normal plan exits 0, and the destroy plan
  fails with `prevent_destroy`.
stages.0.objectives.0.text: The state address exists, `notice.txt` contains `north-ready`, the normal plan exits 0, and the
  destroy plan fails with `prevent_destroy`.
hints.0.text: Compare a normal plan with a destroy plan.
hints.1.text: Repair the manual file drift and add a lifecycle guard.
hints.2.text: Use prevent_destroy, apply the correct content and verify destroy planning refuses removal.
debrief: The normal plan has no changes, and the destroy plan failed with `prevent_destroy` in its log.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I compared the live resource ID with the OpenTofu state.
diagnostics.condition_0: tofu state list must contain local_file.notice.
diagnostics.condition_1: The OpenTofu detailed plan must exit with code 0.
diagnostics.condition_2: The OpenTofu destroy plan must exit with a nonzero code.
diagnostics.condition_3: destroy-plan.log must contain prevent_destroy.
diagnostics.condition_4: notice.txt must equal north-ready.
