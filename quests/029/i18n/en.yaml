title: Lifecycle protection
brief: 'The published notice does not meet the required result contract.


  Work on the workstation in `~/quest` with `main.tf`.


  **Requirements:**

  - The published notice is tracked by the supplied configuration.

  - A detailed plan reports no pending infrastructure changes and exits with code `0`.

  - Planning removal of the managed notice is refused by resource protection.

  - On the workstation, `~/quest/notice.txt` contains `north-ready`.


  The check observes current results; it does not prove a history of protection.

  '
stages.0.brief: The notice must be available and protected from planned removal.
hints.0.text: Normal convergence and protection from removal are separate properties.
hints.1.text: 'Inspect the supplied inputs and current managed state:


  ```sh

  cat main.tf

  tofu show -no-color

  tofu plan -input=false -no-color

  ```'
hints.2.text: |-
  Repair the manual file drift and add a lifecycle guard.

  Use prevent_destroy and apply the correct notice content.

  Verify the observed result:

  - `cat notice.txt; tofu show -no-color` — Shows `north-ready` and tracked resource `notice.txt`.

  - `tofu plan -input=false -detailed-exitcode -no-color` — Exits `0` and reports no pending infrastructure changes.

  - `tofu plan -destroy -input=false -no-color` — Exits nonzero because resource protection refuses removal.

  The managed notice.txt file contains north-ready.
debrief: The normal plan has no changes, and the destroy plan failed with `prevent_destroy` in its log.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I compared the live resource ID with the OpenTofu state.
diagnostics.condition_0: |-
  The file can exist on disk without a state resource that manages notice.txt. Check the resource path and whether the configuration was applied. [Guide](guides#guide=terraform-6&section=protecting-the-managed-notice)
diagnostics.condition_1: |-
  The detailed plan can report changes if notice.txt differs from its declaration or corrected configuration has not been applied. [Guide](guides#guide=terraform-6&section=protecting-the-managed-notice)
diagnostics.condition_2: |-
  The destroy plan can succeed when the managed notice lacks lifecycle protection. A missing state address can also prevent the targeted plan from running. [Guide](guides#guide=terraform-6&section=protecting-the-managed-notice)
diagnostics.condition_3: |-
  The destroy plan can fail for another resource or for a configuration error. The refusal must identify prevent_destroy on the resource managing notice.txt. [Guide](guides#guide=terraform-6&section=protecting-the-managed-notice)
diagnostics.condition_4: |-
  The notice can retain stale content after a manual edit or when the corrected declaration was not applied. [Guide](guides#guide=terraform-6&section=protecting-the-managed-notice)
stages.0.objectives.0.text: The published notice is tracked by the supplied configuration.
stages.0.objectives.1.text: OpenTofu reports no pending infrastructure changes.
stages.0.objectives.2.text: Planning removal of the managed notice is refused by resource protection.
stages.0.objectives.3.text: On the workstation, `~/quest/notice.txt` contains `north-ready`.
diagnostics.probe_0_0: |-
  If the check stops before reporting a condition, check whether Python can start and its required observations are readable. [Guide](guides#guide=terraform-6&section=protecting-the-managed-notice)
diagnostics.probe_0_2: |-
  If the check stops before reporting a condition, check whether Python can start and its required observations are readable. [Guide](guides#guide=terraform-6&section=protecting-the-managed-notice)
