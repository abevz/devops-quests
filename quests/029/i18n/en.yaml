title: Lifecycle protection
brief: |
  The published notice does not meet the required result contract.

  Work on the workstation in `~/quest` with `main.tf`.

  **Requirements:**
  - OpenTofu state:
    - Required addresses: `local_file.notice`.
  - Files on the workstation:
    - `~/quest/notice.txt`: `north-ready`.
  - Infrastructure convergence:
    - No pending infrastructure changes; detailed-plan exit code `0`.
  - Removal protection:
    - A plan that would remove the managed notice is refused by resource protection.

  **Verify yourself before Check & finish:**
  - `cat notice.txt; tofu show -no-color` — Shows `north-ready` and tracked resource `local_file.notice`.
  - `tofu plan -input=false -detailed-exitcode -no-color` — Exits `0` and reports no pending infrastructure changes.
  - `tofu plan -destroy -input=false -no-color` — Exits nonzero because resource protection refuses removal.

  The check observes current results; it does not prove a history of protection.
stages.0.brief: The notice must be available and protected from planned removal.
hints.0.text: Normal convergence and protection from removal are separate properties.
hints.1.text: Repair the manual file drift and add a lifecycle guard.
hints.2.text: Use prevent_destroy and apply the correct notice content.
debrief: The normal plan has no changes, and the destroy plan failed with `prevent_destroy` in its log.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I compared the live resource ID with the OpenTofu state.
diagnostics.condition_0: tofu state list must contain local_file.notice.
diagnostics.condition_1: The OpenTofu detailed plan must exit with code 0.
diagnostics.condition_2: The OpenTofu destroy plan must exit with a nonzero code.
diagnostics.condition_3: destroy-plan.log must contain prevent_destroy.
diagnostics.condition_4: notice.txt must equal north-ready.
stages.0.objectives.0.text: OpenTofu state includes `local_file.notice`.
stages.0.objectives.1.text: OpenTofu reports no pending infrastructure changes.
stages.0.objectives.2.text: Planning removal of the managed notice is refused by resource protection.
stages.0.objectives.3.text: On the workstation, `notice.txt` contains `north-ready`.
