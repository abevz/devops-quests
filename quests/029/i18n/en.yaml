title: Lifecycle protection
brief: 'You joined SignalRail operations. Protect the route ledger from accidental destruction. Work in
  ~/quest. Keep all changes inside this training bay.


  Inputs in `~/quest`: `main.tf`.


  The bay has no Internet or external DNS. Use only its supplied files, preloaded images and private services.
  All changes must stay inside this bay.


  Initial success criteria: Destroy planning is blocked by prevent_destroy.'
stages.0.brief: 'Keep the managed ledger and make a destroy plan refuse its removal.


  Success criteria: Destroy planning is blocked by prevent_destroy.'
stages.0.objectives.0.text: Destroy planning is blocked by prevent_destroy.
hints.0.text: Compare a normal plan with a destroy plan.
hints.1.text: Repair the manual file drift and add a lifecycle guard.
hints.2.text: Use prevent_destroy, apply the correct content and verify destroy planning refuses removal.
debrief: The ledger had no destruction guard. You added prevent_destroy and verified a destroy plan refused
  removal while the normal plan stayed empty.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I compared the live resource ID with the OpenTofu state.
