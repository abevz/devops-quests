title: Registry digest
brief: 'The required release identity is not established by the `board` consumer.


  Work on the workstation in `~/quest` with `platform.env`, `release-catalog.txt`, `board.yaml`, `registry-pull.yaml`.


  **Requirements:**

  - Deployment `board` and a ready running container use the approved immutable release from the supplied catalog.

  - Deployment `board` retains pull policy `Always` and uses only the supplied registry-authentication Secret.

  - Deployment `board` completes its rollout in the bay namespace.

  - Inside a Pod of Deployment `board`, `http://127.0.0.1:8080` returns `north-49`.

  '
debrief: The functional response could not distinguish the two artifacts; the immutable image identity could.
stages.0.brief: The intended immutable release must be available to consumers.
hints.0.text: A tag and a running image identity answer different questions.
hints.1.text: 'The mutable parcel:stable tag identifies an alternative configuration digest even though HTTP
  text is identical. The intended immutable reference is in release-catalog.txt and PRIVATE_IMAGE.


  Inspect the supplied inputs and observed state:


  ```sh

  cat release-catalog.txt board.yaml registry-pull.yaml

  kubectl describe deployment board

  ```'
hints.2.text: 'Use the complete registry/repository@sha256 reference, not a retagged stable name.


  Verify the observed result:


  - `source platform.env; printf "%s\n" "$PRIVATE_IMAGE"; kubectl get deployment board -o custom-columns=NAME:.metadata.name,REPLICAS:.spec.replicas,IMAGE:.spec.template.spec.containers[0].image,PULL:.spec.template.spec.containers[0].imagePullPolicy,SECRETS:.spec.template.spec.imagePullSecrets[*].name`
  — The supplied immutable image reference matches the Deployment image; pull policy is `Always` with only
  `registry-pull`.

  - `kubectl get pods -l app=board -o json | jq ''.items[] | select(.metadata.deletionTimestamp==null and .status.phase=="Running")
  | .status.containerStatuses[]? | {ready,imageID}''` — A ready container reports the intended digest in `imageID`.

  - `kubectl rollout status deployment/board --timeout=10s; kubectl exec --pod-running-timeout=5s deployment/board
  -- wget -qO- -T 3 http://127.0.0.1:8080` — Rollout completes; HTTP returns `north-49`.'
phrases.0: I compared the intended manifest digest with the running container identity.
phrases.1: I did not treat an unchanged HTTP response as proof of the correct artifact.
phrases.2: I retained authenticated pulling while replacing the mutable tag with a digest.
questions.0.points.0: Different builds can expose identical responses.
questions.0.points.1: Mutable tags can move independently of a deployment review.
questions.0.points.2: Compare intended digest with the running container identity.
questions.0.prompt: Why can a healthy endpoint still serve the wrong image release?
questions.1.points.0: The manifest references configuration and layers.
questions.1.points.1: A platform index may reference several manifests.
questions.1.points.2: Use the identity reported by the actual registry/runtime and verify the relationship.
questions.1.prompt: What is the difference between a manifest digest and an image configuration digest?
stages.0.objectives.0.text: Deployment `board` and a ready running container use the approved immutable release
  from the supplied catalog.
stages.0.objectives.1.text: Deployment `board` retains pull policy `Always` and uses only the supplied registry-authentication
  Secret.
stages.0.objectives.2.text: Deployment `board` completes its rollout in the bay namespace.
stages.0.objectives.3.text: Inside a Pod of Deployment `board`, `http://127.0.0.1:8080` returns `north-49`.
