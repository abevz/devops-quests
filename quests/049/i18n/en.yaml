title: Registry digest
brief: 'The mutable parcel:stable tag now identifies an alternative private image
  with a different configuration digest, even though its board response looks identical.
  release-catalog.txt and PRIVATE_IMAGE identify the intended immutable release. Pin
  board to that exact digest, keep Always and registry-pull, and verify the running
  image identity rather than trusting the HTTP text alone.


  Quest files in `~/quest` (some appear in later stages): `platform.env`, `release-catalog.txt`,
  `board.json`, `registry-pull.json`, `variant-context/Dockerfile`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images
  and private services. Change only this bay.


  Initial success criteria: The Deployment and ready container use PRIVATE_IMAGE by
  digest, retain private pulling and serve north-49.'
debrief: The functional response could not distinguish the two artifacts; the immutable
  image identity could.
stages.0.brief: 'Success criteria: The Deployment and ready container use PRIVATE_IMAGE
  by digest, retain private pulling and serve north-49.'
stages.0.objectives.0.text: The Deployment and ready container use PRIVATE_IMAGE by
  digest, retain private pulling and serve north-49.
hints.0.text: A tag and a running image identity answer different questions.
hints.1.text: Compare the release catalog with containerStatuses.imageID.
hints.2.text: Use the complete registry/repository@sha256 reference, not a retagged
  stable name.
phrases.0: I compared the intended manifest digest with the running container identity.
phrases.1: I did not treat an unchanged HTTP response as proof of the correct artifact.
phrases.2: I retained authenticated pulling while replacing the mutable tag with a
  digest.
questions.0.points.0: Different builds can expose identical responses.
questions.0.points.1: Mutable tags can move independently of a deployment review.
questions.0.points.2: Compare intended digest with the running container identity.
questions.0.prompt: Why can a healthy endpoint still serve the wrong image release?
questions.1.points.0: The manifest references configuration and layers.
questions.1.points.1: A platform index may reference several manifests.
questions.1.points.2: Use the identity reported by the actual registry/runtime and
  verify the relationship.
questions.1.prompt: What is the difference between a manifest digest and an image
  configuration digest?
