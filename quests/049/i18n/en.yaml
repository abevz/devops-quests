title: Registry digest
brief: 'The required release identity is not established by the `board` consumer.


  Work on the workstation in `~/quest` with `platform.env`, `release-catalog.txt`, `board.yaml`, `registry-pull.yaml`.


  **Requirements:**

  - Deployment `board` and a ready running container use the approved immutable release from the supplied catalog.

  - Deployment `board` retains pull policy `Always` and uses only the supplied registry-authentication Secret.

  - Deployment `board` completes its rollout in the bay namespace.

  - Inside a Pod of Deployment `board`, `http://127.0.0.1:8080` returns `north-49`.

  '
debrief: The functional response could not distinguish the two artifacts; the immutable image identity could.
stages.0.brief: The intended immutable release must be available to consumers.
hints.0.text: A tag and a running image identity answer different questions.
hints.1.text: |-
  The mutable parcel:stable tag identifies an alternative configuration digest even though HTTP text is identical. The intended immutable reference is in release-catalog.txt and PRIVATE_IMAGE.

  Inspect the supplied inputs and observed state:

  Use the complete registry/repository@sha256 reference, not a retagged stable name.

  ```sh
  cat release-catalog.txt board.yaml
  kubectl get secret registry-pull -o custom-columns=NAME:.metadata.name,TYPE:.type
  kubectl describe deployment board
  ```
hints.2.text: |-
  Verify the observed result:

  The Deployment template must use the supplied immutable image reference and set `imagePullPolicy` to `Always`. Check that `board` owns at least one active Pod. Every active Pod must use `Always` and list only `registry-pull`. Find at least one Pod in phase `Running` whose `worker` uses the supplied image reference, is running and ready, and reports the intended digest in `imageID`.

  ```sh
  source platform.env && printf '%s\n' "$PRIVATE_IMAGE"
  kubectl get deployments,replicasets,pods -o json | jq '
    def owned($kind; $uids): any(.metadata.ownerReferences[]?;
      .controller == true and .kind == $kind and (.uid as $uid | $uids | index($uid) != null));
    .items as $items | ($items[] | select(.kind == "Deployment" and .metadata.name == "board")) as $board
    | [$items[] | select(.kind == "ReplicaSet" and owned("Deployment"; [$board.metadata.uid])) | .metadata.uid] as $rs
    | {template: [$board.spec.template.spec.containers[] | select(.name == "worker") | {image, imagePullPolicy}],
       active: [$items[] | select(.kind == "Pod" and owned("ReplicaSet"; $rs) and .metadata.deletionTimestamp == null
         and .status.phase != "Failed" and .status.phase != "Succeeded")
         | {pod: .metadata.name, phase: .status.phase, pullSecrets: [.spec.imagePullSecrets[]?.name],
            worker: [.spec.containers[] | select(.name == "worker") | {image, imagePullPolicy}],
            status: [.status.containerStatuses[]? | select(.name == "worker") | {ready, imageID, running: (.state.running != null)}]}]}'
  ```

  - `kubectl rollout status deployment/board --timeout=10s; kubectl exec --pod-running-timeout=5s deployment/board -c worker -- wget -qO- -T 3 http://127.0.0.1:8080` — Rollout completes; HTTP returns `north-49`.
phrases.0: I compared the intended manifest digest with the running container identity.
phrases.1: I did not treat an unchanged HTTP response as proof of the correct artifact.
phrases.2: I retained authenticated pulling while replacing the mutable tag with a digest.
questions.0.points.0: Different builds can expose identical responses.
questions.0.points.1: Mutable tags can move independently of a deployment review.
questions.0.points.2: Compare intended digest with the running container identity.
questions.0.prompt: Why can a healthy endpoint still serve the wrong image release?
questions.1.points.0: The manifest references configuration and layers.
questions.1.points.1: A platform index may reference several manifests.
questions.1.points.2: Use the identity reported by the actual registry/runtime and verify the relationship.
questions.1.prompt: What is the difference between a manifest digest and an image configuration digest?
stages.0.objectives.0.text: Deployment `board` and a ready running container use the approved immutable release
  from the supplied catalog.
stages.0.objectives.1.text: Deployment `board` retains pull policy `Always` and uses only the supplied registry-authentication
  Secret.
stages.0.objectives.2.text: Deployment `board` completes its rollout in the bay namespace.
stages.0.objectives.3.text: Inside a Pod of Deployment `board`, `http://127.0.0.1:8080` returns `north-49`.
diagnostics.probe_0_0: The intended private image and a ready matching Pod could not be verified; parcel:stable may still select the alternate image, no current worker may be ready at the required digest, or environment/API observations may be unavailable. [Cause and check](guides#guide=gitops-delivery&section=private-digest-observation)
diagnostics.probe_0_1: Always and registry-pull alone could not be verified on active board Pods; old Pod templates, effective pull Secret references, missing current Pods or unreadable environment/API identities may explain it. [Cause and check](guides#guide=gitops-delivery&section=private-consumer-pull-contract)
diagnostics.board_rollout: Deployment board did not finish rollout within 3 seconds; a changed image may still be pulling, credentials or scheduling may block it, or the rollout observation may have failed. [Cause and check](guides#guide=gitops-delivery&section=private-digest-readiness)
diagnostics.board_http: The worker did not return north-49 at localhost:8080 or exec failed; the Pod may be unready or its HTTP command/content changed, even when the declared image looks correct. [Cause and check](guides#guide=gitops-delivery&section=private-digest-http)
