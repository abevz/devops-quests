title: resumen del registro
brief: 'La etiqueta mutable parcel:stable ahora identifica una imagen privada alternativa con una configuración
  diferente digest, aunque su respuesta board parece idéntica. release-catalog.txt y PRIVATE_IMAGE identifican
  la versión inmutable prevista. Fije board a ese digest exacto, mantenga Always y registry-pull, y verifique
  la imagen en ejecución identity en lugar de confiar solo en el texto HTTP.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `platform.env`, `release-catalog.txt`,
  `board.json`, `registry-pull.json`, `variant-context/Dockerfile`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: El Deployment y el contenedor listo utilizan PRIVATE_IMAGE por digest,
  conservan la extracción privada y sirven a north-49.'
debrief: La respuesta funcional no pudo distinguir los dos artefactos; la imagen inmutable identity podría.
stages.0.brief: 'Criterios de éxito: El Deployment y el contenedor listo usan PRIVATE_IMAGE por digest,
