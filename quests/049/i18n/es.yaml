title: resumen del registro
brief: 'El consumidor `board` no acredita la identidad de versión requerida.


  Trabaja en la estación de trabajo en `~/quest` con `platform.env`, `release-catalog.txt`, `board.yaml`, `registry-pull.yaml`.


  **Requisitos:**

  - El Deployment `board` y un contenedor listo y en ejecución usan la versión inmutable aprobada del catálogo
  suministrado.

  - El Deployment `board` conserva la política `Always` y usa solo el Secret suministrado de autenticación
  del registro.

  - El Deployment `board` completa su rollout en el namespace de la bahía.

  - Dentro de un Pod del Deployment `board`, `http://127.0.0.1:8080` devuelve `north-49`.

  '
debrief: La respuesta funcional no pudo distinguir los dos artefactos; la imagen inmutable identity podría.
stages.0.brief: La versión inmutable prevista debe estar disponible para los consumidores.
hints.0.text: Una etiqueta y la identidad de la imagen en ejecución responden a preguntas distintas.
hints.1.text: |-
  La etiqueta mutable parcel:stable identifica un digest de configuración alternativo aunque el texto HTTP es idéntico. La referencia inmutable prevista está en release-catalog.txt y PRIVATE_IMAGE.

  Inspecciona las entradas suministradas y el estado observado:

  Utilice la referencia registry/repository@sha256 completa, no un nombre stable reetiquetado.

  ```sh
  cat release-catalog.txt board.yaml
  kubectl get secret registry-pull -o custom-columns=NAME:.metadata.name,TYPE:.type
  kubectl describe deployment board
  ```
hints.2.text: |-
  Verifica el resultado observado:

  La plantilla del Deployment debe usar la referencia inmutable suministrada y el valor `Always` en `imagePullPolicy`. Comprueba que `board` sea propietario de al menos un Pod activo. Cada Pod activo debe usar `Always` y tener solo `registry-pull` en su lista. Busca al menos un Pod en fase `Running` cuyo contenedor `worker` use la referencia de imagen suministrada, esté en ejecución y listo, y muestre el digest esperado en `imageID`.

  ```sh
  source platform.env && printf '%s\n' "$PRIVATE_IMAGE"
  kubectl get deployments,replicasets,pods -o json | jq '
    def owned($kind; $uids): any(.metadata.ownerReferences[]?;
      .controller == true and .kind == $kind and (.uid as $uid | $uids | index($uid) != null));
    .items as $items | ($items[] | select(.kind == "Deployment" and .metadata.name == "board")) as $board
    | [$items[] | select(.kind == "ReplicaSet" and owned("Deployment"; [$board.metadata.uid])) | .metadata.uid] as $rs
    | {template: [$board.spec.template.spec.containers[] | select(.name == "worker") | {image, imagePullPolicy}],
       active: [$items[] | select(.kind == "Pod" and owned("ReplicaSet"; $rs) and .metadata.deletionTimestamp == null
         and .status.phase != "Failed" and .status.phase != "Succeeded")
         | {pod: .metadata.name, phase: .status.phase, pullSecrets: [.spec.imagePullSecrets[]?.name],
            worker: [.spec.containers[] | select(.name == "worker") | {image, imagePullPolicy}],
            status: [.status.containerStatuses[]? | select(.name == "worker") | {ready, imageID, running: (.state.running != null)}]}]}'
  ```

  - `kubectl rollout status deployment/board --timeout=10s; kubectl exec --pod-running-timeout=5s deployment/board -c worker -- wget -qO- -T 3 http://127.0.0.1:8080` — El rollout se completa; HTTP devuelve `north-49`.
phrases.0: Comparé el manifiesto previsto digest con el contenedor en ejecución identity.
phrases.1: No traté una respuesta HTTP sin cambios como prueba del artefacto correcto.
phrases.2: Mantuve la extracción autenticada mientras reemplazaba la etiqueta mutable con una digest.
questions.0.points.0: Diferentes compilaciones pueden exponer respuestas idénticas.
questions.0.points.1: Las etiquetas mutables pueden moverse independientemente de una revisión de implementación.
questions.0.points.2: Compare el digest previsto con el contenedor en funcionamiento identity.
questions.0.prompt: ¿Por qué un endpoint en buen estado aún puede presentar una publicación de imagen incorrecta?
questions.1.points.0: El manifiesto hace referencia a la configuración y las capas.
questions.1.points.1: Un índice de plataforma puede hacer referencia a varios manifests.
questions.1.points.2: Utilice el identity informado por el registry/runtime real y verifique la relación.
questions.1.prompt: ¿Cuál es la diferencia entre un manifiesto digest y una configuración de imagen digest?
stages.0.objectives.0.text: El Deployment `board` y un contenedor listo y en ejecución usan la versión inmutable
  aprobada del catálogo suministrado.
stages.0.objectives.1.text: El Deployment `board` conserva la política `Always` y usa solo el Secret suministrado
  de autenticación del registro.
stages.0.objectives.2.text: El Deployment `board` completa su rollout en el namespace de la bahía.
stages.0.objectives.3.text: Dentro de un Pod del Deployment `board`, `http://127.0.0.1:8080` devuelve `north-49`.
diagnostics.probe_0_0: No se verificó la imagen privada deseada y un Pod listo con el mismo digest; parcel:stable puede seguir eligiendo otra imagen, worker puede no estar listo con el digest requerido o el entorno o la API no están disponibles. [Causa y comprobación](guides#guide=gitops-delivery&section=private-digest-observation)
diagnostics.probe_0_1: No se verificó Always y solo registry-pull en Pods activos de board; puede deberse a plantillas anteriores, referencias efectivas a pull Secret, ausencia de Pods actuales o identidades de entorno o API ilegibles. [Causa y comprobación](guides#guide=gitops-delivery&section=private-consumer-pull-contract)
diagnostics.board_rollout: Deployment board no completó el despliegue en 3 segundos; la nueva imagen puede seguir descargándose, credenciales o planificación pueden bloquearla o falló la observación. [Causa y comprobación](guides#guide=gitops-delivery&section=private-digest-readiness)
diagnostics.board_http: worker no devolvió north-49 en localhost:8080 o falló exec; el Pod puede no estar listo o cambió el comando HTTP o contenido aunque la imagen declarada parezca correcta. [Causa y comprobación](guides#guide=gitops-delivery&section=private-digest-http)
