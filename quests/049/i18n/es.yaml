title: resumen del registro
brief: 'El consumidor `board` no acredita la identidad de versión requerida.


  Trabaja en la estación de trabajo en `~/quest` con `platform.env`, `release-catalog.txt`, `board.yaml`, `registry-pull.yaml`.


  **Requisitos:**

  - El Deployment `board` y un contenedor listo y en ejecución usan la versión inmutable aprobada del catálogo
  suministrado.

  - El Deployment `board` conserva la política `Always` y usa solo el Secret suministrado de autenticación
  del registro.

  - El Deployment `board` completa su rollout en el namespace de la bahía.

  - Dentro de un Pod del Deployment `board`, `http://127.0.0.1:8080` devuelve `north-49`.

  '
debrief: La respuesta funcional no pudo distinguir los dos artefactos; la imagen inmutable identity podría.
stages.0.brief: La versión inmutable prevista debe estar disponible para los consumidores.
hints.0.text: Una etiqueta y la identidad de la imagen en ejecución responden a preguntas distintas.
hints.1.text: 'La etiqueta mutable parcel:stable identifica un digest de configuración alternativo aunque el
  texto HTTP es idéntico. La referencia inmutable prevista está en release-catalog.txt y PRIVATE_IMAGE.


  Inspecciona las entradas suministradas y el estado observado:


  ```sh

  cat release-catalog.txt board.yaml registry-pull.yaml

  kubectl describe deployment board

  ```'
hints.2.text: |-
  Utilice la referencia registry/repository@sha256 completa, no un nombre stable reetiquetado.

  Verifica el resultado observado:

  - `source platform.env; printf "%s\n" "$PRIVATE_IMAGE"; kubectl get deployment board -o json | jq '{name:.metadata.name,replicas:.spec.replicas,worker:(.spec.template.spec.containers[]|select(.name=="worker")|{image,imagePullPolicy})}'; kubectl get pods -o json | jq '.items[] | select(.metadata.deletionTimestamp==null and any(.spec.containers[]?;.name=="worker")) | {pod:.metadata.name,pullSecrets:[.spec.imagePullSecrets[]?.name]}'` — La referencia inmutable suministrada coincide con la imagen del Deployment; la política de descarga es `Always` con solo `registry-pull`.
  - `kubectl get pods -l app=board -o json | jq '.items[] | select(.metadata.deletionTimestamp==null and .status.phase=="Running") | .status.containerStatuses[]? | select(.name=="worker") | {ready,imageID}'` — Un contenedor listo informa el digest previsto en `imageID`.
  - `kubectl rollout status deployment/board --timeout=10s; kubectl exec --pod-running-timeout=5s deployment/board -c worker -- wget -qO- -T 3 http://127.0.0.1:8080` — El rollout se completa; HTTP devuelve `north-49`.

phrases.0: Comparé el manifiesto previsto digest con el contenedor en ejecución identity.
phrases.1: No traté una respuesta HTTP sin cambios como prueba del artefacto correcto.
phrases.2: Mantuve la extracción autenticada mientras reemplazaba la etiqueta mutable con una digest.
questions.0.points.0: Diferentes compilaciones pueden exponer respuestas idénticas.
questions.0.points.1: Las etiquetas mutables pueden moverse independientemente de una revisión de implementación.
questions.0.points.2: Compare el digest previsto con el contenedor en funcionamiento identity.
questions.0.prompt: ¿Por qué un endpoint en buen estado aún puede presentar una publicación de imagen incorrecta?
questions.1.points.0: El manifiesto hace referencia a la configuración y las capas.
questions.1.points.1: Un índice de plataforma puede hacer referencia a varios manifests.
questions.1.points.2: Utilice el identity informado por el registry/runtime real y verifique la relación.
questions.1.prompt: ¿Cuál es la diferencia entre un manifiesto digest y una configuración de imagen digest?
stages.0.objectives.0.text: El Deployment `board` y un contenedor listo y en ejecución usan la versión inmutable
  aprobada del catálogo suministrado.
stages.0.objectives.1.text: El Deployment `board` conserva la política `Always` y usa solo el Secret suministrado
  de autenticación del registro.
stages.0.objectives.2.text: El Deployment `board` completa su rollout en el namespace de la bahía.
stages.0.objectives.3.text: Dentro de un Pod del Deployment `board`, `http://127.0.0.1:8080` devuelve `north-49`.
