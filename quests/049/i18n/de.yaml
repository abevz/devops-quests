title: Registry-Digest
brief: 'Das veränderliche Tag parcel:stable identifiziert jetzt ein alternatives privates Image mit einer
  anderen Konfiguration digest, obwohl seine board-Antwort identisch aussieht. release-catalog.txt und
  PRIVATE_IMAGE identifizieren die beabsichtigte unveränderliche Version. Hängen Sie board genau an digest
  an, behalten Sie Always und registry-pull bei und überprüfen Sie das laufende Bild identity, anstatt
  nur dem HTTP-Text zu vertrauen.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `platform.env`, `release-catalog.txt`,
  `board.json`, `registry-pull.json`, `variant-context/Dockerfile`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: Der Deployment und der fertige Container nutzen PRIVATE_IMAGE von digest, behalten
  privates Ziehen und bedienen north-49.'
debrief: Die funktionale Reaktion konnte die beiden Artefakte nicht unterscheiden; das unveränderliche
  Bild identity könnte.
stages.0.brief: 'Erfolgskriterien: Der Deployment und der fertige Container verwenden PRIVATE_IMAGE von
  digest, behalten privates Ziehen und bedienen north-49.'
stages.0.objectives.0.text: Der Deployment und der fertige Container verwenden PRIVATE_IMAGE von digest,
  behalten das private Ziehen bei und bedienen north-49.
hints.0.text: Ein Tag und ein Laufbild identity beantworten verschiedene Fragen.
hints.1.text: Vergleichen Sie den Release-Katalog mit containerStatuses.imageID.
hints.2.text: Verwenden Sie die vollständige registry/repository@sha256-Referenz, keinen neu getaggten
  stable-Namen.
phrases.0: Ich habe das vorgesehene Manifest digest mit dem laufenden Container identity verglichen.
phrases.1: Ich habe eine unveränderte HTTP-Antwort nicht als Beweis für das korrekte Artefakt gewertet.
phrases.2: Ich habe das authentifizierte Ziehen beibehalten und gleichzeitig das veränderbare Tag durch
  ein digest ersetzt.
questions.0.points.0: Unterschiedliche Builds können identische Antworten bereitstellen.
questions.0.points.1: Veränderbare Tags können unabhängig von einer Bereitstellungsüberprüfung verschoben
  werden.
questions.0.points.2: Vergleichen Sie den vorgesehenen digest mit dem laufenden Container identity.
questions.0.prompt: Warum kann ein fehlerfreier endpoint immer noch die falsche Image-Veröffentlichung
  bereitstellen?
questions.1.points.0: Das Manifest verweist auf Konfiguration und Ebenen.
questions.1.points.1: Ein Plattformindex kann auf mehrere manifests verweisen.
questions.1.points.2: Verwenden Sie den vom tatsächlichen registry/runtime gemeldeten identity und überprüfen
  Sie die Beziehung.
questions.1.prompt: Was ist der Unterschied zwischen einem Manifest digest und einer Image-Konfiguration
  digest?
