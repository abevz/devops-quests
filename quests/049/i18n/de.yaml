diagnostics.probe_0_0: Das gewünschte private Image und ein bereiter Pod mit passendem Digest konnten nicht bestätigt werden; parcel:stable wählt möglicherweise noch das andere Image, kein aktueller worker ist mit dem geforderten Digest bereit oder Umgebung beziehungsweise API sind nicht verfügbar. [Ursache und Prüfung](guides#guide=gitops-delivery&section=private-digest-observation)
diagnostics.probe_0_1: Always und ausschließlich registry-pull konnten für aktive board-Pods nicht bestätigt werden; alte Vorlagen, effektive Pull-Secret-Referenzen, fehlende aktuelle Pods oder unlesbare Umgebungs-/API-Identitäten können die Ursache sein. [Ursache und Prüfung](guides#guide=gitops-delivery&section=private-consumer-pull-contract)
diagnostics.board_rollout: Deployment board hat den Rollout nicht innerhalb von 3 Sekunden abgeschlossen; das neue Image wird möglicherweise noch geladen, Zugangsdaten oder Scheduling blockieren es oder die Beobachtung schlug fehl. [Ursache und Prüfung](guides#guide=gitops-delivery&section=private-digest-readiness)
diagnostics.board_http: Der worker lieferte an localhost:8080 nicht north-49 oder exec schlug fehl; der Pod ist möglicherweise nicht bereit oder HTTP-Befehl beziehungsweise Inhalt wurden trotz scheinbar richtigem Image geändert. [Ursache und Prüfung](guides#guide=gitops-delivery&section=private-digest-http)
