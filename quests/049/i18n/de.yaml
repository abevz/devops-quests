title: Registry-Digest
brief: |
  Der Verbraucher `board` weist die erforderliche Versionsidentität nicht nach.

  Arbeite auf der Workstation in `~/quest` mit `platform.env`, `release-catalog.txt`, `board.yaml`, `registry-pull.yaml`.

  **Anforderungen:**
  - Deployment im Bay-Namespace:
    - Name: `board`.
    - Image: `PRIVATE_IMAGE` aus der Workstation-Datei `~/quest/platform.env`.
    - Pull-Policy: `Always`.
    - Image-Pull-Secret: `registry-pull`.
    - Keine weiteren Image-Pull-Secrets.
    - Rollout abgeschlossen.
  - Identität der laufenden Version:
    - Ein bereiter laufender Container in einem aktiven Pod hat den unveränderlichen Digest aus `PRIVATE_IMAGE` in der Workstation-Datei `~/quest/platform.env`.
  - HTTP in einem Pod von Deployment `board`:
    - Pfad: `http://127.0.0.1:8080`.
    - Antwort: `north-49`.

  **Selbstprüfung vor Check & finish:**
  - `source platform.env; printf "%s\n" "$PRIVATE_IMAGE"; kubectl get deployment board -o custom-columns=NAME:.metadata.name,REPLICAS:.spec.replicas,IMAGE:.spec.template.spec.containers[0].image,PULL:.spec.template.spec.containers[0].imagePullPolicy,SECRETS:.spec.template.spec.imagePullSecrets[*].name` — Die bereitgestellte unveränderliche Image-Referenz entspricht dem Deployment-Image; Pull-Policy ist `Always` mit nur `registry-pull`.
  - `kubectl get pods -l app=board -o json | jq '.items[] | select(.metadata.deletionTimestamp==null and .status.phase=="Running") | .status.containerStatuses[]? | {ready,imageID}'` — Ein bereiter Container meldet den vorgesehenen Digest in `imageID`.
  - `kubectl rollout status deployment/board --timeout=10s; kubectl exec --pod-running-timeout=5s deployment/board -- wget -qO- -T 3 http://127.0.0.1:8080` — Der Rollout wird abgeschlossen; HTTP liefert `north-49`.
debrief: Die funktionale Reaktion konnte die beiden Artefakte nicht unterscheiden; das unveränderliche Bild identity
  könnte.
stages.0.brief: Die vorgesehene unveränderliche Version muss Verbrauchern zur Verfügung stehen.
hints.0.text: Ein Tag und ein Laufbild identity beantworten verschiedene Fragen.
hints.1.text: Das veränderliche Tag parcel:stable bezeichnet einen anderen Konfigurations-Digest trotz identischem
  HTTP-Text. Die vorgesehene unveränderliche Referenz steht in release-catalog.txt und PRIVATE_IMAGE.
hints.2.text: Verwenden Sie die vollständige registry/repository@sha256-Referenz, keinen neu getaggten stable-Namen.
phrases.0: Ich habe das vorgesehene Manifest digest mit dem laufenden Container identity verglichen.
phrases.1: Ich habe eine unveränderte HTTP-Antwort nicht als Beweis für das korrekte Artefakt gewertet.
phrases.2: Ich habe das authentifizierte Ziehen beibehalten und gleichzeitig das veränderbare Tag durch ein digest
  ersetzt.
questions.0.points.0: Unterschiedliche Builds können identische Antworten bereitstellen.
questions.0.points.1: Veränderbare Tags können unabhängig von einer Bereitstellungsüberprüfung verschoben werden.
questions.0.points.2: Vergleichen Sie den vorgesehenen digest mit dem laufenden Container identity.
questions.0.prompt: Warum kann ein fehlerfreier endpoint immer noch die falsche Image-Veröffentlichung bereitstellen?
questions.1.points.0: Das Manifest verweist auf Konfiguration und Ebenen.
questions.1.points.1: Ein Plattformindex kann auf mehrere manifests verweisen.
questions.1.points.2: Verwenden Sie den vom tatsächlichen registry/runtime gemeldeten identity und überprüfen Sie
  die Beziehung.
questions.1.prompt: Was ist der Unterschied zwischen einem Manifest digest und einer Image-Konfiguration digest?
stages.0.objectives.0.text: Deployment `board` und ein bereiter laufender Container verwenden den vorgesehenen unveränderlichen
  Image-Digest aus der Workstation-Datei `platform.env` (`PRIVATE_IMAGE`).
stages.0.objectives.1.text: Deployment `board` verwendet Pull-Policy `Always` und nur Pull-Secret `registry-pull`.
stages.0.objectives.2.text: Deployment `board` schließt seinen Rollout im Bay-Namespace ab.
stages.0.objectives.3.text: In einem Pod von Deployment `board` liefert `http://127.0.0.1:8080` den Wert `north-49`.
