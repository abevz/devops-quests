title: Podsumowanie rejestru
brief: |
  Odbiorca `board` nie potwierdza wymaganej tożsamości wydania.

  Pracuj na workstation w `~/quest` z plikami `platform.env`, `release-catalog.txt`, `board.yaml`, `registry-pull.yaml`.

  **Wymagania:**
  - Deployment w przestrzeni nazw zatoki:
    - Nazwa: `board`.
    - Obraz: `PRIVATE_IMAGE` z `~/quest/platform.env` na workstation.
    - Polityka pobierania: `Always`.
    - Secret pobierania obrazu: `registry-pull`.
    - Brak innych Secretów pobierania obrazu.
    - Rollout zakończony.
  - Tożsamość działającego wydania:
    - Gotowy działający kontener w aktywnym Podzie ma niezmienny digest z `PRIVATE_IMAGE` w `~/quest/platform.env` na workstation.
  - HTTP wewnątrz Poda Deployment `board`:
    - Ścieżka: `http://127.0.0.1:8080`.
    - Odpowiedź: `north-49`.

  **Sprawdź przed Check & finish:**
  - `source platform.env; printf "%s\n" "$PRIVATE_IMAGE"; kubectl get deployment board -o custom-columns=NAME:.metadata.name,REPLICAS:.spec.replicas,IMAGE:.spec.template.spec.containers[0].image,PULL:.spec.template.spec.containers[0].imagePullPolicy,SECRETS:.spec.template.spec.imagePullSecrets[*].name` — Dostarczona niezmienna referencja obrazu odpowiada obrazowi Deployment; polityka pobierania to `Always` z tylko `registry-pull`.
  - `kubectl get pods -l app=board -o json | jq '.items[] | select(.metadata.deletionTimestamp==null and .status.phase=="Running") | .status.containerStatuses[]? | {ready,imageID}'` — Gotowy kontener podaje wymagany digest w `imageID`.
  - `kubectl rollout status deployment/board --timeout=10s; kubectl exec --pod-running-timeout=5s deployment/board -- wget -qO- -T 3 http://127.0.0.1:8080` — Rollout się kończy; HTTP zwraca `north-49`.
debrief: Odpowiedź funkcjonalna nie pozwalała na rozróżnienie tych dwóch artefaktów; niezmienny obraz identity mógłby.
stages.0.brief: Wymagane niezmienne wydanie musi być dostępne dla odbiorców.
hints.0.text: Znacznik i działający obraz identity odpowiadają na różne pytania.
hints.1.text: Zmienny tag parcel:stable wskazuje alternatywny digest konfiguracji mimo identycznej treści HTTP.
  Wymagana niezmienna referencja jest w release-catalog.txt i PRIVATE_IMAGE.
hints.2.text: Użyj pełnego odniesienia do registry/repository@sha256, a nie zmienionej nazwy stable.
phrases.0: Porównałem zamierzony manifest digest z działającym kontenerem identity.
phrases.1: Niezmiennej odpowiedzi HTTP nie traktowałem jako dowodu na istnienie prawidłowego artefaktu.
phrases.2: Zachowałem uwierzytelnione ciągnięcie podczas wymiany znacznika zmiennego na digest.
questions.0.points.0: Różne kompilacje mogą ujawniać identyczne odpowiedzi.
questions.0.points.1: Zmienne znaczniki można przenosić niezależnie od przeglądu wdrożenia.
questions.0.points.2: Porównaj zamierzony digest z działającym kontenerem identity.
questions.0.prompt: Dlaczego zdrowy endpoint może nadal wyświetlać niewłaściwe wydanie obrazu?
questions.1.points.0: Manifest odwołuje się do konfiguracji i warstw.
questions.1.points.1: Indeks platformy może odwoływać się do kilku manifestów.
questions.1.points.2: Użyj identity zgłoszonego przez rzeczywiste registry/runtime i sprawdź związek.
questions.1.prompt: Jaka jest różnica pomiędzy manifestem digest a konfiguracją obrazu digest?
stages.0.objectives.0.text: Deployment `board` i gotowy działający kontener używają wymaganego niezmiennego digestu
  obrazu z `platform.env` na workstation (`PRIVATE_IMAGE`).
stages.0.objectives.1.text: Deployment `board` używa polityki pobierania `Always` i tylko Secretu pobierania `registry-pull`.
stages.0.objectives.2.text: Deployment `board` kończy rollout w przestrzeni nazw zatoki.
stages.0.objectives.3.text: Wewnątrz Poda Deployment `board` adres `http://127.0.0.1:8080` zwraca `north-49`.
