title: Podsumowanie rejestru
brief: 'Odbiorca `board` nie potwierdza wymaganej tożsamości wydania.


  Pracuj na stacji roboczej w `~/quest` z `platform.env`, `release-catalog.txt`, `board.yaml`, `registry-pull.yaml`.


  **Wymagania:**

  - Deployment `board` i gotowy, działający kontener używają zatwierdzonego niezmiennego wydania z dostarczonego
  katalogu.

  - Deployment `board` zachowuje politykę `Always` i używa wyłącznie dostarczonego Secret do uwierzytelniania
  w rejestrze.

  - Deployment `board` kończy rollout w przestrzeni nazw zatoki.

  - Wewnątrz Poda Deployment `board` adres `http://127.0.0.1:8080` zwraca `north-49`.

  '
debrief: Odpowiedź funkcjonalna nie pozwalała na rozróżnienie tych dwóch artefaktów; niezmienny obraz identity
  mógłby.
stages.0.brief: Wymagane niezmienne wydanie musi być dostępne dla odbiorców.
hints.0.text: Tag i tożsamość uruchomionego obrazu odpowiadają na różne pytania.
hints.1.text: 'Zmienny tag parcel:stable wskazuje alternatywny digest konfiguracji mimo identycznej treści
  HTTP. Wymagana niezmienna referencja jest w release-catalog.txt i PRIVATE_IMAGE.


  Sprawdź dostarczone dane wejściowe i obserwowany stan:


  ```sh

  cat release-catalog.txt board.yaml registry-pull.yaml

  kubectl describe deployment board

  ```'
hints.2.text: |-
  Użyj pełnego odniesienia do registry/repository@sha256, a nie zmienionej nazwy stable.

  Sprawdź obserwowany wynik:

  - `source platform.env; printf "%s\n" "$PRIVATE_IMAGE"; kubectl get deployment board -o json | jq '{name:.metadata.name,replicas:.spec.replicas,worker:(.spec.template.spec.containers[]|select(.name=="worker")|{image,imagePullPolicy})}'; kubectl get pods -o json | jq '.items[] | select(.metadata.deletionTimestamp==null and any(.spec.containers[]?;.name=="worker")) | {pod:.metadata.name,pullSecrets:[.spec.imagePullSecrets[]?.name]}'` — Dostarczona niezmienna referencja obrazu odpowiada obrazowi Deployment; polityka pobierania to `Always` z tylko `registry-pull`.
  - `kubectl get pods -l app=board -o json | jq '.items[] | select(.metadata.deletionTimestamp==null and .status.phase=="Running") | .status.containerStatuses[]? | select(.name=="worker") | {ready,imageID}'` — Gotowy kontener podaje wymagany digest w `imageID`.
  - `kubectl rollout status deployment/board --timeout=10s; kubectl exec --pod-running-timeout=5s deployment/board -c worker -- wget -qO- -T 3 http://127.0.0.1:8080` — Rollout się kończy; HTTP zwraca `north-49`.

phrases.0: Porównałem zamierzony manifest digest z działającym kontenerem identity.
phrases.1: Niezmiennej odpowiedzi HTTP nie traktowałem jako dowodu na istnienie prawidłowego artefaktu.
phrases.2: Zachowałem uwierzytelnione ciągnięcie podczas wymiany znacznika zmiennego na digest.
questions.0.points.0: Różne kompilacje mogą ujawniać identyczne odpowiedzi.
questions.0.points.1: Zmienne znaczniki można przenosić niezależnie od przeglądu wdrożenia.
questions.0.points.2: Porównaj zamierzony digest z działającym kontenerem identity.
questions.0.prompt: Dlaczego zdrowy endpoint może nadal wyświetlać niewłaściwe wydanie obrazu?
questions.1.points.0: Manifest odwołuje się do konfiguracji i warstw.
questions.1.points.1: Indeks platformy może odwoływać się do kilku manifestów.
questions.1.points.2: Użyj identity zgłoszonego przez rzeczywiste registry/runtime i sprawdź związek.
questions.1.prompt: Jaka jest różnica pomiędzy manifestem digest a konfiguracją obrazu digest?
