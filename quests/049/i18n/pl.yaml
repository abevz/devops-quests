diagnostics.probe_0_0: Nie potwierdzono docelowego prywatnego obrazu i gotowego Poda z tym samym digest; parcel:stable może nadal wybierać inny obraz, bieżący worker nie jest gotowy z wymaganym digest albo środowisko lub API są niedostępne. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=private-digest-observation)
diagnostics.probe_0_1: Nie potwierdzono Always i wyłącznie registry-pull w aktywnych Podach board; przyczyną mogą być stare szablony, efektywne referencje pull Secret, brak bieżących Podów lub nieczytelne dane środowiska albo API. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=private-consumer-pull-contract)
diagnostics.board_rollout: Deployment board nie zakończył rollout w 3 sekundy; nowy obraz może jeszcze być pobierany, poświadczenia lub planowanie blokują start albo obserwacja zawiodła. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=private-digest-readiness)
diagnostics.board_http: Worker nie zwrócił north-49 na localhost:8080 lub exec zawiódł; Pod może nie być gotowy lub zmieniło się polecenie HTTP albo treść mimo poprawnie zadeklarowanego obrazu. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=private-digest-http)
