title: Podsumowanie rejestru
brief: 'Zmienny znacznik parcel:stable identyfikuje teraz alternatywny obraz prywatny o innej konfiguracji
  digest, mimo że jego odpowiedź board wygląda identycznie. release-catalog.txt i PRIVATE_IMAGE identyfikują
  zamierzoną wersję niezmienną. Przypnij board do dokładnie tego digest, zachowaj Always i registry-pull
  i zweryfikuj działający obraz identity, zamiast ufać samemu tekstowi HTTP.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `platform.env`, `release-catalog.txt`,
  `board.json`, `registry-pull.json`, `variant-context/Dockerfile`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: Deployment i gotowy kontener wykorzystują PRIVATE_IMAGE firmy digest, zachowują
  prywatne ciągnięcie i obsługują north-49.'
debrief: Odpowiedź funkcjonalna nie pozwalała na rozróżnienie tych dwóch artefaktów; niezmienny obraz
  identity mógłby.
stages.0.brief: 'Kryteria sukcesu: Deployment i gotowy kontener wykorzystują PRIVATE_IMAGE firmy digest,
  zachowują prywatne ciągnięcie i obsługują north-49.'
stages.0.objectives.0.text: Deployment i gotowy kontener wykorzystują PRIVATE_IMAGE firmy digest, zachowują
  prywatne ciągnięcie i służą north-49.
hints.0.text: Znacznik i działający obraz identity odpowiadają na różne pytania.
hints.1.text: Porównaj katalog wydań z containerStatuses.imageID.
hints.2.text: Użyj pełnego odniesienia do registry/repository@sha256, a nie zmienionej nazwy stable.
phrases.0: Porównałem zamierzony manifest digest z działającym kontenerem identity.
phrases.1: Niezmiennej odpowiedzi HTTP nie traktowałem jako dowodu na istnienie prawidłowego artefaktu.
phrases.2: Zachowałem uwierzytelnione ciągnięcie podczas wymiany znacznika zmiennego na digest.
questions.0.points.0: Różne kompilacje mogą ujawniać identyczne odpowiedzi.
questions.0.points.1: Zmienne znaczniki można przenosić niezależnie od przeglądu wdrożenia.
questions.0.points.2: Porównaj zamierzony digest z działającym kontenerem identity.
questions.0.prompt: Dlaczego zdrowy endpoint może nadal wyświetlać niewłaściwe wydanie obrazu?
questions.1.points.0: Manifest odwołuje się do konfiguracji i warstw.
questions.1.points.1: Indeks platformy może odwoływać się do kilku manifestów.
questions.1.points.2: Użyj identity zgłoszonego przez rzeczywiste registry/runtime i sprawdź związek.
questions.1.prompt: Jaka jest różnica pomiędzy manifestem digest a konfiguracją obrazu digest?
