diagnostics.probe_0_0: 'Не подтверждены нужный приватный образ и готовый Pod с тем же digest: parcel:stable мог остаться на другом образе, текущий worker ещё не готов с нужным digest либо окружение или API недоступны. [Причина и проверка](guides#guide=gitops-delivery&section=private-digest-observation)'
diagnostics.probe_0_1: 'Не подтверждены Always и единственный registry-pull у активных Pod board: причиной могут быть старые шаблоны Pod, фактические ссылки pull Secret, отсутствие текущих Pod либо недоступные данные окружения или API. [Причина и проверка](guides#guide=gitops-delivery&section=private-consumer-pull-contract)'
diagnostics.board_rollout: 'Deployment board не завершил rollout за 3 секунды: новый образ может ещё скачиваться, credentials или планирование блокируют запуск либо наблюдение завершилось ошибкой. [Причина и проверка](guides#guide=gitops-delivery&section=private-digest-readiness)'
diagnostics.board_http: 'worker не вернул north-49 на localhost:8080 либо exec завершился ошибкой: Pod может быть неготов или HTTP-команда и содержимое изменены даже при верном объявленном образе. [Причина и проверка](guides#guide=gitops-delivery&section=private-digest-http)'
