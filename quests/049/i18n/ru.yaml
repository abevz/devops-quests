title: Digest реестра
brief: 'Потребитель `board` не подтверждает требуемую идентичность выпуска.


  Работайте на рабочей станции в `~/quest` с `platform.env`, `release-catalog.txt`, `board.yaml`, `registry-pull.yaml`.


  **Требования:**

  - Deployment `board` и готовый работающий контейнер используют утверждённый неизменяемый релиз из поставленного
  каталога.

  - Deployment `board` сохраняет политику загрузки `Always` и использует только поставленный Secret аутентификации
  реестра.

  - Deployment `board` завершает rollout в namespace песочницы.

  - Внутри Pod Deployment `board` адрес `http://127.0.0.1:8080` возвращает `north-49`.

  '
debrief: Функциональный ответ не различал два артефакта; неизменяемая identity образа различила их.
stages.0.brief: Требуемый неизменяемый выпуск должен быть доступен потребителям.
hints.0.text: Тег и идентичность работающего образа отвечают на разные вопросы.
hints.1.text: |-
  Изменяемый тег parcel:stable указывает на другой digest конфигурации, хотя HTTP-текст одинаков. Нужная неизменяемая ссылка находится в release-catalog.txt и PRIVATE_IMAGE.

  Изучите поставленные входные данные и наблюдаемое состояние:

  Используйте полную ссылку registry/repository@sha256, а не переименованный stable.

  ```sh
  cat release-catalog.txt board.yaml
  kubectl get secret registry-pull -o custom-columns=NAME:.metadata.name,TYPE:.type
  kubectl describe deployment board
  ```
hints.2.text: |-
  Проверьте наблюдаемый результат:

  Шаблон Deployment должен использовать выданную неизменяемую ссылку на образ и значение `Always` в поле `imagePullPolicy`. Проверьте, что `board` владеет хотя бы одним активным Pod. У всех таких Pod должна быть политика `Always` и только `registry-pull`. Найдите хотя бы один Pod в фазе `Running`, у которого `worker` использует выданную ссылку на образ, запущен, готов и показывает нужный дайджест в `imageID`.

  ```sh
  source platform.env && printf '%s\n' "$PRIVATE_IMAGE"
  kubectl get deployments,replicasets,pods -o json | jq '
    def owned($kind; $uids): any(.metadata.ownerReferences[]?;
      .controller == true and .kind == $kind and (.uid as $uid | $uids | index($uid) != null));
    .items as $items | ($items[] | select(.kind == "Deployment" and .metadata.name == "board")) as $board
    | [$items[] | select(.kind == "ReplicaSet" and owned("Deployment"; [$board.metadata.uid])) | .metadata.uid] as $rs
    | {template: [$board.spec.template.spec.containers[] | select(.name == "worker") | {image, imagePullPolicy}],
       active: [$items[] | select(.kind == "Pod" and owned("ReplicaSet"; $rs) and .metadata.deletionTimestamp == null
         and .status.phase != "Failed" and .status.phase != "Succeeded")
         | {pod: .metadata.name, phase: .status.phase, pullSecrets: [.spec.imagePullSecrets[]?.name],
            worker: [.spec.containers[] | select(.name == "worker") | {image, imagePullPolicy}],
            status: [.status.containerStatuses[]? | select(.name == "worker") | {ready, imageID, running: (.state.running != null)}]}]}'
  ```

  - `kubectl rollout status deployment/board --timeout=10s; kubectl exec --pod-running-timeout=5s deployment/board -c worker -- wget -qO- -T 3 http://127.0.0.1:8080` — Rollout завершается; HTTP возвращает `north-49`.
phrases.0: Я сравнил нужный digest манифеста с identity работающего контейнера.
phrases.1: Я не считал одинаковый HTTP-ответ доказательством нужного артефакта.
phrases.2: Я сохранил авторизованную загрузку и заменил изменяемый тег на digest.
questions.0.points.0: Разные сборки могут выдавать одинаковые ответы.
questions.0.points.1: Изменяемые теги могут сдвигаться независимо от ревью Deployment.
questions.0.points.2: Сравнить нужный digest с identity работающего контейнера.
questions.0.prompt: Почему исправный endpoint может обслуживаться не тем релизом образа?
questions.1.points.0: Манифест ссылается на конфигурацию и слои.
questions.1.points.1: Индекс платформ может ссылаться на несколько манифестов.
questions.1.points.2: Использовать identity фактических registry/runtime и проверить связь между ними.
questions.1.prompt: Чем отличается digest манифеста от digest конфигурации образа?
stages.0.objectives.0.text: Deployment `board` и готовый работающий контейнер используют утверждённый неизменяемый
  релиз из поставленного каталога.
stages.0.objectives.1.text: Deployment `board` сохраняет политику загрузки `Always` и использует только поставленный
