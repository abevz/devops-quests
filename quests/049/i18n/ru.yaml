title: Digest реестра
brief: 'Потребитель `board` не подтверждает требуемую идентичность выпуска.


  Работайте на рабочей станции в `~/quest` с `platform.env`, `release-catalog.txt`, `board.yaml`, `registry-pull.yaml`.


  **Требования:**

  - Deployment `board` и готовый работающий контейнер используют утверждённый неизменяемый релиз из поставленного
  каталога.

  - Deployment `board` сохраняет политику загрузки `Always` и использует только поставленный Secret аутентификации
  реестра.

  - Deployment `board` завершает rollout в namespace песочницы.

  - Внутри Pod Deployment `board` адрес `http://127.0.0.1:8080` возвращает `north-49`.

  '
debrief: Функциональный ответ не различал два артефакта; неизменяемая identity образа различила их.
stages.0.brief: Требуемый неизменяемый выпуск должен быть доступен потребителям.
hints.0.text: Тег и идентичность работающего образа отвечают на разные вопросы.
hints.1.text: 'Изменяемый тег parcel:stable указывает на другой digest конфигурации, хотя HTTP-текст одинаков.
  Нужная неизменяемая ссылка находится в release-catalog.txt и PRIVATE_IMAGE.


  Изучите поставленные входные данные и наблюдаемое состояние:


  ```sh

  cat release-catalog.txt board.yaml registry-pull.yaml

  kubectl describe deployment board

  ```'
hints.2.text: 'Используйте полную ссылку registry/repository@sha256, а не переименованный stable.


  Проверьте наблюдаемый результат:


  - `source platform.env; printf "%s\n" "$PRIVATE_IMAGE"; kubectl get deployment board -o custom-columns=NAME:.metadata.name,REPLICAS:.spec.replicas,IMAGE:.spec.template.spec.containers[0].image,PULL:.spec.template.spec.containers[0].imagePullPolicy,SECRETS:.spec.template.spec.imagePullSecrets[*].name`
  — Предоставленная неизменяемая ссылка образа совпадает с образом Deployment; политика загрузки — `Always`,
  указан только `registry-pull`.

  - `kubectl get pods -l app=board -o json | jq ''.items[] | select(.metadata.deletionTimestamp==null and .status.phase=="Running")
  | .status.containerStatuses[]? | {ready,imageID}''` — Готовый контейнер сообщает требуемый digest в `imageID`.

  - `kubectl rollout status deployment/board --timeout=10s; kubectl exec --pod-running-timeout=5s deployment/board
  -- wget -qO- -T 3 http://127.0.0.1:8080` — Rollout завершается; HTTP возвращает `north-49`.'
phrases.0: Я сравнил нужный digest манифеста с identity работающего контейнера.
phrases.1: Я не считал одинаковый HTTP-ответ доказательством нужного артефакта.
phrases.2: Я сохранил авторизованную загрузку и заменил изменяемый тег на digest.
questions.0.points.0: Разные сборки могут выдавать одинаковые ответы.
questions.0.points.1: Изменяемые теги могут сдвигаться независимо от ревью Deployment.
questions.0.points.2: Сравнить нужный digest с identity работающего контейнера.
questions.0.prompt: Почему исправный endpoint может обслуживаться не тем релизом образа?
questions.1.points.0: Манифест ссылается на конфигурацию и слои.
questions.1.points.1: Индекс платформ может ссылаться на несколько манифестов.
questions.1.points.2: Использовать identity фактических registry/runtime и проверить связь между ними.
questions.1.prompt: Чем отличается digest манифеста от digest конфигурации образа?
stages.0.objectives.0.text: Deployment `board` и готовый работающий контейнер используют утверждённый неизменяемый
  релиз из поставленного каталога.
