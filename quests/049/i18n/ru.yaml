title: Digest реестра
brief: 'Изменяемый тег parcel:stable теперь указывает альтернативный приватный образ
  с другим digest конфигурации, хотя ответ board выглядит одинаково. release-catalog.txt
  и PRIVATE_IMAGE указывают нужный неизменяемый релиз. Закрепите board за этим digest,
  сохраните Always и registry-pull, проверьте identity работающего образа, а не только
  HTTP-текст.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `platform.env`,
  `release-catalog.txt`, `board.json`, `registry-pull.json`, `variant-context/Dockerfile`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно
  загруженные образы и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Deployment и готовый контейнер используют PRIVATE_IMAGE по digest,
  сохраняют приватную загрузку и отвечают north-49.'
debrief: Функциональный ответ не различал два артефакта; неизменяемая identity образа
  различила их.
stages.0.brief: 'Результат проверки: Deployment и готовый контейнер используют PRIVATE_IMAGE
  по digest, сохраняют приватную загрузку и отвечают north-49.'
stages.0.objectives.0.text: Deployment и готовый контейнер используют PRIVATE_IMAGE
  по digest, сохраняют приватную загрузку и отвечают north-49.
hints.0.text: Тег и identity работающего образа отвечают на разные вопросы.
hints.1.text: Сравните каталог релизов с containerStatuses.imageID.
hints.2.text: Используйте полную ссылку registry/repository@sha256, а не переименованный
  stable.
phrases.0: Я сравнил нужный digest манифеста с identity работающего контейнера.
phrases.1: Я не считал одинаковый HTTP-ответ доказательством нужного артефакта.
phrases.2: Я сохранил авторизованную загрузку и заменил изменяемый тег на digest.
questions.0.points.0: Разные сборки могут выдавать одинаковые ответы.
questions.0.points.1: Изменяемые теги могут сдвигаться независимо от ревью Deployment.
questions.0.points.2: Сравнить нужный digest с identity работающего контейнера.
questions.0.prompt: Почему исправный endpoint может обслуживаться не тем релизом образа?
questions.1.points.0: Манифест ссылается на конфигурацию и слои.
questions.1.points.1: Индекс платформ может ссылаться на несколько манифестов.
questions.1.points.2: Использовать identity фактических registry/runtime и проверить
  связь между ними.
questions.1.prompt: Чем отличается digest манифеста от digest конфигурации образа?
