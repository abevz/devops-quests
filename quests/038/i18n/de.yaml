title: Role-Standardeinstellungen
brief: |-
  Die bereitgestellte Rollenausgabe passt nicht zu dieser Flotte.

  Arbeiten Sie auf der Workstation in `~/quest` mit `inventory.ini`, `ansible.cfg`, `rollout.yml`, `roles/station/defaults/main.yml`, `roles/station/tasks/main.yml`, `group_vars/fleet.yml`.

  **Anforderungen:**
  - Datei auf jedem verwalteten Host (`app1`, `app2`, `app3`):
    - Pfad: `/srv/site/role.txt`.
    - Inhalt: `north:shared`.
  - Wiederverwendbare Standardwerte auf der Workstation:
    - Pfad: `~/quest/roles/station/defaults/main.yml`.
    - `route`: `retired`.
    - `platform`: `shared`.

  **Selbstprüfung vor Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'cat /srv/site/role.txt'` — zeigt north:shared von jedem verwalteten Host.
  - `cat ~/quest/roles/station/defaults/main.yml` — zeigt die beibehaltenen Standardwerte route retired und platform shared auf der Workstation.
debrief: Inventory hat einen Bereitstellungswert ausgewählt und dabei den wiederverwendbaren Rollenvertrag beibehalten.
stages.0.brief: Flottenspezifische Ausgabe muss die wiederverwendbaren Standardwerte bewahren.
stages.0.objectives.0.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/role.txt` den
  Inhalt `north:shared`.
stages.0.objectives.1.text: Auf der Workstation behält roles/station/defaults/main.yml route retired und platform
  shared.
hints.0.text: Role-Standardeinstellungen haben eine niedrige Priorität.
hints.1.text: Verwenden Sie die Variablenschicht inventory für Bereitstellungsdaten. Nutzen Sie group_vars/fleet.yml
  statt roles/station/defaults/main.yml zu ändern.
hints.2.text: Überschreiben Sie route und erben Sie platform.
phrases.0: Ich habe die Variablenpriorität verwendet, ohne die gemeinsame Rolle defaults neu zu schreiben.
phrases.1: Ich habe dafür gesorgt, dass die gemeinsame Rolle zielübergreifend wiederverwendbar ist.
phrases.2: Ich habe den effektiven station-Wert auf jedem Host überprüft.
