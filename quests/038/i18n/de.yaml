title: Role-Standardeinstellungen
brief: 'Die wiederverwendbare station-Rolle defaults bis retired/shared.. Diese Flotte benötigt dann north/shared..
  Überschreiben Sie dann nur route in group_vars/fleet.yml, ohne defaults zu bearbeiten Führen Sie rollout.yml
  aus, um /srv/site/role.txt auf jedes Ziel zu schreiben.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `inventory.ini`, `ansible.cfg`, `rollout.yml`,
  `roles/station/defaults/main.yml`, `roles/station/tasks/main.yml`, `group_vars/fleet.yml`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: Alle Ziele haben north:shared; Rolle defaults bleiben unverändert.'
debrief: Inventory hat einen Bereitstellungswert ausgewählt und dabei den wiederverwendbaren Rollenvertrag
  beibehalten.
stages.0.brief: 'Erfolgskriterien: Alle Ziele haben north:shared; Rolle defaults bleiben unverändert.'
stages.0.objectives.0.text: Alle Ziele haben north:shared; Rolle defaults bleiben unverändert.
hints.0.text: Role-Standardeinstellungen haben eine niedrige Priorität.
hints.1.text: Verwenden Sie die Variablenschicht inventory für Bereitstellungsdaten.
hints.2.text: Überschreiben Sie route und erben Sie platform.
phrases.0: Ich habe die Variablenpriorität verwendet, ohne die gemeinsame Rolle defaults neu zu schreiben.
phrases.1: Ich habe dafür gesorgt, dass die gemeinsame Rolle zielübergreifend wiederverwendbar ist.
phrases.2: Ich habe den effektiven station-Wert auf jedem Host überprüft.
