title: Role-Standardeinstellungen
brief: 'Die bereitgestellte Rollenausgabe passt nicht zu dieser Flotte.


  Arbeiten Sie auf der Workstation in `~/quest` mit `inventory.ini`, `ansible.cfg`, `rollout.yml`, `roles/station/defaults/main.yml`,
  `roles/station/tasks/main.yml`, `group_vars/fleet.yml`.


  **Anforderungen:**

  - Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/role.txt` den Inhalt `north:shared`.

  - Die wiederverwendbaren Standardwerte in `~/quest/roles/station/defaults/main.yml` auf der Workstation behalten
  exakt die mitgelieferten Einstellungen.

  '
debrief: Inventory hat einen Bereitstellungswert ausgewählt und dabei den wiederverwendbaren Rollenvertrag
  beibehalten.
stages.0.brief: Flottenspezifische Ausgabe muss die wiederverwendbaren Standardwerte bewahren.
stages.0.objectives.0.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/role.txt`
  den Inhalt `north:shared`.
stages.0.objectives.1.text: Die wiederverwendbaren Standardwerte in `~/quest/roles/station/defaults/main.yml`
  auf der Workstation behalten exakt die mitgelieferten Einstellungen.
hints.0.text: Wiederverwendbare Standardwerte dienen als Rückfallwerte und können durch bereitstellungsspezifische
  Daten überschrieben werden.
hints.1.text: 'Prüfen Sie die mitgelieferten Eingaben und den Ausführungsumfang:


  ```sh

  cat roles/station/defaults/main.yml roles/station/tasks/main.yml group_vars/fleet.yml rollout.yml

  ```'
hints.2.text: 'Verwenden Sie die Variablenschicht inventory für Bereitstellungsdaten. Nutzen Sie group_vars/fleet.yml
  statt roles/station/defaults/main.yml zu ändern.


  Überschreiben Sie route und erben Sie platform.


  Prüfen Sie das beobachtete Ergebnis:


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''cat /srv/site/role.txt''` — zeigt north:shared
  von jedem verwalteten Host.


  - `cat ~/quest/roles/station/defaults/main.yml` — zeigt die beibehaltenen Standardwerte route retired und
  platform shared auf der Workstation.'
phrases.0: Ich habe die Variablenpriorität verwendet, ohne die gemeinsame Rolle defaults neu zu schreiben.
phrases.1: Ich habe dafür gesorgt, dass die gemeinsame Rolle zielübergreifend wiederverwendbar ist.
phrases.2: Ich habe den effektiven station-Wert auf jedem Host überprüft.
diagnostics.content_1: Auf app1 enthält /srv/site/role.txt den Inhalt north:shared.
diagnostics.content_2: Auf app2 enthält /srv/site/role.txt den Inhalt north:shared.
diagnostics.content_3: Auf app3 enthält /srv/site/role.txt den Inhalt north:shared.
diagnostics.probe_0_1: 'Mit den aktuellen Eingaben konnte dieses Ziel nicht geprüft werden: Die wiederverwendbaren
  Standardwerte in `~/quest/roles/station/defaults/main.yml` auf der Workstation behalten exakt die mitgelieferten
  Einstellungen.'
