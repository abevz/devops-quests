title: Role-Standardeinstellungen
brief: 'Die bereitgestellte Rollenausgabe passt nicht zu dieser Flotte.


  Arbeiten Sie auf der Workstation in `~/quest` mit `inventory.ini`, `ansible.cfg`, `rollout.yml`, `roles/station/defaults/main.yml`,
  `roles/station/tasks/main.yml`, `group_vars/fleet.yml`.


  **Anforderungen:**

  - Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/role.txt` den Inhalt `north:shared`.

  - Die wiederverwendbaren Standardwerte in `~/quest/roles/station/defaults/main.yml` auf der Workstation behalten
  exakt die mitgelieferten Einstellungen.

  '
debrief: Inventory hat einen Bereitstellungswert ausgewählt und dabei den wiederverwendbaren Rollenvertrag
  beibehalten.
stages.0.brief: Flottenspezifische Ausgabe muss die wiederverwendbaren Standardwerte bewahren.
stages.0.objectives.0.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/role.txt`
  den Inhalt `north:shared`.
stages.0.objectives.1.text: Die wiederverwendbaren Standardwerte in `~/quest/roles/station/defaults/main.yml`
  auf der Workstation behalten exakt die mitgelieferten Einstellungen.
hints.0.text: Wiederverwendbare Standardwerte dienen als Rückfallwerte und können durch bereitstellungsspezifische
  Daten überschrieben werden.
hints.1.text: |-
  Prüfen Sie die mitgelieferten Eingaben und den Ausführungsumfang:

  Verwenden Sie die Variablenschicht inventory für Bereitstellungsdaten. Nutzen Sie group_vars/fleet.yml statt roles/station/defaults/main.yml zu ändern.

  ```sh
  cat roles/station/defaults/main.yml roles/station/tasks/main.yml
  cat group_vars/fleet.yml
  cat rollout.yml
  ```
hints.2.text: |-
  Überschreiben Sie route und erben Sie platform.

  Prüfen Sie das beobachtete Ergebnis:

  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'cat /srv/site/role.txt'` — zeigt north:shared von jedem verwalteten Host.

  - `cat ~/quest/roles/station/defaults/main.yml` — zeigt die beibehaltenen Standardwerte route retired und platform shared auf der Workstation.
phrases.0: Ich habe die Variablenpriorität verwendet, ohne die gemeinsame Rolle defaults neu zu schreiben.
phrases.1: Ich habe dafür gesorgt, dass die gemeinsame Rolle zielübergreifend wiederverwendbar ist.
phrases.2: Ich habe den effektiven station-Wert auf jedem Host überprüft.
diagnostics.content_1: Effektive Variablen oder ein nicht ausgeführtes Play können route/platform auf app1 falsch lassen; SSH- oder Dateilesefehler liefern denselben Marker. [Ursache und Prüfung](guides#guide=ansible-5&section=station-inventory-override)
diagnostics.content_2: Effektive Variablen oder ein nicht ausgeführtes Play können route/platform auf app2 falsch lassen; SSH- oder Dateilesefehler liefern denselben Marker. [Ursache und Prüfung](guides#guide=ansible-5&section=station-inventory-override)
diagnostics.content_3: Effektive Variablen oder ein nicht ausgeführtes Play können route/platform auf app3 falsch lassen; SSH- oder Dateilesefehler liefern denselben Marker. [Ursache und Prüfung](guides#guide=ansible-5&section=station-inventory-override)
diagnostics.probe_0_1: Wiederverwendbare Defaults wurden möglicherweise bearbeitet oder um zusätzliche Schlüssel ergänzt; eine fehlende oder unlesbare Datei, ungültiges YAML oder ein Python-/PyYAML-Startfehler verhindert ebenfalls die genaue Map-Prüfung. [Ursache und Prüfung](guides#guide=ansible-5&section=station-unchanged-defaults)
