hints.0.text: Defaults роли имеют низкий приоритет.
hints.1.text: Используйте слой inventory для данных окружения. Используйте group_vars/fleet.yml вместо изменения
  roles/station/defaults/main.yml.
hints.2.text: Переопределите route и унаследуйте platform.
phrases.0: Я использовал приоритет переменных без переписывания общих defaults роли.
phrases.1: Я сохранил общую роль пригодной для повторного использования на разных узлах.
phrases.2: Я проверил итоговое значение станции на каждом узле.
