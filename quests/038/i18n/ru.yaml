title: Значения по умолчанию роли
brief: |-
  Результат роли на хостах не соответствует этой группе.

  Работайте на workstation в `~/quest` с файлами `inventory.ini`, `ansible.cfg`, `rollout.yml`, `roles/station/defaults/main.yml`, `roles/station/tasks/main.yml`, `group_vars/fleet.yml`.

  **Требования:**
  - Хост `app1`:
    - На app1 файл /srv/site/role.txt содержит north:shared.
  - Хост `app2`:
    - На app2 файл /srv/site/role.txt содержит north:shared.
  - Хост `app3`:
    - На app3 файл /srv/site/role.txt содержит north:shared.
  - Результаты на workstation и результаты выполнения:
    - На workstation файл roles/station/defaults/main.yml сохраняет route retired и platform shared.

  **Самопроверка перед Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'cat /srv/site/role.txt'` — показывает north:shared с каждого управляемого хоста.
  - `cat ~/quest/roles/station/defaults/main.yml` — показывает сохранённые defaults route retired и platform shared на workstation.
debrief: Inventory выбрал значение окружения, сохранив переиспользуемый контракт роли.
stages.0.brief: Результат для этой группы хостов должен сохранять переиспользуемые defaults.
stages.0.objectives.0.text: На app1 файл /srv/site/role.txt содержит north:shared.
stages.0.objectives.1.text: На app2 файл /srv/site/role.txt содержит north:shared.
stages.0.objectives.2.text: На app3 файл /srv/site/role.txt содержит north:shared.
