title: Значения по умолчанию роли
brief: 'Результат роли на хостах не соответствует этой группе.


  Работайте на workstation в `~/quest` с файлами `inventory.ini`, `ansible.cfg`, `rollout.yml`, `roles/station/defaults/main.yml`,
  `roles/station/tasks/main.yml`, `group_vars/fleet.yml`.


  **Требования:**

  - На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/role.txt` содержит `north:shared`.

  - Повторно используемые значения по умолчанию в `~/quest/roles/station/defaults/main.yml` на рабочей станции
  сохраняют в точности поставленные настройки.

  '
debrief: Inventory выбрал значение окружения, сохранив переиспользуемый контракт роли.
stages.0.brief: Результат для этой группы хостов должен сохранять переиспользуемые defaults.
stages.0.objectives.0.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/role.txt`
  содержит `north:shared`.
stages.0.objectives.1.text: Повторно используемые значения по умолчанию в `~/quest/roles/station/defaults/main.yml`
  на рабочей станции сохраняют в точности поставленные настройки.
hints.0.text: Повторно используемые значения по умолчанию служат запасными и могут переопределяться данными
  конкретного развёртывания.
hints.1.text: 'Изучите поставленные входные данные и область выполнения:


  ```sh

  cat roles/station/defaults/main.yml roles/station/tasks/main.yml group_vars/fleet.yml rollout.yml

  ```'
hints.2.text: 'Используйте слой inventory для данных окружения. Используйте group_vars/fleet.yml вместо изменения
  roles/station/defaults/main.yml.


  Переопределите route и унаследуйте platform.


  Проверьте наблюдаемый результат:


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''cat /srv/site/role.txt''` — показывает
  north:shared с каждого управляемого хоста.


  - `cat ~/quest/roles/station/defaults/main.yml` — показывает сохранённые defaults route retired и platform
  shared на workstation.'
phrases.0: Я использовал приоритет переменных без переписывания общих defaults роли.
phrases.1: Я сохранил общую роль пригодной для повторного использования на разных узлах.
phrases.2: Я проверил итоговое значение станции на каждом узле.
diagnostics.content_1: На app1 файл /srv/site/role.txt содержит north:shared.
diagnostics.content_2: На app2 файл /srv/site/role.txt содержит north:shared.
diagnostics.content_3: На app3 файл /srv/site/role.txt содержит north:shared.
