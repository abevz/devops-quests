title: Значения по умолчанию роли
brief: 'Переиспользуемая роль station задаёт retired/shared. Этому парку нужен north/shared. Переопределите
  только route в group_vars/fleet.yml, не меняя defaults, затем запишите /srv/site/role.txt на все цели
  через rollout.yml.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `inventory.ini`, `ansible.cfg`, `rollout.yml`,
  `roles/station/defaults/main.yml`, `roles/station/tasks/main.yml`, `group_vars/fleet.yml`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Все цели содержат north:shared; defaults роли не изменены.'
debrief: Inventory выбрал значение окружения, сохранив переиспользуемый контракт роли.
stages.0.brief: 'Все цели содержат north:shared; defaults роли не изменены.


  Результат проверки: Все цели содержат north:shared; defaults роли не изменены.'
stages.0.objectives.0.text: Все цели содержат north:shared; defaults роли не изменены.
hints.0.text: Defaults роли имеют низкий приоритет.
hints.1.text: Используйте слой inventory для данных окружения.
hints.2.text: Переопределите route и унаследуйте platform.
phrases.0: Я использовал приоритет переменных без переписывания общих defaults роли.
phrases.1: Я сохранил общую роль пригодной для повторного использования на разных узлах.
phrases.2: Я проверил итоговое значение станции на каждом узле.
