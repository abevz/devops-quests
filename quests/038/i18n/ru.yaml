title: Значения по умолчанию роли
brief: |-
  Результат роли на хостах не соответствует этой группе.

  Работайте на workstation в `~/quest` с файлами `inventory.ini`, `ansible.cfg`, `rollout.yml`, `roles/station/defaults/main.yml`, `roles/station/tasks/main.yml`, `group_vars/fleet.yml`.

  **Требования:**
  - Файл на каждом управляемом хосте (`app1`, `app2`, `app3`):
    - Путь: `/srv/site/role.txt`.
    - Содержимое: `north:shared`.
  - Переиспользуемые значения по умолчанию на workstation:
    - Путь: `~/quest/roles/station/defaults/main.yml`.
    - `route`: `retired`.
    - `platform`: `shared`.

  **Самопроверка перед Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'cat /srv/site/role.txt'` — показывает north:shared с каждого управляемого хоста.
  - `cat ~/quest/roles/station/defaults/main.yml` — показывает сохранённые defaults route retired и platform shared на workstation.
debrief: Inventory выбрал значение окружения, сохранив переиспользуемый контракт роли.
stages.0.brief: Результат для этой группы хостов должен сохранять переиспользуемые defaults.
stages.0.objectives.0.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/role.txt` содержит
  `north:shared`.
stages.0.objectives.1.text: На workstation файл roles/station/defaults/main.yml сохраняет route retired и platform
  shared.
hints.0.text: Defaults роли имеют низкий приоритет.
hints.1.text: Используйте слой inventory для данных окружения. Используйте group_vars/fleet.yml вместо изменения
  roles/station/defaults/main.yml.
hints.2.text: Переопределите route и унаследуйте platform.
phrases.0: Я использовал приоритет переменных без переписывания общих defaults роли.
phrases.1: Я сохранил общую роль пригодной для повторного использования на разных узлах.
phrases.2: Я проверил итоговое значение станции на каждом узле.
