title: Valores predeterminados de Role
brief: 'La salida de la función desplegada no coincide con esta flota.


  Trabaja en la workstation en `~/quest` con `inventory.ini`, `ansible.cfg`, `rollout.yml`, `roles/station/defaults/main.yml`,
  `roles/station/tasks/main.yml`, `group_vars/fleet.yml`.


  **Requisitos:**

  - En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/role.txt` contiene `north:shared`.

  - Los valores predeterminados reutilizables de `~/quest/roles/station/defaults/main.yml` en la estación de
  trabajo conservan exactamente los ajustes suministrados.

  '
debrief: Inventory seleccionó un valor de implementación manteniendo el contrato de rol reutilizable.
stages.0.brief: La salida específica de la flota debe conservar los valores predeterminados reutilizables.
stages.0.objectives.0.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/role.txt` contiene
  `north:shared`.
stages.0.objectives.1.text: Los valores predeterminados reutilizables de `~/quest/roles/station/defaults/main.yml`
  en la estación de trabajo conservan exactamente los ajustes suministrados.
hints.0.text: Los valores predeterminados reutilizables sirven de respaldo y pueden ser reemplazados por los
  datos de un despliegue concreto.
hints.1.text: 'Inspecciona las entradas suministradas y el ámbito de ejecución:


  ```sh

  cat roles/station/defaults/main.yml roles/station/tasks/main.yml group_vars/fleet.yml rollout.yml

  ```'
hints.2.text: 'Utilice la capa variable inventory para los datos de implementación. Usa group_vars/fleet.yml
  en lugar de editar roles/station/defaults/main.yml.


  Anule route y herede platform.


  Verifica el resultado observado:


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''cat /srv/site/role.txt''` — muestra north:shared
  de cada host administrado.


  - `cat ~/quest/roles/station/defaults/main.yml` — muestra los valores predeterminados conservados route retired
  y platform shared en la workstation.'
phrases.0: Utilicé precedencia de variables sin reescribir el rol compartido defaults.
phrases.1: Mantuve el rol compartido reutilizable entre objetivos.
phrases.2: Verifiqué el valor efectivo de station en cada host.
diagnostics.content_1: En app1, /srv/site/role.txt contiene north:shared.
diagnostics.content_2: En app2, /srv/site/role.txt contiene north:shared.
diagnostics.content_3: En app3, /srv/site/role.txt contiene north:shared.
diagnostics.probe_0_1: 'Los datos actuales no permiten verificar este objetivo: Los valores predeterminados reutilizables
  de `~/quest/roles/station/defaults/main.yml` en la estación de trabajo conservan exactamente los ajustes suministrados.'
