title: Valores predeterminados de Role
brief: 'El rol reutilizable station defaults a retired/shared. Esta flota necesita north/shared. Anular
  solo route en group_vars/fleet.yml sin editar defaults, luego ejecute rollout.yml para escribir /srv/site/role.txt
  en cada objetivo.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `inventory.ini`, `ansible.cfg`,
  `rollout.yml`, `roles/station/defaults/main.yml`, `roles/station/tasks/main.yml`, `group_vars/fleet.yml`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: todos los objetivos tienen north:shared; El rol defaults no se modifica.'
debrief: Inventory seleccionó un valor de implementación manteniendo el contrato de rol reutilizable.
stages.0.brief: 'Criterios de éxito: todos los objetivos tienen north:shared; rol defaults no cambian.'
stages.0.objectives.0.text: Todos los objetivos tienen north:shared; El rol defaults no se modifica.
hints.0.text: Los valores predeterminados de Role tienen baja prioridad.
hints.1.text: Utilice la capa variable inventory para los datos de implementación.
hints.2.text: Anule route y herede platform.
phrases.0: Utilicé precedencia de variables sin reescribir el rol compartido defaults.
phrases.1: Mantuve el rol compartido reutilizable entre objetivos.
phrases.2: Verifiqué el valor efectivo de station en cada host.
