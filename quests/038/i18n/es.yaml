title: Valores predeterminados de Role
brief: |-
  La salida de la función desplegada no coincide con esta flota.

  Trabaja en la workstation en `~/quest` con `inventory.ini`, `ansible.cfg`, `rollout.yml`, `roles/station/defaults/main.yml`, `roles/station/tasks/main.yml`, `group_vars/fleet.yml`.

  **Requisitos:**
  - Archivo en cada host administrado (`app1`, `app2`, `app3`):
    - Ruta: `/srv/site/role.txt`.
    - Contenido: `north:shared`.
  - Valores predeterminados reutilizables en la workstation:
    - Ruta: `~/quest/roles/station/defaults/main.yml`.
    - `route`: `retired`.
    - `platform`: `shared`.

  **Verifica antes de Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'cat /srv/site/role.txt'` — muestra north:shared de cada host administrado.
  - `cat ~/quest/roles/station/defaults/main.yml` — muestra los valores predeterminados conservados route retired y platform shared en la workstation.
debrief: Inventory seleccionó un valor de implementación manteniendo el contrato de rol reutilizable.
stages.0.brief: La salida específica de la flota debe conservar los valores predeterminados reutilizables.
stages.0.objectives.0.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/role.txt` contiene `north:shared`.
stages.0.objectives.1.text: En la workstation, roles/station/defaults/main.yml conserva route retired y platform
  shared.
hints.0.text: Los valores predeterminados de Role tienen baja prioridad.
hints.1.text: Utilice la capa variable inventory para los datos de implementación. Usa group_vars/fleet.yml en lugar
  de editar roles/station/defaults/main.yml.
hints.2.text: Anule route y herede platform.
phrases.0: Utilicé precedencia de variables sin reescribir el rol compartido defaults.
phrases.1: Mantuve el rol compartido reutilizable entre objetivos.
phrases.2: Verifiqué el valor efectivo de station en cada host.
