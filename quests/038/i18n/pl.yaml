title: Domyślne ustawienia Role
brief: |-
  Wynik wdrożonej roli nie odpowiada tej grupie hostów.

  Pracuj na workstation w `~/quest` z plikami `inventory.ini`, `ansible.cfg`, `rollout.yml`, `roles/station/defaults/main.yml`, `roles/station/tasks/main.yml`, `group_vars/fleet.yml`.

  **Wymagania:**
  - Host `app1`:
    - Na app1 plik /srv/site/role.txt zawiera north:shared.
  - Host `app2`:
    - Na app2 plik /srv/site/role.txt zawiera north:shared.
  - Host `app3`:
    - Na app3 plik /srv/site/role.txt zawiera north:shared.
  - Wyniki na workstation i wyniki wykonania:
    - Na workstation plik roles/station/defaults/main.yml zachowuje route retired i platform shared.

  **Sprawdź przed Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'cat /srv/site/role.txt'` — pokazuje north:shared z każdego zarządzanego hosta.
  - `cat ~/quest/roles/station/defaults/main.yml` — pokazuje zachowane wartości domyślne route retired i platform shared na workstation.
debrief: Inventory wybrał wartość wdrożenia, zachowując umowę roli wielokrotnego użytku.
stages.0.brief: Wynik dla tej grupy hostów musi zachować wielokrotnie używane wartości domyślne.
stages.0.objectives.0.text: Na app1 plik /srv/site/role.txt zawiera north:shared.
stages.0.objectives.1.text: Na app2 plik /srv/site/role.txt zawiera north:shared.
stages.0.objectives.2.text: Na app3 plik /srv/site/role.txt zawiera north:shared.
stages.0.objectives.3.text: Na workstation plik roles/station/defaults/main.yml zachowuje route retired i platform
  shared.
hints.0.text: Wartości domyślne Role mają niski priorytet.
hints.1.text: Użyj warstwy zmiennej inventory do danych wdrożeniowych. Użyj group_vars/fleet.yml zamiast edytować
  roles/station/defaults/main.yml.
hints.2.text: Zastąp route i odziedzicz platform.
phrases.0: Użyłem zmiennej pierwszeństwa bez przepisywania roli współdzielonej defaults.
phrases.1: Zachowałem wspólną rolę, którą można ponownie wykorzystać w różnych celach.
phrases.2: Sprawdziłem efektywną wartość station na każdym hoście.
