title: Domyślne ustawienia Role
brief: 'Wynik wdrożonej roli nie odpowiada tej grupie hostów.


  Pracuj na workstation w `~/quest` z plikami `inventory.ini`, `ansible.cfg`, `rollout.yml`, `roles/station/defaults/main.yml`,
  `roles/station/tasks/main.yml`, `group_vars/fleet.yml`.


  **Wymagania:**

  - Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/role.txt` zawiera `north:shared`.

  - Domyślne wartości wielokrotnego użytku w `~/quest/roles/station/defaults/main.yml` na stacji roboczej zachowują
  dokładnie dostarczone ustawienia.

  '
debrief: Inventory wybrał wartość wdrożenia, zachowując umowę roli wielokrotnego użytku.
stages.0.brief: Wynik dla tej grupy hostów musi zachować wielokrotnie używane wartości domyślne.
stages.0.objectives.0.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/role.txt`
  zawiera `north:shared`.
stages.0.objectives.1.text: Domyślne wartości wielokrotnego użytku w `~/quest/roles/station/defaults/main.yml`
  na stacji roboczej zachowują dokładnie dostarczone ustawienia.
hints.0.text: Domyślne wartości wielokrotnego użytku są wartościami zapasowymi, które mogą zostać nadpisane
  danymi konkretnego wdrożenia.
hints.1.text: 'Sprawdź dostarczone dane wejściowe i zakres wykonania:


  ```sh

  cat roles/station/defaults/main.yml roles/station/tasks/main.yml group_vars/fleet.yml rollout.yml

  ```'
hints.2.text: 'Użyj warstwy zmiennej inventory do danych wdrożeniowych. Użyj group_vars/fleet.yml zamiast edytować
  roles/station/defaults/main.yml.


  Zastąp route i odziedzicz platform.


  Sprawdź obserwowany wynik:


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''cat /srv/site/role.txt''` — pokazuje north:shared
  z każdego zarządzanego hosta.


  - `cat ~/quest/roles/station/defaults/main.yml` — pokazuje zachowane wartości domyślne route retired i platform
  shared na workstation.'
phrases.0: Użyłem zmiennej pierwszeństwa bez przepisywania roli współdzielonej defaults.
phrases.1: Zachowałem wspólną rolę, którą można ponownie wykorzystać w różnych celach.
phrases.2: Sprawdziłem efektywną wartość station na każdym hoście.
diagnostics.content_1: Na app1 plik /srv/site/role.txt zawiera north:shared.
diagnostics.content_2: Na app2 plik /srv/site/role.txt zawiera north:shared.
diagnostics.content_3: Na app3 plik /srv/site/role.txt zawiera north:shared.
