title: Domyślne ustawienia Role
brief: 'Rola wielokrotnego użytku station defaults do retired/shared. Ta flota potrzebuje north/shared.
  Zastąp tylko route w group_vars/fleet.yml bez edycji defaults, a następnie uruchom rollout.yml, aby
  zapisać /srv/site/role.txt na każdym celu.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `inventory.ini`, `ansible.cfg`,
  `rollout.yml`, `roles/station/defaults/main.yml`, `roles/station/tasks/main.yml`, `group_vars/fleet.yml`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: wszystkie cele mają north:shared; rola defaults pozostają niezmienione.'
debrief: Inventory wybrał wartość wdrożenia, zachowując umowę roli wielokrotnego użytku.
stages.0.brief: 'Kryteria sukcesu: Wszystkie cele mają north:shared; rola defaults pozostają niezmienione.'
stages.0.objectives.0.text: Wszystkie cele mają north:shared; rola defaults pozostają niezmienione.
hints.0.text: Wartości domyślne Role mają niski priorytet.
hints.1.text: Użyj warstwy zmiennej inventory do danych wdrożeniowych.
hints.2.text: Zastąp route i odziedzicz platform.
phrases.0: Użyłem zmiennej pierwszeństwa bez przepisywania roli współdzielonej defaults.
phrases.1: Zachowałem wspólną rolę, którą można ponownie wykorzystać w różnych celach.
phrases.2: Sprawdziłem efektywną wartość station na każdym hoście.
