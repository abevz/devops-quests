title: Role defaults
brief: |-
  The deployed role output does not match this fleet.

  Work on the workstation in `~/quest` with `inventory.ini`, `ansible.cfg`, `rollout.yml`, `roles/station/defaults/main.yml`, `roles/station/tasks/main.yml`, `group_vars/fleet.yml`.

  **Requirements:**
  - File on every managed host (`app1`, `app2`, `app3`):
    - Path: `/srv/site/role.txt`.
    - Content: `north:shared`.
  - Reusable defaults on the workstation:
    - Path: `~/quest/roles/station/defaults/main.yml`.
    - `route`: `retired`.
    - `platform`: `shared`.

  **Verify yourself before Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'cat /srv/site/role.txt'` — shows north:shared from each managed host.
  - `cat ~/quest/roles/station/defaults/main.yml` — shows retained route retired and platform shared defaults on the workstation.
debrief: Inventory selected a deployment value while retaining the reusable role contract.
stages.0.brief: Fleet-specific output must preserve the reusable defaults.
stages.0.objectives.0.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/role.txt` contains `north:shared`.
stages.0.objectives.1.text: On the workstation, roles/station/defaults/main.yml retains route retired and platform
  shared.
hints.0.text: Role defaults have low precedence.
hints.1.text: Use the inventory variable layer for deployment data. Use group_vars/fleet.yml rather than editing
  roles/station/defaults/main.yml.
hints.2.text: Override route and inherit platform.
phrases.0: I used variable precedence without rewriting shared role defaults.
phrases.1: I kept the shared role reusable across targets.
phrases.2: I verified the effective station value on every host.
