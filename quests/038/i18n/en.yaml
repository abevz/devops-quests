title: Role defaults
brief: 'The reusable station role defaults to retired/shared. This fleet needs north/shared.
  Override only route in group_vars/fleet.yml without editing defaults, then run rollout.yml
  to write /srv/site/role.txt on every target.


  Quest files in `~/quest` (some appear in later stages): `inventory.ini`, `ansible.cfg`,
  `rollout.yml`, `roles/station/defaults/main.yml`, `roles/station/tasks/main.yml`,
  `group_vars/fleet.yml`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images
  and private services. Change only this bay.


  Initial success criteria: All targets have north:shared; role defaults are unchanged.'
debrief: Inventory selected a deployment value while retaining the reusable role contract.
stages.0.brief: 'Success criteria: All targets have north:shared; role defaults are
  unchanged.'
stages.0.objectives.0.text: All targets have north:shared; role defaults are unchanged.
hints.0.text: Role defaults have low precedence.
hints.1.text: Use the inventory variable layer for deployment data.
hints.2.text: Override route and inherit platform.
phrases.0: I used variable precedence without rewriting shared role defaults.
phrases.1: I kept the shared role reusable across targets.
phrases.2: I verified the effective station value on every host.
