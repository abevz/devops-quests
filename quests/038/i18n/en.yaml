title: Role defaults
brief: 'The deployed role output does not match this fleet.


  Work on the workstation in `~/quest` with `inventory.ini`, `ansible.cfg`, `rollout.yml`, `roles/station/defaults/main.yml`,
  `roles/station/tasks/main.yml`, `group_vars/fleet.yml`.


  **Requirements:**

  - On every managed host (`app1`, `app2`, `app3`), `/srv/site/role.txt` contains `north:shared`.

  - The reusable defaults in `~/quest/roles/station/defaults/main.yml` on the workstation keep exactly their
  supplied settings.

  '
debrief: Inventory selected a deployment value while retaining the reusable role contract.
stages.0.brief: Fleet-specific output must preserve the reusable defaults.
stages.0.objectives.0.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/role.txt` contains `north:shared`.
stages.0.objectives.1.text: The reusable defaults in `~/quest/roles/station/defaults/main.yml` on the workstation
  keep exactly their supplied settings.
hints.0.text: Reusable defaults provide fallbacks that deployment-specific data can override.
hints.1.text: 'Inspect the supplied inputs and execution scope:


  ```sh

  cat roles/station/defaults/main.yml roles/station/tasks/main.yml group_vars/fleet.yml rollout.yml

  ```'
hints.2.text: 'Use the inventory variable layer for deployment data. Use group_vars/fleet.yml rather than editing
  roles/station/defaults/main.yml.


  Override route and inherit platform.


  Verify the observed result:


  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a ''cat /srv/site/role.txt''` — shows north:shared
  from each managed host.


  - `cat ~/quest/roles/station/defaults/main.yml` — shows retained route retired and platform shared defaults
  on the workstation.'
phrases.0: I used variable precedence without rewriting shared role defaults.
phrases.1: I kept the shared role reusable across targets.
phrases.2: I verified the effective station value on every host.
diagnostics.content_1: On app1, /srv/site/role.txt contains north:shared.
diagnostics.content_2: On app2, /srv/site/role.txt contains north:shared.
diagnostics.content_3: On app3, /srv/site/role.txt contains north:shared.
