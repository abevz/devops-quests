title: Bezpieczna dostawa artefaktów
brief: |-
  Flota nie dostarcza wymaganego wydania.

  Pracuj na workstation w `~/quest` z plikami `inventory.ini`, `ansible.cfg`, `release.txt`, `rollout.yml`.

  **Wymagania:**
  - Plik na każdym zarządzanym hoście (`app1`, `app2`, `app3`):
    - Ścieżka: `/srv/site/release.txt`.
    - Treść: `release-89`.
  - Plik na każdym zarządzanym hoście (`app1`, `app2`, `app3`):
    - Ścieżka: `/srv/site/reader.token`.
    - Treść: `game-only-reader`.
    - Tryb dostępu: `0600`.

  **Sprawdź przed Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'test "$(cat /srv/site/reader.token)" = game-only-reader && printf "credential matches\n"'` — Każdy host potwierdza `credential matches` bez wypisywania poświadczenia.
  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'ls -l /srv/site/reader.token; if runuser -u nobody -- cat /srv/site/reader.token >/dev/null 2>&1; then exit 1; else printf "unprivileged read denied\n"; fi'` — Każdy host pokazuje `-rw-------` i potwierdza `unprivileged read denied` dla użytkownika `nobody`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'cat /srv/site/release.txt'` — Pokazuje `release-89` z `app1`, `app2`, `app3`.
stages.0.brief: Każdy zarządzany host musi mieć wymagane wydanie i poufne poświadczenie czytelnika.
stages.0.objectives.0.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/release.txt` zawiera
  `release-89`.
stages.0.objectives.1.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/reader.token`
  zawiera `game-only-reader`.
stages.0.objectives.2.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) ścieżka `/srv/site/reader.token`
  ma tryb `0600`.
hints.0.text: Tożsamość wydania i poufność poświadczenia to niezależne wyniki.
hints.1.text: Wydanie musi mieć postać release-89, a credential nie może być czytelne dla całego świata.
hints.2.text: Popraw artefakt źródłowy i użyj trybu 0600 z no_log w dostawie credential.
debrief: Artefakt wydania był błędny, a uprawnienia credential były zbyt szerokie. Dostarczyłeś release-89 i zweryfikowałeś
  tryb 0600 na każdym zarządzanym credential.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem wynik na każdym zarządzanym hoście.
