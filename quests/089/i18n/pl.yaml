diagnostics.controller_artifact: Dostarczony release.txt kontrolera początkowo zawiera błędne wydanie; kopiowanie bez zmiany nie daje zatwierdzonego artefaktu. Przywróć bajty publikacji z końcową nową linią i porównaj rzeczywisty hash z zamrożonym potwierdzeniem. [Przyczyna i kontrola](guides#guide=ansible-13&section=private-artifact-trusted-controller-content)
diagnostics.application_budget: DNS, obserwacje procesów SSH lub uwierzytelnione żądania mogą wyczerpać wspólny budżet Python dziesięciu sekund; sprawdź istniejące endpoints i dostęp do prywatnych wejść. Wcześniejsza ośmiosekundowa grupa legacy SSH ma osobny zewnętrzny fallback. [Przyczyna i kontrola](guides#guide=ansible-13&section=private-artifact-bounded-authenticated-observation)
diagnostics.application_observation: Artefakt kontrolera, zamrożony contract lub struktura credential mogą być nieczytelne albo DNS źródła zawodzi przed wejściem do hosta; sprawdź ścieżki i nazwy zmiennych bez wypisywania credentials. Obsłużone błędy wejść i poleceń tej fazy dzielą marker. [Przyczyna i kontrola](guides#guide=ansible-13&section=private-artifact-global-private-inputs)
diagnostics.probe_0_0: 'Wcześniejsza grupa SSH wydania może zakończyć się przed nazwanym wynikiem albo ładowanie helpers/YAML lub nieoczekiwana struktura metadata przerywa obserwator. Najpierw popraw pliki legacy wydania: błąd grupy pomija kontrole aplikacji; nazwane błędy hostów zachowują diagnostykę. [Przyczyna i kontrola](guides#guide=ansible-13&section=private-artifact-legacy-and-unhandled-inputs)'
diagnostics.release_1: 'app1: Cel może zachować stary artefakt lub dostać błędne wydanie kontrolera; sprawdź release.txt z potwierdzeniem publikacji przed dostarczeniem release-89. Błędy odczytu SSH też dają marker. [Przyczyna i kontrola](guides#guide=ansible-13&section=private-artifact-app1-release)'
diagnostics.token_1: 'app1: Cel może zachować stary credential, błędną zmienną lub dodatkowe spacje; dostarcz podany credential do istniejącego pliku bez ujawniania w logach. Porównanie shell usuwa końcowe nowe linie; błędy odczytu SSH dzielą marker. [Przyczyna i kontrola](guides#guide=ansible-13&section=private-artifact-app1-token)'
diagnostics.token_mode_1: 'app1: Dostarczony plik credential zaczyna z publicznym mode 0644 albo copy zachowuje tę wartość; ustaw jawnie mode 0600. Mode jest sprawdzany osobno od dostępu pierwotnego principal aplikacji. [Przyczyna i kontrola](guides#guide=ansible-13&section=private-artifact-app1-token-mode)'
diagnostics.application_ready_1: 'app1: Aplikacja może odrzucać stary credential, nie odczytywać pliku 0600 należącego do root lub zachować błędny artefakt/upstream. Zapewnij prywatny odczyt pierwotnemu principal, napraw źródło i sprawdź uwierzytelnioną publikację po sygnale do tego samego PID. [Przyczyna i kontrola](guides#guide=ansible-13&section=private-artifact-app1-ready)'
