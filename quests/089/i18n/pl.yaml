title: Bezpieczna dostawa artefaktów
brief: 'Dołączyłeś do operacji SignalRail. Dostarcz zweryfikowany manifest trasy z prywatnymi poświadczeniami.
  Pracuj w ~/quest. Wszystkie zmiany przechowuj w tej komorze szkoleniowej.


  Wejścia w `~/quest`: `inventory.ini`, `ansible.cfg`, `release.txt`, `rollout.yml`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Wszystkie zmiany muszą pozostać w tej zatoce.


  Początkowe kryteria sukcesu: wszystkie trzy hosty mają release.txt zawierające release-89 i reader.token
  zawierające dostarczone tylko do gier credential, tryb 0600.'
stages.0.brief: 'Dostarcz release-89 i reader credential przeznaczony tylko do gier z trybem 0600. Sprawdź
  stan zarządzany, a nie tekst dziennika.


  Kryteria sukcesu: Wszystkie trzy hosty mają release.txt zawierające release-89 i reader.token zawierające
  dostarczony tylko do gry credential, tryb 0600.'
stages.0.objectives.0.text: Wszystkie trzy hosty mają release.txt zawierające release-89 i reader.token
  zawierające dostarczone tylko do gier credential, tryb 0600.
hints.0.text: Porównaj dostarczony artefakt i tryb poświadczeń na każdym hoście.
hints.1.text: Wydanie musi mieć postać release-89, a credential nie może być czytelne dla całego świata.
hints.2.text: Popraw artefakt źródłowy i użyj trybu 0600 z no_log w dostawie credential.
debrief: Artefakt wydania był błędny, a uprawnienia credential były zbyt szerokie. Dostarczyłeś release-89
  i zweryfikowałeś tryb 0600 na każdym zarządzanym credential.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem wynik na każdym zarządzanym hoście.
