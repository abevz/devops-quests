title: Bezpieczna dostawa artefaktów
brief: "Flota nie dostarcza wymaganego wydania.\n\nPracuj na workstation w `~/quest` z plikami `inventory.ini`,\
  \ `ansible.cfg`, `release.txt`, `rollout.yml`. Dodatkowe pliki na stacji roboczej w `~/quest`: `credentials.yml`,\
  \ `application-contract.json`, `provided-application.py`, `original-application-identities.json`.\n\n**Wymagania:**\n\
  - Plik na każdym zarządzanym hoście (`app1`, `app2`, `app3`):\n  - Ścieżka: `/srv/site/release.txt`.\n  - Treść:\
  \ `release-89`.\n- Plik na każdym zarządzanym hoście (`app1`, `app2`, `app3`):\n  - Ścieżka: `/srv/site/reader.token`.\n\
  \  - Treść: dostarczone syntetyczne poświadczenie.\n  - Tryb dostępu: `0600`.\n- Na stacji roboczej `release.txt`\
  \ odpowiada zaufanemu potwierdzeniu publikacji w `application-contract.json`. Każda dostarczona aplikacja na zarządzanych\
  \ hostach (`app1`, `app2`, `app3`) uwierzytelnia podane syntetyczne dane dostępu i udostępnia zatwierdzony artefakt\
  \ przez HTTP `8081`, `/`; zależne aplikacje pobierają go z istniejącego źródła.\n- Zachowaj procesy aplikacji,\
  \ konta, grupy, capabilities, wiersze poleceń i bajty zainstalowanego programu z `original-application-identities.json`.\n\
  \nSprawdzenie obserwuje bieżące wyniki; nie ustala pełnej historii wykonania."
stages.0.brief: Każdy zarządzany host musi mieć wymagane wydanie i poufne poświadczenie czytelnika.
stages.0.objectives.0.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/release.txt` zawiera
  `release-89`. Artefakt kontrolera i działające uwierzytelnione aplikacje odpowiadają także zaufanemu potwierdzeniu
  publikacji, zachowując oryginalne tożsamości.
stages.0.objectives.1.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) plik `/srv/site/reader.token`
  zawiera dostarczone syntetyczne poświadczenie.
stages.0.objectives.2.text: Na każdym zarządzanym hoście (`app1`, `app2`, `app3`) ścieżka `/srv/site/reader.token`
  ma tryb `0600`.
hints.0.text: Integralność artefaktu, prywatny dostęp odbiorcy i przyjęcie przez działającą aplikację tworzą łańcuch
  dostarczania. Obserwuj gotowość źródła przed propagacją do zależnych aplikacji.
hints.1.text: Porównaj `release.txt`, `credentials.yml`, `application-contract.json` i `provided-application.py`.
  Sprawdź właścicieli i prawa docelowe, konta procesów, uprawnienia operatora, logi aplikacji oraz uwierzytelniony
  status HTTP. Nie wypisuj danych dostępu w diagnostyce.
hints.2.text: 'Przygotuj wrażliwą treść i ograniczone uprawnienia przed przekazaniem własności odbiorcy. Aktywuj
  źródło jako jego oryginalny użytkownik i zweryfikuj uwierzytelnioną publikację przed aktywacją zależnych aplikacji.
  Uruchom `ansible-playbook --diff rollout.yml`. Potwierdź tryb `0600` dla `/srv/site/reader.token` na każdym hoście.
  Wczytaj `credentials.yml` w Pythonie i utwórz HTTP Authorization w pamięci: wszystkie dostarczone usługi na `8081`
  mają zwrócić zatwierdzoną wersję, SHA-256 i generację przy zachowaniu tożsamości procesu.'
debrief: Skoordynowano dostarczanie zweryfikowanego artefaktu, prywatny dostęp aplikacji i etapowe przyjęcie danych
  przez źródło oraz zależnych konsumentów.
phrases.0: Przed dokonaniem zmiany sprawdziłem stan działania.
phrases.1: Znalazłem przyczynę i zmieniałem jedną rzecz na raz.
phrases.2: Sprawdziłem wynik na każdym zarządzanym hoście.
