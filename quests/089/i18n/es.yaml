title: Entrega segura de artefactos
brief: 'Te uniste a las operaciones de SignalRail. Entregue un manifiesto route verificado con credenciales
  privadas. Trabajar en ~/quest. Mantenga todos los cambios dentro de esta bahía de entrenamiento.


  Entradas en `~/quest`: `inventory.ini`, `ansible.cfg`, `release.txt`, `rollout.yml`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente los archivos suministrados, las imágenes
  precargadas y los servicios privados. Todos los cambios deben permanecer dentro de esta bahía.


  Criterios de éxito iniciales: los tres hosts tienen release.txt que contiene release-89 y reader.token
  que contiene el credential suministrado solo para juegos, modo 0600.'
stages.0.brief: 'Entregue release-89 y un reader credential solo para juegos con el modo 0600. Inspeccione
  el estado administrado, no el texto del registro.


  Criterios de éxito: los tres hosts tienen release.txt que contiene release-89 y reader.token que contiene
  el credential suministrado solo para juegos, modo 0600.'
stages.0.objectives.0.text: Los tres hosts tienen release.txt que contiene release-89 y reader.token que
  contiene el credential suministrado solo para juegos, modo 0600.
hints.0.text: Compare el artefacto entregado y el modo credential en cada host.
hints.1.text: La versión debe ser release-89 y credential no debe ser legible en todo el mundo.
hints.2.text: Corrija el artefacto de origen y use el modo 0600 con no_log en la entrega credential.
debrief: El artefacto de lanzamiento era incorrecto y los permisos de credential eran demasiado amplios.
  Usted entregó release-89 y verificó el modo 0600 en cada credential administrado.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el resultado en cada host administrado.
