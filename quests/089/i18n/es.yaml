diagnostics.controller_artifact: release.txt del controlador contiene publicación incorrecta inicialmente; copiarlo sin cambiar no produce artefacto aprobado. Restaure bytes con salto final y compare hash real con recibo congelado. [Causa y comprobación](guides#guide=ansible-13&section=private-artifact-trusted-controller-content)
diagnostics.application_budget: DNS, observaciones de procesos SSH o solicitudes autenticadas pueden agotar presupuesto Python compartido de diez segundos; inspeccione endpoints y acceso a entradas privadas. Grupo legacy SSH previo de ocho segundos tiene fallback exterior separado. [Causa y comprobación](guides#guide=ansible-13&section=private-artifact-bounded-authenticated-observation)
diagnostics.application_observation: Artefacto controlador, contract congelado o estructura credential pueden ser ilegibles o fallar DNS fuente antes de entrar al host; inspeccione rutas y variables sin imprimir credentials. Errores capturados de entradas y comandos de esta fase comparten marcador. [Causa y comprobación](guides#guide=ansible-13&section=private-artifact-global-private-inputs)
diagnostics.probe_0_0: 'Grupo SSH previo de publicación puede detenerse antes de resultado nombrado, o carga helpers/YAML o estructura metadata inesperada abortar observador autenticado. Corrija primero archivos legacy: fallo del grupo omite controles de aplicaciones; errores nombrados por host conservan diagnósticos. [Causa y comprobación](guides#guide=ansible-13&section=private-artifact-legacy-and-unhandled-inputs)'
diagnostics.release_1: 'app1: El destino puede conservar artefacto retirado o recibir publicación errónea del controlador; verifique release.txt con recibo antes de entregar release-89. Errores de lectura SSH también dan marcador. [Causa y comprobación](guides#guide=ansible-13&section=private-artifact-app1-release)'
diagnostics.token_1: 'app1: El destino puede conservar credential retirado, variable errónea o espacios extra; entregue credential suministrado al archivo existente sin exponerlo en logs. Comparación shell elimina saltos finales; errores de lectura SSH también usan marcador. [Causa y comprobación](guides#guide=ansible-13&section=private-artifact-app1-token)'
diagnostics.token_mode_1: 'app1: El archivo credential inicia con mode público 0644 o copy conserva default; fije explícitamente mode 0600. Mode se verifica separado del acceso del principal original de aplicación. [Causa y comprobación](guides#guide=ansible-13&section=private-artifact-app1-token-mode)'
diagnostics.application_ready_1: 'app1: La aplicación puede rechazar credential retirado, no leer archivo 0600 de root o conservar artefacto/upstream incorrecto. Mantenga archivo privado legible para principal original, repare fuente y autentique publicación tras señalar mismo PID. [Causa y comprobación](guides#guide=ansible-13&section=private-artifact-app1-ready)'
