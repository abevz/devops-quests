title: Entrega segura de artefactos
brief: |-
  La flota no entrega la versión solicitada.

  Trabaja en la workstation en `~/quest` con `inventory.ini`, `ansible.cfg`, `release.txt`, `rollout.yml`.

  **Requisitos:**
  - Archivo en cada host administrado (`app1`, `app2`, `app3`):
    - Ruta: `/srv/site/release.txt`.
    - Contenido: `release-89`.
  - Archivo en cada host administrado (`app1`, `app2`, `app3`):
    - Ruta: `/srv/site/reader.token`.
    - Contenido: la credencial sintética suministrada.
    - Modo de acceso: `0600`.

  La comprobación observa los resultados actuales; no establece todo el historial de ejecución.
stages.0.brief: Cada host administrado debe tener la versión solicitada y una credencial privada de lectura.
stages.0.objectives.0.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/release.txt`
  contiene `release-89`.
stages.0.objectives.1.text: En cada host gestionado (`app1`, `app2`, `app3`), `/srv/site/reader.token`
  contiene la credencial sintética suministrada.
stages.0.objectives.2.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/reader.token`
  tiene el modo `0600`.
hints.0.text: La identidad de la versión y la privacidad de la credencial son resultados independientes.
hints.1.text: |-
  La versión debe ser release-89 y la credencial no debe ser legible para todos.

  Inspecciona el inventario y el playbook suministrado en la workstation:

  ```sh
  ansible-inventory -i inventory.ini --graph
  cat rollout.yml
  ```
hints.2.text: |-
  Corrige el artefacto de origen y usa el modo 0600 con no_log al entregar la credencial.

  Verifica el resultado desde `~/quest` en la workstation:

  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'test "$(cat /srv/site/reader.token)" = game-only-reader && printf "credential matches\n"'` — Cada host confirma `credential matches` sin imprimir la credencial.
  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'ls -l /srv/site/reader.token; if runuser -u nobody -- cat /srv/site/reader.token >/dev/null 2>&1; then exit 1; else printf "unprivileged read denied\n"; fi'` — Cada host muestra `-rw-------` y confirma `unprivileged read denied` para el usuario `nobody`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'cat /srv/site/release.txt'` — Muestra `release-89` de `app1`, `app2`, `app3`.
debrief: El artefacto de lanzamiento era incorrecto y los permisos de credential eran demasiado amplios.
  Usted entregó release-89 y verificó el modo 0600 en cada credential administrado.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el resultado en cada host administrado.
