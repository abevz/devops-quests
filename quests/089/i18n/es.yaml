title: Entrega segura de artefactos
brief: "La flota no entrega la versión solicitada.\n\nTrabaja en la workstation en `~/quest` con `inventory.ini`,\
  \ `ansible.cfg`, `release.txt`, `rollout.yml`. Archivos adicionales en la estación de trabajo, en `~/quest`: `credentials.yml`,\
  \ `application-contract.json`, `provided-application.py`, `original-application-identities.json`.\n\n**Requisitos:**\n\
  - Archivo en cada host administrado (`app1`, `app2`, `app3`):\n  - Ruta: `/srv/site/release.txt`.\n  - Contenido:\
  \ `release-89`.\n- Archivo en cada host administrado (`app1`, `app2`, `app3`):\n  - Ruta: `/srv/site/reader.token`.\n\
  \  - Contenido: la credencial sintética suministrada.\n  - Modo de acceso: `0600`.\n- En la estación de trabajo,\
  \ `release.txt` coincide con el recibo fiable de publicación de `application-contract.json`. Cada aplicación proporcionada\
  \ en los hosts administrados (`app1`, `app2`, `app3`) autentica la credencial sintética y sirve el artefacto aprobado\
  \ mediante HTTP `8081`, `/`; las aplicaciones dependientes lo consumen desde la fuente existente.\n- Conserva\
  \ los procesos, usuarios, grupos, capacidades, líneas de órdenes y bytes instalados originales de `original-application-identities.json`.\n\
  \nLa comprobación observa los resultados actuales; no establece todo el historial de ejecución."
stages.0.brief: Cada host administrado debe tener la versión solicitada y una credencial privada de lectura.
stages.0.objectives.0.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/release.txt` contiene
  `release-89`. El artefacto del controlador y las aplicaciones autenticadas activas también coinciden con el recibo
  fiable, conservando sus identidades originales.
stages.0.objectives.1.text: En cada host gestionado (`app1`, `app2`, `app3`), `/srv/site/reader.token` contiene
  la credencial sintética suministrada.
stages.0.objectives.2.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/reader.token` tiene el
  modo `0600`.
hints.0.text: Integridad del artefacto, acceso privado del destinatario y adopción activa forman una cadena de entrega.
  Observa la disponibilidad de la fuente antes de propagar a aplicaciones dependientes.
hints.1.text: |-
  Compara `release.txt`, `credentials.yml`, `application-contract.json` y `provided-application.py`. Revisa propietarios y permisos de destino, usuarios de los procesos, capacidades del operador, registros y estado HTTP autenticado. No muestres credenciales en diagnósticos.

  Revisa las tareas que copian datos privados y contrasta los metadatos con las identidades originales de los procesos. Localiza el origen y los dependientes en la topología y compara el estado de sus respuestas autenticadas.
hints.2.text: |-
  Ejecuta `ansible-playbook rollout.yml`. Confirma permisos `0600` en `/srv/site/reader.token` de cada host. Carga `credentials.yml` con Python y construye HTTP Authorization en memoria: todos los puntos de acceso proporcionados en `8081` deben devolver versión, SHA-256 y generación aprobados conservando la identidad del proceso.

  ```sh
  ansible-playbook rollout.yml
  ansible fleet -i inventory.ini -m ansible.builtin.stat -a 'path=/srv/site/reader.token get_checksum=false'
  python3 -I - <<'VERIFY_PUBLICATION'
  import hashlib
  import http.client
  import json
  import os
  import shlex
  import socket
  import subprocess
  from pathlib import Path
  from urllib.parse import urlsplit

  contract = json.loads(Path("application-contract.json").read_text())
  wanted = contract["publication"]
  assert hashlib.sha256(Path(contract["controllerArtifact"]).read_bytes()).hexdigest() == wanted["sha256"]
  headers = {}
  if contract["authentication"]:
      import yaml
      token = yaml.safe_load(Path("credentials.yml").read_text())["reader_token"]
      assert isinstance(token, str) and token and all(33 <= ord(char) < 127 for char in token)
      headers = {"Authorization": "Bearer " + token}

  suffix = os.environ["DQ_NAMESPACE"].removeprefix("dq-")
  source = contract["sourceHost"] + "-" + suffix
  port = contract["port"]
  def addresses(host):
      return {item[4][0] for item in socket.getaddrinfo(host, port, type=socket.SOCK_STREAM)}

  identity_probe = '''
  import hashlib,json,sys
  from pathlib import Path
  process=json.loads(sys.argv[1])
  pid=Path(process["pidFile"]).read_text().strip()
  root=Path("/proc")/pid
  status=dict(line.split(":",1) for line in (root/"status").read_text().splitlines() if ":" in line)
  print(json.dumps({
      "pid":pid,"starttime":(root/"stat").read_text().rsplit(") ",1)[1].split()[19],
      "uid":status["Uid"].split(),"gid":status["Gid"].split(),"groups":status["Groups"].split(),
      "caps":{key:status[key].strip() for key in ("CapInh","CapPrm","CapEff","CapBnd","CapAmb")},
      "code":hashlib.sha256(Path(process["programPath"]).read_bytes()).hexdigest(),
      "command_sha256":hashlib.sha256((root/"cmdline").read_bytes()).hexdigest(),
  }))
  '''
  original = json.loads(Path("original-application-identities.json").read_text())
  process = contract["process"]
  remote = "/usr/bin/python3 -I -c " + shlex.quote(identity_probe) + " " + shlex.quote(json.dumps(process))
  for host, role in contract["roles"].items():
      address = host + "-" + suffix
      identity = json.loads(subprocess.check_output(
          ["ssh", "-n", "-o", "BatchMode=yes", "-o", "ConnectTimeout=3", "-p", "2222", "root@" + address, remote],
          timeout=5))
      baseline = original[host][process["name"]]
      fields = ("pid", "starttime", "uid", "gid", "groups", "caps", "code")
      assert all(identity[key] == baseline[key] for key in fields)
      command_bytes = chr(0).join(baseline["command"]).encode()
      assert identity["command_sha256"] == hashlib.sha256(command_bytes).hexdigest()
      connection = http.client.HTTPConnection(address, port, timeout=3)
      try:
          connection.request("GET", "/", headers=headers)
          response = connection.getresponse()
          assert response.status == 200
          observed = json.loads(response.read(65536))
      finally:
          connection.close()
      assert observed["ready"] is True and observed["role"] == role
      data = observed["data"]
      assert all(data.get(key) == value for key, value in wanted.items())
      if host == contract["sourceHost"]:
          assert data["origin"] == "local"
      else:
          origin = urlsplit(data["origin"])
          assert origin.scheme == "http" and origin.port == port and origin.hostname
          assert addresses(origin.hostname) & addresses(source)
      print(host + ": publication matches")
  VERIFY_PUBLICATION
  ```
debrief: Coordinaste entrega del artefacto verificado, acceso privado de aplicaciones y adopción por etapas entre
  la fuente y sus consumidores dependientes.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el resultado en cada host administrado.
diagnostics.application_identity_1: 'app1: Reiniciar o reemplazar aplicación puede cambiar PID, inicio, principal, grupos, capabilities, comando o bytes del programa; conserve identidad original y actualice entradas con SIGHUP. [Causa y comprobación](guides#guide=ansible-13&section=private-artifact-app1-identity)'
diagnostics.application_origin_1: 'app1: La respuesta fuente puede venir de otra implementación: publisher suministrado fija origin=local al leer archivo real. Conserve proceso/programa original y compare recibo vivo sin falsificar origin. [Causa y comprobación](guides#guide=ansible-13&section=private-artifact-app1-origin)'
diagnostics.application_observation_1: 'app1: SSH puede no devolver recibo legible, HTTP ser inalcanzable o fallar análisis capturado JSON/entradas durante observación del host; inspeccione proceso, configuración y endpoint. Deadline agotado y subprocess.TimeoutExpired usan marcador budget separado; HTTP socket timeout es error I/O capturado de observación. [Causa y comprobación](guides#guide=ansible-13&section=private-artifact-app1-observation)'
diagnostics.application_identity_2: 'app2: Reiniciar o reemplazar aplicación puede cambiar PID, inicio, principal, grupos, capabilities, comando o bytes del programa; conserve identidad original y actualice entradas con SIGHUP. [Causa y comprobación](guides#guide=ansible-13&section=private-artifact-app2-identity)'
diagnostics.application_origin_2: 'app2: La aplicación dependiente puede consumir otro host o endpoint legacy; su origin debe resolver a fuente app1 existente y usar puerto HTTP 8081. Se acepta alias DNS fuente o su IP. [Causa y comprobación](guides#guide=ansible-13&section=private-artifact-app2-origin)'
