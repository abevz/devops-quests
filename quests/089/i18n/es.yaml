title: Entrega segura de artefactos
brief: "La flota no entrega la versión solicitada.\n\nTrabaja en la workstation en `~/quest` con `inventory.ini`,\
  \ `ansible.cfg`, `release.txt`, `rollout.yml`. Archivos adicionales en la estación de trabajo, en `~/quest`: `credentials.yml`,\
  \ `application-contract.json`, `provided-application.py`, `original-application-identities.json`.\n\n**Requisitos:**\n\
  - Archivo en cada host administrado (`app1`, `app2`, `app3`):\n  - Ruta: `/srv/site/release.txt`.\n  - Contenido:\
  \ `release-89`.\n- Archivo en cada host administrado (`app1`, `app2`, `app3`):\n  - Ruta: `/srv/site/reader.token`.\n\
  \  - Contenido: la credencial sintética suministrada.\n  - Modo de acceso: `0600`.\n- En la estación de trabajo,\
  \ `release.txt` coincide con el recibo fiable de publicación de `application-contract.json`. Cada aplicación proporcionada\
  \ en los hosts administrados (`app1`, `app2`, `app3`) autentica la credencial sintética y sirve el artefacto aprobado\
  \ mediante HTTP `8081`, `/`; las aplicaciones dependientes lo consumen desde la fuente existente.\n- Conserva\
  \ los procesos, usuarios, grupos, capacidades, líneas de órdenes y bytes instalados originales de `original-application-identities.json`.\n\
  \nLa comprobación observa los resultados actuales; no establece todo el historial de ejecución."
stages.0.brief: Cada host administrado debe tener la versión solicitada y una credencial privada de lectura.
stages.0.objectives.0.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/release.txt` contiene
  `release-89`. El artefacto del controlador y las aplicaciones autenticadas activas también coinciden con el recibo
  fiable, conservando sus identidades originales.
stages.0.objectives.1.text: En cada host gestionado (`app1`, `app2`, `app3`), `/srv/site/reader.token` contiene
  la credencial sintética suministrada.
stages.0.objectives.2.text: En cada host administrado (`app1`, `app2`, `app3`), `/srv/site/reader.token` tiene el
  modo `0600`.
hints.0.text: Integridad del artefacto, acceso privado del destinatario y adopción activa forman una cadena de entrega.
  Observa la disponibilidad de la fuente antes de propagar a aplicaciones dependientes.
hints.1.text: Compara `release.txt`, `credentials.yml`, `application-contract.json` y `provided-application.py`.
  Revisa propietarios y permisos de destino, usuarios de los procesos, capacidades del operador, registros y estado
  HTTP autenticado. No muestres credenciales en diagnósticos.
hints.2.text: 'Prepara contenido sensible y permisos restrictivos antes de transferir la propiedad al destinatario.
  Activa la fuente con su usuario original y verifica su publicación autenticada antes de activar dependientes.
  Ejecuta `ansible-playbook --diff rollout.yml`. Confirma permisos `0600` en `/srv/site/reader.token` de cada host.
  Carga `credentials.yml` con Python y construye HTTP Authorization en memoria: todos los puntos de acceso proporcionados
  en `8081` deben devolver versión, SHA-256 y generación aprobados conservando la identidad del proceso.'
debrief: Coordinaste entrega del artefacto verificado, acceso privado de aplicaciones y adopción por etapas entre
  la fuente y sus consumidores dependientes.
phrases.0: Verifiqué el estado de ejecución antes de realizar un cambio.
phrases.1: Encontré la causa y cambié una cosa a la vez.
phrases.2: Verifiqué el resultado en cada host administrado.
