title: Secure artifact delivery
brief: 'You joined SignalRail operations. Deliver a verified route manifest with private credentials.
  Work in ~/quest. Keep all changes inside this training bay.


  Inputs in `~/quest`: `inventory.ini`, `ansible.cfg`, `release.txt`, `rollout.yml`.


  The bay has no Internet or external DNS. Use only its supplied files, preloaded images and private services.
  All changes must stay inside this bay.


  Initial success criteria: All three hosts have release.txt containing release-89 and reader.token containing
  the supplied game-only credential, mode 0600.'
stages.0.brief: 'Deliver release-89 and a game-only reader credential with mode 0600. Inspect the managed
  state, not the log text.


  Success criteria: All three hosts have release.txt containing release-89 and reader.token containing
  the supplied game-only credential, mode 0600.'
stages.0.objectives.0.text: All three hosts have release.txt containing release-89 and reader.token containing
  the supplied game-only credential, mode 0600.
hints.0.text: Compare the delivered artifact and credential mode on each host.
hints.1.text: The release must be release-89 and the credential must not be world-readable.
hints.2.text: Correct the source artifact and use mode 0600 with no_log on credential delivery.
debrief: The release artifact was wrong and credential permissions were too broad. You delivered release-89
  and verified mode 0600 on each managed credential.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I verified the result on every managed host.
