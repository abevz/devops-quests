title: Secure artifact delivery
brief: "The fleet is not delivering the requested release.\n\nWork on the workstation in `~/quest` with `inventory.ini`,\
  \ `ansible.cfg`, `release.txt`, `rollout.yml`. Additional files on the workstation in `~/quest`: `credentials.yml`,\
  \ `application-contract.json`, `provided-application.py`, `original-application-identities.json`.\n\n**Requirements:**\n\
  - File on every managed host (`app1`, `app2`, `app3`):\n  - Path: `/srv/site/release.txt`.\n  - Content: `release-89`.\n\
  - File on every managed host (`app1`, `app2`, `app3`):\n  - Path: `/srv/site/reader.token`.\n  - Content: the\
  \ supplied synthetic credential.\n  - Access mode: `0600`.\n- On the workstation, `release.txt` matches the trusted\
  \ publication receipt in `application-contract.json`. Every supplied application on the managed hosts (`app1`,\
  \ `app2`, `app3`) authenticates the supplied synthetic credential and serves the approved artifact on HTTP `8081`,\
  \ `/`; dependent applications consume the existing source.\n- Preserve the application processes, principals,\
  \ groups, capabilities, command lines and installed program bytes recorded in `original-application-identities.json`.\n\
  \nThe check observes current results; it does not establish the full execution history."
stages.0.brief: Every managed host must have the requested release and a private access credential.
stages.0.objectives.0.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/release.txt` contains `release-89`.
  The controller artifact and live authenticated applications also match the trusted publication receipt, with the
  original application identities retained.
stages.0.objectives.1.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/reader.token` contains the
  supplied synthetic credential.
stages.0.objectives.2.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/reader.token` has mode `0600`.
hints.0.text: Artifact integrity, private recipient access and live adoption form one delivery chain. Observe source
  readiness before propagating to dependent applications.
hints.1.text: Compare `release.txt`, `credentials.yml`, `application-contract.json` and `provided-application.py`.
  Inspect target ownership and permissions, process principals, operator capabilities, application logs and authenticated
  HTTP status. Keep credential values out of diagnostic output.
hints.2.text: 'Prepare sensitive content and restrictive mode before transferring ownership to its recipient. Activate
  the source under its original principal and verify its authenticated publication before activating dependents.
  Run `ansible-playbook --diff rollout.yml`. Confirm mode `0600` for `/srv/site/reader.token` on every host. Load
  `credentials.yml` in Python and build HTTP Authorization in memory: all supplied endpoints on `8081` must return
  the approved release, SHA-256 and generation without changing process identity.'
debrief: You coordinated verified artifact delivery, private application access and staged adoption across the source
  and its dependent consumers.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I verified the result on every managed host.
diagnostics.application_identity_1: 'app1: Restarting or replacing the supplied application may change its PID, start time, principal, groups, capabilities, command or installed program bytes; preserve its original identity and refresh inputs with SIGHUP instead. [Cause and check](guides#guide=ansible-13&section=private-artifact-app1-identity)'
diagnostics.application_origin_1: 'app1: The source response may come from a different implementation: the supplied publisher sets origin to local when reading its actual source file. Preserve its original process/program and compare the live receipt rather than forging an origin field. [Cause and check](guides#guide=ansible-13&section=private-artifact-app1-origin)'
diagnostics.application_observation_1: 'app1: SSH may not return a readable process receipt, HTTP may be unreachable or caught JSON/input parsing may fail during this host observation; inspect its existing process, configuration and endpoint. Expired deadlines and subprocess.TimeoutExpired use the separate budget marker; an HTTP socket timeout is a caught I/O observation error. [Cause and check](guides#guide=ansible-13&section=private-artifact-app1-observation)'
diagnostics.application_identity_2: 'app2: Restarting or replacing the supplied application may change its PID, start time, principal, groups, capabilities, command or installed program bytes; preserve its original identity and refresh inputs with SIGHUP instead. [Cause and check](guides#guide=ansible-13&section=private-artifact-app2-identity)'
diagnostics.application_origin_2: 'app2: The dependent application may consume another host or the legacy endpoint; its reported origin must resolve to the existing app1 source and use HTTP port 8081. A source DNS alias or its IP can satisfy this observation. [Cause and check](guides#guide=ansible-13&section=private-artifact-app2-origin)'
diagnostics.application_observation_2: 'app2: SSH may not return a readable process receipt, HTTP may be unreachable or caught JSON/input parsing may fail during this host observation; inspect its existing process, configuration and endpoint. Expired deadlines and subprocess.TimeoutExpired use the separate budget marker; an HTTP socket timeout is a caught I/O observation error. [Cause and check](guides#guide=ansible-13&section=private-artifact-app2-observation)'
diagnostics.application_identity_3: 'app3: Restarting or replacing the supplied application may change its PID, start time, principal, groups, capabilities, command or installed program bytes; preserve its original identity and refresh inputs with SIGHUP instead. [Cause and check](guides#guide=ansible-13&section=private-artifact-app3-identity)'
diagnostics.application_origin_3: 'app3: The dependent application may consume another host or the legacy endpoint; its reported origin must resolve to the existing app1 source and use HTTP port 8081. A source DNS alias or its IP can satisfy this observation. [Cause and check](guides#guide=ansible-13&section=private-artifact-app3-origin)'
diagnostics.application_observation_3: 'app3: SSH may not return a readable process receipt, HTTP may be unreachable or caught JSON/input parsing may fail during this host observation; inspect its existing process, configuration and endpoint. Expired deadlines and subprocess.TimeoutExpired use the separate budget marker; an HTTP socket timeout is a caught I/O observation error. [Cause and check](guides#guide=ansible-13&section=private-artifact-app3-observation)'
diagnostics.controller_artifact: The supplied controller release.txt initially contains the wrong release; copying it unchanged cannot produce the approved artifact. Restore the publication bytes, including the final newline, and compare the actual file hash with the frozen publication receipt. [Cause and check](guides#guide=ansible-13&section=private-artifact-trusted-controller-content)
diagnostics.application_budget: DNS, SSH process observations or authenticated application requests may exhaust the shared Python budget of ten seconds; inspect the existing endpoints and private-input accessibility. The earlier eight-second legacy SSH group has a separate outer fallback. [Cause and check](guides#guide=ansible-13&section=private-artifact-bounded-authenticated-observation)
diagnostics.application_observation: The controller artifact, frozen contract or supplied credential structure may be unreadable, or source DNS may fail before entering a host; inspect the given input paths and variable names without printing credentials. Caught input and command errors at this phase share this marker. [Cause and check](guides#guide=ansible-13&section=private-artifact-global-private-inputs)
diagnostics.probe_0_0: 'The earlier SSH release group may stop before a named result, or helper/YAML loading or an unexpected metadata shape may abort the authenticated observer. Correct the legacy release files first: their failed group skips application checks; ordinary named host failures retain their own diagnostics. [Cause and check](guides#guide=ansible-13&section=private-artifact-legacy-and-unhandled-inputs)'
diagnostics.release_1: 'app1: The target may retain its retired artifact, or the wrong controller release may have been copied; verify release.txt against the publication receipt before delivering release-89. SSH read failures also report this marker. [Cause and check](guides#guide=ansible-13&section=private-artifact-app1-release)'
diagnostics.token_1: 'app1: The target may still contain the retired credential, a wrong variable or extra spaces; deliver the supplied credential to the existing file without exposing it in logs. The shell comparison removes trailing line feeds; SSH read errors also use this marker. [Cause and check](guides#guide=ansible-13&section=private-artifact-app1-token)'
diagnostics.token_mode_1: 'app1: The supplied credential file starts with public mode 0644, or a copy may retain that default; set its mode explicitly to 0600. Mode is checked separately from whether the original application principal can read the file. [Cause and check](guides#guide=ansible-13&section=private-artifact-app1-token-mode)'
diagnostics.application_ready_1: 'app1: The application may reject a retired credential or be unable to read a root-owned 0600 file, or still cache the wrong artifact/upstream. Keep the private file readable by the original principal, repair source inputs and authenticate the publication after signaling the same PID. [Cause and check](guides#guide=ansible-13&section=private-artifact-app1-ready)'
