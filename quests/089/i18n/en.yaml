title: Secure artifact delivery
brief: |-
  The fleet is not delivering the requested release.

  Work on the workstation in `~/quest` with `inventory.ini`, `ansible.cfg`, `release.txt`, `rollout.yml`.

  **Requirements:**
  - File on every managed host (`app1`, `app2`, `app3`):
    - Path: `/srv/site/release.txt`.
    - Content: `release-89`.
  - File on every managed host (`app1`, `app2`, `app3`):
    - Path: `/srv/site/reader.token`.
    - Content: `game-only-reader`.
    - Access mode: `0600`.

  **Verify yourself before Check & finish:**
  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'test "$(cat /srv/site/reader.token)" = game-only-reader && printf "credential matches\n"'` — Every host confirms `credential matches` without printing the credential.
  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'ls -l /srv/site/reader.token; if runuser -u nobody -- cat /srv/site/reader.token >/dev/null 2>&1; then exit 1; else printf "unprivileged read denied\n"; fi'` — Every host shows `-rw-------` and confirms `unprivileged read denied` for user `nobody`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'cat /srv/site/release.txt'` — Shows `release-89` from `app1`, `app2`, `app3`.
stages.0.brief: Every managed host must have the requested release and a private access credential.
stages.0.objectives.0.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/release.txt` contains `release-89`.
stages.0.objectives.1.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/reader.token` contains `game-only-reader`.
stages.0.objectives.2.text: On every managed host (`app1`, `app2`, `app3`), `/srv/site/reader.token` has mode `0600`.
hints.0.text: Release identity and credential privacy are independent outcomes.
hints.1.text: The release must be release-89 and the credential must not be world-readable.
hints.2.text: Correct the source artifact and use mode 0600 with no_log on credential delivery.
debrief: The release artifact was wrong and credential permissions were too broad. You delivered release-89 and
  verified mode 0600 on each managed credential.
phrases.0: I checked the running state before making a change.
phrases.1: I found the cause and changed one thing at a time.
phrases.2: I verified the result on every managed host.
