diagnostics.controller_artifact: Die gelieferte release.txt des Controllers enthält zunächst das falsche Release; unverändert zu kopieren liefert kein freigegebenes Artefakt. Stellen Sie Veröffentlichungsbytes einschließlich abschließendem Zeilenumbruch her und vergleichen Sie den tatsächlichen Datei-Hash mit dem eingefrorenen Beleg. [Ursache und Prüfung](guides#guide=ansible-13&section=private-artifact-trusted-controller-content)
diagnostics.application_budget: DNS, SSH-Prozessbeobachtungen oder authentifizierte Anwendungsanfragen schöpfen möglicherweise das gemeinsame Python-Budget von zehn Sekunden aus; prüfen Sie bestehende Endpunkte und private Eingabezugriffe. Die frühere achtsekündige Legacy-SSH-Gruppe hat einen separaten äußeren Fallback. [Ursache und Prüfung](guides#guide=ansible-13&section=private-artifact-bounded-authenticated-observation)
diagnostics.application_observation: Controller-Artefakt, eingefrorener Vertrag oder gelieferte Credential-Struktur sind möglicherweise unlesbar oder Quell-DNS scheitert vor dem Eintritt in einen Host; prüfen Sie Eingabepfade und Variablennamen ohne Credentials auszugeben. Abgefangene Eingabe- und Befehlsfehler dieser Phase teilen diesen Marker. [Ursache und Prüfung](guides#guide=ansible-13&section=private-artifact-global-private-inputs)
diagnostics.probe_0_0: 'Die frühere SSH-Release-Gruppe endet möglicherweise vor einem benannten Ergebnis oder Helper-/YAML-Laden beziehungsweise eine unerwartete Metadatenform brechen den authentifizierten Observer ab. Korrigieren Sie zuerst die Legacy-Release-Dateien: ihre fehlerhafte Gruppe überspringt Anwendungsprüfungen; benannte Hostfehler behalten eigene Diagnosen. [Ursache und Prüfung](guides#guide=ansible-13&section=private-artifact-legacy-and-unhandled-inputs)'
diagnostics.release_1: 'app1: Das Ziel hält möglicherweise noch sein altes Artefakt oder erhielt das falsche Controller-Release; prüfen Sie release.txt gegen den Veröffentlichungsbeleg vor Auslieferung von release-89. SSH-Lesefehler melden denselben Marker. [Ursache und Prüfung](guides#guide=ansible-13&section=private-artifact-app1-release)'
diagnostics.token_1: 'app1: Das Ziel enthält möglicherweise noch das alte Credential, eine falsche Variable oder zusätzliche Leerzeichen; liefern Sie das gelieferte Credential an die vorhandene Datei ohne Offenlegung im Log. Der Shell-Vergleich entfernt abschließende Zeilenumbrüche; SSH-Lesefehler nutzen denselben Marker. [Ursache und Prüfung](guides#guide=ansible-13&section=private-artifact-app1-token)'
diagnostics.token_mode_1: 'app1: Die gelieferte Credential-Datei beginnt mit öffentlichem Mode 0644 oder ein Kopieren erhält diesen Standard; setzen Sie den Mode ausdrücklich auf 0600. Der Mode wird getrennt vom Lesezugriff des ursprünglichen Anwendungsprincipals geprüft. [Ursache und Prüfung](guides#guide=ansible-13&section=private-artifact-app1-token-mode)'
diagnostics.application_ready_1: 'app1: Die Anwendung lehnt möglicherweise ein altes Credential ab, kann eine root gehörende 0600 Datei nicht lesen oder hält ein falsches Artefakt/Upstream im Cache. Erhalten Sie privaten Lesezugriff für den ursprünglichen Principal, korrigieren Sie Quelleneingaben und authentifizieren Sie die Veröffentlichung nach Signal an dieselbe PID. [Ursache und Prüfung](guides#guide=ansible-13&section=private-artifact-app1-ready)'
