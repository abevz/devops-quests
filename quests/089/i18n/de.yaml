title: Sichere Lieferung von Artefakten
brief: |-
  Die Flotte liefert die angeforderte Version nicht aus.

  Arbeite auf der Workstation in `~/quest` mit `inventory.ini`, `ansible.cfg`, `release.txt`, `rollout.yml`.

  **Anforderungen:**
  - Datei auf jedem verwalteten Host (`app1`, `app2`, `app3`):
    - Pfad: `/srv/site/release.txt`.
    - Inhalt: `release-89`.
  - Datei auf jedem verwalteten Host (`app1`, `app2`, `app3`):
    - Pfad: `/srv/site/reader.token`.
    - Inhalt: die bereitgestellten synthetischen Zugangsdaten.
    - Zugriffsmodus: `0600`.

  Die Prüfung beobachtet aktuelle Ergebnisse; sie belegt nicht die vollständige Ausführungshistorie.
stages.0.brief: Jeder verwaltete Host muss die angeforderte Version und vertrauliche Leser-Zugangsdaten
  haben.
stages.0.objectives.0.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/release.txt`
  den Inhalt `release-89`.
stages.0.objectives.1.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/reader.token`
  die bereitgestellten synthetischen Zugangsdaten.
stages.0.objectives.2.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) hat `/srv/site/reader.token`
  den Modus `0600`.
hints.0.text: Versionsidentität und Vertraulichkeit der Zugangsdaten sind unabhängige Ergebnisse.
hints.1.text: |-
  Die Version muss release-89 lauten, und die Zugangsdaten dürfen nicht für alle lesbar sein.

  Prüfen Sie Inventory und das bereitgestellte Playbook auf der Workstation:

  ```sh
  ansible-inventory -i inventory.ini --graph
  cat rollout.yml
  ```
hints.2.text: |-
  Korrigieren Sie das Quellartefakt und verwenden Sie bei der Auslieferung der Zugangsdaten den Modus 0600 mit no_log.

  Prüfen Sie das Ergebnis in `~/quest` auf der Workstation:

  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'test "$(cat /srv/site/reader.token)" = game-only-reader && printf "credential matches\n"'` — Jeder Host bestätigt `credential matches`, ohne die Zugangsdaten auszugeben.
  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'ls -l /srv/site/reader.token; if runuser -u nobody -- cat /srv/site/reader.token >/dev/null 2>&1; then exit 1; else printf "unprivileged read denied\n"; fi'` — Jeder Host zeigt `-rw-------` und bestätigt `unprivileged read denied` für Benutzer `nobody`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'cat /srv/site/release.txt'` — Zeigt `release-89` von `app1`, `app2`, `app3`.
debrief: Das Release-Artefakt war falsch und die credential-Berechtigungen waren zu weit gefasst. Sie
  haben release-89 bereitgestellt und den Modus 0600 auf jedem verwalteten credential überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe das Ergebnis auf jedem verwalteten Host überprüft.
