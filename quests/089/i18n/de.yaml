title: Sichere Lieferung von Artefakten
brief: "Die Flotte liefert die angeforderte Version nicht aus.\n\nArbeite auf der Workstation in `~/quest` mit `inventory.ini`,\
  \ `ansible.cfg`, `release.txt`, `rollout.yml`. Zusätzliche Dateien auf der Workstation in `~/quest`: `credentials.yml`,\
  \ `application-contract.json`, `provided-application.py`, `original-application-identities.json`.\n\n**Anforderungen:**\n\
  - Datei auf jedem verwalteten Host (`app1`, `app2`, `app3`):\n  - Pfad: `/srv/site/release.txt`.\n  - Inhalt:\
  \ `release-89`.\n- Datei auf jedem verwalteten Host (`app1`, `app2`, `app3`):\n  - Pfad: `/srv/site/reader.token`.\n\
  \  - Inhalt: die bereitgestellten synthetischen Zugangsdaten.\n  - Zugriffsmodus: `0600`.\n- Auf der Workstation\
  \ entspricht `release.txt` dem vertrauenswürdigen Publikationsbeleg in `application-contract.json`. Jede bereitgestellte\
  \ Anwendung auf den verwalteten Hosts (`app1`, `app2`, `app3`) authentifiziert den synthetischen Zugangswert und\
  \ liefert das freigegebene Artefakt über HTTP `8081`, `/`; abhängige Anwendungen beziehen es aus der bestehenden\
  \ Quelle.\n- Bewahre die Anwendungsprozesse, Benutzer, Gruppen, Capabilities, Befehlszeilen und installierten\
  \ Programmbytes aus `original-application-identities.json`.\n\nDie Prüfung beobachtet aktuelle Ergebnisse; sie\
  \ belegt nicht die vollständige Ausführungshistorie."
stages.0.brief: Jeder verwaltete Host muss die angeforderte Version und vertrauliche Leser-Zugangsdaten haben.
stages.0.objectives.0.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/release.txt`
  den Inhalt `release-89`. Controller-Artefakt und laufende authentifizierte Anwendungen entsprechen auch dem vertrauenswürdigen
  Publikationsbeleg; ursprüngliche Anwendungsidentitäten bleiben erhalten.
stages.0.objectives.1.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) enthält `/srv/site/reader.token`
  die bereitgestellten synthetischen Zugangsdaten.
stages.0.objectives.2.text: Auf jedem verwalteten Host (`app1`, `app2`, `app3`) hat `/srv/site/reader.token` den
  Modus `0600`.
hints.0.text: Artefaktintegrität, privater Empfängerzugriff und Übernahme durch laufende Anwendungen bilden eine
  Auslieferungskette. Beobachte die Bereitschaft der Quelle vor der Weitergabe an abhängige Anwendungen.
hints.1.text: |-
  Vergleiche `release.txt`, `credentials.yml`, `application-contract.json` und `provided-application.py`. Prüfe Eigentum und Rechte der Zieldateien, Prozessbenutzer, Operator-Befugnisse, Anwendungsprotokolle und authentifizierten HTTP-Status. Gib keine Zugangswerte in Diagnosen aus.

  Prüfe die Aufgaben zum Kopieren privater Daten und vergleiche die Metadaten mit den ursprünglichen Prozessbenutzern. Suche in der Topologie nach Quelle und abhängigen Anwendungen und vergleiche ihre aktuellen authentifizierten Antwortstatus.
hints.2.text: |-
  Führe `ansible-playbook rollout.yml` aus. Bestätige Modus `0600` für `/srv/site/reader.token` auf jedem Host. Lade `credentials.yml` in Python und erzeuge HTTP Authorization im Speicher: Alle bereitgestellten Endpunkte an `8081` müssen freigegebene Version, SHA-256 und Generation ohne Änderung der Prozessidentität liefern.

  ```sh
  ansible-playbook rollout.yml
  ansible fleet -i inventory.ini -m ansible.builtin.stat -a 'path=/srv/site/reader.token get_checksum=false'
  python3 -I - <<'VERIFY_PUBLICATION'
  import hashlib
  import http.client
  import json
  import os
  import shlex
  import socket
  import subprocess
  from pathlib import Path
  from urllib.parse import urlsplit

  contract = json.loads(Path("application-contract.json").read_text())
  wanted = contract["publication"]
  assert hashlib.sha256(Path(contract["controllerArtifact"]).read_bytes()).hexdigest() == wanted["sha256"]
  headers = {}
  if contract["authentication"]:
      import yaml
      token = yaml.safe_load(Path("credentials.yml").read_text())["reader_token"]
      assert isinstance(token, str) and token and all(33 <= ord(char) < 127 for char in token)
      headers = {"Authorization": "Bearer " + token}

  suffix = os.environ["DQ_NAMESPACE"].removeprefix("dq-")
  source = contract["sourceHost"] + "-" + suffix
  port = contract["port"]
  def addresses(host):
      return {item[4][0] for item in socket.getaddrinfo(host, port, type=socket.SOCK_STREAM)}

  identity_probe = '''
  import hashlib,json,sys
  from pathlib import Path
  process=json.loads(sys.argv[1])
  pid=Path(process["pidFile"]).read_text().strip()
  root=Path("/proc")/pid
  status=dict(line.split(":",1) for line in (root/"status").read_text().splitlines() if ":" in line)
  print(json.dumps({
      "pid":pid,"starttime":(root/"stat").read_text().rsplit(") ",1)[1].split()[19],
      "uid":status["Uid"].split(),"gid":status["Gid"].split(),"groups":status["Groups"].split(),
      "caps":{key:status[key].strip() for key in ("CapInh","CapPrm","CapEff","CapBnd","CapAmb")},
      "code":hashlib.sha256(Path(process["programPath"]).read_bytes()).hexdigest(),
      "command_sha256":hashlib.sha256((root/"cmdline").read_bytes()).hexdigest(),
  }))
  '''
  original = json.loads(Path("original-application-identities.json").read_text())
  process = contract["process"]
  remote = "/usr/bin/python3 -I -c " + shlex.quote(identity_probe) + " " + shlex.quote(json.dumps(process))
  for host, role in contract["roles"].items():
      address = host + "-" + suffix
      identity = json.loads(subprocess.check_output(
          ["ssh", "-n", "-o", "BatchMode=yes", "-o", "ConnectTimeout=3", "-p", "2222", "root@" + address, remote],
          timeout=5))
      baseline = original[host][process["name"]]
      fields = ("pid", "starttime", "uid", "gid", "groups", "caps", "code")
      assert all(identity[key] == baseline[key] for key in fields)
      command_bytes = chr(0).join(baseline["command"]).encode()
      assert identity["command_sha256"] == hashlib.sha256(command_bytes).hexdigest()
      connection = http.client.HTTPConnection(address, port, timeout=3)
      try:
          connection.request("GET", "/", headers=headers)
          response = connection.getresponse()
          assert response.status == 200
          observed = json.loads(response.read(65536))
      finally:
          connection.close()
      assert observed["ready"] is True and observed["role"] == role
      data = observed["data"]
      assert all(data.get(key) == value for key, value in wanted.items())
      if host == contract["sourceHost"]:
          assert data["origin"] == "local"
      else:
          origin = urlsplit(data["origin"])
          assert origin.scheme == "http" and origin.port == port and origin.hostname
          assert addresses(origin.hostname) & addresses(source)
      print(host + ": publication matches")
  VERIFY_PUBLICATION
  ```
debrief: Du hast geprüfte Artefaktauslieferung, privaten Anwendungszugriff und gestaffelte Übernahme durch Quelle
  und abhängige Verbraucher koordiniert.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe das Ergebnis auf jedem verwalteten Host überprüft.
diagnostics.application_identity_1: 'app1: Neustart oder Ersatz der gelieferten Anwendung können PID, Startzeit, Principal, Gruppen, Capabilities, Befehl oder installierte Programmbytes ändern; erhalten Sie ihre ursprüngliche Identität und aktualisieren Sie Eingaben mit SIGHUP. [Ursache und Prüfung](guides#guide=ansible-13&section=private-artifact-app1-identity)'
diagnostics.application_origin_1: 'app1: Die Quellantwort stammt möglicherweise aus einer anderen Implementierung: der gelieferte Publisher setzt beim Lesen der tatsächlichen Quelldatei origin auf local. Erhalten Sie ursprünglichen Prozess/Programm und vergleichen Sie den aktuellen Beleg, statt ein Origin-Feld vorzutäuschen. [Ursache und Prüfung](guides#guide=ansible-13&section=private-artifact-app1-origin)'
diagnostics.application_observation_1: 'app1: SSH liefert möglicherweise keinen lesbaren Prozessbeleg, HTTP ist unerreichbar oder abgefangenes JSON-/Eingabeparsen scheitert bei dieser Host-Beobachtung; prüfen Sie bestehenden Prozess, Konfiguration und Endpunkt. Abgelaufene Deadlines und subprocess.TimeoutExpired nutzen den separaten Budgetmarker; ein HTTP Socket-Timeout ist ein abgefangener I/O-Beobachtungsfehler. [Ursache und Prüfung](guides#guide=ansible-13&section=private-artifact-app1-observation)'
diagnostics.application_identity_2: 'app2: Neustart oder Ersatz der gelieferten Anwendung können PID, Startzeit, Principal, Gruppen, Capabilities, Befehl oder installierte Programmbytes ändern; erhalten Sie ihre ursprüngliche Identität und aktualisieren Sie Eingaben mit SIGHUP. [Ursache und Prüfung](guides#guide=ansible-13&section=private-artifact-app2-identity)'
diagnostics.application_origin_2: 'app2: Die abhängige Anwendung nutzt möglicherweise einen anderen Host oder den Legacy-Endpunkt; ihr gemeldeter Origin muss zur bestehenden app1 Quelle auflösen und HTTP-Port 8081 nutzen. Ein Quell-DNS-Alias oder ihre IP kann diese Beobachtung erfüllen. [Ursache und Prüfung](guides#guide=ansible-13&section=private-artifact-app2-origin)'
