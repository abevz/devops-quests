title: Sichere Lieferung von Artefakten
brief: 'Sie sind dem Betrieb SignalRail beigetreten. Stellen Sie ein verifiziertes route-Manifest mit
  privaten Anmeldeinformationen bereit. Arbeiten Sie in ~/quest.. Bewahren Sie alle Änderungen in diesem
  Schulungsbereich auf.


  Eingaben in `~/quest`: `inventory.ini`, `ansible.cfg`, `release.txt`, `rollout.yml`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur die bereitgestellten Dateien,
  vorinstallierten Bilder und privaten Dienste. Alle Änderungen müssen innerhalb dieser Bucht bleiben.


  Anfängliche Erfolgskriterien: Alle drei Hosts verfügen über release.txt mit release-89 und reader.token
  mit dem mitgelieferten, nur für Spiele vorgesehenen credential, Modus 0600.'
stages.0.brief: 'Stellen Sie release-89 und ein nur für Spiele verfügbares reader credential mit Modus
  0600 bereit. Überprüfen Sie den verwalteten Status, nicht den Protokolltext.


  Erfolgskriterien: Alle drei Hosts verfügen über release.txt mit release-89 und reader.token mit dem
  mitgelieferten, nur für Spiele verfügbaren credential, Modus 0600.'
stages.0.objectives.0.text: Alle drei Hosts verfügen über release.txt mit release-89 und reader.token
  mit dem mitgelieferten, nur für Spiele verfügbaren credential, Modus 0600.
hints.0.text: Vergleichen Sie das gelieferte Artefakt und den credential-Modus auf jedem Host.
hints.1.text: Die Version muss release-89 lauten und die Version credential darf nicht weltweit lesbar
  sein.
hints.2.text: Korrigieren Sie das Quellartefakt und verwenden Sie den Modus 0600 mit no_log bei der Lieferung
  von credential.
debrief: Das Release-Artefakt war falsch und die credential-Berechtigungen waren zu weit gefasst. Sie
  haben release-89 bereitgestellt und den Modus 0600 auf jedem verwalteten credential überprüft.
phrases.0: Ich habe den Betriebsstatus überprüft, bevor ich eine Änderung vorgenommen habe.
phrases.1: Ich habe die Ursache gefunden und eine Sache nach der anderen geändert.
phrases.2: Ich habe das Ergebnis auf jedem verwalteten Host überprüft.
