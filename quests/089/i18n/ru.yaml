title: Безопасная доставка артефакта
brief: |-
  Флот не доставляет требуемый выпуск.

  Работайте на workstation в `~/quest` с файлами `inventory.ini`, `ansible.cfg`, `release.txt`, `rollout.yml`.

  **Требования:**
  - Файл на каждом управляемом хосте (`app1`, `app2`, `app3`):
    - Путь: `/srv/site/release.txt`.
    - Содержимое: `release-89`.
  - Файл на каждом управляемом хосте (`app1`, `app2`, `app3`):
    - Путь: `/srv/site/reader.token`.
    - Содержимое: предоставленные синтетические учётные данные.
    - Режим доступа: `0600`.

  Проверка наблюдает текущие результаты; она не устанавливает полную историю выполнения.
stages.0.brief: Каждый управляемый хост должен иметь требуемый выпуск и конфиденциальные учётные данные
  читателя.
stages.0.objectives.0.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/release.txt`
  содержит `release-89`.
stages.0.objectives.1.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/reader.token`
  содержит предоставленные синтетические учётные данные.
stages.0.objectives.2.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) путь `/srv/site/reader.token`
  имеет режим `0600`.
hints.0.text: Идентичность выпуска и конфиденциальность учётных данных — независимые результаты.
hints.1.text: |-
  Релиз должен быть release-89, а учётные данные не должны быть доступны для чтения всем.

  Изучите inventory и предоставленный плейбук на workstation:

  ```sh
  ansible-inventory -i inventory.ini --graph
  cat rollout.yml
  ```
hints.2.text: |-
  Исправьте исходный артефакт и используйте режим 0600 с no_log при доставке учётных данных.

  Проверьте результат из `~/quest` на workstation:

  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'test "$(cat /srv/site/reader.token)" = game-only-reader && printf "credential matches\n"'` — Каждый хост подтверждает `credential matches`, не печатая учётные данные.
  - `ansible fleet -i inventory.ini -m ansible.builtin.shell -a 'ls -l /srv/site/reader.token; if runuser -u nobody -- cat /srv/site/reader.token >/dev/null 2>&1; then exit 1; else printf "unprivileged read denied\n"; fi'` — Каждый хост показывает `-rw-------` и подтверждает `unprivileged read denied` для пользователя `nobody`.
  - `ansible fleet -i inventory.ini -m ansible.builtin.command -a 'cat /srv/site/release.txt'` — Показывает `release-89` от `app1`, `app2`, `app3`.
debrief: Артефакт релиза был неверным, права credential — избыточными. Вы доставили release-89 и проверили
  0600 на каждом хосте.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я проверил результат на каждом управляемом хосте.
