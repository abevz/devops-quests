title: Безопасная доставка артефакта
brief: "Флот не доставляет требуемый выпуск.\n\nРаботайте на workstation в `~/quest` с файлами `inventory.ini`,\
  \ `ansible.cfg`, `release.txt`, `rollout.yml`. Дополнительные файлы на рабочей станции в `~/quest`: `credentials.yml`,\
  \ `application-contract.json`, `provided-application.py`, `original-application-identities.json`.\n\n**Требования:**\n\
  - Файл на каждом управляемом хосте (`app1`, `app2`, `app3`):\n  - Путь: `/srv/site/release.txt`.\n  - Содержимое:\
  \ `release-89`.\n- Файл на каждом управляемом хосте (`app1`, `app2`, `app3`):\n  - Путь: `/srv/site/reader.token`.\n\
  \  - Содержимое: предоставленные синтетические учётные данные.\n  - Режим доступа: `0600`.\n- На рабочей станции\
  \ `release.txt` соответствует доверенной квитанции публикации из `application-contract.json`. Каждое предоставленное\
  \ приложение на управляемых узлах (`app1`, `app2`, `app3`) принимает заданный синтетический секрет и отдаёт утверждённый\
  \ артефакт по HTTP `8081`, `/`; зависимые приложения получают его от существующего источника.\n- Сохраните процессы\
  \ приложений, их учётные записи, группы, capabilities, командные строки и байты установленной программы из `original-application-identities.json`.\n\
  \nПроверка наблюдает текущие результаты; она не устанавливает полную историю выполнения."
stages.0.brief: Каждый управляемый хост должен иметь требуемый выпуск и конфиденциальные учётные данные читателя.
stages.0.objectives.0.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/release.txt` содержит
  `release-89`. Артефакт контроллера и работающие приложения с аутентификацией также соответствуют доверенной квитанции
  публикации; исходные идентичности приложений сохранены.
stages.0.objectives.1.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) файл `/srv/site/reader.token` содержит
  предоставленные синтетические учётные данные.
stages.0.objectives.2.text: На каждом управляемом хосте (`app1`, `app2`, `app3`) путь `/srv/site/reader.token` имеет
  режим `0600`.
hints.0.text: Целостность артефакта, приватный доступ получателя и принятие данных приложением образуют общую цепочку
  доставки. Наблюдайте готовность источника перед передачей зависимым приложениям.
hints.1.text: Сопоставьте `release.txt`, `credentials.yml`, `application-contract.json` и `provided-application.py`.
  Изучите владельцев и права целевых файлов, учётные записи процессов, полномочия оператора, журналы приложений
  и статус HTTP-аутентификации. Не выводите секрет в диагностику.
hints.2.text: 'Подготовьте чувствительное содержимое и ограниченные права до передачи владельца получателю. Активируйте
  источник от исходной учётной записи и проверьте аутентифицированную публикацию до активации зависимых приложений.
  Выполните `ansible-playbook --diff rollout.yml`. На каждом узле подтвердите режим `0600` у `/srv/site/reader.token`.
  Загружайте `credentials.yml` в Python и формируйте HTTP Authorization в памяти: все предоставленные сервисы на
  `8081` должны вернуть утверждённые выпуск, SHA-256 и поколение при неизменной идентичности процессов.'
debrief: Вы согласовали доставку проверенного артефакта, приватный доступ приложений и поэтапное принятие данных
  источником и зависимыми потребителями.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я проверил результат на каждом управляемом хосте.
diagnostics.application_identity_1: 'app1: Перезапуск или замена выданного приложения могут изменить PID, время старта, principal, группы, capabilities, команду или байты установленной программы; сохраните исходную идентичность и обновляйте входы через SIGHUP. [Причина и проверка](guides#guide=ansible-13&section=private-artifact-app1-identity)'
diagnostics.application_origin_1: 'app1: Ответ источника может поступать от другой реализации: выданный publisher задаёт origin=local при чтении реального файла. Сохраните исходный процесс/программу и сравните живую квитанцию, не подменяя поле origin. [Причина и проверка](guides#guide=ansible-13&section=private-artifact-app1-origin)'
diagnostics.application_observation_1: 'app1: SSH может не вернуть читаемую квитанцию процесса, HTTP быть недоступным, либо перехваченный разбор JSON/входов завершиться ошибкой при наблюдении хоста; изучите его процесс, конфигурацию и endpoint. Исчерпание deadline и subprocess.TimeoutExpired дают отдельный budget-маркер; HTTP socket timeout — перехваченная ошибка I/O-наблюдения. [Причина и проверка](guides#guide=ansible-13&section=private-artifact-app1-observation)'
diagnostics.application_identity_2: 'app2: Перезапуск или замена выданного приложения могут изменить PID, время старта, principal, группы, capabilities, команду или байты установленной программы; сохраните исходную идентичность и обновляйте входы через SIGHUP. [Причина и проверка](guides#guide=ansible-13&section=private-artifact-app2-identity)'
diagnostics.application_origin_2: 'app2: Зависимое приложение может читать другой хост или legacy endpoint; его origin разрешается в существующий источник app1 и использует HTTP-порт 8081. DNS-псевдоним источника или его IP допустимы. [Причина и проверка](guides#guide=ansible-13&section=private-artifact-app2-origin)'
