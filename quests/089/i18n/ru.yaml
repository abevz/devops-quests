title: Безопасная доставка артефакта
brief: 'Вы в команде эксплуатации SignalRail. Доставьте проверенный манифест с приватными учётными данными.
  Работайте в ~/quest. Все изменения — только в этой песочнице.


  Входные файлы в `~/quest`: `inventory.ini`, `ansible.cfg`, `release.txt`, `rollout.yml`.


  В песочнице нет интернета и внешнего DNS. Используйте только выданные файлы, предварительно загруженные
  образы и приватные сервисы. Все изменения — только в этой песочнице.


  Цели первого этапа: На всех трёх узлах release.txt содержит release-89, а reader.token — выданный учебный
  credential с режимом 0600.'
stages.0.brief: 'Доставьте release-89 и учебный credential с 0600. Проверяйте состояние хостов.


  Результат проверки: На всех трёх узлах release.txt содержит release-89, а reader.token — выданный учебный
  credential с режимом 0600.'
stages.0.objectives.0.text: На всех трёх узлах release.txt содержит release-89, а reader.token — выданный
  учебный credential с режимом 0600.
hints.0.text: Сравните доставленный артефакт и mode credential на каждом хосте.
hints.1.text: Релиз должен быть release-89, credential не должен читаться всеми.
hints.2.text: Исправьте исходный артефакт и используйте 0600 с no_log при доставке credential.
debrief: Артефакт релиза был неверным, права credential — избыточными. Вы доставили release-89 и проверили
  0600 на каждом хосте.
phrases.0: Я проверил фактическое состояние до изменения.
phrases.1: Я нашёл причину и менял по одному параметру.
phrases.2: Я проверил результат на каждом управляемом хосте.
