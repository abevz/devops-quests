diagnostics.controller_artifact: Выданный release.txt контроллера изначально содержит неверный релиз; копирование без исправления не создаёт одобренный артефакт. Восстановите байты публикации с завершающим переводом строки и сравните реальный хэш с зафиксированной квитанцией. [Причина и проверка](guides#guide=ansible-13&section=private-artifact-trusted-controller-content)
diagnostics.application_budget: DNS, SSH-наблюдение процессов или authenticated-запросы могут исчерпать общий десятисекундный бюджет Python; изучите существующие endpoints и доступ к приватным входам. Ранняя восьмисекундная legacy SSH-группа имеет отдельный внешний fallback. [Причина и проверка](guides#guide=ansible-13&section=private-artifact-bounded-authenticated-observation)
diagnostics.application_observation: Артефакт контроллера, зафиксированный contract или структура выданного credential могут не читаться, либо DNS источника не работать до входа в хост; изучите пути и имена переменных без вывода credentials. Перехваченные ошибки входов и команд этой фазы дают один маркер. [Причина и проверка](guides#guide=ansible-13&section=private-artifact-global-private-inputs)
diagnostics.probe_0_0: 'Ранняя SSH-группа релиза может оборваться до именованного результата, либо загрузка helpers/YAML и неожиданная структура metadata прервут authenticated observer. Сначала исправьте legacy-файлы релиза: сбой группы пропускает проверки приложений; именованные ошибки хостов сохраняют диагностику. [Причина и проверка](guides#guide=ansible-13&section=private-artifact-legacy-and-unhandled-inputs)'
diagnostics.release_1: 'app1: На цели мог остаться старый артефакт либо быть скопирован неверный релиз контроллера; проверьте release.txt по квитанции публикации до доставки release-89. Ошибки чтения через SSH дают тот же маркер. [Причина и проверка](guides#guide=ansible-13&section=private-artifact-app1-release)'
diagnostics.token_1: 'app1: На цели могли остаться старый credential, неверная переменная или лишние пробелы; доставьте выданный credential в существующий файл без вывода в логи. Shell-сравнение удаляет завершающие переводы строк; ошибки чтения SSH дают тот же маркер. [Причина и проверка](guides#guide=ansible-13&section=private-artifact-app1-token)'
diagnostics.token_mode_1: 'app1: Выданный credential-файл начинает с публичного mode 0644, либо copy сохраняет такой default; явно задайте mode 0600. Права проверяются отдельно от доступности файла исходному principal приложения. [Причина и проверка](guides#guide=ansible-13&section=private-artifact-app1-token-mode)'
diagnostics.application_ready_1: 'app1: Приложение может отвергать старый credential, не читать принадлежащий root файл 0600 либо хранить неверный артефакт/upstream. Сохраните доступ к приватному файлу исходному principal, исправьте источник и проверьте authenticated-публикацию после сигнала тому же PID. [Причина и проверка](guides#guide=ansible-13&section=private-artifact-app1-ready)'
