title: Recuperación de entrega
brief: 'La entrega tiene dos fallas independientes: el private Argo Application apunta a retired, y el
  workload confirmado hace referencia a una imagen private inexistente tag. Primero restaure manifests
  y demuestre que la confirmación inicial congelada es Synced; el Pod seguirá bloqueado. Luego repare
  la imagen en Git en immutable digest en private-release.json, confirme y envíe a la rama desechable
  main. Mantenga habilitados pull authentication y self-heal. Finalice solo cuando el nuevo compromiso
  observado, el manifest presionado, el container actual, el imageID, el registry autenticado y el HTTP
  north-80 estén de acuerdo.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `platform.env`, `registry-ca.crt`,
  `registry-pull.json`, `private-release.json`, `baseline-commit`, `application.json`, `release-commit`,
  `repository/manifests/board.json`, `repository/manifests/service.json`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos suministrados, imágenes precargadas
  y servicios private. Cambie sólo esta bahía.


  Criterios de éxito iniciales: el private Git revision es Synced de manifests y el workload conserva
  los extractos Always autenticados.'
debrief: La recuperación se unió a la intención private Git, registry identity y al comportamiento real
  de workload sin un parche solo en vivo.
stages.0.brief: 'Criterios de éxito: el private Git revision inicial es Synced de manifests y el workload
  conserva las extracciones de Always autenticadas.'
stages.0.objectives.0.text: El private Git revision inicial es Synced de manifests y el workload conserva
  los extractos autenticados de Always.
stages.1.brief: 'Criterios de éxito: un nuevo compromiso descendiente Git fija el private digest, Argo
  es Healthy, coincidencias reales de imageID y devoluciones de HTTP. north-80.'
stages.1.objectives.0.text: Un nuevo descendiente Git confirma el private digest congelado, Argo es Healthy,
  coincidencias reales de imageID y devoluciones de HTTP. north-80.
hints.0.text: Corrija la conciliación de fuentes antes de diagnosticar la recuperación de imágenes.
hints.1.text: Una confirmación Git puede ser Synced mientras su imagen tag no exista.
hints.2.text: Confirme el immutable digest suministrado, conserve el pull credentials y verifique tanto
  el Git como el imageID en ejecución.
phrases.0: Aislé el error en la ruta de origen de la recuperación de imágenes private.
phrases.1: Fijé y verifiqué la versión immutable en Git y en runtime.
phrases.2: Mantuve intactas la autenticación y la conciliación automática durante la recuperación.
questions.0.points.0: El manifest deseado puede hacer referencia a un tag faltante o mutable.
questions.0.points.1: Verifique el digest resuelto y el contenedor en ejecución imageID.
questions.0.points.2: Pruebe pull authentication y el comportamiento real de la aplicación.
questions.0.prompt: ¿Por qué Synced no prueba que se esté ejecutando la imagen deseada?
questions.1.points.0: Registre la solución deseada en el repositorio de origen.
questions.1.points.1: Mantenga la confirmación recuperada procedente del historial conocido.
questions.1.points.2: Verifique el revision, health observado y el endpoint real juntos.
questions.1.prompt: ¿Cómo se conserva una recuperación después de GitOps self-heal?
