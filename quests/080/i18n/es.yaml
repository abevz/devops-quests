diagnostics.probe_0_0: platform.env puede faltar, ser ilegible o inválido, o la observación terminar antes de resultado nombrado; compruebe sintaxis y variables sin imprimir credentials. Este fallback aparece solo si falla el grupo sin su propio marcador detallado. [Causa y comprobación](guides#guide=gitops-delivery&section=private-git-provided-input-startup)
