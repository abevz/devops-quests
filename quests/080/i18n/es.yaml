title: Recuperación de entrega
brief: 'Trabaja en `~/quest` con `platform.env`, `registry-ca.crt`, `private-release.json`, `baseline-commit`, `application.json`,
  `release-commit`, `repository/manifests/board.json`, `repository/manifests/service.json` y `registry-pull.json`. Argo CD
  compara de forma asíncrona una revisión Git con recursos activos. Primero configura Application `board` con el repositorio
  `GIT_URL`, ruta `manifests`, destino `main`, `selfHeal: true` y espera `Synced` en `baseline-commit`. El Deployment activo
  debe conservar exactamente `imagePullSecrets: [{name: registry-pull}]` e `imagePullPolicy: Always` del primer contenedor.


  Después confirma y envía un descendiente del baseline a `origin/main` privado; escribe su hash en `release-commit`. La primera
  imagen confirmada y la activa deben ser la imagen congelada de `private-release.json` y usar `Always`; el manifiesto confirmado
  debe conservar exactamente `registry-pull`. La Application debe estar `Synced` y `Healthy` en `release-commit`, con `selfHeal`
  y `prune` true. Espera el rollout de board y HTTP `north-80` en `board:8080`; el imageID de un Pod listo no terminante debe
  contener el digest congelado, y el acceso autenticado con `registry-ca.crt` y `platform.env` debe obtener ese digest. La
  comprobación no demuestra que el Secret de descarga activo no haya cambiado. Protege las credenciales y trabaja solo en
  la bahía sin conexión.'
debrief: La recuperación se unió a la intención private Git, registry identity y al comportamiento real de workload sin un
  parche solo en vivo.
stages.0.brief: El origen de Application, la sincronización base, self-heal y los ajustes activos de descarga coinciden con
  la descripción.
stages.0.objectives.0.text: El origen de Application, la sincronización base, self-heal y los ajustes activos de descarga
  coinciden con la descripción.
stages.1.brief: La revisión descendiente, estado de Application, campos de imagen Git y activa comprobados, acceso al registro
  y respuesta de board coinciden con la descripción.
stages.1.objectives.0.text: La revisión descendiente, estado de Application, campos de imagen Git y activa comprobados, acceso
  al registro y respuesta de board coinciden con la descripción.
hints.0.text: Corrija la conciliación de fuentes antes de diagnosticar la recuperación de imágenes.
hints.1.text: Una confirmación Git puede ser Synced mientras su imagen tag no exista.
hints.2.text: Confirme el immutable digest suministrado, conserve el pull credentials y verifique tanto el Git como el imageID
  en ejecución.
phrases.0: Aislé el error en la ruta de origen de la recuperación de imágenes private.
phrases.1: Fijé y verifiqué la versión immutable en Git y en runtime.
phrases.2: Mantuve intactas la autenticación y la conciliación automática durante la recuperación.
questions.0.points.0: El manifest deseado puede hacer referencia a un tag faltante o mutable.
questions.0.points.1: Verifique el digest resuelto y el contenedor en ejecución imageID.
questions.0.points.2: Pruebe pull authentication y el comportamiento real de la aplicación.
questions.0.prompt: ¿Por qué Synced no prueba que se esté ejecutando la imagen deseada?
questions.1.points.0: Registre la solución deseada en el repositorio de origen.
questions.1.points.1: Mantenga la confirmación recuperada procedente del historial conocido.
questions.1.points.2: Verifique el revision, health observado y el endpoint real juntos.
questions.1.prompt: ¿Cómo se conserva una recuperación después de GitOps self-heal?
diagnostics.repo: application/board repoURL debe ser igual a GIT_URL.
diagnostics.path: application/board source.path debe ser igual a manifests.
diagnostics.target: application/board targetRevision debe ser igual a main.
diagnostics.synced: application/board sync.status debe ser igual a Synced.
diagnostics.revision_exists: La revisión Git esperada debe existir y no estar vacía.
diagnostics.revision: La revisión sincronizada de application/board debe ser igual a la revisión Git esperada.
diagnostics.selfheal: application/board selfHeal debe ser igual a true.
diagnostics.health: application/board health.status debe ser igual a Healthy.
diagnostics.prune: application/board prune debe ser igual a true.
diagnostics.secrets: deployment/board imagePullSecrets debe ser igual a [registry-pull].
diagnostics.policy: deployment/board imagePullPolicy debe ser igual a Always.
diagnostics.rollout: El despliegue de deployment/board debe completarse.
diagnostics.http: La petición a board:8080 debe devolver north-80.
diagnostics.release_image: private-release.json image debe existir y no estar vacío.
diagnostics.fetch: git fetch origin main debe tener éxito.
diagnostics.origin: origin/main debe ser igual a release-commit.
diagnostics.changed: release-commit debe ser distinto de baseline-commit.
diagnostics.ancestor: baseline-commit debe ser antecesor de origin/main.
diagnostics.git_image: La primera imagen board en Git debe coincidir con la imagen de private-release.json.
diagnostics.git_policy: imagePullPolicy de board en Git debe ser Always.
diagnostics.git_secrets: imagePullSecrets de board en Git debe ser [registry-pull].
diagnostics.live_image: deployment/board containers[0].image debe ser igual a private-release.json image.
diagnostics.live_policy: deployment/board imagePullPolicy debe ser igual a Always.
diagnostics.image_id: Un Pod board no marcado para eliminación debe tener un contenedor listo cuyo imageID contenga el digest
  fijado.
diagnostics.registry: El registro autenticado debe servir el digest fijado.
