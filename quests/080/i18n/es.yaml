title: Recuperación de entrega
brief: "La versión privada no llega de forma fiable a los consumidores. La reconciliación y el artefacto en ejecución\
  \ deben coincidir.\n\nTrabaja en `~/quest` en la estación de trabajo. Entradas por etapa:\n- Etapa 1: `platform.env`,\
  \ `application.yaml`, `private-release.json`, `registry-pull.yaml`, `registry-ca.crt`, `repository/manifests/board.yaml`,\
  \ `repository/manifests/service.yaml`.\n- Etapa 2: `release-commit`.\n\n**Requisitos:**\n\n- Etapa 1:\n  - La\
  \ Application `board` informa `Synced` en la revisión publicada prevista. Restaura automáticamente las desviaciones.\n\
  \  - El Deployment `board` comprueba siempre su imagen al iniciar usando solo la credencial existente del registry\
  \ privado.\n- Etapa 2:\n  - La Application `board` informa `Synced` y `Healthy` en la revisión de la versión publicada.\
  \ Restaura automáticamente las desviaciones y elimina los recursos que ya no están en la versión deseada.\n  -\
  \ El `main` remoto coincide con `release-commit`, difiere del commit original y lo conserva como antecesor.\n\
  \  - El manifiesto de carga publicado usa la imagen congelada suministrada y conserva los requisitos de descarga\
  \ al inicio y acceso al registry privado.\n  - La imagen en ejecución de `board` coincide con la versión congelada\
  \ suministrada y se comprueba en cada inicio.\n  - El Deployment `board` completa su rollout.\n  - Un contenedor\
  \ listo de un Pod no terminante de la aplicación ejecuta el digest de la imagen congelada suministrada.\n  - El\
  \ acceso autenticado al registry privado sirve el digest de la versión congelada suministrada.\n  - Desde el Deployment\
  \ `board`, `http://board:8080` devuelve `north-80`.\n\nLa comprobación no demuestra que el Secret de descarga\
  \ en vivo no cambiara; la revisión actual, el digest del contenedor listo y el acceso autenticado al registry\
  \ son observaciones separadas."
debrief: La recuperación se unió a la intención private Git, registry identity y al comportamiento real de workload
  sin un parche solo en vivo.
stages.0.brief: Conserva la identidad de versión y las credenciales de descarga suministradas.
stages.1.brief: La versión descendiente publicada debe llegar a un consumidor listo.
hints.0.text: Corrija la conciliación de fuentes antes de diagnosticar la recuperación de imágenes.
hints.1.text: 'Una confirmación Git puede ser Synced mientras su imagen tag no exista.


  Inspecciona las definiciones suministradas, descripciones de recursos y eventos de la etapa correspondiente.


  ```sh

  git -C repository log --all --oneline

  kubectl describe application board

  kubectl describe deployment board

  kubectl describe pod -l app=board

  ```


  Etapa 1/2: Inspecciona estas definiciones de recursos para esta etapa.


  ```sh

  kubectl get application board -o yaml

  kubectl get deployment board -o yaml

  kubectl get pods -l app=board -o yaml

  ```


  Etapa 2: Inspecciona estas definiciones de recursos para esta etapa.


  ```sh

  git -C repository show origin/main:manifests/board.yaml

  ```'
hints.2.text: 'Confirme el immutable digest suministrado, conserve el pull credentials y verifique tanto el Git
  como el imageID en ejecución. Publica un commit descendiente en `origin/main` y registra su hash en `release-commit`.


  Verifica la etapa reparada y compara el resultado observado.


  Etapa 1/2: El controlador informa `Synced` en la revisión esperada; en la etapa final también informa `Healthy`
  y la carga está lista.


  ```sh

  kubectl get application board -o jsonpath=''{.status.sync.status} {.status.health.status} {.status.sync.revision}'';
  printf ''\n''

  kubectl get deployment board

  ```


  Etapa 2: El hash publicado coincide con la versión registrada; la comprobación de ascendencia, cuando existe,
  termina con código `0`.


  ```sh

  source platform.env

  cat release-commit

  git -C repository ls-remote origin refs/heads/main

  git -C repository merge-base --is-ancestor "$(cat baseline-commit)" origin/main

  ```


  Etapa 2: La aplicación devuelve `north-80`; la obtención autenticada del digest registrado del registry devuelve
  HTTP `200`.


  ```sh

  source platform.env

  kubectl exec deployment/board -- wget -qO- -T 3 http://board:8080

  printf ''\n''

  image=$(jq -r .image private-release.json)

  curl -fsS --max-time 4 --config <(printf ''user = "%s:%s"\n'' "$REGISTRY_USER" "$REGISTRY_PASSWORD") --cacert
  registry-ca.crt -H ''Accept: application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json''
  -o /dev/null -w ''%{http_code}\n'' "https://$REGISTRY/v2/parcel/manifests/${image##*@}"

  ```


  Observaciones esperadas para la etapa completa:

  - Etapa 1/2: La reconciliación, configuración de carga y observaciones de la imagen en ejecución mostradas cumplen
  los requisitos de esta etapa.

  - Etapa 2: El hash remoto coincide con `release-commit`, el manifiesto cumple los requisitos y la comprobación
  de ascendencia termina con código `0` con un hash de versión diferente.'
phrases.0: Aislé el error en la ruta de origen de la recuperación de imágenes private.
phrases.1: Fijé y verifiqué la versión immutable en Git y en runtime.
phrases.2: Mantuve intactas la autenticación y la conciliación automática durante la recuperación.
questions.0.points.0: El manifest deseado puede hacer referencia a un tag faltante o mutable.
questions.0.points.1: Verifique el digest resuelto y el contenedor en ejecución imageID.
questions.0.points.2: Pruebe pull authentication y el comportamiento real de la aplicación.
questions.0.prompt: ¿Por qué Synced no prueba que se esté ejecutando la imagen deseada?
questions.1.points.0: Registre la solución deseada en el repositorio de origen.
questions.1.points.1: Mantenga la confirmación recuperada procedente del historial conocido.
questions.1.points.2: Verifique el revision, health observado y el endpoint real juntos.
questions.1.prompt: ¿Cómo se conserva una recuperación después de GitOps self-heal?
diagnostics.repo: application/board repoURL debe ser igual a GIT_URL.
diagnostics.path: application/board source.path debe ser igual a manifests.
diagnostics.target: application/board targetRevision debe ser igual a main.
diagnostics.synced: application/board sync.status debe ser igual a Synced.
diagnostics.revision_exists: La revisión Git esperada debe existir y no estar vacía.
diagnostics.revision: La revisión sincronizada de application/board debe ser igual a la revisión Git esperada.
diagnostics.selfheal: application/board selfHeal debe ser igual a true.
diagnostics.health: application/board health.status debe ser igual a Healthy.
diagnostics.prune: application/board prune debe ser igual a true.
diagnostics.secrets: deployment/board imagePullSecrets debe ser igual a [registry-pull].
diagnostics.policy: deployment/board imagePullPolicy debe ser igual a Always.
diagnostics.rollout: El despliegue de deployment/board debe completarse.
diagnostics.http: La petición a board:8080 debe devolver north-80.
diagnostics.release_image: private-release.json image debe existir y no estar vacío.
diagnostics.fetch: git fetch origin main debe tener éxito.
diagnostics.origin: origin/main debe ser igual a release-commit.
diagnostics.changed: release-commit debe ser distinto de baseline-commit.
diagnostics.ancestor: baseline-commit debe ser antecesor de origin/main.
diagnostics.git_image: La primera imagen board en Git debe coincidir con la imagen de private-release.json.
diagnostics.git_policy: imagePullPolicy de board en Git debe ser Always.
diagnostics.git_secrets: imagePullSecrets de board en Git debe ser [registry-pull].
diagnostics.live_image: deployment/board containers[0].image debe ser igual a private-release.json image.
diagnostics.live_policy: deployment/board imagePullPolicy debe ser igual a Always.
diagnostics.image_id: Un Pod board no marcado para eliminación debe tener un contenedor listo cuyo imageID contenga
  el digest fijado.
diagnostics.registry: El registro autenticado debe servir el digest fijado.
stages.0.objectives.0.text: La Application `board` informa `Synced` en la revisión publicada prevista. Restaura
  automáticamente las desviaciones.
stages.0.objectives.1.text: El Deployment `board` comprueba siempre su imagen al iniciar usando solo la credencial
  existente del registry privado.
stages.1.objectives.0.text: La Application `board` informa `Synced` y `Healthy` en la revisión de la versión publicada.
  Restaura automáticamente las desviaciones y elimina los recursos que ya no están en la versión deseada.
stages.1.objectives.1.text: El `main` remoto coincide con `release-commit`, difiere del commit original y lo conserva
  como antecesor.
stages.1.objectives.2.text: El manifiesto de carga publicado usa la imagen congelada suministrada y conserva los
  requisitos de descarga al inicio y acceso al registry privado.
stages.1.objectives.3.text: La imagen en ejecución de `board` coincide con la versión congelada suministrada y se
  comprueba en cada inicio.
stages.1.objectives.4.text: El Deployment `board` completa su rollout.
stages.1.objectives.5.text: Un contenedor listo de un Pod no terminante de la aplicación ejecuta el digest de la
  imagen congelada suministrada.
stages.1.objectives.6.text: El acceso autenticado al registry privado sirve el digest de la versión congelada suministrada.
stages.1.objectives.7.text: Desde el Deployment `board`, `http://board:8080` devuelve `north-80`.
