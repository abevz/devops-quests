diagnostics.repo: La aplicación puede apuntar a otro repositorio o fallar lectura API; compare repoURL con GIT_URL suministrado. [Causa y comprobación](guides#guide=gitops-delivery&section=private-git-source-repository)
diagnostics.path: Setup deja ruta retired; la fuente debe resolver al directorio relativo manifests sin ruta absoluta ni recorrido al padre. [Causa y comprobación](guides#guide=gitops-delivery&section=private-git-manifest-path)
diagnostics.target: La aplicación puede seguir otra referencia o tener fuente ilegible; targetRevision debe seleccionar main. [Causa y comprobación](guides#guide=gitops-delivery&section=private-git-tracked-branch)
diagnostics.synced: Ruta incorrecta, cambio sin publicar o error de reconciliación pueden dejar sync.status distinto de Synced; inspeccione conditions y revision. [Causa y comprobación](guides#guide=gitops-delivery&section=private-git-reconciliation)
diagnostics.revision_exists: 'Puede faltar commit esperado o la aplicación informar revisión anterior: primera etapa usa baseline congelado y segunda release-commit publicado de trabajo. Synced por sí solo no demuestra igualdad. [Causa y comprobación](guides#guide=gitops-delivery&section=private-git-stage-revision)'
diagnostics.revision: 'Puede faltar commit esperado o la aplicación informar revisión anterior: primera etapa usa baseline congelado y segunda release-commit publicado de trabajo. Synced por sí solo no demuestra igualdad. [Causa y comprobación](guides#guide=gitops-delivery&section=private-git-stage-revision)'
diagnostics.selfheal: La reconciliación automática puede haberse eliminado o desactivado; selfHeal debe ser true en ambas etapas y prune también en etapa de publicación. [Causa y comprobación](guides#guide=gitops-delivery&section=private-git-automated-reconciliation)
diagnostics.prune: La reconciliación automática puede haberse eliminado o desactivado; selfHeal debe ser true en ambas etapas y prune también en etapa de publicación. [Causa y comprobación](guides#guide=gitops-delivery&section=private-git-automated-reconciliation)
diagnostics.health: La aplicación puede estar Synced sin arrancar image privado; inspeccione health conditions y eventos Pod. Healthy se exige en etapa de publicación, no en reparación inicial de ruta. [Causa y comprobación](guides#guide=gitops-delivery&section=private-git-release-health)
diagnostics.policy: Puede faltar Always en contenedor nombrado o Pod actuales propios, o referencias pull efectivas diferir del único registry-pull; errores API y estructura también dan secrets. Esta etapa exige Pod activos, aún sin image aprobado ni disponibilidad. [Causa y comprobación](guides#guide=gitops-delivery&section=private-git-initial-pull-contract)
diagnostics.secrets: Puede faltar Always en contenedor nombrado o Pod actuales propios, o referencias pull efectivas diferir del único registry-pull; errores API y estructura también dan secrets. Esta etapa exige Pod activos, aún sin image aprobado ni disponibilidad. [Causa y comprobación](guides#guide=gitops-delivery&section=private-git-initial-pull-contract)
diagnostics.fetch: La publicación puede quedar local, fallar fetch, release-commit señalar otra cabecera o reemplazarse historial. Publique descendiente nuevo de baseline en origin/main y guárdelo en release-commit; repetir baseline no basta. [Causa y comprobación](guides#guide=gitops-delivery&section=private-git-published-descendant)
diagnostics.origin: La publicación puede quedar local, fallar fetch, release-commit señalar otra cabecera o reemplazarse historial. Publique descendiente nuevo de baseline en origin/main y guárdelo en release-commit; repetir baseline no basta. [Causa y comprobación](guides#guide=gitops-delivery&section=private-git-published-descendant)
diagnostics.changed: La publicación puede quedar local, fallar fetch, release-commit señalar otra cabecera o reemplazarse historial. Publique descendiente nuevo de baseline en origin/main y guárdelo en release-commit; repetir baseline no basta. [Causa y comprobación](guides#guide=gitops-delivery&section=private-git-published-descendant)
diagnostics.ancestor: La publicación puede quedar local, fallar fetch, release-commit señalar otra cabecera o reemplazarse historial. Publique descendiente nuevo de baseline en origin/main y guárdelo en release-commit; repetir baseline no basta. [Causa y comprobación](guides#guide=gitops-delivery&section=private-git-published-descendant)
diagnostics.git_image: manifests/board.yaml publicado puede conservar mutable retired image, omitir Always o usar otras referencias pull. Image de contenedor nombrado debe igualar exactamente publicación congelada; lista template vacía puede heredar registry-pull del ServiceAccount vivo. Errores fetch, análisis y API también dan git_image. [Causa y comprobación](guides#guide=gitops-delivery&section=private-git-published-manifest)
diagnostics.git_policy: manifests/board.yaml publicado puede conservar mutable retired image, omitir Always o usar otras referencias pull. Image de contenedor nombrado debe igualar exactamente publicación congelada; lista template vacía puede heredar registry-pull del ServiceAccount vivo. Errores fetch, análisis y API también dan git_image. [Causa y comprobación](guides#guide=gitops-delivery&section=private-git-published-manifest)
diagnostics.git_secrets: manifests/board.yaml publicado puede conservar mutable retired image, omitir Always o usar otras referencias pull. Image de contenedor nombrado debe igualar exactamente publicación congelada; lista template vacía puede heredar registry-pull del ServiceAccount vivo. Errores fetch, análisis y API también dan git_image. [Causa y comprobación](guides#guide=gitops-delivery&section=private-git-published-manifest)
diagnostics.live_image: El archivo Git corregido puede no haberse reconciliado al contenedor vivo nombrado; compare image congelado exacto y Always. Errores API, ausencia de contenedor y estructura también dan live_image. [Causa y comprobación](guides#guide=gitops-delivery&section=private-git-live-template)
diagnostics.live_policy: El archivo Git corregido puede no haberse reconciliado al contenedor vivo nombrado; compare image congelado exacto y Always. Errores API, ausencia de contenedor y estructura también dan live_image. [Causa y comprobación](guides#guide=gitops-delivery&section=private-git-live-template)
diagnostics.rollout: Rollout puede bloquearse por pull o readiness, o Pod actual propio aún no ejecutar image exacto con digest y estado ready/running. Template coincidente no lo prueba; errores API o datos congelados también dan image_id. [Causa y comprobación](guides#guide=gitops-delivery&section=private-git-ready-private-image)
diagnostics.image_id: Rollout puede bloquearse por pull o readiness, o Pod actual propio aún no ejecutar image exacto con digest y estado ready/running. Template coincidente no lo prueba; errores API o datos congelados también dan image_id. [Causa y comprobación](guides#guide=gitops-delivery&section=private-git-ready-private-image)
diagnostics.release_image: Puede faltar campo image congelado o fallar solicitud registry por endpoint, credentials, CA o disponibilidad. La comprobación pide digest congelado por authenticated TLS con platform.env y registry-ca.crt de trabajo; no compara hashes de endpoint ni credentials con authority original. [Causa y comprobación](guides#guide=gitops-delivery&section=private-git-authenticated-digest)
diagnostics.registry: Puede faltar campo image congelado o fallar solicitud registry por endpoint, credentials, CA o disponibilidad. La comprobación pide digest congelado por authenticated TLS con platform.env y registry-ca.crt de trabajo; no compara hashes de endpoint ni credentials con authority original. [Causa y comprobación](guides#guide=gitops-delivery&section=private-git-authenticated-digest)
diagnostics.http: El proceso puede servir respuesta antigua o fallar ruta Service; solicitud real al puerto 8080 tras rollout debe devolver north-80. [Causa y comprobación](guides#guide=gitops-delivery&section=private-git-service-response)
diagnostics.probe_0_1: Observación initial puede detenerse al leer platform.env o cargar Python helpers antes del resultado detallado; compruebe entrada y dq_check. Fallos nombrados de image, policy, pull o API conservan sus marcadores. [Causa y comprobación](guides#guide=gitops-delivery&section=private-git-initial-observer-startup)
