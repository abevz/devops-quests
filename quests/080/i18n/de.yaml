diagnostics.repo: Die Anwendung verweist möglicherweise auf ein anderes Repository oder der API-Abruf scheitert; vergleichen Sie repoURL mit dem gelieferten GIT_URL. [Ursache und Prüfung](guides#guide=gitops-delivery&section=private-git-source-repository)
diagnostics.path: Setup belässt den Pfad retired; die Quelle muss zum relativen Verzeichnis manifests führen, ohne absoluten Pfad oder Elternverzeichniswechsel. [Ursache und Prüfung](guides#guide=gitops-delivery&section=private-git-manifest-path)
diagnostics.target: Die Anwendung verfolgt möglicherweise eine andere Referenz oder die Quelle ist unlesbar; targetRevision muss main wählen. [Ursache und Prüfung](guides#guide=gitops-delivery&section=private-git-tracked-branch)
diagnostics.synced: Falscher Quellpfad, unveröffentlichte Änderung oder Abgleichfehler können sync.status ungleich Synced lassen; prüfen Sie conditions und revision. [Ursache und Prüfung](guides#guide=gitops-delivery&section=private-git-reconciliation)
diagnostics.revision_exists: 'Der erwartete Commit fehlt möglicherweise oder die Anwendung meldet eine ältere Revision: Stufe eins nutzt die eingefrorene Baseline, Stufe zwei den veröffentlichten Arbeitswert release-commit. Synced allein belegt diese Gleichheit nicht. [Ursache und Prüfung](guides#guide=gitops-delivery&section=private-git-stage-revision)'
diagnostics.revision: 'Der erwartete Commit fehlt möglicherweise oder die Anwendung meldet eine ältere Revision: Stufe eins nutzt die eingefrorene Baseline, Stufe zwei den veröffentlichten Arbeitswert release-commit. Synced allein belegt diese Gleichheit nicht. [Ursache und Prüfung](guides#guide=gitops-delivery&section=private-git-stage-revision)'
diagnostics.selfheal: Automatischer Abgleich wurde möglicherweise entfernt oder deaktiviert; selfHeal muss in beiden Stufen true sein, prune zusätzlich in der Veröffentlichungsstufe. [Ursache und Prüfung](guides#guide=gitops-delivery&section=private-git-automated-reconciliation)
diagnostics.prune: Automatischer Abgleich wurde möglicherweise entfernt oder deaktiviert; selfHeal muss in beiden Stufen true sein, prune zusätzlich in der Veröffentlichungsstufe. [Ursache und Prüfung](guides#guide=gitops-delivery&section=private-git-automated-reconciliation)
diagnostics.health: Die Anwendung kann Synced sein, obwohl das private Image nicht startet; prüfen Sie health conditions und Pod-Ereignisse. Healthy ist in der Veröffentlichungsstufe erforderlich, nicht bei der anfänglichen Pfadreparatur. [Ursache und Prüfung](guides#guide=gitops-delivery&section=private-git-release-health)
diagnostics.policy: Always fehlt möglicherweise im benannten Container oder aktuellen zugehörigen Pods, oder wirksame Pull-Verweise weichen vom einzigen Namen registry-pull ab; API- und Strukturfehler ergeben ebenfalls secrets. Diese Stufe verlangt aktive Pods, noch kein freigegebenes Image oder Bereitschaft. [Ursache und Prüfung](guides#guide=gitops-delivery&section=private-git-initial-pull-contract)
diagnostics.secrets: Always fehlt möglicherweise im benannten Container oder aktuellen zugehörigen Pods, oder wirksame Pull-Verweise weichen vom einzigen Namen registry-pull ab; API- und Strukturfehler ergeben ebenfalls secrets. Diese Stufe verlangt aktive Pods, noch kein freigegebenes Image oder Bereitschaft. [Ursache und Prüfung](guides#guide=gitops-delivery&section=private-git-initial-pull-contract)
diagnostics.fetch: Die Veröffentlichung bleibt möglicherweise lokal, fetch scheitert, release-commit nennt einen anderen Remote-Stand oder die Historie wurde ersetzt. Veröffentlichen Sie einen neuen Nachfolger der Baseline auf origin/main und halten Sie ihn in release-commit fest; dieselbe Baseline erneut zu veröffentlichen reicht nicht. [Ursache und Prüfung](guides#guide=gitops-delivery&section=private-git-published-descendant)
