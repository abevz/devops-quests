title: Wiederherstellung der Lieferung
brief: 'Arbeite in `~/quest` mit `platform.env`, `registry-ca.crt`, `private-release.json`, `baseline-commit`, `application.json`,
  `release-commit`, `repository/manifests/board.json`, `repository/manifests/service.json` und `registry-pull.json`. Argo
  CD vergleicht eine Git-Revision asynchron mit laufenden Ressourcen. Setze zuerst Application `board` auf Repository `GIT_URL`,
  Pfad `manifests`, Ziel `main`, `selfHeal: true` und warte auf `Synced` bei `baseline-commit`. Das laufende Deployment muss
  genau `imagePullSecrets: [{name: registry-pull}]` und `imagePullPolicy: Always` des ersten Containers behalten.


  Committe und pushe dann einen Nachfahren des Baseline-Commits nach privatem `origin/main`; schreibe seinen Hash nach `release-commit`.
  Das erste Image im Commit und im laufenden Deployment muss dem eingefrorenen Image aus `private-release.json` entsprechen
  und `Always` nutzen; das committete Manifest muss genau `registry-pull` behalten. Die Application muss bei `release-commit`
  `Synced` und `Healthy` sein, mit `selfHeal` und `prune` true. Warte auf den Board-Rollout und HTTP `north-80` von `board:8080`;
  die imageID eines nicht terminierenden bereiten Pods muss den eingefrorenen Digest enthalten, und authentifizierter Zugriff
  mit `registry-ca.crt` und `platform.env` muss diesen Digest abrufen. Die Prüfung beweist nicht, dass das laufende Pull-Secret
  unverändert blieb. Schütze Zugangsdaten und arbeite nur in der Offline-Umgebung.'
debrief: Die Wiederherstellung schloss sich der private Git-Absicht, dem registry identity und dem tatsächlichen workload-Verhalten
  ohne einen Nur-Live-Patch an.
stages.0.brief: Application-Quelle, Baseline-Sync, Self-Heal und laufende Pull-Einstellungen entsprechen der Beschreibung.
stages.0.objectives.0.text: Application-Quelle, Baseline-Sync, Self-Heal und laufende Pull-Einstellungen entsprechen der Beschreibung.
stages.1.brief: Nachfahren-Revision, Application-Status, geprüfte Git- und Live-Image-Felder, Registry-Zugriff und Board-Antwort
  entsprechen der Beschreibung.
stages.1.objectives.0.text: Nachfahren-Revision, Application-Status, geprüfte Git- und Live-Image-Felder, Registry-Zugriff
  und Board-Antwort entsprechen der Beschreibung.
hints.0.text: Korrigieren Sie den Quellenabgleich, bevor Sie den Bildabruf diagnostizieren.
hints.1.text: Ein Git-Commit kann Synced sein, während sein Image tag nicht existiert.
hints.2.text: Übernehmen Sie das bereitgestellte immutable digest, bewahren Sie pull credentials auf und überprüfen Sie sowohl
  Git als auch das laufende imageID.
phrases.0: Ich habe den Quellpfadfehler beim private-Bildabruf isoliert.
phrases.1: Ich habe die immutable-Version in Git und bei runtime angeheftet und überprüft.
phrases.2: Ich habe die Authentifizierung und den automatischen Abgleich während der Wiederherstellung beibehalten.
questions.0.points.0: Das gewünschte manifest verweist möglicherweise auf ein fehlendes oder veränderliches tag.
questions.0.points.1: Überprüfen Sie den aufgelösten digest und den laufenden Container imageID.
questions.0.points.2: Testen Sie pull authentication und das tatsächliche Anwendungsverhalten.
questions.0.prompt: Warum beweist Synced nicht, dass das beabsichtigte Image ausgeführt wird?
questions.1.points.0: Notieren Sie den gewünschten Fix im Quell-Repository.
questions.1.points.1: Sorgen Sie dafür, dass der wiederhergestellte Commit vom bekannten Verlauf abstammt.
questions.1.points.2: Überprüfen Sie die beobachteten Werte revision, health und echten endpoint zusammen.
questions.1.prompt: Wie bewahren Sie eine Wiederherstellung nach GitOps self-heal auf?
diagnostics.repo: application/board repoURL muss GIT_URL entsprechen.
diagnostics.path: application/board source.path muss manifests entsprechen.
diagnostics.target: application/board targetRevision muss main entsprechen.
diagnostics.synced: application/board sync.status muss Synced entsprechen.
diagnostics.revision_exists: Die erwartete Git-Revision muss vorhanden und nicht leer sein.
diagnostics.revision: Die Sync-Revision von application/board muss der erwarteten Git-Revision entsprechen.
diagnostics.selfheal: application/board selfHeal muss true entsprechen.
diagnostics.health: application/board health.status muss Healthy entsprechen.
diagnostics.prune: application/board prune muss true entsprechen.
diagnostics.secrets: deployment/board imagePullSecrets muss [registry-pull] entsprechen.
diagnostics.policy: deployment/board imagePullPolicy muss Always entsprechen.
diagnostics.rollout: Der Rollout von deployment/board muss abgeschlossen sein.
diagnostics.http: Die Anfrage an board:8080 muss north-80 liefern.
diagnostics.release_image: private-release.json image muss vorhanden und nicht leer sein.
diagnostics.fetch: git fetch origin main muss erfolgreich sein.
diagnostics.origin: origin/main muss release-commit entsprechen.
diagnostics.changed: release-commit muss sich von baseline-commit unterscheiden.
diagnostics.ancestor: baseline-commit muss ein Vorfahr von origin/main sein.
diagnostics.git_image: Das erste Board-Image in Git muss dem Image aus private-release.json entsprechen.
diagnostics.git_policy: imagePullPolicy von board in Git muss Always sein.
diagnostics.git_secrets: imagePullSecrets von board in Git muss [registry-pull] entsprechen.
diagnostics.live_image: deployment/board containers[0].image muss private-release.json image entsprechen.
diagnostics.live_policy: deployment/board imagePullPolicy muss Always entsprechen.
diagnostics.image_id: Ein nicht zur Löschung markierter Board-Pod muss einen bereiten Container haben, dessen imageID den
  festgelegten Digest enthält.
diagnostics.registry: Die authentifizierte Registry muss den festgelegten Digest ausliefern.
