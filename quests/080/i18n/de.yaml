title: Wiederherstellung der Lieferung
brief: "Das private Release erreicht die Verbraucher noch nicht zuverlässig. Abgleich und laufendes Artefakt müssen\
  \ übereinstimmen.\n\nArbeiten Sie in `~/quest` auf der Workstation. Eingaben je Phase:\n- Phase 1: `platform.env`,\
  \ `application.yaml`, `private-release.json`, `registry-pull.yaml`, `registry-ca.crt`, `repository/manifests/board.yaml`,\
  \ `repository/manifests/service.yaml`.\n- Phase 2: `release-commit`.\n\n**Anforderungen:**\n\n- Phase 1:\n  -\
  \ Application `board` meldet `Synced` bei der vorgesehenen veröffentlichten Revision. Sie korrigiert Drift automatisch.\n\
  \  - Deployment `board` prüft sein Image bei jedem Start mit ausschließlich den bestehenden privaten Registry-Zugangsdaten.\n\
  - Phase 2:\n  - Application `board` meldet `Synced` und `Healthy` bei der veröffentlichten Release-Revision. Sie\
  \ korrigiert Drift automatisch und entfernt Ressourcen, die im gewünschten Release nicht mehr vorhanden sind.\n\
  \  - Das entfernte `main` entspricht `release-commit`, unterscheidet sich vom ursprünglichen Commit und bewahrt\
  \ ihn als Vorgänger.\n  - Das veröffentlichte Workload-Manifest nutzt das mitgelieferte eingefrorene Image und\
  \ bewahrt die Vorgaben für Start-Pull und privaten Registry-Zugriff.\n  - Das laufende `board`-Image entspricht\
  \ dem mitgelieferten eingefrorenen Release und wird bei jedem Start geprüft.\n  - Deployment `board` schließt\
  \ seinen Rollout ab.\n  - Ein bereiter Container in einem nicht terminierenden Anwendungs-Pod verwendet den mitgelieferten\
  \ eingefrorenen Image-Digest.\n  - Authentifizierter Zugriff auf die private Registry liefert den mitgelieferten\
  \ eingefrorenen Release-Digest.\n  - Von Deployment `board` liefert `http://board:8080` den Wert `north-80`.\n\
  \nDie Prüfung belegt nicht, dass das Live-Pull-Secret unverändert blieb; aktuelle Revision, Digest des bereiten\
  \ Containers und authentifizierter Registry-Zugriff sind getrennte Beobachtungen."
debrief: Die Wiederherstellung schloss sich der private Git-Absicht, dem registry identity und dem tatsächlichen
  workload-Verhalten ohne einen Nur-Live-Patch an.
stages.0.brief: Bewahren Sie die mitgelieferte Release-Identität und Pull-Zugangsdaten.
stages.1.brief: Das veröffentlichte Nachfolge-Release muss einen bereiten Verbraucher erreichen.
hints.0.text: Korrigieren Sie den Quellenabgleich, bevor Sie den Bildabruf diagnostizieren.
hints.1.text: 'Ein Git-Commit kann Synced sein, während sein Image tag nicht existiert.


  Prüfen Sie mitgelieferte Definitionen, Ressourcenbeschreibungen und Ereignisse der jeweiligen Phase.


  ```sh

  git -C repository log --all --oneline

  kubectl describe application board

  kubectl describe deployment board

  kubectl describe pod -l app=board

  ```


  Phase 1/2: Prüfen Sie diese Ressourcendefinitionen für diese Phase.


  ```sh

  kubectl get application board -o yaml

  kubectl get deployment board -o yaml

  kubectl get pods -l app=board -o yaml

  ```


  Phase 2: Prüfen Sie diese Ressourcendefinitionen für diese Phase.


  ```sh

  git -C repository show origin/main:manifests/board.yaml

  ```'
hints.2.text: |-
  Übernehmen Sie das bereitgestellte immutable digest, bewahren Sie pull credentials auf und überprüfen Sie sowohl Git als auch das laufende imageID. Veröffentlichen Sie einen Nachfolge-Commit nach `origin/main` und halten Sie seinen Hash in `release-commit` fest.

  Prüfen Sie die reparierte Phase und vergleichen Sie das beobachtete Ergebnis.

  Phase 1/2: Der Controller meldet `Synced` bei der erwarteten Revision; in der letzten Phase meldet er auch `Healthy` und der Workload ist bereit.

  ```sh
  kubectl get application board -o jsonpath='{.status.sync.status} {.status.health.status} {.status.sync.revision}'; printf '\n'
  kubectl get deployment board
  ```

  Phase 2: Der veröffentlichte Hash entspricht dem aufgezeichneten Release; die Abstammungsprüfung endet, sofern vorhanden, mit Code `0`.

  ```sh
  source platform.env
  cat release-commit
  git -C repository ls-remote origin refs/heads/main
  git -C repository merge-base --is-ancestor "$(cat baseline-commit)" origin/main
  ```

  Phase 2: Die Anwendung liefert `north-80`; der authentifizierte Abruf des aufgezeichneten Registry-Digests liefert HTTP `200`.

  ```sh
  source platform.env
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080
  printf '\n'
  image=$(jq -r .image private-release.json)
  curl -fsS --max-time 4 --config <(printf 'user = "%s:%s"\n' "$REGISTRY_USER" "$REGISTRY_PASSWORD") --cacert registry-ca.crt -H 'Accept: application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json' -o /dev/null -w '%{http_code}\n' "https://$REGISTRY/v2/parcel/manifests/${image##*@}"
  ```

  Erwartete Beobachtungen für die gesamte Phase:
  - Phase 1/2: Angezeigter Abgleich, Workload-Konfiguration und Beobachtungen des laufenden Images erfüllen die Anforderungen dieser Phase.
  - Phase 2: Der entfernte Hash entspricht `release-commit`, das Manifest erfüllt die Anforderungen und die Abstammungsprüfung endet mit Code `0` bei unterschiedlichem Release-Hash.

phrases.0: Ich habe den Quellpfadfehler beim private-Bildabruf isoliert.
phrases.1: Ich habe die immutable-Version in Git und bei runtime angeheftet und überprüft.
phrases.2: Ich habe die Authentifizierung und den automatischen Abgleich während der Wiederherstellung beibehalten.
questions.0.points.0: Das gewünschte manifest verweist möglicherweise auf ein fehlendes oder veränderliches tag.
questions.0.points.1: Überprüfen Sie den aufgelösten digest und den laufenden Container imageID.
questions.0.points.2: Testen Sie pull authentication und das tatsächliche Anwendungsverhalten.
questions.0.prompt: Warum beweist Synced nicht, dass das beabsichtigte Image ausgeführt wird?
questions.1.points.0: Notieren Sie den gewünschten Fix im Quell-Repository.
questions.1.points.1: Sorgen Sie dafür, dass der wiederhergestellte Commit vom bekannten Verlauf abstammt.
questions.1.points.2: Überprüfen Sie die beobachteten Werte revision, health und echten endpoint zusammen.
questions.1.prompt: Wie bewahren Sie eine Wiederherstellung nach GitOps self-heal auf?
diagnostics.repo: application/board repoURL muss GIT_URL entsprechen.
diagnostics.path: |-
  Das Quellverzeichnis muss auf manifests innerhalb des Repositorys verweisen.

diagnostics.target: application/board targetRevision muss main entsprechen.
diagnostics.synced: application/board sync.status muss Synced entsprechen.
diagnostics.revision_exists: Die erwartete Git-Revision muss vorhanden und nicht leer sein.
diagnostics.revision: Die Sync-Revision von application/board muss der erwarteten Git-Revision entsprechen.
diagnostics.selfheal: application/board selfHeal muss true entsprechen.
diagnostics.health: application/board health.status muss Healthy entsprechen.
diagnostics.prune: application/board prune muss true entsprechen.
diagnostics.secrets: |-
  worker darf nur die vorhandenen Zugangsdaten aus registry-pull verwenden, einschließlich der effektiven Pod-Verweise.
diagnostics.policy: deployment/board imagePullPolicy muss Always entsprechen.
diagnostics.rollout: Der Rollout von deployment/board muss abgeschlossen sein.
diagnostics.http: Die Anfrage an board:8080 muss north-80 liefern.
diagnostics.release_image: private-release.json image muss vorhanden und nicht leer sein.
diagnostics.fetch: git fetch origin main muss erfolgreich sein.
diagnostics.origin: origin/main muss release-commit entsprechen.
diagnostics.changed: release-commit muss sich von baseline-commit unterscheiden.
diagnostics.ancestor: baseline-commit muss ein Vorfahr von origin/main sein.
diagnostics.git_image: |-
  Das Image des benannten worker muss private-release.json entsprechen.

diagnostics.git_policy: imagePullPolicy von board in Git muss Always sein.
diagnostics.git_secrets: |-
  worker darf nur die vorhandenen Zugangsdaten aus registry-pull verwenden, einschließlich der effektiven Pod-Verweise.
diagnostics.live_image: |-
  Das Image des benannten worker muss private-release.json entsprechen.

diagnostics.live_policy: deployment/board imagePullPolicy muss Always entsprechen.
diagnostics.image_id: |-
  Ein aktueller Pod dieses Deployments muss einen bereiten, laufenden worker mit exakt dem eingefrorenen Image-Digest haben.

diagnostics.registry: Die authentifizierte Registry muss den festgelegten Digest ausliefern.
