title: Wiederherstellung der Lieferung
brief: 'Die Lieferung weist zwei unabhängige Fehler auf: private Argo Application zeigt auf retired, und
  der festgeschriebene Fehler workload verweist auf ein nicht vorhandenes private-Image tag. Stellen Sie
  zunächst manifests wieder her und beweisen Sie, dass das eingefrorene anfängliche Commit Synced ist.
  Der Pod wird weiterhin blockiert. Reparieren Sie dann das Image in Git in immutable digest in private-release.json,
  schreiben Sie es fest und pushen Sie es in den verfügbaren main-Zweig. Lassen Sie pull authentication
  und self-heal aktiviert. Beenden Sie den Vorgang nur, wenn der neu beobachtete Commit, der gepushte
  manifest, der tatsächliche container imageID, der authentifizierte registry und der HTTP north-80 übereinstimmen.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `platform.env`, `registry-ca.crt`,
  `registry-pull.json`, `private-release.json`, `baseline-commit`, `application.json`, `release-commit`,
  `repository/manifests/board.json`, `repository/manifests/service.json`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private-Dienste. Ändern Sie nur diese Bucht.


  Anfängliche Erfolgskriterien: Der anfängliche private Git revision ist Synced von manifests und der
  workload behält authentifizierte Always-Pulls bei.'
debrief: Die Wiederherstellung schloss sich der private Git-Absicht, dem registry identity und dem tatsächlichen
  workload-Verhalten ohne einen Nur-Live-Patch an.
stages.0.brief: 'Erfolgskriterien: Der anfängliche private Git revision ist Synced von manifests und der
  workload behält authentifizierte Always-Pulls bei.'
stages.0.objectives.0.text: Der anfängliche private Git revision ist Synced von manifests und der workload
  behält authentifizierte Always-Pulls bei.
stages.1.brief: 'Erfolgskriterien: Ein neuer Nachkomme Git-Commit pinnt das eingefrorene private digest,
  Argo ist Healthy, echte imageID-Übereinstimmungen und HTTP-Rückgaben north-80.'
stages.1.objectives.0.text: Ein neuer Nachkomme Git-Commit pinnt das eingefrorene private digest, Argo
  ist Healthy, echtes imageID stimmt überein und HTTP kehrt zurück north-80.
hints.0.text: Korrigieren Sie den Quellenabgleich, bevor Sie den Bildabruf diagnostizieren.
hints.1.text: Ein Git-Commit kann Synced sein, während sein Image tag nicht existiert.
hints.2.text: Übernehmen Sie das bereitgestellte immutable digest, bewahren Sie pull credentials auf und
  überprüfen Sie sowohl Git als auch das laufende imageID.
phrases.0: Ich habe den Quellpfadfehler beim private-Bildabruf isoliert.
phrases.1: Ich habe die immutable-Version in Git und bei runtime angeheftet und überprüft.
phrases.2: Ich habe die Authentifizierung und den automatischen Abgleich während der Wiederherstellung
  beibehalten.
questions.0.points.0: Das gewünschte manifest verweist möglicherweise auf ein fehlendes oder veränderliches
  tag.
questions.0.points.1: Überprüfen Sie den aufgelösten digest und den laufenden Container imageID.
questions.0.points.2: Testen Sie pull authentication und das tatsächliche Anwendungsverhalten.
questions.0.prompt: Warum beweist Synced nicht, dass das beabsichtigte Image ausgeführt wird?
questions.1.points.0: Notieren Sie den gewünschten Fix im Quell-Repository.
questions.1.points.1: Sorgen Sie dafür, dass der wiederhergestellte Commit vom bekannten Verlauf abstammt.
questions.1.points.2: Überprüfen Sie die beobachteten Werte revision, health und echten endpoint zusammen.
questions.1.prompt: Wie bewahren Sie eine Wiederherstellung nach GitOps self-heal auf?
