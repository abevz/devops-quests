diagnostics.git_image: Das veröffentlichte manifests/board.yaml enthält möglicherweise noch das mutable retired Image, kein Always oder andere Pull-Verweise. Das benannte Container-Image muss exakt der eingefrorenen Veröffentlichung entsprechen; eine leere Template-Liste darf registry-pull vom aktuellen ServiceAccount erben. Fetch-, Parse- und API-Fehler ergeben ebenfalls git_image. [Ursache und Prüfung](guides#guide=gitops-delivery&section=private-git-published-manifest)
diagnostics.git_policy: Das veröffentlichte manifests/board.yaml enthält möglicherweise noch das mutable retired Image, kein Always oder andere Pull-Verweise. Das benannte Container-Image muss exakt der eingefrorenen Veröffentlichung entsprechen; eine leere Template-Liste darf registry-pull vom aktuellen ServiceAccount erben. Fetch-, Parse- und API-Fehler ergeben ebenfalls git_image. [Ursache und Prüfung](guides#guide=gitops-delivery&section=private-git-published-manifest)
diagnostics.git_secrets: Das veröffentlichte manifests/board.yaml enthält möglicherweise noch das mutable retired Image, kein Always oder andere Pull-Verweise. Das benannte Container-Image muss exakt der eingefrorenen Veröffentlichung entsprechen; eine leere Template-Liste darf registry-pull vom aktuellen ServiceAccount erben. Fetch-, Parse- und API-Fehler ergeben ebenfalls git_image. [Ursache und Prüfung](guides#guide=gitops-delivery&section=private-git-published-manifest)
diagnostics.live_image: Die korrigierte Git-Datei ist möglicherweise noch nicht im benannten Live-Container angekommen; vergleichen Sie exaktes eingefrorenes Image und Always. API-Fehler, fehlender Container oder fehlerhafte Struktur ergeben ebenfalls live_image. [Ursache und Prüfung](guides#guide=gitops-delivery&section=private-git-live-template)
diagnostics.live_policy: Die korrigierte Git-Datei ist möglicherweise noch nicht im benannten Live-Container angekommen; vergleichen Sie exaktes eingefrorenes Image und Always. API-Fehler, fehlender Container oder fehlerhafte Struktur ergeben ebenfalls live_image. [Ursache und Prüfung](guides#guide=gitops-delivery&section=private-git-live-template)
diagnostics.rollout: Der Rollout wird möglicherweise durch Pull oder Readiness blockiert, oder ein aktueller zugehöriger Pod führt das exakte eingefrorene Image noch nicht mit Digest und ready/running Zustand aus. Das Template allein belegt dies nicht; API- oder Eingabefehler ergeben ebenfalls image_id. [Ursache und Prüfung](guides#guide=gitops-delivery&section=private-git-ready-private-image)
diagnostics.image_id: Der Rollout wird möglicherweise durch Pull oder Readiness blockiert, oder ein aktueller zugehöriger Pod führt das exakte eingefrorene Image noch nicht mit Digest und ready/running Zustand aus. Das Template allein belegt dies nicht; API- oder Eingabefehler ergeben ebenfalls image_id. [Ursache und Prüfung](guides#guide=gitops-delivery&section=private-git-ready-private-image)
diagnostics.release_image: Das eingefrorene Image-Feld fehlt möglicherweise oder die Registry-Anfrage scheitert an Endpoint, credentials, CA oder Verfügbarkeit. Die Prüfung ruft den eingefrorenen Digest über authenticated TLS mit aktuellem platform.env und registry-ca.crt ab; Endpoint- oder Credential-Hashes werden nicht mit einer ursprünglichen Authority verglichen. [Ursache und Prüfung](guides#guide=gitops-delivery&section=private-git-authenticated-digest)
diagnostics.registry: Das eingefrorene Image-Feld fehlt möglicherweise oder die Registry-Anfrage scheitert an Endpoint, credentials, CA oder Verfügbarkeit. Die Prüfung ruft den eingefrorenen Digest über authenticated TLS mit aktuellem platform.env und registry-ca.crt ab; Endpoint- oder Credential-Hashes werden nicht mit einer ursprünglichen Authority verglichen. [Ursache und Prüfung](guides#guide=gitops-delivery&section=private-git-authenticated-digest)
diagnostics.http: Der Prozess liefert möglicherweise eine alte Antwort oder das Service-Routing ist gestört; die tatsächliche Anfrage an Port 8080 muss nach dem Rollout north-80 liefern. [Ursache und Prüfung](guides#guide=gitops-delivery&section=private-git-service-response)
