title: Delivery recovery
brief: "The private release is not reaching consumers reliably. Reconciliation and the running artifact must agree.\n\
  \nWork in `~/quest` on the workstation. Inputs by stage:\n- Stage 1: `platform.env`, `application.yaml`, `private-release.json`,\
  \ `registry-pull.yaml`, `registry-ca.crt`, `repository/manifests/board.yaml`, `repository/manifests/service.yaml`.\n\
  - Stage 2: `release-commit`.\n\n**Requirements:**\n\n- Stage 1:\n  - Application `board` reports `Synced` at the\
  \ intended published revision. It automatically restores drift.\n  - Deployment `board` always checks its image\
  \ on startup using only the existing private-registry credential.\n- Stage 2:\n  - Application `board` reports\
  \ `Synced` and `Healthy` at the published release revision. It automatically restores drift and removes resources\
  \ no longer present in the desired release.\n  - Remote `main` equals `release-commit`, differs from the original\
  \ commit and preserves that commit as an ancestor.\n  - The published workload manifest uses the supplied frozen\
  \ image and preserves its startup pull and private-registry access requirements.\n  - The running `board` image\
  \ matches the supplied frozen release and is checked on every startup.\n  - Deployment `board` completes its rollout.\n\
  \  - A ready container in a nonterminating application Pod runs the supplied frozen image digest.\n  - Authenticated\
  \ access to the private registry serves the supplied frozen release digest.\n  - From Deployment `board`, `http://board:8080`\
  \ returns `north-80`.\n\nThe check does not prove that the live pull Secret was unchanged; current revision, ready-container\
  \ digest and authenticated registry access are separate observations."
debrief: Recovery joined private Git intent, registry identity and actual workload behavior without a live-only
  patch.
stages.0.brief: Keep the supplied release identity and pull credentials.
stages.1.brief: The published descendant release must reach a ready consumer.
hints.0.text: Fix source reconciliation before diagnosing image retrieval.
hints.1.text: 'A Git commit can be Synced while its image tag does not exist.


  Inspect the supplied definitions, resource descriptions and events for the relevant stage.


  ```sh

  git -C repository log --all --oneline

  kubectl describe application board

  kubectl describe deployment board

  kubectl describe pod -l app=board

  ```


  Stage 1/2: Inspect these resource definitions for this stage.


  ```sh

  kubectl get application board -o yaml

  kubectl get deployment board -o yaml

  kubectl get pods -l app=board -o yaml

  ```


  Stage 2: Inspect these resource definitions for this stage.


  ```sh

  git -C repository show origin/main:manifests/board.yaml

  ```'
hints.2.text: 'Commit the supplied immutable digest, preserve pull credentials and verify both Git and the running
  imageID. Publish a descendant commit to `origin/main` and record its hash in `release-commit`.


  Verify the repaired stage and compare the observed result.


  Stage 1/2: The controller reports `Synced` at the expected revision; in the final stage it also reports `Healthy`
  and the workload is ready.


  ```sh

  kubectl get application board -o jsonpath=''{.status.sync.status} {.status.health.status} {.status.sync.revision}'';
  printf ''\n''

  kubectl get deployment board

  ```


  Stage 2: The published hash matches the recorded release; the ancestry check, when present, exits `0`.


  ```sh

  source platform.env

  cat release-commit

  git -C repository ls-remote origin refs/heads/main

  git -C repository merge-base --is-ancestor "$(cat baseline-commit)" origin/main

  ```


  Stage 2: The application returns `north-80`; authenticated retrieval of the recorded registry digest returns HTTP
  `200`.


  ```sh

  source platform.env

  kubectl exec deployment/board -- wget -qO- -T 3 http://board:8080

  printf ''\n''

  image=$(jq -r .image private-release.json)

  curl -fsS --max-time 4 --config <(printf ''user = "%s:%s"\n'' "$REGISTRY_USER" "$REGISTRY_PASSWORD") --cacert
  registry-ca.crt -H ''Accept: application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json''
  -o /dev/null -w ''%{http_code}\n'' "https://$REGISTRY/v2/parcel/manifests/${image##*@}"

  ```


  Expected observations for the complete stage:

  - Stage 1/2: The displayed reconciliation, workload configuration and running-image observations match this stage’s
  Requirements.

  - Stage 2: The remote hash equals `release-commit`, the manifest matches Requirements, and ancestry exits `0`
  with a different release hash.'
phrases.0: I isolated source-path failure from private image retrieval.
phrases.1: I pinned and verified the immutable release in Git and at runtime.
phrases.2: I kept authentication and automatic reconciliation intact during recovery.
questions.0.points.0: The desired manifest may reference a missing or mutable tag.
questions.0.points.1: Verify the resolved digest and running container imageID.
questions.0.points.2: Test pull authentication and actual application behavior.
questions.0.prompt: Why does Synced not prove that the intended image is running?
questions.1.points.0: Record the desired fix in the source repository.
questions.1.points.1: Keep the recovered commit descended from known history.
questions.1.points.2: Verify the observed revision, health and real endpoint together.
questions.1.prompt: How do you preserve a recovery after GitOps self-heal?
diagnostics.repo: application/board repoURL must equal GIT_URL.
diagnostics.path: application/board source.path must equal manifests.
diagnostics.target: application/board targetRevision must equal main.
diagnostics.synced: application/board sync.status must equal Synced.
diagnostics.revision_exists: The expected Git revision must exist and be nonempty.
diagnostics.revision: The application/board sync revision must equal the expected Git revision.
diagnostics.selfheal: application/board selfHeal must equal true.
diagnostics.health: application/board health.status must equal Healthy.
diagnostics.prune: application/board prune must equal true.
diagnostics.secrets: deployment/board imagePullSecrets must equal [registry-pull].
diagnostics.policy: deployment/board imagePullPolicy must equal Always.
diagnostics.rollout: The deployment/board rollout must complete.
diagnostics.http: The request to board:8080 must return north-80.
diagnostics.release_image: private-release.json image must exist and be nonempty.
diagnostics.fetch: git fetch origin main must succeed.
diagnostics.origin: origin/main must equal release-commit.
diagnostics.changed: release-commit must differ from baseline-commit.
diagnostics.ancestor: baseline-commit must be an ancestor of origin/main.
diagnostics.git_image: The first board image in Git must equal the image in private-release.json.
diagnostics.git_policy: The board imagePullPolicy in Git must be Always.
diagnostics.git_secrets: The board imagePullSecrets in Git must equal [registry-pull].
diagnostics.live_image: deployment/board containers[0].image must equal private-release.json image.
diagnostics.live_policy: deployment/board imagePullPolicy must equal Always.
diagnostics.image_id: A board Pod not marked for deletion must have a ready container whose imageID contains the
  frozen digest.
diagnostics.registry: Authenticated registry must serve the frozen digest.
