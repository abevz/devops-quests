title: Delivery recovery
brief: 'Work in `~/quest` with `platform.env`, `registry-ca.crt`, `private-release.json`, `baseline-commit`, `application.json`,
  `release-commit`, `repository/manifests/board.json`, `repository/manifests/service.json` and `registry-pull.json`. Argo
  CD compares a Git revision with live resources asynchronously. First restore Application `board` to the `GIT_URL` repository,
  path `manifests`, target `main`, `selfHeal: true`, and wait for `Synced` at `baseline-commit`. The live Deployment must
  retain exactly `imagePullSecrets: [{name: registry-pull}]` and first-container `imagePullPolicy: Always`.


  Next commit and push a descendant of the baseline to the private `origin/main`; write its hash to `release-commit`. Both
  the committed and live first image must equal the frozen image in `private-release.json` and use `Always`; the committed
  manifest must retain exactly `registry-pull`. The Application must be `Synced` and `Healthy` at `release-commit`, with `selfHeal`
  and `prune` true. Wait for board rollout and HTTP `north-80` on `board:8080`; a nonterminating ready Pod imageID must contain
  the frozen digest, and authenticated access using `registry-ca.crt` and `platform.env` must fetch that digest. The check
  does not prove the live pull Secret was unchanged. Keep credentials private and work only in the offline bay.'
debrief: Recovery joined private Git intent, registry identity and actual workload behavior without a live-only patch.
stages.0.brief: The Application source, baseline sync, self-heal and live pull settings match the brief.
stages.0.objectives.0.text: The Application source, baseline sync, self-heal and live pull settings match the brief.
stages.1.brief: The descendant revision, Application status, checked Git and live image fields, registry access and board
  response match the brief.
stages.1.objectives.0.text: The descendant revision, Application status, checked Git and live image fields, registry access
  and board response match the brief.
hints.0.text: Fix source reconciliation before diagnosing image retrieval.
hints.1.text: A Git commit can be Synced while its image tag does not exist.
hints.2.text: Commit the supplied immutable digest, preserve pull credentials and verify both Git and the running imageID.
phrases.0: I isolated source-path failure from private image retrieval.
phrases.1: I pinned and verified the immutable release in Git and at runtime.
phrases.2: I kept authentication and automatic reconciliation intact during recovery.
questions.0.points.0: The desired manifest may reference a missing or mutable tag.
questions.0.points.1: Verify the resolved digest and running container imageID.
questions.0.points.2: Test pull authentication and actual application behavior.
questions.0.prompt: Why does Synced not prove that the intended image is running?
questions.1.points.0: Record the desired fix in the source repository.
questions.1.points.1: Keep the recovered commit descended from known history.
questions.1.points.2: Verify the observed revision, health and real endpoint together.
questions.1.prompt: How do you preserve a recovery after GitOps self-heal?
