title: Delivery recovery
brief: 'Delivery has two independent faults: the private Argo Application points at retired, and the committed
  workload references a nonexistent private image tag. First restore manifests and prove the frozen initial
  commit is Synced; the Pod will still be blocked. Then repair the image in Git to the immutable digest
  in private-release.json, commit and push to the disposable main branch. Keep pull authentication and
  self-heal enabled. Finish only when the new observed commit, pushed manifest, actual container imageID,
  authenticated registry and HTTP north-80 agree.


  Quest files in `~/quest` (some appear in later stages): `platform.env`, `registry-ca.crt`, `registry-pull.json`,
  `private-release.json`, `baseline-commit`, `application.json`, `release-commit`, `repository/manifests/board.json`,
  `repository/manifests/service.json`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: The initial private Git revision is Synced from manifests and the workload
  retains authenticated Always pulls.'
debrief: Recovery joined private Git intent, registry identity and actual workload behavior without a
  live-only patch.
