diagnostics.repo: The application may still reference another repository, or its API object could not be read; compare repoURL with the supplied GIT_URL. [Cause and check](guides#guide=gitops-delivery&section=private-git-source-repository)
diagnostics.path: Setup leaves the source path at retired; the source must resolve to the relative manifests directory without an absolute path or parent traversal. [Cause and check](guides#guide=gitops-delivery&section=private-git-manifest-path)
diagnostics.target: The application may track another ref or have no readable source; targetRevision must select main. [Cause and check](guides#guide=gitops-delivery&section=private-git-tracked-branch)
diagnostics.synced: A wrong source path, an unpublished change or a reconciliation error may leave sync.status different from Synced; inspect application conditions and the revision before retrying. [Cause and check](guides#guide=gitops-delivery&section=private-git-reconciliation)
diagnostics.revision_exists: 'The expected commit may be absent or the application may still report an older revision: stage one uses the frozen baseline, while stage two uses the published working release-commit. A Synced status alone does not establish that equality. [Cause and check](guides#guide=gitops-delivery&section=private-git-stage-revision)'
diagnostics.revision: 'The expected commit may be absent or the application may still report an older revision: stage one uses the frozen baseline, while stage two uses the published working release-commit. A Synced status alone does not establish that equality. [Cause and check](guides#guide=gitops-delivery&section=private-git-stage-revision)'
diagnostics.selfheal: Automated reconciliation may have been removed or disabled; selfHeal must be true in both stages, and prune is additionally required in the release stage. [Cause and check](guides#guide=gitops-delivery&section=private-git-automated-reconciliation)
diagnostics.prune: Automated reconciliation may have been removed or disabled; selfHeal must be true in both stages, and prune is additionally required in the release stage. [Cause and check](guides#guide=gitops-delivery&section=private-git-automated-reconciliation)
diagnostics.health: The application can be Synced while the private image cannot start; inspect health conditions and Pod events. Healthy is required for the release stage, not the initial source-path repair. [Cause and check](guides#guide=gitops-delivery&section=private-git-release-health)
diagnostics.policy: Always may be missing from the named container or current owned Pods, or their effective pull references may differ from the single existing registry-pull name; API and object-shape errors also use secrets. This stage requires active Pods, without requiring the approved release image or readiness yet. [Cause and check](guides#guide=gitops-delivery&section=private-git-initial-pull-contract)
diagnostics.secrets: Always may be missing from the named container or current owned Pods, or their effective pull references may differ from the single existing registry-pull name; API and object-shape errors also use secrets. This stage requires active Pods, without requiring the approved release image or readiness yet. [Cause and check](guides#guide=gitops-delivery&section=private-git-initial-pull-contract)
diagnostics.fetch: The release may remain local, fetch may fail, release-commit may name a different remote head, or history may have been replaced. Publish a new descendant of the frozen baseline to origin/main and retain its commit in release-commit; merely republishing the baseline is insufficient. [Cause and check](guides#guide=gitops-delivery&section=private-git-published-descendant)
diagnostics.origin: The release may remain local, fetch may fail, release-commit may name a different remote head, or history may have been replaced. Publish a new descendant of the frozen baseline to origin/main and retain its commit in release-commit; merely republishing the baseline is insufficient. [Cause and check](guides#guide=gitops-delivery&section=private-git-published-descendant)
diagnostics.changed: The release may remain local, fetch may fail, release-commit may name a different remote head, or history may have been replaced. Publish a new descendant of the frozen baseline to origin/main and retain its commit in release-commit; merely republishing the baseline is insufficient. [Cause and check](guides#guide=gitops-delivery&section=private-git-published-descendant)
diagnostics.ancestor: The release may remain local, fetch may fail, release-commit may name a different remote head, or history may have been replaced. Publish a new descendant of the frozen baseline to origin/main and retain its commit in release-commit; merely republishing the baseline is insufficient. [Cause and check](guides#guide=gitops-delivery&section=private-git-published-descendant)
diagnostics.git_image: The published manifests/board.yaml may still use the mutable retired image, omit Always or use different pull references. Its named container image must exactly equal the frozen release; an empty template pull list may inherit the existing registry-pull reference from the live ServiceAccount. Fetch, parsing and API errors can also report git_image. [Cause and check](guides#guide=gitops-delivery&section=private-git-published-manifest)
diagnostics.git_policy: The published manifests/board.yaml may still use the mutable retired image, omit Always or use different pull references. Its named container image must exactly equal the frozen release; an empty template pull list may inherit the existing registry-pull reference from the live ServiceAccount. Fetch, parsing and API errors can also report git_image. [Cause and check](guides#guide=gitops-delivery&section=private-git-published-manifest)
diagnostics.git_secrets: The published manifests/board.yaml may still use the mutable retired image, omit Always or use different pull references. Its named container image must exactly equal the frozen release; an empty template pull list may inherit the existing registry-pull reference from the live ServiceAccount. Fetch, parsing and API errors can also report git_image. [Cause and check](guides#guide=gitops-delivery&section=private-git-published-manifest)
diagnostics.live_image: A corrected Git file may not yet be reconciled into the live named container; compare its exact frozen image and Always policy. API, missing-container and malformed-object errors can also report live_image. [Cause and check](guides#guide=gitops-delivery&section=private-git-live-template)
diagnostics.live_policy: A corrected Git file may not yet be reconciled into the live named container; compare its exact frozen image and Always policy. API, missing-container and malformed-object errors can also report live_image. [Cause and check](guides#guide=gitops-delivery&section=private-git-live-template)
diagnostics.rollout: The rollout may be blocked by image pulls or readiness, or a current owned Pod may not yet run the exact frozen image with its digest and ready running state. A matching template alone does not prove this; API or frozen-input errors also report image_id. [Cause and check](guides#guide=gitops-delivery&section=private-git-ready-private-image)
diagnostics.image_id: The rollout may be blocked by image pulls or readiness, or a current owned Pod may not yet run the exact frozen image with its digest and ready running state. A matching template alone does not prove this; API or frozen-input errors also report image_id. [Cause and check](guides#guide=gitops-delivery&section=private-git-ready-private-image)
diagnostics.release_image: The frozen image field may be absent, or the registry request may fail because of supplied endpoint, credentials, CA or availability. The check requests the frozen digest over authenticated TLS using working platform.env and registry-ca.crt; it does not compare endpoint or credential hashes with an original authority. [Cause and check](guides#guide=gitops-delivery&section=private-git-authenticated-digest)
diagnostics.registry: The frozen image field may be absent, or the registry request may fail because of supplied endpoint, credentials, CA or availability. The check requests the frozen digest over authenticated TLS using working platform.env and registry-ca.crt; it does not compare endpoint or credential hashes with an original authority. [Cause and check](guides#guide=gitops-delivery&section=private-git-authenticated-digest)
diagnostics.http: The process may still serve an old response or Service routing may be broken; the actual request to port 8080 must return north-80 after the rollout. [Cause and check](guides#guide=gitops-delivery&section=private-git-service-response)
diagnostics.probe_0_1: The initial observation may stop while reading platform.env or loading Python helpers before it emits a detailed result; check the supplied input and dq_check availability. Already named image, policy, pull or API failures keep their own markers. [Cause and check](guides#guide=gitops-delivery&section=private-git-initial-observer-startup)
diagnostics.probe_1_2: The Git observation may stop while reading platform.env or loading Python helpers before it emits a detailed result; check the supplied input and dq_check availability. Already named image, policy, pull or API failures keep their own markers. [Cause and check](guides#guide=gitops-delivery&section=private-git-git-observer-startup)
diagnostics.probe_1_3: The live observation may stop while reading platform.env or loading Python helpers before it emits a detailed result; check the supplied input and dq_check availability. Already named image, policy, pull or API failures keep their own markers. [Cause and check](guides#guide=gitops-delivery&section=private-git-live-observer-startup)
