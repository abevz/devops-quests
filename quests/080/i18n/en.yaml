hints.0.text: Fix source reconciliation before diagnosing image retrieval.
hints.1.text: A Git commit can be Synced while its image tag does not exist.
hints.2.text: Commit the supplied immutable digest, preserve pull credentials and verify both Git and
  the running imageID.
phrases.0: I isolated source-path failure from private image retrieval.
phrases.1: I pinned and verified the immutable release in Git and at runtime.
phrases.2: I kept authentication and automatic reconciliation intact during recovery.
questions.0.points.0: The desired manifest may reference a missing or mutable tag.
questions.0.points.1: Verify the resolved digest and running container imageID.
questions.0.points.2: Test pull authentication and actual application behavior.
questions.0.prompt: Why does Synced not prove that the intended image is running?
questions.1.points.0: Record the desired fix in the source repository.
questions.1.points.1: Keep the recovered commit descended from known history.
questions.1.points.2: Verify the observed revision, health and real endpoint together.
questions.1.prompt: How do you preserve a recovery after GitOps self-heal?
