diagnostics.probe_0_0: Dostarczony platform.env może być brakujący, nieczytelny lub błędny, albo obserwacja kończy się przed nazwanym wynikiem; sprawdź składnię i wymagane zmienne bez wypisywania credentials. Fallback pojawia się tylko po błędzie grupy bez jej szczegółowego markera. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=private-git-provided-input-startup)
