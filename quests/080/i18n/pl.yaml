diagnostics.repo: Aplikacja może wskazywać inne repozytorium albo nie udał się odczyt API; porównaj repoURL z dostarczonym GIT_URL. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=private-git-source-repository)
diagnostics.path: Setup pozostawia ścieżkę retired; źródło musi prowadzić do względnego katalogu manifests bez ścieżki bezwzględnej ani przejścia do rodzica. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=private-git-manifest-path)
diagnostics.target: Aplikacja może śledzić inną referencję lub mieć nieczytelne źródło; targetRevision ma wskazywać main. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=private-git-tracked-branch)
diagnostics.synced: Błędna ścieżka, nieopublikowana zmiana lub błąd uzgodnienia mogą pozostawić sync.status inne niż Synced; sprawdź conditions i revision aplikacji. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=private-git-reconciliation)
diagnostics.revision_exists: 'Oczekiwany commit może brakować albo aplikacja zgłasza starszą revision: pierwszy etap używa zamrożonego baseline, drugi opublikowanego roboczego release-commit. Sam Synced nie dowodzi zgodności. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=private-git-stage-revision)'
diagnostics.revision: 'Oczekiwany commit może brakować albo aplikacja zgłasza starszą revision: pierwszy etap używa zamrożonego baseline, drugi opublikowanego roboczego release-commit. Sam Synced nie dowodzi zgodności. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=private-git-stage-revision)'
diagnostics.selfheal: Automatyczne uzgadnianie mogło zostać usunięte lub wyłączone; selfHeal musi być true w obu etapach, a prune jest dodatkowo wymagane w etapie wydania. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=private-git-automated-reconciliation)
diagnostics.prune: Automatyczne uzgadnianie mogło zostać usunięte lub wyłączone; selfHeal musi być true w obu etapach, a prune jest dodatkowo wymagane w etapie wydania. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=private-git-automated-reconciliation)
diagnostics.health: Aplikacja może być Synced mimo braku startu prywatnego image; sprawdź health conditions i zdarzenia Pod. Healthy wymagane jest w etapie wydania, nie przy początkowej naprawie ścieżki. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=private-git-release-health)
diagnostics.policy: Always może brakować w nazwanym kontenerze lub bieżących należących Pod, albo skuteczne odwołania pull różnią się od jedynego registry-pull; błędy API i struktury też dają secrets. Etap wymaga aktywnych Pod, jeszcze bez zatwierdzonego image wydania ani gotowości. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=private-git-initial-pull-contract)
diagnostics.secrets: Always może brakować w nazwanym kontenerze lub bieżących należących Pod, albo skuteczne odwołania pull różnią się od jedynego registry-pull; błędy API i struktury też dają secrets. Etap wymaga aktywnych Pod, jeszcze bez zatwierdzonego image wydania ani gotowości. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=private-git-initial-pull-contract)
diagnostics.fetch: Wydanie może pozostać lokalne, fetch zawieść, release-commit wskazywać inny remote head lub historia zostać zastąpiona. Opublikuj nowego potomka baseline do origin/main i zapisz go w release-commit; ponowna publikacja baseline nie wystarcza. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=private-git-published-descendant)
diagnostics.origin: Wydanie może pozostać lokalne, fetch zawieść, release-commit wskazywać inny remote head lub historia zostać zastąpiona. Opublikuj nowego potomka baseline do origin/main i zapisz go w release-commit; ponowna publikacja baseline nie wystarcza. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=private-git-published-descendant)
diagnostics.changed: Wydanie może pozostać lokalne, fetch zawieść, release-commit wskazywać inny remote head lub historia zostać zastąpiona. Opublikuj nowego potomka baseline do origin/main i zapisz go w release-commit; ponowna publikacja baseline nie wystarcza. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=private-git-published-descendant)
diagnostics.ancestor: Wydanie może pozostać lokalne, fetch zawieść, release-commit wskazywać inny remote head lub historia zostać zastąpiona. Opublikuj nowego potomka baseline do origin/main i zapisz go w release-commit; ponowna publikacja baseline nie wystarcza. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=private-git-published-descendant)
diagnostics.git_image: Opublikowany manifests/board.yaml może zachować mutable retired image, pominąć Always lub używać innych odwołań pull. Image nazwanego kontenera musi być dokładnie równy zamrożonemu wydaniu; pusty wykaz template może dziedziczyć registry-pull z żywego ServiceAccount. Błędy fetch, parsowania i API też dają git_image. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=private-git-published-manifest)
diagnostics.git_policy: Opublikowany manifests/board.yaml może zachować mutable retired image, pominąć Always lub używać innych odwołań pull. Image nazwanego kontenera musi być dokładnie równy zamrożonemu wydaniu; pusty wykaz template może dziedziczyć registry-pull z żywego ServiceAccount. Błędy fetch, parsowania i API też dają git_image. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=private-git-published-manifest)
diagnostics.git_secrets: Opublikowany manifests/board.yaml może zachować mutable retired image, pominąć Always lub używać innych odwołań pull. Image nazwanego kontenera musi być dokładnie równy zamrożonemu wydaniu; pusty wykaz template może dziedziczyć registry-pull z żywego ServiceAccount. Błędy fetch, parsowania i API też dają git_image. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=private-git-published-manifest)
diagnostics.live_image: Poprawiony plik Git mógł jeszcze nie trafić do żywego nazwanego kontenera; porównaj dokładny zamrożony image i Always. Błędy API, brak kontenera i wadliwa struktura też dają live_image. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=private-git-live-template)
diagnostics.live_policy: Poprawiony plik Git mógł jeszcze nie trafić do żywego nazwanego kontenera; porównaj dokładny zamrożony image i Always. Błędy API, brak kontenera i wadliwa struktura też dają live_image. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=private-git-live-template)
diagnostics.rollout: Rollout może być blokowany przez pull lub readiness, albo bieżący należący Pod jeszcze nie uruchamia dokładnego image z digest w stanie ready/running. Sam template nie wystarcza; błędy API i zamrożonych danych też dają image_id. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=private-git-ready-private-image)
diagnostics.image_id: Rollout może być blokowany przez pull lub readiness, albo bieżący należący Pod jeszcze nie uruchamia dokładnego image z digest w stanie ready/running. Sam template nie wystarcza; błędy API i zamrożonych danych też dają image_id. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=private-git-ready-private-image)
diagnostics.release_image: Pole zamrożonego image może brakować albo żądanie registry zawieść przez endpoint, credentials, CA lub dostępność. Kontrola żąda zamrożonego digest przez authenticated TLS z roboczymi platform.env i registry-ca.crt; nie porównuje hash endpoint ani credentials z pierwotną authority. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=private-git-authenticated-digest)
diagnostics.registry: Pole zamrożonego image może brakować albo żądanie registry zawieść przez endpoint, credentials, CA lub dostępność. Kontrola żąda zamrożonego digest przez authenticated TLS z roboczymi platform.env i registry-ca.crt; nie porównuje hash endpoint ani credentials z pierwotną authority. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=private-git-authenticated-digest)
diagnostics.http: Proces może zwracać starą odpowiedź lub routing Service nie działać; rzeczywiste żądanie na port 8080 po rollout ma zwrócić north-80. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=private-git-service-response)
diagnostics.probe_0_1: Obserwacja initial może zakończyć się przy odczycie platform.env lub ładowaniu Python helpers przed szczegółowym wynikiem; sprawdź dane i dostępność dq_check. Nazwane błędy image, policy, pull lub API zachowują własne markery. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=private-git-initial-observer-startup)
