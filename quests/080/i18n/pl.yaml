title: Odzyskiwanie dostawy
brief: 'Dostawa ma dwa niezależne błędy: prywatny Argo Application wskazuje na retired, a zatwierdzony
  workload odwołuje się do nieistniejącego private image tag. Najpierw przywróć manifests i udowodnij,
  że zamrożony inicjał commit to Synced; Pod będzie nadal zablokowany. Następnie napraw image w Git do
  immutable digest w private-release.json, commit i przepchnij do jednorazowej gałęzi main. Pozostaw pull
  authentication i self-heal włączone. Zakończ dopiero wtedy, gdy nowy zaobserwowany commit, wypchnięty
  manifest, aktualny container imageID, uwierzytelniony registry i HTTP north-80 zgodzą się.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `platform.env`, `registry-ca.crt`,
  `registry-pull.json`, `private-release.json`, `baseline-commit`, `application.json`, `release-commit`,
  `repository/manifests/board.json`, `repository/manifests/service.json`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: Początkowa prywatna wersja Git to Synced z manifests, a workload zachowuje
  uwierzytelnione pliki Always pull.'
debrief: Odzyskiwanie połączyło intencję private Git, tożsamość rejestru i rzeczywiste zachowanie workload
  bez łatki dostępnej tylko na żywo.
stages.0.brief: 'Kryteria sukcesu: Początkowa prywatna wersja Git ma stan Synced z manifests, a workload
  zachowuje uwierzytelnione pliki Always pull.'
stages.0.objectives.0.text: Początkowa prywatna wersja Git ma stan Synced z manifests, a workload zachowuje
  uwierzytelnione pliki Always pull.
stages.1.brief: 'Kryteria sukcesu: nowy potomek Gita zatwierdza zamrożone private digest, Argo is Healthy,
  prawdziwe dopasowania imageID i HTTP zwraca north-80.'
stages.1.objectives.0.text: Nowy potomek Gita zatwierdza zamrożone private digest, Argo is Healthy, prawdziwe
  dopasowania imageID, a HTTP zwraca north-80.
hints.0.text: Napraw uzgadnianie source przed zdiagnozowaniem pobrania image.
hints.1.text: Git commit może być Synced, podczas gdy jego image tag nie istnieje.
hints.2.text: Zatwierdź dostarczony immutable digest, zachowaj pull credentials i sprawdź zarówno Git,
  jak i działające imageID.
phrases.0: Wyodrębniłem awarię ścieżki source z pobierania private image.
phrases.1: Przypiąłem i zweryfikowałem immutable release w Git i runtime.
phrases.2: Podczas odzyskiwania zachowałem nienaruszone uwierzytelnianie i automatyczne uzgadnianie.
questions.0.points.0: Żądany manifest może odwoływać się do brakującego lub modyfikowalnego tag.
questions.0.points.1: Sprawdź rozwiązany digest i działający kontener imageID.
questions.0.points.2: Przetestuj pull authentication i rzeczywiste zachowanie aplikacji.
questions.0.prompt: Dlaczego Synced nie dowodzi, że zamierzony image działa?
questions.1.points.0: Zapisz żądaną poprawkę w repozytorium źródłowym.
questions.1.points.1: Zachowaj odzyskany commit ze znanej historii.
questions.1.points.2: Sprawdź razem zaobserwowane revision, health i rzeczywiste endpoint.
questions.1.prompt: Jak zachować odzyskiwanie po GitOps self-heal?
