title: Odzyskiwanie dostawy
brief: 'Pracuj w `~/quest` z `platform.env`, `registry-ca.crt`, `private-release.json`, `baseline-commit`, `application.json`,
  `release-commit`, `repository/manifests/board.json`, `repository/manifests/service.json` i `registry-pull.json`. Argo CD
  asynchronicznie porównuje rewizję Git z działającymi zasobami. Najpierw ustaw Application `board` na repozytorium `GIT_URL`,
  ścieżkę `manifests`, cel `main`, `selfHeal: true` i poczekaj na `Synced` przy `baseline-commit`. Działający Deployment musi
  zachować dokładnie `imagePullSecrets: [{name: registry-pull}]` i `imagePullPolicy: Always` pierwszego kontenera.


  Następnie zatwierdź i wyślij potomka baseline do prywatnego `origin/main`; zapisz jego hash w `release-commit`. Pierwszy
  obraz w commicie i działającym Deployment musi odpowiadać zamrożonemu obrazowi z `private-release.json` i używać `Always`;
  zatwierdzony manifest musi zachować dokładnie `registry-pull`. Application musi mieć `Synced` i `Healthy` przy `release-commit`,
  z `selfHeal` i `prune` true. Poczekaj na rollout board i HTTP `north-80` z `board:8080`; imageID niekończącego się gotowego
  Poda musi zawierać zamrożony digest, a uwierzytelniony dostęp z `registry-ca.crt` i `platform.env` musi pobrać ten digest.
  Kontrola nie dowodzi niezmienności działającego pull Secret. Chroń dane dostępowe i pracuj tylko w zatoce offline.'
debrief: Odzyskiwanie połączyło intencję private Git, tożsamość rejestru i rzeczywiste zachowanie workload bez łatki dostępnej
  tylko na żywo.
stages.0.brief: Źródło Application, synchronizacja baseline, self-heal i działające ustawienia pobierania odpowiadają opisowi.
stages.0.objectives.0.text: Źródło Application, synchronizacja baseline, self-heal i działające ustawienia pobierania odpowiadają
  opisowi.
stages.1.brief: Potomna rewizja, stan Application, sprawdzone pola obrazu Git i działającego Deployment, dostęp do rejestru
  i odpowiedź board odpowiadają opisowi.
stages.1.objectives.0.text: Potomna rewizja, stan Application, sprawdzone pola obrazu Git i działającego Deployment, dostęp
  do rejestru i odpowiedź board odpowiadają opisowi.
hints.0.text: Napraw uzgadnianie source przed zdiagnozowaniem pobrania image.
hints.1.text: Git commit może być Synced, podczas gdy jego image tag nie istnieje.
hints.2.text: Zatwierdź dostarczony immutable digest, zachowaj pull credentials i sprawdź zarówno Git, jak i działające imageID.
phrases.0: Wyodrębniłem awarię ścieżki source z pobierania private image.
phrases.1: Przypiąłem i zweryfikowałem immutable release w Git i runtime.
phrases.2: Podczas odzyskiwania zachowałem nienaruszone uwierzytelnianie i automatyczne uzgadnianie.
questions.0.points.0: Żądany manifest może odwoływać się do brakującego lub modyfikowalnego tag.
questions.0.points.1: Sprawdź rozwiązany digest i działający kontener imageID.
questions.0.points.2: Przetestuj pull authentication i rzeczywiste zachowanie aplikacji.
questions.0.prompt: Dlaczego Synced nie dowodzi, że zamierzony image działa?
questions.1.points.0: Zapisz żądaną poprawkę w repozytorium źródłowym.
questions.1.points.1: Zachowaj odzyskany commit ze znanej historii.
questions.1.points.2: Sprawdź razem zaobserwowane revision, health i rzeczywiste endpoint.
questions.1.prompt: Jak zachować odzyskiwanie po GitOps self-heal?
