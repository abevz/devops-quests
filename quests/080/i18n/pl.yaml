title: Odzyskiwanie dostawy
brief: "Prywatne wydanie nie dociera niezawodnie do odbiorców. Uzgodnienie i działający artefakt muszą być zgodne.\n\
  \nPracuj w `~/quest` na stacji roboczej. Dane wejściowe według etapu:\n- Etap 1: `platform.env`, `application.yaml`,\
  \ `private-release.json`, `registry-pull.yaml`, `registry-ca.crt`, `repository/manifests/board.yaml`, `repository/manifests/service.yaml`.\n\
  - Etap 2: `release-commit`.\n\n**Wymagania:**\n\n- Etap 1:\n  - Application `board` zgłasza `Synced` dla właściwej\
  \ opublikowanej rewizji. Automatycznie usuwa dryf.\n  - Deployment `board` zawsze sprawdza obraz przy uruchomieniu,\
  \ używając tylko istniejących danych prywatnego registry.\n- Etap 2:\n  - Application `board` zgłasza `Synced`\
  \ i `Healthy` dla opublikowanej rewizji wydania. Automatycznie usuwa dryf i zasoby, których nie ma już w pożądanym\
  \ wydaniu.\n  - Zdalna `main` odpowiada `release-commit`, różni się od pierwotnego commita i zachowuje go jako\
  \ przodka.\n  - Opublikowany manifest obciążenia używa dostarczonego zamrożonego obrazu i zachowuje wymagania\
  \ pobierania przy starcie oraz dostępu do prywatnego registry.\n  - Działający obraz `board` odpowiada dostarczonemu\
  \ zamrożonemu wydaniu i jest sprawdzany przy każdym starcie.\n  - Deployment `board` kończy rollout.\n  - Gotowy\
  \ kontener Poda aplikacji, który nie jest kończony, używa dostarczonego zamrożonego digestu obrazu.\n  - Uwierzytelniony\
  \ dostęp do prywatnego registry udostępnia digest dostarczonego zamrożonego wydania.\n  - Z Deployment `board`\
  \ adres `http://board:8080` zwraca `north-80`.\n\nSprawdzenie nie dowodzi, że działający Secret do pobierania\
  \ pozostał niezmieniony; bieżąca rewizja, digest gotowego kontenera i uwierzytelniony dostęp do registry to osobne\
  \ obserwacje."
debrief: Odzyskiwanie połączyło intencję private Git, tożsamość rejestru i rzeczywiste zachowanie workload bez łatki
  dostępnej tylko na żywo.
stages.0.brief: Zachowaj dostarczoną tożsamość wydania i dane pobierania.
stages.1.brief: Opublikowane wydanie potomne musi dotrzeć do gotowego odbiorcy.
hints.0.text: Napraw uzgadnianie source przed zdiagnozowaniem pobrania image.
hints.1.text: 'Git commit może być Synced, podczas gdy jego image tag nie istnieje.


  Sprawdź dostarczone definicje, opisy zasobów i zdarzenia odpowiedniego etapu.


  ```sh

  git -C repository log --all --oneline

  kubectl describe application board

  kubectl describe deployment board

  kubectl describe pod -l app=board

  ```


  Etap 1/2: Sprawdź te definicje zasobów dla tego etapu.


  ```sh

  kubectl get application board -o yaml

  kubectl get deployment board -o yaml

  kubectl get pods -l app=board -o yaml

  ```


  Etap 2: Sprawdź te definicje zasobów dla tego etapu.


  ```sh

  git -C repository show origin/main:manifests/board.yaml

  ```'
hints.2.text: 'Zatwierdź dostarczony immutable digest, zachowaj pull credentials i sprawdź zarówno Git, jak i działające
  imageID. Opublikuj commit potomny w `origin/main` i zapisz jego hash w `release-commit`.


  Sprawdź naprawiony etap i porównaj obserwowany wynik.


  Etap 1/2: Kontroler zgłasza `Synced` dla oczekiwanej rewizji; w ostatnim etapie zgłasza też `Healthy`, a obciążenie
  jest gotowe.


  ```sh

  kubectl get application board -o jsonpath=''{.status.sync.status} {.status.health.status} {.status.sync.revision}'';
  printf ''\n''

  kubectl get deployment board

  ```


  Etap 2: Opublikowany hash odpowiada zapisanemu wydaniu; sprawdzenie pochodzenia, jeśli występuje, kończy się kodem
  `0`.


  ```sh

  source platform.env

  cat release-commit

  git -C repository ls-remote origin refs/heads/main

  git -C repository merge-base --is-ancestor "$(cat baseline-commit)" origin/main

  ```


  Etap 2: Aplikacja zwraca `north-80`; uwierzytelnione pobranie zapisanego digestu z registry zwraca HTTP `200`.


  ```sh

  source platform.env

  kubectl exec deployment/board -- wget -qO- -T 3 http://board:8080

  printf ''\n''

  image=$(jq -r .image private-release.json)

  curl -fsS --max-time 4 --config <(printf ''user = "%s:%s"\n'' "$REGISTRY_USER" "$REGISTRY_PASSWORD") --cacert
  registry-ca.crt -H ''Accept: application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json''
  -o /dev/null -w ''%{http_code}\n'' "https://$REGISTRY/v2/parcel/manifests/${image##*@}"

  ```


  Oczekiwane obserwacje dla całego etapu:

  - Etap 1/2: Wyświetlone uzgodnienie, konfiguracja obciążenia i obserwacje działającego obrazu spełniają wymagania
  tego etapu.

  - Etap 2: Zdalny hash odpowiada `release-commit`, manifest spełnia wymagania, a sprawdzenie pochodzenia kończy
  się kodem `0` przy innym hashu wydania.'
phrases.0: Wyodrębniłem awarię ścieżki source z pobierania private image.
phrases.1: Przypiąłem i zweryfikowałem immutable release w Git i runtime.
phrases.2: Podczas odzyskiwania zachowałem nienaruszone uwierzytelnianie i automatyczne uzgadnianie.
questions.0.points.0: Żądany manifest może odwoływać się do brakującego lub modyfikowalnego tag.
questions.0.points.1: Sprawdź rozwiązany digest i działający kontener imageID.
questions.0.points.2: Przetestuj pull authentication i rzeczywiste zachowanie aplikacji.
questions.0.prompt: Dlaczego Synced nie dowodzi, że zamierzony image działa?
questions.1.points.0: Zapisz żądaną poprawkę w repozytorium źródłowym.
questions.1.points.1: Zachowaj odzyskany commit ze znanej historii.
questions.1.points.2: Sprawdź razem zaobserwowane revision, health i rzeczywiste endpoint.
questions.1.prompt: Jak zachować odzyskiwanie po GitOps self-heal?
diagnostics.repo: application/board repoURL musi być równe GIT_URL.
diagnostics.path: application/board source.path musi być równe manifests.
diagnostics.target: application/board targetRevision musi być równe main.
diagnostics.synced: application/board sync.status musi być równe Synced.
diagnostics.revision_exists: Oczekiwana rewizja Git musi istnieć i być niepusta.
diagnostics.revision: Rewizja synchronizacji application/board musi być równa oczekiwanej rewizji Git.
diagnostics.selfheal: application/board selfHeal musi być równe true.
diagnostics.health: application/board health.status musi być równe Healthy.
diagnostics.prune: application/board prune musi być równe true.
diagnostics.secrets: deployment/board imagePullSecrets musi być równe [registry-pull].
diagnostics.policy: deployment/board imagePullPolicy musi być równe Always.
diagnostics.rollout: Wdrożenie deployment/board musi się zakończyć.
diagnostics.http: Żądanie do board:8080 musi zwrócić north-80.
diagnostics.release_image: private-release.json image musi istnieć i być niepuste.
diagnostics.fetch: git fetch origin main musi się powieść.
diagnostics.origin: origin/main musi być równe release-commit.
diagnostics.changed: release-commit musi różnić się od baseline-commit.
diagnostics.ancestor: baseline-commit musi być przodkiem origin/main.
diagnostics.git_image: Pierwszy obraz board w Git musi odpowiadać obrazowi z private-release.json.
diagnostics.git_policy: imagePullPolicy board w Git musi wynosić Always.
diagnostics.git_secrets: imagePullSecrets board w Git musi wynosić [registry-pull].
diagnostics.live_image: deployment/board containers[0].image musi być równe private-release.json image.
diagnostics.live_policy: deployment/board imagePullPolicy musi być równe Always.
diagnostics.image_id: Pod board nieoznaczony do usunięcia musi mieć gotowy kontener, którego imageID zawiera zamrożony
  digest.
diagnostics.registry: Uwierzytelniony rejestr musi udostępniać zamrożony digest.
