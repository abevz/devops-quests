diagnostics.probe_0_0: Выданный platform.env может отсутствовать, не читаться или содержать ошибку; наблюдение также может оборваться до именованного результата. Проверьте синтаксис и нужные переменные без вывода credentials. Fallback появляется только при сбое группы без её подробного маркера. [Причина и проверка](guides#guide=gitops-delivery&section=private-git-provided-input-startup)
