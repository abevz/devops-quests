title: Восстановление доставки
brief: 'У доставки две независимые неисправности: приватный Argo Application смотрит на retired, а workload
  в Git использует несуществующий private image tag. Сначала верните manifests и подтвердите Synced для
  исходного сохранённого commit; Pod пока останется заблокированным. Затем замените image в Git на immutable
  digest из private-release.json, закоммитьте и отправьте в main одноразового репозитория. Сохраните pull
  authentication и self-heal. Итог готов, когда согласованы новый наблюдаемый commit, manifest в Git,
  реальный container imageID, аутентифицированный registry и HTTP north-80.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `platform.env`, `registry-ca.crt`,
  `registry-pull.json`, `private-release.json`, `baseline-commit`, `application.json`, `release-commit`,
  `repository/manifests/board.json`, `repository/manifests/service.json`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Исходный private Git revision Synced из manifests, workload сохраняет Always pull
  с аутентификацией.'
debrief: Восстановление согласовало private Git, identity registry и реальное поведение workload без исправления
  только live-состояния.
