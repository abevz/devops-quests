title: Восстановление доставки
brief: 'Работайте в `~/quest` с `platform.env`, `registry-ca.crt`, `private-release.json`, `baseline-commit`, `application.json`,
  `release-commit`, `repository/manifests/board.json`, `repository/manifests/service.json` и `registry-pull.json`. Argo CD
  асинхронно сравнивает ревизию Git с работающими ресурсами. Сначала настройте Application `board` на репозиторий `GIT_URL`,
  путь `manifests`, цель `main`, `selfHeal: true` и дождитесь `Synced` на `baseline-commit`. Работающий Deployment должен
  сохранить ровно `imagePullSecrets: [{name: registry-pull}]` и `imagePullPolicy: Always` первого контейнера.


  Затем создайте и отправьте потомка baseline в приватный `origin/main`; запишите его хеш в `release-commit`. Первый образ
  в коммите и работающем Deployment должен совпадать с зафиксированным образом из `private-release.json` и использовать `Always`;
  манифест в коммите должен сохранить ровно `registry-pull`. Application должна быть `Synced` и `Healthy` на `release-commit`,
  с `selfHeal` и `prune` true. Дождитесь rollout board и HTTP `north-80` от `board:8080`; imageID незавершающегося готового
  Pod должен содержать зафиксированный digest, а аутентифицированный доступ с `registry-ca.crt` и `platform.env` должен получить
  этот digest. Проверка не доказывает неизменность работающего pull Secret. Берегите учётные данные и работайте только в офлайн-песочнице.'
debrief: Восстановление согласовало private Git, identity registry и реальное поведение workload без исправления только live-состояния.
stages.0.brief: Источник Application, базовая синхронизация, self-heal и текущие настройки загрузки соответствуют описанию.
stages.0.objectives.0.text: Источник Application, базовая синхронизация, self-heal и текущие настройки загрузки соответствуют
  описанию.
stages.1.brief: Дочерняя ревизия, статус Application, проверенные поля образов Git и работающего Deployment, доступ к реестру
  и ответ board соответствуют описанию.
stages.1.objectives.0.text: Дочерняя ревизия, статус Application, проверенные поля образов Git и работающего Deployment, доступ
  к реестру и ответ board соответствуют описанию.
hints.0.text: Исправьте сверку source до анализа получения image.
hints.1.text: Git commit может быть Synced с несуществующим image tag.
hints.2.text: Закоммитьте выданный immutable digest, сохраните pull credentials, проверьте Git и работающий imageID.
phrases.0: Я отделил ошибку пути source от получения private image.
phrases.1: Я закрепил и проверил immutable release в Git и runtime.
phrases.2: При восстановлении я сохранил аутентификацию и автоматическую сверку.
questions.0.points.0: Желаемый manifest может ссылаться на отсутствующий или изменяемый tag.
questions.0.points.1: Проверить digest и imageID работающего контейнера.
questions.0.points.2: Проверить pull authentication и реальное поведение приложения.
questions.0.prompt: Почему Synced не доказывает запуск нужного image?
questions.1.points.0: Записать требуемое исправление в исходном репозитории.
questions.1.points.1: Сохранить происхождение commit от известной истории.
questions.1.points.2: Вместе проверить наблюдаемый revision, health и реальный endpoint.
questions.1.prompt: Как сохранить исправление при GitOps self-heal?
diagnostics.repo: application/board repoURL должен совпадать с GIT_URL.
diagnostics.path: application/board source.path должен совпадать с manifests.
diagnostics.target: application/board targetRevision должен совпадать с main.
diagnostics.synced: application/board sync.status должен совпадать с Synced.
diagnostics.revision_exists: Ожидаемая ревизия Git должна существовать и быть непустой.
diagnostics.revision: Ревизия синхронизации application/board должна совпадать с ожидаемой ревизией Git.
diagnostics.selfheal: application/board selfHeal должен совпадать с true.
diagnostics.health: application/board health.status должен совпадать с Healthy.
diagnostics.prune: application/board prune должен совпадать с true.
diagnostics.secrets: deployment/board imagePullSecrets должен совпадать с [registry-pull].
diagnostics.policy: deployment/board imagePullPolicy должен совпадать с Always.
diagnostics.rollout: Выкатка deployment/board должна завершиться.
diagnostics.http: Запрос к board:8080 должен вернуть north-80.
diagnostics.release_image: private-release.json image должен существовать и быть непустым.
diagnostics.fetch: git fetch origin main должен завершиться успешно.
diagnostics.origin: origin/main должен совпадать с release-commit.
diagnostics.changed: release-commit должен отличаться от baseline-commit.
diagnostics.ancestor: baseline-commit должен быть предком origin/main.
diagnostics.git_image: Первый образ board в Git должен совпадать с образом из private-release.json.
diagnostics.git_policy: imagePullPolicy board в Git должен быть Always.
diagnostics.git_secrets: imagePullSecrets board в Git должен совпадать с [registry-pull].
diagnostics.live_image: deployment/board containers[0].image должен совпадать с private-release.json image.
diagnostics.live_policy: deployment/board imagePullPolicy должен совпадать с Always.
diagnostics.image_id: У Pod board, не отмеченного для удаления, должен быть готовый контейнер, чей imageID содержит зафиксированный
  digest.
diagnostics.registry: Реестр с аутентификацией должен отдавать зафиксированный digest.
