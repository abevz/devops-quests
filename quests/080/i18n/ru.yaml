diagnostics.repo: Приложение может ссылаться на другой репозиторий, либо API-объект не прочитан; сравните repoURL с выданным GIT_URL. [Причина и проверка](guides#guide=gitops-delivery&section=private-git-source-repository)
diagnostics.path: Setup оставляет путь retired; источник должен разрешаться в относительный каталог manifests без абсолютного пути и перехода к родителю. [Причина и проверка](guides#guide=gitops-delivery&section=private-git-manifest-path)
diagnostics.target: Приложение может отслеживать другую ссылку либо не иметь читаемого источника; targetRevision выбирает main. [Причина и проверка](guides#guide=gitops-delivery&section=private-git-tracked-branch)
diagnostics.synced: Неверный путь, неопубликованное изменение или ошибка согласования могут оставить sync.status отличным от Synced; изучите conditions и revision приложения. [Причина и проверка](guides#guide=gitops-delivery&section=private-git-reconciliation)
diagnostics.revision_exists: 'Ожидаемый commit может отсутствовать, а приложение показывать старую revision: первый этап использует зафиксированный baseline, второй — опубликованный рабочий release-commit. Одного Synced недостаточно для равенства. [Причина и проверка](guides#guide=gitops-delivery&section=private-git-stage-revision)'
diagnostics.revision: 'Ожидаемый commit может отсутствовать, а приложение показывать старую revision: первый этап использует зафиксированный baseline, второй — опубликованный рабочий release-commit. Одного Synced недостаточно для равенства. [Причина и проверка](guides#guide=gitops-delivery&section=private-git-stage-revision)'
diagnostics.selfheal: Автоматическое согласование могло быть удалено или выключено; selfHeal нужен в обоих этапах, prune дополнительно требуется на этапе релиза. [Причина и проверка](guides#guide=gitops-delivery&section=private-git-automated-reconciliation)
diagnostics.prune: Автоматическое согласование могло быть удалено или выключено; selfHeal нужен в обоих этапах, prune дополнительно требуется на этапе релиза. [Причина и проверка](guides#guide=gitops-delivery&section=private-git-automated-reconciliation)
diagnostics.health: Приложение может быть Synced, хотя приватный image не запускается; изучите health conditions и события Pod. Healthy требуется на этапе релиза, а не при начальном исправлении пути. [Причина и проверка](guides#guide=gitops-delivery&section=private-git-release-health)
diagnostics.policy: Always может отсутствовать у именованного контейнера или текущих принадлежащих ему Pod, а эффективные pull-ссылки отличаться от единственного registry-pull; ошибки API и структуры также дают secrets. Здесь нужны активные Pod, но ещё не одобренный image релиза или готовность. [Причина и проверка](guides#guide=gitops-delivery&section=private-git-initial-pull-contract)
diagnostics.secrets: Always может отсутствовать у именованного контейнера или текущих принадлежащих ему Pod, а эффективные pull-ссылки отличаться от единственного registry-pull; ошибки API и структуры также дают secrets. Здесь нужны активные Pod, но ещё не одобренный image релиза или готовность. [Причина и проверка](guides#guide=gitops-delivery&section=private-git-initial-pull-contract)
diagnostics.fetch: Релиз мог остаться локальным, fetch завершиться ошибкой, release-commit указывать другой remote head, а история быть заменена. Опубликуйте нового потомка baseline в origin/main и сохраните его в release-commit; повторной публикации baseline недостаточно. [Причина и проверка](guides#guide=gitops-delivery&section=private-git-published-descendant)
diagnostics.origin: Релиз мог остаться локальным, fetch завершиться ошибкой, release-commit указывать другой remote head, а история быть заменена. Опубликуйте нового потомка baseline в origin/main и сохраните его в release-commit; повторной публикации baseline недостаточно. [Причина и проверка](guides#guide=gitops-delivery&section=private-git-published-descendant)
diagnostics.changed: Релиз мог остаться локальным, fetch завершиться ошибкой, release-commit указывать другой remote head, а история быть заменена. Опубликуйте нового потомка baseline в origin/main и сохраните его в release-commit; повторной публикации baseline недостаточно. [Причина и проверка](guides#guide=gitops-delivery&section=private-git-published-descendant)
diagnostics.ancestor: Релиз мог остаться локальным, fetch завершиться ошибкой, release-commit указывать другой remote head, а история быть заменена. Опубликуйте нового потомка baseline в origin/main и сохраните его в release-commit; повторной публикации baseline недостаточно. [Причина и проверка](guides#guide=gitops-delivery&section=private-git-published-descendant)
diagnostics.git_image: Опубликованный manifests/board.yaml может сохранять mutable retired image, не иметь Always или использовать другие pull-ссылки. Image именованного контейнера должен точно совпадать с зафиксированным релизом; пустой список template может наследовать registry-pull от живого ServiceAccount. Ошибки fetch, разбора и API также дают git_image. [Причина и проверка](guides#guide=gitops-delivery&section=private-git-published-manifest)
diagnostics.git_policy: Опубликованный manifests/board.yaml может сохранять mutable retired image, не иметь Always или использовать другие pull-ссылки. Image именованного контейнера должен точно совпадать с зафиксированным релизом; пустой список template может наследовать registry-pull от живого ServiceAccount. Ошибки fetch, разбора и API также дают git_image. [Причина и проверка](guides#guide=gitops-delivery&section=private-git-published-manifest)
diagnostics.git_secrets: Опубликованный manifests/board.yaml может сохранять mutable retired image, не иметь Always или использовать другие pull-ссылки. Image именованного контейнера должен точно совпадать с зафиксированным релизом; пустой список template может наследовать registry-pull от живого ServiceAccount. Ошибки fetch, разбора и API также дают git_image. [Причина и проверка](guides#guide=gitops-delivery&section=private-git-published-manifest)
diagnostics.live_image: Исправленный файл Git мог ещё не попасть в живой именованный контейнер; сравните точный зафиксированный image и Always. Ошибки API, отсутствия контейнера и структуры также дают live_image. [Причина и проверка](guides#guide=gitops-delivery&section=private-git-live-template)
diagnostics.live_policy: Исправленный файл Git мог ещё не попасть в живой именованный контейнер; сравните точный зафиксированный image и Always. Ошибки API, отсутствия контейнера и структуры также дают live_image. [Причина и проверка](guides#guide=gitops-delivery&section=private-git-live-template)
diagnostics.rollout: Rollout может блокироваться pull или readiness, либо текущий принадлежащий Pod ещё не запускает точный image с его digest в ready/running состоянии. Одного template недостаточно; ошибки API и зафиксированных входных данных также дают image_id. [Причина и проверка](guides#guide=gitops-delivery&section=private-git-ready-private-image)
diagnostics.image_id: Rollout может блокироваться pull или readiness, либо текущий принадлежащий Pod ещё не запускает точный image с его digest в ready/running состоянии. Одного template недостаточно; ошибки API и зафиксированных входных данных также дают image_id. [Причина и проверка](guides#guide=gitops-delivery&section=private-git-ready-private-image)
diagnostics.release_image: Поле зафиксированного image может отсутствовать, либо запрос registry не пройти из-за endpoint, credentials, CA или доступности. Проверка запрашивает зафиксированный digest по authenticated TLS с рабочими platform.env и registry-ca.crt; хэши endpoint или credentials с исходной authority не сравниваются. [Причина и проверка](guides#guide=gitops-delivery&section=private-git-authenticated-digest)
diagnostics.registry: Поле зафиксированного image может отсутствовать, либо запрос registry не пройти из-за endpoint, credentials, CA или доступности. Проверка запрашивает зафиксированный digest по authenticated TLS с рабочими platform.env и registry-ca.crt; хэши endpoint или credentials с исходной authority не сравниваются. [Причина и проверка](guides#guide=gitops-delivery&section=private-git-authenticated-digest)
diagnostics.http: Процесс может отдавать старый ответ либо маршрут Service не работать; реальный запрос на порт 8080 после rollout должен вернуть north-80. [Причина и проверка](guides#guide=gitops-delivery&section=private-git-service-response)
diagnostics.probe_0_1: Наблюдение initial может оборваться при чтении platform.env или загрузке Python helpers до подробного результата; проверьте выданный файл и доступность dq_check. Именованные ошибки image, policy, pull или API сохраняют собственные маркеры. [Причина и проверка](guides#guide=gitops-delivery&section=private-git-initial-observer-startup)
