title: procedencia de git
brief: 'El board está en buen estado, pero su informe de incidentes confunde la confirmación de la fuente
  de la imagen con la confirmación posterior del manifiesto de implementación. Rastree la imagen inmutable
  en ejecución a través del registry manifest y config label org.opencontainers.image.revision privado
  hasta el origen privado Git. Escriba provenance.json exactamente con la imagen, la confirmación y el
  repositorio. El recibo de liberación congelado identifica el artifact esperado; verifique sus bytes
  registry reales y la fuente ancestry. Se trata de metadatos de trazabilidad, no de una firma o prueba
  de una compilación confiable.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `platform.env`, `release-evidence.json`,
  `provenance.json`, `source-commit`, `release-commit`, `repository/site/index.html`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: el informe coincide con la fuente digest, registry config en ejecución
  real, revision y la fuente privada Git; el board se mantiene en buen estado.'
debrief: El incidente ahora vincula los bytes en ejecución con la revisión de la fuente y mantiene la
  confianza como una pregunta separada.
stages.0.brief: 'Criterios de éxito: el informe coincide con la fuente digest, registry config en ejecución
  real, revision y la fuente privada Git; el board se mantiene en buen estado.'
stages.0.objectives.0.text: El informe coincide con la fuente digest, registry config en ejecución real,
  revision y la fuente privada Git; el board se mantiene en buen estado.
hints.0.text: Una confirmación de manifiesto puede hacer referencia a una imagen creada a partir de una
  confirmación anterior.
hints.1.text: Resuelva manifest → config blob → OCI revision label; comparar Git ancestry.
hints.2.text: Registre la imagen digest, la confirmación de origen y el repositorio privado URL, sin tratar
  un label como una firma.
phrases.0: Distinguí la revisión de la fuente de la revisión de la implementación.
phrases.1: Verifiqué el manifest digest y la imagen config en el registry.
phrases.2: Traté la procedencia sin firmar como trazabilidad, no como certificación.
questions.0.points.0: No; labels son suministrados por el constructor.
questions.0.points.1: Un resumen identifica bytes; Las firmas y attestations agregan evidencia de confianza
  separada.
questions.0.prompt: ¿Una revisión OCI coincidente, label, demuestra ser una compilación confiable?
questions.1.points.0: Una confirmación construye el artifact; una confirmación posterior lo selecciona
  en la configuración de implementación.
questions.1.points.1: Rastree ambas revisiones y conserve su relación.
questions.1.prompt: ¿Por qué GitOps revision puede diferir de la imagen revision?
