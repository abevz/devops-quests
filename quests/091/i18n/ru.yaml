title: Прослеживаемость исходников образа
brief: |-
  Board обслуживает запросы, но записи об исходниках на рабочей станции и в публикации не заполнены. Проследите работающий неизменяемый образ до его настоящих исходников и доставьте запись работающему потребителю.

  Работайте на workstation в `~/quest` с файлами `platform.env`, `provenance.json`, `release-commit`, `repository/`.

  Если не указано иное, ресурсы Kubernetes находятся в namespace песочницы (`DQ_NAMESPACE`); пути в `~/quest` — на workstation.

  **Requirements:**

  - Опубликованная `origin/main` совпадает с `~/quest/release-commit` на workstation.
  - Application `board` сохраняет предоставленный приватный источник Git, ветку релиза и существующий каталог нагрузки.
  - Application `board` сообщает `Synced` и `Healthy` для коммита из `~/quest/release-commit` на workstation.
  - Deployment `board` завершает rollout в namespace песочницы.
  - Внутри Pod Deployment `board` адрес `http://board:8080` возвращает `north-91`.
  - Файл `~/quest/provenance.json` на workstation верно связывает работающий образ, его реальные байты в реестре и исходный коммит с историей приватного Git.

    - Файл `provenance.json` на workstation содержит ровно `image`, `commit` и `repo`. Исходный коммит образа отличается от `release-commit`, предшествует опубликованному релизу в истории Git и содержит в репозитории `site/index.html` со значением `north-91`. Отчёт согласован с работающим digest, реальными байтами реестра и метаданными источника реестра.

  - Запись об исходниках в опубликованном `repository/manifests/provenance.yaml`, работающем ConfigMap `build-record` и `http://board:8080/provenance.json` совпадает с `~/quest/provenance.json` на рабочей станции. Публикуйте конфигурацию через выданный GitOps-источник; сохраните неизменяемый образ и доступность основного endpoint.

  Это метаданные прослеживаемости, а не подпись или доказательство доверенной сборки.
debrief: Проследите работающий артефакт до исходников и доставьте подтверждённую запись через существующего
  GitOps-потребителя; неподписанные metadata не подтверждают доверенную сборку.
stages.0.brief: Различайте происхождение исходного кода образа и историю развёртывания.
hints.0.text: Коммит манифеста может ссылаться на образ из более раннего коммита.
hints.1.text: |-
  Сравните digest работающего образа, metadata манифеста и config в registry и происхождение коммитов Git. Затем сравните запись на рабочей станции, опубликованную конфигурацию и файл, смонтированный в работающем Pod.

  Найдите метку ревизии OCI в метаданных конфигурации манифеста. Отдельно сравните её с коммитом развёртывания и проверьте тип монтирования у действующего процесса.

  ```bash
  git -C repository log --oneline -5
  kubectl get deployment board -o yaml
  kubectl get configmap -o yaml
  cat provenance.json
  ```
hints.2.text: |-
  После доставки проверьте отчёт, опубликованный коммит, revision контроллера, неизменяемый digest работающего образа и опубликованную через HTTP запись.

  ```sh
  source platform.env
  git -C repository ls-remote origin refs/heads/main
  cat release-commit
  cat provenance.json
  kubectl get application board -o yaml
  kubectl rollout status deployment/board --timeout=3s
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080/provenance.json
  ```

  ```sh
  (
    set -euo pipefail
    cd ~/quest
    source platform.env
    image=$(jq -er .image provenance.json)
    digest=${image##*@}
    deployment_uid=$(kubectl get deployment board -o jsonpath='{.metadata.uid}')
    sets=$(kubectl get rs -o json | jq -c --arg owner "$deployment_uid" '
      [.items[] | select(any(.metadata.ownerReferences[]?; .kind=="Deployment" and .controller==true and .uid==$owner)) | .metadata.uid]')
    kubectl get pods -o json | jq -e --argjson sets "$sets" --arg image "$image" --arg digest "$digest" '
      [.items[] | select(.metadata.deletionTimestamp==null and .status.phase=="Running" and
        any(.metadata.ownerReferences[]?; .kind=="ReplicaSet" and .controller==true and (.uid as $uid | $sets | index($uid)!=null)))]
      | any(.[]; any(.spec.containers[]; .name=="worker" and .image==$image) and
        any(.status.containerStatuses[]?; .name=="worker" and .ready==true and
          ((.imageID | split("@") | last | split("/") | last) == $digest)))'
    kubectl get configmap build-record -o json |
      jq -e --slurpfile record provenance.json '(.data["provenance.json"] | fromjson) == $record[0]'
    kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080/provenance.json |
      jq -e --slurpfile record provenance.json '. == $record[0]'
  )
  ```
phrases.0: Я различил ревизию исходников и ревизию выкатки.
phrases.1: Я проверил digest manifest и config образа в registry.
phrases.2: Я использовал неподписанные метаданные для трассировки, а не аттестации.
questions.0.points.0: 'Нет: labels задаёт сборщик.'
questions.0.points.1: Digest определяет байты; подписи и attestations добавляют отдельные свидетельства
  доверия.
questions.0.prompt: Доказывает ли совпадающий OCI label доверенность сборки?
questions.1.points.0: Один коммит создаёт artifact; следующий выбирает его в конфигурации выкатки.
questions.1.points.1: Прослеживайте обе ревизии и их связь.
questions.1.prompt: Почему GitOps revision может отличаться от ревизии образа?
stages.0.objectives.0.text: Опубликованная `origin/main` совпадает с `~/quest/release-commit` на workstation.
stages.0.objectives.1.text: Application `board` сохраняет предоставленный приватный источник Git, ветку
  релиза и существующий каталог нагрузки.
stages.0.objectives.2.text: Application `board` сообщает `Synced` и `Healthy` для коммита из `~/quest/release-commit`
  на workstation.
stages.0.objectives.3.text: Deployment `board` завершает rollout в namespace песочницы.
stages.0.objectives.4.text: Внутри Pod Deployment `board` адрес `http://board:8080` возвращает `north-91`.
stages.0.objectives.5.text: Файл `~/quest/provenance.json` на workstation верно связывает работающий образ,
  его реальные байты в реестре и исходный коммит с историей приватного Git. Опубликованная конфигурация
  и работающий потребитель показывают подтверждённую запись об исходниках с рабочей станции.
diagnostics.provenance_head: release-commit может сохранять прошлый deployment после публикации записи, либо выданный platform input или private Git fetch не проходят; сравните полученный origin/main с текущей квитанцией релиза рабочей станции. [Причина и проверка](guides#guide=gitops-delivery&section=image-source-record-published-release-head)
diagnostics.provenance_source: Приложение могло быть перенаправлено в другой репозиторий, ветку или каталог, либо чтение входов/API не прошло; сохраните выданный Git URL, ветку main и относительный путь к manifests без перехода к родителю. [Причина и проверка](guides#guide=gitops-delivery&section=image-source-record-retained-git-source)
diagnostics.provenance_sync: Приложение может показывать старую revision, оставаться нездоровым или иметь выключенные self-healing/pruning; дождитесь Synced и Healthy на release-commit с обоими флагами true. Эти статусы сами не доказывают обновление уже смонтированного metadata-файла. [Причина и проверка](guides#guide=gitops-delivery&section=image-source-record-current-reconciled-release)
diagnostics.provenance_rollout: Текущий rollout может ещё сходиться, либо подготовка image и готовность контейнера блокируют его; изучите существующие Pod и события, сохраняя выданный неизменяемый image приложения. [Причина и проверка](guides#guide=gitops-delivery&section=image-source-record-workload-readiness)
diagnostics.provenance_http: Основной Service может быть недоступен, либо исправление metadata скрыло исходную страницу image; сохраните ответ north-91 при публикации source record. Только metadata-ответ не выполняет отдельное условие основного endpoint. [Причина и проверка](guides#guide=gitops-delivery&section=image-source-record-main-endpoint)
diagnostics.probe_0_5: Отчёт может оставаться пустым или использовать deployment commit вместо реального более раннего source commit image; сравните зафиксированный image, байты registry manifest, revision metadata и Git history. Ошибки входов, registry, API или позднего чтения доставки записи также дают fallback до именованного сравнения. [Причина и проверка](guides#guide=gitops-delivery&section=image-source-record-verified-source-observation)
diagnostics.provenance_delivery: Опубликованный manifest или живой ConfigMap могут сохранять исходную пустую запись, либо существующий Pod хранить старый subPath-файл после изменения ConfigMap. Опубликуйте проверенный отчёт через Git и обновите потребителя до совпадения published, live и served JSON. [Причина и проверка](guides#guide=gitops-delivery&section=image-source-record-published-and-mounted-record)
