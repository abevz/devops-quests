title: Прослеживаемость исходников образа
brief: |-
  Board обслуживает запросы, но записи об исходниках на рабочей станции и в публикации не заполнены. Проследите работающий неизменяемый образ до его настоящих исходников и доставьте запись работающему потребителю.

  Работайте на workstation в `~/quest` с файлами `platform.env`, `provenance.json`, `release-commit`, `repository/`.

  Если не указано иное, ресурсы Kubernetes находятся в namespace песочницы (`DQ_NAMESPACE`); пути в `~/quest` — на workstation.

  **Requirements:**

  - Опубликованная `origin/main` совпадает с `~/quest/release-commit` на workstation.
  - Application `board` сохраняет предоставленный приватный источник Git, ветку релиза и существующий каталог нагрузки.
  - Application `board` сообщает `Synced` и `Healthy` для коммита из `~/quest/release-commit` на workstation.
  - Deployment `board` завершает rollout в namespace песочницы.
  - Внутри Pod Deployment `board` адрес `http://board:8080` возвращает `north-91`.
  - Файл `~/quest/provenance.json` на workstation верно связывает работающий образ, его реальные байты в реестре и исходный коммит с историей приватного Git.

    - Файл `provenance.json` на workstation содержит ровно `image`, `commit` и `repo`. Исходный коммит образа отличается от `release-commit`, предшествует опубликованному релизу в истории Git и содержит в репозитории `site/index.html` со значением `north-91`. Отчёт согласован с работающим digest, реальными байтами реестра и метаданными источника реестра.

  - Запись об исходниках в опубликованном `repository/manifests/provenance.yaml`, работающем ConfigMap `build-record` и `http://board:8080/provenance.json` совпадает с `~/quest/provenance.json` на рабочей станции. Публикуйте конфигурацию через выданный GitOps-источник; сохраните неизменяемый образ и доступность основного endpoint.

  Это метаданные прослеживаемости, а не подпись или доказательство доверенной сборки.
debrief: Проследите работающий артефакт до исходников и доставьте подтверждённую запись через существующего
  GitOps-потребителя; неподписанные metadata не подтверждают доверенную сборку.
stages.0.brief: Различайте происхождение исходного кода образа и историю развёртывания.
hints.0.text: Коммит манифеста может ссылаться на образ из более раннего коммита.
hints.1.text: |-
  Сравните digest работающего образа, metadata манифеста и config в registry и происхождение коммитов Git. Затем сравните запись на рабочей станции, опубликованную конфигурацию и файл, смонтированный в работающем Pod.

  ```bash
  git -C repository log --oneline -5
  kubectl get deployment board -o yaml
  kubectl get configmap -o yaml
  cat provenance.json
  ```
hints.2.text: |-
  Прочитайте метку OCI revision из config blob манифеста и сравните её с историей Git; не путайте исходный коммит образа с коммитом развёртывания. Опубликуйте найденную запись в выданном манифесте ConfigMap и отправьте существующий каталог приложения в Git. Дождитесь контроллера. Файл ConfigMap, смонтированный через `subPath`, не обновляется внутри существующего Pod: обновите потребителя, сохранив идентичность образа.

  После доставки проверьте отчёт, опубликованный коммит, revision контроллера, неизменяемый digest работающего образа и опубликованную через HTTP запись.

  ```sh
  source platform.env
  git -C repository ls-remote origin refs/heads/main
  cat release-commit
  cat provenance.json
  kubectl get application board -o yaml
  kubectl rollout status deployment/board --timeout=3s
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080/provenance.json
  ```
phrases.0: Я различил ревизию исходников и ревизию выкатки.
phrases.1: Я проверил digest manifest и config образа в registry.
phrases.2: Я использовал неподписанные метаданные для трассировки, а не аттестации.
questions.0.points.0: 'Нет: labels задаёт сборщик.'
questions.0.points.1: Digest определяет байты; подписи и attestations добавляют отдельные свидетельства
  доверия.
questions.0.prompt: Доказывает ли совпадающий OCI label доверенность сборки?
questions.1.points.0: Один коммит создаёт artifact; следующий выбирает его в конфигурации выкатки.
questions.1.points.1: Прослеживайте обе ревизии и их связь.
questions.1.prompt: Почему GitOps revision может отличаться от ревизии образа?
