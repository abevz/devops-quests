title: Происхождение Git-релиза
brief: 'Табло исправно, но в отчёте перепутаны коммит исходников образа и более поздний
  коммит манифеста выкатки. Проследите работающий immutable-образ через manifest приватного
  registry и label org.opencontainers.image.revision в config к исходникам в приватном
  Git. Запишите в provenance.json ровно image, commit и repo. Сохранённая квитанция
  указывает ожидаемый artifact; проверьте реальные байты registry и ancestry исходников.
  Это метаданные трассировки, а не подпись или доказательство доверенной сборки.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `platform.env`,
  `release-evidence.json`, `provenance.json`, `source-commit`, `release-commit`, `repository/site/index.html`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно
  загруженные образы и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Отчёт соответствует реальному digest, source revision из config
  registry и исходникам приватного Git; табло исправно.'
debrief: Инцидент связывает работающие байты с ревизией исходников, отделяя вопрос
  доверия сборке.
stages.0.brief: 'Результат проверки: Отчёт соответствует реальному digest, source
  revision из config registry и исходникам приватного Git; табло исправно.'
stages.0.objectives.0.text: Отчёт соответствует реальному digest, source revision
  из config registry и исходникам приватного Git; табло исправно.
hints.0.text: Коммит манифеста может ссылаться на образ из более раннего коммита.
hints.1.text: Пройдите manifest → config blob → OCI revision label; проверьте ancestry
  Git.
hints.2.text: Запишите digest, коммит исходников и URL приватного репозитория; label
  не заменяет подпись.
phrases.0: Я различил ревизию исходников и ревизию выкатки.
phrases.1: Я проверил digest manifest и config образа в registry.
phrases.2: Я использовал неподписанные метаданные для трассировки, а не аттестации.
questions.0.points.0: 'Нет: labels задаёт сборщик.'
questions.0.points.1: Digest определяет байты; подписи и attestations добавляют отдельные
  свидетельства доверия.
questions.0.prompt: Доказывает ли совпадающий OCI label доверенность сборки?
questions.1.points.0: Один коммит создаёт artifact; следующий выбирает его в конфигурации
  выкатки.
questions.1.points.1: Прослеживайте обе ревизии и их связь.
questions.1.prompt: Почему GitOps revision может отличаться от ревизии образа?
