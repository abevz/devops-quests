title: Identyfikowalność źródeł obrazu
brief: |-
  Board obsługuje żądania, ale zapisy źródeł na stacji i w publikacji są niekompletne. Prześledź działający niezmienny obraz do rzeczywistego źródła i dostarcz zapis działającemu konsumentowi.

  Pracuj na workstation w `~/quest` z plikami `platform.env`, `provenance.json`, `release-commit`, `repository/`.

  O ile nie wskazano inaczej, zasoby Kubernetes znajdują się w przestrzeni nazw zatoki (`DQ_NAMESPACE`); ścieżki w `~/quest` są na workstation.

  **Requirements:**

  - Opublikowane `origin/main` odpowiada plikowi `~/quest/release-commit` na workstation.
  - Application `board` zachowuje dostarczone prywatne źródło Git, gałąź wydania i istniejący katalog obciążenia.
  - Application `board` zgłasza `Synced` i `Healthy` dla commita w `~/quest/release-commit` na workstation.
  - Deployment `board` kończy rollout w przestrzeni nazw zatoki.
  - Wewnątrz Poda Deployment `board` adres `http://board:8080` zwraca `north-91`.
  - Plik `~/quest/provenance.json` na workstation poprawnie łączy działający obraz, jego rzeczywiste bajty w rejestrze i commit źródłowy z historią prywatnego Git.

    - Plik `provenance.json` na workstation zawiera dokładnie `image`, `commit` i `repo`. Źródło obrazu różni się od `release-commit`, poprzedza opublikowane wydanie w historii Git i zawiera w repozytorium `site/index.html` z `north-91`. Raport jest zgodny z działającym digestem, rzeczywistymi bajtami rejestru i metadanymi źródła rejestru.

  - Zapis źródeł w opublikowanym `repository/manifests/provenance.yaml`, działającym ConfigMap `build-record` i pod `http://board:8080/provenance.json` jest zgodny z `~/quest/provenance.json` na stacji. Publikuj konfigurację przez dostarczone źródło GitOps; zachowaj niezmienny obraz i dostępność głównego endpointu.

  To metadane identyfikowalności, a nie podpis ani dowód zaufanej kompilacji.
debrief: Prześledź działający artefakt do źródła i dostarcz zweryfikowany zapis przez istniejącego konsumenta
  GitOps; niepodpisane metadane nie potwierdzają zaufanej kompilacji.
stages.0.brief: Odróżnij pochodzenie źródła obrazu od historii wdrożenia.
hints.0.text: Zatwierdzenie manifestu może odwoływać się do obrazu utworzonego na podstawie wcześniejszego
  zatwierdzenia.
hints.1.text: |-
  Porównaj wdrożony digest, metadane manifestu i config w rejestrze oraz przodków Git. Następnie porównaj zapis na stacji, opublikowaną konfigurację i plik zamontowany w działającym Podzie.

  ```bash
  git -C repository log --oneline -5
  kubectl get deployment board -o yaml
  kubectl get configmap -o yaml
  cat provenance.json
  ```
hints.2.text: |-
  Odczytaj etykietę OCI revision z bloba config manifestu i porównaj z historią Git; nie myl źródła obrazu z commitem wdrożenia. Opublikuj ustalony zapis w dostarczonym manifeście ConfigMap i wyślij istniejący katalog aplikacji do Git. Poczekaj na kontroler. Plik ConfigMap zamontowany przez `subPath` nie aktualizuje się w istniejącym Podzie: odśwież konsumenta bez zmiany tożsamości obrazu.

  Po propagacji sprawdź raport, opublikowany commit, rewizję kontrolera, niezmienny działający digest i udostępniany zapis.

  ```sh
  source platform.env
  git -C repository ls-remote origin refs/heads/main
  cat release-commit
  cat provenance.json
  kubectl get application board -o yaml
  kubectl rollout status deployment/board --timeout=3s
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080/provenance.json
  ```
phrases.0: Rozróżniłem wersję źródłową od wersji wdrożeniowej.
phrases.1: Sprawdziłem skrót manifestu i obraz config w registry.
phrases.2: Niepodpisane pochodzenie traktowałem jako możliwość śledzenia, a nie poświadczenie.
questions.0.points.0: NIE; labels są dostarczane przez producenta.
questions.0.points.1: Skrót identyfikuje bajty; podpisy i attestations dodają oddzielny dowód zaufania.
questions.0.prompt: Czy pasująca etykieta wersji OCI potwierdza zaufaną wersję?
questions.1.points.0: Jedno zatwierdzenie buduje artifact; późniejsze zatwierdzenie wybiera go w konfiguracji
  wdrożenia.
questions.1.points.1: Śledź obie wersje i zachowaj ich powiązania.
questions.1.prompt: Dlaczego GitOps revision może różnić się od wersji obrazowej?
