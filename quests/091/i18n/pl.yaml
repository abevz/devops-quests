title: Identyfikowalność źródeł obrazu
brief: |-
  Board obsługuje żądania, ale zapisy źródeł na stacji i w publikacji są niekompletne. Prześledź działający niezmienny obraz do rzeczywistego źródła i dostarcz zapis działającemu konsumentowi.

  Pracuj na workstation w `~/quest` z plikami `platform.env`, `provenance.json`, `release-commit`, `repository/`.

  O ile nie wskazano inaczej, zasoby Kubernetes znajdują się w przestrzeni nazw zatoki (`DQ_NAMESPACE`); ścieżki w `~/quest` są na workstation.

  **Requirements:**

  - Opublikowane `origin/main` odpowiada plikowi `~/quest/release-commit` na workstation.
  - Application `board` zachowuje dostarczone prywatne źródło Git, gałąź wydania i istniejący katalog obciążenia.
  - Application `board` zgłasza `Synced` i `Healthy` dla commita w `~/quest/release-commit` na workstation.
  - Deployment `board` kończy rollout w przestrzeni nazw zatoki.
  - Wewnątrz Poda Deployment `board` adres `http://board:8080` zwraca `north-91`.
  - Plik `~/quest/provenance.json` na workstation poprawnie łączy działający obraz, jego rzeczywiste bajty w rejestrze i commit źródłowy z historią prywatnego Git.

    - Plik `provenance.json` na workstation zawiera dokładnie `image`, `commit` i `repo`. Źródło obrazu różni się od `release-commit`, poprzedza opublikowane wydanie w historii Git i zawiera w repozytorium `site/index.html` z `north-91`. Raport jest zgodny z działającym digestem, rzeczywistymi bajtami rejestru i metadanymi źródła rejestru.

  - Zapis źródeł w opublikowanym `repository/manifests/provenance.yaml`, działającym ConfigMap `build-record` i pod `http://board:8080/provenance.json` jest zgodny z `~/quest/provenance.json` na stacji. Publikuj konfigurację przez dostarczone źródło GitOps; zachowaj niezmienny obraz i dostępność głównego endpointu.

  To metadane identyfikowalności, a nie podpis ani dowód zaufanej kompilacji.
debrief: Prześledź działający artefakt do źródła i dostarcz zweryfikowany zapis przez istniejącego konsumenta
  GitOps; niepodpisane metadane nie potwierdzają zaufanej kompilacji.
stages.0.brief: Odróżnij pochodzenie źródła obrazu od historii wdrożenia.
hints.0.text: Zatwierdzenie manifestu może odwoływać się do obrazu utworzonego na podstawie wcześniejszego
  zatwierdzenia.
hints.1.text: |-
  Porównaj wdrożony digest, metadane manifestu i config w rejestrze oraz przodków Git. Następnie porównaj zapis na stacji, opublikowaną konfigurację i plik zamontowany w działającym Podzie.

  Odszukaj etykietę rewizji OCI w metadanych konfiguracji manifestu. Porównaj ją osobno z commitem wdrożenia i sprawdź typ montowania działającego procesu.

  ```bash
  git -C repository log --oneline -5
  kubectl get deployment board -o yaml
  kubectl get configmap -o yaml
  cat provenance.json
  ```
hints.2.text: |-
  Po propagacji sprawdź raport, opublikowany commit, rewizję kontrolera, niezmienny działający digest i udostępniany zapis.

  ```sh
  source platform.env
  git -C repository ls-remote origin refs/heads/main
  cat release-commit
  cat provenance.json
  kubectl get application board -o yaml
  kubectl rollout status deployment/board --timeout=3s
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080/provenance.json
  ```

  ```sh
  (
    set -euo pipefail
    cd ~/quest
    source platform.env
    image=$(jq -er .image provenance.json)
    digest=${image##*@}
    deployment_uid=$(kubectl get deployment board -o jsonpath='{.metadata.uid}')
    sets=$(kubectl get rs -o json | jq -c --arg owner "$deployment_uid" '
      [.items[] | select(any(.metadata.ownerReferences[]?; .kind=="Deployment" and .controller==true and .uid==$owner)) | .metadata.uid]')
    kubectl get pods -o json | jq -e --argjson sets "$sets" --arg image "$image" --arg digest "$digest" '
      [.items[] | select(.metadata.deletionTimestamp==null and .status.phase=="Running" and
        any(.metadata.ownerReferences[]?; .kind=="ReplicaSet" and .controller==true and (.uid as $uid | $sets | index($uid)!=null)))]
      | any(.[]; any(.spec.containers[]; .name=="worker" and .image==$image) and
        any(.status.containerStatuses[]?; .name=="worker" and .ready==true and
          ((.imageID | split("@") | last | split("/") | last) == $digest)))'
    kubectl get configmap build-record -o json |
      jq -e --slurpfile record provenance.json '(.data["provenance.json"] | fromjson) == $record[0]'
    kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080/provenance.json |
      jq -e --slurpfile record provenance.json '. == $record[0]'
  )
  ```
phrases.0: Rozróżniłem wersję źródłową od wersji wdrożeniowej.
phrases.1: Sprawdziłem skrót manifestu i obraz config w registry.
phrases.2: Niepodpisane pochodzenie traktowałem jako możliwość śledzenia, a nie poświadczenie.
questions.0.points.0: NIE; labels są dostarczane przez producenta.
questions.0.points.1: Skrót identyfikuje bajty; podpisy i attestations dodają oddzielny dowód zaufania.
questions.0.prompt: Czy pasująca etykieta wersji OCI potwierdza zaufaną wersję?
questions.1.points.0: Jedno zatwierdzenie buduje artifact; późniejsze zatwierdzenie wybiera go w konfiguracji
  wdrożenia.
questions.1.points.1: Śledź obie wersje i zachowaj ich powiązania.
questions.1.prompt: Dlaczego GitOps revision może różnić się od wersji obrazowej?
stages.0.objectives.0.text: Opublikowane `origin/main` odpowiada plikowi `~/quest/release-commit` na workstation.
stages.0.objectives.1.text: Application `board` zachowuje dostarczone prywatne źródło Git, gałąź wydania
  i istniejący katalog obciążenia.
stages.0.objectives.2.text: Application `board` zgłasza `Synced` i `Healthy` dla commita w `~/quest/release-commit`
  na workstation.
stages.0.objectives.3.text: Deployment `board` kończy rollout w przestrzeni nazw zatoki.
stages.0.objectives.4.text: Wewnątrz Poda Deployment `board` adres `http://board:8080` zwraca `north-91`.
stages.0.objectives.5.text: Plik `~/quest/provenance.json` na workstation poprawnie łączy działający obraz,
  jego rzeczywiste bajty w rejestrze i commit źródłowy z historią prywatnego Git. Opublikowana konfiguracja
  i działający konsument udostępniają zweryfikowany zapis źródeł ze stacji.
diagnostics.provenance_head: release-commit może nadal wskazywać poprzedni deployment po publikacji rekordu albo platform input lub private Git fetch zawodzi; porównaj pobrany origin/main z bieżącym potwierdzeniem wydania stacji. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=image-source-record-published-release-head)
diagnostics.provenance_source: Aplikacja mogła zostać skierowana do innego repozytorium, gałęzi lub katalogu albo odczyt wejść/API zawodzi; zachowaj dostarczony Git URL, gałąź main i względną ścieżkę do manifests bez przejścia do rodzica. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=image-source-record-retained-git-source)
diagnostics.provenance_sync: Aplikacja może nadal zgłaszać starszą revision, być niezdrowa lub mieć wyłączone self-healing/pruning; czekaj na Synced i Healthy dla release-commit z obiema flagami true. Same statusy nie dowodzą odświeżenia już zamontowanego pliku metadata. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=image-source-record-current-reconciled-release)
diagnostics.provenance_rollout: Bieżący rollout może nadal się uzgadniać albo przygotowanie image i gotowość kontenera blokują go; sprawdź istniejące Pod i zdarzenia, zachowując dostarczony niezmienny image aplikacji. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=image-source-record-workload-readiness)
diagnostics.provenance_http: Główny Service może być niedostępny lub naprawa metadata zasłoniła pierwotną stronę image; zachowaj odpowiedź north-91 przy publikacji source record. Sama odpowiedź metadata nie spełnia osobnego warunku głównego endpoint. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=image-source-record-main-endpoint)
diagnostics.probe_0_5: Raport może być nadal pusty lub używać deployment commit zamiast wcześniejszego rzeczywistego source commit image; porównaj zamrożony image, bajty registry manifest, revision metadata i Git history. Błędy wejść, registry, API lub późniejszego odczytu dostarczenia rekordu też dają fallback przed nazwanym porównaniem. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=image-source-record-verified-source-observation)
diagnostics.provenance_delivery: Opublikowany manifest lub żywy ConfigMap może zachować początkowy pusty rekord, albo istniejący Pod stary plik subPath po zmianie ConfigMap. Opublikuj zweryfikowany raport przez Git i odśwież odbiorcę do zgodności published, live i served JSON. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=image-source-record-published-and-mounted-record)
