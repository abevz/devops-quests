title: Pochodzenie Gita
brief: 'board jest w dobrym stanie, ale raport dotyczący incydentów myli źródło image commit z późniejszym
  wdrożeniem - manifest commit. Śledzenie działającego, niezmiennego image poprzez prywatne registry manifest
  i config label org.opencontainers.image.revision do prywatnego źródła Git. Wpisz provenance.json dokładnie
  image, commit i repo. Potwierdzenie zwolnienia zamrożonego identyfikuje oczekiwany artifact; sprawdź
  jego rzeczywiste bajty registry i źródło ancestry. Są to metadane umożliwiające śledzenie, a nie podpis
  lub dowód zaufanej kompilacji.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `platform.env`, `release-evidence.json`,
  `provenance.json`, `source-commit`, `release-commit`, `repository/site/index.html`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: raport pasuje do rzeczywistego działającego źródła digest, registry config
  source revision i prywatnego źródła Git; board pozostaje zdrowa.'
debrief: Incydent łączy teraz uruchomione bajty z wersją źródłową, pozostawiając zaufanie do kompilacji
  odrębną kwestią.
stages.0.brief: 'Kryteria sukcesu: raport odpowiada rzeczywistemu działającemu digest, konfiguracji rejestru
  source revision i prywatnemu źródłu Git; board pozostaje zdrowa.'
stages.0.objectives.0.text: Raport pasuje do rzeczywistego działającego digest, konfiguracji rejestru
  source revision i prywatnego źródła Git; board pozostaje zdrowa.
hints.0.text: Zatwierdzenie manifestu może odwoływać się do obrazu utworzonego na podstawie wcześniejszego
  zatwierdzenia.
hints.1.text: Rozwiąż manifest → config blob → OCI revision label; porównaj pochodzenie Gita.
hints.2.text: Zapisz obraz digest, zatwierdzenie źródła i prywatne repozytorium URL, nie traktując label
  jako podpisu.
phrases.0: Rozróżniłem wersję źródłową od wersji wdrożeniowej.
phrases.1: Sprawdziłem skrót manifestu i obraz config w registry.
phrases.2: Niepodpisane pochodzenie traktowałem jako możliwość śledzenia, a nie poświadczenie.
questions.0.points.0: NIE; labels są dostarczane przez producenta.
questions.0.points.1: Skrót identyfikuje bajty; podpisy i attestations dodają oddzielny dowód zaufania.
questions.0.prompt: Czy pasująca etykieta wersji OCI potwierdza zaufaną wersję?
questions.1.points.0: Jedno zatwierdzenie buduje artifact; późniejsze zatwierdzenie wybiera go w konfiguracji
  wdrożenia.
questions.1.points.1: Śledź obie wersje i zachowaj ich powiązania.
questions.1.prompt: Dlaczego GitOps revision może różnić się od wersji obrazowej?
