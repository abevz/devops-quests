diagnostics.provenance_delivery: Opublikowane i udostępniane zapisy źródeł muszą odpowiadać zweryfikowanemu
  raportowi. Porównaj Git, dane ConfigMap i działającego konsumenta; montowanie subPath może zachować
  starszy plik.
