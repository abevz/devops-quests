title: Quellnachweis des Images
brief: |-
  Board bedient Anfragen, doch die Quellnachweise auf der Workstation und in der Veröffentlichung sind unvollständig. Verfolge das laufende unveränderliche Image zu seiner tatsächlichen Quelle und liefere den Nachweis an den laufenden Verbraucher.

  Arbeiten Sie auf der Workstation in `~/quest` mit `platform.env`, `provenance.json`, `release-commit`, `repository/`.

  Sofern nicht anders angegeben, liegen Kubernetes-Ressourcen im Bay-Namespace (`DQ_NAMESPACE`); Pfade unter `~/quest` liegen auf der Workstation.

  **Requirements:**

  - Veröffentlichtes `origin/main` entspricht der Workstation-Datei `~/quest/release-commit`.
  - Application `board` behält die bereitgestellte private Git-Quelle, den Release-Branch und das vorhandene Workload-Verzeichnis bei.
  - Application `board` meldet `Synced` und `Healthy` für den Commit in der Workstation-Datei `~/quest/release-commit`.
  - Deployment `board` schließt seinen Rollout im Bay-Namespace ab.
  - In einem Pod von Deployment `board` liefert `http://board:8080` den Wert `north-91`.
  - Die Workstation-Datei `~/quest/provenance.json` verknüpft das laufende Image, seine tatsächlichen Registry-Bytes und den Quell-Commit korrekt mit der privaten Git-Quellhistorie.

    - Die Workstation-Datei `provenance.json` enthält genau `image`, `commit` und `repo`. Die Image-Quelle unterscheidet sich von `release-commit`, geht dem veröffentlichten Release in der Git-Historie voraus und enthält im Repository `site/index.html` mit `north-91`. Der Bericht stimmt mit dem laufenden Digest, den tatsächlichen Registry-Bytes und den Registry-Quellmetadaten überein.

  - Der Quellnachweis im veröffentlichten `repository/manifests/provenance.yaml`, in der laufenden ConfigMap `build-record` und unter `http://board:8080/provenance.json` entspricht jeweils `~/quest/provenance.json` auf der Workstation. Veröffentliche die Konfiguration über die vorgegebene GitOps-Quelle; erhalte das unveränderliche Image und die Verfügbarkeit des Hauptendpunkts.

  Dies sind Rückverfolgbarkeitsmetadaten, keine Signatur und kein Nachweis eines vertrauenswürdigen Builds.
debrief: Verfolge das laufende Artefakt zu seiner Quelle und übertrage den verifizierten Nachweis über
  den bestehenden GitOps-Verbraucher; unsignierte Metadaten sind kein Nachweis eines vertrauenswürdigen
  Builds.
stages.0.brief: Trennen Sie die Herkunft des Image-Quellcodes von der Deployment-Historie.
hints.0.text: Ein Manifest-Commit kann auf ein Image verweisen, das aus einem früheren Commit erstellt
  wurde.
hints.1.text: |-
  Vergleiche den bereitgestellten Digest, Manifest-/Config-Metadaten der Registry und die Git-Abstammung. Vergleiche danach Workstation-Nachweis, veröffentlichte Konfiguration und die im laufenden Pod eingebundene Datei.

  ```bash
  git -C repository log --oneline -5
  kubectl get deployment board -o yaml
  kubectl get configmap -o yaml
  cat provenance.json
  ```
hints.2.text: |-
  Lies das OCI-Revisionslabel aus dem Config-Blob des Manifests und vergleiche es mit der Git-Historie; verwechsle die Image-Quelle nicht mit dem Deployment-Commit. Veröffentliche den ermittelten Nachweis im vorgegebenen ConfigMap-Manifest und pushe das bestehende Arbeitslastverzeichnis. Warte auf den Controller. Eine über `subPath` eingebundene ConfigMap-Datei wird in einem bestehenden Pod nicht aktualisiert: erneuere den Verbraucher, ohne die Image-Identität zu ändern.

  Prüfe nach der Übertragung Bericht, veröffentlichten Commit, Controller-Revision, unveränderlichen laufenden Digest und den per HTTP bereitgestellten Nachweis.

  ```sh
  source platform.env
  git -C repository ls-remote origin refs/heads/main
  cat release-commit
  cat provenance.json
  kubectl get application board -o yaml
  kubectl rollout status deployment/board --timeout=3s
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080/provenance.json
  ```
phrases.0: Ich habe die Quellrevision von der Bereitstellungsrevision unterschieden.
phrases.1: Ich habe den manifest digest und das Bild config im registry überprüft.
phrases.2: Ich habe die nicht unterschriebene Provenienz als Rückverfolgbarkeit und nicht als Bescheinigung
  behandelt.
questions.0.points.0: NEIN; labels werden vom Hersteller bereitgestellt.
questions.0.points.1: Ein Digest identifiziert Bytes; Signaturen und attestations fügen separate Vertrauensnachweise
  hinzu.
questions.0.prompt: Erweist sich eine passende OCI-Revision label als vertrauenswürdiger Build?
questions.1.points.0: Ein Commit erstellt den artifact; Bei einem späteren Commit wird es in der Bereitstellungskonfiguration
  ausgewählt.
questions.1.points.1: Verfolgen Sie beide Revisionen und behalten Sie ihre Beziehung bei.
questions.1.prompt: Warum kann GitOps revision vom Bild revision abweichen?
