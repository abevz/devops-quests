title: Git-Herkunft
brief: 'Der board ist fehlerfrei, aber sein Vorfallbericht verwechselt den Bildquellen-Commit mit dem
  späteren Deployment-Manifest-Commit. Verfolgen Sie das laufende unveränderliche Image über die privaten
  Quellen registry manifest und config label org.opencontainers.image.revision zur privaten Quelle Git.
  Schreiben Sie provenance.json mit exaktem Image, Commit und Repo. Der eingefrorene Freigabebeleg identifiziert
  den erwarteten artifact; Überprüfen Sie die tatsächlichen registry-Bytes und die Quelle ancestry. Hierbei
  handelt es sich um Rückverfolgbarkeitsmetadaten, nicht um eine Signatur oder einen Beweis für einen
  vertrauenswürdigen Build.


  Questdateien in `~/quest` (einige erscheinen in späteren Phasen): `platform.env`, `release-evidence.json`,
  `provenance.json`, `source-commit`, `release-commit`, `repository/site/index.html`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Erste Erfolgskriterien: Der Bericht entspricht der real laufenden digest-, registry config-Quelle revision
  und der privaten Git-Quelle; Der board bleibt gesund.'
debrief: Der Vorfall verknüpft nun laufende Bytes mit der Quellrevision, während die Build-Vertrauensstellung
  eine separate Frage bleibt.
stages.0.brief: 'Erfolgskriterien: Der Bericht entspricht der real laufenden digest-, registry config-Quelle
  revision und der privaten Git-Quelle; Der board bleibt gesund.'
stages.0.objectives.0.text: Der Bericht entspricht der tatsächlich laufenden Quelle digest, registry config
  revision und der privaten Quelle Git. Der board bleibt gesund.
hints.0.text: Ein Manifest-Commit kann auf ein Image verweisen, das aus einem früheren Commit erstellt
  wurde.
hints.1.text: Auflösen manifest → config blob → OCI revision label; Vergleiche Git ancestry.
hints.2.text: Zeichnen Sie das Image digest, das Quell-Commit und das private Repo URL auf, ohne ein label
  als Signatur zu behandeln.
phrases.0: Ich habe die Quellrevision von der Bereitstellungsrevision unterschieden.
phrases.1: Ich habe den manifest digest und das Bild config im registry überprüft.
phrases.2: Ich habe die nicht unterschriebene Provenienz als Rückverfolgbarkeit und nicht als Bescheinigung
  behandelt.
questions.0.points.0: NEIN; labels werden vom Hersteller bereitgestellt.
questions.0.points.1: Ein Digest identifiziert Bytes; Signaturen und attestations fügen separate Vertrauensnachweise
  hinzu.
questions.0.prompt: Erweist sich eine passende OCI-Revision label als vertrauenswürdiger Build?
questions.1.points.0: Ein Commit erstellt den artifact; Bei einem späteren Commit wird es in der Bereitstellungskonfiguration
  ausgewählt.
questions.1.points.1: Verfolgen Sie beide Revisionen und behalten Sie ihre Beziehung bei.
questions.1.prompt: Warum kann GitOps revision vom Bild revision abweichen?
