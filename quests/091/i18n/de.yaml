diagnostics.probe_0_5: 'Mit den aktuellen Eingaben konnte dieses Ziel nicht geprüft werden: Die Workstation-Datei
  `~/quest/provenance.json` verknüpft das laufende Image, seine tatsächlichen Registry-Bytes und den Quell-Commit
  korrekt mit der privaten Git-Quellhistorie.'
diagnostics.provenance_delivery: Der veröffentlichte und per HTTP gelieferte Quellnachweis muss dem verifizierten
  Bericht entsprechen. Vergleiche Git, ConfigMap-Daten und den laufenden Verbraucher; ein subPath-Mount
  kann eine ältere Datei behalten.
