title: Git provenance
brief: 'The board is healthy, but its incident report confuses the image source commit
  with the later deployment-manifest commit. Trace the running immutable image through
  the private registry manifest and config label org.opencontainers.image.revision
  to the private Git source. Write provenance.json with exactly image, commit and
  repo. The frozen release receipt identifies the expected artifact; verify its actual
  registry bytes and source ancestry. This is traceability metadata, not a signature
  or proof of a trusted build.


  Quest files in `~/quest` (some appear in later stages): `platform.env`, `release-evidence.json`,
  `provenance.json`, `source-commit`, `release-commit`, `repository/site/index.html`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images
  and private services. Change only this bay.


  Initial success criteria: The report matches the real running digest, registry config
  source revision and private Git source; the board remains healthy.'
debrief: The incident now links running bytes to the source revision while keeping
  build trust a separate question.
stages.0.brief: 'Success criteria: The report matches the real running digest, registry
  config source revision and private Git source; the board remains healthy.'
stages.0.objectives.0.text: The report matches the real running digest, registry config
  source revision and private Git source; the board remains healthy.
hints.0.text: A manifest commit can reference an image built from an earlier commit.
hints.1.text: Resolve manifest → config blob → OCI revision label; compare Git ancestry.
hints.2.text: Record the image digest, source commit and private repo URL, without
  treating a label as a signature.
phrases.0: I distinguished source revision from deployment revision.
phrases.1: I verified the manifest digest and image config in the registry.
phrases.2: I treated unsigned provenance as traceability, not attestation.
questions.0.points.0: No; labels are supplied by the builder.
questions.0.points.1: A digest identifies bytes; signatures and attestations add separate
  trust evidence.
questions.0.prompt: Does a matching OCI revision label prove a trusted build?
questions.1.points.0: One commit builds the artifact; a later commit selects it in
  deployment configuration.
questions.1.points.1: Trace both revisions and retain their relationship.
questions.1.prompt: Why can GitOps revision differ from image revision?
