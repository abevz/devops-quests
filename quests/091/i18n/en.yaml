title: Image-source traceability
brief: |-
  The board serves traffic, but its workstation and published source records are incomplete. Trace the running immutable image back to its real source and deliver that record to the live consumer.

  Work on the workstation in `~/quest` with `platform.env`, `provenance.json`, `release-commit`, `repository/`.

  Unless stated otherwise, Kubernetes resources live in the bay namespace (`DQ_NAMESPACE`); `~/quest` paths are on the workstation.

  **Requirements:**

  - Published `origin/main` equals workstation `~/quest/release-commit`.
  - Application `board` retains the supplied private Git source, release branch and existing workload directory.
  - Application `board` reports `Synced` and `Healthy` at the commit in workstation `~/quest/release-commit`.
  - Deployment `board` completes its rollout in the bay namespace.
  - Inside a Pod of Deployment `board`, `http://board:8080` returns `north-91`.
  - Workstation `~/quest/provenance.json` correctly links the running image, its actual registry bytes and source commit, and the private Git source history.

    - Workstation `provenance.json` contains exactly `image`, `commit` and `repo`. The image source differs from `release-commit`, precedes the published release in Git history, and contains `site/index.html` with `north-91` in the repository. The report agrees with the running digest, actual registry bytes and registry source metadata.

  - The source record in the published `repository/manifests/provenance.yaml`, the live ConfigMap `build-record`, and `http://board:8080/provenance.json` all equal workstation `~/quest/provenance.json`. Publish configuration through the supplied GitOps source; keep the running immutable image and the main endpoint available.

  This is traceability metadata, not a signature or proof of a trusted build.
debrief: Trace the running artifact to its source and propagate the verified record through the existing
  GitOps consumer; unsigned metadata is not a trusted-build attestation.
stages.0.brief: Keep image-source provenance distinct from deployment history.
hints.0.text: A manifest commit can reference an image built from an earlier commit.
hints.1.text: |-
  Compare the deployed digest, registry manifest/config metadata and Git ancestry. Then compare the workstation record, published configuration and the file mounted by the running Pod.

  ```bash
  git -C repository log --oneline -5
  kubectl get deployment board -o yaml
  kubectl get configmap -o yaml
  cat provenance.json
  ```
hints.2.text: |-
  Read the OCI revision label from the manifest's config blob and compare it with Git history; do not confuse the image source with the deployment commit. Publish the discovered record in the supplied ConfigMap manifest and push the existing workload directory. Wait for the controller. A ConfigMap file mounted using `subPath` is not updated inside an existing Pod: refresh that consumer without changing the image identity.

  Verify the report, the published commit, controller revision, immutable running digest and served record after propagation.

  ```sh
  source platform.env
  git -C repository ls-remote origin refs/heads/main
  cat release-commit
  cat provenance.json
  kubectl get application board -o yaml
  kubectl rollout status deployment/board --timeout=3s
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080/provenance.json
  ```
phrases.0: I distinguished source revision from deployment revision.
phrases.1: I verified the manifest digest and image config in the registry.
phrases.2: I treated unsigned provenance as traceability, not attestation.
questions.0.points.0: No; labels are supplied by the builder.
questions.0.points.1: A digest identifies bytes; signatures and attestations add separate trust evidence.
questions.0.prompt: Does a matching OCI revision label prove a trusted build?
questions.1.points.0: One commit builds the artifact; a later commit selects it in deployment configuration.
questions.1.points.1: Trace both revisions and retain their relationship.
questions.1.prompt: Why can GitOps revision differ from image revision?
stages.0.objectives.0.text: Published `origin/main` equals workstation `~/quest/release-commit`.
stages.0.objectives.1.text: Application `board` retains the supplied private Git source, release branch
  and existing workload directory.
stages.0.objectives.2.text: Application `board` reports `Synced` and `Healthy` at the commit in workstation
  `~/quest/release-commit`.
stages.0.objectives.3.text: Deployment `board` completes its rollout in the bay namespace.
stages.0.objectives.4.text: Inside a Pod of Deployment `board`, `http://board:8080` returns `north-91`.
stages.0.objectives.5.text: Workstation `~/quest/provenance.json` correctly links the running image, its
  actual registry bytes and source commit, and the private Git source history. The published configuration
  and the running consumer both expose the verified workstation source record.
diagnostics.probe_0_5: 'The current inputs could not verify this objective: Workstation `~/quest/provenance.json`
  correctly links the running image, its actual registry bytes and source commit, and the private Git source history.'
diagnostics.provenance_delivery: The published and served source records must match the verified report.
  Compare Git, ConfigMap data and the running consumer; a subPath mount can retain an older file.
