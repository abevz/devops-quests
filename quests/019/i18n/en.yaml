title: Dependencies
brief: |
  Preparation does not reliably produce its route marker. The supplied preparation and writing scripts must both remain in use.

  Work in `~/quest` on the workstation. Supplied inputs: `main.tf`, `prepare.sh`, `write.sh`.

  **Requirements:**
  - OpenTofu state contains:
    - `terraform_data.directory`
    - `terraform_data.marker`
  - Directory preparation completes before the marker resource runs.
  - The preparation sentinel exists in `~/quest` on the workstation:
    - `work/.prepared`
  - Files in `~/quest` on the workstation:
    - `work/route.txt`: `north`
  - `tofu plan` exits with code `0` and reports no changes.

  **Verify yourself before Check & finish:**
  Run these observation commands from `~/quest` on the workstation.
  - `tofu state list` — Expected: the state addresses listed in Requirements.
  - Expected: marker creation depends on preparation, the sentinel exists, and the route is `north`.

    ```sh
    tofu graph
    ls -l work/.prepared
    cat work/route.txt
    ```
  - `tofu plan -input=false -detailed-exitcode -no-color` — Expected: no changes, exit code `0`.
debrief: Declaration order does not provide execution ordering. An explicit dependency makes the filesystem
  prerequisite part of the graph rather than a timing assumption.
stages.0.brief: |
  Preparation must finish before marker creation, with the required route available.
stages.0.objectives.0.text: The state tracks `terraform_data.directory`, `terraform_data.marker`.
stages.0.objectives.1.text: Directory preparation completes before the marker resource runs.
stages.0.objectives.2.text: The preparation sentinel `work/.prepared` exists.
stages.0.objectives.3.text: '`work/route.txt` contains `north`.'
stages.0.objectives.4.text: '`tofu plan` exits 0 with no changes.'
hints.0.text: |
  Read the explicit dependency direction, not the resource order in the file. The supplied dependency points backwards: prepare.sh creates work/.prepared; write.sh refuses to write work/route.txt until that sentinel exists.
hints.1.text: depends_on names what must exist before the current resource.
hints.2.text: Inspect tofu graph before applying the repaired order.
phrases.0: I inspected the dependency graph before changing execution order.
phrases.1: I made directory preparation precede the dependent marker.
phrases.2: I verified the resulting files and an empty final plan.
