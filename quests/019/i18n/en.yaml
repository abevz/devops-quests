title: Dependencies
brief: "Preparation does not reliably produce its route marker.\n\nWork in `~/quest` on the workstation. Supplied\
  \ inputs: `main.tf`, `prepare.sh`, `write.sh`.\n\n**Requirements:**\n- OpenTofu state contains:\n  - `terraform_data.directory`\n\
  \  - `terraform_data.marker`\n- Directory preparation completes before the marker resource runs.\n- The preparation\
  \ sentinel exists in `~/quest` on the workstation:\n  - `work/.prepared`\n- Files in `~/quest` on the workstation:\n\
  \  - `work/route.txt`: `north`\n- A detailed plan reports no pending infrastructure changes and exits with\
  \ code `0`.\n"
debrief: Declaration order does not provide execution ordering. An explicit dependency makes the filesystem
  prerequisite part of the graph rather than a timing assumption.
stages.0.brief: Preparation must finish before marker creation, with the required route available.
stages.0.objectives.0.text: The state tracks `terraform_data.directory`, `terraform_data.marker`.
stages.0.objectives.1.text: Directory preparation completes before the marker resource runs.
stages.0.objectives.2.text: The preparation sentinel `work/.prepared` exists.
stages.0.objectives.3.text: '`work/route.txt` contains `north`.'
stages.0.objectives.4.text: OpenTofu reports no pending infrastructure changes.
hints.0.text: Prerequisites must finish before dependent work starts.
hints.1.text: 'Read the explicit dependency direction, not the resource order in the file. The supplied dependency
  points backwards: prepare.sh creates work/.prepared; write.sh refuses to write work/route.txt until that
  sentinel exists.


  depends_on names what must exist before the current resource.


  Inspect the supplied inputs and current managed state:


  ```sh

  cat main.tf prepare.sh write.sh

  ```'
hints.2.text: "Inspect tofu graph before applying the repaired order.\n\nSupplied workflow guidance: The supplied\
  \ preparation and writing scripts must both remain in use.\n\nVerify the observed result:\n\n- `tofu state\
  \ list` — Expected: the state addresses listed in Requirements.\n\n- Expected: marker creation depends on\
  \ preparation, the sentinel exists, and the route is `north`.\n\n  ```sh\n  tofu graph\n  ls -l work/.prepared\n\
  \  cat work/route.txt\n  ```\n\n- `tofu plan -input=false -detailed-exitcode -no-color` — Expected: no changes,\
  \ exit code `0`."
phrases.0: I inspected the dependency graph before changing execution order.
phrases.1: I made directory preparation precede the dependent marker.
phrases.2: I verified the resulting files and an empty final plan.
