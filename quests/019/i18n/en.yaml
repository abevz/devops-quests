title: Dependencies
brief: 'The two terraform_data resources describe preparation and marker creation, but their dependency
  points backwards. prepare.sh creates work/.prepared; write.sh refuses to write work/route.txt until
  that sentinel exists. Repair the graph without bypassing either script, then apply.


  Quest files in `~/quest` (some appear in later stages): `main.tf`, `prepare.sh`, `write.sh`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: Both resources are tracked, work/route.txt contains north, the graph orders
  marker after directory and the final plan is empty.'
debrief: Declaration order does not provide execution ordering. An explicit dependency makes the filesystem
  prerequisite part of the graph rather than a timing assumption.
stages.0.brief: 'The directory preparation must complete before the marker resource runs.


  Success criteria: Both resources are tracked, work/route.txt contains north, the graph orders marker
  after directory and the final plan is empty.'
stages.0.objectives.0.text: Both resources are tracked, work/route.txt contains north, the graph orders
  marker after directory and the final plan is empty.
hints.0.text: Read the explicit dependency direction, not the resource order in the file.
hints.1.text: depends_on names what must exist before the current resource.
hints.2.text: Inspect tofu graph before applying the repaired order.
phrases.0: I inspected the dependency graph before changing execution order.
phrases.1: I made directory preparation precede the dependent marker.
phrases.2: I verified the resulting files and an empty final plan.
