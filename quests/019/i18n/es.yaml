title: Dependencias
brief: 'Los dos recursos terraform_data describen la preparación y la creación de marker, pero su dependencia
  apunta hacia atrás. prepare.sh crea work/.prepared; write.sh se niega a escribir work/route.txt hasta
  que exista ese centinela. Repare el gráfico sin omitir ninguno de los scripts y luego aplique.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `main.tf`, `prepare.sh`,
  `write.sh`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: se realiza un seguimiento de ambos recursos, work/route.txt contiene north,
  el gráfico ordena marker después del directorio y el plan final está vacío.'
debrief: La orden de declaración no proporciona orden de ejecución. Una dependencia explícita hace que
  el requisito previo del sistema de archivos sea parte del gráfico en lugar de una suposición timing.
stages.0.brief: 'La preparación del directorio debe completarse antes de que se ejecute el recurso marker.


  Criterios de éxito: se realiza un seguimiento de ambos recursos, work/route.txt contiene north, el gráfico
  ordena marker después del directorio y el último plan está vacío.'
stages.0.objectives.0.text: Se realiza un seguimiento de ambos recursos, work/route.txt contiene north,
  el gráfico ordena marker después del directorio y el último plan está vacío.
hints.0.text: Lea la dirección de dependencia explícita, no el orden de los recursos en el archivo.
hints.1.text: depends_on nombra lo que debe existir antes del recurso actual.
hints.2.text: Inspeccione tofu graph antes de aplicar el pedido de reparación.
phrases.0: Inspeccioné el gráfico de dependencia antes de cambiar el orden de ejecución.
phrases.1: Hice que la preparación del directorio precediera al marcador dependiente.
phrases.2: Verifiqué los archivos resultantes y un plan final vacío.
