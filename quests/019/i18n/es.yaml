title: Dependencias
brief: |
  La preparación de la estación no genera de forma fiable el marcador de ruta. Deben seguir utilizándose ambos scripts suministrados, de preparación y escritura.

  Trabaja en `~/quest` en la workstation. Archivos de entrada suministrados: `main.tf`, `prepare.sh`, `write.sh`.

  **Requisitos:**
  - El estado de OpenTofu contiene:
    - `terraform_data.directory`
    - `terraform_data.marker`
  - La preparación del directorio termina antes de ejecutar el recurso del marcador.
  - El marcador de preparación existe en `~/quest` en la workstation:
    - `work/.prepared`
  - Archivos en `~/quest` en la workstation:
    - `work/route.txt`: `north`
  - `tofu plan` termina con código `0` sin cambios.

  **Verifica antes de Check & finish:**
  Ejecuta estos comandos de observación desde `~/quest` en la workstation.
  - `tofu state list` — Se esperan las direcciones de estado indicadas en Requisitos.
  - Se espera que la creación del marcador dependa de la preparación, que exista el marcador de preparación y que la ruta sea `north`.

    ```sh
    tofu graph
    ls -l work/.prepared
    cat work/route.txt
    ```
  - `tofu plan -input=false -detailed-exitcode -no-color` — Se esperan ausencia de cambios y código de salida `0`.
debrief: La orden de declaración no proporciona orden de ejecución. Una dependencia explícita hace que
  el requisito previo del sistema de archivos sea parte del gráfico en lugar de una suposición timing.
stages.0.brief: |
  La preparación debe terminar antes de crear el marcador y la ruta requerida debe estar disponible.
stages.0.objectives.0.text: El state contiene `terraform_data.directory`, `terraform_data.marker`.
stages.0.objectives.1.text: La preparación del directorio termina antes de que se ejecute el recurso marker.
stages.0.objectives.2.text: Existe el marcador de preparación `work/.prepared`.
stages.0.objectives.3.text: '`work/route.txt` contiene `north`.'
stages.0.objectives.4.text: '`tofu plan` termina con código 0 sin cambios.'
hints.0.text: |
  Revisa la dirección de la dependencia explícita, no el orden de los recursos en el archivo. La dependencia suministrada está invertida: prepare.sh crea work/.prepared; write.sh se niega a escribir work/route.txt hasta que exista ese marcador.
hints.1.text: depends_on nombra lo que debe existir antes del recurso actual.
hints.2.text: Inspeccione tofu graph antes de aplicar el pedido de reparación.
phrases.0: Inspeccioné el gráfico de dependencia antes de cambiar el orden de ejecución.
phrases.1: Hice que la preparación del directorio precediera al marcador dependiente.
phrases.2: Verifiqué los archivos resultantes y un plan final vacío.
