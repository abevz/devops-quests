title: Dependencias
brief: "La preparación de la estación no genera de forma fiable el marcador de ruta.\n\nTrabaja en `~/quest`\
  \ en la workstation. Archivos de entrada suministrados: `main.tf`, `prepare.sh`, `write.sh`.\n\n**Requisitos:**\n\
  - El estado de OpenTofu contiene:\n  - `terraform_data.directory`\n  - `terraform_data.marker`\n- La preparación\
  \ del directorio termina antes de ejecutar el recurso del marcador.\n- El marcador de preparación existe\
  \ en `~/quest` en la workstation:\n  - `work/.prepared`\n- Archivos en `~/quest` en la workstation:\n  -\
  \ `work/route.txt`: `north`\n- Un plan detallado no muestra cambios de infraestructura pendientes y termina\
  \ con código `0`.\n"
debrief: La orden de declaración no proporciona orden de ejecución. Una dependencia explícita hace que el requisito
  previo del sistema de archivos sea parte del gráfico en lugar de una suposición timing.
stages.0.brief: La preparación debe terminar antes de crear el marcador y la ruta requerida debe estar disponible.
stages.0.objectives.0.text: El state contiene `terraform_data.directory`, `terraform_data.marker`.
stages.0.objectives.1.text: La preparación del directorio termina antes de que se ejecute el recurso marker.
stages.0.objectives.2.text: Existe el marcador de preparación `work/.prepared`.
stages.0.objectives.3.text: '`work/route.txt` contiene `north`.'
stages.0.objectives.4.text: OpenTofu no informa cambios de infraestructura pendientes.
hints.0.text: Los requisitos previos deben completarse antes de iniciar el trabajo dependiente.
hints.1.text: 'Revisa la dirección de la dependencia explícita, no el orden de los recursos en el archivo.
  La dependencia suministrada está invertida: prepare.sh crea work/.prepared; write.sh se niega a escribir
  work/route.txt hasta que exista ese marcador.


  depends_on nombra lo que debe existir antes del recurso actual.


  Inspecciona las entradas suministradas y el estado gestionado actual:


  ```sh

  cat main.tf prepare.sh write.sh

  ```'
hints.2.text: "Inspeccione tofu graph antes de aplicar el pedido de reparación.\n\nOrientación sobre el flujo\
  \ suministrado: Deben seguir utilizándose ambos scripts suministrados, de preparación y escritura.\n\nVerifica\
  \ el resultado observado:\n\n- `tofu state list` — Se esperan las direcciones de estado indicadas en Requisitos.\n\
  \n- Se espera que la creación del marcador dependa de la preparación, que exista el marcador de preparación\
  \ y que la ruta sea `north`.\n\n  ```sh\n  tofu graph\n  ls -l work/.prepared\n  cat work/route.txt\n  ```\n\
  \n- `tofu plan -input=false -detailed-exitcode -no-color` — Se esperan ausencia de cambios y código de salida\
  \ `0`."
phrases.0: Inspeccioné el gráfico de dependencia antes de cambiar el orden de ejecución.
phrases.1: Hice que la preparación del directorio precediera al marcador dependiente.
phrases.2: Verifiqué los archivos resultantes y un plan final vacío.
diagnostics.probe_0_1: 'Los datos actuales no permiten verificar este objetivo: La preparación del directorio termina
  antes de que se ejecute el recurso marker.'
