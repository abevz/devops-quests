title: Zależności
brief: 'Dwa zasoby terraform_data opisują przygotowanie i tworzenie marker, ale ich zależność jest odwrotna.
  prepare.sh tworzy work/.prepared; write.sh odmawia napisania work/route.txt, dopóki nie pojawi się ten
  strażnik. Napraw wykres bez pomijania żadnego skryptu, a następnie zastosuj.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `main.tf`, `prepare.sh`, `write.sh`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.'
debrief: Kolejność deklaracji nie zapewnia kolejności wykonania. Jawna zależność sprawia, że ​​system
  plików jest wstępnie wymaganą częścią wykresu, a nie założeniem timing.
stages.0.brief: Przygotowanie directory musi zostać zakończone przed uruchomieniem zasobu marker.
stages.0.objectives.0.text: State zawiera `terraform_data.directory`, `terraform_data.marker`.
stages.0.objectives.1.text: Przygotowanie katalogu kończy się przed uruchomieniem zasobu marker.
stages.0.objectives.2.text: Znacznik przygotowania `work/.prepared` istnieje.
stages.0.objectives.3.text: '`work/route.txt` zawiera `north`.'
stages.0.objectives.4.text: '`tofu plan` kończy się kodem 0 bez zmian.'
hints.0.text: Przeczytaj wyraźny kierunek zależności, a nie kolejność zasobów w pliku.
hints.1.text: depends_on określa, co musi istnieć przed bieżącym zasobem.
hints.2.text: Przed złożeniem zamówienia naprawy sprawdź tofu graph.
phrases.0: Przed zmianą kolejności wykonania sprawdziłem wykres zależności.
phrases.1: Zrobiłem przygotowanie katalogu przed znacznikiem zależnym.
phrases.2: Sprawdziłem powstałe pliki i pusty końcowy plan.
