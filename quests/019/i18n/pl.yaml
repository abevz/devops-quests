title: Zależności
brief: "Przygotowanie stacji nie zapewnia utworzenia znacznika trasy.\n\nPracuj w `~/quest` na workstation.\
  \ Dostarczone pliki wejściowe: `main.tf`, `prepare.sh`, `write.sh`.\n\n**Wymagania:**\n- Stan OpenTofu zawiera:\n\
  \  - `terraform_data.directory`\n  - `terraform_data.marker`\n- Przygotowanie katalogu kończy się przed uruchomieniem\
  \ zasobu znacznika.\n- Znacznik przygotowania istnieje w `~/quest` na workstation:\n  - `work/.prepared`\n\
  - Pliki w `~/quest` na workstation:\n  - `work/route.txt`: `north`\n- Szczegółowy plan nie zawiera oczekujących\
  \ zmian infrastruktury i kończy się kodem `0`.\n"
debrief: Kolejność deklaracji nie zapewnia kolejności wykonania. Jawna zależność sprawia, że ​​system plików
  jest wstępnie wymaganą częścią wykresu, a nie założeniem timing.
stages.0.brief: Przygotowanie ma zakończyć się przed utworzeniem znacznika, a wymagana trasa ma być dostępna.
stages.0.objectives.0.text: State zawiera `terraform_data.directory`, `terraform_data.marker`.
stages.0.objectives.1.text: Przygotowanie katalogu kończy się przed uruchomieniem zasobu marker.
stages.0.objectives.2.text: Znacznik przygotowania `work/.prepared` istnieje.
stages.0.objectives.3.text: '`work/route.txt` zawiera `north`.'
stages.0.objectives.4.text: OpenTofu nie zgłasza oczekujących zmian infrastruktury.
hints.0.text: Czynności wstępne muszą zakończyć się przed rozpoczęciem zależnej pracy.
hints.1.text: 'Sprawdź kierunek jawnej zależności, a nie kolejność zasobów w pliku. Dostarczona zależność jest
  odwrócona: prepare.sh tworzy work/.prepared; write.sh odmawia zapisu work/route.txt, dopóki ten znacznik
  nie istnieje.


  depends_on określa, co musi istnieć przed bieżącym zasobem.


  Sprawdź dostarczone dane wejściowe i bieżący zarządzany stan:


  ```sh

  cat main.tf prepare.sh write.sh

  ```'
hints.2.text: "Przed złożeniem zamówienia naprawy sprawdź tofu graph.\n\nWskazówki dotyczące dostarczonego\
  \ przebiegu: Oba dostarczone skrypty przygotowania i zapisu mają pozostać w użyciu.\n\nSprawdź obserwowany\
  \ wynik:\n\n- `tofu state list` — Oczekiwane są adresy stanu wymienione w wymaganiach.\n\n- Oczekiwane: tworzenie\
  \ znacznika zależy od przygotowania, znacznik przygotowania istnieje, a trasa to `north`.\n\n  ```sh\n  tofu\
  \ graph\n  ls -l work/.prepared\n  cat work/route.txt\n  ```\n\n- `tofu plan -input=false -detailed-exitcode\
  \ -no-color` — Oczekiwane: brak zmian i kod zakończenia `0`."
phrases.0: Przed zmianą kolejności wykonania sprawdziłem wykres zależności.
phrases.1: Zrobiłem przygotowanie katalogu przed znacznikiem zależnym.
phrases.2: Sprawdziłem powstałe pliki i pusty końcowy plan.
diagnostics.probe_0_1: 'Bieżące dane nie pozwalają potwierdzić tego celu: Przygotowanie katalogu kończy się przed
  uruchomieniem zasobu marker.'
