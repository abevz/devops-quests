title: Zależności
brief: |
  Przygotowanie stacji nie zapewnia utworzenia znacznika trasy. Oba dostarczone skrypty przygotowania i zapisu mają pozostać w użyciu.

  Pracuj w `~/quest` na workstation. Dostarczone pliki wejściowe: `main.tf`, `prepare.sh`, `write.sh`.

  **Wymagania:**
  - Stan OpenTofu zawiera:
    - `terraform_data.directory`
    - `terraform_data.marker`
  - Przygotowanie katalogu kończy się przed uruchomieniem zasobu znacznika.
  - Znacznik przygotowania istnieje w `~/quest` na workstation:
    - `work/.prepared`
  - Pliki w `~/quest` na workstation:
    - `work/route.txt`: `north`
  - `tofu plan` kończy się kodem `0` i nie wykazuje zmian.

  **Sprawdź samodzielnie przed Check & finish:**
  Wykonaj te polecenia obserwacyjne w `~/quest` na workstation.
  - `tofu state list` — Oczekiwane są adresy stanu wymienione w wymaganiach.
  - Oczekiwane: tworzenie znacznika zależy od przygotowania, znacznik przygotowania istnieje, a trasa to `north`.

    ```sh
    tofu graph
    ls -l work/.prepared
    cat work/route.txt
    ```
  - `tofu plan -input=false -detailed-exitcode -no-color` — Oczekiwane: brak zmian i kod zakończenia `0`.
debrief: Kolejność deklaracji nie zapewnia kolejności wykonania. Jawna zależność sprawia, że ​​system
  plików jest wstępnie wymaganą częścią wykresu, a nie założeniem timing.
stages.0.brief: |
  Przygotowanie ma zakończyć się przed utworzeniem znacznika, a wymagana trasa ma być dostępna.
stages.0.objectives.0.text: State zawiera `terraform_data.directory`, `terraform_data.marker`.
stages.0.objectives.1.text: Przygotowanie katalogu kończy się przed uruchomieniem zasobu marker.
stages.0.objectives.2.text: Znacznik przygotowania `work/.prepared` istnieje.
stages.0.objectives.3.text: '`work/route.txt` zawiera `north`.'
stages.0.objectives.4.text: '`tofu plan` kończy się kodem 0 bez zmian.'
hints.0.text: |
  Sprawdź kierunek jawnej zależności, a nie kolejność zasobów w pliku. Dostarczona zależność jest odwrócona: prepare.sh tworzy work/.prepared; write.sh odmawia zapisu work/route.txt, dopóki ten znacznik nie istnieje.
hints.1.text: depends_on określa, co musi istnieć przed bieżącym zasobem.
hints.2.text: Przed złożeniem zamówienia naprawy sprawdź tofu graph.
phrases.0: Przed zmianą kolejności wykonania sprawdziłem wykres zależności.
phrases.1: Zrobiłem przygotowanie katalogu przed znacznikiem zależnym.
phrases.2: Sprawdziłem powstałe pliki i pusty końcowy plan.
