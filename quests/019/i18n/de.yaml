title: Abhängigkeiten
brief: 'Die beiden terraform_data-Ressourcen beschreiben die Vorbereitung und die marker-Erstellung, ihre
  Abhängigkeit weist jedoch in die Vergangenheit. prepare.sh erstellt work/.prepared; write.sh weigert
  sich, work/route.txt zu schreiben, bis dieser Sentinel existiert. Reparieren Sie das Diagramm, ohne
  eines der Skripte zu umgehen, und wenden Sie es dann an.


  Questdateien in `~/quest` (einige erscheinen in späteren Phasen): `main.tf`, `prepare.sh`, `write.sh`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Anfängliche Erfolgskriterien: Beide Ressourcen werden verfolgt, work/route.txt enthält north, das Diagramm
  ordnet marker nach dem Verzeichnis an und das endgültige plan ist leer.'
debrief: Die Deklarationsanordnung sieht keine Ausführungsanordnung vor. Eine explizite Abhängigkeit macht
  die Dateisystemvoraussetzung zu einem Teil des Diagramms und nicht zu einer timing-Annahme.
stages.0.brief: 'Die Verzeichnisvorbereitung muss abgeschlossen sein, bevor die Ressource marker ausgeführt
  wird.


  Erfolgskriterien: Beide Ressourcen werden verfolgt, work/route.txt enthält north, das Diagramm ordnet
  marker nach dem Verzeichnis an und das letzte plan ist leer.'
stages.0.objectives.0.text: Beide Ressourcen werden verfolgt, work/route.txt enthält north, das Diagramm
  ordnet marker nach dem Verzeichnis an und das endgültige plan ist leer.
hints.0.text: Lesen Sie die explizite Abhängigkeitsrichtung, nicht die Ressourcenreihenfolge in der Datei.
hints.1.text: depends_on benennt, was vor der aktuellen Ressource vorhanden sein muss.
hints.2.text: Überprüfen Sie tofu graph, bevor Sie den Reparaturauftrag anwenden.
phrases.0: Ich habe das Abhängigkeitsdiagramm überprüft, bevor ich die Ausführungsreihenfolge geändert
  habe.
phrases.1: Ich habe die Verzeichnisvorbereitung vor der abhängigen Markierung vorgenommen.
phrases.2: Ich habe die resultierenden Dateien und ein leeres endgültiges plan überprüft.
