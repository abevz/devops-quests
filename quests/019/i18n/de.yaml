title: Abhängigkeiten
brief: |
  Die Stationsvorbereitung erzeugt die Routenmarkierung nicht zuverlässig. Beide bereitgestellten Skripte zur Vorbereitung und zum Schreiben müssen weiter verwendet werden.

  Arbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte Eingabedateien: `main.tf`, `prepare.sh`, `write.sh`.

  **Anforderungen:**
  - Der OpenTofu-State enthält:
    - `terraform_data.directory`
    - `terraform_data.marker`
  - Die Verzeichnisvorbereitung endet, bevor die Markierungsressource ausgeführt wird.
  - Die Vorbereitungsmarkierung existiert in `~/quest` auf der Workstation:
    - `work/.prepared`
  - Dateien in `~/quest` auf der Workstation:
    - `work/route.txt`: `north`
  - `tofu plan` endet mit Code `0` und meldet keine Änderungen.

  **Vor Check & finish selbst prüfen:**
  Führen Sie diese Beobachtungsbefehle in `~/quest` auf der Workstation aus.
  - `tofu state list` — Erwartet: die unter Anforderungen genannten State-Adressen.
  - Erwartet: Die Markierungserstellung hängt von der Vorbereitung ab, die Vorbereitungsmarkierung existiert und die Route ist `north`.

    ```sh
    tofu graph
    ls -l work/.prepared
    cat work/route.txt
    ```
  - `tofu plan -input=false -detailed-exitcode -no-color` — Erwartet: keine Änderungen, Exit-Code `0`.
debrief: Die Deklarationsanordnung sieht keine Ausführungsanordnung vor. Eine explizite Abhängigkeit macht
  die Dateisystemvoraussetzung zu einem Teil des Diagramms und nicht zu einer timing-Annahme.
stages.0.brief: |
  Die Vorbereitung muss vor der Markierungserstellung enden; die geforderte Route muss verfügbar sein.
stages.0.objectives.0.text: Der State enthält `terraform_data.directory`, `terraform_data.marker`.
stages.0.objectives.1.text: Die Verzeichnisvorbereitung ist abgeschlossen, bevor die Ressource marker
  ausgeführt wird.
stages.0.objectives.2.text: Die Vorbereitungsmarkierung `work/.prepared` ist vorhanden.
stages.0.objectives.3.text: '`work/route.txt` enthält `north`.'
stages.0.objectives.4.text: '`tofu plan` endet mit Exit-Code 0 ohne Änderungen.'
hints.0.text: |
  Lesen Sie die explizite Abhängigkeitsrichtung, nicht die Ressourcenreihenfolge in der Datei. Die bereitgestellte Abhängigkeit zeigt rückwärts: prepare.sh erstellt work/.prepared; write.sh schreibt work/route.txt erst, wenn diese Markierung existiert.
hints.1.text: depends_on benennt, was vor der aktuellen Ressource vorhanden sein muss.
hints.2.text: Überprüfen Sie tofu graph, bevor Sie den Reparaturauftrag anwenden.
phrases.0: Ich habe das Abhängigkeitsdiagramm überprüft, bevor ich die Ausführungsreihenfolge geändert
  habe.
phrases.1: Ich habe die Verzeichnisvorbereitung vor der abhängigen Markierung vorgenommen.
phrases.2: Ich habe die resultierenden Dateien und ein leeres endgültiges plan überprüft.
