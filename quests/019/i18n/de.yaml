title: Abhängigkeiten
brief: "Die Stationsvorbereitung erzeugt die Routenmarkierung nicht zuverlässig.\n\nArbeiten Sie in `~/quest`\
  \ auf der Workstation. Bereitgestellte Eingabedateien: `main.tf`, `prepare.sh`, `write.sh`.\n\n**Anforderungen:**\n\
  - Der OpenTofu-State enthält:\n  - `terraform_data.directory`\n  - `terraform_data.marker`\n- Die Verzeichnisvorbereitung\
  \ endet, bevor die Markierungsressource ausgeführt wird.\n- Die Vorbereitungsmarkierung existiert in `~/quest`\
  \ auf der Workstation:\n  - `work/.prepared`\n- Dateien in `~/quest` auf der Workstation:\n  - `work/route.txt`:\
  \ `north`\n- Ein detaillierter Plan meldet keine ausstehenden Infrastrukturänderungen und endet mit Code\
  \ `0`.\n"
debrief: Die Deklarationsanordnung sieht keine Ausführungsanordnung vor. Eine explizite Abhängigkeit macht
  die Dateisystemvoraussetzung zu einem Teil des Diagramms und nicht zu einer timing-Annahme.
stages.0.brief: Die Vorbereitung muss vor der Markierungserstellung enden; die geforderte Route muss verfügbar
  sein.
stages.0.objectives.0.text: Der State enthält `terraform_data.directory`, `terraform_data.marker`.
stages.0.objectives.1.text: Die Verzeichnisvorbereitung ist abgeschlossen, bevor die Ressource marker ausgeführt
  wird.
stages.0.objectives.2.text: Die Vorbereitungsmarkierung `work/.prepared` ist vorhanden.
stages.0.objectives.3.text: '`work/route.txt` enthält `north`.'
stages.0.objectives.4.text: OpenTofu meldet keine ausstehenden Infrastrukturänderungen.
hints.0.text: Voraussetzungen müssen abgeschlossen sein, bevor abhängige Arbeit beginnt.
hints.1.text: 'Lesen Sie die explizite Abhängigkeitsrichtung, nicht die Ressourcenreihenfolge in der Datei.
  Die bereitgestellte Abhängigkeit zeigt rückwärts: prepare.sh erstellt work/.prepared; write.sh schreibt work/route.txt
  erst, wenn diese Markierung existiert.


  depends_on benennt, was vor der aktuellen Ressource vorhanden sein muss.


  Prüfen Sie die mitgelieferten Eingaben und den aktuellen verwalteten Zustand:


  ```sh

  cat main.tf prepare.sh write.sh

  ```'
hints.2.text: "Überprüfen Sie tofu graph, bevor Sie den Reparaturauftrag anwenden.\n\nHinweise zum mitgelieferten\
  \ Ablauf: Beide bereitgestellten Skripte zur Vorbereitung und zum Schreiben müssen weiter verwendet werden.\n\
  \nPrüfen Sie das beobachtete Ergebnis:\n\n- `tofu state list` — Erwartet: die unter Anforderungen genannten\
  \ State-Adressen.\n\n- Erwartet: Die Markierungserstellung hängt von der Vorbereitung ab, die Vorbereitungsmarkierung\
  \ existiert und die Route ist `north`.\n\n  ```sh\n  tofu graph\n  ls -l work/.prepared\n  cat work/route.txt\n\
  \  ```\n\n- `tofu plan -input=false -detailed-exitcode -no-color` — Erwartet: keine Änderungen, Exit-Code\
  \ `0`."
phrases.0: Ich habe das Abhängigkeitsdiagramm überprüft, bevor ich die Ausführungsreihenfolge geändert habe.
phrases.1: Ich habe die Verzeichnisvorbereitung vor der abhängigen Markierung vorgenommen.
phrases.2: Ich habe die resultierenden Dateien und ein leeres endgültiges plan überprüft.
