title: Зависимости
brief: |
  Подготовка станции не обеспечивает создание маркера маршрута. Оба предоставленных скрипта подготовки и записи должны остаться в работе.

  Работайте в `~/quest` на workstation. Предоставленные входные файлы: `main.tf`, `prepare.sh`, `write.sh`.

  **Требования:**
  - State OpenTofu содержит:
    - `terraform_data.directory`
    - `terraform_data.marker`
  - Подготовка каталога завершается до запуска ресурса маркера.
  - Маркер подготовки существует в `~/quest` на workstation:
    - `work/.prepared`
  - Файлы в `~/quest` на workstation:
    - `work/route.txt`: `north`
  - `tofu plan` завершается с кодом `0` без изменений.

  **Проверьте самостоятельно перед Check & finish:**
  Выполняйте эти команды наблюдения из `~/quest` на workstation.
  - `tofu state list` — Ожидаются адреса state из требований.
  - Ожидается зависимость создания маркера от подготовки, существование маркера подготовки и маршрут `north`.

    ```sh
    tofu graph
    ls -l work/.prepared
    cat work/route.txt
    ```
  - `tofu plan -input=false -detailed-exitcode -no-color` — Ожидаются отсутствие изменений и код завершения `0`.
debrief: Порядок объявления не задаёт порядок выполнения. Явная зависимость включает файловую предпосылку
  в граф вместо надежды на удачный timing.
stages.0.brief: |
  Подготовка должна завершиться до создания маркера, а требуемый маршрут — быть доступен.
stages.0.objectives.0.text: В state есть `terraform_data.directory`, `terraform_data.marker`.
stages.0.objectives.1.text: Подготовка каталога завершается до запуска ресурса marker.
stages.0.objectives.2.text: Маркер подготовки `work/.prepared` существует.
stages.0.objectives.3.text: '`work/route.txt` содержит `north`.'
stages.0.objectives.4.text: '`tofu plan` завершается с кодом 0 без изменений.'
hints.0.text: |
  Смотрите на направление явной зависимости, а не на порядок ресурсов в файле. Исходная зависимость направлена назад: prepare.sh создаёт work/.prepared; write.sh отказывается записывать work/route.txt, пока этот маркер не существует.
hints.1.text: depends_on называет то, что должно существовать до текущего ресурса.
hints.2.text: Перед применением исправленного порядка изучите tofu graph.
phrases.0: Я изучил граф зависимостей до изменения порядка выполнения.
phrases.1: Я задал подготовку каталога до создания зависимого маркера.
phrases.2: Я проверил итоговые файлы и пустой финальный plan.
