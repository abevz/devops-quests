title: Зависимости
brief: "Подготовка станции не обеспечивает создание маркера маршрута.\n\nРаботайте в `~/quest` на workstation.\
  \ Предоставленные входные файлы: `main.tf`, `prepare.sh`, `write.sh`.\n\n**Требования:**\n- State OpenTofu\
  \ содержит:\n  - `terraform_data.directory`\n  - `terraform_data.marker`\n- Подготовка каталога завершается\
  \ до запуска ресурса маркера.\n- Маркер подготовки существует в `~/quest` на workstation:\n  - `work/.prepared`\n\
  - Файлы в `~/quest` на workstation:\n  - `work/route.txt`: `north`\n- Подробный план не содержит ожидающих\
  \ изменений инфраструктуры и завершается с кодом `0`.\n"
debrief: Порядок объявления не задаёт порядок выполнения. Явная зависимость включает файловую предпосылку в
  граф вместо надежды на удачный timing.
stages.0.brief: Подготовка должна завершиться до создания маркера, а требуемый маршрут — быть доступен.
stages.0.objectives.0.text: В state есть `terraform_data.directory`, `terraform_data.marker`.
stages.0.objectives.1.text: Подготовка каталога завершается до запуска ресурса marker.
stages.0.objectives.2.text: Маркер подготовки `work/.prepared` существует.
stages.0.objectives.3.text: '`work/route.txt` содержит `north`.'
stages.0.objectives.4.text: OpenTofu не сообщает об ожидающих изменениях инфраструктуры.
hints.0.text: Предварительные действия должны завершиться до начала зависящей от них работы.
hints.1.text: 'Смотрите на направление явной зависимости, а не на порядок ресурсов в файле. Исходная зависимость
  направлена назад: prepare.sh создаёт work/.prepared; write.sh отказывается записывать work/route.txt, пока
  этот маркер не существует.


  depends_on называет то, что должно существовать до текущего ресурса.


  Изучите поставленные входные данные и текущее управляемое состояние:


  ```sh

  cat main.tf prepare.sh write.sh

  ```'
hints.2.text: "Перед применением исправленного порядка изучите tofu graph.\n\nУказания по поставленному рабочему\
  \ процессу: Оба предоставленных скрипта подготовки и записи должны остаться в работе.\n\nПроверьте наблюдаемый\
  \ результат:\n\n- `tofu state list` — Ожидаются адреса state из требований.\n\n- Ожидается зависимость создания\
  \ маркера от подготовки, существование маркера подготовки и маршрут `north`.\n\n  ```sh\n  tofu graph\n \
  \ ls -l work/.prepared\n  cat work/route.txt\n  ```\n\n- `tofu plan -input=false -detailed-exitcode -no-color`\
  \ — Ожидаются отсутствие изменений и код завершения `0`."
phrases.0: Я изучил граф зависимостей до изменения порядка выполнения.
phrases.1: Я задал подготовку каталога до создания зависимого маркера.
phrases.2: Я проверил итоговые файлы и пустой финальный plan.
