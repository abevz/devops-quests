title: Зависимости
brief: 'Два ресурса terraform_data описывают подготовку и создание маркера, но зависимость направлена
  обратно. prepare.sh создаёт work/.prepared; write.sh отказывается писать work/route.txt без этого файла.
  Исправьте граф без обхода скриптов и примените конфигурацию.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `main.tf`, `prepare.sh`, `write.sh`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Оба ресурса есть в state, work/route.txt содержит north, граф ставит marker после
  directory, итоговый plan пуст.'
debrief: Порядок объявления не задаёт порядок выполнения. Явная зависимость включает файловую предпосылку
  в граф вместо надежды на удачный timing.
stages.0.brief: 'Подготовка каталога должна завершиться раньше ресурса маркера.


  Результат проверки: Оба ресурса есть в state, work/route.txt содержит north, граф ставит marker после
  directory, итоговый plan пуст.'
stages.0.objectives.0.text: Оба ресурса есть в state, work/route.txt содержит north, граф ставит marker
  после directory, итоговый plan пуст.
hints.0.text: Прочитайте направление зависимости, а не порядок ресурсов в файле.
hints.1.text: depends_on называет то, что должно существовать до текущего ресурса.
hints.2.text: Перед применением исправленного порядка изучите tofu graph.
phrases.0: Я изучил граф зависимостей до изменения порядка выполнения.
phrases.1: Я задал подготовку каталога до создания зависимого маркера.
phrases.2: Я проверил итоговые файлы и пустой финальный plan.
