title: Argo CD App-of-Apps
brief: |-
  Иерархия приложений не доставляет board. Восстановите сохранённый в Git релиз, в котором родитель и потомок согласованы с работающим сервисом.

  Работайте на workstation в `~/quest` с файлами `platform.env`, `repository/apps/child.yaml`, `repository/`, `parent.yaml`, `wait-apps.sh`.

  Согласованная ревизия записана в `approved-publication`.

  Если не указано иное, ресурсы Kubernetes находятся в namespace песочницы (`DQ_NAMESPACE`); пути в `~/quest` — на workstation.

  **Requirements:**

  - `HEAD` репозитория на workstation опубликован как `origin/main` в новом коммите, сохраняющем существующую историю репозитория.
  - Закоммиченный и живой дочерний Application `board` используют существующее содержимое нагрузки из репозитория, сохраняют предназначенные проект и назначение в песочнице и остаются под управлением существующего родителя.
  - Applications `parent` и `board` имеют статус `Synced` для `HEAD` репозитория на workstation, а `board` — `Healthy`.
  - Существующий родительский Application сохраняет идентичность и исходный каталог источника.
  - Deployment `board` имеет ровно `1` готовую реплику.
  - Из Pod Deployment `board` сервис должен возвращать `north-122` на `http://board:8080`, а согласованную ревизию из `approved-publication` — на `http://board:8080/publication/revision`. Используйте выданную ConfigMap, в которой уже записана согласованная ревизия. Сохраните её имя и монтируйте её только для чтения в нагрузке из Git и в живом Deployment.

  Текущие привязки и статусы не доказывают, что объекты никогда не применялись напрямую.
debrief: |-
  Git, отслеживание ресурсов и состояние нагрузки показывают, где прошло согласование. Сравнение проекции с HTTP-ответом показывает, какую публикацию отдаёт сервис.
stages.0.brief: Сохраните идентичность и источник существующего родителя.
hints.0.text: |-
  Проследите по отдельности родителя, дочерний Application, нагрузку и отдаваемые данные. Даже при статусе Healthy сервис может отдавать старую публикацию.
hints.1.text: |-
  Сопоставьте источник дочернего Application в Git, живые Application и манифесты публикации. Когда сервис ответит, сравните отдаваемую ревизию с выданной записью.

  Проследите связь зафиксированного ConfigMap с томом Deployment. Найдите проецируемый файл и сравните его содержимое с утверждённой публикацией и HTTP-ответом.

  ```bash
  git -C repository show HEAD:apps/child.yaml
  kubectl get applications parent board -o yaml
  git -C repository ls-tree -r --name-only HEAD
  cat approved-publication
  ```
hints.2.text: |-
  Сопоставьте отслеживаемую дочерним Application ConfigMap, источник тома Deployment и ревизию в HTTP-ответе. Исходный ответ сервиса на корневом URL должен сохраниться.

  ```bash
  git -C repository ls-remote origin refs/heads/main
  git -C repository rev-parse HEAD
  bash wait-apps.sh
  kubectl get deployment board -o json | jq '.spec.template.spec | {volumes, mounts: [.containers[].volumeMounts[]?]}'
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080/publication/revision
  kubectl get configmaps -o json | jq '.items[] | select(.metadata.annotations["argocd.argoproj.io/tracking-id"] != null) | {name:.metadata.name,revision:.data.revision}'
  cat approved-publication
  ```

  ```bash
  (
    set -euo pipefail
    cd ~/quest
    source platform.env
    approved=$(cat /run/dq/facts/0/approved-publication)
    uses_publication() {
      jq -e '.spec.template.spec as $pod |
        any($pod.volumes[]?; .configMap.name=="board-publication" and
          (.name as $volume | any($pod.containers[]?; .name=="worker" and
            any(.volumeMounts[]?; .name==$volume and .readOnly==true))))'
    }
    head=$(git -C repository ls-remote origin refs/heads/main | cut -f1)
    git -C repository show "$head:manifests/board.yaml" |
      python3 -I -c 'import json,sys,yaml; json.dump(yaml.safe_load(sys.stdin),sys.stdout)' |
      uses_publication
    kubectl get deployment board -o json | uses_publication
    kubectl get configmap board-publication -o json |
      jq -e --arg namespace "$DQ_NAMESPACE" --arg approved "$approved" '
        .data.revision==$approved and
        .metadata.annotations["argocd.argoproj.io/tracking-id"]==($namespace+"_board:/ConfigMap:"+$namespace+"/board-publication")'
    test "$(kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080)" = north-122
    test "$(kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080/publication/revision)" = "$approved"
  )
  ```

  Корень Service возвращает north-122. Ответ на пути публикации совпадает с approved-publication.
phrases.0: Я проследил цепочку согласования от родителя к дочернему приложению.
phrases.1: Я исправил требуемое состояние в Git, а не созданное дочернее приложение.
phrases.2: Я проверил обе ревизии и фактический ответ нагрузки.
questions.0.points.0: Родитель согласовал собственные объекты, включая дочерние Application.
questions.0.points.1: Отдельно проверьте ревизию, здоровье и нагрузку каждого дочернего приложения.
questions.0.prompt: Что доказывает синхронизированный родитель в App-of-Apps?
questions.1.points.0: Требуемый манифест дочернего объекта находится в Git родителя.
questions.1.points.1: Self-heal может перезаписать отклонение живого объекта; исправляйте исходный коммит.
questions.1.prompt: Почему прямая правка дочернего Application может оказаться недолговечной?
