diagnostics.ancestor: Текущий HEAD мог перестать происходить от выданного baseline, либо исходная запись не читается. Проверьте родословную коммитов перед публикацией исправления вперёд. [Причина и проверка](guides#guide=gitops-delivery&section=q122-parent-forward-git-history)
diagnostics.changed: Правка рабочей копии могла оставить HEAD на исходной ревизии. Сравните оба коммита и проверьте, что исправление закоммичено. [Причина и проверка](guides#guide=gitops-delivery&section=q122-parent-repair-commit)
diagnostics.origin: Локальный коммит мог ещё не попасть в текущий remote main, либо запрос remote не проходит. Сравните HEAD с коммитом ветки, который вернул origin. [Причина и проверка](guides#guide=gitops-delivery&section=q122-parent-published-main)
diagnostics.child_kind: Закоммиченный дочерний объект мог отсутствовать, быть некорректным YAML или иметь другой kind. Проверьте kind Application в apps/child.yaml из HEAD. [Причина и проверка](guides#guide=gitops-delivery&section=q122-parent-git-child-kind)
diagnostics.child_name: У дочернего объекта в коммите могло быть другое имя либо файл не читается. Проверьте apps/child.yaml из HEAD и сохраните имя board. [Причина и проверка](guides#guide=gitops-delivery&section=q122-parent-git-child-name)
diagnostics.child_source: Дочерний объект в Git мог ссылаться на старый, абсолютный или выходящий к родителю путь. Проверьте, что закоммиченный относительный путь ведёт к manifests. [Причина и проверка](guides#guide=gitops-delivery&section=q122-parent-git-child-source)
diagnostics.project: Дочерний объект в кластере мог попасть в другой AppProject или сохранить прежнюю спецификацию. Проверьте, что его текущий project равен station. [Причина и проверка](guides#guide=gitops-delivery&section=q122-parent-live-child-project)
diagnostics.destination: Дочерний объект в кластере мог указывать на другой namespace. Сравните namespace назначения с выданным namespace стенда. [Причина и проверка](guides#guide=gitops-delivery&section=q122-parent-live-child-destination)
diagnostics.source: Путь в коммите может быть верным, пока дочерний объект использует прежний каталог. После согласования parent проверьте относительный путь к manifests в кластере. [Причина и проверка](guides#guide=gitops-delivery&section=q122-parent-live-child-source)
diagnostics.tracking: Вручную созданный дочерний объект мог не иметь аннотации отслеживания parent. Сравните текущий tracking ID с идентификатором parent в стенде. [Причина и проверка](guides#guide=gitops-delivery&section=q122-parent-live-child-tracking)
diagnostics.sync_parent: Указанный Application мог остаться OutOfSync или не применить источник. Проверьте статус соответствующего parent или board и ошибки согласования. [Причина и проверка](guides#guide=gitops-delivery&section=q122-parent-and-child-sync-state)
diagnostics.sync_board: Указанный Application мог остаться OutOfSync или не применить источник. Проверьте статус соответствующего parent или board и ошибки согласования. [Причина и проверка](guides#guide=gitops-delivery&section=q122-parent-and-child-sync-state)
diagnostics.revision_parent: Application мог синхронизироваться на прежнем коммите. Сравните ревизию указанного parent или board с текущим опубликованным HEAD. [Причина и проверка](guides#guide=gitops-delivery&section=q122-parent-and-child-published-revision)
diagnostics.revision_board: Application мог синхронизироваться на прежнем коммите. Сравните ревизию указанного parent или board с текущим опубликованным HEAD. [Причина и проверка](guides#guide=gitops-delivery&section=q122-parent-and-child-published-revision)
diagnostics.health: Дочерний Application мог синхронизироваться, пока его нагрузка ещё не готова. Проверьте здоровье board и работающие Pod после согласования. [Причина и проверка](guides#guide=gitops-delivery&section=q122-parent-child-application-health)
diagnostics.parent_uid: Пересоздание родительского Application под тем же именем меняет UID навсегда. Сравните текущий UID parent с зафиксированной исходной записью. [Причина и проверка](guides#guide=gitops-delivery&section=q122-retained-parent-application-uid)
diagnostics.parent_path: Родитель в кластере мог начать указывать прямо на манифесты вместо каталога дочерних объектов. Проверьте точный путь apps у parent. [Причина и проверка](guides#guide=gitops-delivery&section=q122-retained-parent-apps-path)
diagnostics.ready: У Deployment дочернего Application могла ещё не появиться готовая реплика. Проверьте события Pod и дождитесь одной готовой реплики board. [Причина и проверка](guides#guide=gitops-delivery&section=q122-parent-child-workload-ready)
diagnostics.http: Application может быть Healthy, пока board отдаёт старый ответ или временно недоступен. Запросите действующий Service и сравните тело с north-122. [Причина и проверка](guides#guide=gitops-delivery&section=q122-parent-child-live-service)
diagnostics.publication: В коммите или в кластере у worker могло отсутствовать монтирование board-publication только для чтения. Проверьте его, tracking дочернего Application и утверждённую ревизию в ConfigMap, а также значение на работающем HTTP-пути. [Причина и проверка](guides#guide=gitops-delivery&section=q122-parent-child-approved-publication)
diagnostics.probe_0_1: Проверка дочернего объекта может остановиться до указания условия при ошибке инструмента, репозитория или входов. Проверьте локальную копию Git и доступ к API. [Причина и проверка](guides#guide=gitops-delivery&section=q122-parent-child-observer-input)
diagnostics.probe_0_5: Проверка публикации может остановиться до указания поля, если не запускается процесс или недоступны входы. Проверьте репозиторий, инструменты и доступ к board-publication и board. [Причина и проверка](guides#guide=gitops-delivery&section=q122-parent-publication-observer-input)
