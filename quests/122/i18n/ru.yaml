title: Argo CD App-of-Apps
brief: 'Работайте в `~/quest` с `platform.env`, `repository/apps/child.json`, `repository/manifests/board.json`, `parent.json`,
  `baseline-commit`, `parent-uid` и `wait-apps.sh`. В app-of-apps родительская Application Argo согласует дочернюю Application,
  которая согласует нагрузку. Исправьте сохранённую дочернюю `Application` с именем `board` на путь источника `manifests`,
  создайте потомка, отличного от `baseline-commit`, и отправьте его в приватный `origin/main`; он должен совпадать с локальным
  HEAD. Дождитесь `Synced` на HEAD для обеих Application и `Healthy` для дочерней.


  Сохраните UID родителя из `parent-uid` и путь источника `apps`. Дочерняя Application должна использовать проект `station`,
  пространство имён песочницы и путь `manifests`; её tracking-аннотация должна быть `${DQ_NAMESPACE}_parent:argoproj.io/Application:${DQ_NAMESPACE}/board`.
  Deployment board должен иметь одну готовую реплику, а `board:8080` должен возвращать `north-122`. `wait-apps.sh` показывает
  ожидаемые проверки синхронизации и состояния. Текущие tracking и статус не доказывают, что объекты никогда не применялись
  напрямую. Используйте только офлайн-песочницу.'
debrief: App-of-Apps согласует ресурсы Application как объекты под управлением Git. Синхронизация родителя не заменяет проверку
  синхронизации и здоровья дочернего приложения и поведения нагрузки.
stages.0.brief: Родство Git и дочерний манифест, идентичность родителя, статусы обеих Application, область дочерней и ответ
  board соответствуют описанию.
stages.0.objectives.0.text: Родство Git и дочерний манифест, идентичность родителя, статусы обеих Application, область дочерней
  и ответ board соответствуют описанию.
hints.0.text: Проследите source родителя → source дочернего приложения → нагрузка; здоровый родитель сам по себе не доказывает
  готовность дочернего.
hints.1.text: Изучите манифест дочернего Application в repository/apps/, а не только живой объект.
hints.2.text: Исправьте source path дочернего приложения на manifests/, сделайте commit и push; обновите родителя и проверьте
  обе ревизии.
phrases.0: Я проследил цепочку согласования от родителя к дочернему приложению.
phrases.1: Я исправил требуемое состояние в Git, а не созданное дочернее приложение.
phrases.2: Я проверил обе ревизии и фактический ответ нагрузки.
questions.0.points.0: Родитель согласовал собственные объекты, включая дочерние Application.
questions.0.points.1: Отдельно проверьте ревизию, здоровье и нагрузку каждого дочернего приложения.
questions.0.prompt: Что доказывает синхронизированный родитель в App-of-Apps?
questions.1.points.0: Требуемый манифест дочернего объекта находится в Git родителя.
questions.1.points.1: Self-heal может перезаписать отклонение живого объекта; исправляйте исходный коммит.
questions.1.prompt: Почему прямая правка дочернего Application может оказаться недолговечной?
diagnostics.ancestor: baseline-commit должен быть предком HEAD.
diagnostics.changed: HEAD должен отличаться от baseline-commit.
diagnostics.origin: origin/main должен совпадать с HEAD.
diagnostics.child_kind: Kind дочернего Application в Git должен быть Application.
diagnostics.child_name: Имя дочернего Application в Git должно быть board.
diagnostics.child_source: Путь источника дочернего Application в Git должен быть manifests.
diagnostics.health: application/board health.status должен совпадать с Healthy.
diagnostics.parent_uid: application/parent metadata.uid должен совпадать с parent-uid.
diagnostics.parent_path: application/parent source.path должен совпадать с apps.
diagnostics.project: application/board project должен совпадать с station.
diagnostics.destination: application/board destination.namespace должен совпадать с DQ_NAMESPACE.
diagnostics.source: application/board source.path должен совпадать с manifests.
diagnostics.tracking: tracking-id дочернего объекта должен совпадать с tracking ID родителя.
diagnostics.ready: deployment/board readyReplicas должен совпадать с 1.
diagnostics.http: Запрос к board:8080 должен вернуть north-122.
diagnostics.sync_parent: application/parent sync.status должен совпадать с Synced.
diagnostics.sync_board: application/board sync.status должен совпадать с Synced.
diagnostics.revision_parent: application/parent sync.revision должен совпадать с HEAD.
diagnostics.revision_board: application/board sync.revision должен совпадать с HEAD.
