title: Argo CD App-of-Apps
brief: 'Родительское Application Argo CD читает apps/ из приватного Git и создаёт дочернее Application.
  Дочернее ссылается на retired/, хотя манифесты табло лежат в manifests/. Исправьте repository/apps/child.json
  в Git, создайте коммит-потомок baseline-commit и отправьте только в выданный приватный origin. Родитель
  должен согласовать дочернее приложение, а оно — табло. Не применяйте дочернее приложение или нагрузку
  напрямую. Сохраните UID родителя и сравните оба Application с опубликованным коммитом.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `platform.env`, `repository/apps/child.json`,
  `repository/manifests/board.json`, `parent.json`, `baseline-commit`, `parent-uid`, `wait-apps.sh`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Исходный родитель управляет дочерним приложением из исправленного Git-коммита; оба
  синхронизированы с ним, здоровое табло отвечает north-122.'
debrief: App-of-Apps согласует ресурсы Application как объекты под управлением Git. Синхронизация родителя
  не заменяет проверку синхронизации и здоровья дочернего приложения и поведения нагрузки.
stages.0.brief: 'Исходный родитель управляет дочерним приложением из исправленного Git-коммита; оба синхронизированы
  с ним, здоровое табло отвечает north-122.


  Результат проверки: Исходный родитель управляет дочерним приложением из исправленного Git-коммита; оба
  синхронизированы с ним, здоровое табло отвечает north-122.'
stages.0.objectives.0.text: Исходный родитель управляет дочерним приложением из исправленного Git-коммита;
  оба синхронизированы с ним, здоровое табло отвечает north-122.
hints.0.text: Проследите source родителя → source дочернего приложения → нагрузка; здоровый родитель сам
  по себе не доказывает готовность дочернего.
hints.1.text: Изучите манифест дочернего Application в repository/apps/, а не только живой объект.
hints.2.text: Исправьте source path дочернего приложения на manifests/, сделайте commit и push; обновите
  родителя и проверьте обе ревизии.
phrases.0: Я проследил цепочку согласования от родителя к дочернему приложению.
phrases.1: Я исправил требуемое состояние в Git, а не созданное дочернее приложение.
phrases.2: Я проверил обе ревизии и фактический ответ нагрузки.
questions.0.points.0: Родитель согласовал собственные объекты, включая дочерние Application.
questions.0.points.1: Отдельно проверьте ревизию, здоровье и нагрузку каждого дочернего приложения.
questions.0.prompt: Что доказывает синхронизированный родитель в App-of-Apps?
questions.1.points.0: Требуемый манифест дочернего объекта находится в Git родителя.
questions.1.points.1: Self-heal может перезаписать отклонение живого объекта; исправляйте исходный коммит.
questions.1.prompt: Почему прямая правка дочернего Application может оказаться недолговечной?
