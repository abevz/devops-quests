title: Argo CD App-of-Apps
brief: |-
  Иерархия приложений не доставляет board. Восстановите сохранённый в Git релиз, в котором родитель и потомок согласованы с работающим сервисом.

  Работайте на workstation в `~/quest` с файлами `platform.env`, `repository/apps/child.yaml`, `repository/`, `parent.yaml`, `wait-apps.sh`.

  Если не указано иное, ресурсы Kubernetes находятся в namespace песочницы (`DQ_NAMESPACE`); пути в `~/quest` — на workstation.

  **Requirements:**

  - `HEAD` репозитория на workstation опубликован как `origin/main` в новом коммите, сохраняющем существующую историю репозитория.
  - Закоммиченный и живой дочерний Application `board` используют существующее содержимое нагрузки из репозитория, сохраняют предназначенные проект и назначение в песочнице и остаются под управлением существующего родителя.
  - Applications `parent` и `board` имеют статус `Synced` для `HEAD` репозитория на workstation, а `board` — `Healthy`.
  - Существующий родительский Application сохраняет идентичность и исходный каталог источника.
  - Deployment `board` имеет ровно `1` готовую реплику.
  - Внутри Pod Deployment `board` адрес `http://board:8080` возвращает `north-122`.

  Текущие привязки и статусы не доказывают, что объекты никогда не применялись напрямую.
debrief: App-of-Apps согласует ресурсы Application как объекты под управлением Git. Синхронизация родителя
  не заменяет проверку синхронизации и здоровья дочернего приложения и поведения нагрузки.
stages.0.brief: Сохраните идентичность и источник существующего родителя.
hints.0.text: Проследите source родителя → source дочернего приложения → нагрузка; здоровый родитель сам
  по себе не доказывает готовность дочернего.
hints.1.text: |-
  Изучите документ потомка в Git и живую связь родителя с потомком.

  ```bash
  cat repository/apps/child.yaml
  kubectl get applications parent board -o yaml
  ```
hints.2.text: |-
  Исправьте source path дочернего приложения на manifests/, сделайте commit и push; обновите родителя и проверьте обе ревизии. Изучите манифест дочернего Application в repository/apps/, а не только живой объект.

  Проверьте из `~/quest` на workstation:

  - `git -C repository ls-remote origin refs/heads/main`
  - `git -C repository rev-parse HEAD`

  Оба хеша совпадают.

  - `kubectl get applications parent board -o json | jq '.items[] | {name:.metadata.name,sync:.status.sync.status,health:.status.health.status,revision:.status.sync.revision,uid:.metadata.uid,path:.spec.source.path,project:.spec.project,destination:.spec.destination.namespace,tracking:.metadata.annotations["argocd.argoproj.io/tracking-id"]}'`

  Оба имеют статус `Synced` для локального HEAD; `board` имеет статус `Healthy`. UID/путь родителя и проект/путь/назначение/tracking потомка соответствуют Requirements.

  - `kubectl exec deployment/board -- wget -qO- -T 3 http://board:8080`

  `north-122`.

  - `bash wait-apps.sh` — код `0`; проверки предоставленного релиза проходят.
phrases.0: Я проследил цепочку согласования от родителя к дочернему приложению.
phrases.1: Я исправил требуемое состояние в Git, а не созданное дочернее приложение.
phrases.2: Я проверил обе ревизии и фактический ответ нагрузки.
questions.0.points.0: Родитель согласовал собственные объекты, включая дочерние Application.
questions.0.points.1: Отдельно проверьте ревизию, здоровье и нагрузку каждого дочернего приложения.
questions.0.prompt: Что доказывает синхронизированный родитель в App-of-Apps?
questions.1.points.0: Требуемый манифест дочернего объекта находится в Git родителя.
questions.1.points.1: Self-heal может перезаписать отклонение живого объекта; исправляйте исходный коммит.
questions.1.prompt: Почему прямая правка дочернего Application может оказаться недолговечной?
diagnostics.ancestor: baseline-commit должен быть предком HEAD.
diagnostics.changed: HEAD должен отличаться от baseline-commit.
diagnostics.origin: origin/main должен совпадать с HEAD.
diagnostics.child_kind: Kind дочернего Application в Git должен быть Application.
diagnostics.child_name: Имя дочернего Application в Git должно быть board.
diagnostics.child_source: Путь источника дочернего Application в Git должен быть manifests.
diagnostics.health: application/board health.status должен совпадать с Healthy.
diagnostics.parent_uid: application/parent metadata.uid должен совпадать с parent-uid.
diagnostics.parent_path: application/parent source.path должен совпадать с apps.
diagnostics.project: application/board project должен совпадать с station.
diagnostics.destination: application/board destination.namespace должен совпадать с DQ_NAMESPACE.
diagnostics.source: application/board source.path должен совпадать с manifests.
diagnostics.tracking: tracking-id дочернего объекта должен совпадать с tracking ID родителя.
diagnostics.ready: deployment/board readyReplicas должен совпадать с 1.
diagnostics.http: Запрос к board:8080 должен вернуть north-122.
diagnostics.sync_parent: application/parent sync.status должен совпадать с Synced.
diagnostics.sync_board: application/board sync.status должен совпадать с Synced.
diagnostics.revision_parent: application/parent sync.revision должен совпадать с HEAD.
diagnostics.revision_board: application/board sync.revision должен совпадать с HEAD.
