title: Argo CD App-of-Apps
brief: 'Pracuj w `~/quest` z `platform.env`, `repository/apps/child.json`, `repository/manifests/board.json`, `parent.json`,
  `baseline-commit`, `parent-uid` i `wait-apps.sh`. W app-of-apps rodzicielska Application Argo uzgadnia potomną Application,
  która uzgadnia workload. Popraw zatwierdzoną potomną `Application` o nazwie `board` na ścieżkę źródła `manifests`, zatwierdź
  potomka różnego od `baseline-commit` i wyślij go do prywatnego `origin/main`; musi on odpowiadać lokalnemu HEAD. Poczekaj,
  aż obie Application będą `Synced` przy HEAD, a potomna `Healthy`.


  Zachowaj UID rodzica z `parent-uid` i ścieżkę `apps`. Potomna Application musi używać projektu `station`, przestrzeni nazw
  zatoki i ścieżki `manifests`; jej adnotacja śledzenia musi wynosić `${DQ_NAMESPACE}_parent:argoproj.io/Application:${DQ_NAMESPACE}/board`.
  Deployment board musi mieć jedną gotową replikę, a `board:8080` musi zwracać `north-122`. `wait-apps.sh` pokazuje oczekiwane
  kontrole synchronizacji i stanu. Bieżące śledzenie i stan nie dowodzą, że obiektów nigdy nie zastosowano bezpośrednio. Używaj
  tylko zatoki offline.'
debrief: App-of-Apps uzgadnia zasoby Application jako obiekty zarządzane przez Git. Synchronizacja nadrzędna nie zastępuje
  kontroli synchronizacji podrzędnej, stanu i zachowania obciążenia.
stages.0.brief: Potomek Git i manifest, tożsamość rodzica, stany obu Application, zakres potomnej i odpowiedź board odpowiadają
  opisowi.
stages.0.objectives.0.text: Potomek Git i manifest, tożsamość rodzica, stany obu Application, zakres potomnej i odpowiedź
  board odpowiadają opisowi.
hints.0.text: Podążaj za rodzicem source → dzieckiem source → obciążeniem; zdrowy rodzic sam nie udowodni, że jego dziecko
  jest gotowe.
hints.1.text: Sprawdź manifest dziecka Application w repository/apps/, a nie tylko żywe dziecko.
hints.2.text: Zmień dziecko source path na manifests/, commit i push; odśwież element nadrzędny i sprawdź obie wersje.
phrases.0: Postępowałem zgodnie z łańcuchem pojednania rodzic-dziecko.
phrases.1: Naprawiłem żądany stan w Git, a nie w wygenerowanym dziecku.
phrases.2: Sprawdziłem obie wersje i rzeczywistą reakcję na obciążenie.
questions.0.points.0: Element nadrzędny uzgodnił własne zarządzane obiekty, w tym aplikacje podrzędne.
questions.0.points.1: Sprawdź osobno każdą wersję dziecka, stan zdrowia i obciążenie pracą.
questions.0.prompt: Co potwierdza zsynchronizowany rodzic w App-of-Apps?
questions.1.points.0: Element nadrzędny jest właścicielem żądanego manifestu podrzędnego w Git.
questions.1.points.1: Self-heal może nadpisać drift na żywo; napraw zatwierdzenie źródłowe.
questions.1.prompt: Dlaczego bezpośrednia edycja elementu podrzędnego Application może być krótkotrwała?
