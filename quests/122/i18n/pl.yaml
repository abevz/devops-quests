title: Argo CD App-of-Apps
brief: 'Nadrzędny obiekt Application w Argo CD odczytuje apps/ z prywatnego repozytorium Git i tworzy
  podrzędny Application. Obiekt podrzędny wskazuje retired/, podczas gdy rzeczywiste manifesty board znajdują
  się w manifests/. Napraw repository/apps/child.json w Git, utwórz commit będący potomkiem baseline-commit
  i wypchnij go wyłącznie do dostarczonego prywatnego origin. Pozwól obiektowi nadrzędnemu uzgodnić podrzędny,
  a następnie podrzędnemu uzgodnić board. Nie stosuj bezpośrednio obiektu podrzędnego ani obciążenia.
  Zachowaj oryginalny UID obiektu nadrzędnego i porównaj obie aplikacje z opublikowanym commitem.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `platform.env`, `repository/apps/child.json`,
  `repository/manifests/board.json`, `parent.json`, `baseline-commit`, `parent-uid`, `wait-apps.sh`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: Oryginalny obiekt nadrzędny zarządza podrzędnym na podstawie poprawionego
  commita Git; oba synchronizują się do tego commita, a sprawny board odpowiada north-122.'
debrief: App-of-Apps uzgadnia zasoby Application jako obiekty zarządzane przez Git. Synchronizacja nadrzędna
  nie zastępuje kontroli synchronizacji podrzędnej, stanu i zachowania obciążenia.
stages.0.brief: 'Kryteria sukcesu: Oryginalny obiekt nadrzędny zarządza podrzędnym na podstawie poprawionego
  commita Git; oba synchronizują się do tego commita, a sprawny board odpowiada north-122.'
stages.0.objectives.0.text: Oryginalny obiekt nadrzędny zarządza podrzędnym na podstawie poprawionego
  commita Git; oba synchronizują się do tego commita, a sprawny board odpowiada north-122.
hints.0.text: Podążaj za rodzicem source → dzieckiem source → obciążeniem; zdrowy rodzic sam nie udowodni,
  że jego dziecko jest gotowe.
hints.1.text: Sprawdź manifest dziecka Application w repository/apps/, a nie tylko żywe dziecko.
hints.2.text: Zmień dziecko source path na manifests/, commit i push; odśwież element nadrzędny i sprawdź
  obie wersje.
phrases.0: Postępowałem zgodnie z łańcuchem pojednania rodzic-dziecko.
phrases.1: Naprawiłem żądany stan w Git, a nie w wygenerowanym dziecku.
phrases.2: Sprawdziłem obie wersje i rzeczywistą reakcję na obciążenie.
questions.0.points.0: Element nadrzędny uzgodnił własne zarządzane obiekty, w tym aplikacje podrzędne.
questions.0.points.1: Sprawdź osobno każdą wersję dziecka, stan zdrowia i obciążenie pracą.
questions.0.prompt: Co potwierdza zsynchronizowany rodzic w App-of-Apps?
questions.1.points.0: Element nadrzędny jest właścicielem żądanego manifestu podrzędnego w Git.
questions.1.points.1: Self-heal może nadpisać drift na żywo; napraw zatwierdzenie źródłowe.
questions.1.prompt: Dlaczego bezpośrednia edycja elementu podrzędnego Application może być krótkotrwała?
