title: Argo CD App-of-Apps
brief: |-
  Hierarchia aplikacji nie dostarcza board. Przywróć wydanie zapisane w Git, w którym aplikacje nadrzędna i podrzędna odpowiadają działającej usłudze.

  Pracuj na workstation w `~/quest` z plikami `platform.env`, `repository/apps/child.yaml`, `repository/`, `parent.yaml`, `wait-apps.sh`.

  O ile nie wskazano inaczej, zasoby Kubernetes znajdują się w przestrzeni nazw zatoki (`DQ_NAMESPACE`); ścieżki w `~/quest` są na workstation.

  **Requirements:**

  - `HEAD` repozytorium na workstation jest opublikowany jako `origin/main` w nowym commicie zachowującym istniejącą historię repozytorium.
  - Zapisana w Git i działająca potomna Application `board` używają istniejącej zawartości obciążenia z repozytorium, zachowują właściwy projekt i cel w zatoce oraz pozostają zarządzane przez istniejącego rodzica.
  - Applications `parent` i `board` mają stan `Synced` dla `HEAD` repozytorium na workstation, a `board` ma stan `Healthy`.
  - Istniejąca nadrzędna Application zachowuje tożsamość i pierwotny katalog źródłowy.
  - Deployment `board` ma dokładnie `1` gotową replikę.
  - Wewnątrz Poda Deployment `board` adres `http://board:8080` zwraca `north-122`.

  Bieżące śledzenie i stan nie dowodzą, że obiekty nigdy nie były stosowane bezpośrednio.
debrief: App-of-Apps uzgadnia zasoby Application jako obiekty zarządzane przez Git. Synchronizacja nadrzędna
  nie zastępuje kontroli synchronizacji podrzędnej, stanu i zachowania obciążenia.
stages.0.brief: Zachowaj tożsamość i źródło istniejącego rodzica.
hints.0.text: Podążaj za rodzicem source → dzieckiem source → obciążeniem; zdrowy rodzic sam nie udowodni,
  że jego dziecko jest gotowe.
hints.1.text: |-
  Sprawdź dokument dziecka w Git i działającą relację rodzica z dzieckiem.

  ```bash
  cat repository/apps/child.yaml
  kubectl get applications parent board -o yaml
  ```
hints.2.text: |-
  Zmień dziecko source path na manifests/, commit i push; odśwież element nadrzędny i sprawdź obie wersje. Sprawdź manifest dziecka Application w repository/apps/, a nie tylko żywe dziecko.

  Sprawdź z `~/quest` na workstation:

  - `git -C repository ls-remote origin refs/heads/main`
  - `git -C repository rev-parse HEAD`

  Oba hashe są identyczne.

  - `kubectl get applications parent board -o json | jq '.items[] | {name:.metadata.name,sync:.status.sync.status,health:.status.health.status,revision:.status.sync.revision,uid:.metadata.uid,path:.spec.source.path,project:.spec.project,destination:.spec.destination.namespace,tracking:.metadata.annotations["argocd.argoproj.io/tracking-id"]}'`

  Obie mają stan `Synced` dla lokalnego HEAD; `board` ma stan `Healthy`. UID/ścieżka rodzica oraz projekt/ścieżka/cel/tracking dziecka odpowiadają Requirements.

  - `kubectl exec deployment/board -- wget -qO- -T 3 http://board:8080`

  `north-122`.

  - `bash wait-apps.sh` — kod `0`; sprawdzenia dostarczonego wydania przechodzą.
phrases.0: Postępowałem zgodnie z łańcuchem pojednania rodzic-dziecko.
phrases.1: Naprawiłem żądany stan w Git, a nie w wygenerowanym dziecku.
phrases.2: Sprawdziłem obie wersje i rzeczywistą reakcję na obciążenie.
questions.0.points.0: Element nadrzędny uzgodnił własne zarządzane obiekty, w tym aplikacje podrzędne.
questions.0.points.1: Sprawdź osobno każdą wersję dziecka, stan zdrowia i obciążenie pracą.
questions.0.prompt: Co potwierdza zsynchronizowany rodzic w App-of-Apps?
questions.1.points.0: Element nadrzędny jest właścicielem żądanego manifestu podrzędnego w Git.
questions.1.points.1: Self-heal może nadpisać drift na żywo; napraw zatwierdzenie źródłowe.
questions.1.prompt: Dlaczego bezpośrednia edycja elementu podrzędnego Application może być krótkotrwała?
diagnostics.ancestor: baseline-commit musi być przodkiem HEAD.
diagnostics.changed: HEAD musi różnić się od baseline-commit.
diagnostics.origin: origin/main musi być równe HEAD.
diagnostics.child_kind: Kind dziecka Application w Git musi wynosić Application.
diagnostics.child_name: Nazwa dziecka Application w Git musi wynosić board.
diagnostics.child_source: Ścieżka źródła dziecka Application w Git musi wynosić manifests.
diagnostics.health: application/board health.status musi być równe Healthy.
diagnostics.parent_uid: application/parent metadata.uid musi być równe parent-uid.
diagnostics.parent_path: application/parent source.path musi być równe apps.
diagnostics.project: application/board project musi być równe station.
diagnostics.destination: application/board destination.namespace musi być równe DQ_NAMESPACE.
diagnostics.source: application/board source.path musi być równe manifests.
diagnostics.tracking: tracking-id dziecka musi odpowiadać identyfikatorowi śledzenia rodzica.
diagnostics.ready: deployment/board readyReplicas musi być równe 1.
diagnostics.http: Żądanie do board:8080 musi zwrócić north-122.
diagnostics.sync_parent: application/parent sync.status musi być równe Synced.
diagnostics.sync_board: application/board sync.status musi być równe Synced.
diagnostics.revision_parent: application/parent sync.revision musi być równe HEAD.
diagnostics.revision_board: application/board sync.revision musi być równe HEAD.
