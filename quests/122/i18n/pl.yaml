diagnostics.ancestor: Bieżący HEAD może nie pochodzić z podanej bazy albo zapis jest nieczytelny. Sprawdź historię commitów przed publikacją naprawy do przodu. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q122-parent-forward-git-history)
diagnostics.changed: Edycja katalogu roboczego może pozostawić HEAD na bazie. Porównaj obie rewizje i sprawdź, czy poprawka jest zapisana w commicie. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q122-parent-repair-commit)
diagnostics.origin: Lokalny commit może nie być bieżącym remote main albo odczyt zdalny zawodzi. Porównaj HEAD z końcem gałęzi zwróconym przez origin. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q122-parent-published-main)
diagnostics.child_kind: Zatwierdzony obiekt podrzędny może nie istnieć, mieć błędny YAML lub inny kind. Sprawdź kind Application w apps/child.yaml z HEAD. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q122-parent-git-child-kind)
diagnostics.child_name: Obiekt podrzędny w commicie może mieć inną nazwę lub być nieczytelny. Sprawdź apps/child.yaml z HEAD i zachowaj nazwę board. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q122-parent-git-child-name)
diagnostics.child_source: Obiekt podrzędny w Git może wskazywać starą, bezwzględną lub nadrzędną ścieżkę. Sprawdź, czy zapisana ścieżka względna prowadzi do manifests. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q122-parent-git-child-source)
diagnostics.project: Aktywny obiekt podrzędny może mieć inny AppProject lub nadal starszą specyfikację. Sprawdź, czy bieżący project to station. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q122-parent-live-child-project)
diagnostics.destination: Aktywny obiekt podrzędny może kierować do innej przestrzeni. Porównaj przestrzeń docelową z przestrzenią stanowiska. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q122-parent-live-child-destination)
diagnostics.source: Ścieżka w commicie może być poprawna, choć aktywne dziecko używa starego katalogu. Po uzgodnieniu parent sprawdź ścieżkę względną do manifests. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q122-parent-live-child-source)
diagnostics.tracking: Ręcznie utworzony obiekt podrzędny może nie mieć adnotacji parent. Porównaj aktywny tracking ID z tożsamością parent w przestrzeni. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q122-parent-live-child-tracking)
diagnostics.sync_parent: Wskazane Application może nadal być OutOfSync albo nie móc zastosować źródła. Sprawdź status parent lub board i błędy uzgodnienia. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q122-parent-and-child-sync-state)
diagnostics.sync_board: Wskazane Application może nadal być OutOfSync albo nie móc zastosować źródła. Sprawdź status parent lub board i błędy uzgodnienia. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q122-parent-and-child-sync-state)
diagnostics.revision_parent: Application może zgłaszać synchronizację do wcześniejszego commitu. Porównaj rewizję wskazanego parent lub board z aktualnym opublikowanym HEAD. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q122-parent-and-child-published-revision)
diagnostics.revision_board: Application może zgłaszać synchronizację do wcześniejszego commitu. Porównaj rewizję wskazanego parent lub board z aktualnym opublikowanym HEAD. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q122-parent-and-child-published-revision)
diagnostics.health: Dziecko może być zsynchronizowane, choć obciążenie nadal nie jest gotowe. Sprawdź zdrowie board i jego pody po uzgodnieniu. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q122-parent-child-application-health)
diagnostics.parent_uid: Odtworzenie nadrzędnego Application pod tą samą nazwą trwale zmienia UID. Porównaj bieżący UID parent z zamrożonym zapisem. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q122-retained-parent-application-uid)
diagnostics.parent_path: Aktywny rodzic może kierować prosto do manifestów zamiast katalogu dzieci. Sprawdź, czy jego dokładna ścieżka to apps. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q122-retained-parent-apps-path)
diagnostics.ready: Deployment zarządzany przez dziecko może nie mieć gotowej repliki. Sprawdź zdarzenia i poczekaj na jedną gotową replikę board. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q122-parent-child-workload-ready)
diagnostics.http: Application może mieć Healthy, choć board zwraca starą treść lub chwilowo nie odpowiada. Odpytaj aktywny Service i porównaj z north-122. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q122-parent-child-live-service)
diagnostics.publication: W commicie lub aktywnym kontenerze worker może brakować montowania board-publication tylko do odczytu. Sprawdź montowanie, tracking dziecka i zatwierdzoną rewizję ConfigMap oraz aktywny endpoint HTTP. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q122-parent-child-approved-publication)
diagnostics.probe_0_1: Kontrola dziecka może zakończyć się bez wskazania warunku, gdy narzędzia, repozytorium lub dane zawodzą. Sprawdź katalog Git i dostęp do API. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q122-parent-child-observer-input)
diagnostics.probe_0_5: Kontrola publikacji może przerwać działanie przed wskazaniem pola, gdy proces lub dane zawodzą. Sprawdź repozytorium, narzędzia i dostęp do board-publication oraz board. [Przyczyna i kontrola](guides#guide=gitops-delivery&section=q122-parent-publication-observer-input)
