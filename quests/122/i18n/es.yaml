title: Argo CD App-of-Apps
brief: 'Trabaja en `~/quest` con `platform.env`, `repository/apps/child.json`, `repository/manifests/board.json`, `parent.json`,
  `baseline-commit`, `parent-uid` y `wait-apps.sh`. En app-of-apps una Application padre de Argo reconcilia una Application
  hija, que reconcilia el workload. Repara la `Application` hija confirmada llamada `board` con ruta de origen `manifests`,
  confirma un descendiente distinto de `baseline-commit` y envíalo al `origin/main` privado; debe coincidir con HEAD local.
  Espera que ambas Applications estén `Synced` en HEAD y la hija `Healthy`.


  Conserva el UID del padre de `parent-uid` y la ruta `apps`. La hija debe usar proyecto `station`, namespace de la bahía
  y ruta `manifests`; su anotación de seguimiento debe ser `${DQ_NAMESPACE}_parent:argoproj.io/Application:${DQ_NAMESPACE}/board`.
  El Deployment board debe tener una réplica lista y `board:8080` debe devolver `north-122`. `wait-apps.sh` muestra las comprobaciones
  de sincronización y salud esperadas. El seguimiento y estado actuales no demuestran que nunca se aplicaron objetos directamente.
  Usa solo la bahía sin conexión.'
debrief: App-of-Apps concilia los recursos Application como objetos administrados por Git. Una sincronización principal no
  reemplaza la inspección de la sincronización secundaria, el estado y el comportamiento de la carga de trabajo.
stages.0.brief: La ascendencia Git y el manifiesto hijo, identidad del padre, estados de ambas Applications, alcance de la
  hija y respuesta de board coinciden con la descripción.
stages.0.objectives.0.text: La ascendencia Git y el manifiesto hijo, identidad del padre, estados de ambas Applications, alcance
  de la hija y respuesta de board coinciden con la descripción.
hints.0.text: Siga la fuente principal → fuente secundaria → carga de trabajo; un padre sano por sí solo no demuestra que
  su hijo esté preparado.
hints.1.text: Inspeccione el manifiesto infantil Application en repository/apps/, no solo el niño vivo.
hints.2.text: Cambie la ruta de origen secundaria a manifests/, confirme y push; Actualice las revisiones principal y inspect.
phrases.0: Seguí la cadena de reconciliación entre padres e hijos.
phrases.1: Reparé el estado deseado en Git en lugar del hijo generado.
phrases.2: Verifiqué ambas revisiones y la respuesta real a la carga de trabajo.
questions.0.points.0: El padre concilió sus propios objetos administrados, incluidas las aplicaciones secundarias.
questions.0.points.1: Verifique la revisión, la salud y la carga de trabajo de cada niño por separado.
questions.0.prompt: ¿Qué prueba un padre sincronizado en App-of-Apps?
questions.1.points.0: El padre posee el manifiesto secundario deseado en Git.
questions.1.points.1: Self-heal puede sobrescribir la deriva en vivo; reparar la confirmación de fuente.
questions.1.prompt: ¿Por qué la edición directa de un Application infantil puede ser de corta duración?
diagnostics.ancestor: baseline-commit debe ser antecesor de HEAD.
diagnostics.changed: HEAD debe ser distinto de baseline-commit.
diagnostics.origin: origin/main debe ser igual a HEAD.
diagnostics.child_kind: El kind de la Application hija en Git debe ser Application.
diagnostics.child_name: El nombre de la Application hija en Git debe ser board.
diagnostics.child_source: La ruta fuente de la Application hija en Git debe ser manifests.
diagnostics.health: application/board health.status debe ser igual a Healthy.
diagnostics.parent_uid: application/parent metadata.uid debe ser igual a parent-uid.
diagnostics.parent_path: application/parent source.path debe ser igual a apps.
diagnostics.project: application/board project debe ser igual a station.
diagnostics.destination: application/board destination.namespace debe ser igual a DQ_NAMESPACE.
diagnostics.source: application/board source.path debe ser igual a manifests.
diagnostics.tracking: El tracking-id del hijo debe coincidir con el identificador de seguimiento del padre.
diagnostics.ready: deployment/board readyReplicas debe ser igual a 1.
diagnostics.http: La petición a board:8080 debe devolver north-122.
diagnostics.sync_parent: application/parent sync.status debe ser igual a Synced.
diagnostics.sync_board: application/board sync.status debe ser igual a Synced.
diagnostics.revision_parent: application/parent sync.revision debe ser igual a HEAD.
diagnostics.revision_board: application/board sync.revision debe ser igual a HEAD.
