title: Argo CD App-of-Apps
brief: |-
  La jerarquía de aplicaciones no entrega board. Recupera una versión guardada en Git cuyo padre e hijo coincidan con el servicio en ejecución.

  Trabaja en la workstation en `~/quest` con `platform.env`, `repository/apps/child.yaml`, `repository/`, `parent.yaml`, `wait-apps.sh`.

  La revisión aprobada está registrada en `approved-publication`.

  Salvo indicación contraria, los recursos Kubernetes están en el namespace de la bahía (`DQ_NAMESPACE`); las rutas bajo `~/quest` están en la workstation.

  **Requirements:**

  - El `HEAD` del repositorio en la workstation está publicado como `origin/main` en un commit nuevo que conserva el historial existente del repositorio.
  - La Application hija `board` confirmada y activa usa el contenido existente de la carga del repositorio, conserva el proyecto y destino de la bahía previstos y sigue gestionada por el padre existente.
  - Las Applications `parent` y `board` están `Synced` en el `HEAD` del repositorio en la workstation y `board` está `Healthy`.
  - La Application padre existente conserva su identidad y su directorio fuente original.
  - El Deployment `board` tiene exactamente `1` réplica lista.
  - Desde un Pod del Deployment `board`, el servicio debe devolver `north-122` en `http://board:8080` y la revisión aprobada de `approved-publication` en `http://board:8080/publication/revision`. Usa el ConfigMap suministrado que ya contiene la revisión aprobada. Conserva su nombre y móntalo en solo lectura en la carga guardada en Git y en el Deployment activo.

  El seguimiento y el estado actuales no demuestran que los objetos nunca se aplicaran directamente.
debrief: |-
  Git, el seguimiento de recursos y el estado de la carga muestran dónde funcionó la reconciliación. Comparar la proyección con la respuesta HTTP muestra qué publicación entrega el servicio.
stages.0.brief: Conserva la identidad y la fuente del padre existente.
hints.0.text: |-
  Sigue por separado el padre, el hijo, la carga y los datos servidos. Un hijo Healthy todavía puede entregar una publicación antigua.
hints.1.text: |-
  Contrasta el origen del hijo guardado en Git con las Applications activas y los manifiestos de publicación. Cuando responda el servicio, compara la revisión servida con el registro suministrado.

  ```bash
  git -C repository show HEAD:apps/child.yaml
  kubectl get applications parent board -o yaml
  git -C repository ls-tree -r --name-only HEAD
  cat approved-publication
  ```
hints.2.text: |-
  Publica las dos correcciones por Git. Contrasta el ConfigMap que rastrea el hijo, el origen del volumen del Deployment y la revisión devuelta por HTTP. La respuesta original del servicio debe conservarse.

  ```bash
  git -C repository ls-remote origin refs/heads/main
  git -C repository rev-parse HEAD
  bash wait-apps.sh
  kubectl get deployment board -o json | jq '.spec.template.spec | {volumes, mounts: [.containers[].volumeMounts[]?]}'
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080/publication/revision
  kubectl get configmaps -o json | jq '.items[] | select(.metadata.annotations["argocd.argoproj.io/tracking-id"] != null) | {name:.metadata.name,revision:.data.revision}'
  cat approved-publication
  ```
phrases.0: Seguí la cadena de reconciliación entre padres e hijos.
phrases.1: Reparé el estado deseado en Git en lugar del hijo generado.
phrases.2: Verifiqué ambas revisiones y la respuesta real a la carga de trabajo.
questions.0.points.0: El padre concilió sus propios objetos administrados, incluidas las aplicaciones
  secundarias.
questions.0.points.1: Verifique la revisión, la salud y la carga de trabajo de cada niño por separado.
questions.0.prompt: ¿Qué prueba un padre sincronizado en App-of-Apps?
questions.1.points.0: El padre posee el manifiesto secundario deseado en Git.
questions.1.points.1: Self-heal puede sobrescribir la deriva en vivo; reparar la confirmación de fuente.
questions.1.prompt: ¿Por qué la edición directa de un Application infantil puede ser de corta duración?
stages.0.objectives.0.text: El `HEAD` del repositorio en la workstation está publicado como `origin/main`
  en un commit nuevo que conserva el historial existente del repositorio.
stages.0.objectives.1.text: La Application hija `board` confirmada y activa usa el contenido existente
  de la carga del repositorio, conserva el proyecto y destino de la bahía previstos y sigue gestionada
  por el padre existente.
stages.0.objectives.2.text: Las Applications `parent` y `board` están `Synced` en el `HEAD` del repositorio
  en la workstation y `board` está `Healthy`.
stages.0.objectives.3.text: La Application padre existente conserva su identidad y su directorio fuente
  original.
stages.0.objectives.4.text: El Deployment `board` tiene exactamente `1` réplica lista.
stages.0.objectives.5.text: |-
  Desde un Pod del Deployment `board`, el servicio debe devolver `north-122` en `http://board:8080` y la revisión aprobada de `approved-publication` en `http://board:8080/publication/revision`. Usa el ConfigMap suministrado que ya contiene la revisión aprobada. Conserva su nombre y móntalo en solo lectura en la carga guardada en Git y en el Deployment activo.
diagnostics.ancestor: El HEAD actual puede no descender de la base suministrada o esta ser ilegible. Revise la ascendencia antes de publicar una reparación hacia delante. [Causa y comprobación](guides#guide=gitops-delivery&section=q122-parent-forward-git-history)
diagnostics.changed: Editar la copia local puede dejar HEAD en la base. Compare ambas revisiones y confirme que la reparación está en un commit. [Causa y comprobación](guides#guide=gitops-delivery&section=q122-parent-repair-commit)
diagnostics.origin: El commit local puede no coincidir con main remoto o fallar la consulta remota. Compare HEAD con el extremo de la rama devuelto por origin. [Causa y comprobación](guides#guide=gitops-delivery&section=q122-parent-published-main)
diagnostics.child_kind: El recurso hijo puede faltar, ser YAML inválido o tener otro kind. Revise kind Application en apps/child.yaml de HEAD. [Causa y comprobación](guides#guide=gitops-delivery&section=q122-parent-git-child-kind)
diagnostics.child_name: El objeto hijo del commit puede tener otro nombre o no ser legible. Revise apps/child.yaml de HEAD y conserve el nombre board. [Causa y comprobación](guides#guide=gitops-delivery&section=q122-parent-git-child-name)
diagnostics.child_source: El hijo en Git puede señalar un directorio retirado, absoluto o que sube al padre. Compruebe que su ruta relativa del commit resuelva a manifests. [Causa y comprobación](guides#guide=gitops-delivery&section=q122-parent-git-child-source)
diagnostics.project: El hijo activo puede pertenecer a otro AppProject o conservar una especificación anterior. Compruebe que su project actual sea station. [Causa y comprobación](guides#guide=gitops-delivery&section=q122-parent-live-child-project)
diagnostics.destination: El hijo activo puede apuntar a otro namespace. Compare su namespace de destino con el del entorno. [Causa y comprobación](guides#guide=gitops-delivery&section=q122-parent-live-child-destination)
diagnostics.source: La ruta del commit puede ser correcta mientras el hijo activo usa el directorio anterior. Tras reconciliar parent, compruebe su ruta relativa a manifests. [Causa y comprobación](guides#guide=gitops-delivery&section=q122-parent-live-child-source)
diagnostics.tracking: Un hijo creado manualmente puede carecer de anotación de seguimiento de parent. Compare el ID activo con la identidad de parent en el entorno. [Causa y comprobación](guides#guide=gitops-delivery&section=q122-parent-live-child-tracking)
diagnostics.sync_parent: La Application indicada puede seguir OutOfSync o no poder aplicar su fuente. Revise el estado de parent o board y los errores de reconciliación. [Causa y comprobación](guides#guide=gitops-delivery&section=q122-parent-and-child-sync-state)
diagnostics.sync_board: La Application indicada puede seguir OutOfSync o no poder aplicar su fuente. Revise el estado de parent o board y los errores de reconciliación. [Causa y comprobación](guides#guide=gitops-delivery&section=q122-parent-and-child-sync-state)
diagnostics.revision_parent: Una Application puede mostrar sincronización con un commit anterior. Compare la revisión de parent o board con el HEAD publicado actual. [Causa y comprobación](guides#guide=gitops-delivery&section=q122-parent-and-child-published-revision)
diagnostics.revision_board: Una Application puede mostrar sincronización con un commit anterior. Compare la revisión de parent o board con el HEAD publicado actual. [Causa y comprobación](guides#guide=gitops-delivery&section=q122-parent-and-child-published-revision)
diagnostics.health: El hijo puede estar sincronizado mientras su carga aún no está saludable. Revise board y sus Pods tras la reconciliación. [Causa y comprobación](guides#guide=gitops-delivery&section=q122-parent-child-application-health)
diagnostics.parent_uid: Recrear la Application padre con el mismo nombre cambia su UID permanentemente. Compare el UID activo de parent con el registro original fijado. [Causa y comprobación](guides#guide=gitops-delivery&section=q122-retained-parent-application-uid)
diagnostics.parent_path: El padre activo puede apuntar directamente a los manifiestos en vez del directorio de hijos. Compruebe que su ruta exacta siga siendo apps. [Causa y comprobación](guides#guide=gitops-delivery&section=q122-retained-parent-apps-path)
diagnostics.ready: El Deployment del hijo puede carecer de una réplica lista. Revise los eventos y espere una réplica lista de board. [Causa y comprobación](guides#guide=gitops-delivery&section=q122-parent-child-workload-ready)
diagnostics.http: La Application puede estar Healthy aunque board sirva contenido anterior o no responda temporalmente. Consulte el Service activo y compare con north-122. [Causa y comprobación](guides#guide=gitops-delivery&section=q122-parent-child-live-service)
diagnostics.publication: En el commit o el worker activo puede faltar el montaje board-publication de solo lectura. Revise el montaje, el seguimiento del hijo y la revisión aprobada del ConfigMap, además de la ruta HTTP activa. [Causa y comprobación](guides#guide=gitops-delivery&section=q122-parent-child-approved-publication)
diagnostics.probe_0_1: El observador del hijo puede detenerse antes de señalar un campo si fallan las herramientas, repositorio o entradas. Revise Git local y acceso al API. [Causa y comprobación](guides#guide=gitops-delivery&section=q122-parent-child-observer-input)
diagnostics.probe_0_5: La comprobación de publicación puede detenerse antes de señalar un campo si falla el proceso o las entradas. Revise repositorio, herramientas y acceso a board-publication y board. [Causa y comprobación](guides#guide=gitops-delivery&section=q122-parent-publication-observer-input)
