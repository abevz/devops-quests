title: Argo CD App-of-Apps
brief: 'Un Argo CD Application principal lee apps/ del repositorio privado Git y crea un Application secundario.
  El niño apunta a retired/, mientras que el board actual manifests vive en manifests/.. Repara repository/apps/child.json
  en Git, compromete un descendiente de baseline-commit y Empuje solo al origin privado suministrado.
  Deje que el padre concilie al hijo, luego el hijo concilie el board. No aplicar al niño o carga de trabajo
  directamente. Conserve el padre original UID y compare ambas aplicaciones con la confirmación publicada.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `platform.env`, `repository/apps/child.json`,
  `repository/manifests/board.json`, `parent.json`, `baseline-commit`, `parent-uid`, `wait-apps.sh`.


  La bahía no dispone de Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes
  precargadas y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: el padre original administra al niño desde la confirmación Git reparada;
  ambos se sincronizan con esa confirmación y el board en buen estado responde north-122.'
debrief: App-of-Apps concilia los recursos Application como objetos administrados por Git. Una sincronización
  principal no reemplaza la inspección de la sincronización secundaria, el estado y el comportamiento
  de la carga de trabajo.
stages.0.brief: 'Criterios de éxito: el padre original administra al niño desde el compromiso de Git reparado;
  ambos se sincronizan con ese compromiso y el board en buen estado responde north-122.'
stages.0.objectives.0.text: El padre original administra al niño desde el compromiso de Git reparado;
  ambos se sincronizan con ese compromiso y el board saludable responde north-122.
hints.0.text: Siga la fuente principal → fuente secundaria → carga de trabajo; un padre sano por sí solo
  no demuestra que su hijo esté preparado.
hints.1.text: Inspeccione el manifiesto infantil Application en repository/apps/, no solo el niño vivo.
hints.2.text: Cambie la ruta de origen secundaria a manifests/, confirme y push; Actualice las revisiones
  principal y inspect.
phrases.0: Seguí la cadena de reconciliación entre padres e hijos.
phrases.1: Reparé el estado deseado en Git en lugar del hijo generado.
phrases.2: Verifiqué ambas revisiones y la respuesta real a la carga de trabajo.
questions.0.points.0: El padre concilió sus propios objetos administrados, incluidas las aplicaciones
  secundarias.
questions.0.points.1: Verifique la revisión, la salud y la carga de trabajo de cada niño por separado.
questions.0.prompt: ¿Qué prueba un padre sincronizado en App-of-Apps?
questions.1.points.0: El padre posee el manifiesto secundario deseado en Git.
questions.1.points.1: Self-heal puede sobrescribir la deriva en vivo; reparar la confirmación de fuente.
questions.1.prompt: ¿Por qué la edición directa de un Application infantil puede ser de corta duración?
