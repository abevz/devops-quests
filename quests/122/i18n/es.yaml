title: Argo CD App-of-Apps
brief: |-
  La jerarquía de aplicaciones no entrega board. Recupera una versión guardada en Git cuyo padre e hijo coincidan con el servicio en ejecución.

  Trabaja en la workstation en `~/quest` con `platform.env`, `repository/apps/child.yaml`, `repository/`, `parent.yaml`, `wait-apps.sh`.

  Salvo indicación contraria, los recursos Kubernetes están en el namespace de la bahía (`DQ_NAMESPACE`); las rutas bajo `~/quest` están en la workstation.

  **Requirements:**

  - El `HEAD` del repositorio en la workstation está publicado como `origin/main` en un commit nuevo que conserva el historial existente del repositorio.
  - La Application hija `board` confirmada y activa usa el contenido existente de la carga del repositorio, conserva el proyecto y destino de la bahía previstos y sigue gestionada por el padre existente.
  - Las Applications `parent` y `board` están `Synced` en el `HEAD` del repositorio en la workstation y `board` está `Healthy`.
  - La Application padre existente conserva su identidad y su directorio fuente original.
  - El Deployment `board` tiene exactamente `1` réplica lista.
  - Dentro de un Pod del Deployment `board`, `http://board:8080` devuelve `north-122`.

  El seguimiento y el estado actuales no demuestran que los objetos nunca se aplicaran directamente.
debrief: App-of-Apps concilia los recursos Application como objetos administrados por Git. Una sincronización
  principal no reemplaza la inspección de la sincronización secundaria, el estado y el comportamiento
  de la carga de trabajo.
stages.0.brief: Conserva la identidad y la fuente del padre existente.
hints.0.text: Siga la fuente principal → fuente secundaria → carga de trabajo; un padre sano por sí solo
  no demuestra que su hijo esté preparado.
hints.1.text: |-
  Inspecciona el documento hijo en Git y la relación activa entre padre e hijo.

  ```bash
  cat repository/apps/child.yaml
  kubectl get applications parent board -o yaml
  ```
hints.2.text: |-
  Cambie la ruta de origen secundaria a manifests/, confirme y push; Actualice las revisiones principal y inspect. Inspeccione el manifiesto infantil Application en repository/apps/, no solo el niño vivo.

  Verifica desde `~/quest` en la workstation:

  - `git -C repository ls-remote origin refs/heads/main`
  - `git -C repository rev-parse HEAD`

  Ambos hashes son idénticos.

  - `kubectl get applications parent board -o json | jq '.items[] | {name:.metadata.name,sync:.status.sync.status,health:.status.health.status,revision:.status.sync.revision,uid:.metadata.uid,path:.spec.source.path,project:.spec.project,destination:.spec.destination.namespace,tracking:.metadata.annotations["argocd.argoproj.io/tracking-id"]}'`

  Ambas están `Synced` en el HEAD local; `board` está `Healthy`. El UID/ruta del padre y proyecto/ruta/destino/tracking del hijo coinciden con Requirements.

  - `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080`

  `north-122`.

  - `bash wait-apps.sh` — código `0`; pasan las comprobaciones de la versión suministrada.
phrases.0: Seguí la cadena de reconciliación entre padres e hijos.
phrases.1: Reparé el estado deseado en Git en lugar del hijo generado.
phrases.2: Verifiqué ambas revisiones y la respuesta real a la carga de trabajo.
questions.0.points.0: El padre concilió sus propios objetos administrados, incluidas las aplicaciones
  secundarias.
questions.0.points.1: Verifique la revisión, la salud y la carga de trabajo de cada niño por separado.
questions.0.prompt: ¿Qué prueba un padre sincronizado en App-of-Apps?
questions.1.points.0: El padre posee el manifiesto secundario deseado en Git.
questions.1.points.1: Self-heal puede sobrescribir la deriva en vivo; reparar la confirmación de fuente.
questions.1.prompt: ¿Por qué la edición directa de un Application infantil puede ser de corta duración?
diagnostics.ancestor: baseline-commit debe ser antecesor de HEAD.
diagnostics.changed: HEAD debe ser distinto de baseline-commit.
diagnostics.origin: origin/main debe ser igual a HEAD.
diagnostics.child_kind: El kind de la Application hija en Git debe ser Application.
diagnostics.child_name: El nombre de la Application hija en Git debe ser board.
diagnostics.child_source: La ruta fuente de la Application hija en Git debe ser manifests.
diagnostics.health: application/board health.status debe ser igual a Healthy.
diagnostics.parent_uid: application/parent metadata.uid debe ser igual a parent-uid.
diagnostics.parent_path: application/parent source.path debe ser igual a apps.
diagnostics.project: application/board project debe ser igual a station.
diagnostics.destination: application/board destination.namespace debe ser igual a DQ_NAMESPACE.
diagnostics.source: application/board source.path debe ser igual a manifests.
diagnostics.tracking: El tracking-id del hijo debe coincidir con el identificador de seguimiento del padre.
diagnostics.ready: deployment/board readyReplicas debe ser igual a 1.
diagnostics.http: La petición a board:8080 debe devolver north-122.
diagnostics.sync_parent: application/parent sync.status debe ser igual a Synced.
diagnostics.sync_board: application/board sync.status debe ser igual a Synced.
diagnostics.revision_parent: application/parent sync.revision debe ser igual a HEAD.
diagnostics.revision_board: application/board sync.revision debe ser igual a HEAD.
