title: Argo CD App-of-Apps
brief: |-
  The application hierarchy is not delivering the board. Restore a committed release whose parent and child agree with the running service.

  Work on the workstation in `~/quest` with `platform.env`, `repository/apps/child.yaml`, `repository/`, `parent.yaml`, `wait-apps.sh`.

  The approved revision is recorded in `approved-publication`.

  Unless stated otherwise, Kubernetes resources live in the bay namespace (`DQ_NAMESPACE`); `~/quest` paths are on the workstation.

  **Requirements:**

  - Workstation repository `HEAD` is published as `origin/main` in a new commit that retains the existing repository history.
  - The committed and live child Application `board` use the repository’s existing workload content, retain their intended project and bay destination, and remain managed by the existing parent.
  - Applications `parent` and `board` are `Synced` at workstation repository `HEAD`, and `board` is `Healthy`.
  - The existing parent Application keeps its identity and its original source directory.
  - Deployment `board` has exactly `1` ready replica.
  - Inside a Pod of Deployment `board`, the Service must serve `north-122` at `http://board:8080` and the approved revision from `approved-publication` at `http://board:8080/publication/revision`. Use the supplied ConfigMap that already contains the approved revision. Keep its name and use it as a read-only projection in the committed workload and the live Deployment.

  Current tracking and status do not prove that objects were never applied directly.
debrief: |-
  Git, tracking and workload health establish where reconciliation succeeded. Comparing the projection with the actual HTTP response establishes which publication the Service delivers.
stages.0.brief: Keep the existing parent identity and source.
hints.0.text: |-
  Follow parent, child, workload and served data separately. A Healthy child can still deliver an old publication.
hints.1.text: |-
  Compare the committed child source, the live Applications and the publication manifests. Once the Service responds, compare its revision with the supplied publication record.

  Trace the committed ConfigMap to the declared Deployment volume. Find the projected file and compare its contents with the approved publication and the HTTP response.

  ```bash
  git -C repository show HEAD:apps/child.yaml
  kubectl get applications parent board -o yaml
  git -C repository ls-tree -r --name-only HEAD
  cat approved-publication
  ```
hints.2.text: |-
  Compare the child’s tracked ConfigMap, the Deployment’s volume source and the live HTTP revision. The Service should still return its original main response.

  ```bash
  git -C repository ls-remote origin refs/heads/main
  git -C repository rev-parse HEAD
  bash wait-apps.sh
  kubectl get deployment board -o json | jq '.spec.template.spec | {volumes, mounts: [.containers[].volumeMounts[]?]}'
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080
  kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080/publication/revision
  kubectl get configmaps -o json | jq '.items[] | select(.metadata.annotations["argocd.argoproj.io/tracking-id"] != null) | {name:.metadata.name,revision:.data.revision}'
  cat approved-publication
  ```

  ```bash
  (
    set -euo pipefail
    cd ~/quest
    source platform.env
    approved=$(cat /run/dq/facts/0/approved-publication)
    uses_publication() {
      jq -e '.spec.template.spec as $pod |
        any($pod.volumes[]?; .configMap.name=="board-publication" and
          (.name as $volume | any($pod.containers[]?; .name=="worker" and
            any(.volumeMounts[]?; .name==$volume and .readOnly==true))))'
    }
    head=$(git -C repository ls-remote origin refs/heads/main | cut -f1)
    git -C repository show "$head:manifests/board.yaml" |
      python3 -I -c 'import json,sys,yaml; json.dump(yaml.safe_load(sys.stdin),sys.stdout)' |
      uses_publication
    kubectl get deployment board -o json | uses_publication
    kubectl get configmap board-publication -o json |
      jq -e --arg namespace "$DQ_NAMESPACE" --arg approved "$approved" '
        .data.revision==$approved and
        .metadata.annotations["argocd.argoproj.io/tracking-id"]==($namespace+"_board:/ConfigMap:"+$namespace+"/board-publication")'
    test "$(kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080)" = north-122
    test "$(kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080/publication/revision)" = "$approved"
  )
  ```

  The Service root returns north-122. The publication endpoint matches approved-publication.
phrases.0: I followed the parent-to-child reconciliation chain.
phrases.1: I repaired desired state in Git rather than the generated child.
phrases.2: I verified both revisions and the actual workload response.
questions.0.points.0: The parent reconciled its own managed objects, including child Applications.
questions.0.points.1: Check each child revision, health and workload separately.
questions.0.prompt: What does a synced parent prove in App-of-Apps?
questions.1.points.0: The parent owns the desired child manifest in Git.
questions.1.points.1: Self-heal can overwrite live drift; repair the source commit.
questions.1.prompt: Why can editing a child Application directly be short-lived?
stages.0.objectives.0.text: Workstation repository `HEAD` is published as `origin/main` in a new commit
  that retains the existing repository history.
stages.0.objectives.1.text: The committed and live child Application `board` use the repository’s existing
  workload content, retain their intended project and bay destination, and remain managed by the existing
  parent.
stages.0.objectives.2.text: Applications `parent` and `board` are `Synced` at workstation repository `HEAD`,
  and `board` is `Healthy`.
stages.0.objectives.3.text: The existing parent Application keeps its identity and its original source
  directory.
stages.0.objectives.4.text: Deployment `board` has exactly `1` ready replica.
stages.0.objectives.5.text: |-
  Inside a Pod of Deployment `board`, the Service must serve `north-122` at `http://board:8080` and the approved revision from `approved-publication` at `http://board:8080/publication/revision`. Use the supplied ConfigMap that already contains the approved revision. Keep its name and use it as a read-only projection in the committed workload and the live Deployment.
diagnostics.ancestor: The current HEAD may no longer descend from the supplied baseline, or the baseline may be unreadable. Inspect the commit ancestry before publishing a forward repair. [Cause and check](guides#guide=gitops-delivery&section=q122-parent-forward-git-history)
diagnostics.changed: A working-tree edit may still leave HEAD at the baseline. Compare the two revisions and verify the intended repair is committed. [Cause and check](guides#guide=gitops-delivery&section=q122-parent-repair-commit)
diagnostics.origin: The local repair commit may not be the current remote main, or the remote lookup may fail. Compare local HEAD with the branch tip returned by origin. [Cause and check](guides#guide=gitops-delivery&section=q122-parent-published-main)
diagnostics.child_kind: The committed child may be missing, invalid YAML, or another kind of resource. Inspect apps/child.yaml in HEAD for kind Application. [Cause and check](guides#guide=gitops-delivery&section=q122-parent-git-child-kind)
diagnostics.child_name: The committed child may have a different metadata name or be unreadable. Inspect apps/child.yaml in HEAD and keep the child named board. [Cause and check](guides#guide=gitops-delivery&section=q122-parent-git-child-name)
diagnostics.child_source: The Git child may still point to a retired, absolute or parent-traversing directory. Verify its committed relative source path resolves to manifests. [Cause and check](guides#guide=gitops-delivery&section=q122-parent-git-child-source)
diagnostics.project: The live child may have been reconciled into another AppProject or may still show an earlier spec. Check that the child’s current project is station. [Cause and check](guides#guide=gitops-delivery&section=q122-parent-live-child-project)
diagnostics.destination: The live child may target the wrong namespace. Compare its destination namespace with the supplied bay namespace. [Cause and check](guides#guide=gitops-delivery&section=q122-parent-live-child-destination)
diagnostics.source: The committed path can be correct while the active child still uses the former directory. Compare the active relative path with manifests after reconciling parent. [Cause and check](guides#guide=gitops-delivery&section=q122-parent-live-child-source)
diagnostics.tracking: A manually created child may lack the parent’s tracking annotation. Compare the live tracking ID with the parent identity in the bay. [Cause and check](guides#guide=gitops-delivery&section=q122-parent-live-child-tracking)
diagnostics.sync_parent: The affected Application may still be OutOfSync or unable to apply its source. Check the flagged parent or board status and its reconciliation errors. [Cause and check](guides#guide=gitops-delivery&section=q122-parent-and-child-sync-state)
diagnostics.sync_board: The affected Application may still be OutOfSync or unable to apply its source. Check the flagged parent or board status and its reconciliation errors. [Cause and check](guides#guide=gitops-delivery&section=q122-parent-and-child-sync-state)
diagnostics.revision_parent: An Application may report a synchronization to an earlier commit. Compare the affected parent or board revision with the current published HEAD. [Cause and check](guides#guide=gitops-delivery&section=q122-parent-and-child-published-revision)
diagnostics.revision_board: An Application may report a synchronization to an earlier commit. Compare the affected parent or board revision with the current published HEAD. [Cause and check](guides#guide=gitops-delivery&section=q122-parent-and-child-published-revision)
diagnostics.health: The child may be synced while its workload is still unhealthy. Check board’s health and its running Pods after reconciliation. [Cause and check](guides#guide=gitops-delivery&section=q122-parent-child-application-health)
diagnostics.parent_uid: Recreating the parent Application under the same name permanently changes its UID. Compare the live parent UID with the original frozen receipt. [Cause and check](guides#guide=gitops-delivery&section=q122-retained-parent-application-uid)
diagnostics.parent_path: The live parent may point directly at workload manifests instead of the child directory. Check that its exact source path stays apps. [Cause and check](guides#guide=gitops-delivery&section=q122-retained-parent-apps-path)
diagnostics.ready: The child-managed Deployment may have no ready replica yet. Inspect its Pod events and wait for one ready board replica. [Cause and check](guides#guide=gitops-delivery&section=q122-parent-child-workload-ready)
diagnostics.http: The Application can be healthy while board serves stale content or is temporarily unreachable. Query the live Service and compare its body with north-122. [Cause and check](guides#guide=gitops-delivery&section=q122-parent-child-live-service)
diagnostics.publication: The committed or live worker may lack the read-only board-publication mount, the ConfigMap may lack child tracking or the approved revision, or the live path may serve a stale value. Inspect all three boundaries. [Cause and check](guides#guide=gitops-delivery&section=q122-parent-child-approved-publication)
diagnostics.probe_0_1: The child observer may stop before naming a condition if its workstation tooling, repository or inputs fail. Check the local Git checkout and API access. [Cause and check](guides#guide=gitops-delivery&section=q122-parent-child-observer-input)
diagnostics.probe_0_5: The publication observer may stop before a field can be named if its local process or inputs fail. Check the repository, tools and access to board-publication and board. [Cause and check](guides#guide=gitops-delivery&section=q122-parent-publication-observer-input)
