title: Argo CD App-of-Apps
brief: 'A parent Argo CD Application reads apps/ from the private Git repository and creates a child Application.
  The child points to retired/, while the actual board manifests live in manifests/. Repair repository/apps/child.json
  in Git, commit a descendant of baseline-commit and push only to the supplied private origin. Let the
  parent reconcile the child, then the child reconcile the board. Do not apply the child or workload directly.
  Keep the original parent UID and compare both Applications with the published commit.


  Quest files in `~/quest` (some appear in later stages): `platform.env`, `repository/apps/child.json`,
  `repository/manifests/board.json`, `parent.json`, `baseline-commit`, `parent-uid`, `wait-apps.sh`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: The original parent manages the child from the repaired Git commit; both sync
  to that commit and the healthy board responds north-122.'
debrief: App-of-Apps reconciles Application resources as Git-managed objects. A parent sync does not replace
  inspection of child sync, health and workload behavior.
stages.0.brief: 'The original parent manages the child from the repaired Git commit; both sync to that
  commit and the healthy board responds north-122.


  Success criteria: The original parent manages the child from the repaired Git commit; both sync to that
  commit and the healthy board responds north-122.'
stages.0.objectives.0.text: The original parent manages the child from the repaired Git commit; both sync
  to that commit and the healthy board responds north-122.
hints.0.text: Follow parent source → child source → workload; a healthy parent alone does not prove its
  child is ready.
hints.1.text: Inspect the child Application manifest in repository/apps/, not only the live child.
hints.2.text: Change the child source path to manifests/, commit and push; refresh the parent and inspect
  both revisions.
phrases.0: I followed the parent-to-child reconciliation chain.
phrases.1: I repaired desired state in Git rather than the generated child.
phrases.2: I verified both revisions and the actual workload response.
questions.0.points.0: The parent reconciled its own managed objects, including child Applications.
questions.0.points.1: Check each child revision, health and workload separately.
questions.0.prompt: What does a synced parent prove in App-of-Apps?
questions.1.points.0: The parent owns the desired child manifest in Git.
questions.1.points.1: Self-heal can overwrite live drift; repair the source commit.
questions.1.prompt: Why can editing a child Application directly be short-lived?
