title: Argo CD App-of-Apps
brief: |-
  The application hierarchy is not delivering the board. Restore a committed release whose parent and child agree with the running service.

  Work on the workstation in `~/quest` with `platform.env`, `repository/apps/child.yaml`, `repository/`, `parent.yaml`, `wait-apps.sh`.

  Unless stated otherwise, Kubernetes resources live in the bay namespace (`DQ_NAMESPACE`); `~/quest` paths are on the workstation.

  **Requirements:**

  - Workstation repository `HEAD` is published as `origin/main` in a new commit that retains the existing repository history.
  - The committed and live child Application `board` use the repository’s existing workload content, retain their intended project and bay destination, and remain managed by the existing parent.
  - Applications `parent` and `board` are `Synced` at workstation repository `HEAD`, and `board` is `Healthy`.
  - The existing parent Application keeps its identity and its original source directory.
  - Deployment `board` has exactly `1` ready replica.
  - Inside a Pod of Deployment `board`, `http://board:8080` returns `north-122`.

  Current tracking and status do not prove that objects were never applied directly.
debrief: App-of-Apps reconciles Application resources as Git-managed objects. A parent sync does not replace
  inspection of child sync, health and workload behavior.
stages.0.brief: Keep the existing parent identity and source.
hints.0.text: Follow parent source → child source → workload; a healthy parent alone does not prove its
  child is ready.
hints.1.text: |-
  Inspect the committed child document and the live parent/child relationship.

  ```bash
  cat repository/apps/child.yaml
  kubectl get applications parent board -o yaml
  ```
hints.2.text: |-
  Change the child source path to manifests/, commit and push; refresh the parent and inspect both revisions. Inspect the child Application manifest in repository/apps/, not only the live child.

  Verify from `~/quest` on the workstation:

  - `git -C repository ls-remote origin refs/heads/main`
  - `git -C repository rev-parse HEAD`

  Both hashes are identical.

  - `kubectl get applications parent board -o json | jq '.items[] | {name:.metadata.name,sync:.status.sync.status,health:.status.health.status,revision:.status.sync.revision,uid:.metadata.uid,path:.spec.source.path,project:.spec.project,destination:.spec.destination.namespace,tracking:.metadata.annotations["argocd.argoproj.io/tracking-id"]}'`

  Both are `Synced` at local HEAD; `board` is `Healthy`. Parent UID/path and child project/path/destination/tracking match Requirements.

  - `kubectl exec deployment/board -c worker -- wget -qO- -T 3 http://board:8080`

  `north-122`.

  - `bash wait-apps.sh` — exit `0`; the supplied release checks pass.
phrases.0: I followed the parent-to-child reconciliation chain.
phrases.1: I repaired desired state in Git rather than the generated child.
phrases.2: I verified both revisions and the actual workload response.
questions.0.points.0: The parent reconciled its own managed objects, including child Applications.
questions.0.points.1: Check each child revision, health and workload separately.
questions.0.prompt: What does a synced parent prove in App-of-Apps?
questions.1.points.0: The parent owns the desired child manifest in Git.
questions.1.points.1: Self-heal can overwrite live drift; repair the source commit.
questions.1.prompt: Why can editing a child Application directly be short-lived?
diagnostics.ancestor: baseline-commit must be an ancestor of HEAD.
diagnostics.changed: HEAD must differ from baseline-commit.
diagnostics.origin: origin/main must equal HEAD.
diagnostics.child_kind: The Git child Application kind must be Application.
diagnostics.child_name: The Git child Application name must be board.
diagnostics.child_source: The Git child Application source path must be manifests.
diagnostics.health: application/board health.status must equal Healthy.
diagnostics.parent_uid: application/parent metadata.uid must equal parent-uid.
diagnostics.parent_path: application/parent source.path must equal apps.
diagnostics.project: application/board project must equal station.
diagnostics.destination: application/board destination.namespace must equal DQ_NAMESPACE.
diagnostics.source: application/board source.path must equal manifests.
diagnostics.tracking: The child tracking-id must match the parent tracking ID.
diagnostics.ready: deployment/board readyReplicas must equal 1.
diagnostics.http: The request to board:8080 must return north-122.
diagnostics.sync_parent: application/parent sync.status must equal Synced.
diagnostics.sync_board: application/board sync.status must equal Synced.
diagnostics.revision_parent: application/parent sync.revision must equal HEAD.
diagnostics.revision_board: application/board sync.revision must equal HEAD.
