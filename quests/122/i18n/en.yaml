title: Argo CD App-of-Apps
brief: 'Work in `~/quest` with `platform.env`, `repository/apps/child.json`, `repository/manifests/board.json`, `parent.json`,
  `baseline-commit`, `parent-uid` and `wait-apps.sh`. In app-of-apps, a parent Argo Application reconciles a child Application,
  which reconciles the workload. Repair the committed child `Application` named `board` to source path `manifests`, commit
  a descendant different from `baseline-commit`, and push it to the private `origin/main`; it must equal local HEAD. Wait
  for both Applications to be `Synced` at HEAD and the child to be `Healthy`.


  Keep the parent UID from `parent-uid` and source path `apps`. The child must use project `station`, the bay namespace and
  source path `manifests`; its tracking annotation must equal `${DQ_NAMESPACE}_parent:argoproj.io/Application:${DQ_NAMESPACE}/board`.
  The board Deployment must have one ready replica and `board:8080` must return `north-122`. `wait-apps.sh` shows the expected
  sync and health checks. Current tracking and status do not prove that objects were never applied directly. Use only the
  offline bay.'
debrief: App-of-Apps reconciles Application resources as Git-managed objects. A parent sync does not replace inspection of
  child sync, health and workload behavior.
stages.0.brief: The Git ancestry and child manifest, parent identity, both Application statuses, child scope and board response
  match the brief.
stages.0.objectives.0.text: The Git ancestry and child manifest, parent identity, both Application statuses, child scope and
  board response match the brief.
hints.0.text: Follow parent source → child source → workload; a healthy parent alone does not prove its child is ready.
hints.1.text: Inspect the child Application manifest in repository/apps/, not only the live child.
hints.2.text: Change the child source path to manifests/, commit and push; refresh the parent and inspect both revisions.
phrases.0: I followed the parent-to-child reconciliation chain.
phrases.1: I repaired desired state in Git rather than the generated child.
phrases.2: I verified both revisions and the actual workload response.
questions.0.points.0: The parent reconciled its own managed objects, including child Applications.
questions.0.points.1: Check each child revision, health and workload separately.
questions.0.prompt: What does a synced parent prove in App-of-Apps?
questions.1.points.0: The parent owns the desired child manifest in Git.
questions.1.points.1: Self-heal can overwrite live drift; repair the source commit.
questions.1.prompt: Why can editing a child Application directly be short-lived?
