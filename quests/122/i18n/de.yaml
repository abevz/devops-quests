diagnostics.ancestor: Der aktuelle HEAD stammt möglicherweise nicht vom gelieferten Baseline-Commit ab oder der Beleg ist nicht lesbar. Prüfen Sie die Commit-Abstammung vor der Veröffentlichung. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q122-parent-forward-git-history)
diagnostics.changed: Eine Arbeitskopie-Änderung kann HEAD auf der Basis belassen. Vergleichen Sie beide Revisionen und prüfen Sie, ob die Korrektur im Commit steht. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q122-parent-repair-commit)
diagnostics.origin: Der lokale Commit stimmt möglicherweise nicht mit dem aktuellen Remote-main überein oder die Remote-Abfrage scheitert. Vergleichen Sie HEAD mit der von origin gemeldeten Spitze. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q122-parent-published-main)
diagnostics.child_kind: Das committete Kindobjekt fehlt möglicherweise, hat ungültiges YAML oder einen anderen Typ. Prüfen Sie apps/child.yaml aus HEAD auf kind Application. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q122-parent-git-child-kind)
diagnostics.child_name: Das Kindobjekt im Commit hat möglicherweise einen anderen Namen oder ist nicht lesbar. Prüfen Sie apps/child.yaml aus HEAD und behalten Sie board bei. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q122-parent-git-child-name)
diagnostics.child_source: Das Kind in Git verweist möglicherweise auf ein altes, absolutes oder übergeordnetes Verzeichnis. Prüfen Sie den committeten relativen Quellpfad nach manifests. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q122-parent-git-child-source)
diagnostics.project: Das aktive Kindobjekt gehört möglicherweise zu einem anderen AppProject oder zeigt eine alte Spezifikation. Prüfen Sie seinen aktuellen project-Wert auf station. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q122-parent-live-child-project)
diagnostics.destination: Das aktive Kindobjekt verweist möglicherweise auf einen anderen Namespace. Vergleichen Sie Ziel- und Übungs-Namespace. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q122-parent-live-child-destination)
diagnostics.source: Der Commit-Pfad kann stimmen, obwohl das aktive Kindobjekt das alte Verzeichnis nutzt. Prüfen Sie nach dem Abgleich von parent den relativen Pfad nach manifests. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q122-parent-live-child-source)
diagnostics.tracking: Einem manuell erstellten Kindobjekt fehlt möglicherweise die Tracking-Annotation von parent. Vergleichen Sie die aktive Tracking-ID mit der parent-Identität im Übungs-Namespace. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q122-parent-live-child-tracking)
diagnostics.sync_parent: Die gemeldete Application ist möglicherweise noch OutOfSync oder kann ihre Quelle nicht anwenden. Prüfen Sie Status und Abgleichsfehler bei parent oder board. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q122-parent-and-child-sync-state)
diagnostics.sync_board: Die gemeldete Application ist möglicherweise noch OutOfSync oder kann ihre Quelle nicht anwenden. Prüfen Sie Status und Abgleichsfehler bei parent oder board. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q122-parent-and-child-sync-state)
diagnostics.revision_parent: Eine Application meldet möglicherweise den Abgleich eines älteren Commits. Vergleichen Sie die Revision von parent oder board mit dem aktuell veröffentlichten HEAD. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q122-parent-and-child-published-revision)
diagnostics.revision_board: Eine Application meldet möglicherweise den Abgleich eines älteren Commits. Vergleichen Sie die Revision von parent oder board mit dem aktuell veröffentlichten HEAD. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q122-parent-and-child-published-revision)
diagnostics.health: Das Kindobjekt kann synchronisiert sein, obwohl seine Arbeitslast noch nicht gesund ist. Prüfen Sie nach dem Abgleich board und die laufenden Pods. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q122-parent-child-application-health)
diagnostics.parent_uid: Das Neuerstellen der Parent-Application unter gleichem Namen ändert ihre UID dauerhaft. Vergleichen Sie die aktive parent-UID mit dem ursprünglichen Beleg. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q122-retained-parent-application-uid)
diagnostics.parent_path: Der aktive Parent verweist möglicherweise direkt auf Workload-Manifeste statt auf das Kindverzeichnis. Prüfen Sie, ob sein genauer Quellpfad apps bleibt. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q122-retained-parent-apps-path)
diagnostics.ready: Dem vom Kind verwalteten Deployment fehlt möglicherweise noch eine bereite Replik. Prüfen Sie Pod-Ereignisse und warten Sie auf eine bereite board-Replik. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q122-parent-child-workload-ready)
diagnostics.http: Die Application kann Healthy sein, obwohl board alte Inhalte liefert oder kurz nicht erreichbar ist. Rufen Sie den aktiven Service auf und vergleichen Sie mit north-122. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q122-parent-child-live-service)
diagnostics.publication: Im Commit oder aktiven Worker fehlt möglicherweise der schreibgeschützte board-publication-Mount. Prüfen Sie den Mount, Child-Tracking und freigegebene Revision der ConfigMap board-publication sowie den aktiven HTTP-Pfad. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q122-parent-child-approved-publication)
diagnostics.probe_0_1: Die Child-Prüfung kann vor der Meldung abbrechen, wenn Werkzeuge, Repository oder Eingaben fehlschlagen. Prüfen Sie lokalen Git-Checkout und API-Zugriff. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q122-parent-child-observer-input)
diagnostics.probe_0_5: Die Veröffentlichungsprüfung kann vor der Meldung abbrechen, wenn Prozess oder Eingaben fehlschlagen. Prüfen Sie Repository, Werkzeuge sowie Zugriff auf board-publication und board. [Ursache und Prüfung](guides#guide=gitops-delivery&section=q122-parent-publication-observer-input)
