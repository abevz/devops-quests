title: Argo CD App-of-Apps
brief: 'Arbeite in `~/quest` mit `platform.env`, `repository/apps/child.json`, `repository/manifests/board.json`, `parent.json`,
  `baseline-commit`, `parent-uid` und `wait-apps.sh`. Bei app-of-apps gleicht eine Parent-Argo-Application eine Child-Application
  ab, die den Workload abgleicht. Repariere die committete Child-`Application` namens `board` auf Quellpfad `manifests`, committe
  einen von `baseline-commit` verschiedenen Nachfahren und pushe ihn nach privatem `origin/main`; dieser muss dem lokalen
  HEAD entsprechen. Warte, bis beide Applications bei HEAD `Synced` und die Child-Application `Healthy` sind.


  Bewahre die Parent-UID aus `parent-uid` und Quellpfad `apps`. Die Child-Application muss Projekt `station`, den Namespace
  der Umgebung und Pfad `manifests` nutzen; ihre Tracking-Annotation muss `${DQ_NAMESPACE}_parent:argoproj.io/Application:${DQ_NAMESPACE}/board`
  entsprechen. Deployment board muss ein bereites Replikat haben und `board:8080` `north-122` liefern. `wait-apps.sh` zeigt
  die erwarteten Sync- und Health-Prüfungen. Aktuelle Verfolgung und Status beweisen nicht, dass Objekte nie direkt angewendet
  wurden. Nutze nur die Offline-Umgebung.'
debrief: App-of-Apps gleicht Application-Ressourcen als von Git verwaltete Objekte ab. Eine übergeordnete Synchronisierung
  ersetzt nicht die Überprüfung der untergeordneten Synchronisierung, des Zustands und des Arbeitslastverhaltens.
stages.0.brief: Git-Abstammung und Child-Manifest, Parent-Identität, Status beider Applications, Child-Bereich und Board-Antwort
  entsprechen der Beschreibung.
stages.0.objectives.0.text: Git-Abstammung und Child-Manifest, Parent-Identität, Status beider Applications, Child-Bereich
  und Board-Antwort entsprechen der Beschreibung.
hints.0.text: Folgen Sie der übergeordneten Quelle → untergeordneten Quelle → Arbeitslast; Ein gesunder Elternteil allein
  beweist nicht, dass sein Kind bereit ist.
hints.1.text: Untersuchen Sie das untergeordnete Application-Manifest in repository/apps/, nicht nur das lebende untergeordnete
  Element.
hints.2.text: Ändern Sie den untergeordneten Quellpfad in manifests/, Commit und push; Aktualisieren Sie die übergeordneten
  und inspect beiden Revisionen.
phrases.0: Ich folgte der Versöhnungskette zwischen Eltern und Kind.
phrases.1: Ich habe den gewünschten Zustand in Git und nicht im generierten untergeordneten Element repariert.
phrases.2: Ich habe beide Revisionen und die tatsächliche Workload-Reaktion überprüft.
questions.0.points.0: Das übergeordnete Objekt hat seine eigenen verwalteten Objekte, einschließlich untergeordneter Anwendungen,
  abgeglichen.
questions.0.points.1: Überprüfen Sie jede untergeordnete Revision, den Zustand und die Arbeitslast separat.
questions.0.prompt: Was beweist ein synchronisiertes übergeordnetes Element in App-of-Apps?
questions.1.points.0: Das übergeordnete Element besitzt das gewünschte untergeordnete Manifest in Git.
questions.1.points.1: Self-heal kann Live-Drift überschreiben; Reparieren Sie das Quell-Commit.
questions.1.prompt: Warum kann die direkte Bearbeitung eines untergeordneten Elements Application nur von kurzer Dauer sein?
diagnostics.ancestor: baseline-commit muss ein Vorfahr von HEAD sein.
diagnostics.changed: HEAD muss sich von baseline-commit unterscheiden.
diagnostics.origin: origin/main muss HEAD entsprechen.
diagnostics.child_kind: Der Kind der Child-Application in Git muss Application sein.
diagnostics.child_name: Der Name der Child-Application in Git muss board sein.
diagnostics.child_source: Der Quellpfad der Child-Application in Git muss manifests sein.
diagnostics.health: application/board health.status muss Healthy entsprechen.
diagnostics.parent_uid: application/parent metadata.uid muss parent-uid entsprechen.
diagnostics.parent_path: application/parent source.path muss apps entsprechen.
diagnostics.project: application/board project muss station entsprechen.
diagnostics.destination: application/board destination.namespace muss DQ_NAMESPACE entsprechen.
diagnostics.source: application/board source.path muss manifests entsprechen.
diagnostics.tracking: Die tracking-id des Child muss der Tracking-ID des Parent entsprechen.
diagnostics.ready: deployment/board readyReplicas muss 1 entsprechen.
diagnostics.http: Die Anfrage an board:8080 muss north-122 liefern.
diagnostics.sync_parent: application/parent sync.status muss Synced entsprechen.
diagnostics.sync_board: application/board sync.status muss Synced entsprechen.
diagnostics.revision_parent: application/parent sync.revision muss HEAD entsprechen.
diagnostics.revision_board: application/board sync.revision muss HEAD entsprechen.
