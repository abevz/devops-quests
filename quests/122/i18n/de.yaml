title: Argo CD App-of-Apps
brief: 'Ein übergeordnetes Argo CD Application liest apps/ aus dem privaten Git-Repository und erstellt
  ein untergeordnetes Application. Das Kind zeigt auf retired/, während das tatsächliche board manifests
  in manifests/. lebt. repository/apps/child.json in Git reparieren, einen Nachkommen von baseline-commit
  festschreiben und Push nur an den mitgelieferten privaten origin. Lassen Sie das Elternteil das Kind
  abgleichen, dann gleicht das Kind das board ab. Wenden Sie das Kind oder die Arbeitsbelastung nicht
  direkt an. Behalten Sie das ursprüngliche übergeordnete Element UID und vergleichen Sie beide Anwendungen
  mit dem veröffentlichten Commit.


  Questdateien in `~/quest` (einige erscheinen in späteren Stadien): `platform.env`, `repository/apps/child.json`,
  `repository/manifests/board.json`, `parent.json`, `baseline-commit`, `parent-uid`, `wait-apps.sh`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Anfängliche Erfolgskriterien: Das ursprüngliche übergeordnete Element verwaltet das untergeordnete Element
  aus dem reparierten Git-Commit; Beide synchronisieren sich mit diesem Commit und der fehlerfreie board
  antwortet mit north-122.'
debrief: App-of-Apps gleicht Application-Ressourcen als von Git verwaltete Objekte ab. Eine übergeordnete
  Synchronisierung ersetzt nicht die Überprüfung der untergeordneten Synchronisierung, des Zustands und
  des Arbeitslastverhaltens.
stages.0.brief: 'Erfolgskriterien: Das ursprüngliche übergeordnete Element verwaltet das untergeordnete
  Element aus dem reparierten Git-Commit. Beide synchronisieren sich mit diesem Commit und der fehlerfreie
  board antwortet mit north-122.'
stages.0.objectives.0.text: Das ursprüngliche übergeordnete Element verwaltet das untergeordnete Element
  über den reparierten Git-Commit. Beide synchronisieren sich mit diesem Commit und der fehlerfreie board
  antwortet mit north-122.
hints.0.text: Folgen Sie der übergeordneten Quelle → untergeordneten Quelle → Arbeitslast; Ein gesunder
  Elternteil allein beweist nicht, dass sein Kind bereit ist.
hints.1.text: Untersuchen Sie das untergeordnete Application-Manifest in repository/apps/, nicht nur das
  lebende untergeordnete Element.
hints.2.text: Ändern Sie den untergeordneten Quellpfad in manifests/, Commit und push; Aktualisieren Sie
  die übergeordneten und inspect beiden Revisionen.
phrases.0: Ich folgte der Versöhnungskette zwischen Eltern und Kind.
phrases.1: Ich habe den gewünschten Zustand in Git und nicht im generierten untergeordneten Element repariert.
phrases.2: Ich habe beide Revisionen und die tatsächliche Workload-Reaktion überprüft.
questions.0.points.0: Das übergeordnete Objekt hat seine eigenen verwalteten Objekte, einschließlich untergeordneter
  Anwendungen, abgeglichen.
questions.0.points.1: Überprüfen Sie jede untergeordnete Revision, den Zustand und die Arbeitslast separat.
questions.0.prompt: Was beweist ein synchronisiertes übergeordnetes Element in App-of-Apps?
questions.1.points.0: Das übergeordnete Element besitzt das gewünschte untergeordnete Manifest in Git.
questions.1.points.1: Self-heal kann Live-Drift überschreiben; Reparieren Sie das Quell-Commit.
questions.1.prompt: Warum kann die direkte Bearbeitung eines untergeordneten Elements Application nur
  von kurzer Dauer sein?
