id: 39
title: title
track: OpenTofu
difficulty: medium
brief: brief
stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    check: |-
      python3 -I - <<'DQ_PROPERTY'
      import re
      import subprocess
      import sys
      for value in ('0', '7', '2.5'):
          result = subprocess.run(['tofu', 'plan', '-input=false', '-no-color', '-var=departures=' + value], capture_output=True, text=True)
          text = result.stdout + result.stderr
          with open('invalid-plan.txt', 'w') as report:
              report.write(text)
          text = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', text)
          # OpenTofu can wrap diagnostic text and prefix continuation lines with a bar.
          text = ' '.join(text.replace('│', ' ').split())
          if result.returncode == 0 or not re.search(r'\bdepartures must be an integer from 1 to 6\b', text):
              sys.exit(1)
      DQ_PROPERTY
  - text: stages.0.objectives.1.text
    check: test "$(cat timetable.txt)" = 3
  - text: stages.0.objectives.2.text
    check: tofu output -json departures | jq -e '.==3' >/dev/null
  - text: stages.0.objectives.3.text
    check: tofu plan -input=false -detailed-exitcode -no-color >/dev/null
hints:
- text: hints.0.text
  guide: terraform-2
- text: hints.1.text
  guide: terraform-2
- text: hints.2.text
  guide: terraform-2
debrief: debrief
phrases:
- phrases.0
- phrases.1
- phrases.2
questions: []
facts:
  environment:
  - DQ_NAMESPACE
  - DQ_APP_IMAGE
  - KUBECONFIG
  - TF_CLI_CONFIG_FILE
  - DOCKER_HOST
  - DOCKER_TLS_VERIFY
  - DOCKER_CERT_PATH
  files:
  - main.tf
  - terraform.tfvars
  services: []
