id: 39
title: title
track: OpenTofu
difficulty: medium
brief: brief
stages:
- brief: stages.0.brief
  objectives:
  - text: stages.0.objectives.0.text
    check: |-
      dq_probe_output=$(mktemp)
      trap 'rm -f "$dq_probe_output"' EXIT
      set +e
      (
      set -euo pipefail
      python3 -I - <<'DQ_PROPERTY'
      import re
      import subprocess
      import sys
      for value in ('0', '7', '2.5'):
          result = subprocess.run(['tofu', 'plan', '-input=false', '-no-color', '-var=departures=' + value], capture_output=True, text=True)
          text = result.stdout + result.stderr
          with open('invalid-plan.txt', 'w') as report:
              report.write(text)
          text = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', text)
          # OpenTofu can wrap diagnostic text and prefix continuation lines with a bar.
          text = ' '.join(text.replace('│', ' ').split())
          if result.returncode == 0 or not re.search(r'\bdepartures must be an integer from 1 to 6\b', text):
              sys.exit(1)
      DQ_PROPERTY
      ) >"$dq_probe_output" 2>/dev/null
      dq_probe_status=$?
      set -e
      cat "$dq_probe_output"
      if [ "$dq_probe_status" -ne 0 ] && ! grep -Eq '\[DQ:[a-z0-9_]+\]' "$dq_probe_output"; then
      printf '%s\n' 'Current inputs could not verify this objective: ✗ [DQ:probe_0_0]'
      fi
      rm -f "$dq_probe_output"
      trap - EXIT
      test "$dq_probe_status" -eq 0
  - text: stages.0.objectives.1.text
    check: |-
      set +e
      (
      set -e
      test "$(cat timetable.txt)" = 3
      )
      code=$?
      set -e
      if [ "$code" -ne 0 ]; then
        printf '%s\n' 'The timetable content could not be verified: ✗ [DQ:timetable_content]' >&2
        exit "$code"
      fi
  - text: stages.0.objectives.2.text
    check: |-
      set +e
      (
      set -e
      tofu output -json departures | jq -e '.==3' >/dev/null
      )
      code=$?
      set -e
      if [ "$code" -ne 0 ]; then
        printf '%s\n' 'The applied departures output could not be verified: ✗ [DQ:departures_output]' >&2
        exit "$code"
      fi
  - text: stages.0.objectives.3.text
    check: |-
      set +e
      (
      set -e
      tofu plan -input=false -detailed-exitcode -no-color >/dev/null
      )
      code=$?
      set -e
      if [ "$code" -ne 0 ]; then
        printf '%s\n' 'The normal-input plan did not finish without changes: ✗ [DQ:validation_plan]' >&2
        exit "$code"
      fi
hints:
- text: hints.0.text
  guide: terraform-2
  section: number-type-and-validation
- text: hints.1.text
- text: hints.2.text
  guide: terraform-2
  section: departures-negative-plans
debrief: debrief
phrases:
- phrases.0
- phrases.1
- phrases.2
questions: []
facts:
  environment:
  - DQ_NAMESPACE
  - DQ_APP_IMAGE
  - KUBECONFIG
  - TF_CLI_CONFIG_FILE
  - DOCKER_HOST
  - DOCKER_TLS_VERIFY
  - DOCKER_CERT_PATH
  files:
  - main.tf
  - terraform.tfvars
  services: []
