title: Validación
brief: |
  El horario debe aceptar solo cantidades válidas de salidas. Conserva la cantidad suministrada y rechaza claramente las solicitudes inválidas.

  Trabaja en `~/quest` en la workstation. Archivos de entrada suministrados: `main.tf`, `terraform.tfvars`.

  **Requisitos:**
  - Los planes rechazan estos valores de `departures` con el mensaje exacto `departures must be an integer from 1 to 6`:
    - `0`, `7`, `2.5`
  - Archivos en `~/quest` en la workstation:
    - `timetable.txt`: `3`
  - La salida `departures` devuelve el número `3`.
  - `tofu plan` termina con código `0` sin cambios.

  **Verifica antes de Check & finish:**
  Ejecuta estos comandos de observación desde `~/quest` en la workstation.
  - Cada comando debe fallar con `departures must be an integer from 1 to 6`.

    ```sh
    tofu plan -input=false -no-color -var=departures=0
    tofu plan -input=false -no-color -var=departures=7
    tofu plan -input=false -no-color -var=departures=2.5
    ```
  - Se espera que el horario contenga `3` y que la salida sea el número `3`.

    ```sh
    cat timetable.txt
    tofu output -json departures
    ```
  - `tofu plan -input=false -detailed-exitcode -no-color` — Se esperan ausencia de cambios y código de salida `0`.
debrief: Type y validation protegen diferentes partes del contrato de entrada. Los planes negativos ejercieron
  la guardia sin aplicar insumos inseguros.
stages.0.brief: |
  Conserva el horario válido y rechaza las cantidades inválidas de salidas con el mensaje requerido.
stages.0.objectives.0.text: Los planes con valores `0`, `7` o `2.5` para `departures` se rechazan e incluyen
  el mensaje `departures must be an integer from 1 to 6`.
stages.0.objectives.1.text: '`timetable.txt` contiene `3`.'
stages.0.objectives.2.text: El output `departures` devuelve el número `3`.
stages.0.objectives.3.text: '`tofu plan` termina con código 0 sin cambios.'
hints.0.text: Un tipo numérico por sí solo acepta fracciones.
hints.1.text: Combine límites de rango con un predicado entero.
hints.2.text: Un plan negativo debe fallar para validation, no para la sintaxis.
phrases.0: Validé el rango de entrada admitido en el límite del módulo.
phrases.1: Probé los valores rechazados antes de aceptar la configuración normal.
phrases.2: Verifiqué el horario renderizado y un plan normal vacío.
