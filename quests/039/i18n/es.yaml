title: Validación
brief: 'Agregue un contrato validation variable: departures debe ser un número entero del 1 al 6 inclusive.
  Conserva los 3 suministrados y aplícalos. Probar que plan rechaza 0, 7 y 2.5 con el diagnóstico exacto
  departures debe ser un número entero de 1 a 6.


  Archivos de búsqueda en `~/quest` (algunos aparecen en etapas posteriores): `main.tf`, `terraform.tfvars`.


  La bahía no tiene Internet ni DNS externo. Utilice únicamente archivos proporcionados, imágenes precargadas
  y servicios privados. Cambie sólo esta bahía.


  Criterios de éxito iniciales: Timetable contiene 3, los valores no seguros fallan en validation y el
  plan normal está vacío.'
debrief: Type y validation protegen diferentes partes del contrato de entrada. Los planes negativos ejercieron
  la guardia sin aplicar insumos inseguros.
stages.0.brief: 'Criterios de éxito: Timetable contiene 3, los valores no seguros fallan en validation
  y el plan normal está vacío.'
stages.0.objectives.0.text: Timetable contiene 3, los valores no seguros fallan en validation y el plan
  normal está vacío.
hints.0.text: Un tipo numérico por sí solo acepta fracciones.
hints.1.text: Combine límites de rango con un predicado entero.
hints.2.text: Un plan negativo debe fallar para validation, no para la sintaxis.
phrases.0: Validé el rango de entrada admitido en el límite del módulo.
phrases.1: Probé los valores rechazados antes de aceptar la configuración normal.
phrases.2: Verifiqué el horario renderizado y un plan normal vacío.
