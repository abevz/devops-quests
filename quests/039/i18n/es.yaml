title: Validación
brief: "El horario debe aceptar solo cantidades válidas de salidas. Conserva la cantidad suministrada y rechaza\
  \ claramente las solicitudes inválidas.\n\nTrabaja en `~/quest` en la workstation. Archivos de entrada suministrados:\
  \ `main.tf`, `terraform.tfvars`.\n\n**Requisitos:**\n- Los planes rechazan estos valores de `departures`\
  \ con el mensaje exacto `departures must be an integer from 1 to 6`:\n  - `0`, `7`, `2.5`\n- Archivos en\
  \ `~/quest` en la workstation:\n  - `timetable.txt`: `3`\n- La salida `departures` devuelve el número `3`.\n\
  - Un plan detallado no muestra cambios de infraestructura pendientes y termina con código `0`.\n"
debrief: Type y validation protegen diferentes partes del contrato de entrada. Los planes negativos ejercieron
  la guardia sin aplicar insumos inseguros.
stages.0.brief: Conserva el horario válido y rechaza las cantidades inválidas de salidas con el mensaje requerido.
stages.0.objectives.0.text: Los planes con valores `0`, `7` o `2.5` para `departures` se rechazan e incluyen
  el mensaje `departures must be an integer from 1 to 6`.
stages.0.objectives.1.text: '`timetable.txt` contiene `3`.'
stages.0.objectives.2.text: El output `departures` devuelve el número `3`.
stages.0.objectives.3.text: OpenTofu no informa cambios de infraestructura pendientes.
hints.0.text: Un tipo numérico por sí solo acepta fracciones.
hints.1.text: 'Inspecciona las entradas suministradas y el estado gestionado actual:


  ```sh

  cat main.tf terraform.tfvars

  ```'
hints.2.text: "Combine límites de rango con un predicado entero.\n\nUn plan negativo debe fallar para validation,\
  \ no para la sintaxis.\n\nVerifica el resultado observado:\n\n- Cada comando debe fallar con `departures\
  \ must be an integer from 1 to 6`.\n\n  ```sh\n  tofu plan -input=false -no-color -var=departures=0\n  tofu\
  \ plan -input=false -no-color -var=departures=7\n  tofu plan -input=false -no-color -var=departures=2.5\n\
  \  ```\n\n- Se espera que el horario contenga `3` y que la salida sea el número `3`.\n\n  ```sh\n  cat timetable.txt\n\
  \  tofu output -json departures\n  ```\n\n- `tofu plan -input=false -detailed-exitcode -no-color` — Se esperan\
  \ ausencia de cambios y código de salida `0`."
phrases.0: Validé el rango de entrada admitido en el límite del módulo.
phrases.1: Probé los valores rechazados antes de aceptar la configuración normal.
phrases.2: Verifiqué el horario renderizado y un plan normal vacío.
