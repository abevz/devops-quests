title: Validation
brief: |
  The timetable must accept only valid departure counts. Keep the supplied count while making invalid requests fail clearly.

  Work in `~/quest` on the workstation. Supplied inputs: `main.tf`, `terraform.tfvars`.

  **Requirements:**
  - Plans reject these `departures` values with the exact message `departures must be an integer from 1 to 6`:
    - `0`, `7`, `2.5`
  - Files in `~/quest` on the workstation:
    - `timetable.txt`: `3`
  - Output `departures` returns the number `3`.
  - `tofu plan` exits with code `0` and reports no changes.

  **Verify yourself before Check & finish:**
  Run these observation commands from `~/quest` on the workstation.
  - Each command must fail with `departures must be an integer from 1 to 6`.

    ```sh
    tofu plan -input=false -no-color -var=departures=0
    tofu plan -input=false -no-color -var=departures=7
    tofu plan -input=false -no-color -var=departures=2.5
    ```
  - Expected: the timetable contains `3` and the output is the number `3`.

    ```sh
    cat timetable.txt
    tofu output -json departures
    ```
  - `tofu plan -input=false -detailed-exitcode -no-color` — Expected: no changes, exit code `0`.
debrief: Type and validation guard different parts of the input contract. Negative
  plans exercised the guard without applying unsafe inputs.
stages.0.brief: |
  Keep the valid timetable and reject invalid departure counts with the required message.
stages.0.objectives.0.text: Plans with `departures` values `0`, `7` or `2.5` are rejected and include
  the message `departures must be an integer from 1 to 6`.
stages.0.objectives.1.text: '`timetable.txt` contains `3`.'
stages.0.objectives.2.text: Output `departures` returns the number `3`.
stages.0.objectives.3.text: '`tofu plan` exits 0 with no changes.'
hints.0.text: A numeric type alone accepts fractions.
hints.1.text: Combine range bounds with an integer predicate.
hints.2.text: A negative plan must fail for validation, not syntax.
phrases.0: I validated the supported input range at the module boundary.
phrases.1: I tested rejected values before accepting the normal configuration.
phrases.2: I verified the rendered timetable and an empty normal plan.
