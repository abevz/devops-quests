title: Validation
brief: "The timetable must accept only valid departure counts. Keep the supplied count while making invalid\
  \ requests fail clearly.\n\nWork in `~/quest` on the workstation. Supplied inputs: `main.tf`, `terraform.tfvars`.\n\
  \n**Requirements:**\n- Plans reject these `departures` values with the exact message `departures must be\
  \ an integer from 1 to 6`:\n  - `0`, `7`, `2.5`\n- Files in `~/quest` on the workstation:\n  - `timetable.txt`:\
  \ `3`\n- Output `departures` returns the number `3`.\n- A detailed plan reports no pending infrastructure\
  \ changes and exits with code `0`.\n"
debrief: Type and validation guard different parts of the input contract. Negative plans exercised the guard
  without applying unsafe inputs.
stages.0.brief: Keep the valid timetable and reject invalid departure counts with the required message.
stages.0.objectives.0.text: Plans with `departures` values `0`, `7` or `2.5` are rejected and include the message
  `departures must be an integer from 1 to 6`.
stages.0.objectives.1.text: '`timetable.txt` contains `3`.'
stages.0.objectives.2.text: Output `departures` returns the number `3`.
stages.0.objectives.3.text: OpenTofu reports no pending infrastructure changes.
hints.0.text: A numeric type alone accepts fractions.
hints.1.text: 'Inspect the supplied inputs and current managed state:


  ```sh

  cat main.tf terraform.tfvars

  ```'
hints.2.text: "Combine range bounds with an integer predicate.\n\nA negative plan must fail for validation,\
  \ not syntax.\n\nVerify the observed result:\n\n- Each command must fail with `departures must be an integer\
  \ from 1 to 6`.\n\n  ```sh\n  tofu plan -input=false -no-color -var=departures=0\n  tofu plan -input=false\
  \ -no-color -var=departures=7\n  tofu plan -input=false -no-color -var=departures=2.5\n  ```\n\n- Expected:\
  \ the timetable contains `3` and the output is the number `3`.\n\n  ```sh\n  cat timetable.txt\n  tofu output\
  \ -json departures\n  ```\n\n- `tofu plan -input=false -detailed-exitcode -no-color` — Expected: no changes,\
  \ exit code `0`."
phrases.0: I validated the supported input range at the module boundary.
phrases.1: I tested rejected values before accepting the normal configuration.
phrases.2: I verified the rendered timetable and an empty normal plan.
diagnostics.probe_0_0: 'The current inputs could not verify this objective: Plans with `departures` values `0`,
  `7` or `2.5` are rejected and include the message `departures must be an integer from 1 to 6`.'
