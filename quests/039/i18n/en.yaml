title: Validation
brief: 'Add a variable validation contract: departures must be a whole number from 1 through 6 inclusive.
  Preserve the supplied 3 and apply it. Prove plan rejects 0, 7 and 2.5 with the exact diagnostic departures
  must be an integer from 1 to 6.


  Quest files in `~/quest` (some appear in later stages): `main.tf`, `terraform.tfvars`.


  The bay has no Internet or external DNS. Use only supplied files, preloaded images and private services.
  Change only this bay.


  Initial success criteria: Timetable contains 3, unsafe values fail validation and the normal plan is
  empty.'
debrief: Type and validation guard different parts of the input contract. Negative plans exercised the
  guard without applying unsafe inputs.
stages.0.brief: 'Timetable contains 3, unsafe values fail validation and the normal plan is empty.


  Success criteria: Timetable contains 3, unsafe values fail validation and the normal plan is empty.'
stages.0.objectives.0.text: Timetable contains 3, unsafe values fail validation and the normal plan is
  empty.
hints.0.text: A numeric type alone accepts fractions.
hints.1.text: Combine range bounds with an integer predicate.
hints.2.text: A negative plan must fail for validation, not syntax.
phrases.0: I validated the supported input range at the module boundary.
phrases.1: I tested rejected values before accepting the normal configuration.
phrases.2: I verified the rendered timetable and an empty normal plan.
