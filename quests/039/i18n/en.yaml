title: Validation
brief: "The timetable must accept only valid departure counts. Keep the supplied count while making invalid\
  \ requests fail clearly.\n\nWork in `~/quest` on the workstation. Supplied inputs: `main.tf`, `terraform.tfvars`.\n\
  \n**Requirements:**\n- Plans reject these `departures` values with the exact message `departures must be\
  \ an integer from 1 to 6`:\n  - `0`, `7`, `2.5`\n- Files in `~/quest` on the workstation:\n  - `timetable.txt`:\
  \ `3`\n- Output `departures` returns the number `3`.\n- A detailed plan reports no pending infrastructure\
  \ changes and exits with code `0`.\n"
debrief: Type and validation guard different parts of the input contract. Negative plans exercised the guard
  without applying unsafe inputs.
stages.0.brief: Keep the valid timetable and reject invalid departure counts with the required message.
stages.0.objectives.0.text: Plans with `departures` values `0`, `7` or `2.5` are rejected and include the message
  `departures must be an integer from 1 to 6`.
stages.0.objectives.1.text: '`timetable.txt` contains `3`.'
stages.0.objectives.2.text: Output `departures` returns the number `3`.
stages.0.objectives.3.text: OpenTofu reports no pending infrastructure changes.
hints.0.text: A numeric type alone accepts fractions.
hints.1.text: |-
  Inspect the supplied inputs and current managed state:

  Combine range bounds with an integer predicate.

  ```sh
  cat main.tf
  cat terraform.tfvars
  tofu plan -input=false -no-color
  ```
hints.2.text: |-
  A negative plan must fail for validation, not syntax.

  Verify the observed result:

  - Each command must fail with `departures must be an integer from 1 to 6`.

    ```sh
    tofu plan -input=false -no-color -var=departures=0
    tofu plan -input=false -no-color -var=departures=7
    tofu plan -input=false -no-color -var=departures=2.5
    ```

  Preview both allowed limits before applying the normal input. Each plan must exit with code 0. Leave these two plans unapplied.

  ```sh
  tofu plan -input=false -no-color -var=departures=1
  tofu plan -input=false -no-color -var=departures=6
  ```

  - Expected: the timetable contains `3` and the output is the number `3`.

    ```sh
    cat timetable.txt
    tofu output -json departures
    ```

  - `tofu plan -input=false -detailed-exitcode -no-color` — Expected: no changes, exit code `0`.
phrases.0: I validated the supported input range at the module boundary.
phrases.1: I tested rejected values before accepting the normal configuration.
phrases.2: I verified the rendered timetable and an empty normal plan.
diagnostics.probe_0_0: Range-only validation may accept fractions, or a rejected plan may fail for the wrong reason; Python/tofu startup or report-write errors can also stop the trials. [Cause and check](guides#guide=terraform-2&section=departures-negative-plans)
diagnostics.timetable_content: The normal input may have changed or not yet been applied to timetable.txt; a missing or unreadable file also fails. [Cause and check](guides#guide=terraform-2&section=departures-applied-result)
diagnostics.departures_output: An unapplied or changed output may not expose the number 3; an output-read or JSON-processing error can also prevent verification. [Cause and check](guides#guide=terraform-2&section=departures-applied-result)
diagnostics.validation_plan: Normal-input changes may remain unapplied, or a configuration, provider or state error may stop planning. [Cause and check](guides#guide=terraform-2&section=departures-clean-plan)
