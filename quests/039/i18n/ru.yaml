title: Валидация
brief: 'Добавьте validation: departures — целое число от 1 до 6 включительно. Сохраните выданное 3 и примените.
  Докажите отказ plan для 0, 7 и 2.5 с текстом departures must be an integer from 1 to 6.


  Файлы квеста в `~/quest` (часть появляется на следующих этапах): `main.tf`, `terraform.tfvars`.


  В песочнице нет интернета и внешнего DNS. Используйте выданные файлы, предварительно загруженные образы
  и приватные сервисы. Менять можно только эту песочницу.


  Цели первого этапа: Timetable содержит 3, опасные значения отклонены validation, обычный plan пуст.'
debrief: Тип и validation защищают разные части входного контракта. Отрицательные plan доказали защиту
  без применения опасных значений.
stages.0.brief: 'Timetable содержит 3, опасные значения отклонены validation, обычный plan пуст.


  Результат проверки: Timetable содержит 3, опасные значения отклонены validation, обычный plan пуст.'
stages.0.objectives.0.text: Timetable содержит 3, опасные значения отклонены validation, обычный plan
  пуст.
hints.0.text: Тип number сам по себе допускает дроби.
hints.1.text: Объедините диапазон с проверкой целого.
hints.2.text: Отрицательный plan должен падать из-за validation, а не синтаксиса.
phrases.0: Я проверил допустимый диапазон входа на границе модуля.
phrases.1: Я проверил отклонение недопустимых значений до принятия обычной конфигурации.
phrases.2: Я проверил сформированное расписание и пустой plan обычной конфигурации.
