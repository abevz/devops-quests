title: Валидация
brief: |
  Расписание должно принимать только допустимое число отправлений. Сохраните исходное число, обеспечив явный отказ для неверных запросов.

  Работайте в `~/quest` на workstation. Предоставленные входные файлы: `main.tf`, `terraform.tfvars`.

  **Требования:**
  - Планы отклоняют следующие значения `departures` с точным сообщением `departures must be an integer from 1 to 6`:
    - `0`, `7`, `2.5`
  - Файлы в `~/quest` на workstation:
    - `timetable.txt`: `3`
  - Выходное значение `departures` возвращает число `3`.
  - `tofu plan` завершается с кодом `0` без изменений.

  **Проверьте самостоятельно перед Check & finish:**
  Выполняйте эти команды наблюдения из `~/quest` на workstation.
  - Каждая команда должна завершиться ошибкой с сообщением `departures must be an integer from 1 to 6`.

    ```sh
    tofu plan -input=false -no-color -var=departures=0
    tofu plan -input=false -no-color -var=departures=7
    tofu plan -input=false -no-color -var=departures=2.5
    ```
  - Ожидается содержимое расписания `3` и выходное значение — число `3`.

    ```sh
    cat timetable.txt
    tofu output -json departures
    ```
  - `tofu plan -input=false -detailed-exitcode -no-color` — Ожидаются отсутствие изменений и код завершения `0`.
debrief: Тип и validation защищают разные части входного контракта. Отрицательные
  plan доказали защиту без применения опасных значений.
stages.0.brief: |
  Сохраните корректное расписание и отклоняйте неверное число отправлений с требуемым сообщением.
stages.0.objectives.0.text: Plan для значений `departures` `0`, `7` или `2.5` отклоняется с сообщением
  `departures must be an integer from 1 to 6`.
stages.0.objectives.1.text: '`timetable.txt` содержит `3`.'
stages.0.objectives.2.text: Output `departures` возвращает число `3`.
stages.0.objectives.3.text: '`tofu plan` завершается с кодом 0 без изменений.'
hints.0.text: Тип number сам по себе допускает дроби.
hints.1.text: Объедините диапазон с проверкой целого.
hints.2.text: Отрицательный plan должен падать из-за validation, а не синтаксиса.
phrases.0: Я проверил допустимый диапазон входа на границе модуля.
phrases.1: Я проверил отклонение недопустимых значений до принятия обычной конфигурации.
phrases.2: Я проверил сформированное расписание и пустой plan обычной конфигурации.
