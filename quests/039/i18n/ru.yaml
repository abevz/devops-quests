title: Валидация
brief: "Расписание должно принимать только допустимое число отправлений. Сохраните исходное число, обеспечив\
  \ явный отказ для неверных запросов.\n\nРаботайте в `~/quest` на workstation. Предоставленные входные файлы:\
  \ `main.tf`, `terraform.tfvars`.\n\n**Требования:**\n- Планы отклоняют следующие значения `departures` с\
  \ точным сообщением `departures must be an integer from 1 to 6`:\n  - `0`, `7`, `2.5`\n- Файлы в `~/quest`\
  \ на workstation:\n  - `timetable.txt`: `3`\n- Выходное значение `departures` возвращает число `3`.\n- Подробный\
  \ план не содержит ожидающих изменений инфраструктуры и завершается с кодом `0`.\n"
debrief: Тип и validation защищают разные части входного контракта. Отрицательные plan доказали защиту без
  применения опасных значений.
stages.0.brief: Сохраните корректное расписание и отклоняйте неверное число отправлений с требуемым сообщением.
stages.0.objectives.0.text: Plan для значений `departures` `0`, `7` или `2.5` отклоняется с сообщением `departures
  must be an integer from 1 to 6`.
stages.0.objectives.1.text: '`timetable.txt` содержит `3`.'
stages.0.objectives.2.text: Output `departures` возвращает число `3`.
stages.0.objectives.3.text: OpenTofu не сообщает об ожидающих изменениях инфраструктуры.
hints.0.text: Тип number сам по себе допускает дроби.
hints.1.text: 'Изучите поставленные входные данные и текущее управляемое состояние:


  ```sh

  cat main.tf terraform.tfvars

  ```'
hints.2.text: "Объедините диапазон с проверкой целого.\n\nОтрицательный plan должен падать из-за validation,\
  \ а не синтаксиса.\n\nПроверьте наблюдаемый результат:\n\n- Каждая команда должна завершиться ошибкой с сообщением\
  \ `departures must be an integer from 1 to 6`.\n\n  ```sh\n  tofu plan -input=false -no-color -var=departures=0\n\
  \  tofu plan -input=false -no-color -var=departures=7\n  tofu plan -input=false -no-color -var=departures=2.5\n\
  \  ```\n\n- Ожидается содержимое расписания `3` и выходное значение — число `3`.\n\n  ```sh\n  cat timetable.txt\n\
  \  tofu output -json departures\n  ```\n\n- `tofu plan -input=false -detailed-exitcode -no-color` — Ожидаются\
  \ отсутствие изменений и код завершения `0`."
phrases.0: Я проверил допустимый диапазон входа на границе модуля.
phrases.1: Я проверил отклонение недопустимых значений до принятия обычной конфигурации.
phrases.2: Я проверил сформированное расписание и пустой plan обычной конфигурации.
