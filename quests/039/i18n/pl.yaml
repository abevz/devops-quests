title: Walidacja
brief: 'Dodaj zmienną umowę validation: odjazdy muszą być liczbą całkowitą od 1 do 6 włącznie. Zachowaj
  dostarczony 3 i zastosuj go. Udowodnij, że plan odrzuca 0, 7 i 2,5 za pomocą dokładnej diagnostyki departures
  must be an integer from od 1 do 6.


  Pliki zadań w `~/quest` (niektóre pojawiają się w późniejszych etapach): `main.tf`, `terraform.tfvars`.


  W zatoce nie ma Internetu ani zewnętrznego DNS. Korzystaj wyłącznie z dostarczonych plików, wstępnie
  załadowanych obrazów i usług prywatnych. Zmień tylko tę zatokę.


  Początkowe kryteria sukcesu: Timetable zawiera 3, niebezpieczne wartości kończą się niepowodzeniem validation,
  a normalny plan jest pusty.'
debrief: Typ i validation chronią różne części kontraktu wejściowego. Negatywne plany zachowały czujność
  bez stosowania niebezpiecznych środków.
stages.0.brief: 'Kryteria sukcesu: Timetable zawiera 3, niebezpieczne wartości kończą się niepowodzeniem
  validation, a normalny plan jest pusty.'
stages.0.objectives.0.text: Timetable zawiera 3, niebezpieczne wartości kończą się niepowodzeniem validation,
  a normalny plan jest pusty.
hints.0.text: Sam typ liczbowy akceptuje ułamki.
hints.1.text: Połącz granice zakresu z predykatem będącym liczbą całkowitą.
hints.2.text: Ujemny plan musi zakończyć się niepowodzeniem dla validation, a nie składni.
phrases.0: Sprawdziłem obsługiwany zakres wejściowy na granicy modułu.
phrases.1: Przed zaakceptowaniem normalnej konfiguracji przetestowałem odrzucone wartości.
phrases.2: Sprawdziłem wyrenderowany harmonogram i pusty normalny plan.
