title: Walidacja
brief: |
  Rozkład ma akceptować wyłącznie poprawne liczby odjazdów. Zachowaj dostarczoną liczbę i jednoznacznie odrzucaj nieprawidłowe żądania.

  Pracuj w `~/quest` na workstation. Dostarczone pliki wejściowe: `main.tf`, `terraform.tfvars`.

  **Wymagania:**
  - Plany odrzucają następujące wartości `departures` z dokładnym komunikatem `departures must be an integer from 1 to 6`:
    - `0`, `7`, `2.5`
  - Pliki w `~/quest` na workstation:
    - `timetable.txt`: `3`
  - Wynik `departures` zwraca liczbę `3`.
  - `tofu plan` kończy się kodem `0` i nie wykazuje zmian.

  **Sprawdź samodzielnie przed Check & finish:**
  Wykonaj te polecenia obserwacyjne w `~/quest` na workstation.
  - Każde polecenie ma zakończyć się błędem z komunikatem `departures must be an integer from 1 to 6`.

    ```sh
    tofu plan -input=false -no-color -var=departures=0
    tofu plan -input=false -no-color -var=departures=7
    tofu plan -input=false -no-color -var=departures=2.5
    ```
  - Oczekiwane: rozkład zawiera `3`, a wynik jest liczbą `3`.

    ```sh
    cat timetable.txt
    tofu output -json departures
    ```
  - `tofu plan -input=false -detailed-exitcode -no-color` — Oczekiwane: brak zmian i kod zakończenia `0`.
debrief: Typ i validation chronią różne części kontraktu wejściowego. Negatywne plany zachowały czujność
  bez stosowania niebezpiecznych środków.
stages.0.brief: |
  Zachowaj poprawny rozkład i odrzucaj nieprawidłowe liczby odjazdów z wymaganym komunikatem.
stages.0.objectives.0.text: Plany dla wartości `departures` `0`, `7` lub `2.5` są odrzucane i zawierają
  komunikat `departures must be an integer from 1 to 6`.
stages.0.objectives.1.text: '`timetable.txt` zawiera `3`.'
stages.0.objectives.2.text: Output `departures` zwraca liczbę `3`.
stages.0.objectives.3.text: '`tofu plan` kończy się kodem 0 bez zmian.'
hints.0.text: Sam typ liczbowy akceptuje ułamki.
hints.1.text: Połącz granice zakresu z predykatem będącym liczbą całkowitą.
hints.2.text: Ujemny plan musi zakończyć się niepowodzeniem dla validation, a nie składni.
phrases.0: Sprawdziłem obsługiwany zakres wejściowy na granicy modułu.
phrases.1: Przed zaakceptowaniem normalnej konfiguracji przetestowałem odrzucone wartości.
phrases.2: Sprawdziłem wyrenderowany harmonogram i pusty normalny plan.
