title: Walidacja
brief: "Rozkład ma akceptować wyłącznie poprawne liczby odjazdów. Zachowaj dostarczoną liczbę i jednoznacznie\
  \ odrzucaj nieprawidłowe żądania.\n\nPracuj w `~/quest` na workstation. Dostarczone pliki wejściowe: `main.tf`,\
  \ `terraform.tfvars`.\n\n**Wymagania:**\n- Plany odrzucają następujące wartości `departures` z dokładnym\
  \ komunikatem `departures must be an integer from 1 to 6`:\n  - `0`, `7`, `2.5`\n- Pliki w `~/quest` na workstation:\n\
  \  - `timetable.txt`: `3`\n- Wynik `departures` zwraca liczbę `3`.\n- Szczegółowy plan nie zawiera oczekujących\
  \ zmian infrastruktury i kończy się kodem `0`.\n"
debrief: Typ i validation chronią różne części kontraktu wejściowego. Negatywne plany zachowały czujność bez
  stosowania niebezpiecznych środków.
stages.0.brief: Zachowaj poprawny rozkład i odrzucaj nieprawidłowe liczby odjazdów z wymaganym komunikatem.
stages.0.objectives.0.text: Plany dla wartości `departures` `0`, `7` lub `2.5` są odrzucane i zawierają komunikat
  `departures must be an integer from 1 to 6`.
stages.0.objectives.1.text: '`timetable.txt` zawiera `3`.'
stages.0.objectives.2.text: Output `departures` zwraca liczbę `3`.
stages.0.objectives.3.text: OpenTofu nie zgłasza oczekujących zmian infrastruktury.
hints.0.text: Sam typ liczbowy akceptuje ułamki.
hints.1.text: 'Sprawdź dostarczone dane wejściowe i bieżący zarządzany stan:


  ```sh

  cat main.tf terraform.tfvars

  ```'
hints.2.text: "Połącz granice zakresu z predykatem będącym liczbą całkowitą.\n\nUjemny plan musi zakończyć\
  \ się niepowodzeniem dla validation, a nie składni.\n\nSprawdź obserwowany wynik:\n\n- Każde polecenie ma\
  \ zakończyć się błędem z komunikatem `departures must be an integer from 1 to 6`.\n\n  ```sh\n  tofu plan\
  \ -input=false -no-color -var=departures=0\n  tofu plan -input=false -no-color -var=departures=7\n  tofu\
  \ plan -input=false -no-color -var=departures=2.5\n  ```\n\n- Oczekiwane: rozkład zawiera `3`, a wynik jest\
  \ liczbą `3`.\n\n  ```sh\n  cat timetable.txt\n  tofu output -json departures\n  ```\n\n- `tofu plan -input=false\
  \ -detailed-exitcode -no-color` — Oczekiwane: brak zmian i kod zakończenia `0`."
phrases.0: Sprawdziłem obsługiwany zakres wejściowy na granicy modułu.
phrases.1: Przed zaakceptowaniem normalnej konfiguracji przetestowałem odrzucone wartości.
phrases.2: Sprawdziłem wyrenderowany harmonogram i pusty normalny plan.
diagnostics.probe_0_0: 'Bieżące dane nie pozwalają potwierdzić tego celu: Plany dla wartości `departures` `0`, `7`
  lub `2.5` są odrzucane i zawierają komunikat `departures must be an integer from 1 to 6`.'
