title: Validierung
brief: 'Fügen Sie einen variablen validation-Vertrag hinzu: departures muss eine ganze Zahl von 1 bis
  einschließlich 6 sein. Bewahren Sie die mitgelieferten 3 auf und wenden Sie sie an. Beweisen Sie, dass
  plan 0, 7 und 2.5 mit der genauen Diagnose zurückweist. departures muss eine Ganzzahl von 1 bis 6 sein.


  Questdateien in `~/quest` (einige erscheinen in späteren Phasen): `main.tf`, `terraform.tfvars`.


  Der Schacht verfügt über kein Internet oder externes DNS. Verwenden Sie nur bereitgestellte Dateien,
  vorinstallierte Bilder und private Dienste. Ändern Sie nur diese Bucht.


  Anfängliche Erfolgskriterien: Timetable enthält 3, unsichere Werte schlagen fehl, validation und das
  normale plan ist leer.'
debrief: Typ und validation schützen verschiedene Teile des Eingabevertrags. Negative Pläne übten die
  Wache aus, ohne unsichere Eingaben zu machen.
stages.0.brief: 'Erfolgskriterien: Timetable enthält 3, unsichere Werte schlagen fehl, validation und
  das normale plan ist leer.'
stages.0.objectives.0.text: Timetable enthält 3, unsichere Werte schlagen fehl, validation und der normale
  plan ist leer.
hints.0.text: Nur ein numerischer Typ akzeptiert Brüche.
hints.1.text: Kombinieren Sie Bereichsgrenzen mit einem ganzzahligen Prädikat.
hints.2.text: Ein negativer Wert plan muss für validation fehlschlagen, nicht für die Syntax.
phrases.0: Ich habe den unterstützten Eingabebereich an der Modulgrenze validiert.
phrases.1: Ich habe abgelehnte Werte getestet, bevor ich die normale Konfiguration akzeptiert habe.
phrases.2: Ich habe den gerenderten Zeitplan und einen leeren normalen plan überprüft.
