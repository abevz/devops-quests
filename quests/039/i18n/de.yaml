title: Validierung
brief: "Der Fahrplan darf nur gültige Abfahrtsanzahlen akzeptieren. Behalten Sie die vorgegebene Anzahl bei;\
  \ ungültige Anfragen müssen eindeutig scheitern.\n\nArbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte\
  \ Eingabedateien: `main.tf`, `terraform.tfvars`.\n\n**Anforderungen:**\n- Pläne weisen diese `departures`-Werte\
  \ mit der exakten Meldung `departures must be an integer from 1 to 6` zurück:\n  - `0`, `7`, `2.5`\n- Dateien\
  \ in `~/quest` auf der Workstation:\n  - `timetable.txt`: `3`\n- Die Ausgabe `departures` liefert die Zahl\
  \ `3`.\n- Ein detaillierter Plan meldet keine ausstehenden Infrastrukturänderungen und endet mit Code `0`.\n"
debrief: Typ und validation schützen verschiedene Teile des Eingabevertrags. Negative Pläne übten die Wache
  aus, ohne unsichere Eingaben zu machen.
stages.0.brief: Behalten Sie den gültigen Fahrplan bei und weisen Sie ungültige Abfahrtsanzahlen mit der geforderten
  Meldung zurück.
stages.0.objectives.0.text: Plans mit den Werten `0`, `7` oder `2.5` für `departures` werden abgelehnt und
  enthalten die Meldung `departures must be an integer from 1 to 6`.
stages.0.objectives.1.text: '`timetable.txt` enthält `3`.'
stages.0.objectives.2.text: Output `departures` liefert die Zahl `3`.
stages.0.objectives.3.text: OpenTofu meldet keine ausstehenden Infrastrukturänderungen.
hints.0.text: Nur ein numerischer Typ akzeptiert Brüche.
hints.1.text: 'Prüfen Sie die mitgelieferten Eingaben und den aktuellen verwalteten Zustand:


  ```sh

  cat main.tf terraform.tfvars

  ```'
hints.2.text: "Kombinieren Sie Bereichsgrenzen mit einem ganzzahligen Prädikat.\n\nEin negativer Wert plan\
  \ muss für validation fehlschlagen, nicht für die Syntax.\n\nPrüfen Sie das beobachtete Ergebnis:\n\n- Jeder\
  \ Befehl muss mit `departures must be an integer from 1 to 6` scheitern.\n\n  ```sh\n  tofu plan -input=false\
  \ -no-color -var=departures=0\n  tofu plan -input=false -no-color -var=departures=7\n  tofu plan -input=false\
  \ -no-color -var=departures=2.5\n  ```\n\n- Erwartet: Der Fahrplan enthält `3` und die Ausgabe ist die Zahl\
  \ `3`.\n\n  ```sh\n  cat timetable.txt\n  tofu output -json departures\n  ```\n\n- `tofu plan -input=false\
  \ -detailed-exitcode -no-color` — Erwartet: keine Änderungen, Exit-Code `0`."
phrases.0: Ich habe den unterstützten Eingabebereich an der Modulgrenze validiert.
phrases.1: Ich habe abgelehnte Werte getestet, bevor ich die normale Konfiguration akzeptiert habe.
phrases.2: Ich habe den gerenderten Zeitplan und einen leeren normalen plan überprüft.
diagnostics.probe_0_0: 'Mit den aktuellen Eingaben konnte dieses Ziel nicht geprüft werden: Plans mit den Werten
  `0`, `7` oder `2.5` für `departures` werden abgelehnt und enthalten die Meldung `departures must be an integer
  from 1 to 6`.'
