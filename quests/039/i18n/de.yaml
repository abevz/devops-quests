title: Validierung
brief: |
  Der Fahrplan darf nur gültige Abfahrtsanzahlen akzeptieren. Behalten Sie die vorgegebene Anzahl bei; ungültige Anfragen müssen eindeutig scheitern.

  Arbeiten Sie in `~/quest` auf der Workstation. Bereitgestellte Eingabedateien: `main.tf`, `terraform.tfvars`.

  **Anforderungen:**
  - Pläne weisen diese `departures`-Werte mit der exakten Meldung `departures must be an integer from 1 to 6` zurück:
    - `0`, `7`, `2.5`
  - Dateien in `~/quest` auf der Workstation:
    - `timetable.txt`: `3`
  - Die Ausgabe `departures` liefert die Zahl `3`.
  - `tofu plan` endet mit Code `0` und meldet keine Änderungen.

  **Vor Check & finish selbst prüfen:**
  Führen Sie diese Beobachtungsbefehle in `~/quest` auf der Workstation aus.
  - Jeder Befehl muss mit `departures must be an integer from 1 to 6` scheitern.

    ```sh
    tofu plan -input=false -no-color -var=departures=0
    tofu plan -input=false -no-color -var=departures=7
    tofu plan -input=false -no-color -var=departures=2.5
    ```
  - Erwartet: Der Fahrplan enthält `3` und die Ausgabe ist die Zahl `3`.

    ```sh
    cat timetable.txt
    tofu output -json departures
    ```
  - `tofu plan -input=false -detailed-exitcode -no-color` — Erwartet: keine Änderungen, Exit-Code `0`.
debrief: Typ und validation schützen verschiedene Teile des Eingabevertrags. Negative Pläne übten die
  Wache aus, ohne unsichere Eingaben zu machen.
stages.0.brief: |
  Behalten Sie den gültigen Fahrplan bei und weisen Sie ungültige Abfahrtsanzahlen mit der geforderten Meldung zurück.
stages.0.objectives.0.text: Plans mit den Werten `0`, `7` oder `2.5` für `departures` werden abgelehnt
  und enthalten die Meldung `departures must be an integer from 1 to 6`.
stages.0.objectives.1.text: '`timetable.txt` enthält `3`.'
stages.0.objectives.2.text: Output `departures` liefert die Zahl `3`.
stages.0.objectives.3.text: '`tofu plan` endet mit Exit-Code 0 ohne Änderungen.'
hints.0.text: Nur ein numerischer Typ akzeptiert Brüche.
hints.1.text: Kombinieren Sie Bereichsgrenzen mit einem ganzzahligen Prädikat.
hints.2.text: Ein negativer Wert plan muss für validation fehlschlagen, nicht für die Syntax.
phrases.0: Ich habe den unterstützten Eingabebereich an der Modulgrenze validiert.
phrases.1: Ich habe abgelehnte Werte getestet, bevor ich die normale Konfiguration akzeptiert habe.
phrases.2: Ich habe den gerenderten Zeitplan und einen leeren normalen plan überprüft.
